<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Neon Glows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Ambient background light pools (Busy atmosphere) -->
  <circle cx="60" cy="120" r="50" fill="#f59e0b" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="180" cy="100" r="60" fill="#ec4899" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="120" cy="160" r="50" fill="#38bdf8" opacity="0.1" filter="url(#softGlow)"/>

  <!-- BACKGROUND BUILDINGS & SHOPFRONTS -->
  <!-- Left Building -->
  <path d="M10 220 L10 70 L75 85 L75 220 Z" fill="#1e293b"/>
  <!-- Right Building -->
  <path d="M165 220 L165 60 L230 75 L230 220 Z" fill="#1e293b"/>
  <!-- Center/Back Building -->
  <rect x="70" y="50" width="100" height="170" fill="#0f172a"/>

  <!-- Architectural Windows & Details -->
  <!-- Back building windows -->
  <rect x="85" y="70" width="20" height="30" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="110" y="70" width="20" height="30" rx="4" fill="#f59e0b" opacity="0.8"/>
  <rect x="135" y="70" width="20" height="30" rx="4" fill="#334155" opacity="0.6"/>
  
  <rect x="85" y="115" width="20" height="30" rx="4" fill="#ec4899" opacity="0.7"/>
  <rect x="110" y="115" width="20" height="30" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="135" y="115" width="20" height="30" rx="4" fill="#38bdf8" opacity="0.7"/>

  <!-- Glowing Storefronts at Street Level -->
  <!-- Left Shop: Noodle/Food Stall -->
  <path d="M15 220 L15 150 L75 155 L75 220 Z" fill="#334155"/>
  <rect x="22" y="160" width="46" height="35" rx="6" fill="#fb923c" opacity="0.9" filter="url(#neonGlow)"/>
  <!-- Awning -->
  <path d="M12 150 Q45 140 78 150 L70 160 L20 160 Z" fill="#ef4444"/>
  <path d="M12 150 Q45 140 78 150 L78 155 Q45 145 12 155 Z" fill="#b91c1c"/>

  <!-- Right Shop: Cafe / Bistro -->
  <path d="M165 220 L165 145 L225 155 L225 220 Z" fill="#334155"/>
  <rect x="172" y="160" width="46" height="40" rx="6" fill="#38bdf8" opacity="0.8" filter="url(#neonGlow)"/>
  <!-- Awning -->
  <path d="M162 145 Q195 135 228 145 L220 155 L170 155 Z" fill="#10b981"/>

  <!-- STREET LANTERNS & STRING LIGHTS (Nàorè - Bustling/Vibrant) -->
  <!-- Overhead string lights -->
  <path d="M10 60 Q 60 90 120 70 Q 180 90 230 65" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <!-- Light bulbs -->
  <circle cx="35" cy="72" r="3" fill="#fbbf24" filter="url(#neonGlow)"/>
  <circle cx="70" cy="80" r="3" fill="#f43f5e" filter="url(#neonGlow)"/>
  <circle cx="105" cy="74" r="3" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="140" cy="74" r="3" fill="#fbbf24" filter="url(#neonGlow)"/>
  <circle cx="175" cy="79" r="3" fill="#10b981" filter="url(#neonGlow)"/>
  <circle cx="205" cy="70" r="3" fill="#ec4899" filter="url(#neonGlow)"/>

  <!-- Traditional Red Lanterns -->
  <g transform="translate(45, 95)">
    <line x1="0" y1="-15" x2="0" y2="0" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="12" ry="10" fill="#ef4444" filter="url(#neonGlow)"/>
    <path d="M-8 6 Q0 3 8 6" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    <path d="M-8 14 Q0 17 8 14" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="20" x2="0" y2="26" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <g transform="translate(195, 90)">
    <line x1="0" y1="-15" x2="0" y2="0" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="12" ry="10" fill="#ef4444" filter="url(#neonGlow)"/>
    <path d="M-8 6 Q0 3 8 6" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    <path d="M-8 14 Q0 17 8 14" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="20" x2="0" y2="26" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- STREET FLOOR / PAVEMENT -->
  <!-- Road surface perspective -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#0f172a"/>
  <!-- Sidewalk Left -->
  <path d="M0 200 L80 180 L80 240 L0 240 Z" fill="#475569"/>
  <line x1="0" y1="200" x2="80" y2="180" stroke="#64748b" stroke-width="2"/>
  <!-- Sidewalk Right -->
  <path d="M240 200 L160 180 L160 240 L240 240 Z" fill="#475569"/>
  <line x1="240" y1="200" x2="160" y2="180" stroke="#64748b" stroke-width="2"/>
  <!-- Street Asphalt Center -->
  <path d="M80 180 L160 180 L240 240 L0 240 Z" fill="#1e293b"/>
  <!-- Road center markings (Dashed yellow lines) -->
  <polygon points="118,185 122,185 125,200 115,200" fill="#fbbf24" opacity="0.8"/>
  <polygon points="116,210 124,210 128,235 112,235" fill="#fbbf24" opacity="0.8"/>

  <!-- VIBRANT CHARACTERS (Nàorè - Bustling/Lively Activity) -->
  <!-- Character 1: Walking & chatting (Left foreground) -->
  <g transform="translate(60, 185)">
    <!-- Shadow -->
    <ellipse cx="0" cy="35" rx="12" ry="4" fill="#000" opacity="0.4"/>
    <!-- Body / Jacket -->
    <path d="M-8 10 L-12 28 L-4 32 L2 28 L6 12 Z" fill="#38bdf8"/>
    <!-- Head & Hair -->
    <circle cx="0" cy="0" r="9" fill="#fbcfe8"/>
    <path d="M-9 -2 Q0 -12 9 -4 Q6 -12 0 -11 Q-6 -12 -9 -2 Z" fill="#0f172a"/>
    <!-- Legs in motion -->
    <line x1="-4" y1="28" x2="-8" y2="38" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="2" y1="28" x2="6" y2="36" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M-8 14 L-15 22" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M6 14 L14 20" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Character 2: Friend walking alongside (Slightly behind/center-left) -->
  <g transform="translate(95, 195)">
    <!-- Shadow -->
    <ellipse cx="0" cy="30" rx="10" ry="3" fill="#000" opacity="0.4"/>
    <!-- Body / Orange Sweater -->
    <path d="M-6 8 L-10 24 L-2 26 L4 24 L8 10 Z" fill="#fb923c"/>
    <!-- Head & Hair -->
    <circle cx="0" cy="-2" r="8" fill="#fed7aa"/>
    <circle cx="0" cy="-6" r="8" fill="#78350f"/>
    <!-- Legs -->
    <line x1="-3" y1="24" x2="-5" y2="33" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="3" y1="24" x2="5" y2="31" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- Arms holding bubble tea / shopping -->
    <path d="M-6 12 L-12 18" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M6 12 L12 16" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bubble tea cup prop -->
    <rect x="10" y="14" width="5" height="7" rx="1" fill="#f8fafc" opacity="0.9"/>
    <line x1="12" y1="14" x2="14" y2="10" stroke="#ec4899" stroke-width="1.5"/>
  </g>

  <!-- Character 3: Street vendor / holding items (Right foreground) -->
  <g transform="translate(170, 190)">
    <!-- Shadow -->
    <ellipse cx="0" cy="33" rx="12" ry="4" fill="#000" opacity="0.4"/>
    <!-- Body / Purple Hoodie -->
    <path d="M-8 10 L-13 28 L-3 30 L4 28 L9 10 Z" fill="#a855f7"/>
    <!-- Head & Cap -->
    <circle cx="0" cy="-1" r="9" fill="#fde047"/>
    <path d="M-10 -4 L10 -4 L8 -9 L-8 -9 Z" fill="#ec4899"/>
    <path d="M5 -5 L14 -3 L12 -1 Z" fill="#ec4899"/> <!-- Cap brim -->
    <!-- Legs -->
    <line x1="-4" y1="28" x2="-2" y2="37" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="3" y1="28" x2="7" y2="36" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Gesturing arm -->
    <path d="M8 14 L16 12" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8 14 L-14 18" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric Details (Flying confetti/sparkles for lively vibe) -->
  <circle cx="130" cy="130" r="2" fill="#fbbf24" filter="url(#neonGlow)"/>
  <circle cx="75" cy="150" r="1.5" fill="#ec4899" filter="url(#neonGlow)"/>
  <circle cx="155" cy="140" r="2" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="105" cy="170" r="1.5" fill="#10b981" filter="url(#neonGlow)"/>

  <!-- Scooter / Delivery bike (Context prop adding to bustling street life) -->
  <g transform="translate(135, 205)">
    <!-- Scooter body -->
    <path d="M-12 5 L12 5 L15 15 L-15 15 Z" fill="#ef4444"/>
    <circle cx="-10" cy="16" r="5" fill="#0f172a"/>
    <circle cx="10" cy="16" r="5" fill="#0f172a"/>
    <!-- Handlebar & headlight -->
    <path d="M8 5 L12 -2" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="12" cy="-2" r="3" fill="#fde047" filter="url(#neonGlow)"/>
    <!-- Delivery Box on back -->
    <rect x="-14" y="-3" width="10" height="9" rx="2" fill="#38bdf8"/>
  </g>

</svg>