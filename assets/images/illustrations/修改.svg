<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment & Ambient Glow -->
  <circle cx="150" cy="80" r="90" fill="url(#lamp-glow)"/>
  
  <!-- Bookshelf / Window backdrop hints -->
  <rect x="25" y="30" width="40" height="55" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="70" y="35" width="20" height="50" rx="3" fill="#475569" opacity="0.3"/>
  <rect x="20" y="85" width="200" height="4" rx="2" fill="#475569" opacity="0.5"/>

  <!-- Houseplant for context -->
  <path d="M190,85 Q195,70 205,65 Q215,75 210,85 Z" fill="#10b981"/>
  <path d="M185,85 Q175,70 170,75 Q165,85 180,85 Z" fill="#34d399"/>
  <rect x="190" y="85" width="20" height="25" rx="4" fill="#cbd5e1"/>

  <!-- Desk Surface -->
  <path d="M10,185 L230,185 L220,210 L20,210 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="15" y="180" width="210" height="8" rx="3" fill="#475569"/>

  <!-- Laptop Setup -->
  <!-- Laptop Base -->
  <path d="M70,185 L170,185 L185,160 L55,160 Z" fill="#94a3b8"/>
  <path d="M60,185 L180,185 L183,180 L57,180 Z" fill="#cbd5e1"/>
  <!-- Laptop Screen -->
  <rect x="75" y="95" width="90" height="68" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  <rect x="80" y="100" width="80" height="58" rx="3" fill="url(#screen-glow)"/>
  <!-- Abstract lines representing document editing on screen -->
  <rect x="88" y="108" width="50" height="6" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="88" y="120" width="64" height="4" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="88" y="130" width="40" height="4" rx="2" fill="#f43f5e" opacity="0.8"/> <!-- Editing highlight/strikethrough concept -->
  <rect x="88" y="140" width="55" height="4" rx="2" fill="#34d399" opacity="0.8"/> <!-- Correction concept -->

  <!-- Physical Manuscript / Paper Document with Red Marks (修改 concept) -->
  <g transform="translate(35, 135) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="60" height="75" rx="3" fill="#f8fafc"/>
    <!-- Text lines -->
    <line x1="8" y1="12" x2="35" y2="12" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="50" y2="22" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="32" x2="42" y2="32" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="42" x2="48" y2="42" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="52" x2="30" y2="52" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Red editing marks (Modifications / Corrections) -->
    <path d="M 12 32 Q 25 24 38 32" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 40 40 L 48 48 M 48 40 L 40 48" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="20" cy="52" r="5" fill="none" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="180" y="150" width="22" height="26" rx="4" fill="#f1f5f9" filter="url(#shadow)"/>
  <path d="M202,156 C208,156 208,170 202,170" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
  <!-- Steam rising -->
  <path d="M187,140 Q190,132 185,124" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M195,142 Q198,134 193,126" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Character: Focused Editor / Student modifying the document -->
  <!-- Character Body / Torso -->
  <path d="M110,210 C110,180 130,175 145,175 C160,175 180,180 180,210 Z" fill="#4f46e5" filter="url(#shadow)"/>
  
  <!-- Neck & Head -->
  <rect x="133" y="130" width="18" height="25" rx="6" fill="#fed7aa"/>
  <circle cx="142" cy="118" r="24" fill="#fed7aa" filter="url(#shadow)"/>
  
  <!-- Hair (Stylish modern cut) -->
  <path d="M118,115 C118,98 130,94 145,94 C162,94 168,105 168,122 L168,128 C155,124 135,124 120,128 Z" fill="#334155"/>
  <path d="M123,105 Q135,98 152,102" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <!-- Facial expression: Concentrated, thoughtful -->
  <!-- Glasses -->
  <circle cx="134" cy="116" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="152" cy="116" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="140" y1="116" x2="146" y2="116" stroke="#0f172a" stroke-width="2"/>
  <!-- Focused eyes behind glasses -->
  <circle cx="134" cy="116" r="1.5" fill="#0f172a"/>
  <circle cx="152" cy="116" r="1.5" fill="#0f172a"/>
  <!-- Eyebrows furrowed slightly in concentration -->
  <path d="M128,110 Q134,107 138,111" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M148,111 Q152,107 158,110" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth (slight determined line) -->
  <path d="M138,128 Q143,131 148,128" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms actively writing/modifying -->
  <!-- Right arm holding red pen -->
  <path d="M165,185 C165,160 155,155 145,150" fill="none" stroke="#4f46e5" stroke-width="14" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="138" cy="148" r="6" fill="#fed7aa"/>
  <!-- Red Pen -->
  <line x1="138" y1="148" x2="115" y2="158" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="115" y1="158" x2="110" y2="160" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>

  <!-- Left arm resting on desk -->
  <path d="M120,190 C110,180 110,165 125,158" fill="none" stroke="#4f46e5" stroke-width="14" stroke-linecap="round"/>
  <circle cx="125" cy="155" r="5.5" fill="#fed7aa"/>

  <!-- Desk Lamp fixture (Top right) -->
  <path d="M210,30 L180,60" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M180,60 L160,85" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M150,80 L170,105 L185,90 Z" fill="#f59e0b" filter="url(#shadow)"/>
</svg>