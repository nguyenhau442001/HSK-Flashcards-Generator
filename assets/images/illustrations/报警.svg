<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Lamp Glow -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Background Elements (City Street) -->
  <rect x="20" y="180" width="200" height="60" fill="#334155" rx="4"/>
  <rect x="40" y="140" width="30" height="40" fill="#475569"/>
  <rect x="170" y="140" width="30" height="40" fill="#475569"/>
  
  <!-- Character 1 (Victim) -->
  <g transform="translate(60, 100)">
    <path d="M20 120 L20 80 Q20 60 40 60 L60 60 Q80 60 80 80 L80 120" fill="#ec4899"/>
    <circle cx="50" cy="40" r="20" fill="#fde68a"/>
    <path d="M40 35 L45 40 M55 35 L60 40" stroke="#1e293b" stroke-width="2"/>
    <path d="M45 50 Q50 55 55 50" stroke="#1e293b" stroke-width="2"/>
    <!-- Empty Bag -->
    <rect x="5" y="80" width="15" height="20" fill="#94a3b8" rx="2"/>
    <path d="M5 80 L20 80" stroke="#64748b" stroke-width="2"/>
  </g>
  
  <!-- Character 2 (Helper) -->
  <g transform="translate(130, 100)">
    <path d="M20 120 L20 80 Q20 60 40 60 L60 60 Q80 60 80 80 L80 120" fill="#38bdf8"/>
    <circle cx="50" cy="40" r="20" fill="#fde68a"/>
    <path d="M40 35 L45 40 M55 35 L60 40" stroke="#1e293b" stroke-width="2"/>
    <path d="M45 50 Q50 55 55 50" stroke="#1e293b" stroke-width="2"/>
    <!-- Phone -->
    <rect x="70" y="70" width="15" height="25" fill="#fb923c" rx="3"/>
    <path d="M75 75 L80 85" stroke="#fff" stroke-width="1"/>
  </g>
  
  <!-- Action Lines -->
  <path d="M110 80 Q120 70 130 80" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <path d="M115 75 Q125 65 135 75" stroke="#fbbf24" stroke-width="2" fill="none"/>
</svg>