<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Stage/Platform Structure -->
  <path d="M40 190 L200 190 L215 210 L25 210 Z" fill="#334155"/>
  <path d="M40 190 L200 190 L190 180 L50 180 Z" fill="#475569"/>
  
  <!-- Spotlight Glow -->
  <path d="M120 20 L180 190 L60 190 Z" fill="#f59e0b" opacity="0.15"/>
  
  <!-- Character -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-15 80 Q-15 40 0 40 T15 80" fill="#38bdf8"/>
    <!-- Arms (Gesturing) -->
    <path d="M-15 50 L-35 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M15 50 L35 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="15" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-12 25 Q0 10 12 25" fill="#78350f"/>
  </g>
  
  <!-- Floating Creative Elements (Talent manifestation) -->
  <circle cx="70" cy="80" r="6" fill="#10b981"/>
  <path d="M170 70 L180 60 L190 70 L180 80 Z" fill="#ec4899"/>
  <path d="M160 120 L165 110 L170 120 Z" fill="#fb923c"/>
  
  <!-- Decorative Stage Lights -->
  <circle cx="50" cy="200" r="4" fill="#fbbf24"/>
  <circle cx="190" cy="200" r="4" fill="#fbbf24"/>
  
  <!-- Background subtle lines -->
  <path d="M20 50 L220 50" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M20 100 L220 100" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
</svg>