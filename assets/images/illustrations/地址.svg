<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Decorative Background Glow/Elements -->
  <circle cx="100" cy="100" r="60" fill="#334155" opacity="0.3"/>

  <!-- Envelope Body (Back) -->
  <path d="M 50 80 L 100 115 L 150 80 L 150 135 C 150 140 145 145 140 145 L 60 145 C 55 145 50 140 50 135 Z" fill="#38bdf8"/>

  <!-- Envelope Flap (Open/Back fold) -->
  <path d="M 50 80 L 100 50 L 150 80 Z" fill="#0ea5e9"/>

  <!-- Envelope Front Pocket -->
  <path d="M 50 85 L 100 120 L 150 85 L 150 135 C 150 140 145 145 140 145 L 60 145 C 55 145 50 140 50 135 Z" fill="#7dd3fc"/>

  <!-- Letter Inserted with Address Lines -->
  <rect x="70" y="45" width="60" height="70" rx="4" fill="#f8fafc"/>
  <rect x="80" y="65" width="40" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="80" y="75" width="30" height="4" rx="2" fill="#cbd5e1"/>

  <!-- Map Pin / Location Marker (Anchoring the 'Address' concept) -->
  <g transform="translate(0, -5)">
    <!-- Pin shadow -->
    <ellipse cx="100" cy="148" rx="8" ry="3" fill="#0f172a" opacity="0.4"/>
    
    <!-- Pin head -->
    <path d="M 100 100 C 90 100 82 108 82 118 C 82 130 100 145 100 145 C 100 145 118 130 118 118 C 118 108 110 100 100 100 Z" fill="#f43f5e"/>
    
    <!-- Pin inner dot -->
    <circle cx="100" cy="117" r="4" fill="#ffe4e6"/>
  </g>

  <!-- Floating accent sparkles -->
  <circle cx="45" cy="65" r="3" fill="#f59e0b"/>
  <circle cx="155" cy="120" r="2" fill="#10b981"/>
  <circle cx="135" cy="45" r="2.5" fill="#f59e0b"/>
</svg>