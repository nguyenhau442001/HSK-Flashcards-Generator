<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>
  
  <!-- Subtle decorative background grid/dots -->
  <circle cx="50" cy="50" r="2" fill="#334155" opacity="0.6"/>
  <circle cx="150" cy="50" r="2" fill="#334155" opacity="0.6"/>
  <circle cx="50" cy="150" r="2" fill="#334155" opacity="0.6"/>
  <circle cx="150" cy="150" r="2" fill="#334155" opacity="0.6"/>

  <!-- Visual Metaphor for "Biểu thị / Thể hiện" (Expression / Output / Projection) -->
  <!-- Radiating waves of expression (Top-Right) -->
  <path d="M 125 75 A 35 35 0 0 1 125 125" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M 138 62 A 53 53 0 0 1 138 138" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Core projecting light/signal beam (Gradient overlay via opacity & shapes) -->
  <polygon points="75,100 135,65 135,135" fill="url(#beamGrad)" opacity="0.15"/>
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Central Source / Inner Node (Expression Origin) -->
  <circle cx="75" cy="100" r="22" fill="#0f172a" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="75" cy="100" r="8" fill="#f59e0b"/>

  <!-- Outer Display Frame (Representing the "Display / Screen / Manifestation") -->
  <path d="M 120 55 L 140 55 C 148 55, 154 61, 154 69 L 154 131 C 154 139, 148 145, 140 145 L 120 145" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Floating dynamic accent element (Emanating action) -->
  <circle cx="137" cy="100" r="5" fill="#38bdf8"/>
</svg>