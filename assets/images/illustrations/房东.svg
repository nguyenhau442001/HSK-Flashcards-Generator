<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Key Glow -->
    <radialGradient id="keyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Plant Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Door/Frame Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Apartment Corridor) -->
  <!-- Wall panels/decor -->
  <path d="M20 30 H220 V210 H20 Z" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="40" y="50" width="40" height="60" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="160" y="50" width="40" height="60" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <!-- Warm Hallway Light Spill -->
  <path d="M120 190 L60 230 H180 Z" fill="#f59e0b" opacity="0.05"/>

  <!-- Floor -->
  <path d="M0 195 L240 195 L240 240 L0 240 Z" fill="#0f172a"/>
  <line x1="0" y1="195" x2="240" y2="195" stroke="#475569" stroke-width="2"/>

  <!-- Potted Plant on Floor (Contextual Prop) -->
  <path d="M195 165 L215 165 L210 195 L200 195 Z" fill="#64748b"/>
  <ellipse cx="205" cy="165" rx="10" ry="3" fill="#475569"/>
  <!-- Leaves -->
  <path d="M205 162 Q190 140 185 130 Q200 145 205 162 Z" fill="url(#leafGrad)"/>
  <path d="M205 162 Q220 135 225 120 Q215 145 205 162 Z" fill="url(#leafGrad)"/>
  <path d="M205 162 Q205 130 205 115 Q205 130 205 162 Z" fill="#10b981"/>

  <!-- MAIN CHARACTER: Landlord (房东) - Friendly, Welcoming, Holding Keys & Lease/Clipboard -->
  <g transform="translate(15, 10)">
    <!-- Drop Shadow for Character -->
    <ellipse cx="105" cy="190" rx="35" ry="8" fill="#020617" opacity="0.6"/>

    <!-- Body / Suit Jacket (Professional yet friendly landlord look) -->
    <path d="M85 110 L125 110 L135 175 L75 175 Z" fill="#1e3a8a"/> <!-- Inner shirt/vest -->
    <path d="M75 110 L105 145 L135 110 L145 180 C145 185 140 190 135 190 L75 190 C70 190 65 185 65 180 Z" fill="#1e293b"/> <!-- Outer Jacket -->
    
    <!-- Lapels -->
    <path d="M95 110 L105 135 L85 160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M115 110 L105 135 L125 160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Shirt & Tie -->
    <polygon points="105,110 100,135 110,135" fill="#f8fafc"/>
    <polygon points="103,135 107,135 109,165 105,175 101,165" fill="#f43f5e"/>

    <!-- Neck -->
    <rect x="97" y="95" width="16" height="20" rx="6" fill="#fbcfe8"/>

    <!-- Head -->
    <ellipse cx="105" cy="75" rx="22" ry="25" fill="#fbcfe8"/>

    <!-- Friendly Face Features -->
    <!-- Smiling Eyes (Happy/Welcoming) -->
    <path d="M93 72 Q97 67 101 72" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M109 72 Q113 67 117 72" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="92" cy="78" r="4" fill="#fda4af" opacity="0.6"/>
    <circle cx="118" cy="78" r="4" fill="#fda4af" opacity="0.6"/>

    <!-- Big Warm Smile -->
    <path d="M98 83 Q105 91 112 83" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Friendly Hair (Neat, mature style with warm brown tone) -->
    <path d="M83 75 C83 55 127 55 127 75 C127 78 125 72 122 68 C115 58 95 58 88 68 C85 72 83 75 83 75 Z" fill="#78350f"/>
    <!-- Glasses (Intellectual, trustworthy landlord vibe) -->
    <rect x="89" y="65" width="13" height="10" rx="2" fill="none" stroke="#d97706" stroke-width="2"/>
    <rect x="108" y="65" width="13" height="10" rx="2" fill="none" stroke="#d97706" stroke-width="2"/>
    <line x1="102" y1="70" x2="108" y2="70" stroke="#d97706" stroke-width="2"/>

    <!-- Left Arm & Hand holding Clipboard (Lease agreement) -->
    <path d="M75 125 L55 150 L65 160 L80 140 Z" fill="#1e293b"/>
    <circle cx="58" cy="157" r="6" fill="#fbcfe8"/> <!-- Hand -->
    
    <!-- Clipboard / Contract -->
    <rect x="40" y="140" width="30" height="40" rx="3" fill="#cbd5e1" transform="rotate(-15 55 160)"/>
    <rect x="45" y="145" width="20" height="30" rx="1" fill="#ffffff" transform="rotate(-15 55 160)"/>
    <line x1="48" y1="152" x2="58" y2="149" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="158" x2="60" y2="155" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="164" x2="55" y2="162" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Clip -->
    <rect x="50" y="138" width="10" height="5" rx="1" fill="#f59e0b" transform="rotate(-15 55 160)"/>

    <!-- Right Arm & Hand presenting Golden Keys -->
    <path d="M135 125 L155 145 L145 155 L130 135" fill="#1e293b"/>
    <circle cx="158" cy="148" r="6" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Key Ring & Golden Keys (Symbol of property/handing over apartment) -->
    <circle cx="168" cy="142" r="12" fill="none" stroke="url(#keyGlow)" stroke-width="8"/>
    <circle cx="168" cy="142" r="8" fill="none" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Key 1 -->
    <path d="M174 148 L190 164" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="191" cy="165" r="3" fill="#fbbf24"/>
    <path d="M185 157 L188 154" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M187 161 L190 158" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Key 2 -->
    <path d="M172 152 L182 172" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="183" cy="173" r="2.5" fill="#f59e0b"/>

  </g>

  <!-- Foreground Atmospheric Highlight / Vignette Frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>