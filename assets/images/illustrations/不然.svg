<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Clock Glow -->
    <radialGradient id="clock-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Action Motion Lines Gradient -->
    <linearGradient id="motion-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Wall & Floor -->
  <path d="M0 0 H240 V180 H0 Z" fill="#1e293b"/>
  <path d="M0 180 H240 V240 H0 Z" fill="url(#floor-grad)"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>

  <!-- Background Environment: Doorway / Exit urgency -->
  <rect x="170" y="80" width="45" height="100" rx="4" fill="#0f172a"/>
  <path d="M170 80 L192 65 L215 80" fill="#334155"/>
  <!-- Exit sign glowing -->
  <rect x="182" y="90" width="21" height="10" rx="2" fill="#10b981"/>
  <rect x="185" y="93" width="15" height="4" rx="1" fill="#ecfdf5"/>

  <!-- Wall Clock (Crucial for "Otherwise/Late" context) -->
  <circle cx="120" cy="55" r="26" fill="#334155"/>
  <circle cx="120" cy="55" r="22" fill="#f8fafc"/>
  <circle cx="120" cy="55" r="22" fill="url(#clock-glow)"/>
  <!-- Clock hands pointing urgently near 12 -->
  <line x1="120" y1="55" x2="120" y2="40" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="55" x2="132" y2="50" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="55" r="2.5" stroke="#ef4444" stroke-width="1.5" fill="#f8fafc"/>
  <!-- Clock Ticks -->
  <line x1="120" y1="35" x2="120" y2="37" stroke="#64748b" stroke-width="1.5"/>
  <line x1="120" y1="73" x2="120" y2="75" stroke="#64748b" stroke-width="1.5"/>
  <line x1="100" y1="55" x2="102" y2="55" stroke="#64748b" stroke-width="1.5"/>
  <line x1="138" y1="55" x2="140" y2="55" stroke="#64748b" stroke-width="1.5"/>

  <!-- Motion Trails / Speed lines representing urgency ("Otherwise...") -->
  <path d="M20 120 C 40 120, 50 110, 70 110" stroke="url(#motion-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M30 145 C 50 145, 65 135, 85 135" stroke="url(#motion-grad)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M10 170 C 30 170, 45 160, 60 160" stroke="url(#motion-grad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Dropped/Flying Prop: Briefcase or Bag representing rushing -->
  <g transform="translate(45, 155) rotate(-15)">
    <rect x="0" y="0" width="18" height="12" rx="2" fill="#d97706"/>
    <path d="M4 0 V-3 C 4 -4, 5 -4, 6 -4 H 12 C 13 -4, 14 -4, 14 -3 V 0" fill="none" stroke="#b45309" stroke-width="1.5"/>
  </g>

  <!-- MAIN CHARACTER RUSHING (Action pose for "otherwise/hurry up") -->
  <!-- Back Leg (Stepping forward fast) -->
  <path d="M95 150 L80 185 L95 190" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M95 150 L80 185 L95 190" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoe Back -->
  <ellipse cx="98" cy="190" rx="7" ry="4" fill="#0f172a"/>

  <!-- Torso leaning forward -->
  <g transform="translate(100, 135) rotate(20)">
    <!-- Body / Jacket -->
    <path d="M-12 -15 C -12 -25, 12 -25, 12 -15 L 15 15 C 15 20, -15 20, -15 15 Z" fill="#6366f1"/>
    <!-- Collar / Shirt -->
    <path d="M-5 -22 L 0 -15 L 5 -22" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Backpack -->
    <path d="M-18 -20 C -25 -20, -25 5, -18 10 Z" fill="#f59e0b"/>
  </g>

  <!-- Front Leg (Reaching forward dynamically) -->
  <path d="M110 150 L125 180 L140 175" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M110 150 L125 180 L140 175" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoe Front -->
  <ellipse cx="144" cy="174" rx="8" ry="4" transform="rotate(-15 144 174)" fill="#0f172a"/>

  <!-- Arms in motion -->
  <!-- Back arm swinging back -->
  <path d="M95 125 L75 140" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="73" cy="141" r="3" fill="#f472b6"/> <!-- Hand -->

  <!-- Front arm swinging forward -->
  <path d="M115 125 L135 135" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="137" cy="136" r="3" fill="#f472b6"/> <!-- Hand -->

  <!-- Head leaning forward with determination -->
  <g transform="translate(118, 112) rotate(15)">
    <!-- Hair -->
    <path d="M-10 -12 C -15 -18, 5 -22, 10 -12 C 14 -5, 12 5, 8 8 C 4 10, -5 8, -8 4 Z" fill="#0f172a"/>
    <!-- Face Shape -->
    <circle cx="0" cy="0" r="10" fill="#fed7aa"/>
    <!-- Determined Eye (Angled brow) -->
    <line x1="2" y1="-2" x2="6" y2="-1" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Motion sweat drop -->
    <path d="M 12 -5 C 12 -5, 15 -2, 15 1 C 15 3, 13 4, 12 4 C 11 4, 9 3, 9 1 C 9 -2, 12 -5, 12 -5 Z" fill="#38bdf8"/>
  </g>

  <!-- Foreground details: Indoor Plant to give depth and framing -->
  <path d="M15 180 C 15 150, 30 150, 30 180 Z" fill="#334155"/>
  <ellipse cx="22.5" cy="180" rx="8" ry="3" fill="#475569"/>
  <!-- Plant Leaves curving -->
  <path d="M22.5 150 C 15 130, 0 135, -5 120" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M22.5 150 C 30 120, 45 125, 50 110" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  <path d="M22.5 150 C 20 130, 25 120, 20 105" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Dramatic lighting / vignette overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
</svg>