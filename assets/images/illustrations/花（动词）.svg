<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with dark mode gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Interior Background Elements (Shopping/Checkout Context) -->
  <path d="M40 180 L200 180 L200 190 L40 190 Z" fill="#334155" opacity="0.6"/>
  <!-- Checkout counter -->
  <path d="M30 140 L210 140 L220 180 L20 180 Z" fill="#475569"/>
  <path d="M30 140 L210 140 L210 148 L30 148 Z" fill="#64748b"/>
  
  <!-- Shopping bags and packages (representing spending a lot of money) -->
  <!-- Bag 1 (Pink) -->
  <path d="M45 120 L75 120 L80 170 L40 170 Z" fill="#ec4899"/>
  <path d="M52 120 C52 112 68 112 68 120" stroke="#fce7f3" stroke-width="2.5" fill="none"/>
  <circle cx="60" cy="140" r="6" fill="#f472b6" opacity="0.6"/>

  <!-- Bag 2 (Teal) -->
  <path d="M70 100 L105 100 L112 170 L65 170 Z" fill="#0d9488"/>
  <path d="M80 100 C80 90 95 90 95 100" stroke="#ccfbf1" stroke-width="2.5" fill="none"/>
  <rect x="75" y="125" width="22" height="15" rx="3" fill="#14b8a6" opacity="0.5"/>

  <!-- Large Gift Box / Luxury item -->
  <rect x="165" y="130" width="35" height="40" rx="4" fill="#8b5cf6"/>
  <rect x="160" y="125" width="45" height="12" rx="3" fill="#a78bfa"/>
  <path d="M182 125 L182 170" stroke="#fbbf24" stroke-width="4"/>
  <path d="M160 145 L205 145" stroke="#fbbf24" stroke-width="4"/>

  <!-- Floating gold coins and bills (representing money flying away / being spent) -->
  <g opacity="0.9">
    <!-- Coin 1 -->
    <circle cx="120" cy="70" r="10" fill="url(#goldGlow)"/>
    <circle cx="120" cy="70" r="7" fill="#fef3c7" opacity="0.4"/>
    <!-- Coin 2 -->
    <circle cx="150" cy="55" r="7" fill="url(#goldGlow)"/>
    <!-- Coin 3 -->
    <circle cx="95" cy="50" r="8" fill="url(#goldGlow)"/>
    <!-- Flying Cash Note -->
    <rect x="135" y="80" width="22" height="13" rx="2" transform="rotate(-25 146 86)" fill="#10b981"/>
    <rect x="100" y="95" width="20" height="12" rx="2" transform="rotate(35 110 101)" fill="#10b981"/>
  </g>

  <!-- Character (Shocked/Overwhelmed Shopper) -->
  <!-- Torso & Clothing -->
  <path d="M100 160 C100 140 140 140 140 160 L145 190 L95 190 Z" fill="#38bdf8"/>
  
  <!-- Neck & Head -->
  <rect x="112" y="105" width="16" height="20" rx="6" fill="#fcd34d"/>
  <circle cx="120" cy="95" r="22" fill="#fcd34d"/>

  <!-- Hair -->
  <path d="M98 95 C98 75 142 75 142 95 C142 100 138 100 135 90 C125 78 115 78 105 90 C102 100 98 100 98 95 Z" fill="#1e293b"/>

  <!-- Facial Expression (Wide eyes, open mouth of disbelief at the high cost) -->
  <!-- Eyes (Wide/Shocked) -->
  <circle cx="112" cy="94" r="4" fill="#1e293b"/>
  <circle cx="128" cy="94" r="4" fill="#1e293b"/>
  <circle cx="113" cy="93" r="1.5" fill="#ffffff"/>
  <circle cx="129" cy="93" r="1.5" fill="#ffffff"/>
  <!-- Eyebrows (Arched high in surprise) -->
  <path d="M108 86 Q112 82 116 87" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M124 87 Q128 82 132 86" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Open O-mouth -->
  <ellipse cx="120" cy="104" rx="4" ry="5" fill="#1e293b"/>

  <!-- Arms holding head in shock / realization -->
  <!-- Left Arm -->
  <path d="M102 145 C90 140 92 110 102 105" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="102" cy="105" r="5" fill="#fcd34d"/>
  
  <!-- Right Arm -->
  <path d="M138 145 C150 140 148 110 138 105" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="138" cy="105" r="5" fill="#fcd34d"/>

  <!-- Receipt/Bill flying from counter -->
  <g transform="translate(130, 115) rotate(15)">
    <rect x="0" y="0" width="22" height="35" rx="1" fill="#ffffff"/>
    <line x1="4" y1="6" x2="18" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="12" x2="15" y2="12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="18" x2="12" y2="18" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="26" x2="18" y2="26" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

</svg>