<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Context: Floor and Wall Corner -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155" opacity="0.3"/>
  <path d="M120 180 L120 40" stroke="#334155" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Background Prop: Potted Plant -->
  <rect x="20" y="165" width="25" height="20" rx="2" fill="#475569"/>
  <path d="M22 165 Q25 140 35 150 M32 165 Q35 135 45 145" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Character 1: The Person Being Helped (Left) -->
  <!-- Legs/Body -->
  <path d="M70 185 L65 210 M85 185 L90 210" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M65 140 Q75 130 85 140 L85 185 L65 185 Z" fill="#0d9488"/>
  <!-- Head -->
  <circle cx="75" cy="120" r="10" fill="#ffccaa"/>
  <path d="M65 115 Q75 105 85 115" fill="#4b2c20"/> <!-- Hair -->
  
  <!-- The Stack of Boxes -->
  <rect x="60" y="145" width="45" height="30" rx="2" fill="#b45309"/> <!-- Bottom Box -->
  <rect x="62" y="120" width="40" height="25" rx="2" fill="#d97706"/> <!-- Middle Box -->
  
  <!-- Character 2: The Helper (Right) - Actively taking the top box -->
  <!-- Legs -->
  <path d="M150 215 L165 190 M180 215 L175 190" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <!-- Body -->
  <path d="M155 145 Q170 135 185 145 L185 190 L155 190 Z" fill="#fbbf24"/>
  <!-- Head -->
  <circle cx="175" cy="125" r="10" fill="#ffccaa"/>
  <path d="M165 120 Q175 110 185 120" fill="#2d1b14"/> <!-- Hair -->
  
  <!-- The Action: Reaching and Lifting the Top Box -->
  <!-- Top Box (Being lifted) -->
  <rect x="110" y="95" width="40" height="25" rx="2" fill="#f59e0b" transform="rotate(-5 130 107)"/>
  <path d="M110 110 L150 110" stroke="#b45309" stroke-width="1" opacity="0.5"/> <!-- Tape detail -->

  <!-- Helper's Arms (Reaching out) -->
  <path d="M155 155 L135 115" stroke="#ffccaa" stroke-width="6" stroke-linecap="round"/>
  <path d="M165 155 L145 110" stroke="#ffccaa" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Receiver's Arms (Holding the bottom) -->
  <path d="M65 160 L55 150" stroke="#ffccaa" stroke-width="6" stroke-linecap="round"/>
  <path d="M85 160 L105 160" stroke="#ffccaa" stroke-width="6" stroke-linecap="round"/>

  <!-- Narrative Details: Motion lines and Glow -->
  <path d="M145 90 Q155 80 160 90" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/> <!-- Effort/Motion -->
  <path d="M100 90 Q90 80 85 90" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Expressions (Simplified but friendly) -->
  <circle cx="72" cy="120" r="1" fill="#2d1b14"/>
  <circle cx="78" cy="120" r="1" fill="#2d1b14"/>
  <path d="M73 125 Q75 128 77 125" stroke="#2d1b14" stroke-width="1" fill="none"/>
  
  <circle cx="172" cy="125" r="1" fill="#2d1b14"/>
  <circle cx="178" cy="125" r="1" fill="#2d1b14"/>
  <path d="M172 130 Q175 133 178 130" stroke="#2d1b14" stroke-width="1" fill="none"/>

  <!-- Foreground Detail: A roll of packing tape -->
  <circle cx="200" cy="210" r="6" fill="#ec4899" opacity="0.8"/>
  <circle cx="200" cy="210" r="3" fill="#1e293b"/>
  
  <!-- Warm Light Glow from the side -->
  <circle cx="240" cy="60" r="60" fill="#fbbf24" opacity="0.1" filter="url(#glow)"/>
</svg>