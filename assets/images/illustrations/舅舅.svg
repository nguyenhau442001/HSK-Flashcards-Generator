<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Window Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Uncle's Shirt Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Niece/Nephew Hoodie -->
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment: Beijing Apartment Interior -->
  <!-- Wall Background -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b" />

  <!-- Traditional / Modern Beijing Window View -->
  <g id="window" transform="translate(140, 30)">
    <rect x="0" y="0" width="70" height="90" rx="6" fill="#0f172a" />
    <rect x="6" y="6" width="58" height="78" rx="4" fill="url(#window-glow)" />
    <!-- Window Panes & City Silhouette -->
    <path d="M6 55 L20 45 L35 50 L50 40 L64 48 L64 84 L6 84 Z" fill="#0f172a" opacity="0.4" />
    <!-- Beijing Pagoda Silhouette accent -->
    <path d="M30 45 L35 35 L40 45 Z" fill="#0f172a" opacity="0.5" />
    <rect x="33" y="32" width="4" height="4" fill="#0f172a" opacity="0.5" />
    <line x1="35" y1="6" x2="35" y2="84" stroke="#0f172a" stroke-width="3" />
    <line x1="6" y1="45" x2="64" y2="45" stroke="#0f172a" stroke-width="3" />
  </g>

  <!-- Bookshelf / Decor in Background -->
  <g id="shelf" transform="translate(25, 40)">
    <rect x="0" y="0" width="40" height="8" rx="2" fill="#475569" />
    <rect x="5" y="-18" width="8" height="18" rx="1" fill="#f59e0b" />
    <rect x="15" y="-22" width="10" height="22" rx="1" fill="#10b981" />
    <rect x="27" y="-15" width="7" height="15" rx="1" fill="#ef4444" />
  </g>

  <!-- Warm Indoor Ambient Light Cone -->
  <path d="M175 120 L240 200 L20 200 Z" fill="#fbbf24" opacity="0.04" />

  <!-- Foreground / Midground Desk Surface -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#desk-grad)" filter="url(#shadow)" />
  <rect x="0" y="165" width="240" height="6" fill="#475569" />

  <!-- Props on Desk -->
  <!-- Laptop showing video call UI (abstract shapes, no text) -->
  <g id="laptop" transform="translate(30, 130)">
    <path d="M0 35 L50 35 L55 42 L-5 42 Z" fill="#64748b" />
    <rect x="-3" y="5" width="56" height="32" rx="3" fill="#0f172a" />
    <rect x="1" y="9" width="48" height="24" rx="2" fill="#1e293b" />
    <!-- Video call avatars on screen -->
    <circle cx="15" cy="21" r="6" fill="#38bdf8" />
    <circle cx="35" cy="21" r="6" fill="#f472b6" />
    <path d="M11 28 Q15 24 19 28 Z" fill="#0284c7" />
    <path d="M31 28 Q35 24 39 28 Z" fill="#db2777" />
  </g>

  <!-- Tea Cup / Warm Drink (Symbol of hospitality) -->
  <g id="teacup" transform="translate(195, 145)">
    <ellipse cx="12" cy="5" rx="8" ry="3" fill="#cbd5e1" />
    <path d="M4 5 L6 22 C6 25 18 25 18 22 L20 5 Z" fill="#f8fafc" />
    <path d="M18 9 C22 9 22 17 18 17" stroke="#cbd5e1" stroke-width="2" fill="none" />
    <!-- Steam -->
    <path d="M10 -2 Q8 -6 12 -10 Q16 -14 14 -18" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- MAIN SUBJECT: The Uncle (舅舅 - Cậu) interacting joyfully with family/niece -->
  <g id="uncle-and-niece" transform="translate(0, 15)">

    <!-- Niece / Nephew (Reaching up from the foreground right) -->
    <g id="niece" transform="translate(135, 80)" filter="url(#shadow)">
      <!-- Body / Hoodie -->
      <path d="M10 65 L45 65 L40 40 L15 40 Z" fill="url(#hoodie-grad)" />
      <!-- Head -->
      <circle cx="28" cy="24" r="14" fill="#fbcfe8" />
      <!-- Hair (Bob cut) -->
      <path d="M14 22 C14 12 42 12 42 22 C42 28 38 35 38 35 L18 35 C18 35 14 28 14 22 Z" fill="#451a03" />
      <circle cx="28" cy="24" r="14" fill="none" />
      <!-- Cheerful Face -->
      <circle cx="23" cy="24" r="1.5" fill="#1e293b" />
      <circle cx="33" cy="24" r="1.5" fill="#1e293b" />
      <path d="M26 28 Q28 31 30 28" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Raised arm waving -->
      <path d="M38 45 L52 30" stroke="#f472b6" stroke-width="7" stroke-linecap="round" />
      <circle cx="53" cy="28" r="5" fill="#fbcfe8" />
    </g>

    <!-- Uncle (舅舅 - Cậu): Warm, friendly, middle-aged man with stylish glasses and casual friendly posture -->
    <g id="uncle" transform="translate(70, 50)" filter="url(#shadow)">
      <!-- Torso / Casual Shirt -->
      <path d="M15 95 L65 95 L70 50 L10 50 Z" fill="url(#shirt-grad)" />
      <!-- Collar -->
      <path d="M30 50 L40 65 L50 50 Z" fill="#f8fafc" />
      <!-- Arms / Gesturing warmly -->
      <!-- Left arm (waving back) -->
      <path d="M15 55 L-2 40" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
      <circle cx="-5" cy="38" r="6" fill="#fcd34d" /> <!-- Warm skin tone -->

      <!-- Right arm (holding phone or gesturing) -->
      <path d="M60 55 L80 65" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
      <circle cx="83" cy="67" r="6" fill="#fcd34d" />

      <!-- Neck -->
      <rect x="33" y="38" width="14" height="15" rx="4" fill="#fcd34d" />

      <!-- Head -->
      <circle cx="40" cy="28" r="18" fill="#fcd34d" />

      <!-- Friendly Hairstyle (Short neat black hair with slight modern fringe) -->
      <path d="M22 28 C22 15 58 15 58 28 C58 31 54 24 50 20 C46 16 34 16 30 20 C26 24 22 25 22 28 Z" fill="#1e293b" />

      <!-- Facial Features: Glasses, warm smile, friendly eyes -->
      <!-- Glasses Frame -->
      <rect x="27" y="21" width="11" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="2" />
      <rect x="42" y="21" width="11" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="2" />
      <line x1="38" y1="25" x2="42" y2="25" stroke="#0f172a" stroke-width="2" />

      <!-- Eyes (Happy crescents behind glasses) -->
      <path d="M30 24 Q32.5 22 35 24" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M45 24 Q47.5 22 50 24" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <!-- Warm Smile & Rosy Cheeks -->
      <circle cx="31" cy="30" r="3" fill="#f87171" opacity="0.4" />
      <circle cx="49" cy="30" r="3" fill="#f87171" opacity="0.4" />
      <path d="M35 33 Q40 38 45 33" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

  </g>

  <!-- Ambient Particle Sparkles for cheerful atmosphere -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="60" cy="45" r="2" />
    <circle cx="120" cy="30" r="3" />
    <circle cx="180" cy="90" r="2" />
    <circle cx="100" cy="110" r="1.5" />
  </g>
</svg>