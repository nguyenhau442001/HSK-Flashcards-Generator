<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Atmosphere (Waiting/Bus Stop or Cafe Vibe) -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pants-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="bench-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Clock Glow -->
    <radialGradient id="clock-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- BACKGROUND ENVIRONMENT -->
  <g id="environment">
    <!-- Brick/Wall texture lines -->
    <path d="M0 40 H240 M0 70 H240 M0 100 H240 M0 130 H240" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    <path d="M60 40 V130 M140 40 V130 M200 40 V130" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />

    <!-- Window showing night/evening city background outside -->
    <path d="M150 45 L220 45 L220 120 L150 120 Z" fill="#090d16" stroke="#475569" stroke-width="2" />
    <!-- City lights outside -->
    <rect x="160" y="60" width="8" height="15" rx="1" fill="#f59e0b" opacity="0.6" />
    <rect x="175" y="75" width="10" height="30" rx="1" fill="#38bdf8" opacity="0.4" />
    <rect x="195" y="55" width="12" height="40" rx="1" fill="#ec4899" opacity="0.5" />
    <circle cx="210" cy="105" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="165" cy="100" r="1.5" fill="#ffffff" opacity="0.8" />
    <!-- Window frame highlight -->
    <path d="M150 45 L185 55 L220 45" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.5" />

    <!-- Wall Lamp casting downward light -->
    <path d="M75 45 L85 45 L88 52 L72 52 Z" fill="#94a3b8" />
    <path d="M80 52 L80 62" stroke="#94a3b8" stroke-width="2" />
    <path d="M65 62 Q80 58 95 62 L115 110 Q80 120 45 110 Z" fill="#fbbf24" opacity="0.12" />
    <ellipse cx="80" cy="62" rx="6" ry="3" fill="#fef08a" />

    <!-- Wall Clock showing time passing (Waiting concept) -->
    <g transform="translate(115, 38)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="0" cy="0" r="15" fill="url(#clock-glow)" />
      <!-- Clock ticks -->
      <line x1="0" y1="-11" x2="0" y2="-9" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="11" y1="0" x2="9" y2="0" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="0" y1="11" x2="0" y2="9" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="-11" y1="0" x2="-9" y2="0" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Clock Hands -->
      <line x1="0" y1="0" x2="0" y2="-7" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="0" y1="0" x2="6" y2="-3" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="1.5" stroke="#cbd5e1" stroke-width="1" fill="#0f172a" />
    </g>

    <!-- House Plant (Adding warmth and real-world richness) -->
    <g transform="translate(25, 100)">
      <path d="M10 35 L20 35 L17 65 L13 65 Z" fill="#64748b" />
      <ellipse cx="15" cy="35" rx="5" ry="2" fill="#94a3b8" />
      <!-- Leaves -->
      <path d="M15 35 Q5 20 2 10 Q12 20 15 35 Z" fill="#10b981" />
      <path d="M15 35 Q25 15 30 5 Q22 20 15 35 Z" fill="#059669" />
      <path d="M15 35 Q-5 25 -10 18 Q5 25 15 35 Z" fill="#34d399" />
    </g>

    <!-- Floor -->
    <rect x="0" y="190" width="240" height="50" fill="#0b0f19" />
    <path d="M0 190 H240" stroke="#334155" stroke-width="2" />
    <!-- Floor perspective lines -->
    <path d="M0 190 L40 240 M80 190 L110 240 M160 190 L170 240 M220 190 L230 240" stroke="#1e293b" stroke-width="1.5" />
  </g>

  <!-- FOREGROUND & MAIN SUBJECT (Waiting on a bench) -->
  <g id="main-subject">
    <!-- Waiting Bench / Chair -->
    <!-- Bench legs -->
    <rect x="65" y="165" width="6" height="30" fill="#334155" />
    <rect x="155" y="165" width="6" height="30" fill="#334155" />
    <!-- Bench seat -->
    <rect x="50" y="155" width="126" height="12" rx="3" fill="url(#bench-grad)" />
    <!-- Bench support structure -->
    <rect x="58" y="167" width="110" height="6" fill="#92400e" />
    <!-- Bench backrest -->
    <path d="M50 125 L176 125 L173 148 L53 148 Z" fill="url(#bench-grad)" />
    <rect x="56" y="130" width="114" height="4" rx="2" fill="#b45309" opacity="0.6" />
    <rect x="56" y="138" width="114" height="4" rx="2" fill="#b45309" opacity="0.6" />

    <!-- CHARACTER: Sitting, checking watch/looking expectantly ("waiting") -->
    <!-- Legs (Sitting posture) -->
    <!-- Left Leg (bent, foot on floor) -->
    <path d="M85 160 L80 192 L98 192" fill="none" stroke="url(#pants-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Shoe -->
    <ellipse cx="98" cy="193" rx="10" ry="5" fill="#1e293b" />
    <path d="M90 191 Q96 189 104 191" fill="none" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Right Leg (crossed or relaxed) -->
    <path d="M125 160 L140 185 L130 191" fill="none" stroke="url(#pants-grad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Shoe -->
    <ellipse cx="127" cy="192" rx="9" ry="5" fill="#1e293b" />

    <!-- Torso -->
    <path d="M82 105 L134 105 C138 120 138 145 134 158 L82 158 C78 145 78 120 82 105 Z" fill="url(#coat-grad)" />
    <!-- Coat zipper/details -->
    <line x1="108" y1="105" x2="108" y2="158" stroke="#0284c7" stroke-width="2" />
    <!-- Collar -->
    <path d="M92 105 L108 118 L124 105" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" />

    <!-- Head & Neck -->
    <path d="M102 95 H114 V108 H102 Z" fill="#fed7aa" />
    <!-- Head circle -->
    <circle cx="108" cy="78" r="19" fill="#fed7aa" />

    <!-- Hair (Stylized modern neat hair) -->
    <path d="M90 78 C90 62 100 58 108 58 C118 58 126 64 126 76 C126 78 126 80 125 82 C122 75 118 70 110 70 C102 70 96 74 93 81 C91 80 90 79 90 78 Z" fill="#334155" />

    <!-- Face Profile / Expression (Expectant, looking right/forward) -->
    <!-- Eyes (focused, slightly wide with anticipation) -->
    <circle cx="116" cy="76" r="2.5" fill="#0f172a" />
    <!-- Eyebrow raised slightly showing attentive waiting -->
    <path d="M112 70 C115 68 119 69 120 71" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <!-- Cute rosied cheek -->
    <ellipse cx="116" cy="83" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3" />
    <!-- Small thoughtful mouth -->
    <path d="M116 86 Q118 87 120 85" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms & Hands performing the "Waiting" action -->
    <!-- Left Arm (resting on knee / leg) -->
    <path d="M85 110 L72 135 L90 152" fill="none" stroke="#0284c7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="91" cy="153" r="5" fill="#fed7aa" /> <!-- Left Hand -->

    <!-- Right Arm (Raised slightly, checking wrist watch or holding arm - classic waiting pose) -->
    <path d="M131 110 L148 125 L136 142" fill="none" stroke="#0284c7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Wristwatch (Emphasizing time/waiting) -->
    <rect x="131" y="137" width="8" height="6" rx="2" fill="#f59e0b" transform="rotate(30 135 140)" />
    <circle cx="137" cy="142" r="5" fill="#fed7aa" /> <!-- Right Hand touching wrist -->

    <!-- Dynamic Waiting / Anticipation Element: Little floating motion lines near foot or head to show restless/attentive waiting -->
    <path d="M140 100 Q145 95 142 90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M146 104 Q152 98 148 92" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Foreground props: A small side table with a cup of coffee/tea getting cold (classic waiting scene detail) -->
  <g id="foreground-props" transform="translate(170, 150)">
    <!-- Small Table Leg -->
    <rect x="15" y="15" width="4" height="25" fill="#475569" />
    <!-- Table Top -->
    <ellipse cx="17" cy="15" rx="18" ry="6" fill="#64748b" />
    <ellipse cx="17" cy="13" rx="18" ry="6" fill="#94a3b8" />
    
    <!-- Coffee Cup -->
    <rect x="10" y="3" width="10" height="9" rx="1" fill="#f8fafc" />
    <path d="M20 5 C23 5 23 9 20 10" fill="none" stroke="#f8fafc" stroke-width="1.5" />
    <!-- Steam rising (showing time passed while waiting) -->
    <path d="M13 1 Q15 -2 13 -5" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M17 0 Q19 -3 17 -6" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Ambient lighting highlights overlay -->
  <path d="M0 0 H240 V240 H0 Z" fill="none" />
</svg>