<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- TV Screen -->
  <rect x="60" y="60" width="120" height="80" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="65" y="65" width="110" height="70" rx="4" fill="#0f172a"/>
  
  <!-- Cartoon on screen -->
  <circle cx="90" cy="90" r="15" fill="#f59e0b"/>
  <path d="M110 100 Q 125 80 140 100" stroke="#fb923c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="150" cy="90" r="10" fill="#ec4899"/>
  
  <!-- Sofa -->
  <path d="M40 140 L200 140 L210 180 L30 180 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M40 140 L200 140 L190 120 L50 120 Z" fill="#0ea5e9"/>
  
  <!-- Children -->
  <g transform="translate(70, 130)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="15" y="35" width="10" height="20" fill="#fbbf24"/>
  </g>
  <g transform="translate(110, 125)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="15" y="35" width="10" height="20" fill="#fb923c"/>
  </g>
  <g transform="translate(150, 130)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="15" y="35" width="10" height="20" fill="#10b981"/>
  </g>
  
  <!-- Floor details -->
  <rect x="0" y="180" width="240" height="60" fill="#1e293b"/>
  <circle cx="40" cy="200" r="5" fill="#475569"/>
  <circle cx="200" cy="210" r="8" fill="#475569"/>
  
  <!-- Ambient light -->
  <ellipse cx="120" cy="100" rx="60" ry="30" fill="#f59e0b" opacity="0.05"/>
