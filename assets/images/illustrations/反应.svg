<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Lab Table Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Flask Liquid Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Reaction Energy Burst Gradient -->
    <radialGradient id="energyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Shadow Filter for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Laboratory Background Details -->
  <g opacity="0.3">
    <!-- Shelves and glassware outlines -->
    <rect x="25" y="40" width="70" height="4" rx="2" fill="#64748b" />
    <path d="M40 40 L40 25 L50 25 L50 40 Z" fill="none" stroke="#64748b" stroke-width="2" />
    <path d="M65 40 L60 20 L75 20 L70 40 Z" fill="none" stroke="#64748b" stroke-width="2" />
    
    <rect x="145" y="60" width="70" height="4" rx="2" fill="#64748b" />
    <circle cx="165" cy="45" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    <path d="M190 60 L185 35 L195 35 Z" fill="none" stroke="#64748b" stroke-width="2" />
  </g>

  <!-- Laboratory Workbench Surface -->
  <rect x="0" y="190" width="240" height="50" fill="url(#tableGrad)" />
  <rect x="0" y="186" width="240" height="6" fill="#475569" />

  <!-- MAIN SCENE: Chemical Reaction Experiment representing 'Phản ứng' -->
  <g transform="translate(0, 5)">

    <!-- Background Energy/Reaction Glow Aura -->
    <circle cx="120" cy="115" r="75" fill="url(#energyGlow)" />

    <!-- Droplet falling from pipette (Action moment) -->
    <g filter="url(#shadow)">
      <path d="M120 40 C120 40 115 50 115 56 C115 60.1421 118.358 63.5 122.5 63.5 C126.642 63.5 130 60.1421 130 56 C130 50 120 40 120 40 Z" fill="url(#dropGrad)" />
    </g>

    <!-- Pipette tool at top -->
    <g fill="#94a3b8">
      <rect x="116" y="15" width="8" height="25" rx="3" />
      <path d="M112 15 C112 11.6863 114.686 9 118 9 C121.314 9 124 11.6863 124 15 L124 18 L112 18 Z" fill="#ef4444" />
      <path d="M118 40 L122 40 L120 46 Z" fill="#64748b" />
    </g>

    <!-- Splash and Reaction Particles (Action Effects) -->
    <g>
      <!-- Glowing sparks/bubbles -->
      <circle cx="95" cy="85" r="6" fill="#f59e0b" filter="url(#shadow)" />
      <path d="M93 83 L97 87 M97 83 L93 87" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />

      <circle cx="148" cy="90" r="8" fill="#ec4899" filter="url(#shadow)" />
      <path d="M146 88 L150 92 M150 88 L146 92" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />

      <circle cx="105" cy="110" r="5" fill="#38bdf8" />
      <circle cx="138" cy="105" r="4" fill="#fbbf24" />
      <circle cx="120" cy="75" r="7" fill="#10b981" filter="url(#shadow)" />

      <!-- Dynamic action curved motion lines -->
      <path d="M90 100 C80 95 75 80 85 70" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <path d="M150 95 C165 95 175 80 165 65" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <path d="M100 130 C85 140 90 155 105 160" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
      <path d="M140 130 C155 140 150 155 135 160" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Erlenmeyer Flask (Main Object) -->
    <g filter="url(#shadow)">
      <!-- Flask Rim -->
      <rect x="108" y="72" width="24" height="6" rx="3" fill="#cbd5e1" />
      
      <!-- Flask Neck -->
      <path d="M113 78 L113 95 L127 95 L127 78 Z" fill="url(#liquidGrad)" opacity="0.2" />
      <path d="M113 78 L113 95 L127 95 L127 78 Z" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round" />

      <!-- Flask Body Base -->
      <path d="M113 95 C113 95 75 165 73 168 C70 173 74 178 80 178 L160 178 C166 178 170 173 167 168 C165 165 127 95 127 95 Z" fill="#ffffff" fill-opacity="0.1" stroke="#cbd5e1" stroke-width="4" stroke-linejoin="round" />

      <!-- Violent Boiling Liquid Inside Flask -->
      <path d="M78 170 C95 155 110 165 120 150 C130 165 145 155 162 170 C160 175 155 176 160 176 L80 176 C75 176 76 173 78 170 Z" fill="url(#liquidGrad)" />
      
      <!-- Liquid surface reflection / bubbles -->
      <circle cx="100" cy="162" r="3" fill="#ffffff" opacity="0.6" />
      <circle cx="130" cy="158" r="4" fill="#ffffff" opacity="0.6" />
      <circle cx="115" cy="166" r="2.5" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Additional Foreground Bench Props for Depth -->
    <!-- Small secondary beaker -->
    <g filter="url(#shadow)" transform="translate(35, 140)">
      <path d="M12 15 L28 15 L32 45 C32 48 29 50 25 50 L15 50 C11 50 8 48 8 45 Z" fill="#ffffff" fill-opacity="0.15" stroke="#94a3b8" stroke-width="2.5" />
      <path d="M10 35 C15 30 25 40 30 35 L31 46 C31 48 29 49 26 49 L14 49 C11 49 9 48 9 46 Z" fill="#38bdf8" opacity="0.8" />
      <!-- Rim -->
      <rect x="10" y="12" width="18" height="4" rx="2" fill="#94a3b8" />
    </g>

    <!-- Test tube rack with glowing tubes -->
    <g filter="url(#shadow)" transform="translate(160, 130)">
      <!-- Rack base -->
      <rect x="0" y="30" width="45" height="15" rx="3" fill="#475569" />
      <rect x="5" y="0" width="35" height="6" rx="2" fill="#64748b" />
      <!-- Supports -->
      <rect x="3" y="6" width="4" height="24" fill="#64748b" />
      <rect x="38" y="6" width="4" height="24" fill="#64748b" />

      <!-- Test Tube 1 (Green glow) -->
      <path d="M12 5 L18 5 L18 35 C18 38 12 38 12 35 Z" fill="#ffffff" opacity="0.2" stroke="#94a3b8" stroke-width="1.5" />
      <path d="M13 20 L17 20 L17 34 C17 36 13 36 13 34 Z" fill="#10b981" />

      <!-- Test Tube 2 (Orange energetic glow bubbling over) -->
      <path d="M27 2 L33 2 L33 35 C33 38 27 38 27 35 Z" fill="#ffffff" opacity="0.2" stroke="#94a3b8" stroke-width="1.5" />
      <path d="M28 12 L32 12 L32 34 C32 36 28 36 28 34 Z" fill="#fb923c" />
      <circle cx="30" cy="8" r="3" fill="#fb923c" />
    </g>

  </g>
</svg>