<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sunbeam/Light Ray Gradient -->
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Plant Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Cozy Room Interior) -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="140" y="20" width="80" height="120" rx="4" fill="#334155" opacity="0.4"/>
    <rect x="148" y="28" width="30" height="104" rx="2" fill="#38bdf8" opacity="0.1"/>
    <rect x="182" y="28" width="30" height="104" rx="2" fill="#38bdf8" opacity="0.1"/>
    
    <!-- Wooden Shelf/Table -->
    <rect x="20" y="180" width="200" height="12" rx="3" fill="#64748b"/>
    <rect x="30" y="192" width="180" height="8" rx="2" fill="#475569"/>
  </g>

  <!-- Incoming Sunlight / Absorption Element -->
  <g id="sunlight">
    <!-- Light Ray Cone -->
    <polygon points="220,10 40,190 120,190" fill="url(#sunbeam)"/>
    
    <!-- Floating Light Particles / Energy Flowing into Plant -->
    <circle cx="160" cy="50" r="3" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="130" cy="80" r="2" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="100" cy="110" r="3.5" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="80" cy="140" r="2.5" fill="#fef08a" filter="url(#glow)"/>
    
    <!-- Curved Energy Flow Lines (Visualizing 'Absorption') -->
    <path d="M 140,60 Q 110,80 95,115" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
    <path d="M 120,90 Q 100,110 98,130" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
  </g>

  <!-- Main Subject: The Plant (Thực vật hấp thu ánh nắng) -->
  <g id="plant-pot">
    <!-- Flowerpot -->
    <path d="M 75,180 L 85,140 L 125,140 L 135,180 Z" fill="url(#potGrad)"/>
    <!-- Rim of the pot -->
    <ellipse cx="105" cy="140" rx="22" ry="5" fill="#fdba74"/>

    <!-- Plant Leaves (Vibrant Green) -->
    <!-- Center/Back Leaf -->
    <path d="M 105,140 Q 100,90 115,60 Q 125,90 105,140" fill="#10b981"/>
    <!-- Left Leaf (Reaching up and glowing) -->
    <path d="M 105,140 Q 70,120 70,90 Q 75,120 105,140" fill="#34d399"/>
    <!-- Right Leaf -->
    <path d="M 105,140 Q 135,110 130,85 Q 125,115 105,140" fill="#059669"/>
    <!-- Small Foreground Sprout -->
    <path d="M 105,140 Q 95,125 90,115 Q 100,125 105,140" fill="#6ee7b7"/>

    <!-- Glowing Aura on Leaves to Show Absorption / Photosynthesis -->
    <circle cx="105" cy="85" r="25" fill="#34d399" opacity="0.25" filter="url(#glow)"/>
  </g>

  <!-- Cute Personified Details on the Plant (Expressive character in app context) -->
  <g id="plant-face">
    <!-- Happy Smiling Face -->
    <circle cx="98" cy="102" r="2" fill="#064e3b"/>
    <circle cx="112" cy="102" r="2" fill="#064e3b"/>
    <path d="M 102,107 Q 105,111 108,107" fill="none" stroke="#064e3b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="95" cy="105" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="115" cy="105" r="3" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- Foreground Props (Cozy Desk Environment) -->
  <g id="foreground-props">
    <!-- Small stacked books beside the plant -->
    <rect x="145" y="165" width="30" height="7" rx="1.5" fill="#3b82f6"/>
    <rect x="143" y="172" width="34" height="8" rx="1.5" fill="#ec4899"/>
    
    <!-- Small teacup -->
    <path d="M 50,172 L 53,180 L 67,180 L 70,172 Z" fill="#f8fafc"/>
    <ellipse cx="60" cy="172" rx="10" ry="3" fill="#cbd5e1"/>
    <!-- Steam from tea -->
    <path d="M 58,165 Q 56,160 60,155" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>