<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Rain Atmosphere -->
  <g opacity="0.4">
    <line x1="20" y1="0" x2="20" y2="240" stroke="#38bdf8" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="240" stroke="#38bdf8" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="240" stroke="#38bdf8" stroke-width="1"/>
    <line x1="140" y1="0" x2="140" y2="240" stroke="#38bdf8" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="240" stroke="#38bdf8" stroke-width="1"/>
    <line x1="220" y1="0" x2="220" y2="240" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Doorway/Shelter Frame -->
  <path d="M40 240 L40 80 Q40 40 80 40 L160 40 Q200 40 200 80 L200 240" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Characters inside sheltering -->
  <g transform="translate(80, 120)">
    <circle cx="20" cy="20" r="15" fill="#f59e0b"/>
    <rect x="10" y="40" width="20" height="40" rx="5" fill="#fbbf24"/>
    <circle cx="60" cy="25" r="15" fill="#10b981"/>
    <rect x="50" y="45" width="20" height="35" rx="5" fill="#34d399"/>
  </g>

  <!-- Puddle on ground -->
  <ellipse cx="120" cy="220" rx="80" ry="15" fill="#0f172a" opacity="0.6"/>
  <path d="M70 220 Q120 235 170 220" fill="#38bdf8" opacity="0.3"/>

  <!-- Decorative Rain Drops -->
  <circle cx="150" cy="100" r="2" fill="#38bdf8"/>
  <circle cx="180" cy="150" r="2" fill="#38bdf8"/>
  <circle cx="50" cy="180" r="2" fill="#38bdf8"/>
</svg>