<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Abundance -->
    <radialGradient id="goldenGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Sack Gradient -->
    <linearGradient id="sackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b076"/>
      <stop offset="100%" stop-color="#b47c44"/>
    </linearGradient>

    <!-- Wheat/Grain Gold Gradient -->
    <linearGradient id="wheatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow representing "abundance/richness" -->
  <circle cx="120" cy="110" r="100" fill="url(#goldenGlow)"/>

  <!-- Warehouse / Barn Interior Elements (Environment context) -->
  <path d="M20 180 L120 150 L220 180 L220 220 L20 220 Z" fill="#0f172a" opacity="0.6"/>
  <!-- Wooden floor planks pattern -->
  <line x1="20" y1="195" x2="220" y2="195" stroke="#334155" stroke-width="1.5"/>
  <line x1="20" y1="210" x2="220" y2="210" stroke="#334155" stroke-width="1.5"/>

  <!-- Background Shelves filled with grain sacks and jars -->
  <g fill="#334155">
    <rect x="30" y="85" width="70" height="6" rx="2"/>
    <rect x="140" y="85" width="70" height="6" rx="2"/>
  </g>
  
  <!-- Sacks on back shelves -->
  <ellipse cx="50" cy="80" rx="12" ry="7" fill="#d97706"/>
  <ellipse cx="70" cy="80" rx="14" ry="8" fill="#b45309"/>
  <ellipse cx="160" cy="80" rx="13" ry="8" fill="#d97706"/>
  <ellipse cx="185" cy="80" rx="12" ry="7" fill="#b45309"/>

  <!-- Giant Stack of Abundant Grain Sacks (Foreground Left) -->
  <!-- Bottom Sacks -->
  <path d="M25 190 C25 170 55 170 65 190 Z" fill="url(#sackGrad)"/>
  <path d="M55 195 C55 175 95 175 105 195 Z" fill="url(#sackGrad)" filter="brightness(0.9)"/>
  <!-- Top Sack -->
  <path d="M35 172 C35 152 75 152 85 172 Z" fill="url(#sackGrad)"/>
  <!-- Tied tops -->
  <path d="M45 172 C45 168 55 168 55 172" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
  <path d="M75 172 C75 168 85 168 85 172" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

  <!-- Wooden Barrel / Container overflowing with Corn/Grains (Foreground Right) -->
  <path d="M165 160 L175 200 C175 205 215 205 215 200 L225 160 Z" fill="#78350f"/>
  <ellipse cx="195" cy="160" rx="30" ry="10" fill="#92400e"/>
  <!-- Metal bands on barrel -->
  <path d="M168 175 L222 175" stroke="#475569" stroke-width="4" fill="none"/>
  <path d="M172 190 L218 190" stroke="#475569" stroke-width="4" fill="none"/>

  <!-- Overflowing golden corn cobs and grains from barrel -->
  <g>
    <!-- Corn cobs -->
    <ellipse cx="185" cy="155" rx="12" ry="6" fill="#facc15" transform="rotate(-25 185 155)"/>
    <ellipse cx="205" cy="153" rx="13" ry="6" fill="#fbbf24" transform="rotate(15 205 153)"/>
    <ellipse cx="195" cy="148" rx="12" ry="6" fill="#fde047" transform="rotate(-5 195 148)"/>
  </g>

  <!-- CENTRAL CHARACTER: Happy Merchant/Farmer inspecting the rich harvest -->
  <g id="character">
    <!-- Body / Torso -->
    <path d="M100 170 C95 140 145 140 140 170 Z" fill="#38bdf8"/> <!-- Blue shirt -->
    <path d="M110 170 L110 205 L130 205 L130 170 Z" fill="#0284c7"/> <!-- Overalls/Pants -->

    <!-- Head -->
    <circle cx="120" cy="115" rx="18" ry="20" fill="#fde68a"/> <!-- Warm skin tone -->

    <!-- Hair -->
    <path d="M102 110 C102 95 138 95 138 110 C138 110 135 103 120 102 C105 103 102 110 102 110 Z" fill="#334155"/>

    <!-- Happy facial expression -->
    <!-- Eyes (happy curves) -->
    <path d="M112 112 Q115 116 118 112" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M122 112 Q125 116 128 112" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Big joyful smile -->
    <path d="M114 122 Q120 128 126 122" fill="#ef4444" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Arms interacting with grain -->
    <!-- Left arm holding a wooden scoop -->
    <path d="M100 150 L80 160 L85 168 L105 158 Z" fill="#fde68a"/>
    <!-- Wooden scoop/bowl -->
    <path d="M65 165 C65 155 85 155 85 165 Z" fill="#b45309"/>
    <path d="M70 160 L60 150" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

    <!-- Right arm bent in satisfaction/thumbs up gesture -->
    <path d="M140 150 C155 145 155 165 145 170" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Golden Grain / Wheat Sheaf Held in Scoop / Falling Abundantly -->
  <g>
    <!-- Falling golden grain particles -->
    <circle cx="85" cy="178" r="3" fill="#facc15"/>
    <circle cx="95" cy="188" r="2.5" fill="#fde047"/>
    <circle cx="75" cy="183" r="2" fill="#eab308"/>
    <circle cx="90" cy="198" r="3" fill="#facc15"/>
    <circle cx="105" cy="192" r="2" fill="#fbbf24"/>
    
    <!-- Sheaf of wheat decorative element floating gracefully -->
    <path d="M115 65 C115 65 125 75 120 95 C115 75 125 65 115 65 Z" fill="url(#wheatGrad)"/>
    <path d="M105 70 C105 70 115 80 112 100 C108 80 115 70 105 70 Z" fill="url(#wheatGrad)"/>
    <path d="M125 70 C125 70 135 80 130 100 C125 80 135 70 125 70 Z" fill="url(#wheatGrad)"/>
  </g>

  <!-- Sparkles/Stars to signify "rich/abundant" quality and prosperity -->
  <g fill="#fde047">
    <path d="M190 100 L193 108 L201 111 L193 114 L190 122 L187 114 L179 111 L187 108 Z"/>
    <path d="M45 110 L47 115 L52 117 L47 119 L45 124 L43 119 L38 117 L43 115 Z" transform="scale(0.7) translate(20, 20)"/>
    <path d="M145 55 L147 60 L152 62 L147 64 L145 69 L143 64 L138 62 L143 60 Z" transform="scale(0.8)"/>
  </g>
</svg>