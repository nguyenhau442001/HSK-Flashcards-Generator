<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Street Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 185 L240 185" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Car 1 (Sedan) -->
  <g transform="translate(40, 140)">
    <path d="M10 30 L70 30 L65 10 L20 10 Z" fill="#fb923c"/>
    <path d="M5 30 L75 30 L70 40 L10 40 Z" fill="#f59e0b"/>
    <circle cx="20" cy="40" r="8" fill="#0f172a"/>
    <circle cx="60" cy="40" r="8" fill="#0f172a"/>
    <rect x="25" y="15" width="15" height="10" fill="#e2e8f0" opacity="0.5"/>
  </g>
  
  <!-- Car 2 (Damaged) -->
  <g transform="translate(110, 135)">
    <path d="M0 35 L60 35 L55 15 L10 15 Z" fill="#ec4899"/>
    <path d="M-5 35 L65 35 L60 45 L0 45 Z" fill="#be185d"/>
    <path d="M5 15 L15 5 L30 15 Z" fill="#ec4899"/>
    <circle cx="15" cy="45" r="8" fill="#0f172a"/>
    <circle cx="50" cy="45" r="8" fill="#0f172a"/>
    <!-- Smoke/Impact -->
    <circle cx="5" cy="10" r="6" fill="#94a3b8" opacity="0.6"/>
    <circle cx="0" cy="5" r="4" fill="#cbd5e1" opacity="0.4"/>
  </g>
  
  <!-- Character (Witness) -->
  <g transform="translate(180, 130)">
    <circle cx="10" cy="15" r="8" fill="#fde68a"/>
    <path d="M2 25 L18 25 L15 50 L5 50 Z" fill="#38bdf8"/>
    <path d="M5 50 L5 70 M15 50 L15 70" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M2 30 L-10 40" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Street Lamp -->
  <path d="M220 240 L220 80 L200 80" stroke="#64748b" stroke-width="6" fill="none"/>
  <circle cx="200" cy="80" r="10" fill="#fbbf24"/>
  <circle cx="200" cy="80" r="15" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Debris -->
  <circle cx="90" cy="175" r="2" fill="#e2e8f0"/>
  <circle cx="95" cy="178" r="3" fill="#e2e8f0"/>
  <circle cx="105" cy="176" r="2" fill="#e2e8f0"/>
</svg>