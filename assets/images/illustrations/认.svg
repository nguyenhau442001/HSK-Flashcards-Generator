<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Street lamps and distant city silhouettes -->
  <path d="M20 180 L220 180" stroke="#334155" stroke-width="2"/>
  <circle cx="50" cy="80" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="190" cy="70" r="4" fill="#fbbf24" opacity="0.4"/>
  
  <!-- Character 1: The one who is surprised (left) -->
  <g transform="translate(40, 100)">
    <path d="M20 120 L20 80 C20 60, 40 60, 40 80 L40 120" fill="#38bdf8"/>
    <circle cx="30" cy="55" r="15" fill="#fde68a"/>
    <path d="M22 50 Q25 45 28 50 M32 50 Q35 45 38 50" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M25 62 Q30 68 35 62" stroke="#ec4899" stroke-width="2" fill="none"/>
    <path d="M10 70 L20 85 L40 85 L50 70" fill="#fb923c"/>
  </g>
  
  <!-- Character 2: The one who has changed (right) -->
  <g transform="translate(140, 100)">
    <path d="M20 120 L20 80 C20 60, 40 60, 40 80 L40 120" fill="#10b981"/>
    <circle cx="30" cy="55" r="15" fill="#fde68a"/>
    <path d="M22 50 Q25 45 28 50 M32 50 Q35 45 38 50" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M25 65 Q30 62 35 65" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M10 70 L20 85 L40 85 L50 70" fill="#fb923c"/>
    <!-- Accessory: A hat or glasses to show time passed -->
    <rect x="20" y="42" width="20" height="4" rx="2" fill="#1e293b"/>
  </g>
  
  <!-- Visual indicator of "recognition" gap -->
  <path d="M90 70 Q120 40 150 70" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
  <circle cx="120" cy="55" r="6" fill="none" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Ground shadow -->
  <ellipse cx="120" cy="210" rx="100" ry="10" fill="#0f172a" opacity="0.3"/>
</svg>