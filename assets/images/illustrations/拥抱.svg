<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Ambient Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Clothing Gradient (Teal/Blue) -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Clothing Gradient (Warm Coral/Orange) -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="0" r="140" fill="url(#lampGlow)" />

  <!-- BACKGROUND ENVIRONMENT (Cozy Apartment Interior) -->
  <!-- Wall Art / Window Frame Outline -->
  <rect x="35" y="45" width="50" height="70" rx="4" fill="#334155" opacity="0.4" />
  <rect x="40" y="50" width="40" height="60" rx="2" fill="#1e293b" opacity="0.6" />
  <!-- City night view through window -->
  <circle cx="55" cy="70" r="4" fill="#fbbf24" opacity="0.7" />
  <circle cx="70" cy="90" r="3" fill="#38bdf8" opacity="0.5" />
  <rect x="52" y="95" width="6" height="15" fill="#fbbf24" opacity="0.6" />

  <!-- Bookshelf / Prop in background -->
  <rect x="175" y="65" width="30" height="80" rx="2" fill="#334155" opacity="0.5" />
  <line x1="175" y1="90" x2="205" y2="90" stroke="#1e293b" stroke-width="2" />
  <line x1="175" y1="115" x2="205" y2="115" stroke="#1e293b" stroke-width="2" />
  <!-- Colorful books on shelf -->
  <rect x="180" y="75" width="6" height="15" fill="#f43f5e" rx="1" />
  <rect x="188" y="72" width="5" height="18" fill="#10b981" rx="1" />
  <rect x="195" y="77" width="7" height="13" fill="#fbbf24" rx="1" />

  <!-- House Plant -->
  <path d="M 200 160 Q 210 160 215 145 Q 220 160 230 160" fill="#334155" />
  <path d="M 215 145 C 210 125 190 120 185 110 C 195 125 215 130 215 145 Z" fill="#10b981" opacity="0.8" />
  <path d="M 215 145 C 220 120 240 120 245 110 C 235 125 215 135 215 145 Z" fill="#059669" opacity="0.9" />

  <!-- Floor Surface -->
  <rect x="0" y="190" width="240" height="50" fill="url(#floorGrad)" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="1.5" opacity="0.5" />

  <!-- WARM LIGHT SPOT ON FLOOR -->
  <ellipse cx="120" cy="190" rx="70" ry="12" fill="#fbbf24" opacity="0.1" />


  <!-- MAIN CHARACTERS: FRIENDLY EMBRACE (拥抱) -->
  <g id="hugging-friends">
    <!-- Drop Shadow for Characters -->
    <ellipse cx="120" cy="193" rx="42" ry="7" fill="#000000" opacity="0.4" />

    <!-- CHARACTER 1 (Left: Teal Shirt, Dark Hair) -->
    <g id="character-left">
      <!-- Legs & Shoes -->
      <rect x="92" y="165" width="10" height="28" rx="5" fill="#334155" />
      <ellipse cx="97" cy="192" rx="7" ry="4" fill="#0f172a" />
      
      <!-- Torso (Leaning slightly right) -->
      <path d="M 90 120 L 118 125 L 115 168 L 90 168 Z" fill="url(#shirt1)" />
      
      <!-- Head -->
      <circle cx="95" cy="98" r="15" fill="#fbcfe8" />
      <!-- Hair (Dark Brown) -->
      <path d="M 80 98 C 80 86 90 82 102 85 C 108 87 110 93 110 98 C 105 92 90 90 80 98 Z" fill="#334155" />
      
      <!-- Left Arm wrapping around character 2's back -->
      <path d="M 105 130 C 120 135 135 138 148 132 C 142 142 120 142 105 138 Z" fill="#0284c7" />
      <circle cx="148" cy="132" r="5" fill="#fbcfe8" /> <!-- Hand on back -->
    </g>

    <!-- CHARACTER 2 (Right: Orange Shirt, Blonde/Light Hair) -->
    <g id="character-right">
      <!-- Legs & Shoes -->
      <rect x="138" y="165" width="10" height="28" rx="5" fill="#1e293b" />
      <ellipse cx="143" cy="192" rx="7" ry="4" fill="#0f172a" />
      
      <!-- Torso (Leaning slightly left into hug) -->
      <path d="M 150 120 L 122 125 L 125 168 L 150 168 Z" fill="url(#shirt2)" />
      
      <!-- Head (Tucked close in happiness) -->
      <circle cx="145" cy="100" r="15" fill="#fde68a" />
      <!-- Hair (Warm Auburn/Blonde) -->
      <path d="M 132 93 C 135 84 148 83 158 90 C 160 97 155 102 155 102 C 155 102 152 90 140 92 Z" fill="#b45309" />
      
      <!-- Right Arm wrapping around character 1's back -->
      <path d="M 135 130 C 120 135 105 138 92 132 C 98 142 120 142 135 138 Z" fill="#c2410c" />
      <circle cx="92" cy="132" r="5" fill="#fde68a" /> <!-- Hand on back -->
    </g>

    <!-- EMOTIONAL DETAILS / EXPRESSIONS (Closed happy eyes, rosy cheeks) -->
    <!-- Char 1 Face Details -->
    <path d="M 90 98 Q 94 102 98 98" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <circle cx="87" cy="101" r="3" fill="#fda4af" opacity="0.6" />

    <!-- Char 2 Face Details -->
    <path d="M 142 100 Q 146 104 150 100" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <circle cx="153" cy="103" r="3" fill="#fca5a5" opacity="0.6" />

    <!-- Floating Joy/Warmth Sparkles (Reflecting connection) -->
    <path d="M 120 72 L 122 78 L 128 80 L 122 82 L 120 88 L 118 82 L 112 80 L 118 78 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M 85 115 L 86 118 L 89 119 L 86 120 L 85 123 L 84 120 L 81 119 L 84 118 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M 155 112 L 156 114 L 158 115 L 156 116 L 155 118 L 154 116 L 152 115 L 154 114 Z" fill="#fb923c" opacity="0.8" />
  </g>

</svg>