<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient for Night Storm -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Window Light Beam / Flash -->
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Window Frame Shadow -->
    <linearGradient id="outsideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Room Background -->
  <!-- Wallpaper pattern or subtle tone -->
  <rect x="0" y="0" width="240" height="190" fill="#1e293b" rx="24"/>
  <rect x="0" y="150" width="240" height="90" fill="#0f172a"/>
  
  <!-- Floor line -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#334155" stroke-width="2"/>

  <!-- Window Frame & View to Storm (Center-Left / Back) -->
  <g transform="translate(25, 25)">
    <!-- Outside Night Sky View -->
    <rect x="0" y="0" width="85" height="130" rx="4" fill="url(#outsideGrad)"/>
    
    <!-- Distant City Silhouette / Trees -->
    <path d="M0 130 L0 110 L8 105 L12 112 L18 100 L25 108 L32 95 L40 102 L48 90 L55 105 L62 98 L70 107 L78 96 L85 103 L85 130 Z" fill="#090d16"/>

    <!-- Lightning Flash inside Window -->
    <path d="M45 10 L30 50 L50 55 L35 95 L65 40 L45 35 Z" fill="#ffffff" opacity="0.85"/>
    <rect x="0" y="0" width="85" height="130" fill="url(#flashGrad)" opacity="0.3"/>

    <!-- Window Pane Frame (White/Wood) -->
    <rect x="0" y="0" width="85" height="130" fill="none" stroke="#64748b" stroke-width="4" rx="4"/>
    <!-- Window Cross Bars -->
    <line x1="42.5" y1="0" x2="42.5" y2="130" stroke="#64748b" stroke-width="3"/>
    <line x1="0" y1="65" x2="85" y2="65" stroke="#64748b" stroke-width="3"/>
    
    <!-- Window Sill -->
    <rect x="-4" y="130" width="93" height="8" rx="2" fill="#475569"/>
    <!-- Small potted plant on window sill -->
    <path d="M60 118 L70 118 L68 130 L62 130 Z" fill="#fb923c"/>
    <circle cx="65" cy="114" r="7" fill="#10b981"/>
    <circle cx="61" cy="110" r="5" fill="#34d399"/>
    <circle cx="69" cy="111" r="5" fill="#059669"/>
  </g>

  <!-- Hanging Pendant Lamp (Warm light source casting down) -->
  <path d="M165 0 L175 0 L172 35 L168 35 Z" fill="#64748b"/>
  <path d="M150 35 L190 35 C195 35 197 45 192 48 C185 52 155 52 148 48 C143 45 145 35 150 35 Z" fill="#fbbf24"/>
  
  <!-- Lamp Light Cone / Glow over scene -->
  <polygon points="170,48 240,200 90,200" fill="url(#lampGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Bookshelf / Prop in Background right -->
  <g transform="translate(195, 80)">
    <rect x="0" y="0" width="35" height="80" fill="#334155" rx="2"/>
    <line x1="0" y1="26" x2="35" y2="26" stroke="#1e293b" stroke-width="3"/>
    <line x1="0" y1="53" x2="35" y2="53" stroke="#1e293b" stroke-width="3"/>
    <!-- Books -->
    <rect x="4" y="6" width="6" height="20" fill="#38bdf8" rx="1"/>
    <rect x="12" y="8" width="8" height="18" fill="#f43f5e" rx="1"/>
    <rect x="22" y="5" width="7" height="21" fill="#10b981" rx="1"/>
    <rect x="5" y="33" width="10" height="20" fill="#fbbf24" rx="1"/>
    <rect x="17" y="35" width="12" height="18" fill="#a855f7" rx="1"/>
  </g>

  <!-- Cozy Armchair -->
  <g transform="translate(115, 115)">
    <!-- Chair Back -->
    <path d="M15 10 C15 -5 65 -5 65 10 L70 75 C70 80 65 85 60 85 L20 85 C15 85 10 80 10 75 Z" fill="#3b82f6"/>
    <!-- Chair Seat Cushion -->
    <rect x="5" y="65" width="70" height="25" rx="8" fill="#2563eb"/>
    <!-- Chair Arms -->
    <path d="M0 45 C0 35 15 35 18 45 L18 80 C18 85 12 88 5 85 C0 82 0 75 0 45 Z" fill="#1d4ed8"/>
    <path d="M75 45 C75 35 60 35 57 45 L57 80 C57 85 63 88 70 85 C75 82 75 75 75 45 Z" fill="#1d4ed8"/>
  </g>

  <!-- Main Character (Cozy, slightly startled by thunder, holding mug and pet) -->
  <g transform="translate(125, 110)">
    <!-- Character Body & Sweater -->
    <path d="M25 35 C20 35 15 45 18 65 L42 65 C45 45 40 35 35 35 Z" fill="url(#sweaterGrad)"/>
    
    <!-- Head & Face (Slightly surprised/concerned expression looking towards window) -->
    <circle cx="30" cy="18" r="13" fill="#fde68a"/>
    
    <!-- Hair -->
    <path d="M17 18 C17 8 23 5 30 5 C38 5 43 9 43 18 C43 20 42 22 42 22 C42 22 39 12 30 13 C21 14 18 22 17 18 Z" fill="#78350f"/>

    <!-- Expressive Eyes (Wide with surprise) -->
    <circle cx="26" cy="17" r="1.5" fill="#1e293b"/>
    <circle cx="34" cy="17" r="1.5" fill="#1e293b"/>
    <!-- Surprised open mouth -->
    <ellipse cx="30" cy="23" rx="2" ry="2.5" fill="#991b1b"/>

    <!-- Cozy Mug held in hands -->
    <rect x="33" y="50" width="10" height="12" rx="3" fill="#f8fafc"/>
    <path d="M43 53 C46 53 46 58 43 59" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Steam from hot drink -->
    <path d="M36 45 C38 42 36 39 38 36" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M40 46 C42 43 40 40 42 37" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Cute Cat curled up on character's lap -->
    <g transform="translate(15, 58)">
      <!-- Cat body -->
      <ellipse cx="15" cy="14" rx="12" ry="9" fill="#fb923c"/>
      <!-- Cat Head -->
      <circle cx="8" cy="10" r="7" fill="#fb923c"/>
      <!-- Cat Ears -->
      <polygon points="4,5 7,2 9,8" fill="#f97316"/>
      <polygon points="9,5 11,2 13,8" fill="#f97316"/>
      <!-- Cat Tail curled around -->
      <path d="M24 18 C28 18 29 10 24 8" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
      <!-- Sleeping/calm face lines -->
      <path d="M6 10 Q7 12 8 10" fill="none" stroke="#7c2d12" stroke-width="1" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Side Table with Lamp Base and Book -->
  <g transform="translate(85, 155)">
    <rect x="0" y="0" width="40" height="30" rx="3" fill="#475569"/>
    <!-- Table Legs -->
    <line x1="6" y1="30" x2="4" y2="45" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="34" y1="30" x2="36" y2="45" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Small alarm clock / items on table -->
    <circle cx="20" cy="-4" r="6" fill="#e2e8f0"/>
    <circle cx="20" cy="-4" r="4" fill="#0f172a"/>
  </g>

  <!-- Dramatic Lightning Strike Bolt traversing the window background -->
  <g transform="translate(25, 25)">
    <polygon points="48,0 32,42 50,45 34,92 64,38 46,35" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Indoor Ambient lighting highlights on floor/furniture edges -->
  <path d="M0 185 L240 185" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
</svg>