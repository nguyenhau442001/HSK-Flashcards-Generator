<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="deskGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Background room details: bookshelves, ambient light -->
  <g opacity="0.3">
    <!-- Bookshelf verticals & horizontals -->
    <rect x="25" y="40" width="80" height="110" rx="2" fill="none" stroke="#64748b" stroke-width="2" />
    <line x1="25" y1="75" x2="105" y2="75" stroke="#64748b" stroke-width="2" />
    <line x1="25" y1="110" x2="105" y2="110" stroke="#64748b" stroke-width="2" />
    <!-- Books -->
    <rect x="35" y="50" width="8" height="25" fill="#475569" />
    <rect x="45" y="48" width="12" height="27" fill="#38bdf8" />
    <rect x="60" y="53" width="7" height="22" fill="#fb923c" />
    <rect x="75" y="50" width="15" height="25" fill="#10b981" />

    <rect x="35" y="85" width="10" height="25" fill="#ec4899" />
    <rect x="48" y="88" width="8" height="22" fill="#fbbf24" />
    <rect x="65" y="82" width="14" height="28" fill="#475569" />
  </g>

  <!-- Connection beam / energy glowing lines linking the two documents/problems -->
  <g filter="url(#softGlow)">
    <path d="M 85 130 C 105 95, 135 95, 155 130" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4" opacity="0.8"/>
    <path d="M 85 135 C 105 105, 135 105, 155 135" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 15 180 L 225 180 L 210 215 L 30 215 Z" fill="url(#deskGradient)" />
  <path d="M 15 180 L 225 180 L 225 184 L 15 184 Z" fill="#475569" />

  <!-- Document 1 (Problem A) on Left -->
  <g transform="translate(50, 115) rotate(-8)">
    <rect x="0" y="0" width="42" height="54" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Mini icons on doc -->
    <circle cx="10" cy="10" r="4" fill="#38bdf8" />
    <line x1="18" y1="9" x2="34" y2="9" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="22" x2="34" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="30" x2="28" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="38" x2="32" y2="38" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Document 2 (Problem B) on Right -->
  <g transform="translate(145, 110) rotate(6)">
    <rect x="0" y="0" width="42" height="54" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Mini icons on doc -->
    <circle cx="10" cy="10" r="4" fill="#fbbf24" />
    <line x1="18" y1="9" x2="34" y2="9" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="22" x2="34" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="30" x2="28" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="38" x2="32" y2="38" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Magnifying glass / analyst character focal point in center-back -->
  <!-- Floating Glowing Link Node (Representing "Related / Connection") -->
  <g transform="translate(120, 100)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <!-- Interlocking chain links icon -->
    <path d="M -5 3 L -2 6 C 1 9, 5 9, 8 6 L 9 5 C 12 2, 12 -2, 9 -5 L 7 -7" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M 5 -3 L 2 -6 C -1 -9, -5 -9, -8 -6 L -9 -5 C -12 -2, -12 2, -9 5 L -7 7" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Character: Curious / Thinking Analyst leaning over desk -->
  <!-- Body / Torso -->
  <path d="M 95 180 C 95 155, 110 140, 120 140 C 130 140, 145 155, 145 180 Z" fill="#0284c7" />
  <!-- Collar / Shirt details -->
  <path d="M 110 140 L 120 155 L 130 140 Z" fill="#f8fafc" />

  <!-- Neck -->
  <rect x="114" y="128" width="12" height="16" fill="#fbcfe8" rx="4" />

  <!-- Head -->
  <circle cx="120" cy="105" r="22" fill="#fbcfe8" />
  
  <!-- Hair (Stylish dark brown flat style) -->
  <path d="M 98 105 C 98 90, 110 80, 122 80 C 136 80, 143 92, 143 108 L 143 115 L 138 110 C 135 95, 125 90, 120 90 C 110 90, 102 98, 100 108 Z" fill="#334155" />

  <!-- Face expressions: thoughtful/realizing eyes, smile -->
  <!-- Glasses -->
  <circle cx="112" cy="104" r="6" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="128" cy="104" r="6" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <line x1="118" y1="104" x2="122" y2="104" stroke="#cbd5e1" stroke-width="2" />

  <!-- Eyebrows (curious arch) -->
  <path d="M 106 94 Q 112 90, 118 95" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <path d="M 122 95 Q 128 90, 134 94" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M 115 116 Q 120 120, 125 116" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Arms reaching out to both documents -->
  <!-- Left arm -->
  <path d="M 100 155 C 80 150, 70 140, 60 135" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
  <!-- Left hand -->
  <circle cx="58" cy="134" r="5" fill="#fbcfe8" />

  <!-- Right arm -->
  <path d="M 140 155 C 160 150, 170 140, 180 135" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
  <!-- Right hand -->
  <circle cx="182" cy="134" r="5" fill="#fbcfe8" />

  <!-- Foreground props on desk: Coffee mug -->
  <g transform="translate(185, 160)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M 16 4 C 21 4, 21 14, 16 14" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 5 -4 C 5 -8, 9 -8, 9 -12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Pen holder -->
  <rect x="30" y="160" width="14" height="20" rx="2" fill="#cbd5e1" />
  <line x1="33" y1="160" x2="30" y2="148" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
  <line x1="39" y1="160" x2="42" y2="145" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="36" y1="160" x2="36" y2="150" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

</svg>