<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311033" />
    </linearGradient>

    <!-- Warm Golden Glow for Lanterns/Lights -->
    <radialGradient id="goldenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Romantic Pink Glow -->
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>

    <!-- Lantern Core Gradient -->
    <linearGradient id="lanternGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Bench Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Background Elements (Distant City/Park) -->
  <g opacity="0.15">
    <circle cx="60" cy="80" r="40" fill="#38bdf8" />
    <circle cx="180" cy="70" r="50" fill="#ec4899" />
    <!-- Distant architecture lines -->
    <rect x="20" y="120" width="30" height="100" fill="#94a3b8" />
    <rect x="60" y="100" width="40" height="120" fill="#94a3b8" />
    <rect x="150" y="110" width="35" height="110" fill="#94a3b8" />
    <rect x="190" y="90" width="30" height="130" fill="#94a3b8" />
  </g>

  <!-- Atmospheric Glows -->
  <circle cx="120" cy="90" r="80" fill="url(#goldenGlow)" />
  <circle cx="120" cy="130" r="60" fill="url(#pinkGlow)" />

  <!-- Cherry Blossom / Foliage Arches (Frame the scene) -->
  <g fill="#f43f5e">
    <!-- Top Left Foliage -->
    <path d="M0,0 Q30,10 50,35 Q20,40 0,20 Z" opacity="0.8"/>
    <circle cx="35" cy="15" r="12" opacity="0.7"/>
    <circle cx="15" cy="30" r="10" opacity="0.6"/>
    <!-- Top Right Foliage -->
    <path d="M240,0 Q210,10 190,35 Q220,40 240,20 Z" opacity="0.8"/>
    <circle cx="205" cy="15" r="12" opacity="0.7"/>
    <circle cx="225" cy="30" r="10" opacity="0.6"/>
  </g>

  <!-- Hanging Lanterns -->
  <g filter="url(#softShadow)">
    <!-- Left Lantern String & Lantern -->
    <line x1="50" y1="0" x2="50" y2="45" stroke="#475569" stroke-width="1.5" />
    <path d="M42,45 C42,40 58,40 58,45 L55,75 C55,78 45,78 45,75 Z" fill="url(#lanternGrad)" />
    <ellipse cx="50" cy="45" rx="8" ry="3" fill="#fbbf24" />
    <ellipse cx="50" cy="75" rx="5" ry="2" fill="#fbbf24" />
    <line x1="50" y1="75" x2="50" y2="85" stroke="#fbbf24" stroke-width="1" />
    
    <!-- Right Lantern String & Lantern -->
    <line x1="190" y1="0" x2="190" y2="35" stroke="#475569" stroke-width="1.5" />
    <path d="M182,35 C182,30 198,30 198,35 L195,65 C195,68 185,68 185,65 Z" fill="url(#lanternGrad)" />
    <ellipse cx="190" cy="35" rx="8" ry="3" fill="#fbbf24" />
    <ellipse cx="190" cy="65" rx="5" ry="2" fill="#fbbf24" />
    <line x1="190" y1="65" x2="190" y2="75" stroke="#fbbf24" stroke-width="1" />
  </g>

  <!-- Ground / Pavement Base -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" />
  <path d="M0,210 Q120,205 240,210 L240,240 L0,240 Z" fill="#1e293b" />
  <!-- Paving Stone Details -->
  <line x1="40" y1="210" x2="20" y2="240" stroke="#334155" stroke-width="1" opacity="0.5" />
  <line x1="100" y1="210" x2="80" y2="240" stroke="#334155" stroke-width="1" opacity="0.5" />
  <line x1="160" y1="210" x2="150" y2="240" stroke="#334155" stroke-width="1" opacity="0.5" />
  <line x1="210" y1="210" x2="210" y2="240" stroke="#334155" stroke-width="1" opacity="0.5" />

  <!-- Park Bench -->
  <g filter="url(#softShadow)">
    <!-- Bench Legs -->
    <rect x="75" y="180" width="6" height="35" rx="2" fill="#334155" />
    <rect x="159" y="180" width="6" height="35" rx="2" fill="#334155" />
    <!-- Bench Seat -->
    <rect x="65" y="180" width="110" height="8" rx="2" fill="url(#woodGrad)" />
    <rect x="60" y="190" width="120" height="6" rx="2" fill="url(#woodGrad)" />
    <!-- Bench Backrest Supports -->
    <path d="M75,180 L75,140" stroke="#334155" stroke-width="5" stroke-linecap="round" />
    <path d="M165,180 L165,140" stroke="#334155" stroke-width="5" stroke-linecap="round" />
    <!-- Bench Backrest Planks -->
    <rect x="65" y="145" width="110" height="7" rx="2" fill="url(#woodGrad)" />
    <rect x="65" y="156" width="110" height="7" rx="2" fill="url(#woodGrad)" />
    <rect x="65" y="167" width="110" height="7" rx="2" fill="url(#woodGrad)" />
  </g>

  <!-- Central Romantic Figures (Couple on a Bench) -->
  <g filter="url(#softShadow)">
    <!-- Left Figure (Person 1 - leans in gently) -->
    <!-- Legs -->
    <rect x="90" y="188" width="14" height="25" rx="5" fill="#3b82f6" />
    <!-- Torso -->
    <path d="M85,150 C85,140 105,140 105,150 L112,185 C112,190 85,190 85,185 Z" fill="#6366f1" />
    <!-- Head -->
    <circle cx="98" cy="128" r="11" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M87,126 C86,115 110,115 109,126 C105,122 92,122 87,126 Z" fill="#1e293b" />
    <!-- Arm reaching out / holding hand -->
    <path d="M100,155 Q115,160 125,155" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" />

    <!-- Right Figure (Person 2 - leaning on shoulder/holding hand) -->
    <!-- Legs -->
    <rect x="136" y="188" width="14" height="25" rx="5" fill="#f43f5e" />
    <!-- Torso -->
    <path d="M130,150 C130,140 150,140 150,150 L155,185 C155,190 128,190 130,185 Z" fill="#fb7185" />
    <!-- Head (Tilted slightly towards Person 1) -->
    <circle cx="138" cy="127" r="11" fill="#fbcfe8" />
    <!-- Hair (Longer style) -->
    <path d="M127,125 C126,114 150,114 149,125 C149,135 135,138 132,142 C130,135 127,130 127,125 Z" fill="#451a03" />
    <!-- Arm touching/holding -->
    <path d="M135,155 Q128,160 125,155" fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Floating Glowing Hearts (Representing 'Tình Yêu' / Love) -->
  <g filter="url(#glow)">
    <!-- Large Center-Top Heart -->
    <path d="M120,95 C120,85 105,75 95,90 C85,105 120,125 120,125 C120,125 155,105 145,90 C135,75 120,85 120,95 Z" 
          fill="#ef4444" transform="translate(0, -10) scale(1.1)" transform-origin="120 95" />
    
    <!-- Medium Floating Heart Left -->
    <path d="M75,105 C75,98 65,92 58,102 C52,112 75,125 75,125 C75,125 98,112 92,102 C85,92 75,98 75,105 Z" 
          fill="#f43f5e" opacity="0.9" transform="scale(0.8)" transform-origin="75 105" />

    <!-- Small Floating Heart Right -->
    <path d="M170,115 C170,108 162,102 156,112 C150,122 170,132 170,132 C170,132 190,122 184,112 C178,102 170,108 170,115 Z" 
          fill="#fb7185" opacity="0.9" transform="scale(0.7)" transform-origin="170 115" />

    <!-- Tiny Accent Hearts -->
    <path d="M105,65 Q100,58 95,65 Q90,72 105,80 Q120,72 115,65 Q110,58 105,65 Z" fill="#fecdd3" opacity="0.7" />
    <path d="M140,75 Q136,70 132,75 Q128,80 140,86 Q152,80 148,75 Q144,70 140,75 Z" fill="#fecdd3" opacity="0.8" />
  </g>

  <!-- Extra Sparkles / Magic atmosphere -->
  <g fill="#fbbf24">
    <circle cx="85" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="155" cy="65" r="2" opacity="0.9"/>
    <circle cx="105" cy="45" r="1" opacity="0.7"/>
    <circle cx="135" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="65" cy="140" r="1" opacity="0.6"/>
    <circle cx="175" cy="150" r="1.5" opacity="0.7"/>
  </g>
</svg>