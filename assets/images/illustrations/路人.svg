<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Ground -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 190 L240 190" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Background Buildings -->
  <rect x="20" y="80" width="60" height="110" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="160" y="60" width="60" height="130" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="35" y="100" width="10" height="20" fill="#f59e0b" opacity="0.6"/>
  <rect x="175" y="80" width="10" height="20" fill="#f59e0b" opacity="0.6"/>
  
  <!-- Passerby (The 路人) -->
  <g transform="translate(160, 120)">
    <circle cx="10" cy="10" r="10" fill="#fb923c"/>
    <path d="M10 20 L10 50 M10 30 L0 40 M10 30 L20 40 M10 50 L0 75 M10 50 L20 75" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Questioner -->
  <g transform="translate(60, 120)">
    <circle cx="10" cy="10" r="10" fill="#38bdf8"/>
    <path d="M10 20 L10 50 M10 30 L20 40 M10 30 L0 40 M10 50 L20 75 M10 50 L0 75" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Gesture -->
    <circle cx="35" cy="35" r="3" fill="#ffffff"/>
    <path d="M15 30 L35 35" stroke="#38bdf8" stroke-width="3"/>
  </g>
  
  <!-- Map/Direction Icon -->
  <path d="M100 100 L120 100 L110 80 Z" fill="#ec4899"/>
  <circle cx="110" cy="110" r="5" fill="#ec4899"/>
  <path d="M110 115 L110 125" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Street Lamp -->
  <rect x="210" y="40" width="4" height="150" fill="#94a3b8"/>
  <circle cx="212" cy="40" r="10" fill="#f59e0b" opacity="0.3"/>
  <circle cx="212" cy="40" r="5" fill="#fbbf24"/>
</svg>