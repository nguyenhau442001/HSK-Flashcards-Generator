<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Night-Mode Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Office / Workplace Interior -->
  <!-- Window showing night city -->
  <g opacity="0.6">
    <rect x="150" y="20" width="70" height="90" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <line x1="185" y1="20" x2="185" y2="110" stroke="#334155" stroke-width="1.5"/>
    <line x1="150" y1="65" x2="220" y2="65" stroke="#334155" stroke-width="1.5"/>
    <!-- City lights through window -->
    <rect x="158" y="30" width="10" height="15" fill="#f59e0b" opacity="0.6"/>
    <rect x="200" y="45" width="12" height="25" fill="#38bdf8" opacity="0.5"/>
    <rect x="165" y="80" width="14" height="20" fill="#f59e0b" opacity="0.4"/>
  </g>

  <!-- Bookshelf / Prop in background -->
  <rect x="20" y="30" width="40" height="80" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="55" x2="60" y2="55" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="80" x2="60" y2="80" stroke="#334155" stroke-width="2"/>
  <rect x="26" y="38" width="8" height="17" fill="#fb923c" rx="1"/>
  <rect x="36" y="40" width="6" height="15" fill="#38bdf8" rx="1"/>
  <rect x="28" y="62" width="12" height="18" fill="#10b981" rx="1"/>

  <!-- Office Desk Surface -->
  <path d="M10 180 L230 180 L220 220 L20 220 Z" fill="url(#deskGrad)"/>
  <line x1="10" y1="180" x2="230" y2="180" stroke="#475569" stroke-width="3"/>

  <!-- Desk Props: Laptop -->
  <path d="M70 160 L130 160 L140 180 L60 180 Z" fill="#64748b"/>
  <rect x="75" y="125" width="50" height="35" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <!-- Warning Screen Visual (Red Cross / Alert representation) -->
  <rect x="80" y="130" width="40" height="25" rx="2" fill="#1e1b4b"/>
  <!-- Glowing warning icon on screen -->
  <circle cx="100" cy="142" r="8" fill="#ef4444" opacity="0.2"/>
  <path d="M95 137 L105 147 M105 137 L95 147" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Coffee Mug -->
  <rect x="145" y="155" width="14" height="18" rx="2" fill="#cbd5e1"/>
  <path d="M159 160 C164 160, 164 170, 159 170" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Main Character: Stressed Employee/Citizen caught breaking the rule -->
  <g transform="translate(0, 5)">
    <!-- Body / Torso (Blue button-down shirt) -->
    <path d="M100 135 C95 125, 95 110, 110 100 L135 100 C150 110, 150 125, 145 135 L155 185 L90 185 Z" fill="#3b82f6"/>
    <!-- Collar -->
    <path d="M110 100 L117 115 L122 105 L127 115 L135 100" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Head & Face -->
    <circle cx="122.5" cy="80" r="18" fill="#ffedd5"/>
    <!-- Hair (Dark modern cut) -->
    <path d="M105 80 C105 65, 115 60, 125 60 C138 60, 142 70, 140 82 C135 78, 130 75, 122 75 C115 75, 108 78, 105 80 Z" fill="#1e293b"/>
    
    <!-- Shocked/Caught Expression -->
    <!-- Eyes (Wide with surprise) -->
    <circle cx="116" cy="79" r="3" fill="#1e293b"/>
    <circle cx="130" cy="79" r="3" fill="#1e293b"/>
    <!-- Eyebrows raised -->
    <path d="M113 73 Q116 70 119 73" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M127 73 Q130 70 133 73" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Open mouth (gasping) -->
    <ellipse cx="123" cy="89" rx="3.5" ry="5" fill="#991b1b"/>

    <!-- Arms in defensive/guilty posture -->
    <!-- Left Arm (Raised, hand up in "stop/oops" gesture) -->
    <path d="M102 110 L75 105 L70 90" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="68" cy="87" r="5" fill="#ffedd5"/>

    <!-- Right Arm (Pulling back near chest) -->
    <path d="M143 110 L160 125 L150 140" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="147" cy="144" r="5" fill="#ffedd5"/>
  </g>

  <!-- Big Red "Violation / Rule Broken" Visual Indicator Element (Contextual, No Text) -->
  <g transform="translate(180, 50)" filter="url(#glow)">
    <!-- Glowing red warning badge representing "Violation of Rules" -->
    <circle cx="0" cy="0" r="22" fill="#ef4444" opacity="0.2"/>
    <circle cx="0" cy="0" r="16" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
    <!-- White prohibition/violation symbol (slashed circle / cross) -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Official Document / Rulebook with Red Stamp (Representing "Regulations/Rules") -->
  <g transform="translate(35, 130) rotate(-12)">
    <rect x="0" y="0" width="36" height="48" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Fake text lines on document -->
    <line x1="6" y1="8" x2="26" y2="8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="30" y2="14" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="20" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Big Red Violation Stamp Overlay on Document -->
    <circle cx="22" cy="32" r="10" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.85"/>
    <path d="M16 26 L28 38 M28 26 L16 38" stroke="#dc2626" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>

</svg>