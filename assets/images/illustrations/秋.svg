<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Autumn Sunset Glow -->
    <radialGradient id="sunGlow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Maple Leaf Gradient 1 -->
    <linearGradient id="leafGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Maple Leaf Gradient 2 -->
    <linearGradient id="leafOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Maple Leaf Gradient 3 -->
    <linearGradient id="leafRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Tree Trunk Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Distant Background Hills/Mountains -->
  <path d="M-20 190 Q 50 140 120 170 T 260 160 L 260 240 L -20 240 Z" fill="#334155" opacity="0.6" />
  <path d="M-10 200 Q 80 160 160 185 T 250 175 L 250 240 L -10 240 Z" fill="#475569" opacity="0.8" />

  <!-- Ground / Park Terrain -->
  <path d="M-10 210 Q 70 180 150 200 T 250 190 L 250 240 L -10 240 Z" fill="#78350f" />
  <path d="M-10 215 Q 90 190 200 205 T 250 200 L 250 240 L -10 240 Z" fill="#92400e" />

  <!-- Park Bench Backdrop elements (Romantic Autumn Vibe) -->
  <g transform="translate(150, 160)">
    <!-- Bench Legs -->
    <rect x="10" y="25" width="4" height="20" fill="#1e293b" />
    <rect x="35" y="25" width="4" height="20" fill="#1e293b" />
    <!-- Bench Seat -->
    <rect x="5" y="20" width="40" height="5" rx="2" fill="#b45309" />
    <!-- Bench Backrest -->
    <rect x="5" y="5" width="40" height="12" rx="2" fill="#d97706" />
    <rect x="8" y="7" width="34" height="3" rx="1" fill="#f59e0b" opacity="0.4" />
  </g>

  <!-- Large Autumn Tree Trunk & Branches -->
  <g id="tree">
    <!-- Main Trunk -->
    <path d="M 50 220 Q 55 140 70 90 L 95 90 Q 85 140 80 220 Z" fill="url(#trunkGrad)" />
    <!-- Root flare -->
    <path d="M 35 220 Q 50 205 60 220 Z" fill="#451a03" />
    <path d="M 75 220 Q 85 205 100 220 Z" fill="#451a03" />

    <!-- Branch Left -->
    <path d="M 65 120 Q 40 100 25 85 Q 22 83 25 80 Q 40 95 72 110 Z" fill="url(#trunkGrad)" />
    <!-- Branch Right -->
    <path d="M 80 105 Q 110 80 130 65 Q 133 63 135 66 Q 115 80 85 100 Z" fill="url(#trunkGrad)" />
    <!-- Branch Top -->
    <path d="M 78 90 Q 85 60 95 45 Q 98 43 100 46 Q 90 60 83 88 Z" fill="url(#trunkGrad)" />
  </g>

  <!-- Lush Autumn Canopy (Stacked Organic Blobs of Gold/Orange/Red) -->
  <g id="canopy" opacity="0.95">
    <!-- Outer glow/shadow canopy -->
    <circle cx="85" cy="65" r="50" fill="#b45309" />
    <circle cx="45" cy="80" r="35" fill="#c2410c" />
    <circle cx="115" cy="75" r="40" fill="#d97706" />
    
    <!-- Mid tone vibrant canopy -->
    <circle cx="75" cy="55" r="45" fill="url(#leafOrange)" />
    <circle cx="40" cy="85" r="30" fill="url(#leafRed)" />
    <circle cx="110" cy="70" r="35" fill="url(#leafGold)" />
    <circle cx="90" cy="40" r="30" fill="url(#leafGold)" />

    <!-- Highlight fluffy top -->
    <circle cx="70" cy="45" r="25" fill="#fbb6ce" opacity="0.15" />
    <path d="M 45 70 Q 30 50 60 40 Q 80 30 110 50 Q 130 70 115 90 Q 90 110 60 100 Q 35 90 45 70 Z" fill="url(#leafOrange)" opacity="0.8" />
  </g>

  <!-- Action-Packed Falling Leaves & Ground Leaves (Representing "Mùa thu" / Autumn) -->
  <g id="falling-leaves">
    <!-- Leaf 1 (Golden Maple, Top Left) -->
    <g transform="translate(30, 45) rotate(25) scale(0.9)">
      <path d="M0 -12 C 4 -6, 12 -4, 8 2 C 14 6, 8 12, 2 8 C -2 14, -8 10, -4 4 C -12 2, -10 -6, -2 -8 C 0 -14, 0 -14, 0 -12 Z" fill="url(#leafGold)" />
      <path d="M0 -10 L0 10" stroke="#b45309" stroke-width="0.8" />
    </g>

    <!-- Leaf 2 (Red Maple, Mid Air Center) -->
    <g transform="translate(110, 110) rotate(-40) scale(1.2)">
      <path d="M0 -12 C 4 -6, 12 -4, 8 2 C 14 6, 8 12, 2 8 C -2 14, -8 10, -4 4 C -12 2, -10 -6, -2 -8 C 0 -14, 0 -14, 0 -12 Z" fill="url(#leafRed)" />
      <path d="M0 -10 L0 10" stroke="#881337" stroke-width="0.8" />
    </g>

    <!-- Leaf 3 (Orange Maple, Right) -->
    <g transform="translate(175, 85) rotate(15) scale(1)">
      <path d="M0 -12 C 4 -6, 12 -4, 8 2 C 14 6, 8 12, 2 8 C -2 14, -8 10, -4 4 C -12 2, -10 -6, -2 -8 C 0 -14, 0 -14, 0 -12 Z" fill="url(#leafOrange)" />
      <path d="M0 -10 L0 10" stroke="#7c2d12" stroke-width="0.8" />
    </g>

    <!-- Leaf 4 (Small Gold, Floating Lower Right) -->
    <g transform="translate(140, 170) rotate(70) scale(0.7)">
      <path d="M0 -12 C 4 -6, 12 -4, 8 2 C 14 6, 8 12, 2 8 C -2 14, -8 10, -4 4 C -12 2, -10 -6, -2 -8 C 0 -14, 0 -14, 0 -12 Z" fill="url(#leafGold)" />
    </g>

    <!-- Leaf 5 (Red, Floating Lower Left) -->
    <g transform="translate(65, 165) rotate(-15) scale(0.8)">
      <path d="M0 -12 C 4 -6, 12 -4, 8 2 C 14 6, 8 12, 2 8 C -2 14, -8 10, -4 4 C -12 2, -10 -6, -2 -8 C 0 -14, 0 -14, 0 -12 Z" fill="url(#leafRed)" />
    </g>

    <!-- Leaf 6 (Swirling Dynamic Action Leaf) -->
    <g transform="translate(195, 130) rotate(-85) scale(1.1)">
      <path d="M0 -12 C 4 -6, 12 -4, 8 2 C 14 6, 8 12, 2 8 C -2 14, -8 10, -4 4 C -12 2, -10 -6, -2 -8 C 0 -14, 0 -14, 0 -12 Z" fill="url(#leafGold)" />
    </g>
  </g>

  <!-- Fallen Leaves Carpet on the Ground (Rich Texture) -->
  <g id="ground-leaves">
    <path d="M 20 215 C 25 210, 35 212, 30 220 C 20 225, 15 218, 20 215 Z" fill="#fbbf24" />
    <path d="M 45 220 C 52 215, 60 222, 55 228 C 45 230, 40 222, 45 220 Z" fill="#ef4444" />
    <path d="M 85 210 C 95 208, 102 215, 95 222 C 85 220, 80 212, 85 210 Z" fill="#f97316" />
    <path d="M 120 225 C 130 220, 138 228, 130 235 C 120 232, 115 228, 120 225 Z" fill="#fbbf24" />
    <path d="M 160 212 C 170 210, 178 218, 170 225 C 160 222, 155 215, 160 212 Z" fill="#ef4444" />
    <path d="M 190 220 C 200 215, 210 225, 200 232 C 190 230, 185 222, 190 220 Z" fill="#f97316" />
    <path d="M 220 215 C 228 212, 235 220, 225 226 C 218 222, 215 218, 220 215 Z" fill="#fbbf24" />
    <path d="M 100 228 C 110 225, 115 232, 105 235 C 98 233, 95 230, 100 228 Z" fill="#d97706" />
  </g>

  <!-- Atmospheric Light Particles / Wind Swirls -->
  <path d="M 20 90 Q 60 80 100 110" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3" stroke-dasharray="4 8" />
  <path d="M 140 50 Q 180 70 210 100" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.2" stroke-dasharray="3 6" />

  <!-- Foreground Vignette / Framing Border for Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.25" />
</svg>