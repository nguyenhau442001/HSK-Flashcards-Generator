<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Spotlight from Doorway -->
    <linearGradient id="door-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Floor Gradient for depth -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b101b"/>
    </linearGradient>

    <!-- Action Burst Lines Filter or Pattern -->
    <radialGradient id="surprise-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Room Context: Walls & Floor -->
  <!-- Left Wall -->
  <polygon points="0,0 70,30 70,170 0,170" fill="#1b263b"/>
  <!-- Back Wall -->
  <polygon points="70,30 200,30 200,170 70,170" fill="#24344d"/>
  <!-- Floor -->
  <polygon points="0,170 240,170 240,240 0,240" fill="url(#floor-grad)"/>

  <!-- Room Details: Window with night view -->
  <rect x="90" y="45" width="45" height="65" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="112" y1="45" x2="112" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="77" x2="135" y2="77" stroke="#334155" stroke-width="2"/>
  <!-- Night Stars outside window -->
  <circle cx="100" cy="55" r="1" fill="#94a3b8"/>
  <circle cx="125" cy="65" r="1.5" fill="#e2e8f0"/>
  <circle cx="105" cy="95" r="1" fill="#cbd5e1"/>

  <!-- Bookshelf / Prop on Back Wall -->
  <rect x="150" y="50" width="35" height="75" fill="#1e293b" rx="2"/>
  <line x1="150" y1="75" x2="185" y2="75" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="100" x2="185" y2="100" stroke="#334155" stroke-width="2"/>
  <!-- Colorful books on shelf -->
  <rect x="155" y="58" width="6" height="17" fill="#38bdf8" rx="1"/>
  <rect x="163" y="60" width="5" height="15" fill="#f43f5e" rx="1"/>
  <rect x="171" y="56" width="8" height="19" fill="#10b981" rx="1"/>

  <!-- Rug on Floor -->
  <ellipse cx="140" cy="205" rx="55" ry="18" fill="#334155" opacity="0.6"/>
  <ellipse cx="140" cy="203" rx="48" ry="14" fill="#475569" opacity="0.4"/>

  <!-- Desk & Dropped Popcorn Bowl (Surprise Action!) -->
  <!-- Desk/Table -->
  <path d="M 60,140 L 130,140 L 120,185 L 50,185 Z" fill="#334155"/>
  <path d="M 55,140 L 125,140 L 125,145 L 55,145 Z" fill="#475569"/>
  <!-- Desk Legs -->
  <rect x="62" y="185" width="6" height="35" fill="#1e293b"/>
  <rect x="110" y="185" width="6" height="35" fill="#1e293b"/>

  <!-- Chair pushed back rapidly -->
  <g transform="translate(75, 145) rotate(-15)">
    <rect x="0" y="0" width="22" height="24" rx="3" fill="#cbd5e1"/>
    <rect x="4" y="24" width="3" height="22" fill="#64748b"/>
    <rect x="15" y="24" width="3" height="22" fill="#64748b"/>
  </g>

  <!-- Laptop on Desk -->
  <path d="M 80,135 L 105,135 L 110,143 L 75,143 Z" fill="#94a3b8"/>
  <path d="M 77,122 L 108,122 L 105,135 L 80,135 Z" fill="#64748b"/>
  <rect x="85" y="125" width="18" height="8" rx="1" fill="#38bdf8" opacity="0.8"/>

  <!-- Dropped/Flying Popcorn Bowl & Action Elements -->
  <!-- Bowl -->
  <path d="M 100,150 Q 105,162 118,160 Q 128,158 132,150 Z" fill="#f43f5e"/>
  <ellipse cx="116" cy="150" rx="16" ry="4" fill="#fda4af"/>
  <!-- Spilled Popcorns in mid-air -->
  <circle cx="125" cy="138" r="4" fill="#fef08a"/>
  <circle cx="138" cy="142" r="5" fill="#fef08a"/>
  <circle cx="145" cy="130" r="4.5" fill="#fef08a"/>
  <circle cx="133" cy="125" r="3.5" fill="#fef08a"/>
  <circle cx="118" cy="128" r="4" fill="#fef08a"/>
  <!-- Motion blur lines for popcorn -->
  <path d="M 120,145 Q 128,140 135,135" stroke="#fde047" stroke-width="1.5" stroke-dasharray="2,2" fill="none"/>
  <path d="M 115,152 Q 130,145 142,138" stroke="#fde047" stroke-width="1.5" stroke-dasharray="2,2" fill="none"/>

  <!-- OPEN DOORWAY WITH SUDDEN BRIGHT LIGHT -->
  <!-- Door frame dark recess -->
  <polygon points="175,20 235,35 235,215 175,200" fill="#090d16"/>
  <!-- Door light beam projection onto floor and room -->
  <polygon points="175,200 235,215 240,240 140,240" fill="url(#door-light)" opacity="0.6"/>
  
  <!-- Open Door panel hanging/angled -->
  <polygon points="175,20 195,15 195,210 175,200" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <circle cx="188" cy="110" r="2.5" fill="#fbbf24"/>

  <!-- SUDDEN VISITOR / INTRUDER SILHOUETTE / CHARACTER IN DOORWAY -->
  <!-- Surprised Friend arriving suddenly -->
  <g transform="translate(195, 65)">
    <!-- Body / Torso (leaning forward excitedly/suddenly) -->
    <path d="M 10,25 Q 22,35 15,65 L 35,65 Q 28,35 32,25 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="18" cy="12" r="11" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 8,10 Q 15,0 26,8 Q 28,12 25,14 Q 18,5 10,12 Z" fill="#1e293b"/>
    <!-- Surprised/Excited Arm waving -->
    <path d="M 28,30 Q 42,20 48,28" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="48" cy="28" r="3.5" fill="#fed7aa"/>
    <!-- Back arm -->
    <path d="M 15,35 Q 5,45 10,55" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Legs stepping in -->
    <path d="M 20,65 L 15,100 L 25,105" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 30,65 L 38,95 L 48,98" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- MAIN CHARACTER (SHOCKED/SURPRISED AT DESK) -->
  <g transform="translate(68, 85)">
    <!-- Chair back & Body posture leaning backward in shock -->
    <!-- Shocked Character Torso -->
    <path d="M 15,20 Q 28,25 32,55 L 8,55 Q 10,30 12,20 Z" fill="#10b981"/>
    
    <!-- Shocked Head leaning back -->
    <circle cx="22" cy="5" r="13" fill="#ffedd5"/>
    <!-- Spiky / Sticking up hair from surprise -->
    <path d="M 9,2 Q 15,-8 24,-3 Q 32,-10 35,2 Q 33,8 28,4 Q 20,0 14,7 Z" fill="#334155"/>

    <!-- Wide Surprised Eyes & Open Mouth ("O" shape) -->
    <circle cx="17" cy="4" r="2" fill="#0f172a"/>
    <circle cx="27" cy="4" r="2" fill="#0f172a"/>
    <!-- Eyebrows raised high -->
    <path d="M 14,-1 Q 17,-4 20,-1" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 24,-1 Q 27,-4 30,-1" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Open Mouth of surprise -->
    <ellipse cx="22" cy="11" rx="3.5" ry="4.5" fill="#7f1d1d"/>

    <!-- Arms flung up in sudden surprise -->
    <!-- Left arm flung up -->
    <path d="M 12,25 Q -2,15 -8,5" stroke="#ffedd5" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <circle cx="-8" cy="5" r="3" fill="#ffedd5"/>
    <!-- Right arm flung up -->
    <path d="M 28,28 Q 44,22 46,10" stroke="#ffedd5" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <circle cx="46" cy="10" r="3" fill="#ffedd5"/>
  </g>

  <!-- ACTION & SURPRISE EFFECTS (EXCLAMATION & SHOCKWAVES) -->
  <!-- Sudden Burst sparkles near head -->
  <g transform="translate(85, 80)">
    <!-- Star sparkles -->
    <path d="M 0,-10 L 2,-3 L 9,-5 L 3,0 L 7,6 L 0,3 L -5,7 L -2,1 L -9,-2 L -2,-3 Z" fill="#fbbf24" transform="scale(0.6)"/>
  </g>
  <g transform="translate(170, 50)">
    <path d="M 0,-10 L 2,-3 L 9,-5 L 3,0 L 7,6 L 0,3 L -5,7 L -2,1 L -9,-2 L -2,-3 Z" fill="#38bdf8" transform="scale(0.5)"/>
  </g>

  <!-- Dynamic Shock lines near the door entrance -->
  <path d="M 165,40 L 155,45" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 168,70 L 158,72" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 166,110 L 154,108" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Subtle lighting vignette -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
</svg>