<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Gradient for Benefits/Energy -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Apple Body Gradient -->
    <linearGradient id="appleGrad" x1="30%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Apple Highlight -->
    <linearGradient id="appleHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <!-- Dumbbell Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Background Shapes / Depth Elements -->
  <circle cx="120" cy="120" r="90" fill="url(#glowGrad)" />

  <!-- Background Environment Details (Window / Light Beams) -->
  <path d="M40 0 L90 240" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />
  <path d="M200 0 L150 240" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="180" cy="60" r="3" fill="#38bdf8" opacity="0.4" />
  <circle cx="60" cy="180" r="4" fill="#fbbf24" opacity="0.3" />
  <circle cx="190" cy="170" r="2" fill="#34d399" opacity="0.5" />

  <!-- Surface / Wooden Countertop -->
  <g filter="url(#shadow)">
    <!-- Countertop Base -->
    <path d="M 24 185 Q 120 175 216 185 L 222 220 Q 120 226 18 220 Z" fill="#0f172a" />
    <!-- Countertop Top Surface -->
    <ellipse cx="120" cy="183" rx="98" ry="16" fill="#334155" />
    <ellipse cx="120" cy="181" rx="94" ry="14" fill="#475569" />
  </g>

  <!-- MAIN SCENE: A vibrant tableau representing "Benefits/Good Points" (Health, Vitality, Strength) -->
  <!-- Composed of a fresh shiny apple (health), a sparkling golden star (reward/good), and a mini dumbbell (vitality/exercise context) -->

  <!-- Back Shadow for Central Cluster -->
  <ellipse cx="120" cy="180" rx="65" ry="12" fill="#000000" opacity="0.5" filter="url(#softGlow)" />

  <!-- Dumbbell (Represents Exercise / Physical Health Benefit) -->
  <g transform="translate(68, 145) rotate(-15)" filter="url(#shadow)">
    <!-- Handle -->
    <rect x="15" y="10" width="30" height="8" rx="4" fill="#94a3b8" />
    <!-- Weights Left -->
    <rect x="5" y="2" width="12" height="24" rx="4" fill="url(#goldGrad)" />
    <circle cx="11" cy="14" r="3" fill="#fef08a" opacity="0.6" />
    <!-- Weights Right -->
    <rect x="43" y="2" width="12" height="24" rx="4" fill="url(#goldGrad)" />
    <circle cx="49" cy="14" r="3" fill="#fef08a" opacity="0.6" />
  </g>

  <!-- Secondary Dumbbell / Accent Prop -->
  <g transform="translate(150, 155) rotate(20) scale(0.75)" filter="url(#shadow)">
    <rect x="15" y="10" width="30" height="8" rx="4" fill="#94a3b8" />
    <rect x="5" y="2" width="12" height="24" rx="4" fill="#38bdf8" />
    <rect x="43" y="2" width="12" height="24" rx="4" fill="#38bdf8" />
  </g>

  <!-- Fresh Apple (Centerpiece of Health & 'Good Point') -->
  <g filter="url(#shadow)">
    <!-- Apple Body -->
    <path d="M 120 170 
             C 95 170 80 145 80 120 
             C 80 95 100 90 112 105 
             C 117 112 123 112 128 105 
             C 140 90 160 95 160 120 
             C 160 145 145 170 120 170 Z" 
          fill="url(#appleGrad)" />
    
    <!-- Apple Inner Dimension / Highlight Overlay -->
    <path d="M 120 162 
             C 102 162 90 142 90 120 
             C 90 102 104 98 113 110 
             C 118 116 122 116 127 110 
             C 136 98 150 102 150 120 
             C 150 142 138 162 120 162 Z" 
          fill="url(#appleHighlight)" opacity="0.5" />

    <!-- Apple Glossy Reflection Shape -->
    <path d="M 95 115 C 92 102 102 95 108 97 C 104 102 100 108 95 115 Z" fill="#ffffff" opacity="0.6" />

    <!-- Stem -->
    <path d="M 118 92 C 115 78 125 72 130 70 C 130 75 125 82 122 90 Z" fill="#78350f" />

    <!-- Leaf -->
    <path d="M 124 77 C 138 72 150 82 146 92 C 142 94 132 92 124 77 Z" fill="url(#leafGrad)" />
    <path d="M 128 83 C 134 83 140 87 143 90" stroke="#065f46" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Glowing Star (Symbolizing 'Benefit / Good Point / Plus Value') -->
  <g transform="translate(155, 68)" filter="url(#shadow)">
    <!-- Outer Glow -->
    <circle cx="0" cy="0" r="22" fill="#fbbf24" opacity="0.25" filter="url(#softGlow)" />
    <!-- Star Shape -->
    <path d="M 0 -16 
             L 4 -5  L 15 -3 
             L 7 4   L 9 15 
             L 0 9   L -9 15 
             L -7 4  L -15 -3 
             L -4 -5 Z" 
          fill="url(#goldGrad)" />
    <!-- Star Inner Sparkle -->
    <path d="M 0 -8 L 1.5 -2 L 7 -1 L 2.5 2 L 4 8 L 0 4 L -4 8 L -2.5 2 L -7 -1 L -1.5 -2 Z" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Secondary Small Floating Star -->
  <g transform="translate(75, 85) scale(0.6)" filter="url(#shadow)">
    <path d="M 0 -16 L 4 -5 L 15 -3 L 7 4 L 9 15 L 0 9 L -9 15 L -7 4 L -15 -3 L -4 -5 Z" fill="#38bdf8" />
  </g>

  <!-- Magical Sparkles / Action Elements (Representing Positive Energy & Wellness) -->
  <g fill="#fbbf24">
    <circle cx="100" cy="55" r="3" opacity="0.9" />
    <circle cx="140" cy="50" r="2" opacity="0.7" />
    <path d="M 132 130 Q 138 124 144 130 Q 138 136 132 130 Z" fill="#ffffff" opacity="0.8" />
    <path d="M 95 140 Q 98 136 101 140 Q 98 144 95 140 Z" fill="#fef08a" opacity="0.6" />
  </g>

  <!-- Dynamic Energy Flow Lines (Accentuate the 'Benefit/Positivity' theme) -->
  <path d="M 45 130 Q 60 110 85 105" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 8" fill="none" opacity="0.6" />
  <path d="M 190 120 Q 175 100 155 95" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" fill="none" opacity="0.6" />

</svg>