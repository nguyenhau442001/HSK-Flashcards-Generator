<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for Restaurant Interior -->
    <radialGradient id="interiorGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Awning Stripe Pattern -->
    <linearGradient id="awningRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="awningCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Warm Light -->
    <linearGradient id="windowWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#interiorGlow)"/>

  <!-- Atmospheric Background Elements -->
  <!-- Night Sky Stars / Sparkles -->
  <circle cx="35" cy="40" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="205" cy="55" r="1.5" fill="#f43f5e" opacity="0.6"/>
  <circle cx="180" cy="25" r="1" fill="#fbbf24" opacity="0.8"/>
  <circle cx="55" cy="85" r="1" fill="#34d399" opacity="0.5"/>

  <!-- Restaurant Building Structure -->
  <!-- Base Wall (Warm Dark Brick/Wood Tone) -->
  <path d="M 45 105 L 195 105 L 195 210 L 45 210 Z" fill="#334155"/>
  
  <!-- Architectural Side Panels (Wood Texture effect) -->
  <rect x="45" y="105" width="15" height="105" fill="#1e293b"/>
  <rect x="180" y="105" width="15" height="105" fill="#1e293b"/>

  <!-- Large Inviting Glass Windows -->
  <!-- Left Window -->
  <rect x="68" y="125" width="44" height="60" rx="4" fill="url(#windowWarm)"/>
  <rect x="73" y="130" width="15" height="50" rx="2" fill="#fffbeb" opacity="0.2"/>
  <!-- Right Window -->
  <rect x="128" y="125" width="44" height="60" rx="4" fill="url(#windowWarm)"/>
  <rect x="133" y="130" width="15" height="50" rx="2" fill="#fffbeb" opacity="0.2"/>
  
  <!-- Window Panes & Inner Details (Silhouettes inside restaurant) -->
  <line x1="90" y1="125" x2="90" y2="185" stroke="#78350f" stroke-width="3"/>
  <line x1="150" y1="125" x2="150" y2="185" stroke="#78350f" stroke-width="3"/>
  
  <!-- Indoor Silhouette elements (Tables & Chairs) -->
  <path d="M 75 170 L 105 170 L 100 185 L 80 185 Z" fill="#451a03" opacity="0.7"/>
  <path d="M 135 170 L 165 170 L 160 185 L 140 185 Z" fill="#451a03" opacity="0.7"/>
  <circle cx="90" cy="160" r="5" fill="#fb923c" opacity="0.8"/>
  <circle cx="150" cy="160" r="5" fill="#fb923c" opacity="0.8"/>

  <!-- Double Glass Door in Center / Entrance -->
  <path d="M 105 210 L 105 145 C 105 140 135 140 135 145 L 135 210 Z" fill="#1e293b"/>
  <rect x="109" y="150" width="10" height="55" rx="2" fill="url(#windowWarm)"/>
  <rect x="121" y="150" width="10" height="55" rx="2" fill="url(#windowWarm)"/>
  <circle cx="112" cy="180" r="1.5" fill="#f59e0b"/>
  <circle cx="128" cy="180" r="1.5" fill="#f59e0b"/>

  <!-- Foundation / Pavement -->
  <path d="M 30 210 L 210 210 L 220 225 L 20 225 Z" fill="#475569"/>
  <path d="M 35 215 L 205 215" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Elegant Striped Awning / Canopy -->
  <!-- Awning Support Brackets -->
  <line x1="55" y1="105" x2="55" y2="90" stroke="#0f172a" stroke-width="3"/>
  <line x1="185" y1="105" x2="185" y2="90" stroke="#0f172a" stroke-width="3"/>
  
  <!-- Main Awning Shape -->
  <path d="M 35 95 L 205 95 L 195 75 L 45 75 Z" fill="#0f172a"/>
  
  <!-- Awning Stripes (Red and Cream alternating panels) -->
  <!-- Panel 1 -->
  <path d="M 45 75 L 58 75 L 63 95 L 50 95 Z" fill="url(#awningRed)"/>
  <!-- Panel 2 -->
  <path d="M 58 75 L 71 75 L 76 95 L 63 95 Z" fill="url(#awningCream)"/>
  <!-- Panel 3 -->
  <path d="M 71 75 L 84 75 L 89 95 L 76 95 Z" fill="url(#awningRed)"/>
  <!-- Panel 4 -->
  <path d="M 84 75 L 97 75 L 102 95 L 89 95 Z" fill="url(#awningCream)"/>
  <!-- Panel 5 -->
  <path d="M 97 75 L 110 75 L 115 95 L 102 95 Z" fill="url(#awningRed)"/>
  <!-- Panel 6 -->
  <path d="M 110 75 L 123 75 L 128 95 L 115 95 Z" fill="url(#awningCream)"/>
  <!-- Panel 7 -->
  <path d="M 123 75 L 136 75 L 141 95 L 128 95 Z" fill="url(#awningRed)"/>
  <!-- Panel 8 -->
  <path d="M 136 75 L 149 75 L 154 95 L 141 95 Z" fill="url(#awningCream)"/>
  <!-- Panel 9 -->
  <path d="M 149 75 L 162 75 L 167 95 L 154 95 Z" fill="url(#awningRed)"/>
  <!-- Panel 10 -->
  <path d="M 162 75 L 175 75 L 180 95 L 167 95 Z" fill="url(#awningCream)"/>
  <!-- Panel 11 -->
  <path d="M 175 75 L 188 75 L 193 95 L 180 95 Z" fill="url(#awningRed)"/>

  <!-- Awning Scallop Edge -->
  <path d="M 45 95 Q 51.5 101 58 95 Q 64.5 101 71 95 Q 77.5 101 84 95 Q 90.5 101 97 95 Q 103.5 101 110 95 Q 116.5 101 123 95 Q 129.5 101 136 95 Q 142.5 101 149 95 Q 155.5 101 162 95 Q 168.5 101 175 95 Q 181.5 101 188 95 Q 194.5 101 201 95 L 195 75 L 45 75 Z" fill="url(#awningRed)" opacity="0.3"/>

  <!-- Traditional Red Lanterns (Left and Right Hanging) -->
  <!-- Left Lantern -->
  <line x1="30" y1="50" x2="30" y2="75" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="30" cy="65" r="12" fill="url(#lanternGlow)"/>
  <ellipse cx="30" cy="65" rx="10" ry="14" fill="#ef4444"/>
  <!-- Lantern Ribs -->
  <path d="M 30 51 C 25 57 25 73 30 79 C 35 73 35 57 30 51 Z" fill="none" stroke="#b91c1c" stroke-width="1"/>
  <rect x="26" y="50" width="8" height="3" rx="1" fill="#fbbf24"/>
  <rect x="27" y="77" width="6" height="3" rx="1" fill="#fbbf24"/>
  <line x1="30" y1="80" x2="30" y2="87" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Right Lantern -->
  <line x1="210" y1="50" x2="210" y2="75" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="210" cy="65" r="12" fill="url(#lanternGlow)"/>
  <ellipse cx="210" cy="65" rx="10" ry="14" fill="#ef4444"/>
  <!-- Lantern Ribs -->
  <path d="M 210 51 C 205 57 205 73 210 79 C 215 73 215 57 210 51 Z" fill="none" stroke="#b91c1c" stroke-width="1"/>
  <rect x="206" y="50" width="8" height="3" rx="1" fill="#fbbf24"/>
  <rect x="207" y="77" width="6" height="3" rx="1" fill="#fbbf24"/>
  <line x1="210" y1="80" x2="210" y2="87" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Outdoor Dining / Context Props (Foreground Details) -->
  <!-- Outdoor Bistro Table -->
  <ellipse cx="120" cy="205" rx="35" ry="10" fill="#334155"/>
  <ellipse cx="120" cy="202" rx="35" ry="10" fill="#475569"/>
  <path d="M 118 202 L 118 220" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 105 220 L 133 220" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Delicious Food Props on Table -->
  <!-- Steaming Bamboo Steamer (Dim Sum / Baozi) -->
  <ellipse cx="110" cy="198" rx="14" ry="5" fill="#d97706"/>
  <ellipse cx="110" cy="196" rx="14" ry="5" fill="#f59e0b"/>
  <!-- Steamer Lid -->
  <ellipse cx="110" cy="192" rx="13" ry="4" fill="#fcd34d"/>
  <circle cx="110" cy="189" r="2.5" fill="#d97706"/>
  <!-- Steam wisps -->
  <path d="M 106 186 Q 104 180 108 175" fill="none" stroke="#fffbeb" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 114 186 Q 116 180 112 174" fill="none" stroke="#fffbeb" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Bowl of Noodles with Chopsticks -->
  <path d="M 130 198 C 130 204 146 204 146 198 Z" fill="#e2e8f0"/>
  <ellipse cx="138" cy="198" rx="8" ry="3" fill="#cbd5e1"/>
  <!-- Noodles & Broth -->
  <ellipse cx="138" cy="199" rx="7" ry="2.5" fill="#fde047"/>
  <!-- Chopsticks -->
  <line x1="126" y1="190" x2="148" y2="195" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <line x1="128" y1="188" x2="146" y2="193" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Potted Plant / Greenery for Lively Atmospheric Polish -->
  <!-- Left Planter Box -->
  <rect x="35" y="195" width="16" height="18" rx="2" fill="#0284c7"/>
  <path d="M 43 195 C 39 180 30 170 25 160 C 35 168 40 180 43 195 Z" fill="#10b981"/>
  <path d="M 43 195 C 47 175 55 165 62 155 C 53 165 47 178 43 195 Z" fill="#34d399"/>
  <circle cx="35" cy="165" r="8" fill="#059669"/>
  <circle cx="50" cy="160" r="10" fill="#10b981"/>

  <!-- Right Planter Box -->
  <rect x="189" y="195" width="16" height="18" rx="2" fill="#0284c7"/>
  <path d="M 197 195 C 193 180 185 170 178 160 C 188 168 194 180 197 195 Z" fill="#34d399"/>
  <path d="M 197 195 C 201 175 210 165 217 155 C 207 165 201 178 197 195 Z" fill="#10b981"/>
  <circle cx="205" cy="165" r="9" fill="#059669"/>

  <!-- Warm welcoming lighting glow accents on ground -->
  <ellipse cx="120" cy="210" rx="45" ry="6" fill="#f59e0b" opacity="0.15"/>
</svg>