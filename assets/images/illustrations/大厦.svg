<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Sky Glow -->
    <radialGradient id="skyGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Skyscraper Facade Gradient -->
    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Side Facade Gradient -->
    <linearGradient id="towerSideGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="glassReflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Window Warm Light -->
    <linearGradient id="warmLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Window Cool Light -->
    <linearGradient id="coolLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#skyGlow)" />

  <!-- Background Stars / City Sparkles -->
  <circle cx="40" cy="40" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="80" cy="25" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="190" cy="50" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="210" cy="30" r="1.5" fill="#fbbf24" opacity="0.7" />
  <circle cx="25" cy="85" r="1" fill="#ffffff" opacity="0.4" />

  <!-- Distant Background Buildings -->
  <rect x="20" y="110" width="30" height="130" fill="#0f172a" opacity="0.7" />
  <rect x="180" y="90" width="45" height="150" fill="#0f172a" opacity="0.7" />
  <rect x="160" y="130" width="25" height="110" fill="#1e293b" opacity="0.5" />

  <!-- MAIN SUBJECT: 大厦 (The Large Skyscraper) -->
  <!-- Main Tower Structure - Center-Left to Center Composition -->
  
  <!-- Left Side Facade (Perspective Depth) -->
  <polygon points="60,210 60,60 85,45 85,210" fill="url(#towerSideGrad)" />

  <!-- Main Front Facade -->
  <polygon points="85,45 165,30 165,210 85,210" fill="url(#towerGrad)" />
  
  <!-- Right Side Facade / Wing -->
  <polygon points="165,30 195,50 195,210 165,210" fill="url(#towerSideGrad)" />

  <!-- Architectural Glass Panels & Grid Lines on Main Facade -->
  <!-- Vertical dividing lines -->
  <line x1="105" y1="41" x2="105" y2="210" stroke="#0f172a" stroke-width="1.5" opacity="0.5" />
  <line x1="125" y1="37" x2="125" y2="210" stroke="#0f172a" stroke-width="1.5" opacity="0.5" />
  <line x1="145" y1="34" x2="145" y2="210" stroke="#0f172a" stroke-width="1.5" opacity="0.5" />

  <!-- Horizontal Floor Bands -->
  <g stroke="#0f172a" stroke-width="1" opacity="0.6">
    <line x1="85" y1="60" x2="165" y2="55" />
    <line x1="85" y1="75" x2="165" y2="70" />
    <line x1="85" y1="90" x2="165" y2="85" />
    <line x1="85" y1="105" x2="165" y2="100" />
    <line x1="85" y1="120" x2="165" y2="115" />
    <line x1="85" y1="135" x2="165" y2="130" />
    <line x1="85" y1="150" x2="165" y2="145" />
    <line x1="85" y1="165" x2="165" y2="160" />
    <line x1="85" y1="180" x2="165" y2="175" />
    <line x1="85" y1="195" x2="165" y2="190" />
  </g>

  <!-- Glowing Windows (Randomly illuminated office lights for realism) -->
  <g>
    <!-- Warm & Cool offices -->
    <rect x="90" y="65" width="12" height="8" rx="1" fill="url(#warmLight)" />
    <rect x="109" y="62" width="12" height="8" rx="1" fill="url(#coolLight)" />
    <rect x="130" y="59" width="12" height="8" rx="1" fill="url(#warmLight)" />
    
    <rect x="90" y="80" width="12" height="8" rx="1" fill="url(#coolLight)" />
    <rect x="149" y="74" width="12" height="8" rx="1" fill="url(#warmLight)" />
    
    <rect x="109" y="92" width="12" height="8" rx="1" fill="url(#warmLight)" />
    <rect x="130" y="89" width="12" height="8" rx="1" fill="url(#coolLight)" />
    
    <rect x="90" y="110" width="12" height="8" rx="1" fill="url(#warmLight)" />
    <rect x="109" y="107" width="12" height="8" rx="1" fill="url(#warmLight)" />
    <rect x="149" y="101" width="12" height="8" rx="1" fill="url(#coolLight)" />
    
    <rect x="130" y="119" width="12" height="8" rx="1" fill="url(#warmLight)" />
    
    <rect x="90" y="140" width="12" height="8" rx="1" fill="url(#coolLight)" />
    <rect x="109" y="137" width="12" height="8" rx="1" fill="url(#coolLight)" />
    <rect x="130" y="134" width="12" height="8" rx="1" fill="url(#warmLight)" />
    <rect x="149" y="128" width="12" height="8" rx="1" fill="url(#warmLight)" />

    <rect x="90" y="170" width="12" height="8" rx="1" fill="url(#warmLight)" />
    <rect x="130" y="164" width="12" height="8" rx="1" fill="url(#coolLight)" />
  </g>

  <!-- Modern Glass Reflection Overlay -->
  <polygon points="85,45 165,30 165,120 85,135" fill="url(#glassReflection)" />

  <!-- Skyscraper Spire / Antenna -->
  <line x1="125" y1="37" x2="125" y2="12" stroke="#94a3b8" stroke-width="2" />
  <line x1="121" y1="20" x2="129" y2="20" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="125" cy="11" r="2.5" fill="#ef4444" /> <!-- Aviation Warning Light -->

  <!-- Grand Entrance Canopy & Base Context -->
  <polygon points="75,210 175,210 185,225 65,225" fill="#334155" />
  <rect x="95" y="195" width="60" height="30" fill="#0f172a" rx="2" />
  <!-- Illuminated Entrance Lobby -->
  <rect x="102" y="202" width="46" height="23" fill="#fbbf24" opacity="0.9" rx="1" />
  <rect x="102" y="202" width="46" height="23" fill="url(#glassReflection)" />

  <!-- Street Level Context (Foreground) -->
  <!-- Sidewalk -->
  <path d="M 0 225 Q 120 215 240 225 L 240 240 L 0 240 Z" fill="#334155" />
  <line x1="0" y1="225" x2="240" y2="225" stroke="#475569" stroke-width="1.5" />

  <!-- Street Elements: Trees, Streetlamp, and Tiny Car for Scale -->
  <!-- Stylized Modern Tree (Left) -->
  <rect x="35" y="210" width="4" height="20" fill="#64748b" />
  <circle cx="37" cy="205" r="10" fill="#10b981" opacity="0.8" />
  <circle cx="33" cy="202" r="8" fill="#34d399" opacity="0.8" />
  <circle cx="41" cy="207" r="7" fill="#059669" opacity="0.8" />

  <!-- Stylized Modern Tree (Right) -->
  <rect x="205" y="212" width="4" height="18" fill="#64748b" />
  <circle cx="207" cy="207" r="9" fill="#10b981" opacity="0.8" />
  <circle cx="203" cy="204" r="7" fill="#34d399" opacity="0.8" />

  <!-- Modern Streetlamp -->
  <path d="M 190 225 L 192 180 L 195 178" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 193 178 L 198 181" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <circle cx="199" cy="182" r="2" fill="#fef08a" />

  <!-- Tiny Car for Scale (Showing the grandeur of the 大厦) -->
  <g transform="translate(70, 222)">
    <rect x="0" y="3" width="18" height="7" rx="3" fill="#ec4899" />
    <path d="M 4 3 L 7 0 L 13 0 L 15 3 Z" fill="#f472b6" />
    <circle cx="3" cy="10" r="2" fill="#0f172a" />
    <circle cx="15" cy="10" r="2" fill="#0f172a" />
    <!-- Headlight beam -->
    <path d="M 18 6 L 26 8 L 26 4 Z" fill="#fef08a" opacity="0.4" />
  </g>

  <!-- Atmosphere / Foreground Lighting Effects -->
  <!-- Uplighting on tower base -->
  <polygon points="102,202 148,202 165,210 85,210" fill="#38bdf8" opacity="0.2" />

  <!-- Dynamic Accent Glowing Cloud/Mist at Base -->
  <path d="M 50 230 Q 80 220 120 230 Q 160 220 200 230 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.6" />

</svg>