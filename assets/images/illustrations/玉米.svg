<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Behind Character -->
    <radialGradient id="warm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Corn Kernel Gradient -->
    <linearGradient id="corn-kernel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light/Glow -->
  <circle cx="120" cy="120" r="90" fill="url(#warm-glow)" />

  <!-- Background Environment: Cozy Room Elements -->
  <!-- Window Frame & Night Sky -->
  <path d="M 170 30 L 210 30 L 210 90 L 170 90 Z" fill="#334155" opacity="0.6" />
  <path d="M 174 34 L 206 34 L 206 86 L 174 86 Z" fill="#0f172a" />
  <!-- Stars outside window -->
  <circle cx="184" cy="45" r="1" fill="#f8fafc" opacity="0.8" />
  <circle cx="196" cy="65" r="1.5" fill="#f8fafc" opacity="0.9" />
  <circle cx="188" cy="78" r="1" fill="#f8fafc" opacity="0.6" />

  <!-- House Plant (Context Prop) -->
  <path d="M 30 110 Q 35 110 37 130 L 23 130 Q 25 110 30 110 Z" fill="#475569" />
  <path d="M 30 110 C 20 80, 5 90, 10 70 C 15 90, 25 100, 30 110 Z" fill="#10b981" opacity="0.85" />
  <path d="M 30 110 C 40 85, 55 95, 50 75 C 45 95, 35 105, 30 110 Z" fill="#059669" opacity="0.85" />

  <!-- Wooden Table Surface -->
  <path d="M 20 180 L 220 180 L 230 210 L 10 210 Z" fill="#334155" />
  <path d="M 20 176 L 220 176 L 220 180 L 20 180 Z" fill="#475569" />

  <!-- Character: Male (Happy, Enjoying Food) -->
  <g id="character">
    <!-- Torso / Hoodie -->
    <path d="M 80 180 C 80 145, 95 130, 120 130 C 145 130, 160 145, 160 180 Z" fill="#38bdf8" />
    <!-- Hoodie Pocket & Details -->
    <path d="M 100 160 L 140 160 L 135 178 L 105 178 Z" fill="#0284c7" opacity="0.6" />
    <circle cx="120" cy="138" r="4" fill="#bae6fd" />

    <!-- Neck -->
    <rect x="110" y="118" width="20" height="20" fill="url(#skin)" />

    <!-- Head -->
    <circle cx="120" cy="100" r="28" fill="url(#skin)" />

    <!-- Hair -->
    <path d="M 94 98 C 92 75, 110 70, 122 70 C 138 70, 146 80, 148 98 C 148 98, 142 84, 120 82 C 98 80, 94 98, 94 98 Z" fill="#0f172a" />

    <!-- Happy Eyes (Closed Arcs) -->
    <path d="M 108 96 Q 114 102 120 96" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 124 96 Q 130 102 136 96" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cheeks (Blush) -->
    <circle cx="106" cy="104" r="5" fill="#ec4899" opacity="0.4" />
    <circle cx="138" cy="104" r="5" fill="#ec4899" opacity="0.4" />

    <!-- Wide Happy Open Mouth (Eating/Enjoying) -->
    <path d="M 114 107 Q 120 118 126 107 Z" fill="#991b1b" />
    <!-- Tongue -->
    <path d="M 117 111 Q 120 116 123 111 Z" fill="#f43f5e" />

    <!-- Left Arm (Holding Plate/Context) -->
    <path d="M 85 145 L 70 170 L 90 175 L 100 155 Z" fill="#0284c7" />

    <!-- Right Arm (Holding Corn Up to Mouth) -->
    <path d="M 155 145 C 160 130, 145 118, 135 115" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="133" cy="113" r="7" fill="url(#skin)" />
  </g>

  <!-- The Main Focus: 玉米 (The Corn Cob being eaten) -->
  <g id="corn-cob" transform="translate(125, 95) rotate(-25)">
    <!-- Husk leaves at bottom -->
    <path d="M -2 20 Q -10 30 -15 35 Q -5 28 2 20 Z" fill="#4ade80" />
    <path d="M 2 20 Q 12 32 18 38 Q 8 28 0 20 Z" fill="#22c55e" />

    <!-- Cob Body / Base -->
    <ellipse cx="0" cy="5" rx="10" ry="18" fill="#ca8a04" />

    <!-- Corn Kernels Grid Structure -->
    <!-- Row 1 -->
    <circle cx="-5" cy="-6" r="3.5" fill="url(#corn-kernel)" />
    <circle cx="0" cy="-7" r="3.5" fill="url(#corn-kernel)" />
    <circle cx="5" cy="-6" r="3.5" fill="url(#corn-kernel)" />
    
    <!-- Row 2 -->
    <circle cx="-6" cy="0" r="3.5" fill="url(#corn-kernel)" />
    <circle cx="-1" cy="-1" r="3.5" fill="url(#corn-kernel)" />
    <circle cx="4" cy="0" r="3.5" fill="url(#corn-kernel)" />

    <!-- Row 3 -->
    <circle cx="-5" cy="6" r="3.5" fill="url(#corn-kernel)" />
    <circle cx="0" cy="5" r="3.5" fill="url(#corn-kernel)" />
    <circle cx="5" cy="6" r="3.5" fill="url(#corn-kernel)" />

    <!-- Row 4 -->
    <circle cx="-4" cy="12" r="3.5" fill="url(#corn-kernel)" />
    <circle cx="1" cy="11" r="3.5" fill="url(#corn-kernel)" />
    <circle cx="6" cy="12" r="3.5" fill="url(#corn-kernel)" />

    <!-- Steam / Aroma lines indicating hot delicious food -->
    <path d="M 15 -15 Q 18 -25 12 -35" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <path d="M 22 -10 Q 25 -20 20 -30" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Tableware: Plate with Extra Corn Cobs -->
  <g id="plate-and-food" transform="translate(65, 175)">
    <!-- Ceramic Plate -->
    <ellipse cx="0" cy="10" rx="35" ry="12" fill="#cbd5e1" />
    <ellipse cx="0" cy="8" rx="30" ry="9" fill="#f8fafc" />

    <!-- Second Corn Cob on Plate -->
    <g transform="translate(-10, 5) rotate(15)">
      <ellipse cx="0" cy="0" rx="7" ry="14" fill="#ca8a04" />
      <circle cx="-3" cy="-4" r="2.5" fill="url(#corn-kernel)" />
      <circle cx="2" cy="-4" r="2.5" fill="url(#corn-kernel)" />
      <circle cx="-3" cy="1" r="2.5" fill="url(#corn-kernel)" />
      <circle cx="2" cy="1" r="2.5" fill="url(#corn-kernel)" />
      <circle cx="-3" cy="6" r="2.5" fill="url(#corn-kernel)" />
      <circle cx="2" cy="6" r="2.5" fill="url(#corn-kernel)" />
    </g>

    <!-- Third Corn Cob on Plate -->
    <g transform="translate(8, 7) rotate(-10)">
      <ellipse cx="0" cy="0" rx="7" ry="14" fill="#ca8a04" />
      <circle cx="-3" cy="-4" r="2.5" fill="url(#corn-kernel)" />
      <circle cx="2" cy="-4" r="2.5" fill="url(#corn-kernel)" />
      <circle cx="-3" cy="1" r="2.5" fill="url(#corn-kernel)" />
      <circle cx="2" cy="1" r="2.5" fill="url(#corn-kernel)" />
      <circle cx="-3" cy="6" r="2.5" fill="url(#corn-kernel)" />
      <circle cx="2" cy="6" r="2.5" fill="url(#corn-kernel)" />
    </g>
  </g>

  <!-- Cozy Mug / Drink Prop on Table -->
  <g id="mug" transform="translate(180, 165)">
    <rect x="-10" y="-15" width="20" height="25" rx="3" fill="#ec4899" />
    <path d="M 10 -10 C 18 -10, 18 5, 10 5" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 0 -20 Q 3 -26 -1 -32" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>