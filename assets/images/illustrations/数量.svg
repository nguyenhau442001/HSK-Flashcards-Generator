<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Market Stall Counter -->
  <path d="M20 180 L220 180 L210 220 L30 220 Z" fill="#334155"/>
  <path d="M20 180 L220 180 L230 160 L10 160 Z" fill="#475569"/>
  
  <!-- The 'Quantity' - A large pile of vibrant oranges -->
  <circle cx="120" cy="150" r="22" fill="#fb923c"/>
  <circle cx="90" cy="155" r="20" fill="#f59e0b"/>
  <circle cx="150" cy="155" r="20" fill="#f59e0b"/>
  <circle cx="105" cy="130" r="22" fill="#fb923c"/>
  <circle cx="135" cy="130" r="22" fill="#fb923c"/>
  <circle cx="120" cy="110" r="20" fill="#f59e0b"/>
  
  <!-- Decorative highlights on fruit -->
  <ellipse cx="112" cy="142" rx="4" ry="2" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="142" cy="122" rx="4" ry="2" fill="#ffffff" opacity="0.3"/>
  
  <!-- Scale/Balance representing measurement of quantity -->
  <path d="M40 160 L60 160 L50 120 Z" fill="#94a3b8"/>
  <circle cx="50" cy="120" r="5" fill="#38bdf8"/>
  
  <!-- Background atmosphere -->
  <circle cx="180" cy="60" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M170 50 L190 70 M190 50 L170 70" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="130" r="80" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>