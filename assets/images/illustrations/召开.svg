<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Glow -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Office Interior -->
  <!-- Back Wall Accent Panel -->
  <rect x="30" y="20" width="180" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Large Presentation Screen on Wall (Showing Meeting Charts) -->
  <rect x="50" y="32" width="140" height="85" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="58" y="42" width="124" height="65" fill="#1e293b"/>
  <!-- Graphic Elements inside Screen (Bars & Line chart representing a corporate meeting) -->
  <polyline points="68,90 85,75 102,82 120,60 138,68 155,48 172,55" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="68" y="78" width="10" height="19" rx="1" fill="#fb923c"/>
  <rect x="85" y="68" width="10" height="29" rx="1" fill="#10b981"/>
  <rect x="102" y="72" width="10" height="25" rx="1" fill="#fb923c"/>
  <rect x="120" y="55" width="10" height="42" rx="1" fill="#38bdf8"/>
  <rect x="138" y="62" width="10" height="35" rx="1" fill="#10b981"/>
  <rect x="155" y="45" width="10" height="52" rx="1" fill="#fbbf24"/>

  <!-- Windows / Ambient Light -->
  <path d="M 10 30 L 25 20 L 25 130 L 10 110 Z" fill="url(#windowLight)" opacity="0.5"/>

  <!-- Meeting Table (Perspective Oval/Rounded Rect) -->
  <g filter="url(#shadow)">
    <path d="M 30,150 Q 120,130 210,150 Q 225,185 210,210 Q 120,230 30,210 Q 15,185 30,150 Z" fill="url(#tableGrad)" stroke="#475569" stroke-width="2"/>
  </g>
  <!-- Table Highlight Edge -->
  <path d="M 40,155 Q 120,137 200,155" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>

  <!-- PROPS ON TABLE -->
  <!-- Laptops & Notebooks -->
  <rect x="65" y="165" width="28" height="18" rx="2" fill="#64748b"/>
  <path d="M 60,183 L 98,183 L 102,187 L 56,187 Z" fill="#94a3b8"/>
  <rect x="145" y="170" width="24" height="15" rx="2" fill="#475569"/>
  <!-- Coffee Cups -->
  <circle cx="110" cy="165" r="5" fill="#f8fafc"/>
  <path d="M 115,163 C 118,163 118,168 115,168" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="45" cy="180" r="5" fill="#ec4899"/>

  <!-- CHARACTERS (Participants in the Meeting) -->
  
  <!-- Character 1: Left participant taking notes -->
  <g id="char-left">
    <!-- Body & Shoulders -->
    <path d="M 35,215 C 35,190 45,180 60,180 C 75,180 85,190 85,215 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="162" r="13" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 47,160 C 47,150 55,147 62,148 C 72,149 75,158 74,165 C 68,160 55,160 47,160 Z" fill="#1e293b"/>
    <!-- Arm/Hand -->
    <path d="M 50,190 L 65,185 L 70,195" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="71" cy="196" r="3.5" fill="#fbcfe8"/>
  </g>

  <!-- Character 2: Right participant listening intently -->
  <g id="char-right">
    <!-- Body & Shoulders -->
    <path d="M 155,215 C 155,190 165,180 180,180 C 195,180 205,190 205,215 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="180" cy="160" r="13" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 167,158 C 168,147 178,145 188,148 C 194,150 196,158 195,165 C 190,160 175,160 167,158 Z" fill="#78350f"/>
    <!-- Arm -->
    <path d="M 190,195 L 175,190" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <circle cx="173" cy="190" r="3.5" fill="#fed7aa"/>
  </g>

  <!-- Character 3: Center Speaker / Organizer (The "Convener" of the Meeting) -->
  <g id="char-center" filter="url(#shadow)">
    <!-- Raised Arm / Gesture of Presenting / Convening -->
    <path d="M 100,180 L 115,150 L 125,145" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="127" cy="143" r="4" fill="#fed7aa"/>

    <!-- Torso (Blazer / Professional Attire) -->
    <path d="M 95,220 C 95,190 105,175 120,175 C 135,175 145,190 145,220 Z" fill="#fbbf24"/>
    <!-- Inner Shirt / Tie V-neck -->
    <path d="M 113,175 L 120,195 L 127,175 Z" fill="#f8fafc"/>
    <polygon points="119,190 121,190 122,210 118,210" fill="#ef4444"/>

    <!-- Head -->
    <circle cx="120" cy="152" r="15" fill="#fed7aa"/>
    
    <!-- Hair (Professional Stylized) -->
    <path d="M 105,150 C 105,138 115,135 123,136 C 133,137 137,146 137,155 C 133,153 125,151 120,151 C 112,151 107,153 105,150 Z" fill="#334155"/>

    <!-- Expressive Face (Confident, speaking / leading) -->
    <!-- Eyes (Focused/Happy arcs) -->
    <path d="M 113,150 Q 116,147 119,150" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 124,150 Q 127,147 130,150" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Friendly Open Smile -->
    <path d="M 116,157 Q 120,162 124,157" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="112" cy="155" r="2.5" fill="#f43f5e" opacity="0.4"/>
    <circle cx="128" cy="155" r="2.5" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- Foreground Atmospheric Lighting Elements (Depth of Field) -->
  <circle cx="25" cy="80" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="215" cy="100" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="210" cy="40" r="1" fill="#38bdf8" opacity="0.7"/>
</svg>