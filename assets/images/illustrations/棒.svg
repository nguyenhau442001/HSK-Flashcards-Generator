    <rect x="115" y="22.5" width="20" height="5" rx="2.5" fill="#f59e0b" transform="rotate(0 125 25)"/>
    <rect x="115" y="22.5" width="20" height="5" rx="2.5" fill="#f59e0b" transform="rotate(45 125 25)"/>
    <rect x="115" y="22.5" width="20" height="5" rx="2.5" fill="#f59e0b" transform="rotate(90 125 25)"/>
    <rect x="115" y="22.5" width="20" height="5" rx="2.5" fill="#f59e0b" transform="rotate(135 125 25)"/>
  </g>
</svg>