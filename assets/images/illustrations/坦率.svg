<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="speech-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Environmental Details: Cozy office / living room setting -->
  <!-- Bookshelf / background walls -->
  <rect x="25" y="40" width="50" height="90" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="30" y="55" width="40" height="8" rx="2" fill="#475569" opacity="0.5"/>
  <rect x="30" y="85" width="40" height="8" rx="2" fill="#475569" opacity="0.5"/>
  <rect x="30" y="115" width="40" height="8" rx="2" fill="#475569" opacity="0.5"/>

  <!-- Warm Pendant Light casting glow -->
  <path d="M120 0 L120 40" stroke="#64748b" stroke-width="2"/>
  <circle cx="120" cy="42" r="14" fill="#fbbf24"/>
  <path d="M70 180 L170 180 L190 240 L50 240 Z" fill="url(#warm-glow)"/>

  <!-- House Plant on floor -->
  <path d="M195 195 C195 180 205 175 210 160 C215 175 225 180 225 195 Z" fill="#10b981" opacity="0.8"/>
  <path d="M185 205 C185 190 195 185 200 170 C205 185 215 190 215 205 Z" fill="#059669" opacity="0.8"/>
  <rect x="195" y="200" width="20" height="30" rx="4" fill="#64748b"/>

  <!-- Table/Desk Surface -->
  <path d="M10 195 L230 195 L220 220 L20 220 Z" fill="#334155"/>
  <rect x="20" y="195" width="200" height="6" fill="#475569" rx="2"/>

  <!-- Coffee Cups / Props on desk -->
  <rect x="160" y="180" width="16" height="18" rx="3" fill="#cbd5e1"/>
  <path d="M176 185 C180 185 182 188 182 191 C182 194 180 196 176 196" stroke="#cbd5e1" stroke-width="2" fill="none"/>

  <!-- Character 1: The Speaker (坦率 - Frank, expressive hand gestures, open posture) -->
  <g transform="translate(65, 90)">
    <!-- Body & Torso -->
    <path d="M20 70 L45 70 L55 110 L10 110 Z" fill="#38bdf8"/>
    <!-- Head & Hair -->
    <circle cx="32" cy="35" r="18" fill="#fbcfe8"/>
    <path d="M16 30 C16 18 24 14 32 14 C40 14 48 18 48 30 C44 24 40 22 32 22 C24 22 20 24 16 30 Z" fill="#475569"/>
    <!-- Face expression (open, honest smile, direct look) -->
    <circle cx="27" cy="33" r="2" fill="#1e293b"/>
    <circle cx="37" cy="33" r="2" fill="#1e293b"/>
    <path d="M30 40 Q32 44 34 40" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Expressive Arms / Open Gesture (Directly communicating openness) -->
    <path d="M45 75 Q60 70 70 85" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="72" cy="87" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Character 2: The Listener (Nodding, engaged, receptive) -->
  <g transform="translate(130, 95)">
    <!-- Body & Torso -->
    <path d="M20 65 L45 65 L55 105 L10 105 Z" fill="#f43f5e"/>
    <!-- Head & Hair -->
    <circle cx="32" cy="30" r="17" fill="#fed7aa"/>
    <path d="M17 26 C17 14 25 12 32 12 C40 12 47 15 47 27 C42 20 38 20 32 20 C25 20 20 21 17 26 Z" fill="#1e293b"/>
    <!-- Face (attentive, slightly nodding/smiling) -->
    <circle cx="27" cy="28" r="2" fill="#1e293b"/>
    <circle cx="37" cy="28" r="2" fill="#1e293b"/>
    <path d="M30 35 Q32 38 34 35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Arm resting thoughtfully -->
    <path d="M20 75 L10 90 L25 95" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="26" cy="95" r="4" fill="#fed7aa"/>
  </g>

  <!-- Dynamic Conversation / Speech Element (Abstract representation of clear, direct dialogue without words) -->
  <g transform="translate(85, 60)">
    <path d="M0 15 C0 7 7 0 15 0 L55 0 C63 0 70 7 70 15 C70 23 63 30 55 30 L35 30 L20 42 L25 30 L15 30 C7 30 0 23 0 15 Z" fill="url(#speech-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Inner clean geometric motion lines showing directness -->
    <line x1="15" y1="15" x2="55" y2="15" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="15" r="3" fill="#38bdf8"/>
  </g>

</svg>