<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Laptop Body -->
  <rect x="50" y="100" width="140" height="90" rx="6" fill="#64748b"/>
  <rect x="55" y="105" width="130" height="65" rx="4" fill="#0f172a"/>
  
  <!-- Screen Content (Message UI) -->
  <rect x="70" y="115" width="60" height="10" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="70" y="130" width="40" height="10" rx="2" fill="#e2e8f0" opacity="0.4"/>
  
  <!-- Keyboard Area -->
  <rect x="55" y="175" width="130" height="15" rx="2" fill="#94a3b8"/>
  
  <!-- The Enter Key (Highlighted) -->
  <rect x="160" y="177" width="20" height="11" rx="2" fill="#f59e0b"/>
  
  <!-- Character Hand -->
  <path d="M170 177 L175 160 L185 165 L180 177 Z" fill="#fbbf24"/>
  <circle cx="180" cy="162" r="8" fill="#fbbf24"/>
  
  <!-- Floating Message Bubble -->
  <path d="M160 90 L210 90 L210 110 L170 110 L160 120 Z" fill="#10b981"/>
  <circle cx="185" cy="100" r="3" fill="#ffffff"/>
  <circle cx="195" cy="100" r="3" fill="#ffffff"/>
  
  <!-- Ambient Light/Glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Decorative Desk Items -->
  <circle cx="35" cy="180" r="10" fill="#ec4899"/>
  <rect x="200" y="185" width="15" height="20" rx="2" fill="#fb923c"/>
</svg>