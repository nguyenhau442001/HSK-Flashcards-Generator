<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Glowing Bulb Gradient -->
    <radialGradient id="bulb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- SCENE: Cozy Room Interior representing "光明" (Bright future / bright room) -->
  
  <!-- Window Frame in Background (Left side) -->
  <g id="window" transform="translate(20, 30)">
    <!-- Window Outer Frame/Wall Cutout -->
    <rect x="0" y="0" width="70" height="90" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <!-- Window Light Beam casting across the room -->
    <polygon points="5,5 160,180 160,205 5,160" fill="url(#light-beam)" />
    <!-- Bright Exterior Glow through window -->
    <rect x="5" y="5" width="60" height="80" fill="#fef08a" opacity="0.9"/>
    <!-- Window Panes -->
    <line x1="35" y1="5" x2="35" y2="85" stroke="#334155" stroke-width="2"/>
    <line x1="5" y1="45" x2="65" y2="45" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Ambient Light Dust Particles / Sparkles in the light beam -->
  <g fill="#fde047" opacity="0.7">
    <circle cx="80" cy="90" r="2"/>
    <circle cx="100" cy="110" r="1.5"/>
    <circle cx="120" cy="100" r="2.5"/>
    <circle cx="140" cy="130" r="2"/>
    <circle cx="95" cy="135" r="1"/>
    <circle cx="115" cy="150" r="2"/>
  </g>

  <!-- Hanging Modern Pendant Lamp (Centerpiece of Brightness) -->
  <g id="pendant-lamp" transform="translate(140, 0)">
    <!-- Cord -->
    <line x1="0" y1="0" x2="0" y2="65" stroke="#475569" stroke-width="2"/>
    <!-- Lamp Shade -->
    <path d="M -25 65 L 25 65 L 35 85 L -35 85 Z" fill="#38bdf8"/>
    <path d="M -35 85 L 35 85 L 0 88 Z" fill="#0ea5e9"/>
    <!-- Glowing Bulb Core -->
    <circle cx="0" cy="85" r="22" fill="url(#bulb-glow)" />
    <circle cx="0" cy="85" r="10" fill="#ffffff" />
  </g>

  <!-- Wooden Desk Surface at bottom -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#desk-grad)"/>
  <!-- Desk Edge Highlight -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#64748b" stroke-width="3"/>

  <!-- Objects on Desk -->
  
  <!-- Stack of Books (Left) -->
  <g id="books" transform="translate(30, 145)">
    <!-- Bottom Book -->
    <rect x="0" y="15" width="45" height="10" rx="2" fill="#ec4899"/>
    <rect x="2" y="15" width="41" height="3" fill="#f472b6"/>
    <!-- Middle Book -->
    <rect x="4" y="8" width="40" height="9" rx="2" fill="#8b5cf6"/>
    <!-- Top Book -->
    <rect x="2" y="0" width="42" height="10" rx="2" fill="#3b82f6"/>
    <rect x="4" y="0" width="38" height="3" fill="#60a5fa"/>
  </g>

  <!-- Potted Plant on Desk (Right) -->
  <g id="potted-plant" transform="translate(175, 125)">
    <!-- Pot -->
    <path d="M 10 25 L 25 45 L 5 45 L 20 25 Z" fill="#cbd5e1"/>
    <ellipse cx="12.5" cy="25" rx="7.5" ry="2" fill="#e2e8f0"/>
    <!-- Leaves -->
    <path d="M 12.5 25 Q 5 10 0 5 Q 10 0 15 15 Z" fill="url(#leaf-grad)"/>
    <path d="M 12.5 25 Q 25 5 35 0 Q 30 15 17 20 Z" fill="url(#leaf-grad)"/>
    <path d="M 12.5 25 Q 15 -5 20 -10 Q 25 5 15 20 Z" fill="#10b981"/>
  </g>

  <!-- Glowing rays expanding from the central light source illuminating the scene -->
  <path d="M 140 85 L 60 180 M 140 85 L 200 180 M 140 85 L 140 190" stroke="#fef08a" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Cute Character / Mascot witnessing the bright room/future (Looking up with joy) -->
  <g id="mascot" transform="translate(95, 130)">
    <!-- Body -->
    <ellipse cx="25" cy="30" rx="18" ry="20" fill="#fb923c"/>
    <ellipse cx="25" cy="33" rx="14" ry="16" fill="#fed7aa"/>
    
    <!-- Happy Face looking up -->
    <!-- Smiling Eyes (Arc up) -->
    <path d="M 17 25 Q 19 22 21 25" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 29 25 Q 31 22 33 25" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Cheeks -->
    <circle cx="15" cy="28" r="3" fill="#f43f5e" opacity="0.5"/>
    <circle cx="35" cy="28" r="3" fill="#f43f5e" opacity="0.5"/>
    
    <!-- Big Happy Open Smile -->
    <path d="M 21 30 Q 25 36 29 30 Z" fill="#1e293b"/>

    <!-- Little Arms Raised in excitement -->
    <path d="M 10 20 Q 2 15 0 25" stroke="#fb923c" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 40 20 Q 48 15 50 25" stroke="#fb923c" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Feet -->
    <ellipse cx="18" cy="48" rx="5" ry="3" fill="#ea580c"/>
    <ellipse cx="32" cy="48" rx="5" ry="3" fill="#ea580c"/>
  </g>

  <!-- Foreground Atmospheric Sparkles for depth -->
  <circle cx="70" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="210" cy="70" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="20" cy="130" r="1.5" fill="#fef08a" opacity="0.5"/>

  <!-- Outer Rounded Border Frame for App Icon aesthetic -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="4" opacity="0.5"/>
</svg>