<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#162032" />
      <stop offset="100%" stop-color="#22304a" />
    </linearGradient>

    <!-- Warm Glow from Window -->
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Dove Glow -->
    <radialGradient id="doveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2234" />
      <stop offset="100%" stop-color="#0f141f" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Window Frame & View of Hope (Peaceful horizon with rising sun/stars) -->
  <g id="window-backdrop">
    <!-- Window Outer Recess -->
    <rect x="70" y="30" width="100" height="110" rx="4" fill="#0b101b" />
    <!-- Night sky outside -->
    <rect x="73" y="33" width="94" height="104" fill="#111827" />
    
    <!-- Distant Horizon / Dawn of Peace -->
    <path d="M 73 110 Q 120 95 167 110 L 167 137 L 73 137 Z" fill="#1f293d" />
    <!-- Gentle Sunrise / Golden Hope Glow at Horizon -->
    <circle cx="120" cy="105" r="18" fill="#f59e0b" opacity="0.3" filter="blur(4px)" />
    <circle cx="120" cy="102" r="8" fill="#fbbf24" opacity="0.8" />

    <!-- Stars representing peace & clarity -->
    <circle cx="90" cy="50" r="1" fill="#ffffff" opacity="0.8" />
    <circle cx="145" cy="45" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="155" cy="75" r="1" fill="#ffffff" opacity="0.6" />
    <circle cx="85" cy="70" r="1.2" fill="#ffffff" opacity="0.7" />

    <!-- Window Panes (Cross) -->
    <rect x="117" y="33" width="6" height="104" fill="#0b101b" />
    <rect x="73" y="83" width="94" height="6" fill="#0b101b" />

    <!-- Window Sill -->
    <rect x="65" y="137" width="110" height="8" rx="2" fill="#334155" />
    <rect x="67" y="139" width="106" height="3" fill="#475569" />
  </g>

  <!-- Indoor Environment / Room Elements -->
  <g id="room-interior">
    <!-- Walls and floor separation -->
    <rect x="0" y="145" width="240" height="95" fill="url(#floorGrad)" />
    <line x1="0" y1="145" x2="240" y2="145" stroke="#090d16" stroke-width="2" />
    
    <!-- Warm interior light wash -->
    <path d="M 0 145 L 90 240 L 0 240 Z" fill="url(#warmLight)" />

    <!-- Potted Plant on Sill (Symbol of life/growth) -->
    <path d="M 85 137 L 95 137 L 93 126 L 87 126 Z" fill="#64748b" /> <!-- Pot -->
    <ellipse cx="90" cy="126" rx="3" ry="1" fill="#475569" />
    <!-- Plant stems & leaves -->
    <path d="M 90 126 Q 85 118 82 115" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 90 126 Q 95 116 98 112" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 90 126 Q 90 114 90 110" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="82" cy="114" r="3" fill="#34d399" />
    <circle cx="98" cy="111" r="3" fill="#34d399" />
    <circle cx="90" cy="109" r="3.5" fill="#34d399" />
  </g>

  <!-- Glowing Symbol of Peace (Dove) flying towards/from the window -->
  <g id="peace-dove">
    <circle cx="120" cy="75" r="22" fill="url(#doveGlow)" />
    <!-- Stylized Dove in Flight -->
    <path d="M 112 75 C 112 72 118 68 124 72 C 128 75 128 79 124 81 C 120 83 115 80 112 75 Z" fill="#ffffff" />
    <!-- Wings up -->
    <path d="M 120 74 C 120 66 128 62 134 58 C 131 65 127 72 122 75 Z" fill="#f0fdf4" />
    <path d="M 118 75 C 114 68 108 64 102 61 C 105 67 110 73 116 77 Z" fill="#f0fdf4" />
  </g>

  <!-- Characters (Representing "我们" / "We all" - Diverse group looking up with hope) -->
  <g id="characters">
    <!-- Character 1: Foreground Right (Young Woman looking up intently) -->
    <g id="char-female">
      <!-- Body / Hoodie -->
      <path d="M 155 240 L 155 210 C 155 198 165 190 178 190 L 205 190 C 218 190 225 198 225 210 L 225 240 Z" fill="#0284c7" />
      <!-- Hoodie collar/cords -->
      <path d="M 178 190 L 190 205 L 202 190" fill="#0369a1" />
      <line x1="185" y1="200" x2="183" y2="215" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
      <line x1="195" y1="200" x2="197" y2="215" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />

      <!-- Neck -->
      <rect x="183" y="178" width="14" height="15" fill="#fcd34d" />

      <!-- Head (Tilted upward) -->
      <circle cx="190" cy="170" r="16" fill="#fcd34d" />
      
      <!-- Hair (Short bob, modern style) -->
      <path d="M 174 165 C 173 155 180 150 190 150 C 202 150 207 158 206 172 L 206 182 L 199 182 L 199 173 C 199 164 193 160 188 160 C 180 160 176 163 174 165 Z" fill="#1e1b4b" />

      <!-- Face Profile / Expression (Looking Up, Hopeful Eyes) -->
      <!-- Closed/Hopeful/Focused Eyes looking up-left -->
      <path d="M 194 167 Q 198 165 201 168" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Gentle hopeful smile -->
      <path d="M 196 176 Q 199 179 202 176" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Rosy cheek -->
      <circle cx="201" cy="173" r="3" fill="#fb7185" opacity="0.5" />
    </g>

    <!-- Character 2: Foreground Left (Young Man standing beside, hands clasped together in longing/hope) -->
    <g id="char-male">
      <!-- Body / Jacket -->
      <path d="M 15 240 L 25 195 C 27 185 37 180 48 180 L 82 180 C 93 180 101 185 104 195 L 112 240 Z" fill="#059669" />
      <path d="M 48 180 L 64 210 L 82 180 Z" fill="#047857" /> <!-- Inner shirt -->

      <!-- Neck -->
      <rect x="57" y="168" width="14" height="15" fill="#fcd34d" />

      <!-- Head (Tilted upward towards the light) -->
      <circle cx="64" cy="158" r="15" fill="#fcd34d" />

      <!-- Hair (Messy, expressive) -->
      <path d="M 50 158 C 50 148 58 144 67 144 C 77 144 80 150 80 160 L 78 162 C 75 155 70 152 64 152 C 58 152 53 156 50 158 Z" fill="#33291e" />

      <!-- Face (Looking up, eyes wide with expectation) -->
      <!-- Eye looking up -->
      <circle cx="70" cy="157" r="1.5" fill="#33291e" />
      <!-- Hopeful expression - slight upward curve of lips -->
      <path d="M 68 165 Q 71 168 74 165" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Rosy cheek -->
      <circle cx="73" cy="162" r="2.5" fill="#fb7185" opacity="0.4" />

      <!-- Hands Clasped Together in Aspiration (盼望 gesture) -->
      <g id="clasped-hands" transform="translate(56, 200)">
        <path d="M 0 10 C 2 2 10 0 14 5 C 18 2 26 2 28 10 C 30 18 14 25 14 25 C 14 25 -2 18 0 10 Z" fill="#fcd34d" />
        <path d="M 5 11 C 9 8 19 8 23 11" stroke="#d97706" stroke-width="1" fill="none" />
      </g>
    </g>

    <!-- Character 3: Silhouette in Background Center (Child standing on stool looking out) -->
    <g id="char-child" opacity="0.9">
      <!-- Small Stool -->
      <rect x="108" y="215" width="24" height="25" rx="2" fill="#475569" />
      <!-- Child Body -->
      <path d="M 112 215 L 115 190 C 115 185 120 182 125 182 C 130 182 135 185 135 190 L 138 215 Z" fill="#f43f5e" />
      <!-- Child Head -->
      <circle cx="125" cy="174" r="10" fill="#fcd34d" />
      <!-- Child Hair -->
      <path d="M 116 172 C 116 166 120 164 125 164 C 130 164 134 166 134 172 Z" fill="#451a03" />
      <!-- Arms raised slightly towards window -->
      <path d="M 113 192 L 108 185" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
      <path d="M 137 192 L 142 185" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Foreground Atmosphere / Lighting Enhancements -->
  <g id="lighting-fx" pointer-events="none">
    <!-- Ambient top rim light on characters -->
    <path d="M 50 144 C 60 142 70 144 80 148" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 174 150 C 185 148 195 150 206 156" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.6" />
    
    <!-- Floating gentle dust motes / light particles in the warm window beam -->
    <circle cx="105" cy="110" r="1" fill="#fde047" opacity="0.8" />
    <circle cx="138" cy="125" r="1.5" fill="#fde047" opacity="0.6" />
    <circle cx="115" cy="140" r="1" fill="#fde047" opacity="0.9" />
    <circle cx="130" cy="95" r="0.8" fill="#fde047" opacity="0.7" />
    <circle cx="150" cy="105" r="1.2" fill="#fde047" opacity="0.5" />
  </g>
</svg>