<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(40, 60)">
    <!-- Wooden Market Stall Counter -->
    <path d="M0 100 L160 100 L150 140 L10 140 Z" fill="#78350f"/>
    <path d="M10 140 L150 140 L140 160 L20 160 Z" fill="#451a03"/>
    
    <!-- Stacks of Gold Coins -->
    <circle cx="40" cy="90" r="12" fill="#fbbf24"/>
    <ellipse cx="40" cy="90" rx="12" ry="4" fill="#f59e0b"/>
    <circle cx="80" cy="95" r="14" fill="#fbbf24"/>
    <ellipse cx="80" cy="95" rx="14" ry="5" fill="#f59e0b"/>
    <circle cx="120" cy="85" r="10" fill="#fbbf24"/>
    <ellipse cx="120" cy="85" rx="10" ry="3" fill="#f59e0b"/>
    
    <!-- Floating Currency Symbols (Abstracted as geometric coins) -->
    <circle cx="30" cy="40" r="8" fill="#10b981" opacity="0.8"/>
    <circle cx="130" cy="30" r="10" fill="#10b981" opacity="0.6"/>
    
    <!-- Character Hand reaching for coins -->
    <path d="M140 110 C160 110 170 120 170 130 L180 120 C180 100 160 90 140 90 Z" fill="#fcd34d"/>
    <path d="M150 100 L165 95 L175 105 L160 110 Z" fill="#f59e0b"/>
    
    <!-- Decorative Accents -->
    <circle cx="20" cy="20" r="3" fill="#38bdf8"/>
    <circle cx="140" cy="10" r="4" fill="#ec4899"/>
    <path d="M10 10 L20 5 L30 10 L20 15 Z" fill="#fb923c" opacity="0.5"/>
  </g>
</svg>