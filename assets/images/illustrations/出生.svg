<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Ambient Glow -->
  <circle cx="100" cy="110" r="50" fill="#f59e0b" opacity="0.1" filter="blur(10px)"/>

  <!-- Horizon Line -->
  <path d="M 50 145 L 150 145" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Rising Sun (representing dawn/birth/beginning) -->
  <circle cx="100" cy="130" r="32" fill="#f59e0b"/>

  <!-- Rays of New Life / Sunrise -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="78" x2="100" y2="66" />
    <line x1="68" y1="110" x2="58" y2="100" />
    <line x1="132" y1="110" x2="142" y2="100" />
    <line x1="77" y1="87" x2="69" y2="79" />
    <line x1="123" y1="87" x2="131" y2="79" />
  </g>

  <!-- Emerging Life / Sprout (representing growth, birth, 'sinh ra') -->
  <path d="M 100 145 C 100 125, 80 115, 75 100 C 70 85, 90 80, 100 95 C 110 80, 130 85, 125 100 C 120 115, 100 125, 100 145 Z" fill="#10b981"/>

  <!-- Leaf Accent Detail -->
  <path d="M 100 120 C 100 110, 90 100, 85 95" stroke="#059669" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 100 120 C 100 110, 110 100, 115 95" stroke="#059669" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>