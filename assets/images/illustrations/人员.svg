<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window City Glow Gradient -->
    <linearGradient id="window-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Desk Light -->
    <radialGradient id="desk-light" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT: Modern Office Interior -->
  <!-- Window overlooking city at dusk -->
  <g id="window" opacity="0.6">
    <rect x="145" y="25" width="70" height="90" rx="4" fill="url(#window-grad)" stroke="#334155" stroke-width="2"/>
    <line x1="180" y1="25" x2="180" y2="115" stroke="#334155" stroke-width="2"/>
    <line x1="145" y1="70" x2="215" y2="70" stroke="#334155" stroke-width="2"/>
    <!-- City lights outside -->
    <rect x="153" y="40" width="8" height="12" rx="1" fill="#f59e0b" opacity="0.7"/>
    <rect x="165" y="55" width="10" height="15" rx="1" fill="#38bdf8" opacity="0.5"/>
    <rect x="190" y="35" width="12" height="20" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="188" y="80" width="8" height="25" rx="1" fill="#ec4899" opacity="0.5"/>
    <rect x="155" y="85" width="12" height="15" rx="1" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Bookshelf / Office Props Background -->
  <g id="shelf" opacity="0.4">
    <rect x="25" y="30" width="90" height="6" rx="2" fill="#475569"/>
    <rect x="35" y="15" width="12" height="15" rx="2" fill="#ec4899"/>
    <rect x="50" y="18" width="10" height="12" rx="2" fill="#38bdf8"/>
    <rect x="63" y="12" width="14" height="18" rx="2" fill="#10b981"/>
    <rect x="85" y="16" width="16" height="14" rx="2" fill="#f59e0b"/>
  </g>

  <!-- Ambient Desk Light Overlay -->
  <rect x="0" y="0" width="240" height="240" fill="url(#desk-light)" pointer-events="none"/>

  <!-- OFFICE DESK -->
  <rect x="15" y="160" width="210" height="12" rx="3" fill="#334155" filter="url(#shadow)"/>
  <rect x="30" y="172" width="12" height="48" rx="2" fill="#1e293b"/>
  <rect x="198" y="172" width="12" height="48" rx="2" fill="#1e293b"/>

  <!-- PROPS ON DESK -->
  <!-- Coffee Mug -->
  <rect x="185" y="135" width="14" height="18" rx="3" fill="#f8fafc" filter="url(#shadow)"/>
  <path d="M 199 140 C 205 140, 205 148, 199 150" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <!-- Plant Pot -->
  <path d="M 40 150 L 52 150 L 49 160 L 43 160 Z" fill="#cbd5e1"/>
  <circle cx="46" cy="144" r="7" fill="#10b981"/>
  <circle cx="41" cy="148" r="5" fill="#34d399"/>
  <circle cx="51" cy="147" r="6" fill="#059669"/>

  <!-- MAIN COMPUTER / HIRING DASHBOARD (Showing need for more personnel) -->
  <g id="computer" filter="url(#shadow)">
    <!-- Monitor Stand -->
    <path d="M 90 160 L 110 160 L 115 135 L 85 135 Z" fill="#475569"/>
    <rect x="75" y="130" width="50" height="8" rx="4" fill="#64748b"/>
    <!-- Monitor Frame -->
    <rect x="55" y="65" width="90" height="68" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <!-- Screen Content: Hiring Profiles/Slots -->
    <rect x="63" y="73" width="74" height="52" rx="3" fill="url(#screen-glow)"/>
    
    <!-- Profile Slots UI (Representing Staff/Personnel) -->
    <!-- Filled slot 1 -->
    <circle cx="75" cy="88" r="6" fill="#f8fafc"/>
    <rect x="85" y="85" width="22" height="4" rx="2" fill="#f8fafc" opacity="0.8"/>
    <rect x="85" y="92" width="14" height="3" rx="1.5" fill="#f8fafc" opacity="0.5"/>
    
    <!-- Filled slot 2 -->
    <circle cx="75" cy="106" r="6" fill="#f8fafc"/>
    <rect x="85" y="103" width="22" height="4" rx="2" fill="#f8fafc" opacity="0.8"/>
    <rect x="85" y="110" width="14" height="3" rx="1.5" fill="#f8fafc" opacity="0.5"/>

    <!-- EMPTY / NEEDED PERSONNEL SLOTS (Highlighting the "Need more personnel" concept) -->
    <circle cx="118" cy="88" r="6" fill="#fbbf24" stroke="#f59e0b" stroke-dasharray="2,2" stroke-width="1.5"/>
    <path d="M 115 88 L 121 88 M 118 85 L 118 91" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

    <circle cx="118" cy="106" r="6" fill="#fbbf24" stroke="#f59e0b" stroke-dasharray="2,2" stroke-width="1.5"/>
    <path d="M 115 106 L 121 106 M 118 103 L 118 109" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CHARACTERS: Manager / Executive analyzing the staffing need -->
  <g id="manager" filter="url(#shadow)">
    <!-- Body & Suit (Dark Blue / Corporate) -->
    <path d="M 140 160 C 140 135, 175 135, 175 160 Z" fill="#3b82f6"/>
    <!-- Shirt Collar & Tie -->
    <polygon points="152,138 157,146 163,138" fill="#f8fafc"/>
    <polygon points="155,142 157,155 159,142" fill="#ef4444"/>

    <!-- Neck -->
    <rect x="150" y="125" width="14" height="15" rx="4" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="157" cy="108" r="18" fill="#fbcfe8"/>

    <!-- Hair (Modern Professional Style) -->
    <path d="M 139 108 C 139 94, 150 90, 162 92 C 174 94, 176 104, 176 112 C 170 104, 150 100, 139 108 Z" fill="#1e293b"/>

    <!-- Thoughtful / Concerned Facial Expression -->
    <!-- Eyebrows (slightly tilted for concern/planning) -->
    <line x1="148" y1="102" x2="155" y2="104" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="104" x2="167" y2="102" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="151" cy="109" r="1.5" fill="#1e293b"/>
    <circle cx="163" cy="109" r="1.5" fill="#1e293b"/>
    <!-- Thoughtful Mouth (small stroke) -->
    <path d="M 155 117 C 157 116, 159 116, 161 117" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Arm gesturing towards screen / thinking -->
    <path d="M 142 145 C 130 140, 120 130, 125 120" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Hand -->
    <circle cx="123" cy="117" r="5" fill="#fbcfe8"/>
  </g>

  <!-- FOREGROUND ACCENT / HUD ELEMENTS (Reinforcing 'Company needs more personnel') -->
  <!-- Floating Growth / Requirement Indicator Bubble -->
  <g id="hud-indicator" filter="url(#shadow)" transform="translate(15, 60)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Plus symbol combined with silhouette icon -->
    <circle.inner></circle.inner>
    <!-- Person Silhouette Icon inside bubble -->
    <circle cx="18" cy="13" r="4" fill="#38bdf8"/>
    <path d="M 11 25 C 11 20, 25 20, 25 25" fill="#38bdf8"/>
    <!-- Plus Badge -->
    <circle cx="28" cy="10" r="7" fill="#fbbf24"/>
    <path d="M 28 7 L 28 13 M 25 10 L 31 10" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Additional Document / Chart prop on desk -->
  <g transform="translate(60, 142) rotate(-10)" filter="url(#shadow)">
    <rect x="0" y="0" width="22" height="26" rx="2" fill="#f8fafc"/>
    <line x1="4" y1="6" x2="14" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="11" x2="18" y2="11" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="16" x2="12" y2="16" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="16" cy="20" r="3" fill="#ef4444"/>
  </g>
</svg>