<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Subtle background glow -->
  <circle cx="100" cy="100" r="60" fill="#38bdf8" opacity="0.08"/>

  <!-- Stethoscope (Curved tubing in Sky Blue) -->
  <path d="M 70 65 
           C 70 45, 130 45, 130 65 
           C 130 85, 100 85, 100 115
           L 100 135" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Earpieces -->
  <circle cx="65" cy="63" r="4" fill="#f8fafc"/>
  <circle cx="135" cy="63" r="4" fill="#f8fafc"/>

  <!-- Chestpiece (Silver connector and Emerald Bell with white cross) -->
  <circle cx="100" cy="142" r="14" fill="#94a3b8"/>
  <circle cx="100" cy="142" r="11" fill="#10b981"/>
  
  <!-- Medical Cross on Chestpiece -->
  <path d="M 100 136 L 100 148 M 94 142 L 106 142" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Floating Caring/Medical Elements (Amber sparkles for 'tận tâm' / dedication) -->
  <path d="M 50 110 L 53 116 L 59 119 L 53 122 L 50 128 L 47 122 L 41 119 L 47 116 Z" fill="#f59e0b" opacity="0.8"/>
  <path d="M 150 90 L 152 94 L 156 96 L 152 98 L 150 102 L 148 98 L 144 96 L 148 94 Z" fill="#f59e0b" opacity="0.6"/>
  <path d="M 135 130 L 136.5 133 L 139.5 134.5 L 136.5 136 L 135 139 L 133.5 136 L 130.5 134.5 L 133.5 133 Z" fill="#fb923c" opacity="0.9"/>
</svg>