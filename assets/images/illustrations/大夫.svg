<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow from Desk Lamp -->
    <radialGradient id="deskGlow" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Doctor Coat Gradient -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Scrub Blue -->
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Stethoscope Metal -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#deskGlow)"/>

  <!-- Background Environment / Clinic Details -->
  <!-- Back Wall and Cabinetry -->
  <path d="M0 0 H240 V150 H0 Z" fill="#1e293b" opacity="0.4"/>
  <line x1="0" y1="150" x2="240" y2="150" stroke="#334155" stroke-width="2"/>
  
  <!-- Medical Chart Board on Wall -->
  <rect x="25" y="35" width="35" height="45" rx="4" fill="#334155"/>
  <rect x="30" y="42" width="25" height="3" rx="1.5" fill="#64748b"/>
  <rect x="30" y="50" width="18" height="3" rx="1.5" fill="#38bdf8"/>
  <rect x="30" y="58" width="22" height="3" rx="1.5" fill="#64748b"/>
  <circle cx="52" cy="70" r="4" fill="#10b981"/>

  <!-- Medical Equipment Shelf with Bottles -->
  <path d="M175 60 H220 V63 H175 Z" fill="#475569"/>
  <rect x="183" y="40" width="8" height="20" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="195" y="45" width="10" height="15" rx="2" fill="#10b981" opacity="0.8"/>
  <rect x="209" y="37" width="7" height="23" rx="2" fill="#ec4899" opacity="0.8"/>

  <!-- Examination Desk / Surface -->
  <path d="M0 150 L20 180 H220 L240 150 Z" fill="#0f172a"/>
  <path d="M15 180 H225 V210 H15 Z" fill="#334155"/>
  <path d="M15 180 H225 V186 H15 Z" fill="#475569"/>

  <!-- Computer Monitor (Showing EKG / Medical Graph) -->
  <rect x="155" y="95" width="55" height="40" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="160" y="100" width="45" height="26" rx="2" fill="url(#screenGrad)"/>
  <!-- EKG Line on Screen -->
  <path d="M165 115 H175 L178 105 L182 122 L186 110 L190 115 H200" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monitor Stand -->
  <path d="M175 135 H185 V150 H175 Z" fill="#64748b"/>
  <path d="M165 150 H195 V153 H165 Z" fill="#64748b"/>

  <!-- Medical Tools Tray -->
  <rect x="25" y="165" width="30" height="12" rx="3" fill="#cbd5e1" stroke="#94a3b8"/>
  <circle cx="35" cy="171" r="3" fill="#38bdf8"/>
  <rect x="42" y="168" width="8" height="6" rx="1" fill="#f59e0b"/>

  <!-- MAIN CHARACTER: DOCTOR (大夫) -->
  <g transform="translate(85, 60)">
    <!-- Doctor Body / Scrub / Coat -->
    <!-- Shoulders & Coat Base -->
    <path d="M-25 110 C-25 80 15 70 65 110 L75 140 H-35 Z" fill="url(#coatGrad)"/>
    
    <!-- Scrub Inner Collar -->
    <path d="M10 75 L20 90 L30 75 Z" fill="url(#scrubGrad)"/>
    
    <!-- Doctor Coat Lapels & Front -->
    <path d="M10 75 L-10 140 H35 L20 90 Z" fill="#e2e8f0"/>
    <path d="M30 75 L50 140 H20 L30 90 Z" fill="#e2e8f0"/>
    <line x1="20" y1="90" x2="20" y2="140" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Coat Buttons -->
    <circle cx="20" cy="105" r="2" fill="#64748b"/>
    <circle cx="20" cy="120" r="2" fill="#64748b"/>

    <!-- Stethoscope -->
    <!-- Tubing -->
    <path d="M-5 45 C-15 45 -20 60 -10 75 C0 90 20 85 20 95" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M45 45 C55 45 60 60 50 75 C40 90 20 85 20 95" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Chest Piece -->
    <circle cx="20" cy="99" r="6" fill="url(#metalGrad)" stroke="#ec4899" stroke-width="2"/>
    <!-- Earpieces -->
    <path d="M-5 42 L-10 38" fill="none" stroke="url(#metalGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M45 42 L50 38" fill="none" stroke="url(#metalGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="12" y="55" width="16" height="22" rx="6" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <circle cx="20" cy="38" r="22" fill="#fbcfe8"/>
    
    <!-- Hair (Professional Neat Style) -->
    <path d="M-2 32 C-2 15 42 15 42 32 C42 38 38 42 38 42 L32 25 C32 25 20 20 8 25 L2 42 C2 42 -2 38 -2 32 Z" fill="#334155"/>

    <!-- Friendly Facial Expression -->
    <!-- Eyes (Warm, Caring, Smiling) -->
    <path d="M10 35 C11 32 15 32 16 35" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 35 C25 32 29 32 30 35" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Gentle Smile -->
    <path d="M16 43 C18 46 22 46 24 43" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>

    <!-- Friendly Rosy Cheeks -->
    <circle cx="9" cy="39" r="3" fill="#fb7185" opacity="0.5"/>
    <circle cx="31" cy="39" r="3" fill="#fb7185" opacity="0.5"/>

    <!-- Medical Head Mirror / Headband (Classic Doctor Motif) -->
    <path d="M-1 30 C3 20 37 20 41 30" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="22" r="5" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="2" fill="#38bdf8"/>

    <!-- Arms & Active Action (Holding Clipboard / Caring Gesture) -->
    <!-- Back Arm / Hand -->
    <path d="M-15 90 C-30 95 -35 115 -25 125" fill="none" stroke="url(#coatGrad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Front Arm / Hand holding medical chart -->
    <path d="M55 95 C75 105 75 130 65 145" fill="none" stroke="url(#coatGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="63" cy="147" r="6" fill="#fbcfe8"/>

    <!-- Clipboard Prop held by Doctor -->
    <g transform="translate(50, 115) rotate(15)">
      <rect x="0" y="0" width="30" height="40" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
      <rect x="3" y="3" width="24" height="34" rx="2" fill="#f8fafc"/>
      <!-- Clip at top -->
      <rect x="10" y="-2" width="10" height="5" rx="1" fill="#475569"/>
      <!-- Lines on paper representing patient records -->
      <line x1="6" y1="10" x2="20" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="16" x2="24" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="22" x2="16" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <circle cx="21" cy="28" r="3" fill="#10b981"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Elements / Floating Medical Cross Accent -->
  <g transform="translate(30, 70)" opacity="0.8">
    <circle cx="0" cy="0" r="12" fill="#0284c7" opacity="0.2"/>
    <rect x="-3" y="-8" width="6" height="16" rx="2" fill="#38bdf8"/>
    <rect x="-8" y="-3" width="16" height="6" rx="2" fill="#38bdf8"/>
  </g>

  <g transform="translate(205, 55)" opacity="0.6">
    <circle cx="0" cy="0" r="10" fill="#10b981" opacity="0.2"/>
    <rect x="-2.5" y="-6" width="5" height="12" rx="1.5" fill="#10b981"/>
    <rect x="-6" y="-2.5" width="12" height="5" rx="1.5" fill="#10b981"/>
  </g>
</svg>