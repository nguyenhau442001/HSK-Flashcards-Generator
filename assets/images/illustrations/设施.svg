<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Warm Light for Library Lamp -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: MODERN SCHOOL / CAMPUS MULTI-FUNCTION FACILITY INTERIOR -->
  <!-- Back Wall & Architecture -->
  <rect x="20" y="20" width="200" height="150" fill="#2563eb" fill-opacity="0.1"/>
  
  <!-- Large Modern Window showing campus green -->
  <rect x="140" y="35" width="70" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="145" y="40" width="28" height="80" fill="url(#windowLight)"/>
  <rect x="177" y="40" width="28" height="80" fill="url(#windowLight)"/>
  <!-- Outdoor tree hint -->
  <circle cx="191" cy="70" r="12" fill="#10b981" fill-opacity="0.4"/>
  <rect x="189" y="80" width="4" height="30" fill="#475569"/>

  <!-- Wall Shelves / Modern Infrastructure Props -->
  <rect x="30" y="40" width="90" height="6" rx="3" fill="#475569"/>
  <!-- Books and items on shelf -->
  <rect x="38" y="24" width="8" height="16" rx="2" fill="#ec4899"/>
  <rect x="48" y="20" width="10" height="20" rx="2" fill="#38bdf8"/>
  <rect x="60" y="26" width="6" height="14" rx="2" fill="#fbbf24"/>
  <rect x="75" y="22" width="12" height="18" rx="2" fill="#10b981"/>

  <!-- Smart Digital Display / Interactive Whiteboard on Wall -->
  <rect x="30" y="55" width="60" height="40" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="34" y="59" width="52" height="32" rx="2" fill="url(#screenGlow)" fill-opacity="0.8"/>
  <!-- Chart graphs on digital screen -->
  <polyline points="40,80 50,70 60,75 70,65 80,68" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="65" r="3" fill="#fbbf24"/>

  <!-- Floor -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <!-- Floor perspective lines -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- FACILITIES: Modern Study Pod / Computer Station Desk -->
  <path d="M25 170 L35 130 L115 130 L125 170 Z" fill="#334155"/>
  <rect x="20" y="165" width="110" height="8" rx="2" fill="#475569"/>

  <!-- Computer Setup on Desk -->
  <!-- Monitor stand -->
  <rect x="65" y="115" width="10" height="18" fill="#64748b"/>
  <rect x="55" y="128" width="30" height="3" rx="1.5" fill="#94a3b8"/>
  <!-- Monitor -->
  <rect x="45" y="85" width="50" height="32" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <rect x="48" y="88" width="44" height="26" rx="2" fill="url(#screenGlow)"/>
  <!-- UI Elements on monitor -->
  <rect x="53" y="93" width="20" height="4" rx="2" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="53" y="100" width="30" height="8" rx="2" fill="#ffffff" fill-opacity="0.3"/>

  <!-- Modern Desk Lamp providing warm ambiance -->
  <path d="M105 130 L110 105 L115 105 L118 130 Z" fill="#94a3b8"/>
  <path d="M98 102 C98 96 104 92 112 92 C120 92 126 96 126 102 Z" fill="#fbbf24"/>
  <ellipse cx="112" cy="102" rx="14" ry="4" fill="url(#lampGlow)"/>

  <!-- Ergonomic Chair -->
  <rect x="70" y="145" width="28" height="35" rx="6" fill="#0ea5e9"/>
  <path d="M72 145 C72 130 96 130 96 145 Z" fill="#0284c7"/>
  <rect x="82" y="180" width="8" height="20" fill="#475569"/>
  <circle cx="86" cy="202" r="10" fill="#334155"/>

  <!-- SUBJECT/CHARACTERS: Student actively utilizing the comprehensive facilities -->
  <!-- Student Character (Sitting at desk, typing/studying happily) -->
  <!-- Body / Torso -->
  <path d="M55 140 C55 125 70 120 80 125 C90 130 95 145 95 165 L55 165 Z" fill="#10b981"/>
  
  <!-- Head & Hair -->
  <circle cx="75" cy="110" r="14" fill="#fcd34d"/>
  <!-- Hair (Stylish dark bob cut) -->
  <path d="M61 110 C61 98 89 98 89 110 C89 116 87 118 85 115 C80 110 70 110 65 115 C63 118 61 116 61 110 Z" fill="#1e293b"/>
  <!-- Friendly Happy Expression -->
  <path d="M73 113 Q75 116 78 113" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="71" cy="109" r="1.5" fill="#1e293b"/>
  <circle cx="79" cy="109" r="1.5" fill="#1e293b"/>
  <!-- Blush -->
  <circle cx="69" cy="113" r="2" fill="#f87171" opacity="0.6"/>
  <circle cx="81" cy="113" r="2" fill="#f87171" opacity="0.6"/>

  <!-- Arms / Hands interacting -->
  <path d="M58 135 L68 145 L78 138" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hands -->
  <circle cx="78" cy="138" r="3.5" fill="#fcd34d"/>

  <!-- Additional Infrastructure / Props in foreground/background -->
  <!-- Water Dispenser / Modern amenity in corner -->
  <rect x="195" y="125" width="24" height="55" rx="4" fill="#e2e8f0"/>
  <!-- Water bottles / tanks -->
  <path d="M201 115 C201 110 203 108 207 108 L213 108 C217 108 219 110 219 115 L219 125 L201 125 Z" fill="#38bdf8" fill-opacity="0.8"/>
  <rect x="203" y="135" width="8" height="10" rx="2" fill="#cbd5e1"/>
  <!-- Dispenser tap area -->
  <rect x="203" y="150" width="8" height="15" rx="1" fill="#cbd5e1"/>
  <circle cx="207" cy="140" r="2" fill="#ef4444"/>
  <circle cx="207" cy="146" r="2" fill="#3b82f6"/>

  <!-- Potted indoor plant adding to the rich, high-end environment -->
  <path d="M150 160 L156 185 L174 185 L180 160 Z" fill="#f43f5e"/>
  <ellipse cx="165" cy="160" rx="15" ry="4" fill="#be123c"/>
  <!-- Plant leaves -->
  <path d="M165 156 C165 130 140 130 145 150 C147 158 155 160 165 156 Z" fill="#10b981"/>
  <path d="M165 156 C170 120 195 130 185 152 C180 160 172 160 165 156 Z" fill="#059669"/>
  <path d="M165 156 C165 115 160 115 165 145 Z" fill="#34d399"/>

  <!-- Ambient lighting highlights -->
  <circle cx="112" cy="102" r="30" fill="url(#lampGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>
</svg>