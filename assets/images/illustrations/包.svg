<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Surface/Desk -->
  <path d="M0 180 Q120 170 240 180 L240 240 L0 240 Z" fill="#334155" opacity="0.4"/>
  
  <!-- Shadow for the bag -->
  <ellipse cx="120" cy="195" rx="60" ry="10" fill="#020617" opacity="0.6"/>

  <!-- Backpack (The "Bao") -->
  <g filter="url(#shadow)">
    <!-- Main Body -->
    <path d="M65 190 L175 190 Q185 190 185 175 L185 85 Q185 50 120 50 Q55 50 55 85 L55 175 Q55 190 65 190" fill="#fb923c"/>
    
    <!-- Front Pocket -->
    <path d="M75 185 L165 185 Q175 185 175 175 L175 125 Q175 115 165 115 L75 115 Q65 115 65 125 L65 175 Q65 185 75 185" fill="#f97316"/>
    
    <!-- Zipper Details -->
    <path d="M65 125 Q120 120 175 125" fill="none" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="123" r="3" fill="#cbd5e1"/>
    
    <!-- Main Compartment Opening (Revealing Contents) -->
    <path d="M70 85 Q120 75 170 85" fill="none" stroke="#fdba74" stroke-width="3" stroke-linecap="round"/>
    
    <!-- The Wallet (Ví tiền) peeking out -->
    <rect x="95" y="65" width="45" height="30" rx="4" fill="#92400e" transform="rotate(-15 117 80)"/>
    <path d="M98 75 L138 65" stroke="#78350f" stroke-width="1" transform="rotate(-15 117 80)"/>
    
    <!-- Notebook edge -->
    <rect x="135" y="60" width="30" height="40" rx="2" fill="#f8fafc" transform="rotate(10 150 80)"/>
    
    <!-- Straps -->
    <path d="M55 85 Q40 100 45 150" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
    <path d="M185 85 Q200 100 195 150" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Top Handle -->
    <path d="M100 50 Q120 35 140 50" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Context Props: Coffee Cup -->
  <g transform="translate(190, 160)">
    <path d="M0 0 L25 0 L22 30 Q20 35 12 35 Q4 35 2 30 Z" fill="#38bdf8"/>
    <path d="M2 5 L23 5" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M25 8 Q32 8 32 15 Q32 22 25 22" fill="none" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Context Props: Small Plant -->
  <g transform="translate(30, 155)">
    <path d="M0 25 L20 25 L17 40 Q10 45 3 40 Z" fill="#10b981"/>
    <path d="M10 25 Q10 5 2 0" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 20 Q18 10 22 15" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Lighting Accents -->
  <circle cx="60" cy="40" r="80" fill="#fbbf24" opacity="0.05"/>
</svg>