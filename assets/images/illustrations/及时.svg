<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Timeliness/Action -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Rescue/Help Beam Gradient -->
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Ambient Light -->
  <circle cx="160" cy="90" r="80" fill="url(#amberGlow)"/>
  
  <!-- Back Wall Details (Industrial/Warehouse Setting) -->
  <path d="M0 160 L240 160" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="25" y="45" width="40" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="35" y="55" width="20" height="30" rx="2" fill="#38bdf8" opacity="0.1"/>

  <!-- Floor Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#floorGrad)"/>

  <!-- Falling Cargo Box (Danger/Urgency) -->
  <g transform="translate(170, 75) rotate(-15)" filter="url(#dropShadow)">
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="#fb923c" stroke="#f97316" stroke-width="2"/>
    <path d="M-20 -20 L20 20 M20 -20 L-20 20" stroke="#ea580c" stroke-width="2" opacity="0.4"/>
    <rect x="-10" y="-10" width="20" height="20" rx="2" fill="#fed7aa"/>
  </g>
  <!-- Motion Lines for Falling Box -->
  <path d="M150 45 L160 65" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M165 40 L172 58" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Dynamic Light Beam from Helper -->
  <polygon points="95,95 155,75 185,150 115,165" fill="url(#beamGrad)" style="mix-blend-mode: screen;"/>

  <!-- Person in Danger (Reaching Out) -->
  <g transform="translate(145, 125)" filter="url(#dropShadow)">
    <!-- Shadow on floor -->
    <ellipse cx="5" cy="40" rx="15" ry="5" fill="#000000" opacity="0.5"/>
    
    <!-- Body & Legs -->
    <path d="M-5 15 L5 35 L12 35 L5 15 Z" fill="#ef4444"/>
    <path d="M-10 15 L-2 35 L5 35 L-5 12 Z" fill="#b91c1c"/>
    
    <!-- Torso -->
    <rect x="-12" y="-5" width="22" height="22" rx="4" fill="#ef4444"/>
    <path d="M-12 0 L10 0" stroke="#b91c1c" stroke-width="2"/>

    <!-- Head -->
    <circle cx="-2" cy="-14" r="8" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M-10 -16 C-10 -22 6 -22 6 -15 Z" fill="#38bdf8"/>

    <!-- Reaching Arms -->
    <path d="M5 -2 C18 -12 25 -15 25 -15" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8 0 L-22 -8" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- HERO CHARACTER: Timely Helper (Just in time!) -->
  <g transform="translate(85, 115)" filter="url(#dropShadow)">
    <!-- Floor Shadow -->
    <ellipse cx="-5" cy="50" rx="22" ry="7" fill="#000000" opacity="0.6"/>

    <!-- Legs in Action Stride -->
    <path d="M-12 25 L-25 45 L-15 48 L-5 30 Z" fill="#0284c7"/>
    <path d="M5 25 L18 45 L26 42 L12 22 Z" fill="#0369a1"/>
    
    <!-- Torso (Confident Posture) -->
    <rect x="-14" y="0" width="28" height="30" rx="6" fill="#0ea5e9"/>
    <!-- Dynamic Vest / Accent -->
    <path d="M-14 5 L-5 5 L-12 25 Z" fill="#38bdf8" opacity="0.5"/>
    <path d="M14 5 L5 5 L12 25 Z" fill="#38bdf8" opacity="0.5"/>

    <!-- Head -->
    <circle cx="0" cy="-12" r="9" fill="#fed7aa"/>
    <!-- Friendly Determined Face & Hair -->
    <path d="M-9 -16 C-9 -24 9 -24 9 -14 C5 -18 -5 -18 -9 -16 Z" fill="#1e293b"/>
    <circle cx="3" cy="-13" r="1.5" fill="#1e293b"/>

    <!-- Action Arms Catching/Helping -->
    <!-- Back Arm -->
    <path d="M-10 5 L-22 15 L-30 10" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Arm Extending Strongly -->
    <path d="M10 5 L35 -8 L50 -20" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Speed/Action Lines Around Helper -->
    <path d="M-35 0 L-25 0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-38 10 L-28 8" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-32 20 L-22 18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Impact / Timeliness Sparkles & Effects (Representing "Just in time / 及时") -->
  <g transform="translate(135, 95)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
    <path d="M0 -14 L0 14 M-14 0 L14 0 M-10 -10 L10 10 M-10 10 L10 -10" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(175, 115)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
    <path d="M0 -9 L0 9 M-9 0 L9 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(110, 65)">
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
    <path d="M0 -7 L0 7 M-7 0 L7 0" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="50" cy="120" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="70" cy="80" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="190" cy="180" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="130" cy="190" r="2" fill="#fbbf24" opacity="0.7"/>

  <!-- Decorative App Frame Border (Subtle) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#475569" stroke-width="2" opacity="0.3"/>
</svg>