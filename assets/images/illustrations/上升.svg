<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window Frame -->
  <rect x="40" y="40" width="160" height="160" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- Thermometer Graphic -->
  <g transform="translate(180, 60)">
    <rect x="-8" y="0" width="16" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <rect x="-4" y="100" width="8" height="30" rx="2" fill="#fb923c"/>
    <circle cx="0" cy="130" r="10" fill="#fb923c"/>
    <path d="M-2 100 L-2 40 L2 40 L2 100 Z" fill="#fb923c"/>
    <path d="M-5 35 L5 35 L0 25 Z" fill="#ec4899"/>
  </g>
  
  <!-- Character: Person looking at thermometer -->
  <g transform="translate(80, 120)">
    <path d="M20 80 Q20 40 40 40 T60 80" fill="#38bdf8" opacity="0.8"/>
    <circle cx="40" cy="30" r="15" fill="#fde68a"/>
    <path d="M30 25 L35 30 M45 25 L50 30 M40 40 L45 45" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M35 45 Q40 50 45 45" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Sun outside -->
  <circle cx="60" cy="70" r="20" fill="#fbbf24"/>
  <path d="M60 40 L60 30 M60 100 L60 110 M30 70 L20 70 M90 70 L100 70" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Heat waves -->
  <path d="M120 100 Q130 90 140 100 T160 100" stroke="#fb923c" stroke-width="2" fill="none"/>
  <path d="M120 110 Q130 100 140 110 T160 110" stroke="#fb923c" stroke-width="2" fill="none"/>
</svg>