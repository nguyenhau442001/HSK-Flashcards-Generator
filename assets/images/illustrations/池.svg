<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Park Grass -->
  <path d="M0 160 Q 120 140 240 160 L 240 240 L 0 240 Z" fill="#10b981" opacity="0.3"/>
  
  <!-- Pond (池) -->
  <ellipse cx="120" cy="180" rx="90" ry="40" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Fish -->
  <path d="M80 180 Q 90 170 100 180 T 120 180" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 190 Q 150 180 160 190 T 180 190" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <circle cx="110" cy="175" r="2" fill="#fbbf24"/>
  <circle cx="150" cy="185" r="2" fill="#fbbf24"/>
  
  <!-- Character: Child pointing -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M20 32 L 20 60 M 20 40 L 10 50 M 20 40 L 30 50" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M25 35 L 45 25" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Character: Adult standing -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M20 35 L 20 80 M 20 50 L 5 70 M 20 50 L 35 70" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Park Elements -->
  <path d="M20 140 L 40 100 L 60 140 Z" fill="#10b981" opacity="0.6"/>
  <path d="M200 150 L 220 110 L 240 150 Z" fill="#10b981" opacity="0.6"/>
  
  <!-- Decorative lights/bubbles -->
  <circle cx="40" cy="50" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="180" cy="40" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="120" cy="20" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>