<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Clothing Rack -->
  <path d="M60 200 L60 60 L180 60 L180 200" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" fill="none"/>
  <line x1="40" y1="200" x2="200" y2="200" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Suit (The 'Set') -->
  <g transform="translate(80, 70)">
    <!-- Jacket -->
    <path d="M20 0 L60 0 L70 30 L60 100 L10 100 L0 30 Z" fill="#38bdf8"/>
    <path d="M20 0 L30 40 L10 100" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Trousers -->
    <path d="M10 100 L35 100 L35 150 L20 150 Z" fill="#38bdf8"/>
    <path d="M35 100 L60 100 L50 150 L35 150 Z" fill="#38bdf8"/>
    <path d="M35 100 L35 150" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="190" cy="40" r="15" fill="#f59e0b" opacity="0.2"/>
  <circle cx="50" cy="180" r="10" fill="#10b981" opacity="0.3"/>
  <path d="M160 170 L175 160 L190 170 L175 180 Z" fill="#fb923c" opacity="0.6"/>
  
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="210" rx="70" ry="10" fill="#000" opacity="0.3"/>
</svg>