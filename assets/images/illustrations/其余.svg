<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Room Background Elements -->
  <!-- Window with night view / warm office interior -->
  <path d="M165 40 L210 40 L210 110 L165 110 Z" fill="#090d16" opacity="0.6"/>
  <path d="M175 50 L200 50 L200 95 L175 95 Z" fill="#38bdf8" opacity="0.1"/>
  <!-- City skyline through window -->
  <path d="M178 75 L182 75 L182 95 L178 95 Z M186 65 L192 65 L192 95 L186 95 Z M195 80 L198 80 L198 95 L195 95 Z" fill="#38bdf8" opacity="0.2"/>
  
  <!-- Warm Overhead Desk Lamp Light Cone -->
  <polygon points="120,15 150,150 90,150" fill="url(#warmLight)"/>

  <!-- Office Desk -->
  <rect x="25" y="145" width="190" height="12" rx="4" fill="#334155" filter="url(#shadow)"/>
  <rect x="35" y="157" width="12" height="65" fill="#1e293b"/>
  <rect x="193" y="157" width="12" height="65" fill="#1e293b"/>

  <!-- Desk Props: Completed tasks / messy piles (the 'done' part) -->
  <rect x="40" y="125" width="28" height="20" rx="2" fill="#475569" transform="rotate(-8 40 125)"/>
  <rect x="42" y="120" width="28" height="20" rx="2" fill="#64748b" transform="rotate(5 42 120)"/>
  <circle cx="55" cy="115" r="8" fill="#10b981"/> <!-- Green check badge representation -->
  <path d="M51 115 L54 118 L59 112" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Desk Props: Laptop & Remaining Tasks (The "其余" - Rest of the work) -->
  <!-- Laptop Base -->
  <path d="M70 145 L130 145 L138 130 L62 130 Z" fill="#64748b"/>
  <!-- Laptop Screen with UI elements showing remaining work -->
  <rect x="75" y="90" width="50" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="79" y="96" width="30" height="4" rx="2" fill="#38bdf8"/>
  <rect x="79" y="104" width="42" height="4" rx="2" fill="#ef4444" opacity="0.8"/> <!-- Pending item 1 -->
  <rect x="79" y="112" width="36" height="4" rx="2" fill="#ef4444" opacity="0.8"/> <!-- Pending item 2 -->
  <rect x="79" y="120" width="40" height="4" rx="2" fill="#ef4444" opacity="0.8"/> <!-- Pending item 3 -->
  
  <!-- Coffee Mug -->
  <rect x="145" y="128" width="14" height="17" rx="3" fill="#fb923c"/>
  <path d="M159 133 C164 133, 164 141, 159 141" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>

  <!-- CHARACTER 1 (Left): Relaxed / relieved colleague handing off work -->
  <g transform="translate(10, 0)">
    <!-- Body & Torso -->
    <path d="M45 155 C45 135, 65 135, 65 155 L70 210 L35 210 Z" fill="#3b82f6"/>
    <!-- Head & Hair -->
    <circle cx="55" cy="105" r="16" fill="#fbcfe8"/>
    <path d="M39 105 C39 90, 71 90, 71 105 C71 108, 68 110, 65 105 C60 98, 50 98, 45 105 C42 108, 39 105, 39 105 Z" fill="#1e293b"/>
    <!-- Face Expression (Relieved smile) -->
    <path d="M51 110 Q55 114 59 110" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="104" r="1.5" fill="#1e293b"/>
    <circle cx="60" cy="104" r="1.5" fill="#1e293b"/>
    <!-- Arm pointing/handing over towards Character 2 -->
    <path d="M55 140 L78 128" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="81" cy="126" r="5" fill="#fbcfe8"/>
  </g>

  <!-- CHARACTER 2 (Right): Confident lead taking over ("Leave the rest to me") -->
  <g transform="translate(110, 0)">
    <!-- Body & Torso -->
    <path d="M45 155 C45 135, 65 135, 65 155 L75 210 L30 210 Z" fill="#10b981"/>
    <!-- Head & Hair -->
    <circle cx="55" cy="100" r="17" fill="#fdedd4"/>
    <path d="M38 98 C38 80, 72 80, 72 98 C72 100, 65 95, 55 95 C45 95, 38 98, 38 98 Z" fill="#b45309"/>
    <!-- Face Expression (Confident, reassuring smile) -->
    <path d="M50 106 Q55 111 60 106" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="49" cy="99" r="1.5" fill="#1e293b"/>
    <circle cx="61" cy="99" r="1.5" fill="#1e293b"/>
    <!-- Active confident gesture: Thumbs up / hand on chest or reaching out to accept -->
    <path d="M55 135 L32 125" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
    <circle cx="28" cy="123" r="5" fill="#fdedd4"/>
    <!-- Thumb up accent -->
    <path d="M26 120 L28 115 L31 120" fill="#fdedd4"/>
  </g>

  <!-- Action Focus Elements (Glowing sparkles highlighting the handoff of remaining tasks) -->
  <g transform="translate(100, 110)">
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
    <path d="M-6 -6 L6 6 M-6 6 L6 -6" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(130, 95)">
    <circle cx="0" cy="0" r="2" fill="#38bdf8"/>
    <path d="M-4 -4 L4 4 M-4 4 L4 -4" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Plant Pot (Context depth) -->
  <path d="M15 200 L25 200 L23 220 L17 220 Z" fill="#64748b"/>
  <path d="M12 200 L28 200 L28 198 L12 198 Z" fill="#475569"/>
  <path d="M20 198 C10 180, 10 170, 20 160 C30 170, 30 180, 20 198 Z" fill="#10b981"/>
  <path d="M20 198 C25 175, 35 170, 40 165 C38 180, 30 190, 20 198 Z" fill="#059669"/>

</svg>