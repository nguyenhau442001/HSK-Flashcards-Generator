<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Window/Backdrop Light -->
    <radialGradient id="moodLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="120" cy="110" r="100" fill="url(#moodLight)"/>

  <!-- Back Wall & Window Frame -->
  <path d="M 40 40 L 200 40 L 200 160 L 40 160 Z" fill="#1e293b" opacity="0.5"/>
  <!-- Window Grid Light Beams -->
  <path d="M 80 40 L 90 160 L 110 160 L 100 40 Z" fill="#38bdf8" opacity="0.05"/>
  <path d="M 160 40 L 150 160 L 130 160 L 140 40 Z" fill="#38bdf8" opacity="0.05"/>

  <!-- Desk Surface -->
  <path d="M 10 165 C 50 155, 190 155, 230 165 L 235 220 C 235 228, 228 235, 220 235 L 20 235 C 12 235, 5 228, 5 220 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <path d="M 10 165 C 50 155, 190 155, 230 165 L 230 172 C 190 162, 50 162, 10 172 Z" fill="#475569" opacity="0.6"/>

  <!-- Office Props (Lamp & Paperwork for Context) -->
  <!-- Desk Lamp Base & Glow -->
  <ellipse cx="195" cy="160" rx="14" ry="6" fill="#64748b"/>
  <path d="M 190 160 L 195 125 L 200 160 Z" fill="#475569"/>
  <path d="M 185 120 L 205 120 L 210 130 L 180 130 Z" fill="#cbd5e1"/>
  <ellipse cx="195" cy="130" rx="15" ry="5" fill="#fbbf24" opacity="0.4"/>

  <!-- Scatter Papers / Evidence on Desk -->
  <g transform="rotate(-10 60 180)">
    <rect x="45" y="165" width="30" height="22" rx="2" fill="#f8fafc" opacity="0.9"/>
    <line x1="50" y1="172" x2="65" y2="172" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="178" x2="60" y2="178" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="rotate(15 75 185)">
    <rect x="60" y="175" width="28" height="20" rx="2" fill="#e2e8f0" opacity="0.9"/>
    <line x1="65" y1="182" x2="80" y2="182" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- MAIN CHARACTER (Expressive Denial Pose) -->
  <!-- Body/Torso & Jacket -->
  <path d="M 95 190 L 80 220 L 160 220 L 145 190 C 135 175, 105 175, 95 190 Z" fill="#0284c7" filter="url(#shadow)"/>
  <!-- Inner Shirt Collar -->
  <path d="M 110 172 L 120 188 L 130 172 Z" fill="#f8fafc"/>
  <path d="M 115 172 L 120 183 L 125 172 Z" fill="#cbd5e1"/>

  <!-- Neck & Head -->
  <rect x="112" y="145" width="16" height="30" rx="8" fill="#fbcfe8"/>
  <ellipse cx="120" cy="120" rx="26" ry="30" fill="#fbcfe8" filter="url(#shadow)"/>

  <!-- Hair Style -->
  <path d="M 94 115 C 92 90, 110 85, 122 85 C 138 85, 148 95, 146 120 C 142 105, 130 95, 120 95 C 108 95, 98 102, 94 115 Z" fill="#334155"/>

  <!-- Facial Features (Expressing Defensiveness / Denial) -->
  <!-- Eyebrows (Angled sharply for objection) -->
  <path d="M 102 110 L 115 114" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 138 110 L 125 114" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes (Wide, intense) -->
  <circle cx="108" cy="120" r="4" fill="#1e293b"/>
  <circle cx="132" cy="120" r="4" fill="#1e293b"/>
  <circle cx="109" cy="119" r="1.5" fill="#ffffff"/>
  <circle cx="133" cy="119" r="1.5" fill="#ffffff"/>

  <!-- Nose & Mouth (Determined, denying 'No') -->
  <circle cx="120" cy="130" r="2" fill="#fda4af"/>
  <!-- Grimace / Tight Mouth -->
  <path d="M 110 140 C 115 136, 125 136, 130 140" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- ARMS IN "DENIAL" GESTURE (Crossed/Waving away vigorously) -->
  <!-- Back Arm (Bent back defensively) -->
  <path d="M 90 180 C 70 170, 60 140, 75 130 C 85 125, 95 140, 95 160 Z" fill="#0284c7" filter="url(#shadow)"/>
  <!-- Back Hand (Palm outward) -->
  <circle cx="70" cy="125" r="9" fill="#fbcfe8"/>

  <!-- Front Arm (Sweeping forward, rejecting palm) -->
  <path d="M 150 185 C 175 180, 185 140, 170 120 C 160 110, 145 130, 140 150 Z" fill="#0369a1" filter="url(#shadow)"/>
  <!-- Front Hand (Flat palm pushing away - core visual for "Denial / Rejecting") -->
  <path d="M 165 105 C 175 100, 185 110, 180 125 C 175 135, 160 130, 160 120 Z" fill="#fbcfe8" filter="url(#shadow)"/>
  <!-- Fingers spread in rejection gesture -->
  <path d="M 180 115 L 192 110 L 188 120 Z" fill="#fbcfe8"/>

  <!-- ACTION & EMPHASIS ELEMENTS (Floating "X" and energetic dash lines for complete narrative action) -->
  <!-- Dynamic Action Lines near Rejecting Hand -->
  <path d="M 195 100 L 210 95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 200 115 L 220 115" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 195 130 L 210 135" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Bold 'X' Symbol (Clear visual metaphor for 'Denial' without using text) -->
  <g transform="translate(170, 45) rotate(15)" filter="url(#shadow)">
    <circle cx="15" cy="15" r="18" fill="#ef4444" opacity="0.9"/>
    <path d="M 9 9 L 21 21 M 21 9 L 9 21" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Secondary Smaller Accent 'X' for balanced motion -->
  <g transform="translate(35, 95) rotate(-10)" opacity="0.8" filter="url(#shadow)">
    <circle cx="12" cy="12" r="14" fill="#f97316"/>
    <path d="M 7 7 L 17 17 M 17 7 L 7 17" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Vignette / Lighting Edge Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>
</svg>