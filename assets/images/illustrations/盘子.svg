<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Ambient Environment -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="tableGlow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="plateBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="chopsticksGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <circle cx="120" cy="140" r="100" fill="url(#tableGlow)"/>

  <!-- Wooden Table Surface Line -->
  <path d="M 0 175 Q 120 185 240 175" stroke="#334155" stroke-width="2" fill="none"/>

  <!-- Ambient lighting/steam effect -->
  <path d="M 110 85 Q 120 60 100 40" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.2"/>
  <path d="M 130 90 Q 140 65 125 45" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.25"/>

  <!-- MAIN SUBJECT: Cái đĩa (Plate) with Shadow -->
  <ellipse cx="120" cy="142" rx="76" ry="38" fill="#090d16" opacity="0.6" filter="url(#shadow)"/>

  <!-- Outer Plate Rim -->
  <ellipse cx="120" cy="134" rx="74" ry="36" fill="url(#plateRim)" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Inner Plate Basin -->
  <ellipse cx="120" cy="136" rx="56" ry="26" fill="url(#plateBottom)"/>
  <ellipse cx="120" cy="138" rx="52" ry="23" fill="#f1f5f9"/>

  <!-- DINNER CONTENT ON THE PLATE (Action Context: Món ăn trên đĩa) -->
  <!-- Steamed Dumpling / Baozi base -->
  <g filter="url(#shadow)">
    <!-- Dumpling 1 (Center-left) -->
    <ellipse cx="105" cy="133" rx="16" ry="12" fill="#fbbf24"/>
    <path d="M 95 133 Q 105 120 115 133" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M 100 131 Q 105 122 110 131" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    
    <!-- Dumpling 2 (Center-right) -->
    <ellipse cx="135" cy="136" rx="17" ry="13" fill="#fcd34d"/>
    <path d="M 124 136 Q 135 122 146 136" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M 129 134 Q 135 124 141 134" stroke="#f59e0b" stroke-width="1.5" fill="none"/>

    <!-- Garnish / Green onions sprinkled -->
    <path d="M 115 130 Q 118 128 121 131" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 92 138 Q 95 136 98 139" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 145 132 Q 148 130 151 133" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ACTION CONTEXT: Chopsticks placing food / interacting -->
  <g filter="url(#shadow)">
    <!-- Chopstick 1 -->
    <line x1="200" y1="50" x2="110" y2="125" stroke="url(#chopsticksGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Chopstick 2 -->
    <line x1="212" y1="65" x2="116" y2="131" stroke="url(#chopsticksGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Chopsticks Rest/Holder on the side -->
    <path d="M 35 145 Q 45 140 55 145 L 50 152 Q 45 154 40 152 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Atmospheric Background Elements / Sparkles for vibrancy -->
  <circle cx="60" cy="80" r="3" fill="#38bdf8" opacity="0.6" filter="url(#glow)"/>
  <circle cx="180" cy="95" r="2" fill="#fbbf24" opacity="0.8" filter="url(#glow)"/>
  <circle cx="45" cy="180" r="2.5" fill="#ec4899" opacity="0.5"/>
  <circle cx="195" cy="165" r="3.5" fill="#10b981" opacity="0.7" filter="url(#glow)"/>

</svg>