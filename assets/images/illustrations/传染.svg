<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing effect for transmission waves -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Warm Amber Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Doctor's Consultation Room) -->
  <g id="environment">
    <!-- Wall & Floor Divider -->
    <path d="M 0,160 L 240,160" stroke="#334155" stroke-width="2" fill="none"/>
    <path d="M 0,161 L 240,161 L 240,240 L 0,240 Z" fill="#0f172a" opacity="0.6"/>

    <!-- Medical Cabinet/Shelf in Background -->
    <rect x="25" y="65" width="55" height="75" rx="4" fill="#334155" opacity="0.5"/>
    <rect x="33" y="75" width="39" height="15" rx="2" fill="#1e293b"/>
    <rect x="33" y="98" width="39" height="35" rx="2" fill="#1e293b"/>

    <!-- Ambient Medical Chart on Wall -->
    <rect x="175" y="70" width="35" height="45" rx="3" fill="#cbd5e1" opacity="0.2"/>
    <line x1="182" y1="80" x2="202" y2="80" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="182" y1="90" x2="197" y2="90" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="182" y1="98" x2="192" y2="98" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 15,200 L 225,200 L 210,160 L 30,160 Z" fill="#475569"/>
  <path d="M 15,200 L 225,200 L 225,208 L 15,208 Z" fill="#334155"/>

  <!-- Desk Props (Medical Equipment) -->
  <!-- Clipboard -->
  <g transform="translate(160, 150) rotate(-10)">
    <rect width="32" height="42" rx="3" fill="#f1f5f9"/>
    <rect x="10" y="-3" width="12" height="6" rx="2" fill="#94a3b8"/>
    <line x1="6" y1="10" x2="26" y2="10" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="6" y1="17" x2="22" y2="17" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="6" y1="24" x2="24" y2="24" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Main Scene Subjects: Patient and Doctor -->
  <g id="characters">
    <!-- Patient (Left) - Coughing/Sick -->
    <!-- Body/Shoulders -->
    <path d="M 40,200 C 40,175 60,170 75,170 C 90,170 105,175 110,200 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="75" cy="140" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 58,135 C 58,125 68,120 78,120 C 88,120 92,128 92,138 L 92,143 C 80,143 65,140 58,135 Z" fill="#475569"/>
    <!-- Closed Sick Eyes (Wincing) -->
    <path d="M 68,139 Q 72,143 76,139" stroke="#db2777" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 80,139 Q 84,143 88,139" stroke="#db2777" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Fever Cheeks -->
    <circle cx="71" cy="146" r="4" fill="#f43f5e" opacity="0.4"/>
    <!-- Hand covering mouth -->
    <circle cx="82" cy="155" r="7" fill="#fbcfe8"/>
    <path d="M 75,160 L 85,155 L 82,165 Z" fill="#fbcfe8"/>

    <!-- Doctor (Right) - Examining/Observing -->
    <!-- Body/Lab Coat -->
    <path d="M 140,200 C 140,175 155,165 170,165 C 185,165 200,175 200,200 Z" fill="#f8fafc"/>
    <!-- Stethoscope tubing -->
    <path d="M 170,165 C 160,175 155,190 155,200" stroke="#334155" stroke-width="3" fill="none"/>
    <circle cx="155" cy="200" r="4" fill="#94a3b8"/>
    <!-- Head -->
    <circle cx="170" cy="135" r="17" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 154,132 C 154,120 162,116 173,116 C 185,116 187,126 187,138 L 187,140 C 180,140 160,138 154,132 Z" fill="#1e293b"/>
    <!-- Focused Eye -->
    <circle cx="166" cy="134" r="2" fill="#1e293b"/>
    <path d="M 163,130 Q 166,128 169,130" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <!-- Concerned Eyebrow -->
    <path d="M 161,126 Q 166,123 171,127" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Medical Head Mirror / Reflector -->
    <circle cx="178" cy="128" r="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="178" cy="128" r="2" fill="#94a3b8"/>
    <path d="M 173,128 L 188,122" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- TRANSMISSION VISUALIZATION (Core concept: 传染 / Lây nhiễm) -->
  <!-- Floating Microbes/Pathogens & Infection Waves passing from patient to air -->
  <g id="transmission-elements" filter="url(#glow)">
    <!-- Expanding Sonic/Air/Spore Waves from Patient's Cough -->
    <path d="M 98,145 C 108,148 115,155 118,165" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" fill="none" opacity="0.8"/>
    <path d="M 104,138 C 118,142 128,152 133,168" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 112,130 C 130,135 142,148 148,170" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 3" fill="none" opacity="0.7"/>

    <!-- Floating Spores / Pathogen Particles -->
    <!-- Particle 1 -->
    <g transform="translate(108, 135)">
      <circle r="7" fill="#ec4899" opacity="0.9"/>
      <circle r="9" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
      <!-- Spikes -->
      <line x1="0" y1="-9" x2="0" y2="-12" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
      <line x1="9" y1="0" x2="12" y2="0" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
      <line x1="-9" y1="0" x2="-12" y2="0" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Particle 2 (Larger, glowing amber/pink) -->
    <g transform="translate(125, 115)">
      <circle r="10" fill="#f59e0b" opacity="0.9"/>
      <circle r="13" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.6"/>
      <!-- Surface proteins / spikes -->
      <circle cx="0" cy="-10" r="2.5" fill="#fb923c"/>
      <circle cx="9" cy="4" r="2.5" fill="#fb923c"/>
      <circle cx="-9" cy="4" r="2.5" fill="#fb923c"/>
      <circle cx="-5" cy="-8" r="2" fill="#fb923c"/>
      <circle cx="5" cy="-8" r="2" fill="#fb923c"/>
    </g>

    <!-- Particle 3 -->
    <g transform="translate(142, 142)">
      <circle r="5" fill="#38bdf8" opacity="0.9"/>
      <circle r="7" stroke="#38bdf8" stroke-width="1" stroke-dasharray="1 2" fill="none"/>
    </g>

    <!-- Particle 4 -->
    <g transform="translate(132, 160)">
      <circle r="6" fill="#ec4899" opacity="0.8"/>
      <line x1="-6" y1="-6" x2="-9" y2="-9" stroke="#ec4899" stroke-width="1.5"/>
      <line x1="6" y1="6" x2="9" y2="9" stroke="#ec4899" stroke-width="1.5"/>
    </g>
    
    <!-- Small floating dust/germ dots -->
    <circle cx="118" cy="110" r="2.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="155" cy="125" r="3" fill="#ec4899" opacity="0.9"/>
    <circle cx="120" cy="180" r="2" fill="#38bdf8" opacity="0.7"/>
    <circle cx="150" cy="100" r="2" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- Foreground Atmospheric Highlight / Medical Light Cone -->
  <path d="M 0,0 L 240,0 L 240,100 L 0,220 Z" fill="url(#lampGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Outer Framing Accent (Vignette & Polish) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.5"/>
</svg>