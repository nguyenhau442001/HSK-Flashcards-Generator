<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Hospital Room Background Elements -->
  <rect x="20" y="40" width="200" height="120" rx="8" fill="#334155" opacity="0.5"/>
  <circle cx="180" cy="70" r="15" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Hospital Bed -->
  <rect x="40" y="110" width="80" height="20" rx="4" fill="#e2e8f0"/>
  <path d="M40 130h80v10a4 4 0 0 1-4 4H44a4 4 0 0 1-4-4z" fill="#cbd5e1"/>
  
  <!-- Doctor Character -->
  <g transform="translate(150, 90)">
    <circle cx="0" cy="0" r="12" fill="#fde68a"/>
    <rect x="-15" y="10" width="30" height="40" rx="6" fill="#38bdf8"/>
    <rect x="-18" y="12" width="36" height="8" rx="2" fill="#38bdf8"/>
    <path d="M-5 50l-5 20M5 50l5 20" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Nurse Character -->
  <g transform="translate(185, 110)">
    <circle cx="0" cy="0" r="10" fill="#fde68a"/>
    <rect x="-12" y="8" width="24" height="35" rx="5" fill="#10b981"/>
    <path d="M-4 43l-3 15M4 43l3 15" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Urgent Clipboard/Signaling -->
  <rect x="140" y="50" width="20" height="25" rx="2" fill="#ec4899"/>
  <rect x="144" y="54" width="12" height="3" rx="1" fill="#fff"/>
  <rect x="144" y="60" width="12" height="3" rx="1" fill="#fff"/>
  <rect x="144" y="66" width="8" height="3" rx="1" fill="#fff"/>
  
  <!-- Empty Space/Call for help -->
  <path d="M60 80 Q 80 60 100 80" stroke="#fb923c" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  <circle cx="110" cy="75" r="4" fill="#fb923c"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>
