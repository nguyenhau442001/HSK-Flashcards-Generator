<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Accent Light -->
    <radialGradient id="deskGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Document Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#deskGlow)" />

  <!-- WINDOW & ENVIRONMENT -->
  <!-- Window Frame -->
  <rect x="25" y="20" width="85" height="100" rx="6" fill="#334155" />
  <rect x="30" y="25" width="75" height="90" rx="3" fill="#1e293b" />
  <!-- City Skyline / Rain Context outside -->
  <rect x="38" y="70" width="12" height="40" fill="#475569" opacity="0.6" />
  <rect x="55" y="55" width="16" height="55" fill="#475569" opacity="0.5" />
  <rect x="75" y="80" width="20" height="30" fill="#475569" opacity="0.7" />
  <!-- Window divider -->
  <line x1="67" y1="25" x2="67" y2="115" stroke="#334155" stroke-width="3" />
  <line x1="30" y1="70" x2="105" y2="70" stroke="#334155" stroke-width="3" />

  <!-- Bookshelf / Office Props in background -->
  <rect x="135" y="35" width="80" height="8" rx="2" fill="#475569" />
  <path d="M145 15 L152 35 L140 35 Z" fill="#38bdf8" />
  <rect x="156" y="18" width="10" height="17" fill="#fb923c" rx="1" />
  <rect x="168" y="14" width="12" height="21" fill="#10b981" rx="1" />
  <rect x="182" y="20" width="8" height="15" fill="#ec4899" rx="1" />

  <!-- DESK SURFACE -->
  <path d="M10 170 L230 170 L230 220 L10 220 Z" fill="#0f172a" />
  <rect x="10" y="162" width="220" height="10" rx="3" fill="#334155" />

  <!-- LAMP -->
  <!-- Lamp Base -->
  <ellipse cx="200" cy="162" rx="14" ry="4" fill="#64748b" />
  <!-- Lamp Arm -->
  <path d="M200 162 L185 110 L160 90" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Lamp Shade & Beam -->
  <path d="M145 75 L175 85 L165 100 L135 90 Z" fill="#fbbf24" />
  <polygon points="135,90 40,220 180,220" fill="#fbbf24" opacity="0.08" />

  <!-- SECOND CHARACTER (Attempting to compromise / pushing folder) -->
  <!-- Body & Suit (Slate/Red accent for rule-breaker/temptation) -->
  <path d="M160 170 C160 150 175 140 195 140 C215 140 230 150 230 170 Z" fill="#475569" />
  <!-- Arm reaching forward -->
  <path d="M175 145 L135 155" fill="none" stroke="#475569" stroke-width="14" stroke-linecap="round" />
  <!-- Hand holding folder -->
  <circle cx="128" cy="157" rx="6" fill="#fca5a5" />

  <!-- Second Character Head & Hair -->
  <circle cx="195" cy="115" r="16" fill="#fca5a5" />
  <path d="M180 110 C180 95 210 95 210 110 C210 115 208 120 205 120 L185 120 C182 120 180 115 180 110 Z" fill="#1e293b" />
  <!-- Persuasion expression: Sly smile -->
  <path d="M193 118 Q197 122 201 118" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" />
  <!-- Eye -->
  <circle cx="199" cy="112" r="2" fill="#1e293b" />

  <!-- THE FOLDER / CONTRACT OF COMPROMISE -->
  <g filter="url(#softShadow)">
    <path d="M95 140 L135 145 L130 175 L90 170 Z" fill="#ea580c" />
    <path d="M92 145 L132 150 L128 172 L88 167 Z" fill="#fed7aa" />
    <!-- Red Stamp / Badge on document -->
    <circle cx="110" cy="158" r="8" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2" />
  </g>


  <!-- MAIN CHARACTER (坚持原则 - Firm, resolute, standing ground) -->
  <!-- Torso & Professional Attire -->
  <path d="M40 170 C40 145 60 135 80 135 C100 135 120 145 120 170 Z" fill="#0284c7" />
  <path d="M65 135 L80 160 L95 135 Z" fill="#f8fafc" /> <!-- Collar -->
  <path d="M78 150 L82 170" stroke="#0f172a" stroke-width="2" /> <!-- Tie -->

  <!-- Crossed Arms / Firm Defensive Posture (Showing Principle) -->
  <!-- Back Arm -->
  <path d="M60 145 L90 155" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" />
  <!-- Front Arm crossing firmly -->
  <path d="M95 140 L65 165 L85 175" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hand firmly stopping the folder -->
  <circle cx="95" cy="140" r="7" fill="#fbcfe8" filter="url(#softShadow)" />

  <!-- Head & Determined Facial Expression -->
  <circle cx="80" cy="105" r="18" fill="#fbcfe8" />
  <!-- Neat Professional Hair -->
  <path d="M63 105 C63 85 97 85 97 105 C97 110 95 112 92 110 C85 98 75 98 68 110 C65 112 63 110 63 105 Z" fill="#334155" />

  <!-- Confident, Firm Eyebrows & Eyes -->
  <path d="M70 100 L77 102" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M83 102 L90 100" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="73" cy="106" r="2.5" fill="#1e293b" />
  <circle cx="87" cy="106" r="2.5" fill="#1e293b" />
  <!-- Determined Firm Mouth -->
  <path d="M76 116 L84 116" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" />
  <!-- Rosy Cheeks of resolve -->
  <circle cx="70" cy="111" r="3" fill="#f43f5e" opacity="0.3" />
  <circle cx="90" cy="111" r="3" fill="#f43f5e" opacity="0.3" />

  <!-- DESK ACCESSORIES (Context of Work/Rules) -->
  <!-- Gold Scale of Justice / Rules Miniature Decor on Desk -->
  <path d="M40 162 L48 145 L56 162 Z" fill="#fbbf24" />
  <rect x="47" y="142" width="2" height="22" fill="#fbbf24" />
  <line x1="40" y1="148" x2="56" y2="148" stroke="#fbbf24" stroke-width="2" />
  <path d="M37 155 Q40 160 43 155 Z" fill="#fbbf24" />
  <path d="M53 155 Q56 160 59 155 Z" fill="#fbbf24" />

  <!-- Mug -->
  <rect x="105" y="150" width="14" height="18" rx="2" fill="#38bdf8" />
  <path d="M119 154 C124 154 124 164 119 164" fill="none" stroke="#38bdf8" stroke-width="2" />

</svg>