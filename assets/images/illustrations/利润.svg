<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Cityscape Glow -->
    <linearGradient id="window-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31103f"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>

    <!-- Chart Upward Green Glow -->
    <linearGradient id="chart-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Character 1 Skin -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd9b3"/>
      <stop offset="100%" stop-color="#f3c292"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Office Interior Back Wall & Window -->
  <g id="environment">
    <!-- Large Window Frame -->
    <rect x="135" y="25" width="80" height="110" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="140" y="30" width="70" height="100" fill="url(#window-sky)"/>
    
    <!-- Distant City Skyscrapers inside Window -->
    <rect x="145" y="70" width="12" height="60" fill="#1e1b4b" opacity="0.6"/>
    <rect x="160" y="55" width="16" height="75" fill="#1e1b4b" opacity="0.8"/>
    <rect x="180" y="85" width="10" height="45" fill="#1e1b4b" opacity="0.5"/>
    <rect x="193" y="65" width="12" height="65" fill="#1e1b4b" opacity="0.7"/>
    <!-- Window City Lights -->
    <rect x="148" y="75" width="2" height="3" fill="#fbbf24" opacity="0.8"/>
    <rect x="151" y="85" width="2" height="3" fill="#fbbf24" opacity="0.8"/>
    <rect x="164" y="62" width="3" height="3" fill="#fbbf24" opacity="0.8"/>
    <rect x="168" y="75" width="3" height="3" fill="#38bdf8" opacity="0.8"/>
    <rect x="196" y="80" width="2" height="3" fill="#fbbf24" opacity="0.8"/>

    <!-- Window Grid lines -->
    <line x1="175" y1="30" x2="175" y2="130" stroke="#334155" stroke-width="1.5"/>
    <line x1="140" y1="80" x2="210" y2="80" stroke="#334155" stroke-width="1.5"/>

    <!-- Indoor Plant Shelf / Plant -->
    <path d="M25 80 Q25 65 35 65 Q45 65 45 80 Z" fill="#065f46"/>
    <path d="M20 75 Q35 50 35 45 Q35 50 50 75 Z" fill="#10b981"/>
    <path d="M28 72 Q20 55 15 50 Q22 62 28 72 Z" fill="#34d399"/>
    <path d="M42 72 Q50 55 55 50 Q48 62 42 72 Z" fill="#34d399"/>
    <rect x="25" y="80" width="20" height="15" rx="3" fill="#cbd5e1"/>

    <!-- Modern Wall Art / Frame -->
    <rect x="75" y="35" width="40" height="30" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M82 55 L90 45 L98 52 L108 40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Office Desk -->
  <g id="desk">
    <!-- Desk Surface -->
    <rect x="10" y="160" width="220" height="12" rx="3" fill="url(#desk-grad)"/>
    <rect x="15" y="172" width="210" height="40" fill="#1e293b"/>
    <!-- Desk Legs -->
    <rect x="30" y="172" width="8" height="48" fill="#0f172a"/>
    <rect x="202" y="172" width="8" height="48" fill="#0f172a"/>
  </g>

  <!-- Financial Dashboard / Large Holographic Screen showing HIGH PROFIT -->
  <g id="profit-dashboard">
    <!-- Floating Screen Background -->
    <rect x="70" y="75" width="95" height="75" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    
    <!-- Screen Header -->
    <rect x="78" y="83" width="30" height="6" rx="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="155" cy="86" r="3" fill="#10b981"/>

    <!-- Chart Area Background Glow -->
    <polygon points="80,135 80,115 100,105 120,110 145,88 157,135" fill="url(#chart-glow)"/>

    <!-- Upward Trend Line & Nodes (Signifying HIGH Profit) -->
    <polyline points="80,130 100,115 120,120 145,92 157,82" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Data Points -->
    <circle cx="100" cy="115" r="3" fill="#10b981"/>
    <circle cx="120" cy="120" r="3" fill="#10b981"/>
    <circle cx="145" cy="92" r="3.5" fill="#10b981"/>
    <circle cx="157" cy="82" r="4" fill="#34d399"/>

    <!-- Bar Chart Elements Behind Line -->
    <rect x="83" y="120" width="8" height="15" rx="1" fill="#334155"/>
    <rect x="99" y="110" width="8" height="25" rx="1" fill="#334155"/>
    <rect x="115" y="115" width="8" height="20" rx="1" fill="#334155"/>
    <rect x="131" y="100" width="8" height="35" rx="1" fill="#1e3a8a"/>
    <rect x="147" y="88" width="8" height="47" rx="1" fill="#065f46"/>

    <!-- Glowing Up Arrow Symbol (Profit indicator) -->
    <path d="M148 76 L157 66 L166 76" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="157" y1="84" x2="157" y2="67" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Laptop on Desk -->
  <g id="laptop">
    <!-- Laptop Base -->
    <path d="M 45 160 L 95 160 L 102 163 L 38 163 Z" fill="#64748b"/>
    <!-- Laptop Screen Back -->
    <rect x="42" y="125" width="50" height="36" rx="3" fill="#475569"/>
    <!-- Laptop Screen Inner -->
    <rect x="45" y="128" width="44" height="30" fill="#0f172a"/>
    <!-- Mini Graphic on Laptop -->
    <polyline points="49,150 56,144 63,147 72,135 81,133" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug -->
  <path d="M185 145 L200 145 L198 160 L187 160 Z" fill="#f8fafc"/>
  <path d="M200 148 Q206 148 206 153 Q206 158 200 158" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <!-- Steam -->
  <path d="M190 138 Q192 133 189 128" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Character 1 (Excited Employee / Analyst pointing at High Profit) -->
  <g id="character-analyst">
    <!-- Torso / Suit -->
    <path d="M 55 170 C 55 145 75 140 85 140 C 95 140 115 145 115 170 Z" fill="#3b82f6"/>
    <!-- Shirt Collar & Tie -->
    <polygon points="75,140 85,155 95,140" fill="#f8fafc"/>
    <polygon points="82,148 88,148 86,170 84,170" fill="#ef4444"/>

    <!-- Neck -->
    <rect x="77" y="130" width="16" height="15" fill="url(#skin)"/>

    <!-- Head -->
    <circle cx="85" cy="115" r="18" fill="url(#skin)"/>

    <!-- Hair -->
    <path d="M 68 115 C 68 98 102 98 102 115 C 102 118 100 112 97 108 C 90 100 80 100 73 108 C 70 112 68 115 68 115 Z" fill="#1e293b"/>

    <!-- Facial Expression (Happy / Delighted) -->
    <!-- Eyes (Happy Arcs) -->
    <path d="M 76 113 Q 80 109 84 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 88 113 Q 92 109 96 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 80 122 Q 85 128 90 122" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <!-- Blush -->
    <circle cx="74" cy="118" r="3" fill="#fca5a5" opacity="0.6"/>
    <circle cx="96" cy="118" r="3" fill="#fca5a5" opacity="0.6"/>

    <!-- Right Arm (Reaching out / Pointing enthusiastically at the Profit chart) -->
    <path d="M 105 150 Q 125 130 138 115" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="140" cy="112" r="6" fill="url(#skin)"/>
    <!-- Index finger pointing -->
    <path d="M 144 110 L 150 108 L 145 113 Z" fill="url(#skin)"/>

    <!-- Left Arm (Bent resting on hip / casual joy) -->
    <path d="M 62 150 Q 52 160 58 175" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Foreground decorative elements for depth (Plant leaf blurred) -->
  <path d="M -10 240 Q 10 210 30 240 Z" fill="#059669" opacity="0.8"/>
  <path d="M 220 240 Q 235 215 250 240 Z" fill="#047857" opacity="0.8"/>
</svg>