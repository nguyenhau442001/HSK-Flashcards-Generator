<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sky Gradient (Dawn/Dusk warm glow) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31103f"/>
      <stop offset="60%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Field Gradient -->
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Distant Mountains -->
    <linearGradient id="mountGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- House Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container with Rounded Corners -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Clipping mask for rounded composition -->
  <clipPath id="sceneClip">
    <rect width="240" height="240" rx="24" />
  </clipPath>

  <g clip-path="url(#sceneClip)">
    <!-- Sky Background -->
    <rect x="0" y="0" width="240" height="130" fill="url(#skyGrad)"/>

    <!-- Sun/Moon Glow -->
    <circle cx="180" cy="55" r="20" fill="#fef08a" opacity="0.9"/>
    <circle cx="180" cy="55" r="28" fill="#f59e0b" opacity="0.3"/>

    <!-- Distant Mountains -->
    <path d="M-10 110 Q 50 60 110 90 T 250 80 L 250 130 L -10 130 Z" fill="url(#mountGrad)" opacity="0.7"/>
    <path d="M 40 100 Q 120 40 200 95 L 250 120 L 0 120 Z" fill="url(#mountGrad)"/>

    <!-- Rolling Hills / Fields -->
    <path d="M 0 110 Q 90 90 240 115 L 240 240 L 0 240 Z" fill="#047857"/>
    <path d="M 0 130 Q 140 110 240 145 L 240 240 L 0 240 Z" fill="url(#fieldGrad)"/>

    <!-- Rice Paddy Terraces / Crop Rows (Perspective Lines) -->
    <path d="M 120 160 Q 160 180 240 170" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 100 180 Q 150 205 240 195" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 80 200 Q 140 230 240 220" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Rural House (Traditional & Cozy) -->
    <!-- House Shadow -->
    <ellipse cx="65" cy="155" rx="45" ry="12" fill="#022c22" opacity="0.4"/>
    
    <!-- House Walls -->
    <rect x="35" y="125" width="60" height="30" fill="url(#wallGrad)"/>
    
    <!-- House Roof (Tile texture effect) -->
    <path d="M 25 125 L 65 95 L 105 125 Z" fill="url(#roofGrad)"/>
    <path d="M 30 123 L 65 98 L 100 123 Z" fill="#991b1b" opacity="0.5"/>
    <rect x="60" y="87" width="10" height="12" fill="#7f1d1d" rx="2"/>

    <!-- Wooden Door -->
    <rect x="57" y="135" width="16" height="20" rx="2" fill="#78350f"/>
    <circle cx="70" cy="146" r="1.5" fill="#fbbf24"/>

    <!-- Window with warm light -->
    <rect x="42" y="133" width="10" height="10" rx="1" fill="#f59e0b"/>
    <line x1="47" y1="133" x2="47" y2="143" stroke="#78350f" stroke-width="1"/>
    <line x1="42" y1="138" x2="52" y2="138" stroke="#78350f" stroke-width="1"/>

    <!-- Glowing Lantern hanging from eaves -->
    <line x1="30" y1="115" x2="30" y2="122" stroke="#451a03" stroke-width="1.5"/>
    <ellipse cx="30" cy="125" rx="5" ry="6" fill="#ef4444"/>
    <path d="M 27 122 L 33 122 M 27 128 L 33 128" stroke="#b91c1c" stroke-width="1"/>

    <!-- Rustic Bamboo Fence on the left -->
    <g stroke="#b45309" stroke-width="3" stroke-linecap="round">
      <line x1="10" y1="150" x2="10" y2="175"/>
      <line x1="20" y1="145" x2="20" y2="170"/>
      <line x1="30" y1="142" x2="30" y2="167"/>
      <!-- Horizontal rails -->
      <line x1="5" y1="152" x2="35" y2="147" stroke-width="2"/>
      <line x1="5" y1="162" x2="35" y2="157" stroke-width="2"/>
    </g>

    <!-- Lush Green Tree (Foreground right) -->
    <!-- Trunk -->
    <path d="M 195 160 Q 200 130 190 100" stroke="#78350f" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 197 125 Q 215 110 220 95" stroke="#78350f" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Foliage Layers -->
    <circle cx="190" cy="95" r="22" fill="#059669"/>
    <circle cx="175" cy="105" r="18" fill="#10b981"/>
    <circle cx="210" cy="95" r="16" fill="#047857"/>
    <circle cx="200" cy="80" r="18" fill="#34d399"/>

    <!-- Cute Water Buffalo / Ox resting in field (Classic rural imagery) -->
    <g transform="translate(130, 155)">
      <!-- Body shadow -->
      <ellipse cx="25" cy="20" rx="20" ry="10" fill="#022c22" opacity="0.4"/>
      <!-- Body -->
      <ellipse cx="25" cy="15" rx="18" ry="12" fill="#334155"/>
      <!-- Head -->
      <circle cx="12" cy="12" r="8" fill="#334155"/>
      <!-- Horns -->
      <path d="M 8 7 Q 4 2 10 -2" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 14 7 Q 18 2 12 -2" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Legs -->
      <rect x="15" y="22" width="4" height="10" rx="2" fill="#1e293b"/>
      <rect x="31" y="22" width="4" height="10" rx="2" fill="#1e293b"/>
      <!-- Tail -->
      <path d="M 43 12 Q 48 20 46 25" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Flying Birds (V-shape) in the sky -->
    <path d="M 80 45 Q 85 40 90 45 Q 95 40 100 45" stroke="#fef08a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 110 30 Q 114 26 118 30 Q 122 26 126 30" stroke="#fef08a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Glowing Fireflies / Magic Rural Atmosphere Sparks -->
    <circle cx="70" cy="170" r="2" fill="#fbbf24" opacity="0.8"/>
    <circle cx="110" cy="190" r="1.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="150" cy="140" r="2" fill="#fef08a" opacity="0.7"/>
    <circle cx="50" cy="100" r="1.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="130" cy="60" r="2" fill="#38bdf8" opacity="0.5"/>

    <!-- Foreground Wheat Stalks / Grass Silhouettes -->
    <path d="M 0 240 L 0 210 Q 5 200 10 240 Z" fill="#065f46"/>
    <path d="M 220 240 Q 230 200 240 195 L 240 240 Z" fill="#065f46"/>
    
    <!-- Vibrant glowing accent flora -->
    <path d="M 15 240 Q 18 215 22 240 Z" fill="#10b981"/>
    <circle cx="20" cy="216" r="3" fill="#fb923c"/>
    <circle cx="24" cy="220" r="2.5" fill="#fbbf24"/>

    <path d="M 105 240 Q 110 210 115 240 Z" fill="#065f46"/>
    <circle cx="110" cy="212" r="3.5" fill="#f43f5e"/>
    <circle cx="106" cy="218" r="2.5" fill="#fbbf24"/>
  </g>
</svg>