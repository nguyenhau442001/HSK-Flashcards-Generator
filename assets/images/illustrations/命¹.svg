<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Hospital Bed -->
  <rect x="40" y="140" width="160" height="30" rx="5" fill="#e2e8f0"/>
  <rect x="50" y="120" width="140" height="20" rx="10" fill="#f8fafc"/>
  
  <!-- Patient -->
  <ellipse cx="80" cy="125" rx="12" ry="15" fill="#fcd34d"/>
  <path d="M70 135 Q80 145 90 135" stroke="#fcd34d" stroke-width="3" fill="none"/>
  
  <!-- Doctor -->
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="15" fill="#fcd34d"/>
    <rect x="-10" y="15" width="20" height="40" rx="5" fill="#38bdf8"/>
    <path d="M-15 25 L-25 40 M15 25 L25 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="-5" y="15" width="10" height="40" fill="#ffffff"/>
  </g>
  
  <!-- Medical Equipment (Heart Monitor) -->
  <rect x="160" y="40" width="50" height="40" rx="4" fill="#334155" stroke="#10b981" stroke-width="2"/>
  <path d="M165 60 L175 60 L180 45 L185 75 L190 60 L205 60" stroke="#10b981" stroke-width="2" fill="none"/>
  
  <!-- IV Stand -->
  <line x1="190" y1="140" x2="190" y2="60" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="190" cy="55" r="5" fill="#ec4899"/>
  <path d="M190 60 L170 90" stroke="#ec4899" stroke-width="2"/>
  
  <!-- Action/Effort Glow -->
  <circle cx="150" cy="100" r="25" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Floor -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
</svg>