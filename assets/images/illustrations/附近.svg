<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Park Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- House Wall Gradient -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Warm Window Glow -->
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </radialGradient>
  </defs>

  <!-- Container / Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Stars & Night Sky Ambiance -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="30" cy="30" r="1.5"/>
    <circle cx="80" cy="20" r="1"/>
    <circle cx="150" cy="35" r="1.5"/>
    <circle cx="210" cy="25" r="2"/>
    <circle cx="180" cy="65" r="1"/>
  </g>

  <!-- Distant City Silhouette / Background Layer -->
  <path d="M 0 140 L 0 125 L 15 125 L 15 140 L 40 140 L 40 110 L 60 110 L 60 140 L 90 140 L 90 120 L 110 120 L 110 140 L 240 140 L 240 180 L 0 180 Z" fill="#1e293b" opacity="0.7"/>

  <!-- THE HOUSE (Representing "My House" / "我家") -->
  <g id="house">
    <!-- House Base -->
    <rect x="15" y="100" width="75" height="60" rx="4" fill="url(#houseGrad)"/>
    <!-- Roof -->
    <path d="M 10 102 L 52 70 L 94 102 Z" fill="#b45309"/>
    <!-- Door -->
    <rect x="42" y="130" width="20" height="30" rx="2" fill="#78350f"/>
    <!-- Warm Glowing Window -->
    <rect x="25" y="112" width="14" height="14" rx="2" fill="url(#windowGlow)"/>
    <line x1="32" y1="112" x2="32" y2="126" stroke="#b45309" stroke-width="1.5"/>
    <line x1="25" y1="119" x2="39" y2="119" stroke="#b45309" stroke-width="1.5"/>
    <!-- House Plant / Porch detail -->
    <circle cx="70" cy="150" r="5" fill="#10b981"/>
    <path d="M 67 155 L 73 155 L 71 160 L 69 160 Z" fill="#94a3b8"/>
  </g>

  <!-- PATHWAY / STREET CONNECTING HOUSE TO PARK -->
  <path d="M 52 160 Q 90 170 120 185 Q 160 205 200 210 L 220 240 L 70 240 Z" fill="#334155" opacity="0.9"/>
  <path d="M 55 162 Q 91 171 120 185 Q 159 204 195 209" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

  <!-- THE PARK (Representing "公园" nearby) -->
  <g id="park">
    <!-- Park Grass Ground -->
    <path d="M 110 160 Q 160 140 240 150 L 240 240 L 110 240 Z" fill="url(#groundGrad)"/>
    
    <!-- Park Archway / Entrance Sign (Stylized, no text) -->
    <path d="M 130 180 L 130 135 Q 150 120 170 135 L 170 180" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
    <path d="M 125 138 L 175 138 L 175 145 L 125 145 Z" fill="#10b981"/>
    <!-- Lanterns on Arch -->
    <circle cx="140" cy="135" r="4" fill="#fbbf24"/>
    <circle cx="160" cy="135" r="4" fill="#fbbf24"/>

    <!-- Deciduous Park Tree -->
    <path d="M 210 175 L 214 135 L 206 135 Z" fill="#78350f"/>
    <circle cx="210" cy="120" r="22" fill="#059669"/>
    <circle cx="198" cy="128" r="14" fill="#10b981"/>
    <circle cx="222" cy="125" r="15" fill="#34d399"/>

    <!-- Park Bench -->
    <rect x="135" y="195" width="30" height="4" rx="1" fill="#78350f"/>
    <rect x="138" y="190" width="24" height="6" rx="1" fill="#92400e"/>
    <line x1="138" y1="199" x2="140" y2="204" stroke="#451a03" stroke-width="2"/>
    <line x1="162" y1="199" x2="160" y2="204" stroke="#451a03" stroke-width="2"/>

    <!-- Lamppost -->
    <line x1="115" y1="200" x2="115" y2="150" stroke="#64748b" stroke-width="3"/>
    <path d="M 110 150 L 115 145 L 120 150 Z" fill="#fbbf24"/>
    <circle cx="115" cy="148" r="6" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- FOREGROUND CHARACTER & PET WALKING (Experiencing proximity) -->
  <g id="character-and-dog">
    <!-- Dog -->
    <g transform="translate(95, 200)">
      <ellipse cx="12" cy="10" rx="8" ry="6" fill="#d97706"/>
      <circle cx="6" cy="7" r="5" fill="#d97706"/>
      <path d="M 4 5 L 2 2 L 6 4 Z" fill="#b45309"/>
      <line x1="8" y1="15" x2="7" y2="21" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="15" x2="17" y2="21" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
      <path d="M 19 9 Q 23 6 22 3" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Person Walking -->
    <g transform="translate(65, 170)">
      <!-- Legs/Stride -->
      <line x1="15" y1="35" x2="10" y2="52" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
      <line x1="15" y1="35" x2="22" y2="50" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
      <!-- Torso (Hoodie) -->
      <rect x="8" y="15" width="16" height="22" rx="6" fill="#ec4899"/>
      <!-- Head -->
      <circle cx="16" cy="8" r="6" fill="#fde047"/>
      <!-- Hair -->
      <path d="M 10 7 Q 16 2 22 7 Z" fill="#1e293b"/>
      <!-- Arm holding leash -->
      <path d="M 18 20 L 26 28" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
      <!-- Leash -->
      <path d="M 26 28 L 36 28" fill="none" stroke="#94a3b8" stroke-width="1"/>
    </g>
  </g>

  <!-- Decorative Foreground Nature Elements (Frame depth) -->
  <g fill="#059669" opacity="0.9">
    <circle cx="10" cy="230" r="15"/>
    <circle cx="0" cy="240" r="20"/>
  </g>
  <g fill="#34d399">
    <circle cx="6" cy="225" r="4"/>
    <circle cx="18" cy="235" r="5"/>
  </g>
</svg>