  <path d="M 82 86 C 82 72 90 65 100 65 C 110 65 118 72 118 86 C 118 95 112 102 108 108 C 105 112 104 116 104 118 H 96 C 96 116 95 112 92 108 C 88 102 82 95 82 86 Z" fill="#f59e0b"/>
  
