    <line x1="100" y1="35" x2="100" y2="20" />
    <line x1="100" y1="165" x2="100" y2="180" />
    <line x1="35" y1="100" x2="20" y2="100" />
    <line x1="165" y1="100" x2="180" y2="100" />
    <line x1="54" y1="54" x2="43" y2="43" />
    <line x1="146" y1="146" x2="157" y2="157" />
    <line x1="54" y1="146" x2="43" y2="157" />
    <line x1="146" y1="54" x2="157" y2="43" />
  </g>

  <!-- Glowing core / Spark (Tangible 'Happening' focal point) -->
  <circle cx="100" cy="100" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Lightbulb (Idea / Something interesting occurred) -->
  <!-- Bulb Base -->
  <path d="M 92 124 H 108 V 132 C 108 136 104 138 100 138 C 96 138 92 136 92 132 Z" fill="#94a3b8"/>
  <rect x="94" y="118" width="12" height="4" rx="1" fill="#64748b"/>
  
