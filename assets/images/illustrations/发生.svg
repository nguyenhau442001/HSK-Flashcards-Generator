<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded container background for dark-mode -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>
  
  <!-- Ambient background glow representing an event/occurrence -->
  <circle cx="100" cy="100" r="55" fill="#38bdf8" opacity="0.1"/>
  
  <!-- Surprise/Happening rays (Starburst) -->
