  <path d="M 90 82 C 90 76 94 72 100 71" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Action Sparks / Floating Elements (Joyful occurrence) -->
  <circle cx="68" cy="62" r="4" fill="#10b981"/>
  <circle cx="132" cy="62" r="3" fill="#38bdf8"/>
  <circle cx="140" cy="115" r="4" fill="#fb923c"/>
  <circle cx="60" cy="115" r="3" fill="#f59e0b"/>
