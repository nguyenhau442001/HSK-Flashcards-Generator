<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f283e"/>
    </linearGradient>

    <linearGradient id="scooterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="circleClip">
      <circle cx="120" cy="115" r="75"/>
    </clipPath>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Cityscape & Atmosphere -->
  <g opacity="0.4">
    <!-- Distant buildings -->
    <rect x="20" y="60" width="35" height="90" fill="#334155" rx="2"/>
    <rect x="65" y="40" width="45" height="110" fill="#1e293b" rx="2"/>
    <rect x="125" y="50" width="40" height="100" fill="#334155" rx="2"/>
    <rect x="180" y="70" width="35" height="80" fill="#1e293b" rx="2"/>
    
    <!-- Windows light dots -->
    <fill color="#fbbf24">
      <rect x="28" y="70" width="5" height="6" fill="#fbbf24" opacity="0.6"/>
      <rect x="38" y="70" width="5" height="6" fill="#fbbf24" opacity="0.3"/>
      <rect x="28" y="85" width="5" height="6" fill="#fbbf24" opacity="0.9"/>
      <rect x="75" y="55" width="6" height="8" fill="#fbbf24" opacity="0.8"/>
      <rect x="90" y="70" width="6" height="8" fill="#fbbf24" opacity="0.4"/>
      <rect x="135" y="65" width="6" height="8" fill="#fbbf24" opacity="0.7"/>
    </fill>
  </g>

  <!-- Circular Portal Frame for Main Action -->
  <circle cx="120" cy="115" r="77" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="120" cy="115" r="75" fill="#0b0f19"/>

  <!-- Scene Content inside portal -->
  <g clip-path="url(#circleClip)">
    <!-- Night Sky & Ambient Glow from Streetlights -->
    <circle cx="170" cy="80" r="40" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>
    <circle cx="70" cy="100" r="50" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>

    <!-- Street / Road curving perspective -->
    <path d="M 30,190 Q 120,130 210,190 L 240,210 L 0,210 Z" fill="url(#roadGrad)"/>
    
    <!-- Road dashed lines -->
    <path d="M 115,155 Q 120,145 130,150" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.8"/>
    <path d="M 95,168 Q 120,150 145,162" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.8"/>

    <!-- Motion Lines (representing fast arrival / "马上") -->
    <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="30" y1="120" x2="70" y2="120"/>
      <line x1="15" y1="135" x2="55" y2="135"/>
      <line x1="40" y1="150" x2="80" y2="150"/>
    </g>

    <!-- Electric Scooter & Character (Dynamic Rider coming right at you/arriving fast) -->
    <g transform="translate(10, 10)">
      <!-- Scooter Base & Wheels -->
      <ellipse cx="110" cy="165" rx="14" ry="14" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
      <ellipse cx="65" cy="155" rx="12" ry="12" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
      
      <!-- Scooter Body -->
      <path d="M 65,155 L 95,145 L 110,165 Z" fill="#64748b"/>
      <path d="M 95,145 L 105,100 L 85,95 Z" fill="url(#scooterGrad)"/>
      
      <!-- Handlebars -->
      <path d="M 85,95 L 80,85" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

      <!-- Character Body (Leaning forward for speed) -->
      <!-- Torso -->
      <path d="M 85,110 C 90,95 105,90 115,100 L 110,130 C 95,130 85,120 85,110 Z" fill="#38bdf8"/>
      <!-- Jacket details -->
      <path d="M 90,105 L 105,115" stroke="#0284c7" stroke-width="2"/>

      <!-- Arms holding handlebars -->
      <path d="M 95,105 L 82,90" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Head with Helmet -->
      <circle cx="100" cy="82" r="14" fill="#fb923c"/>
      <!-- Helmet -->
      <path d="M 86,82 A 14 14 0 0 1 114,82 Z" fill="url(#helmetGrad)"/>
      <path d="M 92,85 C 95,92 105,92 108,85" fill="#1e293b"/> <!-- Visor opening / face hint -->

      <!-- Speed lines behind rider -->
      <path d="M 50,110 L 70,110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <path d="M 45,125 L 65,125" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M 55,140 L 75,140" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Destination Context: Building Entrance / Warm Waiting Light on the right -->
    <g transform="translate(165, 90)">
      <!-- Building Column / Wall -->
      <rect x="0" y="0" width="40" height="90" fill="#334155"/>
      <!-- Warm glowing doorway / lantern -->
      <rect x="10" y="25" width="20" height="50" rx="4" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
      <rect x="13" y="28" width="14" height="44" rx="2" fill="#fffbeb"/>
      
      <!-- Waiting person indicator (silhouette waving) -->
      <circle cx="20" cy="40" r="4" fill="#b45309"/>
      <path d="M 16,55 Q 20,45 24,55" fill="#b45309"/>
      <path d="M 24,42 L 30,35" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- UI Overlay Element: Floating Phone Notification showing "Arrival / Incoming" concept visually -->
  <g transform="translate(150, 20)" filter="url(#glow)">
    <rect x="0" y="0" width="60" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Mini screen content -->
    <rect x="6" y="6" width="48" height="24" rx="4" fill="url(#screenGrad)"/>
    <!-- Map pin icon abstract graphic inside phone -->
    <path d="M 30,12 C 27,12 25,14 25,17 C 25,20 30,24 30,24 C 30,24 35,20 35,17 C 35,14 33,12 30,12 Z" fill="#ffffff"/>
    <circle cx="30" cy="16" r="1.5" fill="#16a34a"/>
  </g>

  <!-- Decorative Border / Frame Accent -->
  <rect x="8" y="8" width="224" height="224" rx="18" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
</svg>