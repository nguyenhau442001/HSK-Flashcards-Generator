<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="paper-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Wall Decor / Ambient light -->
  <circle cx="120" cy="90" r="70" fill="#38bdf8" opacity="0.06" filter="url(#glow)"/>
  
  <!-- Window / Bookshelf hinting at study room background -->
  <path d="M40 30 L80 30 L80 130 L40 130 Z" fill="#334155" opacity="0.2"/>
  <rect x="48" y="42" width="24" height="6" rx="2" fill="#64748b" opacity="0.4"/>
  <rect x="48" y="54" width="20" height="6" rx="2" fill="#64748b" opacity="0.4"/>
  <rect x="48" y="75" width="22" height="6" rx="2" fill="#64748b" opacity="0.4"/>

  <!-- Desk Surface -->
  <path d="M20 180 L220 180 L230 220 L10 220 Z" fill="url(#desk-grad)"/>
  <ellipse cx="120" cy="180" rx="100" ry="8" fill="#475569" opacity="0.5"/>

  <!-- Character (Young student/person looking proudly at grades) -->
  <!-- Body/Torso -->
  <path d="M95 190 C95 160 100 145 120 145 C140 145 145 160 145 190 Z" fill="#38bdf8"/>
  <!-- Collar / Shirt details -->
  <path d="M110 145 L120 160 L130 145 Z" fill="#f8fafc"/>
  
  <!-- Head & Neck -->
  <rect x="113" y="125" width="14" height="25" fill="#fbcfe8"/>
  <circle cx="120" cy="115" r="22" fill="#fbcfe8"/>
  
  <!-- Hair -->
  <path d="M98 115 C98 95 110 93 120 93 C135 93 142 102 143 118 C140 112 135 105 120 105 C108 105 101 110 98 115 Z" fill="#334155"/>

  <!-- Happy Face -->
  <!-- Eyes (closed happy arches) -->
  <path d="M111 114 Q115 110 119 114" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M121 114 Q125 110 129 114" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M114 121 Q120 127 126 121" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy cheeks -->
  <circle cx="109" cy="120" r="3" fill="#fb7185" opacity="0.6"/>
  <circle cx="131" cy="120" r="3" fill="#fb7185" opacity="0.6"/>

  <!-- Arms holding the report card / exam paper -->
  <!-- Left arm -->
  <path d="M100 160 C90 170 85 185 85 195" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Right arm -->
  <path d="M140 160 C150 170 155 185 155 195" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Exam Paper / Report Card (Centerpiece showcasing "good results") -->
  <g transform="translate(90, 110) rotate(-6)">
    <!-- Paper shadow -->
    <rect x="2" y="2" width="60" height="75" rx="4" fill="#0f172a" opacity="0.3"/>
    <!-- Paper base -->
    <rect width="60" height="75" rx="4" fill="url(#paper-glow)"/>
    
    <!-- Header line -->
    <rect x="10" y="10" width="24" height="4" rx="2" fill="#cbd5e1"/>
    
    <!-- Content score bars (showing high grades) -->
    <rect x="10" y="22" width="40" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="10" y="22" width="34" height="6" rx="3" fill="#10b981"/>

    <rect x="10" y="34" width="40" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="10" y="34" width="36" height="6" rx="3" fill="#10b981"/>

    <rect x="10" y="46" width="40" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="10" y="46" width="38" height="6" rx="3" fill="#10b981"/>

    <!-- Big Star Stamp / Grade mark indicating "Good/Excellent" -->
    <circle cx="42" cy="62" r="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M42 55 L43.8 58.6 L47.8 59.2 L44.9 62 L45.6 66 L42 64.1 L38.4 66 L39.1 62 L36.2 59.2 L40.2 58.6 Z" fill="url(#gold-grad)"/>
  </g>

  <!-- Desk Props (Pencil holder, small lamp) -->
  <!-- Pencil Holder -->
  <rect x="180" y="155" width="22" height="30" rx="3" fill="#475569"/>
  <rect x="178" y="150" width="26" height="6" rx="2" fill="#64748b"/>
  <!-- Pencils sticking out -->
  <path d="M187 150 L183 130" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M195 150 L200 132" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <path d="M191 150 L191 125" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating celebratory sparkles / stars (representing positive result/feeling) -->
  <g fill="#fbbf24" filter="url(#glow)">
    <path d="M70 70 L73 78 L81 81 L73 84 L70 92 L67 84 L59 81 L67 78 Z" transform="scale(0.6) translate(50, 30)"/>
    <path d="M70 70 L73 78 L81 81 L73 84 L70 92 L67 84 L59 81 L67 78 Z" transform="scale(0.4) translate(280, 80)"/>
    <circle cx="165" cy="95" r="3" fill="#38bdf8"/>
    <circle cx="75" cy="115" r="2.5" fill="#10b981"/>
  </g>

</svg>