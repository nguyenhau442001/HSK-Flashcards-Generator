<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk/Environment -->
  <rect x="40" y="160" width="160" height="10" fill="#334155" rx="2"/>
  <rect x="50" y="170" width="10" height="70" fill="#475569"/>
  <rect x="180" y="170" width="10" height="70" fill="#475569"/>
  
  <!-- Character -->
  <g transform="translate(120, 140)">
    <!-- Body -->
    <path d="M-40 80 Q-40 20 0 20 T40 80" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="35" fill="#fde68a"/>
    <!-- Eyes (Squinting in pain) -->
    <path d="M-15 -5 L-5 -15 M5 -15 L15 -5" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Mouth (Open in shout) -->
    <ellipse cx="0" cy="15" rx="10" ry="12" fill="#9f1239"/>
    <!-- Hand holding cheek -->
    <path d="M20 0 L45 -10 L50 10 L25 20 Z" fill="#fde68a"/>
    <path d="M35 5 L45 5" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Pain indicators -->
  <path d="M160 110 L175 95 M170 120 L185 105" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="180" cy="90" r="4" fill="#fb923c"/>
  
  <!-- Desk Props -->
  <rect x="60" y="145" width="30" height="15" fill="#ec4899" rx="4"/>
  <circle cx="75" cy="135" r="5" fill="#10b981"/>
  
  <!-- Sound waves -->
  <path d="M160 80 Q170 70 180 80" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <path d="M165 70 Q180 55 195 70" stroke="#fbbf24" stroke-width="2" fill="none"/>
</svg>