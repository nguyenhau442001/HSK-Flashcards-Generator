<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Warm Room Ambient Light -->
    <radialGradient id="roomGlow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- SCENE BACKDROP: A very large modern room interior -->
  <g id="room-interior">
    <!-- Back Wall -->
    <rect x="24" y="24" width="192" height="150" fill="#273548" rx="4" />
    
    <!-- Large Window showing distant city/sky -->
    <rect x="135" y="44" width="60" height="90" fill="#1e293b" rx="2" />
    <path d="M165 44V134 M135 74H195" stroke="#334155" stroke-width="1.5" />
    
    <!-- Wall Painting (adds to sense of vast wall space) -->
    <rect x="45" y="55" width="45" height="35" fill="#3b82f6" opacity="0.3" rx="2" />
    <circle cx="67" cy="72" r="10" fill="#60a5fa" opacity="0.4" />
    <path d="M50 85L60 75L72 83L80 77L90 85" stroke="#93c5fd" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

    <!-- Floor with perspective grid lines indicating large area -->
    <path d="M12 174L228 174L216 216H24Z" fill="url(#floorGrad)" />
    <!-- Floor planks / perspective lines -->
    <line x1="120" y1="174" x2="120" y2="216" stroke="#1e293b" stroke-width="1.5" />
    <line x1="120" y1="174" x2="40" y2="216" stroke="#1e293b" stroke-width="1.5" />
    <line x1="120" y1="174" x2="200" y2="216" stroke="#1e293b" stroke-width="1.5" />

    <!-- Ambient Room Glow -->
    <rect x="24" y="24" width="192" height="192" fill="url(#roomGlow)" pointer-events="none" />
  </g>

  <!-- PROPS (Emphasizing vast open space/large area) -->
  <g id="props">
    <!-- Small minimalist plant in corner to contrast scale -->
    <rect x="35" y="150" width="12" height="16" fill="#f43f5e" rx="3" />
    <circle cx="41" cy="146" r="10" fill="#10b981" />
    <circle cx="36" cy="143" r="6" fill="#34d399" />
    <circle cx="45" cy="142" r="7" fill="#059669" />

    <!-- Modern Couch far off to the side -->
    <rect x="175" y="135" width="35" height="20" fill="#6366f1" rx="4" />
    <rect x="177" y="130" width="31" height="8" fill="#818cf8" rx="2" />

    <!-- Stylish Modern Floor Lamp casting light -->
    <path d="M195 155L195 80" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <path d="M187 80H203L208 90H182Z" fill="#fbbf24" />
  </g>

  <!-- MAIN CHARACTER & INTERACTION -->
  <g id="character-and-action">
    <!-- Character celebrating/amazed by the large area -->
    <!-- Shadow -->
    <ellipse cx="95" cy="180" rx="18" ry="6" fill="#0b0f19" opacity="0.6" />

    <!-- Character Body (Excited pose, arms outstretched) -->
    <!-- Legs -->
    <path d="M88 150L83 178M102 150L107 178" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <!-- Shoes -->
    <ellipse cx="80" cy="179" rx="5" ry="3" fill="#cbd5e1" />
    <ellipse cx="109" cy="179" rx="5" ry="3" fill="#cbd5e1" />

    <!-- Torso -->
    <path d="M88 120H102V152H88Z" fill="#ec4899" rx="4" />

    <!-- Arms spread wide to measure/express vastness -->
    <!-- Left Arm -->
    <path d="M88 125L62 115" stroke="#f472b6" stroke-width="5" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M102 125L128 115" stroke="#f472b6" stroke-width="5" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="59" cy="114" r="3" fill="#fbcfe8" />
    <circle cx="131" cy="114" r="3" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="95" cy="100" r="14" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M82 98C82 90 90 84 95 84C100 84 108 90 108 98C108 102 105 98 102 94C99 90 91 90 88 94C85 98 82 98 82 98Z" fill="#1e293b" />
    <!-- Happy Face Expression -->
    <path d="M91 103Q95 107 99 103" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="91" cy="98" r="1.5" fill="#1e293b" />
    <circle cx="99" cy="98" r="1.5" fill="#1e293b" />
    <!-- Cheeks -->
    <circle cx="89" cy="101" r="2" fill="#f43f5e" opacity="0.4" />
    <circle cx="101" cy="101" r="2" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- VISUAL INDICATORS OF AREA/DIMENSIONS (Subtle, non-textual graphic design) -->
  <g id="dimension-indicators" opacity="0.7">
    <!-- Width measurement arc/lines near floor -->
    <path d="M50 195L50 205 M140 195L140 205 M50 200L140 200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <polygon points="50,200 55,197 55,203" fill="#38bdf8" />
    <polygon points="140,200 135,197 135,203" fill="#38bdf8" />
    
    <!-- Sparkles of delight indicating open space -->
    <path d="M70 65L73 72L80 75L73 78L70 85L67 78L60 75L67 72Z" fill="#fbbf24" opacity="0.8" />
    <path d="M115 50L117 55L122 57L117 59L115 64L113 59L108 57L113 55Z" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>