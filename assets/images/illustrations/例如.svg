<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Bowl Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    
    <linearGradient id="bowlInside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Apple Gradient (Red) -->
    <linearGradient id="appleGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Banana Gradient (Yellow) -->
    <linearGradient id="bananaGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Orange Gradient -->
    <linearGradient id="orangeGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Glow/Lighting Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Background Glow (Warm culinary atmosphere) -->
  <circle cx="120" cy="110" r="70" fill="#fbbf24" opacity="0.08" filter="url(#glow)"/>

  <!-- Background Kitchen Wall / Shelf Line -->
  <path d="M 30 140 L 210 140" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <rect x="40" y="80" width="20" height="60" rx="4" fill="#334155" opacity="0.2"/>
  <rect x="180" y="90" width="25" height="50" rx="4" fill="#334155" opacity="0.2"/>

  <!-- Wooden/Modern Table Surface -->
  <path d="M 12 170 C 12 165, 20 165, 30 165 L 210 165 C 220 165, 228 165, 228 170 L 235 220 C 235 228, 228 234, 220 234 L 20 234 C 12 234, 5 228, 5 220 Z" fill="url(#tableGrad)" filter="url(#softShadow)"/>
  
  <!-- Table Top Highlight line -->
  <path d="M 15 170 L 225 170" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- MAIN SCENE: Fruit Bowl Containing Fruit (Representing "For example: such as apples and bananas") -->
  <!-- Bowl Drop Shadow -->
  <ellipse cx="120" cy="195" rx="55" ry="12" fill="#020617" opacity="0.5"/>

  <!-- Bowl Back Rim / Inside -->
  <ellipse cx="120" cy="170" rx="60" ry="18" fill="url(#bowlInside)"/>

  <!-- Bananas (peeking out from back/side) -->
  <g transform="translate(85, 145) rotate(-15)">
    <!-- Banana Bunch -->
    <path d="M 10 35 C 20 20, 45 15, 65 25 C 50 35, 30 35, 10 35 Z" fill="url(#bananaGrad)" stroke="#ca8a04" stroke-width="1.5"/>
    <path d="M 8 45 C 20 30, 45 25, 68 35 C 50 48, 25 48, 8 45 Z" fill="url(#bananaGrad)" stroke="#ca8a04" stroke-width="1.5"/>
    <path d="M 12 55 C 22 42, 45 38, 62 48 C 45 58, 25 58, 12 55 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Stem tip -->
    <path d="M 5 38 C 2 37, 1 35, 2 33 C 3 32, 6 34, 8 36 Z" fill="#713f12"/>
  </g>

  <!-- Orange (middle layer) -->
  <g transform="translate(135, 155)">
    <circle cx="0" cy="0" r="18" fill="url(#orangeGrad)" stroke="#9a3412" stroke-width="1.5"/>
    <!-- Citrus texture dots -->
    <circle cx="-5" cy="-5" r="1.5" fill="#ea580c" opacity="0.6"/>
    <circle cx="6" cy="4" r="1.5" fill="#ea580c" opacity="0.6"/>
    <circle cx="-2" cy="7" r="1" fill="#ea580c" opacity="0.6"/>
    <path d="M -2 -18 C 0 -21, 2 -21, 3 -18" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Main Apple (Foreground Hero Fruit) -->
  <g transform="translate(100, 165)" filter="url(#softShadow)">
    <!-- Apple Body -->
    <circle cx="0" cy="5" r="24" fill="url(#appleGrad)" stroke="#881337" stroke-width="1.5"/>
    <!-- Apple Highlight -->
    <ellipse cx="-8" cy="-3" rx="6" ry="9" fill="#fda4af" opacity="0.5" transform="rotate(-20 -8 -3)"/>
    <!-- Stem and Leaf -->
    <path d="M 0 -19 C 2 -26, 8 -27, 10 -23" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <path d="M 4 -22 C 12 -28, 18 -22, 14 -16 C 10 -15, 6 -18, 4 -22 Z" fill="#10b981" stroke="#047857" stroke-width="1"/>
  </g>

  <!-- Secondary Apple (Green/Yellow contrast) -->
  <g transform="translate(150, 172)">
    <circle cx="0" cy="3" r="20" fill="#84cc16" stroke="#4d7c0f" stroke-width="1.5"/>
    <ellipse cx="-6" cy="-2" rx="4" ry="7" fill="#ecfccb" opacity="0.6" transform="rotate(-15 -6 -2)"/>
    <path d="M 0 -16 C 1 -21, 5 -22, 7 -19" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 3 -19 C 9 -23, 14 -18, 11 -13 Z" fill="#22c55e" stroke="#15803d" stroke-width="1"/>
  </g>

  <!-- Front Bowl Body -->
  <path d="M 60 170 C 60 210, 180 210, 180 170 C 180 195, 60 195, 60 170 Z" fill="url(#bowlGrad)" stroke="#94a3b8" stroke-width="1.5" filter="url(#softShadow)"/>
  <ellipse cx="120" cy="170" rx="60" ry="16" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Bowl Shading Overlay -->
  <path d="M 62 173 C 75 200, 165 200, 178 173 C 160 195, 80 195, 62 173 Z" fill="#e2e8f0" opacity="0.3"/>

  <!-- Dynamic Floating Elements / Scene Accents (Representing variety and categorization) -->
  <!-- Floating Sparkles / Action Highlights -->
  <g fill="#38bdf8">
    <circle cx="45" cy="115" r="3" opacity="0.8" filter="url(#glow)"/>
    <circle cx="195" cy="125" r="2" opacity="0.6"/>
    <circle cx="175" cy="85" r="3.5" opacity="0.9" filter="url(#glow)"/>
  </g>

  <g fill="#fbbf24">
    <!-- Star accent 1 -->
    <path d="M 65 85 Q 65 92, 58 92 Q 65 92, 65 99 Q 65 92, 72 92 Q 65 92, 65 85 Z" opacity="0.8"/>
    <!-- Star accent 2 -->
    <path d="M 160 55 Q 160 61, 154 61 Q 160 61, 160 67 Q 160 61, 166 61 Q 160 61, 160 55 Z" opacity="0.9"/>
  </g>

  <!-- Small floating selection/example indicators (Abstract decorative markers, NO text) -->
  <g transform="translate(35, 150)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#38bdf8" opacity="0.2"/>
    <path d="M 4 8 L 7 11 L 12 5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(190, 155)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#10b981" opacity="0.2"/>
    <path d="M 4 8 L 7 11 L 12 5" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>