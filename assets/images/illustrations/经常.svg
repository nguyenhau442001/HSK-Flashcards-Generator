<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </radialGradient>

    <!-- Shelf Wood Gradient -->
    <linearGradient id="woodShelf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Library Interior Backdrop -->
  <!-- Back wall -->
  <rect x="20" y="25" width="200" height="185" fill="#1e293b" />

  <!-- Tall Arch Window showing evening/ambient blue -->
  <path d="M 175 45 L 175 110 A 15 15 0 0 1 145 110 L 145 45 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <line x1="160" y1="45" x2="160" y2="125" stroke="#334155" stroke-width="1.5" />
  <line x1="145" y1="85" x2="175" y2="85" stroke="#334155" stroke-width="1.5" />

  <!-- Light Beam from Window -->
  <polygon points="160,45 125,210 215,210" fill="url(#lightBeam)" />

  <!-- Bookshelves Background Left -->
  <rect x="30" y="45" width="45" height="150" fill="#111827" rx="2" />
  <line x1="30" y1="75" x2="75" y2="75" stroke="#334155" stroke-width="2" />
  <line x1="30" y1="115" x2="75" y2="115" stroke="#334155" stroke-width="2" />
  <line x1="30" y1="155" x2="75" y2="155" stroke="#334155" stroke-width="2" />
  
  <!-- Colorful Books on Background Shelf -->
  <rect x="36" y="55" width="6" height="20" fill="#ef4444" rx="1" />
  <rect x="44" y="53" width="8" height="22" fill="#3b82f6" rx="1" />
  <rect x="54" y="57" width="5" height="18" fill="#10b981" rx="1" />
  <rect x="62" y="54" width="7" height="21" fill="#f59e0b" rx="1" />

  <rect x="35" y="90" width="8" height="25" fill="#ec4899" rx="1" />
  <rect x="45" y="93" width="6" height="22" fill="#8b5cf6" rx="1" />
  <rect x="53" y="95" width="12" height="20" fill="#06b6d4" rx="1" />

  <rect x="36" y="130" width="7" height="25" fill="#f97316" rx="1" />
  <rect x="45" y="132" width="10" height="23" fill="#14b8a6" rx="1" />
  <rect x="57" y="128" width="6" height="27" fill="#6366f1" rx="1" />

  <!-- PROPS: Reading Desk & Lamp -->
  <!-- Table Surface -->
  <path d="M 65 160 L 210 160 L 225 210 L 50 210 Z" fill="#334155" />
  <!-- Table Edge Highlight -->
  <path d="M 63 157 L 212 157 L 210 160 L 65 160 Z" fill="#64748b" />
  <!-- Table Legs -->
  <rect x="75" y="210" width="8" height="20" fill="#1e293b" />
  <rect x="190" y="210" width="8" height="20" fill="#1e293b" />

  <!-- Study Desk Lamp -->
  <circle cx="195" cy="120" r="25" fill="url(#lampGlow)" />
  <path d="M 190 157 L 200 157 L 197 135 L 193 135 Z" fill="#94a3b8" />
  <path d="M 180 120 C 180 110, 190 105, 205 115 Z" fill="#f59e0b" />
  <ellipse cx="195" cy="122" rx="4" ry="2" fill="#fef08a" />

  <!-- Stack of Books on Desk -->
  <rect x="140" y="145" width="30" height="6" fill="#38bdf8" rx="1" />
  <rect x="138" y="151" width="34" height="6" fill="#f43f5e" rx="1" />
  <rect x="142" y="157" width="28" height="5" fill="#a855f7" rx="1" />

  <!-- Open Notebook on Desk -->
  <path d="M 90 170 Q 110 162 130 170 L 130 195 Q 110 187 90 195 Z" fill="#f8fafc" />
  <path d="M 110 166 L 110 191" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="95" y1="175" x2="105" y2="177" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  <line x1="95" y1="181" x2="105" y2="183" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  <line x1="115" y1="176" x2="125" y2="174" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  <line x1="115" y1="182" x2="125" y2="180" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />

  <!-- Coffee Mug -->
  <rect x="72" y="170" width="12" height="15" fill="#10b981" rx="2" />
  <path d="M 84 174 C 88 174, 88 181, 84 181" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <!-- Steam from Mug -->
  <path d="M 75 164 Q 77 160 75 156" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- SUBJECT: Male Character actively reading in the library -->
  <!-- Chair Back -->
  <path d="M 85 90 L 125 90 L 120 165 L 90 165 Z" fill="#475569" rx="4" />
  <path d="M 93 100 L 117 100 L 115 155 L 95 155 Z" fill="#334155" rx="2" />

  <!-- Character Body / Torso (Wearing a neat blue sweater and collar) -->
  <path d="M 85 110 C 85 100, 125 100, 125 110 L 132 155 L 78 155 Z" fill="#2563eb" />
  <!-- Shirt Collar -->
  <polygon points="105,107 100,118 105,115 110,118" fill="#f8fafc" />

  <!-- Character Head -->
  <circle cx="105" cy="83" r="16" fill="#fbcfe8" />
  <!-- Hair (Neat dark modern haircut) -->
  <path d="M 89 83 C 89 70, 100 66, 115 70 C 121 72, 122 80, 121 84 C 117 76, 110 73, 100 75 C 93 76, 90 80, 89 83 Z" fill="#0f172a" />
  <path d="M 118 75 C 122 78, 123 83, 121 86 C 120 83, 119 78, 118 75 Z" fill="#0f172a" />

  <!-- Face Details -->
  <!-- Glasses -->
  <rect x="96" y="78" width="9" height="6" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <rect x="106" y="78" width="9" height="6" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <line x1="105" y1="81" x2="106" y2="81" stroke="#0f172a" stroke-width="1.5" />
  <!-- Gentle focused expression / Smile -->
  <path d="M 102 91 Q 105 94 108 91" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

  <!-- Arms holding a book -->
  <!-- Right Arm & Hand -->
  <path d="M 125 120 C 135 125, 125 150, 112 152" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
  <circle cx="112" cy="152" r="5" fill="#fbcfe8" />

  <!-- Left Arm & Hand -->
  <path d="M 85 120 C 75 125, 85 150, 98 152" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round" />
  <circle cx="98" cy="152" r="5" fill="#fbcfe8" />

  <!-- Open Book Being Read by Character -->
  <path d="M 92 132 Q 105 122 118 132 L 120 156 Q 105 146 90 156 Z" fill="#ffffff" />
  <path d="M 105 127 L 105 151" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="95" y1="138" x2="101" y2="140" stroke="#64748b" stroke-width="1" />
  <line x1="95" y1="143" x2="102" y2="145" stroke="#64748b" stroke-width="1" />
  <line x1="109" y1="138" x2="115" y2="136" stroke="#64748b" stroke-width="1" />
  <line x1="109" y1="143" x2="116" y2="141" stroke="#64748b" stroke-width="1" />

  <!-- Ambient lighting highlights -->
  <circle cx="150" cy="110" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="40" cy="180" r="1.5" fill="#ffffff" opacity="0.3" />
  <circle cx="215" cy="80" r="1.5" fill="#ffffff" opacity="0.2" />
</svg>