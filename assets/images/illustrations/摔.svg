<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Floor/Environment -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  <circle cx="180" cy="200" r="40" fill="#334155" opacity="0.3"/>
  
  <!-- Character: The Person Falling -->
  <g transform="translate(120, 140)">
    <!-- Legs -->
    <path d="M-20 30 L-35 50 M-10 30 L-5 55" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- Torso -->
    <path d="M-30 10 C-30 -10 -10 -20 0 -20 C10 -20 30 -10 30 10" fill="#38bdf8"/>
    <!-- Arms -->
    <path d="M-25 0 L-45 -20 M25 0 L45 -20" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-35" r="15" fill="#fde68a"/>
    <!-- Eyes (Surprised) -->
    <ellipse cx="-5" cy="-38" rx="2" ry="3" fill="#0f172a"/>
    <ellipse cx="5" cy="-38" rx="2" ry="3" fill="#0f172a"/>
    <!-- Mouth (Surprised) -->
    <circle cx="0" cy="-30" r="3" fill="#0f172a"/>
  </g>

  <!-- Context Props: Slippery banana peel -->
  <path d="M80 190 C70 190 60 200 70 210 C80 220 90 210 85 200" fill="#fbbf24"/>
  
  <!-- Motion Lines -->
  <path d="M160 120 Q180 110 200 130" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M170 140 Q190 130 210 150" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  
  <!-- Decorative Background Elements -->
  <circle cx="40" cy="50" r="3" fill="#10b981"/>
  <circle cx="200" cy="40" r="2" fill="#ec4899"/>
  <rect x="20" y="190" width="10" height="2" rx="1" fill="#334155"/>
</svg>