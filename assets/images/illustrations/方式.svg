<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Golden Highlight Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Mechanism Metallic Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow elements -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />
  <circle cx="160" cy="80" r="40" fill="#fbbf24" opacity="0.08" filter="url(#glow)" />

  <!-- Architectural Workshop / Desk Surface -->
  <path d="M 20 185 L 220 185 L 235 220 L 5 220 Z" fill="url(#tableGrad)" opacity="0.9" />
  <line x1="20" y1="185" x2="220" y2="185" stroke="#475569" stroke-width="2" />

  <!-- SCENE OBJECT: Multi-path Interactive Puzzle / Mechanism (Representing 'Phượng thức / Cách thức') -->
  <g transform="translate(0, -5)" filter="url(#shadow)">
    
    <!-- Base Platform of the Mechanism -->
    <rect x="50" y="110" width="140" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <rect x="58" y="118" width="124" height="59" rx="8" fill="#1e293b" />

    <!-- Route 1: Gears and Cogs (Mechanical Approach) -->
    <g transform="translate(75, 135)">
      <!-- Outer track -->
      <circle cx="0" cy="0" r="20" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6,4" />
      <!-- Central Gear -->
      <circle cx="0" cy="0" r="12" fill="url(#metalGrad)" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" />
      <path d="M -3 -15 L 3 -15 L 3 -12 L -3 -12 Z" fill="#94a3b8" />
      <path d="M -3 12 L 3 12 L 3 15 L -3 15 Z" fill="#94a3b8" />
      <path d="M -15 -3 L -12 -3 L -12 3 L -15 3 Z" fill="#94a3b8" />
      <path d="M 12 -3 L 15 -3 L 15 3 L 12 3 Z" fill="#94a3b8" />
    </g>

    <!-- Route 2: Digital/Circuit Paths (Logical Approach) -->
    <g transform="translate(120, 135)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
      <path d="M -12 -12 L 0 -5 L 12 -12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -12 4 L 0 11 L 12 4" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="0" cy="3" r="5" fill="#38bdf8" filter="url(#glow)" />
    </g>

    <!-- Route 3: Creative / Golden Path (Optimal Method) -->
    <g transform="translate(165, 135)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4" />
      <path d="M 0 -12 L 4 -3 L 13 -3 L 6 3 L 9 12 L 0 7 L -9 12 L -6 3 L -13 -3 L -4 -3 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    </g>

    <!-- Connecting Dynamic Flow Lines -->
    <path d="M 95 135 C 102 120, 110 120, 120 135 C 130 150, 138 150, 165 135" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  </g>

  <!-- MAIN HOLOGRAM PROJECTOR / DISPLAY (Focal Point of Solution/Method) -->
  <g filter="url(#shadow)">
    <!-- Projector Base -->
    <path d="M 90 185 L 150 185 L 140 170 L 100 170 Z" fill="url(#metalGrad)" />
    <ellipse cx="120" cy="170" rx="20" ry="5" fill="#38bdf8" filter="url(#glow)" />

    <!-- Holographic Projection Cone -->
    <path d="M 120 168 L 60 70 L 180 70 Z" fill="url(#screenGrad)" opacity="0.15" />
    
    <!-- Central Holographic Target / Key Symbol (Abstract Method Blueprint) -->
    <g transform="translate(120, 75)">
      <!-- Outer Hexagon ring -->
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#1e293b" opacity="0.8" />

      <!-- Action-Packed Solution Icon inside Hologram: Compass + Light Ray (Guiding Method) -->
      <circle cx="0" cy="0" r="10" fill="url(#goldGrad)" />
      <path d="M 0 -16 L 3 -6 L 0 0 L -3 -6 Z" fill="#ffffff" />
      <path d="M 0 16 L 3 6 L 0 0 L -3 6 Z" fill="#94a3b8" />
      <circle cx="0" cy="0" r="3" fill="#0f172a" />
    </g>

    <!-- Floating Interface Nodes (Surrounding the Hologram) -->
    <!-- Node Left -->
    <g transform="translate(75, 95)" opacity="0.9">
      <rect x="-12" y="-12" width="24" height="24" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2" />
      <!-- Checkmark -->
      <path d="M -5 -1 L -1 3 L 6 -4" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Node Right -->
    <g transform="translate(165, 95)" opacity="0.9">
      <rect x="-12" y="-12" width="24" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <!-- Settings gear small -->
      <circle cx="0" cy="0" r="5" fill="none" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" />
    </g>

  </g>

  <!-- Atmospheric Foreground Props & Tools (Contextualizing the 'Way/Method' environment) -->
  <!-- Floating Blueprint Paper / Document -->
  <g transform="translate(45, 160) rotate(-12)" filter="url(#shadow)">
    <rect x="0" y="0" width="36" height="46" rx="4" fill="#f8fafc" />
    <line x1="6" y1="10" x2="26" y2="10" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="18" x2="30" y2="18" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="26" x2="20" y2="26" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Mini pointer -->
    <circle cx="26" cy="34" r="5" fill="#10b981" />
    <path d="M 24 34 L 25.5 35.5 L 28.5 32.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wrench / Tool (Indicates fixing / applying method) -->
  <g transform="translate(185, 155) rotate(45)" filter="url(#shadow)">
    <path d="M -4 -18 L 4 -18 L 6 -6 C 9 -4, 11 0, 9 4 L 4 18 L -4 18 L -9 4 C -11 0, -9 -4, -6 -6 Z" fill="url(#metalGrad)" />
    <circle cx="0" cy="-12" r="3" fill="#1e293b" />
  </g>

  <!-- Sparkles / Success Indicator Accents -->
  <g filter="url(#glow)">
    <path d="M 120 38 L 123 45 L 130 48 L 123 51 L 120 58 L 117 51 L 110 48 L 117 45 Z" fill="#fbbf24" />
    <path d="M 68 65 L 70 69 L 74 71 L 70 73 L 68 77 L 66 73 L 62 71 L 66 69 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M 172 65 L 174 69 L 178 71 L 174 73 L 172 77 L 170 73 L 166 71 L 170 69 Z" fill="#10b981" opacity="0.8" />
  </g>

</svg>