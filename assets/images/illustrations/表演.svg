<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Stage Spotlight Gradient -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Mask for Spotlight Cone -->
    <clipPath id="stage-clip">
      <rect x="10" y="10" width="180" height="180" rx="24"/>
    </clipPath>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="url(#bg-grad)"/>

  <!-- Stage Lighting Cone (Performance/Biểu diễn Theme) -->
  <g clip-path="url(#stage-clip)">
    <polygon points="100,25 35,175 165,175" fill="url(#spotlight)"/>
  </g>

  <!-- Ambient Glow Behind Central Icon -->
  <circle cx="100" cy="115" r="35" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>

  <!-- Stylized Drama Masks / Performance Symbol (Abstract 2D Geometric) -->
  <!-- Left Mask (Joyful / Comedy - Coral/Amber Accent) -->
  <path d="M 75 95 
           C 75 80, 85 72, 100 72 
           C 85 72, 75 80, 75 95 Z" 
        fill="#fb923c" opacity="0.4"/>
  
  <g transform="translate(-12, 0)">
    <!-- Base Mask Shape -->
    <path d="M 85,85 
             C 70,85 62,97 62,112 
             C 62,132 72,145 88,145 
             C 98,145 104,138 108,128 
             C 112,138 118,145 128,145 
             C 144,145 154,132 154,112 
             C 154,97 146,85 131,85 
             C 120,85 110,92 108,98 
             C 106,92 96,85 85,85 Z" 
          fill="#0f172a" 
          stroke="#fb923c" 
          stroke-width="4" 
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Left Eye (Creative Expression) -->
    <path d="M 78,105 Q 85,98 92,105" fill="none" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Right Eye -->
    <path d="M 124,105 Q 131,98 138,105" fill="none" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Expressive Smile / Performance Curve -->
    <path d="M 94,122 Q 108,135 122,122" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Sparkles / Action Elements (Showmanship) -->
  <!-- Top Right Sparkle -->
  <path d="M 138,65 Q 145,65 145,58 Q 145,65 152,65 Q 145,65 145,72 Q 145,65 138,65 Z" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- Top Left Small Sparkle -->
  <path d="M 55,80 Q 60,80 60,75 Q 60,80 65,80 Q 60,80 60,85 Q 60,80 55,80 Z" fill="#f59e0b" opacity="0.8"/>

  <!-- Stage Floor Line -->
  <line x1="45" y1="165" x2="155" y2="165" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Dynamic Star / Spotlight Accent at Top -->
  <circle cx="100" cy="28" r="4" fill="#38bdf8" filter="url(#glow)"/>
</svg>