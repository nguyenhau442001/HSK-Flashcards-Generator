<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Podium Wood Gradient -->
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Golden Scroll / Decree Gradient -->
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Spotlight/Glow Effect -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Gold Glow for Command/Decree -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Classroom / Official Backdrop Elements -->
  <g opacity="0.3">
    <!-- Chalkboard top rail -->
    <rect x="30" y="30" width="180" height="4" rx="2" fill="#64748b"/>
    <!-- Decorative Map / Banner hanging in background -->
    <path d="M90 34 L150 34 L150 85 L120 95 L90 85 Z" fill="#334155"/>
    <path d="M105 45 L135 45 L135 70 L105 70 Z" fill="#475569" opacity="0.5"/>
  </g>

  <!-- Ambient Golden Magic Aura representing "The Command / Decree" -->
  <circle cx="120" cy="115" r="75" fill="url(#goldGlow)" filter="url(#glow)" />

  <!-- Podium / Desk -->
  <g filter="url(#shadow)">
    <!-- Podium base front -->
    <path d="M70 170 L170 170 L160 215 L80 215 Z" fill="url(#podiumGrad)"/>
    <!-- Podium top surface -->
    <ellipse cx="120" cy="170" rx="50" ry="12" fill="#64748b"/>
  </g>

  <!-- Teacher Character (Torso, Shoulders, Head) -->
  <g filter="url(#shadow)">
    <!-- Teacher Suit/Body behind podium -->
    <path d="M85 180 C85 145 155 145 155 180 Z" fill="#1e293b"/>
    <!-- Suit Lapels -->
    <path d="M105 155 L120 175 L135 155 L145 180 L95 180 Z" fill="#0f172a"/>
    <!-- Crisp Shirt Collar -->
    <polygon points="105,155 120,168 135,155 125,150" fill="#f8fafc"/>
    <!-- Red Tie -->
    <polygon points="117,157 123,157 125,178 120,183 115,178" fill="#ef4444"/>

    <!-- Neck -->
    <rect x="112" y="132" width="16" height="24" rx="6" fill="#fbcfe8" />

    <!-- Head & Face -->
    <ellipse cx="120" cy="118" rx="22" ry="25" fill="#fbcfe8"/>

    <!-- Hair (Authoritative Teacher Style) -->
    <path d="M98 115 C98 96 142 96 142 115 C142 120 145 115 148 110 C145 92 95 92 92 110 C95 115 98 120 98 115 Z" fill="#334155"/>
    
    <!-- Glasses -->
    <rect x="104" y="108" width="13" height="10" rx="3" fill="none" stroke="#334155" stroke-width="2.5"/>
    <rect x="123" y="108" width="13" height="10" rx="3" fill="none" stroke="#334155" stroke-width="2.5"/>
    <line x1="117" y1="112" x2="123" y2="112" stroke="#334155" stroke-width="2"/>

    <!-- Serious, Confident Expression (Mouth open giving command) -->
    <path d="M115 130 Q120 137 125 130 Z" fill="#991b1b"/>

    <!-- Raised Authoritative Arm & Hand pointing forward/up -->
    <!-- Upper arm -->
    <path d="M142 155 C160 140 170 120 175 110" fill="none" stroke="#fbcfe8" stroke-width="14" stroke-linecap="round"/>
    <!-- Forearm and Pointing Hand -->
    <path d="M175 110 L195 90" fill="none" stroke="#fbcfe8" stroke-width="12" stroke-linecap="round"/>
    <!-- Sleeve Cuff -->
    <path d="M168 118 L182 104" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
    <!-- Pointing Index Finger -->
    <circle cx="198" cy="87" r="5" fill="#fbcfe8"/>
  </g>

  <!-- THE CENTRAL COMMAND / DECREE SCROLL (The Physical Object representing "Lệnh") -->
  <g filter="url(#shadow)" transform="translate(0, -5)">
    <!-- Floating magical scroll glowing with authority -->
    <g transform="translate(120, 95) rotate(-12)">
      <!-- Scroll Back / Roll Ends -->
      <ellipse cx="-45" cy="0" rx="6" ry="18" fill="#b45309"/>
      <ellipse cx="45" cy="0" rx="6" ry="18" fill="#b45309"/>
      
      <!-- Scroll Body (Parchment) -->
      <rect x="-45" y="-16" width="90" height="32" rx="3" fill="url(#scrollGrad)" stroke="#d97706" stroke-width="1.5"/>

      <!-- Decorative Official Seal / Stamp on the Scroll (Red Wax Stamp) -->
      <circle cx="0" cy="0" r="10" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
      <!-- Star/Emblem inside stamp -->
      <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,3 -4,5 -3,1 -6,-2 -2,-2" fill="#fef08a"/>

      <!-- Command Lines (Abstract authoritative text lines - strictly non-text glyphs/lines) -->
      <line x1="-32" y1="-7" x2="-15" y2="-7" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-32" y1="0" x2="-15" y2="0" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-32" y1="7" x2="-15" y2="7" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>

      <line x1="15" y1="-7" x2="32" y2="-7" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="15" y1="0" x2="32" y2="0" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="15" y1="7" x2="32" y2="7" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Dynamic Soundwaves / Command Energy Waves -->
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M195 70 C205 75 210 85 210 100 C210 115 205 125 195 130" />
    <path d="M205 60 C220 70 228 85 228 100 C228 115 220 130 205 140" opacity="0.5"/>
  </g>

  <!-- Sparkles / Action Particles for Impact -->
  <g fill="#fbbf24">
    <circle cx="170" cy="70" r="3" />
    <circle cx="185" cy="55" r="2" />
    <circle cx="150" cy="65" r="2.5" />
    <path d="M 195 45 L 198 52 L 205 55 L 198 58 L 195 65 L 192 58 L 185 55 L 192 52 Z" transform="scale(0.5) translate(190, 70)" />
  </g>
  
  <g fill="#38bdf8">
    <circle cx="70" cy="130" r="2" />
    <circle cx="60" cy="100" r="3" />
    <circle cx="85" cy="80" r="2" />
  </g>
</svg>