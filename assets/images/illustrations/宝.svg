    <path d="M140 80h5m15 0h5m-15 10h15" stroke="#1e293b" stroke-width="2" fill="none"/>
    
    <!-- Child (The Treasure) -->
    <circle cx="115" cy="70" r="25" fill="#fde68a"/>
    <path d="M105 65h5m15 0h5m-15 10h15" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M100 95c10 10 20 10 30 0" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Arms embracing -->
