<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Architecture -->
  <path d="M40 180 L200 180 L200 80 L120 60 L40 80 Z" fill="#334155"/>
  <rect x="60" y="90" width="40" height="50" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="140" y="90" width="40" height="50" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- The "Government" Figure -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-40" r="12" fill="#fbbf24"/>
    <path d="M-15 -30 L15 -30 L10 10 L-10 10 Z" fill="#fb923c"/>
    <path d="M-20 10 L-25 40 M20 10 L25 40" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Educational Elements (The Action) -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="30" height="20" fill="#10b981" rx="2"/>
    <path d="M5 5 L25 5 M5 10 L25 10 M5 15 L20 15" stroke="#fff" stroke-width="2"/>
  </g>
  
  <g transform="translate(150, 160)">
    <rect x="0" y="0" width="30" height="20" fill="#ec4899" rx="2"/>
    <path d="M5 5 L25 5 M5 10 L25 10 M5 15 L20 15" stroke="#fff" stroke-width="2"/>
  </g>
  
  <!-- Growth/Action Visuals -->
  <path d="M120 130 Q120 100 140 80" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 6"/>
  <path d="M120 130 Q120 100 100 80" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 6"/>
  
  <!-- Ground -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <path d="M0 200 L240 200" stroke="#334155" stroke-width="2"/>
</svg>