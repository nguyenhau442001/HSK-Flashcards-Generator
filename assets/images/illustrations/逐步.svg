<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Staircase structure representing gradual progress -->
  <g transform="translate(40, 60)">
    <!-- Step 1 -->
    <path d="M0 140 L60 140 L60 160 L0 160 Z" fill="#334155"/>
    <path d="M0 140 L60 140 L60 145 L0 145 Z" fill="#475569"/>
    
    <!-- Step 2 -->
    <path d="M60 110 L120 110 L120 160 L60 160 Z" fill="#334155"/>
    <path d="M60 110 L120 110 L120 115 L60 115 Z" fill="#475569"/>
    
    <!-- Step 3 -->
    <path d="M120 80 L180 80 L180 160 L120 160 Z" fill="#334155"/>
    <path d="M120 80 L180 80 L180 85 L120 85 Z" fill="#475569"/>
  </g>

  <!-- Character climbing -->
  <g transform="translate(135, 65)">
    <circle cx="10" cy="10" r="10" fill="#f59e0b"/>
    <path d="M5 25 L15 25 L12 45 L8 45 Z" fill="#fbbf24"/>
    <path d="M2 30 L8 35" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M18 30 L12 35" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric elements -->
  <circle cx="200" cy="40" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="180" cy="30" r="2" fill="#10b981" opacity="0.4"/>
  <path d="M30 180 Q60 170 90 180 T150 180" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="4 4"/>
  
  <!-- Plant for context -->
  <path d="M20 220 C20 180 30 180 30 220" fill="#10b981"/>
  <path d="M25 200 L35 190 M25 200 L15 190" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
</svg>