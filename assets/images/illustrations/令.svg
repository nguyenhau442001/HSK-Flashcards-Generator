<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="8" fill="#334155"/>
  
  <!-- Laptop Screen -->
  <rect x="60" y="70" width="120" height="90" rx="6" fill="#cbd5e1"/>
  <rect x="65" y="75" width="110" height="80" rx="2" fill="#f8fafc"/>
  
  <!-- Chart on screen -->
  <path d="M75 140 L95 110 L115 130 L135 60 L155 90" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Character: Surprised Person -->
  <g transform="translate(120, 120)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="25" fill="#fde68a"/>
    <!-- Eyes (Wide/Surprised) -->
    <circle cx="-8" cy="-45" r="4" fill="#1e293b"/>
    <circle cx="8" cy="-45" r="4" fill="#1e293b"/>
    <!-- Mouth (Shocked) -->
    <ellipse cx="0" cy="-30" rx="6" ry="8" fill="#1e293b"/>
    <!-- Hair -->
    <path d="M-25 -50 C -25 -70, 25 -70, 25 -50 L 20 -40 L 0 -60 L -20 -40 Z" fill="#fb923c"/>
    <!-- Body -->
    <path d="M-30 0 C -30 -20, 30 -20, 30 0 L 20 50 L -20 50 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Decorative elements: Exclamation/Shock effect -->
  <circle cx="180" cy="60" r="8" fill="#fbbf24"/>
  <circle cx="195" cy="50" r="4" fill="#fbbf24"/>
  <path d="M180 52 L180 40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Coffee Mug -->
  <rect x="170" y="140" width="25" height="30" rx="4" fill="#10b981"/>
  <path d="M195 145 C 205 145, 205 155, 195 155" stroke="#10b981" stroke-width="4" fill="none"/>
</svg>