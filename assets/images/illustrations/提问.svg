<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Classroom Interior Details -->
  <!-- Window with soft light -->
  <rect x="185" y="40" width="35" height="50" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="190" y="45" width="25" height="40" rx="2" fill="#64748b" opacity="0.3"/>
  <path d="M 185 65 L 220 65" stroke="#1e293b" stroke-width="2"/>
  <path d="M 202 40 L 202 90" stroke="#1e293b" stroke-width="2"/>

  <!-- Light beam from window -->
  <polygon points="185,40 130,200 240,200 220,40" fill="url(#glowGrad)"/>

  <!-- Blackboard -->
  <rect x="25" y="30" width="135" height="65" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="33" width="129" height="59" rx="2" fill="url(#boardGrad)"/>
  <!-- Abstract Math/Science formulas on board -->
  <path d="M 38 50 Q 45 40 52 50 T 66 50" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="85" cy="48" r="6" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="42" x2="115" y2="58" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="115" y1="42" x2="100" y2="58" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 130 55 L 140 45 L 150 55" fill="none" stroke="#fde047" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Teacher (Right Side) -->
  <!-- Teacher Body & Torso -->
  <path d="M 160 145 C 155 130 165 115 175 110 L 195 110 C 205 115 215 130 210 145 L 215 195 L 155 195 Z" fill="#0284c7"/>
  <!-- Teacher Collar/Shirt -->
  <polygon points="175,110 185,125 195,110" fill="#f8fafc"/>
  
  <!-- Teacher Head & Hair -->
  <circle cx="185" cy="85" r="18" fill="#fbcfe8"/>
  <path d="M 167 85 C 167 70 203 70 203 85 C 203 80 195 72 185 72 C 175 72 167 80 167 85 Z" fill="#334155"/>
  <!-- Teacher Face expression: Warm, welcoming smile -->
  <circle cx="179" cy="83" r="1.5" fill="#1e293b"/>
  <circle cx="191" cy="83" r="1.5" fill="#1e293b"/>
  <path d="M 183 90 Q 185 93 187 90" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gentle Glasses -->
  <circle cx="179" cy="83" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="191" cy="83" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <line x1="182.5" y1="83" x2="187.5" y2="83" stroke="#94a3b8" stroke-width="1"/>

  <!-- Teacher Arm gesturing open to answer -->
  <path d="M 165 125 L 145 135 L 135 125" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="135" cy="125" r="5" fill="#fbcfe8"/>

  <!-- Teacher Desk -->
  <path d="M 130 160 L 225 160 L 235 195 L 120 195 Z" fill="url(#deskGrad)"/>
  <rect x="125" y="153" width="105" height="10" rx="3" fill="#d97706"/>
  <!-- Props on Teacher Desk: Books & Globe -->
  <rect x="140" y="142" width="20" height="12" rx="2" fill="#ef4444"/>
  <rect x="142" y="137" width="18" height="12" rx="2" fill="#3b82f6"/>
  <!-- Mini Globe -->
  <circle cx="185" cy="135" r="12" fill="#38bdf8"/>
  <path d="M 175 130 Q 185 125 195 130 Q 185 145 175 130" fill="#10b981"/>
  <path d="M 185 123 L 185 147" stroke="#78350f" stroke-width="2"/>
  <path d="M 180 147 L 190 147" stroke="#78350f" stroke-width="2"/>

  <!-- Student (Left Side - Actively Asking a Question) -->
  <!-- Student Body & Torso (leaning forward eagerly) -->
  <path d="M 75 140 C 70 125 85 110 95 115 L 115 125 C 120 135 115 150 105 155 L 110 195 L 60 195 Z" fill="#10b981"/>
  
  <!-- Student Head & Hair -->
  <circle cx="90" cy="90" r="16" fill="#fbcfe8"/>
  <path d="M 74 90 C 74 74 106 74 106 90 C 102 80 98 78 90 78 C 82 78 78 80 74 90 Z" fill="#ea580c"/>
  <!-- Student Face expression: Eager, mouth open talking, eyes bright -->
  <circle cx="86" cy="88" r="1.5" fill="#1e293b"/>
  <circle cx="96" cy="88" r="1.5" fill="#1e293b"/>
  <path d="M 90 94 Q 93 97 94 94" fill="#1e293b" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>

  <!-- Student Raising Hand to ask question (Key action for 提问) -->
  <path d="M 105 120 L 125 85 L 132 80" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="132" cy="80" r="4.5" fill="#fbcfe8"/>

  <!-- Question Mark Symbol Floating (Visualizing 'tíwèn' / Asking Question) -->
  <g transform="translate(112, 45)">
    <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.2"/>
    <path d="M -4 -6 C -4 -11 4 -11 4 -6 C 4 -2 -2 0 -2 5" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-2" cy="9" r="1.5" fill="#fbbf24"/>
  </g>

  <!-- Student Desk & Notebook -->
  <path d="M 30 165 L 115 165 L 125 195 L 20 195 Z" fill="url(#deskGrad)"/>
  <rect x="25" y="158" width="95" height="9" rx="3" fill="#d97706"/>
  <!-- Open Notebook on Student Desk -->
  <path d="M 50 165 L 75 160 L 95 165 L 75 173 Z" fill="#f8fafc"/>
  <line x1="72" y1="161" x2="72" y2="171" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Pencil -->
  <line x1="40" y1="170" x2="55" y2="167" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Classroom Floor Foreground Line -->
  <path d="M 0 195 L 240 195" stroke="#334155" stroke-width="3"/>
  
  <!-- Backpack under desk -->
  <path d="M 35 180 L 50 180 C 53 180 55 182 55 185 L 55 205 C 55 208 53 210 50 210 L 35 210 C 32 210 30 208 30 205 L 30 185 C 30 182 32 180 35 180 Z" fill="#6366f1"/>
  <path d="M 38 180 L 38 177 C 38 175 40 173 42 173 L 46 173 C 48 173 50 175 50 177 L 50 180" fill="none" stroke="#4f46e5" stroke-width="2"/>
</svg>