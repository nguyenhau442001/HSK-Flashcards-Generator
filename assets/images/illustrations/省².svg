      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Map Background Element -->
  <path d="M180 60 L220 60 L220 100 L180 100 Z" fill="#334155" opacity="0.5"/>
  <circle cx="200" cy="80" r="6" fill="#fbbf24"/>
