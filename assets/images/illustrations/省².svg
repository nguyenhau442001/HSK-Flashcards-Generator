  </g>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="180" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M160 180 L200 180 M180 160 L180 200" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Ground -->
