<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Interior Elements -->
  <!-- Window Grid (Night scene) -->
  <path d="M165 40 H210 V110 H165 Z" fill="#111827" stroke="#334155" stroke-width="2"/>
  <path d="M187 40 V110 M165 75 H210" stroke="#334155" stroke-width="1.5"/>
  <!-- City light dots outside window -->
  <circle cx="175" cy="55" r="1.5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="195" cy="90" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="60" r="1" fill="#ec4899" opacity="0.6"/>

  <!-- Bookshelf Background Prop -->
  <rect x="20" y="35" width="40" height="75" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="60" x2="60" y2="60" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="85" x2="60" y2="85" stroke="#334155" stroke-width="2"/>
  <!-- Colorful books -->
  <rect x="25" y="42" width="8" height="18" rx="1" fill="#ec4899"/>
  <rect x="35" y="40" width="10" height="20" rx="1" fill="#38bdf8"/>
  <rect x="25" y="67" width="12" height="18" rx="1" fill="#f59e0b"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M120 0 V35" stroke="#64748b" stroke-width="2"/>
  <path d="M100 35 H140 L130 50 H110 Z" fill="#fbbf24"/>
  <circle cx="120" cy="50" r="45" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Desk Surface -->
  <path d="M0 165 L240 165 V240 H0 Z" fill="#334155"/>
  <path d="M0 160 H240 V165 H0 Z" fill="#475569"/>

  <!-- Desk Props -->
  <!-- Coffee Mug -->
  <path d="M195 145 H215 V160 C215 163 212 165 205 165 C198 165 195 163 195 160 Z" fill="#f8fafc" filter="url(#shadow)"/>
  <path d="M215 148 H220 C223 148 223 157 220 157 H215" fill="none" stroke="#f8fafc" stroke-width="2.5"/>

  <!-- Notepad / Calendar Prop -->
  <g transform="translate(30, 140) rotate(-5)">
    <rect width="35" height="25" rx="2" fill="#f1f5f9" filter="url(#shadow)"/>
    <path d="M5 5 H30 M5 10 H25 M5 15 H20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17" cy="2" r="8" fill="#ec4899"/>
  </g>

  <!-- Main Character: Sitting at Desk -->
  <!-- Chair Back -->
  <path d="M80 100 H110 V165 H80 Z" fill="#0f172a" rx="4"/>

  <!-- Character Body & Outfit (Teal Hoodie / Jacket) -->
  <path d="M75 165 C75 135 90 120 120 120 C150 120 165 135 165 165 Z" fill="#0ea5e9" filter="url(#shadow)"/>
  <!-- Hoodie Collar / Drawstrings -->
  <path d="M105 120 Q120 135 135 120" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>
  <circle cx="112" cy="133" r="1.5" fill="#e0f2fe"/>
  <circle cx="128" cy="133" r="1.5" fill="#e0f2fe"/>

  <!-- Character Neck & Head -->
  <path d="M110 110 H130 V125 H110 Z" fill="#fbcfe8"/>
  <circle cx="120" cy="90" r="22" fill="#fbcfe8" filter="url(#shadow)"/>

  <!-- Hair Style (Modern layered dark hair) -->
  <path d="M98 90 C98 75 110 65 122 65 C138 65 144 75 145 90 C146 95 142 98 140 95 C135 85 125 78 115 82 C108 85 102 92 98 90 Z" fill="#334155"/>
  <path d="M100 85 C102 75 115 70 125 72" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- Face Expression (Focused, Examining) -->
  <!-- Eyebrows angled slightly down in deep concentration -->
  <path d="M107 83 L115 85" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M125 85 L133 83" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="111" cy="90" r="2" fill="#1e293b"/>
  <circle cx="129" cy="90" r="2" fill="#1e293b"/>
  <!-- Gentle focused mouth -->
  <path d="M118 97 Q121 100 123 97" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="108" cy="94" r="3" fill="#f43f5e" opacity="0.25"/>
  <circle cx="132" cy="94" r="3" fill="#f43f5e" opacity="0.25"/>

  <!-- Arms / Hands interacting with the Calendar/Tablet -->
  <!-- Left arm -->
  <path d="M75 140 C85 130 100 135 105 145" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round"/>
  <circle cx="106" cy="147" r="5" fill="#fbcfe8"/>

  <!-- Right arm reaching forward -->
  <path d="M165 140 C150 130 135 135 128 145" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round"/>
  <circle cx="126" cy="147" r="5" fill="#fbcfe8"/>

  <!-- Centerpiece: Floating Interactive Digital Calendar & Clock (Representing "Xác định thời gian") -->
  <g filter="url(#shadow)">
    <!-- Holographic Tablet / Floating Screen Frame -->
    <rect x="75" y="100" width="90" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Screen Inner Background -->
    <rect x="80" y="105" width="80" height="50" rx="4" fill="#1e293b"/>

    <!-- Clock Icon (Top Left inside screen) -->
    <circle cx="98" cy="120" r="10" fill="url(#screenGrad)"/>
    <circle cx="98" cy="120" r="8" fill="#0f172a"/>
    <path d="M98 115 V120 H102" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Calendar Grid Elements inside screen -->
    <rect x="115" y="112" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.6"/>
    <rect x="127" y="112" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.6"/>
    <rect x="139" y="112" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.6"/>
    <rect x="151" y="112" width="8" height="6" rx="1" fill="#f59e0b"/> <!-- Highlighted target date/time -->

    <rect x="115" y="121" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.6"/>
    <rect x="127" y="121" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.6"/>
    <rect x="139" y="121" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.6"/>
    <rect x="151" y="121" width="8" height="6" rx="1" fill="#38bdf8" opacity="0.6"/>

    <!-- Timeline / Schedule Bars -->
    <rect x="90" y="138" width="60" height="4" rx="2" fill="#334155"/>
    <rect x="90" y="138" width="38" height="4" rx="2" fill="#10b981"/> <!-- Progress / Confirmed time bar -->
    
    <!-- Checkmark Badge (Signifying "Xác định" / Confirmation) -->
    <circle cx="145" cy="140" r="9" fill="#10b981" filter="url(#shadow)"/>
    <path d="M141 140 L144 143 L150 136" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pointing Finger / Interaction Beam -->
  <circle cx="120" cy="130" r="3" fill="#38bdf8" opacity="0.8"/>
  <path d="M120 130 L120 145" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" opacity="0.8"/>
</svg>