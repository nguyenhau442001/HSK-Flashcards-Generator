<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#334155" opacity="0.4"/>
  
  <!-- Steam/Atmosphere -->
  <path d="M120 130 C 130 110, 110 100, 125 80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M140 120 C 150 100, 130 90, 145 70" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- The Cup (Bottom) -->
  <path d="M80 120 L160 120 L150 190 L90 190 Z" fill="#fbbf24"/>
  <path d="M80 120 A40 10 0 0 0 160 120 A40 10 0 0 0 80 120" fill="#f59e0b"/>
  
  <!-- The Lid (The Subject: 盖) -->
  <g transform="translate(120, 115)">
    <ellipse cx="0" cy="0" rx="45" ry="12" fill="#ec4899"/>
    <ellipse cx="0" cy="-2" rx="45" ry="12" fill="#db2777"/>
    <!-- Handle -->
    <rect x="-10" y="-20" width="20" height="8" rx="2" fill="#fbcfe8"/>
    <rect x="-8" y="-24" width="16" height="6" rx="2" fill="#ec4899"/>
  </g>

  <!-- Decorative Elements -->
  <circle cx="40" cy="50" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="200" cy="180" r="6" fill="#fb923c" opacity="0.6"/>
  <path d="M180 40 L190 50 L180 60 L170 50 Z" fill="#38bdf8" opacity="0.5"/>
</svg>