<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- River Background -->
  <path d="M0 140 C 80 120, 160 160, 240 140 L 240 240 L 0 240 Z" fill="#1e3a8a" opacity="0.6"/>
  <path d="M0 150 C 80 130, 160 170, 240 150 L 240 240 L 0 240 Z" fill="#3b82f6" opacity="0.4"/>
  
  <!-- Distant Mountains -->
  <path d="M0 140 L 40 90 L 80 130 L 120 80 L 160 120 L 200 70 L 240 120 L 240 140 Z" fill="#334155"/>
  
  <!-- Characters -->
  <g transform="translate(60, 130)">
