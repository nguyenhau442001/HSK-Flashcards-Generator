    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M10 35 L 30 35 L 25 70 L 15 70 Z" fill="#f59e0b"/>
    <path d="M5 40 L 15 55" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M35 40 L 25 50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Student -->
    <circle cx="80" cy="30" r="10" fill="#38bdf8"/>
    <path d="M72 40 L 88 40 L 85 70 L 75 70 Z" fill="#0ea5e9"/>
    <path d="M70 45 L 60 55" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M90 45 L 100 55" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Map/Tablet Prop -->
  <rect x="130" y="100" width="60" height="45" rx="4" fill="#f1f5f9"/>
  <path d="M135 110 L 185 110 M135 120 L 170 120 M135 130 L 180 130" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M140 135 L 150 125 L 160 135" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="40" r="15" fill="#fb923c" opacity="0.8"/>
  <path d="M20 180 Q 40 170 60 180 T 100 180" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
