<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M40 160 Q80 160 120 160 L130 120 L30 120 Z" fill="#38bdf8"/>
    <!-- Arms -->
    <path d="M30 130 L10 100 L20 90 L40 120" fill="#fb923c"/>
    <path d="M120 130 L140 100 L130 90 L110 120" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="80" cy="80" r="40" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M45 70 Q60 30 80 30 Q100 30 115 70 Z" fill="#475569"/>
    <!-- Face -->
    <circle cx="65" cy="75" r="4" fill="#1e293b"/>
    <circle cx="95" cy="75" r="4" fill="#1e293b"/>
    <path d="M65 95 Q80 105 95 95" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- The "New" Object: A glowing smartphone -->
  <g transform="translate(130, 110)">
    <rect x="0" y="0" width="60" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <rect x="5" y="10" width="50" height="80" rx="4" fill="#10b981"/>
    <!-- Shine effect -->
    <circle cx="50" cy="20" r="15" fill="#fbbf24" opacity="0.3"/>
    <path d="M30 30 L45 45 M45 30 L30 45" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Decorative elements to suggest excitement -->
  <circle cx="180" cy="60" r="8" fill="#ec4899"/>
  <circle cx="200" cy="40" r="5" fill="#38bdf8"/>
  <path d="M160 180 L170 160 L180 180" stroke="#fb923c" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>