<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155" opacity="0.4"/>
  
  <!-- Sketchbook -->
  <path d="M40 120 L200 120 L190 210 L50 210 Z" fill="#f1f5f9"/>
  <path d="M40 120 L200 120 L195 130 L45 130 Z" fill="#e2e8f0"/>
  
  <!-- Pencil -->
  <g transform="rotate(-25 120 120)">
    <rect x="80" y="80" width="120" height="15" rx="2" fill="#fbbf24"/>
    <path d="M200 80 L215 87.5 L200 95 Z" fill="#fb923c"/>
    <path d="M200 80 L208 84 L200 88 Z" fill="#1e293b"/>
    <rect x="80" y="80" width="10" height="15" fill="#f59e0b"/>
    <rect x="80" y="94" width="120" height="1" fill="#d97706" opacity="0.3"/>
  </g>
  
  <!-- Decorative elements (Eraser and clip) -->
  <rect x="50" y="150" width="25" height="25" rx="4" fill="#ec4899"/>
  <circle cx="180" cy="160" r="10" fill="#38bdf8"/>
  
  <!-- Atmospheric light -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.1"/>
</svg>