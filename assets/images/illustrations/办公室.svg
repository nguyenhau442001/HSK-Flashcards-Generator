<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="screenGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Window and Cityscape -->
  <rect x="140" y="40" width="70" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="150" y="100" width="6" height="10" fill="#fbbf24" opacity="0.6"/>
  <rect x="165" y="85" width="6" height="12" fill="#38bdf8" opacity="0.4"/>
  <rect x="185" y="110" width="6" height="8" fill="#fbbf24" opacity="0.5"/>
  <rect x="195" y="70" width="6" height="15" fill="#f8fafc" opacity="0.2"/>
  <line x1="140" y1="85" x2="210" y2="85" stroke="#334155" stroke-width="1"/>
  <line x1="175" y1="40" x2="175" y2="130" stroke="#334155" stroke-width="1"/>

  <!-- Office Chair -->
  <path d="M75,185 L115,185 L110,140 Q110,120 95,120 Q80,120 80,140 Z" fill="#334155"/>
  <rect x="90" y="185" width="10" height="15" fill="#475569"/>
  <path d="M80,200 L110,200" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Person (Stylized Silhouette) -->
  <path d="M85,165 Q85,140 95,135 Q105,140 105,165" fill="#1e293b"/>
  <circle cx="95" cy="125" r="8" fill="#1e293b"/>
  <!-- Light from screen on person -->
  <path d="M95,120 Q102,125 102,135" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Desk Surface -->
  <path d="M20,170 L220,170 L230,210 L10,210 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M10,210 L230,210 L230,215 L10,215 Z" fill="#0f172a"/>

  <!-- Laptop -->
  <path d="M90,170 L140,170 L145,145 L95,145 Z" fill="#475569"/>
  <rect x="98" y="148" width="44" height="20" fill="#0f172a" rx="1"/>
  <!-- Screen Glow -->
  <path d="M98,148 L142,148 L160,120 L80,120 Z" fill="url(#screenGlow)"/>
  <rect x="95" y="170" width="50" height="3" fill="#64748b" rx="1"/>

  <!-- Desk Lamp -->
  <path d="M40,170 L55,170 L50,165 L45,165 Z" fill="#475569"/>
  <path d="M47,165 L47,130" stroke="#475569" stroke-width="3"/>
  <path d="M47,130 L65,120" stroke="#475569" stroke-width="3"/>
  <path d="M60,115 L75,125 L70,135 L55,125 Z" fill="#f59e0b"/>
  <!-- Lamp Glow -->
  <path d="M65,125 L110,165 L40,165 Z" fill="url(#lampGlow)"/>

  <!-- Coffee Mug -->
  <path d="M165,170 L175,170 L174,160 L166,160 Z" fill="#ec4899"/>
  <path d="M175,162 Q178,162 178,165 Q178,168 175,168" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <!-- Steam -->
  <path d="M168,155 Q170,150 168,145" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
  <path d="M172,157 Q174,152 172,147" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>

  <!-- Small Plant -->
  <rect x="195" y="162" width="12" height="8" fill="#fb923c" rx="1"/>
  <path d="M198,162 Q195,155 200,152" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M201,162 Q201,150 205,155" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M204,162 Q208,158 206,152" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Foreground Details -->
  <circle cx="120" cy="190" r="1" fill="#38bdf8" opacity="0.5"/>
  <circle cx="135" cy="185" r="1" fill="#38bdf8" opacity="0.3"/>
</svg>