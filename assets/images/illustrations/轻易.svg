<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Holographic Code / Puzzle Glow -->
    <linearGradient id="holo-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment: Office / Study Room -->
  <!-- Bookshelf Background -->
  <rect x="25" y="30" width="60" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Books on shelf -->
  <rect x="33" y="45" width="10" height="25" rx="2" fill="#3b82f6"/>
  <rect x="45" y="42" width="12" height="28" rx="2" fill="#10b981"/>
  <rect x="59" y="48" width="8" height="22" rx="2" fill="#f43f5e"/>
  <rect x="70" y="40" width="10" height="30" rx="2" fill="#f59e0b"/>
  <!-- Lower shelf -->
  <rect x="33" y="80" width="14" height="25" rx="2" fill="#8b5cf6"/>
  <rect x="49" y="83" width="9" height="22" rx="2" fill="#06b6d4"/>
  <rect x="61" y="78" width="16" height="27" rx="2" fill="#ec4899"/>
  <line x1="25" y1="75" x2="85" y2="75" stroke="#334155" stroke-width="2"/>

  <!-- Window with Night City View -->
  <rect x="160" y="25" width="55" height="75" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <!-- City Skyline silhouettes -->
  <path d="M165 100 L165 70 L172 70 L172 60 L180 60 L180 100 Z" fill="#1e293b"/>
  <path d="M182 100 L182 50 L192 50 L192 100 Z" fill="#1e293b"/>
  <path d="M194 100 L194 65 L205 65 L205 100 Z" fill="#1e293b"/>
  <!-- Window Grid lines -->
  <line x1="187" y1="25" x2="187" y2="100" stroke="#334155" stroke-width="1.5"/>
  <line x1="160" y1="62" x2="215" y2="62" stroke="#334155" stroke-width="1.5"/>

  <!-- Desk Surface -->
  <path d="M10 170 C10 165 14 160 20 160 L220 160 C226 160 230 165 230 170 L230 200 C230 205 226 210 220 210 L20 210 C14 210 10 205 10 200 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="15" y="165" width="210" height="6" rx="3" fill="#475569"/>

  <!-- Desk Lamp (Warm Lighting) -->
  <circle cx="195" cy="120" r="35" fill="url(#lamp-glow)"/>
  <path d="M195 105 L205 135 L185 135 Z" fill="#f59e0b"/>
  <path d="M195 135 L195 165" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="195" cy="165" r="5" fill="#475569"/>

  <!-- Complex Problem Display / Floating Holographic Puzzle -->
  <!-- Glowing projection pad on desk -->
  <ellipse cx="105" cy="162" rx="35" ry="8" fill="#0284c7" opacity="0.4"/>
  <!-- Floating Complex Graph / Formula Node Structure (Representing the Hard Problem) -->
  <g filter="url(#shadow)">
    <!-- Connection lines -->
    <path d="M85 130 L105 110 L125 130 L115 145 L95 145 Z" fill="none" stroke="url(#holo-glow)" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="105" y1="110" x2="105" y2="95" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Nodes -->
    <circle cx="105" cy="95" r="7" fill="#f43f5e"/>
    <circle cx="85" cy="130" r="5" fill="#38bdf8"/>
    <circle cx="125" cy="130" r="5" fill="#38bdf8"/>
    <circle cx="95" cy="145" r="5" fill="#fbbf24"/>
    <circle cx="115" cy="145" r="5" fill="#fbbf24"/>
    <circle cx="105" cy="110" r="6" fill="#10b981"/>
    
    <!-- Question Mark Icon inside Hologram -->
    <path d="M102 104 C102 101 108 101 108 105 C108 108 104 109 104 112" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="104" cy="115" r="1" fill="#ffffff"/>
  </g>

  <!-- Coffee Mug (Prop for late night work) -->
  <rect x="145" y="140" width="14" height="18" rx="3" fill="#cbd5e1" filter="url(#shadow)"/>
  <path d="M159 144 C163 144 163 154 159 154" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Steam from coffee -->
  <path d="M149 133 C151 130 149 127 151 124" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Main Character (Thoughtful Professional / Student trying to solve the problem) -->
  <!-- Body / Torso -->
  <path d="M60 210 C60 185 70 170 95 170 C120 170 130 185 130 210 Z" fill="#0284c7" filter="url(#shadow)"/>
  <!-- Collar / Shirt details -->
  <polygon points="85,170 105,170 95,190" fill="#f8fafc"/>

  <!-- Head & Neck -->
  <path d="M90 150 L100 150 L100 162 L90 162 Z" fill="#fed7aa"/>
  <circle cx="95" cy="135" r="22" fill="#fed7aa" filter="url(#shadow)"/>

  <!-- Hair (Messy / Concentrated styling) -->
  <path d="M75 130 C73 115 85 110 98 112 C112 110 118 120 116 135 C116 135 110 122 95 124 C80 126 75 130 75 130 Z" fill="#334155"/>

  <!-- Facial Expression: Deeply Thinking / Puzzled -->
  <!-- Eyebrows furrowed in concentration -->
  <line x1="83" y1="128" x2="91" y2="132" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="99" y1="132" x2="107" y2="128" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes (Focused, looking forward at the complex hologram) -->
  <circle cx="87" cy="136" r="2" fill="#1e293b"/>
  <circle cx="103" cy="136" r="2" fill="#1e293b"/>
  <!-- Mouth (Slightly downturned / pensive) -->
  <path d="M92 146 Q95 143 98 146" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
  <!-- Gentle Hand on Chin (Classic "pondering" pose) -->
  <path d="M80 160 C75 155 85 142 93 145" fill="#fed7aa" stroke="#f97316" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="90" cy="144" r="5" fill="#fed7aa"/>

  <!-- Desktop Items (Notebook, Pen) -->
  <rect x="40" y="175" width="28" height="20" rx="2" fill="#e2e8f0" transform="rotate(-10 40 175)" filter="url(#shadow)"/>
  <line x1="45" y1="180" x2="60" y2="177" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="45" y1="185" x2="58" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Pen -->
  <line x1="35" y1="185" x2="48" y2="170" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle Accent Lighting/Sparkles representing complexity -->
  <circle cx="128" cy="98" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="78" cy="115" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="138" cy="138" r="1.5" fill="#f43f5e" opacity="0.6"/>
</svg>