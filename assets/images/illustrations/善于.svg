<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Protagonist (The Problem Solver) -->
  <g transform="translate(60, 80)">
    <circle cx="60" cy="40" r="35" fill="#fbbf24"/>
    <path d="M45 35 Q50 30 55 35 M65 35 Q70 30 75 35" stroke="#0f172a" stroke-width="3" fill="none"/>
    <path d="M50 55 Q60 62 70 55" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="30" y="80" width="60" height="60" rx="10" fill="#38bdf8"/>
    <rect x="40" y="90" width="40" height="10" rx="2" fill="#0f172a"/>
    <rect x="40" y="110" width="40" height="10" rx="2" fill="#0f172a"/>
  </g>

  <!-- Complex Problem (The Tangled Gears) -->
  <g transform="translate(150, 100)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="#ec4899" stroke-width="6" stroke-dasharray="8 4"/>
    <circle cx="35" cy="45" r="12" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="6 4"/>
    <path d="M20 35 L35 45" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Tools of the trade -->
  <rect x="20" y="190" width="40" height="30" rx="4" fill="#64748b"/>
  <rect x="25" y="195" width="30" height="5" rx="1" fill="#f8fafc"/>
  <rect x="25" y="205" width="30" height="5" rx="1" fill="#f8fafc"/>
  
  <path d="M180 210 L210 210 L205 230 L185 230 Z" fill="#fb923c"/>
  <circle cx="195" cy="200" r="8" fill="#fb923c"/>
</svg>