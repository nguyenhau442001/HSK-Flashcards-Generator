<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Interior Room Context (Real-world environment) -->
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#1e293b"/>
  
  <!-- Wall Decoration / Window casting warm reality light -->
  <rect x="25" y="30" width="70" height="90" rx="4" fill="#334155" opacity="0.5"/>
  <path d="M35 40 L85 40 L85 110 L35 110 Z" fill="#0f172a"/>
  <!-- Window Light Beam (representing the "reality" he is escaping) -->
  <polygon points="35,40 15,180 140,180 85,110" fill="#f59e0b" opacity="0.08"/>
  
  <!-- Desk with "Real-world problems" (pile of bills, documents, laptop) -->
  <rect x="130" y="130" width="90" height="12" rx="2" fill="#475569"/>
  <rect x="145" y="142" width="12" height="38" fill="#334155"/>
  <rect x="195" y="142" width="12" height="38" fill="#334155"/>
  
  <!-- Laptop on desk -->
  <path d="M145 120 L185 120 L190 130 L140 130 Z" fill="#64748b"/>
  <path d="M148 95 L182 95 L185 120 L145 120 Z" fill="#94a3b8"/>
  <rect x="152" y="100" width="26" height="16" rx="2" fill="#38bdf8" opacity="0.6"/>
  <!-- Red alert notification dots on screen (representing stressful problems) -->
  <circle cx="160" cy="105" r="2.5" fill="#ef4444"/>
  <circle cx="170" cy="105" r="2.5" fill="#ef4444"/>
  <circle cx="160" cy="113" r="2.5" fill="#f59e0b"/>

  <!-- Stack of Papers/Bills -->
  <rect x="190" y="118" width="22" height="12" rx="1" fill="#f8fafc"/>
  <rect x="188" y="122" width="22" height="10" rx="1" fill="#cbd5e1"/>
  <rect x="192" y="114" width="20" height="10" rx="1" fill="#e2e8f0"/>

  <!-- Main Subject: Character actively avoiding/escaping the reality -->
  <!-- He is hiding under a blanket/duvet on the floor away from the desk -->
  
  <!-- Cozy Blanket Pile (Hiding place) -->
  <path d="M40 190 Q60 130 110 135 Q150 140 170 190 Z" fill="#3b82f6"/>
  <path d="M50 195 Q70 145 115 150 Q150 155 160 195 Z" fill="#2563eb"/>
  <path d="M55 155 Q80 120 115 125 Q145 130 150 160 Z" fill="#60a5fa" opacity="0.4"/> <!-- Highlight folds -->

  <!-- Character's Head peeking out nervously/reluctantly -->
  <!-- Hair -->
  <circle cx="85" cy="138" r="14" fill="#334155"/>
  
  <!-- Face Profile/Expression -->
  <circle cx="90" cy="142" r="11" fill="#fcd34d"/>
  
  <!-- Closed anxious eyes / squinting away from desk -->
  <path d="M93 140 Q96 142 99 140" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Worried mouth -->
  <path d="M94 148 Q97 146 100 148" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Hand gripping the blanket tightly, pulling it up -->
  <circle cx="112" cy="158" r="5" fill="#fcd34d"/>
  <path d="M108 155 L116 160" stroke="#d97706" stroke-width="1.5"/>

  <!-- Action lines / Motion suggesting retreat from the right (desk) to the left (hiding) -->
  <path d="M130 150 Q115 140 102 142" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.6"/>
  <path d="M135 165 L120 160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.6"/>

  <!-- Atmosphere details -->
  <!-- Ambient lighting glows -->
  <circle cx="185" cy="100" r="30" fill="#38bdf8" opacity="0.05"/>
  <circle cx="85" cy="150" r="40" fill="#2563eb" opacity="0.1"/>
</svg>