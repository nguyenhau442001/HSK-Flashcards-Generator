<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- University Interior Elements -->
  <rect x="20" y="150" width="200" height="60" rx="4" fill="#334155"/>
  <path d="M40 150 L40 80 L200 80 L200 150" fill="none" stroke="#475569" stroke-width="2"/>
  
  <!-- Desk/Lab Table -->
  <rect x="30" y="160" width="180" height="10" fill="#475569"/>
  
  <!-- Scientist Character -->
  <g transform="translate(120, 130)">
    <circle cx="0" cy="-20" r="15" fill="#fde68a"/>
    <path d="M-5 -20 L5 -20 M-5 -15 L5 -15" stroke="#1e293b" stroke-width="1"/>
    <path d="M-20 0 L20 0 L15 50 L-15 50 Z" fill="#38bdf8"/>
    <rect x="-18" y="-5" width="36" height="10" fill="#38bdf8" rx="2"/>
  </g>
  
  <!-- Research Props -->
  <circle cx="60" cy="140" r="15" fill="none" stroke="#fb923c" stroke-width="3"/>
  <path d="M60 125 L60 155" stroke="#fb923c" stroke-width="2"/>
  <path d="M45 140 L75 140" stroke="#fb923c" stroke-width="2"/>
  
  <rect x="160" y="130" width="20" height="30" fill="#10b981" rx="2"/>
  <circle cx="170" cy="120" r="8" fill="#10b981"/>
  
  <!-- Floating Data/Research Visuals -->
  <path d="M190 100 L210 100 L200 80 Z" fill="#ec4899"/>
  <circle cx="190" cy="70" r="5" fill="#fbbf24"/>
  <path d="M40 90 L60 90 M40 100 L50 100" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="80" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>