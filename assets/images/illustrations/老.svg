<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="120" y1="0" x2="120" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deskWood" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light Overlay -->
  <rect width="240" height="240" rx="24" fill="url(#warmLight)"/>

  <!-- BACKGROUND ENVIRONMENT: Classroom / Study -->
  <!-- Chalkboard Wall -->
  <rect x="24" y="24" width="192" height="110" rx="6" fill="#1e3a2f" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="30" width="180" height="98" fill="#143026"/>
  
  <!-- Subtle Chalk Drawings on Board (Abstract math/science formulas) -->
  <path d="M 45 60 Q 55 45 65 60 T 85 60" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <text x="95" y="65" font-family="sans-serif" font-size="12" fill="#6ee7b7" fill-opacity="0.4">E=mc²</text>
  <path d="M 140 50 L 160 80 L 130 80 Z" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M 45 95 L 85 95 M 65 85 L 65 105" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Bookshelf on the side -->
  <rect x="190" y="45" width="26" height="85" fill="#334155"/>
  <rect x="193" y="65" width="20" height="4" fill="#64748b"/>
  <rect x="193" y="85" width="20" height="4" fill="#64748b"/>
  <rect x="193" y="105" width="20" height="4" fill="#64748b"/>
  <!-- Colorful Books -->
  <rect x="195" y="50" width="6" height="15" fill="#f43f5e"/>
  <rect x="202" y="52" width="7" height="13" fill="#3b82f6"/>
  <rect x="195" y="70" width="8" height="15" fill="#eab308"/>
  <rect x="204" y="72" width="5" height="13" fill="#10b981"/>

  <!-- Teacher's Wooden Desk -->
  <path d="M 20 185 L 220 185 L 210 215 L 30 215 Z" fill="url(#deskWood)"/>
  <rect x="20" y="175" width="200" height="12" rx="3" fill="#d97706"/>
  <rect x="35" y="215" width="12" height="25" fill="#78350f"/>
  <rect x="193" y="215" width="12" height="25" fill="#78350f"/>

  <!-- Props on Desk -->
  <!-- Stack of Books -->
  <rect x="45" y="160" width="35" height="15" rx="2" fill="#475569"/>
  <rect x="43" y="152" width="38" height="10" rx="2" fill="#2563eb"/>
  <rect x="46" y="146" width="32" height="7" rx="2" fill="#dc2626"/>
  <!-- Globe / Pointer / Coffee Mug -->
  <circle cx="185" cy="155" r="12" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 185 143 L 185 167 M 178 167 L 192 167" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Coffee Mug -->
  <rect x="155" y="155" width="14" height="20" rx="2" fill="#f8fafc"/>
  <path d="M 169 160 C 174 160 174 170 169 170" fill="none" stroke="#f8fafc" stroke-width="2"/>

  <!-- MIDDLEGROUND: The Elderly Teacher ("老师") -->
  <!-- Teacher's Body / Torso (Wearing a formal vest and shirt) -->
  <path d="M 95 145 L 145 145 L 155 185 L 85 185 Z" fill="#334155"/>
  <!-- White Shirt Collar & Red Tie -->
  <polygon points="120,145 110,165 130,165" fill="#f8fafc"/>
  <polygon points="118,165 122,165 125,190 120,195 115,190" fill="#e11d48"/>
  <rect x="98" y="145" width="44" height="40" rx="4" fill="#1e293b"/> <!-- Vest -->

  <!-- Teacher's Neck & Head -->
  <rect x="110" y="125" width="20" height="25" fill="#fed7aa"/>
  <!-- Head Base -->
  <circle cx="120" cy="110" r="26" fill="#fed7aa"/>
  
  <!-- Friendly Elderly Facial Features & Wrinkles (Denoting "老" - Old/Elderly) -->
  <!-- Gentle Smile lines / Crow's feet -->
  <path d="M 104 102 Q 107 105 104 108" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 136 102 Q 133 105 136 108" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Eyebrows (Bushy, wise) -->
  <path d="M 105 100 Q 112 96 117 101" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 123 101 Q 128 96 135 100" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes (Warm, smiling crescent shapes) -->
  <path d="M 108 106 Q 112 110 116 106" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 124 106 Q 128 110 132 106" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Round Glasses (Classic Intellectual Look) -->
  <circle cx="112" cy="107" r="7" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="128" cy="107" r="7" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="119" y1="107" x2="121" y2="107" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Gentle Smile -->
  <path d="M 114 120 Q 120 125 126 120" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="103" cy="115" r="4" fill="#fb7185" fill-opacity="0.4"/>
  <circle cx="137" cy="115" r="4" fill="#fb7185" fill-opacity="0.4"/>

  <!-- Gray/White Hair (Classic Elderly Feature) -->
  <path d="M 94 115 C 94 92 104 84 120 84 C 136 84 146 92 146 115 C 146 118 144 120 142 118 C 138 95 130 90 120 90 C 110 90 102 95 98 118 C 96 120 94 118 94 115 Z" fill="#f8fafc"/>
  <path d="M 94 112 C 94 105 97 98 103 94" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 146 112 C 146 105 143 98 137 94" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- FOREGROUND / INTERACTION -->
  <!-- Arms & Hands Gesturing Welcomingly / Teaching -->
  <!-- Left Arm (Holding chalk or gesturing) -->
  <path d="M 88 150 Q 70 160 75 180" fill="none" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
  <circle cx="75" cy="183" r="7" fill="#fed7aa"/>
  
  <!-- Right Arm (Raised gently explaining) -->
  <path d="M 152 150 Q 175 160 165 135" fill="none" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
  <circle cx="163" cy="130" r="7" fill="#fed7aa"/>
  <!-- Small piece of chalk in hand -->
  <rect x="165" y="122" width="3" height="8" rx="1" fill="#f8fafc" transform="rotate(25 165 122)"/>

  <!-- Decorative Warm Accent Light Flares -->
  <circle cx="40" cy="50" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="180" cy="40" r="3" fill="#fbbf24" opacity="0.4"/>
  <circle cx="215" cy="130" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>