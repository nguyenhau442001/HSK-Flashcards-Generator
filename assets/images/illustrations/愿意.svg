<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for "Willingness / Helping" -->
    <radialGradient id="glowGrad" x1="50%" y1="50%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 (Helper) Skin & Shirt -->
    <linearGradient id="helperShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 (Receiver) Shirt -->
    <linearGradient id="receiverShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Box Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Golden Glow behind the interaction -->
  <circle cx="120" cy="130" r="80" fill="url(#glowGrad)" />

  <!-- Room Background Elements (Shelf & Plant) -->
  <!-- Shelf -->
  <rect x="30" y="55" width="180" height="6" rx="3" fill="#334155" />
  <!-- Small potted plant on shelf -->
  <path d="M50 55 L55 42 L65 42 L70 55 Z" fill="#64748b" />
  <circle cx="60" cy="38" r="12" fill="#10b981" />
  <circle cx="53" cy="35" r="9" fill="#059669" />
  <!-- Books on shelf -->
  <rect x="160" y="32" width="12" height="23" rx="2" fill="#f43f5e" />
  <rect x="174" y="28" width="15" height="27" rx="2" fill="#8b5cf6" />
  <rect x="191" y="35" width="10" height="20" rx="2" fill="#0ea5e9" />

  <!-- Floor -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#090d16" opacity="0.5"/>

  <!-- SCENE GRAPHIC: Two characters demonstrating "Sẵn lòng" (Willingness to help) -->
  
  <!-- CHARACTER 2 (Receiver - Sitting/Leaning, welcoming help) -->
  <g transform="translate(155, 120)">
    <!-- Chair/Seat Back -->
    <rect x="-10" y="5" width="20" height="65" rx="5" fill="#475569" />
    <!-- Body / Torso -->
    <path d="M-12 35 C-12 20 12 20 12 35 L15 75 L-15 75 Z" fill="url(#receiverShirt)" filter="url(#shadow)" />
    <!-- Head -->
    <circle cx="0" cy="6" r="13" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M-13 3 C-13 -5 13 -5 13 3 C13 8 9 5 0 5 C-9 5 -13 8 -13 3 Z" fill="#451a03" />
    <!-- Happy Face -->
    <path d="M -3 7 Q 0 10 3 7" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="-4" cy="4" r="1.5" fill="#334155" />
    <circle cx="4" cy="4" r="1.5" fill="#334155" />
    <!-- Arms reaching out to receive -->
    <path d="M-10 40 C-25 40 -25 55 -15 55" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- THE SHARED OBJECT: Moving Box (Eagerly being offered) -->
  <g transform="translate(120, 115)" filter="url(#shadow)">
    <!-- Box Base -->
    <rect x="-18" y="-15" width="36" height="30" rx="4" fill="url(#boxGrad)" />
    <!-- Box Flaps Open / Tape -->
    <path d="M-18 -15 L-6 -25 L6 -25 L18 -15 Z" fill="#ea580c" />
    <rect x="-3" y="-25" width="6" height="10" fill="#fed7aa" opacity="0.6" />
    <!-- Heart Symbol on box representing "willingness/kindness" -->
    <path d="M0 2 C-4 -2 -8 2 -4 6 C-2 8 0 10 0 10 C0 10 2 8 4 6 C8 2 4 -2 0 2 Z" fill="#fef08a" />
  </g>

  <!-- CHARACTER 1 (Helper - Enthusiastically stepping forward, "Sẵn lòng") -->
  <g transform="translate(75, 110)">
    <!-- Legs in motion -->
    <path d="M-10 70 L-20 95" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <path d="M5 70 L15 90" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <!-- Shoes -->
    <ellipse cx="-22" cy="96" rx="6" ry="3" fill="#334155" />
    <ellipse cx="17" cy="91" rx="6" ry="3" fill="#334155" />

    <!-- Torso leaning forward eagerly -->
    <path d="M-15 25 C-15 15 15 25 10 45 L15 75 L-10 75 Z" fill="url(#helperShirt)" filter="url(#shadow)" />
    
    <!-- Head (Dynamic tilt) -->
    <circle cx="5" cy="0" r="13" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M-5 -12 C5 -15 15 -5 12 5 C5 3 0 0 -5 -12 Z" fill="#1e293b" />
    
    <!-- Facial Expression: Big enthusiastic smile & happy eyes -->
    <path d="M 2 2 Q 6 6 9 3" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="2" cy="0" r="1.5" fill="#334155" />
    <circle cx="8" cy="-1" r="1.5" fill="#334155" />
    <!-- Rosy Cheeks -->
    <circle cx="10" cy="4" r="2.5" fill="#f43f5e" opacity="0.4" />

    <!-- Arms reaching forward, eagerly holding/offering the box -->
    <path d="M5 35 C30 35 35 45 42 35" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#shadow)" />
  </g>

  <!-- Sparkles / Action Accents (Representing positive willingness & energy) -->
  <g fill="#fbbf24">
    <!-- Sparkle 1 -->
    <path d="M 105 75 Q 110 75 110 70 Q 110 75 115 75 Q 110 75 110 80 Q 110 75 105 75 Z" />
    <!-- Sparkle 2 -->
    <path d="M 135 90 Q 138 90 138 87 Q 138 90 141 90 Q 138 90 138 93 Q 138 90 135 90 Z" />
    <!-- Small floating dots -->
    <circle cx="95" cy="95" r="2" fill="#38bdf8" opacity="0.8" />
    <circle cx="145" cy="130" r="2.5" fill="#ec4899" opacity="0.8" />
  </g>

  <!-- Foreground Floor Plant / Decor to frame the scene -->
  <path d="M 15 210 Q 25 180 35 210 Z" fill="#059669" />
  <path d="M 25 210 Q 35 185 45 210 Z" fill="#10b981" />
  <ellipse cx="30" cy="210" rx="20" ry="6" fill="#334155" />

</svg>