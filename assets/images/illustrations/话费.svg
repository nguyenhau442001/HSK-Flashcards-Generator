<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Character (Upper Body) -->
  <g transform="translate(60, 80)">
    <circle cx="60" cy="30" r="25" fill="#fde68a"/>
    <path d="M45 35 Q60 45 75 35" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="52" cy="25" r="3" fill="#475569"/>
    <circle cx="68" cy="25" r="3" fill="#475569"/>
    <path d="M30 60 L90 60 L80 120 L40 120 Z" fill="#38bdf8"/>
  </g>

  <!-- Phone with Low Balance Warning -->
  <g transform="translate(130, 130)">
    <rect x="0" y="0" width="50" height="80" rx="6" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <rect x="5" y="10" width="40" height="40" rx="2" fill="#fb923c" opacity="0.3"/>
    <circle cx="25" cy="30" r="10" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="4 4"/>
    <rect x="15" y="65" width="20" height="6" rx="3" fill="#475569"/>
  </g>

  <!-- Recharge Action (Floating Icon) -->
  <g transform="translate(180, 80)">
    <circle cx="0" cy="0" r="15" fill="#10b981"/>
    <path d="M-5 0 L5 0 M0 -5 L0 5" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ambient Details -->
  <circle cx="30" cy="40" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="210" cy="50" r="6" fill="#fbbf24" opacity="0.3"/>
  <path d="M180 180 L200 180 L190 200 Z" fill="#ec4899" opacity="0.6"/>
</svg>