<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Market Stall Counter -->
  <path d="M20 180h200v40H20z" fill="#334155"/>
  <path d="M30 180h180v10H30z" fill="#475569"/>
  
  <!-- Vegetables -->
  <circle cx="60" cy="170" r="12" fill="#10b981"/>
  <circle cx="85" cy="175" r="10" fill="#22c55e"/>
  <path d="M110 175l10-20 10 20z" fill="#10b981"/>
  
  <!-- Price Tag Graphic (Abstracted as a rising arrow on a board) -->
  <rect x="160" y="80" width="50" height="70" rx="4" fill="#334155"/>
  <path d="M175 130l20-20 10 10 15-30" stroke="#fb923c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="90" r="4" fill="#fb923c"/>
  
  <!-- Customer Character -->
  <g transform="translate(40, 90)">
    <circle cx="30" cy="30" r="15" fill="#fde68a"/>
    <path d="M20 50h20l-5 40h-10z" fill="#38bdf8"/>
    <path d="M15 60l-10 20M45 60l10 20" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M25 90l-5 30M35 90l5 30" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Shopkeeper Character -->
  <g transform="translate(140, 100)">
    <circle cx="30" cy="20" r="15" fill="#fde68a"/>
    <path d="M15 35h30v40H15z" fill="#ec4899"/>
    <path d="M20 40l-10 20M40 40l10 20" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <path d="M25 75l-5 30M35 75l5 30" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Upward Trend Indicators -->
  <path d="M185 60l5-10 5 10" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <path d="M195 50l5-10 5 10" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <path d="M205 40l5-10 5 10" stroke="#fbbf24" stroke-width="3" fill="none"/>
</svg>