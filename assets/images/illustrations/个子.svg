<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <linearGradient id="light-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- Character 1 (Tall Man) Shirt Gradient -->
    <linearGradient id="shirt-tall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Character 2 (Shorter Friend) Shirt Gradient -->
    <linearGradient id="shirt-short" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Window Light -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / INTERIOR BACKGROUND -->
  <!-- Floor -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#090d16" />
  <path d="M 0 195 L 240 195" stroke="#334155" stroke-width="2" />

  <!-- Wall Background Elements -->
  <!-- Window -->
  <rect x="25" y="35" width="55" height="85" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="30" y="40" width="45" height="75" fill="url(#window-light)" />
  <line x1="52" y1="40" x2="52" y2="115" stroke="#334155" stroke-width="1.5" />
  <line x1="30" y1="77" x2="75" y2="77" stroke="#334155" stroke-width="1.5" />
  
  <!-- Hanging Picture Frame -->
  <rect x="160" y="45" width="40" height="30" rx="2" fill="#334155" />
  <rect x="164" y="49" width="32" height="22" fill="#0f172a" />
  <circle cx="180" cy="56" r="4" fill="#f59e0b" opacity="0.8" />
  <path d="M 166 65 L 175 58 L 182 63 L 190 55 L 194 65 Z" fill="#1e293b" />
  <!-- Picture hanger string -->
  <line x1="180" y1="45" x2="180" y2="38" stroke="#64748b" stroke-width="1" />

  <!-- Ambient Light Cone from top -->
  <polygon points="120,0 30,240 210,240" fill="url(#light-grad)" />

  <!-- PROPS: Bookshelf on the right -->
  <g fill="#334155">
    <rect x="195" y="85" width="30" height="110" rx="2" />
    <rect x="190" y="110" width="40" height="6" rx="1" />
    <rect x="190" y="145" width="40" height="6" rx="1" />
    <rect x="190" y="180" width="40" height="6" rx="1" />
  </g>
  <!-- Books on shelf -->
  <rect x="198" y="95" width="8" height="15" rx="1" fill="#ec4899" />
  <rect x="208" y="93" width="6" height="17" rx="1" fill="#38bdf8" />
  <rect x="216" y="96" width="7" height="14" rx="1" fill="#f59e0b" />
  <rect x="198" y="125" width="10" height="20" rx="1" fill="#10b981" />
  <rect x="210" y="128" width="8" height="17" rx="1" fill="#ef4444" />

  <!-- MEASURING MARKER / HEIGHT CHART (Visualizing "Gèzi" / Height) -->
  <g transform="translate(100, 25)">
    <!-- Vertical tracking line -->
    <line x1="0" y1="0" x2="0" y2="175" stroke="#64748b" stroke-dasharray="3 3" stroke-width="1.5" />
    
    <!-- Top indicator matching tall guy's head -->
    <line x1="-8" y1="12" x2="8" y2="12" stroke="#f59e0b" stroke-width="2" />
    <polygon points="10,12 16,9 16,15" fill="#f59e0b" />

    <!-- Mid indicator matching shorter guy's head -->
    <line x1="-8" y1="58" x2="8" y2="58" stroke="#38bdf8" stroke-width="2" />

    <!-- Comparison bracket / arrow showing height difference -->
    <path d="M -15 12 L -20 12 L -20 35 L -25 35 L -20 35 L -20 58 L -15 58" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- CHARACTERS -->

  <!-- CHARACTER 1: SHORTER FRIEND (Left) -->
  <g id="character-short" filter="url(#shadow)">
    <!-- Shadow beneath feet -->
    <ellipse cx="82" cy="197" rx="16" ry="4" fill="#000000" opacity="0.4" />

    <!-- Legs & Shoes -->
    <rect x="74" y="165" width="7" height="32" rx="3.5" fill="#334155" />
    <rect x="85" y="165" width="7" height="32" rx="3.5" fill="#334155" />
    <path d="M 70 194 L 77 194 C 80 194 81 197 81 199 L 71 199 C 69 199 69 196 70 194 Z" fill="#cbd5e1" />
    <path d="M 81 194 L 88 194 C 90 194 91 197 91 199 L 82 199 C 80 199 80 196 81 194 Z" fill="#cbd5e1" />

    <!-- Torso (Green Shirt) -->
    <path d="M 70 125 L 98 125 C 102 125 104 128 103 133 L 98 168 C 98 171 95 173 92 173 L 76 173 C 73 173 70 171 70 168 L 65 133 C 64 128 66 125 70 125 Z" fill="url(#shirt-short)" />

    <!-- Arms (Waving / Casual pose) -->
    <!-- Left Arm -->
    <path d="M 67 130 L 53 148 L 57 153 L 68 138" fill="#cbd5e1" stroke="#10b981" stroke-width="1" />
    <circle cx="55" cy="151" r="5" fill="#fbcfe8" /> <!-- Hand -->
    <!-- Right Arm (pointing up/towards tall friend) -->
    <path d="M 101 130 L 118 118 L 121 123 L 105 137" fill="#cbd5e1" stroke="#10b981" stroke-width="1" />
    <circle cx="120" cy="120" r="5" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Head & Face -->
    <circle cx="84" cy="98" r="18" fill="#fbcfe8" />
    <!-- Hair (Short dark messy) -->
    <path d="M 68 98 C 68 86 74 80 84 80 C 94 80 100 86 100 98 C 96 92 90 90 84 90 C 78 90 72 92 68 98 Z" fill="#334155" />
    <path d="M 72 87 C 76 83 82 82 87 83" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <!-- Facial expression: Friendly smile looking up -->
    <circle cx="78" cy="97" r="1.5" fill="#1e293b" />
    <circle cx="90" cy="97" r="1.5" fill="#1e293b" />
    <!-- Smile -->
    <path d="M 82 103 C 84 106 87 106 89 103" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Cheeks (Blush) -->
    <circle cx="76" cy="101" r="2.5" fill="#fda4af" opacity="0.6" />
    <circle cx="92" cy="101" r="2.5" fill="#fda4af" opacity="0.6" />
  </g>

  <!-- CHARACTER 2: TALL FRIEND / SUBJECT OF "GÈZI" (Right) -->
  <g id="character-tall" filter="url(#shadow)">
    <!-- Shadow beneath feet -->
    <ellipse cx="152" cy="197" rx="16" ry="4" fill="#000000" opacity="0.4" />

    <!-- Legs & Shoes (Longer legs) -->
    <rect x="142" y="145" width="8" height="52" rx="4" fill="#1e293b" />
    <rect x="154" y="145" width="8" height="52" rx="4" fill="#1e293b" />
    <path d="M 138 194 L 146 194 C 149 194 150 197 150 199 L 139 199 C 137 199 137 196 138 194 Z" fill="#f8fafc" />
    <path d="M 150 194 L 158 194 C 161 194 162 197 162 199 L 151 199 C 149 199 149 196 150 194 Z" fill="#f8fafc" />

    <!-- Torso (Blue Shirt) - Positioned higher -->
    <path d="M 138 82 L 166 82 C 170 82 172 85 171 90 L 165 150 C 165 153 162 155 159 155 L 145 155 C 142 155 139 153 139 150 L 133 90 C 132 85 134 82 138 82 Z" fill="url(#shirt-tall)" />

    <!-- Arms (Relaxed, confident posture) -->
    <!-- Left Arm (Akimbo / on hip) -->
    <path d="M 135 88 L 122 105 L 129 110 L 139 98" fill="#cbd5e1" stroke="#0284c7" stroke-width="1" />
    <circle cx="121" cy="107" r="5" fill="#fbcfe8" />
    <!-- Right Arm (Slightly raised, gesturing casually) -->
    <path d="M 169 88 L 183 102 L 179 108 L 165 96" fill="#cbd5e1" stroke="#0284c7" stroke-width="1" />
    <circle cx="184" cy="100" r="5" fill="#fbcfe8" />

    <!-- Head & Face (Reaching higher up towards top frame) -->
    <circle cx="152" cy="55" r="18" fill="#fbcfe8" />
    <!-- Hair (Stylish brown/amber tuft) -->
    <path d="M 136 55 C 136 43 142 37 152 37 C 162 37 168 43 168 55 C 164 49 158 47 152 47 C 146 47 140 49 136 55 Z" fill="#92400e" />
    <path d="M 145 42 C 148 39 154 39 159 41" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" />
    
    <!-- Facial Expression: Confident, friendly, relaxed -->
    <circle cx="146" cy="54" r="1.5" fill="#1e293b" />
    <circle cx="158" cy="54" r="1.5" fill="#1e293b" />
    <!-- Confident Smile -->
    <path d="M 148 60 C 151 63 154 63 156 60" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Cheeks (Subtle blush) -->
    <circle cx="144" cy="58" r="2.5" fill="#fda4af" opacity="0.6" />
    <circle cx="160" cy="58" r="2.5" fill="#fda4af" opacity="0.6" />
  </g>

  <!-- FOREGROUND DETAILS (Enhancing depth & framing) -->
  <!-- House plant leaf in bottom left corner -->
  <path d="M 0 240 Q 20 220 15 195 Q 5 210 0 240 Z" fill="#059669" />
  <path d="M 0 240 Q 35 225 30 205 Q 15 220 0 240 Z" fill="#10b981" />
</svg>