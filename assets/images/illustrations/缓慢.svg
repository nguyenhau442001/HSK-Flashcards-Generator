<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Snow ground -->
  <path d="M0 180 C80 170, 160 190, 240 180 L240 240 L0 240 Z" fill="#e2e8f0"/>
  
  <!-- Tire tracks -->
  <path d="M20 195 Q60 185, 100 195 T180 195" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="6 6" fill="none"/>
  
  <!-- Car Body -->
  <g transform="translate(60, 140)">
    <path d="M10 40 L90 40 L85 15 L60 15 L50 0 L20 0 L10 15 Z" fill="#fb923c"/>
    <rect x="25" y="5" width="20" height="10" fill="#38bdf8" opacity="0.6"/>
    <rect x="50" y="5" width="25" height="10" fill="#38bdf8" opacity="0.6"/>
    <!-- Wheels -->
    <circle cx="25" cy="45" r="8" fill="#334155"/>
    <circle cx="75" cy="45" r="8" fill="#334155"/>
    <!-- Headlight -->
    <circle cx="90" cy="25" r="3" fill="#fef3c7"/>
  </g>
  
  <!-- Snowflakes -->
  <circle cx="40" cy="50" r="1.5" fill="#f8fafc"/>
  <circle cx="120" cy="30" r="2" fill="#f8fafc"/>
  <circle cx="200" cy="70" r="1.5" fill="#f8fafc"/>
  <circle cx="160" cy="100" r="2" fill="#f8fafc"/>
  <circle cx="30" cy="110" r="1.5" fill="#f8fafc"/>
  
  <!-- Motion lines for slow speed -->
  <path d="M40 160 L50 160" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 165 L35 165" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
</svg>