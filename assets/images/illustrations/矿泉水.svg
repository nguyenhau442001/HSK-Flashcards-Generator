<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Table / Environment Gradient -->
    <linearGradient id="tableGrad" x1="0" y1="170" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Bottle Plastic Gradient (Translucent Ice Blue) -->
    <linearGradient id="bottleBody" x1="60" y1="60" x2="180" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.3"/>
      <stop offset="0.2" stop-color="#e0f2fe" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#e0f2fe" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Water Liquid Gradient -->
    <linearGradient id="waterLiquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#0ea5e9" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0369a1" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Label Gradient -->
    <linearGradient id="labelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Cap Gradient (Vibrant Orange/Amber accent) -->
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Glass Rim Gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Cafe/Nature Vibe) -->
  <g opacity="0.15">
    <!-- Warm Ambient Glow from Back -->
    <circle cx="120" cy="110" r="70" fill="#38bdf8" filter="url(#glow)"/>
    <!-- Decorative Plant/Leaf silhouette -->
    <path d="M 20 240 Q 30 180 10 120 Q 25 150 40 240 Z" fill="#10b981"/>
    <path d="M 220 240 Q 210 170 230 100 Q 215 140 200 240 Z" fill="#10b981"/>
  </g>

  <!-- Table Surface -->
  <rect x="0" y="170" width="240" height="70" fill="url(#tableGrad)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Background Props: A sleek modern glass and lemon slice -->
  <g transform="translate(165, 135)">
    <!-- Glass Shadow -->
    <ellipse cx="15" cy="40" rx="14" ry="5" fill="#000000" opacity="0.4"/>
    <!-- Glass Body -->
    <path d="M 5 5 L 10 45 C 10 48, 20 48, 25 45 L 30 5 Z" fill="url(#glassGrad)" stroke="#bae6fd" stroke-width="1"/>
    <!-- Water Inside Glass -->
    <path d="M 8 15 L 11 43 C 11 45, 19 45, 22 43 L 25 15 Z" fill="#0ea5e9" opacity="0.5"/>
    <!-- Ice Cube -->
    <rect x="12" y="20" width="10" height="10" rx="2" fill="#ffffff" opacity="0.6" transform="rotate(15 17 25)"/>
  </g>

  <!-- MAIN SUBJECT: Mineral Water Bottle (矿泉水) -->
  <g filter="url(#dropShadow)">
    <!-- Bottle Drop Shadow on Table -->
    <ellipse cx="100" cy="210" rx="24" ry="8" fill="#000000" opacity="0.6"/>

    <!-- Bottle Base (Rounded Bottom) -->
    <path d="M 80 190 C 80 205, 120 205, 120 190 Z" fill="url(#waterLiquid)"/>

    <!-- Main Bottle Body (Cylindrical with organic ridges) -->
    <!-- Ridges / Highlights along the body -->
    <path d="M 76 85 C 74 120, 74 160, 76 190 
             L 124 190 C 126 160, 126 120, 124 85 Z" fill="url(#bottleBody)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Internal Water Fill & Waves -->
    <path d="M 77 95 
             Q 100 90, 123 95 
             L 123 189 
             C 123 200, 77 200, 77 189 Z" fill="url(#waterLiquid)"/>

    <!-- Sparkling Bubbles inside Water -->
    <g fill="#ffffff" opacity="0.7">
      <circle cx="95" cy="120" r="3"/>
      <circle cx="105" cy="140" r="2"/>
      <circle cx="90" cy="160" r="3.5"/>
      <circle cx="110" cy="170" r="1.5"/>
      <circle cx="98" cy="105" r="1.5"/>
    </g>

    <!-- Plastic Bottle Grip Texture / Ribs -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.4" fill="none">
      <path d="M 76 100 Q 100 103 124 100"/>
      <path d="M 76 110 Q 100 113 124 110"/>
      <path d="M 76 120 Q 100 123 124 120"/>
      
      <path d="M 76 155 Q 100 158 124 155"/>
      <path d="M 76 165 Q 100 168 124 165"/>
      <path d="M 76 175 Q 100 178 124 175"/>
    </g>

    <!-- Premium Product Label (Curved & Vibrant) -->
    <path d="M 75.3 125 
             Q 100 131, 124.7 125 
             L 124.3 152 
             Q 100 158, 75.7 152 Z" fill="url(#labelGrad)"/>
    
    <!-- Label Details (Mountain silhouette & wave graphic, NO TEXT) -->
    <path d="M 85 147 L 95 135 L 102 143 L 110 134 L 120 147 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 82 149 Q 100 144, 118 149" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8"/>
    <!-- Golden Accent Stripe on Label -->
    <path d="M 75.5 127 Q 100 133, 124.5 127" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <path d="M 75.5 150 Q 100 156, 124.5 150" stroke="#fbbf24" stroke-width="1" fill="none"/>

    <!-- Bottle Shoulder (Tapering to neck) -->
    <path d="M 76 85 C 76 75, 88 70, 92 65
             L 108 65 C 112 70, 124 75, 124 85 Z" fill="url(#bottleBody)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Bottle Neck -->
    <rect x="92" y="52" width="16" height="13" fill="url(#bottleBody)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Screw Threads on Neck -->
    <path d="M 92 56 L 108 56 M 92 60 L 108 60" stroke="#bae6fd" stroke-width="1" opacity="0.8"/>

    <!-- Bottle Cap (Bright Orange/Amber with ridged details) -->
    <path d="M 90 42 L 110 42 L 112 52 L 88 52 Z" fill="url(#capGrad)" stroke="#ea580c" stroke-width="1"/>
    <!-- Cap Ridges -->
    <line x1="94" y1="44" x2="94" y2="50" stroke="#c2410c" stroke-width="1.5"/>
    <line x1="98" y1="44" x2="98" y2="50" stroke="#c2410c" stroke-width="1.5"/>
    <line x1="102" y1="44" x2="102" y2="50" stroke="#c2410c" stroke-width="1.5"/>
    <line x1="106" y1="44" x2="106" y2="50" stroke="#c2410c" stroke-width="1.5"/>
    <!-- Cap Top Highlight -->
    <ellipse cx="100" cy="42" rx="10" ry="2" fill="#fdba74"/>
  </g>

  <!-- Action / Freshness Elements (Splashes, droplets, and sparkle effects) -->
  <g>
    <!-- Sparkling Star / Highlight top right -->
    <path d="M 145 75 Q 145 85, 155 85 Q 145 85, 145 95 Q 145 85, 135 85 Q 145 85, 145 75 Z" fill="#fbbf24" filter="url(#glow)"/>
    <path d="M 75 55 Q 75 60, 80 60 Q 75 60, 75 65 Q 75 60, 70 60 Q 75 60, 75 55 Z" fill="#ffffff"/>

    <!-- Floating Water Droplets (Dynamic freshness) -->
    <path d="M 62 110 C 60 115, 57 118, 57 121 C 57 124, 59 126, 62 126 C 65 126, 67 124, 67 121 C 67 118, 64 115, 62 110 Z" fill="#38bdf8" opacity="0.8"/>
    <circle cx="60.5" cy="120" r="1" fill="#ffffff"/>

    <path d="M 138 135 C 136 139, 134 141, 134 143 C 134 145, 136 147, 138 147 C 140 147, 142 145, 142 143 C 142 141, 140 139, 138 135 Z" fill="#38bdf8" opacity="0.8"/>
    
    <path d="M 68 165 C 67 168, 65 169, 65 171 C 65 173, 66 174, 68 174 C 70 174, 71 173, 71 171 C 71 169, 69 168, 68 165 Z" fill="#38bdf8" opacity="0.8"/>
  </g>
  
  <!-- Foreground rim light on bottle for ultimate 2D vector depth -->
  <path d="M 78 87 C 77 120, 77 160, 78 188" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9" stroke-linecap="round"/>
</svg>