<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Amber Glow for Atmosphere -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Gradients (Blue/Teal) -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Gradients (Coral/Pink) -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Glow -->
  <circle cx="120" cy="120" r="100" fill="url(#glow)" />

  <!-- Room Interior Details / Environment Props -->
  <!-- Wallpaper lines / Architectural accents -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="1.5" opacity="0.5" />
  <rect x="25" y="40" width="45" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.6" />
  <!-- Plant in background -->
  <path d="M205 160 C205 130 215 110 215 90 C215 110 225 130 225 160" fill="#10b981" opacity="0.8" />
  <ellipse cx="215" cy="160" rx="12" ry="6" fill="#64748b" />

  <!-- Floor Surface -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#38bdf8" stroke-width="2" opacity="0.3" />

  <!-- CENTRAL COMPARISON SCENE: Height Measurement Wall & Characters -->
  <!-- Measurement Tape / Ruler Graphic on Wall -->
  <g transform="translate(115, 30)">
    <rect x="-4" y="0" width="8" height="165" rx="3" fill="#cbd5e1" opacity="0.9" />
    <!-- Ticks -->
    <line x1="-4" y1="15" x2="4" y2="15" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-2" y1="35" x2="2" y2="35" stroke="#0f172a" stroke-width="1" />
    <line x1="-4" y1="55" x2="4" y2="55" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-2" y1="75" x2="2" y2="75" stroke="#0f172a" stroke-width="1" />
    <line x1="-4" y1="95" x2="4" y2="95" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-2" y1="115" x2="2" y2="115" stroke="#0f172a" stroke-width="1" />
    <line x1="-4" y1="135" x2="4" y2="135" stroke="#0f172a" stroke-width="1.5" />
  </g>

  <!-- CHARACTER 1 (Left: Standing straight, cheerful) -->
  <g transform="translate(70, 70)">
    <!-- Shadow -->
    <ellipse cx="10" cy="123" rx="14" ry="4" fill="#000000" opacity="0.4" />

    <!-- Legs -->
    <rect x="2" y="90" width="6" height="30" rx="3" fill="#1e293b" />
    <rect x="12" y="90" width="6" height="30" rx="3" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="4" cy="120" rx="6" ry="3" fill="#f8fafc" />
    <ellipse cx="15" cy="120" rx="6" ry="3" fill="#f8fafc" />

    <!-- Torso -->
    <path d="M 2 45 Q 10 40 18 45 L 20 95 Q 10 98 0 95 Z" fill="url(#shirt1)" />

    <!-- Arms (relaxed by sides) -->
    <path d="M 2 48 Q -4 65 0 80" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 18 48 Q 24 65 20 80" stroke="#0284c7" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Head & Hair -->
    <circle cx="10" cy="28" r="15" fill="#fbcfe8" />
    <!-- Hair Dark -->
    <path d="M -3 25 C -3 10 23 10 23 25 C 23 20 18 13 10 13 C 2 13 -3 20 -3 25 Z" fill="#0f172a" />
    <!-- Face Expression (Smiling, looking confident) -->
    <circle cx="6" cy="27" r="1.5" fill="#0f172a" />
    <circle cx="14" cy="27" r="1.5" fill="#0f172a" />
    <path d="M 8 33 Q 10 36 12 33" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Rosy cheeks -->
    <circle cx="4" cy="30" r="2" fill="#f43f5e" opacity="0.4" />
    <circle cx="16" cy="30" r="2" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- CHARACTER 2 (Right: Standing proudly, roughly same height - demonstrating 'almost identical') -->
  <g transform="translate(145, 71)">
    <!-- Shadow -->
    <ellipse cx="10" cy="122" rx="14" ry="4" fill="#000000" opacity="0.4" />

    <!-- Legs -->
    <rect x="3" y="90" width="6" height="30" rx="3" fill="#1e293b" />
    <rect x="13" y="90" width="6" height="30" rx="3" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="5" cy="120" rx="6" ry="3" fill="#f8fafc" />
    <ellipse cx="16" cy="120" rx="6" ry="3" fill="#f8fafc" />

    <!-- Torso -->
    <path d="M 2 45 Q 10 40 18 45 L 20 95 Q 10 98 0 95 Z" fill="url(#shirt2)" />

    <!-- Arms (One hand on hip for dynamic feel) -->
    <path d="M 2 48 Q -6 65 -2 80" stroke="#fb923c" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 18 48 Q 26 60 22 75" stroke="#e11d48" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Head & Hair -->
    <circle cx="10" cy="27" r="15" fill="#fbcfe8" />
    <!-- Hair Spiky/Stylish -->
    <path d="M -4 24 C -4 10 24 10 24 24 C 20 12 15 15 10 12 C 5 15 0 12 -4 24 Z" fill="#334155" />
    <!-- Face Expression (Excited/Smiling) -->
    <circle cx="6" cy="26" r="1.5" fill="#0f172a" />
    <circle cx="14" cy="26" r="1.5" fill="#0f172a" />
    <path d="M 8 32 Q 10 35 12 32" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Rosy cheeks -->
    <circle cx="4" cy="29" r="2" fill="#f43f5e" opacity="0.4" />
    <circle cx="16" cy="29" r="2" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- PRECISION HEIGHT COMPARISON INDICATOR (Visualizing "chàbuduō" / almost equal) -->
  <!-- Horizontal alignment line passing right across both heads to show they are almost identical height -->
  <g transform="translate(0, 95)">
    <line x1="50" y1="0" x2="190" y2="0" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />
    <!-- Glowing marker nodes at the hair peaks -->
    <circle cx="80" cy="0" r="4" fill="#fbbf24" />
    <circle cx="160" cy="0" r="4" fill="#fbbf24" />

    <!-- Tiny upward/downward indicator bracket in the center -->
    <path d="M 116 -4 L 120 -8 L 124 -4" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 116 4 L 120 8 L 124 4" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Props for Environmental Richness -->
  <!-- Small side table with a glowing lamp on the left -->
  <g transform="translate(15, 145)">
    <rect x="0" y="10" width="35" height="35" rx="4" fill="#475569" />
    <rect x="5" y="0" width="25" height="10" rx="2" fill="#64748b" />
    <!-- Lamp -->
    <path d="M 15 0 L 12 -12 L 23 -12 L 20 0 Z" fill="#f59e0b" />
    <circle cx="17" cy="-14" r="8" fill="#fef08a" opacity="0.6" />
  </g>

  <!-- Small stool on the right -->
  <g transform="translate(190, 165)">
    <ellipse cx="15" cy="5" rx="15" ry="5" fill="#475569" />
    <rect x="5" y="8" width="4" height="20" rx="2" fill="#334155" />
    <rect x="21" y="8" width="4" height="20" rx="2" fill="#334155" />
  </g>

  <!-- Dynamic Sparkles / Highlights reinforcing app illustration quality -->
  <g fill="#fbbf24" opacity="0.8">
    <path d="M 50 50 L 52 56 L 58 58 L 52 60 L 50 66 L 48 60 L 42 58 L 48 56 Z" transform="scale(0.6) translate(40, 20)" />
    <path d="M 50 50 L 52 56 L 58 58 L 52 60 L 50 66 L 48 60 L 42 58 L 48 56 Z" transform="scale(0.4) translate(350, 80)" />
  </g>
</svg>