<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Distant road/horizon line -->
  <path d="M0 160 L240 160 L200 240 L40 240 Z" fill="#334155"/>
  <path d="M110 160 L120 240 M130 160 L140 240" stroke="#475569" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Telephone booth structure -->
  <rect x="40" y="60" width="60" height="140" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <rect x="45" y="65" width="50" height="130" rx="2" fill="#0f172a"/>
  <rect x="45" y="65" width="50" height="30" fill="#38bdf8" opacity="0.2"/>
  
  <!-- Phone handset -->
  <path d="M65 110 L85 110 C90 110 90 125 85 125 L65 125 C60 125 60 110 65 110 Z" fill="#fbbf24"/>
  <circle cx="75" cy="117" r="4" fill="#0f172a"/>
  
  <!-- Cord -->
  <path d="M75 125 C75 140 90 135 90 150" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Atmospheric elements (distant lights/stars) -->
  <circle cx="180" cy="80" r="2" fill="#f59e0b"/>
  <circle cx="200" cy="70" r="3" fill="#f59e0b"/>
  <circle cx="210" cy="95" r="2" fill="#f59e0b"/>
  
  <!-- Glowing signal waves -->
  <path d="M95 75 A20 20 0 0 1 115 95" stroke="#10b981" stroke-width="3" fill="none"/>
  <path d="M105 65 A35 35 0 0 1 135 95" stroke="#10b981" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Decorative accent -->
  <circle cx="190" cy="180" r="20" fill="#ec4899" opacity="0.15"/>
  <circle cx="190" cy="180" r="10" fill="#ec4899" opacity="0.3"/>
</svg>