<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Speech Stream Gradient: Flowing, smooth, energetic -->
    <linearGradient id="streamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Glow Effect for Magic Stream -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Window Cityscape Gradient -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Cozy Modern Studio/Cafe) -->
  <!-- Window Frame -->
  <path d="M165 40 H210 V140 H165 Z" fill="url(#windowGrad)" stroke="#334155" stroke-width="2"/>
  <path d="M187 40 V140" stroke="#334155" stroke-width="1.5"/>
  <path d="M165 90 H210" stroke="#334155" stroke-width="1.5"/>
  <!-- City Lights outside window -->
  <circle cx="175" cy="60" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="195" cy="75" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="180" cy="110" r="1.5" fill="#ec4899" opacity="0.8"/>
  <circle cx="200" cy="125" r="1.5" fill="#fbbf24" opacity="0.6"/>

  <!-- Plant Prop for Depth -->
  <path d="M210 170 C210 150, 225 140, 230 130 C235 140, 235 170, 230 190 Z" fill="#10b981"/>
  <path d="M222 190 V210" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Bookshelf / Prop in Background -->
  <rect x="20" y="50" width="35" height="90" rx="3" fill="#0f172a" opacity="0.6"/>
  <line x1="20" y1="70" x2="55" y2="70" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="95" x2="55" y2="95" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="120" x2="55" y2="120" stroke="#334155" stroke-width="2"/>
  <!-- Tiny colorful books -->
  <rect x="25" y="58" width="6" height="12" rx="1" fill="#ec4899"/>
  <rect x="33" y="56" width="8" height="14" rx="1" fill="#38bdf8"/>
  <rect x="25" y="80" width="10" height="15" rx="1" fill="#fbbf24"/>
  <rect x="38" y="82" width="5" height="13" rx="1" fill="#10b981"/>

  <!-- Desk Surface -->
  <path d="M0 190 H240 V240 H0 Z" fill="#0f172a"/>
  <path d="M0 190 L240 190" stroke="#334155" stroke-width="2"/>

  <!-- Desk Props: Microphone & Laptop -->
  <!-- Laptop Base -->
  <path d="M130 195 L165 185 H205 L215 195 Z" fill="#64748b"/>
  <!-- Laptop Screen -->
  <path d="M150 150 H195 V185 H150 Z" rx="2" fill="#334155"/>
  <path d="M154 154 H191 V181 H154 Z" fill="#0f172a"/>
  <!-- Code/Waveform on Laptop Screen -->
  <path d="M160 162 L170 170 L185 158" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="172" cy="175" r="1.5" fill="#10b981"/>
  <circle cx="178" cy="175" r="1.5" fill="#fbbf24"/>

  <!-- Professional Microphone on Stand -->
  <path d="M110 210 H126" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M118 190 V210" stroke="#475569" stroke-width="3"/>
  <path d="M110 170 C104 170, 100 175, 100 185 C100 195, 104 200, 118 200 C132 200, 136 195, 136 185 C136 175, 132 170, 126 170 Z" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="111" y="162" width="14" height="20" rx="7" fill="#334155" stroke="#94a3b8" stroke-width="2"/>

  <!-- MAIN CHARACTER: Confident, expressive speaker -->
  <!-- Torso & Shoulders -->
  <path d="M35 215 C35 190, 60 185, 75 185 C90 185, 115 190, 115 215 Z" fill="#4f46e5"/>
  <!-- Collar / Scarf accent -->
  <path d="M60 185 L75 198 L90 185 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M65 190 L75 198 L85 190 Z" fill="#e0e7ff"/>

  <!-- Neck -->
  <path d="M66 160 H84 V190 H66 Z" fill="#fcd34d"/>

  <!-- Head -->
  <circle cx="75" cy="135" r="28" fill="#fcd34d"/>

  <!-- Hair (Stylish modern look) -->
  <path d="M47 130 C47 110, 60 102, 75 102 C93 102, 104 115, 104 135 C104 145, 102 152, 100 152 C98 152, 97 142, 95 138 C91 125, 80 115, 70 115 C58 115, 50 122, 47 130 Z" fill="#1e1b4b"/>
  <!-- Hair strand over forehead -->
  <path d="M65 110 C70 115, 80 116, 85 112 C80 118, 68 118, 65 110 Z" fill="#312e81"/>

  <!-- Facial Expression: Energetic, enthusiastic, smiling -->
  <!-- Eyebrows (Dynamic tilt) -->
  <path d="M60 124 Q65 120, 71 124" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M79 124 Q85 120, 90 124" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Happy crescents/dots) -->
  <circle cx="66" cy="131" r="2.5" fill="#1e1b4b"/>
  <circle cx="84" cy="131" r="2.5" fill="#1e1b4b"/>

  <!-- Rosy Cheeks -->
  <circle cx="61" cy="140" r="4" fill="#f87171" opacity="0.4"/>
  <circle cx="89" cy="140" r="4" fill="#f87171" opacity="0.4"/>

  <!-- Open Enthusiastic Mouth (Speaking clearly) -->
  <path d="M70 144 C70 144, 75 152, 80 144 Z" fill="#991b1b"/>
  <path d="M72 144 H78 C78 144, 75 149, 72 144 Z" fill="#ffffff"/>

  <!-- ACTION & CONCEPT VISUALIZATION: "流利" (Fluency/Smoothness as a flowing luminous river of speech) -->
  <!-- Smooth, unbroken, sweeping vector stream exiting the mouth and curving into the air -->
  <g filter="url(#glow)">
    <!-- Main Fluid Stream Ribbon -->
    <path d="M 85 142 
             C 115 135, 140 100, 150 70 
             C 158 45, 130 30, 110 45 
             C 90 60, 100 80, 120 85 
             C 145 90, 180 80, 205 55" 
          fill="none" stroke="url(#streamGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
          
    <!-- Secondary Dynamic Speed Lines / Fluid Ripples -->
    <path d="M 90 148 
             C 120 145, 145 110, 155 75 
             C 160 55, 140 40, 120 52" 
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <path d="M 95 136 
             C 115 125, 130 95, 140 68" 
          fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Sparkling Fluid Particles representing effortless articulation -->
  <!-- Star/Sparkle 1 -->
  <path d="M150 50 L153 58 L161 61 L153 64 L150 72 L147 64 L139 61 L147 58 Z" fill="#ffffff"/>
  <!-- Star/Sparkle 2 -->
  <path d="M110 35 L112 40 L117 42 L112 44 L110 49 L108 44 L103 42 L108 40 Z" fill="#38bdf8"/>
  <!-- Star/Sparkle 3 -->
  <path d="M185 65 L186.5 69 L190.5 70.5 L186.5 72 L185 76 L183.5 72 L179.5 70.5 L183.5 69 Z" fill="#10b981"/>
  <!-- Star/Sparkle 4 -->
  <path d="M130 95 L131 98 L134 99 L131 100 L130 103 L129 100 L126 99 L129 98 Z" fill="#fbbf24"/>

  <!-- Additional floating dynamic rings representing sound waves/flow -->
  <circle cx="165" cy="45" r="4" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <circle cx="120" cy="30" r="3" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
  <circle cx="195" cy="50" r="5" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7"/>

  <!-- Foreground Coffee Cup Prop (Completing the natural studio environment) -->
  <path d="M25 175 C25 170, 35 170, 35 175 V188 C35 192, 25 192, 25 188 Z" fill="#e2e8f0"/>
  <path d="M35 178 C40 178, 40 185, 35 185" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam from Coffee -->
  <path d="M28 165 Q30 160, 28 155" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>