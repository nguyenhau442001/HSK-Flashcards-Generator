<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Soil Gradient -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light/Glow from Top -->
  <circle cx="120" cy="40" r="70" fill="#f59e0b" filter="url(#soft-glow)" opacity="0.15" />

  <!-- Volumetric Light Beam -->
  <polygon points="80,0 160,0 190,210 50,210" fill="url(#lightBeam)" />

  <!-- Wooden Table / Surface -->
  <path d="M 15 205 L 225 205 L 235 240 L 5 240 Z" fill="#0f172a" />
  <rect x="0" y="200" width="240" height="8" fill="#334155" rx="2" />
  <rect x="0" y="205" width="240" height="35" fill="#0f172a" opacity="0.6" />

  <!-- Background Environment Details (Cozy Workshop / Greenhouse Vibe) -->
  <!-- Floating Sparkles / Nutrients / Energy -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="90" cy="70" r="2.5" filter="url(#glow)" />
    <circle cx="150" cy="90" r="2" filter="url(#glow)" />
    <circle cx="110" cy="115" r="1.5" />
    <circle cx="135" cy="60" r="3" filter="url(#glow)" />
    <circle cx="75" cy="100" r="2" />
    <circle cx="165" cy="120" r="2.5" />
  </g>
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="100" cy="90" r="2" />
    <circle cx="140" cy="75" r="1.5" />
    <circle cx="85" cy="125" r="2" filter="url(#glow)" />
  </g>

  <!-- Secondary Prop: Small Watering Can (Left) -->
  <g transform="translate(35, 155)">
    <!-- Can Body -->
    <path d="M 10 15 C 5 15 2 20 5 35 C 8 45 22 45 25 35 C 28 20 25 15 20 15 Z" fill="#38bdf8" />
    <ellipse cx="15" cy="15" rx="5" ry="2" fill="#bae6fd" />
    <!-- Handle -->
    <path d="M 7 18 C -2 18 -2 32 6 36" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <!-- Spout -->
    <path d="M 23 25 L 38 12 L 40 16 L 25 32 Z" fill="#38bdf8" />
    <ellipse cx="39" cy="14" rx="2" ry="1.5" fill="#bae6fd" />
    <!-- Water Drops falling -->
    <circle cx="45" cy="22" r="1.5" fill="#38bdf8" />
    <circle cx="50" cy="30" r="2" fill="#38bdf8" />
  </g>

  <!-- Secondary Prop: Tiny Companion Seedling (Right) -->
  <g transform="translate(170, 165)">
    <ellipse cx="12" cy="35" rx="8" ry="3" fill="#0f172a" opacity="0.4" />
    <path d="M 8 32 C 8 22 16 22 16 32 Z" fill="#10b981" />
    <path d="M 12 32 L 12 20" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 12 23 C 6 23 4 15 12 18 C 20 15 18 23 12 23 Z" fill="#34d399" />
  </g>

  <!-- MAIN SUBJECT: The Cultivation Scene (Nurturing a Vibrant Plant) -->
  <!-- Pot Shadow -->
  <ellipse cx="120" cy="202" rx="32" ry="7" fill="#020617" opacity="0.6" />

  <!-- Flower Pot -->
  <!-- Rim -->
  <ellipse cx="120" cy="140" rx="36" ry="7" fill="#f97316" />
  <ellipse cx="120" cy="139" rx="34" ry="6" fill="#fb923c" />
  
  <!-- Pot Body -->
  <path d="M 86 140 L 96 200 C 96 203 99 205 102 205 L 138 205 C 141 205 144 203 144 200 L 154 140 Z" fill="url(#potGrad)" />
  <!-- Pot Highlight Stripe -->
  <path d="M 98 145 C 98 145 92 175 99 195" fill="none" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Rich Soil Inside Pot -->
  <ellipse cx="120" cy="141" rx="33" ry="5" fill="url(#soilGrad)" />
  <!-- Soil texture details -->
  <circle cx="110" cy="141" r="2" fill="#291104" />
  <circle cx="130" cy="142" r="1.5" fill="#291104" />
  <circle cx="120" cy="140" r="2.5" fill="#291104" />

  <!-- Glowing Energy Core in Soil (Representing 'Bồi Dưỡng' / Nurturing Force) -->
  <ellipse cx="120" cy="143" rx="16" ry="3" fill="#fbbf24" filter="url(#glow)" opacity="0.8" />

  <!-- MAIN PLANT (Growing, vibrant, flourishing) -->
  <!-- Stems -->
  <path d="M 120 142 C 120 115 105 90 95 80" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  <path d="M 120 135 C 120 100 135 80 148 68" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" />
  <path d="M 120 120 C 120 95 120 75 120 50" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" />

  <!-- Leaves (Left branch) -->
  <path d="M 104 95 C 80 90 75 115 95 105 Z" fill="#34d399" />
  <path d="M 104 95 C 90 95 85 108 95 105 Z" fill="#10b981" opacity="0.5" />

  <!-- Leaves (Right branch) -->
  <path d="M 136 82 C 160 75 165 100 145 92 Z" fill="#34d399" />
  <path d="M 136 82 C 150 80 155 92 145 92 Z" fill="#059669" opacity="0.6" />

  <!-- Top Center Leaf / Bud -->
  <path d="M 120 55 C 105 40 115 25 120 20 C 125 25 135 40 120 55 Z" fill="#6ee7b7" filter="url(#glow)" />
  <path d="M 120 55 C 120 40 115 30 120 20 C 120 30 125 40 120 55 Z" fill="#a7f3d0" />

  <!-- Additional Small Sprouting Leaves -->
  <path d="M 112 110 C 98 105 100 120 112 115 Z" fill="#10b981" />
  <path d="M 128 100 C 142 95 140 110 128 105 Z" fill="#34d399" />

  <!-- Floating Magic/Growth Sparkles around the Plant -->
  <g filter="url(#glow)">
    <path d="M 120 35 L 123 42 L 130 45 L 123 48 L 120 55 L 117 48 L 110 45 L 117 42 Z" fill="#fbbf24" transform="scale(0.5) translate(120, 20)" />
    <path d="M 120 35 L 123 42 L 130 45 L 123 48 L 120 55 L 117 48 L 110 45 L 117 42 Z" fill="#f43f5e" transform="scale(0.35) translate(190, 160)" />
    <path d="M 120 35 L 123 42 L 130 45 L 123 48 L 120 55 L 117 48 L 110 45 L 117 42 Z" fill="#38bdf8" transform="scale(0.4) translate(80, 120)" />
  </g>

  <!-- Dynamic Glowing Halo behind main sprout -->
  <circle cx="120" cy="70" r="30" fill="#34d399" filter="url(#soft-glow)" opacity="0.3" />

  <!-- Foreground Atmospheric Particles -->
  <circle cx="70" cy="180" r="1.5" fill="#fbbf24" opacity="0.5" />
  <circle cx="175" cy="190" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="160" cy="140" r="1" fill="#ffffff" opacity="0.7" />
  <circle cx="80" cy="145" r="1.5" fill="#34d399" opacity="0.6" />

</svg>