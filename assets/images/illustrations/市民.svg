<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Urban Street Context -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M20 240 L40 180 M80 240 L100 180 M140 240 L160 180 M200 240 L220 180" stroke="#475569" stroke-width="2"/>
  
  <!-- Building Silhouettes -->
  <rect x="10" y="100" width="40" height="80" fill="#1e293b" stroke="#334155"/>
  <rect x="60" y="70" width="50" height="110" fill="#1e293b" stroke="#334155"/>
  <rect x="180" y="90" width="50" height="90" fill="#1e293b" stroke="#334155"/>
  
  <!-- Characters (Citizens) -->
  <!-- Person 1 -->
  <g transform="translate(40, 160)">
    <circle cx="10" cy="-35" r="8" fill="#fbbf24"/>
    <path d="M10 -27 L10 -10 M10 -20 L0 -10 M10 -20 L20 -10 M5 -10 L5 15 M15 -10 L15 15" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(100, 155)">
    <circle cx="10" cy="-35" r="8" fill="#38bdf8"/>
    <path d="M10 -27 L10 -10 M10 -20 L0 -10 M10 -20 L20 -10 M5 -10 L5 15 M15 -10 L15 15" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(160, 165)">
    <circle cx="10" cy="-35" r="8" fill="#ec4899"/>
    <path d="M10 -27 L10 -10 M10 -20 L0 -10 M10 -20 L20 -10 M5 -10 L5 15 M15 -10 L15 15" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Protest Signs (Abstract shapes) -->
  <rect x="55" y="100" width="20" height="15" fill="#f59e0b" rx="2"/>
  <rect x="115" y="90" width="20" height="15" fill="#10b981" rx="2"/>
  <rect x="175" y="105" width="20" height="15" fill="#fb923c" rx="2"/>
  
  <!-- Street Lamp -->
  <path d="M220 180 L220 80 M210 80 L230 80" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="220" cy="75" r="5" fill="#fef3c7"/>
