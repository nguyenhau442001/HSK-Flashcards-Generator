<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Character Legs -->
  <path d="M70 190h15v40h-15z" fill="#38bdf8"/>
  <path d="M155 190h15v40h-15z" fill="#38bdf8"/>
  
  <!-- Character Body -->
  <path d="M60 120h120v70H60z" fill="#38bdf8" rx="10"/>
  
  <!-- Arms lifting -->
  <path d="M50 130c-10 0 -15 10 -15 20s10 10 15 10" stroke="#fb923c" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M190 130c10 0 15 10 15 20s-10 10 -15 10" stroke="#fb923c" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- The Box (The Object being lifted) -->
  <rect x="50" y="80" width="140" height="70" rx="8" fill="#f59e0b"/>
  <rect x="50" y="80" width="140" height="20" rx="8" fill="#fbbf24"/>
  <rect x="115" y="80" width="10" height="70" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Motion Lines -->
  <path d="M120 70 l-10 -15 M120 70 l10 -15" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 70 l-10 -15 M140 70 l10 -15" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="120" cy="90" r="25" fill="#fb923c"/>
  <circle cx="110" cy="85" r="4" fill="#0f172a"/>
  <circle cx="130" cy="85" r="4" fill="#0f172a"/>
  <path d="M110 100 q10 5 20 0" stroke="#0f172a" stroke-width="2" fill="none"/>
</svg>