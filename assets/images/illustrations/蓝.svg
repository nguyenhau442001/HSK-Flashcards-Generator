<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sky-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Vibrant Blue Sky Gradient for the Easel Canvas -->
    <linearGradient id="canvas-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#sky-bg)" />

  <!-- ENVIRONMENT: Cozy Room Interior / Rooftop Studio -->
  <!-- Warm Ambient Glow from a window or lamp -->
  <circle cx="200" cy="50" r="80" fill="#f59e0b" opacity="0.08" />

  <!-- Wooden Floor / Base -->
  <path d="M0 210 L240 210 L240 240 L0 240 Z" fill="#0f172a" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" />

  <!-- Potted Plant (Context Prop) -->
  <path d="M25 210 L35 175 L55 175 L65 210 Z" fill="#64748b" />
  <ellipse cx="45" cy="175" rx="10" ry="3" fill="#475569" />
  <!-- Plant Leaves -->
  <path d="M45 172 Q20 150 15 130 Q35 150 45 172 Z" fill="#10b981" />
  <path d="M45 172 Q60 140 75 125 Q65 155 45 172 Z" fill="#059669" />
  <path d="M45 172 Q45 135 40 120 Q48 145 45 172 Z" fill="#34d399" />

  <!-- ART EASEL -->
  <g filter="url(#shadow)">
    <!-- Easel Legs -->
    <line x1="120" y1="50" x2="80" y2="210" stroke="url(#wood-grad)" stroke-width="6" stroke-linecap="round" />
    <line x1="120" y1="50" x2="165" y2="210" stroke="url(#wood-grad)" stroke-width="6" stroke-linecap="round" />
    <line x1="120" y1="40" x2="125" y2="210" stroke="url(#wood-grad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Easel Shelf / Tray -->
    <rect x="75" y="150" width="90" height="8" rx="2" fill="#d97706" />

    <!-- THE PAINTING (CENTERPIECE: "The Blue Sky" / 天空是蓝色的) -->
    <g transform="translate(82, 70)">
      <!-- Canvas Border/Frame -->
      <rect x="-3" y="-3" width="82" height="86" rx="4" fill="#cbd5e1" />
      <!-- Canvas Blue Sky Fill -->
      <rect x="0" y="0" width="76" height="80" rx="2" fill="url(#canvas-sky)" />
      
      <!-- Fluffy White Clouds on the Blue Sky Painting -->
      <path d="M15 35 Q20 25 30 30 Q40 20 50 30 Q60 25 62 38 Q65 50 50 50 L18 50 Q10 50 15 35 Z" fill="#ffffff" opacity="0.9" />
      <path d="M40 60 Q45 52 55 55 Q65 50 70 60 Q72 68 62 68 L42 68 Q38 68 40 60 Z" fill="#ffffff" opacity="0.8" />
      
      <!-- Radiant Sun in the Blue Sky -->
      <circle cx="22" cy="22" r="8" fill="#fef08a" opacity="0.9" />
    </g>
  </g>

  <!-- ARTIST CHARACTER -->
  <g transform="translate(130, 115)" filter="url(#shadow)">
    <!-- Character Body / Torso -->
    <path d="M15 45 Q30 35 45 50 L55 95 L5 95 Z" fill="url(#shirt-grad)" />
    <!-- Sleeves / Arms -->
    <path d="M18 45 L-5 65 L5 75 L25 55 Z" fill="#f43f5e" />
    
    <!-- Paintbrush / Hand -->
    <circle cx="-5" cy="65" r="5" fill="#fbcfe8" />
    <!-- Brush Handle -->
    <line x1="-5" y1="65" x2="-25" y2="85" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
    <!-- Brush Tip (Blue Paint) -->
    <path d="M-22 82 L-28 88 L-25 89 Z" fill="#38bdf8" />

    <!-- Character Neck & Head -->
    <rect x="22" y="25" width="10" height="15" fill="#fbcfe8" />
    <circle cx="27" cy="18" r="16" fill="#fbcfe8" />

    <!-- Hair -->
    <path d="M11 15 Q15 -2 27 -2 Q41 -2 43 15 Q43 25 38 20 Q30 8 18 18 Q13 22 11 15 Z" fill="url(#hair-grad)" />
    <circle cx="39" cy="18" r="5" fill="#334155" /> <!-- Hair bun -->

    <!-- Friendly Expressive Face (Profile/Semi-profile looking at painting) -->
    <!-- Eye -->
    <circle cx="33" cy="16" r="2" fill="#0f172a" />
    <!-- Rosy Cheek -->
    <ellipse cx="33" cy="22" rx="3" ry="1.5" fill="#fda4af" opacity="0.8" />
    <!-- Gentle Happy Smile -->
    <path d="M32 23 Q35 26 37 23" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- ART SUPPLIES / DETAILS ON FLOOR -->
  <!-- Paint Palette -->
  <g transform="translate(60, 190)" filter="url(#shadow)">
    <ellipse cx="15" cy="10" rx="16" ry="10" fill="#fdf6e2" />
    <!-- Thumb hole -->
    <ellipse cx="8" cy="10" rx="3" ry="2" fill="#0f172a" />
    <!-- Paint blobs -->
    <circle cx="20" cy="6" r="3" fill="#38bdf8" /> <!-- Blue -->
    <circle cx="26" cy="10" r="2.5" fill="#f59e0b" /> <!-- Yellow -->
    <circle cx="22" cy="14" r="2.5" fill="#ef4444" /> <!-- Red -->
  </g>

  <!-- Paint Jar with Blue Paint -->
  <g transform="translate(100, 192)" filter="url(#shadow)">
    <rect x="0" y="4" width="14" height="14" rx="2" fill="#cbd5e1" opacity="0.8" />
    <rect x="2" y="7" width="10" height="11" fill="#0284c7" />
    <rect x="3" y="0" width="8" height="4" rx="1" fill="#64748b" />
  </g>

</svg>