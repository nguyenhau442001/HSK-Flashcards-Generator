<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- The Book (Subject) -->
  <g transform="rotate(-10 120 140)">
    <rect x="80" y="100" width="80" height="110" rx="4" fill="#fbbf24"/>
    <rect x="85" y="105" width="70" height="100" rx="2" fill="#fef3c7"/>
    <line x1="95" y1="120" x2="145" y2="120" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <line x1="95" y1="140" x2="145" y2="140" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <line x1="95" y1="160" x2="120" y2="160" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Character (Author/Editor) -->
  <g transform="translate(40, 80)">
    <circle cx="30" cy="30" r="15" fill="#fde68a"/>
    <path d="M20 30 Q30 40 40 30" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="15" y="45" width="30" height="40" rx="5" fill="#38bdf8"/>
    <rect x="10" y="45" width="10" height="30" rx="3" fill="#38bdf8"/>
    <rect x="40" y="45" width="10" height="30" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Countdown/Launch Effect -->
  <circle cx="180" cy="60" r="25" fill="#1e293b" stroke="#ec4899" stroke-width="3"/>
  <path d="M180 45 L180 60 L190 70" stroke="#ec4899" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Sparkles -->
  <circle cx="150" cy="50" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="80" r="2" fill="#fbbf24"/>
  <circle cx="190" cy="40" r="4" fill="#fbbf24"/>
  
  <!-- Floating Paper/Announcement -->
  <rect x="160" y="120" width="40" height="30" rx="2" fill="#e2e8f0"/>
  <line x1="165" y1="130" x2="195" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="165" y1="140" x2="185" y2="140" stroke="#94a3b8" stroke-width="2"/>
</svg>