<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02" />
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Wall & Window Structure -->
  <g id="room_background">
    <!-- Window Frame in Background -->
    <rect x="135" y="25" width="75" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <!-- Window Panes -->
    <rect x="142" y="32" width="28" height="76" rx="3" fill="#1e293b" />
    <rect x="175" y="32" width="28" height="76" rx="3" fill="#1e293b" />
    <!-- Night City Silhouette through window -->
    <path d="M145 75 L150 60 L155 65 L160 50 L166 100 L145 100 Z" fill="#334155" opacity="0.6" />
    <path d="M178 70 L185 55 L192 100 L178 100 Z" fill="#334155" opacity="0.4" />
    <!-- Window Light Beam casting across the room -->
    <polygon points="135,25 210,125 50,125" fill="url(#windowLight)" />
  </g>

  <!-- Bookshelf on Back Wall (Left Side) -->
  <g id="bookshelf" opacity="0.9">
    <rect x="25" y="40" width="45" height="85" rx="3" fill="#334155" />
    <rect x="30" y="65" width="35" height="4" fill="#475569" />
    <rect x="30" y="90" width="35" height="4" fill="#475569" />
    <!-- Book Spines -->
    <rect x="32" y="45" width="8" height="18" rx="1" fill="#ec4899" />
    <rect x="42" y="48" width="6" height="15" rx="1" fill="#fb923c" />
    <rect x="50" y="44" width="10" height="19" rx="1" fill="#38bdf8" />
    <rect x="33" y="70" width="7" height="18" rx="1" fill="#10b981" />
    <rect x="42" y="72" width="9" height="16" rx="1" fill="#a78bfa" />
  </g>

  <!-- Potted Plant (Familiar & Cozy Element) -->
  <g id="potted_plant" transform="translate(190, 85)">
    <path d="M10 35 L16 55 L4 55 Z" fill="#cbd5e1" />
    <!-- Leaves -->
    <path d="M10 35 C 10 15, -5 10, -10 5 C -5 20, 5 30, 10 35 Z" fill="url(#leafGrad)" />
    <path d="M10 35 C 15 15, 30 10, 35 5 C 28 20, 15 30, 10 35 Z" fill="url(#leafGrad)" />
    <path d="M10 35 C 10 10, 15 0, 20 -5 C 15 15, 12 25, 10 35 Z" fill="#10b981" />
  </g>

  <!-- Desk Surface -->
  <g id="desk">
    <!-- Desk Main Block -->
    <rect x="15" y="125" width="210" height="12" rx="3" fill="#475569" />
    <!-- Desk Front Face (Shadow/Depth) -->
    <rect x="15" y="137" width="210" height="75" fill="#334155" />
    <!-- Wood grain accent line -->
    <line x1="15" y1="131" x2="225" y2="131" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Desk Accessories (Familiar items making the space comfortable) -->
  <g id="desk_props">
    <!-- Coffee Mug -->
    <rect x="35" y="105" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M51 110 C 56 110, 56 120, 51 120" stroke="#f8fafc" stroke-width="2.5" fill="none" />
    <!-- Mug Steam -->
    <path d="M40 98 Q 42 93, 40 88" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Open Notebook / Planner -->
    <path d="M170 112 L210 108 L210 125 L170 128 Z" fill="#f8fafc" />
    <path d="M190 110 L190 127" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="175" y1="116" x2="185" y2="115" stroke="#94a3b8" stroke-width="1" />
    <line x1="175" y1="120" x2="185" y2="119" stroke="#94a3b8" stroke-width="1" />
    <line x1="195" y1="115" x2="205" y2="113" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Desk Lamp & Atmospheric Light Glow -->
  <g id="desk_lamp">
    <!-- Light Glow Area -->
    <circle cx="75" cy="90" r="55" fill="url(#lampGlow)" />
    <!-- Lamp Stand / Arm -->
    <path d="M75 125 L75 95 L95 80" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Lamp Shade -->
    <path d="M85 70 L110 85 L95 95 Z" fill="#fbbf24" />
    <!-- Lamp Bulb / Glow Point -->
    <circle cx="95" cy="84" r="4" fill="#fef08a" />
  </g>

  <!-- Main Character (Relaxed, completely familiar and at ease in their room) -->
  <g id="character" transform="translate(85, 55)">
    <!-- Body / Hoodie Torso -->
    <path d="M20 75 C 20 55, 30 50, 50 50 C 70 50, 80 55, 80 75 L95 125 L5 125 Z" fill="url(#hoodieGrad)" />
    
    <!-- Hoodie Pocket / Details -->
    <path d="M35 100 L65 100 L62 120 L38 120 Z" fill="#0284c7" opacity="0.6" />
    <circle cx="50" cy="53" r="4" fill="#e0f2fe" />

    <!-- Crossed Arms resting on the desk (Showing confident posture & comfort) -->
    <!-- Left Arm -->
    <path d="M25 75 Q 40 85, 60 70" stroke="#0284c7" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Right Arm -->
    <path d="M75 75 Q 60 85, 40 70" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Hands -->
    <circle cx="48" cy="73" r="7" fill="#fed7aa" />
    <circle cx="58" cy="73" r="7" fill="#fed7aa" />

    <!-- Neck -->
    <rect x="43" y="42" width="14" height="15" fill="#fed7aa" />

    <!-- Head & Face -->
    <circle cx="50" cy="30" r="22" fill="#fed7aa" />

    <!-- Hair (Friendly, styled) -->
    <path d="M28 28 C 28 10, 40 6, 50 6 C 65 6, 72 14, 72 30 C 72 30, 68 22, 60 20 C 52 18, 42 22, 35 25 Z" fill="#1e293b" />
    <circle cx="30" cy="30" r="4" fill="#1e293b" />
    <circle cx="69" cy="32" r="3" fill="#1e293b" />

    <!-- Facial Expressions - Content, Familiar Smile -->
    <!-- Eyes (Happy Arcs / Closed confident blink or warm gaze) -->
    <path d="M39 28 Q 42 24, 45 28" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M55 28 Q 58 24, 61 28" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Cheeks (Warm blush of comfort) -->
    <circle cx="38" cy="34" r="4" fill="#fca5a5" opacity="0.6" />
    <circle cx="62" cy="34" r="4" fill="#fca5a5" opacity="0.6" />

    <!-- Smile (Serene and knowing) -->
    <path d="M44 38 Q 50 43, 56 38" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Foreground Ambient Sparkles / Cozy Atmosphere (Highlighting the "Home/Familiar" warm feeling) -->
  <g id="atmosphere_particles">
    <circle cx="45" cy="55" r="2" fill="#fbbf24" opacity="0.8" />
    <circle cx="150" cy="80" r="1.5" fill="#fef08a" opacity="0.6" />
    <circle cx="120" cy="45" r="2.5" fill="#fbbf24" opacity="0.5" />
    <circle cx="195" cy="65" r="2" fill="#38bdf8" opacity="0.7" />
  </g>
</svg>