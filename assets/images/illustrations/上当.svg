<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Screen Glow Gradient -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Trap / Alert Red Glow -->
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effects -->
  <circle cx="120" cy="110" r="90" fill="url(#alertGlow)" />
  <circle cx="170" cy="90" r="50" fill="url(#screenGlow)" />

  <!-- Background Environment: Room Interior / Wall Decor -->
  <!-- Window / Frame -->
  <rect x="25" y="30" width="45" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M25 57 H70 M47 30 V85" stroke="#334155" stroke-width="1.5" />
  
  <!-- Bookshelf Background Silhouette -->
  <rect x="185" y="40" width="30" height="90" rx="2" fill="#151e30" />
  <line x1="185" y1="70" x2="215" y2="70" stroke="#334155" stroke-width="2" />
  <line x1="185" y1="100" x2="215" y2="100" stroke="#334155" stroke-width="2" />

  <!-- Office Desk Surface -->
  <path d="M 15 170 L 225 170 L 210 215 L 30 215 Z" fill="url(#deskGrad)" />
  <rect x="15" y="165" width="210" height="7" rx="3.5" fill="#475569" />

  <!-- Desk Props: Laptop & Coffee Mug -->
  <!-- Laptop Base -->
  <path d="M 135 168 L 205 168 L 195 152 L 145 152 Z" fill="#64748b" />
  <!-- Laptop Screen (Showing "Scam / Trap" visual cue: red downward chart & warning box) -->
  <rect x="143" y="105" width="54" height="49" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <!-- Scam UI Elements on Screen -->
  <path d="M 148 118 L 160 132 L 170 124 L 188 142" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="188" cy="142" r="3" fill="#ef4444" />
  <!-- Warning badge icon on screen -->
  <path d="M 170 112 L 176 122 H 164 Z" fill="#f59e0b" />

  <!-- Coffee Mug -->
  <rect x="45" y="145" width="16" height="20" rx="3" fill="#cbd5e1" />
  <path d="M 61 150 C 66 150, 66 160, 61 162" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <path d="M 50 140 Q 53 133, 50 128" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Main Character: Disappointed / Shocked Man realizing he has been scammed -->
  <!-- Chair Back -->
  <path d="M 75 165 C 70 120, 115 120, 110 165 Z" fill="#334155" />

  <!-- Character Body / Torso (Wearing a stylish casual hoodie) -->
  <path d="M 75 215 L 75 165 C 75 145, 115 145, 115 165 L 115 215 Z" fill="#3b82f6" />
  <path d="M 95 150 L 78 175 H 112 Z" fill="#1d4ed8" /> <!-- Hoodie neckline/collar -->

  <!-- Character Arms / Hands in frustration gesture (Hands on head/hair) -->
  <!-- Left Arm -->
  <path d="M 75 170 C 60 170, 50 145, 65 130 C 72 125, 80 135, 82 142" fill="#3b82f6" />
  <!-- Right Arm -->
  <path d="M 115 170 C 130 170, 140 145, 125 130 C 118 125, 110 135, 108 142" fill="#3b82f6" />

  <!-- Character Neck -->
  <rect x="88" y="132" width="14" height="20" rx="4" fill="#fbcfe8" />

  <!-- Character Head -->
  <circle cx="95" cy="115" r="22" fill="#fbcfe8" />

  <!-- Hair (Messy, expressive stylized hair) -->
  <path d="M 73 115 C 73 95, 117 95, 117 115 C 117 122, 112 120, 110 115 C 105 98, 85 98, 80 115 C 78 120, 73 122, 73 115 Z" fill="#1e293b" />
  <path d="M 85 100 C 90 92, 102 92, 108 97" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Facial Expression: Shock, realization, falling for a trap ("上当") -->
  <!-- Eyebrows (Slanted upward inward in stress/realization) -->
  <path d="M 82 110 L 89 114" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 108 110 L 101 114" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes (Wide, shocked dots with tiny highlights) -->
  <circle cx="86" cy="119" r="3" fill="#1e293b" />
  <circle cx="104" cy="119" r="3" fill="#1e293b" />
  <circle cx="87" cy="118" r="1" fill="#ffffff" />
  <circle cx="105" cy="118" r="1" fill="#ffffff" />

  <!-- Open O-shaped Mouth (Shock/Regret) -->
  <ellipse cx="95" cy="130" rx="4.5" ry="6" fill="#1e293b" />

  <!-- Sweat Drop (Classic comic style realization/panic element) -->
  <path d="M 115 105 C 118 110, 118 114, 115 114 C 112 114, 112 110, 115 105 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Floating Conceptual Trap Elements (Subtle thematic context without text) -->
  <!-- Floating warning triangle icons subtly glowing -->
  <g transform="translate(140, 65) scale(0.7)">
    <polygon points="20,5 35,32 5,32" fill="#ef4444" />
    <rect x="18" y="15" width="4" height="9" rx="2" fill="#ffffff" />
    <circle cx="20" cy="28" r="2.5" fill="#ffffff" />
  </g>
  <g transform="translate(55, 80) scale(0.5)">
    <polygon points="20,5 35,32 5,32" fill="#f59e0b" />
    <rect x="18" y="15" width="4" height="9" rx="2" fill="#ffffff" />
    <circle cx="20" cy="28" r="2.5" fill="#ffffff" />
  </g>

  <!-- Dramatic Foreground Vignette Shadow -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.5" />
</svg>