<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Wall & Window -->
  <rect x="20" y="30" width="200" height="120" rx="8" fill="#334155"/>
  <rect x="30" y="40" width="180" height="100" rx="4" fill="#0f172a"/>
  <path d="M120 40 L120 140 M30 90 L210 90" stroke="#334155" stroke-width="2"/>
  
  <!-- Calendar on wall -->
  <rect x="180" y="45" width="25" height="30" rx="2" fill="#fbbf24"/>
  <rect x="182" y="52" width="21" height="20" rx="1" fill="#fef3c7"/>
  <line x1="185" y1="56" x2="198" y2="56" stroke="#fb923c" stroke-width="2"/>
  <line x1="185" y1="62" x2="198" y2="62" stroke="#fb923c" stroke-width="2"/>
  
  <!-- Desk -->
  <rect x="20" y="150" width="200" height="60" rx="4" fill="#475569"/>
  <rect x="30" y="160" width="180" height="10" rx="2" fill="#1e293b"/>
  
  <!-- Character -->
  <circle cx="120" cy="110" r="25" fill="#fcd34d"/>
  <path d="M105 105 Q110 100 115 105 M125 105 Q130 100 135 105" stroke="#0f172a" stroke-width="2" fill="none"/>
  <path d="M110 120 Q120 125 130 120" stroke="#0f172a" stroke-width="2" fill="none"/>
  
  <!-- Hands pointing at document -->
  <rect x="80" y="170" width="80" height="40" rx="2" fill="#e2e8f0"/>
  <line x1="90" y1="180" x2="140" y2="180" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="190" x2="120" y2="190" stroke="#334155" stroke-width="2"/>
  
  <!-- Action Indicator (Clock/Arrow) -->
  <circle cx="200" cy="190" r="15" fill="#10b981"/>
  <path d="M200 182 L200 190 L208 190" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Decorative light -->
  <circle cx="40" cy="50" r="3" fill="#38bdf8"/>
