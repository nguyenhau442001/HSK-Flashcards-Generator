<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Wall Gradient (Warm Stone / Terracotta accent) -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Tower Gradient (Vibrant Amber) -->
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="10" y="10" width="180" height="180" rx="32" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Decorative Background Horizon / Landscape Wave -->
  <path d="M 30 140 Q 70 120 110 145 T 170 135" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 25 155 Q 80 135 130 160 T 175 150" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

  <!-- The Great Wall Structure (Curving Dynamic Vector Metaphor) -->
  <g filter="url(#shadow)">
    <!-- Base Wall Body -->
    <path d="M 35 125 
             C 65 125, 75 90, 110 95 
             C 145 100, 155 70, 170 65 
             L 170 85 
             C 155 90, 145 120, 110 115 
             C 75 110, 65 145, 35 145 
             Z" 
          fill="url(#wallGrad)"/>

    <!-- Wall Top Surface (Perspective Edge) -->
    <path d="M 35 125 
             C 65 125, 75 90, 110 95 
             C 145 100, 155 70, 170 65
             L 166 60
             C 152 65, 140 93, 110 88
             C 80 83, 68 118, 35 118
             Z" 
          fill="#fed7aa" 
          opacity="0.4"/>
  </g>

  <!-- Watchtowers (Emphasizing height, strength, and architecture) -->
  <g filter="url(#shadow)">
    <!-- Left Tower -->
    <g transform="translate(30, 95)">
      <rect x="0" y="10" width="22" height="30" rx="3" fill="url(#towerGrad)"/>
      <!-- Crenellations (Battlements) -->
      <path d="M -2 10 L -2 4 L 3 4 L 3 10 L 8 10 L 8 4 L 14 4 L 14 10 L 19 10 L 19 4 L 24 4 L 24 10 Z" fill="#f59e0b"/>
      <!-- Window slit -->
      <rect x="7" y="18" width="8" height="10" rx="2" fill="#1e293b"/>
    </g>

    <!-- Center/Middle Tower -->
    <g transform="translate(99, 65)">
      <rect x="0" y="10" width="22" height="35" rx="3" fill="url(#towerGrad)"/>
      <!-- Crenellations -->
      <path d="M -2 10 L -2 4 L 3 4 L 3 10 L 8 10 L 8 4 L 14 4 L 14 10 L 19 10 L 19 4 L 24 4 L 24 10 Z" fill="#f59e0b"/>
      <!-- Window slit -->
      <rect x="7" y="18" width="8" height="12" rx="2" fill="#1e293b"/>
    </g>

    <!-- Right Tower (Highest Point) -->
    <g transform="translate(155, 38)">
      <rect x="0" y="10" width="22" height="38" rx="3" fill="url(#towerGrad)" filter="url(#glow)"/>
      <!-- Crenellations -->
      <path d="M -2 10 L -2 4 L 3 4 L 3 10 L 8 10 L 8 4 L 14 4 L 14 10 L 19 10 L 19 4 L 24 4 L 24 10 Z" fill="#fde047"/>
      <!-- Window slit -->
      <rect x="7" y="18" width="8" height="14" rx="2" fill="#1e293b"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Accent Dots (Modern UI touch) -->
  <circle cx="145" cy="45" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="135" cy="35" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="158" cy="25" r="2" fill="#f59e0b" opacity="0.6"/>
</svg>