<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Moon -->
  <circle cx="180" cy="60" r="25" fill="#fbbf24" opacity="0.9"/>
  <circle cx="185" cy="55" r="25" fill="#1e293b" opacity="0.2"/>
  
  <!-- Clouds -->
  <path d="M0 180 q20 -10 40 0 t40 0 t40 0 t40 0" fill="#334155" opacity="0.4"/>
  
  <!-- Courtyard Ground -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  
  <!-- Characters -->
  <!-- Person 1 -->
  <g transform="translate(60, 160)">
    <circle cx="0" cy="-30" r="12" fill="#fb923c"/>
    <path d="M-15 0 h30 v20 a10 10 0 0 1 -30 0 z" fill="#38bdf8"/>
    <path d="M-10 20 l-5 15 M10 20 l5 15" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(110, 170)">
    <circle cx="0" cy="-30" r="12" fill="#ec4899"/>
    <path d="M-15 0 h30 v20 a10 10 0 0 1 -30 0 z" fill="#10b981"/>
    <path d="M-10 20 l-5 15 M10 20 l5 15" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(160, 165)">
    <circle cx="0" cy="-30" r="12" fill="#f59e0b"/>
    <path d="M-15 0 h30 v20 a10 10 0 0 1 -30 0 z" fill="#fbbf24"/>
    <path d="M-10 20 l-5 15 M10 20 l5 15" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Table/Props -->
  <rect x="80" y="190" width="80" height="10" fill="#475569" rx="2"/>
  <circle cx="100" cy="185" r="5" fill="#f59e0b"/>
  <circle cx="140" cy="185" r="5" fill="#ec4899"/>
  
  <!-- Lantern -->
  <path d="M20 150 l10 -20 l10 20 z" fill="#fb923c"/>
  <rect x="25" y="150" width="10" height="15" fill="#fb923c"/>
</svg>