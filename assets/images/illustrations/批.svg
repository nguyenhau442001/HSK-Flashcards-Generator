<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Box Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Warehouse Elements -->
  <g opacity="0.15">
    <!-- Steel Beams & Braces -->
    <rect x="20" y="20" width="12" height="200" fill="#cbd5e1" />
    <rect x="208" y="20" width="12" height="200" fill="#cbd5e1" />
    <line x1="32" y1="60" x2="208" y2="120" stroke="#cbd5e1" stroke-width="4" />
    <line x1="32" y1="140" x2="208" y2="80" stroke="#cbd5e1" stroke-width="4" />
    <!-- Ambient Warehouse Lights -->
    <circle cx="80" cy="20" r="16" fill="#fde047" opacity="0.3" />
    <circle cx="160" cy="20" r="16" fill="#fde047" opacity="0.3" />
  </g>

  <!-- Ambient Floor Glow for "Arrived" Cargo Batch -->
  <ellipse cx="120" cy="195" rx="80" ry="20" fill="url(#amberGlow)" />

  <!-- Floor Surface -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.8" />
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2" />

  <!-- THE CARGO BATCH (Lô hàng - A distinctive batch of stacked delivery boxes arriving) -->
  <g id="cargo-batch">
    <!-- Back stack box 1 -->
    <polygon points="90,135 125,115 145,125 110,145" fill="url(#boxTop)" />
    <polygon points="110,145 145,125 145,155 110,175" fill="url(#boxSide)" />
    <polygon points="90,135 110,145 110,175 90,165" fill="url(#boxFront)" />

    <!-- Back stack box 2 -->
    <polygon points="125,115 160,95 180,105 145,125" fill="url(#boxTop)" />
    <polygon points="145,125 180,105 180,135 145,155" fill="url(#boxSide)" />
    <polygon points="125,115 145,125 145,155 125,145" fill="url(#boxFront)" />

    <!-- Main Stacked Batch (Center-Right) -->
    <!-- Box Bottom-Left -->
    <polygon points="50,155 85,135 105,145 70,165" fill="url(#boxTop)" />
    <polygon points="70,165 105,145 105,185 70,205" fill="url(#boxSide)" />
    <polygon points="50,155 70,165 70,205 50,195" fill="url(#boxFront)" />
    <!-- Tape detail -->
    <line x1="60" y1="175" x2="60" y2="190" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Box Bottom-Right -->
    <polygon points="85,155 120,135 140,145 105,165" fill="url(#boxTop)" />
    <polygon points="105,165 140,145 140,185 105,205" fill="url(#boxSide)" />
    <polygon points="85,155 105,165 105,205 85,195" fill="url(#boxFront)" />
    <line x1="95" y1="175" x2="95" y2="190" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Box Top-Middle (The focal freshly arrived batch crate) -->
    <polygon points="65,120 100,100 120,110 85,130" fill="url(#boxTop)" />
    <polygon points="85,130 120,110 120,145 85,165" fill="url(#boxSide)" />
    <polygon points="65,120 85,130 85,165 65,155" fill="url(#boxFront)" />
    <!-- Fragile Icon / Symbol (Abstract graphical mark, no text) -->
    <circle cx="75" cy="142" r="6" fill="#ef4444" opacity="0.8" />
    <path d="M 72,142 L 78,142 M 75,139 L 75,145" stroke="#ffffff" stroke-width="1.5" />
    <line x1="75" y1="133" x2="75" y2="126" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- DELIVERY COURIER / WORKER CHARACTER (Welcoming the arrived batch) -->
  <g id="delivery-character">
    <!-- Legs & Boots -->
    <path d="M 160,195 L 160,165" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <path d="M 185,195 L 185,170" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <path d="M 154,195 L 166,195" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
    <path d="M 179,195 L 191,195" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />

    <!-- Torso (Worker Vest / Uniform) -->
    <path d="M 150,130 L 195,130 L 190,175 L 155,175 Z" fill="#2563eb" rx="4" />
    <!-- High-vis reflective stripe -->
    <path d="M 152,148 L 193,148" stroke="#fbbf24" stroke-width="6" />

    <!-- Head & Face -->
    <circle cx="172" cy="100" r="16" fill="#fcd34d" />
    <!-- Cap -->
    <path d="M 154,95 C 154,88 190,88 190,95 L 195,98 L 150,98 Z" fill="#1e3a8a" />
    <path d="M 185,97 L 202,100 L 185,103 Z" fill="#1e3a8a" />
    <!-- Happy Expression (Smiling eyes & mouth) -->
    <circle cx="167" cy="98" r="1.5" fill="#1e293b" />
    <circle cx="177" cy="98" r="1.5" fill="#1e293b" />
    <path d="M 170,105 Q 172,108 175,105" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Left Arm (Gesturing towards the arrived batch with excitement) -->
    <path d="M 152,135 L 125,125" stroke="#2563eb" stroke-width="7" stroke-linecap="round" />
    <circle cx="121" cy="123" r="4" fill="#fcd34d" />

    <!-- Right Arm (Holding clipboard checking off the arrived batch) -->
    <path d="M 193,135 L 205,150" stroke="#2563eb" stroke-width="7" stroke-linecap="round" />
    <circle cx="207" cy="153" r="4" fill="#fcd34d" />

    <!-- Clipboard Prop -->
    <rect x="200" y="140" width="16" height="20" rx="2" transform="rotate(15 200 140)" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <line x1="204" y1="146" x2="210" y2="148" stroke="#10b981" stroke-width="2" stroke-linecap="round" transform="rotate(15 200 140)" />
    <line x1="204" y1="151" x2="212" y2="153" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" transform="rotate(15 200 140)" />
  </g>

  <!-- ARRIVAL CHECKMARK / NOTIFICATION BADGE (Representing "has arrived" / delivery success context) -->
  <g transform="translate(115, 65)">
    <!-- Glowing background circle -->
    <circle cx="0" cy="0" r="22" fill="#065f46" opacity="0.8" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#34d399" stroke-width="2" />
    <!-- Checkmark icon -->
    <path d="M -8,-1 L -3,4 L 9,-7" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkles / Arrival Magic Accents -->
  <g fill="#fbbf24">
    <path d="M 45,95 L 48,102 L 55,105 L 48,108 L 45,115 L 42,108 L 35,105 L 42,102 Z" opacity="0.9" />
    <path d="M 135,75 L 137,80 L 142,82 L 137,84 L 135,89 L 133,84 L 128,82 L 133,80 Z" opacity="0.6" />
    <circle cx="95" cy="85" r="3" opacity="0.8" />
    <circle cx="35" cy="140" r="2" opacity="0.5" />
  </g>

</svg>