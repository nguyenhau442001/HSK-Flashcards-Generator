<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- The 'Cause' - A fallen vase with spilled water and a cat's paw -->
  <!-- Spilled water puddle -->
  <path d="M60 180 C 40 180, 40 210, 80 210 C 120 210, 140 190, 130 180 Z" fill="#38bdf8" opacity="0.6"/>
  
  <!-- Vase shards -->
  <path d="M70 170 L 85 170 L 80 190 Z" fill="#fb923c"/>
  <path d="M90 175 L 105 175 L 100 195 Z" fill="#fb923c"/>
  
  <!-- Vase base -->
  <ellipse cx="85" cy="185" rx="15" ry="5" fill="#f59e0b"/>
  
  <!-- Cat paw reaching in -->
  <path d="M160 140 L 180 170 L 190 165 L 170 135 Z" fill="#94a3b8"/>
  <circle cx="175" cy="168" r="4" fill="#cbd5e1"/>
  <circle cx="182" cy="165" r="3" fill="#cbd5e1"/>
  <circle cx="185" cy="160" r="3" fill="#cbd5e1"/>
  
  <!-- Magnifying glass looking at the 'cause' -->
  <circle cx="120" cy="100" r="30" fill="none" stroke="#fbbf24" stroke-width="4"/>
  <line x1="140" y1="120" x2="170" y2="150" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Light beam effect -->
  <path d="M120 100 L 100 170 L 140 170 Z" fill="#fbbf24" opacity="0.15"/>
  
  <!-- Decorative background elements -->
  <circle cx="200" cy="40" r="10" fill="#10b981" opacity="0.3"/>
  <rect x="30" y="50" width="4" height="20" rx="2" fill="#ec4899" opacity="0.4"/>
</svg>