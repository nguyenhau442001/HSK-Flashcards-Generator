<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="50" y="170" width="10" height="60" fill="#334155"/>
  <rect x="180" y="170" width="10" height="60" fill="#334155"/>
  
  <!-- Character -->
  <circle cx="120" cy="90" r="25" fill="#fde68a"/>
  <path d="M105 85 Q110 80 115 85 M125 85 Q130 80 135 85" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M110 100 Q120 105 130 100" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M95 120 C95 150 145 150 145 120" fill="#38bdf8"/>
  
  <!-- The "Special Thinking" Props -->
  <!-- A standard lightbulb vs a complex, colorful geometric construction -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="12" fill="#fb923c"/>
    <path d="M-5 -5 L5 5 M-5 5 L5 -5" stroke="#fff" stroke-width="2"/>
  </g>
  
  <g transform="translate(180, 70)">
    <polygon points="0,-15 15,10 -15,10" fill="#10b981"/>
    <circle cx="0" cy="5" r="5" fill="#ec4899"/>
    <rect x="-2" y="10" width="4" height="10" fill="#f59e0b"/>
  </g>
  
  <!-- Floating thought elements -->
  <path d="M120 60 L140 40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="145" cy="35" r="4" fill="#fbbf24"/>
  
  <path d="M120 60 L100 40" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <rect x="90" y="30" width="10" height="10" fill="#38bdf8" transform="rotate(20 95 35)"/>

  <!-- Desk items -->
  <rect x="70" y="145" width="30" height="15" rx="2" fill="#94a3b8"/>
  <circle cx="150" cy="150" r="8" fill="#ec4899"/>
</svg>