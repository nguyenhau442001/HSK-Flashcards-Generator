<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Luxury Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Velvet Red & Deep Accents -->
    <linearGradient id="velvetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Effects -->
    <radialGradient id="chandelierGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Chandelier Glow -->
  <circle cx="120" cy="80" r="90" fill="url(#chandelierGlow)" />

  <!-- Architectural Background: Wall & Floor -->
  <!-- Back Wall Panel -->
  <rect x="20" y="25" width="200" height="155" rx="8" fill="#1e293b" />
  <rect x="28" y="33" width="184" height="139" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  
  <!-- Luxury Wall Molding & Sconces -->
  <path d="M45 50 L80 50 L80 140 L45 140" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <path d="M195 50 L160 50 L160 140 L195 140" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Marble Floor -->
  <path d="M10 180 L230 180 L240 215 L0 215 Z" fill="url(#marbleGrad)" />
  <line x1="120" y1="180" x2="120" y2="215" stroke="#1e293b" stroke-width="2" opacity="0.8" />
  <line x1="60" y1="180" x2="30" y2="215" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />
  <line x1="180" y1="180" x2="210" y2="215" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />

  <!-- Baseboard Trim -->
  <rect x="10" y="174" width="220" height="6" fill="url(#goldGrad)" />

  <!-- ==================== MAIN SUBJECT: LUXURIOUS HOTEL LOBBY FURNITURE & CHANDELIER ==================== -->

  <!-- Crystal Chandelier (Top Center) -->
  <g filter="url(#shadow)">
    <!-- Main fixture -->
    <path d="M100 20 L140 20 L130 35 L110 35 Z" fill="url(#goldGrad)" />
    <!-- Tiered crystal strings & drops -->
    <path d="M105 35 Q120 50 135 35" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M95 45 Q120 65 145 45" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M85 55 Q120 80 155 55" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    
    <!-- Sparkly Crystal Pendants -->
    <circle cx="120" cy="55" r="4" fill="#fef08a" />
    <circle cx="105" cy="48" r="3" fill="#fef08a" />
    <circle cx="135" cy="48" r="3" fill="#fef08a" />
    <circle cx="92" cy="60" r="2.5" fill="#fef08a" />
    <circle cx="148" cy="60" r="2.5" fill="#fef08a" />
  </g>

  <!-- Luxurious Velvet Armchair (Right Side) -->
  <g filter="url(#shadow)">
    <!-- Chair Legs -->
    <rect x="155" y="165" width="4" height="15" fill="url(#goldGrad)" />
    <rect x="195" y="165" width="4" height="15" fill="url(#goldGrad)" />
    
    <!-- Seat Cushion -->
    <path d="M145 145 C145 140 210 140 210 145 L205 165 C205 168 150 168 150 165 Z" fill="url(#velvetGrad)" />
    <path d="M148 147 C148 145 207 145 207 147 L204 152 C204 153 151 153 151 152 Z" fill="#b91c1c" /> <!-- highlight -->

    <!-- Armrest Left -->
    <path d="M145 115 C135 115 135 150 148 155 L155 155 C148 150 148 120 152 115 Z" fill="url(#velvetGrad)" />
    <!-- Armrest Right -->
    <path d="M210 115 C220 115 220 150 207 155 L200 155 C207 150 207 120 203 115 Z" fill="#991b1b" />

    <!-- Chair Backrest -->
    <path d="M148 115 C148 85 207 85 207 115 L207 150 C207 150 148 150 148 150 Z" fill="url(#velvetGrad)" />
    <!-- Tufted Buttons on Backrest -->
    <circle cx="165" cy="110" r="2" fill="url(#goldGrad)" />
    <circle cx="187" cy="110" r="2" fill="url(#goldGrad)" />
    <circle cx="176" cy="125" r="2" fill="url(#goldGrad)" />
    <circle cx="165" cy="140" r="2" fill="url(#goldGrad)" />
    <circle cx="187" cy="140" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Golden Side Table (Center-Left) -->
  <g filter="url(#shadow)">
    <!-- Table Top -->
    <ellipse cx="95" cy="135" rx="30" ry="10" fill="url(#goldGrad)" />
    <ellipse cx="95" cy="133" rx="27" ry="8" fill="url(#goldLight)" />
    
    <!-- Table Stand/Base -->
    <path d="M92 135 L92 170 L80 175 L110 175 L98 170 Z" fill="url(#goldGrad)" />
    <ellipse cx="95" cy="175" rx="18" ry="5" fill="url(#goldGrad)" />
  </g>

  <!-- Luxury Props on Table (Champagne Ice Bucket & Flute) -->
  <g filter="url(#shadow)">
    <!-- Ice Bucket -->
    <path d="M75 115 L85 135 L105 135 L115 115 Z" fill="url(#goldGrad)" />
    <ellipse cx="95" cy="115" rx="20" ry="6" fill="#fef08a" />
    <ellipse cx="95" cy="117" rx="17" ry="4" fill="#94a3b8" /> <!-- inside liquid/ice -->
    <!-- Ice cubes sparkle -->
    <rect x="88" y="113" width="5" height="5" fill="#ffffff" rx="1" />
    <rect x="96" y="115" width="6" height="6" fill="#ffffff" rx="1" />

    <!-- Champagne Flute Glass -->
    <path d="M112 95 L116 115 L110 115 L114 95 Z" fill="#e2e8f0" opacity="0.8" />
    <ellipse cx="113" cy="95" rx="4" ry="2" fill="#ffffff" />
    <line x1="113" y1="115" x2="113" y2="132" stroke="url(#goldGrad)" stroke-width="1.5" />
    <ellipse cx="113" cy="132" rx="7" ry="2" fill="url(#goldGrad)" />
    <!-- Golden Liquid inside glass -->
    <path d="M112.5 102 L115.5 114 L110.5 114 Z" fill="#f59e0b" opacity="0.9" />
    <!-- Bubbles -->
    <circle cx="113" cy="106" r="0.75" fill="#ffffff" />
    <circle cx="114" cy="110" r="0.5" fill="#ffffff" />
  </g>

  <!-- Elegant Floor Lamp (Left Foreground) -->
  <g filter="url(#shadow)">
    <!-- Base -->
    <ellipse cx="35" cy="178" rx="12" ry="4" fill="url(#goldGrad)" />
    <!-- Pole -->
    <line x1="35" y1="178" x2="35" y2="90" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <!-- Lamp Shade -->
    <path d="M20 70 L50 70 L55 90 L15 90 Z" fill="#f8fafc" />
    <path d="M20 70 Q35 65 50 70 L55 90 Q35 85 15 90 Z" fill="#e2e8f0" />
    <!-- Warm Light Beam Downward -->
    <path d="M20 90 L50 90 L65 140 L5 140 Z" fill="#fef08a" opacity="0.12" />
  </g>

  <!-- Decorative Velvet Red Carpet Runner with Gold Border -->
  <g>
    <path d="M90 180 L150 180 L175 220 L65 220 Z" fill="url(#velvetGrad)" />
    <!-- Gold Borders on Carpet -->
    <path d="M90 180 L65 220" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M150 180 L175 220" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Subtle pattern lines -->
    <line x1="100" y1="190" x2="140" y2="190" stroke="#b91c1c" stroke-width="2" opacity="0.5" />
    <line x1="90" y1="205" x2="150" y2="205" stroke="#b91c1c" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Sparkles & Atmosphere Dust -->
  <g fill="#fef08a">
    <circle cx="110" cy="70" r="1.5" opacity="0.8" />
    <circle cx="130" cy="85" r="1" opacity="0.6" />
    <circle cx="75" cy="95" r="1.5" opacity="0.9" />
    <circle cx="155" cy="75" r="2" opacity="0.7" />
    <circle cx="100" cy="100" r="1" opacity="0.5" />
  </g>
</svg>