<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  
  <!-- Queue Line/Barrier -->
  <path d="M40 180 L200 180" stroke="#475569" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Person 1 -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M8 40 Q20 30 32 40 L30 80 L10 80 Z" fill="#38bdf8"/>
    <rect x="15" y="80" width="10" height="30" fill="#f59e0b"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(100, 130)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M8 40 Q20 30 32 40 L30 80 L10 80 Z" fill="#10b981"/>
    <rect x="15" y="80" width="10" height="20" fill="#f59e0b"/>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(140, 140)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M8 40 Q20 30 32 40 L30 80 L10 80 Z" fill="#ec4899"/>
