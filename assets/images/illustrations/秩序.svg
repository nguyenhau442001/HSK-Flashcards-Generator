  </g>

  <!-- Signage Pole -->
  <rect x="180" y="100" width="4" height="80" fill="#94a3b8"/>
  <circle cx="182" cy="90" r="15" fill="#fb923c"/>
  <path d="M175 90 L189 90 M182 83 L182 97" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
