<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Rain streaks -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.4">
    <line x1="20" y1="0" x2="20" y2="240"/>
    <line x1="60" y1="0" x2="60" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="240"/>
    <line x1="140" y1="0" x2="140" y2="240"/>
    <line x1="180" y1="0" x2="180" y2="240"/>
    <line x1="220" y1="0" x2="220" y2="240"/>
  </g>

  <!-- Character -->
  <g transform="translate(120, 140)">
    <!-- Body -->
    <path d="M-30 80 Q-30 20 0 20 T30 80 L30 90 L-30 90 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 -5 Q-25 -30 0 -30 T25 -5 L25 0 Q0 -10 -25 0 Z" fill="#475569"/>
    <!-- Wet clothes effect (darker patches) -->
    <path d="M-20 30 Q-10 25 0 30 T20 30 L15 60 L-15 60 Z" fill="#ea580c"/>
    <!-- Arms -->
    <path d="M-30 30 L-50 50 M30 30 L50 50" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="-20" y="90" width="10" height="10" fill="#334155"/>
    <rect x="10" y="90" width="10" height="10" fill="#334155"/>
  </g>

  <!-- Puddle -->
  <ellipse cx="120" cy="220" rx="80" ry="15" fill="#0f172a" opacity="0.6"/>
  
  <!-- Droplets on character -->
  <circle cx="105" cy="150" r="2" fill="#38bdf8"/>
  <circle cx="135" cy="160" r="2" fill="#38bdf8"/>
  <circle cx="115" cy="180" r="2" fill="#38bdf8"/>
</svg>