<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <circle cx="180" cy="60" r="25" fill="#fbbf24" opacity="0.8"/>
  <path d="M40 180 L60 120 L80 180 Z" fill="#475569"/>
  <path d="M160 180 L190 100 L220 180 Z" fill="#475569"/>
  
  <!-- Bus Stop Sign -->
  <rect x="190" y="80" width="4" height="100" fill="#94a3b8"/>
  <circle cx="192" cy="75" r="12" fill="#ec4899"/>
  <path d="M188 75 L196 75 M192 71 L192 79" stroke="#fff" stroke-width="2"/>
  
  <!-- Clock Icon Representation -->
  <circle cx="40" cy="50" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M40 45 L40 50 L45 50" stroke="#38bdf8" stroke-width="2" fill="none"/>
  
  <!-- Character: Walking -->
  <g transform="translate(80, 130)">
    <!-- Legs -->
    <path d="M0 0 L5 40 M20 0 L15 40" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
