    <path d="M25 -20 L35 -10" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative Ground Details -->
  <circle cx="20" cy="200" r="2" fill="#64748b"/>
  <circle cx="100" cy="210" r="3" fill="#64748b"/>
  <circle cx="200" cy="195" r="2" fill="#64748b"/>
