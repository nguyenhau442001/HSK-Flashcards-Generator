<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Warehouse Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2"/>

  <!-- Stack of Boxes (The Batch) -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="60" height="60" fill="#fbbf24" rx="4"/>
    <rect x="5" y="5" width="50" height="50" fill="#f59e0b" rx="2"/>
    <rect x="0" y="-60" width="60" height="60" fill="#fbbf24" rx="4"/>
    <rect x="5" y="-55" width="50" height="50" fill="#f59e0b" rx="2"/>
    <path d="M15 20h30M15 30h30M15 -40h30M15 -30h30" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Delivery Person -->
  <g transform="translate(40, 100)">
    <!-- Body -->
    <path d="M20 120 L20 80 Q20 60 40 60 L60 60 Q80 60 80 80 L80 120" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="50" cy="50" r="20" fill="#fde68a"/>
    <!-- Cap -->
    <path d="M35 40 L65 40 L70 30 L40 30 Z" fill="#ec4899"/>
    <!-- Arm pointing -->
    <path d="M60 70 L90 80" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Clipboard/Manifest -->
  <rect x="80" y="140" width="30" height="40" fill="#e2e8f0" rx="2"/>
  <line x1="85" y1="150" x2="105" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="85" y1="160" x2="105" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="85" y1="170" x2="95" y2="170" stroke="#94a3b8" stroke-width="2"/>

  <!-- Ambient light effect -->
  <circle cx="170" cy="80" r="40" fill="#fbbf24" opacity="0.1"/>
</svg>