  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- TV Stand -->
  <rect x="60" y="165" width="120" height="15" rx="2" fill="#334155"/>
  <rect x="70" y="180" width="10" height="20" fill="#475569"/>
  <rect x="160" y="180" width="10" height="20" fill="#475569"/>
  
  <!-- TV Frame -->
