<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Book Cover Gradients -->
    <linearGradient id="bookCover1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bookCover2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light from Lamp -->
  <circle cx="120" cy="80" r="140" fill="url(#lampGlow)"/>

  <!-- Background Interior Elements -->
  <!-- Window showing night sky -->
  <g transform="translate(160, 20)">
    <rect width="50" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="4" y="4" width="42" height="62" rx="2" fill="url(#nightSky)"/>
    <!-- Window pane crosses -->
    <line x1="25" y1="4" x2="25" y2="66" stroke="#334155" stroke-width="2"/>
    <line x1="4" y1="35" x2="46" y2="35" stroke="#334155" stroke-width="2"/>
    <!-- Tiny stars outside -->
    <circle cx="12" cy="15" r="1" fill="#cbd5e1"/>
    <circle cx="38" cy="22" r="1.5" fill="#f8fafc"/>
    <circle cx="20" cy="50" r="1" fill="#94a3b8"/>
  </g>

  <!-- Bookshelf on wall -->
  <g transform="translate(25, 25)">
    <rect width="70" height="8" rx="2" fill="#475569"/>
    <!-- Books on shelf -->
    <rect x="10" y="-22" width="8" height="22" rx="1" fill="#ec4899"/>
    <rect x="20" y="-26" width="10" height="26" rx="1" fill="#10b981"/>
    <rect x="32" y="-18" width="7" height="18" rx="1" fill="#f59e0b"/>
    <rect x="41" y="-24" width="12" height="24" rx="1" fill="#6366f1"/>
    <path d="M 58,-15 L 63,-5 L 53,-5 Z" fill="#38bdf8"/>
  </g>

  <!-- Study Desk -->
  <rect x="20" y="165" width="200" height="12" rx="3" fill="#334155" filter="url(#softShadow)"/>
  <rect x="35" y="177" width="12" height="48" rx="2" fill="#1e293b"/>
  <rect x="193" y="177" width="12" height="48" rx="2" fill="#1e293b"/>

  <!-- Desk Props (Lamp, Small Plant, Notebooks) -->
  <!-- Desk Lamp -->
  <path d="M 200,165 L 205,130 L 215,130 L 220,165 Z" fill="#64748b"/>
  <path d="M 210,130 L 200,90 L 225,90 Z" fill="#cbd5e1"/>
  <ellipse cx="212.5" cy="90" rx="12.5" ry="6" fill="#f59e0b"/>

  <!-- Small Plant in Pot -->
  <path d="M 40,165 L 45,145 L 55,145 L 60,165 Z" fill="#cbd5e1"/>
  <path d="M 50,145 Q 40,130 35,120 Q 50,135 50,145 Z" fill="#10b981"/>
  <path d="M 50,145 Q 60,125 70,115 Q 55,135 50,145 Z" fill="#34d399"/>
  <path d="M 50,145 Q 50,120 52,110 Q 48,130 50,145 Z" fill="#059669"/>

  <!-- CHARACTER 1: Person offering/holding out the book (Right side) -->
  <g id="character-lender" transform="translate(140, 75)">
    <!-- Body / Torso -->
    <path d="M 30,50 Q 30,35 45,35 L 65,35 Q 80,35 80,50 L 90,95 L 20,95 Z" fill="#3b82f6" filter="url(#softShadow)"/>
    <!-- Head -->
    <circle cx="55" cy="18" r="16" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 39,15 Q 40,2 55,2 Q 70,2 72,15 Q 75,25 65,25 Q 55,20 45,25 Q 37,25 39,15 Z" fill="#1e293b"/>
    <!-- Eye & Smile -->
    <circle cx="61" cy="17" r="1.5" fill="#1e293b"/>
    <path d="M 60,23 Q 63,25 66,23" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Arm reaching forward (Giving action) -->
    <!-- Back arm -->
    <path d="M 35,45 L 10,65 L 5,60" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front arm holding book -->
    <path d="M 75,45 L 95,62 L 90,72" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="89" cy="74" r="5" fill="#fed7aa"/>
  </g>

  <!-- CHARACTER 2: Person receiving/asking for the book (Left side - Leaning forward eagerly) -->
  <g id="character-borrower" transform="translate(40, 70)">
    <!-- Body / Torso (Leaning forward) -->
    <path d="M 30,55 Q 35,40 50,45 L 75,55 L 70,100 L 25,95 Z" fill="#f43f5e" filter="url(#softShadow)"/>
    <!-- Head -->
    <circle cx="65" cy="22" r="16" fill="#ffedd5"/>
    <!-- Hair (Ponytail style) -->
    <path d="M 50,15 Q 55,2 70,5 Q 85,8 82,18 Q 88,12 85,5 Q 70, -2 52,5 Q 48,10 50,15 Z" fill="#7c2d12"/>
    <circle cx="85" cy="15" r="5" fill="#7c2d12"/>
    <!-- Face: Bright eager expression -->
    <circle cx="71" cy="21" r="1.5" fill="#1e293b"/>
    <path d="M 70,27 Q 73,30 76,27" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Rosy cheek -->
    <circle cx="73" cy="24" r="3" fill="#fda4af" opacity="0.6"/>

    <!-- Arms reaching out to receive -->
    <!-- Back arm -->
    <path d="M 40,55 L 20,75 L 30,80" fill="none" stroke="#be123c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front arm outstretched -->
    <path d="M 65,60 L 92,68" fill="none" stroke="#f43f5e" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="95" cy="69" r="5" fill="#ffedd5"/>
  </g>

  <!-- CENTRAL OBJECT: The Book being handed over / borrowed -->
  <!-- Positioned precisely between both characters' hands to emphasize the action of 'borrowing/lending' -->
  <g id="shared-book" transform="translate(112, 130) rotate(-15)" filter="url(#softShadow)">
    <!-- Book thickness/pages -->
    <rect x="-2" y="-2" width="34" height="24" rx="2" fill="#e2e8f0"/>
    <!-- Book Cover -->
    <rect x="0" y="0" width="30" height="20" rx="2" fill="url(#bookCover1)"/>
    <!-- Spine detail -->
    <rect x="0" y="0" width="5" height="20" fill="#0284c7"/>
    <!-- Cover decorative stripe -->
    <rect x="8" y="4" width="16" height="3" rx="1.5" fill="#bae6fd"/>
    <rect x="8" y="10" width="10" height="2" rx="1" fill="#bae6fd"/>
  </g>

  <!-- Motion lines / Interaction accent (Gentle floating sparkles indicating a successful friendly exchange) -->
  <g transform="translate(120, 115)">
    <path d="M 0,-10 L 2,-5 L 7,-3 L 2,-1 L 0,4 L -2,-1 L -7,-3 L -2,-5 Z" fill="#fbbf24" opacity="0.8"/>
  </g>
  <g transform="translate(100, 150)">
    <path d="M 0,-6 L 1,-3 L 4,-2 L 1,-1 L 0,2 L -1,-1 L -4,-2 L -1,-3 Z" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- Additional tabletop items for depth -->
  <g transform="translate(75, 160)">
    <!-- Secondary stacked book -->
    <rect x="0" y="5" width="36" height="8" rx="2" fill="url(#bookCover2)" filter="url(#softShadow)"/>
    <rect x="2" y="0" width="32" height="6" rx="2" fill="#38bdf8" filter="url(#softShadow)"/>
    <!-- Coffee mug -->
    <path d="M 45,0 L 42,13 L 56,13 L 53,0 Z" fill="#f8fafc"/>
    <path d="M 53,3 Q 59,3 59,6.5 Q 59,10 53,10" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="49" cy="0" rx="3.5" ry="1" fill="#cbd5e1"/>
    <!-- Steam -->
    <path d="M 47,-3 Q 49,-7 46,-10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>