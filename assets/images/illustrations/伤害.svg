<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table/Surface -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#334155"/>
  
  <!-- Ashtray and Cigarette -->
  <path d="M100 160 L140 160 L135 175 L105 175 Z" fill="#475569"/>
  <rect x="120" y="145" width="4" height="20" rx="2" fill="#e2e8f0"/>
  <circle cx="122" cy="144" r="3" fill="#fb923c"/>
  
  <!-- Character Body -->
  <path d="M80 240 Q80 180 120 180 T160 240" fill="#38bdf8"/>
  
  <!-- Arms and Hands -->
  <path d="M90 190 L70 150" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 190 L170 150" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="120" cy="130" r="30" fill="#fde68a"/>
  
  <!-- Facial Expression (Coughing/Distress) -->
  <path d="M105 125 Q110 120 115 125" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M125 125 Q130 120 135 125" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M110 145 Q120 155 130 145" stroke="#ec4899" stroke-width="3" fill="none"/>
  
  <!-- Smoke Effect -->
  <path d="M122 140 Q130 120 120 100 Q110 80 125 70" stroke="#94a3b8" stroke-width="4" fill="none" stroke-opacity="0.6"/>
  <circle cx="125" cy="70" r="8" fill="#94a3b8" opacity="0.4"/>
  
  <!-- Visual representation of harm (Internal glow) -->
  <circle cx="120" cy="200" r="20" fill="#ec4899" opacity="0.2"/>
  <path d="M110 190 L130 210 M130 190 L110 210" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
</svg>