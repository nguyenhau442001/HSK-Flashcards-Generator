<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Window Frame -->
  <rect x="40" y="40" width="160" height="160" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- Stormy Background (Outside) -->
  <path d="M42 42h156v156H42z" fill="#1e293b"/>
  <path d="M60 80c10-20 30-20 40 0s30 20 40 0 30-20 40 0" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Typhoon/Wind Effect (Weakening) -->
  <path d="M180 100c-20 0-40 20-60 20s-40-20-60-20" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M170 130c-20 0-40 20-60 20s-40-20-60-20" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Person looking through window -->
  <g transform="translate(120, 160)">
    <circle cx="0" cy="-20" r="15" fill="#fbbf24"/>
    <path d="M-5 -25h2M5 -25h2" stroke="#0f172a" stroke-width="2"/>
    <path d="M-5 -15h10" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <rect x="-20" y="-5" width="40" height="40" rx="10" fill="#fb923c"/>
  </g>
  
  <!-- Meteorological Monitor/Screen inside -->
  <rect x="50" y="150" width="50" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <path d="M55 175c10-10 20-5 30-15" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="85" cy="160" r="3" fill="#ec4899"/>
  
  <!-- Decorative elements -->
  <path d="M200 40v160" stroke="#475569" stroke-width="2"/>
  <path d="M40 120h160" stroke="#475569" stroke-width="2"/>
</svg>