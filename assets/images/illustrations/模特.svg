<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Runway Floor Gradient -->
    <linearGradient id="runway-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Outfit Gradient (Haute Couture) -->
    <linearGradient id="dress-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    
    <!-- Gold Trim Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Studio / Runway Environment -->
  <!-- Background curtain folds -->
  <path d="M0 0 L40 180 L0 180 Z" fill="#1e293b" opacity="0.6" />
  <path d="M240 0 L200 180 L240 180 Z" fill="#1e293b" opacity="0.6" />
  <path d="M30 0 L90 180 L0 180 Z" fill="#334155" opacity="0.3" />
  <path d="M210 0 L150 180 L240 180 Z" fill="#334155" opacity="0.3" />

  <!-- Stage / Runway Floor -->
  <polygon points="60,180 180,180 220,240 20,240" fill="#0f172a" />
  <polygon points="70,180 170,180 205,240 35,240" fill="url(#runway-grad)" />
  
  <!-- Runway Light Strips -->
  <line x1="85" y1="180" x2="55" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  <line x1="155" y1="180" x2="185" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.8" />

  <!-- Spotlight Cone from Ceiling -->
  <polygon points="120,0 20,220 220,220" fill="url(#spotlight)" style="mix-blend-mode: screen;" />

  <!-- Camera Flash Effect (Background Bokeh / Studio lights) -->
  <circle cx="50" cy="70" r="3" fill="#ffffff" opacity="0.6" />
  <circle cx="190" cy="50" r="4" fill="#fbbf24" opacity="0.7" />
  <circle cx="210" cy="90" r="2" fill="#ffffff" opacity="0.5" />
  <circle cx="30" cy="110" r="3.5" fill="#38bdf8" opacity="0.6" />

  <!-- FASHION MODEL (Character) -->
  <g transform="translate(0, 5)">
    <!-- Shadow beneath model -->
    <ellipse cx="120" cy="178" rx="22" ry="6" fill="#020617" opacity="0.7" />

    <!-- Legs (Dynamic walking pose) -->
    <!-- Back Leg -->
    <path d="M112 135 L102 165 L108 175" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Back Shoe (High Heel) -->
    <path d="M104 175 L112 176 L108 172 Z" fill="#0f172a" />

    <!-- Front Leg (Crossing over for runway stride) -->
    <path d="M125 135 L138 160 L132 174" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Shoe (High Heel) -->
    <path d="M128 174 L138 177 L134 171 Z" fill="#0f172a" />

    <!-- Designer Haute Couture Dress / Outfit -->
    <!-- Asymmetrical Flowing Dress Shape -->
    <path d="M110 90 L132 95 L145 145 L130 170 L110 160 L98 120 Z" fill="url(#dress-grad)" />
    <!-- Dress Accents / Modern Cut -->
    <path d="M110 90 L125 110 L140 145" stroke="url(#gold-grad)" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M98 120 L115 135 L130 170" stroke="#f472b6" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Torso / Upper Body -->
    <path d="M106 70 L134 70 L130 95 L110 95 Z" fill="#cbd5e1" />

    <!-- Arms (Graceful runway pose) -->
    <!-- Back Arm -->
    <path d="M108 72 L90 95 L98 105" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Arm -->
    <path d="M132 72 L148 90 L140 102" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Hands -->
    <circle cx="98" cy="107" r="2.5" fill="#fbcfe8" />
    <circle cx="140" cy="104" r="2.5" fill="#fbcfe8" />

    <!-- Neck -->
    <rect x="116" y="60" width="8" height="12" rx="3" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="120" cy="48" r="16" fill="#fbcfe8" />

    <!-- Stylish Hair (Chic Bob / Updo) -->
    <path d="M104 46 C104 32, 136 32, 136 46 C136 55, 130 65, 128 65 L124 50 L116 50 L112 65 C110 65, 104 55, 104 46 Z" fill="#0f172a" />
    <!-- Hair Highlight -->
    <path d="M112 36 Q120 34 128 38" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Confident Face Profile -->
    <!-- Elegant Eye (Closed/Confident look) -->
    <path d="M124 46 Q128 48 132 46" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Subtle Chic Lips -->
    <path d="M127 55 Q130 57 133 55" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- High Fashion Cheekbone Contour -->
    <path d="M125 50 Q128 52 131 49" stroke="#fda4af" stroke-width="1" fill="none" opacity="0.6" />
  </g>

  <!-- Foreground Studio Elements / Photography gear hints -->
  <!-- Camera Lens framing silhouette (bottom right corner) -->
  <path d="M210 240 C210 215, 225 200, 240 200" stroke="#334155" stroke-width="4" fill="none" opacity="0.5" />
  <circle cx="240" cy="240" r="30" stroke="#334155" stroke-width="2" fill="none" opacity="0.3" />

  <!-- Sparkles / Glamour accents -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M50 80 Q50 90 40 90 Q50 90 50 100 Q50 90 60 90 Q50 90 50 80" opacity="0.9" />
    <!-- Star 2 -->
    <path d="M190 120 Q190 126 184 126 Q190 126 190 132 Q190 126 196 126 Q190 126 190 120" opacity="0.7" />
    <!-- Star 3 -->
    <path d="M75 140 Q75 144 71 144 Q75 144 75 148 Q75 144 79 144 Q75 144 75 140" opacity="0.5" />
  </g>

  <!-- Ambient rim lighting on frame edges -->
  <rect x="0.5" y="0.5" width="239" height="239" rx="23.5" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.2" />
</svg>