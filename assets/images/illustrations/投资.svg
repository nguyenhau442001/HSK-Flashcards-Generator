<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Laptop Screen -->
  <rect x="50" y="60" width="140" height="90" rx="6" fill="#334155"/>
  <rect x="55" y="65" width="130" height="80" rx="3" fill="#0f172a"/>
  
  <!-- Stock Graph Line -->
  <path d="M65 120 L90 100 L115 110 L140 75 L175 85" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="175" cy="85" r="4" fill="#10b981"/>
  
  <!-- Laptop Base -->
  <path d="M40 150 L200 150 L210 165 L30 165 Z" fill="#475569"/>
  
  <!-- Coins/Investment Props -->
  <circle cx="190" cy="190" r="15" fill="#f59e0b"/>
  <circle cx="190" cy="190" r="10" fill="#fbbf24"/>
  <circle cx="210" cy="205" r="12" fill="#fb923c"/>
  <circle cx="210" cy="205" r="8" fill="#f59e0b"/>
  
  <!-- Decorative elements -->
  <path d="M30 190 L50 190 M40 180 L40 200" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="60" r="8" fill="#ec4899" opacity="0.8"/>
  <circle cx="40" cy="80" r="5" fill="#38bdf8" opacity="0.6"/>
  
  <!-- Growth Arrow -->
  <path d="M200 120 L220 100 L220 115 M220 100 L205 100" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>