<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Memory Photo Glow -->
    <radialGradient id="memory-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Wallpaper / Room Environment Details -->
  <!-- Bookshelf Background -->
  <g opacity="0.3">
    <rect x="25" y="40" width="40" height="90" rx="2" fill="#334155"/>
    <rect x="30" y="55" width="30" height="6" fill="#64748b"/>
    <rect x="30" y="75" width="25" height="6" fill="#475569"/>
    <rect x="30" y="95" width="28" height="6" fill="#64748b"/>

    <rect x="175" y="40" width="40" height="90" rx="2" fill="#334155"/>
    <rect x="180" y="60" width="28" height="6" fill="#475569"/>
    <rect x="180" y="85" width="30" height="6" fill="#64748b"/>
  </g>

  <!-- Wooden Table/Desk Surface -->
  <path d="M 10 180 L 230 180 L 235 220 L 5 220 Z" fill="#0f172a"/>
  <rect x="10" y="175" width="220" height="8" rx="2" fill="#334155"/>
  <rect x="15" y="183" width="210" height="37" fill="#1e293b"/>

  <!-- Warm Desk Lamp (Left) -->
  <circle cx="45" cy="115" r="35" fill="url(#lamp-glow)"/>
  <path d="M 45 175 L 45 145" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 35 145 L 55 145 L 60 135 L 30 135 Z" fill="#fb923c"/>
  <ellipse cx="45" cy="135" rx="15" ry="4" fill="#f59e0b"/>

  <!-- Foreground: Open Wooden Memory Box containing Photos (representing a lifetime of memories) -->
  <g filter="url(#soft-shadow)">
    <!-- Box Base -->
    <path d="M 70 170 L 170 170 L 160 200 L 80 200 Z" fill="#78350f"/>
    <!-- Box Inner -->
    <path d="M 75 173 L 165 173 L 157 197 L 83 197 Z" fill="#451a03"/>

    <!-- Inside the box: Glowing scattered photographs spanning a lifetime -->
    <!-- Photo 1: Childhood/Youth (Sepia/Warm) -->
    <g transform="translate(90, 155) rotate(-12)">
      <rect width="32" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <rect x="4" y="4" width="24" height="16" fill="#fbbf24" opacity="0.6"/>
      <circle cx="16" cy="10" r="4" fill="#b45309"/>
      <path d="M 10 20 Q 16 15 22 20" stroke="#b45309" stroke-width="2" fill="none"/>
    </g>

    <!-- Photo 2: Adulthood/Family (Teal/Vibrant) -->
    <g transform="translate(115, 150) rotate(8)">
      <rect width="32" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="4" y="4" width="24" height="16" fill="#38bdf8" opacity="0.5"/>
      <circle cx="13" cy="9" r="3" fill="#0369a1"/>
      <circle cx="19" cy="9" r="3" fill="#0369a1"/>
      <path d="M 12 17 Q 16 13 20 17" stroke="#0369a1" stroke-width="2" fill="none"/>
    </g>

    <!-- Photo 3: Later Years / Sunset (Golden/Amber) -->
    <g transform="translate(100, 163) rotate(35)">
      <rect width="28" height="22" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
      <rect x="3" y="3" width="22" height="14" fill="#fdba74" opacity="0.6"/>
      <path d="M 14 6 L 14 12 M 11 9 L 17 9" stroke="#c2410c" stroke-width="1.5"/>
    </g>
    
    <!-- Magical Memory Glow from the Box -->
    <ellipse cx="120" cy="175" rx="45" ry="15" fill="url(#memory-glow)" opacity="0.8"/>
  </g>

  <!-- Elderly Man Character (Reflecting on his lifetime) -->
  <g transform="translate(125, 65)" filter="url(#soft-shadow)">
    <!-- Body / Torso (Sitting behind desk, leaning forward slightly) -->
    <path d="M 20 80 Q 25 60 50 60 Q 75 60 80 80 L 95 115 L 5 115 Z" fill="#1e40af"/>
    <!-- Shirt Collar / Tie -->
    <path d="M 40 60 L 50 75 L 60 60 Z" fill="#ffffff"/>
    <polygon points="48,72 52,72 53,95 47,95" fill="#ef4444"/>

    <!-- Head & Face -->
    <!-- Neck -->
    <rect x="42" y="48" width="16" height="15" rx="6" fill="#fcd34d"/>
    <!-- Head Shape -->
    <ellipse cx="50" cy="38" rx="20" ry="24" fill="#fde047"/>

    <!-- Gentle Wrinkles / Wise Expression -->
    <path d="M 38 28 Q 50 31 62 28" stroke="#d97706" stroke-width="1" fill="none" opacity="0.5"/>
    
    <!-- White Hair Sides / Bald Top -->
    <path d="M 30 35 Q 30 15 50 15 Q 70 15 70 35 Q 70 42 68 45 Q 60 30 40 30 Q 32 30 30 35 Z" fill="#f1f5f9"/>

    <!-- Gentle Smiling Eyes with Glasses -->
    <!-- Glasses Frame -->
    <circle cx="41" cy="36" r="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="59" cy="36" r="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="47" y1="36" x2="53" y2="36" stroke="#64748b" stroke-width="1.5"/>
    <!-- Eyes (Crescent closed happy eyes) -->
    <path d="M 38 36 Q 41 39 44 36" stroke="#451a03" stroke-width="1.5" fill="none"/>
    <path d="M 56 36 Q 59 39 62 36" stroke="#451a03" stroke-width="1.5" fill="none"/>

    <!-- Gentle Smile -->
    <path d="M 45 47 Q 50 51 55 47" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Warm Sweater / Cardigan over shirt -->
    <path d="M 22 80 Q 20 60 38 55 L 35 115 L 10 115 Z" fill="#3b82f6"/>
    <path d="M 78 80 Q 80 60 62 55 L 65 115 L 90 115 Z" fill="#3b82f6"/>

    <!-- Arms & Hands resting gently near the memory box -->
    <!-- Left Arm -->
    <path d="M 22 80 Q 5 95 -15 110" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Left Hand -->
    <circle cx="-18" cy="112" r="6" fill="#fcd34d"/>

    <!-- Right Arm (reaching toward the box) -->
    <path d="M 78 80 Q 88 95 65 112" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Right Hand touching photo -->
    <circle cx="60" cy="113" r="6" fill="#fcd34d"/>
  </g>

  <!-- Ambient Floating Sparkles / Memory Particles -->
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="75" cy="120" r="2.5"/>
    <circle cx="165" cy="110" r="3"/>
    <circle cx="185" cy="140" r="2"/>
    <circle cx="65" cy="145" r="1.5"/>
  </g>
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="145" cy="130" r="2"/>
    <circle cx="85" cy="135" r="2.5"/>
    <circle cx="130" cy="125" r="1.5"/>
  </g>
</svg>