<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Car (The Used Car) -->
  <g transform="translate(110, 130)">
    <path d="M10 40 L90 40 L85 15 L60 15 L50 0 L20 0 L10 15 Z" fill="#fb923c"/>
    <rect x="25" y="5" width="20" height="10" fill="#38bdf8" opacity="0.6"/>
    <circle cx="25" cy="45" r="8" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="75" cy="45" r="8" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <!-- Scratches/Used look -->
    <path d="M15 25 L25 35" stroke="#1e293b" stroke-width="1"/>
    <path d="M80 20 L70 30" stroke="#1e293b" stroke-width="1"/>
  </g>
  
  <!-- Character (The Buyer) -->
  <g transform="translate(40, 110)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 20 Q20 30 30 20" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="10" y="35" width="20" height="40" rx="5" fill="#ec4899"/>
    <rect x="5" y="40" width="10" height="30" rx="3" fill="#ec4899"/>
    <rect x="25" y="40" width="10" height="30" rx="3" fill="#ec4899"/>
    <!-- Hand shaking -->
    <path d="M35 50 L55 50" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Seller -->
  <g transform="translate(160, 110)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 20 Q20 30 30 20" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="10" y="35" width="20" height="40" rx="5" fill="#10b981"/>
    <path d="M15 50 L-5 50" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Context elements -->
  <circle cx="200" cy="40" r="25" fill="#f59e0b" opacity="0.2"/>
  <path d="M10 190 L230 190" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
</svg>