<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Lightbulb (The Idea) -->
  <g transform="translate(120, 110)">
    <path d="M-25 -20 C-25 -45 -10 -60 0 -60 C10 -60 25 -45 25 -20 C25 -5 10 5 10 15 L-10 15 C-10 5 -25 -5 -25 -20 Z" fill="#f59e0b"/>
