    <path d="M-12 25 L12 25 M-8 32 L8 32" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <!-- Glow effect -->
    <circle cx="0" cy="-20" r="40" fill="#f59e0b" opacity="0.1"/>
  </g>
  
  <!-- Character head (The thinker) -->
  <path d="M60 200 C60 160 80 140 120 140 C160 140 180 160 180 200" fill="#38bdf8" opacity="0.3"/>
  <circle cx="90" cy="165" r="5" fill="#f8fafc"/>
  <circle cx="150" cy="165" r="5" fill="#f8fafc"/>
  
  <!-- Floating Sparks/Action -->
  <circle cx="170" cy="80" r="4" fill="#10b981"/>
  <circle cx="190" cy="100" r="6" fill="#ec4899"/>
  <circle cx="50" cy="90" r="3" fill="#38bdf8"/>
  
  <!-- Desk Props -->
  <rect x="20" y="190" width="40" height="30" rx="5" fill="#334155"/>
  <rect x="180" y="195" width="30" height="20" rx="5" fill="#475569"/>
  <path d="M190 195 L190 180 L210 180 L210 195" stroke="#94a3b8" stroke-width="2" fill="none"/>
</svg>