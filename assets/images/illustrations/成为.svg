<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glow Gradient for Magical Transition -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Medical/Doctor Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Pediatric/Growth Stethoscope Gradient -->
    <linearGradient id="stethGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background elements: Hospital room / Clinic atmosphere -->
  <g opacity="0.15">
    <!-- Window frame looking out at stars/future -->
    <rect x="175" y="25" width="40" height="60" rx="4" fill="none" stroke="#38bdf8" stroke-width="2" />
    <line x1="195" y1="25" x2="195" y2="85" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="175" y1="55" x2="215" y2="55" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Medical Chart board on wall -->
    <rect x="25" y="30" width="30" height="40" rx="3" fill="#64748b" />
    <rect x="29" y="36" width="22" height="4" rx="1" fill="#cbd5e1" />
    <rect x="29" y="44" width="16" height="3" rx="1" fill="#cbd5e1" />
    <rect x="29" y="50" width="20" height="3" rx="1" fill="#cbd5e1" />
    <circle cx="40" cy="62" r="4" fill="#10b981" />
  </g>

  <!-- Central magical transformation atmosphere -->
  <circle cx="120" cy="130" r="85" fill="url(#glowGrad)" />

  <!-- Sparkles & Transformation Energy Particles -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M75,65 Q75,75 65,75 Q75,75 75,85 Q75,75 85,75 Q75,75 75,65" opacity="0.9" />
    <!-- Star 2 -->
    <path d="M165,85 Q165,92 158,92 Q165,92 165,99 Q165,92 172,92 Q165,92 165,85" opacity="0.7" />
    <!-- Star 3 -->
    <path d="M90,180 Q90,186 84,186 Q90,186 90,192 Q90,186 96,186 Q90,186 90,180" opacity="0.8" />
    <circle cx="150" cy="170" r="2.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="80" cy="110" r="2" fill="#10b981" opacity="0.8" />
    <circle cx="160" cy="120" r="3" fill="#fb923c" opacity="0.6" />
  </g>

  <!-- Floor/Surface for grounding the scene -->
  <path d="M 20 210 Q 120 220 220 210 L 225 225 Q 120 235 15 225 Z" fill="#0f172a" opacity="0.8" />
  <ellipse cx="120" cy="210" rx="90" ry="8" fill="#334155" opacity="0.4" />

  <!-- MAIN SCENE: "Growing up to become a doctor" -->
  <!-- Left Side: Past Self / Young Dreamer (Child silhouette with graduation/future glowing aura) -->
  <g transform="translate(0, 5)">
    <!-- Little Girl / Young self representation -->
    <!-- Head -->
    <circle cx="75" cy="135" r="14" fill="#fed7aa" />
    <!-- Hair pigtails -->
    <path d="M 61 135 C 55 125 50 135 55 142" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round" />
    <path d="M 89 135 C 95 125 100 135 95 142" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round" />
    <path d="M 65 126 C 75 120 85 126 89 132 C 80 130 70 130 65 126 Z" fill="#9a3412" />
    <!-- Child Body / Yellow hoodie/shirt -->
    <path d="M 62 150 Q 75 145 88 150 L 92 180 Q 75 185 58 180 Z" fill="#fbbf24" />
    <!-- Cute toy stethoscope necklace hint on kid -->
    <path d="M 70 153 Q 75 160 80 153" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Arrow of Time / Transformation arc with floating medical symbols representing 'becoming' -->
  <g>
    <!-- Dynamic curved flow line -->
    <path d="M 90 120 Q 120 80 155 115" fill="none" stroke="url(#badgeGrad)" stroke-width="4" stroke-dasharray="6,4" stroke-linecap="round" />
    <polygon points="158,110 162,122 150,119" fill="#38bdf8" />
  </g>

  <!-- Right Side: Future Self / Professional Doctor (Main Focal Point) -->
  <g transform="translate(10, 0)">
    <!-- Doctor Character Body -->
    <!-- White Lab Coat Body -->
    <path d="M 125 120 L 155 120 L 165 200 L 115 200 Z" fill="#f8fafc" />
    <!-- Lab Coat lapels & opening -->
    <path d="M 140 120 L 140 190" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <polygon points="140,120 130,140 140,150" fill="#e2e8f0" />
    <polygon points="140,120 150,140 140,150" fill="#e2e8f0" />
    
    <!-- Teal Scrubs Top underneath -->
    <path d="M 127 120 L 153 120 L 150 150 L 130 150 Z" fill="#0d9488" />

    <!-- Head & Hair -->
    <circle cx="140" cy="95" r="18" fill="#fbcfe8" />
    <!-- Professional Hair Bun / Style -->
    <path d="M 122 92 C 120 80 135 72 145 78 C 155 72 162 82 158 95 C 162 90 160 82 152 80 C 145 76 132 78 126 84 C 122 88 122 92 122 92 Z" fill="#3f3f46" />
    <circle cx="152" cy="74" r="7" fill="#3f3f46" />

    <!-- Friendly Face Profile -->
    <circle cx="135" cy="93" r="1.5" fill="#1e293b" />
    <path d="M 143 97 Q 146 99 149 97" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Stethoscope around neck -->
    <path d="M 132 105 Q 140 115 148 105" fill="none" stroke="url(#stethGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 132 105 L 126 135 Q 126 142 133 142" fill="none" stroke="url(#stethGrad)" stroke-width="2.5" />
    <!-- Stethoscope chest piece -->
    <circle cx="133" cy="144" r="5" fill="#cbd5e1" stroke="#f43f5e" stroke-width="2" />

    <!-- Professional Medical Clipboard in Hand -->
    <g transform="translate(150, 130)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#94a3b8" />
      <rect x="2" y="3" width="18" height="23" rx="1" fill="#f8fafc" />
      <!-- Clip -->
      <rect x="7" y="-2" width="8" height="4" rx="1" fill="#334155" />
      <!-- Chart lines -->
      <line x1="5" y1="8" x2="14" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="5" y1="13" x2="17" y2="13" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="5" y1="18" x2="11" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <circle cx="15" cy="18" r="2" fill="#10b981" />
    </g>
  </g>

  <!-- Foreground prop: Medical Kit / First Aid Box with glowing cross on floor to anchor context -->
  <g transform="translate(35, 175)">
    <rect x="0" y="0" width="38" height="26" rx="4" fill="#ef4444" />
    <!-- Box lid detail -->
    <rect x="-2" y="-3" width="42" height="7" rx="2" fill="#dc2626" />
    <!-- Handle -->
    <path d="M 12 -3 L 12 -7 C 12 -9 26 -9 26 -7 L 26 -3" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <!-- White Medical Cross Icon -->
    <rect x="15" y="8" width="8" height="12" rx="1" fill="#ffffff" />
    <rect x="11" y="12" width="16" height="4" rx="1" fill="#ffffff" />
    <!-- Little glow highlight -->
    <circle cx="6" cy="6" r="2" fill="#fca5a5" />
  </g>

  <!-- Floating Professional Accreditation / Success Badge Symbol -->
  <g transform="translate(175, 45)">
    <circle cx="15" cy="15" r="16" fill="url(#badgeGrad)" opacity="0.9" />
    <!-- Medical cross in badge -->
    <rect x="13" y="8" width="4" height="14" rx="1" fill="#ffffff" />
    <rect x="8" y="13" width="14" height="4" rx="1" fill="#ffffff" />
    <circle cx="15" cy="15" r="17" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- Additional atmospheric sparkles / ambient lighting -->
  <circle cx="110" cy="45" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="45" cy="100" r="2" fill="#38bdf8" opacity="0.4" />
  <circle cx="200" cy="190" r="1" fill="#fbbf24" opacity="0.7" />
</svg>