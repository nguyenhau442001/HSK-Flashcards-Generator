<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall/Setting Gradient -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Speaker Metallic Body -->
    <linearGradient id="metalBody" x1="60" y1="80" x2="180" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.5" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Sound Wave Gradient -->
    <linearGradient id="soundWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Architectural Detail -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="url(#wallGrad)"/>
  
  <!-- Subtle Wall Panel Line -->
  <line x1="20" y1="190" x2="220" y2="190" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Ambient Backlight for Speaker (Golden Hour Vibe) -->
  <circle cx="120" cy="115" r="55" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Sound Waves (Action/Broadcast Effect) -->
  <!-- Outer Waves -->
  <path d="M 68 75 C 55 90, 55 140, 68 155" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 172 75 C 185 90, 185 140, 172 155" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Mid Waves with dash effect -->
  <path d="M 78 88 C 68 100, 68 130, 78 142" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 162 88 C 172 100, 172 130, 162 142" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Inner Dynamic Waves -->
  <path d="M 88 102 C 82 108, 82 122, 88 128" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 152 102 C 158 108, 158 122, 152 128" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- PA Speaker (Public Address Horn / Cone) Mount & Base -->
  <ellipse cx="120" cy="148" rx="14" ry="7" fill="#0f172a"/>
  <path d="M 115 145 L 115 158 C 115 160, 125 160, 125 158 L 125 145 Z" fill="#475569"/>

  <!-- Main Speaker Horn Body (Angle-down public broadcast speaker) -->
  <g>
    <!-- Outer Rim / Bezel -->
    <ellipse cx="120" cy="95" rx="52" ry="32" fill="#334155" stroke="#64748b" stroke-width="2.5"/>
    
    <!-- Inner Cone Depth -->
    <ellipse cx="120" cy="99" rx="42" ry="24" fill="#0f172a"/>
    
    <!-- Speaker Grill Center -->
    <ellipse cx="120" cy="102" rx="26" ry="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Center Driver Dome -->
    <ellipse cx="120" cy="103" rx="12" ry="6" fill="#0f172a"/>
    <ellipse cx="118" cy="102" rx="4" ry="2" fill="#475569" opacity="0.5"/>

    <!-- Grill Slots/Lines (Pattern) -->
    <line x1="102" y1="102" x2="138" y2="102" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
    <line x1="108" y1="98" x2="132" y2="98" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
    <line x1="108" y1="106" x2="132" y2="106" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Wall Mounting Bracket & Joint -->
  <path d="M 116 125 L 116 146 L 124 146 L 124 125 Z" fill="#334155"/>
  <circle cx="120" cy="132" r="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>

  <!-- Decorative Room Elements for Context (Tangible Environment) -->
  <!-- Ambient light pulse dots (Broadcast active indicator) -->
  <circle cx="120" cy="62" r="3" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="120" cy="62" r="1.5" fill="#fca5a5"/>

  <!-- Environment Prop: Small wall clock or aesthetic indicator line -->
  <circle cx="185" cy="55" r="12" fill="none" stroke="#334155" stroke-width="2"/>
  <polyline points="185,48 185,55 190,58" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Environment Prop: Plant leaf silhouette peeking from corner to enrich scene -->
  <path d="M 0 240 Q 20 200, 10 180 Q 25 190, 40 240 Z" fill="#065f46" opacity="0.6"/>
  <path d="M 25 240 Q 40 210, 35 195 Q 50 205, 65 240 Z" fill="#047857" opacity="0.8"/>

  <!-- Floating Music/Sound Notes (Visualizing Broadcast Audio) -->
  <!-- Note 1 -->
  <g transform="translate(45, 110) rotate(-15)">
    <ellipse cx="6" cy="12" rx="4" ry="3" fill="#38bdf8"/>
    <path d="M 9 12 L 9 2 Q 9 0, 12 0 L 14 0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Note 2 -->
  <g transform="translate(180, 95) rotate(20)">
    <ellipse cx="6" cy="12" rx="4" ry="3" fill="#fbbf24"/>
    <path d="M 9 12 L 9 2 Q 9 0, 12 0 L 14 0" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Note 3 (Small sparkle) -->
  <path d="M 155, 65 Q 155, 70 160, 70 Q 155, 70 155, 75 Q 155, 70 150, 70 Q 155, 70 155, 65 Z" fill="#fb923c" opacity="0.9"/>
  <path d="M 75, 75 Q 75, 79 79, 79 Q 75, 79 75, 83 Q 75, 79 71, 79 Q 75, 79 75, 75 Z" fill="#38bdf8" opacity="0.9"/>

</svg>