<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm ambient glow for the central character/object -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Face skin tone gradient -->
    <linearGradient id="skinGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Vibrant lip gradient (Zuǐ / Mouth) -->
    <linearGradient id="lipGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Mug gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background ambient details (Café/Cozy room context) -->
  <circle cx="120" cy="120" r="100" fill="url(#centerGlow)"/>

  <!-- Decorative background elements (stars/bokeh) -->
  <circle cx="45" cy="55" r="3" fill="#38bdf8" opacity="0.4"/>
  <circle cx="195" cy="70" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="210" cy="160" r="4" fill="#ec4899" opacity="0.3"/>
  <circle cx="35" cy="180" r="2.5" fill="#34d399" opacity="0.4"/>

  <!-- Tangible Scene Environment: A cozy table surface -->
  <path d="M 0 195 Q 120 185 240 195 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.7"/>
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2"/>

  <!-- Environmental Prop: Cute steaming hot mug to the side -->
  <g transform="translate(175, 145)">
    <!-- Steam wisps -->
    <path d="M 8 -5 Q 12 -12 8 -20 Q 4 -28 10 -35" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 22 0 Q 18 -8 22 -15 Q 26 -22 20 -30" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <!-- Mug Body -->
    <path d="M 2 10 L 8 42 C 8 46 12 48 16 48 L 32 48 C 36 48 40 46 40 42 L 46 10 Z" fill="url(#mugGrad)" filter="url(#dropShadow)"/>
    <ellipse cx="24" cy="10" rx="22" ry="6" fill="#7dd3fc"/>
    <!-- Mug Handle -->
    <path d="M 5 15 C -4 15 -4 35 5 38" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Environmental Prop: Potted succulent plant on the other side -->
  <g transform="translate(25, 140)">
    <!-- Pot -->
    <path d="M 10 25 L 14 50 C 14 53 17 55 20 55 L 30 55 C 33 55 36 53 36 50 L 40 25 Z" fill="#f43f5e" filter="url(#dropShadow)"/>
    <ellipse cx="25" cy="25" rx="15" ry="4" fill="#fb7185"/>
    <!-- Leaves -->
    <path d="M 25 25 Q 15 10 5 15 Q 0 25 15 25 Z" fill="#10b981"/>
    <path d="M 25 25 Q 35 10 45 15 Q 50 25 35 25 Z" fill="#059669"/>
    <path d="M 25 25 Q 25 2 25 -5 Q 32 10 25 25 Z" fill="#34d399"/>
  </g>

  <!-- MAIN SUBJECT: The Head/Face focusing centrally on the "Miệng" (Mouth) -->
  <g transform="translate(0, -5)" filter="url(#dropShadow)">
    <!-- Hair back/base -->
    <path d="M 75 90 C 75 45 165 45 165 90 C 175 110 170 150 165 170 C 160 185 140 190 120 190 C 100 190 80 185 75 170 C 70 150 65 110 75 90 Z" fill="#334155"/>

    <!-- Ears -->
    <circle cx="70" cy="115" r="10" fill="#fdba74"/>
    <circle cx="170" cy="115" r="10" fill="#fdba74"/>

    <!-- Face Base -->
    <path d="M 75 100 C 75 145 95 185 120 185 C 145 185 165 145 165 100 C 165 80 155 70 120 70 C 85 70 75 80 75 100 Z" fill="url(#skinGrad)"/>

    <!-- Hair bangs/front -->
    <path d="M 75 95 C 80 70 100 65 120 65 C 140 65 160 70 165 95 C 150 85 130 80 120 85 C 110 80 90 85 75 95 Z" fill="#1e293b"/>
    <!-- Hair strand accent -->
    <path d="M 95 68 C 105 85 115 80 125 72" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

    <!-- Cheeks (Blush representing friendly, expressive HSK illustration style) -->
    <ellipse cx="92" cy="122" rx="9" ry="6" fill="#fb7185" opacity="0.5"/>
    <ellipse cx="148" cy="122" rx="9" ry="6" fill="#fb7185" opacity="0.5"/>

    <!-- Eyes (Expressive, looking happy/engaged) -->
    <g transform="translate(0, -2)">
      <!-- Left Eye -->
      <circle cx="98" cy="104" r="7" fill="#0f172a"/>
      <circle cx="96" cy="102" r="2.5" fill="#ffffff"/>
      <path d="M 88 95 C 92 92 104 92 108 96" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Right Eye -->
      <circle cx="142" cy="104" r="7" fill="#0f172a"/>
      <circle cx="140" cy="102" r="2.5" fill="#ffffff"/>
      <path d="M 132 96 C 136 92 148 92 152 95" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Nose (Minimalist cute button nose) -->
    <path d="M 120 114 C 117 114 117 119 120 119 C 123 119 123 114 120 114 Z" fill="#ea580c" opacity="0.4"/>

    <!-- ========================================== -->
    <!-- TARGET VOCABULARY FOCUS: 嘴 (Zuǐ) - MOUTH  -->
    <!-- ========================================== -->
    <g id="main-mouth" transform="translate(120, 138)">
      <!-- Mouth Shadow/Depth Base -->
      <path d="M -22 0 C -22 16 22 16 22 0 C 15 8 -15 8 -22 0 Z" fill="#9f1239"/>
      
      <!-- Open Mouth Cavity (Happy talking/smiling expression) -->
      <path d="M -18 2 C -18 13 18 13 18 2 C 12 7 -12 7 -18 2 Z" fill="#881337"/>
      
      <!-- Cute Tongue inside -->
      <path d="M -8 7 C -8 12 8 12 8 7 Z" fill="#fb7185"/>

      <!-- Upper Lip (Plump, vibrant, contoured) -->
      <path d="M -22 0 C -15 -6 -5 -2 0 -2 C 5 -2 15 -6 22 0 C 15 -4 5 -1 0 -1 C -5 -1 -15 -4 -22 0 Z" fill="url(#lipGrad)" filter="url(#dropShadow)"/>

      <!-- Lower Lip (Full and rounded) -->
      <path d="M -22 0 C -15 11 15 11 22 0 C 14 7 -14 7 -22 0 Z" fill="url(#lipGrad)"/>

      <!-- Lip Highlight/Gloss for 2D Vector Pop -->
      <ellipse cx="0" cy="6" rx="8" ry="2" fill="#fda4af" opacity="0.7"/>
      <circle cx="-12" cy="-1" r="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="12" cy="-1" r="1.5" fill="#ffffff" opacity="0.6"/>
    </g>

  </g>

  <!-- Interactive/Dynamic accents floating near the mouth to emphasize speech/sound/meaning -->
  <g transform="translate(160, 115)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" opacity="0.8"/>
    <path d="M 8 -4 C 14 -10 14 -2 20 -8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 6 10 C 12 16 18 12 24 18" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <g transform="translate(75, 120)">
    <path d="M -6 -2 C -12 -8 -8 -16 -14 -22" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>

</svg>