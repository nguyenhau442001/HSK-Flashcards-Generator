<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Gold Trophy Gradients -->
    <linearGradient id="gold-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="gold-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Confetti Colors -->
    <linearGradient id="confetti-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="confetti-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Lighting & Spotlights -->
  <path d="M120 0 L0 240 L240 240 Z" fill="#38bdf8" opacity="0.04" />
  <circle cx="120" cy="110" r="85" fill="#fbbf24" opacity="0.07" filter="blur(10px)" />

  <!-- Confetti Elements (Floating celebration pieces) -->
  <g opacity="0.85">
    <rect x="35" y="65" width="8" height="6" rx="1" fill="url(#confetti-pink)" transform="rotate(25 35 65)" />
    <circle cx="195" cy="75" r="3.5" fill="#fbbf24" />
    <rect x="180" y="140" width="6" height="10" rx="1" fill="url(#confetti-green)" transform="rotate(-30 180 140)" />
    <rect x="55" y="155" width="7" height="7" rx="1" fill="#38bdf8" transform="rotate(45 55 155)" />
    <circle cx="45" cy="110" r="2.5" fill="#f472b6" />
    <circle cx="170" cy="50" r="3" fill="#34d399" />
    <path d="M100 40 L104 48 L96 48 Z" fill="#fbbf24" transform="rotate(15 100 44)" />
  </g>

  <!-- Secondary Background Elements (Winner's Podium Base) -->
  <path d="M70 205 L170 205 L180 230 L60 230 Z" fill="#475569" />
  <path d="M80 195 L160 195 L170 205 L70 205 Z" fill="#64748b" />
  <!-- Podium #1 Marker (Abstract geometric shape, no text) -->
  <path d="M112 210 L128 210 L125 224 L115 224 Z" fill="#fbbf24" opacity="0.9" />

  <!-- MAIN SUBJECT: Proud Character (Upper body/Torso leaning back proudly) -->
  <g id="proud-character">
    <!-- Back Arm / Hand on hip -->
    <path d="M145 130 Q170 145 160 170" fill="none" stroke="#fbcfe8" stroke-width="12" stroke-linecap="round" />
    <circle cx="160" cy="170" r="6" fill="#fbcfe8" />

    <!-- Torso / Jacket -->
    <path d="M95 125 L145 125 L155 195 L85 195 Z" fill="url(#jacket-grad)" />
    <!-- Jacket Collar / Details -->
    <path d="M110 125 L120 150 L130 125 Z" fill="#e0f2fe" />
    <path d="M120 150 L120 195" stroke="#0284c7" stroke-width="3" />

    <!-- Neck -->
    <rect x="112" y="112" width="16" height="18" rx="6" fill="#fbcfe8" />

    <!-- Head (Tilted back proudly, chin up) -->
    <g transform="translate(120, 95) rotate(12)">
      <!-- Head Base -->
      <circle cx="0" cy="0" r="28" fill="#fbcfe8" />

      <!-- Hair Style (Stylish and neat) -->
      <path d="M-26 -10 C-28 -28 -5 -33 12 -28 C26 -24 29 -8 27 -2 C24 3 22 -10 15 -18 C5 -26 -15 -24 -22 -10 Z" fill="#1e293b" />
      <path d="M-28 -5 C-30 5 -20 12 -20 12" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />

      <!-- Confident Smug Face Expression -->
      <!-- Closed Happy/Smug Eyes (Arcs) -->
      <path d="M-10 -4 L-2 -2" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
      <path d="M6 -2 L14 -4" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

      <!-- Smug Grin / Confident Smile -->
      <path d="M-6 8 Q 4 16 12 6" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
      <!-- Rosy Cheeks -->
      <circle cx="-14" cy="5" r="4" fill="#f43f5e" opacity="0.3" />
      <circle cx="16" cy="3" r="4" fill="#f43f5e" opacity="0.3" />
    </g>

    <!-- Front Arm / Holding/Presenting the Trophy -->
    <!-- Shoulder & Upper arm -->
    <path d="M95 130 Q75 145 85 170" fill="none" stroke="#fbcfe8" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- MAIN SUBJECT: Huge Golden Trophy (Symbol of achieving #1 / 'đạt hạng nhất') -->
  <g id="giant-trophy" transform="translate(100, 75)">
    <!-- Trophy Glow Backing -->
    <circle cx="20" cy="45" r="40" fill="#fbbf24" opacity="0.2" filter="blur(8px)" />

    <!-- Trophy Base -->
    <path d="M5 85 L35 85 L30 98 L10 98 Z" fill="#475569" />
    <rect x="12" y="78" width="16" height="8" fill="url(#gold-base)" rx="1" />

    <!-- Stem -->
    <rect x="16" y="55" width="8" height="25" fill="url(#gold-base)" />

    <!-- Handles -->
    <path d="M6 25 C -4 25 -4 45 6 45" fill="none" stroke="url(#gold-base)" stroke-width="5" stroke-linecap="round" />
    <path d="M34 25 C 44 25 44 45 34 45" fill="none" stroke="url(#gold-base)" stroke-width="5" stroke-linecap="round" />

    <!-- Cup Bowl -->
    <path d="M2 15 C 2 45 38 45 38 15 Z" fill="url(#gold-base)" />
    <!-- Cup Rim -->
    <ellipse cx="20" cy="15" rx="18" ry="5" fill="url(#gold-shine)" />
    <!-- Cup Inner Depth -->
    <ellipse cx="20" cy="16" rx="14" ry="3" fill="#b45309" />

    <!-- Star Emblem on Trophy -->
    <path d="M20 25 L22.2 30 L27.5 30.5 L23.5 34 L24.7 39 L20 36.3 L15.3 39 L16.5 34 L12.5 30.5 L17.8 30 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Foreground Sparkles & Highlights -->
  <g>
    <!-- Sparkle top left -->
    <path d="M45 45 L48 55 L58 58 L48 61 L45 71 L42 61 L32 58 L42 55 Z" fill="#fbbf24" opacity="0.9" />
    <!-- Sparkle top right -->
    <path d="M190 95 L192 101 L198 103 L192 105 L190 111 L188 105 L182 103 L188 101 Z" fill="#38bdf8" opacity="0.8" />
    <!-- Sparkle lower right -->
    <path d="M150 170 L151.5 174 L155.5 175.5 L151.5 177 L150 181 L148.5 177 L144.5 175.5 L148.5 174 Z" fill="#fbbf24" opacity="0.7" />
  </g>

  <!-- Frame Border / Clean Edge -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>