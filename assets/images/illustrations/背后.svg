<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="30" y="140" width="180" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="90" fill="#475569"/>
  <rect x="190" y="150" width="10" height="90" fill="#475569"/>
  
  <!-- Person 1 (The one walking away/working) -->
  <g transform="translate(40, 80)">
    <circle cx="20" cy="30" r="15" fill="#fde68a"/>
    <rect x="5" y="45" width="30" height="50" rx="5" fill="#38bdf8"/>
    <rect x="10" y="95" width="8" height="20" fill="#334155"/>
    <rect x="22" y="95" width="8" height="20" fill="#334155"/>
  </g>
  
  <!-- Person 2 (The gossip) -->
  <g transform="translate(140, 70)">
    <circle cx="20" cy="30" r="15" fill="#fde68a"/>
    <rect x="5" y="45" width="30" height="60" rx="5" fill="#ec4899"/>
    <!-- Hand gesturing -->
    <path d="M 35 60 L 50 50" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Mouth/Gossip indicator -->
    <path d="M 25 35 Q 30 40 35 35" stroke="#9f1239" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Person 3 (The listener) -->
  <g transform="translate(180, 85)">
    <circle cx="20" cy="30" r="15" fill="#fde68a"/>
    <rect x="5" y="45" width="30" height="50" rx="5" fill="#fb923c"/>
    <!-- Leaning in -->
    <path d="M 5 55 L -10 65" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Gossip bubbles (Abstract shapes) -->
  <circle cx="160" cy="60" r="4" fill="#fbbf24"/>
  <circle cx="170" cy="55" r="6" fill="#fbbf24"/>
  <circle cx="185" cy="58" r="3" fill="#fbbf24"/>
  
  <!-- Environment details -->
  <rect x="100" y="40" width="40" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="55" r="8" fill="#475569"/>
</svg>