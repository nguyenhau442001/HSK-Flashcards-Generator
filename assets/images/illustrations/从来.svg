<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Amber Glow for Punctuality/History -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Clock Gold Ring -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements -->
  <g opacity="0.15">
    <circle cx="120" cy="110" r="80" fill="url(#amberGlow)" />
    <!-- Subtle architectural lines representing a station/office lobby -->
    <line x1="0" y1="170" x2="240" y2="170" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" />
    <path d="M40 170 L20 220" stroke="#64748b" stroke-width="1.5" />
    <path d="M200 170 L220 220" stroke="#64748b" stroke-width="1.5" />
  </g>

  <!-- Floor Surface -->
  <path d="M 0 175 L 240 175 L 240 240 L 0 240 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="175" x2="240" y2="175" stroke="#475569" stroke-width="2" />

  <!-- ENVIRONMENT PROPS: Grand Station Clock (Representing "Always / From the beginning to end") -->
  <g filter="url(#shadow)">
    <!-- Clock Pole -->
    <rect x="114" y="90" width="12" height="85" fill="#334155" rx="3" />
    <rect x="110" y="165" width="20" height="12" fill="#1e293b" rx="2" />

    <!-- Clock Body Outer Ring -->
    <circle cx="120" cy="85" r="42" fill="url(#goldRing)" />
    <!-- Clock Face -->
    <circle cx="120" cy="85" r="37" fill="#f8fafc" />

    <!-- Clock Tick Marks -->
    <line x1="120" y1="50" x2="120" y2="54" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="120" y1="116" x2="120" y2="120" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="85" y1="85" x2="89" y2="85" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="151" y1="85" x2="155" y2="85" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Perfect Punctual Time Hands (Always on time: exactly 8:00 or sharp marker) -->
    <line x1="120" y1="85" x2="120" y2="64" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="85" x2="138" y2="80" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="120" cy="85" r="4" fill="#ef4444" />
  </g>

  <!-- BACKGROUND TRAVEL PROPS (Suitcase & Plant for scene depth) -->
  <g filter="url(#shadow)" transform="translate(180, 135)">
    <!-- Suitcase -->
    <rect x="0" y="10" width="26" height="30" rx="4" fill="#fb923c" />
    <path d="M 8 10 C 8 4, 18 4, 18 10" fill="none" stroke="#ea580c" stroke-width="2.5" />
    <line x1="0" y1="20" x2="26" y2="20" stroke="#ea580c" stroke-width="1.5" />
    <rect x="10" y="3" width="6" height="7" rx="1" fill="#ea580c" />
    <!-- Wheels -->
    <circle cx="6" cy="42" r="3" fill="#0f172a" />
    <circle cx="20" cy="42" r="3" fill="#0f172a" />
  </g>

  <!-- MAIN CHARACTER: Punctual Traveler / Professional (Depicting "Never late - always early") -->
  <g filter="url(#shadow)">
    <!-- Character Shadow on Floor -->
    <ellipse cx="95" cy="177" rx="22" ry="7" fill="#020617" opacity="0.6" />

    <!-- Briefcase / Bag in hand -->
    <g transform="translate(68, 145)">
      <rect x="0" y="5" width="16" height="12" rx="2" fill="#78350f" />
      <path d="M 4 5 C 4 1, 12 1, 12 5" fill="none" stroke="#b45309" stroke-width="2" />
      <rect x="6" y="8" width="4" height="3" fill="#fde68a" rx="0.5" />
    </g>

    <!-- Legs & Shoes (Walking forward stride, dynamic balance) -->
    <path d="M 86 140 L 80 172 L 92 175 L 94 140 Z" fill="url(#pantsGrad)" />
    <path d="M 104 140 L 112 170 L 102 174 L 98 140 Z" fill="url(#pantsGrad)" />
    <!-- Shoes -->
    <ellipse cx="88" cy="176" rx="7" ry="3.5" fill="#0f172a" />
    <ellipse cx="112" cy="175" rx="7" ry="3.5" fill="#0f172a" />

    <!-- Torso (Jacket / Coat) -->
    <path d="M 80 100 L 110 100 L 118 142 L 72 142 Z" fill="url(#coatGrad)" />
    <!-- Jacket lapels & shirt -->
    <path d="M 95 100 L 90 125 L 100 125 Z" fill="#f8fafc" />
    <line x1="95" y1="100" x2="95" y2="142" stroke="#0284c7" stroke-width="1.5" />

    <!-- Scarf (Adding motion and lifestyle flair) -->
    <path d="M 88 95 Q 95 105 102 95 Q 110 90 115 100 L 105 108 Q 95 103 85 108 Z" fill="#ec4899" />
    <path d="M 108 102 L 115 130 L 105 132 L 100 105 Z" fill="#ec4899" />

    <!-- Arms -->
    <!-- Back Arm holding bag -->
    <path d="M 78 105 L 72 135 L 75 145" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Arm gesturing proudly / checking watch or pointing up at the clock -->
    <path d="M 112 105 L 125 120 L 120 128" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="120" cy="128" r="4" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Head & Hair -->
    <!-- Neck -->
    <rect x="91" y="88" width="8" height="14" fill="#fbcfe8" rx="2" />
    
    <!-- Hair -->
    <path d="M 86 65 C 86 52, 104 52, 110 60 C 116 54, 126 58, 124 70 C 128 74, 126 84, 118 84 C 110 84, 88 84, 86 65 Z" fill="#334155" />

    <!-- Face Profile / Expression (Confident, smiling, reliable) -->
    <circle cx="106" cy="74" r="14" fill="#fbcfe8" />
    
    <!-- Facial Features -->
    <!-- Friendly smiling eye -->
    <path d="M 110 72 C 112 70, 115 72, 114 74" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Cheerful rosy cheek -->
    <circle cx="113" cy="76" r="3.5" fill="#fda4af" opacity="0.6" />
    <!-- Confident Smile -->
    <path d="M 110 80 Q 114 84 117 80" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ACTION / SUCCESS VIBE: Floating Checkmarks & Sparkles (Reinforcing "Always correct / Never late / Consistent") -->
  <g filter="url(#glow)">
    <!-- Golden Star / Sparkle top right of clock -->
    <path d="M 165 45 L 168 53 L 176 56 L 168 59 L 165 67 L 162 59 L 154 56 L 162 53 Z" fill="#fbbf24" />
    <path d="M 70 65 L 72 70 L 77 72 L 72 74 L 70 79 L 68 74 L 63 72 L 68 70 Z" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Dynamic Success Checkmark Badge (Subtle app-ui contextual reinforcement, NO TEXT) -->
  <g transform="translate(145, 110)" filter="url(#shadow)">
    <circle cx="15" cy="15" r="14" fill="#10b981" />
    <circle cx="15" cy="15" r="14" fill="none" stroke="#059669" stroke-width="2" />
    <!-- Checkmark icon -->
    <path d="M 9 15 L 13 19 L 21 11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Additional decorative modern lighting accents -->
  <circle cx="35" cy="40" r="2" fill="#38bdf8" opacity="0.5" />
  <circle cx="205" cy="90" r="3" fill="#fbbf24" opacity="0.4" />
  <circle cx="25" cy="130" r="1.5" fill="#ec4899" opacity="0.6" />
</svg>