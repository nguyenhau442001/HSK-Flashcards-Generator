<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Gradient (Hospital Window) -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Soft Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Hospital Room Wall -->
  <rect x="20" y="20" width="200" height="170" rx="8" fill="#1e293b" />
  
  <!-- Window with Sunset/Daylight -->
  <path d="M160 40 h45 v80 h-45 z" fill="url(#window-glow)" rx="4" />
  <path d="M182 40 v80" stroke="#0f172a" stroke-width="3" />
  <path d="M160 80 h45" stroke="#0f172a" stroke-width="3" />
  <!-- Window Frame -->
  <rect x="157" y="37" width="51" height="86" rx="6" fill="none" stroke="#334155" stroke-width="3" />

  <!-- Wall Decor / Medical Monitor (Abstracted) -->
  <rect x="35" y="45" width="40" height="25" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M42 57 h6 l3 -5 l4 10 l4 -7 l3 2 h6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Hospital Floor -->
  <path d="M20 190 h200 v30 h-200 z" fill="#0f172a" />
  <path d="M20 190 h200" stroke="#334155" stroke-width="2" />

  <!-- Hospital Bed & Sick Friend -->
  <g id="hospital-bed">
    <!-- Bed Frame & Mattress -->
    <rect x="110" y="130" width="105" height="65" rx="8" fill="#334155" />
    <rect x="115" y="135" width="95" height="55" rx="6" fill="#f8fafc" />
    
    <!-- Pillow -->
    <rect x="120" y="142" width="25" height="40" rx="6" fill="#cbd5e1" />

    <!-- Sick Friend (Resting) -->
    <g id="sick-friend">
      <!-- Blanket -->
      <path d="M 135 190 c 0 -20, 20 -25, 75 -25 v 25 z" fill="#38bdf8" />
      <!-- Friend Head -->
      <circle cx="132" cy="162" r="12" fill="#fed7aa" />
      <!-- Closed Eyes (Sleeping/Resting) -->
      <path d="M128 162 q3 -2 6 0" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
      <!-- Sick Expression / Rosy Cheek -->
      <circle cx="137" cy="166" r="3" fill="#f43f5e" opacity="0.4" />
      <!-- Ice Pack / Bandage on Head -->
      <path d="M122 155 q10 -4 20 0 v4 h-20 z" fill="#93c5fd" />
    </g>
  </g>

  <!-- CONTEXT PROPS: Gift Basket / Flowers on Bedside Table -->
  <g id="bedside-table">
    <rect x="90" y="150" width="22" height="40" rx="3" fill="#475569" />
    <!-- Flower Vase / Basket -->
    <path d="M96 150 l3 -18 h6 l3 18 z" fill="#fb923c" filter="url(#shadow)" />
    <!-- Flowers -->
    <circle cx="101" cy="125" r="5" fill="#f43f5e" />
    <circle cx="106" cy="130" r="4" fill="#fbbf24" />
    <circle cx="96" cy="131" r="4" fill="#ec4899" />
    <path d="M101 130 v7" stroke="#10b981" stroke-width="2" />
  </g>

  <!-- MAIN VISITOR CHARACTER (Standing, holding fruit/gift) -->
  <g id="visitor" filter="url(#shadow)">
    <!-- Body / Torso (Wearing cozy jacket) -->
    <path d="M62 140 c-5 0 -12 5 -14 15 l-4 30 h36 l-4 -30 c-2 -10 -9 -15 -14 -15 z" fill="#10b981" />
    <!-- Scarf -->
    <path d="M50 138 c6 4 18 4 24 0 c2 4 4 12 2 16 c-7 3 -19 3 -26 0 c-2 -4 0 -12 0 -16 z" fill="#fbbf24" />
    <!-- Head -->
    <circle cx="62" cy="115" r="14" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M48 114 c0 -10 8 -16 16 -16 c9 0 14 7 14 15 c0 2 -2 2 -2 0 c0 -7 -4 -12 -12 -12 c-7 0 -12 5 -12 12 c0 2 -2 2 -4 -1 z" fill="#334155" />
    <!-- Friendly/Concerned Face -->
    <circle cx="67" cy="116" r="1.5" fill="#1e293b" />
    <!-- Smiling / Caring Mouth -->
    <path d="M65 122 q3 2 6 0" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Legs & Shoes -->
    <rect x="53" y="185" width="6" height="20" rx="3" fill="#334155" />
    <rect x="65" y="185" width="6" height="20" rx="3" fill="#334155" />
    <ellipse cx="56" cy="205" rx="5" ry="2" fill="#0f172a" />
    <ellipse cx="68" cy="205" rx="5" ry="2" fill="#0f172a" />

    <!-- Arms & Gift Box -->
    <!-- Back Arm -->
    <path d="M50 145 c-8 5 -10 15 -8 20" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <!-- Front Arm holding gift basket/box -->
    <path d="M74 145 c10 5 15 15 12 22" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <circle cx="86" cy="165" r="4" fill="#fed7aa" />

    <!-- Gift Box / Fruit Basket brought by visitor -->
    <g transform="translate(72, 155)">
      <rect x="0" y="5" width="20" height="18" rx="3" fill="#ec4899" />
      <rect x="-2" y="3" width="24" height="5" rx="2" fill="#f43f5e" />
      <!-- Ribbon -->
      <path d="M10 3 v20" stroke="#fef08a" stroke-width="3" />
      <path d="M0 12 h20" stroke="#fef08a" stroke-width="3" />
      <!-- Bow -->
      <path d="M7 3 c-3 -4 -6 -2 -4 0 c2 2 4 0 7 0" fill="none" stroke="#fef08a" stroke-width="2" />
      <path d="M13 3 c3 -4 6 -2 4 0 c-2 2 -4 0 -7 0" fill="none" stroke="#fef08a" stroke-width="2" />
    </g>
  </g>

  <!-- Warm Ambient Lighting Effects -->
  <circle cx="180" cy="60" r="40" fill="url(#lamp-glow)" style="mix-blend-mode: screen;" />

</svg>