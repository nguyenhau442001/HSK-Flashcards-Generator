      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Interior -->
  <rect x="20" y="140" width="200" height="80" fill="#334155" rx="4"/>
  <rect x="30" y="150" width="180" height="60" fill="#1e293b" rx="2"/>
  
  <!-- Window -->
  <rect x="160" y="30" width="50" height="50" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <line x1="185" y1="30" x2="185" y2="80" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Parent Figure (Left) -->
  <g transform="translate(40, 80)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M5 40 Q20 30 35 40 L30 80 L10 80 Z" fill="#fb923c"/>
    <path d="M10 80 L10 120 M30 80 L30 120" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Young Adult Figure (Right) -->
