  <!-- Interaction Element -->
  <path d="M85 100 Q110 80 135 100" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="110" cy="90" r="3" fill="#fbbf24"/>
  
  <!-- Floor Props -->
