<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Jar Base -->
    <path d="M20 100 Q20 140 60 140 H100 Q140 140 140 100 V40 H20 Z" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="4"/>
    <rect x="50" y="20" width="60" height="20" rx="4" fill="#64748b"/>
    
    <!-- Candies inside -->
    <circle cx="60" cy="110" r="15" fill="#ec4899"/>
    <circle cx="100" cy="120" r="12" fill="#fbbf24"/>
    <circle cx="80" cy="80" r="18" fill="#10b981"/>
    <circle cx="50" cy="60" r="10" fill="#fb923c"/>
    
    <!-- Loose candies on table -->
    <g transform="translate(130, 150)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="#ec4899" transform="rotate(-20)"/>
      <path d="M-20 -5 L-25 -10 M-20 5 L-25 10 M20 -5 L25 -10 M20 5 L25 10" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(30, 160)">
      <circle cx="0" cy="0" r="14" fill="#fbbf24"/>
      <path d="M-14 0 L-20 -5 M-14 0 L-20 5 M14 0 L20 -5 M14 0 L20 5" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Table surface -->
    <rect x="-40" y="170" width="320" height="70" fill="#0f172a" opacity="0.5"/>
  </g>
</svg>