<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Suit Jacket Gradient -->
    <linearGradient id="suitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Coffee Mug Gradient -->
    <linearGradient id="mugGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Window City Glow -->
    <linearGradient id="cityGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow in background -->
  <circle cx="120" cy="100" r="90" fill="url(#goldGlow)" />

  <!-- WINDOW / URBAN BACKDROP -->
  <!-- Large Window Frame -->
  <rect x="35" y="25" width="170" height="110" rx="6" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="30" width="160" height="100" fill="url(#cityGlow)" />

  <!-- City Skyline silhouettes outside window -->
  <path d="M 45 130 L 45 90 L 55 90 L 55 130 
           L 62 130 L 62 70 L 75 70 L 75 130 
           L 85 130 L 85 60 L 100 60 L 100 130 
           L 110 130 L 110 85 L 122 85 L 122 130
           L 135 130 L 135 50 L 155 50 L 155 130
           L 162 130 L 162 75 L 175 75 L 175 130
           L 185 130 L 185 85 L 195 85 L 195 130 Z" fill="#1e293b" opacity="0.8"/>
  
  <!-- Tiny City Lights -->
  <rect x="66" y="80" width="3" height="3" fill="#fbbf24" opacity="0.6"/>
  <rect x="70" y="90" width="3" height="3" fill="#38bdf8" opacity="0.6"/>
  <rect x="90" y="70" width="3" height="4" fill="#fbbf24" opacity="0.8"/>
  <rect x="95" y="85" width="3" height="3" fill="#fbbf24" opacity="0.5"/>
  <rect x="140" y="65" width="4" height="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="147" y="80" width="3" height="3" fill="#fbbf24" opacity="0.7"/>

  <!-- Window Horizontal & Vertical Bars -->
  <line x1="120" y1="30" x2="120" y2="130" stroke="#334155" stroke-width="2"/>
  <line x1="40" y1="80" x2="200" y2="80" stroke="#334155" stroke-width="2"/>

  <!-- ENVIRONMENT / DESK SETUP -->
  <!-- Wooden Desk Surface -->
  <rect x="0" y="170" width="240" height="70" fill="url(#deskGrad)"/>
  <!-- Desk Edge Highlight -->
  <rect x="0" y="170" width="240" height="4" fill="#475569"/>

  <!-- Plant Prop (Left) -->
  <path d="M 40 170 Q 40 150 48 140 Q 55 150 55 170 Z" fill="#334155"/>
  <ellipse cx="47.5" cy="140" rx="9" ry="3" fill="#475569"/>
  <!-- Plant Leaves -->
  <path d="M 47.5 137 Q 30 120 35 105 Q 45 125 47.5 137 Z" fill="#10b981"/>
  <path d="M 48 137 Q 60 115 70 120 Q 55 130 48 137 Z" fill="#059669"/>
  <path d="M 47.5 137 Q 45 110 52 100 Q 50 120 47.5 137 Z" fill="#34d399"/>

  <!-- Desk Lamp (Right) -->
  <path d="M 195 170 L 205 170 L 202 120 L 198 120 Z" fill="#64748b"/>
  <path d="M 200 120 Q 200 95 180 90 L 180 85 Q 210 85 205 120 Z" fill="#475569"/>
  <!-- Lamp Shade -->
  <path d="M 160 75 L 200 75 L 190 95 L 170 95 Z" fill="#f59e0b"/>
  <!-- Light Cone Overlay -->
  <polygon points="170,95 190,95 210,170 140,170" fill="#f59e0b" opacity="0.08"/>

  <!-- Coffee Mug & Saucer -->
  <ellipse cx="165" cy="165" rx="12" ry="4" fill="#cbd5e1"/>
  <path d="M 157 163 L 160 148 L 170 148 L 173 163 Z" fill="url(#mugGrad)"/>
  <ellipse cx="165" cy="148" rx="5" ry="1.5" fill="#fecdd3"/>
  <path d="M 172 151 Q 179 152 176 158 Q 173 160 171 157" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

  <!-- MAIN CHARACTER: PROFESSIONAL ADULT ("CHÉNG RÉN") -->
  <!-- Character Shadow on Desk -->
  <ellipse cx="110" cy="172" rx="35" ry="6" fill="#0f172a" opacity="0.6"/>

  <!-- Suit Body & Shoulders -->
  <!-- Shirt Collar & Tie -->
  <polygon points="100,128 120,138 140,128 130,122 120,126 110,122" fill="#f8fafc"/>
  <polygon points="117,135 123,135 125,160 120,167 115,160" fill="#ec4899"/>

  <!-- Suit Jacket -->
  <path d="M 85 170 L 95 128 Q 107 122 120 125 Q 133 122 145 128 L 155 170 Z" fill="url(#suitGrad)"/>
  <!-- Jacket lapels -->
  <path d="M 95 128 L 110 155 L 100 170 Z" fill="#0284c7"/>
  <path d="M 145 128 L 130 155 L 140 170 Z" fill="#0284c7"/>
  <!-- Suit Buttons -->
  <circle cx="120" cy="155" r="2" fill="#e2e8f0"/>
  <circle cx="120" cy="165" r="2" fill="#e2e8f0"/>

  <!-- Neck -->
  <rect x="112" y="115" width="16" height="16" fill="#fbcfe8" rx="4"/>

  <!-- Head / Face -->
  <path d="M 100 95 Q 100 72 120 72 Q 140 72 140 95 Q 140 118 120 118 Q 100 118 100 95 Z" fill="#fbcfe8"/>

  <!-- Professional Hair (Confident Modern Cut) -->
  <path d="M 101 88 Q 103 65 120 65 Q 140 65 141 85 Q 140 70 120 70 Q 105 70 101 88 Z" fill="#334155"/>
  <path d="M 115 67 Q 130 60 143 75 Q 135 68 125 68 Z" fill="#1e293b"/>

  <!-- Facial Features (Confident, Mature Smile) -->
  <!-- Eyebrows (Determined/Calm) -->
  <path d="M 107 84 Q 113 81 118 84" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 122 84 Q 127 81 133 84" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="112.5" cy="90" r="3" fill="#1e293b"/>
  <circle cx="127.5" cy="90" r="3" fill="#1e293b"/>
  <!-- Eye highlights -->
  <circle cx="113.5" cy="89" r="1" fill="#ffffff"/>
  <circle cx="128.5" cy="89" r="1" fill="#ffffff"/>

  <!-- Glasses (Adding to the mature, adult professional look) -->
  <rect x="106" y="84" width="14" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <rect x="120" y="84" width="14" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="120" y1="90" x2="120" y2="90" stroke="#fbbf24" stroke-width="2"/>

  <!-- Warm Smile -->
  <path d="M 113 103 Q 120 109 127 103" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>  
  <!-- Subtle Rosy Cheeks -->
  <circle cx="106" cy="97" r="4" fill="#f43f5e" opacity="0.25"/>
  <circle cx="134" cy="97" r="4" fill="#f43f5e" opacity="0.25"/>

  <!-- Foreground decorative elements for depth (Briefcase on desk corner) -->
  <rect x="25" y="155" width="28" height="20" rx="3" fill="#b45309"/>
  <rect x="27" y="153" width="24" height="4" rx="2" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="39" cy="165" r="2" fill="#fbbf24"/>
</svg>