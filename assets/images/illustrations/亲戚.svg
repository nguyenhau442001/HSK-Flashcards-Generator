<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Indoor Glow Gradient -->
    <radialGradient id="room-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Room Lighting Effect -->
  <rect width="240" height="240" rx="24" fill="url(#room-glow)"/>

  <!-- Background Environment: Warm Living Room Context -->
  <g id="environment">
    <!-- Wall & Floor Divider -->
    <rect x="0" y="150" width="240" height="90" fill="#0f172a" opacity="0.8"/>
    <line x1="0" y1="150" x2="240" y2="150" stroke="#334155" stroke-width="2"/>

    <!-- Wallpaper Pattern / Window Silhouette -->
    <rect x="30" y="30" width="60" height="90" rx="4" fill="#334155" opacity="0.3"/>
    <line x1="60" y1="30" x2="60" y2="120" stroke="#1e293b" stroke-width="2"/>
    <line x1="30" y1="75" x2="90" y2="75" stroke="#1e293b" stroke-width="2"/>

    <!-- Cozy Hanging Lantern / Light -->
    <path d="M 120 0 L 120 30" stroke="#64748b" stroke-width="2"/>
    <circle cx="120" cy="35" r="10" fill="#f59e0b" filter="url(#soft-shadow)"/>
    <path d="M 110 30 Q 120 20 130 30 Z" fill="#fbbf24"/>
  </g>

  <!-- Foreground Props: Tea Table and Gift Box -->
  <g id="props">
    <!-- Wooden Coffee Table -->
    <path d="M 70 170 L 170 170 L 180 195 L 60 195 Z" fill="#b45309" filter="url(#soft-shadow)"/>
    <rect x="55" y="195" width="130" height="8" rx="2" fill="#d97706"/>
    <!-- Table Legs -->
    <rect x="75" y="203" width="8" height="20" fill="#78350f"/>
    <rect x="157" y="203" width="8" height="20" fill="#78350f"/>

    <!-- Tea Set -->
    <ellipse cx="90" cy="180" rx="10" ry="5" fill="#e2e8f0"/>
    <path d="M 85 175 C 80 170 100 170 95 175" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="110" cy="178" r="6" fill="#f8fafc"/>

    <!-- Gift Box / Souvenir for Family Visit -->
    <g transform="translate(130, 165)">
      <rect x="0" y="10" width="26" height="20" rx="2" fill="#ec4899"/>
      <rect x="-2" y="5" width="30" height="7" rx="1" fill="#f43f5e"/>
      <!-- Ribbon Vertical -->
      <rect x="11" y="5" width="4" height="25" fill="#fde047"/>
      <!-- Ribbon Bow -->
      <path d="M 7 5 Q 13 -2 11 5 Q 18 -2 15 5" fill="none" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Main Characters: Family Members (Older Relative and Younger Relative Greeting) -->
  <g id="characters" filter="url(#soft-shadow)">
    
    <!-- Character 1: Older Relative (Grandfather/Uncle) on the Left -->
    <g id="older-relative">
      <!-- Body / Torso (Warm Cardigan) -->
      <path d="M 65 175 C 60 140 85 130 95 130 C 105 130 130 140 125 175 Z" fill="#3b82f6"/>
      <!-- Inner Shirt Collar -->
      <path d="M 85 130 L 95 142 L 105 130 Z" fill="#f8fafc"/>
      <!-- Cardigan Details (Buttons & Pocket) -->
      <circle cx="95" cy="150" r="2" fill="#94a3b8"/>
      <circle cx="95" cy="165" r="2" fill="#94a3b8"/>

      <!-- Head & Neck -->
      <rect x="88" y="115" width="14" height="20" fill="#fbcfe8" rx="4"/>
      <circle cx="95" cy="110" r="18" fill="#fbcfe8"/>

      <!-- Friendly Facial Expression & Glasses -->
      <circle cx="89" cy="107" r="5" fill="none" stroke="#475569" stroke-width="2"/>
      <circle cx="101" cy="107" r="5" fill="none" stroke="#475569" stroke-width="2"/>
      <line x1="94" y1="107" x2="96" y2="107" stroke="#475569" stroke-width="2"/>
      <!-- Smile -->
      <path d="M 91 116 Q 95 120 99 116" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round"/>
      <!-- Gray Hair / Temples -->
      <path d="M 78 110 C 78 98 112 98 112 110 C 112 103 105 95 95 95 C 85 95 78 103 78 110 Z" fill="#cbd5e1"/>

      <!-- Waving / Welcoming Arm -->
      <path d="M 68 140 Q 55 130 50 145 Q 55 155 70 150 Z" fill="#3b82f6"/>
      <circle cx="48" cy="146" r="5" fill="#fbcfe8"/>
    </g>

    <!-- Character 2: Younger Relative (Visitor) on the Right -->
    <g id="younger-relative">
      <!-- Body / Torso (Trendy Jacket) -->
      <path d="M 145 175 C 140 135 165 130 175 130 C 185 130 210 135 205 175 Z" fill="#10b981"/>
      <!-- Scarf representing visiting in cooler/festive weather -->
      <path d="M 160 125 Q 175 140 190 125 Q 175 145 160 125 Z" fill="#f59e0b"/>
      <path d="M 185 130 L 195 160 L 180 155 Z" fill="#f59e0b"/>

      <!-- Head & Neck -->
      <rect x="168" y="112" width="14" height="18" fill="#fed7aa" rx="4"/>
      <circle cx="175" cy="105" r="16" fill="#fed7aa"/>

      <!-- Facial Expression: Warm, Happy Smile -->
      <circle cx="170" cy="103" r="1.5" fill="#334155"/>
      <circle cx="180" cy="103" r="1.5" fill="#334155"/>
      <path d="M 171 110 Q 175 114 179 110" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
      <!-- Modern Hair -->
      <path d="M 160 102 C 160 90 190 90 190 102 C 190 96 182 92 175 92 C 168 92 160 96 160 102 Z" fill="#1e293b"/>

      <!-- Arm Holding Gift / Gesturing -->
      <path d="M 150 140 Q 135 145 138 158 Q 148 160 155 150 Z" fill="#10b981"/>
      <circle cx="136" cy="160" r="4.5" fill="#fed7aa"/>
    </g>
  </g>

  <!-- Interactive / Narrative Highlights (Floating warm hearts/sparkles for reunion theme) -->
  <g id="sparkles" fill="#f43f5e">
    <path d="M 125 80 Q 125 73 132 73 Q 139 73 139 80 Q 139 88 132 94 Q 125 88 125 80 Z" opacity="0.8" transform="scale(0.8) translate(30, 10)"/>
    <path d="M 125 80 Q 125 73 132 73 Q 139 73 139 80 Q 139 88 132 94 Q 125 88 125 80 Z" fill="#fbbf24" opacity="0.9" transform="scale(0.5) translate(90, 40)"/>
    <circle cx="110" cy="70" r="2" fill="#38bdf8"/>
    <circle cx="140" cy="100" r="1.5" fill="#f43f5e"/>
  </g>
</svg>