<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting & window glow (representing the future/horizon) -->
  <defs>
    <radialGradient id="windowGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" fill="url(#windowGlow)"/>

  <!-- Window overlooking a futuristic/bright city skyline (representing the future) -->
  <g opacity="0.6">
    <!-- Window frame -->
    <rect x="140" y="30" width="70" height="90" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <line x1="175" y1="30" x2="175" y2="120" stroke="#475569" stroke-width="2"/>
    <line x1="140" y1="75" x2="210" y2="75" stroke="#475569" stroke-width="2"/>
    
    <!-- Skyline silhouette inside window -->
    <path d="M145 120 L145 85 L152 85 L152 120 L158 120 L158 65 L164 65 L164 120 L178 120 L178 50 L188 50 L188 120 L195 120 L195 70 L205 70 L205 120 Z" fill="#0ea5e9" opacity="0.3"/>
    <circle cx="183" cy="42" r="6" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Bookshelf / Environment details in background -->
  <g fill="#1e293b" opacity="0.8">
    <rect x="25" y="45" width="40" height="6" rx="2" fill="#475569"/>
    <rect x="30" y="25" width="30" height="20" rx="2" fill="#334155"/>
    <!-- Books -->
    <path d="M32 45 L32 32 L36 32 L36 45 Z" fill="#f43f5e"/>
    <path d="M38 45 L38 28 L43 28 L43 45 Z" fill="#10b981"/>
    <path d="M45 45 L45 35 L52 35 L52 45 Z" fill="#f59e0b"/>
  </g>

  <!-- Main Desk -->
  <path d="M20 185 L220 185 L210 155 L30 155 Z" fill="url(#deskGrad)"/>
  <rect x="25" y="185" width="190" height="8" rx="2" fill="#475569"/>

  <!-- Character 1 (Left - Woman planning/writing) -->
  <g>
    <!-- Chair back -->
    <path d="M45 155 L55 95 L75 95 L65 155 Z" fill="#334155"/>
    <!-- Body & Clothes -->
    <path d="M45 155 C45 135 65 135 70 115 C75 135 95 135 95 155 Z" fill="#ec4899"/>
    <!-- Head & Hair -->
    <circle cx="70" cy="100" r="14" fill="#fed7aa"/>
    <path d="M56 100 C56 85 84 85 84 100 C84 110 78 112 78 108 C78 102 75 96 70 96 C65 96 62 102 62 108 C62 112 56 110 56 100 Z" fill="#475569"/>
    <!-- Arm reaching forward -->
    <path d="M60 130 Q75 135 88 145" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <circle cx="89" cy="147" r="4" fill="#fed7aa"/>
  </g>

  <!-- Character 2 (Right - Man pointing at blueprint/screen) -->
  <g>
    <!-- Chair back -->
    <path d="M195 155 L185 95 L165 95 L175 155 Z" fill="#334155"/>
    <!-- Body & Clothes -->
    <path d="M150 155 C150 135 170 135 175 115 C180 135 200 135 200 155 Z" fill="#38bdf8"/>
    <!-- Head & Hair -->
    <circle cx="175" cy="100" r="14" fill="#fde047"/>
    <path d="M161 98 C163 86 187 86 189 98 C185 93 165 93 161 98 Z" fill="#1e293b"/>
    <!-- Arm pointing -->
    <path d="M190 130 Q160 135 135 135" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="132" cy="135" r="4" fill="#fde047"/>
  </g>

  <!-- Collaborative Working Props on Desk (Center Stage) -->
  <!-- Laptop/Tablet displaying futuristic charts -->
  <g transform="translate(95, 130)">
    <!-- Base -->
    <path d="M10 25 L40 25 L45 30 L5 30 Z" fill="#94a3b8"/>
    <!-- Screen -->
    <rect x="12" y="2" width="26" height="23" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Chart lines on screen -->
    <path d="M15 18 L20 12 L24 15 L32 7" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="7" r="2" fill="#10b981"/>
  </g>

  <!-- Architectural Blueprint / Planning Document -->
  <g transform="translate(65, 140) rotate(-10)">
    <rect width="35" height="25" rx="2" fill="url(#blueprintGrad)"/>
    <!-- Blueprint abstract lines -->
    <line x1="5" y1="6" x2="30" y2="6" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="5" y1="12" x2="20" y2="12" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="27" cy="17" r="4" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Coffee Mug (Cozy persistent prop) -->
  <g transform="translate(145, 138)">
    <rect x="0" y="4" width="10" height="12" rx="2" fill="#f8fafc"/>
    <path d="M10 7 C13 7 13 13 10 13" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Steam -->
    <path d="M3 1 Q5 -2 3 -5" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Warm accent lighting from desk lamp -->
  <path d="M110 50 L100 135 L120 135 Z" fill="#fbbf24" opacity="0.08"/>
  <circle cx="110" cy="50" r="8" fill="#fbbf24"/>
  <path d="M95 50 Q110 40 125 50" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
</svg>