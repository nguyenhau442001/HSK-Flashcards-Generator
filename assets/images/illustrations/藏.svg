  <path d="M95 80 Q120 120 145 80" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  <rect x="90" y="100" width="60" height="40" rx="10" fill="#38bdf8"/>
  
  <!-- Arm reaching under -->
