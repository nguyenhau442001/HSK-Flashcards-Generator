<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed Frame -->
  <rect x="40" y="140" width="160" height="20" rx="4" fill="#475569"/>
  <rect x="50" y="160" width="10" height="30" fill="#334155"/>
  <rect x="180" y="160" width="10" height="30" fill="#334155"/>
  
  <!-- Mattress -->
  <path d="M40 140 L200 140 L195 110 L45 110 Z" fill="#94a3b8"/>
  <path d="M45 110 L195 110 L190 100 L50 100 Z" fill="#cbd5e1"/>
  
