  <line x1="162" y1="161" x2="178" y2="161" stroke="#065f46" stroke-width="2"/>
  
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="195" rx="80" ry="10" fill="#0f172a" opacity="0.5"/>
  
  <!-- Room details -->
  <rect x="20" y="40" width="30" height="60" rx="5" fill="#334155" opacity="0.4"/>
  <circle cx="220" cy="40" r="15" fill="#fbbf24" opacity="0.2"/>
