<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Printer Body Gradients -->
    <linearGradient id="printerMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="printerDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Laser Scan / Magic Print Effect -->
    <linearGradient id="printLaser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Document Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- Wooden Desk Surface -->
  <path d="M 0 170 Q 120 160 240 170 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.8" />
  <rect x="0" y="172" width="240" height="68" fill="#1e1b4b" opacity="0.4" />
  <line x1="0" y1="172" x2="240" y2="172" stroke="#334155" stroke-width="2" />

  <!-- Environmental Props (Coffee Mug & Plant) -->
  <!-- Coffee Mug -->
  <g transform="translate(30, 140)">
    <rect x="0" y="10" width="22" height="22" rx="4" fill="#fb923c" />
    <path d="M 22 14 C 27 14 27 24 22 24" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="11" cy="10" rx="11" ry="3" fill="#fdba74" />
    <!-- Steam -->
    <path d="M 7 4 Q 9 0 7 -4" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 14 6 Q 16 2 14 -2" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Small Desk Lamp -->
  <g transform="translate(190, 80)">
    <path d="M 10 90 L 30 90 L 25 50 L 5 50 Z" fill="#334155" />
    <path d="M 17 50 L 5 -10 L 25 -10 Z" fill="#f59e0b" />
    <ellipse cx="15" cy="-10" rx="10" ry="4" fill="#fbbf24" />
    <circle cx="15" cy="-6" r="6" fill="#fef08a" />
  </g>

  <!-- MAIN SUBJECT: Modern Office Printer -->
  <g transform="translate(45, 65)">
    <!-- Paper Input Tray (Back) -->
    <path d="M 35 -15 L 115 -15 L 125 25 L 25 25 Z" fill="#64748b" />
    <!-- Blank Paper Stack in Input Tray -->
    <g transform="translate(35, -12)">
      <polygon points="5,0 75,0 70,30 0,30" fill="#f1f5f9" />
      <line x1="15" y1="10" x2="55" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="15" y1="18" x2="45" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Printer Main Body (Bottom Casement) -->
    <rect x="0" y="25" width="150" height="60" rx="8" fill="url(#printerMain)" filter="url(#dropShadow)" />

    <!-- Paper Output Extension Tray -->
    <path d="M 25 85 L 125 85 L 135 115 L 15 115 Z" fill="#cbd5e1" filter="url(#dropShadow)" />
    <path d="M 35 115 L 115 115 L 120 120 L 30 120 Z" fill="#94a3b8" />

    <!-- Action-Packed Printed Document sliding out -->
    <g transform="translate(32, 70)" filter="url(#dropShadow)">
      <!-- Document Paper -->
      <polygon points="0,0 86,0 96,65 -10,65" fill="#ffffff" />
      
      <!-- Colorful Vector Chart Graphic on Printed Page (Action element) -->
      <rect x="10" y="10" width="25" height="4" rx="2" fill="#38bdf8" />
      <rect x="10" y="18" width="56" height="3" rx="1.5" fill="#e2e8f0" />
      <rect x="10" y="24" width="45" height="3" rx="1.5" fill="#e2e8f0" />
      
      <!-- Mini Bar Chart Graphics -->
      <rect x="12" y="38" width="8" height="18" rx="2" fill="#10b981" />
      <rect x="24" y="30" width="8" height="26" rx="2" fill="#6366f1" />
      <rect x="36" y="34" width="8" height="22" rx="2" fill="#ec4899" />
      <rect x="48" y="26" width="8" height="30" rx="2" fill="#f59e0b" />
      
      <!-- Accent badge on document -->
      <circle cx="68" cy="42" r="10" fill="#fef3c7" />
      <path d="M 64 42 L 67 45 L 73 38" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Laser Scanning/Printing Beam Effect -->
    <rect x="30" y="65" width="90" height="12" fill="url(#printLaser)" opacity="0.7" style="mix-blend-mode: overlay;" />

    <!-- Printer Top Cover & Scanner Lid -->
    <rect x="5" y="15" width="140" height="18" rx="6" fill="url(#printerDark)" />

    <!-- Control Panel & Interactive Elements -->
    <!-- LCD Screen -->
    <rect x="110" y="38" width="24" height="14" rx="3" fill="#0284c7" />
    <!-- Screen UI lines (abstract, no text) -->
    <line x1="113" y1="43" x2="123" y2="43" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
    <line x1="113" y1="47" x2="119" y2="47" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />

    <!-- Power & Action Buttons -->
    <circle cx="94" cy="45" r="4" fill="#10b981" />
    <circle cx="80" cy="45" r="4" fill="#ef4444" />
    
    <!-- Paper Slot / Output Opening -->
    <rect x="25" y="78" width="100" height="6" rx="3" fill="#1e293b" />

    <!-- Brand Accent Strip -->
    <rect x="15" y="22" width="120" height="2" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Floating Dynamic Particles / Sparkles (Action & Magic of Printing) -->
  <g>
    <!-- Sparkle 1 -->
    <path d="M 160 55 Q 165 55 165 50 Q 165 55 170 55 Q 165 55 165 60 Q 165 55 160 55 Z" fill="#38bdf8" />
    <!-- Sparkle 2 -->
    <path d="M 70 45 Q 74 45 74 41 Q 74 45 78 45 Q 74 45 74 49 Q 74 45 70 45 Z" fill="#fbbf24" />
    <!-- Floating leaf/doc deco -->
    <circle cx="175" cy="115" r="3" fill="#ec4899" opacity="0.8" />
    <circle cx="55" cy="40" r="2" fill="#10b981" opacity="0.8" />
  </g>
</svg>