<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Lake Water -->
  <path d="M0 140 C 60 120, 180 160, 240 140 L 240 240 L 0 240 Z" fill="#0ea5e9" opacity="0.6"/>
  <path d="M0 150 C 80 130, 200 170, 240 150 L 240 240 L 0 240 Z" fill="#0284c7" opacity="0.8"/>
  
  <!-- Measurement Tool (Sonar/Depth Gauge) -->
  <rect x="115" y="100" width="10" height="120" fill="#fbbf24" rx="2"/>
  <circle cx="120" cy="100" r="8" fill="#fb923c"/>
  
  <!-- Depth Markers -->
  <line x1="105" y1="120" x2="115" y2="120" stroke="#f59e0b" stroke-width="2"/>
  <line x1="105" y1="140" x2="115" y2="140" stroke="#f59e0b" stroke-width="2"/>
  <line x1="105" y1="160" x2="115" y2="160" stroke="#f59e0b" stroke-width="2"/>
  <line x1="105" y1="180" x2="115" y2="180" stroke="#f59e0b" stroke-width="2"/>
  <line x1="105" y1="200" x2="115" y2="200" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Researcher Character -->
  <g transform="translate(40, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 35 Q 20 50 30 35" stroke="#fde68a" stroke-width="3" fill="none"/>
    <rect x="5" y="40" width="30" height="50" rx="5" fill="#38bdf8"/>
    <rect x="5" y="90" width="12" height="30" rx="3" fill="#1e293b"/>
    <rect x="23" y="90" width="12" height="30" rx="3" fill="#1e293b"/>
    <path d="M35 50 L 60 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Boat / Platform -->
  <path d="M20 130 L 100 130 L 90 150 L 30 150 Z" fill="#ec4899"/>
  
  <!-- Decorative Nature -->
  <circle cx="200" cy="50" r="20" fill="#fbbf24" opacity="0.3"/>
  <path d="M180 200 Q 190 180 200 200 T 220 200" stroke="#10b981" stroke-width="4" fill="none"/>
  <path d="M190 210 Q 200 190 210 210 T 230 210" stroke="#10b981" stroke-width="4" fill="none"/>
</svg>