<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <circle cx="190" cy="50" r="30" fill="#f59e0b" opacity="0.1"/>
  <path d="M20 180 Q 120 140 220 180 L 220 240 L 20 240 Z" fill="#334155"/>
  
  <!-- Group of People (大家) -->
  <!-- Person 1 -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="15" fill="#f59e0b"/>
    <path d="M5 40 Q 20 30 35 40 L 30 90 L 10 90 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(100, 80)">
    <circle cx="20" cy="20" r="18" fill="#fbbf24"/>
    <path d="M2 45 Q 20 35 38 45 L 35 100 L 5 100 Z" fill="#10b981"/>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(160, 100)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M5 40 Q 20 30 35 40 L 30 90 L 10 90 Z" fill="#ec4899"/>
  </g>

  <!-- Decorative Sparkles/Atmosphere -->
  <circle cx="60" cy="70" r="3" fill="#f59e0b"/>
  <circle cx="180" cy="80" r="2" fill="#38bdf8"/>
  <circle cx="120" cy="50" r="4" fill="#fbbf24"/>
  
  <!-- Floor/Ground Shadow -->
  <ellipse cx="120" cy="190" rx="100" ry="10" fill="#0f172a" opacity="0.4"/>
