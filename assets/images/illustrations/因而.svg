<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Desk Light Gradient -->
    <radialGradient id="deskLampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Success Achievement Glow -->
    <radialGradient id="successGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Window City Night Lights Gradient -->
    <linearGradient id="windowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Cozy Study Room Background -->
  <!-- Bookshelf Background Elements -->
  <rect x="20" y="30" width="60" height="90" rx="4" fill="#1b253b" />
  <rect x="25" y="45" width="50" height="8" rx="2" fill="#2d3748" />
  <rect x="25" y="70" width="50" height="8" rx="2" fill="#2d3748" />
  <rect x="25" y="95" width="50" height="8" rx="2" fill="#2d3748" />
  <!-- Colorful Book Spines -->
  <rect x="28" y="53" width="8" height="17" rx="2" fill="#38bdf8" />
  <rect x="38" y="53" width="12" height="17" rx="2" fill="#ec4899" />
  <rect x="52" y="55" width="7" height="15" rx="2" fill="#fbbf24" />
  <rect x="61" y="52" width="10" height="18" rx="2" fill="#10b981" />

  <rect x="28" y="78" width="10" height="17" rx="2" fill="#fb923c" />
  <rect x="40" y="78" width="6" height="17" rx="2" fill="#818cf8" />
  <rect x="48" y="80" width="14" height="15" rx="2" fill="#38bdf8" />

  <!-- Window to Late Night / Dedication context -->
  <rect x="165" y="25" width="50" height="70" rx="6" fill="url(#windowGrad)" stroke="#334155" stroke-width="2" />
  <!-- Window frames -->
  <line x1="190" y1="25" x2="190" y2="95" stroke="#334155" stroke-width="2" />
  <line x1="165" y1="60" x2="215" y2="60" stroke="#334155" stroke-width="2" />
  <!-- Tiny City Lights outside -->
  <circle cx="175" cy="40" r="1.5" fill="#facc15" opacity="0.8" />
  <circle cx="202" cy="48" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="180" cy="80" r="1.5" fill="#ec4899" opacity="0.8" />

  <!-- Atmospheric Desk Lamp Glow -->
  <circle cx="185" cy="115" r="70" fill="url(#deskLampGlow)" />

  <!-- FURNITURE: Study Desk -->
  <rect x="30" y="160" width="180" height="12" rx="4" fill="#334155" filter="url(#softShadow)" />
  <rect x="45" y="172" width="12" height="58" fill="#1e293b" />
  <rect x="183" y="172" width="12" height="58" fill="#1e293b" />

  <!-- DESK PROPS: Books, Laptop, Lamp -->
  <!-- Desk Lamp Base & Arm -->
  <path d="M 185 160 L 185 130 L 200 110" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 194 105 L 208 118 L 198 123 Z" fill="#fbbf24" />
  <ellipse cx="185" cy="160" rx="10" ry="4" fill="#475569" />

  <!-- Stack of Books -->
  <rect x="135" y="146" width="35" height="14" rx="2" fill="#0284c7" />
  <rect x="133" y="135" width="38" height="13" rx="2" fill="#059669" />
  <rect x="137" y="125" width="32" height="12" rx="2" fill="#dc2626" />

  <!-- STUDY ACTION: Hardworking Student Character -->
  <!-- Chair Back -->
  <rect x="75" y="110" width="22" height="65" rx="6" fill="#475569" />
  
  <!-- Character Torso & Head -->
  <!-- Hoodie / Shirt (Hardworking casual wear) -->
  <path d="M 75 145 C 75 130 95 125 105 140 L 115 170 C 115 170 85 175 75 160 Z" fill="#3b82f6" />
  <path d="M 85 140 L 95 155 L 105 140" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /> <!-- Hoodie strings/collar -->

  <!-- Neck & Head -->
  <rect x="91" y="116" width="10" height="14" fill="#fcd34d" />
  <circle cx="96" cy="106" r="14" fill="#fcd34d" />
  
  <!-- Hair (Neat, focused student style) -->
  <path d="M 82 105 C 82 94 92 92 104 96 C 110 98 111 106 110 112 C 105 105 93 104 82 105 Z" fill="#1e293b" />

  <!-- Concentrated Face Profile / Expression -->
  <circle cx="104" cy="106" r="1.5" fill="#1e293b" /> <!-- Focused eye -->
  <path d="M 102 112 C 105 113 107 112 108 111" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" /> <!-- Determined mouth -->
  <!-- Cute round glasses for studying hard -->
  <circle cx="103" cy="106" r="4" fill="none" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Active Arms writing / studying -->
  <!-- Back Arm resting/holding -->
  <path d="M 85 140 C 75 150 78 162 88 162" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
  <!-- Active Writing Arm -->
  <path d="M 102 142 C 112 148 118 152 110 162" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
  <circle cx="110" cy="162" r="3.5" fill="#fcd34d" /> <!-- Hand holding pen -->

  <!-- Open Notebook / Textbook on Desk -->
  <path d="M 85 155 L 125 155 C 130 155 135 158 135 163 L 135 163 C 135 168 130 170 125 170 L 85 170 C 80 170 75 168 75 163 L 75 163 C 75 158 80 155 85 155 Z" fill="#f8fafc" />
  <!-- Book Spine Center Fold -->
  <line x1="105" y1="155" x2="105" y2="170" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Scribbled notes lines representing hard study -->
  <line x1="88" y1="160" x2="98" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="88" y1="165" x2="96" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="112" y1="160" x2="124" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="112" y1="165" x2="120" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />


  <!-- CAUSAL CONNECTOR / TRANSITION EFFECT ("因而" - DO SO / THEREFORE CONCEPT) -->
  <!-- Glowing magical/logical flow particles curving from the study desk to the success achievement badge -->
  <g opacity="0.85">
    <path d="M 125 145 C 135 120 150 95 175 80" fill="none" stroke="url(#successGlow)" stroke-width="4" stroke-dasharray="4 4" stroke-linecap="round" />
    <circle cx="140" cy="130" r="3" fill="#38bdf8" />
    <circle cx="155" cy="105" r="4" fill="#fbbf24" />
    <circle cx="168" cy="90" r="3" fill="#10b981" />
  </g>


  <!-- RESULT SCENE: "取得了好成绩" (Achieved Good Results / Top Grades) -->
  <!-- Floating Achievement Card / Certificate with Star -->
  <g transform="translate(160, 45)" filter="url(#softShadow)">
    <!-- Aura Glow -->
    <circle cx="20" cy="20" r="30" fill="url(#successGlow)" />
    
    <!-- Paper / Certificate Base -->
    <rect x="0" y="0" width="40" height="48" rx="6" fill="#ffffff" />
    <rect x="4" y="4" width="32" height="40" rx="3" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" />
    
    <!-- Miniature Grade Lines -->
    <line x1="10" y1="10" x2="30" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="15" x2="22" y2="15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

    <!-- Big Shiny Golden Star (Top Grade Symbol) -->
    <path d="M 20 22 
             L 22.4 27.2 
             L 28.1 28 
             L 24 32.1 
             L 25 37.8 
             L 20 35.2 
             L 15 37.8 
             L 16 32.1 
             L 11.9 28 
             L 17.6 27.2 Z" 
          fill="#fbbf24" stroke="#d97706" stroke-width="1" stroke-linejoin="round" />
  </g>

  <!-- Sparkle details near achievement -->
  <path d="M 215 30 L 217 35 L 222 37 L 217 39 L 215 44 L 213 39 L 208 37 L 213 35 Z" fill="#38bdf8" />
  <path d="M 152 75 L 153.2 77.8 L 156 79 L 153.2 80.2 L 152 83 L 150.8 80.2 L 148 79 L 150.8 77.8 Z" fill="#fbbf24" />

  <!-- Coffee Mug for late night study context props -->
  <rect x="52" y="148" width="14" height="16" rx="3" fill="#f8fafc" />
  <path d="M 66 152 C 70 152 70 160 66 162" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <!-- Steam wisps -->
  <path d="M 56 142 C 58 138 54 134 56 130" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

</svg>