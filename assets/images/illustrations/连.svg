<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    
    <!-- Couch Gradient -->
    <linearGradient id="couch-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Speech bubble gradient -->
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Room Interior Details -->
  <!-- Floor line & Floor -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- Background Bookshelf / Wall Props for context -->
  <rect x="25" y="60" width="45" height="130" rx="4" fill="#1e293b" opacity="0.6" />
  <line x1="25" y1="90" x2="70" y2="90" stroke="#334155" stroke-width="3" />
  <line x1="25" y1="130" x2="70" y2="130" stroke="#334155" stroke-width="3" />
  <line x1="25" y1="170" x2="70" y2="170" stroke="#334155" stroke-width="3" />
  <!-- Mini books -->
  <rect x="32" y="70" width="8" height="20" rx="1" fill="#f43f5e" />
  <rect x="42" y="68" width="10" height="22" rx="1" fill="#10b981" />
  <rect x="54" y="72" width="7" height="18" rx="1" fill="#fbbf24" />

  <!-- Plant Prop -->
  <path d="M195 190 L215 190 L210 145 L200 145 Z" fill="#475569" />
  <path d="M205 145 C190 130 185 110 190 95 C205 110 215 130 205 145 Z" fill="#10b981" />
  <path d="M205 145 C220 120 230 100 235 85 C220 105 210 125 205 145 Z" fill="#059669" />

  <!-- Main Scene: Cozy Couch -->
  <path d="M 60 140 C 60 125 75 120 120 120 C 165 120 180 125 180 140 L 185 190 L 55 190 Z" fill="url(#couch-grad)" />
  <!-- Couch Cushion Base -->
  <rect x="62" y="145" width="116" height="45" rx="8" fill="#0ea5e9" />
  <!-- Couch Arms -->
  <path d="M 50 110 C 50 105 65 105 70 115 L 70 190 L 50 190 Z" fill="#0284c7" />
  <path d="M 190 110 C 190 105 175 105 170 115 L 170 190 L 190 190 Z" fill="#0284c7" />

  <!-- Character (Hesitant/Silent) Sitting on Couch -->
  <!-- Legs -->
  <rect x="90" y="180" width="16" height="25" rx="6" fill="#334155" />
  <rect x="134" y="180" width="16" height="25" rx="6" fill="#334155" />
  <!-- Shoes -->
  <ellipse cx="98" cy="205" rx="12" ry="5" fill="#0f172a" />
  <ellipse cx="142" cy="205" rx="12" ry="5" fill="#0f172a" />

  <!-- Torso -->
  <path d="M 85 115 C 85 100 155 100 155 115 L 160 160 C 160 165 155 170 150 170 L 90 170 C 85 170 80 165 80 160 Z" fill="url(#shirt-grad)" />
  <!-- Collar -->
  <path d="M 105 115 L 120 125 L 135 115" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Arms (Crossed defensively or resting rigidly to show "not a single word spoken") -->
  <path d="M 90 125 C 100 135 140 135 150 125" fill="none" stroke="#ea580c" stroke-width="14" stroke-linecap="round" />
  <!-- Hands tucked under arms -->
  <circle cx="95" cy="130" r="7" fill="#fb923c" />
  <circle cx="145" cy="130" r="7" fill="#fb923c" />

  <!-- Neck -->
  <rect x="110" y="98" width="20" height="20" fill="#fbcfe8" rx="4" />

  <!-- Head -->
  <circle cx="120" cy="85" r="24" fill="#fed7aa" />

  <!-- Hair Style -->
  <path d="M 97 85 C 96 65 110 58 120 58 C 135 58 144 68 144 85 C 140 82 135 80 120 80 C 105 80 100 82 97 85 Z" fill="#334155" />
  <circle cx="102" cy="74" r="5" fill="#334155" />

  <!-- Facial Expression: Tight-lipped silence ("ngay cả một câu cũng không nói") -->
  <!-- Eyes: Wide, attentive, blinking/apprehensive -->
  <circle cx="110" cy="83" r="3" fill="#0f172a" />
  <circle cx="130" cy="83" r="3" fill="#0f172a" />
  <!-- Eyebrows slightly arched/tense -->
  <path d="M 106 77 L 114 78" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 126 78 L 134 77" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

  <!-- Tight closed mouth (Flat line indicating absolute silence) -->
  <line x1="114" y1="96" x2="126" y2="96" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Blush marks -->
  <ellipse cx="103" cy="90" rx="4" ry="2" fill="#f87171" opacity="0.4" />
  <ellipse cx="137" cy="90" rx="4" ry="2" fill="#f87171" opacity="0.4" />

  <!-- Empty / Silent Speech Bubble (Visualizing "Not even a single word") -->
  <g transform="translate(130, 25)">
    <!-- Main bubble shape -->
    <path d="M 10 25 C 10 10 25 5 45 5 C 65 5 80 10 80 25 C 80 40 65 45 45 45 C 38 45 32 43 27 40 L 15 48 L 18 37 C 12 34 10 30 10 25 Z" fill="url(#bubble-grad)" stroke="#94a3b8" stroke-width="2" />
    
    <!-- Inside the bubble: A stark empty graphic / ellipsis or crossed-out text symbol (purely visual, no text) -->
    <!-- Sound wave muted / flatline icon inside bubble -->
    <path d="M 25 25 L 35 25 L 38 18 L 42 32 L 46 22 L 50 28 L 53 25 L 65 25" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
    <!-- Red X over the sound wave to strictly represent "even a single word is absent" -->
    <line x1="30" y1="15" x2="60" y2="35" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="15" x2="30" y2="35" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Accent Floating Elements representing absolute silence/stillness -->
  <circle cx="65" cy="80" r="3" fill="#38bdf8" opacity="0.6" />
  <circle cx="50" cy="95" r="2" fill="#38bdf8" opacity="0.4" />
  <circle cx="185" cy="70" r="4" fill="#fbbf24" opacity="0.5" />
  <circle cx="175" cy="55" r="2" fill="#fbbf24" opacity="0.3" />

</svg>