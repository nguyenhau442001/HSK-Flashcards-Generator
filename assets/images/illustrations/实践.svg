<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Workshop Environment (Context for "Practice / 实践") -->
  <!-- Floor and Wall Grid -->
  <path d="M0 170 L240 170" stroke="#334155" stroke-width="2"/>
  <path d="M0 200 L240 200" stroke="#1e293b" stroke-width="3"/>
  
  <!-- Ambient light from blueprint projection / window -->
  <polygon points="120,40 210,170 30,170" fill="url(#beamGrad)" />

  <!-- Background Workshop Details: Shelves and Theoretical Blueprints -->
  <g opacity="0.6">
    <!-- Shelf -->
    <rect x="25" y="60" width="85" height="4" rx="2" fill="#475569"/>
    <!-- Books/Binders on shelf (Theory) -->
    <rect x="35" y="38" width="10" height="22" rx="2" fill="#f59e0b"/>
    <rect x="47" y="34" width="14" height="26" rx="2" fill="#38bdf8"/>
    <rect x="63" y="42" width="8" height="18" rx="2" fill="#ec4899"/>
    <rect x="73" y="36" width="12" height="24" rx="2" fill="#10b981"/>

    <!-- Blueprint Board on Wall (Theory / Formulas) -->
    <rect x="135" y="30" width="75" height="55" rx="4" fill="url(#boardGlow)" stroke="#475569" stroke-width="1.5"/>
    <!-- Abstract technical diagrams (Theory) -->
    <circle cx="155" cy="50" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2"/>
    <path d="M175 45 L195 45 M175 55 L190 55 M175 65 L185 65" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="140,72 150,62 160,68 175,52" fill="none" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- Workbench (Connecting Theory to Practice) -->
  <path d="M20 170 L220 170 L210 210 L30 210 Z" fill="#334155"/>
  <rect x="25" y="165" width="190" height="7" rx="3" fill="#64748b"/>
  <!-- Workbench Legs -->
  <rect x="45" y="210" width="12" height="20" fill="#1e293b"/>
  <rect x="183" y="210" width="12" height="20" fill="#1e293b"/>

  <!-- Foreground Props: Tools of Practice (Gears, Circuits, Robotic Arm) -->
  <!-- Soldering station / Tool holder -->
  <rect x="175" y="130" width="22" height="38" rx="3" fill="#475569"/>
  <path d="M180 130 C180 120 192 120 192 130" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="186" cy="142" r="5" fill="#ef4444"/>

  <!-- Electronic breadboard with glowing circuit / prototype -->
  <rect x="40" y="155" width="55" height="15" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <!-- Glowing wires -->
  <path d="M48 155 Q55 145 65 155" fill="none" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
  <circle cx="65" cy="155" r="3" fill="#fbbf24"/>

  <!-- MAIN CHARACTER: Engineer / Inventor actively practicing/building -->
  <g id="character">
    <!-- Character Body & Torso (Leaning forward with focus) -->
    <path d="M110 125 C105 110 115 95 125 90 C135 85 145 95 148 110 L155 155 L105 155 Z" fill="#38bdf8"/>
    <!-- Apron (Practical workwear) -->
    <path d="M115 105 L143 105 L148 165 L112 165 Z" fill="#f59e0b"/>
    <path d="M123 105 L123 125 M135 105 L135 125" stroke="#d97706" stroke-width="2"/>

    <!-- Head & Face (Focused expression) -->
    <circle cx="132" cy="74" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M118 72 C118 60 144 60 146 72 C142 66 122 66 118 72 Z" fill="#1e293b"/>
    <!-- Safety Goggles pushed up on forehead -->
    <rect x="120" y="62" width="24" height="8" rx="3" fill="#0ea5e9" opacity="0.8"/>
    <circle cx="126" cy="66" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="138" cy="66" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Left Arm & Hand (Holding tool / Adjusting mechanism) -->
    <path d="M115 105 L95 130 L105 138 L122 120" fill="#38bdf8"/>
    <!-- Hand -->
    <circle cx="98" cy="138" r="5" fill="#fbcfe8"/>

    <!-- Right Arm & Hand (Actively assembling/soldering) -->
    <path d="M142 105 L162 125 L152 135 L135 120" fill="#38bdf8"/>
    <!-- Tool in hand (Screwdriver / Soldering iron) -->
    <path d="M158 132 L178 152" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M174 148 L180 154" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/>
    <!-- Hand -->
    <circle cx="156" cy="131" r="5" fill="#2563eb"/>
  </g>

  <!-- The Product of Practice: A glowing miniature robot/device being built -->
  <g id="prototype-device" transform="translate(115, 130)">
    <!-- Robot Body -->
    <rect x="-10" y="-12" width="20" height="18" rx="4" fill="#10b981"/>
    <!-- Glowing Visor / Eye -->
    <rect x="-6" y="-8" width="12" height="4" rx="2" fill="#38bdf8" filter="url(#glow)"/>
    <!-- Little Mechanical Arms -->
    <path d="M-10 -4 L-16 0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 -4 L16 0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Wheels/Base -->
    <circle cx="-6" cy="8" r="4" fill="#334155"/>
    <circle cx="6" cy="8" r="4" fill="#334155"/>
    <!-- Sparkles of successful creation -->
    <path d="M0 -22 L2 -17 L7 -15 L2 -13 L0 -8 L-2 -13 L-7 -15 L-2 -17 Z" fill="#fbbf24" filter="url(#glow)"/>
    <path d="M15 -18 L16 -15 L19 -14 L16 -13 L15 -10 L14 -13 L11 -14 L14 -15 Z" fill="#38bdf8" transform="scale(0.7) translate(10, -5)" filter="url(#glow)"/>
  </g>

  <!-- Additional Narrative Elements on Desk -->
  <!-- Coffee Mug (Late night working/practicing) -->
  <rect x="78" y="145" width="12" height="16" rx="2" fill="#ec4899"/>
  <path d="M90 149 C94 149 94 157 90 157" fill="none" stroke="#ec4899" stroke-width="2"/>
  <path d="M82 142 Q84 137 86 142" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>

  <!-- Gears scattered (representing trial and error / process) -->
  <g transform="translate(185, 175)" fill="#64748b">
    <circle cx="0" cy="0" r="8"/>
    <circle cx="0" cy="0" r="3" fill="#1e293b"/>
    <rect x="-2" y="-11" width="4" height="22" rx="1"/>
    <rect x="-11" y="-2" width="22" height="4" rx="1"/>
  </g>
  <g transform="translate(205, 185) scale(0.7)" fill="#cbd5e1">
    <circle cx="0" cy="0" r="8"/>
    <circle cx="0" cy="0" r="3" fill="#1e293b"/>
    <rect x="-2" y="-11" width="4" height="22" rx="1"/>
    <rect x="-11" y="-2" width="22" height="4" rx="1"/>
  </g>

</svg>