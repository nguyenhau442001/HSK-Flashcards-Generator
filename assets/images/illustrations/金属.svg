<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldBarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Light Beams -->
  <polygon points="120,40 70,200 110,200" fill="url(#beamGrad)" />
  <polygon points="120,40 130,200 170,200" fill="url(#beamGrad)" />

  <!-- Environment: Jeweler's Workbench / Vault Interior -->
  <!-- Back Wall & Display Shelf -->
  <rect x="40" y="80" width="160" height="6" rx="3" fill="#334155" />
  <rect x="70" y="55" width="100" height="25" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <!-- Display lights inside shelf -->
  <circle cx="90" cy="62" r="3" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="150" cy="62" r="3" fill="#fbbf24" filter="url(#glow)" />

  <!-- Vault/Desk Surface -->
  <path d="M 20,190 L 220,190 L 205,215 L 35,215 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <rect x="35" y="185" width="170" height="6" rx="2" fill="#334155" />

  <!-- Background Props: Displayed Precious Metal Bars/Ingots -->
  <polygon points="85,68 105,68 100,75 90,75" fill="url(#goldBarGrad)" />
  <polygon points="135,68 155,68 150,75 140,75" fill="url(#goldBarGrad)" />

  <!-- Main Subject: Appraiser / Jeweler Character -->
  <!-- Body/Torso -->
  <path d="M 90,190 Q 90,150 120,150 Q 150,150 150,190 Z" fill="#0284c7" />
  <path d="M 105,150 L 120,170 L 135,150 Z" fill="#f8fafc" /> <!-- Collar/Shirt -->

  <!-- Head & Face -->
  <circle cx="120" cy="125" r="18" fill="#ffedd5" />
  <!-- Hair -->
  <path d="M 102,125 Q 105,105 120,105 Q 135,105 138,125 Q 135,112 120,111 Q 105,112 102,125 Z" fill="#334155" />
  <!-- Eye/Expression (Focused, squinting through loupe) -->
  <circle cx="127" cy="124" r="2" fill="#1e293b" />
  <path d="M 123,121 Q 127,119 131,121" stroke="#1e293b" stroke-width="1.5" fill="none" />
  <!-- Jeweler's Loupe on Eye -->
  <circle cx="127" cy="124" r="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="127" cy="124" r="3.5" fill="#38bdf8" opacity="0.6" />

  <!-- Arms & Hands Inspecting the Precious Metal -->
  <!-- Left Arm -->
  <path d="M 95,160 Q 95,185 110,185" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
  <!-- Right Arm holding loupe/metal -->
  <path d="M 145,165 Q 140,180 130,178" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
  <circle cx="127" cy="175" r="5" fill="#ffedd5" />

  <!-- Central Focus: The Precious Metal (Gold Ingot / Bar on velvet cushion) -->
  <!-- Velvet Stand / Cushion -->
  <path d="M 90,195 L 150,195 L 140,185 L 100,185 Z" fill="#881337" />
  
  <!-- The Precious Metal Ingot (Main Target Illustration) -->
  <g transform="translate(102, 172)">
    <!-- Shadow -->
    <ellipse cx="18" cy="15" rx="16" ry="4" fill="#000000" opacity="0.4" />
    <!-- Ingot Body -->
    <polygon points="6,12 30,12 34,4 2,4" fill="#fcd34d" />
    <polygon points="2,4 34,4 36,0 0,0" fill="#fef08a" />
    <polygon points="30,12 36,0 34,4 6,12" fill="#d97706" />
    <polygon points="6,12 0,0 2,4 30,12" fill="#fbbf24" />
    <!-- Highlight Sparkle on Metal -->
    <polygon points="14,6 18,6 16,2 12,2" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Sparkle Effects indicating "Precious/Valuable" -->
  <g fill="#fbbf24" filter="url(#glow)">
    <path d="M 85,155 Q 85,165 75,165 Q 85,165 85,175 Q 85,165 95,165 Q 85,165 85,155 Z" />
    <path d="M 155,145 Q 155,152 148,152 Q 155,152 155,159 Q 155,152 162,152 Q 155,152 155,145 Z" />
    <circle cx="70" cy="180" r="1.5" fill="#fff" />
    <circle cx="165" cy="175" r="2" fill="#fff" />
  </g>

  <!-- Foreground Atmospheric Vignette / Lighting Frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15" />
</svg>