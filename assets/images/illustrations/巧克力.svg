<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Ambiance Glow -->
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Wooden Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33180c"/>
      <stop offset="100%" stop-color="#1a0c06"/>
    </linearGradient>

    <!-- Chocolate Bar Gradients -->
    <linearGradient id="choc-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2511"/>
      <stop offset="100%" stop-color="#2c1409"/>
    </linearGradient>
    <linearGradient id="choc-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#381b0c"/>
      <stop offset="100%" stop-color="#1a0c06"/>
    </linearGradient>
    <linearGradient id="choc-highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Wrapper Gradients -->
    <linearGradient id="foil-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    
    <linearGradient id="wrapper-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <linearGradient id="wrapper-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#glow)"/>

  <!-- Background Kitchen/Cafe Elements -->
  <g opacity="0.3">
    <!-- Warm Bokeh Circles -->
    <circle cx="40" cy="50" r="16" fill="#fbbf24" filter="blur(4px)"/>
    <circle cx="200" cy="70" r="22" fill="#f43f5e" filter="blur(6px)"/>
    <circle cx="180" cy="30" r="10" fill="#38bdf8" filter="blur(4px)"/>
    
    <!-- Shelf line -->
    <path d="M 20 90 L 220 90" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Jar/Container on shelf -->
    <rect x="175" y="60" width="24" height="30" rx="4" fill="#475569"/>
    <path d="M 181 60 L 193 60 L 195 56 L 179 56 Z" fill="#94a3b8"/>
  </g>

  <!-- Wooden Table Surface -->
  <path d="M 0 160 L 240 160 L 240 225 C 240 233.284 233.284 240 225 240 L 15 240 C 6.71573 240 0 233.284 0 225 Z" fill="url(#table-grad)" filter="url(#shadow)"/>
  <path d="M 0 162 L 240 162" stroke="#451a03" stroke-width="2"/>

  <!-- SCENE PROPS & ACTION CONTEXT -->

  <!-- Ceramic Mug with Hot Cocoa / Steam -->
  <g transform="translate(165, 120)" filter="url(#soft-shadow)">
    <!-- Mug Handle -->
    <path d="M 22 8 C 32 8 32 24 22 26" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
    <!-- Mug Body -->
    <path d="M 0 0 L 22 0 C 24 22 24 26 22 34 C 18 36 4 36 0 34 Z" fill="#38bdf8"/>
    <!-- Mug Inner / Liquid -->
    <ellipse cx="11" cy="2" rx="11" ry="3" fill="#0284c7"/>
    <ellipse cx="11" cy="3" rx="9" ry="2" fill="#451a03"/>
    <!-- Steam wisps -->
    <path d="M 6 -5 Q 10 -12 6 -18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M 16 -8 Q 12 -15 16 -22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Glass Jar with Chocolate Chips / Toppings -->
  <g transform="translate(25, 115)" filter="url(#soft-shadow)">
    <!-- Jar Lid -->
    <rect x="6" y="-6" width="22" height="8" rx="2" fill="#cbd5e1"/>
    <!-- Jar Body -->
    <rect x="2" y="2" width="30" height="42" rx="6" fill="#94a3b8" fill-opacity="0.2" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Choc drops inside -->
    <circle cx="12" cy="30" r="4" fill="#381b0c"/>
    <circle cx="22" cy="34" r="4.5" fill="#4a2511"/>
    <circle cx="17" cy="22" r="4" fill="#2c1409"/>
    <circle cx="10" cy="15" r="3.5" fill="#381b0c"/>
  </g>

  <!-- MAIN SUBJECT: CHOCOLATE (巧克力) -->
  
  <!-- Opened Wrapper Foil (Background accent) -->
  <g filter="url(#shadow)">
    <!-- Crinkled Foil Base -->
    <path d="M 65 185 L 80 150 L 105 170 L 130 145 L 155 175 L 175 155 L 180 185 Z" fill="url(#foil-gold)"/>
  </g>

  <!-- Chocolate Bar (Main Stack / Perspective View) -->
  <g transform="translate(60, 85)" filter="url(#shadow)">
    
    <!-- Outer Wrapper (Red & Cream dynamic sleeve peeled back) -->
    <path d="M 15 85 L 15 40 L 105 10 L 105 55 Z" fill="url(#wrapper-red)"/>
    <path d="M 15 40 L 60 25 L 105 10 L 60 55 Z" fill="url(#wrapper-cream)" opacity="0.9"/>
    <path d="M 60 25 L 60 55 L 105 55 L 105 10 Z" fill="url(#wrapper-red)"/>

    <!-- Chocolate Bar Body (Isometric-ish Rectangular Block) -->
    <!-- Right Side Face -->
    <path d="M 105 40 L 105 85 L 120 75 L 120 30 Z" fill="url(#choc-side)"/>
    
    <!-- Top Face (Grid of Chocolate Squares) -->
    <path d="M 15 40 L 105 10 L 120 30 L 30 60 Z" fill="url(#choc-main)"/>
    
    <!-- Front Face -->
    <path d="M 15 40 L 30 60 L 30 105 L 15 85 Z" fill="url(#choc-side)"/>

    <!-- Grid Lines & Embossed Sections on Top Face -->
    <!-- Longitudinal groove -->
    <line x1="60" y1="20" x2="75" y2="45" stroke="#2c1409" stroke-width="2"/>
    <!-- Transverse grooves -->
    <line x1="37" y1="45" x2="82" y2="30" stroke="#2c1409" stroke-width="2"/>
    <line x1="52" y1="50" x2="97" y2="35" stroke="#2c1409" stroke-width="2"/>
    
    <!-- Shiny Specular Highlight -->
    <path d="M 20 44 L 95 18 L 100 24 L 25 50 Z" fill="url(#choc-highlight)"/>

    <!-- Broken Off Chocolate Piece (Foreground Action) -->
    <g transform="translate(75, 45)" filter="url(#soft-shadow)">
      <!-- Right face of piece -->
      <path d="M 30 15 L 30 35 L 40 28 L 40 8 Z" fill="url(#choc-side)"/>
      <!-- Top face of piece -->
      <path d="M 5 10 L 30 15 L 40 8 L 15 3 Z" fill="url(#choc-main)"/>
      <!-- Front face of piece -->
      <path d="M 5 10 L 30 15 L 30 35 L 5 30 Z" fill="#381b0c"/>
      <!-- Highlight -->
      <path d="M 8 7 L 27 12 L 32 8 L 13 3 Z" fill="url(#choc-highlight)"/>
    </g>

    <!-- Stray Chocolate Chunks / Crumbs -->
    <path d="M 115 95 L 122 92 L 125 98 L 118 101 Z" fill="#381b0c" filter="url(#soft-shadow)"/>
    <path d="M 5 90 L 12 88 L 14 94 L 8 96 Z" fill="#2c1409" filter="url(#soft-shadow)"/>
    <circle cx="128" cy="85" r="2.5" fill="#4a2511"/>
    <circle cx="135" cy="88" r="1.5" fill="#381b0c"/>

  </g>

  <!-- Atmospheric Lighting & Sparkles (To enhance vector polish) -->
  <g>
    <!-- Sparkle top right -->
    <path d="M 195 45 C 195 45 195 55 195 55 C 195 55 185 55 185 55 C 185 55 195 55 195 55 C 195 55 195 65 195 65 C 195 65 205 55 205 55 C 205 55 195 55 195 55 Z" fill="#fde047" opacity="0.8"/>
    <!-- Sparkle near chocolate -->
    <path d="M 115 70 C 115 70 115 76 115 76 C 115 76 109 76 109 76 C 109 76 115 76 115 76 C 115 76 115 82 115 82 C 115 82 121 76 121 76 C 121 76 115 76 115 76 Z" fill="#f59e0b" opacity="0.9"/>
  </g>

</svg>