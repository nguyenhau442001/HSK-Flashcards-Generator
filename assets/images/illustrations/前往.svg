<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Stars -->
  <circle cx="30" cy="40" r="1" fill="#f8fafc"/>
  <circle cx="200" cy="30" r="1.5" fill="#f8fafc"/>
  <circle cx="150" cy="80" r="1" fill="#f8fafc"/>
  <circle cx="40" cy="180" r="1.2" fill="#f8fafc"/>
  
  <!-- Rocket/Spacecraft -->
  <path d="M120 180 L140 180 L135 120 L125 120 Z" fill="#94a3b8"/>
  <path d="M130 120 L145 100 L115 100 L130 120 Z" fill="#fb923c"/>
  <circle cx="130" cy="145" r="8" fill="#38bdf8" opacity="0.6"/>
  
  <!-- Astronaut -->
  <g transform="translate(110, 60)">
    <circle cx="20" cy="20" r="15" fill="#e2e8f0"/>
    <path d="M10 20 A 10 10 0 0 1 30 20" fill="#1e293b"/>
    <rect x="10" y="35" width="20" height="25" rx="4" fill="#f1f5f9"/>
    <rect x="12" y="37" width="16" height="8" rx="2" fill="#38bdf8"/>
    <path d="M10 45 L5 60 M30 45 L35 60" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Launch Pad / Ground -->
  <path d="M0 210 L240 210 L240 240 L0 240 Z" fill="#334155"/>
  <rect x="110" y="210" width="40" height="30" fill="#475569"/>
  
  <!-- Exhaust/Thrust -->
  <path d="M125 180 L135 180 L145 220 L115 220 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M128 180 L132 180 L135 205 L125 205 Z" fill="#f59e0b"/>
  
  <!-- Planet/Moon -->
  <circle cx="200" cy="180" r="25" fill="#64748b"/>
  <circle cx="210" cy="170" r="5" fill="#475569"/>
</svg>