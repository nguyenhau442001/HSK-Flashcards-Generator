<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="productGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Office Environment & Decor -->
  <path d="M0 170 L240 170" stroke="#334155" stroke-width="2"/>
  <!-- Window city view background -->
  <path d="M150 40 L210 40 L210 120 L150 120 Z" fill="#090d16" stroke="#334155" stroke-dasharray="4 4"/>
  <path d="M165 55 L175 75 L170 95 L185 110" stroke="#1e293b" stroke-width="3" fill="none"/>
  <path d="M195 50 L185 80 L200 100" stroke="#1e293b" stroke-width="2" fill="none"/>

  <!-- Presentation Screen / Projector Wall -->
  <rect x="25" y="35" width="115" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="30" y="40" width="105" height="75" rx="4" fill="url(#screenGlow)"/>
  <!-- Marketing Graphic on Screen (Pie chart, growth bars - no text) -->
  <path d="M45 95 L60 75 L75 85 L95 55 L110 65" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="95" cy="55" r="3" fill="#f43f5e"/>
  <circle cx="110" cy="65" r="3" fill="#10b981"/>
  <path d="M 60 100 L 60 90 M 75 100 L 75 80 M 90 100 L 90 70" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Spotlight Cone -->
  <path d="M120 0 L50 170 L190 170 Z" fill="url(#productGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Desk & Props -->
  <path d="M20 170 L220 170 L210 205 L30 205 Z" fill="#334155"/>
  <path d="M20 170 L220 170 L225 177 L15 177 Z" fill="#475569"/>

  <!-- Laptop on Desk -->
  <path d="M135 155 L175 155 L185 170 L125 170 Z" fill="#94a3b8"/>
  <path d="M130 135 L180 135 L175 155 L135 155 Z" fill="#cbd5e1"/>
  <path d="M140 140 L170 140 L168 150 L142 150 Z" fill="#0ea5e9"/>

  <!-- NEW PRODUCT PEDESTAL & HIGHLIGHTED PRODUCT (The "New Product" being promoted) -->
  <ellipse cx="80" cy="170" rx="25" ry="8" fill="#10b981" opacity="0.4" filter="url(#glow)"/>
  <path d="M65 170 L95 170 L90 155 L70 155 Z" fill="#64748b"/>
  <!-- Stylized Innovative Product Box/Device with Glow -->
  <rect x="70" y="125" width="20" height="32" rx="4" fill="#fb923c" stroke="#fed7aa" stroke-width="1.5"/>
  <circle cx="80" cy="135" r="4" fill="#f43f5e"/>
  <path d="M75 145 L85 145" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Sparkles around new product to show it's novel/promoted -->
  <path d="M60 140 L64 142 L66 146 L68 142 L72 140 L68 138 L66 134 L64 138 Z" fill="#facc15"/>
  <path d="M96 120 L98 123 L101 125 L98 127 L96 130 L94 127 L91 125 L94 123 Z" fill="#facc15"/>

  <!-- Character 1: Presenter / Marketer pointing at the product/screen -->
  <!-- Body/Torso -->
  <path d="M185 140 C195 150 200 175 200 205 L160 205 C160 180 165 155 175 140 Z" fill="#4f46e5"/>
  <!-- Arm pointing -->
  <path d="M185 145 C170 150 120 135 100 140 C95 141 95 145 100 146 C120 140 170 160 185 155 Z" fill="#6366f1"/>
  <!-- Head -->
  <circle cx="190" cy="120" r="14" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M178 118 C178 110 185 105 195 107 C204 110 204 120 204 120 C204 120 195 112 185 115 Z" fill="#1e1b4b"/>
  <!-- Face expression: enthusiastic smile -->
  <path d="M192 125 Q196 129 200 125" stroke="#9f1239" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="196" cy="120" r="1.5" fill="#9f1239"/>

  <!-- Character 2: Colleague / Audience observing -->
  <!-- Body -->
  <path d="M35 155 C35 175 40 190 45 205 L15 205 C15 185 20 165 25 155 Z" fill="#0d9488"/>
  <!-- Head -->
  <circle cx="35" cy="135" r="12" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M24 133 C25 124 35 122 45 128 C41 125 30 125 24 133 Z" fill="#334155"/>
  <!-- Arm crossed holding chin (attentive gesture) -->
  <path d="M30 150 L45 155 L40 165 L30 160 Z" fill="#14b8a6"/>

  <!-- Marketing / Promotion floating icons (Megaphone / Broadcast waves) -->
  <path d="M110 85 C115 82 120 85 120 90 C120 95 115 98 110 95" stroke="#f43f5e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M115 78 C123 74 130 80 130 90 C130 100 123 106 115 102" stroke="#f43f5e" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Additional atmospheric warm light reflections -->
  <circle cx="80" cy="155" r="18" fill="#fbbf24" opacity="0.15" filter="url(#glow)"/>
</svg>