<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Hospital Bed -->
  <rect x="40" y="140" width="160" height="20" rx="4" fill="#64748b"/>
  <path d="M50 140 L60 100 L180 100 L190 140 Z" fill="#e2e8f0"/>
  
  <!-- Patient -->
  <circle cx="70" cy="90" r="12" fill="#fca5a5"/>
  <rect x="65" y="102" width="10" height="20" fill="#fca5a5"/>
  
  <!-- Doctor (The Action: 全力) -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-15 0 L15 0 L10 60 L-10 60 Z" fill="#f8fafc"/>
    <!-- Arms pushing down -->
    <path d="M-20 -10 L-40 20" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 -10 L40 20" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-25" r="15" fill="#fca5a5"/>
    <!-- Mask -->
    <rect x="-10" y="-20" width="20" height="10" rx="2" fill="#38bdf8"/>
  </g>
  
  <!-- Medical Equipment (Heart Monitor) -->
  <rect x="160" y="50" width="50" height="40" rx="4" fill="#334155"/>
  <path d="M165 70 L175 70 L180 60 L185 80 L190 70 L205 70" stroke="#10b981" stroke-width="2" fill="none"/>
  
  <!-- Ambient Glows -->
  <circle cx="120" cy="80" r="60" fill="#fbbf24" opacity="0.05"/>
  <circle cx="120" cy="80" r="30" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Floor/Shadow -->
  <ellipse cx="120" cy="200" rx="80" ry="10" fill="#000" opacity="0.3"/>
</svg>