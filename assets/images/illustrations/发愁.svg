<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="150" width="200" height="15" fill="#334155" rx="2"/>
  <rect x="40" y="165" width="10" height="75" fill="#475569"/>
  <rect x="190" y="165" width="10" height="75" fill="#475569"/>
  
  <!-- Papers -->
  <rect x="60" y="130" width="70" height="15" fill="#e2e8f0" transform="rotate(-5 95 137)"/>
  <rect x="110" y="125" width="60" height="15" fill="#cbd5e1" transform="rotate(8 140 132)"/>
  
  <!-- Character -->
  <g transform="translate(0, 20)">
    <!-- Body -->
    <path d="M80 180 Q120 170 160 180 L150 240 L90 240 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="120" cy="110" r="35" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M90 100 Q120 70 150 100 Q120 80 90 100" fill="#475569"/>
    <!-- Expression: Worried -->
    <path d="M105 105 Q110 95 115 105" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M125 105 Q130 95 135 105" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M110 125 Q120 132 130 125" stroke="#475569" stroke-width="2" fill="none"/>
    
    <!-- Arms resting on head -->
    <path d="M95 110 L70 90 L80 80 L105 100" fill="#fde68a"/>
    <path d="M145 110 L170 90 L160 80 L135 100" fill="#fde68a"/>
  </g>
  
  <!-- Lamp -->
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.2"/>
  <circle cx="180" cy="60" r="15" fill="#fb923c"/>
  <rect x="175" y="75" width="10" height="60" fill="#334155"/>
  
  <!-- Coffee Mug -->
  <rect x="170" y="130" width="25" height="20" fill="#ec4899" rx="3"/>
  <path d="M195 135 Q205 135 205 145" stroke="#ec4899" stroke-width="3" fill="none"/>
</svg>