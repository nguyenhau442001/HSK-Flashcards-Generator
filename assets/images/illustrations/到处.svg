<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Park Ground/Hill -->
  <path d="M 10 135 Q 100 115 190 135 L 190 190 L 10 190 Z" fill="#065f46" />
  <path d="M 10 145 Q 100 125 190 145 L 190 190 L 10 190 Z" fill="#047857" opacity="0.6"/>

  <!-- Path/Walkway -->
  <path d="M 80 190 Q 95 145 110 135" stroke="#334155" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Stylized Trees in Background -->
  <circle cx="45" cy="115" r="18" fill="#047857" />
  <rect x="42" y="125" width="6" height="18" fill="#334155" rx="3"/>

  <circle cx="155" cy="110" r="22" fill="#047857" />
  <rect x="152" y="120" width="6" height="20" fill="#334155" rx="3"/>

  <circle cx="130" cy="120" r="15" fill="#059669" />
  <rect x="128" y="128" width="5" height="15" fill="#334155" rx="2.5"/>

  <!-- Bench -->
  <rect x="115" y="132" width="30" height="4" fill="#94a3b8" rx="2"/>
  <rect x="118" y="136" width="3" height="10" fill="#64748b"/>
  <rect x="140" y="136" width="3" height="10" fill="#64748b"/>

  <!-- Flowers "Khắp nơi" (Scattered Everywhere) - Pink, Yellow, Orange -->
  <!-- Flower group 1 (Left low) -->
  <circle cx="30" cy="150" r="4" fill="#fb7185"/>
  <circle cx="30" cy="150" r="1.5" fill="#fde047"/>
  <circle cx="22" cy="158" r="3.5" fill="#f43f5e"/>
  <circle cx="22" cy="158" r="1" fill="#fde047"/>
  <circle cx="42" cy="155" r="4" fill="#fb923c"/>
  <circle cx="42" cy="155" r="1.5" fill="#fde047"/>

  <!-- Flower group 2 (Mid ground) -->
  <circle cx="65" cy="138" r="3.5" fill="#f43f5e"/>
  <circle cx="65" cy="138" r="1" fill="#fde047"/>
  <circle cx="55" cy="145" r="4" fill="#fb923c"/>
  <circle cx="55" cy="145" r="1.5" fill="#fde047"/>
  <circle cx="75" cy="148" r="4" fill="#fb7185"/>
  <circle cx="75" cy="148" r="1.5" fill="#fde047"/>

  <!-- Flower group 3 (Right low) -->
  <circle cx="160" cy="155" r="4" fill="#fb7185"/>
  <circle cx="160" cy="155" r="1.5" fill="#fde047"/>
  <circle cx="172" cy="150" r="3.5" fill="#f43f5e"/>
  <circle cx="172" cy="150" r="1" fill="#fde047"/>
  <circle cx="150" cy="165" r="4" fill="#fb923c"/>
  <circle cx="150" cy="165" r="1.5" fill="#fde047"/>

  <!-- Flower group 4 (Center path borders) -->
  <circle cx="65" cy="170" r="4" fill="#fb923c"/>
  <circle cx="65" cy="170" r="1.5" fill="#fde047"/>
  <circle cx="95" cy="155" r="3.5" fill="#fb7185"/>
  <circle cx="95" cy="155" r="1" fill="#fde047"/>
  <circle cx="125" cy="160" r="4" fill="#f43f5e"/>
  <circle cx="125" cy="160" r="1.5" fill="#fde047"/>

  <!-- Floating Petals/Sparkles for "Everywhere" vibe -->
  <path d="M 40 100 Q 42 103 45 100 Q 42 97 40 100 Z" fill="#fb7185" opacity="0.8"/>
  <path d="M 110 90 Q 112 93 115 90 Q 112 87 110 90 Z" fill="#fb923c" opacity="0.8"/>
  <path d="M 140 105 Q 142 108 145 105 Q 142 102 140 105 Z" fill="#fde047" opacity="0.8"/>
  <path d="M 75 115 Q 77 118 80 115 Q 77 112 75 115 Z" fill="#fb7185" opacity="0.8"/>

  <!-- Gentle Sun / Sky Accent -->
  <circle cx="160" cy="45" r="16" fill="#38bdf8" opacity="0.15"/>
  <circle cx="160" cy="45" r="10" fill="#fde047" opacity="0.2"/>
</svg>