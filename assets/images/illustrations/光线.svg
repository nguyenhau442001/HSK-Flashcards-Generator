<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window and Light Source -->
  <rect x="20" y="30" width="60" height="80" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
  <path d="M50 30 L50 110 M20 70 L80 70" stroke="#475569" stroke-width="2"/>
  
  <!-- Light Beam -->
  <polygon points="50,70 120,120 100,140" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Mirror -->
  <rect x="130" y="110" width="60" height="80" rx="8" fill="#94a3b8" stroke="#f8fafc" stroke-width="3"/>
  <rect x="135" y="115" width="50" height="70" rx="4" fill="#bae6fd" opacity="0.6"/>
  
  <!-- Reflected Light Beam -->
  <polygon points="160,150 210,80 230,100" fill="#fbbf24" opacity="0.8"/>
  <circle cx="220" cy="90" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="230" cy="80" r="2" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Character (Stylized) -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="15" fill="#fca5a5"/>
    <path d="M10 40 Q20 60 30 40" fill="none" stroke="#fca5a5" stroke-width="4" stroke-linecap="round"/>
    <rect x="10" y="50" width="20" height="40" rx="5" fill="#38bdf8"/>
    <path d="M5 60 L0 80 M35 60 L40 80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="15" cy="18" r="2" fill="#1e293b"/>
    <circle cx="25" cy="18" r="2" fill="#1e293b"/>
  </g>
  
  <!-- Table/Surface -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
</svg>