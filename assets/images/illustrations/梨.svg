<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting & interior backdrop -->
  <path d="M0 160 Q120 150 240 160 L240 240 L0 240 Z" fill="#1e293b"/>
  <circle cx="120" cy="80" r="90" fill="#334155" opacity="0.3"/>
  <circle cx="190" cy="50" r="30" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Window frame background element -->
  <rect x="30" y="30" width="60" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M60 30 V100 M30 65 H90" stroke="#334155" stroke-width="1.5"/>
  <circle cx="45" cy="45" r="8" fill="#38bdf8" opacity="0.2"/>

  <!-- Table/Counter Surface -->
  <path d="M10 185 L230 185 L240 240 L0 240 Z" fill="#090d16"/>
  <path d="M15 185 H225" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Plate / Bowl -->
  <ellipse cx="145" cy="185" rx="45" ry="12" fill="#cbd5e1"/>
  <ellipse cx="145" cy="183" rx="40" ry="9" fill="#f1f5f9"/>

  <!-- Pears (Target Word: 梨 - lí) on plate -->
  <!-- Pear 1 (Background/Whole) -->
  <g transform="translate(160, 160)">
    <path d="M0 5 C12 5 18 -10 10 -20 C2 -28 -8 -20 -10 -10 C-12 2 -8 5 0 5 Z" fill="#bef264"/>
    <path d="M3 -20 C6 -24 8 -28 10 -31 C8 -29 4 -28 2 -25 Z" fill="#3f6212"/>
    <circle cx="-3" cy="-5" r="1.5" fill="#65a30d" opacity="0.5"/>
    <circle cx="4" cy="-2" r="1" fill="#65a30d" opacity="0.4"/>
  </g>

  <!-- Pear 2 (Foreground/Main Subject - sliced/bitten) -->
  <g transform="translate(130, 162)">
    <path d="M-5 7 C14 7 20 -8 10 -20 C2 -28 -12 -18 -15 -5 C-18 6 -12 7 -5 7 Z" fill="#84cc16"/>
    <!-- Highlight -->
    <path d="M-8 -10 C-12 -2 -5 2 -2 -2 C-5 -6 -8 -10 -8 -10 Z" fill="#d9f99d" opacity="0.6"/>
    <!-- Stem -->
    <path d="M-2 -20 C-4 -25 -2 -30 2 -33 C0 -30 -1 -26 -1 -20 Z" fill="#365314"/>
    <!-- Bite mark detail -->
    <path d="M3 0 C9 2 12 -4 8 -8 C5 -11 0 -5 3 0 Z" fill="#ecfccb"/>
    <!-- Core / Seeds inside bite -->
    <ellipse cx="5" cy="-4" rx="2" ry="3" fill="#fef08a" opacity="0.8"/>
    <circle cx="5" cy="-4" r="0.8" fill="#713f12"/>
  </g>

  <!-- Character: Happy Person Eating/Enjoying -->
  <!-- Torso & Clothing -->
  <path d="M55 220 C55 190 70 170 95 170 C120 170 135 190 135 220 Z" fill="#38bdf8"/>
  <path d="M75 170 L95 195 L115 170" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linejoin="round"/> <!-- Collar -->

  <!-- Neck -->
  <rect x="85" y="148" rx="4" width="20" height="25" fill="#fed7aa"/>

  <!-- Head & Face -->
  <circle cx="95" cy="130" r="28" fill="#fed7aa"/>
  
  <!-- Hair Style -->
  <path d="M68 125 C68 100 80 95 98 95 C116 95 124 105 124 125 C124 135 120 130 118 120 C110 105 90 102 76 115 C72 120 68 125 68 125 Z" fill="#1e293b"/>

  <!-- Facial Expression: Happy/Satisfied with eyes closed in bliss (^ ^) -->
  <path d="M80 128 Q87 122 94 128" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M98 128 Q105 122 112 128" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Rosy Cheeks -->
  <circle cx="79" cy="135" r="5" fill="#fb7185" opacity="0.5"/>
  <circle cx="113" cy="135" r="5" fill="#fb7185" opacity="0.5"/>
  
  <!-- Big Happy Open Smile (Enjoying food) -->
  <path d="M88 139 C88 147 102 147 102 139 Z" fill="#9f1239"/>
  <!-- Tongue -->
  <path d="M91 143 C93 141 97 141 99 143 C99 145 91 145 91 143 Z" fill="#fb7185"/>

  <!-- Hand holding a pear slice or gesturing satisfaction -->
  <g transform="translate(105, 150)">
    <circle cx="15" cy="15" r="8" fill="#fed7aa"/>
    <path d="M15 7 L25 12 L20 22 L10 17 Z" fill="#84cc16"/> <!-- small pear slice in hand -->
  </g>

  <!-- Floating decorative elements (joy/freshness bubbles/sparkles) -->
  <g fill="#fbbf24">
    <circle cx="45" cy="140" r="3" opacity="0.8"/>
    <circle cx="35" cy="120" r="2" opacity="0.6"/>
    <circle cx="55" cy="100" r="4" opacity="0.9"/>
    <path d="M 35 150 L 37 144 L 43 142 L 37 140 L 35 134 L 33 140 L 27 142 L 33 144 Z" opacity="0.7"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="195" cy="110" r="3" opacity="0.8"/>
    <circle cx="210" cy="130" r="2" opacity="0.5"/>
    <path d="M 180 120 L 181 116 L 185 115 L 181 114 L 180 110 L 179 114 L 175 115 L 179 116 Z" opacity="0.6"/>
  </g>

</svg>