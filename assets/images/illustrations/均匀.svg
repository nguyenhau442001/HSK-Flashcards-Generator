<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wood Texture / Workbench Gradient -->
    <linearGradient id="benchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight -->
    <radialGradient id="spotlight" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Cream / Frosting Spread Gradient -->
    <linearGradient id="spreadGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Spotlight -->
  <circle cx="120" cy="110" r="100" fill="url(#spotlight)"/>

  <!-- Background Workshop Details (Shelf & Plants) -->
  <g opacity="0.6">
    <rect x="25" y="45" width="60" height="4" rx="2" fill="#475569"/>
    <!-- Little potted plant on shelf -->
    <path d="M45 45 L42 35 L58 35 L55 45 Z" fill="#64748b"/>
    <circle cx="50" cy="32" r="8" fill="#10b981"/>
    <circle cx="43" cy="30" r="6" fill="#059669"/>

    <!-- Kitchen/Studio Window frame -->
    <rect x="155" y="25" width="55" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="182" y1="25" x2="182" y2="70" stroke="#334155" stroke-width="2"/>
    <line x1="155" y1="47" x2="210" y2="47" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Workbench Surface -->
  <rect x="10" y="170" width="220" height="55" rx="8" fill="url(#benchGrad)" filter="url(#softShadow)"/>
  <rect x="10" y="170" width="220" height="6" fill="#475569" opacity="0.5"/>

  <!-- OBJECT BEING COATED: Ceramic Cake Stand & Cake/Pottery -->
  <g id="target-object" filter="url(#softShadow)">
    <!-- Stand Base -->
    <ellipse cx="120" cy="172" rx="35" ry="8" fill="#cbd5e1"/>
    <path d="M115 155 L125 155 L128 170 L112 170 Z" fill="#94a3b8"/>
    <!-- Plate -->
    <ellipse cx="120" cy="155" rx="55" ry="12" fill="#e2e8f0"/>
    <ellipse cx="120" cy="153" rx="52" ry="10" fill="#f8fafc"/>

    <!-- Cake Body -->
    <path d="M72 153 C72 130 168 130 168 153 Z" fill="#78350f"/>
    
    <!-- Evenly Spread Layer (The Core Visual Metaphor for "均匀") -->
    <!-- Smooth, perfectly layered coating representing "bôi đều" -->
    <path d="M70 143 C90 133 150 133 170 143 C173 152 168 156 168 156 C168 156 150 142 120 142 C90 142 72 156 72 156 C72 156 67 152 70 143 Z" fill="url(#spreadGrad)"/>
    
    <!-- Decorative uniform dots/sprinkles on the spread -->
    <circle cx="95" cy="140" r="2.5" fill="#fef08a"/>
    <circle cx="110" cy="138" r="2.5" fill="#fef08a"/>
    <circle cx="130" cy="138" r="2.5" fill="#fef08a"/>
    <circle cx="145" cy="140" r="2.5" fill="#fef08a"/>
  </g>

  <!-- CHARACTER: Artisanal Baker / Crafter -->
  <g id="character" filter="url(#softShadow)">
    <!-- Torso / Apron -->
    <path d="M85 220 L85 185 C85 175 95 165 105 165 L135 165 C145 165 155 175 155 185 L155 220 Z" fill="#f8fafc"/>
    <!-- Apron Straps & Pocket -->
    <path d="M98 165 L108 200 L132 200 L142 165" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <rect x="105" y="185" width="30" height="22" rx="4" fill="#e2e8f0"/>

    <!-- Neck & Head -->
    <path d="M112 150 L128 150 L130 168 L110 168 Z" fill="#fbcfe8"/>
    <circle cx="120" cy="135" r="22" fill="#fbcfe8"/>

    <!-- Hair -->
    <path d="M98 132 C98 118 108 112 120 112 C132 112 142 118 142 132 C142 138 140 145 140 145 L100 145 C100 145 98 138 98 132 Z" fill="#334155"/>
    <circle cx="120" cy="110" r="14" fill="#334155"/>

    <!-- Chef / Crafter Hat (Beret/Toque style) -->
    <ellipse cx="120" cy="104" rx="20" ry="10" fill="#ffffff"/>
    <path d="M102 104 C102 90 138 90 138 104 Z" fill="#ffffff"/>

    <!-- Facial Expression: Focused & Content Eyes (Arcs) -->
    <path d="M112 134 Q116 138 120 134" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <path d="M120 134 Q124 138 128 134" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="111" cy="138" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="129" cy="138" r="3" fill="#f43f5e" opacity="0.4"/>
    <!-- Gentle Smile -->
    <path d="M117 142 Q120 145 123 142" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms & Spatula Tool (Action of spreading smoothly) -->
    <!-- Left Arm -->
    <path d="M90 170 L75 145 L85 140" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm holding Spatula -->
    <path d="M150 175 L165 145 L155 130" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Spatula Hand & Tool -->
    <g transform="translate(145, 115) rotate(15)">
      <!-- Hand -->
      <circle cx="15" cy="20" r="6" fill="#fbcfe8"/>
      <!-- Spatula Handle -->
      <rect x="13" y="-15" width="4" height="35" rx="2" fill="#0284c7"/>
      <!-- Spatula Blade gliding smoothly across the cake -->
      <path d="M6 -22 C6 -26 24 -26 24 -22 L22 -12 C22 -10 8 -10 6 -12 Z" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Motion / Action Lines indicating smooth, even sweeping motion -->
  <g opacity="0.8">
    <path d="M95 120 Q120 110 145 122" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>
    <path d="M102 126 Q120 118 138 127" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Elements (Blurry warm sparkles for magic/quality feel) -->
  <circle cx="35" cy="115" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="205" cy="135" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="95" r="4" fill="#f43f5e" opacity="0.5"/>
</svg>