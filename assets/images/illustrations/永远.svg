<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Distant Mountains -->
  <path d="M0 160 L40 120 L80 160 L120 110 L160 160 L200 130 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The Ancient Tree (Symbol of Forever) -->
  <g transform="translate(120, 180)">
    <!-- Roots -->
    <path d="M-40 0 C-60 0 -80 10 -90 30 M40 0 C60 0 80 10 90 30" stroke="#78350f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Trunk -->
    <path d="M-10 0 L-10 -80 C-10 -120 10 -120 10 -80 L10 0" fill="#78350f"/>
    <!-- Canopy -->
    <circle cx="0" cy="-110" r="50" fill="#10b981"/>
    <circle cx="-30" cy="-100" r="35" fill="#059669"/>
    <circle cx="30" cy="-100" r="35" fill="#059669"/>
  </g>
  
  <!-- Floating Lanterns (Atmospheric depth) -->
  <circle cx="50" cy="60" r="4" fill="#fbbf24"/>
  <circle cx="190" cy="80" r="3" fill="#fbbf24"/>
  <circle cx="150" cy="40" r="5" fill="#fbbf24"/>
  
  <!-- Shooting Star/Comet Arc -->
  <path d="M20 20 Q100 20 140 80" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6"/>
  <circle cx="140" cy="80" r="3" fill="#38bdf8"/>
  
  <!-- Ground Details -->
  <ellipse cx="120" cy="220" rx="100" ry="15" fill="#0f172a" opacity="0.4"/>
  
  <!-- Moon -->
  <circle cx="200" cy="40" r="20" fill="#fef3c7"/>
  <circle cx="208" cy="32" r="20" fill="#1e293b"/>
</svg>