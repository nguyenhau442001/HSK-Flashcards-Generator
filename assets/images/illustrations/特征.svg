<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="110" r="90" fill="url(#glow-grad)"/>

  <!-- Environment: Workshop Desk & Interior -->
  <!-- Back Wall shelf / details -->
  <path d="M40 70 L200 70" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="70" cy="62" r="6" fill="#f59e0b" opacity="0.8"/>
  <rect x="95" y="52" width="12" height="18" rx="2" fill="#38bdf8" opacity="0.7"/>
  <rect x="115" y="46" width="16" height="24" rx="2" fill="#ec4899" opacity="0.7"/>

  <!-- Large Product Showcase Platform (The "Product" being analyzed) -->
  <rect x="70" y="155" width="100" height="12" rx="4" fill="#334155" filter="url(#shadow)"/>
  <rect x="85" y="145" width="70" height="10" rx="3" fill="#475569"/>

  <!-- The Smart Device / Product in Center -->
  <g transform="translate(95, 95)" filter="url(#shadow)">
    <!-- Main Device Body -->
    <rect x="0" y="0" width="50" height="55" rx="8" fill="#cbd5e1"/>
    <rect x="4" y="4" width="42" height="40" rx="4" fill="url(#screen-glow)" stroke="#64748b" stroke-width="2"/>
    
    <!-- UI Elements inside product screen (representing features/stats) -->
    <circle cx="25" cy="24" r="10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="15 5"/>
    <circle cx="25" cy="24" r="4" fill="#38bdf8"/>
    
    <!-- Base stand -->
    <path d="M18 55 L32 55 L28 65 L22 65 Z" fill="#64748b"/>
  </g>

  <!-- Feature Highlight Lines (Indicating multiple "特征" / characteristics) -->
  <!-- Top Indicator -->
  <path d="M120,90 L120,65 L145,55" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="145" cy="55" r="4" fill="#fbbf24" filter="url(#shadow)"/>
  <!-- Left Indicator -->
  <path d="M95,115 L65,115 L50,105" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="105" r="4" fill="#10b981" filter="url(#shadow)"/>
  <!-- Right Indicator -->
  <path d="M145,120 L175,120 L190,135" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="190" cy="135" r="4" fill="#ec4899" filter="url(#shadow)"/>

  <!-- Character: Designer/Analyst examining the product closely -->
  <g id="character">
    <!-- Character Body / Torso -->
    <path d="M 150 210 C 145 185, 175 185, 170 210 Z" fill="#3b82f6"/>
    <!-- Neck -->
    <rect x="157" y="172" width="6" height="15" fill="#fca5a5"/>
    <!-- Head Profile/Angle -->
    <circle cx="160" cy="158" r="16" fill="#fca5a5"/>
    <!-- Hair -->
    <path d="M 146 155 C 144 145, 165 140, 174 150 C 176 153, 172 165, 172 165 C 172 165, 155 168, 146 155 Z" fill="#1e293b"/>
    <!-- Glasses (Analyst look) -->
    <rect x="156" y="152" width="12" height="7" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="152" y1="155" x2="156" y2="155" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Arm & Hand pointing directly at one of the product's features -->
    <path d="M 155 190 C 140 185, 125 170, 115 150" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand/Finger -->
    <circle cx="113" cy="147" r="4" fill="#fca5a5"/>
  </g>

  <!-- Additional Foreground Details (Workspace props) -->
  <!-- Coffee Mug -->
  <rect x="40" y="175" width="16" height="20" rx="3" fill="#cbd5e1" filter="url(#shadow)"/>
  <path d="M 56 180 C 62 180, 62 190, 56 192" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam from mug -->
  <path d="M 45 168 C 47 164, 43 160, 45 156" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Clipboard / Data Pad on desk -->
  <g transform="translate(68, 170) rotate(-10)" filter="url(#shadow)">
    <rect x="0" y="0" width="30" height="38" rx="3" fill="#f8fafc"/>
    <rect x="9" y="-3" width="12" height="5" rx="1" fill="#94a3b8"/>
    <!-- Data lines on paper -->
    <line x1="6" y1="8" x2="24" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="20" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="22" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Checkmark icon on paper -->
    <path d="M 8 28 L 12 32 L 20 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>