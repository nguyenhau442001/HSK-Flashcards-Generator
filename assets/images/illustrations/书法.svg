<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#475569"/>
  <rect x="40" y="175" width="10" height="50" fill="#334155"/>
  <rect x="190" y="175" width="10" height="50" fill="#334155"/>
  
  <!-- Paper -->
  <rect x="60" y="80" width="120" height="150" rx="2" fill="#f8fafc"/>
  
  <!-- Ink Brush Strokes (Abstract shapes representing calligraphy) -->
  <path d="M80 100 Q 120 100 140 130 T 160 180" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M90 120 Q 100 160 130 200" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Character (Upper body) -->
  <circle cx="120" cy="60" r="25" fill="#fcd34d"/>
  <path d="M80 120 C 80 90 160 90 160 120 L 150 160 L 90 160 Z" fill="#38bdf8"/>
  
  <!-- Arm and Brush -->
  <path d="M140 110 L 160 130" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
  <rect x="158" y="128" width="4" height="20" fill="#fb923c"/>
  <circle cx="160" cy="148" r="3" fill="#0f172a"/>
  
  <!-- Ink Stone -->
  <rect x="170" y="140" width="30" height="20" rx="2" fill="#334155"/>
  <circle cx="185" cy="150" r="8" fill="#0f172a"/>
  
  <!-- Decorative Accent -->
  <circle cx="210" cy="40" r="5" fill="#ec4899" opacity="0.6"/>
  <circle cx="30" cy="50" r="8" fill="#10b981" opacity="0.4"/>
</svg>