<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Interior Elements -->
  <rect x="20" y="140" width="200" height="100" fill="#334155" rx="8"/>
  <path d="M40 140 L40 60 L200 60 L200 140" fill="none" stroke="#475569" stroke-width="4"/>
  
  <!-- Window -->
  <rect x="70" y="70" width="100" height="60" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <line x1="120" y1="70" x2="120" y2="130" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Character (The Subject) -->
  <g transform="translate(120, 160)">
    <!-- Body -->
    <path d="M-20 40 Q0 20 20 40 L15 80 L-15 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <!-- Expression -->
    <circle cx="-8" cy="-5" r="3" fill="#1e293b"/>
    <circle cx="8" cy="-5" r="3" fill="#1e293b"/>
    <path d="M-8 10 Q0 18 8 10" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Arm reaching out -->
    <path d="M20 20 L40 10" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Props: Making it feel like home -->
  <!-- Plant -->
  <path d="M30 140 L30 110 M30 110 L20 90 M30 110 L40 90" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <circle cx="20" cy="90" r="6" fill="#10b981"/>
  <circle cx="40" cy="90" r="6" fill="#10b981"/>
  
  <!-- Book/Personal item -->
  <rect x="160" y="150" width="30" height="20" fill="#ec4899" rx="2"/>
  
  <!-- Cozy Lamp -->
  <path d="M180 140 L180 100" stroke="#fb923c" stroke-width="4"/>
  <path d="M160 100 L200 100 L190 70 L170 70 Z" fill="#fbbf24"/>
  
  <!-- Floor rug -->
  <rect x="50" y="210" width="140" height="10" fill="#fb923c" rx="5"/>
</svg>