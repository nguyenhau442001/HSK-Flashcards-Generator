<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Desk -->
  <rect x="0" y="150" width="240" height="90" fill="#334155"/>
  <rect x="0" y="145" width="240" height="5" fill="#475569"/> <!-- Desk edge -->

  <!-- Character (seated) -->
  <!-- Body -->
  <path d="M120 145 C100 145 90 120 90 100 L90 70 C90 50 100 40 120 40 C140 40 150 50 150 70 L150 100 C150 120 140 145 120 145 Z" fill="#10b981"/>
  <!-- Head -->
  <circle cx="120" cy="55" r="20" fill="#fbbf24"/>
  <!-- Hair -->
  <path d="M105 38 C100 30 110 25 120 25 C130 25 140 30 135 38 L130 45 C135 50 135 60 130 65 L120 65 C110 65 105 60 105 55 Z" fill="#64748b"/>
  <!-- Eyes -->
  <circle cx="112" cy="52" r="2" fill="#0f172a"/>
  <circle cx="128" cy="52" r="2" fill="#0f172a"/>
  <!-- Mouth -->
  <path d="M115 60 Q120 63 125 60" stroke="#0f172a" stroke-width="1.5" fill="none"/>

  <!-- Left Arm -->
  <path d="M100 100 Q95 110 90 120 L95 125 Q100 115 105 105 Z" fill="#10b981"/>
  <!-- Right Arm -->
  <path d="M140 100 Q145 110 150 120 L145 125 Q140 115 135 105 Z" fill="#10b981"/>

  <!-- Hands (poised over keyboard/trackpad) -->
  <circle cx="105" cy="135" r="7" fill="#fbbf24"/>
  <circle cx="135" cy="135" r="7" fill="#fbbf24"/>

  <!-- Laptop -->
  <!-- Laptop base -->
  <rect x="60" y="130" width="120" height="10" rx="3" fill="#475569"/>
  <!-- Laptop screen back -->
  <rect x="55" y="45" width="130" height="90" rx="5" fill="#334155" transform="rotate(-5 120 130)"/>
  <!-- Laptop screen display area -->
  <rect x="60" y="50" width="120" height="80" rx="3" fill="#1e293b" transform="rotate(-5 120 130)"/>

  <!-- Screen glow effect -->
  <rect x="60" y="50" width="120" height="80" rx="3" fill="url(#screenGlow)" transform="rotate(-5 120 130)"/>

  <!-- Laptop screen UI elements (representing a signup form) -->
  <!-- Placeholder for "Create Account" or "Profile" header (abstracted) -->
  <circle cx="120" cy="65" r="8" fill="#38bdf8" transform="rotate(-5 120 130)"/>
  <rect x="110" y="72" width="20" height="4" rx="2" fill="#38bdf8" transform="rotate(-5 120 130)"/>

  <!-- Input fields (abstracted) -->
  <rect x="75" y="85" width="90" height="10" rx="2" fill="#334155" transform="rotate(-5 120 130)"/>
  <rect x="75" y="100" width="90" height="10" rx="2" fill="#334155" transform="rotate(-5 120 130)"/>
  
  <!-- Prominent "Register" button (abstracted) -->
  <rect x="80" y="115" width="80" height="12" rx="4" fill="#fbbf24" transform="rotate(-5 120 130)"/>
</svg>