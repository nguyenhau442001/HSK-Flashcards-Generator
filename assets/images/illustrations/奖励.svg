<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Background Elements -->
  <rect x="30" y="140" width="180" height="60" rx="4" fill="#334155" opacity="0.5"/>
  <circle cx="190" cy="160" r="15" fill="#1e293b"/>
  <rect x="40" y="150" width="100" height="10" rx="2" fill="#475569"/>
  
  <!-- Manager Character -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="18" fill="#f8fafc"/>
    <rect x="10" y="40" width="20" height="50" rx="5" fill="#38bdf8"/>
    <path d="M 5 50 L 10 70 L 30 70 L 35 50 Z" fill="#38bdf8"/>
    <circle cx="20" cy="15" r="3" fill="#0f172a"/>
  </g>
  
  <!-- Employee Character -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="18" fill="#f8fafc"/>
    <rect x="10" y="40" width="20" height="50" rx="5" fill="#10b981"/>
    <path d="M 5 50 L 10 70 L 30 70 L 35 50 Z" fill="#10b981"/>
    <circle cx="20" cy="15" r="3" fill="#0f172a"/>
  </g>
  
  <!-- The Reward (Gift Box) -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#f59e0b"/>
    <rect x="18" y="0" width="4" height="40" fill="#fbbf24"/>
    <rect x="0" y="18" width="40" height="4" fill="#fbbf24"/>
    <path d="M 5 -10 Q 20 -25 35 -10" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="5" cy="-10" r="4" fill="#ec4899"/>
    <circle cx="35" cy="-10" r="4" fill="#ec4899"/>
  </g>
  
  <!-- Decorative Accents -->
  <circle cx="180" cy="50" r="3" fill="#fb923c"/>
  <circle cx="60" cy="60" r="2" fill="#38bdf8"/>
  <path d="M 120 180 L 130 170 L 140 180" stroke="#f8fafc" stroke-width="2" fill="none"/>
</svg>