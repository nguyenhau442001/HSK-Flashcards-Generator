<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Door Frame -->
  <rect x="60" y="30" width="120" height="180" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="70" y="40" width="100" height="160" rx="4" fill="#1e293b"/>
  <circle cx="155" cy="120" r="6" fill="#fbbf24"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M60 160 C60 130, 100 130, 100 160 L100 180 L60 180 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="80" cy="110" r="25" fill="#fde68a"/>
    <!-- Shocked Expression -->
    <ellipse cx="70" cy="105" rx="3" ry="5" fill="#1e293b"/>
    <ellipse cx="90" cy="105" rx="3" ry="5" fill="#1e293b"/>
    <path d="M75 120 Q80 128 85 120" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Arms -->
    <path d="M60 140 L40 120" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 140 L120 120" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Empty Hand Gesture -->
    <circle cx="40" cy="120" r="6" fill="#fde68a"/>
    <circle cx="120" cy="120" r="6" fill="#fde68a"/>
  </g>
  
  <!-- Floating "Oops" Effect -->
  <g fill="#fb923c">
    <circle cx="160" cy="60" r="4"/>
    <circle cx="175" cy="50" r="6"/>
    <circle cx="190" cy="65" r="3"/>
  </g>
  
  <!-- Floor -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
</svg>