<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Tree Trunk Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="40%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Tree Stump Top -->
    <radialGradient id="stumpTop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Axe Blade Gradient -->
    <linearGradient id="axeBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Axe Handle Gradient -->
    <linearGradient id="axeHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Motion Blur Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Nature/Forest depth) -->
  <circle cx="190" cy="70" r="45" fill="#1e293b" opacity="0.6"/>
  <circle cx="50" cy="90" r="60" fill="#1e293b" opacity="0.4"/>
  
  <!-- Ground Terrain -->
  <path d="M 0 190 Q 70 175 140 185 T 240 180 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 195 Q 90 185 240 200 L 240 240 L 0 240 Z" fill="#0f172a"/>

  <!-- Background Foliage / Trees -->
  <path d="M 170 190 L 190 120 L 210 190 Z" fill="#065f46" opacity="0.4"/>
  <path d="M 160 190 L 180 100 L 200 190 Z" fill="#047857" opacity="0.5"/>
  <path d="M 20 190 L 40 110 L 60 190 Z" fill="#065f46" opacity="0.4"/>

  <!-- Main Scene: Fallen Log / Stump being chopped -->
  <!-- Stump Base -->
  <path d="M 120 170 L 155 170 L 165 210 L 110 210 Z" fill="url(#trunkGrad)"/>
  <!-- Stump Top Ellipse -->
  <ellipse cx="137" cy="170" rx="18" ry="8" fill="url(#stumpTop)"/>
  <!-- Tree rings details -->
  <ellipse cx="137" cy="170" rx="12" ry="5" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="137" cy="170" rx="6" ry="2.5" fill="none" stroke="#ca8a04" stroke-width="1" opacity="0.6"/>

  <!-- Wood Chips Flying (Action effect) -->
  <path d="M 115 160 Q 120 155 125 162 Z" fill="#fde047" filter="url(#glow)"/>
  <path d="M 105 172 Q 110 168 108 178 Z" fill="#f59e0b" filter="url(#glow)"/>
  <path d="M 122 150 Q 128 145 125 155 Z" fill="#eab308" filter="url(#glow)"/>

  <!-- Worker / Character (Dynamic Pose chopping) -->
  <!-- Legs / Pants -->
  <path d="M 85 195 L 80 230 L 98 230 L 95 195 Z" fill="#334155"/>
  <path d="M 105 195 L 115 228 L 132 225 L 120 195 Z" fill="#1e293b"/>
  <!-- Shoes -->
  <ellipse cx="88" cy="230" rx="12" ry="4" fill="#0f172a"/>
  <ellipse cx="124" cy="226" rx="12" ry="4" fill="#0f172a"/>

  <!-- Torso (Leaning forward for the chop) -->
  <g transform="rotate(-15, 95, 170)">
    <!-- Back/Shirt -->
    <path d="M 75 145 L 115 145 L 120 195 L 75 195 Z" fill="url(#shirtGrad)" rx="10"/>
    <!-- Safety Vest / Details -->
    <path d="M 85 145 L 95 195 L 82 195 L 77 145 Z" fill="#fbbf24" opacity="0.9"/>
    <path d="M 105 145 L 95 195 L 108 195 L 113 145 Z" fill="#fbbf24" opacity="0.9"/>
    
    <!-- Head & Hard Hat -->
    <!-- Neck -->
    <rect x="90" y="133" rx="4" width="12" ry="4" fill="#fed7aa"/>
    <!-- Head -->
    <circle cx="96" cy="122" r="13" fill="#fed7aa"/>
    <!-- Hard Hat -->
    <path d="M 78 120 C 78 110 114 110 114 120 Z" fill="#fb923c"/>
    <path d="M 75 120 L 118 120 L 115 123 L 78 123 Z" fill="#f97316"/>
  </g>

  <!-- Arms & Axe (Action Swing Pose) -->
  <!-- Arms holding axe handle -->
  <path d="M 100 150 L 135 120 L 142 128 L 108 162 Z" fill="#fed7aa"/>
  
  <!-- Axe Object (The focal point of 'Chặt/Đốn') -->
  <!-- We place the axe head near the stump with motion lines -->
  <g transform="translate(15, -5)">
    <!-- Motion streak lines -->
    <path d="M 100 130 L 125 150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>
    <path d="M 110 120 L 135 140" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" filter="url(#glow)"/>

    <!-- Axe Handle -->
    <path d="M 85 160 L 150 100 L 157 108 L 92 168 Z" fill="url(#axeHandle)"/>
    
    <!-- Axe Head (Metal Blade crashing into stump) -->
    <g transform="translate(130, 90) rotate(45)">
      <!-- Eye of the axe -->
      <rect x="-4" y="-8" width="12" height="16" rx="2" fill="#334155"/>
      <!-- Sharp Blade -->
      <path d="M 8 -8 L 28 -22 C 32 -10 32 10 28 22 L 8 8 Z" fill="url(#axeBlade)"/>
      <!-- Blade edge highlight -->
      <path d="M 28 -22 C 33 -5 33 5 28 22" fill="none" stroke="#f8fafc" stroke-width="2"/>
    </g>
  </g>

  <!-- Ambient lighting / glow for action energy -->
  <circle cx="137" cy="170" r="35" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>

  <!-- Foreground Grass Details (Silhouette) -->
  <path d="M 15 200 L 18 185 L 22 200 Z" fill="#047857"/>
  <path d="M 20 200 L 25 188 L 29 200 Z" fill="#065f46"/>
  <path d="M 170 195 L 175 180 L 180 195 Z" fill="#047857"/>
  <path d="M 210 198 L 216 183 L 220 198 Z" fill="#065f46"/>
  <path d="M 215 198 L 220 186 L 225 198 Z" fill="#047857"/>

  <!-- Floating particles for dynamic atmosphere -->
  <circle cx="150" cy="130" r="2.5" fill="#fde047" opacity="0.8" filter="url(#glow)"/>
  <circle cx="110" cy="140" r="1.5" fill="#fde047" opacity="0.7"/>
  <circle cx="140" cy="155" r="2" fill="#fb923c" opacity="0.9" filter="url(#glow)"/>
  <circle cx="95" cy="175" r="1" fill="#fef08a" opacity="0.6"/>
</svg>