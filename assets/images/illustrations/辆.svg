<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Environment / House Exterior & Driveway Scene -->
  <!-- Night Sky & Gradient Atmosphere -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="houseWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="carRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="carBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" fill="url(#skyGrad)"/>

  <!-- Warm House Light from Window -->
  <polygon points="130,110 180,110 180,150 130,150" fill="#fbbf24" opacity="0.15" filter="url(#glow)"/>

  <!-- House Structure (Background) -->
  <path d="M 20 150 L 120 100 L 220 150 Z" fill="#64748b"/>
  <rect x="35" y="140" width="170" height="70" fill="url(#houseWall)"/>
  
  <!-- Window -->
  <rect x="135" y="115" width="35" height="30" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <line x1="152" y1="115" x2="152" y2="145" stroke="#64748b" stroke-width="2"/>
  <line x1="135" y1="130" x2="170" y2="130" stroke="#64748b" stroke-width="2"/>

  <!-- Warm Light Glow inside window -->
  <rect x="138" y="118" width="29" height="24" rx="2" fill="#fef08a"/>

  <!-- Ground / Driveway -->
  <path d="M 0 210 Q 120 195 240 210 L 240 240 L 0 240 Z" fill="#1e293b"/>
  <path d="M 0 215 Q 120 200 240 215" stroke="#334155" stroke-width="3" fill="none"/>

  <!-- CHARACTER (Proud Homeowner pointing at the two cars) -->
  <g id="character">
    <!-- Body / Torso -->
    <path d="M 85 195 C 85 180 95 170 105 170 C 115 170 125 180 125 195 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="105" cy="155" r="12" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 93 155 C 93 145 117 145 117 155 C 115 150 95 150 93 155 Z" fill="#334155"/>
    <!-- Arm pointing left towards cars -->
    <path d="M 98 175 L 75 168" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="72" cy="167" r="3" fill="#fbcfe8"/>
    <!-- Other arm -->
    <path d="M 112 178 L 122 190" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- CAR 1 (Blue Car - Foreground Left) -->
  <g id="carBlueGroup" transform="translate(15, 175)">
    <!-- Wheels -->
    <circle cx="15" cy="30" r="7" fill="#0f172a"/>
    <circle cx="15" cy="30" r="3" fill="#94a3b8"/>
    <circle cx="45" cy="30" r="7" fill="#0f172a"/>
    <circle cx="45" cy="30" r="3" fill="#94a3b8"/>
    
    <!-- Chassis -->
    <path d="M 5 22 L 55 22 C 58 22 60 25 58 28 L 54 32 C 53 33 51 34 49 34 L 11 34 C 9 34 7 33 6 32 L 2 28 C 0 25 2 22 5 22 Z" fill="url(#carBlue)"/>
    <!-- Cabin / Roof -->
    <path d="M 16 22 L 24 12 L 40 12 L 48 22 Z" fill="#bae6fd"/>
    <!-- Headlights & details -->
    <rect x="56" y="25" width="3" height="4" rx="1" fill="#fef08a" filter="url(#glow)"/>
    <path d="M 28 12 L 28 22 M 36 12 L 36 22" stroke="#0284c7" stroke-width="1.5"/>
  </g>

  <!-- CAR 2 (Red Car - Behind/Next to Blue Car) -->
  <g id="carRedGroup" transform="translate(145, 185)">
    <!-- Wheels -->
    <circle cx="15" cy="25" r="6" fill="#0f172a"/>
    <circle cx="15" cy="25" r="2.5" fill="#94a3b8"/>
    <circle cx="45" cy="25" r="6" fill="#0f172a"/>
    <circle cx="45" cy="25" r="2.5" fill="#94a3b8"/>

    <!-- Chassis -->
    <path d="M 5 18 L 55 18 C 58 18 60 21 58 24 L 54 27 C 53 28 51 29 49 29 L 11 29 C 9 29 7 28 6 27 L 2 24 C 0 21 2 18 5 18 Z" fill="url(#carRed)"/>
    <!-- Cabin / Roof -->
    <path d="M 18 18 L 25 8 L 39 8 L 46 18 Z" fill="#fecaca"/>
    <!-- Headlights & details -->
    <rect x="56" y="20" width="3" height="3" rx="1" fill="#fef08a" filter="url(#glow)"/>
    <path d="M 28 8 L 28 18 M 36 8 L 36 18" stroke="#dc2626" stroke-width="1.5"/>
  </g>

  <!-- Subtle ambient glow/particles for rich atmosphere -->
  <circle cx="190" cy="70" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="50" cy="50" r="1" fill="#fef08a" opacity="0.6"/>
  <circle cx="90" cy="40" r="1.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="210" cy="110" r="1" fill="#fef08a" opacity="0.7"/>

  <!-- Foreground foliage framing -->
  <path d="M 0 240 L 0 220 Q 15 210 30 240 Z" fill="#059669" opacity="0.8"/>
  <path d="M 240 240 L 240 215 Q 225 205 210 240 Z" fill="#047857" opacity="0.8"/>
</svg>