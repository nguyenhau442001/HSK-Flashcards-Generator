<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Star Gradients for Praise/Recognition -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="10" y="10" width="180" height="180" rx="32" fill="url(#bg-grad)" stroke="#334155" stroke-width="2"/>

  <!-- Subtle background decorative rings -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Rising Hands / Upward Gesture Metaphor for "Praise / Commendation" -->
  <g filter="url(#soft-shadow)">
    <!-- Left Hand / Support Shape -->
    <path d="M 65 135 C 65 115, 80 110, 85 110 C 90 110, 95 115, 95 125 L 95 145 Z" fill="#38bdf8" opacity="0.85"/>
    
    <!-- Right Hand / Support Shape -->
    <path d="M 135 135 C 135 115, 120 110, 115 110 C 110 110, 105 115, 105 125 L 105 145 Z" fill="#38bdf8" opacity="0.85"/>

    <!-- Central Rising Pillar / Base of Trophy -->
    <path d="M 90 145 L 110 145 L 115 160 L 85 160 Z" fill="#64748b" rx="2"/>
    <rect x="75" y="160" width="50" height="8" rx="4" fill="#475569"/>
  </g>

  <!-- Dynamic Motion / Energy Arcs -->
  <path d="M 50 95 C 60 70, 75 60, 100 55" fill="none" stroke="url(#cyan-grad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 150 95 C 140 70, 125 60, 100 55" fill="none" stroke="url(#cyan-grad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Main Award Star (Symbolizing Praise, Achievement, Excellence) -->
  <g filter="url(#glow)">
    <polygon points="100,45 112,74 144,77 119,98 127,129 100,112 73,129 81,98 56,77 88,74" fill="url(#gold-grad)"/>
  </g>

  <!-- Sparkles / Accents indicating celebration and positive reinforcement -->
  <!-- Top Right Sparkle -->
  <path d="M 145 45 C 145 52, 140 55, 135 55 C 140 55, 145 58, 145 65 C 145 58, 150 55, 155 55 C 150 55, 145 52, 145 45 Z" fill="#fbbf24"/>
  
  <!-- Lower Left Sparkle -->
  <path d="M 55 110 C 55 115, 52 117, 48 117 C 52 117, 55 119, 55 124 C 55 119, 58 117, 62 117 C 58 117, 55 115, 55 110 Z" fill="#38bdf8"/>

  <!-- Small floating confetti dots -->
  <circle cx="70" cy="45" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="130" cy="40" r="2.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="45" cy="80" r="2" fill="#10b981" opacity="0.8"/>
  <circle cx="155" cy="115" r="3" fill="#fbbf24" opacity="0.7"/>

</svg>