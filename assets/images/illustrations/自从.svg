<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Floor and Wall Line -->
  <path d="M 0 190 L 240 190" stroke="#334155" stroke-width="2"/>
  
  <!-- The "Before" Photo on the Wall -->
  <rect x="40" y="50" width="60" height="75" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <!-- Simplified "Old Self" in photo: Slumped, messy -->
  <circle cx="70" cy="75" r="8" fill="#64748b"/>
  <path d="M 55 110 Q 70 90 85 110" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 65 78 Q 70 82 75 78" stroke="#1e293b" stroke-width="1.5" fill="none"/> <!-- Sad mouth -->
  
  <!-- Decorative Plant (Symbol of Growth) -->
  <rect x="180" y="165" width="25" height="25" rx="2" fill="#475569"/>
  <path d="M 192 165 Q 185 140 175 145 Q 192 155 192 165" fill="#10b981"/>
  <path d="M 192 165 Q 200 135 210 140 Q 195 150 192 165" fill="#059669"/>

  <!-- The "After" Character (The Subject) -->
  <!-- Legs -->
  <path d="M 125 190 L 130 155 M 145 190 L 140 155" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M 125 155 Q 135 110 145 155" fill="#38bdf8"/>
  <rect x="122" y="120" width="26" height="35" rx="6" fill="#38bdf8"/>
  <!-- Arms -->
  <path d="M 122 125 Q 105 135 110 150" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none"/> <!-- Arm pointing to photo -->
  <path d="M 148 125 Q 160 135 155 150" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Head -->
  <circle cx="135" cy="100" r="12" fill="#fbbf24"/>
  <!-- Hair -->
  <path d="M 123 100 Q 123 85 135 85 Q 147 85 147 100" fill="#475569"/>
  <!-- Face: Confident/Happy -->
  <path d="M 132 103 Q 135 107 138 103" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="130" cy="98" r="1" fill="#1e293b"/>
  <circle cx="140" cy="98" r="1" fill="#1e293b"/>

  <!-- Window with Morning Light -->
  <rect x="160" y="40" width="40" height="60" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M 160 70 L 200 70 M 180 40 L 180 100" stroke="#334155" stroke-width="1"/>
  <circle cx="190" cy="55" r="5" fill="#fbbf24" opacity="0.6" filter="url(#glow)"/>

  <!-- Light Rays highlighting the change -->
  <path d="M 160 40 L 120 120" stroke="#fbbf24" stroke-width="0.5" opacity="0.2"/>
  <path d="M 180 40 L 140 120" stroke="#fbbf24" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Small details: A book on the floor -->
  <rect x="110" y="182" width="15" height="8" rx="1" fill="#ec4899" transform="rotate(-10 110 182)"/>
</svg>