<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Environment -->
  <path d="M20 180 L220 180 L220 220 L20 220 Z" fill="#334155"/>
  <rect x="160" y="80" width="40" height="100" fill="#475569"/>
  <circle cx="180" cy="100" r="15" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Father Figure -->
  <g transform="translate(60, 100)">
    <path d="M20 80 Q20 40 40 40 T60 80" fill="#38bdf8"/>
    <ellipse cx="40" cy="30" rx="15" ry="18" fill="#fde68a"/>
    <path d="M30 45 L20 70 M50 45 L60 70" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M35 50 L45 50" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Child Figure -->
  <g transform="translate(120, 120)">
    <path d="M10 60 Q10 30 25 30 T40 60" fill="#ec4899"/>
    <ellipse cx="25" cy="25" rx="10" ry="12" fill="#fde68a"/>
  </g>
  
  <!-- Props: Books and Toys -->
  <rect x="80" y="165" width="20" height="15" fill="#fb923c"/>
  <rect x="105" y="170" width="15" height="10" fill="#10b981"/>
  <circle cx="140" cy="175" r="5" fill="#f59e0b"/>
  
  <!-- Symbolic "Effort" Glow -->
  <path d="M40 90 C60 70 100 70 120 90" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6"/>
  <path d="M50 80 C70 60 110 60 130 80" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.4"/>
  
  <!-- Table -->
  <rect x="20" y="175" width="200" height="5" fill="#64748b"/>
</svg>