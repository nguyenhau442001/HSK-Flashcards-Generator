<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Warm desk lamp glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character shadow gradient -->
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="window-clip">
      <path d="M165 40 h50 v65 h-50 z"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT / SCENERY -->
  <!-- Window & Night Cityscape Background -->
  <path d="M163 38 h54 v69 h-54 z" fill="#090d16" stroke="#334155" stroke-width="2" rx="2"/>
  <g clip-path="url(#window-clip)">
    <!-- Distant buildings & glowing windows -->
    <rect x="170" y="60" width="10" height="45" fill="#1e293b"/>
    <rect x="172" y="65" width="2" height="3" fill="#fbbf24" opacity="0.6"/>
    <rect x="176" y="75" width="2" height="3" fill="#38bdf8" opacity="0.4"/>
    <rect x="172" y="85" width="2" height="3" fill="#fbbf24" opacity="0.8"/>
    
    <rect x="183" y="50" width="14" height="55" fill="#172033"/>
    <rect x="187" y="58" width="2" height="4" fill="#fbbf24" opacity="0.7"/>
    <rect x="187" y="70" width="2" height="4" fill="#fbbf24" opacity="0.5"/>
    <rect x="191" y="80" width="2" height="4" fill="#38bdf8" opacity="0.6"/>

    <rect x="200" y="68" width="12" height="37" fill="#1e293b"/>
    <rect x="204" y="72" width="2" height="3" fill="#38bdf8" opacity="0.7"/>
    <rect x="204" y="84" width="2" height="3" fill="#fbbf24" opacity="0.5"/>
    
    <!-- Soft night glow/moonlight -->
    <circle cx="190" cy="45" r="3" fill="#93c5fd" opacity="0.2"/>
  </g>
  <!-- Window Frame Divider -->
  <path d="M190 38 v69 M163 72 h54" stroke="#334155" stroke-width="1.5"/>

  <!-- Bookshelf / Wall decor on left -->
  <rect x="25" y="45" width="35" height="6" rx="1" fill="#334155"/>
  <path d="M30 45 l5 -12 h15 l5 12 z" fill="#38bdf8" opacity="0.8"/> <!-- Book 1 -->
  <rect x="52" y="30" width="5" height="15" rx="1" fill="#ec4899"/> <!-- Book 2 -->
  <rect x="44" y="32" width="7" height="13" rx="1" fill="#10b981"/> <!-- Book 3 -->

  <!-- Desk Surface -->
  <path d="M20 165 h200 l-15 45 h-170 z" fill="#334155"/>
  <path d="M20 160 h200 v5 h-200 z" fill="#475569"/>

  <!-- Desk Props -->
  <!-- Laptop open (glowing screen indicating unfinished work/decision) -->
  <path d="M75 160 l-15 15 h50 l-15 -15 z" fill="#64748b"/>
  <path d="M68 140 h34 v20 h-34 z" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="72" y="144" width="26" height="12" rx="1" fill="#38bdf8" opacity="0.2"/>
  <!-- Code/Text abstract lines on screen -->
  <path d="M75 147 h12 M75 151 h8 M75 155 h14" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Coffee Mug with steam -->
  <path d="M140 148 c0 -4 6 -4 6 0 v10 c0 3 -6 3 -6 0 z" fill="#f8fafc"/>
  <path d="M146 151 c3 0 4 2 4 4" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
  <!-- Steam swirls (indicating passage of a long time) -->
  <path d="M142 138 q2 -3 0 -6 t0 -6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M145 140 q-2 -3 0 -6 t0 -6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Warm Desk Lamp (Top Right casting light) -->
  <path d="M130 55 l20 20" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 65 l25 25" stroke="#475569" stroke-width="2"/>
  <path d="M115 50 c-5 -8 5 -12 12 -5 l12 12 c5 5 0 15 -8 12 l-12 -5 z" fill="#fbbf24"/>
  <circle cx="125" cy="62" r="45" fill="url(#lamp-glow)" style="mix-blend-mode: screen;"/>

  <!-- MAIN CHARACTER: Depicting deep hesitation ("他犹豫了很久") -->
  <g transform="translate(0, 5)">
    <!-- Chair back -->
    <path d="M90 100 q-15 20 -15 65 h15 q0 -40 10 -65 z" fill="#1e293b"/>
    <rect x="85" y="95" width="20" height="10" rx="3" fill="#475569"/>

    <!-- Body / Torso (Leaning forward slightly, chin resting on hand) -->
    <path d="M100 115 c-10 15 -15 35 -15 55 h35 c5 -20 10 -40 5 -55 z" fill="#3b82f6"/> <!-- Blue sweater -->
    <path d="M98 115 c5 -5 15 -5 22 0 c-2 3 -5 5 -11 5 c-6 0 -9 -2 -11 -5 z" fill="#1e293b"/> <!-- Collar -->

    <!-- Left Arm & Hand supporting chin (classic hesitation pose) -->
    <!-- Upper arm -->
    <path d="M95 125 c-10 10 -15 20 -20 30" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
    <!-- Forearm & hand resting on cheek -->
    <path d="M75 155 l18 -15" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Head & Face -->
    <g transform="translate(90, 85)">
      <!-- Neck -->
      <path d="M-3 20 h12 v15 h-12 z" fill="#fcd34d"/>
      
      <!-- Head shape -->
      <path d="M-15 5 c0 -18 12 -25 22 -25 c15 0 22 10 22 25 c0 18 -10 28 -22 28 c-14 0 -22 -10 -22 -28 z" fill="#fcd34d"/>
      
      <!-- Hair (Messy/Thoughtful style, indicating deep thought over time) -->
      <path d="M-16 2 c-3 -15 5 -28 20 -28 c16 0 24 10 23 25 c-3 -4 -8 -6 -15 -6 c-8 0 -13 4 -17 8 c-4 -3 -8 -4 -11 -1 z" fill="#334155"/>
      <path d="M22 10 c3 3 6 2 8 -1 c2 -4 -1 -8 -5 -5 z" fill="#334155"/>

      <!-- Facial Expression: Eyes half-closed in doubt/hesitation, eyebrows tilted -->
      <!-- Eyebrows (tilted inward, showing indecision) -->
      <path d="M-2 2 l9 -3" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 -1 l8 4" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Eyes (Looking sideways at screen or document, unsure) -->
      <path d="M1 9 q4 -3 8 0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M13 11 q4 -3 8 0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Mouth (Small, tight, hesitant line) -->
      <path d="M7 23 q4 2 8 0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Hand supporting chin -->
      <circle cx="12" cy="22" r="7" fill="#fcd34d"/>
      <path d="M8 20 c2 2 6 2 8 0" stroke="#e0a82e" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Right Arm (Relaxed, hanging down near lap) -->
    <path d="M120 120 c12 12 18 25 22 40" fill="none" stroke="#3b82f6" stroke-width="11" stroke-linecap="round"/>
    <circle cx="142" cy="162" r="5" fill="#fcd34d"/>
  </g>

  <!-- Floating Question/Doubt elements subtly hinting at the mental process (No text) -->
  <!-- Floating abstract thought bubbles/dots representing hesitation -->
  <g opacity="0.6">
    <circle cx="115" cy="50" r="3" fill="#fbbf24"/>
    <circle cx="123" cy="42" r="4.5" fill="#fbbf24"/>
    <circle cx="135" cy="32" r="6" fill="#fbbf24"/>
    <path d="M133 34 q3 -4 5 -1 q-3 4 -5 1 z" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Foreground ambient shadow for depth -->
  <path d="M0 240 h240 v-20 h-240 z" fill="url(#shadow-grad)" opacity="0.3"/>
</svg>