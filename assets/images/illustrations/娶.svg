<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment: Warm Cozy Living Room / Wedding Celebration Memory -->
  <!-- Wallpaper / Arch background -->
  <path d="M50 190 L50 80 C50 60 70 45 120 45 C170 45 190 60 190 80 L190 190 Z" fill="#334155" opacity="0.4"/>
  
  <!-- Warm Wedding Arch Lights / Decor -->
  <circle cx="120" cy="50" r="35" fill="url(#warm-glow)"/>
  <path d="M85 75 Q120 95 155 75" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="95" cy="80" r="3" fill="#fbbf24"/>
  <circle cx="120" cy="88" r="3" fill="#fbbf24"/>
  <circle cx="145" cy="80" r="3" fill="#fbbf24"/>

  <!-- Framed Photo on Wall (Symbolizing a happy marriage/good wife) -->
  <rect x="95" y="100" width="50" height="38" rx="4" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <rect x="100" y="105" width="40" height="28" rx="2" fill="#1e293b"/>
  <!-- Mini silhouette in picture -->
  <circle cx="113" cy="115" r="5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="127" cy="115" r="5" fill="#f43f5e" opacity="0.8"/>
  <path d="M107 127 Q120 120 133 127" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- House Plants for Real-World Context -->
  <path d="M35 150 Q45 150 45 190 L25 190 Q25 150 35 150 Z" fill="#64748b"/>
  <ellipse cx="35" cy="150" rx="12" ry="5" fill="#94a3b8"/>
  <path d="M35 145 Q20 120 15 100 Q30 115 35 145 Z" fill="#10b981"/>
  <path d="M35 145 Q50 115 55 95 Q40 120 35 145 Z" fill="#059669"/>
  <path d="M35 145 Q35 110 35 90 Q35 110 35 145 Z" fill="#34d399"/>

  <!-- Floor -->
  <rect x="0" y="190" width="240" height="50" fill="#0f172a"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- Characters: Groom (Husband) and Bride (Good Wife) -->
  
  <!-- Groom (Left) -->
  <g transform="translate(75, 115)">
    <!-- Body / Suit -->
    <path d="M15 75 L35 75 L45 45 L25 45 Z" fill="#1e293b"/>
    <path d="M20 75 L30 75 L30 45 L20 45 Z" fill="#38bdf8"/> <!-- Tie/Shirt -->
    <rect x="12" y="30" width="26" height="30" rx="6" fill="#334155"/>
    
    <!-- Head -->
    <circle cx="25" cy="18" r="12" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M13 18 C13 10 20 6 27 8 C34 10 37 16 37 20 C33 16 28 14 22 15 C17 16 14 17 13 18 Z" fill="#334155"/>
    <!-- Smiling Face Expression -->
    <circle cx="21" cy="18" r="1.5" fill="#1e293b"/>
    <circle cx="29" cy="18" r="1.5" fill="#1e293b"/>
    <path d="M23 22 Q25 25 27 22" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Arm holding hands / gifting -->
    <path d="M30 45 L50 55" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Bride / Wife (Right) - Wearing elegant modern red/pink dress -->
  <g transform="translate(115, 112)">
    <!-- Dress -->
    <path d="M10 78 L40 78 L50 42 L15 42 Z" fill="#f43f5e"/>
    <path d="M20 42 L35 42 L30 78 L20 78 Z" fill="#fb7185"/> <!-- Dress accent -->
    <rect x="12" y="28" width="26" height="20" rx="6" fill="#f43f5e"/>

    <!-- Head -->
    <circle cx="25" cy="16" r="12" fill="#fed7aa"/>
    <!-- Hair & Veil/Accessory -->
    <path d="M13 16 C13 8 20 4 27 6 C35 8 38 14 38 18 C35 13 28 11 22 12 C16 13 14 15 13 16 Z" fill="#475569"/>
    <!-- Flower in hair -->
    <circle cx="33" cy="10" r="4" fill="#fbbf24"/>
    
    <!-- Smiling Face Expression -->
    <circle cx="21" cy="16" r="1.5" fill="#1e293b"/>
    <circle cx="29" cy="16" r="1.5" fill="#1e293b"/>
    <path d="M23 20 Q25 23 27 20" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arm reaching out -->
    <path d="M18 45 L2 55" fill="none" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Interlocking Hands / Warm Interaction Centerpiece -->
  <circle cx="107" cy="167" r="8" fill="#f43f5e"/>
  
  <!-- Floating Hearts / Warm Joyful Elements -->
  <g transform="translate(100, 75)">
    <path d="M10 0 C6 -5 0 -2 0 4 C0 10 10 16 10 16 C10 16 20 10 20 4 C20 -2 14 -5 10 0 Z" fill="#ec4899" transform="scale(0.6)"/>
  </g>
  <g transform="translate(130, 90)">
    <path d="M10 0 C6 -5 0 -2 0 4 C0 10 10 16 10 16 C10 16 20 10 20 4 C20 -2 14 -5 10 0 Z" fill="#f43f5e" transform="scale(0.4)"/>
  </g>
  <g transform="translate(80, 85)">
    <path d="M10 0 C6 -5 0 -2 0 4 C0 10 10 16 10 16 C10 16 20 10 20 4 C20 -2 14 -5 10 0 Z" fill="#fbbf24" transform="scale(0.5)"/>
  </g>

  <!-- Foreground Props: Small Coffee Table with Flowers -->
  <path d="M85 200 L155 200 L165 215 L75 215 Z" fill="#475569"/>
  <rect x="105" y="215" width="8" height="20" fill="#334155"/>
  <rect x="127" y="215" width="8" height="20" fill="#334155"/>

  <!-- Vase and Bouquet on Table -->
  <path d="M115 185 L125 185 L128 200 L112 200 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="120" cy="178" r="6" fill="#fb7185"/>
  <circle cx="112" cy="182" r="5" fill="#f43f5e"/>
  <circle cx="128" cy="182" r="5" fill="#fbbf24"/>
  <path d="M120 185 L120 172" stroke="#10b981" stroke-width="2"/>

</svg>