<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window view showing foreign cityscape -->
  <rect x="140" y="40" width="70" height="90" rx="4" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <path d="M175 40 v90 M140 85 h70" stroke="#334155" stroke-width="4"/>
  <rect x="148" y="50" width="22" height="30" fill="#fbbf24" opacity="0.2"/>
  <rect x="180" y="50" width="22" height="30" fill="#fbbf24" opacity="0.1"/>
  <rect x="148" y="90" width="22" height="30" fill="#fbbf24" opacity="0.3"/>
  <rect x="180" y="90" width="22" height="30" fill="#fbbf24" opacity="0.2"/>

  <!-- Desk and Laptop -->
  <rect x="30" y="140" width="180" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="70" fill="#334155"/>
  <rect x="200" y="150" width="10" height="70" fill="#334155"/>
  
  <rect x="70" y="110" width="90" height="60" rx="4" fill="#475569"/>
  <rect x="75" y="115" width="80" height="50" rx="2" fill="#1e293b"/>
  <rect x="85" y="125" width="60" height="30" fill="#38bdf8" opacity="0.6"/>

  <!-- Character -->
  <circle cx="115" cy="80" r="25" fill="#fcd34d"/>
  <path d="M100 80 q15 10 30 0" stroke="#78350f" stroke-width="2" fill="none"/>
  <rect x="95" y="105" width="40" height="60" rx="10" fill="#fb923c"/>
  <rect x="105" y="165" width="20" height="50" rx="5" fill="#38bdf8"/>
  
  <!-- Calendar/Time indicator to signify "Long term" -->
  <rect x="30" y="50" width="40" height="50" rx="4" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <line x1="30" y1="65" x2="70" y2="65" stroke="#ec4899" stroke-width="2"/>
  <circle cx="40" cy="75" r="3" fill="#ec4899"/>
  <circle cx="50" cy="75" r="3" fill="#ec4899"/>
  <circle cx="60" cy="75" r="3" fill="#ec4899"/>
  <circle cx="40" cy="85" r="3" fill="#ec4899"/>
  <circle cx="50" cy="85" r="3" fill="#ec4899"/>
  <circle cx="60" cy="85" r="3" fill="#ec4899"/>
  
  <!-- Suitcase -->
  <rect x="170" y="170" width="40" height="30" rx="4" fill="#10b981"/>
  <rect x="185" y="165" width="10" height="5" rx="1" fill="#10b981"/>
</svg>