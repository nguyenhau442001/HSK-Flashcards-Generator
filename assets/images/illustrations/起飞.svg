<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#10192e"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sunset/Dawn Glow -->
    <linearGradient id="sunsetGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Runway Lights Glow -->
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Airplane Body Gradient -->
    <linearGradient id="planeBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Airplane Wing Gradient -->
    <linearGradient id="planeWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Exhaust/Motion Gradient -->
    <linearGradient id="motionTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Distant Horizon / Glowing Sunset Layer -->
  <path d="M0 120 L240 120 L240 240 L0 240 Z" fill="url(#sunsetGlow)"/>

  <!-- Background Clouds & Atmosphere -->
  <g fill="#334155" opacity="0.3">
    <circle cx="40" cy="90" r="25"/>
    <circle cx="65" cy="85" r="30"/>
    <circle cx="90" cy="95" r="20"/>
    <circle cx="180" cy="70" r="35"/>
    <circle cx="210" cy="75" r="25"/>
  </g>

  <!-- Runway Ground Surface -->
  <!-- Perspective Runway Area -->
  <polygon points="70,140 170,140 210,220 30,220" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Runway Center Dashed Line -->
  <polygon points="118,140 122,140 123,220 117,220" fill="#fbbf24"/>
  
  <!-- Runway Edge Lights (Left) -->
  <circle cx="75" cy="145" r="2" fill="#ef4444"/>
  <circle cx="65" cy="160" r="2" fill="#ef4444"/>
  <circle cx="53" cy="180" r="2.5" fill="#ef4444"/>
  <circle cx="40" cy="202" r="3" fill="#ef4444"/>

  <!-- Runway Edge Lights (Right) -->
  <circle cx="165" cy="145" r="2" fill="#38bdf8"/>
  <circle cx="175" cy="160" r="2" fill="#38bdf8"/>
  <circle cx="187" cy="180" r="2.5" fill="#38bdf8"/>
  <circle cx="200" cy="202" r="3" fill="#38bdf8"/>

  <!-- Airfield Control Tower in Background (Silhouette with warm window glow) -->
  <g transform="translate(180, 75)">
    <polygon points="10,45 15,45 18,65 7,65" fill="#334155"/>
    <rect x="5" y="35" width="15" height="10" rx="2" fill="#475569"/>
    <!-- Tower Windows / Lights -->
    <rect x="7" y="38" width="11" height="4" fill="#fbbf24" rx="1"/>
    <!-- Radar dish -->
    <line x1="12" y1="35" x2="12" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M8 26 C12 24, 16 24, 16 26" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <circle cx="12" cy="25" r="1.5" fill="#ef4444"/>
  </g>

  <!-- Speed/Motion Lines (Action Lines for Takeoff) -->
  <g opacity="0.6">
    <line x1="75" y1="120" x2="45" y2="105" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="95" y1="110" x2="65" y2="95" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="145" y1="105" x2="115" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="165" y1="115" x2="135" y2="100" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: COMMERCIAL AIRPLANE TAKING OFF -->
  <!-- Group angled upward dynamically to represent 'cất cánh' (takeoff) -->
  <g transform="translate(120, 115) rotate(-22)">

    <!-- Engine Exhaust Jet Streams (Dynamic energetic glow) -->
    <path d="M -75 5 Q -100 12, -130 5 Q -100 -2, -75 5 Z" fill="url(#motionTrail)"/>
    <path d="M -75 -12 Q -105 -5, -135 -10 Q -105 -15, -75 -12 Z" fill="url(#motionTrail)"/>

    <!-- Left Wing (Back layer) -->
    <path d="M -15 2 L 10 -25 L -5 -30 L -35 -5 Z" fill="#64748b"/>
    <!-- Wing Flap/Aileron detail -->
    <path d="M -5 -30 L 10 -25 L 3 -22 L -8 -27 Z" fill="#38bdf8"/>

    <!-- Horizontal Stabilizer (Tail wing) -->
    <path d="M -60 -18 L -45 -30 L -50 -33 L -65 -21 Z" fill="#94a3b8"/>

    <!-- Vertical Stabilizer (Tail fin) with accent airline color -->
    <path d="M -55 -15 L -45 -42 L -32 -38 L -42 -12 Z" fill="#0284c7"/>
    <path d="M -48 -22 L -44 -36 L -37 -34 L -41 -20 Z" fill="#38bdf8"/>

    <!-- Main Fuselage Body -->
    <ellipse cx="0" cy="0" rx="75" ry="16" fill="url(#planeBody)"/>
    
    <!-- Nose Cone (Smooth rounded front) -->
    <path d="M 50 0 C 70 0, 75 -12, 75 -16 C 75 -16, 60 -16, 50 0 Z" fill="#cbd5e1"/>
    
    <!-- Fuselage Accent Stripe (Modern Airline Livery) -->
    <path d="M -75 3 Q 0 8, 75 0 Q 0 5, -75 3 Z" fill="#0284c7"/>
    <path d="M -75 5 Q 0 10, 75 2 Q 0 7, -75 5 Z" fill="#38bdf8"/>

    <!-- Cockpit Windows (Stylized dark graphic blocks) -->
    <path d="M 45 -8 C 52 -8, 56 -5, 58 -2 C 54 -2, 48 -4, 45 -8 Z" fill="#0f172a"/>

    <!-- Passenger Windows Row -->
    <circle cx="30" cy="-4" r="1.5" fill="#0f172a"/>
    <circle cx="20" cy="-4" r="1.5" fill="#0f172a"/>
    <circle cx="10" cy="-4" r="1.5" fill="#0f172a"/>
    <circle cx="0" cy="-4" r="1.5" fill="#0f172a"/>
    <circle cx="-10" cy="-4" r="1.5" fill="#0f172a"/>
    <circle cx="-20" cy="-4" r="1.5" fill="#0f172a"/>
    <circle cx="-30" cy="-4" r="1.5" fill="#0f172a"/>

    <!-- Right Wing (Front layer, prominent) -->
    <path d="M -10 6 L 25 35 L 5 40 L -25 10 Z" fill="url(#planeWing)"/>
    <!-- Wing Navigation Light (Green Starboard / Red Port) -->
    <circle cx="23" cy="37" r="2" fill="#10b981"/>
    <!-- Wing landing light glow -->
    <ellipse cx="10" cy="20" rx="3" ry="1.5" fill="#ffffff"/>

    <!-- Jet Engines (Under-wing pods) -->
    <!-- Engine 1 (Left/Back) -->
    <rect x="-20" y="5" width="24" height="10" rx="5" transform="rotate(10 -20 5)" fill="#64748b"/>
    <ellipse cx="-20" cy="10" rx="2" ry="4" fill="#0f172a"/>
    
    <!-- Engine 2 (Right/Front) -->
    <rect x="-5" y="16" width="28" height="12" rx="6" transform="rotate(5 -5 16)" fill="#94a3b8"/>
    <!-- Engine Intake Rim Glow -->
    <ellipse cx="-5" cy="22" rx="2.5" ry="5.5" fill="#38bdf8"/>

  </g>

  <!-- Ground Lighting & Ambient Highlights -->
  <circle cx="85" cy="150" r="12" fill="url(#lightGlow)" opacity="0.6"/>
  <circle cx="125" cy="170" r="16" fill="url(#lightGlow)" opacity="0.5"/>

  <!-- Foreground Atmospheric Elements (Puffs of cloud floating past) -->
  <g fill="#ffffff" opacity="0.15">
    <path d="M 15 160 Q 25 150, 40 155 Q 55 145, 70 160 Q 80 170, 65 175 Q 30 180, 15 160 Z"/>
    <path d="M 170 80 Q 185 70, 200 80 Q 220 75, 230 95 Q 235 110, 210 115 Q 180 120, 170 100 Z"/>
  </g>
</svg>