<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="blazer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="skirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Architectural Interior Setting (Art Gallery / Modern Lounge) -->
  <!-- Background Wall Panel Lines -->
  <line x1="40" y1="20" x2="40" y2="180" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <line x1="200" y1="20" x2="200" y2="180" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Ambient Art Frame in Background -->
  <rect x="150" y="45" width="50" height="65" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="156" y="52" width="38" height="35" rx="2" fill="#38bdf8" opacity="0.15"/>
  <circle cx="175" cy="70" r="10" fill="#f59e0b" opacity="0.3"/>
  <path d="M156 80 L168 68 L178 78 L188 68 L194 80 Z" fill="#10b981" opacity="0.3"/>

  <!-- Potted Plant Prop (Atmospheric Depth) -->
  <path d="M210 190 L225 215 L195 215 Z" fill="#475569"/>
  <path d="M210 190 C210 160 230 140 230 130 C230 120 215 125 210 145 C205 125 190 120 190 130 C190 140 210 160 210 190 Z" fill="#10b981"/>
  <path d="M210 190 C210 170 200 150 185 145 C175 142 178 152 190 160 C178 155 170 165 175 175 C180 185 195 185 210 190 Z" fill="#059669"/>

  <!-- Floor Surface -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

  <!-- Floor Shadow for Character -->
  <ellipse cx="120" cy="195" rx="45" ry="10" fill="#000000" opacity="0.6"/>

  <!-- MAIN CHARACTER: Elegant Lady (女士) -->
  <g filter="url(#shadow)">
    <!-- Elegant Handbag Prop -->
    <path d="M82 175 C82 170 86 166 91 166 L103 166 C108 166 112 170 112 175 L110 198 C110 201 107 203 104 203 L90 203 C87 203 84 201 84 198 Z" fill="#b45309"/>
    <path d="M91 166 C91 158 103 158 103 166" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="97" cy="182" r="3" fill="url(#gold-grad)"/>

    <!-- Skirt / Lower Body -->
    <path d="M96 135 L144 135 L152 192 C152 194 150 196 148 196 L92 196 C90 196 88 194 88 192 Z" fill="url(#skirt-grad)"/>

    <!-- Belt -->
    <rect x="96" y="132" width="48" height="6" rx="3" fill="url(#gold-grad)"/>

    <!-- Upper Body / Blazer -->
    <path d="M98 85 L142 85 C146 85 150 89 148 93 L138 140 C137 143 134 145 130 145 L110 145 C106 145 103 143 102 140 L92 93 C90 89 94 85 98 85 Z" fill="url(#blazer-grad)"/>

    <!-- Inner Blouse / White Collar & Scarf V-Neck -->
    <path d="M108 85 L120 110 L132 85 Z" fill="#f8fafc"/>
    <path d="M112 85 L120 102 L128 85 Z" fill="#ec4899"/>
    <!-- Blazer Lapels -->
    <path d="M98 85 L112 135 L104 140 Z" fill="#5b21b6" opacity="0.6"/>
    <path d="M142 85 L128 135 L136 140 Z" fill="#5b21b6" opacity="0.6"/>

    <!-- Gold Necklace / Brooch -->
    <circle cx="120" cy="98" r="4" fill="url(#gold-grad)"/>
    <path d="M114 94 Q120 100 126 94" fill="none" stroke="url(#gold-grad)" stroke-width="1.5"/>

    <!-- Arms & Hands -->
    <!-- Left Arm (Holding Bag) -->
    <path d="M98 90 C90 110 92 145 92 165" fill="none" stroke="#7c3aed" stroke-width="12" stroke-linecap="round"/>
    <circle cx="92" cy="167" r="5" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Right Arm (Sophisticated Gesture / Raised Slightly) -->
    <path d="M142 90 C152 110 148 130 140 145" fill="none" stroke="#7c3aed" stroke-width="12" stroke-linecap="round"/>
    <circle cx="138" cy="148" r="5" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Neck -->
    <rect x="114" y="74" width="12" height="15" rx="4" fill="#fbcfe8"/>

    <!-- Head / Face Structure -->
    <path d="M104 46 C104 36 112 28 120 28 C128 28 136 36 136 46 L136 68 C136 78 128 82 120 82 C112 82 104 78 104 68 Z" fill="#fbcfe8"/>

    <!-- Stylish Modern Bob Haircut -->
    <!-- Back Hair Volume -->
    <path d="M100 40 C96 60 100 80 112 86 C106 70 108 50 114 40 Z" fill="#1e1b4b"/>
    <path d="M140 40 C144 60 140 80 128 86 C134 70 132 50 126 40 Z" fill="#1e1b4b"/>
    <!-- Top & Bangs Hair -->
    <path d="M102 46 C102 26 138 26 138 46 C138 58 136 65 130 70 C124 58 116 58 110 70 C104 65 102 58 102 46 Z" fill="#0f172a"/>

    <!-- Facial Features -->
    <!-- Confident, Friendly Eyes -->
    <path d="M111 54 Q114 51 117 54" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M123 54 Q126 51 129 54" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyelashes / Glamour -->
    <path d="M109 53 L111 52" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M131 53 L129 52" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="111" cy="61" r="3.5" fill="#f43f5e" opacity="0.3"/>
    <circle cx="129" cy="61" r="3.5" fill="#f43f5e" opacity="0.3"/>

    <!-- Gentle Smile -->
    <path d="M116 64 Q120 68 124 64" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>

    <!-- Stylish Earrings -->
    <circle cx="102" cy="62" r="2.5" fill="url(#gold-grad)"/>
    <circle cx="138" cy="62" r="2.5" fill="url(#gold-grad)"/>
  </g>

  <!-- Foreground Atmospheric Particles (Golden Sparkles/Action context) -->
  <circle cx="70" cy="110" r="2" fill="#fbbf24" opacity="0.8" filter="url(#soft-glow)"/>
  <circle cx="170" cy="120" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="155" cy="155" r="2.5" fill="#38bdf8" opacity="0.7" filter="url(#soft-glow)"/>
  <circle cx="85" cy="70" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <path d="M165 40 L167 45 L172 47 L167 49 L165 54 L163 49 L158 47 L163 45 Z" fill="#fef08a" opacity="0.6"/>
  <path d="M75 145 L76 148 L79 149 L76 150 L75 153 L74 150 L71 149 L74 148 Z" fill="#fef08a" opacity="0.5"/>
</svg>