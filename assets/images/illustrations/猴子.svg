<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric background gradients / jungle depth -->
  <circle cx="120" cy="120" r="100" fill="#1e293b" opacity="0.6"/>
  
  <!-- Jungle foliage (background leaves) -->
  <path d="M 20 80 Q 40 40 70 60 Q 30 100 20 80 Z" fill="#065f46" opacity="0.6"/>
  <path d="M 220 70 Q 200 30 170 50 Q 210 90 220 70 Z" fill="#047857" opacity="0.7"/>
  <path d="M 10 180 Q 50 150 40 120 Q 0 150 10 180 Z" fill="#065f46" opacity="0.5"/>
  <path d="M 230 160 Q 190 140 200 180 Q 240 170 230 160 Z" fill="#047857" opacity="0.6"/>

  <!-- Hanging Jungle Vines -->
  <path d="M 60 0 Q 55 40 65 80 T 60 140" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <path d="M 180 0 Q 185 50 175 100 T 185 160" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Additional hanging leaves on vines -->
  <path d="M 62 45 Q 40 40 45 60 Q 60 60 62 45 Z" fill="#10b981"/>
  <path d="M 178 80 Q 200 75 195 95 Q 180 95 178 80 Z" fill="#34d399"/>
  <path d="M 58 110 Q 80 115 75 130 Q 60 125 58 110 Z" fill="#059669"/>

  <!-- Wooden Branch across the scene -->
  <path d="M 0 170 C 60 160, 180 180, 240 165 C 240 185, 0 195, 0 170 Z" fill="#451a03"/>
  <path d="M 20 168 C 80 162, 160 176, 220 167" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Little mushrooms on the branch -->
  <path d="M 190 163 Q 195 153 200 163 Z" fill="#f43f5e"/>
  <ellipse cx="195" cy="162" rx="6" ry="3" fill="#f43f5e"/>
  <circle cx="195" cy="161" r="1" fill="#ffffff"/>

  <!-- Monkey Body / Sitting pose on the branch -->
  <!-- Tail wrapping around branch -->
  <path d="M 95 160 Q 80 190 100 200 Q 120 205 125 185" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
  <path d="M 95 160 Q 80 190 100 200 Q 120 205 125 185" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>

  <!-- Legs -->
  <ellipse cx="110" cy="165" rx="14" ry="10" fill="#d97706" transform="rotate(-15 110 165)"/>
  <ellipse cx="135" cy="165" rx="14" ry="10" fill="#d97706" transform="rotate(10 135 165)"/>
  <!-- Feet -->
  <ellipse cx="103" cy="173" rx="8" ry="5" fill="#92400e"/>
  <ellipse cx="140" cy="172" rx="8" ry="5" fill="#92400e"/>

  <!-- Torso -->
  <path d="M 100 110 C 90 130, 100 160, 120 160 C 140 160, 150 130, 140 110 Z" fill="#d97706"/>
  <!-- Belly (lighter patch) -->
  <path d="M 108 120 C 102 135, 110 152, 120 152 C 130 152, 138 135, 132 120 Z" fill="#fef3c7"/>

  <!-- Arms holding a banana or reaching -->
  <!-- Left arm -->
  <path d="M 103 115 Q 80 120 85 145" fill="none" stroke="#d97706" stroke-width="10" stroke-linecap="round"/>
  <!-- Right arm reaching up -->
  <path d="M 137 115 Q 155 100 150 75" fill="none" stroke="#d97706" stroke-width="10" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="85" cy="148" r="5" fill="#b45309"/>
  <circle cx="150" cy="72" r="5" fill="#b45309"/>

  <!-- Head -->
  <circle cx="120" cy="85" r="28" fill="#d97706"/>

  <!-- Ears -->
  <circle cx="95" cy="82" r="9" fill="#d97706"/>
  <circle cx="95" cy="82" r="5" fill="#fef3c7"/>
  <circle cx="145" cy="82" r="9" fill="#d97706"/>
  <circle cx="145" cy="82" r="5" fill="#fef3c7"/>

  <!-- Face Mask (lighter skin area) -->
  <path d="M 100 75 C 100 100, 140 100, 140 75 C 140 68, 100 68, 100 75 Z" fill="#fef3c7"/>
  <!-- Cheeks/Muzzle extension -->
  <ellipse cx="120" cy="85" rx="16" ry="12" fill="#fef3c7"/>

  <!-- Eyes -->
  <circle cx="111" cy="78" r="3.5" fill="#0f172a"/>
  <circle cx="129" cy="78" r="3.5" fill="#0f172a"/>
  <!-- Eye highlights -->
  <circle cx="112" cy="77" r="1" fill="#ffffff"/>
  <circle cx="130" cy="77" r="1" fill="#ffffff"/>

  <!-- Eyebrows / Expression (Playful) -->
  <path d="M 106 70 Q 111 67 116 71" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <path d="M 124 71 Q 129 67 134 70" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>

  <!-- Cute Nose -->
  <ellipse cx="120" cy="84" rx="2.5" ry="1.5" fill="#92400e"/>

  <!-- Cheerful Open Smile -->
  <path d="M 113 88 Q 120 96 127 88" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="106" cy="86" r="3" fill="#fca5a5" opacity="0.6"/>
  <circle cx="134" cy="86" r="3" fill="#fca5a5" opacity="0.6"/>

  <!-- Prop: A bright yellow banana being held/looked at -->
  <g transform="translate(145, 55) rotate(-30)">
    <path d="M 0 15 Q 10 0 25 5 Q 15 12 0 15 Z" fill="#fbbf24"/>
    <path d="M 0 15 Q 10 5 25 5 Q 15 15 0 15 Z" fill="#f59e0b"/>
    <!-- Banana stem -->
    <path d="M -3 16 L 0 15 L -1 18 Z" fill="#451a03"/>
  </g>

  <!-- Additional environmental props: Floating tropical leaf / flower -->
  <path d="M 195 110 Q 210 100 215 120 Q 195 130 195 110 Z" fill="#10b981" opacity="0.8"/>
  <path d="M 215 115 Q 230 110 230 125 Q 215 130 215 115 Z" fill="#34d399" opacity="0.7"/>

  <!-- Small glowing fireflies/sparkles for magical app asset feel -->
  <circle cx="70" cy="100" r="2" fill="#fde047" opacity="0.8"/>
  <circle cx="160" cy="130" r="1.5" fill="#fde047" opacity="0.9"/>
  <circle cx="100" cy="40" r="2" fill="#fde047" opacity="0.7"/>
  <circle cx="45" cy="70" r="1" fill="#fde047" opacity="0.9"/>
</svg>