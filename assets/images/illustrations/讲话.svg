<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Stage Backdrop -->
  <path d="M40 180 L200 180 L190 140 L50 140 Z" fill="#334155"/>
  <circle cx="120" cy="110" r="35" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Podium -->
  <path d="M100 210 L140 210 L135 160 L105 160 Z" fill="#475569"/>
  <path d="M95 160 L145 160 L140 150 L100 150 Z" fill="#64748b"/>
  
  <!-- Principal -->
  <g transform="translate(120, 155)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="15" ry="25" fill="#f1f5f9"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="18" fill="#fde68a"/>
    <!-- Graduation Cap -->
    <path d="M-25 -30 L25 -30 L20 -40 L-20 -40 Z" fill="#1e293b"/>
    <rect x="-2" y="-40" width="4" height="10" fill="#1e293b"/>
    <circle cx="0" cy="-30" r="3" fill="#fb923c"/>
    <!-- Glasses -->
    <ellipse cx="-7" cy="-22" rx="4" ry="3" fill="none" stroke="#1e293b" stroke-width="1"/>
    <ellipse cx="7" cy="-22" rx="4" ry="3" fill="none" stroke="#1e293b" stroke-width="1"/>
    <!-- Arm gesturing -->
    <path d="M15 5 L30 -5" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Graduation elements -->
  <path d="M20 220 C40 200, 60 200, 80 220" stroke="#10b981" stroke-width="3" fill="none"/>
  <path d="M160 220 C180 200, 200 200, 220 220" stroke="#ec4899" stroke-width="3" fill="none"/>
  
  <!-- Spotlight effect -->
  <path d="M80 0 L160 0 L240 240 L0 240 Z" fill="url(#lightGrad)" opacity="0.05"/>
  <defs>
    <linearGradient id="lightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>