<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Street Elements -->
  <path d="M20 180 L220 180 L240 240 L0 240 Z" fill="#334155"/>
  <rect x="40" y="100" width="30" height="80" fill="#475569"/>
  <rect x="170" y="120" width="40" height="60" fill="#475569"/>
  <circle cx="190" cy="140" r="5" fill="#fbbf24"/>
  
  <!-- The Local Guide (Subject) -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="-20" r="15" fill="#fde68a"/>
    <path d="M-5 -15 Q0 -10 5 -15" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="-15" y="-5" width="30" height="40" rx="5" fill="#38bdf8"/>
    <path d="M-15 35 L-20 80 M15 35 L20 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M-10 35 L-10 80 M10 35 L10 80" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 0 L-20 20" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- The Visitor -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="-20" r="12" fill="#e2e8f0"/>
    <rect x="-10" y="-8" width="20" height="30" rx="4" fill="#ec4899"/>
    <path d="M-8 22 L-12 60 M8 22 L12 60" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Directional Gesture -->
  <path d="M110 90 L140 70" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="145" cy="65" r="4" fill="#fbbf24"/>
  
  <!-- Street Lamp Glow -->
  <circle cx="40" cy="80" r="20" fill="#fbbf24" opacity="0.2"/>
  <rect x="38" y="80" width="4" height="100" fill="#94a3b8"/>
</svg>