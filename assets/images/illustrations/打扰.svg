<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT & PROPS: Background Layer -->
  <g id="environment-background">
    <!-- Bookshelf behind -->
    <rect x="20" y="40" width="60" height="100" rx="4" fill="#334155" />
    <rect x="28" y="50" width="44" height="8" rx="2" fill="#475569" />
    <rect x="28" y="75" width="44" height="8" rx="2" fill="#475569" />
    <rect x="28" y="100" width="44" height="8" rx="2" fill="#475569" />
    <!-- Colorful books on shelf -->
    <path d="M32 50 L32 42 L38 42 L38 50 Z" fill="#ec4899" />
    <path d="M40 50 L40 40 L47 40 L47 50 Z" fill="#38bdf8" />
    <path d="M50 50 L50 44 L56 44 L56 50 Z" fill="#10b981" />
    
    <!-- Window with night city silhouette -->
    <rect x="170" y="35" width="50" height="70" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="2" />
    <path d="M175 75 L185 65 L190 70 L205 55 L215 75 Z" fill="#1e293b" />
    <circle cx="210" cy="45" r="3" fill="#fbbf24" opacity="0.8" />

    <!-- Wall clock -->
    <circle cx="105" cy="50" r="14" fill="#334155" stroke="#475569" stroke-width="2" />
    <line x1="105" y1="50" x2="105" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="105" y1="50" x2="112" y2="50" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Desk and Workspace Props -->
  <g id="desk-and-props">
    <!-- Desk Surface -->
    <rect x="15" y="150" width="210" height="60" rx="6" fill="#475569" filter="url(#shadow)" />
    <rect x="15" y="146" width="210" height="10" rx="3" fill="#64748b" />

    <!-- Desk Lamp (Light source) -->
    <circle cx="190" cy="90" r="40" fill="url(#lamp-glow)" />
    <path d="M185 150 L195 150 L198 120 L182 120 Z" fill="#64748b" />
    <path d="M190 120 L190 95 L210 85" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M198 75 C198 70 215 70 220 85 L200 90 Z" fill="#fbbf24" />

    <!-- Laptop (Main Working Prop) -->
    <path d="M70 150 L110 150 L115 130 L65 130 Z" fill="#94a3b8" /> <!-- Keyboard base -->
    <rect x="70" y="100" width="45" height="32" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="2" /> <!-- Screen -->
    <rect x="73" y="103" width="39" height="26" rx="2" fill="url(#screen-glow)" /> <!-- Display content -->
    <!-- Code/Chart lines on screen -->
    <line x1="77" y1="109" x2="95" y2="109" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="77" y1="115" x2="101" y2="115" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="77" y1="121" x2="88" y2="121" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

    <!-- Coffee Mug -->
    <rect x="130" y="130" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M146 135 C152 135 152 145 146 147" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M135 124 C133 120 139 116 137 112" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- MAIN CHARACTER 1: The Focused Worker (Sitting) -->
  <g id="seated-character" filter="url(#shadow)">
    <!-- Chair Back -->
    <rect x="50" y="85" width="22" height="70" rx="6" fill="#334155" />
    
    <!-- Body & Hoodie -->
    <path d="M60 115 L85 115 L90 155 L55 155 Z" fill="#3b82f6" />
    <!-- Head -->
    <circle cx="72" cy="98" r="13" fill="#ffedd5" />
    <!-- Hair -->
    <path d="M60 98 C60 88 84 88 84 98 C84 94 80 90 72 90 C64 90 60 94 60 98 Z" fill="#1e293b" />
    <!-- Focused facial expression (brows slightly furrowed in deep work) -->
    <line x1="66" y1="96" x2="71" y2="97" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <line x1="74" y1="97" x2="79" y2="96" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="68" cy="100" r="1" fill="#334155" />
    <circle cx="77" cy="100" r="1" fill="#334155" />

    <!-- Right Arm (Typing) -->
    <path d="M80 120 L95 135 L80 140" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="79" cy="141" r="4" fill="#ffedd5" />
  </g>

  <!-- MAIN CHARACTER 2: The Intruder/Interrupter (Standing - The Action of '打扰' / 'Làm phiền') -->
  <g id="intruding-character" filter="url(#shadow)">
    <!-- Body / Torso (Leaning forward eagerly to interrupt) -->
    <path d="M135 115 C135 115 155 125 145 160 L125 165 C125 165 120 135 135 115 Z" fill="#ec4899" />
    
    <!-- Head (Tilted, eyes wide, talking/interrupting expression) -->
    <circle cx="150" cy="95" r="13" fill="#ffedd5" />
    <!-- Hair (Dynamic ponytail) -->
    <path d="M138 92 C138 82 158 82 160 90 C168 85 172 92 166 98 C162 102 145 102 138 92 Z" fill="#475569" />
    <!-- Face: Surprised/Urgent Expression -->
    <circle cx="146" cy="95" r="1.5" fill="#1e293b" />
    <circle cx="154" cy="95" r="1.5" fill="#1e293b" />
    <!-- Open mouth (speaking/interrupting) -->
    <path d="M149 101 C149 100 153 100 153 102 C153 104 149 104 149 101 Z" fill="#be123c" />
    <!-- Raised Eyebrows -->
    <path d="M144 91 C145 90 148 90 149 91" fill="none" stroke="#475569" stroke-width="1.2" stroke-linecap="round" />
    <path d="M152 91 C153 90 156 90 157 91" fill="none" stroke="#475569" stroke-width="1.2" stroke-linecap="round" />

    <!-- Left Arm & Hand Reaching Out (CRITICAL ACTION PROP: Tapping/Interrupting gesture) -->
    <!-- Upper arm & forearm stretching forward towards the seated person's shoulder -->
    <path d="M140 122 C140 122 170 120 180 125" fill="none" stroke="#ec4899" stroke-width="7" stroke-linecap="round" />
    <!-- Hand gently tapping / reaching the seated person's shoulder -->
    <circle cx="183" cy="126" r="5" fill="#ffedd5" />

    <!-- Motion Lines indicating sudden intrusion / interruption movement -->
    <path d="M190 118 C195 122 195 128 190 133" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" />
    <path d="M194 114 C201 120 201 130 194 137" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6" />

    <!-- Legs (Leaning stance) -->
    <path d="M130 160 L120 200 L110 200" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M140 160 L150 200 L160 200" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND ACCENTS & POLISH -->
  <g id="foreground-elements">
    <!-- Subtle overlay lighting for atmosphere -->
    <circle cx="190" cy="80" r="15" fill="#ffffff" opacity="0.1" />
  </g>
</svg>