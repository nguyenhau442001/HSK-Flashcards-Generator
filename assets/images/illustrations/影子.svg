<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="20%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Wall & Floor Structure -->
  <rect x="0" y="0" width="240" height="180" fill="#1b2538"/>
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="url(#floor-grad)"/>
  <!-- Floorboard Line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>

  <!-- Ambient Lamp Glow Effect -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" pointer-events="none"/>

  <!-- Window with Night City View -->
  <g transform="translate(150, 25)">
    <rect x="0" y="0" width="60" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <!-- Window pane highlights -->
    <rect x="6" y="6" width="21" height="73" fill="#131b2e"/>
    <rect x="33" y="6" width="21" height="73" fill="#131b2e"/>
    <!-- Tiny distant city lights -->
    <circle cx="12" cy="20" r="1.5" fill="#f59e0b" opacity="0.6"/>
    <circle cx="20" cy="45" r="1" fill="#38bdf8" opacity="0.5"/>
    <circle cx="42" cy="30" r="1.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="48" cy="65" r="1" fill="#ec4899" opacity="0.6"/>
  </g>

  <!-- Wall Shelf with Plant -->
  <g transform="translate(20, 40)">
    <rect x="0" y="0" width="45" height="4" rx="2" fill="#475569"/>
    <!-- Pot -->
    <path d="M14 0 L18 -12 L28 -12 L32 0 Z" fill="#ec4899"/>
    <!-- Plant Leaves -->
    <path d="M23 -12 C18 -25 10 -20 15 -30 C20 -20 23 -12 23 -12 Z" fill="#10b981"/>
    <path d="M23 -12 C28 -28 35 -22 30 -32 C25 -22 23 -12 23 -12 Z" fill="#34d399"/>
  </g>

  <!-- SHADOW ON THE WALL (The core of "墙上有他的影子") -->
  <!-- Crisp, stylish projection of the man and his hat/pose -->
  <g transform="translate(2, -5)">
    <path d="
      M 78 175 
      L 74 125 
      Q 72 105 84 95
      L 88 88
      Q 84 78 88 72
      Q 93 67 101 70
      Q 108 76 106 88
      L 112 100
      L 104 125
      L 102 175
      Z" 
      fill="#090d16" opacity="0.85"/>
  </g>

  <!-- Floor Lamp (Light Source) -->
  <g transform="translate(25, 60)">
    <!-- Lamp Base -->
    <ellipse cx="20" cy="120" rx="14" ry="5" fill="#334155"/>
    <!-- Pole -->
    <line x1="20" y1="120" x2="20" y2="25" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <!-- Lamp Shade -->
    <path d="M8 25 L32 25 L26 8 L14 8 Z" fill="#fb923c"/>
    <!-- Bulb Glow -->
    <circle cx="20" cy="23" r="6" fill="#fef08a"/>
  </g>

  <!-- The Man (Character) -->
  <g transform="translate(55, 65)">
    <!-- Right Arm / Hand holding prop -->
    <path d="M 32 45 Q 45 42 42 35" fill="none" stroke="#f1f5f9" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Torso -->
    <path d="M 18 35 Q 18 25 28 25 L 42 25 Q 52 25 52 35 L 48 85 L 22 85 Z" fill="#38bdf8"/>
    
    <!-- Head & Hat -->
    <!-- Neck -->
    <rect x="30" y="16" width="10" height="12" fill="#fed7aa"/>
    <!-- Head -->
    <circle cx="35" cy="12" r="13" fill="#fed7aa"/>
    <!-- Stylish Cap -->
    <path d="M 21 8 Q 35 2 49 8 L 47 14 C 40 12 30 12 23 14 Z" fill="#475569"/>
    <path d="M 45 10 Q 53 11 56 13 Q 53 15 45 14 Z" fill="#334155"/>

    <!-- Left Arm -->
    <path d="M 22 35 Q 10 45 15 55" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>

    <!-- Legs & Shoes -->
    <path d="M 26 85 L 24 125 L 32 125 L 34 95" fill="#334155"/>
    <path d="M 44 85 L 46 125 L 38 125 L 36 95" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="28" cy="126" rx="7" ry="3" fill="#0f172a"/>
    <ellipse cx="42" cy="126" rx="7" ry="3" fill="#0f172a"/>
  </g>

  <!-- Small Houseplant on Table / Stool -->
  <g transform="translate(175, 135)">
    <!-- Wooden Stool -->
    <rect x="0" y="25" width="30" height="4" rx="2" fill="#94a3b8"/>
    <line x1="5" y1="29" x2="2" y2="45" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="29" x2="28" y2="45" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Plant Pot & Foliage -->
    <path d="M 8 25 L 11 12 L 19 12 L 22 25 Z" fill="#f43f5e"/>
    <circle cx="15" cy="8" r="10" fill="#10b981"/>
    <circle cx="10" cy="5" r="7" fill="#34d399"/>
    <circle cx="20" cy="6" r="6" fill="#059669"/>
  </g>

</svg>