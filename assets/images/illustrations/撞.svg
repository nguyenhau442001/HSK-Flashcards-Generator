<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Room Interior & Environment (Warm background contrast with dark mode) -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#1e293b"/>
  <!-- Wall baseboard -->
  <rect x="0" y="152" width="240" height="8" fill="#334155"/>

  <!-- Background Props: Bookshelf / Window -->
  <rect x="25" y="60" width="50" height="80" rx="4" fill="#334155" opacity="0.4"/>
  <line x1="25" y1="90" x2="75" y2="90" stroke="#475569" stroke-width="3"/>
  <line x1="25" y1="120" x2="75" y2="120" stroke="#475569" stroke-width="3"/>

  <!-- Warm ambient light from lamp -->
  <circle cx="160" cy="50" r="70" fill="#fbbf24" opacity="0.08"/>

  <!-- The Wooden Table (Target of the collision) -->
  <g id="wooden-table">
    <!-- Table Legs -->
    <rect x="125" y="145" width="8" height="60" fill="#b45309" rx="2"/>
    <rect x="185" y="145" width="8" height="60" fill="#b45309" rx="2"/>
    <!-- Table Top -->
    <path d="M110 135 L215 135 L225 145 L100 145 Z" fill="#d97706"/>
    <!-- Table Props (Mug tipping over) -->
    <ellipse cx="140" cy="132" rx="6" ry="3" fill="#f8fafc"/>
    <path d="M137 132 L132 120 L148 120 L143 132 Z" fill="#38bdf8"/>
    <!-- Motion lines for the falling mug -->
    <path d="M125 115 Q130 110 135 115" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Splashing droplets -->
    <circle cx="120" cy="125" r="2" fill="#38bdf8"/>
    <circle cx="115" cy="132" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- The Character (Man bumping into the table) -->
  <g id="clumsy-character">
    <!-- Motion / Impact Effect Lines -->
    <path d="M95 125 L105 120" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <path d="M92 140 L102 135" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="103" cy="130" r="18" fill="#fbbf24" opacity="0.2"/>

    <!-- Left Leg (Stumbling forward) -->
    <path d="M105 165 L95 205 L80 208" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <ellipse cx="76" cy="209" rx="8" ry="4" fill="#334155"/>

    <!-- Right Leg (Knocked back/bent) -->
    <path d="M85 165 L70 185 L55 180" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <ellipse cx="52" cy="177" rx="7" ry="4" fill="#334155"/>

    <!-- Torso (Leaning forward dynamically) -->
    <path d="M75 125 C80 120 95 130 90 165 L75 165 Z" fill="#ec4899"/>
    
    <!-- Backpack -->
    <rect x="58" y="125" width="16" height="30" rx="6" fill="#0284c7"/>

    <!-- Head & Face (Startled expression) -->
    <circle cx="85" cy="102" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M72 100 C72 90 98 90 98 102 C95 97 75 97 72 100 Z" fill="#1e293b"/>
    <!-- Startled Open Mouth -->
    <ellipse cx="92" cy="106" rx="3" ry="4" fill="#1e293b"/>
    <!-- Wide Eye -->
    <circle cx="88" cy="99" r="2.5" fill="#1e293b"/>
    <circle cx="89" cy="98" r="1" fill="#ffffff"/>
    <!-- Sweat drop of panic -->
    <path d="M99 94 C99 94 103 98 103 100 C103 102 101 103 99 103 C97 103 95 102 95 100 C95 98 99 94 99 94 Z" fill="#38bdf8"/>

    <!-- Right Arm (Reaching out in shock/balance) -->
    <path d="M85 130 L108 128" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
    <!-- Left Arm (Flailing back) -->
    <path d="M75 130 L55 145" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Impact Flash / Stars -->
  <g transform="translate(105, 125)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fbbf24"/>
    <path d="M8 -8 L9 -4 L13 -3 L9 -2 L8 2 L7 -2 L3 -3 L7 -4 Z" fill="#f8fafc" transform="scale(0.6) translate(10, -10)"/>
  </g>
</svg>