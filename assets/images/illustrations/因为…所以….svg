<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Rain Effect -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.4">
    <line x1="20" y1="0" x2="20" y2="240"/>
    <line x1="60" y1="0" x2="60" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="240"/>
    <line x1="140" y1="0" x2="140" y2="240"/>
    <line x1="180" y1="0" x2="180" y2="240"/>
    <line x1="220" y1="0" x2="220" y2="240"/>
  </g>

  <!-- Doorway/Interior Frame -->
  <path d="M40 240 V 60 C 40 40 60 20 120 20 S 200 40 200 60 V 240" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- Characters inside (safe from rain) -->
  <g transform="translate(80, 120)">
    <circle cx="20" cy="30" r="15" fill="#fbbf24"/>
    <path d="M5 50 Q 20 60 35 50" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <circle cx="60" cy="30" r="15" fill="#fb923c"/>
    <path d="M45 50 Q 60 60 75 50" stroke="#f59e0b" stroke-width="3" fill="none"/>
  </g>

  <!-- Puddle outside -->
  <ellipse cx="120" cy="220" rx="80" ry="15" fill="#0f172a" opacity="0.6"/>
  
  <!-- Umbrella left behind/outside -->
  <path d="M180 180 L 180 220 M 160 180 C 160 150 200 150 200 180 Z" fill="#ec4899" stroke="#db2777" stroke-width="2"/>
  
  <!-- Rain splash details -->
  <circle cx="150" cy="210" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="190" cy="215" r="2" fill="#38bdf8" opacity="0.8"/>
</svg>