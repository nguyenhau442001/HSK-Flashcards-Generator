<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Court Floor -->
  <path d="M20 180 L220 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M40 180 L200 180 L220 240 L20 240 Z" fill="#475569"/>
  
  <!-- Speed Lines / Atmosphere -->
  <path d="M120 80 L160 40" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <path d="M130 90 L180 50" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- The Ball (Action) -->
  <circle cx="120" cy="120" r="18" fill="#fb923c"/>
  <path d="M105 110 Q120 120 135 110" stroke="#0f172a" stroke-width="2" fill="none"/>
  <path d="M105 130 Q120 120 135 130" stroke="#0f172a" stroke-width="2" fill="none"/>
  
  <!-- Player 1 (Left) -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="25" fill="#38bdf8"/>
    <path d="M10 30 Q20 40 30 30" stroke="#0f172a" stroke-width="3" fill="none"/>
    <rect x="10" y="45" width="20" height="60" rx="5" fill="#38bdf8"/>
    <path d="M5 50 L-10 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Player 2 (Right) -->
  <g transform="translate(160, 100)">
    <circle cx="20" cy="20" r="25" fill="#ec4899"/>
    <path d="M10 30 Q20 40 30 30" stroke="#0f172a" stroke-width="3" fill="none"/>
    <rect x="10" y="45" width="20" height="60" rx="5" fill="#ec4899"/>
    <path d="M35 50 L50 80" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Net -->
  <rect x="118" y="140" width="4" height="60" fill="#94a3b8"/>
  <path d="M110 150 L130 150 M110 160 L130 160 M110 170 L130 170" stroke="#cbd5e1" stroke-width="1"/>
</svg>