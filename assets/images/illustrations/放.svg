<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Desk Light Gradient -->
    <radialGradient id="desk-light" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Action Aura for Placement -->
    <radialGradient id="action-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="book-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Wood Texture Gradient for Table -->
    <linearGradient id="table-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="table-surface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#desk-light)"/>

  <!-- Atmospheric Background Elements (Bookshelf / Ambient shapes) -->
  <g opacity="0.3">
    <rect x="25" y="40" width="45" height="12" rx="3" fill="#64748b"/>
    <rect x="75" y="46" width="30" height="6" rx="2" fill="#475569"/>
    <circle cx="190" cy="50" r="15" fill="#38bdf8" opacity="0.2"/>
  </g>

  <!-- Placement Motion Arc (Indicating "putting down" action) -->
  <path d="M 85 65 Q 120 40 145 105" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.8"/>
  <circle cx="145" cy="105" r="30" fill="url(#action-glow)"/>

  <!-- Wooden Table / Desk Surface -->
  <!-- Table Base/Front -->
  <path d="M 20 160 L 220 160 L 220 210 C 220 221 211 230 200 230 L 40 230 C 28 230 20 221 20 210 Z" fill="#0f172a"/>
  <!-- Table Top Slab -->
  <path d="M 15 140 L 225 140 L 210 165 L 30 165 Z" fill="url(#table-top)"/>
  <!-- Table Edge Highlight -->
  <path d="M 15 140 L 225 140 L 228 143 L 12 143 Z" fill="#94a3b8" opacity="0.4"/>

  <!-- Context Prop: Desk Lamp on the side -->
  <g transform="translate(190, 110)">
    <path d="M 0 30 L 10 30 L 5 0 Z" fill="#475569"/>
    <path d="M -5 -5 L 15 -5 L 10 -20 L 0 -20 Z" fill="#38bdf8"/>
    <!-- Lamp Glow -->
    <path d="M -15 -5 L 25 -5 L 45 40 L -35 40 Z" fill="#38bdf8" opacity="0.1"/>
  </g>

  <!-- Context Prop: Small Potted Plant -->
  <g transform="translate(35, 115)">
    <path d="M 5 25 L 15 25 L 18 45 L 2 45 Z" fill="#cbd5e1"/>
    <ellipse cx="10" cy="25" rx="5" ry="2" fill="#94a3b8"/>
    <!-- Leaves -->
    <circle cx="10" cy="15" r="10" fill="#10b981"/>
    <circle cx="3" cy="20" r="7" fill="#059669"/>
    <circle cx="17" cy="18" r="8" fill="#34d399"/>
  </g>

  <!-- BACKGROUND BOOK (Already placed flat on table) -->
  <g transform="translate(60, 142) rotate(-5)">
    <polygon points="0,15 50,0 75,20 25,35" fill="#0f172a"/>
    <polygon points="0,15 25,35 25,40 0,20" fill="#334155"/>
    <polygon points="25,35 75,20 75,25 25,40" fill="#475569"/>
    <!-- Pages edge -->
    <path d="M 2 18 L 48 3 L 71 21 L 25 36 Z" fill="#f8fafc"/>
  </g>

  <!-- MAIN OBJECT BEING PLACED: The Book (Angled mid-placement, dynamic tilt) -->
  <g transform="translate(110, 85) rotate(15)">
    <!-- Book Shadow on Table -->
    <ellipse cx="25" cy="55" rx="30" ry="10" fill="#0f172a" opacity="0.6"/>

    <!-- Book Back Cover / Thickness -->
    <path d="M 5 35 L 45 50 L 45 55 L 5 40 Z" fill="#b45309"/>
    <path d="M 45 50 L 75 35 L 75 40 L 45 55 Z" fill="#d97706"/>

    <!-- Book Pages (Middle block) -->
    <path d="M 3 15 L 43 30 L 43 35 L 3 20 Z" fill="#e2e8f0"/>
    <path d="M 43 30 L 73 15 L 73 20 L 43 35 Z" fill="#cbd5e1"/>

    <!-- Book Front Cover -->
    <path d="M 0 10 L 40 25 L 70 10 L 30 -5 Z" fill="url(#book-grad)"/>
    
    <!-- Cover Spine Accent -->
    <path d="M 15 2.5 L 35 10 L 35 15 L 15 7.5 Z" fill="#fb923c" opacity="0.6"/>

    <!-- Bookmark ribbon hanging down -->
    <path d="M 45 23 Q 48 35 52 45 L 47 48 L 42 38 Z" fill="#ec4899"/>
  </g>

  <!-- HAND PLACING THE BOOK (Friendly, expressive vector hand) -->
  <g transform="translate(125, 45)">
    <!-- Arm/Sleeve -->
    <path d="M 30 -20 Q 50 10 70 30 L 50 50 Q 30 30 10 0 Z" fill="#38bdf8"/>
    
    <!-- Hand Palm & Fingers gripping/guiding the book -->
    <path d="M 15 15 C 5 20 -5 30 0 40 C 5 50 20 55 30 45 C 35 40 40 30 35 20 Z" fill="#fcd34d"/>
    
    <!-- Thumb pressing gently on top -->
    <path d="M 25 10 C 20 5 10 10 15 20 C 18 25 25 20 28 15 Z" fill="#fbbf24"/>
  </g>

  <!-- Action Sparkles / Focus Highlights around the placement point -->
  <g fill="#fbbf24">
    <circle cx="105" cy="115" r="2.5"/>
    <circle cx="165" cy="95" r="2"/>
    <path d="M 135 70 L 137 75 L 142 77 L 137 79 L 135 84 L 133 79 L 128 77 L 133 75 Z" opacity="0.8"/>
  </g>

</svg>