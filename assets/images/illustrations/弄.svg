<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Props -->
  <!-- Wallpaper Lines / Details -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="40" x2="240" y2="40" />
    <line x1="0" y1="80" x2="240" y2="80" />
    <line x1="0" y1="120" x2="240" y2="120" />
  </g>

  <!-- Window in Background -->
  <rect x="25" y="30" width="45" height="60" rx="4" fill="#334155" />
  <polygon points="25,30 50,55 25,80" fill="url(#windowLight)" />
  <line x1="47" y1="30" x2="47" y2="90" stroke="#1e293b" stroke-width="2" />
  <line x1="25" y1="60" x2="70" y2="60" stroke="#1e293b" stroke-width="2" />

  <!-- Bookshelf Background Left -->
  <rect x="10" y="90" width="35" height="70" fill="#334155" rx="2" />
  <rect x="13" y="110" width="29" height="4" fill="#475569" />
  <rect x="13" y="135" width="29" height="4" fill="#475569" />
  <!-- Disorganized Books on Shelf -->
  <rect x="15" y="98" width="6" height="12" fill="#f43f5e" />
  <rect x="22" y="95" width="5" height="15" fill="#38bdf8" />
  <rect x="28" y="100" width="8" height="10" fill="#fbbf24" transform="rotate(15 32 105)" />
  <rect x="15" y="120" width="15" height="15" fill="#10b981" transform="rotate(-10 22 127)" />

  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Messy Room Floor Clutter (Props representing "làm lộn xộn") -->
  <!-- Scattered paper 1 -->
  <polygon points="50,195 65,190 70,205 55,210" fill="#f8fafc" filter="url(#shadow)" />
  <line x1="55" y1="198" x2="62" y2="196" stroke="#cbd5e1" stroke-width="1" />
  <line x1="54" y1="203" x2="65" y2="200" stroke="#cbd5e1" stroke-width="1" />

  <!-- Toppled Lamp -->
  <path d="M180,210 L210,195" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <path d="M175,200 L185,220 L170,225 Z" fill="#fbbf24" />
  <circle cx="195" cy="202" r="12" fill="url(#lampGlow)" />

  <!-- Scattered Toy Block / Box -->
  <rect x="140" y="200" width="14" height="14" fill="#ec4899" transform="rotate(25 147 207)" filter="url(#shadow)" />
  <rect x="30" y="210" width="18" height="12" fill="#8b5cf6" transform="rotate(-15 39 216)" filter="url(#shadow)" />
  
  <!-- Tangled Cord / Clothes on Floor -->
  <path d="M80,215 Q95,205 110,220 T135,215" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
  <path d="M190,185 Q205,190 200,210" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Main Character & Immediate Action Props -->
  <!-- Laundry Basket (Overturned/Messy) -->
  <g transform="translate(100, 150)">
    <path d="M10,30 Q15,0 45,0 Q75,0 80,30 Z" fill="#64748b" filter="url(#shadow)" />
    <path d="M5,30 L85,30 L90,45 L0,45 Z" fill="#475569" />
    <!-- Spilling clothes -->
    <path d="M25,35 Q10,40 5,55 Q20,60 35,45 Z" fill="#ec4899" />
    <path d="M55,35 Q70,45 80,55 Q65,65 50,45 Z" fill="#38bdf8" />
  </g>

  <!-- Character: Frantically "manipulating/making a mess" (làm, thao tác) -->
  <g transform="translate(85, 90)">
    <!-- Body / Torso (Dynamic leaning pose) -->
    <path d="M35,45 Q50,30 55,55 L50,90 L20,90 Z" fill="#38bdf8" filter="url(#shadow)" />
    
    <!-- Head & Face -->
    <g transform="translate(35, 15)">
      <!-- Hair -->
      <path d="M-10,-5 Q10,-15 25,-5 Q30,15 15,25 Q-5,25 -10,-5 Z" fill="#1e293b" />
      <!-- Face Base -->
      <circle cx="5" cy="10" r="14" fill="#fcd34d" />
      <!-- Expressive Eyes (Surprised/Active) -->
      <circle cx="2" cy="8" r="2" fill="#1e293b" />
      <circle cx="12" cy="8" r="2" fill="#1e293b" />
      <!-- Open Mouth (Frantic expression) -->
      <ellipse cx="7" cy="15" rx="3" ry="4" fill="#1e293b" />
      <!-- Sweat drop for comical action -->
      <path d="M18,2 Q22,8 18,12 Q14,8 18,2 Z" fill="#38bdf8" />
    </g>

    <!-- Arms in dynamic motion (flinging items) -->
    <!-- Left Arm (Reaching back/up) -->
    <path d="M32,42 Q15,30 5,45" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" />
    <!-- Right Arm (Swinging down/forward tossing things) -->
    <path d="M52,48 Q70,40 85,55" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="5" cy="45" r="4" fill="#f59e0b" />
    <circle cx="85" cy="55" r="4" fill="#f59e0b" />

    <!-- Legs (Kneeling/Stomping in the mess) -->
    <!-- Back Leg -->
    <path d="M22,85 L5,110 L15,115" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Leg -->
    <path d="M45,85 L55,110 L45,115" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Flying/Action Props (Emphasizing the 'làm' / action of messing up) -->
  <!-- Flying Pillow -->
  <g transform="translate(160, 70) rotate(-25)">
    <rect x="0" y="0" width="30" height="20" rx="6" fill="#f43f5e" filter="url(#shadow)" />
    <path d="M15,0 Q18,10 15,20" fill="none" stroke="#fda4af" stroke-width="2" />
  </g>

  <!-- Flying Sock -->
  <path d="M60,60 Q50,50 40,65 L45,80 Q55,85 60,75 Z" fill="#10b981" filter="url(#shadow)" transform="rotate(45 50 70)" />

  <!-- Action Motion Lines / Sparkles of Activity -->
  <path d="M140,80 Q150,75 155,85" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <path d="M70,120 Q60,115 65,105" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <circle cx="150" cy="50" r="2" fill="#fbbf24" />
  <circle cx="40" cy="110" r="3" fill="#38bdf8" />
  <circle cx="170" cy="130" r="2.5" fill="#ec4899" />

  <!-- Foreground Atmospheric Lighting/Vignette -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>