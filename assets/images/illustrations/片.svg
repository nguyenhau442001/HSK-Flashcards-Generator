<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Kitchen/Table Surface -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Bread Gradient -->
    <linearGradient id="breadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="20%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Bread Crust -->
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Knife Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Character Skin Tone -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Kitchen Background Elements (Warm ambient circles) -->
  <circle cx="190" cy="60" r="40" fill="#334155" opacity="0.3" />
  <circle cx="50" cy="180" r="60" fill="#1e293b" opacity="0.5" />

  <!-- Kitchen Counter / Table Top -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#tableGrad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="3" />

  <!-- Wooden Cutting Board -->
  <g transform="translate(40, 155)">
    <!-- Board Body -->
    <ellipse cx="80" cy="20" rx="75" ry="18" fill="#b45309" />
    <ellipse cx="80" cy="18" rx="72" ry="15" fill="#d97706" />
    <!-- Wood grain details -->
    <path d="M 30 15 Q 80 22 130 15" stroke="#b45309" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 45 22 Q 80 27 115 22" stroke="#b45309" stroke-width="1" fill="none" opacity="0.4" />
    <!-- Handle -->
    <path d="M -5 14 L -20 14 C -25 14 -25 22 -20 22 L -5 22 Z" fill="#b45309" />
  </g>

  <!-- Bread Loaf & Slices (The Core Scene) -->
  <g transform="translate(60, 115)">
    <!-- Soft shadow beneath bread -->
    <ellipse cx="70" cy="45" rx="55" ry="10" fill="#020617" opacity="0.4" />

    <!-- Individual Bread Slice (The "片" being cut/produced) -->
    <g transform="translate(15, 5)">
      <!-- Slice Body -->
      <path d="M 10 5 C 10 -8 30 -8 35 5 C 40 18 35 40 22 42 C 8 40 5 18 10 5 Z" fill="url(#breadGrad)" />
      <!-- Slice Crust Border -->
      <path d="M 10 5 C 10 -8 30 -8 35 5 C 40 18 35 40 22 42 C 8 40 5 18 10 5 Z" stroke="url(#crustGrad)" stroke-width="3" fill="none" />
      <!-- Inner soft texture highlights -->
      <circle cx="22" cy="20" r="3" fill="#fef3c7" opacity="0.6" />
      <circle cx="16" cy="28" r="2" fill="#fef3c7" opacity="0.6" />
      <circle cx="28" cy="28" r="2.5" fill="#fef3c7" opacity="0.6" />
    </g>

    <!-- Main Bread Loaf Body -->
    <path d="M 35 2 C 45 -12 90 -12 105 2 C 120 16 115 42 95 45 C 50 48 30 35 35 2 Z" fill="url(#breadGrad)" />
    <!-- Loaf Crust Outline (Top and sides) -->
    <path d="M 35 2 C 45 -12 90 -12 105 2 C 120 16 115 42 95 45 C 50 48 30 35 35 2 Z" stroke="url(#crustGrad)" stroke-width="4" fill="none" />
    
    <!-- Loaf Score Marks / Texture -->
    <path d="M 60 5 C 65 20 62 35 58 43" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 85 4 C 90 19 87 34 83 44" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- Character: Chef / Person slicing bread (Upper Body) -->
  <g transform="translate(110, 50)">
    <!-- Chef Apron / Body -->
    <path d="M -20 125 L 80 125 L 60 75 L 0 75 Z" fill="#f8fafc" />
    <path d="M 20 75 L 20 125" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Chef Shirt (Emerald Green Accent) -->
    <path d="M -30 85 L 70 85 L 50 45 L -10 45 Z" fill="#10b981" />
    
    <!-- Neck -->
    <rect x="10" y="30" width="15" height="20" fill="url(#skinGrad)" />

    <!-- Head -->
    <circle cx="17" cy="18" r="18" fill="url(#skinGrad)" />

    <!-- Hair (Stylized modern neat cut, dark slate) -->
    <path d="M -1 10 C 0 -3 20 -4 33 5 C 33 12 25 15 25 15 C 25 15 15 3 2 10 Z" fill="#334155" />
    <circle cx="3" cy="15" r="3" fill="#334155" />

    <!-- Friendly Focused Face Profile -->
    <!-- Eye (concentrated/happy) -->
    <path d="M 20 16 Q 23 13 26 16" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheek -->
    <circle cx="23" cy="21" r="3.5" fill="#fb7185" opacity="0.6" />
    <!-- Gentle Smile -->
    <path d="M 22 24 Q 25 27 28 24" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Chef Hat (Toque Blanche) -->
    <g transform="translate(-2, -18)">
      <path d="M 5 10 C -2 10 -2 0 5 -2 C 6 -12 28 -12 29 -2 C 36 -2 36 10 29 10 Z" fill="#f8fafc" />
      <path d="M 5 10 L 29 10 L 27 16 L 7 16 Z" fill="#e2e8f0" />
      <!-- Hat Pleat shadow -->
      <path d="M 17 -2 L 17 10" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 2" />
    </g>

    <!-- Arms & Chef Knife Action -->
    <!-- Back Arm -->
    <path d="M -10 55 L -35 70 L -25 80" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Front Arm holding knife -->
    <g transform="translate(10, 50)">
      <!-- Sleeve -->
      <path d="M 0 0 L 35 25 L 25 35 L -5 15 Z" fill="#10b981" />
      <!-- Hand / Wrist -->
      <circle cx="33" cy="27" r="6" fill="url(#skinGrad)" />

      <!-- Bread Knife -->
      <g transform="translate(33, 27) rotate(-35)">
        <!-- Handle -->
        <path d="M -15 -4 L 0 -4 L 0 4 L -15 4 Z" rx="2" fill="#334155" />
        <circle cx="-11" cy="0" r="1.5" fill="#94a3b8" />
        <!-- Serrated Blade pointing down towards bread -->
        <path d="M 0 -3 L 75 -3 L 75 3 L 0 3 Z" fill="url(#bladeGrad)" />
        <!-- Serrations -->
        <path d="M 5 3 L 8 6 L 11 3 L 14 6 L 17 3 L 20 6 L 23 3 L 26 6 L 29 3 L 32 6 L 35 3 L 38 6 L 41 3 L 44 6 L 47 3 L 50 6 L 53 3 L 56 6 L 59 3 L 62 6 L 65 3 L 68 6 L 71 3" stroke="#cbd5e1" stroke-width="1" fill="none" />
      </g>
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Warm kitchen lighting particles) -->
  <circle cx="105" cy="95" r="2" fill="#fde047" opacity="0.8" />
  <circle cx="125" cy="115" r="1.5" fill="#fde047" opacity="0.6" />
  <circle cx="85" cy="85" r="1" fill="#fde047" opacity="0.5" />
  <circle cx="145" cy="85" r="2.5" fill="#fde047" opacity="0.7" />

  <!-- Accent frame/border glow -->
  <rect x="2" y="2" width="236" height="236" rx="22" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.15" />
</svg>