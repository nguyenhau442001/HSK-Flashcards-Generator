<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Decorative Background Glow / Elements -->
  <circle cx="100" cy="100" r="70" fill="#0f172a" opacity="0.6"/>

  <!-- Boarding Pass Ticket Shape (Angled for dynamic feel) -->
  <g transform="rotate(-12 100 100)">
    <!-- Main Ticket Body -->
    <path d="M 45 65 
             Q 45 60, 50 60 
             L 125 60 
             Q 128 60, 130 63 
             L 155 93 
             Q 158 96, 158 100 
             L 158 135 
             Q 158 140, 153 140 
             L 50 140 
             Q 45 140, 45 135 
             Z" 
          fill="#38bdf8" />

    <!-- Ticket Tear-off Stub (Right Side) -->
    <path d="M 163 100 
             Q 163 96, 166 93 
             L 182 63 
             Q 185 60, 189 60 
             L 190 60 
             Q 195 60, 195 65 
             L 195 135 
             Q 195 140, 190 140 
             L 189 140 
             Q 185 140, 182 137 
             L 166 107 
             Q 163 104, 163 100 
             Z" 
          fill="#0ea5e9" />

    <!-- Perforation Line Separator -->
    <line x1="160" y1="67" x2="161" y2="133" stroke="#1e293b" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"/>

    <!-- Airplane Icon Header -->
    <path d="M 60 82 
             L 75 75 
             L 77 79 
             L 70 83 
             L 78 86 
             L 83 83 
             L 85 86 
             L 73 92 
             L 60 82 Z" 
          fill="#ffffff" />
    
    <!-- Decorative Abstract Data Lines (No Text) -->
    <!-- Main Section Lines -->
    <rect x="60" y="100" width="40" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    <rect x="60" y="112" width="60" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
    <rect x="60" y="122" width="30" height="4" rx="2" fill="#f59e0b" opacity="0.9"/>

    <!-- Stub Section Lines -->
    <rect x="171" y="80" width="14" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="171" y="90" width="18" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
    <rect x="171" y="100" width="10" height="4" rx="2" fill="#f59e0b" opacity="0.9"/>

    <!-- Barcode Graphic Simulation on Stub -->
    <rect x="171" y="115" width="2" height="15" fill="#1e293b"/>
    <rect x="175" y="115" width="4" height="15" fill="#1e293b"/>
    <rect x="181" y="115" width="1" height="15" fill="#1e293b"/>
    <rect x="184" y="115" width="3" height="15" fill="#1e293b"/>
    <rect x="189" y="115" width="2" height="15" fill="#1e293b"/>
  </g>

  <!-- Floating Accent Elements (Modern Vector Touch) -->
  <!-- Emerald Accent Dot -->
  <circle cx="45" cy="135" r="6" fill="#10b981"/>
  <!-- Amber Accent Diamond/Square -->
  <rect x="145" y="45" width="10" height="10" rx="2" transform="rotate(45 150 50)" fill="#f59e0b"/>
  <!-- Coral Small Circle -->
  <circle cx="140" cy="145" r="4" fill="#fb923c"/>
</svg>