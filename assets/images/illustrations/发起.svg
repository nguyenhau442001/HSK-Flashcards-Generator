<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ground -->
  <path d="M0 190h240v50H0z" fill="#334155"/>
  
  <!-- Tree representing environment -->
  <path d="M180 190v-60c0-20-30-20-30 0v60" fill="#10b981" opacity="0.8"/>
  <circle cx="165" cy="110" r="25" fill="#10b981"/>
  
  <!-- Characters: The initiators -->
  <!-- Person 1 -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M20 32v30M10 50l20-10M30 50l-20-10" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 80l5-20 5 20" fill="#38bdf8"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(100, 130)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M20 32v30M10 40l20 20M30 40l-20 20" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 80l5-20 5 20" fill="#fb923c"/>
  </g>

  <!-- The "Initiation" element: A megaphone/announcement visual -->
  <path d="M130 100l40-20v40l-40-20z" fill="#fbbf24"/>
  <path d="M170 90l20-10v40l-20-10" fill="#f59e0b"/>
  
  <!-- Floating leaves/nature icons to symbolize environmental cause -->
  <path d="M40 80c5-10 15-10 20 0s-15 10-20 0" fill="#10b981"/>
  <path d="M200 60c5-10 15-10 20 0s-15 10-20 0" fill="#10b981"/>
  <path d="M80 50c5-10 15-10 20 0s-15 10-20 0" fill="#10b981"/>
  
  <!-- Decorative light bursts -->
  <circle cx="150" cy="70" r="2" fill="#fde68a"/>
  <circle cx="180" cy="50" r="3" fill="#fde68a"/>
</svg>