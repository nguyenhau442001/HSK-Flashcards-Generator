<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Interior Context -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#334155" opacity="0.3"/>
  <circle cx="180" cy="50" r="20" fill="#fbbf24"/>
  
  <!-- Delivery Person -->
  <g transform="translate(140, 100)">
    <path d="M20 100 L40 100 L35 60 L25 60 Z" fill="#38bdf8"/>
    <circle cx="30" cy="50" r="12" fill="#fde68a"/>
    <path d="M15 70 L25 80 L35 70" stroke="#38bdf8" stroke-width="4" fill="none"/>
    <rect x="15" y="30" width="30" height="25" rx="4" fill="#fb923c"/>
  </g>
  
  <!-- Customer at Door -->
  <g transform="translate(60, 90)">
    <path d="M10 110 L30 110 L25 70 L15 70 Z" fill="#10b981"/>
    <circle cx="20" cy="60" r="12" fill="#fde68a"/>
    <rect x="5" y="40" width="30" height="30" rx="5" fill="#ec4899"/>
  </g>
  
  <!-- Package -->
  <rect x="95" y="130" width="30" height="25" rx="2" fill="#f59e0b"/>
  <path d="M95 135 L125 135 M110 130 L110 155" stroke="#fff" stroke-width="2" opacity="0.2"/>
  
  <!-- Street/Ground -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
  
  <!-- Decorative Elements -->
  <circle cx="40" cy="180" r="3" fill="#38bdf8"/>
  <circle cx="200" cy="190" r="4" fill="#10b981"/>
  <path d="M180 150 Q200 140 220 150" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.5"/>
</svg>