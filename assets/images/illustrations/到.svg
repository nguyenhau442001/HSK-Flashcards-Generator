<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- School Building Background -->
  <path d="M40 180 L200 180 L200 80 L120 50 L40 80 Z" fill="#334155"/>
  <rect x="60" y="100" width="30" height="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="150" y="100" width="30" height="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="100" y="130" width="40" height="50" fill="#475569"/>
  
  <!-- Ground -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <path d="M0 180 L240 180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Character -->
  <g transform="translate(120, 100)">
    <!-- Backpack -->
    <path d="M-20 20 L20 20 L15 60 L-15 60 Z" fill="#fb923c"/>
    <!-- Body -->
    <path d="M-15 50 L15 50 L10 100 L-10 100 Z" fill="#ec4899"/>
    <!-- Arms (Action: Reaching forward/Arriving) -->
    <path d="M-15 60 L-40 80" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
    <path d="M15 60 L40 70" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
    <!-- Legs (Action: Mid-stride) -->
    <path d="M-5 100 L-15 140" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
    <path d="M5 100 L20 130" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="20" fill="#fde68a"/>
    <circle cx="-7" cy="25" r="3" fill="#0f172a"/>
    <circle cx="7" cy="25" r="3" fill="#0f172a"/>
    <path d="M-5 35 Q0 40 5 35" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>

  <!-- Decorative Elements -->
  <circle cx="200" cy="40" r="20" fill="#fbbf24" opacity="0.6"/>
  <path d="M180 190 L190 170 L200 190 Z" fill="#10b981"/>
</svg>