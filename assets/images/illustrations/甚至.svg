<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Lamp Light Gradient -->
    <radialGradient id="lamp-light" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="night-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Window with city night view -->
  <g transform="translate(155, 18)">
    <rect x="0" y="0" width="65" height="85" rx="6" fill="#090d16" stroke="#334155" stroke-width="3" />
    <rect x="6" y="6" width="53" height="73" fill="url(#night-sky)" />
    <!-- City lights in window -->
    <rect x="12" y="30" width="8" height="12" rx="1" fill="#fbbf24" opacity="0.6" />
    <rect x="24" y="20" width="8" height="22" rx="1" fill="#38bdf8" opacity="0.4" />
    <rect x="42" y="40" width="10" height="18" rx="1" fill="#f43f5e" opacity="0.5" />
    <rect x="15" y="55" width="12" height="15" rx="1" fill="#fbbf24" opacity="0.8" />
    <rect x="35" y="60" width="14" height="12" rx="1" fill="#38bdf8" opacity="0.7" />
    <!-- Window Crossbars -->
    <line x1="32" y1="6" x2="32" y2="79" stroke="#334155" stroke-width="2" />
    <line x1="6" y1="42" x2="59" y2="42" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Ambient Lamp Light Cone -->
  <polygon points="45,15 110,15 150,150 10,150" fill="url(#lamp-light)" />

  <!-- Wall Shelf with Books -->
  <g transform="translate(20, 25)">
    <rect x="0" y="0" width="90" height="6" rx="2" fill="#475569" />
    <!-- Books -->
    <rect x="10" y="-22" width="10" height="22" rx="2" fill="#ec4899" />
    <rect x="21" y="-26" width="12" height="26" rx="2" fill="#38bdf8" />
    <rect x="34" y="-18" width="8" height="18" rx="2" fill="#10b981" />
    <rect x="44" y="-24" width="14" height="24" rx="2" fill="#f59e0b" />
    <!-- Small plant -->
    <path d="M70,0 C70,-10 80,-15 80,-25 C80,-15 90,-10 90,0 Z" fill="#10b981" />
    <rect x="75" y="-6" width="10" height="6" rx="2" fill="#cbd5e1" />
  </g>

  <!-- Desk Surface -->
  <rect x="10" y="165" width="220" height="65" rx="4" fill="url(#desk-grad)" />
  <rect x="10" y="160" width="220" height="8" rx="2" fill="#475569" />

  <!-- Desk Lamp -->
  <g transform="translate(190, 95)">
    <path d="M0,70 L20,70 C20,70 25,50 15,35 C10,25 0,15 -10,10" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <!-- Lamp Shade -->
    <path d="M -25,0 L 5,0 L -2, -20 L -18, -20 Z" fill="#fbbf24" />
    <!-- Bulb Glow -->
    <circle cx="-10" cy="-5" r="8" fill="#fef08a" />
    <!-- Base -->
    <ellipse cx="5" cy="70" rx="12" ry="4" fill="#64748b" />
  </g>

  <!-- Computer Setup (Background element) -->
  <g transform="translate(125, 100)">
    <!-- Monitor Stand -->
    <rect x="25" y="45" width="10" height="18" fill="#475569" />
    <ellipse cx="30" cy="63" rx="22" ry="4" fill="#475569" />
    <!-- Monitor Screen -->
    <rect x="-10" y="0" width="80" height="48" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <!-- Screen content: charts/code -->
    <rect x="-2" y="8" width="40" height="32" fill="#1e293b" rx="2" />
    <rect x="42" y="8" width="22" height="14" fill="#10b981" opacity="0.8" rx="2" />
    <rect x="42" y="26" width="22" height="14" fill="#38bdf8" opacity="0.8" rx="2" />
    <!-- Code lines inside screen -->
    <line x1="4" y1="14" x2="28" y2="14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="20" x2="36" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="26" x2="20" y2="26" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="32" x2="32" y2="32" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Keyboard and Mouse -->
  <rect x="135" y="170" width="55" height="18" rx="3" fill="#64748b" />
  <!-- Keyboard keys pattern -->
  <line x1="140" y1="175" x2="185" y2="175" stroke="#475569" stroke-width="2" />
  <line x1="140" y1="180" x2="185" y2="180" stroke="#475569" stroke-width="2" />
  <ellipse cx="200" cy="179" rx="5" ry="7" fill="#64748b" />

  <!-- MAIN CHARACTER & ACTION (Hard at work, exhausted/immersed) -->
  <g transform="translate(45, 95)">
    <!-- Character Body / Hoodie -->
    <path d="M 25,75 C 20,55 35,40 55,40 C 75,40 90,55 85,75 L 95,95 L 15,95 Z" fill="#38bdf8" />
    <path d="M 55,40 C 45,40 38,48 35,55 L 75,55 C 72,48 65,40 55,40 Z" fill="#0284c7" /> <!-- Hood trim -->

    <!-- Head & Hair -->
    <circle cx="55" cy="24" r="18" fill="#fde047" /> <!-- Skin -->
    <path d="M 37,20 C 37,10 45,6 55,6 C 65,6 73,12 73,22 C 73,22 65,17 55,18 C 45,19 37,20 37,20 Z" fill="#1e293b" /> <!-- Hair -->

    <!-- Focused/Tired Face Expression -->
    <!-- Eyes closed in hyper-focus or exhaustion -->
    <path d="M 45,22 Q 49,25 53,22" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 59,22 Q 63,25 67,22" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Sweat drop (classic trope for intense pressure/busy) -->
    <path d="M 72,25 C 72,25 76,31 76,34 C 76,37 73,38 71,36 C 70,35 69,32 72,25 Z" fill="#38bdf8" opacity="0.9" />
    
    <!-- Mouth: Determined / Tight-lipped -->
    <path d="M 52,32 Q 55,34 58,32" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Arms bent over desk, typing intensely -->
    <path d="M 25,60 C 15,65 10,80 15,85" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    <path d="M 85,60 C 95,65 100,80 95,85" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    <circle cx="15" cy="85" r="5" fill="#fde047" />
    <circle cx="95" cy="85" r="5" fill="#fde047" />
  </g>

  <!-- FOREGROUND FOCUS OBJECT: Untouched cold meal/bento box ignored on desk -->
  <g transform="translate(30, 155)">
    <!-- Bento Box Base -->
    <rect x="0" y="10" width="55" height="30" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <rect x="4" y="14" width="47" height="22" rx="4" fill="#0f172a" />
    
    <!-- Untouched Food Inside (e.g., nice steaming rice & broccoli that went cold) -->
    <circle cx="20" cy="25" r="8" fill="#f8fafc" />
    <circle cx="36" cy="22" r="6" fill="#f8fafc" />
    <circle cx="28" cy="30" r="5" fill="#10b981" /> <!-- Broccoli/Veggie -->
    
    <!-- Bento Lid pushed aside -->
    <path d="M -15, 0 L 35, -5 L 30, 3 L -20, 8 Z" fill="#94a3b8" opacity="0.9" />

    <!-- Chopsticks resting unused on top -->
    <line x1="-5" y1="2" x2="45" y2="-3" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
    <line x1="-5" y1="6" x2="45" y2="1" stroke="#b45309" stroke-width="3" stroke-linecap="round" />

    <!-- Motion/Emphasis Lines (pointing to the forgotten food) -->
    <path d="M 10,-15 Q 15,-22 22,-18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7" />
    <path d="M 28,-18 Q 32,-25 40,-20" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7" />
  </g>

  <!-- Coffee Mug (Steam rising, working late) -->
  <g transform="translate(100, 140)">
    <rect x="0" y="5" width="20" height="25" rx="3" fill="#f43f5e" />
    <path d="M 20,10 C 26,10 26,20 20,23" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 6,-2 C 4,-7 12,-10 10,-15" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <path d="M 14,-4 C 16,-9 8,-12 10,-17" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Clock on wall indicating very late hour -->
  <g transform="translate(105, 30)">
    <circle cx="0" cy="0" r="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
    <!-- Clock hands pointing to late night e.g., 2:00 AM -->
    <line x1="0" y1="0" x2="0" y2="-6" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="5" y2="3" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="1.5" stroke="#cbd5e1" stroke-width="1" fill="#cbd5e1" />
  </g>

</svg>