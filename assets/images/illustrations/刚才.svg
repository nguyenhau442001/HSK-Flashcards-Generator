<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow from Desk Lamp -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Ghost/Memory Glow (Representing "just was here") -->
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Cozy Room Interior -->
  <!-- Window with Night City Silhouette -->
  <g opacity="0.6">
    <rect x="150" y="30" width="60" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
    <line x1="180" y1="30" x2="180" y2="115" stroke="#334155" stroke-width="1.5" />
    <line x1="150" y1="72" x2="210" y2="72" stroke="#334155" stroke-width="1.5" />
    <!-- City lights outside -->
    <rect x="156" y="45" width="8" height="12" rx="1" fill="#fbbf24" opacity="0.4" />
    <rect x="168" y="55" width="6" height="15" rx="1" fill="#38bdf8" opacity="0.4" />
    <rect x="188" y="40" width="10" height="20" rx="1" fill="#f43f5e" opacity="0.3" />
    <rect x="194" y="85" width="8" height="18" rx="1" fill="#fbbf24" opacity="0.3" />
  </g>

  <!-- Bookshelf / Wall Props -->
  <path d="M25 45 L95 45 L95 48 L25 48 Z" fill="#334155" />
  <rect x="35" y="25" width="12" height="20" rx="2" fill="#f43f5e" opacity="0.8" />
  <rect x="50" y="28" width="8" height="17" rx="2" fill="#38bdf8" opacity="0.8" />
  <rect x="61" y="22" width="14" height="23" rx="2" fill="#fbbf24" opacity="0.8" />

  <!-- Wall Clock showing recent time -->
  <circle cx="115" cy="50" r="14" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <circle cx="115" cy="50" r="1.5" fill="#94a3b8" />
  <path d="M115 42 L115 50 L121 50" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Ambient Lamp Light -->
  <circle cx="75" cy="115" r="55" fill="url(#lampGlow)" />

  <!-- Desk & Surface Props -->
  <rect x="15" y="155" width="165" height="10" rx="3" fill="url(#deskGrad)" />
  <rect x="25" y="165" width="12" height="50" rx="2" fill="#1e293b" />
  <rect x="158" y="165" width="12" height="50" rx="2" fill="#1e293b" />

  <!-- Desk Lamp -->
  <path d="M70 155 L70 125 L85 110 L95 110" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M85 103 L105 103 L100 117 L90 117 Z" fill="#fbbf24" />
  <ellipse cx="95" cy="110" rx="4" ry="2" fill="#f59e0b" />

  <!-- Open Laptop (Warm glow on screen) -->
  <path d="M40 155 L65 140 L90 155 Z" fill="#64748b" />
  <path d="M35 156 L95 156 L98 159 L32 159 Z" fill="#475569" />
  <rect x="52" y="143" width="26" height="11" rx="1" fill="#38bdf8" opacity="0.9" />

  <!-- Coffee Mug with steam -->
  <rect x="110" y="142" width="14" height="15" rx="3" fill="#cbd5e1" />
  <path d="M124 146 C128 146 128 153 124 153" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
  <!-- Steam wisps representing "just left" -->
  <path d="M114 136 C112 132 116 130 114 126" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M120 138 C122 134 118 132 120 128" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- CHRONOLOGICAL FOCUS: "刚才还在" (Was just here) -->
  <!-- Ghostly Silhouette / Afterimage of the person who just left -->
  <g transform="translate(75, 78)">
    <!-- Body Outline and Fill -->
    <path d="M -12 60 C -15 35 -10 20 0 15 C 10 20 15 35 12 60 Z" fill="url(#ghostGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <!-- Head Outline -->
    <circle cx="0" cy="5" r="11" fill="url(#ghostGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <!-- Floating motion lines indicating he just stood up and left toward the right -->
    <path d="M 22 25 Q 32 30 25 40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <path d="M 28 15 Q 40 22 32 32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- MAIN CHARACTER: The surprised person looking at the empty seat -->
  <g transform="translate(165, 85)">
    <!-- Body / Torso (Facing left towards the empty chair) -->
    <path d="M -15 70 C -15 45 -5 40 10 40 C 25 40 30 55 35 70 Z" fill="#10b981" />
    
    <!-- Arm reaching out in surprise / questioning gesture -->
    <path d="M -10 48 C -22 52 -32 45 -40 38" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="-42" cy="37" r="4" fill="#fca5a5" />

    <!-- Head & Hair -->
    <circle cx="5" cy="18" r="13" fill="#fca5a5" />
    <!-- Modern dark hair style -->
    <path d="M -6 14 C -5 6 7 5 18 12 C 18 18 12 24 5 24 C -2 24 -7 18 -6 14 Z" fill="#334155" />
    
    <!-- Surprised Facial Expression (Profile looking left) -->
    <!-- Eyes wide open -->
    <circle cx="-1" cy="17" r="2.5" fill="#0f172a" />
    <circle cx="-0.5" cy="16.5" r="0.8" fill="#ffffff" />
    <!-- Open 'O' mouth of surprise -->
    <ellipse cx="-4" cy="24" rx="2.5" ry="3.5" fill="#0f172a" />
    <!-- Surprised arched eyebrow -->
    <path d="M -3 12 C 0 10 3 12 3 12" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

    <!-- Legs sitting/standing by the desk -->
    <path d="M -8 70 L -12 110 L -4 110 L 0 75" fill="#334155" />
    <path d="M 15 70 L 22 110 L 30 110 L 20 75" fill="#1e293b" />
  </g>

  <!-- Empty Office Chair (Revolving chair pulled back, suggesting recent use) -->
  <g transform="translate(85, 120)">
    <!-- Chair Seat -->
    <rect x="-18" y="0" width="36" height="10" rx="4" fill="#475569" />
    <!-- Chair Backrest -->
    <rect x="-15" y="-30" width="30" height="32" rx="6" fill="#334155" />
    <!-- Chair Stem & Base -->
    <line x1="0" y1="10" x2="0" y2="35" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
    <path d="M -15 33 L 0 25 L 15 33" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Atmospheric Particles / Dust motes catching the warm light -->
  <circle cx="95" cy="85" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="115" cy="105" r="1" fill="#fbbf24" opacity="0.6" />
  <circle cx="80" cy="135" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="135" cy="95" r="1" fill="#38bdf8" opacity="0.7" />

  <!-- Subtle floor shadow -->
  <ellipse cx="85" cy="156" rx="35" ry="4" fill="#090d16" opacity="0.5" />
  <ellipse cx="165" cy="156" rx="25" ry="3" fill="#090d16" opacity="0.5" />
</svg>