<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Question Mark Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light / Atmospheric Depth -->
  <circle cx="140" cy="110" r="80" fill="url(#amberGlow)" />
  <circle cx="70" cy="170" r="50" fill="#38bdf8" opacity="0.05" />

  <!-- Background Environment & Props: Detective Desk / Study -->
  <!-- Bookshelf Background Silhouette -->
  <g opacity="0.2">
    <rect x="25" y="40" width="40" height="90" rx="4" fill="#64748b" />
    <rect x="30" y="60" width="30" height="8" fill="#334155" />
    <rect x="30" y="90" width="30" height="8" fill="#334155" />
    <rect x="175" y="55" width="40" height="75" rx="4" fill="#64748b" />
    <rect x="180" y="75" width="30" height="6" fill="#334155" />
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 20 185 L 220 185 L 230 215 L 10 215 Z" fill="#334155" filter="url(#dropShadow)" />
  <path d="M 15 185 L 225 185 L 228 190 L 12 190 Z" fill="#475569" />

  <!-- Stack of Mystery Books on Desk -->
  <g transform="translate(35, 155)">
    <rect x="0" y="20" width="45" height="10" rx="2" fill="#ec4899" />
    <rect x="-2" y="10" width="48" height="10" rx="2" fill="#38bdf8" />
    <rect x="2" y="0" width="42" height="10" rx="2" fill="#10b981" />
  </g>

  <!-- Magnifying Glass (Investigating Possibilities) -->
  <g transform="translate(160, 140) rotate(-25)" filter="url(#dropShadow)">
    <line x1="0" y1="0" x2="-35" y2="-35" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <circle cx="20" cy="20" r="22" fill="#0f172a" stroke="#fbbf24" stroke-width="5" />
    <circle cx="20" cy="20" r="17" fill="#38bdf8" opacity="0.2" />
  </g>

  <!-- Main Subject: Curious Character pondering (Action-packed silhouette / head and shoulders) -->
  <g id="character" filter="url(#dropShadow)">
    <!-- Shoulders & Coat -->
    <path d="M 70 200 C 70 175 90 160 120 160 C 150 160 170 175 170 200 Z" fill="#1e293b" />
    <path d="M 85 200 C 85 182 100 170 120 170 C 140 170 155 182 155 200 Z" fill="#fb923c" /> <!-- Scarf/Collar -->

    <!-- Neck -->
    <rect x="110" y="145" width="20" height="25" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="120" cy="125" r="30" fill="#fbcfe8" />

    <!-- Hair -->
    <path d="M 90 125 C 90 100 105 90 120 90 C 135 90 150 100 150 125 C 150 130 148 135 145 135 C 135 125 105 125 95 135 C 92 135 90 130 90 125 Z" fill="#334155" />

    <!-- Thoughtful Face Profile/Expression (Looking Up & Right) -->
    <circle cx="132" cy="123" r="3" fill="#0f172a" /> <!-- Eye -->
    <path d="M 137 115 Q 142 113 147 116" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round" /> <!-- Raised Eyebrow (uncertainty) -->
    <path d="M 133 136 Q 138 140 143 137" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" /> <!-- Pondering mouth / slight asymmetric smirk -->

    <!-- Hand on chin (classic thinking pose) -->
    <path d="M 125 145 C 125 137 135 135 140 142 C 143 146 140 152 135 150 Z" fill="#fbcfe8" />
    <path d="M 130 148 L 138 158 L 130 162 Z" fill="#fb923c" /> <!-- Sleeve cuff -->
  </g>

  <!-- The Core Concept: Floating Glowing Question Marks (Representing 'Huòxǔ' - Maybe/Perhaps) -->
  <g filter="url(#softGlow)">
    <!-- Large Primary Glowing Question Mark -->
    <path d="M 135 45 C 135 32 155 30 160 45 C 165 58 145 65 145 80" stroke="#fbbf24" stroke-width="8" fill="none" stroke-linecap="round" />
    <circle cx="145" cy="98" r="4.5" fill="#fbbf24" />

    <!-- Secondary Floating Question Marks (Depth & Uncertainty) -->
    <g transform="translate(30, -10) scale(0.65)" opacity="0.8">
      <path d="M 135 45 C 135 32 155 30 160 45 C 165 58 145 65 145 80" stroke="#38bdf8" stroke-width="8" fill="none" stroke-linecap="round" />
      <circle cx="145" cy="98" r="4.5" fill="#38bdf8" />
    </g>

    <g transform="translate(50, 40) scale(0.45)" opacity="0.6">
      <path d="M 135 45 C 135 32 155 30 160 45 C 165 58 145 65 145 80" stroke="#ec4899" stroke-width="8" fill="none" stroke-linecap="round" />
      <circle cx="145" cy="98" r="4.5" fill="#ec4899" />
    </g>
  </g>

  <!-- Sparkles / Probabilistic Energy Particles -->
  <g fill="#fbbf24">
    <circle cx="105" cy="65" r="2.5" opacity="0.9" />
    <circle cx="180" cy="85" r="2" opacity="0.7" />
    <circle cx="120" cy="30" r="3" opacity="0.8" />
    <circle cx="165" cy="20" r="1.5" opacity="0.5" />
    <circle cx="85" cy="95" r="2" opacity="0.6" />
  </g>
  <g fill="#38bdf8">
    <circle cx="65" cy="115" r="2" opacity="0.7" />
    <circle cx="150" cy="105" r="2.5" opacity="0.8" />
  </g>
</svg>