<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Reading Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Character Outfit/Skin Gradients -->
    <linearGradient id="sweaterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="mugGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Glow behind scene -->
  <circle cx="120" cy="110" r="100" fill="url(#lampGlow)" />

  <!-- Background Environment: Cozy Room Wall & Window -->
  <!-- Wall Color -->
  <rect x="0" y="0" width="240" height="170" fill="#1e293b" />
  
  <!-- Window Frame & Night View (Representing passage of time: late night) -->
  <g transform="translate(150, 18)">
    <rect width="65" height="85" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="3" />
    <!-- Night Sky inside window -->
    <rect x="3" y="3" width="59" height="79" fill="url(#nightSky)" />
    <!-- Distant Moon -->
    <circle cx="48" cy="22" r="8" fill="#fef08a" opacity="0.9" />
    <circle cx="45" cy="20" r="8" fill="#0b0f19" opacity="0.3" /> <!-- Crescent shadow -->
    <!-- Tiny Stars -->
    <circle cx="15" cy="30" r="1" fill="#ffffff" opacity="0.8" />
    <circle cx="28" cy="55" r="1.2" fill="#ffffff" opacity="0.6" />
    <circle cx="12" cy="70" r="0.8" fill="#ffffff" opacity="0.9" />
    <!-- Window Panes Cross -->
    <line x1="3" y1="42" x2="62" y2="42" stroke="#334155" stroke-width="2" />
    <line x1="32" y1="3" x2="32" y2="82" stroke="#334155" stroke-width="2" />
    <!-- Window Sill -->
    <rect x="0" y="85" width="71" height="5" rx="1" fill="#475569" />
    <!-- Small succulent plant on window sill -->
    <path d="M22 85 L26 76 L30 85 Z" fill="#10b981" />
    <path d="M28 85 L32 74 L36 85 Z" fill="#059669" />
    <ellipse cx="29" cy="84" rx="7" ry="3" fill="#cbd5e1" />
  </g>

  <!-- Bookshelf Background Elements -->
  <rect x="18" y="25" width="45" height="6" rx="2" fill="#334155" />
  <rect x="25" y="10" width="8" height="15" rx="1" fill="#ef4444" />
  <rect x="35" y="7" width="7" height="18" rx="1" fill="#eab308" />
  <rect x="44" y="12" width="10" height="13" rx="1" fill="#06b6d4" />

  <!-- Wooden Desk Surface -->
  <path d="M10 170 L230 170 L220 220 L20 220 Z" fill="#0f172a" />
  <rect x="10" y="166" width="220" height="8" rx="2" fill="#334155" />
  <rect x="15" y="174" width="210" height="46" fill="#1e293b" opacity="0.6" />

  <!-- Props on Desk -->
  <!-- Steaming Hot Mug of Tea/Coffee -->
  <g transform="translate(180, 155)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="url(#mugGrad)" />
    <path d="M16 9 C20 9 20 19 16 19" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam wisps (Action/Continuity lines) -->
    <path d="M5 0 C5 -4 9 -2 9 -6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M11 2 C11 -2 15 0 15 -4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Desk Lamp casting warm cone of light -->
  <g transform="translate(45, 120)">
    <!-- Lamp base -->
    <ellipse cx="0" cy="50" rx="14" ry="5" fill="#64748b" />
    <!-- Lamp arm -->
    <path d="M0 50 L-10 20 L-25 5" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp shade -->
    <path d="M-35 -3 L-10 0 L-20 -20 L-38 -20 Z" fill="#cbd5e1" />
    <ellipse cx="-29" cy="-10" rx="10" ry="12" fill="#f59e0b" />
  </g>

  <!-- Stack of extra reference books -->
  <g transform="translate(150, 185)">
    <rect x="0" y="12" width="40" height="8" rx="2" fill="#475569" />
    <rect x="-3" y="4" width="44" height="8" rx="2" fill="#0284c7" />
    <rect x="2" y="-4" width="38" height="8" rx="2" fill="#10b981" />
  </g>

  <!-- MAIN CHARACTER & OPEN BOOK (The Core Subject of "Still / Continuing to read") -->
  <!-- Character Body & Sweater -->
  <g transform="translate(95, 115)">
    <!-- Shoulders/Torso -->
    <path d="M-30 65 C-30 40 -15 35 0 35 C15 35 30 40 30 65 L35 85 L-35 85 Z" fill="url(#sweaterGrad)" />
    <!-- Collar -->
    <path d="M-12 35 C-12 42 12 42 12 35 C12 32 -12 32 -12 35 Z" fill="#60a5fa" />

    <!-- Head & Face (Focused, engrossed expression) -->
    <circle cx="0" cy="12" r="18" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M-18 12 C-18 -3 -5 -8 0 -8 C8 -8 18 -3 18 12 C15 5 8 2 0 3 C-8 2 -15 5 -18 12 Z" fill="#334155" />
    <!-- Glasses -->
    <rect x="-10" y="6" width="9" height="6" rx="2" fill="none" stroke="#334155" stroke-width="1.5" />
    <rect x="1" y="6" width="9" height="6" rx="2" fill="none" stroke="#334155" stroke-width="1.5" />
    <line x1="-1" y1="9" x2="1" y2="9" stroke="#334155" stroke-width="1.5" />
    <!-- Focused Eyes (looking down at book) -->
    <circle cx="-5.5" cy="9" r="1" fill="#0f172a" />
    <circle cx="5.5" cy="9" r="1" fill="#0f172a" />
    <!-- Gentle determined mouth -->
    <path d="M-3 18 C-1 20 1 20 3 18" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms Reaching Forward to Hold Book -->
    <!-- Left Arm -->
    <path d="M-25 45 C-35 50 -40 65 -32 72" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M25 45 C35 50 40 65 32 72" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
    <!-- Hands gripping book -->
    <circle cx="-33" cy="73" r="4" fill="#fbcfe8" />
    <circle cx="33" cy="73" r="4" fill="#fbcfe8" />
  </g>

  <!-- Large Open Book Held in Hands -->
  <g transform="translate(95, 165)">
    <!-- Book Cover/Base -->
    <path d="M-45 10 L0 25 L45 10 L45 18 L0 33 L-45 18 Z" fill="#b45309" />
    <!-- Left Page -->
    <path d="M-43 8 C-25 4 -5 5 0 20 L0 28 C-5 13 -25 12 -43 16 Z" fill="#f8fafc" />
    <path d="M-40 10 L-8 16" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <path d="M-38 14 L-10 20" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <path d="M-39 18 L-12 24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Right Page -->
    <path d="M43 8 C25 4 5 5 0 20 L0 28 C5 13 25 12 43 16 Z" fill="#f8fafc" />
    <path d="M40 10 L8 16" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <path d="M38 14 L10 20" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <path d="M39 18 L12 24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Center binding crease -->
    <line x1="0" y1="20" x2="0" y2="28" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- Action/Continuity Effects: Floating glowing clock & time-passing indicators representing "Still doing X" -->
  <g transform="translate(195, 65)" opacity="0.9">
    <!-- Clock circle -->
    <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Clock hands pointing late (e.g. 2:00 AM) -->
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="5" y2="2" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="1.5" stroke="#38bdf8" fill="#38bdf8" />
  </g>

  <!-- Sparkles/Energy highlights indicating deep immersion and focus -->
  <g transform="translate(70, 105)">
    <path d="M0 0 L2 5 L7 7 L2 9 L0 14 L-2 9 L-7 7 L-2 5 Z" fill="#fbbf24" opacity="0.9" transform="scale(0.6)" />
  </g>
  <g transform="translate(135, 115)">
    <path d="M0 0 L2 5 L7 7 L2 9 L0 14 L-2 9 L-7 7 L-2 5 Z" fill="#fbbf24" opacity="0.7" transform="scale(0.5)" />
  </g>

</svg>