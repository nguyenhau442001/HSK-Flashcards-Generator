<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b101b" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter for Atmosphere -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Studio / Training Hall Interior Context -->
  <!-- Wooden Wall Panels -->
  <g opacity="0.4">
    <line x1="0" y1="40" x2="240" y2="40" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="80" x2="240" y2="80" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="120" x2="240" y2="120" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="150" x2="240" y2="150" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Traditional Circular Wall Decor (Enso/Mirror motif) -->
  <circle cx="120" cy="75" r="35" fill="none" stroke="#334155" stroke-width="2" opacity="0.3" />
  <circle cx="120" cy="75" r="30" fill="none" stroke="#64748b" stroke-width="1" opacity="0.2" stroke-dasharray="4 8" />

  <!-- Window with Bamboo Silhouette Outside -->
  <g transform="translate(180, 25)">
    <rect x="0" y="0" width="45" height="90" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2" />
    <!-- Bamboo stems outside -->
    <line x1="15" y1="0" x2="15" y2="90" stroke="#10b981" stroke-width="2" opacity="0.4" />
    <line x1="30" y1="0" x2="28" y2="90" stroke="#10b981" stroke-width="1.5" opacity="0.3" />
    <!-- Window pane crosses -->
    <line x1="22.5" y1="0" x2="22.5" y2="90" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="45" x2="45" y2="45" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Dramatic Light Beam from Window -->
  <polygon points="180,25 225,25 100,150 20,150" fill="url(#lightBeam)" />

  <!-- Floor Surface -->
  <rect x="0" y="150" width="240" height="90" fill="url(#floorGrad)" />
  <line x1="0" y1="150" x2="240" y2="150" stroke="#fbbf24" stroke-width="1" opacity="0.3" />

  <!-- Wooden Training Dummy / Props in Background -->
  <g transform="translate(35, 105)">
    <rect x="8" y="0" width="6" height="50" fill="#78350f" rx="3" />
    <circle cx="11" cy="-4" r="8" fill="#92400e" />
    <!-- arms -->
    <line x1="2" y1="15" x2="22" y2="10" stroke="#92400e" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="30" x2="20" y2="28" stroke="#92400e" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- MAIN SUBJECT: Martial Artist in Dynamic Wushu Pose -->
  <g transform="translate(0, 5)">
    <!-- Motion lines / Chi effect -->
    <path d="M 75 135 Q 110 115 145 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#glow)" />
    <path d="M 85 145 Q 115 130 155 140" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

    <!-- Back Leg (Deep Bow Stance / Gongbu) -->
    <path d="M 115 115 L 75 145 L 60 148" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Back Foot -->
    <path d="M 55 148 L 70 148" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />

    <!-- Front Leg (Extended Lunge) -->
    <path d="M 115 115 L 155 142 L 180 142" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Foot -->
    <path d="M 170 142 L 190 142" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />

    <!-- Torso (Traditional martial arts uniform / Tang suit style top, deep blue & gold trim) -->
    <path d="M 100 85 L 130 90 L 125 125 L 95 120 Z" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round" />
    <!-- Uniform Sash / Belt -->
    <path d="M 96 112 L 128 117" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
    <!-- Sash ends flowing in motion -->
    <path d="M 115 115 Q 130 130 140 145" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

    <!-- Head & Focused Expression -->
    <g transform="translate(112, 68)">
      <!-- Hair / Headband -->
      <circle cx="0" cy="0" r="13" fill="#f8fafc" />
      <path d="M -13 0 C -13 -10 13 -10 13 0 C 13 4 -13 4 -13 0 Z" fill="#0f172a" />
      <path d="M -15 -2 L 15 -2" stroke="#ef4444" stroke-width="3" />
      <!-- Determined Face Profile / Eyes -->
      <circle cx="5" cy="1" r="1.5" fill="#0f172a" />
      <path d="M 3 -3 L 8 -1" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Back Arm (Drawing back power) -->
    <path d="M 105 95 L 85 85 L 70 95" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Back Fist -->
    <circle cx="67" cy="97" r="5" fill="#f8fafc" />

    <!-- Front Arm (Striking / Punching forward with motion blur) -->
    <path d="M 120 95 L 155 105 L 175 102" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Punch Impact Fist -->
    <circle cx="178" cy="101" r="6" fill="#f8fafc" filter="url(#glow)" />
    <!-- Speed lines on punch -->
    <line x1="182" y1="98" x2="192" y2="95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="185" y1="103" x2="198" y2="103" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground Atmospheric Elements (Dust motes in light beam) -->
  <circle cx="110" cy="110" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="135" cy="95" r="1" fill="#fbbf24" opacity="0.6" />
  <circle cx="95" cy="130" r="2" fill="#fbbf24" opacity="0.4" />
  <circle cx="150" cy="120" r="1" fill="#fbbf24" opacity="0.9" />
  <circle cx="70" cy="115" r="1.5" fill="#fbbf24" opacity="0.5" />
</svg>