<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="150" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- The "Loss" - Scattered Documents and Spilled Coffee -->
  <path d="M50 160 L190 160 L180 210 L60 210 Z" fill="#cbd5e1"/>
  <path d="M60 170 H170 M60 185 H170 M60 200 H140" stroke="#94a3b8" stroke-width="2"/>
  <path d="M150 150 C 150 140, 170 140, 170 150 L 175 180 L 145 180 Z" fill="#fb923c"/>
  <circle cx="160" cy="165" r="8" fill="#78350f"/>
  
  <!-- Character: Frustrated Professional -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M20 120 C 20 100, 80 100, 80 120 L 70 150 L 30 150 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="50" cy="80" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M30 75 C 30 50, 70 50, 70 75 Z" fill="#475569"/>
    <!-- Eyes (Frustrated) -->
    <line x1="40" y1="75" x2="45" y2="80" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="55" y1="80" x2="60" y2="75" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth (Frown) -->
    <path d="M40 95 C 45 90, 55 90, 60 95" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Character: Concerned Colleague -->
  <g transform="translate(120, 70)">
    <!-- Body -->
    <path d="M20 110 C 20 90, 80 90, 80 110 L 70 140 L 30 140 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="50" cy="70" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M35 50 L 65 50 L 50 70 Z" fill="#92400e"/>
    <!-- Eyes (Concerned) -->
    <circle cx="42" cy="65" r="2" fill="#1e293b"/>
    <circle cx="58" cy="65" r="2" fill="#1e293b"/>
    <!-- Mouth (Shocked) -->
    <circle cx="50" cy="85" r="4" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Decorative Background Elements -->
  <rect x="200" y="40" width="20" height="80" rx="5" fill="#334155" opacity="0.5"/>
  <circle cx="210" cy="30" r="5" fill="#f59e0b"/>
</svg>