<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glowing Light (The "Only" solution/key glowing in the dark) -->
    <radialGradient id="glowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light Circle behind the focal point -->
  <circle cx="120" cy="120" r="90" fill="url(#glowLight)"/>

  <!-- Background Environment: Workshop / Room Interior -->
  <!-- Back Wall Details -->
  <rect x="40" y="40" width="160" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="40" y1="90" x2="200" y2="90" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Shelves with various failed tools (emphasizing it's the *only* way) -->
  <rect x="55" y="55" width="40" height="6" rx="3" fill="#475569"/>
  <rect x="145" y="55" width="40" height="6" rx="3" fill="#475569"/>
  <!-- Broken gears / crossed out items silhouette on shelf -->
  <circle cx="75" cy="47" r="6" fill="#64748b"/>
  <line x1="71" y1="43" x2="79" y2="51" stroke="#ef4444" stroke-width="2"/>

  <!-- Big Locked Door / Vault in Background -->
  <rect x="85" y="70" width="70" height="100" rx="12" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="145" cy="120" r="6" fill="#fbbf24" filter="url(#softShadow)"/>

  <!-- Worktable Surface -->
  <path d="M 20 170 L 220 170 L 210 205 L 30 205 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="165" width="200" height="8" rx="4" fill="#334155"/>

  <!-- Props on Table: Blueprints / Failed notes (crossed out) -->
  <rect x="45" y="175" width="35" height="22" rx="2" fill="#cbd5e1" transform="rotate(-8 45 175)"/>
  <line x1="50" y1="182" x2="70" y2="192" stroke="#ef4444" stroke-width="2" transform="rotate(-8 45 175)"/>

  <rect x="160" y="178" width="30" height="20" rx="2" fill="#cbd5e1" transform="rotate(12 160 178)"/>
  <line x1="163" y1="183" x2="187" y2="193" stroke="#ef4444" stroke-width="2" transform="rotate(12 160 178)"/>

  <!-- MAIN CHARACTER: Thoughtful, focused explorer/worker pointing at the single glowing solution -->
  <!-- Character Body / Torso -->
  <path d="M 90 210 C 90 185 110 175 120 175 C 130 175 150 185 150 210 Z" fill="url(#coatGrad)" filter="url(#softShadow)"/>
  <path d="M 105 175 L 135 175 L 140 210 L 100 210 Z" fill="#2563eb"/>
  <path d="M 115 175 L 125 175 L 128 195 L 112 195 Z" fill="#f8fafc"/> <!-- Shirt collar/tie -->

  <!-- Character Head & Face -->
  <circle cx="120" cy="140" r="22" fill="#fcd34d" filter="url(#softShadow)"/>
  <!-- Hair -->
  <path d="M 98 135 C 98 120 110 115 120 115 C 130 115 142 120 142 135 C 142 138 140 135 138 130 C 132 120 108 120 102 130 C 100 135 98 138 98 135 Z" fill="#334155"/>
  <!-- Glasses (Intelligent, focused look) -->
  <rect x="108" y="133" width="11" height="8" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="121" y="133" width="11" height="8" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="119" y1="137" x2="121" y2="137" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Focused Expression -->
  <circle cx="113" cy="137" r="1.5" fill="#1e293b"/>
  <circle cx="126" cy="137" r="1.5" fill="#1e293b"/>
  <path d="M 116 148 C 118 150 122 150 124 148" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Character Arms & Hands -->
  <!-- Left Arm (resting or supporting) -->
  <path d="M 95 180 C 85 190 85 200 90 210" fill="none" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round"/>

  <!-- Right Arm (Pointing directly at the ONLY key/solution) -->
  <path d="M 145 180 C 165 170 175 160 185 155" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round"/>
  <!-- Hand pointing gesture -->
  <circle cx="188" cy="153" r="5" fill="#fcd34d"/>
  <path d="M 188 153 L 202 148" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>

  <!-- THE CENTRAL FOCAL POINT: The "Only" Key / Solution glowing floating in center -->
  <g filter="url(#softShadow)" transform="translate(0, -5)">
    <!-- Glow ring around the key -->
    <circle cx="120" cy="105" r="24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 120 105" to="360 120 105" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- The Golden Key (Symbolizing "The Only Way / Solution") -->
    <g transform="translate(120, 105) rotate(-35) translate(-120, -105)">
      <!-- Key Ring -->
      <circle cx="110" cy="95" r="9" fill="none" stroke="url(#keyGrad)" stroke-width="4"/>
      <!-- Key Shaft -->
      <line x1="117" y1="99" x2="145" y2="127" stroke="url(#keyGrad)" stroke-width="5" stroke-linecap="round"/>
      <!-- Key Teeth -->
      <path d="M 135 117 L 141 111 M 140 122 L 145 117" stroke="url(#keyGrad)" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Sparkles / Emphasis near the key -->
  <path d="M 95 90 L 98 95 L 103 98 L 98 101 L 95 106 L 92 101 L 87 98 L 92 95 Z" fill="#fbbf24"/>
  <path d="M 150 95 L 152 98 L 155 100 L 152 102 L 150 105 L 148 102 L 145 100 L 148 98 Z" fill="#f59e0b"/>

  <!-- Foreground Atmospheric Vignette / Lighting Edge -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>
</svg>