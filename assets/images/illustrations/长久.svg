<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- The "Temporary Fix" - A stack of precarious books holding up a sagging shelf -->
  <rect x="40" y="100" width="160" height="60" rx="4" fill="#475569"/>
  <rect x="45" y="105" width="150" height="50" rx="2" fill="#1e293b"/>
  
  <!-- The precarious stack -->
  <rect x="100" y="120" width="40" height="40" rx="2" fill="#fb923c"/>
  <rect x="105" y="115" width="30" height="5" rx="1" fill="#f59e0b"/>
  <rect x="110" y="110" width="20" height="5" rx="1" fill="#f59e0b"/>
  
  <!-- Character: Concerned person pointing at the stack -->
  <g transform="translate(160, 100)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M15 25 Q20 30 25 25" stroke="#78350f" stroke-width="2" fill="none"/>
    <circle cx="15" cy="18" r="2" fill="#78350f"/>
    <circle cx="25" cy="18" r="2" fill="#78350f"/>
    <path d="M20 40 L20 80 M20 50 L5 60 M20 50 L35 60" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <!-- Pointing finger -->
    <path d="M35 35 L50 25 L55 30" stroke="#fde68a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Character: Tired person holding the shelf up -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="15" fill="#38bdf8"/>
    <path d="M15 25 Q20 22 25 25" stroke="#0c4a6e" stroke-width="2" fill="none"/>
    <rect x="10" y="35" width="20" height="40" rx="2" fill="#38bdf8"/>
    <path d="M5 40 L20 35 L35 40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Warning sign (abstract) -->
  <path d="M200 40 L220 75 L180 75 Z" fill="#ec4899"/>
  <rect x="208" y="50" width="4" height="12" rx="2" fill="#fff"/>
  <circle cx="210" cy="68" r="2" fill="#fff"/>
</svg>