<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Road Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 195 L240 195" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Car 1 (Sedan) -->
  <g transform="translate(40, 160)">
    <path d="M10 30 L70 30 L65 10 L20 10 Z" fill="#fb923c"/>
    <path d="M15 12 L35 12 L35 28 L15 28 Z" fill="#38bdf8"/>
    <path d="M40 12 L62 12 L60 28 L40 28 Z" fill="#38bdf8"/>
    <circle cx="20" cy="35" r="8" fill="#0f172a"/>
    <circle cx="60" cy="35" r="8" fill="#0f172a"/>
  </g>
  
  <!-- Car 2 (Impacted) -->
  <g transform="translate(110, 155)">
    <path d="M5 35 L65 35 L60 15 L15 15 Z" fill="#ec4899"/>
    <path d="M20 17 L40 17 L40 33 L20 33 Z" fill="#38bdf8"/>
    <path d="M45 17 L58 17 L55 33 L45 33 Z" fill="#38bdf8"/>
    <circle cx="20" cy="40" r="8" fill="#0f172a"/>
    <circle cx="60" cy="40" r="8" fill="#0f172a"/>
  </g>
  
  <!-- Impact Effect -->
  <path d="M105 160 L125 140 L135 170 L150 145 L145 180" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Traffic Light -->
  <rect x="180" y="50" width="10" height="100" fill="#475569"/>
  <circle cx="185" cy="70" r="12" fill="#ef4444"/>
  <circle cx="185" cy="100" r="12" fill="#334155"/>
  <circle cx="185" cy="130" r="12" fill="#334155"/>
  
  <!-- Background Elements -->
  <rect x="20" y="80" width="40" height="80" fill="#1e293b" stroke="#334155"/>
  <rect x="70" y="60" width="50" height="100" fill="#1e293b" stroke="#334155"/>
  <rect x="130" y="90" width="30" height="70" fill="#1e293b" stroke="#334155"/>
  
  <!-- Moon/Night Sky -->
  <circle cx="200" cy="40" r="15" fill="#f59e0b" opacity="0.8"/>
</svg>