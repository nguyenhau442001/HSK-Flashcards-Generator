<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Decorative ambient lighting / drop shadow elements -->
  <circle cx="100" cy="115" r="45" fill="#0f172a" opacity="0.6"/>

  <!-- Lost item: Modern Smartphone falling / slipping away -->
  <g transform="rotate(-15, 100, 105)">
    <!-- Phone Body -->
    <rect x="75" y="65" width="50" height="90" rx="10" fill="#38bdf8"/>
    <!-- Screen -->
    <rect x="81" y="73" width="38" height="74" rx="5" fill="#0f172a"/>
    <!-- Home indicator line -->
    <rect x="92" y="141" width="16" height="3" rx="1.5" fill="#64748b"/>
    <!-- Camera notch / island -->
    <circle cx="100" cy="78" r="2" fill="#64748b"/>
  </g>

  <!-- Motion lines / vanishing trails indicating "losing" or "dropping" -->
  <path d="M 125 55 Q 135 45 145 40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 137 68 Q 148 58 158 52" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 113 45 Q 123 35 133 30" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Small floating sparkles / dust representing sudden absence or loss -->
  <circle cx="145" cy="70" r="2.5" fill="#f59e0b"/>
  <circle cx="130" cy="35" r="2" fill="#38bdf8"/>
  <circle cx="155" cy="45" r="1.5" fill="#fb923c"/>

  <!-- Ground / Surface reference where it fell from -->
  <path d="M 50 160 L 150 160" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
</svg>