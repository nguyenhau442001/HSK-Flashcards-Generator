<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Window City Lights Gradient -->
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment: Cozy Study/Office Room -->
  <!-- Window showing night city -->
  <g id="window" transform="translate(140, 25)">
    <rect width="70" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <rect x="6" y="6" width="58" height="73" fill="url(#window-grad)"/>
    <!-- City lights outside -->
    <rect x="12" y="30" width="8" height="15" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="24" y="20" width="10" height="25" rx="1" fill="#38bdf8" opacity="0.4"/>
    <rect x="38" y="40" width="12" height="18" rx="1" fill="#f43f5e" opacity="0.5"/>
    <rect x="52" y="25" width="6" height="30" rx="1" fill="#a855f7" opacity="0.5"/>
    <!-- Window Frame Cross -->
    <line x1="35" y1="6" x2="35" y2="79" stroke="#334155" stroke-width="2"/>
    <line x1="6" y1="42" x2="64" y2="42" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Bookshelf Background Details -->
  <g id="bookshelf" transform="translate(20, 35)">
    <rect x="0" y="0" width="45" height="75" fill="#111827" rx="2"/>
    <!-- Books -->
    <rect x="5" y="10" width="8" height="25" rx="1" fill="#f43f5e"/>
    <rect x="14" y="12" width="6" height="23" rx="1" fill="#38bdf8"/>
    <rect x="22" y="8" width="10" height="27" rx="1" fill="#10b981"/>
    <rect x="5" y="45" width="12" height="22" rx="1" fill="#fbbf24"/>
    <rect x="19" y="42" width="7" height="25" rx="1" fill="#a855f7"/>
    <line x1="0" y1="38" x2="45" y2="38" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Hanging Plant Prop -->
  <g id="plant" transform="translate(95, 20)">
    <path d="M15 0 C15 10 5 15 5 25" fill="none" stroke="#475569" stroke-width="2"/>
    <circle cx="5" cy="25" r="8" fill="#334155"/>
    <!-- Leaves -->
    <path d="M5 25 C0 25 -5 30 -2 35 C2 35 5 30 5 25 Z" fill="#10b981"/>
    <path d="M5 25 C10 28 15 35 12 40 C8 38 6 30 5 25 Z" fill="#059669"/>
    <path d="M5 25 C2 30 0 38 5 42 C7 38 8 30 5 25 Z" fill="#34d399"/>
  </g>

  <!-- Desk Surface -->
  <path d="M10 185 L230 185 L220 220 L20 220 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="10" y="175" width="220" height="10" rx="3" fill="#475569"/>

  <!-- Desk Props -->
  <!-- Laptop / Computer Screen casting light -->
  <g id="laptop" transform="translate(140, 125)">
    <!-- Base -->
    <polygon points="-10,50 60,50 70,58 -20,58" fill="#64748b"/>
    <!-- Screen -->
    <rect x="-5" y="5" width="55" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="-1" y="9" width="47" height="37" rx="2" fill="url(#screen-glow)"/>
    <!-- Code / Data lines on screen (abstract UI) -->
    <line x1="5" y1="16" x2="25" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="24" x2="35" y2="24" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="32" x2="18" y2="32" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug -->
  <g id="mug" transform="translate(35, 150)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#f8fafc"/>
    <path d="M16 10 C21 10 21 20 16 20" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam indicating warm drink -->
    <path d="M5 0 C5 -3 8 -3 8 -6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M11 -2 C11 -5 14 -5 14 -8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Desk Lamp on Left -->
  <g id="lamp" transform="translate(20, 110)">
    <path d="M25 65 L25 35" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 35 C25 20 10 20 5 30" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Lamp Shade -->
    <polygon points="0,30 30,30 22,12 8,12" fill="#f59e0b"/>
    <!-- Light cone / Glow -->
    <polygon points="5,33 55,175 -25,175" fill="url(#lamp-glow)" style="mix-blend-mode: screen;"/>
  </g>

  <!-- MAIN CHARACTER: Sitting at desk, showing realization ("I understand now") -->
  <g id="character" transform="translate(65, 80)">
    <!-- Chair Back -->
    <rect x="10" y="5" width="35" height="75" rx="8" fill="#334155"/>
    <rect x="15" y="12" width="25" height="60" rx="4" fill="#1e293b"/>

    <!-- Body / Torso (Wearing cozy amber/orange sweater) -->
    <path d="M15 65 C15 50 35 45 55 45 C75 45 95 50 95 65 L100 105 L10 105 Z" fill="#fb923c"/>
    <!-- Collar -->
    <path d="M40 45 C40 52 70 52 70 45 C65 42 45 42 40 45 Z" fill="#fdba74"/>

    <!-- Left Arm (Resting on desk, hand gesturing understanding/agreement "Ừ") -->
    <path d="M20 70 Q 10 85 25 100" fill="none" stroke="#fb923c" stroke-width="14" stroke-linecap="round"/>
    <!-- Left Hand -->
    <circle cx="27" cy="103" r="7" fill="#fbcfe8"/>

    <!-- Right Arm (Raised slightly in a confident "Aha!" / realization gesture) -->
    <path d="M85 70 Q 100 75 90 95" fill="none" stroke="#fb923c" stroke-width="14" stroke-linecap="round"/>
    <!-- Right Hand with pointing/nodding expression -->
    <circle cx="89" cy="99" r="7" fill="#fbcfe8"/>

    <!-- Neck -->
    <rect x="45" y="32" width="18" height="18" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <g id="head" transform="translate(32, -15)">
      <!-- Hair Base -->
      <path d="M12 30 C10 10 35 2 55 10 C75 2 95 10 93 30 C95 45 85 52 85 52 C85 52 80 32 65 32 C50 32 42 45 42 45 C42 45 20 45 12 30 Z" fill="#1e293b"/>
      <!-- Face Skin -->
      <rect x="22" y="22" width="46" height="42" rx="20" fill="#fbcfe8"/>
      <!-- Cute Bangs -->
      <path d="M24 25 C30 35 45 33 55 25 C65 33 70 25 70 22 C60 12 30 12 24 25 Z" fill="#1e293b"/>

      <!-- Facial Expression: Eyes closed happily in agreement/understanding (^ ^) -->
      <!-- Left Eye -->
      <path d="M32 38 Q 37 32 42 38" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Right Eye -->
      <path d="M48 38 Q 53 32 58 38" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Rosy Cheeks -->
      <circle cx="33" cy="44" r="5" fill="#f43f5e" opacity="0.3"/>
      <circle cx="57" cy="44" r="5" fill="#f43f5e" opacity="0.3"/>

      <!-- Confident/Satisfied Open Smile (Nodding "Ừ") -->
      <path d="M41 46 Q 45 53 50 46" fill="#1e293b" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>

      <!-- Eyebrows relaxed & expressing clarity -->
      <path d="M33 30 Q 37 27 41 31" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M49 31 Q 53 27 57 30" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Dynamic Visual Cue for "Got it / Understood" (Subtle glowing check/sparkle cluster near head - NO TEXT) -->
  <g id="sparkles" transform="translate(135, 65)">
    <!-- Small glowing star 1 -->
    <path d="M0 10 L3 3 L10 0 L3 -3 L0 -10 L-3 -3 L-10 0 L-3 3 Z" fill="#38bdf8" transform="scale(0.6)"/>
    <!-- Small glowing star 2 -->
    <path d="M0 10 L3 3 L10 0 L3 -3 L0 -10 L-3 -3 L-10 0 L-3 3 Z" fill="#fbbf24" transform="translate(25, -15) scale(0.8)"/>
    <!-- Small glowing dot/bubble -->
    <circle cx="15" cy="15" r="3" fill="#34d399"/>
  </g>
</svg>