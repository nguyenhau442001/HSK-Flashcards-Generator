<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ground -->
  <rect x="0" y="190" width="240" height="50" fill="#334155"/>
  
  <!-- Puddles -->
  <ellipse cx="60" cy="210" rx="30" ry="8" fill="#0f172a" opacity="0.6"/>
  <ellipse cx="180" cy="215" rx="45" ry="12" fill="#0f172a" opacity="0.6"/>
  
  <!-- Character: Person looking at heavy rain -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="15" fill="#fde68a"/>
    <path d="M-5 -2 L-2 -2 M2 -2 L5 -2" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-3 5 Q0 8 3 5" stroke="#1e293b" stroke-width="2" fill="none"/>
    <rect x="-12" y="15" width="24" height="40" rx="4" fill="#fb923c"/>
    <rect x="-14" y="15" width="6" height="30" rx="2" fill="#f59e0b"/>
    <rect x="8" y="15" width="6" height="30" rx="2" fill="#f59e0b"/>
  </g>
  
  <!-- Umbrella -->
  <path d="M100 85 Q120 60 140 85 Z" fill="#ec4899"/>
  <line x1="120" y1="85" x2="120" y2="115" stroke="#ec4899" stroke-width="3"/>
  
  <!-- Heavy Rain Streaks -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <line x1="20" y1="0" x2="10" y2="240"/>
    <line x1="50" y1="0" x2="40" y2="240"/>
    <line x1="80" y1="0" x2="70" y2="240"/>
    <line x1="110" y1="0" x2="100" y2="240"/>
    <line x1="140" y1="0" x2="130" y2="240"/>
    <line x1="170" y1="0" x2="160" y2="240"/>
    <line x1="200" y1="0" x2="190" y2="240"/>
    <line x1="230" y1="0" x2="220" y2="240"/>
    <line x1="35" y1="0" x2="25" y2="240"/>
    <line x1="65" y1="0" x2="55" y2="240"/>
    <line x1="95" y1="0" x2="85" y2="240"/>
    <line x1="125" y1="0" x2="115" y2="240"/>
    <line x1="155" y1="0" x2="145" y2="240"/>
    <line x1="185" y1="0" x2="175" y2="240"/>
    <line x1="215" y1="0" x2="205" y2="240"/>
  </g>
  
  <!-- Decorative Splash -->
  <circle cx="180" cy="210" r="3" fill="#38bdf8"/>
  <circle cx="190" cy="205" r="2" fill="#38bdf8"/>
</svg>