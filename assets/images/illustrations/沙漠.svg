<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Dune Gradients -->
    <linearGradient id="duneBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="duneMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="duneFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Sun & Sky Elements -->
  <circle cx="180" cy="70" r="45" fill="url(#sunGlow)"/>
  <circle cx="180" cy="70" r="18" fill="#fef08a"/>

  <!-- Distant Dunes -->
  <path d="M 0 130 Q 80 100 240 120 L 240 240 L 0 240 Z" fill="url(#duneBack)"/>

  <!-- Midground Dunes -->
  <path d="M 0 150 Q 140 120 240 145 L 240 240 L 0 240 Z" fill="url(#duneMid)"/>

  <!-- Foreground Dunes (Crossing path) -->
  <path d="M -20 180 Q 90 140 260 170 L 260 240 L -20 240 Z" fill="url(#duneFront)"/>
  
  <!-- Subtle Ridge Highlighting -->
  <path d="M 45 168 Q 120 150 240 185" stroke="#fde68a" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Cactus Silhouette / Detail Props -->
  <g transform="translate(20, 155) scale(0.6)">
    <path d="M10 40 L10 10 Q10 2 15 2 Q20 2 20 10 L20 40 Z" fill="#065f46"/>
    <path d="M5 22 L10 22 Q15 22 15 17 Q15 12 10 12 L2 12" stroke="#065f46" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M22 28 L18 28 Q13 28 13 23 Q13 18 18 18 L25 18" stroke="#065f46" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(210, 180) scale(0.4)">
    <path d="M10 40 L10 10 Q10 2 15 2 Q20 2 20 10 L20 40 Z" fill="#065f46"/>
    <path d="M5 22 L10 22 Q15 22 15 17 Q15 12 10 12 L2 12" stroke="#065f46" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- TRAVELERS (Character 1: Leader walking forward) -->
  <g transform="translate(75, 145)">
    <!-- Shadow -->
    <ellipse cx="10" cy="38" rx="14" ry="4" fill="#78350f" opacity="0.4"/>
    <!-- Backpack -->
    <rect x="-3" y="10" width="10" height="14" rx="3" fill="#3b82f6"/>
    <!-- Legs (Walking Pose) -->
    <path d="M 5 28 L 12 37" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <path d="M 5 28 L -2 36" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- Body / Jacket -->
    <path d="M -1 10 L 11 10 L 13 28 L -3 28 Z" fill="#f97316"/>
    <!-- Head & Sun Hat -->
    <circle cx="5".5 cy="3" r="5" fill="#fcd34d"/>
    <ellipse cx="5.5" cy="1" rx="8" ry="2.5" fill="#ea580c"/>
    <!-- Arms -->
    <path d="M 10 13 L 18 20" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Walking Stick -->
    <line x1="18" y1="14" x2="24" y2="38" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- TRAVELERS (Character 2: Following closely behind) -->
  <g transform="translate(130, 155)">
    <!-- Shadow -->
    <ellipse cx="8" cy="35" rx="12" ry="3.5" fill="#78350f" opacity="0.4"/>
    <!-- Backpack -->
    <rect x="-1" y="9" width="9" height="13" rx="3" fill="#10b981"/>
    <!-- Legs (Walking Pose) -->
    <path d="M 4 26 L 10 34" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 4 26 L -3 33" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Body / Jacket -->
    <path d="M -2 9 L 10 9 L 11 26 L -2 26 Z" fill="#ec4899"/>
    <!-- Head & Scarf/Hat -->
    <circle cx="4.5" cy="2" r="4.5" fill="#fcd34d"/>
    <path d="M 0 2 C 0 -1 9 -1 9 2 Z" fill="#38bdf8"/>
    <!-- Arms -->
    <path d="M 8 13 L 2 19" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Footprints in Sand (Curving behind them to show journey) -->
  <g fill="#b45309" opacity="0.6">
    <ellipse cx="140" cy="195" rx="3" ry="1.5" transform="rotate(-15 140 195)"/>
    <ellipse cx="125" cy="190" rx="3" ry="1.5" transform="rotate(-10 125 190)"/>
    <ellipse cx="105" cy="182" rx="3" ry="1.5" transform="rotate(-5 105 182)"/>
    <ellipse cx="88" cy="178" rx="3" ry="1.5" transform="rotate(5 88 178)"/>
    <ellipse cx="70" cy="172" rx="3" ry="1.5" transform="rotate(10 70 172)"/>
  </g>

  <!-- Atmospheric Dust / Heat Haze Effect -->
  <path d="M 50 80 Q 90 75 130 85" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M 90 60 Q 140 55 180 68" stroke="#fef08a" stroke-width="1.5" fill="none" opacity="0.15" stroke-linecap="round"/>
</svg>