<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="desk-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Glue Bottle Gradient -->
    <linearGradient id="bottle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Wooden Fragment Gradient -->
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#desk-glow)" />

  <!-- Background Environment (Workshop / Craft Desk) -->
  <!-- Back Wall & Shelf line -->
  <line x1="0" y1="70" x2="240" y2="70" stroke="#334155" stroke-width="2" stroke-dasharray="8 4" opacity="0.5" />
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.8" />
  <path d="M0 176 L240 176 L240 180 L0 180 Z" fill="#334155" />

  <!-- Background Props: Craft tools & jars -->
  <rect x="25" y="45" width="16" height="25" rx="3" fill="#475569" />
  <path d="M27 45 L39 45 L35 38 L31 38 Z" fill="#94a3b8" />
  <rect x="50" y="52" width="22" height="18" rx="3" fill="#10b981" opacity="0.7" />
  
  <!-- Plant in Pot -->
  <path d="M205 50 Q215 50 212 70 L208 70 Q205 50 205 50 Z" fill="#38bdf8" />
  <circle cx="210" cy="42" r="12" fill="#059669" />
  <circle cx="202" cy="48" r="9" fill="#10b981" />
  <circle cx="218" cy="46" r="10" fill="#34d399" />
  <path d="M200 70 L220 70 L216 85 L204 85 Z" fill="#cbd5e1" />

  <!-- MAIN CHARACTER: Crafting/Repairing -->
  <g transform="translate(45, 80)">
    <!-- Character Body & Clothes -->
    <path d="M35 70 C20 70 10 85 5 100 L65 100 C60 85 50 70 35 70 Z" fill="#6366f1" filter="url(#shadow)" />
    <!-- Collar -->
    <path d="M27 70 L35 78 L43 70 Z" fill="#e2e8f0" />

    <!-- Character Neck & Head -->
    <rect x="28" y="54" width="14" height="18" rx="6" fill="#fcd34d" />
    <circle cx="35" cy="40" r="18" fill="#fcd34d" filter="url(#shadow)" />
    
    <!-- Hair -->
    <path d="M18 36 C18 20 52 20 52 36 C52 42 48 42 45 38 C42 34 28 34 25 38 C22 42 18 42 18 36 Z" fill="#334155" />

    <!-- Focused Eyes & Expression -->
    <circle cx="28" cy="38" r="2" fill="#1e293b" />
    <circle cx="42" cy="38" r="2" fill="#1e293b" />
    <!-- Eyebrows tilted in concentration -->
    <line x1="25" y1="34" x2="31" y2="35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="39" y1="35" x2="45" y2="34" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Small Smile -->
    <path d="M33 46 Q35 48 37 46" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Left Arm (Holding broken object) -->
    <path d="M15 75 Q10 85 20 95" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <circle cx="20" cy="95" r="5" fill="#fcd34d" />

    <!-- Right Arm (Holding Glue Bottle, actively squeezing) -->
    <path d="M55 75 Q70 85 75 95" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <circle cx="75" cy="95" r="5" fill="#fcd34d" />
  </g>

  <!-- WORKSPACE FOCUS: Broken Object & Glue Interaction -->
  <g transform="translate(100, 125)" filter="url(#shadow)">
    <!-- Wooden Base / Desk Mat -->
    <rect x="-10" y="35" width="120" height="15" rx="4" fill="#334155" opacity="0.4" />

    <!-- Broken Object being glued (A stylized wooden toy bird or plaque, broken in two pieces) -->
    <!-- Left Piece -->
    <path d="M 25 20 L 45 10 L 50 30 L 30 35 Z" fill="url(#wood-grad)" />
    <!-- Right Piece (being joined with a slight gap where glue is applied) -->
    <path d="M 55 28 L 75 18 L 70 38 L 50 38 Z" fill="url(#wood-grad)" />

    <!-- GLUE DROPS (The Action!) -->
    <!-- Glowing white-blue fresh glue droplet falling right at the fracture -->
    <path d="M 51 18 C 51 15 48 10 48 8 C 48 6 50 5 52 5 C 54 5 56 6 56 8 C 56 10 53 15 53 18 Z" fill="#38bdf8" />
    <!-- Glue string/bead on the joint -->
    <path d="M 49 22 Q 52 26 54 24" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- THE GLUE BOTTLE (胶水 - Jiāoshuǐ) -->
    <!-- Angled downwards squeezing glue -->
    <g transform="translate(65, -15) rotate(35)">
      <!-- Bottle Body -->
      <rect x="0" y="0" width="18" height="36" rx="4" fill="url(#bottle-grad)" />
      <!-- Bottle Label Accent -->
      <rect x="3" y="10" width="12" height="16" rx="1" fill="#ffffff" opacity="0.9" />
      <line x1="5" y1="14" x2="13" y2="14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="5" y1="19" x2="11" y2="19" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <!-- Bottle Neck & Cap -->
      <rect x="6" y="-5" width="6" height="5" fill="#0284c7" />
      <path d="M 9 -12 L 6 -5 L 12 -5 Z" fill="#f59e0b" />
      <!-- Squeeze hand lines / motion -->
      <path d="M -4 10 Q -8 18 -4 26" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M -7 14 Q -10 18 -7 22" stroke="#fcd34d" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Sparkles indicating successful repair / precision -->
    <path d="M 38 5 L 40 10 L 45 12 L 40 14 L 38 19 L 36 14 L 31 12 L 36 10 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M 68 8 L 69 11 L 72 12 L 69 13 L 68 16 L 67 13 L 64 12 L 67 11 Z" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Foreground decorative elements for depth -->
  <circle cx="18" cy="210" r="3" fill="#334155" />
  <circle cx="28" cy="225" r="2" fill="#475569" />
  <circle cx="220" cy="200" r="4" fill="#334155" />
</svg>