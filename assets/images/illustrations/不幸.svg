<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Road Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#475569" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- Car (The accident vehicle) -->
  <g transform="translate(140, 150)">
    <path d="M10 40 L70 40 L65 20 L20 20 Z" fill="#ec4899"/>
    <rect x="25" y="5" width="30" height="15" rx="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="20" cy="45" r="8" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="60" cy="45" r="8" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  </g>
  
  <!-- Subject (The person) -->
  <g transform="translate(60, 140)">
    <!-- Body -->
    <path d="M20 20 L40 20 L35 60 L25 60 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="30" cy="15" r="12" fill="#fde68a"/>
    <!-- Arms (Arms up in shock) -->
    <path d="M20 25 L5 10" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 25 L55 10" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M27 60 L25 85" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M33 60 L35 85" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Impact/Shock Effect -->
  <path d="M120 160 L135 140 L150 160 L140 175 Z" fill="#fbbf24" opacity="0.8"/>
  <circle cx="135" cy="150" r="2" fill="#ffffff"/>
  
  <!-- Street Lamp -->
  <rect x="200" y="40" width="6" height="120" fill="#94a3b8"/>
  <rect x="180" y="40" width="26" height="6" fill="#94a3b8"/>
  <circle cx="193" cy="55" r="15" fill="#f59e0b" opacity="0.2"/>
</svg>