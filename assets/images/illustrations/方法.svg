<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Compass Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Map Paper Gradient -->
    <linearGradient id="map-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e2"/>
      <stop offset="100%" stop-color="#f5e6be"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient light circles / depth elements -->
  <circle cx="120" cy="120" r="90" fill="#38bdf8" opacity="0.03" filter="url(#glow)"/>
  <circle cx="170" cy="70" r="50" fill="#f59e0b" opacity="0.05" filter="url(#glow)"/>

  <!-- Wooden Desk Surface / Environment base -->
  <path d="M 20 185 L 220 185 L 235 225 L 5 225 Z" fill="#090d16" opacity="0.6"/>
  <path d="M 15 178 L 225 178 L 220 186 L 20 186 Z" fill="#334155" opacity="0.8"/>

  <!-- Props in background: Stack of study notebooks -->
  <g transform="translate(35, 145) rotate(-8)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="55" height="35" rx="4" fill="#3b82f6"/>
    <rect x="4" y="4" width="47" height="27" rx="2" fill="#1d4ed8"/>
    <line x1="10" y1="10" x2="30" y2="10" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="18" x2="40" y2="18" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Props in background: Glowing Magnifying Glass (Investigation / Method) -->
  <g transform="translate(160, 115) rotate(25)" filter="url(#soft-shadow)">
    <!-- Glass reflection -->
    <circle cx="25" cy="25" r="22" fill="#38bdf8" opacity="0.15"/>
    <!-- Rim -->
    <circle cx="25" cy="25" r="22" fill="none" stroke="url(#gold-grad)" stroke-width="4"/>
    <!-- Handle -->
    <rect x="23" y="45" width="6" height="30" rx="3" fill="#b45309"/>
    <rect x="24" y="46" width="4" height="28" rx="2" fill="#f59e0b"/>
  </g>

  <!-- MAIN SUBJECT: The Treasure Map (Visual metaphor for "Method" / Step-by-step path) -->
  <g filter="url(#soft-shadow)" transform="translate(0, 5)">
    <!-- Map Rolled Edges / Base -->
    <path d="M 50 70 Q 120 50 190 70 L 200 150 Q 120 175 40 150 Z" fill="url(#map-grad)"/>

    <!-- Map folds / texture lines -->
    <path d="M 85 60 L 75 160" stroke="#e2d4af" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
    <path d="M 155 62 L 165 162" stroke="#e2d4af" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>

    <!-- Route / Method path (Dotted energetic line with directional arrows) -->
    <path d="M 65 135 Q 90 95 120 115 T 175 95" fill="none" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>

    <!-- Milestone nodes on the map (representing steps/methods) -->
    <circle cx="65" cy="135" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <circle cx="120" cy="115" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="175" cy="95" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Star at the destination -->
    <path d="M 175 80 L 178 88 L 186 91 L 178 94 L 175 102 L 172 94 L 164 91 L 172 88 Z" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <!-- MAIN SUBJECT: Vintage Brass Compass (Primary symbol for guidance and method) -->
  <g filter="url(#soft-shadow)" transform="translate(85, 80)">
    <!-- Outer Shadow Ring -->
    <circle cx="35" cy="35" r="32" fill="#0f172a" opacity="0.3"/>
    
    <!-- Compass Casing -->
    <circle cx="35" cy="35" r="28" fill="url(#gold-grad)"/>
    <circle cx="35" cy="35" r="24" fill="#1e293b"/>
    <circle cx="35" cy="35" r="22" fill="#0f172a"/>

    <!-- Compass Dial Marks -->
    <line x1="35" y1="15" x2="35" y2="19" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="51" x2="35" y2="55" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="35" x2="19" y2="35" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="51" y1="35" x2="55" y2="35" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

    <!-- Compass Needle (Pointing dynamically, highlighting the active direction/method) -->
    <polygon points="35,17 38,35 35,45" fill="#f43f5e" filter="url(#glow)"/>
    <polygon points="35,53 32,35 35,45" fill="#38bdf8"/>
    <circle cx="35" cy="35" r="4" fill="url(#gold-grad)"/>

    <!-- Compass Ring Loop on Top -->
    <circle cx="35" cy="4" r="5" fill="none" stroke="url(#gold-grad)" stroke-width="3"/>
  </g>

  <!-- Floating Sparkles / Action Elements (Atmosphere of discovery and smart learning) -->
  <g fill="#fbbf24">
    <path d="M 45 45 L 48 52 L 55 55 L 48 58 L 45 65 L 42 58 L 35 55 L 42 52 Z" opacity="0.8" filter="url(#glow)"/>
    <path d="M 195 55 L 197 60 L 202 62 L 197 64 L 195 69 L 193 64 L 188 62 L 193 60 Z" opacity="0.6"/>
    <path d="M 200 145 L 201 148 L 204 149 L 201 150 L 200 153 L 199 150 L 196 149 L 199 148 Z" opacity="0.9" fill="#38bdf8"/>
  </g>

  <!-- Small Glowing Light Orbs -->
  <circle cx="70" cy="40" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="140" cy="45" r="2" fill="#f43f5e" filter="url(#glow)"/>
  <circle cx="185" cy="130" r="3.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="55" cy="140" r="2" fill="#fbbf24"/>
</svg>