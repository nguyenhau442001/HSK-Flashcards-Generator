<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Desk / Furniture Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Paper Stack Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting (Desk Lamp Cone) -->
  <polygon points="120,10 70,180 170,180" fill="url(#lampGlow)" opacity="0.6" style="mix-blend-mode: screen;" />

  <!-- Background Environment / Bookshelf -->
  <rect x="25" y="45" width="40" height="8" rx="2" fill="#334155" />
  <rect x="35" y="25" width="12" height="20" rx="1" fill="#f43f5e" />
  <rect x="49" y="28" width="10" height="17" rx="1" fill="#38bdf8" />

  <!-- Hanging Desk Lamp (Top Center) -->
  <path d="M120,0 L120,35" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M100,35 L140,35 L145,45 L95,45 Z" fill="#fbbf24" />
  <!-- Lamp Bulb -->
  <circle cx="120" cy="46" r="4" fill="#fef08a" />

  <!-- Work Desk Surface -->
  <rect x="10" y="175" width="220" height="55" rx="4" fill="url(#deskGrad)" />
  <rect x="10" y="175" width="220" height="6" fill="#64748b" opacity="0.5" />

  <!-- Clutter: Tower of Messy Papers / Difficult Work -->
  <!-- Bottom paper stack -->
  <path d="M60,175 L80,165 L150,170 L140,178 Z" fill="#cbd5e1" filter="url(#shadow)" />
  <path d="M65,168 L100,158 L145,162 L130,170 Z" fill="#f8fafc" filter="url(#shadow)" />
  <!-- Crumpled paper balls -->
  <circle cx="50" cy="168" r="8" fill="#e2e8f0" filter="url(#shadow)" />
  <path d="M46,165 Q48,162 52,166 Q55,164 53,170" stroke="#94a3b8" stroke-width="1.5" fill="none" />
  
  <circle cx="160" cy="165" r="7" fill="#cbd5e1" filter="url(#shadow)" />

  <!-- Coffee Mug of Exhaustion -->
  <rect x="165" y="142" width="16" height="20" rx="3" fill="#38bdf8" filter="url(#shadow)" />
  <path d="M181,146 C187,146 187,156 181,158" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  <!-- Steam rising -->
  <path d="M170,135 Q173,130 170,125" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M176,137 Q179,132 176,127" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Main Character: Experiencing "困难" (Overwhelmed, Stressed) -->
  <g id="character" transform="translate(0, 5)">
    <!-- Hoodie/Body Leaning Forward -->
    <path d="M85,185 C85,145 95,130 120,130 C145,130 155,145 155,185 Z" fill="#1e1b4b" />
    <path d="M85,185 C85,145 95,130 120,130 C145,130 155,145 155,185 Z" fill="#312e81" />
    <!-- Hoodie Hood (Back) -->
    <path d="M92,125 C90,100 110,90 120,90 C130,90 150,100 148,125 Z" fill="#4338ca" />

    <!-- Arms Holding Head (Classic Overwhelmed/Stressed Pose) -->
    <!-- Left Arm -->
    <path d="M95,145 Q80,130 95,115 L108,125 Q98,135 105,148 Z" fill="#312e81" />
    <circle cx="98" cy="113" r="8" fill="#fbcfe8" /> <!-- Hand holding head -->

    <!-- Right Arm -->
    <path d="M145,145 Q160,130 145,115 L132,125 Q142,135 135,148 Z" fill="#312e81" />
    <circle cx="142" cy="113" r="8" fill="#fbcfe8" /> <!-- Hand holding head -->

    <!-- Head / Face -->
    <circle cx="120" cy="115" r="22" fill="#fbcfe8" />
    
    <!-- Messy Hair -->
    <path d="M100,105 Q105,92 115,96 Q120,88 128,94 Q138,90 142,102 Q145,108 140,110 Z" fill="#1e293b" />

    <!-- Expressive Face: Stressed / Overwhelmed / Frustrated -->
    <!-- Tilted / Stressed Eyebrows -->
    <path d="M106,113 L114,116" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M126,116 L134,113" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Closed/Teary Stressed Eyes (X_X or tight curves) -->
    <path d="M107,121 Q110,119 113,121" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M127,121 Q130,119 133,121" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Sweat Drop (Classic Stress Indicator) -->
    <path d="M139,112 C139,112 144,118 144,122 C144,125 141,127 139,127 C137,127 134,125 134,122 C134,118 139,112 139,112 Z" fill="#38bdf8" opacity="0.85" />

    <!-- Open Wavy Mouth (Groaning/Sighing) -->
    <path d="M115,130 Q120,136 125,130" fill="#1e293b" />
    
    <!-- Blush marks -->
    <ellipse cx="106" cy="126" rx="3" ry="1.5" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="134" cy="126" rx="3" ry="1.5" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- Floating Dynamic Difficulty Elements (Abstract Stress, Heavy workload vibe) -->
  <!-- Floating document flying away -->
  <g transform="translate(170, 75) rotate(25)" filter="url(#shadow)">
    <rect x="0" y="0" width="24" height="30" rx="2" fill="#f8fafc" />
    <line x1="4" y1="6" x2="20" y2="6" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="12" x2="16" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="18" x2="18" y2="18" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
  </g>

  <g transform="translate(45, 95) rotate(-15)" filter="url(#shadow)">
    <rect x="0" y="0" width="20" height="26" rx="2" fill="#f8fafc" />
    <line x1="3" y1="5" x2="15" y2="5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="3" y1="10" x2="12" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Glowing Accent Spark / Tension Lines -->
  <path d="M70,80 L78,88" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M165,95 L157,103" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>