<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window frame and night city background -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="180" cy="50" r="15" fill="#fbbf24"/>
  <rect x="30" y="120" width="40" height="50" fill="#1e293b"/>
  <rect x="80" y="100" width="40" height="70" fill="#1e293b"/>
  <rect x="130" y="130" width="40" height="40" fill="#1e293b"/>
  
  <!-- Interior: The warm embrace -->
  <path d="M40 170 L200 170 L200 220 L40 220 Z" fill="#1e293b"/>
  
  <!-- Character 1 (Traveler/Distant) -->
  <g transform="translate(60, 160)">
    <path d="M10 40 L10 10 Q10 0 20 0 L30 0 Q40 0 40 10 L40 40" fill="#38bdf8"/>
    <circle cx="25" cy="-5" r="10" fill="#fde68a"/>
  </g>
  
  <!-- Character 2 (Parent/Home) -->
  <g transform="translate(140, 160)">
    <path d="M10 40 L10 10 Q10 0 20 0 L30 0 Q40 0 40 10 L40 40" fill="#fb923c"/>
    <circle cx="25" cy="-5" r="10" fill="#fde68a"/>
  </g>
  
  <!-- Warm Glow Effect -->
  <ellipse cx="120" cy="180" rx="80" ry="30" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Suitcase -->
  <rect x="40" y="190" width="20" height="15" rx="2" fill="#ec4899"/>
  
  <!-- Hugging gesture -->
  <path d="M75 165 C90 150 120 150 135 165" stroke="#fde68a" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Decorative stars -->
  <circle cx="190" cy="30" r="1" fill="#ffffff"/>
  <circle cx="170" cy="20" r="1.5" fill="#ffffff"/>
  <circle cx="210" cy="40" r="1" fill="#ffffff"/>
</svg>