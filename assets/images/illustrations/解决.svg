<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Success -->
    <radialGradient id="success-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment / Office Interior -->
  <!-- Back Wall & Window -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="35" y="35" width="70" height="90" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <polygon points="35,35 105,35 105,125 35,125" fill="url(#window-light)" />
  <line x1="70" y1="35" x2="70" y2="125" stroke="#475569" stroke-width="1.5" />
  <line x1="35" y1="80" x2="105" y2="80" stroke="#475569" stroke-width="1.5" />

  <!-- Bookshelf Background Prop -->
  <g transform="translate(180, 40)">
    <rect x="0" y="0" width="25" height="85" rx="2" fill="#334155" />
    <rect x="4" y="15" width="17" height="6" fill="#f43f5e" />
    <rect x="4" y="25" width="17" height="8" fill="#38bdf8" />
    <rect x="4" y="40" width="17" height="6" fill="#10b981" />
    <rect x="4" y="55" width="17" height="10" fill="#f59e0b" />
  </g>

  <!-- Ambient Glow behind the solved puzzle/board -->
  <circle cx="160" cy="115" r="45" fill="url(#success-glow)" />

  <!-- Large Office Desk -->
  <rect x="25" y="155" width="190" height="12" rx="4" fill="#475569" />
  <rect x="40" y="167" width="12" height="55" fill="#334155" />
  <rect x="188" y="167" width="12" height="55" fill="#334155" />

  <!-- Desk Props: Laptop & Coffee Mug -->
  <path d="M 45 155 L 75 155 L 80 135 L 40 135 Z" fill="#64748b" />
  <path d="M 38 155 L 82 155 L 85 157 L 35 157 Z" fill="#94a3b8" />
  <ellipse cx="60" cy="146" rx="15" ry="3" fill="#38bdf8" />

  <rect x="90" y="142" width="12" height="13" rx="3" fill="#cbd5e1" />
  <path d="M 102 145 C 107 145, 107 152, 102 152" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <!-- The "Problem Solved" Project Board / Glowing UI Flowchart on Stand -->
  <g transform="translate(130, 75)">
    <!-- Board backing -->
    <rect x="0" y="0" width="65" height="55" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <!-- Connected nodes showing 'solution' -->
    <circle cx="15" cy="18" r="6" fill="#f43f5e" />
    <circle cx="32" cy="38" r="6" fill="#38bdf8" />
    <circle cx="50" cy="18" r="8" fill="#10b981" />
    
    <!-- Connection lines -->
    <line x1="19" y1="22" x2="28" y2="34" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <line x1="36" y1="34" x2="45" y2="22" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />

    <!-- Checkmark representing resolution -->
    <path d="M 46 18 L 49 21 L 55 14" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Stand for board -->
  <line x1="162" y1="130" x2="162" y2="155" fill="none" stroke="#64748b" stroke-width="3" />

  <!-- Character 1 (Left - Teammate 1 pointing/explaining) -->
  <g transform="translate(45, 95)">
    <!-- Body / Torso -->
    <path d="M 20 40 Q 20 25 35 25 Q 50 25 50 40 L 55 75 L 15 75 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="35" cy="14" r="11" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 24 14 Q 25 5 35 4 Q 46 5 46 14 Q 40 8 35 9 Z" fill="#1e293b" />
    <!-- Arm pointing at the board -->
    <path d="M 45 35 Q 60 40 70 30" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="71" cy="28" r="3.5" fill="#fbcfe8" />
  </g>

  <!-- Character 2 (Right - Teammate 2 celebrating/arms up) -->
  <g transform="translate(100, 85)">
    <!-- Body / Torso -->
    <path d="M 20 50 Q 20 35 35 35 Q 50 35 50 50 L 58 85 L 12 85 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="35" cy="22" r="11" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M 24 22 Q 25 12 35 11 Q 45 12 46 22 Z" fill="#78350f" />
    <!-- Raised Arms (Celebrating success / solution found) -->
    <path d="M 24 40 Q 10 25 5 20" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <path d="M 46 40 Q 60 25 65 20" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="3.5" cy="18" r="3.5" fill="#fed7aa" />
    <circle cx="66.5" cy="18" r="3.5" fill="#fed7aa" />
  </g>

  <!-- Sparkles / Success Highlights -->
  <g fill="#fbbf24">
    <path d="M 125 55 L 127 61 L 133 63 L 127 65 L 125 71 L 123 65 L 117 63 L 123 61 Z" />
    <path d="M 95 30 L 96 34 L 100 35 L 96 36 L 95 40 L 94 36 L 90 35 L 94 34 Z" transform="scale(0.8) translate(30, 10)" />
    <circle cx="175" cy="50" r="3" fill="#38bdf8" />
    <circle cx="115" cy="115" r="2.5" fill="#10b981" />
  </g>
</svg>