<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Light -->
    <radialGradient id="desk-light" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Accent for Agreement -->
    <radialGradient id="agreement-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadows -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#desk-light)"/>

  <!-- Office Background Elements -->
  <!-- Bookshelf / Wall partition -->
  <path d="M30 40 H210 V140 H30 Z" fill="#1e293b" opacity="0.5"/>
  <rect x="45" y="55" width="20" height="40" rx="3" fill="#334155" opacity="0.6"/>
  <rect x="70" y="50" width="15" height="45" rx="3" fill="#475569" opacity="0.6"/>
  <rect x="175" y="60" width="25" height="35" rx="3" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="120" cy="45" r="8" fill="#fbbf24" opacity="0.4"/>

  <!-- Hanging Lamp -->
  <path d="M120 0 V35" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 35 H140 L145 45 H95 Z" fill="#64748b"/>
  <ellipse cx="120" cy="45" rx="25" ry="8" fill="#fbbf24" opacity="0.2"/>

  <!-- Conference Table -->
  <path d="M35 150 L60 200 H180 L205 150 Z" fill="#0f172a" filter="url(#soft-shadow)"/>
  <path d="M40 150 H200 V162 H40 Z" fill="#334155"/>
  <path d="M50 162 H190 V172 H50 Z" fill="#1e293b"/>

  <!-- Table Centerpiece: Contract & Agreement Badge -->
  <g transform="translate(120, 155)">
    <!-- Document -->
    <rect x="-18" y="-12" width="36" height="26" rx="2" fill="#f8fafc" filter="url(#soft-shadow)"/>
    <line x1="-12" y1="-6" x2="12" y2="-6" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="8" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="6" x2="4" y2="6" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Glowing Stamp / Handshake symbol representing mutual agreement -->
    <circle cx="8" cy="4" r="10" fill="url(#agreement-glow)"/>
    <circle cx="8" cy="4" r="7" fill="#10b981"/>
    <!-- Checkmark -->
    <path d="M5 4 L7 7 L12 1" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CHARACTER 1: Party A (Left Side) -->
  <g transform="translate(75, 125)">
    <!-- Body & Torso -->
    <path d="M-20 45 C-20 25 -10 20 0 20 C10 20 20 25 20 45 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt -->
    <polygon points="0,20 -8,28 8,28" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="0" cy="2" r="15" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M-15 0 C-15 -10 -5 -14 0 -14 C8 -14 15 -8 15 2 C10 -3 5 -5 0 -5 C-5 -5 -10 -2 -15 0 Z" fill="#1e293b"/>
    <!-- Face (Smiling, agreeing) -->
    <circle cx="-4" cy="0" r="1.5" fill="#1e293b"/>
    <circle cx="4" cy="0" r="1.5" fill="#1e293b"/>
    <path d="M-3 6 C-1 8 3 8 5 6" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="-8" cy="4" rx="2" ry="1" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="8" cy="4" rx="2" ry="1" fill="#f43f5e" opacity="0.4"/>

    <!-- Arms enacting signing/agreement gesture -->
    <path d="M-18 30 C-25 35 -30 25 -25 20" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 30 L30 38" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand holding pen -->
    <circle cx="32" cy="40" r="3" fill="#fcd34d"/>
    <line x1="32" cy="40" r2="40" x2="38" y2="48" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 2: Party B (Right Side - The "乙" equivalent role) -->
  <g transform="translate(165, 125)">
    <!-- Body & Torso -->
    <path d="M-20 45 C-20 25 -10 20 0 20 C10 20 20 25 20 45 Z" fill="#ec4899"/>
    <!-- Collar / Shirt -->
    <polygon points="0,20 -8,28 8,28" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="0" cy="2" r="15" fill="#fcd34d"/>
    <!-- Hair (Stylized bob) -->
    <path d="M-15 0 C-15 -10 -8 -15 0 -15 C8 -15 15 -10 15 5 C12 8 10 15 10 15 C10 15 8 5 3 2 C-2 -1 -10 0 -15 0 Z" fill="#0f172a"/>
    <!-- Face (Nodding happily in agreement) -->
    <circle cx="-4" cy="0" r="1.5" fill="#0f172a"/>
    <circle cx="4" cy="0" r="1.5" fill="#0f172a"/>
    <path d="M-3 6 C-1 8 3 8 5 6" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="-8" cy="4" rx="2" ry="1" fill="#fb7185" opacity="0.4"/>
    <ellipse cx="8" cy="4" rx="2" ry="1" fill="#fb7185" opacity="0.4"/>

    <!-- Arms gesture -->
    <path d="M18 30 C25 35 30 25 25 20" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <path d="M-15 30 L-30 38" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand giving thumbs up / agreement gesture -->
    <circle cx="-32" cy="40" r="3" fill="#fcd34d"/>
    <path d="M-34 38 L-36 34" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dialogue / Mutual Agreement Indicator Bubbles (Iconic, no text) -->
  <g transform="translate(120, 85)" filter="url(#soft-shadow)">
    <!-- Central Agreement Bubble -->
    <path d="M-15 -10 H15 C20 -10 20 -5 20 0 C20 5 20 10 15 10 H5 L0 16 L-5 10 H-15 C-20 10 -20 5 -20 0 C-20 -5 -20 -10 -15 -10 Z" fill="#ffffff"/>
    <!-- Double checkmarks inside bubble indicating BOTH parties agreed -->
    <path d="M-8 0 L-4 4 L5 -4" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-2 4 L1 7 L8 0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <!-- Decorative Coffee Cups for Real-World Context -->
  <g transform="translate(45, 155)">
    <path d="M0 5 H12 L10 18 H2 Z" fill="#f8fafc"/>
    <path d="M12 8 C15 8 16 12 12 15" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <path d="M4 2 C6 0 8 0 10 2" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
  <g transform="translate(180, 155)">
    <path d="M0 5 H12 L10 18 H2 Z" fill="#f8fafc"/>
    <path d="M12 8 C15 8 16 12 12 15" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <path d="M4 2 C6 0 8 0 10 2" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>