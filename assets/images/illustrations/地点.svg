<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Pin Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Map Fold Lines Pattern -->
    <clipPath id="map-clip">
      <path d="M 30,70 Q 120,45 210,70 L 210,185 Q 120,160 30,185 Z" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background elements / Grid dots -->
  <g fill="#334155" opacity="0.4">
    <circle cx="30" cy="30" r="1.5" />
    <circle cx="60" cy="30" r="1.5" />
    <circle cx="90" cy="30" r="1.5" />
    <circle cx="120" cy="30" r="1.5" />
    <circle cx="150" cy="30" r="1.5" />
    <circle cx="180" cy="30" r="1.5" />
    <circle cx="210" cy="30" r="1.5" />

    <circle cx="30" cy="210" r="1.5" />
    <circle cx="60" cy="210" r="1.5" />
    <circle cx="90" cy="210" r="1.5" />
    <circle cx="120" cy="210" r="1.5" />
    <circle cx="150" cy="210" r="1.5" />
    <circle cx="180" cy="210" r="1.5" />
    <circle cx="210" cy="210" r="1.5" />
  </g>

  <!-- Ambient light pool -->
  <ellipse cx="120" cy="140" rx="80" ry="40" fill="#38bdf8" opacity="0.07" filter="url(#glow)" />

  <!-- Compass / Navigation decorative ring in background -->
  <circle cx="120" cy="125" r="85" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5" />

  <!-- LAYER 1: The Folded Map Surface (Isometric-ish angle) -->
  <g filter="url(#shadow)">
    <!-- Map Base Shadow -->
    <path d="M 28,76 Q 120,51 212,76 L 212,191 Q 120,166 28,191 Z" fill="#090d16" />
    
    <!-- Map Paper -->
    <path d="M 28,70 Q 120,45 212,70 L 212,185 Q 120,160 28,185 Z" fill="#e2e8f0" />
  </g>

  <!-- Map Details (Clip Path) -->
  <g clip-path="url(#map-clip)">
    <!-- Terrain / Landmass Fills -->
    <path d="M 28,110 Q 70,90 120,120 T 212,100 L 212,185 L 28,185 Z" fill="#cbd5e1" />
    <path d="M 28,150 Q 80,135 150,160 T 212,145 L 212,185 L 28,185 Z" fill="#94a3b8" opacity="0.5" />
    
    <!-- Water Body / River -->
    <path d="M 28,80 C 80,70 100,120 130,130 C 160,140 180,100 212,120" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <path d="M 28,80 C 80,70 100,120 130,130 C 160,140 180,100 212,120" fill="none" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Map Grid Roads -->
    <path d="M 50,60 L 70,180" fill="none" stroke="#cbd5e1" stroke-width="4" />
    <path d="M 140,50 L 160,170" fill="none" stroke="#cbd5e1" stroke-width="5" />
    <path d="M 30,100 L 210,125" fill="none" stroke="#cbd5e1" stroke-width="3" />
    <path d="M 35,150 L 205,170" fill="none" stroke="#cbd5e1" stroke-width="3" />

    <!-- Mini Map Icons (Buildings/Trees) -->
    <rect x="75" y="100" width="10" height="8" rx="1" fill="#64748b" />
    <rect x="95" y="110" width="12" height="10" rx="1" fill="#64748b" />
    <circle cx="175" cy="90" r="5" fill="#10b981" opacity="0.8" />
    <circle cx="185" cy="95" r="4" fill="#10b981" opacity="0.8" />
    <circle cx="60" cy="140" r="6" fill="#10b981" opacity="0.8" />
  </g>

  <!-- Map Fold Creases (Highlights/Shadows for 3D effect) -->
  <path d="M 90,56 L 85,172" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.1" />
  <path d="M 155,59 L 150,175" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.1" />
  <path d="M 28,127.5 Q 120,102.5 212,127.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />

  <!-- Compass Needle Rose / Decorative Element on Map Corner -->
  <g transform="translate(55, 95) rotate(-15)">
    <polygon points="0,-8 3,0 0,8 -3,0" fill="#ef4444" />
    <polygon points="0,8 3,0 0,-8 -3,0" fill="#94a3b8" />
    <circle cx="0" cy="0" r="2" fill="#0f172a" />
  </g>

  <!-- LAYER 2: Contextual Props (Magnifying Glass resting on map) -->
  <g filter="url(#shadow)" transform="rotate(15 140 130)">
    <!-- Glass Handle -->
    <rect x="135" y="130" width="12" height="65" rx="6" fill="#fb923c" />
    <rect x="138" y="135" width="4" height="50" rx="2" fill="#fed7aa" opacity="0.5" />
    
    <!-- Handle Ring Connector -->
    <rect x="132" y="120" width="18" height="14" rx="3" fill="#cbd5e1" />

    <!-- Lens Rim -->
    <circle cx="141" cy="85" r="34" fill="#0f172a" opacity="0.2" />
    <circle cx="141" cy="82" r="34" fill="#38bdf8" />
    <circle cx="141" cy="82" r="28" fill="#f8fafc" />

    <!-- Magnified Map View Inside Lens -->
    <clipPath id="lens-clip">
      <circle cx="141" cy="82" r="28" />
    </clipPath>
    <g clip-path="url(#lens-clip)">
      <path d="M 120,60 Q 150,50 170,90 T 130,110 Z" fill="#e0f2fe" />
      <path d="M 125,75 C 135,70 145,85 155,80" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
      <circle cx="145" cy="85" r="4" fill="#ef4444" />
    </g>

    <!-- Lens Glass Glare -->
    <path d="M 122,65 A 28,28 0 0,1 165,63 A 28,28 0 0,0 122,65 Z" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- LAYER 3: The Primary Subject - 3D LOCATION PIN (The Destination) -->
  <g filter="url(#shadow)">
    <!-- Pin Drop Shadow on Map -->
    <ellipse cx="120" cy="155" rx="14" ry="6" fill="#000000" opacity="0.4" filter="url(#glow)" />

    <!-- Pin Stem & Body -->
    <g transform="translate(120, 115)">
      <!-- Outer Glow -->
      <path d="M 0,-36 C 16,-36 28,-24 28,-8 C 28,10 0,36 0,36 C 0,36 -28,10 -28,-8 C -28,-24 -16,-36 0,-36 Z" fill="#f59e0b" opacity="0.4" filter="url(#glow)" />
      
      <!-- Main Pin Shape -->
      <path d="M 0,-34 C 15,-34 26,-22 26,-7 C 26,9 0,32 0,32 C 0,32 -26,9 -26,-7 C -26,-22 -15,-34 0,-34 Z" fill="url(#pin-grad)" />
      
      <defs>
        <linearGradient id="pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fbbf24" />
          <stop offset="50%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
      </defs>

      <!-- Pin Inner Hollow / White Circle -->
      <circle cx="0" cy="-10" r="11" fill="#ffffff" />
      
      <!-- Center Dot inside Pin -->
      <circle cx="0" cy="-10" r="5" fill="#ef4444" />

      <!-- Pin Highlight for 3D Glossy Look -->
      <path d="M -12,-24 C -6,-30 6,-30 12,-24 C 6,-28 -6,-28 -12,-24 Z" fill="#ffffff" opacity="0.6" />
    </g>
  </g>

  <!-- Floating Sparkles / Destination Achieved Accents -->
  <g>
    <!-- Sparkle 1 (Top Left) -->
    <path d="M 75,55 Q 75,65 65,65 Q 75,65 75,75 Q 75,65 85,65 Q 75,65 75,55 Z" fill="#fbbf24" filter="url(#glow)" />
    <!-- Sparkle 2 (Top Right) -->
    <path d="M 175,45 Q 175,51 169,51 Q 175,51 175,57 Q 175,51 181,51 Q 175,51 175,45 Z" fill="#38bdf8" />
    <!-- Small floating dots -->
    <circle cx="95" cy="45" r="3" fill="#10b981" opacity="0.8" />
    <circle cx="160" cy="120" r="2.5" fill="#fb923c" opacity="0.8" />
    <circle cx="55" cy="115" r="2" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Subtle vignette/border frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>