<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="120" cy="80" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window City Night Glow -->
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweaterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="plantPot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Interior Lighting Effect -->
  <circle cx="120" cy="80" r="110" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- BACKDROP / ENVIRONMENT -->
  <!-- Wallpaper Pattern Details -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 8">
    <line x1="0" y1="60" x2="240" y2="60"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
  </g>

  <!-- Window Frame & Night Cityscape (Showing waiting atmosphere) -->
  <g transform="translate(145, 25)">
    <!-- Window Outer frame -->
    <rect x="0" y="0" width="65" height="85" rx="6" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <!-- Night Sky View -->
    <rect x="4" y="4" width="57" height="77" rx="4" fill="url(#windowGrad)"/>
    <!-- Distant City Lights / Stars -->
    <circle cx="15" cy="20" r="1" fill="#fbbf24" opacity="0.8"/>
    <circle cx="45" cy="15" r="1.5" fill="#38bdf8" opacity="0.9"/>
    <circle cx="35" cy="45" r="1" fill="#f43f5e" opacity="0.7"/>
    <!-- Building Silhouettes -->
    <path d="M4 81 L4 55 L18 55 L18 81 Z" fill="#1e1b4b"/>
    <path d="M22 81 L22 35 L42 35 L42 81 Z" fill="#0f172a"/>
    <path d="M44 81 L44 50 L61 50 L61 81 Z" fill="#1e1b4b"/>
    <!-- Window Pane Dividers -->
    <line x1="32" y1="4" x2="32" y2="81" stroke="#334155" stroke-width="2"/>
    <line x1="4" y1="42" x2="61" y2="42" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Hanging Ceiling Lamp casting light downward -->
  <path d="M120 0 L120 25" stroke="#64748b" stroke-width="2"/>
  <path d="M100 25 L140 25 L145 35 L95 35 Z" fill="#475569"/>
  <path d="M95 35 Q120 40 145 35 L135 45 L105 45 Z" fill="#fbbf24" opacity="0.9" filter="url(#shadow)"/>

  <!-- Bookshelf / Wall Shelf with Props -->
  <rect x="25" y="45" width="85" height="6" rx="3" fill="#475569"/>
  <!-- Books on shelf -->
  <rect x="35" y="25" width="10" height="20" rx="2" fill="#38bdf8"/>
  <rect x="47" y="21" width="12" height="24" rx="2" fill="#f43f5e"/>
  <rect x="61" y="27" width="8" height="18" rx="2" fill="#fbbf24"/>
  <!-- Small Potted Plant on Shelf -->
  <path d="M85 35 L95 35 L93 45 L87 45 Z" fill="url(#plantPot)"/>
  <path d="M90 35 Q85 25 80 28 Q85 35 90 35 Z" fill="#10b981"/>
  <path d="M90 35 Q95 24 100 27 Q95 35 90 35 Z" fill="#34d399"/>

  <!-- FOREGROUND TABLE & INTERIOR PROPS -->
  <!-- Wooden Table Surface -->
  <path d="M15 185 L225 185 L235 220 L5 220 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="10" y="175" width="220" height="12" rx="4" fill="#475569"/>
  
  <!-- Table Props: Coffee Mug (representing waiting/cozy evening) -->
  <rect x="180" y="150" width="16" height="20" rx="4" fill="#f8fafc"/>
  <path d="M196 154 C202 154 202 166 196 166" stroke="#f8fafc" stroke-width="3" fill="none"/>
  <!-- Steam from mug -->
  <path d="M185 142 C188 138 185 134 188 130" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Table Props: Open Notebook / Planner -->
  <path d="M45 160 L95 150 L105 178 L55 188 Z" fill="#f8fafc"/>
  <line x1="75" y1="154" x2="85" y2="176" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="158" x2="70" y2="180" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- MAIN SUBJECT: Thoughtful Character (Expressing uncertainty/wondering if someone will arrive) -->
  <g transform="translate(75, 75)">
    <!-- Character Shadow -->
    <ellipse cx="45" cy="115" rx="35" ry="8" fill="#020617" opacity="0.4"/>

    <!-- Body & Sweater -->
    <path d="M15 110 C15 85 30 75 45 75 C60 75 75 85 75 110 L80 120 L10 120 Z" fill="url(#sweaterGrad)"/>
    <!-- Collar Detail -->
    <path d="M32 75 C32 82 58 82 58 75 C50 72 40 72 32 75 Z" fill="#e0f2fe"/>

    <!-- Neck -->
    <rect x="38" y="65" width="14" height="15" fill="#fbcfe8" rx="4"/>

    <!-- Head & Face -->
    <circle cx="45" cy="45" r="22" fill="#fbcfe8" filter="url(#shadow)"/>

    <!-- Hair (Stylized clean vector hair) -->
    <path d="M23 45 C23 25 67 25 67 45 C67 52 63 48 58 38 C53 28 37 28 32 38 C27 48 23 52 23 45 Z" fill="#334155"/>

    <!-- Facial Expression: Thoughtful / Uncertain Gaze (Looking towards the door/window, brow slightly raised) -->
    <!-- Eyebrows -->
    <path d="M33 38 Q38 35 43 38" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M47 38 Q52 35 57 38" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Looking up/away thoughtfully) -->
    <circle cx="38" cy="43" r="3" fill="#1e293b"/>
    <circle cx="52" cy="43" r="3" fill="#1e293b"/>
    <circle cx="39" cy="42" r="1" fill="#ffffff"/>
    <circle cx="53" cy="42" r="1" fill="#ffffff"/>

    <!-- Gentle Pensive Mouth (Slightly asymmetrical/curved upward in mild wonder) -->
    <path d="M43 52 Q46 56 49 52" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Hand Resting on Cheek (Classic gesture of uncertainty/waiting) -->
    <!-- Arm -->
    <path d="M15 105 C15 90 25 80 32 90" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Hand on chin -->
    <circle cx="35" cy="55" r="7" fill="#fbcfe8"/>
  </g>

  <!-- Question Mark Motif subtly woven into the environment (Floating Thought Bubble / Uncertainty Concept without words) -->
  <g transform="translate(130, 45)" opacity="0.85">
    <!-- Thought bubble cluster -->
    <circle cx="0" cy="20" r="4" fill="#ffffff" opacity="0.4"/>
    <circle cx="10" cy="10" r="7" fill="#ffffff" opacity="0.7"/>
    <circle cx="25" cy="0" r="16" fill="#ffffff" filter="url(#shadow)"/>
    
    <!-- Stylized Question Mark Inside Bubble -->
    <path d="M20 -6 C20 -12 30 -12 30 -6 C30 0 23 2 23 8" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="23" cy="13" r="2" fill="#0284c7"/>
  </g>
</svg>