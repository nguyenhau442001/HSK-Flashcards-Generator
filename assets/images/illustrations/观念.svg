<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glowing Amber Screen Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Lamp Light Cone -->
    <linearGradient id="lamp-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ROOM ENVIRONMENT & ARCHITECTURE -->
  <!-- Back Wall Accent / Wood Panel Line -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#090d16" stroke-width="4" />
  <rect x="0" y="160" width="240" height="80" fill="#0b1325" />

  <!-- Window Frame (Traditional / Modern Fusion representing 'Guannian' / Perspectives) -->
  <g opacity="0.8">
    <rect x="25" y="25" width="60" height="95" rx="4" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <rect x="31" y="31" width="48" height="83" fill="url(#window-light)" />
    <!-- Window Panes -->
    <line x1="55" y1="31" x2="55" y2="114" stroke="#334155" stroke-width="2" />
    <line x1="31" y1="72" x2="79" y2="72" stroke="#334155" stroke-width="2" />
    <!-- Window Light Projection on floor -->
    <polygon points="35,160 85,160 110,210 20,210" fill="#38bdf8" opacity="0.05" />
  </g>

  <!-- Hanging Scroll / Traditional Artwork (Symbolizing deep-rooted 'Values/Concepts') -->
  <g transform="translate(160, 20)">
    <!-- Scroll Rods -->
    <rect x="0" y="0" width="40" height="6" rx="3" fill="#94a3b8" />
    <rect x="0" y="74" width="40" height="6" rx="3" fill="#94a3b8" />
    <!-- Scroll Paper -->
    <rect x="4" y="5" width="32" height="70" fill="#f8fafc" />
    <!-- Abstract Traditional Landscape Brushwork inside scroll -->
    <path d="M10 50 Q 20 30, 30 55" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <circle cx="25" cy="25" r="4" fill="#ef4444" opacity="0.8" />
    <!-- Hanging String -->
    <line x1="20" y1="0" x2="20" y2="-10" stroke="#64748b" stroke-width="1.5" />
  </g>

  <!-- Bookshelf / Knowledge context on the right -->
  <g fill="#111827" opacity="0.6">
    <rect x="210" y="80" width="20" height="8" rx="2" />
    <rect x="215" y="95" width="15" height="8" rx="2" />
    <rect x="205" y="110" width="25" height="8" rx="2" />
  </g>

  <!-- MAIN DESK -->
  <rect x="20" y="150" width="200" height="12" rx="4" fill="#334155" filter="url(#shadow)" />
  <rect x="35" y="162" width="16" height="50" rx="3" fill="#1e293b" />
  <rect x="189" y="162" width="16" height="50" rx="3" fill="#1e293b" />

  <!-- DESK PROPS & NARRATIVE ELEMENTS (The Clash/Merge of Old & New 'Guannian') -->
  
  <!-- Stack of Traditional Books (Left) -->
  <g transform="translate(45, 125)">
    <!-- Bottom Book -->
    <path d="M0 15 L25 5 L55 15 L30 25 Z" fill="#b45309" />
    <path d="M55 15 L55 20 L30 30 L30 25 Z" fill="#78350f" />
    <path d="M0 15 L0 20 L30 30 L30 25 Z" fill="#92400e" />
    <!-- Top Book -->
    <path d="M5 5 L28 -2 L50 6 L27 13 Z" fill="#1e3a8a" />
    <path d="M50 6 L50 10 L27 17 L27 13 Z" fill="#172554" />
    <path d="M5 5 L5 9 L27 17 L27 13 Z" fill="#1e40af" />
    <!-- Bookmark ribbon hanging out -->
    <path d="M35 9 L42 12 L38 16 Z" fill="#ef4444" />
  </g>

  <!-- Traditional Ceramic Tea Cup with Steam -->
  <g transform="translate(42, 138)">
    <ellipse cx="12" cy="5" rx="8" ry="3" fill="#e2e8f0" />
    <path d="M4 5 C4 15, 20 15, 20 5" fill="#cbd5e1" />
    <ellipse cx="12" cy="5" rx="6" ry="2" fill="#78350f" /> <!-- Tea liquid -->
    <!-- Steam wiggles -->
    <path d="M9 -2 Q 12 -7, 9 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M15 -4 Q 12 -9, 15 -14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Modern Tablet / Holographic Idea Device (Center-Right) representing evolving mindset -->
  <g transform="translate(120, 100)" filter="url(#shadow)">
    <!-- Stand -->
    <path d="M18 45 L32 45 L40 55 L10 55 Z" fill="#475569" />
    <ellipse cx="25" cy="55" rx="20" ry="4" fill="#334155" />
    
    <!-- Tablet Body (Angled Perspective) -->
    <rect x="0" y="0" width="55" height="42" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    
    <!-- Screen Active Display (Glowing ideas / Mind map graphics) -->
    <rect x="4" y="4" width="47" height="34" rx="2" fill="#1e293b" />
    
    <!-- Abstract UI nodes connecting (Brainstorm / Perspective concept) -->
    <circle cx="15" cy="15" r="4" fill="#38bdf8" />
    <circle cx="38" cy="12" r="3" fill="#ec4899" />
    <circle cx="28" cy="28" r="5" fill="#fbbf24" />
    <line x1="15" y1="15" x2="28" y2="28" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="38" y1="12" x2="28" y2="28" stroke="#ec4899" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Desk Lamp (Casting warm directional light) -->
  <g transform="translate(160, 85)">
    <!-- Base -->
    <ellipse cx="0" cy="65" rx="14" ry="5" fill="#cbd5e1" />
    <!-- Articulated Arm -->
    <path d="M0 65 L-5 35 L15 15" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp Shade -->
    <path d="M5 8 L25 -8 L35 -2 L20 18 Z" fill="#38bdf8" />
    <ellipse cx="28" cy="-5" rx="6" ry="6" fill="#0284c7" />
    <!-- Bulb Glow Source -->
    <circle cx="22" cy="8" r="4" fill="#fef08a" filter="url(#glow)" />
  </g>

  <!-- Light Cone Overlay hitting the desk and objects -->
  <polygon points="175,98 190,152 70,152 130,98" fill="url(#lamp-cone)" style="mix-blend-mode: screen;" />

  <!-- Potted Desk Plant (Adds organic life and warmth) -->
  <g transform="translate(100, 125)" filter="url(#shadow)">
    <!-- Pot -->
    <path d="M5 25 L15 25 L18 38 L2 38 Z" fill="#f43f5e" />
    <ellipse cx="10" cy="25" rx="5" ry="2" fill="#fda4af" />
    <!-- Stems & Leaves (Succulent/Modern minimalist plant) -->
    <path d="M10 25 Q 5 15, 2 8" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <circle cx="2" cy="7" r="4" fill="#34d399" />
    
    <path d="M10 25 Q 12 12, 18 5" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <circle cx="18" cy="4" r="5" fill="#059669" />

    <path d="M10 25 Q 16 18, 22 15" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="23" cy="14" r="3.5" fill="#34d399" />
  </g>

  <!-- Floating Conceptual Sparkles / Thought Particles (Representing "Guannian" - ideas/mindsets floating and forming) -->
  <g filter="url(#glow)" opacity="0.8">
    <!-- Star 1 -->
    <path d="M 90 70 Q 90 75, 85 75 Q 90 75, 90 80 Q 90 75, 95 75 Q 90 75, 90 70" fill="#fbbf24" />
    <!-- Star 2 -->
    <path d="M 135 50 Q 135 54, 131 54 Q 135 54, 135 58 Q 135 54, 139 54 Q 135 54, 135 50" fill="#38bdf8" />
    <!-- Small Dot Sparkles -->
    <circle cx="110" cy="65" r="2" fill="#f472b6" />
    <circle cx="75" cy="90" r="1.5" fill="#fbbf24" />
    <circle cx="150" cy="75" r="2" fill="#34d399" />
  </g>

  <!-- Foreground Atmospheric Vignette / Frame Border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>