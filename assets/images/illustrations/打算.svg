<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window with Summer Sun -->
  <rect x="140" y="30" width="60" height="80" rx="8" fill="#334155"/>
  <circle cx="185" cy="55" r="12" fill="#fbbf24"/>
  <rect x="140" y="68" width="60" height="4" fill="#1e293b"/>
  <rect x="168" y="30" width="4" height="80" fill="#1e293b"/>
  
  <!-- Table and Map -->
  <path d="M20,180 L220,180 L230,210 L10,210 Z" fill="#475569"/>
  <rect x="60" y="170" width="100" height="40" rx="2" fill="#fef3c7" transform="rotate(-5 110 190)"/>
  <path d="M70,185 Q90,175 110,190 T150,180" fill="none" stroke="#94a3b8" stroke-width="1"/>
  
  <!-- Suitcase -->
  <rect x="170" y="185" width="45" height="35" rx="4" fill="#fb923c"/>
  <rect x="185" y="178" width="15" height="10" rx="2" fill="none" stroke="#fb923c" stroke-width="3"/>
  <rect x="178" y="195" width="2" height="15" fill="#ea580c"/>
  <rect x="205" y="195" width="2" height="15" fill="#ea580c"/>

  <!-- Character 1 (Asking/Pointing) -->
  <path d="M40,240 Q40,160 80,160 Q100,160 100,240" fill="#38bdf8"/>
  <circle cx="80" cy="140" r="18" fill="#ffdbac"/>
  <path d="M80,122 Q95,122 98,140" fill="#475569"/> <!-- Hair -->
  <path d="M100,185 L125,175" fill="none" stroke="#ffdbac" stroke-width="6" stroke-linecap="round"/> <!-- Arm pointing -->

  <!-- Character 2 (Thinking/Dreaming) -->
  <path d="M140,240 Q140,170 180,170 Q210,170 210,240" fill="#ec4899"/>
  <circle cx="175" cy="150" r="18" fill="#f1c27d"/>
  <path d="M175,132 Q155,132 158,155" fill="#2d2d2d"/> <!-- Hair -->
  <path d="M155,195 Q165,185 165,170" fill="none" stroke="#f1c27d" stroke-width="6" stroke-linecap="round"/> <!-- Hand to chin -->

  <!-- The "Plan" (Dream Bubble) -->
  <g filter="url(#glow)">
    <ellipse cx="120" cy="80" rx="55" ry="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <!-- Beach Scene inside bubble -->
    <path d="M85,100 Q120,85 155,100" fill="none" stroke="#0ea5e9" stroke-width="3"/> <!-- Waves -->
    <path d="M95,105 L95,75" fill="none" stroke="#92400e" stroke-width="3"/> <!-- Palm Trunk -->
    <path d="M95,75 Q80,70 75,80 M95,75 Q110,70 115,80 M95,75 Q95,60 105,65" fill="none" stroke="#10b981" stroke-width="2"/> <!-- Palm Leaves -->
    <circle cx="140" cy="65" r="8" fill="#f59e0b"/> <!-- Tropical Sun -->
  </g>
  
  <!-- Small thought bubbles -->
  <circle cx="155" cy="120" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="145" cy="130" r="2" fill="#38bdf8" opacity="0.4"/>
</svg>