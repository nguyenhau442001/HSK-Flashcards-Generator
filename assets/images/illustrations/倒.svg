<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Water Splash / Splatter Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient lighting / window reflection -->
  <path d="M 0 0 L 140 0 L 60 240 L 0 240 Z" fill="#ffffff" opacity="0.03" />

  <!-- Background Props: Bookshelf / Wall details -->
  <rect x="25" y="30" width="45" height="12" rx="3" fill="#475569" opacity="0.4" />
  <rect x="75" y="24" width="30" height="18" rx="3" fill="#fb923c" opacity="0.4" />
  <rect x="170" y="35" width="40" height="10" rx="2" fill="#38bdf8" opacity="0.3" />

  <!-- Wooden Table Surface -->
  <path d="M 0 170 L 240 170 L 240 230 C 240 235 235 240 230 240 L 10 240 C 5 240 0 235 0 230 Z" fill="url(#tableGrad)" />
  <rect x="0" y="165" width="240" height="6" rx="2" fill="#475569" />

  <!-- Laptop on the table (Context Prop) -->
  <g transform="translate(130, 140)">
    <!-- Laptop Base -->
    <path d="M -15 25 L 75 25 L 85 32 L -25 32 Z" fill="#64748b" />
    <path d="M -25 32 L 85 32 L 85 34 C 85 36 83 38 80 38 L -20 38 C -23 38 -25 36 -25 34 Z" fill="#475569" />
    <!-- Laptop Screen -->
    <path d="M -12 -5 L 72 -5 L 75 25 L -15 25 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <!-- Screen Glow -->
    <path d="M -8 0 L 68 0 L 67 20 L -7 20 Z" fill="#38bdf8" opacity="0.2" />
  </g>

  <!-- Splashing Water on Table & Laptop -->
  <!-- Puddle spreading -->
  <ellipse cx="105" cy="190" rx="45" ry="12" fill="#0ea5e9" opacity="0.4" filter="url(#shadow)" />
  <ellipse cx="100" cy="191" rx="35" ry="8" fill="#38bdf8" opacity="0.6" />

  <!-- Dynamic Splashes & Droplets (Action-packed) -->
  <path d="M 75 185 Q 85 160 100 165 Q 115 170 120 185 Z" fill="url(#waterGrad)" opacity="0.8" filter="url(#shadow)" />
  
  <circle cx="65" cy="175" r="5" fill="#38bdf8" />
  <circle cx="50" cy="182" r="3" fill="#38bdf8" />
  <circle cx="135" cy="178" r="4" fill="#38bdf8" />
  <circle cx="145" cy="165" r="2" fill="#38bdf8" />
  <circle cx="90" cy="155" r="6" fill="#38bdf8" />
  <circle cx="105" cy="140" r="3" fill="#38bdf8" />
  <circle cx="80" cy="145" r="2.5" fill="#38bdf8" />

  <!-- Action Motion Lines for the Spill -->
  <path d="M 60 130 C 50 140 45 155 55 170" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 70 125 C 62 135 58 145 65 160" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- The Upset/Flipped Cup (Đổ / Lật ngược) -->
  <g transform="translate(65, 135) rotate(-55)" filter="url(#shadow)">
    <!-- Cup Body (Mug) -->
    <path d="M -12 -22 L 12 -22 L 16 18 C 16 22 12 25 8 25 L -8 25 C -12 25 -16 22 -16 18 Z" fill="#f43f5e" />
    
    <!-- Cup Rim & Opening (Showing it's empty / spilling) -->
    <ellipse cx="0" cy="-22" rx="12" ry="4" fill="#fda4af" />
    <ellipse cx="0" cy="-22" rx="9" ry="2.5" fill="#0f172a" />

    <!-- Cup Handle -->
    <path d="M 12 -12 C 22 -12 22 4 12 8" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Mug Highlights -->
    <path d="M -10 -15 L -6 15" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Falling Water Stream from Cup -->
  <path d="M 52 112 Q 58 135 68 150 Q 72 155 78 165 L 70 170 Q 62 155 48 130 Z" fill="url(#waterGrad)" />

  <!-- Surprised Human Hand reacting to the accident -->
  <g transform="translate(15, 110)" filter="url(#shadow)">
    <!-- Arm / Sleeve -->
    <path d="M -20 60 L 25 40 L 40 60 L -5 85 Z" fill="#fbbf24" />
    
    <!-- Palm & Fingers (Action pose: reacting/stopping) -->
    <path d="M 25 40 C 30 35 45 30 52 38 C 58 45 52 55 42 55 C 48 50 48 42 40 43 C 35 44 28 42 25 40 Z" fill="#f87171" />
    <circle cx="45" cy="35" r="4" fill="#f87171" />
    <circle cx="52" cy="42" r="3.5" fill="#f87171" />
    <circle cx="48" cy="50" r="3" fill="#f87171" />
  </g>

  <!-- Sparkles / Accent details for vibrant pop-culture vector look -->
  <path d="M 190 80 L 193 88 L 201 91 L 193 94 L 190 102 L 187 94 L 179 91 L 187 88 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M 40 60 L 42 65 L 47 67 L 42 69 L 40 74 L 38 69 L 33 67 L 38 65 Z" fill="#38bdf8" opacity="0.8" />

</svg>