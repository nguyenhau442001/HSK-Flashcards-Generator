<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Warm Spotlight for the reveal concept ("Actually...") -->
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character & Object Gradients -->
    <linearGradient id="cat-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="lion-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="rug-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting / Spotlight -->
  <circle cx="120" cy="120" r="110" fill="url(#spotlight)"/>

  <!-- ROOM ENVIRONMENT (Context for "Actually...") -->
  <!-- Back Wall & Floor Line -->
  <line x1="20" y1="170" x2="220" y2="170" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bookshelf Background Prop (adds depth) -->
  <g opacity="0.3" fill="#475569">
    <rect x="35" y="90" width="40" height="80" rx="2"/>
    <rect x="40" y="110" width="30" height="6" rx="1"/>
    <rect x="40" y="130" width="30" height="6" rx="1"/>
    <rect x="40" y="150" width="30" height="6" rx="1"/>
    <!-- Tiny books -->
    <path d="M42 100h6v10h-6zM50 98h8v12h-8z"/>
  </g>

  <!-- Potted Plant Prop -->
  <g transform="translate(185, 115)">
    <path d="M5 45L12 55H-2L5 45Z" fill="#64748b"/>
    <path d="M5 45C5 30 15 25 20 15C15 20 10 15 5 10C0 15 -5 20 -10 15C-5 25 5 30 5 45Z" fill="#10b981"/>
    <path d="M5 45C-2 30 -12 25 -18 15C-12 20 -7 15 -2 10" stroke="#059669" stroke-width="2" fill="none"/>
  </g>

  <!-- Floor Rug -->
  <ellipse cx="120" cy="185" rx="75" ry="22" fill="url(#rug-grad)" filter="url(#soft-shadow)" opacity="0.8"/>
  <ellipse cx="120" cy="185" rx="65" ry="17" fill="#38bdf8" opacity="0.2"/>

  <!-- MAIN SUBJECT: The Cute Cat Casting a Fierce Lion Shadow ("Actually, I am fierce/brave") -->
  
  <!-- Dramatic Shadow on Wall & Floor -->
  <g filter="url(#soft-shadow)">
    <!-- Lion Mane Shadow Projection -->
    <path d="M120 75 C 150 75, 175 95, 165 130 C 160 145, 140 160, 120 165 C 100 160, 80 145, 75 130 C 65 95, 90 75, 120 75 Z" fill="url(#lion-shadow)" opacity="0.6"/>
    <!-- Lion Ears Shadow -->
    <path d="M90 78 L 75 55 L 100 70 Z" fill="#d97706" opacity="0.6"/>
    <path d="M150 78 L 165 55 L 140 70 Z" fill="#d97706" opacity="0.6"/>
  </g>

  <!-- Mirror / Light Source Behind Cat (Creating the projection) -->
  <circle cx="120" cy="115" r="42" fill="#fbbf24" opacity="0.15" filter="url(#glow)"/>

  <!-- The Actual Cat Character -->
  <g id="cute-cat" filter="url(#soft-shadow)">
    <!-- Cat Tail -->
    <path d="M90 170 C 70 170, 60 155, 65 140 C 67 135, 72 135, 75 140 C 73 150, 80 160, 92 158" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round"/>

    <!-- Cat Body (Sitting) -->
    <ellipse cx="120" cy="160" rx="25" ry="20" fill="url(#cat-body)"/>
    <ellipse cx="120" cy="155" rx="18" ry="15" fill="#94a3b8"/>

    <!-- Cat Paws -->
    <ellipse cx="110" cy="175" rx="5" ry="4" fill="#64748b"/>
    <ellipse cx="130" cy="175" rx="5" ry="4" fill="#64748b"/>

    <!-- Cat Head -->
    <circle cx="120" cy="125" r="22" fill="url(#cat-body)"/>

    <!-- Cat Ears -->
    <path d="M102 112 L 98 92 L 115 105 Z" fill="#475569"/>
    <path d="M103 110 L 100 96 L 112 104 Z" fill="#fca5a5" opacity="0.8"/>
    
    <path d="M138 112 L 142 92 L 125 105 Z" fill="#475569"/>
    <path d="M137 110 L 140 96 L 128 104 Z" fill="#fca5a5" opacity="0.8"/>

    <!-- Cat Face Features (Friendly, Innocent Expression) -->
    <!-- Eyes (Big and cute) -->
    <circle cx="112" cy="124" r="3" fill="#1e293b"/>
    <circle cx="128" cy="124" r="3" fill="#1e293b"/>
    <!-- Eye highlights -->
    <circle cx="111" cy="123" r="1" fill="#ffffff"/>
    <circle cx="127" cy="123" r="1" fill="#ffffff"/>
    
    <!-- Nose & Mouth -->
    <polygon points="120,130 117,127 123,127" fill="#fca5a5"/>
    <path d="M120 130 Q 117 135 115 133" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M120 130 Q 123 135 125 133" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="98" y1="130" x2="108" y2="132" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="97" y1="135" x2="107" y2="135" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="142" y1="130" x2="132" y2="132" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="143" y1="135" x2="133" y2="135" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Foreground Magic/Reveal Sparkles (Emphasizing the contrast/hidden reality) -->
  <g fill="#fbbf24">
    <path d="M75 90 L 77 95 L 82 97 L 77 99 L 75 104 L 73 99 L 68 97 L 73 95 Z" opacity="0.9" transform="scale(0.8) translate(20, 10)"/>
    <path d="M165 90 L 167 95 L 172 97 L 167 99 L 165 104 L 163 99 L 158 97 L 163 95 Z" opacity="0.9" transform="scale(0.7) translate(60, 20)"/>
    <circle cx="155" cy="85" r="2" opacity="0.8"/>
    <circle cx="85" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="120" cy="65" r="2.5" fill="#f59e0b" opacity="0.9"/>
  </g>

  <!-- Interactive/Action Accent Framing -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 12" opacity="0.4"/>
</svg>