<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#334155"/>
  <rect x="20" y="195" width="200" height="4" rx="2" fill="#475569"/>
  
  <!-- Banana Peel -->
  <path d="M80 200 C70 200 65 195 75 192 C85 189 95 195 90 200 Z" fill="#fbbf24"/>
  <path d="M85 198 L95 192" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Character - Falling Body -->
  <g transform="translate(120, 150) rotate(-20)">
    <!-- Legs -->
    <path d="M-10 0 L-20 30 M10 0 L20 30" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M-15 -20 L-35 -10 M15 -20 L35 -10" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="0" cy="-15" rx="15" ry="20" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="0" cy="-45" r="12" fill="#fde68a"/>
    <!-- Motion lines -->
    <path d="M-40 -30 L-55 -35 M40 -30 L55 -35" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="180" cy="60" r="3" fill="#fb923c"/>
  <circle cx="200" cy="80" r="2" fill="#10b981"/>
  <path d="M30 50 L45 50 M37.5 42.5 L37.5 57.5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
</svg>