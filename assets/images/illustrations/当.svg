<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>
  
  <!-- Warm glow from the window representing evening/8 PM -->
  <path d="M 60 55 L 140 55 L 140 135 L 60 135 Z" fill="#334155" rx="8"/>
  <path d="M 65 60 L 97 60 L 97 130 L 65 130 Z" fill="#f59e0b" opacity="0.2"/>
  <path d="M 103 60 L 135 60 L 135 130 L 103 130 Z" fill="#f59e0b" opacity="0.15"/>

  <!-- House Structure (Arrival Context) -->
  <!-- Roof -->
  <path d="M 45 75 L 100 35 L 155 75 Z" fill="#38bdf8"/>
  
  <!-- Walls -->
  <rect x="55" y="75" width="90" height="65" fill="#cbd5e1" rx="4"/>
  
  <!-- Door (Home entry) -->
  <rect x="88" y="95" width="24" height="45" rx="3" fill="#10b981"/>
  <circle cx="106" cy="118" r="1.5" fill="#fef08a"/>

  <!-- Warm Light spilling from door -->
  <path d="M 82 140 L 118 140 L 135 165 L 65 165 Z" fill="#f59e0b" opacity="0.4"/>

  <!-- Clock element floating above indicating "8 o'clock / Time" -->
  <g transform="translate(142, 50)">
    <!-- Clock background circle -->
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <!-- Clock hands pointing to 8:00 -->
    <line x1="0" y1="0" x2="-5" y2="-4" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#f59e0b" stroke-width="2" fill="#0f172a"/>
  </g>

  <!-- Ground -->
  <rect x="30" y="165" width="140" height="6" rx="3" fill="#64748b"/>
  
  <!-- Traveler / Arrival Marker (Path/Footsteps or luggage silhouette near door) -->
  <circle cx="75" cy="150" r="4" fill="#fb923c"/>
  <path d="M 72 158 Q 75 154 78 158" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>