<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Spotlight Cone Gradient -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Podium Front Gradient -->
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Glow Filter for Lights -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background & Environment -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Wall Decor / Audience silhouettes / Ambient light bars -->
  <g opacity="0.3">
    <!-- Vertical accent lights in background -->
    <rect x="40" y="20" width="4" height="80" rx="2" fill="#38bdf8"/>
    <rect x="196" y="20" width="4" height="80" rx="2" fill="#ec4899"/>
    
    <!-- Subtle audience row (bokeh/dots) -->
    <circle cx="70" cy="210" r="3" fill="#64748b"/>
    <circle cx="90" cy="215" r="2.5" fill="#64748b"/>
    <circle cx="110" cy="212" r="3" fill="#64748b"/>
    <circle cx="130" cy="215" r="2.5" fill="#64748b"/>
    <circle cx="150" cy="210" r="3" fill="#64748b"/>
    <circle cx="170" cy="213" r="2.5" fill="#64748b"/>
  </g>

  <!-- Spotlight Cone illuminating speaker -->
  <polygon points="120,0 60,220 180,220" fill="url(#spotlight)"/>

  <!-- Overhead Stage Light Fixture -->
  <path d="M 110,0 L 130,0 L 135,15 L 105,15 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="15" r="6" fill="#fbbf24" filter="url(#glow)"/>

  <!-- 2. Main Character (Speaker) -->
  <!-- Legs / Trousers -->
  <g id="character-legs">
    <rect x="106" y="170" width="10" height="40" rx="4" fill="#0f172a"/>
    <rect x="124" y="170" width="10" height="40" rx="4" fill="#0f172a"/>
    <!-- Shoes -->
    <path d="M 100,210 L 116,210 A 3,3 0 0,1 119,213 L 100,213 Z" fill="#334155"/>
    <path d="M 124,210 L 140,210 A 3,3 0 0,1 143,213 L 124,213 Z" fill="#334155"/>
  </g>

  <!-- Torso & Suit Jacket -->
  <g id="character-body">
    <!-- Jacket base -->
    <path d="M 98,110 L 142,110 L 146,172 L 94,172 Z" fill="#1e293b"/>
    <!-- Shirt inner v-neck -->
    <polygon points="120,110 112,128 128,128" fill="#f8fafc"/>
    <!-- Tie -->
    <polygon points="120,126 117,155 120,162 123,155" fill="#ec4899"/>
    <!-- Jacket lapels -->
    <path d="M 112,110 L 120,135 L 115,172" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 128,110 L 120,135 L 125,172" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Gesturing Arms & Hands -->
  <g id="character-arms">
    <!-- Left Arm (Holding podium/steady) -->
    <path d="M 98,115 L 82,145 L 90,150" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="89" cy="151" r="5" fill="#fbcfe8"/> <!-- Left hand -->

    <!-- Right Arm (Expressive speaker gesture, raised upward) -->
    <path d="M 142,115 C 155,120 162,135 158,150" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
    <!-- Right Hand expressing dynamic motion -->
    <circle cx="157" cy="148" r="6" fill="#fbcfe8"/>
    <!-- Motion lines from hand -->
    <path d="M 165,138 Q 172,135 178,132" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 168,148 Q 176,149 183,150" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Head & Face -->
  <g id="character-head">
    <!-- Neck -->
    <rect x="114" y="98" width="12" height="15" fill="#fbcfe8"/>
    <!-- Ears -->
    <circle cx="103" cy="90" r="4" fill="#fbcfe8"/>
    <circle cx="137" cy="90" r="4" fill="#fbcfe8"/>
    <!-- Face base -->
    <ellipse cx="120" cy="90" rx="15" ry="17" fill="#fbcfe8"/>
    <!-- Stylish Hair -->
    <path d="M 104,85 C 102,72 112,68 120,68 C 130,68 138,74 137,86 C 137,86 134,80 125,78 C 116,76 106,83 104,85 Z" fill="#0f172a"/>
    <!-- Facial expression: Enthusiastic open smile -->
    <circle cx="114" cy="87" r="1.5" fill="#0f172a"/> <!-- Left eye -->
    <circle cx="126" cy="87" r="1.5" fill="#0f172a"/> <!-- Right eye -->
    <!-- Eyebrows angled up dynamically -->
    <path d="M 111,83 Q 114,81 117,83" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 123,83 Q 126,81 129,83" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Open smiling mouth -->
    <path d="M 116,94 Q 120,100 124,94 Z" fill="#e11d48"/>
  </g>

  <!-- 3. Podium & Presentation Props -->
  <g id="podium-and-mic">
    <!-- Podium Stand Body -->
    <path d="M 102,150 L 138,150 L 144,215 L 96,215 Z" fill="url(#podiumGrad)" stroke="#475569" stroke-width="2"/>
    
    <!-- Podium Top Slanted Desk -->
    <path d="M 92,145 L 148,145 L 154,152 L 86,152 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Glowing Accent Strip on Podium (Modern Tech Presentation style) -->
    <rect x="108" y="170" width="24" height="4" rx="2" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Microphone Setup -->
    <!-- Gooseneck Stem -->
    <path d="M 120,145 C 120,130 112,125 112,115" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Mic Head -->
    <ellipse cx="112" cy="111" rx="4" ry="6" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

    <!-- Open Speech Notes on Podium -->
    <path d="M 98,146 L 118,142 L 138,146 L 136,150 L 100,150 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Mock text lines on notes -->
    <line x1="103" y1="146" x2="112" y2="145" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="120" y1="145" x2="133" y2="147" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 4. Visual Presentation Screen in Background -->
  <g id="presentation-screen" opacity="0.9">
    <!-- Big Screen Frame -->
    <rect x="65" y="32" width="110" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <!-- Screen Inner Display -->
    <rect x="71" y="38" width="98" height="53" rx="4" fill="#0f172a"/>
    
    <!-- Abstract Clean Vector Data Graphics inside screen (Charts/Graphs representing a professional presentation) -->
    <!-- Bar 1 -->
    <rect x="85" y="65" width="10" height="20" rx="2" fill="#38bdf8"/>
    <!-- Bar 2 -->
    <rect x="100" y="55" width="10" height="30" rx="2" fill="#10b981"/>
    <!-- Bar 3 -->
    <rect x="115" y="48" width="10" height="37" rx="2" fill="#fbbf24"/>
    <!-- Trend Line connecting data -->
    <path d="M 90,70 L 105,58 L 120,50 L 140,45" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="140" cy="45" r="3" fill="#ec4899"/>
  </g>

  <!-- Ambient glowing audio wave elements floating near speaker to emphasize "speech/yǎnjiǎng" -->
  <g id="sound-waves" opacity="0.7">
    <path d="M 160,95 Q 166,102 160,109" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 166,90 Q 175,102 166,114" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>