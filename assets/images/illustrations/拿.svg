<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with dark theme -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="240" height="240" fill="url(#bgGrad)"/>

    <!-- Environmental Context: Cozy Room Background -->
    <!-- Bookshelf in background -->
    <rect x="25" y="50" width="60" height="110" rx="4" fill="#334155" opacity="0.6"/>
    <rect x="30" y="70" width="50" height="8" fill="#475569" opacity="0.7"/>
    <rect x="30" y="100" width="50" height="8" fill="#475569" opacity="0.7"/>
    <!-- Books on shelf -->
    <path d="M35 70 L35 55 L42 55 L42 70 Z" fill="#ec4899" opacity="0.8"/>
    <path d="M45 70 L45 52 L53 52 L53 70 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M56 70 L60 56 L68 58 L64 70 Z" fill="#f59e0b" opacity="0.8"/>

    <!-- Window with night city view -->
    <rect x="155" y="45" width="60" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <line x1="185" y1="45" x2="185" y2="130" stroke="#475569" stroke-width="2"/>
    <line x1="155" y1="85" x2="215" y2="85" stroke="#475569" stroke-width="2"/>
    <!-- Window lights -->
    <rect x="165" y="55" width="12" height="18" fill="#facc15" opacity="0.6"/>
    <rect x="193" y="95" width="14" height="22" fill="#38bdf8" opacity="0.5"/>

    <!-- Warm desk lamp light cone -->
    <polygon points="120,20 80,180 160,180" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>
    <path d="M110 20 L130 20 L125 35 L115 35 Z" fill="#64748b"/>
    <path d="M120 15 L120 20" stroke="#64748b" stroke-width="3"/>

    <!-- Wooden Desk -->
    <rect x="15" y="165" width="210" height="50" rx="4" fill="#3b3b4f"/>
    <rect x="15" y="165" width="210" height="8" fill="#4f4f6b"/>

    <!-- Characters and Action (The core "拿" scenario) -->
    
    <!-- Character 1 (Receiver/Requester on the left, sitting) -->
    <g transform="translate(35, 110)">
      <!-- Body/Chair -->
      <path d="M25 60 L10 60 L10 25 C10 15 20 10 30 15 L35 18 Z" fill="#475569"/>
      <!-- Torso -->
      <path d="M15 30 C15 20 30 15 40 25 L45 55 L15 55 Z" fill="#10b981"/>
      <!-- Head -->
      <circle cx="30" cy="12" r="10" fill="#fbcfe8"/>
      <!-- Hair -->
      <path d="M20 10 C20 4 35 2 40 8 C35 5 25 5 20 10 Z" fill="#0f172a"/>
      <!-- Arm reaching out to take the book -->
      <path d="M35 30 Q50 35 62 42" stroke="#10b981" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Hand -->
      <circle cx="63" cy="43" r="4" fill="#fbcfe8"/>
    </g>

    <!-- Character 2 (Giver on the right, handing over the book) -->
    <g transform="translate(130, 95)">
      <!-- Torso -->
      <path d="M35 25 C45 15 60 20 60 30 L55 60 L25 60 Z" fill="#38bdf8"/>
      <!-- Head -->
      <circle cx="45" cy="12" r="10" fill="#fed7aa"/>
      <!-- Hair -->
      <path d="M35 10 C38 3 52 3 55 10 C50 6 40 6 35 10 Z" fill="#334155"/>
      <!-- Arm extending forward offering book -->
      <path d="M30 30 Q12 38 -2 40" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Hand holding book -->
      <circle cx="-3" cy="41" r="4" fill="#fed7aa"/>
    </g>

    <!-- The Book Being Handed Over (Central Focus of "拿") -->
    <g transform="translate(92, 122) rotate(-10)">
      <!-- Book cover -->
      <rect x="0" y="0" width="32" height="24" rx="2" fill="#ef4444"/>
      <rect x="3" y="2" width="26" height="20" rx="1" fill="#f87171"/>
      <!-- Pages thickness side -->
      <path d="M30 2 L32 4 L32 22 L30 20 Z" fill="#f1f5f9"/>
      <!-- Book spine/center detail -->
      <line x1="16" y1="0" x2="16" y2="24" stroke="#b91c1c" stroke-width="1.5"/>
      <!-- Decorative star on cover -->
      <path d="M8 8 L9.5 11 L13 11.5 L10.5 14 L11 17.5 L8 16 L5 17.5 L5.5 14 L3 11.5 L6.5 11 Z" fill="#fbbf24" transform="scale(0.5) translate(8, 4)"/>
    </g>

    <!-- Foreground details on desk -->
    <!-- Coffee mug -->
    <rect x="180" y="148" width="16" height="20" rx="3" fill="#cbd5e1"/>
    <path d="M196 154 C202 154 202 164 196 164" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <!-- Steam from mug -->
    <path d="M185 142 C185 138 189 136 187 132" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Secondary small plant pot -->
    <path d="M25 155 L35 155 L38 168 L22 168 Z" fill="#94a3b8"/>
    <circle cx="30" cy="150" r="8" fill="#10b981"/>
    <circle cx="24" cy="153" r="6" fill="#059669"/>
    <circle cx="36" cy="152" r="6" fill="#34d399"/>
  </g>
</svg>