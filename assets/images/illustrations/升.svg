<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm outdoor glow from bottom right (heat wave) -->
    <radialGradient id="heatGlow" cx="80%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Thermometer Mercury Gradient (Hot/Rising) -->
    <linearGradient id="mercuryGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#heatGlow)"/>

  <!-- ==================== ROOM ENVIRONMENT ==================== -->
  <!-- Wall / Interior backdrop -->
  <path d="M0 0 H240 V180 H0 Z" fill="#1e293b"/>
  <!-- Floor -->
  <path d="M0 180 H240 V240 H0 Z" fill="#0f172a"/>
  <!-- Baseboard line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="3"/>

  <!-- Window Frame in Background -->
  <g opacity="0.8">
    <rect x="25" y="35" width="65" height="110" rx="4" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <rect x="31" y="41" width="53" height="98" fill="url(#sunbeam)"/>
    <!-- Window pane dividers -->
    <line x1="57" y1="41" x2="57" y2="139" stroke="#475569" stroke-width="2"/>
    <line x1="31" y1="90" x2="84" y2="90" stroke="#475569" stroke-width="2"/>
    
    <!-- Plant on windowsill outside/inside -->
    <path d="M35 135 C35 125, 45 125, 45 135 Z" fill="#10b981"/>
    <circle cx="40" cy="120" r="8" fill="#34d399"/>
    <circle cx="33" cy="125" r="6" fill="#10b981"/>
    <circle cx="47" cy="125" r="6" fill="#059669"/>
  </g>

  <!-- Houseplant (Monstera/Foliage) representing warmth/summer indoors -->
  <g transform="translate(15, 140)">
    <path d="M15 40 C15 20, 25 10, 35 40 Z" fill="#334155"/>
    <path d="M25 40 V 10" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M25 15 C10 10, 0 25, 10 35 C18 40, 25 25, 25 15 Z" fill="#10b981" filter="url(#shadow)"/>
    <path d="M25 10 C35 -5, 50 5, 45 20 C40 30, 30 20, 25 10 Z" fill="#34d399" filter="url(#shadow)"/>
    <path d="M25 22 C35 30, 35 45, 20 40 C15 35, 20 25, 25 22 Z" fill="#059669"/>
  </g>

  <!-- Desk / Table Surface -->
  <rect x="95" y="165" width="130" height="15" fill="#334155" rx="3" filter="url(#shadow)"/>
  <rect x="105" y="180" width="10" height="25" fill="#1e293b"/>
  <rect x="205" y="180" width="10" height="25" fill="#1e293b"/>

  <!-- ==================== PROPS: THERMOMETER (RISING) ==================== -->
  <g transform="translate(180, 75)" filter="url(#shadow)">
    <!-- Thermometer backing / wall mount -->
    <rect x="-8" y="-15" width="16" height="110" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Glass tube -->
    <rect x="-3" y="-8" width="6" height="90" rx="3" fill="#cbd5e1"/>
    <!-- Rising Mercury Column -->
    <rect x="-3" y="15" width="6" height="60" rx="3" fill="url(#mercuryGrad)"/>
    <!-- Bulb at bottom -->
    <circle cx="0" cy="80" r="7" fill="#ef4444"/>
    <circle cx="-2" cy="78" r="2" fill="#fca5a5" opacity="0.8"/>

    <!-- Heat / Rising Arrow Indicators (Visualizing "Rising" / 升) -->
    <g transform="translate(18, 0)">
      <path d="M 0 25 L 6 15 L 12 25" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 6 15 L 6 35" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      
      <path d="M 0 -5 L 6 -15 L 12 -5" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 6 -15 L 6 5" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== MAIN CHARACTER & INTERACTION ==================== -->
  <g transform="translate(100, 95)">
    <!-- Character Body / Torso (Wearing a cool summer t-shirt) -->
    <path d="M 10 85 C 10 65, 30 55, 50 55 C 70 55, 90 65, 90 85 V 100 H 10 Z" fill="#38bdf8" filter="url(#shadow)"/>
    <path d="M 30 55 L 50 70 L 70 55" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="42" y="42" width="16" height="16" fill="#fbcfe8" rx="4"/>

    <!-- Head -->
    <circle cx="50" cy="32" r="20" fill="#fbcfe8" filter="url(#shadow)"/>

    <!-- Hair (Stylish brown tuft) -->
    <path d="M 32 30 C 30 15, 50 10, 65 20 C 70 24, 68 32, 68 32 C 68 32, 60 18, 45 20 C 38 21, 34 26, 32 30 Z" fill="#78350f"/>

    <!-- Sweating / Hot Expression (Warmth reaction) -->
    <!-- Eyebrows (slightly strained/warm) -->
    <path d="M 38 26 Q 43 23 48 26" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
    <path d="M 52 26 Q 57 23 62 26" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyes (Relaxed/Closed happy or warm squint) -->
    <path d="M 40 31 Q 44 35 48 31" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M 52 31 Q 56 35 60 31" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Cheeks (Warm flush) -->
    <circle cx="38" cy="37" r="4" fill="#f43f5e" opacity="0.4"/>
    <circle cx="62" cy="37" r="4" fill="#f43f5e" opacity="0.4"/>

    <!-- Open mouth (feeling the heat, sighing) -->
    <path d="M 46 39 Q 50 45 54 39" fill="#9f1239"/>

    <!-- Sweat Drop (Classic manga heat trope) -->
    <path d="M 68 25 C 68 25, 74 32, 74 36 C 74 40, 70 42, 68 42 C 66 42, 62 40, 62 36 C 62 32, 68 25, 68 25 Z" fill="#38bdf8" opacity="0.8" filter="url(#shadow)"/>

    <!-- Arms & Hand wiping sweat -->
    <!-- Right Arm holding handkerchief or wiping forehead -->
    <path d="M 75 70 C 85 55, 75 40, 65 35" fill="none" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round"/>
    <path d="M 75 70 C 85 55, 75 40, 65 35" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 30"/>
    
    <!-- Handkerchief -->
    <path d="M 60 30 L 70 33 L 65 40 Z" fill="#ffffff" filter="url(#shadow)"/>

    <!-- Left Arm resting on desk -->
    <path d="M 25 70 L 5 85" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="2" cy="88" r="5" fill="#fbcfe8"/>
  </g>

  <!-- ==================== DESK PROPS ==================== -->
  <!-- Glass of iced water (condensation showing heat contrast) -->
  <g transform="translate(120, 140)" filter="url(#shadow)">
    <!-- Glass Cup -->
    <path d="M 0 0 L 6 35 C 6 38, 14 38, 20 35 L 26 0 Z" fill="#e0f2fe" opacity="0.7" stroke="#bae6fd" stroke-width="1.5"/>
    <!-- Water inside -->
    <path d="M 2 8 L 7 32 C 7 34, 13 34, 19 32 L 24 8 Z" fill="#38bdf8" opacity="0.6"/>
    <!-- Ice cubes -->
    <rect x="7" y="10" width="7" height="7" rx="1" fill="#ffffff" opacity="0.9" transform="rotate(15 10.5 13.5)"/>
    <rect x="13" y="14" width="6" height="6" rx="1" fill="#ffffff" opacity="0.9" transform="rotate(-10 16 17)"/>
    <!-- Straw -->
    <path d="M 18 -10 L 13 15 L 11 32" fill="none" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <!-- Condensation droplets on glass -->
    <circle cx="4" cy="15" r="1.5" fill="#ffffff"/>
    <circle cx="22" cy="22" r="1" fill="#ffffff"/>
    <circle cx="8" cy="28" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Desk Fan (providing subtle relief from the rising temperature) -->
  <g transform="translate(45, 130)" filter="url(#shadow)">
    <!-- Fan Base -->
    <ellipse cx="20" cy="35" rx="14" ry="5" fill="#64748b"/>
    <rect x="18" y="20" width="4" height="15" fill="#64748b"/>
    <!-- Fan Motor Housing -->
    <circle cx="20" cy="15" r="7" fill="#475569"/>
    <!-- Fan Cage -->
    <circle cx="20" cy="15" r="20" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="20" cy="15" r="18" fill="#e2e8f0" opacity="0.15"/>
    <!-- Fan Blades (spinning motion implied) -->
    <path d="M 20 15 L 10 5" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 15 L 30 25" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 15 L 30 5" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 15 L 10 25" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Wind breeze lines -->
    <path d="M -5 10 C -10 10, -15 12, -20 10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M -2 20 C -8 20, -12 22, -18 20" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>