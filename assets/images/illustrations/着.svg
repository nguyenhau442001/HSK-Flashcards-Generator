<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M20 180 L220 180 L230 200 L10 200 Z" fill="#475569"/>
  
  <!-- The Character (Smiling and Talking) -->
  <!-- Body -->
  <path d="M80 140 C80 110 160 110 160 140 L150 240 L90 240 Z" fill="#fbbf24"/>
  
  <!-- Head -->
  <circle cx="120" cy="100" r="35" fill="#fde68a"/>
  
  <!-- Eyes -->
  <circle cx="105" cy="95" r="4" fill="#0f172a"/>
  <circle cx="135" cy="95" r="4" fill="#0f172a"/>
  
  <!-- Mouth (Smiling and Talking - Open) -->
  <path d="M105 115 C105 125, 135 125, 135 115 C135 122, 105 122, 105 115" fill="#ec4899"/>
  
  <!-- Speech Bubbles (Visualizing 'Talking') -->
  <circle cx="170" cy="70" r="15" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="50" r="10" fill="#38bdf8" opacity="0.4"/>
  <circle cx="205" cy="85" r="8" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Props on table -->
  <circle cx="50" cy="210" r="15" fill="#10b981"/>
  <rect x="180" y="200" width="30" height="20" rx="4" fill="#fb923c"/>
  
  <!-- Action Lines -->
  <path d="M140 80 Q150 70 160 80" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M145 90 Q155 80 165 90" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>