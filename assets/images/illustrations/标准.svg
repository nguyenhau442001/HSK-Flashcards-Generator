<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>
  
  <!-- Subtle background grid lines for precision/standard theme -->
  <line x1="40" y1="100" x2="160" y2="100" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <line x1="100" y1="40" x2="100" y2="160" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Center Target / Benchmark Origin -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="25" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" stroke-opacity="0.5"/>

  <!-- Main Visual Metaphor: Caliper / Alignment Ruler + Checkmark representing "Standard" -->
  <!-- Base Ruler / Bar -->
  <rect x="45" y="125" width="110" height="12" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  
  <!-- Sliding Scale Marks -->
  <line x1="65" y1="125" x2="65" y2="131" stroke="#38bdf8" stroke-width="2"/>
  <line x1="85" y1="125" x2="85" y2="133" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="100" y1="125" x2="100" y2="135" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="125" x2="115" y2="133" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="135" y1="125" x2="135" y2="131" stroke="#38bdf8" stroke-width="2"/>

  <!-- Precision Plumb Line / Gauge Arm -->
  <path d="M100 60 L100 125" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="60" r="7" fill="#f59e0b"/>

  <!-- Checkmark Emblem of Quality / Compliance (Emerald Accent) -->
  <circle cx="130" cy="70" r="22" fill="#10b981" stroke="#1e293b" stroke-width="4"/>
  <path d="M120 70 L126 76 L141 61" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Highlight Accent Node -->
  <circle cx="70" cy="75" r="5" fill="#38bdf8"/>
</svg>