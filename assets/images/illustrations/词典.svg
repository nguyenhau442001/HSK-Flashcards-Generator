<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1e293b"/>
  
  <!-- Bookstore Shelves (Background) -->
  <rect x="20" y="40" width="200" height="100" fill="#334155" rx="4"/>
  <rect x="25" y="50" width="40" height="80" fill="#78350f" rx="2"/>
  <rect x="75" y="50" width="40" height="80" fill="#92400e" rx="2"/>
  <rect x="125" y="50" width="40" height="80" fill="#b45309" rx="2"/>
  <rect x="175" y="50" width="40" height="80" fill="#78350f" rx="2"/>
  
  <!-- Warm Lighting Effects -->
  <circle cx="120" cy="20" r="80" fill="#fbbf24" fill-opacity="0.1"/>
  
  <!-- Student (Simplified Vector) -->
  <g transform="translate(60, 120)">
    <!-- Body -->
    <path d="M40 120 L20 120 L30 60 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="30" cy="50" r="15" fill="#fde68a"/>
    <!-- Hands holding book -->
    <rect x="15" y="65" width="30" height="40" rx="4" fill="#ef4444"/>
    <rect x="18" y="70" width="24" height="30" rx="2" fill="#991b1b"/>
    <!-- Book Detail (Thick) -->
    <rect x="20" y="75" width="20" height="25" rx="1" fill="#f8fafc" fill-opacity="0.2"/>
  </g>
  
  <!-- Floor -->
  <rect x="0" y="220" width="240" height="20" fill="#0f172a"/>
  
  <!-- Decorative Shelf Accents -->
  <line x1="20" y1="70" x2="220" y2="70" stroke="#1e293b" stroke-width="2"/>
  <line x1="20" y1="100" x2="220" y2="100" stroke="#1e293b" stroke-width="2"/>
</svg>