<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Office Glow -->
    <radialGradient id="deskGlow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Character 1 Gradients (Left) -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Character 2 Gradients (Right) -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="140" r="100" fill="url(#deskGlow)"/>

  <!-- Background Environment: Office Wall & Window -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="15" y="20" width="70" height="90" rx="4" fill="#0f172a" opacity="0.6"/>
    <rect x="20" y="25" width="28" height="80" rx="2" fill="url(#windowLight)"/>
    <rect x="52" y="25" width="28" height="80" rx="2" fill="url(#windowLight)"/>
    <line x1="50" y1="20" x2="50" y2="110" stroke="#1e293b" stroke-width="2"/>
    <line x1="15" y1="65" x2="85" y2="65" stroke="#1e293b" stroke-width="2"/>

    <!-- Bookshelf / Wall Props -->
    <rect x="165" y="30" width="60" height="8" rx="2" fill="#475569"/>
    <rect x="175" y="10" width="10" height="20" rx="1" fill="#10b981"/>
    <rect x="188" y="12" width="8" height="18" rx="1" fill="#fbbf24"/>
    <rect x="198" y="8" width="12" height="22" rx="1" fill="#38bdf8"/>

    <!-- Ambient Plant -->
    <path d="M 215,90 Q 220,70 205,55 Q 225,65 215,90 Z" fill="#10b981"/>
    <path d="M 210,90 Q 195,75 190,60 Q 205,75 210,90 Z" fill="#059669"/>
    <rect x="205" y="88" width="20" height="22" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- Office Desk Surface -->
  <path d="M 10,180 L 230,180 L 240,210 L 0,210 Z" fill="url(#deskTop)" filter="url(#softShadow)"/>
  <rect x="0" y="206" width="240" height="4" fill="#1e293b"/>

  <!-- Desk Props (Laptop, Coffee, Notes) -->
  <g id="desk-props">
    <!-- Laptop Base -->
    <path d="M 85,178 L 155,178 L 165,190 L 75,190 Z" fill="#94a3b8"/>
    <rect x="105" y="183" width="30" height="4" rx="2" fill="#64748b"/>
    <!-- Laptop Screen -->
    <path d="M 90,140 L 150,140 L 155,178 L 85,178 Z" fill="#334155"/>
    <rect x="94" y="144" width="52" height="30" rx="2" fill="#0ea5e9"/>
    <!-- Code/Graph UI on Screen -->
    <line x1="98" y1="150" x2="120" y2="150" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="98" y1="156" x2="135" y2="156" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="98" y1="162" x2="112" y2="162" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="130" cy="165" r="4" fill="#f43f5e"/>

    <!-- Coffee Mug -->
    <rect x="175" y="166" width="16" height="20" rx="3" fill="#f8fafc"/>
    <path d="M 191,170 C 196,170 196,178 191,180" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <path d="M 179,163 Q 183,158 181,153" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Sticky Note -->
    <rect x="45" y="165" width="22" height="22" rx="2" fill="#fef08a"/>
    <line x1="49" y1="172" x2="63" y2="172" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="49" y1="178" x2="58" y2="178" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 1: Left (Colleague A) -->
  <g id="colleague-left" filter="url(#softShadow)">
    <!-- Body / Torso -->
    <path d="M 45,170 Q 45,135 75,135 Q 105,135 105,170 Z" fill="url(#shirt1)"/>
    <path d="M 65,135 L 75,145 L 85,135 Z" fill="#f8fafc"/> <!-- Collar -->
    
    <!-- Neck -->
    <rect x="67" y="122" width="16" height="16" fill="#fbcfe8" rx="4"/>

    <!-- Head -->
    <circle cx="75" cy="105" r="18" fill="#fbcfe8"/>
    
    <!-- Hair (Dark, neat) -->
    <path d="M 57,105 C 57,90 70,85 75,85 C 80,85 93,90 93,105 C 93,110 90,105 88,98 C 83,92 67,92 62,98 C 60,105 57,110 57,105 Z" fill="#1e293b"/>

    <!-- Face & Expression (Engaged, smiling) -->
    <circle cx="70" cy="104" r="2" fill="#1e293b"/>
    <circle cx="80" cy="104" r="2" fill="#1e293b"/>
    <path d="M 73,112 Q 75,115 77,112" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="66" cy="108" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="84" cy="108" r="3" fill="#fda4af" opacity="0.6"/>

    <!-- Arms & Gestures (Pointing / Collaborating) -->
    <path d="M 50,140 Q 35,145 42,160" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Hand pointing toward center -->
    <path d="M 95,145 Q 115,150 120,155" stroke="#0284c7" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="121" cy="155" r="4" fill="#fbcfe8"/>
  </g>

  <!-- CHARACTER 2: Right (Colleague B - Collaborating closely) -->
  <g id="colleague-right" filter="url(#softShadow)">
    <!-- Body / Torso -->
    <path d="M 135,170 Q 135,135 165,135 Q 195,135 195,170 Z" fill="url(#shirt2)"/>
    <path d="M 155,135 L 165,145 L 175,135 Z" fill="#f8fafc"/> <!-- Collar -->

    <!-- Neck -->
    <rect x="157" y="122" width="16" height="16" fill="#fde047" rx="4" opacity="0.9"/> <!-- Warm tone variation -->
    <path d="M 157,125 Q 165,130 173,125" fill="#ca8a04" opacity="0.3"/>

    <!-- Head -->
    <circle cx="165" cy="105" r="18" fill="#ffedd5"/>
    
    <!-- Hair (Stylized ponytail/bun) -->
    <path d="M 148,105 C 148,90 160,85 165,85 C 175,85 182,90 182,105 C 182,112 185,115 190,118 C 185,120 178,110 175,105 Z" fill="#b45309"/>
    <circle cx="192" cy="116" r="5" fill="#b45309"/>

    <!-- Face & Expression (Excited/Talking) -->
    <circle cx="160" cy="104" r="2" fill="#1e293b"/>
    <circle cx="170" cy="104" r="2" fill="#1e293b"/>
    <!-- Open smiling mouth -->
    <path d="M 163,111 Q 165,116 167,111 Z" fill="#9f1239"/>
    <circle cx="156" cy="108" r="3" fill="#fecdd3" opacity="0.6"/>
    <circle cx="174" cy="108" r="3" fill="#fecdd3" opacity="0.6"/>

    <!-- Arms & Interaction -->
    <!-- Arm holding pen / gesturing -->
    <path d="M 180,145 Q 195,150 185,165" stroke="#be123c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="184" cy="167" r="4" fill="#ffedd5"/>
    
    <!-- Other arm resting on desk -->
    <path d="M 150,145 Q 130,150 120,165" stroke="#be123c" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Interactive Floating Elements (Teamwork / Synergy Sparkles) -->
  <g id="sparkles">
    <!-- Star 1 -->
    <path d="M 120,85 L 122,92 L 129,94 L 122,96 L 120,103 L 118,96 L 111,94 L 118,92 Z" fill="#fbbf24" filter="url(#softShadow)"/>
    <!-- Star 2 -->
    <path d="M 155,70 L 156,74 L 160,75 L 156,76 L 155,80 L 154,76 L 150,75 L 154,74 Z" fill="#38bdf8"/>
    <!-- Small Bubble -->
    <circle cx="95" cy="80" r="3" fill="#f43f5e" opacity="0.8"/>
    <circle cx="102" cy="72" r="5" fill="#38bdf8" opacity="0.6"/>
  </g>

</svg>