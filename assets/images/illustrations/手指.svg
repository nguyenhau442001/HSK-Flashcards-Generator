<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Warm Ambient Glow (Focus on hands/piano/desk area) -->
  <circle cx="120" cy="140" r="80" fill="#f59e0b" opacity="0.12" filter="blur(20px)"/>
  
  <!-- Environment / Background Details (Cozy Music/Study Room) -->
  <!-- Wallpaper subtle panel lines -->
  <line x1="40" y1="20" x2="40" y2="160" stroke="#1e293b" stroke-width="2"/>
  <line x1="200" y1="20" x2="200" y2="160" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Window with warm evening light -->
  <path d="M175,35 L215,35 L215,105 L175,105 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M182,42 L208,42 L208,98 L182,98 Z" fill="#38bdf8" opacity="0.15"/>
  <line x1="195" y1="42" x2="195" y2="98" stroke="#334155" stroke-width="1.5"/>
  <line x1="182" y1="70" x2="208" y2="70" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Bookshelf & Plant in Background -->
  <rect x="25" y="45" width="30" height="70" fill="#1e293b" rx="2"/>
  <line x1="25" y1="70" x2="55" y2="70" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="95" x2="55" y2="95" stroke="#334155" stroke-width="2"/>
  <!-- Books -->
  <path d="M30,55 L38,55 L38,70 L30,70 Z" fill="#ec4899" opacity="0.6"/>
  <path d="M40,52 L48,52 L48,70 L40,70 Z" fill="#38bdf8" opacity="0.6"/>
  
  <!-- Houseplant -->
  <path d="M40,120 Q40,110 45,105 Q50,110 50,120 Z" fill="#10b981"/>
  <ellipse cx="45" cy="120" rx="8" ry="4" fill="#64748b"/>

  <!-- Main Foreground Surface: Piano Keyboard / Desk -->
  <!-- Piano Wooden Body -->
  <rect x="15" y="160" width="210" height="50" fill="#1e293b" rx="4"/>
  <rect x="15" y="155" width="210" height="8" fill="#334155" rx="2"/>
  
  <!-- Piano Keys (White keys base) -->
  <rect x="25" y="163" width="190" height="35" fill="#f8fafc" rx="1"/>
  
  <!-- Black Keys Pattern -->
  <path d="
    M38,163 h6 v20 h-6 z
    M52,163 h6 v20 h-6 z
    M78,163 h6 v20 h-6 z
    M92,163 h6 v20 h-6 z
    M106,163 h6 v20 h-6 z
    M132,163 h6 v20 h-6 z
    M146,163 h6 v20 h-6 z
    M172,163 h6 v20 h-6 z
    M186,163 h6 v20 h-6 z
    M200,163 h6 v20 h-6 z
  " fill="#0f172a"/>
  
  <!-- Dividing lines for white keys -->
  <line x1="45" y1="163" x2="45" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="60" y1="163" x2="60" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="70" y1="163" x2="70" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="85" y1="163" x2="85" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="100" y1="163" x2="100" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="115" y1="163" x2="115" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="125" y1="163" x2="125" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="140" y1="163" x2="140" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="155" y1="163" x2="155" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="165" y1="163" x2="165" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="180" y1="163" x2="180" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>
  <line x1="195" y1="163" x2="195" y2="198" stroke="#cbd5e1" stroke-width="0.75"/>

  <!-- Character Shoulders / Upper Body (Musician / Pianist) -->
  <path d="M80,240 L70,195 Q100,185 120,185 Q140,185 170,195 L160,240 Z" fill="#3b82f6"/>
  <!-- Collar / Shirt Detail -->
  <path d="M105,185 L120,200 L135,185" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Character Neck and Head (Profile / 3/4 view focused on action) -->
  <path d="M110,140 L110,188 L130,188 L130,140 Z" fill="#fdba74"/>
  <circle cx="120" cy="115" r="22" fill="#fdba74"/>
  
  <!-- Hair Styling -->
  <path d="M98,110 Q100,92 120,93 Q140,92 142,110 Q145,125 138,130 Q120,120 102,130 Q96,120 98,110 Z" fill="#334155"/>

  <!-- FOCUS SUBJECT: Long Hands & Fingers Playing Piano (Explicitly emphasizing length & elegance) -->
  <!-- Right Arm & Hand making an expressive, stretched graceful gesture over keys -->
  <path d="M145,190 Q160,165 175,150" fill="none" stroke="#fdba74" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Palm and Long Fingers (Articulated for "很长" / Very Long) -->
  <!-- Palm base -->
  <ellipse cx="175" cy="148" rx="8" ry="10" fill="#fdba74" transform="rotate(-15, 175, 148)"/>
  
  <!-- Long Index Finger reaching key -->
  <path d="M178,142 Q195,135 205,162" fill="none" stroke="#fdba74" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Long Middle Finger extended gracefully -->
  <path d="M175,140 Q198,125 190,162" fill="none" stroke="#fdba74" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Long Ring Finger -->
  <path d="M172,142 Q190,128 178,162" fill="none" stroke="#fdba74" stroke-width="4.2" stroke-linecap="round"/>
  <!-- Pinky Finger -->
  <path d="M169,146 Q180,136 166,163" fill="none" stroke="#fdba74" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Thumb -->
  <path d="M182,152 Q175,165 160,165" fill="none" stroke="#fdba74" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left Arm & Hand (Balanced composition) -->
  <path d="M95,190 Q85,165 75,155" fill="none" stroke="#fdba74" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="73" cy="153" rx="7" ry="9" fill="#fdba74" transform="rotate(15, 73, 153)"/>
  <!-- Left Long Fingers -->
  <path d="M70,147 Q55,140 48,162" fill="none" stroke="#fdba74" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M73,145 Q52,132 58,162" fill="none" stroke="#fdba74" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M76,147 Q65,135 70,162" fill="none" stroke="#fdba74" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Musical Notes / Magic Sparkles floating gracefully to emphasize melody & dexterity -->
  <g fill="#fbbf24" opacity="0.9">
    <!-- Note 1 -->
    <circle cx="190" cy="115" r="3.5"/>
    <path d="M192,115 L192,100 L198,102 L198,104 L194,103 L194,115 Z"/>
    
    <!-- Note 2 -->
    <circle cx="155" cy="100" r="3"/>
    <path d="M157,100 L157,87 L163,89 L163,91 L159,90 L159,100 Z"/>
    
    <!-- Sparkles -->
    <path d="M210,130 L212,135 L217,137 L212,139 L210,144 L208,139 L203,137 L208,135 Z" fill="#f59e0b" opacity="0.7"/>
    <path d="M140,118 L141,121 L144,122 L141,123 L140,126 L139,123 L136,122 L139,121 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground Frame/Border Stroke for Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>