<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Passport/Travel Context -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#334155"/>
    <rect x="10" y="10" width="140" height="90" rx="4" fill="#f1f5f9"/>
    
    <!-- Character: Man looking at passport with wonder -->
    <g transform="translate(100, 40)">
      <circle cx="0" cy="0" r="25" fill="#fbbf24"/>
      <path d="M-10 -5 h5 M5 -5 h5 M-5 10 q5 5 10 0" stroke="#0f172a" stroke-width="2" fill="none"/>
      <path d="M-20 -20 l-10 -15 l20 -5 l10 15" fill="#38bdf8"/>
    </g>

    <!-- Passport details (abstract) -->
    <rect x="20" y="25" width="50" height="10" rx="2" fill="#cbd5e1"/>
    <rect x="20" y="40" width="30" height="10" rx="2" fill="#cbd5e1"/>
    <circle cx="45" cy="75" r="15" fill="#ec4899" opacity="0.6"/>
  </g>

  <!-- Background elements: Map/Globe hint -->
  <path d="M20 180 q50 -30 100 0 t100 0" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <circle cx="200" cy="190" r="15" fill="#fb923c"/>
  <circle cx="200" cy="190" r="8" fill="#0f172a"/>
  
  <!-- Suitcase -->
  <rect x="160" y="140" width="40" height="50" rx="4" fill="#fb923c"/>
  <rect x="170" y="130" width="20" height="10" rx="2" fill="#f59e0b"/>
</svg>