<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Clock Glow -->
    <radialGradient id="clock-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="sweater-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior Details -->
  <!-- Wallpaper accent lines -->
  <path d="M 0 140 L 240 140" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  
  <!-- Window Frame in Background showing night/evening -->
  <rect x="145" y="20" width="70" height="90" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <rect x="150" y="25" width="60" height="80" fill="url(#window-light)"/>
  <!-- Window pane dividers -->
  <line x1="180" y1="25" x2="180" y2="105" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="65" x2="210" y2="65" stroke="#334155" stroke-width="2"/>
  <!-- City silhouette outside window -->
  <path d="M 152 95 L 152 80 L 158 80 L 158 95 L 165 95 L 165 70 L 172 70 L 172 95 L 182 95 L 182 60 L 192 60 L 192 95 L 202 95 L 202 75 L 208 75 L 208 95 Z" fill="#1e293b" opacity="0.7"/>

  <!-- Bookshelf / Plants background props -->
  <rect x="20" y="35" width="45" height="10" rx="2" fill="#475569"/>
  <path d="M 28 35 L 28 22 C 28 20 30 18 32 18 L 36 18 C 38 18 40 20 40 22 L 40 35 Z" fill="#10b981"/>
  <circle cx="34" cy="15" r="8" fill="#059669"/>
  <circle cx="28" cy="18" r="6" fill="#10b981"/>
  <circle cx="40" cy="18" r="6" fill="#34d399"/>

  <!-- Books on shelf -->
  <rect x="48" y="20" width="6" height="15" rx="1" fill="#ec4899"/>
  <rect x="55" y="18" width="5" height="17" rx="1" fill="#f59e0b"/>

  <!-- Large Wall Clock (Central narrative anchor for "九点一刻" - 9:15) -->
  <g transform="translate(95, 22)">
    <!-- Clock Outer Glow -->
    <circle cx="25" cy="25" r="24" fill="url(#clock-glow)" />
    <!-- Clock Body -->
    <circle cx="25" cy="25" r="21" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="25" cy="25" r="18" fill="#1e293b" />
    
    <!-- Clock Markers (12, 3, 6, 9) -->
    <line x1="25" y1="9" x2="25" y2="11" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="41" y1="25" x2="39" y2="25" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="41" x2="25" y2="39" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="25" x2="11" y2="25" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Minute Hand pointing at 3 (15 minutes / 一刻) -->
    <line x1="25" y1="25" x2="36" y2="25" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Hour Hand pointing slightly past 9 (9 o'clock) -->
    <line x1="25" y1="25" x2="17" y2="21" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Center pin -->
    <circle cx="25" cy="25" r="2" fill="#fbbf24"/>
  </g>

  <!-- Wooden Desk Surface -->
  <rect x="15" y="165" width="210" height="12" rx="4" fill="url(#desk-grad)" stroke="#475569" stroke-width="1"/>
  <rect x="25" y="177" width="190" height="50" fill="#0f172a" opacity="0.3"/>

  <!-- Desk Props -->
  <!-- Mug with steam -->
  <path d="M 185 145 C 185 142 188 140 190 140 L 202 140 C 204 140 207 142 207 145 L 205 162 C 205 164 203 165 201 165 L 191 165 C 189 165 187 164 187 162 Z" fill="#f8fafc"/>
  <path d="M 207 147 C 212 147 213 155 207 157" stroke="#f8fafc" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Steam lines -->
  <path d="M 192 134 C 193 131 191 129 193 126" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 199 136 C 200 133 198 131 200 128" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Open Notebook / Planner on Desk -->
  <path d="M 50 148 L 95 138 L 115 153 L 70 163 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 95 138 L 140 148 L 120 163 L 70 163 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Notebook binding line -->
  <line x1="95" y1="138" x2="95" y2="163" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Writing lines inside notebook -->
  <line x1="105" y1="146" x2="125" y2="150" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <line x1="103" y1="152" x2="128" y2="157" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>

  <!-- Character: Young professional woman working late/evening studying -->
  <!-- Chair Back -->
  <path d="M 40 100 C 35 100 30 105 30 110 L 30 165 C 30 170 35 175 40 175 L 48 175 C 53 175 58 170 58 165 L 58 110 C 58 105 53 100 48 100 Z" fill="#334155"/>

  <!-- Character Body / Torso -->
  <path d="M 60 168 C 60 145 75 135 95 135 C 115 135 130 145 130 168 L 135 178 L 55 178 Z" fill="url(#sweater-grad)"/>

  <!-- Collar details -->
  <path d="M 80 135 C 80 142 110 142 110 135 C 100 143 90 143 80 135 Z" fill="#e0f2fe"/>

  <!-- Character Neck -->
  <rect x="90" y="120" width="12" height="20" rx="4" fill="#fcd34d" />

  <!-- Character Head -->
  <circle cx="96" cy="104" r="18" fill="#fcd34d"/>

  <!-- Hair Style (Stylish bun / bob with fringe) -->
  <!-- Back hair / bun -->
  <circle cx="106" cy="94" r="9" fill="#1e293b"/>
  <!-- Main Hair Shape -->
  <path d="M 78 104 C 78 90 88 85 98 85 C 108 85 116 92 116 104 C 116 108 114 112 114 112 L 80 112 C 80 112 78 108 78 104 Z" fill="#1e293b"/>
  <!-- Bangs -->
  <path d="M 80 98 C 85 105 95 105 102 98 C 108 103 114 100 114 100 C 112 92 105 88 96 88 C 86 88 81 92 80 98 Z" fill="#1e293b"/>

  <!-- Facial Expression (Focused, content, looking up at the clock) -->
  <!-- Eyes (Simple curved happy/focused lines) -->
  <path d="M 90 102 Q 94 106 98 102" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 102 102 Q 106 106 110 102" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Gentle Smile -->
  <path d="M 97 110 Q 100 113 103 110" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Cute Rosy Cheeks -->
  <circle cx="88" cy="108" r="3" fill="#f87171" opacity="0.4"/>
  <circle cx="112" cy="108" r="3" fill="#f87171" opacity="0.4"/>

  <!-- Arms / Hands interacting with notebook -->
  <!-- Left Arm -->
  <path d="M 62 150 C 65 140 75 138 82 145 L 85 155 C 80 162 65 162 62 150 Z" fill="#0284c7"/>
  <!-- Right Arm & Hand holding pen -->
  <path d="M 128 150 C 125 140 115 138 108 145 L 100 152 C 105 160 120 162 128 150 Z" fill="#0284c7"/>
  <!-- Hand -->
  <circle cx="102" cy="155" r="4" fill="#fcd34d"/>
  <!-- Pen -->
  <line x1="95" y1="162" x2="106" y2="152" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Warm ambient lighting cast from the desk lamp/clock glow -->
  <circle cx="120" cy="120" r="60" fill="#fbbf24" opacity="0.05" style="mix-blend-mode: screen;" />

</svg>