<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Road -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 195 L240 195" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Car -->
  <g transform="translate(20, 145)">
    <path d="M10 20 L70 20 L65 40 L15 40 Z" fill="#ec4899"/>
    <path d="M20 5 L55 5 L60 20 L15 20 Z" fill="#38bdf8"/>
    <circle cx="25" cy="40" r="8" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="55" cy="40" r="8" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <!-- Speed lines -->
    <path d="M-5 15 L-15 10 M-5 25 L-20 25" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Police Officer -->
  <g transform="translate(160, 130)">
    <rect x="10" y="20" width="20" height="50" rx="4" fill="#38bdf8"/>
    <circle cx="20" cy="15" r="12" fill="#fde68a"/>
    <rect x="12" y="5" width="16" height="10" fill="#1e293b"/>
    <!-- Hand holding ticket -->
    <rect x="30" y="35" width="25" height="15" rx="2" fill="#f1f5f9"/>
    <path d="M32 37 L53 37 M32 42 L53 42 M32 47 L45 47" stroke="#334155" stroke-width="1"/>
  </g>
  
  <!-- Speed Limit Sign -->
  <g transform="translate(180, 40)">
    <circle cx="20" cy="20" r="20" fill="#f8fafc"/>
    <circle cx="20" cy="20" r="16" fill="#ef4444"/>
    <circle cx="20" cy="20" r="12" fill="#f8fafc"/>
    <path d="M14 22 L20 14 L26 22" stroke="#0f172a" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Money/Fine Symbol -->
  <g transform="translate(120, 80)">
    <circle cx="0" cy="0" r="12" fill="#fbbf24"/>
    <path d="M-4 -4 L4 4 M-4 4 L4 -4" stroke="#78350f" stroke-width="3" transform="rotate(45)"/>
    <path d="M-2 -8 L2 -8 M-2 8 L2 8" stroke="#78350f" stroke-width="2"/>
  </g>
</svg>