<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window/City Glow -->
    <linearGradient id="city-glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Map Expansion Gradient -->
    <linearGradient id="map-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Light Cone Gradient -->
    <linearGradient id="light-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT & BACKGROUND DETAILS -->
  <!-- Office Wall / Window View -->
  <g id="environment">
    <!-- Large Window Frame -->
    <rect x="25" y="30" width="190" height="95" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Window Glass with City Skyline silhouettes -->
    <path d="M 27 123 L 27 60 L 45 60 L 45 123 L 70 123 L 70 45 L 95 45 L 95 123 L 130 123 L 130 75 L 155 75 L 155 123 L 195 123 L 195 50 L 213 50 L 213 123 Z" fill="#1e293b" opacity="0.8" />
    <!-- City lights glow -->
    <rect x="27" y="32" width="186" height="91" fill="url(#city-glow)" />

    <!-- Ceiling Lamp / Pendant Light -->
    <path d="M 120 0 L 120 20" stroke="#64748b" stroke-width="2" />
    <path d="M 105 20 L 135 20 L 140 30 L 100 30 Z" fill="#475569" />
    <path d="M 100 30 L 140 30 L 160 110 L 80 110 Z" fill="url(#light-cone)" />

    <!-- Wall Plant (Right) -->
    <path d="M 205 100 C 205 90 220 90 220 100 L 220 125 L 205 125 Z" fill="#475569" />
    <path d="M 212 100 Q 200 80 195 70" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 213 100 Q 225 75 230 65" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 212 100 Q 212 70 212 55" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- OFFICE DESK & PROPS -->
  <g id="desk-and-props">
    <!-- Desk Surface -->
    <path d="M 10 155 L 230 155 L 240 215 L 0 215 Z" fill="url(#desk-grad)" filter="url(#shadow)" />
    <!-- Desk Front Edge -->
    <rect x="0" y="212" width="240" height="6" fill="#0f172a" />

    <!-- Laptop showing expansion charts -->
    <g id="laptop" transform="translate(145, 125)">
      <!-- Laptop Base -->
      <path d="M -25 32 L 45 32 L 55 42 L -35 42 Z" fill="#64748b" />
      <path d="M -20 32 L 40 32 L 40 34 L -20 34 Z" fill="#94a3b8" />
      <!-- Laptop Screen Frame -->
      <path d="M -22 2 L 42 2 L 42 33 L -22 33 Z" fill="#334155" />
      <rect x="-19" y="5" width="58" height="25" fill="#0f172a" />
      <!-- Rising Bar Chart on Screen (Representing expansion) -->
      <rect x="-14" y="20" width="8" height="8" fill="#38bdf8" />
      <rect x="-3" y="15" width="8" height="13" fill="#fbbf24" />
      <rect x="8" y="9" width="8" height="19" fill="#10b981" />
      <path d="M -10 17 L -1 12 L 10 6" stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>

    <!-- Coffee Mug -->
    <rect x="195" y="150" width="16" height="20" rx="3" fill="#ec4899" />
    <path d="M 211 155 C 217 155 217 165 211 165" stroke="#ec4899" stroke-width="2" fill="none" />

    <!-- Expansion Map / Blueprint (The central prop for 'mở rộng') -->
    <g id="expansion-map" transform="translate(60, 140) rotate(-8)" filter="url(#shadow)">
      <!-- Unrolling Map Base -->
      <path d="M -20 15 L 80 -10 L 95 30 L -5 55 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
      <!-- Map Grid & Expansion Nodes -->
      <path d="M 10 5 L 45 -3" stroke="#eab308" stroke-width="1" stroke-dasharray="2,2" />
      <path d="M 25 25 L 60 17" stroke="#eab308" stroke-width="1" stroke-dasharray="2,2" />
      <!-- Pins/Nodes showing regional growth -->
      <circle cx="10" cy="5" r="3" fill="#ef4444" />
      <circle cx="45" cy="-3" r="4" fill="#10b981" />
      <circle cx="60" cy="17" r="4" fill="#38bdf8" />
      <!-- Expansion directional arrows printed on map -->
      <path d="M 15 10 L 35 -1" stroke="#f97316" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)" />
    </g>
  </g>

  <!-- MAIN CHARACTER PERFORMING 'MỞ RỘNG' (Expanding/Pulling apart) -->
  <g id="character" filter="url(#shadow)">
    <!-- Character Torso & Jacket -->
    <path d="M 105 130 L 135 130 L 142 185 L 98 185 Z" fill="#3b82f6" />
    <!-- Shirt Collar -->
    <path d="M 112 130 L 120 145 L 128 130 Z" fill="#ffffff" />
    <!-- Tie -->
    <polygon points="118,135 122,135 120,165" fill="#ef4444" />

    <!-- Head & Face -->
    <circle cx="120" cy="105" r="18" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 102 105 C 102 90 110 87 120 87 C 130 87 138 90 138 105 C 135 98 128 94 120 94 C 112 94 105 98 102 105 Z" fill="#1e293b" />
    <!-- Expressive Happy/Focused Eyes -->
    <circle cx="114" cy="103" r="2" fill="#1e293b" />
    <circle cx="126" cy="103" r="2" fill="#1e293b" />
    <!-- Confident Smile -->
    <path d="M 115 112 Q 120 117 125 112" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Left Arm & Hand (Reaching Left / Pushing outward) -->
    <path d="M 108 135 L 75 125 L 60 135" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="57" cy="137" r="5" fill="#fcd34d" /> <!-- Left Hand -->

    <!-- Right Arm & Hand (Reaching Right / Pulling outward) -->
    <path d="M 132 135 L 165 120 L 180 130" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="183" cy="132" r="5" fill="#fcd34d" /> <!-- Right Hand -->
  </g>

  <!-- DYNAMIC ACTION EFFECTS (Visualizing 'Mở Rộng' - Expansion/Growth Waves) -->
  <g id="action-effects">
    <!-- Expanding Arc Left -->
    <path d="M 45 105 C 30 120 30 145 45 160" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 35 115 C 22 128 22 142 35 152" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Expanding Arc Right -->
    <path d="M 195 105 C 210 120 210 145 195 160" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 205 115 C 218 128 218 142 205 152" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Outward Motion Arrows -->
    <path d="M 40 132 L 25 132 M 32 126 L 25 132 L 32 138" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 200 132 L 215 132 M 208 126 L 215 132 L 208 138" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Floating Sparkles / Success Indicators -->
    <g fill="#fbbf24">
      <path d="M 35 75 L 38 85 L 48 88 L 38 91 L 35 101 L 32 91 L 22 88 L 32 85 Z" transform="scale(0.6) translate(10, 20)" />
      <path d="M 195 75 L 198 85 L 208 88 L 198 91 L 195 101 L 192 91 L 182 88 L 192 85 Z" transform="scale(0.6) translate(130, 20)" fill="#38bdf8" />
      <path d="M 120 50 L 122 56 L 128 58 L 122 60 L 120 66 L 118 60 L 112 58 L 118 56 Z" fill="#10b981" />
    </g>
  </g>
</svg>