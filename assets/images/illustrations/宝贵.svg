<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Hourglass Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Gold Sand Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gem Gradient -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Ambient Light / Magic Dust Background -->
  <circle cx="120" cy="110" r="70" fill="#f59e0b" opacity="0.07" filter="url(#glow)"/>
  <circle cx="120" cy="110" r="40" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>

  <!-- Background Environment: Vintage Desk & Cogs -->
  <g opacity="0.25">
    <!-- Desk Surface -->
    <path d="M 20 200 L 220 200 L 240 225 L 0 225 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <line x1="20" y1="200" x2="220" y2="200" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
    
    <!-- Background Mechanical Cogs (Time theme) -->
    <path d="M 60 70 L 63 65 L 68 67 L 70 62 L 76 63 L 76 69 L 81 72 L 79 78 L 84 81 L 80 86 L 75 84 L 72 89 L 66 87 L 66 81 L 61 78 L 63 72 Z" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="71" cy="75" r="4" fill="none" stroke="#64748b" stroke-width="2"/>
    
    <path d="M 175 130 L 177 126 L 181 127 L 183 123 L 188 125 L 188 130 L 192 133 L 190 138 L 194 141 L 191 145 L 187 143 L 184 147 L 179 145 L 179 140 L 175 137 L 177 132 Z" fill="none" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Sparkles / Precious Gems floating -->
  <g>
    <!-- Left Sparkle -->
    <path d="M 50 110 Q 50 120 40 120 Q 50 120 50 130 Q 50 120 60 120 Q 50 120 50 110 Z" fill="#38bdf8" opacity="0.8"/>
    <circle cx="50" cy="120" r="2" fill="#ffffff"/>
    
    <!-- Right Sparkle -->
    <path d="M 190 85 Q 190 93 182 93 Q 190 93 190 101 Q 190 93 198 93 Q 190 93 190 85 Z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="190" cy="93" r="2" fill="#ffffff"/>

    <!-- Small Floating Diamonds -->
    <polygon points="75,145 79,150 75,155 71,150" fill="#f43f5e" opacity="0.7"/>
    <polygon points="165,70 168,74 165,78 162,74" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- MAIN SUBJECT: The Precious Hourglass (Time is Precious) -->
  <g transform="translate(0, 5)">
    <!-- Wooden/Gold Stand Base & Top -->
    <!-- Top Cap -->
    <path d="M 95 45 L 145 45 L 140 55 L 100 55 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="120" cy="45" rx="25" ry="4" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>

    <!-- Bottom Cap -->
    <ellipse cx="120" cy="185" rx="28" ry="5" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 92 185 L 148 185 L 142 195 L 98 195 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>

    <!-- Four Corner Brass Pillars -->
    <rect x="94" y="53" width="5" height="133" rx="2" fill="#d97706" stroke="#b45309" stroke-width="1"/>
    <rect x="141" y="53" width="5" height="133" rx="2" fill="#d97706" stroke="#b45309" stroke-width="1"/>
    <!-- Highlight on pillars -->
    <line x1="96" y1="55" x2="96" y2="183" stroke="#fef08a" stroke-width="1" opacity="0.6"/>
    <line x1="143" y1="55" x2="143" y2="183" stroke="#fef08a" stroke-width="1" opacity="0.6"/>

    <!-- Glass Bulb Shape -->
    <!-- Top Glass -->
    <path d="M 100 55 C 100 55 102 110 120 120 C 138 110 140 55 140 55 Z" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Bottom Glass -->
    <path d="M 100 185 C 100 185 102 130 120 120 C 138 130 140 185 140 185 Z" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Glass Glare Effects -->
    <path d="M 105 60 C 105 60 108 100 115 113" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 105 180 C 105 180 108 140 115 127" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Sand Inside -->
    <!-- Top Sand Pile (decreasing) -->
    <path d="M 105 95 C 112 105 128 105 135 95 C 138 105 138 115 120 120 C 102 115 102 105 105 95 Z" fill="url(#goldGrad)"/>
    <ellipse cx="120" cy="95" rx="15" ry="4" fill="#fef08a"/>

    <!-- Falling Sand Stream -->
    <line x1="120" y1="120" x2="120" y2="160" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="120" y1="120" x2="120" y2="160" stroke="#fef08a" stroke-width="1" stroke-linecap="round"/>

    <!-- Bottom Sand Pile (accumulating into a glowing treasure jewel!) -->
    <path d="M 105 180 C 110 170 130 170 135 180 Z" fill="url(#goldGrad)"/>
    <ellipse cx="120" cy="180" rx="15" ry="3" fill="#fef08a"/>

    <!-- Glowing Diamond/Gem emerging from the sand (representing "Precious") -->
    <g transform="translate(120, 163)">
      <!-- Gem Glow -->
      <circle cx="0" cy="0" r="14" fill="#f43f5e" opacity="0.4" filter="url(#glow)"/>
      <!-- Gem Body -->
      <polygon points="0,-12 10,-4 6,10 -6,10 -10,-4" fill="url(#gemGrad)" stroke="#ffe4e6" stroke-width="1"/>
      <!-- Gem Facets / Highlights -->
      <polygon points="0,-12 10,-4 0,2" fill="#fb7185" opacity="0.8"/>
      <polygon points="0,-12 0,2 -10,-4" fill="#e11d48" opacity="0.9"/>
      <line x1="0" y1="-12" x2="0" y2="10" stroke="#ffe4e6" stroke-width="0.75" opacity="0.7"/>
      <polygon points="0,2 6,10 -6,10" fill="#9f1239" opacity="0.9"/>
      <!-- Sparkle on Gem -->
      <circle cx="-3" cy="-3" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Center Neck Ring (Connecting the two bulbs) -->
    <rect x="117" y="118" width="6" height="4" rx="1" fill="#b45309" stroke="#78350f" stroke-width="1"/>
  </g>

  <!-- Foreground Atmospheric Elements (Leaves / Accents framing the scene) -->
  <g opacity="0.9">
    <!-- Left Leaf / Plant -->
    <path d="M 0 240 Q 20 200 15 170 Q 30 190 40 240 Z" fill="#059669" stroke="#047857" stroke-width="1.5"/>
    <path d="M 15 170 Q 5 200 0 215" fill="none" stroke="#34d399" stroke-width="1" opacity="0.6"/>

    <!-- Right Leaf / Plant -->
    <path d="M 240 230 Q 210 190 220 160 Q 200 185 190 240 Z" fill="#047857" stroke="#065f46" stroke-width="1.5"/>
    <path d="M 220 160 Q 230 195 240 210" fill="none" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Golden Magic Dust Particles floating around -->
  <circle cx="90" cy="80" r="2" fill="#fef08a" opacity="0.8" filter="url(#glow)"/>
  <circle cx="155" cy="110" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="100" cy="150" r="2.5" fill="#fef08a" opacity="0.7" filter="url(#glow)"/>
  <circle cx="140" cy="70" r="1" fill="#ffffff" opacity="0.9"/>
  <circle cx="130" cy="200" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="85" cy="120" r="1.5" fill="#fef08a" opacity="0.6"/>
</svg>