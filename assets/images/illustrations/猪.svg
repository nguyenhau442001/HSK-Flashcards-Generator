<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Farm Environment / Background -->
  <!-- Sky glow -->
  <circle cx="180" cy="70" r="40" fill="#f59e0b" opacity="0.15" filter="blur(10px)"/>
  
  <!-- Rolling Hills / Fields -->
  <path d="M0 130 Q60 110 120 130 T240 120 L240 240 L0 240 Z" fill="#065f46" opacity="0.4"/>
  <path d="M0 150 Q80 135 160 155 T240 145 L240 240 L0 240 Z" fill="#047857" opacity="0.6"/>

  <!-- Farm Barn Structure -->
  <path d="M140 80 L190 55 L240 80 L240 160 L140 160 Z" fill="#334155" opacity="0.8"/>
  <polygon points="140,80 190,55 240,80 190,70" fill="#ef4444" opacity="0.9"/>
  <!-- Barn Door & Windows -->
  <rect x="175" y="110" width="30" height="50" rx="4" fill="#0f172a"/>
  <circle cx="190" cy="75" r="8" fill="#fbbf24" opacity="0.8"/>

  <!-- Wooden Fence Foreground -->
  <!-- Posts -->
  <rect x="20" y="125" width="8" height="60" rx="2" fill="#b45309"/>
  <rect x="70" y="125" width="8" height="60" rx="2" fill="#b45309"/>
  <rect x="120" y="125" width="8" height="60" rx="2" fill="#b45309"/>
  <!-- Rails -->
  <rect x="0" y="138" width="135" height="6" rx="2" fill="#d97706"/>
  <rect x="0" y="165" width="135" height="6" rx="2" fill="#d97706"/>

  <!-- Hay bale -->
  <g transform="translate(15, 175)">
    <rect x="0" y="0" width="35" height="25" rx="8" fill="#fbbf24"/>
    <ellipse cx="17.5" cy="12.5" rx="15" ry="10" fill="#f59e0b" opacity="0.6"/>
    <path d="M10 5 Q17.5 15 25 5" stroke="#b45309" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- PIG 1 (Left - happy sitting pig) -->
  <g transform="translate(35, 145)">
    <!-- Body -->
    <ellipse cx="25" cy="25" rx="20" ry="16" fill="#f472b6"/>
    <!-- Head -->
    <circle cx="12" cy="18" r="14" fill="#f472b6"/>
    <!-- Ears -->
    <polygon points="2,10 8,4 12,12" fill="#db2777"/>
    <polygon points="15,6 22,2 20,12" fill="#db2777"/>
    <!-- Snout -->
    <ellipse cx="5" cy="20" rx="5" ry="3.5" fill="#fb7185"/>
    <circle cx="3.5" cy="19.5" r="0.8" fill="#881337"/>
    <circle cx="6.5" cy="19.5" r="0.8" fill="#881337"/>
    <!-- Eyes -->
    <circle cx="9" cy="14" r="1.5" fill="#1e293b"/>
    <!-- Legs -->
    <rect x="12" y="35" width="5" height="8" rx="2" fill="#db2777"/>
    <rect x="30" y="35" width="5" height="8" rx="2" fill="#db2777"/>
    <!-- Curly tail -->
    <path d="M44 22 Q48 18 46 25 Q44 28 47 26" stroke="#db2777" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- PIG 2 (Center - standing playful pig) -->
  <g transform="translate(85, 135)">
    <!-- Body -->
    <ellipse cx="22" cy="24" rx="22" ry="17" fill="#fb7185"/>
    <!-- Head -->
    <circle cx="34" cy="18" r="13" fill="#fb7185"/>
    <!-- Ears -->
    <polygon points="32,8 38,2 42,10" fill="#f43f5e"/>
    <polygon points="26,10 29,3 34,11" fill="#f43f5e"/>
    <!-- Snout -->
    <circle cx="43" cy="20" r="5" fill="#f43f5e"/>
    <circle cx="41.5" cy="19.5" r="0.8" fill="#881337"/>
    <circle cx="44.5" cy="19.5" r="0.8" fill="#881337"/>
    <!-- Eyes -->
    <circle cx="35" cy="14" r="1.5" fill="#1e293b"/>
    <!-- Legs -->
    <rect x="10" y="35" width="5" height="10" rx="2" fill="#e11d48"/>
    <rect x="28" y="35" width="5" height="10" rx="2" fill="#e11d48"/>
    <!-- Curly tail -->
    <path d="M0 20 Q-5 16 -3 23 Q-5 25 -2 24" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- PIG 3 (Peeking from behind fence right) -->
  <g transform="translate(130, 150)">
    <!-- Body -->
    <ellipse cx="20" cy="20" rx="16" ry="13" fill="#f472b6"/>
    <!-- Head -->
    <circle cx="12" cy="14" r="12" fill="#f472b6"/>
    <!-- Snout -->
    <ellipse cx="5" cy="16" rx="4" ry="3" fill="#fb7185"/>
    <circle cx="4" cy="15.5" r="0.6" fill="#881337"/>
    <circle cx="6" cy="15.5" r="0.6" fill="#881337"/>
    <!-- Eyes -->
    <circle cx="9" cy="11" r="1.2" fill="#1e293b"/>
    <!-- Ear -->
    <polygon points="12,4 18,1 15,9" fill="#db2777"/>
  </g>

  <!-- Foreground details: Grass tufts & Flowers -->
  <path d="M15 200 L15 190 M12 198 L15 190 L18 198" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M110 210 L110 198 M106 208 L110 198 L114 208" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M210 195 L210 185 M207 193 L210 185 L213 193" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Tiny cute flowers -->
  <circle cx="100" cy="205" r="3" fill="#f43f5e"/>
  <circle cx="100" cy="205" r="1" fill="#fef08a"/>
  
  <circle cx="200" cy="190" r="3" fill="#38bdf8"/>
  <circle cx="200" cy="190" r="1" fill="#fef08a"/>

  <!-- Overhead lighting / ambiance dots -->
  <circle cx="60" cy="40" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="100" cy="60" r="1" fill="#fef08a" opacity="0.4"/>
  <circle cx="30" cy="80" r="2" fill="#fef08a" opacity="0.5"/>
</svg>