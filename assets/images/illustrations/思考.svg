<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for 'Thinking' / 'Idea' -->
    <radialGradient id="think-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Lamp Cone Gradient -->
    <linearGradient id="lamp-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior Details -->
  <!-- Bookshelf background left -->
  <g opacity="0.35">
    <rect x="20" y="50" width="35" height="110" rx="3" fill="#334155" />
    <rect x="23" y="70" width="29" height="4" fill="#64748b" />
    <rect x="23" y="100" width="29" height="4" fill="#64748b" />
    <rect x="23" y="135" width="29" height="4" fill="#64748b" />
    <!-- Books on shelf -->
    <path d="M26 68 L26 55 L31 55 L31 68 Z" fill="#38bdf8" />
    <path d="M33 68 L33 58 L38 58 L38 68 Z" fill="#ec4899" />
    <path d="M26 98 L26 78 L30 78 L30 98 Z" fill="#10b981" />
    <path d="M32 98 L32 82 L37 82 L37 98 Z" fill="#fb923c" />
  </g>

  <!-- Window in background right -->
  <g>
    <rect x="170" y="45" width="45" height="65" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <polygon points="170,45 215,45 215,110 170,110" fill="url(#window-light)" />
    <!-- Window pane crosses -->
    <line x1="192" y1="45" x2="192" y2="110" stroke="#334155" stroke-width="2" />
    <line x1="170" y1="77" x2="215" y2="77" stroke="#334155" stroke-width="2" />
    <!-- Outside subtle moon/stars -->
    <circle cx="185" cy="60" r="2" fill="#cbd5e1" opacity="0.6" />
    <circle cx="203" cy="95" r="1.5" fill="#cbd5e1" opacity="0.4" />
  </g>

  <!-- Desk Surface -->
  <rect x="30" y="165" width="180" height="12" rx="3" fill="#475569" />
  <rect x="40" y="177" width="160" height="45" fill="#334155" />

  <!-- Desk Lamp (Left) -->
  <g>
    <path d="M55 165 L65 165 L68 125 L52 125 Z" fill="#64748b" />
    <path d="M45 125 C45 110, 75 110, 75 125 Z" fill="#cbd5e1" />
    <!-- Lamp light projection -->
    <polygon points="40,125 80,125 110,177 20,177" fill="url(#lamp-cone)" />
  </g>

  <!-- Problem Document / Blueprint with Question Mark representation on Desk -->
  <g transform="translate(130, 150)">
    <!-- Paper sheet -->
    <polygon points="0,15 45,5 50,35 5,45" fill="#f8fafc" />
    <!-- Lines on paper -->
    <line x1="10" y1="20" x2="35" y2="15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="27" x2="30" y2="23" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="34" x2="25" y2="31" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Highlight red circle marking the "problem" -->
    <circle cx="28" cy="23" r="8" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.85" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(185, 150)">
    <rect x="0" y="5" width="14" height="17" rx="2" fill="#e2e8f0" />
    <path d="M14 8 C18 8, 18 17, 14 17" fill="none" stroke="#e2e8f0" stroke-width="2" />
    <path d="M3 5 Q7 2 11 5" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- Thought Process Glow behind Character's head -->
  <circle cx="120" cy="85" r="55" fill="url(#think-glow)" />

  <!-- Abstract Floating Thinking Elements (Sparkles & Gears/Dots) -->
  <g opacity="0.75">
    <!-- Glowing bulb/thought nodes -->
    <circle cx="95" cy="55" r="4" fill="#fbbf24" />
    <circle cx="145" cy="50" r="3" fill="#38bdf8" />
    <circle cx="158" cy="72" r="2.5" fill="#fb923c" />
    
    <!-- Delicate thought connection lines -->
    <path d="M105 75 Q100 60 95 55" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
    <path d="M135 70 Q140 55 145 50" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
  </g>

  <!-- Main Character (Deep in Thought) -->
  <g transform="translate(75, 75)">
    <!-- Body / Torso & Hoodie -->
    <path d="M 25 100 C 25 80, 75 80, 75 100 L 90 125 L 10 125 Z" fill="#0284c7" />
    <!-- Hoodie collar/strings -->
    <path d="M 40 85 Q 50 95 60 85" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
    <circle cx="45" cy="98" r="2" fill="#f8fafc" />
    <circle cx="55" cy="98" r="2" fill="#f8fafc" />

    <!-- Neck -->
    <rect x="42" y="70" width="16" height="15" fill="#fbcfe8" />

    <!-- Head & Face profile/3-quarter view -->
    <circle cx="50" cy="50" r="24" fill="#fbcfe8" />

    <!-- Hair (Stylized modern neat cut) -->
    <path d="M 28 45 C 28 25, 72 25, 72 45 C 72 55, 68 55, 65 45 C 60 30, 40 30, 32 45 Z" fill="#334155" />
    <path d="M 27 42 C 28 52, 32 58, 35 55 C 33 50, 30 45, 27 42 Z" fill="#334155" />

    <!-- Facial expression: Contemplative, focused, eyes looking slightly up/forward -->
    <!-- Eyebrow (furrowed slightly in deep thought) -->
    <path d="M 38 43 Q 46 39 54 44" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Eye (Open, calm, reflective) -->
    <circle cx="48" cy="48" r="3.5" fill="#1e293b" />
    <circle cx="49.5" cy="47" r="1.2" fill="#ffffff" /> <!-- Catchlight -->

    <!-- Nose (Minimalist bump) -->
    <path d="M 57 48 Q 61 51 57 54" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" opacity="0.3" />

    <!-- Mouth (Closed, thoughtful, slight pursed look) -->
    <path d="M 49 60 Q 53 62 57 60" fill="none" stroke="#9f1239" stroke-width="2" stroke-linecap="round" />

    <!-- Hand on Chin Pose (Classic 'Thinking' gesture) -->
    <!-- Upper arm & Forearm leaning on desk -->
    <path d="M 68 95 C 68 80, 85 70, 75 58" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Hand supporting chin -->
    <circle cx="55" cy="58" r="8" fill="#fbcfe8" />
    <!-- Fingers curled under chin -->
    <path d="M 49 60 C 53 64, 58 64, 62 58" fill="#fbcfe8" />
    <circle cx="54" cy="62" r="3.5" fill="#fbcfe8" />
  </g>

</svg>