<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Environmental Details: Wall & Interior Elements -->
  <!-- Subtle window grid on the back wall -->
  <rect x="25" y="30" width="50" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="50" y1="30" x2="50" y2="100" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="65" x2="75" y2="65" stroke="#334155" stroke-width="1.5"/>

  <!-- Wall Plant / Cozy background elements -->
  <path d="M210,50 Q215,35 225,40 Q235,45 220,65 Z" fill="#10b981" opacity="0.6"/>
  <path d="M195,55 Q190,40 200,35 Q210,30 205,50 Z" fill="#059669" opacity="0.7"/>
  <path d="M190,65 L230,65" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Spotlight cone shining down on the desk/character -->
  <polygon points="120,0 40,200 200,200" fill="url(#spotlight)"/>

  <!-- Back bookshelf/props -->
  <rect x="150" y="45" width="50" height="6" rx="2" fill="#334155"/>
  <rect x="158" y="25" width="12" height="20" rx="2" fill="#f43f5e"/>
  <rect x="172" y="28" width="10" height="17" rx="2" fill="#38bdf8"/>
  <rect x="184" y="22" width="14" height="23" rx="2" fill="#fbbf24"/>

  <!-- Desk Surface -->
  <path d="M20,180 L220,180 L210,210 L30,210 Z" fill="url(#deskGrad)"/>
  <path d="M20,180 L220,180" stroke="#475569" stroke-width="2"/>

  <!-- Props on Desk -->
  <!-- Laptop -->
  <path d="M65,160 L115,160 L125,182 L55,182 Z" fill="#64748b"/>
  <rect x="70" y="125" width="45" height="37" rx="3" fill="#cbd5e1"/>
  <rect x="73" y="128" width="39" height="28" rx="1" fill="#0f172a"/>
  <!-- Graphs on laptop screen showing presentation/interview prep -->
  <polyline points="78,148 85,142 93,145 102,133" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="102" cy="133" r="2" fill="#38bdf8"/>

  <!-- Coffee Mug with steam -->
  <rect x="145" y="160" width="16" height="20" rx="3" fill="#f8fafc"/>
  <path d="M161,166 C167,166 167,176 161,176" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <path d="M149,153 Q151,147 148,142" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M156,151 Q158,146 155,140" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Important Papers / Documents scattered -->
  <polygon points="175,170 205,162 210,182 180,188" fill="url(#paperGrad)"/>
  <line x1="182" y1="172" x2="197" y2="168" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="184" y1="177" x2="200" y2="173" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- CHARACTER: The tense person (Anh ấy căng thẳng) -->
  <!-- Torso & Shoulders (hunched upward to show tension) -->
  <path d="M95,140 Q120,130 145,140 L155,190 L85,190 Z" fill="url(#shirtGrad)"/>
  <!-- Collar & Tie -->
  <polygon points="120,138 112,150 128,150" fill="#f8fafc"/>
  <polygon points="118,150 122,150 124,180 120,185 116,180" fill="#ef4444"/>

  <!-- Arms clutching/gripping the edge or tightly placed -->
  <path d="M96,143 L75,165 L85,175 L102,152 Z" fill="#2563eb"/>
  <path d="M144,143 L165,165 L155,175 L138,152 Z" fill="#2563eb"/>

  <!-- Hands gripping the desk edge nervously (knuckles white/tensed) -->
  <circle cx="80" cy="177" r="7" fill="url(#skinGrad)"/>
  <circle cx="160" cy="177" r="7" fill="url(#skinGrad)"/>

  <!-- Neck -->
  <rect x="111" y="118" width="18" height="25" rx="6" fill="url(#skinGrad)"/>

  <!-- Head -->
  <circle cx="120" cy="98" r="24" fill="url(#skinGrad)"/>

  <!-- Hair (Neat professional cut, slightly ruffled from stress) -->
  <path d="M96,98 C96,75 144,75 144,98 C144,98 142,88 135,84 C128,80 112,80 105,84 C98,88 96,98 96,98 Z" fill="#1e293b"/>

  <!-- Facial Expressions (Crucial for "显得很紧张" - Looking very tense/nervous) -->
  <!-- Tense Eyebrows (Slanted sharply inward and upward) -->
  <path d="M106,90 L115,94" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M134,90 L125,94" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes (Wide, alert, intense) -->
  <circle cx="111" cy="99" r="3.5" fill="#1e293b"/>
  <circle cx="129" cy="99" r="3.5" fill="#1e293b"/>
  <!-- Highlights in eyes -->
  <circle cx="112" cy="98" r="1" fill="#ffffff"/>
  <circle cx="130" cy="98" r="1" fill="#ffffff"/>

  <!-- Nervous Sweat Drops (Key visual indicator of tension/stress) -->
  <path d="M138,92 Q142,97 138,102 Q134,97 138,92 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M102,104 Q104,107 102,110 Q100,107 102,104 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Tense Mouth / Tight Lips / Grimace -->
  <path d="M112,112 Q120,115 128,112" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle red flush on cheeks (anxiety/panic) -->
  <ellipse cx="106" cy="106" rx="4" ry="2" fill="#f43f5e" opacity="0.3"/>
  <ellipse cx="134" cy="106" rx="4" ry="2" fill="#f43f5e" opacity="0.3"/>
</svg>