<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Warm Golden Glow for Anticipation/Excitement -->
    <radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Suitcase Body Gradient -->
    <linearGradient id="suitcaseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Ticket Gradient -->
    <linearGradient id="ticketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Anticipation Glow centered around the character/suitcase -->
  <circle cx="130" cy="130" r="90" fill="url(#warmGlow)" />

  <!-- SCENE: Travel preparation / Excited anticipation scene -->
  <!-- Window overlooking starry night/sunrise -->
  <g id="window-frame">
    <rect x="25" y="25" width="60" height="85" rx="4" fill="#0b1329" stroke="#334155" stroke-width="3"/>
    <!-- Night Sky View -->
    <rect x="28" y="28" width="54" height="79" fill="url(#nightSky)"/>
    <!-- Stars & Shooting Star representing travel dreams -->
    <circle cx="40" cy="45" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="70" cy="60" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="50" cy="80" r="1.2" fill="#fbbf24" opacity="0.9"/>
    <!-- Tiny stylized plane -->
    <path d="M 38 70 L 48 67 L 43 72 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Window pane crossbars -->
    <line x1="55" y1="28" x2="55" y2="107" stroke="#334155" stroke-width="2"/>
    <line x1="28" y1="67.5" x2="82" y2="67.5" stroke="#334155" stroke-width="2"/>
    <!-- Curtain / Interior Wall details -->
    <path d="M 25 25 Q 20 60 25 110" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bookshelf / Travel guide books in background -->
  <g id="bookshelf" transform="translate(180, 20)">
    <rect x="0" y="0" width="45" height="12" rx="2" fill="#475569"/>
    <rect x="5" y="-22" width="8" height="22" rx="1.5" fill="#ec4899"/>
    <rect x="15" y="-28" width="10" height="28" rx="1.5" fill="#38bdf8"/>
    <rect x="27" y="-20" width="7" height="20" rx="1.5" fill="#fbbf24"/>
    <path d="M 36 -15 L 42 -10 L 36 -5 Z" fill="#10b981"/> <!-- Globe accent -->
  </g>

  <!-- Wooden Floor Surface -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
  <line x1="0" y1="220" x2="240" y2="220" stroke="#1e293b" stroke-width="1"/>

  <!-- Travel Poster on Wall -->
  <g transform="translate(100, 22)">
    <rect x="0" y="0" width="40" height="50" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M 5 35 Q 20 25 35 35 L 35 45 L 5 45 Z" fill="#10b981"/>
  </g>

  <!-- MAIN PROP: Open Suitcase packed with excitement -->
  <g id="suitcase-group" transform="translate(85, 120)">
    <!-- Suitcase Base/Back -->
    <rect x="-10" y="10" width="100" height="70" rx="12" fill="#c2410c"/>
    <!-- Suitcase Inner Lining -->
    <rect x="-5" y="15" width="90" height="60" rx="8" fill="#fdba74"/>
    <!-- Packed Items: Folded Clothes (Pink & Blue) -->
    <rect x="2" y="22" width="38" height="25" rx="4" fill="#ec4899"/>
    <rect x="45" y="22" width="35" height="45" rx="4" fill="#38bdf8"/>
    <!-- Camera resting inside -->
    <circle cx="22" cy="55" r="10" fill="#334155"/>
    <circle cx="22" cy="55" r="6" fill="#64748b"/>
    <circle cx="22" cy="55" r="3" fill="#94a3b8"/>
    <rect x="18" y="42" width="8" height="4" rx="1" fill="#1e293b"/>

    <!-- Suitcase Lid (Open outwards) -->
    <path d="M -10 10 L -35 -20 L 55 -20 L 90 10 Z" fill="url(#suitcaseGrad)" stroke="#c2410c" stroke-width="2" stroke-linejoin="round"/>
    <!-- Lid Straps/Details -->
    <line x1="-15" y1="-5" x2="35" y2="-5" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Suitcase Outer Body (Lower Half) -->
    <rect x="-15" y="40" width="110" height="45" rx="8" fill="url(#suitcaseGrad)" stroke="#9a3412" stroke-width="2"/>
    <!-- Metal Corners and Locks -->
    <rect x="-15" y="40" width="8" height="12" rx="2" fill="#e2e8f0"/>
    <rect x="87" y="40" width="8" height="12" rx="2" fill="#e2e8f0"/>
    <rect x="33" y="37" width="14" height="6" rx="2" fill="#e2e8f0"/>
    <!-- Wheels -->
    <circle cx="0" cy="85" r="5" fill="#0f172a"/>
    <circle cx="80" cy="85" r="5" fill="#0f172a"/>
  </g>

  <!-- CENTRAL ELEMENT: Hands holding a glowing Travel Ticket / Passport (Anticipation gesture) -->
  <g id="hands-and-ticket" transform="translate(120, 115)">
    <!-- Glowing Boarding Ticket / Itinerary -->
    <g transform="translate(-30, -35) rotate(-12)">
      <rect x="0" y="0" width="60" height="32" rx="4" fill="url(#ticketGrad)" stroke="#bae6fd" stroke-width="1.5"/>
      <!-- Ticket decorative cutouts (Notches) -->
      <circle cx="0" cy="16" r="4" fill="#1e293b"/>
      <circle cx="60" cy="16" r="4" fill="#1e293b"/>
      <!-- Mini graphics on ticket -->
      <line x1="12" y1="10" x2="32" y2="10" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="18" x2="24" y2="18" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
      <circle cx="45" cy="14" r="5" fill="#fbbf24"/>
    </g>

    <!-- Left Hand -->
    <path d="M -45 15 C -45 5 -30 0 -20 10 C -15 15 -18 25 -25 30 C -35 32 -45 25 -45 15 Z" fill="#fbcfe8" stroke="#db2777" stroke-width="2" stroke-linejoin="round"/>
    <!-- Left Sleeve -->
    <path d="M -45 25 L -70 45 L -55 60 L -35 35 Z" fill="url(#shirtGrad)" stroke="#047857" stroke-width="2"/>

    <!-- Right Hand -->
    <path d="M 35 15 C 35 5 20 0 10 10 C 5 15 8 25 15 30 C 25 32 35 25 35 15 Z" fill="#fbcfe8" stroke="#db2777" stroke-width="2" stroke-linejoin="round"/>
    <!-- Right Sleeve -->
    <path d="M 35 25 L 60 45 L 45 60 L 25 35 Z" fill="url(#shirtGrad)" stroke="#047857" stroke-width="2"/>
  </g>

  <!-- Character Head / Bust Peeking from behind/above the suitcase (Excited expression) -->
  <g id="character-bust" transform="translate(120, 48)">
    <!-- Neck -->
    <rect x="-8" y="15" width="16" height="20" fill="#fbcfe8"/>
    <!-- Head/Face Shape -->
    <circle cx="0" cy="0" r="22" fill="#fbcfe8" stroke="#db2777" stroke-width="2.5"/>
    
    <!-- Hair (Joyful/Dynamic styling) -->
    <path d="M -22 -5 C -20 -25 0 -28 15 -20 C 24 -15 25 -2 23 5 C 20 -2 15 -18 -2 -18 C -15 -18 -20 -8 -22 -5 Z" fill="#0f172a"/>
    <path d="M 12 -22 C 22 -20 26 -8 26 -2 L 23 3 C 23 -5 20 -15 12 -22 Z" fill="#334155"/>

    <!-- Big Sparkling Eyes (Showing eager anticipation) -->
    <!-- Left Eye -->
    <circle cx="-7" cy="-2" r="4.5" fill="#0f172a"/>
    <circle cx="-8.5" cy="-3.5" r="1.5" fill="#ffffff"/>
    <circle cx="-5.5" cy="-0.5" r="0.8" fill="#ffffff"/>
    <!-- Right Eye -->
    <circle cx="7" cy="-2" r="4.5" fill="#0f172a"/>
    <circle cx="5.5" cy="-3.5" r="1.5" fill="#ffffff"/>
    <circle cx="8.5" cy="-0.5" r="0.8" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="-11" cy="4" rx="3.5" ry="2" fill="#fb7185" opacity="0.6"/>
    <ellipse cx="11" cy="4" rx="3.5" ry="2" fill="#fb7185" opacity="0.6"/>

    <!-- Wide Excited Smile -->
    <path d="M -6 7 C -6 13 6 13 6 7 Z" fill="#0f172a" stroke="#0f172a" stroke-width="1" stroke-linejoin="round"/>
    <path d="M -3 9 C -3 11 3 11 3 9 Z" fill="#fb7185"/>

    <!-- Eyebrows raised high with excitement -->
    <path d="M -12 -11 Q -7 -15 -3 -10" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 3 -10 Q 7 -15 12 -11" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles & Action Elements floating around (Highlighting the thrill of anticipation) -->
  <g id="sparkles">
    <!-- Star 1 (Top Right) -->
    <path d="M 195 75 Q 195 90 210 90 Q 195 90 195 105 Q 195 90 180 90 Q 195 90 195 75 Z" fill="#fbbf24"/>
    <!-- Star 2 (Left) -->
    <path d="M 50 115 Q 50 125 60 125 Q 50 125 50 135 Q 50 125 40 125 Q 50 125 50 115 Z" fill="#38bdf8"/>
    <!-- Small glowing dots -->
    <circle cx="165" cy="85" r="3" fill="#f43f5e"/>
    <circle cx="75" cy="140" r="2.5" fill="#10b981"/>
    <circle cx="115" cy="35" r="2" fill="#fbbf24"/>
  </g>

</svg>