<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Background element -->
  <rect x="30" y="40" width="180" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M30 70 L210 70" stroke="#334155" stroke-width="2"/>
  
  <!-- Delivery boxes -->
  <rect x="160" y="110" width="30" height="30" rx="2" fill="#fb923c"/>
  <rect x="175" y="100" width="30" height="30" rx="2" fill="#f59e0b"/>
  <rect x="150" y="120" width="25" height="25" rx="2" fill="#fbbf24"/>
  
  <!-- Character -->
  <g transform="translate(40, 100)">
    <circle cx="40" cy="40" r="35" fill="#38bdf8" opacity="0.2"/>
    <!-- Body -->
    <path d="M40 80 C20 80, 10 120, 10 140 L70 140 C70 120, 60 80, 40 80" fill="#64748b"/>
    <!-- Head -->
    <circle cx="40" cy="60" r="15" fill="#fde68a"/>
    <!-- Phone -->
    <rect x="55" y="70" width="20" height="35" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="58" y="75" width="14" height="25" rx="1" fill="#38bdf8"/>
    <!-- Arm -->
    <path d="M50 75 L60 75" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Decorative elements representing digital flow -->
  <path d="M100 60 Q130 30 160 60 T220 60" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="50" r="3" fill="#ec4899"/>
  <circle cx="180" cy="50" r="3" fill="#ec4899"/>
  
  <!-- Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
</svg>