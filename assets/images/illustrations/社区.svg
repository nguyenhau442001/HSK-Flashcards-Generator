<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Community Center Building Outline -->
  <path d="M40 180 L200 180 L200 100 L120 70 L40 100 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="60" y="120" width="30" height="60" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Decorative Banner for Event -->
  <path d="M50 80 Q120 60 190 80" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="70" cy="75" r="5" fill="#f59e0b"/>
  <circle cx="120" cy="68" r="5" fill="#ec4899"/>
  <circle cx="170" cy="75" r="5" fill="#10b981"/>

  <!-- Characters -->
  <!-- Person 1 (Organizer) -->
  <g transform="translate(80, 140)">
    <circle cx="10" cy="10" r="10" fill="#fb923c"/>
    <path d="M0 25 Q10 45 20 25" fill="#fb923c"/>
    <rect x="5" y="30" width="10" height="30" fill="#38bdf8"/>
    <path d="M5 40 L-5 55 M15 40 L25 55" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Person 2 (Participant) -->
  <g transform="translate(140, 150)">
    <circle cx="10" cy="10" r="10" fill="#f59e0b"/>
    <rect x="5" y="25" width="10" height="35" fill="#10b981"/>
    <path d="M5 30 L-5 45 M15 30 L25 45" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ground/Grass -->
  <path d="M0 210 Q120 190 240 210 L240 240 L0 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="190" r="3" fill="#fbbf24"/>
  <circle cx="210" cy="200" r="4" fill="#38bdf8"/>
  <circle cx="150" cy="220" r="2" fill="#ec4899"/>
</svg>