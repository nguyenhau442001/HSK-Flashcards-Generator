<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Kitchen Light Gradient -->
    <radialGradient id="light-glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Apple Gradient -->
    <linearGradient id="apple-grad" x1="0.2" y1="0.2" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Apple Inner Gradient -->
    <linearGradient id="apple-inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Wood Cutting Board Gradient -->
    <linearGradient id="board-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Knife Blade Gradient -->
    <linearGradient id="knife-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Character Skin Shadow -->
    <linearGradient id="skin-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#light-glow)" />

  <!-- Kitchen Background Elements -->
  <!-- Back Wall & Counter Divider -->
  <rect x="0" y="150" width="240" height="90" fill="#090d16" opacity="0.6" />
  <line x1="0" y1="150" x2="240" y2="150" stroke="#334155" stroke-width="2" />
  
  <!-- Ambient Kitchen Props (Jar & Plant) -->
  <rect x="25" y="115" width="22" height="35" rx="4" fill="#334155" />
  <path d="M 29 115 L 43 115 L 45 110 L 27 110 Z" fill="#64748b" />
  <circle x="36" y="130" r="6" fill="#fb923c" opacity="0.8" />
  
  <ellipse cx="205" cy="142" rx="14" ry="8" fill="#334155" />
  <path d="M 205 142 Q 205 125 195 115 Q 215 120 205 142 Z" fill="#10b981" />
  <path d="M 205 142 Q 205 120 218 112 Q 205 125 205 142 Z" fill="#34d399" />

  <!-- MAIN SCENE: Cutting Apple on Cutting Board -->
  <!-- Cutting Board -->
  <g transform="translate(120, 195)">
    <!-- Handle -->
    <rect x="-15" y="10" width="30" height="10" rx="5" fill="#92400e" />
    <!-- Board Body -->
    <ellipse cx="0" cy="0" rx="72" ry="26" fill="url(#board-grad)" />
    <!-- Board Highlight -->
    <ellipse cx="0" cy="-3" rx="64" ry="20" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- Action Props: Apple & Slices -->
  <!-- Left Half Apple (already cut/pushed aside slightly) -->
  <g transform="translate(82, 185)">
    <!-- Back/Skin -->
    <path d="M 0 -12 C -15 -12 -18 10 0 15 Z" fill="url(#apple-grad)" />
    <!-- Inner Flesh -->
    <path d="M 0 -12 C 12 -12 15 10 0 15 Z" fill="url(#apple-inner)" />
    <!-- Core detail -->
    <path d="M 3 0 Q 5 2 3 5" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Right Half Apple (being cut right now) -->
  <g transform="translate(132, 183)">
    <!-- Inner Flesh facing left -->
    <path d="M 0 -14 C -12 -14 -15 12 0 16 Z" fill="url(#apple-inner)" />
    <!-- Skin facing right -->
    <path d="M 0 -14 C 16 -14 18 12 0 16 Z" fill="url(#apple-grad)" />
    <!-- Leaf on top -->
    <path d="M -2 -14 C -8 -20 -15 -14 -10 -9 Z" fill="#10b981" />
    <!-- Stem -->
    <path d="M 0 -14 Q 3 -19 6 -17" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Dynamic Motion / Action Lines -->
  <g opacity="0.6">
    <line x1="120" y1="120" x2="120" y2="165" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 110 135 Q 120 140 130 135" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <path d="M 106 145 Q 120 150 134 145" fill="none" stroke="#fbbf24" stroke-width="1.5" />
  </g>

  <!-- Kitchen Knife (Active Cutting Tool) -->
  <g transform="translate(120, 115) rotate(-15)">
    <!-- Blade -->
    <path d="M -4 -45 L 4 -45 C 8 -10 12 25 15 42 L -4 42 Z" fill="url(#knife-blade)" />
    <path d="M -4 -40 L 2 -40 C 5 -10 8 20 10 38 L -4 38 Z" fill="#ffffff" opacity="0.4" />
    <!-- Sharp edge -->
    <path d="M -4 -45 L 15 42" fill="none" stroke="#e2e8f0" stroke-width="1" />
    <!-- Handle -->
    <rect x="-6" y="-75" width="12" height="32" rx="3" fill="#1e293b" />
    <!-- Handle Rivets -->
    <circle cx="0" cy="-65" r="1.5" fill="#94a3b8" />
    <circle cx="0" cy="-53" r="1.5" fill="#94a3b8" />
  </g>

  <!-- Character Hands & Arms Performing the Action -->
  <!-- Left Hand (Holding/Stabilizing Apple) -->
  <g transform="translate(95, 175)">
    <path d="M -15 15 Q -5 0 10 10 Q -2 20 -15 15 Z" fill="url(#skin-grad)" />
    <!-- Fingers -->
    <ellipse cx="-2" cy="5" rx="4" ry="7" fill="url(#skin-grad)" transform="rotate(-20)" />
    <ellipse cx="6" cy="8" rx="4" ry="7" fill="url(#skin-grad)" transform="rotate(10)" />
    <!-- Cuff / Sleeve -->
    <path d="M -15 15 L -35 25 L -30 35 L -10 25 Z" fill="#38bdf8" />
  </g>

  <!-- Right Hand (Holding Knife Handle) -->
  <g transform="translate(112, 90)">
    <path d="M -5 0 C 10 -5 15 10 5 15 C -2 18 -10 5 -5 0 Z" fill="url(#skin-grad)" />
    <!-- Sleeve -->
    <path d="M -5 5 L -20 -8 L -28 0 L -12 18 Z" fill="#38bdf8" />
  </g>

  <!-- Foreground / Sparkles for Food Freshness/Action Impact -->
  <path d="M 148 165 L 151 172 L 158 175 L 151 178 L 148 185 L 145 178 L 138 175 L 145 172 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M 72 170 L 74 174 L 78 175 L 74 176 L 72 180 L 70 176 L 66 175 L 70 174 Z" fill="#38bdf8" opacity="0.8" />
</svg>