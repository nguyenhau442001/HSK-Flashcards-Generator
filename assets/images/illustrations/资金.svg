<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Glow for Financial Chart -->
    <linearGradient id="chartGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT & INTERIOR -->
  <!-- Back Wall / Window Frame -->
  <path d="M150 30 H210 V140 H150 Z" fill="#334155" opacity="0.4" />
  <!-- City Skyline through Window -->
  <rect x="156" y="70" width="12" height="70" fill="#475569" opacity="0.3" />
  <rect x="172" y="50" width="16" height="90" fill="#475569" opacity="0.3" />
  <rect x="192" y="85" width="12" height="55" fill="#475569" opacity="0.3" />
  <!-- Window Grid Lines -->
  <path d="M180 30 V140 M150 85 H210" stroke="#1e293b" stroke-width="2" />

  <!-- Office Bookshelf / Props in Background -->
  <rect x="20" y="45" width="40" height="8" rx="2" fill="#475569" opacity="0.6" />
  <rect x="25" y="25" width="30" height="20" rx="2" fill="#38bdf8" opacity="0.3" />
  <rect x="30" y="15" width="20" height="12" rx="2" fill="#fb923c" opacity="0.4" />

  <!-- Desk Surface -->
  <path d="M10 175 H230 V185 H10 Z" fill="#475569" />
  <path d="M15 175 H225 V178 H15 Z" fill="#64748b" />
  <!-- Desk Body -->
  <rect x="25" y="185" width="190" height="40" fill="#1e293b" />
  <!-- Desk Drawer Handles -->
  <rect x="45" y="198" width="20" height="4" rx="2" fill="#64748b" />
  <rect x="175" y="198" width="20" height="4" rx="2" fill="#64748b" />

  <!-- OFFICE DESK PROPS -->
  <!-- Modern Laptop / Financial Dashboard Display -->
  <path d="M75 140 H125 L130 175 H70 Z" fill="#475569" />
  <rect x="68" y="105" width="64" height="38" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <!-- Screen Financial Chart (Depicting Funding/Capital Needs) -->
  <path d="M74 133 L85 124 L96 128 L107 115 L118 118 L125 109" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="74,133 85,124 96,128 107,115 118,118 125,109 125,135 74,135" fill="url(#chartGlow)" />
  <!-- Laptop Base/Keyboard Highlight -->
  <path d="M60 175 H140 L145 178 H55 Z" fill="#94a3b8" />

  <!-- Financial Documents / Blueprints on Desk -->
  <rect x="145" y="150" width="35" height="25" rx="1" fill="#f8fafc" transform="rotate(-8 145 150)" />
  <line x1="150" y1="157" x2="170" y2="155" stroke="#cbd5e1" stroke-width="2" />
  <line x1="150" y1="163" x2="165" y2="161" stroke="#cbd5e1" stroke-width="2" />
  <!-- Coin Stack / Funds Prop -->
  <ellipse cx="195" cy="170" rx="12" ry="5" fill="#f59e0b" />
  <path d="M183 166 V170 C183 172.8 188.4 175 195 175 C201.6 175 207 172.8 207 170 V166" fill="#d97706" />
  <ellipse cx="195" cy="164" rx="12" ry="5" fill="#fbbf24" />
  <path d="M183 160 V164 C183 166.8 188.4 169 195 169 C201.6 169 207 166.8 207 164 V160" fill="#f59e0b" />
  <ellipse cx="195" cy="158" rx="12" ry="5" fill="#fcd34d" />

  <!-- Desk Lamp -->
  <circle cx="210" cy="95" r="70" fill="url(#lampGlow)" />
  <path d="M210 175 V110" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M195 75 L210 95 L225 75 Z" fill="#fbbf24" />
  <path d="M200 75 H220 V72 C220 68.6 217.4 66 210 66 C202.6 66 200 68.6 200 72 Z" fill="#d97706" />

  <!-- MAIN CHARACTER (Pensive/Focused Professional Analyst) -->
  <!-- Chair Back -->
  <rect x="95" y="70" width="35" height="75" rx="6" fill="#334155" />
  
  <!-- Torso & Shirt -->
  <path d="M85 130 C85 115 105 110 115 110 C125 110 145 115 145 130 V175 H85 Z" fill="#38bdf8" />
  <!-- Collar & Tie -->
  <path d="M105 110 L115 125 L125 110 Z" fill="#f8fafc" />
  <polygon points="113,123 117,123 119,150 115,155 111,150" fill="#1e293b" />
  <path d="M85 130 L100 175 H70 Z" fill="#0ea5e9" opacity="0.5" />
  <path d="M145 130 L130 175 H160 Z" fill="#0ea5e9" opacity="0.5" />

  <!-- Neck -->
  <rect x="107" y="98" width="16" height="15" fill="#fbcfe8" />

  <!-- Head & Face -->
  <path d="M97 75 C97 60 133 60 133 75 V95 C133 102 97 102 97 95 Z" fill="#fbcfe8" />

  <!-- Hair (Neat Modern Cut) -->
  <path d="M96 78 C96 55 134 55 134 78 C134 82 131 82 130 75 C125 65 105 65 100 75 C99 82 96 82 96 78 Z" fill="#334155" />

  <!-- Serious/Thoughtful Expression & Glasses -->
  <rect x="101" y="80" width="13" height="9" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="116" y="80" width="13" height="9" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <line x1="114" y1="84" x2="116" y2="84" stroke="#1e293b" stroke-width="1.5" />
  <!-- Focused Eyebrows (Slightly furrowed for needing capital/solutions) -->
  <path d="M100 77 L111 79" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />
  <path d="M130 77 L119 79" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />
  <!-- Eyes -->
  <circle cx="107" cy="85" r="1.5" fill="#1e293b" />
  <circle cx="122" cy="85" r="1.5" fill="#1e293b" />
  <!-- Mouth (Pensive straight line) -->
  <path d="M112 94 H118" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Arms & Hands (Supporting head thoughtfully) -->
  <!-- Left Arm (Resting on table) -->
  <path d="M85 130 L60 155 H75 L95 140 Z" fill="#38bdf8" />
  <circle cx="58" cy="156" r="6" fill="#fbcfe8" />

  <!-- Right Arm (Hand touching chin thoughtfully) -->
  <path d="M145 130 L155 145 L135 155 Z" fill="#38bdf8" />
  <path d="M135 155 L125 145 L132 138 Z" fill="#fbcfe8" />
  <!-- Hand on Chin Detail -->
  <circle cx="123" cy="143" r="5" fill="#fbcfe8" />
</svg>