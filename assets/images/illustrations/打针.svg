<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Subtle background glow/circle for focus -->
  <circle cx="100" cy="100" r="60" fill="#334155" opacity="0.4"/>

  <!-- Medical Tray / Surface Base -->
  <path d="M 60 140 L 140 140 C 145 140 148 143 146 148 L 138 162 C 137 165 134 167 130 167 L 70 167 C 66 167 63 165 62 162 L 54 148 C 52 143 55 140 60 140 Z" fill="#475569"/>

  <!-- Syringe Group (Angled for dynamic action) -->
  <g transform="rotate(-35 100 95)">
    <!-- Plunger Rod & Thumb Rest -->
    <rect x="122" y="70" width="30" height="6" rx="3" fill="#94a3b8"/>
    <path d="M 148 64 L 148 82" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Barrel Outer Tube (Semi-transparent look using opacity) -->
    <rect x="75" y="67" width="50" height="12" rx="2" fill="#38bdf8" opacity="0.35"/>
    <rect x="75" y="67" width="50" height="12" rx="2" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

    <!-- Measurement Graduations on Barrel -->
    <line x1="87" y1="67" x2="87" y2="72" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="97" y1="67" x2="97" y2="72" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="107" y1="67" x2="107" y2="72" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Inner Plunger Seal / Rubber Tip -->
    <rect x="75" y="69" width="12" height="8" rx="1" fill="#fb923c"/>

    <!-- Liquid Medicine inside barrel -->
    <rect x="75" y="69" width="20" height="8" rx="1" fill="#10b981" opacity="0.8"/>

    <!-- Needle Hub / Base -->
    <path d="M 70 70 L 75 67 L 75 79 L 70 76 Z" fill="#94a3b8"/>

    <!-- Stainless Steel Needle -->
    <line x1="45" y1="73" x2="70" y2="73" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tiny droplet at the tip for realism/action -->
    <circle cx="41" cy="73" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Decorative Sparkles/Focus Elements -->
  <path d="M 135 55 L 138 65 L 148 68 L 138 71 L 135 81 L 132 71 L 122 68 L 132 65 Z" fill="#f59e0b" opacity="0.85"/>
  <path d="M 65 115 L 67 120 L 72 122 L 67 124 L 65 129 L 63 124 L 58 122 L 63 120 Z" fill="#38bdf8" opacity="0.7"/>

  <!-- Soft cute bandage graphic below to anchor the medical theme -->
  <g transform="translate(90, 125)">
    <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#cbd5e1"/>
    <rect x="-6" y="-8" width="12" height="16" rx="2" fill="#f8fafc"/>
    <circle cx="-3" cy="0" r="1" fill="#94a3b8"/>
    <circle cx="3" cy="0" r="1" fill="#94a3b8"/>
  </g>
</svg>