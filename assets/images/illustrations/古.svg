<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Distant Ancient Architecture (The "Gu" element) -->
  <path d="M40 160 L40 120 L60 100 L80 120 L80 160 Z" fill="#fb923c" opacity="0.8"/>
  <path d="M30 160 L90 160 L95 170 L25 170 Z" fill="#f59e0b"/>
  <path d="M150 140 L150 100 L170 80 L190 100 L190 140 Z" fill="#fb923c" opacity="0.8"/>
  <path d="M140 140 L200 140 L205 150 L135 150 Z" fill="#f59e0b"/>
  
  <!-- Decorative roof details -->
  <path d="M40 120 L60 100 L80 120" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M150 100 L170 80 L190 100" stroke="#1e293b" stroke-width="2" fill="none"/>
  
  <!-- Foreground Character: Tourist pointing at architecture -->
  <g transform="translate(80, 140)">
    <!-- Body -->
    <path d="M20 80 C20 60, 40 60, 40 80 L40 100 L20 100 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="30" cy="50" r="15" fill="#fde68a"/>
    <!-- Arm pointing -->
    <path d="M40 70 L60 50" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Leg -->
    <rect x="22" y="95" width="6" height="5" fill="#38bdf8"/>
    <rect x="32" y="95" width="6" height="5" fill="#38bdf8"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <path d="M0 200 L240 200" stroke="#334155" stroke-width="2"/>
  
  <!-- Atmospheric details -->
  <circle cx="200" cy="40" r="20" fill="#fbbf24" opacity="0.3"/>
  <path d="M10 220 Q60 210 120 220 T230 220" stroke="#10b981" stroke-width="1" opacity="0.2"/>
</svg>