<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Moonlight -->
  <circle cx="180" cy="60" r="30" fill="#fef3c7" opacity="0.2"/>
  <path d="M150 180 C 150 140, 210 140, 210 180 L 210 240 L 150 240 Z" fill="#334155"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" fill="#475569" rx="2"/>
  <rect x="40" y="175" width="10" height="65" fill="#334155"/>
  <rect x="190" y="175" width="10" height="65" fill="#334155"/>
  
  <!-- Poet Character -->
  <g transform="translate(60, 80)">
    <circle cx="40" cy="30" r="25" fill="#fde68a"/>
    <path d="M25 35 Q 40 50 55 35" stroke="#78350f" stroke-width="2" fill="none"/>
    <circle cx="32" cy="25" r="3" fill="#78350f"/>
    <circle cx="48" cy="25" r="3" fill="#78350f"/>
    <rect x="15" y="60" width="50" height="80" rx="10" fill="#38bdf8"/>
    <rect x="10" y="60" width="15" height="40" fill="#38bdf8"/>
    <rect x="55" y="60" width="15" height="40" fill="#38bdf8"/>
  </g>
  
  <!-- Paper/Poem -->
  <rect x="90" y="120" width="80" height="100" rx="4" fill="#f1f5f9"/>
  <line x1="105" y1="135" x2="155" y2="135" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="105" y1="150" x2="155" y2="150" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="105" y1="165" x2="140" y2="165" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Emotional Glow -->
  <path d="M130 110 Q 145 90 160 110 T 190 110" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <circle cx="170" cy="100" r="4" fill="#ec4899"/>
  <circle cx="185" cy="115" r="3" fill="#ec4899"/>
  
  <!-- Quill/Pen -->
  <path d="M85 130 L 100 115 L 110 125 L 95 140 Z" fill="#fb923c"/>
  <path d="M105 120 L 120 105" stroke="#fb923c" stroke-width="2"/>
  
  <!-- Candle -->
  <rect x="180" y="140" width="10" height="20" fill="#fbbf24"/>
  <ellipse cx="185" cy="135" rx="5" ry="8" fill="#f59e0b"/>
