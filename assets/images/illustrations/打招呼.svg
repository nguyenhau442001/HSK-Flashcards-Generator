<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Deep Background -->
    <rect width="240" height="240" fill="url(#bgGrad)" />

    <!-- Ambient Light / Warm Glow -->
    <circle cx="120" cy="80" r="100" fill="url(#lampGlow)" />

    <!-- Environment: School / Campus Hallway Context -->
    <!-- Wall & Floor Divider -->
    <rect x="0" y="40" width="240" height="130" fill="url(#wallGrad)" />
    <!-- Wooden Floor -->
    <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#floorGrad)" />
    <!-- Floor Planks Perspective Lines -->
    <line x1="0" y1="170" x2="-40" y2="240" stroke="#1e293b" stroke-width="2" opacity="0.5" />
    <line x1="60" y1="170" x2="30" y2="240" stroke="#1e293b" stroke-width="2" opacity="0.5" />
    <line x1="120" y1="170" x2="120" y2="240" stroke="#1e293b" stroke-width="2" opacity="0.5" />
    <line x1="180" y1="170" x2="210" y2="240" stroke="#1e293b" stroke-width="2" opacity="0.5" />
    <line x1="240" y1="170" x2="280" y2="240" stroke="#1e293b" stroke-width="2" opacity="0.5" />

    <!-- Wall details (Windows / Posters) -->
    <rect x="25" y="60" width="50" height="70" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="33" y="68" width="34" height="54" fill="#0f172a" opacity="0.6" />
    <!-- Window pane lines -->
    <line x1="50" y1="68" x2="50" y2="122" stroke="#475569" stroke-width="1.5" />
    <line x1="33" y1="95" x2="67" y2="95" stroke="#475569" stroke-width="1.5" />

    <!-- Potted Plant Prop -->
    <circle cx="205" cy="155" r="16" fill="#0f172a" />
    <path d="M193 145 Q205 130 217 145 Z" fill="#10b981" />
    <path d="M188 155 Q200 135 205 155 Z" fill="#34d399" />
    <path d="M205 155 Q210 135 222 155 Z" fill="#059669" />
    <path d="M197 170 L213 170 L217 150 L193 150 Z" fill="#cbd5e1" />

    <!-- CHARACTERS: Greeting Scene (Student & Teacher) -->
    
    <!-- Character 1: Teacher (Left side, holding book, smiling, waving back) -->
    <g transform="translate(0, 0)">
      <!-- Teacher Body/Torso -->
      <path d="M65 145 L85 145 L92 200 L58 200 Z" fill="#3b82f6" />
      <path d="M75 145 L75 180" stroke="#1d4ed8" stroke-width="2" />
      
      <!-- Teacher Head -->
      <circle cx="75" cy="115" r="16" fill="#ffedd5" />
      <!-- Teacher Hair (neat, dark) -->
      <path d="M59 115 C59 100 91 100 91 115 C91 110 85 104 75 104 C65 104 59 110 59 115 Z" fill="#334155" />
      
      <!-- Teacher Glasses -->
      <circle cx="70" cy="114" r="4" fill="none" stroke="#b45309" stroke-width="1.5" />
      <circle cx="80" cy="114" r="4" fill="none" stroke="#b45309" stroke-width="1.5" />
      <line x1="74" y1="114" x2="76" y2="114" stroke="#b45309" stroke-width="1.5" />

      <!-- Teacher Smile -->
      <path d="M72 123 Q75 126 78 123" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" />

      <!-- Teacher Arm Waving Back -->
      <path d="M85 148 Q98 135 95 120" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
      <circle cx="95" cy="118" r="5" fill="#ffedd5" />

      <!-- Teacher holding a book -->
      <rect x="53" y="150" width="18" height="24" rx="2" fill="#ef4444" transform="rotate(-15 62 162)" />
      <rect x="55" y="152" width="14" height="20" fill="#f8fafc" transform="rotate(-15 62 162)" />
    </g>

    <!-- Character 2: Student (Right side, bowing slightly/waving enthusiastically to greet) -->
    <g transform="translate(0, 0)">
      <!-- Student Body (Dynamic leaning forward posture for bowing/greeting) -->
      <path d="M140 148 L160 140 L170 195 L135 200 Z" fill="#10b981" />
      
      <!-- Student Backpack straps -->
      <path d="M143 148 L152 175" stroke="#047857" stroke-width="3" />
      <path d="M156 144 L162 172" stroke="#047857" stroke-width="3" />

      <!-- Student Head (leaning forward) -->
      <circle cx="152" cy="112" r="16" fill="#ffedd5" />
      <!-- Student Hair (youthful, spiky/styled brown) -->
      <path d="M136 112 C136 96 168 96 168 112 C168 106 162 100 152 100 C142 100 136 106 136 112 Z" fill="#78350f" />
      <path d="M152 98 L158 92 L162 99 Z" fill="#78350f" />

      <!-- Student Happy Face -->
      <circle cx="157" cy="111" r="1.5" fill="#451a03" />
      <path d="M154 118 Q158 122 162 118" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" />
      <path d="M161 113 Q165 112 163 116" fill="#fca5a5" opacity="0.6" /> <!-- Blush -->

      <!-- Student Arm Raised High Waving (Greeting gesture) -->
      <path d="M145 145 Q135 125 122 130" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
      <circle cx="120" cy="132" r="5" fill="#ffedd5" />
    </g>

    <!-- Action / Greeting Effect Elements (Friendly sparkles & motion arcs) -->
    <!-- Sparkle 1 -->
    <path d="M105 95 Q110 95 110 90 Q110 95 115 95 Q110 95 110 100 Q110 95 105 95 Z" fill="#fbbf24" />
    <!-- Sparkle 2 -->
    <path d="M125 80 Q130 80 130 75 Q130 80 135 80 Q130 80 130 85 Q130 80 125 80 Z" fill="#fbbf24" />
    <!-- Small floating dots -->
    <circle cx="118" cy="105" r="2" fill="#38bdf8" />
    <circle cx="98" cy="108" r="1.5" fill="#ec4899" />

    <!-- Soundwave / Greeting Motion Lines between them -->
    <path d="M108 125 C112 120 112 130 116 125" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M113 120 C117 115 117 125 121 120" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Vignette / Frame Border overlay for polish -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
  </g>
</svg>