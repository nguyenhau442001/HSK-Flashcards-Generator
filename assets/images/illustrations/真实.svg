<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Storybook Glow -->
    <radialGradient id="storyGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Book/Story Gradients -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Magical/True Story Vibe Gradients -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Glow & Environment Setup -->
  <circle cx="120" cy="110" r="100" fill="url(#storyGlow)" />

  <!-- Cozy Room Interior Details: Bookshelf & Window backdrop -->
  <!-- Bookshelf Left -->
  <rect x="20" y="70" width="35" height="110" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="25" y="90" width="25" height="6" rx="2" fill="#64748b" opacity="0.4"/>
  <rect x="25" y="125" width="25" height="6" rx="2" fill="#64748b" opacity="0.4"/>
  <rect x="25" y="160" width="25" height="6" rx="2" fill="#64748b" opacity="0.4"/>

  <!-- Plant on Shelf -->
  <path d="M 28 90 Q 25 75 35 70 Q 45 75 42 90 Z" fill="#10b981" />
  <path d="M 35 70 Q 30 55 20 60" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 35 70 Q 40 50 50 55" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Warm Hanging Lamp -->
  <path d="M 120 0 L 120 40" stroke="#64748b" stroke-width="2" />
  <path d="M 105 40 L 135 40 L 140 50 L 100 50 Z" fill="#f59e0b" opacity="0.9" />
  <ellipse cx="120" cy="50" rx="20" ry="8" fill="#fbbf24" filter="url(#softShadow)" />

  <!-- Ground Floor / Rug -->
  <ellipse cx="120" cy="210" rx="75" ry="15" fill="#334155" opacity="0.8" />
  <ellipse cx="120" cy="210" rx="60" ry="10" fill="#475569" opacity="0.6" />

  <!-- Main Subject: Person reading/telling a vivid, real story (Grandpa/Storyteller or Young Adult sharing a memoir) -->
  <!-- Let's feature an expressive character with an open book, and cinematic "real story" visuals emerging -->
  
  <!-- Character Chair -->
  <path d="M 75 160 L 95 120 L 145 120 L 165 160 Z" fill="#475569" rx="8" />
  <rect x="85" y="100" width="70" height="60" rx="12" fill="#334155" />

  <!-- Character Body -->
  <!-- Legs -->
  <rect x="100" y="165" width="14" height="40" rx="7" fill="#1e293b" />
  <rect x="126" y="165" width="14" height="40" rx="7" fill="#1e293b" />
  <!-- Shoes -->
  <ellipse cx="107" cy="205" rx="10" ry="5" fill="#cbd5e1" />
  <ellipse cx="133" cy="205" rx="10" ry="5" fill="#cbd5e1" />

  <!-- Torso (Sweater) -->
  <path d="M 95 115 Q 120 110 145 115 L 152 165 Q 120 175 88 165 Z" fill="url(#sweaterGrad)" />

  <!-- Head & Face (Expressive, engaged storyteller) -->
  <circle cx="120" cy="85" r="18" fill="#fed7aa" />
  <!-- Hair -->
  <path d="M 102 85 Q 102 65 120 65 Q 138 65 138 85 Q 135 72 120 72 Q 105 72 102 85 Z" fill="#475569" />
  <!-- Glasses / Friendly eyes -->
  <circle cx="114" cy="84" r="4" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="126" cy="84" r="4" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <line x1="118" y1="84" x2="122" y2="84" stroke="#1e293b" stroke-width="1.5" />
  <!-- Smile -->
  <path d="M 116 93 Q 120 97 124 93" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Arms holding an open book -->
  <!-- Left arm -->
  <path d="M 100 125 Q 90 140 105 150" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
  <!-- Right arm -->
  <path d="M 140 125 Q 150 140 135 150" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />

  <!-- Open Book in Hands -->
  <g filter="url(#softShadow)">
    <path d="M 95 135 L 120 145 L 145 135 L 145 160 L 120 170 L 95 160 Z" fill="url(#bookCover)" />
    <!-- Pages -->
    <path d="M 98 139 L 118 147 L 118 165 L 98 157 Z" fill="#f8fafc" />
    <path d="M 142 139 L 122 147 L 122 165 L 142 157 Z" fill="#f8fafc" />
    <!-- Abstract text lines on book -->
    <line x1="103" y1="145" x2="113" y2="149" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="103" y1="151" x2="111" y2="155" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="127" y1="145" x2="137" y2="149" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="127" y1="151" x2="135" y2="155" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- THE "TRUE STORY" VISUALIZATION (Real-world scenario elements floating up from the book) -->
  <!-- Representing a real-world memory/story: A tiny realistic house, tree, and mountain scene floating out of the book as vivid reality -->
  <g transform="translate(0, -15)" filter="url(#softShadow)">
    <!-- Floating Scene Base (Magical aura ring) -->
    <ellipse cx="120" cy="115" rx="35" ry="12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 120 115" to="360 120 115" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Mini Real-World Scene Elements (House & Tree representing a true life story) -->
    <!-- Little House -->
    <polygon points="105,115 120,100 135,115" fill="#fb923c" />
    <rect x="109" y="115" width="22" height="18" fill="#fdba74" />
    <rect x="116" y="121" width="8" height="12" fill="#7c2d12" />

    <!-- Little Pine Tree -->
    <polygon points="90,125 97,110 104,125" fill="#10b981" />
    <polygon points="90,117 97,104 104,117" fill="#059669" />
    <rect x="95" y="125" width="4" height="8" fill="#78350f" />

    <!-- Mountain background in mini scene -->
    <polygon points="125,123 140,105 155,123" fill="#64748b" />
    <path d="M 136 111 L 140 105 L 144 111 Z" fill="#f8fafc" /> <!-- Snow peak -->
  </g>

  <!-- Sparkles & Authentic Truth Elements (Golden glowing stars and checkmark subtly symbolizing authenticity/truth) -->
  <g fill="url(#sparkleGrad)">
    <!-- Sparkle 1 -->
    <path d="M 75 75 Q 75 85 65 85 Q 75 85 75 95 Q 75 85 85 85 Q 75 85 75 75 Z" />
    <!-- Sparkle 2 -->
    <path d="M 175 70 Q 175 78 167 78 Q 175 78 175 86 Q 175 78 183 78 Q 175 78 175 70 Z" />
    <!-- Sparkle 3 -->
    <path d="M 155 130 Q 155 136 149 136 Q 155 136 155 142 Q 155 136 161 136 Q 155 136 155 130 Z" />
  </g>

  <!-- Floating Glowing Orbs for magical narrative ambiance -->
  <circle cx="88" cy="65" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="160" cy="95" r="2.5" fill="#fbbf24" opacity="0.9" />
  <circle cx="130" cy="55" r="2" fill="#ec4899" opacity="0.7" />
  <circle cx="70" cy="120" r="3.5" fill="#10b981" opacity="0.8" />

  <!-- Subtle Check / Authenticity Symbol integrated in glowing frame (Abstract representation of 'real/truth') -->
  <g transform="translate(180, 110)">
    <circle cx="15" cy="15" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2" opacity="0.9"/>
    <path d="M 9 15 L 13 19 L 21 10" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>