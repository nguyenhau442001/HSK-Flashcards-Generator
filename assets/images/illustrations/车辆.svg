<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Road Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Vehicles (Representing "More and more vehicles") -->
  <!-- Car 1 -->
  <g transform="translate(10, 170)">
    <path d="M5 10 L35 10 L30 25 L10 25 Z" fill="#38bdf8"/>
    <circle cx="12" cy="28" r="4" fill="#f8fafc"/>
    <circle cx="28" cy="28" r="4" fill="#f8fafc"/>
  </g>
  
  <!-- Car 2 -->
  <g transform="translate(60, 165)">
    <path d="M5 15 L35 15 L32 30 L8 30 Z" fill="#fb923c"/>
    <circle cx="12" cy="32" r="4" fill="#f8fafc"/>
    <circle cx="28" cy="32" r="4" fill="#f8fafc"/>
  </g>
  
  <!-- Car 3 -->
  <g transform="translate(120, 175)">
    <path d="M5 5 L35 5 L30 20 L10 20 Z" fill="#10b981"/>
    <circle cx="12" cy="22" r="4" fill="#f8fafc"/>
    <circle cx="28" cy="22" r="4" fill="#f8fafc"/>
  </g>
  
  <!-- Car 4 -->
  <g transform="translate(180, 168)">
    <path d="M5 12 L35 12 L32 28 L8 28 Z" fill="#ec4899"/>
    <circle cx="12" cy="30" r="4" fill="#f8fafc"/>
    <circle cx="28" cy="30" r="4" fill="#f8fafc"/>
  </g>

  <!-- Pedestrian observing the traffic -->
  <g transform="translate(160, 80)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 50 L15 90 L25 90 L30 50 Z" fill="#f59e0b"/>
    <path d="M5 55 L15 70" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M35 55 L25 70" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <!-- Eyes looking at road -->
    <circle cx="15" cy="18" r="2" fill="#0f172a"/>
    <circle cx="25" cy="18" r="2" fill="#0f172a"/>
  </g>

  <!-- Cityscape silhouette -->
  <path d="M0 160 L40 100 L80 140 L120 80 L160 120 L200 60 L240 160 Z" fill="#1e293b" opacity="0.5"/>
  
  <!-- Street light -->
  <rect x="210" y="50" width="4" height="110" fill="#64748b"/>
  <circle cx="212" cy="45" r="8" fill="#fbbf24"/>
</svg>