<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Accent Gradient -->
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glass / Screen Effect -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / OFFICE BACKGROUND -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b"/>
  
  <!-- Large Office Window / Cityscape Silhouette -->
  <g opacity="0.4">
    <rect x="135" y="30" width="75" height="90" rx="4" fill="url(#windowLight)" stroke="#475569" stroke-width="1.5"/>
    <line x1="172" y1="30" x2="172" y2="120" stroke="#475569" stroke-width="1"/>
    <line x1="135" y1="75" x2="210" y2="75" stroke="#475569" stroke-width="1"/>
    <!-- Distant City Skyline in Window -->
    <path d="M140 120 L140 95 L148 95 L148 120 L155 120 L155 85 L165 85 L165 120 L175 120 L175 90 L185 90 L185 120 L195 120 L195 70 L205 70 L205 120 Z" fill="#334155"/>
  </g>

  <!-- Ambient Light Beam on Floor/Wall -->
  <polygon points="120,20 220,170 80,170" fill="url(#warmGlow)"/>

  <!-- Bookshelf / Office Decor in Background -->
  <rect x="30" y="40" width="40" height="70" fill="#1b263b" rx="2"/>
  <line x1="30" y1="65" x2="70" y2="65" stroke="#334155" stroke-width="2"/>
  <line x1="30" y1="90" x2="70" y2="90" stroke="#334155" stroke-width="2"/>
  <!-- Books -->
  <rect x="35" y="48" width="6" height="17" fill="#f59e0b" rx="1"/>
  <rect x="43" y="45" width="8" height="20" fill="#38bdf8" rx="1"/>
  <rect x="53" y="50" width="5" height="15" fill="#ec4899" rx="1"/>
  <rect x="35" y="73" width="12" height="17" fill="#10b981" rx="1"/>
  <rect x="49" y="75" width="7" height="15" fill="#fb923c" rx="1"/>

  <!-- Award Plaque / Certificate on Wall (Indicates Leadership/Seniority) -->
  <rect x="85" y="35" width="22" height="28" fill="#334155" rx="1" stroke="#f59e0b" stroke-width="1"/>
  <rect x="89" y="39" width="14" height="16" fill="#f8fafc"/>
  <circle cx="96" cy="44" r="3" fill="#f59e0b"/>

  <!-- OFFICE DESK -->
  <rect x="15" y="160" width="210" height="12" fill="url(#deskGrad)" rx="3" filter="url(#shadow)"/>
  <path d="M25 172 L35 220 L55 220 L45 172 Z" fill="#0f172a"/>
  <path d="M215 172 L205 220 L185 220 L195 172 Z" fill="#0f172a"/>

  <!-- DESK PROPS -->
  <!-- Laptop -->
  <path d="M125 152 L165 152 L175 160 L115 160 Z" fill="#64748b"/>
  <rect x="127" y="130" width="36" height="23" rx="2" fill="#cbd5e1"/>
  <rect x="130" y="133" width="30" height="17" fill="url(#screenGrad)"/>
  <!-- UI Dashboard on Laptop Screen (Abstract charts) -->
  <polyline points="134,145 140,140 146,143 154,136 158,138" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="154" cy="136" r="1.5" fill="#f59e0b"/>

  <!-- Modern Desk Lamp -->
  <path d="M195 160 L190 120 L180 120" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M172 114 L188 114 L183 122 L177 122 Z" fill="#f59e0b"/>
  <!-- Light Glow from Lamp -->
  <ellipse cx="165" cy="158" rx="20" ry="4" fill="#f59e0b" opacity="0.3"/>

  <!-- Coffee Mug -->
  <rect x="100" y="146" width="12" height="14" rx="2" fill="#f8fafc"/>
  <path d="M112 150 C115 150, 115 156, 112 158" fill="none" stroke="#f8fafc" stroke-width="1.5"/>

  <!-- Folder / Documents (Company files) -->
  <path d="M50 150 L85 150 L90 160 L45 160 Z" fill="#ef4444" filter="url(#shadow)"/>
  <path d="M48 146 L82 146 L87 153 L43 153 Z" fill="#f8fafc"/>


  <!-- MAIN CHARACTER: THE LEADER (领导) -->
  <g id="leader" filter="url(#shadow)">
    <!-- Character Body / Suit Jacket -->
    <!-- Torso -->
    <path d="M85 110 L115 110 L122 170 L78 170 Z" fill="#1e293b"/>
    <!-- Shirt inner -->
    <polygon points="93,110 107,110 100,135" fill="#f8fafc"/>
    <!-- Tie (Symbol of professional authority) -->
    <polygon points="98,118 102,118 104,145 100,152 96,145" fill="#ef4444"/>
    <!-- Lapels -->
    <path d="M93 110 L100 135 L90 160" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M107 110 L100 135 L110 160" fill="none" stroke="#0f172a" stroke-width="2"/>

    <!-- Arms & Gestures (Confident leadership posture) -->
    <!-- Left arm (resting on desk / holding pen or gesturing) -->
    <path d="M82 115 L60 135 L70 145 L85 130" fill="#1e293b"/>
    <!-- Right arm (Confident gesture pointing or resting) -->
    <path d="M118 115 L135 135 L125 145" fill="#1e293b"/>
    <circle cx="125" cy="146" r="6" fill="#f1c27d"/> <!-- Right hand -->

    <!-- Neck -->
    <rect x="94" y="100" width="12" height="14" fill="#f1c27d"/>

    <!-- Head & Face -->
    <ellipse cx="100" cy="85" rx="18" ry="21" fill="#f1c27d"/>

    <!-- Hair (Professional styled haircut with subtle gray at temples for seniority/leadership) -->
    <path d="M82 85 C82 65, 118 65, 118 85 C118 88, 116 85, 114 80 C110 70, 90 70, 86 80 C84 85, 82 88, 82 85 Z" fill="#334155"/>
    <path d="M83 83 C85 78, 90 74, 100 73 C110 74, 115 78, 117 83" fill="#475569" stroke-width="0.5"/>

    <!-- Facial Expressions (Confident, approachable leader smile) -->
    <!-- Eyebrows (Determined & friendly) -->
    <path d="M88 78 Q93 75 97 79" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M103 79 Q107 75 112 78" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyes (Friendly curved eyes) -->
    <circle cx="92" cy="83" r="2.5" fill="#1e293b"/>
    <circle cx="108" cy="83" r="2.5" fill="#1e293b"/>

    <!-- Glasses (Intellectual leader look) -->
    <rect x="88" y="79" width="9" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="103" y="79" width="9" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="97" y1="83" x2="103" y2="83" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Nose & Warm Smile -->
    <path d="M100 85 L98 91 L101 92" fill="none" stroke="#d4a373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M94 96 Q100 102 106 96" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

    <!-- Subtle Name Badge / Pin on Lapel (Signifying Company Leadership) -->
    <rect x="108" y="122" width="7" height="4" rx="1" fill="#f59e0b"/>
  </g>

  <!-- SECONDARY CONTEXT ELEMENT: COLLEAGUE LISTENING / LOOKING UP TO LEADER -->
  <g id="colleague" opacity="0.85">
    <!-- Body / Back of colleague on the left, looking at the leader -->
    <path d="M15 160 L35 160 L42 220 L8 220 Z" fill="#475569"/>
    <circle cx="25" cy="140" r="12" fill="#e0ac69"/>
    <!-- Colleague Hair -->
    <path d="M15 138 C15 128, 35 128, 35 138 C35 142, 33 136, 25 136 C17 136, 15 142, 15 138 Z" fill="#0f172a"/>
    <!-- Document in colleague's hand -->
    <rect x="30" y="165" width="18" height="22" rx="1" fill="#f1f5f9" transform="rotate(-15 30 165)"/>
    <line x1="33" y1="170" x2="43" y2="170" stroke="#94a3b8" stroke-width="1"/>
    <line x1="33" y1="174" x2="41" y2="174" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- FOREGROUND / POLISH DETAILS -->
  <!-- Floating Sparkles / Accent Glow representing Success & Leadership quality -->
  <g fill="#f59e0b">
    <circle cx="185" cy="55" r="2" opacity="0.8"/>
    <circle cx="195" cy="45" r="1.5" opacity="0.6"/>
    <circle cx="175" cy="38" r="1" opacity="0.9"/>
  </g>

  <!-- Decorative plant on desk edge for lively corporate environment -->
  <path d="M195 160 C195 150, 205 150, 205 160 Z" fill="#10b981"/>
  <path d="M200 160 C190 145, 185 135, 190 130 C195 135, 200 145, 200 160 Z" fill="#34d399"/>
  <path d="M201 160 C208 145, 218 140, 220 135 C216 142, 208 150, 201 160 Z" fill="#059669"/>
  <rect x="193" y="157" width="14" height="15" rx="3" fill="#cbd5e1"/>

  <!-- Clean Border / Frame Stroke to lock illustration -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>