<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Safety Cone (The "Prevention" Symbol) -->
  <path d="M180 180 L210 180 L200 120 Z" fill="#fb923c"/>
  <rect x="188" y="140" width="16" height="5" fill="#1e293b"/>
  
  <!-- Wet Floor Sign -->
  <rect x="30" y="130" width="40" height="50" rx="4" fill="#fbbf24"/>
  <circle cx="50" cy="145" r="8" fill="#1e293b"/>
  <path d="M40 160 L60 160 L50 175 Z" fill="#1e293b"/>
  
  <!-- Character: Worker preventing accident -->
  <g transform="translate(100, 80)">
    <!-- Body -->
    <rect x="-15" y="40" width="30" height="60" rx="5" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="20" fill="#fde68a"/>
    <!-- Hard Hat -->
    <path d="M-22 10 A22 22 0 0 1 22 10 L15 20 L-15 20 Z" fill="#fb923c"/>
    <!-- Arms -->
    <path d="M-15 50 L-40 70" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 50 L40 70" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="-12" y="100" width="8" height="20" fill="#1e293b"/>
    <rect x="4" y="100" width="8" height="20" fill="#1e293b"/>
  </g>
  
  <!-- Puddle on floor -->
  <ellipse cx="140" cy="200" rx="30" ry="8" fill="#10b981" opacity="0.4"/>
  
  <!-- Caution Tape Pattern -->
  <rect x="0" y="175" width="240" height="5" fill="#fbbf24"/>
  <rect x="0" y="175" width="240" height="5" fill="url(#stripes)"/>
  <defs>
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#1e293b" stroke-width="10"/>
    </pattern>
  </defs>
</svg>