<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Lab Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Blue Light for Transparency Effect -->
    <radialGradient id="glow-light" x1="50%" y1="50%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Material Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.3" />
    </linearGradient>
    
    <!-- Opaque Material Gradient (Comparison) -->
    <linearGradient id="opaque-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Clip Path for the Transparent Panel to show background items behind it -->
    <clipPath id="panel-clip">
      <rect x="95" y="70" width="75" height="95" rx="6" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light Cone from Desk Lamp -->
  <path d="M 160 30 L 120 180 L 210 180 Z" fill="url(#glow-light)" />

  <!-- Background Lab Interior Elements -->
  <!-- Back wall shelf -->
  <rect x="30" y="55" width="80" height="4" rx="2" fill="#64748b" />
  <circle cx="50" cy="45" r="8" fill="#10b981" opacity="0.8" />
  <path d="M 70 55 L 75 40 L 85 40 L 90 55 Z" fill="#f59e0b" opacity="0.8" />

  <!-- Window view / Ambient back glow -->
  <circle cx="180" cy="50" r="20" fill="#fbbf24" opacity="0.15" />

  <!-- SCENE CONTENT: Character examining transparent material -->
  
  <!-- Desk Surface -->
  <rect x="0" y="175" width="240" height="65" fill="url(#desk-grad)" />
  <rect x="0" y="175" width="240" height="4" fill="#64748b" opacity="0.6" />

  <!-- BACKDROP ITEMS (Visible THROUGH the transparent panel later) -->
  <!-- A cute potted desk plant behind the transparent panel -->
  <g id="plant-behind">
    <ellipse cx="132" cy="155" rx="12" ry="8" fill="#047857" />
    <path d="M 125 155 Q 132 130 138 155 Z" fill="#10b981" />
    <path d="M 132 155 Q 120 135 125 125 Q 132 145 132 155 Z" fill="#34d399" />
    <path d="M 132 155 Q 145 138 142 128 Q 135 145 132 155 Z" fill="#059669" />
    <path d="M 127 155 L 137 155 L 135 170 L 129 170 Z" fill="#f8fafc" />
  </g>

  <!-- Character: Scientist / Material Engineer (Left side, leaning in) -->
  <g id="scientist-character">
    <!-- Body / Lab Coat -->
    <path d="M 40 175 L 50 135 L 75 135 L 85 175 Z" fill="#f8fafc" />
    <!-- Lab coat lapels & shading -->
    <path d="M 57 135 L 62 160 L 67 135 Z" fill="#e2e8f0" />
    <path d="M 50 135 L 45 175 L 55 175 Z" fill="#cbd5e1" />
    <path d="M 75 135 L 80 175 L 70 175 Z" fill="#cbd5e1" />

    <!-- Head & Neck -->
    <path d="M 58 130 L 67 130 L 67 138 L 58 138 Z" fill="#fed7aa" />
    <circle cx="62.5" cy="115" r="14" fill="#fed7aa" />

    <!-- Hair -->
    <path d="M 48 115 C 48 100 77 100 77 115 C 75 110 50 110 48 115 Z" fill="#334155" />

    <!-- Safety Goggles on Forehead -->
    <rect x="53" y="106" width="19" height="6" rx="3" fill="#0ea5e9" />
    <path d="M 50 109 C 45 105 45 115 50 112" stroke="#0ea5e9" stroke-width="2" fill="none" />

    <!-- Facial Expression (Focused/Curious) -->
    <circle cx="68" cy="114" r="1.5" fill="#1e293b" />
    <!-- Eyebrow raised -->
    <path d="M 65 110 Q 69 108 72 111" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Gentle smile -->
    <path d="M 67 121 Q 69 123 71 121" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Arm reaching forward to hold the material -->
    <path d="M 65 145 Q 85 150 98 142" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="100" cy="141" r="4.5" fill="#fed7aa" />
  </g>

  <!-- THE MAIN SUBJECT: Transparent Material Panel being held/inspected -->
  <!-- We showcase transparency by letting the background plant be visible through it! -->
  <g id="transparent-material-panel">
    <!-- Panel Shadow -->
    <rect x="97" y="72" width="75" height="95" rx="6" fill="#000000" opacity="0.3" />
    
    <!-- Panel Base (Glass Fill with Clip Path for Background) -->
    <g clip-path="url(#panel-clip)">
      <!-- Extra background swatch inside the glass to show refraction/distortion -->
      <rect x="95" y="70" width="75" height="95" fill="url(#glass-grad)" />
      <!-- Amplified/Shifted view of the plant inside the glass -->
      <g transform="translate(4, -5) scale(1.1)">
        <ellipse cx="132" cy="155" rx="12" ry="8" fill="#047857" opacity="0.9" />
        <path d="M 125 155 Q 132 130 138 155 Z" fill="#10b981" opacity="0.9" />
        <path d="M 132 155 Q 120 135 125 125 Q 132 145 132 155 Z" fill="#34d399" opacity="0.9" />
      </g>
    </g>

    <!-- Glass Border & Specular Highlights (Crucial for "transparent" glossy look) -->
    <rect x="95" y="70" width="75" height="95" rx="6" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.9" />
    <!-- Diagonal light sheen across glass -->
    <path d="M 105 70 L 125 70 L 95 140 L 95 120 Z" fill="#ffffff" opacity="0.4" />
    <path d="M 150 165 L 165 165 L 165 130 Z" fill="#38bdf8" opacity="0.3" />
  </g>

  <!-- Comparison Props on Desk (To highlight material property context) -->
  <!-- Opaque Red Object (Contrast to transparent) -->
  <g id="opaque-object">
    <rect x="185" y="145" width="28" height="30" rx="4" fill="url(#opaque-grad)" />
    <!-- Shadow for opaque object -->
    <ellipse cx="199" cy="177" rx="14" ry="3" fill="#0f172a" opacity="0.6" />
    <!-- Highlight -->
    <path d="M 188 148 L 198 148 L 191 160 L 188 160 Z" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Desk Lamp on Right -->
  <g id="desk-lamp">
    <!-- Lamp Base -->
    <ellipse cx="195" cy="175" rx="15" ry="5" fill="#475569" />
    <!-- Lamp Stand -->
    <path d="M 195 175 L 180 80" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Lamp Head -->
    <path d="M 165 65 L 185 75 L 175 95 Z" fill="#334155" />
    <ellipse cx="170" cy="85" rx="8" ry="12" transform="rotate(25 170 85)" fill="#fbbf24" />
  </g>

  <!-- Scientific Measurement / Tech Accents (Subtle floating UI lines to emphasize precision/testing) -->
  <g opacity="0.6" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
    <!-- Dimension lines pointing to the transparent panel -->
    <path d="M 85 95 L 93 95" />
    <path d="M 85 140 L 93 140" />
    <path d="M 89 98 L 89 137" />
  </g>

  <!-- Sparkles / Clarity Highlights -->
  <path d="M 110 85 L 112 90 L 117 92 L 112 94 L 110 99 L 108 94 L 103 92 L 108 90 Z" fill="#ffffff" opacity="0.8" />
  <circle cx="150" cy="140" r="2" fill="#ffffff" opacity="0.9" />

  <!-- Foreground Frame Border / Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>