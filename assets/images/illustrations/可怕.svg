<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Moon/Lamp Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Monster Shadow Gradient -->
    <radialGradient id="shadowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Vignette / Atmospheric Fog -->
    <linearGradient id="fogGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Stars & Night Sky Details -->
  <g fill="#64748b" opacity="0.6">
    <circle cx="35" cy="40" r="1.5"/>
    <circle cx="85" cy="25" r="1"/>
    <circle cx="160" cy="35" r="2"/>
    <circle cx="210" cy="65" r="1"/>
    <circle cx="25" cy="90" r="1"/>
  </g>

  <!-- Distant Moody Moon -->
  <circle cx="195" cy="55" r="18" fill="#334155" opacity="0.4"/>
  <circle cx="190" cy="52" r="16" fill="#cbd5e1" opacity="0.2"/>

  <!-- Environment: Alleyway Brick Walls & Ground -->
  <!-- Left Wall -->
  <path d="M0,0 L70,25 L70,200 L0,240 Z" fill="#0f172a"/>
  <path d="M10,20 L60,38 L60,190 L10,225 Z" fill="#1e293b" opacity="0.5"/>
  <!-- Brick lines left -->
  <path d="M10,50 L60,65 M10,80 L60,95 M10,110 L60,125 M10,140 L60,155 M10,170 L60,185 M10,200 L60,215" stroke="#090d16" stroke-width="2" opacity="0.6"/>

  <!-- Right Wall -->
  <path d="M240,10 L170,30 L170,210 L240,240 Z" fill="#0f172a"/>
  <path d="M230,25 L180,40 L180,200 L230,220 Z" fill="#1e293b" opacity="0.5"/>
  <!-- Brick lines right -->
  <path d="M180,60 L230,48 M180,90 L230,76 M180,120 L230,104 M180,150 L230,132 M180,180 L230,160" stroke="#090d16" stroke-width="2" opacity="0.6"/>

  <!-- Cobblestone Ground -->
  <path d="M0,195 L120,165 L240,195 L240,240 L0,240 Z" fill="#0b0f19"/>
  <ellipse cx="120" cy="205" rx="90" ry="15" fill="#1e293b" opacity="0.3"/>

  <!-- Old Street Lamp emitting eerie warm light -->
  <path d="M210,0 L212,0 L212,90 L210,90 Z" fill="#334155"/>
  <path d="M195,85 L225,85 L230,110 L190,110 Z" fill="#1e293b"/>
  <!-- Lamp Glow Circle -->
  <circle cx="210" cy="115" r="45" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>
  <circle cx="210" cy="100" r="6" fill="#fde047" filter="url(#dropShadow)"/>

  <!-- Atmospheric Fog at Bottom -->
  <rect x="0" y="160" width="240" height="80" fill="url(#fogGrad)" pointer-events="none"/>

  <!-- ==================== MAIN SUBJECT: THE "SCARY" MONSTER ==================== -->
  <g transform="translate(130, 140)" filter="url(#dropShadow)">
    <!-- Monster Shadow/Aura on ground -->
    <ellipse cx="-10" cy="55" rx="35" ry="12" fill="url(#shadowGlow)"/>

    <!-- Soft Body / Fur Base -->
    <path d="M -30,15 
             C -45,-10 -35,-40 -10,-45 
             C 15,-50 35,-30 40,-5 
             C 45,20 30,45 10,50 
             C -10,55 -20,40 -30,15 Z" 
          fill="#8b5cf6"/>
          
    <!-- Fur/Spike bumps along the silhouette -->
    <path d="M -35,5 Q -48,0 -38,-15 Q -40,-30 -20,-35 Q -5,-48 10,-42 Q 30,-40 38,-20 Q 50,-10 42,10 Q 45,30 25,42 Q 5,55 -15,48 Q -30,40 -35,5" fill="#7c3aed"/>

    <!-- Monster Belly Accent (Cute yet eerie) -->
    <ellipse cx="-2" cy="20" rx="18" ry="22" fill="#a78bfa" opacity="0.6"/>

    <!-- Tiny Claws/Hands reaching out nervously/scarily -->
    <path d="M -35,20 C -45,15 -48,25 -42,30 C -38,32 -32,25 -35,20 Z" fill="#6d28d9"/>
    <path d="M 32,25 C 42,25 45,35 38,38 C 34,38 30,30 32,25 Z" fill="#6d28d9"/>

    <!-- Dramatic Large Glowing Eyes (Core of 'Scary' visual) -->
    <!-- Left Eye Socket -->
    <circle cx="-12" cy="-12" r="12" fill="#0f172a"/>
    <!-- Right Eye Socket -->
    <circle cx="14" cy="-8" r="12" fill="#0f172a"/>

    <!-- Glowing Yellow/Orange Irises -->
    <circle cx="-12" cy="-12" r="7" fill="#f59e0b"/>
    <circle cx="14" cy="-8" r="7" fill="#f59e0b"/>
    <!-- Intense Slit Pupils -->
    <ellipse cx="-12" cy="-12" rx="2" ry="5" fill="#0f172a"/>
    <ellipse cx="14" cy="-8" rx="2" ry="5" fill="#0f172a"/>
    <!-- Eye Highlights -->
    <circle cx="-14" cy="-15" r="1.5" fill="#ffffff"/>
    <circle cx="12" cy="-11" r="1.5" fill="#ffffff"/>

    <!-- Quirky Sharp Teeth in a Wide Grin -->
    <path d="M -15,8 Q 1,18 18,10" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -10,10 L -6,17 L -2,11 L 2,17 L 6,11 L 10,16 L 14,10 Z" fill="#f8fafc"/>
  </g>

  <!-- ==================== FOREGROUND CHARACTER: TRAVELER ==================== -->
  <g transform="translate(65, 135)" filter="url(#dropShadow)">
    <!-- Traveler Shadow -->
    <ellipse cx="0" cy="62" rx="18" ry="7" fill="#0b0f19" opacity="0.8"/>

    <!-- Backpack -->
    <rect x="-18" y="15" width="12" height="28" rx="4" fill="#3b82f6"/>
    <path d="M -18,22 L -6,22" stroke="#1d4ed8" stroke-width="2"/>

    <!-- Body / Coat (Traveler/Explorer theme) -->
    <path d="M -12,12 L 12,12 L 18,55 L -18,55 Z" fill="#0284c7"/>
    <!-- Coat lapel/details -->
    <path d="M 0,12 L 6,40 L -6,40 Z" fill="#0369a1"/>

    <!-- Scared Trembling Head / Face -->
    <circle cx="0" cy="-2" r="14" fill="#fde047"/> <!-- Face skin tone or helmet liner, let's use warm peach: #fed7aa -->
    <circle cx="0" cy="-2" r="14" fill="#fed7aa"/>

    <!-- Traveler Hat / Hood -->
    <path d="M -16,-6 C -16,-20 16,-20 16,-6 C 16,-2 12,2 0,2 C -12,2 -16,-2 -16,-6 Z" fill="#0369a1"/>
    <path d="M -19,-4 L 19,-4 L 14,-10 L -14,-10 Z" fill="#0284c7"/>

    <!-- Wide Fearful Eyes (Looking at Monster) -->
    <circle cx="-4" cy="-4" r="3.5" fill="#ffffff"/>
    <circle cx="5" cy="-4" r="3.5" fill="#ffffff"/>
    <!-- Pupils darting right towards monster -->
    <circle cx="-3" cy="-4" r="1.5" fill="#0f172a"/>
    <circle cx="6" cy="-4" r="1.5" fill="#0f172a"/>

    <!-- Open Shouting/Gasping Mouth -->
    <ellipse cx="1" cy="5" rx="3" ry="4.5" fill="#0f172a"/>

    <!-- Sweat Drop (Classic sign of fear/tension) -->
    <path d="M 10,-12 C 10,-12 14,-7 14,-4 C 14,-2 12,0 10,0 C 8,0 6,-2 6,-4 C 6,-7 10,-12 10,-12 Z" fill="#38bdf8" opacity="0.9"/>

    <!-- Trembling / Holding a Flashlight or Stick -->
    <!-- Arm holding defensive item -->
    <path d="M 12,15 C 22,20 28,15 32,8" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    <!-- Flashlight shaft -->
    <rect x="28" y="2" width="6" height="16" rx="2" fill="#cbd5e1" transform="rotate(25 31 10)" filter="url(#dropShadow)"/>
    <!-- Flashlight Beam shooting towards monster -->
    <polygon points="34,8 75,-10 70,25" fill="#fde047" opacity="0.3" style="mix-blend-mode: screen;"/>
  </g>

  <!-- Atmospheric Dust / Spores floating in the dark alley -->
  <g fill="#fde047" opacity="0.5">
    <circle cx="105" cy="110" r="1.5"/>
    <circle cx="125" cy="95" r="1"/>
    <circle cx="140" cy="130" r="2"/>
    <circle cx="95" cy="140" r="1"/>
    <circle cx="155" cy="100" r="1.5"/>
  </g>
</svg>