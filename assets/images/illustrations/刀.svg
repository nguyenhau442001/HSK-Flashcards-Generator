<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric lighting/glow -->
  <circle cx="120" cy="120" r="90" fill="#1e293b" opacity="0.6"/>
  <circle cx="150" cy="90" r="40" fill="#38bdf8" opacity="0.08" filter="blur(15px)"/>
  
  <!-- Wooden Cutting Board Surface -->
  <g transform="translate(120, 155) rotate(-8)">
    <!-- Board shadow -->
    <ellipse cx="0" cy="25" rx="75" ry="22" fill="#090d16" opacity="0.7"/>
    <!-- Main board -->
    <rect x="-75" y="-22" width="150" height="44" rx="22" fill="#b45309"/>
    <rect x="-72" y="-19" width="144" height="38" rx="19" fill="#d97706"/>
    <!-- Wood grain details -->
    <path d="M-50 -10 C -30 -5, -10 -15, 10 -5 C 30 5, 50 -2, 60 -10" stroke="#b45309" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M-40 8 C -20 12, 0 2, 20 10 C 40 18, 55 5, 65 12" stroke="#b45309" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <!-- Board hanging hole -->
    <circle cx="55" cy="0" r="5" fill="#0f172a" opacity="0.6"/>
  </g>

  <!-- Sliced Carrot (Props adding context) -->
  <g transform="translate(75, 135)">
    <ellipse cx="0" cy="5" rx="12" ry="7" fill="#090d16" opacity="0.5"/>
    <path d="M-15 0 L15 0 L10 10 L-10 10 Z" fill="#ea580c"/>
    <ellipse cx="0" cy="0" rx="15" ry="7" fill="#fb923c"/>
    <ellipse cx="0" cy="0" rx="9" ry="4" fill="#fbbf24"/>
  </g>
  <g transform="translate(95, 142) rotate(15)">
    <ellipse cx="0" cy="0" rx="13" ry="6" fill="#fb923c"/>
    <ellipse cx="0" cy="0" rx="7" ry="3" fill="#fbbf24"/>
  </g>

  <!-- Sliced Cucumber (Props adding context) -->
  <g transform="translate(155, 150)">
    <ellipse cx="0" cy="5" rx="10" ry="6" fill="#090d16" opacity="0.5"/>
    <path d="M-12 0 L12 0 L8 8 L-8 8 Z" fill="#15803d"/>
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="#22c55e"/>
    <ellipse cx="0" cy="0" rx="8" ry="4" fill="#dcfce7"/>
  </g>

  <!-- Action Sparkles / Motion -->
  <path d="M120 70 L125 60" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="110" cy="65" r="2" fill="#f59e0b"/>
  <circle cx="132" cy="78" r="1.5" fill="#38bdf8"/>

  <!-- Main Subject: The Knife (Dao) -->
  <!-- Angled dynamically across the canvas -->
  <g transform="translate(120, 100) rotate(-35)">
    <!-- Knife Drop Shadow -->
    <path d="M-90 12 L75 -3 C 82 -4, 88 1, 85 8 L78 22 C 75 28, 68 32, 60 30 L-85 18 Z" fill="#090d16" opacity="0.6" filter="blur(4px)"/>

    <!-- Blade Steel Body -->
    <path d="M-85 2 C -40 2, 40 0, 78 12 C 70 24, 20 26, -30 22 C -60 20, -85 10, -85 2 Z" fill="#e2e8f0"/>
    
    <!-- Blade Cutting Edge Highlight -->
    <path d="M-85 2 C -60 10, -30 20, -30 22 C 20 26, 70 24, 78 12 C 72 17, 25 21, -30 18 C -60 15, -80 7, -85 2 Z" fill="#f8fafc"/>

    <!-- Metallic Spine & Polish Gradient Effect -->
    <path d="M-85 2 C -40 2, 40 0, 78 12 C 74 6, 35 2, -40 3 C -65 3, -80 3, -85 2 Z" fill="#cbd5e1"/>

    <!-- Bolster / Ferrule (Metallic collar) -->
    <path d="M-87 -1 L-83 -1 L-83 14 L-87 14 Z" fill="#64748b" transform="rotate(4 -85 6)"/>
    <path d="M-86 0 L-84 0 L-84 13 L-86 13 Z" fill="#94a3b8"/>

    <!-- Ergonomic Handle -->
    <!-- Tang / Base -->
    <path d="M-125 -6 C -110 -8, -95 -5, -86 -3 L-86 14 C -95 15, -110 17, -125 13 C -132 11, -135 4, -125 -6 Z" fill="#334155"/>
    
    <!-- Wooden/Composite Handle Scales -->
    <path d="M-127 -8 C -112 -10, -96 -7, -87 -5 L-87 16 C -96 18, -112 20, -127 15 C -135 12, -138 3, -127 -8 Z" fill="#1e293b"/>
    <path d="M-124 -6 C -110 -8, -95 -5, -87 -4 L-87 15 C -95 16, -110 18, -124 13 C -131 11, -133 3, -124 -6 Z" fill="#b45309"/>
    <path d="M-123 -5 C -110 -7, -95 -4, -87 -3 L-87 14 C -95 15, -110 17, -123 12 C -130 10, -131 3, -123 -5 Z" fill="#d97706"/>

    <!-- Handle Rivets (Brass Pins) -->
    <circle cx="-115" cy="4" r="1.5" fill="#fbbf24"/>
    <circle cx="-115" cy="4" r="0.7" fill="#d97706"/>
    
    <circle cx="-97" cy="6" r="1.5" fill="#fbbf24"/>
    <circle cx="-97" cy="6" r="0.7" fill="#d97706"/>

    <!-- Blade Edge Gleam (Sharpness indicator) -->
    <path d="M-50 12 L 20 18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Ambient Floating Leaf / Herb Garnish (adds dynamic touch) -->
  <g transform="translate(170, 75) rotate(25)">
    <path d="M0 0 C 8 -8, 15 -2, 10 8 C 5 18, -2 12, 0 0 Z" fill="#10b981"/>
    <path d="M0 0 C 3 4, 6 6, 10 8" stroke="#065f46" stroke-width="1" fill="none"/>
  </g>
  <g transform="translate(55, 95) rotate(-45)">
    <path d="M0 0 C 6 -6, 12 -1, 8 6 C 4 13, -2 9, 0 0 Z" fill="#34d399"/>
  </g>
</svg>