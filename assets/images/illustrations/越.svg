<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Window Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Frost/Ice Gradient -->
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Scarf Gradient -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Mug Gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Outdoor Scene (Visible through window): Heavy Snow & Pine Trees -->
  <g id="outdoor-scene">
    <!-- Distant mountains / hills -->
    <path d="M 20 180 Q 70 120 120 160 T 220 150 L 220 220 L 20 220 Z" fill="#334155" opacity="0.6"/>
    
    <!-- Pine Trees in Snow -->
    <polygon points="50,170 40,190 60,190" fill="#475569"/>
    <polygon points="50,150 42,175 58,175" fill="#64748b"/>
    <polygon points="180,165 170,190 190,190" fill="#475569"/>
    <polygon points="180,145 172,170 188,170" fill="#64748b"/>
    <polygon points="200,175 192,195 208,195" fill="#475569"/>

    <!-- Snow Ground -->
    <path d="M 20 190 Q 90 185 140 190 T 220 188 L 220 220 L 20 220 Z" fill="#f8fafc"/>

    <!-- Falling Snowflakes (Intensifying from top to bottom) -->
    <circle cx="45" cy="40" r="1.5" fill="#ffffff" opacity="0.4"/>
    <circle cx="85" cy="70" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="130" cy="50" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="175" cy="80" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="210" cy="45" r="1.5" fill="#ffffff" opacity="0.5"/>

    <circle cx="35" cy="100" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="70" cy="120" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="115" cy="105" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="160" cy="115" r="3.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="195" cy="95" r="2" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Window Frame & Interior Wall -->
  <g id="window-frame">
    <!-- Window Outer Sill/Depth -->
    <rect x="25" y="25" width="190" height="190" rx="12" fill="none" stroke="url(#frameGrad)" stroke-width="12"/>
    
    <!-- Frost Creeping on Window Corners (Showing progressive cold) -->
    <path d="M 31 31 L 70 31 L 31 70 Z" fill="url(#frostGrad)"/>
    <path d="M 209 31 L 170 31 L 209 75 Z" fill="url(#frostGrad)"/>
    <path d="M 31 209 L 31 160 L 80 209 Z" fill="url(#frostGrad)"/>
    <path d="M 209 209 L 209 165 L 160 209 Z" fill="url(#frostGrad)"/>
  </g>

  <!-- Indoor Interior Shelf / Sill at Bottom -->
  <rect x="20" y="200" width="200" height="20" rx="4" fill="#334155"/>
  <rect x="15" y="215" width="210" height="8" rx="2" fill="#1e293b"/>

  <!-- Progressive Element 1: Cute Penguin/Character bundling up (Getting colder!) -->
  <g id="bundled-character" transform="translate(45, 125)">
    <!-- Body (Chubby Penguin/Creature) -->
    <ellipse cx="30" cy="50" rx="22" ry="26" fill="#1e293b"/>
    <ellipse cx="30" cy="52" rx="15" ry="19" fill="#f8fafc"/>
    
    <!-- Cheeks (Cold Pink) -->
    <circle cx="21" cy="45" r="3" fill="#f43f5e" opacity="0.6"/>
    <circle cx="39" cy="45" r="3" fill="#f43f5e" opacity="0.6"/>

    <!-- Eyes (Happy/Squinted from cold) -->
    <path d="M 22 40 Q 24 37 26 40" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 34 40 Q 36 37 38 40" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Beak -->
    <polygon points="30,44 26,47 34,47" fill="#fbbf24"/>

    <!-- Warm Beanie Hat -->
    <ellipse cx="30" cy="27" rx="17" ry="9" fill="#f59e0b"/>
    <path d="M 12 28 C 15 22 45 22 48 28 Z" fill="#d97706"/>
    <!-- Pom-pom -->
    <circle cx="30" cy="15" r="5" fill="#ef4444"/>

    <!-- Thick Cozy Scarf (Progressive warmth wrapping) -->
    <path d="M 15 48 C 20 54 40 54 45 48 C 45 53 40 57 30 57 C 20 57 15 53 15 48 Z" fill="url(#scarfGrad)"/>
    <!-- Scarf Tails hanging -->
    <path d="M 38 54 L 44 72 L 38 74 L 33 56 Z" fill="#ef4444"/>
    <path d="M 44 72 L 46 71" stroke="#b91c1c" stroke-width="2"/>
    <path d="M 42 75 L 44 74" stroke="#b91c1c" stroke-width="2"/>
  </g>

  <!-- Progressive Element 2: Steaming Hot Mug of Cocoa on Windowsill -->
  <g id="hot-mug" transform="translate(145, 155)">
    <!-- Saucer -->
    <ellipse cx="25" cy="47" rx="22" ry="6" fill="#cbd5e1"/>
    <ellipse cx="25" cy="46" rx="20" ry="4" fill="#f1f5f9"/>

    <!-- Mug Body -->
    <path d="M 12 20 L 38 20 C 39 38 37 44 35 44 L 15 44 C 13 44 11 38 12 20 Z" fill="url(#mugGrad)"/>
    
    <!-- Mug Rim -->
    <ellipse cx="25" cy="20" rx="13" ry="4" fill="#bae6fd"/>

    <!-- Mug Handle -->
    <path d="M 37 25 C 46 25 46 38 35 40" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

    <!-- Marshmallow inside -->
    <circle cx="23" cy="20" r="3" fill="#ffffff"/>
    <circle cx="28" cy="21" r="2.5" fill="#ffffff"/>

    <!-- Rising Steam (Curved, dynamic vectors showing heat vs cold outside) -->
    <path d="M 21 13 Q 17 5 23 -2 T 21 -15" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 29 11 Q 33 3 27 -4 T 31 -17" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Thermometer showing dropping temperature (Visual reinforcing 'càng ngày càng' / increasingly) -->
  <g id="thermometer" transform="translate(110, 85)">
    <!-- Backboard -->
    <rect x="-4" y="-10" width="8" height="65" rx="4" fill="#475569" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Tube -->
    <rect x="-1.5" y="-5" width="3" height="50" rx="1.5" fill="#1e293b"/>
    
    <!-- Bulb at bottom -->
    <circle cx="0" cy="45" r="4.5" fill="#ef4444"/>
    
    <!-- Mercury Level (Dropping low into the bulb) -->
    <rect x="-1" y="32" width="2" height="13" rx="1" fill="#ef4444"/>
    
    <!-- Temperature Tick Marks -->
    <line x1="-3" y1="0" x2="-1" y2="0" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="-3" y1="10" x2="-1" y2="10" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="-3" y1="20" x2="-1" y2="20" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="-3" y1="30" x2="-1" y2="30" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Ambient Glow Inside -->
  <rect x="25" y="25" width="190" height="190" rx="12" fill="url(#warmGlow)" pointer-events="none"/>
</svg>