<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Lamp Light Cone Gradient -->
    <linearGradient id="lampLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Radial Glow for Lamp Bulb -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Folder Gradient -->
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Soft Drop Shadow for Floating Elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.5" />
    </filter>
    
    <!-- Paper Shadow -->
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#090d16" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Background Glow -->
  <circle cx="120" cy="100" r="80" fill="#1e3a8a" opacity="0.2" filter="blur(20px)" />

  <!-- Desk Surface -->
  <path d="M 0 150 L 240 140 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <!-- Desk Separator Line -->
  <line x1="0" y1="150" x2="240" y2="140" stroke="#334155" stroke-width="1" opacity="0.5" />

  <!-- Background Props: Potted Plant -->
  <g transform="translate(210, 115)">
    <!-- Pot -->
    <polygon points="-10,25 10,25 7,45 -7,45" fill="#c2410c" />
    <ellipse cx="0" cy="25" rx="10" ry="2" fill="#ea580c" />
    <!-- Plant Leaves -->
    <path d="M 0 25 C -12 15 -15 5 -10 -5 C -5 5 -2 15 0 25" fill="#047857" />
    <path d="M 0 25 C 12 15 15 5 10 -5 C 5 5 2 15 0 25" fill="#059669" />
    <path d="M 0 25 C -5 10 -8 -10 0 -15 C 8 -10 5 10 0 25" fill="#10b981" />
  </g>

  <!-- Light Beam from Desk Lamp (Behind the main resume, before foreground props) -->
  <polygon points="40,55 220,240 70,240" fill="url(#lampLight)" />

  <!-- Main Subject: The Resume (简历) Portfolio -->
  <g transform="translate(115, 155) rotate(-6)" filter="url(#dropShadow)">
    <!-- Underlay Folder -->
    <path d="M -52 -72 L -20 -72 L -12 -64 L 52 -64 L 52 72 L -52 72 Z" fill="url(#folderGrad)" rx="4" />
    <!-- Folder Clip/Accents -->
    <rect x="-44" y="-60" width="8" height="12" rx="1" fill="#025a87" opacity="0.6" />
    
    <!-- The Resume Paper Sheet -->
    <g transform="translate(-2, 2)" filter="url(#paperShadow)">
      <rect x="-46" y="-66" width="92" height="130" rx="2" fill="#f8fafc" />

      <!-- Resume Header: Avatar Placeholder -->
      <g transform="translate(-28, -48)">
        <circle cx="0" cy="0" r="11" fill="#e2e8f0" />
        <!-- Simplified Avatar Icon inside -->
        <circle cx="0" cy="-2" r="4.5" fill="#94a3b8" />
        <path d="M -7 7 C -7 3 -4 2 0 2 C 4 2 7 3 7 7 Z" fill="#94a3b8" />
      </g>

      <!-- Resume Header: Name & Title Lines -->
      <rect x="-11" y="-55" width="45" height="6" rx="2" fill="#334155" />
      <rect x="-11" y="-45" width="30" height="4" rx="1.5" fill="#64748b" />
      <rect x="-11" y="-38" width="40" height="3" rx="1" fill="#94a3b8" />

      <!-- Divider Line -->
      <line x1="-36" y1="-28" x2="36" y2="-28" stroke="#cbd5e1" stroke-width="1" />

      <!-- Section 1: Experience (Abstract Lines) -->
      <rect x="-36" y="-20" width="25" height="5" rx="1.5" fill="#0284c7" />
      
      <!-- Job 1 -->
      <circle cx="-32" cy="-8" r="2" fill="#38bdf8" />
      <rect x="-26" y="-10" width="55" height="4" rx="1.5" fill="#475569" />
      <rect x="-26" y="-3" width="62" height="3" rx="1" fill="#cbd5e1" />

      <!-- Job 2 -->
      <circle cx="-32" cy="7" r="2" fill="#38bdf8" />
      <rect x="-26" y="5" width="45" height="4" rx="1.5" fill="#475569" />
      <rect x="-26" y="12" width="58" height="3" rx="1" fill="#cbd5e1" />

      <!-- Section 2: Education / Skills -->
      <rect x="-36" y="22" width="25" height="5" rx="1.5" fill="#0284c7" />
      
      <!-- Skill Tags -->
      <rect x="-36" y="32" width="22" height="6" rx="2" fill="#e0f2fe" />
      <rect x="-36" y="34" width="14" height="2" rx="1" fill="#0284c7" />

      <rect x="-10" y="32" width="26" height="6" rx="2" fill="#e0f2fe" />
      <rect x="-10" y="34" width="18" height="2" rx="1" fill="#0284c7" />

      <rect x="20" y="32" width="16" height="6" rx="2" fill="#e0f2fe" />
      <rect x="20" y="34" width="10" height="2" rx="1" fill="#0284c7" />

      <!-- Decorative Gold Seal of Approval (Bottom Right) -->
      <g transform="translate(26, 50)" fill="#fbbf24">
        <!-- Ribbon -->
        <path d="M -4 4 L -6 16 L 0 12 L 6 16 L 4 4 Z" fill="#f59e0b" />
        <circle cx="0" cy="0" r="7" />
        <circle cx="0" cy="0" r="5" fill="#f59e0b" />
      </g>
    </g>
  </g>

  <!-- Foreground Props: Sleek Pen resting on desk -->
  <g transform="translate(65, 185) rotate(40)" filter="url(#dropShadow)">
    <rect x="-3" y="-20" width="6" height="40" rx="1.5" fill="#0f172a" />
    <rect x="-3" y="-10" width="6" height="25" fill="#06b6d4" />
    <!-- Pen Tip -->
    <path d="M -3 -20 L 3 -20 L 0 -26 Z" fill="#94a3b8" />
    <!-- Pen Clip -->
    <rect x="2" y="-12" width="1.5" height="12" rx="0.5" fill="#cbd5e1" />
  </g>

  <!-- Foreground Props: Coffee Cup -->
  <g transform="translate(185, 175)" filter="url(#dropShadow)">
    <!-- Saucer -->
    <ellipse cx="0" cy="12" rx="18" ry="5" fill="#334155" />
    <ellipse cx="0" cy="11" rx="14" ry="4" fill="#475569" />
    <!-- Cup Body -->
    <path d="M -11 -8 L 11 -8 C 11 4 8 10 0 10 C -8 10 -11 4 -11 -8 Z" fill="#f43f5e" />
    <!-- Cup Opening/Coffee -->
    <ellipse cx="0" cy="-8" rx="11" ry="3" fill="#ec4899" />
    <ellipse cx="0" cy="-7" rx="9" ry="2.5" fill="#7c2d12" />
    <!-- Handle -->
    <path d="M 10 -5 C 15 -5 15 5 10 5" stroke="#f43f5e" stroke-width="2.5" fill="none" />
    <!-- Steam -->
    <path d="M -4 -14 Q -6 -18 -3 -22 T -5 -28" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 3 -13 Q 1 -17 4 -21 T 2 -27" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>

  <!-- Foreground Props: Glasses resting on desk -->
  <g transform="translate(110, 210)" filter="url(#dropShadow)">
    <!-- Left Frame -->
    <circle cx="-16" cy="0" r="10" stroke="#94a3b8" stroke-width="2" fill="#38bdf8" fill-opacity="0.1" />
    <!-- Right Frame -->
    <circle cx="16" cy="0" r="10" stroke="#94a3b8" stroke-width="2" fill="#38bdf8" fill-opacity="0.1" />
    <!-- Bridge -->
    <path d="M -6 -2 Q 0 -5 6 -2" stroke="#94a3b8" stroke-width="2" fill="none" />
    <!-- Temples (Sides) -->
    <path d="M -26 0 L -34 -4" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 26 0 L 34 -4" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Glass Glare -->
    <path d="M -22 -4 L -14 4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 10 -4 L 18 4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Desk Lamp (Left Foreground) -->
  <g transform="translate(35, 120)">
    <!-- Lamp Base -->
    <ellipse cx="0" cy="40" rx="16" ry="6" fill="#334155" />
    <ellipse cx="0" cy="38" rx="14" ry="5" fill="#475569" />
    
    <!-- Lamp Arm (Curved) -->
    <path d="M 0 38 Q -10 10 5 -15 Q 15 -32 30 -35" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
    <path d="M 0 38 Q -10 10 5 -15 Q 15 -32 30 -35" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Lamp Head Joint -->
    <circle cx="30" cy="-35" r="4.5" fill="#f59e0b" />

    <!-- Lamp Head / Shade -->
    <g transform="translate(30, -35) rotate(25)">
      <!-- Shade Cone -->
      <path d="M -8 0 L 8 0 L 14 18 L -14 18 Z" fill="#f43f5e" />
      <!-- Light Bulb & Glow -->
      <ellipse cx="0" cy="18" rx="10" ry="3" fill="url(#bulbGlow)" />
    </g>
  </g>

  <!-- Ambient Light Particles (Dust Motes in Light Beam) -->
  <circle cx="100" cy="160" r="1.5" fill="#fef08a" opacity="0.6" />
  <circle cx="145" cy="185" r="2" fill="#fef08a" opacity="0.4" />
  <circle cx="120" cy="130" r="1" fill="#fef08a" opacity="0.5" />
  <circle cx="170" cy="210" r="2.5" fill="#fef08a" opacity="0.3" />
</svg>