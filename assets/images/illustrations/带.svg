<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <clipPath id="roundedCorners">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  
  <g clip-path="url(#roundedCorners)">
    <!-- Airport Window Background -->
    <path d="M20 40 Q120 20 220 40 L220 140 Q120 160 20 140 Z" fill="#334155" opacity="0.3" />
    
    <!-- Stylized Airplane outside -->
    <path d="M160 80 L190 75 L195 65 L200 75 L220 72 L200 85 L195 100 L190 85 Z" fill="#38bdf8" opacity="0.6" />
    
    <!-- Terminal Floor -->
    <rect x="0" y="180" width="240" height="60" fill="#1e293b" />
    <rect x="0" y="180" width="240" height="2" fill="#334155" />

    <!-- Suitcase -->
    <rect x="40" y="150" width="50" height="70" rx="6" fill="#10b981" />
    <rect x="55" y="140" width="20" height="10" rx="2" fill="#475569" />
    <rect x="45" y="165" width="40" height="4" rx="2" fill="#065f46" opacity="0.5" />
    <rect x="45" y="175" width="40" height="4" rx="2" fill="#065f46" opacity="0.5" />
    <circle cx="50" cy="220" r="4" fill="#0f172a" />
    <circle cx="80" cy="220" r="4" fill="#0f172a" />

    <!-- Character (Traveler) -->
    <!-- Body -->
    <path d="M110 240 Q110 160 150 160 Q190 160 190 240" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="150" cy="130" r="22" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M128 130 Q128 108 150 108 Q172 108 172 130 L172 125 Q172 115 150 115 Q128 115 128 125 Z" fill="#475569" />
    
    <!-- Arm reaching out -->
    <path d="M155 185 Q120 185 105 170" stroke="#fcd34d" stroke-width="12" stroke-linecap="round" fill="none" />
    
    <!-- The Passport (The Focus) -->
    <g transform="translate(85, 155) rotate(-10)">
      <rect width="28" height="40" rx="3" fill="#991b1b" />
      <!-- Passport Emblem (Abstract) -->
      <circle cx="14" cy="18" r="6" stroke="#fbbf24" stroke-width="1.5" fill="none" />
      <line x1="14" y1="12" x2="14" y2="24" stroke="#fbbf24" stroke-width="1" />
      <line x1="8" y1="18" x2="20" y2="18" stroke="#fbbf24" stroke-width="1" />
      <rect x="6" y="28" width="16" height="2" fill="#fbbf24" opacity="0.6" />
    </g>
    
    <!-- Hand holding passport -->
    <path d="M105 170 Q95 170 95 180" stroke="#fcd34d" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Counter Edge -->
    <path d="M0 200 L80 200 L100 240 L0 240 Z" fill="#1e293b" opacity="0.8" />
    <path d="M0 200 L80 200" stroke="#334155" stroke-width="2" />
  </g>
  
  <!-- Subtle Glows -->
  <circle cx="150" cy="130" r="60" fill="#fbbf24" opacity="0.05" />
  <circle cx="100" cy="170" r="40" fill="#38bdf8" opacity="0.1" />
</svg>