<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Receipt Paper Shadow & Texture -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="100" r="100" fill="url(#spotlight)"/>

  <!-- Background Bookshelf / Wall Context (Subtle) -->
  <g fill="#334155" opacity="0.3">
    <rect x="30" y="40" width="180" height="6" rx="3"/>
    <rect x="40" y="25" width="12" height="15" rx="2"/>
    <rect x="55" y="20" width="10" height="20" rx="2"/>
    <rect x="180" y="22" width="14" height="18" rx="2"/>
  </g>

  <!-- Wooden Counter / Table Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#table-grad)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2"/>

  <!-- SCENE OBJECTS: Stack of Books (representing the "books" in the example) -->
  <g filter="url(#shadow)">
    <!-- Bottom Book -->
    <path d="M 50 160 L 110 145 L 145 158 L 85 173 Z" fill="#0284c7"/>
    <path d="M 50 163 L 110 148 L 110 154 L 50 169 Z" fill="#0369a1"/>
    
    <!-- Middle Book -->
    <path d="M 55 145 L 115 130 L 145 142 L 85 157 Z" fill="#10b981"/>
    <path d="M 55 148 L 115 133 L 115 139 L 55 154 Z" fill="#059669"/>

    <!-- Top Book -->
    <path d="M 62 130 L 120 117 L 150 128 L 92 141 Z" fill="#ec4899"/>
    <path d="M 62 133 L 120 120 L 120 125 L 62 138 Z" fill="#db2777"/>
  </g>

  <!-- SCENE OBJECTS: Cash Register / Calculator / Total Receipt (The core 'Total' concept) -->
  <g filter="url(#shadow)" transform="translate(100, 75)">
    <!-- Cash Register Body -->
    <path d="M 15 65 L 75 45 L 95 70 L 35 90 Z" fill="#475569"/>
    <path d="M 15 35 L 75 15 L 75 45 L 15 65 Z" fill="#64748b"/>
    <path d="M 75 15 L 105 25 L 95 70 L 75 45 Z" fill="#334155"/>

    <!-- Register Screen -->
    <rect x="35" y="25" width="25" height="15" rx="3" transform="skewY(-15)" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="43" cy="33" r="2" fill="#38bdf8"/>
    <circle cx="51" cy="31" r="2" fill="#38bdf8"/>

    <!-- Register Buttons / Cash Drawer -->
    <rect x="25" y="55" width="40" height="20" rx="2" transform="skewY(-15)" fill="#1e293b"/>
    <line x1="32" y1="62" x2="58" y2="54" stroke="#475569" stroke-width="2"/>

    <!-- Shopping Basket / Coins Accent -->
    <circle cx="20" cy="85" r="12" fill="url(#gold-grad)"/>
    <circle cx="20" cy="85" r="9" fill="#fbbf24"/>
    <text x="17" y="89" font-family="sans-serif" font-weight="bold" font-size="12" fill="#78350f">$</text>

    <circle cx="-5" cy="80" r="9" fill="url(#gold-grad)"/>
    <text x="-8" y="84" font-family="sans-serif" font-weight="bold" font-size="10" fill="#78350f">$</text>
  </g>

  <!-- SCENE OBJECTS: Flying Long Receipt (Showing 'Total' / 一共 calculation) -->
  <g filter="url(#shadow)" transform="translate(130, 30)">
    <!-- Receipt Paper -->
    <path d="M 10 10 L 45 0 L 50 85 L 15 95 Z" fill="#f8fafc"/>
    
    <!-- Receipt Serrated Bottom -->
    <path d="M 15 95 L 20 100 L 25 95 L 30 100 L 35 95 L 40 100 L 45 95 L 50 85 L 15 85 Z" fill="#f8fafc"/>

    <!-- Receipt Header Icon (Mini Barcode / Checkmark) -->
    <rect x="20" y="10" width="20" height="4" rx="1" fill="#cbd5e1"/>
    <circle cx="20" cy="20" r="2" fill="#cbd5e1"/>
    <circle cx="26" cy="20" r="2" fill="#cbd5e1"/>
    <circle cx="32" cy="20" r="2" fill="#cbd5e1"/>

    <!-- Line items -->
    <line x1="20" y1="30" x2="40" y2="27" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="20" y1="40" x2="38" y2="37" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="20" y1="50" x2="35" y2="47" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Dashed separator -->
    <line x1="18" y1="60" x2="44" y2="57" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- TOTAL HIGHLIGHT (Emphasizing 一共 / Total Amount) -->
    <rect x="17" y="66" width="29" height="14" rx="2" fill="#10b981"/>
    <!-- Currency Symbol/Total Indicator on Receipt -->
    <path d="M 23 76 L 27 71 L 31 76" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="73" r="2" fill="#ffffff"/>
  </g>

  <!-- Sparkles / Action Accents for Emphasis -->
  <g fill="#fbbf24">
    <path d="M 200 60 L 203 70 L 213 73 L 203 76 L 200 86 L 197 76 L 187 73 L 197 70 Z"/>
    <path d="M 40 80 L 42 85 L 47 87 L 42 89 L 40 94 L 38 89 L 33 87 L 38 85 Z" transform="scale(0.7) translate(20, 20)"/>
  </g>
  <g fill="#38bdf8">
    <path d="M 170 120 L 172 125 L 177 127 L 172 129 L 170 134 L 168 129 L 163 127 L 168 125 Z"/>
  </g>

  <!-- Foreground Atmospheric Bubble / Focus Ring -->
  <circle cx="140" cy="110" r="70" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" stroke-dasharray="8 8"/>
</svg>