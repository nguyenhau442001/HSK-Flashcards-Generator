<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Bicycle Frame -->
  <path d="M60 160 L120 160 L90 110 Z" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="60" cy="160" r="25" fill="none" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="120" cy="160" r="25" fill="none" stroke="#94a3b8" stroke-width="5"/>
  
  <!-- Character -->
  <g transform="translate(130, 80)">
    <circle cx="30" cy="30" r="15" fill="#fbbf24"/>
    <path d="M15 60 L25 100 M45 60 L55 100" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 45 L30 80" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 70 L50 90" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Tool (Wrench) -->
  <path d="M160 150 L180 130" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="185" cy="125" r="8" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  
  <!-- Environment Details -->
  <rect x="20" y="190" width="200" height="10" rx="2" fill="#334155"/>
  <circle cx="40" cy="205" r="5" fill="#10b981"/>
  <circle cx="60" cy="205" r="5" fill="#ec4899"/>
  <circle cx="80" cy="205" r="5" fill="#fb923c"/>
  
  <!-- Lighting/Accent -->
  <circle cx="200" cy="40" r="30" fill="#f59e0b" opacity="0.1"/>
  <circle cx="200" cy="40" r="15" fill="#f59e0b" opacity="0.2"/>
</svg>