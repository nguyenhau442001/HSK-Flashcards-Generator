<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Subject: A person performing a strange action (balancing a stack of books on their head while drinking tea) -->
  <g transform="translate(60, 50)">
    <!-- Body -->
    <path d="M40 140 C40 110, 80 110, 80 140 L80 180 L40 180 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="90" r="25" fill="#fbbf24"/>
    <!-- Strange Action: Books -->
    <rect x="45" y="40" width="30" height="10" rx="2" fill="#ec4899"/>
    <rect x="40" y="50" width="40" height="10" rx="2" fill="#10b981"/>
    <rect x="45" y="60" width="30" height="10" rx="2" fill="#fb923c"/>
    
    <!-- Arm holding cup -->
    <path d="M80 130 L100 110" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="105" cy="105" r="8" fill="#f59e0b"/>
    
    <!-- Leg -->
    <path d="M50 180 L40 210" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <path d="M70 180 L80 210" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Environment Props -->
  <circle cx="180" cy="190" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M170 180 L190 200 M190 180 L170 200" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Atmospheric accents -->
  <circle cx="30" cy="40" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="210" cy="70" r="6" fill="#10b981" opacity="0.4"/>
  <circle cx="150" cy="30" r="3" fill="#ec4899" opacity="0.5"/>
</svg>