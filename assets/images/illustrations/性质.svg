<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Lab Glow Gradient -->
    <radialGradient id="labGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Water Liquid Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>

    <!-- Floating Anomaly / Magic Water Glow -->
    <radialGradient id="anomalyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Lab Environment -->
  <!-- Ambient Lab Glow -->
  <circle cx="120" cy="130" r="90" fill="url(#labGlow)" />

  <!-- Window frame background element -->
  <path d="M170 30 L210 30 L210 110 L170 110 Z" fill="url(#windowLight)" stroke="#334155" stroke-width="2" />
  <line x1="190" y1="30" x2="190" y2="110" stroke="#334155" stroke-width="1.5" />
  <line x1="170" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="1.5" />

  <!-- Lab Shelf with props -->
  <rect x="25" y="55" g="75" width="70" height="6" rx="3" fill="#334155" />
  <!-- Small bottles on shelf -->
  <path d="M38 43 L44 43 L44 55 L38 55 Z" fill="#10b981" opacity="0.8" />
  <circle cx="41" cy="41" r="3" fill="#10b981" opacity="0.9" />
  <path d="M55 39 L63 39 L63 55 L55 55 Z" fill="#f59e0b" opacity="0.8" />
  <path d="M75 47 L83 47 L83 55 L75 55 Z" fill="#ec4899" opacity="0.8" />

  <!-- Laboratory Workbench -->
  <rect x="15" y="185" width="210" height="15" rx="4" fill="#334155" />
  <rect x="30" y="200" width="12" height="30" fill="#1e293b" />
  <rect x="198" y="200" width="12" height="30" fill="#1e293b" />

  <!-- Scientific Equipment (Microscope / Stand) -->
  <path d="M180 140 L195 140 L200 185 L175 185 Z" fill="#475569" />
  <path d="M182 130 L193 130 L190 145 L185 145 Z" fill="#64748b" />
  <path d="M172 120 L188 126 L184 135 L168 129 Z" fill="#94a3b8" />

  <!-- CHARACTER: Scientist / Curious Observer -->
  <!-- Body/Lab Coat -->
  <path d="M75 160 C75 145 95 140 105 140 C115 140 135 145 135 160 L140 185 L70 185 Z" fill="#cbd5e1" />
  <!-- Lab coat lapels -->
  <path d="M95 140 L105 165 L115 140" fill="none" stroke="#94a3b8" stroke-width="2" />
  <!-- Blue Shirt inside -->
  <path d="M98 140 L105 155 L112 140 Z" fill="#0284c7" />

  <!-- Head & Hair -->
  <circle cx="105" cy="115" r="18" fill="#ffedd5" />
  <!-- Hair (Styled, expressive) -->
  <path d="M87 115 C87 100 100 95 110 97 C122 99 125 112 125 120 C120 120 115 110 105 110 C95 110 89 112 87 115 Z" fill="#334155" />
  <!-- Round expressive glasses -->
  <circle cx="98" cy="116" r="5" fill="none" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="112" cy="116" r="5" fill="none" stroke="#f59e0b" stroke-width="1.5" />
  <line x1="103" y1="116" x2="107" y2="116" stroke="#f59e0b" stroke-width="1.5" />

  <!-- Facial Expression (Amazed/Curious) -->
  <circle cx="98" cy="115" r="1" fill="#1e293b" />
  <circle cx="112" cy="115" r="1" fill="#1e293b" />
  <path d="M103 124 Q105 128 107 124" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <!-- Rosy Cheeks -->
  <circle cx="93" cy="120" r="2.5" fill="#f43f5e" opacity="0.4" />
  <circle cx="117" cy="120" r="2.5" fill="#f43f5e" opacity="0.4" />

  <!-- Arms reaching out to experiment -->
  <!-- Left arm -->
  <path d="M78 150 L60 145 L50 155" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="48" cy="157" r="4" fill="#ffedd5" />
  <!-- Right arm -->
  <path d="M132 150 L145 140 L140 130" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="138" cy="127" r="4" fill="#ffedd5" />

  <!-- MAIN FOCUS: The Unique Water Experiment (Beaker & Unusual Properties) -->
  <g transform="translate(70, 135)">
    <!-- Beaker Base Stand / Shadow -->
    <ellipse cx="35" cy="50" rx="22" ry="6" fill="#000000" opacity="0.4" />

    <!-- Glass Beaker -->
    <path d="M20 10 L50 10 L55 50 C55 55 50 58 45 58 L25 58 C20 58 15 55 15 50 Z" fill="#ffffff" fill-opacity="0.1" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
    <path d="M18 10 L52 10" fill="none" stroke="#ffffff" stroke-width="2" />

    <!-- Liquid inside Beaker (Water) -->
    <path d="M17 28 L53 28 L54 50 C54 55 50 57 45 57 L25 57 C20 57 16 55 16 50 Z" fill="url(#waterGrad)" />
    <!-- Water surface meniscus -->
    <ellipse cx="35" cy="28" rx="18" ry="4" fill="#7dd3fc" opacity="0.8" />

    <!-- SPECIAL ANOMALY: Water exhibiting extraordinary properties (levitating glowing droplets & anti-gravity strand) -->
    <circle cx="35" cy="12" r="35" fill="url(#anomalyGlow)" />

    <!-- Levitating Water Droplet Stream (Challenging normal physics) -->
    <path d="M35 24 C35 10 25 0 35 -15" fill="none" stroke="url(#waterGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8" />

    <!-- Floating glowing water spheres defying gravity -->
    <circle cx="35" cy="-18" r="8" fill="url(#waterGrad)" opacity="0.9" />
    <circle cx="35" cy="-18" r="8" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.8" />
    <!-- Inner shine on floating droplet -->
    <circle cx="33" cy="-20" r="2" fill="#ffffff" opacity="0.8" />

    <!-- Orbiting micro-droplets (magic/special nature of water) -->
    <circle cx="20" cy="-10" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="50" cy="-8" r="5" fill="#a855f7" opacity="0.8" />
    <circle cx="42" cy="-28" r="3" fill="#fbbf24" opacity="0.9" />

    <!-- Sparkles / Special property indicators -->
    <path d="M22 5 L24 2 L26 5 L29 7 L26 9 L24 12 L22 9 L19 7 Z" fill="#fbbf24" />
    <path d="M48 22 L49 20 L51 22 L53 23 L51 24 L49 26 L48 24 L46 23 Z" fill="#38bdf8" />
  </g>

  <!-- Additional Atmospheric Bubbles & Sparks in Air -->
  <circle cx="90" cy="95" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="130" cy="85" r="3" fill="#a855f7" opacity="0.5" />
  <circle cx="150" cy="115" r="1.5" fill="#fbbf24" opacity="0.7" />
  <circle cx="65" cy="110" r="2.5" fill="#ec4899" opacity="0.6" />

  <!-- Foreground Steam / Energy Waves -->
  <path d="M90 130 Q95 120 90 110 T90 90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <path d="M110 135 Q105 125 112 115 T108 95" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
</svg>