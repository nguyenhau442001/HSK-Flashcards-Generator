<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Atmosphere -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Ambient Light Circle -->
  <circle cx="120" cy="110" r="70" fill="url(#glowGrad)" filter="url(#softGlow)"/>

  <!-- Floating Reference / Guidance Sparks & Stars (Symbolizing 'Reference / Consulting') -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="55" cy="65" r="3" />
    <circle cx="185" cy="75" r="2.5" />
    <path d="M180,45 L183,52 L190,55 L183,58 L180,65 L177,58 L170,55 L177,52 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M50,115 L52,119 L56,121 L52,123 L50,127 L48,123 L44,121 L48,119 Z" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- Architectural Drafting / Blueprint Background Elements -->
  <g stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.4">
    <line x1="30" y1="160" x2="210" y2="160" />
    <circle cx="120" cy="110" r="50" />
    <path d="M85,75 L155,145" />
  </g>

  <!-- Wooden/Modern Desk Surface -->
  <path d="M 12 185 L 228 185 C 234 185, 238 190, 238 195 L 238 215 C 238 223, 230 230, 222 230 L 18 230 C 10 230, 2 223, 2 215 L 2 195 C 2 190, 6 185, 12 185 Z" fill="url(#deskGrad)" />
  <rect x="2" y="185" width="236" height="4" fill="#64748b" opacity="0.6"/>

  <!-- MAIN SUBJECT: Open Reference Manual / Blueprint Folder (Representing '参考' - Consulting/Reference) -->
  <g transform="translate(0, 10)">
    <!-- Base Folder / Clipboard Shadow -->
    <path d="M 55,125 L 120,135 L 185,125 L 195,165 C 195,170, 190,175, 185,175 L 55,175 C 50,175, 45,170, 45,165 Z" fill="#0f172a" opacity="0.5" />

    <!-- Main Reference Book / Open Document -->
    <!-- Left Page -->
    <path d="M 120,115 L 50,125 C 44,126, 40,131, 40,137 L 40,167 C 40,173, 45,178, 51,177 L 118,168 C 119,168, 120,167, 120,166 Z" fill="#f8fafc" />
    <!-- Right Page -->
    <path d="M 120,115 L 190,125 C 196,126, 200,131, 200,137 L 200,167 C 200,173, 195,178, 189,177 L 122,168 C 121,168, 120,167, 120,166 Z" fill="#f1f5f9" />

    <!-- Center Binding Spine -->
    <path d="M 116,114 L 124,114 L 124,168 L 116,168 Z" fill="#cbd5e1" />

    <!-- Content on Pages (Abstract colorful charts/graphs & diagrams for 'Reference') -->
    <!-- Left Page Graphics -->
    <g transform="translate(52, 133)" opacity="0.8">
      <rect x="0" y="0" width="30" height="4" rx="2" fill="#38bdf8" />
      <rect x="0" y="8" width="50" height="3" rx="1.5" fill="#cbd5e1" />
      <rect x="0" y="14" width="40" height="3" rx="1.5" fill="#cbd5e1" />
      <!-- Mini Bar Chart -->
      <rect x="0" y="26" width="8" height="12" rx="1" fill="#fb923c" />
      <rect x="12" y="20" width="8" height="18" rx="1" fill="#10b981" />
      <rect x="24" y="23" width="8" height="15" rx="1" fill="#38bdf8" />
      <rect x="36" y="16" width="8" height="22" rx="1" fill="#f59e0b" />
    </g>

    <!-- Right Page Graphics (Compass / Blueprint Schematic) -->
    <g transform="translate(132, 133)">
      <circle cx="28" cy="22" r="14" fill="none" stroke="#64748b" stroke-width="2" />
      <path d="M 28,12 L 28,32 M 18,22 L 38,22" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
      <circle cx="28" cy="22" r="3" fill="#0f172a" />
      <rect x="0" y="0" width="22" height="3" rx="1.5" fill="#64748b" />
    </g>

    <!-- Floating Magnifying Glass (Active Inspecting/Consulting Tool) -->
    <g transform="translate(110, 80)">
      <!-- Glass Shadow -->
      <circle cx="25" cy="25" r="22" fill="#0f172a" opacity="0.3" transform="translate(3, 3)" />
      <!-- Lens Body (Golden/Amber theme for warm focal point) -->
      <circle cx="25" cy="25" r="22" fill="#1e293b" stroke="#fbbf24" stroke-width="4" />
      <!-- Lens Reflection / Glass Effect -->
      <circle cx="25" cy="25" r="18" fill="#38bdf8" fill-opacity="0.25" />
      <path d="M 12,18 C 16,14, 24,14, 28,16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
      <!-- Handle -->
      <path d="M 10,40 L -4,54 C -7,57, -7,61, -4,64 L -2,66 C 1,69, 5,69, 8,66 L 22,52 Z" fill="#d97706" />
      <path d="M 7,43 L -1,51 L 11,63 L 19,55 Z" fill="#f59e0b" />
    </g>
  </g>

  <!-- Supportive Props on Desk -->
  <!-- Coffee Mug (Cozy Learning Vibe) -->
  <g transform="translate(25, 145)">
    <rect x="0" y="5" width="20" height="25" rx="3" fill="#ec4899" />
    <path d="M 20,9 C 25,9, 26,17, 20,21" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="10" cy="5" rx="10" ry="3" fill="#f472b6" />
    <ellipse cx="10" cy="7" rx="7" ry="1.5" fill="#78350f" />
    <!-- Steam -->
    <path d="M 6,-2 C 8,-6, 4,-10, 6,-14" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 14,0 C 16,-4, 12,-8, 14,-12" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Sticky Note / Memo (Contextual Reference Note) -->
  <g transform="translate(170, 135) rotate(8)">
    <rect x="0" y="0" width="32" height="32" rx="2" fill="#fde047" />
    <!-- Scribble lines on sticky note -->
    <line x1="6" y1="10" x2="26" y2="10" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="6" y1="18" x2="20" y2="18" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="6" y1="26" x2="23" y2="26" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Dynamic Sparkles / Highlights -->
  <path d="M 90,50 L 93,58 L 101,61 L 93,64 L 90,72 L 87,64 L 79,61 L 87,58 Z" fill="#38bdf8" opacity="0.9" />
  <path d="M 160,100 L 162,105 L 167,107 L 162,109 L 160,114 L 158,109 L 153,107 L 158,105 Z" fill="#fbbf24" opacity="0.8" />
</svg>