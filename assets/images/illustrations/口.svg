<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Top Gradient -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glass/Bottle Gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Liquid Gradient -->
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Funnel Gradient -->
    <linearGradient id="funnelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Shelf with jars & warm light) -->
  <g opacity="0.4">
    <!-- Back shelf -->
    <rect x="30" y="55" width="180" height="6" rx="3" fill="#475569"/>
    <!-- Shelf items -->
    <circle cx="60" cy="45" r="10" fill="#f43f5e"/>
    <rect x="90" y="35" width="16" height="20" rx="4" fill="#38bdf8"/>
    <rect x="170" y="30" width="22" height="25" rx="5" fill="#a855f7"/>
  </g>

  <!-- Ambient Window Light Beam -->
  <polygon points="120,0 200,0 240,240 180,240" fill="#38bdf8" opacity="0.04"/>

  <!-- Wooden Table Surface -->
  <rect x="0" y="170" width="240" height="70" fill="url(#tableGrad)"/>
  <rect x="0" y="170" width="240" height="4" fill="#475569" opacity="0.6"/>

  <!-- Shadow under the bottle -->
  <ellipse cx="120" cy="180" rx="28" ry="8" fill="#000000" opacity="0.6"/>

  <!-- THE MAIN OBJECT: Small-necked glass bottle ("这个瓶子的口很小") -->
  <g filter="url(#shadow)">
    <!-- Liquid inside the bottle -->
    <path d="M 96,120 
             Q 96,176 96,178 
             Q 96,182 100,182 
             L 140,182 
             Q 144,182 144,178 
             Q 144,176 144,120 Z" 
          fill="url(#liquidGrad)"/>
    
    <!-- Liquid top wave line -->
    <ellipse cx="120" cy="120" rx="24" ry="4" fill="#34d399"/>

    <!-- Glass Bottle Body -->
    <path d="M 112,75 
             L 128,75 
             L 128,105 
             Q 148,115 152,145 
             Q 156,180 144,182 
             L 96,182 
             Q 84,180 88,145 
             Q 92,115 112,105 Z" 
          fill="url(#glassGrad)" stroke="#bae6fd" stroke-width="1.5"/>

    <!-- Glass reflection highlights -->
    <path d="M 94,130 Q 98,150 96,170" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M 115,79 L 125,79" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- ACTION ELEMENT: A tiny funnel and drops, emphasizing the SMALL NECK ("口很小") -->
  <g filter="url(#shadow)">
    <!-- Funnel inserted into the tiny mouth -->
    <path d="M 108,55 L 132,55 L 122,75 L 118,75 Z" fill="url(#funnelGrad)"/>
    <!-- Funnel top rim -->
    <ellipse cx="120" cy="55" rx="12" ry="3" fill="#fbbf24"/>

    <!-- Falling liquid droplets entering the small mouth -->
    <circle cx="120" cy="85" r="2.5" fill="#10b981"/>
    <circle cx="120" cy="95" r="2" fill="#10b981"/>
  </g>

  <!-- CHARACTER INTERACTION: Focused hands guiding the liquid/funnel -->
  <!-- Left Hand -->
  <g filter="url(#shadow)">
    <path d="M 75,130 Q 85,120 95,125 Q 100,128 98,135 Q 90,140 75,138 Z" fill="#fcd34d"/>
    <path d="M 85,123 Q 92,125 96,130" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Sleeve -->
    <path d="M 60,145 L 80,135 L 85,150 L 65,165 Z" fill="#ec4899"/>
  </g>

  <!-- Right Hand holding funnel steady -->
  <g filter="url(#shadow)">
    <path d="M 150,60 Q 135,55 130,62 Q 128,66 135,70 Q 145,72 152,65 Z" fill="#fcd34d"/>
    <!-- Sleeve -->
    <path d="M 165,50 L 148,58 L 142,48 L 160,40 Z" fill="#38bdf8"/>
  </g>

  <!-- CHARACTER FACE & HEAD (Curious, concentrated expression looking at the small mouth) -->
  <g transform="translate(15, -10)" filter="url(#shadow)">
    <!-- Hair -->
    <path d="M 35,65 Q 40,45 65,42 Q 90,45 95,65 Q 98,80 90,85 Q 70,80 50,85 Q 38,80 35,65 Z" fill="#1e293b"/>
    
    <!-- Head / Face Profile / 3/4 View -->
    <path d="M 45,60 Q 42,85 62,90 Q 82,85 80,60 Z" fill="#fcd34d"/>

    <!-- Focused Eye (looking down intently at the bottle) -->
    <path d="M 62,72 Q 68,69 74,72" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="68" cy="71" r="1.5" fill="#1e293b"/>

    <!-- Concentrated Eyebrow -->
    <path d="M 60,66 Q 68,63 76,67" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Cute Blush -->
    <circle cx="73" cy="78" r="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Body / Shirt collar -->
    <path d="M 48,90 L 76,90 L 85,115 L 38,115 Z" fill="#ec4899"/>
    <path d="M 55,90 L 62,100 L 69,90 Z" fill="#ffffff"/>
  </g>

  <!-- Extra ambient context props on table (magnifying glass to emphasize inspecting the small size) -->
  <g transform="translate(170, 160) rotate(-15)" filter="url(#shadow)">
    <!-- Magnifying glass handle -->
    <rect x="-4" y="10" width="8" height="25" rx="3" fill="#b45309"/>
    <!-- Glass rim -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Glass lens tint -->
    <circle cx="0" cy="0" r="12" fill="#38bdf8" opacity="0.15"/>
    <path d="M -6,-6 Q 0,-10 6,-6" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Tiny highlight sparkles for polish -->
  <circle cx="102" cy="70" r="1.5" fill="#fef08a"/>
  <circle cx="138" cy="65" r="1" fill="#fef08a"/>
</svg>