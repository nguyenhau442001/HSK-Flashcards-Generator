<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Gradient for ambient lighting -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Interior Environment & Props -->
  <!-- Bookshelf in background -->
  <g fill="#334155" opacity="0.6">
    <rect x="25" y="45" width="40" height="70" rx="2"/>
    <rect x="30" y="60" width="30" height="3" fill="#64748b"/>
    <rect x="30" y="85" width="30" height="3" fill="#64748b"/>
    <!-- Books -->
    <path d="M35 52h4v8h-4zM41 50h5v10h-5zM48 53h3v7h-3z" fill="#f59e0b"/>
    <path d="M34 75h5v10h-5zM41 77h4v8h-4z" fill="#38bdf8"/>
  </g>

  <!-- Window with night city view -->
  <g>
    <rect x="175" y="30" width="40" height="65" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <path d="M195 30v65M175 62.5h40" stroke="#475569" stroke-width="2"/>
    <!-- Tiny distant lights -->
    <circle cx="185" cy="45" r="1.5" fill="#fbbf24"/>
    <circle cx="205" cy="75" r="1.5" fill="#38bdf8"/>
    <circle cx="183" cy="80" r="1" fill="#f43f5e"/>
  </g>

  <!-- Wooden Office Desk -->
  <path d="M25 160h190v10H25z" fill="#b45309" filter="url(#shadow)"/>
  <rect x="35" y="170" width="12" height="40" fill="#78350f"/>
  <rect x="193" y="170" width="12" height="40" fill="#78350f"/>

  <!-- Desk Props: Laptop & Paperwork -->
  <g transform="translate(95, 135)">
    <!-- Laptop Base -->
    <path d="M-12 25h54l6 7H-18z" fill="#94a3b8"/>
    <!-- Laptop Screen -->
    <rect x="-8" y="2" width="46" height="25" rx="2" fill="#475569"/>
    <rect x="-5" y="5" width="40" height="19" rx="1" fill="#1e293b"/>
    <!-- Code/Chart lines on screen -->
    <path d="M-2 9h12M-2 13h18M-2 17h8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Scattered Papers & Coffee Mug -->
  <rect x="50" y="153" width="16" height="12" rx="1" fill="#f8fafc" transform="rotate(-12 50 153)"/>
  <rect x="155" y="151" width="14" height="10" rx="1" fill="#e2e8f0" transform="rotate(8 155 151)"/>
  <rect x="140" y="145" width="10" height="12" rx="2" fill="#ec4899"/>
  <path d="M150 148h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2z" fill="#ec4899"/>

  <!-- CHARACTER 1: Left Person (Frustrated/Defensive) -->
  <g id="character-left" transform="translate(15, 0)">
    <!-- Body & Torso (leaning back) -->
    <path d="M55 130c5-10 15-18 30-20l5 30-35 25z" fill="#38bdf8" filter="url(#shadow)"/>
    <!-- Left Arm crossed or gesturing outward defensively -->
    <path d="M75 125l22 12-5 8-18-8z" fill="#0284c7"/>
    <!-- Right Arm pointing / holding back -->
    <path d="M80 115l25-5 3 6-25 5z" fill="#0284c7"/>
    <!-- Head & Hair -->
    <circle cx="72" cy="85" r="14" fill="#fed7aa"/>
    <!-- Hair (Dark, stylized) -->
    <path d="M58 85c0-9 7-15 15-15s15 5 15 12c0 2-4 3-4 3s-3-5-11-5-12 6-12 6z" fill="#1e293b"/>
    <!-- Facial Expression: Disagreement / Frown -->
    <path d="M66 82l5 2M74 84l5-2" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/> <!-- Eyebrows furrowed -->
    <circle cx="69" cy="88" r="1.5" fill="#1e293b"/>
    <circle cx="77" cy="88" r="1.5" fill="#1e293b"/>
    <!-- Open objecting mouth -->
    <path d="M71 95a3 2 0 0 0 6 0z" fill="#991b1b"/>
  </g>

  <!-- CHARACTER 2: Right Person (Contrasting / Stubborn) -->
  <g id="character-right" transform="translate(115, 0)">
    <!-- Body & Torso (leaning forward) -->
    <path d="M60 110c12 5 22 15 27 25l-35 30-10-35z" fill="#f43f5e" filter="url(#shadow)"/>
    <!-- Arms crossed defensively -->
    <path d="M38 130l25 10-4 9-22-10z" fill="#e11d48"/>
    <path d="M42 120l22 8-3 8-22-8z" fill="#e11d48"/>
    <!-- Head & Hair -->
    <circle cx="48" cy="83" r="14" fill="#ffedd5"/>
    <!-- Hair (Brown bob/short) -->
    <path d="M34 83c0-9 6-15 15-15 7 0 13 4 14 11-3 1-5 4-8 4s-5-3-7-3-6 5-6 5l-8-2z" fill="#78350f"/>
    <!-- Facial Expression: Skeptical / Stubborn -->
    <path d="M41 80l5 3M49 83l5-3" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="45" cy="86" r="1.5" fill="#78350f"/>
    <circle cx="53" cy="86" r="1.5" fill="#78350f"/>
    <!-- Frown mouth -->
    <path d="M46 95q4 -3 8 0" stroke="#78350f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- DYNAMIC CONFLICT VISUALIZATION (Subtle tension lines / clash indicator between them, NO text) -->
  <g opacity="0.8">
    <path d="M110 100l10-10m-5 15l15-10" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M125 125l8-5m-3 8l10-6" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>