<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="flask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient lighting / window panel -->
  <path d="M 140 30 L 210 30 L 210 140 L 140 140 Z" fill="#334155" opacity="0.3"/>
  <path d="M 145 35 L 172 35 L 172 135 L 145 135 Z" fill="#1e293b" opacity="0.5"/>
  <path d="M 178 35 L 205 35 L 205 135 L 178 135 Z" fill="#1e293b" opacity="0.5"/>
  <circle cx="175" cy="80" r="40" fill="url(#glow)"/>

  <!-- Laboratory Environment / Equipment Background -->
  <!-- Server / High-tech Rack -->
  <rect x="15" y="45" width="35" height="135" rx="4" fill="#334155"/>
  <rect x="20" y="55" width="25" height="12" rx="2" fill="#1e293b"/>
  <circle cx="26" cy="61" r="2" fill="#10b981"/>
  <circle cx="34" cy="61" r="2" fill="#38bdf8"/>
  <rect x="20" y="75" width="25" height="12" rx="2" fill="#1e293b"/>
  <circle cx="26" cy="81" r="2" fill="#10b981"/>
  <rect x="20" y="95" width="25" height="12" rx="2" fill="#1e293b"/>
  <circle cx="26" cy="101" r="2" fill="#f59e0b"/>

  <!-- Molecular Structure / Scientific Art on Wall -->
  <circle cx="85" cy="55" r="4" fill="#38bdf8"/>
  <circle cx="110" cy="45" r="6" fill="#ec4899"/>
  <circle cx="125" cy="70" r="5" fill="#10b981"/>
  <line x1="85" y1="55" x2="110" y2="45" stroke="#64748b" stroke-width="2"/>
  <line x1="110" y1="45" x2="125" y2="70" stroke="#64748b" stroke-width="2"/>

  <!-- Workbench / Desk -->
  <rect x="40" y="155" width="170" height="10" rx="3" fill="#475569"/>
  <rect x="55" y="165" width="15" height="45" fill="#334155"/>
  <rect x="180" y="165" width="15" height="45" fill="#334155"/>

  <!-- Microscope -->
  <path d="M 85 125 L 95 125 L 97 145 L 83 145 Z" fill="#94a3b8"/>
  <path d="M 75 145 L 105 145 L 105 155 L 75 155 Z" fill="#64748b"/>
  <path d="M 90 100 C 75 100 75 130 85 135" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <rect x="83" y="130" width="18" height="6" rx="2" fill="#38bdf8"/>
  <circle cx="95" cy="105" r="5" fill="#cbd5e1"/>

  <!-- Glassware / Flasks on Desk -->
  <!-- Erlenmeyer flask with glowing liquid -->
  <path d="M 135 155 L 145 135 L 155 135 L 165 155 Z" fill="url(#flask)" opacity="0.8"/>
  <rect x="143" y="127" width="14" height="8" rx="1" fill="#cbd5e1"/>
  <path d="M 137 148 L 163 148 L 161 154 L 139 154 Z" fill="url(#liquid)"/>

  <!-- Test tube rack -->
  <rect x="175" y="138" width="30" height="17" rx="2" fill="#64748b"/>
  <rect x="180" y="130" width="4" height="20" rx="2" fill="#e2e8f0" opacity="0.8"/>
  <rect x="188" y="128" width="4" height="22" rx="2" fill="#10b981" opacity="0.8"/>
  <rect x="196" y="132" width="4" height="18" rx="2" fill="#38bdf8" opacity="0.8"/>

  <!-- Researcher Character (Scientist actively working) -->
  <!-- Body / Lab Coat -->
  <path d="M 100 200 C 100 175 110 160 125 160 C 140 160 150 175 150 200 Z" fill="#cbd5e1"/>
  <!-- Lab coat collar -->
  <path d="M 115 160 L 125 180 L 135 160 Z" fill="#f8fafc"/>
  <line x1="125" y1="180" x2="125" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <!-- Inner shirt -->
  <path d="M 118 160 L 125 172 L 132 160 Z" fill="#38bdf8"/>

  <!-- Head & Face -->
  <circle cx="125" cy="138" r="16" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M 109 135 C 109 120 120 118 130 118 C 141 118 141 130 141 138 C 135 133 120 133 109 135 Z" fill="#475569"/>
  <!-- Safety Goggles on forehead/face -->
  <rect x="113" y="130" width="24" height="8" rx="3" fill="#0f172a" opacity="0.8"/>
  <rect x="116" y="131" width="8" height="6" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="126" y="131" width="8" height="6" rx="2" fill="#38bdf8" opacity="0.6"/>
  <!-- Happy focused expression -->
  <path d="M 121 146 Q 125 150 129 146" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms interacting with microscope -->
  <path d="M 105 170 C 100 150 110 140 115 140" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="115" cy="140" r="4" fill="#fcd34d"/>

  <!-- Foreground Lighting/Atmosphere -->
  <path d="M 0 0 L 240 0 L 240 240 L 0 240 Z" fill="url(#beam)" style="mix-blend-mode: overlay;" pointer-events="none"/>
</svg>