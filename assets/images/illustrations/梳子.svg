<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Vanity Light Gradient -->
    <radialGradient id="vanityLight" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Mirror Glow -->
    <linearGradient id="mirrorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Comb Gradient -->
    <linearGradient id="combGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light from Vanity -->
  <circle cx="120" cy="110" r="120" fill="url(#vanityLight)" />

  <!-- Room Interior Background Elements -->
  <!-- Wallpaper subtle vertical stripes -->
  <g opacity="0.05">
    <line x1="40" y1="0" x2="40" y2="240" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="240" stroke="#ffffff" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="240" stroke="#ffffff" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="240" stroke="#ffffff" stroke-width="2"/>
    <line x1="200" y1="0" x2="200" y2="240" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Vanity Shelf / Desk -->
  <path d="M 30 190 L 210 190 L 220 210 L 20 210 Z" fill="#334155" />
  <rect x="25" y="185" width="190" height="6" rx="3" fill="#475569" />

  <!-- Large Round Vanity Mirror -->
  <circle cx="120" cy="95" r="55" fill="#0f172a" stroke="#fbbf24" stroke-width="4" />
  <circle cx="120" cy="95" r="51" fill="url(#mirrorGrad)" />
  <!-- Mirror Reflection Arc -->
  <path d="M 90 65 A 35 35 0 0 1 140 60" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3" />

  <!-- Vanity Props (Cosmetics bottles & small plant) -->
  <!-- Bottle 1 (Blue) -->
  <rect x="45" y="160" width="12" height="25" rx="3" fill="#0ea5e9" />
  <rect x="48" y="155" width="6" height="5" rx="1" fill="#cbd5e1" />
  <!-- Bottle 2 (Pink Jar) -->
  <rect x="180" y="165" width="16" height="20" rx="4" fill="#ec4899" />
  <ellipse cx="188" cy="165" rx="8" ry="3" fill="#f472b6" />
  <!-- Small potted plant -->
  <path d="M 68 175 L 78 175 L 76 185 L 70 185 Z" fill="#94a3b8" />
  <circle cx="73" cy="170" r="8" fill="#10b981" />
  <circle cx="78" cy="172" r="6" fill="#059669" />

  <!-- Character: Upper Body & Clothing -->
  <!-- Shoulders / Shirt -->
  <path d="M 75 210 C 75 185, 95 175, 120 175 C 145 175, 165 185, 165 210 Z" fill="#38bdf8" />
  <!-- Collar / Neckline -->
  <path d="M 100 178 C 100 190, 140 190, 140 178" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="110" y="145" width="20" height="35" rx="8" fill="url(#skinGrad)" />
  <!-- Collarbones shadow -->
  <path d="M 108 173 Q 120 180 132 173" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Head & Face -->
  <circle cx="120" cy="125" r="32" fill="url(#skinGrad)" />

  <!-- Ears -->
  <circle cx="89" cy="125" r="5" fill="#fed7aa" />
  <circle cx="151" cy="125" r="5" fill="#fed7aa" />

  <!-- Facial Features -->
  <!-- Gentle smiling eyes (closed happily during brushing) -->
  <path d="M 106 122 Q 110 117 114 122" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 126 122 Q 130 117 134 122" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Rosy Cheeks -->
  <circle cx="103" cy="131" r="5" fill="#fda4af" opacity="0.6" />
  <circle cx="137" cy="131" r="5" fill="#fda4af" opacity="0.6" />

  <!-- Cute Smiling Mouth -->
  <path d="M 115 133 Q 120 139 125 133" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />

  <!-- Base Back Hair -->
  <path d="M 90 115 C 85 140, 95 165, 120 170 C 145 165, 155 140, 150 115 Z" fill="url(#hairGrad)" />

  <!-- Left Arm & Hand (Holding hair steady) -->
  <path d="M 85 180 C 70 160, 85 135, 95 135" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
  <circle cx="97" cy="133" r="6" fill="url(#skinGrad)" />

  <!-- Right Arm & Hand (Action: Actively Combing Hair) -->
  <!-- Upper arm coming from right shoulder -->
  <path d="M 150 185 C 165 170, 160 140, 145 110" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
  <!-- Forearm moving towards head -->
  <path d="M 145 110 C 135 95, 120 95, 115 100" fill="none" stroke="#38bdf8" stroke-width="13" stroke-linecap="round" />
  <!-- Hand -->
  <circle cx="114" cy="98" r="6" fill="url(#skinGrad)" />

  <!-- THE TARGET OBJECT: COMB (梳子 - shūzi) -->
  <!-- Placed clearly in hand, passing through hair -->
  <g transform="translate(100, 75) rotate(-15)">
    <!-- Comb Handle -->
    <rect x="0" y="0" width="8" height="28" rx="4" fill="url(#combGrad)" />
    <!-- Comb Spine -->
    <rect x="-12" y="28" width="32" height="6" rx="2" fill="url(#combGrad)" />
    <!-- Comb Teeth (Fine vector details) -->
    <line x1="-10" y1="34" x2="-10" y2="44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-6" y1="34" x2="-6" y2="44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-2" y1="34" x2="-2" y2="44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    <line x1="2" y1="34" x2="2" y2="44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="34" x2="6" y2="44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    <line x1="10" y1="34" x2="10" y2="44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="34" x2="14" y2="44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    <line x1="18" y1="34" x2="18" y2="44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Front Hair Layers & Flowing Strands (Showing motion of brushing) -->
  <path d="M 90 100 C 90 80, 110 75, 125 80 C 145 85, 150 110, 150 135 C 150 155, 140 165, 130 170" fill="url(#hairGrad)" />
  <!-- Hair Bangs -->
  <path d="M 95 105 C 105 115, 135 115, 145 105 C 140 95, 100 95, 95 105 Z" fill="url(#hairGrad)" />

  <!-- Action Motion Lines / Sparkles representing grooming and freshness -->
  <path d="M 85 85 Q 92 80 98 88" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="140" cy="80" r="2" fill="#38bdf8" />
  <circle cx="148" cy="95" r="1.5" fill="#fbbf24" />
  <circle cx="80" cy="110" r="2" fill="#fbbf24" />

</svg>