<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 175 L240 175 L240 180 L0 180 Z" fill="#475569"/>
  
  <!-- Old Wooden Chair -->
  <path d="M50 220 L70 220 L65 140 L55 140 Z" fill="#94a3b8"/>
  <path d="M55 140 L65 140 L65 120 L55 120 Z" fill="#94a3b8"/>
  
  <!-- The Subject: An old, worn-out teddy bear sitting on the chair -->
  <circle cx="60" cy="100" r="25" fill="#fb923c"/>
  <circle cx="45" cy="90" r="10" fill="#fb923c"/>
  <circle cx="75" cy="90" r="10" fill="#fb923c"/>
  <circle cx="50" cy="95" r="3" fill="#0f172a"/>
  <circle cx="70" cy="95" r="3" fill="#0f172a"/>
  <path d="M55 105 Q60 110 65 105" stroke="#0f172a" stroke-width="2" fill="none"/>
  
  <!-- Patch on the bear to signify 'still the same' -->
  <path d="M55 90 L65 90 L62 98 L58 98 Z" fill="#ec4899"/>
  
  <!-- Atmospheric details: A warm glowing lamp in the background -->
  <circle cx="180" cy="80" r="40" fill="#f59e0b" opacity="0.1"/>
  <path d="M170 120 L190 120 L195 180 L165 180 Z" fill="#fbbf24"/>
  <path d="M180 120 L180 100" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Floating dust particles -->
  <circle cx="100" cy="50" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="140" cy="70" r="1" fill="#ffffff" opacity="0.2"/>
  <circle cx="200" cy="40" r="2" fill="#ffffff" opacity="0.4"/>
  
  <!-- Window frame silhouette -->
  <path d="M150 0 L150 240" stroke="#334155" stroke-width="2"/>
  <path d="M0 60 L240 60" stroke="#334155" stroke-width="2"/>
</svg>