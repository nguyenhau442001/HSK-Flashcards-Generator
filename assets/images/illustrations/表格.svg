<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Table Header Gradient -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Accent Row Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Base Card -->
  <rect x="10" y="10" width="180" height="180" rx="28" fill="url(#bg-grad)" stroke="#334155" stroke-width="2"/>

  <!-- Main Spreadsheet / Form Container -->
  <g filter="url(#shadow)">
    <rect x="35" y="40" width="130" height="120" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Table Header Bar -->
    <path d="M 37 54 L 37 45 C 37 41.686 39.686 39 43 39 L 157 39 C 160.314 39 163 41.686 163 45 L 163 54 Z" fill="url(#header-grad)"/>
    
    <!-- Header Dots/Controls -->
    <circle cx="50" cy="46" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="62" cy="46" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="74" cy="46" r="3" fill="#ffffff" opacity="0.3"/>

    <!-- Grid Lines & Cells -->
    <!-- Vertical Dividers -->
    <line x1="75" y1="54" x2="75" y2="158" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="125" y1="54" x2="125" y2="158" stroke="#334155" stroke-width="1.5"/>

    <!-- Horizontal Row Dividers -->
    <line x1="37" y1="80" x2="163" y2="80" stroke="#334155" stroke-width="1.5"/>
    <line x1="37" y1="106" x2="163" y2="106" stroke="#334155" stroke-width="1.5"/>
    <line x1="37" y1="132" x2="163" y2="132" stroke="#334155" stroke-width="1.5"/>

    <!-- Active/Selected Row Highlight (Table Row) -->
    <rect x="36" y="81" width="128" height="24" fill="url(#accent-grad)"/>
    <!-- Selection Indicator Bar -->
    <rect x="36" y="81" width="4" height="24" fill="#f59e0b" rx="2"/>

    <!-- Abstract Data Visualizations (Clean geometric shapes representing text/data in cells) -->
    <!-- Row 1 Data -->
    <rect x="47" y="64" width="20" height="6" rx="3" fill="#38bdf8" opacity="0.8"/>
    <rect x="88" y="64" width="25" height="6" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="138" y="64" width="14" height="6" rx="3" fill="#64748b" opacity="0.5"/>

    <!-- Row 2 Data (Highlighted Row) -->
    <rect x="47" y="90" width="16" height="6" rx="3" fill="#f59e0b" opacity="0.9"/>
    <rect x="88" y="90" width="30" height="6" rx="3" fill="#fb923c" opacity="0.8"/>
    <rect x="138" y="90" width="18" height="6" rx="3" fill="#f59e0b" opacity="0.9"/>

    <!-- Row 3 Data -->
    <rect x="47" y="116" width="22" height="6" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="88" y="116" width="18" height="6" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="138" y="116" width="15" height="6" rx="3" fill="#64748b" opacity="0.5"/>

    <!-- Row 4 Data -->
    <rect x="47" y="142" width="18" height="6" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="88" y="142" width="24" height="6" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="138" y="142" width="20" height="6" rx="3" fill="#64748b" opacity="0.5"/>
  </g>

  <!-- Floating Interactive Elements / Modern Accents -->
  <!-- Checkmark Badge (Representing completed form/entry) -->
  <g filter="url(#glow)">
    <circle cx="145" cy="140" r="18" fill="#10b981" stroke="#0f172a" stroke-width="3"/>
    <path d="M 137 140 L 142 145 L 153 133" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Data Node / Cursor Pointer -->
  <g filter="url(#shadow)">
    <circle cx="60" cy="93" r="12" fill="#f59e0b" stroke="#0f172a" stroke-width="3"/>
    <circle cx="60" cy="93" r="4" fill="#ffffff"/>
  </g>
</svg>