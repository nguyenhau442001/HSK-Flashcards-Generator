<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground/Pavement -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <path d="M0 160 L240 160 L240 180 Q120 200 0 180 Z" fill="#475569"/>
  
  <!-- Rain Puddles -->
  <ellipse cx="60" cy="180" rx="30" ry="8" fill="#1e3a8a" opacity="0.6"/>
  <ellipse cx="180" cy="190" rx="40" ry="10" fill="#1e3a8a" opacity="0.6"/>
  
  <!-- Character -->
  <g transform="translate(120, 160)">
    <!-- Legs in motion -->
    <path d="M-10 0 L-20 -40 M10 0 L20 -40" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-15" y="-80" width="30" height="40" rx="5" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-95" r="15" fill="#fde68a"/>
    <!-- Arms flailing -->
    <path d="M-15 -60 L-35 -40 M15 -60 L35 -40" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Expression (Eyes wide) -->
    <circle cx="-5" cy="-100" r="2" fill="#0f172a"/>
    <circle cx="5" cy="-100" r="2" fill="#0f172a"/>
    <path d="M-5 -90 Q0 -85 5 -90" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Rain streaks -->
  <line x1="20" y1="0" x2="20" y2="40" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="20" x2="80" y2="60" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  <line x1="150" y1="10" x2="150" y2="50" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  <line x1="210" y1="30" x2="210" y2="70" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  
  <!-- Motion lines -->
  <path d="M160 140 Q180 130 200 140" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
</svg>