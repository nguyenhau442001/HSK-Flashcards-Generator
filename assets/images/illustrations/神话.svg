<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Magical Glow for the Ancient Scroll -->
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character Robe Gradient -->
    <linearGradient id="elderRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="youthRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Floating Mythical Dragon Hologram Gradient -->
    <linearGradient id="mythDragon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Study Room / Ancient Library Interior -->
  <!-- Back Wall Paneling -->
  <rect x="20" y="20" width="200" height="150" fill="#151c2c" rx="4" />
  <line x1="20" y1="120" x2="220" y2="120" stroke="#0f172a" stroke-width="3" />
  <line x1="100" y1="20" x2="100" y2="120" stroke="#0f172a" stroke-width="3" />

  <!-- Bookshelf on the left -->
  <rect x="24" y="30" width="30" height="85" fill="#1a233a" rx="2" />
  <line x1="24" y1="55" x2="54" y2="55" stroke="#0f172a" stroke-width="2" />
  <line x1="24" y1="80" x2="54" y2="80" stroke="#0f172a" stroke-width="2" />
  <!-- Books on shelf -->
  <rect x="28" y="38" width="6" height="15" fill="#f59e0b" rx="1" />
  <rect x="36" y="35" width="8" height="18" fill="#38bdf8" rx="1" />
  <rect x="28" y="62" width="10" height="15" fill="#ec4899" rx="1" />
  <rect x="41" y="65" width="5" height="12" fill="#10b981" rx="1" />

  <!-- Round Window showing starry ancient night -->
  <circle cx="180" cy="65" r="28" fill="#0b0f19" stroke="#334155" stroke-width="4" />
  <!-- Stars in window -->
  <circle cx="170" cy="55" r="1" fill="#fff" />
  <circle cx="190" cy="60" r="1.5" fill="#fbbf24" />
  <circle cx="185" cy="78" r="1" fill="#38bdf8" />
  <circle cx="168" cy="72" r="1.2" fill="#fff" />
  <!-- Crescent Moon -->
  <path d="M190 50 A 10 10 0 0 1 180 65 A 10 10 0 0 0 190 50 Z" fill="#fbbf24" opacity="0.8" />
  <!-- Window Light Cone -->
  <polygon points="180,93 140,170 220,170" fill="url(#windowLight)" />

  <!-- Wooden Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#111827" />
  <!-- Floor Planks -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#0a0f1d" stroke-width="2" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#0a0f1d" stroke-width="2" />
  <line x1="80" y1="170" x2="60" y2="240" stroke="#0a0f1d" stroke-width="1.5" />
  <line x1="160" y1="170" x2="190" y2="240" stroke="#0a0f1d" stroke-width="1.5" />

  <!-- Central Wooden Table -->
  <path d="M60 145 L180 145 L190 165 L50 165 Z" fill="#334155" />
  <rect x="55" y="165" width="130" height="8" fill="#1e293b" rx="2" />
  <!-- Table Legs -->
  <rect x="70" y="173" width="10" height="50" fill="#1e293b" />
  <rect x="160" y="173" width="10" height="50" fill="#1e293b" />

  <!-- OBJECTS ON TABLE: Ancient Scroll and Glowing Magical Elements -->
  <!-- Ambient Magical Glow on Table -->
  <ellipse cx="120" cy="148" rx="35" ry="12" fill="url(#magicGlow)" />
  
  <!-- Ancient Unrolled Scroll -->
  <path d="M85 142 Q 120 137 155 142 L 158 150 Q 120 145 82 150 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
  <!-- Scroll Roll Ends -->
  <ellipse cx="83" cy="146" rx="3" ry="5" fill="#b45309" />
  <ellipse cx="157" cy="146" rx="3" ry="5" fill="#b45309" />
  <!-- Abstract ancient script lines on scroll -->
  <line x1="95" y1="143" x2="110" y2="143" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <line x1="115" y1="144" x2="130" y2="144" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <line x1="135" y1="143" x2="145" y2="143" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

  <!-- MAGICAL MYTHICAL CREATURE MANIFESTATION (Visualizing the 'Myth' / 神话) -->
  <!-- Floating Dragon Spirits rising from the ancient scroll -->
  <g filter="drop-shadow(0px 0px 6px rgba(245, 158, 11, 0.6))">
    <!-- Dragon Body Swoosh -->
    <path d="M 120 138 C 110 110, 140 90, 125 70 C 115 55, 95 65, 105 45" fill="none" stroke="url(#mythDragon)" stroke-width="4" stroke-linecap="round" />
    <!-- Dragon Head -->
    <circle cx="105" cy="42" r="6" fill="#fbbf24" />
    <path d="M 100 40 L 95 37" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" /> <!-- Horns -->
    <path d="M 108 40 L 112 37" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <!-- Magical Sparkles / Orbs -->
    <circle cx="135" cy="80" r="2.5" fill="#38bdf8" />
    <circle cx="115" cy="95" r="2" fill="#fbbf24" />
    <circle cx="128" cy="55" r="1.5" fill="#ec4899" />
    <circle cx="98" cy="65" r="2" fill="#10b981" />
  </g>

  <!-- CHARACTERS: Wise Elder and Curious Youth learning the ancient tale -->
  
  <!-- CHARACTER 1: ELDER (Left side, explaining the myth) -->
  <g transform="translate(30, 90)">
    <!-- Body / Robe -->
    <path d="M 15 55 C 10 70, 5 85, 0 90 L 50 90 C 45 80, 40 65, 35 55 Z" fill="url(#elderRobe)" />
    <!-- Head & Face -->
    <circle cx="25" cy="30" r="14" fill="#fbcfe8" />
    <!-- Gray Hair & Beard (Wisdom) -->
    <path d="M 12 30 C 12 18, 38 18, 38 30 C 38 35, 30 42, 25 45 C 20 42, 12 35, 12 30 Z" fill="#94a3b8" />
    <!-- Face Profile / Expression (Smiling, engaged) -->
    <path d="M 28 32 Q 32 34 30 36" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" /> <!-- Smile -->
    <!-- Eyeglasses -->
    <circle cx="26" cy="28" r="3.5" fill="none" stroke="#fbbf24" stroke-width="1" />
    <!-- Left Arm gesturing towards the scroll -->
    <path d="M 30 50 C 40 55, 48 50, 55 45" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" />
    <!-- Hand pointing -->
    <circle cx="57" cy="44" r="3" fill="#fbcfe8" />
  </g>

  <!-- CHARACTER 2: YOUTH / LEARNER (Right side, amazed by the myth) -->
  <g transform="translate(150, 85)">
    <!-- Body / Robe -->
    <path d="M 15 60 C 12 75, 8 90, 5 95 L 55 95 C 50 80, 45 70, 40 60 Z" fill="url(#youthRobe)" />
    <!-- Head & Face -->
    <circle cx="30" cy="32" r="14" fill="#fde68a" />
    <!-- Modern/Youthful Dark Hair -->
    <path d="M 16 30 C 16 18, 44 18, 44 32 C 40 28, 35 24, 30 24 C 23 24, 18 27, 16 30 Z" fill="#334155" />
    <!-- Expressive Eyes (Wide with wonder) -->
    <circle cx="35" cy="31" r="2" fill="#0f172a" />
    <circle cx="36" cy="30" r="0.7" fill="#ffffff" />
    <!-- Open Mouth in awe -->
    <ellipse cx="37" cy="38" rx="2" ry="2.5" fill="#9f1239" />
    <!-- Right Arm leaning on table, hand near chin or raised in amazement -->
    <path d="M 25 55 C 15 55, 10 50, 5 40" fill="none" stroke="#064e3b" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="3" cy="38" r="3" fill="#fde68a" />
    <!-- Left arm resting -->
    <path d="M 40 60 C 45 65, 50 70, 55 75" fill="none" stroke="#064e3b" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Foreground Atmospheric Lighting / Dust Motes -->
  <circle cx="90" cy="110" r="1" fill="#fbbf24" opacity="0.6" />
  <circle cx="150" cy="120" r="1.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="110" cy="160" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="70" cy="130" r="1.2" fill="#f43f5e" opacity="0.6" />

  <!-- Ornamental Plant on table right side for extra rich environment -->
  <path d="M 165 145 Q 170 130 175 145 Z" fill="#059669" />
  <path d="M 170 145 Q 178 135 178 145 Z" fill="#10b981" />
  <ellipse cx="170" cy="146" rx="6" ry="3" fill="#78350f" />
</svg>