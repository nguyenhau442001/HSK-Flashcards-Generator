<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Projector Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Accent -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior Elements -->
  <!-- Back Wall Grid / Architecture -->
  <path d="M 0 170 L 240 170" stroke="#334155" stroke-width="2" />
  <rect x="25" y="40" width="125" height="95" rx="4" fill="url(#screen-grad)" stroke="#475569" stroke-width="1.5" />
  
  <!-- Projector Light Cone from top -->
  <polygon points="180,10 160,80 230,80" fill="url(#beam-grad)" />
  <circle cx="180" cy="10" r="4" fill="#94a3b8" />

  <!-- Content on Screen (Projected Project Timeline/Charts) -->
  <g transform="translate(35, 50)">
    <!-- Kanban columns -->
    <rect x="10" y="10" width="30" height="65" rx="2" fill="#1e293b" opacity="0.8" />
    <rect x="45" y="10" width="30" height="65" rx="2" fill="#1e293b" opacity="0.8" />
    <rect x="80" y="10" width="30" height="65" rx="2" fill="#1e293b" opacity="0.8" />
    
    <!-- Task Cards with vibrant colors -->
    <rect x="14" y="16" width="22" height="14" rx="2" fill="#38bdf8" />
    <rect x="14" y="34" width="22" height="20" rx="2" fill="#334155" />
    
    <rect x="49" y="16" width="22" height="26" rx="2" fill="#f59e0b" />
    <rect x="49" y="46" width="22" height="12" rx="2" fill="#334155" />
    
    <rect x="84" y="16" width="22" height="18" rx="2" fill="#10b981" />
    <rect x="84" y="38" width="22" height="18" rx="2" fill="#10b981" opacity="0.7" />

    <!-- Progress curve overlay -->
    <path d="M 12 60 Q 50 20 100 25" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Office Plant Context -->
  <path d="M 210 170 L 225 170 L 220 130 L 215 130 Z" fill="#64748b" />
  <path d="M 217 130 C 217 110, 200 100, 195 90 C 205 105, 220 110, 217 130 Z" fill="#10b981" />
  <path d="M 217 130 C 220 105, 235 95, 240 85 C 230 100, 220 115, 217 130 Z" fill="#059669" />

  <!-- Main Desk & Props -->
  <rect x="130" y="150" width="90" height="8" rx="2" fill="#334155" />
  <rect x="145" y="158" width="8" height="22" fill="#475569" />
  <rect x="200" y="158" width="8" height="22" fill="#475569" />
  
  <!-- Laptop on Desk -->
  <path d="M 155 150 L 185 150 L 180 140 L 160 140 Z" fill="#64748b" />
  <rect x="150" y="150" width="40" height="2" fill="#94a3b8" />
  <!-- Coffee Mug -->
  <rect x="192" y="141" width="8" height="9" rx="1.5" fill="#f8fafc" />
  <path d="M 200 143 C 203 143, 203 148, 200 148" fill="none" stroke="#f8fafc" stroke-width="1.5" />

  <!-- Floor Shadow -->
  <ellipse cx="105" cy="172" rx="45" ry="8" fill="#090d16" opacity="0.6" />

  <!-- Character: Project Director / Manager ("指挥" - Directing/Managing) -->
  <g transform="translate(80, 75)">
    <!-- Ambient Lamp Glow on Character -->
    <circle cx="25" cy="40" r="50" fill="url(#lamp-glow)" />

    <!-- Legs & Shoes -->
    <rect x="14" y="70" width="10" height="25" rx="3" fill="#1e293b" />
    <rect x="30" y="70" width="10" height="25" rx="3" fill="#1e293b" />
    <path d="M 11 93 L 17 93 C 19 93, 20 95, 20 97 L 11 97 Z" fill="#0f172a" />
    <path d="M 27 93 L 33 93 C 35 93, 36 95, 36 97 L 27 97 Z" fill="#0f172a" />

    <!-- Torso (Dynamic leaning forward posture showing active command) -->
    <path d="M 12 35 L 42 35 L 38 72 L 16 72 Z" fill="#3b82f6" />
    <!-- Collar & Tie -->
    <polygon points="27,35 24,45 30,45" fill="#f8fafc" />
    <polygon points="27,45 25,60 27,65 29,60" fill="#ef4444" />

    <!-- Head & Hair -->
    <circle cx="27" cy="20" r="13" fill="#fde047" />
    <!-- Friendly, focused face profile / hair -->
    <path d="M 14 20 C 14 11, 22 10, 28 10 C 36 10, 40 15, 39 24 C 35 20, 20 22, 14 20 Z" fill="#334155" />
    <circle cx="32" cy="19" r="1.5" fill="#1e293b" /> <!-- Focused eye -->
    <path d="M 35 22 Q 38 23 37 25" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" /> <!-- Confident smile -->

    <!-- Back Arm (Holding Pointer/Gesturing toward screen) -->
    <path d="M 36 38 L 50 25 L 58 18" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="58" cy="18" r="3" fill="#fde047" />
    <!-- Laser Pointer Beam line -->
    <line x1="58" y1="18" x2="100" y2="-10" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />
    <circle cx="100" cy="-10" r="2.5" fill="#ef4444" opacity="0.9" />

    <!-- Front Arm (Commanding gesture, palm open directing the project) -->
    <path d="M 18 38 C 5 45, 0 30, -5 32" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    <circle cx="-5" cy="32" r="3" fill="#fde047" />
  </g>

  <!-- Accent Floating Elements representing Project Success/Metrics -->
  <g transform="translate(15, 30)" opacity="0.85">
    <circle cx="0" cy="0" r="12" fill="#10b981" opacity="0.2" />
    <path d="M -5 0 L -2 3 L 5 -4" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g transform="translate(195, 115)" opacity="0.85">
    <circle cx="0" cy="0" r="12" fill="#38bdf8" opacity="0.2" />
    <path d="M -4 -2 L 0 3 L 4 -2" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>