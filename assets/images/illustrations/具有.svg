<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- DNA Helix Structure -->
  <path d="M120 60 L120 180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
  <path d="M100 70 C100 60, 140 60, 140 70 C140 80, 100 80, 100 90 C100 100, 140 100, 140 110 C140 120, 100 120, 100 130 C100 140, 140 140, 140 150 C140 160, 100 160, 100 170" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Doctor Character -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 35 Q20 45 30 35 L30 70 L10 70 Z" fill="#e2e8f0"/>
    <rect x="12" y="35" width="16" height="5" fill="#38bdf8"/>
    <circle cx="15" cy="18" r="2" fill="#1e293b"/>
    <circle cx="25" cy="18" r="2" fill="#1e293b"/>
  </g>
  
  <!-- Patient Character (Child) -->
  <g transform="translate(160, 120)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M15 32 L15 60 L25 60 L25 32 Z" fill="#ec4899"/>
    <circle cx="17" cy="18" r="1.5" fill="#1e293b"/>
    <circle cx="23" cy="18" r="1.5" fill="#1e293b"/>
  </g>
  
  <!-- Medical Clipboard -->
  <rect x="80" y="140" width="40" height="50" rx="2" fill="#f8fafc"/>
  <line x1="85" y1="150" x2="115" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="85" y1="160" x2="115" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="85" y1="170" x2="105" y2="170" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Connection Lines -->
  <path d="M75 120 Q100 100 120 100" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="2 2"/>
  <path d="M160 130 Q140 120 120 110" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="2 2"/>
</svg>