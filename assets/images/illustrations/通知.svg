<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(40, 40)">
    <!-- Bulletin Board Frame -->
    <rect x="10" y="10" width="140" height="150" rx="8" fill="#475569"/>
    <rect x="15" y="15" width="130" height="140" rx="4" fill="#cbd5e1"/>
    
    <!-- The Notice Paper -->
    <rect x="35" y="35" width="90" height="100" rx="2" fill="#ffffff"/>
    
    <!-- Content lines on notice -->
    <rect x="45" y="50" width="70" height="6" rx="2" fill="#94a3b8"/>
    <rect x="45" y="65" width="70" height="6" rx="2" fill="#94a3b8"/>
    <rect x="45" y="80" width="50" height="6" rx="2" fill="#94a3b8"/>
    
    <!-- Thumbtack -->
    <circle cx="80" cy="30" r="6" fill="#fb923c"/>
    <circle cx="80" cy="30" r="2" fill="#f59e0b"/>
    
    <!-- Decorative elements -->
    <circle cx="120" cy="140" r="15" fill="#38bdf8" opacity="0.3"/>
    <path d="M130 150 L145 165" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Ambient light/glow -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.05"/>
  <circle cx="60" cy="180" r="30" fill="#ec4899" opacity="0.05"/>
</svg>