  <!-- Connecting lines representing communication -->
  <path d="M85 90 Q120 60 155 90" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M95 110 Q120 130 145 110" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
  
