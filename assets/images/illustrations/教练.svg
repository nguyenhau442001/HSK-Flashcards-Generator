<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Field Turf Gradient -->
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Stadium Light Glow -->
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold/Amber Glow for Highlights -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Coach's Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Orange Accent Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Tactical Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Main Container with Rounded Corners -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ================= BACKGROUND LAYER ================= -->
  <!-- Stadium Lights (Background Atmosphere) -->
  <circle cx="40" cy="40" r="60" fill="url(#lightGlow)" />
  <circle cx="200" cy="40" r="60" fill="url(#lightGlow)" />
  
  <!-- Light Beams -->
  <polygon points="25,20 0,160 80,160" fill="#38bdf8" opacity="0.08"/>
  <polygon points="215,20 160,160 240,160" fill="#38bdf8" opacity="0.08"/>

  <!-- Stadium Light Fixtures (Simplified) -->
  <circle cx="30" cy="25" r="3" fill="#e2e8f0"/>
  <circle cx="40" cy="20" r="3" fill="#e2e8f0"/>
  <circle cx="50" cy="25" r="3" fill="#e2e8f0"/>
  <polygon points="25,28 55,28 40,35" fill="#475569"/>

  <circle cx="190" cy="25" r="3" fill="#e2e8f0"/>
  <circle cx="200" cy="20" r="3" fill="#e2e8f0"/>
  <circle cx="210" cy="25" r="3" fill="#e2e8f0"/>
  <polygon points="185,28 215,28 200,35" fill="#475569"/>

  <!-- Soccer Field Ground -->
  <path d="M 0 150 L 240 150 L 240 240 L 0 240 Z" fill="url(#fieldGrad)"/>
  
  <!-- Field Markings (Perspective) -->
  <ellipse cx="120" cy="150" rx="60" ry="15" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="150" x2="240" y2="150" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <path d="M -20 210 L 260 210" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  <path d="M 40 150 L 0 240" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  <path d="M 200 150 L 240 240" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- ================= PROPS LAYER (BACKGROUND) ================= -->
  <!-- Training Cones -->
  <g transform="translate(35, 165) scale(0.7)">
    <path d="M 10 25 L 20 0 L 25 0 L 35 25 Z" fill="url(#orangeGrad)"/>
    <ellipse cx="22.5" cy="25" rx="15" ry="4" fill="#ea580c"/>
    <ellipse cx="22.5" cy="0" rx="3" ry="1" fill="#fddfcf"/>
    <!-- Cone Stripe -->
    <path d="M 15 12 L 30 12 L 32 17 L 13 17 Z" fill="#f8fafc"/>
  </g>
  
  <g transform="translate(195, 155) scale(0.55) rotate(-5)">
    <path d="M 10 25 L 20 0 L 25 0 L 35 25 Z" fill="url(#orangeGrad)"/>
    <ellipse cx="22.5" cy="25" rx="15" ry="4" fill="#ea580c"/>
    <ellipse cx="22.5" cy="0" rx="3" ry="1" fill="#fddfcf"/>
    <path d="M 15 12 L 30 12 L 32 17 L 13 17 Z" fill="#f8fafc"/>
  </g>

  <!-- ================= MAIN CHARACTER (COACH) ================= -->
  <!-- Coach Body & Head Group -->
  <g transform="translate(15, 5)">
    <!-- Torso / Jacket -->
    <path d="M 85 235 C 85 180, 100 145, 135 140 C 170 145, 185 180, 185 235 Z" fill="url(#jacketGrad)"/>
    <!-- Jacket Collar/Details -->
    <path d="M 110 143 C 120 155, 150 155, 160 143" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <!-- Orange Zipper Line & Accent Panel -->
    <path d="M 135 152 L 135 235" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 100 170 C 115 180, 115 210, 105 235" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <path d="M 170 170 C 155 180, 155 210, 165 235" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

    <!-- Neck -->
    <rect x="127" y="123" width="16" height="22" rx="4" fill="url(#skinGrad)"/>
    <path d="M 127 138 C 131 142, 139 142, 143 138" fill="none" stroke="#f97316" stroke-width="1.5"/>

    <!-- Head -->
    <path d="M 115 100 C 115 80, 155 80, 155 100 C 155 122, 115 122, 115 100 Z" fill="url(#skinGrad)"/>
    
    <!-- Ears -->
    <circle cx="114" cy="103" r="4.5" fill="url(#skinGrad)"/>
    <circle cx="156" cy="103" r="4.5" fill="url(#skinGrad)"/>

    <!-- Hair (Sides/Back) -->
    <path d="M 114 98 C 113 90, 120 85, 125 85 C 130 85, 150 85, 155 98 C 156 102, 154 106, 154 106 C 154 106, 151 98, 145 96 C 139 94, 131 94, 125 96 C 119 98, 116 106, 116 106" fill="#1e293b"/>

    <!-- Athletic Cap -->
    <path d="M 116 94 C 116 78, 154 78, 154 94 Z" fill="#0f172a"/> <!-- Cap Dome -->
    <path d="M 110 90 C 125 80, 145 80, 160 92" fill="none" stroke="url(#orangeGrad)" stroke-width="2.5"/> <!-- Cap Trim -->
    <path d="M 102 93 C 115 86, 130 86, 142 93 L 105 98 Z" fill="#0f172a"/> <!-- Visor/Brim pointing left/forward -->

    <!-- Face Details -->
    <!-- Eyes (Determined, Focused) -->
    <ellipse cx="127" cy="101" rx="2" ry="3" fill="#0f172a"/>
    <ellipse cx="143" cy="101" rx="2" ry="3" fill="#0f172a"/>
    <!-- Eyebrows -->
    <path d="M 123 96 Q 127 94 131 97" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 139 97 Q 143 94 147 96" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M 135 99 L 133 105 L 137 105" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Friendly/Active Mouth (Shouting instructions) -->
    <path d="M 129 111 C 129 116, 141 116, 141 111 Z" fill="#3f0712"/>
    <path d="M 131 112 C 133 114, 137 114, 139 112" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/> <!-- Teeth -->

    <!-- Whistle (Essential Coach Iconography) -->
    <!-- Lanyard -->
    <path d="M 129 140 L 132 162 L 138 162 L 141 140" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Metallic Whistle -->
    <g transform="translate(130, 160)">
      <rect x="1" y="2" width="8" height="5" rx="1" fill="#cbd5e1"/>
      <rect x="3" y="7" width="4" height="5" rx="0.5" fill="#94a3b8"/>
      <circle cx="5" cy="1" r="1.5" fill="none" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Glow on whistle -->
      <circle cx="3" cy="4" r="1" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Left Arm (Holding Clipboard) -->
    <path d="M 95 180 C 80 185, 65 200, 60 215 C 58 220, 65 230, 75 225 C 85 215, 95 195, 98 185" fill="url(#jacketGrad)"/>
    
    <!-- Right Arm (Gesturing/Pointing) -->
    <path d="M 175 175 C 190 180, 210 175, 225 165 C 230 160, 225 150, 215 155 C 200 165, 185 170, 175 170" fill="url(#jacketGrad)"/>
    <!-- Hand pointing -->
    <circle cx="226" cy="162" r="5" fill="url(#skinGrad)"/>
    <path d="M 226 162 L 232 159" stroke="url(#skinGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================= FOREGROUND LAYER (TACTICAL BOARD) ================= -->
  <!-- Tactical Clipboard (Held in Coach's Left Hand) -->
  <g transform="translate(35, 155) rotate(-8)">
    <!-- Clipboard Shadow -->
    <rect x="-2" y="2" width="50" height="65" rx="4" fill="#090d16" opacity="0.5"/>
    <!-- Board Base -->
    <rect x="0" y="0" width="50" height="65" rx="4" fill="#475569"/>
    <!-- Metallic Clip -->
    <rect x="18" y="-4" width="14" height="8" rx="1" fill="#94a3b8"/>
    <circle cx="25" cy="-1" r="1.5" fill="#cbd5e1"/>
    
    <!-- Field Sheet (Green) -->
    <rect x="3" y="6" width="44" height="54" rx="2" fill="url(#boardGrad)"/>
    
    <!-- Tactical Markings (No real text/letters) -->
    <!-- Field Lines -->
    <rect x="6" y="9" width="38" height="48" rx="1" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
    <line x1="6" y1="33" x2="44" y2="33" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
    <circle cx="25" cy="33" r="6" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
    <!-- Penalty Box -->
    <rect x="14" y="9" width="22" height="8" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
    <rect x="14" y="49" width="22" height="8" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
    
    <!-- Strategy Drawings (X's and O's and Arrows) -->
    <!-- Team A (O) - Cyan -->
    <circle cx="15" cy="22" r="1.5" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="32" cy="28" r="1.5" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="22" cy="42" r="1.5" fill="none" stroke="#38bdf8" stroke-width="1"/>
    
    <!-- Team B (X) - Orange/Red -->
    <path d="M 12,38 L 15,41 M 15,38 L 12,41" stroke="#f97316" stroke-width="1"/>
    <path d="M 33,18 L 36,21 M 36,18 L 33,21" stroke="#f97316" stroke-width="1"/>
    <path d="M 23,26 L 26,29 M 26,26 L 23,29" stroke="#f97316" stroke-width="1"/>
    
    <!-- Tactical Movement Arrow -->
    <path d="M 25 40 Q 30 35, 26 30" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="24,31 28,29 27,33" fill="#fbbf24"/>

    <path d="M 15 24 Q 20 25, 22 27" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2,1"/>
  </g>

  <!-- Coach's Hand holding the clipboard -->
  <g transform="translate(35, 155) rotate(-8)">
    <!-- Thumb wrapping over -->
    <path d="M 46 35 C 43 35, 41 38, 42 41 C 43 43, 47 43, 48 40 Z" fill="#fed7aa"/>
    <!-- Fingers behind/wrapping side -->
    <path d="M 50 20 C 51 22, 51 28, 50 30" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ================= FOREGROUND SOCCER BALL ================= -->
  <g transform="translate(115, 205)">
    <!-- Ball Shadow -->
    <ellipse cx="12" cy="18" rx="16" ry="5" fill="#022c22" opacity="0.6"/>
    
    <!-- Ball Base -->
    <circle cx="12" cy="6" r="14" fill="#f8fafc"/>
    
    <!-- Soccer Ball Pentagons (Classic Pattern) -->
    <!-- Center Pentagon -->
    <polygon points="12,0 17,4 15,9 9,9 7,4" fill="#1e293b"/>
    <!-- Outer Lines & Partial Pentagons -->
    <line x1="12" y1="0" x2="12" y2="-8" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="7" y1="4" x2="0" y2="2" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="17" y1="4" x2="24" y2="2" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="15" y1="9" x2="20" y2="16" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="9" y1="9" x2="4" y2="16" stroke="#1e293b" stroke-width="1.5"/>
    
    <polygon points="24,2 26,8 21,12 18,7" fill="#1e293b"/>
    <polygon points="0,2 -2,8 3,12 6,7" fill="#1e293b"/>
    <polygon points="7,17 12,14 17,17 15,20 9,20" fill="#1e293b"/>
    
    <!-- Ball Highlight/Shade -->
    <path d="M -2 6 A 14 14 0 0 1 21 -3 A 12 12 0 0 0 1 9 Z" fill="#ffffff" opacity="0.25"/>
    <path d="M 2 15 A 14 14 0 0 0 24 6 A 15 15 0 0 1 5 17 Z" fill="#94a3b8" opacity="0.2"/>
  </g>

  <!-- Dynamic Grass Blades in Foreground -->
  <path d="M 100 225 Q 98 215, 92 212 Q 97 218, 101 225 Z" fill="#10b981"/>
  <path d="M 104 226 Q 105 218, 108 215 Q 107 221, 105 226 Z" fill="#059669"/>
  <path d="M 148 220 Q 152 210, 158 208 Q 154 215, 149 220 Z" fill="#10b981"/>
  <path d="M 145 222 Q 143 214, 140 212 Q 143 217, 144 222 Z" fill="#059669"/>

  <!-- Ambient Lighting Overlays (Vignette & Glows) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <circle cx="120" cy="100" r="110" fill="url(#amberGlow)" pointer-events="none"/>
</svg>