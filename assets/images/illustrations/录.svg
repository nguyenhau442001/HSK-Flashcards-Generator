<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="20" y="150" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="165" width="10" height="60" fill="#475569"/>
  <rect x="190" y="165" width="10" height="60" fill="#475569"/>
  
  <!-- Teacher -->
  <circle cx="70" cy="100" r="25" fill="#fde68a"/>
  <path d="M50 120 Q70 150 90 120" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  <rect x="50" y="125" width="40" height="40" rx="5" fill="#fb923c"/>
  
  <!-- Microphone -->
  <circle cx="130" cy="120" r="12" fill="#94a3b8"/>
  <rect x="127" y="132" width="6" height="20" fill="#64748b"/>
  <rect x="120" y="152" width="20" height="4" fill="#475569"/>
  
  <!-- Book/Text -->
  <rect x="150" y="130" width="40" height="20" rx="2" fill="#ec4899"/>
  <line x1="155" y1="135" x2="185" y2="135" stroke="#fbcfe8" stroke-width="2"/>
  <line x1="155" y1="142" x2="185" y2="142" stroke="#fbcfe8" stroke-width="2"/>
  
  <!-- Recording Indicator -->
  <circle cx="210" cy="30" r="6" fill="#ef4444"/>
  <circle cx="210" cy="30" r="8" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
  
  <!-- Sound Waves -->
  <path d="M145 120 Q155 110 165 120 T185 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M145 125 Q155 115 165 125 T185 125" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Background elements -->
  <rect x="30" y="40" width="5" height="60" rx="2" fill="#334155"/>
  <rect x="200" y="80" width="20" height="40" rx="2" fill="#334155"/>
</svg>