<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Scanner Light Beam Gradient -->
    <linearGradient id="scannerBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Copied Paper Gradient (Tinted) -->
    <linearGradient id="copiedPaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow elements -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.04" filter="blur(20px)" />
  <circle cx="190" cy="50" r="40" fill="#f59e0b" opacity="0.05" filter="blur(15px)" />

  <!-- Background Environment: Bookshelf / Wall details -->
  <g opacity="0.2">
    <rect x="25" y="30" width="45" height="60" rx="4" fill="#64748b" />
    <rect x="75" y="25" width="20" height="65" rx="3" fill="#475569" />
    <rect x="100" y="35" width="35" height="55" rx="4" fill="#64748b" />
    <path d="M 20 95 L 220 95" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Desk Surface -->
  <path d="M 10 185 C 60 180, 180 180, 230 185 L 235 225 C 235 233, 227 235, 220 235 L 20 235 C 13 235, 5 233, 5 225 Z" fill="url(#deskGrad)" />
  <path d="M 10 185 C 60 180, 180 180, 230 185" stroke="#475569" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Ambient Desk Prop: Coffee Mug -->
  <g transform="translate(190, 150)">
    <rect x="0" y="5" width="18" height="22" rx="3" fill="#cbd5e1" />
    <path d="M 18 10 C 23 10, 23 20, 18 20" stroke="#cbd5e1" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 4 2 C 7 0, 11 0, 14 2" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- === MAIN SUBJECT: THE COPY MACHINE (SCANNER/PRINTER) === -->
  
  <!-- Lower Paper Tray (Output) with Copied Papers -->
  <g transform="translate(65, 160)">
    <!-- Tray base -->
    <path d="M 10 25 L 100 25 L 110 40 L 0 40 Z" fill="#334155" />
    
    <!-- Ejected/Copied Documents (Multiple flying out to show "Copying" action) -->
    <!-- Copy 3 (Bottom) -->
    <g transform="translate(25, -15) rotate(-8)">
      <rect width="60" height="40" rx="3" fill="url(#copiedPaperGrad)" stroke="#38bdf8" stroke-width="1" />
      <line x1="10" y1="10" x2="35" y2="10" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <line x1="10" y1="18" x2="50" y2="18" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <line x1="10" y1="26" x2="40" y2="26" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Copy 2 (Middle) -->
    <g transform="translate(15, -22) rotate(-3)">
      <rect width="60" height="40" rx="3" fill="url(#copiedPaperGrad)" stroke="#38bdf8" stroke-width="1" />
      <line x1="10" y1="10" x2="35" y2="10" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.7" />
      <line x1="10" y1="18" x2="50" y2="18" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.7" />
      <line x1="10" y1="26" x2="40" y2="26" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Copy 1 (Top) -->
    <g transform="translate(5, -28) rotate(2)">
      <rect width="60" height="40" rx="3" fill="url(#paperGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="10" y1="10" x2="35" y2="10" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
      <line x1="10" y1="18" x2="50" y2="18" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      <line x1="10" y1="26" x2="40" y2="26" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      <!-- Tiny star/sparkle on top copy -->
      <path d="M 48 10 L 50 14 L 54 16 L 50 18 L 48 22 L 46 18 L 42 16 L 46 14 Z" fill="#f59e0b" />
    </g>
  </g>

  <!-- Original Document Feeding In (Top/Back) -->
  <g transform="translate(85, 62) rotate(-15)">
    <rect width="50" height="35" rx="2" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Content preview on original -->
    <circle cx="15" cy="12" r="5" fill="#f59e0b" />
    <line x1="25" y1="10" x2="42" y2="10" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="22" x2="42" y2="22" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Main Body of Multi-Function Printer / Copier -->
  <g transform="translate(50, 95)">
    <!-- Copier Base / Paper Cassette area -->
    <rect x="0" y="35" width="140" height="40" rx="6" fill="#475569" />
    <rect x="15" y="47" width="30" height="4" rx="2" fill="#334155" />
    <rect x="15" y="59" width="30" height="4" rx="2" fill="#334155" />

    <!-- Main Housing -->
    <rect x="0" y="10" width="140" height="30" rx="4" fill="#64748b" />

    <!-- Scanner Glass / Mid Section -->
    <rect x="8" y="5" width="124" height="8" rx="2" fill="#1e293b" />
    
    <!-- Active Laser/Light Scanning Effect -->
    <polygon points="20,13 120,13 130,35 10,35" fill="url(#scannerBeam)" filter="url(#glow)" opacity="0.8" />
    <line x1="15" y1="13" x2="125" y2="13" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />

    <!-- Control Panel & Screen -->
    <rect x="95" y="16" width="30" height="18" rx="3" fill="#1e293b" />
    <!-- Screen UI graphics (abstract indicators) -->
    <rect x="100" y="20" width="14" height="8" rx="1" fill="#38bdf8" />
    <!-- Buttons -->
    <circle cx="85" cy="22" r="3" fill="#10b981" />
    <circle cx="85" cy="30" r="3" fill="#ef4444" />

    <!-- Top Lid / Document Feeder (ADF) -->
    <path d="M 12 5 L 128 5 C 132 5, 135 0, 135 -3 L 135 -5 C 135 -8, 132 -10, 128 -10 L 12 -10 C 8 -10, 5 -8, 5 -5 L 5 -3 C 5 0, 8 5, 12 5 Z" fill="#475569" />
    <!-- Lid highlight -->
    <line x1="15" y1="-2" x2="125" y2="-2" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- === ACTION EFFECTS & DATA DUPLICATION PARTICLES === -->
  
  <!-- Floating Duplicate Vectors / Icons (Visualizing "Copy") -->
  <!-- Document Copy Icon floating right -->
  <g transform="translate(180, 95)" filter="url(#glow)">
    <rect x="0" y="0" width="24" height="30" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="6" y="-6" width="24" height="30" rx="3" fill="#38bdf8" opacity="0.4" />
    <line x1="5" y1="8" x2="19" y2="8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="5" y1="15" x2="19" y2="15" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="5" y1="22" x2="14" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Plus/Duplication indicators -->
  <g transform="translate(155, 115)">
    <circle cx="0" cy="0" r="10" fill="#10b981" opacity="0.2" />
    <path d="M -4 0 L 4 0 M 0 -4 L 0 4" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <g transform="translate(35, 125) scale(0.7)">
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.2" />
    <path d="M -4 0 L 4 0 M 0 -4 L 0 4" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Glowing Digital Data Streams / Sparks -->
  <circle cx="160" cy="70" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="175" cy="80" r="1.5" fill="#fbbf24" />
  <circle cx="50" cy="110" r="2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="40" cy="95" r="3" fill="#10b981" filter="url(#glow)" />
  
  <!-- Sparkle accents near output -->
  <path d="M 120,150 L 122,154 L 126,156 L 122,158 L 120,162 L 118,158 L 114,156 L 118,154 Z" fill="#fbbf24" filter="url(#glow)" />
  <path d="M 45,175 L 46,177 L 49,178 L 46,179 L 45,182 L 44,179 L 41,178 L 44,177 Z" fill="#38bdf8" />

  <!-- Dynamic Motion Arrow curving from original to copies -->
  <path d="M 125,50 C 145,55, 155,75, 150,95" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 4" fill="none" stroke-linecap="round" opacity="0.8" />
  <polygon points="152,98 145,92 148,89" fill="#f59e0b" />

</svg>