<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Rain effect -->
  <g stroke="#94a3b8" stroke-width="1" opacity="0.4">
    <line x1="20" y1="0" x2="10" y2="240"/>
    <line x1="60" y1="0" x2="50" y2="240"/>
    <line x1="100" y1="0" x2="90" y2="240"/>
    <line x1="140" y1="0" x2="130" y2="240"/>
    <line x1="180" y1="0" x2="170" y2="240"/>
    <line x1="220" y1="0" x2="210" y2="240"/>
  </g>

  <!-- Soccer Field Ground -->
  <path d="M0 180 C 80 160, 160 160, 240 180 L 240 240 L 0 240 Z" fill="#10b981" opacity="0.6"/>
  <ellipse cx="120" cy="190" rx="40" ry="15" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Character 1 (Player) -->
  <g transform="translate(80, 150)">
    <circle cx="10" cy="10" r="8" fill="#fbbf24"/>
    <path d="M2 20 L 18 20 L 15 45 L 5 45 Z" fill="#ec4899"/>
    <line x1="10" y1="20" x2="10" y2="35" stroke="#ec4899" stroke-width="4"/>
    <line x1="10" y1="35" x2="5" y2="55" stroke="#fbbf24" stroke-width="3"/>
    <line x1="10" y1="35" x2="15" y2="55" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <!-- Character 2 (Player) -->
  <g transform="translate(140, 155)">
    <circle cx="10" cy="10" r="8" fill="#38bdf8"/>
    <path d="M2 20 L 18 20 L 15 45 L 5 45 Z" fill="#38bdf8"/>
    <line x1="10" y1="20" x2="10" y2="35" stroke="#38bdf8" stroke-width="4"/>
    <line x1="10" y1="35" x2="5" y2="55" stroke="#38bdf8" stroke-width="3"/>
    <line x1="10" y1="35" x2="15" y2="55" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Soccer Ball -->
  <circle cx="110" cy="200" r="6" fill="#f1f5f9"/>
  <path d="M110 194 A 6 6 0 0 1 116 200" fill="none" stroke="#0f172a" stroke-width="1"/>

  <!-- Puddle -->
  <ellipse cx="120" cy="220" rx="30" ry="8" fill="#334155" opacity="0.8"/>

  <!-- Warning Sign (Abstract representation of unfavorable conditions) -->
  <path d="M200 40 L 220 75 L 180 75 Z" fill="#fb923c"/>
  <rect x="208" y="50" width="4" height="12" rx="2" fill="#0f172a"/>
  <circle cx="210" cy="68" r="2" fill="#0f172a"/>
</svg>