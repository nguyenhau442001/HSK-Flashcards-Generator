<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Workbench -->
  <rect x="30" y="150" width="180" height="15" rx="2" fill="#334155"/>
  <rect x="40" y="165" width="10" height="60" fill="#475569"/>
  <rect x="190" y="165" width="10" height="60" fill="#475569"/>
  
  <!-- Product under inspection (The "Quality" focus) -->
  <rect x="80" y="120" width="80" height="40" rx="4" fill="#f1f5f9"/>
  <circle cx="120" cy="140" r="12" fill="#38bdf8"/>
  
  <!-- Inspector Character -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-30 100 Q0 80 30 100 L20 130 L-20 130 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="0" cy="70" r="20" fill="#fde68a"/>
    <!-- Magnifying Glass -->
    <circle cx="25" cy="60" r="12" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <line x1="33" y1="68" x2="50" y2="85" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <!-- Eyes looking at product -->
    <circle cx="-8" cy="65" r="2" fill="#1e293b"/>
    <circle cx="8" cy="65" r="2" fill="#1e293b"/>
  </g>
  
  <!-- Quality Check Mark (Stylized) -->
  <path d="M180 60 L190 75 L210 50" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ambient Light/Detail -->
  <circle cx="200" cy="30" r="40" fill="#fb923c" opacity="0.05"/>
  <rect x="160" y="100" width="40" height="4" rx="2" fill="#ec4899"/>
  <rect x="160" y="110" width="30" height="4" rx="2" fill="#ec4899" opacity="0.6"/>
</svg>