<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#475569"/>
  <rect x="40" y="175" width="10" height="50" fill="#334155"/>
  <rect x="190" y="175" width="10" height="50" fill="#334155"/>

  <!-- Steam/Aroma Effect -->
  <path d="M120 120 Q130 100 120 80 M130 115 Q140 95 130 75" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Plate of Food -->
  <ellipse cx="120" cy="155" rx="50" ry="15" fill="#fb923c"/>
  <circle cx="105" cy="150" r="12" fill="#ec4899"/>
  <circle cx="135" cy="152" r="10" fill="#10b981"/>
  <circle cx="120" cy="145" r="14" fill="#f59e0b"/>

  <!-- Mother Character -->
  <g transform="translate(160, 80)">
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <path d="M-10 -5 L-5 -5 M5 -5 L10 -5" stroke="#334155" stroke-width="2"/>
    <path d="M-5 10 Q0 15 5 10" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="-20" y="25" width="40" height="60" rx="10" fill="#38bdf8"/>
    <rect x="-25" y="30" width="10" height="40" rx="5" fill="#38bdf8"/>
    <rect x="15" y="30" width="10" height="40" rx="5" fill="#38bdf8"/>
  </g>

  <!-- Child Character -->
  <g transform="translate(80, 90)">
    <circle cx="0" cy="0" r="20" fill="#fde68a"/>
    <circle cx="-6" cy="-5" r="3" fill="#334155"/>
    <circle cx="6" cy="-5" r="3" fill="#334155"/>
    <path d="M-5 8 Q0 12 5 8" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="-15" y="20" width="30" height="50" rx="8" fill="#fb923c"/>
    <path d="M-15 25 L-25 40 M15 25 L25 40" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Background Decor -->
  <rect x="30" y="40" width="40" height="5" rx="2" fill="#334155"/>
  <rect x="30" y="50" width="30" height="5" rx="2" fill="#334155"/>
</svg>