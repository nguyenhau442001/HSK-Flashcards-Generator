  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Kitchen Counter -->
  <rect x="20" y="160" width="200" height="80" rx="8" fill="#334155"/>
  <rect x="20" y="160" width="200" height="15" fill="#475569"/>
  
