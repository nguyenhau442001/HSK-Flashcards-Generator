<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Field markings -->
  <path d="M40 180 L200 180" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="180" r="30" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- Referee Body -->
  <g transform="translate(120, 120)">
    <!-- Legs -->
    <rect x="-15" y="20" width="10" height="40" fill="#334155" rx="4"/>
    <rect x="5" y="20" width="10" height="40" fill="#334155" rx="4"/>
    
    <!-- Torso (Black and white stripes) -->
    <rect x="-20" y="-30" width="40" height="50" fill="#f8fafc" rx="8"/>
    <rect x="-20" y="-20" width="40" height="8" fill="#1e293b"/>
    <rect x="-20" y="-5" width="40" height="8" fill="#1e293b"/>
    <rect x="-20" y="10" width="40" height="8" fill="#1e293b"/>
    
    <!-- Arms -->
    <path d="M-20 -10 L-45 10" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <path d="M20 -10 L45 -30" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="0" cy="-50" r="20" fill="#fde68a"/>
    <rect x="-12" y="-55" width="24" height="4" fill="#1e293b" rx="2"/>
    
    <!-- Whistle -->
    <circle cx="0" cy="-35" r="6" fill="#fb923c"/>
    <path d="M0 -35 L-15 -30" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Sound Waves -->
    <path d="M-25 -40 Q-35 -45 -25 -50" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-30 -35 Q-45 -40 -30 -55" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Background Accents -->
  <circle cx="50" cy="60" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="50" r="6" fill="#ec4899" opacity="0.6"/>
  <circle cx="200" cy="200" r="5" fill="#10b981" opacity="0.6"/>
</svg>