<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed/Pillow -->
  <rect x="40" y="140" width="160" height="60" rx="10" fill="#334155"/>
  <path d="M50 140 Q50 120 80 120 L100 120 Q130 120 130 140" fill="#475569"/>
  
  <!-- Character -->
  <g transform="translate(120, 130)">
    <!-- Body under blanket -->
    <rect x="-70" y="30" width="140" height="40" rx="10" fill="#64748b"/>
    <!-- Pale Face -->
    <circle cx="0" cy="0" r="35" fill="#cbd5e1"/>
    <!-- Eyes (tired) -->
    <ellipse cx="-12" cy="-5" rx="4" ry="2" fill="#1e293b"/>
    <ellipse cx="12" cy="-5" rx="4" ry="2" fill="#1e293b"/>
    <!-- Mouth (frown) -->
    <path d="M-10 15 Q0 10 10 15" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Hair -->
    <path d="M-30 -10 Q-35 -40 0 -40 Q35 -40 30 -10" fill="#334155"/>
  </g>
  
  <!-- Props: Medicine/Thermometer -->
  <rect x="160" y="170" width="30" height="15" rx="3" fill="#fb923c"/>
  <circle cx="175" cy="177" r="5" fill="#f59e0b"/>
  
  <!-- Ambient glow/details -->
  <circle cx="200" cy="50" r="30" fill="#1e293b" opacity="0.5"/>
  <path d="M20 200 L220 200" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Thermometer icon -->
  <rect x="30" y="40" width="10" height="50" rx="5" fill="#94a3b8"/>
  <circle cx="35" cy="90" r="8" fill="#ec4899"/>
  <rect x="33" y="50" width="4" height="30" rx="1" fill="#ec4899"/>
</svg>