<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment / Store Interior -->
  <!-- Ambient lighting/glow from ceiling lights -->
  <ellipse cx="120" cy="15" rx="80" ry="15" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>
  <ellipse cx="60" cy="15" rx="40" ry="10" fill="#fbbf24" opacity="0.1" filter="url(#glow)"/>
  <ellipse cx="180" cy="15" rx="40" ry="10" fill="#fbbf24" opacity="0.1" filter="url(#glow)"/>

  <!-- Back Wall Shelving Units -->
  <!-- Shelf 1 -->
  <rect x="25" y="45" width="85" height="6" rx="3" fill="#475569"/>
  <rect x="35" y="25" width="20" height="20" rx="4" fill="#10b981"/>
  <rect x="65" y="28" width="16" height="17" rx="3" fill="#f43f5e"/>
  <rect x="88" y="22" width="14" height="23" rx="3" fill="#38bdf8"/>

  <!-- Shelf 2 -->
  <rect x="130" y="45" width="85" height="6" rx="3" fill="#475569"/>
  <rect x="140" y="24" width="18" height="21" rx="3" fill="#fbbf24"/>
  <rect x="165" y="20" width="22" height="25" rx="4" fill="#a855f7"/>
  <rect x="195" y="26" width="12" height="19" rx="3" fill="#6366f1"/>

  <!-- Lower Display Shelves with colorful merchandise -->
  <rect x="20" y="95" width="95" height="8" rx="3" fill="#334155"/>
  <rect x="30" y="65" width="18" height="30" rx="4" fill="#38bdf8"/>
  <rect x="55" y="60" width="22" height="35" rx="4" fill="#f59e0b"/>
  <rect x="84" y="68" width="20" height="27" rx="4" fill="#ec4899"/>

  <rect x="125" y="95" width="95" height="8" rx="3" fill="#334155"/>
  <rect x="135" y="62" width="25" height="33" rx="4" fill="#10b981"/>
  <rect x="168" y="66" width="18" height="29" rx="4" fill="#6366f1"/>
  <rect x="192" y="60" width="20" height="35" rx="4" fill="#fbbf24"/>

  <!-- Store Floor -->
  <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="175" x2="240" y2="175" stroke="#475569" stroke-width="2"/>
  <!-- Floor perspective lines -->
  <line x1="120" y1="175" x2="40" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="175" x2="200" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>

  <!-- Foreground Props: Shopping Cart (Filled with goodies) -->
  <!-- Cart Wheels -->
  <circle cx="170" cy="205" r="7" fill="#0f172a"/>
  <circle cx="170" cy="205" r="3" fill="#94a3b8"/>
  <circle cx="215" cy="200" r="7" fill="#0f172a"/>
  <circle cx="215" cy="200" r="3" fill="#94a3b8"/>
  <!-- Cart Body / Basket -->
  <path d="M150 140 L225 140 L220 185 L160 185 Z" fill="#94a3b8" opacity="0.9"/>
  <path d="M145 130 L229 130 L225 140 L150 140 Z" fill="#cbd5e1"/>
  <!-- Cart Handle -->
  <path d="M145 130 L135 110" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <!-- Cart Mesh Pattern -->
  <line x1="160" y1="140" x2="168" y2="185" stroke="#64748b" stroke-width="2"/>
  <line x1="180" y1="140" x2="188" y2="185" stroke="#64748b" stroke-width="2"/>
  <line x1="200" y1="140" x2="208" y2="185" stroke="#64748b" stroke-width="2"/>
  <!-- Items in Cart -->
  <rect x="160" y="115" width="22" height="30" rx="4" fill="#f43f5e"/>
  <circle cx="200" cy="125" r="12" fill="#10b981"/>
  <rect x="185" y="120" width="30" height="25" rx="4" fill="#fbbf24"/>

  <!-- Main Character: Enthusiastic Shopper -->
  <!-- Character Shadow -->
  <ellipse cx="95" cy="210" rx="35" ry="10" fill="#020617" opacity="0.5"/>

  <!-- Left Arm (Holding shopping bag) -->
  <path d="M80 120 L55 145 L70 160" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="72" cy="163" r="6" fill="#fde047"/> <!-- Hand -->

  <!-- Shopping Bags in Left Hand -->
  <!-- Pink Bag -->
  <path d="M55 160 L85 160 L90 205 L50 205 Z" fill="url(#bagGrad)"/>
  <path d="M62 160 C62 150 78 150 78 160" fill="none" stroke="#fbcfe8" stroke-width="3"/>
  <!-- Orange Bag sticking out -->
  <path d="M65 170 L95 170 L100 215 L60 215 Z" fill="#f97316"/>
  <path d="M72 170 C72 160 88 160 88 170" fill="none" stroke="#ffedd5" stroke-width="3"/>

  <!-- Body / Torso (Wearing stylish winter/fall coat) -->
  <path d="M70 110 L115 110 L125 175 L65 175 Z" fill="url(#coatGrad)"/>
  <path d="M92 110 L92 175" stroke="#b45309" stroke-width="3"/> <!-- Coat opening -->

  <!-- Scarf -->
  <path d="M75 102 C85 95 105 95 115 102 L110 118 L80 118 Z" fill="#38bdf8"/>
  <path d="M105 115 L115 155 L100 160 L95 120 Z" fill="#0ea5e9"/> <!-- Scarf tail -->

  <!-- Legs & Boots -->
  <path d="M78 175 L75 210" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <path d="M107 175 L110 210" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <!-- Boots -->
  <path d="M72 205 L83 205 L83 215 L68 215 Z" fill="#334155" rx="2"/>
  <path d="M107 205 L118 205 L118 215 L103 215 Z" fill="#334155" rx="2"/>

  <!-- Right Arm (Reaching out happily to examine/pick up an item) -->
  <path d="M110 115 L145 105 L160 90" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="163" cy="87" r="6" fill="#fde047"/> <!-- Right Hand -->

  <!-- Neck -->
  <rect x="88" y="90" width="10" height="20" fill="#fde047"/>

  <!-- Head & Face -->
  <circle cx="93" cy="75" r="22" fill="#fde047"/>

  <!-- Hair (Stylized modern bob/cut) -->
  <path d="M71 70 C71 50 115 50 115 75 C115 85 110 90 105 85 C100 80 95 90 93 75 C91 60 85 60 80 70 Z" fill="#1e293b"/>

  <!-- Facial Expression: Joyful, excited eyes and smiling mouth -->
  <circle cx="87" cy="74" r="2.5" fill="#0f172a"/>
  <circle cx="101" cy="74" r="2.5" fill="#0f172a"/>
  <!-- Happy open smile -->
  <path d="M90 82 Q94 88 98 82" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="83" cy="78" r="3.5" fill="#f43f5e" opacity="0.4"/>
  <circle cx="105" cy="78" r="3.5" fill="#f43f5e" opacity="0.4"/>

  <!-- Floating Sparkles / Action Highlights representing exciting discovery during shopping -->
  <g fill="#fbbf24">
    <path d="M 140 50 Q 140 60 130 60 Q 140 60 140 70 Q 140 60 150 60 Q 140 60 140 50 Z"/>
    <path d="M 45 90 Q 45 96 39 96 Q 45 96 45 102 Q 45 96 51 96 Q 45 96 45 90 Z" transform="scale(0.7) translate(20, 20)"/>
    <circle cx="130" cy="40" r="3" opacity="0.8"/>
    <circle cx="155" cy="70" r="2" opacity="0.8"/>
  </g>
</svg>