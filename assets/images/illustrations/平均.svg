<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow behind study desk -->
  <ellipse cx="120" cy="140" rx="90" ry="70" fill="url(#glowGrad)" />

  <!-- Background Environment: Study Room -->
  <!-- Bookshelf -->
  <rect x="25" y="45" width="40" height="90" rx="4" fill="#1e293b" opacity="0.6"/>
  <rect x="30" y="55" width="30" height="8" rx="2" fill="#334155"/>
  <rect x="30" y="75" width="30" height="8" rx="2" fill="#334155"/>
  <rect x="30" y="95" width="30" height="8" rx="2" fill="#334155"/>
  <!-- Books on shelf -->
  <path d="M34 55L34 47C34 45.8 35 45 36 45L39 45C40 45 41 45.8 41 47L41 55Z" fill="#f59e0b" opacity="0.8"/>
  <path d="M44 55L44 49C44 48.4 44.5 48 45 48L47 48C47.5 48 48 48.4 48 49L48 55Z" fill="#ec4899" opacity="0.8"/>
  <path d="M33 75L33 68C33 67.4 33.5 67 34 67L38 67C38.5 67 39 67.4 39 68L39 75Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Window with night city glow -->
  <path d="M175 45 L210 45 L210 105 L175 105 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="192" y1="45" x2="192" y2="105" stroke="#334155" stroke-width="1.5"/>
  <line x1="175" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="1.5"/>
  <!-- City lights through window -->
  <circle cx="183" cy="60" r="1.5" fill="#fbb6ce" opacity="0.8"/>
  <circle cx="201" cy="65" r="1.5" fill="#67e8f9" opacity="0.8"/>
  <circle cx="188" cy="90" r="2" fill="#fde047" opacity="0.8"/>

  <!-- Desk Surface -->
  <rect x="35" y="155" width="170" height="12" rx="3" fill="#475569" />
  <rect x="25" y="167" width="190" height="6" rx="2" fill="#334155" />

  <!-- Desk Lamp -->
  <path d="M165 155 L175 125 L185 155 Z" fill="#64748b" />
  <path d="M175 125 L160 100 L190 100 Z" fill="#f59e0b" />
  <ellipse cx="175" cy="100" rx="15" ry="5" fill="#fbbf24" />

  <!-- Floating Report Card / Achievement Board (High Average Score) -->
  <g transform="translate(65, 30)">
    <!-- Card Background -->
    <rect x="0" y="0" width="110" height="75" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Header Icon/Bar -->
    <rect x="12" y="12" width="20" height="14" rx="3" fill="#10b981" opacity="0.3" />
    <path d="M17 19 L21 23 L29 15" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Mini Bar Chart representing high averages -->
    <rect x="15" y="45" width="12" height="22" rx="2" fill="#334155" />
    <rect x="15" y="52" width="12" height="15" rx="2" fill="#38bdf8" />

    <rect x="33" y="38" width="12" height="29" rx="2" fill="#334155" />
    <rect x="33" y="42" width="12" height="25" rx="2" fill="#38bdf8" />

    <rect x="51" y="31" width="12" height="36" rx="2" fill="#334155" />
    <rect x="51" y="31" width="12" height="36" rx="2" fill="#f59e0b" />

    <rect x="69" y="24" width="12" height="43" rx="2" fill="#334155" />
    <rect x="69" y="24" width="12" height="43" rx="2" fill="#10b981" />

    <!-- Trend Arrow soaring high -->
    <path d="M18 45 Q 45 30, 85 18" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <path d="M78 17 L86 17 L84 25" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Shiny Star badge -->
    <path d="M93 50 L95.5 55 L101 56 L97 60 L98 65 L93 62 L88 65 L89 60 L85 56 L90.5 55 Z" fill="#fbbf24" />
  </g>

  <!-- Laptop on Desk -->
  <path d="M85 155 L125 155 L130 135 L80 135 Z" fill="#64748b" />
  <rect x="83" y="137" width="44" height="16" rx="2" fill="#0f172a" />
  <!-- Screen content: glowing bar graph -->
  <rect x="88" y="141" width="6" height="8" rx="1" fill="#38bdf8" />
  <rect x="97" y="139" width="6" height="10" rx="1" fill="#38bdf8" />
  <rect x="106" y="143" width="6" height="6" rx="1" fill="#38bdf8" />
  <rect x="115" y="137" width="6" height="12" rx="1" fill="#10b981" />

  <!-- Coffee Mug -->
  <rect x="55" y="142" width="12" height="13" rx="2" fill="#f8fafc" />
  <path d="M67 145 C71 145, 71 151, 67 152" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />

  <!-- Main Character (Student/Achiever) -->
  <g transform="translate(95, 95)">
    <!-- Body / Torso (Hoodie) -->
    <path d="M20 40 L50 40 C52 40, 55 43, 58 50 L65 72 C66 75, 63 78, 60 78 L10 78 C7 78, 4 75, 5 72 L12 50 C15 43, 18 40, 20 40 Z" fill="#38bdf8" />
    
    <!-- Hoodie Strings -->
    <path d="M28 40 L28 50" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
    <path d="M42 40 L42 50" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="30" y="32" width="10" height="10" fill="#fca5a5" />

    <!-- Head -->
    <circle cx="35" cy="22" r="14" fill="#fca5a5" />

    <!-- Hair (Stylized modern neat hair) -->
    <path d="M21 20 C21 12, 27 9, 36 9 C45 9, 49 14, 49 22 C49 22, 49 25, 47 24 C43 14, 27 15, 21 20 Z" fill="#334155" />
    <path d="M21 20 L24 26 L27 21" fill="#334155" />

    <!-- Happy Confident Facial Expression -->
    <!-- Smiling Eyes -->
    <path d="M28 20 C29 22, 31 22, 32 20" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M38 20 C39 22, 41 22, 42 20" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Big joyful smile -->
    <path d="M31 26 C33 29, 37 29, 39 26" fill="#1e293b" />
    <path d="M33 26 C35 28, 35 28, 37 26" fill="#f43f5e" /> <!-- Tongue -->

    <!-- Cheeks (Blush) -->
    <circle cx="27" cy="25" r="3" fill="#f43f5e" opacity="0.3" />
    <circle cx="43" cy="25" r="3" fill="#f43f5e" opacity="0.3" />

    <!-- Raised Arms celebrating high score -->
    <!-- Left Arm -->
    <path d="M12 45 C5 40, -5 25, -2 15 C1 8, 8 12, 10 18 C12 25, 18 38, 22 42" fill="#38bdf8" />
    <!-- Left Hand -->
    <circle cx="-3" cy="13" r="4" fill="#fca5a5" />

    <!-- Right Arm (holding fist up in triumph) -->
    <path d="M56 45 C65 42, 75 30, 72 20 C69 13, 62 16, 60 22 C58 28, 54 38, 50 42" fill="#38bdf8" />
    <!-- Right Hand (Fist) -->
    <circle cx="73" cy="17" r="4.5" fill="#fca5a5" />
  </g>

  <!-- Desk Front Edge Lighting / Depth -->
  <rect x="0" y="234" width="240" height="6" fill="#0f172a" />
</svg>