<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container & Room Interior Base -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Warm Ambient Light Cone -->
  <circle cx="120" cy="80" r="110" fill="url(#lampGlow)"/>

  <!-- Wallpaper Stripe Details (Context) -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="60" y1="0" x2="60" y2="170"/>
    <line x1="120" y1="0" x2="120" y2="170"/>
    <line x1="180" y1="0" x2="180" y2="170"/>
  </g>

  <!-- Window with Night City Silhouette -->
  <g transform="translate(15, 25)">
    <rect width="45" height="75" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <!-- Window pane grid -->
    <line x1="22.5" y1="0" x2="22.5" y2="75" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="37.5" x2="45" y2="37.5" stroke="#475569" stroke-width="1.5"/>
    <!-- City lights outside -->
    <circle cx="10" cy="20" r="1.5" fill="#fde047" opacity="0.8"/>
    <circle cx="32" cy="15" r="1" fill="#38bdf8" opacity="0.8"/>
    <circle cx="15" cy="55" r="1.5" fill="#f87171" opacity="0.8"/>
    <circle cx="35" cy="50" r="1.5" fill="#34d399" opacity="0.8"/>
    <!-- Curtains -->
    <path d="M 0 0 Q 10 30 2 75 L 0 75 Z" fill="#3b82f6" opacity="0.4"/>
    <path d="M 45 0 Q 35 30 43 75 L 45 75 Z" fill="#3b82f6" opacity="0.4"/>
  </g>

  <!-- Wall Shelf with Plant and Books -->
  <g transform="translate(155, 30)">
    <rect width="70" height="4" rx="2" fill="#64748b"/>
    <!-- Potted Plant -->
    <path d="M 15 0 L 20 -12 L 28 -12 L 33 0 Z" fill="#10b981"/>
    <path d="M 24 -12 Q 24 -25 15 -30" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 -12 Q 28 -28 35 -32" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 -12 Q 20 -20 24 -26" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <!-- Book Stack -->
    <rect x="42" y="-12" width="18" height="12" rx="1" fill="#ec4899"/>
    <rect x="40" y="-22" width="22" height="10" rx="1" fill="#38bdf8"/>
  </g>

  <!-- Floor Line -->
  <rect x="0" y="170" width="240" height="70" fill="url(#floorGrad)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- Cozy Floor Rug -->
  <ellipse cx="120" cy="195" rx="75" ry="18" fill="#334155" opacity="0.6"/>
  <ellipse cx="120" cy="195" rx="65" ry="14" fill="#475569" opacity="0.8"/>

  <!-- Floor Lamp (Left Background) -->
  <g transform="translate(45, 70)">
    <line x1="0" y1="0" x2="0" y2="100" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M -15 0 Q 0 -15 15 0 Z" fill="#f59e0b"/>
    <!-- Lamp base -->
    <ellipse cx="0" cy="100" rx="12" ry="4" fill="#64748b"/>
  </g>

  <!-- MAIN FURNITURE: Comfortable Armchair -->
  <g id="armchair">
    <!-- Shadow -->
    <ellipse cx="130" cy="192" rx="42" ry="10" fill="#020617" opacity="0.5"/>
    
    <!-- Armchair Backrest & Cushion -->
    <path d="M 95 95 C 90 95 85 105 85 125 L 85 165 C 85 180 100 185 130 185 C 160 185 175 180 175 165 L 175 125 C 175 105 170 95 165 95 Z" fill="#6366f1"/>
    <!-- Inner Fluffy Cushion Texture -->
    <path d="M 98 105 C 95 105 92 112 92 128 L 92 160 C 92 170 105 175 130 175 C 155 175 168 170 168 160 L 168 128 C 168 112 165 105 162 105 Z" fill="#818cf8"/>
    
    <!-- Armchair Seat -->
    <path d="M 80 150 C 75 150 72 155 72 165 C 72 178 85 188 130 188 C 175 188 188 178 188 165 C 188 155 185 150 180 150 Z" fill="#4f46e5"/>
    
    <!-- Wooden Legs -->
    <rect x="90" y="185" width="6" height="15" rx="3" fill="#b45309"/>
    <rect x="164" y="185" width="6" height="15" rx="3" fill="#b45309"/>
  </g>

  <!-- Side Table with Warm Mug -->
  <g transform="translate(175, 140)">
    <ellipse cx="15" cy="15" rx="18" ry="8" fill="#334155"/>
    <rect x="12" y="15" width="6" height="30" fill="#475569"/>
    <ellipse cx="15" cy="45" rx="12" ry="5" fill="#1e293b"/>
    <!-- Mug -->
    <rect x="10" y="3" width="10" height="12" rx="2" fill="#fb923c"/>
    <path d="M 20 6 Q 24 6 24 9 Q 24 12 20 12" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 13 0 Q 15 -4 13 -8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- MAIN CHARACTER: Relaxed Person sitting in the armchair -->
  <g id="character">
    <!-- Legs in cozy pants, stretched comfortably -->
    <path d="M 115 170 L 155 178 L 175 172" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slippers -->
    <path d="M 170 166 C 170 166 182 168 185 172 C 188 176 180 180 170 178 Z" fill="#f43f5e"/>

    <!-- Body / Torso leaning back -->
    <path d="M 105 110 C 105 110 115 145 130 150 C 145 145 155 110 155 110 Z" fill="#38bdf8"/>

    <!-- Relaxed Arms -->
    <!-- Left Arm resting -->
    <path d="M 108 115 Q 90 130 100 145" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Right Arm holding a book -->
    <path d="M 152 115 Q 165 130 155 145" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>

    <!-- Open Book in lap -->
    <g transform="translate(122, 132) rotate(-10)">
      <polygon points="0,10 15,0 30,10 15,20" fill="#f8fafc"/>
      <polygon points="15,0 30,10 30,22 15,14" fill="#e2e8f0"/>
      <line x1="15" y1="2" x2="15" y2="13" stroke="#94a3b8" stroke-width="1"/>
      <!-- Tiny text lines -->
      <line x1="4" y1="5" x2="11" y2="4" stroke="#64748b" stroke-width="1"/>
      <line x1="4" y1="8" x2="10" y2="7" stroke="#64748b" stroke-width="1"/>
      <line x1="19" y1="5" x2="26" y2="6" stroke="#64748b" stroke-width="1"/>
      <line x1="19" y1="9" x2="25" y2="10" stroke="#64748b" stroke-width="1"/>
    </g>

    <!-- Head & Face (Content / Relaxed Expression) -->
    <!-- Neck -->
    <rect x="124" y="95" width="12" height="18" rx="4" fill="#fbcfe8"/>

    <!-- Head tilted slightly back -->
    <circle cx="130" cy="85" r="18" fill="#fbcfe8"/>

    <!-- Cozy Hair Style -->
    <path d="M 112 85 C 112 70 120 66 130 66 C 142 66 148 72 148 85 C 148 88 147 90 147 90 C 147 90 135 80 125 88 C 118 94 112 88 112 85 Z" fill="#b45309"/>

    <!-- Peaceful Closed Eyes (Happy arcs) -->
    <path d="M 122 83 Q 125 87 128 83" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <path d="M 132 83 Q 135 87 138 83" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- Gentle Smile -->
    <path d="M 128 92 Q 130 95 132 92" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="120" cy="89" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="140" cy="89" r="3" fill="#fda4af" opacity="0.6"/>
  </g>

  <!-- Floating Cozy/Sparkle Elements (Expressing Comfort) -->
  <g fill="#fbbf24" opacity="0.8">
    <!-- Star sparkles -->
    <path d="M 75 75 Q 75 70 70 70 Q 75 70 75 65 Q 75 70 80 70 Q 75 70 75 75 Z"/>
    <path d="M 160 55 Q 160 52 157 52 Q 160 52 160 49 Q 160 52 163 52 Q 160 52 160 55 Z" transform="scale(0.8) translate(40, 10)"/>
    <path d="M 95 135 Q 95 133 93 133 Q 95 133 95 131 Q 95 133 97 133 Q 95 133 95 135 Z"/>
  </g>
</svg>