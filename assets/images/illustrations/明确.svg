<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Lens Glow Gradient -->
    <linearGradient id="lens-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Beam Gradient -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Magnifier Glass Rim Gradient -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Document Paper Gradient -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#grid)" />

  <!-- Ambient Light Effects -->
  <circle cx="120" cy="120" r="90" fill="#1e293b" opacity="0.6"/>
  
  <!-- Light Beam from Magnifier -->
  <polygon points="105,105 50,210 160,210" fill="url(#light-beam)" />

  <!-- Background Environment: Architectural Blueprint & Desk Props -->
  <!-- Blueprint Sheet -->
  <g transform="rotate(-10 120 120)">
    <rect x="50" y="40" width="120" height="150" rx="4" fill="url(#paper-grad)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Abstract Sharp Lines & Schematic Elements (representing complex/unclear information) -->
    <path d="M 65 65 L 115 65" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 65 85 L 145 85" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M 65 105 L 130 105" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M 65 125 L 100 125" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Messy Scribbles / Fuzzy Unclear Elements -->
    <path d="M 65 150 Q 80 140, 95 155 T 125 145 T 155 155" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="135" cy="125" r="8" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Focused / Clear Section on Blueprint (Under Magnifier) -->
  <g transform="translate(20, 10)">
    <rect x="85" y="75" width="60" height="50" rx="2" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Crisp, Clear Detailed Graphic Elements (Precise Checkmark & Blueprint schematic) -->
    <path d="M 95 95 L 110 110 L 135 85" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="110" cy="98" r="3" fill="#38bdf8"/>
    <line x1="95" y1="115" x2="125" y2="115" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating Sparkles / Clarity Effect -->
  <g fill="#fbbf24">
    <path d="M 180 50 L 183 58 L 191 61 L 183 64 L 180 72 L 177 64 L 169 61 L 177 58 Z" />
    <path d="M 50 80 L 52 85 L 57 87 L 52 89 L 50 94 L 48 89 L 43 87 L 48 85 Z" transform="scale(0.8) translate(10, 10)" />
  </g>

  <!-- Main Subject: The Dynamic Magnifying Glass (Clarity/Precision) -->
  <g transform="rotate(15 120 120)">
    <!-- Glass Lens Area -->
    <circle cx="110" cy="110" r="45" fill="url(#lens-glow)" stroke="url(#rim-grad)" stroke-width="8" />
    
    <!-- Lens Glass Reflection Highlight -->
    <path d="M 85 85 A 35 35 0 0 1 135 85" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Handle of Magnifying Glass -->
    <g>
      <!-- Metallic connector/collar -->
      <path d="M 141 141 L 152 152" stroke="#b45309" stroke-width="10" stroke-linecap="round" />
      <!-- Ergonomic Grip -->
      <path d="M 147 147 L 185 185" fill="none" stroke="url(#rim-grad)" stroke-width="14" stroke-linecap="round" />
      <path d="M 153 153 L 181 181" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="70" cy="180" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="190" cy="90" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="165" cy="45" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="45" cy="120" r="2.5" fill="#10b981" opacity="0.7"/>

</svg>