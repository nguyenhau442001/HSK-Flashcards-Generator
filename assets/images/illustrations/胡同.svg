<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Left Wall -->
  <path d="M0 0 L80 60 L80 240 L0 240 Z" fill="#475569"/>
  <rect x="10" y="80" width="40" height="60" rx="4" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
  
  <!-- Right Wall -->
  <path d="M240 0 L160 60 L160 240 L240 240 Z" fill="#475569"/>
  <rect x="190" y="100" width="40" height="80" rx="4" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
  
  <!-- Perspective Depth (The Alley) -->
  <path d="M80 60 L160 60 L160 240 L80 240 Z" fill="#0f172a"/>
  
  <!-- Lanterns -->
  <circle cx="90" cy="70" r="8" fill="#f59e0b"/>
  <rect x="88" y="78" width="4" height="10" fill="#fbbf24"/>
  <circle cx="150" cy="90" r="8" fill="#f59e0b"/>
  <rect x="148" y="98" width="4" height="10" fill="#fbbf24"/>
  
  <!-- Bicycle -->
  <g transform="translate(100, 190) scale(0.6)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="70" cy="20" r="15" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <path d="M20 20 L45 20 L55 5 L70 20 M45 20 L55 35 L70 20" stroke="#38bdf8" stroke-width="4" fill="none"/>
  </g>
  
  <!-- Decorative elements -->
  <path d="M10 190 L30 180 L50 190" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M200 200 L220 190 L240 200" stroke="#ec4899" stroke-width="2" fill="none"/>
</svg>