<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Credit Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- POS Terminal Body Gradient -->
    <linearGradient id="posGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow & Contactless Waves -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Background Lighting / Surface plane -->
  <ellipse cx="120" cy="195" rx="90" ry="25" fill="#020617" opacity="0.6"/>
  
  <!-- Wooden Counter / Surface Line -->
  <path d="M 0 185 L 240 185" stroke="#334155" stroke-width="2" opacity="0.4"/>

  <!-- Back-Layer Props: Coffee Cup -->
  <g transform="translate(30, 130)">
    <!-- Steam -->
    <path d="M12 10 Q16 2 12 -6 Q8 -14 12 -22" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M22 14 Q26 8 22 0 Q18 -8 22 -16" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <!-- Cup Body -->
    <path d="M 5 15 L 10 45 C 10 48, 14 50, 18 50 L 32 50 C 36 50, 40 48, 40 45 L 45 15 Z" fill="#f8fafc"/>
    <path d="M 43 20 C 52 20, 52 38, 43 40" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <!-- Cup Rim -->
    <ellipse cx="25" cy="15" rx="20" ry="5" fill="#e2e8f0"/>
    <ellipse cx="25" cy="16" rx="17" ry="3" fill="#78350f"/>
  </g>

  <!-- POS Terminal (Context Environment) -->
  <g transform="translate(130, 85)">
    <!-- Terminal Shadow -->
    <ellipse cx="35" cy="105" rx="35" ry="10" fill="#000000" opacity="0.4"/>
    
    <!-- Base / Stand -->
    <path d="M 20 85 L 50 85 L 55 100 L 15 100 Z" fill="#0f172a"/>
    
    <!-- Main Body -->
    <rect x="5" y="10" width="60" height="80" rx="8" fill="url(#posGrad)" stroke="#475569" stroke-width="2"/>
    
    <!-- Screen -->
    <rect x="11" y="16" width="48" height="28" rx="4" fill="#0f172a"/>
    <!-- Success Green Screen Glow -->
    <rect x="13" y="18" width="44" height="24" rx="2" fill="#065f46" filter="url(#glow)"/>
    <!-- UI elements on screen (abstract lines/checkmark) -->
    <circle cx="35" cy="27" r="6" fill="#34d399"/>
    <path d="M 32 27 L 34 29 L 39 23" fill="none" stroke="#065f46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="38" width="30" height="2" rx="1" fill="#6ee7b7" opacity="0.8"/>

    <!-- Keypad Area -->
    <rect x="11" y="48" width="48" height="36" rx="4" fill="#1e293b"/>
    <!-- Keypad Dots -->
    <circle cx="20" cy="56" r="3" fill="#64748b"/>
    <circle cx="35" cy="56" r="3" fill="#64748b"/>
    <circle cx="50" cy="56" r="3" fill="#64748b"/>
    
    <circle cx="20" cy="66" r="3" fill="#64748b"/>
    <circle cx="35" cy="66" r="3" fill="#64748b"/>
    <circle cx="50" cy="66" r="3" fill="#64748b"/>
    
    <circle cx="20" cy="76" r="3" fill="#64748b"/>
    <circle cx="35" cy="76" r="3" fill="#38bdf8"/>
    <circle cx="50" cy="76" r="3" fill="#10b981"/>

    <!-- Contactless symbol at top of terminal -->
    <path d="M 30 8 A 6 6 0 0 1 40 8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 28 6 A 9 9 0 0 1 42 6" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- MAIN SUBJECT: The Credit Card (Thẻ Tín Dụng) -->
  <g transform="translate(45, 70)">
    <!-- Card Drop Shadow -->
    <rect x="4" y="8" width="120" height="76" rx="10" fill="#000000" opacity="0.5"/>
    
    <!-- Card Body with Gradient & Rotation for Action/Motion -->
    <g transform="rotate(-12, 64, 42)">
      <!-- Main Card Surface -->
      <rect x="0" y="0" width="128" height="82" rx="12" fill="url(#cardGrad)" stroke="#7dd3fc" stroke-width="1.5"/>
      
      <!-- Decorative Wave/Sheen on Card -->
      <path d="M 0 0 L 80 0 L 0 82 Z" fill="#ffffff" opacity="0.08"/>
      <circle cx="110" cy="20" r="35" fill="#38bdf8" opacity="0.2" filter="url(#glow)"/>

      <!-- EMV Chip (Gold) -->
      <rect x="18" y="32" width="20" height="15" rx="3" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.75"/>
      <!-- Chip Inner Grid lines -->
      <line x1="28" y1="32" x2="28" y2="47" stroke="#b45309" stroke-width="0.75"/>
      <line x1="18" y1="39" x2="38" y2="39" stroke="#b45309" stroke-width="0.75"/>
      <line x1="22" y1="35" x2="25" y2="35" stroke="#b45309" stroke-width="0.5"/>
      <line x1="31" y1="44" x2="34" y2="44" stroke="#b45309" stroke-width="0.5"/>

      <!-- Contactless Wave Icon on Card -->
      <path d="M 108 34 A 8 8 0 0 1 108 48" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <path d="M 111 31 A 12 12 0 0 1 111 51" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

      <!-- Embossed Card Number Lines (Abstracted representation, no text) -->
      <rect x="18" y="55" width="22" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
      <rect x="44" y="55" width="22" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
      <rect x="70" y="55" width="22" height="4" rx="2" fill="#ffffff" opacity="0.6"/>

      <!-- Card Brand Interlocking Circles Logo (Stylized) -->
      <circle cx="100" cy="65" r="9" fill="#ef4444" opacity="0.85"/>
      <circle cx="112" cy="65" r="9" fill="#f59e0b" opacity="0.85"/>
      
      <!-- Hologram / Security Seal -->
      <circle cx="105" cy="39" r="6" fill="url(#goldGrad)" opacity="0.8"/>
    </g>
  </g>

  <!-- Foreground Action Sparkles / Success Highlights -->
  <g transform="translate(110, 60)" filter="url(#glow)">
    <!-- Gold Star Sparkle -->
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(45, 120)" filter="url(#glow)">
    <!-- Cyan Sparkle -->
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(160, 45)">
    <!-- Tiny Accent Sparkle -->
    <path d="M 0 -4 Q 0 0 4 0 Q 0 0 0 4 Q 0 0 -4 0 Q 0 0 0 -4 Z" fill="#f472b6"/>
  </g>
</svg>