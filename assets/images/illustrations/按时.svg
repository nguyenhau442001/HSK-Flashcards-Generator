<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <radialGradient id="bg-gradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <radialGradient id="clock-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="door-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="pants-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background / Environment -->
  <rect width="240" height="240" rx="24" fill="url(#bg-gradient)" />
  
  <!-- Office Interior Details -->
  <!-- Floor -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16" />
  <path d="M0 190 L240 190" stroke="#1e293b" stroke-width="2" />
  
  <!-- Doorframe / Office Entrance Backdrop -->
  <rect x="130" y="40" width="80" height="150" fill="url(#door-grad)" rx="4" />
  <rect x="136" y="46" width="68" height="138" fill="#0f172a" rx="2" />
  <!-- Warm welcoming light spilling from the office -->
  <path d="M140 50 L180 50 L195 184 L145 184 Z" fill="#fbbf24" opacity="0.08" />
  <circle cx="185" cy="120" r="3" fill="#fbbf24" opacity="0.6" />

  <!-- Giant Wall Clock (Emphasizing "On Time") -->
  <g transform="translate(70, 35)">
    <!-- Glow behind clock -->
    <circle cx="0" cy="0" r="36" fill="url(#clock-glow)" />
    <!-- Clock Body -->
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#334155" stroke-width="3" filter="url(#soft-shadow)" />
    <!-- Clock face inner -->
    <circle cx="0" cy="0" r="24" fill="#0f172a" />
    <!-- Hour/Minute markers -->
    <line x1="0" y1="-21" x2="0" y2="-17" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="21" y1="0" x2="17" y2="0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="21" x2="0" y2="17" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="-21" y1="0" x2="-17" y2="0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Perfect On-Time Hands (Pointing precisely upright/right, e.g., exactly 9:00 or 12:00) -->
    <line x1="0" y1="0" x2="0" y2="-13" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="11" y2="-5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#fbbf24" />
    <!-- Success Green Sparkle near clock -->
    <path d="M 32 -18 Q 35 -24 41 -24 Q 35 -24 35 -30 Q 35 -24 29 -24 Q 35 -24 32 -18 Z" fill="#10b981" filter="url(#glow)" />
  </g>

  <!-- Potted Plant Decor -->
  <g transform="translate(25, 140)">
    <path d="M0 30 L16 30 L12 55 L4 55 Z" fill="#64748b" />
    <path d="M-2 30 L18 30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Leaves -->
    <path d="M8 30 C 8 10, -5 0, -10 -5 C -5 5, 2 20, 8 30 Z" fill="#10b981" />
    <path d="M8 30 C 15 5, 30 0, 35 -5 C 25 5, 15 20, 8 30 Z" fill="#059669" />
    <path d="M8 30 C 5 10, 15 -10, 12 -18 C 10 -5, 8 15, 8 30 Z" fill="#34d399" />
  </g>

  <!-- Dynamic Character: Confident, energetic professional arriving precisely on time -->
  <g id="character" transform="translate(0, 5)" filter="url(#soft-shadow)">
    
    <!-- Motion / Speed Lines (Arriving briskly, right on schedule) -->
    <g opacity="0.4">
      <line x1="30" y1="120" x2="50" y2="120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="20" y1="140" x2="42" y2="140" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <line x1="35" y1="160" x2="48" y2="160" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Briefcase (Swinging in hand, showing readiness) -->
    <g transform="translate(65, 145) rotate(-15)">
      <rect x="0" y="0" width="22" height="15" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1.5" />
      <path d="M 6 0 C 6 -4, 16 -4, 16 0" fill="none" stroke="#78350f" stroke-width="2" />
      <rect x="9" y="5" width="4" height="4" rx="1" fill="#fbbf24" />
    </g>

    <!-- Back Leg (Stepping forward) -->
    <g>
      <path d="M 95 140 L 80 180 L 95 185 L 105 145 Z" fill="url(#pants-grad)" />
      <!-- Shoe -->
      <path d="M 77 181 C 75 181, 70 185, 68 189 L 95 190 L 97 181 Z" fill="#0f172a" />
    </g>

    <!-- Torso & Coat -->
    <g>
      <!-- Jacket / Trench coat flying slightly with movement -->
      <path d="M 85 90 L 125 90 L 130 150 L 100 155 L 85 130 Z" fill="url(#coat-grad)" />
      <!-- Inner Shirt & Tie -->
      <path d="M 95 90 L 115 90 L 110 135 L 98 135 Z" fill="#f8fafc" />
      <polygon points="104,95 108,95 106,120" fill="#ef4444" />
      
      <!-- Coat Lapels -->
      <path d="M 95 90 L 102 120 L 90 145" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 115 90 L 108 120 L 120 145" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Front Leg (Planted firmly and accurately) -->
    <g>
      <path d="M 110 135 L 122 175 L 138 178 L 125 135 Z" fill="url(#pants-grad)" />
      <!-- Dynamic Shoe -->
      <path d="M 118 175 C 118 175, 125 186, 136 186 L 142 177 Z" fill="#0f172a" />
    </g>

    <!-- Back Arm (Holding briefcase) -->
    <path d="M 90 95 C 80 110, 70 125, 72 138" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="72" cy="140" r="5" fill="#fcd34d" />

    <!-- Front Arm (Pointing or gesturing happily at the clock) -->
    <g>
      <!-- Shoulder to elbow -->
      <path d="M 120 95 C 130 105, 138 115, 130 125" fill="none" stroke="url(#coat-grad)" stroke-width="10" stroke-linecap="round" />
      <!-- Forearm gesturing upward toward the time -->
      <path d="M 130 125 L 145 105" fill="none" stroke="url(#coat-grad)" stroke-width="9" stroke-linecap="round" />
      <!-- Hand -->
      <circle cx="147" cy="101" r="5" fill="#fcd34d" />
    </g>

    <!-- Head & Face -->
    <g transform="translate(100, 72)">
      <!-- Hair -->
      <path d="M -14 -10 C -15 -22, 0 -26, 12 -20 C 18 -17, 20 -10, 18 -5 C 15 -2, 12 -5, 10 -10 C 5 -15, -5 -15, -10 -5 Z" fill="#0f172a" />
      
      <!-- Head Base -->
      <circle cx="0" cy="0" r="15" fill="#fcd34d" />
      
      <!-- Cheeks / Happy Expression -->
      <circle cx="7" cy="4" r="3" fill="#f43f5e" opacity="0.4" />

      <!-- Confident / Joyful Smiling Eyes (Arrived on time!) -->
      <path d="M 4 -3 Q 7 -6 10 -3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M 10 -3 Q 13 -6 16 -3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

      <!-- Big Confident Smile -->
      <path d="M 5 6 Q 10 11 15 6" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      
      <!-- Smart Glasses -->
      <rect x="2" y="-6" width="7" height="6" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5" />
      <rect x="9" y="-6" width="7" height="6" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5" />
      <line x1="9" y1="-3" x2="9" y2="-3" stroke="#0f172a" stroke-width="1.5" />
    </g>

  </g>

  <!-- Accent Sparkles / Punctuality celebration effect -->
  <g transform="translate(160, 75)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#fbbf24" filter="url(#glow)" />
  </g>
  <g transform="translate(50, 95) scale(0.6)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#38bdf8" filter="url(#glow)" />
  </g>

</svg>