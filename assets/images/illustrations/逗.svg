<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#fca311"/>
    </linearGradient>

    <!-- Hoodie Gradient -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Dramatic Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Stage Light -->
    <radialGradient id="stageLight" cx="70%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Puppet / Stick Props Gradients -->
    <linearGradient id="puppetWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting Effects -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" pointer-events="none"/>
  <rect width="240" height="240" rx="24" fill="url(#stageLight)" pointer-events="none"/>

  <!-- Background Stage Elements / Ambient Details -->
  <g opacity="0.3">
    <!-- Spotlight Cones -->
    <polygon points="120,0 20,240 60,240" fill="#38bdf8" opacity="0.1"/>
    <polygon points="120,0 180,240 220,240" fill="#fbbf24" opacity="0.1"/>
    <!-- Floating Joy Confetti / Magic Sparkles -->
    <circle cx="45" cy="70" r="3" fill="#f43f5e"/>
    <path d="M190,90 L194,98 L202,102 L194,106 L190,114 L186,106 L178,102 L186,98 Z" fill="#fbbf24" transform="scale(0.6) translate(100,20)"/>
    <circle cx="205" cy="160" r="4" fill="#38bdf8"/>
    <circle cx="30" cy="180" r="2.5" fill="#10b981"/>
    <path d="M30,30 L33,36 L39,39 L33,42 L30,48 L27,42 L21,39 L27,36 Z" fill="#ec4899" transform="scale(0.5) translate(10,40)"/>
  </g>

  <!-- MAIN CHARACTER GROUP (Expressing '逗' - comical, funny, teasing performance) -->
  <g filter="url(#dropShadow)">

    <!-- Character Body / Torso (Hoodie) -->
    <path d="M 80,180 C 80,150 95,135 120,135 C 145,135 160,150 160,180 L 175,220 C 177,226 172,232 166,232 L 74,232 C 68,232 63,226 65,220 Z" fill="url(#hoodieGrad)"/>
    
    <!-- Hoodie Pocket & Details -->
    <path d="M 95,200 L 145,200 L 140,224 L 100,224 Z" fill="#0284c7" opacity="0.6"/>
    <path d="M 105,135 Q 120,150 135,135" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Arm (Dynamic pose holding comical prop) -->
    <g transform="translate(45, 140) rotate(-25)">
      <rect x="0" y="0" width="22" height="60" rx="11" fill="url(#hoodieGrad)"/>
      <!-- Hand -->
      <circle cx="11" cy="65" r="9" fill="url(#skinGrad)"/>
    </g>

    <!-- Right Arm (Raised in playful gesture) -->
    <g transform="translate(175, 145) rotate(35)">
      <rect x="-10" y="0" width="22" height="60" rx="11" fill="url(#hoodieGrad)"/>
      <!-- Hand -->
      <circle cx="1" cy="65" r="9" fill="url(#skinGrad)"/>
    </g>

    <!-- Neck -->
    <rect x="106" y="115" width="28" height="30" rx="8" fill="url(#skinGrad)"/>

    <!-- Character Head / Face -->
    <g transform="translate(120, 95)">
      <!-- Head Base (Expressive chubby, lively face) -->
      <rect x="-42" y="-45" width="84" height="88" rx="36" fill="url(#skinGrad)"/>

      <!-- Playful Hair Tuft / Spiky Top -->
      <path d="M -15,-42 C -10,-60 5,-55 12,-58 C 25,-64 22,-40 22,-40 Z" fill="#0f172a"/>
      <path d="M -25,-38 C -30,-48 -18,-45 -15,-42 Z" fill="#0f172a"/>

      <!-- Rosy Cheeks (Enhancing the cute/funny vibe) -->
      <ellipse cx="-28" cy="5" rx="8" ry="5" fill="#f43f5e" opacity="0.4"/>
      <ellipse cx="28" cy="5" rx="8" ry="5" fill="#f43f5e" opacity="0.4"/>

      <!-- Expressive Eyes (Winking / Mischievous Comedy) -->
      <!-- Left Eye (Wink arc) -->
      <path d="M -24, -5 Q -18, -12 -12, -5" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
      <!-- Right Eye (Sparkling wide open) -->
      <circle cx="18" cy="-6" r="6" fill="#0f172a"/>
      <circle cx="20" cy="-8" r="2" fill="#ffffff"/> <!-- Catchlight -->
      
      <!-- Eyebrows (Dynamic, one raised) -->
      <path d="M -26, -17 Q -18, -23 -10, -16" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 10, -22 Q 18, -28 26, -18" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Big Comical Open Laughing Mouth -->
      <path d="M -16, 10 Q 0, 32 16, 10 Z" fill="#be123c"/>
      <path d="M -16, 10 Q 0, 32 16, 10" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Tongue -->
      <path d="M -8, 20 Q 0, 28 8, 20 Z" fill="#fb7185"/>

      <!-- Cute Comical Sweat Drop (Classic manga/illustration trope for humorous situations) -->
      <path d="M 38,-20 C 38,-20 46,-8 46,-2 C 46,3 42,6 38,6 C 34,6 30,3 30,-2 C 30,-8 38,-20 38,-20 Z" fill="#38bdf8" opacity="0.85"/>

    </g>
  </g>

  <!-- COMICAL PROP: Silly Hand-Puppet being presented to evoke "逗" (chọc cười / funny) -->
  <g transform="translate(65, 160) rotate(-15)" filter="url(#dropShadow)">
    <!-- Stick -->
    <rect x="-4" y="0" width="8" height="40" rx="4" fill="url(#puppetWood)"/>
    <!-- Puppet Head (Silly Cartoon Star/Monster with big goofy face) -->
    <g transform="translate(0, -15)">
      <!-- Star Shape or Funny Creature Head -->
      <circle cx="0" cy="0" r="20" fill="#facc15"/>
      <path d="M -15,-15 L -25,-25 M 15,-15 L 25,-25 M -15,15 L -22,25 M 15,15 L 22,25" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
      <!-- Googly Eyes -->
      <circle cx="-6" cy="-4" r="5" fill="#ffffff"/>
      <circle cx="-6" cy="-4" r="2" fill="#000000"/>
      <circle cx="6" cy="-4" r="5" fill="#ffffff"/>
      <circle cx="8" cy="-4" r="2" fill="#000000"/>
      <!-- Silly Wavy Mouth -->
      <path d="M -8, 6 Q 0, 14 8, 6" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Additional Comical Interaction Elements (Floating Musical / Laugh Notes) -->
  <g transform="translate(160, 80) rotate(15)">
    <!-- Haha Note 1 -->
    <path d="M0,15 C0,8 6,2 12,2 C15,2 18,4 19,7 L19,25 C18,27 15,29 12,29 C6,29 0,24 0,15 Z" fill="none"/>
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#fbbf24" opacity="0.9">Ha!</text>
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="110" cy="225" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="135" cy="230" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="25" cy="120" r="2" fill="#ffffff" opacity="0.4"/>

</svg>