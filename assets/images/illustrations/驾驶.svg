<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100% " stop-color="#0f172a" />
    </linearGradient>

    <!-- Dashboard Glow & Lighting -->
    <radialGradient id="dashGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Steering Wheel Metallic Gradient -->
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Action Speed Lines / Neon Streaks -->
    <linearGradient id="speedStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9" />
    </linearGradient>

    <!-- Clip Path for Windshield View -->
    <clipPath id="windshieldClip">
      <path d="M 45,75 Q 120,40 195,75 L 210,135 Q 120,135 30,135 Z" />
    </clipPath>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#dashGlow)" />

  <!-- ATMOSPHERIC DEPTH: OUTSIDE WORLD THROUGH WINDSHIELD -->
  <g clip-path="url(#windshieldClip)">
    <!-- Moving Night Sky / City Backdrop -->
    <rect x="0" y="0" width="240" height="140" fill="#090d16" />
    
    <!-- Distant City Skyline / Neon glow -->
    <path d="M 0,110 L 15,95 L 25,95 L 40,110 L 60,85 L 80,110 L 110,75 L 140,110 L 160,90 L 180,110 L 210,80 L 240,110 L 240,140 L 0,140 Z" fill="#1e293b" opacity="0.7" />
    <polygon points="110,75 115,75 115,110 110,110" fill="#f59e0b" opacity="0.4" />
    <polygon points="60,85 65,85 65,110 60,110" fill="#38bdf8" opacity="0.4" />

    <!-- Motion Speed Streaks (Action element for 'driving') -->
    <path d="M -10,80 Q 60,85 120,95 T 250,110" stroke="url(#speedStreak)" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 20,65 Q 90,75 160,88 T 260,95" stroke="url(#speedStreak)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M -20,100 Q 70,105 140,110 T 250,125" stroke="url(#speedStreak)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5" />
    
    <!-- Passing Streetlights / Glow Orbs -->
    <circle cx="190" cy="85" r="4" fill="#fbbf24" opacity="0.8" />
    <path d="M 190,85 L 230,130" stroke="#fbbf24" stroke-width="1" opacity="0.2" />
  </g>

  <!-- WINDSHIELD FRAME & REFLECTIONS -->
  <path d="M 45,75 Q 120,40 195,75 L 210,135 Q 120,135 30,135 Z" fill="url(#windshieldGrad)" stroke="#334155" stroke-width="4" stroke-linejoin="round" />
  <!-- Windshield curved light sheen -->
  <path d="M 52,78 Q 120,46 185,78" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.25" />

  <!-- CAR INTERIOR: DASHBOARD & CONSOLE -->
  <path d="M 0,140 Q 60,125 120,125 Q 180,125 240,140 L 240,240 L 0,240 Z" fill="#0f172a" />
  <path d="M 0,140 Q 60,125 120,125 Q 180,125 240,140 L 240,155 Q 120,145 0,155 Z" fill="#334155" />

  <!-- Dashboard Instrument Cluster (Glowing futuristic dials) -->
  <g transform="translate(120, 137)">
    <!-- Speedometer Pod -->
    <rect x="-35" y="-10" width="70" height="20" rx="6" fill="#090d16" stroke="#475569" stroke-width="1.5" />
    <!-- Glowing digital readouts / gauges -->
    <circle cx="-20" cy="0" r="6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="25 10" />
    <circle cx="20" cy="0" r="6" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="30 5" />
    <line x1="-5" y1="-3" x2="5" y2="-3" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <line x1="-5" y1="2" x2="3" y2="2" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Central Air Vents / Console Detail -->
  <rect x="112" y="150" width="16" height="6" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <line x1="114" y1="153" x2="126" y2="153" stroke="#334155" stroke-width="1" />

  <!-- DRIVER'S HANDS & STEERING WHEEL (FOREGROUND ACTION FOCUS) -->
  <!-- Steering Wheel Column Base -->
  <path d="M 105,175 L 135,175 L 140,210 L 100,210 Z" fill="#1e293b" />

  <!-- Steering Wheel Assembly (Dynamic angled ring) -->
  <g transform="translate(120, 168)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="url(#wheelGrad)" stroke-width="12" />
    <!-- Inner grip highlight -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#64748b" stroke-width="2" opacity="0.4" />
    
    <!-- Wheel Spokes -->
    <path d="M -36,36 L -15,15" stroke="#334155" stroke-width="10" stroke-linecap="round" />
    <path d="M 36,36 L 15,15" stroke="#334155" stroke-width="10" stroke-linecap="round" />
    <path d="M 0,-52 L 0,-20" stroke="#334155" stroke-width="12" stroke-linecap="round" />

    <!-- Center Horn Pad (Modern sleek badge area) -->
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#475569" stroke-width="3" />
    <circle cx="0" cy="0" r="10" fill="#0f172a" />
    <!-- Dynamic Accent in Center -->
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
  </g>

  <!-- DRIVER'S HANDS (GRIPPING THE WHEEL FIRMLY) -->
  <!-- Left Hand -->
  <g transform="translate(62, 155) rotate(-35)">
    <!-- Arm/Sleeve -->
    <path d="M -20,40 L 10,25 L 15,50 L -15,65 Z" fill="#fb923c" />
    <!-- Palm & Fingers -->
    <rect x="-6" y="-5" width="22" height="26" rx="8" fill="#fbcfe8" />
    <!-- Thumb resting on wheel -->
    <ellipse cx="14" cy="8" rx="6" ry="4" fill="#fbcfe8" transform="rotate(-30 14 8)" />
  </g>

  <!-- Right Hand -->
  <g transform="translate(178, 155) rotate(35)">
    <!-- Arm/Sleeve -->
    <path d="M 20,40 L -10,25 L -15,50 L 15,65 Z" fill="#fb923c" />
    <!-- Palm & Fingers -->
    <rect x="-16" y="-5" width="22" height="26" rx="8" fill="#fbcfe8" />
    <!-- Thumb resting on wheel -->
    <ellipse cx="-14" cy="8" rx="6" ry="4" fill="#fbcfe8" transform="rotate(30 -14 8)" />
  </g>

  <!-- INTERIOR LIGHTING & VIBE ACCENTS -->
  <!-- Ambient glow from dashboard buttons (Green/Amber indicators) -->
  <circle cx="85" cy="153" r="2.5" fill="#10b981" />
  <circle cx="93" cy="153" r="2.5" fill="#38bdf8" />
  <circle cx="147" cy="153" r="2.5" fill="#f59e0b" />
  <circle cx="155" cy="153" r="2.5" fill="#ef4444" />

  <!-- Top-down cabin shadow gradient for depth -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" pointer-events="none" />
</svg>