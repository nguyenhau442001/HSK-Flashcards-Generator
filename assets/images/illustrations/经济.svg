<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Golden Glow for Growth Line -->
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Skyline Gradients -->
    <linearGradient id="building-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="building-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Globe Grid Gradient -->
    <radialGradient id="globe-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Coin Gradients -->
    <linearGradient id="coin-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="coin-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements / Cityscape -->
  <g opacity="0.6">
    <!-- Distant grid plane -->
    <path d="M0 180 L240 180" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M0 195 L240 195" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M0 210 L240 210" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Stylized background skyscrapers -->
    <rect x="20" y="110" width="30" height="70" fill="url(#building-grad-1)" rx="2"/>
    <rect x="55" y="90" width="25" height="90" fill="url(#building-grad-2)" rx="2"/>
    <rect x="85" y="130" width="20" height="50" fill="url(#building-grad-1)" rx="2"/>
    <rect x="180" y="100" width="35" height="80" fill="url(#building-grad-2)" rx="2"/>
    
    <!-- Windows dots in background buildings -->
    <fill color="#fbbf24" opacity="0.6">
      <rect x="26" y="120" width="4" height="6" fill="#38bdf8" opacity="0.4"/>
      <rect x="36" y="120" width="4" height="6" fill="#38bdf8" opacity="0.4"/>
      <rect x="26" y="135" width="4" height="6" fill="#38bdf8" opacity="0.4"/>
      <rect x="36" y="135" width="4" height="6" fill="#38bdf8" opacity="0.4"/>
      
      <rect x="62" y="100" width="4" height="6" fill="#10b981" opacity="0.5"/>
      <rect x="62" y="115" width="4" height="6" fill="#10b981" opacity="0.5"/>
      <rect x="62" y="130" width="4" height="6" fill="#10b981" opacity="0.5"/>
      
      <rect x="190" y="110" width="6" height="8" fill="#fbbf24" opacity="0.4"/>
      <rect x="200" y="110" width="6" height="8" fill="#fbbf24" opacity="0.4"/>
      <rect x="190" y="130" width="6" height="8" fill="#fbbf24" opacity="0.4"/>
      <rect x="200" y="130" width="6" height="8" fill="#fbbf24" opacity="0.4"/>
    </fill>
  </g>

  <!-- Central Globe / Economic Network Representation -->
  <g transform="translate(120, 130)" filter="url(#shadow)">
    <!-- Globe Glow Base -->
    <circle cx="0" cy="0" r="65" fill="url(#globe-glow)"/>
    
    <!-- Globe Body -->
    <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
    
    <!-- Latitude / Longitude lines (Stylized network) -->
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="20" ry="50" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

    <!-- Dynamic Growth Nodes on Globe -->
    <circle cx="-25" cy="-15" r="4" fill="#10b981"/>
    <circle cx="15" cy="-25" r="4" fill="#fbbf24"/>
    <circle cx="25" cy="20" r="4" fill="#ec4899"/>
    <circle cx="-15" cy="25" r="3" fill="#38bdf8"/>
    
    <!-- Connecting network arcs -->
    <path d="M-25 -15 Q 0 -35 15 -25" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2"/>
    <path d="M15 -25 Q 35 0 25 20" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2"/>
    <path d="M25 20 Q 0 35 -15 25" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Foreground Dynamic Growth Chart & Modern Architecture (The Core Metaphor) -->
  <g filter="url(#shadow)">
    <!-- Modern Main Building / Financial Tower in Foreground -->
    <path d="M 95 185 L 95 110 L 115 80 L 135 110 L 135 185 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Tower Glass Facade Lines -->
    <line x1="115" y1="80" x2="115" y2="185" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="102" y1="125" x2="128" y2="125" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="145" x2="130" y2="145" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    <line x1="97" y1="165" x2="133" y2="165" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>

    <!-- Rising Exponential Growth Curve / Arrow (Action-packed Economy) -->
    <!-- Glow behind curve -->
    <path d="M 40 170 Q 80 160, 115 115 T 200 45" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.3" stroke-linecap="round" filter="url(#glow-filter)"/>
    <!-- Main crisp growth line -->
    <path d="M 40 170 Q 80 160, 115 115 T 200 45" fill="none" stroke="url(#gold-glow)" stroke-width="5" stroke-linecap="round"/>

    <!-- Milestone Nodes along the Curve -->
    <!-- Node 1 -->
    <circle cx="70" cy="161" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <!-- Node 2 (Peak Tower intersection) -->
    <circle cx="115" cy="115" r="6" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <!-- Node 3 (Rocket-like upward finish) -->
    <circle cx="180" cy="65" r="7" fill="#fbbf24"/>
    <circle cx="180" cy="65" r="11" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>

    <!-- Arrowhead pointing up-right representing booming growth -->
    <g transform="translate(200, 45) rotate(35)">
      <polygon points="0,0 -8,4 -6,-1 -8,-6" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Prosperity / Wealth Elements (Coins and Gems) -->
  <!-- Floating Gold Coin 1 -->
  <g transform="translate(155, 95)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="12" ry="7" fill="url(#coin-edge)"/>
    <ellipse cx="0" cy="-2" rx="11" ry="6" fill="url(#coin-face)"/>
    <text x="0" y="1" font-size="8" font-weight="bold" fill="#d97706" text-anchor="middle" font-family="sans-serif">$</text>
  </g>

  <!-- Floating Gold Coin 2 (Action pop up) -->
  <g transform="translate(85, 80)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="15" ry="9" fill="url(#coin-edge)"/>
    <ellipse cx="0" cy="-2" rx="14" ry="8" fill="url(#coin-face)"/>
    <text x="0" y="2" font-size="10" font-weight="bold" fill="#d97706" text-anchor="middle" font-family="sans-serif">$</text>
  </g>

  <!-- Tiny Sparkles / Energy Bursts -->
  <g fill="#fbbf24">
    <polygon points="170,25 172,32 179,34 172,36 170,43 168,36 161,34 168,32" />
    <polygon points="70,45 71,49 75,50 71,51 70,55 69,51 65,50 69,49" fill="#38bdf8"/>
    <polygon points="135,30 136,33 139,34 136,35 135,38 134,35 131,34 134,33" fill="#10b981"/>
  </g>

  <!-- Ground Floor Base Line -->
  <path d="M 20 185 L 220 185" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Glowing underline accent -->
  <path d="M 40 187 L 200 187" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>

</svg>