<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Cityscape Window Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Interior Wall -->
  <rect x="15" y="15" width="210" height="155" rx="8" fill="#1e293b" />
  
  <!-- Large Studio Window overlooking a bright horizon/city of the future -->
  <path d="M 140,25 L 210,25 L 210,145 L 140,145 Z" fill="url(#skyGrad)" />
  
  <!-- Distant Cityscape through window (Symbolizing future/horizon) -->
  <rect x="145" y="105" width="10" height="40" fill="#312e81" opacity="0.8" />
  <rect x="158" y="85" width="14" height="60" fill="#3730a3" opacity="0.9" />
  <rect x="175" y="95" width="12" height="50" fill="#312e81" opacity="0.8" />
  <rect x="190" y="70" width="16" height="75" fill="#4338ca" opacity="0.9" />
  <!-- Rising Sun / Bright Horizon Glow -->
  <circle cx="177" cy="115" r="16" fill="#f59e0b" opacity="0.6" />
  <circle cx="177" cy="115" r="8" fill="#fef08a" opacity="0.8" />

  <!-- Window Frame -->
  <rect x="140" y="25" width="70" height="120" fill="none" stroke="#0f172a" stroke-width="4" />
  <line x1="175" y1="25" x2="175" y2="145" stroke="#0f172a" stroke-width="2" />
  <line x1="140" y1="85" x2="210" y2="85" stroke="#0f172a" stroke-width="2" />

  <!-- Warm Sunlight Beam entering from Window -->
  <polygon points="140,25 210,25 225,170 15,170" fill="url(#lightBeam)" />

  <!-- Wall Shelf with Books and Plant -->
  <rect x="25" y="45" width="60" height="4" rx="2" fill="#475569" />
  <!-- Potted succulent on shelf -->
  <path d="M 35,45 L 43,45 L 41,37 L 37,37 Z" fill="#10b981" />
  <circle cx="39" cy="35" r="4" fill="#34d399" />
  <!-- Books on shelf -->
  <rect x="52" y="30" width="8" height="15" rx="1" fill="#ec4899" />
  <rect x="61" y="27" width="10" height="18" rx="1" fill="#38bdf8" />

  <!-- FOREGROUND & DESK SETUP -->
  <!-- Large Wooden Desk -->
  <rect x="15" y="155" width="210" height="60" rx="4" fill="#334155" />
  <rect x="15" y="155" width="210" height="8" rx="2" fill="#475569" />

  <!-- Desk Lamp -->
  <path d="M 195,155 L 199,120 L 195,120 L 191,155 Z" fill="#64748b" />
  <path d="M 183,115 C 183,105 195,100 205,108 L 210,120 C 205,120 183,122 183,115 Z" fill="#f59e0b" />
  <ellipse cx="203" cy="118" rx="8" ry="4" fill="#fef08a" />
  <circle cx="203" cy="118" r="30" fill="url(#lampGlow)" style="mix-blend-mode: screen;" />

  <!-- Laptop showing upward growth chart (Optimistic career/future concept) -->
  <path d="M 85,155 L 65,155 L 68,132 L 82,132 Z" fill="#64748b" /> <!-- Laptop Base -->
  <rect x="60" y="154" width="30" height="3" rx="1" fill="#94a3b8" />
  <path d="M 60,133 L 90,133 L 88,105 L 62,105 Z" fill="#0f172a" /> <!-- Screen -->
  <!-- Upward Trend Line on Screen -->
  <polyline points="66,126 72,122 78,125 86,112" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="86" cy="112" r="2.5" fill="#34d399" />

  <!-- Coffee Mug -->
  <rect x="110" y="140" width="12" height="15" rx="3" fill="#cbd5e1" />
  <path d="M 122,143 C 126,143 126,150 122,152" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <!-- Steam from coffee -->
  <path d="M 114,135 C 113,132 117,130 116,127" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- MAIN CHARACTER: Optimistic Young Professional -->
  <!-- Chair Back -->
  <path d="M 35,100 L 55,100 C 58,100 60,102 60,105 L 60,165 L 35,165 Z" fill="#334155" />
  <rect x="42" y="110" width="11" height="45" rx="3" fill="#1e293b" opacity="0.6" />

  <!-- Character Body / Torso (Wearing a stylish casual shirt) -->
  <path d="M 40,160 C 40,135 50,130 65,130 C 80,130 90,135 90,160 Z" fill="#38bdf8" />
  <!-- Collar -->
  <path d="M 58,130 L 65,142 L 72,130 Z" fill="#f8fafc" />

  <!-- Character Neck -->
  <rect x="60" y="118" width="10" height="15" fill="#fbcfe8" />

  <!-- Character Head with Optimistic Smile -->
  <circle cx="65" cy="105" r="16" fill="#fbcfe8" />
  
  <!-- Hair (Modern neat cut, dark brown/black) -->
  <path d="M 49,105 C 49,92 57,88 65,88 C 76,88 81,93 81,104 C 81,105 81,106 81,107 L 79,93 C 75,91 70,91 63,92 C 55,93 51,97 49,105 Z" fill="#0f172a" />

  <!-- Facial Expression: Confident & Optimistic (Looking up toward the light/window) -->
  <!-- Gentle Smiling Eyes (curved up) -->
  <path d="M 58,102 Q 61,100 64,102" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 68,102 Q 71,100 74,102" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Rosy Cheeks -->
  <circle cx="58" cy="107" r="3" fill="#f43f5e" opacity="0.3" />
  <circle cx="74" cy="107" r="3" fill="#f43f5e" opacity="0.3" />

  <!-- Warm, confident smile -->
  <path d="M 61,111 Q 66,116 71,111" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />

  <!-- Raised Arms / Hand Gestures expressing optimism and positive outlook -->
  <!-- Left arm bent supporting posture or gesturing positively -->
  <path d="M 43,145 C 43,135 48,130 55,135" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <!-- Right arm raised gesturing towards the future/window -->
  <path d="M 87,145 C 97,135 102,125 105,115" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <circle cx="106" cy="112" r="4.5" fill="#fbcfe8" /> <!-- Right Hand -->

  <!-- Foreground Floor Shadow -->
  <ellipse cx="65" cy="210" rx="55" ry="5" fill="#0f172a" opacity="0.5" />

</svg>