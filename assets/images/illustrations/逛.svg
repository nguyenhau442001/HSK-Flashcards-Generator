<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Warm street light glow -->
    <radialGradient id="streetLampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Shop window warm interior glow -->
    <linearGradient id="shopWindowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Soft drop shadow for characters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#090d16" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- DISTANT ENVIRONMENT (Night Cityscape & Alleyways) -->
  <g id="distant-buildings">
    <rect x="20" y="70" width="35" height="110" fill="#162032" rx="2"/>
    <rect x="60" y="50" width="45" height="130" fill="#131b2e" rx="2"/>
    <rect x="180" y="60" width="40" height="120" fill="#162032" rx="2"/>
    <!-- Distant warm windows -->
    <rect x="28" y="85" width="8" height="10" fill="#fbbf24" opacity="0.3"/>
    <rect x="42" y="85" width="8" height="10" fill="#fbbf24" opacity="0.2"/>
    <rect x="70" y="70" width="10" height="14" fill="#fbbf24" opacity="0.4"/>
    <rect x="88" y="70" width="10" height="14" fill="#fbbf24" opacity="0.1"/>
    <rect x="192" y="75" width="8" height="12" fill="#38bdf8" opacity="0.3"/>
  </g>

  <!-- MID-GROUND: SHOPHOUSES, LANTERNS, & STREET PROPS -->
  <!-- Shop 1 (Left - Teahouse/Boutique) -->
  <path d="M 0 100 L 55 90 L 55 190 L 0 190 Z" fill="#1e293b"/>
  <rect x="10" y="105" width="35" height="45" rx="4" fill="url(#shopWindowGlow)" stroke="#334155" stroke-width="2"/>
  <path d="M 5 95 L 50 87 L 52 97 L 3 105 Z" fill="#fb923c"/>
  <!-- Hanging Lantern -->
  <path d="M 27 65 L 27 75" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="27" cy="83" rx="10" ry="12" fill="#ef4444"/>
  <path d="M 20 78 Q 27 82 34 78" stroke="#fca5a5" stroke-width="1.5" fill="none"/>
  <path d="M 20 88 Q 27 92 34 88" stroke="#fca5a5" stroke-width="1.5" fill="none"/>
  <line x1="27" y1="95" x2="27" y2="100" stroke="#fca5a5" stroke-width="2"/>

  <!-- Shop 2 (Right - Night Market Stall) -->
  <path d="M 160 85 L 240 70 L 240 190 L 160 190 Z" fill="#182235"/>
  <!-- Awning (Striped) -->
  <path d="M 150 85 L 240 70 L 240 82 L 150 97 Z" fill="#38bdf8"/>
  <path d="M 165 82 L 180 79 L 180 93 L 165 96 Z" fill="#0284c7"/>
  <path d="M 195 76 L 210 73 L 210 88 L 195 91 Z" fill="#0284c7"/>
  <rect x="175" y="105" width="50" height="55" rx="4" fill="url(#shopWindowGlow)" stroke="#334155" stroke-width="2"/>

  <!-- Street Lamp Casting Light -->
  <circle cx="120" cy="50" r="70" fill="url(#streetLampGlow)"/>
  <path d="M 118 30 L 122 30 L 122 190 L 118 190 Z" fill="#475569"/>
  <path d="M 110 25 L 130 25 L 125 32 L 115 32 Z" fill="#334155"/>
  <circle cx="120" cy="35" r="8" fill="#fef08a" filter="url(#shadow)"/>

  <!-- FOREGROUND PAVEMENT / STREET -->
  <path d="M 0 175 Q 120 165 240 175 L 240 240 L 0 240 Z" fill="#0b0f19"/>
  <path d="M 0 175 Q 120 165 240 175" stroke="#334155" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Pavement stones texture highlights -->
  <ellipse cx="60" cy="190" rx="25" ry="6" fill="#111827" opacity="0.5"/>
  <ellipse cx="170" cy="205" rx="35" ry="8" fill="#111827" opacity="0.5"/>

  <!-- MAIN SUBJECT: TWO CHARACTERS "DI DẠO" (STROLLING) -->
  
  <!-- Character 1 (Left - Woman holding a shopping bag/drink, casual pose) -->
  <g id="character-left" filter="url(#shadow)">
    <!-- Legs in motion (Walking stride) -->
    <path d="M 82 170 L 73 205 L 83 208" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 88 170 L 98 200 L 107 197" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoes -->
    <ellipse cx="80" cy="209" rx="6" ry="3" fill="#cbd5e1"/>
    <ellipse cx="110" cy="197" rx="6" ry="3" fill="#cbd5e1"/>

    <!-- Torso & Jacket -->
    <path d="M 72 125 L 98 125 L 102 170 L 76 170 Z" fill="#ec4899" rx="4"/>
    <path d="M 72 125 L 85 170 L 76 170 Z" fill="#db2777"/> <!-- Jacket shading -->
    <path d="M 85 125 L 85 170" stroke="#be185d" stroke-width="2"/> <!-- zipper -->

    <!-- Head & Hair -->
    <circle cx="87" cy="102" rx="14" ry="15" fill="#fde68a"/> <!-- face -->
    <!-- Bob Haircut -->
    <path d="M 73 95 Q 70 120 88 118 Q 104 120 101 95 Q 102 85 87 84 Q 72 85 73 95 Z" fill="#1e1b4b"/>
    <!-- Happy Expression -->
    <path d="M 83 102 Q 87 106 91 102" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/> <!-- smile -->
    <circle cx="83" cy="98" r="1.5" fill="#b45309"/>
    <circle cx="91" cy="98" r="1.5" fill="#b45309"/>
    <path d="M 78 95 Q 83 93 85 96" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.6"/> <!-- blush -->
    <path d="M 89 95 Q 91 93 96 96" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Arms & Props -->
    <!-- Back arm -->
    <path d="M 74 130 L 62 145 L 68 155" stroke="#ec4899" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front arm holding boba tea / shopping bag -->
    <path d="M 96 130 L 108 145 L 104 158" stroke="#fde68a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Cute Shopping Bag / Cup -->
    <rect x="98" y="155" width="14" height="18" rx="3" fill="#38bdf8"/>
    <path d="M 101 155 Q 105 148 109 155" stroke="#bae6fd" stroke-width="2" fill="none"/>
    <path d="M 103 162 L 109 162" stroke="#bae6fd" stroke-width="1.5"/>
  </g>

  <!-- Character 2 (Right - Man strolling, hands in pockets or holding a phone, relaxed posture) -->
  <g id="character-right" filter="url(#shadow)">
    <!-- Legs in walking motion -->
    <path d="M 132 170 L 123 203 L 133 207" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 142 170 L 152 200 L 143 203" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoes -->
    <ellipse cx="135" cy="208" rx="7" ry="3" fill="#f8fafc"/>
    <ellipse cx="145" cy="204" rx="7" ry="3" fill="#f8fafc"/>

    <!-- Torso & Hoodie -->
    <path d="M 126 122 L 152 122 L 156 170 L 122 170 Z" fill="#10b981" rx="4"/>
    <path d="M 139 122 L 139 170" stroke="#047857" stroke-width="2"/> <!-- hoodie seam -->
    <!-- Hoodie Pocket -->
    <path d="M 130 152 L 148 152 L 145 168 L 133 168 Z" fill="#059669"/>

    <!-- Head & Hair -->
    <circle cx="139" cy="98" rx="14" ry="15" fill="#fde68a"/> <!-- face -->
    <!-- Trendy Hair -->
    <path d="M 125 96 Q 128 82 140 84 Q 153 82 154 96 Q 155 102 148 94 Q 135 90 125 96 Z" fill="#334155"/>
    <!-- Expression -->
    <path d="M 135 98 Q 139 102 143 98" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="135" cy="94" r="1.5" fill="#b45309"/>
    <circle cx="143" cy="94" r="1.5" fill="#b45309"/>

    <!-- Arms -->
    <!-- Back arm -->
    <path d="M 128 128 L 118 145 L 124 155" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front arm (relaxed) -->
    <path d="M 150 128 L 160 145 L 154 158" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- FOREGROUND ATMOSPHERIC PROPS (Adds rich environmental depth) -->
  <!-- Cute small potted plant outside the shop (Left) -->
  <path d="M 45 185 L 55 185 L 53 200 L 47 200 Z" fill="#cbd5e1"/>
  <ellipse cx="50" cy="185" rx="5" ry="2" fill="#e2e8f0"/>
  <path d="M 50 185 Q 40 170 45 160" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="45" cy="160" r="6" fill="#16a34a"/>
  <path d="M 50 185 Q 60 170 55 158" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="55" cy="158" r="7" fill="#22c55e"/>

  <!-- Floating particles / city ambiance -->
  <circle cx="90" cy="130" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="115" cy="115" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="155" cy="135" r="1" fill="#fef08a" opacity="0.5"/>
  <circle cx="130" cy="75" r="2" fill="#fef08a" opacity="0.7"/>
  <circle cx="75" cy="70" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="170" cy="110" r="2" fill="#38bdf8" opacity="0.5"/>

  <!-- Small street sign post (Right edge) -->
  <rect x="220" y="130" width="4" height="60" fill="#64748b"/>
  <path d="M 210 135 L 234 135 L 230 145 L 214 145 Z" fill="#fbbf24"/>
</svg>