<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm indoor light glow -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window frost gradient -->
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glove Gradient (Bright vibrant accent) -->
    <linearGradient id="gloveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Scarf Gradient -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- BACKGROUND SCENERY: Window showing winter night & snow -->
  <!-- Window Frame Outer -->
  <rect x="140" y="24" width="76" height="110" rx="6" fill="#0f172a" />
  <!-- Window Glass -->
  <rect x="144" y="28" width="68" height="102" rx="4" fill="url(#frostGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Snowflakes outside window -->
  <g fill="#94a3b8" opacity="0.8">
    <circle cx="160" cy="45" r="1.5" />
    <circle cx="190" cy="65" r="2" />
    <circle cx="155" cy="85" r="1" />
    <circle cx="185" cy="110" r="1.5" />
    <path d="M172 50 L172 58 M168 54 L176 54" stroke="#94a3b8" stroke-width="0.8" />
    <path d="M162 95 L162 101 M159 98 L165 98" stroke="#94a3b8" stroke-width="0.8" />
  </g>

  <!-- Indoor Elements: Wooden Shelf / Plant in background -->
  <rect x="20" y="90" width="70" height="6" rx="3" fill="#475569" />
  <!-- Cute small potted plant -->
  <path d="M45 70 L55 70 L53 90 L47 90 Z" fill="#64748b" />
  <circle cx="50" cy="65" r="10" fill="#10b981" />
  <circle cx="42" cy="68" r="7" fill="#059669" />
  <circle cx="58" cy="67" r="8" fill="#059669" />

  <!-- Wall Lamp -->
  <path d="M85 30 L95 30 L95 38 L85 38 Z" fill="#f59e0b" />
  <path d="M80 38 L100 38 L105 48 L75 48 Z" fill="#fbbf24" />
  <path d="M90 20 L90 30" stroke="#475569" stroke-width="2" />

  <!-- Table/Desk Surface -->
  <rect x="0" y="190" width="240" height="50" fill="#334155" />
  <rect x="0" y="184" width="240" height="6" fill="#475569" />

  <!-- Foreground Props on Desk -->
  <!-- Mug with hot drink steam -->
  <rect x="180" y="155" width="22" height="29" rx="4" fill="#cbd5e1" />
  <path d="M202 162 C210 162 210 174 202 174" stroke="#cbd5e1" stroke-width="3" fill="none" />
  <path d="M188 145 C190 140 186 135 190 130" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
  
  <!-- Secondary Winter Glove resting on desk -->
  <g transform="translate(140, 160) rotate(-15)">
    <path d="M0 15 C0 8 5 3 12 3 C19 3 24 8 24 15 L24 28 C24 33 20 37 12 37 C4 37 0 33 0 28 Z" fill="url(#gloveGrad)" />
    <path d="M-3 12 C-6 12 -8 15 -8 18 C-8 21 -6 23 -3 23" fill="url(#gloveGrad)" />
    <rect x="4" y="28" width="16" height="6" rx="2" fill="#fb7185" />
  </g>

  <!-- MAIN CHARACTER: Person getting ready for winter, putting on gloves -->
  <g transform="translate(10, 15)">
    <!-- Character Body / Coat -->
    <!-- Torso (Warm winter puffer jacket) -->
    <path d="M45 125 C35 125 25 140 25 165 L25 185 L95 185 L95 165 C95 140 85 125 75 125 Z" fill="#38bdf8" />
    <!-- Jacket collar / zipper area -->
    <path d="M52 125 L68 125 L65 145 L55 145 Z" fill="#bae6fd" />
    <line x1="60" y1="125" x2="60" y2="145" stroke="#0284c7" stroke-width="1.5" />

    <!-- Scarf wrapped around neck -->
    <path d="M43 118 C50 110 70 110 77 118 C80 122 75 128 70 128 C60 125 59 125 50 128 C45 128 40 122 43 118 Z" fill="url(#scarfGrad)" />
    <!-- Scarf hanging end -->
    <path d="M45 124 L35 155 L45 158 L52 130 Z" fill="url(#scarfGrad)" />

    <!-- Neck -->
    <rect x="52" y="108" width="16" height="15" fill="#fbcfe8" />

    <!-- Head & Face -->
    <circle cx="60" cy="92" r="20" fill="#fbcfe8" />
    
    <!-- Cheeks (Cold winter blush) -->
    <circle cx="48" cy="98" r="4" fill="#fda4af" opacity="0.6" />
    <circle cx="72" cy="98" r="4" fill="#fda4af" opacity="0.6" />

    <!-- Cute Happy Eyes (Closed/Crescent for joyful readiness) -->
    <path d="M50 89 C52 92 56 92 58 89" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M62 89 C64 92 68 92 70 89" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Smile -->
    <path d="M56 99 C58 102 62 102 64 99" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Winter Beanie Hat -->
    <path d="M39 88 C40 70 80 70 81 88 C75 90 45 90 39 88 Z" fill="#8b5cf6" />
    <path d="M37 86 C37 83 83 83 83 88 C83 93 37 93 37 86 Z" fill="#7c3aed" />
    <!-- Pom-pom on hat -->
    <circle cx="60" cy="68" r="7" fill="#f43f5e" />

    <!-- Hair tufts -->
    <path d="M42 85 L39 81" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

    <!-- Left Arm & Hand (Relaxed / holding pose) -->
    <path d="M28 135 L15 155 L25 160 L35 140 Z" fill="#0284c7" />
    <!-- Left Hand with Glove -->
    <g transform="translate(10, 155)">
      <path d="M0 5 C0 0 4 -3 9 -3 C14 -3 18 0 18 5 L18 15 C18 19 14 22 9 22 C4 22 0 19 0 15 Z" fill="url(#gloveGrad)" />
      <!-- Thumb -->
      <path d="M15 8 C19 8 21 11 20 14 C19 16 16 16 14 14" fill="url(#gloveGrad)" />
    </g>

    <!-- Right Arm & Hand (ACTIVELY PUTTING ON THE GLOVE - THE FOCAL ACTION) -->
    <!-- Upper right arm -->
    <path d="M92 130 C105 135 112 145 115 155" stroke="#0284c7" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Right Hand pulling on the target glove (手套 - shǒutào) -->
    <g transform="translate(105, 145)">
      <!-- Wrist/Arm opening into glove -->
      <path d="M-2 2 L12 12" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round" />
      
      <!-- The Target Glove being pulled onto hand -->
      <g transform="rotate(25)">
        <!-- Main glove body -->
        <path d="M-5 0 C-5 -8 2 -14 10 -14 C18 -14 25 -8 25 0 L25 15 C25 21 18 26 10 26 C2 26 -5 21 -5 15 Z" fill="url(#gloveGrad)" />
        <!-- Glove cuff (ribbed texture) -->
        <path d="M-5 18 L25 18 L25 25 L-5 25 Z" fill="#fb7185" />
        <line x1="0" y1="18" x2="0" y2="25" stroke="#e11d48" stroke-width="1.5" />
        <line x1="7" y1="18" x2="7" y2="25" stroke="#e11d48" stroke-width="1.5" />
        <line x1="14" y1="18" x2="14" y2="25" stroke="#e11d48" stroke-width="1.5" />
        <line x1="21" y1="18" x2="21" y2="25" stroke="#e11d48" stroke-width="1.5" />
        
        <!-- Thumb sticking out -->
        <path d="M-3 -2 C-7 -2 -10 1 -9 5 C-8 8 -5 8 -3 6" fill="url(#gloveGrad)" />
      </g>
    </g>
  </g>

  <!-- Atmospheric indoor sparkles / cozy feeling -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="115" cy="55" r="1.5" />
    <circle cx="35" cy="45" r="2" />
    <circle cx="125" cy="115" r="1" />
  </g>
</svg>