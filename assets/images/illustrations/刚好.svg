<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bus Stop Structure -->
  <rect x="20" y="120" width="100" height="80" fill="#334155" rx="4"/>
  <rect x="25" y="125" width="90" height="70" fill="#1e293b" rx="2"/>
  <path d="M120 120h10v80h-10z" fill="#475569"/>
  
  <!-- The Bus leaving -->
  <g transform="translate(140, 130)">
    <rect x="0" y="0" width="80" height="45" rx="8" fill="#fb923c"/>
    <rect x="10" y="5" width="20" height="15" fill="#e2e8f0" rx="2"/>
    <rect x="40" y="5" width="20" height="15" fill="#e2e8f0" rx="2"/>
    <circle cx="20" cy="45" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="60" cy="45" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <path d="M80 20l15 -5l-5 20z" fill="#475569" opacity="0.6"/>
  </g>
  
  <!-- The Person arriving -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M12 35l8 20l8 -20" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 35l-10 15" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 35l10 15" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Shocked expression -->
    <circle cx="16" cy="18" r="2" fill="#0f172a"/>
    <circle cx="24" cy="18" r="2" fill="#0f172a"/>
    <ellipse cx="20" cy="25" rx="3" ry="2" fill="#0f172a"/>
  </g>
  
  <!-- Motion lines for bus -->
  <path d="M130 150l-20 5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M130 160l-25 5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Ground -->
  <rect x="0" y="200" width="240" height="40" fill="#1e293b"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
</svg>