<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Glow -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Office Wall & Window -->
  <path d="M 152 24 L 216 24 L 216 110 L 152 110 Z" fill="#334155" opacity="0.4" />
  <path d="M 156 28 L 212 28 L 212 106 L 156 106 Z" fill="url(#window-light)" />
  <!-- Window frame cross -->
  <line x1="184" y1="28" x2="184" y2="106" stroke="#1e293b" stroke-width="2" />
  <line x1="156" y1="67" x2="212" y2="67" stroke="#1e293b" stroke-width="2" />

  <!-- Wall Calendar (representing "明天" / Tomorrow) -->
  <g transform="translate(32, 35)">
    <rect width="36" height="42" rx="4" fill="#cbd5e1" filter="url(#shadow)" />
    <rect width="36" height="12" rx="4" fill="#ef4444" />
    <circle cx="12" cy="6" r="2" fill="#fff" />
    <circle cx="24" cy="6" r="2" fill="#fff" />
    <!-- Mini calendar grid hints -->
    <rect x="6" y="18" width="6" height="5" rx="1" fill="#64748b" />
    <rect x="15" y="18" width="6" height="5" rx="1" fill="#64748b" />
    <rect x="24" y="18" width="6" height="5" rx="1" fill="#64748b" />
    <rect x="6" y="26" width="6" height="5" rx="1" fill="#ef4444" /> <!-- Highlighted date -->
    <rect x="15" y="26" width="6" height="5" rx="1" fill="#64748b" />
    <rect x="24" y="26" width="6" height="5" rx="1" fill="#64748b" />
  </g>

  <!-- Office Bookshelf in background -->
  <rect x="78" y="30" width="32" height="75" fill="#1e293b" rx="2" />
  <line x1="78" y1="55" x2="110" y2="55" stroke="#334155" stroke-width="2" />
  <line x1="78" y1="80" x2="110" y2="80" stroke="#334155" stroke-width="2" />
  <!-- Colorful books -->
  <rect x="82" y="38" width="6" height="17" rx="1" fill="#38bdf8" />
  <rect x="90" y="36" width="8" height="19" rx="1" fill="#ec4899" />
  <rect x="82" y="62" width="12" height="18" rx="1" fill="#10b981" />
  <rect x="96" y="65" width="5" height="15" rx="1" fill="#f59e0b" />

  <!-- Large Office Desk -->
  <path d="M 20 150 L 220 150 L 230 210 L 10 210 Z" fill="#0f172a" />
  <rect x="15" y="140" width="210" height="12" rx="4" fill="#334155" filter="url(#shadow)" />

  <!-- PROPS ON DESK -->
  <!-- Laptop showing a Presentation Slide (Meeting Context) -->
  <g transform="translate(130, 105)">
    <!-- Laptop Base -->
    <path d="M 10 40 L 70 40 L 80 48 L 0 48 Z" fill="#64748b" />
    <rect x="30" y="42" width="20" height="4" rx="1" fill="#475569" />
    <!-- Laptop Screen -->
    <path d="M 10 2 C 10 0.8 11 0 12 0 L 68 0 C 69 0 70 0.8 70 2 L 70 40 L 10 40 Z" fill="#334155" />
    <!-- Screen Display (Chart / Meeting graphics) -->
    <rect x="14" y="4" width="52" height="32" fill="url(#screen-glow)" rx="2" />
    <!-- Abstract Bar Chart on screen -->
    <rect x="18" y="22" width="7" height="10" rx="1" fill="#ffffff" opacity="0.8" />
    <rect x="29" y="16" width="7" height="16" rx="1" fill="#fbbf24" />
    <rect x="40" y="11" width="7" height="21" rx="1" fill="#38bdf8" />
    <rect x="51" y="19" width="7" height="13" rx="1" fill="#ffffff" opacity="0.8" />
    <line x1="16" y1="32" x2="60" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(195, 120)">
    <rect x="0" y="4" width="12" height="16" rx="2" fill="#ec4899" />
    <path d="M 12 8 C 16 8 16 16 12 16" stroke="#ec4899" stroke-width="2" fill="none" />
    <!-- Steam -->
    <path d="M 3 0 C 3 -3 6 -3 6 -6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- Meeting Notebook & Pen -->
  <g transform="translate(45, 125)">
    <!-- Notebook -->
    <rect x="0" y="0" width="30" height="22" rx="2" fill="#f59e0b" transform="rotate(-5)" filter="url(#shadow)" />
    <line x1="5" y1="3" x2="25" y2="3" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" transform="rotate(-5)" />
    <line x1="5" y1="9" x2="25" y2="9" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" transform="rotate(-5)" />
    <line x1="5" y1="15" x2="20" y2="15" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" transform="rotate(-5)" />
    <!-- Pen -->
    <rect x="28" y="15" width="20" height="3" rx="1" fill="#38bdf8" transform="rotate(25)" />
  </g>

  <!-- Desk Lamp -->
  <g transform="translate(20, 90)">
    <path d="M 15 60 L 25 60 L 25 35 L 15 35 Z" fill="#475569" />
    <path d="M 20 35 C 10 20 5 10 0 0" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Lamp Shade -->
    <path d="M -10 -5 L 15 -5 L 8 -15 L -3 -15 Z" fill="#fbbf24" filter="url(#shadow)" />
    <ellipse cx="2" cy="-10" rx="8" ry="4" fill="#f59e0b" />
    <!-- Light Cone / Glow -->
    <path d="M -15 -5 L 20 -5 L 50 50 L -30 50 Z" fill="url(#lamp-glow)" />
  </g>

  <!-- MAIN CHARACTER (Professional planning the meeting) -->
  <g transform="translate(75, 75)">
    <!-- Character Body / Torso -->
    <path d="M 25 75 C 25 60 40 55 55 55 C 70 55 85 60 85 75 L 95 125 L 15 125 Z" fill="#0284c7" filter="url(#shadow)" />
    <!-- Collar / Shirt Detail -->
    <polygon points="55,55 45,70 65,70" fill="#f8fafc" />
    <!-- Neck -->
    <rect x="47" y="45" width="16" height="15" fill="#fbcfe8" rx="4" />

    <!-- Head -->
    <g transform="translate(35, 12)">
      <!-- Hair Base -->
      <path d="M 8 35 C 5 15 25 5 45 8 C 65 5 85 15 82 35 C 82 42 75 42 75 38 C 75 25 65 20 45 20 C 25 20 15 25 15 38 C 15 42 8 42 8 35 Z" fill="#334155" />
      <!-- Face Shape -->
      <rect x="12" y="15" width="40" height="42" rx="20" fill="#fbcfe8" />
      <!-- Hair Top Styling -->
      <path d="M 14 25 C 20 12 40 12 50 20 C 35 14 20 18 14 25 Z" fill="#334155" />
      
      <!-- Friendly, thoughtful facial expression -->
      <!-- Eyebrows (slightly raised, thinking/planning) -->
      <path d="M 20 28 Q 26 24 32 27" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 38 27 Q 44 24 50 28" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
      
      <!-- Eyes -->
      <circle cx="26" cy="34" r="3" fill="#1e293b" />
      <circle cx="44" cy="34" r="3" fill="#1e293b" />
      <circle cx="27" cy="33" r="1" fill="#ffffff" />
      <circle cx="45" cy="33" r="1" fill="#ffffff" />

      <!-- Gentle Smile -->
      <path d="M 31 43 Q 35 47 39 43" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" />

      <!-- Stylish Round Glasses -->
      <circle cx="26" cy="34" r="7" stroke="#475569" stroke-width="1.5" fill="none" />
      <circle cx="44" cy="34" r="7" stroke="#475569" stroke-width="1.5" fill="none" />
      <line x1="33" y1="34" x2="37" y2="34" stroke="#475569" stroke-width="1.5" />
    </g>

    <!-- Arms & Hands in thoughtful gesture -->
    <!-- Left Arm (resting on desk) -->
    <path d="M 22 75 L 5 105 L 35 110" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Left Hand -->
    <circle cx="35" cy="112" r="7" fill="#fbcfe8" />

    <!-- Right Arm (hand touching chin, pondering) -->
    <path d="M 88 78 L 75 95 L 60 85" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Hand on Chin -->
    <circle cx="58" cy="80" r="7" fill="#fbcfe8" />
  </g>

  <!-- Floating Thought/Action Bubble element (subtle graphical cue) -->
  <g transform="translate(125, 45)" filter="url(#shadow)">
    <!-- Small dots leading to bubble -->
    <circle cx="0" cy="25" r="2" fill="#38bdf8" opacity="0.6" />
    <circle cx="-6" cy="18" r="3" fill="#38bdf8" opacity="0.8" />
    <!-- Main Bubble -->
    <rect x="-35" y="-15" width="55" height="28" rx="14" fill="#ffffff" />
    <path d="M -15 13 L -10 20 L -5 13 Z" fill="#ffffff" />
    <!-- Mini clock/meeting icon inside thought bubble -->
    <circle cx="-7" cy="-1" r="8" fill="#38bdf8" />
    <polyline points="-7,-5 -7,-1 -3,-1" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />
    <line x1="7" y1="-5" x2="15" y2="-5" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="7" y1="1" x2="13" y2="1" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="7" x2="11" y2="7" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>