<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1b1b3a"/>
    </linearGradient>

    <!-- Scenic Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="mountFar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mountNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Water Gradient -->
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- SCENERY BACKGROUND -->
  <!-- Sky background inside window/view -->
  <rect x="20" y="20" width="200" height="150" rx="14" fill="url(#skyGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Sun / Golden glow -->
  <circle cx="160" cy="70" r="18" fill="#fbbf24" filter="url(#glow)" opacity="0.8"/>
  <circle cx="160" cy="70" r="12" fill="#fef08a"/>

  <!-- Distant Mountains -->
  <path d="M20 120 L70 80 L120 110 L180 75 L220 100 L220 170 L20 170 Z" fill="url(#mountFar)"/>

  <!-- Closer Mountains & Rolling Hills -->
  <path d="M20 135 Q70 100 120 130 T220 125 L220 170 L20 170 Z" fill="url(#mountNear)"/>

  <!-- Lake / River reflecting scenery -->
  <path d="M40 150 Q120 135 200 150 L210 170 L30 170 Z" fill="url(actinic? #0ea5e9)" fill="url(#lakeGrad)"/>
  <!-- Ripple lines -->
  <path d="M80 158 Q100 156 120 158" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M140 163 Q155 161 170 163" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Elegant Tree Silhouette / Framing (Foreground Nature) -->
  <path d="M20 170 C20 130 35 110 50 90 C45 110 35 130 30 170 Z" fill="#047857"/>
  <circle cx="50" cy="85" r="16" fill="#059669"/>
  <circle cx="40" cy="95" r="12" fill="#10b981"/>

  <!-- ARCHITECTURAL FOREGROUND (Scenic Lookout Pavilion railing & characters) -->
  <rect x="15" y="170" width="210" height="50" rx="4" fill="#334155"/>
  <rect x="25" y="165" width="190" height="8" rx="2" fill="#475569"/>

  <!-- Wooden Railing Posts -->
  <rect x="35" y="145" width="6" height="25" rx="2" fill="#cbd5e1"/>
  <rect x="85" y="145" width="6" height="25" rx="2" fill="#cbd5e1"/>
  <rect x="135" y="145" width="6" height="25" rx="2" fill="#cbd5e1"/>
  <rect x="185" y="145" width="6" height="25" rx="2" fill="#cbd5e1"/>
  <!-- Railing Bars -->
  <rect x="25" y="150" width="190" height="4" rx="1" fill="#e2e8f0"/>
  <rect x="25" y="160" width="190" height="3" rx="1" fill="#cbd5e1"/>

  <!-- CHARACTERS: Two friends enjoying the scenery -->
  <!-- Character 1 (Left - Pointing and smiling) -->
  <g transform="translate(60, 115)">
    <!-- Body / Torso -->
    <path d="M12 35 C12 25 22 22 30 22 C38 22 48 25 48 35 L52 55 L8 55 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="30" cy="12" r="10" fill="#fde047"/>
    <!-- Hair -->
    <path d="M20 10 C20 4 25 2 30 2 C36 2 40 5 41 10 C38 7 34 6 30 6 C25 6 22 8 20 10 Z" fill="#1e293b"/>
    <!-- Arm pointing -->
    <path d="M45 28 Q58 20 62 25" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="63" cy="26" r="3.5" fill="#fde047"/>
    <!-- Camera prop hanging -->
    <rect x="22" y="32" width="14" height="10" rx="2" fill="#64748b"/>
    <circle cx="29" cy="37" r="3" fill="#1e293b"/>
    <path d="M18 30 Q29 45 42 30" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Character 2 (Right - Taking photo / holding tablet/camera) -->
  <g transform="translate(130, 112)">
    <!-- Body / Torso -->
    <path d="M10 38 C10 28 20 25 28 25 C36 25 46 28 46 38 L50 58 L6 58 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="28" cy="14" r="10" fill="#fde047"/>
    <!-- Hair (Ponytail) -->
    <path d="M18 12 C18 6 23 4 28 4 C34 4 38 8 38 14 C42 12 44 16 42 18 C38 18 36 14 30 14 C24 14 20 15 18 12 Z" fill="#475569"/>
    <!-- Arms holding camera/device -->
    <path d="M15 35 L28 32 L38 36" stroke="#ec4899" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Device/Camera in hands -->
    <rect x="20" y="28" width="16" height="11" rx="2" fill="#0f172a"/>
    <rect x="25" y="30" width="6" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground decorative potted plant / flowers on the balcony -->
  <path d="M195 160 L205 170 L185 170 Z" fill="#f97316"/>
  <circle cx="195" cy="155" r="5" fill="#f43f5e"/>
  <circle cx="190" cy="158" r="4" fill="#fb923c"/>
  <circle cx="200" cy="157" r="4.5" fill="#ec4899"/>

  <!-- Subtle vignette border frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>