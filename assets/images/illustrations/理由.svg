<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Magnifying Glass Lens Glow -->
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Document Paper Gradient -->
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <circle cx="120" cy="110" r="100" fill="url(#spotlight)" />

  <!-- Ambient Background Elements (Investigation Theme) -->
  <!-- Floating Question Marks / Clues -->
  <g opacity="0.3" fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="M45 70 Q45 55 60 55 Q75 55 75 70 Q75 85 60 90 L60 100" />
    <circle cx="60" cy="115" r="1.5" fill="#38bdf8" />
    
    <path d="M195 85 Q195 72 205 72 Q215 72 215 85 Q215 95 205 98 L205 106" />
    <circle cx="205" cy="116" r="1.5" fill="#38bdf8" />
  </g>

  <!-- Wooden Desk Surface at bottom -->
  <path d="M 0 200 L 240 200 L 240 240 L 0 240 Z" fill="#090d16" />
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2" />

  <!-- MAIN SCENE: The Document / Evidence Sheet (Representing the 'Reason' / 'Lý do') -->
  <g filter="url(#shadow)" transform="rotate(-6 120 130)">
    <!-- Document Base -->
    <rect x="65" y="65" width="110" height="135" rx="8" fill="url(#paperGrad)" />
    <!-- Paper Header Accent Bar -->
    <path d="M 65 73 A 8 8 0 0 1 73 65 L 167 65 A 8 8 0 0 1 175 73 L 175 85 L 65 85 Z" fill="#f59e0b" opacity="0.9" />
    <circle cx="78" cy="75" r="3" fill="#ffffff" />
    <circle cx="88" cy="75" r="3" fill="#ffffff" opacity="0.7" />

    <!-- Abstract Text Lines & Checkmarks (Indicating reasons/arguments) -->
    <!-- Line 1 with Checkmark -->
    <circle cx="82" cy="105" r="5" fill="#10b981" opacity="0.2" />
    <path d="M79 105 L81 107 L85 102" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="96" y="102" width="60" height="6" rx="3" fill="#cbd5e1" />

    <!-- Line 2 with Checkmark -->
    <circle cx="82" cy="125" r="5" fill="#10b981" opacity="0.2" />
    <path d="M79 125 L81 127 L85 122" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="96" y="122" width="50" height="6" rx="3" fill="#cbd5e1" />

    <!-- Line 3 (Highlighted core reason) -->
    <circle cx="82" cy="145" r="5" fill="#38bdf8" opacity="0.3" />
    <path d="M79 145 L82 148 L86 142" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="96" y="142" width="65" height="6" rx="3" fill="#38bdf8" opacity="0.6" />

    <!-- Line 4 -->
    <rect x="80" y="165" width="40" height="5" rx="2.5" fill="#e2e8f0" />
    <rect x="80" y="177" width="70" height="5" rx="2.5" fill="#e2e8f0" />
  </g>

  <!-- Glowing Accent Light beam on the document -->
  <path d="M 80 80 L 140 80 L 160 170 L 100 170 Z" fill="#ffffff" opacity="0.04" />

  <!-- THE MAGNIFYING GLASS (Uncovering the reason / Action-packed discovery) -->
  <g filter="url(#shadow)" transform="translate(15, 10)">
    <!-- Handle -->
    <g transform="rotate(35 150 130)">
      <rect x="145" y="125" width="12" height="60" rx="6" fill="#fb923c" />
      <!-- Handle Grip details -->
      <line x1="145" y1="140" x2="157" y2="140" stroke="#ea580c" stroke-width="2" opacity="0.6" />
      <line x1="145" y1="150" x2="157" y2="150" stroke="#ea580c" stroke-width="2" opacity="0.6" />
      <line x1="145" y1="160" x2="157" y2="160" stroke="#ea580c" stroke-width="2" opacity="0.6" />
      <!-- Metallic connector ring -->
      <rect x="143" y="115" width="16" height="12" rx="3" fill="#94a3b8" />
      <rect x="143" y="117" width="16" height="3" fill="#cbd5e1" />
    </g>

    <!-- Glass Rim (Outer) -->
    <circle cx="115" cy="95" r="42" fill="#0f172a" stroke="#f59e0b" stroke-width="6" />
    <!-- Glass Rim (Inner Highlight) -->
    <circle cx="115" cy="95" r="39" fill="url(#lensGrad)" />
    
    <!-- Magnified Lens Flare / Reflection -->
    <path d="M 90 75 Q 105 60 130 70 Q 115 65 95 85 Z" fill="#ffffff" opacity="0.6" />
    <path d="M 98 120 A 35 35 0 0 1 142 90" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Magnified Key Element inside lens (Golden Sparkle / Core Truth) -->
    <g transform="translate(115, 95) scale(1.1)">
      <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.3" filter="url(#glow)" />
      <path d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="#fbbf24" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- Floating Sparkles / Action Particles for discovery -->
  <g fill="#fbbf24">
    <circle cx="45" cy="45" r="3" opacity="0.8" />
    <circle cx="53" cy="41" r="1.5" opacity="0.5" />
    <path d="M 190 40 L 192 45 L 197 47 L 192 49 L 190 54 L 188 49 L 183 47 L 188 45 Z" opacity="0.9" transform="scale(0.6) translate(130, -10)" />
    <circle cx="170" cy="170" r="2" opacity="0.7" />
    <circle cx="55" cy="180" r="2.5" opacity="0.6" />
  </g>

  <!-- Foreground Atmospheric Bubble/Glow -->
  <circle cx="130" cy="95" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="105" cy="70" r="1.5" fill="#ffffff" opacity="0.7" />
</svg>