<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="110" r="90" fill="url(#amberGlow)"/>

  <!-- Background Environment (Detect/Discovery Room) -->
  <g opacity="0.6">
    <!-- Window Grid (Night scene looking out) -->
    <rect x="30" y="30" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="60" y1="30" x2="60" y2="110" stroke="#334155" stroke-width="2"/>
    <line x1="30" y1="70" x2="90" y2="70" stroke="#334155" stroke-width="2"/>
    <circle cx="75" cy="45" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="45" cy="90" r="2" fill="#38bdf8" opacity="0.6"/>

    <!-- Ambient Floating Data Particles representing certainty/confirmation -->
    <circle cx="40" cy="130" r="2" fill="#f59e0b" opacity="0.8"/>
    <circle cx="200" cy="80" r="3" fill="#10b981" opacity="0.8"/>
    <circle cx="190" cy="150" r="1.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="50" cy="70" r="1.5" fill="#ec4899" opacity="0.6"/>
  </g>

  <!-- Table Surface -->
  <path d="M 20 185 L 220 185 L 205 215 L 35 215 Z" fill="url(#floorGrad)" filter="url(#shadow)"/>
  <path d="M 20 185 L 220 185" stroke="#475569" stroke-width="2"/>

  <!-- Secondary Prop: Clipboard with Checklist (Proof / Confirmation) -->
  <g transform="translate(35, 120) rotate(-12)" filter="url(#shadow)">
    <!-- Board -->
    <rect x="0" y="0" width="45" height="55" rx="4" fill="#cbd5e1"/>
    <!-- Paper -->
    <rect x="4" y="6" width="37" height="45" rx="2" fill="#f8fafc"/>
    <!-- Clip -->
    <rect x="15" y="-2" width="15" height="6" rx="2" fill="#64748b"/>
    <!-- Checkmarks / Lines -->
    <line x1="10" y1="16" x2="20" y2="22" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="19" x2="35" y2="19" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="10" y1="28" x2="16" y2="33" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="30" x2="33" y2="30" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <line x1="10" y1="40" x2="16" y2="45" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="42" x2="30" y2="42" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Secondary Prop: Glowing Compass / Target (Direction & Certainty) -->
  <g transform="translate(170, 130) rotate(15)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="#0f172a"/>
    <!-- Compass needle pointing decisively UP -->
    <polygon points="0,-15 -4,2 0,5 4,2" fill="#f59e0b"/>
    <polygon points="0,15 -4,-2 0,-5 4,-2" fill="#94a3b8"/>
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
  </g>

  <!-- MAIN SUBJECT: The Magnifying Glass ("Investigating & Confirming") -->
  <!-- Glowing aura behind the lens -->
  <circle cx="120" cy="105" r="48" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- Handle (angled dynamically) -->
    <rect x="135" y="125" width="60" height="16" rx="8" transform="rotate(45 135 125)" fill="#b45309"/>
    <rect x="135" y="127" width="56" height="12" rx="6" transform="rotate(45 135 125)" fill="#f59e0b"/>
    <!-- Handle Grip Lines -->
    <line x1="155" y1="145" x2="165" y2="155" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <line x1="165" y1="135" x2="175" y2="145" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <line x1="175" y1="125" x2="185" y2="135" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

    <!-- Lens Rim (Outer Metallic Frame) -->
    <circle cx="105" cy="95" r="46" fill="#475569"/>
    <circle cx="105" cy="95" r="42" fill="#0f172a"/>

    <!-- Glass Interior (Reflective surface) -->
    <circle cx="105" cy="95" r="38" fill="#1e293b"/>
    
    <!-- Lens reflection highlight -->
    <path d="M 75 75 A 38 38 0 0 1 135 65 A 42 42 0 0 0 80 85 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Contents Viewed Through Lens: The "Definite / Verified" Green Checkmark Stamp -->
    <g transform="translate(105, 95)">
      <!-- Checkmark Background Pulse -->
      <circle cx="0" cy="0" r="24" fill="#10b981" opacity="0.2"/>
      
      <!-- Big Bold Glowing Checkmark (Representing "肯定" - Definitely/Confirmed) -->
      <path d="M -12 0 L -4 10 L 14 -10" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <path d="M -12 0 L -4 10 L 14 -10" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Metallic Rim Specular Highlight -->
    <path d="M 70 70 A 46 46 0 0 1 140 70" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles (Action & Clarity) -->
  <g filter="url(#glow)">
    <!-- Sparkle 1 -->
    <path d="M 95 45 Q 95 55 85 55 Q 95 55 95 65 Q 95 55 105 55 Q 95 55 95 45 Z" fill="#fbbf24"/>
    <!-- Sparkle 2 -->
    <path d="M 160 80 Q 160 86 154 86 Q 160 86 160 92 Q 160 86 166 86 Q 160 86 160 80 Z" fill="#38bdf8"/>
    <!-- Sparkle 3 -->
    <path d="M 75 140 Q 75 145 70 145 Q 75 145 75 150 Q 75 145 80 145 Q 75 145 75 140 Z" fill="#10b981"/>
  </g>
</svg>