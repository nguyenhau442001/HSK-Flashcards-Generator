<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Atmospheric Steam/Gradient Glow -->
  <circle cx="120" cy="120" r="90" fill="#1e293b" opacity="0.6"/>

  <defs>
    <!-- Tile Pattern -->
    <pattern id="wall-tiles" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#1e293b"/>
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="1.5"/>
    </pattern>
    <!-- Water Shimmer Gradient -->
    <linearGradient id="water-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- Tub Gradient -->
    <linearGradient id="tub-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bubble-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Bathroom Wall Background with Tiles -->
  <rect x="0" y="0" width="240" height="190" fill="url(#wall-tiles)"/>
  
  <!-- Bathroom Floor -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- Shower Fixture mounted on wall -->
  <path d="M 120 20 L 120 60" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 110 20 L 130 20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Shower Head -->
  <path d="M 105 16 L 135 16 L 140 22 L 100 22 Z" fill="#64748b"/>
  
  <!-- Water Streams (Dotted/Dashed lines) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="110" y1="26" x2="100" y2="90" stroke-dasharray="4 6"/>
    <line x1="115" y1="26" x2="110" y2="95" stroke-dasharray="6 4"/>
    <line x1="120" y1="26" x2="120" y2="100" stroke-dasharray="5 5"/>
    <line x1="125" y1="26" x2="130" y2="95" stroke-dasharray="4 6"/>
    <line x1="130" y1="26" x2="140" y2="90" stroke-dasharray="6 4"/>
  </g>

  <!-- Steam Clouds Rising -->
  <g fill="#94a3b8" opacity="0.15">
    <circle cx="85" cy="45" r="12"/>
    <circle cx="95" cy="35" r="16"/>
    <circle cx="155" cy="45" r="14"/>
    <circle cx="145" cy="30" r="18"/>
  </g>

  <!-- Bathtub Back Rim -->
  <path d="M 50 140 L 190 140 C 205 140 215 150 215 160 C 215 170 205 180 190 180 L 50 180 C 35 180 25 170 25 160 C 25 150 35 140 50 140 Z" fill="#e2e8f0"/>

  <!-- Bathtub Interior / Water -->
  <ellipse cx="120" cy="160" rx="90" ry="18" fill="url(#water-grad)"/>

  <!-- Character relaxing in tub -->
  <g id="character">
    <!-- Head / Face Profile or Front Cute style -->
    <circle cx="120" cy="115" r="22" fill="#ffedd5"/>
    <!-- Closed Happy Eyes (Blinking/Relaxing) -->
    <path d="M 112 114 Q 116 118 120 114" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
    <path d="M 120 114 Q 124 118 128 114" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
    <!-- Cute Cheeks -->
    <circle cx="109" cy="120" r="3" fill="#fda4af" opacity="0.8"/>
    <circle cx="131" cy="120" r="3" fill="#fda4af" opacity="0.8"/>
    <!-- Happy Smile -->
    <path d="M 117 122 Q 120 125 123 122" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Foam / Bubbles around neck -->
    <circle cx="120" cy="138" r="12" fill="url(#bubble-grad)"/>
    <circle cx="105" cy="135" r="10" fill="url(#bubble-grad)"/>
    <circle cx="135" cy="135" r="10" fill="url(#bubble-grad)"/>
    <circle cx="95" cy="142" r="8" fill="url(#bubble-grad)"/>
    <circle cx="145" cy="142" r="8" fill="url(#bubble-grad)"/>
    <circle cx="112" cy="145" r="9" fill="url(#bubble-grad)"/>
    <circle cx="128" cy="145" r="9" fill="url(#bubble-grad)"/>

    <!-- Relaxing Arms resting on tub edge -->
    <path d="M 98 135 C 85 135 75 145 75 150" fill="none" stroke="#ffedd5" stroke-width="8" stroke-linecap="round"/>
    <path d="M 142 135 C 155 135 165 145 165 150" fill="none" stroke="#ffedd5" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Big Floating Suds and Bubbles in Tub -->
  <circle cx="80" cy="155" r="10" fill="url(#bubble-grad)"/>
  <circle cx="165" cy="155" r="12" fill="url(#bubble-grad)"/>
  <circle cx="100" cy="168" r="9" fill="url(#bubble-grad)"/>
  <circle cx="140" cy="165" r="11" fill="url(#bubble-grad)"/>
  <circle cx="65" cy="162" r="7" fill="url(#bubble-grad)" opacity="0.8"/>
  <circle cx="175" cy="162" r="8" fill="url(#bubble-grad)" opacity="0.8"/>

  <!-- Bathtub Front Outer Body -->
  <path d="M 30 160 C 30 190 50 195 120 195 C 190 195 210 190 210 160 L 215 185 C 215 200 190 205 120 205 C 50 205 25 200 25 185 Z" fill="url(#tub-grad)" opacity="0.3"/>
  <path d="M 28 160 C 28 190 48 198 120 198 C 192 198 212 190 212 160" fill="none" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Duck Toy Floating in Tub -->
  <g transform="translate(60, 150) scale(0.8)">
    <path d="M 10 15 Q 10 5 22 5 Q 32 5 32 15 Q 32 22 20 22 Q 10 22 10 15 Z" fill="#fbbf24"/>
    <circle cx="26" cy="10" r="2" fill="#0f172a"/>
    <path d="M 32 12 C 37 12 37 16 32 16 Z" fill="#fb923c"/>
    <path d="M 8 18 C 5 18 2 20 5 24 C 15 24 25 24 25 22 C 25 20 20 18 15 18 Z" fill="#fbbf24"/>
  </g>

  <!-- Bathroom Shelf on Left Wall -->
  <rect x="25" y="70" width="35" height="4" rx="2" fill="#64748b"/>
  <!-- Shampoo Bottle -->
  <rect x="32" y="50" width="12" height="20" rx="3" fill="#ec4899"/>
  <path d="M 36 50 L 36 46 L 40 46 L 40 50 Z" fill="#cbd5e1"/>
  <!-- Soap Bar with Bubble -->
  <rect x="47" y="58" width="10" height="6" rx="3" fill="#34d399"/>
  <circle cx="52" cy="55" r="4" fill="url(#bubble-grad)"/>

  <!-- Rubber Duck / Extra floating bubbles -->
  <circle cx="185" cy="145" r="4" fill="url(#bubble-grad)"/>
  <circle cx="195" cy="152" r="3" fill="url(#bubble-grad)"/>

</svg>