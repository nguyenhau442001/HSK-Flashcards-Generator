<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Stage Floor Gradient -->
    <linearGradient id="stageGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Spotlight Beam Gradient -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Gold Trophy Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="outfitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background details: floating confetti/stars -->
  <g fill="#38bdf8" opacity="0.3">
    <circle cx="35" cy="50" r="2" />
    <circle cx="205" cy="40" r="3" />
    <rect x="25" y="120" width="4" height="4" transform="rotate(45 27 122)" />
    <rect x="210" y="130" width="5" height="3" transform="rotate(20 212 131)" />
  </g>
  <g fill="#fbbf24" opacity="0.4">
    <circle cx="70" cy="30" r="2.5" />
    <circle cx="180" cy="70" r="2" />
    <rect x="195" y="90" width="4" height="4" transform="rotate(15 197 92)" />
  </g>

  <!-- Spotlight Cone -->
  <polygon points="120,0 60,200 180,200" fill="url(#spotlight)" />

  <!-- Stage Floor & Backwall boundary -->
  <path d="M 30,195 Q 120,185 210,195 L 225,225 Q 120,235 15,225 Z" fill="url(#stageGrad)" />
  <!-- Stage edge highlight -->
  <path d="M 30,195 Q 120,185 210,195" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Background Props: Microphone Stand & Curtains -->
  <!-- Microphone Stand -->
  <line x1="85" y1="200" x2="85" y2="120" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="85" cy="118" r="5" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
  <circle cx="85" cy="118" r="2" fill="#38bdf8" />
  <ellipse cx="85" cy="200" rx="14" ry="4" fill="#0f172a" stroke="#475569" stroke-width="1" />

  <!-- Secondary Prop: Floating Star/Award icon representing achievement -->
  <g transform="translate(180, 75) scale(0.9)" filter="url(#glow)">
    <polygon points="12,2 15,9 23,10 17,15 19,22 12,18 5,22 7,15 1,10 9,9" fill="#fbbf24" />
  </g>

  <!-- Main Subject: Performing Character (Expressive & Action-packed) -->
  <g id="character">
    <!-- Shadow beneath character -->
    <ellipse cx="135" cy="202" rx="18" ry="6" fill="#020617" opacity="0.7" />

    <!-- Left Leg (Dynamic step-out pose) -->
    <path d="M 125,160 L 110,195 L 98,198" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 98,198 L 92,198" stroke="#1e293b" stroke-width="5" stroke-linecap="round" fill="none" /> <!-- shoe -->

    <!-- Right Leg (Grounded) -->
    <path d="M 140,160 L 150,195 L 162,197" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 162,197 L 168,197" stroke="#1e293b" stroke-width="5" stroke-linecap="round" fill="none" /> <!-- shoe -->

    <!-- Torso -->
    <path d="M 120,115 C 120,115 125,105 135,105 C 145,105 152,115 152,115 L 148,165 C 148,165 136,170 126,165 Z" fill="url(#outfitGrad)" />
    <!-- Outfit star accent -->
    <polygon points="136,128 138,133 143,134 139,138 140,143 136,140 131,143 133,138 128,134 133,133" fill="#fbbf24" />

    <!-- Left Arm (Reaching out energetically, holding notes/sparkles) -->
    <path d="M 124,115 L 100,105 L 85,90" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Hand -->
    <circle cx="83" cy="88" r="4" fill="#fde68a" />

    <!-- Right Arm (Raised triumphantly holding trophy) -->
    <path d="M 148,115 L 175,100 L 182,75" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="183" cy="72" r="4" fill="#fde68a" />

    <!-- Trophy in Hand -->
    <g transform="translate(172, 38)">
      <!-- Trophy Base -->
      <rect x="7" y="28" width="8" height="5" rx="1" fill="#64748b" />
      <path d="M 5,33 L 17,33 L 15,36 L 7,36 Z" fill="#475569" />
      <!-- Trophy Stem -->
      <rect x="9" y="21" width="4" height="7" fill="url(#goldGrad)" />
      <!-- Trophy Cup -->
      <path d="M 5,7 C 5,7 4,20 11,21 C 18,20 17,7 17,7 Z" fill="url(#goldGrad)" />
      <!-- Cup Handles -->
      <path d="M 5,9 C 1,9 1,15 5,17" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M 17,9 C 21,9 21,15 17,17" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" />
      <!-- Trophy Glow/Sparkle -->
      <circle cx="11" cy="11" r="2" fill="#ffffff" opacity="0.7" />
    </g>

    <!-- Head & Expressive Face -->
    <circle cx="136" cy="82" r="16" fill="#fde68a" />
    <!-- Hair -->
    <path d="M 120,80 C 120,65 130,62 138,63 C 147,64 152,70 154,80 C 150,75 142,72 136,73 C 128,74 123,77 120,80 Z" fill="#334155" />
    <path d="M 124,73 C 124,73 129,66 136,66 C 142,66 148,70 148,70" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Eyes (Happy / Confident closed curve or gleaming eyes) -->
    <!-- Joyful arched eyes -->
    <path d="M 129,80 Q 133,76 137,80" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 139,80 Q 143,76 147,80" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Big Confident Open Smile -->
    <path d="M 132,87 Q 138,94 144,87" fill="#ef4444" stroke="#1e293b" stroke-width="1.5" />
    <!-- Rosy Cheeks -->
    <circle cx="127" cy="85" r="2.5" fill="#fb7185" opacity="0.6" />
    <circle cx="149" cy="85" r="2.5" fill="#fb7185" opacity="0.6" />
  </g>

  <!-- Foreground Atmospheric Elements (Action & Performance vibe) -->
  <!-- Music notes / celebration sparks floating around -->
  <g fill="#38bdf8" opacity="0.8">
    <!-- Note 1 -->
    <circle cx="65" cy="110" r="3" />
    <path d="M 68,110 L 68,98 L 74,96 L 74,106" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="71" cy="106" rx="3" ry="2" />
  </g>
  <g fill="#ec4899" opacity="0.8" transform="translate(30, 20)">
    <!-- Note 2 -->
    <circle cx="130" cy="130" r="2.5" />
    <path d="M 132,130 L 132,118 L 138,116 L 138,126" stroke="#ec4899" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing success aura behind the character -->
  <circle cx="136" cy="120" r="45" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />
</svg>