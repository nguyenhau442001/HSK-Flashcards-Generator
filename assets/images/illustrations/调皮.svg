<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Interior Living Room Environment -->
  <!-- Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#1e293b"/>
  <path d="M0 170 L240 170" stroke="#334155" stroke-width="2"/>
  
  <!-- Wallpaper Pattern / Wall -->
  <rect x="0" y="0" width="240" height="170" fill="#111827"/>
  
  <!-- Background Props: Window & Plant -->
  <rect x="150" y="30" width="60" height="80" rx="4" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <line x1="180" y1="30" x2="180" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="2"/>
  <path d="M160 90 Q170 50 190 60 Q205 70 200 90 Z" fill="#10b981" opacity="0.2"/>

  <!-- Bookshelf knocked over / Toy scattered props -->
  <rect x="20" y="90" width="35" height="70" rx="2" fill="#334155"/>
  <rect x="23" y="100" width="29" height="8" fill="#475569"/>
  <rect x="23" y="120" width="29" height="8" fill="#475569"/>
  <!-- Fallen books -->
  <rect x="55" y="150" width="16" height="12" rx="1" fill="#ec4899" transform="rotate(-30 55 150)"/>
  <rect x="70" y="155" width="18" height="10" rx="1" fill="#38bdf8" transform="rotate(15 70 155)"/>

  <!-- Main mischievous child character (Nghịch ngợm) -->
  <!-- Action: Standing on a stool, drawing on the wall with a marker, wearing a lampshade or funny hat -->
  
  <!-- Stool -->
  <g transform="translate(100, 130)">
    <line x1="0" y1="40" x2="10" y2="0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="30" y2="0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <rect x="5" y="-5" width="30" height="6" rx="3" fill="#f59e0b"/>
  </g>

  <!-- Child Body & Pose -->
  <!-- Legs -->
  <line x1="112" y1="135" x2="105" y2="160" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  <line x1="128" y1="135" x2="135" y2="160" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  <!-- Shoes -->
  <circle cx="103" cy="162" r="4" fill="#ec4899"/>
  <circle cx="137" cy="162" r="4" fill="#ec4899"/>

  <!-- Torso (Orange hoodie) -->
  <path d="M105 105 L135 105 L140 138 L100 138 Z" fill="#fb923c" rx="4"/>
  
  <!-- Mischievous Doodle on Wall (Red scribble) -->
  <path d="M125 50 Q135 40 145 55 T155 45" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <circle cx="138" cy="48" r="4" fill="#ef4444"/>

  <!-- Arms (Dynamic reaching out to draw) -->
  <path d="M132 110 L150 75" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  <!-- Hand holding marker -->
  <circle cx="152" cy="72" r="4" fill="#fcd34d"/>
  <rect x="150" y="65" width="8" height="4" rx="2" fill="#ef4444" transform="rotate(-45 150 65)"/>

  <!-- Other arm balancing -->
  <path d="M108 110 L90 100" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  <circle cx="88" cy="98" r="4" fill="#fcd34d"/>

  <!-- Head & Facial Expression (Playful, grinning) -->
  <circle cx="120" cy="80" r="16" fill="#fcd34d"/>
  
  <!-- Funny hat / Lampshade on head -->
  <path d="M108 68 L132 68 L140 55 L100 55 Z" fill="#38bdf8"/>
  <ellipse cx="120" cy="55" rx="20" ry="4" fill="#0284c7"/>

  <!-- Mischievous Face details -->
  <!-- Eyes: cheeky curved lines or winking -->
  <path d="M112 78 Q115 74 118 78" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M122 78 Q125 74 128 78" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Big mischievous grin -->
  <path d="M114 84 Q120 92 126 84" fill="#1e293b"/>
  <!-- Rosy cheeks -->
  <circle cx="110" cy="83" r="3" fill="#ec4899" opacity="0.6"/>
  <circle cx="130" cy="83" r="3" fill="#ec4899" opacity="0.6"/>

  <!-- Floating playful sparks/energy to emphasize "Nghịch ngợm" -->
  <circle cx="80" cy="60" r="3" fill="#fbbf24"/>
  <path d="M75 55 L85 65 M85 55 L75 65" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  
  <circle cx="170" cy="130" r="2.5" fill="#38bdf8"/>
  <path d="M166 126 L174 134 M174 126 L166 134" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

</svg>