<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(40, 40)">
    <!-- Table Surface -->
    <path d="M0 140 L160 140 L140 160 L-20 160 Z" fill="#334155"/>
    
    <!-- The Mirror Frame -->
    <rect x="30" y="10" width="100" height="120" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
    <rect x="38" y="18" width="84" height="104" rx="4" fill="#bae6fd"/>
    
    <!-- Reflection: A messy stack of papers/documents -->
    <g opacity="0.8">
      <rect x="50" y="40" width="60" height="10" rx="2" fill="#f1f5f9"/>
      <rect x="50" y="55" width="60" height="10" rx="2" fill="#f1f5f9"/>
      <rect x="50" y="70" width="60" height="10" rx="2" fill="#f1f5f9"/>
      <path d="M55 45 L105 45 M55 60 L105 60 M55 75 L105 75" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <!-- Real World Objects on Table -->
    <circle cx="20" cy="130" r="15" fill="#fbbf24"/>
    <path d="M120 120 L150 120 L145 140 L115 140 Z" fill="#ec4899"/>
    
    <!-- Light rays hitting the mirror -->
    <path d="M130 20 L160 10 M130 40 L170 30" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Shadow -->
    <ellipse cx="80" cy="165" rx="70" ry="10" fill="#0f172a" opacity="0.4"/>
  </g>
</svg>