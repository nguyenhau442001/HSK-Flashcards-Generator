<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="importantTaskGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment / Modern Office -->
  <!-- Window / City View outside -->
  <g opacity="0.4">
    <rect x="150" y="20" width="70" height="90" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <rect x="156" y="30" width="16" height="30" rx="2" fill="#38bdf8" opacity="0.2"/>
    <rect x="178" y="30" width="16" height="50" rx="2" fill="#38bdf8" opacity="0.3"/>
    <rect x="200" y="30" width="14" height="20" rx="2" fill="#38bdf8" opacity="0.1"/>
  </g>

  <!-- Bookshelf / Plants in background -->
  <rect x="20" y="30" width="45" height="85" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="20" y1="55" x2="65" y2="55" stroke="#334155" stroke-width="1.5"/>
  <line x1="20" y1="85" x2="65" y2="85" stroke="#334155" stroke-width="1.5"/>
  <!-- Plant on shelf -->
  <path d="M 35 55 Q 35 45 42 42 Q 49 45 49 55 Z" fill="#10b981"/>
  <path d="M 42 42 Q 40 32 32 30" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M 42 42 Q 48 34 56 32" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Office Desk -->
  <rect x="10" y="165" width="220" height="12" rx="4" fill="#334155"/>
  <path d="M 30 177 L 40 220 L 60 220 L 50 177 Z" fill="#1e293b"/>
  <path d="M 210 177 L 200 220 L 180 220 L 190 177 Z" fill="#1e293b"/>

  <!-- Computer Monitor & Stand -->
  <rect x="110" y="145" width="20" height="22" fill="#475569"/>
  <path d="M 95" y="167" L 145 167 L 150" stroke="#334155" stroke-width="3" fill="none"/>
  
  <rect x="70" y="80" width="100" height="70" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="75" y="85" width="90" height="60" rx="3" fill="url(#screenGlow)"/>
  
  <!-- UI Dashboard on Monitor (Visualizing "Items / 项") -->
  <!-- Item 1 (Dimmed) -->
  <rect x="83" y="93" width="74" height="10" rx="3" fill="#1e293b"/>
  <circle cx="89" cy="98" r="3" fill="#64748b"/>
  <rect x="96" y="96" width="30" height="4" rx="2" fill="#64748b"/>
  
  <!-- IMPORTANT ITEM (Highlighted "这一项" - The specific Item/Task) -->
  <rect x="81" y="107" width="78" height="18" rx="4" fill="url(#importantTaskGlow)" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="89" cy="116" r="4" fill="#f59e0b"/>
  <!-- Checkmark inside glowing item -->
  <path d="M 87 116 L 89 118 L 92 114" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="98" y="113" width="45" height="5" rx="2.5" fill="#fbbf24"/>
  <rect x="98" y="121" width="30" height="3" rx="1.5" fill="#f59e0b" opacity="0.7"/>
  <!-- Exclamation / Importance indicator badge -->
  <circle cx="152" cy="116" r="5" fill="#ef4444"/>
  <path d="M 152 113 L 152 117 M 152 119 L 152 120" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Item 3 (Dimmed) -->
  <rect x="83" y="129" width="74" height="10" rx="3" fill="#1e293b"/>
  <circle cx="89" cy="134" r="3" fill="#64748b"/>
  <rect x="96" y="132" width="25" height="4" rx="2" fill="#64748b"/>

  <!-- Floating Holographic / Highlight Effect connecting to the item -->
  <path d="M 120 126 C 120 135 140 140 155 130" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  <circle cx="155" cy="130" r="3" fill="#f59e0b"/>

  <!-- Coffee Mug Prop -->
  <rect x="185" y="145" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M 201 149 C 207 149 207 159 201 159" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 189 142 Q 191 137 189 132" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Main Character (Focused Professional pointing at the crucial task) -->
  <g transform="translate(0, 5)">
    <!-- Body / Torso -->
    <path d="M 105 180 C 105 160 125 155 135 155 C 145 155 165 160 165 180 L 175 220 L 95 220 Z" fill="#2563eb"/>
    <!-- Collar / Shirt -->
    <path d="M 125 155 L 135 168 L 145 155 Z" fill="#f8fafc"/>
    <path d="M 130 160 L 140 160" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Head & Hair -->
    <circle cx="135" cy="130" r="18" fill="#fbcfe8"/> <!-- Face base -->
    <path d="M 117 130 C 117 115 125 110 135 110 C 145 110 153 115 153 130 C 153 135 152 140 152 140 L 118 140 C 118 140 117 135 117 130 Z" fill="#334155"/> <!-- Hair -->
    
    <!-- Facial expression: focused, serious, attentive -->
    <circle cx="129" cy="128" r="2" fill="#1e293b"/>
    <circle cx="141" cy="128" r="2" fill="#1e293b"/>
    <!-- Eyebrows angled for focus -->
    <path d="M 126 124 L 132 125" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 138 125 L 144 124" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Determined mouth -->
    <path d="M 132 136 Q 135 138 138 136" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Pointing Arm (Emphasizing "This specific task/item") -->
    <!-- Upper body arm extension towards monitor -->
    <path d="M 155 165 Q 170 155 168 135" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <!-- Forearm & Index Finger pointing precisely at the highlighted task on screen -->
    <path d="M 168 135 L 145 118" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand/Finger detail -->
    <circle cx="143" cy="117" r="4" fill="#fbcfe8"/>
    <path d="M 143 117 L 132 116" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/> <!-- Pointing finger -->

    <!-- Other Arm resting / holding desk -->
    <path d="M 115 165 Q 105 180 110 190" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
    <circle cx="110" cy="192" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Foreground Atmospheric Elements / Glowing Focus Ring -->
  <circle cx="120" cy="116" r="18" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4" stroke-dasharray="4 2">
    <animateTransform attributeName="transform" type="rotate" from="0 120 116" to="360 120 116" dur="20s" repeatCount="indefinite"/>
  </circle>

</svg>