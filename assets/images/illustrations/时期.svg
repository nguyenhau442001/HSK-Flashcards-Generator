<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment / Room Interior -->
  <!-- Walls & Floor -->
  <path d="M0 0 H240 V170 H0 Z" fill="#1b2a4a"/>
  <path d="M0 170 H240 V240 H0 Z" fill="#0f172a"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- Window showing a distinct transitioning sky (symbolizing an extraordinary period/phase of time) -->
  <g transform="translate(145, 25)">
    <rect x="0" y="0" width="70" height="95" rx="4" fill="#0b0f19" stroke="#475569" stroke-width="4"/>
    <!-- Window pane inner -->
    <rect x="5" y="5" width="60" height="85" fill="#1e1b4b"/>
    <!-- Crescent Moon & Stars representing a special era/night -->
    <circle cx="20" cy="25" r="10" fill="#fbbf24"/>
    <circle cx="17" cy="22" r="9" fill="#1e1b4b"/>
    <circle cx="50" cy="40" r="1.5" fill="#e2e8f0"/>
    <circle cx="40" cy="65" r="1" fill="#e2e8f0"/>
    <circle cx="55" cy="70" r="1.5" fill="#e2e8f0"/>
    <!-- Window frame crossbars -->
    <line x1="35" y1="5" x2="35" y2="90" stroke="#475569" stroke-width="3"/>
    <line x1="5" y1="47" x2="65" y2="47" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- Dramatic Light Beam from Window -->
  <polygon points="145,25 215,25 240,240 100,240" fill="url(#lightBeam)"/>

  <!-- Bookshelf / Props in background -->
  <g transform="translate(20, 40)">
    <rect x="0" y="0" width="45" height="110" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="35" x2="45" y2="35" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="75" x2="45" y2="75" stroke="#334155" stroke-width="2"/>
    <!-- Books on shelf -->
    <rect x="6" y="15" width="8" height="20" rx="1" fill="#ec4899"/>
    <rect x="15" y="12" width="6" height="23" rx="1" fill="#38bdf8"/>
    <rect x="23" y="18" width="12" height="17" rx="1" fill="#10b981"/>
    <rect x="8" y="50" width="10" height="25" rx="1" fill="#fbbf24"/>
    <rect x="20" y="55" width="7" height="20" rx="1" fill="#f43f5e"/>
  </g>

  <!-- Foreground Desk -->
  <g transform="translate(60, 150)">
    <!-- Desk Top -->
    <rect x="0" y="0" width="150" height="12" rx="3" fill="#334155"/>
    <rect x="0" y="12" width="150" height="6" fill="#1e293b"/>
    <!-- Desk Legs -->
    <rect x="15" y="18" width="6" height="72" fill="#0f172a"/>
    <rect x="129" y="18" width="6" height="72" fill="#0f172a"/>

    <!-- Desk Items (representing study/work during this specific period) -->
    <!-- Lamp -->
    <path d="M110 0 L115 -25 L125 -25 L130 0 Z" fill="#fb923c"/>
    <circle cx="120" cy="-25" r="8" fill="#fbbf24"/>
    <!-- Laptop -->
    <path d="M50 0 L40 -12 H75 L70 0 Z" fill="#94a3b8"/>
    <rect x="44" y="-12" width="28" height="12" rx="1" fill="#cbd5e1"/>
    <!-- Calendar / Planner (highlighting a special timeline/period) -->
    <rect x="85" y="-10" width="16" height="12" rx="1" fill="#f8fafc"/>
    <line x1="88" y1="-6" x2="98" y2="-6" stroke="#ef4444" stroke-width="2"/>
    <line x1="88" y1="-2" x2="94" y2="-2" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Main Character (Focused, contemplative student/professional in a special life phase) -->
  <g transform="translate(85, 80)">
    <!-- Chair Back -->
    <rect x="20" y="10" width="30" height="65" rx="8" fill="#334155"/>

    <!-- Character Body & Torso -->
    <path d="M15 55 C15 35, 55 35, 55 55 L65 110 H5 Z" fill="#38bdf8"/>

    <!-- Arms resting on desk -->
    <path d="M15 65 Q 0 75, 10 90" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M55 65 Q 70 75, 60 90" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- Hands -->
    <circle cx="8" cy="92" r="5" fill="#fde047"/>
    <circle cx="62" cy="92" r="5" fill="#fde047"/>

    <!-- Neck -->
    <rect x="28" y="24" width="14" height="16" fill="#fde047"/>

    <!-- Head -->
    <circle cx="35" cy="15" r="18" fill="#fde047"/>

    <!-- Hair (Stylish, modern cut) -->
    <path d="M17 12 C17 -2, 53 -2, 53 12 C53 18, 48 12, 45 8 C42 4, 28 4, 23 8 C19 12, 17 8, 17 12 Z" fill="#0f172a"/>

    <!-- Facial Expression: Thoughtful / Focused -->
    <!-- Glasses (intellectual look) -->
    <rect x="22" y="8" width="11" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="37" y="8" width="11" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="33" y1="12" x2="37" y2="12" stroke="#0f172a" stroke-width="2"/>

    <!-- Gentle determined smile -->
    <path d="M31 22 Q 35 25, 39 22" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Potted Plant on Desk Corner for Warmth and Life Context -->
  <g transform="translate(160, 130)">
    <path d="M5 20 H19 L17 35 H7 Z" fill="#f43f5e"/>
    <!-- Leaves -->
    <path d="M12 20 Q 5 10, 0 15 Q 5 20, 12 20 Z" fill="#10b981"/>
    <path d="M12 20 Q 18 5, 24 10 Q 18 20, 12 20 Z" fill="#34d399"/>
    <path d="M12 20 Q 12 2, 12 -2 Q 12 8, 12 20 Z" fill="#059669"/>
  </g>

  <!-- Ambient glowing aura over the scene to emphasize the 'special/unique period' atmosphere -->
  <circle cx="120" cy="110" r="90" fill="url(#deskGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>
</svg>