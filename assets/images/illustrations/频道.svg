<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- TV Glow Gradient -->
    <radialGradient id="tvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Change Flash Effect -->
    <linearGradient id="screenGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="screenGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Character 1 Sweater Gradient -->
    <linearGradient id="sweater1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Character 2 Hoodie Gradient -->
    <linearGradient id="sweater2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Floor Details -->
  <!-- Ambient Room Lighting -->
  <path d="M0 0 H240 V165 L0 185 Z" fill="#1e293b" opacity="0.5"/>
  <!-- Wooden Floor Base -->
  <path d="M0 165 L240 185 V240 H0 Z" fill="#090d16"/>
  <path d="M0 185 H240" stroke="#1e293b" stroke-width="2"/>

  <!-- Living Room Props: Bookshelf / Plant in Background -->
  <rect x="195" y="80" width="30" height="85" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="200" y="90" width="20" height="12" rx="2" fill="#f59e0b" opacity="0.7"/>
  <rect x="200" y="108" width="20" height="15" rx="2" fill="#38bdf8" opacity="0.7"/>
  <rect x="200" y="128" width="20" height="10" rx="2" fill="#ec4899" opacity="0.7"/>

  <!-- Potted Plant -->
  <path d="M210 165 C210 155 225 155 225 165 Z" fill="#64748b"/>
  <path d="M217.5 155 Q210 140 205 130" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M217.5 155 Q225 135 230 125" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M217.5 155 Q218 130 217.5 120" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- TV Unit & Television (Centerpiece) -->
  <rect x="45" y="145" width="150" height="20" rx="3" fill="#334155" filter="url(#shadow)"/>
  <rect x="90" y="155" width="60" height="10" fill="#1e293b"/>

  <!-- TV Screen Outer Frame -->
  <rect x="55" y="50" width="130" height="95" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- TV Screen Glow Backdrop -->
  <circle cx="120" cy="97" r="65" fill="url(#tvGlow)"/>

  <!-- TV Inner Screen Content (Dynamic / Changing Channel Graphics) -->
  <rect x="63" y="58" width="114" height="79" rx="4" fill="url(#screenGrad1)"/>
  
  <!-- Abstract TV Show Content (Mountain/Sun landscape changing) -->
  <path d="M63 110 L95 85 L120 105 L150 75 L177 105 V137 H63 Z" fill="#0284c7" opacity="0.6"/>
  <circle cx="150" cy="78" r="10" fill="#fbbf24"/>
  <!-- Dynamic Channel Switch Element: Pause/Zap Lines -->
  <path d="M75 70 L90 85 M165 70 L150 85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Remote Control in Air (Action indicator) -->
  <g transform="translate(142, 100) rotate(-25)">
    <rect x="0" y="0" width="14" height="36" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="7" cy="7" r="2.5" fill="#ef4444"/>
    <rect x="3.5" y="12" width="7" height="4" rx="1" fill="#94a3b8"/>
    <rect x="3.5" y="18" width="7" height="4" rx="1" fill="#94a3b8"/>
    <rect x="3.5" y="24" width="7" height="8" rx="1" fill="#38bdf8"/>
  </g>
  <!-- Infrared Signal Waves from Remote -->
  <path d="M158 95 C162 90 162 80 158 75" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M162 98 C168 90 168 78 162 70" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Sofa / Couch -->
  <path d="M15 175 C15 155 35 150 70 150 H170 C205 150 225 155 225 175 V205 C225 215 215 220 205 220 H35 C25 220 15 215 15 205 Z" fill="#3b82f6" filter="url(#shadow)"/>
  <!-- Sofa Cushions Highlight -->
  <path d="M25 160 H120 V205 H25 Z" fill="#2563eb" opacity="0.6" rx="8"/>
  <path d="M125 160 H215 V205 H125 Z" fill="#2563eb" opacity="0.6" rx="8"/>
  <!-- Sofa Armrests -->
  <path d="M15 145 C15 135 30 135 35 155 V215 C35 220 25 220 20 215 C15 210 15 190 15 175 Z" fill="#1d4ed8"/>
  <path d="M225 145 C225 135 210 135 205 155 V215 C205 220 215 220 220 215 C225 210 225 190 225 175 Z" fill="#1d4ed8"/>

  <!-- Character 1 (Left: Pointing / Requesting to change channel) -->
  <g transform="translate(25, 95)" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M25 55 C25 40 40 35 50 55 L60 95 H15 Z" fill="url(#sweater1)"/>
    <!-- Collar -->
    <path d="M35 35 Q45 42 55 35" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Head & Hair -->
    <circle cx="45" cy="22" r="16" fill="#fde047"/>
    <!-- Hair Style (Stylized Bob) -->
    <path d="M29 22 C29 10 40 6 47 6 C56 6 62 14 62 25 L61 30 C53 26 38 28 29 22 Z" fill="#92400e"/>
    
    <!-- Face Expression (Engaged / Speaking / Pointing) -->
    <!-- Eyes -->
    <circle cx="40" cy="21" r="2" fill="#1e293b"/>
    <circle cx="50" cy="21" r="2" fill="#1e293b"/>
    <!-- Eyebrows (slightly expressive) -->
    <path d="M38 17 L43 18" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M48 18 L53 17" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Open Mouth (Talking: "换一个频道") -->
    <path d="M43 27 Q45 31 48 27 Z" fill="#991b1b"/>

    <!-- Left Arm & Hand Pointing Forward to TV -->
    <path d="M25 60 L10 75 L30 85" stroke="#e11d48" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="5" cy="78" r="5" fill="#fde047"/>
  </g>

  <!-- Character 2 (Right: Holding Remote, Reacting / Relaxing on couch) -->
  <g transform="translate(125, 90)" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M25 50 C25 35 40 35 55 50 L65 100 H15 Z" fill="url(#sweater2)"/>
    <!-- Hoodie Strings -->
    <path d="M35 45 L37 60" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round"/>
    <path d="M45 45 L43 60" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <circle cx="40" cy="20" r="16" fill="#fed7aa"/>
    <!-- Hair Style (Messy modern cut) -->
    <path d="M24 20 C24 8 35 4 44 5 C54 6 57 15 57 24 L54 22 C50 14 36 12 30 18 Z" fill="#334155"/>

    <!-- Face Expression (Surprised / Accommodating) -->
    <circle cx="35" cy="19" r="2" fill="#1e293b"/>
    <circle cx="45" cy="19" r="2" fill="#1e293b"/>
    <!-- Surprised open mouth O -->
    <circle cx="40" cy="26" r="3" fill="#7c3aed"/>

    <!-- Right Arm holding remote towards center -->
    <path d="M52 55 L70 70 L55 85" stroke="#7c3aed" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="73" cy="72" r="5" fill="#fed7aa"/>
  </g>

  <!-- Foreground Atmospheric Elements (Warm cozy indoor lighting touches) -->
  <circle cx="120" cy="20" r="3" fill="#fde047" opacity="0.6"/>
  <circle cx="40" cy="30" r="2" fill="#fde047" opacity="0.4"/>
  <circle cx="200" cy="40" r="2" fill="#fde047" opacity="0.5"/>

</svg>