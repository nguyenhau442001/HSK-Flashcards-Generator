<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Main Subject: A stylized, glowing radio tower broadcasting waves -->
  <g transform="translate(120, 120)">
    <!-- Broadcasting Waves -->
    <path d="M 20 -20 A 40 40 0 0 1 20 60" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 35 -35 A 70 70 0 0 1 35 75" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M 50 -50 A 100 100 0 0 1 50 90" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" opacity="0.2"/>
    
    <!-- Tower Base -->
    <path d="M -10 80 L 10 80 L 5 0 L -5 0 Z" fill="#64748b"/>
    <rect x="-15" y="80" width="30" height="10" rx="2" fill="#475569"/>
    
    <!-- Antenna Top -->
    <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
    <rect x="-2" y="-20" width="4" height="20" fill="#94a3b8"/>
    
    <!-- Surrounding Context: Stylized houses/buildings receiving the signal -->
    <rect x="-90" y="40" width="30" height="40" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="-95,40 -75,20 -55,40" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    
    <rect x="60" y="50" width="30" height="30" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <polygon points="55,50 75,30 95,50" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    
    <!-- Decorative elements representing widespread reach -->
    <circle cx="-60" cy="-30" r="4" fill="#ec4899"/>
    <circle cx="70" cy="-40" r="5" fill="#38bdf8"/>
    <circle cx="-30" cy="-60" r="3" fill="#fbbf24"/>
  </g>
</svg>