<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Road Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 175 L240 175" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Car 1 (Back view) -->
  <g transform="translate(140, 165)">
    <rect x="0" y="0" width="60" height="40" rx="5" fill="#ec4899"/>
    <rect x="10" y="5" width="40" height="15" rx="2" fill="#0f172a"/>
    <circle cx="15" cy="40" r="8" fill="#1e293b"/>
    <circle cx="45" cy="40" r="8" fill="#1e293b"/>
    <rect x="15" y="15" width="30" height="10" fill="#fb923c" opacity="0.8"/>
  </g>
  
  <!-- Car 2 (Side view) -->
  <g transform="translate(20, 155)">
    <rect x="0" y="0" width="70" height="45" rx="5" fill="#38bdf8"/>
    <rect x="10" y="5" width="25" height="15" rx="2" fill="#0f172a"/>
    <rect x="40" y="5" width="20" height="15" rx="2" fill="#0f172a"/>
    <circle cx="15" cy="45" r="8" fill="#1e293b"/>
    <circle cx="55" cy="45" r="8" fill="#1e293b"/>
  </g>

  <!-- Character in Car 2 -->
  <g transform="translate(30, 140)">
    <circle cx="15" cy="15" r="10" fill="#fde68a"/>
    <path d="M10 15 Q15 20 20 15" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="12" y="25" width="6" height="15" fill="#fbbf24"/>
  </g>

  <!-- Phone in hand -->
  <rect x="55" y="155" width="15" height="25" rx="2" fill="#f59e0b"/>
  
  <!-- Traffic Light -->
  <g transform="translate(200, 40)">
    <rect x="0" y="0" width="20" height="50" rx="5" fill="#334155"/>
    <circle cx="10" cy="15" r="6" fill="#ef4444"/>
    <circle cx="10" cy="35" r="6" fill="#1e293b"/>
  </g>
  
  <!-- Street Lamp -->
  <path d="M220 240 L220 80 L200 80" stroke="#94a3b8" stroke-width="4" fill="none"/>
  <circle cx="200" cy="80" r="10" fill="#fbbf24" opacity="0.3"/>
</svg>