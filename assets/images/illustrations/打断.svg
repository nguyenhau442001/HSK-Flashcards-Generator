<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="60" fill="#334155"/>
  <rect x="190" y="175" width="10" height="60" fill="#334155"/>
  
  <!-- Character 1 (Speaker) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24"/>
    <path d="M10 35 Q20 45 30 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="2" fill="#0f172a"/>
    <circle cx="28" cy="15" r="2" fill="#0f172a"/>
    <rect x="5" y="50" width="30" height="80" rx="5" fill="#38bdf8"/>
    <!-- Speech Bubble -->
    <path d="M-20 -20 L-60 -20 L-60 -50 L-20 -50 L-20 -35 L-10 -30 L-20 -25" fill="#f1f5f9"/>
    <circle cx="-50" cy="-35" r="3" fill="#38bdf8"/>
    <circle cx="-40" cy="-35" r="3" fill="#38bdf8"/>
    <circle cx="-30" cy="-35" r="3" fill="#38bdf8"/>
  </g>
  
  <!-- Character 2 (Interrupter) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="20" fill="#ec4899"/>
    <path d="M10 35 Q20 30 30 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="2" fill="#0f172a"/>
    <circle cx="28" cy="15" r="2" fill="#0f172a"/>
    <rect x="5" y="50" width="30" height="80" rx="5" fill="#fb923c"/>
    <!-- Hand raised to interrupt -->
    <rect x="35" y="30" width="20" height="10" rx="2" fill="#fb923c"/>
    <path d="M55 35 L70 20" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Stop Symbol (Abstracted gesture context) -->
  <circle cx="120" cy="60" r="15" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="4 4"/>
  <line x1="110" y1="50" x2="130" y2="70" stroke="#ef4444" stroke-width="4"/>
</svg>