<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Night-Mode Richness -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Warm Ambient Glow (Vanity Mirror Light) -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  <circle cx="120" cy="90" r="45" fill="#334155" opacity="0.4"/>
  
  <!-- Mirror / Dressing Table Setting Background -->
  <!-- Vanity Mirror Frame (Soft glowing arch) -->
  <path d="M75,55 C75,25 165,25 165,55 L165,130 L75,130 Z" fill="#334155" opacity="0.3"/>
  <path d="M80,58 C80,32 160,32 160,58 L160,127 L80,127 Z" fill="#0f172a"/>
  
  <!-- Reflection/Warm Glow on Mirror -->
  <path d="M95,50 C110,40 135,40 150,50 C140,80 100,80 95,50 Z" fill="#f59e0b" opacity="0.08"/>

  <!-- Vanity Table Surface -->
  <rect x="40" y="170" width="160" height="8" rx="4" fill="#334155"/>
  <path d="M50,178 L190,178 L180,210 L60,210 Z" fill="#1e293b"/>

  <!-- Context Props on Table (Perfume bottle, small dish) -->
  <!-- Perfume Bottle -->
  <rect x="160" y="145" width="16" height="25" rx="3" fill="#cbd5e1" opacity="0.5"/>
  <rect x="164" y="138" width="8" height="7" fill="#fbbf24" opacity="0.8"/>
  <!-- Makeup tray -->
  <ellipse cx="75" cy="172" rx="15" ry="4" fill="#475569" opacity="0.6"/>

  <!-- Character: Woman looking in the mirror / admiring her necklace -->
  <!-- Shoulders & Torso -->
  <path d="M75,210 C75,160 90,140 120,140 C150,140 165,160 165,210 Z" fill="#ec4899" opacity="0.9"/>
  <!-- Collarbone area -->
  <path d="M95,148 C108,157 132,157 145,148" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- THE SILVER NECKLACE (Target Vocabulary Visualized Clearly) -->
  <!-- Necklace Chain (Shimmering Silver) -->
  <path d="M102,152 C110,172 130,172 138,152" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M103,153 C110,171 130,171 137,153" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <!-- Necklace Pendant (Shiny Silver Gem/Drop) -->
  <circle cx="120" cy="164" r="4.5" fill="#cbd5e1"/>
  <circle cx="120" cy="164" r="3" fill="#ffffff"/>
  <path d="M119,162 L121,162 L121,166 L119,166 Z" fill="#94a3b8" opacity="0.5"/>
  <!-- Pendant Sparkle -->
  <path d="M120,157 L121,161 L125,164 L121,167 L120,171 L119,167 L115,164 L119,161 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Neck -->
  <path d="M107,125 L107,146 C107,150 133,150 133,146 L133,125 Z" fill="#fbcfe8" opacity="0.9"/>

  <!-- Head & Face -->
  <ellipse cx="120" cy="102" rx="26" ry="30" fill="#fbcfe8"/>

  <!-- Hair (Stylish Dark Bob / Flowing Hair) -->
  <!-- Back Hair -->
  <path d="M90,85 C85,120 95,145 110,150 C100,130 98,105 102,90 Z" fill="#0f172a"/>
  <path d="M150,85 C155,120 145,145 130,150 C140,130 142,105 138,90 Z" fill="#0f172a"/>
  <!-- Fringe / Top Hair -->
  <path d="M94,95 C90,75 105,65 120,66 C135,65 150,75 146,95 C140,82 125,78 120,78 C115,78 100,82 94,95 Z" fill="#1e293b"/>
  <!-- Side strands framing face -->
  <path d="M94,93 C92,110 97,125 104,135 C101,120 98,105 96,93 Z" fill="#1e293b"/>
  <path d="M146,93 C148,110 143,125 136,135 C139,120 142,105 144,93 Z" fill="#1e293b"/>

  <!-- Facial Features (Delighted, Gentle Expression) -->
  <!-- Cheeks (Blush) -->
  <ellipse cx="107" cy="110" rx="4" ry="2.5" fill="#f43f5e" opacity="0.3"/>
  <ellipse cx="133" cy="110" rx="4" ry="2.5" fill="#f43f5e" opacity="0.3"/>
  
  <!-- Eyes (Happy, Looking down slightly at the necklace or smiling) -->
  <path d="M106,102 C109,99 113,99 116,102" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M124,102 C127,99 131,99 134,102" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Gentle Smile -->
  <path d="M115,114 C118,118 122,118 125,114" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Hands gently touching / admiring the silver necklace -->
  <!-- Left Hand -->
  <path d="M105,155 C95,160 92,170 98,175 C104,180 112,165 108,158 Z" fill="#fbcfe8"/>
  <!-- Right Hand -->
  <path d="M135,155 C145,160 148,170 142,175 C136,180 128,165 132,158 Z" fill="#fbcfe8"/>
  <!-- Fingernails/Details -->
  <circle cx="98" cy="173" r="1.5" fill="#fda4af"/>
  <circle cx="142" cy="173" r="1.5" fill="#fda4af"/>

  <!-- Ambient Light Sparkles (Enhancing the 'Silver' gleam and premium mood) -->
  <path d="M65,80 L66,85 L71,86 L66,87 L65,92 L64,87 L59,86 L64,85 Z" fill="#fbbf24" opacity="0.6"/>
  <path d="M175,95 L176,98 L179,99 L176,100 L175,103 L174,100 L171,99 L174,98 Z" fill="#38bdf8" opacity="0.6"/>
  <circle cx="155" cy="65" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="85" cy="135" r="1.5" fill="#ffffff" opacity="0.6"/>
</svg>