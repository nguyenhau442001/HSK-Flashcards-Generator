<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Background Elements (Warehouse/Workshop Interior) -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="120" cy="110" r="80" fill="#1e293b" opacity="0.5"/>
  
  <!-- Subtle Glowing Energy/Effort Auras -->
  <circle cx="120" cy="115" r="50" fill="#f59e0b" opacity="0.08" />
  <path d="M70 120 C 70 80, 170 80, 170 120" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Wooden Heavy Crate / Box (Context for 'sức lực' - needing strength to lift) -->
  <g transform="translate(60, 100)">
    <!-- Crate Base Shadow -->
    <ellipse cx="60" cy="65" rx="55" ry="12" fill="#090d16" opacity="0.6"/>
    
    <!-- Crate Back/Side depth -->
    <rect x="10" y="10" width="100" height="50" rx="4" fill="#92400e"/>
    
    <!-- Crate Front Face -->
    <rect x="5" y="15" width="110" height="50" rx="4" fill="#b45309"/>
    
    <!-- Wooden Planks Texture -->
    <line x1="5" y1="40" x2="115" y2="40" stroke="#78350f" stroke-width="3"/>
    <line x1="35" y1="15" x2="35" y2="65" stroke="#78350f" stroke-width="2"/>
    <line x1="85" y1="15" x2="85" y2="65" stroke="#78350f" stroke-width="2"/>
    
    <!-- Metal Reinforcement Brackets -->
    <path d="M5 15 L20 15 L20 30 L5 30 Z" fill="#64748b"/>
    <path d="M100 15 L115 15 L115 30 L100 30 Z" fill="#64748b"/>
    <path d="M5 50 L20 50 L20 65 L5 65 Z" fill="#64748b"/>
    <path d="M100 50 L115 50 L115 65 L100 65 Z" fill="#64748b"/>
    <circle cx="12" cy="22" r="1.5" fill="#cbd5e1"/>
    <circle cx="108" cy="22" r="1.5" fill="#cbd5e1"/>
    <circle cx="12" cy="57" r="1.5" fill="#cbd5e1"/>
    <circle cx="108" cy="57" r="1.5" fill="#cbd5e1"/>

    <!-- Heavy metallic warning stripes or stencil on crate -->
    <rect x="50" y="28" width="20" height="10" rx="2" fill="#d97706" opacity="0.5"/>
  </g>

  <!-- Energetic Action Effects (Showing Strain/Power/Effort) -->
  <!-- Muscle/Power Sparkle indicators -->
  <path d="M 50 85 Q 60 75 70 85 Q 60 95 50 85 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 170 85 Q 180 75 190 85 Q 180 95 170 85 Z" fill="#38bdf8" opacity="0.8"/>
  
  <!-- Sweating / Exertion droplets flying -->
  <path d="M 85 70 C 85 65 90 60 90 60 C 90 60 95 65 95 70 C 95 73 93 75 90 75 C 87 75 85 73 85 70 Z" fill="#38bdf8"/>
  <path d="M 145 70 C 145 65 150 60 150 60 C 150 60 155 65 155 70 C 155 73 153 75 150 75 C 147 75 145 73 145 70 Z" fill="#38bdf8"/>

  <!-- Hands gripping the crate, demonstrating physical strength (sức lực) -->
  <!-- Left Hand -->
  <g transform="translate(60, 95)">
    <path d="M15 15 C 5 15, -5 25, 0 35 C 5 45, 15 45, 20 35 L18 20 Z" fill="#fcd34d"/>
    <!-- Fingers wrapped over edge -->
    <rect x="10" y="8" width="8" height="14" rx="3" fill="#f59e0b"/>
    <rect x="20" y="8" width="8" height="14" rx="3" fill="#f59e0b"/>
    <rect x="30" y="8" width="8" height="14" rx="3" fill="#f59e0b"/>
  </g>

  <!-- Right Hand -->
  <g transform="translate(130, 95)">
    <path d="M15 15 C 25 15, 35 25, 30 35 C 25 45, 15 45, 10 35 L12 20 Z" fill="#fcd34d"/>
    <!-- Fingers wrapped over edge -->
    <rect x="22" y="8" width="8" height="14" rx="3" fill="#f59e0b"/>
    <rect x="12" y="8" width="8" height="14" rx="3" fill="#f59e0b"/>
    <rect x="2" y="8" width="8" height="14" rx="3" fill="#f59e0b"/>
  </g>

  <!-- Ground Environment / Floor Grid Details -->
  <path d="M0 165 L240 165" stroke="#334155" stroke-width="4"/>
  <rect x="0" y="165" width="240" height="75" fill="#090d16"/>
  
  <!-- Floor highlights and concrete slab lines -->
  <line x1="40" y1="165" x2="20" y2="240" stroke="#1e293b" stroke-width="2"/>
  <line x1="200" y1="165" x2="220" y2="240" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Dynamic Force/Power Aura Burst (Glowing upward lines) -->
  <g stroke-linecap="round" stroke-width="3">
    <line x1="90" y1="90" x2="80" y2="70" stroke="#fbbf24" opacity="0.8"/>
    <line x1="150" y1="90" x2="160" y2="70" stroke="#fbbf24" opacity="0.8"/>
    <line x1="120" y1="85" x2="120" y2="60" stroke="#f59e0b" opacity="0.9"/>
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="50" cy="130" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="140" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="105" cy="50" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="135" cy="45" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>