<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Chest Metal Gradient -->
    <linearGradient id="metal-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Chest Wood Gradient -->
    <linearGradient id="wood-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Gem Glow Effect -->
    <radialGradient id="gem-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient lighting/glow behind chest -->
  <circle cx="120" cy="140" r="70" fill="#f59e0b" opacity="0.1" filter="url(#glow)" />
  <circle cx="120" cy="95" r="45" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />

  <!-- Background Environment/Props: Vault Wall & Accent Lines -->
  <path d="M40 190 L200 190" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <rect x="50" y="50" width="140" height="130" rx="16" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.5" />

  <!-- Group: Treasure Chest & Wealth Objects -->
  <g filter="url(#shadow)">
    <!-- Stack of Gold Coins (Base/Background) -->
    <ellipse cx="95" cy="170" rx="22" ry="7" fill="url(#coin-grad)" />
    <path d="M73 165 v6 c0 4 10 7 22 7 s22-3 22-7 v-6 c0 4-10 7-22 7 s-22-3-22-7 z" fill="#b45309" />
    <ellipse cx="95" cy="165" rx="22" ry="7" fill="url(#coin-grad)" />

    <!-- Additional Gold Bars/Ingots (Yuanbao style) -->
    <g transform="translate(140, 150) rotate(15)">
      <path d="M-15 -6 C-5 -12 5 -12 15 -6 C18 -3 18 3 15 6 C5 10 -5 10 -15 6 C-18 3 -18 -3 -15 -6 Z" fill="url(#coin-grad)" />
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="#ca8a04" opacity="0.4" />
    </g>

    <g transform="translate(65, 145) rotate(-10)">
      <path d="M-15 -6 C-5 -12 5 -12 15 -6 C18 -3 18 3 15 6 C5 10 -5 10 -15 6 C-18 3 -18 -3 -15 -6 Z" fill="url(#coin-grad)" />
    </g>

    <!-- Open Treasure Chest: Back/Interior -->
    <path d="M70 120 L170 120 L160 155 L80 155 Z" fill="#52250a" />

    <!-- Chest Lid (Open Upwards) -->
    <path d="M70 120 C70 90 85 75 120 75 C155 75 170 90 170 120 Z" fill="url(#wood-body)" stroke="#b45309" stroke-width="2" />
    <!-- Lid Metal Ribs -->
    <path d="M95 76 C95 95 97 115 97 120" stroke="url(#metal-gold)" stroke-width="5" stroke-linecap="round" />
    <path d="M145 76 C145 95 143 115 143 120" stroke="url(#metal-gold)" stroke-width="5" stroke-linecap="round" />

    <!-- Glowing Magical Asset / Gem inside chest -->
    <circle cx="120" cy="115" r="22" fill="url(#gem-glow)" />
    <polygon points="120,98 128,112 112,112" fill="#38bdf8" />
    <polygon points="120,132 128,118 112,118" fill="#38bdf8" />
    <polygon points="105,115 118,108 118,122" fill="#7dd3fc" />
    <polygon points="135,115 122,108 122,122" fill="#7dd3fc" />
    <circle cx="120" cy="115" r="5" fill="#ffffff" filter="url(#glow)" />

    <!-- Chest Base/Front -->
    <path d="M72 125 L168 125 L164 165 C164 170 160 174 154 174 L86 174 C80 174 76 170 76 165 Z" fill="url(#wood-body)" />
    
    <!-- Chest Wood Planks / Texture Details -->
    <path d="M73 140 L167 140" stroke="#52250a" stroke-width="2" />
    <path d="M75 158 L165 158" stroke="#52250a" stroke-width="2" />

    <!-- Metal Reinforcements (Corner Brackets & Bands) -->
    <path d="M72 125 L76 125 L76 174 L72 174 Z" fill="url(#metal-gold)" />
    <path d="M168 125 L164 125 L164 174 L168 174 Z" fill="url(#metal-gold)" />
    
    <path d="M95 125 L99 125 L99 174 L95 174 Z" fill="url(#metal-gold)" />
    <path d="M141 125 L145 125 L145 174 L141 174 Z" fill="url(#metal-gold)" />

    <!-- Heavy Gold Lock & Clasp -->
    <rect x="110" y="118" width="20" height="22" rx="4" fill="url(#metal-gold)" />
    <circle cx="120" cy="126" r="3" fill="#78350f" />
    <path d="M113 118 C113 110 127 110 127 118" fill="none" stroke="url(#metal-gold)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Floating Wealth Sparkles & Accumulation Elements -->
  <g fill="#fbbf24">
    <!-- Star Sparkle 1 -->
    <path d="M50 90 Q60 90 60 80 Q60 90 70 90 Q60 90 60 100 Q60 90 50 90 Z" opacity="0.9" />
    <!-- Star Sparkle 2 -->
    <path d="M180 80 Q186 80 186 74 Q186 80 192 80 Q186 80 186 86 Q186 80 180 80 Z" opacity="0.7" />
    <!-- Star Sparkle 3 (Blue accent) -->
    <path d="M160 55 Q165 55 165 50 Q165 55 170 55 Q165 55 165 60 Q165 55 160 55 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M75 65 Q79 65 79 61 Q79 65 83 65 Q79 65 79 69 Q79 65 75 65 Z" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Floating Coins representing accumulation over time -->
  <g filter="url(#shadow)">
    <!-- Coin 1 -->
    <ellipse cx="145" cy="95" rx="8" ry="4" fill="url(#coin-grad)" transform="rotate(-20 145 95)" />
    <!-- Coin 2 -->
    <ellipse cx="95" cy="100" rx="9" ry="4.5" fill="url(#coin-grad)" transform="rotate(30 95 100)" />
    <!-- Coin 3 -->
    <ellipse cx="130" cy="65" rx="7" ry="3.5" fill="url(#coin-grad)" transform="rotate(15 130 65)" />
  </g>

  <!-- Foreground Atmospheric Glow Dots -->
  <circle cx="105" cy="180" r="2" fill="#fef08a" opacity="0.8" />
  <circle cx="135" cy="178" r="3" fill="#fef08a" opacity="0.5" />
  <circle cx="85" cy="130" r="1.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="155" cy="125" r="2" fill="#38bdf8" opacity="0.7" />

</svg>