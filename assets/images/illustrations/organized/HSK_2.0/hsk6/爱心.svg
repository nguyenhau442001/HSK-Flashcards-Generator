<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Golden Light Glow -->
    <radialGradient id="goldenGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Heart 3D Gradient -->
    <linearGradient id="heartGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="30%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="heartGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>

    <!-- Cat Fur Gradient -->
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Puppy Fur Gradient -->
    <linearGradient id="dogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Blanket Gradient -->
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#030712" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#goldenGlow)"/>

  <!-- Ambient Background Sparkles / Hearts -->
  <g fill="#fbbf24" opacity="0.3">
    <circle cx="45" cy="50" r="2" />
    <circle cx="195" cy="70" r="1.5" />
    <circle cx="210" cy="160" r="2.5" />
    <circle cx="30" cy="180" r="2" />
  </g>

  <!-- Wooden Floor / Surface -->
  <path d="M 0 195 Q 120 185 240 195 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M 0 190 L 240 190" stroke="#334155" stroke-width="2" stroke-dasharray="8 4" opacity="0.5"/>

  <!-- Soft Care Blanket / Cushion on the Floor -->
  <g filter="url(#shadow)">
    <path d="M 50 175 C 50 155, 190 155, 190 175 C 190 205, 50 205, 50 175 Z" fill="url(#blanketGrad)"/>
    <!-- Blanket pattern stripes -->
    <path d="M 70 172 Q 120 162 170 172" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 60 183 Q 120 173 180 183" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- CENTRAL GIANT GLOWING HEART (The Concept: àixīn / Love & Compassion) -->
  <g filter="url(#glow)" opacity="0.4">
    <path d="M 120 65 C 150 30, 210 60, 185 110 C 160 150, 120 180, 120 180 C 120 180, 80 150, 55 110 C 30 60, 90 30, 120 65 Z" fill="url(#heartGlowGrad)"/>
  </g>

  <!-- Little Sleeping Puppy (Left side) -->
  <g id="puppy" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="85" cy="170" rx="22" ry="16" fill="url(#dogGrad)"/>
    <!-- Head -->
    <circle cx="70" cy="162" r="14" fill="url(#dogGrad)"/>
    <!-- Floppy Ear -->
    <path d="M 60 155 C 50 160, 55 175, 65 170 Z" fill="#ca8a04"/>
    <!-- Closed Happy Eye -->
    <path d="M 64 160 Q 67 164 70 160" stroke="#713f12" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Cute snout -->
    <circle cx="58" cy="165" r="2.5" fill="#713f12"/>
    <!-- Tail wagging blur -->
    <path d="M 105 168 Q 115 160 112 175" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Little Curious Kitten (Right side) -->
  <g id="kitten" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="155" cy="168" rx="20" ry="15" fill="url(#catGrad)"/>
    <!-- Head -->
    <circle cx="170" cy="158" r="13" fill="url(#catGrad)"/>
    <!-- Ears -->
    <polygon points="160,147 165,135 170,148" fill="#ea580c"/>
    <polygon points="175,147 182,136 183,149" fill="#ea580c"/>
    <!-- Inner ears -->
    <polygon points="162,146 165,139 168,146" fill="#fed7aa"/>
    <polygon points="177,146 180,140 181,147" fill="#fed7aa"/>
    <!-- Happy Closed Eyes (Peeking lovingly) -->
    <path d="M 172 156 Q 175 159 178 156" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Nose & Whiskers -->
    <circle cx="182" cy="161" r="1.5" fill="#7c2d12"/>
    <line x1="184" y1="162" x2="192" y2="161" stroke="#fed7aa" stroke-width="1" stroke-linecap="round"/>
    <line x1="184" y1="164" x2="191" y2="166" stroke="#fed7aa" stroke-width="1" stroke-linecap="round"/>
    <!-- Tail curved up -->
    <path d="M 135 170 C 130 160, 130 145, 140 140" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- THE SOLID SHINING HEART EMBLEM (Main Focal Point representing Àixīn) -->
  <g id="main-heart" filter="url(#shadow)">
    <path d="M 120 75 
             C 142 50, 185 70, 170 110 
             C 155 140, 120 165, 120 165 
             C 120 165, 85 140, 70 110 
             C 55 70, 98 50, 120 75 Z" 
          fill="url(#heartGrad)" 
          stroke="#ffe4e6" 
          stroke-width="3"/>
             
    <!-- Heart Specular Highlight for Glossy 3D Look -->
    <path d="M 98 85 C 92 95, 95 110, 102 118" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.6"/>
  </g>

  <!-- Loving Care Hands / Paws holding or cradling the heart (Stylized nurturing gesture) -->
  <g id="nurturing-elements">
    <!-- Floating energetic love sparkles around the heart -->
    <g fill="#f43f5e">
      <circle cx="95" cy="65" r="3" opacity="0.8"/>
      <circle cx="145" cy="65" r="2.5" opacity="0.8"/>
      <path d="M 120 40 L 122 46 L 128 48 L 122 50 L 120 56 L 118 50 L 112 48 L 118 46 Z" fill="#fbbf24"/>
      <path d="M 75 90 L 76.5 94 L 80.5 95.5 L 76.5 97 L 75 101 L 73.5 97 L 69.5 95.5 L 73.5 94 Z" fill="#fb7185" transform="scale(0.7) translate(40, 20)"/>
    </g>

    <!-- Warm golden medical/care cross or delicate sparkle accent on top -->
    <circle cx="120" cy="115" r="18" fill="#ffffff" opacity="0.15"/>
  </g>

  <!-- Foreground Atmospheric Elements (Floating warmth) -->
  <g fill="#fbbf24" opacity="0.7">
    <circle cx="102" cy="122" r="1.5" />
    <circle cx="138" cy="122" r="1.5" />
    <circle cx="120" cy="140" r="2" />
  </g>
</svg>