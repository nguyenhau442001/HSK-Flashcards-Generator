<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Enemy/Robot Body Gradient (Aggressive red/orange) -->
    <linearGradient id="enemyBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Shield/Energy Gradient -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Action Impact Glow -->
    <radialGradient id="impactGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Arena/Fortress Wall details) -->
  <g opacity="0.3">
    <!-- Hazard lines on the ground/wall -->
    <path d="M 0 160 L 240 160" stroke="#475569" stroke-width="2" stroke-dasharray="8 4"/>
    <polygon points="30,80 50,110 10,110" fill="#334155"/>
    <circle cx="190" cy="70" r="25" fill="none" stroke="#334155" stroke-width="4"/>
  </g>

  <!-- Dynamic Floor Plane -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#floorGrad)"/>
  
  <!-- Floor Grid Perspective Lines -->
  <path d="M 40 170 L 0 240 M 120 170 L 100 240 M 200 170 L 220 240" stroke="#1e293b" stroke-width="2" opacity="0.5"/>

  <!-- Background debris & flying sparks -->
  <circle cx="60" cy="130" r="2" fill="#fbbf24"/>
  <circle cx="180" cy="110" r="3" fill="#f43f5e"/>
  <path d="M 70 190 L 80 185" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 160 200 L 175 195" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- MAIN SUBJECT: Kẻ địch (The Enemy - Action Melee/Combat Robot Boss) -->
  <g filter="url(#dropShadow)" transform="translate(15, 10)">
    
    <!-- Enemy Ground Shadow -->
    <ellipse cx="95" cy="170" rx="45" ry="12" fill="#000000" opacity="0.6"/>

    <!-- Enemy Back Thrusters / Spikes -->
    <polygon points="70,100 50,80 75,95" fill="#475569"/>
    <polygon points="120,100 140,80 115,95" fill="#475569"/>

    <!-- Main Body / Torso (Armored, menacing posture) -->
    <path d="M 65 95 L 125 95 L 135 140 L 55 140 Z" fill="url(#enemyBody)"/>
    
    <!-- Chest Armor Plate (Dark metallic core) -->
    <path d="M 75 105 L 115 105 L 120 130 L 70 130 Z" fill="#1e293b"/>
    
    <!-- Glowing Enemy Core / Vitals -->
    <polygon points="95,110 105,120 95,130 85,120" fill="#fbbf24"/>
    <circle cx="95" cy="120" r="4" fill="#ffffff"/>

    <!-- Enemy Shoulders / Pauldrons -->
    <path d="M 60 90 L 75 90 L 70 110 L 50 100 Z" fill="#475569"/>
    <path d="M 130 90 L 115 90 L 120 110 L 140 100 Z" fill="#475569"/>

    <!-- Enemy Head & Visor (Aggressive styling) -->
    <path d="M 80 70 L 110 70 L 115 92 L 75 92 Z" fill="#334155"/>
    <!-- Glowing Red Visor Slit -->
    <path d="M 83 78 L 107 78 L 105 84 L 85 84 Z" fill="#f43f5e" filter="url(#dropShadow)"/>
    <line x1="88" y1="81" x2="102" y2="81" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Enemy Horns / Crest -->
    <polygon points="95,58 100,70 90,70" fill="#f43f5e"/>

    <!-- Left Arm (Wielding melee weapon/blade) -->
    <path d="M 50 105 L 30 130 L 40 145 L 55 125 Z" fill="#64748b"/>
    <!-- Energy Blade / Weapon -->
    <path d="M 30 130 L 15 155 L 25 150 Z" fill="#f43f5e"/>
    <path d="M 30 130 L 10 170 L 22 155 Z" fill="#fb7185" opacity="0.8"/>

    <!-- Right Arm (Raised menacingly) -->
    <path d="M 140 105 L 160 120 L 150 140 L 135 125 Z" fill="#64748b"/>
    <circle cx="160" cy="120" r="6" fill="#f43f5e"/>

    <!-- Legs / Treads -->
    <path d="M 70 140 L 85 140 L 80 168 L 60 168 Z" fill="#334155"/>
    <path d="M 110 140 L 125 140 L 135 168 L 115 168 Z" fill="#334155"/>

  </g>

  <!-- ACTION / DEFEAT IMPACT EFFECTS (Context: Being attacked/defeated as per example) -->
  <g transform="translate(10, 0)">
    <!-- Impact Burst Sparks surrounding the enemy -->
    <path d="M 120 70 L 140 50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 70 80 L 50 60" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 140 130 L 165 120" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Explosive Energy Blast Cloud -->
    <circle cx="105" cy="115" r="50" fill="url(#impactGlow)" opacity="0.6" style="mix-blend-mode: screen;"/>
  </g>

  <!-- Foreground Dynamic Elements & Debris (Depth Layer) -->
  <g>
    <!-- Flying Metal Shards (Action motion) -->
    <polygon points="170,150 180,155 175,165" fill="#64748b" transform="rotate(25 175 157)"/>
    <polygon points="40,90 48,94 42,100" fill="#9f1239" transform="rotate(-15 44 95)"/>
    
    <!-- Energy Slash Arc (Hero's attack cutting through) -->
    <path d="M 40 40 Q 120 120 200 60" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#dropShadow)"/>
    <path d="M 50 50 Q 120 130 190 75" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

</svg>