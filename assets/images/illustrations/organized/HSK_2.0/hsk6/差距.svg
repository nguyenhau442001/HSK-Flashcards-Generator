<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ground Plane -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Left Side: Tall structure -->
  <rect x="30" y="80" width="60" height="100" rx="4" fill="#38bdf8"/>
  <rect x="40" y="90" width="15" height="15" fill="#0f172a" opacity="0.2"/>
  <rect x="65" y="90" width="15" height="15" fill="#0f172a" opacity="0.2"/>
  
  <!-- Right Side: Short structure -->
  <rect x="150" y="140" width="60" height="40" rx="4" fill="#fb923c"/>
  <rect x="160" y="150" width="15" height="15" fill="#0f172a" opacity="0.2"/>
  <rect x="185" y="150" width="15" height="15" fill="#0f172a" opacity="0.2"/>
  
  <!-- The Gap/Distance Indicator -->
  <line x1="100" y1="160" x2="140" y2="160" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M100 155 L100 165 M140 155 L140 165" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="50" r="15" fill="#fbbf24"/>
  <path d="M10 200 Q 120 140 230 200" stroke="#475569" stroke-width="1" fill="none"/>
  
  <!-- Highlights -->
  <rect x="30" y="80" width="60" height="10" rx="4" fill="#ffffff" opacity="0.1"/>
  <rect x="150" y="140" width="60" height="10" rx="4" fill="#ffffff" opacity="0.1"/>
</svg>