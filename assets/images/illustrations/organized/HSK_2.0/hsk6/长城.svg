<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Great Wall Stone Gradients -->
    <linearGradient id="wallBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="wallTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glow & Accents -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container / Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Atmospheric Elements / Stars & Sun -->
  <circle cx="180" cy="60" r="40" fill="url(#sunGlow)" />
  <circle cx="180" cy="60" r="18" fill="#fbbf24" opacity="0.9" />

  <!-- Distant Clouds -->
  <path d="M 30,50 Q 45,40 60,50 Q 75,40 90,50 Z" fill="#334155" opacity="0.4" />
  <path d="M 140,80 Q 155,70 170,80 Q 185,70 200,80 Z" fill="#334155" opacity="0.3" />

  <!-- Layer 1: Distant Mountains -->
  <polygon points="-10,180 40,110 90,150 140,100 200,160 250,110 250,240 -10,240" fill="url(#mountainBack)" />

  <!-- Layer 2: Mid-distance Mountains & Ridge -->
  <polygon points="0,200 50,130 110,170 170,120 240,170 240,240 0,240" fill="url(#mountainMid)" />

  <!-- Layer 3: Foreground Majestic Mountain Peaks -->
  <path d="M-10,240 L30,160 L80,190 L150,130 L220,180 L250,150 L250,240 Z" fill="url(#mountainFront)" />

  <!-- THE GREAT WALL (长城) - Snaking across the ridges -->
  <!-- Segment 1 (Back Ridge) -->
  <path d="M 35,142 L 85,158" stroke="url(#wallBase)" stroke-width="8" stroke-linecap="round" />
  <path d="M 33,139 L 87,155" stroke="url(#wallTop)" stroke-width="3" stroke-linecap="round" />

  <!-- Watchtower 1 (Distant) -->
  <rect x="75" y="142" width="16" height="18" fill="#b45309" rx="2" />
  <polygon points="73,142 83,132 93,142" fill="#d97706" />

  <!-- Segment 2 (Middle Ridge - Dramatic Rise) -->
  <path d="M 85,158 L 145,138" stroke="url(#wallBase)" stroke-width="11" />
  <path d="M 83,154 L 147,134" stroke="url(#wallTop)" stroke-width="4" />
  <!-- Crenellations / Battlement details -->
  <path d="M 90,150 L 95,147 M 105,145 L 110,142 M 120,140 L 125,137 M 135,135 L 140,132" stroke="#d97706" stroke-width="3" stroke-linecap="square" />

  <!-- Watchtower 2 (Main Hero Tower) -->
  <g transform="translate(135, 115)">
    <!-- Tower Body -->
    <rect x="0" y="5" width="22" height="25" fill="url(#wallBase)" rx="2" />
    <rect x="3" y="10" width="6" height="10" fill="#0f172a" rx="1" />
    <rect x="13" y="10" width="6" height="10" fill="#0f172a" rx="1" />
    <!-- Tower Roof -->
    <path d="M -3,5 L 11,-4 L 25,5 Z" fill="#b45309" />
    <path d="M -1,5 L 11,-2 L 23,5 Z" fill="#d97706" />
  </g>

  <!-- Segment 3 (Foreground Descent & Sweep) -->
  <path d="M 155,140 L 210,175" stroke="url(#wallBase)" stroke-width="14" />
  <path d="M 153,135 L 212,171" stroke="url(#wallTop)" stroke-width="5" />
  
  <!-- Steps / Texture on Wall -->
  <line x1="165" y1="145" x2="167" y2="152" stroke="#b45309" stroke-width="2" />
  <line x1="175" y1="151" x2="177" y2="158" stroke="#b45309" stroke-width="2" />
  <line x1="185" y1="157" x2="187" y2="164" stroke="#b45309" stroke-width="2" />
  <line x1="195" y1="163" x2="197" y2="170" stroke="#b45309" stroke-width="2" />

  <!-- Foreground Pine Trees for Scale and Depth -->
  <!-- Left Pine Cluster -->
  <path d="M 20,210 L 28,180 L 36,210 Z" fill="#065f46" />
  <path d="M 15,225 L 24,195 L 33,225 Z" fill="#047857" />
  <rect x="23" y="220" width="4" height="15" fill="#78350f" />

  <path d="M 45,215 L 53,185 L 61,215 Z" fill="#065f46" />
  <path d="M 40,230 L 49,200 L 58,230 Z" fill="#047857" />
  <rect x="47" y="225" width="4" height="15" fill="#78350f" />

  <!-- Right Pine Cluster -->
  <path d="M 200,205 L 208,175 L 216,205 Z" fill="#065f46" />
  <path d="M 194,220 L 203,190 L 212,220 Z" fill="#047857" />
  <rect x="201" y="215" width="4" height="15" fill="#78350f" />

  <!-- Flying Bird Silhouettes for Atmosphere -->
  <path d="M 90,70 Q 95,65 100,70 Q 105,65 110,70 Q 105,75 100,70 Q 95,75 90,70 Z" fill="#94a3b8" opacity="0.7" />
  <path d="M 115,85 Q 118,81 122,85 Q 126,81 130,85 Q 126,89 122,85 Q 118,89 115,85 Z" fill="#94a3b8" opacity="0.6" transform="scale(0.8) translate(30, 20)" />

  <!-- Frame Border / Vignette Effect (Subtle Clean Inset) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>