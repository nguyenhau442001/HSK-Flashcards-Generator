<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M20 180 L220 180 L230 210 L10 210 Z" fill="#334155"/>
  <path d="M20 180 L220 180 L210 195 L30 195 Z" fill="#475569"/>
  
  <!-- The Pile of Books (The '堆') -->
  <g transform="translate(80, 180)">
    <!-- Bottom book -->
    <rect x="0" y="-15" width="80" height="15" rx="2" fill="#fb923c"/>
    <rect x="2" y="-13" width="76" height="11" rx="1" fill="#ea580c"/>
    
    <!-- Middle book -->
    <rect x="5" y="-30" width="70" height="15" rx="2" fill="#38bdf8"/>
    <rect x="7" y="-28" width="66" height="11" rx="1" fill="#0284c7"/>
    
    <!-- Top book -->
    <rect x="10" y="-45" width="60" height="15" rx="2" fill="#10b981"/>
    <rect x="12" y="-43" width="56" height="11" rx="1" fill="#059669"/>
    
    <!-- Topmost book (tilted) -->
    <rect x="15" y="-55" width="50" height="10" rx="2" fill="#ec4899" transform="rotate(-5 40 -50)"/>
  </g>
  
  <!-- Ambient Props -->
  <circle cx="180" cy="160" r="12" fill="#f59e0b" opacity="0.3"/>
  <path d="M175 155 L185 165 M185 155 L175 165" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  
  <rect x="30" y="150" width="20" height="30" rx="2" fill="#64748b"/>
  <rect x="32" y="152" width="16" height="26" rx="1" fill="#94a3b8"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="50" r="3" fill="#fbbf24"/>
  <circle cx="40" cy="40" r="2" fill="#38bdf8"/>
  <circle cx="210" cy="100" r="2" fill="#ec4899"/>
</svg>