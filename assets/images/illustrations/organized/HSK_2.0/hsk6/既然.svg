<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Deep Slate Navy Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueprint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting -->
  <circle cx="120" cy="100" r="100" fill="url(#lamp-glow)" />

  <!-- Background Environment / Window & Wall -->
  <g fill="none" stroke="#334155" stroke-width="2" opacity="0.6">
    <path d="M40 30 L200 30" />
    <rect x="170" y="45" width="30" height="40" rx="4" />
    <line x1="185" y1="45" x2="185" y2="85" />
    <line x1="170" y1="65" x2="200" y2="65" />
  </g>

  <!-- Bookshelf / Prop in background -->
  <rect x="25" y="60" width="30" height="60" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="80" x2="55" y2="80" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="100" x2="55" y2="100" stroke="#334155" stroke-width="1.5" />
  <rect x="28" y="68" width="8" height="12" rx="1" fill="#ec4899" />
  <rect x="38" y="71" width="6" height="9" rx="1" fill="#38bdf8" />
  <rect x="28" y="88" width="10" height="12" rx="1" fill="#10b981" />

  <!-- Desk Surface -->
  <path d="M 10 170 L 230 170 L 235 210 L 5 210 Z" fill="url(#wood-desk)" stroke="#475569" stroke-width="2" />
  <!-- Desk edge highlight -->
  <path d="M 10 170 L 230 170" stroke="#64748b" stroke-width="1.5" />

  <!-- Action Props: Rolled-out Blueprint / Project Plan ("Đã quyết định rồi") -->
  <g transform="translate(45, 120)">
    <!-- Blueprint paper rolled up on left -->
    <path d="M 15 35 C 10 35 8 40 10 45 C 12 50 18 52 23 48 L 23 20 C 18 16 12 18 10 23 C 8 28 10 33 15 33 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Blueprint Sheet Unrolled -->
    <path d="M 23 20 L 135 25 L 135 55 L 23 50 Z" fill="url(#blueprint-grad)" opacity="0.95" />
    <!-- Blueprint schematic lines (decision made, clear direction) -->
    <path d="M 35 30 L 60 30 M 70 30 L 95 30 M 35 40 L 80 40" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <circle cx="110" cy="35" r="8" fill="none" stroke="#f43f5e" stroke-width="2.5" />
    <path d="M 107 35 L 110 38 L 114 32" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Action Props: Hot Coffee Mug (Focus & Determination) -->
  <g transform="translate(165, 130)">
    <ellipse cx="16" cy="35" rx="10" ry="4" fill="#cbd5e1" />
    <path d="M 6 35 L 8 58 C 8 61 11 63 16 63 C 21 63 24 61 24 58 L 26 35 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Handle -->
    <path d="M 6 40 C 0 40 0 52 6 54" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <!-- Steam indicating immediate action / energy -->
    <path d="M 12 24 C 10 20 14 16 12 12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M 20 22 C 22 18 18 14 20 10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Main Action Element: A Determined Hand Slamming a Stamp / Moving a Piece ("Hãy làm thôi") -->
  <g transform="translate(100, 75)">
    <!-- Sleeve / Arm coming from top right -->
    <path d="M 75 10 L 45 45 L 25 35 L 55 0 Z" fill="#4f46e5" />
    <path d="M 60 27 L 72 15" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
    
    <!-- Hand / Wrist pushing down firmly -->
    <path d="M 45 45 C 40 50 32 48 28 42 C 24 36 28 30 35 32 L 45 45 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5" />
    <!-- Fingers gripping the stamp -->
    <path d="M 33 34 C 30 33 28 35 29 38 C 30 40 33 42 36 41" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" />

    <!-- Action Stamp / Marker Tool -->
    <g transform="translate(15, 30) rotate(-15)">
      <!-- Stamp Handle -->
      <rect x="-6" y="-20" width="12" height="20" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
      <ellipse cx="0" cy="-20" rx="6" ry="2" fill="#fbbf24" />
      <!-- Stamp Base -->
      <rect x="-10" y="0" width="20" height="8" rx="2" fill="#334155" stroke="#475569" stroke-width="1.5" />
      <!-- Glowing energetic base ring (action triggered) -->
      <rect x="-8" y="8" width="16" height="3" rx="1" fill="#10b981" />
    </g>
  </g>

  <!-- Action Impact Effects & Sparks (Visualizing "Since it's decided, let's execute!") -->
  <g transform="translate(125, 135)">
    <!-- Impact Star / Burst -->
    <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="#fbbf24" />
    <!-- Floating energetic particles -->
    <circle cx="-25" cy="-15" r="3" fill="#38bdf8" />
    <circle cx="25" cy="-25" r="2" fill="#10b981" />
    <circle cx="35" cy="10" r="3.5" fill="#f43f5e" />
    <circle cx="-30" cy="15" r="2.5" fill="#fbbf24" />
  </g>

  <!-- Dynamic Motion Lines representing swift, decisive movement -->
  <path d="M 85 85 L 115 115" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 70 95 L 95 120" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6" />

</svg>