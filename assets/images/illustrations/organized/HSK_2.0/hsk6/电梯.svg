<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Hallway Wall Detail -->
  <rect x="20" y="40" width="200" height="200" fill="#1e293b" opacity="0.5"/>
  <path d="M20 40 L220 40 L240 20 L0 20 Z" fill="#334155" opacity="0.3"/>

  <!-- Elevator Frame -->
  <rect x="55" y="55" width="130" height="185" fill="#475569" rx="2"/>
  
  <!-- Elevator Interior Glow -->
  <rect x="65" y="65" width="110" height="175" fill="#f59e0b" opacity="0.15"/>
  <rect x="70" y="70" width="100" height="170" fill="#334155"/>
  
  <!-- Interior Back Wall & Light -->
  <rect x="70" y="70" width="100" height="40" fill="#475569" opacity="0.5"/>
  <rect x="80" y="75" width="80" height="4" rx="2" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Interior Control Panel -->
  <rect x="155" y="110" width="10" height="40" rx="2" fill="#1e293b"/>
  <circle cx="160" cy="118" r="1.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="160" cy="125" r="1.5" fill="#94a3b8"/>
  <circle cx="160" cy="132" r="1.5" fill="#94a3b8"/>
  <circle cx="160" cy="139" r="1.5" fill="#94a3b8"/>

  <!-- Characters -->
  <!-- Person Inside -->
  <circle cx="105" cy="115" r="10" fill="#fb923c"/>
  <path d="M85 130 Q105 125 125 130 L120 180 L90 180 Z" fill="#38bdf8"/>
  
  <!-- Person Entering (Action) -->
  <circle cx="145" cy="125" r="9" fill="#fcd34d"/>
  <path d="M135 140 Q145 135 155 140 L165 190 L130 190 Z" fill="#ec4899"/>
  <path d="M130 190 L120 220 L135 220 Z" fill="#1e293b"/> <!-- Leg moving in -->

  <!-- Elevator Doors (Partially Open) -->
  <rect x="35" y="60" width="45" height="180" fill="url(#doorGrad)" rx="1"/>
  <rect x="160" y="60" width="45" height="180" fill="url(#doorGrad)" rx="1"/>
  
  <!-- Door Grooves/Details -->
  <line x1="45" y1="60" x2="45" y2="240" stroke="#475569" stroke-width="0.5"/>
  <line x1="195" y1="60" x2="195" y2="240" stroke="#475569" stroke-width="0.5"/>

  <!-- Floor Indicator Above Door -->
  <rect x="105" y="35" width="30" height="12" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <path d="M115 41 L120 37 L125 41" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="128" cy="41" r="1" fill="#10b981" filter="url(#glow)"/>

  <!-- External Call Button -->
  <rect x="205" y="130" width="12" height="24" rx="2" fill="#334155"/>
  <circle cx="211" cy="136" r="2.5" fill="#1e293b"/>
  <path d="M211 135 L213 137 L209 137 Z" fill="#94a3b8"/>
  <circle cx="211" cy="144" r="2.5" fill="#1e293b"/>
  <path d="M211 145 L213 143 L209 143 Z" fill="#94a3b8"/>

  <!-- Floor Reflection -->
  <rect x="0" y="230" width="240" height="10" fill="#0f172a" opacity="0.8"/>
  <ellipse cx="120" cy="235" rx="60" ry="5" fill="#f59e0b" opacity="0.1"/>
</svg>