<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cityGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Futuristic High-Tech Urban Cityscape (Symbolizing 'Phát triển' / Development) -->
  <!-- Distant skyscrapers -->
  <g opacity="0.4">
    <rect x="20" y="90" width="18" height="90" fill="#334155"/>
    <rect x="42" y="70" width="22" height="110" fill="#475569"/>
    <rect x="68" y="100" width="15" height="80" fill="#334155"/>
    <rect x="160" y="60" width="25" height="120" fill="#475569"/>
    <rect x="190" y="85" width="20" height="95" fill="#334155"/>
    <!-- Tiny window lights -->
    <rect x="25" y="100" width="2" height="3" fill="#38bdf8"/>
    <rect x="31" y="100" width="2" height="3" fill="#38bdf8"/>
    <rect x="48" y="80" width="3" height="4" fill="#fbbf24"/>
    <rect x="54" y="90" width="3" height="4" fill="#38bdf8"/>
    <rect x="168" y="75" width="3" height="4" fill="#fbbf24"/>
    <rect x="176" y="90" width="3" height="4" fill="#38bdf8"/>
  </g>

  <!-- Modern Architecture & Holographic Growth Visuals -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="#090d16"/>
  <rect x="0" y="178" width="240" height="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Holographic growth chart / Innovation projection -->
  <g filter="url(#neonGlow)">
    <polygon points="80,150 120,120 160,80 160,178 80,178" fill="url(#cityGlow)"/>
    <polyline points="70,165 100,140 130,110 170,75 200,55" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glowing nodes on the trend line -->
    <circle cx="100" cy="140" r="3" fill="#ffffff" />
    <circle cx="130" cy="110" r="3" fill="#ffffff" />
    <circle cx="170" cy="75" r="4" fill="#10b981" />
    <circle cx="200" cy="55" r="5" fill="#f59e0b" />
    <!-- Upward arrow vector representing high growth/development -->
    <path d="M 190 62 L 200 52 L 210 62" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Holographic Interface Elements / Geometric Design Lines -->
  <line x1="170" y1="75" x2="170" y2="178" stroke="#38bdf8" stroke-dasharray="2 3" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="55" x2="200" y2="178" stroke="#f59e0b" stroke-dasharray="2 3" stroke-width="1" opacity="0.5"/>

  <!-- Foreground Desk / Control Station -->
  <path d="M 30 190 L 140 190 L 155 220 L 15 220 Z" fill="#334155"/>
  <path d="M 25 190 L 145 190 L 145 194 L 25 194 Z" fill="#475569"/>
  <rect x="45" y="198" width="25" height="12" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="85" cy="204" r="4" fill="#10b981"/>
  <circle cx="100" cy="204" r="4" fill="#fbbf24"/>

  <!-- Holographic Globe / 3D Projection Prop -->
  <g transform="translate(115, 145)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="8" ry="22" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <path d="M -15 -10 Q 0 -5 12 -15" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M -8 10 Q 5 5 15 12" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="0" r="26" fill="url(#beamGrad)" opacity="0.5"/>
  </g>

  <!-- Main Character: Professional/Innovator actively designing/managing development -->
  <!-- Chair Back -->
  <path d="M 50 130 L 75 130 L 70 185 L 55 185 Z" fill="#1e293b"/>
  
  <!-- Character Body & Torso -->
  <path d="M 60 145 L 85 140 L 95 180 L 55 180 Z" fill="#3b82f6"/> <!-- Modern blue blazer -->
  <path d="M 70 142 L 75 155 L 80 142 Z" fill="#ffffff"/> <!-- Collar/Shirt -->

  <!-- Character Head & Face -->
  <circle cx="75" cy="115" r="14" fill="#fcd34d"/> <!-- Warm skin tone -->
  <!-- Hair -->
  <path d="M 61 115 C 61 100, 89 100, 89 115 C 89 118, 85 112, 75 110 C 65 112, 61 118, 61 115 Z" fill="#1e293b"/>
  <!-- Confident, engaged expression -->
  <circle cx="79" cy="115" r="1.5" fill="#1e293b"/>
  <path d="M 82 111 Q 84 110 86 112" fill="none" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/> <!-- Eyebrow -->

  <!-- Arms and Hands interacting with futuristic controls/hologram -->
  <!-- Right Arm (reaching forward to touch holographic interface) -->
  <path d="M 80 150 L 105 145 L 125 155" fill="none" stroke="#3b82f6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Hand -->
  <circle cx="128" cy="157" r="4" fill="#fcd34d"/>

  <!-- Left Arm (resting or gesturing) -->
  <path d="M 65 150 L 55 165 L 65 175" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="67" cy="177" r="3.5" fill="#fcd34d"/>

  <!-- Floating particles / energy symbols representing high productivity and technological advancement -->
  <g fill="#38bdf8">
    <circle cx="140" cy="100" r="2" opacity="0.8"/>
    <circle cx="155" cy="120" r="1.5" opacity="0.6"/>
    <circle cx="125" cy="85" r="2.5" opacity="0.9"/>
    <circle cx="185" cy="110" r="1" opacity="0.5"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="135" cy="115" r="1.5" opacity="0.8"/>
    <circle cx="165" cy="95" r="2" opacity="0.7"/>
    <circle cx="150" cy="65" r="1.5" opacity="0.9"/>
  </g>

  <!-- Ambient rim lighting on character for depth -->
  <path d="M 89 115 C 89 100, 61 100, 61 115" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
</svg>