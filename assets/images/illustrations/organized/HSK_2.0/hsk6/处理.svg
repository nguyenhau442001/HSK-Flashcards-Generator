<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- UI Glow Gradient -->
    <linearGradient id="ui-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Holographic Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35" />
    </linearGradient>

    <!-- Gear Metallic Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Drop Shadow for floating elements -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="glow-effect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements -->
  <g opacity="0.15">
    <circle cx="120" cy="110" r="90" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="120" cy="110" r="70" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2 6" />
    <line x1="30" y1="110" x2="210" y2="110" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="120" y1="20" x2="120" y2="200" stroke="#38bdf8" stroke-width="0.5" />
  </g>

  <!-- Holographic Projection Cone/Beam -->
  <polygon points="80,160 160,160 190,75 50,75" fill="url(#beam-grad)" />

  <!-- Workstation Desk Surface -->
  <path d="M 20 185 L 220 185 L 205 215 L 35 215 Z" fill="#090d16" opacity="0.9" />
  <path d="M 20 185 L 220 185" stroke="#334155" stroke-width="2" />
  <!-- Desk Reflection/Highlight -->
  <path d="M 45 190 L 195 190" stroke="#38bdf8" stroke-width="1" opacity="0.3" stroke-dasharray="10 5" />

  <!-- Central Processing Unit / Holographic Core -->
  <g filter="url(#shadow)">
    <!-- Base Platform -->
    <ellipse cx="120" cy="165" rx="55" ry="18" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <ellipse cx="120" cy="165" rx="45" ry="13" fill="#0f172a" />
    <!-- Glowing ring on base -->
    <ellipse cx="120" cy="165" rx="35" ry="9" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Floating Active Elements (Data & Gears being processed) -->
  <g filter="url(#shadow)">
    
    <!-- Central Processing Diamond / Core -->
    <g transform="translate(120, 110)">
      <!-- Outer Rotating Energy Ring -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Inner Processing Cube/Diamond -->
      <polygon points="0,-22 22,0 0,22 -22,0" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      
      <!-- Core Pulse Dot -->
      <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#glow-effect)" />
    </g>

    <!-- Left Floating Gear (Mechanism of processing) -->
    <g transform="translate(75, 95)">
      <circle cx="0" cy="0" r="14" fill="url(#metal-grad)" />
      <!-- Gear teeth representation -->
      <rect x="-3" y="-18" width="6" height="6" rx="1" fill="url(#metal-grad)" />
      <rect x="-3" y="12" width="6" height="6" rx="1" fill="url(#metal-grad)" />
      <rect x="-18" y="-3" width="6" height="6" rx="1" fill="url(#metal-grad)" />
      <rect x="12" y="-3" width="6" height="6" rx="1" fill="url(#metal-grad)" />
      <circle cx="0" cy="0" r="6" fill="#0f172a" />
    </g>

    <!-- Right Floating Data Node / Document (Input turning into output) -->
    <g transform="translate(168, 105)">
      <rect x="-12" y="-16" width="24" height="30" rx="3" fill="#1e293b" stroke="#fb923c" stroke-width="2" />
      <line x1="-7" y1="-8" x2="7" y2="-8" stroke="#fb923c" stroke-width="2" stroke-linecap="round" />
      <line x1="-7" y1="-1" x2="7" y2="-1" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-7" y1="6" x2="3" y2="6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <!-- Success check badge -->
      <circle cx="10" cy="10" r="7" fill="#10b981" />
      <polyline points="7,10 9,12 14,7" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Energy Connection Streams (Curved Flow Lines) -->
    <path d="M 85 95 Q 102 75 120 88" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" />
    <path d="M 120 88 Q 138 75 156 97" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

    <path d="M 90 120 Q 105 135 120 125" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" />

  </g>

  <!-- Foreground Interface / HUD Accents -->
  <!-- Top Tech Header Bar -->
  <g transform="translate(20, 25)" opacity="0.8">
    <rect x="0" y="0" width="200" height="16" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <!-- Activity Pulse Graph inside header -->
    <polyline points="10,8 25,8 30,3 35,13 40,8 60,8 65,5 70,11 75,8 100,8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Status Dots -->
    <circle cx="180" cy="8" r="3" fill="#10b981" filter="url(#glow-effect)" />
    <circle cx="190" cy="8" r="3" fill="#fbbf24" />
  </g>

  <!-- Floating Success Particle Sparks -->
  <g>
    <circle cx="95" cy="65" r="2" fill="#38bdf8" filter="url(#glow-effect)" />
    <circle cx="150" cy="55" r="1.5" fill="#10b981" filter="url(#glow-effect)" />
    <circle cx="135" cy="145" r="2.5" fill="#fbbf24" filter="url(#glow-effect)" />
    <circle cx="65" cy="135" r="1.5" fill="#ec4899" filter="url(#glow-effect)" />
  </g>
  
  <!-- Additional Tangible Desk Props (Stylized Terminal Base) -->
  <g transform="translate(120, 195)">
    <!-- Sleek ergonomic input device / control pad -->
    <rect x="-25" y="-6" width="50" height="12" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <circle cx="-12" cy="0" r="3" fill="#38bdf8" />
    <line x1="-3" y1="0" x2="15" y2="0" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>