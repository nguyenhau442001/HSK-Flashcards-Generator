<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Celestial Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Planet Gradient -->
    <linearGradient id="planetGrad" x1="30%" y1="30%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gear Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Leaf/Nature Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Orbit Lines representing natural order/cycles) -->
  <g opacity="0.25">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="120" cy="120" r="65" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 4" />
    <circle cx="120" cy="120" r="40" fill="none" stroke="#34d399" stroke-width="1" />
  </g>

  <!-- Ambient Glow Behind Central Mechanism -->
  <circle cx="120" cy="120" r="70" fill="url(#sunGlow)" />

  <!-- SCENE: The intersection of Nature and Cosmic Order (Quy luật tự nhiên) -->
  
  <!-- Outer Orbiting Planet / Cycle Element -->
  <g transform="translate(195, 80)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="12" fill="url(#planetGrad)" />
    <!-- Planet ring -->
    <ellipse rx="18" ry="6" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(-25)" opacity="0.8" />
  </g>

  <!-- Secondary Orbiting Nature Element (Seed/Leaf Pod) -->
  <g transform="translate(50, 165)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="10" fill="url(#leafGrad)" />
    <path d="M-5,-5 Q0,-12 5,-5 Q12,0 5,5 Q0,12 -5,5 Q-12,0 -5,-5" fill="#10b981" opacity="0.6" />
  </g>

  <!-- Central Complex Gearwork (Interlocking predictable mechanism) -->
  <g filter="url(#shadow)">
    <!-- Large Background Gear -->
    <g transform="translate(120, 120)">
      <g>
        <!-- Gear teeth simplified -->
        <path d="M -12,-52 L 12,-52 L 10,-38 L -10,-38 Z M -12,52 L 12,52 L 10,38 L -10,38 Z M -52,-12 L -52,12 L -38,10 L -38,-10 Z M 52,-12 L 52,12 L 38,10 L 38,-10 Z M -37,-37 L -20,-50 L -12,-37 L -25,-25 Z M 37,37 L 20,50 L 12,37 L 25,25 Z M -37,37 L -25,25 L -12,37 L -20,50 Z M 37,-37 L 25,-25 L 12,-37 L 20,-50 Z" fill="#d97706" opacity="0.4"/>
        <circle cx="0" cy="0" r="42" fill="none" stroke="#d97706" stroke-width="6" opacity="0.4" />
      </g>
    </g>

    <!-- Main Golden Clockwork/Astrolabe Gear (Foreground) -->
    <g transform="translate(120, 120)">
      <circle cx="0" cy="0" r="32" fill="url(#metalGrad)" />
      <circle cx="0" cy="0" r="24" fill="#0f172a" />
      <!-- Gear Teeth -->
      <path d="M-6,-37 L6,-37 L5,-32 L-5,-32 Z
               M-6,37 L6,37 L5,32 L-5,32 Z
               M-37,-6 L-37,6 L-32,5 L-32,-5 Z
               M37,-6 L37,6 L32,5 L32,-5 Z
               M-26,-26 L-17,-35 L-21,-39 L-30,-30 Z
               M26,26 L17,35 L21,39 L30,30 Z
               M-26,26 L-30,30 L-21,39 L-17,35 Z
               M26,-26 L30,-30 L21,-39 L17,-35 Z" fill="url(#metalGrad)" />
      <!-- Inner detail of gear -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" />
      <circle cx="0" cy="0" r="6" fill="#fbbf24" />
    </g>
  </g>

  <!-- Blooming Natural Sprout (Symbolizing natural rhythm and laws of growth) -->
  <g transform="translate(120, 120)" filter="url(#shadow)">
    <!-- Stem curving harmoniously -->
    <path d="M0,6 C-10,25 -30,35 -50,25" fill="none" stroke="url(#leafGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M0,6 C15,25 35,30 50,15" fill="none" stroke="url(#leafGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Sprout Leaves -->
    <path d="M-50,25 Q-65,15 -55,5 Q-40,10 -50,25" fill="url(#leafGrad)" />
    <path d="M50,15 Q65,5 60,-8 Q45,0 50,15" fill="url(#leafGrad)" />

    <!-- Central Glowing Seed / Core Node -->
    <circle cx="0" cy="6" r="12" fill="#38bdf8" />
    <circle cx="0" cy="6" r="8" fill="#bae6fd" />
    <circle cx="-3" cy="3" r="3" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Sparkles / Orderly Energy Points (Floating in precise geometric harmony) -->
  <g fill="#fbbf24">
    <circle cx="85" cy="75" r="3" opacity="0.9" />
    <circle cx="160" cy="155" r="2.5" opacity="0.8" />
    <circle cx="150" cy="85" r="2" opacity="0.7" />
    <circle cx="90" cy="150" r="3.5" opacity="0.9" />
  </g>
  <g fill="#38bdf8">
    <circle cx="120" cy="55" r="2" opacity="0.9" />
    <circle cx="65" cy="115" r="3" opacity="0.8" />
    <circle cx="175" cy="120" r="2.5" opacity="0.9" />
  </g>

  <!-- Dynamic Star/Cross Accents for Action/Harmony -->
  <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M120,40 L120,48 M116,44 L124,44" />
    <path d="M185,140 L185,146 M182,143 L188,143" />
    <path d="M60,80 L60,86 M57,83 L63,83" />
  </g>
</svg>