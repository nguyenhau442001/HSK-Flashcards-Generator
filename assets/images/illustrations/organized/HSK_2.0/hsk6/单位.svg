<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glass Building Window Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Indoor Light -->
    <linearGradient id="indoorLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Office Building Silhouette -->
  <g opacity="0.4">
    <rect x="30" y="40" width="180" height="150" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Building Windows Grid -->
    <rect x="45" y="55" width="25" height="35" rx="2" fill="#38bdf8" />
    <rect x="80" y="55" width="25" height="35" rx="2" fill="#38bdf8" />
    <rect x="115" y="55" width="25" height="35" rx="2" fill="#38bdf8" />
    <rect x="150" y="55" width="25" height="35" rx="2" fill="#38bdf8" />

    <rect x="45" y="105" width="25" height="35" rx="2" fill="#38bdf8" />
    <rect x="80" y="105" width="25" height="35" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="115" y="105" width="25" height="35" rx="2" fill="#38bdf8" />
    <rect x="150" y="105" width="25" height="35" rx="2" fill="#38bdf8" />
  </g>

  <!-- Atmospheric Glow for Office Entrance/Interior -->
  <polygon points="60,190 180,190 200,220 40,220" fill="url(#indoorLight)" />

  <!-- Floor -->
  <path d="M 0,190 L 240,190 L 240,240 L 0,240 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#64748b" stroke-width="3" />

  <!-- Modern Office Entrance Canopy / Architecture -->
  <g filter="url(#shadow)">
    <!-- Pillars -->
    <rect x="50" y="100" width="12" height="90" fill="#cbd5e1" />
    <rect x="50" y="100" width="4" height="90" fill="#94a3b8" />
    
    <rect x="178" y="100" width="12" height="90" fill="#cbd5e1" />
    <rect x="178" y="100" width="4" height="90" fill="#94a3b8" />

    <!-- Glass Double Doors -->
    <rect x="68" y="115" width="50" height="75" rx="2" fill="url(#windowGlow)" stroke="#f8fafc" stroke-width="2" />
    <line x1="112" y1="115" x2="112" y2="190" stroke="#f8fafc" stroke-width="2" />
    <!-- Door Handles -->
    <circle cx="106" cy="155" r="2.5" fill="#fbbf24" />
    <circle cx="118" cy="155" r="2.5" fill="#fbbf24" />

    <rect x="122" y="115" width="50" height="75" rx="2" fill="url(#windowGlow)" stroke="#f8fafc" stroke-width="2" />
    <line x1="122" y1="115" x2="122" y2="190" stroke="#f8fafc" stroke-width="2" />
    <!-- Door Handles -->
    <circle cx="128" cy="155" r="2.5" fill="#fbbf24" />
    <circle cx="140" cy="155" r="2.5" fill="#fbbf24" />

    <!-- Canopy Top Structure -->
    <path d="M 35,100 L 205,100 L 195,85 L 45,85 Z" fill="#334155" stroke="#64748b" stroke-width="2" />
    <!-- Warm recessed lighting under canopy -->
    <ellipse cx="70" cy="92" rx="6" ry="2" fill="#fbbf24" />
    <ellipse cx="120" cy="92" rx="6" ry="2" fill="#fbbf24" />
    <ellipse cx="170" cy="92" rx="6" ry="2" fill="#fbbf24" />
  </g>

  <!-- Official Institution Plaque/Sign (Represents the "Unit/Workplace" identity) -->
  <g filter="url(#shadow)">
    <rect x="96" y="52" width="48" height="26" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
    <!-- Abstract representation of official emblem / lines on plaque -->
    <circle cx="120" cy="61" r="5" fill="#fbbf24" />
    <line x1="104" y1="70" x2="136" y2="70" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground Elements: Professional Character arriving at work -->
  <g filter="url(#shadow)">
    <!-- Walking Professional Character -->
    <!-- Briefcase -->
    <rect x="152" y="165" width="14" height="10" rx="2" fill="#b45309" />
    <path d="M 157,165 C 157,162 163,162 163,165" stroke="#b45309" stroke-width="1.5" fill="none" />

    <!-- Legs -->
    <path d="M 132,175 L 128,210 L 138,210" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 142,175 L 148,205 L 158,205" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Suit Torso -->
    <path d="M 130,135 L 150,135 L 155,175 L 128,175 Z" fill="#3b82f6" />
    <!-- Shirt collar & Tie -->
    <polygon points="140,135 145,145 140,155 135,145" fill="#ef4444" />
    <polygon points="138,135 142,135 140,140" fill="#f8fafc" />

    <!-- Head & Hair -->
    <circle cx="140" cy="120" r="11" fill="#fcd34d" />
    <path d="M 129,118 C 130,110 150,110 151,118 C 148,114 132,114 129,118 Z" fill="#1e293b" />

    <!-- Arm holding briefcase -->
    <path d="M 148,140 L 158,160" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" />
    <circle cx="159" cy="162" r="3" fill="#fcd34d" />
  </g>

  <!-- Decorative Greenery/Planter for realism (Corporate Environment) -->
  <g filter="url(#shadow)">
    <!-- Planter Pot Left -->
    <path d="M 15,175 L 35,175 L 32,210 L 18,210 Z" fill="#64748b" />
    <!-- Plants -->
    <circle cx="25" cy="170" r="14" fill="#10b981" />
    <circle cx="18" cy="165" r="10" fill="#059669" />
    <circle cx="32" cy="165" r="10" fill="#34d399" />
  </g>

  <g filter="url(#shadow)">
    <!-- Planter Pot Right -->
    <path d="M 205,175 L 225,175 L 222,210 L 208,210 Z" fill="#64748b" />
    <!-- Plants -->
    <circle cx="215" cy="170" r="14" fill="#10b981" />
    <circle cx="208" cy="165" r="10" fill="#059669" />
    <circle cx="222" cy="165" r="10" fill="#34d399" />
  </g>

  <!-- Ambient Light Sparks/Highlights -->
  <circle cx="190" cy="50" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="50" cy="45" r="1" fill="#38bdf8" opacity="0.8" />
  <circle cx="100" cy="30" r="2" fill="#fbbf24" opacity="0.6" />
</svg>