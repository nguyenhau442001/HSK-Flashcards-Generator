<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk / Environment Gradients -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Character Color Palettes -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glows & Accents -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="errorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting (Desk Lamp Glow) -->
  <circle cx="190" cy="50" r="90" fill="url(#lampGlow)"/>

  <!-- Background Environment / Window sill & Bookshelf hints -->
  <path d="M20 70 L90 50 L90 140 L20 160 Z" fill="#1e293b" opacity="0.4"/>
  <rect x="25" y="80" width="12" height="40" rx="3" fill="#475569"/>
  <rect x="40" y="75" width="10" height="45" rx="3" fill="#0ea5e9"/>
  <rect x="53" y="85" width="14" height="35" rx="3" fill="#10b981"/>

  <!-- Desk Surface -->
  <path d="M0 165 C 60 160, 180 160, 240 165 L 240 240 L 0 240 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  
  <!-- Desk Edge Highlight -->
  <path d="M0 165 C 60 160, 180 160, 240 165" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Prop: Open Document / Paper with Red Marks (Errors) -->
  <g transform="translate(115, 150) rotate(-6)" filter="url(#shadow)">
    <!-- Paper Sheet -->
    <rect x="-45" y="-35" width="90" height="70" rx="4" fill="url(#paperGrad)"/>
    <!-- Mock Text Lines (Abstracted squiggles) -->
    <rect x="-35" y="-22" width="45" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="-35" y="-12" width="60" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="-35" y="-2" width="30" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="-35" y="8" width="55" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="-35" y="18" width="40" height="4" rx="2" fill="#cbd5e1"/>
    
    <!-- Big Red "X" Error Marks signifying Mistakes -->
    <g stroke="#ef4444" stroke-width="3.5" stroke-linecap="round">
      <path d="M 18 -15 L 28 -5"/>
      <path d="M 28 -15 L 18 -5"/>
      
      <path d="M 5 12 L 15 22"/>
      <path d="M 15 12 L 5 22"/>
    </g>
    <!-- Red circle highlighting an error -->
    <ellipse cx="-15" cy="3" rx="15" ry="8" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2" transform="rotate(-10)"/>
  </g>

  <!-- Prop: Coffee Mug -->
  <g transform="translate(200, 175)" filter="url(#shadow)">
    <rect x="-10" y="-15" width="20" height="25" rx="3" fill="#f8fafc"/>
    <path d="M 10 -8 C 16 -8, 16 0, 10 2" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M -4 -22 C -6 -28, 2 -32, 0 -38" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- CHARACTER: Frustrated Student / Worker realizing a mistake -->
  <g transform="translate(75, 125)" filter="url(#shadow)">
    
    <!-- Torso & Hoodie -->
    <path d="M -35 75 C -35 45, -15 35, 0 35 C 15 35, 35 45, 35 75 Z" fill="url(#hoodieGrad)"/>
    <!-- Hoodie Strings -->
    <path d="M -8 40 L -12 60" fill="none" stroke="#f0fdf4" stroke-width="2" stroke-linecap="round"/>
    <path d="M 8 40 L 12 60" fill="none" stroke="#f0fdf4" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="-8" y="20" width="16" height="20" rx="6" fill="#fcd34d"/>

    <!-- Head & Hair Group -->
    <g transform="translate(0, -5)">
      
      <!-- Back Hair -->
      <circle cx="0" cy="0" r="32" fill="url(#hairGrad)"/>

      <!-- Face Base -->
      <rect x="-26" y="-24" width="52" height="52" rx="24" fill="#fde68a"/>

      <!-- Surprised/Worried Eyebrows (Slanted high, expressing realization of error) -->
      <path d="M -18 -8 L -8 -13" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
      <path d="M 8 -13 L 18 -8" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

      <!-- Wide Expressive Eyes with Sweat/Shock -->
      <circle cx="-12" cy="-3" r="5" fill="#0f172a"/>
      <circle cx="12" cy="-3" r="5" fill="#0f172a"/>
      <!-- Eye Highlights -->
      <circle cx="-14" cy="-5" r="1.5" fill="#ffffff"/>
      <circle cx="10" cy="-5" r="1.5" fill="#ffffff"/>

      <!-- Sweat Drop (Classic Manga sign of panic/mistake) -->
      <path d="M 22 -12 C 26 -4, 30 -4, 30 2 C 30 6, 26 8, 22 2 C 18 -4, 18 -8, 22 -12 Z" fill="#38bdf8" filter="url(#shadow)"/>

      <!-- O-shaped Open Mouth (Realization) -->
      <ellipse cx="0" cy="12" rx="5" ry="7" fill="#78350f"/>
      <path d="M -5 10 Q 0 8 5 10" fill="none" stroke="#fde68a" stroke-width="2"/>

      <!-- Front Hair Bangs -->
      <path d="M -28 -10 C -25 -25, -5 -28, 5 -25 C 18 -22, 26 -15, 28 -10 C 22 -26, -10 -26, -28 -10 Z" fill="url(#hairGrad)"/>
    </g>

    <!-- Hands in hair / head-scratching pose (Embodying "Oops / Error") -->
    <!-- Left Hand -->
    <path d="M -32 -25 C -40 -35, -25 -45, -20 -35 C -18 -32, -22 -28, -25 -25 Z" fill="#fcd34d" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -30 -15 C -45 -18, -35 -32, -30 -25" fill="none" stroke="url(#hoodieGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Right Hand -->
    <path d="M 32 -25 C 40 -35, 25 -45, 20 -35 C 18 -32, 22 -28, 25 -25 Z" fill="#fcd34d" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 30 -15 C 45 -18, 35 -32, 30 -25" fill="none" stroke="url(#hoodieGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Glowing Error Indicator Elements (Floating Abstract Warning symbols - NO TEXT, purely visual glow) -->
  <g transform="translate(170, 70)">
    <circle cx="0" cy="0" r="16" fill="url(#errorGlow)"/>
    <!-- Warning exclamation / Error visual mark inside ambient glow -->
    <path d="M 0 -8 L 0 2 M 0 7 L 0 9" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Secondary ambient sparkle / lighting -->
  <path d="M 50 40 L 52 46 L 58 48 L 52 50 L 50 56 L 48 50 L 42 48 L 48 46 Z" fill="#fbbf24" opacity="0.4"/>
  <path d="M 190 120 L 191 123 L 194 124 L 191 125 L 190 128 L 189 125 L 186 124 L 189 123 Z" fill="#38bdf8" opacity="0.6"/>

</svg>