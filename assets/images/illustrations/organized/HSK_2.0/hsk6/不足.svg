<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Gradient for the Lantern/Energy -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Battery Bar Green Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light/Atmosphere -->
  <circle cx="120" cy="130" r="80" fill="url(#glowGrad)" />

  <!-- SCENE: Workshop Bench / Construction Desk -->
  <g id="workshop-environment">
    <!-- Back wall shelf line -->
    <path d="M 30,70 L 210,70" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Props on shelf: Tools / Blueprints -->
    <rect x="45" y="45" width="22" height="25" rx="3" fill="#38bdf8" opacity="0.8" />
    <path d="M 49,53 L 63,53 M 49,59 L 58,59" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="180" cy="57" r="12" fill="#475569" />
    <path d="M 180,45 L 180,57 L 188,57" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Workbench Surface -->
    <path d="M 20,185 L 220,185 L 210,210 L 30,210 Z" fill="#0f172a" filter="url(#shadow)"/>
    <path d="M 20,185 L 220,185" stroke="#475569" stroke-width="3"/>
    <!-- Wood grain accent -->
    <path d="M 60,195 L 140,195" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: The Incomplete Machine / Deficit Concept -->
  <!-- Context: A mechanical device missing a crucial piece, showing "Not Enough" (不足) -->
  <g id="main-mechanism" filter="url(#shadow)">
    <!-- Base Machine Chassis -->
    <rect x="75" y="90" width="90" height="95" rx="12" fill="url(#metalGrad)" stroke="#64748b" stroke-width="3"/>
    
    <!-- Inner Working Cogs & Gears (Partially visible) -->
    <circle cx="100" cy="125" r="18" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <path d="M 100,105 L 100,145 M 80,125 L 120,125" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="125" r="6" fill="#fb923c"/>

    <!-- THE MISSING PART ZONE (Dotted empty socket where a gear/battery should go) -->
    <circle cx="150" cy="125" r="20" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4"/>
    
    <!-- Warning Indicator Light (Flashing Amber for "Insufficient") -->
    <circle cx="120" cy="102" r="5" fill="#ef4444"/>
    <circle cx="120" cy="102" r="8" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="5;12;5" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Energy Gauge (Low Level / Deficit) -->
    <rect x="90" y="155" width="60" height="14" rx="7" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Only 1/4 filled to vividly show "Bu Zu / Not Enough" -->
    <rect x="92" y="157" width="18" height="10" rx="5" fill="#ef4444"/>
    <line x1="120" y1="155" x2="120" y2="169" stroke="#334155" stroke-width="2"/>
    <line x1="135" y1="155" x2="135" y2="169" stroke="#334155" stroke-width="2"/>

    <!-- Loose Sparks / Energy Leak from the missing spot -->
    <path d="M 165,115 L 175,110" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 162,135 L 172,140" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="178" cy="123" r="2" fill="#fbbf24"/>
  </g>

  <!-- FOREGROUND PROPS: The Missing Piece lying nearby (emphasizing "not yet complete / lacking") -->
  <g id="missing-gear-prop" filter="url(#shadow)">
    <!-- A golden gear resting on the workbench table -->
    <g transform="translate(55, 160)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
      <!-- Gear teeth representation -->
      <rect x="-3" y="-20" width="6" height="6" rx="1" fill="#f59e0b"/>
      <rect x="-3" y="14" width="6" height="6" rx="1" fill="#f59e0b"/>
      <rect x="-20" y="-3" width="6" height="6" rx="1" fill="#f59e0b"/>
      <rect x="14" y="-3" width="6" height="6" rx="1" fill="#f59e0b"/>
      <!-- Center hole -->
      <circle cx="0" cy="0" r="6" fill="#0f172a"/>
    </g>
    <!-- Motion lines indicating it needs to be placed in -->
    <path d="M 75,152 C 95,145 110,138 130,130" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
  </g>

  <!-- Additional Contextual Elements: Wrench / Tools -->
  <g id="wrench" transform="translate(180, 145) rotate(25)" filter="url(#shadow)">
    <path d="M -15,0 L 15,0" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-16" cy="0" r="7" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="16" cy="0" r="6" fill="#94a3b8"/>
  </g>

  <!-- Ambient Floating Dust / Sparkles for Scene Depth -->
  <circle cx="35" cy="110" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="205" cy="95" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="195" cy="170" r="1" fill="#38bdf8" opacity="0.5"/>
  <circle cx="45" cy="150" r="1.5" fill="#f59e0b" opacity="0.7"/>

</svg>