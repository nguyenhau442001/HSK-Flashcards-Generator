<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Monitor Frame Gradient -->
    <linearGradient id="monitor-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Gradient -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glow & Accent Gradients -->
    <linearGradient id="code-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="stream-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements (Desk & Ambient Light) -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#0b0f19" />
  <ellipse cx="120" cy="195" rx="100" ry="8" fill="#1e293b" opacity="0.5" />
  
  <!-- Desk Lamp Light Cone Backdrop -->
  <polygon points="120,25 210,195 30,195" fill="#38bdf8" opacity="0.03" />

  <!-- MAIN SUBJECT: Futuristic Holographic Programming Setup -->
  <g filter="url(#shadow)">
    <!-- Monitor Stand -->
    <path d="M 105 165 L 135 165 L 140 190 L 100 190 Z" fill="#475569" />
    <rect x="85" y="185" width="70" height="8" rx="4" fill="#334155" />

    <!-- Monitor Outer Casing -->
    <rect x="36" y="35" width="168" height="135" rx="12" fill="url(#monitor-frame)" />
    
    <!-- Monitor Inner Bezel -->
    <rect x="42" y="41" width="156" height="123" rx="8" fill="url(#screen-grad)" />

    <!-- Screen Scanlines / Grid Effect (Subtle) -->
    <path d="M 42 60 L 198 60 M 42 90 L 198 90 M 42 120 L 198 120 M 42 150 L 198 150" stroke="#1e293b" stroke-width="0.5" opacity="0.4" />

    <!-- CODE BLOCKS REPRESENTING 'CHƯƠNG TRÌNH' (PROGRAM/SEQUENCE) -->
    <!-- Execution Stream Lines (Falling data / speed visualization) -->
    <rect x="52" y="52" width="6" height="80" rx="3" fill="url(#stream-grad)" />
    <rect x="64" y="60" width="4" height="40" rx="2" fill="url(#stream-grad)" opacity="0.7" />

    <!-- Structured Code Lines (Visualizing precise sequence/structure) -->
    <g transform="translate(78, 52)">
      <!-- Line 1: Function Header -->
      <rect x="0" y="0" width="35" height="6" rx="3" fill="#f43f5e" />
      <rect x="40" y="0" width="55" height="6" rx="3" fill="#38bdf8" />
      <circle cx="103" cy="3" r="3" fill="#fbbf24" />

      <!-- Line 2: Nested Block 1 -->
      <rect x="12" y="14" width="20" height="5" rx="2.5" fill="#a855f7" />
      <rect x="36" y="14" width="45" height="5" rx="2.5" fill="#94a3b8" />

      <!-- Line 3: Nested Block 2 -->
      <rect x="12" y="26" width="65" height="5" rx="2.5" fill="#10b981" />
      <rect x="81" y="26" width="15" height="5" rx="2.5" fill="#f43f5e" />

      <!-- Line 4: Condition / Loop -->
      <rect x="0" y="38" width="25" height="5" rx="2.5" fill="#fb923c" />
      <rect x="29" y="38" width="50" height="5" rx="2.5" fill="#38bdf8" />

      <!-- Line 5: Inner execution -->
      <rect x="12" y="50" width="40" height="5" rx="2.5" fill="#94a3b8" />

      <!-- Line 6: Closing block -->
      <rect x="0" y="62" width="15" height="5" rx="2.5" fill="#f43f5e" />
    </g>

    <!-- Speed/Action Element: Glowing Execution Path / Arrow Flow -->
    <g transform="translate(145, 115)" filter="url(#glow)">
      <path d="M 0 15 C 10 10, 20 0, 35 0 C 45 0, 50 10, 45 20 C 40 30, 20 35, 15 45" fill="none" stroke="url(#accent-orange)" stroke-width="4" stroke-linecap="round" />
      <!-- Arrowhead -->
      <polygon points="12,38 22,48 5,50" fill="#f59e0b" />
    </g>

    <!-- Floating UI/Data Node Badges (Contextualizing digital environment) -->
    <g transform="translate(160, 50)">
      <rect x="0" y="0" width="30" height="18" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="8" cy="9" r="3" fill="#10b981" />
      <rect x="14" y="7" width="10" height="4" rx="2" fill="#10b981" opacity="0.7" />
    </g>
  </g>

  <!-- FOREGROUND / DESK ACCESSORIES -->
  <!-- Coffee Mug (Adds authentic real-world workspace feel) -->
  <g transform="translate(25, 160)" filter="url(#shadow)">
    <!-- Mug body -->
    <path d="M 6 5 L 22 5 C 22 5, 25 22, 22 28 C 19 34, 9 34, 6 28 C 3 22, 6 5, 6 5 Z" fill="#3b82f6" />
    <!-- Mug handle -->
    <path d="M 21 10 C 28 10, 28 23, 21 23" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
    <!-- Coffee Surface -->
    <ellipse cx="14" cy="7" rx="8" ry="2" fill="#78350f" />
    <!-- Steam / Warmth -->
    <path d="M 10 -2 C 10 -6, 14 -6, 14 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Mechanical Keyboard Edge (Bottom Left) -->
  <g transform="translate(55, 185)" filter="url(#shadow)">
    <rect x="0" y="0" width="65" height="15" rx="3" fill="#334155" />
    <!-- Keycaps rows -->
    <rect x="3" y="3" width="6" height="4" rx="1" fill="#64748b" />
    <rect x="11" y="3" width="6" height="4" rx="1" fill="#64748b" />
    <rect x="19" y="3" width="6" height="4" rx="1" fill="#64748b" />
    <rect x="27" y="3" width="6" height="4" rx="1" fill="#64748b" />
    <rect x="35" y="3" width="6" height="4" rx="1" fill="#64748b" />
    <rect x="43" y="3" width="6" height="4" rx="1" fill="#38bdf8" /> <!-- Accent key representing 'run' -->
    <rect x="51" y="3" width="11" height="4" rx="1" fill="#64748b" />

    <rect x="3" y="9" width="9" height="4" rx="1" fill="#64748b" />
    <rect x="14" y="9" width="30" height="4" rx="1" fill="#64748b" /> <!-- Spacebar -->
    <rect x="46" y="9" width="16" height="4" rx="1" fill="#64748b" />
  </g>

  <!-- Floating Digital Particle Sparks (Action & Atmosphere) -->
  <circle cx="40" cy="40" r="2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="205" cy="90" r="1.5" fill="#fb923c" filter="url(#glow)" />
  <circle cx="130" cy="25" r="2" fill="#10b981" filter="url(#glow)" />
  <circle cx="195" cy="165" r="1" fill="#f43f5e" />
  <circle cx="25" cy="120" r="1.5" fill="#a855f7" />

  <!-- Ambient Light Reflection on Top Border -->
  <rect x="0" y="0" width="240" height="3" fill="#38bdf8" opacity="0.3" />
</svg>