<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Plate Gradient -->
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <!-- Warm Glow for Action/Reaction -->
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Warning Glow behind the character -->
  <circle cx="120" cy="115" r="80" fill="url(#alertGlow)" />

  <!-- SCENE LAYER: Dining Table / Surface -->
  <path d="M 20 185 L 220 185 L 235 225 L 5 225 Z" fill="#334155" opacity="0.6" />
  <ellipse cx="120" cy="185" rx="100" ry="12" fill="#475569" />

  <!-- Seafood Plate -->
  <ellipse cx="120" cy="170" rx="75" ry="32" fill="url(#plateGrad)" filter="url(#shadow)" />
  <ellipse cx="120" cy="170" rx="65" ry="26" fill="#f1f5f9" />

  <!-- Shrimp / Prawn (Allergen Context) -->
  <g transform="translate(95, 150) rotate(-15)" filter="url(#shadow)">
    <!-- Shrimp Body -->
    <path d="M 10 25 Q 30 0 50 15 Q 60 25 50 35 Q 35 30 20 35 Z" fill="#f97316" />
    <path d="M 25 12 Q 38 -2 48 10" stroke="#fdba74" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Shrimp Tail -->
    <path d="M 50 25 L 62 18 L 58 35 Z" fill="#ea580c" />
  </g>

  <!-- Steamed Crab (Allergen Context) -->
  <g transform="translate(130, 155) rotate(10)" filter="url(#shadow)">
    <!-- Shell -->
    <ellipse cx="20" cy="15" rx="18" ry="12" fill="#ef4444" />
    <!-- Claws -->
    <path d="M 5 8 Q -5 0 2 -5 M 35 8 Q 45 0 38 -5" stroke="#dc2626" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="12" cy="12" r="2" fill="#fca5a5" />
    <circle cx="28" cy="12" r="2" fill="#fca5a5" />
  </g>

  <!-- CHARACTER: Person reacting with allergy symptoms -->
  <!-- Neck & Shoulders -->
  <path d="M 95 160 C 95 145 145 145 145 160 L 165 195 L 75 195 Z" fill="#3b82f6" />
  <path d="M 105 150 L 135 150 L 140 165 L 100 165 Z" fill="#fbcfe8" /> <!-- Neck -->

  <!-- Head Base -->
  <circle cx="120" cy="115" r="38" fill="#fbcfe8" filter="url(#shadow)" />

  <!-- Hair (Messy/Animated style) -->
  <path d="M 82 110 C 80 85 100 75 120 75 C 140 75 160 85 158 115 C 158 115 150 90 120 90 C 90 90 82 110 82 110 Z" fill="#0f172a" />
  <circle cx="88" cy="105" r="8" fill="#0f172a" />
  <circle cx="152" cy="105" r="7" fill="#0f172a" />

  <!-- Allergic Reaction: Red Flush / Cheeks -->
  <ellipse cx="98" cy="122" rx="8" ry="5" fill="#f43f5e" opacity="0.6" />
  <ellipse cx="142" cy="122" rx="8" ry="5" fill="#f43f5e" opacity="0.6" />

  <!-- Allergic Reaction: Hives / Spots on Face & Forehead -->
  <circle cx="104" cy="102" r="3.5" fill="#e11d48" opacity="0.8" />
  <circle cx="132" cy="98" r="4" fill="#e11d48" opacity="0.8" />
  <circle cx="112" cy="94" r="3" fill="#e11d48" opacity="0.8" />
  <circle cx="92" cy="118" r="3" fill="#e11d48" opacity="0.8" />
  <circle cx="148" cy="116" r="3.5" fill="#e11d48" opacity="0.8" />

  <!-- Eyes (Squeezed shut / Dizzy / Uncomfortable) -->
  <!-- Left Eye -->
  <path d="M 96 112 Q 102 106 108 112" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Right Eye -->
  <path d="M 132 112 Q 138 106 144 112" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Eyebrows (Worried/Pained angle) -->
  <path d="M 94 104 L 106 108" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 146 104 L 134 108" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Mouth (Wincing / Gasping) -->
  <path d="M 112 128 Q 120 122 128 128 Q 128 136 120 136 Q 112 136 112 128 Z" fill="#0f172a" />

  <!-- Sweat Drops (Emphasizing distress) -->
  <path d="M 80 95 C 80 95 74 102 74 106 C 74 110 77 112 80 112 C 83 112 86 110 86 106 C 86 102 80 95 80 95 Z" fill="#38bdf8" opacity="0.9" />
  <path d="M 160 110 C 160 110 155 116 155 119 C 155 122 157 124 160 124 C 163 124 165 122 165 119 C 165 116 160 110 160 110 Z" fill="#38bdf8" opacity="0.9" />

  <!-- ACTION & EFFECT: Scratching / Hands & Itchy Sparkles -->
  <!-- Left Hand scratching cheek -->
  <g transform="translate(75, 125) rotate(-25)">
    <rect x="0" y="0" width="14" height="22" rx="7" fill="#fbcfe8" filter="url(#shadow)" />
    <circle cx="7" cy="0" r="7" fill="#fbcfe8" />
  </g>
  <!-- Itch/Scratch Effect Lines near left hand -->
  <path d="M 62 115 L 72 125 M 58 125 L 68 135" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Floating Allergy/Irritation Indicators (Red Sparkles / Zaps) -->
  <g stroke="#ef4444" stroke-width="2" stroke-linecap="round">
    <line x1="68" y1="85" x2="76" y2="93" />
    <line x1="76" y1="85" x2="68" y2="93" />

    <line x1="164" y1="88" x2="172" y2="96" />
    <line x1="172" y1="88" x2="164" y2="96" />

    <line x1="155" y1="140" x2="163" y2="148" />
    <line x1="163" y1="140" x2="155" y2="148" />
  </g>

  <!-- Foreground Atmospheric Elements (Subtle floating warning particles) -->
  <circle cx="45" cy="110" r="2" fill="#fb923c" opacity="0.6" />
  <circle cx="195" cy="130" r="3" fill="#fb923c" opacity="0.5" />
  <circle cx="55" cy="160" r="1.5" fill="#f43f5e" opacity="0.7" />
  <circle cx="185" cy="80" r="2.5" fill="#f43f5e" opacity="0.6" />
</svg>