<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Desktop Setup (The "Other Side") -->
  <g transform="translate(40, 60)">
    <!-- Monitor -->
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#475569"/>
    <rect x="10" y="10" width="140" height="80" rx="4" fill="#0f172a"/>
    <!-- Screen Glare/Activity -->
    <circle cx="80" cy="50" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <path d="M70 50 L90 50 M80 40 L80 60" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Keyboard -->
    <rect x="20" y="115" width="120" height="20" rx="4" fill="#64748b"/>
    <rect x="25" y="120" width="110" height="10" rx="2" fill="#94a3b8"/>
  </g>
  
  <!-- Decorative elements representing the "other side" connection -->
  <circle cx="200" cy="40" r="8" fill="#fb923c"/>
  <circle cx="215" cy="55" r="4" fill="#fbbf24"/>
  
  <!-- Connection pulse lines -->
  <path d="M180 80 Q200 60 220 80" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Coffee Mug for context -->
  <rect x="180" y="130" width="30" height="35" rx="4" fill="#ec4899"/>
  <path d="M210 135 L220 135 L220 150 L210 150" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>