<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Balcony Railing -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <rect x="20" y="170" width="200" height="15" rx="2" fill="#475569"/>
  
  <!-- Princess Figure -->
  <g transform="translate(120, 140)">
    <!-- Dress -->
    <path d="M-50 80 C-70 30, -40 0, 0 0 C40 0, 70 30, 50 80 Z" fill="#ec4899"/>
    <path d="M-50 80 L-60 95 L60 95 L50 80 Z" fill="#db2777"/>
    <!-- Torso -->
    <path d="M-20 0 C-20 -30, 20 -30, 20 0 Z" fill="#fce7f3"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="22" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-22 -40 C-22 -65, 22 -65, 22 -40 L22 -20 C22 -10, 10 -5, 0 -5 C-10 -5, -22 -10, -22 -20 Z" fill="#fbbf24"/>
    <!-- Crown -->
    <path d="M-12 -58 L-8 -72 L0 -62 L8 -72 L12 -58 Z" fill="#f59e0b"/>
  </g>
  
  <!-- Background Elements -->
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.2"/>
  <path d="M30 120 Q60 80 90 120 T150 120" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M150 140 Q180 100 210 140" stroke="#10b981" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Stars -->
  <circle cx="40" cy="40" r="2" fill="#ffffff"/>
  <circle cx="200" cy="30" r="1.5" fill="#ffffff"/>
  <circle cx="30" cy="150" r="2" fill="#ffffff"/>
</svg>