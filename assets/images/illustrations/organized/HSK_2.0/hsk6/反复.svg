<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="150" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Stack of Papers -->
  <rect x="60" y="120" width="120" height="40" rx="4" fill="#cbd5e1"/>
  <rect x="65" y="115" width="110" height="40" rx="4" fill="#e2e8f0"/>
  <rect x="70" y="110" width="100" height="40" rx="4" fill="#f8fafc"/>
  
  <!-- The Action: Repeated Checking -->
  <!-- Hand -->
  <path d="M140 130 C 140 110, 160 100, 170 110 L 180 130 L 160 140 Z" fill="#fbbf24"/>
  <circle cx="175" cy="115" r="12" fill="#fbbf24"/>
  
  <!-- Motion Lines indicating repetition -->
  <path d="M185 100 Q 200 90 215 100" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M185 85 Q 200 75 215 85" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Magnifying Glass -->
  <circle cx="150" cy="100" r="20" stroke="#fb923c" stroke-width="6" fill="none"/>
  <line x1="165" y1="115" x2="190" y2="140" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Checked Marks (Abstracted as simple shapes, not text) -->
  <path d="M80 120 L 90 130 L 110 110" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M80 135 L 90 145 L 110 125" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M80 150 L 90 160 L 110 140" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Ambient Glow -->
  <circle cx="150" cy="100" r="30" fill="#fbbf24" opacity="0.1"/>
</svg>