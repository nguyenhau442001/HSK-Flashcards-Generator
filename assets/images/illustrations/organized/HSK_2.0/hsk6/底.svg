<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glass Liquid Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glass Body Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Floor Shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </radialGradient>

    <!-- Glow effect for bottom focus -->
    <radialGradient id="bottomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background shapes/bubbles -->
  <circle cx="50" cy="60" r="15" fill="#334155" opacity="0.3" />
  <circle cx="190" cy="90" r="25" fill="#334155" opacity="0.2" />
  <path d="M20,180 Q120,200 220,180" stroke="#334155" stroke-width="1.5" fill="none" opacity="0.4" />

  <!-- Floor Shadow -->
  <ellipse cx="120" cy="195" rx="75" ry="14" fill="url(#floorShadow)" />

  <!-- Focused Glow at the "Bottom" (Đáy) -->
  <ellipse cx="120" cy="178" rx="55" ry="10" fill="url(#bottomGlow)" />

  <!-- Table Surface -->
  <path d="M30,185 L210,185 L225,215 L15,215 Z" fill="#090d16" opacity="0.7" />
  <line x1="30" y1="185" x2="210" y2="185" stroke="#334155" stroke-width="2" />

  <!-- SCENE: Glass Cup (Transparent Container) -->
  <!-- Back Rim -->
  <ellipse cx="120" cy="75" rx="52" ry="12" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.8" />

  <!-- Liquid Content Inside -->
  <path d="M 70,85 
           Q 70,165 77,173 
           C 85,182 155,182 163,173 
           Q 170,165 170,85 Z" 
        fill="url(#liquidGrad)" />

  <!-- INTERNAL BOTTOM (ĐÁY CỐC): Detailed bottom curve and sediment -->
  <!-- Sediment/Dirt particles at the exact bottom (representing 'Đáy cốc có hơi bẩn') -->
  <g opacity="0.9">
    <ellipse cx="120" cy="177" rx="35" ry="5" fill="#b45309" opacity="0.4" />
    <!-- Dirt Specks -->
    <circle cx="105" cy="178" r="3" fill="#78350f" />
    <circle cx="112" cy="180" r="2" fill="#78350f" />
    <circle cx="125" cy="177" r="3.5" fill="#92400e" />
    <circle cx="135" cy="179" r="2.5" fill="#78350f" />
    <circle cx="98" cy="176" r="1.5" fill="#b45309" />
    <circle cx="143" cy="177" r="2" fill="#92400e" />
    
    <!-- Tiny floating sediment particles -->
    <circle cx="115" cy="165" r="1" fill="#b45309" opacity="0.7" />
    <circle cx="130" cy="155" r="1.5" fill="#92400e" opacity="0.6" />
    <circle cx="100" cy="160" r="1" fill="#78350f" opacity="0.7" />
  </g>

  <!-- Rising Bubbles inside liquid -->
  <circle cx="100" cy="130" r="2.5" fill="#ffffff" opacity="0.6" />
  <circle cx="103" cy="120" r="1.5" fill="#ffffff" opacity="0.4" />
  <circle cx="140" cy="140" r="2" fill="#ffffff" opacity="0.5" />

  <!-- Glass Body Outlines and Highlights -->
  <path d="M68,75 L73,178 Q77,188 120,188 Q163,188 167,178 L172,75" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Front Rim Overlay -->
  <ellipse cx="120" cy="75" rx="52" ry="12" fill="none" stroke="#e2e8f0" stroke-width="2.5" />
  <ellipse cx="120" cy="73" rx="50" ry="10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" />

  <!-- Glass Specular Highlights (Shine) -->
  <path d="M76,90 Q74,130 80,165" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M162,90 Q164,120 159,150" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3" />

  <!-- FOCUS ARROW / POINTER DIRECTED AT THE BOTTOM (ĐÁY) -->
  <g transform="translate(0, 5)">
    <!-- Attention Ring / Pulse -->
    <ellipse cx="120" cy="183" rx="42" ry="8" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </ellipse>

    <!-- Side indicator arrows pointing specifically to the bottom rim -->
    <g transform="translate(0, 0)">
      <!-- Left Arrow -->
      <path d="M 50,175 L 72,180 L 50,185 Z" fill="#fbbf24" />
      <rect x="30" y="178" width="22" height="4" rx="2" fill="#fbbf24" />
      
      <!-- Right Arrow -->
      <path d="M 190,175 L 168,180 L 190,185 Z" fill="#fbbf24" />
      <rect x="188" y="178" width="22" height="4" rx="2" fill="#fbbf24" />
    </g>
  </g>

  <!-- Cute magnifying glass inspecting the bottom corner -->
  <g transform="translate(155, 135) rotate(-15)">
    <!-- Glass lens circle -->
    <circle cx="0" cy="0" r="18" fill="#38bdf8" fill-opacity="0.2" stroke="#fbbf24" stroke-width="3" />
    <!-- Lens reflection -->
    <path d="M-10,-6 Q0,-12 8,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8" />
    <!-- Magnifier Handle -->
    <rect x="-3" y="16" width="6" height="22" rx="3" fill="#64748b" />
    <rect x="-1.5" y="16" width="3" height="22" rx="1.5" fill="#94a3b8" />
  </g>

  <!-- Sparkles for visual charm -->
  <path d="M 45,100 L 48,105 L 53,108 L 48,111 L 45,116 L 42,111 L 37,108 L 42,105 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M 195,50 L 197,54 L 201,56 L 197,58 L 195,62 L 193,58 L 189,56 L 193,54 Z" fill="#38bdf8" opacity="0.9" />
</svg>