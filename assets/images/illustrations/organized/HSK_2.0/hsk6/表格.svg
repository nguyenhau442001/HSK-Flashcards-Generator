<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332211"/>
      <stop offset="100%" stop-color="#1a1109"/>
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Clipboard Base Gradient -->
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Warm Desk Surface at Bottom -->
  <path d="M0,180 Q120,165 240,180 L240,240 L0,240 Z" fill="url(#desk-grad)"/>
  <path d="M0,180 Q120,165 240,180" fill="none" stroke="#451a03" stroke-width="2"/>

  <!-- Ambient Light Effect behind Clipboard -->
  <circle cx="120" cy="110" r="70" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- SCENE: Clipboard with Form (Biểu mẫu) -->
  <g filter="url(#shadow)">
    <!-- Clipboard Wooden Base -->
    <rect x="65" y="45" width="110" height="150" rx="10" ry="10" fill="url(#board-grad)"/>
    <rect x="65" y="45" width="110" height="150" rx="10" ry="10" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>

    <!-- Metal Clip (Top) -->
    <path d="M95,45 L145,45 L145,58 C145,61.3 142.3,64 139,64 L101,64 C97.7,64 95,61.3 95,58 Z" fill="#64748b"/>
    <rect x="102" y="50" width="36" height="8" rx="3" fill="#cbd5e1"/>
    <!-- Clip Handle -->
    <path d="M107,41 L133,41 C135,41 136,42 136,44 L104,44 C104,42 105,41 107,41 Z" fill="#475569"/>

    <!-- Paper Sheet (The Form / Biểu mẫu) -->
    <rect x="75" y="65" width="90" height="122" rx="4" fill="url(#paper-grad)"/>

    <!-- Header / Title Graphic on Form -->
    <rect x="87" y="77" width="40" height="6" rx="2" fill="#3b82f6"/>
    <circle cx="145" cy="80" r="4" fill="#10b981"/>

    <!-- Table Grid / Form Rows (Biểu mẫu structure) -->
    <!-- Row 1 -->
    <rect x="85" y="93" width="70" height="14" rx="2" fill="#e2e8f0"/>
    <rect x="89" y="97" width="20" height="6" rx="1" fill="#94a3b8"/>
    <circle cx="147" cy="100" r="4" fill="#3b82f6" opacity="0.8"/>
    <!-- Checkmark inside circle -->
    <path d="M145,100 L146,102 L149,98" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Row 2 -->
    <rect x="85" y="111" width="70" height="14" rx="2" fill="#f8fafc"/>
    <rect x="89" y="115" width="30" height="6" rx="1" fill="#cbd5e1"/>
    <rect x="135" y="115" width="14" height="6" rx="1" fill="#e2e8f0"/>

    <!-- Row 3 -->
    <rect x="85" y="129" width="70" height="14" rx="2" fill="#f8fafc"/>
    <rect x="89" y="133" width="16" height="6" rx="1" fill="#cbd5e1"/>
    <rect x="125" y="133" width="24" height="6" rx="1" fill="#e2e8f0"/>

    <!-- Row 4 -->
    <rect x="85" y="147" width="70" height="14" rx="2" fill="#f8fafc"/>
    <rect x="89" y="151" width="24" height="6" rx="1" fill="#cbd5e1"/>
    <circle cx="147" cy="154" r="4" fill="#10b981" opacity="0.8"/>
    <path d="M145,154 L146,156 L149,152" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Stamp / Seal (adds action/authentic feel) -->
    <g transform="translate(130, 155) rotate(-15)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,1" opacity="0.85"/>
      <path d="M-6,1 L-2,5 L6,-3" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    </g>
  </g>

  <!-- Contextual Props: Pen / Stylus writing on form -->
  <g transform="translate(150, 110) rotate(-35)" filter="url(#shadow)">
    <!-- Pen Body -->
    <path d="M-4,-40 L4,-40 L6,30 L0,42 L-6,30 Z" fill="#38bdf8"/>
    <!-- Pen Grip -->
    <rect x="-4" y="-10" width="8" height="20" fill="#0284c7"/>
    <!-- Pen Tip -->
    <path d="M-4,30 L4,30 L0,42 Z" fill="#0f172a"/>
    <!-- Metallic Accent -->
    <rect x="-4" y="-40" width="8" height="4" fill="#e2e8f0"/>
  </g>

  <!-- Contextual Props: Coffee Mug on the Desk -->
  <g transform="translate(35, 175)" filter="url(#shadow)">
    <!-- Mug Body -->
    <path d="M-12,-25 L12,-25 L10,15 C10,20 6,23 0,23 C-6,23 -10,20 -10,15 Z" fill="#fb923c"/>
    <!-- Mug Rim -->
    <ellipse cx="0" cy="-25" rx="12" ry="4" fill="#fdba74"/>
    <!-- Mug Handle -->
    <path d="M10,-18 C18,-18 18,-5 10,2" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <!-- Steam / Aroma -->
    <path d="M-4,-35 C-2,-42 -6,-48 -4,-55" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M4,-33 C6,-40 2,-46 4,-52" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Contextual Props: Reading Glasses -->
  <g transform="translate(195, 145) rotate(15)" filter="url(#shadow)">
    <circle cx="-10" cy="0" r="10" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="14" cy="-2" r="10" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <path d="M0,0 C4,-3 8,-3 4,-2" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M-20,-2 C-25,-5 -30,-12 -35,-20" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Sparkles / Highlights -->
  <g fill="#f59e0b">
    <circle cx="45" cy="80" r="2" opacity="0.8"/>
    <path d="M190,70 L192,75 L197,77 L192,79 L190,84 L188,79 L183,77 L188,75 Z" opacity="0.6"/>
    <path d="M55,130 L56,133 L59,134 L56,135 L55,138 L54,135 L51,134 L54,133 Z" opacity="0.4"/>
  </g>
</svg>