<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Floor shadow -->
    <ellipse cx="80" cy="160" rx="70" ry="15" fill="#0f172a" opacity="0.4"/>
    
    <!-- Person carrying -->
    <g fill="#38bdf8">
      <!-- Legs -->
      <rect x="50" y="100" width="15" height="60" rx="5"/>
      <rect x="95" y="100" width="15" height="60" rx="5"/>
      <!-- Body -->
      <path d="M55 40 h50 v60 h-50 z" fill="#38bdf8"/>
      <!-- Head -->
      <circle cx="80" cy="30" r="20" fill="#fbbf24"/>
    </g>
    
    <!-- Person being carried -->
    <g transform="translate(30, -20)">
      <path d="M40 60 c0 -20 20 -30 40 -30 s40 10 40 30" fill="#ec4899"/>
      <circle cx="80" cy="35" r="18" fill="#fb923c"/>
      <!-- Arms wrapping around -->
      <path d="M50 70 q-10 20 0 30" stroke="#ec4899" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M110 70 q10 20 0 30" stroke="#ec4899" stroke-width="8" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Atmospheric details -->
  <circle cx="200" cy="40" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="30" cy="180" r="6" fill="#fbbf24" opacity="0.3"/>
  <path d="M180 150 l10 10 m-10 0 l10 -10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>