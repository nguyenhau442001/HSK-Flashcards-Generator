<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Suitcase -->
  <path d="M60 100h120v90a10 10 0 0 1-10 10H70a10 10 0 0 1-10-10V100z" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="85" y="80" width="70" height="20" rx="5" fill="#475569"/>
  
  <!-- Overflowing Items (The "Duoyu" concept) -->
  <g transform="translate(120, 140) rotate(15)">
    <rect x="-30" y="-80" width="60" height="40" rx="4" fill="#fb923c"/>
    <rect x="-25" y="-75" width="50" height="10" fill="#fef3c7"/>
    <rect x="-25" y="-60" width="50" height="10" fill="#fef3c7"/>
  </g>
  
  <g transform="translate(100, 130) rotate(-10)">
    <rect x="-20" y="-60" width="40" height="30" rx="4" fill="#ec4899"/>
    <circle cx="0" cy="-45" r="8" fill="#fbcfe8"/>
  </g>
  
  <g transform="translate(140, 120) rotate(20)">
    <rect x="-15" y="-50" width="30" height="25" rx="4" fill="#10b981"/>
    <path d="M-10 -40h20M-10 -35h20" stroke="#d1fae5" stroke-width="3"/>
  </g>
  
  <!-- Zipper/Clasp Detail -->
  <rect x="115" y="100" width="10" height="10" rx="2" fill="#fbbf24"/>
  
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="210" rx="80" ry="10" fill="#0f172a" opacity="0.5"/>
</svg>