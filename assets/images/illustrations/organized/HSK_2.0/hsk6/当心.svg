<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Road Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 180 L240 180" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Car Body -->
  <path d="M40 160 L180 160 L195 190 L25 190 Z" fill="#fb923c"/>
  <path d="M60 130 L160 130 L175 160 L45 160 Z" fill="#f59e0b"/>
  
  <!-- Windshield -->
  <path d="M70 135 L150 135 L155 155 L65 155 Z" fill="#e2e8f0"/>
  
  <!-- Wheels -->
  <circle cx="70" cy="195" r="15" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <circle cx="160" cy="195" r="15" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  
  <!-- Hazard/Caution Elements -->
  <path d="M200 60 L230 110 L170 110 Z" fill="#ef4444"/>
  <path d="M200 70 L200 95" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="103" r="2" fill="#ffffff"/>
  
  <!-- Motion Lines -->
  <path d="M20 150 L0 140" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 170 L0 160" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Street Lamp -->
  <path d="M20 240 L20 80" stroke="#94a3b8" stroke-width="6"/>
  <path d="M20 80 L60 60" stroke="#94a3b8" stroke-width="6"/>
  <circle cx="65" cy="55" r="10" fill="#fbbf24"/>
  
  <!-- Decorative Glow -->
  <circle cx="65" cy="55" r="25" fill="#fbbf24" opacity="0.1"/>
</svg>