<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="headlightBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0" />
    </linearGradient>

    <!-- Taillight Glow Gradient -->
    <linearGradient id="taillightGlow" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0" />
    </linearGradient>

    <!-- City Glow Gradient -->
    <linearGradient id="cityGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <!-- Window Clip for layering -->
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Base Canvas -->
    <rect width="240" height="240" fill="url(#skyGrad)" />

    <!-- Ambient Cityscape Backdrop -->
    <g fill="#111827">
      <rect x="15" y="60" width="30" height="80" opacity="0.5" />
      <rect x="55" y="40" width="45" height="100" opacity="0.4" />
      <rect x="110" y="50" width="35" height="90" opacity="0.6" />
      <rect x="155" y="30" width="50" height="110" opacity="0.4" />
      <rect x="215" y="70" width="25" height="70" opacity="0.5" />
    </g>

    <!-- City Windows (Lit) -->
    <g fill="#fbbf24" opacity="0.6">
      <rect x="22" y="70" width="4" height="6" />
      <rect x="30" y="70" width="4" height="6" />
      <rect x="22" y="85" width="4" height="6" />
      <rect x="30" y="85" width="4" height="6" />
      
      <rect x="65" y="55" width="6" height="8" />
      <rect x="78" y="55" width="6" height="8" />
      <rect x="65" y="75" width="6" height="8" />
      <rect x="78" y="75" width="6" height="8" />
      <rect x="65" y="95" width="6" height="8" />

      <rect x="120" y="65" width="5" height="7" />
      <rect x="130" y="80" width="5" height="7" />
      <rect x="120" y="95" width="5" height="7" />

      <rect x="165" y="45" width="8" height="6" />
      <rect x="180" y="45" width="8" height="6" />
      <rect x="165" y="65" width="8" height="6" />
      <rect x="180" y="65" width="8" height="6" />
    </g>

    <!-- Ambient City Glow Overlay -->
    <rect x="0" y="0" width="240" height="240" fill="url(#cityGlow)" />

    <!-- Overpass / Elevated Road Structure -->
    <path d="M-10,135 Q120,115 250,140 L250,210 Q120,185 -10,205 Z" fill="#334155" />
    <path d="M-10,140 Q120,120 250,145 L250,150 Q120,125 -10,120 Z" fill="#475569" /> <!-- Road edge/barrier -->
    <!-- Pillars -->
    <rect x="45" y="145" width="12" height="60" fill="#1e293b" />
    <rect x="145" y="155" width="12" height="50" fill="#1e293b" />

    <!-- GROUND ROADWAY (Lower Level - Main Traffic Jam Focus) -->
    <!-- Road Surface -->
    <path d="M-10,180 L250,140 L250,250 L-10,250 Z" fill="#0f172a" />
    <path d="M-10,195 L250,152 L250,250 L-10,250 Z" fill="#1e293b" />

    <!-- Road Markings (Dashed Lanes) -->
    <path d="M10,198 L60,190 M80,187 L130,179 M150,176 L200,168" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.8" />

    <!-- TRAFFIC JAM SCENE: VEHICLES -->

    <!-- Vehicle 1: Red Sedan (Foreground, Stopped) -->
    <g transform="translate(130, 150)">
      <!-- Headlight Beam -->
      <polygon points="12,18 -30,10 -30,28" fill="url(#headlightBeam)" />
      <!-- Body Shadow -->
      <ellipse cx="2" cy="24" rx="35" ry="6" fill="#000000" opacity="0.4" />
      <!-- Car Body -->
      <path d="M-22,12 L-15,4 L12,2 L25,10 L32,18 L32,24 L-22,24 Z" fill="#ef4444" />
      <!-- Roof & Windows -->
      <path d="M-12,4 L-6,-6 L10,-6 L18,4 Z" fill="#b91c1c" />
      <path d="M-10,3 L-5,-5 L3,-5 L6,3 Z" fill="#93c5fd" opacity="0.7" /> <!-- Windshield -->
      <path d="M8,3 L12,-5 L16,-5 L17,3 Z" fill="#93c5fd" opacity="0.7" />   <!-- Rear window -->
      <!-- Wheels -->
      <circle cx="-14" cy="22" r="5" fill="#0f172a" />
      <circle cx="-14" cy="22" r="2" fill="#94a3b8" />
      <circle cx="18" cy="21" r="5" fill="#0f172a" />
      <circle cx="18" cy="21" r="2" fill="#94a3b8" />
      <!-- Headlights / Taillights -->
      <rect x="29" y="16" width="3" height="3" rx="1" fill="#fef08a" />
      <rect x="-23" y="15" width="2" height="4" rx="1" fill="#f43f5e" />
    </g>

    <!-- Vehicle 2: Yellow Taxi (Crammed right behind Red Sedan) -->
    <g transform="translate(85, 162)">
      <!-- Taillight Glow onto Red Car -->
      <polygon points="-22,16 -50,12 -50,26" fill="url(#taillightGlow)" />
      <!-- Body Shadow -->
      <ellipse cx="2" cy="22" rx="32" ry="5" fill="#000000" opacity="0.4" />
      <!-- Car Body -->
      <path d="M-20,10 L-12,2 L14,0 L24,8 L30,16 L30,22 L-20,22 Z" fill="#f59e0b" />
      <!-- Taxi Sign -->
      <rect x="-2" y="-5" width="8" height="3" rx="1" fill="#fef08a" />
      <!-- Roof & Windows -->
      <path d="M-10,2 L-4,-7 L10,-7 L16,2 Z" fill="#d97706" />
      <path d="M-8,1 L-3,-6 L4,-6 L6,1 Z" fill="#93c5fd" opacity="0.7" />
      <path d="M8,1 L11,-6 L14,-6 L15,1 Z" fill="#93c5fd" opacity="0.7" />
      <!-- Wheels -->
      <circle cx="-12" cy="20" r="4.5" fill="#0f172a" />
      <circle cx="-12" cy="20" r="1.5" fill="#94a3b8" />
      <circle cx="16" cy="19" r="4.5" fill="#0f172a" />
      <circle cx="16" cy="19" r="1.5" fill="#94a3b8" />
      <!-- Taillights -->
      <rect x="-21" y="13" width="2" height="4" rx="1" fill="#f43f5e" />
    </g>

    <!-- Vehicle 3: Blue SUV (Further back in line) -->
    <g transform="translate(40, 175)">
      <!-- Taillight Glow onto Taxi -->
      <polygon points="-22,14 -45,10 -45,22" fill="url(#taillightGlow)" />
      <!-- Body Shadow -->
      <ellipse cx="0" cy="20" rx="30" ry="5" fill="#000000" opacity="0.4" />
      <!-- Car Body -->
      <path d="M-22,8 L-16,0 L16,-2 L24,6 L28,16 L28,20 L-22,20 Z" fill="#38bdf8" />
      <!-- Roof & Windows (Boxy SUV) -->
      <path d="M-14,0 L-10,-9 L12,-9 L16,0 Z" fill="#0284c7" />
      <path d="M-12,-1 L-8,-8 L2,-8 L4,-1 Z" fill="#cbd5e1" opacity="0.7" />
      <path d="M6,-1 L10,-8 L13,-8 L14,-1 Z" fill="#cbd5e1" opacity="0.7" />
      <!-- Wheels -->
      <circle cx="-13" cy="18" r="4.5" fill="#0f172a" />
      <circle cx="-13" cy="18" r="1.5" fill="#94a3b8" />
      <circle cx="15" cy="17" r="4.5" fill="#0f172a" />
      <circle cx="15" cy="17" r="1.5" fill="#94a3b8" />
      <!-- Taillights -->
      <rect x="-23" y="11" width="2" height="4" rx="1" fill="#f43f5e" />
    </g>

    <!-- Vehicle 4: Delivery Scooter (Weaving through the jam - adds dynamism) -->
    <g transform="translate(100, 195)">
      <!-- Shadow -->
      <ellipse cx="0" cy="10" rx="12" ry="3" fill="#000000" opacity="0.4" />
      <!-- Scooter Body -->
      <path d="M-10,2 L-4,-2 L6,-1 L10,6 L8,8 L-8,8 Z" fill="#10b981" />
      <!-- Rider (Simplified silhouette) -->
      <circle cx="-1" cy="-6" r="4" fill="#f8fafc" />
      <path d="M-4,-2 L2,-2 L4,4 L-2,4 Z" fill="#fb923c" /> <!-- Jacket -->
      <!-- Delivery Box on Back -->
      <rect x="5" y="-3" width="7" height="8" rx="1" fill="#f8fafc" />
      <!-- Wheels -->
      <circle cx="-7" cy="8" r="3" fill="#0f172a" />
      <circle cx="7" cy="7" r="3" fill="#0f172a" />
      <!-- Headlight -->
      <circle cx="-11" cy="3" r="1.5" fill="#fef08a" />
    </g>

    <!-- ENVIRONMENT DETAILS: Traffic Light Pole & Fixture (The culprit of the jam/Setting the scene) -->
    <g transform="translate(195, 80)">
      <!-- Pole -->
      <rect x="0" y="0" width="6" height="120" fill="#64748b" />
      <!-- Horizontal Arm -->
      <rect x="-35" y="0" width="41" height="5" fill="#64748b" />
      <!-- Traffic Light Box -->
      <rect x="-38" y="5" width="18" height="40" rx="3" fill="#0f172a" />
      <!-- Lights (All Red for Jam!) -->
      <circle cx="-29" cy="13" r="3.5" fill="#ef4444" />
      <circle cx="-29" cy="25" r="3.5" fill="#334155" />
      <circle cx="-29" cy="37" r="3.5" fill="#334155" />
      <!-- Red Light Glow Effect -->
      <circle cx="-29" cy="13" r="8" fill="#ef4444" opacity="0.4" />
    </g>

    <!-- Street Lamp / Ambient Glow Elements -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="4" height="90" fill="#475569" />
      <path d="M-10,0 L14,0 L2, -10 Z" fill="#475569" />
      <circle cx="2" cy="-2" r="4" fill="#fef08a" />
      <circle cx="2" cy="-2" r="12" fill="#fef08a" opacity="0.2" />
    </g>

    <!-- Atmospheric City Effects: Traffic Light Glow Cones & Ambient Particles -->
    <circle cx="166" cy="93" r="25" fill="#ef4444" opacity="0.1" />
    
    <!-- Floating Exhaust / City Smog subtle puffs -->
    <circle cx="45" cy="165" r="6" fill="#94a3b8" opacity="0.15" />
    <circle cx="95" cy="150" r="8" fill="#94a3b8" opacity="0.12" />
    <circle cx="140" cy="140" r="10" fill="#94a3b8" opacity="0.1" />

  </g>
</svg>