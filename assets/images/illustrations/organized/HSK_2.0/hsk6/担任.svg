<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk/Wood Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Leadership/Role -->
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Suit Jacket Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Amber Glow representing responsibility/position -->
  <circle cx="120" cy="110" r="90" fill="url(#amberGlow)"/>

  <!-- Background Office Elements: Window & City Skyline Silhouette -->
  <g opacity="0.25">
    <!-- Large Window Frame -->
    <rect x="50" y="30" width="140" height="110" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="120" y1="30" x2="120" y2="140" stroke="#94a3b8" stroke-width="2"/>
    <line x1="50" y1="85" x2="190" y2="85" stroke="#94a3b8" stroke-width="2"/>
    <!-- City Buildings outside -->
    <rect x="60" y="60" width="25" height="80" fill="#64748b"/>
    <rect x="90" y="50" width="22" height="90" fill="#475569"/>
    <rect x="130" y="70" width="30" height="70" fill="#64748b"/>
    <rect x="165" y="55" width="20" height="85" fill="#475569"/>
  </g>

  <!-- Office Desk Surface -->
  <path d="M 20 180 L 220 180 L 225 220 L 15 220 Z" fill="url(#deskGrad)"/>
  <path d="M 15 180 L 225 180" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Desk Props: Laptop & Blueprint/Documents -->
  <!-- Laptop Base -->
  <path d="M 70 178 L 130 178 L 140 185 L 60 185 Z" fill="#64748b"/>
  <!-- Laptop Screen -->
  <path d="M 75 145 L 125 145 L 130 178 L 70 178 Z" fill="#475569"/>
  <!-- Screen Glow/Chart -->
  <path d="M 82 152 L 118 152 L 116 172 L 84 172 Z" fill="#0f172a"/>
  <polyline points="87,167 95,160 102,163 113,156" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Leadership Nameplate / Office Plaque on Desk -->
  <g transform="translate(145, 160)">
    <polygon points="0,20 12,5 48,5 60,20" fill="#f59e0b"/>
    <polygon points="4,20 56,20 60,24 0,24" fill="#d97706"/>
    <!-- Decorative stripes on plaque -->
    <line x1="18" y1="12" x2="42" y2="12" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Coffee Mug -->
  <path d="M 45 162 L 57 162 L 55 180 L 47 180 Z" fill="#f8fafc"/>
  <path d="M 57 166 Q 63 166 63 172 Q 63 178 57 178" fill="none" stroke="#f8fafc" stroke-width="2.5"/>

  <!-- MAIN CHARACTER: Newly Appointed Director taking charge (担任 - dānrèn) -->
  <g transform="translate(0, 10)">
    <!-- Body / Suit Jacket -->
    <path d="M 90 140 L 110 125 L 130 140 L 145 175 L 95 175 Z" fill="url(#suitGrad)"/>
    
    <!-- White Shirt & Red/Amber Tie -->
    <polygon points="110,125 115,145 125,145 130,125" fill="#f8fafc"/>
    <polygon points="117,130 123,130 122,158 118,158" fill="#f59e0b"/>

    <!-- Suit Lapels -->
    <path d="M 110 125 L 102 150 L 110 150 Z" fill="#0284c7"/>
    <path d="M 130 125 L 138 150 L 130 150 Z" fill="#0284c7"/>

    <!-- Neck -->
    <rect x="112" y="114" width="16" height="15" fill="url(#skinGrad)"/>

    <!-- Head & Face -->
    <circle cx="120" cy="98" r="22" fill="url(#skinGrad)"/>

    <!-- Professional Hair Style -->
    <path d="M 98 98 C 98 82, 108 76, 120 76 C 132 76, 142 82, 142 98 C 142 90, 137 80, 120 80 C 103 80, 98 90, 98 98 Z" fill="#334155"/>
    <path d="M 112 78 C 118 75, 128 77, 134 82 C 130 80, 118 79, 112 78 Z" fill="#475569"/>

    <!-- Confident Facial Expression & Glasses -->
    <!-- Eyes (Confident curve) -->
    <path d="M 110 96 Q 114 92 118 96" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 122 96 Q 126 92 130 96" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Glasses Frames -->
    <rect x="107" y="90" width="12" height="9" rx="2" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <rect x="121" y="90" width="12" height="9" rx="2" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="119" y1="94" x2="121" y2="94" stroke="#f59e0b" stroke-width="2"/>
    <!-- Confident Smile -->
    <path d="M 114 105 Q 120 110 126 105" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- ARMS & HAND GESTURES (Taking Charge / Confident Posture) -->
    <!-- Left Arm resting confidently on desk -->
    <path d="M 95 140 L 75 160 L 60 162" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Hand -->
    <circle cx="58" cy="162" r="6" fill="url(#skinGrad)"/>

    <!-- Right Arm raised forward slightly in an authoritative, welcoming "taking charge" gesture -->
    <path d="M 145 140 L 165 130 L 178 120" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Hand -->
    <circle cx="182" cy="117" r="6" fill="url(#skinGrad)"/>
  </g>

  <!-- Floating Authority/Leadership Accent Elements (Sparkles & Upward Arrow Graph) -->
  <g transform="translate(170, 45)">
    <!-- Upward trend growth sparks -->
    <path d="M 0 25 L 15 10 L 30 18 L 45 2" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="40,2 47,2 45,9" fill="#10b981"/>
  </g>

  <!-- Golden Stars / Achievement Badges floating subtly -->
  <g fill="#fbbf24" opacity="0.9">
    <path d="M 35 70 L 38 78 L 46 79 L 40 85 L 42 93 L 35 89 L 28 93 L 30 85 L 24 79 L 32 78 Z" transform="scale(0.5) translate(20, 40)"/>
    <path d="M 210 90 L 212 95 L 218 96 L 214 100 L 215 105 L 210 102 L 205 105 L 206 100 L 202 96 L 208 95 Z" transform="scale(0.4) translate(300, 100)"/>
  </g>

  <!-- Soft Vignette / Lighting Overlay for App Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
</svg>