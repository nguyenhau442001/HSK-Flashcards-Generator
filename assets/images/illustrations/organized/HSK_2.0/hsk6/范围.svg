<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarScan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Holographic Projection Cone -->
    <linearGradient id="holoCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- UI Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Lens Shadow -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Background Technical Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.4">
    <line x1="30" y1="0" x2="30" y2="240"/>
    <line x1="90" y1="0" x2="90" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="210" y1="0" x2="210" y2="240"/>
    <line x1="0" y1="40" x2="240" y2="40"/>
    <line x1="0" y1="100" x2="240" y2="100"/>
    <line x1="0" y1="160" x2="240" y2="160"/>
    <line x1="0" y1="220" x2="240" y2="220"/>
  </g>

  <!-- Ambient Glowing Orbs representing wide scope/range -->
  <circle cx="70" cy="80" r="24" fill="#fb923c" opacity="0.15" filter="url(#neonGlow)"/>
  <circle cx="170" cy="110" r="30" fill="#38bdf8" opacity="0.15" filter="url(#neonGlow)"/>
  <circle cx="120" cy="150" r="35" fill="#10b981" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- Floor/Desk Surface -->
  <ellipse cx="120" cy="210" rx="95" ry="25" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="120" cy="210" rx="95" ry="25" fill="url(#shadowGrad)" opacity="0.7"/>

  <!-- Holographic Projection Cone Base (Emanating from device) -->
  <polygon points="120,185 85,120 155,120" fill="url(#holoCone)"/>

  <!-- Central Holographic Scope / Range (Main Visual for '范围') -->
  <g transform="translate(120, 115)">
    <!-- Outer Expansion Rings -->
    <ellipse rx="75" ry="28" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
    <ellipse rx="60" ry="22" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Main Scope Grid Disk -->
    <ellipse rx="45" ry="16" fill="url(#radarScan)" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)"/>
    
    <!-- Crosshairs inside scope -->
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>

    <!-- Floating Target Nodes within the Scope Range -->
    <circle cx="-20" cy="-6" r="3.5" fill="#10b981" filter="url(#neonGlow)"/>
    <circle cx="22" cy="5" r="4" fill="#fb923c" filter="url(#neonGlow)"/>
    <circle cx="5" cy="8" r="3" fill="#ec4899" filter="url(#neonGlow)"/>
    <circle cx="-10" cy="9" r="2.5" fill="#38bdf8"/>

    <!-- Radar Sweep Line Animation Effect -->
    <line x1="0" y1="0" x2="38" y2="-12" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)"/>
  </g>

  <!-- Futuristic Control Device / Projector Base (Tangible Context Object) -->
  <g transform="translate(120, 195)">
    <!-- Device Body -->
    <path d="M-30,0 L30,0 L24,-15 L-24,-15 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <!-- Upper rim -->
    <ellipse cx="0" cy="-15" rx="24" ry="7" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Glowing Core/Lens -->
    <ellipse cx="0" cy="-15" rx="14" ry="4" fill="#38bdf8" filter="url(#neonGlow)"/>
    <!-- Device Accent Lights -->
    <circle cx="-12" cy="-7" r="1.5" fill="#10b981"/>
    <circle cx="-7" cy="-7" r="1.5" fill="#fbbf24"/>
    <circle cx="12" cy="-7" r="1.5" fill="#ec4899"/>
  </g>

  <!-- Interactive Data Pins / Floating Contextual Markers -->
  <!-- Left Marker -->
  <g transform="translate(50, 95)">
    <line x1="0" y1="0" x2="15" y2="10" stroke="#fb923c" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#fb923c" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#fb923c" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Right Marker -->
  <g transform="translate(190, 80)">
    <line x1="0" y1="0" x2="-20" y2="15" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Top Center Marker -->
  <g transform="translate(120, 45)">
    <line x1="0" y1="15" x2="0" y2="25" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="0" cy="15" r="4" fill="#10b981" filter="url(#neonGlow)"/>
    <circle cx="0" cy="15" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Atmospheric Lighting & Particles -->
  <circle cx="40" cy="140" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="200" cy="150" r="2" fill="#fb923c" opacity="0.8"/>
  <circle cx="85" cy="40" r="1" fill="#ffffff" opacity="0.9"/>
  <circle cx="165" cy="55" r="1.5" fill="#10b981" opacity="0.9"/>
  <circle cx="105" cy="180" r="1" fill="#38bdf8" opacity="0.6"/>
  <circle cx="145" cy="175" r="1.5" fill="#ec4899" opacity="0.7"/>

  <!-- Foreground Frame/Border Bevel -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
</svg>