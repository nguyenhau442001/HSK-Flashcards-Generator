<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Holographic/Screen Gradient -->
    <linearGradient id="holoScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting & Grid in Background -->
  <g opacity="0.15">
    <path d="M 0,60 L 240,60 M 0,120 L 240,120 M 0,180 L 240,180" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 4"/>
    <path d="M 60,0 L 60,240 M 120,0 L 120,240 M 180,0 L 180,240" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Ambient Glows representing "Context/Background" complexity -->
  <circle cx="180" cy="70" r="60" fill="url(#amberGlow)"/>
  <circle cx="60" cy="170" r="70" fill="url(#blueGlow)"/>

  <!-- ENVIRONMENT / BACKGROUND LAYERS (Representing "Bối cảnh" - Project Context) -->
  <!-- Layer 1: Architectural blueprint lines (Background elements) -->
  <g transform="translate(20, 30)" opacity="0.3">
    <!-- Building wireframe -->
    <polygon points="120,40 170,70 170,140 120,120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="30,60 120,40 120,120 30,100" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="75" y1="50" x2="75" y2="105" stroke="#38bdf8" stroke-width="1"/>
    <line x1="100" y1="45" x2="100" y2="113" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Layer 2: Connecting Nodes / Data Context -->
  <g stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <circle cx="65" cy="85" r="4" fill="#fbbf24"/>
    <circle cx="115" cy="65" r="3" fill="#fbbf24"/>
    <circle cx="155" cy="115" r="5" fill="#fbbf24"/>
    <path d="M 65,85 L 115,65 L 155,115" fill="none"/>
    <path d="M 115,65 L 130,150" fill="none" stroke-dasharray="2 2"/>
  </g>

  <!-- MAIN FOREGROUND SUBJECT: The Director/Presenter Analyzing the Context -->
  <g filter="url(#dropShadow)">
    <!-- Holographic Display Tablet / Project Board (The focal point of analyzing context) -->
    <path d="M 45,110 L 195,110 L 210,195 L 30,195 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M 50,115 L 190,115 L 202,185 L 38,185 Z" fill="url(#holoScreen)" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Data Visualizations on Screen (Charts & Graphs depicting "Background Data") -->
    <!-- Bar Chart -->
    <rect x="55" y="150" width="12" height="25" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="73" y="135" width="12" height="40" rx="2" fill="#fb923c" opacity="0.9"/>
    <rect x="91" y="142" width="12" height="33" rx="2" fill="#10b981" opacity="0.8"/>
    
    <!-- Pie/Node Graph -->
    <circle cx="155" cy="150" r="20" fill="none" stroke="#ec4899" stroke-width="4" stroke-dasharray="90 35"/>
    <circle cx="155" cy="150" r="12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="50 30"/>

    <!-- Connection lines inside screen -->
    <path d="M 115,160 L 130,140 L 140,165" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Interactive Stylus / Pointer indicating the "Context" -->
  <g filter="url(#dropShadow)" transform="translate(145, 85) rotate(-25)">
    <!-- Hand holding stylus -->
    <path d="M 15,40 C 15,30 25,25 35,20 C 45,15 55,20 60,30 C 65,40 55,50 45,55 L 25,65 Z" fill="#f8fafc"/>
    <path d="M 25,65 L 10,85 L 5,80 L 18,58 Z" fill="#fbbf24"/>
    <!-- Stylus tip glowing -->
    <circle cx="5" cy="80" r="3" fill="#38bdf8"/>
  </g>

  <!-- Foreground Atmospheric Props: Floating Data Orbs & Analytics -->
  <!-- Orb 1 -->
  <g transform="translate(45, 75)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <path d="M -6,-2 L 0,-8 L 6,-2 M 0,-8 L 0,8" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Orb 2 -->
  <g transform="translate(195, 95)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#10b981"/>
  </g>

  <!-- Floating Sparkles / Accent Dots -->
  <circle cx="95" cy="45" r="2.5" fill="#fbbf24"/>
  <circle cx="170" cy="40" r="2" fill="#38bdf8"/>
  <circle cx="25" cy="130" r="2" fill="#ec4899"/>
  <circle cx="215" cy="155" r="3" fill="#fb923c"/>

  <!-- Base Stand / Podium element grounding the holographic table -->
  <path d="M 90,195 L 150,195 L 165,215 L 75,215 Z" fill="#334155" opacity="0.9"/>
  <ellipse cx="120" cy="215" rx="55" ry="8" fill="#0f172a" opacity="0.8"/>
  <ellipse cx="120" cy="215" rx="45" ry="5" fill="#38bdf8" opacity="0.3"/>
</svg>