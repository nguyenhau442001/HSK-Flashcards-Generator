<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Amber Effect (Cause -> Effect) -->
    <radialGradient id="glow-effect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Success Trophy Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Action Arrow Gradient -->
    <linearGradient id="arrow-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Glow for "Result" (从而) -->
  <circle cx="175" cy="115" r="55" fill="url(#glow-effect)" />

  <!-- Room Interior Background Elements -->
  <!-- Bookshelf / Wall Line -->
  <rect x="24" y="36" width="192" height="6" rx="3" fill="#334155" />
  <!-- Background Plant Leaves -->
  <path d="M40 36 C35 20, 20 15, 15 10 C25 15, 38 25, 42 36 Z" fill="#10b981" opacity="0.8" />
  <path d="M30 36 C25 22, 12 20, 8 16 C16 20, 26 28, 32 36 Z" fill="#059669" opacity="0.8" />

  <!-- Main Desk Surface -->
  <path d="M12 185 L228 185 C231 185, 234 188, 234 191 L234 196 C234 199, 231 202, 228 202 L12 202 C9 202, 6 199, 6 196 L6 191 C6 188, 9 185, 12 185 Z" fill="url(#desk-grad)" />
  <!-- Desk Edge Highlight -->
  <rect x="6" y="185" width="228" height="2" fill="#64748b" opacity="0.5" />

  <!-- SCENE LEFT: HARD WORK (Cause - 学习/努力) -->
  <!-- Desk Lamp -->
  <path d="M45 185 L55 185 L58 135 L42 135 Z" fill="#64748b" />
  <path d="M35 125 C35 115, 55 115, 55 125 L62 138 L28 138 Z" fill="#38bdf8" />
  <ellipse cx="45" cy="138" rx="17" ry="4" fill="#0284c7" />
  <!-- Lamp Light Cone (Subtle) -->
  <path d="M45 138 L25 185 L65 185 Z" fill="#38bdf8" opacity="0.08" />

  <!-- Open Textbook / Study Material -->
  <g transform="translate(45, 145)">
    <!-- Book Shadow -->
    <rect x="-2" y="3" width="54" height="38" rx="2" fill="#0f172a" opacity="0.5" />
    <!-- Book Base (White Pages) -->
    <rect x="0" y="0" width="50" height="36" rx="2" fill="#f8fafc" />
    <!-- Center Spine Binding -->
    <line x1="25" y1="0" x2="25" y2="36" stroke="#cbd5e1" stroke-width="2" />
    <!-- Left Page Lines (Reading/Studying) -->
    <line x1="7" y1="9" x2="18" y2="9" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="16" x2="20" y2="16" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="23" x2="15" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Right Page Lines -->
    <line x1="30" y1="9" x2="43" y2="9" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="30" y1="16" x2="40" y2="16" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="30" y1="23" x2="43" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Bookmark Ribbon -->
    <polygon points="38,36 42,42 45,36" fill="#ec4899" />
  </g>

  <!-- Animated Pencil writing -->
  <g transform="translate(85, 148) rotate(-25)">
    <polygon points="0,0 6,0 3,-18" fill="#fbbf24" />
    <polygon points="3,-18 0,0 6,0" fill="#f59e0b" />
    <polygon points="1,-2 5,-2 3,-6" fill="#cbd5e1" />
    <polygon points="3,-18 1.5,-22 4.5,-22" fill="#334155" />
    <rect x="0" y="2" width="6" height="4" rx="1" fill="#ec4899" />
  </g>

  <!-- DYNAMIC CONNECTOR: "从而" (Thus / As a Result - Action Arrow) -->
  <g>
    <!-- Flowing Curved Path representing causal link -->
    <path d="M 98 140 Q 130 90, 160 120" fill="none" stroke="url(#arrow-grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 6" />
    
    <!-- Large Action Arrowhead pointing to the result -->
    <path d="M 152 110 L 167 121 L 148 128 Z" fill="#10b981" />
    
    <!-- Sparkles along the causal flow -->
    <circle cx="120" cy="115" r="3" fill="#38bdf8" />
    <circle cx="138" cy="105" r="4" fill="#fbbf24" />
    <circle cx="150" cy="115" r="2.5" fill="#10b981" />
  </g>

  <!-- SCENE RIGHT: SUCCESS & ACHIEVEMENT (Effect - 成就) -->
  <!-- Floating Success Trophy -->
  <g transform="translate(155, 95)">
    <!-- Trophy Glow Base -->
    <circle cx="20" cy="25" r="30" fill="#f59e0b" opacity="0.15" />
    
    <!-- Trophy Cup Body -->
    <path d="M 7 12 C 7 30, 33 30, 33 12 Z" fill="url(#gold-grad)" />
    <path d="M 10 12 L 30 12 L 27 34 C 27 38, 13 38, 13 34 Z" fill="url(#gold-grad)" />
    
    <!-- Handles -->
    <path d="M 7 15 C 0 15, 0 25, 9 27" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 33 15 C 40 15, 40 25, 31 27" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Stem and Base -->
    <rect x="17" y="38" width="6" height="10" fill="#d97706" />
    <rect x="11" y="48" width="18" height="6" rx="2" fill="url(#gold-grad)" />
    
    <!-- Star Emblem on Trophy -->
    <polygon points="20,18 21.5,21.5 25,22 22.5,24.5 23,28 20,26 17,28 17.5,24.5 15,22 18.5,21.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Supporting Success Props: Rising Chart / Report Card -->
  <g transform="translate(195, 130)">
    <rect x="0" y="0" width="30" height="40" rx="3" fill="#ffffff" />
    <!-- Mini Bar Graph inside Report -->
    <rect x="5" y="24" width="4" height="12" rx="1" fill="#38bdf8" />
    <rect x="11" y="18" width="4" height="18" rx="1" fill="#38bdf8" />
    <rect x="17" y="10" width="4" height="26" rx="1" fill="#10b981" />
    <!-- Checkmark on Report -->
    <path d="M 23 7 L 25 10 L 28 5" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Festive Confetti / Sparkles for Success -->
  <circle cx="210" cy="85" r="3" fill="#fbbf24" />
  <rect x="140" y="70" width="5" height="5" rx="1" fill="#ec4899" transform="rotate(15 142.5 72.5)" />
  <circle cx="130" cy="140" r="2" fill="#38bdf8" />
  <polygon points="195,60 197,65 202,65 198,68 200,73 195,70 190,73 192,68 188,65 193,65" fill="#fbbf24" transform="scale(0.5) translate(200, 60)" />

</svg>