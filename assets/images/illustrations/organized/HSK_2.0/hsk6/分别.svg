<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Scene -->
  <path d="M0 180h240v60H0z" fill="#334155"/>
  <path d="M0 180h240v4H0z" fill="#475569"/>
  
  <!-- Character 1 (Left) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M5 40l10 60M35 40l10 60" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M10 100l-15 30M40 100l15 30" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 35l-20 40" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (Right) -->
  <g transform="translate(160, 100)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M5 40l-10 60M35 40l10 60" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M10 100l15 30M40 100l-15 30" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 35l20 40" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- Directional Motion Lines -->
  <path d="M80 120 L40 100" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M160 120 L200 100" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
  
  <!-- Street Lamp -->
  <rect x="210" y="50" width="6" height="130" fill="#475569"/>
  <circle cx="213" cy="50" r="12" fill="#fef3c7"/>
  <circle cx="213" cy="50" r="6" fill="#fbbf24"/>
  
  <!-- Atmosphere -->
  <circle cx="30" cy="30" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="120" cy="20" r="3" fill="#ffffff" opacity="0.2"/>
  <circle cx="200" cy="40" r="2" fill="#ffffff" opacity="0.3"/>
</svg>