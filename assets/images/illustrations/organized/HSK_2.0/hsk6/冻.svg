<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Refrigerator Interior Gradient -->
    <linearGradient id="fridgeInt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ice/Frost Glow Filter -->
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Meat Gradient -->
    <linearGradient id="meatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Ice Crystal Gradient -->
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.5" />
    </linearGradient>

    <!-- Cool Lighting Overlay -->
    <radialGradient id="coolLight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Refrigerator Outer Frame (Open Door View) -->
  <rect x="25" y="20" width="190" height="200" rx="16" fill="#475569" />
  <rect x="33" y="28" width="174" height="184" rx="12" fill="url(#fridgeInt)" />
  
  <!-- Cool ambient glow inside fridge -->
  <rect x="33" y="28" width="174" height="184" rx="12" fill="url(#coolLight)" />

  <!-- Refrigerator Shelves -->
  <rect x="33" y="90" width="174" height="8" rx="3" fill="#64748b" />
  <rect x="33" y="100" width="174" height="4" rx="1" fill="#1e293b" opacity="0.4" />
  
  <rect x="33" y="165" width="174" height="8" rx="3" fill="#64748b" />
  <rect x="33" y="173" width="174" height="4" rx="1" fill="#1e293b" opacity="0.4" />

  <!-- Background props on top shelf -->
  <circle cx="65" cy="70" r="14" fill="#10b981" />
  <path d="M65 52 L65 56" stroke="#047857" stroke-width="3" stroke-linecap="round" />
  <path d="M60 70 C60 62, 70 62, 70 70 Z" fill="#34d399" />

  <rect x="150" y="55" width="26" height="35" rx="6" fill="#f59e0b" />
  <path d="M150 65 L176 65" stroke="#d97706" stroke-width="3" />

  <!-- MAIN SUBJECT: Frozen Meat on Bottom Shelf -->
  <!-- Cutting Board / Tray -->
  <path d="M75 167 C75 163, 80 160, 90 160 L145 160 C155 160, 160 163, 160 167 C160 171, 155 174, 145 174 L90 174 C80 174, 75 171, 75 167 Z" fill="#cbd5e1" />
  <circle cx="85" cy="167" r="3" fill="#94a3b8" />

  <!-- Action Sparkles / Frost Particles -->
  <g filter="url(#iceGlow)">
    <!-- Top-left action star -->
    <path d="M60 115 L63 125 L73 128 L63 131 L60 141 L57 131 L47 128 L57 125 Z" fill="#38bdf8" transform="scale(0.6) translate(60, 40)" />
    <!-- Top-right action star -->
    <path d="M180 100 L182 107 L189 109 L182 111 L180 118 L178 111 L171 109 L178 107 Z" fill="#bae6fd" />
    <!-- Bottom-right action star -->
    <path d="M165 140 L167 146 L173 148 L167 150 L165 156 L163 150 L157 148 L163 146 Z" fill="#38bdf8" transform="scale(0.8) translate(30, 10)" />
  </g>

  <!-- Solid Frozen Meat Chunk -->
  <g>
    <!-- Meat Body Shadow -->
    <path d="M92 124 C100 115, 135 112, 148 120 C162 128, 165 145, 155 158 C145 170, 95 170, 85 155 C78 145, 84 133, 92 124 Z" fill="#881337" />
    
    <!-- Main Meat Shape -->
    <path d="M90 120 C98 112, 133 109, 146 117 C160 125, 163 142, 153 155 C143 168, 93 168, 83 153 C76 143, 82 130, 90 120 Z" fill="url(#meatGrad)" />
    
    <!-- Marbling / Fat lines (Frozen stiff) -->
    <path d="M102 130 Q115 125 125 138" stroke="#ffe4e6" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M120 148 Q135 142 145 152" stroke="#ffe4e6" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M96 142 Q105 148 112 158" stroke="#ffe4e6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Frost / Ice Casing Overlay (Indicating 'Dong' / Frozen Solid) -->
    <path d="M83 153 C76 143, 82 130, 90 120 C98 112, 133 109, 146 117 C155 122, 160 132, 158 140 C145 132, 125 135, 115 145 C105 155, 92 162, 83 153 Z" fill="url(#iceGrad)" />

    <!-- Sharp Ice Crystals / Spikes sticking out of meat -->
    <path d="M85 125 L75 110 L92 118 Z" fill="#e0f2fe" filter="url(#iceGlow)" />
    <path d="M140 112 L150 98 L152 115 Z" fill="#e0f2fe" filter="url(#iceGlow)" />
    <path d="M155 138 L170 133 L158 148 Z" fill="#bae6fd" filter="url(#iceGlow)" />
    <path d="M110 160 L105 175 L120 165 Z" fill="#bae6fd" filter="url(#iceGlow)" />

    <!-- Hard Frost Highlights -->
    <path d="M90 124 C95 120, 110 116, 125 118" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M145 122 C153 130, 155 142, 150 152" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- Frost / Snow drifts on bottom of fridge -->
  <path d="M33 200 Q50 195, 70 203 Q100 197, 130 202 Q170 196, 207 202 L207 212 L33 212 Z" fill="#e2e8f0" opacity="0.8" />
  <path d="M60 200 Q80 192, 100 201 Q130 196, 150 201 Q180 195, 195 202 Z" fill="#ffffff" opacity="0.9" />

  <!-- Floating Cold Vapor Wisps -->
  <path d="M45 130 C40 125, 40 115, 50 110 C60 105, 55 95, 45 90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M185 80 C190 75, 195 70, 190 60 C185 50, 195 45, 200 35" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Refrigerator Door Edge / Seal (Right Side) -->
  <path d="M215 20 L215 220 L223 212 L223 28 Z" fill="#334155" />
  <rect x="219" y="90" width="3" height="60" rx="1.5" fill="#94a3b8" />
</svg>