<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor/Platform -->
  <path d="M20 200 L220 200 L240 220 L0 220 Z" fill="#334155"/>
  
  <!-- Red Carpet -->
  <path d="M80 200 L160 200 L175 240 L65 240 Z" fill="#e11d48"/>
  
  <!-- The High Chair/Throne -->
  <g transform="translate(120, 180)">
    <!-- Legs -->
    <rect x="-30" y="-10" width="8" height="15" fill="#f59e0b"/>
    <rect x="22" y="-10" width="8" height="15" fill="#f59e0b"/>
    <!-- Seat -->
    <rect x="-35" y="-25" width="70" height="15" fill="#fbbf24"/>
    <!-- Backrest -->
    <path d="M-35 -25 L-45 -100 L45 -100 L35 -25 Z" fill="#f59e0b"/>
    <!-- Decorative Accents -->
    <circle cx="0" cy="-60" r="12" fill="#fb923c"/>
    <path d="M-20 -80 L20 -80 L0 -40 Z" fill="#fbbf24"/>
  </g>
  
  <!-- Spotlight Glow -->
  <ellipse cx="120" cy="100" rx="60" ry="120" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Decorative Pillars/Background Elements -->
  <rect x="20" y="80" width="20" height="120" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="200" y="80" width="20" height="120" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Floating Accents -->
  <circle cx="50" cy="50" r="4" fill="#10b981"/>
  <circle cx="190" cy="40" r="6" fill="#ec4899"/>
  <circle cx="180" cy="150" r="3" fill="#fb923c"/>
</svg>