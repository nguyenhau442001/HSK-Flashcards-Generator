<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Spotlight Floor -->
  <ellipse cx="120" cy="210" rx="90" ry="20" fill="#334155" opacity="0.4"/>
  
  <!-- The Outstanding Subject: A golden trophy on a pedestal -->
  <g transform="translate(120, 180)">
    <!-- Pedestal -->
    <path d="M-30 0 L30 0 L25 -40 L-25 -40 Z" fill="#475569"/>
    <path d="M-35 -40 L35 -40 L35 -50 L-35 -50 Z" fill="#64748b"/>
    
    <!-- Trophy Base -->
    <rect x="-15" y="-65" width="30" height="15" fill="#f59e0b"/>
    <rect x="-5" y="-80" width="10" height="15" fill="#fbbf24"/>
    
    <!-- Trophy Cup -->
    <path d="M-25 -80 C-25 -110, -15 -120, 0 -120 C15 -120, 25 -110, 25 -80 Z" fill="#fb923c"/>
    <path d="M-25 -80 C-25 -110, -15 -120, 0 -120 C15 -120, 25 -110, 25 -80 L-25 -80" fill="#f59e0b"/>
    
    <!-- Handles -->
    <path d="M-25 -100 C-40 -100, -40 -85, -25 -85" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <path d="M25 -100 C40 -100, 40 -85, 25 -85" stroke="#fbbf24" stroke-width="4" fill="none"/>
  </g>
  
  <!-- Atmospheric Elements: Confetti/Sparkles -->
  <circle cx="60" cy="60" r="3" fill="#10b981"/>
  <circle cx="180" cy="50" r="4" fill="#38bdf8"/>
  <circle cx="100" cy="40" r="2" fill="#ec4899"/>
  <circle cx="150" cy="80" r="3" fill="#fbbf24"/>
  <path d="M40 120 L45 110 L50 120 Z" fill="#38bdf8"/>
  <path d="M200 130 L205 120 L210 130 Z" fill="#ec4899"/>
  
  <!-- Spotlight Glow -->
  <path d="M60 240 L120 40 L180 240 Z" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>