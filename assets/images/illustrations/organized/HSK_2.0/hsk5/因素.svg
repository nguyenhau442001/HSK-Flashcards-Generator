<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Main Subject: A complex mechanical clockwork gear mechanism (The 'factor' or 'element') -->
  <g transform="translate(120, 120)">
    <!-- Base Gear -->
    <circle cx="0" cy="0" r="45" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="0" cy="0" r="15" fill="#1e293b"/>
    
    <!-- Interlocking Gear 1 -->
    <circle cx="55" cy="-30" r="25" fill="#f59e0b"/>
    <circle cx="55" cy="-30" r="8" fill="#1e293b"/>
    
    <!-- Interlocking Gear 2 -->
    <circle cx="-40" cy="40" r="20" fill="#38bdf8"/>
    <circle cx="-40" cy="40" r="6" fill="#1e293b"/>
  </g>
  
  <!-- Supporting Elements (Props) -->
  <circle cx="50" cy="190" r="12" fill="#ec4899"/>
  <rect x="170" y="180" width="20" height="20" rx="4" fill="#10b981"/>
  
  <!-- Atmospheric Highlights -->
  <path d="M120 60 L130 80 L110 80 Z" fill="#fbbf24" opacity="0.6"/>
  <circle cx="180" cy="50" r="5" fill="#fb923c" opacity="0.4"/>
  <circle cx="40" cy="70" r="3" fill="#38bdf8" opacity="0.4"/>
  
  <!-- Connecting lines suggesting mechanics -->
  <line x1="120" y1="120" x2="165" y2="90" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="120" y1="120" x2="80" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
</svg>