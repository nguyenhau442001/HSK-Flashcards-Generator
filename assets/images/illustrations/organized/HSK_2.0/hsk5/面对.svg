<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Floor Grid / Surface Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Highlight Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Giant Challenge Wall Gradient (Red/Orange tension) -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting & Environment details -->
  <circle cx="120" cy="120" r="100" fill="url(#amberGlow)" />
  
  <!-- Background Tech/Atmosphere Grid Lines -->
  <g stroke="#334155" stroke-width="0.75" stroke-dasharray="4 4" opacity="0.4">
    <line x1="30" y1="40" x2="210" y2="40" />
    <line x1="30" y1="80" x2="210" y2="80" />
    <line x1="30" y1="120" x2="210" y2="120" />
    <line x1="30" y1="160" x2="210" y2="160" />
  </g>

  <!-- Floor Platform / Ground Surface -->
  <path d="M 20,185 L 220,185 L 200,210 L 40,210 Z" fill="url(#floorGrad)" />
  <ellipse cx="120" cy="185" rx="100" ry="8" fill="#1e293b" opacity="0.8" />
  
  <!-- Floor Accent Line -->
  <path d="M 40,185 L 200,185" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

  <!-- ================= SCENE SUBJECT: 'ĐỐI MẶT' (FACING THE CHALLENGE) ================= -->
  
  <!-- 1. The Looming Challenge Wall (Symbolizing the Reality / Obstacle) -->
  <g id="challenge-wall">
    <!-- Wall Shadow -->
    <path d="M 60,35 L 180,35 L 190,175 L 50,175 Z" fill="#000000" opacity="0.3" transform="translate(4, 6)" />
    
    <!-- Main Wall Structure -->
    <path d="M 55,30 L 185,30 L 195,170 L 45,170 Z" fill="url(#wallGrad)" stroke="#fda4af" stroke-width="2" />
    
    <!-- Wall Inner Panels/Details (Sci-fi/Modern architectural feel) -->
    <path d="M 65,42 L 175,42 L 181,158 L 59,158 Z" fill="#881337" opacity="0.5" />
    
    <!-- Glowing Hazard/Reality Symbols (Abstract geometric patterns instead of text) -->
    <circle cx="120" cy="85" r="28" fill="#ffe4e6" opacity="0.2" />
    <path d="M 120,65 L 138,95 L 102,95 Z" fill="none" stroke="#fb7185" stroke-width="4" stroke-linejoin="round" />
    <circle cx="120" cy="88" r="3" fill="#fb7185" />
    
    <!-- Structural Bolts on Wall -->
    <circle cx="65" cy="42" r="2" fill="#cbd5e1" />
    <circle cx="175" cy="42" r="2" fill="#cbd5e1" />
    <circle cx="59" cy="158" r="2" fill="#cbd5e1" />
    <circle cx="181" cy="158" r="2" fill="#cbd5e1" />
  </g>

  <!-- 2. Action-packed Dynamic Energy Beam / Focus Lines (Connecting Subject & Reality) -->
  <g opacity="0.5">
    <line x1="120" y1="130" x2="120" y2="160" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 3" />
    <line x1="100" y1="140" x2="80" y2="165" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="140" y1="140" x2="160" y2="165" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
  </g>

  <!-- 3. The Protagonist (Standing brave, facing directly forward/up at the wall) -->
  <g id="protagonist" transform="translate(0, 5)">
    <!-- Character Shadow -->
    <ellipse cx="120" cy="182" rx="18" ry="6" fill="#0f172a" opacity="0.7" />

    <!-- Legs & Boots -->
    <rect x="110" y="160" width="8" height="22" rx="3" fill="#1e293b" />
    <rect x="122" y="160" width="8" height="22" rx="3" fill="#1e293b" />
    <!-- Shoes -->
    <path d="M 106,180 L 115,180 A 3,3 0 0,1 118,183 L 106,183 Z" fill="#f59e0b" />
    <path d="M 122,180 L 134,180 A 3,3 0 0,1 137,183 L 122,183 Z" fill="#f59e0b" />

    <!-- Torso / Jacket (Facing Back/Side towards viewer, head turned up towards wall) -->
    <path d="M 104,130 L 136,130 L 142,162 L 98,162 Z" fill="url(#shirtGrad)" />
    
    <!-- Jacket Details / Collar -->
    <path d="M 112,130 L 120,142 L 128,130" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="120" y1="142" x2="120" y2="162" stroke="#0284c7" stroke-width="2" />

    <!-- Arms (Determined posture - fists clenched on hips/sides) -->
    <!-- Left Arm -->
    <path d="M 104,133 L 90,148 L 96,155" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Arm -->
    <path d="M 136,133 L 150,148 L 144,155" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Hands -->
    <circle cx="95" cy="156" r="4" fill="#fde047" />
    <circle cx="145" cy="156" r="4" fill="#fde047" />

    <!-- Head & Hair (Tilted back, looking UP at the towering wall) -->
    <circle cx="120" cy="114" r="14" fill="#fde047" /> <!-- Skin tone / Head base -->
    
    <!-- Stylish Hair -->
    <path d="M 106,112 C 106,102 114,98 122,98 C 132,98 135,106 135,114 C 130,110 126,108 120,108 C 114,108 110,110 106,112 Z" fill="#1e293b" />

    <!-- Determination Brow / Side Profile hint -->
    <path d="M 128,112 L 132,115" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 4. Floating Atmospheric Particles / Action Sparks -->
  <g fill="#fbbf24">
    <circle cx="85" cy="100" r="2.5" opacity="0.8" />
    <circle cx="155" cy="90" r="3" opacity="0.9" />
    <circle cx="70" cy="130" r="1.5" opacity="0.6" />
    <circle cx="170" cy="125" r="2" opacity="0.7" />
    <circle cx="105" cy="65" r="2" opacity="0.9" />
    <circle cx="135" cy="60" r="1.5" opacity="0.8" />
  </g>

  <!-- Energy Burst / Focus Rings around the Character -->
  <ellipse cx="120" cy="175" rx="35" ry="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  <ellipse cx="120" cy="175" rx="55" ry="16" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3" />

  <!-- Foreground Vignette / Frame Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>