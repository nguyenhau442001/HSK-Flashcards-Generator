<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Wall Grid Pattern -->
    <pattern id="wallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Stairs & Growth Gradient -->
    <linearGradient id="stairGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="stairTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Rocket Fire Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Architectural Studio Background -->
  <rect x="0" y="0" width="240" height="240" fill="url(#wallGrid)" opacity="0.6"/>
  
  <!-- Ambient Backlight for Progress -->
  <circle cx="160" cy="110" r="70" fill="#3b82f6" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="190" cy="70" r="40" fill="#10b981" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Background Environment Props (Desk & Plant) -->
  <!-- Desk surface -->
  <path d="M 20 195 L 220 195 L 210 215 L 30 215 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="25" y="195" width="190" height="4" fill="#334155" rx="1"/>

  <!-- Potted Plant (Growth metaphor backdrop) -->
  <g transform="translate(25, 160)">
    <path d="M 5 25 L 15 35 L 25 25 L 22 10 L 8 10 Z" fill="#64748b"/>
    <ellipse cx="15" cy="10" rx="7" ry="2" fill="#475569"/>
    <!-- Stem & Leaves -->
    <path d="M 15 10 Q 15 0 20 -10" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 15 5 Q 8 -2 3 -5" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="-10" r="4" fill="#34d399"/>
    <circle cx="3" cy="-5" r="3.5" fill="#34d399"/>
  </g>

  <!-- Ambient Floating Stars / Sparkles -->
  <g opacity="0.7">
    <path d="M 50 70 L 52 75 L 57 77 L 52 79 L 50 84 L 48 79 L 43 77 L 48 75 Z" fill="#fbbf24" transform="scale(0.6) translate(30, 20)"/>
    <path d="M 190 120 L 191.5 124 L 195.5 125.5 L 191.5 127 L 190 131 L 188.5 127 L 184.5 125.5 L 188.5 124 Z" fill="#38bdf8" transform="scale(0.8) translate(40, -10)"/>
    <path d="M 100 50 L 101 53 L 104 54 L 101 55 L 100 58 L 99 55 L 96 54 L 99 53 Z" fill="#f43f5e" transform="scale(0.7) translate(30, 20)"/>
  </g>

  <!-- MAIN SCENE: The Staircase of Progress -->
  <g transform="translate(15, 30)">
    <!-- Stair 1 (Base) -->
    <path d="M 10 140 L 50 140 L 50 160 L 10 160 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 10 140 L 50 140 L 60 130 L 20 130 Z" fill="#3b82f6"/>
    
    <!-- Stair 2 (Mid) -->
    <path d="M 50 120 L 95 120 L 95 160 L 50 160 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 50 120 L 95 120 L 105 110 L 60 110 Z" fill="#2563eb"/>

    <!-- Stair 3 (Higher) -->
    <path d="M 95 100 L 140 100 L 140 160 L 95 160 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 95 100 L 140 100 L 150 90 L 105 90 Z" fill="#1d4ed8"/>

    <!-- Stair 4 (Peak / Goal) -->
    <path d="M 140 75 L 190 75 L 190 160 L 140 160 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 140 75 L 190 75 L 200 65 L 150 65 Z" fill="#10b981"/>
    
    <!-- Progress Indicator Flag at the Top -->
    <g transform="translate(170, 20)">
      <line x1="0" y1="45" x2="0" y2="10" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0 10 L 25 20 L 0 30 Z" fill="#f43f5e"/>
      <circle cx="0" cy="10" r="3" fill="#fbbf24"/>
    </g>
  </g>

  <!-- DYNAMIC ACTION SUBJECT: The Progress Rocket (Symbolizing rapid advancement) -->
  <g transform="translate(135, 65) rotate(-25)">
    <!-- Rocket exhaust fire -->
    <polygon points="5,45 -5,45 0,75" fill="url(#fireGrad)" filter="url(#glow)"/>
    <polygon points="2,45 -2,45 0,60" fill="#ffffff" opacity="0.8"/>

    <!-- Rocket Body -->
    <path d="M 0 -25 C 12 -20 15 10 15 30 L -15 30 C -15 10 -12 -20 0 -25 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Rocket Nose Cone -->
    <path d="M 0 -25 C 6 -22 12 -15 15 -10 L -15 -10 C -12 -15 -6 -22 0 -25 Z" fill="#ef4444"/>

    <!-- Rocket Window / Porthole -->
    <circle cx="0" cy="2" r="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="0" cy="2" r="4" fill="#38bdf8"/>
    <path d="M -2 0 A 2 2 0 0 1 2 2" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>

    <!-- Rocket Fins -->
    <path d="M 15 20 L 24 32 L 15 30 Z" fill="#f59e0b"/>
    <path d="M -15 20 L -24 32 L -15 30 Z" fill="#f59e0b"/>
  </g>

  <!-- Secondary Dynamic Element: Soaring Paper Airplane (Represents lightweight, smooth progress) -->
  <g transform="translate(60, 80) rotate(-15)">
    <polygon points="0,0 20,8 5,12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>
    <polygon points="0,0 -10,12 5,12" fill="#cbd5e1"/>
    <polygon points="0,0 5,12 1,16" fill="#94a3b8"/>
    <!-- Motion Trail -->
    <path d="M -15 15 Q -8 13 -2 10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
  </g>

  <!-- Upward Trend Arrow Graphic overlaying the scene -->
  <g transform="translate(15, 20)">
    <path d="M 25 140 Q 60 120 90 90 T 175 45" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4" filter="url(#glow)" stroke-linecap="round"/>
    <!-- Arrowhead -->
    <polygon points="180,40 178,50 170,47" fill="#10b981"/>
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles -->
  <circle cx="115" cy="85" r="3" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="150" cy="45" r="2" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="85" cy="115" r="2.5" fill="#f43f5e" filter="url(#glow)"/>
  <circle cx="45" cy="140" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Highlighting Accents / Clean Vector Borders -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>