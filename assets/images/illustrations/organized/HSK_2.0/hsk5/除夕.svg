<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#311026" />
      <stop offset="60%" stop-color="#160914" />
      <stop offset="100%" stop-color="#0b040a" />
    </radialGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Warm Table Gradient -->
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Hotpot Soup Gradient -->
    <radialGradient id="soupGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </radialGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- WINDOW SCENE (Background) -->
  <g id="window-backdrop">
    <!-- Window Frame Outer -->
    <rect x="25" y="15" width="190" height="110" rx="6" fill="#78350f" filter="url(#softShadow)" />
    <!-- Window Pane Sky -->
    <rect x="30" y="20" width="180" height="100" rx="4" fill="url(#nightSky)" />
    
    <!-- Distant Fireworks -->
    <circle cx="60" cy="50" r="1.5" fill="#fef08a" />
    <!-- Firework 1 -->
    <path d="M160,45 L160,35 M160,45 L160,55 M160,45 L150,45 M160,45 L170,45 M160,45 L153,38 M160,45 L167,52 M160,45 L167,38 M160,45 L153,52" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="160" cy="45" r="2" fill="#fff" />
    
    <!-- Firework 2 -->
    <path d="M80,75 L80,67 M80,75 L80,83 M80,75 L72,75 M80,75 L88,75 M80,75 L74,69 M80,75 L86,81 M80,75 L86,69 M80,75 L74,81" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="80" cy="75" r="2" fill="#fff" />

    <!-- Window Sill / Inner Frame -->
    <rect x="25" y="116" width="190" height="9" fill="#92400e" />
    
    <!-- Hanging Red Lantern Inside -->
    <circle cx="35" cy="50" r="25" fill="url(#lanternGlow)" />
    <path d="M30,30 Q25,45 30,60 L40,60 Q45,45 40,30 Z" fill="#dc2626" />
    <path d="M30,30 Q35,27 40,30 Z" fill="#fbbf24" />
    <path d="M30,60 Q35,63 40,60 Z" fill="#fbbf24" />
    <line x1="35" y1="15" x2="35" y2="30" stroke="#b45309" stroke-width="1.5" />
    <line x1="35" y1="60" x2="35" y2="68" stroke="#fbbf24" stroke-width="1" />
  </g>

  <!-- WARM INTERIOR WALL & LIGHTING -->
  <path d="M0,120 L240,120 L240,240 L0,240 Z" fill="#180b18" />
  
  <!-- Ambient glow from feast -->
  <radialGradient id="feastGlow" cx="50%" cy="140" r="100">
    <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
  </radialGradient>
  <rect width="240" height="240" fill="url(#feastGlow)" pointer-events="none"/>

  <!-- DINING TABLE -->
  <!-- Table Surface -->
  <path d="M10,155 L230,155 L215,225 L25,225 Z" fill="url(#woodTable)" filter="url(#softShadow)" />
  <!-- Table Edge/Rim (3D depth) -->
  <path d="M10,155 L230,155 L233,163 L7,163 Z" fill="#92400e" />
  <!-- Table Legs shadow/accent -->
  <path d="M35,225 L45,240 L55,240 L45,225 Z" fill="#291104" />
  <path d="M205,225 L195,240 L185,240 L195,225 Z" fill="#291104" />

  <!-- BANQUET PROPS (REUNION DINNER - CHÚXÍ) -->
  
  <!-- Plate 1: Dumplings (Jiaozi) on Bamboo Steamer / Plate (Left) -->
  <g transform="translate(45, 150)">
    <!-- Plate -->
    <ellipse cx="25" cy="20" rx="22" ry="10" fill="#f1f5f9" />
    <ellipse cx="25" cy="18" rx="20" ry="8" fill="#e2e8f0" />
    <!-- Dumplings -->
    <path d="M12,18 C14,12 20,12 24,18 Z" fill="#fff" stroke="#cbd5e1" stroke-width="0.5"/>
    <path d="M22,19 C25,13 32,13 36,19 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
    <path d="M16,15 C19,9 27,9 31,15 Z" fill="#fff" stroke="#cbd5e1" stroke-width="0.5"/>
    <!-- Dumpling shadows -->
    <ellipse cx="24" cy="20" rx="18" ry="6" fill="#cbd5e1" opacity="0.3"/>
  </g>

  <!-- Plate 2: Whole Fish (Symbol of Prosperity - Niannian Youyu) (Right) -->
  <g transform="translate(150, 145)">
    <!-- Oval Serving Dish -->
    <ellipse cx="35" cy="22" rx="30" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <ellipse cx="35" cy="20" rx="27" ry="10" fill="#f1f5f9"/>
    <!-- Fish Body -->
    <path d="M15,20 Q35,10 50,20 Q35,30 15,20 Z" fill="#fb923c" />
    <!-- Fish Tail -->
    <path d="M48,15 L58,10 L55,20 L58,30 L48,25 Z" fill="#ea580c" />
    <!-- Fish Head & Details -->
    <path d="M18,20 Q22,15 25,20 Q22,25 18,20 Z" fill="#f97316" />
    <circle cx="21" cy="18" r="1" fill="#0f172a" />
    <!-- Scale patterns -->
    <path d="M26,17 Q28,20 26,23 M32,16 Q34,20 32,24 M38,17 Q40,20 38,23" stroke="#fed7aa" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Garnish (Spring onions) -->
    <path d="M30,14 C33,12 36,15 39,13" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Centerpiece: Chinese Hotpot (Huoguo) - Boiling Reunion Pot -->
  <g transform="translate(100, 115)">
    <!-- Hotpot Stand Base -->
    <ellipse cx="20" cy="55" rx="25" ry="8" fill="#475569" />
    <!-- Burner flame glow -->
    <ellipse cx="20" cy="52" rx="15" ry="4" fill="#f97316" />
    
    <!-- Pot Body (Copper/Gold finish) -->
    <path d="M-2,30 C-2,10 42,10 42,30 C45,40 35,50 20,50 C5,50 -5,40 -2,30 Z" fill="#d97706" filter="url(#softShadow)" />
    <!-- Pot Rim -->
    <ellipse cx="20" cy="28" rx="23" ry="7" fill="#fbbf24" />
    <!-- Inner Soup / Boiling Broth -->
    <ellipse cx="20" cy="29" rx="20" ry="5" fill="url(#soupGlow)" />
    
    <!-- Steam / Bubbles -->
    <path d="M12,22 C10,16 15,12 12,6" stroke="#f1f5f9" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M24,23 C26,17 22,12 26,5" stroke="#f1f5f9" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>
    <circle cx="17" cy="20" r="1.5" fill="#fef08a" />
    <circle cx="23" cy="21" r="1" fill="#fef08a" />

    <!-- Pot Handles -->
    <path d="M-4,30 C-9,30 -9,40 -4,40" stroke="#b45309" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M44,30 C49,30 49,40 44,40" stroke="#b45309" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Small Bowls & Chopsticks (Foreground Elements) -->
  <!-- Left Bowl Stack -->
  <g transform="translate(25, 165)">
    <ellipse cx="15" cy="15" rx="12" ry="6" fill="#cbd5e1" />
    <ellipse cx="15" cy="13" rx="10" ry="5" fill="#f8fafc" />
    <ellipse cx="15" cy="12" rx="8" ry="3" fill="#fda4af" /> <!-- Rice -->
    <!-- Chopsticks resting -->
    <rect x="-2" y="2" width="30" height="2.5" rx="1" fill="#b45309" transform="rotate(-15 13 3)" filter="url(#softShadow)" />
    <rect x="-2" y="7" width="30" height="2.5" rx="1" fill="#d97706" transform="rotate(-15 13 8)" filter="url(#softShadow)" />
  </g>

  <!-- Right Bowl Stack -->
  <g transform="translate(180, 165)">
    <ellipse cx="15" cy="15" rx="12" ry="6" fill="#cbd5e1" />
    <ellipse cx="15" cy="13" rx="10" ry="5" fill="#f8fafc" />
    <ellipse cx="15" cy="12" rx="8" ry="3" fill="#fda4af" /> <!-- Rice -->
    <!-- Chopsticks resting -->
    <rect x="2" y="2" width="30" height="2.5" rx="1" fill="#b45309" transform="rotate(15 13 3)" filter="url(#softShadow)" />
  </g>

  <!-- Red Envelope (Hóngbāo) peeking on table - Symbol of New Year -->
  <g transform="translate(110, 175) rotate(12)">
    <rect width="18" height="26" rx="2" fill="#dc2626" filter="url(#softShadow)" />
    <rect width="18" height="26" rx="2" fill="none" stroke="#b91c1c" stroke-width="1" />
    <!-- Gold emblem seal -->
    <circle cx="9" cy="13" r="4" fill="#fbbf24" />
    <circle cx="9" cy="13" r="2.5" fill="#f59e0b" />
  </g>

  <!-- Oranges / Tangerines (Lucky Fruit for Lunar New Year) -->
  <g transform="translate(85, 178)">
    <circle cx="0" cy="0" r="8" fill="#f97316" filter="url(#softShadow)" />
    <circle cx="0" cy="0" r="8" fill="url(#soupGlow)" opacity="0.3" />
    <path d="M-1,-8 C0,-11 3,-11 2,-8" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <circle cx="12" cy="4" r="7" fill="#ea580c" filter="url(#softShadow)" />
    <path d="M11,-3 C12,-6 15,-5 14,-3" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Festive Hanging Couplet / Ribbon detail at top corners -->
  <path d="M0,0 L25,0 L0,25 Z" fill="#991b1b" opacity="0.8"/>
  <path d="M240,0 L215,0 L240,25 Z" fill="#991b1b" opacity="0.8"/>

</svg>