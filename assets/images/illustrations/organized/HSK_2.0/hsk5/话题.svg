<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Podcast/Chat Glow Gradient -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Microphone Gradients -->
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="micHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Speech Bubble Gradients -->
    <linearGradient id="bubblePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <linearGradient id="bubbleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="bubblePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glows (Representing lively discussion and topics) -->
  <circle cx="120" cy="110" r="80" fill="url(#amberGlow)"/>
  <circle cx="60" cy="80" r="50" fill="url(#blueGlow)"/>

  <!-- Background Ambient Elements (Studio/Discussion vibe) -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="40" x2="60" y2="40"/>
    <line x1="30" y1="50" x2="50" y2="50"/>
    <line x1="180" y1="180" x2="210" y2="180"/>
    <line x1="190" y1="190" x2="210" y2="190"/>
    <!-- Sound wave circles -->
    <circle cx="120" cy="115" r="70" fill="none" stroke-dasharray="4 8"/>
    <circle cx="120" cy="115" r="95" fill="none" stroke-dasharray="6 10"/>
  </g>

  <!-- Floating Dynamic Speech Bubbles (Visualizing "Topics" / Conversation) -->
  <g filter="url(#softShadow)">
    <!-- Small Green Bubble (Top Left) -->
    <path d="M 45 75 Q 45 65 55 65 L 85 65 Q 95 65 95 75 L 95 90 Q 95 100 85 100 L 70 100 L 60 112 L 63 100 L 55 100 Q 45 100 45 90 Z" fill="#10b981"/>
    <circle cx="60" cy="82.5" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="70" cy="82.5" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="80" cy="82.5" r="3" fill="#ffffff" opacity="0.9"/>

    <!-- Purple Bubble (Top Right) -->
    <path d="M 145 55 Q 145 45 155 45 L 195 45 Q 205 45 205 55 L 205 75 Q 205 85 195 85 L 180 85 L 172 98 L 175 85 L 155 85 Q 145 85 145 75 Z" fill="url(#bubblePurple)"/>
    <rect x="157" y="60" width="24" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="157" y="68" width="30" height="4" rx="2" fill="#ffffff" opacity="0.6"/>

    <!-- Large Pink Bubble (Mid Left) -->
    <path d="M 30 130 Q 30 118 42 118 L 88 118 Q 100 118 100 130 L 100 152 Q 100 164 88 164 L 75 164 L 65 178 L 68 164 L 42 164 Q 30 164 30 152 Z" fill="url(#bubblePink)"/>
    <!-- Lightbulb/idea symbol inside bubble -->
    <path d="M 65 130 C 59 130 55 134 55 139 C 55 143 58 146 60 148 L 60 152 C 60 153 61 154 62 154 L 68 154 C 69 154 70 153 70 152 L 70 148 C 72 146 75 143 75 139 C 75 134 71 130 65 130 Z" fill="#fef08a"/>
    <rect x="62" y="156" width="6" height="2" rx="1" fill="#cbd5e1"/>
    <!-- Abstract text lines -->
    <rect x="78" y="133" width="14" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="78" y="142" width="10" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Central Stage / Platform for the Main Subject -->
  <g transform="translate(0, 10)">
    <!-- Floor Shadow -->
    <ellipse cx="120" cy="180" rx="45" ry="12" fill="#000000" opacity="0.4"/>
    
    <!-- Platform Base -->
    <path d="M 75 175 Q 120 165 165 175 L 175 185 Q 120 195 65 185 Z" fill="#334155" filter="url(#dropShadow)"/>
    <path d="M 75 175 Q 120 185 165 175 L 165 178 Q 120 188 75 178 Z" fill="#475569"/>

    <!-- MAIN SUBJECT: The Vintage Studio Microphone (Representing the focal point of a discussion / topic) -->
    <g filter="url(#dropShadow)">
      <!-- Stand Pole -->
      <rect x="116" y="110" width="8" height="70" rx="4" fill="url(#metalBody)"/>
      <!-- Stand Base Joint -->
      <circle cx="120" cy="115" r="8" fill="#0284c7"/>
      
      <!-- Microphone Neck Curved Connector -->
      <path d="M 112 105 C 112 95 128 95 128 105" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>

      <!-- Outer Horseshoe Frame -->
      <path d="M 102 65 C 98 75 98 90 108 98 C 114 102 126 102 132 98 C 142 90 142 75 138 65" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>

      <!-- Microphone Head (Vintage Ribbon/Dynamic Style) -->
      <rect x="104" y="50" width="32" height="46" rx="16" fill="url(#micHead)"/>
      <!-- Inner Grille Details -->
      <rect x="109" y="55" width="22" height="36" rx="11" fill="none" stroke="#b45309" stroke-width="2"/>
      <line x1="109" y1="67" x2="131" y2="67" stroke="#b45309" stroke-width="1.5"/>
      <line x1="109" y1="73" x2="131" y2="73" stroke="#b45309" stroke-width="1.5"/>
      <line x1="109" y1="79" x2="131" y2="79" stroke="#b45309" stroke-width="1.5"/>
      <!-- Highlights on Mic Head -->
      <path d="M 108 55 C 106 65 106 80 108 90" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Radiating Sound Waves / Excitement from the Mic -->
    <path d="M 92 65 C 86 72 86 85 92 92" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 148 65 C 154 72 154 85 148 92" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 82 55 C 73 67 73 85 82 98" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 158 55 C 167 67 167 85 158 98" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Foreground Chat Elements (Enhancing 'Topic/Discussion' context) -->
  <g filter="url(#dropShadow)">
    <!-- Blue Speech Bubble (Bottom Right) -->
    <path d="M 130 185 Q 130 173 142 173 L 188 173 Q 200 173 200 185 L 200 207 Q 200 219 188 219 L 160 219 L 148 232 L 152 219 L 142 219 Q 130 219 130 207 Z" fill="url(#bubbleBlue)"/>
    <!-- Question mark inside bubble (Symbolizing inquiry/topic) -->
    <path d="M 160 187 C 160 182 164 179 169 179 C 174 179 178 182 178 187 C 178 191 174 193 171 196 L 171 200 C 171 201 170 202 169 202 C 168 202 167 201 167 200 L 167 195 C 170 193 173 192 173 188 C 173 185 171 183 169 183 C 167 183 165 185 165 188 Z" fill="#ffffff"/>
    <circle cx="169" cy="207" r="2" fill="#ffffff"/>

    <!-- Small Orange Floating Accent Bubble -->
    <path d="M 40 195 Q 40 188 47 188 L 73 188 Q 80 188 80 195 L 80 207 Q 80 214 73 214 L 63 214 L 55 224 L 58 214 L 47 214 Q 40 214 40 207 Z" fill="#fb923c"/>
    <circle cx="53" cy="201" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="60" cy="201" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="67" cy="201" r="2" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Sparkles / Highlights adding app-ready pop and polish -->
  <g fill="#fef08a" opacity="0.9">
    <!-- Top left sparkle -->
    <path d="M 35 45 Q 35 40 30 40 Q 35 40 35 35 Q 35 40 40 40 Q 35 40 35 45 Z"/>
    <!-- Top right sparkle -->
    <path d="M 205 95 Q 205 90 200 90 Q 205 90 205 85 Q 205 90 210 90 Q 205 90 205 95 Z"/>
    <!-- Center right sparkle -->
    <path d="M 125 32 Q 125 28 121 28 Q 125 28 125 24 Q 125 28 129 28 Q 125 28 125 32 Z"/>
  </g>
</svg>