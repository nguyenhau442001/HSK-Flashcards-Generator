<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Camera Body -->
    <rect x="20" y="40" width="120" height="80" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="50" width="100" height="60" rx="4" fill="#0f172a"/>
    
    <!-- Lens -->
    <circle cx="80" cy="80" r="35" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="80" cy="80" r="22" fill="#0f172a"/>
    <circle cx="80" cy="80" r="12" fill="#38bdf8" opacity="0.3"/>
    
    <!-- Flash/Details -->
    <rect x="110" y="50" width="20" height="10" rx="2" fill="#fb923c"/>
    <rect x="30" y="50" width="20" height="10" rx="2" fill="#fbbf24"/>
    
    <!-- Screen/Back Detail -->
    <rect x="145" y="45" width="50" height="70" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="150" y="50" width="40" height="60" rx="2" fill="#0f172a"/>
    <rect x="155" y="55" width="30" height="40" rx="1" fill="#10b981" opacity="0.2"/>
    
    <!-- Decorative Sparks/Data flow -->
    <path d="M160 120 L170 135 M180 120 L190 135" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="170" cy="140" r="3" fill="#fb923c"/>
    <circle cx="190" cy="140" r="3" fill="#38bdf8"/>
  </g>

  <!-- Surface/Table -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  <path d="M0 180 L240 180" stroke="#334155" stroke-width="1"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="100" r="80" fill="#38bdf8" opacity="0.05"/>
</svg>