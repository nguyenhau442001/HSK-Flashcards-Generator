<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Map Glow / Hologram Effect -->
    <radialGradient id="holoGlow" x1="0.5" y1="0.5" x2="0.5" y2="0.5" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Subtle Grid) -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <line x1="30" y1="0" x2="30" y2="240"/>
    <line x1="90" y1="0" x2="90" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="210" y1="0" x2="210" y2="240"/>
    <line x1="0" y1="40" x2="240" y2="40"/>
    <line x1="0" y1="100" x2="240" y2="100"/>
    <line x1="0" y1="160" x2="240" y2="160"/>
    <line x1="0" y1="220" x2="240" y2="220"/>
  </g>

  <!-- Holographic Table Base / Projector -->
  <g transform="translate(0, 25)">
    <ellipse cx="120" cy="180" rx="90" ry="25" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <ellipse cx="120" cy="180" rx="75" ry="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <ellipse cx="120" cy="180" rx="60" ry="12" fill="url(#holoGlow)"/>
    <!-- Projector light cone -->
    <polygon points="120,110 80,180 160,180" fill="#38bdf8" opacity="0.05"/>
  </g>

  <!-- Main Subject: Geographic Map Representation (Uneven Distribution) -->
  <g transform="translate(0, 10)">
    <!-- Holographic Map Base Plate -->
    <path d="M 60,110 Q 120,90 180,110 Q 200,130 185,155 Q 120,175 55,155 Q 40,130 60,110 Z" 
          fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" stroke-dasharray="4 2"/>

    <!-- Contour Lines inside Map -->
    <path d="M 75,120 Q 120,105 165,120" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
    <path d="M 65,138 Q 120,122 175,138" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

    <!-- Interconnecting Distribution Grid Lines -->
    <g stroke="#38bdf8" stroke-width="1" opacity="0.4" stroke-dasharray="2 2">
      <!-- Dense Cluster Links (Left Side) -->
      <line x1="80" y1="125" x2="95" y2="135"/>
      <line x1="95" y1="135" x2="88" y2="148"/>
      <line x1="80" y1="125" x2="88" y2="148"/>
      <line x1="95" y1="135" x2="110" y2="128"/>
      
      <!-- Sparse Links (Right Side) -->
      <line x1="140" y1="140" x2="170" y2="125"/>
    </g>

    <!-- DENSE CLUSTER (Left Side - High Population/Concentration) -->
    <!-- Large main pillar/node -->
    <g transform="translate(95, 135)">
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#fb923c" opacity="0.3"/>
      <path d="M-10,0 L-10,-35 L10,-35 L10,0 Z" fill="url(#bgGrad)" stroke="#fb923c" stroke-width="2"/>
      <ellipse cx="0" cy="-35" rx="10" ry="5" fill="#fb923c" filter="url(#glow)"/>
      <ellipse cx="0" cy="-35" rx="10" ry="5" fill="#fed7aa"/>
    </g>

    <!-- Surrounding dense nodes -->
    <g transform="translate(80, 125)">
      <path d="M-7,0 L-7,-22 L7,-22 L7,0 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <ellipse cx="0" cy="-22" rx="7" ry="3.5" fill="#f59e0b"/>
    </g>

    <g transform="translate(88, 148)">
      <path d="M-8,0 L-8,-28 L8,-28 L8,0 Z" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
      <ellipse cx="0" cy="-28" rx="8" ry="4" fill="#fbbf24"/>
    </g>

    <g transform="translate(110, 128)">
      <path d="M-6,0 L-6,-18 L6,-18 L6,0 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <ellipse cx="0" cy="-18" rx="6" ry="3" fill="#f59e0b"/>
    </g>

    <g transform="translate(102, 142)">
      <path d="M-5,0 L-5,-20 L5,-20 L5,0 Z" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
      <ellipse cx="0" cy="-20" rx="5" ry="2.5" fill="#fb923c"/>
    </g>


    <!-- SPARSE CLUSTER (Right Side - Low Population/Concentration) -->
    <!-- Small isolated pillar 1 -->
    <g transform="translate(140, 140)">
      <ellipse cx="0" cy="0" rx="8" ry="4" fill="#38bdf8" opacity="0.3"/>
      <path d="M-4,0 L-4,-10 L4,-10 L4,0 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <ellipse cx="0" cy="-10" rx="4" ry="2" fill="#38bdf8"/>
    </g>

    <!-- Small isolated pillar 2 (Very sparse) -->
    <g transform="translate(170, 125)">
      <ellipse cx="0" cy="0" rx="6" ry="3" fill="#38bdf8" opacity="0.3"/>
      <path d="M-3,0 L-3,-6 L3,-6 L3,0 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <ellipse cx="0" cy="-6" rx="3" ry="1.5" fill="#38bdf8"/>
    </g>

    <!-- Medium sparse pillar 3 -->
    <g transform="translate(155, 115)">
      <ellipse cx="0" cy="0" rx="7" ry="3.5" fill="#10b981" opacity="0.3"/>
      <path d="M-4,0 L-4,-12 L4,-12 L4,0 Z" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <ellipse cx="0" cy="-12" rx="4" ry="2" fill="#10b981"/>
    </g>
  </g>

  <!-- Floating UI / Analysis Elements (Enhancing 'Distribution' Context) -->
  <!-- Magnifying Glass / Scanner focused on the dense area -->
  <g transform="translate(95, 75)">
    <!-- Glass circle -->
    <circle cx="0" cy="0" r="18" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <!-- Handle -->
    <line x1="12" y1="12" x2="24" y2="24" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- Crosshairs inside lens -->
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Floating Data Particles / Sparks representing uneven spread -->
  <g>
    <!-- Dense side floating sparks (Warm/Active) -->
    <circle cx="85" cy="80" r="2.5" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="70" cy="95" r="1.5" fill="#f59e0b"/>
    <circle cx="105" cy="90" r="2" fill="#fb923c" filter="url(#glow)"/>
    
    <!-- Sparse side floating sparks (Cool/Calm) -->
    <circle cx="165" cy="90" r="1.5" fill="#38bdf8"/>
    <circle cx="180" cy="105" r="1" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Ambient Lighting Overlays -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.1"/>
</svg>