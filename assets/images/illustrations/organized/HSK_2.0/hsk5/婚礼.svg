<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#311030"/>
    </linearGradient>

    <!-- Arch Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Romantic Pink Glow -->
    <radialGradient id="pinkGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="120" cy="110" r="100" fill="url(#pinkGlow)"/>

  <!-- Background Architecture (Wedding Arch) -->
  <g id="arch">
    <!-- Floral Backdrops -->
    <circle cx="85" cy="75" r="18" fill="#f43f5e" opacity="0.8"/>
    <circle cx="70" cy="85" r="14" fill="#fb7185" opacity="0.9"/>
    <circle cx="155" cy="75" r="18" fill="#f43f5e" opacity="0.8"/>
    <circle cx="170" cy="85" r="14" fill="#fb7185" opacity="0.9"/>
    <circle cx="120" cy="60" r="22" fill="#fda4af"/>
    <circle cx="105" cy="65" r="15" fill="#f43f5e"/>
    <circle cx="135" cy="65" r="15" fill="#f43f5e"/>

    <!-- Arch Structure -->
    <path d="M 70 180 L 70 95 C 70 65, 170 65, 170 95 L 170 180" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Draping Fabric -->
    <path d="M 70 95 Q 120 120 170 95 Q 120 85 70 95 Z" fill="#ffffff" opacity="0.15"/>
    <path d="M 85 100 Q 120 140 155 100 Q 120 115 85 100 Z" fill="#f43f5e" opacity="0.2"/>
  </g>

  <!-- Ambient Lights / Bokeh -->
  <circle cx="45" cy="50" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="195" cy="65" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="35" cy="130" r="2.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="210" cy="140" r="3.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="90" cy="35" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="150" cy="40" r="3" fill="#fbbf24" opacity="0.7"/>

  <!-- Floor Platform & Aisle -->
  <rect x="0" y="175" width="240" height="65" fill="url(#floorGrad)"/>
  <!-- Aisle Runner (Perspective Trapezoid) -->
  <polygon points="95,175 145,175 175,240 65,240" fill="#f8fafc" opacity="0.1"/>
  <polygon points="100,175 140,175 168,240 72,240" fill="#f43f5e" opacity="0.15"/>

  <!-- Couple Characters -->
  <!-- Groom (Left) -->
  <g id="groom">
    <!-- Legs/Shoes -->
    <rect x="92" y="210" width="8" height="30" fill="#0f172a" rx="4"/>
    <ellipse cx="94" cy="238" rx="5" ry="3" fill="#000000"/>
    
    <!-- Body / Suit -->
    <path d="M 85 160 L 107 160 L 112 215 L 80 215 Z" fill="#1e293b"/>
    <!-- Suit lapels & shirt -->
    <polygon points="96,160 100,185 104,160" fill="#f8fafc"/>
    <polygon points="100,170 100,195 97,180" fill="#38bdf8"/> <!-- Bowtie/Tie -->
    
    <!-- Head & Hair -->
    <circle cx="96" cy="142" r="13" fill="#fbcfe8"/> <!-- Skin -->
    <path d="M 83 140 C 83 130, 109 130, 109 142 L 107 135 C 100 130, 90 130, 83 135 Z" fill="#0f172a"/> <!-- Hair -->
    
    <!-- Arm reaching out -->
    <path d="M 90 165 Q 105 175 112 165" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Bride (Right) -->
  <g id="bride">
    <!-- Shoes -->
    <ellipse cx="146" cy="238" rx="4" ry="2" fill="#fb7185"/>

    <!-- Wedding Dress (Flared Skirt) -->
    <path d="M 124 165 L 156 165 C 175 220, 165 238, 140 238 C 115 238, 105 220, 124 165 Z" fill="#f8fafc"/>
    <!-- Dress subtle folds -->
    <path d="M 140 165 Q 150 200, 160 235" fill="none" stroke="#e2e8f0" stroke-width="1.5" opacity="0.6"/>
    <path d="M 140 165 Q 130 200, 120 235" fill="none" stroke="#e2e8f0" stroke-width="1.5" opacity="0.6"/>

    <!-- Veil & Head -->
    <path d="M 140 125 C 155 125, 165 140, 160 170 C 155 200, 145 220, 140 220" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <circle cx="144" cy="142" r="12" fill="#fbcfe8"/> <!-- Skin -->
    <path d="M 132 138 C 132 132, 156 132, 156 142 C 156 142, 150 148, 144 148 C 138 148, 132 142, 132 138 Z" fill="#78350f"/> <!-- Hair -->
    
    <!-- Bouquet -->
    <circle cx="128" cy="180" r="10" fill="#f43f5e"/>
    <circle cx="122" cy="175" r="7" fill="#fb7185"/>
    <circle cx="132" cy="173" r="7" fill="#ffffff"/>
    <circle cx="126" cy="184" r="7" fill="#fb923c"/>
    
    <!-- Arms -->
    <path d="M 148 165 Q 138 175, 130 180" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Interlocking Hands / Gesture of Connection -->
  <circle cx="120" cy="172" r="5" fill="#fbcfe8"/>

  <!-- Foreground Florals & Confetti (Action/Festive Depth) -->
  <!-- Floating Confetti & Petals -->
  <path d="M 50 100 L 55 105 L 52 110 Z" fill="#f43f5e" transform="rotate(15, 52, 105)"/>
  <path d="M 190 115 L 197 118 L 193 124 Z" fill="#38bdf8" transform="rotate(45, 193, 120)"/>
  <circle cx="75" cy="130" r="3" fill="#fbbf24"/>
  <circle cx="170" cy="135" r="3.5" fill="#f43f5e"/>
  <path d="M 100 80 Q 105 85, 100 90 Q 95 85, 100 80" fill="#fb7185"/>
  <path d="M 145 85 Q 150 90, 145 95 Q 140 90, 145 85" fill="#ec4899"/>

  <!-- Left Foreground Floral Pillar -->
  <path d="M 15 240 L 15 190 C 15 170, 35 170, 35 190 L 35 240" fill="#0f172a" stroke="#d97706" stroke-width="3"/>
  <circle cx="25" cy="185" r="14" fill="#f43f5e"/>
  <circle cx="18" cy="175" r="10" fill="#fb7185"/>
  <circle cx="32" cy="175" r="10" fill="#fbbf24"/>
  <circle cx="25" cy="165" r="11" fill="#ffffff"/>

  <!-- Right Foreground Floral Pillar -->
  <path d="M 225 240 L 225 190 C 225 170, 205 170, 205 190 L 205 240" fill="#0f172a" stroke="#d97706" stroke-width="3"/>
  <circle cx="215" cy="185" r="14" fill="#f43f5e"/>
  <circle cx="208" cy="175" r="10" fill="#fb7185"/>
  <circle cx="222" cy="175" r="10" fill="#fbbf24"/>
  <circle cx="215" cy="165" r="11" fill="#ffffff"/>

  <!-- Sparkles / Magic festive touches -->
  <path d="M 120 30 L 122 38 L 130 40 L 122 42 L 120 50 L 118 42 L 110 40 L 118 38 Z" fill="#fbbf24"/>
  <path d="M 60 55 L 61 59 L 65 60 L 61 61 L 60 65 L 59 61 L 55 60 L 59 59 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 180 55 L 181 59 L 185 60 L 181 61 L 180 65 L 179 61 L 175 60 L 179 59 Z" fill="#fbbf24" opacity="0.8"/>
</svg>