<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1a2234" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Glow for Bucket -->
    <radialGradient id="bucketGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Scene -->
  <!-- Back Wall & Wallpaper Accents -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4" />
  
  <!-- Window -->
  <g transform="translate(150, 30)">
    <rect width="50" height="65" rx="6" fill="#0b0f19" stroke="#475569" stroke-width="3" />
    <rect x="5" y="5" width="40" height="55" rx="2" fill="#1e293b" />
    <!-- Window pane highlights -->
    <line x1="25" y1="5" x2="25" y2="60" stroke="#475569" stroke-width="2" />
    <line x1="5" y1="32" x2="45" y2="32" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Light Beam from Window -->
  <polygon points="150,30 200,30 230,170 80,170" fill="url(#lightBeam)" />

  <!-- Wall Shelf with Housework Supplies -->
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="70" height="6" rx="3" fill="#475569" />
    <!-- Spray bottle on shelf -->
    <path d="M12,-16 h6 v16 h-6 z" fill="#ec4899" />
    <path d="M15,-22 h8 v6 h-8 z" fill="#38bdf8" />
    <path d="M10,-19 l-6 -3 v-3 h6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Rolled cloth / sponge -->
    <circle cx="45" cy="-6" r="6" fill="#fbbf24" />
    <circle cx="55" cy="-5" r="5" fill="#10b981" />
  </g>

  <!-- Floor -->
  <path d="M 0,170 L 240,170 L 240,240 L 0,240 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#0f172a" stroke-width="3" />

  <!-- Floorboards perspective lines -->
  <path d="M 40,170 L 10,240 M 90,170 L 70,240 M 150,170 L 160,240 M 200,170 L 225,240" stroke="#161f30" stroke-width="1.5" stroke-linecap="round" />

  <!-- MAIN SUBJECT 1: BUCKET & SOAP SUDS (Foreground Left) -->
  <g transform="translate(45, 155)" filter="url(#shadow)">
    <!-- Bucket shadow -->
    <ellipse cx="22" cy="30" rx="20" ry="6" fill="#000000" opacity="0.5" />
    <!-- Bucket body -->
    <path d="M 6,6 L 12,32 L 32,32 L 38,6 Z" fill="#0284c7" />
    <path d="M 6,6 Q 22,10 38,6 L 36,2 Q 22,6 8,2 Z" fill="#38bdf8" />
    <!-- Water inside bucket -->
    <ellipse cx="22" cy="7" rx="14" ry="3" fill="#bae6fd" />
    <!-- Bubbles overflowing -->
    <circle cx="15" cy="4" r="5" fill="#ffffff" opacity="0.9" />
    <circle cx="25" cy="2" r="7" fill="#ffffff" opacity="0.95" />
    <circle cx="32" cy="5" r="4" fill="#ffffff" opacity="0.9" />
    <circle cx="20" cy="-2" r="4" fill="#ffffff" opacity="0.8" />
    <!-- Handle -->
    <path d="M 4,4 C -2,-4 -2,-12 6,-16" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- MAIN SUBJECT 2: ACTION-PACKED BROOM & DUSTPAN (Center-Right) -->
  <g transform="translate(130, 95)" filter="url(#shadow)">
    <!-- Broom stick diagonal motion -->
    <line x1="60" y1="-75" x2="-20" y2="105" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <line x1="60" y1="-75" x2="-20" y2="105" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    
    <!-- Broom Top Handle Grip -->
    <circle cx="63" cy="-82" r="4" fill="#ef4444" />

    <!-- Motion lines for sweeping action -->
    <path d="M -35,80 Q -15,70 5,85" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M -25,95 Q -5,85 15,100" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Broom Head (Dynamic tilt) -->
    <g transform="translate(-15, 85) rotate(-20)">
      <rect x="-18" y="0" width="45" height="14" rx="4" fill="#cbd5e1" />
      <!-- Bristles -->
      <path d="M -18,14 L -22,30 L 31,30 L 27,14 Z" fill="#fb923c" />
      <!-- Bristle texture lines -->
      <line x1="-10" y1="14" x2="-12" y2="30" stroke="#ea580c" stroke-width="1.5" />
      <line x1="0" y1="14" x2="0" y2="30" stroke="#ea580c" stroke-width="1.5" />
      <line x1="10" y1="14" x2="12" y2="30" stroke="#ea580c" stroke-width="1.5" />
    </g>

    <!-- Dustpan filled with glowing dust/sweepings -->
    <g transform="translate(60, 110)">
      <ellipse cx="-5" cy="12" rx="16" ry="6" fill="#000000" opacity="0.4" />
      <path d="M -18,5 L -10,15 L 12,15 L 8,5 Z" fill="#10b981" />
      <path d="M -22,3 L 12,3 L 8,-2 L -18,-2 Z" fill="#34d399" />
      <path d="M -10,3 L -25,-15" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />
      <!-- Sparkles of cleanliness -->
      <circle cx="-5" cy="0" r="1.5" fill="#fef08a" />
      <circle cx="2" cy="2" r="2" fill="#fef08a" />
      <circle cx="-12" cy="2" r="1.5" fill="#fef08a" />
    </g>
  </g>

  <!-- MAIN SUBJECT 3: SPONGE & SOAP BUBBLES (Foreground Right Accent) -->
  <g transform="translate(180, 150)" filter="url(#shadow)">
    <!-- Scrub Sponge -->
    <g transform="rotate(15)">
      <rect x="0" y="0" width="30" height="20" rx="5" fill="#facc15" />
      <rect x="0" y="12" width="30" height="8" rx="3" fill="#f43f5e" />
      <!-- Sponge holes texture -->
      <circle cx="8" cy="6" r="2" fill="#ca8a04" opacity="0.4" />
      <circle cx="20" cy="7" r="1.5" fill="#ca8a04" opacity="0.4" />
      <circle cx="14" cy="4" r="1.5" fill="#ca8a04" opacity="0.4" />
    </g>
    <!-- Floating soap bubbles rising -->
    <circle cx="-10" cy="-10" r="7" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <circle cx="-10" cy="-10" r="2" fill="#ffffff" opacity="0.6" />
    <circle cx="-25" cy="-25" r="10" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" />
    <circle cx="-22" cy="-28" r="3" fill="#ffffff" opacity="0.7" />
    <circle cx="-5" cy="-35" r="5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Atmospheric Lighting Elements (Floating Dust / Sparkles) -->
  <g fill="#38bdf8">
    <circle cx="105" cy="75" r="2" opacity="0.8" />
    <circle cx="125" cy="55" r="1.5" opacity="0.6" />
    <circle cx="75" cy="115" r="1" opacity="0.7" />
    <circle cx="185" cy="105" r="2" opacity="0.5" />
    <circle cx="140" cy="140" r="1.5" opacity="0.9" />
  </g>
  <g fill="#f59e0b">
    <circle cx="90" cy="90" r="1.5" opacity="0.7" />
    <circle cx="165" cy="75" r="2" opacity="0.8" />
  </g>
</svg>