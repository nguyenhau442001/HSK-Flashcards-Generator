<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Waffle Cone Gradient -->
    <linearGradient id="cone-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Mint Scoop Gradient -->
    <linearGradient id="mint-grad" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="60%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Strawberry Scoop Gradient -->
    <linearGradient id="berry-grad" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="60%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Mango Scoop Gradient -->
    <linearGradient id="mango-grad" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Light Glow in background -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="150" cy="90" r="40" fill="#f472b6" opacity="0.1" filter="url(#glow)" />

  <!-- Background Environment: Cafe Wall & Shelf lines -->
  <path d="M 0 145 L 240 145" stroke="#475569" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 30 90 L 100 90" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3" />
  <!-- Small jar on shelf -->
  <rect x="50" y="70" width="16" height="20" rx="4" fill="#cbd5e1" opacity="0.2" />
  <path d="M 60 65 L 66 65 L 66 70 L 54 70 L 54 65 Z" fill="#f59e0b" opacity="0.4" />

  <!-- Wooden Table Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#table-grad)" />
  <!-- Table highlight rim -->
  <path d="M 0 170 L 240 170" stroke="#64748b" stroke-width="2" stroke-opacity="0.6" />

  <!-- Table accessories / Context props -->
  <!-- Napkin dispenser -->
  <g transform="translate(185, 135)" opacity="0.8">
    <rect x="0" y="10" width="28" height="25" rx="4" fill="#e2e8f0" />
    <path d="M 4 10 L 14 0 L 24 10 Z" fill="#cbd5e1" />
    <rect x="11" y="18" width="6" height="10" rx="1" fill="#94a3b8" />
  </g>

  <!-- Mint leaf garnish drop shadow and base -->
  <g filter="url(#shadow)">
    <!-- Table shadow under ice cream -->
    <ellipse cx="120" cy="178" rx="45" ry="12" fill="#0f172a" opacity="0.6" />
  </g>

  <!-- MAIN SUBJECT: ICE CREAM CONE -->
  <g transform="translate(0, 15)" filter="url(#shadow)">
    
    <!-- Waffle Cone -->
    <g>
      <!-- Cone body -->
      <polygon points="95,120 145,120 120,185" fill="url(#cone-grad)" />
      <!-- Cone waffle grid lines (Diagonal pattern) -->
      <path d="M 100 125 L 135 155 M 105 120 L 140 150 M 112 120 L 144 142 M 98 135 L 125 165 M 96 148 L 118 175 M 110 125 L 98 140 M 120 125 L 104 148 M 130 125 L 110 155 M 138 125 L 118 160 M 142 135 L 124 168" stroke="#92400e" stroke-width="1.5" stroke-opacity="0.4" fill="none" stroke-linecap="round" />
      <!-- Cone rim (3D lip) -->
      <path d="M 91,118 Q 120,126 149,118 Q 120,122 91,118 Z" fill="#d97706" />
      <ellipse cx="120" cy="119" rx="29" ry="6" fill="#f59e0b" />
    </g>

    <!-- Bottom Scoop (Mango - Yellow/Orange) -->
    <g>
      <path d="M 93 118 Q 80 95 105 80 Q 120 70 135 80 Q 160 95 147 118 Q 120 126 93 118 Z" fill="url(#mango-grad)" />
      <!-- Scoop highlights & texture -->
      <circle cx="108" cy="95" r="4" fill="#fef08a" opacity="0.6" />
      <path d="M 125 90 Q 135 100 130 112" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3" />
    </g>

    <!-- Middle Scoop (Strawberry - Pink/Magenta) -->
    <g>
      <path d="M 98 88 Q 85 65 110 52 Q 120 45 130 52 Q 155 65 142 88 Q 120 95 98 88 Z" fill="url(#berry-grad)" />
      <!-- Drips/Melting details -->
      <path d="M 142 75 Q 150 82 147 90 Q 143 93 140 85" fill="#ec4899" />
      <!-- Scoop highlights -->
      <circle cx="110" cy="65" r="4.5" fill="#fbcfe8" opacity="0.7" />
      <circle cx="132" cy="72" r="2.5" fill="#fbcfe8" opacity="0.5" />
    </g>

    <!-- Top Scoop (Mint - Teal/Green) -->
    <g>
      <path d="M 104 58 Q 95 38 120 30 Q 145 38 136 58 Q 120 64 104 58 Z" fill="url(#mint-grad)" />
      <!-- Scoop highlights -->
      <circle cx="112" cy="42" r="3.5" fill="#ccfbf1" opacity="0.7" />
      <!-- Drips -->
      <path d="M 102 55 Q 98 62 103 66 Q 106 64 104 58" fill="#14b8a6" />
    </g>

    <!-- Delicious Toppings & Details -->
    <!-- Chocolate Syrup Drizzle -->
    <path d="M 115 32 Q 122 38 118 45 Q 112 52 125 58 Q 135 62 130 75 Q 125 85 135 95" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 100 55 Q 95 65 105 78" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Cherry on Top -->
    <g transform="translate(120, 22)">
      <!-- Cherry Stem -->
      <path d="M 0 0 Q 12 -18 22 -12" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <!-- Cherry Body -->
      <circle cx="0" cy="8" r="9" fill="#dc2626" />
      <!-- Cherry Dark Shade -->
      <circle cx="2" cy="11" r="7" fill="#991b1b" opacity="0.5" />
      <!-- Cherry Highlight -->
      <circle cx="-2" cy="5" r="2.5" fill="#fca5a5" />
    </g>

    <!-- Mint Leaf Garnish beside cherry -->
    <g transform="translate(108, 25) rotate(-30)">
      <path d="M 0 0 Q 8 -6 12 -15 Q 4 -12 0 0 Z" fill="#22c55e" />
      <path d="M 6 -4 L 6 -10" stroke="#15803d" stroke-width="1" />
    </g>

    <!-- Sprinkles scattered on scoops -->
    <rect x="98" y="48" width="5" height="2" rx="1" fill="#facc15" transform="rotate(25 100 49)" />
    <rect x="130" y="44" width="5" height="2" rx="1" fill="#38bdf8" transform="rotate(-15 132 45)" />
    <rect x="110" y="78" width="5" height="2" rx="1" fill="#ffffff" transform="rotate(40 112 79)" />
    <rect x="138" y="70" width="5" height="2" rx="1" fill="#a855f7" transform="rotate(-40 140 71)" />
    <rect x="100" y="105" width="5" height="2" rx="1" fill="#facc15" transform="rotate(10 102 106)" />

    <!-- Magic/App Sparkles and Energy (HSK Context Styling) -->
    <g transform="translate(65, 80)" opacity="0.9">
      <path d="M 0 8 Q 8 8 8 0 Q 8 8 16 8 Q 8 8 8 16 Q 8 8 0 8 Z" fill="#fbbf24" />
    </g>
    <g transform="translate(155, 50) scale(0.6)" opacity="0.9">
      <path d="M 0 8 Q 8 8 8 0 Q 8 8 16 8 Q 8 8 8 16 Q 8 8 0 8 Z" fill="#38bdf8" />
    </g>
    <g transform="translate(145, 130) scale(0.8)" opacity="0.8">
      <path d="M 0 8 Q 8 8 8 0 Q 8 8 16 8 Q 8 8 8 16 Q 8 8 0 8 Z" fill="#f472b6" />
    </g>
  </g>

</svg>