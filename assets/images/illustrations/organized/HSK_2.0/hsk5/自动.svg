<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  
  <!-- Door Frame -->
  <path d="M60 40 L180 40 L180 200 L60 200 Z" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
  
  <!-- Automatic Sliding Doors -->
  <rect x="65" y="45" width="55" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="120" y="55" width="55" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Motion Sensor -->
  <rect x="105" y="30" width="30" height="10" rx="2" fill="#fb923c"/>
  <circle cx="120" cy="35" r="4" fill="#f59e0b">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Decorative Interior Elements -->
  <rect x="20" y="100" width="10" height="80" fill="#64748b" rx="2"/>
  <rect x="210" y="100" width="10" height="80" fill="#64748b" rx="2"/>
  
  <!-- Floor reflection/detail -->
  <ellipse cx="120" cy="210" rx="80" ry="10" fill="#0f172a" opacity="0.4"/>
  
  <!-- Action lines/glow -->
  <path d="M120 50 L120 190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
</svg>