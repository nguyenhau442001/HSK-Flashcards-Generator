<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Chalkboard -->
  <rect x="30" y="40" width="180" height="120" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- Emphasized Point (Circles) -->
  <circle cx="120" cy="100" r="25" fill="none" stroke="#fbbf24" stroke-width="6" stroke-dasharray="8 4"/>
  <circle cx="120" cy="100" r="10" fill="#fbbf24"/>
  
  <!-- Chalk lines/marks -->
  <path d="M60 70 L100 70 M60 90 L90 90 M60 110 L90 110 M60 130 L100 130" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 70 L180 70 M150 90 L180 90 M150 110 L180 110 M140 130 L180 130" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Teacher's Pointer -->
  <rect x="180" y="160" width="8" height="80" rx="2" fill="#94a3b8" transform="rotate(-20 180 160)"/>
  <path d="M155 130 L135 110" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Desk/Surface -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <rect x="0" y="180" width="240" height="10" fill="#334155"/>
  
  <!-- Props on desk -->
  <rect x="20" y="190" width="40" height="30" rx="4" fill="#ec4899"/>
  <circle cx="90" cy="205" r="15" fill="#38bdf8"/>
  <rect x="130" y="195" width="20" height="25" rx="2" fill="#10b981"/>
</svg>