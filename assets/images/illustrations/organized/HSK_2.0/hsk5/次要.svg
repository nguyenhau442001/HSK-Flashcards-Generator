<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Main Object Gradients (Primary focus: Giant Golden Trophy) -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="gold-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Secondary Object Gradients (Secondary focus: Small Silver Star / Participant Badge) -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="silver-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="primary-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="secondary-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Lighting / Vignette -->
  <circle cx="120" cy="110" r="100" fill="url(#primary-glow)" />
  <circle cx="195" cy="165" r="50" fill="url(#secondary-glow)" />

  <!-- Background Environment & Props (Desk/Podium context) -->
  <!-- Wooden/Modern Desk Surface -->
  <path d="M20,185 L220,185 L230,220 L10,220 Z" fill="#090d16" opacity="0.8" />
  <path d="M15,180 L225,180 L220,185 L20,185 Z" fill="#334155" />
  <!-- Spotlight Cone Effect -->
  <polygon points="120,0 30,180 210,180" fill="#ffffff" opacity="0.03" />

  <!-- ========================================== -->
  <!-- SECONDARY OBJECT (次要 - Small, Off-center)  -->
  <!-- ========================================== -->
  <g transform="translate(185, 145) scale(0.65)" filter="url(#soft-shadow)">
    <!-- Shadow base -->
    <ellipse cx="0" cy="32" rx="18" ry="6" fill="#000000" opacity="0.5" />
    
    <!-- Ribbon / Badge Base -->
    <path d="M-12,15 L-22,35 L0,27 L22,35 L12,15 Z" fill="#0f172a" />
    <path d="M-10,15 L-18,30 L0,23 L18,30 L10,15 Z" fill="#475569" />

    <!-- Silver Medal Disc (The "Secondary" Item) -->
    <circle cx="0" cy="5" r="18" fill="url(#silver-shadow)" />
    <circle cx="0" cy="3" r="18" fill="url(#silver-grad)" />
    
    <!-- Inner Ring -->
    <circle cx="0" cy="3" r="13" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2" />

    <!-- Star Emblem on Secondary Medal -->
    <polygon points="0,-4 3,3 10,3 4,7 6,14 0,10 -6,14 -4,7 -10,3 -3,3" fill="#cbd5e1" />

    <!-- Subtle 'Secondary' downward arrow/badge accent -->
    <circle cx="0" cy="3" r="4" fill="#334155" />
  </g>

  <!-- ========================================== -->
  <!-- PRIMARY OBJECT (主要 - Giant Golden Trophy)  -->
  <!-- ========================================== -->
  <g transform="translate(100, 110)" filter="url(#drop-shadow)">
    <!-- Floor shadow -->
    <ellipse cx="-5" cy="80" rx="35" ry="10" fill="#000000" opacity="0.6" />

    <!-- Wooden / Marble Base -->
    <path d="M-30,70 L30,70 L25,82 L-25,82 Z" fill="#334155" />
    <path d="M-25,82 L25,82 L20,90 L-20,90 Z" fill="#1e293b" />
    <rect x="-12" y="55" width="24" height="15" fill="url(#gold-shadow)" rx="2" />

    <!-- Trophy Stem -->
    <rect x="-8" y="35" width="16" height="25" fill="url(#gold-shadow)" rx="2" />
    <path d="M-12,55 L12,55 L8,35 L-8,35 Z" fill="url(#gold-shadow)" />

    <!-- Left Handle -->
    <path d="M-18,-15 C-35,-15 -35,25 -12,30" fill="none" stroke="url(#gold-shadow)" stroke-width="7" stroke-linecap="round" />
    <path d="M-18,-15 C-30,-15 -30,20 -12,25" fill="none" stroke="url(#gold-bright)" stroke-width="4" stroke-linecap="round" />

    <!-- Right Handle -->
    <path d="M18,-15 C35,-15 35,25 12,30" fill="none" stroke="url(#gold-shadow)" stroke-width="7" stroke-linecap="round" />
    <path d="M18,-15 C30,-15 30,20 12,25" fill="none" stroke="url(#gold-bright)" stroke-width="4" stroke-linecap="round" />

    <!-- Main Cup Body (Back/Shadow) -->
    <path d="M-22,-30 C-22,25 22,25 22,-30 Z" fill="url(#gold-shadow)" />

    <!-- Main Cup Body (Front/Bright) -->
    <path d="M-22,-30 C-22,20 22,20 22,-30 Z" fill="url(#gold-bright)" />
    <!-- Rim of the cup -->
    <ellipse cx="0" cy="-30" rx="22" ry="7" fill="url(#gold-shadow)" />
    <ellipse cx="0" cy="-32" rx="22" ry="7" fill="url(#gold-bright)" />

    <!-- Inside of Cup -->
    <ellipse cx="0" cy="-32" rx="18" ry="5" fill="#b45309" />

    <!-- Star Engraving on Trophy -->
    <polygon points="0,-12 3,-4 11,-4 5,1 7,9 0,5 -7,9 -5,1 -11,-4 -3,-4" fill="#fef08a" filter="url(#soft-shadow)" />

    <!-- Trophy Specular Highlight Lines -->
    <path d="M-14,-22 C-16,0 -5,15 -3,22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Sparkles / Action Accents (Emphasizing the Primary object's prominence vs secondary) -->
  <g transform="translate(75, 45)">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#fef08a" />
  </g>
  <g transform="translate(135, 65) scale(0.6)">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#fef08a" />
  </g>
  <g transform="translate(170, 115) scale(0.4)">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#94a3b8" opacity="0.7" />
  </g>

</svg>