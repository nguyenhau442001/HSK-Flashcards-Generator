<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 80)">
    <!-- Table Surface -->
    <rect x="-20" y="80" width="200" height="10" fill="#334155" rx="2"/>
    
    <!-- Evidence Bag -->
    <rect x="10" y="-10" width="140" height="100" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- The Gun (Subject) -->
    <g transform="rotate(-15, 80, 40)">
      <path d="M20 40 L120 40 L120 55 L20 55 Z" fill="#94a3b8"/>
      <path d="M110 35 L130 35 L130 60 L110 60 Z" fill="#64748b"/>
      <path d="M30 55 L50 90 L80 90 L70 55 Z" fill="#475569"/>
      <circle cx="125" cy="47" r="5" fill="#0f172a"/>
      <path d="M25 42 L25 53" stroke="#fb923c" stroke-width="3"/>
    </g>
    
    <!-- Decorative Evidence Marker -->
    <circle cx="150" cy="10" r="12" fill="#f59e0b"/>
    <path d="M147 14 L153 6 M147 6 L153 14" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric highlights -->
  <circle cx="180" cy="50" r="40" fill="#fb923c" fill-opacity="0.05"/>
  <circle cx="60" cy="180" r="60" fill="#38bdf8" fill-opacity="0.03"/>
</svg>