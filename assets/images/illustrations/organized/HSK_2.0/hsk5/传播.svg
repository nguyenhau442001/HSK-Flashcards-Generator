<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Central Subject: A stylized radio tower/broadcasting node -->
  <g transform="translate(120, 120)">
    <!-- Radiating Waves -->
    <path d="M0 -30 A 40 40 0 0 1 30 0" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M0 -50 A 60 60 0 0 1 50 0" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M0 -70 A 80 80 0 0 1 70 0" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Tower Base -->
    <rect x="-10" y="0" width="20" height="60" rx="4" fill="#38bdf8"/>
    <polygon points="-20,0 20,0 10,-30 -10,-30" fill="#10b981"/>
    
    <!-- Decorative sparks/data particles -->
    <circle cx="40" cy="-40" r="3" fill="#ec4899"/>
    <circle cx="60" cy="-20" r="2" fill="#38bdf8"/>
    <circle cx="-50" cy="-30" r="4" fill="#fbbf24"/>
    <circle cx="-30" cy="10" r="2" fill="#10b981"/>
  </g>

  <!-- Ground Plane/Environment -->
  <path d="M0 200 C 60 180, 180 180, 240 200 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.5"/>
  <rect x="0" y="200" width="240" height="40" fill="#1e293b"/>
  
  <!-- Stylized city silhouette in distance -->
  <rect x="20" y="170" width="30" height="30" fill="#334155" rx="2"/>
  <rect x="60" y="160" width="40" height="40" fill="#334155" rx="2"/>
  <rect x="140" y="165" width="35" height="35" fill="#334155" rx="2"/>
  <rect x="190" y="175" width="25" height="25" fill="#334155" rx="2"/>
</svg>