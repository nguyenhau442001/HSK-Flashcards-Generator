<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Effect Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Bulb Glass Gradient -->
    <linearGradient id="bulbGlass" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Table/Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow representing 'generation/emergence' -->
  <circle cx="120" cy="100" r="70" fill="url(#glowGrad)" />

  <!-- Background Environment: Wooden/Modern Desk Surface -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2" />

  <!-- Secondary Prop: Small Potted Plant (Adding living, organic context) -->
  <g transform="translate(45, 140)" filter="url(#dropShadow)">
    <!-- Pot -->
    <path d="M 10 0 L 25 25 L -5 25 L 10 0 Z" fill="#cbd5e1" />
    <ellipse cx="10" cy="0" rx="8" ry="3" fill="#e2e8f0" />
    <!-- Sprouts / Generation of life -->
    <path d="M 10 0 C 10 -15, 0 -20, -5 -25" fill="none" stroke="url(#leafGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 10 0 C 10 -15, 20 -25, 25 -30" fill="none" stroke="url(#leafGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 10 0 C 10 -10, 10 -18, 10 -22" fill="none" stroke="url(#leafGrad)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Secondary Prop: Notebook/Blueprint (Context of ideas being produced) -->
  <g transform="translate(160, 150) rotate(10)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="40" height="30" rx="2" fill="#f8fafc" />
    <line x1="5" y1="8" x2="35" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="5" y1="15" x2="25" y2="15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="5" y1="22" x2="30" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Pencil -->
    <rect x="-12" y="18" width="15" height="4" rx="1" fill="#f59e0b" transform="rotate(-30 -12 18)" />
    <polygon points="-15,19 -12,17 -12,23" fill="#cbd5e1" transform="rotate(-30 -12 18)" />
  </g>

  <!-- MAIN SUBJECT: The Lightbulb moment / Idea Generation ("Chǎnshēng" - to produce/emerge) -->
  <g filter="url(#dropShadow)" transform="translate(0, -5)">
    
    <!-- Radiating Energy Beams / Sparks of Generation -->
    <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
      <line x1="120" y1="35" x2="120" y2="20" />
      <line x1="165" y1="55" x2="177" y2="45" />
      <line x1="185" y1="100" x2="200" y2="100" />
      <line x1="75" y1="55" x2="63" y2="45" />
      <line x1="55" y1="100" x2="40" y2="100" />
    </g>

    <!-- Floating Sparkles / Newly Born Elements -->
    <path d="M 170 70 L 173 78 L 181 81 L 173 84 L 170 92 L 167 84 L 159 81 L 167 78 Z" fill="url(#sparkleGrad)" />
    <path d="M 70 75 L 72 80 L 77 82 L 72 84 L 70 89 L 68 84 L 63 82 L 68 80 Z" fill="url(#sparkleGrad)" transform="scale(0.8) translate(20, -10)" />
    <circle cx="145" cy="50" r="3" fill="#fbbf24" />
    <circle cx="95" cy="50" r="2" fill="#fbbf24" />

    <!-- Lightbulb Base (Screw threads) -->
    <path d="M 106 135 L 134 135 L 130 152 L 110 152 Z" fill="#64748b" />
    <path d="M 108 140 L 132 140" stroke="#475569" stroke-width="2" />
    <path d="M 110 146 L 130 146" stroke="#475569" stroke-width="2" />
    <!-- Contact Tip -->
    <path d="M 114 152 L 126 152 L 123 160 L 117 160 Z" fill="#94a3b8" />

    <!-- Bulb Glass Body -->
    <path d="M 106 135 
             C 90 135, 80 120, 80 100 
             C 80 75, 95 60, 120 60 
             C 145 60, 160 75, 160 100 
             C 160 120, 150 135, 134 135 Z" 
          fill="url(#bulbGlass)" stroke="#38bdf8" stroke-width="3" />

    <!-- Inner Core / Glowing Filament (Representing the exact moment of birth/spark) -->
    <path d="M 113 130 L 116 110 L 120 100 L 124 110 L 127 130" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bright Core Center Glow -->
    <circle cx="120" cy="98" r="18" fill="#fbbf24" opacity="0.9" />
    <circle cx="120" cy="98" r="8" fill="#fef08a" />

    <!-- Glass Highlight Reflection -->
    <path d="M 92 88 C 96 75, 105 68, 115 65" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Dynamic floating upward particles to reinforce action/emergence -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="100" cy="35" r="3" />
    <circle cx="135" cy="25" r="2" />
    <circle cx="125" cy="15" r="1.5" />
  </g>
</svg>