<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Pot Gradient -->
    <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Water Stream & Drops Gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="1"/>
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Soil Gradient -->
    <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Ambient Glow (Warm Sunlight / Window Light) -->
  <circle cx="180" cy="60" r="70" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>
  <circle cx="70" cy="190" r="50" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Wooden Windowsill / Surface -->
  <path d="M 10 200 L 230 200 L 240 220 L 0 220 Z" fill="#0f172a" opacity="0.5"/>
  <rect x="15" y="202" width="210" height="4" rx="2" fill="#334155" opacity="0.8"/>

  <!-- Flower Pot Background Shadow -->
  <ellipse cx="145" cy="188" rx="35" ry="8" fill="#000000" opacity="0.4"/>

  <!-- Potted Plant (The Target Subject's Environment) -->
  <g id="potted-plant">
    <!-- Soil Base inside Pot -->
    <ellipse cx="145" cy="112" rx="32" ry="10" fill="url(#soilGrad)"/>

    <!-- Plant Stem -->
    <path d="M 145 112 Q 135 90 140 70" stroke="#059669" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Lush Green Leaves -->
    <!-- Back Leaf -->
    <path d="M 140 85 Q 165 75 175 95 Q 165 115 140 85" fill="url(#leafGrad1)"/>
    <!-- Left Leaf -->
    <path d="M 140 95 Q 110 90 100 110 Q 115 130 140 95" fill="url(#leafGrad2)"/>
    <!-- Right Leaf -->
    <path d="M 143 80 Q 170 50 190 70 Q 185 95 143 80" fill="url(#leafGrad2)"/>
    <!-- Center/Front Leaf (drooping slightly happily) -->
    <path d="M 138 75 Q 120 45 100 65 Q 110 90 138 75" fill="url(#leafGrad1)"/>
    <path d="M 140 70 Q 135 50 145 40 Q 155 55 140 70" fill="url(#leafGrad2)"/>

    <!-- Flower Pot Body -->
    <path d="M 115 110 L 125 185 C 125 188 128 190 132 190 L 158 190 C 162 190 165 188 165 185 L 175 110 Z" fill="url(#potGrad)"/>
    <!-- Pot Rim -->
    <rect x="111" y="104" width="68" height="8" rx="4" fill="#fb923c"/>
    <!-- Pot Highlight -->
    <path d="M 124 116 L 129 180" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" opacity="0.4" fill="none"/>
  </g>

  <!-- Action: Pouring Water (浇 - jiāo) -->
  <g id="watering-action">
    <!-- Water Stream Curve -->
    <path d="M 65 75 Q 100 85 132 110" stroke="url(#waterGrad)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    <!-- Inner bright stream core -->
    <path d="M 67 75 Q 100 85 130 107" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Splash Droplets hitting the soil -->
    <circle cx="136" cy="112" r="3" fill="#38bdf8"/>
    <circle cx="142" cy="114" r="2" fill="#7dd3fc"/>
    <circle cx="128" cy="113" r="2.5" fill="#38bdf8"/>
    <!-- Flying Water Droplets -->
    <path d="M 90 85 Q 93 83 95 86" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 110 95 Q 113 93 115 96" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="78" cy="78" r="2" fill="#bae6fd"/>
    <circle cx="118" cy="102" r="1.5" fill="#bae6fd"/>

    <!-- Cute Modern Watering Can -->
    <!-- Can Shadow -->
    <ellipse cx="55" cy="138" rx="20" ry="6" fill="#000000" opacity="0.3"/>

    <!-- Can Body (Tilted for action) -->
    <g transform="rotate(-25 55 125)">
      <!-- Back Handle -->
      <path d="M 35 115 C 20 115 20 140 35 140" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>
      
      <!-- Main Container -->
      <path d="M 38 105 L 72 105 C 78 105 82 110 80 116 L 70 144 C 68 148 64 150 60 150 L 46 150 C 42 150 38 148 36 144 L 28 116 C 26 110 30 105 38 105 Z" fill="#0284c7"/>
      
      <!-- Container Highlight -->
      <path d="M 35 110 L 41 142" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none"/>

      <!-- Can Spout -->
      <path d="M 68 112 L 95 78 C 98 75 97 70 93 70 L 80 78 Z" fill="#0284c7"/>
      <path d="M 85 75 L 94 72" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

      <!-- Lid/Top Rim -->
      <ellipse cx="55" cy="105" rx="17" ry="4" fill="#38bdf8"/>
      <circle cx="55" cy="102" r="3" fill="#e0f2fe"/>
    </g>
  </g>

  <!-- Sparkles & Atmosphere (Representing life, freshness, successful 'jiāo' action) -->
  <g id="sparkles" fill="#fbbf24">
    <!-- Sparkle 1 near leaves -->
    <path d="M 170 50 L 173 58 L 181 61 L 173 64 L 170 72 L 167 64 L 159 61 L 167 58 Z" opacity="0.9" transform="scale(0.8) translate(50, 10)"/>
    <!-- Sparkle 2 near watering can -->
    <path d="M 50 55 L 52 60 L 57 62 L 52 64 L 50 69 L 48 64 L 43 62 L 48 60 Z" opacity="0.8"/>
    <!-- Small glowing dots -->
    <circle cx="160" cy="45" r="2" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="115" cy="40" r="1.5" fill="#fef08a"/>
    <circle cx="195" cy="95" r="2" fill="#fef08a" filter="url(#glow)"/>
  </g>
</svg>