<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor/Stage -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <ellipse cx="120" cy="180" rx="80" ry="15" fill="#0f172a" opacity="0.4"/>
  
  <!-- Character: Yoga/Ballet Pose -->
  <g transform="translate(120, 140)">
    <!-- Shadow -->
    <ellipse cx="0" cy="40" rx="30" ry="8" fill="#000" opacity="0.2"/>
    
    <!-- Body -->
    <circle cx="0" cy="-60" r="25" fill="#fbbf24"/> <!-- Head -->
    <path d="M-15 -35 Q0 -45 15 -35 L10 20 L-10 20 Z" fill="#38bdf8"/> <!-- Torso -->
    
    <!-- Arms in elegant pose -->
    <path d="M-10 -20 L-40 -10 M10 -20 L40 -10" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Legs in pose -->
    <path d="M-5 20 L-20 60 M5 20 L15 50 L30 30" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Atmospheric Props -->
  <circle cx="50" cy="60" r="5" fill="#ec4899" opacity="0.6"/>
  <circle cx="190" cy="80" r="8" fill="#10b981" opacity="0.6"/>
  <path d="M200 40 L210 30 M210 40 L200 30" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative light streaks -->
  <path d="M30 150 Q60 120 90 150" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M150 130 Q180 100 210 130" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.3"/>
</svg>