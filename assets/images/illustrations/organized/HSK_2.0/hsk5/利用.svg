<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Gradient for Solar Panel / Energy -->
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- SCENE CONTEXT: Workshop / Inventors Room (Representing "Utilizing/Making the most of resources") -->
  <!-- Ambient Workshop Background Elements -->
  <!-- Bookshelf / Shelf with items -->
  <rect x="25" y="45" width="50" height="8" rx="2" fill="#334155"/>
  <rect x="35" y="25" width="10" height="20" rx="2" fill="#475569"/>
  <rect x="47" y="28" width="8" height="17" rx="2" fill="#0ea5e9"/>
  <rect x="58" y="22" width="12" height="23" rx="2" fill="#f43f5e"/>

  <!-- Large Window showing sunset/sunlight to "utilize" -->
  <path d="M165,25 L215,25 L215,85 L165,85 Z" fill="url(#windowLight)" stroke="#334155" stroke-width="3"/>
  <line x1="190" y1="25" x2="190" y2="85" stroke="#334155" stroke-width="2"/>
  <line x1="165" y1="55" x2="215" y2="55" stroke="#334155" stroke-width="2"/>

  <!-- Sun Rays coming through window -->
  <polygon points="190,55 220,180 140,180" fill="#f59e0b" opacity="0.1"/>
  <polygon points="190,55 130,180 90,180" fill="#fbbf24" opacity="0.08"/>

  <!-- Workbench Surface -->
  <rect x="15" y="170" width="210" height="40" rx="4" fill="#334155" filter="url(#shadow)"/>
  <rect x="15" y="170" width="210" height="8" rx="2" fill="#475569"/>
  <!-- Workbench Legs -->
  <rect x="25" y="210" width="12" height="15" fill="#1e293b"/>
  <rect x="203" y="210" width="12" height="15" fill="#1e293b"/>

  <!-- MAIN SUBJECT: Ingenious Device / Resourceful Eco-Machine (Utilizing sun & mechanical parts) -->
  <!-- Base Stand -->
  <path d="M90,170 L150,170 L140,145 L100,145 Z" fill="#64748b"/>
  <ellipse cx="120" cy="145" rx="22" ry="6" fill="#94a3b8"/>

  <!-- Central Energy Core -->
  <circle cx="120" cy="115" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="120" cy="115" r="20" fill="url(#sunGlow)"/>

  <!-- Rotating Solar/Wind Blades (Representing active utilization) -->
  <g transform="translate(120, 115)">
    <!-- Blade 1 -->
    <path d="M0,0 C-15,-30 -25,-40 -10,-55 C5,-70 20,-45 0,0" fill="#fb923c" opacity="0.9" filter="url(#shadow)"/>
    <!-- Blade 2 -->
    <path d="M0,0 C30,-15 40,-25 55,-10 C70,5 45,20 0,0" fill="#fb923c" opacity="0.9" filter="url(#shadow)"/>
    <!-- Blade 3 -->
    <path d="M0,0 C15,30 25,40 10,55 C-5,70 -20,45 0,0" fill="#fb923c" opacity="0.9" filter="url(#shadow)"/>
    <!-- Blade 4 -->
    <path d="M0,0 C-30,15 -40,25 -55,10 C-70,-5 -45,-20 0,0" fill="#fb923c" opacity="0.9" filter="url(#shadow)"/>
    <!-- Center Bolt -->
    <circle cx="0" cy="0" r="7" fill="#f8fafc"/>
  </g>

  <!-- Supporting Props on Workbench: Tools & Recycled Materials (Emphasizing 'utilizing' what's available) -->
  <!-- Recycled Glass Beaker with glowing green liquid -->
  <path d="M55,145 L75,145 L70,170 L60,170 Z" fill="#94a3b8" opacity="0.3"/>
  <path d="M57,153 L73,153 L70,168 L60,168 Z" fill="#10b981"/>
  <ellipse cx="65" cy="153" rx="8" ry="2" fill="#34d399"/>
  <!-- Beaker neck -->
  <rect x="62" y="140" width="6" height="5" fill="#94a3b8" opacity="0.6"/>

  <!-- Wrench / Tool -->
  <path d="M170,155 L195,135 C198,132 202,135 199,138 L179,163 Z" fill="#94a3b8" filter="url(#shadow)"/>
  <circle cx="172" cy="157" r="6" fill="#64748b"/>
  <circle cx="172" cy="157" r="3" fill="#334155"/>

  <!-- Floating Energy / Sparkle Elements (Visual flair of active utilization) -->
  <path d="M85,85 Q90,75 100,80 Q90,85 85,95 Q80,85 70,80 Q80,75 85,85 Z" fill="#38bdf8"/>
  <path d="M155,75 Q160,65 170,70 Q160,75 155,85 Q150,75 140,70 Q150,65 155,75 Z" fill="#fbbf24"/>
  <circle cx="135" cy="50" r="3" fill="#10b981"/>
  <circle cx="105" cy="140" r="2" fill="#38bdf8"/>

  <!-- Foreground Atmospheric Vignette (Soft framing) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>
</svg>