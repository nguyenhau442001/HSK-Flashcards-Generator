<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background elements -->
  <circle cx="180" cy="60" r="40" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M40 180 L80 140 L120 180 Z" fill="#334155" opacity="0.5"/>
  
  <!-- Main Subject: A character dancing/moving frantically -->
  <g transform="translate(120, 120)">
    <!-- Motion lines -->
    <path d="M-60 -20 Q-80 -40 -60 -60" stroke="#fb923c" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M60 20 Q80 40 60 60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="35" ry="45" fill="#f59e0b"/>
    
    <!-- Arms flailing -->
    <path d="M-20 -20 L-60 -50" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    <path d="M20 -20 L60 10" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Legs in motion -->
    <path d="M-15 40 L-30 90" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    <path d="M15 40 L40 70" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="0" cy="-60" r="30" fill="#fbbf24"/>
    
    <!-- Expression: Frantic/Excited -->
    <ellipse cx="-10" cy="-65" rx="4" ry="6" fill="#0f172a"/>
    <ellipse cx="10" cy="-65" rx="4" ry="6" fill="#0f172a"/>
    <path d="M-12 -50 Q0 -40 12 -50" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Sweat drops/Action sparks -->
    <circle cx="-40" cy="-80" r="5" fill="#ec4899"/>
    <circle cx="40" cy="-40" r="5" fill="#10b981"/>
  </g>
  
  <!-- Floor shadow -->
  <ellipse cx="120" cy="210" rx="80" ry="10" fill="#0f172a" opacity="0.3"/>
</svg>