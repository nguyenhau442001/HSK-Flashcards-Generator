<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <defs>
    <!-- Background Atmosphere Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Amber Glow for Action Focus -->
    <radialGradient id="actionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Skin Gradient -->
    <linearGradient id="skin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>

    <!-- Character 2 Skin Gradient -->
    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffddd2"/>
      <stop offset="100%" stop-color="#e8c5bc"/>
    </linearGradient>
  </defs>

  <!-- Fill Background -->
  <rect width="240" height="240" fill="url(#bgGlow)"/>

  <!-- Environment / Scene Details (Postal / Delivery Counter context) -->
  <!-- Counter Background Wall -->
  <rect x="20" y="30" width="200" height="110" rx="12" fill="#1e293b"/>
  <!-- Decorative Window/Panel -->
  <rect x="40" y="45" width="160" height="70" rx="8" fill="#0f172a" opacity="0.7"/>
  <!-- Interior Shelf with Props -->
  <rect x="50" y="95" width="60" height="4" rx="2" fill="#334155"/>
  <rect x="60" y="70" width="16" height="25" rx="3" fill="#10b981"/>
  <rect x="82" y="75" width="18" height="20" rx="3" fill="#38bdf8"/>
  <circle cx="140" cy="85" r="12" fill="#fbbf24" opacity="0.8"/>

  <!-- Counter Surface -->
  <path d="M10 170 L230 170 L210 210 L30 210 Z" fill="#334155"/>
  <path d="M10 170 L230 170 L230 176 L10 176 Z" fill="#475569"/>

  <!-- Central Action Glow (The act of passing/delivering) -->
  <circle cx="120" cy="135" r="50" fill="url(#actionGlow)"/>

  <!-- Character 1 (Left - Sender/Giver) -->
  <g id="character-sender">
    <!-- Body / Torso -->
    <path d="M45 190 Q45 150 75 145 L85 180 Z" fill="#38bdf8"/>
    <!-- Arm reaching out to pass the letter -->
    <path d="M70 148 Q100 135 120 135 L120 148 Q100 148 78 160 Z" fill="#38bdf8"/>
    <!-- Hand holding letter -->
    <circle cx="120" cy="141" r="6" fill="url(#skin1)"/>
    <!-- Head -->
    <circle cx="65" cy="120" r="18" fill="url(#skin1)"/>
    <!-- Hair -->
    <path d="M48 115 Q65 95 82 115 Q80 100 65 100 Q50 100 48 115 Z" fill="#1e293b"/>
  </g>

  <!-- The Object Being Passed: Letter / Parcel -->
  <g id="passing-letter">
    <!-- Envelope Base -->
    <polygon points="112,133 128,133 132,143 108,143" fill="#f8fafc"/>
    <!-- Envelope Flap -->
    <polygon points="112,133 120,140 128,133" fill="#cbd5e1"/>
    <!-- Motion / Action Lines -->
    <path d="M100 125 C105 120, 115 120, 120 122" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M125 122 C130 120, 140 120, 145 125" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character 2 (Right - Receiver) -->
  <g id="character-receiver">
    <!-- Body / Torso -->
    <path d="M195 190 Q195 150 165 145 L155 180 Z" fill="#ec4899"/>
    <!-- Arm reaching out to receive -->
    <path d="M170 148 Q140 135 123 138 L123 150 Q145 148 162 160 Z" fill="#ec4899"/>
    <!-- Hand receiving -->
    <circle cx="123" cy="144" r="6" fill="url(#skin2)"/>
    <!-- Head -->
    <circle cx="175" cy="120" r="18" fill="url(#skin2)"/>
    <!-- Hair -->
    <path d="M157 115 Q175 90 193 115 Q190 98 175 98 Q160 98 157 115 Z" fill="#475569"/>
  </g>

  <!-- Foreground Atmospheric Elements / Highlights -->
  <!-- Warm soft highlights on the counter edge -->
  <line x1="30" y1="171" x2="210" y2="171" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Subtle sparkles to emphasize the interaction moment -->
  <path d="M120 105 L122 112 L129 114 L122 116 L120 123 L118 116 L111 114 L118 112 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M90 125 L91 128 L94 129 L91 130 L90 133 L89 130 L86 129 L89 128 Z" fill="#f59e0b" opacity="0.7"/>
  <path d="M150 128 L151 131 L154 132 L151 133 L150 136 L149 133 L146 132 L149 131 Z" fill="#38bdf8" opacity="0.8"/>

</svg>