<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient & Atmosphere -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background glow behind the map -->
  <circle cx="120" cy="130" r="80" fill="url(#glow)"/>

  <!-- Desk / Table surface -->
  <path d="M 0 175 L 240 175 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 170 L 240 170 L 240 175 L 0 175 Z" fill="#334155"/>

  <!-- Supporting props on desk (Compass) -->
  <g transform="translate(190, 185)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="16" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="13" fill="#f8fafc"/>
    <polygon points="0,-10 3,0 0,8 -3,0" fill="#ef4444"/>
    <polygon points="0,10 3,0 0,-8 -3,0" fill="#94a3b8"/>
    <circle cx="0" cy="0" r="2" fill="#0f172a"/>
  </g>

  <!-- Supporting props (Magnifying Glass) -->
  <g transform="translate(45, 175) rotate(-25)" filter="url(#shadow)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="35" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-15" r="18" fill="none" stroke="#cbd5e1" stroke-width="5"/>
    <circle cx="0" cy="-15" r="16" fill="#38bdf8" fill-opacity="0.2"/>
    <path d="M -8 -22 Q -2 -18 -10 -8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- MAIN SCENE SUBJECT: The Unrolled Map (展开 - 'Triển khai, mở rộng') -->
  <g filter="url(#shadow)">
    <!-- Map Left Scroll Cylinder -->
    <rect x="35" y="85" width="14" height="90" rx="7" fill="url(#woodGrad)"/>
    <ellipse cx="42" cy="85" rx="7" ry="3" fill="#d97706"/>
    <ellipse cx="42" cy="175" rx="7" ry="3" fill="#92400e"/>

    <!-- Map Right Scroll Cylinder -->
    <rect x="191" y="85" width="14" height="90" rx="7" fill="url(#woodGrad)"/>
    <ellipse cx="198" cy="85" rx="7" ry="3" fill="#d97706"/>
    <ellipse cx="198" cy="175" rx="7" ry="3" fill="#92400e"/>

    <!-- Map Paper Body (Wide open/expanded state) -->
    <path d="M 42 88 L 198 88 C 200 120, 202 140, 198 172 L 42 172 C 38 140, 40 120, 42 88 Z" fill="url(#mapGrad)"/>

    <!-- Map folds / crease lines to show dimensional unrolling -->
    <line x1="75" y1="89" x2="73" y2="171" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="110" y1="89" x2="108" y2="171" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="145" y1="89" x2="147" y2="171" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="175" y1="89" x2="177" y2="171" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>

    <!-- Map Graphics / Topography (Abstract landscape features) -->
    <!-- Mountain ranges -->
    <path d="M 60 120 L 70 105 L 85 125 L 95 112 L 105 125 Z" fill="#cbd5e1" opacity="0.8"/>
    <path d="M 155 135 L 168 118 L 182 140 Z" fill="#cbd5e1" opacity="0.8"/>
    
    <!-- River path winding across -->
    <path d="M 42 150 Q 80 130, 120 155 T 198 125" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Map icons/markers (Trees & Destination Star) -->
    <circle cx="85" cy="140" r="3" fill="#10b981"/>
    <circle cx="135" cy="115" r="3" fill="#10b981"/>
    
    <!-- Red target star/pin -->
    <g transform="translate(135, 135)">
      <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#ef4444"/>
      <circle cx="0" cy="0" r="1.5" fill="#f8fafc"/>
    </g>

    <!-- Route dashed line -->
    <path d="M 85 140 Q 110 125, 135 135" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 2"/>
  </g>

  <!-- Dynamic action / unrolling motion speed lines & sparkles -->
  <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="22" y1="120" x2="30" y2="120"/>
    <line x1="18" y1="140" x2="27" y2="140"/>
    <line x1="210" y1="110" x2="218" y2="110"/>
    <line x1="213" y1="135" x2="222" y2="135"/>
  </g>

  <!-- Glowing magical accent particles floating up -->
  <circle cx="70" cy="70" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="160" cy="65" r="3.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="185" cy="80" r="2" fill="#ec4899" opacity="0.7"/>
  <circle cx="55" cy="95" r="1.5" fill="#10b981" opacity="0.9"/>
</svg>