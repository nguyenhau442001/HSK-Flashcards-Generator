<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Door Frame -->
  <rect x="60" y="40" width="120" height="180" rx="4" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="64" y="44" width="112" height="172" rx="2" fill="#1e293b"/>
  
  <!-- Door -->
  <path d="M120 44 L176 44 L176 216 L120 216 Z" fill="#475569"/>
  <circle cx="160" cy="130" r="6" fill="#f59e0b"/>
  
  <!-- Character Body -->
  <g transform="translate(40, 80)">
    <!-- Legs -->
    <path d="M60 120 L40 140 M80 120 L100 140" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- Torso -->
    <rect x="50" y="60" width="40" height="60" rx="10" fill="#38bdf8"/>
    <!-- Arms pushing -->
    <path d="M90 80 L130 110" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>
    <path d="M90 90 L130 120" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="70" cy="40" r="20" fill="#fbbf24"/>
    <!-- Expression -->
    <path d="M60 35 Q65 30 70 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M80 35 Q85 30 90 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M65 50 Q75 55 85 50" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Action Lines -->
  <path d="M110 100 L100 90 M110 120 L100 130" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <path d="M115 105 L105 95 M115 125 L105 135" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
</svg>