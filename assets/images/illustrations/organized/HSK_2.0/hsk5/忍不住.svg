<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="10"/>
  
  <!-- The Character (Trying to hold back laughter) -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-40 80 Q-40 20 0 20 T40 80" fill="#fbbf24"/>
    <!-- Face -->
    <circle cx="0" cy="-20" r="35" fill="#fde68a"/>
    <!-- Eyes (Squinting/Holding back) -->
    <path d="M-20 -25 Q-10 -35 0 -25 T20 -25" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Mouth (Covered by hand) -->
    <path d="M-15 0 Q0 5 15 0" stroke="#0f172a" stroke-width="3" fill="none"/>
    <!-- Hand covering mouth -->
    <path d="M-25 10 L25 10 L20 30 L-20 30 Z" fill="#fb923c"/>
    <!-- Fingers -->
    <rect x="-20" y="10" width="40" height="5" fill="#f59e0b" rx="2"/>
  </g>
  
  <!-- Context Props: A spilled drink/mess to trigger the laughter -->
  <circle cx="60" cy="180" r="15" fill="#38bdf8" opacity="0.6"/>
  <path d="M50 180 Q60 170 70 180" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Decorative elements (Laughter bubbles) -->
  <circle cx="170" cy="80" r="5" fill="#ec4899"/>
  <circle cx="185" cy="60" r="8" fill="#ec4899"/>
  <circle cx="200" cy="90" r="4" fill="#10b981"/>
  
  <!-- Chair back -->
  <rect x="80" y="180" width="80" height="60" fill="#1e293b" stroke="#334155" stroke-width="4" rx="10"/>
</svg>