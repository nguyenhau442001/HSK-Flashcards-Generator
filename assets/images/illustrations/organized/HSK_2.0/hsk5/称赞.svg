<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Beam -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character 1 (Teacher) Hair Gradient -->
    <linearGradient id="hair-t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character 2 (Student) Hair Gradient -->
    <linearGradient id="hair-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Background Details: Classroom Wall & Windows -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="20" y="25" width="60" height="85" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <path d="M50 25 V110 M20 67 H80" stroke="#334155" stroke-width="2" />
    <!-- Night Sky View outside window -->
    <circle cx="35" cy="45" r="1.5" fill="#f8fafc" opacity="0.6"/>
    <circle cx="65" cy="35" r="1" fill="#f8fafc" opacity="0.8"/>
    <circle cx="55" cy="85" r="1.5" fill="#f8fafc" opacity="0.5"/>

    <!-- Ambient Warm Light Beam from hanging lamp -->
    <polygon points="120,0 40,240 200,240" fill="url(#light-beam)" />

    <!-- Hanging Classroom Lamp -->
    <path d="M110 0 H130 L135 15 H105 Z" fill="#64748b" />
    <circle cx="120" cy="18" r="8" fill="#fbbf24" filter="url(#shadow)" />

    <!-- Bookshelf in background -->
    <rect x="175" y="40" width="45" height="120" rx="2" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="175" y1="75" x2="220" y2="75" stroke="#334155" stroke-width="2"/>
    <line x1="175" y1="115" x2="220" y2="115" stroke="#334155" stroke-width="2"/>
    <!-- Books on shelf -->
    <rect x="181" y="55" width="8" height="20" fill="#38bdf8" rx="1"/>
    <rect x="191" y="52" width="10" height="23" fill="#ec4899" rx="1"/>
    <rect x="203" y="58" width="6" height="17" fill="#10b981" rx="1"/>
    <rect x="180" y="90" width="12" height="25" fill="#fbbf24" rx="1"/>
    <rect x="194" y="93" width="7" height="22" fill="#f97316" rx="1"/>
  </g>

  <!-- Foreground/Midground Furniture: Classroom Desk -->
  <g id="furniture" filter="url(#shadow)">
    <!-- Main Desk Surface -->
    <path d="M 15 170 L 225 170 L 210 215 L 30 215 Z" fill="url(#desk-grad)" stroke="#475569" stroke-width="2" />
    <path d="M 25 170 L 215 170 L 205 178 L 35 178 Z" fill="#475569" /> <!-- Desk rim -->
    
    <!-- Props on Desk: Open Notebook, Pen, Globe/Plant -->
    <!-- Open Notebook -->
    <path d="M 85 185 L 125 182 L 125 208 L 85 210 Z" fill="#f8fafc" />
    <path d="M 125 182 L 165 185 L 165 210 L 125 208 Z" fill="#e2e8f0" />
    <line x1="125" y1="182" x2="125" y2="208" stroke="#cbd5e1" stroke-width="2" />
    <!-- Notebook lines -->
    <line x1="93" y1="192" x2="117" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="93" y1="198" x2="117" y2="196" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="133" y1="191" x2="157" y2="193" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="133" y1="197" x2="157" y2="199" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <!-- Red Checkmark (Student's homework showing great progress) -->
    <path d="M 138 200 L 143 205 L 152 195" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Pencil holder / Mug -->
    <rect x="55" y="178" width="16" height="22" rx="3" fill="#38bdf8" />
    <ellipse cx="63" cy="178" rx="8" ry="3" fill="#0284c7" />
    <!-- Pencils inside -->
    <line x1="59" y1="178" x2="55" y2="166" stroke="#fbbf24" stroke-width="2" />
    <line x1="63" y1="178" x2="63" y2="164" stroke="#ec4899" stroke-width="2" />
    <line x1="67" y1="178" x2="71" y2="167" stroke="#f8fafc" stroke-width="2" />
  </g>

  <!-- CHARACTERS: Teacher (Left) praising Student (Right) -->
  <g id="characters">
    
    <!-- STUDENT (Right side, sitting, smiling proudly, receiving praise) -->
    <g id="student" filter="url(#shadow)">
      <!-- Body/Torso (Green hoodie) -->
      <path d="M 160 215 L 155 160 C 155 150, 185 150, 185 160 L 185 215 Z" fill="#10b981" />
      <!-- Hoodie pocket & strings -->
      <path d="M 164 190 H 176 V 205 C 176 208, 164 208, 164 205 Z" fill="#059669" />
      <path d="M 167 160 L 165 178" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
      <path d="M 173 160 L 175 178" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />

      <!-- Neck -->
      <rect x="164" y="142" width="12" height="20" fill="#fcd34d" />

      <!-- Head -->
      <circle cx="170" cy="130" r="18" fill="#fcd34d" />
      
      <!-- Hair (Student) -->
      <path d="M 152 130 C 150 110, 190 110, 188 130 C 190 120, 175 105, 160 112 Z" fill="url(#hair-s)" />
      
      <!-- Face Expression (Happy, touched, beaming) -->
      <!-- Blushing cheeks -->
      <circle cx="158" cy="136" r="4" fill="#fb7185" opacity="0.6" />
      <circle cx="182" cy="136" r="4" fill="#fb7185" opacity="0.6" />
      <!-- Closed happy eyes (happy arcs) -->
      <path d="M 160 128 Q 164 124 168 128" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      <path d="M 172 128 Q 176 124 180 128" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      <!-- Wide happy smile -->
      <path d="M 164 135 Q 170 143 176 135" fill="#78350f" />

      <!-- Left Arm (Clutched happily to chest in gratitude/joy) -->
      <path d="M 157 165 C 150 170, 160 185, 168 180" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
      <!-- Hands -->
      <circle cx="168" cy="180" r="5" fill="#fcd34d" />
    </g>


    <!-- TEACHER (Left side, standing/leaning slightly, giving thumbs up / praise gesture) -->
    <g id="teacher" filter="url(#shadow)">
      <!-- Legs/Body (Blue Suit Jacket & Pants) -->
      <path d="M 65 215 L 68 150 L 95 150 L 98 215 Z" fill="#3b82f6" />
      <!-- White Shirt Collar & Tie -->
      <path d="M 76 150 L 82 165 L 88 150 Z" fill="#f8fafc" />
      <polygon points="80,163 83,163 84,180 82,185 80,180" fill="#ef4444" />

      <!-- Head -->
      <circle cx="82" cy="115" r="18" fill="#fcd34d" />

      <!-- Hair (Teacher - neat, professional side part) -->
      <path d="M 66 115 C 64 98, 98 98, 98 115 C 98 105, 90 95, 78 95 C 68 95, 66 105, 66 115 Z" fill="url(#hair-t)" />

      <!-- Glasses -->
      <rect x="71" y="110" width="10" height="7" rx="2" fill="none" stroke="#1e293b" stroke-width="2" />
      <rect x="83" y="110" width="10" height="7" rx="2" fill="none" stroke="#1e293b" stroke-width="2" />
      <line x1="81" y1="113" x2="83" y2="113" stroke="#1e293b" stroke-width="2" />

      <!-- Face Expression (Warm, encouraging smile, eyes crinkled with pride) -->
      <path d="M 73 123 Q 76 126 79 123" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M 85 123 Q 88 126 91 123" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M 78 129 Q 82 134 86 129" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />

      <!-- Right Arm & Hand (The Praise Action: Thumbs Up / Encouraging Gesture pointing towards student) -->
      <!-- Upper arm & forearm reaching out -->
      <path d="M 90 155 C 105 155, 115 145, 125 140" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
      <!-- Hand / Thumbs Up -->
      <circle cx="128" cy="138" r="6" fill="#fcd34d" />
      <!-- Thumb pointing up -->
      <path d="M 126 134 L 126 124 C 126 121, 131 121, 131 124 L 131 134 Z" fill="#fcd34d" />

      <!-- Left Arm resting comfortably -->
      <path d="M 74 155 C 65 170, 70 190, 70 190" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
      <circle cx="70" cy="190" r="5" fill="#fcd34d" />
    </g>

  </g>

  <!-- ENERGETIC / POSITIVE ATMOSPHERE ELEMENTS -->
  <!-- Glowing Sparkles & Floating Star Accents (denoting excellence, praise, and positive feedback) -->
  <g id="sparkles" filter="url(#shadow)">
    <!-- Star 1 (Top center, glowing golden) -->
    <path d="M 120 75 L 123 85 L 133 88 L 123 91 L 120 101 L 117 91 L 107 88 L 117 85 Z" fill="#fbbf24" />
    
    <!-- Star 2 (Smaller, near student's head) -->
    <path d="M 150 90 L 152 95 L 157 97 L 152 99 L 150 104 L 148 99 L 143 97 L 148 95 Z" fill="#38bdf8" />
    
    <!-- Star 3 (Sparkle near teacher's hand) -->
    <path d="M 135 115 L 136.5 119 L 140.5 120.5 L 136.5 122 L 135 126 L 133.5 122 L 129.5 120.5 L 133.5 119 Z" fill="#f43f5e" />

    <!-- Tiny floating sparkle dots -->
    <circle cx="100" cy="110" r="2" fill="#fbbf24" opacity="0.8" />
    <circle cx="140" cy="80" r="1.5" fill="#38bdf8" opacity="0.9" />
    <circle cx="110" cy="140" r="2" fill="#10b981" opacity="0.8" />
  </g>

</svg>