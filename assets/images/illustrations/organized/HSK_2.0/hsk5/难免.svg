<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Amber Glow for Tension/Lighting -->
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Cardboard Box Gradient -->
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>
  
  <!-- Ambient Lighting Layer -->
  <circle cx="120" cy="90" r="110" fill="url(#amberGlow)" />

  <!-- Background Environment: Workshop / Room Elements -->
  <!-- Back Wall Details & Shelves -->
  <path d="M30 80 L90 80 L90 82 L30 82 Z" fill="#334155" opacity="0.6"/>
  <rect x="40" y="45" width="25" height="35" rx="2" fill="#3b82f6" opacity="0.3"/>
  <rect x="70" y="55" width="18" height="25" rx="2" fill="#10b981" opacity="0.3"/>

  <!-- Motion/Action Impact Lines (Top Right) -->
  <path d="M 175 45 L 195 35" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 185 60 L 210 50" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 170 30 L 180 20" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Floor -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- SCENE OBJECTS: Falling & Scattering Items (The Inevitable Mishap) -->
  <!-- Tilted/Falling Pedestal or Crate Stack -->
  <g transform="rotate(-12 180 150)" filter="url(#shadow)">
    <rect x="155" y="120" width="50" height="50" rx="4" fill="url(#boxGrad1)"/>
    <polygon points="155,120 175,105 225,105 205,120" fill="url(#boxGrad2)"/>
  </g>

  <!-- Flying Porcelain Vase (About to crash) -->
  <g transform="rotate(35 150 100)" filter="url(#shadow)">
    <path d="M 140 110 C 135 90, 145 80, 150 75 C 155 80, 165 90, 160 110 Z" fill="#38bdf8"/>
    <ellipse cx="150" cy="75" rx="5" ry="2" fill="#7dd3fc"/>
  </g>

  <!-- Flying/Scattered Ceramic Chunks & Stars (Impact context) -->
  <path d="M 185 115 L 193 108 L 188 122 Z" fill="#38bdf8" filter="url(#shadow)"/>
  <path d="M 210 135 L 218 130 L 212 142 Z" fill="#38bdf8" filter="url(#shadow)"/>
  <!-- Impact Sparkle -->
  <path d="M 165 140 L 170 130 L 175 140 L 185 145 L 175 150 L 170 160 L 165 150 L 155 145 Z" fill="#fbbf24" opacity="0.9"/>

  <!-- MAIN CHARACTER: Expressive Worker/Person Reacting to Inevitable Mishap -->
  <g id="main-character" filter="url(#shadow)">
    <!-- Character Shadow on Floor -->
    <ellipse cx="105" cy="192" rx="35" ry="8" fill="#090d16" opacity="0.6"/>

    <!-- Body / Torso (Dynamic leaning back pose) -->
    <path d="M 85 140 L 115 135 L 125 185 L 80 185 Z" fill="#0284c7"/>
    <!-- Collar & Shirt Details -->
    <path d="M 95 137 L 105 150 L 115 137 Z" fill="#f8fafc"/>
    <rect x="98" y="148" width="14" height="37" fill="#0369a1"/>

    <!-- Left Arm (Reaching out in disbelief / halt gesture) -->
    <path d="M 85 140 C 70 135, 50 145, 40 135" stroke="#0284c7" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Left Hand -->
    <circle cx="35" cy="133" r="7" fill="#ffedd5"/>

    <!-- Right Arm (Raised defensively / reacting) -->
    <path d="M 115 138 C 130 130, 140 115, 145 100" stroke="#0284c7" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Right Hand -->
    <circle cx="148" cy="93" r="7" fill="#ffedd5"/>

    <!-- Legs (Planted wide for balance/surprise) -->
    <path d="M 88 180 L 75 190" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <path d="M 115 180 L 125 190" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="70" cy="191" rx="8" ry="4" fill="#334155"/>
    <ellipse cx="130" cy="191" rx="8" ry="4" fill="#334155"/>

    <!-- Neck -->
    <rect x="95" y="125" width="16" height="20" rx="6" fill="#ffedd5"/>

    <!-- Head (Slightly tilted back, comic expression of "Oh well / Can't help it") -->
    <g transform="translate(103, 115)">
      <!-- Hair -->
      <path d="M -18 -5 C -20 -25, 5 -30, 18 -15 C 22 -10, 22 5, 20 10 C 10 15, -10 15, -18 -5 Z" fill="#334155"/>
      
      <!-- Face Base -->
      <ellipse cx="0" cy="0" rx="18" ry="20" fill="#ffedd5"/>

      <!-- Ears -->
      <circle cx="-17" cy="2" r="3.5" fill="#fdbf87"/>
      <circle cx="17" cy="2" r="3.5" fill="#fdbf87"/>

      <!-- Eyebrows (Raised in helpless resignation) -->
      <path d="M -10 -8 Q -4 -13 0 -7" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 4 -7 Q 8 -13 12 -8" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Eyes (Woke/Squinted expression with slight nervous arcs) -->
      <circle cx="-5" cy="-2" r="2.5" fill="#1e293b"/>
      <circle cx="8" cy="-2" r="2.5" fill="#1e293b"/>

      <!-- Sweat Drop (Classic manga/vector trope for stress/inevitability) -->
      <path d="M 16 -12 C 16 -12, 21 -3, 21 2 C 21 5, 18 7, 16 7 C 14 7, 11 5, 11 2 C 11 -3, 16 -12, 16 -12 Z" fill="#38bdf8" opacity="0.9"/>
      <path d="M 14 -3 C 14 -3, 16 0, 16 2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- Open Mouth (Exhaling a sigh: "Haah... inevitable") -->
      <path d="M -3 7 Q 2 15 7 7 Z" fill="#991b1b"/>
      <!-- Tongue -->
      <path d="M 0 11 Q 2 14 4 11 Z" fill="#ef4444"/>

      <!-- Blushing Cheeks (Embarrassed/Helpless realization) -->
      <ellipse cx="-11" cy="5" rx="4" ry="2" fill="#f43f5e" opacity="0.4"/>
      <ellipse cx="13" cy="5" rx="4" ry="2" fill="#f43f5e" opacity="0.4"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Particles (Dust/Magic sparkles for mood) -->
  <circle cx="140" cy="50" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="160" cy="70" r="1.5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="50" cy="110" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="70" cy="125" r="1" fill="#ffffff" opacity="0.9"/>
  <circle cx="205" cy="80" r="2.5" fill="#fbbf24" opacity="0.5"/>
</svg>