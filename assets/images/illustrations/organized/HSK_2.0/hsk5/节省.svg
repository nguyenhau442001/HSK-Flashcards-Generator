<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Counter Glow Gradient -->
    <radialGradient id="counterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Water Drop Gradient -->
    <linearGradient id="dropGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Saving Jar Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Ambient Elements / Shelf & Context -->
  <g opacity="0.6">
    <!-- Back Wall Countertop Line -->
    <line x1="20" y1="185" x2="220" y2="185" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 185 L20 210 L220 210 L220 185 Z" fill="#0f172a" opacity="0.8"/>
    
    <!-- Warm background glow simulating kitchen/home environment -->
    <circle cx="120" cy="110" r="80" fill="url(#counterGlow)"/>
  </g>

  <!-- Potted Plant (Eco/Conservation motif) -->
  <g transform="translate(35, 130)" filter="url(#shadow)">
    <!-- Pot -->
    <path d="M5 25 L15 55 C15 57 17 58 19 58 L31 58 C33 58 35 57 35 55 L45 25 Z" fill="#cbd5e1"/>
    <ellipse cx="25" cy="25" rx="20" ry="4" fill="#94a3b8"/>
    <!-- Plant Stems & Leaves -->
    <path d="M25 25 Q20 5 10 10" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M25 25 Q35 0 42 8" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M25 25 Q25 -5 25 -12" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M8 12 C2 10 5 2 12 7 Z" fill="url(#leafGrad)"/>
    <path d="M40 9 C46 5 45 -3 38 3 Z" fill="url(#leafGrad)"/>
    <path d="M23 -10 C18 -15 28 -22 30 -14 Z" fill="url(#leafGrad)"/>
  </g>

  <!-- Main Subject 1: Water Conservation (Faucet & Collecting Drop) -->
  <g transform="translate(145, 45)" filter="url(#shadow)">
    <!-- Wall mount plate -->
    <rect x="40" y="5" width="16" height="24" rx="4" fill="#64748b"/>
    <!-- Faucet Pipe -->
    <path d="M48 15 L25 15 C15 15 10 20 10 30 L10 40" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M48 15 L25 15 C15 15 10 20 10 30 L10 40" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Faucet Handle -->
    <rect x="42" y="0" width="12" height="7" rx="2" fill="#38bdf8"/>
    
    <!-- Water Drop - Paused / Saved state -->
    <path d="M10 58 C10 58 2 70 2 76 C2 80.4 5.6 84 10 84 C14.4 84 18 80.4 18 76 C18 70 10 58 10 58 Z" fill="url(#dropGrad)" filter="url(#glow)"/>
    <!-- Ripple on surface below -->
    <ellipse cx="10" cy="92" rx="8" ry="3" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Main Subject 2: Financial/Resource Saving (Piggy Bank / Jar with Coins & Green Leaf sprout) -->
  <g transform="translate(85, 95)" filter="url(#shadow)">
    <!-- Jar Body -->
    <path d="M22 15 L48 15 C52 15 55 18 55 22 L55 30 C55 33 58 35 60 38 L65 45 C72 55 75 68 75 82 C75 95 64 105 50 105 L20 105 C6 105 -5 95 -5 82 C-5 68 -2 55 5 45 L10 38 C12 35 15 33 15 30 L15 22 C15 18 18 15 22 15 Z" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Jar Lid (Wooden / Cork top) -->
    <rect x="15" y="8" width="40" height="9" rx="3" fill="#b45309"/>
    <rect x="18" y="5" width="34" height="4" rx="2" fill="#d97706"/>

    <!-- Inside the Jar: Coins Stack -->
    <rect x="5" y="75" width="60" height="8" rx="3" fill="url(#coinGrad)"/>
    <rect x="8" y="65" width="54" height="9" rx="3" fill="url(#coinGrad)"/>
    <rect x="12" y="55" width="46" height="9" rx="3" fill="url(#coinGrad)"/>
    <rect x="18" y="47" width="34" height="8" rx="3" fill="url(#coinGrad)"/>

    <!-- Eco Sprout coming out of the coin stack (Symbolizing green economy/saving) -->
    <path d="M35 47 Q35 30 25 22" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M25 25 C15 20 15 32 25 32 Z" fill="url(#leafGrad)"/>
    <path d="M30 35 C42 30 40 42 30 40 Z" fill="url(#leafGrad)"/>

    <!-- Jar Highlight Refraction -->
    <path d="M2 50 Q6 70 5 90" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Heart Icon embedded on Jar indicating care/saving value -->
    <path d="M35 75 C35 72 38 68 42 68 C46 68 48 71 48 74 C48 78 42 84 35 88 C28 84 22 78 22 74 C22 71 24 68 28 68 C32 68 35 72 35 75 Z" fill="#ec4899" opacity="0.8"/>
  </g>

  <!-- Floating Action / Success Elements (Sparkles & Energy) -->
  <g transform="translate(0, 0)">
    <!-- Star Sparkle top right -->
    <path d="M190 40 Q190 50 200 50 Q190 50 190 60 Q190 50 180 50 Q190 50 190 40 Z" fill="#fbbf24" filter="url(#glow)"/>
    <!-- Star Sparkle bottom left -->
    <path d="M60 70 Q60 76 66 76 Q60 76 60 82 Q60 76 54 76 Q60 76 60 70 Z" fill="#38bdf8" filter="url(#glow)"/>
    <!-- Small Eco Leaf floating -->
    <g transform="translate(170, 110) rotate(25)" filter="url(#shadow)">
      <path d="M0 10 C15 5 15 -10 0 -15 C-15 -10 -15 5 0 10 Z" fill="url(#leafGrad)"/>
      <path d="M0 -15 L0 10" stroke="#065f46" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Falling Coin representing active saving -->
    <g transform="translate(125, 60) rotate(-15)" filter="url(#shadow)">
      <ellipse cx="0" cy="0" rx="9" ry="5" fill="url(#coinGrad)" stroke="#fef08a" stroke-width="1"/>
      <path d="M-3 -1 L3 -1 M-3 1 L3 1" stroke="#b45309" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Depth Highlights -->
  <circle cx="210" cy="180" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="30" cy="190" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="115" cy="30" r="2" fill="#34d399" opacity="0.4"/>
</svg>