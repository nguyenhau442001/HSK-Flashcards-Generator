<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Wooden Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#331f14"/>
      <stop offset="100%" stop-color="#1c100a"/>
    </linearGradient>

    <!-- Wood Grain Highlight -->
    <linearGradient id="tableHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soy Sauce Bottle Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#451a03" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#291104" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Soy Sauce Liquid Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#381003"/>
      <stop offset="40%" stop-color="#180501"/>
      <stop offset="100%" stop-color="#210802"/>
    </linearGradient>

    <!-- Ceramic Bowl Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="bowlInside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Metallic Cap Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Warm Atmospheric Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Ambient Golden Light behind the scene -->
  <circle cx="120" cy="140" r="80" fill="url(#amberGlow)"/>

  <!-- Back Wall / Surface Separation Line -->
  <line x1="0" y1="145" x2="240" y2="145" stroke="#0f172a" stroke-width="2"/>

  <!-- Wooden Table Surface -->
  <path d="M 0 145 L 240 145 L 240 228 C 240 234.627 234.627 240 228 240 L 12 240 C 5.373 240 0 234.627 0 228 Z" fill="url(#tableGrad)"/>
  <rect x="0" y="145" width="240" height="95" fill="url(#tableHighlight)"/>
  <ellipse cx="120" cy="145" rx="120" ry="12" fill="#23120a" opacity="0.6"/>

  <!-- Chopstick Rest & Chopsticks (Background Prop) -->
  <g filter="url(#shadow)">
    <!-- Chopstick Rest -->
    <path d="M 180 160 L 205 160 C 208 160 210 162 210 165 C 210 168 208 170 205 170 L 180 170 C 177 170 175 168 175 165 C 175 162 177 160 180 160 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Chopsticks angled -->
    <path d="M 145 195 L 225 140" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 148 199 L 228 144" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Dumpling / Food Bowl (Left Context Prop) -->
  <g filter="url(#shadow)" transform="translate(-10, 15)">
    <!-- Bowl Drop Shadow -->
    <ellipse cx="70" cy="175" rx="35" ry="10" fill="#000000" opacity="0.4"/>
    <!-- Bowl Outside -->
    <path d="M 38 150 C 38 172 45 185 70 185 C 95 185 102 172 102 150 Z" fill="url(#bowlGrad)"/>
    <!-- Bowl Rim -->
    <ellipse cx="70" cy="150" rx="32" ry="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Bowl Inside -->
    <ellipse cx="70" cy="151" rx="28" ry="5" fill="url(#bowlInside)"/>
    <!-- Steamed Dumpling inside bowl -->
    <path d="M 55 148 C 55 138 65 135 70 135 C 75 135 85 138 85 148 C 85 150 55 150 55 148 Z" fill="#fffbeb"/>
    <path d="M 62 143 C 65 141 75 141 78 143" stroke="#fcd34d" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- MAIN SUBJECT: Traditional Glass Soy Sauce Bottle (酱油) -->
  <g filter="url(#shadow)" transform="translate(0, 5)">
    <!-- Bottle Base Shadow -->
    <ellipse cx="120" cy="180" rx="26" ry="9" fill="#000000" opacity="0.5"/>

    <!-- Bottle Body (Glass) -->
    <path d="M 102 95 
             L 108 72 
             C 108 68 112 65 116 65 
             L 124 65 
             C 128 65 132 68 132 72 
             L 138 95
             C 148 102 154 116 154 135
             L 154 165
             C 154 178 140 185 120 185
             C 100 185 86 178 86 165
             L 86 135
             C 86 116 92 102 102 95 Z" fill="url(#glassGrad)"/>

    <!-- Liquid Soy Sauce Inside Body -->
    <path d="M 89 115
             C 93 105 100 97 106 95
             L 110 95
             L 110 180
             L 120 180
             L 130 180
             L 130 95
             L 134 95
             C 140 97 147 105 151 115
             L 151 165
             C 151 175 138 182 120 182
             C 102 182 89 175 89 165 Z" fill="url(#liquidGrad)"/>

    <!-- Liquid surface line inside neck -->
    <ellipse cx="120" cy="95" rx="12" ry="3" fill="#180501"/>

    <!-- Glass Refraction Highlights -->
    <!-- Left vertical glass shine -->
    <path d="M 92 120 C 90 135 91 155 94 172" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25"/>
    <!-- Right subtle reflection -->
    <path d="M 146 125 C 148 140 147 155 144 170" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.15"/>
    <!-- Curved highlight on rounded belly -->
    <path d="M 97 110 C 105 102 118 100 128 101" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.2"/>

    <!-- Bottle Neck & Red Cap Assembly -->
    <!-- Metal/Plastic Red Screw Cap / Pourer -->
    <path d="M 111 65 L 129 65 L 131 52 L 109 52 Z" fill="#ef4444" filter="url(#softShadow)"/>
    <path d="M 109 52 L 131 52 L 131 46 L 109 46 Z" fill="#dc2626"/>
    <!-- Cap Ridges / Texture -->
    <line x1="113" y1="55" x2="113" y2="62" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="117" y1="55" x2="117" y2="62" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="120" y1="55" x2="120" y2="62" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="123" y1="55" x2="123" y2="62" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="127" y1="55" x2="127" y2="62" stroke="#b91c1c" stroke-width="1.5"/>

    <!-- Spout / Pourer Tip -->
    <path d="M 114 46 L 126 46 L 123 38 L 117 38 Z" fill="url(#metalGrad)"/>
    <ellipse cx="120" cy="38" rx="3" ry="1" fill="#334155"/>

    <!-- Decorative Red/Gold Label on Bottle -->
    <g filter="url(#softShadow)">
      <path d="M 94 115 L 146 115 L 148 155 L 92 155 Z" fill="#dc2626"/>
      <!-- Label Gold Border -->
      <path d="M 94 115 L 146 115 L 148 155 L 92 155 Z" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Label Graphic Elements (Abstract cultural pattern lines instead of text) -->
      <circle cx="120" cy="135" r="12" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.8"/>
      <circle cx="120" cy="135" r="9" fill="#991b1b"/>
      <path d="M 120 128 L 122 133 L 127 133 L 123 136 L 125 141 L 120 138 L 115 141 L 117 136 L 113 133 L 118 133 Z" fill="#fbbf24" opacity="0.9"/>
      <line x1="98" y1="122" x2="108" y2="122" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="132" y1="122" x2="142" y2="122" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="98" y1="148" x2="108" y2="148" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="132" y1="148" x2="142" y2="148" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Action Action: Pouring Drop Effect (Action-packed detail) -->
    <g transform="translate(0, -10)">
      <circle cx="118" cy="30" r="2.5" fill="#3b0a04"/>
      <circle cx="116" cy="22" r="2" fill="#3b0a04"/>
      <path d="M 119 33 C 119 35 117 37 116 38 C 115 37 113 35 113 33 C 113 31 116 31 116 31 C 116 31 119 31 119 33 Z" fill="#451a03" opacity="0.6"/>
    </g>
  </g>

  <!-- Small Dipping Dish (Foreground Right Prop) with Soy Sauce Pool -->
  <g filter="url(#shadow)" transform="translate(15, 10)">
    <!-- Dish Shadow -->
    <ellipse cx="160" cy="180" rx="28" ry="9" fill="#000000" opacity="0.4"/>
    <!-- Outer Ceramic Rim -->
    <ellipse cx="160" cy="176" rx="28" ry="12" fill="url(#bowlGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Inner Bowl Depth -->
    <ellipse cx="160" cy="178" rx="24" ry="9" fill="#f8fafc"/>
    <!-- Soy Sauce Pool in Dish -->
    <ellipse cx="161" cy="179" rx="21" ry="7" fill="url(#liquidGrad)"/>
    <!-- Soy Sauce Gloss / Reflection -->
    <ellipse cx="155" cy="177" rx="10" ry="3" fill="#ffffff" opacity="0.25" transform="rotate(-10 155 177)"/>
  </g>

  <!-- Dynamic Accent Particle / Sparkle for action/vivacity -->
  <g transform="translate(140, 90)" opacity="0.9">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(85, 130)" opacity="0.7">
    <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(175, 135)" opacity="0.8">
    <path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" fill="#f59e0b"/>
  </g>
</svg>