<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- The Stable Structure: A stack of heavy, balanced geometric books/blocks -->
  <g transform="translate(70, 60)">
    <!-- Base block -->
    <rect x="0" y="120" width="100" height="20" rx="2" fill="#fbbf24"/>
    <rect x="5" y="125" width="90" height="10" fill="#f59e0b"/>
    
    <!-- Middle block -->
    <rect x="10" y="90" width="80" height="30" rx="2" fill="#38bdf8"/>
    <rect x="15" y="95" width="70" height="20" fill="#0ea5e9"/>
    
    <!-- Top block -->
    <rect x="20" y="60" width="60" height="30" rx="2" fill="#10b981"/>
    <rect x="25" y="65" width="50" height="20" fill="#059669"/>
    
    <!-- Balanced object on top -->
    <circle cx="50" cy="40" r="15" fill="#ec4899"/>
    <circle cx="50" cy="40" r="8" fill="#db2777"/>
  </g>
  
  <!-- Atmospheric details: Motion lines indicating stillness/balance -->
  <path d="M40 100 Q 30 120 40 140" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M200 100 Q 210 120 200 140" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="100" r="80" fill="#f59e0b" fill-opacity="0.05"/>
</svg>