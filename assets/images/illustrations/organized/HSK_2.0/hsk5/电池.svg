<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="battery-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light / Environment context -->
  <path d="M 60 180 L 180 180 L 200 210 L 40 210 Z" fill="#090d16" opacity="0.6"/>
  <ellipse cx="120" cy="180" rx="70" ry="15" fill="url(#glow-grad)"/>

  <!-- Context Props (Futuristic workbench / charging station base) -->
  <path d="M 70,175 L 170,175 L 185,195 L 55,195 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="95" y="182" width="50" height="4" rx="2" fill="#0f172a"/>
  <!-- Status light on dock -->
  <circle cx="120" cy="184" r="2" fill="#10b981"/>

  <!-- Main Subject: Battery (电池) -->
  <g transform="translate(0, -5)">
    <!-- Battery Terminal (Negative/Bottom base resting) -->
    
    <!-- Main Battery Cylinder / Body -->
    <rect x="92" y="70" width="56" height="100" rx="12" fill="url(#battery-body)" stroke="#1d4ed8" stroke-width="3"/>
    
    <!-- Battery Top Terminal (Positive (+) stud) -->
    <path d="M 106 58 L 134 58 L 134 70 L 106 70 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" rx="3"/>
    <rect x="114" y="53" width="12" height="6" rx="2" fill="#94a3b8"/>

    <!-- Energy Level Indicator (Low Battery / Red Glow Segment) -->
    <rect x="102" y="138" width="36" height="24" rx="6" fill="#ef4444" opacity="0.9"/>
    <!-- Warning Lightning Bolt inside low battery indicator -->
    <path d="M 122 142 L 115 150 L 121 150 L 118 158 L 127 148 L 121 148 Z" fill="#fef08a"/>

    <!-- High charge segments (faded/empty representation) -->
    <rect x="102" y="82" width="36" height="24" rx="6" fill="#1e3a8a" opacity="0.5"/>
    <rect x="102" y="110" width="36" height="24" rx="6" fill="#1e3a8a" opacity="0.5"/>

    <!-- Plus Symbol on Top -->
    <path d="M 120 78 V 86 M 116 82 H 124" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sparks / Exhausted energy particles floating away -->
    <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M 145 95 Q 155 90 152 82"/>
      <path d="M 95 105 Q 85 100 88 92"/>
      <path d="M 142 125 Q 152 120 148 112"/>
    </g>
    <circle cx="155" cy="78" r="1.5" fill="#fbbf24"/>
    <circle cx="85" cy="88" r="1.5" fill="#fbbf24"/>
    <circle cx="150" cy="108" r="1" fill="#f59e0b"/>
  </g>

  <!-- Foreground Atmospheric Sparks & Details -->
  <circle cx="75" cy="120" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="165" cy="140" r="1.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="105" cy="50" r="1" fill="#f59e0b" opacity="0.8"/>
  <circle cx="135" cy="45" r="2" fill="#fbbf24" opacity="0.5"/>

</svg>