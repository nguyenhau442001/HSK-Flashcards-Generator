<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Pouch Gold Accent Gradient -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Atmosphere -->
  <!-- Ambient glowing light circle for focus -->
  <circle cx="120" cy="150" r="70" fill="url(#goldGlow)" />

  <!-- Distant park/street background elements (silhouetted shapes) -->
  <path d="M0 160 Q 40 140, 80 155 T 160 150 T 240 158 L 240 240 L 0 240 Z" fill="#1e293b" opacity="0.7"/>
  
  <!-- Cobblestone / Ground Surface -->
  <path d="M0 165 C 60 155, 180 155, 240 165 L 240 240 L 0 240 Z" fill="url(#groundGrad)" />

  <!-- Street Details (Cobble lines) -->
  <path d="M20 185 Q 60 180, 90 195" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M140 180 Q 180 185, 210 175" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M80 215 Q 120 205, 170 220" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Fallen Leaf 1 -->
  <path d="M70 195 Q 75 190, 80 198 Q 72 202, 70 195 Z" fill="#f97316" opacity="0.8" transform="rotate(-20 75 196)"/>
  <!-- Fallen Leaf 2 -->
  <path d="M170 205 Q 177 200, 182 208 Q 174 214, 170 205 Z" fill="#eab308" opacity="0.8" transform="rotate(45 176 206)"/>

  <!-- MAIN SCENE: The Wallet / Money Pouch on the ground -->
  <g filter="url(#shadow)" transform="translate(10, 10)">
    <!-- Pouch Glow Base -->
    <ellipse cx="110" cy="175" rx="18" ry="8" fill="#f59e0b" opacity="0.5"/>
    
    <!-- Pouch Body -->
    <path d="M 95 165 C 92 165, 88 175, 95 182 C 102 188, 118 188, 125 182 C 132 175, 128 165, 125 165 Z" fill="url(#pouchGrad)" />
    <!-- Pouch Tie / Drawstring -->
    <path d="M 97 165 Q 110 160, 123 165" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="110" cy="162" r="3" fill="#fef08a"/>
    <!-- Pouch Fold details -->
    <path d="M 102 168 Q 110 175, 118 168" stroke="#d97706" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- MAIN CHARACTER: Person reaching down to pick up the pouch -->
  <g filter="url(#shadow)">
    <!-- Back Leg (Bent) -->
    <path d="M 125 110 Q 140 135, 145 160" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 145 160 L 158 168" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>

    <!-- Torso (Dynamic forward bend) -->
    <path d="M 105 90 Q 120 100, 128 120 L 115 130 Q 100 115, 95 100 Z" fill="#38bdf8"/>

    <!-- Front Leg (Kneeling/Crouching) -->
    <path d="M 105 115 Q 85 130, 80 155" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 80 155 L 68 162" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>

    <!-- Backpack -->
    <path d="M 92 92 C 82 95, 80 115, 88 122 C 92 125, 98 115, 95 100 Z" fill="#fb923c"/>
    <path d="M 85 105 Q 90 110, 95 108" stroke="#c2410c" stroke-width="2" fill="none"/>

    <!-- Head & Hair -->
    <circle cx="95" cy="80" r="14" fill="#fde047" /> <!-- Face/Skin base or helmet/hair -->
    <path d="M 82 78 C 82 68, 105 66, 108 78 C 102 75, 88 75, 82 78 Z" fill="#1e293b" /> <!-- Stylish hair -->

    <!-- Reaching Arm (Action of picking up - '捡') -->
    <!-- Upper Arm -->
    <path d="M 115 102 Q 130 130, 120 162" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Hand gently picking up the pouch -->
    <circle cx="118" cy="168" r="6" fill="#fde047"/>

    <!-- Sparkles indicating discovery/action -->
    <g transform="translate(125, 150)">
      <path d="M 0 0 L 0 -10 M 0 0 L 0 10 M 0 0 L -10 0 M 0 0 L 10 0 M -7 -7 L 7 7 M -7 7 L 7 -7" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(95, 175) scale(0.6)">
      <path d="M 0 0 L 0 -10 M 0 0 L 0 10 M 0 0 L -10 0 M 0 0 L 10 0 M -7 -7 L 7 7 M -7 7 L 7 -7" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Particles / Dust Floating -->
  <circle cx="50" cy="120" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="70" cy="90" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="190" cy="110" r="2.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="205" cy="140" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="140" cy="70" r="2" fill="#ffffff" opacity="0.3"/>

  <!-- Decorative App Frame Border (Subtle) -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>