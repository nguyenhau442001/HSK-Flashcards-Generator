<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor/Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The Character (Expressing Personality/Gèxìng) -->
  <!-- Legs -->
  <rect x="95" y="160" width="12" height="40" rx="6" fill="#fb923c"/>
  <rect x="133" y="160" width="12" height="40" rx="6" fill="#fb923c"/>
  
  <!-- Jacket -->
  <path d="M80 100 Q120 90 160 100 L155 170 Q120 180 85 170 Z" fill="#ec4899"/>
  
  <!-- Arms (Dynamic pose) -->
  <path d="M80 110 L60 140" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
  <path d="M160 110 L180 130" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="120" cy="90" r="35" fill="#fde68a"/>
  
  <!-- Expressive Hair (The 'Personality' element) -->
  <path d="M90 75 C90 40, 150 40, 150 75 C160 60, 180 80, 160 90 C170 100, 150 110, 140 90" fill="#38bdf8"/>
  
  <!-- Face Details -->
  <circle cx="105" cy="85" r="4" fill="#0f172a"/>
  <circle cx="135" cy="85" r="4" fill="#0f172a"/>
  <path d="M105 105 Q120 115 135 105" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Contextual Props: Spray paint can -->
  <rect x="170" y="170" width="20" height="40" rx="4" fill="#10b981"/>
  <circle cx="180" cy="170" r="8" fill="#fbbf24"/>
  
  <!-- Background Accents: Splatter effect -->
  <circle cx="50" cy="60" r="5" fill="#38bdf8"/>
  <circle cx="200" cy="50" r="8" fill="#ec4899"/>
  <circle cx="40" cy="150" r="6" fill="#fbbf24"/>
</svg>