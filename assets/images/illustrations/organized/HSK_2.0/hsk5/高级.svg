<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Luxury Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Chandelier Light Beam -->
    <linearGradient id="lightBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glass & Surface Gradients -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="marbleTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Velvet Red -->
    <linearGradient id="velvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Luxury Hotel Interior Environment -->
  <!-- Back Wall Panelling & Architrave -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b"/>
  <!-- Wall Trim lines -->
  <rect x="30" y="30" width="180" height="130" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="40" y="40" width="160" height="110" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Large Arched Window showing city night lights -->
  <path d="M 90 40 L 150 40 L 150 110 C 150 135 120 145 120 145 C 120 145 90 135 90 110 Z" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <!-- City Skyline through window -->
  <rect x="95" y="70" width="10" height="50" fill="#1e293b"/>
  <rect x="108" y="60" width="14" height="60" fill="#1e293b"/>
  <rect x="125" y="80" width="8" height="40" fill="#1e293b"/>
  <rect x="136" y="65" width="10" height="55" fill="#1e293b"/>
  <!-- City Lights (Tiny dots) -->
  <circle cx="100" cy="80" r="1" fill="#f59e0b"/>
  <circle cx="112" cy="70" r="1" fill="#38bdf8"/>
  <circle cx="115" cy="90" r="1" fill="#f59e0b"/>
  <circle cx="140" cy="75" r="1" fill="#f59e0b"/>
  <circle cx="128" cy="95" r="1" fill="#38bdf8"/>
  <!-- Window Glass Shimmer -->
  <path d="M 95 50 L 115 40 L 105 80 Z" fill="#ffffff" opacity="0.05"/>

  <!-- Luxury Crystal Chandelier (Top Center) -->
  <path d="M 120 10 L 120 30" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M 105 30 L 135 30" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Chandelier Crystals -->
  <polygon points="120,50 105,30 135,30" fill="url(#lightBeam)"/>
  <circle cx="120" cy="35" r="4" fill="#fef3c7" filter="url(#shadow)"/>
  <circle cx="112" cy="38" r="2" fill="#fef3c7"/>
  <circle cx="128" cy="38" r="2" fill="#fef3c7"/>
  <circle cx="107" cy="32" r="1.5" fill="#fef3c7"/>
  <circle cx="133" cy="32" r="1.5" fill="#fef3c7"/>

  <!-- Ambient Light Cone from Chandelier -->
  <polygon points="120,35 60,170 180,170" fill="url(#lightBeam)" style="mix-blend-mode: screen;"/>

  <!-- Marble Counter / Bar / Concierge Desk -->
  <rect x="10" y="165" width="220" height="60" fill="url(#marbleTop)" filter="url(#shadow)"/>
  <!-- Gold trim on desk -->
  <rect x="10" y="165" width="220" height="4" fill="url(#goldGrad)"/>
  <rect x="20" y="175" width="200" height="40" fill="#1e293b" opacity="0.5"/>
  <!-- Desk reflection/highlight -->
  <rect x="15" y="172" width="210" height="2" fill="#64748b" opacity="0.4"/>

  <!-- EXPRESSIVE CHARACTER: Proud, Welcoming Concierge / Hotel Guest -->
  <!-- Body/Suit (Dark high-end blazer) -->
  <path d="M 60 220 L 75 160 L 95 160 L 100 220 Z" fill="#0f172a"/>
  <path d="M 140 220 L 125 160 L 105 160 L 100 220 Z" fill="#0f172a"/>
  <!-- Crisp White Shirt & Gold Bowtie / Tie -->
  <polygon points="90,160 110,160 100,190" fill="#f8fafc"/>
  <polygon points="95,165 105,165 103,180 97,180" fill="url(#goldGrad)"/>
  <circle cx="100" cy="172" r="2" fill="#78350f"/>

  <!-- Character Neck & Head -->
  <rect x="92" y="135" width="16" height="30" fill="#fed7aa"/>
  <path d="M 85 145 C 85 135 115 135 115 145 L 110 155 L 90 155 Z" fill="#f1f5f9" opacity="0.3"/> <!-- Collar shadow -->

  <!-- Head Base -->
  <ellipse cx="100" cy="120" rx="18" ry="22" fill="#fed7aa" filter="url(#shadow)"/>

  <!-- Stylish Hair (Neat, dark, high-end look) -->
  <path d="M 82 115 C 80 95 120 95 118 115 C 122 105 115 90 100 90 C 85 90 78 105 82 115 Z" fill="#0f172a"/>
  <path d="M 112 102 C 118 105 120 112 118 118 C 115 110 112 105 112 102 Z" fill="#0f172a"/>

  <!-- Confident/Delighted Facial Expression -->
  <!-- Eyebrows (Arched, confident) -->
  <path d="M 88 110 Q 93 107 97 111" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 103 111 Q 107 107 112 110" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Happy, sparkling) -->
  <circle cx="92" cy="116" r="2" fill="#0f172a"/>
  <circle cx="108" cy="116" r="2" fill="#0f172a"/>
  <!-- Eye highlights -->
  <circle cx="93" cy="115" r="0.7" fill="#ffffff"/>
  <circle cx="109" cy="115" r="0.7" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="90" cy="123" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3"/>
  <ellipse cx="110" cy="123" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3"/>

  <!-- Nose (Simple elegant stroke) -->
  <path d="M 100 118 L 98 124 L 101 125" stroke="#d97706" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Confident Warm Smile -->
  <path d="M 93 128 Q 100 134 107 128" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 95 130 Q 100 133 105 130" fill="#f43f5e"/> <!-- Open smiling mouth -->

  <!-- Gesture: Pointing elegantly / Presenting with palm open -->
  <!-- Right Arm (Presenting gesture towards the luxury setting) -->
  <path d="M 130 170 C 150 160 165 140 160 130" stroke="#0f172a" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="160" cy="127" r="6" fill="#fed7aa"/> <!-- Hand -->
  <!-- Cuff -->
  <rect x="154" y="128" width="8" height="5" fill="#f8fafc" rx="1"/>

  <!-- Left Arm (Resting gracefully) -->
  <path d="M 70 170 C 60 180 65 200 70 220" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- PROP 1: Crystal Champagne Glass on the Counter (Signifies High-end/Luxury) -->
  <g transform="translate(180, 160)">
    <!-- Glass Base -->
    <ellipse cx="12" cy="35" rx="8" ry="3" fill="url(#goldGrad)"/>
    <!-- Stem -->
    <line x1="12" y1="20" x2="12" y2="35" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Bowl (Champagne Flute) -->
    <path d="M 6 10 L 18 10 C 18 20 15 22 12 22 C 9 22 6 20 6 10 Z" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1"/>
    <!-- Bubbly Golden Liquid -->
    <path d="M 7 13 L 17 13 C 17 19 14.5 20 12 20 C 9.5 20 7 19 7 13 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Bubbles -->
    <circle cx="11" cy="17" r="0.8" fill="#ffffff"/>
    <circle cx="13" cy="15" r="0.6" fill="#ffffff"/>
    <circle cx="10" cy="12" r="0.5" fill="#ffffff"/>
    <!-- Glass Rim Highlight -->
    <ellipse cx="12" cy="10" rx="6" ry="1.5" fill="none" stroke="#ffffff" stroke-width="0.8"/>
  </g>

  <!-- PROP 2: Luxury Velvet Box / Key Card Holder with Gold Key -->
  <g transform="translate(30, 175)">
    <!-- Velvet Box Base -->
    <polygon points="10,25 35,20 45,35 20,40" fill="url(#velvet)" filter="url(#shadow)"/>
    <!-- Velvet Box Lid (Open) -->
    <polygon points="10,25 35,20 30,5 5,10" fill="#be123c"/>
    <polygon points="12,24 33,19 28,8 7,12" fill="url(#velvet)"/>
    <!-- Satin Lining Inside -->
    <polygon points="13,23 32,18 40,30 21,35" fill="#f43f5e" opacity="0.6"/>
    <!-- Golden Hotel Key resting inside -->
    <path d="M 18 28 L 32 22" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="33" cy="21.5" r="3.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <rect x="17" y="27" width="3" height="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Sparkles / Luxury Star Accents -->
  <g fill="url(#goldGrad)">
    <!-- Sparkle 1 -->
    <path d="M 50 80 Q 50 90 40 90 Q 50 90 50 100 Q 50 90 60 90 Q 50 90 50 80 Z" transform="scale(0.6) translate(30, 30)"/>
    <!-- Sparkle 2 -->
    <path d="M 200 110 Q 200 116 194 116 Q 200 116 200 122 Q 200 116 206 116 Q 200 116 200 110 Z"/>
    <!-- Sparkle 3 (Near Chandelier) -->
    <path d="M 145 45 Q 145 50 140 50 Q 145 50 145 55 Q 145 50 150 50 Q 145 50 145 45 Z" fill="#fef3c7"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Frame Border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
</svg>