<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Wall Texture/Backdrop -->
  <rect x="20" y="20" width="200" height="200" rx="12" fill="#334155" opacity="0.3"/>
  
  <!-- The Painting (The Subject) -->
  <g transform="translate(60, 45)">
    <rect x="-5" y="-5" width="130" height="160" rx="4" fill="#475569"/>
    <rect x="0" y="0" width="120" height="150" rx="2" fill="#f8fafc"/>
    <!-- Landscape inside the painting -->
    <path d="M10 110 Q 40 80, 70 100 T 110 90 L 110 140 L 10 140 Z" fill="#10b981"/>
    <circle cx="90" cy="30" r="15" fill="#fbbf24"/>
    <path d="M20 110 L 40 70 L 60 110 Z" fill="#38bdf8"/>
    <path d="M50 100 L 70 60 L 90 100 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Frame Detail -->
  <rect x="55" y="40" width="130" height="160" rx="4" stroke="#fb923c" stroke-width="6" fill="none"/>
  
  <!-- Hanging Hardware -->
  <path d="M120 40 L 120 25 M 115 25 L 125 25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative Shelf/Prop below -->
  <rect x="40" y="210" width="160" height="8" rx="2" fill="#fb923c"/>
  <circle cx="180" cy="200" r="6" fill="#ec4899"/>
</svg>