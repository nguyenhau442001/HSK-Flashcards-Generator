<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Brain/Mind Concept: A stylized, friendly anatomical representation of a mind-map/thought process -->
  <path d="M120 60 C 90 60, 70 80, 70 110 C 70 140, 90 160, 120 160 C 150 160, 170 140, 170 110 C 170 80, 150 60, 120 60 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Thought Bubbles/Connections -->
  <circle cx="90" cy="90" r="12" fill="#fb923c" opacity="0.8"/>
  <circle cx="150" cy="90" r="15" fill="#f59e0b" opacity="0.8"/>
  <circle cx="120" cy="130" r="10" fill="#10b981" opacity="0.8"/>
  
  <!-- Connecting lines -->
  <path d="M102 90 L 115 100" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <path d="M135 90 L 125 100" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Books representing study -->
  <rect x="40" y="175" width="30" height="40" rx="2" fill="#fbbf24"/>
  <rect x="75" y="185" width="30" height="30" rx="2" fill="#38bdf8"/>
  
  <!-- Glasses -->
  <path d="M140 190 A 15 15 0 0 1 170 190 A 15 15 0 0 1 140 190 Z" fill="none" stroke="#f8fafc" stroke-width="3"/>
  <path d="M170 190 A 15 15 0 0 1 200 190 A 15 15 0 0 1 170 190 Z" fill="none" stroke="#f8fafc" stroke-width="3"/>
  <line x1="155" y1="190" x2="185" y2="190" stroke="#f8fafc" stroke-width="3"/>
  
  <!-- Ambient light glow -->
  <circle cx="120" cy="110" r="80" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
</svg>