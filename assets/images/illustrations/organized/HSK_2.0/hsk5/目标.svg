<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Glows -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Target Bullseye Gradients -->
    <radialGradient id="outerRing" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <radialGradient id="bullseyeRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>

    <radialGradient id="bullseyeGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Dart Vector Gradients -->
    <linearGradient id="dartBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="dartWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Environment Depth) -->
  <!-- Floor Grid / Perspective Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="120" y1="140" x2="0" y2="240" />
    <line x1="120" y1="140" x2="40" y2="240" />
    <line x1="120" y1="140" x2="90" y2="240" />
    <line x1="120" y1="140" x2="150" y2="240" />
    <line x1="120" y1="140" x2="200" y2="240" />
    <line x1="120" y1="140" x2="240" y2="240" />
    <path d="M 30 180 L 210 180" />
    <path d="M 60 210 L 180 210" />
  </g>

  <!-- Ambient Light Cone from Target -->
  <polygon points="120,40 40,240 200,240" fill="url(#beamGrad)" />

  <!-- Wall Mount / Stand for Target -->
  <path d="M 115 130 L 125 130 L 135 240 L 105 240 Z" fill="#334155" opacity="0.8"/>
  <ellipse cx="120" cy="240" rx="25" ry="6" fill="#0f172a"/>

  <!-- TARGET (Mục tiêu) - Main Object -->
  <g transform="translate(120, 95)">
    <!-- Outer Shadow / Glow -->
    <circle cx="0" cy="0" r="76" fill="#0284c7" opacity="0.2" filter="url(#softGlow)"/>

    <!-- Target Body (Outer Dark Ring) -->
    <circle cx="0" cy="0" r="72" fill="url(#outerRing)" stroke="#475569" stroke-width="3"/>

    <!-- White Ring 1 -->
    <circle cx="0" cy="0" r="56" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Red Ring 2 -->
    <circle cx="0" cy="0" r="42" fill="url(#bullseyeRed)"/>

    <!-- White Ring 3 -->
    <circle cx="0" cy="0" r="28" fill="#f8fafc"/>

    <!-- Inner Red Ring 4 -->
    <circle cx="0" cy="0" r="14" fill="url(#bullseyeRed)"/>

    <!-- Center Bullseye (Gold Target Goal) -->
    <circle cx="0" cy="0" r="6" fill="url(#bullseyeGold)" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="2" fill="#fef08a"/>
  </g>

  <!-- DART (Action/Achievement) hitting the bullseye -->
  <!-- Dart Shaft & Tail pointing dynamically into the center (120, 95) -->
  <g>
    <!-- Motion Trail / Sparkles around hit point -->
    <g transform="translate(120, 95)" filter="url(#neonGlow)">
      <circle cx="-15" cy="-15" r="2" fill="#38bdf8"/>
      <circle cx="20" cy="-10" r="1.5" fill="#fbbf24"/>
      <circle cx="-10" cy="18" r="2" fill="#ec4899"/>
      <path d="M -5 -5 L 5 5 M -5 5 L 5 -5" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Dart Vector: Coming from bottom-left towards center (120, 95) -->
    <!-- We angle it along a precise vector -->
    <g transform="translate(60, 160) rotate(-35)">
      <!-- Dart Flight Fins (Back) -->
      <path d="M -25 -6 L -40 -15 L -35 -2 L -25 -2 Z" fill="url(#dartWing)"/>
      <path d="M -25 6 L -40 15 L -35 2 L -25 2 Z" fill="url(#dartWing)"/>
      <path d="M -20 0 L -35 0 L -30 -8 Z" fill="#f43f5e" opacity="0.8"/>

      <!-- Dart Body / Barrel -->
      <rect x="-25" y="-3" width="35" height="6" rx="3" fill="url(#dartBody)" filter="url(#softGlow)"/>
      
      <!-- Grip Rings on Dart -->
      <line x1="-15" y1="-3" x2="-15" y2="3" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="-10" y1="-3" x2="-10" y2="3" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="-5" y1="-3" x2="-5" y2="3" stroke="#0f172a" stroke-width="1.5"/>

      <!-- Metallic Tip -->
      <path d="M 10 -3 L 25 0 L 10 3 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Secondary Context Props (Enhancing the scene storytelling) -->
  <!-- Floating Success Sparkles / Achievement Stars -->
  <g filter="url(#neonGlow)">
    <!-- Star 1 Top Right -->
    <path d="M 190 50 L 193 58 L 201 61 L 193 64 L 190 72 L 187 64 L 179 61 L 187 58 Z" fill="#fbbf24" transform="scale(0.8) translate(40, -10)"/>
    <!-- Star 2 Left -->
    <path d="M 40 90 L 42 95 L 47 97 L 42 99 L 40 104 L 38 99 L 33 97 L 38 95 Z" fill="#38bdf8" transform="scale(0.7) translate(10, 20)"/>
  </g>

  <!-- Small floating strategy/game elements on desk surface -->
  <g transform="translate(0, 10)">
    <!-- Stylized compass or miniature trophy base on the floor -->
    <circle cx="55" cy="195" r="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="55" cy="195" r="10" fill="#0f172a"/>
    <polygon points="55,187 58,195 55,203 52,195" fill="#38bdf8"/>
    <polygon points="55,203 58,195 55,187 58,195" fill="#f43f5e" opacity="0.7"/>

    <!-- Small glowing data chip / achievement badge -->
    <rect x="165" y="185" r="4" width="24" height="18" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
    <circle cx="177" cy="194" r="5" fill="#10b981" filter="url(#softGlow)"/>
    <path d="M 174 194 L 176 196 L 180 192" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Lighting Vignette / Frame Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>