<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Puddle -->
  <ellipse cx="120" cy="200" rx="80" ry="20" fill="#0f172a" opacity="0.6"/>
  
  <!-- Character Legs -->
  <g transform="translate(100, 100)">
    <path d="M20 120 L20 180 M60 120 L60 180" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <!-- Shoe 1 (Stepping over) -->
    <path d="M0 170 L40 170 C45 170 45 180 40 180 L0 180 Z" fill="#f59e0b"/>
    <!-- Shoe 2 (Mid-air) -->
    <path d="M50 110 L90 110 C95 110 95 120 90 120 L50 120 Z" fill="#fb923c"/>
  </g>

  <!-- Falling Object (The mistake/hazard being avoided) -->
  <path d="M180 20 L200 60 L160 60 Z" fill="#ec4899"/>
  <path d="M180 60 L180 100" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Motion Lines -->
  <path d="M170 30 Q160 40 170 50" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M190 30 Q200 40 190 50" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Decorative Background Elements -->
  <circle cx="40" cy="50" r="4" fill="#10b981" opacity="0.5"/>
  <circle cx="200" cy="150" r="6" fill="#fbbf24" opacity="0.3"/>
  <path d="M30 150 L50 150" stroke="#334155" stroke-width="2"/>
</svg>