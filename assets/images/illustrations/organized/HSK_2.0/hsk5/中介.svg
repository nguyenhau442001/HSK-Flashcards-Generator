<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Agent Character (The Intermediary) -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-40" r="25" fill="#fde68a"/>
    <path d="M-15 -35 Q0 -25 15 -35" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="-30" y="-15" width="60" height="50" rx="10" fill="#38bdf8"/>
    <rect x="-35" y="-15" width="70" height="15" rx="5" fill="#0ea5e9"/>
  </g>
  
  <!-- The Property/House Object -->
  <g transform="translate(60, 100)">
    <path d="M0 0 L40 0 L40 30 L0 30 Z" fill="#fb923c"/>
    <path d="M0 0 L20 -20 L40 0 Z" fill="#ec4899"/>
    <rect x="10" y="10" width="10" height="20" fill="#0f172a"/>
  </g>
  
  <!-- The Client Object -->
  <g transform="translate(160, 110)">
    <circle cx="0" cy="0" r="15" fill="#cbd5e1"/>
    <path d="M-10 20 L10 20 L5 50 L-5 50 Z" fill="#94a3b8"/>
  </g>
  
  <!-- Connection/Contract Graphic -->
  <path d="M85 115 Q120 90 155 115" stroke="#10b981" stroke-width="4" stroke-dasharray="6 4" fill="none"/>
  
  <!-- Decorative Elements -->
  <circle cx="30" cy="40" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="200" cy="50" r="8" fill="#f59e0b" opacity="0.4"/>
  <path d="M180 190 L220 190" stroke="#64748b" stroke-width="2"/>
  <path d="M190 200 L210 200" stroke="#64748b" stroke-width="2"/>
</svg>