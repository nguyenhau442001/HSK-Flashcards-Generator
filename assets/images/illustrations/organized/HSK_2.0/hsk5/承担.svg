<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light Glow -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Box/Package Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Character Outfit & Skin Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    
    <!-- Shield/Responsibility Aura -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="110" r="100" fill="url(#spotlight)"/>

  <!-- Background Environment (Office/Workshop elements) -->
  <g opacity="0.4">
    <!-- Bookshelf / Utility Rack -->
    <rect x="25" y="60" width="30" height="110" rx="4" fill="#334155"/>
    <rect x="30" y="80" width="20" height="6" fill="#475569"/>
    <rect x="30" y="110" width="20" height="6" fill="#475569"/>
    <rect x="30" y="140" width="20" height="6" fill="#475569"/>
    
    <!-- Floor Line & Wall Corner -->
    <path d="M 0 175 L 240 175" stroke="#334155" stroke-width="2"/>
    <path d="M 190 175 L 190 90 L 220 70" stroke="#334155" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Responsibility Aura / Dynamic Shield (Representing 'taking charge') -->
  <path d="M 120 45 C 160 45 190 65 190 100 C 190 150 140 185 120 195 C 100 185 50 150 50 100 C 50 65 80 45 120 45 Z" fill="url(#shieldGrad)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Character Back-Layer (Legs & Torso) -->
  <g id="character">
    <!-- Legs / Shoes -->
    <rect x="100" y="150" width="14" height="30" rx="7" fill="url(#pantsGrad)"/>
    <rect x="126" y="150" width="14" height="30" rx="7" fill="url(#pantsGrad)"/>
    <ellipse cx="106" cy="180" rx="9" ry="5" fill="#0f172a"/>
    <ellipse cx="134" cy="180" rx="9" ry="5" fill="#0f172a"/>

    <!-- Torso (Leaning forward, carrying weight) -->
    <path d="M 98 105 L 142 105 L 145 150 L 95 150 Z" fill="url(#shirtGrad)" rx="6"/>

    <!-- Head -->
    <circle cx="120" cy="82" r="18" fill="url(#skinGrad)"/>
    <!-- Hair -->
    <path d="M 102 82 C 102 68 110 64 120 64 C 130 64 138 68 138 82 C 138 85 136 84 136 80 C 136 70 130 67 120 67 C 110 67 104 70 104 80 C 104 84 102 85 102 82 Z" fill="#334155"/>
    <!-- Face Expressions (Determined / Focused) -->
    <circle cx="114" cy="80" r="2" fill="#1e293b"/>
    <circle cx="126" cy="80" r="2" fill="#1e293b"/>
    <path d="M 118 88 Q 120 91 122 88" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Determined Eyebrows -->
    <path d="M 111 76 L 117 78" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 129 76 L 123 78" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms Supporting Heavily from Bottom/Sides -->
    <!-- Left Arm -->
    <path d="M 98 115 Q 85 125 95 145" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="95" cy="145" r="5" fill="url(#skinGrad)"/>

    <!-- Right Arm -->
    <path d="M 142 115 Q 155 125 145 145" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="145" cy="145" r="5" fill="url(#skinGrad)"/>
  </g>

  <!-- Heavy Package / Object Representing 'Responsibility / Burden' -->
  <g id="heavy-package" transform="translate(0, -5)">
    <!-- Main Box Body (Isometric-ish 2D projection) -->
    <!-- Front Face -->
    <polygon points="80,110 160,110 160,155 80,155" fill="url(#boxFront)"/>
    <!-- Top Face -->
    <polygon points="80,110 105,90 185,90 160,110" fill="url(#boxTop)"/>
    <!-- Side Face -->
    <polygon points="160,110 185,90 185,135 160,155" fill="url(#boxSide)"/>

    <!-- Box Tape & Details (Cross straps for secure handling) -->
    <!-- Front Vertical Tape -->
    <polygon points="115,110 125,110 125,155 115,155" fill="#fef3c7" opacity="0.8"/>
    <!-- Top Diagonal Tape -->
    <polygon points="115,110 125,110 140,90 130,90" fill="#fef3c7" opacity="0.8"/>

    <!-- Handling Warning Icon / Visual Graphic on Box (Abstract symbol, non-text) -->
    <circle cx="120" cy="132.5" r="9" fill="#ea580c"/>
    <path d="M 116 132.5 L 124 132.5 M 120 128.5 L 120 136.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Action Effect Lines / Weight Stress Indicators -->
  <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="70" y1="130" x2="60" y2="135"/>
    <line x1="170" y1="130" x2="180" y2="135"/>
    <line x1="120" y1="35" x2="120" y2="25"/>
  </g>

  <!-- Foreground Floor Shadow -->
  <ellipse cx="120" cy="178" rx="45" ry="8" fill="#020617" opacity="0.5"/>

  <!-- Floating Sparkles / Success & Effort Accents -->
  <g fill="#34d399">
    <circle cx="85" cy="75" r="3" opacity="0.7"/>
    <circle cx="155" cy="65" r="4" opacity="0.9"/>
    <circle cx="170" cy="100" r="2" opacity="0.5"/>
    <circle cx="70" cy="105" r="2.5" opacity="0.6"/>
  </g>
  <g fill="#f59e0b">
    <polygon points="135,45 137,50 142,52 137,54 135,59 133,54 128,52 133,50" opacity="0.8"/>
    <polygon points="95,55 96,58 99,59 96,60 95,63 94,60 91,59 94,58" opacity="0.7"/>
  </g>
</svg>