<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="40" rx="4" fill="#334155"/>
  
  <!-- The "Decision" Scene: A coin flip in mid-air -->
  <!-- Hand -->
  <path d="M70 160 L90 160 L95 130 L65 130 Z" fill="#fb923c"/>
  <circle cx="80" cy="120" r="15" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <path d="M72 115 L88 125 M88 115 L72 125" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Question Mark implied by path of coin -->
  <path d="M110 100 Q140 80 140 120 T140 140" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
  
  <!-- Background Elements: A clock and a calendar suggesting uncertainty -->
  <circle cx="180" cy="60" r="30" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <line x1="180" y1="60" x2="180" y2="40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="60" x2="200" y2="60" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <rect x="30" y="40" width="40" height="50" rx="4" fill="#334155"/>
  <rect x="35" y="55" width="30" height="30" rx="2" fill="#1e293b"/>
  <path d="M30 50 H70 M40 40 V50 M60 40 V50" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Atmospheric accents -->
  <circle cx="200" cy="180" r="3" fill="#10b981"/>
  <circle cx="150" cy="190" r="2" fill="#ec4899"/>
  <circle cx="40" cy="150" r="4" fill="#38bdf8"/>
</svg>