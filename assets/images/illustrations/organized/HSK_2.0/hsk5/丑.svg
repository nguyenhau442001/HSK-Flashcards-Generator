<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mirror Frame Gradient -->
    <linearGradient id="mirrorFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Mirror Glass Gradient (Warped Reflection) -->
    <linearGradient id="mirrorGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Wallpaper / Room Details -->
  <g opacity="0.1">
    <path d="M0 60 H240 M0 120 H240 M0 180 H240" stroke="#94a3b8" stroke-width="1"/>
    <path d="M60 0 V240 M120 0 V240 M180 0 V240" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="190" width="240" height="50" fill="url(#floorGrad)"/>
  <ellipse cx="120" cy="195" rx="70" ry="15" fill="#020617" opacity="0.6"/>

  <!-- Dressing Table / Shelf -->
  <rect x="70" y="185" width="100" height="12" rx="4" fill="#334155" filter="url(#shadow)"/>
  <path d="M80 197 L85 220 H95 L90 197 Z" fill="#1e293b"/>
  <path d="M160 197 L155 220 H145 L150 197 Z" fill="#1e293b"/>

  <!-- Vanity Mirror -->
  <g filter="url(#shadow)">
    <!-- Stand -->
    <path d="M120 160 V185" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="120" cy="186" rx="20" ry="6" fill="#b45309"/>

    <!-- Mirror Outer Frame (Oval) -->
    <ellipse cx="120" cy="95" rx="55" ry="65" fill="url(#mirrorFrame)"/>
    <!-- Mirror Inner Glass -->
    <ellipse cx="120" cy="95" rx="47" ry="57" fill="url(#mirrorGlass)"/>

    <!-- Mirror Glass Sheen (Distorted/Warped effect) -->
    <path d="M90 60 Q 110 80 95 120 Q 90 90 90 60 Z" fill="#ffffff" opacity="0.15"/>
    <!-- Cute little reflection highlight -->
    <path d="M145 70 Q 155 85 140 100" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>

  <!-- Tabletop Props (Comb, Jar, Makeup items) -->
  <!-- Jar -->
  <rect x="85" y="170" width="12" height="15" rx="3" fill="#38bdf8"/>
  <rect x="87" y="167" width="8" height="4" rx="1" fill="#bae6fd"/>
  <!-- Comb -->
  <path d="M140 180 H155 V183 H140 Z" fill="#ec4899"/>
  <path d="M142 176 V180 M146 176 V180 M150 176 V180 M154 176 V180" stroke="#ec4899" stroke-width="1.5"/>

  <!-- MAIN CHARACTER (Unhappy / Feeling Ugly) -->
  <g filter="url(#shadow)">
    <!-- Character Body / Hoodie -->
    <path d="M85 220 C85 185 95 165 120 165 C145 165 155 185 155 220 Z" fill="#6366f1"/>
    <!-- Hoodie Hood folds -->
    <path d="M90 175 Q120 190 150 175" stroke="#4f46e5" stroke-width="4" fill="none"/>
    <path d="M95 170 Q120 160 145 170" fill="#4f46e5"/>
    <!-- Hoodie Strings -->
    <path d="M105 185 Q108 200 105 210" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M135 185 Q132 200 135 210" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Character Neck -->
    <path d="M110 150 H130 V168 H110 Z" fill="#ffdbac"/>

    <!-- Character Head (Chubby, slightly slumped) -->
    <circle cx="120" cy="125" r="32" fill="#ffdbac"/>

    <!-- Ears -->
    <circle cx="88" cy="128" r="5" fill="#f5c093"/>
    <circle cx="152" cy="128" r="5" fill="#f5c093"/>

    <!-- Messy Hair / Cowlick (Emphasizing the "bad look" / awkward morning vibe) -->
    <path d="M88 115 C85 95 105 90 115 95 C120 80 140 85 145 100 C155 95 162 110 155 120 C155 105 140 105 135 110 C125 95 105 100 100 112 Z" fill="#475569"/>
    <!-- Stray dramatic hair strand sticking out -->
    <path d="M125 93 Q 135 75 145 78" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Expression: Self-conscious, sad, cringe, feeling "chǒu" (ugly/awkward) -->
    <!-- Blushing / Uneasy Cheeks -->
    <ellipse cx="102" cy="133" rx="6" ry="3" fill="#f43f5e" opacity="0.3"/>
    <ellipse cx="138" cy="133" rx="6" ry="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Sweat Drop (Classic anime trope for awkwardness/stress) -->
    <path d="M142 105 C142 105 148 113 148 117 C148 120 145 122 142 122 C139 122 136 120 136 117 C136 113 142 105 142 105 Z" fill="#38bdf8" opacity="0.8"/>

    <!-- Eyebrows (Slanted inward, miserable) -->
    <path d="M98 115 L112 120" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M142 115 L128 120" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (Squinted, looking critically at mirror reflection) -->
    <path d="M100 123 Q106 127 112 123" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M128 123 Q134 127 140 123" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Under-eye bags (tired/ugly look) -->
    <path d="M102 128 Q106 131 110 128" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <path d="M130 128 Q134 131 138 128" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>

    <!-- Nose (Simple cute dot/line) -->
    <path d="M120 130 L118 135 H122" stroke="#d9a066" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Mouth (Wobbly, downturned frown) -->
    <path d="M110 144 Q120 137 130 144" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Hands clutching cheeks in despair -->
    <!-- Left Hand -->
    <path d="M90 150 C85 140 95 130 102 138 C105 142 102 148 97 150 Z" fill="#ffdbac"/>
    <path d="M92 140 C88 138 88 144 92 145" stroke="#d9a066" stroke-width="1" fill="none"/>
    <!-- Right Hand -->
    <path d="M150 150 C155 140 145 130 138 138 C135 142 138 148 143 150 Z" fill="#ffdbac"/>
    <path d="M148 140 C152 138 152 144 148 145" stroke="#d9a066" stroke-width="1" fill="none"/>
  </g>

  <!-- Atmospheric Lighting / Moody Ambient Glow -->
  <radialGradient id="moodGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
  </radialGradient>
  <rect width="240" height="240" fill="url(#moodGlow)" pointer-events="none"/>
</svg>