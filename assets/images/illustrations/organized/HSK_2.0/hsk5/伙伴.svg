<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm campfire glow -->
    <radialGradient id="campGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradients (Explorer) -->
    <linearGradient id="backpackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="jacket1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Gradients (Companion) -->
    <linearGradient id="jacket2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Fire Gradients -->
    <linearGradient id="fireOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="fireInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Tent Gradient -->
    <linearGradient id="tentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="tentDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Stars & Hills) -->
  <g fill="#475569" opacity="0.4">
    <circle cx="30" cy="40" r="1.5"/>
    <circle cx="85" cy="25" r="1"/>
    <circle cx="140" cy="50" r="1.5"/>
    <circle cx="195" cy="30" r="2"/>
    <circle cx="215" cy="70" r="1"/>
    <circle cx="55" cy="75" r="1.2"/>
  </g>

  <!-- Distant Mountains -->
  <path d="M-10 170 L50 110 L110 160 L180 100 L250 160 L250 200 L-10 200 Z" fill="#0f172a"/>
  <path d="M20 180 L80 130 L130 170 L190 125 L260 170 L260 210 L-10 210 Z" fill="#1e293b" opacity="0.7"/>

  <!-- Campfire Ground Glow -->
  <circle cx="120" cy="180" r="70" fill="url(#campGlow)"/>

  <!-- TENT (Background Context) -->
  <g transform="translate(165, 120)">
    <!-- Back triangle shadow -->
    <polygon points="40,50 75,70 10,75" fill="#831843" opacity="0.5"/>
    <!-- Tent body right -->
    <polygon points="40,15 75,70 40,75" fill="url(#tentDark)"/>
    <!-- Tent body left -->
    <polygon points="40,15 5,75 40,75" fill="url(#tentGrad)"/>
    <!-- Tent opening / dark interior -->
    <path d="M40,45 L50,75 L30,75 Z" fill="#4c0519"/>
    <!-- Tent pegs/stakes details -->
    <line x1="5" y1="75" x2="-2" y2="80" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="75" y1="70" x2="82" y2="78" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- CAMPFIRE -->
  <g transform="translate(120, 175)">
    <!-- Logs -->
    <rect x="-14" y="2" width="28" height="6" rx="3" fill="#78350f" transform="rotate(10)"/>
    <rect x="-12" y="3" width="24" height="5" rx="2" fill="#92400e" transform="rotate(-15)"/>
    <!-- Fire glow center -->
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="#fef08a"/>
    <!-- Outer flame -->
    <path d="M0 -18 C 6 -10, 10 -4, 8 4 C 6 10, 2 12, 0 14 C -2 12, -6 10, -8 4 C -10 -4, -6 -10, 0 -18 Z" fill="url(#fireOuter)"/>
    <!-- Inner flame -->
    <path d="M0 -11 C 3 -6, 5 -2, 4 3 C 3 7, 1 8, 0 9 C -1 8, -3 7, -4 3 C -5 -2, -3 -6, 0 -11 Z" fill="url(#fireInner)"/>
    <!-- Sparks -->
    <circle cx="-3" cy="-22" r="1" fill="#fef08a"/>
    <circle cx="5" cy="-26" r="1.5" fill="#fbbf24"/>
    <circle cx="2" cy="-32" r="0.8" fill="#fef08a"/>
  </g>

  <!-- FOREGROUND GROUND -->
  <path d="M-10 180 Q 120 170 250 180 L 250 250 L -10 250 Z" fill="#090d16"/>
  <!-- Grass tufts -->
  <g stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M25 183 L22 176 M26 183 L28 177"/>
    <path d="M85 181 L82 174 M86 181 L89 175"/>
    <path d="M180 184 L177 178 M181 184 L184 177"/>
    <path d="M210 182 L208 175 M211 182 L214 176"/>
  </g>

  <!-- COMPANION 1: Explorer sitting (Left) -->
  <g transform="translate(75, 145)">
    <!-- Shadow -->
    <ellipse cx="5" cy="38" rx="22" ry="6" fill="#020617" opacity="0.5"/>
    
    <!-- Backpack beside/behind -->
    <path d="M-18 10 C -22 10, -25 15, -25 22 L -25 35 C -25 38, -22 40, -18 40 L -12 40 C -8 40, -5 38, -5 35 L -5 22 C -5 15, -8 10, -12 10 Z" fill="url(#backpackGrad)"/>
    <path d="M-22 16 L -8 16" stroke="#ea580c" stroke-width="2"/>
    <circle cx="-15" cy="25" r="2" fill="#fef08a"/>

    <!-- Body & Jacket -->
    <path d="M-8 12 Q -12 25 -10 35 L 12 35 Q 15 25 10 12 Z" fill="url(#jacket1Grad)"/>
    
    <!-- Collar / Scarf -->
    <path d="M-7 12 Q 0 16 7 12 L 8 16 Q 0 20 -8 16 Z" fill="#fbbf24"/>

    <!-- Head -->
    <circle cx="1" cy="0" r="11" fill="#fde68a"/>
    <!-- Hair (Beanie) -->
    <path d="M-10 -2 C -10 -9, -5 -11, 1 -11 C 7 -11, 12 -9, 12 -2 C 12 1, 10 3, 1 3 C -8 3, -10 1, -10 -2 Z" fill="#f97316"/>
    <circle cx="1" cy="-12" r="3" fill="#fbbf24"/> <!-- Pom pom -->

    <!-- Face Profile (Looking right towards partner and fire) -->
    <circle cx="6" cy="-1" r="1.5" fill="#1e293b"/> <!-- Eye -->
    <path d="M 9 3 Q 11 4 10 5" stroke="#d97706" stroke-width="1" fill="none" stroke-linecap="round"/> <!-- Smile -->
    <circle cx="9" cy="1" r="1.5" fill="#f43f5e" opacity="0.5"/> <!-- Blush -->

    <!-- Arms -->
    <!-- Left arm resting on knee -->
    <path d="M-6 16 Q -12 22 -18 30" stroke="#0284c7" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="-19" cy="31" r="3" fill="#fde68a"/> <!-- Hand -->

    <!-- Right arm pointing / gesturing warmly toward companion -->
    <path d="M7 16 Q 16 18 22 12" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="23" cy="11" r="2.5" fill="#fde68a"/> <!-- Hand -->

    <!-- Legs (Sitting posture) -->
    <path d="M-8 33 Q -15 36 -22 36" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M8 33 Q 16 35 20 33" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- COMPANION 2: Friend sitting (Right) -->
  <g transform="translate(138, 145)">
    <!-- Shadow -->
    <ellipse cx="-2" cy="38" rx="22" ry="6" fill="#020617" opacity="0.5"/>

    <!-- Body & Jacket -->
    <path d="M-10 12 Q -12 25 -8 35 L 14 35 Q 16 25 12 12 Z" fill="url(#jacket2Grad)"/>

    <!-- Collar / Scarf -->
    <path d="M-8 12 Q 2 16 10 12 L 9 17 Q 2 21 -9 16 Z" fill="#38bdf8"/>

    <!-- Head (Slight tilt) -->
    <circle cx="0" cy="-1" r="11" fill="#fde68a"/>
    <!-- Hair (Bun/Curly style) -->
    <path d="M-9 -2 C -9 -10, 0 -12, 8 -9 C 11 -7, 11 -3, 9 0 C 8 2, -7 3, -9 -2 Z" fill="#451a03"/>
    <circle cx="5" cy="-12" r="4" fill="#451a03"/> <!-- Hair bun -->

    <!-- Face Profile (Looking left towards companion and fire) -->
    <circle cx="-4" cy="-1" r="1.5" fill="#1e293b"/> <!-- Eye -->
    <path d="M -7 3 Q -9 4 -8 5" stroke="#b45309" stroke-width="1" fill="none" stroke-linecap="round"/> <!-- Smile -->
    <circle cx="-7" cy="1" r="1.5" fill="#f43f5e" opacity="0.5"/> <!-- Blush -->

    <!-- Arms -->
    <!-- Left arm holding mug/gesture -->
    <path d="M-6 16 Q -14 18 -18 14" stroke="#047857" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="-19" cy="13" r="2.5" fill="#fde68a"/> <!-- Hand -->
    <!-- Mug -->
    <rect x="-24" y="10" width="6" height="7" rx="1" fill="#f8fafc"/>
    <path d="M-24 12 C -27 12, -27 15, -24 15" stroke="#f8fafc" stroke-width="1.5" fill="none"/>

    <!-- Right arm resting -->
    <path d="M8 16 Q 14 22 18 30" stroke="#047857" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="19" cy="31" r="3" fill="#fde68a"/> <!-- Hand -->

    <!-- Legs (Sitting posture) -->
    <path d="M-8 33 Q -15 36 -19 33" stroke="#0f172a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M8 33 Q 16 36 22 35" stroke="#0f172a" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- FOREGROUND PROPS (Backpack & Map/Compass for adventurous companionship vibe) -->
  <g transform="translate(50, 185)">
    <!-- Rolled sleeping mat -->
    <rect x="0" y="0" width="22" height="10" rx="4" fill="#64748b" transform="rotate(-15)"/>
    <rect x="5" y="2" width="3" height="10" rx="1" fill="#cbd5e1" transform="rotate(-15)"/>
    <rect x="14" y="0" width="3" height="10" rx="1" fill="#cbd5e1" transform="rotate(-15)"/>
  </g>

  <!-- Hanging lantern from a small stick near tent -->
  <g transform="translate(155, 130)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#64748b" stroke-width="2"/>
    <path d="M-4 18 L4 18 L3 26 L-3 26 Z" fill="#334155"/>
    <rect x="-3" y="20" width="6" height="5" rx="1" fill="#fef08a" opacity="0.9"/>
    <path d="M0 26 L0 30" stroke="#334155" stroke-width="1.5"/>
    <!-- Lantern glow -->
    <circle cx="0" cy="22" r="14" fill="#fbbf24" opacity="0.25" style="mix-blend-mode: screen;"/>
  </g>

  <!-- Floating Warm Sparks/Embers across scene -->
  <g fill="#f59e0b" opacity="0.8">
    <circle cx="100" cy="140" r="1.5"/>
    <circle cx="110" cy="120" r="1"/>
    <circle cx="130" cy="125" r="2"/>
    <circle cx="145" cy="135" r="1.2"/>
    <circle cx="90" cy="155" r="0.8"/>
  </g>

</svg>