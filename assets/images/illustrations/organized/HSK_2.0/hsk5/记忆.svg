<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Glowing Memory Orb Gradient -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Floating Photo Frame Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Light Cone -->
  <polygon points="50,240 190,240 160,80 80,80" fill="url(#lightBeam)"/>

  <!-- Background Ambient Stars / Memory Specks -->
  <g fill="#38bdf8" opacity="0.4">
    <circle cx="45" cy="50" r="1.5"/>
    <circle cx="195" cy="70" r="2"/>
    <circle cx="210" cy="140" r="1"/>
    <circle cx="30" cy="160" r="1.5"/>
    <circle cx="100" cy="35" r="1"/>
  </g>
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="70" cy="70" r="1.5"/>
    <circle cx="170" cy="45" r="2"/>
    <circle cx="25" cy="100" r="1"/>
  </g>

  <!-- Wooden Shelf / Surface at bottom -->
  <path d="M 12 210 L 228 210 L 220 226 L 20 226 Z" fill="#334155"/>
  <rect x="12" y="206" width="216" height="6" rx="2" fill="#475569"/>
  <rect x="20" y="226" width="200" height="3" fill="#1e293b" opacity="0.5"/>

  <!-- Side Prop: Vintage Clock / Hourglass element representing time & memory -->
  <g transform="translate(38, 160)">
    <circle cx="0" cy="20" r="16" fill="#1e293b" stroke="#64748b" stroke-width="2.5"/>
    <path d="M 0 10 L 0 20 L 7 24" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M -12 2 L 12 2" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Little legs -->
    <path d="M -8 34 L -12 40" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 8 34 L 12 40" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Side Prop: Stack of vintage storybooks -->
  <g transform="translate(180, 175)">
    <!-- Bottom book -->
    <rect x="-22" y="16" width="44" height="12" rx="2" fill="#0284c7"/>
    <rect x="-20" y="16" width="40" height="3" fill="#38bdf8" opacity="0.5"/>
    <!-- Middle book -->
    <rect x="-26" y="6" width="52" height="11" rx="2" fill="#10b981"/>
    <rect x="-24" y="6" width="48" height="3" fill="#34d399" opacity="0.5"/>
    <!-- Top book -->
    <rect x="-20" y="-3" width="42" height="10" rx="2" fill="#f43f5e"/>
    <rect x="-18" y="-3" width="38" height="2" fill="#fb7185" opacity="0.5"/>
    <!-- Bookmark ribbon hanging -->
    <path d="M 12 7 L 16 19 L 14 20 L 10 19 Z" fill="#fbbf24"/>
  </g>

  <!-- CENTRAL OBJECT: Glowing Memory Album / Scrapbook (Open) -->
  <g transform="translate(120, 140)" filter="url(#shadow)">
    <!-- Open Book Base/Cover (Leather/Dark Blue) -->
    <path d="M -60 20 C -60 10 -30 0 0 10 C 30 0 60 10 60 20 L 60 60 C 60 70 30 65 0 70 C -30 65 -60 70 -60 60 Z" fill="#0f172a"/>
    <path d="M -58 23 C -58 15 -28 5 0 14 C 28 5 58 15 58 23 L 58 57 C 58 65 28 61 0 65 C -28 61 -58 65 -58 57 Z" fill="#3b82f6"/>
    
    <!-- Pages Left -->
    <path d="M -56 25 C -56 18 -26 9 0 16 L 0 62 C -26 58 -56 62 -56 55 Z" fill="#f8fafc"/>
    <!-- Pages Right -->
    <path d="M 56 25 C 56 18 26 9 0 16 L 0 62 C 26 58 56 62 56 55 Z" fill="#f1f5f9"/>

    <!-- Spine -->
    <path d="M 0 16 L 0 62" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Left Page Photo (Mini landscape inside memory) -->
    <rect x="-46" y="24" width="38" height="28" rx="2" fill="#e2e8f0"/>
    <path d="M -42 46 L -32 34 L -24 42 L -16 30 L -12 46 Z" fill="#10b981"/>
    <circle cx="-35" cy="32" r="4" fill="#fbbf24"/>

    <!-- Right Page Photo (Mini landscape / sunset) -->
    <rect x="8" y="24" width="38" height="28" rx="2" fill="#e2e8f0"/>
    <circle cx="27" cy="34" r="6" fill="#f43f5e"/>
    <path d="M 12 46 Q 20 38 28 46 Q 36 40 42 46 Z" fill="#38bdf8"/>

    <!-- Little decorative heart doodle on page -->
    <path d="M -26 54 C -28 52 -31 53 -31 55 C -31 57 -28 59 -26 60 C -24 59 -21 57 -21 55 C -21 53 -24 52 -26 54 Z" fill="#f43f5e" opacity="0.8"/>
  </g>

  <!-- MAGICAL MEMORY ORB FLOATERS & SPARKLES EMITTING FROM THE ALBUM -->
  <!-- Central Big Glowing Memory Core -->
  <circle cx="120" cy="85" r="26" fill="url(#orbGlow)"/>
  <circle cx="120" cy="85" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="120" cy="85" r="6" fill="#fbbf24"/>

  <!-- Floating Glowing Memory Photos/Bubbles -->
  <!-- Left floating memory bubble -->
  <g transform="translate(75, 75)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Mini drawing inside bubble: Glowing star/sun over landscape -->
    <circle cx="0" cy="-2" r="6" fill="#fbbf24"/>
    <path d="M -10 8 Q 0 0 10 8" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right floating memory bubble -->
  <g transform="translate(165, 70)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <!-- Mini drawing: Happy silhouette / heart -->
    <path d="M 0 -3 C -5 -8 -11 -3 -6 3 C 0 8 0 8 0 8 C 0 8 0 8 6 3 C 11 -3 5 -8 0 -3 Z" fill="#f43f5e"/>
  </g>

  <!-- Small top memory spark -->
  <g transform="translate(120, 38)">
    <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M 0 -5 L 0 5 M -5 0 L 5 0" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Stars (Animated/Static 2D vectors) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 95 55 Q 95 62 102 62 Q 95 62 95 69 Q 95 62 88 62 Q 95 62 95 55 Z"/>
    <!-- Star 2 -->
    <path d="M 148 48 Q 148 53 153 53 Q 148 53 148 58 Q 148 53 143 53 Q 148 53 148 48 Z"/>
    <!-- Star 3 -->
    <path d="M 140 105 Q 140 108 143 108 Q 140 108 140 111 Q 140 108 137 108 Q 140 108 140 105 Z" fill="#38bdf8"/>
    <!-- Star 4 -->
    <path d="M 98 100 Q 98 103 101 103 Q 98 103 98 106 Q 98 103 95 103 Q 98 103 98 100 Z" fill="#ec4899"/>
  </g>

  <!-- Magical connection lines (Swirling memory trails) -->
  <path d="M 105 110 Q 90 95 85 85" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 135 110 Q 150 90 155 78" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 120 114 L 120 95" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

</svg>