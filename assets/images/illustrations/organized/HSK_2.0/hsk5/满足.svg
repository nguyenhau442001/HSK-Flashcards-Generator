<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Glow for Contentment/Satisfaction -->
    <radialGradient id="warmGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <!-- Ramen Bowl Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    
    <!-- Soup Gradient -->
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Window/Night City Glow -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Ambient Golden Glow (Sense of Satisfaction) -->
  <circle cx="120" cy="110" r="100" fill="url(#warmGlow)" />

  <!-- Background Environment: Cozy Ramen Shop Interior -->
  <!-- Back Wall -->
  <rect x="20" y="25" width="200" height="135" fill="#1e293b" />
  
  <!-- Window with Night City Vibe -->
  <path d="M 160 35 L 200 35 L 200 95 L 160 95 Z" fill="url(#windowGrad)" stroke="#334155" stroke-width="2" rx="4"/>
  <!-- City Lights outside window -->
  <circle cx="170" cy="50" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="185" cy="45" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="190" cy="70" r="1.5" fill="#f43f5e" opacity="0.8" />
  <circle cx="175" cy="80" r="2" fill="#10b981" opacity="0.8" />

  <!-- Wall Shelf with Prop -->
  <rect x="40" y="55" width="50" height="4" rx="2" fill="#475569" />
  <!-- Small tea pot on shelf -->
  <path d="M 55 55 Q 53 47 58 45 L 67 45 Q 72 47 70 55 Z" fill="#38bdf8" />
  <path d="M 68 47 Q 75 46 73 51" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Warm Hanging Lantern -->
  <path d="M 50 25 L 50 35" stroke="#64748b" stroke-width="2" />
  <ellipse cx="50" cy="45" rx="12" ry="10" fill="#f59e0b" filter="url(#softShadow)" />
  <ellipse cx="50" cy="45" rx="12" ry="10" fill="none" stroke="#fbbf24" stroke-width="1.5" />
  <path d="M 44 40 Q 50 38 56 40" stroke="#d97706" stroke-width="1.5" fill="none" />
  <path d="M 44 50 Q 50 52 56 50" stroke="#d97706" stroke-width="1.5" fill="none" />

  <!-- Wooden Table Surface -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#tableGrad)" />
  <rect x="0" y="160" width="240" height="6" fill="#9a3412" opacity="0.6" />

  <!-- Character: Satisfied Youth -->
  <!-- Chair Back -->
  <path d="M 85 105 L 155 105 L 150 160 L 90 160 Z" fill="#334155" rx="8" />
  
  <!-- Torso & Hoodie (Teal/Cyan modern look) -->
  <path d="M 80 180 C 80 145 95 130 120 130 C 145 130 160 145 160 180 Z" fill="#0d9488" filter="url(#softShadow)" />
  <!-- Hoodie Strings & Details -->
  <path d="M 110 135 Q 120 150 115 165" stroke="#5eead4" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 130 135 Q 120 150 125 165" stroke="#5eead4" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <circle cx="120" cy="140" r="6" fill="#115e59" />

  <!-- Neck -->
  <rect x="110" y="118" width="20" height="20" fill="url(#skinGrad)" />

  <!-- Head -->
  <circle cx="120" cy="100" r="30" fill="url(#skinGrad)" filter="url(#softShadow)" />

  <!-- Hair (Dark, stylish modern cut) -->
  <path d="M 91 95 C 90 75 105 68 120 68 C 138 68 150 78 150 98 C 150 102 148 105 148 105 C 148 105 142 82 122 80 C 102 78 95 95 91 95 Z" fill="#0f172a" />
  <path d="M 94 93 Q 102 75 120 73 Q 140 76 147 93 Q 135 70 120 70 Q 102 70 94 93 Z" fill="#334155" />

  <!-- Facial Expression: Blissful / Ultimate Satisfaction (满足) -->
  <!-- Closed Happy Eyes (Arcs upward) -->
  <path d="M 103 98 Q 109 92 115 98" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 125 98 Q 131 92 137 98" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Rosy Cheeks (Blush of satisfaction) -->
  <ellipse cx="102" cy="106" rx="5" ry="3" fill="#f43f5e" opacity="0.4" />
  <ellipse cx="138" cy="106" rx="5" ry="3" fill="#f43f5e" opacity="0.4" />

  <!-- Big Contented Smile -->
  <path d="M 110 110 Q 120 120 130 110" stroke="#1e293b" stroke-width="3" fill="#fda4af" stroke-linecap="round" />
  <!-- Happy tongue detail -->
  <path d="M 115 114 Q 120 119 125 114" fill="#e11d48" />

  <!-- Satisfied Action Elements / Floating Bliss Effects -->
  <g opacity="0.9">
    <!-- Little heart / stars floating up indicating delight -->
    <path d="M 165 75 Q 165 68 172 68 Q 179 68 179 75 Q 179 83 172 88 Q 165 83 165 75 Z" fill="#ec4899" transform="scale(0.8) translate(40, 10)" />
    <path d="M 70 85 Q 70 80 75 80 Q 80 80 80 85 Q 80 90 75 94 Q 70 90 70 85 Z" fill="#fbbf24" transform="scale(0.6) translate(30, -10)" />
    <!-- Sparkles -->
    <path d="M 150 55 L 153 62 L 60 62 Z" fill="none" /> <!-- placeholder to keep clean -->
    <polygon points="175,45 178,52 185,55 178,58 175,65 172,58 165,55 172,52" fill="#fbbf24" opacity="0.8"/>
    <polygon points="75,65 77,70 82,72 77,74 75,79 73,74 68,72 73,70" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground: Large Delicious Ramen Bowl (The source of satisfaction) -->
  <!-- Bowl Base Shadow -->
  <ellipse cx="120" cy="205" rx="45" ry="10" fill="#000000" opacity="0.5" />
  
  <!-- Bowl Outer Body -->
  <path d="M 75 180 Q 75 210 120 210 Q 165 210 165 180 Z" fill="url(#bowlGrad)" filter="url(#softShadow)" />
  <!-- Bowl Rim -->
  <ellipse cx="120" cy="180" rx="45" ry="12" fill="#fb7185" />
  <!-- Bowl Inner Broth -->
  <ellipse cx="120" cy="181" rx="41" ry="9" fill="url(#soupGrad)" />

  <!-- Ramen Toppings (Delicious details) -->
  <!-- Noodles peek -->
  <path d="M 95 180 Q 105 184 115 179 Q 125 184 135 179 Q 145 184 150 180" stroke="#fef08a" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 100 182 Q 110 186 120 181 Q 130 186 140 181" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Chashu Pork Slice -->
  <path d="M 90 176 Q 110 172 125 178 Q 120 188 95 186 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5" />
  <ellipse cx="108" cy="180" rx="8" ry="4" fill="#fde68a" opacity="0.6" />

  <!-- Soft Boiled Egg Halves -->
  <ellipse cx="140" cy="178" rx="8" ry="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <ellipse cx="140" cy="178" rx="4" ry="2.5" fill="#f59e0b" />

  <!-- Nori (Seaweed) Sheet & Green Onions -->
  <path d="M 100 170 L 112 165 L 115 175 L 103 180 Z" fill="#065f46" />
  <circle cx="128" cy="177" r="1.5" fill="#10b981" />
  <circle cx="132" cy="180" r="1.5" fill="#10b981" />
  <circle cx="118" cy="183" r="1.5" fill="#10b981" />

  <!-- Rising Steam (Signifying fresh, warm, satisfying meal) -->
  <path d="M 110 165 Q 105 150 115 135 Q 125 120 115 105" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round" />
  <path d="M 130 165 Q 135 152 125 138 Q 115 125 125 110" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.25" stroke-linecap="round" />

  <!-- Chopsticks resting across bowl -->
  <path d="M 70 170 L 165 192" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" filter="url(#softShadow)" />
  <path d="M 68 174 L 163 196" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />
</svg>