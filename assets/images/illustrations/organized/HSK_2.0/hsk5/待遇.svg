<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window City Glow Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient (Perks/Benefits) -->
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements: Office Window & Cityscape -->
  <g opacity="0.6">
    <!-- Large Window Frame -->
    <rect x="30" y="20" width="180" height="110" rx="6" fill="url(#windowGlow)" stroke="#334155" stroke-width="2"/>
    <!-- Window Grid Lines -->
    <line x1="120" y1="20" x2="120" y2="130" stroke="#334155" stroke-width="2"/>
    <line x1="30" y1="80" x2="210" y2="80" stroke="#334155" stroke-width="2"/>

    <!-- Abstract City Skyline Outside -->
    <rect x="45" y="60" width="20" height="70" fill="#1e293b" opacity="0.7"/>
    <rect x="70" y="45" width="25" height="85" fill="#1e293b" opacity="0.5"/>
    <rect x="135" y="50" width="30" height="80" fill="#1e293b" opacity="0.6"/>
    <rect x="175" y="65" width="20" height="65" fill="#1e293b" opacity="0.8"/>
    
    <!-- Warm City Lights / Stars -->
    <circle cx="55" cy="70" r="1.5" fill="#fde047"/>
    <circle cx="82" cy="55" r="1.5" fill="#fde047"/>
    <circle cx="150" cy="65" r="1.5" fill="#fde047"/>
    <circle cx="185" cy="80" r="1.5" fill="#fde047"/>
  </g>

  <!-- Ambient Light Beam representing "Treatment/Benefits" (待遇) -->
  <path d="M 60 130 L 120 130 L 160 210 L 20 210 Z" fill="url(#warmGlow)" opacity="0.08" filter="url(#glow)"/>

  <!-- Office Desk Surface -->
  <path d="M 0 185 L 240 185 L 240 240 L 0 240 Z" fill="url(#deskGrad)"/>
  <!-- Desk Edge Highlight -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#475569" stroke-width="2"/>

  <!-- Background Office Props (Plant & Lamp) -->
  <!-- Minimalist Potted Plant -->
  <path d="M 200 160 L 216 160 L 212 185 L 204 185 Z" fill="#64748b"/>
  <path d="M 208 160 C 208 145, 190 140, 195 125 C 205 135, 215 130, 208 160 Z" fill="#10b981" filter="url(#softShadow)"/>
  <path d="M 208 160 C 215 145, 230 140, 225 125 C 215 135, 205 130, 208 160 Z" fill="#059669"/>

  <!-- Executive Ergonomic Chair Back (Silhouette) -->
  <path d="M 85 95 L 155 95 L 160 185 L 80 185 Z" rx="10" fill="#0f172a" opacity="0.8"/>
  <rect x="105" y="110" width="30" height="60" rx="4" fill="#1e293b"/>

  <!-- MAIN SCENE: Comprehensive "Welfare & Benefits Package" (待遇) on Desk -->
  <!-- Golden Gift Box / Bonus Box -->
  <g transform="translate(145, 135)" filter="url(#softShadow)">
    <!-- Box Body -->
    <rect x="0" y="15" width="45" height="35" rx="4" fill="#fb923c"/>
    <!-- Box Ribbon Vertical -->
    <rect x="18" y="15" width="9" height="35" fill="#f59e0b"/>
    <!-- Box Lid -->
    <rect x="-3" y="10" width="51" height="8" rx="2" fill="#ea580c"/>
    <!-- Ribbon Bow -->
    <path d="M 16 10 C 10 2, 5 10, 14 10 Z" fill="#fde047"/>
    <path d="M 29 10 C 35 2, 40 10, 31 10 Z" fill="#fde047"/>
    <circle cx="22.5" cy="11" r="3" fill="#fef08a"/>
  </g>

  <!-- Luxury Ceramic Coffee Mug (Perk) -->
  <g transform="translate(45, 145)" filter="url(#softShadow)">
    <rect x="0" y="5" width="22" height="25" rx="3" fill="#38bdf8"/>
    <!-- Handle -->
    <path d="M 22 10 C 30 10, 30 25, 22 25" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <!-- Steam / Aroma -->
    <path d="M 6 0 C 8 -3, 4 -6, 6 -9" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 14 -2 C 16 -5, 12 -8, 14 -11" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Laptop / Modern Workstation (Base Conditions) -->
  <g transform="translate(75, 130)" filter="url(#softShadow)">
    <!-- Laptop Base -->
    <path d="M -15 35 L 75 35 L 85 50 L -25 50 Z" fill="#64748b"/>
    <rect x="26" y="40" width="18" height="3" rx="1.5" fill="#475569"/>
    <!-- Laptop Screen (Angled Back) -->
    <path d="M -5 -15 L 65 -15 L 75 35 L -15 35 Z" fill="#334155"/>
    <path d="M -1 -11 L 61 -11 L 69 31 L -7 31 Z" fill="#0f172a"/>
    <!-- UI Dashboard Elements on Screen (Glowing Accents) -->
    <rect x="2" y="-5" width="20" height="12" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="26" y="-5" width="34" height="5" rx="1" fill="#10b981" opacity="0.8"/>
    <rect x="26" y="2" width="24" height="5" rx="1" fill="#fbbf24" opacity="0.8"/>
    <rect x="2" y="10" width="58" height="15" rx="2" fill="#1e293b"/>
    <circle cx="10" cy="17" r="4" fill="#ec4899"/>
    <line x1="18" y1="15" x2="45" y2="15" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="20" x2="35" y2="20" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Golden Health / Insurance Shield Badge (Key Perk Component) -->
  <g transform="translate(112, 115)" filter="url(#glow)">
    <path d="M 12 0 L 24 4 C 24 14, 18 22, 12 26 C 6 22, 0 14, 0 4 Z" fill="url(#warmGlow)"/>
    <!-- Checkmark inside Shield -->
    <path d="M 6 12 L 10 16 L 18 8" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Glowing Stars / Sparkles Emphasizing High Quality / Excellent Treatment -->
  <g fill="#fde047" filter="url(#glow)">
    <!-- Star 1 -->
    <path d="M 30 90 Q 30 100 20 100 Q 30 100 30 110 Q 30 100 40 100 Q 30 100 30 90 Z" transform="scale(0.8) translate(10, 10)"/>
    <!-- Star 2 -->
    <path d="M 210 100 Q 210 108 202 108 Q 210 108 210 116 Q 210 108 218 108 Q 210 108 210 100 Z" transform="scale(1.2)"/>
    <!-- Sparkle 3 -->
    <circle cx="130" cy="95" r="3" fill="#fbbf24"/>
    <circle cx="180" cy="125" r="2" fill="#38bdf8"/>
  </g>

  <!-- Floating Golden Coins / Bonuses (Dynamic Action Elements) -->
  <g filter="url(#softShadow)">
    <!-- Coin 1 -->
    <ellipse cx="120" cy="95" rx="8" ry="4" fill="#fbbf24"/>
    <ellipse cx="120" cy="94" rx="5" ry="2.5" fill="#fde047"/>
    
    <!-- Coin 2 -->
    <ellipse cx="140" cy="105" rx="10" ry="5" fill="#f59e0b" transform="rotate(-15 140 105)"/>
    <ellipse cx="140" cy="104" rx="6" ry="3" fill="#fbbf24" transform="rotate(-15 140 104)"/>
  </g>
</svg>