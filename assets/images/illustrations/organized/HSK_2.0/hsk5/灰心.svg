<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Character Outfit (Blue Tone) -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Room Elements -->
  <!-- Ambient Desk Lamp Glow -->
  <circle cx="190" cy="80" r="70" fill="#f59e0b" opacity="0.08" filter="blur(20px)" />

  <!-- Bookshelf / Window Silhouette in background -->
  <rect x="30" y="40" width="35" height="70" rx="4" fill="#334155" opacity="0.3" />
  <rect x="75" y="55" width="25" height="55" rx="4" fill="#475569" opacity="0.3" />

  <!-- Desk Surface -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#deskGrad)" />
  <!-- Desk Edge Highlight -->
  <rect x="0" y="170" width="240" height="3" fill="#475569" />

  <!-- Desk Props -->
  <!-- Coffee Mug -->
  <g transform="translate(195, 140)">
    <rect x="0" y="5" width="16" height="22" rx="3" fill="#cbd5e1" />
    <path d="M 16 10 C 22 10, 22 20, 16 22" stroke="#cbd5e1" stroke-width="2" fill="none" />
    <!-- Steam -->
    <path d="M 5 0 Q 8 -5, 5 -10" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- Stack of Books -->
  <g transform="translate(25, 145)">
    <rect x="0" y="10" width="35" height="15" rx="2" fill="#ef4444" />
    <rect x="-2" y="3" width="38" height="10" rx="2" fill="#3b82f6" />
    <rect x="2" y="-3" width="32" height="9" rx="2" fill="#10b981" />
  </g>

  <!-- Main Exam Paper (Fallen / Slumped over) -->
  <g transform="translate(80, 145) rotate(-12)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="65" height="50" rx="2" fill="url(#paperGrad)" />
    <!-- Red Fail Mark / Big Cross -->
    <path d="M 22 12 L 43 33 M 43 12 L 22 33" stroke="#ef4444" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <!-- Fake text lines -->
    <line x1="10" y1="8" x2="35" y2="8" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="42" x2="50" y2="42" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Pencil roll-off -->
  <path d="M 140 178 L 175 168" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M 175 168 L 180 166.5" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

  <!-- Depressed Character (Head down on arms) -->
  <g transform="translate(100, 95)">
    <!-- Body / Shoulders slumped forward -->
    <path d="M -30 75 C -30 45, 10 40, 50 75 C 65 90, 75 100, 75 100 L -45 100 Z" fill="url(#shirtGrad)" filter="url(#dropShadow)" />

    <!-- Arms folded resting on desk -->
    <path d="M -35 70 C -15 50, 35 50, 55 70 C 40 85, -20 85, -35 70 Z" fill="#0284c7" />

    <!-- Hands clasped / tucked under head -->
    <circle cx="10" cy="62" r="9" fill="#fcd34d" />

    <!-- Head / Hair slumped down -->
    <!-- Neck -->
    <rect x="0" y="32" width="16" height="15" fill="#fcd34d" />

    <!-- Head Shape (Facing downwards/sideways into arms) -->
    <g transform="translate(8, 30)">
      <!-- Hair Back/Top -->
      <path d="M -22 10 C -22 -10, 15 -15, 28 5 C 33 12, 30 25, 20 28 C 5 30, -15 28, -22 10 Z" fill="#334155" />
      <!-- Hair fringe touching arms -->
      <path d="M -15 20 C -5 25, 15 25, 22 20 C 15 32, -5 32, -15 20 Z" fill="#1e293b" />
    </g>
  </g>

  <!-- Blue Mood Lines / Heavy Atmosphere floating above -->
  <g transform="translate(110, 55)" opacity="0.6">
    <path d="M -15 0 Q -5 -8, 5 0" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 15 10 Q 25 2, 35 10" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M -35 15 Q -25 7, -15 15" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Ambient Shadow under character -->
  <ellipse cx="120" cy="180" rx="65" ry="8" fill="#0f172a" opacity="0.6" />
</svg>