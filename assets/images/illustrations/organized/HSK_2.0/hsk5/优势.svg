<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Chessboard/Table Surface -->
  <path d="M20 180 L220 180 L240 240 L0 240 Z" fill="#334155" opacity="0.6"/>
  
  <!-- The Advantageous Piece (The King/Champion) -->
  <g transform="translate(120, 140)">
    <path d="M-20 40 L20 40 L15 0 L-15 0 Z" fill="#f59e0b"/>
    <path d="M-15 0 L15 0 L10 -30 L-10 -30 Z" fill="#fbbf24"/>
    <circle cx="0" cy="-40" r="12" fill="#fbbf24"/>
    <path d="M-5 -45 L5 -45 L0 -35 Z" fill="#f59e0b"/>
    <!-- Glow -->
    <circle cx="0" cy="-40" r="20" fill="#f59e0b" opacity="0.2"/>
  </g>
  
  <!-- Opposing Pieces (Smaller/Lower) -->
  <g transform="translate(60, 160)">
    <path d="M-10 20 L10 20 L8 0 L-8 0 Z" fill="#64748b"/>
    <circle cx="0" cy="-5" r="8" fill="#94a3b8"/>
  </g>
  
  <g transform="translate(180, 160)">
    <path d="M-10 20 L10 20 L8 0 L-8 0 Z" fill="#64748b"/>
    <circle cx="0" cy="-5" r="8" fill="#94a3b8"/>
  </g>

  <!-- Background Elements (Depth) -->
  <circle cx="180" cy="60" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  <path d="M40 80 L70 50 L100 80 Z" fill="#10b981" opacity="0.2"/>
  
  <!-- Spotlight effect -->
  <ellipse cx="120" cy="120" rx="80" ry="100" fill="url(#grad1)" opacity="0.1"/>
  <defs>
    <radialGradient id="grad1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>