<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Decision/Confidence -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window City Lights -->
    <linearGradient id="window-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Coffee Mug Gradient -->
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ATMOSPHERIC BACKGROUND (Cozy Rainy Cafe/Office at Night representing a firm decision made despite the weather) -->
  <g id="background-environment">
    <!-- Window Frame -->
    <rect x="140" y="20" width="80" height="110" rx="4" fill="#0f172a" />
    <rect x="144" y="24" width="72" height="102" rx="2" fill="url(#window-sky)" />
    <!-- City bokeh outside -->
    <circle cx="160" cy="50" r="3" fill="#fbbf24" opacity="0.6" />
    <circle cx="185" cy="80" r="2" fill="#38bdf8" opacity="0.8" />
    <circle cx="200" cy="40" r="4" fill="#f43f5e" opacity="0.5" />
    <circle cx="155" cy="100" r="2.5" fill="#34d399" opacity="0.7" />
    <!-- Rain streaks on window -->
    <line x1="155" y1="30" x2="150" y2="55" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round" />
    <line x1="180" y1="40" x2="175" y2="70" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round" />
    <line x1="195" y1="60" x2="190" y2="90" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round" />
    <!-- Window crossbar -->
    <rect x="144" y="73" width="72" height="4" fill="#0f172a" />
    <rect x="178" y="24" width="4" height="102" fill="#0f172a" />

    <!-- Ambient Glow behind scene -->
    <circle cx="90" cy="130" r="70" fill="url(#amber-glow)" />

    <!-- Bookshelf / Props in background -->
    <rect x="20" y="40" width="40" height="8" rx="2" fill="#334155" />
    <rect x="25" y="20" width="8" height="20" rx="1" fill="#f59e0b" />
    <rect x="35" y="24" width="6" height="16" rx="1" fill="#ec4899" />
    <rect x="43" y="18" width="10" height="22" rx="1" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND ENVIRONMENT: Wooden Table Surface -->
  <g id="furniture">
    <!-- Table Top -->
    <path d="M 0 170 L 240 170 L 240 220 L 0 220 Z" fill="#334155" />
    <path d="M 0 166 L 240 166 L 240 170 L 0 170 Z" fill="#475569" />
    <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#1e293b" opacity="0.9" />
  </g>

  <!-- PROPS ON TABLE -->
  <g id="table-props">
    <!-- Open Planner / Decided Document -->
    <g transform="translate(130, 175) rotate(-5)" filter="url(#drop-shadow)">
      <!-- Paper base -->
      <polygon points="0,15 50,0 75,40 25,55" fill="#f8fafc" />
      <polygon points="37.5,7.5 75,40 25,55" fill="#f1f5f9" />
      <!-- Mock text lines (representing a finalized plan/schedule) -->
      <line x1="12" y1="22" x2="30" y2="17" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="15" y1="29" x2="35" y2="24" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="18" y1="36" x2="38" y2="31" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <!-- Big Checkmark Stamp (Showing "Decided / Anyway it's done") -->
      <circle cx="50" cy="28" r="10" fill="#10b981" />
      <path d="M 45 28 L 48 31 L 55 23" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Steaming Coffee Mug -->
    <g transform="translate(195, 160)" filter="url(#drop-shadow)">
      <!-- Saucer -->
      <ellipse cx="15" cy="22" rx="18" ry="5" fill="#cbd5e1" />
      <!-- Mug Body -->
      <path d="M 5 0 C 5 0, 7 20, 9 22 C 11 24, 19 24, 21 22 C 23 20, 25 0, 25 0 Z" fill="url(#mug-grad)" />
      <!-- Handle -->
      <path d="M 5 4 C 1 -1, -2 12, 5 16" fill="none" stroke="#be123c" stroke-width="3" stroke-linecap="round" />
      <!-- Steam -->
      <path d="M 12 -4 Q 15 -10, 10 -16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <path d="M 18 -6 Q 21 -12, 16 -18" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
    </g>
  </g>

  <!-- MAIN CHARACTER: Confident, Resolute Expression ("Anyway, we've decided!") -->
  <g id="main-character" transform="translate(15, 45)">
    <!-- Body & Shoulders -->
    <!-- Jacket/Shirt -->
    <path d="M 35 125 C 35 105, 55 95, 75 95 C 95 95, 115 105, 115 125 L 130 145 L 20 145 Z" fill="url(#jacket-grad)" filter="url(#drop-shadow)" />
    <!-- Collar -->
    <path d="M 60 95 L 75 115 L 90 95" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" />
    <path d="M 75 115 L 75 145" stroke="#0284c7" stroke-width="3" />
    <circle cx="75" cy="125" r="3" fill="#fbbf24" />

    <!-- Neck -->
    <rect x="65" y="80" width="20" height="20" rx="6" fill="#fcd34d" />

    <!-- Head & Hair Group -->
    <g id="head" transform="translate(0, 0)">
      <!-- Hair Back/Base -->
      <path d="M 50 45 C 50 25, 100 25, 100 45 C 105 55, 105 75, 95 85 C 85 90, 65 90, 55 85 C 45 75, 45 55, 50 45 Z" fill="#1e293b" />

      <!-- Face Base -->
      <rect x="52" y="45" width="46" height="46" rx="20" fill="#fef08a" />
      
      <!-- Ears -->
      <circle cx="49" cy="68" r="5" fill="#fde047" />
      <circle cx="101" cy="68" r="5" fill="#fde047" />

      <!-- Hair Front / Bangs (Dynamic, determined tilt) -->
      <path d="M 52 50 C 60 40, 80 40, 98 48 C 92 38, 58 38, 52 50 Z" fill="#0f172a" />
      <path d="M 75 42 L 85 52 L 68 50 Z" fill="#0f172a" />

      <!-- Confident, Determined Eyes (Slightly angled down-in for resolve) -->
      <g id="eyes">
        <!-- Left Eye -->
        <circle cx="67" cy="65" r="4" fill="#0f172a" />
        <circle cx="68.5" cy="63.5" r="1.5" fill="#ffffff" />
        <!-- Right Eye -->
        <circle cx="83" cy="65" r="4" fill="#0f172a" />
        <circle cx="84.5" cy="63.5" r="1.5" fill="#ffffff" />
        <!-- Determined Eyebrows -->
        <path d="M 60 58 L 74 61" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
        <path d="M 90 58 L 76 61" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Cheeks (Confident flush) -->
      <circle cx="61" cy="71" r="5" fill="#f43f5e" opacity="0.3" />
      <circle cx="89" cy="71" r="5" fill="#f43f5e" opacity="0.3" />

      <!-- Confident Smile (Smirk of finality/acceptance: "Whatever, let's do it") -->
      <path d="M 67 76 Q 75 83, 83 76" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
      <path d="M 67 76 Q 75 83, 83 76 Z" fill="#f43f5e" />
    </g>

    <!-- Dynamic Action Arms ("Whatever/It's decided" shrug & pointing/open gesture) -->
    <!-- Left Arm (Shrugging up) -->
    <path d="M 40 105 Q 20 110, 25 90" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="25" cy="87" r="6" fill="#fcd34d" /> <!-- Left Hand -->

    <!-- Right Arm (Emphatic palm-up gesture on table) -->
    <path d="M 110 105 Q 125 125, 115 140" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="113" cy="142" r="6" fill="#fcd34d" /> <!-- Right Hand -->
  </g>

  <!-- FOREGROUND ACCENTS & VIBE (Action Sparkles / Decision Energy) -->
  <g id="action-sparkles">
    <!-- Glowing Accent Orbs representing certainty -->
    <circle cx="35" cy="60" r="4" fill="#fbbf24" opacity="0.8" />
    <circle cx="35" cy="60" r="8" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4" />

    <circle cx="160" cy="140" r="3" fill="#38bdf8" opacity="0.9" />
    
    <!-- Action/Emphasis Burst near the head -->
    <path d="M 25 35 L 29 42 L 36 38 L 31 45 L 38 49 L 30 51 L 32 58 L 25 54 L 18 58 L 20 51 L 12 49 L 19 45 L 14 38 L 21 42 Z" fill="#fbbf24" transform="translate(115, 30) scale(0.5)" opacity="0.8" />
  </g>

  <!-- Vignette overlay for App UI depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />
</svg>