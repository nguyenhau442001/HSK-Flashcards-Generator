<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accent-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements -->
  <!-- Ambient light from main screen -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <!-- Ambient light from "addition" item -->
  <circle cx="180" cy="130" r="40" fill="#fbbf24" opacity="0.1" filter="url(#glow)" />

  <!-- Background Wall Details (Bookshelf / Workspace grid) -->
  <rect x="30" y="35" width="180" height="6" rx="3" fill="#334155" opacity="0.5" />
  <!-- Mini Books on Shelf -->
  <rect x="40" y="15" width="8" height="20" rx="2" fill="#64748b" />
  <rect x="50" y="12" width="12" height="23" rx="2" fill="#f43f5e" />
  <rect x="64" y="18" width="6" height="17" rx="2" fill="#38bdf8" />
  <rect x="72" y="14" width="10" height="21" rx="2" fill="#10b981" />

  <!-- Desk Surface -->
  <path d="M 15 195 L 225 195 L 210 215 L 30 215 Z" fill="url(#desk-grad)" />
  <rect x="15" y="190" width="210" height="5" rx="2.5" fill="#475569" />

  <!-- MAIN SCENE: Workstation / Planning setup representing "In addition / Besides" -->
  
  <!-- Primary Laptop Base & Screen (The Core Task) -->
  <!-- Laptop Screen Backing -->
  <rect x="70" y="65" width="100" height="70" rx="8" fill="#475569" filter="url(#soft-shadow)" />
  <!-- Laptop Screen Inner -->
  <rect x="74" y="69" width="92" height="62" rx="5" fill="#0f172a" />
  <!-- Screen UI Content (Abstract charts/nodes) -->
  <rect x="82" y="77" width="45" height="24" rx="3" fill="url(#screen-glow)" opacity="0.8" />
  <circle cx="145" cy="89" r="10" fill="#f43f5e" opacity="0.8" />
  <rect x="82" y="108" width="76" height="15" rx="3" fill="#334155" />
  <circle cx="92" cy="115.5" r="4" fill="#38bdf8" />
  <circle cx="106" cy="115.5" r="4" fill="#10b981" />

  <!-- Laptop Hinge & Base -->
  <path d="M 105 135 L 135 135 L 140 145 L 100 145 Z" fill="#64748b" />
  <path d="M 55 145 L 185 145 C 188 145 190 147 190 150 C 190 153 188 155 185 155 L 55 155 C 52 155 50 153 50 150 C 50 147 52 145 55 145 Z" fill="#94a3b8" filter="url(#soft-shadow)" />
  <!-- Trackpad -->
  <rect x="110" y="148" width="20" height="4" rx="2" fill="#64748b" />

  <!-- THE "ADDITION / BESIDES" ELEMENT: A glowing popup gift/bonus box sliding in from the side -->
  <!-- Connecting dashed arc/path indicating "addition" or "extra" -->
  <path d="M 170 110 Q 185 100 190 115" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,4" fill="none" opacity="0.7" />

  <!-- Extra Item Floating Container (The "Além disso / In addition" visual anchor) -->
  <g transform="translate(160, 95)" filter="url(#soft-shadow)">
    <!-- Box Shadow / Glow backing -->
    <circle cx="20" cy="20" r="24" fill="url(#amber-glow)" opacity="0.3" filter="url(#glow)" />
    
    <!-- Floating Extra Box -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#amber-glow)" />
    <!-- Inner Box Icon details (Sparkles / Plus / Extra item) -->
    <!-- Plus symbol inside box -->
    <rect x="18" y="10" width="4" height="20" rx="2" fill="#ffffff" />
    <rect x="10" y="18" width="20" height="4" rx="2" fill="#ffffff" />
    
    <!-- Little floating sparkle particles representing "extra" components -->
    <path d="M -8 -5 L -5 -5 L -5 -8 L -2 -8 L -2 -5 L 1 -5 L 1 -2 L -2 -2 L -2 1 L -5 1 L -5 -2 L -8 -2 Z" fill="#38bdf8" />
    <path d="M 45 35 L 47 35 L 47 33 L 49 33 L 49 35 L 51 35 L 51 37 L 49 37 L 49 39 L 47 39 L 47 37 L 45 37 Z" fill="#10b981" />
  </g>

  <!-- Secondary Companion Item (A steaming coffee cup for context) -->
  <g transform="translate(35, 125)" filter="url(#soft-shadow)">
    <!-- Saucer -->
    <ellipse cx="18" cy="26" rx="16" ry="5" fill="#475569" />
    <!-- Cup Body -->
    <path d="M 8 10 L 28 10 C 28 10 27 23 25 24 C 23 25 13 25 11 24 C 9 23 8 10 8 10 Z" fill="#f8fafc" />
    <!-- Coffee Surface -->
    <ellipse cx="18" cy="10" rx="10" ry="3" fill="#b45309" />
    <!-- Handle -->
    <path d="M 26 12 C 31 12 32 18 28 21" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Steam wisps -->
    <path d="M 15 3 C 12 0 18 -2 15 -5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 21 4 C 18 1 24 -1 21 -4" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- Desk Accessory: A mini succulent/plant for lively environment -->
  <g transform="translate(185, 155)" filter="url(#soft-shadow)">
    <!-- Pot -->
    <path d="M 4 12 L 16 12 L 18 26 L 2 26 Z" fill="#ec4899" />
    <!-- Leaves -->
    <circle cx="10" cy="8" r="7" fill="#10b981" />
    <circle cx="6" cy="11" r="5" fill="#34d399" />
    <circle cx="14" cy="11" r="5" fill="#059669" />
    <circle cx="10" cy="5" r="5" fill="#34d399" />
  </g>

  <!-- Foreground dynamic elements (Floating UI nodes connecting tasks to "besides/in addition") -->
  <path d="M 70 90 Q 50 85 45 100" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.5" />
  <circle cx="45" cy="100" r="4" fill="#38bdf8" />
</svg>