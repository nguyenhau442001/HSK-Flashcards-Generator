<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Factory Floor/Workbench -->
    <rect x="0" y="100" width="160" height="20" fill="#334155" rx="2"/>
    <rect x="20" y="120" width="10" height="40" fill="#475569"/>
    <rect x="130" y="120" width="10" height="40" fill="#475569"/>
    
    <!-- Robotic Arm -->
    <path d="M80 100 L80 60 L110 40" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="110" cy="40" r="12" fill="#fb923c"/>
    <rect x="105" y="45" width="10" height="15" fill="#f59e0b" rx="2"/>
    
    <!-- Car Frame being manufactured -->
    <path d="M30 80 L130 80 L120 95 L40 95 Z" fill="#ec4899"/>
    <circle cx="50" cy="95" r="8" fill="#10b981"/>
    <circle cx="110" cy="95" r="8" fill="#10b981"/>
    
    <!-- Sparks/Action -->
    <circle cx="110" cy="40" r="2" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="110" y1="40" x2="125" y2="30" stroke="#fbbf24" stroke-width="2"/>
    <line x1="110" y1="40" x2="128" y2="45" stroke="#fbbf24" stroke-width="2"/>
    
    <!-- Background Details -->
    <rect x="10" y="20" width="40" height="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="30" cy="35" r="5" fill="#334155"/>
  </g>
</svg>