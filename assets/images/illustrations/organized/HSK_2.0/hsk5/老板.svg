<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    
    <!-- Plant Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effects -->
  <circle cx="120" cy="80" r="90" fill="url(#amberGlow)" />

  <!-- Background Environment: Office Interior -->
  <!-- City Windowscape in Background -->
  <path d="M50 30 H120 V120 H50 Z" fill="url(#windowGlow)" rx="4" />
  <path d="M50 30 H120 V120 H50 Z" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" rx="4" fill="none" />
  <!-- Window Panes & City Lights -->
  <line x1="85" y1="30" x2="85" y2="120" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
  <line x1="50" y1="75" x2="120" y2="75" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
  <rect x="58" y="45" width="8" height="12" fill="#38bdf8" opacity="0.3" rx="1" />
  <rect x="70" y="55" width="10" height="20" fill="#fbbf24" opacity="0.3" rx="1" />
  <rect x="95" y="40" width="12" height="15" fill="#fbbf24" opacity="0.2" rx="1" />
  <rect x="98" y="85" width="8" height="18" fill="#38bdf8" opacity="0.4" rx="1" />

  <!-- Bookshelf / Decor on Left -->
  <rect x="25" y="45" width="18" height="75" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="2" />
  <line x1="25" y1="70" x2="43" y2="70" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="95" x2="43" y2="95" stroke="#334155" stroke-width="1.5" />
  <!-- Mini books -->
  <rect x="28" y="55" width="4" height="14" fill="#f43f5e" rx="1" />
  <rect x="33" y="53" width="5" height="16" fill="#38bdf8" rx="1" />
  <rect x="29" y="78" width="10" height="16" fill="#fbbf24" rx="1" />

  <!-- Indoor Plant on Right -->
  <path d="M195 105 Q198 85 210 75 Q215 90 205 105 Z" fill="url(#leafGrad)" />
  <path d="M200 108 Q190 95 180 90 Q180 105 195 110 Z" fill="url(#leafGrad)" />
  <path d="M202 110 Q215 98 225 100 Q220 115 205 112 Z" fill="url(#leafGrad)" />
  <!-- Pot -->
  <path d="M195 110 H215 L210 130 H200 Z" fill="#64748b" rx="2" />

  <!-- Main Desk Surface -->
  <path d="M15 140 H225 V210 H15 Z" fill="url(#deskGrad)" />
  <!-- Desk Edge Highlight -->
  <path d="M15 140 H225" stroke="#64748b" stroke-width="2" />
  <path d="M15 142 H225" stroke="#0f172a" stroke-width="1" />

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M150 125 L180 125 L190 140 L140 140 Z" fill="#475569" />
  <path d="M145 110 H185 V125 H145 Z" fill="#94a3b8" rx="2" />
  <path d="M148 113 H182 V122 H148 Z" fill="#0f172a" rx="1" />
  <!-- Laptop Screen Glow Art -->
  <path d="M153 116 L160 120 L175 116" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <circle cx="172" cy="118" r="2" fill="#10b981" />

  <!-- Coffee Mug -->
  <rect x="75" y="123" width="12" height="15" fill="#f8fafc" rx="2" />
  <path d="M87 126 C92 126 92 135 87 135" stroke="#f8fafc" stroke-width="2" fill="none" />
  <path d="M78 120 C78 117 84 117 84 120" stroke="#cbd5e1" stroke-width="1.5" fill="none" /> <!-- Steam -->

  <!-- Boss Character ("Ông Chủ") -->
  <!-- Character Torso / Suit -->
  <!-- Suit Jacket Base (Navy/Charcoal) -->
  <path d="M95 140 L100 110 H140 L145 140 Z" fill="#0f172a" />
  <!-- Inner Shirt (Crisp White) -->
  <polygon points="110,110 130,110 120,132" fill="#f8fafc" />
  <!-- Red Tie (Symbol of authority/success) -->
  <polygon points="118,112 122,112 124,135 120,140 116,135" fill="#dc2626" />
  
  <!-- Suit Lapels -->
  <path d="M100 110 L115 135 L110 140" fill="#1e293b" />
  <path d="M140 110 L125 135 L130 140" fill="#1e293b" />
  <!-- Suit Golden Buttons -->
  <circle cx="120" cy="142" r="1.5" fill="#fbbf24" />
  <circle cx="120" cy="152" r="1.5" fill="#fbbf24" />

  <!-- Character Neck -->
  <rect x="113" y="100" width="14" height="14" fill="#fcd34d" />

  <!-- Character Head & Face -->
  <path d="M103 75 Q103 55 120 55 Q137 55 137 75 L137 95 Q137 103 120 103 Q103 103 103 95 Z" fill="#fcd34d" />
  <!-- Ears -->
  <circle cx="101" cy="80" r="4" fill="#f59e0b" />
  <circle cx="139" cy="80" r="4" fill="#f59e0b" />

  <!-- Confident Boss Hair (Stylish parted neat hair) -->
  <path d="M103 78 Q102 55 120 53 Q138 55 138 78 Q135 60 120 58 Q105 60 103 78 Z" fill="#1e293b" />
  <path d="M115 55 Q125 50 135 60 Q130 55 115 55 Z" fill="#334155" />

  <!-- Facial Features: Glasses & Confident Smile -->
  <!-- Stylish Glasses (Thin gold/dark frames) -->
  <rect x="106" y="73" width="13" height="9" rx="2" fill="none" stroke="#b45309" stroke-width="1.5" />
  <rect x="121" y="73" width="13" height="9" rx="2" fill="none" stroke="#b45309" stroke-width="1.5" />
  <line x1="119" y1="77" x2="121" y2="77" stroke="#b45309" stroke-width="1.5" />
  <!-- Eyes behind glasses (happy/confident arcs) -->
  <path d="M110 77 Q112 75 115 77" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M125 77 Q127 75 130 77" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Eyebrows (Determined/Confident) -->
  <path d="M108 70 L115 72" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M125 72 L132 70" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M120 78 L118 86 H122" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Confident Smile -->
  <path d="M112 91 Q120 97 128 91" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />

  <!-- Boss Dynamic Hand Gesture (Pointing/Guiding forward authoritatively) -->
  <!-- Back Arm & Sleeve -->
  <path d="M95 120 L75 135 L85 145" fill="#0f172a" />
  <circle cx="85" cy="145" r="4" fill="#fcd34d" /> <!-- Hand holding desk edge -->

  <!-- Foreground Arm (Confident forward gesture) -->
  <path d="M142 125 L165 135 L155 145" fill="#1e293b" />
  <!-- Hand pointing forward -->
  <circle cx="160" cy="147" r="5" fill="#fcd34d" />
  <path d="M163 145 L173 143 L163 149 Z" fill="#fcd34d" />

  <!-- Executive Office Accent: Golden Nameplate / Desk Tag (Blank of text) -->
  <g transform="translate(95, 155)">
    <path d="M0 10 L8 0 H42 L50 10 Z" fill="#b45309" />
    <path d="M2 10 H48 V16 H2 Z" fill="#fbbf24" />
    <path d="M4 12 H46 V14 H4 Z" fill="#fef3c7" opacity="0.6" />
  </g>

  <!-- Foreground depth elements / Bokeh light particles -->
  <circle cx="35" cy="180" r="3" fill="#38bdf8" opacity="0.4" />
  <circle cx="210" cy="160" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="45" cy="85" r="1.5" fill="#fbbf24" opacity="0.5" />
  <circle cx="190" cy="45" r="2.5" fill="#38bdf8" opacity="0.3" />

</svg>