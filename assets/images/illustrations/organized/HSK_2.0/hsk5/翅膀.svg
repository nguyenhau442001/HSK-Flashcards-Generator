<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric background elements -->
  <circle cx="180" cy="60" r="30" fill="#334155" opacity="0.4"/>
  <path d="M40 180 Q 120 140 200 180 L 200 240 L 40 240 Z" fill="#334155" opacity="0.3"/>
  
  <!-- The Bird (Subject) -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <ellipse cx="60" cy="60" rx="35" ry="25" fill="#f59e0b"/>
    <!-- Head -->
    <circle cx="90" cy="45" r="15" fill="#f59e0b"/>
    <circle cx="98" cy="42" r="3" fill="#0f172a"/>
    <path d="M105 45 L 115 48 L 105 51 Z" fill="#fb923c"/>
    
    <!-- The Wing (翅膀) - The focal point -->
    <path d="M50 50 C 20 20, -20 50, 10 90 C 0 60, 20 40, 50 50 Z" fill="#38bdf8" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M55 55 C 30 30, 0 55, 25 85" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M60 60 C 40 40, 20 60, 35 80" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Tail -->
    <path d="M30 65 L 10 75 L 30 85 Z" fill="#fbbf24"/>
  </g>
  
  <!-- Decorative sparkles -->
  <circle cx="160" cy="100" r="2" fill="#fbbf24"/>
  <circle cx="190" cy="130" r="3" fill="#10b981"/>
  <circle cx="50" cy="150" r="2" fill="#ec4899"/>
</svg>