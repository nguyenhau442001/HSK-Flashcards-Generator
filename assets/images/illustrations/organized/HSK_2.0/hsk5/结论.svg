<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Magnifying Glass Lens Glow -->
    <linearGradient id="lensGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Stamp Pad Gold/Amber Glow -->
    <radialGradient id="stampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effects -->
  <circle cx="160" cy="80" r="70" fill="url(#stampGlow)" />
  <circle cx="90" cy="130" r="60" fill="#38bdf8" opacity="0.05" />

  <!-- Background Environment (Bookshelf & Wall details) -->
  <g opacity="0.25">
    <rect x="20" y="30" width="30" height="40" rx="3" fill="#64748b" />
    <rect x="55" y="25" width="25" height="45" rx="3" fill="#475569" />
    <rect x="85" y="35" width="35" height="35" rx="3" fill="#334155" />
    <line x1="15" y1="70" x2="130" y2="70" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Wooden/Modern Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <!-- Desk Rim Highlight -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" />

  <!-- SCENE: Investigation / Conclusion (Dossier, Document, Stamp, Magnifying Glass) -->

  <!-- Open Folder / Dossier (Base) -->
  <g filter="url(#dropShadow)">
    <!-- Back Folder Flap -->
    <path d="M 45 95 L 120 75 L 195 95 L 195 185 L 45 185 Z" fill="#cbd5e1" rx="4" />
    <path d="M 50 100 L 120 82 L 190 100 L 190 180 L 50 180 Z" fill="#f8fafc" />
  </g>

  <!-- Detailed Documents Inside Folder -->
  <g>
    <!-- Secondary Paper Underneath -->
    <rect x="60" y="90" width="100" height="110" rx="2" fill="#e2e8f0" transform="rotate(-4 110 140)" />
    
    <!-- Main Top Document -->
    <rect x="65" y="95" width="110" height="120" rx="3" fill="#ffffff" filter="url(#dropShadow)" />
    
    <!-- Document Header Accent -->
    <rect x="80" y="108" width="50" height="6" rx="3" fill="#38bdf8" />
    
    <!-- Abstract Report Lines & Chart -->
    <rect x="80" y="124" width="80" height="4" rx="2" fill="#cbd5e1" />
    <rect x="80" y="134" width="60" height="4" rx="2" fill="#cbd5e1" />
    <rect x="80" y="144" width="70" height="4" rx="2" fill="#cbd5e1" />

    <!-- Mini Bar Chart on Document -->
    <rect x="80" y="165" width="10" height="25" rx="2" fill="#94a3b8" />
    <rect x="95" y="155" width="10" height="35" rx="2" fill="#cbd5e1" />
    <rect x="110" y="145" width="10" height="45" rx="2" fill="#38bdf8" />
    <rect x="125" y="135" width="10" height="55" rx="2" fill="#10b981" />
  </g>

  <!-- Official Conclusion Stamp ("APPROVED" / "FINAL" Concept) -->
  <g filter="url(#heavyShadow)" transform="rotate(-12 155 135)">
    <!-- Stamp Handle/Top -->
    <ellipse cx="155" cy="85" rx="16" ry="6" fill="#b45309" />
    <path d="M 147 85 C 147 85 151 105 153 115 L 157 115 C 159 105 163 85 163 85 Z" fill="#d97706" />
    <ellipse cx="155" cy="115" rx="4" ry="2" fill="#92400e" />

    <!-- Stamp Base & Glow -->
    <rect x="130" y="115" width="50" height="36" rx="6" fill="#b45309" />
    <rect x="133" y="118" width="44" height="30" rx="4" fill="#fbbf24" />

    <!-- Stamp Imprint Graphics (Abstract Check/Star icon representing conclusion) -->
    <circle cx="155" cy="133" r="12" fill="none" stroke="#dc2626" stroke-width="3" />
    <path d="M 147 133 L 152 138 L 164 126" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Stamp Ink Splatter / Dynamic Hit Effect -->
  <circle cx="155" cy="135" r="28" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 4" />

  <!-- Magnifying Glass (Focus / Analysis / Conclusion finding) -->
  <g filter="url(#heavyShadow)">
    <!-- Handle -->
    <path d="M 75 135 L 45 165 C 40 170 40 178 45 183 C 50 188 58 188 63 183 L 93 153 Z" fill="#334155" />
    <path d="M 72 138 L 48 162 C 45 165 45 170 48 173 C 51 176 56 176 59 173 L 83 149 Z" fill="#475569" />
    <path d="M 55 170 L 48 177" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Glass Rim (Outer Gold/Steel Ring) -->
    <circle cx="95" cy="115" r="32" fill="#0f172a" />
    <circle cx="95" cy="115" r="28" fill="#f8fafc" />

    <!-- Lens Viewport (Revealing detailed conclusion details) -->
    <circle cx="95" cy="115" r="26" fill="url(#lensGlow)" />

    <!-- Highlight inside Lens -->
    <path d="M 77 103 A 22 22 0 0 1 113 97" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Magnified Target Elements (A glowing lightbulb/star inside the glass) -->
    <g transform="translate(95, 115)">
      <!-- Target Checkmark inside lens -->
      <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.2" />
      <path d="M -6 -1 L -2 4 L 7 -5" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Floating Sparkles / Success Particles (Adding action and life) -->
  <g>
    <!-- Star 1 (Gold) -->
    <path d="M 190 70 L 193 78 L 201 81 L 193 84 L 190 92 L 187 84 L 179 81 L 187 78 Z" fill="#fbbf24" filter="url(#dropShadow)" />
    <!-- Star 2 (Cyan/Blue Accent) -->
    <path d="M 50 60 L 52 65 L 57 67 L 52 69 L 50 74 L 48 69 L 43 67 L 48 65 Z" fill="#38bdf8" />
    <!-- Small glowing dots -->
    <circle cx="175" cy="55" r="3" fill="#f59e0b" />
    <circle cx="125" cy="65" r="2" fill="#38bdf8" />
    <circle cx="35" cy="115" r="2.5" fill="#10b981" />
  </g>

</svg>