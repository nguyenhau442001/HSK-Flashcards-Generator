<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Sky Glow -->
    <linearGradient id="sky-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <!-- Factory Body Gradient -->
    <linearGradient id="factory-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Factory Roof Gradient -->
    <linearGradient id="factory-roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="glow-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <!-- Window Light -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Conveyor Belt Gradient -->
    <linearGradient id="belt-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Gear Metal -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#sky-glow)" />

  <!-- Background Environment / Hills / Ground Plane -->
  <path d="M0 170 Q60 160 120 165 T240 160 L240 240 L0 240 Z" fill="#0f172a" />
  
  <!-- Factory Main Structure -->
  <!-- Left Wing -->
  <path d="M30 170 L30 110 L80 110 L80 170 Z" fill="url(#factory-body)" />
  <!-- Left Roof (Sawtooth) -->
  <path d="M25 110 L80 110 L80 95 L25 110 Z" fill="url(#factory-roof)" />

  <!-- Center Main Hall -->
  <path d="M75 170 L75 85 L155 85 L155 170 Z" fill="url(#factory-body)" />
  <!-- Center Roof (Sawtooth 1) -->
  <path d="M70 85 L115 85 L115 65 L70 85 Z" fill="url(#factory-roof)" />
  <!-- Center Roof (Sawtooth 2) -->
  <path d="M110 85 L155 85 L155 65 L110 85 Z" fill="url(#factory-roof)" />

  <!-- Right Wing / Warehouse -->
  <path d="M150 170 L150 120 L210 120 L210 170 Z" fill="url(#factory-body)" />
  <!-- Right Roof -->
  <path d="M145 120 L210 120 L210 105 L145 120 Z" fill="url(#factory-roof)" />

  <!-- Windows with Warm/Cool Glow -->
  <!-- Left Wing Windows -->
  <rect x="40" y="125" width="12" height="15" rx="2" fill="url(#window-glow)" />
  <rect x="58" y="125" width="12" height="15" rx="2" fill="url(#window-glow)" />
  
  <!-- Center Hall Windows -->
  <rect x="90" y="100" width="14" height="22" rx="2" fill="url(#window-glow)" />
  <rect x="115" y="100" width="14" height="22" rx="2" fill="url(#window-glow)" />
  <rect x="90" y="135" width="14" height="22" rx="2" fill="url(#window-glow)" />
  <rect x="115" y="135" width="14" height="22" rx="2" fill="url(#window-glow)" />

  <!-- Large Factory Double Doors -->
  <path d="M170 170 L170 135 Q190 130 200 135 L200 170 Z" fill="#0f172a" />
  <line x1="185" y1="135" x2="185" y2="170" stroke="#334155" stroke-width="2" />

  <!-- Smokestacks & Smoke -->
  <rect x="185" y="70" width="12" height="50" fill="#475569" />
  <rect x="182" y="65" width="18" height="7" rx="2" fill="#fb923c" />
  
  <!-- Floating Smoke Puffs (Friendly, stylized) -->
  <circle cx="191" cy="50" r="7" fill="#cbd5e1" opacity="0.6" />
  <circle cx="198" cy="38" r="10" fill="#cbd5e1" opacity="0.4" />
  <circle cx="208" cy="25" r="13" fill="#cbd5e1" opacity="0.2" />

  <!-- SECOND Smokestack -->
  <rect x="50" y="80" width="10" height="30" fill="#475569" />
  <circle cx="55" cy="68" r="6" fill="#cbd5e1" opacity="0.5" />
  <circle cx="60" cy="56" r="9" fill="#cbd5e1" opacity="0.3" />

  <!-- FOREGROUND PRODUCTION / ACTION ELEMENTS -->
  <!-- Ground Platform / Floor -->
  <path d="M0 195 L240 195 L240 240 L0 240 Z" fill="#0f172a" />
  <line x1="0" y1="195" x2="240" y2="195" stroke="#38bdf8" stroke-width="3" opacity="0.6" />

  <!-- Conveyor Belt System -->
  <rect x="20" y="180" width="150" height="12" rx="6" fill="url(#belt-grad)" stroke="#64748b" stroke-width="2" />
  <!-- Belt Rollers -->
  <circle cx="35" cy="186" r="4" fill="#38bdf8" />
  <circle cx="75" cy="186" r="4" fill="#38bdf8" />
  <circle cx="115" cy="186" r="4" fill="#38bdf8" />
  <circle cx="155" cy="186" r="4" fill="#38bdf8" />

  <!-- Auto Parts / Products on Belt (Contextualizing "manufacturing auto parts") -->
  <!-- Gear Icon/Prop -->
  <g transform="translate(45, 160)">
    <circle cx="0" cy="0" r="12" fill="url(#metal-grad)" />
    <circle cx="0" cy="0" r="5" fill="#0f172a" />
    <rect x="-3" y="-15" width="6" height="30" rx="1" fill="url(#metal-grad)" />
    <rect x="-15" y="-3" width="30" height="6" rx="1" fill="url(#metal-grad)" />
    <rect x="-10" y="-12" width="20" height="24" rx="1" transform="rotate(45)" fill="url(#metal-grad)" />
    <circle cx="0" cy="0" r="4" fill="#0f172a" />
  </g>

  <!-- Car Component / Engine Block Prop -->
  <g transform="translate(100, 158)">
    <rect x="-15" y="-10" width="30" height="20" rx="4" fill="url(#glow-orange)" stroke="#b45309" stroke-width="2" />
    <circle cx="-7" cy="0" r="4" fill="#1e293b" />
    <circle cx="7" cy="0" r="4" fill="#1e293b" />
    <path d="M-10 -10 L-5 -18 L5 -18 L10 -10 Z" fill="#cbd5e1" />
  </g>

  <!-- Finished Box / Package ready for transport -->
  <g transform="translate(145, 153)">
    <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#10b981" stroke="#047857" stroke-width="2" />
    <path d="M-12 -2 L12 -2" stroke="#047857" stroke-width="2" />
    <path d="M0 -12 L0 12" stroke="#047857" stroke-width="2" />
  </g>

  <!-- Large Decorative Industrial Gear in Foreground Right (Action / Engineering Vibe) -->
  <g transform="translate(205, 185)">
    <circle cx="0" cy="0" r="22" fill="url(#metal-grad)" stroke="#334155" stroke-width="3" />
    <circle cx="0" cy="0" r="10" fill="#0f172a" />
    <!-- Gear teeth -->
    <rect x="-5" y="-28" width="10" height="56" rx="2" fill="url(#metal-grad)" />
    <rect x="-28" y="-5" width="56" height="10" rx="2" fill="url(#metal-grad)" />
    <rect x="-20" y="-20" width="40" height="40" rx="2" transform="rotate(45)" fill="url(#metal-grad)" />
    <circle cx="0" cy="0" r="7" fill="#38bdf8" />
  </g>

  <!-- Spark / Energy accents indicating active production -->
  <path d="M125 140 L132 128 L128 135 L138 132 Z" fill="#fbbf24" />
  <path d="M55 145 L60 137 L58 142 L65 139 Z" fill="#38bdf8" />

  <!-- Ambient lighting / Overhead Industrial Lamps -->
  <path d="M100 85 L105 75 L125 75 L130 85 Z" fill="#64748b" />
  <ellipse cx="115" cy="85" rx="15" ry="4" fill="#fbbf24" />
  <path d="M115 85 L80 180 L150 180 Z" fill="#fbbf24" opacity="0.08" />
</svg>