<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gearGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gearBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gearCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Ambient Light Circle -->
  <circle cx="120" cy="110" r="90" fill="url(#warmLight)"/>

  <!-- Background Environment / Blueprint details -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="0.8" fill="none">
    <line x1="30" y1="40" x2="210" y2="40" stroke-dasharray="4 4"/>
    <line x1="30" y1="180" x2="210" y2="180" stroke-dasharray="4 4"/>
    <circle cx="120" cy="110" r="75" stroke-dasharray="2 6"/>
    <circle cx="120" cy="110" r="55"/>
  </g>

  <!-- Wooden/Modern Desk Surface -->
  <path d="M 20 185 L 220 185 L 235 225 L 5 225 Z" fill="url(#tableGrad)" filter="url(#dropShadow)"/>
  <line x1="20" y1="185" x2="220" y2="185" stroke="#475569" stroke-width="2"/>

  <!-- Architectural Blueprints & Papers on Desk -->
  <g transform="translate(45, 170) rotate(-6)">
    <rect width="70" height="45" rx="2" fill="#0284c7" opacity="0.8"/>
    <path d="M 10 10 L 40 10 M 10 20 L 50 20 M 10 30 L 30 30" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(130, 175) rotate(8)">
    <rect width="65" height="40" rx="2" fill="#f8fafc" opacity="0.9"/>
    <path d="M 10 12 Q 25 25 40 15 T 55 25" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="50" cy="25" r="4" fill="#10b981"/>
  </g>

  <!-- CENTRAL MECHANISM: INTERLOCKING GEARS (The core visual metaphor of Cooperation) -->
  <g filter="url(#dropShadow)" transform="translate(0, -5)">
    
    <!-- Left Gear (Amber/Gold) -->
    <g transform="translate(85, 110)">
      <!-- Teeth -->
      <path d="M -6,-24 L 6,-24 L 8,-16 L -8,-16 Z 
               M 24,-6 L 24,6 L 16,8 L 16,-8 Z
               M 6,24 L -6,24 L -8,16 L 8,16 Z
               M -24,6 L -24,-6 L -16,-8 L -16,8 Z
               M 17,-17 L 8,-23 L 14,-29 Z
               M 17,17 L 23,8 L 29,14 Z
               M -17,17 L -8,23 L -14,29 Z
               M -17,-17 L -23,-8 L -29,-14 Z" fill="url(#gearGold)"/>
      <circle r="18" fill="url(#gearGold)"/>
      <circle r="8" fill="#0f172a"/>
      <!-- Robot face detail / Expression of focus -->
      <circle cx="-3" cy="-1" r="1.5" fill="#38bdf8"/>
      <circle cx="3" cy="-1" r="1.5" fill="#38bdf8"/>
      <path d="M -2,3 Q 0,5 2,3" fill="none" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Right Gear (Cyan/Blue) -->
    <g transform="translate(155, 95)">
      <!-- Teeth -->
      <path d="M -6,-24 L 6,-24 L 8,-16 L -8,-16 Z 
               M 24,-6 L 24,6 L 16,8 L 16,-8 Z
               M 6,24 L -6,24 L -8,16 L 8,16 Z
               M -24,6 L -24,-6 L -16,-8 L -16,8 Z
               M 17,-17 L 8,-23 L 14,-29 Z
               M 17,17 L 23,8 L 29,14 Z
               M -17,17 L -8,23 L -14,29 Z
               M -17,-17 L -23,-8 L -29,-14 Z" fill="url(#gearBlue)"/>
      <circle r="18" fill="url(#gearBlue)"/>
      <circle r="8" fill="#0f172a"/>
      <!-- Robot face detail -->
      <circle cx="-3" cy="-1" r="1.5" fill="#fbbf24"/>
      <circle cx="3" cy="-1" r="1.5" fill="#fbbf24"/>
      <path d="M -2,3 Q 0,5 2,3" fill="none" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Top/Anchor Gear (Coral/Orange) - Completing the trio to show dynamic interaction -->
    <g transform="translate(120, 60)">
      <!-- Teeth -->
      <path d="M -5,-20 L 5,-20 L 7,-13 L -7,-13 Z 
               M 20,-5 L 20,5 L 13,7 L 13,-7 Z
               M 5,20 L -5,20 L -7,13 L 7,13 Z
               M -20,5 L -20,-5 L -13,-7 L -13,7 Z
               M 14,-14 L 7,-19 L 12,-24 Z
               M 14,14 L 19,7 L 24,12 Z
               M -14,14 L -7,19 L -12,24 Z
               M -14,-14 L -19,-7 L -24,-12 Z" fill="url(#gearCoral)"/>
      <circle r="14" fill="url(#gearCoral)"/>
      <circle r="6" fill="#0f172a"/>
      <!-- Face -->
      <circle cx="-2.5" cy="-1" r="1.2" fill="#f8fafc"/>
      <circle cx="2.5" cy="-1" r="1.2" fill="#f8fafc"/>
    </g>

  </g>

  <!-- HANDS COMING TOGETHER (Human element of cooperation framing the mechanical core) -->
  <g filter="url(#dropShadow)">
    <!-- Left Hand (Sleeved in dark blue/teal with warm skin tone) -->
    <g transform="translate(0, 0)">
      <!-- Sleeve -->
      <path d="M -10 160 L 45 140 L 55 165 L 0 190 Z" fill="#0ea5e9"/>
      <!-- Arm/Hand -->
      <path d="M 40 145 C 55 140 65 135 78 135 C 85 135 90 142 85 148 C 75 158 60 162 48 162 Z" fill="#fcd34d"/>
      <!-- Thumb Up -->
      <path d="M 68 138 C 72 130 78 128 82 132 C 85 135 83 140 78 142 Z" fill="#f59e0b"/>
    </g>

    <!-- Right Hand (Sleeved in orange with warm skin tone) -->
    <g transform="translate(240, 0) scale(-1, 1)">
      <!-- Sleeve -->
      <path d="M -10 160 L 45 140 L 55 165 L 0 190 Z" fill="#f97316"/>
      <!-- Arm/Hand -->
      <path d="M 40 145 C 55 140 65 135 78 135 C 85 135 90 142 85 148 C 75 158 60 162 48 162 Z" fill="#fbbf24"/>
      <!-- Thumb Up -->
      <path d="M 68 138 C 72 130 78 128 82 132 C 85 135 83 140 78 142 Z" fill="#d97706"/>
    </g>
  </g>

  <!-- Sparkles / Energy bursts representing successful collaboration -->
  <g fill="#fbbf24">
    <path d="M 120 28 L 122 36 L 130 38 L 122 40 L 120 48 L 118 40 L 110 38 L 118 36 Z"/>
    <path d="M 72 82 L 73 87 L 78 88 L 73 89 L 72 94 L 71 89 L 66 88 L 71 87 Z" fill="#38bdf8"/>
    <path d="M 172 75 L 173 79 L 177 80 L 173 81 L 172 85 L 171 81 L 167 80 L 171 79 Z" fill="#10b981"/>
  </g>

  <!-- Connection Arc / Synergy Wave -->
  <path d="M 95 110 Q 120 85 145 110" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M 105 125 Q 120 105 135 125" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

</svg>