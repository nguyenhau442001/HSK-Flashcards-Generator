<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Stadium Turf Gradient -->
    <linearGradient id="turfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Running Track Gradient (Red/Orange clay) -->
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Floodlight Glow -->
    <radialGradient id="lightGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Shadow -->
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Background Buildings/Bleachers Silhouette -->
  <path d="M0 100 L40 90 L80 100 L120 85 L160 95 L200 88 L240 95 L240 130 L0 130 Z" fill="#334155" opacity="0.5"/>
  <rect x="20" y="98" width="10" height="25" fill="#475569" opacity="0.6"/>
  <rect x="40" y="93" width="15" height="30" fill="#475569" opacity="0.6"/>
  <rect x="70" y="98" width="12" height="25" fill="#475569" opacity="0.6"/>
  <rect x="100" y="90" width="18" height="33" fill="#475569" opacity="0.6"/>
  <rect x="140" y="98" width="10" height="25" fill="#475569" opacity="0.6"/>
  <rect x="180" y="93" width="15" height="30" fill="#475569" opacity="0.6"/>
  <rect x="210" y="96" width="12" height="27" fill="#475569" opacity="0.6"/>

  <!-- Floodlight Towers & Beams -->
  <!-- Tower Left -->
  <line x1="30" y1="90" x2="30" y2="40" stroke="#64748b" stroke-width="3"/>
  <line x1="25" y1="45" x2="35" y2="45" stroke="#64748b" stroke-width="3"/>
  <circle cx="30" cy="42" r="8" fill="#fef08a"/>
  <polygon points="30,42 0,160 80,160" fill="url(#lightGlow)" opacity="0.4" style="mix-blend-mode: screen;"/>

  <!-- Tower Right -->
  <line x1="210" y1="90" x2="210" y2="40" stroke="#64748b" stroke-width="3"/>
  <line x1="205" y1="45" x2="215" y2="45" stroke="#64748b" stroke-width="3"/>
  <circle cx="210" cy="42" r="8" fill="#fef08a"/>
  <polygon points="210,42 160,160 240,160" fill="url(#lightGlow)" opacity="0.4" style="mix-blend-mode: screen;"/>

  <!-- STADIUM FIELD (操场) -->
  <!-- Outer Turf Area -->
  <path d="M 0 120 Q 120 100 240 120 L 240 220 Q 120 240 0 220 Z" fill="url(#turfGrad)"/>

  <!-- Running Tracks (Oval curves perspective) -->
  <!-- Track Outer -->
  <path d="M -10 135 Q 120 110 250 135 L 250 175 Q 120 205 -10 175 Z" fill="url(#trackGrad)"/>
  
  <!-- Track Inner Lines (dashed white lines) -->
  <path d="M -10 145 Q 120 122 250 145" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>
  <path d="M -10 155 Q 120 133 250 155" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>
  <path d="M -10 165 Q 120 144 250 165" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>

  <!-- Inner Turf Pitch (Green field center) -->
  <ellipse cx="120" cy="172" rx="90" ry="24" fill="url(#turfGrad)"/>
  <!-- Field Markings -->
  <ellipse cx="120" cy="172" rx="30" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <circle cx="120" cy="172" r="2" fill="#ffffff" opacity="0.7"/>
  <line x1="120" y1="148" x2="120" y2="196" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

  <!-- SECONDARY TRACK (Foreground action sweep) -->
  <path d="M -10 180 Q 120 206 250 180 L 250 215 Q 120 245 -10 215 Z" fill="url(#trackGrad)"/>
  <path d="M -10 197 Q 120 225 250 197" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.9"/>


  <!-- RUNNING CHARACTERS (Action & Motion) -->

  <!-- Character 1 (Background runner, left side) -->
  <g transform="translate(60, 140) scale(0.6)">
    <ellipse cx="0" cy="35" rx="10" ry="5" fill="url(#shadow)"/>
    <!-- Body -->
    <path d="M-5 15 L5 5 L10 25 L-2 30 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="-2" cy="-2" r="6" fill="#fbcfe8"/>
    <!-- Limbs in motion -->
    <line x1="-5" y1="10" x2="-12" y2="20" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-12" y1="20" x2="-18" y2="15" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="15" x2="15" y2="10" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="5" y1="25" x2="-5" y2="35" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <line x1="10" y1="25" x2="18" y2="35" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Mid-ground runner, center-right) -->
  <g transform="translate(150, 160) scale(0.75)">
    <ellipse cx="0" cy="40" rx="12" ry="6" fill="url(#shadow)"/>
    <!-- Motion lines -->
    <line x1="-25" y1="20" x2="-10" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-20" y1="35" x2="-10" y2="35" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Body -->
    <path d="M-8,12 L6,2 L12,22 L-2,28 Z" fill="#fb923c"/>
    <!-- Head & Hair -->
    <circle cx="2" cy="-4" r="7" fill="#fde68a"/>
    <path d="M -5 -6 Q 2 -12 8 -4" fill="#78350f"/>
    <!-- Arms -->
    <path d="M -4 10 L -16 18 L -12 25" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8 8 L 18 2 L 22 8" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Legs -->
    <path d="M -2 25 L -12 38 L -5 42" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 6 24 L 14 34 L 22 30" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Character 3 (Foreground Main Runner - Dynamic & Clear) -->
  <g transform="translate(100, 195)">
    <!-- Shadow -->
    <ellipse cx="2" cy="22" rx="16" ry="7" fill="url(#shadow)"/>

    <!-- Speed Lines -->
    <line x1="-35" y1="-5" x2="-15" y2="-5" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="-40" y1="10" x2="-20" y2="10" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-30" y1="22" x2="-10" y2="22" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Back Leg (Stiding forward) -->
    <path d="M -4 12 L -18 22 L -28 15" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -28 15 L -34 14" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

    <!-- Torso (Leaning forward into the run) -->
    <path d="M -12,2 C -2,-4 8,12 2,18 C -4,24 -14,10 -12,2 Z" fill="#ec4899"/>
    <!-- Running Stripe on Shirt -->
    <path d="M -8,4 C -2,0 3,8 0,14" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="-10" cy="-7" r="9" fill="#fde68a"/>
    <!-- Hair / Headband -->
    <path d="M -19 -7 Q -12 -18 -1 -9" fill="#1e293b"/>
    <rect x="-18" y="-10" width="14" height="4" rx="2" fill="#38bdf8"/>
    <!-- Determined Face Profile -->
    <circle cx="-15" cy="-6" r="1.5" fill="#1e293b"/>
    <path d="M -18 -2 Q -15 1 -12 -1" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Front Arm (Pumping) -->
    <path d="M -5 2 L 8 -4 L 14 3" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="3" r="3" fill="#fde68a"/>

    <!-- Back Arm -->
    <path d="M -10 10 L -22 15" fill="none" stroke="#be185d" stroke-width="5" stroke-linecap="round"/>

    <!-- Front Leg (Planting/Pushing) -->
    <path d="M 2 16 L 16 12 L 24 20" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoe -->
    <path d="M 24 20 L 30 21" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Ambient Environmental Elements (Trees/Bushes on perimeter) -->
  <circle cx="10" cy="120" r="14" fill="#047857"/>
  <circle cx="22" cy="115" r="18" fill="#059669"/>
  <circle cx="35" cy="122" r="12" fill="#047857"/>

  <circle cx="215" cy="122" r="15" fill="#047857"/>
  <circle cx="230" cy="118" r="18" fill="#059669"/>

  <!-- Glowing atmospheric highlights -->
  <circle cx="180" cy="50" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="60" cy="30" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="120" cy="40" r="2" fill="#ffffff" opacity="0.5"/>
</svg>