<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Comic Book / Storybook -->
  <rect x="40" y="100" width="160" height="110" rx="8" fill="#f1f5f9"/>
  <path d="M50 120 Q120 150 190 120" stroke="#1e293b" stroke-width="3" fill="none"/>
  <circle cx="80" cy="150" r="25" fill="#fbbf24"/>
  <path d="M65 140 Q80 155 95 140" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Character Head (Laughing) -->
  <g transform="translate(120, 80)">
    <circle cx="0" cy="0" r="45" fill="#fb923c"/>
    <!-- Eyes -->
    <path d="M-20 -10 L-10 -20 M-10 -10 L-20 -20" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 -20 L20 -10 M20 -20 L10 -10" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M-25 10 Q0 40 25 10" stroke="#1e293b" stroke-width="5" fill="#ec4899"/>
    <!-- Teeth -->
    <rect x="-15" y="10" width="30" height="10" fill="#ffffff"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="50" r="8" fill="#38bdf8"/>
  <circle cx="30" cy="60" r="5" fill="#10b981"/>
  <path d="M180 80 L190 70" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
</svg>