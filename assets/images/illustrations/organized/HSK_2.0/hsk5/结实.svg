<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Workbench Gradient -->
    <linearGradient id="bench-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Metal Anvil/Vice Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Glowing Amber Accent -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Texture / Rack -->
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Heavy Chain Gradients -->
    <linearGradient id="chain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="110" r="90" fill="url(#glow)"/>

  <!-- Background Environment (Workshop Shelf & Gear) -->
  <g opacity="0.4">
    <!-- Back Wall Panel Lines -->
    <line x1="30" y1="40" x2="210" y2="40" stroke="#334155" stroke-width="2"/>
    <line x1="30" y1="80" x2="210" y2="80" stroke="#334155" stroke-width="2"/>
    
    <!-- Heavy Duty Shelf -->
    <rect x="40" y="72" width="160" height="8" rx="2" fill="url(#wood-grad)"/>
    <path d="M60 80 L60 95 L68 95 L68 80 Z" fill="#64748b"/>
    <path d="M180 80 L180 95 L188 95 L188 80 Z" fill="#64748b"/>
    
    <!-- Background Tools on Shelf -->
    <!-- Gear/Cog -->
    <circle cx="85" cy="55" r="14" fill="#475569"/>
    <circle cx="85" cy="55" r="6" fill="#1e293b"/>
    <!-- Hardhat -->
    <path d="M130 62 C130 52 140 48 150 48 C160 48 170 52 170 62 Z" fill="#fb923c"/>
    <path d="M125 62 L175 62 L172 65 L128 65 Z" fill="#ea580c"/>
  </g>

  <!-- Hanging Heavy-Duty Chain (Left) -->
  <path d="M50 20 Q40 40 50 60 Q60 80 50 100" fill="none" stroke="url(#chain-grad)" stroke-width="8" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M50 40 Q40 55 50 70" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>

  <!-- Workbench Surface -->
  <path d="M20 180 L220 180 L230 215 L10 215 Z" fill="url(#bench-grad)" filter="url(#shadow)"/>
  <!-- Workbench Front Edge -->
  <rect x="10" y="175" width="220" height="8" rx="3" fill="#475569"/>
  <rect x="20" y="212" width="200" height="4" rx="2" fill="#0f172a"/>

  <!-- MAIN SUBJECT: The Sturdy Metal Industrial Vice / Clamp (representing "chắc chắn") -->
  <g id="sturdy-vice" filter="url(#shadow)">
    <!-- Vice Base Mounted on Bench -->
    <path d="M85 160 L155 160 L165 178 L75 178 Z" fill="#334155"/>
    <rect x="95" y="150" width="50" height="12" rx="2" fill="url(#metal-grad)"/>

    <!-- Fixed Jaw (Back) -->
    <path d="M100 110 L140 110 L145 150 L95 150 Z" fill="url(#metal-grad)"/>
    <!-- Jaw Face Grid (Sturdy Grip Texture) -->
    <line x1="105" y1="120" x2="135" y2="120" stroke="#334155" stroke-width="2"/>
    <line x1="105" y1="130" x2="135" y2="130" stroke="#334155" stroke-width="2"/>
    <line x1="105" y1="140" x2="135" y2="140" stroke="#334155" stroke-width="2"/>

    <!-- Solid Steel Beam / Slide -->
    <rect x="105" y="125" width="70" height="15" rx="3" fill="#64748b"/>

    <!-- Moving Jaw (Front) with Powerful Clamping Action -->
    <path d="M150 105 L180 105 L185 155 L145 155 Z" fill="url(#metal-grad)"/>
    <rect x="145" y="150" width="40" height="8" rx="2" fill="#334155"/>

    <!-- Tightening Screw Rod & T-Handle -->
    <rect x="180" y="123" width="30" height="8" rx="2" fill="#475569"/>
    <!-- T-Bar Handle -->
    <rect x="202" y="105" width="6" height="44" rx="3" fill="#fbbf24" filter="url(#shadow)"/>
    <circle cx="205" cy="107" r="4" fill="#f59e0b"/>
    <circle cx="205" cy="147" r="4" fill="#f59e0b"/>
  </g>

  <!-- STURDY OBJECT CLAMPED: Thick Titanium I-Beam (Showing resilience under pressure) -->
  <g id="clamped-beam" filter="url(#shadow)">
    <!-- The Beam passing through the vice horizontally -->
    <path d="M40 115 L200 115 L200 145 L40 145 Z" fill="#10b981"/>
    <!-- I-Beam Flanges & Highlights for Metallic Sheen -->
    <rect x="40" y="112" width="160" height="6" rx="2" fill="#34d399"/>
    <rect x="40" y="144" width="160" height="6" rx="2" fill="#059669"/>
    <path d="M50 123 L190 123" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Rivet / Bolt Details on Beam (Indicates robust construction) -->
    <circle cx="65" cy="130" r="3" fill="#065f46"/>
    <circle cx="65" cy="130" r="1" fill="#34d399"/>

    <circle cx="85" cy="130" r="3" fill="#065f46"/>
    <circle cx="85" cy="130" r="1" fill="#34d399"/>
  </g>

  <!-- ACTION & ENERGY FX (Indicating extreme sturdiness, strength, durability) -->
  <g id="strength-fx">
    <!-- Energy Spark / Impact Flash top left of clamp -->
    <path d="M120 95 L125 105 L135 108 L125 111 L120 121 L115 111 L105 108 L115 105 Z" fill="#fbbf24" filter="url(#shadow)"/>
    <!-- Small sparks -->
    <circle cx="145" cy="95" r="2.5" fill="#38bdf8"/>
    <circle cx="95" cy="100" r="2" fill="#fb923c"/>
    <path d="M150 85 L154 92 L161 96 L154 100 L150 107 L146 100 L139 96 L146 92 Z" fill="#38bdf8" transform="scale(0.6) translate(80, 40)"/>

    <!-- Shield / Durability Aura Lines (Subtle curved accent around the heavy clamp) -->
    <path d="M90 90 Q120 75 150 90" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M100 82 Q120 70 140 82" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles -->
  <circle cx="35" cy="150" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="210" cy="165" r="2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="170" cy="195" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="70" cy="190" r="1.5" fill="#34d399" opacity="0.8"/>
</svg>