<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: A marathon race scene -->
  <path d="M0 180 Q 120 150 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Distant runners -->
  <circle cx="180" cy="165" r="8" fill="#475569"/>
  <circle cx="200" cy="168" r="6" fill="#475569"/>
  
  <!-- Main Subject: A young, energetic runner stopping to catch breath, pointing forward -->
  <!-- Body -->
  <path d="M80 120 C 80 100 100 90 110 90 L 130 90 C 140 90 160 100 160 120 L 150 200 L 90 200 Z" fill="#fb923c"/>
  <!-- Head -->
  <circle cx="120" cy="80" r="25" fill="#fde68a"/>
  <!-- Hair -->
  <path d="M100 75 Q 120 50 140 75 Z" fill="#78350f"/>
  <!-- Arm pointing -->
  <path d="M145 110 L 180 90" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
  <!-- Leg -->
  <path d="M100 200 L 100 230" stroke="#fb923c" stroke-width="14" stroke-linecap="round"/>
  <path d="M140 200 L 140 230" stroke="#fb923c" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Contextual Prop: A heavy backpack on the ground to emphasize the 'even more' aspect -->
  <rect x="30" y="170" width="40" height="50" rx="5" fill="#ec4899"/>
  <rect x="35" y="175" width="30" height="20" rx="2" fill="#fbcfe8"/>
  
  <!-- Action lines/Atmosphere -->
  <path d="M190 80 L 210 70 M200 60 L 220 50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="220" cy="100" r="3" fill="#10b981"/>
  <circle cx="210" cy="120" r="4" fill="#38bdf8"/>
</svg>