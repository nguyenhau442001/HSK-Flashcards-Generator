<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="65" fill="#475569"/>
  <rect x="190" y="175" width="10" height="65" fill="#475569"/>
  
  <!-- Desk Lamp -->
  <path d="M170 160 L185 100 L195 100 L180 160" fill="#475569"/>
  <circle cx="190" cy="95" r="15" fill="#fbbf24" opacity="0.3"/>
  <circle cx="190" cy="95" r="8" fill="#f59e0b"/>
  
  <!-- Paper and Pen -->
  <rect x="60" y="130" width="100" height="120" rx="2" fill="#e2e8f0" transform="rotate(-5 110 190)"/>
  <path d="M80 140 L130 135 L132 150 L82 155 Z" fill="#f1f5f9"/>
  <path d="M90 145 L110 143" stroke="#334155" stroke-width="1"/>
  <path d="M90 150 L115 148" stroke="#334155" stroke-width="1"/>
  <path d="M120 138 L125 155 L128 154 L123 137 Z" fill="#ec4899"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M20 150 C20 120, 60 110, 80 110 C100 110, 140 120, 140 150 L140 180 L20 180 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="80" cy="90" r="30" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M55 85 C55 60, 70 50, 80 50 C90 50, 105 60, 105 85 Z" fill="#475569"/>
    <!-- Arms -->
    <path d="M40 120 L70 140" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <path d="M120 120 L90 140" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="70" cy="85" r="3" fill="#1e293b"/>
    <circle cx="90" cy="85" r="3" fill="#1e293b"/>
  </g>
  
  <!-- Bookshelf background hint -->
  <rect x="20" y="20" width="40" height="10" rx="2" fill="#334155"/>
  <rect x="25" y="35" width="30" height="10" rx="2" fill="#334155"/>
</svg>