<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background elements: A row of identical blue books -->
  <rect x="40" y="100" width="20" height="80" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="70" y="100" width="20" height="80" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="100" y="100" width="20" height="80" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="130" y="100" width="20" height="80" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="160" y="100" width="20" height="80" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="190" y="100" width="20" height="80" rx="2" fill="#38bdf8" opacity="0.6"/>
  
  <!-- The 'Individual' (cá biệt) subject: A bright orange book standing out -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="30" height="120" rx="4" fill="#fb923c"/>
    <rect x="5" y="10" width="20" height="5" rx="1" fill="#fff" opacity="0.3"/>
    <rect x="5" y="20" width="20" height="5" rx="1" fill="#fff" opacity="0.3"/>
    <circle cx="15" cy="90" r="8" fill="#f59e0b"/>
  </g>
  
  <!-- Spotlight effect on the individual item -->
  <path d="M115 50 L145 200 L85 200 Z" fill="url(#grad1)" opacity="0.15"/>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>