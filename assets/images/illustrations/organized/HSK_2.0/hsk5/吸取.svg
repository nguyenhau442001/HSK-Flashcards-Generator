<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The "Experience" Object (A glowing, cracked stone being repaired with gold) -->
  <g transform="translate(120, 140)">
    <path d="M-40 0 C-40 -40 -20 -60 0 -60 C20 -60 40 -40 40 0 C40 40 20 60 0 60 C-20 60 -40 40 -40 0 Z" fill="#475569"/>
    <!-- Gold veins (Kintsugi style) -->
    <path d="M-20 -20 L0 0 L20 -30 M0 0 L-10 30 M0 0 L30 10" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <!-- Glowing particles being absorbed -->
    <circle cx="-60" cy="-40" r="4" fill="#fbbf24">
      <animate attributeName="cx" from="-60" to="-10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" from="-40" to="-10" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-70" cy="-20" r="3" fill="#fb923c">
      <animate attributeName="cx" from="-70" to="-10" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" from="-20" to="10" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Magnifying Glass (The tool of learning/extracting) -->
  <g transform="translate(160, 80) rotate(20)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <rect x="-5" y="30" width="10" height="40" fill="#94a3b8"/>
    <circle cx="0" cy="0" r="20" fill="#38bdf8" fill-opacity="0.2"/>
  </g>

  <!-- Floating books/papers in background -->
  <rect x="20" y="60" width="40" height="50" rx="4" fill="#64748b"/>
  <rect x="25" y="70" width="30" height="5" fill="#1e293b"/>
  <rect x="25" y="85" width="30" height="5" fill="#1e293b"/>
  
  <path d="M190 120 L220 110 L220 140 L190 150 Z" fill="#10b981"/>
</svg>