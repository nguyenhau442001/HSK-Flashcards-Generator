<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wall & Floor Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="90" r="80" fill="url(#lampGlow)" />

  <!-- Room Interior Environment -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="135" fill="url(#wallGrad)" />

  <!-- Repetitive Monotonous Wall Art (Multiple Identical Gray Boxes) -->
  <g fill="#475569">
    <rect x="40" y="40" width="25" height="35" rx="2" />
    <rect x="75" y="40" width="25" height="35" rx="2" />
    <rect x="110" y="40" width="25" height="35" rx="2" />
    <rect x="145" y="40" width="25" height="35" rx="2" />
    <rect x="180" y="40" width="25" height="35" rx="2" />
  </g>
  <g fill="#334155">
    <rect x="44" y="44" width="17" height="27" rx="1" />
    <rect x="79" y="44" width="17" height="27" rx="1" />
    <rect x="114" y="44" width="17" height="27" rx="1" />
    <rect x="149" y="44" width="17" height="27" rx="1" />
    <rect x="184" y="44" width="17" height="27" rx="1" />
  </g>

  <!-- Floor Surface -->
  <path d="M20 155 L220 155 L230 220 L10 220 Z" fill="url(#floorGrad)" />
  <path d="M20 155 L220 155" stroke="#64748b" stroke-width="2" opacity="0.4" />

  <!-- Repetitive Stack of Identical Brown Boxes in Background -->
  <g stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round">
    <!-- Box 1 -->
    <polygon points="185,155 210,147 220,165 195,173" fill="#64748b" />
    <polygon points="160,155 185,155 195,173 170,173" fill="#475569" />
    <!-- Box 2 -->
    <polygon points="185,138 210,130 220,147 195,155" fill="#64748b" />
    <polygon points="160,138 185,138 195,155 170,155" fill="#475569" />
  </g>

  <!-- Office Desk -->
  <!-- Desk Top -->
  <path d="M30 145 L210 145 L220 160 L20 160 Z" fill="url(#deskGrad)" />
  <!-- Desk Front Panel -->
  <rect x="30" y="160" width="180" height="45" fill="#1e293b" />
  <rect x="40" y="168" width="160" height="30" fill="#0f172a" rx="4" />
  <!-- Desk Legs -->
  <rect x="40" y="205" width="10" height="15" fill="#334155" />
  <rect x="190" y="205" width="10" height="15" fill="#334155" />

  <!-- Monotonous Items on Desk -->
  <!-- Identical Gray Files/Folders -->
  <g fill="#64748b" stroke="#334155" stroke-width="1">
    <rect x="45" y="125" width="8" height="25" rx="1" />
    <rect x="55" y="125" width="8" height="25" rx="1" />
    <rect x="65" y="125" width="8" height="25" rx="1" />
    <rect x="75" y="125" width="8" height="25" rx="1" />
  </g>

  <!-- Laptop (Displaying identical gray screen) -->
  <path d="M95,145 L145,145 L155,155 L85,155 Z" fill="#64748b" />
  <rect x="100" y="110" width="40" height="35" rx="2" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <!-- Screen Content: Boring straight flat chart line -->
  <line x1="105" y1="130" x2="135" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2,2" />

  <!-- Muted Lamp -->
  <path d="M175,145 L185,145 L182,110 L178,110 Z" fill="#64748b" />
  <path d="M168,110 L194,110 L190,95 L172,95 Z" fill="#f59e0b" />

  <!-- The Protagonist: Depressed/Bored Character -->
  <g transform="translate(100, 75)">
    <!-- Body/Shirt (Muted uniform dark blue-gray) -->
    <path d="M15,45 C15,35 25,25 40,25 C55,25 65,35 65,45 L75,80 C75,80 60,85 40,85 C20,85 5,80 5,80 Z" fill="#334155" />
    
    <!-- Slumped Shoulders / Arms -->
    <path d="M15,45 C10,55 5,70 10,80" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" />
    <path d="M65,45 C70,55 75,70 70,80" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="34" y="18" width="12" height="12" fill="#cbd5e1" />

    <!-- Drooped Head (Bored expression, eyes closed/flat) -->
    <circle cx="40" cy="15" r="14" fill="#cbd5e1" />
    
    <!-- Hair (Plain dark brown/slate) -->
    <path d="M26,14 C26,5 34,2 40,2 C46,2 54,5 54,14 C54,14 48,10 40,10 C32,10 26,14 26,14 Z" fill="#1e293b" />

    <!-- Bored Facial Features (Simple flat lines) -->
    <!-- Closed / Uninterested Eyes -->
    <line x1="33" y1="13" x2="38" y2="14" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
    <line x1="42" y1="14" x2="47" y2="13" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
    <!-- Flat Mouth (Neutral/Meh) -->
    <line x1="36" y1="21" x2="44" y2="21" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Subtle Atmospheric Dust/Motes (Adding to the stagnant feel) -->
  <circle cx="60" cy="90" r="1.5" fill="#94a3b8" opacity="0.4" />
  <circle cx="150" cy="65" r="1" fill="#94a3b8" opacity="0.3" />
  <circle cx="130" cy="115" r="2" fill="#94a3b8" opacity="0.2" />

</svg>