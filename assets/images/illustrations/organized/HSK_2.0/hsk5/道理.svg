<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Definitions -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="scaleArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Atmospheric Lighting Elements -->
  <circle cx="120" cy="90" r="70" fill="#38bdf8" opacity="0.04" filter="url(#glow)"/>
  <circle cx="120" cy="110" r="50" fill="#fbbf24" opacity="0.06" filter="url(#glow)"/>

  <!-- Background Environment: Bookshelf / Study backdrop -->
  <path d="M40 180 L200 180 L200 184 L40 184 Z" fill="#0f172a" opacity="0.8"/>
  
  <!-- Desk surface -->
  <path d="M20 180 L220 180 L230 215 L10 215 Z" fill="url(#deskGrad)"/>
  <path d="M20 180 L220 180 L220 183 L20 183 Z" fill="#475569" opacity="0.5"/>

  <!-- Books and props on desk (contextual depth) -->
  <!-- Red book stack -->
  <rect x="35" y="155" width="36" height="25" rx="3" fill="#dc2626"/>
  <rect x="33" y="163" width="40" height="8" rx="2" fill="#b91c1c"/>
  <path d="M35 158 L71 158" stroke="#f8fafc" stroke-width="1.5" opacity="0.4"/>
  <!-- Blue notebook -->
  <rect x="170" y="163" width="35" height="17" rx="2" fill="#2563eb"/>
  <path d="M173 167 L202 167 M173 171 L202 171" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>

  <!-- MAIN SUBJECT: The Scale of Justice/Logic (Lý lẽ / Đạo lý) -->
  <!-- Base Stand -->
  <path d="M100 195 L140 195 L135 180 L105 180 Z" fill="#475569"/>
  <ellipse cx="120" cy="195" rx="24" ry="5" fill="#64748b"/>
  
  <!-- Vertical Pillar -->
  <rect x="116" y="80" width="8" height="105" rx="3" fill="url(#scaleArm)"/>
  <circle cx="120" cy="80" r="10" fill="url(#goldGrad)"/>
  <circle cx="120" cy="80" r="5" fill="#78350f"/>

  <!-- Scale Beam (Tilted to show weight of logic/argument) -->
  <g transform="rotate(-8, 120, 80)">
    <!-- Main horizontal arm -->
    <path d="M60 76 L180 76 L180 84 L60 84 Z" fill="url(#goldGrad)"/>
    <!-- Decorative ends -->
    <circle cx="60" cy="80" r="4" fill="#d97706"/>
    <circle cx="180" cy="80" r="4" fill="#d97706"/>

    <!-- Left Chain & Pan (Lower, representing solid logic/evidence) -->
    <path d="M65 80 L65 125" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M60 80 L75 125" stroke="#fbbf24" stroke-width="1"/>
    <path d="M70 80 L55 125" stroke="#fbbf24" stroke-width="1"/>
    <!-- Left Dish -->
    <path d="M45 125 C45 135 95 135 95 125 Z" fill="url(#goldGrad)"/>
    <ellipse cx="70" cy="125" rx="25" ry="5" fill="#f59e0b"/>

    <!-- Glowing Logical Artifacts inside Left Pan (The "Reason/道理") -->
    <circle cx="70" cy="115" r="12" fill="url(#cyanGlow)" filter="url(#glow)"/>
    <path d="M64 115 L70 108 L76 115 L70 122 Z" fill="#f8fafc"/>

    <!-- Right Chain & Pan (Higher, light/empty) -->
    <path d="M175 80 L175 110" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M170 80 L185 110" stroke="#fbbf24" stroke-width="1"/>
    <path d="M180 80 L165 110" stroke="#fbbf24" stroke-width="1"/>
    <!-- Right Dish -->
    <path d="M155 110 C155 118 205 118 205 110 Z" fill="url(#goldGrad)"/>
    <ellipse cx="180" cy="110" rx="25" ry="5" fill="#f59e0b"/>
  </g>

  <!-- Floating Sparkles / Concept Embellishments (representing clarity, thought, logic) -->
  <g fill="#38bdf8">
    <circle cx="85" cy="50" r="2.5" opacity="0.8"/>
    <circle cx="155" cy="45" r="3.5" opacity="0.9"/>
    <circle cx="175" cy="65" r="1.5" opacity="0.7"/>
    <!-- Star sparkle left -->
    <path d="M88 40 L89.5 44 L93.5 45.5 L89.5 47 L88 51 L86.5 47 L82.5 45.5 L86.5 44 Z" fill="#fbbf24" opacity="0.85"/>
  </g>

  <g fill="#fb923c">
    <!-- Star sparkle right -->
    <path d="M150 60 L151 63 L154 64 L151 65 L150 68 L149 65 L146 64 L149 63 Z" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Frame Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>
</svg>