<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Console Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Emergency Red Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Warning Amber Light Gradient -->
    <radialGradient id="amberLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Warning Light Beams in Background -->
  <path d="M 40,0 L 0,160 L 90,160 Z" fill="#ef4444" opacity="0.08" />
  <path d="M 200,0 L 240,160 L 150,160 Z" fill="#ef4444" opacity="0.08" />
  
  <!-- Environment: Control Room Wall Panels & Pipes -->
  <g fill="#475569" opacity="0.4">
    <rect x="20" y="20" width="50" height="8" rx="2" />
    <rect x="80" y="20" width="80" height="8" rx="2" />
    <rect x="170" y="20" width="50" height="8" rx="2" />
  </g>
  <path d="M 0,40 H 240" stroke="#334155" stroke-width="2" />

  <!-- Rotating Warning Beacon Light (Top Center) -->
  <g transform="translate(120, 25)">
    <!-- Light Beam Glow -->
    <circle cx="0" cy="0" r="45" fill="url(#amberLight)" />
    <!-- Base -->
    <path d="M -15,10 H 15 L 12,20 H -12 Z" fill="#64748b" />
    <!-- Glass Dome -->
    <path d="M -15,10 C -15,-5 15,-5 15,10 Z" fill="#fbbf24" filter="url(#glow)" opacity="0.9" />
    <path d="M -15,10 C -15,-5 15,-5 15,10 Z" fill="#fef08a" />
    <!-- Cap -->
    <ellipse cx="0" cy="-3" rx="6" ry="2" fill="#94a3b8" />
  </g>

  <!-- Main Control Console Desk -->
  <g filter="url(#shadow)">
    <!-- Desk Base/Front -->
    <path d="M 20,160 L 40,210 H 200 L 220,160 Z" fill="#334155" />
    <!-- Desk Surface Top -->
    <path d="M 25,145 L 20,160 H 220 L 215,145 Z" fill="#64748b" />
    <path d="M 25,145 H 215 L 200,135 H 40 Z" fill="#475569" />
  </g>

  <!-- Holographic / Main Screen Display -->
  <g transform="translate(120, 95)" filter="url(#shadow)">
    <!-- Screen Frame -->
    <rect x="-65" y="-45" width="130" height="80" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <!-- Screen Glow Background -->
    <rect x="-61" y="-41" width="122" height="72" rx="6" fill="url(#screenGlow)" />
    
    <!-- Radar / Alert Graph inside Screen -->
    <circle cx="0" cy="-5" r="22" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8" />
    <circle cx="0" cy="-5" r="14" fill="none" stroke="#f87171" stroke-width="1" opacity="0.5" />
    
    <!-- Pulsing Warning Exclamation (Simplified Vector Graphic Representation) -->
    <path d="M 0,-17 L 4,-3 H -4 Z" fill="#ef4444" />
    <circle cx="0" cy="2" r="2" fill="#ef4444" />

    <!-- Animated Data Waves -->
    <path d="M -50,20 Q -30,5 -10,20 T 30,10 T 50,15" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <path d="M -50,25 Q -25,12 0,25 T 50,18" fill="none" stroke="#ef4444" stroke-width="2" />
  </g>

  <!-- Emergency Control Panel Equipment & Buttons -->
  <!-- Left Toggle Switches & Small Lights -->
  <g transform="translate(50, 160)">
    <rect x="-15" y="-10" width="30" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <circle cx="-7" cy="0" r="3" fill="#10b981" />
    <circle cx="7" cy="0" r="3" fill="#ef4444" filter="url(#glow)" />
  </g>

  <!-- Right Status Indicator Lights -->
  <g transform="translate(190, 160)">
    <rect x="-15" y="-10" width="30" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#fbbf24" filter="url(#glow)" />
  </g>

  <!-- CENTRAL PIECE: The Giant Emergency Push Button (Action Focal Point) -->
  <g transform="translate(120, 168)" filter="url(#shadow)">
    <!-- Outer Yellow Bezel/Ring -->
    <ellipse cx="0" cy="6" rx="28" ry="14" fill="#d97706" />
    <ellipse cx="0" cy="4" rx="28" ry="14" fill="#fbbf24" />
    
    <!-- Button Housing Rim -->
    <ellipse cx="0" cy="2" rx="24" ry="11" fill="#b91c1c" />

    <!-- Big Red Dome Button (Pressed/Active state appearance) -->
    <ellipse cx="0" cy="-2" rx="20" ry="10" fill="url(#btnGrad)" />
    
    <!-- Highlight on Dome -->
    <ellipse cx="-6" cy="-5" rx="10" ry="4" fill="#fca5a5" opacity="0.5" />
    
    <!-- Heavy Action Motion Lines radiating from the urgent button -->
    <path d="M -32,-8 C -38,-2 -38,10 -32,16" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 32,-8 C 38,-2 38,10 32,16" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Floating Spark / Alert Particles for High-Energy Atmosphere -->
  <g fill="#fbbf24">
    <circle cx="85" cy="120" r="2" filter="url(#glow)" />
    <circle cx="155" cy="115" r="2.5" filter="url(#glow)" />
    <circle cx="100" cy="65" r="1.5" />
    <circle cx="140" cy="70" r="2" />
  </g>
  <g fill="#ef4444">
    <circle cx="70" cy="140" r="3" filter="url(#glow)" />
    <circle cx="170" cy="135" r="2.5" filter="url(#glow)" />
  </g>

  <!-- Foreground Atmospheric Vignette / Frame Border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#64748b" stroke-width="2" opacity="0.3" />
</svg>