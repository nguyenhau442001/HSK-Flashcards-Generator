<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Stage Spotlight Gradient -->
    <radialGradient id="stageSpot" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Energy/Talent Burst Gradient -->
    <radialGradient id="energyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Piano Key Gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Sparkle Shape -->
    <g id="sparkle">
      <path d="M0 -6 C1 -2 2 -1 6 0 C2 1 1 2 0 6 C-1 2 -2 1 -6 0 C-2 -1 -1 -2 0 -6 Z" fill="#fde047" />
    </g>
    
    <!-- Music Note -->
    <g id="note1">
      <path d="M0,4 A3,3 0 1,1 3,1 L3,-8 L9,-6 L9,-3 A3,3 0 1,1 12,-6 L12,-12 L3,-15 L0,-14 Z" fill="#38bdf8" />
    </g>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Stage Lighting Background Effect -->
  <circle cx="120" cy="30" r="110" fill="url(#stageSpot)" />
  <path d="M40,0 L120,160 L200,0 Z" fill="#38bdf8" opacity="0.04" />
  <path d="M80,0 L120,160 L160,0 Z" fill="#fbbf24" opacity="0.05" />

  <!-- Environment: Floating Performance Energy & Sparkles -->
  <circle cx="120" cy="110" r="70" fill="url(#energyGlow)" />
  
  <use href="#sparkle" x="70" y="60" transform="scale(1.2)" />
  <use href="#sparkle" x="165" y="75" transform="scale(0.8)" />
  <use href="#sparkle" x="90" y="140" transform="scale(1)" />
  <use href="#sparkle" x="150" y="130" transform="scale(1.4)" />
  <use href="#sparkle" x="120" y="45" transform="scale(0.9)" />

  <!-- Floating Musical Notes representing expression/performance -->
  <use href="#note1" x="50" y="100" transform="rotate(-15) scale(0.9)" opacity="0.8" />
  <use href="#note1" x="180" y="110" transform="rotate(20) scale(1.1)" opacity="0.85" />
  <use href="#note1" x="100" y="30" transform="rotate(5) scale(0.8)" opacity="0.7" />

  <!-- Piano Grand Body (Back / Interior) -->
  <path d="M 50,150 L 190,150 L 175,120 L 65,120 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <!-- Piano Fallboard & Music Stand -->
  <rect x="60" y="120" width="120" height="8" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <path d="M 85,120 L 95,95 L 145,95 L 155,120 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <!-- Open Sheet Music on Stand -->
  <rect x="98" y="100" width="44" height="22" rx="1" fill="#f8fafc" />
  <path d="M104,106 H120 M104,111 H116 M126,106 H136 M126,111 H132" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Piano Keyboard Area -->
  <rect x="52" y="128" width="136" height="30" rx="3" fill="#0f172a" />
  <!-- White Keys (Repeated simplified representation) -->
  <g fill="url(#keyGrad)" stroke="#cbd5e1" stroke-width="0.5">
    <rect x="55" y="129" width="8" height="26" rx="1" />
    <rect x="64" y="129" width="8" height="26" rx="1" />
    <rect x="73" y="129" width="8" height="26" rx="1" />
    <rect x="82" y="129" width="8" height="26" rx="1" />
    <rect x="91" y="129" width="8" height="26" rx="1" />
    <rect x="100" y="129" width="8" height="26" rx="1" />
    <rect x="109" y="129" width="8" height="26" rx="1" />
    <rect x="118" y="129" width="8" height="26" rx="1" />
    <rect x="127" y="129" width="8" height="26" rx="1" />
    <rect x="136" y="129" width="8" height="26" rx="1" />
    <rect x="145" y="129" width="8" height="26" rx="1" />
    <rect x="154" y="129" width="8" height="26" rx="1" />
    <rect x="163" y="129" width="8" height="26" rx="1" />
    <rect x="172" y="129" width="8" height="26" rx="1" />
  </g>
  <!-- Black Keys -->
  <g fill="#0f172a">
    <rect x="61" y="129" width="5" height="15" rx="0.5" />
    <rect x="70" y="129" width="5" height="15" rx="0.5" />
    <rect x="88" y="129" width="5" height="15" rx="0.5" />
    <rect x="97" y="129" width="5" height="15" rx="0.5" />
    <rect x="106" y="129" width="5" height="15" rx="0.5" />
    <rect x="124" y="129" width="5" height="15" rx="0.5" />
    <rect x="133" y="129" width="5" height="15" rx="0.5" />
    <rect x="151" y="129" width="5" height="15" rx="0.5" />
    <rect x="160" y="129" width="5" height="15" rx="0.5" />
    <rect x="169" y="129" width="5" height="15" rx="0.5" />
  </g>

  <!-- Piano Base/Legs Structure -->
  <path d="M 60,158 L 65,195 L 75,195 L 70,158 Z" fill="#0f172a" />
  <path d="M 180,158 L 175,195 L 165,195 L 170,158 Z" fill="#0f172a" />

  <!-- Character (Musician / Performer exhibiting full capability/talents) -->
  <!-- Torso & Jacket -->
  <path d="M 95,145 C 95,125 145,125 145,145 L 155,185 L 85,185 Z" fill="url(#jacketGrad)" />
  <!-- Shirt Collar & Tie/Bow -->
  <path d="M 110,135 L 120,148 L 130,135 Z" fill="#f8fafc" />
  <circle cx="120" cy="142" r="4" fill="#fbbf24" />

  <!-- Head & Face (Expressive, joyful, eyes closed in peak performance) -->
  <circle cx="120" cy="98" r="22" fill="#ffd59e" />
  <!-- Hair (Stylish dynamic anime/cartoon hair) -->
  <path d="M 98,95 C 95,75 110,70 125,72 C 140,70 148,82 145,100 C 145,100 148,85 135,80 C 122,75 105,82 98,95 Z" fill="#1e293b" />
  <path d="M 100,92 C 98,82 105,75 115,74 Z" fill="#334155" />

  <!-- Face Features: Joyful expression with closed happy eyes -->
  <path d="M 110,95 Q 115,90 120,95" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 120,95 Q 125,90 130,95" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Rosy Cheeks -->
  <circle cx="108" cy="101" r="4" fill="#fb7185" opacity="0.6" />
  <circle cx="132" cy="101" r="4" fill="#fb7185" opacity="0.6" />
  <!-- Big Happy Open Smile -->
  <path d="M 112,102 Q 120,112 128,102 Z" fill="#be123c" />

  <!-- Dynamic Arms Reaching Out to Play (Showing 'Phát huy' - unleashing skills) -->
  <!-- Left Arm -->
  <path d="M 98,135 C 80,135 70,125 60,118" fill="none" stroke="#3730a3" stroke-width="12" stroke-linecap="round" />
  <!-- Left Hand / Fingers on Keys -->
  <circle cx="58" cy="116" r="6" fill="#ffd59e" />

  <!-- Right Arm (Raised higher, brimming with energy) -->
  <path d="M 142,135 C 160,130 170,115 178,105" fill="none" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" />
  <!-- Right Hand -->
  <circle cx="180" cy="103" r="6" fill="#ffd59e" />

  <!-- Foreground Dynamic Waves / Energy Rings representing absolute peak performance ("phát huy tối đa") -->
  <path d="M 35,160 C 50,140 70,135 90,145" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 205,160 C 190,140 170,135 150,145" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 25,185 C 50,165 80,160 120,165 C 160,160 190,165 215,185" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Extra ambient glowing particles near hands -->
  <circle cx="55" cy="110" r="3" fill="#38bdf8" />
  <circle cx="185" cy="98" r="3.5" fill="#fbbf24" />
  <circle cx="170" cy="90" r="2" fill="#38bdf8" />
  <circle cx="68" cy="122" r="2" fill="#f43f5e" />

  <!-- Stage Floor Gradient Base -->
  <rect x="0" y="210" width="240" height="30" fill="#090d16" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" />
  <ellipse cx="120" cy="210" rx="90" ry="8" fill="#38bdf8" opacity="0.15" />
</svg>