<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stadium Floor Grid Gradient -->
    <linearGradient id="floorGrad" x1="120" y1="160" x2="120" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gold Medal Gradient -->
    <linearGradient id="goldGrad" x1="80" y1="90" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>

    <!-- Silver Podium Gradient -->
    <linearGradient id="podium2" x1="40" y1="140" x2="90" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>

    <!-- Gold Podium Gradient (Center) -->
    <linearGradient id="podium1" x1="95" y1="120" x2="145" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>

    <!-- Bronze Podium Gradient -->
    <linearGradient id="podium3" x1="150" y1="150" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Ribbon Gradient (Red) -->
    <linearGradient id="ribbonRed" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Ribbon Gradient (Blue) -->
    <linearGradient id="ribbonBlue" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Stadium Lights / Rays -->
  <g opacity="0.15">
    <polygon points="120,0 40,240 80,240" fill="#38bdf8"/>
    <polygon points="120,0 160,240 200,240" fill="#38bdf8"/>
    <polygon points="120,0 90,240 150,240" fill="#f59e0b" opacity="0.3"/>
  </g>

  <!-- Confetti / Atmosphere -->
  <circle cx="45" cy="50" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="195" cy="40" r="2.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="210" cy="90" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="30" cy="110" r="3.5" fill="#10b981" opacity="0.8"/>
  <rect x="70" y="30" width="4" height="6" rx="1" fill="#ec4899" transform="rotate(35 72 33)" opacity="0.8"/>
  <rect x="170" y="70" width="5" height="4" rx="1" fill="#38bdf8" transform="rotate(-15 172 72)" opacity="0.8"/>

  <!-- Stadium Floor / Ground Plane -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
  <line x1="0" y1="220" x2="240" y2="220" stroke="#1e293b" stroke-width="1"/>

  <!-- Olympic / Sports Event Podiums -->
  <!-- 2nd Place (Left) -->
  <path d="M45 150 L85 150 L85 200 L45 200 Z" fill="url(#podium2)"/>
  <path d="M45 150 L55 140 L95 140 L85 150 Z" fill="#64748b"/>
  <path d="M85 150 L95 140 L95 190 L85 200 Z" fill="#334155"/>
  <!-- Number 2 representation (abstract chevron instead of digit) -->
  <polyline points="60,170 65,165 70,170" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="62" y1="175" x2="68" y2="175" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- 3rd Place (Right) -->
  <path d="M155 165 L195 165 L195 200 L155 200 Z" fill="url(#podium3)"/>
  <path d="M155 165 L165 155 L205 155 L195 165 Z" fill="#c2410c"/>
  <path d="M195 165 L205 155 L205 190 L195 200 Z" fill="#7c2d12"/>
  <!-- Number 3 representation -->
  <path d="M170,180 Q178,180 178,183 Q178,186 173,186 M173,186 Q179,186 179,189 Q179,192 170,192" fill="none" stroke="#ffedd5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 1st Place (Center - Tallest) -->
  <path d="M95 125 L145 125 L145 200 L95 200 Z" fill="url(#podium1)"/>
  <path d="M95 125 L105 112 L155 112 L145 125 Z" fill="#94a3b8"/>
  <path d="M145 125 L155 112 L155 187 L145 200 Z" fill="#475569"/>
  <!-- Laurel / Champion Star on Podium -->
  <circle cx="120" cy="155" r="10" fill="#f59e0b" opacity="0.3"/>
  <path d="M120 146 L122.5 152 L129 153 L124 157 L125.5 163 L120 160 L114.5 163 L116 157 L111 153 L117.5 152 Z" fill="#fbbf24"/>

  <!-- Main Focal Point: The Grand Tournament / Session Medal (Representing "届" - Session/Edition) -->
  <!-- Hanging Ribbons -->
  <path d="M105 50 L90 100 L105 105 L120 100 Z" fill="url(#ribbonRed)" filter="url(#glow)"/>
  <path d="M135 50 L120 100 L135 105 L150 100 Z" fill="url(#ribbonBlue)" filter="url(#glow)"/>
  
  <!-- Ribbon fold details -->
  <path d="M105 50 L120 50 L135 50 L120 40 Z" fill="#1e293b" opacity="0.4"/>

  <!-- Large Commemorative Gold Medal (The "Edition/Session" Token) -->
  <g filter="url(#glow)">
    <!-- Outer Rim -->
    <circle cx="120" cy="100" r="34" fill="#d97706"/>
    <!-- Main Medal Body -->
    <circle cx="120" cy="100" r="30" fill="url(#goldGrad)"/>
    <!-- Inner Border Ring -->
    <circle cx="120" cy="100" r="26" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  </g>

  <!-- Medal Emblem: Torch & Laurel (Symbolizing an ongoing recurring periodic event/games like Olympics) -->
  <!-- Torch Body -->
  <path d="M116 112 L124 112 L122 92 L118 92 Z" fill="#b45309"/>
  <rect x="115" y="110" width="10" height="4" rx="2" fill="#d97706"/>
  
  <!-- Torch Flame / Dynamic Layers -->
  <path d="M120 74 C120 74 112 84 112 88 C112 92 115 94 120 94 C125 94 128 92 128 88 C128 84 120 74 120 74 Z" fill="#f43f5e"/>
  <path d="M120 78 C120 78 115 85 115 88 C115 91 117 93 120 93 C123 93 125 91 125 88 C125 85 120 78 120 78 Z" fill="#fbbf24"/>
  <path d="M120 82 C120 82 118 86 118 89 C118 90 119 91 120 91 C121 91 122 90 122 89 C122 86 120 82 120 82 Z" fill="#fef08a"/>

  <!-- Laurel Wreath around Torch inside Medal -->
  <path d="M108 102 C108 96 114 93 114 93" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <path d="M132 102 C132 96 126 93 126 93" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <circle cx="110" cy="98" r="1.5" fill="#fef08a"/>
  <circle cx="113" cy="94" r="1.5" fill="#fef08a"/>
  <circle cx="130" cy="98" r="1.5" fill="#fef08a"/>
  <circle cx="127" cy="94" r="1.5" fill="#fef08a"/>

  <!-- Roman Numeral / Edition Indicator Stylized Stars (Representing "30th Session" contextually without text) -->
  <g transform="translate(120, 114)">
    <circle cx="-9" cy="0" r="1.5" fill="#78350f"/>
    <circle cx="-4.5" cy="0" r="1.5" fill="#78350f"/>
    <circle cx="0" cy="0" r="1.5" fill="#78350f"/>
    <circle cx="4.5" cy="0" r="1.5" fill="#78350f"/>
    <circle cx="9" cy="0" r="1.5" fill="#78350f"/>
  </g>

  <!-- Sparkles around the Grand Medal -->
  <path d="M78 80 L80 75 L82 80 L87 82 L82 84 L80 89 L78 84 L73 82 Z" fill="#fef08a" opacity="0.9"/>
  <path d="M160 85 L161 81 L163 85 L167 86 L163 87 L161 91 L160 87 L156 86 Z" fill="#fef08a" opacity="0.7"/>
  <circle cx="155" cy="115" r="2" fill="#38bdf8"/>
  <circle cx="85" cy="120" r="1.5" fill="#ec4899"/>

  <!-- Foreground Atmospheric Flare -->
  <circle cx="120" cy="100" r="55" fill="none" stroke="#fbbf24" stroke-width="0.75" opacity="0.3" stroke-dasharray="6,6"/>
</svg>