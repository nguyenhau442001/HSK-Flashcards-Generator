<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Amber Accent -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Sticky Note Highlight Gradient -->
    <linearGradient id="stickyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Highlighter Pen Gradient -->
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Ambient Glow behind the scene -->
  <circle cx="120" cy="110" r="90" fill="url(#glow)"/>

  <!-- Desk Surface at Bottom -->
  <path d="M 0 170 Q 120 160 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)"/>
  <path d="M 0 170 Q 120 160 240 170 L 240 174 Q 120 164 0 174 Z" fill="#475569" opacity="0.6"/>

  <!-- SCENE ELEMENTS: Summarizing / "Gàikuò" (Distilling large text into core points) -->

  <!-- Background Stack of Papers (Detailed reading material) -->
  <g transform="translate(45, 60) rotate(-6)">
    <rect x="0" y="0" width="100" height="110" rx="4" fill="#cbd5e1" filter="url(#shadow)"/>
    <!-- Mock text lines on background paper -->
    <line x1="12" y1="15" x2="88" y2="15" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="28" x2="80" y2="28" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="41" x2="85" y2="41" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="54" x2="70" y2="54" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="67" x2="88" y2="67" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="80" x2="75" y2="80" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Middle Layer Document (Active reading) -->
  <g transform="translate(60, 50) rotate(3)" filter="url(#shadow)">
    <rect x="0" y="0" width="105" height="115" rx="6" fill="url(#paperGrad)"/>
    <!-- Header bar -->
    <rect x="15" y="15" width="45" height="8" rx="3" fill="#38bdf8"/>
    <!-- Text lines being reviewed -->
    <line x1="15" y1="35" x2="90" y2="35" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <line x1="15" y1="50" x2="85" y2="50" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <!-- Highlighted key phrase -->
    <rect x="13" y="60" width="60" height="14" rx="3" fill="#fef08a"/>
    <line x1="15" y1="67" x2="70" y2="67" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
    
    <line x1="15" y1="85" x2="88" y2="85" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <line x1="15" y1="100" x2="50" y2="100" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND: The Summary Output (Sticky note with key bullet points - essence distilled) -->
  <g transform="translate(100, 95)" filter="url(#shadow)">
    <!-- Sticky Note Base -->
    <path d="M 0 0 L 110 0 C 112 15, 115 25, 130 30 L 130 115 C 130 118, 127 120, 124 120 L 6 120 C 3 120, 0 118, 0 115 Z" fill="url(#stickyGrad)"/>
    
    <!-- Folded Corner Shadow/Effect -->
    <path d="M 110 0 L 130 30 L 110 30 Z" fill="#ca8a04" opacity="0.3"/>
    
    <!-- Summary Header Icon (Spark/Core idea) -->
    <circle cx="22" cy="22" r="8" fill="#f59e0b"/>
    <path d="M 22 15 L 23.5 19.5 L 28 21 L 23.5 22.5 L 22 27 L 20.5 22.5 L 16 21 L 20.5 19.5 Z" fill="#ffffff"/>

    <!-- Key Bullet Points (Abstract representation of summarized takeaways) -->
    <!-- Point 1 -->
    <circle cx="22" cy="48" r="4" fill="#d97706"/>
    <rect x="34" y="45" width="75" height="6" rx="3" fill="#854d0e" opacity="0.8"/>

    <!-- Point 2 -->
    <circle cx="22" cy="72" r="4" fill="#d97706"/>
    <rect x="34" y="69" width="60" height="6" rx="3" fill="#854d0e" opacity="0.8"/>

    <!-- Point 3 -->
    <circle cx="22" cy="96" r="4" fill="#d97706"/>
    <rect x="34" y="93" width="68" height="6" rx="3" fill="#854d0e" opacity="0.8"/>
  </g>

  <!-- ACTION ELEMENT: Elegant smart pen / highlighter pointing towards the summary -->
  <g transform="translate(25, 150) rotate(-35)" filter="url(#shadow)">
    <!-- Pen Body -->
    <path d="M 0 0 L 80 -12 C 84 -13, 88 -10, 89 -6 L 91 0 L 0 10 Z" fill="url(#penGrad)"/>
    <!-- Pen Grip -->
    <rect x="20" y="-3" width="20" height="9" fill="#e11d48"/>
    <!-- Pen Clip -->
    <path d="M 30 -6 L 50 -8 L 50 -2 L 30 -2 Z" fill="#fbcfe8"/>
    <!-- Metallic Tip -->
    <path d="M 91 0 L 102 -3 L 102 3 L 91 10 Z" fill="#cbd5e1"/>
    <!-- Glowing Ink Tip -->
    <circle cx="103" cy="0" r="3" fill="#38bdf8"/>
  </g>

  <!-- Decorative Sparkles / Concept of 'Clarity / Extraction' -->
  <g fill="#38bdf8">
    <circle cx="175" cy="55" r="3" opacity="0.8"/>
    <path d="M 175 42 L 177 48 L 183 50 L 177 52 L 175 58 L 173 52 L 167 50 L 173 48 Z"/>
    
    <circle cx="40" cy="40" r="2" opacity="0.6"/>
    <path d="M 40 30 L 41 34 L 45 35 L 41 36 L 40 40 L 39 36 L 35 35 L 39 34 Z" transform="scale(0.6) translate(20, 0)"/>
  </g>

  <g fill="#fbbf24">
    <circle cx="210" cy="115" r="2" opacity="0.9"/>
    <path d="M 210 105 L 211.5 109.5 L 216 111 L 211.5 112.5 L 210 117 L 208.5 112.5 L 204 111 L 208.5 109.5 Z" transform="scale(0.7) translate(65, 25)"/>
  </g>
</svg>