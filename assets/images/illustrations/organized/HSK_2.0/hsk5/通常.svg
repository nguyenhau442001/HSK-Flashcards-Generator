<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Bed and Morning Scene -->
  <path d="M40 180 L200 180 L190 210 L50 210 Z" fill="#334155"/>
  <path d="M50 180 L190 180 L180 140 L60 140 Z" fill="#f1f5f9"/>
  <path d="M60 140 L180 140 L170 110 L70 110 Z" fill="#cbd5e1"/>
  
  <!-- Character (Sleeping/Waking) -->
  <circle cx="120" cy="100" r="25" fill="#fde68a"/>
  <path d="M105 95 Q110 90 115 95 M125 95 Q130 90 135 95" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M110 105 Q120 112 130 105" stroke="#fb923c" stroke-width="2" fill="none"/>
  
  <!-- Alarm Clock -->
  <circle cx="170" cy="120" r="15" fill="#e2e8f0"/>
  <circle cx="170" cy="120" r="12" fill="#1e293b"/>
  <line x1="170" y1="120" x2="170" y2="112" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="120" x2="178" y2="120" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Morning Light/Window -->
  <rect x="80" y="30" width="80" height="60" rx="5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M160 40 L180 20 M160 60 L190 30 M160 80 L200 40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Nightstand -->
  <rect x="150" y="130" width="40" height="50" fill="#475569"/>
  <rect x="155" y="135" width="30" height="15" fill="#334155"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="50" r="3" fill="#10b981"/>
  <circle cx="200" cy="70" r="4" fill="#ec4899"/>
</svg>