<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Hospitality -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light/Atmosphere -->
  <circle cx="120" cy="110" r="100" fill="url(#lampGlow)" />

  <!-- Background Environment (Hotel/Lobby Setting) -->
  <g id="environment">
    <!-- Wall & Floor Divider -->
    <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" />
    <rect x="0" y="160" width="240" height="80" fill="#090d16" opacity="0.6" />

    <!-- Wall Art / Window Frame -->
    <rect x="35" y="45" width="45" height="60" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M42 60 L73 60 M42 75 L73 75 M42 90 L60 90" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

    <!-- Hanging Pendant Lamp -->
    <path d="M120 0 L120 35" stroke="#64748b" stroke-width="2" />
    <path d="M100 35 L140 35 L135 45 L105 45 Z" fill="#f59e0b" filter="url(#shadow)" />
    <!-- Lamp Light Cone -->
    <path d="M105 45 L135 45 L190 170 L50 170 Z" fill="#fbbf24" opacity="0.06" />

    <!-- Green Plant in Pot (Life/Warmth) -->
    <g transform="translate(195, 125)">
      <path d="M8 20 L22 20 L27 38 L3 38 Z" fill="#cbd5e1" filter="url(#shadow)" />
      <!-- Leaves -->
      <path d="M15 20 Q5 5 0 0 Q10 10 15 20 Z" fill="#10b981" />
      <path d="M15 20 Q25 2 32 -4 Q22 8 15 20 Z" fill="#34d399" />
      <path d="M15 20 Q35 15 42 12 Q28 18 15 20 Z" fill="#059669" />
      <path d="M15 20 Q8 10 2 12 Q10 16 15 20 Z" fill="#10b981" />
    </g>
  </g>

  <!-- Main Reception Desk -->
  <g id="reception_desk" filter="url(#shadow)">
    <!-- Desk Base -->
    <path d="M25 150 L215 150 L225 210 L15 210 Z" fill="#334155" />
    <!-- Desk Front Wood Panel Accent -->
    <path d="M30 158 L210 158 L218 202 L22 202 Z" fill="#475569" />
    <!-- Warm LED strip under desk -->
    <path d="M35 154 L205 154" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />

    <!-- Desk Props: Computer Monitor -->
    <rect x="95" y="112" width="50" height="34" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <rect x="100" y="117" width="40" height="22" rx="1" fill="#38bdf8" opacity="0.3" />
    <path d="M115 146 L125 146 L127 150 L113 150 Z" fill="#64748b" />
    <path d="M110 150 L130 150" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Desk Props: Bell & Vase -->
    <circle cx="75" cy="147" r="8" fill="#fbbf24" />
    <path d="M72 147 L78 147" stroke="#b45309" stroke-width="2" />
    <path d="M73 143 L77 143 L78 147 L72 147 Z" fill="#d97706" />
  </g>

  <!-- Character 1: Receptionist (Hosting/Welcoming gesture) -->
  <g id="receptionist" filter="url(#shadow)">
    <!-- Body / Uniform -->
    <path d="M75 130 C75 115 95 115 105 130 L110 170 L70 170 Z" fill="#0284c7" />
    <!-- Collar / Scarf -->
    <path d="M85 118 L95 118 L98 128 L82 128 Z" fill="#f8fafc" />
    <path d="M88 124 L92 124 L95 132 L85 132 Z" fill="#ec4899" />

    <!-- Head & Face -->
    <circle cx="90" cy="98" r="15" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M75 95 C75 80 105 80 105 98 C105 98 100 90 90 90 C80 90 75 95 75 95 Z" fill="#334155" />
    <!-- Friendly Welcoming Expression -->
    <path d="M85 100 Q90 104 95 100" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="85" cy="96" r="1.5" fill="#78350f" />
    <circle cx="95" cy="96" r="1.5" fill="#78350f" />

    <!-- Welcoming Hand Gesture (Raised invitingly) -->
    <path d="M75 125 C65 125 55 115 60 105 C62 101 68 103 67 108 C66 113 72 120 78 123 Z" fill="#fcd34d" />
  </g>

  <!-- Character 2: Guest / Visitor (Arriving happily) -->
  <g id="guest" filter="url(#shadow)">
    <!-- Body / Jacket -->
    <path d="M145 135 C145 115 175 115 175 135 L180 180 L140 180 Z" fill="#10b981" />
    <path d="M150 135 L160 135 L160 175 L150 175 Z" fill="#047857" opacity="0.3" /> <!-- Jacket opening -->

    <!-- Head & Face -->
    <path d="M160 90 C172 90 175 102 165 108 C155 114 148 100 160 90 Z" fill="#fcd34d" /> <!-- Slight bow forward -->
    <!-- Head/Hair -->
    <path d="M148 93 C148 80 172 80 172 95 C165 92 155 92 148 93 Z" fill="#1e293b" />
    <!-- Happy Expression -->
    <path d="M156 101 Q161 105 166 100" stroke="#064e3b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Arm gesturing handshake / greeting -->
    <path d="M148 130 C135 130 125 125 120 135 C118 139 123 142 126 139 C130 136 138 138 145 140 Z" fill="#fcd34d" />

    <!-- Luggage (Context prop showing arrival/guest) -->
    <g transform="translate(185, 140)">
      <rect x="0" y="10" width="22" height="30" rx="4" fill="#f97316" />
      <path d="M7 10 L7 6 C7 4 9 2 11 2 C13 2 15 4 15 6 L15 10" stroke="#334155" stroke-width="2" fill="none" />
      <line x1="0" y1="20" x2="22" y2="20" stroke="#ea580c" stroke-width="2" />
      <!-- Wheels -->
      <rect x="3" y="40" width="4" height="3" fill="#334155" />
      <rect x="15" y="40" width="4" height="3" fill="#334155" />
    </g>
  </g>

  <!-- Action / Hospitality Sparkles (Representing warm service & reception vibe) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 120 75 Q 120 85 110 85 Q 120 85 120 95 Q 120 85 130 85 Q 120 85 120 75 Z" transform="scale(0.8) translate(30, 25)" />
    <!-- Star 2 -->
    <path d="M 120 75 Q 120 85 110 85 Q 120 85 120 95 Q 120 85 130 85 Q 120 85 120 75 Z" transform="scale(0.5) translate(145, 110)" fill="#38bdf8" />
    <!-- Star 3 -->
    <path d="M 120 75 Q 120 85 110 85 Q 120 85 120 95 Q 120 85 130 85 Q 120 85 120 75 Z" transform="scale(0.6) translate(80, 50)" />
  </g>
</svg>