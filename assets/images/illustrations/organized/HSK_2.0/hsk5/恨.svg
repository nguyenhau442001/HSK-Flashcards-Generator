<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Folder/Document Gradients -->
    <linearGradient id="folderBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="folderFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Intense Vibe/Glow Gradient -->
    <radialGradient id="angerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Floor & Environment Elements -->
  <!-- Desk/Table Surface -->
  <path d="M 20 185 L 220 185 L 235 220 L 5 220 Z" fill="#090d16" />
  <path d="M 20 185 L 220 185" stroke="#334155" stroke-width="2" />

  <!-- Background Office Details (Out of focus silhouette) -->
  <rect x="40" y="70" width="30" height="45" rx="4" fill="#334155" opacity="0.4" />
  <rect x="175" y="60" width="25" height="55" rx="4" fill="#334155" opacity="0.3" />

  <!-- Intense/Aggravated Atmosphere Aura Behind Character -->
  <circle cx="120" cy="115" r="70" fill="url(#angerGlow)" />
  
  <!-- Flying torn contract pieces (Representing betrayal / "lừa") -->
  <g filter="url(#shadow)">
    <!-- Fragment 1 -->
    <path d="M 65 95 L 80 85 L 75 105 Z" fill="#f8fafc" transform="rotate(-15 72 95)" />
    <!-- Fragment 2 -->
    <path d="M 160 100 L 175 90 L 170 115 Z" fill="#f8fafc" transform="rotate(25 167 102)" />
    <!-- Fragment 3 -->
    <path d="M 130 65 L 145 70 L 135 85 Z" fill="#f8fafc" transform="rotate(45 137 75)" />
  </g>

  <!-- Main Subject: Desk setup with betrayed character glaring at deceptive document -->
  <g id="desk-scene">
    <!-- Desk Lamp providing dramatic lighting -->
    <path d="M 195 185 L 195 130 L 180 120" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 170 110 L 195 125 L 190 135 L 165 120 Z" fill="#94a3b8" />
    <!-- Lamp Light Beam -->
    <polygon points="175,125 120,185 200,185" fill="#fbbf24" opacity="0.08" />

    <!-- Open Deceptive Folder / Contract on Desk -->
    <g transform="translate(90, 145)" filter="url(#shadow)">
      <!-- Folder Back -->
      <path d="M 0 10 L 15 -5 L 55 -5 L 70 10 L 60 35 L 10 35 Z" fill="url(#folderBack)" />
      <!-- Papers Inside (Folded/Torn) -->
      <path d="M 8 15 L 52 15 L 48 38 L 12 38 Z" fill="#f8fafc" />
      <line x1="16" y1="21" x2="44" y2="21" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="16" y1="27" x2="35" y2="27" stroke="#ef4444" stroke-width="2" stroke-linecap="round" /> <!-- Red marker of betrayal -->
      <!-- Folder Front -->
      <path d="M 5 15 L 65 15 L 60 40 L 10 40 Z" fill="url(#folderFront)" />
    </g>

    <!-- Coffee Mug -->
    <rect x="50" y="160" width="16" height="22" rx="3" fill="#cbd5e1" filter="url(#shadow)" />
    <path d="M 66 166 C 72 166 72 176 66 176" stroke="#cbd5e1" stroke-width="2.5" fill="none" />

    <!-- Character Upper Body (Leaning forward, furious, glaring) -->
    <!-- Torso & Shoulders -->
    <path d="M 80 185 C 80 145 160 145 160 185 Z" fill="url(#suitGrad)" filter="url(#shadow)" />
    <path d="M 100 148 L 120 170 L 140 148 Z" fill="#ffffff" /> <!-- Shirt Collar -->
    <!-- Red Tie (Symbolizing tension/anger) -->
    <polygon points="116,165 124,165 122,190 118,190" fill="#ef4444" />

    <!-- Neck -->
    <rect x="110" y="132" width="20" height="20" fill="#fbcfe8" />

    <!-- Head -->
    <g id="character-head" filter="url(#shadow)">
      <!-- Face Base -->
      <path d="M 95 105 C 95 75 145 75 145 105 C 145 130 95 130 95 105 Z" fill="#fde047" /> <!-- Stylized expressive skin or warm tone #fecaca -->
      <path d="M 97 100 C 97 78 143 78 143 100 C 143 125 97 125 97 100 Z" fill="#fca5a5" />

      <!-- Hair (Messy/Frustrated) -->
      <path d="M 94 95 C 90 70 110 60 125 65 C 140 60 152 75 146 98 C 150 90 145 72 128 70 C 110 68 98 85 94 95 Z" fill="#1e293b" />

      <!-- Angry Eyebrows (Slanted sharply downward toward center - Core visual cue for '恨' / hatred / intense glare) -->
      <path d="M 102 96 L 118 103" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 138 96 L 122 103" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />

      <!-- Intense Glaring Eyes -->
      <circle cx="110" cy="107" r="4" fill="#0f172a" />
      <circle cx="130" cy="107" r="4" fill="#0f172a" />
      <!-- Angry Eye Highlights -->
      <circle cx="111" cy="106" r="1.5" fill="#ffffff" />
      <circle cx="131" cy="106" r="1.5" fill="#ffffff" />

      <!-- Tense/Clenched Mouth (Gritted teeth look) -->
      <path d="M 112 122 L 128 122" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 114 120 L 126 120" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      
      <!-- Subtle Anger Flush / Blush on Cheeks -->
      <ellipse cx="103" cy="113" rx="4" ry="2" fill="#ef4444" opacity="0.6" />
      <ellipse cx="137" cy="113" rx="4" ry="2" fill="#ef4444" opacity="0.6" />
    </g>

    <!-- Clenched Fists on Desk (Expressing deep resentment / thù hận) -->
    <!-- Left Fist -->
    <circle cx="75" cy="175" r="13" fill="#fca5a5" filter="url(#shadow)" />
    <path d="M 68 168 Q 75 165 82 168" stroke="#1e293b" stroke-width="2" fill="none" />
    <!-- Right Fist -->
    <circle cx="165" cy="175" r="13" fill="#fca5a5" filter="url(#shadow)" />
    <path d="M 158 168 Q 165 165 172 168" stroke="#1e293b" stroke-width="2" fill="none" />
  </g>

  <!-- Dramatic Lighting Vignette Overlay (Edges darkened for cinematic mood) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#000000" stroke-width="12" opacity="0.3" />
</svg>