<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <rect x="0" y="175" width="240" height="10" fill="#475569"/>
  
  <!-- Shadow -->
  <ellipse cx="120" cy="190" rx="80" ry="15" fill="#0f172a" opacity="0.4"/>
  
  <!-- Broken Cup Fragments -->
  <g transform="translate(120, 140)">
    <!-- Base -->
    <path d="M-30 40 L30 40 L25 10 L-25 10 Z" fill="#fbbf24"/>
    <path d="M-25 10 L25 10 L20 -20 L-20 -20 Z" fill="#f59e0b"/>
    
    <!-- Fragments -->
    <path d="M-40 0 L-20 5 L-25 20 Z" fill="#fb923c" stroke="#1e293b" stroke-width="2"/>
    <path d="M35 10 L50 -5 L40 -20 Z" fill="#ec4899" stroke="#1e293b" stroke-width="2"/>
    <path d="M-10 -25 L10 -25 L5 -40 L-5 -40 Z" fill="#38bdf8" stroke="#1e293b" stroke-width="2"/>
    <path d="M-50 20 L-35 35 L-45 40 Z" fill="#10b981" stroke="#1e293b" stroke-width="2"/>
    <path d="M40 30 L60 20 L55 45 Z" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Motion/Impact Lines -->
  <path d="M80 120 L60 100" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 120 L180 100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="100" r="3" fill="#fbbf24"/>
  <circle cx="100" cy="110" r="2" fill="#ec4899"/>
  <circle cx="140" cy="110" r="2" fill="#10b981"/>
</svg>