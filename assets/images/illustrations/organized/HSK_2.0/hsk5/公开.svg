<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" fill="url(#spotlight)" />

  <!-- Ambient Light Rays / Stage Lights -->
  <polygon points="120,0 40,200 80,200" fill="#38bdf8" opacity="0.05" />
  <polygon points="120,0 160,200 200,200" fill="#38bdf8" opacity="0.05" />

  <!-- Background Stage / Room Architecture -->
  <path d="M 20,185 L 220,185 L 230,210 L 10,210 Z" fill="#0f172a" opacity="0.8" />
  <line x1="20" y1="185" x2="220" y2="185" stroke="#334155" stroke-width="2" />

  <!-- Press Conference Backdrop Panel (Announcing publicly) -->
  <rect x="35" y="45" width="170" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="43" y="53" width="154" height="94" rx="4" fill="url(#screen-grad)" />
  
  <!-- Graphic elements on Backdrop Screen (representing public release / broadcast) -->
  <circle cx="120" cy="85" r="22" fill="#0284c7" stroke="#bae6fd" stroke-width="3" />
  <path d="M 108,85 L 117,94 L 134,74" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Radiating public announcement waves -->
  <path d="M 90,85 C 90,70 150,70 150,85" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.5" stroke-dasharray="3,3" />
  <path d="M 83,85 C 83,62 157,62 157,85" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.3" stroke-dasharray="3,3" />

  <!-- Geometric Abstract Bar Charts on Screen for official news -->
  <rect x="60" y="115" width="16" height="22" rx="2" fill="#38bdf8" opacity="0.8" />
  <rect x="85" y="105" width="16" height="32" rx="2" fill="#38bdf8" opacity="0.9" />
  <rect x="110" y="98" width="16" height="39" rx="2" fill="#38bdf8" />
  <rect x="135" y="110" width="16" height="27" rx="2" fill="#38bdf8" opacity="0.8" />
  <rect x="160" y="120" width="16" height="17" rx="2" fill="#38bdf8" opacity="0.6" />

  <!-- Podium Desk (Foreground) -->
  <path d="M 75,160 L 165,160 L 175,195 L 65,195 Z" fill="#334155" stroke="#475569" stroke-width="2" />
  <!-- Glowing accent strip on podium -->
  <polygon points="85,168 155,168 153,174 87,174" fill="#38bdf8" filter="url(#glow)" />

  <!-- Microphones on Podium (Multiple reporters/public announcement) -->
  <g transform="translate(0, 5)">
    <!-- Left Mic -->
    <rect x="95" y="138" width="3" height="22" fill="#94a3b8" />
    <ellipse cx="96.5" cy="136" rx="5" ry="7" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Center Mic (Main) -->
    <rect x="118.5" y="130" width="3" height="30" fill="#94a3b8" />
    <circle cx="120" cy="126" r="7" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1.5" />
    <path d="M 115,126 C 115,123 125,123 125,126" fill="none" stroke="#64748b" stroke-width="1.5" />
    <!-- Right Mic -->
    <rect x="141" y="138" width="3" height="22" fill="#94a3b8" />
    <ellipse cx="142.5" cy="136" rx="5" ry="7" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Dramatic Lighting Effects & Sparkles (Representing news going public/transparent) -->
  <g fill="#fbbf24">
    <!-- Star sparkles -->
    <path d="M 45,75 Q 45,85 35,85 Q 45,85 45,95 Q 45,85 55,85 Q 45,85 45,75" filter="url(#glow)" />
    <path d="M 195,65 Q 195,73 187,73 Q 195,73 195,81 Q 195,73 203,73 Q 195,73 195,65" filter="url(#glow)" />
    <circle cx="175" cy="50" r="3" fill="#f59e0b" />
    <circle cx="60" cy="40" r="2" fill="#f59e0b" />
  </g>

  <!-- Open Document / Envelope emerging to signify "making public" -->
  <g transform="translate(100, 115) scale(0.8)">
    <polygon points="-25,10 0,30 25,10 25,-15 -25,-15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <polygon points="-25,10 0,30 25,10 0,-5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <!-- Open flap showing bright document -->
    <polygon points="-25,-15 25,-15 0,-35" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2" />
  </g>

  <!-- Camera Flash / Light Burst in the corner (Live broadcast vibe) -->
  <circle cx="205" cy="120" r="6" fill="#ffffff" filter="url(#glow)" />
  <circle cx="35" cy="110" r="4" fill="#ffffff" filter="url(#glow)" />

  <!-- Foreground edge vignette for cinematic framing -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
</svg>