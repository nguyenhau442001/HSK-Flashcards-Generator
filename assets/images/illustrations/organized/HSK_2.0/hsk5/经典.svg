<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Projector Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.03" />
    </linearGradient>

    <!-- Projector Metal Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Film Reel Gradient -->
    <linearGradient id="reel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Floor/Surface -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- Ambient Dust/Sparkle Particles -->
  <circle cx="160" cy="90" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="180" cy="120" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="140" cy="140" r="1" fill="#fbbf24" opacity="0.9" />
  <circle cx="205" cy="100" r="1.5" fill="#ffffff" opacity="0.7" />
  <circle cx="130" cy="100" r="2.5" fill="#fbbf24" opacity="0.4" />

  <!-- PROJECTOR BEAM (Backdrop Light Cone) -->
  <polygon points="50,140 220,50 220,180" fill="url(#beam-grad)" />

  <!-- MOVIE SCREEN -->
  <g filter="url(#soft-shadow)">
    <!-- Screen Outer Frame -->
    <rect x="135" y="45" width="85" height="115" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <!-- Screen Display Area -->
    <rect x="141" y="51" width="73" height="103" rx="2" fill="#020617" />
    
    <!-- Cinematic Classic Scene Projection (Silhouettes on Screen) -->
    <g clip-path="url(#screen-clip)">
      <clipPath id="screen-clip">
        <rect x="141" y="51" width="73" height="103" rx="2" />
      </clipPath>
      
      <!-- Projection Background Sky/Moon -->
      <circle cx="195" cy="75" r="10" fill="#fef08a" opacity="0.9" />
      <!-- Stylized Classic Architecture / Bridge Silhouette -->
      <path d="M141 154 L141 130 C155 125, 170 135, 185 120 L214 110 L214 154 Z" fill="#1e293b" />
      <!-- Classic Arch Bridge -->
      <path d="M155 154 C155 140, 185 140, 185 154 Z" fill="#020617" />
      <!-- Romantic Dancing/Leaping Character Silhouette -->
      <path d="M172 110 C170 106, 173 103, 176 105 C179 107, 182 102, 179 98 C176 96, 173 97, 171 100 L168 107 L165 115 L175 118 Z" fill="#f8fafc" />
    </g>

    <!-- Screen Hanger / Stand -->
    <line x1="177.5" y1="35" x2="177.5" y2="45" stroke="#64748b" stroke-width="2" />
    <circle cx="177.5" cy="35" r="3" fill="#94a3b8" />
  </g>

  <!-- VINTAGE FILM PROJECTOR (Foreground Main Subject) -->
  <g filter="url(#soft-shadow)">
    <!-- Projector Body / Base -->
    <path d="M35 175 L75 175 C79 175, 82 172, 82 168 L82 135 C82 131, 79 128, 75 128 L35 128 C31 128, 28 131, 28 135 L28 168 C28 172, 31 175, 35 175 Z" fill="url(#metal-grad)" />
    <!-- Projector Stand/Legs -->
    <path d="M38 175 L30 192 M72 175 L80 192" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="30" cy="192" rx="6" ry="2" fill="#334155" />
    <ellipse cx="80" cy="192" rx="6" ry="2" fill="#334155" />

    <!-- Projector Lens Barrel (pointing right towards screen) -->
    <path d="M75 140 L95 135 L95 155 L75 150 Z" fill="url(#metal-grad)" />
    <!-- Glowing Lens Front -->
    <ellipse cx="95" cy="145" rx="3" ry="10" fill="#38bdf8" filter="url(#glow)" />
    <ellipse cx="95" cy="145" rx="1.5" ry="7" fill="#bae6fd" />

    <!-- Top Film Reel (Classic dual circles with cutout details) -->
    <!-- Reel mount arm -->
    <path d="M50 128 L50 105" stroke="#475569" stroke-width="5" stroke-linecap="round" />
    <!-- Reel Circle -->
    <g transform="translate(50, 90)">
      <circle cx="0" cy="0" r="22" fill="url(#reel-grad)" stroke="#0369a1" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#0f172a" />
      <!-- Cutouts for retro film reel look -->
      <circle cx="0" cy="-12" r="4" fill="#0f172a" opacity="0.7" />
      <circle cx="10" cy="6" r="4" fill="#0f172a" opacity="0.7" />
      <circle cx="-10" cy="6" r="4" fill="#0f172a" opacity="0.7" />
      <!-- Film strip wrapping -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
    </g>

    <!-- Bottom Film Take-up Reel -->
    <!-- Reel mount arm -->
    <path d="M68 128 L68 115" stroke="#475569" stroke-width="5" stroke-linecap="round" />
    <g transform="translate(68, 105)">
      <circle cx="0" cy="0" r="16" fill="url(#reel-grad)" stroke="#0369a1" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" />
      <circle cx="0" cy="-8" r="2.5" fill="#0f172a" opacity="0.7" />
      <circle cx="7" cy="4" r="2.5" fill="#0f172a" opacity="0.7" />
      <circle cx="-7" cy="4" r="2.5" fill="#0f172a" opacity="0.7" />
    </g>

    <!-- Film Strip flowing between reels & projector -->
    <path d="M50 68 C40 85, 32 110, 42 128" fill="none" stroke="#1e293b" stroke-width="4" />
    <path d="M50 68 C40 85, 32 110, 42 128" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Projector Control Dials & Accents -->
    <circle cx="45" cy="142" r="4" fill="#fbbf24" />
    <circle cx="60" cy="155" r="3" fill="#ef4444" />
    <rect x="35" y="155" width="12" height="6" rx="2" fill="#64748b" />
  </g>

  <!-- DECORATIVE PROPS: Stack of Classic Film Canisters on the floor -->
  <g transform="translate(15, 175)" filter="url(#soft-shadow)">
    <!-- Canister 1 (Bottom) -->
    <rect x="0" y="10" width="36" height="8" rx="2" fill="#cbd5e1" />
    <rect x="0" y="12" width="36" height="4" fill="#94a3b8" />
    <!-- Canister 2 (Middle) -->
    <rect x="3" y="2" width="30" height="8" rx="2" fill="#f43f5e" />
    <rect x="3" y="4" width="30" height="4" fill="#e11d48" />
    <!-- Canister 3 (Top, tilted slightly) -->
    <g transform="rotate(-8 18 2)">
      <rect x="6" y="-6" width="24" height="8" rx="2" fill="#38bdf8" />
      <rect x="6" y="-4" width="24" height="4" fill="#0284c7" />
      <!-- Star accent representing 'classic/award' -->
      <path d="M18 -2 L19 -4 L21 -4 L19 -5 L20 -7 L18 -6 L16 -7 L17 -5 L15 -4 L17 -4 Z" fill="#fef08a" />
    </g>
  </g>

  <!-- Popcorn Bucket / Snack Prop for authentic cinema context -->
  <g transform="translate(100, 160)" filter="url(#soft-shadow)">
    <!-- Bucket Body -->
    <path d="M6 10 L14 30 L30 30 L38 10 Z" fill="#ffffff" stroke="#ef4444" stroke-width="2" />
    <!-- Red Stripes -->
    <path d="M12 10 L16 30 M22 10 L22 30 M32 10 L28 30" stroke="#ef4444" stroke-width="3" />
    <!-- Popcorn Overflow (Fluffy golden-white clouds) -->
    <circle cx="22" cy="7" r="8" fill="#fef08a" />
    <circle cx="14" cy="9" r="7" fill="#fef9c3" />
    <circle cx="30" cy="9" r="7" fill="#fef9c3" />
    <circle cx="22" cy="3" r="6" fill="#ffffff" />
    <circle cx="17" cy="4" r="5" fill="#fef08a" />
    <circle cx="27" cy="4" r="5" fill="#fef08a" />
  </g>

  <!-- Floating Golden Star / Classic Award Sparkles (Symbolizing "Masterpiece / Classic") -->
  <g transform="translate(115, 75)" filter="url(#glow)">
    <path d="M0 -8 L2.3 -2.3 L8 0 L2.3 2.3 L0 8 L-2.3 2.3 L-8 0 L-2.3 -2.3 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(210, 110) scale(0.6)" filter="url(#glow)">
    <path d="M0 -8 L2.3 -2.3 L8 0 L2.3 2.3 L0 8 L-2.3 2.3 L-8 0 L-2.3 -2.3 Z" fill="#f59e0b" />
  </g>

  <!-- Dynamic Light Flare Overlay -->
  <circle cx="95" cy="145" r="16" fill="#bae6fd" opacity="0.25" filter="url(#glow)" />
</svg>