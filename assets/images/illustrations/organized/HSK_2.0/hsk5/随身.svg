<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Person's torso and pocket area -->
  <path d="M60 240 L180 240 L170 100 L70 100 Z" fill="#334155"/>
  
  <!-- The Pocket -->
  <path d="M90 130 L150 130 L145 180 L95 180 Z" fill="#475569" stroke="#64748b" stroke-width="3"/>
  
  <!-- The Wallet (Subject: 随身 - carried on person) -->
  <rect x="100" y="135" width="40" height="30" rx="4" fill="#f59e0b"/>
  <rect x="105" y="140" width="30" height="20" rx="2" fill="#fbbf24"/>
  <path d="M100 145 L140 145" stroke="#d97706" stroke-width="2"/>
  
  <!-- Decorative elements to show movement/action -->
  <circle cx="190" cy="60" r="4" fill="#38bdf8"/>
  <circle cx="205" cy="80" r="3" fill="#10b981"/>
  <path d="M40 80 L60 60" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 90 L50 70" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pocket flap detail -->
  <path d="M90 130 L120 145 L150 130" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
</svg>