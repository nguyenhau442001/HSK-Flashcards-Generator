<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Golden Beam / Spotlight for Action -->
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Ruler Body Gradient -->
    <linearGradient id="rulerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Ruler Highlight & Shadow -->
    <linearGradient id="rulerHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Pencil Body Gradient -->
    <linearGradient id="pencilYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Atmospheric Lighting & Grid Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#090d16" opacity="0.6"/>
  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="180" x2="240" y2="180"/>
    <line x1="0" y1="200" x2="240" y2="200"/>
    <line x1="0" y1="220" x2="240" y2="220"/>
    <line x1="40" y1="160" x2="40" y2="240"/>
    <line x1="100" y1="160" x2="100" y2="240"/>
    <line x1="160" y1="160" x2="160" y2="240"/>
    <line x1="200" y1="160" x2="200" y2="240"/>
  </g>

  <!-- Dramatic Light Cone -->
  <polygon points="120,0 240,240 0,240" fill="url(#beamGradient)"/>

  <!-- Background Props: Blueprint / Sketch Pad -->
  <g transform="translate(45, 75) rotate(-8)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="150" height="110" rx="4" fill="#f8fafc"/>
    <!-- Blueprint elements on paper -->
    <rect x="12" y="12" width="126" height="86" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="75" cy="55" r="25" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <path d="M40 70 L90 35 L110 80" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Subject Group: The Ruler (cái thước) and interactive elements -->
  <g filter="url(#dropShadow)">
    <!-- Ruler Shadow on Surface -->
    <path d="M35 155 L195 95 L205 120 L45 180 Z" fill="#020617" opacity="0.5" filter="url(#glow)"/>

    <!-- Main Ruler Body (Rotated for dynamic action) -->
    <g transform="translate(120, 130) rotate(-20) translate(-120, -130)">
      <!-- Ruler Base -->
      <rect x="25" y="110" width="190" height="36" rx="6" fill="url(#rulerGradient)" stroke="#93c5fd" stroke-width="1.5"/>
      <!-- Inner translucent highlight area -->
      <rect x="27" y="112" width="186" height="32" rx="4" fill="url(#rulerHighlight)"/>
      
      <!-- Center Groove Slot -->
      <line x1="35" y1="128" x2="205" y2="128" stroke="#1d4ed8" stroke-width="1.5" opacity="0.4"/>

      <!-- Measurement Ticks & Numbers (Abstract stylized vector ticks) -->
      <!-- Major Ticks (cm) -->
      <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <line x1="35" y1="112" x2="35" y2="122"/>
        <line x1="50" y1="112" x2="50" y2="120"/>
        <line x1="65" y1="112" x2="65" y2="122"/>
        <line x1="80" y1="112" x2="80" y2="120"/>
        <line x1="95" y1="112" x2="95" y2="124"/> <!-- Mid point -->
        <line x1="110" y1="112" x2="110" y2="120"/>
        <line x1="125" y1="112" x2="125" y2="122"/>
        <line x1="140" y1="112" x2="140" y2="120"/>
        <line x1="155" y1="112" x2="155" y2="122"/>
        <line x1="170" y1="112" x2="170" y2="124"/> <!-- Mid point -->
        <line x1="185" y1="112" x2="185" y2="120"/>
        <line x1="200" y1="112" x2="200" y2="122"/>
      </g>

      <!-- Minor Ticks -->
      <g stroke="#93c5fd" stroke-width="1" opacity="0.8">
        <line x1="42" y1="112" x2="42" y2="117"/>
        <line x1="57" y1="112" x2="57" y2="117"/>
        <line x1="72" y1="112" x2="72" y2="117"/>
        <line x1="87" y1="112" x2="87" y2="117"/>
        <line x1="102" y1="112" x2="102" y2="117"/>
        <line x1="117" y1="112" x2="117" y2="117"/>
        <line x1="132" y1="112" x2="132" y2="117"/>
        <line x1="147" y1="112" x2="147" y2="117"/>
        <line x1="162" y1="112" x2="162" y2="117"/>
        <line x1="177" y1="112" x2="177" y2="117"/>
        <line x1="192" y1="112" x2="192" y2="117"/>
      </g>

      <!-- Circular Finger Hole in Ruler (adds realism) -->
      <circle cx="190" cy="128" r="6" fill="#1e40af" opacity="0.6"/>
      <circle cx="190" cy="128" r="4" fill="#0f172a" opacity="0.8"/>
    </g>
  </g>

  <!-- Interactive Prop 1: Modern Stylus / Pencil Drawing a Glowing Measurement Line -->
  <g filter="url(#dropShadow)">
    <!-- Glowing Measurement Beam emitted from ruler edge -->
    <path d="M55 125 L175 80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M55 125 L175 80" stroke="#bae6fd" stroke-width="1" stroke-linecap="round"/>

    <!-- Pencil / Technical Pen leaning in -->
    <g transform="translate(160, 60) rotate(35)">
      <!-- Pencil Body -->
      <polygon points="0,-35 12,-35 10,25 2,25" fill="url(#pencilYellow)"/>
      <polygon points="2,-35 6,-35 5,25 2,25" fill="#fde68a" opacity="0.5"/> <!-- highlight facet -->
      <polygon points="6,-35 12,-35 10,25 5,25" fill="#b45309" opacity="0.4"/> <!-- shadow facet -->
      
      <!-- Metal Ferrule -->
      <rect x="0" y="-45" width="12" height="10" fill="#94a3b8"/>
      <line x1="0" y1="-40" x2="12" y2="-40" stroke="#64748b" stroke-width="1"/>
      <line x1="0" y1="-43" x2="12" y2="-43" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Eraser Top -->
      <path d="M 0,-45 C 0,-50 12,-50 12,-45 Z" fill="#ec4899"/>

      <!-- Wooden Tip -->
      <polygon points="2,25 10,25 6,38" fill="#fcd34d"/>
      <polygon points="4,28 8,28 6,38" fill="#d97706" opacity="0.3"/>
      
      <!-- Graphite Lead Point -->
      <polygon points="5,35 7,35 6,40" fill="#1e293b"/>
    </g>
  </g>

  <!-- Atmospheric Foreground Elements / Accent Sparkles -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="40" cy="90" r="3" opacity="0.8"/>
    <circle cx="195" cy="140" r="2" opacity="0.6"/>
    <circle cx="100" cy="50" r="4" opacity="0.4"/>
  </g>
  
  <g fill="#fbbf24">
    <circle cx="170" cy="80" r="3" opacity="0.9"/>
    <!-- Four-point star spark -->
    <path d="M 125 75 Q 125 85 115 85 Q 125 85 125 95 Q 125 85 135 85 Q 125 85 125 75 Z" fill="#fef08a" filter="url(#glow)"/>
    <path d="M 75 145 Q 75 150 70 150 Q 75 150 75 155 Q 75 150 80 150 Q 75 150 75 145 Z" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Organic Corner Vignette / Frame Accent -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>