<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Mountains in background -->
  <path d="M0 160 L60 80 L120 160 Z" fill="#334155"/>
  <path d="M80 160 L150 70 L220 160 Z" fill="#475569"/>
  
  <!-- Sun/Light -->
  <circle cx="190" cy="50" r="25" fill="#f59e0b" opacity="0.8"/>
  
  <!-- Character -->
  <g transform="translate(60, 100)">
    <!-- Backpack -->
    <rect x="15" y="20" width="30" height="40" rx="5" fill="#fb923c"/>
    <!-- Body -->
    <path d="M20 60 Q20 100 25 120 L45 120 Q50 100 50 60 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="35" cy="40" r="15" fill="#fde68a"/>
    <!-- Hat -->
    <path d="M20 30 L50 30 L45 20 L25 20 Z" fill="#ec4899"/>
    <!-- Arms -->
    <path d="M20 70 L5 90" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 70 L65 90" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M25 120 L20 150" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M45 120 L50 150" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Map/Prop -->
  <rect x="150" y="140" width="50" height="40" rx="4" fill="#fbbf24"/>
  <path d="M155 150 L195 150 M155 160 L195 160 M155 170 L180 170" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Ground -->
  <path d="M0 190 Q120 170 240 190 L240 240 L0 240 Z" fill="#10b981" opacity="0.3"/>
</svg>