<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Doorway Frame -->
  <path d="M70 40h100v160H70z" fill="#334155" stroke="#475569" stroke-width="4"/>
  <path d="M70 40h100v20H70z" fill="#475569"/>
  
  <!-- Door -->
  <path d="M74 44h46v152H74z" fill="#fb923c"/>
  <circle cx="108" cy="120" r="6" fill="#0f172a"/>
  
  <!-- Character Hand reaching for handle -->
  <path d="M120 120c10-5 20-5 30 0l5 15c-10 5-20 5-30 0z" fill="#fcd34d"/>
  <path d="M150 125c5 0 8 5 8 10s-3 10-8 10-8-5-8-10 3-10 8-10z" fill="#fcd34d"/>
  
  <!-- Floor/Environment -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <path d="M0 200h240v5H0z" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Decorative elements showing access -->
  <circle cx="190" cy="80" r="15" fill="#10b981" opacity="0.2"/>
  <path d="M185 80l3 3 7-7" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Light glow from behind door -->
  <path d="M120 44h50v152h-50z" fill="url(#light)" opacity="0.4"/>
  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>