<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#0f172a" opacity="0.4"/>
  
  <!-- Wristwatch -->
  <g transform="translate(120, 130) rotate(-15)">
    <!-- Strap -->
    <rect x="-80" y="-15" width="160" height="30" rx="8" fill="#334155"/>
    <!-- Watch Case -->
    <circle cx="0" cy="0" r="45" fill="#f8fafc" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="0" cy="0" r="38" fill="#1e293b"/>
    <!-- Hands -->
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="20" y2="0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <!-- Details -->
    <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
  </g>
  
  <!-- Contextual Props -->
  <circle cx="50" cy="60" r="20" fill="#ec4899" opacity="0.6"/>
  <circle cx="190" cy="80" r="15" fill="#10b981" opacity="0.6"/>
  <path d="M180 180 L210 180 L205 210 L185 210 Z" fill="#fb923c" opacity="0.7"/>
  
  <!-- Ambient Glows -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.1"/>
</svg>