<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Water surface ripples -->
  <path d="M40 120 Q 80 110 120 120 T 200 120" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M20 140 Q 60 130 100 140 T 180 140" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- Fish Body -->
  <path d="M70 120 C 70 90, 170 90, 170 120 C 170 150, 70 150, 70 120" fill="#fb923c"/>
  
  <!-- Fish Tail -->
  <path d="M170 120 L 200 100 L 200 140 Z" fill="#fb923c"/>
  
  <!-- Fish Details -->
  <path d="M85 115 A 5 5 0 1 0 85 116 Z" fill="#0f172a"/>
  <path d="M100 120 L 120 120 M 105 110 L 115 110 M 105 130 L 115 130" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bubbles -->
  <circle cx="150" cy="90" r="6" fill="#38bdf8" opacity="0.6"/>
  <circle cx="165" cy="75" r="4" fill="#38bdf8" opacity="0.4"/>
  <circle cx="140" cy="65" r="3" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Decorative elements (Seaweed) -->
  <path d="M30 240 Q 20 180 40 150 Q 60 180 50 240" fill="#10b981" opacity="0.8"/>
  <path d="M210 240 Q 200 190 220 160 Q 240 190 230 240" fill="#10b981" opacity="0.6"/>
  
  <!-- Lighting highlight -->
  <ellipse cx="100" cy="105" rx="15" ry="5" fill="#ffffff" opacity="0.15" transform="rotate(-15 100 105)"/>
</svg>