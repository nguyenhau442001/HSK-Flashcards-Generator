<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Toy Block -->
  <rect x="160" y="190" width="30" height="30" rx="4" fill="#fb923c"/>
  <rect x="170" y="185" width="10" height="10" rx="2" fill="#f59e0b"/>
  
  <!-- The Little Brother (Subject) -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-30 80 Q-30 40 0 40 Q30 40 30 80 L30 110 L-30 110 Z" fill="#38bdf8"/>
    
    <!-- Arms -->
    <path d="M-35 60 L-50 90" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <path d="M35 60 L50 90" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="0" cy="20" r="35" fill="#fde68a"/>
    
    <!-- Hair -->
    <path d="M-25 5 Q-10 -15 10 -10 Q25 -5 30 10" stroke="#78350f" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Face -->
    <circle cx="-12" cy="15" r="4" fill="#1e293b"/>
    <circle cx="12" cy="15" r="4" fill="#1e293b"/>
    <path d="M-10 30 Q0 38 10 30" stroke="#ec4899" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Scarf -->
    <path d="M-20 45 L20 45 L25 55 L-25 55 Z" fill="#ef4444"/>
  </g>
  
  <!-- Floating Toy Plane -->
  <path d="M40 60 L80 50 L70 70 L30 80 Z" fill="#10b981"/>
  <circle cx="55" cy="65" r="8" fill="#fbbf24"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="30" cy="150" r="2" fill="#38bdf8" opacity="0.4"/>
</svg>