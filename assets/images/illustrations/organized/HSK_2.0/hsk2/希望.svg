      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Background -->
  <rect x="40" y="30" width="160" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="170" cy="60" r="15" fill="#fbbf24"/>
  <path d="M50 110 Q120 80 190 110" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Character -->
