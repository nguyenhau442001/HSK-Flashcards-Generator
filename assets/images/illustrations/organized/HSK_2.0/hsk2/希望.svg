    <!-- Face -->
    <path d="M105 105 Q110 95 115 105" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M125 105 Q130 95 135 105" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M110 120 Q120 125 130 120" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Foreground Desk/Props -->
  <rect x="0" y="190" width="240" height="50" fill="#1e293b"/>
  <rect x="20" y="200" width="40" height="20" rx="4" fill="#10b981"/>
  <rect x="180" y="200" width="40" height="20" rx="4" fill="#ec4899"/>
  
  <!-- Light particles -->
  <circle cx="180" cy="80" r="2" fill="#fbbf24"/>
  <circle cx="195" cy="90" r="3" fill="#fbbf24"/>
  <circle cx="170" cy="100" r="2" fill="#fbbf24"/>
