<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Suitcase and Packing Scene -->
  <g transform="translate(40, 60)">
    <!-- Suitcase -->
    <path d="M20 40h120v80a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10V40z" fill="#334155" stroke="#fb923c" stroke-width="3"/>
    <path d="M20 60h120v10H20z" fill="#fb923c"/>
    
    <!-- Character Arms/Hands -->
    <path d="M10 80c-10-20 10-40 30-30l20 10" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    <path d="M150 80c10-20-10-40-30-30l-20 10" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Items being packed -->
    <rect x="50" y="50" width="30" height="20" rx="2" fill="#38bdf8"/>
    <rect x="90" y="55" width="25" height="35" rx="2" fill="#ec4899"/>
    <circle cx="70" cy="100" r="10" fill="#10b981"/>
  </g>

  <!-- Background details -->
  <circle cx="200" cy="40" r="30" fill="#fbbf24" opacity="0.1"/>
  <path d="M180 180l20-20m10 10l-20 20" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Character Head -->
  <circle cx="120" cy="50" r="25" fill="#fcd34d"/>
  <ellipse cx="110" cy="45" rx="3" ry="5" fill="#0f172a"/>
  <ellipse cx="130" cy="45" rx="3" ry="5" fill="#0f172a"/>
  <path d="M110 60c5 5 15 5 20 0" stroke="#0f172a" stroke-width="2" fill="none"/>
</svg>