<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wood Desk Gradient -->
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#332211" />
      <stop offset="100%" stop-color="#1c1209" />
    </linearGradient>

    <!-- Document Glow / Light -->
    <radialGradient id="light-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Stamp Red Gradient -->
    <linearGradient id="stamp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Glass Magnifier Lens -->
    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.5" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Glow -->
  <circle cx="120" cy="110" r="90" fill="url(#light-glow)" filter="url(#glow-filter)" />

  <!-- ENVIRONMENT: Wooden Detective Desk -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#wood-grad)" />
  <line x1="0" y1="172" x2="240" y2="172" stroke="#45280f" stroke-width="3" />

  <!-- Background Props: Coffee Mug & Pen Holder -->
  <!-- Pen Holder -->
  <rect x="25" y="130" width="28" height="42" rx="4" fill="#475569" filter="url(#shadow)" />
  <path d="M 27 130 L 51 130 L 48 172 L 30 172 Z" fill="#334155" />
  <!-- Pens inside -->
  <line x1="33" y1="130" x2="28" y2="105" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="39" y1="130" x2="40" y2="100" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
  <line x1="45" y1="130" x2="52" y2="108" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

  <!-- Coffee Mug -->
  <path d="M 195 138 C 195 133 199 130 204 130 L 222 130 C 227 130 231 133 231 138 L 228 168 C 228 171 225 173 222 173 L 198 173 C 195 173 192 171 192 168 Z" fill="#cbd5e1" filter="url(#shadow)" />
  <path d="M 231 142 C 238 142 240 148 240 152 C 240 158 238 162 231 162" fill="none" stroke="#cbd5e1" stroke-width="3" />
  <!-- Steam -->
  <path d="M 206 120 Q 210 110 206 100" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 218 122 Q 214 112 218 102" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- MAIN SUBJECT: The Authentic Document / Evidence (Representing "Indeed / True") -->
  <g filter="url(#shadow)">
    <!-- Document Base (Rotated slightly for dynamism) -->
    <g transform="translate(120, 115) rotate(-6)">
      <!-- Paper sheet -->
      <rect x="-65" y="-75" width="130" height="150" rx="4" fill="#f8fafc" />
      
      <!-- Document Header / Lines -->
      <rect x="-50" y="-55" width="60" height="8" rx="2" fill="#cbd5e1" />
      <line x1="-50" y1="-35" x2="35" y2="-35" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
      <line x1="-50" y1="-20" x2="45" y2="-20" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
      <line x1="-50" y1="-5" x2="20" y2="-5" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
      <line x1="-50" y1="10" x2="40" y2="10" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

      <!-- Fingerprint / Evidence Graphic on Document -->
      <circle cx="28" cy="35" r="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="2 2" />
      <path d="M 22 28 Q 28 25 34 30 Q 38 35 32 42" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <path d="M 20 33 Q 26 30 32 36 Q 36 41 30 46" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

      <!-- OFFICIAL VERIFIED STAMP ("确实" - Authentic/Confirmed Concept) -->
      <g transform="translate(-15, 25) rotate(-12)" filter="url(#shadow)">
        <circle cx="0" cy="0" r="28" fill="none" stroke="url(#stamp-grad)" stroke-width="4" stroke-dasharray="38 4" />
        <circle cx="0" cy="0" r="24" fill="none" stroke="url(#stamp-grad)" stroke-width="1.5" />
        <!-- Star inside stamp -->
        <polygon points="0,-10 3,-2 10,-2 4,3 6,10 0,6 -6,10 -4,3 -10,-2 -3,-2" fill="url(#stamp-grad)" />
        <!-- Curved fake abstract glyphs/dots inside stamp representing official mark -->
        <path d="M -12 12 Q 0 18 12 12" fill="none" stroke="url(#stamp-grad)" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- FOREGROUND INTERACTIVE ELEMENT: Premium Magnifying Glass (Inspecting the truth) -->
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M 125 125 L 165 165 C 172 172 175 170 179 166 L 183 162 C 187 158 189 155 182 148 L 142 108 Z" fill="url(#gold-grad)" />
    <!-- Handle grip lines -->
    <line x1="150" y1="140" x2="162" y2="152" stroke="#d97706" stroke-width="2" />
    <line x1="155" y1="135" x2="167" y2="147" stroke="#d97706" stroke-width="2" />
    <line x1="160" y1="130" x2="172" y2="142" stroke="#d97706" stroke-width="2" />

    <!-- Lens Rim -->
    <circle cx="95" cy="95" r="42" fill="none" stroke="#1e293b" stroke-width="6" />
    <circle cx="95" cy="95" r="42" fill="none" stroke="url(#gold-grad)" stroke-width="4" />
    
    <!-- Lens Glass & Reflection -->
    <circle cx="95" cy="95" r="39" fill="url(#lens-grad)" />
    <!-- Glossy arc on lens -->
    <path d="M 68 75 A 35 35 0 0 1 115 63" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- SPATIAL LIGHTING / ACCENTS: Floating Glowing Checkmark / Verification Sparks -->
  <!-- Glowing Spark 1 -->
  <path d="M 60 45 L 63 55 L 73 58 L 63 61 L 60 71 L 57 61 L 47 58 L 57 55 Z" fill="#fbbf24" filter="url(#glow-filter)" opacity="0.8" />
  <path d="M 60 45 L 63 55 L 73 58 L 63 61 L 60 71 L 57 61 L 47 58 L 57 55 Z" fill="#ffffff" />

  <!-- Glowing Spark 2 (Smaller) -->
  <path d="M 180 70 L 182 76 L 188 78 L 182 80 L 180 86 L 178 80 L 172 78 L 178 76 Z" fill="#38bdf8" filter="url(#glow-filter)" opacity="0.8" />
  <path d="M 180 70 L 182 76 L 188 78 L 182 80 L 180 86 L 178 80 L 172 78 L 178 76 Z" fill="#ffffff" />

  <!-- Action Spark / Success Check Floating under lens -->
  <g transform="translate(90, 85) scale(0.9)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="16" fill="#10b981" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#34d399" stroke-width="2" />
    <path d="M -6 -1 L -2 4 L 7 -5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>