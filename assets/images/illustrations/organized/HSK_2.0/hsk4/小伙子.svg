<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background elements -->
  <circle cx="180" cy="60" r="30" fill="#334155" opacity="0.5"/>
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a"/>
  
  <!-- The Young Man (小伙子) -->
  <g transform="translate(60, 40)">
    <!-- Body -->
    <path d="M40 160 L80 160 L90 200 L30 200 Z" fill="#38bdf8"/>
    <path d="M45 160 L45 130 C45 110 75 110 75 130 L75 160" fill="#fb923c"/>
    
    <!-- Arms -->
    <path d="M35 140 L20 170" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
    <path d="M85 140 L100 170" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="60" cy="100" r="35" fill="#fde68a"/>
    <path d="M45 90 Q50 80 60 80 Q70 80 75 90" fill="none" stroke="#78350f" stroke-width="3"/>
    <circle cx="50" cy="95" r="4" fill="#0f172a"/>
    <circle cx="70" cy="95" r="4" fill="#0f172a"/>
    <path d="M45 115 Q60 125 75 115" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Hair -->
    <path d="M30 95 C30 60 90 60 90 95 C90 80 80 70 60 70 C40 70 30 80 30 95" fill="#78350f"/>
  </g>
  
  <!-- Context Props: A delivery package and a bicycle handle -->
  <rect x="150" y="150" width="50" height="40" rx="4" fill="#fbbf24"/>
  <rect x="155" y="155" width="40" height="30" rx="2" fill="#f59e0b"/>
  <path d="M165 155 L165 185 M185 155 L185 185" stroke="#d97706" stroke-width="2"/>
  
  <path d="M10 200 L40 170" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="10" cy="200" r="10" fill="#334155" stroke="#10b981" stroke-width="4"/>
</svg>