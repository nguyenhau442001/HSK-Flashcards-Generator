<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Gift Box Gradients -->
    <linearGradient id="boxBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="boxLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Magic Glow -->
    <radialGradient id="magicGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Shadow -->
    <radialGradient id="floorShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <!-- Ambient light circles / bokeh -->
  <circle cx="120" cy="110" r="90" fill="url(#magicGlow)"/>
  <circle cx="60" cy="70" r="3" fill="#38bdf8" opacity="0.3"/>
  <circle cx="190" cy="60" r="4" fill="#fbbf24" opacity="0.4"/>
  <circle cx="210" cy="140" r="2.5" fill="#ec4899" opacity="0.4"/>
  <circle cx="40" cy="160" r="3.5" fill="#34d399" opacity="0.3"/>

  <!-- Floor Surface -->
  <ellipse cx="120" cy="205" rx="80" ry="18" fill="url(#floorShadow)"/>

  <!-- Scene Group: The Mysterious Gift Box ("Đoán xem quà gì") -->
  <g transform="translate(0, 15)">
    
    <!-- Question Marks floating up (Representing 'Guess') -->
    <g opacity="0.9">
      <!-- Left small Q-mark -->
      <path d="M 85 45 C 80 35, 95 30, 95 40 C 95 48, 87 50, 87 58" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="87" cy="67" r="2.5" fill="#38bdf8"/>
      
      <!-- Right medium Q-mark -->
      <path d="M 155 40 C 145 25, 165 20, 165 32 C 165 42, 153 45, 153 55" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
      <circle cx="153" cy="65" r="3" fill="#fbbf24"/>

      <!-- Center prominent glowing Q-mark -->
      <path d="M 120 25 C 105 5, 135 0, 135 18 C 135 32, 117 35, 117 50" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
      <circle cx="117" cy="62" r="3.5" fill="#ec4899"/>
    </g>

    <!-- Magical Sparkles -->
    <path d="M 70 85 L 73 93 L 81 96 L 73 99 L 70 107 L 67 99 L 59 96 L 67 93 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M 175 75 L 177 80 L 182 82 L 177 84 L 175 89 L 173 84 L 168 82 L 173 80 Z" fill="#38bdf8" opacity="0.9"/>
    <path d="M 100 15 L 102 19 L 106 20 L 102 21 L 100 25 L 98 21 L 94 20 L 98 19 Z" fill="#ec4899" opacity="0.7"/>

    <!-- Gift Box Shadow on Base -->
    <ellipse cx="120" cy="180" rx="50" ry="10" fill="#000000" opacity="0.4"/>

    <!-- Gift Box Body -->
    <rect x="75" y="110" width="90" height="70" rx="6" fill="url(#boxBody)"/>
    
    <!-- Vertical Gold Ribbon (Body) -->
    <rect x="111" y="110" width="18" height="70" fill="url(#goldRibbon)"/>

    <!-- Box Lid Overhang -->
    <rect x="69" y="95" width="102" height="20" rx="5" fill="url(#boxLid)"/>
    
    <!-- Vertical Gold Ribbon (Lid) -->
    <rect x="111" y="95" width="18" height="20" fill="url(#goldRibbon)"/>

    <!-- Lid Rim Highlight -->
    <rect x="69" y="95" width="102" height="4" rx="2" fill="#ffe4e6" opacity="0.4"/>

    <!-- Decorative Bow on Top -->
    <g transform="translate(120, 95)">
      <!-- Left Bow Loop -->
      <path d="M 0 -10 C -18 -25, -28 -5, -12 2 C -5 5, -2 2, 0 -10" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
      <!-- Right Bow Loop -->
      <path d="M 0 -10 C 18 -25, 28 -5, 12 2 C 5 5, 2 2, 0 -10" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
      <!-- Center Knot -->
      <circle cx="0" cy="-4" r="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
      <!-- Bow Tails -->
      <path d="M -5 0 L -15 15 L -8 18 L -2 5 Z" fill="#fbbf24"/>
      <path d="M 5 0 L 15 15 L 8 18 L 2 5 Z" fill="#f59e0b"/>
    </g>

    <!-- Side Details / Lighting on Box -->
    <!-- Front panel inner glow/shading -->
    <rect x="80" y="118" width="26" height="55" rx="3" fill="#ffffff" opacity="0.08"/>
    
    <!-- Curious glowing light escaping from crack in box lid -->
    <path d="M 85 95 L 155 95" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="85" cy="190" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="160" cy="185" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="140" cy="210" r="1.5" fill="#ec4899" opacity="0.5"/>
  <circle cx="95" cy="205" r="2.5" fill="#34d399" opacity="0.6"/>

</svg>