<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Counter Top Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Safe Body Gradient -->
    <linearGradient id="safeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Details (Bank Interior / Vault Wall) -->
  <g opacity="0.15">
    <circle cx="120" cy="90" r="70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="30" y1="130" x2="210" y2="130" stroke="#94a3b8" stroke-width="2"/>
    <rect x="50" y="30" width="20" height="35" rx="3" fill="#94a3b8"/>
    <rect x="170" y="40" width="25" height="30" rx="3" fill="#94a3b8"/>
  </g>

  <!-- Glowing Ambiance behind Safe -->
  <circle cx="120" cy="115" r="50" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>

  <!-- Counter Surface -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#counterGrad)" filter="url(#softShadow)"/>
  <rect x="0" y="160" width="240" height="4" fill="#38bdf8" opacity="0.6"/>

  <!-- Main Subject: The Secure Vault Safe (Representing "存" - Store/Deposit) -->
  <g transform="translate(65, 60)" filter="url(#softShadow)">
    <!-- Safe Shadow Base -->
    <rect x="-5" y="85" width="120" height="15" rx="7" fill="#0f172a" opacity="0.5"/>

    <!-- Safe Outer Box -->
    <rect x="0" y="0" width="110" height="90" rx="12" fill="url(#safeBody)" stroke="#334155" stroke-width="3"/>
    <!-- Safe Inner Frame -->
    <rect x="8" y="8" width="94" height="74" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>

    <!-- Safe Door Panel -->
    <rect x="12" y="12" width="86" height="66" rx="6" fill="url(#safeBody)"/>

    <!-- Digital Keypad / Display -->
    <rect x="22" y="22" width="22" height="14" rx="3" fill="#0f172a"/>
    <circle cx="27" cy="29" r="2" fill="#10b981" filter="url(#glow)"/>
    <circle cx="33" cy="29" r="2" fill="#38bdf8"/>
    <circle cx="39" cy="29" r="2" fill="#ef4444"/>

    <!-- Keypad Buttons Grid -->
    <rect x="22" y="40" width="6" height="6" rx="1" fill="#334155"/>
    <rect x="30" y="40" width="6" height="6" rx="1" fill="#334155"/>
    <rect x="38" y="40" width="6" height="6" rx="1" fill="#334155"/>
    <rect x="22" y="49" width="6" height="6" rx="1" fill="#334155"/>
    <rect x="30" y="49" width="6" height="6" rx="1" fill="#334155"/>
    <rect x="38" y="49" width="6" height="6" rx="1" fill="#334155"/>

    <!-- Heavy Vault Wheel / Handle -->
    <circle cx="68" cy="45" r="16" fill="url(#goldGrad)" stroke="#b45309" stroke-width="2"/>
    <circle cx="68" cy="45" r="7" fill="#1e293b"/>
    <!-- Wheel Spokes -->
    <line x1="68" y1="29" x2="68" y2="61" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="45" x2="84" y2="45" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Action Elements: Depositing Money / Coins / Vault Entry Slot -->
  <!-- Deposit Slot on top of safe -->
  <rect x="95" y="52" width="50" height="6" rx="3" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="100" y="54" width="40" height="2" rx="1" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Action Trail & Coins being "Stored" / "Deposited" -->
  <g filter="url(#softShadow)">
    <!-- Motion/Energy Dashes -->
    <path d="M 155 18 Q 135 30 125 50" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>

    <!-- Falling/Depositing Gold Coin 1 (Tilted entering slot) -->
    <g transform="translate(138, 28) rotate(-25)">
      <ellipse cx="0" cy="0" rx="10" ry="6" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="6" ry="3.5" fill="none" stroke="#fef08a" stroke-width="1"/>
    </g>

    <!-- Falling Gold Coin 2 -->
    <g transform="translate(155, 12) rotate(15)">
      <ellipse cx="0" cy="0" rx="11" ry="7" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="7" ry="4" fill="none" stroke="#fef08a" stroke-width="1"/>
    </g>
  </g>

  <!-- Stack of Saved Coins on the Counter (Foreground Context) -->
  <g transform="translate(45, 165)" filter="url(#softShadow)">
    <!-- Coin 3 (Bottom) -->
    <ellipse cx="0" cy="15" rx="16" ry="9" fill="#ca8a04"/>
    <path d="M -16 15 L -16 21 C -16 26 -7 28 0 28 C 7 28 16 26 16 21 L 16 15 C 16 20 7 22 0 22 C -7 22 -16 20 -16 15 Z" fill="#b45309"/>

    <!-- Coin 2 (Middle) -->
    <ellipse cx="0" cy="8" rx="16" ry="9" fill="#eab308"/>
    <path d="M -16 8 L -16 14 C -16 19 -7 21 0 21 C 7 21 16 19 16 14 L 16 8 C 16 13 7 15 0 15 C -7 15 -16 13 -16 8 Z" fill="#ca8a04"/>

    <!-- Coin 1 (Top) -->
    <ellipse cx="0" cy="0" rx="16" ry="9" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="10" ry="5" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- Sparkles / Success Highlights -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="165" cy="45" r="3"/>
    <circle cx="75" cy="110" r="2"/>
    <path d="M 120 20 L 122 25 L 127 27 L 122 29 L 120 34 L 118 29 L 113 27 L 118 25 Z" fill="#fbbf24" transform="scale(0.6) translate(100, 10)"/>
  </g>
</svg>