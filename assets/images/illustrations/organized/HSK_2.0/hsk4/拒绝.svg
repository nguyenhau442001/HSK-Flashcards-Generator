<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Rejection / Barrier -->
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Shield / Barrier Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Glow -->
  <circle cx="150" cy="110" r="90" fill="url(#glow-grad)" />

  <!-- Background Environment (Office/Cafe setting) -->
  <!-- Wall split & architectural details -->
  <path d="M0 0 H240 V155 H0 Z" fill="#1e293b" />
  <path d="M0 155 L240 155 L240 240 L0 240 Z" fill="#0f172a" />

  <!-- Window in background -->
  <rect x="25" y="35" width="50" height="70" rx="4" fill="#334155" opacity="0.4" />
  <path d="M50 35 V105 M25 70 H75" stroke="#475569" stroke-width="2" opacity="0.4" />

  <!-- Plant silhouette for depth -->
  <path d="M195 155 C195 130 210 110 220 95 C225 110 220 135 210 155 Z" fill="#059669" opacity="0.5" />
  <path d="M210 155 C210 135 195 120 185 110 C180 125 190 145 200 155 Z" fill="#10b981" opacity="0.4" />

  <!-- Wooden / Modern Table Surface -->
  <path d="M0 160 L240 160 L240 168 L0 168 Z" fill="#475569" />
  <path d="M0 168 L240 168 L240 240 L0 240 Z" fill="url(#table-grad)" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#64748b" stroke-width="2" />

  <!-- Prop: Coffee cup on the table -->
  <g transform="translate(35, 142)">
    <rect x="0" y="5" width="16" height="20" rx="2" fill="#cbd5e1" filter="url(#shadow)" />
    <path d="M16 10 C21 10 21 20 16 20" stroke="#cbd5e1" stroke-width="2" fill="none" />
    <ellipse cx="8" cy="5" rx="8" ry="3" fill="#94a3b8" />
    <path d="M5 2 Q8 -2 11 2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- Prop: Document / Proposal Papers on the table -->
  <g transform="translate(170, 150) rotate(-10)" filter="url(#shadow)">
    <rect x="0" y="0" width="35" height="25" rx="2" fill="#f8fafc" />
    <line x1="6" y1="6" x2="22" y2="6" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="12" x2="29" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="18" x2="16" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- CHARACTER 1: Person Offering/Pushing the Proposal (Left) -->
  <g transform="translate(35, 80)">
    <!-- Body / Torso -->
    <path d="M10 85 C10 65 30 60 50 60 C70 60 90 65 90 85 L85 110 H15 Z" fill="#38bdf8" filter="url(#shadow)" />
    <!-- Neck -->
    <rect x="42" y="42" width="16" height="22" fill="#fbcfe8" />
    <!-- Head -->
    <circle cx="50" cy="30" r="18" fill="#fbcfe8" filter="url(#shadow)" />
    <!-- Hair -->
    <path d="M32 30 C32 15 45 12 55 13 C68 14 68 28 68 32 C60 25 40 25 32 30 Z" fill="#334155" />
    <!-- Friendly / Hopeful Face -->
    <circle cx="58" cy="28" r="2" fill="#1e293b" />
    <path d="M54 36 C57 39 61 39 64 36" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Arms reaching forward offering an item -->
    <!-- Back arm -->
    <path d="M20 70 Q35 65 50 75" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Front arm pushing forward -->
    <path d="M75 75 Q90 80 105 78" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Hand holding a glowing proposal/request card -->
    <circle cx="106" cy="78" r="6" fill="#fbcfe8" />
    
    <!-- Offered Request Document (Floating slightly) -->
    <g transform="translate(100, 60) rotate(15)" filter="url(#shadow)">
      <rect x="0" y="0" width="22" height="30" rx="3" fill="#ffffff" />
      <line x1="4" y1="6" x2="18" y2="6" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
      <line x1="4" y1="12" x2="16" y2="12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="4" y1="18" x2="14" y2="18" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- CHARACTER 2: Person Rejecting (Right) -->
  <g transform="translate(125, 75)">
    <!-- Body / Torso -->
    <path d="M15 90 C15 65 35 60 55 60 C75 60 95 65 95 90 L85 115 H25 Z" fill="#6366f1" filter="url(#shadow)" />
    <!-- Neck -->
    <rect x="47" y="42" width="16" height="22" fill="#fbcfe8" />
    <!-- Head (Turned slightly back/away) -->
    <circle cx="55" cy="30" r="18" fill="#fbcfe8" filter="url(#shadow)" />
    <!-- Hair (Stylish side-part) -->
    <path d="M37 28 C37 15 50 12 62 14 C73 16 73 30 73 32 C65 24 45 22 37 28 Z" fill="#1e293b" />
    <!-- Firm / Refusing Face -->
    <circle cx="43" cy="28" r="2" fill="#1e293b" />
    <path d="M39 36 C42 34 46 34 49 36" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Defensve / Rejection Arm & Palm Out gesture -->
    <!-- Upper arm -->
    <path d="M30 75 Q15 75 10 90" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Forearm pushing outward toward the left -->
    <path d="M10 90 L-5 85" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Open Palm / Stop Gesture (Hand facing left) -->
    <circle cx="-7" cy="85" r="7" fill="#fbcfe8" filter="url(#shadow)" />
  </g>

  <!-- VISUAL MANIFESTATION OF "TỪ CHỐI" (REJECTION SHIELD / BARRIER) -->
  <!-- Centered energetic red barrier symbol representing the hard stop/refusal -->
  <g transform="translate(115, 105)" filter="url(#shadow)">
    <!-- Outer Shield Glow -->
    <circle cx="0" cy="0" r="26" fill="#ef4444" opacity="0.3" />
    
    <!-- Main Circular Shield Base -->
    <circle cx="0" cy="0" r="20" fill="url(#shield-grad)" stroke="#fee2e2" stroke-width="3" />
    
    <!-- Prohibition / 'No' Slash Line -->
    <path d="M-12 -12 L12 12" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Floating Action Spark/Impact Effects to emphasize the sudden refusal action -->
  <g transform="translate(115, 105)" opacity="0.9">
    <path d="M-32 -25 L-26 -19" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M32 -20 L24 -14" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M-30 15 L-22 11" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" />
    <path d="M28 22 L20 16" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Atmospheric Highlights -->
  <circle cx="85" cy="45" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="160" cy="30" r="2" fill="#ffffff" opacity="0.4" />
  <circle cx="205" cy="65" r="1" fill="#ffffff" opacity="0.5" />
</svg>