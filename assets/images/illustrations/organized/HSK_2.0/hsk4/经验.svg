<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for the Compass/Map -->
    <radialGradient id="goldenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Metal Gradient for Compass Rim -->
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Leather Surface -->
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="100" fill="url(#goldenGlow)" />

  <!-- SCENE: EXPLORER'S DESK / ADVENTURE SETUP (Representing Accumulated Experience) -->
  <!-- Wooden/Tactile Desk Surface (Curved Base) -->
  <path d="M 20 190 Q 120 210 220 190 L 230 220 Q 120 235 10 220 Z" fill="#0f172a" opacity="0.8" />

  <!-- Vintage Weathered Map (Background Context) -->
  <g transform="rotate(-12 120 120)">
    <path d="M 50 65 Q 120 45 190 75 L 180 175 Q 120 195 60 165 Z" fill="#334155" opacity="0.4" />
    <path d="M 60 70 Q 120 50 180 80 L 172 170 Q 120 188 68 160 Z" fill="#f8fafc" opacity="0.08" />
    <!-- Map contour lines -->
    <path d="M 80 90 Q 110 80 140 100 T 160 140" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.3" />
    <path d="M 70 120 Q 100 130 130 110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Stacking Antique Books (representing accumulated knowledge over time) -->
  <!-- Book 3 (Bottom) -->
  <path d="M 40 170 L 100 155 L 120 170 L 60 185 Z" fill="#0284c7" />
  <path d="M 40 170 L 60 185 L 60 190 L 40 175 Z" fill="#0369a1" />
  
  <!-- Book 2 (Middle) -->
  <path d="M 45 150 L 110 138 L 125 150 L 60 162 Z" fill="#10b981" />
  <path d="M 45 150 L 60 162 L 60 167 L 45 155 Z" fill="#059669" />

  <!-- Book 1 (Top) -->
  <path d="M 55 130 L 115 120 L 130 130 L 70 140 Z" fill="#ec4899" />
  <path d="M 55 130 L 70 140 L 70 144 L 55 134 Z" fill="#be185d" />

  <!-- MAIN SUBJECT: The Master Vintage Compass with Glow and Sparkles (Navigation/Experience) -->
  <g transform="translate(135, 115)">
    <!-- Compass Shadow -->
    <circle cx="5" cy="5" r="52" fill="#000000" opacity="0.5" />

    <!-- Outer Golden Rim -->
    <circle cx="0" cy="0" r="52" fill="url(#metalRim)" />
    <circle cx="0" cy="0" r="48" fill="#0f172a" />
    <circle cx="0" cy="0" r="46" fill="url(#leatherGrad)" />

    <!-- Compass Dial Marks -->
    <path d="M 0 -42 L 0 -36 M 0 36 L 0 42 M -42 0 L -36 0 M 36 0 L 42 0" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -28 -28 L -23 -23 M 28 28 L 23 23 M -28 28 L -23 23 M 28 -28 L 23 -23" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Compass Needle (Dynamic & Action-oriented pointing true north-east) -->
    <g transform="rotate(35)">
      <!-- North Pointer (Golden/Red) -->
      <polygon points="0,-38 5,0 0,6" fill="#fb923c" />
      <polygon points="0,-38 -5,0 0,6" fill="#f59e0b" />
      <!-- South Pointer (Slate) -->
      <polygon points="0,32 5,0 0,6" fill="#64748b" />
      <polygon points="0,32 -5,0 0,6" fill="#475569" />
      <!-- Center Pin -->
      <circle cx="0" cy="0" r="4" fill="#fbbf24" />
      <circle cx="0" cy="0" r="2" fill="#fff" />
    </g>

    <!-- Glass Glare Highlight -->
    <path d="M -32 -20 A 38 38 0 0 1 20 -32 A 42 42 0 0 0 -32 -20 Z" fill="#ffffff" opacity="0.15" />
    
    <!-- Top Attachment Ring -->
    <rect x="-6" y="-62" width="12" height="12" rx="3" fill="url(#metalRim)" />
    <circle cx="0" cy="-66" r="10" fill="none" stroke="url(#metalRim)" stroke-width="3" />
  </g>

  <!-- Atmospheric Elements / Floating Sparkles (representing mastery and insight gained from experience) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 60 50 Q 60 60 50 60 Q 60 60 60 70 Q 60 60 70 60 Q 60 60 60 50 Z" opacity="0.9" />
    <!-- Star 2 -->
    <path d="M 180 55 Q 180 61 174 61 Q 180 61 180 67 Q 180 61 186 61 Q 180 61 180 55 Z" opacity="0.6" />
    <!-- Star 3 (Cyan accent for modern vibrant touch) -->
    <path d="M 40 110 Q 40 115 35 115 Q 40 115 40 120 Q 40 115 45 115 Q 40 115 40 110 Z" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Floating Glowing Orbs (Depth of Field Bokeh) -->
  <circle cx="95" cy="80" r="3" fill="#38bdf8" opacity="0.6" />
  <circle cx="110" cy="65" r="2" fill="#fbbf24" opacity="0.7" />
  <circle cx="165" cy="140" r="4" fill="#10b981" opacity="0.5" />
  <circle cx="45" cy="95" r="2.5" fill="#ec4899" opacity="0.6" />

  <!-- Vignette/Border Framing for polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>