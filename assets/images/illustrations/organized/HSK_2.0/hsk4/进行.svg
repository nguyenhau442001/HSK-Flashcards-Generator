<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <!-- Gear / Action Glow -->
    <radialGradient id="actionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric background lights/shapes -->
  <circle cx="120" cy="90" r="80" fill="url(#actionGlow)" />
  <path d="M40 200 L200 200" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.3" />

  <!-- ENVIRONMENT: Meeting Room / Project Setup Scene -->
  <!-- Back Wall Whiteboard / Presentation Screen -->
  <g filter="url(#shadow)">
    <rect x="45" y="35" width="150" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="53" y="43" width="134" height="79" rx="4" fill="#0f172a" />
    <!-- Screen graphic representation: Charts and progression flow representing "Proceeding / Tiến hành" -->
    <rect x="53" y="43" width="134" height="79" rx="4" fill="url(#screenGrad)" />
    
    <!-- Animated Chart Curves (Proceeding/Progress) -->
    <path d="M 65 95 Q 90 70, 115 85 T 165 55" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="165" cy="55" r="4" fill="#38bdf8" />
    
    <!-- Progress Nodes -->
    <circle cx="75" cy="88" r="3" fill="#10b981" />
    <circle cx="100" cy="78" r="3" fill="#10b981" />
    <circle cx="135" cy="65" r="3" fill="#10b981" />
  </g>

  <!-- Conference Table -->
  <path d="M 30 185 L 210 185 L 195 210 L 45 210 Z" fill="url(#tableGrad)" filter="url(#shadow)" />
  <rect x="30" y="180" width="180" height="6" rx="3" fill="#475569" />

  <!-- CENTRAL ACTION OBJECTS: Dynamic Gears & Project Elements representing "Tiến hành" (Execution/Process) -->
  <g transform="translate(120, 140)" filter="url(#shadow)">
    <!-- Outer Glow ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- Large Gear (Background Process) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="26" fill="#d97706" />
      <!-- Gear Teeth -->
      <rect x="-4" y="-32" width="8" height="8" rx="2" fill="#d97706" />
      <rect x="-4" y="24" width="8" height="8" rx="2" fill="#d97706" />
      <rect x="-32" y="-4" width="8" height="8" rx="2" fill="#d97706" />
      <rect x="24" y="-4" width="8" height="8" rx="2" fill="#d97706" />
      
      <rect x="-22" y="-22" width="8" height="8" rx="2" transform="rotate(45)" fill="#d97706" />
      <rect x="-22" y="14" width="8" height="8" rx="2" transform="rotate(45)" fill="#d97706" />
      <rect x="14" y="-22" width="8" height="8" rx="2" transform="rotate(45)" fill="#d97706" />
      <rect x="14" y="14" width="8" height="8" rx="2" transform="rotate(45)" fill="#d97706" />
      <circle cx="0" cy="0" r="14" fill="#1e293b" />
    </g>

    <!-- Small Interlocking Gear (Active Action) -->
    <g transform="translate(24, -20)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="16" fill="#fbbf24" />
      <!-- Small Gear Teeth -->
      <rect x="-3" y="-20" width="6" height="6" rx="1" fill="#fbbf24" />
      <rect x="-3" y="14" width="6" height="6" rx="1" fill="#fbbf24" />
      <rect x="-20" y="-3" width="6" height="6" rx="1" fill="#fbbf24" />
      <rect x="14" y="-3" width="6" height="6" rx="1" fill="#fbbf24" />
      <circle cx="0" cy="0" r="8" fill="#1e293b" />
    </g>

    <!-- Center Play/Action Arrow symbolizing "Ongoing / Tiến hành" -->
    <circle cx="0" cy="0" r="12" fill="#10b981" />
    <polygon points="-3,-5 6,0 -3,5" fill="#ffffff" />
  </g>

  <!-- FOREGROUND PROPS (Contextualizing the Meeting/Process) -->
  <!-- Laptop on the left -->
  <g transform="translate(60, 150)" filter="url(#shadow)">
    <!-- Base -->
    <polygon points="-22,18 28,18 22,25 -16,25" fill="#64748b" />
    <rect x="-23" y="24" width="54" height="2" rx="1" fill="#94a3b8" />
    <!-- Screen -->
    <path d="M-18,-10 L24,-10 L22,18 L-16,18 Z" fill="#334155" />
    <path d="M-14,-7 L20,-7 L18,15 L-12,15 Z" fill="#0ea5e9" opacity="0.8" />
    <!-- Dashboard lines on laptop -->
    <line x1="-10" y1="-2" x2="5" y2="-2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-10" y1="3" x2="12" y2="3" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-10" y1="8" x2="0" y2="8" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Document / Clipboard on the right (Plan being executed) -->
  <g transform="translate(180, 155) rotate(12)" filter="url(#shadow)">
    <rect x="-14" y="-18" width="28" height="36" rx="3" fill="#f8fafc" />
    <!-- Clip -->
    <rect x="-6" y="-22" width="12" height="6" rx="2" fill="#64748b" />
    <!-- Lines of text/tasks -->
    <line x1="-9" y1="-10" x2="6" y2="-10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-9" y1="-3" x2="9" y2="-3" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-9" y1="4" x2="2" y2="4" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Checkmark (Task in progress/done) -->
    <circle cx="-6" cy="11" r="3" fill="#10b981" />
    <polyline points="-8,11 -6,13 -3,9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="11" x2="8" y2="11" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coffee cup for active working atmosphere -->
  <g transform="translate(100, 168)" filter="url(#shadow)">
    <path d="M-8,0 L8,0 L6,16 C6,18 4,19 2,19 L-2,19 C-4,19 -6,18 -6,16 Z" fill="#ec4899" />
    <path d="M6,3 C11,3 11,11 6,12" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M-3,-4 C-3,-7 1,-8 1,-11" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M3,-3 C3,-6 7,-7 7,-10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Ambient lighting dots -->
  <circle cx="35" cy="80" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="205" cy="70" r="3" fill="#f59e0b" opacity="0.4" />
  <circle cx="215" cy="110" r="1.5" fill="#10b981" opacity="0.5" />
</svg>