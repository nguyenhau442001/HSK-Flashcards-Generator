<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Scene: A park bench at dusk, symbolizing reconciliation -->
  <path d="M40 180 L200 180 L190 210 L50 210 Z" fill="#475569"/>
  <path d="M50 180 L60 150 L180 150 L190 180 Z" fill="#64748b"/>
  
  <!-- Character 1: Offering a golden flower -->
  <circle cx="80" cy="120" r="25" fill="#fbbf24"/>
  <path d="M65 135 Q80 150 95 135" stroke="#fbbf24" stroke-width="4" fill="none"/>
  <path d="M80 145 L80 180" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="80" cy="185" r="10" fill="#10b981"/>
  
  <!-- Character 2: Receiving, turning towards the other -->
  <circle cx="160" cy="120" r="25" fill="#38bdf8"/>
  <path d="M145 135 Q160 150 175 135" stroke="#38bdf8" stroke-width="4" fill="none"/>
  
  <!-- Atmospheric elements: Soft glow of reconciliation -->
  <circle cx="120" cy="100" r="40" fill="#fb923c" opacity="0.1"/>
  <circle cx="120" cy="100" r="20" fill="#fb923c" opacity="0.2"/>
  
  <!-- Ground details -->
  <ellipse cx="120" cy="210" rx="100" ry="10" fill="#0f172a" opacity="0.5"/>
  
  <!-- Floating petals -->
  <path d="M100 80 Q110 70 120 80 T140 80" stroke="#ec4899" stroke-width="2" fill="none"/>
  <circle cx="130" cy="75" r="3" fill="#ec4899"/>
  <circle cx="110" cy="90" r="3" fill="#ec4899"/>
</svg>