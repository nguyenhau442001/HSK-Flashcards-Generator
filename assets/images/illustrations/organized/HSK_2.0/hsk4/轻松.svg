<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Cushion Gradient -->
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Tea Mug Gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Plant Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Glow -->
  <circle cx="120" cy="110" r="100" fill="url(#lampGlow)" />

  <!-- Background Room Elements -->
  <!-- Wallpaper line/accent -->
  <path d="M0 170 L240 170" stroke="#334155" stroke-width="2" />
  <!-- Window frame background -->
  <rect x="140" y="30" width="70" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <path d="M175 30 L175 120 M140 75 L210 75" stroke="#475569" stroke-width="1.5" />
  <!-- Night sky through window -->
  <circle cx="160" cy="50" r="2" fill="#e2e8f0" opacity="0.6" />
  <circle cx="195" cy="95" r="1.5" fill="#e2e8f0" opacity="0.8" />
  <circle cx="180" cy="45" r="1" fill="#e2e8f0" opacity="0.5" />

  <!-- Bookshelf / Side Table -->
  <rect x="15" y="110" width="45" height="60" rx="4" fill="#475569" filter="url(#softShadow)" />
  <rect x="20" y="125" width="35" height="6" fill="#334155" />
  <rect x="20" y="145" width="35" height="6" fill="#334155" />
  <!-- Books on shelf -->
  <path d="M25 125 L25 115 C25 113 27 112 29 112 L33 112 C35 112 37 113 37 115 L37 125 Z" fill="#ec4899" />
  <path d="M38 125 L38 117 C38 115 40 114 42 114 L45 114 C47 114 49 115 49 117 L49 125 Z" fill="#38bdf8" />

  <!-- Potted Plant on Shelf -->
  <path d="M25 145 L35 145 L33 133 L27 133 Z" fill="url(#potGrad)" />
  <path d="M30 133 C26 130 24 124 28 120 C32 122 32 128 30 133 Z" fill="#10b981" />
  <path d="M30 133 C34 130 36 124 32 120 C28 122 28 128 30 133 Z" fill="#34d399" />

  <!-- Main Armchair (Represents Comfort) -->
  <!-- Chair Backrest -->
  <path d="M70 75 Q120 50 170 75 L175 160 Q120 170 65 160 Z" fill="#475569" filter="url(#softShadow)" />
  <!-- Chair Inner Cushion -->
  <path d="M78 85 Q120 68 162 85 L166 150 Q120 158 74 150 Z" fill="#334155" />

  <!-- Cozy Seat Cushion -->
  <path d="M60 145 Q120 135 180 145 L190 170 Q120 185 50 170 Z" fill="url(#cushionGrad)" filter="url(#softShadow)" />

  <!-- Floor Rug -->
  <ellipse cx="120" cy="195" rx="85" ry="20" fill="#334155" opacity="0.8" />
  <ellipse cx="120" cy="195" rx="75" ry="16" fill="#1e293b" opacity="0.5" />

  <!-- Coffee Table with Tea Mug -->
  <ellipse cx="180" cy="175" rx="30" ry="12" fill="#64748b" filter="url(#softShadow)" />
  <ellipse cx="180" cy="173" rx="28" ry="10" fill="#94a3b8" />
  <!-- Tea Mug -->
  <rect x="172" y="155" width="14" height="16" rx="3" fill="url(#mugGrad)" />
  <path d="M186 159 C190 159 191 165 186 167" stroke="#e11d48" stroke-width="2" fill="none" />
  <!-- Steam from mug -->
  <path d="M176 152 Q178 147 176 142" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M182 153 Q184 148 182 143" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Relaxed Character Body -->
  <!-- Legs stretched out comfortably onto the rug -->
  <path d="M100 165 L145 190 L160 185" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Shoes / Slippers -->
  <path d="M152 182 Q163 186 168 190 Q160 195 150 189 Z" fill="#f59e0b" />

  <!-- Torso leaning back -->
  <path d="M85 150 Q100 120 115 100 L135 115 Q120 135 105 160 Z" fill="url(#shirtGrad)" />

  <!-- Relaxed Head tilted back slightly -->
  <circle cx="125" cy="85" r="16" fill="#fbcfe8" filter="url(#softShadow)" />
  <!-- Closed Happy Eyes (Arcs) -->
  <path d="M120 84 Q123 87 126 84" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M128 84 Q131 87 134 84" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Content Smile -->
  <path d="M125 91 Q128 94 131 91" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Hair -->
  <path d="M110 83 C110 74 118 70 126 70 C136 70 140 78 140 85 C135 83 133 80 126 80 C118 80 112 82 110 83 Z" fill="#334155" />

  <!-- Relaxed Arms -->
  <!-- Arm resting behind head / on chair -->
  <path d="M95 125 Q110 100 120 105" stroke="#7e22ce" stroke-width="10" stroke-linecap="round" fill="none" />
  <!-- Hand behind head -->
  <circle cx="122" cy="103" r="5" fill="#fbcfe8" />
  <!-- Arm resting on belly/chair -->
  <path d="M115 125 Q135 135 145 125" stroke="#7e22ce" stroke-width="10" stroke-linecap="round" fill="none" />

  <!-- Floating "Relief / Stress-Free" Visual Cues (Zzz or gentle floating bubbles/sparkles) -->
  <g opacity="0.8">
    <path d="M95 55 Q98 52 95 49 T95 43" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M85 65 Q88 62 85 59 T85 53" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Gentle Star / Sparkle of satisfaction -->
    <path d="M145 50 L147 55 L152 57 L147 59 L145 64 L143 59 L138 57 L143 55 Z" fill="#fbbf24" />
    <path d="M75 90 L76 93 L79 94 L76 95 L75 98 L74 95 L71 94 L74 93 Z" fill="#38bdf8" opacity="0.6" />
  </g>

</svg>