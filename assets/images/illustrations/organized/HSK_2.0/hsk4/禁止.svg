<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Metal Gradient for Sign Post & Frame -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Sign Red Gradient -->
    <linearGradient id="redSignGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Glow Effect for Sign -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Realism -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full Bleed Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Environment context) -->
  <!-- Indoor wall paneling / architecture hints -->
  <path d="M 0 180 L 240 180" stroke="#334155" stroke-width="2" opacity="0.4"/>
  <rect x="30" y="40" width="30" height="140" fill="#334155" opacity="0.15" rx="4"/>
  <rect x="180" y="60" width="30" height="120" fill="#334155" opacity="0.15" rx="4"/>

  <!-- Ambient background glow (warm indoor lighting) -->
  <circle cx="120" cy="110" r="70" fill="#fbbf24" opacity="0.05" filter="blur(20px)"/>

  <!-- Floor Surface -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#090d16"/>
  <ellipse cx="120" cy="195" rx="70" ry="12" fill="#000000" opacity="0.6"/>

  <!-- MAIN SCENE SUBJECT: PROHIBITION SIGN (Cấm) & ENVIRONMENT -->
  <!-- Sign Post (Vertical Pole) -->
  <rect x="114" y="110" width="12" height="85" fill="url(#metalGrad)" filter="url(#softShadow)"/>
  <rect x="117" y="110" width="3" height="85" fill="#ffffff" opacity="0.4"/>

  <!-- Sign Head Assembly (Circular Prohibition Sign) -->
  <!-- Outer Glow -->
  <circle cx="120" cy="90" r="48" fill="#ef4444" opacity="0.3" filter="url(#neonGlow)"/>
  
  <!-- Outer White Rim -->
  <circle cx="120" cy="90" r="44" fill="#ffffff" filter="url(#dropShadow)"/>
  
  <!-- Red Border & Inner Fill -->
  <circle cx="120" cy="90" r="40" fill="url(#redSignGrad)"/>
  <circle cx="120" cy="90" r="30" fill="#ffffff"/>

  <!-- VIOLATION OBJECT: SMOKING CIGARETTE (representing 'Cấm hút thuốc' / Prohibition Context) -->
  <!-- Floating/Trapped Cigarette inside the prohibition sign -->
  <g transform="rotate(-35 120 90)">
    <!-- Cigarette Body -->
    <rect x="100" y="86" width="32" height="8" rx="2" fill="#e2e8f0" filter="url(#softShadow)"/>
    <!-- Filter -->
    <rect x="100" y="86" width="10" height="8" rx="2" fill="#d97706"/>
    <!-- Filter lines -->
    <line x1="105" y1="86" x2="105" y2="94" stroke="#b45309" stroke-width="1"/>
    <!-- Lit Tip (Glowing Ember) -->
    <rect x="128" y="86" width="4" height="8" rx="1" fill="#f97316"/>
    <circle cx="130" cy="90" r="2" fill="#fbbf24"/>
    <!-- Smoke wisps escaping -->
    <path d="M 134 88 Q 140 84 138 78 Q 136 72 142 68" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Prohibition Slash (The Red Diagonal Bar) -->
  <rect x="88" y="86" width="64" height="10" rx="5" fill="url(#redSignGrad)" transform="rotate(-45 120 90)" filter="url(#dropShadow)"/>
  <rect x="92" y="88" width="56" height="3" rx="1.5" fill="#ffffff" opacity="0.3" transform="rotate(-45 120 90)"/>

  <!-- FOREGROUND / SUPPORTING PROPS (Adding rich narrative and scale) -->
  <!-- A discarded ashtray or smoke hazard element on the floor to ground the context -->
  <g transform="translate(60, 190)">
    <!-- Floor shadow -->
    <ellipse cx="0" cy="8" rx="18" ry="6" fill="#000000" opacity="0.5"/>
    <!-- Modern metallic tray -->
    <path d="M -16 4 C -16 -2 16 -2 16 4 C 16 10 -16 10 -16 4 Z" fill="#475569"/>
    <ellipse cx="0" cy="3" rx="14" ry="5" fill="#334155"/>
    <ellipse cx="0" cy="2" rx="10" ry="3" fill="#1e293b"/>
    <!-- Tiny stub inside -->
    <rect x="-4" y="0" width="6" height="3" rx="1" fill="#ea580c" transform="rotate(15)"/>
  </g>

  <!-- Atmospheric dust motes / lighting particles -->
  <circle cx="70" cy="60" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="170" cy="130" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="50" cy="140" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="190" cy="50" r="1.5" fill="#f43f5e" opacity="0.5"/>

</svg>