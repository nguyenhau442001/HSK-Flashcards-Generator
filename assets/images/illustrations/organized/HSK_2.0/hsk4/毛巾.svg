<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="towelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="towelFold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="soapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow -->
  <circle cx="120" cy="130" r="90" fill="url(#glow)" />

  <!-- Bathroom Shelf / Wall Context -->
  <!-- Wall tiles line -->
  <path d="M 20 70 L 220 70" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />
  
  <!-- Wooden Shelf -->
  <path d="M 30 185 L 210 185 C 215 185, 218 189, 215 192 L 205 196 C 203 197, 200 197, 198 196 L 42 196 C 40 197, 37 197, 35 196 L 25 192 C 22 189, 25 185, 30 185 Z" fill="#b45309" filter="url(#shadow)" />
  <path d="M 30 185 L 210 185 L 210 189 L 30 189 Z" fill="#d97706" />

  <!-- Atmospheric bubbles / water drops in air -->
  <circle cx="75" cy="95" r="3" fill="#38bdf8" opacity="0.6" />
  <circle cx="82" cy="90" r="1.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="170" cy="85" r="4" fill="#38bdf8" opacity="0.5" />
  <circle cx="163" cy="78" r="2" fill="#38bdf8" opacity="0.3" />

  <!-- Background Prop: Soap Dish & Soap -->
  <g transform="translate(155, 140)">
    <!-- Dish -->
    <ellipse cx="20" cy="35" rx="22" ry="7" fill="#64748b" />
    <ellipse cx="20" cy="33" rx="20" ry="5" fill="#94a3b8" />
    <!-- Soap bar -->
    <rect x="7" y="18" width="26" height="15" rx="6" fill="url(#soapGrad)" filter="url(#shadow)" />
    <!-- Soap bubbles -->
    <circle cx="15" cy="15" r="4" fill="#fbcfe8" opacity="0.8" />
    <circle cx="21" cy="11" r="3" fill="#fbcfe8" opacity="0.8" />
    <circle cx="25" cy="14" r="1.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Background Prop: Small plant / leaf in ceramic pot for organic life -->
  <g transform="translate(35, 138)">
    <!-- Pot -->
    <path d="M 10 32 L 22 32 C 23 32, 24 35, 23 38 L 19 45 C 18 47, 14 47, 13 45 L 9 38 C 8 35, 9 32, 10 32 Z" fill="#e2e8f0" />
    <ellipse cx="16" cy="32" rx="6" ry="2" fill="#cbd5e1" />
    <!-- Stems & leaves -->
    <path d="M 16 32 C 16 25, 10 20, 8 15" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 16 32 C 16 22, 22 18, 24 12" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="8" cy="14" r="4" fill="#34d399" />
    <circle cx="24" cy="11" r="5" fill="#059669" />
    <circle cx="16" cy="19" r="3.5" fill="#10b981" />
  </g>

  <!-- MAIN SUBJECT: Máojīn (The Folded & Draped Face Towel) -->
  <g filter="url(#shadow)">
    <!-- Hanging / Draped Part of the Towel -->
    <path d="M 75 110 
             C 80 145, 90 175, 115 186
             C 140 175, 150 145, 155 110
             Z" 
          fill="url(#towelGrad)" />

    <!-- Towel Texture / Vertical Folds -->
    <path d="M 100 110 C 102 135, 107 160, 115 178" stroke="#0284c7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 130 110 C 128 135, 123 160, 115 178" stroke="#0284c7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- Upper Folded Over Body (The roll/fold over the shelf edge) -->
    <path d="M 60 100 
             C 60 92, 170 92, 170 100
             C 170 112, 60 112, 60 100 Z" 
          fill="url(#towelFold)" />

    <path d="M 65 106 
             C 65 99, 165 99, 165 106
             C 165 114, 65 114, 65 106 Z" 
          fill="url(#towelGrad)" />

    <!-- Decorative Woven Border / Fringe on Towel Bottom -->
    <path d="M 85 172 C 100 179, 130 179, 145 172" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Fringe lines -->
    <path d="M 90 175 L 89 181 M 100 177 L 100 183 M 115 179 L 115 185 M 130 177 L 130 183 M 140 175 L 141 181" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Action Sparkles / Cleanliness Glow around the towel -->
  <g transform="translate(115, 95)">
    <!-- Sparkle 1 -->
    <path d="M 0 -12 C 1 -4, 4 -1, 12 0 C 4 1, 1 4, 0 12 C -1 4, -4 1, -12 0 C -4 -1, -1 -4, 0 -12 Z" fill="#fbbf24" />
    <!-- Sparkle 2 (smaller, offset) -->
    <g transform="translate(-55, 30) scale(0.6)">
      <path d="M 0 -12 C 1 -4, 4 -1, 12 0 C 4 1, 1 4, 0 12 C -1 4, -4 1, -12 0 C -4 -1, -1 -4, 0 -12 Z" fill="#fbbf24" />
    </g>
    <!-- Sparkle 3 -->
    <g transform="translate(60, 20) scale(0.7)">
      <path d="M 0 -12 C 1 -4, 4 -1, 12 0 C 4 1, 1 4, 0 12 C -1 4, -4 1, -12 0 C -4 -1, -1 -4, 0 -12 Z" fill="#38bdf8" />
    </g>
  </g>

</svg>