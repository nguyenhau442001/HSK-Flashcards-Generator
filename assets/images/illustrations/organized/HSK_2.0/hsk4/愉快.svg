<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Travel vibes -->
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.2"/>
  <path d="M40 180 Q 120 120 200 180 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Character: Joyful Traveler -->
  <g transform="translate(60, 40)">
    <!-- Backpack -->
    <path d="M40 60 h 40 v 60 h -40 z" fill="#ec4899" rx="10"/>
    <path d="M50 50 h 20 v 10 h -20 z" fill="#fb923c"/>
    
    <!-- Body -->
    <path d="M45 120 l -10 60 l 60 0 l -10 -60" fill="#38bdf8"/>
    
    <!-- Arms (Dynamic/Open) -->
    <path d="M35 130 l -30 20" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M95 130 l 30 20" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="60" cy="50" r="35" fill="#fde68a"/>
    <!-- Face: Expressive Joy -->
    <path d="M45 45 q 5 -5 10 0" stroke="#0f172a" stroke-width="3" fill="none"/>
    <path d="M75 45 q 5 -5 10 0" stroke="#0f172a" stroke-width="3" fill="none"/>
    <path d="M45 70 q 15 15 30 0" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Hair -->
    <path d="M30 50 q 0 -30 30 -30 q 30 0 30 30" fill="#fb923c"/>
  </g>
  
  <!-- Decorative Sparkles -->
  <path d="M190 100 l 5 10 l 5 -10 l -5 -10 z" fill="#f59e0b"/>
  <path d="M30 150 l 4 8 l 4 -8 l -4 -8 z" fill="#10b981"/>
  <path d="M210 160 l 3 6 l 3 -6 l -3 -6 z" fill="#38bdf8"/>
</svg>