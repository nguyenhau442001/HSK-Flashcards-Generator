<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow for Patience/Teaching -->
    <radialGradient id="warm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character & Prop Gradients -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="teacher-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="student-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="hair-teacher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment / Classroom Details -->
  <!-- Ambient Warm Glow centered between teacher and student -->
  <circle cx="120" cy="130" r="80" fill="url(#warm-glow)"/>

  <!-- Bookshelf Background -->
  <g opacity="0.4">
    <rect x="25" y="40" width="40" height="90" fill="#334155" rx="2"/>
    <rect x="30" y="55" width="30" height="6" fill="#64748b"/>
    <rect x="30" y="80" width="30" height="6" fill="#64748b"/>
    <rect x="30" y="105" width="30" height="6" fill="#64748b"/>
    <!-- Books on shelf -->
    <path d="M32 55 L32 47 L38 47 L38 55 Z" fill="#f59e0b"/>
    <path d="M40 55 L40 45 L46 45 L46 55 Z" fill="#10b981"/>
    <path d="M48 55 L48 48 L56 48 L56 55 Z" fill="#38bdf8"/>
  </g>

  <!-- Potted Plant (Cozy classroom touch) -->
  <g>
    <path d="M205 125 L215 150 L195 150 Z" fill="#64748b"/>
    <ellipse cx="205" cy="125" rx="10" ry="3" fill="#94a3b8"/>
    <!-- Leaves -->
    <path d="M205 122 Q190 100 195 90 Q205 110 205 122 Z" fill="#10b981"/>
    <path d="M205 122 Q220 105 225 95 Q215 115 205 122 Z" fill="#34d399"/>
    <path d="M205 122 Q205 90 210 85 Q205 105 205 122 Z" fill="#059669"/>
  </g>

  <!-- Classroom Table / Desk -->
  <path d="M30 160 L210 160 L200 190 L40 190 Z" fill="url(#desk-grad)" filter="url(#soft-shadow)"/>
  <rect x="35" y="155" width="170" height="8" rx="3" fill="#475569"/>

  <!-- Desk Props (Notebooks, Pen, Lamp base) -->
  <rect x="100" y="163" width="40" height="25" rx="2" fill="#f8fafc" transform="rotate(-5 120 175)"/>
  <line x1="108" y1="170" x2="132" y2="170" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="177" x2="128" y2="177" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <!-- Pencil -->
  <path d="M85 175 L100 170 L102 173 L87 178 Z" fill="#fbbf24"/>
  <polygon points="100,170 103,171.5 100,173" fill="#334155"/>

  <!-- STUDENTS (Left side, leaning forward attentively/puzzled) -->
  <g id="student" filter="url(#soft-shadow)">
    <!-- Body / Torso -->
    <path d="M60 190 C60 165 75 155 85 155 C95 155 105 165 105 190 Z" fill="url(#student-shirt)"/>
    <!-- Head -->
    <circle cx="82" cy="130" r="18" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M66 128 C66 115 75 110 85 110 C97 110 98 122 98 132 C92 128 85 126 78 128 C73 130 68 130 66 128 Z" fill="#334155"/>
    <!-- Face expression (Thoughtful/Struggling a bit) -->
    <circle cx="76" cy="130" r="1.5" fill="#1e293b"/>
    <circle cx="88" cy="130" r="1.5" fill="#1e293b"/>
    <!-- Puzzled curved eyebrows -->
    <path d="M74 126 Q76 124 79 127" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M85 127 Q88 124 90 126" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Gentle open mouth -->
    <path d="M80 137 Q82 140 85 137" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Hand resting on cheek (Pensive pose) -->
    <circle cx="75" cy="148" r="5" fill="#ffedd5"/>
    <path d="M78 153 L72 165 L82 165 Z" fill="url(#student-shirt)"/>
  </g>

  <!-- TEACHER (Right side, leaning in patiently, warm guiding gesture) -->
  <g id="teacher" filter="url(#soft-shadow)">
    <!-- Body / Torso -->
    <path d="M140 190 C140 160 155 150 170 150 C185 150 200 160 200 190 Z" fill="url(#teacher-shirt)"/>
    <!-- Neck -->
    <rect x="163" y="138" width="14" height="15" fill="#ffedd5"/>
    <!-- Head -->
    <circle cx="170" cy="125" r="20" fill="#ffedd5"/>
    <!-- Friendly Teacher Hair -->
    <path d="M152 125 C152 108 162 103 172 103 C188 103 190 115 190 130 C185 128 175 126 168 128 C160 130 155 128 152 125 Z" fill="url(#hair-teacher)"/>
    <path d="M152 122 C152 112 158 106 168 105 C164 112 162 120 160 130 Z" fill="url(#hair-teacher)"/>
    <!-- Glasses -->
    <rect x="160" y="117" width="10" height="7" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="172" y="117" width="10" height="7" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="170" y1="120" x2="172" y2="120" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Warm Smiling Eyes -->
    <path d="M163 128 Q165 130 167 128" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M175 128 Q177 130 179 128" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Gentle Smiling Mouth -->
    <path d="M166 135 Q170 139 174 135" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Patient Pointing/Guiding Arm -->
    <path d="M155 160 Q135 155 115 168" stroke="url(#teacher-shirt)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Teacher Hand pointing gently towards student's notebook -->
    <circle cx="112" cy="170" r="5" fill="#ffedd5"/>
  </g>

  <!-- Interactive Floating Elements / Thought bubbles representing learning process -->
  <!-- Floating Sparkles / Patience & Insight symbols -->
  <g transform="translate(115, 80)">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#fbbf24" filter="url(#soft-shadow)"/>
  </g>
  <g transform="translate(145, 65) scale(0.6)">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#38bdf8" filter="url(#soft-shadow)"/>
  </g>
  <g transform="translate(95, 95) scale(0.5)">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#10b981" filter="url(#soft-shadow)"/>
  </g>

  <!-- Glowing Heart/Care Symbol subtly floating above teacher to signify patience & care -->
  <path d="M170 85 C170 80 163 72 157 78 C153 82 157 88 170 96 C183 88 187 82 183 78 C177 72 170 80 170 85 Z" fill="#ec4899" opacity="0.85" filter="url(#soft-shadow)" transform="translate(0, -5) scale(0.8)"/>

  <!-- Foreground Atmospheric Lighting Accent -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.1"/>
</svg>