<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- UI Panel Glow -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Vibrant Gauge Gradient (90% full) -->
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Ambient Lab/Data Nodes) -->
  <g opacity="0.15">
    <circle cx="40" cy="50" r="30" fill="none" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5"/>
    <circle cx="200" cy="180" r="40" fill="none" stroke="#10b981" stroke-dasharray="6 6" stroke-width="1.5"/>
    <line x1="70" y1="50" x2="140" y2="50" stroke="#38bdf8" stroke-width="1"/>
    <line x1="160" y1="180" x2="190" y2="180" stroke="#10b981" stroke-width="1"/>
  </g>

  <!-- Main Holographic / Isometric Data Dashboard Scene -->
  <g filter="url(#shadow)">
    <!-- Base Desk/Surface -->
    <path d="M 30,190 L 210,190 L 190,215 L 50,215 Z" fill="#0f172a" opacity="0.8"/>
    <ellipse cx="120" cy="190" rx="90" ry="12" fill="#1e293b"/>

    <!-- Main Floating Holographic Display Board -->
    <rect x="35" y="45" width="170" height="135" rx="16" fill="url(#panelGrad)" stroke="#475569" stroke-width="2"/>
    
    <!-- Top Bar of Dashboard -->
    <circle cx="55" cy="63" r="4" fill="#ef4444"/>
    <circle cx="67" cy="63" r="4" fill="#f59e0b"/>
    <circle cx="79" cy="63" r="4" fill="#10b981"/>
    
    <!-- Decorative Data Wave / Graph Line in Background of Panel -->
    <path d="M 50,115 Q 80,90 110,120 T 170,100 T 200,110" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Circular Progress Gauge (Representing the 90% Concept Visually) -->
    <g transform="translate(120, 108)">
      <!-- Background track -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Active Progress Arc (approx 90%: 216 degrees out of 240 max visual span) -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="url(#gaugeGrad)" stroke-width="8" stroke-linecap="round"
              stroke-dasharray="238" stroke-dashoffset="24" transform="rotate(-90)" filter="url(#glow)"/>

      <!-- Center Icon / Trophy or Star for Success Context -->
      <path d="M 0,-12 L 3,-4 L 11,-4 L 5,1 L 8,9 L 0,4 L -8,9 L -5,1 L -11,-4 L -3,-4 Z" fill="url(#goldGrad)" filter="url(#shadow)" transform="scale(1.2)"/>
      
      <!-- Percentage Symbol Graphic Representation -->
      <g transform="translate(-20, 22) scale(0.55)" stroke="#38bdf8" stroke-width="5" stroke-linecap="round">
        <circle cx="10" cy="10" r="6" fill="none"/>
        <line x1="4" y1="26" x2="26" y2="4"/>
        <circle cx="30" cy="30" r="6" fill="none"/>
      </g>
      <!-- Number "90" built purely of vector shapes -->
      <g transform="translate(2, 17)">
        <!-- '9' shape -->
        <circle cx="-5" cy="7" r="5" fill="none" stroke="#ffffff" stroke-width="3"/>
        <path d="M 0,2 L 0,14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <!-- '0' shape -->
        <ellipse cx="12" cy="8" rx="5" ry="6" fill="none" stroke="#ffffff" stroke-width="3"/>
      </g>
    </g>

    <!-- Mini Bar Graphs at the Bottom of Dashboard -->
    <g transform="translate(50, 142)">
      <rect x="0" y="10" width="12" height="15" rx="3" fill="#38bdf8" opacity="0.6"/>
      <rect x="18" y="4" width="12" height="21" rx="3" fill="#38bdf8" opacity="0.8"/>
      <rect x="36" y="14" width="12" height="11" rx="3" fill="#38bdf8" opacity="0.4"/>
      
      <!-- Highlighted Tall Bar (Target Data) -->
      <rect x="54" y="-2" width="12" height="27" rx="3" fill="url(#gaugeGrad)" filter="url(#glow)"/>
      
      <rect x="72" y="8" width="12" height="17" rx="3" fill="#38bdf8" opacity="0.5"/>
      <rect x="90" y="5" width="12" height="20" rx="3" fill="#38bdf8" opacity="0.7"/>
      <rect x="108" y="12" width="12" height="13" rx="3" fill="#38bdf8" opacity="0.4"/>
    </g>
  </g>

  <!-- Foreground Action Props (Floating Success Analytics Elements) -->
  <!-- Floating Checkmark Badge -->
  <g transform="translate(185, 45)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="16" fill="#10b981"/>
    <path d="M -6,0 L -2,4 L 7,-5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Star Icon -->
  <g transform="translate(45, 60)" filter="url(#shadow)">
    <path d="M 0,-8 L 2.2,-2.8 L 7.6,-2.8 L 3.2,0.6 L 4.8,6 L 0,2.6 L -4.8,6 L -3.2,0.6 L -7.6,-2.8 L -2.2,-2.8 Z" fill="url(#goldGrad)" transform="scale(1.3)"/>
  </g>

  <!-- Subtle Light Reflections on Glass Panel -->
  <path d="M 45,50 L 120,50 L 90,120 L 38,120 Z" fill="#ffffff" opacity="0.05" pointer-events="none"/>
</svg>