<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="40" y="150" width="160" height="15" rx="2" fill="#334155"/>
  <rect x="50" y="165" width="10" height="60" fill="#475569"/>
  <rect x="180" y="165" width="10" height="60" fill="#475569"/>
  
  <!-- Books and Supplies -->
  <rect x="60" y="130" width="30" height="20" rx="2" fill="#fb923c"/>
  <rect x="65" y="125" width="30" height="20" rx="2" fill="#f59e0b"/>
  
  <!-- Character -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-40 120 C-40 80, -20 60, 0 60 C20 60, 40 80, 40 120" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="40" r="25" fill="#fde68a"/>
    <!-- Arm extending -->
    <path d="M20 70 L60 90 L70 80" fill="none" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand holding stack of papers -->
    <rect x="60" y="70" width="30" height="40" rx="2" fill="#e2e8f0"/>
    <rect x="62" y="75" width="26" height="5" fill="#cbd5e1"/>
    <rect x="62" y="85" width="26" height="5" fill="#cbd5e1"/>
    <rect x="62" y="95" width="26" height="5" fill="#cbd5e1"/>
  </g>
  
  <!-- Recipient Character (Partial) -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="20" r="20" fill="#10b981"/>
    <path d="M-20 40 L20 40 L10 120 L-10 120 Z" fill="#10b981"/>
  </g>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
</svg>