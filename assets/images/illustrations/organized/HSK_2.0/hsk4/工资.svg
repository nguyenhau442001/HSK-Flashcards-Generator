<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="coin-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="coin-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Envelope Gradient -->
    <linearGradient id="env-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="env-flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="env-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Screen Glow -->
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background glow representing financial growth -->
  <circle cx="120" cy="110" r="80" fill="url(#screen-glow)" />

  <!-- Environment: Office Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#desk-grad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" />

  <!-- Background Office Elements -->
  <!-- Plant Pot -->
  <path d="M 25 150 L 35 170 L 15 170 Z" fill="#64748b" />
  <path d="M 12 150 L 38 150 L 35 146 L 15 146 Z" fill="#94a3b8" />
  <!-- Plant Leaves (Upward growth/success motif) -->
  <path d="M 25 146 Q 20 120 10 115 Q 25 130 25 146 Z" fill="#10b981" />
  <path d="M 25 146 Q 30 110 40 105 Q 30 125 25 146 Z" fill="#34d399" />
  <path d="M 25 146 Q 25 110 23 100 Q 25 125 25 146 Z" fill="#059669" />

  <!-- Laptop / Tablet base behind the scene -->
  <rect x="140" y="110" width="70" height="45" rx="4" fill="#475569" />
  <rect x="145" y="115" width="60" height="32" rx="2" fill="#0f172a" />
  <!-- Chart lines on screen (Upward trend) -->
  <polyline points="150,140 160,135 175,138 190,124 200,120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Laptop hinge & base -->
  <path d="M 130 155 L 220 155 L 215 158 L 135 158 Z" fill="#64748b" />

  <!-- MAIN SUBJECT: Salary Packet (Red Envelope / Bonus Pay) & Coins representing '工资' -->
  <!-- Falling/Floating Gold Coins (Income/Increase) -->
  <!-- Coin 1 (Top Left) -->
  <g transform="translate(60, 60) rotate(-15)">
    <ellipse cx="0" cy="0" rx="10" ry="6" fill="url(#coin-edge)" />
    <ellipse cx="0" cy="-2" rx="9" ry="5" fill="url(#coin-face)" />
    <ellipse cx="0" cy="-2" rx="4" ry="2" fill="#d97706" opacity="0.3" />
  </g>

  <!-- Coin 2 (Top Right) -->
  <g transform="translate(170, 75) rotate(20)">
    <ellipse cx="0" cy="0" rx="12" ry="7" fill="url(#coin-edge)" />
    <ellipse cx="0" cy="-2" rx="11" ry="6" fill="url(#coin-face)" />
    <circle cx="0" cy="-2" r="2" fill="#d97706" opacity="0.4" />
  </g>

  <!-- Coin 3 (Mid Right) -->
  <g transform="translate(195, 120) rotate(5)">
    <circle cx="0" cy="0" r="9" fill="url(#coin-edge)" />
    <circle cx="0" cy="0" r="7" fill="url(#coin-face)" />
    <rect x="-1" y="-4" width="2" height="8" fill="#d97706" opacity="0.4" />
    <rect x="-4" y="-1" width="8" height="2" fill="#d97706" opacity="0.4" />
  </g>

  <!-- Main Red Envelope (工资袋 - Salary Pouch) -->
  <!-- Envelope Back -->
  <path d="M 80 95 L 160 95 L 160 165 L 80 165 Z" fill="url(#env-back)" rx="6" />

  <!-- protruding money/cash bundle inside -->
  <path d="M 90 85 L 150 85 L 150 100 L 90 100 Z" fill="#10b981" />
  <rect x="110" y="90" width="20" height="5" rx="2" fill="#065f46" opacity="0.6" />
  <circle cx="120" cy="92.5" r="2" fill="#34d399" />

  <!-- Envelope Body (Front Pocket) -->
  <path d="M 80 110 L 160 110 L 160 165 L 80 165 Z" fill="url(#env-front)" />

  <!-- Envelope Flap (Open/Upward style) -->
  <path d="M 80 110 L 120 135 L 160 110 L 120 85 Z" fill="url(#env-flap)" />

  <!-- Decorative Gold Seal/Badge on Envelope -->
  <circle cx="120" cy="138" r="12" fill="url(#coin-face)" />
  <circle cx="120" cy="138" r="9" fill="url(#coin-edge)" />
  <circle cx="120" cy="138" r="6" fill="url(#coin-face)" />

  <!-- Stack of coins spilling out in front -->
  <!-- Bottom Coin Stack Base -->
  <ellipse cx="95" cy="160" rx="14" ry="8" fill="url(#coin-edge)" />
  <ellipse cx="95" cy="157" rx="14" ry="8" fill="url(#coin-face)" />

  <!-- Middle Coin Stack -->
  <ellipse cx="108" cy="154" rx="13" ry="7" fill="url(#coin-edge)" />
  <ellipse cx="108" cy="151" rx="13" ry="7" fill="url(#coin-face)" />

  <!-- Top Coin -->
  <g transform="translate(108, 145) rotate(-10)">
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="url(#coin-edge)" />
    <ellipse cx="0" cy="-2" rx="11" ry="5" fill="url(#coin-face)" />
  </g>

  <!-- Sparkles / Success indicators -->
  <g fill="#fbbf24">
    <!-- Sparkle 1 -->
    <path d="M 50 100 Q 50 105 45 105 Q 50 105 50 110 Q 50 105 55 105 Q 50 105 50 100 Z" />
    <!-- Sparkle 2 -->
    <path d="M 185 50 Q 185 56 179 56 Q 185 56 185 62 Q 185 56 191 56 Q 185 56 185 50 Z" />
    <!-- Sparkle 3 -->
    <path d="M 130 55 Q 130 59 126 59 Q 130 59 130 63 Q 130 59 134 59 Q 130 59 130 55 Z" />
  </g>

  <!-- Upward Trend Arrow (Graphic element floating near envelope) -->
  <path d="M 165 95 L 180 80 L 180 90 M 180 80 L 170 80" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

</svg>