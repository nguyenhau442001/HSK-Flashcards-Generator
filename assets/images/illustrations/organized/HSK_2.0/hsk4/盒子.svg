<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="box-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="box-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="box-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="magic-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Ambient Elements (Room atmosphere) -->
  <circle cx="120" cy="120" r="90" fill="#38bdf8" opacity="0.03" />
  <circle cx="190" cy="50" r="30" fill="#fbbf24" opacity="0.05" />
  <circle cx="50" cy="180" r="40" fill="#ec4899" opacity="0.04" />

  <!-- Wooden Table Surface / Environment -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.9" />
  <path d="M 0 166 L 240 166 L 240 170 L 0 170 Z" fill="#334155" />

  <!-- Shadow under the box -->
  <ellipse cx="120" cy="178" rx="55" ry="14" fill="#020617" opacity="0.7" filter="url(#drop-shadow)" />

  <!-- Magic Sparkles/Glow emerging from the box -->
  <g filter="url(#magic-glow)">
    <path d="M 120 120 L 126 80 L 132 120 L 172 126 L 132 132 L 126 172 L 120 132 L 80 126 Z" fill="#fde047" opacity="0.25" transform="scale(0.8) translate(30, 20)" />
    <path d="M 120 120 L 124 95 L 128 120 L 153 124 L 128 128 L 124 153 L 120 128 L 95 124 Z" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Floating Magic Particles -->
  <circle cx="85" cy="110" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="155" cy="100" r="4" fill="#fbbf24" opacity="0.9" />
  <circle cx="100" cy="85" r="2" fill="#ec4899" opacity="0.8" />
  <circle cx="140" cy="80" r="3.5" fill="#34d399" opacity="0.9" />
  <path d="M 75 130 L 78 133 L 75 136 L 72 133 Z" fill="#fbbf24" />
  <path d="M 165 125 L 168 128 L 165 131 L 162 128 Z" fill="#38bdf8" />

  <!-- MAIN OBJECT: CÁI HỘP (The Box / Gift Box) -->
  <g transform="translate(0, 15)">
    <!-- Box Back / Interior (Darker shade when open) -->
    <path d="M 70 95 L 120 75 L 170 95 L 170 100 L 120 120 L 70 100 Z" fill="#92400e" />

    <!-- Open Lid (Angled backwards) -->
    <g filter="url(#drop-shadow)">
      <!-- Lid Top Face -->
      <path d="M 120 40 L 185 65 L 120 85 L 55 65 Z" fill="#f59e0b" />
      <!-- Lid Front Face (Thin rim) -->
      <path d="M 55 65 L 120 85 L 120 90 L 55 70 Z" fill="#d97706" />
      <path d="M 120 85 L 185 65 L 185 70 L 120 90 Z" fill="#b45309" />
      <!-- Ribbon on Open Lid -->
      <path d="M 116 43 L 124 43 L 124 82 L 116 80 Z" fill="url(#ribbon-grad)" />
    </g>

    <!-- Box Main Body (Isometric/3D Cuboid) -->
    <g filter="url(#drop-shadow)">
      <!-- Left Side Panel -->
      <path d="M 70 100 L 120 120 L 120 165 L 70 145 Z" fill="url(#box-side)" />
      <!-- Right Side Panel -->
      <path d="M 120 120 L 170 100 L 170 145 L 120 165 Z" fill="#b45309" />
      
      <!-- Front-Left Ribbon vertical -->
      <path d="M 92 109 L 98 111 L 98 154 L 92 152 Z" fill="url(#ribbon-grad)" opacity="0.9" />
      <!-- Front-Right Ribbon vertical -->
      <path d="M 142 131 L 148 129 L 148 152 L 142 154 Z" fill="url(#ribbon-grad)" opacity="0.9" />
    </g>

    <!-- Glowing Interior (Surprise Gift Inside) -->
    <ellipse cx="120" cy="110" rx="35" ry="12" fill="url(#glow-grad)" />
    
    <!-- Emerging Star / Toy / Treasure inside -->
    <g transform="translate(120, 100)">
      <path d="M 0 -15 L 4 -4 L 15 -2 L 7 5 L 9 15 L 0 9 L -9 15 L -7 5 L -15 -2 L -4 -4 Z" fill="#fde047" filter="url(#drop-shadow)" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>

    <!-- Ribbon Bow (Attached to the open lid or floating dynamically) -->
    <g transform="translate(120, 62)">
      <!-- Left Loop -->
      <path d="M 0 0 C -15 -15 -25 -5 -15 8 C -8 15 -2 5 0 0 Z" fill="url(#ribbon-grad)" />
      <path d="M 0 0 C -12 -12 -20 -4 -12 6 C -6 11 -2 4 0 0 Z" fill="#fb7185" opacity="0.4" />
      <!-- Right Loop -->
      <path d="M 0 0 C 15 -15 25 -5 15 8 C 8 15 2 5 0 0 Z" fill="url(#ribbon-grad)" />
      <!-- Center Knot -->
      <ellipse cx="0" cy="1" rx="4" ry="5" fill="#9f1239" />
      <ellipse cx="0" cy="0" rx="2" ry="3" fill="#f43f5e" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements / Extra Context Props -->
  <!-- Confetti pieces -->
  <rect x="45" y="140" width="6" height="4" rx="1" fill="#38bdf8" transform="rotate(25 48 142)" />
  <rect x="185" y="130" width="5" height="7" rx="1" fill="#ec4899" transform="rotate(-15 187 133)" />
  <circle cx="65" cy="155" r="2.5" fill="#34d399" />
  <circle cx="175" cy="150" r="2" fill="#fbbf24" />
  
  <!-- Tiny decorative star on the table -->
  <path d="M 55 185 L 57 190 L 62 192 L 57 194 L 55 199 L 53 194 L 48 192 L 53 190 Z" fill="#38bdf8" opacity="0.6" />
  <path d="M 190 175 L 191.5 178 L 194.5 179.5 L 191.5 181 L 190 184 L 188.5 181 L 185.5 179.5 L 188.5 178 Z" fill="#fbbf24" opacity="0.7" />

  <!-- Subtle lighting rim on the top canvas edge -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" />
</svg>