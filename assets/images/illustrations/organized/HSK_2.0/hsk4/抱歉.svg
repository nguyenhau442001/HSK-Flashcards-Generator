<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- ENVIRONMENT & PROPS (Background & Foreground) -->
  <!-- Back Wall Details / Architecture -->
  <rect x="0" y="0" width="240" height="180" fill="none"/>
  <!-- Window frame showing a rainy/evening cozy aesthetic outside -->
  <path d="M165 40 L210 40 L210 120 L165 120 Z" fill="#0b1329" stroke="#334155" stroke-width="2"/>
  <line x1="187" y1="40" x2="187" y2="120" stroke="#334155" stroke-width="1.5"/>
  <line x1="165" y1="80" x2="210" y2="80" stroke="#334155" stroke-width="1.5"/>
  <!-- Cozy warm light glow from window -->
  <path d="M167 42 L208 42 L208 118 L167 118 Z" fill="#fbbf24" opacity="0.04"/>
  <!-- Raindrops outside window -->
  <line x1="173" y1="50" x2="171" y2="58" stroke="#64748b" stroke-width="1" opacity="0.4"/>
  <line x1="195" y1="65" x2="193" y2="73" stroke="#64748b" stroke-width="1" opacity="0.4"/>
  <line x1="180" y1="90" x2="178" y2="98" stroke="#64748b" stroke-width="1" opacity="0.4"/>

  <!-- Wall Shelf with Objects -->
  <path d="M25 75 L95 75" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <!-- Books on shelf -->
  <rect x="35" y="55" width="8" height="20" rx="1" fill="#ec4899"/>
  <rect x="44" y="52" width="10" height="23" rx="1" fill="#38bdf8"/>
  <rect x="55" y="58" width="7" height="17" rx="1" fill="#f59e0b"/>
  <!-- Small potted plant on shelf -->
  <path d="M75 75 L73 65 L83 65 L81 75 Z" fill="#cbd5e1"/>
  <path d="M78 65 C78 58 73 55 70 52 C75 57 77 60 78 65 Z" fill="url(#leafGrad)"/>
  <path d="M78 65 C80 57 85 54 88 51 C84 57 81 60 78 65 Z" fill="url(#leafGrad)"/>

  <!-- Floor Plane -->
  <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="175" x2="240" y2="175" stroke="#334155" stroke-width="2"/>

  <!-- Foreground / Midground Props -->
  <!-- Plant Pot in Corner -->
  <ellipse cx="210" cy="175" rx="14" ry="4" fill="#0f172a"/>
  <path d="M198 145 L222 145 L226 173 L194 173 Z" fill="#64748b"/>
  <!-- Large Monstera Leaves -->
  <path d="M210 145 C205 125 185 115 170 110 C185 125 195 135 210 145 Z" fill="url(#leafGrad)"/>
  <path d="M215 145 C225 125 240 115 250 110 C235 125 225 135 215 145 Z" fill="#059669"/>
  <path d="M210 148 C210 120 215 100 210 85 C205 105 205 125 210 148 Z" fill="url(#leafGrad)"/>

  <!-- Small Coffee Table / Stool -->
  <ellipse cx="65" cy="180" rx="25" ry="8" fill="#334155"/>
  <path d="M45 180 L40 210 L52 210 L55 180 Z" fill="#1e293b"/>
  <path d="M85 180 L90 210 L78 210 L75 180 Z" fill="#1e293b"/>
  <!-- Broken ceramic mug on the floor with spilled coffee (adds narrative context to "bàoqiàn") -->
  <ellipse cx="90" cy="182" rx="12" ry="4" fill="#78350f" opacity="0.8"/>
  <path d="M82 180 C85 178 95 182 98 185 C92 186 84 183 82 180 Z" fill="#b45309"/>
  <!-- Broken mug shards -->
  <path d="M102 178 L107 182 L101 183 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
  <path d="M75 185 L72 189 L78 188 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
  <!-- Mug handle/body piece -->
  <path d="M100 172 C105 172 108 176 106 180 C104 176 102 175 100 172 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>

  <!-- MAIN CHARACTER: Apologizing Character (Bàoqiàn) -->
  <g transform="translate(0, 5)">
    <!-- Shadow beneath character -->
    <ellipse cx="125" cy="174" rx="28" ry="7" fill="#020617" opacity="0.6"/>

    <!-- Left Leg (Straight-ish, slightly angled) -->
    <path d="M115 135 L110 172 L122 173 L126 138 Z" fill="#334155"/>
    <!-- Right Leg (Slightly bent, nervous posture) -->
    <path d="M130 135 L135 172 L145 171 L138 138 Z" fill="#334155"/>
    <!-- Shoes -->
    <path d="M104 171 L123 172 L124 177 L106 177 Z" fill="#0f172a" rx="2"/>
    <path d="M132 170 L148 171 L150 176 L134 176 Z" fill="#0f172a" rx="2"/>

    <!-- Torso (Deep bow / leaning forward posture for apology) -->
    <g transform="translate(120, 110) rotate(35) translate(-120, -110)">
      <!-- Body/Sweater (Warm Amber/Orange tone) -->
      <path d="M105 105 C105 90 120 85 135 90 C145 93 148 115 145 135 L108 135 Z" fill="#f59e0b"/>
      <!-- Collar -->
      <path d="M118 90 C122 93 128 93 132 90 C130 92 120 92 118 90 Z" fill="#fbbf24"/>
    </g>

    <!-- Head (Tilted down in embarrassment/apology, bowing deeply) -->
    <g transform="translate(142, 88) rotate(25)">
      <!-- Neck -->
      <path d="M-4 12 L4 12 L3 22 L-3 22 Z" fill="#fbcfe8"/>
      <!-- Hair (Stylized modern neat dark hair) -->
      <path d="M-14 2 C-14 -12 2 -16 12 -10 C18 -6 20 2 18 10 C14 6 12 14 6 12 C-2 10 -12 12 -14 2 Z" fill="#1e293b"/>
      <!-- Face Base -->
      <circle cx="2" cy="5" r="11" fill="#fde68a"/>
      <!-- Rosy Cheeks (Embarrassed/Flustered look) -->
      <circle cx="-3" cy="8" r="3.5" fill="#f43f5e" opacity="0.5"/>
      <circle cx="8" cy="8" r="3.5" fill="#f43f5e" opacity="0.5"/>
      <!-- Eyes: Squinted/Teary-eyed in deep regret ("> <" style or curved happy-sad lines) -->
      <path d="M-5 4 L-1 6 M-1 4 L-5 6" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M5 4 L9 6 M9 4 L5 6" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Sweat Drop (Classic anime/cartoon sign of nervousness/apology) -->
      <path d="M15 -2 C15 -2 19 4 19 7 C19 9.5 17 11 15 11 C13 11 11 9.5 11 7 C11 4 15 -2 15 -2 Z" fill="#38bdf8" filter="url(#glow)"/>
      <!-- Mouth: Nervous/Upside-down U or wince -->
      <path d="M1 11 C3 11 4 13 2 13 C0 13 1 11 1 11 Z" fill="#9f1239"/>
    </g>

    <!-- Arms & Hands (Classic Apology Gesture: Scratching back of head, bowing, or hands clasped/rubbing together) -->
    <!-- Let's do the classic "rubbing hands together nervously in front" or "one hand scratching head, body bowing" -->
    <g>
      <!-- Arm 1 (Raised to back of head, embarrassed) -->
      <path d="M128 98 C135 85 145 80 155 85 C160 88 158 95 152 93" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="156" cy="88" r="4" fill="#fde68a"/> <!-- Hand -->

      <!-- Arm 2 (Pressed forward / gesturing regret) -->
      <path d="M125 105 C145 110 155 120 162 125" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
      <circle cx="164" cy="126" r="4.5" fill="#fde68a"/> <!-- Hand open in plea -->
    </g>
  </g>

  <!-- SECOND CHARACTER (Optional context: The person being apologized to, standing graciously / forgiving) -->
  <g transform="translate(25, 0)">
    <!-- Shadow -->
    <ellipse cx="45" cy="174" rx="18" ry="5" fill="#020617" opacity="0.5"/>

    <!-- Legs -->
    <path d="M40 140 L38 172 L45 172 L47 140 Z" fill="#1e293b"/>
    <path d="M50 140 L52 172 L58 172 L55 140 Z" fill="#1e293b"/>
    <!-- Shoes -->
    <path d="M35 171 L47 172 L47 176 L36 176 Z" fill="#0f172a"/>
    <path d="M51 171 L61 172 L61 176 L52 176 Z" fill="#0f172a"/>

    <!-- Torso (Teal/Cyan modern hoodie or jacket, standing upright, understanding posture) -->
    <path d="M35 110 C35 100 45 95 55 95 C65 95 75 100 75 110 L70 142 L40 142 Z" fill="#0ea5e9"/>

    <!-- Head -->
    <!-- Hair -->
    <path d="M38 90 C36 78 50 74 60 78 C68 81 72 90 70 96 C64 92 60 98 52 96 C44 94 40 92 38 90 Z" fill="#334155"/>
    <!-- Face -->
    <circle cx="52" cy="91" r="10" fill="#fde68a"/>
    <!-- Gentle / Forgiving Expression (Eyes closed peacefully or smiling) -->
    <path d="M48 90 C49 92 51 92 52 90" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M54 90 C55 92 57 92 58 90" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Gentle Smile -->
    <path d="M51 95 C53 96 55 96 57 95" stroke="#9f1239" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Arms: Crossed or welcomingly placed, reassuring -->
    <path d="M40 115 C45 125 55 125 68 115" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
    <!-- Reassuring Hand gesture -->
    <circle cx="68" cy="115" r="3.5" fill="#fde68a"/>
  </g>

  <!-- Atmospheric Lighting / Accent Effects -->
  <!-- Warm glow highlights on top of scene -->
  <path d="M0 0 L240 0 L240 15 L0 60 Z" fill="#38bdf8" opacity="0.03"/>
</svg>