<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Podium Gradients -->
    <linearGradient id="podiumGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="podiumSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="podiumBronze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- UI/Glow Soft Light -->
    <radialGradient id="glowSpot" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#glowSpot)"/>

  <!-- Atmospheric Background Elements (Stadium Lights & Confetti) -->
  <!-- Stadium Lights -->
  <circle cx="60" cy="40" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="80" cy="30" r="1" fill="#fef08a" opacity="0.6"/>
  <circle cx="180" cy="35" r="1.5" fill="#fef08a" opacity="0.7"/>
  <path d="M40 70 L200 70" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Confetti in the background (Victory for others, defeat context) -->
  <rect x="35" y="80" width="4" height="8" rx="1" fill="#38bdf8" transform="rotate(15 35 80)" opacity="0.7"/>
  <circle cx="55" cy="65" r="2" fill="#fbbf24" opacity="0.8"/>
  <rect x="195" y="90" width="5" height="4" rx="1" fill="#ec4899" transform="rotate(-25 195 90)" opacity="0.7"/>
  <circle cx="175" cy="75" r="2.5" fill="#34d399" opacity="0.7"/>

  <!-- STADIUM PODIUM STRUCTURE -->
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="205" rx="85" ry="10" fill="#090d16" opacity="0.6"/>

  <!-- 2nd Place Podium (Left) -->
  <path d="M 60 145 L 95 135 L 95 195 L 60 200 Z" fill="#475569" opacity="0.7"/>
  <path d="M 25 155 L 60 145 L 60 200 L 25 205 Z" fill="#64748b"/>
  <text x="42" y="182" fill="#cbd5e1" font-family="sans-serif" font-weight="bold" font-size="16">2</text>

  <!-- 1st Place Podium (Center, taller, slightly faded/distant feeling) -->
  <path d="M 125 125 L 155 115 L 155 195 L 125 195 Z" fill="#b45309" opacity="0.6"/>
  <path d="M 95 135 L 125 125 L 125 195 L 95 195 Z" fill="url(#podiumGold)"/>
  <text x="107" y="168" fill="#fffbeb" font-family="sans-serif" font-weight="bold" font-size="20">1</text>

  <!-- 3rd Place Podium (Right - The Main Subject's Spot, Defeated) -->
  <path d="M 180 160 L 210 150 L 210 190 L 180 195 Z" fill="#7c2d12" opacity="0.7"/>
  <path d="M 150 170 L 180 160 L 180 195 L 150 200 Z" fill="url(#podiumBronze)"/>
  <text x="162" y="189" fill="#ffedd5" font-family="sans-serif" font-weight="bold" font-size="14">3</text>

  <!-- MAIN CHARACTER: DEFEATED ATHLETE/GAMER (Sagging posture, drooping shoulders, sad expression) -->
  <!-- Shadow under character -->
  <ellipse cx="165" cy="201" rx="18" ry="4" fill="#020617" opacity="0.5"/>

  <!-- Character Legs -->
  <rect x="156" y="185" width="6" height="18" rx="3" fill="#334155"/>
  <rect x="168" y="185" width="6" height="18" rx="3" fill="#334155"/>
  <!-- Shoes -->
  <ellipse cx="158" cy="202" rx="5" ry="2.5" fill="#0f172a"/>
  <ellipse cx="172" cy="202" rx="5" ry="2.5" fill="#0f172a"/>

  <!-- Torso & Hoodie (Slumped forward) -->
  <path d="M 152 148 C 150 142, 178 142, 176 148 L 181 180 C 181 185, 150 185, 149 180 Z" fill="#3b82f6"/>
  <!-- Hoodie Pocket/Details -->
  <path d="M 157 170 L 173 170 L 170 179 L 160 179 Z" fill="#2563eb" opacity="0.6"/>

  <!-- Arms (Slumped down, hands hanging loosely) -->
  <path d="M 152 150 C 146 155, 144 165, 148 175" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Hands -->
  <circle cx="149" cy="177" r="3.5" fill="#fcd34d"/>

  <path d="M 176 150 C 182 155, 184 165, 180 175" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Hands -->
  <circle cx="179" cy="177" r="3.5" fill="#fcd34d"/>

  <!-- Neck -->
  <rect x="162" y="138" width="6" height="8" fill="#fcd34d"/>

  <!-- Head (Slumped downwards/looking down dejectedly) -->
  <circle cx="165" cy="130" r="13" fill="#fcd34d"/>

  <!-- Hair (Messy, cute cartoon style) -->
  <path d="M 152 126 C 152 118, 178 118, 178 126 C 180 124, 180 120, 174 117 C 168 113, 158 113, 153 118 C 150 120, 150 124, 152 126 Z" fill="#1e293b"/>

  <!-- Sad Face Details -->
  <!-- Closed/Sad Eyebrows (Slanted down inwards) -->
  <path d="M 157 127 L 163 129" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 173 127 L 167 129" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Closed Upset Eyes (> < or curved downward lines) -->
  <path d="M 158 131 Q 161 133 164 131" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 166 131 Q 169 133 172 131" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Sad Frown Mouth -->
  <path d="M 162 138 Q 165 135 168 138" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Blush / Tear drop -->
  <circle cx="156" cy="135" r="2" fill="#f87171" opacity="0.6"/>
  <circle cx="174" cy="135" r="2" fill="#f87171" opacity="0.6"/>
  <!-- Tiny Sweat Drop (Classic anime trope for defeat/embarrassment) -->
  <path d="M 173 121 C 173 121, 176 124, 176 126 C 176 127.5, 174.5 129, 173 129 C 171.5 129, 170 127.5, 170 126 C 170 124, 173 121, 173 121 Z" fill="#38bdf8" opacity="0.9"/>

  <!-- PROPS: Defeat context (Bronze Medal around neck instead of Gold, drooping head down) -->
  <path d="M 158 139 C 158 139, 165 145, 165 155" stroke="#f97316" stroke-width="2.5" fill="none"/>
  <path d="M 172 139 C 172 139, 165 145, 165 155" stroke="#f97316" stroke-width="2.5" fill="none"/>
  <circle cx="165" cy="157" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="163" y="160" fill="#78350f" font-family="sans-serif" font-weight="bold" font-size="7">3</text>

  <!-- FOREGROUND / INTERACTION PROPS: Broken/Dropped Game Controller or Trophy -->
  <!-- Dropped Controller on floor near podium -->
  <g transform="translate(115, 195) rotate(-15)">
    <!-- Controller Body -->
    <rect x="0" y="0" width="22" height="12" rx="6" fill="#475569"/>
    <!-- Grips -->
    <path d="M 4 8 C 2 8, 1 12, 3 14 C 4 15, 6 14, 6 12 Z" fill="#334155"/>
    <path d="M 18 8 C 20 8, 21 12, 19 14 C 18 15, 16 14, 16 12 Z" fill="#334155"/>
    <!-- Buttons -->
    <circle cx="15" cy="5" r="1.2" fill="#ef4444"/>
    <circle cx="17.5" cy="7" r="1.2" fill="#3b82f6"/>
    <!-- D-Pad -->
    <rect x="5" y="4" width="4" height="1.5" rx="0.5" fill="#1e293b"/>
    <rect x="6.25" y="2.75" width="1.5" height="4" rx="0.5" fill="#1e293b"/>
  </g>

  <!-- Disappointed/Defeated atmosphere lines near character -->
  <path d="M 138 130 Q 134 135 138 140" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 134 135 Q 130 140 134 145" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Sparkle of 1st place winner in background (out of reach) -->
  <path d="M 115 105 L 117 110 L 122 112 L 117 114 L 115 119 L 113 114 L 108 112 L 113 110 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M 45 115 L 46 118 L 49 119 L 46 120 L 45 123 L 44 120 L 41 119 L 44 118 Z" fill="#94a3b8" opacity="0.5"/>

</svg>