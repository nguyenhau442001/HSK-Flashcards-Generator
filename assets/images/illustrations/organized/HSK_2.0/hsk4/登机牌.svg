<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ticket Main Gradient (Crisp Clean White/Blue Tint) -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Ticket Stub Gradient (Sky Blue Accent) -->
    <linearGradient id="stubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Drop Shadow for Ticket Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Airport Atmosphere / Lights -->
  <circle cx="190" cy="50" r="40" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="60" cy="180" r="50" fill="#f59e0b" opacity="0.06" filter="url(#glow)" />

  <!-- Counter / Surface Plane -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#090d16" />
  <path d="M 0 187 L 240 187 L 240 190 L 0 190 Z" fill="#38bdf8" opacity="0.3" />

  <!-- Passport Underneath (Context Prop) -->
  <g transform="translate(35, 85) rotate(-12)">
    <rect width="110" height="145" rx="8" fill="#1e3a8a" filter="url(#dropShadow)" />
    <!-- Passport Gold Crest Outline -->
    <rect x="12" y="12" width="86" height="121" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" />
    <circle cx="55" cy="55" r="18" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.8" />
    <circle cx="55" cy="55" r="12" fill="#f59e0b" opacity="0.3" />
    <!-- Passport lines -->
    <rect x="30" y="90" width="50" height="4" rx="2" fill="#f59e0b" opacity="0.6" />
    <rect x="40" y="100" width="30" height="3" rx="1.5" fill="#f59e0b" opacity="0.5" />
  </g>

  <!-- MAIN SUBJECT: Boarding Pass (登机牌) -->
  <g transform="translate(80, 50) rotate(8)" filter="url(#dropShadow)">
    
    <!-- Main Ticket Body -->
    <path d="M 0 12 
             C 0 5, 5 0, 12 0 
             L 105 0 
             C 105 10, 115 10, 115 0 
             L 138 0 
             C 145 0, 150 5, 150 12 
             L 150 108 
             C 150 115, 145 120, 138 120 
             L 115 120 
             C 115 110, 105 110, 105 120 
             L 12 120 
             C 5 120, 0 115, 0 108 
             Z" 
          fill="url(#ticketGrad)" />

    <!-- Perforation Divider Line -->
    <line x1="105" y1="10" x2="105" y2="110" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Left Section: Flight Details -->
    <!-- Airline Header -->
    <rect x="16" y="16" width="24" height="16" rx="4" fill="url(#stubGrad)" />
    <circle cx="28" cy="24" r="4" fill="#ffffff" />
    <rect x="48" y="18" width="40" height="6" rx="3" fill="#64748b" />
    <rect x="48" y="27" width="24" height="4" rx="2" fill="#94a3b8" />

    <!-- Route / City Codes -->
    <text x="20" y="62" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#0f172a">NYC</text>
    <!-- Airplane Icon Midpoint -->
    <g transform="translate(52, 45) rotate(45) scale(0.6)">
      <path d="M10 0 L15 15 L10 13 L5 15 Z" fill="#38bdf8" />
    </g>
    <text x="70" y="62" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#0f172a">TYO</text>

    <!-- Info Grid Labels & Placeholders -->
    <g transform="translate(16, 75)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="20" height="4" rx="2" fill="#94a3b8" />
      <rect x="0" y="7" width="32" height="6" rx="3" fill="#0f172a" />

      <rect x="45" y="0" width="20" height="4" rx="2" fill="#94a3b8" />
      <rect x="45" y="7" width="24" height="6" rx="3" fill="#0f172a" />
    </g>

    <g transform="translate(16, 96)">
      <!-- Row 2 -->
      <rect x="0" y="0" width="20" height="4" rx="2" fill="#94a3b8" />
      <rect x="0" y="7" width="28" height="6" rx="3" fill="#f59e0b" />

      <rect x="45" y="0" width="20" height="4" rx="2" fill="#94a3b8" />
      <rect x="45" y="7" width="20" height="6" rx="3" fill="#0f172a" />
    </g>

    <!-- Right Stub Section (The detachable part) -->
    <g transform="translate(115, 0)">
      <!-- Stub Header -->
      <rect x="10" y="16" width="15" height="15" rx="3" fill="url(#stubGrad)" />
      
      <!-- Mini QR Code Graphic -->
      <rect x="10" y="42" width="25" height="25" rx="3" fill="#0f172a" />
      <rect x="13" y="45" width="8" height="8" rx="1" fill="#ffffff" />
      <rect x="24" y="45" width="8" height="8" rx="1" fill="#ffffff" />
      <rect x="13" y="56" width="8" height="8" rx="1" fill="#ffffff" />
      <circle cx="28" cy="60" r="3" fill="#38bdf8" />

      <!-- Stub Seat info -->
      <rect x="10" y="80" width="16" height="4" rx="2" fill="#94a3b8" />
      <rect x="10" y="87" width="20" height="8" rx="3" fill="#ec4899" />
    </g>

  </g>

  <!-- Foreground Travel Prop: Luggage Tag with strap -->
  <g transform="translate(25, 30) rotate(-20)">
    <!-- Strap -->
    <path d="M 30 0 L 35 40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Tag Body -->
    <rect x="15" y="40" width="40" height="65" rx="8" fill="#ec4899" filter="url(#dropShadow)" />
    <circle cx="35" cy="52" r="4" fill="#ffffff" />
    <!-- Tag Details -->
    <rect x="23" y="68" width="24" height="4" rx="2" fill="#ffffff" opacity="0.8" />
    <rect x="23" y="78" width="16" height="4" rx="2" fill="#ffffff" opacity="0.6" />
    <!-- Barcode accent -->
    <rect x="23" y="90" width="24" height="8" rx="2" fill="#1e293b" opacity="0.4" />
  </g>

  <!-- Sparkles / Action Highlights -->
  <g transform="translate(195, 35)">
    <path d="M 0 10 Q 0 0 10 0 Q 0 0 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(30, 160) scale(0.6)">
    <path d="M 0 10 Q 0 0 10 0 Q 0 0 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Z" fill="#38bdf8" />
  </g>
</svg>