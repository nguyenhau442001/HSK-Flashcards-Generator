<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Backlight for Target Match -->
    <radialGradient id="matchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Puzzle & Clipboard Gradients -->
    <linearGradient id="clipboardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="puzzleFit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="puzzleSlot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background decorative elements (desk items / atmosphere) -->
  <g opacity="0.15">
    <!-- Grid lines representing structure/requirements -->
    <path d="M 30,60 L 210,60 M 30,120 L 210,120 M 30,180 L 210,180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 60,30 L 60,210 M 120,30 L 120,210 M 180,30 L 180,210" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Success Glow Aura behind the matching mechanism -->
  <circle cx="120" cy="125" r="70" fill="url(#matchGlow)" />

  <!-- MAIN SCENE: Clipboard representing criteria/requirements -->
  <g filter="url(#shadow)">
    <!-- Clipboard Base -->
    <rect x="55" y="45" width="130" height="150" rx="12" fill="url(#clipboardGrad)" stroke="#475569" stroke-width="2" />
    
    <!-- Metal Clip -->
    <rect x="95" y="38" width="50" height="16" rx="4" fill="#94a3b8" />
    <rect x="105" y="35" width="30" height="6" rx="2" fill="#cbd5e1" />

    <!-- Paper Sheet -->
    <rect x="67" y="65" width="106" height="118" rx="6" fill="url(#paperGrad)" />

    <!-- Requirement Lines on Paper (representing 'xuqiu' / requirements) -->
    <!-- Line 1 -->
    <rect x="85" y="80" width="50" height="6" rx="3" fill="#cbd5e1" />
    <circle cx="75" cy="83" r="3" fill="#38bdf8" />

    <!-- Line 2 -->
    <rect x="85" y="100" width="65" height="6" rx="3" fill="#cbd5e1" />
    <circle cx="75" cy="103" r="3" fill="#38bdf8" />
  </g>

  <!-- PUZZLE PIECE & SLOT MECHANISM (Visualizing "Fit / Matching") -->
  <!-- The Slot (Target Area on the paper) -->
  <g transform="translate(75, 120)">
    <rect x="0" y="0" width="90" height="45" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <!-- Slot Indentation (where the piece locks in) -->
    <rect x="25" y="5" width="40" height="35" rx="4" fill="url(#puzzleSlot)" />
    <!-- Dashed inner border to show it's a target zone -->
    <rect x="27" y="7" width="36" height="31" rx="3" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  </g>

  <!-- The Matching Puzzle Piece (Floating precisely into place) -->
  <g filter="url(#shadow)" transform="translate(75, 117)">
    <!-- Main Puzzle Piece Body -->
    <path d="M 25,8 
             L 40,8 
             C 40,2 50,2 50,8
             L 65,8
             L 65,38
             L 25,38
             Z" 
          fill="url(#puzzleFit)" 
          stroke="#7dd3fc" 
          stroke-width="1.5" />
    
    <!-- Inner detail on puzzle piece -->
    <circle cx="45" cy="23" r="4" fill="#bae6fd" opacity="0.6" />
  </g>

  <!-- SUCCESS BADGE / CHECKMARK (Indicating successful match / 符合) -->
  <g transform="translate(145, 105)" filter="url(#shadow)">
    <!-- Outer Glow Ring -->
    <circle cx="15" cy="15" r="22" fill="#065f46" opacity="0.4" />
    <circle cx="15" cy="15" r="18" fill="#10b981" />
    <!-- Checkmark Icon -->
    <path d="M 9,15 L 13,19 L 21,10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Secondary decorative floating particles (Success sparks) -->
  <g fill="#fbbf24">
    <circle cx="48" cy="95" r="2.5" opacity="0.8" />
    <circle cx="195" cy="130" r="3" opacity="0.9" />
    <circle cx="175" cy="65" r="2" opacity="0.7" />
    <circle cx="55" cy="165" r="2" opacity="0.5" />
  </g>

  <g fill="#38bdf8">
    <circle cx="130" cy="55" r="2" opacity="0.8" />
    <circle cx="100" cy="185" r="2.5" opacity="0.7" />
  </g>

</svg>