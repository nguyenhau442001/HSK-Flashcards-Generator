<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 (Left) Skin & Outfit -->
    <linearGradient id="char1Shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Right) Skin & Outfit -->
    <linearGradient id="char2Shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Speech / Collaboration Idea Bubble Gradient -->
    <linearGradient id="ideaBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting / Lamp Glow -->
  <circle cx="120" cy="50" r="110" fill="url(#lampGlow)" />

  <!-- Background Environment & Props -->
  <!-- Bookshelf / Architecture Lines -->
  <path d="M 20 85 L 220 85" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <rect x="35" y="55" width="16" height="30" rx="2" fill="#475569" />
  <rect x="53" y="50" width="12" height="35" rx="2" fill="#0ea5e9" />
  <rect x="67" y="60" width="18" height="25" rx="2" fill="#f43f5e" />
  <rect x="185" y="48" width="14" height="37" rx="2" fill="#10b981" />

  <!-- Hanging Pendant Lamp -->
  <path d="M 120 0 L 120 30" stroke="#64748b" stroke-width="2" />
  <path d="M 95 30 L 145 30 L 135 42 L 105 42 Z" fill="#64748b" />
  <ellipse cx="120" cy="42" rx="20" ry="6" fill="#fbbf24" />

  <!-- Table Structure -->
  <!-- Table Legs -->
  <rect x="65" y="160" width="10" height="60" fill="#0f172a" />
  <rect x="165" y="160" width="10" height="60" fill="#0f172a" />
  <!-- Table Top Surface -->
  <path d="M 30 145 L 210 145 L 225 165 L 15 165 Z" fill="url(#tableTop)" filter="url(#softShadow)" />
  <path d="M 30 145 L 210 145 L 215 152 L 25 152 Z" fill="#475569" opacity="0.6"/> <!-- Table bevel -->

  <!-- Central Collaborative Documents & Laptop on Table -->
  <!-- Laptop Base -->
  <polygon points="90,148 150,148 160,154 80,154" fill="#64748b" />
  <!-- Laptop Screen -->
  <polygon points="95,120 145,120 150,148 90,148" fill="#334155" />
  <polygon points="98,123 142,123 146,145 94,145" fill="#0ea5e9" />
  <!-- Graph lines on screen -->
  <polyline points="102,138 112,130 122,134 132,127 138,131" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Papers & Sticky Notes -->
  <g filter="url(#softShadow)">
    <!-- Document 1 -->
    <polygon points="125,138 165,133 172,152 132,157" fill="url(#docGrad)" />
    <line x1="132" y1="143" x2="150" y2="141" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="134" y1="148" x2="158" y2="146" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Document 2 (Overlapping) -->
    <polygon points="70,140 105,135 110,155 75,160" fill="#fef08a" />
    <line x1="78" y1="145" x2="98" y2="143" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="80" y1="150" x2="94" y2="148" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Coffee Mug -->
    <rect x="55" y="132" width="14" height="18" rx="3" fill="#ffffff" />
    <path d="M 69 136 C 74 136 74 144 69 144" fill="none" stroke="#ffffff" stroke-width="2" />
    <!-- Steam -->
    <path d="M 59 125 C 59 122 63 122 63 119" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Character 1 (Left - Active Speaker/Planner) -->
  <g id="character-left">
    <!-- Body / Torso -->
    <path d="M 40 190 C 40 165 60 155 75 155 C 90 155 105 165 105 190 Z" fill="url(#char1Shirt)" />
    <!-- Collar & Details -->
    <path d="M 65 155 L 75 165 L 85 155" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Neck & Head -->
    <rect x="68" y="142" width="14" height="15" fill="#fbcfe8" rx="4" />
    <circle cx="75" cy="122" r="16" fill="#fbcfe8" />
    
    <!-- Hair (Stylish dark crop) -->
    <path d="M 59 120 C 59 110 68 106 77 106 C 87 106 91 112 91 120 C 91 123 90 120 89 116 C 86 109 78 109 73 110 C 65 111 60 115 59 120 Z" fill="#0f172a" />
    
    <!-- Expressive Face (Engaged, gesturing) -->
    <circle cx="81" cy="120" r="1.5" fill="#0f172a" /> <!-- Eye -->
    <path d="M 77 125 Q 81 129 85 125" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" /> <!-- Smile -->
    <circle cx="87" cy="124" r="3" fill="#fda4af" opacity="0.6" /> <!-- Cheek blush -->

    <!-- Gesturing Arm (Pointing/Discussing) -->
    <path d="M 85 160 C 95 160 105 150 112 142" fill="none" stroke="url(#char1Shirt)" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="114" cy="140" r="4" fill="#fbcfe8" />
  </g>

  <!-- Character 2 (Right - Listener/Collaborator nodding) -->
  <g id="character-right">
    <!-- Body / Torso -->
    <path d="M 135 190 C 135 165 150 155 165 155 C 180 155 200 165 200 190 Z" fill="url(#char2Shirt)" />
    <!-- Collar -->
    <path d="M 155 155 L 165 165 L 175 155" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck & Head (Slightly tilted) -->
    <rect x="158" y="142" width="14" height="15" fill="#fde68a" rx="4" />
    <circle cx="165" cy="120" r="16" fill="#fde68a" />

    <!-- Hair (Bun/Updo style) -->
    <path d="M 152 120 C 150 108 160 105 170 105 C 180 105 181 112 181 120 C 181 125 178 123 178 120" fill="#451a03" />
    <circle cx="178" cy="100" r="6" fill="#451a03" /> <!-- Bun -->

    <!-- Expressive Face (Thoughtful / Listening) -->
    <circle cx="159" cy="119" r="1.5" fill="#1e293b" /> <!-- Eye -->
    <path d="M 157 125 Q 161 128 165 125" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" /> <!-- Gentle Smile -->
    <circle cx="153" cy="123" r="3" fill="#f43f5e" opacity="0.4" /> <!-- Cheek blush -->

    <!-- Arm resting / Chin support -->
    <path d="M 175 165 C 175 150 168 140 162 133" fill="none" stroke="url(#char2Shirt)" stroke-width="8" stroke-linecap="round" />
    <circle cx="160" cy="130" r="4" fill="#fde68a" /> <!-- Hand near chin -->
  </g>

  <!-- Interactive Idea / Dialogue Elements (Representing "Bàn bạc" / "Thảo luận") -->
  <!-- Floating Thought Bubble representing shared plan -->
  <g transform="translate(0, -5)" filter="url(#softShadow)">
    <!-- Main Idea Cloud -->
    <path d="M 105 85 
             C 95 85 90 75 98 68 
             C 93 58 105 50 115 55 
             C 125 45 145 50 145 62 
             C 155 65 155 78 145 83 
             Z" fill="url(#ideaBubble)" />
             
    <!-- Small connection bubbles -->
    <circle cx="98" cy="95" r="4" fill="#10b981" />
    <circle cx="91" cy="103" r="2.5" fill="#10b981" />

    <!-- Mini icons inside the bubble representing strategy/discussion (lightbulb & check) -->
    <!-- Lightbulb simplified -->
    <path d="M 116 58 C 112 58 110 61 110 64 C 110 67 113 69 114 71 L 118 71 C 119 69 122 67 122 64 C 122 61 120 58 116 58 Z" fill="#fef08a" />
    <rect x="115" y="72" width="3" height="2" fill="#e2e8f0" />
    
    <!-- Interlocking idea checkmark / gears icon -->
    <circle cx="132" cy="68" r="7" fill="#047857" />
    <polyline points="129,68 131,70 136,65" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Secondary floating accent particle/star for visual polish -->
  <g fill="#38bdf8" opacity="0.8">
    <path d="M 50 70 L 52 75 L 57 77 L 52 79 L 50 84 L 48 79 L 43 77 L 48 75 Z" transform="scale(0.6) translate(30, 20)"/>
  </g>
  <g fill="#fbbf24" opacity="0.9">
    <path d="M 190 90 L 191 93 L 194 94 L 191 95 L 190 98 L 189 95 L 186 94 L 189 93 Z" transform="scale(0.8) translate(65, 10)"/>
  </g>

</svg>