<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Deep Forest Canopy Gradients -->
    <linearGradient id="canopy-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="canopy-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="canopy-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Tree Trunk Gradient -->
    <linearGradient id="trunk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glowing Light Shafts -->
    <linearGradient id="light-shaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glowing Firefly Gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip Path for rounded container -->
    <clipPath id="container-clip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <!-- Container Base -->
  <g clip-path="url(#container-clip)">
    <rect width="240" height="240" fill="url(#bg-grad)"/>

    <!-- Atmospheric Background Glow (Moon/Sunlight filter) -->
    <circle cx="180" cy="50" r="70" fill="#38bdf8" opacity="0.08" filter="blur(20px)"/>
    <circle cx="60" cy="90" r="90" fill="#10b981" opacity="0.1" filter="blur(25px)"/>

    <!-- Light Rays / Shafts -->
    <polygon points="40,0 90,0 160,240 110,240" fill="url(#light-shaft)"/>
    <polygon points="120,0 170,0 220,240 180,240" fill="url(#light-shaft)"/>

    <!-- BACKGROUND LAYER: Far Trees & Fog -->
    <g opacity="0.4">
      <path d="M10 240 L10 120 L25 90 L40 120 L55 85 L70 120 L85 95 L100 130 L115 80 L130 135 L145 100 L160 140 L175 90 L190 130 L205 100 L220 145 L235 110 L240 240 Z" fill="#064e3b"/>
    </g>

    <!-- MID-GROUND LAYER: Dense Pine Forest & Trunks -->
    <g>
      <!-- Deep Trunks -->
      <rect x="35" y="110" width="10" height="130" fill="url(#trunk-grad)"/>
      <rect x="75" y="100" width="12" height="140" fill="url(#trunk-grad)"/>
      <rect x="125" y="90" width="14" height="150" fill="url(#trunk-grad)"/>
      <rect x="175" y="115" width="12" height="125" fill="url(#trunk-grad)"/>
      <rect x="210" y="105" width="10" height="135" fill="url(#trunk-grad)"/>

      <!-- Mid Canopy Layers (Pine/Conifer shapes & Rounded masses) -->
      <!-- Tree 1 (Left) -->
      <path d="M40 60 L10 130 L70 130 Z" fill="url(#canopy-deep)"/>
      <path d="M40 90 L15 160 L65 160 Z" fill="url(#canopy-deep)"/>

      <!-- Tree 2 (Mid-Left) -->
      <path d="M81 40 L45 110 L115 110 Z" fill="url(#canopy-mid)"/>
      <path d="M81 75 L50 140 L112 140 Z" fill="url(#canopy-mid)"/>

      <!-- Tree 3 (Center Focus - Large) -->
      <path d="M132 20 L85 100 L179 100 Z" fill="url(#canopy-deep)"/>
      <path d="M132 65 L75 145 L189 145 Z" fill="url(#canopy-mid)"/>

      <!-- Tree 4 (Right) -->
      <path d="M181 50 L140 120 L222 120 Z" fill="url(#canopy-deep)"/>
      <path d="M181 85 L145 165 L217 165 Z" fill="url(#canopy-mid)"/>
    </g>

    <!-- FOREGROUND LAYER: Detailed Bushes, Giant Ancient Trunks, and Adventurer Elements -->
    <g>
      <!-- Giant Foreground Tree Left -->
      <path d="M-10 240 L-10 140 C10 140 25 150 30 240 Z" fill="url(#trunk-grad)"/>
      <path d="M0 160 Q 20 170 35 155" stroke="#451a03" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-5 190 Q 15 200 25 185" stroke="#451a03" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Giant Foreground Tree Right -->
      <path d="M225 240 C220 160 235 140 250 140 L250 240 Z" fill="url(#trunk-grad)"/>

      <!-- Rich Foreground Bushes & Foliage (Layered with highlights) -->
      <!-- Back Bush Layer -->
      <path d="M15 240 Q 30 180 75 190 Q 110 160 150 190 Q 190 175 225 240 Z" fill="#065f46"/>
      
      <!-- Mid Bush Layer -->
      <path d="M-5 240 C 20 180, 50 195, 85 175 C 125 200, 155 175, 195 210 C 215 225, 230 235, 245 240 Z" fill="url(#canopy-front)"/>

      <!-- Front Mossy Mounds -->
      <path d="M50 240 C 50 215, 95 210, 110 240 Z" fill="#047857"/>
      <path d="M140 240 C 150 210, 200 215, 215 240 Z" fill="#047857"/>
      <path d="M85 240 C 95 220, 135 220, 145 240 Z" fill="#10b981"/>

      <!-- Mushrooms (Detail props for forest floor) -->
      <!-- Mushroom Group 1 -->
      <path d="M72 225 L75 240" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
      <path d="M64 223 C 64 215, 84 215, 84 223 Z" fill="#f43f5e"/>
      <circle cx="71" cy="219" r="1.5" fill="#ffffff"/>
      <circle cx="78" cy="221" r="1" fill="#ffffff"/>

      <path d="M60 232 L61 240" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
      <path d="M54 231 C 54 225, 68 225, 68 231 Z" fill="#fb923c"/>
      <circle cx="61" cy="228" r="1" fill="#ffffff"/>

      <!-- Mushroom Group 2 (Right) -->
      <path d="M185 230 L187 240" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
      <path d="M178 228 C 178 220, 196 220, 196 228 Z" fill="#f43f5e"/>
      <circle cx="184" cy="224" r="1.5" fill="#ffffff"/>
      <circle cx="191" cy="226" r="1" fill="#ffffff"/>
    </g>

    <!-- NARRATIVE ELEMENT: Lost Traveler / Compass & Glowing Magic / Fireflies -->
    <!-- Floating Magical Fireflies / Spores -->
    <g>
      <circle cx="95" cy="130" r="3.5" fill="url(#glow)"/>
      <circle cx="95" cy="130" r="1.5" fill="#fef08a"/>

      <circle cx="145" cy="115" r="5" fill="url(#glow)"/>
      <circle cx="145" cy="115" r="2" fill="#fef08a"/>

      <circle cx="115" cy="160" r="4" fill="url(#glow)"/>
      <circle cx="115" cy="160" r="1.5" fill="#fef08a"/>

      <circle cx="70" cy="165" r="6" fill="url(#glow)"/>
      <circle cx="70" cy="165" r="2.5" fill="#fef08a"/>

      <circle cx="170" cy="150" r="4.5" fill="url(#glow)"/>
      <circle cx="170" cy="150" r="1.8" fill="#fef08a"/>

      <circle cx="130" cy="190" r="3" fill="url(#glow)"/>
      <circle cx="130" cy="190" r="1.2" fill="#fef08a"/>
    </g>

    <!-- Detailed Foreground Prop: A classic brass compass resting on a mossy log (representing 'being lost in the forest') -->
    <g transform="translate(100, 195)">
      <!-- Fallen Log -->
      <ellipse cx="20" cy="25" rx="35" ry="12" fill="#78350f"/>
      <ellipse cx="20" cy="25" rx="32" ry="9" fill="#92400e"/>
      <!-- Log rings / texture -->
      <path d="M 5 25 Q 20 20 35 25" stroke="#78350f" stroke-width="2" fill="none"/>
      <path d="M 12 25 Q 20 22 28 25" stroke="#78350f" stroke-width="1.5" fill="none"/>
      <!-- Moss on log -->
      <path d="M -5 23 C -5 15, 10 15, 15 22 C 10 25, 0 26, -5 23 Z" fill="#10b981"/>

      <!-- Compass Base -->
      <circle cx="20" cy="15" r="14" fill="#334155"/>
      <circle cx="20" cy="15" r="12" fill="#e2e8f0"/>
      <circle cx="20" cy="15" r="10" fill="#f8fafc"/>
      
      <!-- Compass Dial & Needle -->
      <polygon points="20,8 22,15 20,22 18,15" fill="#ef4444"/>
      <polygon points="20,22 22,15 20,8 18,15" fill="#94a3b8"/>
      <circle cx="20" cy="15" r="2" fill="#1e293b"/>
      
      <!-- Compass Glass Glare -->
      <path d="M 12 10 Q 17 6, 24 10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
      
      <!-- Magical Pulse around Compass -->
      <circle cx="20" cy="15" r="15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
    </g>

    <!-- Additional Ambient Lighting / Vignette -->
    <rect width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.5"/>
  </g>
</svg>