<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Detective Desk Gradient -->
    <linearGradient id="desk-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light / Magnifier Beam -->
    <linearGradient id="beam-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glowing accent for the final clue -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements (Detective's Office) -->
  <!-- Bookshelf silhouette in background -->
  <g opacity="0.4">
    <rect x="25" y="40" width="40" height="90" fill="#090d16" rx="2"/>
    <line x1="25" y1="70" x2="65" y2="70" stroke="#1e293b" stroke-width="3"/>
    <line x1="25" y1="100" x2="65" y2="100" stroke="#1e293b" stroke-width="3"/>
    <rect x="175" y="30" width="40" height="100" fill="#090d16" rx="2"/>
    <line x1="175" y1="65" x2="215" y2="65" stroke="#1e293b" stroke-width="3"/>
    <line x1="175" y1="95" x2="215" y2="95" stroke="#1e293b" stroke-width="3"/>
  </g>

  <!-- Wooden/Modern Desk Surface -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#desk-grad)" filter="url(#shadow)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="3"/>

  <!-- Messy Investigation Props on Desk -->
  <!-- Coffee Mug -->
  <g transform="translate(35, 145)">
    <rect x="0" y="0" width="22" height="28" rx="4" fill="#fb923c"/>
    <path d="M22 6 C 28 6, 28 20, 22 20" stroke="#fb923c" stroke-width="3" fill="none"/>
    <path d="M6 5 L 16 5" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M8 -3 Q 11 -8 8 -13" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M14 -2 Q 17 -7 14 -12" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- Messy Case Files / Folders -->
  <g transform="translate(155, 150) rotate(-10)">
    <rect x="0" y="0" width="50" height="35" rx="3" fill="#cbd5e1"/>
    <rect x="5" y="-4" width="20" height="8" rx="2" fill="#94a3b8"/>
    <line x1="10" y1="12" x2="40" y2="12" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="22" x2="30" y2="22" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Red String / Evidence Board Clue Connections on Desk -->
  <path d="M57 155 Q 90 190 130 165 T 180 160" stroke="#ef4444" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="4 2"/>

  <!-- MAIN SUBJECT: The Ultimate Clue / 'Rốt cuộc' (The Final Discovery) -->
  <!-- Cork Board / Map Section in Center -->
  <g transform="translate(75, 75)" filter="url(#shadow)">
    <!-- Photo / Document Base -->
    <rect x="0" y="0" width="90" height="85" rx="4" fill="#f8fafc"/>
    <!-- Pin at top -->
    <circle cx="45" cy="6" r="4" fill="#ef4444"/>
    <circle cx="45" cy="6" r="1.5" fill="#fca5a5"/>

    <!-- Content inside the crucial file -->
    <!-- Footprint / Mystery Icon inside document -->
    <path d="M35 45 C35 38 42 35 45 42 C48 35 55 38 55 45 C55 52 45 62 45 62 C45 62 35 52 35 45 Z" fill="#334155" opacity="0.2"/>
    <circle cx="45" cy="30" r="8" fill="#334155" opacity="0.2"/>

    <!-- Question Marks pattern suggesting "rốt cuộc" (ultimately, what is the core answer?) -->
    <text x="33" y="55" font-family="sans-serif" font-weight="900" font-size="36" fill="#3b82f6" opacity="0.85">?</text>
  </g>

  <!-- Light Beam from Magnifying Glass illuminating the final clue -->
  <polygon points="170,45 125,95 85,90 120,35" fill="url(#beam-grad)" style="mix-blend-mode: screen;" />

  <!-- Glowing Focus Accent behind the core question -->
  <circle cx="120" cy="117" r="25" fill="url(#glow)" />

  <!-- Action-Packed Foreground: Magnifying Glass hovering dynamically over the clue -->
  <g transform="translate(130, 85) rotate(-25)" filter="url(#shadow)">
    <!-- Glass Lens -->
    <circle cx="0" cy="0" r="32" fill="#38bdf8" fill-opacity="0.15" stroke="#0284c7" stroke-width="5"/>
    <circle cx="0" cy="0" r="32" fill="#bae6fd" fill-opacity="0.1"/>
    <!-- Glass reflection arc -->
    <path d="M -22 -12 A 25 25 0 0 1 12 -22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Magnifier Handle -->
    <rect x="-6" y="30" width="12" height="40" rx="6" fill="#1e293b"/>
    <rect x="-3" y="32" width="6" height="36" rx="3" fill="#334155"/>
    <!-- Handle End Cap -->
    <circle cx="0" cy="72" r="5" fill="#0f172a"/>
  </g>

  <!-- Sparkles / Eureka Effect emphasizing the resolution / 'rốt cuộc' realization -->
  <g transform="translate(100, 70)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(145, 125)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(85, 135)">
    <path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" fill="#fbbf24" opacity="0.8"/>
  </g>

</svg>