<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#332233"/>
      <stop offset="60%" stop-color="#191322"/>
      <stop offset="100%" stop-color="#0e0a14"/>
    </radialGradient>
    
    <!-- Medicine Bottle Glass Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Liquid Potion Gradient (Dark Bitter Medicine) -->
    <linearGradient id="liquid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting / Warm Ambient Glow from Desk Lamp -->
  <circle cx="120" cy="180" r="100" fill="#f59e0b" opacity="0.08" filter="blur(20px)"/>
  <circle cx="190" cy="50" r="40" fill="#38bdf8" opacity="0.05" filter="blur(15px)"/>

  <!-- Background Room Elements (Shelf & Props) -->
  <path d="M 30,85 L 120,70 L 210,85" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Small pill bottle on shelf -->
  <rect x="50" y="55" width="16" height="30" rx="3" fill="#cbd5e1"/>
  <rect x="48" y="50" width="20" height="7" rx="2" fill="#ef4444"/>
  <!-- Spoon on shelf -->
  <path d="M 170,75 C 170,70 185,68 190,75 C 193,79 188,83 183,80 Z" fill="#94a3b8"/>
  <rect x="168" y="74" width="4" height="15" rx="1" fill="#94a3b8"/>

  <!-- Wooden Table Surface -->
  <path d="M 0,185 Q 120,170 240,185 L 240,240 L 0,240 Z" fill="#0f172a"/>
  <path d="M 0,185 Q 120,170 240,185" stroke="#334155" stroke-width="3" fill="none"/>

  <!-- MAIN SCENE: Medicine Bottle (Huge & Prominent) -->
  <g filter="url(#shadow)">
    <!-- Bottle Body -->
    <path d="M 90,110 L 90,95 C 90,90 95,85 100,85 L 140,85 C 145,85 150,90 150,95 L 150,110 C 170,120 185,140 185,170 C 185,200 160,215 120,215 C 80,215 55,200 55,170 C 55,140 70,120 90,110 Z" fill="url(#glass-grad)" stroke="#7dd3fc" stroke-width="2"/>
    
    <!-- Bitter Liquid Inside -->
    <path d="M 58,160 C 70,140 90,135 120,135 C 150,135 170,140 182,160 C 185,164 185,200 185,170 C 185,200 160,215 120,215 C 80,215 55,200 55,170 C 55,164 56,161 58,160 Z" fill="url(#liquid-grad)"/>
    
    <!-- Bottle Neck & Cap -->
    <rect x="96" y="65" width="48" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="92" y="55" width="56" height="12" rx="3" fill="#ef4444" filter="url(#shadow)"/>
    
    <!-- Warning/Bitter Medical Label on Bottle -->
    <path d="M 70,145 L 170,145 L 165,190 L 75,190 Z" fill="#f8fafc" opacity="0.9"/>
    <!-- Medical Cross on Label -->
    <rect x="114" y="158" width="12" height="4" fill="#ef4444"/>
    <rect x="118" y="154" width="4" height="12" fill="#ef4444"/>
    <!-- Wiggly hazard lines on label denoting "Extreme Bitterness" -->
    <path d="M 85,175 Q 92,170 100,175 T 115,175 T 130,175 T 145,175 T 160,175" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER: Extreme Bitter Expression (Peeking from behind or reacting in foreground) -->
  <!-- Let's place an expressive head right above/next to the bottle reacting to the taste -->
  <g transform="translate(10, 5)" filter="url(#shadow)">
    <!-- Character Shoulders / Hoodie -->
    <path d="M 60,170 C 60,140 90,135 110,135 C 130,135 160,140 160,170 L 175,195 C 180,205 170,210 160,210 L 60,210 C 50,210 40,205 45,195 Z" fill="#3b82f6"/>
    <!-- Hoodie String -->
    <path d="M 90,150 Q 95,170 93,185" stroke="#e2e8f0" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 130,150 Q 125,170 127,185" stroke="#e2e8f0" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="95" y="115" width="30" height="30" fill="url(#skin-grad)"/>

    <!-- Head / Face (Wrenched in disgust/bitterness) -->
    <path d="M 80,80 C 80,55 95,45 110,45 C 125,45 140,55 140,80 C 140,105 125,125 110,125 C 95,125 80,105 80,80 Z" fill="url(#skin-grad)"/>

    <!-- Hair (Spiky, messy reaction) -->
    <path d="M 78,75 C 75,50 90,35 110,38 C 130,35 145,50 142,75 C 148,65 145,40 125,30 C 105,25 85,35 78,50 Z" fill="#1e293b"/>

    <!-- Dynamic Expression: Eyes tightly squeezed shut in agony/bitterness (> < shape) -->
    <path d="M 90,75 L 100,83 L 90,91" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 130,75 L 120,83 L 130,91" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Angry / Stressed Eyebrows slanting down sharply -->
    <path d="M 85,68 L 105,76" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 135,68 L 115,76" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

    <!-- Sweat Drop (Classic manga/anime style for distress) -->
    <path d="M 142,70 C 148,80 145,90 140,90 C 135,90 132,80 142,70 Z" fill="#38bdf8" opacity="0.8"/>

    <!-- Cheeks flushed red with distress -->
    <ellipse cx="92" cy="95" rx="7" ry="4" fill="#ef4444" opacity="0.6"/>
    <ellipse cx="128" cy="95" rx="7" ry="4" fill="#ef4444" opacity="0.6"/>

    <!-- Mouth: Wincing, teeth gritted, tongue out or lips pulled back in extreme bitter disgust -->
    <path d="M 95,103 Q 110,92 125,103 Q 110,118 95,103 Z" fill="#7f1d1d"/>
    <!-- Gritted teeth -->
    <path d="M 98,103 L 122,103" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Dynamic "Bitter" Impact Effects / Swirls -->
  <path d="M 35,90 Q 25,80 35,70 T 35,50" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 205,100 Q 215,90 205,80 T 205,60" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Little warning/sour stars floating up -->
  <g fill="#fbbf24">
    <path d="M 45,40 L 48,46 L 54,48 L 48,50 L 45,56 L 42,50 L 36,48 L 42,46 Z" transform="scale(0.8) translate(10, 10)"/>
    <path d="M 185,45 L 187,49 L 191,50 L 187,51 L 185,55 L 183,51 L 179,50 L 183,49 Z" transform="scale(1.2) translate(30, -5)"/>
  </g>
</svg>