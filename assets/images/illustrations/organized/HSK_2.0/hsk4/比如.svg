<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="chestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    
    <linearGradient id="chestTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="runningTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Ambient Glows (Contextual Depth) -->
  <circle cx="60" cy="180" r="50" fill="#38bdf8" opacity="0.08" filter="blur(20px)" />
  <circle cx="180" cy="160" r="60" fill="#ec4899" opacity="0.08" filter="blur(20px)" />
  <circle cx="120" cy="70" r="70" fill="#f59e0b" opacity="0.1" filter="blur(20px)" />

  <!-- FLOOR / ENVIRONMENT BASE -->
  <path d="M 120 120 L 230 175 L 120 230 L 10 175 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  
  <!-- Isometric Floor Grid / Surface Details -->
  <!-- Left quadrant: Running track context -->
  <path d="M 65 147 L 120 175 L 115 178 L 60 150 Z" fill="url(#runningTrack)" />
  <path d="M 45 137 L 100 165 L 95 168 L 40 140 Z" fill="url(#runningTrack)" />
  <!-- Running track dashes -->
  <line x1="55" y1="144" x2="58" y2="145" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6" />
  <line x1="75" y1="154" x2="78" y2="155" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6" />

  <!-- Right quadrant: Swimming pool context -->
  <path d="M 125 175 L 180 147 L 185 150 L 130 178 Z" fill="url(#waterGrad)" />
  <path d="M 135 180 L 190 152 L 195 155 L 140 183 Z" fill="url(#waterGrad)" />
  <!-- Water ripples -->
  <path d="M 150 162 Q 155 160 160 163" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7" />
  <path d="M 165 155 Q 170 153 175 156" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7" />

  <!-- CENTRAL SUBJECT: THE MAGICAL TREASURE CHEST OF EXAMPLES ('比如' Concept Representation) -->
  <!-- A treasure chest opening up, bursting forth with vivid real-world example items (sports, gear) -->
  
  <!-- Chest Shadow -->
  <ellipse cx="120" cy="138" rx="32" ry="12" fill="#000000" opacity="0.6" />

  <!-- Chest Bottom/Base -->
  <path d="M 88 120 L 152 120 L 152 138 C 152 145 88 145 88 138 Z" fill="url(#chestGrad)" filter="url(#softShadow)" />
  <path d="M 88 120 L 120 135 L 152 120 L 152 138 C 152 145 88 145 88 138 Z" fill="url(#chestGrad)" />
  
  <!-- Chest Metal Bandings (Base) -->
  <rect x="102" y="122" width="6" height="18" fill="#94a3b8" />
  <rect x="132" y="122" width="6" height="18" fill="#94a3b8" />
  <!-- Keyhole -->
  <circle cx="120" cy="130" r="3" fill="#0f172a" />

  <!-- Magical Light Beam Bursting Upward -->
  <polygon points="120,115 80,40 160,40" fill="url(#beamGrad)" />

  <!-- Chest Lid (Opened Upward & Backward) -->
  <path d="M 88 116 L 152 116 L 145 92 L 95 92 Z" fill="url(#chestTopGrad)" filter="url(#softShadow)" />
  <rect x="102" y="110" width="6" height="8" fill="#94a3b8" />
  <rect x="132" y="110" width="6" height="8" fill="#94a3b8" />

  <!-- VIVID REAL-WORLD EXAMPLES EMERGING FROM THE CHEST -->
  <!-- Concept: "Sports" (such as swimming and running) bursting out as concrete vivid objects -->
  
  <!-- Example Item 1: Swimming Goggles (Floating Left) -->
  <g transform="translate(75, 75) rotate(-15)" filter="url(#softShadow)">
    <rect x="-14" y="-8" width="28" height="16" rx="8" fill="#38bdf8" stroke="#bae6fd" stroke-width="2" />
    <circle cx="-7" cy="0" r="5" fill="#0284c7" />
    <circle cx="7" cy="0" r="5" fill="#0284c7" />
    <path d="M -20 -4 C -25 -10 -30 -5 -35 -2" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Example Item 2: Running Sneaker (Floating Right, action-packed) -->
  <g transform="translate(160, 70) rotate(25)" filter="url(#softShadow)">
    <!-- Shoe Sole -->
    <path d="M -18 6 C -18 6 12 12 22 8 C 25 7 24 2 20 2 C 10 2 -18 6 -18 6 Z" fill="#f8fafc" />
    <!-- Shoe Body -->
    <path d="M -16 6 C -18 -4 -5 -12 10 -6 C 18 -2 20 5 20 5 C 20 5 0 2 -16 6 Z" fill="#ec4899" />
    <!-- Shoelace / Stripe Accent -->
    <path d="M 2 -4 L 8 -1" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -2 -5 L 3 -2" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Example Item 3: Golden Trophy / Star (Center Top, signifying prime examples) -->
  <g transform="translate(120, 48)" filter="url(#glow)">
    <!-- Glowing Star -->
    <path d="M0 -14 L3 -4 L13 -4 L5 2 L8 12 L0 6 L-8 12 L-5 2 L-13 -4 L-3 -4 Z" fill="#fbbf24" stroke="#fef3c7" stroke-width="1.5" />
  </g>

  <!-- Floating Sparkles & Detail Particles for Magic/Action Feel -->
  <circle cx="95" cy="55" r="3" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="145" cy="60" r="2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="110" cy="32" r="2.5" fill="#ec4899" filter="url(#glow)" />
  <circle cx="135" cy="35" r="1.5" fill="#fbbf24" />

  <!-- Dynamic Action Swooshes (Emphasizing the 'such as / for example' transition) -->
  <path d="M 60 100 Q 75 80 90 85" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" stroke-linecap="round" />
  <path d="M 180 100 Q 165 75 150 80" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" stroke-linecap="round" />

  <!-- Foreground Atmospheric Vignette / Frame enhancement -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>