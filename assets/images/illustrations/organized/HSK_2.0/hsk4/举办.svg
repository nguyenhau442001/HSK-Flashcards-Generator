<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Stage Spotlight Gradient -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Banner Gradient -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Podium Gradient -->
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Character Outfit -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Light Beams / Spotlight -->
  <polygon points="120,0 40,240 200,240" fill="url(#spotlight)" />

  <!-- Background Environment: Event Hall Architecture -->
  <!-- Back Wall -->
  <rect x="20" y="30" width="200" height="180" rx="8" fill="#131c31" />
  
  <!-- Festive Ceiling Lights / Stars / Confetti in background -->
  <circle cx="50" cy="50" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="190" cy="45" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="70" cy="90" r="2" fill="#ec4899" opacity="0.7" />
  <circle cx="170" cy="100" r="2" fill="#10b981" opacity="0.7" />

  <!-- Hanging Event Banner (Representing 'Hosting/Organizing' an event) -->
  <path d="M 40 45 Q 120 70 200 45 L 200 85 Q 120 110 40 85 Z" fill="url(#bannerGrad)" filter="url(#shadow)" />
  <!-- Decorative stripes on banner -->
  <path d="M 50 52 Q 120 77 190 52" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,6" fill="none" opacity="0.7" />
  <path d="M 50 78 Q 120 103 190 78" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,6" fill="none" opacity="0.7" />

  <!-- Stage and Podium Setup -->
  <!-- Stage Floor Back Drop -->
  <ellipse cx="120" cy="205" rx="90" ry="15" fill="#0b0f19" />
  
  <!-- Main Podium (Desk for Event Host) -->
  <path d="M 95 180 L 145 180 L 155 220 L 85 220 Z" fill="url(#podiumGrad)" filter="url(#shadow)" />
  <path d="M 90 180 L 150 180 L 150 186 L 90 186 Z" fill="#60a5fa" />
  <!-- Emblem on Podium -->
  <circle cx="120" cy="200" r="8" fill="#fbbf24" />

  <!-- SIDE PROPS: Speakers / Lighting rigs adding to "Event Organization" context -->
  <!-- Left Speaker -->
  <rect x="25" y="140" width="16" height="55" rx="3" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <circle cx="33" cy="155" r="5" fill="#1e293b" />
  <circle cx="33" cy="175" r="6" fill="#1e293b" />

  <!-- Right Speaker -->
  <rect x="199" y="140" width="16" height="55" rx="3" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <circle cx="207" cy="155" r="5" fill="#1e293b" />
  <circle cx="207" cy="175" r="6" fill="#1e293b" />

  <!-- MAIN CHARACTER: Event Organizer / Host gesturing enthusiastically -->
  <g transform="translate(0, 5)">
    <!-- Body / Suit Jacket -->
    <path d="M 100 135 L 140 135 L 145 185 L 95 185 Z" fill="url(#suitGrad)" />
    <!-- Shirt Collar / Tie -->
    <polygon points="112,135 128,135 120,150" fill="#ffffff" />
    <polygon points="118,145 122,145 124,170 120,175 116,170" fill="#ec4899" />

    <!-- Left Arm (Holding Microphone / Gesturing) -->
    <path d="M 100 140 L 75 160 L 85 170" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Hand with Microphone -->
    <circle cx="75" cy="170" r="5" fill="#fbcfe8" />
    <!-- Microphone -->
    <rect x="71" y="157" width="8" height="12" rx="4" fill="#94a3b8" />
    <line x1="75" y1="169" x2="75" y2="178" stroke="#475569" stroke-width="2" />

    <!-- Right Arm (Raised enthusiastically welcoming the crowd) -->
    <path d="M 140 140 Q 165 130 160 110" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <circle cx="160" cy="105" r="6" fill="#fbcfe8" />

    <!-- Head & Hair -->
    <!-- Neck -->
    <rect x="113" y="125" width="14" height="15" fill="#fbcfe8" />
    
    <!-- Hair Back/Base -->
    <circle cx="120" cy="105" r="22" fill="#1e293b" />
    
    <!-- Face -->
    <circle cx="120" cy="110" r="18" fill="#fbcfe8" />
    
    <!-- Hair Styling (Modern fringe) -->
    <path d="M 102 100 Q 115 90 135 102 Q 130 92 118 93 Z" fill="#1e293b" />

    <!-- Facial Expression: Joyful, energetic hosting smile -->
    <!-- Eyes (Happy Arcs) -->
    <path d="M 111 108 Q 114 105 117 108" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 123 108 Q 126 105 129 108" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Cheeks (Blush) -->
    <circle cx="109" cy="113" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="131" cy="113" r="3" fill="#f43f5e" opacity="0.4" />
    <!-- Big Open Smile -->
    <path d="M 114 115 Q 120 122 126 115" fill="#1e293b" />
  </g>

  <!-- FOREGROUND / EVENT DETAILS: Confetti and Streamers -->
  <g opacity="0.9">
    <!-- Streamer 1 -->
    <path d="M 15 100 Q 25 80 40 110 T 65 100" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <!-- Streamer 2 -->
    <path d="M 200 90 Q 215 110 200 130 T 185 150" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
    
    <!-- Confetti Pieces -->
    <rect x="45" y="130" width="6" height="4" rx="1" fill="#ec4899" transform="rotate(35 48 132)" />
    <rect x="180" y="160" width="7" height="5" rx="1" fill="#38bdf8" transform="rotate(-20 183 162)" />
    <circle cx="60" cy="180" r="3" fill="#10b981" />
    <circle cx="175" cy="70" r="3.5" fill="#fbbf24" />
    <rect x="95" y="60" width="5" height="5" rx="1" fill="#a855f7" transform="rotate(45 97 62)" />
    <rect x="145" y="75" width="6" height="3" rx="1" fill="#fb923c" transform="rotate(-15 148 76)" />
  </g>

  <!-- Subtle Inner Border Frame -->
  <rect x="8" y="8" width="224" height="224" rx="18" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.3" />
</svg>