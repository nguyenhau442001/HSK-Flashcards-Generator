<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Plant Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric background highlights -->
  <circle cx="120" cy="110" r="90" fill="#334155" opacity="0.2" />
  <circle cx="180" cy="50" r="40" fill="#f59e0b" opacity="0.05" />

  <!-- Wooden Shelf / Surface -->
  <path d="M 30 195 L 210 195 L 220 215 L 20 215 Z" fill="#334155" />
  <path d="M 20 195 L 220 195 L 220 199 L 20 199 Z" fill="#475569" />

  <!-- Potted Plant (Wilted / Thirsty Context for "缺少 nước") -->
  <g transform="translate(0, 5)">
    <!-- Pot Shadow -->
    <ellipse cx="120" cy="195" rx="36" ry="6" fill="#090d16" opacity="0.6" />

    <!-- Flower Pot -->
    <path d="M 88 150 L 152 150 L 144 195 L 96 195 Z" fill="url(#potGrad)" />
    <!-- Pot Rim -->
    <path d="M 84 142 L 156 142 L 156 150 L 84 150 Z" fill="#93c5fd" opacity="0.8" />
    <!-- Dry Soil inside rim -->
    <ellipse cx="120" cy="142" rx="36" ry="6" fill="#451a03" />
    <path d="M 90 142 Q 120 147 150 142" fill="none" stroke="#78350f" stroke-width="2" />

    <!-- Wilted Stems and Drooping Leaves -->
    <!-- Center Stem (Drooping Right) -->
    <path d="M 120 142 Q 130 110 145 90" fill="none" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Left Stem (Drooping Down) -->
    <path d="M 115 142 Q 100 120 90 130" fill="none" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Right Stem (Drooping Down) -->
    <path d="M 125 142 Q 140 125 155 135" fill="none" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Sad/Drooping Leaves (Yellowing/Dry tips) -->
    <!-- Leaf 1 -->
    <path d="M 145 90 Q 160 85 165 95 Q 155 100 145 90 Z" fill="#f59e0b" />
    <path d="M 145 90 Q 152 92 165 95" fill="none" stroke="#d97706" stroke-width="1.5" />

    <!-- Leaf 2 -->
    <path d="M 90 130 Q 75 125 70 135 Q 80 140 90 130 Z" fill="#eab308" />

    <!-- Leaf 3 -->
    <path d="M 155 135 Q 170 130 175 140 Q 165 145 155 135 Z" fill="#ca8a04" />

    <!-- Leaf 4 (Center drooping) -->
    <path d="M 118 120 Q 110 100 100 105 Q 110 115 118 120 Z" fill="#10b981" />
  </g>

  <!-- Empty / Dry Context Elements: Empty Water Can / Glass -->
  <g transform="translate(25, 130)">
    <!-- Shadow -->
    <ellipse cx="25" cy="65" rx="18" ry="4" fill="#090d16" opacity="0.5" />
    <!-- Empty Glass / Measuring Beaker -->
    <path d="M 15 25 L 35 25 L 37 65 L 13 65 Z" fill="#64748b" opacity="0.3" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
    <!-- Glass Rim -->
    <ellipse cx="25" cy="25" rx="10" ry="3" fill="none" stroke="#94a3b8" stroke-width="2" />
    <!-- Crack / Dry symbol on glass -->
    <path d="M 22 40 L 28 48 L 24 55" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Floating Warning / Scarcity Indicators (Stylized, non-textual) -->
  <g transform="translate(145, 45)">
    <!-- Glowing Amber Warning Circle -->
    <circle cx="0" cy="0" r="18" fill="#f59e0b" opacity="0.2" />
    <circle cx="0" cy="0" r="12" fill="#f59e0b" opacity="0.9" />
    <!-- Exclamation Icon inside -->
    <rect x="-1.5" y="-6" width="3" height="7" rx="1.5" fill="#0f172a" />
    <circle cx="0" cy="4" r="1.5" fill="#0f172a" />
  </g>

  <g transform="translate(75, 40)">
    <!-- Small floating empty drops / dashed cross signifying "missing" -->
    <path d="M -5 -5 L 5 5 M 5 -5 L -5 5" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- A single tiny, distant evaporating/missing water drop graphic with dotted trail -->
  <g transform="translate(120, 75)">
    <path d="M 0 -10 C 0 -10 6 -2 6 3 C 6 6.3 3.3 9 0 9 C -3.3 9 -6 6.3 -6 3 C -6 -2 0 -10 0 -10 Z" fill="url(#dropGrad)" opacity="0.5" />
    <!-- Dotted trail moving upwards indicating lack/absence -->
    <circle cx="0" cy="18" r="1.5" fill="#38bdf8" opacity="0.6" />
    <circle cx="0" cy="26" r="1" fill="#38bdf8" opacity="0.3" />
  </g>
</svg>