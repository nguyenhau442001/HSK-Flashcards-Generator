<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Movie Ticket Gradient -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Bowl Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Soup/Food Gradient -->
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Cinema & Dining Vibe) -->
  <g opacity="0.6">
    <!-- Ambient light from imaginary cinema screen -->
    <polygon points="120,20 220,110 20,110" fill="url(#screenGrad)" filter="url(#glow)"/>
    <!-- Wall decor / lighting strips -->
    <rect x="30" y="40" width="4" height="30" rx="2" fill="#38bdf8" opacity="0.4"/>
    <rect x="206" y="40" width="4" height="30" rx="2" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- Restaurant/Dining Table Surface -->
  <path d="M 0,160 L 240,160 L 240,230 C 240,235 235,240 230,240 L 10,240 C 5,240 0,235 0,230 Z" fill="url(#tableGrad)" filter="url(#shadow)"/>
  <!-- Table highlight edge -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2"/>

  <!-- SCENE PART 1: The Finished Meal (Eating First) -->
  <g transform="translate(45, 135)" filter="url(#shadow)">
    <!-- Chopsticks -->
    <line x1="-15" y1="20" x2="25" y2="-20" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <line x1="-10" y1="25" x2="30" y2="-15" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

    <!-- Bowl Shadow -->
    <ellipse cx="0" cy="15" rx="22" ry="6" fill="#0f172a" opacity="0.4"/>
    <!-- Rice Bowl Base -->
    <path d="M -18,5 L 18,5 C 15,22 -15,22 -18,5 Z" fill="#94a3b8"/>
    <!-- Bowl Body -->
    <path d="M -22,0 L 22,0 C 22,12 15,18 0,18 C -15,18 -22,12 -22,0 Z" fill="url(#bowlGrad)"/>
    <!-- Delicious Food / Noodles Inside -->
    <ellipse cx="0" cy="2" rx="20" ry="5" fill="url(#foodGrad)"/>
    <!-- Steam wisps representing just finished eating -->
    <path d="M -5,-5 C -8,-12 -2,-16 -5,-22" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 5,-3 C 8,-10 2,-14 5,-20" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- TRANSITION ACTION: The "Next / Tiếp Theo" Dynamic Arrow Flow -->
  <g filter="url(#glow)">
    <!-- Curving dashed trajectory leading from dinner to movie -->
    <path d="M 75,130 C 95,80 145,80 165,130" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round"/>
    
    <!-- Motion Action Arrow pointing towards the next activity -->
    <path d="M 152,118 L 168,133 L 150,140" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SCENE PART 2: The Next Activity - Going to the Movies (Movie Tickets & Popcorn) -->
  <g transform="translate(170, 130)" filter="url(#shadow)">
    <!-- Ticket Stub 1 (Underneath, tilted) -->
    <g transform="rotate(-15) translate(-15, 5)">
      <rect x="-25" y="-15" width="50" height="30" rx="4" fill="#cbd5e1"/>
      <circle cx="-25" cy="0" r="4" fill="#1e293b"/>
      <circle cx="25" cy="0" r="4" fill="#1e293b"/>
      <line x1="-10" y1="-15" x2="-10" y2="15" stroke="#94a3b8" stroke-dasharray="2 2"/>
    </g>

    <!-- Ticket Stub 2 (Main highlighted "Next" item) -->
    <g transform="rotate(10) translate(0, -5)">
      <rect x="-30" y="-18" width="60" height="36" rx="6" fill="url(#ticketGrad)"/>
      <!-- Perforation notches -->
      <path d="M -15,-18 C -10,-18 -10,-12 -15,-12 Z" fill="#1e293b"/>
      <path d="M -15,18 C -10,18 -10,12 -15,12 Z" fill="#1e293b"/>
      <!-- Ticket visual details (abstract lines representing cinema imagery) -->
      <rect x="-5" y="-10" width="20" height="12" rx="2" fill="#ffffff" opacity="0.9"/>
      <circle cx="5" cy="-4" r="3" fill="#f59e0b"/>
      <line x1="-22" y1="-5" x2="-18" y2="-5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="-22" y1="2" x2="-18" y2="2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="-22" y1="9" x2="-18" y2="9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Cute Popcorn Box beside the tickets -->
    <g transform="translate(25, 10)">
      <!-- Popcorn Base/Bucket -->
      <path d="M -12,0 L 12,0 L 10,22 C 10,24 8,25 6,25 L -6,25 C -8,25 -10,24 -10,22 Z" fill="#ef4444"/>
      <!-- Stripes on bucket -->
      <path d="M -6,0 L -5,22" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      <path d="M 0,0 L 0,22" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      <path d="M 6,0 L 5,22" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      <!-- Popcorn puffs spilling out -->
      <circle cx="-6" cy="-4" r="6" fill="#fef3c7"/>
      <circle cx="2" cy="-6" r="7" fill="#fef3c7"/>
      <circle cx="7" cy="-2" r="5" fill="#fef3c7"/>
      <circle cx="-2" cy="-10" r="6" fill="#fef3c7"/>
    </g>
  </g>

  <!-- Interactive/Action Sparkles (Emphasizing the sequential progression) -->
  <g fill="#fbbf24">
    <path d="M 115,65 Q 120,60 125,65 Q 120,70 115,65 Z" filter="url(#glow)"/>
    <path d="M 195,85 Q 198,82 201,85 Q 198,88 195,85 Z" opacity="0.8"/>
    <path d="M 45,95 Q 48,92 51,95 Q 48,98 45,95 Z" opacity="0.8"/>
  </g>

</svg>