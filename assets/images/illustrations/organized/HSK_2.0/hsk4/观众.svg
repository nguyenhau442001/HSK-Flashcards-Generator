<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="spotlight1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="spotlight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Base background -->
    <rect width="240" height="240" fill="url(#bgGrad)" />

    <!-- Atmospheric spotlights from above -->
    <polygon points="120,0 40,240 100,240" fill="url(#spotlight1)" />
    <polygon points="120,0 140,240 200,240" fill="url(#spotlight2)" />

    <!-- Stage / Performer area (distant context) -->
    <rect x="0" y="150" width="240" height="10" fill="#475569" />
    <ellipse cx="120" cy="150" rx="70" ry="12" fill="#64748b" opacity="0.4" />
    
    <!-- Abstract performer on stage -->
    <circle cx="120" cy="115" r="10" fill="#f43f5e" />
    <path d="M110,135 L120,125 L130,135 L127,150 L113,150 Z" fill="#fb7185" />
    <!-- Performer arms out -->
    <path d="M105,130 L120,127 L135,130" stroke="#fb7185" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Stage lighting effects (stars/glows) -->
    <circle cx="90" cy="100" r="2" fill="#fff" opacity="0.8" />
    <circle cx="150" cy="90" r="3" fill="#fff" opacity="0.6" />
    <circle cx="105" cy="80" r="1.5" fill="#fff" opacity="0.9" />

    <!-- AUDIENCE SEATING AREA (Foreground / Midground) -->
    <!-- Row 3 (Back) -->
    <g opacity="0.5">
      <!-- Seats -->
      <rect x="40" y="155" width="22" height="15" rx="3" fill="#334155" />
      <rect x="68" y="155" width="22" height="15" rx="3" fill="#334155" />
      <rect x="96" y="155" width="22" height="15" rx="3" fill="#334155" />
      <rect x="124" y="155" width="22" height="15" rx="3" fill="#334155" />
      <rect x="152" y="155" width="22" height="15" rx="3" fill="#334155" />
      <rect x="180" y="155" width="22" height="15" rx="3" fill="#334155" />
      <!-- Heads -->
      <circle cx="51" cy="150" r="7" fill="#64748b" />
      <circle cx="79" cy="148" r="8" fill="#475569" />
      <circle cx="107" cy="151" r="7" fill="#64748b" />
      <circle cx="135" cy="149" r="7.5" fill="#334155" />
      <circle cx="163" cy="150" r="7" fill="#64748b" />
      <circle cx="191" cy="148" r="8" fill="#475569" />
    </g>

    <!-- Row 2 (Middle) -->
    <g opacity="0.8">
      <!-- Seats -->
      <rect x="30" y="178" width="26" height="18" rx="4" fill="#3b82f6" />
      <rect x="62" y="178" width="26" height="18" rx="4" fill="#334155" />
      <rect x="94" y="178" width="26" height="18" rx="4" fill="#3b82f6" />
      <rect x="126" y="178" width="26" height="18" rx="4" fill="#334155" />
      <rect x="158" y="178" width="26" height="18" rx="4" fill="#3b82f6" />
      <rect x="190" y="178" width="20" height="18" rx="4" fill="#334155" />
      <!-- Heads & Bodies -->
      <circle cx="43" cy="170" r="9" fill="#f87171" />
      <path d="M34,188 C34,179 52,179 52,188" fill="#f87171" />

      <circle cx="75" cy="168" r="9.5" fill="#fbbf24" />
      <path d="M65,188 C65,178 85,178 85,188" fill="#fbbf24" />
      <!-- Raised arm -->
      <path d="M83,172 L92,162" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />

      <circle cx="107" cy="171" r="9" fill="#38bdf8" />
      <path d="M98,188 C98,179 116,179 116,188" fill="#38bdf8" />

      <circle cx="139" cy="169" r="9" fill="#a78bfa" />
      <path d="M130,188 C130,179 148,179 148,188" fill="#a78bfa" />

      <circle cx="171" cy="170" r="9.5" fill="#34d399" />
      <path d="M161,188 C161,178 181,178 181,188" fill="#34d399" />
      <!-- Raised arm waving -->
      <path d="M163,172 L158,160" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Row 1 (Foreground - Detailed Audience Members) -->
    <!-- Seat Backs -->
    <rect x="18" y="208" width="30" height="22" rx="5" fill="#1e293b" />
    <rect x="54" y="208" width="30" height="22" rx="5" fill="#1e293b" />
    <rect x="90" y="208" width="30" height="22" rx="5" fill="#1e293b" />
    <rect x="126" y="208" width="30" height="22" rx="5" fill="#1e293b" />
    <rect x="162" y="208" width="30" height="22" rx="5" fill="#1e293b" />
    <rect x="198" y="208" width="24" height="22" rx="5" fill="#1e293b" />

    <!-- Audience Member 1 (Left - Cheering with glow sticks) -->
    <g transform="translate(10, 185)">
      <!-- Body -->
      <path d="M15,45 C15,32 35,32 35,45 Z" fill="#ec4899" />
      <!-- Head -->
      <circle cx="25" cy="22" r="11" fill="#fbcfe8" />
      <!-- Hair -->
      <path d="M15,20 C15,10 35,10 35,20 C35,24 33,25 33,25 C33,25 31,18 25,18 C19,18 17,25 17,25 Z" fill="#831843" />
      <!-- Cheering Face (Expression) -->
      <circle cx="21" cy="22" r="1.5" fill="#831843" />
      <circle cx="29" cy="22" r="1.5" fill="#831843" />
      <path d="M23,27 Q25,30 27,27" stroke="#831843" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <!-- Glow sticks in hands -->
      <path d="M10,25 L5,15" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <circle cx="4" cy="13" r="3" fill="#bae6fd" />
      <path d="M40,25 L45,15" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <circle cx="46" cy="13" r="3" fill="#bae6fd" />
    </g>

<g transform="translate(65, 180)">
  <!-- Body / Hoodie -->
  <path d="M12,50 C12,35 38,35 38,50 Z" fill="#10b981" />
  <!-- Scarf -->
  <path d="M15,35 Q25,42 35,35 L38,42 Q25,48 12,42 Z" fill="#fb923c" />
  <!-- Head -->
  <circle cx="25" cy="20" r="11" fill="#fed7aa" />
  <!-- Hair / Cap -->
  <path d="M14,18 C14,8 36,8 36,18 L36,21 C36,21 30,17 25,17 C20,17 14,21 14,21 Z" fill="#ea580c" />
  <!-- Face: Excited eyes and wide happy mouth -->
  <circle cx="21" cy="20" r="1.5" fill="#7c2d12" />
  <circle cx="29" cy="20" r="1.5" fill="#7c2d12" />
  <path d="M22,25 Q25,29 28,25" fill="#7c2d12" />
  <!-- Hands clapping / up -->
  <path d="M8,30 L16,36" stroke="#fb923c" stroke-width="4" stroke-linecap="round" />
  <path d="M42,30 L34,36" stroke="#fb923c" stroke-width="4" stroke-linecap="round" />
</g>

    <!-- Audience Member 3 (Center-Right - Taking photo / holding phone) -->
    <g transform="translate(125, 175)">
      <!-- Body -->
      <path d="M12,55 C12,38 38,38 38,55 Z" fill="#6366f1" />
      <!-- Head -->
      <circle cx="25" cy="22" r="11.5" fill="#fde047" />
      <!-- Hair -->
      <path d="M14,20 C14,10 36,10 36,20 C36,22 34,20 32,15 C28,10 22,10 18,15 C16,20 14,20 14,20 Z" fill="#1e1b4b" />
      <!-- Face -->
      <circle cx="21" cy="23" r="1.5" fill="#422006" />
      <circle cx="29" cy="23" r="1.5" fill="#422006" />
      <path d="M23,28 Q25,31 27,28" stroke="#422006" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <!-- Raised Arm with Phone -->
      <path d="M35,32 L42,18" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
      <!-- Smartphone device glowing -->
      <rect x="38" y="10" width="10" height="16" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <rect x="40" y="13" width="6" height="10" fill="#38bdf8" opacity="0.8" />
    </g>

    <!-- Audience Member 4 (Right - Cheering enthusiastically with foam finger / hand up) -->
    <g transform="translate(180, 178)">
      <!-- Body -->
      <path d="M12,52 C12,36 38,36 38,52 Z" fill="#f59e0b" />
      <!-- Head -->
      <circle cx="25" cy="20" r="11" fill="#fbcfe8" />
      <!-- Hair (Pigtails) -->
      <circle cx="13" cy="18" r="4" fill="#9a3412" />
      <circle cx="37" cy="18" r="4" fill="#9a3412" />
      <path d="M14,18 C14,8 36,8 36,18 Z" fill="#ea580c" />
      <!-- Face -->
      <circle cx="21" cy="20" r="1.5" fill="#7c2d12" />
      <circle cx="29" cy="20" r="1.5" fill="#7c2d12" />
      <path d="M22,24 Q25,29 28,24" fill="#7c2d12" />
      <!-- Arm holding giant foam finger / star prop -->
      <path d="M36,28 L45,15" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round" />
      <!-- Star Prop -->
      <polygon points="45,5 47,11 53,11 48,15 50,21 45,17 40,21 42,15 37,11 43,11" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" />
    </g>

    <!-- Confetti / Atmosphere particles -->
    <circle cx="35" cy="80" r="3" fill="#38bdf8" opacity="0.7" />
    <rect x="75" cy="65" width="5" height="3" rx="1" fill="#fbbf24" transform="rotate(25 75 65)" opacity="0.8" />
    <circle cx="195" cy="95" r="2.5" fill="#ec4899" opacity="0.8" />
    <rect x="165" cy="55" width="6" height="4" rx="1" fill="#34d399" transform="rotate(-15 165 55)" opacity="0.9" />
    <circle cx="105" cy="50" r="3.5" fill="#a78bfa" opacity="0.7" />

    <!-- Foreground lighting gradient overlay / Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.5" />
    </radialGradient>
    <rect width="240" height="240" fill="url(#vignette)" pointer-events="none" />

    <!-- Subtle framing border -->
    <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
  </g>
</svg>