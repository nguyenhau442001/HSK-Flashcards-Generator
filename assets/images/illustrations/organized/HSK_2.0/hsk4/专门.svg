<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- The Specialized Book -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="120" height="160" rx="8" fill="#fbbf24"/>
    <rect x="10" y="20" width="100" height="120" rx="4" fill="#fef3c7"/>
    <rect x="20" y="30" width="80" height="10" rx="2" fill="#fb923c"/>
