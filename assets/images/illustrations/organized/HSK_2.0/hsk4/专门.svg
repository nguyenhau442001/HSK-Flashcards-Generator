    <path d="M50 100 L70 100 M60 90 L60 110" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Magnifying Glass (Specialized Tool) -->
  <g transform="rotate(-20 180 180)">
    <circle cx="180" cy="180" r="25" fill="none" stroke="#94a3b8" stroke-width="6"/>
    <rect x="195" y="195" width="40" height="8" rx="4" fill="#64748b" transform="rotate(45 215 199)"/>
