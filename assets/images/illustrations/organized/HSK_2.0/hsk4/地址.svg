<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Envelope Body Gradient -->
    <linearGradient id="env-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Envelope Flap Gradient -->
    <linearGradient id="env-flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Map Paper Gradient -->
    <linearGradient id="map-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background shapes (room setting) -->
  <path d="M0,170 L240,170 L240,240 L0,240 Z" fill="url(#floor-grad)" opacity="0.6" />
  
  <!-- Wooden floor planks perspective lines -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#1e293b" stroke-width="2" opacity="0.5" />
  <line x1="0" y1="215" x2="240" y2="215" stroke="#1e293b" stroke-width="2" opacity="0.5" />

  <!-- Background props: Plant & Bookshelf hints -->
  <!-- Mini House Prop (Symbolizing Location/Address context) -->
  <g transform="translate(180, 85) scale(0.7)" filter="url(#drop-shadow)">
    <polygon points="30,0 60,25 60,65 0,65 0,25" fill="#38bdf8" />
    <polygon points="30,-10 65,20 -5,20" fill="#0284c7" />
    <rect x="20" y="30" width="20" height="35" rx="4" fill="#0f172a" />
  </g>

  <!-- MAIN SUBJECT: The Letter/Envelope with Map and Pin representing 'Address' -->
  <g filter="url(#drop-shadow)" transform="translate(0, 10)">
    
    <!-- Letter / Map emerging from Envelope -->
    <g transform="translate(45, 30)">
      <!-- Map Background -->
      <rect x="15" y="-15" width="120" height="90" rx="6" fill="url(#map-grad)" />
      
      <!-- Map details (roads and grid lines) -->
      <path d="M15,20 Q60,40 135,10" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" opacity="0.8" />
      <path d="M40,-15 Q50,40 30,75" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <path d="M90,-15 Q100,50 110,75" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <path d="M15,55 Q80,45 135,60" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />

      <!-- Abstract Address Lines (Simulating text without real letters) -->
      <rect x="25" y="5" width="35" height="4" rx="2" fill="#cbd5e1" />
      <rect x="25" y="13" width="25" height="4" rx="2" fill="#cbd5e1" />

      <!-- Glowing Map Pin (The exact location/address marker) -->
      <g transform="translate(75, 25)">
        <!-- Pin Pulse / Glow Ring -->
        <circle cx="0" cy="0" r="14" fill="#f43f5e" opacity="0.3" filter="url(#glow)">
          <animate attributeName="r" values="10;18;10" dur="2s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite" />
        </circle>
        
        <!-- Main Pin Body -->
        <path d="M0,-14 C-7,-14 -12,-9 -12,-2 C-12,5 0,16 0,16 C0,16 12,5 12,-2 C12,-9 7,-14 0,-14 Z" fill="#f43f5e" />
        <!-- Inner white dot of pin -->
        <circle cx="0" cy="-3" r="4" fill="#ffffff" />
      </g>
    </g>

    <!-- Envelope Back/Body -->
    <rect x="30" y="60" width="150" height="100" rx="10" fill="url(#env-grad)" />
    
    <!-- Envelope Side Folds (Inner triangle shadows) -->
    <polygon points="30,60 105,120 30,160" fill="#e2e8f0" />
    <polygon points="180,60 105,120 180,160" fill="#cbd5e1" />
    
    <!-- Envelope Bottom Fold -->
    <polygon points="30,160 105,115 180,160" fill="#cbd5e1" />

    <!-- Envelope Top Flap (Open, pointing up) -->
    <polygon points="30,60 105,15 180,60" fill="url(#env-flap)" />
  </g>

  <!-- Foreground decorative elements: Magnifying glass (inspecting the address) -->
  <g transform="translate(155, 130) rotate(-15)" filter="url(#drop-shadow)">
    <!-- Glass Handle -->
    <rect x="30" y="0" width="12" height="45" rx="6" fill="#334155" />
    <circle cx="36" cy="38" r="5" fill="#1e293b" />
    
    <!-- Lens Rim -->
    <circle cx="20" cy="0" r="26" fill="#0f172a" />
    <circle cx="20" cy="0" r="22" fill="#38bdf8" opacity="0.25" />
    
    <!-- Glass Reflection Highlight -->
    <path d="M 8,-10 A 16,16 0 0,1 28,-14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Tiny floating location sparkles -->
  <g fill="#fbbf24">
    <path d="M 30,50 Q 30,45 35,45 Q 30,45 30,40 Q 30,45 25,45 Q 30,45 30,50 Z" />
    <path d="M 210,90 Q 210,85 215,85 Q 210,85 210,80 Q 210,85 205,85 Q 210,85 210,90 Z" />
    <path d="M 50,195 Q 50,190 55,190 Q 50,190 50,185 Q 50,190 45,190 Q 50,190 50,195 Z" />
  </g>

</svg>