<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- The "Key" to Success (Symbolizing 'Just need') -->
  <g transform="translate(120, 120) rotate(15)">
    <path d="M-40 -10 L40 -10 L40 10 L-40 10 Z" fill="#fbbf24"/>
    <path d="M0 -25 L0 25" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#fb923c" stroke-width="6"/>
  </g>

  <!-- Supporting Props: Open Book -->
  <path d="M40 180 L90 165 L90 205 L40 220 Z" fill="#e2e8f0"/>
  <path d="M90 165 L140 180 L140 220 L90 205 Z" fill="#cbd5e1"/>
  <path d="M90 165 L90 205" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Atmospheric Elements: Glowing particles of success -->
  <circle cx="180" cy="60" r="4" fill="#10b981"/>
  <circle cx="195" cy="80" r="3" fill="#38bdf8"/>
  <circle cx="160" cy="40" r="5" fill="#ec4899"/>
  
  <!-- Pencil -->
  <path d="M160 190 L210 140 L220 150 L170 200 Z" fill="#fb923c"/>
  <path d="M210 140 L220 150" stroke="#0f172a" stroke-width="2"/>
  <path d="M160 190 L170 200" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Light source glow -->
  <circle cx="120" cy="120" r="80" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>