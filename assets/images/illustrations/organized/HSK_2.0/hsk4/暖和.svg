<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Warm Glow -->
    <radialGradient id="warmGlow" cx="120" cy="110" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="1" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Fireplace Warmth -->
    <linearGradient id="fireGlow" x1="120" y1="160" x2="120" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>

    <!-- Mug Liquid Gradient -->
    <linearGradient id="teaGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Cat Fur Gradient -->
    <linearGradient id="catGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Warm Lighting -->
  <circle cx="120" cy="110" r="110" fill="url(#warmGlow)" />

  <!-- Window Frame in Background (Outside view shows cool blue night, contrasting indoor warmth) -->
  <g transform="translate(65, 30)">
    <rect x="0" y="0" width="110" height="90" rx="6" fill="#090d16" stroke="#334155" stroke-width="4"/>
    <!-- Window pane inner warm reflection -->
    <rect x="6" y="6" width="46" height="78" fill="#fbbf24" fill-opacity="0.08" rx="2"/>
    <rect x="58" y="6" width="46" height="78" fill="#fbbf24" fill-opacity="0.08" rx="2"/>
    
    <!-- House silhouette outside window (subtle) -->
    <path d="M 20 70 L 35 50 L 50 70 Z" fill="#1e293b" opacity="0.5"/>
    <rect x="27" y="58" width="16" height="12" fill="#1e293b" opacity="0.5"/>
  </g>

  <!-- Curtains framing the cozy window -->
  <path d="M 65 30 Q 50 75 55 120 L 65 120 Q 60 75 65 30 Z" fill="#38bdf8" opacity="0.2"/>
  <path d="M 175 30 Q 190 75 185 120 L 175 120 Q 180 75 175 30 Z" fill="#38bdf8" opacity="0.2"/>

  <!-- Wooden Table Surface -->
  <path d="M 20 170 L 220 170 L 230 220 L 10 220 Z" fill="#334155" />
  <path d="M 20 170 L 220 170 L 225 177 L 15 177 Z" fill="#475569" />
  <!-- Table Wood Grain Highlights -->
  <path d="M 40 185 L 190 185" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="20 10 40 15"/>
  <path d="M 30 200 L 200 200" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="30 20 20 25"/>

  <!-- Glowing Fire Effect from below -->
  <ellipse cx="120" cy="220" rx="80" ry="20" fill="url(#fireGlow)" />

  <!-- Potted Plant on the side for organic cozy life -->
  <g transform="translate(25, 125)">
    <!-- Pot -->
    <path d="M 12 35 L 28 35 L 32 45 L 8 45 Z" fill="#f43f5e" />
    <!-- Plant Leaves (Succulent/Warm houseplant) -->
    <path d="M 20 35 Q 10 20 5 15 Q 18 22 20 35 Z" fill="#10b981" />
    <path d="M 20 35 Q 25 15 35 10 Q 25 25 20 35 Z" fill="#34d399" />
    <path d="M 20 35 Q 20 12 20 5 Q 15 20 20 35 Z" fill="#059669" />
  </g>

  <!-- Steaming Ceramic Mug of Warm Tea/Cocoa -->
  <g transform="translate(145, 135)">
    <!-- Mug Body -->
    <path d="M 8 10 L 28 10 C 31 10 33 12 33 15 L 31 30 C 31 33 28 35 25 35 L 11 35 C 8 35 5 33 5 30 L 3 15 C 3 12 5 10 8 10 Z" fill="#f8fafc" />
    <!-- Mug Liquid -->
    <ellipse cx="18" cy="12" rx="10" ry="3" fill="url(#teaGrad)" />
    <!-- Mug Handle -->
    <path d="M 31 15 C 39 15 39 28 31 30" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
    <!-- Heart Motif on Mug (Showing Love & Warmth) -->
    <path d="M 18 20 C 16 18 13 20 15 23 C 18 26 18 26 18 26 C 18 26 18 26 21 23 C 23 20 20 18 18 20 Z" fill="#f43f5e" />

    <!-- Curly Steam Wisps rising from mug -->
    <path d="M 14 5 Q 18 0 14 -6 Q 10 -12 16 -18" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 22 4 Q 18 -2 22 -8 Q 26 -14 20 -20" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Cozy Sleeping Cat curled up near the mug -->
  <g transform="translate(70, 140)">
    <!-- Cat Body (Curled) -->
    <ellipse cx="32" cy="22" rx="22" ry="16" fill="url(#catGrad)" />
    <!-- Cat Tail wrapped around -->
    <path d="M 12 22 C 8 28 15 35 22 34 C 28 33 30 28 28 26" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round" />
    <!-- Cat Head -->
    <circle cx="45" cy="14" r="11" fill="url(#catGrad)" />
    <!-- Ears -->
    <polygon points="43,5 47,2 50,8" fill="#c2410c" />
    <polygon points="51,7 54,4 57,11" fill="#c2410c" />
    <!-- Closed Happy Eyes (Arcs) -->
    <path d="M 46 13 Q 48 15 50 13" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 52 14 Q 54 16 56 14" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" />
    <!-- Sleeping Zzz (Floating Upwards) -->
    <g transform="translate(58, 2)">
      <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="10" fill="#fbbf24" opacity="0.8">z</text>
      <text x="6" y="-6" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fbbf24" opacity="0.6">Z</text>
      <text x="13" y="-14" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fbbf24" opacity="0.4">Z</text>
    </g>
  </g>

  <!-- Hanging Knit Scarf draped over the edge of the table (Symbolizing winter warmth) -->
  <g transform="translate(180, 150)">
    <path d="M 0 0 C 5 15 0 35 10 50 C 13 55 18 50 15 45 C 8 30 12 15 8 0 Z" fill="#ec4899" />
    <!-- Scarf Fringe -->
    <line x1="10" y1="50" x2="8" y2="58" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" />
    <line x1="13" y1="50" x2="12" y2="59" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" />
    <line x1="16" y1="49" x2="17" y2="57" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" />
    <!-- Scarf Stripes -->
    <path d="M 2 10 Q 5 12 7 9" stroke="#fbcfe8" stroke-width="3" fill="none" />
    <path d="M 4 25 Q 7 27 9 24" stroke="#fbcfe8" stroke-width="3" fill="none" />
    <path d="M 6 40 Q 9 42 11 39" stroke="#fbcfe8" stroke-width="3" fill="none" />
  </g>

  <!-- Glowing warmth sparkles / cozy dust motes floating in air -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="100" cy="90" r="2" />
    <circle cx="140" cy="70" r="1.5" />
    <circle cx="80" cy="110" r="2.5" />
    <circle cx="160" cy="100" r="2" />
    <circle cx="115" cy="65" r="1" />
  </g>
</svg>