<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Blue Accent -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow in Background -->
  <circle cx="140" cy="110" r="80" fill="url(#glow)"/>

  <!-- Workshop/Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#tableGrad)"/>
  <!-- Table Edge Highlight -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2"/>

  <!-- BACKGROUND PROPS (Tools & Parts) -->
  <!-- Wrench -->
  <g transform="translate(35, 140) rotate(-25)" filter="url(#shadow)">
    <rect x="-4" y="-20" width="8" height="40" rx="4" fill="#64748b"/>
    <circle cx="0" cy="-20" r="7" fill="#64748b"/>
    <circle cx="0" cy="-20" r="3" fill="#1e293b"/>
    <circle cx="0" cy="20" r="7" fill="#64748b"/>
  </g>

  <!-- Gears / Mechanical parts in background -->
  <g transform="translate(195, 145)" opacity="0.6">
    <circle cx="0" cy="0" r="14" fill="#475569"/>
    <circle cx="0" cy="0" r="6" fill="#1e293b"/>
    <rect x="-3" y="-18" width="6" height="36" fill="#475569" rx="1"/>
    <rect x="-18" y="-3" width="36" height="6" fill="#475569" rx="1"/>
    <rect x="-13" y="-13" width="26" height="26" fill="#475569" rx="2" transform="rotate(45)" />
    <circle cx="0" cy="0" r="5" fill="#1e293b"/>
  </g>

  <!-- MAIN SUBJECT: Instructional Blueprint/Manual (Drawn strictly without text) -->
  <g transform="translate(45, 60) rotate(-6)" filter="url(#shadow)">
    <!-- Paper Base (Rotated slightly for dynamic feel) -->
    <rect x="0" y="0" width="110" height="130" rx="4" fill="#f8fafc"/>
    <path d="M 90 0 L 110 20 L 110 20 L 90 20 Z" fill="#cbd5e1"/>
    <!-- Folded corner shadow -->
    <path d="M 90 0 L 90 20 L 110 20 Z" fill="#e2e8f0"/>

    <!-- Blueprint Header Graphics (Abstract diagram replacing text) -->
    <rect x="15" y="18" width="50" height="8" rx="2" fill="#3b82f6"/>
    <circle cx="85" cy="22" r="6" fill="#10b981"/>

    <!-- Step-by-Step Graphical Instructions (Showing 'According to') -->
    <!-- Step 1: Base block -->
    <rect x="18" y="42" width="24" height="16" rx="2" fill="#cbd5e1"/>
    <circle cx="30" cy="50" r="3" fill="#64748b"/>

    <!-- Step 2: Adding gear/component with directional arrow -->
    <rect x="58" y="42" width="24" height="16" rx="2" fill="#cbd5e1"/>
    <circle cx="70" cy="50" r="5" fill="#f59e0b"/>
    <!-- Animated Curved Arrow indicating "follow this step" -->
    <path d="M 44 45 Q 50 35 56 45" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="56,42 61,46 54,48" fill="#3b82f6"/>

    <!-- Divider Line -->
    <line x1="15" y1="72" x2="95" y2="72" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Step 3: Completed assembly diagram -->
    <rect x="35" y="86" width="40" height="24" rx="3" fill="#e2e8f0"/>
    <circle cx="55" cy="98" r="8" fill="#3b82f6"/>
    <circle cx="55" cy="98" r="3" fill="#f8fafc"/>

    <!-- Checkmark Badge signifying "Correctly Done according to plan" -->
    <circle cx="82" cy="100" r="12" fill="#10b981"/>
    <path d="M 77 100 L 80 103 L 88 95" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND OBJECT: The Built Mechanical Device / Object being assembled -->
  <g transform="translate(125, 95)" filter="url(#shadow)">
    <!-- Device Shadow ring -->
    <ellipse cx="35" cy="65" rx="32" ry="12" fill="#0f172a" opacity="0.6"/>

    <!-- Main Housing -->
    <rect x="10" y="25" width="50" height="45" rx="8" fill="#334155"/>
    <rect x="14" y="29" width="42" height="37" rx="6" fill="#475569"/>

    <!-- Glowing Core (Cyan Accent) -->
    <circle cx="35" cy="47" r="12" fill="#1e293b"/>
    <circle cx="35" cy="47" r="8" fill="#38bdf8" filter="url(#glowFilter)"/>
    <circle cx="35" cy="47" r="4" fill="#f8fafc"/>

    <!-- Mechanical Base / Stands -->
    <path d="M 18 70 L 10 82 L 60 82 L 52 70 Z" fill="#64748b"/>
    <rect x="5" y="82" width="60" height="6" rx="3" fill="#475569"/>

    <!-- Top Indicator Light -->
    <circle cx="35" cy="18" r="5" fill="#f59e0b" filter="url(#glowFilter)"/>
    <rect x="33" y="22" width="4" height="4" fill="#64748b"/>

    <!-- Side Port / Knob -->
    <rect x="60" y="38" width="5" height="12" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- ACTION & GUIDANCE ELEMENTS: Floating holographic alignment/checkmarks -->
  <!-- Glowing Floating Checkmark representing accurate execution 'theo hướng dẫn' -->
  <g transform="translate(165, 55)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="16" fill="#10b981" opacity="0.9"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#34d399" stroke-width="2"/>
    <path d="M -6 -1 L -2 4 L 7 -6" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Guiding light particles / sparks -->
  <circle cx="105" cy="45" r="3" fill="#38bdf8" filter="url(#glowFilter)"/>
  <circle cx="120" cy="35" r="2" fill="#fbbf24"/>
  <circle cx="90" cy="140" r="2.5" fill="#38bdf8"/>
  <circle cx="160" cy="145" r="3.5" fill="#10b981" filter="url(#glowFilter)"/>

  <!-- Precision alignment bracket (HUD/Tech overlay representing 'following rules/specs') -->
  <path d="M 115 15 L 110 15 L 110 25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 195 95 L 200 95 L 200 105" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 40 40 L 35 40 L 35 50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

</svg>