<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1329"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Terrarium Cylinder Gradient -->
    <linearGradient id="glass-grad" x1="60" y1="60" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="soil-grad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="leaf-grad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow for Terrarium -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.6"/>
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements (Stars / Sparks) -->
  <g fill="#93c5fd" opacity="0.4">
    <circle cx="45" cy="50" r="1.5"/>
    <circle cx="195" cy="40" r="2"/>
    <circle cx="210" cy="110" r="1"/>
    <circle cx="30" cy="140" r="1.5"/>
    <circle cx="100" cy="30" r="1"/>
  </g>

  <!-- Ambient Backlight for Life Source -->
  <circle cx="120" cy="125" r="70" fill="url(#core-glow)" filter="url(#soft-glow)"/>

  <!-- Wooden Table / Surface -->
  <path d="M 20 200 L 220 200 C 225 200 228 205 225 210 L 215 225 C 213 228 210 230 205 230 L 35 230 C 30 230 27 228 25 225 L 15 210 C 12 205 15 200 20 200 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <ellipse cx="120" cy="200" rx="90" ry="12" fill="#334155" opacity="0.6"/>

  <!-- Terrarium Base (Cork / Wood) -->
  <path d="M 85 175 L 155 175 C 158 175 160 178 158 182 L 154 195 C 153 198 150 200 146 200 L 94 200 C 90 200 87 198 86 195 L 82 182 C 80 178 82 175 85 175 Z" fill="#b45309" stroke="#78350f" stroke-width="2" filter="url(#drop-shadow)"/>
  <ellipse cx="120" cy="175" rx="35" ry="5" fill="#d97706"/>

  <!-- Terrarium Glass Container -->
  <g filter="url(#drop-shadow)">
    <!-- Soil inside -->
    <path d="M 88 175 C 95 165 110 162 120 162 C 130 162 145 165 152 175 Z" fill="url(#soil-grad)"/>

    <!-- Glass Body -->
    <path d="M 88 175 
             C 75 175 70 140 75 110 
             C 78 85 95 70 120 70 
             C 145 70 162 85 165 110 
             C 170 140 165 175 152 175 
             Z" 
          fill="url(#glass-grad)" stroke="#93c5fd" stroke-width="2.5" stroke-opacity="0.8"/>
  </g>

  <!-- Glowing Energy Core behind the plant -->
  <circle cx="120" cy="120" r="28" fill="url(#sun-glow)" filter="url(#soft-glow)"/>

  <!-- Floating Magic Sparkles / Pollen inside Terrarium -->
  <g fill="#fde047">
    <circle cx="105" cy="105" r="2" opacity="0.9"/>
    <circle cx="138" cy="95" r="1.5" opacity="0.8"/>
    <circle cx="130" cy="135" r="2.5" opacity="0.7"/>
    <circle cx="100" cy="140" r="1" opacity="0.9"/>
    <path d="M 120 85 L 121.5 88.5 L 125 90 L 121.5 91.5 L 120 95 L 118.5 91.5 L 115 90 L 118.5 88.5 Z" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Central Vibrant Sprout / Life Symbol -->
  <g id="life-plant">
    <!-- Main Stem -->
    <path d="M 120 170 C 118 145 122 125 120 105" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Left Leaf -->
    <path d="M 120 135 C 105 130 90 135 85 120 C 95 110 110 115 120 125 Z" fill="url(#leaf-grad)" stroke="#065f46" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 120 130 C 110 125 100 123 92 121" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-linecap="round"/>

    <!-- Right Leaf -->
    <path d="M 120 125 C 135 115 150 122 155 110 C 145 98 130 105 120 115 Z" fill="url(#leaf-grad)" stroke="#065f46" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 120 120 C 130 112 140 110 148 111" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-linecap="round"/>

    <!-- Top Bud / New Life -->
    <path d="M 120 105 C 114 95 118 85 120 80 C 122 85 126 95 120 105 Z" fill="#34d399" stroke="#047857" stroke-width="1.5"/>
    <path d="M 120 105 C 120 98 121 90 120 82" fill="none" stroke="#ecfdf5" stroke-width="1"/>
  </g>

  <!-- Terrarium Glass Highlights (Front Reflection) -->
  <path d="M 83 115 C 83 100 90 85 105 76" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M 152 145 C 156 135 157 125 155 115" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Terrarium Cork Lid (Floating above slightly for magic effect) -->
  <g filter="url(#drop-shadow)">
    <path d="M 102 58 L 138 58 C 141 58 143 61 141 65 L 137 70 C 136 72 133 74 130 74 L 110 74 C 107 74 104 72 103 70 L 99 65 C 97 61 99 58 102 58 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="120" cy="58" rx="18" ry="3" fill="#d97706"/>
    <!-- Magic glow beneath lid -->
    <ellipse cx="120" cy="74" rx="10" ry="2" fill="#38bdf8" opacity="0.8" filter="url(#soft-glow)"/>
  </g>

  <!-- Foreground Atmospheric Particles & Fireflies -->
  <g fill="#38bdf8">
    <circle cx="75" cy="180" r="2" opacity="0.8"/>
    <circle cx="170" cy="160" r="3" opacity="0.6"/>
    <circle cx="155" cy="80" r="1.5" opacity="0.9"/>
  </g>

  <g fill="#fbbf24">
    <circle cx="85" cy="90" r="2" opacity="0.8"/>
    <circle cx="145" cy="185" r="1.5" opacity="0.9"/>
  </g>
</svg>