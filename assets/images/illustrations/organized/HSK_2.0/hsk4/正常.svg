<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor/Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#334155" opacity="0.4"/>
  
  <!-- Subject: A routine, healthy check-up scene (Heartbeat monitor/Pulse) -->
  <!-- Monitor Screen -->
  <rect x="40" y="60" width="160" height="100" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Pulse Line (The visual representation of 'normal' rhythm) -->
  <path d="M50 110 L80 110 L90 90 L100 130 L110 110 L160 110 L170 90 L180 130 L190 110" 
        fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Contextual Props: Doctor's desk items -->
  <!-- Stethoscope -->
  <path d="M180 180 C 180 150, 150 140, 130 140 C 110 140, 80 150, 80 180" 
        fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="180" r="12" fill="#fb923c"/>
  <circle cx="180" cy="180" r="12" fill="#fb923c"/>
  
  <!-- Ambient glow/accents -->
  <circle cx="210" cy="40" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="30" cy="200" r="6" fill="#ec4899" opacity="0.3"/>
  <rect x="190" y="140" width="20" height="5" rx="2" fill="#38bdf8"/>
  <rect x="190" y="150" width="15" height="5" rx="2" fill="#38bdf8"/>
</svg>