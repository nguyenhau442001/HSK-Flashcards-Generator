<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow in background representing fake/trap -->
  <circle cx="150" cy="90" r="60" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>
  <circle cx="90" cy="140" r="50" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>

  <!-- Room Interior Elements -->
  <!-- Window / Blind Backdrop -->
  <g opacity="0.3">
    <rect x="30" y="30" width="70" height="80" rx="4" fill="#334155"/>
    <line x1="30" y1="50" x2="100" y2="50" stroke="#1e293b" stroke-width="3"/>
    <line x1="30" y1="70" x2="100" y2="70" stroke="#1e293b" stroke-width="3"/>
    <line x1="30" y1="90" x2="100" y2="90" stroke="#1e293b" stroke-width="3"/>
  </g>

  <!-- Desk Surface -->
  <path d="M10 180 L230 180 L220 220 L20 220 Z" fill="url(#deskGrad)" />
  <path d="M10 180 L230 180 L230 184 L10 184 Z" fill="#475569" opacity="0.8"/>

  <!-- LAPTOP / SCAM SETUP -->
  <g transform="translate(100, 110)">
    <!-- Laptop Base -->
    <path d="M-55 70 L55 70 L65 78 L-65 78 Z" fill="#64748b"/>
    <path d="M-20 70 L20 70 L20 73 L-20 73 Z" fill="#475569"/>
    
    <!-- Laptop Screen Bezel -->
    <rect x="-50" y="-15" width="100" height="87" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Laptop Screen Display (Scam alert / fake prize) -->
    <rect x="-44" y="-9" width="88" height="75" fill="#090d16"/>
    
    <!-- Fake Chart/Data on Screen -->
    <path d="M-30 40 L-15 20 L0 30 L20 5 L35 25" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="25" r="4" fill="#ec4899" filter="url(#glow)"/>
    
    <!-- Floating Fake Gold Coins escaping laptop -->
    <g transform="translate(15, -15)">
      <circle cx="0" cy="0" r="12" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="9" fill="#f59e0b" />
      <text x="0" y="4" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#fff" text-anchor="middle">$</text>
    </g>
    <g transform="translate(38, -35)">
      <circle cx="0" cy="0" r="9" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="7" fill="#f59e0b" />
    </g>
  </g>

  <!-- DECEIVER CHARACTER (Sly/Hidden Figure leaning in) -->
  <g transform="translate(160, 95)">
    <!-- Body / Suit -->
    <path d="M-15 85 L25 85 L35 125 L-25 125 Z" fill="#0f172a"/>
    <path d="M-5 85 L15 85 L20 110 L-10 110 Z" fill="#cbd5e1"/> <!-- Shirt -->
    <path d="M0 85 L10 85 L5 110 Z" fill="#ef4444"/> <!-- Tie -->

    <!-- Head / Face -->
    <circle cx="5" cy="40" r="22" fill="#fed7aa"/>
    
    <!-- Sly Hair -->
    <path d="M-13 32 C-15 15, 10 15, 22 25 C15 20, -5 20, -10 30 Z" fill="#334155"/>

    <!-- Smug Eyes (Mischievous squint) -->
    <path d="M2 38 Q8 34 14 38" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-4 39 Q1 36 6 39" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Smirk / Grin -->
    <path d="M2 48 Q10 54 16 46" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Shifty Hand reaching forward with money bag or card -->
    <path d="M20 70 C30 65, 45 75, 40 85" fill="none" stroke="#fed7aa" stroke-width="7" stroke-linecap="round"/>
    <circle cx="43" cy="88" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  </g>

  <!-- VICTIM CHARACTER (Shocked / Naive target) -->
  <g transform="translate(65, 100)">
    <!-- Body / Hoodie -->
    <path d="M-25 80 L25 80 L35 125 L-35 125 Z" fill="#38bdf8"/>
    <path d="M-15 80 L15 80 L10 100 L-10 100 Z" fill="#0284c7"/> <!-- Collar -->

    <!-- Head -->
    <circle cx="-2" cy="38" r="21" fill="#fbcfe8"/>

    <!-- Hair (Messy/Surprised) -->
    <path d="M-22 30 C-25 10, 15 10, 18 30 C10 18, -10 18, -20 28 Z" fill="#475569"/>

    <!-- Wide Shocked Eyes -->
    <circle cx="-9" cy="36" r="4.5" fill="#ffffff"/>
    <circle cx="-9" cy="36" r="2" fill="#0f172a"/>
    <circle cx="5" cy="36" r="4.5" fill="#ffffff"/>
    <circle cx="5" cy="36" r="2" fill="#0f172a"/>

    <!-- Open O-shaped Mouth (Surprise) -->
    <ellipse cx="-2" cy="48" rx="4" ry="6" fill="#0f172a"/>

    <!-- Sweat Drop (Realization of deceit) -->
    <path d="M16 28 C16 28, 21 35, 21 39 C21 41.5, 19 43, 16 43 C13 43, 11 41.5, 11 39 C11 35, 16 28, 16 28 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- FOREGROUND PROPS (Scam Context: Wallet, Credit Card, Falling Money) -->
  <g transform="translate(0, 0)">
    <!-- Open Wallet on Desk -->
    <g transform="translate(35, 175) rotate(-10)">
      <rect x="0" y="0" width="36" height="26" rx="4" fill="#78350f" stroke="#92400e" stroke-width="2"/>
      <rect x="4" y="4" width="28" height="18" rx="2" fill="#b45309"/>
      <!-- Credit Card sticking out -->
      <rect x="8" y="-8" width="22" height="14" rx="2" fill="#ec4899" transform="rotate(15 8 -8)"/>
      <rect x="11" y="-5" width="5" height="3" rx="1" fill="#fbbf24" transform="rotate(15 8 -8)"/>
    </g>

    <!-- Flying banknotes being "taken away" -->
    <g transform="translate(125, 145) rotate(25)">
      <rect x="0" y="0" width="26" height="14" rx="2" fill="#10b981" opacity="0.9"/>
      <circle cx="13" cy="7" r="3" fill="#065f46" opacity="0.5"/>
    </g>
    <g transform="translate(145, 125) rotate(40)">
      <rect x="0" y="0" width="22" height="12" rx="2" fill="#10b981" opacity="0.9"/>
    </g>
  </g>

  <!-- Dynamic Warning / Trap Elements (Visual metaphor for trickery) -->
  <g transform="translate(130, 45)">
    <polygon points="0,-12 11,10 -11,10" fill="#f59e0b" filter="url(#glow)"/>
    <text x="0" y="7" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#0f172a" text-anchor="middle">!</text>
  </g>

  <!-- Subtle App Polish Framing -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>