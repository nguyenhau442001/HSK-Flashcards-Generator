<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="cityGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Atmospheric Elements / Glowing Network Connections representing "Society/Community" -->
  <circle cx="120" cy="110" r="90" fill="url(#cityGlow)" />
  
  <g stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5" fill="none">
    <line x1="60" y1="140" x2="120" y2="100" />
    <line x1="120" y1="100" x2="180" y2="130" />
    <line x1="120" y1="100" x2="120" y2="50" />
    <line x1="90" y1="75" x2="150" y2="85" />
    <circle cx="60" cy="140" r="3" fill="#38bdf8" fill-opacity="0.3" />
    <circle cx="180" cy="130" r="3" fill="#38bdf8" fill-opacity="0.3" />
    <circle cx="120" cy="50" r="3" fill="#38bdf8" fill-opacity="0.3" />
    <circle cx="90" cy="75" r="2" fill="#38bdf8" fill-opacity="0.3" />
    <circle cx="150" cy="85" r="2" fill="#38bdf8" fill-opacity="0.3" />
  </g>

  <!-- BACKGROUND BUILDINGS (Distant Cityscape) -->
  <g fill="#334155" opacity="0.6">
    <rect x="25" y="80" width="30" height="120" rx="2" />
    <rect x="55" y="95" width="25" height="105" rx="2" />
    <rect x="160" y="70" width="35" height="130" rx="2" />
    <rect x="195" y="90" width="20" height="110" rx="2" />
  </g>

  <!-- MIDGROUND BUILDINGS (Active Urban Center) -->
  <!-- Building Left -->
  <rect x="20" y="110" width="50" height="90" fill="#475569" rx="3" />
  <!-- Windows Left -->
  <g fill="#fbbf24" opacity="0.8">
    <rect x="28" y="120" width="10" height="12" rx="1" />
    <rect x="42" y="120" width="10" height="12" rx="1" />
    <rect x="28" y="140" width="10" height="12" rx="1" />
    <rect x="42" y="140" width="10" height="12" rx="1" />
    <rect x="28" y="160" width="10" height="12" rx="1" />
    <rect x="42" y="160" width="10" height="12" rx="1" />
  </g>

  <!-- Building Right -->
  <rect x="170" y="95" width="50" height="105" fill="#475569" rx="3" />
  <!-- Windows Right -->
  <g fill="#38bdf8" opacity="0.8">
    <rect x="178" y="105" width="10" height="12" rx="1" />
    <rect x="192" y="105" width="10" height="12" rx="1" />
    <rect x="178" y="125" width="10" height="12" rx="1" />
    <rect x="192" y="125" width="10" height="12" rx="1" />
    <rect x="178" y="145" width="10" height="12" rx="1" />
    <rect x="192" y="145" width="10" height="12" rx="1" />
  </g>

  <!-- Central Modern Landmark (Tower / Hub representing Society) -->
  <path d="M 105 200 L 100 70 L 140 70 L 135 200 Z" fill="#64748b" />
  <!-- Glowing central spire core -->
  <path d="M 116 200 L 115 50 L 125 50 L 124 200 Z" fill="#38bdf8" opacity="0.7" />
  <circle cx="120" cy="45" r="5" fill="#f59e0b" filter="url(#shadow)" />

  <!-- Connecting Bridge / Overpass (Interconnected Society) -->
  <path d="M 50 165 Q 120 145 190 165" stroke="#0ea5e9" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#shadow)" />
  <path d="M 50 165 Q 120 145 190 165" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-dasharray="6 6" />

  <!-- FOREGROUND: Diverse Citizens / Community Interaction -->
  <!-- Street Level Ground Base -->
  <rect x="0" y="195" width="240" height="45" fill="#0f172a" />
  <rect x="0" y="195" width="240" height="4" fill="#38bdf8" opacity="0.5" />

  <!-- Character 1 (Left - Person walking with bag, dynamic pose) -->
  <g transform="translate(70, 155)">
    <!-- Shadow -->
    <ellipse cx="12" cy="45" rx="10" ry="3" fill="#000000" opacity="0.4" />
    <!-- Body/Outfit -->
    <path d="M 8 20 L 16 20 L 18 38 L 6 38 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="12" cy="12" r="6" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 6 11 C 6 7 18 7 18 11 Z" fill="#1e293b" />
    <!-- Legs -->
    <line x1="9" y1="38" x2="5" y2="46" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="38" x2="19" y2="44" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <!-- Arms -->
    <path d="M 7 22 L 2 30" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Character 2 (Center - Person gesturing/communicating, representing social interaction) -->
  <g transform="translate(112, 148)">
    <!-- Shadow -->
    <ellipse cx="8" cy="52" rx="9" ry="3" fill="#000000" opacity="0.4" />
    <!-- Body -->
    <path d="M 4 22 L 12 22 L 15 44 L 1 44 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="8" cy="13" r="6" fill="#fcd34d" />
    <!-- Hair -->
    <circle cx="8" cy="10" r="6" fill="#78350f" />
    <!-- Arms (Waving/Talking pose) -->
    <path d="M 12 24 L 20 20" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
    <path d="M 4 24 L -2 30" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
    <!-- Legs -->
    <line x1="5" y1="44" x2="4" y2="53" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <line x1="11" y1="44" x2="12" y2="53" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Character 3 (Right - Person with a bicycle / mobility) -->
  <g transform="translate(150, 152)">
    <!-- Shadow -->
    <ellipse cx="12" cy="48" rx="12" ry="3" fill="#000000" opacity="0.4" />
    <!-- Bicycle Wheels -->
    <circle cx="0" cy="40" r="9" fill="none" stroke="#94a3b8" stroke-width="2" />
    <circle cx="24" cy="40" r="9" fill="none" stroke="#94a3b8" stroke-width="2" />
    <!-- Bike Frame -->
    <path d="M 0 40 L 10 28 L 24 40 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
    <!-- Rider Body -->
    <path d="M 8 20 L 14 30 L 10 38" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rider Head -->
    <circle cx="6" cy="13" r="5" fill="#fcd34d" />
    <!-- Helmet -->
    <path d="M 1 12 C 1 8 11 8 11 12 Z" fill="#ef4444" />
  </g>

  <!-- Ambient Floating Social Connection Nodes / Icons (Abstract representation of community interaction) -->
  <g transform="translate(0, 0)">
    <!-- Heart icon (Community care) -->
    <path d="M 75 75 C 75 70, 83 70, 83 76 C 83 82, 75 87, 75 87 C 75 87, 67 82, 67 76 C 67 70, 75 70, 75 75 Z" fill="#ec4899" opacity="0.8" filter="url(#shadow)" />
    
    <!-- Briefcase / Work icon (Economic society) -->
    <g transform="translate(155, 65)">
      <rect x="0" y="4" width="14" height="10" rx="2" fill="#fbbf24" />
      <path d="M 4 4 L 4 2 C 4 1, 10 1, 10 2 L 10 4" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    </g>

    <!-- Location pin (Community place) -->
    <g transform="translate(108, 90)">
      <path d="M 6 0 C 2.5 0 0 2.5 0 6 C 0 10.5 6 15 6 15 C 6 15 12 10.5 12 6 C 12 2.5 9.5 0 6 0 Z" fill="#10b981" />
      <circle cx="6" cy="5.5" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- Decorative Lighting Gradients / Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="70%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#020617" stop-opacity="0.6" />
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none" />
</svg>