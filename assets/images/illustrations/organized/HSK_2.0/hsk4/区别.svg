<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glass Blue Gradient (Object A) -->
    <linearGradient id="blueObjGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Vibrant Pink/Coral Gradient (Object B) -->
    <linearGradient id="pinkObjGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Magnifier Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <!-- Ambient light circles -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.03" filter="url(#glow)"/>
  <circle cx="150" cy="90" r="50" fill="#fb7185" opacity="0.03" filter="url(#glow)"/>

  <!-- Isometric/Perspective Floor Grid Lines for Spatial Depth -->
  <ellipse cx="120" cy="175" rx="90" ry="35" fill="url(#floorGrad)"/>
  <ellipse cx="120" cy="175" rx="90" ry="35" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="120" cy="175" rx="60" ry="22" fill="none" stroke="#475569" stroke-width="1" opacity="0.2"/>

  <!-- SCENE: TWO DISTINCT OBJECTS COMPARED (Representing "Sự khác biệt" / Difference) -->

  <!-- Object 1: Blue Cube (Left Side) -->
  <g transform="translate(75, 120)" filter="url(#shadow)">
    <!-- Base shadow cast -->
    <ellipse cx="0" cy="45" rx="22" ry="8" fill="#000000" opacity="0.5"/>
    
    <!-- 3D Cube Structure -->
    <!-- Left face -->
    <path d="M-22,10 L0,22 L0,40 L-22,28 Z" fill="#0284c7"/>
    <!-- Right face -->
    <path d="M0,22 L22,10 L22,28 L0,40 Z" fill="#0369a1"/>
    <!-- Top face -->
    <path d="M0,4 L22,10 L0,22 L-22,10 Z" fill="url(#blueObjGrad)"/>
    
    <!-- Distinctive Pattern on Blue Cube (Stripes) -->
    <path d="M-12,14 L0,20 L0,24 L-12,18 Z" fill="#e0f2fe" opacity="0.4"/>
    <path d="M4,10 L14,15 L14,19 L4,14 Z" fill="#e0f2fe" opacity="0.4"/>
  </g>

  <!-- Object 2: Pink/Coral Cylinder (Right Side) -->
  <g transform="translate(165, 125)" filter="url(#shadow)">
    <!-- Base shadow cast -->
    <ellipse cx="0" cy="40" rx="22" ry="8" fill="#000000" opacity="0.5"/>

    <!-- Cylinder Body -->
    <path d="M-20,10 L-20,35 C-20,42 20,42 20,35 L20,10 Z" fill="#be123c"/>
    <!-- Cylinder Side Shading -->
    <path d="M0,10 L0,35 C12,35 20,30 20,35 L20,10 Z" fill="#9f1239" opacity="0.4"/>
    <!-- Cylinder Top Face (Ellipse) -->
    <ellipse cx="0" cy="10" rx="20" ry="8" fill="url(#pinkObjGrad)"/>
    
    <!-- Distinctive Pattern on Cylinder (Dots/Circles ring) -->
    <circle cx="-8" cy="22" r="3" fill="#ffe4e6" opacity="0.7"/>
    <circle cx="0" cy="25" r="3" fill="#ffe4e6" opacity="0.7"/>
    <circle cx="8" cy="22" r="3" fill="#ffe4e6" opacity="0.7"/>
  </g>

  <!-- ACTION-PACKED ELEMENT: MAGNIFYING GLASS ANALYZING THE DIFFERENCE -->
  <g transform="translate(120, 85)" filter="url(#shadow)">
    <!-- Magnifier Handle -->
    <path d="M12,12 L35,35 C38,38 38,43 35,46 C32,49 27,49 24,46 L1,23 Z" fill="#475569"/>
    <!-- Handle metallic highlight -->
    <path d="M15,15 L32,32 C33,33 34,35 32,37 C31,38 29,38 28,37 L11,20 Z" fill="#64748b" opacity="0.5"/>
    <circle cx="30" cy="41" r="2.5" fill="#94a3b8"/>

    <!-- Glass Rim (Outer) -->
    <circle cx="0" cy="0" r="32" fill="#334155"/>
    <!-- Glass Rim (Inner Gold/Amber accent to match App palette) -->
    <circle cx="0" cy="0" r="29" fill="#f59e0b"/>
    
    <!-- Lens Glass Background & Highlights -->
    <circle cx="0" cy="0" r="26" fill="url(#lensGrad)"/>
    
    <!-- Magnified comparison effect (Sparkles & Analysis Energy) -->
    <path d="M-10,-5 L-5,-10 L0,-5 L-5,0 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="8" cy="8" r="2" fill="#38bdf8" opacity="0.8"/>
    
    <!-- Subtle Crosshair/Focus within lens -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  </g>

  <!-- COMPARISON ARCS & DYNAMIC ENERGY LINES (Action indicators) -->
  <!-- Floating comparison indicators -->
  <path d="M95,75 Q120,55 145,75" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" stroke-dasharray="4,4"/>
  
  <!-- Sparkles highlighting the observation -->
  <g transform="translate(120, 45)" opacity="0.9">
    <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(60, 95)" opacity="0.6">
    <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(180, 100)" opacity="0.6">
    <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z" fill="#fb7185"/>
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="40" cy="160" r="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="200" cy="150" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="100" cy="200" r="2" fill="#fb7185" opacity="0.4"/>
  <circle cx="150" cy="190" r="1" fill="#38bdf8" opacity="0.6"/>

</svg>