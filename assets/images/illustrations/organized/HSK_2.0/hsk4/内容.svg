<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing magical aura gradient -->
    <radialGradient id="magicGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Pages Gradient -->
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Floating Content Stream Gradients -->
    <linearGradient id="stream1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="stream2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow for 3D depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background magical glow representing vibrant 'content' -->
  <circle cx="120" cy="115" r="90" fill="url(#magicGlow)" />

  <!-- Background Environment Details (Wooden desk surface & cozy vignette) -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.6" />
  <ellipse cx="120" cy="192" rx="95" ry="12" fill="#020617" opacity="0.4" />

  <!-- ACTION-PACKED MAIN SCENE: The Magical Pop-up Book of "Contents" -->
  <g filter="url(#dropShadow)">
    
    <!-- Open Book Base (Back Cover & Pages) -->
    <!-- Right Page Shadow/Base -->
    <path d="M 120 145 C 150 140, 185 145, 205 130 L 205 175 C 185 190, 150 185, 120 190 Z" fill="#cbd5e1" />
    <!-- Left Page Shadow/Base -->
    <path d="M 120 145 C 90 140, 55 145, 35 130 L 35 175 C 55 190, 90 185, 120 190 Z" fill="#cbd5e1" />

    <!-- Open Book Hard Cover (Indigo) -->
    <path d="M 30 130 C 60 145, 100 148, 120 152 C 140 148, 180 145, 210 130 L 210 182 C 180 197, 140 200, 120 204 C 100 200, 60 197, 30 182 Z" fill="url(#bookCover)" />

    <!-- Open Pages (White/Cream Layer) -->
    <!-- Left Page -->
    <path d="M 35 125 C 65 140, 100 143, 120 147 L 120 197 C 100 193, 65 190, 35 175 Z" fill="url(#pageGrad)" />
    <!-- Right Page -->
    <path d="M 205 125 C 175 140, 140 143, 120 147 L 120 197 C 140 193, 175 190, 205 175 Z" fill="url(#pageGrad)" />

    <!-- Center Binding Seam -->
    <line x1="120" y1="147" x2="120" y2="197" stroke="#cbd5e1" stroke-width="2" />

    <!-- Lines of text (representing book content implicitly) on pages -->
    <!-- Left page text lines -->
    <line x1="48" y1="145" x2="88" y2="152" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="158" x2="98" y2="165" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="171" x2="78" y2="178" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Right page text lines -->
    <line x1="132" y1="145" x2="182" y2="152" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="132" y1="158" x2="162" y2="165" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="132" y1="171" x2="192" y2="178" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

  </g>

  <!-- VIVID 3D CONTENT BURSTING OUT (The Core Representation of 'Nèiróng' / Content) -->
  <!-- Floating magical streams and iconic rich content elements emerging from the book -->
  <g filter="url(#glow)">
    
    <!-- Central Energetic Swirl Beam -->
    <path d="M 120 147 C 115 110, 135 90, 120 60 C 110 40, 90 45, 95 30" fill="none" stroke="url(#stream1)" stroke-width="6" stroke-linecap="round" />
    <path d="M 120 147 C 125 110, 105 90, 120 60 C 130 40, 150 45, 145 30" fill="none" stroke="url(#stream2)" stroke-width="5" stroke-linecap="round" />

    <!-- Floating Multimedia Content Elements (Visualizing 'Content' as rich media, charts, images, video play icons) -->
    
    <!-- 1. Floating Picture/Photo Card (Top Left) -->
    <g transform="translate(65, 55) rotate(-12)">
      <rect x="0" y="0" width="38" height="30" rx="4" fill="#ffffff" filter="url(#dropShadow)" />
      <rect x="4" y="4" width="30" height="18" rx="2" fill="#38bdf8" />
      <!-- Tiny landscape inside photo -->
      <path d="M 4 18 L 14 10 L 22 17 L 28 12 L 34 22 L 4 22 Z" fill="#10b981" />
      <circle cx="26" cy="9" r="3" fill="#fbbf24" />
      <circle cx="8" cy="26" r="2" fill="#cbd5e1" />
      <circle cx="15" cy="26" r="2" fill="#cbd5e1" />
    </g>

    <!-- 2. Floating Video/Play Media Card (Top Right) -->
    <g transform="translate(138, 45) rotate(15)">
      <rect x="0" y="0" width="42" height="32" rx="4" fill="#ffffff" filter="url(#dropShadow)" />
      <rect x="4" y="4" width="34" height="20" rx="2" fill="#0f172a" />
      <!-- Play button -->
      <polygon points="17,9 17,19 26,14" fill="#f43f5e" />
      <!-- Progress bar -->
      <rect x="6" y="27" width="30" height="2.5" rx="1" fill="#e2e8f0" />
      <rect x="6" y="27" width="18" height="2.5" rx="1" fill="#38bdf8" />
    </g>

    <!-- 3. Floating Analytics/Data Chart Card (Mid Left) -->
    <g transform="translate(42, 100) rotate(-6)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="32" height="38" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Bar chart graphics -->
      <rect x="6" y="20" width="4" height="12" rx="1" fill="#38bdf8" />
      <rect x="14" y="12" width="4" height="20" rx="1" fill="#f59e0b" />
      <rect x="22" y="8" width="4" height="24" rx="1" fill="#10b981" />
      <line x1="4" y1="34" x2="28" y2="34" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- 4. Floating Audio Soundwave Card (Mid Right) -->
    <g transform="translate(162, 95) rotate(8)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="36" height="30" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Sound bars -->
      <rect x="6" y="11" width="3" height="8" rx="1.5" fill="#fb923c" />
      <rect x="11" y="7" width="3" height="16" rx="1.5" fill="#f43f5e" />
      <rect x="16" y="4" width="3" height="22" rx="1.5" fill="#38bdf8" />
      <rect x="21" y="9" width="3" height="12" rx="1.5" fill="#10b981" />
      <rect x="26" y="12" width="3" height="6" rx="1.5" fill="#fbbf24" />
    </g>

  </g>

  <!-- Sparkles, Magic Dust & Atmosphere (Action / Dynamic Energy) -->
  <g fill="#fbbf24">
    <!-- Star sparkles -->
    <path d="M 100 25 L 102 30 L 107 32 L 102 34 L 100 39 L 98 34 L 93 32 L 98 30 Z" transform="scale(0.8) translate(30, 10)" />
    <path d="M 150 70 L 151.5 73 L 154.5 74.5 L 151.5 76 L 150 79 L 148.5 76 L 145.5 74.5 L 148.5 73 Z" fill="#38bdf8" />
    <path d="M 75 80 L 76.2 82.5 L 78.7 83.7 L 76.2 85 L 75 87.5 L 73.8 85 L 71.3 83.7 L 73.8 82.5 Z" fill="#f43f5e" />
    
    <!-- Glowing dots -->
    <circle cx="110" cy="55" r="2.5" fill="#f59e0b" />
    <circle cx="135" cy="85" r="2" fill="#10b981" />
    <circle cx="85" cy="45" r="1.5" fill="#38bdf8" />
    <circle cx="155" cy="35" r="2" fill="#fb923c" />
    <circle cx="125" cy="25" r="1.5" fill="#ffffff" />
  </g>

  <!-- Foreground Atmospheric Lighting/Vignette -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15" stroke-dasharray="6 6" />
</svg>