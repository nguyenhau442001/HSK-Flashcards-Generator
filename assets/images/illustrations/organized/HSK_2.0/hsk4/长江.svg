<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- River Water Gradient (Majestic Changjiang) -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Mountain Far Gradient -->
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Mountain Near Gradient (Karst Peaks) -->
    <linearGradient id="mountainNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Sun/Moon Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Sailboat Hull Gradient -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    
    <!-- Sail Gradient -->
    <linearGradient id="sailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Bridge Truss Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Atmospheric Glow & Stars -->
  <circle cx="180" cy="60" r="40" fill="url(#sunGlow)" />
  <circle cx="180" cy="60" r="14" fill="#fef08a" />
  <circle cx="40" cy="40" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="70" cy="25" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="110" cy="35" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="15" cy="75" r="1" fill="#ffffff" opacity="0.7" />

  <!-- Far Mountains (Three Gorges backdrop) -->
  <path d="M-10 130 L30 80 L75 110 L120 70 L170 100 L225 65 L250 140 Z" fill="url(#mountainFar)" />

  <!-- Near Karst Mountains (Iconic Yangtze scenery) -->
  <path d="M-20 140 Q 20 80 50 140 Q 80 70 120 140 Q 160 50 200 140 Q 230 90 260 140 Z" fill="url(#mountainNear)" />
  
  <!-- Mist / Clouds winding through mountains -->
  <path d="M0 120 Q 30 110 60 125 T 130 115 T 200 130 T 250 120 L 250 140 L 0 140 Z" fill="#94a3b8" opacity="0.3" />

  <!-- The Majestic Changjiang River (Winding from background to foreground) -->
  <path d="M70 135 C 80 150, 110 170, 130 240 L 240 240 L 240 135 C 200 135, 140 130, 120 135 Z" fill="url(#riverGrad)" />
  <path d="M0 135 C 30 135, 70 150, 80 240 L 0 240 Z" fill="url(#riverGrad)" />

  <!-- River Flow Lines (Action & Dynamism) -->
  <path d="M85 160 Q 110 180 135 230" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M100 150 Q 125 175 155 220" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round" />
  <path d="M30 165 Q 50 185 65 235" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" />

  <!-- Iconic Modern Suspension/Truss Bridge crossing the Yangtze -->
  <g id="bridge">
    <!-- Bridge Piers -->
    <rect x="75" y="110" width="8" height="35" fill="#64748b" />
    <rect x="165" y="105" width="8" height="40" fill="#64748b" />
    
    <!-- Bridge Deck -->
    <rect x="30" y="130" width="180" height="4" fill="#334155" />
    <rect x="30" y="134" width="180" height="2" fill="#0f172a" />

    <!-- Red Truss Structure -->
    <path d="M 30 130 L 79 110 L 128 130 L 169 105 L 210 130" stroke="url(#bridgeGrad)" stroke-width="3" fill="none" stroke-linejoin="round" />
    <path d="M 79 110 L 79 130" stroke="url(#bridgeGrad)" stroke-width="2" />
    <path d="M 169 105 L 169 130" stroke="url(#bridgeGrad)" stroke-width="2" />
    
    <!-- Diagonal cables -->
    <line x1="79" y1="110" x2="50" y2="130" stroke="#f87171" stroke-width="1.5" />
    <line x1="79" y1="110" x2="105" y2="130" stroke="#f87171" stroke-width="1.5" />
    <line x1="169" y1="105" x2="140" y2="130" stroke="#f87171" stroke-width="1.5" />
    <line x1="169" y1="105" x2="195" y2="130" stroke="#f87171" stroke-width="1.5" />
  </g>

  <!-- Traditional Chinese Junk Boat (Sailing on the Yangtze) -->
  <g id="boat" transform="translate(100, 160)">
    <!-- Reflection -->
    <ellipse cx="25" cy="22" rx="22" ry="4" fill="#0284c7" opacity="0.4" />

    <!-- Hull -->
    <path d="M 5 18 C 10 26, 35 26, 42 18 C 45 14, 45 12, 42 12 L 8 12 C 5 12, 3 14, 5 18 Z" fill="url(#hullGrad)" />
    <!-- Hull rim -->
    <rect x="6" y="11" width="38" height="2" rx="1" fill="#c2410c" />

    <!-- Mast -->
    <rect x="22" y="-5" width="2.5" height="18" fill="#78350f" />

    <!-- Battened Sail (Traditional design) -->
    <path d="M 24 -3 C 24 -3, 38 2, 38 12 L 10 12 C 10 6, 18 0, 24 -3 Z" fill="url(#sailGrad)" />
    
    <!-- Sail Battens -->
    <line x1="14" y1="2" x2="34" y2="2" stroke="#b45309" stroke-width="1" opacity="0.6" />
    <line x1="12" y1="7" x2="36" y2="7" stroke="#b45309" stroke-width="1" opacity="0.6" />

    <!-- Small flag on top -->
    <path d="M 24.5 -5 L 30 -3 L 24.5 -1 Z" fill="#ef4444" />
  </g>

  <!-- Foreground Vegetation (Framing the scene - bamboo/reed elements) -->
  <g id="foreground-reeds" transform="translate(0, 200)">
    <!-- Left Reeds -->
    <path d="M 5 40 Q 8 10 2 0" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 12 40 Q 18 15 15 -5" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 20 40 Q 22 20 28 5" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" />
    <ellipse cx="2" cy="-2" rx="2" ry="5" fill="#f59e0b" />
    <ellipse cx="15" cy="-7" rx="2" ry="5" fill="#f59e0b" />

    <!-- Right Reeds -->
    <path d="M 230 40 Q 225 15 235 -2" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 220 40 Q 215 20 218 5" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round" />
    <ellipse cx="235" cy="-4" rx="2" ry="5" fill="#f59e0b" />
  </g>

  <!-- Ripples in foreground water -->
  <path d="M 55 215 Q 70 212 85 215" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M 62 218 Q 70 217 78 218" stroke="#38bdf8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6" />

  <path d="M 160 200 Q 175 197 190 200" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M 170 203 Q 178 202 184 203" stroke="#38bdf8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Birds in the sky (V-formation) -->
  <path d="M 110 50 Q 115 45 120 50 Q 125 45 130 50" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7" />
  <path d="M 125 58 Q 128 54 132 58 Q 136 54 140 58" stroke="#cbd5e1" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7" />

  <!-- Border Frame Accent (Subtle rounding & edge lighting) -->
  <rect x="0.5" y="0.5" width="239" height="239" rx="23.5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" />
</svg>