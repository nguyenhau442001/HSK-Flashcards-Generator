<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Scooter Gradient -->
    <linearGradient id="scooterBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Helmet Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Headlight Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Night City Elements in Background -->
  <g opacity="0.3">
    <!-- Distant buildings -->
    <rect x="20" y="90" width="25" height="110" fill="#1e293b" rx="2"/>
    <rect x="50" y="70" width="30" height="130" fill="#0f172a" rx="2"/>
    <rect x="175" y="80" width="35" height="120" fill="#1e293b" rx="2"/>
    <rect x="215" y="100" width="20" height="100" fill="#0f172a" rx="2"/>
    
    <!-- City Windows (Tiny dots) -->
    <rect x="26" y="100" width="4" height="6" fill="#334155"/>
    <rect x="34" y="100" width="4" height="6" fill="#f59e0b" opacity="0.6"/>
    <rect x="26" y="115" width="4" height="6" fill="#334155"/>
    <rect x="58" y="80" width="5" height="8" fill="#f59e0b" opacity="0.5"/>
    <rect x="68" y="80" width="5" height="8" fill="#334155"/>
    <rect x="58" y="95" width="5" height="8" fill="#334155"/>
    <rect x="185" y="95" width="5" height="8" fill="#38bdf8" opacity="0.5"/>
    <rect x="195" y="110" width="5" height="8" fill="#334155"/>
  </g>

  <!-- Ambient Street Light Glow -->
  <circle cx="210" cy="40" r="60" fill="#fbbf24" opacity="0.08" filter="url(#softGlow)" />
  <path d="M210,10 L210,180" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <path d="M210,10 L190,25" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <circle cx="190" cy="27" r="4" fill="#fbbf24" />

  <!-- Large Safety Shield Aura (Symbolizing 'An Quan') -->
  <path d="M120,40 C155,40 175,55 175,55 C175,100 160,150 120,175 C80,150 65,100 65,55 C65,55 85,40 120,40 Z" 
        fill="url(#shieldGlow)" stroke="url(#shieldBorder)" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="6,4" />

  <!-- Road / Street Floor -->
  <path d="M0,185 C80,175 160,175 240,185 L240,240 L0,240 Z" fill="#0b0f19" />
  <!-- Road Dashes -->
  <path d="M20,200 L60,200 M90,200 L130,200 M160,200 L200,200" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="10,10" />

  <!-- Electric Scooter & Character Group -->
  <g transform="translate(15, 20)">
    
    <!-- Headlight Beam (Dynamic light) -->
    <path d="M88,133 L180,165 L180,110 Z" fill="url(#lightBeam)" />

    <!-- Scooter Back Wheel -->
    <circle cx="50" cy="165" r="16" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <circle cx="50" cy="165" r="6" fill="#64748b" />

    <!-- Scooter Front Wheel -->
    <circle cx="115" cy="165" r="16" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <circle cx="115" cy="165" r="6" fill="#64748b" />

    <!-- Scooter Deck & Chassis -->
    <path d="M45,158 L110,158 C118,158 122,152 118,148 L90,135 C85,133 80,135 80,140 Z" fill="url(#scooterBody)" />
    <path d="M50,165 L105,165" stroke="#d97706" stroke-width="3" stroke-linecap="round" />

    <!-- Scooter Stem & Handlebars -->
    <path d="M95,140 L105,95" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <path d="M95,95 L112,92" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
    <circle cx="113" cy="92" r="4" fill="#38bdf8" />
    <!-- Scooter Headlight -->
    <circle cx="98" cy="130" r="5" fill="#fef08a" filter="url(#softGlow)" />

    <!-- Character Body (Leaning forward confidently, securely) -->
    <!-- Back / Torso -->
    <path d="M75,135 C70,120 75,100 88,90 C95,85 102,90 98,100 C92,115 90,130 85,140 Z" fill="#ec4899" />
    <!-- Jacket collar details -->
    <path d="M85,93 L92,102" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" />

    <!-- Backpack (Securely strapped) -->
    <path d="M68,95 C62,95 58,105 60,118 C62,125 70,128 73,120 C76,110 75,98 68,95 Z" fill="#10b981" />
    <path d="M72,98 L80,105" stroke="#047857" stroke-width="2" />

    <!-- Legs (Riding posture) -->
    <!-- Back Leg -->
    <path d="M70,135 L55,148 L65,158" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Leg -->
    <path d="M85,138 L95,145 L80,158" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Arms (Holding handlebars securely) -->
    <path d="M90,95 C100,95 105,100 108,108" stroke="#ec4899" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="109" cy="110" r="4" fill="#ffedd5" />

    <!-- Head & Expressive Safe/Happy Face -->
    <g transform="translate(85, 75)">
      <!-- Neck -->
      <rect x="-3" y="10" width="8" height="8" fill="#ffedd5" rx="2" />

      <!-- Head Base -->
      <circle cx="2" cy="0" r="16" fill="#ffedd5" />

      <!-- Hair Tufts -->
      <path d="M -12,-5 C -15,-12 -5,-16 2,-14 C 8,-16 16,-10 12,-2" fill="#1e293b" />

      <!-- Safety Helmet (Bright, protective) -->
      <path d="M -16,-2 C -16,-14 -4,-20 8,-16 C 16,-13 18,-4 18,2 L -16,2 Z" fill="url(#helmetGrad)" />
      <!-- Helmet strap -->
      <path d="M -12,2 C -10,10 -2,12 2,10" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" />
      <circle cx="-2" cy="7" r="2" fill="#fbbf24" /> <!-- Helmet buckle -->

      <!-- Confident, Reassured Facial Expression -->
      <!-- Eyes: Happy squint / arc of assurance -->
      <path d="M -3,-2 C -1,-4 3,-4 5,-2" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
      
      <!-- Rosy Cheeks -->
      <circle cx="1" cy="4" r="3" fill="#fda4af" opacity="0.6" />

      <!-- Smile: Calm, confident, safe -->
      <path d="M -1,5 C 1,8 5,8 7,5" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

  </g>

  <!-- Foreground Protective Sparkles & Motion Cues (Subtle reinforcement of safety/protection) -->
  <g fill="#34d399">
    <circle cx="185" cy="130" r="2.5" opacity="0.8" />
    <path d="M190,115 L193,118 L190,121 L187,118 Z" opacity="0.7" />
    <circle cx="50" cy="70" r="2" opacity="0.5" />
    <path d="M35,130 L37,132 L35,134 L33,132 Z" opacity="0.6" />
    
    <!-- Floating Shield Particle near head -->
    <path d="M 125,55 Q 130,50 135,55 Q 135,63 125,68 Q 115,63 115,55 Q 120,50 125,55 Z" 
          fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
  </g>

</svg>