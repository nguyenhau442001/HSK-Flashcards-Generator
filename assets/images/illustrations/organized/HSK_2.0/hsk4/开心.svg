<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Golden Glow for Happiness -->
    <radialGradient id="happyGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Hoodie Gradient -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Sofa Gradient -->
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Confetti Gradients -->
    <linearGradient id="cGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Warm Glow -->
  <circle cx="120" cy="120" r="120" fill="url(#happyGlow)"/>

  <!-- Background Interior Elements (Window & Starry/Bokeh Lights) -->
  <g opacity="0.6">
    <!-- Window Frame -->
    <rect x="150" y="30" width="60" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <line x1="180" y1="30" x2="180" y2="110" stroke="#475569" stroke-width="2"/>
    <line x1="150" y1="70" x2="210" y2="70" stroke="#475569" stroke-width="2"/>
    <!-- Bokeh circles outside window -->
    <circle cx="165" cy="45" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="195" cy="95" r="6" fill="#38bdf8" opacity="0.8"/>
    <circle cx="190" cy="55" r="3" fill="#f43f5e" opacity="0.8"/>
  </g>

  <!-- Floating Confetti & Sparkles (Joyful Atmosphere) -->
  <g filter="url(#softShadow)">
    <!-- Stars & Streamers -->
    <path d="M40 70 L43 76 L50 77 L45 82 L46 89 L40 85 L34 89 L35 82 L30 77 L37 76 Z" fill="url(#cYellow)" transform="scale(0.8) translate(10, 10)"/>
    <path d="M190 140 L192 144 L197 145 L193 149 L194 154 L190 151 L186 154 L187 149 L183 145 L188 144 Z" fill="url(#cGreen)" transform="scale(0.7) translate(80, 20)"/>
    
    <circle cx="55" cy="130" r="4" fill="url(#cOrange)"/>
    <circle cx="30" cy="110" r="3" fill="url(#cYellow)"/>
    <circle cx="185" cy="180" r="5" fill="url(#cGreen)"/>
    <circle cx="210" cy="120" r="3" fill="#f43f5e"/>
    
    <!-- Confetti Ribbons -->
    <path d="M 25 50 Q 30 40, 35 55 T 45 60" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 205 60 Q 215 70, 200 85" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M 100 25 Q 110 35, 120 25" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Sofa / Furniture Background -->
  <path d="M 40 160 Q 120 140 200 160 L 210 210 Q 120 220 30 210 Z" fill="url(#sofaGrad)" filter="url(#softShadow)"/>
  <path d="M 45 160 Q 120 145 195 160 L 200 175 Q 120 160 40 175 Z" fill="#f43f5e" opacity="0.6"/>

  <!-- Character: Jumping / Extremely Happy -->
  <g id="character" filter="url(#softShadow)">
    
    <!-- Shadow under character -->
    <ellipse cx="120" cy="222" rx="25" ry="6" fill="#020617" opacity="0.5"/>

    <!-- Swinging Arms (Joyful Posture) -->
    <!-- Left Arm (raised up high) -->
    <path d="M 95 110 Q 70 85 55 95" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <!-- Left Hand -->
    <circle cx="52" cy="95" r="7" fill="#fde047"/>

    <!-- Right Arm (raised up high waving) -->
    <path d="M 145 110 Q 170 85 185 95" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Hand -->
    <circle cx="188" cy="95" r="7" fill="#fde047"/>

    <!-- Body / Hoodie (Mid-air bounce) -->
    <path d="M 95 105 Q 120 100 145 105 L 155 165 Q 120 175 85 165 Z" fill="url(#hoodieGrad)"/>
    <!-- Hoodie Strings -->
    <path d="M 112 115 Q 112 130 108 140" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 128 115 Q 128 130 132 140" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Legs (Dynamic bent jumping pose) -->
    <!-- Left Leg -->
    <path d="M 100 160 Q 80 185 95 200" fill="none" stroke="#f43f5e" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="98" cy="204" rx="7" ry="5" fill="#334155"/>
    
    <!-- Right Leg -->
    <path d="M 140 160 Q 160 185 145 200" fill="none" stroke="#f43f5e" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="142" cy="204" rx="7" ry="5" fill="#334155"/>

    <!-- Neck -->
    <rect x="110" y="95" width="20" height="20" rx="6" fill="#fde047"/>

    <!-- Head & Hair Group -->
    <g transform="translate(120, 85)">
      <!-- Head Base -->
      <circle cx="0" cy="0" r="32" fill="#fde047"/>
      
      <!-- Cheeks (Blushing with happiness) -->
      <circle cx="-18" cy="6" r="6" fill="#f43f5e" opacity="0.4"/>
      <circle cx="18" cy="6" r="6" fill="#f43f5e" opacity="0.4"/>

      <!-- Joyful Closed Eyes (Happy Arches ^_^) -->
      <path d="M -16 -4 Q -11 -11 -6 -4" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 6 -4 Q 11 -11 16 -4" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Wide Open Laughing Mouth -->
      <path d="M -10 6 Q 0 18 10 6 Z" fill="#991b1b"/>
      <!-- Tongue -->
      <path d="M -5 12 Q 0 9 5 12 Q 5 16 0 16 Q -5 16 -5 12 Z" fill="#f43f5e"/>

      <!-- Hair Style (Stylized modern tufts) -->
      <path d="M -32 -10 Q -25 -35 0 -34 Q 25 -35 32 -10 Q 35 2 25 -5 Q 15 -25 0 -22 Q -15 -25 -25 -5 Q -35 2 -32 -10 Z" fill="url(#hairGrad)"/>
      <!-- Playful hair strand -->
      <path d="M 18 -28 Q 28 -38 24 -42 Q 32 -34 22 -20 Z" fill="#334155"/>
    </g>

  </g>

  <!-- Foreground Joy Elements (Floating musical notes / sparkles) -->
  <g fill="#38bdf8" filter="url(#softShadow)">
    <path d="M 65 150 Q 68 145 72 147 L 72 158 Q 70 160 67 158 Q 64 156 65 150 Z"/>
    <circle cx="63" cy="159" r="3"/>
    <circle cx="70" cy="157" r="3"/>
    <path d="M 63 152 L 72 148"/>
  </g>

  <g fill="#f43f5e" filter="url(#softShadow)">
    <path d="M 175 140 Q 178 135 182 137 L 182 148 Q 180 150 177 148 Q 174 146 175 140 Z"/>
    <circle cx="173" cy="149" r="3"/>
    <circle cx="180" cy="147" r="3"/>
    <path d="M 173 142 L 182 138"/>
  </g>

</svg>