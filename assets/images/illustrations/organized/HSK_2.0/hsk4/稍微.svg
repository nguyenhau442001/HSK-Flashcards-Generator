<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Teapot/Action -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steam-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop/Indicator Gradient for 'Just a little' -->
    <linearGradient id="drop-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Wood Countertop Pattern/Gradient -->
    <linearGradient id="counter-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Tea Liquid Gradient -->
    <linearGradient id="tea-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Ambient Glow -->
  <circle cx="120" cy="110" r="70" fill="url(#amber-glow)" />

  <!-- Background Wall Details (Shelves & Plant Silhouette) -->
  <path d="M40 70 L200 70" stroke="#334155" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <!-- Tiny plant on shelf -->
  <path d="M55 70 L55 58 C55 55 58 52 61 52 L67 52 C70 52 73 55 73 58 L73 70 Z" fill="#475569" />
  <path d="M64 52 C60 40 65 35 60 30" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M64 52 C70 42 68 38 74 32" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Wooden Countertop -->
  <rect x="20" y="170" width="200" height="40" rx="6" fill="url(#counter-grad)" />
  <rect x="20" y="170" width="200" height="6" rx="3" fill="#475569" opacity="0.6" />

  <!-- Atmospheric Steam (Floating up from the pouring action) -->
  <path d="M110 100 C105 85 115 75 110 60" stroke="url(#steam-grad)" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M125 105 C130 90 120 80 125 65" stroke="url(#steam-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Teapot (Right side, tilted gracefully) -->
  <g transform="translate(45, 20)">
    <!-- Teapot Body -->
    <path d="M100 95 C100 80 115 75 125 75 C135 75 150 80 150 95 C150 110 135 120 125 120 C115 120 100 110 100 95 Z" fill="#fb923c" />
    <!-- Teapot Lid -->
    <ellipse cx="125" cy="74" rx="14" ry="4" fill="#f97316" />
    <circle cx="125" cy="68" r="3" fill="#fbbf24" />
    <!-- Teapot Handle -->
    <path d="M147 85 C165 85 165 110 145 115" stroke="#f97316" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Teapot Spout -->
    <path d="M102 90 L85 80" stroke="#f97316" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Highlight on Teapot -->
    <path d="M110 88 C112 80 120 78 125 78" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Pouring Stream (Curving delicately, emphasizing "a little bit") -->
  <path d="M127 103 C115 115 105 125 98 140" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Teacup (Center-Left on Counter) -->
  <g transform="translate(75, 125)">
    <!-- Saucer -->
    <ellipse cx="25" cy="48" rx="26" ry="6" fill="#64748b" />
    <ellipse cx="25" cy="47" rx="22" ry="4" fill="#94a3b8" />

    <!-- Cup Body -->
    <path d="M12 20 L15 45 C15 48 20 50 25 50 C30 50 35 48 35 45 L38 20 Z" fill="#f8fafc" />
    <!-- Cup Rim -->
    <ellipse cx="25" cy="20" rx="13" ry="4" fill="#e2e8f0" />
    <!-- Tea Inside (Filled ONLY "a little bit" - low level, matching "slightly/a bit") -->
    <ellipse cx="25" cy="36" rx="11" ry="3" fill="url(#tea-grad)" />

    <!-- Cup Handle -->
    <path d="M36 24 C44 24 44 38 36 40" stroke="#cbd5e1" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Cute subtle measurement/visual cue for "a little bit" (Floating tiny drop hovering just above the rim) -->
    <path d="M25 8 C25 8 22 12 22 14 C22 15.6 23.4 17 25 17 C26.6 17 28 15.6 28 14 C28 12 25 8 25 8 Z" fill="url(#drop-grad)" opacity="0.9" />
  </g>

  <!-- Accent Props for Context (Small pastry/cookie next to the cup) -->
  <g transform="translate(145, 155)">
    <ellipse cx="15" cy="15" rx="14" ry="9" fill="#d97706" />
    <ellipse cx="15" cy="13" rx="13" ry="8" fill="#fbbf24" />
    <!-- Cookie details -->
    <circle cx="11" cy="12" r="1.5" fill="#92400e" />
    <circle cx="18" cy="14" r="1.5" fill="#92400e" />
    <circle cx="15" cy="10" r="1" fill="#92400e" />
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles (Action/Precision vibe) -->
  <circle cx="95" cy="115" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="102" cy="125" r="1" fill="#38bdf8" opacity="0.9" />
  <circle cx="85" cy="100" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="138" cy="135" r="1.5" fill="#fbbf24" opacity="0.7" />

</svg>