<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Window Glow Gradient -->
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Snowfall Particle Gradients/Styles -->
    <linearGradient id="snowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Character Scarf Gradient -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Coat Gradient -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- DISTANT ENVIRONMENT & STREET -->
  <!-- Distant Buildings / Skyline -->
  <path d="M 0 160 L 0 110 L 30 95 L 30 160 Z" fill="#1e293b" opacity="0.7"/>
  <path d="M 25 160 L 25 80 L 65 65 L 65 160 Z" fill="#0f172a" opacity="0.9"/>
  <path d="M 180 160 L 180 90 L 220 100 L 220 160 Z" fill="#1e293b" opacity="0.8"/>
  <path d="M 210 160 L 210 70 L 240 85 L 240 160 Z" fill="#0f172a" opacity="0.7"/>

  <!-- Cozy Cafe / Building on Right with Warm Light (The "However" Contrast) -->
  <path d="M 140 160 L 140 90 Q 185 75 240 90 L 240 160 Z" fill="#334155"/>
  <!-- Glowing Window -->
  <rect x="165" y="105" width="50" height="40" rx="4" fill="#78350f"/>
  <rect x="170" y="110" width="18" height="30" rx="2" fill="url(#windowGlow)"/>
  <rect x="193" y="110" width="18" height="30" rx="2" fill="url(#windowGlow)"/>
  <ellipse cx="190" cy="125" rx="35" ry="25" fill="url(#windowGlow)" opacity="0.3"/>

  <!-- Street Ground / Pavement -->
  <path d="M 0 160 Q 120 150 240 160 L 240 240 L 0 240 Z" fill="#090d16"/>
  <!-- Snow Layer on Ground -->
  <path d="M 0 162 Q 60 157 120 162 T 240 162 L 240 172 Q 180 165 120 172 T 0 172 Z" fill="#e2e8f0" opacity="0.9"/>
  <path d="M 0 167 Q 70 172 140 166 T 240 169 L 240 240 L 0 240 Z" fill="#94a3b8" opacity="0.4"/>

  <!-- Street Lamp Casting Warm Light Pool -->
  <path d="M 40 165 L 44 165 L 43 90 L 46 85 L 38 85 L 41 90 Z" fill="#475569"/>
  <path d="M 32 85 L 52 85 L 46 75 L 38 75 Z" fill="#334155"/>
  <circle cx="42" cy="77" r="5" fill="#fde047"/>
  <ellipse cx="42" cy="168" rx="25" ry="8" fill="#f59e0b" opacity="0.25"/>

  <!-- FOREGROUND: ACTION-PACKED SUBJECTS (Cold weather vs Warm activity/fun) -->

  <!-- Cute Snowman on the Left (Emphasizing the Cold) -->
  <g transform="translate(75, 130)">
    <!-- Snowman Body Balls -->
    <circle cx="0" cy="22" r="14" fill="#f1f5f9"/>
    <circle cx="0" cy="6" r="11" fill="#f8fafc"/>
    <circle cx="0" cy="-7" r="8" fill="#ffffff"/>
    <!-- Coal Eyes -->
    <circle cx="-2" cy="-8" r="1" fill="#0f172a"/>
    <circle cx="2" cy="-8" r="1" fill="#0f172a"/>
    <!-- Carrot Nose -->
    <path d="M 0 -6 L 5 -5 L 0 -4 Z" fill="#f97316"/>
    <!-- Tiny Scarf -->
    <path d="M -5 -2 Q 0 1 5 -2 L 4 1 Q 0 3 -4 1 Z" fill="#38bdf8"/>
    <!-- Stick Arms -->
    <path d="M -11 3 L -18 -1" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 11 3 L 18 -1" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- MAIN CHARACTER: Joyful Runner/Walker defying the cold (Action pose) -->
  <g transform="translate(115, 120)">
    <!-- Back Leg (stepping forward) -->
    <path d="M -2 30 Q -5 45 3 48" stroke="#0284c7" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Back Boot -->
    <path d="M 0 46 L 8 46 L 8 51 L -2 51 Z" fill="#334155" rx="2"/>

    <!-- Body & Coat -->
    <path d="M -12 8 Q -16 25 -8 34 L 10 32 Q 14 20 8 8 Z" fill="url(#coatGrad)"/>
    <!-- Coat hem waving with action -->
    <path d="M -9 33 Q -2 39 8 32 L 6 36 Q -2 41 -10 36 Z" fill="#0369a1"/>

    <!-- Front Leg (action stride) -->
    <path d="M 4 28 Q 18 36 24 45" stroke="#0284c7" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Front Boot -->
    <path d="M 21 43 L 30 46 L 27 52 L 19 49 Z" fill="#334155" rx="2"/>

    <!-- Front Arm / Holding a warm drink cup or waving happily -->
    <path d="M 8 10 L 22 18" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
    <!-- Cozy Mittens -->
    <circle cx="24" cy="19" r="4" fill="#fbbf24"/>

    <!-- Back Arm -->
    <path d="M -8 10 L -18 18" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-19" cy="19" r="4" fill="#fbbf24"/>

    <!-- Head & Face -->
    <circle cx="0" cy="-2" r="9" fill="#fde68a"/>
    <!-- Happy Rosy Cheeks -->
    <circle cx="-4" cy="1" r="2" fill="#f43f5e" opacity="0.6"/>
    <circle cx="4" cy="1" r="2" fill="#f43f5e" opacity="0.6"/>
    <!-- Happy Closed Eyes (Joyful arc) -->
    <path d="M -5 -4 Q -3 -6 -1 -4" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 1 -4 Q 3 -6 5 -4" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Smiling Mouth -->
    <path d="M -2 2 Q 0 4 2 2" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Stylish Winter Beanie / Hat -->
    <path d="M -10 -5 Q 0 -14 10 -5 Z" fill="#f43f5e"/>
    <ellipse cx="0" cy="-13" r="3.5" fill="#ffffff"/>
    <path d="M -10 -6 Q 0 -3 10 -6 L 10 -4 Q 0 -1 -10 -4 Z" fill="#fbbf24"/>

    <!-- Flowing Long Scarf (Dynamic wind effect) -->
    <path d="M -8 4 Q 0 8 8 5 Q 18 2 26 10 Q 32 15 28 20" stroke="url(#scarfGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- VIVID ATMOSPHERE: Dynamic Snowflakes & Glowing Cold Elements -->
  <!-- Falling Snowflakes (Stylized crosses and soft dots) -->
  <g fill="url(#snowGlow)">
    <!-- Large prominent snow crystals / sparkles -->
    <path d="M 30 40 L 34 40 L 32 36 L 32 44 Z M 28 42 L 36 38" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 190 50 L 194 50 L 192 46 L 192 54 Z M 188 52 L 196 48" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 100 30 L 104 30 L 102 26 L 102 34 Z M 98 32 L 106 28" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Soft glowing snow dots -->
    <circle cx="20" cy="70" r="2.5" opacity="0.8"/>
    <circle cx="65" cy="45" r="1.5" opacity="0.6"/>
    <circle cx="85" cy="85" r="3" opacity="0.9"/>
    <circle cx="130" cy="40" r="2" opacity="0.7"/>
    <circle cx="160" cy="75" r="2.5" opacity="0.85"/>
    <circle cx="215" cy="35" r="3" opacity="0.9"/>
    <circle cx="225" cy="115" r="1.5" opacity="0.5"/>
    <circle cx="15" cy="125" r="2" opacity="0.7"/>
    <circle cx="55" cy="140" r="1.5" opacity="0.6"/>
    <circle cx="105" cy="105" r="2.5" opacity="0.8"/>
    <circle cx="175" cy="95" r="1.5" opacity="0.7"/>
  </g>

  <!-- Additional Foreground Depth Elements (Snow drift on bottom left) -->
  <path d="M -10 200 Q 30 185 70 200 Q 110 215 150 200 L 150 240 L -10 240 Z" fill="#94a3b8" opacity="0.2"/>
  <path d="M -10 205 Q 40 192 90 208 Q 140 224 200 205 L 200 240 L -10 240 Z" fill="#e2e8f0" opacity="0.15"/>
</svg>