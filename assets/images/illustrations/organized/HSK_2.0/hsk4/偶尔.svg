<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for Cinema Screen / Projector -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Projector Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05" />
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior & Ambient Elements -->
  <!-- Floor -->
  <path d="M0,190 L240,190 L240,240 L0,240 Z" fill="#090d16" />
  <!-- Back Wall Line -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- Window Frame (Background Context) -->
  <g opacity="0.8">
    <rect x="25" y="40" width="45" height="70" rx="4" fill="#334155" />
    <rect x="29" y="44" width="37" height="62" rx="2" fill="#0f172a" />
    <!-- City silhouette outside -->
    <path d="M32,95 L32,80 L38,80 L38,95 L45,95 L45,70 L52,70 L52,95 L60,95 L60,85 L64,85 L64,95 Z" fill="#1e293b" />
    <!-- Window Light Beam -->
    <polygon points="29,44 66,44 110,190 0,190" fill="url(#windowLight)" />
  </g>

  <!-- Cinema Screen / Movie Poster (Representing "Going to the movies" from example) -->
  <g transform="translate(140, 30)" filter="url(#shadow)">
    <!-- Screen Frame -->
    <rect x="0" y="0" width="70" height="95" rx="6" fill="#334155" />
    <rect x="4" y="4" width="62" height="87" rx="4" fill="#0f172a" />
    <!-- Screen Content (Cosmic / Movie Vibe) -->
    <circle cx="35" cy="40" r="22" fill="url(#screenGlow)" />
    <circle cx="35" cy="40" r="14" fill="#fb923c" />
    <!-- Abstract mountain/film graphics on screen -->
    <path d="M10,75 L25,50 L40,68 L50,58 L60,75 Z" fill="#38bdf8" opacity="0.8" />
    <circle cx="50" cy="25" r="3" fill="#fef08a" />
    <circle cx="20" cy="30" r="1.5" fill="#fef08a" />
  </g>

  <!-- Projector & Stand -->
  <g transform="translate(105, 95)">
    <!-- Projector Stand/Table -->
    <rect x="-10" y="55" width="40" height="40" fill="#334155" rx="3" />
    <path d="M5,95 L5,120" stroke="#1e293b" stroke-width="4" />
    
    <!-- Projector Body -->
    <rect x="-15" y="35" width="50" height="25" rx="6" fill="#64748b" filter="url(#shadow)" />
    <rect x="-5" y="42" width="10" height="10" rx="3" fill="#38bdf8" />
    <!-- Lens -->
    <path d="M35,42 C38,42 40,44 40,47.5 C40,51 38,53 35,53 Z" fill="#0f172a" />
    <circle cx="37" cy="47.5" r="2" fill="#38bdf8" />
  </g>

  <!-- Projector Light Beam aiming at the Screen -->
  <polygon points="127,139 140,135 175,65 175,95" fill="url(#beamGrad)" />

  <!-- Cozy Armchair (Main Prop representing relaxed, occasional activity) -->
  <g transform="translate(45, 105)" filter="url(#shadow)">
    <!-- Armchair Back -->
    <rect x="15" y="0" width="55" height="60" rx="20" fill="#ec4899" />
    <rect x="22" y="7" width="41" height="46" rx="14" fill="#f472b6" />

    <!-- Armchair Seat -->
    <rect x="5" y="45" width="75" height="35" rx="12" fill="#db2777" />

    <!-- Cushions / Accents -->
    <rect x="20" y="50" width="45" height="22" rx="8" fill="#f472b6" />
    <!-- Throw Pillow (Random cozy detail) -->
    <rect x="12" y="38" width="22" height="22" rx="6" fill="#38bdf8" transform="rotate(-15 23 49)" />

    <!-- Armchair Legs -->
    <rect x="12" y="80" width="6" height="15" rx="2" fill="#090d16" />
    <rect x="64" y="80" width="6" height="15" rx="2" fill="#090d16" />
  </g>

  <!-- Cute Character (Relaxed, enjoying an "occasional" movie night) -->
  <g transform="translate(62, 112)" filter="url(#shadow)">
    <!-- Body / Hoodie -->
    <path d="M15,50 C15,32 28,25 40,25 C52,25 65,32 65,50 L72,75 C72,78 69,80 65,80 L15,80 C11,80 8,78 8,75 Z" fill="#818cf8" />
    <!-- Hoodie Pocket / Details -->
    <path d="M25,65 L55,65 L50,80 L30,80 Z" fill="#6366f1" />

    <!-- Head & Face -->
    <circle cx="40" cy="18" r="16" fill="#fde047" />
    <!-- Happy Closed Eyes (Enjoying the moment) -->
    <path d="M31,16 C33,19 35,19 37,16" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M43,16 C45,19 47,19 49,16" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Smile -->
    <path d="M37,22 C39,24 41,24 43,22" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheeks -->
    <circle cx="28" cy="20" r="3" fill="#fb7185" opacity="0.6" />
    <circle cx="52" cy="20" r="3" fill="#fb7185" opacity="0.6" />

    <!-- Holding Popcorn Bowl -->
    <g transform="translate(45, 52)">
      <path d="M0,0 L6,18 C7,20 9,21 12,21 L18,21 C21,21 23,20 24,18 L30,0 Z" fill="#f8fafc" />
      <!-- Red stripes on popcorn bucket -->
      <path d="M5,3 L7,18 M12,2 L14,19 M19,2 L17,19 M25,3 L23,18" stroke="#ef4444" stroke-width="2" opacity="0.8" />
      <!-- Popcorn top -->
      <circle cx="10" cy="-3" r="5" fill="#fef08a" />
      <circle cx="15" cy="-6" r="6" fill="#fef08a" />
      <circle cx="20" cy="-3" r="5" fill="#fef08a" />
      <circle cx="15" cy="-2" r="4" fill="#fde047" />
    </g>
  </g>

  <!-- Foreground Side Table with Drinks/Props -->
  <g transform="translate(15, 140)" filter="url(#shadow)">
    <!-- Table Top -->
    <ellipse cx="25" cy="10" rx="25" ry="10" fill="#475569" />
    <ellipse cx="25" cy="8" rx="23" ry="8" fill="#64748b" />
    <!-- Table Base/Legs -->
    <rect x="22" y="15" width="6" height="40" fill="#334155" />
    <ellipse cx="25" cy="55" rx="15" ry="5" fill="#334155" />

    <!-- Mug on Table -->
    <rect x="15" y="-5" width="10" height="12" rx="2" fill="#38bdf8" />
    <path d="M25, -2 C28, -2 29, 0 29, 2 C29, 4 28, 6 25, 6" stroke="#38bdf8" stroke-width="2" fill="none" />
    <!-- Steam from Mug -->
    <path d="M18,-10 C18,-12 20,-13 20,-15" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- Ambient Floating Sparkles / Randomness / Atmosphere -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="115" cy="65" r="2.5" />
    <circle cx="130" cy="45" r="1.5" />
    <circle cx="95" cy="45" r="2" />
    <circle cx="105" cy="30" r="1.5" />
  </g>
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="122" cy="85" r="2" />
    <circle cx="145" cy="75" r="1.5" />
  </g>
</svg>