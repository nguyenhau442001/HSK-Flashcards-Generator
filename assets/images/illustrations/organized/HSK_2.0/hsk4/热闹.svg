<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Light Overlay -->
    <linearGradient id="warmLight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    
    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Window Glow -->
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <!-- 1. Background & Environment -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Distant Night Cityscape / Roofs -->
  <path d="M0 160 L20 150 L40 155 L70 140 L90 145 L120 130 L150 142 L180 135 L210 148 L240 138 L240 240 L0 240 Z" fill="#0f172a" />
  
  <!-- Back Alley Buildings -->
  <path d="M20 170 L20 100 L60 85 L60 170 Z" fill="#1e293b" />
  <path d="M180 170 L180 95 L220 80 L220 170 Z" fill="#1e293b" />

  <!-- Ambient Light Reflection on Ground -->
  <rect x="0" y="160" width="240" height="80" fill="url(#warmLight)" />

  <!-- 2. Traditional Street Architecture (Foreground Buildings) -->
  <!-- Left Shop -->
  <path d="M-10 200 L-10 110 L75 90 L75 200 Z" fill="#334155" />
  <path d="M10 120 L55 110 L55 145 L10 155 Z" fill="url(#windowGlow)" />
  <path d="M32 110 L32 150" stroke="#1e293b" stroke-width="2" />
  <!-- Left Awning / Roof -->
  <path d="M-20 105 L85 85 L75 70 L-30 90 Z" fill="url(#roofGrad)" />
  <path d="M-20 105 L85 85" stroke="#fef08a" stroke-width="2" />

  <!-- Right Shop -->
  <path d="M165 200 L165 100 L250 120 L250 200 Z" fill="#334155" />
  <path d="M185 125 L225 133 L225 165 L185 155 Z" fill="url(#windowGlow)" />
  <path d="M205 129 L205 160" stroke="#1e293b" stroke-width="2" />
  <!-- Right Awning / Roof -->
  <path d="M155 105 L260 125 L250 140 L145 120 Z" fill="url(#roofGrad)" />
  <path d="M155 105 L260 125" stroke="#fef08a" stroke-width="2" />

  <!-- 3. Dynamic Street Props & Decorations (Nàonhiệt atmosphere) -->
  <!-- String Lights / Buntings across the street -->
  <path d="M0 70 Q 60 100 120 70 Q 180 100 240 70" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
  <path d="M20 80 Q 70 110 130 85 Q 190 110 220 85" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Glowing Red Lanterns (Multiple for bustle effect) -->
  <!-- Lantern 1 (Left) -->
  <circle cx="50" cy="85" r="22" fill="url(#lanternGlow)" />
  <path d="M47 70 L53 70 L55 95 L45 95 Z" fill="#dc2626" />
  <rect x="44" y="67" width="12" height="3" rx="1.5" fill="#fbbf24" />
  <rect x="46" y="95" width="8" height="4" rx="1" fill="#fbbf24" />
  <path d="M50 99 L50 107" stroke="#fbbf24" stroke-width="1.5" />

  <!-- Lantern 2 (Center-Left) -->
  <circle cx="95" cy="65" r="28" fill="url(#lanternGlow)" />
  <path d="M91 46 L99 46 L102 78 L88 78 Z" fill="#ef4444" />
  <rect x="89" y="43" width="12" height="3" rx="1.5" fill="#fbbf24" />
  <rect x="92" y="78" width="8" height="5" rx="1" fill="#fbbf24" />
  <path d="M96 83 L96 93" stroke="#fbbf24" stroke-width="1.5" />

  <!-- Lantern 3 (Center-Right) -->
  <circle cx="155" cy="75" r="25" fill="url(#lanternGlow)" />
  <path d="M151 58 L159 58 L162 88 L148 88 Z" fill="#dc2626" />
  <rect x="149" y="55" width="12" height="3" rx="1.5" fill="#fbbf24" />
  <rect x="152" y="88" width="8" height="4" rx="1" fill="#fbbf24" />
  <path d="M156 92 L156 100" stroke="#fbbf24" stroke-width="1.5" />

  <!-- Lantern 4 (Right) -->
  <circle cx="195" cy="90" r="20" fill="url(#lanternGlow)" />
  <path d="M192 77 L198 77 L200 101 L190 101 Z" fill="#ef4444" />
  <rect x="190" y="75" width="10" height="2" rx="1" fill="#fbbf24" />
  <rect x="193" y="101" width="6" height="3" rx="1" fill="#fbbf24" />

  <!-- 4. Energetic Crowd / Characters (Silhouettes with warm highlights) -->
  <!-- Pavement / Street Floor -->
  <path d="M0 170 C 60 160, 180 160, 240 170 L 240 240 L 0 240 Z" fill="#0f172a" />
  <path d="M0 173 C 60 163, 180 163, 240 173 L 240 179 L 0 179 Z" fill="#334155" opacity="0.5" />

  <!-- Person 1 (Left - Child looking up excited) -->
  <circle cx="65" cy="175" r="9" fill="#fb923c" /> <!-- Head -->
  <path d="M54 210 C 54 190, 76 190, 76 210 Z" fill="#38bdf8" /> <!-- Body -->
  <!-- Raised arm pointing -->
  <path d="M60 195 L50 180" stroke="#fb923c" stroke-width="4" stroke-linecap="round" />

  <!-- Person 2 (Center-Left - Adult walking with friend) -->
  <circle cx="105" cy="165" r="11" fill="#f43f5e" />
  <path d="M92 220 C 92 190, 118 190, 118 220 Z" fill="#a855f7" />
  <!-- Arm gesture -->
  <path d="M115 195 L125 185" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />

  <!-- Person 3 (Center - Person holding a glowing toy/snack) -->
  <circle cx="135" cy="160" r="12" fill="#fbbf24" />
  <path d="M120 220 C 120 185, 150 185, 150 220 Z" fill="#10b981" />
  <!-- Holding something up -->
  <circle cx="145" cy="170" r="4" fill="#fef08a" />
  <path d="M132 180 L145 170" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

  <!-- Person 4 (Right - Walking away) -->
  <circle cx="180" cy="170" r="10" fill="#38bdf8" />
  <path d="M168 220 C 168 195, 192 195, 192 220 Z" fill="#e11d48" />

  <!-- Person 5 (Foreground Silhouette - adds depth) -->
  <path d="M205 240 C 205 210, 225 210, 225 240 Z" fill="#090d16" />
  <circle cx="215" cy="200" r="13" fill="#090d16" />

  <!-- 5. Floating Festive Confetti & Sparkles (Enhancing the 'Nào nhiệt' vibe) -->
  <circle cx="35" cy="130" r="3" fill="#38bdf8" />
  <circle cx="80" cy="115" r="2" fill="#f43f5e" />
  <circle cx="130" cy="120" r="3.5" fill="#fbbf24" />
  <circle cx="170" cy="135" r="2.5" fill="#10b981" />
  <circle cx="215" cy="125" r="3" fill="#fb923c" />
  <circle cx="25" cy="80" r="2" fill="#fef08a" />
  <circle cx="110" cy="100" r="2.5" fill="#ec4899" />
  
  <!-- Sparkle stars -->
  <path d="M 70 95 L 72 100 L 77 102 L 72 104 L 70 109 L 68 104 L 63 102 L 68 100 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M 160 110 L 161.5 114 L 165.5 115.5 L 161.5 117 L 160 121 L 158.5 117 L 154.5 115.5 L 158.5 114 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M 100 135 L 101 138 L 104 139 L 101 140 L 100 143 L 99 140 L 96 139 L 99 138 Z" fill="#f43f5e" opacity="0.8" />

</svg>