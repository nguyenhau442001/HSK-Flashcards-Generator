<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- TV Screen Glow & Gradient -->
    <linearGradient id="tvScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Ad Pop-up Gradient (Vibrant Orange/Pink) -->
    <linearGradient id="adBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Couch Gradient -->
    <linearGradient id="couchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Lamp Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light / Wallpaper elements -->
  <circle cx="190" cy="50" r="40" fill="#f59e0b" opacity="0.05" filter="url(#glow)" />
  <path d="M0 180 L240 180" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" opacity="0.4" />

  <!-- House Plant (Context prop left) -->
  <g transform="translate(18, 120)">
    <!-- Pot -->
    <path d="M4 35 L16 60 H36 L48 35 Z" fill="#cbd5e1" />
    <ellipse cx="26" cy="35" rx="16" ry="4" fill="#94a3b8" />
    <!-- Stems & Leaves -->
    <path d="M26 35 Q10 15 5 10 C2 7 8 2 14 12 Q20 22 26 35 Z" fill="#10b981" />
    <path d="M26 35 Q42 10 50 5 C54 2 48 -2 40 8 Q33 18 26 35 Z" fill="#059669" />
    <path d="M26 35 Q25 10 26 2 C26 -2 34 0 32 10 Q29 20 26 35 Z" fill="#34d399" />
  </g>

  <!-- TV Unit / Media Console -->
  <rect x="50" y="150" width="140" height="30" rx="4" fill="#334155" />
  <rect x="70" y="160" width="30" height="15" rx="2" fill="#1e293b" />
  <rect x="140" y="160" width="30" height="15" rx="2" fill="#1e293b" />

  <!-- Television Set -->
  <g transform="translate(65, 55)">
    <!-- TV Stand -->
    <path d="M40 95 L55 110 H75 L90 95 Z" fill="#64748b" />
    <rect x="62" y="85" width="26" height="12" fill="#475569" />
    
    <!-- Outer Frame -->
    <rect x="0" y="0" width="150" height="90" rx="10" fill="#0f172a" stroke="#475569" stroke-width="3" />
    
    <!-- Screen -->
    <rect x="8" y="8" width="134" height="74" rx="6" fill="url(#tvScreenGrad)" />

    <!-- TV Show Content (Scenic background inside TV: Mountain & Sun) -->
    <circle cx="45" cy="35" r="12" fill="#fde047" opacity="0.9" />
    <path d="M8 70 L35 35 L60 70 Z" fill="#0284c7" opacity="0.6" />
    <path d="M40 70 L75 25 L115 70 Z" fill="#0369a1" opacity="0.8" />
    <path d="M90 70 L120 40 L142 70 Z" fill="#0284c7" opacity="0.7" />

    <!-- COMMERCIAL / ADVERTISEMENT OVERLAY (The core concept: 广告) -->
    <g transform="translate(25, 15)">
      <!-- Ad Banner Box -->
      <rect x="0" y="0" width="84" height="48" rx="8" fill="url(#adBoxGrad)" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
      
      <!-- Sparkle/Action elements on the ad -->
      <path d="M72 8 L75 14 L81 17 L75 20 L72 26 L69 20 L63 17 L69 14 Z" fill="#fef08a" />
      <path d="M14 36 L15.5 39 L19 40.5 L15.5 42 L14 45 L12.5 42 L9 40.5 L12.5 39 Z" fill="#ffffff" />

      <!-- Graphic within Ad: Shopping Bag & Gift Box representing commercial product -->
      <!-- Shopping Bag -->
      <path d="M28 16 H44 V38 H28 Z" fill="#ffffff" rx="2" />
      <path d="M32 16 V12 C32 10 40 10 40 12 V16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <!-- Tag / Star on Bag -->
      <circle cx="36" cy="27" r="5" fill="#f43f5e" />
      <path d="M36 24 L37 26 L39 26 L37.5 27.5 L38 29.5 L36 28.5 L34 29.5 L34.5 27.5 L33 26 L35 26 Z" fill="#fef08a" transform="scale(0.6) translate(24, 16)" />

      <!-- Gift Box next to bag -->
      <rect x="48" y="22" width="16" height="16" fill="#fde047" rx="1" />
      <path d="M48 28 H64" stroke="#f43f5e" stroke-width="2.5" />
      <path d="M56 22 V38" stroke="#f43f5e" stroke-width="2.5" />
      <path d="M53 22 C53 19 56 18 56 20 C56 18 59 19 59 22" fill="none" stroke="#f43f5e" stroke-width="1.5" />
    </g>

    <!-- TV Screen Glass Glare -->
    <path d="M12 12 L70 12 L50 82 L12 82 Z" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- Foreground: Couch / Sofa Back & Character interacting -->
  <g transform="translate(0, 165)">
    <!-- Sofa Base -->
    <rect x="30" y="15" width="180" height="35" rx="10" fill="url(#couchGrad)" />
    <!-- Sofa Cushions / Top Edge -->
    <path d="M25 15 C25 5 215 5 215 15 L210 25 C210 25 30 25 30 25 Z" fill="#818cf8" />
    
    <!-- Cozy Throw Pillow (Right) -->
    <rect x="165" y="0" width="35" height="30" rx="8" fill="#f43f5e" transform="rotate(15 182 15)" />
    <path d="M165 0 L200 0 L200 30 L165 30 Z" fill="none" />
    
    <!-- Coffee Table (Foreground Right) -->
    <g transform="translate(150, 32)">
      <ellipse cx="40" cy="12" rx="35" ry="12" fill="#334155" />
      <ellipse cx="40" cy="9" rx="35" ry="12" fill="#475569" />
      <!-- Mug on table -->
      <rect x="25" y="3" width="8" height="10" rx="2" fill="#f8fafc" />
      <path d="M33 5 C36 5 36 9 33 10" fill="none" stroke="#f8fafc" stroke-width="1.5" />
      <!-- Remote Control -->
      <rect x="50" y="8" width="14" height="6" rx="2" fill="#0f172a" />
    </g>
  </g>

  <!-- Action Sparkles / Remote Signals floating from bottom right toward TV -->
  <g opacity="0.8">
    <circle cx="160" cy="140" r="3" fill="#38bdf8" />
    <circle cx="145" cy="120" r="2" fill="#fb923c" />
    <path d="M170 155 Q165 140 155 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
  </g>

</svg>