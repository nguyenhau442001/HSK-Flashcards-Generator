<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Spotlight for Idea / Nêu ra -->
    <radialGradient id="ideaGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Folder/Document Gradient -->
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <!-- Light bulb glow -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Idea Light -->
  <circle cx="120" cy="110" r="100" fill="url(#ideaGlow)"/>

  <!-- Background Environment Details (Meeting Room / Office Context) -->
  <!-- Whiteboard / Presentation screen in background -->
  <rect x="45" y="45" width="150" height="90" rx="6" fill="#334155" opacity="0.4"/>
  <rect x="52" y="52" width="136" height="76" rx="4" fill="#1e293b" opacity="0.6"/>
  <!-- Abstract chart lines on whiteboard -->
  <path d="M62 105 L82 85 L102 95 L132 65 L152 75 L172 60" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <circle cx="132" cy="65" r="4" fill="#38bdf8" opacity="0.6"/>

  <!-- Floor Surface -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#0f172a"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- Desk / Surface -->
  <path d="M30 190 L210 190 L195 160 L45 160 Z" fill="#334155" opacity="0.8"/>
  <rect x="30" y="190" width="180" height="6" rx="2" fill="#475569"/>

  <!-- Desk Props (Coffee cup, secondary notebook) -->
  <rect x="175" y="170" width="16" height="20" rx="3" fill="#cbd5e1" filter="url(#softShadow)"/>
  <path d="M191 176 C196 176, 196 184, 191 184" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  
  <rect x="55" y="174" width="25" height="16" rx="2" fill="#ec4899" transform="rotate(-10 55 174)"/>
  <rect x="57" y="172" width="25" height="16" rx="2" fill="#f43f5e" transform="rotate(-5 57 172)"/>

  <!-- MAIN CHARACTER & ACTION ("Tí" - Lifting/Mang/Xách/Nêu ra) -->
  
  <!-- Character Body / Torso -->
  <path d="M95 190 C95 165, 110 150, 120 150 C130 150, 145 165, 145 190 Z" fill="url(#shirtGrad)" filter="url(#softShadow)"/>
  
  <!-- Collar / Neck -->
  <circle cx="120" cy="142" r="10" fill="#fbcfe8"/>
  <path d="M110 138 Q120 146 130 138" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

  <!-- Character Head -->
  <circle cx="120" cy="122" r="18" fill="#fbcfe8" filter="url(#softShadow)"/>
  <!-- Hair -->
  <path d="M102 120 C102 105, 138 105, 138 120 C138 112, 130 102, 120 102 C110 102, 102 112, 102 120 Z" fill="#334155"/>
  <path d="M104 116 Q110 108 118 112" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Facial Expression: Enthusiastic, Focused ("Nêu ra" / Expressing an idea) -->
  <!-- Confident Eyes -->
  <circle cx="114" cy="120" r="2" fill="#1e293b"/>
  <circle cx="126" cy="120" r="2" fill="#1e293b"/>
  <!-- Smile -->
  <path d="M116 128 Q120 132 124 128" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="111" cy="123" r="3" fill="#f43f5e" opacity="0.3"/>
  <circle cx="129" cy="123" r="3" fill="#f43f5e" opacity="0.3"/>

  <!-- Left Arm (Supporting / Balanced) -->
  <path d="M100 160 Q85 170 90 185" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
  <circle cx="90" cy="186" r="5" fill="#fbcfe8"/>

  <!-- Right Arm & Hand (Lifting/Xách/Mang - 'Tí') -->
  <!-- Arm reaching up and slightly forward to hold the glowing folder/idea container -->
  <path d="M140 155 Q160 140 150 120" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" filter="url(#softShadow)"/>
  <!-- Hand lifting object -->
  <circle cx="150" cy="116" r="6" fill="#fbcfe8"/>

  <!-- MAIN OBJECT BEING CARRIED/LIFTED (Representing 'tí' - carrying physical item & abstract idea) -->
  <!-- Glowing Folder / Idea Briefcase floating/lifted right above the hand -->
  <g transform="translate(130, 85)" filter="url(#softShadow)">
    <!-- Folder Base -->
    <rect x="0" y="15" width="50" height="35" rx="4" fill="url(#folderGrad)"/>
    <!-- Folder Tab -->
    <path d="M5 15 L5 10 C5 8, 7 6, 9 6 L21 6 C23 6, 25 8, 25 10 L25 15 Z" fill="#d97706"/>
    <!-- Folder cover line -->
    <path d="M0 22 L50 22" stroke="#b45309" stroke-width="2" opacity="0.5"/>
    
    <!-- Emerging Idea Elements (Sparking out of the folder - 'nêu ra') -->
    <!-- Central Lightbulb -->
    <g transform="translate(25, -5)">
      <circle cx="0" cy="0" r="16" fill="url(#bulbGlow)"/>
      <circle cx="0" cy="0" r="10" fill="#fef08a"/>
      <path d="M-4 6 L4 6 L3 11 C3 12, 2 13, 0 13 C-2 13, -3 12, -3 11 Z" fill="#94a3b8"/>
      <!-- Filament -->
      <path d="M-3 -1 L0 -5 L3 -1" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Floating Sparkles / Concept Dots -->
    <circle cx="-10" cy="-2" r="3" fill="#38bdf8"/>
    <circle cx="60" cy="5" r="4" fill="#fb923c"/>
    <circle cx="55" cy="35" r="2.5" fill="#34d399"/>
    <circle cx="-5" cy="40" r="2" fill="#f43f5e"/>
    
    <!-- Action motion lines indicating lifting (mang/xách) -->
    <path d="M-12 20 Q-18 25 -12 30" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M-16 10 Q-22 15 -16 20" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Secondary Lifting/Carrying Element (Physical bag strap over shoulder to reinforce 'mang, xách') -->
  <path d="M120 132 C125 140, 135 150, 142 165" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Briefcase/Bag on floor being lifted -->
  <g transform="translate(145, 160)" filter="url(#softShadow)">
    <rect x="0" y="0" width="30" height="22" rx="4" fill="#10b981"/>
    <!-- Bag clasp -->
    <rect x="12" y="-3" width="6" height="4" rx="1" fill="#047857"/>
    <path d="M8 -3 C8 -7, 22 -7, 22 -3" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Dynamic floating light accents for atmospheric depth -->
  <circle cx="35" cy="80" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="205" cy="110" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="85" cy="50" r="2.5" fill="#f43f5e" opacity="0.4"/>
  <circle cx="180" cy="40" r="1.5" fill="#34d399" opacity="0.7"/>

  <!-- Highlighting Vector Sheen on character hair -->
  <path d="M110 106 Q120 102 130 108" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

</svg>