<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Person (Explaining) -->
  <g transform="translate(140, 100)">
    <circle cx="0" cy="0" r="25" fill="#fbbf24"/>
    <path d="M-10 -5 L10 -5 M-5 10 Q0 15 5 10" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M-20 30 L-30 60 M20 30 L30 60" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 30 L0 80" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- The "Explanation" - A large blueprint/diagram on a stand -->
  <g transform="translate(60, 120)">
    <rect x="-40" y="-80" width="80" height="100" rx="4" fill="#e2e8f0"/>
    <rect x="-30" y="-70" width="60" height="10" rx="2" fill="#38bdf8"/>
    <rect x="-30" y="-50" width="40" height="6" rx="2" fill="#94a3b8"/>
    <rect x="-30" y="-35" width="50" height="6" rx="2" fill="#94a3b8"/>
    <circle cx="15" cy="-10" r="10" fill="#ec4899"/>
    <path d="M-40 20 L-50 50 M40 20 L50 50" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Gesture lines -->
  <path d="M105 80 Q120 60 135 70" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="6 6"/>
  <circle cx="138" cy="68" r="4" fill="#10b981"/>
  
  <!-- Ambient light -->
  <circle cx="140" cy="100" r="60" fill="#fbbf24" opacity="0.05"/>
</svg>