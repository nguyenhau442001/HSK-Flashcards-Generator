<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Lamp Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Coffee Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Sleep ZZZ floating gradients -->
    <linearGradient id="zzzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Character Outfit & Skin Gradients -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Night Window in Background -->
  <g transform="translate(160, 25)">
    <rect width="55" height="75" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <!-- Window pane grid -->
    <line x1="27" y1="0" x2="27" y2="75" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="37" x2="55" y2="37" stroke="#334155" stroke-width="2"/>
    <!-- Tiny City Stars / Lights Outside -->
    <circle cx="12" cy="18" r="1.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="42" cy="22" r="1" fill="#38bdf8" opacity="0.6"/>
    <circle cx="20" cy="55" r="1" fill="#fbbf24" opacity="0.4"/>
    <circle cx="40" cy="60" r="1.5" fill="#f43f5e" opacity="0.7"/>
    <!-- Crescent Moon -->
    <path d="M 40 10 A 8 8 0 1 1 30 18 A 9 9 0 1 0 40 10 Z" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Desk Lamp Light Cone (Behind Character) -->
  <polygon points="45,40 10,135 90,135" fill="url(#lampGlow)" />

  <!-- Desk Surface -->
  <rect x="0" y="160" width="240" height="80" fill="url(#deskGrad)" />
  <rect x="0" y="160" width="240" height="4" fill="#64748b" opacity="0.4" />

  <!-- Desk Props (Books, Coffee Mug) -->
  <g id="desk-props">
    <!-- Stack of Books -->
    <g transform="translate(180, 130)">
      <rect x="0" y="20" width="45" height="10" rx="2" fill="#0284c7" />
      <rect x="-3" y="10" width="48" height="10" rx="2" fill="#10b981" />
      <rect x="2" y="0" width="42" height="10" rx="2" fill="#f59e0b" />
      <!-- Bookmark ribbon -->
      <path d="M 12 30 L 12 36 L 15 33 L 18 36 L 18 30 Z" fill="#f43f5e" />
    </g>

    <!-- Coffee Mug -->
    <g transform="translate(140, 132)">
      <rect x="0" y="0" width="22" height="28" rx="4" fill="#f8fafc" />
      <!-- Mug Handle -->
      <path d="M 22 6 C 29 6, 29 22, 22 22" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
      <!-- Coffee Surface -->
      <ellipse cx="11" cy="4" rx="9" ry="3" fill="#78350f" />
      <!-- Steam -->
      <path d="M 7 -4 Q 11 -10, 7 -16" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 14 -6 Q 10 -12, 15 -18" fill="none" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Character (Exhausted / Buồn Ngủ) -->
  <g id="exhausted-character" transform="translate(20, 50)">

    <!-- Desk Lamp Apparatus (Attached near character) -->
    <g transform="translate(10, 20)">
      <!-- Lamp base -->
      <ellipse cx="15" cy="90" rx="15" ry="5" fill="#475569" />
      <!-- Lamp arm -->
      <path d="M 15 90 L 15 40 L 45 25" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Lamp shade -->
      <path d="M 32 18 L 58 18 L 50 32 L 40 32 Z" fill="#f59e0b" />
      <circle cx="45" cy="32" r="6" fill="#fbbf24" />
    </g>

    <!-- Slouched Body / Hoodie -->
    <path d="M 45 130 C 45 100, 65 95, 95 95 C 125 95, 145 100, 145 130 C 145 150, 145 180, 145 180 L 45 180 Z" fill="url(#hoodieGrad)" />
    <!-- Hoodie Hood crumpled behind neck -->
    <path d="M 70 85 C 80 75, 110 75, 120 85 C 110 95, 80 95, 70 85 Z" fill="#312e81" />

    <!-- Drooped Arms / Crossed on Desk -->
    <g id="arms">
      <!-- Left Arm -->
      <path d="M 55 110 C 65 125, 80 120, 95 120" fill="none" stroke="#3730a3" stroke-width="18" stroke-linecap="round" />
      <!-- Right Arm -->
      <path d="M 135 110 C 125 125, 110 120, 95 120" fill="none" stroke="#3730a3" stroke-width="18" stroke-linecap="round" />
      <!-- Hands resting/clutched together -->
      <circle cx="95" cy="120" r="10" fill="#fcd34d" />
    </g>

    <!-- Head (Slumped Forward / Resting on Forearms) -->
    <g id="head" transform="translate(95, 78)">
      <!-- Hair Base (Back) -->
      <circle cx="0" cy="-5" r="32" fill="#1e1b4b" />

      <!-- Face Shape -->
      <path d="M -26 -5 C -26 22, 26 22, 26 -5 C 26 -28, -26 -28, -26 -5 Z" fill="#fde68a" />

      <!-- Cute Messy Hair (Top) -->
      <path d="M -28 -15 C -20 -35, 15 -35, 27 -20 C 10 -30, -10 -25, -28 -15 Z" fill="#1e1b4b" />
      <path d="M 5 -28 C 15 -38, 30 -28, 25 -20 Z" fill="#1e1b4b" />

      <!-- Sleepy Closed Eyes (Drooping Arcs with long lashes/heavy lids) -->
      <!-- Left Eye -->
      <path d="M -16 -2 C -12 4, -4 4, 0 -2" fill="none" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" />
      <path d="M -14 3 L -17 8" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      <path d="M -5 3 L -3 8" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

      <!-- Right Eye -->
      <path d="M 4 -2 C 8 4, 16 4, 20 -2" fill="none" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 6 3 L 4 8" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      <path d="M 15 3 L 18 8" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

      <!-- Rosy Tired Cheeks -->
      <circle cx="-15" cy="8" r="6" fill="#f43f5e" opacity="0.35" />
      <circle cx="15" cy="8" r="6" fill="#f43f5e" opacity="0.35" />

      <!-- Sleepy Open Mouth (Yawning / Heavy breathing) -->
      <ellipse cx="2" cy="14" rx="6" ry="8" fill="#78350f" />
      <!-- Tongue inside yawning mouth -->
      <path d="M -4 18 C 0 16, 4 16, 8 18 C 4 21, -4 21, -4 18 Z" fill="#f43f5e" />

      <!-- Cute Sweat Drop (Classic anime fatigue sign) -->
      <g transform="translate(24, -12)">
        <path d="M 0 0 C 4 4, 4 10, 0 12 C -4 10, -4 4, 0 0 Z" fill="#38bdf8" opacity="0.85"/>
        <path d="M -1 3 C -1 6, 1 8, 1 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- Floating Z-Z-Z Sleep Elements (Dynamic floating motion to emphasize 'buồn ngủ') -->
  <g id="sleep-z-elements">
    <!-- Small Z -->
    <path d="M 145 65 L 160 65 L 145 80 L 160 80" fill="none" stroke="url(#zzzGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <!-- Medium Z -->
    <path d="M 160 40 L 180 40 L 162 62 L 182 62" fill="none" stroke="url(#zzzGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- Large Z -->
    <path d="M 180 12 L 208 12 L 183 38 L 211 38" fill="none" stroke="url(#zzzGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  </g>

  <!-- Ambient Light Sparkles / Dust Motes in the warm lamp glow -->
  <circle cx="75" cy="85" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="55" cy="115" r="2" fill="#fef08a" opacity="0.6"/>
  <circle cx="110" cy="65" r="1" fill="#fef08a" opacity="0.9"/>
  <circle cx="130" cy="95" r="2" fill="#fef08a" opacity="0.5"/>
</svg>