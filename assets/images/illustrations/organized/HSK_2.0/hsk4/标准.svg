<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients, glows, and clipping paths -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing effect for the gold standard star/emblem -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft shadow for studio floor -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold coin/medal gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Caliper metal gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background accent lighting -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.05" filter="blur(20px)" />
  <circle cx="120" cy="120" r="50" fill="#fbbf24" opacity="0.08" filter="blur(15px)" />

  <!-- Studio Surface / Workdesk (Isometric-ish perspective grid & plane) -->
  <!-- Back wall / floor separation -->
  <path d="M 20 170 L 220 170" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
  
  <!-- Desk surface -->
  <path d="M 15 175 L 225 175 C 232 175, 235 185, 228 190 L 195 210 C 190 213, 185 215, 178 215 L 62 215 C 55 215, 50 213, 45 210 L 12 190 C 5 185, 8 175, 15 175 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  
  <!-- Desk surface inner bevel / highlight -->
  <path d="M 18 179 L 222 179 C 226 179, 228 184, 224 187 L 193 206 C 190 208, 186 210, 181 210 L 59 210 C 54 210, 50 208, 47 206 L 16 187 C 12 184, 14 179, 18 179 Z" fill="#1e293b" />

  <!-- Floor Shadow under the main object -->
  <ellipse cx="120" cy="182" rx="55" ry="14" fill="url(#floorShadow)" />

  <!-- SCENE OBJECT: Precision Caliper & Golden Benchmark (Representing "Standard / Biāozhǔn") -->

  <!-- Golden Stand / Base -->
  <ellipse cx="120" cy="178" rx="28" ry="8" fill="#ca8a04" opacity="0.5" />
  <path d="M 100 178 L 104 150 L 136 150 L 140 178 Z" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <rect x="94" y="174" width="52" height="6" rx="3" fill="#475569" />

  <!-- Vertical Measure Rod -->
  <rect x="117" y="65" width="6" height="95" rx="2" fill="url(#metalGrad)" />
  <!-- Graduation marks on rod -->
  <line x1="117" y1="75" x2="121" y2="75" stroke="#1e293b" stroke-width="1.5" />
  <line x1="117" y1="85" x2="123" y2="85" stroke="#1e293b" stroke-width="1.5" />
  <line x1="117" y1="95" x2="121" y2="95" stroke="#1e293b" stroke-width="1.5" />
  <line x1="117" y1="105" x2="123" y2="105" stroke="#1e293b" stroke-width="1.5" />
  <line x1="117" y1="115" x2="121" y2="115" stroke="#1e293b" stroke-width="1.5" />
  <line x1="117" y1="125" x2="123" y2="125" stroke="#1e293b" stroke-width="1.5" />
  <line x1="117" y1="135" x2="121" y2="135" stroke="#1e293b" stroke-width="1.5" />
  <line x1="117" y1="145" x2="123" y2="145" stroke="#1e293b" stroke-width="1.5" />

  <!-- The "Gold Standard" Emblem/Medal at the core (Floating/Held by Caliper) -->
  <g filter="url(#goldGlow)">
    <circle cx="120" cy="110" r="26" fill="#ca8a04" opacity="0.4" />
  </g>
  
  <circle cx="120" cy="110" r="22" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2" />
  <circle cx="120" cy="110" r="17" fill="#b45309" opacity="0.2" />

  <!-- Checkmark / Star inside the gold standard medal representing precision/correctness -->
  <path d="M 110 110 L 117 117 L 131 101" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Caliper Arms measuring the core object -->
  <!-- Left Caliper Arm -->
  <path d="M 120 70 L 85 85 L 85 105 L 98 105 L 98 100 L 117 90 Z" fill="url(#metalGrad)" stroke="#334155" stroke-width="1" />
  <!-- Left caliper jaw tip gripping the medal -->
  <path d="M 85 105 L 98 105 L 98 115 L 92 115 Z" fill="#64748b" />
  <circle cx="88" cy="88" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1" />

  <!-- Right Caliper Arm -->
  <path d="M 120 70 L 155 85 L 155 105 L 142 105 L 142 100 L 123 90 Z" fill="url(#metalGrad)" stroke="#334155" stroke-width="1" />
  <!-- Right caliper jaw tip gripping the medal -->
  <path d="M 155 105 L 142 105 L 142 115 L 148 115 Z" fill="#64748b" />
  <circle cx="152" cy="88" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1" />

  <!-- Caliper Slider Dial/Knob -->
  <rect x="114" y="66" width="12" height="8" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />

  <!-- Precision Laser Grid / Alignment lines (Visualizing accuracy & benchmark) -->
  <line x1="60" y1="110" x2="98" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />
  <line x1="142" y1="110" x2="180" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />

  <!-- Glowing alignment target rings in the background -->
  <circle cx="120" cy="110" r="45" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" stroke-dasharray="6 6" />
  <circle cx="120" cy="110" r="60" fill="none" stroke="#10b981" stroke-width="1" opacity="0.15" />

  <!-- Contextual props on the desk -->
  <!-- Blueprint / Technical Document sheet under the setup -->
  <path d="M 60 160 L 130 145 L 175 165 L 105 180 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  <!-- Blueprint grid lines -->
  <line x1="75" y1="156" x2="120" y2="175" stroke="#38bdf8" stroke-width="0.75" opacity="0.3" />
  <line x1="95" y1="150" x2="140" y2="170" stroke="#38bdf8" stroke-width="0.75" opacity="0.3" />

  <!-- Small digital calibration device / counter prop -->
  <rect x="165" y="160" width="30" height="20" rx="4" fill="#334155" stroke="#475569" stroke-width="1" />
  <!-- Screen on device -->
  <rect x="170" y="164" width="20" height="8" rx="2" fill="#0f172a" />
  <!-- Glowing green metric readout (abstract shapes, NO text) -->
  <circle cx="175" cy="168" r="2" fill="#10b981" />
  <circle cx="181" cy="168" r="2" fill="#10b981" />
  <circle cx="187" cy="168" r="2" fill="#10b981" />

  <!-- A sleek modern drafting pen prop -->
  <path d="M 45 190 L 75 165 L 78 168 L 48 193 Z" fill="#fb923c" />
  <path d="M 45 190 L 42 193 L 48 193 Z" fill="#e2e8f0" /> <!-- pen tip -->

  <!-- Floating Sparkles / Action Highlights (Emphasizing high standard, perfection, accuracy) -->
  <g transform="translate(165, 80)">
    <path d="M 0 0 L 2 5 L 7 7 L 2 9 L 0 14 L -2 9 L -7 7 L -2 5 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(75, 95) scale(0.7)">
    <path d="M 0 0 L 2 5 L 7 7 L 2 9 L 0 14 L -2 9 L -7 7 L -2 5 Z" fill="#38bdf8" />
  </g>
  <g transform="translate(150, 140) scale(0.5)">
    <path d="M 0 0 L 2 5 L 7 7 L 2 9 L 0 14 L -2 9 L -7 7 L -2 5 Z" fill="#10b981" />
  </g>
  <g transform="translate(90, 60) scale(0.6)">
    <path d="M 0 0 L 2 5 L 7 7 L 2 9 L 0 14 L -2 9 L -7 7 L -2 5 Z" fill="#fbbf24" />
  </g>

</svg>