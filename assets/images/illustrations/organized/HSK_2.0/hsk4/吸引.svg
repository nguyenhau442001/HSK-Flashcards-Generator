<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Atmosphere/Glow -->
  <circle cx="120" cy="120" r="80" fill="#f59e0b" opacity="0.05"/>
  
  <!-- Book/Story Context -->
  <path d="M70 180 L170 180 L185 160 L85 160 Z" fill="#334155"/>
  <path d="M75 175 L165 175 L165 80 L75 80 Z" fill="#f8fafc"/>
  <path d="M85 95 L155 95 M85 110 L155 110 M85 125 L155 125 M85 140 L130 140" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- The 'Attraction' Effect (Light/Energy) -->
  <circle cx="120" cy="120" r="35" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 10" opacity="0.6"/>
  <circle cx="120" cy="120" r="45" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 15" opacity="0.4"/>
  
  <!-- Characters (Representing People drawn to the story) -->
  <g transform="translate(40, 150)">
    <circle cx="0" cy="0" r="12" fill="#38bdf8"/>
    <path d="M-10 10 Q 0 20 10 10" stroke="#38bdf8" stroke-width="4" fill="none"/>
  </g>
  
  <g transform="translate(200, 140)">
    <circle cx="0" cy="0" r="10" fill="#10b981"/>
    <path d="M-8 8 Q 0 18 8 8" stroke="#10b981" stroke-width="4" fill="none"/>
  </g>
  
  <g transform="translate(180, 70)">
    <circle cx="0" cy="0" r="14" fill="#ec4899"/>
    <path d="M-12 12 Q 0 22 12 12" stroke="#ec4899" stroke-width="4" fill="none"/>
  </g>

  <!-- Floating particles/sparks -->
  <circle cx="150" cy="130" r="3" fill="#fbbf24"/>
  <circle cx="90" cy="100" r="2" fill="#fbbf24"/>
  <circle cx="130" cy="70" r="4" fill="#fbbf24"/>
</svg>