<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Glows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311030" />
    </linearGradient>

    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="hull-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="lantern-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.4" />
    </linearGradient>

    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Stars & Atmosphere -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="30" cy="40" r="1" />
    <circle cx="70" cy="25" r="1.5" opacity="0.8" />
    <circle cx="110" cy="50" r="1" />
    <circle cx="160" cy="30" r="1.5" />
    <circle cx="200" cy="55" r="1" opacity="0.4" />
    <circle cx="220" cy="20" r="1.2" />
    <circle cx="45" cy="80" r="0.8" />
    <circle cx="185" cy="85" r="1" />
  </g>

  <!-- Big Glowing Moon -->
  <circle cx="190" cy="60" r="40" fill="url(#moon-glow)" />
  <circle cx="190" cy="60" r="18" fill="#fef08a" opacity="0.9" />
  <circle cx="184" cy="56" r="14" fill="#fde047" />

  <!-- Distant Mountains/Hills -->
  <path d="M0 130 Q 60 100, 120 120 T 240 115 L 240 160 L 0 160 Z" fill="#1e1b4b" opacity="0.7" />
  <path d="M0 140 Q 90 115, 160 135 T 240 130 L 240 160 L 0 160 Z" fill="#311030" opacity="0.8" />

  <!-- Water Surface -->
  <rect x="0" y="150" width="240" height="90" fill="url(#water-grad)" />

  <!-- Water Ripples / Reflections -->
  <path d="M20 170 Q 50 168, 80 170" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round" />
  <path d="M130 185 Q 160 183, 190 185" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round" />
  <path d="M60 205 Q 90 203, 120 205" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.3" stroke-linecap="round" />
  <path d="M150 220 Q 180 218, 210 220" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.2" stroke-linecap="round" />

  <!-- Moon Reflection in Water -->
  <ellipse cx="190" cy="185" rx="12" ry="3" fill="#fef08a" opacity="0.3" filter="url(#soft-glow)" />
  <ellipse cx="185" cy="210" rx="20" ry="2" fill="#fef08a" opacity="0.2" filter="url(#soft-glow)" />

  <!-- Willow Tree Branch (Foreground Frame Left) -->
  <path d="M0 0 Q 30 20, 40 80 Q 45 110, 30 140" stroke="#0f172a" stroke-width="12" fill="none" stroke-linecap="round" />
  <path d="M25 40 Q 50 60, 65 90" stroke="#1e293b" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Willow Leaves -->
  <path d="M40 80 Q 35 100, 30 115" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8" />
  <path d="M52 70 Q 55 95, 50 120" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9" />
  <path d="M65 90 Q 75 115, 70 140" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" />

  <!-- Romantic Gondola / Boat -->
  <g transform="translate(70, 135)">
    <!-- Boat Hull -->
    <path d="M 5 25 Q 50 45, 95 25 Q 105 18, 98 12 Q 50 15, 2 12 Q -5 18, 5 25 Z" fill="url(#hull-grad)" />
    <!-- Boat Inner Deck -->
    <path d="M 12 18 Q 50 20, 88 18 Q 50 12, 12 18 Z" fill="#451a03" />

    <!-- Cute Seated Characters -->
    <!-- Character 1 (Left) -->
    <circle cx="35" cy="5" r="7" fill="#fbcfe8" /> <!-- Head -->
    <path d="M28 3 Q 35 -3, 42 3" fill="#831843" /> <!-- Hair -->
    <path d="M28 12 Q 35 18, 42 12 L 40 22 L 30 22 Z" fill="#ec4899" /> <!-- Body/Dress -->

    <!-- Character 2 (Right) -->
    <circle cx="65" cy="5" r="7" fill="#fed7aa" /> <!-- Head -->
    <path d="M58 2 Q 65 -4, 72 2" fill="#1e293b" /> <!-- Hair -->
    <path d="M58 12 Q 65 18, 72 12 L 70 22 L 60 22 Z" fill="#3b82f6" /> <!-- Body -->

    <!-- Leaning/Holding hands silhouette or closeness -->
    <path d="M42 15 Q 50 18, 58 15" stroke="#fda4af" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Romantic Red Lanterns on Boat -->
    <!-- Pole -->
    <line x1="50" y1="12" x2="50" y2="-15" stroke="#78350f" stroke-width="2" />
    <!-- Lantern 1 -->
    <circle cx="50" cy="-20" r="7" fill="#ef4444" />
    <path d="M47 -27 L53 -27 M47 -13 L53 -13" stroke="#b91c1c" stroke-width="1.5" />
    <!-- Lantern Glow Effect -->
    <circle cx="50" cy="-20" r="14" fill="url(#lantern-glow)" opacity="0.6" filter="url(#glow)" />
    <circle cx="50" cy="-20" r="7" fill="#ef4444" />

    <!-- Secondary small hanging lantern astern -->
    <path d="M85 15 L85 -5" stroke="#78350f" stroke-width="1.5" />
    <circle cx="85" cy="-8" r="5" fill="#f97316" />
    <circle cx="85" cy="-8" r="10" fill="url(#lantern-glow)" opacity="0.4" />
  </g>

  <!-- Floating Glowing Fireflies / Magic Sparkles -->
  <g filter="url(#glow)">
    <circle cx="110" cy="110" r="2.5" fill="#fef08a" />
    <circle cx="125" cy="95" r="1.5" fill="#fde047" />
    <circle cx="95" cy="100" r="2" fill="#fef08a" />
    <circle cx="140" cy="125" r="2" fill="#fde047" />
    <circle cx="60" cy="115" r="1.5" fill="#fef08a" />
    <circle cx="75" cy="95" r="2" fill="#fbbf24" />
    <circle cx="160" cy="105" r="2.5" fill="#fef08a" />
    <circle cx="175" cy="120" r="1.5" fill="#fbbf24" />
  </g>

  <!-- Floating Lotus Flowers on Water -->
  <g transform="translate(30, 175)">
    <!-- Lotus 1 -->
    <ellipse cx="0" cy="0" rx="8" ry="4" fill="#047857" opacity="0.8" />
    <path d="M-3 -2 Q 0 -8, 3 -2 Q 6 1, 0 3 Q -6 1, -3 -2 Z" fill="#f472b6" />
    <circle cx="0" cy="0" r="2" fill="#fde047" />
  </g>

  <g transform="translate(180, 195)">
    <!-- Lotus 2 -->
    <ellipse cx="0" cy="0" rx="10" ry="5" fill="#065f46" opacity="0.8" />
    <path d="M-4 -3 Q 0 -10, 4 -3 Q 7 2, 0 5 Q -7 2, -4 -3 Z" fill="#ec4899" />
    <circle cx="0" cy="0" r="2" fill="#fef08a" />
  </g>

  <g transform="translate(130, 210)">
    <!-- Lotus 3 -->
    <ellipse cx="0" cy="0" rx="7" ry="3.5" fill="#047857" opacity="0.8" />
    <path d="M-2 -2 Q 0 -7, 2 -2 Q 5 1, 0 3 Q -5 1, -2 -2 Z" fill="#f472b6" />
  </g>

</svg>