<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Person A (Left) -->
    <g transform="translate(0, 0)">
      <path d="M40 120 L40 80 Q40 60 60 60 L80 60 Q100 60 100 80 L100 120" fill="#38bdf8"/>
      <circle cx="70" cy="45" r="15" fill="#fde68a"/>
      <path d="M60 90 L40 110" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
      <path d="M80 90 L100 110" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    </g>
    
    <!-- Person B (Right) -->
    <g transform="translate(80, 0)">
      <path d="M40 120 L40 80 Q40 60 60 60 L80 60 Q100 60 100 80 L100 120" fill="#ec4899"/>
      <circle cx="70" cy="45" r="15" fill="#fde68a"/>
      <path d="M60 90 L40 110" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
      <path d="M80 90 L100 110" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Directional Indicators -->
    <path d="M50 30 L20 30 L35 15" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M130 30 L160 30 L145 45" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Table Surface -->
    <rect x="-20" y="130" width="200" height="10" rx="4" fill="#475569"/>
  </g>
