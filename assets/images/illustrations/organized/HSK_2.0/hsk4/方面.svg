<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background & Environment Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Cube Facet Gradients (Representing 'Aspects / Facets') -->
    <linearGradient id="facetTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Holographic Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Subtle grid / perspective lines) -->
  <g opacity="0.15">
    <line x1="120" y1="120" x2="30" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="120" y1="120" x2="210" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="120" y1="120" x2="120" y2="30" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="120" cy="120" r="45" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 6"/>
  </g>

  <!-- Floor Platform / Desk Surface -->
  <ellipse cx="120" cy="190" rx="80" ry="24" fill="url(#floorGrad)" opacity="0.8"/>
  <ellipse cx="120" cy="190" rx="76" ry="21" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Contextual Props: Floating Holographic Data Nodes (Representing 'Various Aspects/Facets') -->
  <!-- Node 1: Top Left -->
  <g filter="url(#softShadow)" transform="translate(-10, -5)">
    <polygon points="65,70 85,60 85,85 65,95" fill="#f59e0b" opacity="0.9"/>
    <polygon points="45,80 65,70 65,95 45,105" fill="#d97706" opacity="0.9"/>
    <polygon points="55,55 85,60 65,70 45,65" fill="#fbbf24" opacity="0.9"/>
    <circle cx="65" cy="82" r="4" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Node 2: Top Right -->
  <g filter="url(#softShadow)" transform="translate(10, 5)">
    <polygon points="175,75 195,65 195,90 175,100" fill="#10b981" opacity="0.9"/>
    <polygon points="155,85 175,75 175,100 155,110" fill="#059669" opacity="0.9"/>
    <polygon points="165,60 195,65 175,75 155,70" fill="#34d399" opacity="0.9"/>
    <circle cx="175" cy="87" r="4" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Node 3: Bottom Right / Side -->
  <g filter="url(#softShadow)" transform="translate(5, 15)">
    <polygon points="160,140 178,130 178,152 160,162" fill="#ec4899" opacity="0.9"/>
    <polygon points="142,150 160,140 160,162 142,172" fill="#be185d" opacity="0.9"/>
    <polygon points="151,128 178,130 160,140 133,138" fill="#f472b6" opacity="0.9"/>
    <circle cx="160" cy="151" r="3.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Connection Beams (Tracing between the central core and different aspects) -->
  <g opacity="0.5" stroke-dasharray="3 3" stroke-width="1.5">
    <line x1="120" y1="120" x2="65" y2="82" stroke="#fbbf24"/>
    <line x1="120" y1="120" x2="175" y2="87" stroke="#34d399"/>
    <line x1="120" y1="120" x2="160" y2="151" stroke="#f472b6"/>
  </g>

  <!-- Central Multi-Faceted Subject: The 3D Isometric Cube (Representing 'Aspect / Facet' in a structured system) -->
  <g filter="url(#softShadow)">
    <!-- Base Shadow -->
    <ellipse cx="120" cy="162" rx="35" ry="12" fill="#000000" opacity="0.4"/>

    <!-- Main Central Isometric Cube -->
    <!-- Left Facet -->
    <path d="M 120,150 L 85,130 L 85,90 L 120,110 Z" fill="url(#facetLeft)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Right Facet -->
    <path d="M 120,150 L 155,130 L 155,90 L 120,110 Z" fill="url(#facetRight)" stroke="#7dd3fc" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Top Facet -->
    <path d="M 120,110 L 155,90 L 120,70 L 85,90 Z" fill="url(#facetTop)" stroke="#e0f2fe" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Inner Structural Lines (Highlighting multiple dimensions/faces/aspects) -->
    <!-- Inner Left Details -->
    <line x1="102" y1="100" x2="102" y2="130" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
    <!-- Inner Right Details -->
    <line x1="138" y1="100" x2="138" y2="130" stroke="#0284c7" stroke-width="1.5" opacity="0.6"/>

    <!-- Floating Center Energy Core / Lens (Focusing on a specific aspect) -->
    <polygon points="120,93 132,100 120,107 108,100" fill="#ffffff" filter="url(#glow)" opacity="0.9"/>
  </g>

  <!-- Foreground Atmospheric Particles (Adding depth and action-packed energy) -->
  <circle cx="75" cy="130" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="165" cy="115" r="2" fill="#34d399" opacity="0.9"/>
  <circle cx="95" cy="65" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="145" cy="165" r="2" fill="#f472b6" opacity="0.7"/>
  <circle cx="110" cy="175" r="1" fill="#38bdf8" opacity="0.6"/>

  <!-- Magnifying / Inspection Indicator (Emphasizing "Examining from all aspects") -->
  <g transform="translate(148, 125) rotate(-20)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.9"/>
    <circle cx="0" cy="0" r="12" fill="#38bdf8" fill-opacity="0.2"/>
    <line x1="10" y1="10" x2="22" y2="22" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>