<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Holographic Screen Glow -->
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Effect -->
  <circle cx="120" cy="80" r="70" fill="#38bdf8" opacity="0.06" filter="url(#glow)" />
  <circle cx="170" cy="140" r="50" fill="#f59e0b" opacity="0.05" filter="url(#glow)" />

  <!-- Background Environment / Office Elements -->
  <!-- Window Grid -->
  <g opacity="0.15">
    <line x1="30" y1="20" x2="30" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="60" y1="20" x2="60" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="180" y1="20" x2="180" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="210" y1="20" x2="210" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Bookshelf / Prop in Background -->
  <rect x="195" y="55" width="25" height="70" rx="2" fill="#334155" opacity="0.4" />
  <rect x="200" y="70" width="15" height="4" fill="#64748b" opacity="0.5" />
  <rect x="200" y="90" width="15" height="4" fill="#38bdf8" opacity="0.4" />

  <!-- Desk Surface -->
  <path d="M 10 185 L 230 185 L 210 230 L 30 230 Z" fill="url(#deskGrad)" filter="url(#shadow)" />
  <path d="M 10 185 L 230 185 L 230 189 L 10 189 Z" fill="#475569" />

  <!-- Holographic Management Control Panel (Floating) -->
  <g filter="url(#shadow)">
    <!-- Main Holo Screen -->
    <path d="M 60 70 L 180 70 L 195 140 L 45 140 Z" fill="url(#holoGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Screen Inner Grid Lines -->
    <line x1="70" y1="90" x2="170" y2="90" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <line x1="65" y1="110" x2="175" y2="110" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Data Nodes / Flow Charts on Holo Screen -->
    <!-- Node 1 -->
    <circle cx="80" cy="100" r="5" fill="#38bdf8" filter="url(#glow)" />
    <path d="M 80 100 L 110 85 L 140 100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
    <!-- Node 2 -->
    <circle cx="110" cy="85" r="4" fill="#fbbf24" />
    <circle cx="140" cy="100" r="5" fill="#10b981" filter="url(#glow)" />
    
    <!-- Bar Charts (Analytics) -->
    <rect x="75" y="118" width="10" height="15" rx="1" fill="#38bdf8" opacity="0.7" />
    <rect x="90" y="110" width="10" height="23" rx="1" fill="#fbbf24" opacity="0.8" />
    <rect x="105" y="105" width="10" height="28" rx="1" fill="#10b981" opacity="0.9" />
    <rect x="120" y="115" width="10" height="18" rx="1" fill="#38bdf8" opacity="0.7" />

    <!-- Circular Progress Graphic -->
    <circle cx="160" cy="115" r="12" fill="none" stroke="#334155" stroke-width="3" />
    <path d="M 160 103 A 12 12 0 1 1 148 115" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Holo Projection Base (Emitters) -->
  <rect x="95" y="140" width="50" height="6" rx="2" fill="#475569" />
  <rect x="110" y="138" width="20" height="2" fill="#38bdf8" filter="url(#glow)" />

  <!-- Manager Character (Torso, Arms, and Head interacting with system) -->
  <!-- Character Body / Suit -->
  <path d="M 85 200 L 95 155 L 145 155 L 155 200 Z" fill="#334155" filter="url(#shadow)" />
  <!-- Shirt & Tie -->
  <polygon points="120,155 125,175 120,185 115,175" fill="#f8fafc" />
  <polygon points="120,170 123,195 120,205 117,195" fill="#ec4899" />
  <!-- Suit Jacket Lapels -->
  <path d="M 95 155 L 115 185 L 120 155 Z" fill="#1e293b" />
  <path d="M 145 155 L 125 185 L 120 155 Z" fill="#1e293b" />

  <!-- Character Neck & Head -->
  <rect x="112" y="138" width="16" height="20" rx="6" fill="#fcd34d" />
  <!-- Head -->
  <circle cx="120" cy="115" r="22" fill="#fcd34d" filter="url(#shadow)" />
  
  <!-- Hair (Modern Professional Style) -->
  <path d="M 98 115 C 98 100, 108 92, 120 92 C 132 92, 142 100, 142 115 C 142 118, 140 120, 138 120 C 130 115, 110 115, 102 120 C 100 120, 98 118, 98 115 Z" fill="#1e293b" />

  <!-- Confident Facial Expression -->
  <!-- Glasses -->
  <rect x="107" y="108" width="11" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <rect x="122" y="108" width="11" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <line x1="118" y1="111" x2="122" y2="111" stroke="#0f172a" stroke-width="1.5" />
  <!-- Smile -->
  <path d="M 115 125 Q 120 129 125 125" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

  <!-- Active Gesturing Hands / Arms -->
  <!-- Left Arm (Supporting / Pointing up) -->
  <path d="M 95 160 C 80 165, 75 135, 85 125" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <circle cx="85" cy="123" r="6" fill="#fcd34d" />

  <!-- Right Arm (Manipulating Hologram) -->
  <path d="M 145 165 C 160 165, 165 145, 155 130" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <circle cx="155" cy="128" r="6" fill="#fcd34d" />

  <!-- Foreground Desktop Props -->
  <!-- Modern Tablet / Secondary Device on Desk -->
  <g transform="rotate(-10 50 195)" filter="url(#shadow)">
    <rect x="35" y="180" width="35" height="25" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <rect x="39" y="184" width="27" height="15" rx="1" fill="#38bdf8" opacity="0.3" />
    <line x1="42" y1="188" x2="55" y2="188" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <line x1="42" y1="193" x2="50" y2="193" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Coffee Mug (Energy Prop) -->
  <g transform="translate(175, 175)" filter="url(#shadow)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M 16 9 C 22 9, 22 19, 16 21" fill="none" stroke="#f8fafc" stroke-width="2" />
    <!-- Coffee liquid visible inside top -->
    <ellipse cx="8" cy="5" rx="8" ry="3" fill="#78350f" />
    <!-- Steam -->
    <path d="M 5 -2 C 3 -6, 9 -8, 7 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 11 -1 C 9 -5, 15 -7, 13 -11" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Dynamic Accent Sparks / Action Highlights -->
  <circle cx="175" cy="65" r="3" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="65" cy="60" r="2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="140" cy="50" r="2.5" fill="#10b981" filter="url(#glow)" />
  <polygon points="120,40 122,46 128,48 122,50 120,56 118,50 112,48 118,46" fill="#fbbf24" opacity="0.8" transform="scale(0.6) translate(80, 20)" />

</svg>