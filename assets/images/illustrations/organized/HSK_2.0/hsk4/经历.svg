<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Golden Glow for Adventure/Experience -->
    <radialGradient id="adventureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Backpack Gradient -->
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Map Paper Gradient -->
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light Effects / Journey Sparks -->
  <circle cx="120" cy="120" r="90" fill="url(#adventureGlow)"/>
  
  <g opacity="0.6">
    <circle cx="50" cy="70" r="2" fill="#fbbf24"/>
    <circle cx="190" cy="60" r="3" fill="#38bdf8"/>
    <circle cx="180" cy="180" r="2" fill="#10b981"/>
    <circle cx="60" cy="170" r="1.5" fill="#f43f5e"/>
    <path d="M40 100 L43 103 L40 106 L37 103 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M200 120 L202 122 L200 124 L198 122 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- SCENE: An explorer's journey table / adventurous experiential setup -->
  <!-- Wooden surface / Desk layer at the bottom -->
  <path d="M 20 200 L 220 200 L 230 220 L 10 220 Z" fill="#0f172a" opacity="0.5"/>

  <!-- Compass / Navigation Prop (Background element of experience) -->
  <g transform="translate(180, 75)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="22" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <circle cx="0" cy="0" r="17" fill="#1e293b"/>
    <!-- Compass Rose -->
    <polygon points="0,-12 3,-2 0,4 -3,-2" fill="#f43f5e"/>
    <polygon points="0,12 3,2 0,-4 -3,2" fill="#e2e8f0"/>
    <circle cx="0" cy="0" r="2" fill="#fbbf24"/>
  </g>

  <!-- Mountains background silhouette (symbolizing conquered peaks / experiences) -->
  <path d="M 20 180 L 70 110 L 110 160 L 150 95 L 220 180 Z" fill="#1e293b" opacity="0.7"/>
  <path d="M 20 180 L 70 110 L 110 160 L 150 95 L 220 180 Z" fill="url(#mountainGrad)"/>
  
  <!-- Snowcaps -->
  <path d="M 70 110 L 82 128 L 65 125 Z" fill="#f8fafc" opacity="0.9"/>
  <path d="M 150 95 L 162 116 L 142 112 Z" fill="#f8fafc" opacity="0.9"/>

  <!-- MAIN OBJECT: Adventure Backpack (representing life journey, experience, 'jingli') -->
  <g transform="translate(120, 140)" filter="url(#dropShadow)">
    <!-- Straps background -->
    <path d="M-25 -30 C-40 -10 -45 20 -40 45" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M25 -30 C40 -10 45 20 40 45" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Main Bag Body -->
    <rect x="-35" y="-45" width="70" height="85" rx="20" fill="url(#packGrad)"/>
    
    <!-- Bag Shading/Dimension -->
    <path d="M -35 -25 L 35 -25 L 35 40 C 35 50 25 55 15 55 L -15 55 C -25 55 -35 50 -35 40 Z" fill="#9f1239" opacity="0.3"/>

    <!-- Top Pocket / Flap -->
    <path d="M -32 -45 C -32 -52 -15 -55 0 -55 C 15 -55 32 -52 32 -45 L 32 -20 L -32 -20 Z" fill="#e11d48"/>
    <circle cx="0" cy="-33" r="4" fill="#fbbf24"/>

    <!-- Front Pockets & Gear -->
    <rect x="-22" y="-10" width="44" height="40" rx="10" fill="#e11d48"/>
    <rect x="-15" y="-3" width="30" height="22" rx="6" fill="#be123c"/>
    <circle cx="0" cy="8" r="3" fill="#fbbf24"/>

    <!-- Sleeping Bag / Rolled Mat on Top -->
    <g transform="translate(0, -62)">
      <rect x="-28" y="0" width="56" height="16" rx="8" fill="#38bdf8"/>
      <rect x="-26" y="2" width="52" height="12" rx="6" fill="#0ea5e9"/>
      <!-- Straps holding the roll -->
      <rect x="-16" y="0" width="5" height="16" fill="#0f172a" opacity="0.6"/>
      <rect x="11" y="0" width="5" height="16" fill="#0f172a" opacity="0.6"/>
    </g>

    <!-- Hiking Pole / Ice Axe strapped to side -->
    <line x1="-42" y1="-50" x2="-38" y2="55" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M -44 -48 L -38 -54 L -34 -48 Z" fill="#cbd5e1"/>
  </g>

  <!-- INTERACTIVE ELEMENT: Unfurled Treasure/Journey Map (Experience Log) -->
  <g transform="translate(65, 125) rotate(-12)" filter="url(#dropShadow)">
    <!-- Map Paper -->
    <path d="M -35 -25 Q 0 -35 35 -25 Q 45 25 35 45 Q 0 55 -35 45 Q -45 25 -35 -25 Z" fill="url(#mapGrad)"/>
    <!-- Map Details / Route Lines -->
    <path d="M -20 -10 Q -5 10 10 -5 T 25 25" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="4 2"/>
    <circle cx="-20" cy="-10" r="3.5" fill="#f43f5e"/>
    <circle cx="25" cy="25" r="3.5" fill="#10b981"/>
    <!-- Tiny Mountain Icon on Map -->
    <path d="M 0 10 L 6 20 L -6 20 Z" fill="#64748b" opacity="0.7"/>
  </g>

  <!-- Floating Camera / Souvenir Element (Capturing experiences) -->
  <g transform="translate(170, 135) rotate(15)" filter="url(#dropShadow)">
    <rect x="-18" y="-12" width="36" height="26" rx="6" fill="#cbd5e1"/>
    <rect x="-12" y="-16" width="12" height="6" rx="2" fill="#94a3b8"/>
    <circle cx="0" cy="1" r="9" fill="#334155"/>
    <circle cx="0" cy="1" r="6" fill="#38bdf8"/>
    <circle cx="3" cy="-2" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="10" cy="-6" r="2" fill="#fbbf24"/>
  </g>

  <!-- Sparkles / Dynamic Action Flourishes (Denoting richness of experience) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 115 50 C 115 57 110 57 110 57 C 110 57 115 57 115 64 C 115 57 120 57 120 57 C 120 57 115 57 115 50 Z"/>
    <!-- Star 2 -->
    <path d="M 45 80 C 45 84 42 84 42 84 C 42 84 45 84 45 88 C 45 84 48 84 48 84 C 48 84 45 84 45 80 Z"/>
    <!-- Star 3 -->
    <path d="M 195 110 C 195 115 191 115 191 115 C 191 115 195 115 195 120 C 195 115 199 115 199 115 C 199 115 195 115 195 110 Z"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Border frame ring -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>