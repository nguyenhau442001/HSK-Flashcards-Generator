<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background elements / depth -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" />
    <path d="M40 180 L200 180" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- Ground / Platform Surface -->
  <ellipse cx="120" cy="190" rx="90" ry="22" fill="#090d16" opacity="0.8" />
  <ellipse cx="120" cy="186" rx="80" ry="16" fill="#334155" filter="url(#softShadow)" />
  <ellipse cx="120" cy="186" rx="76" ry="14" fill="#1e293b" />

  <!-- Queue Barrier Stanchions -->
  <!-- Left Stanchion -->
  <rect x="36" y="100" width="8" height="85" rx="4" fill="#475569" />
  <circle cx="40" cy="100" r="7" fill="#f59e0b" filter="url(#glow)" />
  <!-- Right Stanchion -->
  <rect x="196" y="100" width="8" height="85" rx="4" fill="#475569" />
  <circle cx="200" cy="100" r="7" fill="#f59e0b" filter="url(#glow)" />
  <!-- Retractable Belt (Curved downward to show sequence flow) -->
  <path d="M 40 115 Q 120 165 200 115" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" filter="url(#softShadow)" />
  <path d="M 40 115 Q 120 165 200 115" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

  <!-- THE QUEUE: Cute, distinct characters representing ORDER/SEQUENCE (顺序) -->

  <!-- Character 1 (Front of the line - Excited, looking ahead) -->
  <g transform="translate(68, 125)">
    <!-- Shadow -->
    <ellipse cx="10" cy="55" rx="12" ry="5" fill="#000" opacity="0.4" />
    <!-- Body / Outfit -->
    <rect x="0" y="24" width="20" height="30" rx="8" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="10" cy="14" rx="13" fill="#fde047" />
    <!-- Hair / Hat -->
    <path d="M -3 10 Q 10 -2 23 10 Q 10 5 -3 10 Z" fill="#ea580c" />
    <!-- Face details -->
    <circle cx="14" cy="13" r="1.5" fill="#1e293b" />
    <path d="M 16 16 Q 18 18 20 16" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Number Badge indicating '1st' -->
    <circle cx="10" cy="40" r="7" fill="#10b981" filter="url(#softShadow)" />
    <text x="10" y="43" font-family="sans-serif" font-weight="900" font-size="9" fill="#fff" text-anchor="middle">1</text>
  </g>

  <!-- Character 2 (Middle of the line - Patient, steady) -->
  <g transform="translate(112, 108)">
    <!-- Shadow -->
    <ellipse cx="10" cy="55" rx="12" ry="5" fill="#000" opacity="0.4" />
    <!-- Body / Outfit -->
    <rect x="0" y="24" width="20" height="30" rx="8" fill="#ec4899" />
    <!-- Head -->
    <circle cx="10" cy="14" rx="13" fill="#fde047" />
    <!-- Hair -->
    <circle cx="10" cy="8" r="11" fill="#451a03" />
    <circle cx="4" cy="16" r="5" fill="#451a03" />
    <circle cx="16" cy="16" r="5" fill="#451a03" />
    <!-- Face details -->
    <circle cx="14" cy="13" r="1.5" fill="#1e293b" />
    <!-- Number Badge indicating '2nd' -->
    <circle cx="10" cy="40" r="7" fill="#10b981" filter="url(#softShadow)" />
    <text x="10" y="43" font-family="sans-serif" font-weight="900" font-size="9" fill="#fff" text-anchor="middle">2</text>
  </g>

  <!-- Character 3 (Back of the line - Joyful, stepping forward) -->
  <g transform="translate(156, 92)">
    <!-- Shadow -->
    <ellipse cx="10" cy="55" rx="12" ry="5" fill="#000" opacity="0.4" />
    <!-- Body / Outfit -->
    <rect x="0" y="24" width="20" height="30" rx="8" fill="#a855f7" />
    <!-- Head -->
    <circle cx="10" cy="14" rx="13" fill="#fde047" />
    <!-- Hair / Cap -->
    <path d="M -3 12 L 23 12 L 20 6 L 5 4 Z" fill="#3b82f6" />
    <!-- Face details -->
    <circle cx="14" cy="13" r="1.5" fill="#1e293b" />
    <!-- Number Badge indicating '3rd' -->
    <circle cx="10" cy="40" r="7" fill="#10b981" filter="url(#softShadow)" />
    <text x="10" y="43" font-family="sans-serif" font-weight="900" font-size="9" fill="#fff" text-anchor="middle">3</text>
  </g>

  <!-- Directional Flow / Progression Arrows Floating Above -->
  <g transform="translate(0, -10)" filter="url(#glow)">
    <path d="M 75 75 Q 95 65 115 75" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />
    <polygon points="118,72 125,76 117,80" fill="#38bdf8" />

    <path d="M 125 75 Q 145 65 165 75" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />
    <polygon points="168,72 175,76 167,80" fill="#38bdf8" />
  </g>

  <!-- Foreground Atmospheric Elements / Sparkles for visual polish -->
  <g fill="#fbbf24">
    <circle cx="50" cy="70" r="2" opacity="0.6" />
    <circle cx="190" cy="60" r="3" opacity="0.8" />
    <circle cx="215" cy="140" r="1.5" opacity="0.5" />
    <circle cx="25" cy="150" r="2" opacity="0.4" />
  </g>

  <!-- Dimensional Lighting overlay (soft vignette framing) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" pointer-events="none" />
</svg>