<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Spotlight from Desk Lamp -->
    <radialGradient id="lamp-glow" cx="70%" cy="30%" r="70%" fx="70%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Suspicious/Doubtful Aura Tint -->
    <linearGradient id="suspicion-tint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />
  <rect width="240" height="240" rx="24" fill="url(#suspicion-tint)" />

  <!-- ENVIRONMENT: Background Elements (Office/Study Room) -->
  <!-- Wallpaper Grid / Panel Accent -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="240" y2="60" />
    <line x1="0" y1="120" x2="240" y2="120" />
    <line x1="60" y1="0" x2="60" y2="180" />
    <line x1="150" y1="0" x2="150" y2="180" />
  </g>

  <!-- Bookshelf in Background -->
  <rect x="175" y="30" width="45" height="120" rx="4" fill="#0f172a" opacity="0.6"/>
  <rect x="180" y="50" width="35" height="8" fill="#334155" opacity="0.8"/>
  <rect x="180" y="80" width="35" height="8" fill="#475569" opacity="0.8"/>
  <rect x="180" y="110" width="35" height="8" fill="#1e293b" opacity="0.8"/>
  <!-- Colorful books on shelf -->
  <path d="M185 50 L185 40 L192 40 L192 50 Z" fill="#ec4899" />
  <path d="M195 50 L195 38 L202 38 L202 50 Z" fill="#38bdf8" />
  <path d="M185 80 L185 68 L193 68 L193 80 Z" fill="#10b981" />

  <!-- Corkboard with Notes (Context of investigation/doubt) -->
  <rect x="20" y="25" width="55" height="45" rx="3" fill="#b45309" opacity="0.4"/>
  <rect x="25" y="30" width="20" height="15" fill="#fef08a" rx="1" transform="rotate(-5 35 37)" />
  <rect x="48" y="35" width="20" height="18" fill="#fbcfe8" rx="1" transform="rotate(8 58 44)" />
  <circle cx="35" cy="31" r="1.5" fill="#ef4444" />
  <circle cx="58" cy="36" r="1.5" fill="#3b82f6" />

  <!-- Desk Surface -->
  <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="#0f172a" />
  <path d="M0 170 L240 170 L240 175 L0 175 Z" fill="#334155" />

  <!-- Desk Props: Laptop & Documents (The object of suspicion) -->
  <!-- Laptop Base -->
  <path d="M120 165 L185 165 L195 173 L110 173 Z" fill="#64748b" filter="url(#shadow)" />
  <path d="M115 169 L190 169" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <!-- Laptop Screen displaying suspicious chart/data -->
  <path d="M122 120 L183 120 L188 165 L117 165 Z" fill="#334155" filter="url(#shadow)" />
  <path d="M126 125 L179 125 L175 160 L130 160 Z" fill="#090d16" />
  <!-- Chart line going down/questionable -->
  <path d="M136 150 L148 138 L160 145 L170 132" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="170" cy="132" r="3" fill="#ef4444" />

  <!-- Coffee Mug -->
  <rect x="85" y="152" width="16" height="20" rx="3" fill="#cbd5e1" filter="url(#shadow)" />
  <path d="M101 157 C106 157, 106 167, 101 167" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <!-- Steam from mug -->
  <path d="M91 146 C93 142, 89 138, 93 134" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Desk Lamp (Ambient Light Source) -->
  <path d="M210 170 L210 110 L225 90" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M215 80 L235 95 L225 105 Z" fill="#f59e0b" filter="url(#shadow)" />

  <!-- MAIN CHARACTER: Performing 'Nghi ngờ' (Doubt/Skepticism) -->
  <g id="character" filter="url(#shadow)">
    <!-- Character Body / Torso (leaning back slightly in skepticism) -->
    <path d="M65 175 L85 130 L115 140 L105 175 Z" fill="#1e1b4b" />
    <!-- Shirt / Collar -->
    <path d="M85 130 L100 135 L95 145 Z" fill="#e2e8f0" />
    <path d="M85 130 L75 138 L82 146 Z" fill="#cbd5e1" />
    <!-- Orange/Warm Sweater -->
    <path d="M72 135 C72 135, 78 175, 78 175 L112 175 C112 175, 105 140, 105 140 Z" fill="#fb923c" />

    <!-- Left Arm / Hand resting on chin (Classic thoughtful/doubtful pose) -->
    <!-- Upper arm -->
    <path d="M78 140 L60 155" stroke="#fb923c" stroke-width="12" stroke-linecap="round" />
    <!-- Forearm pointing up to chin -->
    <path d="M60 155 L70 125" stroke="#fb923c" stroke-width="11" stroke-linecap="round" />
    <!-- Hand supporting chin with index finger extended alongside cheek -->
    <circle cx="72" cy="118" r="7" fill="#fcd34d" />
    <!-- Index finger pointing up cheek -->
    <path d="M74 115 L78 102" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />

    <!-- Right Arm crossed or resting -->
    <path d="M102 145 L115 165 L95 175" stroke="#ea580c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Neck -->
    <path d="M87 122 L93 132" stroke="#fcd34d" stroke-width="10" stroke-linecap="round" />

    <!-- Head (Tilted slightly backward and sideways with a skeptical angle) -->
    <g transform="translate(85, 100) rotate(-8)">
      <!-- Hair Base -->
      <path d="M-15 -10 C-15 -25, 15 -25, 20 -10 C25 0, 22 15, 18 18 C10 20, -5 20, -12 15 C-18 10, -18 -2, -15 -10 Z" fill="#0f172a" />

      <!-- Face Shape -->
      <path d="M-14 -5 C-14 12, -2 18, 12 14 C17 12, 18 2, 15 -8 C12 -18, -8 -18, -14 -5 Z" fill="#fcd34d" />

      <!-- Ear -->
      <path d="M13 0 C17 0, 17 8, 13 8" fill="#f59e0b" />

      <!-- Hair Details (Modern messy cut) -->
      <path d="M-16 -12 C-10 -22, 10 -20, 20 -8 C15 -15, -5 -15, -16 -12 Z" fill="#1e293b" />
      <path d="M-10 -18 L-2 -22 L5 -18" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

      <!-- Facial Expression: SUSPICIOUS / SKEPTICAL -->
      <!-- Narrowed, asymmetric eyebrows (key indicator of doubt) -->
      <!-- Left brow (lowered, intense) -->
      <path d="M-10 -4 L-2 1" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
      <!-- Right brow (slightly raised/arched in question) -->
      <path d="M2 3 L10 -1" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

      <!-- Narrowed squinting eyes -->
      <!-- Left eye -->
      <path d="M-9 4 L-3 5" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
      <!-- Right eye -->
      <path d="M3 6 L9 5" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

      <!-- Skeptical Smirk / Asymmetric Mouth -->
      <path d="M-4 11 C-1 10, 4 13, 8 10" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" />
      <!-- Slight shadow under lower lip -->
      <path d="M-2 13 C2 14, 5 13, 6 12" stroke="#d97706" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>
  </g>

  <!-- FOREGROUND / ATMOSPHERIC DETAILS -->
  <!-- Floating question mark elements (stylized graphic representations of 'doubt' integrated naturally as subtle lighting/particles instead of generic badges) -->
  <g fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <path d="M 45 80 C 45 70, 60 70, 60 82 C 60 92, 45 92, 45 102" />
    <circle cx="45" cy="112" r="1.5" fill="#38bdf8" />
  </g>

  <g fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <path d="M 195 70 C 195 63, 205 63, 205 72 C 205 79, 195 79, 195 86" />
    <circle cx="195" cy="92" r="1.2" fill="#f59e0b" />
  </g>

  <!-- Dramatic Lighting Rim on the Character -->
  <path d="M 125 100 C 130 115, 120 145, 112 175" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>