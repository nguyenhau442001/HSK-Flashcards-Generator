<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Architectural detail representing 'distinctive feature' (a unique gargoyle/ornament on a building) -->
  <g transform="translate(60, 40)">
    <!-- Building wall base -->
    <path d="M20 0 L100 0 L120 200 L0 200 Z" fill="#334155"/>
    
    <!-- The 'te dian' - a unique, glowing, ornate architectural sculpture -->
    <path d="M60 50 C 40 50, 30 70, 30 90 C 30 110, 50 120, 60 120 C 70 120, 90 110, 90 90 C 90 70, 80 50, 60 50 Z" fill="#f59e0b"/>
    <path d="M60 60 L60 110 M45 85 L75 85" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Magical glow effect -->
    <circle cx="60" cy="85" r="40" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  </g>

  <!-- Contextual props: Street lamp and urban elements -->
  <path d="M180 100 L180 240" stroke="#475569" stroke-width="8"/>
  <circle cx="180" cy="90" r="15" fill="#38bdf8"/>
  <circle cx="180" cy="90" r="5" fill="#ffffff"/>
  
  <!-- Decorative accent shapes -->
  <circle cx="30" cy="180" r="8" fill="#10b981"/>
  <path d="M200 160 L220 160 L210 140 Z" fill="#ec4899"/>
  <path d="M10 30 L25 30 L17.5 45 Z" fill="#fb923c"/>
</svg>