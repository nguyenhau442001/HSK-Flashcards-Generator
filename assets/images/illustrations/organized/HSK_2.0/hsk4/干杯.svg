<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Warm Golden Glow behind glasses -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Gradient (Warm Golden Ale/Juice) -->
    <linearGradient id="liquid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glass Shading Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements (Restaurant/Bar Ambiance) -->
  <g opacity="0.15">
    <!-- Bokeh circles -->
    <circle cx="40" cy="50" r="16" fill="#fbbf24"/>
    <circle cx="200" cy="80" r="24" fill="#38bdf8"/>
    <circle cx="180" cy="180" r="18" fill="#fbbf24"/>
    <circle cx="70" cy="200" r="12" fill="#ec4899"/>
    <!-- String lights wire -->
    <path d="M 0 30 Q 60 60 120 30 T 240 40" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Surface / Table -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 190 Q 120 180 240 190" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- Table reflection highlight -->
  <ellipse cx="120" cy="192" rx="90" ry="4" fill="#38bdf8" opacity="0.15"/>

  <!-- Center Amber Glow (Clink focal point) -->
  <circle cx="120" cy="115" r="70" fill="url(#amber-glow)"/>

  <!-- Splash & Action Elements (Impact/Cheers) -->
  <g id="action-sparks" filter="url(#soft-shadow)">
    <!-- Liquid Splash Droplets -->
    <circle cx="120" cy="85" r="4" fill="#fef08a"/>
    <circle cx="132" cy="78" r="2.5" fill="#facc15"/>
    <circle cx="108" cy="80" r="3" fill="#fef08a"/>
    <circle cx="125" cy="68" r="2" fill="#fef08a"/>
    <path d="M 115 75 Q 120 60 128 72" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Impact Starburst -->
    <path d="M 120 95 L 123 105 L 133 108 L 123 111 L 120 121 L 117 111 L 107 108 L 117 105 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="120" cy="108" r="15" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- MAIN SUBJECT: Two Toasting Glasses (干杯) -->
  <g id="toasting-glasses" filter="url(#soft-shadow)">
    
    <!-- LEFT GLASS (Mug/Pint style with handle) -->
    <g transform="translate(65, 115) rotate(-12) translate(-65, -115)">
      <!-- Glass Shadow base -->
      <path d="M 45 80 L 75 80 L 80 170 C 80 175 75 180 70 180 L 50 180 C 45 180 40 175 40 170 Z" fill="#000000" opacity="0.3"/>
      
      <!-- Handle -->
      <path d="M 75 95 C 95 95 98 135 77 145" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
      <path d="M 75 95 C 92 95 95 135 77 145" fill="none" stroke="url(#glass-grad)" stroke-width="3" stroke-linecap="round"/>

      <!-- Liquid inside Left Glass -->
      <path d="M 47 92 L 73 92 L 77 170 C 77 173 74 176 71 176 L 49 176 C 46 176 43 173 43 170 Z" fill="url(#liquid-grad)"/>
      
      <!-- Foam / Bubbles Top -->
      <path d="M 45 94 C 45 88 53 88 55 94 C 57 88 65 88 67 94 C 69 88 77 88 77 94 Z" fill="#ffffff"/>
      <circle cx="55" cy="120" r="2" fill="#ffffff" opacity="0.6"/>
      <circle cx="65" cy="140" r="3" fill="#ffffff" opacity="0.4"/>
      <circle cx="52" cy="155" r="1.5" fill="#ffffff" opacity="0.5"/>

      <!-- Glass Body Outer -->
      <path d="M 43 85 L 77 85 L 81 173 C 81 179 76 183 70 183 L 50 183 C 44 183 39 179 39 173 Z" fill="none" stroke="url(#glass-grad)" stroke-width="5" stroke-linejoin="round"/>
      
      <!-- Glass Rim -->
      <ellipse cx="60" cy="85" rx="17" ry="5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Glass Base Rim -->
      <ellipse cx="60" cy="183" rx="15" ry="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      
      <!-- Glass Highlight -->
      <path d="M 44 95 L 47 165" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </g>


    <!-- RIGHT GLASS (Stemware / Wine or Cocktail style) -->
    <g transform="translate(175, 115) rotate(12) translate(-175, -115)">
      <!-- Glass Body (V-shape / Martini or Wine) -->
      <!-- Liquid Inside -->
      <path d="M 148 78 L 192 78 C 192 78 180 115 170 130 C 160 115 148 78 148 78 Z" fill="url(#liquid-grad)"/>
      
      <!-- Bubbles -->
      <circle cx="170" cy="100" r="2" fill="#ffffff" opacity="0.6"/>
      <circle cx="164" cy="115" r="1.5" fill="#ffffff" opacity="0.5"/>
      <circle cx="176" cy="110" r="2.5" fill="#ffffff" opacity="0.4"/>

      <!-- Glass Outline & Bowl -->
      <path d="M 145 75 L 195 75 C 195 75 182 118 171 135 L 171 168 L 183 172 L 157 172 L 169 168 L 169 135 C 158 118 145 75 145 75 Z" fill="none" stroke="url(#glass-grad)" stroke-width="4.5" stroke-linejoin="round"/>
      
      <!-- Stem and Base details -->
      <path d="M 170 133 L 170 168" stroke="url(#glass-grad)" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="170" cy="172" rx="18" ry="5" fill="none" stroke="url(#glass-grad)" stroke-width="3"/>

      <!-- Glass Rim -->
      <ellipse cx="170" cy="75" rx="25" ry="7" fill="none" stroke="#ffffff" stroke-width="2.5"/>

      <!-- Glass Highlight -->
      <path d="M 152 82 C 155 100 162 118 167 128" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>

  </g>

  <!-- Ambient Foreground Elements (Bar Snack / Peanuts / Lantern edge) -->
  <g transform="translate(25, 175)">
    <!-- Small snack bowl -->
    <path d="M 0 15 C 0 25 30 25 30 15 Z" fill="#334155"/>
    <path d="M -3 15 C -3 12 33 12 33 15 C 33 18 -3 18 -3 15 Z" fill="#64748b"/>
    <!-- Snacks / Nuts -->
    <circle cx="8" cy="12" r="4" fill="#fb923c"/>
    <circle cx="15" cy="10" r="3.5" fill="#f59e0b"/>
    <circle cx="22" cy="13" r="4" fill="#d97706"/>
    <circle cx="14" cy="14" r="3" fill="#fbbf24"/>
  </g>

  <!-- Decorative Sparkles/Confetti (Celebrating vibe) -->
  <g opacity="0.8">
    <path d="M 90 50 L 93 56 L 99 59 L 93 62 L 90 68 L 87 62 L 81 59 L 87 56 Z" fill="#38bdf8" transform="scale(0.6) translate(60, 20)"/>
    <path d="M 160 45 L 162 50 L 167 52 L 162 54 L 160 59 L 158 54 L 153 52 L 158 50 Z" fill="#ec4899" transform="scale(0.7) translate(80, 10)"/>
    <circle cx="45" cy="110" r="3" fill="#10b981"/>
    <circle cx="195" cy="140" r="2.5" fill="#fbbf24"/>
  </g>
</svg>