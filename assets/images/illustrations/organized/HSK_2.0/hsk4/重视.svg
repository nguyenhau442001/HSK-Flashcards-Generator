<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- School/Classroom Environment -->
  <path d="M40 180 L200 180 L190 220 L50 220 Z" fill="#334155"/>
  <rect x="60" y="100" width="120" height="80" rx="4" fill="#cbd5e1"/>
  
  <!-- The "Value" (Focusing on Health/Growth) -->
  <!-- A large, glowing golden apple on a pedestal to represent 'valuing' health -->
  <circle cx="120" cy="140" r="25" fill="#f59e0b"/>
  <path d="M120 115 C135 110, 140 120, 130 130 C125 135, 120 130, 120 125" fill="#fbbf24"/>
  <path d="M118 115 L118 105 L122 108 Z" fill="#10b981"/>
  
  <!-- Protective Hands surrounding the object (Symbolizing 'Coitron') -->
  <path d="M90 160 C70 160, 60 140, 70 120 L80 125 C75 135, 80 150, 95 150 Z" fill="#fb923c"/>
  <path d="M150 160 C170 160, 180 140, 170 120 L160 125 C165 135, 160 150, 145 150 Z" fill="#fb923c"/>
  
  <!-- Atmospheric details: Floating particles -->
  <circle cx="50" cy="50" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="70" r="3" fill="#ec4899" opacity="0.6"/>
  <circle cx="120" cy="60" r="2" fill="#f59e0b" opacity="0.4"/>
  
  <!-- Spotlight effect -->
  <ellipse cx="120" cy="140" rx="40" ry="40" fill="url(#grad)" opacity="0.2"/>
  <defs>
    <radialGradient id="grad">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>