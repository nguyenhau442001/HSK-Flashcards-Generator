<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Atmospheric lighting -->
  <circle cx="120" cy="120" r="100" fill="url(#warm-glow)" />

  <!-- Cafe Interior Environment (Representing a common, ubiquitous daily scene) -->
  <!-- Back Wall & Window -->
  <rect x="30" y="30" width="180" height="130" rx="8" fill="#334155" opacity="0.4"/>
  
  <!-- City Window View -->
  <path d="M70 45 L170 45 L170 110 L70 110 Z" fill="#0f172a"/>
  <!-- Buildings outside -->
  <rect x="80" y="65" width="20" height="45" fill="#1e293b"/>
  <rect x="105" y="55" width="25" height="55" fill="#1e293b"/>
  <rect x="135" y="70" width="22" height="40" fill="#1e293b"/>
  <!-- Warm window lights -->
  <rect x="84" y="72" width="4" height="6" fill="#fbbf24" opacity="0.6"/>
  <rect x="92" y="85" width="4" height="6" fill="#fbbf24" opacity="0.8"/>
  <rect x="112" y="62" width="5" height="8" fill="#fbbf24" opacity="0.7"/>
  <rect x="120" y="75" width="5" height="8" fill="#fbbf24" opacity="0.9"/>
  <rect x="142" y="80" width="4" height="6" fill="#fbbf24" opacity="0.7"/>

  <!-- Warm Pendant Light -->
  <path d="M110 20 L130 20 L135 35 L105 35 Z" fill="#64748b"/>
  <path d="M120 35 L120 50" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="120" cy="50" rx="25" ry="10" fill="#fbbf24" opacity="0.3"/>
  <path d="M95 50 C95 70, 145 70, 145 50 Z" fill="#fbbf24" opacity="0.1"/>

  <!-- Wooden Counter/Table Surface -->
  <path d="M10 160 L230 160 L240 210 L0 210 Z" fill="#475569"/>
  <path d="M0 160 L240 160" stroke="#64748b" stroke-width="3"/>
  <path d="M0 168 L240 168" stroke="#334155" stroke-width="2"/>

  <!-- Foreground Action/Subject: Multiple people/items doing the same thing simultaneously (Universal/Common concept) -->
  <!-- Person 1 (Left): Using a smartphone -->
  <g transform="translate(35, 105)">
    <!-- Body/Shoulders -->
    <path d="M10 85 C10 60, 30 50, 50 50 C70 50, 90 60, 90 85 Z" fill="#10b981"/>
    <!-- Head & Hair -->
    <circle cx="50" cy="30" r="16" fill="#cbd5e1"/>
    <path d="M34 25 C34 15, 66 15, 66 25 C66 32, 60 35, 50 35 C40 35, 34 32, 34 25 Z" fill="#0f172a"/>
    <!-- Arm holding phone -->
    <path d="M30 65 L48 70 L52 55" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Smartphone with glowing screen -->
    <rect x="42" y="48" width="14" height="22" rx="3" fill="#0f172a" transform="rotate(-15 49 59)"/>
    <rect x="44" y="50" width="10" height="16" rx="1" fill="#38bdf8" opacity="0.8" transform="rotate(-15 49 59)"/>
  </g>

  <!-- Person 2 (Center): Using a laptop (The focal point of common activity) -->
  <g transform="translate(95, 95)">
    <!-- Body -->
    <path d="M10 95 C10 70, 25 55, 50 55 C75 55, 90 70, 90 95 Z" fill="#38bdf8"/>
    <!-- Head & Hair -->
    <circle cx="50" cy="32" r="17" fill="#cbd5e1"/>
    <path d="M33 30 C35 15, 65 15, 67 30 C60 25, 40 25, 33 30 Z" fill="#f59e0b"/>
    <!-- Arms typing -->
    <path d="M25 75 L45 68" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M75 75 L55 68" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Laptop Open -->
    <path d="M20 75 L80 75 L88 95 L12 95 Z" fill="#94a3b8"/>
    <path d="M25 45 L75 45 L80 75 L20 75 Z" fill="#cbd5e1"/>
    <!-- Laptop Screen Glow -->
    <path d="M28 49 L72 49 L76 71 L24 71 Z" fill="url(#screen-glow)"/>
    <!-- UI elements on screen (abstract graphs showing ubiquitous trend) -->
    <path d="M32 63 L40 57 L48 60 L58 52 L68 56" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="68" cy="56" r="3" fill="#ec4899"/>
  </g>

  <!-- Person 3 (Right): Also on a device / drinking coffee commonly -->
  <g transform="translate(155, 105)">
    <!-- Body -->
    <path d="M10 85 C10 60, 30 50, 50 50 C70 50, 90 60, 90 85 Z" fill="#ec4899"/>
    <!-- Head & Hair -->
    <circle cx="50" cy="30" r="16" fill="#cbd5e1"/>
    <path d="M34 22 C40 10, 60 10, 66 22 C60 28, 40 28, 34 22 Z" fill="#475569"/>
    <!-- Arm with coffee cup -->
    <path d="M35 65 L48 60" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <rect x="45" y="52" width="10" height="12" rx="2" fill="#f8fafc"/>
    <path d="M55 55 C58 55, 58 60, 55 62" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <!-- Steam rising -->
    <path d="M48 46 C50 42, 46 38, 48 34" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Table Props: Coffee mugs and secondary widespread items reinforcing the scene -->
  <g transform="translate(0, 5)">
    <!-- Coffee Mug Left -->
    <rect x="25" y="162" width="14" height="16" rx="3" fill="#f8fafc"/>
    <path d="M21 166 C19 166, 19 174, 25 174" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <ellipse cx="32" cy="162" rx="7" ry="2" fill="#cbd5e1"/>
    
    <!-- Plant on counter (Common cafe prop) -->
    <path d="M205 170 C205 155, 215 155, 215 170 Z" fill="#fb923c"/>
    <ellipse cx="210" cy="170" rx="6" ry="2" fill="#ea580c"/>
    <path d="M210 168 C205 155, 195 145, 190 140" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M210 168 C215 150, 225 145, 230 138" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M210 168 C210 150, 210 140, 210 132" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Ambient glowing trend indicators (Visualizing widespread/common distribution pattern subtly in the air) -->
  <g opacity="0.5">
    <circle cx="65" cy="55" r="3" fill="#38bdf8"/>
    <circle cx="175" cy="55" r="3" fill="#fbbf24"/>
    <circle cx="120" cy="25" r="2" fill="#ec4899"/>
    <path d="M50 40 Q60 30 75 35" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="3 3"/>
    <path d="M165 40 Q155 25 140 30" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="3 3"/>
  </g>

</svg>