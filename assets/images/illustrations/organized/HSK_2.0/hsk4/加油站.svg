<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Canopy Gradient -->
    <linearGradient id="canopyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Pump Body Gradient -->
    <linearGradient id="pumpGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Car Body Gradient (Warm Amber Accent) -->
    <linearGradient id="carGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Window Gradient -->
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Distant Background Elements -->
  <g opacity="0.3">
    <!-- Mountains / Hills -->
    <path d="M0 160 L40 120 L90 150 L160 100 L240 140 L240 180 L0 180 Z" fill="#0f172a"/>
    <!-- Distant City Lights / Towers -->
    <rect x="30" y="110" width="8" height="30" fill="#38bdf8"/>
    <rect x="45" y="95" width="12" height="45" fill="#f59e0b"/>
    <rect x="180" y="105" width="10" height="35" fill="#ec4899"/>
  </g>

  <!-- Ground / Pavement -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <!-- Pavement Highlights / Lanes -->
  <path d="M0 170 Q120 165 240 170" stroke="#334155" stroke-width="4"/>
  <line x1="20" y1="200" x2="220" y2="200" stroke="#475569" stroke-dasharray="8 8" stroke-width="2" opacity="0.5"/>

  <!-- Gas Station Canopy Structure -->
  <!-- Support Pillars -->
  <rect x="40" y="90" width="12" height="85" fill="#64748b" rx="2"/>
  <rect x="188" y="90" width="12" height="85" fill="#64748b" rx="2"/>
  
  <!-- Canopy Roof -->
  <path d="M15 90 L225 90 L210 65 L30 65 Z" fill="url(#canopyGrad)"/>
  <path d="M15 90 L225 90 L225 94 L15 94 Z" fill="#0284c7"/> <!-- Canopy trim -->

  <!-- Hanging Price / Service Sign (Glowing element) -->
  <rect x="95" y="72" width="50" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="107" cy="81" r="5" fill="#10b981" filter="url(#softGlow)"/>
  <rect x="117" y="78" width="22" height="6" rx="2" fill="#38bdf8" opacity="0.8"/>

  <!-- Overhead Canopy Lighting Glow -->
  <ellipse cx="120" cy="94" rx="70" ry="12" fill="#38bdf8" opacity="0.25" filter="url(#glow)"/>

  <!-- Fuel Dispenser Island (Concrete Base) -->
  <path d="M70 175 L170 175 L165 168 L75 168 Z" fill="#475569"/>

  <!-- Fuel Dispenser Machine -->
  <rect x="96" y="120" width="48" height="50" rx="6" fill="url(#pumpGrad)" stroke="#334155" stroke-width="2"/>
  <!-- Dispenser Screen / Panel -->
  <rect x="104" y="130" width="32" height="16" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="120" y="141" font-family="monospace" font-size="10" fill="#10b981" text-anchor="middle" font-weight="bold">8.88</text>
  
  <!-- Dispenser Buttons -->
  <circle cx="112" cy="155" r="3" fill="#ef4444"/>
  <circle cx="128" cy="155" r="3" fill="#38bdf8"/>

  <!-- Fuel Pump Nozzle & Hose (Curved dynamic line) -->
  <path d="M144 140 C160 140 155 165 140 168" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <!-- Nozzle Handle -->
  <path d="M136 164 L142 170 L146 166 Z" fill="#64748b"/>

  <!-- Parked Modern Car (Right side) -->
  <g transform="translate(145, 135)">
    <!-- Car Shadow -->
    <ellipse cx="45" cy="40" rx="42" ry="6" fill="#000000" opacity="0.5"/>
    
    <!-- Car Body Lower -->
    <path d="M10 25 L20 12 L65 12 L75 25 L82 35 L5 35 Z" fill="url(#carGrad)"/>
    <!-- Car Roof / Cabin -->
    <path d="M24 12 L32 2 L56 2 L64 12 Z" fill="url(#carGrad)"/>
    <!-- Windows -->
    <path d="M26 11 L33 4 L55 4 L62 11 Z" fill="url(#windowGrad)"/>
    
    <!-- Wheels -->
    <circle cx="24" cy="35" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="62" cy="35" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Headlight / Details -->
    <path d="M4 27 L10 27 L10 32 L4 32 Z" fill="#fef08a" filter="url(#softGlow)"/>
    <path d="M78 27 L82 27 L82 32 L78 32 Z" fill="#ef4444"/>
  </g>

  <!-- Friendly Foreground Character (Attendant or Driver holding nozzle/interacting) -->
  <g transform="translate(65, 115)">
    <!-- Character Shadow -->
    <ellipse cx="20" cy="58" rx="14" ry="4" fill="#000000" opacity="0.4"/>

    <!-- Legs -->
    <rect x="13" y="42" width="6" height="18" fill="#1e293b" rx="2"/>
    <rect x="21" y="42" width="6" height="18" fill="#1e293b" rx="2"/>
    
    <!-- Torso (Wearing a vest/uniform typical of station staff) -->
    <path d="M12 22 L28 22 L30 44 L10 44 Z" fill="#38bdf8"/>
    <path d="M17 22 L23 22 L25 44 L15 44 Z" fill="#f8fafc"/> <!-- Shirt center -->

    <!-- Head & Cap -->
    <circle cx="20" cy="14" r="8" fill="#fcd34d"/>
    <!-- Cap -->
    <path d="M11 11 Q20 7 29 11 L27 8 L13 8 Z" fill="#0284c7"/>

    <!-- Arms & Interaction -->
    <!-- Back arm -->
    <path d="M12 24 L6 34" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
    <!-- Front arm reaching to pump -->
    <path d="M28 24 L38 32" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric Glow & Sparkles -->
  <circle cx="120" cy="40" r="1.5" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="45" cy="50" r="1" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="195" cy="45" r="1.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="160" cy="25" r="2" fill="#fef08a" filter="url(#glow)"/>

  <!-- Framing / Vignette Overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>