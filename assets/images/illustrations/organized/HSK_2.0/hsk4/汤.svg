<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(120, 140)">
    <!-- Table surface -->
    <ellipse cx="0" cy="40" rx="100" ry="20" fill="#0f172a" opacity="0.5"/>
    
    <!-- Bowl -->
    <path d="M-60 0 C-60 40, -40 70, 0 70 C40 70, 60 40, 60 0 Z" fill="#334155"/>
    <path d="M-58 0 C-58 38, -38 65, 0 65 C38 65, 58 38, 58 0 Z" fill="#1e293b"/>
    
    <!-- Soup Liquid -->
    <path d="M-55 5 C-55 35, -35 60, 0 60 C35 60, 55 35, 55 5 Z" fill="#fbbf24"/>
    
    <!-- Steam/Aroma -->
    <path d="M-20 -10 Q-30 -30, -20 -50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M0 -20 Q-10 -40, 0 -60" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M20 -10 Q30 -30, 20 -50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Ingredients -->
    <circle cx="-25" cy="25" r="8" fill="#10b981"/>
    <circle cx="15" cy="35" r="6" fill="#ec4899"/>
    <circle cx="30" cy="15" r="7" fill="#fb923c"/>
  </g>
  
  <!-- Spoon -->
  <path d="M160 120 L190 90 L200 100 L170 130 Z" fill="#94a3b8"/>
  <circle cx="195" cy="95" r="15" fill="#94a3b8"/>
  <circle cx="195" cy="95" r="8" fill="#fbbf24"/>
  
  <!-- Ambient Accents -->
  <circle cx="40" cy="50" r="4" fill="#38bdf8" opacity="0.3"/>
  <circle cx="200" cy="40" r="3" fill="#fb923c" opacity="0.3"/>
</svg>