<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#31102b" />
    </linearGradient>

    <!-- Stage Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Mask Gold Ornament Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Peking Opera Mask Red Gradient -->
    <linearGradient id="maskRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    
    <!-- Feather/Plume Gradient -->
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Traditional Chinese window lattice/stage backdrop hints) -->
  <g opacity="0.15">
    <path d="M0 60 H240 M0 120 H240 M0 180 H240" stroke="#fbbf24" stroke-width="1" />
    <path d="M60 0 V240 M120 0 V240 M180 0 V240" stroke="#fbbf24" stroke-width="1" />
    <circle cx="120" cy="120" r="90" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="120" cy="120" r="105" fill="none" stroke="#fbbf24" stroke-width="0.75" stroke-dasharray="4 4" />
  </g>

  <!-- Stage Lighting / Lanterns -->
  <circle cx="120" cy="110" r="85" fill="url(#lanternGlow)" />
  
  <!-- Hanging Chinese Lantern (Top Left) -->
  <g transform="translate(35, 25)">
    <line x1="0" y1="-25" x2="0" y2="0" stroke="#64748b" stroke-width="2" />
    <rect x="-10" y="0" width="20" height="6" rx="2" fill="#d97706" />
    <path d="M-10 6 C-18 6, -18 26, -10 30 C-5 32, 5 32, 10 30 C18 26, 18 6, 10 6 Z" fill="#ef4444" />
    <rect x="-10" y="30" width="20" height="5" rx="1" fill="#d97706" />
    <line x1="-5" y1="35" x2="-5" y2="45" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="0" y1="35" x2="0" y2="48" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="5" y1="35" x2="5" y2="45" stroke="#fbbf24" stroke-width="1.5" />
  </g>

  <!-- Hanging Chinese Lantern (Top Right) -->
  <g transform="translate(205, 25)">
    <line x1="0" y1="-25" x2="0" y2="0" stroke="#64748b" stroke-width="2" />
    <rect x="-10" y="0" width="20" height="6" rx="2" fill="#d97706" />
    <path d="M-10 6 C-18 6, -18 26, -10 30 C-5 32, 5 32, 10 30 C18 26, 18 6, 10 6 Z" fill="#ef4444" />
    <rect x="-10" y="30" width="20" height="5" rx="1" fill="#d97706" />
    <line x1="-5" y1="35" x2="-5" y2="45" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="0" y1="35" x2="0" y2="48" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="5" y1="35" x2="5" y2="45" stroke="#fbbf24" stroke-width="1.5" />
  </g>

  <!-- MAIN SUBJECT: Peking Opera Face Mask (Jingju Mask) with Ornate Headdress -->
  <g transform="translate(0, 10)">
    
    <!-- Long Pheasant Feathers (Shanzi) curving behind the mask -->
    <!-- Left Feather -->
    <path d="M 120 70 C 80 40, 40 20, 25 10 C 20 6, 22 2, 28 6 C 45 18, 80 45, 115 75 Z" fill="url(#featherGrad)" />
    <path d="M 120 70 C 70 50, 35 30, 25 10" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 28 6 L 32 12 M 38 10 L 42 16 M 48 15 L 52 21 M 58 20 L 62 26" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right Feather -->
    <path d="M 120 70 C 160 40, 200 20, 215 10 C 220 6, 218 2, 212 6 C 195 18, 160 45, 125 75 Z" fill="url(#featherGrad)" />
    <path d="M 120 70 C 170 50, 205 30, 215 10" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 212 6 L 208 12 M 202 10 L 198 16 M 192 15 L 188 21 M 182 20 L 178 26" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Elaborate Headdress Crown (Diadem) -->
    <path d="M 85 72 L 95 48 L 120 58 L 145 48 L 155 72 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Crown Gems -->
    <circle cx="120" cy="53" r="5" fill="#ef4444" stroke="#b45309" stroke-width="1" />
    <circle cx="103" cy="58" r="3.5" fill="#38bdf8" stroke="#b45309" stroke-width="1" />
    <circle cx="137" cy="58" r="3.5" fill="#38bdf8" stroke="#b45309" stroke-width="1" />
    <path d="M 80 75 Q 120 62 160 75 L 165 85 Q 120 72 75 85 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5" />
    <circle cx="120" cy="74" r="4" fill="#10b981" stroke="#b45309" stroke-width="1" />
    <circle cx="95" cy="76" r="3" fill="#ef4444" stroke="#b45309" stroke-width="1" />
    <circle cx="145" cy="76" r="3" fill="#ef4444" stroke="#b45309" stroke-width="1" />

    <!-- Opera Mask Base (Lianpu) - Vibrant Red Base -->
    <path d="M 120 78 
             C 155 78, 172 95, 172 125 
             C 172 160, 155 190, 120 202 
             C 85 190, 68 160, 68 125 
             C 68 95, 85 78, 120 78 Z" 
          fill="url(#maskRed)" stroke="#7f1d1d" stroke-width="3" />

    <!-- White Contour & Accents on Mask -->
    <!-- Forehead Pattern (Traditional stylized cloud/flame motif in white and black) -->
    <path d="M 120 85 C 130 95, 130 110, 120 120 C 110 110, 110 95, 120 85 Z" fill="#ffffff" />
    <path d="M 120 93 C 124 100, 124 110, 120 115 C 116 110, 116 100, 120 93 Z" fill="#1e293b" />
    <circle cx="120" cy="104" r="3" fill="#fbbf24" />

    <!-- Eyebrows - Dramatic upward sweeps -->
    <path d="M 80 98 Q 100 88 114 104 Q 98 108 80 98 Z" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 160 98 Q 140 88 126 104 Q 142 108 160 98 Z" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Eye Sockets (Stylized black and gold ornamentation) -->
    <path d="M 83 115 Q 102 110 116 122 Q 100 132 83 115 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <circle cx="99" cy="120" r="6" fill="#1e293b" />
    <circle cx="101" cy="118" r="2" fill="#ffffff" />

    <path d="M 157 115 Q 138 110 124 122 Q 140 132 157 115 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <circle cx="141" cy="120" r="6" fill="#1e293b" />
    <circle cx="139" cy="118" r="2" fill="#ffffff" />

    <!-- Cheek/Nose Complex Markings (White & Gold symmetrical swirls) -->
    <path d="M 120 125 C 128 135, 128 150, 120 160 C 112 150, 112 135, 120 125 Z" fill="#ffffff" />
    <path d="M 120 132 C 124 140, 124 148, 120 155 C 116 148, 116 140, 120 132 Z" fill="#1e293b" />
    
    <!-- Face Symmetry Lines (Black & White accents) -->
    <path d="M 85 135 Q 98 145 92 165" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 155 135 Q 142 145 148 165" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Mouth & Chin Articulation -->
    <path d="M 105 178 Q 120 188 135 178 Q 130 192 120 192 Q 110 192 105 178 Z" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" />
    <path d="M 112 181 Q 120 186 128 181" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />

    <!-- Tassels / Beads hanging from mask sides -->
    <g transform="translate(70, 160)">
      <line x1="0" y1="0" x2="-8" y2="20" stroke="#fbbf24" stroke-width="1.5" />
      <circle cx="-8" cy="20" r="3" fill="#ef4444" />
    </g>
    <g transform="translate(170, 160)">
      <line x1="0" y1="0" x2="8" y2="20" stroke="#fbbf24" stroke-width="1.5" />
      <circle cx="8" cy="20" r="3" fill="#ef4444" />
    </g>

  </g>

  <!-- Foreground Props: Traditional Hand Fan & Opera Prop Hints at Base -->
  <g transform="translate(50, 200)">
    <!-- Folded/Open Silk Fan (Left) -->
    <path d="M 0 15 L 25 -10 L 40 5 L 15 25 Z" fill="url(#goldGrad)" opacity="0.9" stroke="#b45309" stroke-width="1" />
    <path d="M 5 15 L 22 -3" stroke="#b45309" stroke-width="1" />
    <path d="M 12 18 L 30 2" stroke="#b45309" stroke-width="1" />
    <circle cx="0" cy="15" r="4" fill="#ef4444" />
  </g>

  <!-- Traditional Ruyi / Scrolled Prop (Right) -->
  <g transform="translate(180, 205)">
    <path d="M 0 5 C 10 -5, 20 0, 15 10 C 10 20, -5 10, 0 5 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5" />
    <path d="M 5 8 L -15 20" stroke="#92400e" stroke-width="4" stroke-linecap="round" />
    <circle cx="-15" cy="20" r="3" fill="#ef4444" />
  </g>

  <!-- Stage Floor Baseline with Warm Footlights Glow -->
  <rect x="0" y="232" width="240" height="8" fill="#0f172a" />
  <ellipse cx="120" cy="232" rx="90" ry="4" fill="#fbbf24" opacity="0.3" />
</svg>