<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Piggy Bank / Savings Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Map / Province Region Gradient -->
    <linearGradient id="province-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="province-alt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Background Glows representing regional travel & savings -->
  <circle cx="60" cy="80" r="50" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="180" cy="150" r="60" fill="#f59e0b" opacity="0.08" filter="url(#glow)" />

  <!-- SCENE: TRAVEL MAP & PROVINCE THEME (Representing 'tỉnh') + SAVINGS (Representing 'tiết kiệm') -->
  
  <!-- Desk Surface -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.8" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- Rolled Travel Map / Provincial Guide Background -->
  <g transform="translate(30, 65) rotate(-10)" filter="url(#shadow)">
    <!-- Map Base -->
    <rect x="0" y="0" width="110" height="85" rx="6" fill="#f8fafc" />
    <rect x="6" y="6" width="98" height="73" rx="3" fill="#f1f5f9" />
    
    <!-- Map Grid lines -->
    <line x1="6" y1="30" x2="104" y2="30" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="40" y1="6" x2="40" y2="79" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Province Region Highlight (Representing 'tỉnh') -->
    <path d="M 45 35 Q 60 32, 75 45 Q 80 65, 60 70 Q 40 75, 45 55 Z" fill="url(#province-grad)" opacity="0.85" />
    <!-- Neighboring region -->
    <path d="M 15 15 Q 35 15, 40 30 Q 30 50, 15 40 Z" fill="url(#province-alt)" opacity="0.4" />

    <!-- Route Path & Destination Pin -->
    <path d="M 20 60 Q 35 45, 55 50" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 2"/>
    <!-- Pin Icon -->
    <path d="M 55 50 C 50 45, 50 38, 55 35 C 60 38, 60 45, 55 50 Z" fill="#ef4444" />
    <circle cx="55" cy="41" r="1.5" fill="#ffffff" />
  </g>

  <!-- Compass / Navigation Prop -->
  <g transform="translate(145, 120)" filter="url(#shadow)">
    <circle cx="25" cy="25" r="24" fill="#334155" />
    <circle cx="25" cy="25" r="20" fill="#1e293b" />
    <!-- Compass needle -->
    <polygon points="25,11 29,25 25,25" fill="#ef4444" />
    <polygon points="25,39 21,25 25,25" fill="#f8fafc" />
    <circle cx="25" cy="25" r="3" fill="#fbbf24" />
  </g>

  <!-- PIGGY BANK (Representing 'tiết kiệm' - saving money for the provincial trip) -->
  <g transform="translate(100, 95)" filter="url(#shadow)">
    <!-- Piggy Body -->
    <ellipse cx="65" cy="45" rx="35" ry="28" fill="url(#gold-grad)" />

    <!-- Piggy Head & Snout -->
    <ellipse cx="90" cy="42" rx="15" ry="14" fill="url(#gold-grad)" />
    <ellipse.ellipse></ellipse.ellipse>
    <ellipse cx="98" cy="44" rx="5" ry="4" fill="#d97706" opacity="0.4" />
    <circle cx="96" cy="43" r="1" fill="#78350f" />
    <circle cx="98" cy="45" r="1" fill="#78350f" />

    <!-- Cute Ear -->
    <path d="M 78 26 L 86 16 L 88 28 Z" fill="#d97706" />

    <!-- Piggy Legs -->
    <rect x="45" y="66" rx="3" width="8" height="12" fill="#d97706" />
    <rect x="75" y="66" rx="3" width="8" height="12" fill="#d97706" />
    <rect x="55" y="68" rx="3" width="8" height="10" fill="#b45309" />
    <rect x="80" y="68" rx="3" width="8" height="10" fill="#b45309" />

    <!-- Curly Tail -->
    <path d="M 30 40 Q 22 36, 26 42 Q 28 46, 24 44" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />

    <!-- Eye -->
    <circle cx="92" cy="38" r="2" fill="#78350f" />

    <!-- Coin Slot -->
    <rect x="60" y="18" width="14" height="3" rx="1.5" fill="#b45309" />
  </g>

  <!-- ACTION-PACKED DYNAMIC COINS (Active savings motion) -->
  <!-- Falling Coin 1 -->
  <g transform="translate(145, 60) rotate(25)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#coin-grad)" />
    <ellipse cx="0" cy="0" rx="5" ry="7" fill="#fde047" opacity="0.6" />
  </g>

  <!-- Falling Coin 2 (closer to slot) -->
  <g transform="translate(162, 85) rotate(-15)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="11" ry="13" fill="url(#coin-grad)" />
    <ellipse cx="0" cy="0" rx="7" ry="9" fill="#fde047" opacity="0.6" />
  </g>

  <!-- Sparkles / Action Effects around the Piggy Bank & Savings -->
  <g fill="#fbbf24">
    <!-- Star sparkle 1 -->
    <path d="M 125 70 L 128 78 L 136 81 L 128 84 L 125 92 L 122 84 L 114 81 L 122 78 Z" transform="scale(0.5) translate(110, 40)" />
    <!-- Star sparkle 2 -->
    <path d="M 125 70 L 128 78 L 136 81 L 128 84 L 125 92 L 122 84 L 114 81 L 122 78 Z" transform="scale(0.35) translate(280, 250)" />
  </g>

  <!-- Small plant/succulent for environmental richness -->
  <g transform="translate(25, 155)" filter="url(#shadow)">
    <!-- Pot -->
    <path d="M 5 20 L 15 35 L 35 35 L 45 20 Z" fill="#cbd5e1" />
    <ellipse cx="25" cy="20" rx="20" ry="4" fill="#e2e8f0" />
    <!-- Leaves -->
    <path d="M 25 20 Q 20 5, 10 10 Q 20 18, 25 20 Z" fill="#10b981" />
    <path d="M 25 20 Q 30 2, 40 8 Q 30 16, 25 20 Z" fill="#34d399" />
    <path d="M 25 20 Q 25 -2, 25 12 Q 25 16, 25 20 Z" fill="#059669" />
  </g>

</svg>