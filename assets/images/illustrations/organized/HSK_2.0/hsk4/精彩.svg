<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Stage Spotlight Gradient -->
    <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Golden Sparkle Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Firework / Action Burst Path -->
    <g id="sparkle">
      <path d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#fbbf24"/>
    </g>
    <g id="smallSparkle">
      <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#38bdf8"/>
    </g>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Atmospheric Lighting & Stage Beams -->
  <polygon points="120,0 20,200 220,200" fill="url(#spotlight)"/>
  <polygon points="120,0 70,200 170,200" fill="#fbbf24" opacity="0.08"/>

  <!-- Background Stage Elements & Confetti -->
  <circle cx="50" cy="70" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="80" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="210" cy="140" r="1.5" fill="#ec4899" opacity="0.7"/>
  <circle cx="30" cy="150" r="2" fill="#10b981" opacity="0.7"/>

  <!-- Dynamic Floating Ribbons / Streamers -->
  <path d="M 20 180 Q 50 130 90 160 T 160 120 T 220 170" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 10 100 Q 60 70 110 110 T 190 70 T 230 110" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Main Action Subject: A spectacular acrobat/performer leaping mid-air on stage -->
  <!-- Stage Floor -->
  <ellipse cx="120" cy="205" rx="90" ry="15" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <ellipse cx="120" cy="205" rx="80" ry="10" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Motion Trails / Energy Swirls -->
  <path d="M 60 170 C 80 140, 100 130, 120 150 C 140 170, 170 160, 190 120" fill="none" stroke="url(#goldGlow)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Acrobat Character - Dynamic Pose -->
  <g transform="translate(120, 115) scale(0.9)">
    <!-- Glowing Aura Behind Character -->
    <circle cx="0" cy="0" r="45" fill="url(#goldGlow)" opacity="0.3"/>

    <!-- Left Arm (Reaching back) -->
    <path d="M -15 -10 L -35 5 L -45 0" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Arm (Dynamic swirl) -->
    <path d="M 10 -10 L 30 -25 L 45 -15" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Torso (Leaning forward in flight) -->
    <path d="M -15 -15 Q 0 -5 15 -15 L 10 25 Q -5 30 -15 20 Z" fill="#ec4899" stroke="#be185d" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Costume Star Accent -->
    <path d="M 0 0 L 2 -4 L 6 -5 L 3 -8 L 4 -12 L 0 -10 L -4 -12 L -3 -8 L -6 -5 L -2 -4 Z" fill="#fbbf24" transform="translate(0, 5) scale(0.8)"/>

    <!-- Legs (Dynamic split/leap) -->
    <!-- Left Leg -->
    <path d="M -15 20 L -35 35 L -55 30" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -55 30 L -62 28" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/> <!-- Shoe -->

    <!-- Right Leg -->
    <path d="M 10 25 L 35 40 L 55 25" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 55 25 L 63 22" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/> <!-- Shoe -->

    <!-- Head & Hair Flow -->
    <path d="M -15 -25 L -25 -35" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/> <!-- Motion hair -->
    <circle cx="-5" cy="-25" r="10" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
    <path d="M -12 -28 C -5 -35 5 -30 2 -22 Z" fill="#1e293b"/> <!-- Hair -->
    
    <!-- Sparkles trailing the performer -->
    <use href="#smallSparkle" x="-45" y="-20"/>
    <use href="#sparkle" x="50" y="-35" transform="scale(0.8)"/>
    <use href="#smallSparkle" x="40" y="35"/>
  </g>

  <!-- Foreground Action Elements & Props -->
  <!-- Floating Golden Stars & Confetti for "Jingcai" (Spectacular/Brilliant atmosphere) -->
  <g transform="translate(60, 60)">
    <use href="#sparkle"/>
  </g>
  <g transform="translate(180, 50)">
    <use href="#sparkle" transform="scale(1.2)"/>
  </g>
  <g transform="translate(160, 170)">
    <use href="#sparkle" transform="scale(0.7)"/>
  </g>
  <g transform="translate(70, 180)">
    <use href="#smallSparkle"/>
  </g>

  <!-- Stage Lights Framing (Top corners) -->
  <path d="M 0 0 L 40 0 L 20 25 Z" fill="#334155" opacity="0.6"/>
  <circle cx="20" cy="12" r="6" fill="#38bdf8" opacity="0.8"/>
  <circle cx="20" cy="12" r="3" fill="#f8fafc"/>

  <path d="M 240 0 L 200 0 L 220 25 Z" fill="#334155" opacity="0.6"/>
  <circle cx="220" cy="12" r="6" fill="#ec4899" opacity="0.8"/>
  <circle cx="220" cy="12" r="3" fill="#f8fafc"/>

  <!-- Additional glowing ambient orbs -->
  <circle cx="120" cy="50" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="95" cy="85" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="145" cy="80" r="2.5" fill="#ec4899" opacity="0.8"/>
</svg>