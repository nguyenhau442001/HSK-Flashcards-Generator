<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(120, 120)">
    <!-- Floor/Ground shadow -->
    <ellipse cx="0" cy="80" rx="70" ry="15" fill="#0f172a" opacity="0.4"/>
    
    <!-- Rotating Office Chair -->
    <g transform="rotate(-20)">
      <!-- Wheels -->
      <circle cx="-30" cy="85" r="8" fill="#334155"/>
      <circle cx="30" cy="85" r="8" fill="#334155"/>
      <rect x="-35" y="70" width="70" height="10" rx="2" fill="#475569"/>
      <!-- Central Pole -->
      <rect x="-5" y="40" width="10" height="40" fill="#64748b"/>
      <!-- Seat -->
      <path d="M-40 40 L40 40 L30 55 L-30 55 Z" fill="#fb923c"/>
      <!-- Backrest -->
      <path d="M-30 40 L-25 0 L25 0 L30 40 Z" fill="#f59e0b"/>
    </g>
    
    <!-- Motion Lines indicating rotation -->
    <path d="M-60 -20 A 70 70 0 0 1 60 -20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
    <path d="M-70 10 A 80 80 0 0 1 70 10" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
    
    <!-- Ambient props -->
    <circle cx="-80" cy="-70" r="12" fill="#ec4899" opacity="0.3"/>
    <rect x="70" y="-60" width="20" height="20" rx="4" fill="#fbbf24" opacity="0.2" transform="rotate(15)"/>
  </g>
</svg>