<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Sky / Sunset Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="40%" stop-color="#831843" />
      <stop offset="80%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Water Gradient -->
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Building Window Glow -->
    <linearGradient id="win-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Bridge Arch Gradient -->
    <linearGradient id="bridge-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Lantern Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Container with Rounded Corners -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- SCENE LAYER 1: Beautiful Sky & Stars/Moon -->
  <g id="sky">
    <rect x="0" y="0" width="240" height="150" rx="24" fill="url(#sky-grad)" />
    <!-- Twinkling stars / sparkles -->
    <path d="M40 30 L42 35 L47 37 L42 39 L40 44 L38 39 L33 37 L38 35 Z" fill="#fde047" opacity="0.8" />
    <path d="M190 20 L191 23 L194 24 L191 25 L190 28 L189 25 L186 24 L189 23 Z" fill="#ffffff" opacity="0.9" />
    <path d="M210 50 L211 53 L214 54 L211 55 L210 58 L209 55 L206 54 L209 53 Z" fill="#fde047" opacity="0.6" />
    <circle cx="160" cy="35" r="12" fill="#fef08a" opacity="0.9" />
    <circle cx="160" cy="35" r="16" fill="#fde047" opacity="0.3" />
  </g>

  <!-- SCENE LAYER 2: Distant Mountains / Pagoda Silhouette -->
  <g id="mountains" fill="#4c1d95" opacity="0.7">
    <path d="M0 120 Q30 90 70 120 T150 115 T240 110 L240 150 L0 150 Z" />
  </g>

  <!-- SCENE LAYER 3: City Skyline (Charming Traditional & Modern Architecture) -->
  <g id="cityscape">
    <!-- Building Left -->
    <rect x="20" y="80" width="35" height="70" fill="#1e1b4b" />
    <rect x="25" y="88" width="8" height="12" rx="2" fill="url(#win-glow)" />
    <rect x="42" y="88" width="8" height="12" rx="2" fill="url(#win-glow)" />
    <rect x="25" y="108" width="8" height="12" rx="2" fill="url(#win-glow)" opacity="0.5" />
    <rect x="42" y="108" width="8" height="12" rx="2" fill="url(#win-glow)" />

    <!-- Traditional Pagoda Tower (Centerpiece of Beauty) -->
    <g id="pagoda">
      <!-- Base Structure -->
      <rect x="95" y="70" width="50" height="80" fill="#2e1065" />
      <!-- Tier 1 Roof -->
      <path d="M85 73 L120 60 L155 73 Q120 78 85 73 Z" fill="#b91c1c" />
      <path d="M88 73 L120 63 L152 73 Z" fill="#ef4444" />
      <!-- Tier 2 Roof -->
      <path d="M90 95 L120 84 L150 95 Q120 100 90 95 Z" fill="#b91c1c" />
      <!-- Tier 3 Roof -->
      <path d="M92 118 L120 108 L148 118 Q120 122 92 118 Z" fill="#b91c1c" />
      <!-- Glowing Windows on Pagoda -->
      <rect x="105" y="80" width="10" height="12" rx="3" fill="#fde047" />
      <rect x="125" y="80" width="10" height="12" rx="3" fill="#fde047" />
      <rect x="112" y="102" width="16" height="14" rx="4" fill="#fb923c" />
      <rect x="112" y="126" width="16" height="16" rx="4" fill="#fb923c" />
    </g>

    <!-- Building Right -->
    <rect x="175" y="75" width="45" height="75" fill="#172554" />
    <rect x="183" y="85" width="10" height="12" rx="2" fill="#38bdf8" />
    <rect x="201" y="85" width="10" height="12" rx="2" fill="#38bdf8" opacity="0.8" />
    <rect x="183" y="105" width="10" height="12" rx="2" fill="#38bdf8" />
    <rect x="201" y="105" width="10" height="12" rx="2" fill="#38bdf8" />
  </g>

  <!-- SCENE LAYER 4: Water Body (River / Lake reflecting city & lights) -->
  <g id="water-surface">
    <rect x="0" y="150" width="240" height="90" fill="url(#water-grad)" />
    <!-- Reflections -->
    <ellipse cx="120" cy="165" rx="35" ry="3" fill="#fde047" opacity="0.3" filter="url(#glow)" />
    <ellipse cx="120" cy="180" rx="25" ry="2" fill="#f97316" opacity="0.2" />
    <ellipse cx="40" cy="170" rx="15" ry="2" fill="#fde047" opacity="0.2" />
    <ellipse cx="195" cy="175" rx="18" ry="2" fill="#38bdf8" opacity="0.3" />

    <!-- Ripple Lines -->
    <path d="M70 195 Q90 193 110 195 T150 195" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M30 210 Q60 208 90 210 T150 210 T210 210" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
    <path d="M100 225 Q130 223 160 225 T220 225" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- SCENE LAYER 5: Curved Traditional Bridge -->
  <g id="bridge">
    <!-- Bridge Arch Shadow/Base -->
    <path d="M0 165 Q120 135 240 165 L240 180 Q120 150 0 180 Z" fill="url(#bridge-grad)" />
    <!-- Bridge Deck -->
    <path d="M0 160 Q120 130 240 160 L240 168 Q120 138 0 168 Z" fill="#64748b" />
    
    <!-- Bridge Railing Pillars & Beams -->
    <!-- We draw a series of vertical posts following the curve -->
    <g fill="#94a3b8">
      <rect x="15" y="150" width="3" height="12" rx="1" />
      <rect x="35" y="147" width="3" height="12" rx="1" />
      <rect x="55" y="144" width="3" height="12" rx="1" />
      <rect x="75" y="142" width="3" height="12" rx="1" />
      <rect x="95" y="140" width="3" height="12" rx="1" />
      <rect x="115" y="139" width="3" height="12" rx="1" />
      <rect x="135" y="140" width="3" height="12" rx="1" />
      <rect x="155" y="142" width="3" height="12" rx="1" />
      <rect x="175" y="144" width="3" height="12" rx="1" />
      <rect x="195" y="147" width="3" height="12" rx="1" />
      <rect x="215" y="150" width="3" height="12" rx="1" />
      <!-- Railing Top Bar -->
      <path d="M10 150 Q120 120 230 150" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- SCENE LAYER 6: Foreground Elements (Cherry Blossom / Willow Branch framing the top-left, and Red Lanterns for scenic atmosphere) -->
  <g id="foreground-nature">
    <!-- Hanging Red Lanterns on right -->
    <g id="lantern-group" transform="translate(15, -10)">
      <!-- Wire -->
      <path d="M190 0 L190 35" fill="none" stroke="#0f172a" stroke-width="2" />
      <!-- Lantern Body -->
      <ellipse cx="190" cy="45" rx="14" ry="18" fill="#dc2626" filter="url(#glow)" />
      <ellipse cx="190" cy="45" rx="14" ry="18" fill="url(#win-glow)" opacity="0.3" />
      <!-- Lantern Caps (Top/Bottom) -->
      <path d="M180 30 L200 30 L196 26 L184 26 Z" fill="#b45309" />
      <path d="M182 60 L198 60 L195 64 L185 64 Z" fill="#b45309" />
      <!-- Tassel -->
      <line x1="190" y1="64" x2="190" y2="76" stroke="#f59e0b" stroke-width="2" />
      <path d="M186 76 L194 76 L190 82 Z" fill="#f59e0b" />
    </g>

    <!-- Second Smaller Lantern -->
    <g id="lantern-small" transform="translate(-40, 15)">
      <!-- Wire -->
      <path d="M190 0 L190 25" fill="none" stroke="#0f172a" stroke-width="1.5" />
      <!-- Lantern Body -->
      <ellipse cx="190" cy="35" rx="10" ry="13" fill="#ea580c" filter="url(#glow)" />
      <!-- Caps -->
      <path d="M183 24 L197 24 L194 21 L186 21 Z" fill="#b45309" />
      <path d="M184 46 L196 46 L194 49 L186 49 Z" fill="#b45309" />
      <!-- Tassel -->
      <line x1="190" y1="49" x2="190" y2="58" stroke="#f59e0b" stroke-width="1.5" />
    </g>

    <!-- Glowing Cherry Blossom / Floral Branch framing top left -->
    <g id="blossom-branch">
      <!-- Dark Branch -->
      <path d="M-10 10 Q30 35 70 20 T130 15" fill="none" stroke="#332211" stroke-width="6" stroke-linecap="round" />
      <path d="M35 25 Q50 45 45 60" fill="none" stroke="#332211" stroke-width="3" stroke-linecap="round" />
      <path d="M90 17 Q110 35 120 45" fill="none" stroke="#332211" stroke-width="2.5" stroke-linecap="round" />

      <!-- Pink Blossom Flowers (Representing 'Xinh đẹp' - beauty of nature) -->
      <!-- Cluster 1 -->
      <g fill="#f472b6" filter="url(#glow)">
        <circle cx="30" cy="35" r="4" />
        <circle cx="38" cy="30" r="4" />
        <circle cx="40" cy="38" r="4" />
        <circle cx="32" cy="42" r="4" />
        <circle cx="35" cy="37" r="3" fill="#fbcfe8" />
      </g>
      <!-- Cluster 2 -->
      <g fill="#ec4899">
        <circle cx="55" cy="50" r="5" />
        <circle cx="48" cy="58" r="4" />
        <circle cx="60" cy="60" r="4.5" />
        <circle cx="54" cy="55" r="3.5" fill="#fbcfe8" />
      </g>
      <!-- Cluster 3 -->
      <g fill="#f472b6">
        <circle cx="75" cy="22" r="4.5" />
        <circle cx="82" cy="28" r="4" />
        <circle cx="72" cy="30" r="4" />
        <circle cx="78" cy="25" r="3" fill="#fbcfe8" />
      </g>
      <!-- Cluster 4 -->
      <g fill="#ec4899">
        <circle cx="115" cy="30" r="5" />
        <circle cx="122" cy="38" r="4" />
        <circle cx="110" cy="40" r="4.5" />
        <circle cx="116" cy="35" r="3.5" fill="#fbcfe8" />
      </g>
      <!-- Floating Petals -->
      <path d="M65 70 Q67 73 70 72 Q68 68 65 70 Z" fill="#f472b6" opacity="0.8" />
      <path d="M95 55 Q97 58 100 57 Q98 53 95 55 Z" fill="#ec4899" opacity="0.8" />
      <path d="M135 65 Q137 68 140 67 Q138 63 135 65 Z" fill="#f472b6" opacity="0.8" />
    </g>
  </g>

  <!-- SCENE LAYER 7: Dynamic Sparkles / Magic Dust for App Polish -->
  <g id="sparkles" fill="#fde047">
    <circle cx="75" cy="115" r="2" opacity="0.9" filter="url(#glow)" />
    <circle cx="165" cy="100" r="2.5" opacity="0.8" filter="url(#glow)" />
    <circle cx="130" cy="155" r="1.5" opacity="0.9" />
    <circle cx="95" cy="180" r="2" opacity="0.7" />
    <path d="M150 75 L152 80 L157 82 L152 84 L150 89 L148 84 L143 82 L148 80 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M80 145 L81 148 L84 149 L81 150 L80 153 L79 150 L76 149 L79 148 Z" fill="#f472b6" opacity="0.9" />
  </g>
</svg>