<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light Cone -->
    <linearGradient id="lightCone" x1="120" y1="30" x2="120" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Joyful Amber/Yellow Glow (Making him happy) -->
    <radialGradient id="joyGlow" cx="120" cy="130" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#fb923c" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pantsGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Envelope / Message Letter Gradients -->
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    
    <!-- Plant / Decor Gradients -->
    <linearGradient id="potGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ROOM ENVIRONMENT & BACKGROUND DETAILS -->
  <!-- Wallpaper subtle pattern / accent arch -->
  <path d="M40 220 V 90 A 80 80 0 0 1 200 90 V 220 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M50 220 V 95 A 70 70 0 0 1 190 95 V 220 Z" fill="#0f172a"/>

  <!-- Window with Night Cityscape / Stars outside -->
  <g transform="translate(15, 30)">
    <rect x="0" y="0" width="45" height="70" rx="4" fill="#334155" opacity="0.4"/>
    <circle cx="12" cy="20" r="1.5" fill="#f8fafc" opacity="0.8"/>
    <circle cx="35" cy="15" r="1" fill="#f8fafc" opacity="0.5"/>
    <circle cx="28" cy="45" r="1.2" fill="#f8fafc" opacity="0.7"/>
    <!-- Window frame -->
    <rect x="0" y="0" width="45" height="70" rx="4" fill="none" stroke="#475569" stroke-width="2"/>
    <line x1="22.5" y1="0" x2="22.5" y2="70" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="35" x2="45" y2="35" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Bookshelf / Prop in Background -->
  <g transform="translate(180, 45)">
    <rect x="0" y="0" width="40" height="80" fill="#334155" rx="2" opacity="0.5"/>
    <rect x="5" y="20" width="30" height="6" fill="#f43f5e" rx="1"/>
    <rect x="5" y="45" width="30" height="6" fill="#38bdf8" rx="1"/>
    <rect x="5" y="70" width="30" height="6" fill="#fbbf24" rx="1"/>
  </g>

  <!-- Potted Plant on Shelf/Floor -->
  <g transform="translate(25, 175)">
    <path d="M 5 25 L 15 45 H 35 L 45 25 Z" fill="url(#potGrad)"/>
    <ellipse cx="25" cy="25" rx="20" ry="5" fill="#fb7185"/>
    <!-- Leaves -->
    <path d="M 25 25 Q 10 5 0 10 Q 10 20 25 25 Z" fill="url(#leafGrad)"/>
    <path d="M 25 25 Q 35 0 45 5 Q 35 15 25 25 Z" fill="url(#leafGrad)"/>
    <path d="M 25 25 Q 25 -5 30 -10 Q 25 10 25 25 Z" fill="url(#leafGrad)"/>
  </g>

  <!-- Floor line and rug -->
  <path d="M 0 200 Q 120 215 240 200 V 240 H 0 Z" fill="#0f172a"/>
  <ellipse cx="120" cy="210" rx="70" ry="12" fill="#334155" opacity="0.4"/>

  <!-- Light Cone from Above (Setting mood) -->
  <polygon points="120,0 20,240 220,240" fill="url(#lightCone)"/>
  
  <!-- RADIANT JOY GLOW (Representing "making him happy / khiến cho anh ấy vui") -->
  <circle cx="120" cy="130" r="75" fill="url(#joyGlow)"/>

  <!-- Floating Sparkles / Joy Particles -->
  <g fill="#fbbf24">
    <path d="M 65 100 Q 70 95 75 100 Q 70 105 65 100 Z" opacity="0.8"/>
    <path d="M 175 90 Q 180 85 185 90 Q 180 95 175 90 Z" opacity="0.9"/>
    <circle cx="50" cy="140" r="3" opacity="0.7"/>
    <circle cx="195" cy="130" r="4" opacity="0.6"/>
    <path d="M 155 70 Q 158 65 161 70 Q 158 75 155 70 Z" opacity="0.7"/>
  </g>

  <!-- MAIN CHARACTER DESK & PROPS -->
  <g transform="translate(60, 160)">
    <!-- Wooden Desk Surface -->
    <rect x="-10" y="20" width="140" height="12" rx="3" fill="#b45309"/>
    <rect x="-5" y="32" width="130" height="8" rx="2" fill="#92400e"/>
    <!-- Desk Legs -->
    <rect x="5" y="40" width="8" height="35" fill="#78350f"/>
    <rect x="107" y="40" width="8" height="35" fill="#78350f"/>

    <!-- Coffee Mug on Desk -->
    <rect x="90" y="3" width="14" height="17" rx="3" fill="#cbd5e1"/>
    <path d="M 104 7 C 110 7 110 15 104 15" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Small desk lamp -->
    <path d="M 15 20 L 22 5 L 28 20 Z" fill="#64748b"/>
    <line x1="21.5" y1="20" x2="21.5" y2="30" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- MAIN CHARACTER: ECSTATIC MAN (Subject of 'making him happy') -->
  <g id="happy-character">
    <!-- Shadow beneath chair -->
    <ellipse cx="120" cy="198" rx="35" ry="8" fill="#020617" opacity="0.5"/>

    <!-- Modern Office Chair -->
    <g transform="translate(120, 165)">
      <!-- Chair Backrest -->
      <rect x="-22" y="-55" width="44" height="55" rx="10" fill="#334155"/>
      <rect x="-18" y="-50" width="36" height="45" rx="6" fill="#1e293b"/>
      <!-- Chair Stem & Base -->
      <rect x="-4" y="0" width="8" height="30" fill="#64748b"/>
      <path d="M -20 30 L 0 25 L 20 30" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Character Body / Leaping forward in joy -->
    <!-- Torso (leaning forward excitedly) -->
    <path d="M 98 120 C 95 100, 105 85, 122 88 C 138 90, 145 108, 142 125 L 132 150 C 130 155, 105 155, 100 150 Z" fill="url(#shirtGrad)"/>

    <!-- Collar / Neck -->
    <path d="M 115 84 L 122 88 L 128 84" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>
    <path d="M 118 84 C 118 78, 124 78, 124 84" fill="url(#skinGrad)"/>

    <!-- Legs (sitting/bouncing excitedly with dynamic angled posture) -->
    <g>
      <!-- Left Leg -->
      <path d="M 104 148 L 90 172 L 105 178" fill="none" stroke="url(#pantsGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Left Shoe -->
      <path d="M 98 176 C 98 174, 112 174, 114 178 C 115 180, 105 182, 98 176 Z" fill="#1e293b"/>

      <!-- Right Leg (Slightly elevated in excitement) -->
      <path d="M 132 148 L 148 168 L 138 180" fill="none" stroke="url(#pantsGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Right Shoe -->
      <path d="M 130 178 C 130 176, 144 177, 145 181 C 145 183, 133 184, 130 178 Z" fill="#1e293b"/>
    </g>

    <!-- Arms: Dynamic expressive gesture holding/celebrating the news -->
    <!-- Left Arm (Raised high in triumph/joy) -->
    <path d="M 102 95 C 90 85, 75 70, 85 55 C 92 45, 102 55, 98 68" fill="none" stroke="url(#shirtGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Left Hand -->
    <circle cx="84" cy="53" r="6" fill="url(#skinGrad)"/>

    <!-- Right Arm (Also raised, holding the magical breaking news paper/letter) -->
    <path d="M 138 95 C 150 85, 168 75, 160 58 C 154 48, 144 55, 142 65" fill="none" stroke="url(#shirtGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Hand -->
    <circle cx="162" cy="56" r="6" fill="url(#skinGrad)"/>

    <!-- THE NEWS LETTER / PROMPT OBJECT (Triggers the action "làm cho") -->
    <g transform="translate(145, 30) rotate(15)">
      <!-- Glowing paper drop -->
      <rect x="0" y="0" width="30" height="36" rx="3" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Fake abstract lines of joyful news -->
      <line x1="6" y1="8" x2="24" y2="8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <line x1="6" y1="15" x2="20" y2="15" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="21" x2="22" y2="21" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <!-- Glowing magical star on letter -->
      <path d="M 15 28 L 16.5 30.5 L 19 31 L 16.5 31.5 L 15 34 L 13.5 31.5 L 11 31 L 13.5 30.5 Z" fill="#f59e0b"/>
    </g>

    <!-- Character Head & Face (Ecstatic expression, mouth open wide in laughter/joy) -->
    <g transform="translate(121, 62)">
      <!-- Hair (Stylized modern neat dark hair) -->
      <path d="M -18 -12 C -20 -28, 5 -32, 16 -22 C 22 -16, 20 -5, 18 2 C 16 5, 14 -2, 11 -6 C 5 -12, -5 -12, -12 -5 C -15 -2, -16 2, -18 -12 Z" fill="#0f172a"/>

      <!-- Head Base / Skin -->
      <circle cx="0" cy="-2" r="17" fill="url(#skinGrad)"/>

      <!-- Cheeks flushing with extreme joy (pink/amber blush) -->
      <circle cx="-10" cy="2" r="4" fill="#fb7185" opacity="0.6"/>
      <circle cx="10" cy="2" r="4" fill="#fb7185" opacity="0.6"/>

      <!-- Eyes closed tightly in pure ecstasy/laughter (Happy arc eyes ^_^ style) -->
      <path d="M -10 -4 C -7 -8, -4 -4, -4 -4" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 4 -4 C 7 -8, 10 -4, 10 -4" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Eyebrows raised happily -->
      <path d="M -11 -10 C -8 -13, -5 -10, -5 -10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 5 -10 C 8 -13, 11 -10, 11 -10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Wide Open Laughing Mouth -->
      <path d="M -7 5 C -7 12, 7 12, 7 5 C 7 3, -7 3, -7 5 Z" fill="#991b1b"/>
      <!-- Happy Tongue -->
      <path d="M -4 9 C -2 12, 2 12, 4 9 C 2 8, -2 8, -4 9 Z" fill="#f43f5e"/>
    </g>
  </g>

  <!-- FOREGROUND ATMOSPHERIC DETAILS -->
  <!-- Floating energetic sparkles in foreground for action intensity -->
  <g fill="#38bdf8">
    <circle cx="95" cy="45" r="2.5" opacity="0.8"/>
    <circle cx="145" cy="40" r="2" opacity="0.9"/>
  </g>
</svg>