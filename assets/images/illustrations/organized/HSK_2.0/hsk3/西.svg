<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Sunset Glow Gradient -->
    <radialGradient id="sunGlow" cx="0.75" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Compass Gold Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glass Effect -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Sunset Glow representing the West -->
  <circle cx="180" cy="120" r="100" fill="url(#sunGlow)"/>

  <!-- Distant City Skyline & Park Context -->
  <g id="city-scape" opacity="0.65">
    <!-- Far buildings -->
    <rect x="20" y="110" width="22" height="60" fill="#334155"/>
    <rect x="45" y="90" width="30" height="80" fill="#475569"/>
    <rect x="78" y="100" width="25" height="70" fill="#334155"/>
    <!-- City park trees -->
    <circle cx="115" cy="155" r="18" fill="#065f46"/>
    <circle cx="135" cy="150" r="22" fill="#047857"/>
    <rect x="133" y="155" width="4" height="20" fill="#78350f"/>
    <!-- More buildings towards the west sunset -->
    <rect x="155" y="125" width="20" height="45" fill="#334155"/>
    <rect x="180" y="105" width="28" height="65" fill="#475569"/>
    <!-- Ground / Park promenade -->
    <path d="M0 170 Q120 160 240 170 L240 240 L0 240 Z" fill="#0f172a"/>
    <path d="M0 175 Q120 165 240 175 L240 240 L0 240 Z" fill="#1e293b"/>
  </g>

  <!-- Foreground Park Element (Bench & Glowing Path) -->
  <g id="foreground-park">
    <!-- Pathway curving towards the west -->
    <path d="M60 240 Q100 190 140 175" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M60 240 Q100 190 140 175" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Park Bench -->
    <g transform="translate(40, 165)">
      <!-- Bench legs -->
      <rect x="5" y="15" width="3" height="15" fill="#64748b"/>
      <rect x="32" y="15" width="3" height="15" fill="#64748b"/>
      <!-- Seat -->
      <rect x="2" y="12" width="36" height="4" rx="1" fill="#b45309"/>
      <!-- Backrest -->
      <rect x="2" y="2" width="36" height="8" rx="1" fill="#d97706"/>
      <rect x="5" y="4" width="30" height="2" fill="#b45309" opacity="0.5"/>
    </g>

    <!-- Foliage / Bush in foreground right -->
    <circle cx="210" cy="180" r="25" fill="#059669"/>
    <circle cx="195" cy="190" r="20" fill="#047857"/>
    <circle cx="225" cy="195" r="18" fill="#10b981"/>
  </g>

  <!-- Giant Isometric Compass / Directional Indicator Floating (Hero Element representing West) -->
  <g id="west-compass-hero" transform="translate(110, 100)">
    <!-- Compass Base Ring (3D angled disc) -->
    <ellipse cx="0" cy="20" rx="55" ry="25" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4"/>
    <ellipse cx="0" cy="18" rx="52" ry="23" fill="#1e293b" opacity="0.9"/>

    <!-- Inner markings -->
    <ellipse cx="0" cy="18" rx="42" ry="18" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

    <!-- Glowing Direction Needles -->
    <!-- North/South needle (dimmed) -->
    <polygon points="0,-12 -3,18 0,48 3,18" fill="#64748b" opacity="0.5"/>
    
    <!-- WEST Needle (Highlighted with bright energetic gradient pointing LEFT/WEST) -->
    <g filter="drop-shadow(0px 0px 8px rgba(245, 158, 11, 0.6))">
      <!-- Main glowing arrow pointing left (West) -->
      <polygon points="-65,18 -20,12 -20,24" fill="#fbbf24"/>
      <polygon points="-65,18 -35,10 -35,26" fill="#f59e0b"/>
      <!-- East counter needle (dimmed) -->
      <polygon points="25,18 10,14 10,22" fill="#38bdf8" opacity="0.6"/>
    </g>

    <!-- Center Pivot Gem -->
    <circle cx="0" cy="18" r="6" fill="url(#goldGrad)" stroke="#fff" stroke-width="1.5"/>

    <!-- Floating Glass/UI Badge Frame enclosing the compass -->
    <ellipse cx="0" cy="15" rx="65" ry="32" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7"/>
  </g>

  <!-- Floating Directional Particles / Sparks -->
  <g id="sparkles">
    <circle cx="55" cy="65" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="170" cy="45" r="2" fill="#38bdf8" opacity="0.9"/>
    <circle cx="95" cy="40" r="4" fill="#f59e0b" opacity="0.7"/>
    <path d="M 160 70 L 164 70 M 162 68 L 162 72" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 75 110 L 79 110 M 77 108 L 77 112" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Ambient Lighting Vignette / Frame Border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>