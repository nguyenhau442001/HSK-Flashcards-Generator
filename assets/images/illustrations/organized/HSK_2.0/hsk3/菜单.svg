  <circle cx="115" cy="110" r="8" fill="#fb923c"/>
  <rect x="128" y="105" width="15" height="3" rx="1.5" fill="#cbd5e1"/>
  <rect x="128" y="112" width="10" height="3" rx="1.5" fill="#cbd5e1"/>
  
  <rect x="105" y="130" width="12" height="12" rx="2" fill="#10b981"/>
  <rect x="122" y="132" width="20" height="3" rx="1.5" fill="#cbd5e1"/>
  <rect x="122" y="139" width="15" height="3" rx="1.5" fill="#cbd5e1"/>

  <circle cx="112" cy="165" r="7" fill="#ec4899"/>
  <rect x="124" y="162" width="18" height="3" rx="1.5" fill="#cbd5e1"/>

  <!-- Right Page -->
  <path d="M165 115 L185 115 L175 135 Z" fill="#f59e0b"/>
  <rect x="160" y="145" width="30" height="4" rx="2" fill="#94a3b8" opacity="0.4"/>
