  <rect x="160" y="165" width="28" height="4" rx="2" fill="#94a3b8" opacity="0.4"/>
  
  <!-- Hand Presenting the Menu -->
  <path d="M240 140 C220 140 200 150 190 170 L205 185 C215 175 230 175 240 175 Z" fill="#1e40af"/> <!-- Sleeve -->
  <path d="M190 170 C185 175 175 175 170 180 C165 185 170 195 180 195 L205 185 Z" fill="#fdba74"/> <!-- Hand -->
  <path d="M175 178 C172 178 170 182 172 185" fill="none" stroke="#e6a05e" stroke-width="1" stroke-linecap="round"/>

