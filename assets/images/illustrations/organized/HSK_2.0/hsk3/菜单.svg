      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Table Props -->
  <!-- Glass of Water -->
  <path d="M40 150 L55 150 L58 185 Q58 190 53 190 L42 190 Q37 190 37 185 Z" fill="#38bdf8" opacity="0.3"/>
  <path d="M40 155 L55 155 L56 175 L39 175 Z" fill="#38bdf8" opacity="0.5"/>
  
