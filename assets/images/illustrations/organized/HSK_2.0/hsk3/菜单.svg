  <path d="M70 185 L70 175 M72 185 L72 175 M74 185 L74 175" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="82" y="172" width="5" height="48" rx="2.5" fill="#94a3b8"/>

  <!-- The Menu (Main Subject) -->
  <!-- Menu Shadow -->
  <path d="M105 85 L215 105 L205 205 L95 185 Z" fill="#000" opacity="0.2"/>
  
  <!-- Menu Folder -->
  <path d="M100 80 L210 100 L200 200 L90 180 Z" fill="#334155"/>
  <path d="M105 85 L155 94 L145 194 L95 185 Z" fill="#f8fafc"/>
