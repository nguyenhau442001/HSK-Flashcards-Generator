<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Lamp Light Cone Gradient -->
    <linearGradient id="lamp-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Window Light Gradient -->
    <linearGradient id="window-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Floor Line -->
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="3"/>

  <!-- Cozy Rug under the chair -->
  <ellipse cx="120" cy="212" rx="60" ry="10" fill="#334155" opacity="0.6"/>

  <!-- Window with Night Sky View -->
  <g id="window">
    <rect x="150" y="30" width="65" height="85" rx="6" fill="url(#window-sky)"/>
    <!-- Stars -->
    <circle cx="165" cy="45" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="195" cy="40" r="0.8" fill="#ffffff" opacity="0.5"/>
    <circle cx="175" cy="65" r="1.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="205" cy="70" r="0.8" fill="#ffffff" opacity="0.6"/>
    <!-- Crescent Moon -->
    <path d="M 182 48 A 8 8 0 1 0 194 58 A 9.5 9.5 0 1 1 182 48 Z" fill="#fef08a"/>
    <!-- Window Frame -->
    <rect x="150" y="30" width="65" height="85" rx="6" fill="none" stroke="#1e293b" stroke-width="4"/>
    <line x1="182.5" y1="30" x2="182.5" y2="115" stroke="#1e293b" stroke-width="2"/>
    <line x1="150" y1="65" x2="215" y2="65" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Wall Art (Quiet Mountain Scene) -->
  <g id="wall-art">
    <rect x="95" y="45" width="40" height="50" rx="2" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="99" y="49" width="32" height="42" fill="#0f172a"/>
    <!-- Mountains in Art -->
    <polygon points="99,91 115,70 128,91" fill="#1e293b"/>
    <polygon points="110,91 122,78 131,91" fill="#334155"/>
    <circle cx="122" cy="62" r="3" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Bookshelf (Left Side) -->
  <g id="bookshelf">
    <rect x="20" y="40" width="55" height="160" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Shelves -->
    <line x1="20" y1="90" x2="75" y2="90" stroke="#334155" stroke-width="2"/>
    <line x1="20" y1="140" x2="75" y2="140" stroke="#334155" stroke-width="2"/>
    
    <!-- Books Top Shelf -->
    <rect x="25" y="60" width="8" height="30" fill="#ec4899" rx="1"/>
    <rect x="35" y="55" width="10" height="35" fill="#38bdf8" rx="1"/>
    <rect x="47" y="65" width="7" height="25" fill="#10b981" rx="1"/>
    <path d="M 56 90 L 68 75 L 72 78 L 60 93 Z" fill="#fb923c"/>
    
    <!-- Books Middle Shelf -->
    <rect x="25" y="110" width="9" height="30" fill="#f59e0b" rx="1"/>
    <rect x="36" y="105" width="8" height="35" fill="#a855f7" rx="1"/>
    <rect x="46" y="115" width="11" height="25" fill="#38bdf8" rx="1"/>
    <rect x="59" y="110" width="10" height="30" fill="#ec4899" rx="1"/>
    
    <!-- Books Bottom Shelf -->
    <rect x="25" y="160" width="12" height="30" fill="#10b981" rx="1"/>
    <rect x="40" y="155" width="8" height="35" fill="#fb923c" rx="1"/>
    <rect x="50" y="165" width="10" height="25" fill="#f59e0b" rx="1"/>
  </g>

  <!-- Potted Plant (Left Foreground) -->
  <g id="plant">
    <path d="M 14 215 L 26 215 L 29 195 L 11 195 Z" fill="#475569"/>
    <!-- Leaves -->
    <path d="M 20 195 Q 8 180 3 185 Q 10 192 20 195" fill="#10b981"/>
    <path d="M 20 195 Q 20 172 25 175 Q 23 188 20 195" fill="#059669"/>
    <path d="M 20 195 Q 32 180 35 186 Q 28 192 20 195" fill="#10b981"/>
  </g>

  <!-- Cozy Armchair -->
  <g id="armchair">
    <!-- Chair Legs -->
    <line x1="95" y1="195" x2="90" y2="212" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="135" y1="195" x2="140" y2="212" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Backrest -->
    <path d="M 85 125 C 85 110, 145 110, 145 125 L 140 175 L 90 175 Z" fill="#0e7490"/>
    
    <!-- Armrests -->
    <path d="M 80 150 C 80 140, 95 140, 95 150 L 90 180 C 90 185, 80 185, 80 180 Z" fill="#0891b2"/>
    <path d="M 135 150 C 135 140, 150 140, 150 150 L 140 180 C 140 185, 130 185, 130 180 Z" fill="#0891b2"/>
    
    <!-- Main Seat Cushion -->
    <rect x="90" y="165" width="50" height="20" rx="6" fill="#06b6d4"/>
    
    <!-- Soft Throw Pillow -->
    <path d="M 122 152 L 138 157 L 135 173 L 119 168 Z" fill="#f43f5e"/>
  </g>

  <!-- Sleeping Cat on the Armchair -->
  <g id="sleeping-cat">
    <!-- Cat Body -->
    <ellipse cx="110" cy="173" rx="13" ry="9" fill="#f97316"/>
    <!-- Cat Head -->
    <circle cx="119" cy="169" r="6.5" fill="#f97316"/>
    <!-- Cat Ears -->
    <polygon points="115,164 118,158 120,164" fill="#ea580c"/>
    <polygon points="120,164 123,158 125,164" fill="#ea580c"/>
    <!-- Sleeping Eyes -->
    <path d="M 117 170 Q 119 171.5 121 170" fill="none" stroke="#7c2d12" stroke-width="1" stroke-linecap="round"/>
    <path d="M 122 170 Q 124 171.5 126 170" fill="none" stroke="#7c2d12" stroke-width="1" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M 98 175 Q 102 182 110 180" fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Soft Back Highlight from Lamp -->
    <path d="M 102 168 A 10 7 0 0 1 118 165" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Side Table with Steaming Mug -->
  <g id="side-table">
    <!-- Table Structure -->
    <rect x="152" y="172" width="26" height="4" rx="2" fill="#78350f"/>
    <line x1="157" y1="176" x2="154" y2="210" stroke="#78350f" stroke-width="2"/>
    <line x1="172" y1="176" x2="175" y2="210" stroke="#78350f" stroke-width="2"/>
    
    <!-- Steaming Mug -->
    <rect x="156" y="164" width="7" height="8" rx="1" fill="#38bdf8"/>
    <path d="M 163 166 C 165 166, 165 170, 163 170" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- Steam Trails -->
    <path d="M 158 160 Q 157 157 159 154" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <path d="M 161 160 Q 162 157 161 154" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Floor Lamp & Warm Light Cone -->
  <g id="floor-lamp">
    <!-- Lamp Base & Pole -->
    <line x1="190" y1="110" x2="190" y2="210" stroke="#475569" stroke-width="3"/>
    <path d="M 180 210 L 200 210" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Lamp Shade -->
    <path d="M 180 110 L 200 110 L 206 92 L 174 92 Z" fill="#f59e0b"/>
    <!-- Light Bulb -->
    <circle cx="190" cy="111" r="5" fill="#fef08a"/>

    <!-- Light Beam Overlay (Screen Blend) -->
    <polygon points="190,111 65,230 240,230" fill="url(#lamp-glow)" style="mix-blend-mode: screen;"/>
    <polygon points="190,111 110,230 240,230" fill="url(#lamp-glow)" style="mix-blend-mode: screen;"/>
  </g>

  <!-- Ambient Light Highlights (To make the scene feel cozy and integrated) -->
  <!-- Highlight on Armchair Edge -->
  <path d="M 135 150 C 135 142, 148 142, 148 150" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.4"/>
  <!-- Highlight on Side Table -->
  <ellipse cx="165" cy="173" rx="10" ry="1" fill="#fef08a" opacity="0.3"/>
</svg>