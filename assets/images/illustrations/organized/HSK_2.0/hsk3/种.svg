<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm Amber Glow behind display stand -->
    <radialGradient id="amberGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Fruit Gradients -->
    <linearGradient id="watermelonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="kiwiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>

    <!-- UI/Podium Gradients -->
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>
  <rect width="240" height="240" rx="24" fill="url(#amberGlow)" style="mix-blend-mode: screen;"/>

  <!-- Atmospheric Background Elements (Store shelves / ambient light) -->
  <g opacity="0.15">
    <path d="M 30,50 L 210,50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 12"/>
    <path d="M 40,80 L 200,80" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 8"/>
  </g>

  <!-- Main Display Counter / Stand -->
  <g filter="url(#shadow)">
    <!-- Counter Base -->
    <path d="M 45,170 L 195,170 L 215,210 L 25,210 Z" fill="url(#trayGrad)"/>
    <!-- Counter Top Ellipse/Surface -->
    <ellipse cx="120" cy="170" rx="75" ry="18" fill="#475569"/>
    <!-- Glowing LED Accent on Counter -->
    <path d="M 52,178 L 188,178" stroke="url(#accentGlow)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)"/>
  </g>

  <!-- Category Divider Slots (representing 'Loại/Giống' sorting partitions) -->
  <g opacity="0.4" stroke="#0f172a" stroke-width="2" stroke-linecap="round">
    <line x1="75" y1="162" x2="65" y2="185"/>
    <line x1="120" y1="165" x2="120" y2="190"/>
    <line x1="165" y1="162" x2="175" y2="185"/>
  </g>

  <!-- === DIFFERENT TYPES (种) OF FRUIT (MAIN SUBJECTS) === -->

  <!-- TYPE 1: Watermelon Segment (Green/Fresh Type) -->
  <g class="fruit-item" filter="url(#shadow)" transform="translate(-15, 10)">
    <!-- Shadow -->
    <ellipse cx="75" cy="172" rx="18" ry="6" fill="#000000" opacity="0.6"/>
    <!-- Watermelon Wedge -->
    <path d="M 60,150 C 70,130 90,130 100,150 Z" fill="url(#watermelonGrad)"/>
    <path d="M 56,152 C 68,126 92,126 104,152 C 92,157 68,157 56,152 Z" fill="#f43f5e"/>
    <!-- Rind Layer -->
    <path d="M 56,152 C 68,157 92,157 104,152 L 102,156 C 90,161 70,161 58,156 Z" fill="#10b981"/>
    <!-- Seeds -->
    <circle cx="76" cy="144" r="1.5" fill="#0f172a"/>
    <circle cx="84" cy="146" r="1.5" fill="#0f172a"/>
  </g>

  <!-- TYPE 2: Exotic Dragon Fruit (Pink/Unique Type) -->
  <g class="fruit-item" filter="url(#shadow)" transform="translate(0, -5)">
    <!-- Shadow -->
    <ellipse cx="120" cy="168" rx="22" ry="7" fill="#000000" opacity="0.6"/>
    <!-- Main Body -->
    <circle cx="120" cy="142" r="22" fill="url(#dragonGrad)"/>
    <!-- Spiky Leaves (characteristic of dragon fruit) -->
    <path d="M 105,130 L 92,120 L 102,138 Z" fill="#34d399"/>
    <path d="M 135,130 L 148,120 L 138,138 Z" fill="#34d399"/>
    <path d="M 138,150 L 152,155 L 138,142 Z" fill="#34d399"/>
    <path d="M 102,150 L 88,155 L 102,142 Z" fill="#34d399"/>
    <!-- Highlights -->
    <circle cx="113" cy="135" r="4" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- TYPE 3: Citrus Orange (Round/Juicy Type) -->
  <g class="fruit-item" filter="url(#shadow)" transform="translate(15, 8)">
    <!-- Shadow -->
    <ellipse cx="165" cy="170" rx="19" ry="6" fill="#000000" opacity="0.6"/>
    <!-- Orange Body -->
    <circle cx="165" cy="148" r="19" fill="url(#orangeGrad)"/>
    <!-- Stem & Leaf -->
    <path d="M 165,129 C 165,125 168,123 172,122" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 169,124 C 176,120 178,126 174,129 C 171,131 169,124 169,124 Z" fill="#10b981"/>
    <!-- Texture Dots & Highlight -->
    <circle cx="158" cy="140" r="1.5" fill="#ea580c" opacity="0.5"/>
    <circle cx="172" cy="155" r="1.5" fill="#ea580c" opacity="0.5"/>
    <circle cx="159" cy="142" r="3" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- TYPE 4: Sliced Kiwi (Fuzzy/Green Interior Type) - Partially tucked in front -->
  <g class="fruit-item" filter="url(#shadow)" transform="translate(-30, 15)">
    <ellipse cx="100" cy="172" rx="16" ry="12" fill="#78350f"/>
    <ellipse cx="100" cy="172" rx="13" ry="9" fill="url(#kiwiGrad)"/>
    <!-- Kiwi center star pattern -->
    <circle cx="100" cy="172" r="3" fill="#fef08a"/>
    <path d="M 100,169 L 100,175 M 97,172 L 103,172" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Floating Holographic/UI Sorting Indicators (Visually reinforcing "Classification/Sort/Types") -->
  <g transform="translate(120, 52)" filter="url(#shadow)">
    <!-- Hologram Base Glow -->
    <ellipse cx="0" cy="8" rx="35" ry="10" fill="#38bdf8" opacity="0.15" filter="url(#softGlow)"/>

    <!-- Floating Cards/Tags representing different categories/varieties -->
    <!-- Center Prominent Tag -->
    <g transform="translate(0, -10)">
      <rect x="-24" y="-14" width="48" height="28" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <!-- Internal icon representing sorting/variety grid -->
      <circle cx="-10" cy="0" r="3.5" fill="#f59e0b"/>
      <rect x="-3" y="-3" width="16" height="6" rx="2" fill="#38bdf8" opacity="0.8"/>
    </g>

    <!-- Left Floating Mini Tag -->
    <g transform="translate(-42, 2) scale(0.75)" opacity="0.85">
      <rect x="-20" y="-12" width="40" height="24" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#10b981"/>
    </g>

    <!-- Right Floating Mini Tag -->
    <g transform="translate(42, 2) scale(0.75)" opacity="0.85">
      <rect x="-20" y="-12" width="40" height="24" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#f43f5e"/>
    </g>

    <!-- Connecting Energy Nodes/Lines -->
    <path d="M -28,-3 L -16,-8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 28,-3 L 16,-8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Sparkling / Atmospheric Highlights -->
  <g fill="#fbbf24">
    <path d="M 35,90 Q 35,95 30,95 Q 35,95 35,100 Q 35,95 40,95 Q 35,95 35,90 Z" opacity="0.8"/>
    <path d="M 205,75 Q 205,79 201,79 Q 205,79 205,83 Q 205,79 209,79 Q 205,79 205,75 Z" opacity="0.6"/>
    <path d="M 180,45 Q 180,48 177,48 Q 180,48 180,51 Q 180,48 183,48 Q 180,48 180,45 Z" opacity="0.9"/>
  </g>
</svg>