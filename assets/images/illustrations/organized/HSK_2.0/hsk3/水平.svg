<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <g opacity="0.15">
    <circle cx="120" cy="110" r="80" fill="none" stroke="#38bdf8" stroke-dasharray="4 8" stroke-width="1.5"/>
    <circle cx="120" cy="110" r="60" fill="none" stroke="#10b981" stroke-width="1"/>
    <line x1="40" y1="110" x2="200" y2="110" stroke="#64748b" stroke-dasharray="2 4" stroke-width="1"/>
    <line x1="120" y1="30" x2="120" y2="190" stroke="#64748b" stroke-dasharray="2 4" stroke-width="1"/>
  </g>

  <!-- Environment/Desk Platform -->
  <path d="M 30,190 L 210,190 L 190,210 L 50,210 Z" fill="#0f172a" opacity="0.6"/>
  <ellipse cx="120" cy="190" rx="90" ry="12" fill="#334155" opacity="0.5"/>

  <!-- LEVEL/WATERPASS CONCEPT (Spirit-Level/Instrument & Progression Theme) -->
  <!-- Main Scientific/Modern Display Setup representing 'Level/Standard' -->
  
  <!-- Stand Structure -->
  <path d="M 95,190 L 105,140 L 135,140 L 145,190 Z" fill="#334155"/>
  <rect x="90" y="185" width="60" height="8" rx="3" fill="#475569"/>

  <!-- Holographic Projection Base -->
  <ellipse cx="120" cy="140" rx="35" ry="8" fill="#10b981" opacity="0.3" filter="url(#glow)"/>

  <!-- Main Water Level Tool (Floating dynamically at an angle showing mastery/high level) -->
  <g transform="rotate(-8 120 100)">
    <!-- Tool Body -->
    <rect x="60" y="85" width="120" height="30" rx="15" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <rect x="68" y="91" width="104" height="18" rx="9" fill="#1e293b"/>
    
    <!-- Scale Marks inside tool -->
    <line x1="90" y1="95" x2="90" y2="105" stroke="#64748b" stroke-width="1.5"/>
    <line x1="120" y1="93" x2="120" y2="107" stroke="#38bdf8" stroke-width="2"/>
    <line x1="150" y1="95" x2="150" y2="105" stroke="#64748b" stroke-width="1.5"/>

    <!-- Central Bubble Vial (The exact level indicator - perfectly centered!) -->
    <rect x="105" y="93" width="30" height="14" rx="7" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <!-- Liquid inside vial -->
    <rect x="107" y="95" width="26" height="10" rx="5" fill="#38bdf8" opacity="0.6"/>
    <!-- The Bubble (Centered = High Level/Achieved) -->
    <circle cx="120" cy="100" r="4.5" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="118.5" cy="98.5" r="1.5" fill="#bae6fd"/>
  </g>

  <!-- Floating Level Progression Pillars / Steps in background -->
  <g transform="translate(0, 10)">
    <!-- Step 1 (Low) -->
    <rect x="45" y="130" width="20" height="40" rx="4" fill="#334155" opacity="0.7"/>
    <rect x="48" y="135" width="14" height="6" rx="2" fill="#64748b"/>
    
    <!-- Step 2 (Medium) -->
    <rect x="175" y="110" width="20" height="60" rx="4" fill="#334155" opacity="0.8"/>
    <rect x="178" y="115" width="14" height="6" rx="2" fill="#f59e0b"/>

    <!-- Step 3 (Peak / High Level Achievement) -->
    <g transform="translate(0, -15)">
      <rect x="110" y="55" width="20" height="85" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>
      <rect x="113" y="62" width="14" height="6" rx="2" fill="#ffffff" opacity="0.8"/>
      <rect x="113" y="74" width="14" height="6" rx="2" fill="#ffffff" opacity="0.6"/>
      <rect x="113" y="86" width="14" height="6" rx="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- Floating Achievement / Success Sparkles & Indicators -->
  <g fill="#fbbf24">
    <!-- Star 1 Top Right -->
    <path d="M 185,45 L 187,52 L 194,54 L 187,56 L 185,63 L 183,56 L 176,54 L 183,52 Z" filter="url(#glow)"/>
    <!-- Star 2 Left -->
    <path d="M 55,75 L 56.5,80 L 61,81.5 L 56.5,83 L 55,88 L 53.5,83 L 49,81.5 L 53.5,80 Z" opacity="0.8"/>
  </g>

  <!-- Glowing Energy Particles / Ascending bubbles -->
  <circle cx="85" cy="70" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="155" cy="55" r="4" fill="#10b981" filter="url(#glow)"/>
  <circle cx="100" cy="45" r="2" fill="#fb923c" opacity="0.9"/>
  <circle cx="140" cy="35" r="2.5" fill="#38bdf8" opacity="0.8"/>

  <!-- Dynamic Arrow / Upward Progress Vector (Stylized graphic line indicating rising level) -->
  <path d="M 75,150 Q 95,130 110,120" fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="3" stroke-dasharray="6 4" opacity="0.8"/>
  <path d="M 102,118 L 112,116 L 110,126" fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>

  <!-- Foreground Atmospheric Glow & Vignette -->
  <circle cx="120" cy="100" r="90" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.1"/>
</svg>