<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Room Lighting & Wallpaper Details -->
  <circle cx="180" cy="70" r="80" fill="url(#lampGlow)"/>
  <path d="M0 170 H240" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Desk Surface -->
  <path d="M20 180 L220 180 L230 210 L10 210 Z" fill="#090d16"/>
  <path d="M20 180 L220 180" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Window showing night/evening -->
  <path d="M25 40 H75 V140 H25 Z" fill="#090d16" stroke="#334155" stroke-width="4" rx="4"/>
  <path d="M50 40 V140" stroke="#334155" stroke-width="2"/>
  <path d="M25 90 H75" stroke="#334155" stroke-width="2"/>
  <!-- Stars outside -->
  <circle cx="35" cy="55" r="1.5" fill="#f8fafc"/>
  <circle cx="65" cy="75" r="2" fill="#f8fafc"/>
  <circle cx="40" cy="115" r="1" fill="#f8fafc"/>

  <!-- Alarm Clock (Showing late time / reminding element) -->
  <g transform="translate(185, 130)">
    <!-- Clock Body -->
    <circle cx="0" cy="0" r="18" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#f8fafc"/>
    <!-- Clock Hands -->
    <path d="M0 0 L0 -7" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 0 L5 3" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Feet & Bells -->
    <path d="M-8 15 L-12 20 M8 15 L12 20" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-10 -12 L-6 -7 M10 -12 L6 -7" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6 -15 H6" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Open Book (Resting on desk) -->
  <g transform="translate(100, 155)">
    <path d="M-30 15 C-15 10, 0 15, 0 25 C0 15, 15 10, 30 15 L25 -5 C10 -10, 0 -5, 0 5 C0 -5, -10 -10, -25 -5 Z" fill="#e2e8f0"/>
    <!-- Page lines -->
    <path d="M-20 5 L-5 10 M-20 0 L-8 4 M10 10 L20 5 M8 4 L20 0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0 5 V25" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Desk Lamp -->
  <g transform="translate(180, 120)">
    <path d="M0 60 H20" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 60 L10 20" stroke="#64748b" stroke-width="3"/>
    <path d="M10 20 L25 15" stroke="#64748b" stroke-width="3"/>
    <!-- Lamp Shade -->
    <path d="M10 10 L-5 -10 H35 L20 10 Z" fill="#fbbf24"/>
    <!-- Light cone -->
    <path d="M0 10 L-30 65 H50 Z" fill="url(#glowGrad)"/>
  </g>

  <!-- Main Character (Sleepy student / worker being reminded to rest) -->
  <g transform="translate(110, 95)">
    <!-- Chair Back -->
    <path d="M-35 85 C-35 15, -35 -5, -25 -15 H-5 C5 -15, 5 -5, 5 85 Z" fill="#334155"/>
    <path d="M-30 10 H0 V70 H-30 Z" fill="#1e293b" opacity="0.5"/>

    <!-- Body / Hoodie -->
    <path d="M-30 85 C-30 55, -20 40, -5 40 C10 40, 20 55, 20 85 Z" fill="#38bdf8"/>
    <!-- Hoodie Strings / Details -->
    <path d="M-8 45 L-12 60 M-2 45 L2 60" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>

    <!-- Head & Face -->
    <g transform="translate(-5, 20)">
      <!-- Hair -->
      <path d="M-18 -2 C-18 -15, 10 -18, 15 -2 C20 10, 15 15, -10 15 C-20 15, -18 5, -18 -2 Z" fill="#0f172a"/>
      <!-- Face Skin -->
      <circle cx="-2" cy="5" r="14" fill="#fed7aa"/>
      
      <!-- Tired / Sleepy Closed Eyes (Curved arcs showing need for rest) -->
      <path d="M-9 3 C-7 6, -5 6, -3 3" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M3 3 C5 6, 7 6, 9 3" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Rosy Tired Cheeks -->
      <circle cx="-10" cy="8" r="3" fill="#fca5a5" opacity="0.6"/>
      <circle cx="6" cy="8" r="3" fill="#fca5a5" opacity="0.6"/>

      <!-- Gentle Yawning Mouth -->
      <ellipse cx="-2" cy="11" rx="3" ry="4" fill="#7c2d12"/>

      <!-- Hand resting supporting head -->
      <path d="M-18 20 C-15 15, -12 12, -8 15 C-6 17, -10 25, -15 25 Z" fill="#fed7aa"/>
      <path d="M-18 20 L-22 28 C-25 30, -20 35, -15 30 L-13 25" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Expressive "Action / Reminder" Floating Element (Stylized glowing checkmark/shield representing "You should/ought to") -->
  <g transform="translate(45, 65)">
    <circle cx="0" cy="0" r="22" fill="#10b981" opacity="0.2"/>
    <circle cx="0" cy="0" r="16" fill="#10b981"/>
    <!-- Checkmark representing the right action / "should do" -->
    <path d="M-6 0 L-2 5 L8 -5" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Action sparkles -->
    <path d="M22 -10 L25 -15 L28 -10 L25 -5 Z" fill="#fbbf24"/>
    <path d="M-20 -18 L-18 -22 L-16 -18 L-18 -14 Z" fill="#fbbf24"/>
  </g>

  <!-- Floating Gentle Zzz's (Indicating sleepiness / time to rest) -->
  <g fill="#93c5fd" font-family="sans-serif" font-weight="bold">
    <text x="75" y="60" font-size="16" opacity="0.8">Z</text>
    <text x="88" y="45" font-size="12" opacity="0.6">z</text>
    <text x="96" y="32" font-size="8" opacity="0.4">z</text>
  </g>

</svg>