<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <defs>
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Basketball Court Environment -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#courtGrad)"/>
  <path d="M0 170 Q120 155 240 170" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M40 240 L100 160 M200 240 L140 160" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  
  <!-- Background Hoop -->
  <rect x="195" y="60" width="30" height="22" rx="2" fill="#334155"/>
  <rect x="200" y="65" width="20" height="12" rx="1" stroke="#94a3b8" fill="none" stroke-width="1"/>
  <path d="M202 82 L218 82 L215 95 L205 95 Z" fill="none" stroke="#f8fafc" stroke-width="1" opacity="0.8"/>
  <circle cx="210" cy="82" r="8" fill="none" stroke="#fb923c" stroke-width="1.5"/>

  <!-- Background Players (Silhouettes) -->
  <g opacity="0.4">
    <path d="M150 145 Q155 130 160 145 L162 165 L148 165 Z" fill="#38bdf8"/>
    <circle cx="155" cy="125" r="5" fill="#38bdf8"/>
    <path d="M175 120 Q180 105 185 120 L187 140 L173 140 Z" fill="#10b981"/>
    <circle cx="180" cy="100" r="5" fill="#10b981"/>
    <circle cx="178" cy="85" r="4" fill="#fb923c"/> <!-- Ball in air -->
  </g>

  <!-- Main Character: The "Participant" joining the game -->
  <g>
    <!-- Leg stepping onto court -->
    <path d="M85 205 L105 225 L120 222 L100 200 Z" fill="#334155"/> <!-- Back leg -->
    <path d="M115 210 L135 235 L155 230 L130 205 Z" fill="#475569"/> <!-- Front leg stepping in -->
    <path d="M135 235 L155 230 L158 235 L138 240 Z" fill="#f8fafc"/> <!-- Shoe -->
    
    <!-- Body and Action: Putting on the team jersey -->
    <path d="M85 140 Q110 130 135 140 L140 210 Q110 220 80 210 Z" fill="#1e40af"/> <!-- Undershirt -->
    
    <!-- The Orange Jersey (The symbol of joining the team) -->
    <path d="M82 145 Q110 135 138 145 L142 195 Q110 205 78 195 Z" fill="#fb923c"/>
    <path d="M82 145 L90 130 M138 145 L130 130" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Head and Expression -->
    <circle cx="110" cy="115" r="18" fill="#fde68a"/>
    <path d="M102 115 Q110 122 118 115" stroke="#1e293b" stroke-width="1.5" fill="none"/> <!-- Smile -->
    <ellipse cx="105" cy="110" rx="1.5" ry="2" fill="#1e293b"/>
    <ellipse cx="115" cy="110" rx="1.5" ry="2" fill="#1e293b"/>
    <path d="M92 110 Q110 85 128 110" fill="#475569"/> <!-- Hair -->

    <!-- Arms pulling jersey down -->
    <path d="M85 140 L70 120 L80 110" stroke="#fde68a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M135 140 L150 120 L140 110" stroke="#fde68a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M75 115 Q80 105 90 115" fill="#fde68a"/> <!-- Hand grabbing jersey -->
    <path d="M145 115 Q140 105 130 115" fill="#fde68a"/> <!-- Hand grabbing jersey -->
  </g>

  <!-- Lighting and Atmosphere -->
  <circle cx="120" cy="40" r="80" fill="url(#glow)"/>
  <g opacity="0.5">
    <path d="M40 170 L50 165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M35 180 L45 175" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Foreground Detail -->
  <path d="M10 240 Q40 230 80 240" stroke="#334155" stroke-width="4" fill="none" opacity="0.5"/>
</svg>