<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Café Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Coffee Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    
    <!-- Clock Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Background Details: Cozy Café Wall -->
  <!-- Wooden Shelf -->
  <rect x="25" y="55" width="190" height="6" rx="2" fill="#334155" />
  <!-- Small plant on shelf -->
  <path d="M 40 55 L 45 40 L 55 40 L 60 55 Z" fill="#10b981" opacity="0.8" />
  <circle cx="50" cy="37" r="10" fill="#059669" />

  <!-- Wall Art Frame -->
  <rect x="175" y="25" width="35" height="25" rx="3" fill="#334155" />
  <rect x="178" y="28" width="29" height="19" rx="1" fill="#475569" />
  <circle cx="192" cy="37" r="5" fill="#fbbf24" opacity="0.8" />

  <!-- Warm Light Spill from Window/Door -->
  <polygon points="0,240 0,80 120,240" fill="url(#windowLight)" />

  <!-- Table Surface -->
  <path d="M 10 190 L 230 190 L 220 230 L 20 230 Z" fill="#0f172a" />
  <rect x="10" y="185" width="220" height="6" rx="3" fill="#475569" />
  <rect x="15" y="191" width="210" height="39" fill="#334155" opacity="0.3" />

  <!-- MAIN SUBJECT: Vintage Table Clock (Representing 'a short while / a moment') -->
  <!-- Clock Shadow -->
  <ellipse cx="120" cy="192" rx="35" ry="8" fill="#020617" opacity="0.6" />

  <!-- Clock Stands / Feet -->
  <path d="M 102 185 L 95 192 L 107 192 Z" fill="#94a3b8" />
  <path d="M 138 185 L 145 192 L 133 192 Z" fill="#94a3b8" />

  <!-- Clock Body (Teal/Cyan modern-retro) -->
  <circle cx="120" cy="155" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />
  <circle cx="120" cy="155" r="28" fill="#1e293b" />

  <!-- Clock Face Markings -->
  <line x1="120" y1="130" x2="120" y2="133" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="120" y1="177" x2="120" y2="180" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="95" y1="155" x2="98" y2="155" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="142" y1="155" x2="145" y2="155" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Clock Hands (Showing a very short passing of time - just a small tick) -->
  <line x1="120" y1="155" x2="120" y2="140" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <line x1="120" y1="155" x2="133" y2="150" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <circle cx="120" cy="155" r="3" fill="#f8fafc" />

  <!-- Clock Top Details (Bells / Winder) -->
  <path d="M 112 124 Q 120 118 128 124 Z" fill="#38bdf8" />
  <circle cx="120" cy="116" r="4" fill="#94a3b8" />
  <circle cx="95" cy="132" r="7" fill="#38bdf8" opacity="0.8" />
  <circle cx="145" cy="132" r="7" fill="#38bdf8" opacity="0.8" />

  <!-- CONTEXTUAL PROPS: Steaming Coffee Mug (Waiting prop) -->
  <!-- Mug Shadow -->
  <ellipse cx="65" cy="190" rx="18" ry="5" fill="#020617" opacity="0.5" />
  <!-- Saucer -->
  <ellipse cx="65" cy="188" rx="22" ry="6" fill="#cbd5e1" />
  <!-- Mug Body -->
  <path d="M 50 160 L 80 160 L 76 186 L 54 186 Z" fill="#ec4899" />
  <!-- Mug Rim -->
  <ellipse cx="65" cy="160" rx="15" ry="4" fill="#f472b6" />
  <ellipse cx="65" cy="160" rx="12" ry="2.5" fill="#701a75" />
  <!-- Mug Handle -->
  <path d="M 78 165 C 88 165, 88 181, 74 182" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" />

  <!-- Steam wisps rising from coffee (indicates 'waiting for a moment') -->
  <path d="M 60 150 Q 55 140, 65 130 T 60 110" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 70 152 Q 75 142, 68 132 T 72 115" fill="none" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- CONTEXTUAL PROPS: Open Book / Menu (Passing a moment while waiting) -->
  <!-- Book Shadow -->
  <ellipse cx="170" cy="190" rx="25" ry="6" fill="#020617" opacity="0.5" />
  <!-- Open Book Base -->
  <path d="M 145 185 Q 170 178 195 185 L 190 195 Q 170 188 150 195 Z" fill="#f8fafc" />
  <path d="M 145 185 C 160 183, 170 183, 195 185 L 190 195 C 170 190, 160 190, 150 195 Z" fill="#e2e8f0" />
  <!-- Book Spine/Center fold -->
  <line x1="170" y1="181" x2="170" y2="193" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Abstract lines representing text on pages -->
  <line x1="150" y1="187" x2="164" y2="188" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="152" y1="190" x2="162" y2="191" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  <line x1="176" y1="187" x2="188" y2="188" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="176" y1="190" x2="186" y2="191" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />

  <!-- Dynamic floating "moment/time passing" decorative sparkles -->
  <g transform="translate(15, -10)">
    <path d="M 100 110 Q 105 110, 105 105 Q 105 110, 110 110 Q 105 110, 105 115 Q 105 110, 100 110 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M 145 100 Q 148 100, 148 97 Q 148 100, 151 100 Q 148 100, 148 103 Q 148 100, 145 100 Z" fill="#38bdf8" opacity="0.8" />
    <circle cx="130" cy="100" r="1.5" fill="#f8fafc" opacity="0.6" />
  </g>
</svg>