<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Dress Gradient (Vibrant Pink/Coral) -->
    <linearGradient id="dressGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Dress Highlight Gradient -->
    <linearGradient id="dressHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Wood Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#030712" flood-opacity="0.5" />
    </filter>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Spotlight & Atmosphere -->
  <circle cx="120" cy="110" r="110" fill="url(#spotlight)" />
  
  <!-- Wall panelling line / Architectural detail -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />

  <!-- Background Props: Indoor Plant (Monstera-style leaf) -->
  <g transform="translate(35, 110)">
    <!-- Pot -->
    <path d="M12 45 L20 75 C20 78, 32 78, 32 75 L40 45 Z" fill="#cbd5e1" filter="url(#shadow)" />
    <ellipse cx="26" cy="45" rx="14" ry="4" fill="#94a3b8" />
    <!-- Leaves -->
    <path d="M26 45 C10 30, -5 40, 0 20 C5 5, 20 15, 26 45 Z" fill="url(#leafGrad)" />
    <path d="M26 45 C35 25, 50 20, 55 35 C60 50, 40 45, 26 45 Z" fill="#10b981" />
  </g>

  <!-- Background Props: Modern Floor Lamp -->
  <g transform="translate(195, 60)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <path d="M -12 -10 L 12 -10 L 6 12 L -6 12 Z" fill="#fbbf24" filter="url(#softGlow)" />
    <circle cx="0" cy="120" r="8" fill="#334155" />
  </g>

  <!-- Floor and Reflection Surface -->
  <rect x="0" y="180" width="240" height="60" fill="url(#floorGrad)" />

  <!-- MAIN SUBJECT: The Dress (Cái váy) on a sleek modern display mannequin stand -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Mannequin Stand / Hanger stem -->
    <line x1="120" y1="40" x2="120" y2="180" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="120" cy="180" rx="22" ry="6" fill="#475569" />
    <circle cx="120" cy="40" r="6" fill="#94a3b8" />

    <!-- DRESS (裙子) -->
    <!-- Neckline & Straps -->
    <path d="M 104 55 Q 120 62 136 55 L 139 50 Q 120 46 101 50 Z" fill="#fb7185" />
    <path d="M 104 55 L 98 46 C 101 44, 105 47, 108 51 Z" fill="#f43f5e" />
    <path d="M 136 55 L 142 46 C 139 44, 135 47, 132 51 Z" fill="#f43f5e" />

    <!-- Bodice -->
    <path d="M 101 53 Q 120 58 139 53 L 144 88 Q 120 92 96 88 Z" fill="url(#dressGrad)" />

    <!-- Pleated Flared Skirt (Dynamic flow) -->
    <path d="M 96 88 Q 120 92 144 88 L 175 168 Q 120 182 65 168 Z" fill="url(#dressGrad)" />
    
    <!-- Fabric folds / Pleat lines for rich vector depth -->
    <path d="M 120 90 L 120 176" stroke="#9f1239" stroke-width="2" stroke-opacity="0.5" />
    <path d="M 104 89 L 90 171" stroke="#9f1239" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 136 89 L 150 171" stroke="#9f1239" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 85 88 L 68 165" stroke="#ffe4e6" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 155 88 L 172 165" stroke="#ffe4e6" stroke-width="1" stroke-opacity="0.3" />

    <!-- Soft lighting highlight on the left side of the dress -->
    <path d="M 101 53 Q 120 58 120 90 L 120 176 Q 90 172 65 168 L 96 88 Q 98 70 101 53 Z" fill="url(#dressHighlight)" style="mix-blend-mode: overlay;" />

    <!-- Decorative Waist Ribbon / Bow -->
    <path d="M 96 88 Q 120 95 144 88 L 145 95 Q 120 102 95 95 Z" fill="#fda4af" />
    <circle cx="120" cy="92" r="5" fill="#f43f5e" />
    <!-- Bow loops -->
    <path d="M 115 90 C 105 82, 100 95, 115 95 Z" fill="#fda4af" />
    <path d="M 125 90 C 135 82, 140 95, 125 95 Z" fill="#fda4af" />
  </g>

  <!-- Foreground Props: Fashion Accessories Box & Shoes on Floor -->
  <g transform="translate(145, 175)" filter="url(#shadow)">
    <!-- Shoebox -->
    <rect x="0" y="10" width="35" height="20" rx="3" fill="#38bdf8" />
    <rect x="-2" y="7" width="39" height="6" rx="2" fill="#0ea5e9" />
    <!-- Little ribbon on box -->
    <line x1="17" y1="7" x2="17" y2="30" stroke="#f43f5e" stroke-width="3" />
  </g>

  <!-- Chic High Heel Shoe -->
  <g transform="translate(60, 185)" filter="url(#shadow)">
    <path d="M 0 10 C 10 10, 22 5, 25 0 C 27 -5, 23 -8, 20 -8 C 15 -8, 10 2, 0 5 Z" fill="#f59e0b" />
    <line x1="22" y1="-2" x2="28" y2="15" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating playful sparkles/dots for joyful atmosphere -->
  <circle cx="75" cy="80" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="165" cy="70" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="155" cy="120" r="1.5" fill="#f43f5e" opacity="0.7" />
  <circle cx="85" cy="140" r="2.5" fill="#34d399" opacity="0.8" />
</svg>