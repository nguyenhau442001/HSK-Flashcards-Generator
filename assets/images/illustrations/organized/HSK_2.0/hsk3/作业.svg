<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Open Math Notebook Pages Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lamp Glow Scene Lighting -->
  <circle cx="120" cy="80" r="110" fill="url(#lampGlow)" />

  <!-- Background Room Elements (Bookshelf / Wall art hint) -->
  <rect x="35" y="30" width="30" height="8" rx="2" fill="#334155" opacity="0.5" />
  <rect x="175" y="45" width="24" height="6" rx="2" fill="#334155" opacity="0.4" />
  <path d="M185 51 L195 70 L175 70 Z" fill="#10b981" opacity="0.3" />

  <!-- Wooden Desk Surface -->
  <path d="M 0 165 Q 120 155 240 165 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <path d="M 0 165 Q 120 155 240 165" stroke="#475569" stroke-width="2" fill="none" />

  <!-- MAIN SCENE: Homework Assignment (Open Notebook, Textbook, Stationery) -->
  <g filter="url(#dropShadow)">
    <!-- Stacked Textbook underneath -->
    <path d="M 50 150 L 120 130 L 180 150 L 110 170 Z" fill="#0284c7" />
    <path d="M 50 150 L 50 156 L 110 176 L 110 170 Z" fill="#0369a1" />
    <path d="M 110 170 L 180 150 L 180 156 L 110 176 Z" fill="#0ea5e9" />
    <!-- Textbook pages edge side -->
    <path d="M 52 147 L 118 128" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Open Math/Homework Notebook (Centerpiece) -->
    <g transform="translate(120, 138)">
      <!-- Left Cover -->
      <path d="M -75 25 L -75 -18 L 0 -35 L 0 12 Z" fill="#f43f5e" />
      <!-- Right Cover -->
      <path d="M 75 25 L 75 -18 L 0 -35 L 0 12 Z" fill="#e11d48" />

      <!-- Left Page -->
      <path d="M -72 20 L -72 -15 L 0 -30 L 0 8 Z" fill="url(#pageGrad)" />
      <!-- Right Page -->
      <path d="M 72 20 L 72 -15 L 0 -30 L 0 8 Z" fill="url(#pageGrad)" />

      <!-- Center Binding Spine Shadow -->
      <line x1="0" y1="-30" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2" />

      <!-- Notebook Grid Lines & Homework Content (Abstract Math/Science Graphics) -->
      <!-- Left Page Graphics: Graph/Coordinates & Geometry -->
      <g opacity="0.6" stroke="#94a3b8" stroke-width="1">
        <line x1="-50" y1="-5" x2="-20" y2="-5" />
        <line x1="-50" y1="-12" x2="-20" y2="-12" />
        <line x1="-50" y1="-19" x2="-20" y2="-19" />
        <!-- Triangle diagram -->
        <path d="M -55 5 L -35 5 L -55 -15 Z" fill="none" stroke="#3b82f6" stroke-width="1.5" />
        <circle cx="-55" cy="5" r="1.5" fill="#3b82f6" />
        <circle cx="-35" cy="5" r="1.5" fill="#3b82f6" />
        <circle cx="-55" cy="-15" r="1.5" fill="#3b82f6" />
      </g>

      <!-- Right Page Graphics: Equations & Calculations -->
      <g opacity="0.7">
        <!-- Handwritten-style squiggles representing homework problems -->
        <path d="M 20 -18 Q 30 -22 40 -17" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
        <path d="M 20 -10 Q 35 -13 45 -8" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
        <path d="M 20 -2 Q 28 -5 36 -1" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
        
        <!-- Big Red Correction / Checkmark (Active study vibe) -->
        <path d="M 45 3 L 55 10 L 70 -5" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>

  <!-- Stationery Props (Pencil, Highlighter, Coffee Mug) -->
  <!-- Mechanical Pencil leaning across -->
  <g filter="url(#softShadow)" transform="rotate(-25 150 110)">
    <!-- Pencil Body -->
    <rect x="135" y="80" width="8" height="50" rx="2" fill="#fbbf24" />
    <path d="M 135 130 L 139 140 L 143 130 Z" fill="#cbd5e1" />
    <path d="M 139 140 L 139 143" stroke="#0f172a" stroke-width="1" />
    <!-- Pencil Clip & Grip -->
    <rect x="137" y="85" width="4" height="15" rx="1" fill="#64748b" />
    <rect x="135" y="115" width="8" height="6" fill="#334155" />
    <!-- Eraser top -->
    <rect x="135" y="76" width="8" height="6" rx="1" fill="#ec4899" />
  </g>

  <!-- Warm Glowing Desk Lamp (Top Right corner source) -->
  <g filter="url(#dropShadow)">
    <!-- Lamp Shade -->
    <path d="M 195 20 L 225 65 L 165 65 Z" fill="#38bdf8" />
    <!-- Lamp Bulb Inner Glow -->
    <ellipse cx="195" cy="62" rx="12" ry="5" fill="#fef08a" />
    <!-- Articulated Arm -->
    <path d="M 195 20 L 210 -10" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Cozy Ceramic Mug with Steam -->
  <g filter="url(#softShadow)" transform="translate(35, 140)">
    <!-- Mug Body -->
    <rect x="0" y="5" width="22" height="26" rx="4" fill="#10b981" />
    <ellipse cx="11" cy="5" rx="11" ry="3" fill="#34d399" />
    <!-- Coffee Surface -->
    <ellipse cx="11" cy="6" rx="9" ry="2" fill="#78350f" />
    <!-- Mug Handle -->
    <path d="M 22 10 C 29 10, 29 26, 22 26" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Animated Hot Steam Wisps -->
    <path d="M 8 -2 Q 12 -7 8 -12" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 14 -5 Q 10 -10 14 -15" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Foreground Atmospheric Sparkles / Focus Dots -->
  <circle cx="70" cy="110" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="165" cy="95" r="1.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="105" cy="185" r="1" fill="#f43f5e" opacity="0.9" />

  <!-- Outer Rounded Border Framing -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>