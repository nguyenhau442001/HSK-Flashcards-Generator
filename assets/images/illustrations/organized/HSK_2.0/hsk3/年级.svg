<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Classroom Interior Scene -->
  <!-- Back Wall & Flooring/Base -->
  <rect x="0" y="0" width="240" height="170" fill="url(#wallGrad)"/>
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  
  <!-- Ambient Wall Deco / Window with Starry Night / Warm Light -->
  <path d="M 200,20 L 220,20 L 220,70 L 200,70 Z" fill="#38bdf8" opacity="0.1"/>
  <circle cx="210" cy="45" r="12" fill="#fbbf24" opacity="0.2"/>

  <!-- Chalkboard representing Classroom Grade Level Context -->
  <g filter="url(#shadow)">
    <rect x="35" y="25" width="170" height="95" rx="4" fill="#b45309"/>
    <rect x="39" y="29" width="162" height="87" rx="2" fill="url(#boardGrad)"/>
  </g>

  <!-- Chalkboard Content: Grade Level Visual Illustration (Grade 3 representation with 3 stars/blocks) -->
  <g transform="translate(50, 40)">
    <!-- Cute drawing on board: Apple tree with 3 apples (representing 3rd grade) -->
    <path d="M 30,55 C 30,40 45,35 55,45 C 65,30 85,35 85,50 C 95,55 90,70 80,75 L 35,75 C 25,65 30,55 30,55 Z" fill="#064e3b" opacity="0.4"/>
    <!-- Trunk -->
    <rect x="52" y="75" width="8" height="15" fill="#92400e"/>
    <!-- 3 Glowing Apples/Stars representing "Grade 3" -->
    <circle cx="45" cy="50" r="5" fill="#ef4444"/>
    <circle cx="70" cy="48" r="5" fill="#ef4444"/>
    <circle cx="58" cy="62" r="5" fill="#ef4444"/>
    
    <!-- Decorative chalk lines & numbers symbols (non-textual math/shapes) -->
    <path d="M 110,35 L 130,55 M 130,35 L 110,55" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="120" cy="75" r="6" fill="none" stroke="#a7f3d0" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- Student Desk in Foreground -->
  <g filter="url(#shadow)">
    <!-- Desk Top -->
    <path d="M 30,150 L 210,150 L 190,190 L 50,190 Z" fill="url(#deskGrad)"/>
    <!-- Desk Front Rim -->
    <path d="M 30,150 L 210,150 L 210,156 L 30,156 Z" fill="#b45309"/>
    <!-- Desk Legs -->
    <rect x="55" y="190" width="12" height="40" fill="#475569"/>
    <rect x="173" y="190" width="12" height="40" fill="#475569"/>
  </g>

  <!-- School Props on Desk -->
  <!-- Open Textbook / Workbook -->
  <g transform="translate(65, 138) rotate(-5)" filter="url(#shadow)">
    <polygon points="0,20 40,10 40,40 0,50" fill="#f8fafc"/>
    <polygon points="40,10 80,20 80,50 40,40" fill="#e2e8f0"/>
    <line x1="10" y1="28" x2="30" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="36" x2="28" y2="31" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="25" x2="70" y2="30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="33" x2="68" y2="38" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Pencil Holder / Colorful Pens & Pencils -->
  <g transform="translate(165, 125)">
    <!-- Holder Cup -->
    <rect x="0" y="10" width="22" height="30" rx="3" fill="#38bdf8" filter="url(#shadow)"/>
    <rect x="-1" y="10" width="24" height="6" rx="2" fill="#0ea5e9"/>
    <!-- Pens sticking out -->
    <line x1="6" y1="10" x2="3" y2="-5" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="11" y1="10" x2="11" y2="-10" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="10" x2="20" y2="-2" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- School Backpack hanging or resting near the desk -->
  <g transform="translate(25, 140)" filter="url(#shadow)">
    <path d="M 10,15 C 10,5 25,0 35,5 C 45,0 60,5 60,15 L 60,60 C 60,68 50,70 35,70 C 20,70 10,68 10,60 Z" fill="#ec4899"/>
    <!-- Backpack Pocket -->
    <path d="M 18,30 C 18,25 25,22 35,22 C 45,22 52,25 52,30 L 52,55 C 52,58 45,60 35,60 C 25,60 18,58 18,55 Z" fill="#db2777"/>
    <!-- Zipper details -->
    <line x1="22" y1="26" x2="48" y2="26" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round"/>
    <!-- Straps -->
    <path d="M 20,5 C 15,10 5,20 2,35" fill="none" stroke="#be185d" stroke-width="4" stroke-linecap="round"/>
    <path d="M 50,5 C 55,10 65,20 68,35" fill="none" stroke="#be185d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Sparkles / Joyful Learning Atmosphere -->
  <g fill="#fbbf24">
    <path d="M 120,40 Q 123,40 123,37 Q 123,40 126,40 Q 123,40 123,43 Q 123,40 120,40 Z" opacity="0.8"/>
    <path d="M 45,95 Q 47,95 47,93 Q 47,95 49,95 Q 47,95 47,97 Q 47,95 45,95 Z" opacity="0.6"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="195" cy="95" r="3" opacity="0.7"/>
    <circle cx="180" cy="110" r="2" opacity="0.5"/>
  </g>

  <!-- Bright Accent Lighting / Vignette frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
</svg>