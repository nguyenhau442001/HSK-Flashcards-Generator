<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Fame/Popularity -->
    <radialGradient id="fame-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Sign Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Restaurant Wall Gradient -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gold Star Gradient -->
    <linearGradient id="gold-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Fame Glow -->
  <circle cx="120" cy="110" r="100" fill="url(#fame-glow)" />

  <!-- SCENE LAYER: Restaurant Interior Background -->
  <!-- Back Wall -->
  <rect x="20" y="25" width="200" height="130" rx="12" fill="url(#wall-grad)" />

  <!-- Window with Night City Bokeh -->
  <g opacity="0.6">
    <rect x="35" y="38" width="50" height="75" rx="6" fill="#0f172a" />
    <circle cx="50" cy="60" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="70" cy="80" r="3" fill="#f43f5e" opacity="0.8" />
    <circle cx="60" cy="95" r="5" fill="#fbbf24" opacity="0.8" />
  </g>

  <!-- Hanging Lanterns (Warm Lighting) -->
  <g>
    <!-- Left Lantern -->
    <path d="M55 25 L65 25 L68 32 L52 32 Z" fill="#64748b" />
    <ellipse cx="60" cy="40" rx="10" ry="12" fill="#f97316" />
    <ellipse cx="60" cy="40" rx="10" ry="12" fill="url(#fame-glow)" />
    <path d="M55 48 L65 48 L63 53 L57 53 Z" fill="#64748b" />
    <line x1="60" y1="15" x2="60" y2="25" stroke="#475569" stroke-width="2" />

    <!-- Right Lantern -->
    <path d="M175 25 L185 25 L188 32 L172 32 Z" fill="#64748b" />
    <ellipse cx="180" cy="40" rx="10" ry="12" fill="#f97316" />
    <ellipse cx="180" cy="40" rx="10" ry="12" fill="url(#fame-glow)" />
    <path d="M175 48 L185 48 L183 53 L177 53 Z" fill="#64748b" />
    <line x1="180" y1="15" x2="180" y2="25" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Wall Decoration: Crossed Golden Award / Ribbon for Popularity -->
  <g transform="translate(120, 55)">
    <!-- Ribbons -->
    <path d="M-10 20 L-20 40 L-10 45 L0 30 Z" fill="#e11d48" />
    <path d="M10 20 L20 40 L10 45 L0 30 Z" fill="#e11d48" />
    <!-- Medal Badge -->
    <circle cx="0" cy="15" r="14" fill="#cbd5e1" />
    <circle cx="0" cy="15" r="11" fill="url(#gold-star)" />
    <!-- Mini Star inside medal -->
    <path d="M0 9 L2 13 L7 13 L3 16 L5 20 L0 17 L-5 20 L-3 16 L-7 13 L-2 13 Z" fill="#fef08a" transform="scale(0.6) translate(0, 8)" />
  </g>

  <!-- MAIN SUBJECT: The Famous Restaurant Counter & Signature Dish -->
  <!-- Wooden Counter / Table Surface -->
  <rect x="25" y="145" width="190" height="70" rx="8" fill="#78350f" />
  <rect x="25" y="145" width="190" height="12" rx="4" fill="#92400e" />
  <!-- Counter Edge Highlight -->
  <line x1="25" y1="157" x2="215" y2="157" stroke="#b45309" stroke-width="2" />

  <!-- ACTION-PACKED ELEMENT: The Famous Steaming Signature Dish (Dim Sum / Gourmet Bowl) -->
  <g transform="translate(120, 130)">
    <!-- Bamboo Steamer Basket Base -->
    <ellipse cx="0" cy="20" rx="36" ry="14" fill="#b45309" />
    <ellipse cx="0" cy="18" rx="34" ry="12" fill="#d97706" />
    <!-- Basket Rims / Texture -->
    <path d="M-34 18 C-34 26 34 26 34 18" stroke="#78350f" stroke-width="2" fill="none" />
    <path d="M-32 13 C-32 21 32 21 32 13" stroke="#b45309" stroke-width="1.5" fill="none" />

    <!-- Delicious Gourmet Food (Dumplings / Buns) inside -->
    <circle cx="-12" cy="10" r="10" fill="#f8fafc" />
    <circle cx="-12" cy="8" r="9" fill="#ffffff" />
    <!-- Dumpling Fold details -->
    <path d="M-15 6 Q-12 4 -9 6" stroke="#e2e8f0" stroke-width="1.5" fill="none" />

    <circle cx="12" cy="10" r="10" fill="#f8fafc" />
    <circle cx="12" cy="8" r="9" fill="#ffffff" />
    <path d="M9 6 Q12 4 15 6" stroke="#e2e8f0" stroke-width="1.5" fill="none" />

    <circle cx="0" cy="4" r="11" fill="#f8fafc" />
    <circle cx="0" cy="2" r="10" fill="#ffffff" />
    <path d="M-3 0 Q0 -2 3 0" stroke="#e2e8f0" stroke-width="1.5" fill="none" />

    <!-- Appetizing Steam / Aroma Swirls (Dynamic, fluid vector shapes) -->
    <path d="M-5 -2 C-15 -10 5 -20 -5 -30" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M10 -5 C20 -15 0 -25 10 -35" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>

  <!-- FOREGROUND DETAILS & POLISH: Popularity Indicators (Floating Stars & Hearts) -->
  <g>
    <!-- Golden Star Left -->
    <path d="M45 105 L48 112 L55 113 L50 118 L51 125 L45 121 L39 125 L40 118 L35 113 L42 112 Z" fill="url(#gold-star)" transform="scale(0.8) translate(15, 20)" />
    <!-- Golden Star Right -->
    <path d="M190 100 L193 107 L200 108 L195 113 L196 120 L190 116 L184 120 L185 113 L180 108 L187 107 Z" fill="url(#gold-star)" transform="scale(0.9) translate(3, 10)" />
    
    <!-- Floating Sparkles -->
    <circle cx="75" cy="115" r="3" fill="#fbbf24" opacity="0.9" />
    <circle cx="165" cy="115" r="2" fill="#fbbf24" opacity="0.9" />
    <circle cx="95" cy="95" r="2.5" fill="#f43f5e" opacity="0.8" />
  </g>

  <!-- VIP / Popularity Neon / Glowing Plaque on Front of Counter -->
  <g transform="translate(120, 185)">
    <rect x="-55" y="-12" width="110" height="24" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#neon-glow)" />
    <rect x="-53" y="-10" width="106" height="20" rx="4" fill="#1e293b" />
    
    <!-- Stylized Crown / Popularity Crest inside Plaque -->
    <path d="M-18 2 L-15 -4 L-9 1 L0 -7 L9 1 L15 -4 L18 2 Z" fill="#fbbf24" />
    <circle cx="-18" cy="4" r="1.5" fill="#f59e0b" />
    <circle cx="0" cy="-8" r="1.5" fill="#f59e0b" />
    <circle cx="18" cy="4" r="1.5" fill="#f59e0b" />
    
    <!-- Glowing Accent Dots -->
    <circle cx="-42" cy="0" r="2" fill="#38bdf8" />
    <circle cx="42" cy="0" r="2" fill="#38bdf8" />
  </g>

  <!-- Ambient lighting overlay for depth -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>