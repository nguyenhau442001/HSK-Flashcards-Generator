<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mirror/Glass Gradient -->
    <linearGradient id="mirrorGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Mirror Frame Gradient -->
    <linearGradient id="goldFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Heroic Cape Gradient -->
    <linearGradient id="capeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background shapes/stars -->
  <g fill="#38bdf8" opacity="0.2">
    <circle cx="40" cy="50" r="1.5"/>
    <circle cx="200" cy="40" r="2"/>
    <circle cx="210" cy="180" r="1.5"/>
    <circle cx="30" cy="200" r="2"/>
  </g>

  <!-- Environment: Floor and back wall intersection -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#090d16"/>
  <ellipse cx="120" cy="190" rx="90" ry="12" fill="#020617" opacity="0.8"/>

  <!-- Golden Confidence Aura behind mirror -->
  <circle cx="120" cy="115" r="55" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>

  <!-- Standing Floor Mirror (Representing Self / Self-Reflection) -->
  <g transform="translate(120, 115)">
    <!-- Mirror Stand Legs -->
    <path d="M -15 65 L -35 85 M 15 65 L 35 85" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <!-- Mirror Outer Frame -->
    <ellipse cx="0" cy="0" rx="42" ry="68" fill="url(#goldFrame)"/>
    <!-- Mirror Inner Shadow -->
    <ellipse cx="0" cy="0" rx="38" ry="64" fill="#0f172a"/>
    <!-- Mirror Glass Reflective Surface -->
    <ellipse cx="0" cy="0" rx="36" ry="62" fill="url(#mirrorGlass)"/>
    
    <!-- Reflection inside mirror (Heroic self-image) -->
    <g transform="translate(0, 5) scale(0.65)" opacity="0.9">
      <!-- Cape inside reflection -->
      <path d="M -15 -10 L -25 30 L 0 35 L 25 30 L 15 -10 Z" fill="#e11d48"/>
      <!-- Body -->
      <circle cx="0" cy="-20" r="14" fill="#fb923c"/>
      <path d="M -14 -2 C -14 -10 14 -10 14 -2 L 18 30 C 18 35 12 35 0 35 C -12 35 -18 35 -18 30 Z" fill="#0284c7"/>
      <!-- Confident star symbol on chest -->
      <path d="M 0 -2 L 3 5 L -2 2 L 2 2 L -3 5 Z" fill="#fde047"/>
    </g>

    <!-- Mirror Glass Highlights -->
    <path d="M -22 -40 C -15 -50 -5 -52 10 -45" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M -28 -10 C -32 10 -25 30 -15 45" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.2"/>
  </g>

  <!-- Foreground Character (Confident, real-world person looking at themselves) -->
  <g transform="translate(120, 135)">
    <!-- Dynamic Hero Cape flowing behind -->
    <path d="M -15 -20 C -35 0 -45 35 -55 55 C -35 50 -20 40 -10 30 Z" fill="url(#capeGrad)"/>
    <path d="M 15 -20 C 35 0 45 35 55 55 C 35 50 20 40 10 30 Z" fill="url(#capeGrad)" opacity="0.9"/>

    <!-- Body / Torso -->
    <path d="M -18 5 C -18 -5 18 -5 18 5 L 22 52 C 22 58 16 60 0 60 C -16 60 -22 58 -22 52 Z" fill="url(#shirtGrad)"/>

    <!-- Confidence Badge / Star on Chest -->
    <circle cx="0" cy="22" r="7" fill="#fbbf24"/>
    <path d="M 0 17 L 1.5 20.5 L 5 21 L 2.5 23.5 L 3 27 L 0 25 L -3 27 L -2.5 23.5 L -5 21 L -1.5 20.5 Z" fill="#78350f" transform="scale(0.7) translate(0, 8)"/>

    <!-- Arms in confident "power pose" (hands on hips) -->
    <path d="M -18 10 C -28 15 -32 28 -28 38 C -26 42 -22 40 -20 36 C -18 28 -20 22 -14 18" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 18 10 C 28 15 32 28 28 38 C 26 42 22 40 20 36 C 18 28 20 22 14 18" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="-6" y="-6" width="12" height="14" fill="#fb923c" rx="3"/>

    <!-- Head -->
    <circle cx="0" cy="-24" r="17" fill="#fb923c"/>
    
    <!-- Hair (Stylish, modern, dynamic spikes) -->
    <path d="M -17 -26 C -18 -38 -5 -43 2 -42 C 12 -41 17 -34 18 -26 C 20 -24 18 -20 16 -20 C 10 -28 2 -29 -5 -27 C -12 -25 -16 -20 -17 -26 Z" fill="#1e293b"/>
    <path d="M -3 -42 C 4 -44 14 -38 17 -31 C 13 -36 5 -39 -3 -42 Z" fill="#38bdf8"/>

    <!-- Face Profile / Expression (Determined & Smiling) -->
    <!-- Determined Eyebrows -->
    <path d="M -10 -31 L -3 -29" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 10 -31 L 3 -29" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (Bright, confident dots with highlights) -->
    <circle cx="-6" cy="-25" r="2.5" fill="#1e293b"/>
    <circle cx="6" cy="-25" r="2.5" fill="#1e293b"/>
    <circle cx="-5" cy="-26" r="0.8" fill="#ffffff"/>
    <circle cx="7" cy="-26" r="0.8" fill="#ffffff"/>

    <!-- Confident Warm Smile -->
    <path d="M -5 -18 C -2 -14 2 -14 5 -18" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="-11" cy="-20" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="11" cy="-20" r="3" fill="#f43f5e" opacity="0.3"/>
  </g>

  <!-- Surrounding Environment Props (Contextual depth: indoor room with plant and lamp) -->
  <!-- Houseplant on the left -->
  <g transform="translate(35, 175)">
    <!-- Pot -->
    <path d="M -12 0 L -8 18 L 8 18 L 12 0 Z" fill="#64748b"/>
    <ellipse cx="0" cy="0" rx="12" ry="3" fill="#475569"/>
    <!-- Leaves -->
    <path d="M 0 0 C -15 -10 -25 -5 -30 -15 C -20 -15 -10 -5 0 0 Z" fill="#10b981"/>
    <path d="M 0 0 C -5 -20 5 -30 15 -35 C 10 -20 5 -10 0 0 Z" fill="#059669"/>
    <path d="M 0 0 C 15 -15 25 -10 32 -20 C 22 -5 10 -5 0 0 Z" fill="#34d399"/>
  </g>

  <!-- Floating Sparkles / Energy Dots (Highlighting self-assurance and personal empowerment) -->
  <g fill="#f59e0b">
    <path d="M 65 95 L 68 102 L 75 105 L 68 108 L 65 115 L 62 108 L 55 105 L 62 102 Z" opacity="0.9"/>
    <path d="M 175 110 L 177 115 L 182 117 L 177 119 L 175 124 L 173 119 L 168 117 L 173 115 Z" opacity="0.7"/>
    <circle cx="155" cy="80" r="3" opacity="0.8"/>
    <circle cx="85" cy="140" r="2" opacity="0.6"/>
  </g>

  <!-- Subtle floor shadow under character and mirror -->
  <ellipse cx="120" cy="195" rx="55" ry="8" fill="#020617" opacity="0.6"/>
</svg>