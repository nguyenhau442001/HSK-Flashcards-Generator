<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Morning/Habit Routine -->
    <radialGradient id="morningGlow" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03" />
    </linearGradient>

    <!-- Hot Drink Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#morningGlow)" />

  <!-- ENVIRONMENT / SCENE DETAILS -->
  <!-- Wall / Room Corner -->
  <path d="M0 0 H240 V185 H0 Z" fill="#1e293b" />
  <!-- Floor -->
  <path d="M0 185 L240 185 L240 240 L0 240 Z" fill="#0f172a" />
  <!-- Floor line/trim -->
  <path d="M0 180 H240" stroke="#334155" stroke-width="2" />
  <path d="M0 185 H240" stroke="#090d16" stroke-width="3" />

  <!-- Wallpaper Stripe Accents (Habitual order/neatness) -->
  <path d="M40 0 V180 M80 0 V180 M120 0 V180 M160 0 V180 M200 0 V180" stroke="#252f45" stroke-width="1.5" stroke-dasharray="4 8" />

  <!-- Window with Morning Light beam -->
  <g transform="translate(15, 25)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="55" height="110" rx="4" fill="#334155" />
    <rect x="4" y="4" width="47" height="102" rx="2" fill="#090d16" />
    <!-- Window Panes & Sky -->
    <rect x="7" y="7" width="19" height="46" rx="1" fill="#38bdf8" fill-opacity="0.2" />
    <rect x="29" y="7" width="19" height="46" rx="1" fill="#38bdf8" fill-opacity="0.25" />
    <rect x="7" y="57" width="19" height="46" rx="1" fill="#38bdf8" fill-opacity="0.15" />
    <rect x="29" y="57" width="19" height="46" rx="1" fill="#38bdf8" fill-opacity="0.2" />
    <!-- Rising Sun Outside Window -->
    <circle cx="38" cy="30" r="8" fill="#fbbf24" />
  </g>

  <!-- Light Beam coming from window -->
  <polygon points="70,25 210,185 100,185" fill="url(#windowLight)" />

  <!-- Wall Shelf for Routine Items -->
  <rect x="135" y="65" width="85" height="8" rx="2" fill="#475569" filter="url(#softShadow)" />
  <rect x="145" y="73" width="65" height="3" fill="#334155" />

  <!-- Small Clock on Shelf (representing routine/time) -->
  <circle cx="177" cy="45" r="16" fill="#cbd5e1" filter="url(#softShadow)" />
  <circle cx="177" cy="45" r="13" fill="#f8fafc" />
  <circle cx="177" cy="45" r="1.5" fill="#0f172a" />
  <!-- Clock hands -->
  <line x1="177" y1="45" x2="177" y2="37" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <line x1="177" y1="45" x2="183" y2="47" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  <path d="M171 31 L174 34 M183 31 L180 34" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- Small Plant on Shelf (living habit) -->
  <path d="M152 65 C152 55 162 55 162 65 Z" fill="#ec4899" />
  <ellipse cx="157" cy="65" rx="5" ry="2" fill="#f472b6" />
  <!-- Plant leaves -->
  <path d="M157 57 C150 50 145 55 148 60 C152 60 155 58 157 57 Z" fill="#10b981" />
  <path d="M157 57 C164 48 170 53 166 59 C162 58 159 58 157 57 Z" fill="#34d399" />
  <path d="M157 57 C155 45 160 42 160 55 Z" fill="#059669" />

  <!-- MAIN SUBJECT: The Morning Routine Desk & Coffee/Tea Setup -->
  <g transform="translate(0, 10)">
    <!-- Wooden Desk -->
    <!-- Desk Top -->
    <path d="M40 145 L200 145 L210 160 L30 160 Z" fill="#b45309" filter="url(#softShadow)" />
    <path d="M40 145 L200 145 L200 149 L40 149 Z" fill="#d97706" />
    <!-- Desk Front Panel -->
    <path d="M30 160 L210 160 L210 175 L30 175 Z" fill="#92400e" />
    <!-- Desk Legs -->
    <rect x="50" y="175" width="12" height="35" rx="3" fill="#78350f" />
    <rect x="178" y="175" width="12" height="35" rx="3" fill="#78350f" />

    <!-- Open Planner / Journal (The Habit Tracker / Daily Routine) -->
    <g transform="translate(100, 125)">
      <!-- Book Shadow -->
      <path d="M-30 20 L30 10 L40 25 L-20 35 Z" fill="#000" opacity="0.4" />
      <!-- Left Page -->
      <path d="M-32 18 C-32 15 -10 12 0 10 L0 32 C-10 33 -32 35 -32 35 Z" fill="#f8fafc" />
      <!-- Right Page -->
      <path d="M2 10 C12 12 34 15 34 18 L34 35 C34 35 12 33 2 32 Z" fill="#f1f5f9" />
      <!-- Center binding -->
      <line x1="0" y1="10" x2="2" y2="32" stroke="#cbd5e1" stroke-width="2" />
      <!-- Checkmarks inside planner (representing habit completion) -->
      <!-- Left page lines & check -->
      <line x1="-25" y1="18" x2="-10" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="-25" y1="24" x2="-15" y2="24" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <path d="M-29 21 L-27 23 L-23 19" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right page lines & check -->
      <line x1="8" y1="16" x2="25" y2="16" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="22" x2="20" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <path d="M4 19 L6 21 L10 17" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Red bookmark ribbon hanging down -->
      <path d="M1 -2 L3 15 L0 18 L-3 15 L-1 -2 Z" fill="#ef4444" />
    </g>

    <!-- Hot Ceramic Mug (Daily Morning Habit) -->
    <g transform="translate(65, 120)">
      <!-- Saucer -->
      <ellipse cx="0" cy="18" rx="18" ry="6" fill="#cbd5e1" />
      <ellipse cx="0" cy="17" rx="16" ry="5" fill="#f1f5f9" />

      <!-- Mug Body -->
      <path d="M-10 0 L-13 14 C-13 16 -11 17 -9 17 L9 17 C11 17 13 16 13 14 L10 0 Z" fill="#38bdf8" filter="url(#softShadow)" />
      <!-- Mug Rim -->
      <ellipse cx="0" cy="0" rx="10" ry="3.5" fill="#7dd3fc" />
      <ellipse cx="0" cy="-1" rx="8" ry="2.5" fill="#1e293b" />
      <!-- Coffee Liquid -->
      <ellipse cx="0" cy="0" rx="7.5" ry="2" fill="#78350f" />

      <!-- Mug Handle -->
      <path d="M9 3 C16 3 16 12 9 13" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

      <!-- Heart or Smile detail on cup (warm feeling) -->
      <path d="M0 6 C-2 4 -4 7 0 10 C4 7 2 4 0 6 Z" fill="#0284c7" opacity="0.6" />

      <!-- Steaming Wiggles (Action/Routine Atmosphere) -->
      <path d="M-3 -4 C-6 -8 0 -10 -3 -14" fill="none" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" />
      <path d="M3 -6 C6 -10 0 -12 3 -16" fill="none" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Smartwatch / Habit Tracker Wearable on Desk -->
    <g transform="translate(160, 130)">
      <!-- Watch Strap Loops -->
      <path d="M-15 15 L-5 -5" stroke="#475569" stroke-width="8" stroke-linecap="round" />
      <path d="M5 15 L15 -5" stroke="#475569" stroke-width="8" stroke-linecap="round" />
      <!-- Watch Body -->
      <rect x="-8" y="-3" width="16" height="20" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="2" filter="url(#softShadow)" />
      <!-- Watch Screen (Glowing Green Success) -->
      <rect x="-5" y="0" width="10" height="14" rx="2" fill="#0f172a" />
      <!-- Success Ring / Progress -->
      <circle cx="0" cy="7" r="4" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="25" stroke-dashoffset="5" />
      <path d="M-2 7 L-1 9 L3 5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Depth of field particles) -->
  <circle cx="45" cy="90" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="195" cy="80" r="1.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="215" cy="130" r="2.5" fill="#fbbf24" opacity="0.4" />
  <circle cx="25" cy="150" r="1.5" fill="#38bdf8" opacity="0.5" />
</svg>