<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Sound Wave Glow Gradient -->
    <linearGradient id="soundWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="soundWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    
    <linearGradient id="soundWave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Speaker Gradient -->
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Note Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Ambient Glows representing sound diffusion -->
  <circle cx="120" cy="120" r="90" fill="#38bdf8" opacity="0.03" />
  <circle cx="120" cy="120" r="60" fill="#38bdf8" opacity="0.05" />

  <!-- Environment / Desk surface -->
  <path d="M 20 205 L 220 205 L 235 225 L 5 225 Z" fill="#0f172a" opacity="0.8" />
  <line x1="20" y1="205" x2="220" y2="205" stroke="#334155" stroke-width="2" />

  <!-- Action Sound Waves (Expanding Arcs from Mega-phone / Speaker) -->
  <!-- Outer Wave (Cyan) -->
  <path d="M 125 55 C 160 70, 180 100, 180 130 C 180 160, 160 190, 125 205" 
        fill="none" stroke="url(#soundWave1)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Middle Wave (Amber) -->
  <path d="M 110 70 C 135 82, 150 105, 150 130 C 150 155, 135 178, 110 190" 
        fill="none" stroke="url(#soundWave2)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Wave (Pink/Magenta) -->
  <path d="M 95 85 C 110 95, 120 110, 120 130 C 120 150, 110 165, 95 175" 
        fill="none" stroke="url(#soundWave3)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Floating Musical / Voice Notes (Action Elements) -->
  <!-- Note 1 -->
  <g transform="translate(165, 75) rotate(15)">
    <ellipse cx="6" cy="14" rx="5" ry="4" fill="#fbbf24" />
    <path d="M 10 14 L 10 2" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M 10 2 C 15 2, 18 5, 20 8" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Note 2 -->
  <g transform="translate(190, 125) rotate(-10)">
    <ellipse cx="5" cy="12" rx="4" ry="3.5" fill="#38bdf8" />
    <path d="M 9 12 L 9 0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 9 0 C 13 0, 16 3, 17 6" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Note 3 (Small) -->
  <g transform="translate(145, 40) rotate(-25)">
    <ellipse cx="4" cy="10" rx="3.5" ry="3" fill="#ec4899" />
    <path d="M 7.5 10 L 7.5 2" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Main Subject: Retro Megaphone / Studio Speaker System emitting sound -->
  <!-- Stand / Base -->
  <path d="M 55 195 L 85 195 L 75 165 L 65 165 Z" fill="#475569" />
  <ellipse cx="70" cy="195" rx="20" ry="5" fill="#334155" />

  <!-- Megaphone Body (Angled to the right to broadcast sound) -->
  <g transform="rotate(-15 75 130)">
    <!-- Handle -->
    <rect x="62" y="130" width="12" height="35" rx="6" fill="#64748b" />
    
    <!-- Cone / Horn Back -->
    <ellipse cx="55" cy="115" rx="10" ry="15" fill="#1e293b" stroke="#475569" stroke-width="2" />

    <!-- Cone Body -->
    <path d="M 55 100 L 115 80 C 120 78, 125 82, 125 88 L 125 142 C 125 148, 120 152, 115 150 L 55 130 Z" 
          fill="url(#speakerGrad)" stroke="#64748b" stroke-width="2.5" />

    <!-- Speaker Cone Inner Ring / Grille -->
    <ellipse cx="115" cy="115" rx="8" ry="27" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Accent stripes on megaphone -->
    <path d="M 75 107 L 85 104" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 95 100 L 105 97" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Sound Pulse Ripples near source -->
  <path d="M 125 98 C 133 105, 133 125, 125 132" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <path d="M 132 90 C 145 100, 145 130, 132 140" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Foreground Atmospheric Elements (Floating Speech-bubble / Sound particles) -->
  <circle cx="45" cy="80" r="3" fill="#fbbf24" opacity="0.6" />
  <circle cx="30" cy="110" r="2" fill="#38bdf8" opacity="0.5" />
  <circle cx="55" cy="45" r="4" fill="#ec4899" opacity="0.4" />
  <circle cx="195" cy="180" r="3" fill="#10b981" opacity="0.5" />
  <circle cx="210" cy="90" r="2" fill="#fbbf24" opacity="0.8" />

</svg>