<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Shoe Gradients -->
    <linearGradient id="shoeMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shoeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="shoeSole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="120" cy="130" r="90" fill="url(#spotlight)"/>

  <!-- Architectural Background Elements (Floor & Wall) -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.6"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- Wooden Shoe Rack / Display Shelf -->
  <g transform="translate(0, 150)">
    <path d="M 30 15 L 210 15 L 225 35 L 15 35 Z" fill="#334155"/>
    <path d="M 15 35 L 225 35 L 225 42 L 15 42 Z" fill="#1e293b"/>
    <!-- Shelf Legs -->
    <rect x="45" y="42" width="10" height="25" fill="#1e293b"/>
    <rect x="185" y="42" width="10" height="25" fill="#1e293b"/>
  </g>

  <!-- Ambient Background Props (Plant & Starry Sparkles) -->
  <g opacity="0.7">
    <!-- Mini Plant Pot -->
    <path d="M 190 135 L 210 135 L 205 155 L 195 155 Z" fill="#cbd5e1"/>
    <ellipse cx="200" cy="135" rx="10" ry="3" fill="#e2e8f0"/>
    <!-- Plant Leaves -->
    <path d="M 200 132 C 190 120 185 110 190 100 C 195 110 200 120 200 132 Z" fill="#10b981"/>
    <path d="M 200 132 C 210 115 220 110 225 105 C 215 115 205 125 200 132 Z" fill="#34d399"/>
  </g>

  <!-- Floating Magic/Action Sparkles (Representing 'Pair' completeness) -->
  <g fill="#fbbf24">
    <path d="M 50 70 L 53 78 L 61 81 L 53 84 L 50 92 L 47 84 L 39 81 L 47 78 Z" transform="scale(0.6) translate(20, 20)" opacity="0.8"/>
    <path d="M 190 60 L 192 65 L 197 67 L 192 69 L 190 74 L 188 69 L 183 67 L 188 65 Z" transform="scale(0.7) translate(30, 10)" opacity="0.9"/>
    <circle cx="120" cy="65" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="128" cy="72" r="1.5" fill="#fb923c" opacity="0.9"/>
  </g>

  <!-- MAIN SUBJECT: A PAIR OF SNEAKERS (双 - shuāng) -->
  <!-- We draw two dynamic sneakers arranged side-by-side to vividly show 'a pair' -->
  
  <!-- SHADOWS -->
  <ellipse cx="85" cy="170" rx="35" ry="8" fill="#000000" opacity="0.5"/>
  <ellipse cx="155" cy="170" rx="35" ry="8" fill="#000000" opacity="0.5"/>

  <!-- BACK SHOE (Left in the pair, angled slightly) -->
  <g filter="url(#dropShadow)" transform="translate(5, -5)">
    <!-- Sole -->
    <path d="M 55 150 C 65 152 105 152 120 148 C 124 147 125 142 121 140 C 105 142 70 142 53 141 C 48 141 50 149 55 150 Z" fill="url(#shoeSole)"/>
    <!-- Shoe Body -->
    <path d="M 53 141 C 50 120 65 105 90 105 C 105 105 115 112 120 120 C 125 128 123 140 121 140 C 105 142 70 142 53 141 Z" fill="url(#shoeMain)"/>
    <!-- Toe Cap -->
    <path d="M 53 141 C 48 141 47 132 52 125 C 58 128 65 135 65 141 Z" fill="#e2e8f0" opacity="0.9"/>
    <!-- Accent Stripe -->
    <path d="M 68 138 C 85 125 100 120 115 125 C 112 132 100 138 68 138 Z" fill="url(#shoeAccent)"/>
    <!-- Laces -->
    <path d="M 85 115 L 98 120 M 89 111 L 102 116 M 93 107 L 106 112" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Collar / Inner -->
    <path d="M 105 108 C 110 105 118 108 120 115 C 115 112 108 110 105 108 Z" fill="#0f172a"/>
  </g>

  <!-- FRONT SHOE (Right in the pair, prominent and vibrant) -->
  <g filter="url(#dropShadow)">
    <!-- Sole -->
    <path d="M 120 155 C 130 157 175 157 192 152 C 197 150 197 144 191 142 C 175 145 135 145 118 144 C 112 144 114 153 120 155 Z" fill="url(#shoeSole)"/>
    <!-- Midsole strip -->
    <path d="M 118 147 C 135 148 175 148 192 144" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    
    <!-- Shoe Body -->
    <path d="M 118 144 C 114 122 130 106 158 106 C 174 106 185 113 191 122 C 197 131 194 144 191 142 C 175 145 135 145 118 144 Z" fill="url(#shoeMain)"/>
    
    <!-- Toe Cap (Rounded & Clean) -->
    <path d="M 118 144 C 112 144 111 134 117 126 C 124 130 132 138 132 144 Z" fill="#f8fafc"/>
    
    <!-- Dynamic Accent Swoosh / Stripe -->
    <path d="M 134 141 C 155 125 175 120 188 126 C 183 134 168 141 134 141 Z" fill="url(#shoeAccent)"/>
    
    <!-- Shoe Laces & Tongue -->
    <path d="M 152 116 L 168 121 M 156 111 L 173 116 M 161 107 L 178 112" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 150 118 C 153 113 162 111 168 113 L 165 124 C 158 122 152 120 150 118 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Collar / Inner Ankle Opening -->
    <path d="M 174 108 C 180 105 189 108 191 116 C 185 113 178 110 174 108 Z" fill="#0f172a"/>
  </g>

  <!-- Interactive / UI Accent Rings (Indicating matched pair context) -->
  <g fill="none" stroke-width="2" opacity="0.4">
    <!-- Left Shoe Ring -->
    <ellipse cx="90" cy="140" rx="42" ry="18" stroke="#38bdf8" stroke-dasharray="4 4"/>
    <!-- Right Shoe Ring -->
    <ellipse cx="155" cy="145" rx="45" ry="19" stroke="#38bdf8"/>
  </g>

</svg>