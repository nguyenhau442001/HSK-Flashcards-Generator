<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Canopy Gradients -->
    <linearGradient id="canopyBack" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="canopyMid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="canopyFront" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Trunk Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Ground & Wall Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Lighting & Glows -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="180" cy="60" r="80" fill="url(#sunGlow)"/>

  <!-- Courtyard Scene Elements (Back Wall & Tiles) -->
  <!-- Courtyard Wall -->
  <rect x="20" y="40" width="200" height="130" rx="6" fill="url(#wallGrad)" stroke="#475569" stroke-width="2"/>
  <!-- Wall Tile Details -->
  <line x1="20" y1="80" x2="220" y2="80" stroke="#1e293b" stroke-width="2"/>
  <line x1="20" y1="120" x2="220" y2="120" stroke="#1e293b" stroke-width="2"/>
  <line x1="90" y1="40" x2="90" y2="80" stroke="#1e293b" stroke-width="2"/>
  <line x1="150" y1="80" x2="150" y2="120" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Ambient Lantern (Authentic Context Prop) -->
  <g filter="url(#shadow)">
    <path d="M50 40 L50 60" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <rect x="38" y="60" width="24" height="28" rx="6" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <path d="M38 68 L62 68 M38 80 L62 80" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="50" cy="74" r="5" fill="#fbbf24"/>
  </g>

  <!-- Ground / Courtyard Floor (Trong sân) -->
  <path d="M 20 160 Q 120 150 220 160 L 220 215 Q 120 225 20 215 Z" fill="url(#groundGrad)" stroke="#059669" stroke-width="2"/>
  <!-- Paving Stones -->
  <ellipse cx="70" cy="180" rx="22" ry="8" fill="#334155" opacity="0.6"/>
  <ellipse cx="170" cy="190" rx="28" ry="10" fill="#334155" opacity="0.6"/>
  <ellipse cx="120" cy="170" rx="18" ry="6" fill="#334155" opacity="0.4"/>

  <!-- MAIN SUBJECT: THE TREE (树 - shù) -->
  <g filter="url(#shadow)">
    <!-- Tree Roots / Base -->
    <path d="M100 170 Q 120 168 140 170 C 145 180 135 185 120 185 C 105 185 95 180 100 170 Z" fill="#78350f"/>

    <!-- Tree Trunk -->
    <path d="M 108 115 
             L 132 115 
             Q 135 145 138 175 
             L 102 175 
             Q 105 145 108 115 Z" 
          fill="url(#trunkGrad)"/>
    <!-- Trunk Texture Lines -->
    <path d="M118 120 Q 122 140 115 165" stroke="#78350f" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M125 125 Q 128 145 124 170" stroke="#78350f" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- Tree Branches (Behind Canopy) -->
    <path d="M120 120 Q 100 95 80 90" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M120 125 Q 140 100 165 95" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M120 110 Q 120 80 120 65" stroke="#78350f" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Foliage / Canopy Layers (Deep rich greens with stylized round clusters) -->
    <!-- Back Leaf Layer -->
    <circle cx="120" cy="65" r="42" fill="url(#canopyBack)"/>
    <circle cx="85" cy="85" r="35" fill="url(#canopyBack)"/>
    <circle cx="155" cy="85" r="35" fill="url(#canopyBack)"/>

    <!-- Mid Leaf Layer -->
    <circle cx="120" cy="75" r="38" fill="url(#canopyMid)"/>
    <circle cx="95" cy="95" r="30" fill="url(#canopyMid)"/>
    <circle cx="145" cy="95" r="30" fill="url(#canopyMid)"/>

    <!-- Front Leaf Layer (Lush highlights) -->
    <circle cx="110" cy="70" r="28" fill="url(#canopyFront)"/>
    <circle cx="135" cy="80" r="25" fill="url(#canopyFront)"/>
    <circle cx="120" cy="90" r="26" fill="url(#canopyFront)"/>

    <!-- Playful Nature Accents: Flowers / Blossoms on Tree -->
    <circle cx="90" cy="75" r="4" fill="#f43f5e"/>
    <circle cx="145" cy="70" r="4.5" fill="#f43f5e"/>
    <circle cx="125" cy="50" r="4" fill="#f43f5e"/>
    <circle cx="110" cy="100" r="4" fill="#fb923c"/>
    <circle cx="138" cy="105" r="3.5" fill="#fb923c"/>
  </g>

  <!-- Foreground Scene Details (Enhancing "Trong sân" / In the courtyard context) -->
  <!-- Cute Garden Rock (Taihu stone style) -->
  <g filter="url(#shadow)">
    <path d="M 60 175 Q 50 160 70 150 Q 85 145 95 160 Q 105 170 90 185 Q 65 190 60 175 Z" fill="#64748b"/>
    <path d="M 70 155 Q 78 152 82 162 Q 75 168 70 155 Z" fill="#475569" opacity="0.6"/>
  </g>

  <!-- Small Vibrant Bushes by the Wall -->
  <circle cx="190" cy="165" r="16" fill="#059669"/>
  <circle cx="178" cy="170" r="14" fill="#10b981"/>
  <circle cx="202" cy="172" r="12" fill="#34d399"/>

  <!-- Floating Golden Leaf Particles / Magic Atmosphere -->
  <circle cx="155" cy="120" r="3" fill="#fbbf24" opacity="0.8"/>
  <path d="M80 115 Q 83 112 86 116 Q 83 120 80 115 Z" fill="#34d399" transform="rotate(30 83 116)"/>
  <path d="M160 55 Q 163 52 166 56 Q 163 60 160 55 Z" fill="#fbbf24" transform="rotate(-20 163 56)"/>

  <!-- Soft Ground Vignette / Frame Border Overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>