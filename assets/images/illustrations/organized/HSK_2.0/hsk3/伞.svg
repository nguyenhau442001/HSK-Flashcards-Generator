<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- Umbrella Canopy Gradient (vibrant warm amber/orange) -->
    <linearGradient id="umbrella-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Umbrella Alternate Panels -->
    <linearGradient id="umbrella-alt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Raindrop gradient -->
    <linearGradient id="rain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Puddle glow -->
    <radialGradient id="puddle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment Elements (City silhouette & street light) -->
  <g opacity="0.35">
    <!-- Distant buildings -->
    <rect x="20" y="90" width="35" height="150" fill="#0f172a" />
    <rect x="65" y="70" width="45" height="170" fill="#1e293b" />
    <rect x="120" y="110" width="30" height="130" fill="#0f172a" />
    <rect x="160" y="60" width="55" height="180" fill="#1e293b" />
    
    <!-- Warm window lights in background -->
    <rect x="30" y="110" width="6" height="8" fill="#fbbf24" opacity="0.7" />
    <rect x="42" y="110" width="6" height="8" fill="#fbbf24" opacity="0.7" />
    <rect x="30" y="130" width="6" height="8" fill="#fbbf24" opacity="0.4" />
    <rect x="75" y="90" width="8" height="12" fill="#fbbf24" opacity="0.8" />
    <rect x="90" y="90" width="8" height="12" fill="#fbbf24" opacity="0.8" />
    <rect x="75" y="120" width="8" height="12" fill="#fbbf24" opacity="0.8" />
    <rect x="175" y="80" width="10" height="15" fill="#38bdf8" opacity="0.6" />
    <rect x="190" y="80" width="10" height="15" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Atmospheric Street Lamp casting warm glow -->
  <g>
    <path d="M 215 240 L 215 90 C 215 80, 205 75, 195 75 L 185 75" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
    <path d="M 215 240 L 215 90 C 215 80, 205 75, 195 75 L 185 75" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <!-- Lamp head -->
    <path d="M 175 70 L 205 70 L 195 85 L 185 85 Z" fill="#0f172a" />
    <!-- Light beam polygon -->
    <polygon points="190,85 70,240 240,240" fill="#fbbf24" opacity="0.08" />
  </g>

  <!-- Ambient Rain Layer (Background) -->
  <g stroke="url(#rain-grad)" stroke-linecap="round" stroke-width="1.5">
    <line x1="40" y1="10" x2="25" y2="50" />
    <line x1="80" y1="30" x2="65" y2="70" />
    <line x1="140" y1="15" x2="125" y2="55" />
    <line x1="200" y1="40" x2="185" y2="80" />
    <line x1="20" y1="90" x2="5" y2="130" />
    <line x1="100" y1="80" x2="85" y2="120" />
  </g>

  <!-- Ground / Pavement Surface -->
  <rect x="0" y="200" width="240" height="40" fill="#0b0f19" />
  <ellipse cx="115" cy="215" rx="75" ry="15" fill="url(#puddle-glow)" />
  <!-- Puddle reflection detail -->
  <ellipse cx="115" cy="216" rx="55" ry="8" fill="#0ea5e9" opacity="0.15" />

  <!-- MAIN SUBJECT: The Umbrella (cái dù, ô) -->
  <g transform="translate(10, 0)">
    
    <!-- Umbrella Shaft & Handle -->
    <!-- Wooden/Dark metallic shaft -->
    <line x1="105" y1="65" x2="105" y2="185" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="105" y1="65" x2="105" y2="185" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Curved Handle (Classic J-hook) -->
    <path d="M 105 185 C 105 198, 122 198, 122 185 C 122 180, 118 178, 116 178" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />

    <!-- Canopy Ribs / Structure (Inner details visible slightly) -->
    <g stroke="#78350f" stroke-width="1" opacity="0.6">
      <line x1="105" y1="95" x2="35" y2="115" />
      <line x1="105" y1="95" x2="70" y2="100" />
      <line x1="105" y1="95" x2="140" y2="100" />
      <line x1="105" y1="95" x2="175" y2="115" />
    </g>

    <!-- Umbrella Canopy (Open, angled dynamically against the rain) -->
    <!-- We build the canopy using overlapping paths for segments to create 3D volume -->
    <g>
      <!-- Far left segment -->
      <path d="M 105 95 Q 70 85 35 115 Q 70 135 105 125 Z" fill="url(#umbrella-alt)" />
      
      <!-- Mid-left segment -->
      <path d="M 105 95 Q 87 83 70 100 Q 87 125 105 125 Z" fill="url(#umbrella-main)" />
      
      <!-- Center segment -->
      <path d="M 105 95 Q 105 82 105 82 Q 105 82 105 95 Q 122 125 140 100 Q 122 83 105 95 Z" fill="url(#umbrella-alt)" />
      
      <!-- Mid-right segment -->
      <path d="M 105 95 Q 122 83 140 100 Q 122 125 105 125 Z" fill="url(#umbrella-main)" />
      
      <!-- Far right segment -->
      <path d="M 105 95 Q 140 85 175 115 Q 140 135 105 125 Z" fill="url(#umbrella-alt)" />

      <!-- Smooth Scalloped Bottom Edge of Canopy -->
      <path d="M 35 115 Q 52 133 70 100 Q 87 131 105 125 Q 122 131 140 100 Q 157 133 175 115 Q 140 145 105 138 Q 70 145 35 115 Z" fill="url(#umbrella-main)" />
      
      <!-- Highlight rim along the top curve for glossy vector feel -->
      <path d="M 36 114 Q 70 82 105 82 Q 140 82 174 114" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      
      <!-- Canopy Top Finial (Tip) -->
      <path d="M 105 82 L 105 73" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
      <circle cx="105" cy="71" r="3" fill="#fbbf24" />
    </g>

    <!-- Cute Companion Element: Glowing Leaf / Safe drop under umbrella -->
    <g transform="translate(85, 150) rotate(-15)">
      <path d="M 0 15 C 0 0, 15 0, 15 -10 C 15 0, 0 0, 0 15 Z" fill="#10b981" />
      <path d="M 7 15 L 7 0" stroke="#047857" stroke-width="1.5" />
    </g>

  </g>

  <!-- Foreground Rain Layer (Action / Motion effect) -->
  <g stroke="url(#rain-grad)" stroke-linecap="round" stroke-width="2">
    <!-- Slanted heavy raindrops passing around the umbrella -->
    <line x1="25" y1="120" x2="10" y2="160" />
    <line x1="60" y1="140" x2="45" y2="180" />
    <line x1="170" y1="130" x2="155" y2="170" />
    <line x1="210" y1="100" x2="195" y2="140" />
    <line x1="230" y1="160" x2="215" y2="200" />
    <line x1="130" y1="170" x2="115" y2="210" />
  </g>

  <!-- Splash ripples on the ground puddle -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7">
    <ellipse cx="60" cy="215" rx="8" ry="3" />
    <ellipse cx="60" cy="215" rx="4" ry="1.5" opacity="0.4" />
    
    <ellipse cx="160" cy="220" rx="12" ry="4" />
    <ellipse cx="160" cy="220" rx="6" ry="2" opacity="0.4" />
  </g>

</svg>