<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient representing deep night sky -->
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#162347"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Moon glow radial gradient -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window frame gradient -->
    <linearGradient id="woodFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="sillGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#nightSky)"/>

  <!-- Distant stars -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="35" cy="45" r="1.5" />
    <circle cx="75" cy="25" r="1" />
    <circle cx="205" cy="55" r="1.5" />
    <circle cx="180" cy="95" r="1" />
    <circle cx="45" cy="115" r="1" />
  </g>
  <!-- Twinkling accented stars -->
  <path d="M 195 25 Q 195 30 200 30 Q 195 30 195 35 Q 195 30 190 30 Q 195 30 195 25 Z" fill="#fde047" opacity="0.9"/>
  <path d="M 50 70 Q 50 74 54 74 Q 50 74 50 78 Q 50 74 46 74 Q 50 74 50 70 Z" fill="#fde047" opacity="0.8"/>

  <!-- Rolling distant hills / rooftops silhouette to ground the scene -->
  <path d="M0 210 Q 60 195 120 205 T 240 200 L 240 240 L 0 240 Z" fill="#0f172a"/>
  
  <!-- Atmospheric clouds drifting -->
  <path d="M -20 180 Q 20 170 60 185 Q 100 170 150 180 Q 200 170 260 185 L 260 220 L -20 220 Z" fill="#334155" opacity="0.4"/>
  <path d="M 10 190 Q 50 180 90 195 Q 130 185 180 195 Q 220 185 250 190 L 250 240 L 10 240 Z" fill="#1e293b" opacity="0.8"/>

  <!-- MOON GLOW -->
  <circle cx="120" cy="95" r="70" fill="url(#moonGlow)"/>

  <!-- THE MAIN SUBJECT: THE MOON (月亮 - yuèliang) -->
  <circle cx="120" cy="95" r="42" fill="#fef08a"/>
  <!-- Moon Craters for texture and vivid character -->
  <circle cx="102" cy="78" r="8" fill="#fde047" opacity="0.6"/>
  <circle cx="138" cy="85" r="5" fill="#fde047" opacity="0.6"/>
  <circle cx="125" cy="115" r="10" fill="#fde047" opacity="0.6"/>
  <circle cx="98" cy="110" r="4" fill="#fde047" opacity="0.6"/>

  <!-- Foreground Interior Frame (Window / Balcony context) -->
  <!-- Window Sill -->
  <path d="M 0 210 L 240 210 L 240 240 L 0 240 Z" fill="url(#sillGradient)"/>
  <rect x="0" y="206" width="240" height="6" rx="2" fill="#94a3b8" opacity="0.3"/>

  <!-- Side Window Frames -->
  <rect x="0" y="0" width="16" height="240" fill="url(#woodFrame)"/>
  <rect x="224" y="0" width="16" height="240" fill="url(#woodFrame)"/>
  <rect x="0" y="0" width="240" height="16" fill="url(#woodFrame)"/>

  <!-- Props on the windowsill to enhance the realistic narrative context -->
  <!-- Cute small potted succulent on the left sill -->
  <g transform="translate(28, 180)">
    <!-- Pot -->
    <path d="M 4 20 L 16 20 L 18 30 L 2 30 Z" fill="#38bdf8"/>
    <ellipse cx="10" cy="20" rx="6" ry="2" fill="#7dd3fc"/>
    <!-- Plant leaves (succulent rosette) -->
    <circle cx="10" cy="15" r="6" fill="#10b981"/>
    <circle cx="7" cy="13" r="4" fill="#34d399"/>
    <circle cx="13" cy="13" r="4" fill="#34d399"/>
    <circle cx="10" cy="10" r="4" fill="#6ee7b7"/>
  </g>

  <!-- Cozy steaming ceramic mug on the right sill -->
  <g transform="translate(180, 182)">
    <!-- Mug body -->
    <rect x="4" y="10" width="18" height="18" rx="4" fill="#fb923c"/>
    <!-- Mug handle -->
    <path d="M 22 13 C 27 13, 27 23, 22 25" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Coffee surface -->
    <ellipse cx="13" cy="10" rx="9" ry="3" fill="#78350f"/>
    <!-- Steam wisps -->
    <path d="M 10 4 Q 8 0 12 -4" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 16 3 Q 18 -1 14 -5" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Warm ambient light reflection on the sill from the moon -->
  <path d="M 80 210 L 160 210 L 175 240 L 65 240 Z" fill="#fef08a" opacity="0.1"/>

</svg>