<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Calendar Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment: Cozy Room Setup -->
  <!-- Wallpaper Pattern / Accent Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
    <line x1="20" y1="20" x2="60" y2="20" />
    <line x1="20" y1="30" x2="50" y2="30" />
    <line x1="180" y1="20" x2="220" y2="20" />
    <line x1="190" y1="30" x2="220" y2="30" />
  </g>

  <!-- Circular Window showing "Recent Time/Night passing" -->
  <circle cx="120" cy="75" r="45" fill="url(#nightSky)" stroke="#334155" stroke-width="4" filter="url(#shadow)" />
  <!-- Stars outside window -->
  <circle cx="105" cy="55" r="1.5" fill="#f8fafc" opacity="0.8" />
  <circle cx="135" cy="65" r="1" fill="#f8fafc" opacity="0.6" />
  <circle cx="115" cy="85" r="1.5" fill="#f8fafc" opacity="0.9" />
  <!-- Moon (Crescent) -->
  <path d="M 140 55 A 15 15 0 0 1 125 75 A 15 15 0 0 0 140 55 Z" fill="#fbbf24" opacity="0.9" />

  <!-- Desk Surface -->
  <path d="M 10 185 L 230 185 L 235 220 L 5 220 Z" fill="#0f172a" />
  <rect x="10" y="180" width="220" height="7" rx="3.5" fill="#334155" filter="url(#shadow)" />
  <rect x="25" y="187" width="190" height="3" rx="1.5" fill="#1e293b" />

  <!-- Desk Lamp on the Left -->
  <g transform="translate(45, 125)">
    <!-- Lamp Base -->
    <ellipse cx="0" cy="55" rx="18" ry="6" fill="#475569" />
    <path d="M -5 55 L -2 20 L 2 20 L 5 55 Z" fill="#64748b" />
    <!-- Articulated Arm -->
    <path d="M 0 20 L -15 -10 L -25 -5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp Shade -->
    <path d="M -38 -20 L -12 -5 L -25 5 Z" fill="#f59e0b" filter="url(#shadow)" />
    <!-- Light Cone / Glow -->
    <path d="M -30 -10 L -60 50 L -10 50 Z" fill="#fbbf24" opacity="0.15" />
  </g>

  <!-- MAIN SUBJECT: The Big Calendar & Clock/Timeline (Representing "Recently / Gần đây") -->
  <g transform="translate(85, 95)" filter="url(#shadow)">
    <!-- Calendar Backing shadow/depth -->
    <rect x="-10" y="10" width="90" height="85" rx="12" fill="#090d16" opacity="0.5" />
    
    <!-- Calendar Body -->
    <rect x="-5" y="5" width="85" height="85" rx="12" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Calendar Red Header Top -->
    <path d="M -5 17 A 12 12 0 0 1 7 5 L 73 5 A 12 12 0 0 1 85 17 L 85 28 L -5 28 Z" fill="#ef4444" />
    <circle cx="15" cy="16" r="2.5" fill="#f8fafc" />
    <circle cx="65" cy="16" r="2.5" fill="#f8fafc" />

    <!-- Spiral Binding Rings -->
    <path d="M 18 -2 L 18 8" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <path d="M 62 -2 L 62 8" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Calendar Grid / Recent Days Highlighted -->
    <!-- Week Header dots -->
    <circle cx="15" cy="38" r="2" fill="#cbd5e1" />
    <circle cx="28" cy="38" r="2" fill="#cbd5e1" />
    <circle cx="41" cy="38" r="2" fill="#cbd5e1" />
    <circle cx="54" cy="38" r="2" fill="#cbd5e1" />
    <circle cx="67" cy="38" r="2" fill="#cbd5e1" />

    <!-- Past Days (Faded) -->
    <rect x="10" y="47" width="10" height="10" rx="2" fill="#e2e8f0" />
    <rect x="23" y="47" width="10" height="10" rx="2" fill="#e2e8f0" />
    <rect x="36" y="47" width="10" height="10" rx="2" fill="#e2e8f0" />

    <!-- "RECENT" Highlighted Range Box (Redefining "Zuijin" / Recent days sequence) -->
    <rect x="47" y="44" width="28" height="34" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    
    <!-- Active Days inside recent window -->
    <rect x="49" y="47" width="10" height="10" rx="2" fill="#fca5a5" />
    <rect x="62" y="47" width="10" height="10" rx="2" fill="#fca5a5" />
    <rect x="49" y="61" width="10" height="10" rx="2" fill="#ef4444" />
    
    <!-- Checkmark on the very latest day -->
    <path d="M 64 64 L 67 67 L 71 61" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Timeline Arrow looping back (symbolizing "Lately / Recent past") -->
    <path d="M -30 45 C -45 45 -45 80 -25 80 C -15 80 -10 75 -5 70" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3" />
    <path d="M -8 66 L -5 70 L -12 73" fill="#38bdf8" />
  </g>

  <!-- Secondary Context Prop: Smartphone showing chat/connection (representing checking in "How have you been recently?") -->
  <g transform="translate(170, 110) rotate(12)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="38" height="68" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <!-- Screen -->
    <rect x="3" y="6" width="32" height="56" rx="4" fill="url(#screenGrad)" />
    <!-- Chat Bubbles inside phone screen -->
    <rect x="6" y="12" width="20" height="10" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="12" y="26" width="20" height="10" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="6" y="40" width="16" height="10" rx="3" fill="#ffffff" opacity="0.9" />
    <!-- Home Indicator -->
    <line x1="14" y1="65" x2="24" y2="65" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Coffee Mug (Cozy atmosphere) -->
  <g transform="translate(30, 155)" filter="url(#shadow)">
    <!-- Mug Body -->
    <path d="M 5 0 L 25 0 C 27 20 27 25 25 35 C 23 42 7 42 5 35 C 3 25 3 20 5 0 Z" fill="#f8fafc" />
    <!-- Mug Handle -->
    <path d="M 23 8 C 32 8 32 28 23 28" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
    <!-- Coffee liquid -->
    <ellipse cx="15" cy="3" rx="10" ry="3" fill="#78350f" />
    <!-- Steam wisps -->
    <path d="M 10 -6 C 8 -12 14 -16 12 -22" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 20 -4 C 18 -10 22 -14 20 -20" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Ambient Light Accents / Sparkles for visual polish -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="150" cy="80" r="2" />
    <circle cx="75" cy="85" r="1.5" />
    <path d="M 140 100 Q 140 105 145 105 Q 140 105 140 110 Q 140 105 135 105 Q 140 105 140 100" fill="#fbbf24" opacity="0.7" />
    <path d="M 65 115 Q 65 118 68 118 Q 65 118 65 121 Q 65 118 62 118 Q 65 118 65 115" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Foreground Frame/Border overlay for crisp finish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>