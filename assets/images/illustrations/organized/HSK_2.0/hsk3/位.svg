<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="podium-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Atmospheric Light Cone -->
  <path d="M70 0 L170 0 L210 190 L30 190 Z" fill="url(#warm-glow)"/>

  <!-- Classroom / Lecture Background Elements -->
  <!-- Chalkboard Frame -->
  <rect x="36" y="28" width="168" height="85" rx="6" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <!-- Decorative geometric diagrams on board (abstract math/science shapes) -->
  <circle cx="65" cy="55" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <polygon points="100,45 115,70 85,70" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <path d="M 135 60 Q 150 40 165 60" fill="none" stroke="#fb923c" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Ambient Spotlight Ring on floor/wall -->
  <ellipse cx="120" cy="180" rx="70" ry="15" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>

  <!-- Teacher's Podium -->
  <path d="M 85 160 L 155 160 L 165 195 L 75 195 Z" fill="url(#podium-grad)"/>
  <!-- Podium Accent Line -->
  <path d="M 88 170 L 152 170" stroke="#93c5fd" stroke-width="2" opacity="0.8"/>
  <rect x="105" y="177" width="30" height="10" rx="2" fill="#1e40af"/>

  <!-- Teacher Character (Respectful "Vị" Figure) -->
  <!-- Body / Suit Jacket -->
  <path d="M 100 135 L 140 135 L 148 165 L 92 165 Z" fill="#1e293b"/>
  <path d="M 105 135 L 120 155 L 135 135 Z" fill="#f8fafc"/> <!-- Shirt / Collar -->
  <!-- Red Tie -->
  <polygon points="117,142 123,142 121,158" fill="#ef4444"/>

  <!-- Head & Hair -->
  <circle cx="120" cy="108" r="18" fill="#fde047"/> <!-- Warm skin tone -->
  <path d="M 102 105 C 102 95, 138 95, 138 105 C 138 102, 132 90, 120 90 C 108 90, 102 102, 102 105 Z" fill="#334155"/> <!-- Hair -->

  <!-- Friendly Expression / Glasses -->
  <circle cx="114" cy="108" r="4" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="126" cy="108" r="4" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="118" y1="108" x2="122" y2="108" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Smile -->
  <path d="M 116 117 Q 120 120 124 117" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Gesturing Arm (Welcoming/Presenting action - representing respectful honor) -->
  <path d="M 135 140 C 150 145, 155 125, 155 125" fill="none" stroke="#fde047" stroke-width="6" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="156" cy="123" r="4" fill="#fde047"/>

  <!-- Props enhancing the respectful presentation context -->
  <!-- Floating Golden Honor Badge / Prestige Indicator near teacher -->
  <g transform="translate(165, 85)" filter="url(#glow)">
    <circle cx="0" cy="0" r="14" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="10" fill="#fbbf24"/>
    <path d="M 0 -5 L 1.5 -1.5 L 5 -1 L 2.5 1.5 L 3.2 5 L 0 3 L -3.2 5 L -2.5 1.5 L -5 -1 L -1.5 -1.5 Z" fill="#fff" transform="scale(0.8)"/>
  </g>

  <!-- Floating Green Check / Approval Sparkles (Context of correct identification) -->
  <path d="M 65 95 L 70 100 L 80 88" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="78" cy="80" r="2.5" fill="#38bdf8"/>
  <circle cx="55" cy="115" r="2" fill="#fb923c"/>
  <circle cx="185" cy="150" r="3" fill="#ec4899"/>

  <!-- Foreground Floor Line & Surface details -->
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="3"/>
  <ellipse cx="120" cy="195" rx="100" ry="6" fill="#0b0f19" opacity="0.6"/>

  <!-- Ambient lighting highlights on frame -->
  <rect x="36" y="28" width="168" height="85" rx="6" fill="none" stroke="#64748b" stroke-width="1" opacity="0.3"/>
</svg>