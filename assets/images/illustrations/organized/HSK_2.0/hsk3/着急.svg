<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Hoodie Gradient -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Clock Glow / Urgency Indicator -->
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / ROOM SETTING -->
  <!-- Wallpaper / Back Wall -->
  <rect x="0" y="0" width="240" height="170" fill="#1e293b"/>
  <!-- Wall shelf -->
  <rect x="30" y="45" width="90" height="6" rx="3" fill="#334155"/>
  <rect x="45" y="20" width="16" height="25" rx="2" fill="#ef4444"/>
  <rect x="65" y="25" width="14" height="20" rx="2" fill="#10b981"/>
  <rect x="83" y="18" width="18" height="27" rx="2" fill="#f59e0b"/>

  <!-- Wall Clock (Urgent ticking red theme) -->
  <circle cx="185" cy="50" r="22" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="185" cy="50" r="22" fill="url(#clockGlow)"/>
  <!-- Clock hands pointing at late hour -->
  <line x1="185" y1="50" x2="185" y2="38" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="185" y1="50" x2="196" y2="54" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
  <circle cx="185" cy="50" r="2.5" stroke="#f87171" stroke-width="1.5" fill="#0f172a"/>

  <!-- Ambient Light from Lamp -->
  <circle cx="65" cy="95" r="90" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Study Desk Surface -->
  <path d="M 0 165 L 240 165 L 240 175 L 0 175 Z" fill="#334155"/>
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>

  <!-- Desk Props: Open Exam Paper / Books -->
  <!-- Messy Papers & Test Sheets -->
  <g transform="translate(110, 155) rotate(-8)">
    <rect x="0" y="0" width="65" height="50" rx="2" fill="#f8fafc"/>
    <line x1="8" y1="10" x2="45" y2="10" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="8" y1="18" x2="55" y2="18" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="8" y1="26" x2="35" y2="26" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="8" y1="34" x2="50" y2="34" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Red correction/exam marks -->
    <path d="M 45 40 Q 50 35 55 42" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(45, 160) rotate(5)">
    <rect x="0" y="0" width="55" height="40" rx="2" fill="#e2e8f0"/>
    <line x1="6" y1="10" x2="40" y2="10" stroke="#94a3b8" stroke-width="2"/>
    <line x1="6" y1="18" x2="48" y2="18" stroke="#94a3b8" stroke-width="2"/>
    <line x1="6" y1="26" x2="25" y2="26" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Laptop / Computer screen showing countdown or graphs -->
  <path d="M 170 120 L 210 120 L 225 168 L 155 168 Z" fill="#475569"/>
  <rect x="165" y="90" width="50" height="32" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <path d="M 172 105 L 182 100 L 192 110 L 208 96" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Desk Lamp -->
  <path d="M 50 170 L 58 120 L 62 120 L 65 170 Z" fill="#64748b"/>
  <path d="M 58 122 C 45 110 40 90 50 75 L 75 75 C 85 90 80 110 62 122 Z" fill="#f59e0b"/>

  <!-- MAIN SUBJECT: ANXIOUS CHARACTER -->
  <g id="anxious-character">
    <!-- Chair Backrest -->
    <rect x="105" y="85" width="30" height="85" rx="6" fill="#1e293b"/>

    <!-- Body & Hoodie -->
    <path d="M 90 170 C 90 135 100 120 120 120 C 140 120 150 135 150 170 Z" fill="url(#hoodieGrad)"/>
    <!-- Hoodie Strings -->
    <path d="M 113 130 Q 116 145 112 155" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
    <path d="M 127 130 Q 124 145 128 155" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms pushing head / Hair pulling (Classic anxious gesture) -->
    <!-- Left arm -->
    <path d="M 95 145 C 80 130 90 105 105 105 L 115 115 Z" fill="#0284c7"/>
    <!-- Right arm -->
    <path d="M 145 145 C 160 130 150 105 135 105 L 125 115 Z" fill="#0284c7"/>

    <!-- Hands gripping hair -->
    <circle cx="108" cy="102" r="7" fill="url(#skinGrad)"/>
    <circle cx="132" cy="102" r="7" fill="url(#skinGrad)"/>

    <!-- Neck -->
    <rect x="113" y="108" width="14" height="18" fill="url(#skinGrad)"/>

    <!-- Head (Tilted downward, stressed expression) -->
    <circle cx="120" cy="98" r="22" fill="url(#skinGrad)"/>

    <!-- Messy/Spiky Hair -->
    <path d="M 98 90 C 95 75 110 70 120 72 C 130 70 145 75 142 90 C 148 85 145 100 142 102 C 135 90 105 90 98 102 C 95 100 92 85 98 90 Z" fill="#1e293b"/>

    <!-- Sweat Drop (Sign of anxiety / pressure) -->
    <path d="M 143 92 C 143 92 148 98 148 101 C 148 103.8 145.8 106 143 106 C 140.2 106 138 103.8 138 101 C 138 98 143 92 143 92 Z" fill="#38bdf8" opacity="0.85"/>

    <!-- Face Details (Eyes squeezed shut, mouth open in panic/sigh) -->
    <!-- Eyebrows angled sharply down in distress -->
    <path d="M 107 93 L 115 97" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 133 93 L 125 97" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Squeezed Closed Eyes (Arches) -->
    <path d="M 107 101 Q 111 97 115 101" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M 125 101 Q 129 97 133 101" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Open Anxious Mouth -->
    <path d="M 116 109 Q 120 116 124 109 Z" fill="#991b1b"/>
  </g>

  <!-- FOREGROUND / DYNAMIC ELEMENTS -->
  <!-- Floating stress lines / motion blur hints -->
  <path d="M 35 110 Q 42 105 48 112" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 28 125 Q 35 120 42 128" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <path d="M 195 105 Q 202 100 208 108" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 202 120 Q 208 115 215 123" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Coffee Mug with Steam (Nervous pacing / late night studying) -->
  <path d="M 22 145 L 38 145 L 36 170 L 24 170 Z" fill="#cbd5e1"/>
  <path d="M 38 150 C 44 150 44 165 38 165" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Steam swirls -->
  <path d="M 26 138 Q 30 132 26 126 Q 22 120 26 114" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 33 140 Q 37 134 33 128 Q 29 122 33 116" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>