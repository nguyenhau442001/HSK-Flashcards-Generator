<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Arcade Screen Glow -->
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Joystick Metallic Gradient -->
    <linearGradient id="stickMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Pixel Stars/Confetti) -->
  <g opacity="0.6">
    <polygon points="35,45 38,50 43,53 38,56 35,61 32,56 27,53 32,50" fill="#f43f5e" opacity="0.8"/>
    <polygon points="205,35 207,39 211,41 207,43 205,47 203,43 199,41 203,39" fill="#38bdf8" opacity="0.8"/>
    <rect x="180" y="80" width="6" height="6" rx="1" fill="#fbbf24" transform="rotate(15 183 83)"/>
    <rect x="50" y="110" width="8" height="8" rx="1.5" fill="#a855f7" transform="rotate(45 54 114)"/>
    <circle cx="200" cy="140" r="3" fill="#10b981"/>
    <circle cx="40" cy="160" r="2.5" fill="#f43f5e"/>
  </g>

  <!-- Ambient Floor Light -->
  <ellipse cx="120" cy="215" rx="80" ry="12" fill="#38bdf8" opacity="0.15" filter="url(#neonGlowCyan)"/>

  <!-- ARCADE CABINET BASE -->
  <!-- Side panels (darker) -->
  <path d="M 70,60 L 170,60 L 190,210 L 50,210 Z" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Main Cabinet Body -->
  <path d="M 75,65 L 165,65 L 180,205 L 60,205 Z" fill="#1e293b"/>
  <path d="M 80,70 L 160,70 L 172,200 L 68,200 Z" fill="#334155"/>

  <!-- Cabinet Marquee (Top Light Box) -->
  <path d="M 73,40 L 167,40 L 175,68 L 65,68 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <path d="M 77,44 L 163,44 L 169,64 L 71,64 Z" fill="#f59e0b" filter="url(#neonGlowPink)"/>
  <path d="M 77,44 L 163,44 L 169,64 L 71,64 Z" fill="#fbbf24"/>
  <!-- Marquee Icon (Gamepad silhouette inside marquee) -->
  <path d="M 112,54 L 128,54 C 130,54 131,55 131,57 C 131,59 130,60 128,60 L 112,60 C 110,60 109,59 109,57 C 109,55 110,54 112,54 Z" fill="#1e1b4b"/>
  <circle cx="115" cy="57" r="1.5" fill="#f43f5e"/>
  <circle cx="125" cy="57" r="1.5" fill="#38bdf8"/>

  <!-- ARCADE SCREEN SECTION -->
  <!-- Bezel -->
  <path d="M 82,78 L 158,78 L 162,138 L 78,138 Z" fill="#090d16"/>
  <!-- Screen Glow/Background -->
  <path d="M 86,82 L 154,82 L 158,134 L 82,134 Z" fill="url(#screenGrad)"/>
  <!-- Scanline grid effect -->
  <path d="M 82,90 L 158,90 M 82,98 L 158,98 M 82,106 L 158,106 M 82,114 L 158,114 M 82,122 L 158,122 M 82,130 L 158,130" stroke="#000000" stroke-width="0.7" opacity="0.3"/>

  <!-- ACTION-PACKED GAME GRAPHICS ON SCREEN -->
  <!-- Score/HUD -->
  <circle cx="92" cy="88" r="2" fill="#fbbf24"/>
  <circle cx="99" cy="88" r="2" fill="#fbbf24"/>
  <circle cx="106" cy="88" r="2" fill="#fbbf24"/>
  
  <!-- Flying Spaceship (Player) -->
  <g transform="translate(120, 105)">
    <!-- Jet Trail -->
    <polygon points="-12,2 -22,0 -12,-2" fill="#f43f5e" filter="url(#neonGlowPink)"/>
    <!-- Ship Body -->
    <polygon points="10,0 -8,7 -4,0 -8,-7" fill="#38bdf8" stroke="#f8fafc" stroke-width="1"/>
    <!-- Cockpit -->
    <ellipse cx="2" cy="0" rx="3" ry="2" fill="#fbbf24"/>
    <!-- Energy Blast -->
    <ellipse cx="16" cy="0" rx="4" ry="1.5" fill="#ffffff" filter="url(#neonGlowCyan)"/>
  </g>

  <!-- Obstacle / Enemy Space Alien -->
  <g transform="translate(95, 105)">
    <path d="M 0,-5 L 3,-8 L 6,-5 L 4,2 L -4,2 L -6,-5 L -3,-8 Z" fill="#ec4899" stroke="#fbcfe8" stroke-width="0.8"/>
    <circle cx="-2" cy="-4" r="1" fill="#fff"/>
    <circle cx="2" cy="-4" r="1" fill="#fff"/>
    <!-- Alien legs -->
    <line x1="-3" y1="2" x2="-5" y2="6" stroke="#ec4899" stroke-width="1"/>
    <line x1="3" y1="2" x2="5" y2="6" stroke="#ec4899" stroke-width="1"/>
  </g>

  <!-- Floating Bonus Star -->
  <g transform="translate(142, 92) scale(0.6)">
    <polygon points="0,-8 2,-2 8,-2 3,1 5,7 0,3 -5,7 -3,1 -8,-2 -2,-2" fill="#fbbf24" filter="url(#neonGlowPink)"/>
  </g>

  <!-- Screen Glass Reflection -->
  <path d="M 86,82 L 120,82 L 96,134 L 82,134 Z" fill="#ffffff" opacity="0.1"/>

  <!-- CONTROL PANEL DECK -->
  <!-- Angled Dashboard Base -->
  <path d="M 73,142 L 167,142 L 178,162 L 62,162 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <path d="M 76,145 L 164,145 L 173,159 L 67,159 Z" fill="#1e293b"/>

  <!-- Joystick 1 (Player 1 - Left) -->
  <g transform="translate(95, 150)">
    <!-- Base ring -->
    <ellipse cx="0" cy="4" rx="7" ry="3" fill="#475569"/>
    <ellipse cx="0" cy="3" rx="5" ry="2" fill="#0f172a"/>
    <!-- Shaft -->
    <line x1="0" y1="3" x2="-2" y2="-6" stroke="url(#stickMetal)" stroke-width="3" stroke-linecap="round"/>
    <!-- Ball Top -->
    <circle cx="-3" cy="-8" r="7" fill="#ef4444" filter="url(#neonGlowPink)"/>
    <circle cx="-5" cy="-10" r="2" fill="#fca5a5" opacity="0.8"/>
  </g>

  <!-- Arcade Buttons (Player 1 & 2 action buttons) -->
  <!-- Group 1 -->
  <g transform="translate(122, 148)">
    <circle cx="0" cy="4" r="3.5" fill="#3b82f6" filter="url(#neonGlowCyan)"/>
    <circle cx="8" cy="2" r="3.5" fill="#10b981"/>
    <circle cx="16" cy="5" r="3.5" fill="#f59e0b"/>
    <circle cx="8" cy="9" r="3.5" fill="#ec4899"/>
  </g>

  <!-- Coin Door & Speaker Grille Section (Lower Cabinet) -->
  <!-- Coin Slot Panel -->
  <rect x="105" y="172" width="30" height="22" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <!-- Coin Slot 1 -->
  <rect x="112" y="177" width="5" height="10" rx="1.5" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <!-- Coin Slot 2 -->
  <rect x="123" y="177" width="5" height="10" rx="1.5" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <circle cx="120" cy="190" r="1.5" fill="#ef4444"/>

  <!-- Speaker Grille Lines at bottom -->
  <g stroke="#0f172a" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="85" y1="180" x2="95" y2="180"/>
    <line x1="85" y1="185" x2="95" y2="185"/>
    <line x1="85" y1="190" x2="95" y2="190"/>

    <line x1="145" y1="180" x2="155" y2="180"/>
    <line x1="145" y1="185" x2="155" y2="185"/>
    <line x1="145" y1="190" x2="155" y2="190"/>
  </g>

  <!-- FOREGROUND / INTERACTIVE PROPS (Adding rich physical context) -->
  <!-- Loose Arcade Token / Coin spinning on the floor -->
  <g transform="translate(165, 195)">
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="#d97706"/>
    <ellipse cx="0" cy="0" rx="7" ry="3.5" fill="#fbbf24"/>
    <path d="M -2,-2 L 2,2 M -2,2 L 2,-2" stroke="#d97706" stroke-width="1"/>
  </g>
  <g transform="translate(58, 185) rotate(-20)">
    <ellipse cx="0" cy="0" rx="7" ry="4" fill="#f59e0b"/>
    <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="#fde047"/>
  </g>

  <!-- Handheld Gaming Console (Portable game device tossed nearby) -->
  <g transform="translate(42, 168) rotate(-15)">
    <!-- Body -->
    <rect x="0" y="0" width="36" height="20" rx="5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <!-- Screen -->
    <rect x="8" y="4" width="20" height="12" rx="2" fill="#0f172a"/>
    <!-- Mini screen graphic -->
    <circle cx="18" cy="10" r="3" fill="#ec4899" filter="url(#neonGlowPink)"/>
    <!-- D-Pad -->
    <path d="M 3,8 L 5,8 L 5,6 L 7,6 L 7,8 L 9,8 L 9,10 L 7,10 L 7,12 L 5,12 L 5,10 L 3,10 Z" fill="#1e293b"/>
    <!-- Action Button -->
    <circle cx="31" cy="8" r="2" fill="#ef4444"/>
    <circle cx="32" cy="13" r="1.5" fill="#10b981"/>
  </g>

  <!-- Popcorn / Snack cup spilled slightly for immersive "game room" atmosphere -->
  <g transform="translate(182, 172)">
    <path d="M 4,0 L 16,0 L 18,24 L 2,24 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Red stripes on cup -->
    <path d="M 7,0 L 8,24 M 11,0 L 12,24 M 15,0 L 15.5,24" stroke="#ef4444" stroke-width="2"/>
    <!-- Popcorn pieces bursting out -->
    <circle cx="10" cy="-4" r="4" fill="#fef08a"/>
    <circle cx="5" cy="-2" r="3.5" fill="#fef08a"/>
    <circle cx="15" cy="-3" r="4.5" fill="#fef08a"/>
    <circle cx="10" cy="-9" r="4" fill="#fef08a"/>
  </g>

  <!-- Dynamic lighting effects / Sparkles in air -->
  <g filter="url(#neonGlowCyan)">
    <circle cx="70" cy="95" r="1.5" fill="#38bdf8"/>
    <circle cx="170" cy="120" r="2" fill="#38bdf8"/>
    <circle cx="110" cy="30" r="1.5" fill="#38bdf8"/>
  </g>
  <g filter="url(#neonGlowPink)">
    <circle cx="150" cy="55" r="1.5" fill="#ec4899"/>
    <circle cx="85" cy="130" r="1.5" fill="#ec4899"/>
  </g>
</svg>