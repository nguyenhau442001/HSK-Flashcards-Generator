<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Wall and Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  <path d="M0 0 L240 0 L240 180 L0 180 Z" fill="#334155" opacity="0.3"/>
  
  <!-- Open Door with Light Spill -->
  <path d="M20 40 L80 30 L80 180 L20 190 Z" fill="#fbbf24" opacity="0.2"/>
  <rect x="20" y="40" width="10" height="150" fill="#1e293b"/>
  
  <!-- Wall Clock -->
  <circle cx="180" cy="60" r="22" fill="#f1f5f9"/>
  <circle cx="180" cy="60" r="18" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Clock Hands showing 9:25 (Late) -->
  <line x1="180" y1="60" x2="180" y2="48" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="60" x2="194" y2="68" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="180" cy="60" r="1.5" fill="#0f172a"/>

  <!-- Character: The Person Arriving Late -->
  <!-- Shadow -->
  <ellipse cx="130" cy="215" rx="30" ry="8" fill="#000" opacity="0.3"/>
  
  <!-- Body Rushing Forward -->
  <g transform="translate(100, 85)">
    <!-- Legs in motion -->
    <path d="M25 90 L10 125 L-5 120" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 90 L50 115 L70 110" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Torso leaning -->
    <path d="M20 35 Q35 30 50 40 L45 95 L20 90 Z" fill="#38bdf8"/>
    
    <!-- Arm checking watch -->
    <path d="M25 45 L5 55 L15 75" fill="none" stroke="#fdba74" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Watch -->
    <rect x="10" y="70" width="10" height="4" rx="1" fill="#1e293b" transform="rotate(25, 15, 72)"/>
    
    <!-- Arm holding briefcase -->
    <path d="M45 45 L65 65 L60 85" fill="none" stroke="#fdba74" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Briefcase -->
    <rect x="50" y="85" width="30" height="22" rx="2" fill="#92400e"/>
    <path d="M58 85 Q65 75 72 85" fill="none" stroke="#78350f" stroke-width="2"/>
    
    <!-- Head with flustered expression -->
    <circle cx="45" cy="20" r="15" fill="#fdba74"/>
    <!-- Hair -->
    <path d="M30 20 Q30 5 45 5 Q60 5 60 20 L30 20" fill="#475569"/>
    <!-- Eyes (wide) -->
    <circle cx="48" cy="18" r="1.5" fill="#0f172a"/>
    <circle cx="56" cy="18" r="1.5" fill="#0f172a"/>
    <!-- Mouth (panting/worried) -->
    <path d="M50 26 Q54 30 58 26" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Sweat droplet -->
    <path d="M30 15 Q28 18 30 21 Q32 18 30 15" fill="#38bdf8"/>
  </g>

  <!-- Motion Lines -->
  <line x1="70" y1="120" x2="90" y2="120" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="65" y1="140" x2="85" y2="140" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="75" y1="160" x2="95" y2="160" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Foreground: Edge of a Meeting Table -->
  <path d="M160 240 L240 240 L240 190 Q200 195 160 210 Z" fill="#1e293b"/>
  <path d="M170 205 L190 200" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>