<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mountain/Landscape Gradients -->
    <linearGradient id="mtnFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mtnMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="mtnNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Trail Gradient -->
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Character & Flag Gradients -->
    <linearGradient id="climberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <!-- Moon / Summit Halo -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="180" cy="60" r="20" fill="#fef08a" opacity="0.15"/>

  <!-- Distant Mountain Range -->
  <polygon points="0,170 50,110 110,160 170,100 240,150 240,240 0,240" fill="url(#mtnFar)"/>
  
  <!-- Mid Mountain Range -->
  <polygon points="0,190 70,130 140,180 200,120 240,160 240,240 0,240" fill="url(#mtnMid)" opacity="0.9"/>

  <!-- Winding Trail leading to the peak (representing the journey/process) -->
  <path d="M 30,220 Q 80,210 100,190 T 130,160 T 160,140 T 195,115" fill="none" stroke="url(#trailGrad)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Foreground Peak (The Final Destination) -->
  <polygon points="110,240 160,150 240,240" fill="url(#mtnNear)"/>
  <!-- Peak highlight facet -->
  <polygon points="195,115 160,150 240,240 225,240" fill="#0d9488" opacity="0.4"/>

  <!-- Floating particles / stardust of achievement -->
  <circle cx="165" cy="85" r="2.5" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="210" cy="95" r="1.5" fill="#38bdf8"/>
  <circle cx="190" cy="110" r="2" fill="#f59e0b"/>
  <circle cx="145" cy="100" r="1.5" fill="#fef08a"/>

  <!-- Summit Flag (Symbolizing 'Finally' achieved goal) -->
  <g transform="translate(192, 75)">
    <!-- Flagpole -->
    <line x1="0" y1="0" x2="0" y2="45" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pennant Flag waving -->
    <path d="M 0,2 C 12,-3 22,2 25,12 C 18,17 8,14 0,12 Z" fill="url(#flagGrad)" filter="url(#glow)"/>
    <!-- Base mount / rock anchor -->
    <circle cx="0" cy="45" r="3" fill="#64748b"/>
  </g>

  <!-- Victorious Climber at the Summit (Action-packed, dynamic pose) -->
  <g transform="translate(162, 95)">
    <!-- Backpack -->
    <rect x="-8" y="10" idth="8" height="14" rx="3" fill="#38bdf8" transform="rotate(15 -4 17)"/>
    
    <!-- Body / Torso -->
    <path d="M -2,8 L 6,20 L -2,28 L -8,16 Z" fill="url(#climberGrad)"/>

    <!-- Head with Helmet/Hair -->
    <circle cx="3" cy="2" r="6" fill="#fcd34d"/>
    <path d="M -1, -2 C 2, -4 7, -1 8, 2 L 3, 2 Z" fill="#b45309"/>

    <!-- Legs in dynamic climbing/standing posture -->
    <!-- Back Leg -->
    <path d="M -6,24 L -14,34 L -10,38" fill="none" stroke="#be185d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Leg (Planting firmly on the peak) -->
    <path d="M -2,27 L 4,37 L 9,37" fill="none" stroke="#be185d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arms raised in ultimate triumph (Finally!) -->
    <!-- Back Arm -->
    <path d="M 2,12 L 12,2 L 18,4" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Arm -->
    <path d="M 4,14 L 16,8 L 22,12" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Confetti / Success Burst (Expressing the 'Finally successful' payoff) -->
  <g transform="translate(195, 70)" filter="url(#glow)">
    <path d="M-10,-10 L-2,-2" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10,-15 L3,-5" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M15,5 L5,2" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-15,5 L-4,1" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-18" r="2" fill="#fbbf24"/>
    <circle cx="-18" cy="-5" r="1.5" fill="#38bdf8"/>
    <circle cx="16" cy="-8" r="2" fill="#ec4899"/>
  </g>

  <!-- Foreground Ground Texture / Rocks for depth -->
  <path d="M 0,240 L 0,225 Q 30,220 50,230 T 110,240 Z" fill="#0f766e" opacity="0.6"/>
  <path d="M 160,240 Q 180,225 210,235 T 240,240 Z" fill="#115e59"/>

</svg>