<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Background Elements (Kitchen/Table setting) -->
  <path d="M0 170 C60 160 180 160 240 170 L240 240 L0 240 Z" fill="#1e293b"/>
  <rect x="0" y="166" width="240" height="4" fill="#334155"/>
  
  <!-- Background warm glowing light circle -->
  <circle cx="120" cy="100" r="70" fill="#38bdf8" opacity="0.08"/>

  <!-- Secondary Prop: A small glass or bowl to create context for "pouring water into the bottle" -->
  <g transform="translate(45, 145)">
    <ellipse cx="25" cy="15" rx="15" ry="6" fill="#64748b" opacity="0.4"/>
    <path d="M12 15 L17 45 C17 48 33 48 33 45 L38 15 Z" fill="#94a3b8" opacity="0.8"/>
    <ellipse cx="25" cy="15" rx="13" ry="5" fill="#38bdf8" opacity="0.5"/>
  </g>

  <!-- Water Splash / Action Effect (dynamic motion) -->
  <g opacity="0.85">
    <path d="M85 80 Q105 50 120 70 Q135 90 140 115" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="95" cy="65" r="3" fill="#38bdf8"/>
    <circle cx="110" cy="55" r="2" fill="#38bdf8"/>
    <circle cx="130" cy="85" r="4" fill="#38bdf8"/>
    <circle cx="138" cy="100" r="2.5" fill="#bae6fd"/>
  </g>

  <!-- MAIN SUBJECT: Cái chai, lọ (The Bottle / 瓶子) -->
  <g transform="translate(100, 45)">
    <!-- Drop Shadow on table -->
    <ellipse cx="20" cy="130" rx="18" ry="6" fill="#020617" opacity="0.6"/>

    <!-- Bottle Body (Glass/Translucent container) -->
    <!-- Base shape -->
    <path d="M12 35 C12 25 15 20 18 20 L22 20 C25 20 28 25 28 35 L34 50 C38 65 38 110 36 120 C35 125 30 128 20 128 C10 128 5 125 4 120 C2 110 2 65 6 50 Z" fill="#0ea5e9" opacity="0.15"/>
    
    <!-- Liquid inside the bottle -->
    <path d="M7 75 L33 75 C35 90 35 110 34 119 C33 124 28 126 20 126 C12 126 7 124 6 119 C5 110 5 90 7 75 Z" fill="#38bdf8" opacity="0.75"/>
    
    <!-- Liquid surface wave/ellipse -->
    <ellipse cx="20" cy="75" rx="13" ry="4" fill="#0284c7" opacity="0.8"/>

    <!-- Bottle Outer Contour -->
    <path d="M14 32 C14 24 16 20 18 20 L22 20 C24 20 26 24 26 32" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <path d="M14 32 L8 50 C4 65 4 110 6 120 C7 125 12 128 20 128 C28 128 33 125 34 120 C36 110 36 65 32 50 L26 32" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linejoin="round"/>

    <!-- Bottle Neck & Cap / Cork -->
    <!-- Cork / Cap -->
    <rect x="15" y="10" width="10" height="10" rx="3" fill="#f59e0b"/>
    <rect x="14" y="17" width="12" height="4" rx="1" fill="#d97706"/>
    
    <!-- Highlights and Reflections for Glass Texture -->
    <!-- Long vertical reflection left -->
    <path d="M9 55 C8 70 8 100 10 115" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Short soft reflection right -->
    <path d="M30 60 C31 80 30 100 29 110" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles -->
  <circle cx="70" cy="90" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="165" cy="70" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="150" cy="140" r="2" fill="#fb923c" opacity="0.6"/>
  
  <!-- Additional playful ambient details -->
  <path d="M30 40 Q35 35 40 40 Q35 45 30 40 Z" fill="#fbbf24" opacity="0.4"/>
</svg>