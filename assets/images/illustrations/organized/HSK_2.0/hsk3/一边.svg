<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for TV/Living Room feel -->
    <radialGradient id="tv-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- UI/Action flow gradient -->
    <linearGradient id="action-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior Elements (Background) -->
  <g id="room-background">
    <!-- Wall Art / Window Frame -->
    <rect x="25" y="25" width="190" height="110" rx="12" fill="#131c31" />
    
    <!-- TV Screen on the Wall (representing the "watching TV" action) -->
    <rect x="55" y="40" width="130" height="80" rx="6" fill="#0b0f19" />
    <!-- TV Glow Effect -->
    <circle cx="120" cy="80" r="55" fill="url(#tv-glow)" />
    <!-- Abstract TV Content: Vibrant colorful show graphic -->
    <path d="M70 95 L95 65 L115 85 L145 55 L170 95 Z" fill="#38bdf8" opacity="0.8" />
    <circle cx="150" cy="65" r="8" fill="#fb923c" />
    <!-- TV Inner Bezel -->
    <rect x="55" y="40" width="130" height="80" rx="6" fill="none" stroke="#334155" stroke-width="3" />
    <!-- TV Stand -->
    <path d="M110 120 L130 120 L135 128 L105 128 Z" fill="#475569" />
  </g>

  <!-- Ambient Light from TV onto the scene -->
  <path d="M0 130 Q120 180 240 130 L240 240 L0 240 Z" fill="#38bdf8" opacity="0.04" />

  <!-- Foreground Table Surface -->
  <path d="M 10 160 Q 120 145 230 160 L 235 220 Q 120 235 5 220 Z" fill="url(#table-grad)" filter="url(#soft-shadow)" />
  <!-- Table Front Edge for 3D depth -->
  <path d="M 5 220 Q 120 235 235 220 L 235 228 Q 120 243 5 228 Z" fill="#0f172a" />

  <!-- Props on Table (Left: Bowl of food, Right: Chopsticks/Drink) -->
  <g id="table-props" filter="url(#soft-shadow)">
    <!-- Chopsticks Holder / Extra dish -->
    <ellipse cx="45" cy="175" rx="12" ry="6" fill="#64748b" />
    <rect x="40" y="160" width="10" height="18" rx="3" fill="#cbd5e1" />
    <circle cx="45" cy="162" r="3" fill="#fb923c" />

    <!-- Drinking Glass -->
    <path d="M 195 160 L 205 160 L 208 195 L 192 195 Z" fill="#38bdf8" opacity="0.3" />
    <path d="M 194 165 L 206 165 L 205 185 L 195 185 Z" fill="#38bdf8" opacity="0.5" />
    <!-- Straw -->
    <line x1="202" y1="160" x2="210" y2="140" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />

    <!-- Main Bowl of Rice/Noodles (representing "eating") -->
    <ellipse cx="85" cy="180" rx="22" ry="10" fill="#475569" />
    <path d="M 63 180 C 63 200 107 200 107 180 Z" fill="#e2e8f0" />
    <!-- Food inside bowl -->
    <ellipse cx="85" cy="182" rx="18" ry="7" fill="#f8fafc" />
    <!-- Chopsticks picking up food -->
    <line x1="75" y1="150" x2="95" y2="178" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
    <line x1="79" y1="148" x2="98" y2="177" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Main Character: Friendly Cartoon Person sitting at the table -->
  <g id="character" filter="url(#soft-shadow)">
    <!-- Body / Hoodie / Torso -->
    <path d="M 100 170 Q 120 160 140 170 L 155 220 L 85 220 Z" fill="#10b981" />
    <path d="M 110 170 L 110 200 L 130 200 L 130 170 Z" fill="#047857" opacity="0.3" /> <!-- Hoodie zipper area -->

    <!-- Neck -->
    <rect x="112" y="142" width="16" height="15" rx="4" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="120" cy="120" r="26" fill="#fbcfe8" />
    
    <!-- Hair Style -->
    <path d="M 94 120 C 94 100 110 92 124 92 C 142 92 146 108 146 120 C 146 120 140 112 130 112 C 120 112 110 118 94 120 Z" fill="#334155" />
    <path d="M 94 120 Q 105 105 125 102 Q 146 110 146 122 C 140 116 125 115 110 118 Z" fill="#1e293b" />

    <!-- Face Features (Happy, engaged expression watching TV) -->
    <!-- Eyes (Happy arcs) -->
    <path d="M 108 118 Q 112 113 116 118" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 124 118 Q 128 113 132 118" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Cheeks (Blush) -->
    <circle cx="106" cy="123" r="4" fill="#fb7185" opacity="0.6" />
    <circle cx="134" cy="123" r="4" fill="#fb7185" opacity="0.6" />
    <!-- Open Happy Smile -->
    <path d="M 115 125 Q 120 132 125 125" fill="#1e293b" />

    <!-- Arms interacting with the scene -->
    <!-- Left Arm (Holding chopsticks towards bowl) -->
    <path d="M 100 170 Q 80 175 75 160" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
    <!-- Right Arm (Relaxed, holding cup or resting) -->
    <path d="M 140 170 Q 165 175 175 160" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
    <circle cx="177" cy="157" r="6" fill="#fbcfe8" />
  </g>

  <!-- Dynamic Simultaneous Action Indicators (Visualizing "Doing two things at once / while") -->
  <!-- Floating musical/entertainment notes representing TV watching -->
  <g transform="translate(160, 75)" opacity="0.8">
    <path d="M0 10 L5 0 L15 3 L10 13 Z" fill="#fbbf24" />
    <circle cx="3" cy="12" r="3" fill="#fbbf24" />
    <circle cx="13" cy="5" r="3" fill="#fbbf24" />
  </g>
  <g transform="translate(45, 85)" opacity="0.8">
    <circle cx="5" cy="5" r="4" fill="#38bdf8" />
    <path d="M 12 2 Q 18 0 20 8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Subtle glowing synchronization arcs floating above the character to denote 'concurrent action' -->
  <path d="M 85 90 C 85 70 155 70 155 90" fill="none" stroke="url(#action-grad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" />
  <path d="M 95 82 C 95 65 145 65 145 82" fill="none" stroke="url(#action-grad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />

</svg>