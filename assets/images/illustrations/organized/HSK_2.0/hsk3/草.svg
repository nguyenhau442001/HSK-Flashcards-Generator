<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGradient)" />

  <!-- Distant Hill -->
  <path d="M-10 240 Q 80 160 250 210 L250 240 Z" fill="#0f3d33" opacity="0.6" />

  <!-- Main Grass Field -->
  <path d="M-10 240 L-10 190 Q 120 150 250 195 L250 240 Z" fill="url(#grassGradient)" />

  <!-- Individual Grass Blades (Textured Detail) -->
  <g fill="#10b981">
    <path d="M30 185 Q 32 170 35 182 T 40 175" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M70 175 Q 72 160 75 172 T 80 165" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M110 165 Q 112 150 115 162 T 120 155" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M160 170 Q 162 155 165 167 T 170 160" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M200 180 Q 202 165 205 177 T 210 170" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Flowers (The "many flowers" from the example) -->
  <!-- Pink Flower 1 -->
  <g transform="translate(50, 195)">
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#065f46" stroke-width="1.5" />
    <circle cx="0" cy="-12" r="3" fill="#ec4899" />
    <circle cx="-3" cy="-15" r="2.5" fill="#ec4899" />
    <circle cx="3" cy="-15" r="2.5" fill="#ec4899" />
    <circle cx="0" cy="-17" r="2.5" fill="#ec4899" />
    <circle cx="0" cy="-13.5" r="1.5" fill="#fde047" />
  </g>

  <!-- Orange Flower 2 -->
  <g transform="translate(140, 185)">
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#065f46" stroke-width="1.5" />
    <circle cx="0" cy="-18" r="4" fill="#fb923c" />
    <circle cx="0" cy="-18" r="1.5" fill="#f59e0b" />
  </g>

  <!-- Blue Flower 3 -->
  <g transform="translate(190, 205)">
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#065f46" stroke-width="1.5" />
    <path d="M-4 -12 Q 0 -18 4 -12 Q 0 -8 -4 -12" fill="#38bdf8" />
    <circle cx="0" cy="-12" r="1" fill="#ffffff" />
  </g>

  <!-- Yellow Flower 4 -->
  <g transform="translate(90, 215)">
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#065f46" stroke-width="1.5" />
    <circle cx="0" cy="-15" r="3" fill="#fbbf24" />
    <circle cx="0" cy="-15" r="1" fill="#92400e" />
  </g>

  <!-- Narrative Element: Butterfly -->
  <g transform="translate(160, 120) rotate(-15)">
    <path d="M0 0 Q 5 -8 10 -2 Q 5 2 0 0" fill="#ec4899" />
    <path d="M0 0 Q -5 -8 -10 -2 Q -5 2 0 0" fill="#ec4899" />
    <path d="M0 -2 L0 2" stroke="#1e293b" stroke-width="0.5" />
  </g>

  <!-- Atmospheric Depth: Soft Glows -->
  <circle cx="200" cy="60" r="1" fill="#fbbf24" opacity="0.8" />
  <circle cx="40" cy="80" r="1" fill="#38bdf8" opacity="0.6" />
  <circle cx="120" cy="40" r="1.5" fill="#ffffff" opacity="0.4" />
  
  <!-- Foreground Grass Tufts -->
  <path d="M20 240 Q 25 210 15 240 M25 240 Q 35 200 45 240 M40 240 Q 45 220 55 240" fill="none" stroke="#064e3b" stroke-width="3" stroke-linecap="round" />
  <path d="M180 240 Q 185 215 175 240 M185 240 Q 195 205 205 240 M200 240 Q 205 225 215 240" fill="none" stroke="#064e3b" stroke-width="3" stroke-linecap="round" />
</svg>