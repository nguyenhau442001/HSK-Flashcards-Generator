<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="160" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Base background -->
    <rect width="240" height="240" fill="url(#bgGrad)"/>
    
    <!-- Warm window light beam -->
    <polygon points="120,0 200,0 240,240 40,240" fill="url(#beamGrad)"/>

    <!-- Wallpaper details -->
    <g stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4">
      <line x1="0" y1="60" x2="240" y2="60"/>
      <line x1="0" y1="120" x2="240" y2="120"/>
    </g>

    <!-- Background Props (Bookshelf, Plant) -->
    <g transform="translate(180, 50)">
      <!-- Mini bookshelf -->
      <rect x="0" y="0" width="45" height="90" rx="4" fill="#334155"/>
      <rect x="5" y="25" width="35" height="6" fill="#475569"/>
      <rect x="5" y="60" width="35" height="6" fill="#475569"/>
      <!-- Books -->
      <path d="M8 10h6v15h-6z" fill="#f43f5e"/>
      <path d="M16 12h5v13h-5z" fill="#38bdf8"/>
      <path d="M23 8h8v17h-8z" fill="#fbbf24"/>
      <path d="M8 45h7v15h-7z" fill="#10b981"/>
      <path d="M17 42h6v18h-6z" fill="#a855f7"/>
    </g>

    <!-- Potted Plant on Floor -->
    <g transform="translate(25, 125)">
      <ellipse cx="20" cy="45" rx="16" ry="6" fill="#0f172a" opacity="0.5"/>
      <path d="M10 25 L15 45 L25 45 L30 25 Z" fill="#64748b"/>
      <ellipse cx="20" cy="25" rx="10" ry="3" fill="#94a3b8"/>
      <!-- Leaves -->
      <path d="M20 22 C10 15 5 0 5 0 C5 0 15 10 20 22 Z" fill="#10b981"/>
      <path d="M22 22 C30 12 38 2 38 2 C38 2 28 12 22 22 Z" fill="#34d399"/>
      <path d="M20 25 C15 8 22 -5 22 -5 C22 -5 18 10 20 25 Z" fill="#059669"/>
    </g>

    <!-- Wooden Floor Area -->
    <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
    <!-- Floor planks lines -->
    <path d="M-20 180 L260 180 M-10 205 L250 205 M0 230 L240 230" stroke="#1e293b" stroke-width="2" opacity="0.6"/>

    <!-- Rug on floor -->
    <g transform="translate(70, 170)">
      <ellipse cx="60" cy="35" rx="55" ry="20" fill="#0284c7" opacity="0.9"/>
      <ellipse cx="60" cy="35" rx="45" ry="15" fill="#38bdf8" opacity="0.4"/>
      <!-- Rug pattern stripes -->
      <path d="M30 25 Q60 45 90 25" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M20 35 Q60 55 100 35" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Main Subject: Cleaning Action (Broom & Dust particles) -->
    
    <!-- Dust Pile being swept -->
    <g transform="translate(130, 190)">
      <ellipse cx="15" cy="15" rx="18" ry="6" fill="#0f172a" opacity="0.6"/>
      <!-- Dust motes swirling up -->
      <circle cx="10" cy="5" r="3" fill="#cbd5e1" opacity="0.7"/>
      <circle cx="2" cy="-5" r="2" fill="#cbd5e1" opacity="0.5"/>
      <circle cx="22" cy="0" r="2.5" fill="#cbd5e1" opacity="0.6"/>
      <circle cx="30" cy="-10" r="1.5" fill="#cbd5e1" opacity="0.4"/>
      <path d="M5 12 C10 10 15 15 20 10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Sparkling cleaning effect / bubbles -->
    <g transform="translate(140, 140)">
      <path d="M0 0 L6 6 M6 0 L0 6" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(85, 165)">
      <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
      <circle cx="12" cy="-8" r="2" fill="#38bdf8"/>
    </g>

    <!-- Dynamic Broom -->
    <!-- Handle extending up and right -->
    <g transform="rotate(-15, 140, 140)">
      <!-- Broomstick (Wooden pole) -->
      <line x1="140" y1="20" x2="140" y2="150" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
      <line x1="138" y1="20" x2="138" y2="150" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

      <!-- Top handle cap -->
      <circle cx="140" cy="20" r="5" fill="#78350f"/>

      <!-- Broom Head (Bristles and connector) -->
      <g transform="translate(140, 150)">
        <!-- Connector cap -->
        <rect x="-14" y="-8" width="28" height="12" rx="3" fill="#0284c7"/>
        
        <!-- Bristles gradient/shape -->
        <path d="M-18 4 L18 4 L24 22 L-24 22 Z" fill="#fbbf24"/>
        <!-- Bristles texture lines -->
        <path d="M-14 4 L-18 22 M-7 4 L-9 22 M0 4 L0 22 M7 4 L9 22 M14 4 L18 22" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
        
        <!-- Motion lines indicating sweeping action -->
        <path d="M-30 15 C-40 12 -45 8 -50 5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M-25 22 C-35 18 -42 14 -46 10" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      </g>
    </g>

    <!-- Secondary cleaning prop: Bucket with bubbles -->
    <g transform="translate(45, 175)">
      <!-- Bucket body -->
      <path d="M4 0 L16 35 L34 35 L46 0 Z" fill="#38bdf8"/>
      <!-- Bucket rim -->
      <ellipse cx="25" cy="0" rx="22" ry="5" fill="#0284c7"/>
      <!-- Water line inside -->
      <ellipse cx="25" cy="5" rx="19" ry="4" fill="#0284c7" opacity="0.6"/>
      <!-- Bucket handle -->
      <path d="M6 -2 C 6 -15, 44 -15, 44 -2" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/>
      
      <!-- Soapy bubbles overflowing -->
      <circle cx="20" cy="-3" r="5" fill="#f8fafc" opacity="0.9"/>
      <circle cx="28" cy="-5" r="4" fill="#f8fafc" opacity="0.9"/>
      <circle cx="24" cy="-9" r="3" fill="#f8fafc" opacity="0.8"/>
    </g>

    <!-- Foreground lighting / Vignette overlay -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </radialGradient>
    <rect width="240" height="240" fill="url(#vignette)" pointer-events="none"/>

    <!-- Subtle App Border Frame -->
    <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
  </g>
</svg>