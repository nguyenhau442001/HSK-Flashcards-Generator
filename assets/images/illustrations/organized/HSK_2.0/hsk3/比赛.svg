<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Stadium Floor -->
  <path d="M0 180 Q120 170 240 180 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <path d="M0 185 L240 185" stroke="#475569" stroke-width="0.5" fill="none"/>
  <path d="M0 205 L240 205" stroke="#475569" stroke-width="0.5" fill="none"/>
  <path d="M40 180 L-20 240 M100 175 L60 240 M160 175 L200 240 M220 180 L280 240" stroke="#475569" stroke-width="0.5" fill="none"/>

  <!-- Background Atmosphere / Lights -->
  <circle cx="40" cy="60" r="30" fill="url(#glow)"/>
  <circle cx="200" cy="60" r="30" fill="url(#glow)"/>
  <circle cx="40" cy="60" r="2" fill="#fef3c7" opacity="0.8"/>
  <circle cx="200" cy="60" r="2" fill="#fef3c7" opacity="0.8"/>

  <!-- Basketball Hoop -->
  <rect x="185" y="40" width="45" height="35" rx="2" fill="#94a3b8" fill-opacity="0.2" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="198" y="52" width="18" height="12" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M185 65 L175 65" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="165" cy="65" rx="12" ry="3" fill="none" stroke="#fb923c" stroke-width="2"/>
  <path d="M155 66 L158 85 M175 66 L172 85 M160 68 L165 88 M170 68 L165 88" stroke="#f1f5f9" stroke-width="1" opacity="0.6"/>

  <!-- Action: The Player (Stylized Silhouette) -->
  <g transform="translate(60, 80)">
    <!-- Body/Jersey -->
    <path d="M45 45 L35 75 L55 75 L65 45 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="55" cy="35" r="8" fill="#fdba74"/>
    <!-- Arms reaching for the ball -->
    <path d="M50 45 L75 25 L85 20" stroke="#fdba74" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M60 45 L80 30 L90 25" stroke="#fdba74" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Legs in motion -->
    <path d="M38 75 L25 105 L15 100" stroke="#fdba74" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M52 75 L65 95 L80 90" stroke="#fdba74" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Shorts -->
    <path d="M35 75 L55 75 L60 85 L30 85 Z" fill="#0ea5e9"/>
  </g>

  <!-- The Basketball -->
  <g transform="translate(155, 100)">
    <circle cx="0" cy="0" r="10" fill="#fb923c"/>
    <path d="M-10 0 Q0 0 10 0 M0 -10 Q0 0 0 10 M-7 -7 Q0 0 7 7 M-7 7 Q0 0 7 -7" stroke="#0f172a" stroke-width="1" fill="none" opacity="0.4"/>
    <!-- Motion Lines -->
    <path d="M-15 15 L-25 25 M-20 10 L-35 15 M-10 20 L-15 35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Speed/Action Accents -->
  <path d="M30 120 Q20 130 30 140" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M40 150 L20 160" stroke="#10b981" stroke-width="2" fill="none" opacity="0.5"/>
  <circle cx="120" cy="190" r="1.5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="140" cy="185" r="1" fill="#f59e0b" opacity="0.4"/>
  <circle cx="100" cy="195" r="1" fill="#f59e0b" opacity="0.4"/>

  <!-- Foreground Depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
</svg>