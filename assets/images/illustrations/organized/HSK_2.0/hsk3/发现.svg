<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Desk Items -->
  <rect x="160" y="170" width="40" height="10" rx="2" fill="#475569"/>
  <circle cx="180" cy="160" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M40 180 C40 140, 80 140, 80 180 L80 180" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="60" cy="110" r="25" fill="#fde68a"/>
    <!-- Eyes (Surprised/Discovery) -->
    <ellipse cx="50" cy="105" rx="3" ry="5" fill="#0f172a"/>
    <ellipse cx="70" cy="105" rx="3" ry="5" fill="#0f172a"/>
    <!-- Mouth -->
    <path d="M55 120 Q60 125 65 120" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Arm reaching out -->
    <path d="M80 130 L120 100" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- The "Discovery" Object (A glowing document/clue) -->
  <rect x="140" y="100" width="50" height="60" rx="4" fill="#f1f5f9"/>
  <rect x="145" y="110" width="40" height="5" rx="1" fill="#cbd5e1"/>
  <rect x="145" y="120" width="30" height="5" rx="1" fill="#cbd5e1"/>
  <rect x="145" y="130" width="40" height="5" rx="1" fill="#cbd5e1"/>
  
  <!-- Glow effect -->
  <circle cx="165" cy="130" r="40" fill="#f59e0b" opacity="0.15"/>
  
  <!-- Magnifying Glass -->
  <g transform="translate(130, 90) rotate(15)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <path d="M33 33 L50 50" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Ambient Light Accents -->
  <circle cx="200" cy="40" r="3" fill="#10b981"/>
  <circle cx="30" cy="30" r="2" fill="#ec4899"/>
</svg>