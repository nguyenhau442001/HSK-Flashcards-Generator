<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Accent Glow -->
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow for Office Environment -->
  <circle cx="120" cy="90" r="110" fill="url(#lampGlow)"/>

  <!-- Back Wall & Architectural Details -->
  <rect x="0" y="140" width="240" height="100" fill="#0f172a" opacity="0.6"/>
  <line x1="0" y1="140" x2="240" y2="140" stroke="#334155" stroke-width="2"/>
  
  <!-- Window showing night/evening -->
  <g opacity="0.5">
    <rect x="25" y="30" width="60" height="85" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="55" y1="30" x2="55" y2="115" stroke="#334155" stroke-width="1.5"/>
    <line x1="25" y1="72" x2="85" y2="72" stroke="#334155" stroke-width="1.5"/>
    <!-- City lights outside -->
    <circle cx="38" cy="50" r="2" fill="#fbbf24" opacity="0.8"/>
    <circle cx="70" cy="90" r="1.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="45" cy="100" r="1.5" fill="#f43f5e" opacity="0.8"/>
  </g>

  <!-- Wall Clock (Indicating running late time, e.g., 8:15) -->
  <g transform="translate(180, 50)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="0" cy="0" r="17" fill="#0f172a"/>
    <!-- Clock Hands -->
    <line x1="0" y1="0" x2="4" y2="-8" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-8" y2="-4" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#f43f5e" fill="#e2e8f0"/>
  </g>

  <!-- Office Desk Surface -->
  <path d="M 15 175 L 225 175 L 210 215 L 30 215 Z" fill="#334155" filter="url(#shadow)"/>
  <path d="M 15 175 L 225 175 L 225 182 L 15 182 Z" fill="#475569"/>

  <!-- Desk Props: Laptop & Papers -->
  <!-- Laptop Base -->
  <polygon points="120,175 195,175 180,158 135,158" fill="#64748b" opacity="0.9"/>
  <!-- Laptop Screen (open, glowing) -->
  <polygon points="135,158 180,158 175,120 140,120" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="144" y="125" width="27" height="24" rx="2" fill="#1e293b"/>
  <path d="M 148 133 L 157 141 L 167 129" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Coffee Mug -->
  <rect x="195" y="152" width="14" height="18" rx="3" fill="#cbd5e1"/>
  <path d="M 209 157 C 213 157 213 165 209 165" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Coat Hanger / Stand with jacket in background -->
  <path d="M 45 215 L 45 80" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M 30 95 L 45 85 L 60 95" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 35 92 Q 45 105 55 92" fill="#38bdf8" opacity="0.8"/> <!-- Jacket hanging -->

  <!-- MAIN CHARACTER: Late commuter rushing in, panting, looking at watch/door -->
  <!-- Character Body / Suit -->
  <g filter="url(#shadow)" transform="translate(0, 5)">
    <!-- Briefcase dropped / swinging motion -->
    <g transform="translate(75, 145) rotate(-15)">
      <rect x="-12" y="-8" width="24" height="18" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
      <path d="M -6 -8 C -6 -12 6 -12 6 -8" fill="none" stroke="#78350f" stroke-width="2"/>
      <rect x="-3" y="-2" width="6" height="5" rx="1" fill="#fbbf24"/>
    </g>

    <!-- Legs in motion (running stride) -->
    <!-- Back Leg -->
    <path d="M 115 145 L 100 175 L 85 178" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="80" cy="180" rx="7" ry="4" fill="#0f172a"/>
    
    <!-- Front Leg -->
    <path d="M 125 145 L 140 170 L 155 172" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="160" cy="173" rx="8" ry="4" fill="#0f172a"/>

    <!-- Torso (Suit Jacket) -->
    <path d="M 105 100 L 145 100 L 150 150 L 100 150 Z" fill="#1e3a8a"/>
    <!-- Shirt Collar & Tie -->
    <polygon points="125,100 135,100 130,118" fill="#f8fafc"/>
    <polygon points="127,112 133,112 131,135 129,135" fill="#f43f5e"/>

    <!-- Arms in dynamic running pose -->
    <!-- Back Arm -->
    <path d="M 110 105 L 90 120 L 80 115" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="78" cy="113" r="4" fill="#fde68a"/>

    <!-- Front Arm (checking watch frantically) -->
    <path d="M 140 105 L 155 125 L 145 135" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="143" cy="137" r="4" fill="#fde68a"/>
    <!-- Watch / Band -->
    <rect x="141" y="132" width="4" height="6" fill="#38bdf8"/>

    <!-- Neck & Head -->
    <rect x="122" y="90" width="16" height="14" fill="#fde68a" rx="4"/>
    
    <!-- Head -->
    <circle cx="130" cy="78" r="16" fill="#fde68a"/>
    <!-- Hair (messy from rushing) -->
    <path d="M 114 78 C 114 62 146 62 146 78 C 146 74 142 66 130 66 C 118 66 114 74 114 78 Z" fill="#334155"/>
    <path d="M 135 64 C 142 60 148 66 145 72" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Expressive Face (Sweating, Wide Eyes, Panicked/Embarrassed smile) -->
    <!-- Eyebrows (slanted up in panic) -->
    <line x1="121" y1="72" x2="127" y2="75" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="133" y1="75" x2="139" y2="72" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Eyes (Wide & anxious) -->
    <circle cx="124" cy="78" r="2.5" fill="#1e293b"/>
    <circle cx="136" cy="78" r="2.5" fill="#1e293b"/>

    <!-- Open Panicked Mouth -->
    <path d="M 126 86 C 126 91 134 91 134 86 Z" fill="#991b1b"/>

    <!-- Sweat Drop (Classic anime/cartoon trope for stress/running) -->
    <path d="M 145 75 C 145 75 150 82 150 85 C 150 88 147 90 145 90 C 143 90 140 88 140 85 C 140 82 145 75 145 75 Z" fill="#38bdf8" opacity="0.9" filter="url(#shadow)"/>
  </g>

  <!-- ACTION REPETITION VISUAL CUES (Representing "Again" / 又) -->
  <!-- Ghosted trail of the character running in previously, emphasizing recurrence -->
  <g opacity="0.25">
    <!-- Trail figure 1 -->
    <path d="M 95 110 L 105 150 L 85 150 Z" fill="#38bdf8"/>
    <circle cx="100" cy="95" r="12" fill="#38bdf8"/>
    
    <!-- Motion Action Lines (indicating rushing back and forth / recurrence) -->
    <path d="M 60 130 Q 75 120 90 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
    <path d="M 50 140 Q 70 130 85 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  </g>

  <!-- Circular Loop / Repeat Graphic Indicator subtly integrated into the environment (Floating futuristic UI cue for app context, clean and stylish) -->
  <g transform="translate(195, 110)" filter="url(#shadow)" opacity="0.85">
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-dasharray="75 25" stroke-dashoffset="10"/>
    <!-- Arrowhead for cycle -->
    <path d="M 10 10 L 15 14 L 11 17" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Exclamation mark inside loop representing "Late again!" -->
    <line x1="0" y1="-5" x2="0" y2="2" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="7" r="1.2" fill="#fbbf24"/>
  </g>

  <!-- Additional floor details -->
  <ellipse cx="125" cy="210" rx="45" ry="4" fill="#0f172a" opacity="0.5"/>
</svg>