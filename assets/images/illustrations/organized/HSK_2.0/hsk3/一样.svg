<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Shirt 1 Gradient (Emerald Theme) -->
    <linearGradient id="shirt-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shirt 2 Gradient (Exact Match - Emerald Theme) -->
    <linearGradient id="shirt-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Hanger Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Light Glow -->
  <circle cx="120" cy="80" r="100" fill="url(#lamp-glow)"/>

  <!-- Background Wall Details (Shelf / Studio Vibe) -->
  <path d="M40 70 L200 70" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Decorative small items on shelf -->
  <circle cx="70" cy="62" r="6" fill="#38bdf8"/>
  <rect x="160" y="56" width="16" height="14" rx="3" fill="#f43f5e"/>

  <!-- Studio Table Surface -->
  <path d="M 20 180 Q 120 170 220 180 L 235 220 Q 120 230 5 220 Z" fill="url(#table-grad)" filter="url(#soft-shadow)"/>
  <!-- Table Front Edge -->
  <path d="M 5 220 Q 120 230 235 220 L 235 225 Q 120 235 5 225 Z" fill="#0f172a"/>

  <!-- SCENE OBJECT: TWO IDENTICAL SHIRTS REPRESENTING "一样" -->

  <!-- LEFT SHIRT (Hanging on a sleek stand) -->
  <g transform="translate(45, 85)" filter="url(#drop-shadow)">
    <!-- Stand / Hook -->
    <path d="M 35 15 C 35 5, 55 5, 55 15 L 55 35" fill="none" stroke="url(#metal-grad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="12" r="3" fill="#cbd5e1"/>

    <!-- Shirt Body -->
    <path d="M 15 35 
             L 45 38 
             L 75 35 
             L 95 55 
             L 80 65 
             L 75 55 
             L 75 125 
             L 15 125 
             L 15 55 
             L 10 65 
             L -5 55 Z" 
          fill="url(#shirt-grad-1)"/>

    <!-- Collar Detail -->
    <path d="M 30 38 Q 45 48 60 38 Q 45 35 30 38 Z" fill="#065f46"/>

    <!-- Pocket -->
    <path d="M 55 65 L 70 65 L 70 82 Q 62.5 86 55 82 Z" fill="#065f46" opacity="0.4"/>

    <!-- Graphic Stripe Detail on Shirt -->
    <path d="M 20 50 L 40 52" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 20 56 L 35 58" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- RIGHT SHIRT (Laid neatly/displayed on the table, perfectly matching the first) -->
  <g transform="translate(115, 95)" filter="url(#drop-shadow)">
    <!-- Stand / Hook -->
    <path d="M 35 15 C 35 5, 55 5, 55 15 L 55 35" fill="none" stroke="url(#metal-grad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="12" r="3" fill="#cbd5e1"/>

    <!-- Shirt Body -->
    <path d="M 15 35 
             L 45 38 
             L 75 35 
             L 95 55 
             L 80 65 
             L 75 55 
             L 75 125 
             L 15 125 
             L 15 55 
             L 10 65 
             L -5 55 Z" 
          fill="url(#shirt-grad-2)"/>

    <!-- Collar Detail -->
    <path d="M 30 38 Q 45 48 60 38 Q 45 35 30 38 Z" fill="#065f46"/>

    <!-- Pocket -->
    <path d="M 55 65 L 70 65 L 70 82 Q 62.5 86 55 82 Z" fill="#065f46" opacity="0.4"/>

    <!-- Graphic Stripe Detail on Shirt -->
    <path d="M 20 50 L 40 52" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 20 56 L 35 58" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- MATCHING / EQUALITY VISUAL ACCENT (Subtle glowing check/equals indicator linking them) -->
  <g transform="translate(103, 130)">
    <!-- Glowing background badge -->
    <circle cx="17" cy="17" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#soft-shadow)"/>
    <!-- Equals / Match Icon -->
    <path d="M 10 13 L 24 13" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 10 21 L 24 21" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Foreground ambient props (e.g., measuring tape curl or tag on the table) -->
  <path d="M 35 195 Q 50 185 65 195 T 95 195" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" filter="url(#soft-shadow)"/>
  <rect x="90" y="188" width="12" height="8" rx="2" fill="#f59e0b"/>

</svg>