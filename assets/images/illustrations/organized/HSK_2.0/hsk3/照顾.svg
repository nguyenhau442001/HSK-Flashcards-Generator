<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blanket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)"/>

  <!-- Room Interior & Props -->
  <!-- Wallpaper line / cozy back wall -->
  <path d="M0 170 H240" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
  
  <!-- Window with night sky -->
  <rect x="25" y="30" width="50" height="70" rx="4" fill="#090d16" stroke="#475569" stroke-width="3"/>
  <!-- Stars outside -->
  <circle cx="40" cy="45" r="1.5" fill="#e2e8f0"/>
  <circle cx="60" cy="75" r="1" fill="#e2e8f0"/>
  <circle cx="50" cy="60" r="2" fill="#fde047"/>
  <!-- Curtains -->
  <path d="M25 30 Q35 65 25 100" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
  <path d="M75 30 Q65 65 75 100" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>

  <!-- Bed / Child's Crib -->
  <rect x="90" y="115" width="125" height="85" rx="12" fill="#334155"/>
  <rect x="98" y="125" width="110" height="70" rx="8" fill="#1e293b"/>

  <!-- Pillow -->
  <rect x="106" y="135" width="35" height="25" rx="6" fill="#f8fafc"/>
  
  <!-- Sleeping Child -->
  <circle cx="120" cy="148" r="10" fill="#fbcfe8"/> <!-- Head -->
  <path d="M113 147 Q117 151 121 147" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/> <!-- Closed eye -->
  
  <!-- Blanket -->
  <path d="M100 152 C 100 152, 140 148, 185 160 C 200 164, 208 175, 208 190 L 100 190 Z" fill="url(#blanket-grad)"/>
  <!-- Blanket pattern (stars) -->
  <circle cx="130" cy="170" r="2" fill="#bae6fd"/>
  <circle cx="160" cy="165" r="2.5" fill="#bae6fd"/>
  <circle cx="185" cy="180" r="2" fill="#bae6fd"/>

  <!-- Nightstand with Warm Lamp -->
  <rect x="180" y="75" width="40" height="40" rx="4" fill="#64748b"/>
  <!-- Lamp Base & Shade -->
  <path d="M195 75 L205 75 L208 60 L192 60 Z" fill="#fbbf24"/>
  <path d="M200 75 V60" stroke="#334155" stroke-width="2"/>
  <circle cx="200" cy="58" r="3" fill="#fef08a"/>

  <!-- Medicine bottle / glass of water on nightstand -->
  <rect x="188" y="90" width="8" height="15" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="204" y="92" width="6" height="13" rx="1" fill="#f8fafc" opacity="0.9"/>
  <path d="M204 95 H210" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Caregiver (Mother/Father) leaning over tenderly -->
  <g transform="translate(0, 0)">
    <!-- Body & Torso -->
    <path d="M 85 210 C 85 170, 75 140, 60 120 C 45 100, 50 85, 65 75 C 78 66, 92 78, 98 90 C 108 110, 115 145, 120 210 Z" fill="#ec4899"/>
    
    <!-- Arm reaching out to adjust blanket / touch forehead -->
    <path d="M 75 95 Q 105 110, 118 140" fill="none" stroke="#f43f5e" stroke-width="14" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="123" cy="143" r="6" fill="#fbcfe8"/>

    <!-- Head & Hair -->
    <circle cx="65" cy="70" r="15" fill="#fbcfe8"/>
    <!-- Hair bun / style -->
    <path d="M 52 68 C 50 55, 75 50, 78 65" fill="#0f172a"/>
    <circle cx="75" cy="52" r="7" fill="#0f172a"/>

    <!-- Gentle Facial Expression (Profile) -->
    <path d="M 73 71 Q 76 73, 73 75" fill="none" stroke="#be185d" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Floating heart symbol representing care and affection -->
  <g transform="translate(135, 95) scale(0.8)">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#f43f5e"/>
  </g>
  <g transform="translate(155, 110) scale(0.5)">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#fb7185"/>
  </g>

  <!-- Floor details / Rug -->
  <ellipse cx="140" cy="215" rx="70" ry="12" fill="#0f172a" opacity="0.5"/>
  
  <!-- Slippers by the bed -->
  <path d="M 75 205 Q 85 203, 90 208 Q 85 213, 75 211 Z" fill="#fb923c"/>
  <path d="M 75 214 Q 85 212, 90 217 Q 85 222, 75 220 Z" fill="#fb923c"/>
</svg>