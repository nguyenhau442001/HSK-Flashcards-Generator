<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Bamboo Leaf Gradient -->
    <linearGradient id="bamboo-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Bamboo Stalk Gradient -->
    <linearGradient id="bamboo-stalk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="30%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Warm Golden Light Glow -->
    <radialGradient id="sun-glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Backlighting -->
  <circle cx="200" cy="40" r="120" fill="url(#sun-glow)"/>

  <!-- Background Bamboo Shoots & Stalks -->
  <g opacity="0.4">
    <!-- Tall left stalk -->
    <rect x="25" y="0" width="10" height="240" fill="url(#bamboo-stalk)" rx="4"/>
    <ellipse cx="30" cy="60" rx="14" ry="3" fill="#047857"/>
    <ellipse cx="30" cy="140" rx="14" ry="3" fill="#047857"/>
    <ellipse cx="30" cy="220" rx="14" ry="3" fill="#047857"/>

    <!-- Far right stalk -->
    <rect x="210" y="20" width="12" height="220" fill="url(#bamboo-stalk)" rx="4"/>
    <ellipse cx="216" cy="90" rx="16" ry="3" fill="#047857"/>
    <ellipse cx="216" cy="170" rx="16" ry="3" fill="#047857"/>
  </g>

  <!-- Foreground Foreground Bamboo & Leaves (Depth Effect) -->
  <g filter="url(#shadow)">
    <!-- Main Right Bamboo Stalk -->
    <rect x="185" y="-10" width="16" height="260" fill="url(#bamboo-stalk)" rx="6"/>
    <!-- Nodes -->
    <ellipse cx="193" cy="50" rx="10" ry="4" fill="#065f46"/>
    <ellipse cx="193" cy="110" rx="10" ry="4" fill="#065f46"/>
    <ellipse cx="193" cy="170" rx="10" ry="4" fill="#065f46"/>
    <ellipse cx="193" cy="230" rx="10" ry="4" fill="#065f46"/>

    <!-- Hanging Bamboo Leaves -->
    <path d="M 185 45 C 150 30, 130 50, 120 70 C 140 70, 165 60, 185 45 Z" fill="url(#bamboo-leaf)"/>
    <path d="M 190 120 C 155 110, 135 130, 125 150 C 145 145, 170 135, 190 120 Z" fill="url(#bamboo-leaf)"/>
    <path d="M 185 190 C 220 180, 230 200, 240 215 C 220 215, 200 205, 185 190 Z" fill="url(#bamboo-leaf)"/>
  </g>

  <!-- ENVIRONMENT: Ground Rock/Moss Mound -->
  <path d="M 0 210 Q 50 195, 120 200 T 240 215 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <path d="M 30 215 Q 90 200, 180 210 Q 220 213, 240 218 L 240 240 L 0 240 Z" fill="#1e293b"/>
  <!-- Moss patches -->
  <path d="M 40 215 Q 55 205, 75 213 Z" fill="#10b981" opacity="0.6"/>
  <path d="M 120 210 Q 140 203, 155 212 Z" fill="#10b981" opacity="0.6"/>

  <!-- MAIN SUBJECT: PANDA (Gấu trúc) -->
  <g filter="url(#shadow)" transform="translate(10, 10)">
    
    <!-- Panda Body (Sitting Rounded Shape) -->
    <ellipse cx="100" cy="155" rx="45" ry="40" fill="#f8fafc"/>

    <!-- Panda Hind Legs / Feet -->
    <ellipse cx="70" cy="180" rx="18" ry="12" fill="#1e293b"/>
    <ellipse cx="130" cy="180" rx="18" ry="12" fill="#1e293b"/>
    <!-- Foot pads (cute toe beans detail) -->
    <circle cx="65" cy="181" r="3" fill="#cbd5e1" opacity="0.5"/>
    <circle cx="135" cy="181" r="3" fill="#cbd5e1" opacity="0.5"/>

    <!-- Panda Arms resting on knees/holding bamboo -->
    <path d="M 70 135 C 55 145, 60 170, 75 165 C 85 162, 85 150, 80 140 Z" fill="#1e293b"/>
    <path d="M 130 135 C 145 145, 140 170, 125 165 C 115 162, 115 150, 120 140 Z" fill="#1e293b"/>

    <!-- Panda Head -->
    <g>
      <!-- Ears -->
      <circle cx="70" cy="85" r="16" fill="#1e293b"/>
      <circle cx="130" cy="85" r="16" fill="#1e293b"/>

      <!-- Head Base -->
      <circle cx="100" cy="105" r="40" fill="#f8fafc"/>

      <!-- Eye Patches (Angled playfully) -->
      <ellipse cx="83" cy="100" rx="12" ry="15" fill="#1e293b" transform="rotate(-15 83 100)"/>
      <ellipse cx="117" cy="100" rx="12" ry="15" fill="#1e293b" transform="rotate(15 117 100)"/>

      <!-- Sparkly Eyes -->
      <circle cx="85" cy="97" r="4" fill="#ffffff"/>
      <circle cx="87" cy="95" r="1.5" fill="#1e293b"/>
      <circle cx="115" cy="97" r="4" fill="#ffffff"/>
      <circle cx="113" cy="95" r="1.5" fill="#1e293b"/>

      <!-- Cute Nose & Muzzle -->
      <ellipse cx="100" cy="112" rx="6" ry="4" fill="#1e293b"/>
      <!-- Smile -->
      <path d="M 94 117 Q 100 123, 106 117" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Rosy Cheeks -->
      <ellipse cx="73" cy="116" rx="6" ry="3" fill="#fb7185" opacity="0.4"/>
      <ellipse cx="127" cy="116" rx="6" ry="3" fill="#fb7185" opacity="0.4"/>
    </g>

    <!-- Delicious Bamboo Snack in Paws -->
    <g transform="rotate(-25 100 145)">
      <!-- Stalk segment -->
      <rect x="75" y="135" width="50" height="12" rx="4" fill="url(#bamboo-stalk)"/>
      <!-- Node ring -->
      <line x1="95" y1="135" x2="95" y2="147" stroke="#047857" stroke-width="3"/>
      <!-- Fresh Bamboo Leaves attached to snack -->
      <path d="M 120 141 C 135 130, 145 140, 150 150 C 135 148, 125 145, 120 141 Z" fill="url(#bamboo-leaf)"/>
      <path d="M 80 141 C 65 130, 55 140, 50 150 C 65 148, 75 145, 80 141 Z" fill="url(#bamboo-leaf)"/>
    </g>
  </g>

  <!-- Foreground Floating Particles / Fireflies for HSK App Polish -->
  <g opacity="0.7">
    <circle cx="40" cy="80" r="2" fill="#fbbf24"/>
    <circle cx="60" cy="50" r="1.5" fill="#38bdf8"/>
    <circle cx="150" cy="70" r="2.5" fill="#fbbf24"/>
    <circle cx="30" cy="150" r="1" fill="#34d399"/>
    <circle cx="160" cy="190" r="2" fill="#fbbf24"/>
  </g>
</svg>