<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Branch Gradient -->
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Bird Body Gradient (Vibrant Blue) -->
    <linearGradient id="birdGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Bird Belly Gradient -->
    <linearGradient id="bellyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Moon & Bokeh) -->
  <circle cx="190" cy="60" r="28" fill="#fbbf24" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="190" cy="60" r="18" fill="#fef08a" opacity="0.2"/>
  
  <!-- Floating Nature Bokeh / Fireflies -->
  <circle cx="50" cy="80" r="3" fill="#38bdf8" opacity="0.4" filter="url(#glow)"/>
  <circle cx="85" cy="45" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="150" cy="110" r="2.5" fill="#38bdf8" opacity="0.3"/>
  <circle cx="40" cy="160" r="3.5" fill="#10b981" opacity="0.3"/>

  <!-- Background Foliage (Depth) -->
  <path d="M 0 160 Q 40 120 90 140 T 180 130 T 240 150 L 240 240 L 0 240 Z" fill="#064e3b" opacity="0.4"/>
  <path d="M 0 180 Q 70 140 130 170 T 240 160 L 240 240 L 0 240 Z" fill="#065f46" opacity="0.6"/>

  <!-- Main Tree Branch -->
  <path d="M -10 185 Q 90 165 250 135" stroke="#291104" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M -10 185 Q 90 165 250 135" stroke="url(#branchGrad)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Branch texture line -->
  <path d="M 40 176 Q 120 160 220 142" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Leaves behind the bird -->
  <g fill="#10b981">
    <path d="M 60 145 C 50 125, 75 110, 85 130 C 95 150, 70 165, 60 145 Z" opacity="0.8"/>
    <path d="M 35 160 C 25 140, 50 125, 60 145 C 70 165, 45 180, 35 160 Z" opacity="0.6"/>
  </g>

  <!-- Foreground Leaves & Blossoms (Left & Right) -->
  <!-- Leaf cluster left -->
  <path d="M 20 175 C 10 155, 35 140, 45 160 C 55 180, 30 195, 20 175 Z" fill="#34d399"/>
  <path d="M 45 190 C 30 175, 50 150, 65 170 C 80 190, 60 205, 45 190 Z" fill="#059669"/>

  <!-- Flowers on branch -->
  <g transform="translate(75, 150)">
    <circle cx="0" cy="0" r="4" fill="#f472b6"/>
    <circle cx="-5" cy="-3" r="3.5" fill="#fbcfe8"/>
    <circle cx="5" cy="-3" r="3.5" fill="#fbcfe8"/>
    <circle cx="-3" cy="4" r="3.5" fill="#fbcfe8"/>
    <circle cx="3" cy="4" r="3.5" fill="#fbcfe8"/>
    <circle cx="0" cy="0" r="2" fill="#fbbf24"/>
  </g>

  <g transform="translate(145, 142)">
    <circle cx="0" cy="0" r="4.5" fill="#f472b6"/>
    <circle cx="-5" cy="-4" r="4" fill="#fbcfe8"/>
    <circle cx="6" cy="-2" r="4" fill="#fbcfe8"/>
    <circle cx="-4" cy="5" r="4" fill="#fbcfe8"/>
    <circle cx="4" cy="4" r="4" fill="#fbcfe8"/>
    <circle cx="0" cy="0" r="2.2" fill="#fbbf24"/>
  </g>

  <!-- THE BIRD (Con Chim) -->
  <g transform="translate(115, 115)">
    <!-- Bird Shadow on Branch -->
    <ellipse cx="-2" cy="45" rx="16" ry="6" fill="#000000" opacity="0.3"/>

    <!-- Tail Feathers -->
    <g transform="translate(-22, 22) rotate(-25)">
      <path d="M 0 0 C -15 5, -25 15, -30 25 C -20 22, -10 15, 0 5 Z" fill="#0284c7"/>
      <path d="M -5 5 C -18 10, -25 20, -28 28 C -18 24, -10 18, -3 8 Z" fill="#38bdf8"/>
    </g>

    <!-- Feet -->
    <path d="M -6 38 L -6 44 M -10 44 L -2 44" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 6 38 L 6 44 M 2 44 L 10 44" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Chubby Body (Main Ellipse) -->
    <ellipse cx="0" cy="20" rx="22" ry="25" fill="url(#birdGrad)"/>

    <!-- Bright Belly Patch -->
    <ellipse cx="4" cy="25" rx="14" ry="17" fill="url(#bellyGrad)"/>

    <!-- Cute Wing -->
    <path d="M -8 10 C -18 15, -16 32, -4 30 C 2 29, 2 18, -8 10 Z" fill="url(#wingGrad)"/>
    <!-- Wing feather detail -->
    <path d="M -10 18 C -14 22, -12 28, -6 26" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Head -->
    <circle cx="5" cy="-4" r="18" fill="url(#birdGrad)"/>

    <!-- Cheeks (Blush) -->
    <circle cx="15" cy="1" r="5" fill="#f43f5e" opacity="0.4" filter="url(#glow)"/>

    <!-- Big Expressive Eye -->
    <!-- Sclera -->
    <circle cx="11" cy="-7" r="6.5" fill="#ffffff"/>
    <!-- Iris -->
    <circle cx="12.5" cy="-7" r="4" fill="#0f172a"/>
    <!-- Highlights -->
    <circle cx="14" cy="-9" r="1.8" fill="#ffffff"/>
    <circle cx="11" cy="-5" r="0.8" fill="#ffffff"/>
    <!-- Eyelash / Brow -->
    <path d="M 6 -14 C 9 -16, 14 -15, 17 -13" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Beak -->
    <path d="M 18 -5 C 22 -5, 27 -3, 29 -1 C 26 1, 22 2, 18 1 Z" fill="#fbbf24"/>
    <path d="M 18 -5 C 22 -3, 26 -2, 29 -1 C 26 0, 22 1, 18 1 Z" fill="#f59e0b"/>

    <!-- Cute Crest / Head Feather -->
    <path d="M 8 -22 C 10 -28, 16 -30, 18 -26 C 16 -24, 12 -23, 8 -22 Z" fill="#38bdf8"/>
  </g>

  <!-- Foreground Overlapping Leaves (Framing the scene) -->
  <path d="M 240 180 C 210 160, 190 200, 200 240 L 240 240 Z" fill="#047857" opacity="0.8"/>
  <path d="M 215 200 C 190 185, 175 220, 185 240 L 215 240 Z" fill="#10b981" opacity="0.6"/>

  <path d="M 0 60 C 25 50, 40 80, 20 110 L 0 100 Z" fill="#047857" opacity="0.5"/>
</svg>