<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Lighting & Room Interior Context -->
  <path d="M0 0h240v240H0z" fill="url(#bgGradient)"/>
  <circle cx="180" cy="70" r="80" fill="#38bdf8" opacity="0.06"/>
  <circle cx="60" cy="190" r="90" fill="#fbbf24" opacity="0.05"/>
  
  <!-- Floor Shadow / Wood Grain Effect -->
  <ellipse cx="120" cy="210" rx="90" ry="16" fill="#090d16" opacity="0.6"/>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hangerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="mirrorFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mirrorGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Dressing Room / Boutique Background Elements -->
  <!-- Clothing Rack Pole & Stand -->
  <path d="M45 40v160" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 50h30" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="45" cy="200" rx="15" ry="5" fill="#334155"/>

  <!-- Extra Hanger in Background with a Jacket -->
  <path d="M30 85 l15 -8 l15 8" fill="none" stroke="url(#hangerGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="74" r="3" fill="#cbd5e1"/>
  <path d="M33 90 q12 4 24 0 l3 25 h-30 z" fill="#ec4899" opacity="0.85"/>

  <!-- Full-Length Standing Mirror (Representing "Trying on" context) -->
  <g transform="translate(145, 25)">
    <!-- Mirror Stand Base -->
    <path d="M15 175 h35 l10 10 h-55 z" fill="#b45309"/>
    <!-- Mirror Outer Frame -->
    <rect x="5" y="5" width="50" height="170" rx="25" fill="url(#mirrorFrame)" stroke="#b45309" stroke-width="2"/>
    <!-- Mirror Inner Glass -->
    <rect x="10" y="10" width="40" height="160" rx="20" fill="url(#mirrorGlass)"/>
    <!-- Mirror Reflection Highlights (Glossy curve) -->
    <path d="M16 20 q10 30 5 80" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
    <path d="M38 120 q-5 25 -2 40" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.1"/>
    <!-- Reflection of person inside mirror (abstracted silhouette trying clothes) -->
    <circle cx="30" cy="55" r="9" fill="#64748b" opacity="0.6"/>
    <path d="M18 90 q12 -5 24 0 l4 45 h-28 z" fill="#0284c7" opacity="0.5"/>
  </g>

  <!-- MAIN SUBJECT: The Outfit Being "Tried On" (Hanging vibrantly in center-left foreground) -->
  <!-- Wooden/Metal Hanger -->
  <path d="M75 75 l45 -22 l45 22" fill="none" stroke="url(#hangerGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hanger Hook -->
  <path d="M120 53 c0 -8 -6 -12 -12 -12 c-6 0 -10 4 -10 8" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="53" r="4" fill="#94a3b8"/>

  <!-- Stylish Shirt / Garment being tried on -->
  <g transform="translate(75, 75)">
    <!-- Collar & Neckline -->
    <path d="M36 0 c9 2 18 2 27 0 l10 6 c-6 6 -13 9 -23 9 c-10 0 -17 -3 -23 -9 z" fill="#0284c7"/>
    <path d="M42 6 c6 3 12 3 18 0 l-9 14 z" fill="#e0f2fe" opacity="0.4"/>
    
    <!-- Main Shirt Body -->
    <path d="M22 6 
             l-14 14 
             l14 8 
             l5 75 
             c2 5 8 8 13 8 
             h26 
             c5 0 11 -3 13 -8 
             l5 -75 
             l14 -8 
             l-14 -14 
             c-9 5 -18 7 -27 7 
             c-9 0 -18 -2 -27 -7z" 
          fill="url(#shirtGrad)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>

    <!-- Dynamic Creases & Surface Details for Realism -->
    <path d="M35 30 q10 15 5 45" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M61 30 q-10 15 -5 45" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Center Button Placket -->
    <line x1="48" y1="18" x2="48" y2="70" stroke="#0369a1" stroke-width="2" opacity="0.5"/>
    <circle cx="48" cy="28" r="2" fill="#e0f2fe"/>
    <circle cx="48" cy="42" r="2" fill="#e0f2fe"/>
    <circle cx="48" cy="56" r="2" fill="#e0f2fe"/>
    
    <!-- "NEW / TRY ME" Interactive Tag / Price Tag dangling from collar -->
    <g transform="translate(62, 12)">
      <line x1="0" y1="0" x2="12" y2="18" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="5" y="16" width="22" height="14" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
      <circle cx="16" cy="19" r="1.5" fill="#78350f"/>
      <!-- Decorative Star symbol on tag (instead of text) -->
      <path d="M16 23 l1 2 2 1 -2 1 -1 2 -1 -2 -2 -1 2 -1 z" fill="#78350f"/>
    </g>
  </g>

  <!-- Ambient / Foreground Accents (Shoe box and shopping bag to reinforce retail context of "trying") -->
  <g transform="translate(25, 160)">
    <!-- Shopping Bag -->
    <path d="M0 10 h32 v42 h-32 z" fill="#10b981" rx="4"/>
    <path d="M8 10 c0 -8 4 -12 8 -12 c4 0 8 4 8 12" fill="none" stroke="#047857" stroke-width="2.5"/>
    <path d="M6 18 c10 4 10 4 20 0" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(170, 165)">
    <!-- Open Shoe Box -->
    <rect x="0" y="10" width="35" height="25" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <path d="M-5 5 h45 v8 h-45 z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" rx="2"/>
    <!-- Shoe peeking out -->
    <path d="M8 15 q10 -8 20 -2 v12 h-20 z" fill="#38bdf8"/>
  </g>

  <!-- Sparkles / Action Highlights representing the trial/test experience -->
  <g fill="#fbbf24">
    <path d="M140 100 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
    <path d="M65 45 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z" opacity="0.8"/>
  </g>
  <g fill="#38bdf8">
    <path d="M155 140 l1 3 3 1 -3 1 -1 3 -1 -3 -3 -1 3 -1 z"/>
  </g>
</svg>