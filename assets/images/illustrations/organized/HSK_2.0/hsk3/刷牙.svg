<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mirror Glow & Gradient -->
    <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Countertop Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Toothbrush Handle Gradient -->
    <linearGradient id="brushHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Toothpaste Tube Gradient -->
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Cup Gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Bathroom Wall Tiles & Atmosphere -->
  <g opacity="0.1">
    <path d="M0 40 H240 M0 80 H240 M0 120 H240 M60 0 V140 M120 0 V140 M180 0 V140" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Warm ambient light from upper right -->
  <circle cx="200" cy="30" r="70" fill="#fbbf24" opacity="0.08" filter="url(#glow)" />

  <!-- Bathroom Mirror (Large Rounded Rectangle) -->
  <rect x="40" y="20" width="160" height="120" rx="60" fill="url(#mirrorGrad)" stroke="#64748b" stroke-width="3" filter="url(#shadow)" />
  <rect x="44" y="24" width="152" height="112" rx="56" fill="url(#glassSheen)" />
  <!-- Mirror Reflection Arc -->
  <path d="M60 50 C80 35, 120 35, 140 50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25" />

  <!-- Vanity Countertop -->
  <rect x="15" y="140" width="210" height="12" rx="4" fill="url(#counterGrad)" filter="url(#shadow)" />
  <rect x="10" y="152" width="220" height="75" fill="#0f172a" />
  <path d="M15 140 H225 V146 H15 Z" fill="#64748b" opacity="0.5" />

  <!-- Sink Basin Cutout Silhouette -->
  <ellipse cx="120" cy="143" rx="45" ry="8" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- BACKGOUND PROPS ON COUNTER -->
  <!-- Drinking Cup with Straw/Details -->
  <g transform="translate(35, 108)" filter="url(#shadow)">
    <path d="M5 10 L10 38 H25 L30 10 Z" fill="url(#cupGrad)" />
    <ellipse cx="17.5" cy="10" rx="12.5" ry="3" fill="#e2e8f0" />
    <!-- Toothbrushes inside cup -->
    <line x1="14" y1="10" x2="8" y2="-2" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="10" x2="24" y2="-4" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Toothpaste Tube (Action-oriented, tilted) -->
  <g transform="translate(170, 110) rotate(-25)" filter="url(#shadow)">
    <path d="M5 0 L15 0 L18 25 C18 32, 2 32, 2 25 Z" fill="url(#tubeGrad)" />
    <rect x="7" y="-5" width="6" height="5" rx="1" fill="#cbd5e1" />
    <path d="M4 12 C10 15, 12 15, 16 12" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6" />
  </g>

  <!-- SOAP DISH & BUBBLES -->
  <g transform="translate(145, 130)">
    <ellipse cx="12" cy="12" rx="14" ry="5" fill="#64748b" />
    <circle cx="8" cy="8" r="5" fill="#38bdf8" opacity="0.8" />
    <circle cx="16" cy="10" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="12" cy="5" r="2.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- MAIN CHARACTER / FOCAL ELEMENT: Action of Brushing Teeth -->
  <!-- Cute stylized mouth/face close-up or character lower half representing 'shuaya' -->
  <g transform="translate(65, 80)">
    <!-- Character Head / Chin Base (Friendly Rounded Shape) -->
    <path d="M20 20 C20 65, 90 65, 90 20 Z" fill="#fed7aa" filter="url(#shadow)" />
    
    <!-- Blush -->
    <circle cx="32" cy="28" r="6" fill="#f43f5e" opacity="0.25" />
    <circle cx="78" cy="28" r="6" fill="#f43f5e" opacity="0.25" />

    <!-- Open Happy Mouth -->
    <path d="M38 22 C38 42, 72 42, 72 22 Z" fill="#7f1d1d" />
    
    <!-- Teeth (Upper and Lower) showing active cleaning -->
    <path d="M42 22 H68 V28 H42 Z" fill="#ffffff" />
    <path d="M44 28 H66 V33 H44 Z" fill="#ffffff" />
    <!-- Gap line -->
    <line x1="42" y1="28" x2="68" y2="28" stroke="#f1f5f9" stroke-width="1" />

    <!-- Sparkle on teeth (Cleanliness) -->
    <path d="M53 23 L54 26 L57 27 L54 28 L53 31 L52 28 L49 27 L52 26 Z" fill="#38bdf8" filter="url(#glow)" />

    <!-- Toothpaste Foam / Bubbles around mouth (Action/Result) -->
    <circle cx="36" cy="24" r="7" fill="#ffffff" opacity="0.9" filter="url(#shadow)" />
    <circle cx="32" cy="30" r="5" fill="#ffffff" opacity="0.9" />
    <circle cx="73" cy="25" r="6" fill="#ffffff" opacity="0.9" filter="url(#shadow)" />
    <circle cx="76" cy="31" r="4" fill="#ffffff" opacity="0.9" />
    <circle cx="55" cy="40" r="5" fill="#ffffff" opacity="0.9" />

    <!-- TOOTHBRUSH (Dynamic Angle across the mouth) -->
    <g transform="translate(15, -5) rotate(-15)" filter="url(#shadow)">
      <!-- Handle -->
      <path d="M-30 45 L45 25 C48 24, 50 26, 48 29 L-28 51 C-31 52, -33 50, -30 45 Z" fill="url(#brushHandle)" />
      <!-- Grip texture lines -->
      <line x1="-15" y1="45" x2="-10" y2="47" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
      <line x1="-5" y1="42" x2="0" y2="44" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
      <line x1="5" y1="39" x2="10" y2="41" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
      
      <!-- Brush Head -->
      <rect x="45" y="21" width="18" height="9" rx="4.5" fill="#f8fafc" />
      
      <!-- Bristles inside mouth -->
      <rect x="47" y="20" width="3" height="4" rx="1.5" fill="#38bdf8" />
      <rect x="52" y="19" width="3" height="5" rx="1.5" fill="#38bdf8" />
      <rect x="57" y="20" width="3" height="4" rx="1.5" fill="#38bdf8" />

      <!-- Minty Toothpaste dollop on brush -->
      <path d="M46 19 C48 14, 58 14, 60 19 Z" fill="#10b981" filter="url(#glow)" />
    </g>
  </g>

  <!-- Dynamic Motion Lines & Sparkles (Action-packed HSK Illustration) -->
  <g transform="translate(130, 85)">
    <path d="M0 0 L10 -8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M5 12 L16 10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M-3 20 L6 25" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Sparkling clean stars -->
    <path d="M 25 -15 L 27 -20 L 32 -22 L 27 -24 L 25 -29 L 23 -24 L 18 -22 L 23 -20 Z" fill="#fbbf24" filter="url(#glow)" />
    <path d="M -45 45 L -44 41 L -40 40 L -44 39 L -45 35 L -46 39 L -50 40 L -46 41 Z" fill="#38bdf8" transform="scale(0.7)" />
  </g>

  <!-- Additional Water Drops / Freshness Accents -->
  <path d="M200 95 C200 95, 204 102, 204 105 C204 107.2, 202.2 109, 200 109 C197.8 109, 196 107.2, 196 105 C196 102, 200 95, 200 95 Z" fill="#38bdf8" opacity="0.8" filter="url(#shadow)" />
  <path d="M30 75 C30 75, 33 80, 33 82 C33 83.7, 31.7 85, 30 85 C28.3 85, 27 83.7, 27 82 C27 80, 30 75, 30 75 Z" fill="#38bdf8" opacity="0.7" />

  <!-- Ambient rim light framing bottom right -->
  <path d="M0 216 C60 240, 180 240, 240 216" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15" />
</svg>