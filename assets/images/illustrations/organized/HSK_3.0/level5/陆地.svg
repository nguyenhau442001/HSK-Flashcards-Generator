<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Ocean Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Land / Beach Gradient -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Cliff / Rock Gradient -->
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78716c" />
      <stop offset="100%" stop-color="#44403c" />
    </linearGradient>

    <!-- Boat Hull Gradient -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Atmospheric Elements (Clouds & Sun) -->
  <circle cx="190" cy="50" r="18" fill="#f59e0b" opacity="0.9" filter="url(#glow)" />
  <path d="M25 45 Q35 38 50 45 Q65 40 75 50 Q85 58 70 65 Q40 68 25 55 Z" fill="#334155" opacity="0.4" />
  <path d="M140 30 Q150 22 165 30 Q180 25 190 33 Q200 42 185 48 Q155 52 140 40 Z" fill="#334155" opacity="0.3" />

  <!-- Ocean Layer -->
  <path d="M0 120 C 60 110, 120 130, 240 120 L 240 240 L 0 240 Z" fill="url(#oceanGrad)" />

  <!-- Ocean Waves Details -->
  <path d="M20 135 Q35 130 50 135 T80 135" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M90 145 Q105 140 120 145 T150 145" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M10 160 Q30 155 50 160 T90 160" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <path d="M130 175 Q150 170 170 175 T210 175" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- THE LAND (Main Subject: 陆地) - Robust Island/Coastline -->
  <!-- Rocky Base / Cliff -->
  <path d="M 130 220 L 140 140 L 170 115 L 240 100 L 240 240 L 130 240 Z" fill="url(#cliffGrad)" />
  <!-- Cliff Highlights/Textures -->
  <path d="M140 140 L 155 180 L 130 200 Z" fill="#292524" opacity="0.4" />
  <path d="M170 115 L 185 150 L 155 180 Z" fill="#57534e" opacity="0.6" />

  <!-- Green Land Mass (Top of Island) -->
  <path d="M 130 145 Q 160 120, 240 100 L 240 140 L 130 160 Z" fill="url(#landGrad)" />
  <!-- Sandy Beach Edge -->
  <path d="M 115 135 C 130 125, 150 120, 170 115 L 175 125 C 150 132, 135 138, 120 145 Z" fill="#fde047" opacity="0.8" />

  <!-- Vegetation on Land (Trees and Bushes) -->
  <!-- Palm Tree 1 -->
  <path d="M210 115 Q215 85 205 65" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
  <!-- Palm Fronds -->
  <path d="M205 65 Q185 55 175 70 Q195 68 205 65 Z" fill="#15803d" />
  <path d="M205 65 Q225 50 235 60 Q220 62 205 65 Z" fill="#22c55e" />
  <path d="M205 65 Q200 45 215 45 Q210 55 205 65 Z" fill="#16a34a" />

  <!-- Palm Tree 2 (Smaller) -->
  <path d="M185 122 Q188 100 180 85" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
  <path d="M180 85 Q165 75 160 88 Q172 87 180 85 Z" fill="#15803d" />
  <path d="M180 85 Q195 78 200 88 Q188 88 180 85 Z" fill="#22c55e" />

  <!-- Small Bush -->
  <circle cx="150" cy="132" r="10" fill="#15803d" />
  <circle cx="142" cy="138" r="8" fill="#22c55e" />

  <!-- Wooden Pier / Dock extending to water -->
  <path d="M110 150 L 140 135 L 145 142 L 115 158 Z" fill="#b45309" />
  <rect x="135" y="137" width="4" height="15" fill="#78350f" />
  <rect x="120" y="147" width="4" height="15" fill="#78350f" />

  <!-- THE BOAT (Context Element approaching the Land) -->
  <g transform="translate(45, 135)">
    <!-- Boat Wake / Ripples -->
    <path d="M -15 25 Q -30 28 -45 35" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M -10 20 Q -25 24 -35 30" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

    <!-- Wooden Hull -->
    <path d="M -10 15 L 35 15 C 40 15, 42 22, 38 25 C 20 28, -5 28, -15 25 C -18 22, -15 15, -10 15 Z" fill="url(#hullGrad)" />
    <path d="M -8 17 L 33 17 C 36 17, 38 21, 35 23 C 18 25, -2 25, -12 23 C -14 21, -10 17, -8 17 Z" fill="#ea580c" />

    <!-- Mast & Sail -->
    <rect x="10" y="-15" width="3" height="30" fill="#78350f" />
    <!-- White/Teal Sail filled with wind -->
    <path d="M 12 -12 Q 28 -5 12 12 Z" fill="#f8fafc" />
    <path d="M 10 -10 Q -2 0 10 10 Z" fill="#e2e8f0" />

    <!-- Little Adventurer / Character in Boat -->
    <!-- Head & Hat -->
    <circle cx="2" cy="6" r="5" fill="#fde047" />
    <path d="M -3 3 Q 2 -1 7 3 Z" fill="#ef4444" />
    <!-- Body -->
    <rect x="-1" y="11" width="6" height="7" rx="2" fill="#38bdf8" />

    <!-- Oar -->
    <path d="M -8 12 L -20 18" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Seagulls flying in the sky -->
  <path d="M 60 70 Q 67 62 75 70 Q 83 62 90 70" fill="none" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M 100 50 Q 105 44 112 50 Q 118 44 125 50" fill="none" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Foreground Lighting Accent (Sun Ray Effect) -->
  <polygon points="120,0 240,0 240,160" fill="#fbbf24" opacity="0.05" />
</svg>