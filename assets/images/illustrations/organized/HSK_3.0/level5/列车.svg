<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Train Body Gradient -->
    <linearGradient id="train-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Train Stripe Gradient -->
    <linearGradient id="train-stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Window Glass Gradient -->
    <linearGradient id="window-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Scenery (Moon, Mountains, Stars) -->
  <g id="scenery">
    <!-- Moon & Glow -->
    <circle cx="190" cy="55" r="16" fill="#fef08a" opacity="0.9" filter="url(#soft-glow)"/>
    <circle cx="190" cy="55" r="14" fill="#fef08a"/>

    <!-- Stars -->
    <circle cx="40" cy="40" r="1" fill="#94a3b8" opacity="0.6"/>
    <circle cx="80" cy="30" r="1.5" fill="#f8fafc" opacity="0.8"/>
    <circle cx="130" cy="45" r="1" fill="#94a3b8" opacity="0.5"/>
    <circle cx="25" cy="70" r="1.2" fill="#cbd5e1" opacity="0.7"/>

    <!-- Distant Mountains -->
    <path d="M0 140 L50 100 L110 135 L170 95 L240 125 L240 180 L0 180 Z" fill="#1e293b" opacity="0.7"/>
    <path d="M0 150 L70 120 L140 160 L200 130 L240 145 L240 180 L0 180 Z" fill="#0f172a"/>
  </g>

  <!-- Dynamic Speed Lines (Atmosphere) -->
  <g opacity="0.4" stroke-linecap="round">
    <line x1="20" y1="165" x2="70" y2="165" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="90" y1="170" x2="160" y2="170" stroke="#f59e0b" stroke-width="1"/>
    <line x1="180" y1="163" x2="220" y2="163" stroke="#38bdf8" stroke-width="2"/>
    <line x1="10" y1="185" x2="50" y2="185" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="170" y1="190" x2="230" y2="190" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Bridge / Track Structure -->
  <g id="tracks-and-bridge">
    <!-- Bridge Piers -->
    <path d="M40 180 L50 215 L70 215 L80 180 Z" fill="#334155"/>
    <path d="M140 180 L150 215 L170 215 L180 180 Z" fill="#334155"/>
    
    <!-- Bridge Deck -->
    <rect x="0" y="176" width="240" height="6" fill="#475569" rx="2"/>
    <rect x="0" y="174" width="240" height="2" fill="#64748b"/>

    <!-- Railroad Ties -->
    <path d="
      M10 182 H18 M30 182 H38 M50 182 H58 M70 182 H78 M90 182 H98 
      M110 182 H118 M130 182 H138 M150 182 H158 M170 182 H178 
      M190 182 H198 M210 182 H218 M230 182 H238
    " stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Rails -->
    <line x1="0" y1="181" x2="240" y2="181" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="183.5" x2="240" y2="183.5" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- HIGH-SPEED TRAIN (列车 lièchē) -->
  <g id="train">
    <!-- Train Glow / Headlight Beam -->
    <polygon points="175,152 240,135 240,175" fill="#fef08a" opacity="0.15" filter="url(#glow)"/>

    <!-- Carriages Connection / Shadow -->
    <rect x="75" y="125" width="8" height="35" fill="#334155"/>

    <!-- Rear Carriage -->
    <g id="carriage-rear">
      <!-- Main Body -->
      <path d="M 15 135 L 75 135 C 78 135, 80 137, 80 140 L 80 160 C 80 163, 78 165, 75 165 L 15 165 C 12 165, 10 163, 10 160 L 10 140 C 10 137, 12 135, 15 135 Z" fill="url(#train-body)"/>
      
      <!-- Stripe -->
      <path d="M 10 148 H 80 V 153 H 10 Z" fill="url(#train-stripe)"/>

      <!-- Windows -->
      <rect x="20" y="139" width="12" height="7" rx="2" fill="url(#window-glass)"/>
      <rect x="38" y="139" width="12" height="7" rx="2" fill="url(#window-glass)"/>
      <rect x="56" y="139" width="12" height="7" rx="2" fill="url(#window-glass)"/>

      <!-- Wheels & Bogie -->
      <rect x="22" y="163" width="14" height="4" rx="2" fill="#475569"/>
      <circle cx="29" cy="169" r="4" fill="#334155"/>
      <circle cx="29" cy="169" r="1.5" fill="#cbd5e1"/>

      <rect x="54" y="163" width="14" height="4" rx="2" fill="#475569"/>
      <circle cx="61" cy="169" r="4" fill="#334155"/>
      <circle cx="61" cy="169" r="1.5" fill="#cbd5e1"/>
    </g>

    <!-- Front Carriage (Engine) -->
    <g id="carriage-front">
      <!-- Sleek Aerodynamic Body -->
      <path d="M 88 135 
               L 165 135 
               C 185 135, 200 142, 208 150 
               C 212 154, 212 156, 208 160 
               C 200 168, 185 165, 165 165 
               L 88 165 
               C 85 165, 83 163, 83 160 
               L 83 140 
               C 83 137, 85 135, 88 135 Z" 
            fill="url(#train-body)"/>

      <!-- Dynamic Stripe -->
      <path d="M 83 148 
               L 170 148 
               C 185 148, 195 150, 203 153 
               L 203 154 
               C 195 157, 185 159, 170 159 
               L 83 159 Z" 
            fill="url(#train-stripe)"/>

      <!-- Windshield / Driver Cabin Window -->
      <path d="M 175 139 
               L 190 140 
               C 198 141, 202 144, 205 147 
               L 175 147 
               Z" 
            fill="#0f172a" opacity="0.85"/>
      <!-- Window highlight -->
      <path d="M 177 140.5 L 189 141.5 C 195 142, 198 143, 201 145 L 177 145 Z" fill="url(#window-glass)" opacity="0.6"/>

      <!-- Passenger Windows -->
      <rect x="95" y="139" width="12" height="7" rx="2" fill="url(#window-glass)"/>
      <rect x="113" y="139" width="12" height="7" rx="2" fill="url(#window-glass)"/>
      <rect x="131" y="139" width="12" height="7" rx="2" fill="url(#window-glass)"/>
      <rect x="149" y="139" width="12" height="7" rx="2" fill="url(#window-glass)"/>

      <!-- Headlight (Glowing) -->
      <path d="M 204 151 C 206 151, 208 151.5, 209 152 C 208 152.5, 206 153, 204 153 Z" fill="#fef08a" filter="url(#glow)"/>
      <circle cx="206" cy="152" r="1.5" fill="#ffffff"/>

      <!-- Bogies & Wheels -->
      <rect x="100" y="163" width="14" height="4" rx="2" fill="#475569"/>
      <circle cx="107" cy="169" r="4" fill="#334155"/>
      <circle cx="107" cy="169" r="1.5" fill="#cbd5e1"/>

      <rect x="165" y="163" width="14" height="4" rx="2" fill="#475569"/>
      <circle cx="172" cy="169" r="4" fill="#334155"/>
      <circle cx="172" cy="169" r="1.5" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- Foreground Vegetation & Details (Parallax framing) -->
  <g id="foreground-elements">
    <!-- Bush / Foliage left -->
    <path d="M -10 190 Q 5 170, 25 185 Q 40 165, 60 180 Q 75 175, 80 195 Z" fill="#065f46" opacity="0.8"/>
    <path d="M 10 185 Q 25 172, 40 188 Q 50 178, 65 190 Z" fill="#059669" opacity="0.9"/>

    <!-- Small tree right -->
    <path d="M 215 195 L 218 175 L 222 175 L 225 195 Z" fill="#334155"/>
    <circle cx="220" cy="170" r="14" fill="#065f46"/>
    <circle cx="214" cy="165" r="10" fill="#047857"/>
    <circle cx="226" cy="166" r="9" fill="#059669"/>
  </g>

  <!-- Ambient Light Orbs / Particles -->
  <g opacity="0.6">
    <circle cx="110" cy="90" r="1.5" fill="#38bdf8"/>
    <circle cx="145" cy="75" r="1" fill="#f59e0b"/>
    <circle cx="70" cy="115" r="1.2" fill="#38bdf8"/>
    <circle cx="175" cy="110" r="2" fill="#fb923c" opacity="0.8"/>
  </g>
</svg>