<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Main Subject: Open Book with Glowing Central Theme -->
  <path d="M60 180 L180 180 L170 120 L70 120 Z" fill="#f1f5f9"/>
  <path d="M120 120 L120 180" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Narrative props: Magnifying glass focusing on the center -->
  <circle cx="120" cy="100" r="25" fill="none" stroke="#fbbf24" stroke-width="4"/>
  <line x1="138" y1="118" x2="160" y2="140" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Atmospheric details: Floating thematic icons (abstracted as physical objects) -->
  <circle cx="190" cy="80" r="12" fill="#38bdf8"/>
  <rect x="30" y="70" width="20" height="20" rx="4" fill="#10b981"/>
  <path d="M40 130 L50 110 L60 130 Z" fill="#ec4899"/>
  
  <!-- Decorative glow -->
  <circle cx="120" cy="100" r="10" fill="#fb923c" opacity="0.3"/>
  
  <!-- Book pages lines -->
  <line x1="75" y1="130" x2="110" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="75" y1="140" x2="110" y2="140" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="130" y1="130" x2="165" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="130" y1="140" x2="165" y2="140" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Pen -->
  <rect x="180" y="170" width="40" height="8" rx="2" fill="#fb923c" transform="rotate(-20 200 174)"/>
</svg>