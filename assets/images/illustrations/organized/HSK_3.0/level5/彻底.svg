<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Effect for the Core Beam -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft Shadow for Characters and Objects -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Workshop Elements (Ambient Depth) -->
  <!-- Gear/Cog background decoration -->
  <g opacity="0.15" fill="#38bdf8">
    <path d="M190 50l4 8-10 4-4-8-7 7 4 10-8 4-8-4 4-10-7-7-8 4-4-8 10-4 4 8 7-7-4-10 8-4 8 4-4 10z"/>
    <circle cx="177" cy="58" r="8"/>
  </g>
  <g opacity="0.1" fill="#f59e0b">
    <path d="M50 170l3 6-8 3-3-6-6 6 3 8-6 3-6-3 3-8-6-6 6-3 3-6 8-3 3 6 6-6-3-8 6-3 6 3-3 8z"/>
    <circle cx="44" cy="178" r="6"/>
  </g>

  <!-- Worktable Surface -->
  <path d="M20 185 L220 185 L200 215 L40 215 Z" fill="#090d16"/>
  <path d="M20 185 L220 185 L225 192 L15 192 Z" fill="#334155"/>
  <rect x="30" y="192" width="180" height="4" fill="#1e293b"/>

  <!-- Shadow under main device -->
  <ellipse cx="120" cy="188" rx="55" ry="10" fill="url(#shadow)"/>

  <!-- Main Subject: Complex Tangible Mechanism / Core Problem Resolver -->
  <!-- Robotic/Engineering Arm & Laser Welder Cutting Deeply -->
  
  <!-- Base Stand -->
  <path d="M90 185 L150 185 L140 160 L100 160 Z" fill="#475569"/>
  <rect x="105" y="150" width="30" height="15" rx="3" fill="#64748b"/>

  <!-- Articulated Mechanical Arm -->
  <path d="M112 150 C112 135 128 135 128 120 L135 90 C135 85 125 80 115 85 L95 105 C90 110 93 120 100 120 Z" fill="#cbd5e1"/>
  <circle cx="120" cy="135" r="7" fill="#38bdf8"/>
  <circle cx="120" cy="135" r="3" fill="#0f172a"/>

  <!-- Laser Head Unit -->
  <g transform="translate(80, 75) rotate(-15)">
    <!-- Main Body -->
    <rect x="0" y="0" width="30" height="45" rx="6" fill="#f59e0b"/>
    <rect x="5" y="8" width="20" height="12" rx="2" fill="#0f172a"/>
    <!-- Glowing indicator on device -->
    <circle cx="15" cy="14" r="3" fill="#ef4444" filter="url(#glow)"/>
    <!-- Nozzle -->
    <path d="M8 45 L22 45 L18 58 L12 58 Z" fill="#94a3b8"/>
  </g>

  <!-- The "Problem" Object Being Completely Solved (Glowing, Shattering/Cutting) -->
  <!-- Solid Metallic Block with glowing fault line -->
  <g>
    <!-- Left half of block -->
    <path d="M70 145 L110 135 L110 175 L70 175 Z" fill="#334155"/>
    <path d="M70 145 L110 135 L110 138 L70 148 Z" fill="#475569"/>
    
    <!-- Right half of block (pushed aside slightly to show "thorough/complete" action) -->
    <path d="M125 131 L165 141 L165 175 L125 175 Z" fill="#334155"/>
    <path d="M125 131 L165 141 L165 144 L125 134 Z" fill="#475569"/>
  </g>

  <!-- Intense Energy / Cutting Beam (Representing "彻底" - Thoroughness / Complete resolution) -->
  <g filter="url(#glow)">
    <!-- Core Laser Beam -->
    <polygon points="108,98 114,98 122,175 114,175" fill="#38bdf8" opacity="0.8"/>
    <polygon points="110,98 112,98 118,175 114,175" fill="#ffffff"/>
    
    <!-- Sparks & Complete Breakthrough Energy Burst at the base -->
    <circle cx="116" cy="172" r="8" fill="#38bdf8"/>
    <circle cx="116" cy="172" r="4" fill="#ffffff"/>
  </g>

  <!-- Flying Sparks / Action Particles -->
  <g fill="#fbbf24">
    <circle cx="95" cy="160" r="2.5"/>
    <circle cx="138" cy="155" r="2"/>
    <circle cx="102" cy="180" r="1.5"/>
    <circle cx="130" cy="168" r="3"/>
    <path d="M85 140 L91 146" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M145 135 L152 140" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M110 120 L113 112" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground Context Props (Tools on workbench enhancing realism) -->
  <!-- Wrench -->
  <g transform="translate(170, 195) rotate(25)">
    <rect x="0" y="0" width="24" height="6" rx="2" fill="#64748b"/>
    <circle cx="2" cy="3" r="4" fill="#64748b"/>
    <circle cx="22" cy="3" r="3.5" fill="#64748b"/>
  </g>

  <!-- Safety Goggles resting on table -->
  <g transform="translate(45, 182)">
    <path d="M0 8 C0 3 5 0 12 0 C19 0 24 3 24 8 L22 14 C22 16 19 18 12 18 C5 18 2 16 2 14 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M24 8 C24 3 29 0 36 0 C43 0 48 3 48 8 L46 14 C46 16 43 18 36 18 C29 18 26 16 26 14 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M12 4 C15 4 33 4 36 4" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Ambient Energy Rings / Action lines to emphasize precision & total control -->
  <path d="M82 85 C70 95 65 110 70 125" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M152 90 C162 100 165 115 160 130" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

</svg>