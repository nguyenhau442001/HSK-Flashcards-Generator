<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Ancient Mountains -->
  <path d="M0 240 L60 140 L120 180 L180 120 L240 240 Z" fill="#334155"/>
  <path d="M40 240 L100 160 L160 200 L220 150 L240 240 Z" fill="#1e293b" opacity="0.6"/>
  
  <!-- The Legend: Glowing Ancient Scroll -->
  <g transform="translate(60, 80)">
    <!-- Scroll Body -->
    <rect x="20" y="20" width="80" height="100" rx="4" fill="#fbbf24"/>
    <rect x="15" y="15" width="90" height="110" rx="6" fill="none" stroke="#f59e0b" stroke-width="4"/>
    
    <!-- Scroll Ends -->
    <circle cx="20" cy="70" r="12" fill="#d97706"/>
    <circle cx="100" cy="70" r="12" fill="#d97706"/>
    
    <!-- Magical Aura/Particles -->
    <circle cx="10" cy="40" r="3" fill="#38bdf8"/>
    <circle cx="110" cy="100" r="4" fill="#10b981"/>
    <circle cx="60" cy="10" r="2" fill="#ec4899"/>
    <path d="M50 140 Q60 160 80 150" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Foreground: Ancient Stone Pedestal -->
  <path d="M40 180 L200 180 L190 220 L50 220 Z" fill="#475569"/>
  <path d="M50 220 L190 220 L180 235 L60 235 Z" fill="#334155"/>
  
  <!-- Atmospheric Glow -->
  <ellipse cx="120" cy="130" rx="70" ry="40" fill="#f59e0b" opacity="0.15" filter="blur(10px)"/>
</svg>