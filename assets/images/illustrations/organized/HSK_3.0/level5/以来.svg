<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="8" fill="#334155"/>
  
  <!-- Character: Diligent Worker -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M20 120 L100 120 L90 60 L30 60 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="40" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M40 35 C40 15, 80 15, 80 35 L80 45 L40 45 Z" fill="#475569"/>
    <!-- Glasses -->
    <circle cx="50" cy="40" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="70" cy="40" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="56" y1="40" x2="64" y2="40" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Timeline/Growth representation: Stack of books/documents -->
  <g transform="translate(150, 140)">
    <rect x="0" y="0" width="40" height="10" rx="2" fill="#fbbf24"/>
    <rect x="2" y="-12" width="36" height="10" rx="2" fill="#fb923c"/>
    <rect x="4" y="-24" width="32" height="10" rx="2" fill="#ec4899"/>
    <rect x="6" y="-36" width="28" height="10" rx="2" fill="#10b981"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(30, 180)">
    <rect x="0" y="0" width="25" height="30" rx="4" fill="#f1f5f9"/>
    <path d="M25 5 L30 5 L30 20 L25 20" fill="none" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ambient Light/Atmosphere -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.1"/>
  <circle cx="180" cy="60" r="20" fill="#f59e0b" opacity="0.2"/>
</svg>