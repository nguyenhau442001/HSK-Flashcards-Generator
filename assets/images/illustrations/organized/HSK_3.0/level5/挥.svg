<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Train Platform -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <rect x="0" y="155" width="240" height="5" fill="#475569"/>
  <circle cx="40" cy="190" r="15" fill="#64748b" opacity="0.3"/>
  <circle cx="120" cy="200" r="20" fill="#64748b" opacity="0.3"/>
  <circle cx="200" cy="185" r="12" fill="#64748b" opacity="0.3"/>

  <!-- Character -->
  <g transform="translate(60, 60)">
    <!-- Body -->
    <path d="M40 140 C40 120, 80 120, 80 140 L80 170 L40 170 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="100" r="25" fill="#fbbf24"/>
    <!-- Arm (Waving) -->
    <path d="M80 130 L110 90 L125 105" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Motion lines -->
    <path d="M120 80 Q130 70 140 80" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M125 75 Q135 65 145 75" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <!-- Other Arm -->
    <path d="M40 130 L20 150" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="45" y="170" width="8" height="20" fill="#1e293b"/>
    <rect x="67" y="170" width="8" height="20" fill="#1e293b"/>
  </g>

  <!-- Atmospheric Details -->
  <circle cx="180" cy="50" r="4" fill="#fb923c"/>
  <circle cx="200" cy="40" r="6" fill="#10b981"/>
  <path d="M10 50 L20 40 L30 50" fill="none" stroke="#ec4899" stroke-width="2"/>
</svg>