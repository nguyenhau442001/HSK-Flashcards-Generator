<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table/Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Aura for the Rose -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <!-- Rose Petal Gradients -->
    <linearGradient id="petalOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="petalInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Stem & Leaves Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Gift Box Gradients -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Bokeh / Star particles) -->
  <circle cx="45" cy="50" r="2" fill="#38bdf8" opacity="0.4" />
  <circle cx="195" cy="40" r="1.5" fill="#fbbf24" opacity="0.5" />
  <circle cx="210" cy="120" r="2.5" fill="#f43f5e" opacity="0.3" />
  <circle cx="35" cy="150" r="1.5" fill="#38bdf8" opacity="0.3" />
  <circle cx="120" cy="30" r="3" fill="#cbd5e1" opacity="0.2" />

  <!-- Window Frame / Interior wall accent -->
  <path d="M 0 160 L 240 160" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Surface Tabletop -->
  <path d="M 0 170 C 60 160, 180 160, 240 170 L 240 240 L 0 240 Z" fill="url(#tableGrad)" />
  <ellipse cx="120" cy="170" rx="120" ry="8" fill="#1e293b" opacity="0.8" />

  <!-- Background Props: Warm Cozy Mug -->
  <g transform="translate(170, 125)">
    <!-- Mug Body -->
    <path d="M 10 5 L 30 5 C 33 5, 35 7, 35 10 L 30 35 C 30 38, 28 40, 25 40 L 15 40 C 12 40, 10 38, 10 35 L 5 10 C 5 7, 7 5, 10 5 Z" fill="#64748b" />
    <!-- Mug Handle -->
    <path d="M 32 15 C 42 15, 42 30, 32 30" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 15 -2 C 12 -7, 20 -10, 17 -15" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <path d="M 25 0 C 22 -5, 30 -8, 27 -13" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Background Props: Cute Gift Box -->
  <g transform="translate(35, 140)">
    <!-- Box Shadow -->
    <ellipse cx="25" cy="32" rx="22" ry="6" fill="#0f172a" opacity="0.6" />
    <!-- Box Body -->
    <rect x="5" y="10" width="40" height="25" rx="4" fill="url(#boxGrad)" />
    <!-- Vertical Ribbon -->
    <rect x="22" y="10" width="6" height="25" fill="url(#ribbonGrad)" />
    <!-- Box Lid -->
    <rect x="2" y="5" width="46" height="8" rx="2" fill="#0284c7" />
    <rect x="22" y="5" width="6" height="8" fill="url(#ribbonGrad)" />
    <!-- Bow -->
    <path d="M 18 2 C 12 -2, 12 6, 22 6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M 28 2 C 34 -2, 34 6, 23 6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <circle cx="25" cy="5" r="2" fill="#f59e0b" />
  </g>

  <!-- MAIN SUBJECT: "Bông hoa hồng" (A single rose flower with stem in context) -->
  <!-- Soft Glow Behind Flower -->
  <circle cx="120" cy="95" r="50" fill="url(#glow)" />

  <g transform="translate(120, 105)">
    <!-- Stem & Leaves -->
    <!-- Curved Stem -->
    <path d="M -2 15 C -15 35, -5 65, 2 85" fill="none" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Left Leaf -->
    <path d="M -9 45 C -25 40, -30 25, -20 25 C -15 25, -10 35, -9 45 Z" fill="url(#stemGrad)" />
    <path d="M -9 45 C -16 38, -18 32, -20 25" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right Leaf -->
    <path d="M -5 60 C 10 55, 15 40, 8 40 C 3 40, -1 48, -5 60 Z" fill="url(#stemGrad)" />
    <path d="M -5 60 C 3 53, 5 48, 8 40" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />

    <!-- Rose Flower Head -->
    <g transform="translate(0, -10)">
      <!-- Sepals (Green base under bloom) -->
      <path d="M -15 15 L -2 22 L 12 16 L 3 24 L -8 24 Z" fill="#059669" />

      <!-- Outer Petals -->
      <path d="M -22 8 C -35 -5, -25 -25, -5 -20 C 5 -22, 18 -18, 22 -5 C 28 5, 20 22, 0 24 C -12 24, -18 18, -22 8 Z" fill="url(#petalOuter)" />
      
      <!-- Mid Petals -->
      <path d="M -16 2 C -22 -10, -12 -22, 2 -18 C 14 -16, 18 -5, 12 12 C 5 20, -10 16, -16 2 Z" fill="url(#petalInner)" />

      <!-- Inner Swirl & Core Bud -->
      <path d="M -8 -4 C -14 -12, -2 -18, 4 -10 C 9 -4, 2 8, -4 6 C -8 4, -10 -1, -6 -6" fill="url(#petalOuter)" />
      <path d="M -2 -8 C 2 -12, 6 -6, 2 2 C -2 4, -4 -2, -2 -8 Z" fill="#ffe4e6" />
    </g>

    <!-- Sparkles/Magic around the flower (Action/Vividness highlights) -->
    <path d="M -35 -20 L -31 -20 L -30 -24 L -29 -20 L -25 -20 L -28 -18 L -27 -14 L -30 -16 L -33 -14 L -32 -18 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M 30 10 L 33 10 L 34 7 L 35 10 L 38 10 L 36 12 L 37 15 L 35 13 L 33 15 L 34 12 Z" fill="#fbbf24" opacity="0.9" />
    <circle cx="-25" cy="-5" r="1.5" fill="#f43f5e" />
    <circle cx="32" cy="-15" r="2" fill="#38bdf8" />
  </g>

  <!-- Foreground bokeh particles for depth -->
  <circle cx="70" cy="205" r="2" fill="#f43f5e" opacity="0.6" />
  <circle cx="160" cy="195" r="1.5" fill="#38bdf8" opacity="0.5" />
  
  <!-- Interactive UI/Focus Ring (Subtle HSK App framing accent) -->
  <rect x="12" y="12" width="216" height="216" rx="18" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4" />
</svg>