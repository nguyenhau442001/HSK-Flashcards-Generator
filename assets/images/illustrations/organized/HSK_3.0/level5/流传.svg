<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Golden Scroll Glow -->
    <radialGradient id="scroll-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Magic Energy Gradient -->
    <linearGradient id="magic-beam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- Ancient Wood Texture Base -->
    <linearGradient id="wood-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Ambient Elements (Ancient Temple Window/Arch) -->
  <circle cx="120" cy="110" r="85" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
  <circle cx="120" cy="110" r="105" fill="none" stroke="#334155" stroke-width="1" opacity="0.2"/>
  
  <!-- Atmospheric Glow behind the artifact -->
  <circle cx="120" cy="110" r="60" fill="url(#scroll-glow)"/>

  <!-- Floating Magical Sparks (Representing transmission through time/generations) -->
  <g filter="url(#glow)">
    <path d="M60,140 Q80,110 120,90 T180,60" fill="none" stroke="url(#magic-beam)" stroke-width="3" stroke-linecap="round"/>
    <path d="M70,160 Q100,130 140,110 T200,80" fill="none" stroke="url(#magic-beam)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Sparkles / Stars -->
    <path d="M150,50 L153,58 L161,61 L153,64 L150,72 L147,64 L139,61 L147,58 Z" fill="#fbbf24" transform="scale(0.6) translate(100, 20)"/>
    <path d="M80,90 L82,95 L87,97 L82,99 L80,104 L78,99 L73,97 L78,95 Z" fill="#38bdf8" transform="scale(0.8) translate(30, -10)"/>
    <path d="M170,130 L171,134 L175,135 L171,136 L170,140 L169,136 L165,135 L169,134 Z" fill="#ec4899" transform="scale(0.9) translate(30, 20)"/>
  </g>

  <!-- Old Wooden Pedestal / Table -->
  <path d="M50,175 L190,175 L210,205 L30,205 Z" fill="url(#wood-base)"/>
  <path d="M40,175 L200,175 L200,181 L40,181 Z" fill="#92400e"/>
  <!-- Wood grain details -->
  <path d="M70,185 Q110,183 150,188" fill="none" stroke="#572505" stroke-width="1.5" opacity="0.6"/>
  <path d="M60,195 Q120,193 180,198" fill="none" stroke="#572505" stroke-width="1.5" opacity="0.6"/>

  <!-- Ancient Glowing Scroll (Main Subject - 'Lưu truyền' / Passed down storytelling) -->
  <g transform="translate(0, 5)">
    <!-- Scroll Shadow -->
    <ellipse cx="120" cy="165" rx="55" ry="12" fill="#020617" opacity="0.6"/>

    <!-- Left Scroll Roller -->
    <rect x="65" y="100" width="12" height="60" rx="6" fill="#b45309"/>
    <rect x="67" y="102" width="8" height="56" rx="4" fill="#d97706"/>
    <circle cx="71" cy="98" r="7" fill="#fbbf24"/>
    <circle cx="71" cy="162" r="7" fill="#fbbf24"/>

    <!-- Right Scroll Roller -->
    <rect x="163" y="100" width="12" height="60" rx="6" fill="#b45309"/>
    <rect x="165" y="102" width="8" height="56" rx="4" fill="#d97706"/>
    <circle cx="169" cy="98" r="7" fill="#fbbf24"/>
    <circle cx="169" cy="162" r="7" fill="#fbbf24"/>

    <!-- Scroll Body (Unfurled Parchment) -->
    <path d="M73,103 C90,95 150,95 167,103 L167,159 C150,167 90,167 73,159 Z" fill="#fef3c7"/>
    <path d="M75,106 C90,99 150,99 165,106 L165,156 C150,163 90,163 75,156 Z" fill="#fffbeb"/>

    <!-- Abstract Narrative Artwork on the Scroll (Representing ancient legends being passed down) -->
    <!-- Mountain/River motif -->
    <path d="M90,145 L105,120 L115,132 L135,110 L150,145 Z" fill="#0f172a" opacity="0.15"/>
    <circle cx="138" cy="122" r="5" fill="#f59e0b" opacity="0.6"/>
    <!-- Flowing history line -->
    <path d="M85,135 Q105,150 120,135 T155,135" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 3" opacity="0.5"/>

    <!-- Magical Holographic Story Emerging from Scroll (Visualizing transmission across time) -->
    <g transform="translate(0, -15)">
      <!-- Central floating mythical creature silhouette / dragon pearl abstract -->
      <circle cx="120" cy="85" r="18" fill="url(#scroll-glow)" filter="url(#glow)"/>
      <circle cx="120" cy="85" r="10" fill="#fbbf24" opacity="0.9"/>
      <path d="M100,95 Q120,60 140,95" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M105,98 Q120,70 135,98" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Red Traditional Seal (Stamp of authenticity/heritage) -->
    <rect x="142" y="132" width="14" height="14" rx="2" fill="#dc2626" opacity="0.85"/>
    <rect x="144" y="134" width="10" height="10" fill="none" stroke="#fef2f2" stroke-width="1" opacity="0.7"/>

    <!-- Glowing Energy Ribbons Wrapping around the Scroll -->
    <path d="M60,130 C75,145 95,120 120,130 C145,140 160,115 180,125" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>
    <path d="M65,115 C90,100 110,135 130,115 C150,95 170,120 185,110" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="50" cy="70" r="2.5" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="195" cy="90" r="3" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
  <circle cx="45" cy="130" r="1.5" fill="#f43f5e" opacity="0.7"/>
  <circle cx="210" cy="140" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="105" cy="35" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="145" cy="40" r="3" fill="#34d399" opacity="0.7" filter="url(#glow)"/>
</svg>