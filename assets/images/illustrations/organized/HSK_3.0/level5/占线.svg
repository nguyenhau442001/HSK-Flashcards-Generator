<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#0f172a" opacity="0.5"/>
  
  <!-- Phone Base -->
  <path d="M70 140h100v40a10 10 0 0 1-10 10H80a10 10 0 0 1-10-10z" fill="#334155"/>
  <rect x="85" y="150" width="70" height="30" rx="4" fill="#475569"/>
  
  <!-- The Handset -->
  <path d="M60 110h120c10 0 15 5 15 15v10c0 10-5 15-15 15H60c-10 0-15-5-15-15v-10c0-10 5-15 15-15z" fill="#fb923c"/>
  
  <!-- Busy Signal Visual Representation (Abstracted as energetic pulses) -->
  <circle cx="120" cy="90" r="25" fill="none" stroke="#ec4899" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="120" cy="90" r="40" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 12"/>
  
  <!-- Phone Cord -->
  <path d="M170 125c20 0 30-20 30-40" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Desk Lamp Glow -->
  <circle cx="210" cy="30" r="40" fill="#f59e0b" opacity="0.15"/>
  <path d="M200 40l20 30h-40z" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Decorative elements (Sticky note/Pen) -->
  <rect x="30" y="180" width="30" height="40" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="180" y="190" width="40" height="8" rx="2" fill="#10b981"/>
</svg>