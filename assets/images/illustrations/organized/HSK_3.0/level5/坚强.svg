<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Golden Glow for Resilience -->
    <radialGradient id="goldenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Rock Texture/Gradient -->
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="rockHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
    </linearGradient>

    <!-- Bamboo/Sprout Gradients -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Elements / Ambient Glow -->
  <circle cx="120" cy="130" r="90" fill="url(#goldenGlow)"/>

  <!-- Background Environment: Distant Mountains/Canyon -->
  <path d="M0 180 L50 130 L90 160 L150 100 L200 150 L240 120 L240 240 L0 240 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M0 190 L40 160 L80 180 L140 130 L190 170 L240 140 L240 240 L0 240 Z" fill="#0f172a" opacity="0.8"/>

  <!-- Falling Rain / Dynamic Action Elements (Subtle) -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <line x1="40" y1="30" x2="30" y2="60"/>
    <line x1="80" y1="20" x2="70" y2="50"/>
    <line x1="160" y1="40" x2="150" y2="70"/>
    <line x1="200" y1="25" x2="190" y2="55"/>
    <line x1="60" y1="80" x2="50" y2="110"/>
    <line x1="180" y1="90" x2="170" y2="120"/>
  </g>

  <!-- Main Scene Subject: Rugged Cliff Edge (Kiên cường base) -->
  <g filter="url(#shadow)">
    <!-- Cliff Structure -->
    <path d="M-10 240 L-10 170 C20 170 50 185 80 175 C110 165 130 140 170 145 C200 150 220 180 250 170 L250 240 Z" fill="url(#rockGrad)"/>
    <!-- Cliff Top Surface Highlight -->
    <path d="M-10 170 C20 170 50 185 80 175 C110 165 130 140 170 145 C200 150 220 180 250 170 L250 175 C220 185 200 155 170 150 C130 145 110 170 80 180 C50 190 20 175 -10 175 Z" fill="url(#rockHighlight)"/>
  </g>

  <!-- The Heroic Sprout / Resilient Bamboo breaking through the rock -->
  <g filter="url(#shadow)">
    <!-- Rock fissure crack -->
    <path d="M115 155 L120 172 L112 178 L122 185" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Strong Young Bamboo / Sprout -->
    <path d="M118 178 C115 165 112 145 115 120" stroke="url(#stemGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Bamboo nodes -->
    <line x1="114" y1="155" x2="120" y2="157" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="113" y1="138" x2="118" y2="140" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Vibrant Green Leaves -->
    <path d="M115 125 C100 120 90 105 95 95 C105 95 112 110 115 125 Z" fill="url(#leafGrad)"/>
    <path d="M117 130 C130 120 142 125 145 135 C135 140 125 135 117 130 Z" fill="url(#leafGrad)"/>
    <path d="M114 150 C100 148 90 158 88 165 C95 170 105 162 114 150 Z" fill="url(#leafGrad)"/>
  </g>

  <!-- Central Character: Determined Young Adventurer/Climber (Embodying 'Kiên cường') -->
  <g id="character" filter="url(#shadow)">
    <!-- Legs / Kneeling Stance on Rock -->
    <path d="M100 172 L85 190 L100 195 L112 178 Z" fill="url(#pantsGrad)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M115 175 L125 195 L140 192 L128 172 Z" fill="url(#pantsGrad)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Hiking Boots -->
    <path d="M75 191 L88 191 L92 198 L78 198 Z" fill="#b45309"/>
    <path d="M135 191 L145 193 L142 200 L130 198 Z" fill="#b45309"/>

    <!-- Torso / Jacket -->
    <path d="M95 145 L135 145 L142 178 L90 178 Z" fill="url(#jacketGrad)" stroke="#0284c7" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Backpack Straps & Details -->
    <path d="M102 145 L92 178" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M128 145 L138 178" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- Climbing Harness Buckle / Detail -->
    <rect x="110" y="165" width="16" height="6" rx="3" fill="#fbbf24"/>

    <!-- Head & Face -->
    <!-- Neck -->
    <path d="M110 136 L120 136 L120 146 L110 146 Z" fill="#fcd34d"/>
    <!-- Head Circle/Shape -->
    <circle cx="115" cy="122" r="16" fill="#fef08a" stroke="#fde047" stroke-width="1"/>

    <!-- Hair (Dynamic, wind-blown) -->
    <path d="M99 122 C98 110 106 104 118 104 C130 104 133 114 132 124 C128 114 122 110 115 110 C108 110 102 114 99 122 Z" fill="#1e293b"/>
    <path d="M125 106 C132 108 138 114 140 122 C135 116 130 112 125 106 Z" fill="#1e293b"/>

    <!-- Determined Facial Expression -->
    <!-- Determined Eyebrows (Slanted inwards) -->
    <path d="M105 116 L113 118" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M119 118 L127 116" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Confident Eyes -->
    <circle cx="109" cy="122" r="2" fill="#1e293b"/>
    <circle cx="123" cy="122" r="2" fill="#1e293b"/>
    <!-- Confident Smile / Grit -->
    <path d="M111 129 C113 131 119 131 121 129" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks of Effort -->
    <circle cx="106" cy="125" r="3" fill="#fb7185" opacity="0.6"/>
    <circle cx="126" cy="125" r="3" fill="#fb7185" opacity="0.6"/>

    <!-- Arms in Action (Reaching out/protecting the sprout) -->
    <!-- Left Arm (Bracing) -->
    <path d="M95 150 L75 160 L80 168 L98 158 Z" fill="url(#jacketGrad)" stroke="#0284c7" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="76" cy="164" r="3.5" fill="#fcd34d"/>

    <!-- Right Arm (Reaching protectively towards the sprout) -->
    <path d="M135 148 L155 155 L150 163 L132 155 Z" fill="url(#jacketGrad)" stroke="#0284c7" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="156" cy="156" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- Foreground Atmospheric Lighting / Dust Particles -->
  <g fill="#fbbf24">
    <circle cx="70" cy="100" r="1.5" opacity="0.8"/>
    <circle cx="160" cy="80" r="2" opacity="0.6"/>
    <circle cx="190" cy="130" r="1" opacity="0.9"/>
    <circle cx="50" cy="150" r="2" opacity="0.5"/>
    <circle cx="100" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="140" cy="60" r="2.5" opacity="0.4"/>
  </g>

  <!-- Dramatic Lighting Highlights on Cliff & Sprout -->
  <path d="M80 175 C110 165 130 140 170 145 C150 143 130 160 100 170 Z" fill="#fbbf24" opacity="0.15"/>
  <path d="M115 120 C113 145 116 165 118 178" stroke="#fde047" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

</svg>