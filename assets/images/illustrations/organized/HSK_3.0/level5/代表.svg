<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Podium Glow Gradient -->
    <linearGradient id="podiumGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Golden Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting / Spotlight -->
  <path d="M0 0 L240 0 L180 240 L60 240 Z" fill="url(#spotlight)" />

  <!-- ENVIRONMENT: Conference Stage & Backdrop -->
  <!-- Subtle wall panels representing a conference hall -->
  <line x1="60" y1="40" x2="60" y2="160" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="180" y1="40" x2="180" y2="160" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="70" y="45" width="100" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Decorative screen lights inside panel -->
  <circle cx="90" cy="65" r="3" fill="#10b981"/>
  <circle cx="102" cy="65" r="3" fill="#38bdf8"/>
  <circle cx="114" cy="65" r="3" fill="#f59e0b"/>
  <rect x="130" y="62" width="30" height="6" rx="3" fill="#475569"/>

  <!-- Stage Floor -->
  <ellipse cx="120" cy="205" rx="90" ry="25" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <ellipse cx="120" cy="205" rx="75" ry="18" fill="url(#podiumGlow)"/>

  <!-- Podium (Front and Center) -->
  <path d="M 95 160 L 145 160 L 155 205 L 85 205 Z" fill="#334155" filter="url(#shadow)"/>
  <path d="M 90 155 L 150 155 L 145 160 L 95 160 Z" fill="#64748b"/>
  <!-- Podium glowing front accent representing official representation -->
  <path d="M 107 170 L 133 170 L 131 195 L 109 195 Z" fill="#0f172a"/>
  <polygon points="120,174 123,182 131,182 125,187 127,195 120,190 113,195 115,187 109,182 117,182" fill="url(#badgeGrad)"/>

  <!-- SUBJECT: The Representative (Confident Speaker at Podium) -->
  <!-- Shadow under character -->
  <ellipse cx="120" cy="165" rx="25" ry="8" fill="#020617" opacity="0.5"/>

  <!-- Body & Suit -->
  <path d="M 100 135 L 140 135 L 148 165 L 92 165 Z" fill="url(#suitGrad)" filter="url(#shadow)"/>
  <!-- Shirt & Tie -->
  <polygon points="120,135 113,150 127,150" fill="#f8fafc"/>
  <polygon points="118,148 122,148 123,163 117,163" fill="#ec4899"/>
  <!-- Lapels -->
  <path d="M 113 135 L 120 146 L 108 165" fill="#1e3a8a"/>
  <path d="M 127 135 L 120 146 L 132 165" fill="#1e3a8a"/>

  <!-- Representative Identification Badge (Crucial visual cue for 'Representative') -->
  <rect x="130" y="145" width="10" height="7" rx="1.5" fill="#ffffff" transform="rotate(10 135 148)" filter="url(#shadow)"/>
  <circle cx="135" cy="148" r="2" fill="#ef4444"/>

  <!-- Neck -->
  <rect x="114" y="125" width="12" height="15" fill="#fbcfe8"/>

  <!-- Head & Face -->
  <circle cx="120" cy="105" r="18" fill="#fbcfe8" filter="url(#shadow)"/>
  
  <!-- Hair -->
  <path d="M 102 105 C 102 92, 110 88, 120 88 C 130 88, 138 92, 138 105 C 138 105, 134 95, 120 93 C 106 95, 102 105, 102 105 Z" fill="#1e293b"/>

  <!-- Friendly, Confident Facial Expression -->
  <circle cx="113" cy="103" r="2" fill="#1e293b"/>
  <circle cx="127" cy="103" r="2" fill="#1e293b"/>
  <!-- Confident Smile -->
  <path d="M 115 111 Q 120 116 125 111" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="111" cy="107" r="3" fill="#f43f5e" opacity="0.3"/>
  <circle cx="129" cy="107" r="3" fill="#f43f5e" opacity="0.3"/>

  <!-- Action Pose: One hand gesturing forward professionally -->
  <path d="M 95 140 Q 80 135 85 125" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="85" cy="123" r="4" fill="#fbcfe8"/>
  
  <!-- Microphone on Podium -->
  <path d="M 135 155 L 138 135" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 133 133 C 133 129, 143 129, 143 133 Z" fill="#cbd5e1" filter="url(#shadow)"/>
  <ellipse cx="138" cy="133" rx="5" ry="3" fill="#64748b"/>

  <!-- CONTEXTUAL PROPS: Audience / Meeting Elements (Showing it's an official representation event) -->
  <!-- Floating Golden Star/Medal Symbolizing Official Delegation/Representative Status -->
  <g transform="translate(170, 70) scale(0.8)" filter="url(#shadow)">
    <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="url(#badgeGrad)" stroke-width="3"/>
    <polygon points="20,8 23,15 30,16 25,21 26,28 20,24 14,28 15,21 10,16 17,15" fill="url(#badgeGrad)"/>
  </g>

  <g transform="translate(30, 90) scale(0.6)" opacity="0.8" filter="url(#shadow)">
    <!-- Document representing official credentials -->
    <rect x="10" y="10" width="35" height="45" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="16" y1="20" x2="35" y2="20" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="39" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="36" x2="30" y2="36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="45" r="5" fill="#10b981"/>
  </g>

  <!-- Sparkles & Atmosphere (Energy & Professionalism) -->
  <path d="M 185 120 L 188 126 L 194 129 L 188 132 L 185 138 L 182 132 L 176 129 L 182 126 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 55 160 L 57 164 L 61 166 L 57 168 L 55 172 L 53 168 L 49 166 L 53 164 Z" fill="#38bdf8" opacity="0.6"/>

</svg>