<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ground -->
  <path d="M0 180 Q 120 160 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Person holding umbrella -->
  <g transform="translate(120, 100)">
    <!-- Umbrella -->
    <path d="M-50 -20 C -50 -60 50 -60 50 -20 L 0 -20 Z" fill="#f59e0b"/>
    <path d="M0 -20 L 0 40" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Body -->
    <path d="M-15 40 L 15 40 L 10 90 L -10 90 Z" fill="#38bdf8"/>
    <circle cx="0" cy="30" r="15" fill="#fde68a"/>
    <path d="M-10 50 L -25 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 50 L 25 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Raindrops -->
  <circle cx="40" cy="20" r="2" fill="#94a3b8"/>
  <circle cx="80" cy="40" r="3" fill="#94a3b8"/>
  <circle cx="160" cy="30" r="2" fill="#94a3b8"/>
  <circle cx="200" cy="50" r="3" fill="#94a3b8"/>
  <circle cx="30" cy="80" r="2" fill="#94a3b8"/>
  <circle cx="210" cy="100" r="2" fill="#94a3b8"/>
  
  <!-- Preparedness: Backpack on ground -->
  <path d="M160 170 L 200 170 L 195 210 L 165 210 Z" fill="#ec4899"/>
  <path d="M170 170 L 170 160 L 190 160 L 190 170" fill="none" stroke="#fbcfe8" stroke-width="4"/>
</svg>