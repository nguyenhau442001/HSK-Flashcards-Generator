<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Microphone -->
  <circle cx="120" cy="110" r="22" fill="#fbbf24"/>
  <rect x="114" y="132" width="12" height="40" rx="4" fill="#94a3b8"/>
  <path d="M110 172 L130 172 L125 200 L115 200 Z" fill="#475569"/>
  
  <!-- Camera/Lens -->
  <circle cx="50" cy="140" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="50" cy="140" r="15" fill="#38bdf8"/>
  
  <!-- Notes/Paper -->
  <rect x="160" y="150" width="60" height="70" rx="4" fill="#f1f5f9"/>
  <line x1="170" y1="165" x2="210" y2="165" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="170" y1="180" x2="210" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="170" y1="195" x2="200" y2="195" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Background Elements (Studio Lights) -->
  <circle cx="200" cy="50" r="10" fill="#fb923c" opacity="0.6"/>
  <circle cx="40" cy="60" r="8" fill="#ec4899" opacity="0.6"/>
  
  <!-- Action Lines/Broadcast Glow -->
  <path d="M120 88 C140 80, 160 90, 170 110" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M120 88 C100 80, 80 90, 70 110" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
</svg>