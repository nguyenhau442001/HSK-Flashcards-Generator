<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk / Workspace Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window / Cityscape Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Holographic UI / Success Glow -->
    <linearGradient id="holo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="blazer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment (Office Interior) -->
  <!-- City Window Silhouette -->
  <path d="M150 20 H210 V110 H150 Z" fill="url(#window-glow)" rx="4"/>
  <path d="M160 30 h12 v70 h-12 z M178 45 h15 v55 h-15 z M198 35 h8 v65 h-8 z" fill="#38bdf8" opacity="0.1"/>
  <!-- Window Frame -->
  <path d="M150 20 H210 V110 H150 Z" stroke="#475569" stroke-width="2" fill="none"/>
  <line x1="180" y1="20" x2="180" y2="110" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="65" x2="210" y2="65" stroke="#475569" stroke-width="2"/>

  <!-- Wall Shelf with Prop Elements -->
  <path d="M30 45 H110" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <!-- Plant on Shelf -->
  <path d="M45 45 C45 35 55 35 55 45 Z" fill="#10b981"/>
  <path d="M50 45 V30 C45 25 40 30 45 35" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 40 C55 35 60 40 55 45" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <rect x="42" y="45" width="16" height="12" rx="3" fill="#cbd5e1"/>
  <!-- Books on Shelf -->
  <rect x="75" y="30" width="8" height="15" rx="1" fill="#f43f5e"/>
  <rect x="84" y="27" width="10" height="18" rx="1" fill="#fbbf24"/>
  <rect x="95" y="32" width="7" height="13" rx="1" fill="#38bdf8"/>

  <!-- Holographic Productivity Chart / Floating Elements -->
  <g filter="url(#glow)">
    <path d="M110 85 L140 70 L170 78 L200 55" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="110" cy="85" r="3" fill="#38bdf8"/>
    <circle cx="140" cy="70" r="3" fill="#38bdf8"/>
    <circle cx="170" cy="78" r="3" fill="#38bdf8"/>
    <circle cx="200" cy="55" r="4" fill="#10b981"/>
    <!-- Hologram Panel Background -->
    <path d="M105 50 H205 V95 H105 Z" fill="url(#holo-grad)" rx="6"/>
  </g>

  <!-- Large Modern Desk -->
  <path d="M10 170 H230 V220 H10 Z" fill="url(#desk-grad)" filter="url(#shadow)"/>
  <path d="M10 170 H230" stroke="#64748b" stroke-width="2"/>

  <!-- Desk Props: Laptop -->
  <g transform="translate(145, 135)">
    <!-- Laptop Base -->
    <path d="M-5 30 L5 20 H55 L65 30 Z" fill="#94a3b8"/>
    <rect x="-10" y="30" width="80" height="6" rx="3" fill="#cbd5e1"/>
    <!-- Laptop Screen -->
    <path d="M5 20 V-15 C5 -18 8 -20 11 -20 H49 C52 -20 55 -18 55 -15 V20 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <!-- Screen Display Content (Charts & Dashboards) -->
    <rect x="10" y="-14" width="40" height="28" fill="#0f172a" rx="2"/>
    <path d="M14 -4 L20 -10 L26 -6 L34 -12" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="34" cy="-12" r="2" fill="#10b981"/>
    <rect x="14" y="2" width="12" height="4" rx="1" fill="#38bdf8"/>
    <rect x="29" y="2" width="16" height="4" rx="1" fill="#f43f5e"/>
    <rect x="14" y="8" width="22" height="4" rx="1" fill="#fbbf24"/>
  </g>

  <!-- Desk Props: Coffee Mug -->
  <g transform="translate(205, 145)">
    <rect x="0" y="5" width="14" height="18" rx="3" fill="#f8fafc"/>
    <path d="M14 9 C18 9 18 17 14 17" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M4 -2 C6 -5 2 -8 4 -11" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M10 -3 C12 -6 8 -9 10 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Desk Props: Plant Pot -->
  <g transform="translate(20, 150)">
    <path d="M2 15 L6 24 H18 L22 15 Z" fill="#e2e8f0"/>
    <ellipse cx="12" cy="15" rx="10" ry="3" fill="#cbd5e1"/>
    <path d="M12 15 C12 5 2 0 12 -5 C22 0 12 5 12 15 Z" fill="#10b981"/>
    <path d="M12 15 C15 5 25 2 20 -3 C15 -8 10 2 12 15 Z" fill="#34d399"/>
  </g>

  <!-- Central Subject: Capable Professional Woman ("能干" - Competent / Accomplished) -->
  <g transform="translate(75, 75)" filter="url(#shadow)">
    <!-- Torso / Blazer & Shirt -->
    <path d="M25 65 L40 45 H60 L75 65 L85 95 H15 Z" fill="url(#blazer-grad)" rx="4"/>
    <!-- Inner Shirt & Collar -->
    <path d="M40 45 L50 65 L60 45 Z" fill="url(#shirt-grad)"/>
    <!-- Neck -->
    <rect x="44" y="32" width="12" height="15" fill="#fbcfe8"/>

    <!-- Head & Hair -->
    <!-- Back Hair -->
    <path d="M35 25 C30 10 70 10 65 25 Z" fill="#1e293b"/>
    <!-- Face Shape -->
    <rect x="35" y="15" width="30" height="30" rx="15" fill="#fbcfe8"/>
    <!-- Hair Styling / Sleek Professional Bob -->
    <path d="M32 18 C30 5 70 5 68 18 C72 30 70 45 68 45 C65 45 60 30 50 30 C40 30 35 45 32 45 C30 45 28 30 32 18 Z" fill="#1e293b"/>
    <!-- Confident Warm Smile & Facial Features -->
    <path d="M44 26 Q50 30 56 26" fill="none" stroke="#db2777" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="43" cy="22" r="2.5" fill="#1e293b"/>
    <circle cx="57" cy="22" r="2.5" fill="#1e293b"/>
    <!-- Rosy Cheeks -->
    <circle cx="41" cy="27" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="59" cy="27" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Dynamic Posing: Confident Gesturing / Arms -->
    <!-- Left Arm (Resting/Operating) -->
    <path d="M25 65 L10 85 L20 90" fill="none" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm (Raised in triumphant/capable working gesture) -->
    <path d="M75 65 L95 45 L85 30" fill="none" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Hand -->
    <circle cx="82" cy="27" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Floating Success / Excellence Accents (Golden Sparks & Stars) -->
  <g transform="translate(10, 10)">
    <path d="M30 30 L33 38 L41 41 L33 44 L30 52 L27 44 L19 41 L27 38 Z" fill="#fbbf24" filter="url(#glow)"/>
  </g>
  <g transform="translate(190, 40)">
    <path d="M20 15 L21.5 19.5 L26 21 L21.5 22.5 L20 27 L18.5 22.5 L14 21 L18.5 19.5 Z" fill="#fbbf24" filter="url(#glow)"/>
  </g>
  <g transform="translate(20, 100)">
    <path d="M15 10 L16 13 L19 14 L16 15 L15 18 L14 15 L11 14 L14 13 Z" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Foreground Atmospheric Glow / Vignette Border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
</svg>