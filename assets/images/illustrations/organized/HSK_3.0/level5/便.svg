<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The "Decision" Scene: A hand pointing at a map/path -->
  <!-- Map Paper -->
  <path d="M40 60 L200 60 L190 190 L50 190 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M70 90 L170 90 L160 160 L80 160 Z" fill="#e2e8f0"/>
  
  <!-- The Path (Representing the "then/so" flow) -->
  <path d="M80 100 C 100 100, 120 120, 160 150" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="160" cy="150" r="8" fill="#f59e0b"/>
  
  <!-- Hand pointing at the destination -->
  <g transform="translate(130, 110)">
    <path d="M20 40 L40 20 L50 30 L30 50 Z" fill="#fbbf24"/>
    <path d="M30 30 L50 10 L60 20 L40 40 Z" fill="#fcd34d"/>
    <path d="M40 20 L60 0 L70 10 L50 30 Z" fill="#fbbf24"/>
    <path d="M10 50 L30 30 L40 40 L20 60 Z" fill="#fbbf24"/>
    <path d="M0 60 L20 40 L30 50 L10 70 Z" fill="#fbbf24"/>
    <path d="M20 50 L40 30 L50 40 L30 60 Z" fill="#f59e0b"/>
  </g>
  
  <!-- Decorative elements for action -->
  <circle cx="50" cy="50" r="4" fill="#38bdf8"/>
  <circle cx="210" cy="40" r="6" fill="#10b981"/>
  <path d="M190 170 L205 160 L220 170" stroke="#ec4899" stroke-width="3" fill="none"/>
  
  <!-- Ambient light glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#f59e0b" stroke-opacity="0.05" stroke-width="20"/>
</svg>