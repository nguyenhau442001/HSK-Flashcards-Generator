<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Stack of books -->
  <rect x="60" y="120" width="120" height="20" rx="2" fill="#fb923c"/>
  <rect x="65" y="100" width="110" height="20" rx="2" fill="#f59e0b"/>
  <rect x="70" y="80" width="100" height="20" rx="2" fill="#fbbf24"/>
  
  <!-- Open book on top -->
  <path d="M75 60 L165 60 L175 80 L65 80 Z" fill="#ffffff"/>
  <path d="M75 60 L120 60 L120 80 L65 80 Z" fill="#e2e8f0"/>
  
  <!-- Atmospheric elements -->
  <circle cx="190" cy="50" r="3" fill="#38bdf8"/>
  <circle cx="200" cy="40" r="2" fill="#10b981"/>
  <circle cx="40" cy="70" r="4" fill="#ec4899"/>
  
  <!-- Quill pen -->
  <path d="M170 90 L200 40 L205 45 L175 95 Z" fill="#fbbf24"/>
  <path d="M170 90 L175 95 L180 90 Z" fill="#f59e0b"/>
  
  <!-- Coffee mug -->
  <rect x="180" y="140" width="30" height="35" rx="4" fill="#38bdf8"/>
  <path d="M210 145 Q225 145 225 155 Q225 165 210 165" stroke="#38bdf8" stroke-width="4" fill="none"/>
  
  <!-- Decorative light glow -->
  <circle cx="120" cy="100" r="80" fill="url(#glow)" opacity="0.05"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>