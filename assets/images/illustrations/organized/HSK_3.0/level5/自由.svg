<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Distant Mountains -->
  <path d="M0 180 L40 130 L80 170 L120 120 L160 160 L200 110 L240 180 Z" fill="#334155"/>
  
  <!-- The Bird (Symbol of Freedom) -->
  <g transform="translate(120, 100)">
    <path d="M-40 -10 C-20 -40 20 -40 40 -10 C20 -20 -20 -20 -40 -10 Z" fill="#fbbf24"/>
    <path d="M-30 0 C-10 -30 10 -30 30 0 C10 -10 -10 -10 -30 0 Z" fill="#f59e0b"/>
    <path d="M-10 5 L0 20 L10 5 Z" fill="#fb923c"/>
  </g>
  
  <!-- Open Cage (Representing the act of gaining freedom) -->
  <g transform="translate(120, 240)">
    <path d="M-60 0 L-60 -120 C-60 -150 -30 -160 0 -160 C30 -160 60 -150 60 -120 L60 0" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <path d="M-60 -80 L60 -80" fill="none" stroke="#64748b" stroke-width="4"/>
    <path d="M-60 -40 L60 -40" fill="none" stroke="#64748b" stroke-width="4"/>
    <path d="M-20 -160 L-20 -120" fill="none" stroke="#64748b" stroke-width="4"/>
    <path d="M20 -160 L20 -120" fill="none" stroke="#64748b" stroke-width="4"/>
    <!-- Door swinging open -->
    <path d="M60 -120 L100 -100 L100 0" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Wind/Motion lines -->
  <path d="M20 50 Q50 30 80 50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M160 40 Q190 20 220 40" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Ground/Horizon -->
  <rect x="0" y="220" width="240" height="20" fill="#0f172a"/>
</svg>