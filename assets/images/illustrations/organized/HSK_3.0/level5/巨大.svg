<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Monster/Gigantic Object Gradient -->
    <linearGradient id="monsterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="charGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow/Atmospheric Effect -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow behind the colossal subject -->
  <circle cx="150" cy="110" r="90" fill="url(#glow)"/>

  <!-- Environment Elements (Cave/Mountain walls for scale) -->
  <path d="M0 240 L0 180 L35 150 L60 240 Z" fill="#090d16" opacity="0.6"/>
  <path d="M240 240 L240 120 L200 90 L160 240 Z" fill="#090d16" opacity="0.4"/>

  <!-- Ground Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>

  <!-- THE GIGANTIC ENTITY (Representing '巨大' / To lớn) -->
  <g filter="url(#shadow)">
    <!-- Massive Body / Boulder-like Creature -->
    <path d="M100 130 C90 90 130 60 170 70 C210 80 230 120 220 170 C210 210 130 220 100 200 C80 180 110 150 100 130 Z" fill="url(#monsterGrad)"/>

    <!-- Creature Texture Details -->
    <circle cx="140" cy="110" r="10" fill="#c2410c" opacity="0.4"/>
    <circle cx="180" cy="140" r="14" fill="#c2410c" opacity="0.4"/>
    <circle cx="130" cy="170" r="8" fill="#c2410c" opacity="0.4"/>
    <path d="M160 85 Q175 75 190 90" stroke="#fef08a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M120 125 Q135 115 150 130" stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Gigantic Glowing Eye -->
    <circle cx="185" cy="115" r="12" fill="#1e293b"/>
    <circle cx="187" cy="115" r="5" fill="#facc15"/>
    <circle cx="189" cy="113" r="2" fill="#ffffff"/>
  </g>

  <!-- ENVIRONMENT: Glowing Crystal / Prop for Scale -->
  <polygon points="110,180 120,150 130,180" fill="#10b981" filter="url(#shadow)"/>
  <polygon points="115,200 120,165 125,200" fill="#34d399"/>

  <!-- ADVENTURER CHARACTER (Small for dramatic scale contrast) -->
  <g id="character" filter="url(#shadow)" transform="translate(-10, 15)">
    <!-- Shadow on ground -->
    <ellipse cx="65" cy="190" rx="14" ry="4" fill="#000000" opacity="0.5"/>

    <!-- Legs -->
    <rect x="58" y="165" rx="4" width="7" height="25" fill="#1e293b"/>
    <rect x="68" y="165" rx="4" width="7" height="25" fill="#1e293b"/>

    <!-- Body / Backpack -->
    <rect x="53" y="135" rx="6" width="24" height="32" fill="url(#charGrad)"/>
    <!-- Explorer Backpack -->
    <rect x="47" y="138" rx="3" width="8" height="22" fill="#d97706"/>

    <!-- Head -->
    <circle cx="65" cy="118" r="12" fill="#fde047"/>

    <!-- Expressive Face (Shocked/Awed) -->
    <!-- Wide Eyes -->
    <circle cx="70" cy="116" r="3" fill="#1e293b"/>
    <circle cx="71" cy="115" r="1" fill="#ffffff"/>
    <!-- Open Mouth (O shape) -->
    <ellipse cx="72" cy="123" rx="2.5" ry="4" fill="#1e293b"/>

    <!-- Explorer Hat -->
    <path d="M50 110 Q65 100 80 110 L83 113 Q65 107 47 113 Z" fill="#b45309"/>
    <ellipse cx="65" cy="109" rx="11" ry="5" fill="#d97706"/>

    <!-- Pointing Arm (Emphasizing the giant obstacle) -->
    <path d="M72 142 L92 130" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
    <circle cx="93" cy="129" r="3.5" fill="#fde047"/>

    <!-- Back Arm -->
    <path d="M58 142 L48 155" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Dust Particles / Dramatic floating debris -->
  <circle cx="115" cy="140" r="2.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="100" cy="110" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="135" cy="95" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="90" cy="160" r="1.5" fill="#38bdf8" opacity="0.7"/>

  <!-- Foreground Atmospheric Vignette / Border frame -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>