<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mirror Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Mirror Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light / Environment Props (Desk and background elements) -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16" opacity="0.8"/>
  <path d="M 0 190 L 240 190" stroke="#334155" stroke-width="2"/>

  <!-- Background Props: Stage lights / Mood Lamps -->
  <circle cx="50" cy="60" r="16" fill="#334155" opacity="0.4"/>
  <path d="M 42 60 L 58 60 L 54 85 L 46 85 Z" fill="#475569" opacity="0.4"/>
  <circle cx="50" cy="85" r="4" fill="#fbbf24" filter="url(#glow)" opacity="0.8"/>

  <circle cx="190" cy="60" r="16" fill="#334155" opacity="0.4"/>
  <path d="M 182 60 L 198 60 L 194 85 L 186 85 Z" fill="#475569" opacity="0.4"/>
  <circle cx="190" cy="85" r="4" fill="#38bdf8" filter="url(#glow)" opacity="0.8"/>

  <!-- Floating Expression Masks / Props representing "Biểu cảm" -->
  <!-- Mask 1: Joyful / Surprised (Floating left) -->
  <g transform="translate(38, 110) rotate(-15)">
    <circle cx="0" cy="0" r="18" fill="#f59e0b" filter="url(#softGlow)"/>
    <circle cx="-6" cy="-4" r="2.5" fill="#0f172a"/>
    <circle cx="6" cy="-4" r="2.5" fill="#0f172a"/>
    <path d="M -5 5 Q 0 10 5 5" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Mask 2: Puzzled / Quirky (Floating right) -->
  <g transform="translate(202, 115) rotate(12)">
    <circle cx="0" cy="0" r="18" fill="#ec4899" filter="url(#softGlow)"/>
    <path d="M -8 -6 L -3 -4" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="6" cy="-5" r="2" fill="#0f172a"/>
    <path d="M -5 4 Q 0 8 5 4" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: The Magical Expression Mirror / Vanity Set -->
  <!-- Mirror Stand Base -->
  <ellipse cx="120" cy="190" rx="35" ry="10" fill="#b45309"/>
  <path d="M 115 130 L 125 130 L 128 190 L 112 190 Z" fill="url(#frameGrad)"/>

  <!-- Mirror Outer Frame -->
  <circle cx="120" cy="95" r="52" fill="url(#frameGrad)" filter="url(#softGlow)"/>
  <!-- Mirror Inner Rim -->
  <circle cx="120" cy="95" r="46" fill="#0f172a"/>
  <!-- Mirror Glass Surface -->
  <circle cx="120" cy="95" r="43" fill="url(#glassGrad)"/>
  
  <!-- Mirror Reflection / Sheen -->
  <path d="M 95 75 Q 110 65 130 70 Q 115 80 95 75 Z" fill="#ffffff" opacity="0.3"/>

  <!-- CHARACTER / FACE IN THE MIRROR (Exhibiting a quirky/expressive face - 表情) -->
  <g transform="translate(120, 98)">
    <!-- Face Base (Cute avatar head) -->
    <circle cx="0" cy="0" r="28" fill="#fed7aa"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.4"/>

    <!-- Blushing Cheeks -->
    <ellipse cx="-16" cy="4" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="16" cy="4" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>

    <!-- Expressive Eyes (One winking, one wide & curious) -->
    <!-- Left Eye (Wink arc) -->
    <path d="M -10 -4 C -8 -8 -4 -8 -2 -4" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Right Eye (Big curious eye with highlight) -->
    <circle cx="10" cy="-5" r="4.5" fill="#1e293b"/>
    <circle cx="11.5" cy="-6.5" r="1.5" fill="#ffffff"/>

    <!-- Eyebrows (Asymmetrical for quirky expression) -->
    <path d="M -13 -12 C -9 -15 -5 -11 -3 -12" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 7 -14 Q 10 -18 13 -13" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Quirky Smiling Mouth (Off-center smirk/smile) -->
    <path d="M -6 6 Q 0 14 8 8" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tongue peek -->
    <path d="M 3 9 C 3 12 7 12 7 9 Z" fill="#f43f5e"/>
  </g>

  <!-- Sparkles and Action Elements around the Mirror -->
  <g fill="#fbbf24" filter="url(#glow)">
    <!-- Top Sparkle -->
    <path d="M 120 32 L 123 40 L 131 43 L 123 46 L 120 54 L 117 46 L 109 43 L 117 40 Z"/>
    <!-- Left Sparkle -->
    <path d="M 68 85 L 70 89 L 74 91 L 70 93 L 68 97 L 66 93 L 62 91 L 66 89 Z" transform="scale(0.8) translate(15, 5)"/>
    <!-- Right Sparkle -->
    <path d="M 172 85 L 174 89 L 178 91 L 174 93 L 172 97 L 170 93 L 166 91 L 170 89 Z" transform="scale(0.7) translate(30, 20)"/>
  </g>

  <!-- Foreground Scene Props (Cosmetic items / Emoji cards on desk) -->
  <!-- Emoji Card 1 -->
  <g transform="translate(65, 175) rotate(-8)">
    <rect x="-12" y="-14" width="24" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Mini face inside card -->
    <circle cx="0" cy="-2" r="8" fill="#fef08a"/>
    <circle cx="-3" cy="-4" r="1" fill="#1e293b"/>
    <circle cx="3" cy="-4" r="1" fill="#1e293b"/>
    <path d="M -3 2 Q 0 5 3 2" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Emoji Card 2 (Overlapping) -->
  <g transform="translate(168, 172) rotate(12)">
    <rect x="-12" y="-14" width="24" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Mini face inside card -->
    <circle cx="0" cy="-2" r="8" fill="#fed7aa"/>
    <path d="M -5 -5 L -2 -3" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 2 -5 L 5 -3" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="4" r="2" fill="#1e293b"/>
  </g>

  <!-- Small cosmetics bottle on desk -->
  <path d="M 98 175 L 106 175 L 108 190 L 96 190 Z" fill="#38bdf8" opacity="0.8"/>
  <rect x="99" y="170" width="6" height="5" rx="1" fill="#cbd5e1"/>

</svg>