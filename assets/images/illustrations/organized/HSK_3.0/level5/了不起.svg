<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Spotlight/Glow Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Confetti Gradients -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Spotlight -->
  <circle cx="120" cy="90" r="110" fill="url(#spotlight)"/>

  <!-- Background Environment / Stage elements -->
  <g opacity="0.15">
    <circle cx="120" cy="110" r="80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="120" cy="110" r="60" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 6"/>
  </g>

  <!-- Floor/Stage -->
  <path d="M 20 190 Q 120 170 220 190 L 230 220 Q 120 235 10 220 Z" fill="url(#floorGrad)"/>
  <ellipse cx="120" cy="195" rx="80" ry="12" fill="#0f172a" opacity="0.6"/>

  <!-- Confetti / Particles (Action Atmosphere) -->
  <g>
    <path d="M 45 60 L 52 68 L 47 73 Z" fill="url(#pinkGrad)" transform="rotate(15 48 66)"/>
    <circle cx="190" cy="70" r="4" fill="url(#goldGrad)"/>
    <rect x="175" y="130" width="8" height="4" rx="1" fill="#38bdf8" transform="rotate(-30 179 132)"/>
    <rect x="55" y="140" width="6" height="6" rx="1" fill="url(#pinkGrad)" transform="rotate(45 58 143)"/>
    <path d="M 195 160 L 202 165 L 197 172 Z" fill="url(#greenGrad)" transform="rotate(75 198 166)"/>
    <circle cx="40" cy="100" r="3" fill="#fbbf24"/>
    <path d="M 120 35 L 125 45 L 115 45 Z" fill="url(#goldGrad)" transform="rotate(10 120 40)"/>
  </g>

  <!-- Giant Trophy (Main Object representing achievement/tuyệt vời) -->
  <g filter="url(#dropShadow)">
    <!-- Trophy Base -->
    <path d="M 100 185 L 140 185 L 135 175 L 105 175 Z" fill="#334155"/>
    <rect x="105" y="172" width="30" height="4" rx="1" fill="#64748b"/>
    
    <!-- Trophy Stem -->
    <path d="M 114 172 L 126 172 L 128 140 L 112 140 Z" fill="url(#goldGrad)"/>

    <!-- Trophy Cup Body -->
    <path d="M 90 85 C 90 135 150 135 150 85 L 142 80 C 142 110 98 110 98 80 Z" fill="url(#goldGrad)"/>
    
    <!-- Cup Inner Depth & Shine -->
    <path d="M 94 83 C 94 125 146 125 146 83 C 146 65 94 65 94 83 Z" fill="#b45309"/>
    <path d="M 98 83 C 98 118 142 118 142 83 C 142 70 98 70 98 83 Z" fill="url(#goldGrad)"/>
    <path d="M 105 78 Q 120 95 135 78 Q 120 115 105 78 Z" fill="url(#goldShine)" opacity="0.7"/>

    <!-- Trophy Handles -->
    <path d="M 92 88 C 75 88 75 115 95 122" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 148 88 C 165 88 165 115 145 122" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Star Emblem on Trophy -->
    <path d="M 120 95 L 123 103 L 131 103 L 125 108 L 127 116 L 120 111 L 113 116 L 115 108 L 109 103 L 117 103 Z" fill="#fff" filter="url(#dropShadow)"/>
  </g>

  <!-- Cheering Character (Holding the trophy/celebrating) -->
  <g>
    <!-- Body/Torso leaning back in triumphant pose -->
    <path d="M 120 145 C 110 145 100 155 95 175 L 145 175 C 140 155 130 145 120 145 Z" fill="url(#shirtGrad)"/>
    
    <!-- Head -->
    <circle cx="120" cy="120" r="16" fill="url(#skinGrad)"/>
    
    <!-- Hair -->
    <path d="M 105 118 C 105 105 115 102 122 102 C 132 102 136 110 135 122 C 130 118 115 115 105 118 Z" fill="#0f172a"/>

    <!-- Cheering Face Expression (Happy eyes closed, big smile) -->
    <path d="M 113 118 Q 116 114 119 118" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 121 118 Q 124 114 127 118" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 116 122 Q 120 127 124 122" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Blushing cheeks -->
    <circle cx="112" cy="122" r="2.5" fill="#fca5a5" opacity="0.6"/>
    <circle cx="128" cy="122" r="2.5" fill="#fca5a5" opacity="0.6"/>

    <!-- Arms reaching up/out dynamically supporting the triumphant theme -->
    <path d="M 100 150 L 80 130 L 72 135 L 90 160 Z" fill="url(#skinGrad)"/>
    <path d="M 140 150 L 160 130 L 168 135 L 150 160 Z" fill="url(#skinGrad)"/>
  </g>

  <!-- Foreground Dynamic Sparkles & Glows -->
  <g>
    <path d="M 70 85 L 73 93 L 81 96 L 73 99 L 70 107 L 67 99 L 59 96 L 67 93 Z" fill="#fbbf24"/>
    <path d="M 170 55 L 172 60 L 177 62 L 172 64 L 170 69 L 168 64 L 163 62 L 168 60 Z" fill="#38bdf8"/>
    <path d="M 100 50 L 101 54 L 105 55 L 101 56 L 100 60 L 99 56 L 95 55 L 99 54 Z" fill="#f472b6"/>
  </g>

  <!-- Vignette / App Framing Border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>