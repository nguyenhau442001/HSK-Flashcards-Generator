<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Decorative Background Elements -->
  <path d="M40 180 Q 120 120 200 180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Traditional Tea Set (Representing Fengsu/Custom) -->
  <g transform="translate(60, 140)">
    <path d="M10 40 C 10 20, 50 20, 50 40 L 45 60 L 15 60 Z" fill="#fb923c"/>
    <path d="M50 45 L 65 35 L 65 50 L 50 55 Z" fill="#f59e0b"/>
    <circle cx="30" cy="30" r="8" fill="#fbbf24"/>
  </g>
  
  <!-- Red Envelope/Gift (Representing Cultural Tradition) -->
  <g transform="translate(140, 130)">
    <rect x="0" y="0" width="50" height="70" rx="4" fill="#ec4899"/>
    <path d="M0 20 L 25 40 L 50 20" stroke="#fce7f3" stroke-width="3" fill="none"/>
    <circle cx="25" cy="55" r="6" fill="#fbbf24"/>
  </g>
  
  <!-- Lantern Glow -->
  <circle cx="180" cy="60" r="30" fill="#f59e0b" opacity="0.1"/>
  <path d="M170 40 L 190 40 L 185 80 L 175 80 Z" fill="#fb923c"/>
  <path d="M180 80 L 180 95" stroke="#fb923c" stroke-width="2"/>
  
  <!-- Decorative Floral/Pattern Accents -->
  <circle cx="40" cy="60" r="4" fill="#10b981"/>
  <circle cx="200" cy="180" r="3" fill="#38bdf8"/>
  <path d="M100 80 L 110 70 L 120 80 L 110 90 Z" fill="#38bdf8" opacity="0.6"/>
</svg>