<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bootGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dogGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="skyGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Background -->
    <rect width="240" height="240" fill="url(#bg)"/>
    <rect width="240" height="240" fill="url(#skyGlow)"/>

    <!-- Distant Hills & Trees -->
    <path d="M-10 160 Q 40 130 90 150 T 210 140 L 250 180 L -10 180 Z" fill="#0f172a" opacity="0.6"/>
    <path d="M20 150 Q 80 120 150 145 T 260 135 L 260 190 L -10 190 Z" fill="#132238"/>

    <!-- House in Background (Warm glow from window) -->
    <rect x="170" y="115" width="40" height="35" rx="2" fill="#334155"/>
    <polygon points="165,115 190,95 215,115" fill="#475569"/>
    <rect x="182" y="125" width="16" height="25" rx="8" fill="#fbbf24"/>
    <!-- Tiny warm window light effect -->
    <circle cx="190" cy="137" r="15" fill="#fbbf24" opacity="0.3" filter="blur(4px)"/>

    <!-- Ground / Path -->
    <path d="M-10 170 Q 70 160 120 185 T 250 175 L 250 250 L -10 250 Z" fill="url(#groundGrad)"/>
    
    <!-- Stone Path / Stepping Stones -->
    <ellipse cx="60" cy="195" rx="14" ry="6" fill="#042f2e" opacity="0.8"/>
    <ellipse cx="95" cy="210" rx="16" ry="7" fill="#042f2e" opacity="0.8"/>
    <ellipse cx="140" cy="225" rx="15" ry="6" fill="#042f2e" opacity="0.8"/>

    <!-- Environment Props: Glowing Flowers & Bushes -->
    <circle cx="30" cy="180" r="12" fill="#047857"/>
    <circle cx="22" cy="175" r="9" fill="#10b981"/>
    <circle cx="38" cy="177" r="8" fill="#059669"/>
    <!-- Glowing flower heads -->
    <circle cx="25" cy="170" r="2.5" fill="#f472b6"/>
    <circle cx="35" cy="173" r="2.5" fill="#38bdf8"/>

    <circle cx="205" cy="190" r="14" fill="#047857"/>
    <circle cx="215" cy="185" r="10" fill="#10b981"/>
    <circle cx="198" cy="188" r="7" fill="#059669"/>
    <circle cx="208" cy="180" r="2.5" fill="#fbbf24"/>

    <!-- Falling Raindrops (Atmospheric depth) -->
    <!-- Layer 1 (Back, smaller, faint) -->
    <g stroke="#94a3b8" stroke-width="1" opacity="0.3" stroke-linecap="round">
      <line x1="20" y1="10" x2="10" y2="30"/>
      <line x1="70" y1="30" x2="60" y2="50"/>
      <line x1="120" y1="15" x2="110" y2="35"/>
      <line x1="180" y1="25" x2="170" y2="45"/>
      <line x1="220" y1="40" x2="210" y2="60"/>

      <line x1="40" y1="70" x2="30" y2="90"/>
      <line x1="90" y1="85" x2="80" y2="105"/>
      <line x1="150" y1="65" x2="140" y2="85"/>
      <line x1="200" y1="80" x2="190" y2="100"/>
    </g>

    <!-- Layer 2 (Mid, clear) -->
    <g stroke="#cbd5e1" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
      <line x1="45" y1="20" x2="33" y2="44"/>
      <line x1="105" y1="40" x2="93" y2="64"/>
      <line x1="160" y1="25" x2="148" y2="49"/>
      <line x1="210" y1="55" x2="198" y2="79"/>

      <line x1="15" y1="90" x2="3" y2="114"/>
      <line x1="75" y1="105" x2="63" y2="129"/>
      <line x1="135" y1="95" x2="123" y2="119"/>
      <line x1="185" y1="110" x2="173" y2="134"/>
      <line x1="230" y1="90" x2="218" y2="114"/>
    </g>

    <!-- MAIN SUBJECT: Determined Traveller & Dog in Heavy Rain -->
    <!-- Group for character moving right with umbrella -->
    <g transform="translate(65, 95)">
      <!-- Shadow on ground -->
      <ellipse cx="25" cy="85" rx="20" ry="6" fill="#022c22" opacity="0.5"/>

      <!-- Dog (Happy, rushing along despite rain) -->
      <g transform="translate(-15, 55)">
        <!-- Dog body -->
        <ellipse cx="15" cy="12" rx="14" ry="9" fill="url(#dogGrad)"/>
        <!-- Dog head -->
        <circle cx="26" cy="6" r="8" fill="url(#dogGrad)"/>
        <!-- Dog ear -->
        <path d="M22 0 Q 20 -6 25 -3 Z" fill="#9a3412"/>
        <!-- Dog snout -->
        <circle cx="31" cy="7" r="3" fill="#fed7aa"/>
        <circle cx="33" cy="6" r="1" fill="#0f172a"/>
        <!-- Dog legs in motion -->
        <rect x="6" y="18" width="3" height="10" rx="1.5" fill="#c2410c" transform="rotate(15)"/>
        <rect x="12" y="18" width="3" height="10" rx="1.5" fill="#ea580c" transform="rotate(-15)"/>
        <rect x="18" y="18" width="3" height="10" rx="1.5" fill="#c2410c" transform="rotate(20)"/>
        <rect x="22" y="18" width="3" height="10" rx="1.5" fill="#ea580c" transform="rotate(-10)"/>
        <!-- Wagging tail -->
        <path d="M1 10 Q -6 3 -2 -2" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none"/>
        <!-- Tiny raincoat for dog -->
        <path d="M8 7 C 8 3 20 3 22 8 L 20 16 C 15 17 10 17 8 16 Z" fill="#38bdf8"/>
      </g>

      <!-- Traveller Legs -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <!-- Back leg -->
        <path d="M15 55 L 8 75 L 14 77" fill="none" stroke="#0ea5e9" stroke-width="6"/>
        <!-- Front leg stepping -->
        <path d="M25 55 L 34 72 L 40 70" fill="none" stroke="#0284c7" stroke-width="6"/>
        <!-- Boots -->
        <path d="M10 75 L 17 75 L 17 78 L 8 78 Z" fill="url(#bootGrad)"/>
        <path d="M31 72 L 41 70 L 42 74 L 32 76 Z" fill="url(#bootGrad)"/>
      </g>

      <!-- Traveller Torso & Jacket -->
      <path d="M12 28 C 12 25 28 25 30 28 L 32 55 C 32 58 12 58 12 55 Z" fill="url(#jacketGrad)"/>
      
      <!-- Jacket details (zipper, pockets) -->
      <line x1="22" y1="28" x2="22" y2="52" stroke="#bae6fd" stroke-width="1.5"/>
      <circle cx="20" cy="33" r="1" fill="#bae6fd"/>
      <circle cx="20" cy="40" r="1" fill="#bae6fd"/>
      <circle cx="20" cy="47" r="1" fill="#bae6fd"/>

      <!-- Backpack -->
      <path d="M8 30 C 3 30 2 45 8 48 L 12 48 L 12 30 Z" fill="#f43f5e"/>
      <path d="M5 38 L 8 39" stroke="#fda4af" stroke-width="2"/>

      <!-- Traveller Head & Face -->
      <circle cx="21" cy="18" r="9" fill="#fde68a"/>
      <!-- Determined expression (eyes slanted, confident smile) -->
      <path d="M17 17 L 20 19" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M22 19 L 25 17" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M19 22 Q 21 24 23 22" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Rosy cheeks -->
      <circle cx="16" cy="20" r="1.5" fill="#f43f5e" opacity="0.4"/>
      <circle cx="26" cy="20" r="1.5" fill="#f43f5e" opacity="0.4"/>
      <!-- Cute hat / beanie -->
      <path d="M12 15 C 12 9 30 9 30 15 C 26 13 16 13 12 15 Z" fill="#ec4899"/>
      <circle cx="21" cy="8" r="2.5" fill="#fbbf24"/>

      <!-- Arms holding umbrella -->
      <!-- Back arm -->
      <path d="M16 32 L 6 38 L 12 42" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Front arm pushing forward -->
      <path d="M26 32 L 35 36 L 31 43" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Umbrella Shaft & Handle -->
      <path d="M33 40 L 45 -25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <path d="M33 40 L 33 43 C 33 46 30 46 30 43" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Vibrant Large Umbrella Canopy (protecting against the downpour) -->
      <g>
        <!-- Umbrella shadow / inner rim -->
        <path d="M -5 -25 Q 45 -45 95 -25 Q 45 -12 -5 -25 Z" fill="#be123c"/>
        <!-- Main umbrella canopy -->
        <path d="M -8 -25 C -8 -55 98 -55 98 -25 C 70 -35 20 -35 -8 -25 Z" fill="url(#roofGrad)"/>
        <!-- Umbrella segments / panels pattern -->
        <path d="M 45 -53 Q 45 -33 98 -25" fill="none" stroke="#fda4af" stroke-width="1.5" opacity="0.6"/>
        <path d="M 45 -53 Q 20 -33 -8 -25" fill="none" stroke="#fda4af" stroke-width="1.5" opacity="0.6"/>
        <path d="M 45 -53 Q 70 -33 45 -21" fill="none" stroke="#fda4af" stroke-width="1.5" opacity="0.6"/>
        <path d="M 45 -53 Q 20 -33 45 -21" fill="none" stroke="#fda4af" stroke-width="1.5" opacity="0.6"/>
        <!-- Umbrella tip -->
        <circle cx="45" cy="-55" r="3" fill="#fbbf24"/>
        <!-- Rain splashing off the umbrella edge -->
        <circle cx="-5" cy="-24" r="2" fill="#38bdf8" opacity="0.8"/>
        <circle cx="95" cy="-24" r="2" fill="#38bdf8" opacity="0.8"/>
      </g>
    </g>

    <!-- Foreground Rain Splashes and Droplets (Action effect) -->
    <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <path d="M 75 185 Q 78 180 82 185" fill="none"/>
      <path d="M 120 200 Q 123 195 127 200" fill="none"/>
      <path d="M 45 220 Q 48 215 52 220" fill="none"/>
      <line x1="25" y1="140" x2="15" y2="165"/>
      <line x1="215" y1="130" x2="205" y2="155"/>
    </g>

    <!-- Glowing amber accent lights from background droplets / environment -->
    <circle cx="170" cy="80" r="2" fill="#fbbf24" opacity="0.8"/>
    <circle cx="60" cy="60" r="1.5" fill="#fbbf24" opacity="0.6"/>
    <circle cx="110" cy="50" r="2" fill="#38bdf8" opacity="0.7"/>

    <!-- Vignette / Frame border -->
    <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.5"/>
  </g>
</svg>