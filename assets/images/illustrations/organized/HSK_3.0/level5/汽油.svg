<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Fuel Pump Body Gradient -->
    <linearGradient id="pumpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Metallic/Chrome Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Ground/Environment -->
  <ellipse cx="120" cy="215" rx="90" ry="15" fill="#090d16" opacity="0.6"/>
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  
  <!-- Ambient Glow from Dispenser Screen -->
  <circle cx="120" cy="95" r="50" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>

  <!-- GAS PUMP STATION MAIN BODY -->
  <g filter="url(#shadow)">
    <!-- Base Platform -->
    <path d="M 75 200 L 165 200 L 155 185 L 85 185 Z" fill="#334155"/>
    <path d="M 80 185 L 160 185 L 160 183 L 80 183 Z" fill="#64748b"/>

    <!-- Main Housing -->
    <rect x="85" y="60" width="70" height="125" rx="8" fill="url(#pumpGrad)"/>
    <!-- Highlight Reflection on Body -->
    <path d="M 88 68 L 94 68 L 94 175 L 88 175 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Top Beacon / Canopy Light -->
    <path d="M 92 60 L 148 60 L 155 48 L 85 48 Z" fill="#cbd5e1"/>
    <rect x="90" y="42" width="60" height="8" rx="3" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Screen Display Area -->
    <rect x="95" y="75" width="50" height="36" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="99" y="79" width="42" height="20" rx="2" fill="url(#screenGrad)"/>
    <!-- Simulated Digital Readouts (Abstract lines/bars instead of text) -->
    <rect x="103" y="83" width="12" height="3" rx="1" fill="#38bdf8"/>
    <rect x="119" y="83" width="18" height="3" rx="1" fill="#38bdf8"/>
    <rect x="103" y="90" width="24" height="4" rx="1" fill="#f43f5e" filter="url(#glow)"/>
    <!-- Price per unit indicator lights -->
    <circle cx="103" cy="103" r="1.5" fill="#10b981"/>
    <circle cx="110" cy="103" r="1.5" fill="#10b981"/>

    <!-- Keypad Panel -->
    <rect x="97" y="118" width="46" height="48" rx="4" fill="#334155"/>
    <!-- Buttons Grid -->
    <rect x="103" y="124" width="10" height="8" rx="2" fill="#64748b"/>
    <rect x="115" y="124" width="10" height="8" rx="2" fill="#64748b"/>
    <rect x="127" y="124" width="10" height="8" rx="2" fill="#64748b"/>
    
    <rect x="103" y="135" width="10" height="8" rx="2" fill="#64748b"/>
    <rect x="115" y="135" width="10" height="8" rx="2" fill="#64748b"/>
    <rect x="127" y="135" width="10" height="8" rx="2" fill="#64748b"/>

    <rect x="103" y="146" width="10" height="8" rx="2" fill="#64748b"/>
    <rect x="115" y="146" width="10" height="8" rx="2" fill="#64748b"/>
    <rect x="127" y="146" width="10" height="8" rx="2" fill="#f59e0b"/> <!-- Enter / Action button -->
  </g>

  <!-- HOSE AND NOZZLE -->
  <!-- Nozzle Holster Slot (Left Side) -->
  <path d="M 75 100 L 85 105 L 85 125 L 75 120 Z" fill="#94a3b8"/>

  <!-- Flexible Hose Curve -->
  <path d="M 80 110 C 50 110 30 150 50 180 C 65 200 95 195 110 170" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  <path d="M 80 110 C 50 110 30 150 50 180 C 65 200 95 195 110 170" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>

  <!-- Fuel Nozzle (Dynamic active element spraying energy/fuel) -->
  <g transform="translate(100, 155) rotate(-35)" filter="url(#shadow)">
    <!-- Nozzle Body -->
    <path d="M 0 0 L 25 -5 L 35 5 L 20 15 Z" fill="url(#chromeGrad)"/>
    <!-- Handle & Trigger -->
    <path d="M 5 2 L 15 2 L 12 18 L 2 12 Z" fill="#1e293b"/>
    <path d="M 10 8 L 18 12 L 14 16 L 8 12 Z" fill="#ef4444"/> <!-- Red trigger -->
    <!-- Spout (Tip) -->
    <path d="M 25 -5 L 38 -8 L 35 5 Z" fill="#cbd5e1"/>
  </g>

  <!-- ACTION VIBE: Energetic Fuel Splash / Droplets representing "Xăng" (Fuel) -->
  <g filter="url(#glow)">
    <!-- Flow Stream Arcs -->
    <path d="M 135 150 C 150 130 180 140 195 170" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 138 155 C 153 138 178 145 190 170" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Dynamic Fuel Droplets -->
    <path d="M 195 165 C 195 165 202 172 202 176 C 202 180 198 183 195 183 C 192 183 188 180 188 176 C 188 172 195 165 195 165 Z" fill="#38bdf8"/>
    <circle cx="170" cy="145" r="4" fill="#38bdf8"/>
    <circle cx="155" cy="138" r="2.5" fill="#7dd3fc"/>
    <circle cx="182" cy="158" r="3" fill="#bae6fd"/>
    <circle cx="208" cy="180" r="2" fill="#38bdf8"/>
    <circle cx="145" cy="132" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- FOREGROUND ACCENTS & ENVIRONMENT -->
  <!-- Warning / Safety Stripe Base Detail -->
  <g opacity="0.8">
    <rect x="85" y="175" width="70" height="5" fill="#1e293b"/>
    <path d="M 90 175 L 95 180 L 100 175 L 105 180 L 110 175 L 115 180 L 120 175 L 125 180 L 130 175 L 135 180 L 140 175 L 145 180 L 150 175" stroke="#fbbf24" stroke-width="3" fill="none"/>
  </g>

  <!-- Ambient Sparkles / Illustrative Polish -->
  <path d="M 45 70 L 48 78 L 56 81 L 48 84 L 45 92 L 42 84 L 34 81 L 42 78 Z" fill="#fbbf24" opacity="0.8" filter="url(#glow)"/>
  <path d="M 195 75 L 197 80 L 202 82 L 197 84 L 195 89 L 193 84 L 188 82 L 193 80 Z" fill="#38bdf8" opacity="0.7" filter="url(#glow)"/>
  <circle cx="190" cy="110" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="40" cy="130" r="3" fill="#38bdf8" opacity="0.5"/>
</svg>