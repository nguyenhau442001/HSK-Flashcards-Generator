<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Office/Meeting Room -->
  <rect x="40" y="60" width="160" height="100" rx="8" fill="#334155" opacity="0.4"/>
  <circle cx="180" cy="80" r="15" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Table -->
  <path d="M50 160 L190 160 L180 185 L60 185 Z" fill="#475569"/>
  
  <!-- Main Character: Organizing a meeting -->
  <!-- Arms/Hands -->
  <path d="M90 120 C 80 110, 70 130, 80 140" stroke="#fb923c" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M150 120 C 160 110, 170 130, 160 140" stroke="#fb923c" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Body -->
  <ellipse cx="120" cy="140" rx="30" ry="40" fill="#38bdf8"/>
  
  <!-- Head -->
  <circle cx="120" cy="90" r="20" fill="#fde68a"/>
  <path d="M112 85 Q115 82 118 85 M122 85 Q125 82 128 85" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M115 95 Q120 98 125 95" stroke="#ec4899" stroke-width="2" fill="none"/>
  
  <!-- Props: Organizing items on table -->
  <rect x="70" y="150" width="20" height="5" fill="#10b981"/>
  <rect x="100" y="155" width="25" height="5" fill="#fbbf24"/>
  <rect x="140" y="150" width="20" height="5" fill="#10b981"/>
  
  <!-- Decorative Action Lines/Focus -->
  <circle cx="120" cy="120" r="45" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.5"/>
  <path d="M120 70 L120 60 M120 170 L120 180 M170 120 L180 120 M70 120 L60 120" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>