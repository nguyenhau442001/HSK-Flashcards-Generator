<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Textbook Cover Gradient (Vibrant Teal/Cyan) -->
    <linearGradient id="book-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Textbook Pages Gradient -->
    <linearGradient id="book-pages" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Mug Gradient -->
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting from Desk Lamp -->
  <circle cx="180" cy="50" r="120" fill="url(#lamp-glow)"/>

  <!-- Background Environment & Desk Surface -->
  <!-- Back Wall Details / Bookshelf hint -->
  <path d="M 0 140 L 240 140" stroke="#334155" stroke-width="2" opacity="0.4"/>
  <rect x="30" y="80" width="18" height="50" rx="3" fill="#475569" opacity="0.5"/>
  <rect x="52" y="70" width="14" height="60" rx="3" fill="#0d9488" opacity="0.6"/>
  <rect x="70" y="85" width="22" height="45" rx="3" fill="#d97706" opacity="0.6"/>

  <!-- Main Desk Surface -->
  <path d="M 0 160 Q 120 150 240 160 L 240 240 L 0 240 Z" fill="url(#desk-grad)"/>
  <!-- Desk Edge Highlight -->
  <path d="M 0 160 Q 120 150 240 160" stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Secondary Prop: Coffee/Tea Mug on the Right -->
  <g transform="translate(180, 155)">
    <!-- Steam -->
    <path d="M 10 -15 Q 15 -25 10 -35" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M 22 -18 Q 18 -28 22 -38" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- Mug Body -->
    <rect x="5" y="-5" width="24" height="28" rx="4" fill="url(#mug-grad)"/>
    <!-- Mug Handle -->
    <path d="M 5 2 C -2 2 -2 18 5 18" stroke="#e11d48" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Mug Rim -->
    <ellipse cx="17" cy="-5" rx="12" ry="3" fill="#fb7185"/>
  </g>

  <!-- Secondary Prop: Highlighters and Pen -->
  <g transform="translate(45, 165) rotate(-15)">
    <!-- Orange Highlighter -->
    <rect x="0" y="0" width="8" height="45" rx="3" fill="#fb923c"/>
    <rect x="1" y="-5" width="6" height="5" rx="1" fill="#ea580c"/>
    <!-- Yellow Highlighter -->
    <rect x="12" y="-10" width="8" height="50" rx="3" fill="#facc15"/>
    <rect x="13" y="-15" width="6" height="5" rx="1" fill="#ca8a04"/>
  </g>

  <!-- MAIN SUBJECT: Comprehensive Textbook ("教材" - Open Teaching Material) -->
  <g transform="translate(60, 100)">
    <!-- Textbook Drop Shadow -->
    <path d="M -20 75 Q 60 95 140 75 L 145 85 Q 60 105 -25 85 Z" fill="#020617" opacity="0.6"/>

    <!-- Left Page -->
    <path d="M -15 70 C -15 70 50 60 60 62 L 60 20 C 50 18 -15 28 -15 28 Z" fill="url(#book-pages)"/>
    <!-- Left Page Content (Abstract illustrations & lines representing lessons) -->
    <line x1="-5" y1="38" x2="35" y2="35" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-5" y1="46" x2="45" y2="43" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-5" y1="54" x2="25" y2="51" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Mini diagram on left page -->
    <circle cx="15" cy="45" r="6" fill="#38bdf8" opacity="0.3"/>

    <!-- Right Page -->
    <path d="M 65 62 C 75 60 140 70 140 70 L 140 28 C 140 28 75 18 65 20 Z" fill="url(#book-pages)"/>
    <!-- Right Page Content -->
    <line x1="80" y1="35" x2="125" y2="38" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="43" x2="115" y2="46" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="51" x2="130" y2="54" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Colorful educational chart/graph on right page -->
    <rect x="80" y="28" width="12" height="15" rx="2" fill="#f43f5e" opacity="0.5"/>
    <rect x="96" y="24" width="12" height="19" rx="2" fill="#10b981" opacity="0.5"/>
    <rect x="112" y="20" width="12" height="23" rx="2" fill="#fbbf24" opacity="0.5"/>

    <!-- Central Book Binding / Spine depth -->
    <path d="M 60 20 L 65 20 L 65 62 L 60 62 Z" fill="#94a3b8"/>

    <!-- Hard Covers (Visible underneath) -->
    <!-- Left Cover -->
    <path d="M -18 73 C -18 73 50 63 60 65 L 60 70 C 50 68 -18 78 -18 78 Z" fill="#0284c7"/>
    <!-- Right Cover -->
    <path d="M 65 65 C 75 63 143 73 143 73 L 143 78 C 143 78 75 68 65 70 Z" fill="#0284c7"/>

    <!-- Active Bookmark Ribbon hanging out -->
    <path d="M 60 62 L 55 90 L 60 95 L 65 90 Z" fill="#f43f5e"/>

    <!-- Floating Interactive Learning Sparkles / Accents above the book -->
    <g transform="translate(10, -5)">
      <!-- Star 1 -->
      <path d="M 15 0 L 18 8 L 26 11 L 18 14 L 15 22 L 12 14 L 4 11 L 12 8 Z" fill="#fbbf24" transform="scale(0.6)"/>
    </g>
    <g transform="translate(85, 2)">
      <!-- Star 2 -->
      <path d="M 15 0 L 18 8 L 26 11 L 18 14 L 15 22 L 12 14 L 4 11 L 12 8 Z" fill="#38bdf8" transform="scale(0.5)"/>
    </g>
    <g transform="translate(45, -15)">
      <!-- Glowing Knowledge Orb -->
      <circle cx="10" cy="10" r="8" fill="#10b981" opacity="0.8"/>
      <circle cx="10" cy="10" r="4" fill="#a7f3d0"/>
    </g>
  </g>
</svg>