<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for Courtroom Interior -->
    <radialGradient id="roomGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Wood Textures & Fills -->
    <linearGradient id="woodDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="woodLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Gold/Brass Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Interior Backdrop -->
  <rect x="20" y="20" width="200" height="200" rx="16" fill="url(#roomGlow)" />

  <!-- Architectural Details: Windows/Pillars in Background -->
  <g opacity="0.3">
    <!-- Pillar Left -->
    <rect x="35" y="40" width="12" height="150" fill="#475569" rx="2"/>
    <rect x="33" y="35" width="16" height="8" fill="#64748b" rx="2"/>
    <!-- Pillar Right -->
    <rect x="193" y="40" width="12" height="150" fill="#475569" rx="2"/>
    <rect x="191" y="35" width="16" height="8" fill="#64748b" rx="2"/>
    <!-- Arch Back Wall -->
    <path d="M 60 70 Q 120 40 180 70 L 180 140 L 60 140 Z" fill="#1e293b" opacity="0.6"/>
  </g>

  <!-- Scales of Justice (Hanging Symbol above judge) -->
  <g filter="id('subtleShadow')" transform="translate(0, -5)">
    <!-- Hanging cord -->
    <line x1="120" y1="45" x2="120" y2="70" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <!-- Balance beam -->
    <path d="M 95 70 L 145 70 L 120 65 Z" fill="url(#goldGrad)"/>
    <circle cx="120" cy="67" r="3" fill="#b45309"/>
    <!-- Left chain & pan -->
    <line x1="95" y1="70" x2="85" y2="90" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="95" y1="70" x2="105" y2="90" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M 80 90 Q 95 100 110 90 Z" fill="url(#goldGrad)"/>
    <!-- Right chain & pan -->
    <line x1="145" y1="70" x2="135" y2="90" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="145" y1="70" x2="155" y2="90" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M 130 90 Q 145 100 160 90 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Judge's Elevated Platform (Daïs) -->
  <g filter="url(#shadow)">
    <!-- Base step -->
    <rect x="60" y="170" width="120" height="12" fill="#334155" rx="2"/>
    <rect x="65" y="162" width="110" height="8" fill="#475569" rx="2"/>
    <!-- Main Bench Structure -->
    <path d="M 75 115 L 165 115 L 175 162 L 65 162 Z" fill="url(#woodDark)"/>
    <!-- Bench Front Panel Trim -->
    <path d="M 80 120 L 160 120 L 168 158 L 72 158 Z" fill="url(#woodLight)"/>
    <!-- Inner panel design -->
    <path d="M 90 126 L 150 126 L 154 152 L 86 152 Z" fill="#78350f" opacity="0.6"/>
    <!-- Gold emblem shield on bench -->
    <path d="M 120 130 C 125 130 128 133 128 138 C 128 145 120 150 120 150 C 120 150 112 145 112 138 C 112 133 115 130 120 130 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Judge's Gavel & Sound Block (Foreground Action Prop) -->
  <g filter="url(#shadow)" transform="translate(140, 142)">
    <!-- Wooden Sound Block -->
    <ellipse cx="25" cy="22" rx="16" ry="6" fill="#78350f"/>
    <ellipse cx="25" cy="20" rx="15" ry="5" fill="#d97706"/>
    <rect x="13" y="18" width="24" height="4" fill="#b45309"/>

    <!-- Dynamic Gavel striking down -->
    <g transform="rotate(-35 25 15)">
      <!-- Gavel Handle -->
      <rect x="23" y="-5" width="4" height="24" rx="2" fill="url(#woodDark)"/>
      <!-- Gavel Head -->
      <rect x="13" y="-12" width="24" height="10" rx="3" fill="url(#woodLight)"/>
      <rect x="11" y="-14" width="28" height="3" rx="1.5" fill="#fbbf24"/>
    </g>
    
    <!-- Impact Spark/Action Lines -->
    <path d="M 10 25 L 3 28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 12 15 L 4 13" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="8" cy="21" r="2" fill="#38bdf8"/>
  </g>

  <!-- Law Books Stack (Left side of bench) -->
  <g filter="url(#subtleShadow)" transform="translate(48, 138)">
    <!-- Book 3 (Bottom) -->
    <rect x="0" y="16" width="30" height="8" rx="2" fill="#1e3a8a"/>
    <rect x="2" y="18" width="26" height="4" fill="#3b82f6"/>
    <!-- Book 2 (Middle) -->
    <rect x="-3" y="9" width="32" height="8" rx="2" fill="#b91c1c"/>
    <rect x="-1" y="11" width="28" height="4" fill="#ef4444"/>
    <!-- Book 1 (Top) -->
    <rect x="2" y="2" width="26" height="8" rx="2" fill="#047857"/>
    <rect x="4" y="4" width="22" height="4" fill="#10b981"/>
    <!-- Gold leaf spine accents -->
    <line x1="8" y1="6" x2="14" y2="6" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="3" y1="13" x2="9" y2="13" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Microphone on Bench -->
  <g transform="translate(95, 120)">
    <rect x="-1" y="6" width="2" height="10" fill="#64748b"/>
    <path d="M -4 6 C -4 2 4 2 4 6 Z" fill="#94a3b8"/>
    <ellipse cx="0" cy="5" rx="3" ry="4" fill="#cbd5e1"/>
  </g>

  <!-- Decorative Plants / Legal Interior Accents -->
  <!-- Left Plant -->
  <g transform="translate(22, 140)">
    <path d="M 8 30 C 8 18 18 10 20 0 C 12 10 2 18 2 30 Z" fill="#059669"/>
    <path d="M 12 30 C 12 15 25 12 32 4 C 22 10 10 20 12 30 Z" fill="#10b981"/>
    <rect x="4" y="26" width="16" height="18" rx="4" fill="#b45309" filter="url(#subtleShadow)"/>
  </g>

  <!-- Right Plant -->
  <g transform="translate(196, 140)">
    <path d="M 12 30 C 12 18 2 10 0 0 C 8 10 18 18 18 30 Z" fill="#059669"/>
    <path d="M 8 30 C 8 15 -5 12 -12 4 C -2 10 10 20 8 30 Z" fill="#10b981"/>
    <rect x="0" y="26" width="16" height="18" rx="4" fill="#b45309" filter="url(#subtleShadow)"/>
  </g>

  <!-- Foreground Lighting & Vignette Overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.5"/>
</svg>