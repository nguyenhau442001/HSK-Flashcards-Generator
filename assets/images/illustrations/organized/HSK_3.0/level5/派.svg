<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Briefcase Gradient -->
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Document Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Stamp Red Gradient -->
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Spotlight -->
  <circle cx="120" cy="110" r="100" fill="url(#spotlight)"/>

  <!-- Back Wall Details (Office window / blinds suggesting departure/travel) -->
  <g opacity="0.15">
    <rect x="40" y="30" width="160" height="90" rx="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="40" y1="60" x2="200" y2="60" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="40" y1="90" x2="200" y2="90" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="100" y1="30" x2="100" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="160" y1="30" x2="160" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- World Map Accent on Wall -->
  <path d="M60,50 Q75,40 90,55 T120,45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <circle cx="150" cy="55" r="3" fill="#38bdf8" opacity="0.4"/>
  <circle cx="80" cy="70" r="2" fill="#38bdf8" opacity="0.4"/>
  <path d="M140,75 Q160,65 180,80" fill="none" stroke="#38bdf8" stroke-dasharray="2,3" stroke-width="1.5" opacity="0.4"/>

  <!-- Desk Surface -->
  <path d="M10,170 L230,170 L240,220 L0,220 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Prop 1: Globe / Travel Marker (Context of Mission/Dispatch) -->
  <g transform="translate(45, 115)">
    <circle cx="20" cy="25" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <path d="M10,18 C15,25 25,25 30,18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <path d="M12,30 C18,28 22,32 28,30" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="20" cy="43" rx="10" ry="4" fill="#334155"/>
    <path d="M20,25 L20,43" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Prop 2: Open Briefcase (The Dispatch Gear) -->
  <g transform="translate(145, 120)">
    <!-- Case Base -->
    <rect x="0" y="15" width="60" height="35" rx="4" fill="url(#caseGrad)" filter="url(#shadow)"/>
    <!-- Case Interior/Lining -->
    <rect x="4" y="19" width="52" height="27" rx="2" fill="#7c2d12"/>
    <!-- Papers inside briefcase -->
    <rect x="10" y="10" width="18" height="15" rx="1" fill="#f1f5f9" transform="rotate(-10 10 10)"/>
    <rect x="30" y="8" width="20" height="18" rx="1" fill="#e2e8f0" transform="rotate(5 30 8)"/>
    <!-- Metallic Latches -->
    <rect x="18" y="12" width="6" height="4" rx="1" fill="#cbd5e1"/>
    <rect x="36" y="12" width="6" height="4" rx="1" fill="#cbd5e1"/>
    <!-- Handle -->
    <path d="M20,15 C20,5 40,5 40,15" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: Official Assignment / Mission Document (Representing 'Cử, phái' - Deployment Order) -->
  <g transform="translate(75, 90)" filter="url(#shadow)">
    <!-- Shadow/Back Document Layer -->
    <rect x="10" y="10" width="70" height="90" rx="4" fill="#64748b" transform="rotate(8 45 55)"/>

    <!-- Main Front Document -->
    <rect x="5" y="5" width="70" height="90" rx="4" fill="url(#paperGrad)"/>
    
    <!-- Document Header Accent Bar -->
    <rect x="12" y="12" width="30" height="6" rx="3" fill="#38bdf8"/>
    
    <!-- Text Line placeholders -->
    <line x1="12" y1="28" x2="60" y2="28" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="38" x2="50" y2="38" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="48" x2="55" y2="48" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Mini avatar placeholder on document -->
    <circle cx="22" cy="70" r="8" fill="#cbd5e1"/>
    <path d="M12,85 C12,78 32,78 32,85" fill="#cbd5e1"/>
    <line x1="36" y1="68" x2="60" y2="68" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="78" x2="52" y2="78" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Official Red Approval Stamp (Action of Dispatching/Assigning) -->
    <g transform="translate(38, 48) rotate(-12)">
      <circle cx="18" cy="18" r="16" fill="none" stroke="url(#stampGrad)" stroke-width="3" stroke-dasharray="4,2"/>
      <circle cx="18" cy="18" r="12" fill="none" stroke="url(#stampGrad)" stroke-width="1.5"/>
      <!-- Star in stamp -->
      <polygon points="18,9 20,14 25,14 21,17 22,22 18,19 14,22 15,17 11,14 16,14" fill="url(#stampGrad)"/>
    </g>
  </g>

  <!-- Fountain Pen / Official Seal Pen (Active Action Tool) -->
  <g transform="translate(130, 75) rotate(35)" filter="url(#shadow)">
    <!-- Pen Cap -->
    <rect x="0" y="0" width="8" height="25" rx="2" fill="#1e293b"/>
    <rect x="2" y="-4" width="4" height="6" rx="1" fill="#fbbf24"/>
    <!-- Pen Body -->
    <rect x="0" y="27" width="8" height="50" rx="1" fill="#334155"/>
    <!-- Gold Trim -->
    <rect x="0" y="25" width="8" height="2" fill="#fbbf24"/>
    <!-- Pen Nib -->
    <path d="M0,77 L4,88 L8,77 Z" fill="#fbbf24"/>
    <line x1="4" y1="77" x2="4" y2="85" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- Dynamic Accent Sparks / Action FX (Highlighting the "Dispatch/Mission" concept) -->
  <g transform="translate(0, 0)">
    <!-- Spark 1 -->
    <path d="M190,40 Q195,30 205,35 Q195,40 190,50 Q185,40 175,35 Q185,30 190,40 Z" fill="#fbbf24" filter="url(#glow)"/>
    <!-- Spark 2 -->
    <path d="M40,70 Q43,62 50,65 Q43,68 40,75 Q37,68 30,65 Q37,62 40,70 Z" fill="#38bdf8" filter="url(#glow)"/>
    <!-- Small floating particles -->
    <circle cx="170" cy="100" r="3" fill="#fb923c" opacity="0.8"/>
    <circle cx="65" cy="130" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="115" cy="45" r="2.5" fill="#fbbf24" opacity="0.9"/>
  </g>

</svg>