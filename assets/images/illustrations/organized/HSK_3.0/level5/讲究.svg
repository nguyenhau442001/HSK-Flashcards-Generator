<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed container background -->
  <rect width="240" height="240" rx="24" fill="#1e293b"/>

  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>

  <!-- Wall -->
  <rect x="0" y="0" width="240" height="180" fill="#334155"/>

  <!-- Mirror -->
  <rect x="120" y="30" width="90" height="140" rx="8" fill="#fbbf24"/> <!-- Mirror frame -->
  <rect x="125" y="35" width="80" height="130" rx="6" fill="#64748b"/> <!-- Mirror glass -->

  <!-- Person (stylized, facing slightly towards mirror, adjusting tie) -->
  <!-- Body (suit jacket) -->
  <path d="M 60 180 L 60 110 C 60 100 80 100 80 110 L 80 180 Z" fill="#1e293b"/>
  <!-- Shirt visible beneath suit -->
  <path d="M 65 115 C 65 108 75 108 75 115 L 75 180 L 65 180 Z" fill="#38bdf8"/>

  <!-- Head -->
  <circle cx="70" cy="90" r="15" fill="#fb923c"/>

  <!-- Arms and Hands adjusting tie -->
  <!-- Left arm (upper) -->
  <path d="M 60 110 Q 55 100 60 95 L 65 95 L 65 110 Z" fill="#1e293b"/>
  <!-- Left arm (forearm and hand) -->
  <path d="M 65 95 Q 60 85 68 85 L 70 90 L 65 95 Z" fill="#fb923c"/>

  <!-- Right arm (upper) -->
  <path d="M 80 110 Q 85 100 80 95 L 75 95 L 75 110 Z" fill="#1e293b"/>
  <!-- Right arm (forearm and hand) -->
  <path d="M 75 95 Q 80 85 72 85 L 70 90 L 75 95 Z" fill="#fb923c"/>

  <!-- Tie knot being adjusted -->
  <path d="M 70 95 L 68 100 L 72 100 L 70 95 Z" fill="#f59e0b"/>

  <!-- Reflection in mirror (simplified) -->
  <path d="M 145 160 L 145 130 C 145 120 155 120 155 130 L 155 160 Z" fill="#1e293b" opacity="0.4"/> <!-- Reflected suit -->
  <path d="M 148 125 C 148 118 152 118 152 125 L 152 160 L 148 160 Z" fill="#38bdf8" opacity="0.4"/> <!-- Reflected shirt -->
  <circle cx="150" cy="110" r="10" fill="#fb923c" opacity="0.4"/> <!-- Reflected head -->
  <!-- Simplified reflected arms/hands area -->
  <path d="M 145 120 Q 140 105 150 100 Q 160 105 155 120 Z" fill="#fb923c" opacity="0.3"/> <!-- General arm/hand shape -->
  <path d="M 150 115 L 148 118 L 152 118 L 150 115 Z" fill="#f59e0b" opacity="0.4"/> <!-- Reflected tie -->

  <!-- Valet stand / clothes hanger -->
  <rect x="20" y="100" width="10" height="80" fill="#64748b"/> <!-- Vertical pole -->
  <rect x="10" y="95" width="30" height="10" fill="#64748b"/> <!-- Horizontal bar -->
  <path d="M 15 105 L 10 105 L 5 115 L 10 125 L 15 125 Z" fill="#1e293b"/> <!-- Hanging jacket sleeve 1 -->
  <path d="M 25 105 L 30 105 L 35 115 L 30 125 L 25 125 Z" fill="#1e293b"/> <!-- Hanging jacket sleeve 2 -->
  <rect x="10" y="175" width="30" height="5" fill="#64748b"/> <!-- Base of valet stand -->

  <!-- Shoes on the floor -->
  <path d="M 100 180 L 110 180 L 115 190 L 105 190 Z" fill="#f59e0b"/> <!-- Polished shoe 1 -->
  <path d="M 105 180 L 115 180 L 120 190 L 110 190 Z" fill="#f59e0b"/> <!-- Polished shoe 2 (slightly overlapping) -->

  <!-- Small details on shelf next to mirror -->
  <rect x="110" y="170" width="100" height="10" fill="#64748b"/> <!-- Shelf -->
  <circle cx="120" cy="165" r="4" fill="#f59e0b"/> <!-- Cufflink/watch -->
  <circle cx="135" cy="165" r="4" fill="#f59e0b"/> <!-- Another cufflink/watch -->
  <rect x="150" y="163" width="10" height="5" fill="#fb923c"/> <!-- Comb -->
</svg>