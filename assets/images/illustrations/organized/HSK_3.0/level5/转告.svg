<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Character 1 (The Messenger) -->
  <g transform="translate(40, 60)">
    <circle cx="30" cy="30" r="25" fill="#fbbf24"/>
    <path d="M15 45 Q30 55 45 45" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="20" cy="25" r="3" fill="#0f172a"/>
    <circle cx="40" cy="25" r="3" fill="#0f172a"/>
    <path d="M25 80 L25 140 M35 80 L35 140" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- The Action: Passing a Note -->
  <rect x="90" y="110" width="60" height="40" rx="4" fill="#f8fafc"/>
  <line x1="100" y1="120" x2="140" y2="120" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="130" x2="140" y2="130" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Character 2 (The Receiver) -->
  <g transform="translate(150, 60)">
    <circle cx="30" cy="30" r="25" fill="#38bdf8"/>
    <path d="M15 45 Q30 55 45 45" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="20" cy="25" r="3" fill="#0f172a"/>
    <circle cx="40" cy="25" r="3" fill="#0f172a"/>
    <path d="M25 80 L25 140 M35 80 L35 140" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Decorative Elements -->
  <circle cx="180" cy="40" r="6" fill="#ec4899" opacity="0.6"/>
  <circle cx="60" cy="180" r="4" fill="#10b981" opacity="0.6"/>
  <path d="M190 180 L210 180 M200 170 L200 190" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
</svg>