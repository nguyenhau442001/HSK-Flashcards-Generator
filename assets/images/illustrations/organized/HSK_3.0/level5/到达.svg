<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Train Station Platform -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <rect x="20" y="190" width="200" height="10" rx="2" fill="#475569"/>
  <circle cx="40" cy="195" r="3" fill="#fbbf24"/>
  <circle cx="80" cy="195" r="3" fill="#fbbf24"/>
  <circle cx="120" cy="195" r="3" fill="#fbbf24"/>
  <circle cx="160" cy="195" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="195" r="3" fill="#fbbf24"/>

  <!-- Character: Traveler reaching destination -->
  <g transform="translate(120, 120)">
    <!-- Suitcase -->
    <rect x="20" y="20" width="35" height="45" rx="4" fill="#ec4899"/>
    <rect x="25" y="15" width="25" height="5" rx="1" fill="#fb923c"/>
    <path d="M30 15 L30 10 L40 10 L40 15" stroke="#fb923c" stroke-width="3" fill="none"/>
    
    <!-- Body -->
    <path d="M-20 20 C-20 0, 0 0, 0 20 L0 80" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-10" r="25" fill="#fde68a"/>
    
    <!-- Face: Expressive relief/joy -->
    <path d="M-10 -15 L-5 -15 M5 -15 L10 -15" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8 5 Q0 12 8 5" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Arms: Reaching out -->
    <path d="M0 10 L-30 40" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <path d="M0 10 L30 40" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Background elements: Station clock/signage -->
  <circle cx="180" cy="60" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <line x1="180" y1="60" x2="180" y2="45" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="60" x2="192" y2="60" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ambient light -->
  <circle cx="60" cy="50" r="40" fill="#f59e0b" opacity="0.05"/>
</svg>