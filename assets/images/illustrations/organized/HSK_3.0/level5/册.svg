<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Book Stack (Representing '册') -->
  <!-- Bottom Book -->
  <rect x="60" y="170" width="120" height="20" rx="2" fill="#fb923c"/>
  <rect x="62" y="172" width="116" height="16" rx="1" fill="#ea580c"/>
  
  <!-- Middle Book -->
  <rect x="65" y="150" width="110" height="20" rx="2" fill="#38bdf8"/>
  <rect x="67" y="152" width="106" height="16" rx="1" fill="#0284c7"/>
  
  <!-- Top Book -->
  <rect x="70" y="130" width="100" height="20" rx="2" fill="#10b981"/>
  <rect x="72" y="132" width="96" height="16" rx="1" fill="#059669"/>
  
  <!-- Decorative Elements -->
  <circle cx="40" cy="80" r="15" fill="#f59e0b" opacity="0.2"/>
  <circle cx="200" cy="50" r="25" fill="#ec4899" opacity="0.15"/>
  
  <!-- Ambient Light/Glow -->
  <path d="M120 120 L180 80 L180 160 Z" fill="#fbbf24" opacity="0.05"/>
  
  <!-- Pen/Prop -->
  <rect x="185" y="140" width="8" height="40" rx="4" fill="#94a3b8" transform="rotate(20 189 160)"/>
  <rect x="187" y="135" width="4" height="10" rx="2" fill="#f8fafc"/>
</svg>