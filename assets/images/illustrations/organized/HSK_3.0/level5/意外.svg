<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Spilled Coffee/Liquid Splash -->
  <path d="M60 180 C80 150, 120 150, 140 180 S180 200, 200 180" fill="#fb923c" opacity="0.8"/>
  <circle cx="130" cy="170" r="15" fill="#fb923c"/>
  <circle cx="150" cy="165" r="8" fill="#fb923c"/>
  
  <!-- Toppled Cup -->
  <path d="M100 170 L140 170 L135 195 L105 195 Z" fill="#f59e0b"/>
  <ellipse cx="120" cy="170" rx="20" ry="6" fill="#fbbf24"/>
  <path d="M140 175 L155 165 L155 180 L140 185 Z" fill="#d97706"/>
  
  <!-- Surprised Character (Upper Body) -->
  <g transform="translate(40, 60)">
    <!-- Arms -->
    <path d="M20 80 L50 60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 80 L70 60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="30" y="60" width="60" height="80" rx="10" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="40" r="30" fill="#fde68a"/>
    <!-- Eyes (Wide/Surprised) -->
    <circle cx="45" cy="35" r="4" fill="#0f172a"/>
    <circle cx="75" cy="35" r="4" fill="#0f172a"/>
    <!-- Mouth (O-shape) -->
    <ellipse cx="60" cy="50" rx="6" ry="8" fill="#0f172a"/>
  </g>
  
  <!-- Floating droplets/action lines -->
  <circle cx="160" cy="140" r="3" fill="#38bdf8"/>
  <circle cx="170" cy="130" r="2" fill="#38bdf8"/>
  <path d="M180 120 L190 110" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
</svg>