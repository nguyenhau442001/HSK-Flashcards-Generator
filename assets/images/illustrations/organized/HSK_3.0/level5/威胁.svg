<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Shadow of the threat -->
  <ellipse cx="120" cy="180" rx="80" ry="20" fill="#0f172a" opacity="0.4"/>
  
  <!-- The Threat: A large, looming, jagged rock/boulder falling -->
  <path d="M60 40 L180 30 L210 120 L150 180 L70 160 L40 90 Z" fill="#475569" stroke="#94a3b8" stroke-width="4" stroke-linejoin="round"/>
  <path d="M70 50 L100 60 L90 90 L60 80 Z" fill="#334155"/>
  <path d="M140 70 L170 80 L160 110 L130 100 Z" fill="#334155"/>
  
  <!-- Impact/Warning effect -->
  <path d="M120 150 L135 190 L105 190 Z" fill="#fb923c" opacity="0.8"/>
  <circle cx="120" cy="195" r="4" fill="#fb923c"/>
  
  <!-- Environment context: Distant city skyline silhouette -->
  <rect x="20" y="190" width="40" height="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="70" y="180" width="30" height="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="180" y="185" width="40" height="35" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Atmospheric tension lines -->
  <path d="M30 30 L60 60" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M210 40 L180 70" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M40 150 L70 120" stroke="#ec4899" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>