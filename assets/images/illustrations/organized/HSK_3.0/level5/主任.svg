<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="140" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- The 'Chủ nhiệm' (Department Head) Figure -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-30 80 Q0 60 30 80 L20 130 L-20 130 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="25" fill="#fde68a"/>
    <!-- Glasses -->
    <rect x="-15" y="25" width="12" height="8" rx="2" fill="#0f172a"/>
    <rect x="3" y="25" width="12" height="8" rx="2" fill="#0f172a"/>
    <!-- Tie -->
    <path d="M-5 60 L0 80 L5 60 Z" fill="#ec4899"/>
  </g>

  <!-- Context Props: Files and Laptop -->
  <rect x="30" y="160" width="50" height="40" rx="4" fill="#fbbf24"/>
  <rect x="35" y="165" width="40" height="5" rx="1" fill="#1e293b"/>
  <rect x="35" y="175" width="40" height="5" rx="1" fill="#1e293b"/>
  <rect x="35" y="185" width="30" height="5" rx="1" fill="#1e293b"/>
  
  <rect x="150" y="150" width="60" height="40" rx="4" fill="#38bdf8"/>
  <rect x="155" y="155" width="50" height="30" rx="2" fill="#0f172a"/>
  <rect x="170" y="190" width="20" height="5" rx="1" fill="#94a3b8"/>
  
  <!-- Coffee Mug -->
  <circle cx="110" cy="170" r="15" fill="#f1f5f9"/>
  <path d="M125 165 Q135 165 135 175 Q135 185 125 185" fill="none" stroke="#f1f5f9" stroke-width="4"/>
  
  <!-- Ambient light accent -->
  <circle cx="200" cy="40" r="30" fill="#fb923c" opacity="0.1"/>
</svg>