<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wood Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Tablet Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting / Glow -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="170" cy="140" r="50" fill="#f59e0b" opacity="0.06" filter="url(#glow)"/>

  <!-- Background Environment: Wooden Desk / Surface -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#deskGrad)" opacity="0.9"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2"/>

  <!-- Props: Coffee Mug in Background -->
  <g transform="translate(35, 135)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="22" height="26" rx="4" fill="#cbd5e1"/>
    <path d="M 22 5 C 28 5, 28 20, 22 20" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <ellipse cx="11" cy="0" rx="11" ry="3" fill="#94a3b8"/>
    <ellipse cx="11" cy="2" rx="8" ry="1.5" fill="#78350f"/>
  </g>

  <!-- Props: Stack of Reference Books -->
  <g transform="translate(15, 142)" filter="url(#dropShadow)">
    <polygon points="0,20 40,10 65,22 25,32" fill="#3b82f6"/>
    <polygon points="0,25 40,15 40,23 0,33" fill="#1d4ed8"/>
    <polygon points="0,10 40,0 65,12 25,22" fill="#ec4899"/>
    <polygon points="0,15 40,5 40,12 0,22" fill="#be185d"/>
  </g>

  <!-- MAIN SUBJECT: Homework Assignment Sheet (The evaluated work) -->
  <g transform="translate(55, 65) rotate(-6)" filter="url(#dropShadow)">
    <!-- Paper base -->
    <rect width="100" height="115" rx="6" fill="url(#paperGrad)"/>
    
    <!-- Red Accent Header / Margin -->
    <line x1="15" y1="0" x2="15" y2="115" stroke="#fca5a5" stroke-width="2" opacity="0.5"/>
    
    <!-- Simulated text lines -->
    <line x1="25" y1="20" x2="85" y2="20" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="35" x2="70" y2="35" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="50" x2="80" y2="50" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="65" x2="60" y2="65" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Graphs / Math curves drawn on paper -->
    <path d="M 25 95 Q 40 75, 55 90 T 85 80" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Teacher's Evaluation Marks (Red Pen Corrections & Score) -->
    <!-- Big Grade 'A' / '100' style badge or checkmark -->
    <circle cx="75" cy="40" r="18" fill="none" stroke="#ef4444" stroke-width="3.5" opacity="0.9"/>
    <!-- Checkmark inside or bold strokes -->
    <path d="M 68 40 L 73 45 L 83 33" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Star Sticker / Stamp for Excellent Evaluation -->
    <g transform="translate(30, 75) scale(0.7)">
      <polygon points="12,0 15,9 24,9 17,14 19,23 12,18 5,23 7,14 0,9 9,9" fill="#fbbf24" filter="url(#dropShadow)"/>
    </g>
    <!-- Second overlapping star -->
    <g transform="translate(45, 78) scale(0.5)">
      <polygon points="12,0 15,9 24,9 17,14 19,23 12,18 5,23 7,14 0,9 9,9" fill="#f59e0b"/>
    </g>
  </g>

  <!-- FOREGROUND SUBJECT: Modern Tablet / Digital Evaluation Screen -->
  <g transform="translate(100, 85)" filter="url(#dropShadow)">
    <!-- Tablet Body -->
    <rect width="115" height="85" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="6" y="6" width="103" height="73" rx="4" fill="url(#screenGrad)"/>

    <!-- UI Elements inside screen: Analytics & Evaluation Feedback -->
    <!-- Progress Bar / Rating Slider -->
    <rect x="18" y="18" width="50" height="6" rx="3" fill="#1e293b"/>
    <rect x="18" y="18" width="38" height="6" rx="3" fill="#10b981"/>
    
    <!-- Rating Stars on Screen -->
    <g transform="translate(18, 32) scale(0.45)">
      <polygon points="12,0 15,9 24,9 17,14 19,23 12,18 5,23 7,14 0,9 9,9" fill="#fbbf24"/>
      <polygon points="36,0 39,9 48,9 41,14 43,23 36,18 29,23 31,14 24,9 33,9" fill="#fbbf24"/>
      <polygon points="60,0 63,9 72,9 65,14 67,23 60,18 53,23 55,14 48,9 57,9" fill="#fbbf24"/>
      <polygon points="84,0 87,9 96,9 89,14 91,23 84,18 77,23 79,14 72,9 81,9" fill="#fbbf24"/>
      <polygon points="108,0 111,9 120,9 113,14 115,23 108,18 101,23 103,14 96,9 105,9" fill="#475569"/>
    </g>

    <!-- Mini Bar Chart (Teacher Feedback metrics) -->
    <rect x="18" y="52" width="10" height="18" rx="2" fill="#38bdf8"/>
    <rect x="32" y="44" width="10" height="26" rx="2" fill="#38bdf8"/>
    <rect x="46" y="38" width="10" height="32" rx="2" fill="#10b981"/>
    <rect x="60" y="48" width="10" height="22" rx="2" fill="#38bdf8"/>
    
    <!-- Teacher Avatar / Badge inside screen -->
    <circle cx="92" cy="45" r="14" fill="#6366f1"/>
    <!-- Simple vector face in avatar -->
    <circle cx="88" cy="42" r="2" fill="#ffffff"/>
    <circle cx="96" cy="42" r="2" fill="#ffffff"/>
    <path d="M 88 50 Q 92 54 96 50" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- INTERACTIVE ELEMENT: Floating Stylus / Pen making the evaluation marks -->
  <g transform="translate(135, 35) rotate(-35)" filter="url(#dropShadow)">
    <!-- Pen body -->
    <path d="M 0 0 L 8 0 L 12 70 L -4 70 Z" fill="#ec4899"/>
    <!-- Pen grip -->
    <rect x="-3" y="30" width="14" height="15" fill="#be185d"/>
    <!-- Gold ring accent -->
    <rect x="-3.5" y="27" width="15" height="3" fill="#fbbf24"/>
    <!-- Pen tip -->
    <path d="M 0 70 L 4 85 L 8 70 Z" fill="#f43f5e"/>
    <path d="M 2 85 L 4 88 L 6 85 Z" fill="#ffffff"/>
  </g>

  <!-- Sparkles / Action Accents (Highlighting the active process of evaluation) -->
  <!-- Sparkle top left -->
  <g transform="translate(50, 45)">
    <path d="M 0 8 Q 8 8, 8 0 Q 8 8, 16 8 Q 8 8, 8 16 Q 8 8, 0 8 Z" fill="#fbbf24"/>
  </g>
  
  <!-- Sparkle right -->
  <g transform="translate(200, 75) scale(0.7)">
    <path d="M 0 8 Q 8 8, 8 0 Q 8 8, 16 8 Q 8 8, 8 16 Q 8 8, 0 8 Z" fill="#38bdf8"/>
  </g>

  <!-- Sparkle bottom right -->
  <g transform="translate(180, 165) scale(0.9)">
    <path d="M 0 8 Q 8 8, 8 0 Q 8 8, 16 8 Q 8 8, 8 16 Q 8 8, 0 8 Z" fill="#10b981"/>
  </g>

</svg>