  <circle cx="115" cy="180" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="125" cy="200" r="2" fill="#fbbf24" opacity="0.5"/>
  
  <!-- Character silhouette squeezing through -->
