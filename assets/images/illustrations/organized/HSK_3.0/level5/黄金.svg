<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for Jewelry/Ambiance -->
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Rich Gold Chain Gradient -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    
    <linearGradient id="goldPendant" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Outfit Gradient -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Sparkle filter effect simulation via shapes -->
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Golden Light Burst -->
  <circle cx="120" cy="110" r="100" fill="url(#goldGlow)"/>

  <!-- Background Environment: Elegant room interior hint -->
  <!-- Window/Light frame -->
  <path d="M40 70 L90 40 L90 190 L40 160 Z" fill="#334155" opacity="0.15"/>
  <path d="M200 70 L150 40 L150 190 L200 160 Z" fill="#334155" opacity="0.15"/>
  <circle cx="120" cy="80" r="35" fill="#f59e0b" opacity="0.08"/>

  <!-- Sparkles in the air -->
  <g fill="#fde047" opacity="0.8">
    <path d="M70 60 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" transform="scale(0.8) translate(10, 10)"/>
    <path d="M170 80 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5 z"/>
    <path d="M150 140 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" transform="scale(0.6) translate(80, 20)"/>
    <circle cx="85" cy="120" r="1.5" fill="#fef08a"/>
    <circle cx="160" cy="65" r="2" fill="#fef08a"/>
  </g>

  <!-- CHARACTER -->
  <!-- Neck & Shoulders -->
  <path d="M95 155 C95 145 105 140 120 140 C135 140 145 145 145 155 L155 200 L85 200 Z" fill="url(#skinGrad)"/>

  <!-- Outfit / Shirt (Stylish V-neck to show necklace clearly) -->
  <path d="M60 215 C60 185 85 175 120 175 C155 175 180 185 180 215 Z" fill="url(#topGrad)"/>
  <path d="M95 175 L120 205 L145 175 Z" fill="#9d174d"/>

  <!-- Shoulders / Arms -->
  <path d="M60 215 C60 190 75 170 95 165 L85 215 Z" fill="#f43f5e"/>
  <path d="M180 215 C180 190 165 170 145 165 L155 215 Z" fill="#f43f5e"/>

  <!-- THE GOLDEN NECKLACE (Hero Element for 'huángjīn' / vàng) -->
  <!-- Necklace Chain -->
  <path d="M 102 153 Q 120 185 138 153" fill="none" stroke="url(#goldMetal)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Highlight on chain -->
  <path d="M 104 154 Q 120 182 136 154" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Gold Pendant -->
  <g transform="translate(120, 169)">
    <!-- Pendant Loop -->
    <circle cx="0" cy="-6" r="3" fill="none" stroke="url(#goldMetal)" stroke-width="2"/>
    <!-- Main Pendant (Gem/Gold piece) -->
    <path d="M 0 -3 L 8 6 L 0 15 L -8 6 Z" fill="url(#goldPendant)" stroke="#d97706" stroke-width="1.5"/>
    <!-- Inner sparkle in pendant -->
    <path d="M 0 0 L 2 5 L 0 10 L -2 5 Z" fill="#fffbeb" opacity="0.9"/>
  </g>

  <!-- Sparkles right on the gold necklace -->
  <g fill="#ffffff">
    <path d="M120 158 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 l3 -1 z"/>
    <path d="M108 153 l0.8 2.5 l2.5 0.8 l-2.5 0.8 l-0.8 2.5 l-0.8 -2.5 l-2.5 -0.8 l2.5 -0.8 z" transform="scale(0.7) translate(40, 60)"/>
  </g>

  <!-- Face Base -->
  <path d="M85 95 C85 65 100 55 120 55 C140 55 155 65 155 95 C155 125 145 145 120 145 C95 145 85 125 85 95 Z" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <circle cx="84" cy="95" r="7" fill="url(#skinGrad)"/>
  <circle cx="156" cy="95" r="7" fill="url(#skinGrad)"/>
  <!-- Gold Earrings to reinforce 'gold' context -->
  <circle cx="84" cy="103" r="3.5" fill="url(#goldMetal)" stroke="#b45309" stroke-width="1"/>
  <circle cx="156" cy="103" r="3.5" fill="url(#goldMetal)" stroke="#b45309" stroke-width="1"/>

  <!-- Hair Back / Base -->
  <path d="M80 80 C75 50 95 35 120 35 C145 35 165 50 160 80 C165 110 160 140 155 150 L85 150 C80 140 75 110 80 80 Z" fill="url(#hairGrad)"/>

  <!-- Facial Features -->
  <!-- Eyebrows (Happy, expressive arc) -->
  <path d="M96 82 Q103 76 110 81" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M130 81 Q137 76 144 82" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes (Delighted, twinkling, anime-inspired vector style) -->
  <ellipse cx="103" cy="91" rx="6" ry="8" fill="#0f172a"/>
  <ellipse cx="137" cy="91" rx="6" ry="8" fill="#0f172a"/>
  <!-- Eye highlights -->
  <circle cx="101" cy="88" r="2.5" fill="#ffffff"/>
  <circle cx="135" cy="88" r="2.5" fill="#ffffff"/>
  <circle cx="105" cy="94" r="1" fill="#ffffff"/>
  <circle cx="139" cy="94" r="1" fill="#ffffff"/>

  <!-- Cheeks (Blushing with joy) -->
  <ellipse cx="98" cy="103" rx="7" ry="4" fill="#fb7185" opacity="0.5"/>
  <ellipse cx="142" cy="103" rx="7" ry="4" fill="#fb7185" opacity="0.5"/>

  <!-- Nose -->
  <path d="M120 96 L117 106 L121 107" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mouth (Delighted, wide proud smile, pointing toward the chest/necklace) -->
  <path d="M 108 116 Q 120 130 132 116 C 135 116 135 122 120 124 C 105 122 105 116 108 116 Z" fill="#e11d48"/>
  <path d="M 108 116 Q 120 130 132 116 C 132 116 125 120 120 120 C 115 120 108 116 108 116 Z" fill="#ffe4e6"/>

  <!-- Hair Bangs & Styling -->
  <path d="M80 75 Q100 50 125 55 Q145 60 160 75 Q140 40 120 40 Q95 40 80 75 Z" fill="url(#hairGrad)"/>
  <!-- Side bangs framing face -->
  <path d="M83 75 Q85 100 95 115 Q90 95 87 75 Z" fill="url(#hairGrad)"/>
  <path d="M157 75 Q155 100 145 115 Q150 95 153 75 Z" fill="url(#hairGrad)"/>

  <!-- Action Hands (Pointing proudly at the golden necklace) -->
  <!-- Left hand pointing inward -->
  <path d="M70 185 C65 175 75 165 85 170 C90 172 95 180 92 188 C89 196 75 195 70 185 Z" fill="url(#skinGrad)"/>
  <!-- Right hand gesturing/admiring -->
  <path d="M170 185 C175 175 165 165 155 170 C150 172 145 180 148 188 C151 196 165 195 170 185 Z" fill="url(#skinGrad)"/>

  <!-- Foreground Sparkles / Highlights for Dynamic Action -->
  <g transform="translate(10, -20)">
    <path d="M190 90 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" fill="#fde047"/>
    <path d="M50 110 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5 l4.5 -1.5 z" fill="#fde047" opacity="0.8"/>
  </g>

</svg>