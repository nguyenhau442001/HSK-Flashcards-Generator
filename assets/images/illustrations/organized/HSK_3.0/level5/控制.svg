<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Console Surface Gradient -->
    <linearGradient id="console-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Emotion Wave Red Gradient (Overload) -->
    <linearGradient id="wave-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Emotion Wave Calm Blue Gradient -->
    <linearGradient id="wave-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric background glow / warning ambient light -->
  <circle cx="120" cy="110" r="80" fill="#ef4444" opacity="0.12" filter="blur(20px)"/>
  <circle cx="120" cy="140" r="60" fill="#f59e0b" opacity="0.08" filter="blur(15px)"/>

  <!-- ENVIRONMENT / SURROUNDINGS -->
  <!-- Back Wall details -->
  <rect x="40" y="30" width="160" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Screens on the wall showing emotional outbursts (red energy bursts) -->
  <rect x="55" y="45" width="55" height="40" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <path d="M65 70 L75 55 L85 75 L95 60" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-red)"/>
  
  <rect x="130" y="45" width="55" height="40" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <circle cx="157" cy="65" r="12" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
  <path d="M157 58 V65 H162" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- MAIN SUBJECT: The Control Panel (Representing 'Kiểm soát' / Control) -->
  <!-- Console Base -->
  <path d="M30 160 L50 110 H190 L210 160 Z" fill="url(#console-grad)" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="155" width="160" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Dash lines and interface elements on console -->
  <line x1="60" y1="170" x2="90" y2="170" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="185" x2="80" y2="185" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Control Levers & Dials -->
  <!-- Slider Left (Emotions level) -->
  <rect x="105" y="165" width="8" height="30" rx="4" fill="#334155"/>
  <circle cx="109" cy="175" r="7" fill="#ef4444" filter="url(#glow-red)" stroke="#fca5a5" stroke-width="1.5"/>

  <!-- Dial Center -->
  <circle cx="140" cy="180" r="12" fill="#334155" stroke="#475569" stroke-width="2"/>
  <line x1="140" y1="180" x2="147" y2="173" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="140" cy="180" r="3" fill="#38bdf8"/>

  <!-- Big Emergency Button (Popping out / Overload) -->
  <circle cx="180" cy="180" r="14" fill="#7f1d1d" filter="url(#shadow)"/>
  <circle cx="180" cy="178" r="12" fill="#ef4444" filter="url(#glow-red)"/>
  <circle cx="180" cy="176" r="6" fill="#f87171" opacity="0.6"/>

  <!-- CENTRAL ACTION: The Emotion Surge & Control Device -->
  <!-- Floating energetic core representing uncontrolled feelings bursting out -->
  <g filter="url(#glow-orange)">
    <!-- Ornate energy rings spinning wildly -->
    <ellipse cx="120" cy="115" rx="45" ry="16" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="12 6" transform="rotate(-15 120 115)"/>
    <ellipse cx="120" cy="115" rx="35" ry="12" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="8 8" transform="rotate(25 120 115)"/>
  </g>

  <!-- Wild jagged emotional wave bursting upward -->
  <path d="M 80 120 Q 95 90, 110 115 T 140 100 T 160 125" fill="none" stroke="url(#wave-red)" stroke-width="5" stroke-linecap="round" filter="url(#glow-red)"/>
  <path d="M 90 130 Q 105 105, 120 120 T 150 110" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- Glowing Emotion Orbs (representing feelings breaking free) -->
  <circle cx="95" cy="95" r="8" fill="#ef4444" filter="url(#glow-red)"/>
  <circle cx="95" cy="95" r="3" fill="#fee2e2"/>

  <circle cx="150" cy="90" r="10" fill="#f59e0b" filter="url(#glow-orange)"/>
  <circle cx="150" cy="90" r="4" fill="#fef3c7"/>

  <circle cx="125" cy="75" r="12" fill="#ec4899" filter="url(#glow-red)"/>
  <circle cx="125" cy="75" r="5" fill="#fce7f3"/>

  <!-- Little lightning sparks / energy crackles -->
  <path d="M 110 85 L 102 70 L 108 70 L 100 55" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 135 90 L 143 75 L 137 75 L 145 60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- STABILIZING BEAMS / HANDS-ON CONTROL EFFECT -->
  <!-- Cyan laser beams shooting down from top/sides trying to restrain the chaos -->
  <path d="M 60 40 L 95 100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#glow-orange)"/>
  <path d="M 180 40 L 145 100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#glow-orange)"/>
  <circle cx="95" cy="100" r="5" fill="#38bdf8" filter="url(#glow-orange)"/>
  <circle cx="145" cy="100" r="5" fill="#38bdf8" filter="url(#glow-orange)"/>

  <!-- Foreground details to create depth -->
  <!-- Ambient lighting dots / dust particles -->
  <circle cx="35" cy="100" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="205" cy="110" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="50" cy="210" r="2" fill="#ef4444" opacity="0.4"/>
  <circle cx="190" cy="200" r="2.5" fill="#10b981" opacity="0.6"/>

  <!-- Base console front shadow / highlight -->
  <rect x="30" y="200" width="180" height="6" rx="3" fill="#0f172a"/>
</svg>