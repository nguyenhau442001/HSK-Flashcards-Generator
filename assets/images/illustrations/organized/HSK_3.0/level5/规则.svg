<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Podium Glow Gradient -->
    <linearGradient id="podium-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Scroll Metallic/Paper Gradient -->
    <linearGradient id="scroll-paper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="15%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="scroll-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Shadow Filter for Depth -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements -->
  <!-- Ambient light circles -->
  <circle cx="120" cy="90" r="70" fill="url(#podium-glow)" />
  <circle cx="120" cy="120" r="95" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" fill="none" opacity="0.4" />

  <!-- Floor/Environment Stage -->
  <ellipse cx="120" cy="205" rx="80" ry="18" fill="#090d16" opacity="0.8" />
  <ellipse cx="120" cy="200" rx="65" ry="12" fill="#334155" opacity="0.4" />

  <!-- BACK PROP: Golden Trophy/Cup representing fair play/rules -->
  <g transform="translate(120, 75)" filter="url(#drop-shadow)">
    <!-- Trophy Base -->
    <path d="M-12,50 L12,50 L16,58 L-16,58 Z" fill="#64748b" />
    <rect x="-8" y="42" width="16" height="8" fill="#94a3b8" />
    <!-- Trophy Stem -->
    <rect x="-4" y="28" width="8" height="15" fill="#f59e0b" />
    <!-- Trophy Cup -->
    <path d="M-18,2 C-18,18 -8,28 0,28 C8,28 18,18 18,2 L18,-8 C18,-14 12,-18 0,-18 C-12,-18 -18,-14 -18,-8 Z" fill="#fbbf24" />
    <!-- Cup Inner Highlight -->
    <path d="M-14,-6 C-14,-12 -8,-15 0,-15 C8,-15 14,-12 14,-6 C14,-2 8,2 0,2 C-8,2 -14,-2 -14,-6 Z" fill="#fde68a" opacity="0.6" />
    <!-- Trophy Handles -->
    <path d="M-16,-12 C-26,-12 -26,2 -16,4" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M16,-12 C26,-12 26,2 16,4" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <!-- Star Emblem on Trophy -->
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- MAIN SUBJECT: The Official Rules Scroll / Code of Conduct -->
  <!-- Floating/Glowing Presentation -->
  <g transform="translate(120, 115)" filter="url(#drop-shadow)">
    
    <!-- Scroll Back Cylinders (Rolls) -->
    <!-- Top Roll -->
    <rect x="-42" y="-42" width="84" height="10" rx="5" fill="url(#scroll-accent)" />
    <ellipse cx="-42" cy="-37" rx="3" ry="5" fill="#d97706" />
    <ellipse cx="42" cy="-37" rx="3" ry="5" fill="#f59e0b" />

    <!-- Bottom Roll -->
    <rect x="-42" y="32" width="84" height="10" rx="5" fill="url(#scroll-accent)" />
    <ellipse cx="-42" cy="37" rx="3" ry="5" fill="#d97706" />
    <ellipse cx="42" cy="37" rx="3" ry="5" fill="#f59e0b" />

    <!-- Scroll Paper Body -->
    <rect x="-38" y="-37" width="76" height="74" fill="url(#scroll-paper)" />

    <!-- Decorative Top & Bottom Borders on Scroll -->
    <rect x="-38" y="-37" width="76" height="4" fill="#cbd5e1" />
    <rect x="-38" y="33" width="76" height="4" fill="#94a3b8" />

    <!-- Abstract Content Lines & Symbols representing Rules/Regulations -->
    <!-- Rule Item 1: Checkmark and lines -->
    <circle cx="-24" cy="-20" r="5" fill="#10b981" />
    <!-- Checkmark shape -->
    <path d="M-26,-20 L-25,-17 L-21,-23" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-14" y1="-22" x2="24" y2="-22" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="-14" y1="-17" x2="14" y2="-17" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Rule Item 2: Checkmark and lines -->
    <circle cx="-24" cy="0" r="5" fill="#10b981" />
    <path d="M-26,0 L-25,3 L-21,-3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-14" y1="-2" x2="20" y2="-2" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="-14" y1="3" x2="8" y2="3" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Rule Item 3: Checkmark and lines -->
    <circle cx="-24" cy="20" r="5" fill="#10b981" />
    <path d="M-26,20 L-25,23 L-21,17" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-14" y1="18" x2="22" y2="18" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="-14" y1="23" x2="16" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Glowing accent on the scroll center -->
    <rect x="-38" y="-37" width="76" height="74" fill="url(#podium-glow)" opacity="0.4" pointer-events="none" />
  </g>

  <!-- FOREGROUND PROPS & ACTION ELEMENTS -->
  <!-- Floating Gavel (Law/Rules enforcement) on the left -->
  <g transform="translate(50, 150) rotate(-25)" filter="url(#drop-shadow)">
    <!-- Handle -->
    <rect x="-4" y="-25" width="8" height="45" rx="3" fill="#b45309" />
    <!-- Wooden Head -->
    <rect x="-18" y="-35" width="36" height="16" rx="4" fill="#d97706" />
    <!-- Metallic Band on Gavel -->
    <rect x="-6" y="-35" width="12" height="16" fill="#fbbf24" />
    <circle cx="0" cy="-27" r="2" fill="#78350f" />
  </g>
  <!-- Gavel Striking Base / Sound Wave -->
  <path d="M45,175 Q55,170 65,175" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M40,182 Q55,175 70,182" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- Floating Shield (Protection/Adherence to Rules) on the right -->
  <g transform="translate(190, 130)" filter="url(#drop-shadow)">
    <path d="M0,-18 C12,-18 20,-12 20,0 C20,15 10,24 0,30 C-10,24 -20,15 -20,0 C-20,-12 -12,-18 0,-18 Z" fill="#3b82f6" />
    <path d="M0,-14 C9,-14 16,-9 16,0 C16,12 8,20 0,25 C-8,20 -16,12 -16,0 C-16,-9 -9,-14 0,-14 Z" fill="#60a5fa" />
    <!-- Check inside shield -->
    <path d="M-6,0 L-2,5 L8,-5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkles / Magic Rules Elements -->
  <!-- Top Left Sparkle -->
  <g transform="translate(65, 75)" filter="url(#glow)">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#fbbf24" />
  </g>
  <!-- Top Right Sparkle -->
  <g transform="translate(175, 60)" filter="url(#glow)">
    <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z" fill="#38bdf8" />
  </g>
  <!-- Lower Right Sparkle -->
  <g transform="translate(165, 175)" filter="url(#glow)">
    <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z" fill="#10b981" />
  </g>

  <!-- Small floating ambient dots -->
  <circle cx="85" cy="55" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="155" cy="95" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="95" cy="185" r="2" fill="#38bdf8" opacity="0.6" />

</svg>