<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Building Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Golden Hour Ribbon/Banner Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Ribbon Fold Shadow -->
    <linearGradient id="ribbonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Atmosphere -->
  <!-- Ambient glow behind building -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>

  <!-- Ground / Desk Surface -->
  <path d="M 20 190 L 220 190 L 220 220 C 220 231 211 240 200 240 L 40 240 C 29 240 20 231 20 220 Z" fill="#090d16"/>
  <rect x="20" y="186" width="200" height="4" rx="2" fill="#334155"/>

  <!-- Potted Office Plant (Context Prop Left) -->
  <g transform="translate(35, 140)">
    <path d="M 10 30 L 25 30 L 22 48 L 13 48 Z" fill="#64748b"/>
    <ellipse cx="17.5" cy="30" rx="7.5" ry="2" fill="#475569"/>
    <!-- Leaves -->
    <path d="M 17 30 C 15 15 5 10 0 5 C 10 5 18 18 17 30 Z" fill="#10b981"/>
    <path d="M 17 30 C 20 15 30 12 35 8 C 28 10 20 20 17 30 Z" fill="#059669"/>
    <path d="M 17 30 C 10 20 10 5 15 0 C 15 10 18 20 17 30 Z" fill="#34d399"/>
  </g>

  <!-- Globe / Miniature Model (Context Prop Right) -->
  <g transform="translate(180, 145)">
    <!-- Stand -->
    <path d="M 15 40 L 25 40 L 22 43 L 18 43 Z" fill="#94a3b8"/>
    <path d="M 20 20 L 20 40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 23 C 10 12 20 8 20 8 C 20 8 30 12 30 23" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Globe Sphere -->
    <circle cx="20" cy="23" r="11" fill="#3b82f6"/>
    <path d="M 14 16 C 17 18 23 18 26 16 C 24 22 16 22 14 16 Z" fill="#10b981" opacity="0.8"/>
    <path d="M 12 25 C 15 28 22 26 25 24 C 23 29 15 29 12 25 Z" fill="#10b981" opacity="0.7"/>
    <!-- Gloss -->
    <circle cx="17" cy="19" r="3" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- MAIN SUBJECT: The Modern Corporate Headquarters Building (Representing 'Thành Lập' - Establishment/Foundation) -->
  <g transform="translate(75, 55)">
    <!-- Building Shadow -->
    <ellipse cx="45" cy="135" rx="42" ry="8" fill="#020617" opacity="0.6"/>

    <!-- Main Tower Structure -->
    <path d="M 15 20 L 75 20 L 85 130 L 5 130 Z" fill="#1e293b"/>
    <path d="M 45 10 L 85 20 L 75 20 L 45 10 Z" fill="#475569"/> <!-- Roof accent -->
    
    <!-- Glass Facade Front -->
    <path d="M 20 28 L 70 28 L 78 122 L 12 122 Z" fill="url(#glassGrad)"/>

    <!-- Architectural Window Grid (Vertical & Horizontal lines) -->
    <!-- Horizontal tiers -->
    <line x1="18.5" y1="46" x2="71.5" y2="46" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
    <line x1="17" y1="64" x2="73" y2="64" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
    <line x1="15.5" y1="82" x2="74.5" y2="82" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
    <line x1="14" y1="100" x2="76" y2="100" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Vertical dividers -->
    <line x1="32" y1="30" x2="33" y2="120" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
    <line x1="45" y1="28" x2="45" y2="122" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5"/>
    <line x1="58" y1="30" x2="57" y2="120" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>

    <!-- Lit Office Windows (Warm accents suggesting active business/establishment) -->
    <rect x="23" y="34" width="7" height="9" rx="1" fill="#fbbf24" opacity="0.9"/>
    <rect x="60" y="52" width="7" height="9" rx="1" fill="#fbbf24" opacity="0.9"/>
    <rect x="36" y="70" width="7" height="9" rx="1" fill="#fbbf24" opacity="0.9"/>
    <rect x="49" y="88" width="7" height="9" rx="1" fill="#fbbf24" opacity="0.9"/>
    <rect x="23" y="106" width="7" height="9" rx="1" fill="#fbbf24" opacity="0.9"/>

    <!-- Grand Entrance Canopy / Lobby -->
    <path d="M 32 122 L 58 122 L 61 130 L 29 130 Z" fill="#334155"/>
    <rect x="40" y="122" width="10" height="8" fill="#fb923c"/>
  </g>

  <!-- ACTION-PACKED LAUNCH ELEMENTS: Ribbon / Banner unfurling across the building (Grand Opening / Establishment) -->
  <g transform="translate(0, 10)">
    <!-- Ribbon Left Tail -->
    <path d="M 15 95 L 45 80 L 45 100 L 15 115 Z" fill="url(#ribbonDark)" filter="drop-shadow(0px 4px 4px rgba(0,0,0,0.3))"/>
    <path d="M 15 95 L 25 90 L 25 110 L 15 115 Z" fill="#b45309"/>

    <!-- Ribbon Right Tail -->
    <path d="M 225 80 L 195 95 L 195 115 L 225 100 Z" fill="url(#ribbonDark)" filter="drop-shadow(0px 4px 4px rgba(0,0,0,0.3))"/>
    <path d="M 225 80 L 215 85 L 215 105 L 225 100 Z" fill="#d97706"/>

    <!-- Main Ribbon Wave Across Building Center -->
    <path d="M 35 75 Q 120 120 205 65 Q 120 100 35 75 Z" fill="url(#goldGrad)" filter="drop-shadow(0px 6px 6px rgba(0,0,0,0.4))"/>
    <path d="M 35 75 Q 120 120 205 65 Q 120 106 35 81 Z" fill="#fcd34d" opacity="0.4"/>

    <!-- Festive Gold Stars / Sparkles bursting around the ribbon -->
    <!-- Star 1 (Top Left) -->
    <g transform="translate(55, 55) scale(0.8)">
      <path d="M 0 -10 C 2 -3 3 -2 10 0 C 3 2 2 3 0 10 C -2 3 -3 2 -10 0 C -3 -2 -2 -3 0 -10 Z" fill="#fde047" filter="url(#glow)"/>
    </g>
    <!-- Star 2 (Top Right) -->
    <g transform="translate(185, 45) scale(1.1)">
      <path d="M 0 -10 C 2 -3 3 -2 10 0 C 3 2 2 3 0 10 C -2 3 -3 2 -10 0 C -3 -2 -2 -3 0 -10 Z" fill="#fde047" filter="url(#glow)"/>
    </g>
    <!-- Star 3 (Bottom Center) -->
    <g transform="translate(120, 140) scale(0.7)">
      <path d="M 0 -10 C 2 -3 3 -2 10 0 C 3 2 2 3 0 10 C -2 3 -3 2 -10 0 C -3 -2 -2 -3 0 -10 Z" fill="#38bdf8" filter="url(#glow)"/>
    </g>
    <!-- Confetti Pieces (Energy & Celebration) -->
    <rect x="75" y="40" width="6" height="3" rx="1.5" transform="rotate(25 78 41.5)" fill="#ec4899"/>
    <rect x="160" y="50" width="8" height="3" rx="1.5" transform="rotate(-30 164 51.5)" fill="#10b981"/>
    <circle cx="95" cy="130" r="2.5" fill="#f43f5e"/>
    <circle cx="150" cy="125" r="3" fill="#38bdf8"/>
    <rect x="105" y="32" width="5" height="5" rx="1" transform="rotate(45 107.5 34.5)" fill="#fb923c"/>
  </g>
</svg>