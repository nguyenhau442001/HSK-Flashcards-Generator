<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="hat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="speech-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements (Streetlamp & Mystery Vibe) -->
  <path d="M 120 40 L 120 220" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <circle cx="120" cy="40" r="12" fill="#1e293b" stroke="#475569" stroke-width="2" />
  
  <!-- Glowing Light Cone representing 'Someone / An unspecified source' -->
  <polygon points="120,52 40,220 200,220" fill="#fbbf24" opacity="0.08" />
  <ellipse cx="120" cy="220" rx="80" ry="12" fill="#fbbf24" opacity="0.15" filter="url(#glow)" />

  <!-- Background Detective Office Props (Bookshelf & Magnifying Glass) -->
  <g opacity="0.4">
    <rect x="25" y="90" width="35" height="50" rx="4" fill="#334155" />
    <line x1="30" y1="105" x2="55" y2="105" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="120" x2="50" y2="120" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <rect x="180" y="100" width="35" height="40" rx="4" fill="#334155" />
    <path d="M 188 115 L 207 115" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- MAIN SUBJECT: Mysterious "Someone" Silhouette / Enigmatic Figure representing '某' (mǒu) -->
  <g filter="url(#shadow)">
    <!-- Body / Coat -->
    <path d="M 85 220 C 85 180 95 155 120 155 C 145 155 155 180 155 220 Z" fill="url(#[coat-grad)" />
    <path d="M 95 220 C 95 185 102 165 120 165 C 138 165 145 185 145 220 Z" fill="url(#coat-grad)" />
    
    <!-- Coat Collar -->
    <path d="M 102 165 L 120 190 L 138 165 L 130 158 L 120 163 L 110 158 Z" fill="#0284c7" />

    <!-- Mysterious Shadowed Head & Fedora Hat -->
    <circle cx="120" cy="132" r="18" fill="#0f172a" />
    <!-- Hat Brim -->
    <path d="M 90 124 C 105 120 135 120 150 124 C 146 120 94 120 90 124 Z" fill="url(#hat-grad)" />
    <!-- Hat Crown -->
    <path d="M 102 122 C 103 105 137 105 138 122 Z" fill="url(#hat-grad)" />
    <rect x="103" y="118" width="34" height="4" fill="#38bdf8" opacity="0.8" />

    <!-- Enigmatic Glowing Question Mark / Mystery Element on face/hat area -->
    <path d="M 115 110 C 115 104 125 104 125 110 C 125 115 117 116 117 122" 
          stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)" />
    <circle cx="117" cy="127" r="1.5" fill="#fbbf24" />
  </g>

  <!-- Foreground Dynamic Action Elements: Whispering / Information Sharing (Floating confidential envelope & speech bubble) -->
  <!-- Floating Speech Bubble -->
  <g filter="url(#shadow)">
    <path d="M 135 75 Q 135 60 160 60 L 195 60 Q 215 60 215 75 L 215 95 Q 215 110 195 110 L 175 110 L 160 125 L 165 110 L 160 110 Q 135 110 135 95 Z" fill="url(#speech-grad)" />
    
    <!-- Abstract mysterious data inside speech bubble (Dots & Lines instead of text) -->
    <circle cx="150" cy="80" r="3" fill="#cbd5e1" />
    <circle cx="165" cy="80" r="3" fill="#38bdf8" />
    <circle cx="180" cy="80" r="3" fill="#cbd5e1" />
    
    <line x1="150" y1="92" x2="200" y2="92" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="150" y1="100" x2="185" y2="100" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Floating Confidential Envelope (Representing "A certain matter / secret") -->
  <g transform="translate(45, 130) rotate(-15)" filter="url(#shadow)">
    <rect x="0" y="0" width="45" height="32" rx="4" fill="#f8fafc" />
    <path d="M 0 4 L 22.5 20 L 45 4" stroke="#cbd5e1" stroke-width="2" fill="none" />
    <circle cx="22.5" cy="16" r="6" fill="#ec4899" />
    <!-- Mini seal icon -->
    <path d="M 20.5 16 L 21.5 17.5 L 25 14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Glowing Accent Sparks for Action/Mystery Atmosphere -->
  <circle cx="85" cy="85" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="160" cy="45" r="2" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="195" cy="140" r="2.5" fill="#ec4899" filter="url(#glow)" />
</svg>