<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="folder-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Atmospheric Glow from Desk Lamp -->
  <circle cx="180" cy="50" r="70" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="70" cy="180" r="90" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

  <!-- Background Office Elements / Windows -->
  <path d="M30 40 L90 40 L80 110 L40 110 Z" fill="#1e293b" opacity="0.5"/>
  <line x1="50" y1="55" x2="75" y2="55" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="75" x2="70" y2="75" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="95" x2="60" y2="95" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Mini Bar Chart on Backdrop -->
  <rect x="140" y="45" width="8" height="35" rx="2" fill="#38bdf8" opacity="0.3"/>
  <rect x="153" y="30" width="8" height="50" rx="2" fill="#10b981" opacity="0.4"/>
  <rect x="166" y="55" width="8" height="25" rx="2" fill="#fb923c" opacity="0.3"/>
  <rect x="179" y="20" width="8" height="60" rx="2" fill="#ec4899" opacity="0.4"/>
  <line x1="130" y1="83" x2="195" y2="83" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Wooden/Modern Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#desk)"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2" opacity="0.5"/>

  <!-- Coffee Mug Prop -->
  <g transform="translate(185, 145)">
    <!-- Mug Body -->
    <rect x="0" y="5" width="22" height="26" rx="4" fill="#cbd5e1"/>
    <!-- Mug Handle -->
    <path d="M 22 10 C 28 10, 28 26, 22 26" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Coffee Surface -->
    <ellipse cx="11" cy="7" rx="9" ry="3" fill="#78350f"/>
    <!-- Steam -->
    <path d="M 7 -2 C 9 -6, 5 -10, 8 -14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 15 -3 C 13 -7, 17 -11, 14 -15" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Secondary Stack of Reference Papers -->
  <g transform="translate(35, 165) rotate(-6)">
    <rect x="0" y="0" width="45" height="35" rx="2" fill="#334155"/>
    <rect x="4" y="4" width="45" height="35" rx="2" fill="url(#paper-grad)"/>
    <line x1="10" y1="12" x2="30" y2="12" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="20" x2="38" y2="20" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="28" x2="25" y2="28" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: The Business Report (Folder & Open Pages) -->
  <!-- Folder Back Cover -->
  <g transform="translate(65, 85)">
    <path d="M 0 20 Q 0 5, 15 5 L 45 5 L 60 20 L 105 20 Q 120 20, 120 35 L 120 100 Q 120 115, 105 115 L 15 115 Q 0 115, 0 100 Z" fill="#d97706"/>
    
    <!-- Open Report Pages inside Folder -->
    <!-- Left Page -->
    <g transform="translate(12, 22)">
      <rect x="0" y="0" width="44" height="85" rx="2" fill="url(#paper-grad)"/>
      <!-- Text Lines -->
      <line x1="6" y1="12" x2="25" y2="12" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <line x1="6" y1="22" x2="38" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="30" x2="35" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="38" x2="30" y2="38" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <!-- Mini Chart -->
      <polyline points="6,65 14,55 22,60 30,45 38,50" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="45" r="3" fill="#38bdf8"/>
    </g>

    <!-- Right Page -->
    <g transform="translate(64, 22)">
      <rect x="0" y="0" width="44" height="85" rx="2" fill="url(#paper-grad)"/>
      <!-- Text Lines -->
      <line x1="6" y1="12" x2="32" y2="12" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <line x1="6" y1="22" x2="38" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="30" x2="28" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="38" x2="36" y2="38" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <!-- Mini Bar Graph -->
      <rect x="8" y="65" width="5" height="15" rx="1" fill="#10b981"/>
      <rect x="17" y="55" width="5" height="25" rx="1" fill="#fb923c"/>
      <rect x="26" y="48" width="5" height="32" rx="1" fill="#ec4899"/>
      <rect x="35" y="58" width="5" height="22" rx="1" fill="#38bdf8"/>
    </g>

    <!-- Folder Front Cover (Folded down/open) -->
    <path d="M 0 35 Q 0 25, 12 25 L 108 25 Q 120 25, 120 35 L 120 105 Q 120 115, 105 115 L 15 115 Q 0 115, 0 105 Z" fill="url(#folder-grad)" opacity="0.95"/>
    <path d="M 0 35 L 120 35" stroke="#b45309" stroke-width="3" opacity="0.5"/>
    
    <!-- Golden Star / Seal Emblem on Report Cover -->
    <g transform="translate(60, 75)">
      <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="12" fill="#fbbf24"/>
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Action Sparkles / Presentation Accents -->
  <g transform="translate(180, 85)">
    <path d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#38bdf8" filter="url(#glow)"/>
  </g>
  <g transform="translate(50, 110)">
    <path d="M 0 -6 L 2 -2 L 6 0 L 2 2 L 0 6 L -2 2 L -6 0 L -2 -2 Z" fill="#fbbf24" filter="url(#glow)"/>
  </g>
  <g transform="translate(145, 130) scale(0.7)">
    <path d="M 0 -8 L 2.5 -2.5 L 8 0 L 2.5 2.5 L 0 8 L -2.5 2.5 L -8 0 L -2.5 -2.5 Z" fill="#10b981" filter="url(#glow)"/>
  </g>

  <!-- Modern Sleek Pen / Stylus for the Report -->
  <g transform="translate(135, 140) rotate(-35)">
    <rect x="0" y="0" width="6" height="45" rx="3" fill="#0ea5e9"/>
    <polygon points="0,45 6,45 3,52" fill="#f1f5f9"/>
    <rect x="1" y="4" width="4" height="8" rx="1" fill="#bae6fd"/>
  </g>
</svg>