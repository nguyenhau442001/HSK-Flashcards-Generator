<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground Surface -->
  <path d="M0 180 C 80 170, 160 190, 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Ice Patch -->
  <ellipse cx="120" cy="200" rx="90" ry="25" fill="#38bdf8" opacity="0.3"/>
  <path d="M50 195 Q 120 215 190 195 Q 120 185 50 195" fill="#e0f2fe" opacity="0.6"/>
  
  <!-- Character: Slipping Person -->
  <g transform="translate(120, 160)">
    <!-- Body -->
    <path d="M-10 -40 L 10 -40 L 5 20 L -5 20 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="-55" r="15" fill="#fde68a"/>
    <!-- Arms flailing -->
    <path d="M-15 -30 L -35 -10" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M15 -30 L 35 -10" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs slipping -->
    <path d="M-5 20 L -25 35" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 20 L 25 25" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Motion/Speed Lines -->
  <path d="M160 170 L 190 160" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M170 180 L 200 170" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Contextual Props: Warning Sign Post -->
  <rect x="20" y="100" width="6" height="100" fill="#475569"/>
  <path d="M5 100 L 35 100 L 20 70 Z" fill="#ec4899"/>
  <circle cx="20" cy="85" r="2" fill="#fff"/>
  <rect x="18" y="88" width="4" height="8" fill="#fff"/>
</svg>