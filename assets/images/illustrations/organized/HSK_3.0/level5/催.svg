<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Road/Path -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 180 L240 180" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Person being hurried -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M20 32 L20 60 L10 90 M20 60 L30 90" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 45 L30 45" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="16" cy="18" r="2" fill="#0f172a"/>
    <circle cx="24" cy="18" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Person hurrying (The "Cuī" agent) -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#38bdf8"/>
    <path d="M20 35 L20 70 L10 100 M20 70 L30 100" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 50 L35 50" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 40 L50 30" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="15" cy="18" r="2" fill="#0f172a"/>
    <circle cx="25" cy="18" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Motion lines -->
  <path d="M100 130 L120 130" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <path d="M105 140 L125 140" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 150 L130 150" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Clock icon representation (context) -->
  <circle cx="200" cy="40" r="20" fill="none" stroke="#ec4899" stroke-width="3"/>
  <path d="M200 40 L200 25" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 40 L210 40" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
</svg>