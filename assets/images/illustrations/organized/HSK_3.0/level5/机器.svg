<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Machine Body -->
    <rect x="20" y="20" width="120" height="90" rx="8" fill="#475569"/>
    <rect x="25" y="25" width="110" height="80" rx="4" fill="#334155"/>
    
    <!-- Mechanical Details -->
    <circle cx="80" cy="65" r="25" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="80" cy="65" r="10" fill="#f59e0b"/>
    
    <!-- Broken/Sparking Element -->
    <path d="M140 40 L160 20 M140 50 L170 45" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <circle cx="160" cy="20" r="4" fill="#fb923c"/>
    
    <!-- Control Panel -->
    <rect x="30" y="30" width="15" height="40" rx="2" fill="#10b981"/>
    <rect x="50" y="30" width="15" height="40" rx="2" fill="#fbbf24"/>
    
    <!-- Base -->
    <rect x="10" y="110" width="140" height="10" rx="2" fill="#64748b"/>
    
    <!-- Floor/Environment -->
    <rect x="0" y="120" width="160" height="5" rx="2" fill="#334155"/>
  </g>
  
  <!-- Atmospheric Sparks -->
  <circle cx="190" cy="70" r="2" fill="#fb923c"/>
  <circle cx="205" cy="85" r="3" fill="#f59e0b"/>
  <path d="M195 80 L205 70" stroke="#fb923c" stroke-width="2"/>
</svg>