<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Photo Fading Gradient -->
    <linearGradient id="photo-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#cbd5e1" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#94a3b8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.02" />
    </linearGradient>

    <!-- Blur Filter for Faded Elements -->
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    
    <filter id="light-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment & Desk -->
  <g id="room-context">
    <!-- Back wall shelf line -->
    <rect x="30" y="50" width="180" height="4" rx="2" fill="#334155" />
    <!-- Props on shelf -->
    <rect x="45" y="30" width="16" height="20" rx="2" fill="#475569" />
    <path d="M75 50 L75 35 C75 30 85 30 85 35 L85 50 Z" fill="#64748b" />
    <circle cx="170" cy="42" r="8" fill="#0ea5e9" opacity="0.6" />

    <!-- Wooden/Slate Desk Surface -->
    <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#090d16" />
    <path d="M0 170 L240 170 L240 174 L0 174 Z" fill="#334155" />

    <!-- Desk Lamp Base & Stand -->
    <ellipse cx="195" cy="170" rx="18" ry="6" fill="#334155" />
    <path d="M195 170 L185 110 L195 105 L200 170 Z" fill="#475569" />
    <circle cx="190" cy="107" r="4" fill="#64748b" />
    <!-- Lamp Shade -->
    <path d="M175 95 L215 95 L225 115 L165 115 Z" fill="#38bdf8" />
    <!-- Ambient Light Circle -->
    <circle cx="150" cy="130" r="70" fill="url(#lamp-glow)" />
  </g>

  <!-- Main Focal Subject: The Fading/Blurry Photo & Memories -->
  <g id="memory-scene">
    <!-- Scattered memory fragments / polaroids on desk -->
    
    <!-- Sharp background notebook -->
    <g transform="rotate(-8 90 150)">
      <rect x="60" y="110" width="60" height="75" rx="4" fill="#cbd5e1" />
      <line x1="70" y1="125" x2="110" y2="125" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      <line x1="70" y1="140" x2="100" y2="140" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      <line x1="70" y1="155" x2="90" y2="155" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Secondary Photo (Clearer detail, left side) -->
    <g transform="rotate(-15 70 135)">
      <rect x="45" y="100" width="50" height="60" rx="2" fill="#f8fafc" />
      <rect x="50" y="105" width="40" height="38" fill="#38bdf8" />
      <!-- Simple sharp house/tree graphic inside sharp photo -->
      <path d="M70 115 L85 130 L55 130 Z" fill="#f1f5f9" />
      <rect x="65" y="123" width="10" height="7" fill="#0f172a" />
      <circle cx="80" cy="112" r="4" fill="#f59e0b" />
    </g>

    <!-- MAIN HERO OBJECT: The Large Fading/Blurry Photograph -->
    <g transform="rotate(6 125 125)">
      <!-- Polaroid Photo Frame -->
      <rect x="80" y="75" width="95" height="115" rx="4" fill="#f8fafc" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))" />
      
      <!-- Photo Image Area (The Blurry Part) -->
      <rect x="90" y="85" width="75" height="75" rx="2" fill="#e2e8f0" />
      
      <!-- Blurry/Faded Visual Content inside Photo -->
      <!-- Blurry Sun -->
      <circle cx="110" cy="110" r="14" fill="#fbbf24" filter="url(#soft-blur)" opacity="0.8" />
      <circle cx="110" cy="110" r="14" fill="#f59e0b" filter="url(#light-blur)" opacity="0.5" />

      <!-- Blurry Landscape / Hills (Mòhú / Fading effect) -->
      <path d="M90 140 Q 110 115, 135 135 T 165 130 L 165 160 L 90 160 Z" fill="#64748b" filter="url(#soft-blur)" opacity="0.7" />
      <path d="M90 145 Q 120 120, 145 145 T 165 140 L 165 160 L 90 160 Z" fill="#334155" filter="url(#light-blur)" opacity="0.6" />

      <!-- Blurry Silhouette of a Person/Tree -->
      <circle cx="135" cy="125" r="7" fill="#1e293b" filter="url(#soft-blur)" opacity="0.5" />
      <rect x="133" y="131" width="4" height="15" rx="2" fill="#1e293b" filter="url(#soft-blur)" opacity="0.5" />

      <!-- EXTRA VISUAL OVERLAY: The "Fading / Dissolving" Streak Effect -->
      <rect x="90" y="85" width="75" height="75" fill="url(#photo-fade)" style="mix-blend-mode: overlay;" />

      <!-- Motion/Memory Dispersion Dots (Floating away) -->
      <circle cx="175" cy="95" r="3" fill="#cbd5e1" opacity="0.8" filter="url(#light-blur)" />
      <circle cx="183" cy="88" r="1.5" fill="#94a3b8" opacity="0.6" />
      <circle cx="180" cy="110" r="2" fill="#e2e8f0" opacity="0.5" filter="url(#light-blur)" />
      <circle cx="190" cy="102" r="1" fill="#64748b" opacity="0.4" />
    </g>

    <!-- Magnifying glass trying to look closely (showing frustration or search for clarity) -->
    <g transform="translate(130, 110) rotate(-20)">
      <!-- Glass Rim -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#0ea5e9" stroke-width="4" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))" />
      <!-- Lens glare / refraction -->
      <path d="M -12 -12 A 17 17 0 0 1 12 -12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
      <!-- Handle -->
      <rect x="-4" y="20" width="8" height="28" rx="4" fill="#0284c7" />
      <circle cx="0" cy="48" r="4" fill="#0369a1" />
    </g>
  </g>

  <!-- Foreground Atmospheric Particles / Dust caught in light -->
  <g id="dust-particles" opacity="0.6">
    <circle cx="110" cy="65" r="1.5" fill="#fde047" filter="url(#light-blur)" />
    <circle cx="130" cy="55" r="2" fill="#fde047" filter="url(#light-blur)" />
    <circle cx="155" cy="70" r="1" fill="#fde047" />
    <circle cx="95" cy="50" r="1.2" fill="#fde047" />
    <circle cx="170" cy="80" r="2.5" fill="#fde047" filter="url(#soft-blur)" />
  </g>
</svg>