<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Window City Night Glow -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Thesis Page Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Coffee Mug Gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Laptop Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lamp Glow over entire scene -->
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Background Environment: Bookshelf & Window -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="150" y="20" width="70" height="70" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <path d="M150 55 H220 M185 20 V90" stroke="#334155" stroke-width="1.5"/>
    <!-- City lights through window -->
    <rect x="156" y="30" width="10" height="15" fill="#f59e0b" opacity="0.6" rx="1"/>
    <rect x="172" y="45" width="12" height="20" fill="#38bdf8" opacity="0.5" rx="1"/>
    <rect x="195" y="35" width="16" height="30" fill="#f43f5e" opacity="0.4" rx="1"/>
    <rect x="160" y="65" width="8" height="15" fill="#10b981" opacity="0.6" rx="1"/>

    <!-- Bookshelf in Background -->
    <rect x="20" y="25" width="100" height="12" rx="2" fill="#334155"/>
    <rect x="25" y="10" width="14" height="15" fill="#f43f5e" rx="1"/>
    <rect x="41" y="7" width="12" height="18" fill="#38bdf8" rx="1"/>
    <rect x="55" y="12" width="18" height="13" fill="#10b981" rx="1"/>
    <rect x="75" y="9" width="12" height="16" fill="#fbbf24" rx="1"/>
    <rect x="89" y="13" width="15" height="12" fill="#a855f7" rx="1"/>
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 230 C 240 235 235 240 230 240 L 10 240 C 5 240 0 235 0 230 Z" fill="#291811"/>
  <path d="M 0 170 L 240 170 L 240 176 L 0 176 Z" fill="#3d2317"/>
  <!-- Desk rim highlight -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#5c3321" stroke-width="2"/>

  <!-- Desk Props (Back Layer) -->
  <!-- Laptop computer -->
  <g id="laptop" transform="translate(140, 115)">
    <!-- Laptop Base -->
    <path d="M -15 55 L 75 55 L 60 40 L 0 40 Z" fill="#64748b"/>
    <path d="M -20 55 L 80 55 C 83 55 85 57 85 60 C 85 63 83 65 80 65 L -20 65 C -23 65 -25 63 -25 60 C -25 57 -23 55 -20 55 Z" fill="#475569" filter="url(#softShadow)"/>
    <rect x="20" y="58" width="20" height="4" rx="1" fill="#334155"/>
    <!-- Laptop Screen -->
    <path d="M 0 40 L 60 40 L 50 -10 L 10 -10 Z" fill="#334155"/>
    <rect x="13" y="-7" width="34" height="44" rx="2" fill="url(#screenGlow)"/>
    <!-- Code/Text lines on screen -->
    <line x1="17" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="17" y1="6" x2="40" y2="6" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="17" y1="12" x2="28" y2="12" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="17" y1="18" x2="38" y2="18" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="17" y1="24" x2="32" y2="24" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="30" cy="34" r="3" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Coffee Mug with Steam -->
  <g id="mug" transform="translate(195, 140)">
    <!-- Steam -->
    <path d="M 12 0 C 12 -5 6 -8 6 -13 C 6 -18 12 -21 12 -26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M 4 -3 C 4 -8 -2 -11 -2 -16 C -2 -21 4 -24 4 -29" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
    <!-- Mug Body -->
    <path d="M 0 0 C 0 0 2 25 5 28 C 8 31 16 31 19 28 C 22 25 24 0 24 0 Z" fill="url(#mugGrad)" filter="url(#softShadow)"/>
    <!-- Mug Rim -->
    <ellipse cx="12" cy="0" rx="12" ry="3" fill="#7dd3fc"/>
    <!-- Mug Handle -->
    <path d="M 22 5 C 28 5 30 15 24 22" stroke="#0284c7" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Desk Lamp -->
  <g id="lamp" transform="translate(30, 90)">
    <!-- Base -->
    <ellipse cx="0" cy="80" rx="18" ry="6" fill="#475569"/>
    <!-- Pole -->
    <path d="M 0 80 L -10 30 L -5 20" stroke="#cbd5e1" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Shade & Bulb -->
    <path d="M -25 15 L 15 15 L 5 -5 L -15 -5 Z" fill="#f59e0b"/>
    <circle cx="-5" cy="18" r="4" fill="#fef08a" filter="url(#glowEffect)"/>
  </g>

  <!-- MAIN FOCUS: THE THESIS (论文 - lùnwén) -->
  <g id="thesis-document" transform="translate(65, 100)" filter="url(#softShadow)">
    <!-- Stacked papers underneath for depth -->
    <rect x="-10" y="10" width="95" height="75" rx="4" transform="rotate(-6 35 45)" fill="#cbd5e1"/>
    <rect x="-5" y="5" width="95" height="75" rx="4" transform="rotate(-2 35 45)" fill="#e2e8f0"/>

    <!-- Main Thesis Document Page (Open Layout) -->
    <g transform="rotate(2 35 45)">
      <!-- Left Page -->
      <rect x="-35" y="0" width="70" height="75" rx="2" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Page lines / paragraphs -->
      <line x1="-27" y1="12" x2="-5" y2="12" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-27" y1="20" x2="5" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-27" y1="26" x2="2" y2="26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-27" y1="32" x2="0" y2="32" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Chart/Graph on Left Page -->
      <rect x="-27" y="42" width="45" height="22" rx="2" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <polyline points="-22,58 -15,50 -8,54 2,46 10,48" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="-15" cy="50" r="2" fill="#ef4444"/>
      <circle cx="2" cy="46" r="2" fill="#10b981"/>

      <!-- Right Page -->
      <rect x="35" y="0" width="70" height="75" rx="2" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Right Page lines -->
      <line x1="43" y1="12" x2="90" y2="12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="43" y1="18" x2="85" y2="18" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="43" y1="24" x2="88" y2="24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="43" y1="35" x2="70" y2="35" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <line x1="43" y1="43" x2="92" y2="43" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="43" y1="49" x2="80" y2="49" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="43" y1="55" x2="87" y2="55" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Center Binding / Spine shadow -->
      <path d="M 32 0 C 34 25 34 50 32 75" stroke="#cbd5e1" stroke-width="4" fill="none"/>
      <path d="M 35 0 L 35 75" stroke="#94a3b8" stroke-width="1"/>

      <!-- Red Academic Stamp / Seal (Very authentic for formal papers/thesis) -->
      <circle cx="75" cy="60" r="10" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.8"/>
      <circle cx="75" cy="60" r="8" fill="none" stroke="#ef4444" stroke-width="0.75" opacity="0.8"/>
      <path d="M 70 60 L 80 60 M 75 55 L 75 65" stroke="#ef4444" stroke-width="1.5" opacity="0.8"/>

      <!-- Bookmark Ribbon hanging from bottom -->
      <path d="M 32 75 L 32 95 L 36 90 L 40 95 L 40 75 Z" fill="#ec4899" filter="url(#softShadow)"/>
    </g>
  </g>

  <!-- Foreground Props: Reading Glasses & Pen -->
  <g id="desk-tools" transform="translate(15, 140)">
    <!-- Modern Fountain Pen -->
    <g transform="translate(110, 10) rotate(-35)">
      <rect x="0" y="0" width="35" height="5" rx="2.5" fill="#1e293b"/>
      <rect x="35" y="0.5" width="12" height="4" rx="1" fill="#fbbf24"/>
      <path d="M 47 2.5 L 53 2.5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <rect x="3" y="1" width="8" height="3" rx="1" fill="#475569"/>
    </g>

    <!-- Reading Glasses -->
    <g transform="translate(15, 15) rotate(8)">
      <!-- Left Rim -->
      <circle cx="20" cy="10" r="11" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <!-- Right Rim -->
      <circle cx="46" cy="10" r="11" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <!-- Bridge -->
      <path d="M 31 8 C 35 5 38 5 41 8" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <!-- Temples -->
      <path d="M 9 10 C 2 7 -3 0 -8 -5" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <path d="M 57 10 C 64 7 69 0 74 -5" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <!-- Glass Glint Effect -->
      <path d="M 14 5 L 18 12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M 40 5 L 44 12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

  <!-- Ambient Highlight Overlay -->
  <circle cx="105" cy="140" r="60" fill="#fbbf24" opacity="0.05" filter="url(#glowEffect)" pointer-events="none"/>
</svg>