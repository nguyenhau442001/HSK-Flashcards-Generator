<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Mountain Gradient (The Challenge) -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glowing Beacon Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Stars / Sparkles -->
  <g fill="#94a3b8" opacity="0.4">
    <circle cx="35" cy="45" r="1.5"/>
    <circle cx="75" cy="25" r="1"/>
    <circle cx="205" cy="55" r="1.5"/>
    <circle cx="185" cy="25" r="2"/>
    <circle cx="15" cy="95" r="1"/>
    <circle cx="225" cy="110" r="1.5"/>
  </g>

  <!-- Distant Mountains (Depth) -->
  <path d="M -10 170 L 40 110 L 90 170 Z" fill="#334155" opacity="0.5"/>
  <path d="M 60 170 L 130 90 L 200 170 Z" fill="#334155" opacity="0.7"/>
  <path d="M 150 170 L 195 120 L 250 170 Z" fill="#334155" opacity="0.6"/>

  <!-- Massive Imposing Mountain (The "Challenge" - 面临) -->
  <path d="M 80 190 L 170 60 L 260 190 Z" fill="url(#mountainGrad)" filter="url(#shadow)"/>
  
  <!-- Mountain Snow Cap / Highlights -->
  <path d="M 170 60 L 140 105 L 155 110 L 170 95 L 190 115 L 200 105 Z" fill="#fef3c7" opacity="0.9"/>
  <path d="M 170 60 L 200 105 L 260 190 L 170 190 Z" fill="#d97706" opacity="0.4"/>

  <!-- Glowing Energy Gap / Abyss Edge -->
  <path d="M 30 190 C 70 185, 90 195, 130 190 C 160 185, 180 195, 220 190 L 240 240 L 0 240 Z" fill="url(#groundGrad)"/>
  
  <!-- Glowing Chasm Line -->
  <path d="M 60 192 C 100 188, 140 196, 180 190" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="4 2"/>

  <!-- Floating Adventure Gear / Compass & Map Props (Context) -->
  <g transform="translate(45, 125) rotate(-15)" filter="url(#shadow)">
    <!-- Map scroll -->
    <rect x="0" y="0" width="30" height="20" rx="2" fill="#fef3c7"/>
    <path d="M 5 5 L 25 5 M 5 10 L 20 10 M 5 15 L 22 15" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="25" cy="10" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <polygon points="25,5 27,10 25,15 23,10" fill="#ef4444"/>
  </g>

  <!-- Backpack on the ground -->
  <g transform="translate(25, 160)" filter="url(#shadow)">
    <rect x="0" y="5" width="18" height="22" rx="4" fill="#38bdf8"/>
    <rect x="3" y="12" width="12" height="10" rx="2" fill="#0284c7"/>
    <path d="M 5 5 C 5 1, 13 1, 13 5" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <rect x="6" y="0" width="6" height="5" rx="1" fill="#bae6fd"/>
  </g>

  <!-- Foreground Adventurer (Standing facing the massive mountain/challenge) -->
  <g transform="translate(85, 130)" filter="url(#shadow)">
    <!-- Shadow beneath character -->
    <ellipse cx="25" cy="62" rx="16" ry="5" fill="#020617" opacity="0.6"/>

    <!-- Left Leg -->
    <rect x="15" y="40" width="7" height="22" rx="3.5" fill="#334155"/>
    <!-- Right Leg -->
    <rect x="25" y="40" width="7" height="22" rx="3.5" fill="#1e293b"/>
    <!-- Hiking Boots -->
    <path d="M 12 60 L 22 60 L 22 64 L 10 64 Z" fill="#b45309"/>
    <path d="M 23 60 L 33 60 L 35 64 L 21 64 Z" fill="#b45309"/>

    <!-- Torso / Jacket -->
    <path d="M 13 18 C 13 15, 33 15, 33 18 L 35 42 C 35 44, 11 44, 13 42 Z" fill="url(#jacketGrad)"/>
    <!-- Jacket Zipper Line -->
    <line x1="23" y1="18" x2="23" y2="42" stroke="#fce7f3" stroke-width="1.5"/>

    <!-- Arms (One hand on hip, one pointing forward at the challenge) -->
    <!-- Left arm (on hip) -->
    <path d="M 13 20 C 8 22, 6 28, 12 32" stroke="#ec4899" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Right arm (pointing firmly toward the mountain) -->
    <path d="M 33 20 C 42 22, 48 24, 52 20" stroke="#be185d" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Pointing hand -->
    <circle cx="53" cy="19" r="3.5" fill="#fbcfe8"/>

    <!-- Head & Face (Profile/Semi-profile looking up & right) -->
    <circle cx="23" cy="10" r="9" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 14 10 C 14 3, 25 2, 31 8 C 32 6, 28 4, 22 4 C 16 4, 13 7, 14 10 Z" fill="#1e293b"/>
    <!-- Determined Eye / Expression -->
    <path d="M 26 9 L 29 10" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 25 13 Q 28 15 31 13" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Confident smile -->

    <!-- Adventure Headband / Cap -->
    <path d="M 14 7 C 19 5, 27 5, 32 8 L 31 10 C 26 7, 19 7, 14 9 Z" fill="#38bdf8"/>
  </g>

  <!-- Atmospheric Light Beams / Dramatic Lighting -->
  <polygon points="120,0 240,120 240,90 100,0" fill="url(#glowGrad)" style="mix-blend-mode: screen;" pointer-events="none"/>
  <polygon points="160,0 240,60 240,40 140,0" fill="url(#glowGrad)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Floating Dust / Energy Particles -->
  <circle cx="130" cy="120" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="150" cy="100" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="115" cy="140" r="2.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="170" cy="135" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="140" cy="75" r="2" fill="#fef3c7" opacity="0.9"/>
</svg>