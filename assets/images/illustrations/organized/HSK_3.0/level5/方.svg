<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Table Legs -->
    <rect x="20" y="100" width="12" height="60" fill="#fb923c" rx="2"/>
    <rect x="128" y="100" width="12" height="60" fill="#fb923c" rx="2"/>
    
    <!-- Table Top (Square) -->
    <path d="M0 80 L160 80 L140 100 L-20 100 Z" fill="#f59e0b"/>
    <path d="M0 80 L160 80 L160 90 L0 90 Z" fill="#d97706"/>
    <path d="M160 80 L140 100 L140 90 L160 80 Z" fill="#b45309"/>
    
    <!-- Objects on table -->
    <rect x="30" y="40" width="40" height="40" fill="#38bdf8" rx="4"/>
    <circle cx="110" cy="60" r="15" fill="#ec4899"/>
    
    <!-- Ambient details -->
    <circle cx="10" cy="20" r="3" fill="#fbbf24" opacity="0.5"/>
    <circle cx="150" cy="10" r="2" fill="#fbbf24" opacity="0.3"/>
  </g>
  
  <!-- Floor shadow -->
  <ellipse cx="120" cy="170" rx="80" ry="10" fill="#0f172a" opacity="0.4"/>
</svg>