<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Trend Graph Background Elements -->
  <path d="M40 180 L120 120 L200 60" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Main Subject: A stylized upward-trending digital tablet on a desk -->
  <rect x="60" y="80" width="120" height="90" rx="8" fill="#334155"/>
  <rect x="65" y="85" width="110" height="80" rx="4" fill="#0f172a"/>
  
  <!-- The 'Trend' Line (The visual representation of 趋势) -->
  <path d="M75 140 C 90 140, 100 130, 115 120 C 130 110, 140 90, 165 80" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glowing Data Point -->
  <circle cx="165" cy="80" r="6" fill="#fbbf24"/>
  <circle cx="165" cy="80" r="12" fill="#fbbf24" fill-opacity="0.2"/>
  
  <!-- Supporting Props: Coffee cup and notebook -->
  <rect x="185" y="150" width="30" height="40" rx="4" fill="#fb923c"/>
  <circle cx="200" cy="140" r="10" fill="#fb923c"/>
  
  <rect x="20" y="160" width="40" height="50" rx="4" fill="#64748b"/>
  <path d="M25 170 L55 170 M25 185 L55 185 M25 200 L55 200" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Decorative floating particles -->
  <circle cx="40" cy="60" r="3" fill="#38bdf8"/>
  <circle cx="200" cy="40" r="4" fill="#ec4899"/>
  <circle cx="150" cy="200" r="2" fill="#fbbf24"/>
</svg>