<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Canvas Wood Texture / Base -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Palette Wood -->
    <linearGradient id="paletteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Paint Drops / Blobs Gradients -->
    <linearGradient id="cyanPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="pinkPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="yellowPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="purplePaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Studio Background Elements (Ambient Art Props) -->
  <g opacity="0.4">
    <!-- Hanging sketch papers on string in background -->
    <line x1="30" y1="30" x2="210" y2="40" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- Mini sketch 1 -->
    <polygon points="50,34 80,36 78,65 48,63" fill="#334155" />
    <!-- Mini sketch 2 -->
    <polygon points="120,37 150,39 148,68 118,66" fill="#334155" />
  </g>

  <!-- Wooden Table Surface -->
  <path d="M 0 180 Q 120 170 240 180 L 240 240 L 0 240 Z" fill="#090d16" />
  <path d="M 0 176 L 240 176 L 240 182 L 0 182 Z" fill="#334155" opacity="0.3" />

  <!-- MAIN SCENE: Easel and Canvas (Centerpiece for '美术' - Art/Fine Arts) -->
  <g filter="url(#shadow)">
    <!-- Easel Legs & Structure -->
    <!-- Back leg -->
    <line x1="120" y1="50" x2="120" y2="190" stroke="#92400e" stroke-width="6" stroke-linecap="round" />
    <!-- Front Left Leg -->
    <line x1="120" y1="120" x2="60" y2="200" stroke="#b45309" stroke-width="6" stroke-linecap="round" />
    <!-- Front Right Leg -->
    <line x1="120" y1="120" x2="180" y2="200" stroke="#b45309" stroke-width="6" stroke-linecap="round" />

    <!-- Easel Shelf / Support -->
    <rect x="65" y="155" width="110" height="8" rx="3" fill="#d97706" />

    <!-- Canvas Base -->
    <rect x="75" y="65" width="90" height="100" rx="4" fill="#f8fafc" />
    <!-- Canvas Inner border / frame depth -->
    <rect x="75" y="65" width="90" height="100" rx="4" fill="none" stroke="#cbd5e1" stroke-width="2" />

    <!-- Painting on Canvas (Vivid Landscape Art to represent fine art) -->
    <!-- Sky & Sun -->
    <path d="M 77 67 L 163 67 L 163 120 L 77 120 Z" fill="#fef08a" />
    <circle cx="135" cy="90" r="12" fill="#fb923c" />
    
    <!-- Mountains -->
    <polygon points="77,130 110,95 140,130" fill="#cbd5e1" />
    <polygon points="115,130 145,85 175,130" fill="#94a3b8" />
    <polygon points="90,130 120,105 160,130" fill="#64748b" />

    <!-- Hills / Ground on canvas -->
    <path d="M 77 125 Q 110 115 163 130 L 163 163 L 77 163 Z" fill="#10b981" />
    <!-- River/Stream flowing -->
    <path d="M 125 130 Q 120 145 105 163 L 115 163 Q 130 145 133 130 Z" fill="#38bdf8" />

    <!-- Artistic Brushstroke Flourish across canvas -->
    <path d="M 85 80 Q 110 60 140 100 T 155 140" fill="none" stroke="url(#pinkPaint)" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Foreground Props: Wooden Artist's Palette with Paint Blobs -->
  <g transform="translate(30, 145) rotate(-10)" filter="url(#shadow)">
    <!-- Palette Board -->
    <ellipse cx="40" cy="30" rx="38" ry="26" fill="url(#paletteGrad)" stroke="#78350f" stroke-width="2" />
    <!-- Thumb Hole -->
    <ellipse cx="20" cy="32" rx="7" ry="10" fill="#0f172a" />

    <!-- Paint Blobs on Palette -->
    <!-- Cyan -->
    <circle cx="55" cy="15" r="7" fill="url(#cyanPaint)" />
    <!-- Pink -->
    <circle cx="68" cy="28" r="8" fill="url(#pinkPaint)" />
    <!-- Yellow -->
    <circle cx="58" cy="42" r="7" fill="url(#yellowPaint)" />
    <!-- Purple -->
    <circle cx="38" cy="46" r="6" fill="url(#purplePaint)" />
  </g>

  <!-- Foreground Props: Jar of Paint Brushes (Right Side) -->
  <g transform="translate(170, 120)" filter="url(#shadow)">
    <!-- Glass Jar -->
    <path d="M 10 15 L 12 65 C 12 70 16 74 22 74 L 38 74 C 44 74 48 70 48 65 L 50 15 Z" fill="#94a3b8" fill-opacity="0.3" stroke="#cbd5e1" stroke-width="2" />
    <path d="M 10 20 L 50 20" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
    
    <!-- Liquid in jar -->
    <path d="M 13 45 L 47 45 C 47 60 44 71 38 72 L 22 72 C 16 71 13 60 13 45 Z" fill="#38bdf8" fill-opacity="0.4" />

    <!-- Paintbrush 1 (Long, Red Handle) -->
    <line x1="20" y1="74" x2="5" y2="-15" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />
    <path d="M 4 -15 C 4 -22 6 -25 5 -28 C 4 -25 6 -22 6 -15 Z" fill="#1e293b" /> <!-- Bristles -->

    <!-- Paintbrush 2 (Medium, Yellow Handle) -->
    <line x1="30" y1="74" x2="35" y2="-25" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
    <path d="M 33 -25 C 33 -32 37 -36 35 -40 C 33 -36 37 -32 37 -25 Z" fill="#f43f5e" /> <!-- Dipped Bristles -->

    <!-- Paintbrush 3 (Short, Blue Handle, angled) -->
    <line x1="40" y1="74" x2="60" y2="-5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 59 -5 C 64 -10 68 -12 71 -14 C 67 -11 63 -8 58 -4 Z" fill="#ffffff" />
  </g>

  <!-- Dynamic Flying Paint Splatters / Sparks (Action-packed art vibe) -->
  <g>
    <!-- Splatter 1 (Top Left) -->
    <circle cx="55" cy="55" r="3" fill="#38bdf8" />
    <circle cx="45" cy="62" r="1.5" fill="#38bdf8" />
    <circle cx="62" cy="48" r="2" fill="#38bdf8" />

    <!-- Splatter 2 (Top Right) -->
    <circle cx="185" cy="65" r="3.5" fill="#f43f5e" />
    <circle cx="195" cy="58" r="2" fill="#f43f5e" />
    <circle cx="178" cy="72" r="1.5" fill="#f43f5e" />

    <!-- Splatter 3 (Near palette) -->
    <circle cx="20" cy="130" r="2.5" fill="#fbbf24" />
    <circle cx="28" cy="122" r="1.5" fill="#fbbf24" />
  </g>
</svg>