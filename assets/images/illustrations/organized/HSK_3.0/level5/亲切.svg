<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Character 1 Gradients (Warm/Friendly) -->
    <linearGradient id="c1-sweater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="c1-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Character 2 Gradients (Gentle/Welcoming) -->
    <linearGradient id="c2-sweater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="c2-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <!-- Warm Ambient Lighting overlay -->
    <radialGradient id="lamp-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  
  <!-- Ambient Overhead Glow -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" pointer-events="none"/>

  <!-- ROOM ENVIRONMENT & PROPS -->
  <!-- Back Wall Decor / Window -->
  <g opacity="0.8">
    <!-- Window Frame -->
    <rect x="140" y="30" width="60" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="144" y="34" width="52" height="67" rx="4" fill="url(#window-glow)"/>
    <!-- Window Cross Bars -->
    <line x1="170" y1="34" x2="170" y2="101" stroke="#334155" stroke-width="2"/>
    <line x1="144" y1="67" x2="196" y2="67" stroke="#334155" stroke-width="2"/>
    <!-- Soft Stars/Night outside window -->
    <circle cx="155" cy="45" r="1" fill="#fff" opacity="0.6"/>
    <circle cx="185" cy="55" r="1.5" fill="#fff" opacity="0.8"/>
    <circle cx="160" cy="85" r="1" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Bookshelf / Wall Shelf on Left -->
  <g>
    <rect x="25" y="45" width="50" height="6" rx="2" fill="#475569"/>
    <!-- Books on shelf -->
    <rect x="30" y="25" width="8" height="20" rx="1" fill="#ec4899"/>
    <rect x="39" y="27" width="6" height="18" rx="1" fill="#38bdf8"/>
    <rect x="47" y="22" width="10" height="23" rx="1" fill="#f59e0b"/>
    <!-- Hanging plant from shelf -->
    <path d="M 65 51 Q 60 65 55 75" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <circle cx="53" cy="74" r="4" fill="url(#leaf-grad)"/>
    <circle cx="58" cy="68" r="3" fill="url(#leaf-grad)"/>
  </g>

  <!-- Floor/Rug Surface -->
  <path d="M 15 195 C 60 185, 180 185, 225 195 L 235 225 C 180 235, 60 235, 5 225 Z" fill="#334155" opacity="0.4"/>
  <ellipse cx="120" cy="205" rx="90" ry="18" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.8"/>

  <!-- Potted Plant in Corner (Right) -->
  <g transform="translate(195, 140)">
    <!-- Pot -->
    <path d="M 5 25 L 15 45 C 15 47, 5 47, 5 45 Z" fill="#64748b"/>
    <ellipse cx="10" cy="25" rx="6" ry="2" fill="#94a3b8"/>
    <!-- Stems & Leaves -->
    <path d="M 10 25 Q 5 10 0 5" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 25 Q 18 8 22 2" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 25 Q 12 12 15 0" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="5" r="5" fill="url(#leaf-grad)"/>
    <circle cx="22" cy="2" r="4" fill="url(#leaf-grad)"/>
    <circle cx="15" cy="0" r="6" fill="url(#leaf-grad)"/>
  </g>

  <!-- MAIN SUBJECT: Two Friends Sharing a Warm, Close Moment -->
  <g id="characters-group" transform="translate(0, 10)">
    
    <!-- Couch / Sofa Backrest -->
    <path d="M 50 120 C 50 100, 190 100, 190 120 L 195 175 C 195 185, 185 195, 175 195 L 65 195 C 55 195, 45 185, 45 175 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Sofa Cushion Highlights -->
    <path d="M 60 130 C 60 120, 120 120, 120 130 L 120 185 L 65 185 C 57 185, 55 175, 55 165 Z" fill="#475569" opacity="0.5"/>
    <path d="M 120 130 C 120 120, 180 120, 180 130 L 175 165 C 175 175, 173 185, 165 185 L 120 185 Z" fill="#475569" opacity="0.3"/>

    <!-- CHARACTER 1 (Left: Warm, Expressive, Leaning In) -->
    <g id="character-left" transform="translate(75, 95)">
      <!-- Body & Sweater -->
      <path d="M -15 65 C -25 50, -20 30, 0 30 C 20 30, 25 50, 15 65 Z" fill="url(#c1-sweater)"/>
      <path d="M -15 65 L 15 65 L 20 95 L -20 95 Z" fill="#c2410c"/> <!-- Lower torso -->
      <path d="M -15 35 C -5 32, 5 32, 15 35 C 12 42, -12 42, -15 35 Z" fill="#fdba74"/> <!-- Collar bone / neck area -->

      <!-- Head & Neck -->
      <path d="M -5 30 L 5 30 L 7 40 L -7 40 Z" fill="#fcd34d"/> <!-- Neck -->
      <circle cx="0" cy="15" r="18" fill="#fde047"/> <!-- Face base -->

      <!-- Hair C1 -->
      <path d="M -18 15 C -20 -5, -5 -8, 2 -8 C 12 -8, 18 -2, 19 12 C 16 5, 8 2, -2 3 C -10 4, -16 8, -18 15 Z" fill="url(#c1-hair)"/>
      <circle cx="-14" cy="14" r="5" fill="#78350f"/>
      <circle cx="15" cy="14" r="4" fill="#78350f"/>

      <!-- Facial Expression: Warm Happy Eyes & Big Smile -->
      <!-- Left Eye (Happy arc) -->
      <path d="M -7 12 C -5 10, -3 10, -1 12" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <!-- Right Eye (Winking/Happy arc leaning towards friend) -->
      <path d="M 3 12 C 5 10, 7 10, 9 12" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <!-- Cheeks (Blush) -->
      <circle cx="-9" cy="17" r="3.5" fill="#f43f5e" opacity="0.4"/>
      <circle cx="5" cy="17" r="3.5" fill="#f43f5e" opacity="0.4"/>
      <!-- Smile -->
      <path d="M -3 20 C -1 23, 3 23, 5 20" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

      <!-- Arms / Gestures (Leaning and hugging/pointing closely) -->
      <!-- Left Arm resting -->
      <path d="M -15 45 C -25 50, -25 65, -15 70" fill="none" stroke="url(#c1-sweater)" stroke-width="8" stroke-linecap="round"/>
      <!-- Right Arm reaching affectionately towards friend's shoulder -->
      <path d="M 12 40 C 25 45, 35 35, 45 42" fill="none" stroke="url(#c1-sweater)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="45" cy="42" r="4.5" fill="#fde047"/> <!-- Hand -->
    </g>

    <!-- CHARACTER 2 (Right: Comfortable, Smiling Back, Closer Proximity) -->
    <g id="character-right" transform="translate(150, 90)">
      <!-- Body & Sweater -->
      <path d="M -15 70 C -25 55, -20 35, 0 35 C 20 35, 25 55, 15 70 Z" fill="url(#c2-sweater)"/>
      <path d="M -15 70 L 15 70 L 20 100 L -20 100 Z" fill="#0369a1"/>
      <path d="M -12 38 C -4 35, 4 35, 12 38 C 10 44, -10 44, -12 38 Z" fill="#bae6fd"/>

      <!-- Head & Neck -->
      <path d="M -4 32 L 4 32 L 6 42 L -6 42 Z" fill="#fde047"/>
      <circle cx="0" cy="17" r="17" fill="#fef08a"/>

      <!-- Hair C2 (Soft Bob/Short Hair) -->
      <path d="M -17 12 C -18 -4, -8 -8, 2 -8 C 14 -8, 18 -2, 18 16 C 14 18, 10 12, 4 14 C -4 15, -12 12, -17 12 Z" fill="url(#c2-hair)"/>
      
      <!-- Facial Expression: Gentle, Affectionate -->
      <!-- Left Eye (Gentle open curve) -->
      <path d="M -7 14 C -5 12, -3 12, -1 14" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Right Eye -->
      <path d="M 3 14 C 5 12, 7 12, 9 14" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Cheeks -->
      <circle cx="-8" cy="18" r="3" fill="#fb7185" opacity="0.5"/>
      <circle cx="6" cy="18" r="3" fill="#fb7185" opacity="0.5"/>
      <!-- Sweet Smile -->
      <path d="M -2 21 C 0 23, 2 23, 4 21" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Arms / Gestures -->
      <!-- Left arm gesturing/holding cup or cozy hand gesture -->
      <path d="M -12 45 C -25 50, -25 65, -18 75" fill="none" stroke="url(#c2-sweater)" stroke-width="8" stroke-linecap="round"/>
      <!-- Right arm tucked comfortably -->
      <path d="M 12 45 C 20 50, 20 65, 10 75" fill="none" stroke="url(#c2-sweater)" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Coffee Table in foreground with warm mugs representing hospitality/closeness -->
    <g transform="translate(100, 160)">
      <!-- Table top ellipse -->
      <ellipse cx="20" cy="15" rx="35" ry="12" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
      <ellipse cx="20" cy="13" rx="33" ry="10" fill="#334155"/>
      <!-- Table Legs -->
      <path d="M -8 18 L -15 35" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <path d="M 48 18 L 55 35" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

      <!-- Mug 1 (Hot drink with steam) -->
      <path d="M 5 6 L 15 6 L 14 16 L 6 16 Z" fill="#f43f5e"/>
      <path d="M 15 8 C 18 8, 18 13, 15 14" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
      <!-- Steam lines -->
      <path d="M 8 2 Q 10 0, 8 -3" fill="none" stroke="#fff" stroke-width="1" opacity="0.6" stroke-linecap="round"/>

      <!-- Mug 2 -->
      <path d="M 22 8 L 30 8 L 29 17 L 23 17 Z" fill="#38bdf8"/>
      <path d="M 30 10 C 33 10, 33 14, 30 15" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Steam lines -->
      <path d="M 26 4 Q 24 2, 26 -1" fill="none" stroke="#fff" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
    </g>

  </g>

  <!-- ATMOSPHERIC ACCENTS: Floating Warm Hearts & Sparkles representing 'Thân thiết / Gần gũi' -->
  <g id="warm-accents" opacity="0.9">
    <!-- Heart 1 (Between heads) -->
    <path d="M 115 70 C 112 65, 105 65, 105 72 C 105 78, 112 83, 115 87 C 118 83, 125 78, 125 72 C 125 65, 118 65, 115 70 Z" fill="#f43f5e" transform="scale(0.8) translate(35, 15)"/>
    
    <!-- Sparkles -->
    <path d="M 95 60 L 97 65 L 102 67 L 97 69 L 95 74 L 93 69 L 88 67 L 93 65 Z" fill="#fde047"/>
    <path d="M 145 75 L 146.5 78.5 L 150 80 L 146.5 81.5 L 145 85 L 143.5 81.5 L 140 80 L 143.5 78.5 Z" fill="#fde047" transform="scale(0.7) translate(60, 20)"/>
    
    <!-- Cozy glowing dots -->
    <circle cx="80" cy="50" r="2" fill="#fbbf24" opacity="0.8"/>
    <circle cx="165" cy="55" r="1.5" fill="#f43f5e" opacity="0.7"/>
    <circle cx="125" cy="45" r="2.5" fill="#38bdf8" opacity="0.6"/>
  </g>

</svg>