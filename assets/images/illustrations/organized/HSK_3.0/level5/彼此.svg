<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Person A -->
    <g transform="translate(0, 20)">
      <circle cx="40" cy="40" r="30" fill="#f59e0b"/>
      <path d="M25 40 Q40 55 55 40" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="35" r="3" fill="#0f172a"/>
      <circle cx="50" cy="35" r="3" fill="#0f172a"/>
    </g>
    
    <!-- Person B -->
    <g transform="translate(120, 20)">
      <circle cx="40" cy="40" r="30" fill="#38bdf8"/>
      <path d="M25 40 Q40 55 55 40" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="35" r="3" fill="#0f172a"/>
      <circle cx="50" cy="35" r="3" fill="#0f172a"/>
    </g>

    <!-- Interaction Arrows -->
    <path d="M75 50 C90 30, 110 30, 125 50" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
    <path d="M125 70 C110 90, 90 90, 75 70" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
    
    <!-- Decorative Elements -->
    <circle cx="100" cy="20" r="4" fill="#ec4899"/>
    <circle cx="140" cy="100" r="3" fill="#fb923c"/>
    <circle cx="60" cy="100" r="5" fill="#38bdf8" opacity="0.3"/>
  </g>

  <!-- Table surface -->
  <rect x="20" y="160" width="200" height="10" rx="5" fill="#334155"/>
  <rect x="30" y="170" width="180" height="20" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2"/>
</svg>