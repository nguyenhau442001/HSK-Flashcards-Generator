<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Tripod Legs -->
  <path d="M80 160 L60 220 M160 160 L180 220" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Camera Body -->
  <rect x="85" y="100" width="70" height="50" rx="6" fill="#475569"/>
  <circle cx="120" cy="125" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  
  <!-- Adjustment Knob (The Action) -->
  <circle cx="150" cy="110" r="8" fill="#fb923c"/>
  <path d="M150 102 L150 95 M150 118 L150 125 M142 110 L135 110 M158 110 L165 110" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Focus/Light Beam -->
  <path d="M120 125 L200 40 L220 60 Z" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Ambient Props -->
  <circle cx="40" cy="180" r="15" fill="#10b981"/>
  <rect x="190" y="180" width="20" height="30" rx="4" fill="#ec4899"/>
  
  <!-- Hand adjusting the knob -->
  <path d="M150 110 L165 100 L170 105 L155 115 Z" fill="#fcd34d"/>
  <circle cx="170" cy="102" r="6" fill="#fcd34d"/>
</svg>