<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Lens Gradient -->
    <linearGradient id="lens-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glass-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.3" />
    </linearGradient>

    <!-- Amber Glow (Visibility/Discovery) -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light Effect -->
  <circle cx="120" cy="110" r="80" fill="url(#amber-glow)" />

  <!-- SCENE: Workbench / Map surface in background -->
  <g transform="translate(0, 10)">
    <!-- Wooden Desk Surface -->
    <path d="M 20 160 L 220 160 L 230 210 L 10 210 Z" fill="#0f172a" opacity="0.6" />
    <path d="M 25 165 L 215 165 L 223 205 L 17 205 Z" fill="#1e293b" opacity="0.8" />

    <!-- Map/Blueprint Background with Details -->
    <g opacity="0.4" stroke="#64748b" stroke-width="1.5" fill="none">
      <path d="M 50 140 Q 90 120 140 135 T 200 125" />
      <path d="M 70 150 Q 110 135 150 145" />
      <circle cx="140" cy="95" r="35" stroke-dasharray="4 4" />
      <path d="M 130 95 L 150 95 M 140 85 L 140 105" />
    </g>

    <!-- Hidden Clue / Document underneath -->
    <g transform="translate(110, 85) rotate(15)" filter="url(#shadow)">
      <!-- Paper sheet -->
      <rect x="-30" y="-35" width="60" height="70" rx="4" fill="#f8fafc" />
      <!-- Document lines and tiny data -->
      <line x1="-20" y1="-20" x2="10" y2="-20" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <line x1="-20" y1="0" x2="0" y2="0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      
      <!-- Vivid revealed fingerprint / target in bright teal/emerald -->
      <circle cx="5" cy="18" r="10" fill="#10b981" opacity="0.2" />
      <circle cx="5" cy="18" r="6" fill="#10b981" opacity="0.8" />
      <path d="M 3 15 Q 5 13 7 16 Q 8 19 5 21" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Additional background props (Compass/Gear) -->
    <circle cx="60" cy="115" r="14" fill="#334155" stroke="#475569" stroke-width="2" />
    <circle cx="60" cy="115" r="5" fill="#f59e0b" />
  </g>

  <!-- FOREGROUND SUBJECT: Magnifying Glass ("Clearly visible" concept) -->
  <!-- Main handle and lens angled across the scene -->
  <g filter="url(#shadow)" transform="translate(10, 0)">
    <!-- Handle -->
    <g transform="rotate(-35, 75, 155)">
      <!-- Metallic connector/ferrule -->
      <rect x="68" y="145" width="14" height="20" rx="3" fill="#94a3b8" />
      <rect x="71" y="145" width="8" height="20" fill="#cbd5e1" />
      
      <!-- Wooden/Modern grip -->
      <rect x="65" y="165" width="20" height="55" rx="10" fill="#f59e0b" />
      <rect x="69" y="165" width="6" height="55" fill="#fbbf24" />
      <!-- Handle end cap -->
      <path d="M 65 210 Q 75 220 85 210 Z" fill="#d97706" />
    </g>

    <!-- Lens Rim (Outer) -->
    <circle cx="125" cy="95" r="50" fill="url(#lens-rim)" />
    <!-- Lens Rim (Inner dark bezel) -->
    <circle cx="125" cy="95" r="44" fill="#0f172a" />

    <!-- Magnified Viewing Area (Closer to light/focus) -->
    <circle cx="125" cy="95" r="40" fill="#1e293b" />
    <circle cx="125" cy="95" r="40" fill="url(#amber-glow)" opacity="0.8" />

    <!-- REVEALED CONTENT INSIDE LENS (Sharp, high contrast, colorful details) -->
    <g clip-path="url(#lens-clip)">
      <clipPath id="lens-clip">
        <circle cx="125" cy="95" r="40" />
      </clipPath>

      <!-- Grid lines inside lens showing analysis -->
      <path d="M 125 55 L 125 135 M 85 95 L 165 95" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4" />

      <!-- Magnified Document snippet -->
      <g transform="translate(105, 75) rotate(15)">
        <rect x="-15" y="-15" width="40" height="48" rx="2" fill="#ffffff" />
        <line x1="-10" y1="-8" x2="15" y2="-8" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
        <line x1="-10" y1="8" x2="5" y2="8" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
        
        <!-- Big bright checkmark / discovery icon inside lens -->
        <circle cx="12" cy="22" r="10" fill="#10b981" />
        <path d="M 7 22 L 10 25 L 18 17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
      
      <!-- Sparkles / Clarity bursts inside lens -->
      <path d="M 95 70 L 98 78 L 106 81 L 98 84 L 95 92 L 92 84 L 84 81 L 92 78 Z" fill="#fbbf24" />
      <path d="M 145 110 L 147 115 L 152 117 L 147 119 L 145 124 L 143 119 L 138 117 L 143 115 Z" fill="#38bdf8" />
    </g>

    <!-- Glass Reflection Overlay (Crescent shape across upper left of lens) -->
    <path d="M 90 70 A 40 40 0 0 1 155 75 A 44 44 0 0 0 100 60 Z" fill="url(#glass-shine)" />
  </g>

  <!-- Floating Sparkles / Ambient Vector Details outside -->
  <g>
    <!-- Top right warm sparkle -->
    <path d="M 190 40 L 193 50 L 203 53 L 193 56 L 190 66 L 187 56 L 177 53 L 187 50 Z" fill="#fbbf24" opacity="0.9" />
    
    <!-- Left floating bubble / particle -->
    <circle cx="45" cy="70" r="5" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="85" r="3" fill="#10b981" opacity="0.8" />

    <!-- Small energetic cross/plus accents -->
    <path d="M 205 120 L 215 120 M 210 115 L 210 125" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 35 150 L 43 150 M 39 146 L 39 154" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>