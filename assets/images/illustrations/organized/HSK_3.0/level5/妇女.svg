<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 40)">
    <!-- Desk Surface -->
    <rect x="0" y="140" width="160" height="10" fill="#334155" rx="2"/>
    
    <!-- Laptop -->
    <path d="M20 140 L140 140 L130 110 L30 110 Z" fill="#475569"/>
    <rect x="35" y="115" width="90" height="20" fill="#38bdf8" rx="2"/>
    
    <!-- The Woman (Subject) -->
    <g transform="translate(60, 30)">
      <!-- Body -->
      <path d="M-20 110 C-20 80, 0 70, 20 70 C40 70, 60 80, 60 110 L60 110 Z" fill="#fb923c"/>
      <!-- Head -->
      <circle cx="20" cy="45" r="25" fill="#fde68a"/>
      <!-- Hair -->
      <path d="M-5 45 C-5 20, 10 10, 20 10 C30 10, 45 20, 45 45 L45 60 C45 75, 35 80, 20 80 C5 80, -5 75, -5 60 Z" fill="#1e293b"/>
      <!-- Glasses -->
      <circle cx="10" cy="45" r="6" fill="none" stroke="#10b981" stroke-width="2"/>
      <circle cx="30" cy="45" r="6" fill="none" stroke="#10b981" stroke-width="2"/>
      <line x1="16" y1="45" x2="24" y2="45" stroke="#10b981" stroke-width="2"/>
    </g>
    
    <!-- Decorative elements -->
    <circle cx="10" cy="20" r="8" fill="#ec4899"/>
    <rect x="130" y="50" width="15" height="40" fill="#f59e0b" rx="4"/>
    <circle cx="140" cy="100" r="5" fill="#38bdf8"/>
  </g>
</svg>