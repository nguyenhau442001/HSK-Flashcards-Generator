<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Shadow of the character -->
  <ellipse cx="120" cy="210" rx="60" ry="15" fill="#0f172a" opacity="0.4"/>
  
  <!-- The Character: A nervous person peeking from behind a door -->
  <g transform="translate(40, 60)">
    <!-- Door frame -->
    <rect x="0" y="0" width="160" height="160" rx="8" fill="#334155"/>
    <path d="M10 10h140v140H10z" fill="#1e293b"/>
    
    <!-- Character body (peeking) -->
    <path d="M110 160c0-30 20-50 50-50v80H110z" fill="#fbbf24"/>
    <circle cx="135" cy="90" r="25" fill="#fbbf24"/>
    
    <!-- Nervous eyes -->
    <circle cx="125" cy="85" r="4" fill="#0f172a"/>
    <circle cx="145" cy="85" r="4" fill="#0f172a"/>
    
    <!-- Trembling lines -->
    <path d="M165 90l10-5M165 100l12-2" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Contextual props: A scary shadow on the floor -->
  <path d="M20 180l40-30 20 20 30-40" stroke="#ec4899" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Ambient light glow -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.05"/>
</svg>