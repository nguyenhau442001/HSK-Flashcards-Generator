<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Classroom Desk -->
  <rect x="40" y="160" width="160" height="20" rx="4" fill="#475569"/>
  <rect x="50" y="180" width="10" height="40" fill="#334155"/>
  <rect x="180" y="180" width="10" height="40" fill="#334155"/>
  
  <!-- Teacher (The one scolding) -->
  <g transform="translate(150, 60)">
    <circle cx="20" cy="20" r="20" fill="#f59e0b"/>
    <path d="M10 25 Q20 35 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="0" y="40" width="40" height="60" rx="10" fill="#38bdf8"/>
    <path d="M40 50 L70 40 L60 70" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Student (The one being scolded) -->
  <g transform="translate(50, 90)">
    <circle cx="20" cy="20" r="20" fill="#fb923c"/>
    <path d="M10 30 Q20 25 30 30" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="5" y="40" width="30" height="70" rx="10" fill="#ec4899"/>
    <circle cx="20" cy="15" r="3" fill="#0f172a"/>
    <circle cx="28" cy="15" r="3" fill="#0f172a"/>
  </g>
  
  <!-- Scolding Action Lines -->
  <path d="M140 80 L100 100" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M140 90 L100 110" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 4"/>
  
  <!-- Props: Fallen Paper -->
  <rect x="70" y="150" width="30" height="40" rx="2" fill="#f1f5f9"/>
  <path d="M75 160 L95 160 M75 170 L95 170" stroke="#94a3b8" stroke-width="2"/>
</svg>