<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#0f172a" opacity="0.5"/>
  
  <!-- Microphone Stand -->
  <path d="M120 120 L120 200 M100 200 L140 200" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Microphone -->
  <circle cx="120" cy="100" r="25" fill="#38bdf8"/>
  <rect x="110" y="75" width="20" height="15" rx="4" fill="#38bdf8"/>
  <ellipse cx="120" cy="100" rx="15" ry="18" fill="#0f172a" opacity="0.2"/>
  
  <!-- Sound Waves -->
  <path d="M150 100 Q165 80 180 100 T210 100" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M150 120 Q165 140 180 120 T210 120" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Headphones -->
  <path d="M70 110 A 30 30 0 0 1 170 110" stroke="#ec4899" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="70" cy="125" r="12" fill="#ec4899"/>
  <circle cx="170" cy="125" r="12" fill="#ec4899"/>
  
  <!-- Studio Light/Indicator -->
  <circle cx="40" cy="40" r="8" fill="#10b981"/>
  <circle cx="40" cy="40" r="12" fill="#10b981" opacity="0.2"/>
  
  <!-- Mixer Knobs -->
  <rect x="20" y="180" width="40" height="40" rx="4" fill="#334155"/>
  <circle cx="40" cy="200" r="6" fill="#fb923c"/>
  <rect x="70" y="180" width="40" height="40" rx="4" fill="#334155"/>
  <circle cx="90" cy="200" r="6" fill="#38bdf8"/>
</svg>