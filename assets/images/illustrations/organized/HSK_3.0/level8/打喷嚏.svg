<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="0" y="180" width="240" height="60" fill="#334155" rx="10"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 140 C 40 100, 80 100, 80 140 L 80 160 L 40 160 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="80" r="35" fill="#fde68a"/>
    <!-- Closed Eyes -->
    <path d="M45 75 L 55 80 M 45 80 L 55 75" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M65 75 L 75 80 M 65 80 L 75 75" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M58 85 L 62 85" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <!-- Mouth (Sneeze expression) -->
    <path d="M50 100 Q 60 110 70 100" stroke="#1e293b" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Sneeze Effect (Action Lines/Particles) -->
  <g fill="#fbbf24">
    <circle cx="140" cy="90" r="4" opacity="0.8"/>
    <circle cx="150" cy="80" r="6" opacity="0.6"/>
    <circle cx="160" cy="100" r="3" opacity="0.9"/>
    <path d="M130 90 Q 150 70 170 90" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Context Props -->
  <rect x="170" y="150" width="40" height="50" rx="4" fill="#ec4899"/>
  <rect x="175" y="155" width="30" height="5" rx="2" fill="#fff"/>
  <rect x="175" y="165" width="30" height="5" rx="2" fill="#fff"/>
  <rect x="175" y="175" width="30" height="5" rx="2" fill="#fff"/>
  
  <circle cx="30" cy="190" r="15" fill="#10b981"/>
</svg>