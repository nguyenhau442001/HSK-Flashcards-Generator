<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mug Ceramic Gradient -->
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Warm Amber Glow for Confusion/Dizziness -->
    <radialGradient id="dizzy-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Blur for hazy effect -->
    <filter id="blur-effect">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting / Spotlight -->
  <circle cx="120" cy="120" r="90" fill="url(#dizzy-glow)"/>

  <!-- Background Environment / Bar Counter -->
  <g id="environment">
    <!-- Wooden/Slate Bar Surface -->
    <rect x="20" y="165" width="200" height="40" rx="6" fill="url(#table-grad)" filter="url(#shadow)"/>
    <rect x="20" y="165" width="200" height="6" fill="#475569" rx="2"/>

    <!-- Background Props: Out-of-focus shelves/bottles (mơ hồ context) -->
    <rect x="40" y="60" width="25" height="70" rx="4" fill="#334155" opacity="0.4"/>
    <path d="M40 75 Q52.5 65 65 75 L65 130 L40 130 Z" fill="#64748b" opacity="0.3"/>
    
    <rect x="180" y="50" width="30" height="80" rx="4" fill="#334155" opacity="0.4"/>
    <path d="M180 65 Q195 55 210 65 L210 130 L180 130 Z" fill="#38bdf8" opacity="0.2"/>

    <!-- Sticky note with scribbles (representing confusion/disorganization) -->
    <g transform="translate(150, 110) rotate(12)" filter="url(#shadow)">
      <rect width="36" height="36" fill="#fef08a" rx="2"/>
      <!-- Scribbled unreadable text -->
      <line x1="6" y1="10" x2="26" y2="12" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="6" y1="18" x2="20" y2="16" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="6" y1="26" x2="30" y2="28" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Main Subject: 'Mơ hồ' (Dizzy/Confused Character & Spilled Drink) -->
  <g id="main-subject" filter="url(#shadow)">
    
    <!-- Spilled Drink / Puddle (Alcohol/Liquid context) -->
    <path d="M85 185 C85 180, 130 175, 160 182 C185 188, 175 200, 140 200 C100 200, 85 190, 85 185 Z" fill="#fb923c" opacity="0.85"/>
    <ellipse cx="145" cy="187" rx="12" ry="5" fill="#fed7aa" opacity="0.9"/>
    <!-- Splatters -->
    <circle cx="75" cy="188" r="3" fill="#fb923c" opacity="0.8"/>
    <circle cx="170" cy="192" r="2" fill="#fb923c" opacity="0.8"/>

    <!-- Knocked-over Ceramic Mug -->
    <g transform="translate(60, 160) rotate(-65)">
      <!-- Mug Body -->
      <path d="M0 0 L25 2 C28 15, 28 25, 25 38 L0 40 Z" fill="url(#mug-grad)"/>
      <!-- Mug Opening / Rim -->
      <ellipse cx="0" cy="20" rx="3" ry="20" fill="#e2e8f0"/>
      <ellipse cx="0" cy="20" rx="1.5" ry="16" fill="#334155"/>
      <!-- Handle -->
      <path d="M8 8 C-2 10, -2 30, 8 32" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Character Head & Upper Body (Leaning/Slumping in confusion) -->
    <g transform="translate(105, 105)">
      
      <!-- Torso / Hoodie (Warm Amber/Orange tone) -->
      <path d="M-35 85 C-35 55, -20 45, 0 45 C20 45, 35 55, 35 85 L45 95 C45 95, -45 95, -35 85 Z" fill="#0284c7"/>
      <!-- Collar -->
      <path d="M-15 45 C-15 55, 15 55, 15 45 Z" fill="#bae6fd"/>

      <!-- Head (Tilted sideways, flushed cheeks) -->
      <g transform="translate(5, 10) rotate(-15)">
        
        <!-- Hair -->
        <path d="M-30 -10 C-35 -35, 15 -45, 30 -20 C38 -10, 42 10, 35 20 C25 15, 20 -5, -10 -15 C-25 -20, -28 -5, -30 -10 Z" fill="#334155"/>
        
        <!-- Face Base -->
        <circle cx="0" cy="0" r="26" fill="#ffedd5"/>

        <!-- Dazed/Blushing Cheeks -->
        <circle cx="-14" cy="6" r="7" fill="#f43f5e" opacity="0.4" filter="url(#blur-effect)"/>
        <circle cx="12" cy="8" r="7" fill="#f43f5e" opacity="0.4" filter="url(#blur-effect)"/>

        <!-- Closed/Dizzy/Confused Eyes (X marks or wavy lines for 'mơ hồ') -->
        <!-- Left Eye: Spiral / Dizzy -->
        <path d="M-14 -4 Q-10 -10, -6 -4 Q-10 2, -14 -4" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <!-- Right Eye: Crosses / Confused -->
        <path d="M6 -7 L16 3 M16 -7 L6 3" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Wavy/Confused Open Mouth -->
        <path d="M-3 12 Q0 8, 4 12 Q7 16, 2 18 Q-2 18, -3 12 Z" fill="#991b1b"/>

        <!-- Eyebrows (Misaligned/Confused expression) -->
        <path d="M-18 -12 L-8 -8" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M8 -10 L18 -14" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Floating Dizzy Symbols / Question Marks (Visualizing 'mơ hồ, lú lẫn') -->
    <g id="dizzy-symbols">
      <!-- Question Mark 1 -->
      <path d="M75 55 C70 45, 90 40, 85 55 C80 65, 75 70, 75 75" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" filter="url(#shadow)"/>
      <circle cx="75" cy="85" r="2.5" fill="#fbbf24"/>

      <!-- Question Mark 2 (Larger, tilted) -->
      <g transform="translate(145, 45) rotate(20)">
        <path d="M15 10 C10 0, 30 -5, 25 10 C20 20, 15 25, 15 30" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#shadow)"/>
        <circle cx="15" cy="40" r="3" fill="#38bdf8"/>
      </g>

      <!-- Swirling Star / Confusion Sparkle -->
      <path d="M120 35 L123 42 L130 45 L123 48 L120 55 L117 48 L110 45 L117 42 Z" fill="#f59e0b" filter="url(#shadow)"/>
      <path d="M65 95 L67 99 L71 101 L67 103 L65 107 L63 103 L59 101 L63 99 Z" fill="#ec4899" filter="url(#shadow)"/>
    </g>
  </g>
</svg>