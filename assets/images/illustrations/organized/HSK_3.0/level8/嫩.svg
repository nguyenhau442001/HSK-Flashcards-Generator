<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Table/Counter Surface Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Cutting Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Meat/Tender Gradient (Representing "嫩" - tender/soft meat) -->
    <linearGradient id="meatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Fat/Marbling Gradient -->
    <linearGradient id="fatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>

    <!-- Knife Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Soft/Squish Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Kitchen Ambiance & Warm Lighting -->
  <circle cx="120" cy="80" r="90" fill="#fbbf24" opacity="0.05" filter="url(#glow)" />
  
  <!-- Back wall / Counter setup -->
  <rect x="0" y="160" width="240" height="80" fill="url(#counterGrad)" />
  <!-- Countertop edge highlight -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2" />

  <!-- Wooden Cutting Board -->
  <g filter="url(#softShadow)">
    <ellipse cx="120" cy="175" rx="85" ry="32" fill="#b45309" opacity="0.3" />
    <path d="M 45 155 Q 120 135 195 155 Q 210 168 195 180 Q 120 200 45 180 Q 30 168 45 155 Z" fill="url(#boardGrad)" />
    <!-- Cutting board inner groove ring -->
    <path d="M 55 160 Q 120 143 185 160 Q 195 168 185 175 Q 120 192 55 175 Q 45 168 55 160 Z" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />
    <!-- Cutting board handle hole -->
    <circle cx="202" cy="167" r="5" fill="#1e293b" opacity="0.6" />
  </g>

  <!-- Main Subject: Tender Meat (Miếng thịt non) with Soft/Juicy physics -->
  <g filter="url(#softShadow)">
    <!-- Meat Drop Shadow on Board -->
    <ellipse cx="115" cy="162" rx="55" ry="18" fill="#881337" opacity="0.4" />

    <!-- Main Meat Cut Body -->
    <path d="M 65 145 C 75 125, 115 120, 145 130 C 175 140, 185 160, 170 175 C 155 190, 85 185, 70 170 C 55 155, 55 165, 65 145 Z" fill="url(#meatGrad)" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" />

    <!-- Tender Marbling Lines (Indicating high quality, soft texture) -->
    <path d="M 85 142 Q 105 148 115 138" fill="none" stroke="url(#fatGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
    <path d="M 125 155 Q 145 145 155 162" fill="none" stroke="url(#fatGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M 80 162 Q 95 172 120 165" fill="none" stroke="url(#fatGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- Juicy Highlight Speculars (Glossy fresh look) -->
    <path d="M 90 133 Q 100 130 110 135" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <circle cx="158" cy="150" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="138" cy="172" r="2" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Interactive Action Element: Chef's Knife pressing into the ultra-tender meat -->
  <g filter="url(#softShadow)" transform="rotate(-15 125 105)">
    <!-- Knife Blade -->
    <path d="M 85 80 L 165 105 L 165 115 L 85 95 Z" fill="url(#bladeGrad)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Sharp Edge Highlight -->
    <line x1="85" y1="80" x2="165" y2="105" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

    <!-- Knife Bolster -->
    <rect x="165" y="103" width="6" height="14" rx="1" fill="#475569" />

    <!-- Wooden/Modern Handle -->
    <path d="M 171 102 L 215 112 C 218 113, 219 116, 216 118 L 171 120 Z" fill="#334155" />
    <circle cx="185" cy="110" r="1.5" fill="#94a3b8" />
    <circle cx="200" cy="113" r="1.5" fill="#94a3b8" />
  </g>

  <!-- Indentation / Squish Effect where knife presses into meat -->
  <ellipse cx="120" cy="138" rx="8" ry="4" fill="#881337" opacity="0.6" />
  <!-- Tiny juice sparkle / droplet flying off -->
  <circle cx="108" cy="122" r="3.5" fill="#38bdf8" opacity="0.8" filter="url(#glow)" />
  <circle cx="108" cy="122" r="1.5" fill="#ffffff" opacity="0.9" />
  
  <circle cx="135" cy="126" r="2" fill="#38bdf8" opacity="0.7" />

  <!-- Fresh Garnish (Sprig of Rosemary / Mint for culinary context) -->
  <g filter="url(#softShadow)" transform="translate(15, 10)">
    <path d="M 50 160 Q 65 140 85 135" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" />
    <!-- Leaves -->
    <path d="M 60 152 C 55 148, 62 142, 68 147 Z" fill="#22c55e" />
    <path d="M 72 143 C 67 135, 76 132, 80 139 Z" fill="#22c55e" />
    <path d="M 55 158 C 50 158, 48 152, 54 150 Z" fill="#16a34a" />
  </g>

  <!-- Atmospheric Lighting Bubbles / Particles -->
  <circle cx="35" cy="70" r="2" fill="#fbbf24" opacity="0.3" />
  <circle cx="205" cy="60" r="3" fill="#38bdf8" opacity="0.2" />
  <circle cx="215" cy="130" r="1.5" fill="#fbbf24" opacity="0.4" />
  <circle cx="25" cy="140" r="2.5" fill="#38bdf8" opacity="0.3" />

</svg>