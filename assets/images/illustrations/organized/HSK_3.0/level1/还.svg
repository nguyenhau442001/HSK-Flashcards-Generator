<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- The "Still Remaining" Subject: A half-eaten apple and a cup with coffee -->
  <!-- Apple -->
  <path d="M70 160c-15 0-20-15-20-25 0-15 10-20 20-20 10 0 15 5 15 15 0 10-5 30-15 30z" fill="#ec4899"/>
  <path d="M75 115c2 0 5 2 5 5s-3 5-5 5-5-2-5-5 3-5 5-5z" fill="#10b981"/>
  
  <!-- Coffee Cup -->
  <rect x="130" y="110" width="50" height="50" rx="8" fill="#f1f5f9"/>
  <path d="M180 120h5a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5h-5" fill="none" stroke="#f1f5f9" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="155" cy="110" rx="25" ry="8" fill="#fb923c"/>
  <path d="M140 125h30" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Clock showing time passing -->
  <circle cx="120" cy="60" r="30" fill="#334155"/>
  <circle cx="120" cy="60" r="26" fill="#1e293b"/>
  <line x1="120" y1="60" x2="120" y2="40" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="60" x2="140" y2="60" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Atmospheric elements: Rain/Time particles -->
  <circle cx="40" cy="40" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="50" r="3" fill="#38bdf8" opacity="0.4"/>
  <circle cx="180" cy="200" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="60" cy="210" r="3" fill="#38bdf8" opacity="0.3"/>
</svg>