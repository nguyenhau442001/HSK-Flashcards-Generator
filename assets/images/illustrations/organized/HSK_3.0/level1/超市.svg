<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shelfGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#38bdf8;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Floor with Perspective -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#1e293b" opacity="0.5"/>
  <path d="M40 180 L200 180 L240 240 L0 240 Z" fill="#334155" opacity="0.3"/>
  
  <!-- Perspective Lines (Floor) -->
  <line x1="100" y1="180" x2="40" y2="240" stroke="#475569" stroke-width="0.5"/>
  <line x1="140" y1="180" x2="200" y2="240" stroke="#475569" stroke-width="0.5"/>

  <!-- Left Shelf Unit -->
  <path d="M0 40 L80 70 L80 190 L0 210 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <path d="M0 80 L80 100" stroke="#475569" stroke-width="2"/>
  <path d="M0 120 L80 135" stroke="#475569" stroke-width="2"/>
  <path d="M0 160 L80 170" stroke="#475569" stroke-width="2"/>

  <!-- Items on Left Shelf -->
  <rect x="10" y="85" width="8" height="12" rx="1" fill="#fb923c"/>
  <rect x="22" y="88" width="8" height="10" rx="1" fill="#38bdf8"/>
  <rect x="35" y="92" width="8" height="8" rx="1" fill="#10b981"/>
  <rect x="50" y="95" width="8" height="10" rx="1" fill="#ec4899"/>
  
  <rect x="15" y="125" width="10" height="15" rx="1" fill="#f59e0b"/>
  <rect x="30" y="130" width="10" height="12" rx="1" fill="#fb7185"/>
  <rect x="55" y="138" width="10" height="10" rx="1" fill="#6366f1"/>

  <!-- Right Shelf Unit -->
  <path d="M240 40 L160 70 L160 190 L240 210 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <path d="M240 80 L160 100" stroke="#475569" stroke-width="2"/>
  <path d="M240 120 L160 135" stroke="#475569" stroke-width="2"/>
  <path d="M240 160 L160 170" stroke="#475569" stroke-width="2"/>

  <!-- Items on Right Shelf -->
  <circle cx="220" cy="90" r="5" fill="#10b981"/>
  <circle cx="205" cy="95" r="5" fill="#10b981"/>
  <circle cx="190" cy="100" r="5" fill="#10b981"/>
  
  <rect x="210" y="125" width="12" height="18" rx="2" fill="#38bdf8"/>
  <rect x="185" y="135" width="12" height="18" rx="2" fill="#38bdf8"/>

  <!-- Ceiling Lights Glow -->
  <ellipse cx="120" cy="20" rx="60" ry="10" fill="#fbbf24" opacity="0.1"/>
  <rect x="80" y="10" width="80" height="4" rx="2" fill="#fbbf24" opacity="0.3"/>

  <!-- Shopping Cart (Foreground Action) -->
  <g transform="translate(85, 140)">
    <!-- Cart Body -->
    <path d="M0 0 L50 0 L45 35 L10 35 Z" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M0 10 L48 10 M5 20 L47 20 M8 30 L45 30" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
    <path d="M10 0 L15 35 M25 0 L25 35 M40 0 L35 35" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
    
    <!-- Handle -->
    <path d="M0 0 L-15 -5 L-18 5" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Wheels -->
    <circle cx="15" cy="42" r="4" fill="#334155"/>
    <circle cx="15" cy="42" r="1.5" fill="#94a3b8"/>
    <circle cx="40" cy="42" r="4" fill="#334155"/>
    <circle cx="40" cy="42" r="1.5" fill="#94a3b8"/>
    
    <!-- Items inside cart -->
    <rect x="15" y="10" width="12" height="15" rx="2" fill="#fb923c" transform="rotate(-10 21 17)"/>
    <rect x="28" y="15" width="10" height="12" rx="1" fill="#10b981" transform="rotate(5 33 21)"/>
  </g>

  <!-- Atmospheric Depth / Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#shelfGlow)" pointer-events="none"/>
  
  <!-- Reaching Hand (Action Detail) -->
  <g transform="translate(145, 110) rotate(-20)">
    <path d="M0 0 Q 10 -5, 20 0 L 22 8 Q 10 12, 0 8 Z" fill="#ffedd5"/>
    <path d="M20 0 L 25 -2 Q 28 0, 25 4 L 20 3" fill="#ffedd5"/>
  </g>
</svg>