<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- The "Problem" - A complex, tangled ball of glowing golden yarn/wires -->
  <g transform="translate(120, 130)">
    <circle cx="0" cy="0" r="45" fill="#1e293b" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M-30 -20 C-10 -40 20 -40 40 -10 C60 20 20 40 -10 20 C-40 0 -20 -30 0 -30" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10 10 C10 30 40 10 20 -10 C0 -30 -30 -10 -10 10" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-25" cy="-25" r="6" fill="#38bdf8"/>
    <circle cx="30" cy="20" r="6" fill="#10b981"/>
    <circle cx="10" cy="-35" r="4" fill="#ec4899"/>
  </g>

  <!-- Magnifying Glass -->
  <g transform="translate(70, 90) rotate(-20)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#94a3b8" stroke-width="6"/>
    <rect x="-5" y="20" width="10" height="40" rx="2" fill="#475569"/>
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#94a3b8" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Ambient particles -->
  <circle cx="180" cy="50" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="200" cy="70" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="40" cy="40" r="2" fill="#ec4899" opacity="0.6"/>
</svg>