<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Steam/Atmosphere -->
  <path d="M120 140 C130 120, 110 100, 120 80 S140 60, 130 40" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" fill="none" stroke-linecap="round"/>
  <path d="M140 140 C150 120, 130 100, 140 80 S160 60, 150 40" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.2" fill="none" stroke-linecap="round"/>

  <!-- Bowl -->
  <path d="M80 150 L160 150 L150 200 A20 10 0 0 1 90 200 L80 150" fill="#fb923c"/>
  <path d="M80 150 L160 150 A10 5 0 0 0 80 150" fill="#f59e0b"/>
  
  <!-- Noodles/Food -->
  <path d="M90 150 Q110 130 130 150 T150 150" stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M100 160 Q120 140 140 160 T160 160" stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Character Face -->
  <circle cx="120" cy="90" r="45" fill="#fde68a"/>
  
  <!-- Eyes (Expressive) -->
  <path d="M100 85 Q105 75 110 85 M130 85 Q135 75 140 85" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Blush -->
  <circle cx="100" cy="100" r="5" fill="#ec4899" opacity="0.6"/>
  <circle cx="140" cy="100" r="5" fill="#ec4899" opacity="0.6"/>
  
  <!-- Mouth (Delighted) -->
  <path d="M105 115 Q120 130 135 115" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Hands holding chopsticks -->
  <rect x="70" y="110" width="10" height="40" rx="5" fill="#fde68a" transform="rotate(-20 75 130)"/>
  <rect x="160" y="110" width="10" height="40" rx="5" fill="#fde68a" transform="rotate(20 165 130)"/>
  
  <!-- Chopsticks -->
  <line x1="75" y1="120" x2="110" y2="150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="120" x2="130" y2="150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Sparkles -->
  <circle cx="180" cy="70" r="3" fill="#10b981"/>
  <circle cx="60" cy="60" r="2" fill="#10b981"/>
  <circle cx="190" cy="180" r="4" fill="#38bdf8"/>
</svg>