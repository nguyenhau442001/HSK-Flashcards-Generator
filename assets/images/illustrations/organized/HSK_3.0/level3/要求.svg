<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Chalkboard Gradient -->
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit & Skin Gradients -->
    <linearGradient id="teacher-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter for emphasis -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- CLASSROOM ENVIRONMENT -->
  <!-- Classroom Wall & Floor -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#0f172a" stroke-width="4" />
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#090d16" />

  <!-- Large Chalkboard (Backdrop for strict requirements / high standards concept) -->
  <rect x="25" y="25" width="130" height="110" rx="4" fill="#334155" />
  <rect x="28" y="28" width="124" height="104" rx="2" fill="url(#board-grad)" stroke="#1e293b" stroke-width="1" />
  
  <!-- Abstract Diagram on Blackboard (representing high requirements/rules) -->
  <path d="M45 50 L65 70 L85 45 L115 85" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <circle cx="85" cy="45" r="4" fill="#fbbf24" />
  <circle cx="115" cy="85" r="4" fill="#fbbf24" />
  <line x1="45" y1="100" x2="135" y2="100" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" opacity="0.4" />
  <line x1="45" y1="112" x2="105" y2="112" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" opacity="0.4" />

  <!-- Teacher's Wooden Desk on Left -->
  <path d="M10 160 L60 160 L65 190 L5 190 Z" fill="#b45309" />
  <rect x="5" y="155" width="60" height="8" rx="2" fill="#d97706" />
  <rect x="20" y="140" width="15" height="18" rx="2" fill="#e2e8f0" /> <!-- Stack of papers / tests -->
  <path d="M45 135 L55 155 L35 155 Z" fill="#ef4444" /> <!-- Red pen/pointer -->

  <!-- STRICT & CONFIDENT TEACHER CHARACTER -->
  <!-- Body & Posture: Authoritative stance, pointing decisively to set high expectations/requirements -->
  
  <!-- Left Arm (Holding clipboard/notes) -->
  <path d="M140 135 L125 165 L145 175" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Torso & Suit Jacket -->
  <path d="M125 110 L165 110 L175 185 L115 185 Z" fill="#1e293b" />
  <path d="M135 110 L155 110 L158 175 L132 175 Z" fill="url(#teacher-shirt)" /> <!-- Shirt & Tie -->
  <polygon points="145,115 150,135 155,115" fill="#ef4444" /> <!-- Red Tie -->

  <!-- Head & Face -->
  <!-- Neck -->
  <rect x="140" y="98" width="20" height="16" fill="#fbcfe8" rx="4" />
  <!-- Head -->
  <circle cx="150" cy="82" r="22" fill="#fcd34d" />
  <!-- Hair (Neat intellectual style) -->
  <path d="M128 82 C128 65 140 60 155 60 C172 60 174 72 174 85 L172 80 C170 68 160 64 150 64 C138 64 132 72 130 82 Z" fill="#334155" />
  
  <!-- Facial Features (Strict, serious, high standards expression) -->
  <!-- Glasses -->
  <rect x="137" y="74" width="12" height="9" rx="2" fill="none" stroke="#0f172a" stroke-width="2" />
  <rect x="151" y="74" width="12" height="9" rx="2" fill="none" stroke="#0f172a" stroke-width="2" />
  <line x1="149" y1="78" x2="151" y2="78" stroke="#0f172a" stroke-width="2" />
  <!-- Serious Eyebrows (Slanted down for authoritative "requirement" look) -->
  <line x1="136" y1="70" x2="147" y2="73" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="153" y1="73" x2="164" y2="70" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Determined Mouth -->
  <path d="M144 92 L156 92" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Arm (Authoritative Pointing Gesture - emphasizing the strict requirement) -->
  <!-- Upper Arm -->
  <path d="M160 115 L190 100" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />
  <!-- Forearm pointing forward/up -->
  <path d="M190 100 L215 85" fill="none" stroke="#fcd34d" stroke-width="12" stroke-linecap="round" />
  <!-- Hand pointing index finger -->
  <circle cx="218" cy="83" r="6" fill="#fcd34d" />
  <path d="M222 81 L234 75" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />

  <!-- FOREGROUND PROPS & EFFECTS -->
  <!-- Floating Checklist / Evaluation criteria prop (visualizing 'requirement') -->
  <g transform="translate(180, 115) rotate(10)" filter="url(#glow)">
    <rect x="0" y="0" width="42" height="54" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="8" cy="8" r="3" fill="#ef4444" />
    <!-- Checkmarks / High Standards Indicators -->
    <line x1="15" y1="8" x2="35" y2="8" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    
    <polyline points="7,18 10,21 16,15" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="20" y1="18" x2="35" y2="18" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    
    <polyline points="7,28 10,31 16,25" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="20" y1="28" x2="35" y2="28" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

    <polyline points="7,38 10,41 16,35" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="20" y1="38" x2="35" y2="38" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Accent lighting spark at the pointing finger -->
  <circle cx="230" cy="73" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="230" cy="73" r="2" fill="#ffffff" />
</svg>