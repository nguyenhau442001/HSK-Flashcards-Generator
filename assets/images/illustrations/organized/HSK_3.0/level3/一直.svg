<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient for depth -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Warm Amber Glow for Waiting Character -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Energetic Cyan Glow for the "Always/Continuous" path -->
    <linearGradient id="pathGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Building Window Gradient -->
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (City Silhouette & Streetlights) -->
  <g id="environment">
    <!-- Distant Buildings -->
    <rect x="20" y="80" width="35" height="120" fill="#1e293b" opacity="0.6"/>
    <rect x="60" y="60" width="45" height="140" fill="#1e293b" opacity="0.8"/>
    <rect x="180" y="70" width="40" height="130" fill="#1e293b" opacity="0.7"/>
    
    <!-- Glowing Windows -->
    <rect x="70" y="80" width="8" height="12" rx="2" fill="url(#windowGrad)" opacity="0.8"/>
    <rect x="85" y="80" width="8" height="12" rx="2" fill="url(#windowGrad)" opacity="0.8"/>
    <rect x="70" y="105" width="8" height="12" rx="2" fill="url(#windowGrad)" opacity="0.8"/>
    <rect x="85" y="105" width="8" height="12" rx="2" fill="#334155"/>
    <rect x="30" y="100" width="10" height="15" rx="2" fill="url(#windowGrad)" opacity="0.5"/>

    <!-- Street Light Pole (Right Side) -->
    <rect x="195" y="70" width="4" height="130" fill="#475569"/>
    <path d="M197 70 L180 55 L175 60 L197 75 Z" fill="#64748b"/>
    <!-- Lamp Light Cone -->
    <polygon points="178,63 120,200 236,200" fill="url(#lampGlow)"/>
    <circle cx="177" cy="62" r="5" fill="#fef08a"/>
  </g>

  <!-- Ground / Pavement -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
  
  <!-- Perspective Straight Arrow / Path representing "一直" (Always / Straight ahead / Continuous timeline) -->
  <g id="straight-path-indicator">
    <path d="M 60 215 L 180 215" stroke="#0284c7" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
    <path d="M 60 215 L 180 215" stroke="url(#pathGlow)" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>
    <!-- Directional arrowheads floating smoothly to indicate 'straight/continuously' -->
    <path d="M 120 211 L 126 215 L 120 219" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 155 211 L 161 215 L 155 219" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Props & Environment -->
  <!-- Park Bench -->
  <g id="bench" transform="translate(30, 160)">
    <!-- Bench Legs -->
    <rect x="8" y="15" width="4" height="25" fill="#334155"/>
    <rect x="58" y="15" width="4" height="25" fill="#334155"/>
    <!-- Bench Seat -->
    <rect x="2" y="10" width="66" height="6" rx="3" fill="#b45309"/>
    <!-- Bench Backrest -->
    <rect x="2" y="-5" width="66" height="5" rx="2.5" fill="#b45309"/>
    <rect x="2" y="-13" width="66" height="5" rx="2.5" fill="#b45309"/>
    <!-- Bench Supports -->
    <path d="M12 10 L12 -5" stroke="#78350f" stroke-width="4"/>
    <path d="M58 10 L58 -5" stroke="#78350f" stroke-width="4"/>
  </g>

  <!-- Main Subject: The Waiting Character (Representing "He is ALWAYS waiting for you") -->
  <g id="waiting-character" transform="translate(42, 125)">
    <!-- Character Shadow -->
    <ellipse cx="22" cy="77" rx="18" ry="4" fill="#020617" opacity="0.6"/>

    <!-- Legs (Sitting/Waiting posture) -->
    <rect x="12" y="50" width="8" height="22" rx="4" fill="#1e3a8a"/>
    <rect x="24" y="50" width="8" height="22" rx="4" fill="#1e3a8a"/>
    <!-- Shoes -->
    <path d="M9 70 L17 70 A3 3 0 0 1 20 73 L10 73 A3 3 0 0 1 7 70 Z" fill="#0f172a"/>
    <path d="M21 70 L29 70 A3 3 0 0 1 32 73 L22 73 A3 3 0 0 1 19 70 Z" fill="#0f172a"/>

    <!-- Coat / Torso -->
    <path d="M 10 20 Q 10 15 20 15 Q 30 15 30 20 L 34 52 L 6 52 Z" fill="#0ea5e9"/>
    <!-- Scarf (Warm accent color for cozy waiting vibe) -->
    <path d="M 14 18 C 17 22 23 22 26 18 C 28 25 22 28 18 28 C 14 28 12 25 14 18 Z" fill="#f43f5e"/>
    <path d="M 22 26 L 20 42 L 25 42 L 26 26 Z" fill="#f43f5e"/>

    <!-- Head & Face -->
    <circle cx="20" cy="5" r="11" fill="#fcd34d"/>
    <!-- Friendly/Patient Expression (Eyes closed patiently, gentle smile) -->
    <path d="M 15 5 Q 17 7 19 5" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 21 5 Q 23 7 25 5" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 18 9 Q 20 11 22 9" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Hair -->
    <path d="M 10 2 C 11 -4 29 -4 30 2 C 27 0 13 0 10 2 Z" fill="#451a03"/>

    <!-- Arms (Hugging knees / holding watch position, showing anticipation) -->
    <path d="M 13 22 C 5 25 8 38 16 40" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <path d="M 27 22 C 35 25 32 38 24 40" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Waiting Clock / Time Indicator Symbolizing "Always/Ongoing" -->
  <g id="waiting-clock" transform="translate(68, 105)">
    <circle cx="0" cy="0" r="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="1" fill="#1e293b"/>
    <line x1="0" y1="0" x2="0" y2="-6" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="5" y2="-2" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric Lighting Overlays and Depth Vignette -->
  <circle cx="62" cy="140" r="45" fill="url(#lampGlow)" opacity="0.3" style="mix-blend-mode: screen;"/>
</svg>