<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Amber Glow for Sunset/Relaxed Weekend Vibe -->
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#090d16" flood-opacity="0.5"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Background Scenery (Mountains, Trees, Tent indicating Travel/Weekend Trip) -->
  <!-- Distant Mountains -->
  <polygon points="10,160 80,100 150,160" fill="#253449" />
  <polygon points="110,160 175,95 240,160" fill="#1e293b" />
  
  <!-- Ground / Camping Hill -->
  <path d="M0 160 Q 90 140, 240 170 L 240 240 L 0 240 Z" fill="#0f172a" />
  <path d="M0 180 Q 140 160, 240 190 L 240 240 L 0 240 Z" fill="#090d16" />

  <!-- TRAVEL / WEEKEND TRIP ELEMENTS -->
  <!-- Campfire / Warm Light Source -->
  <g filter="url(#softGlow)" opacity="0.8">
    <circle cx="180" cy="190" r="15" fill="#f59e0b" />
  </g>
  <!-- Fire Logs -->
  <rect x="170" y="195" width="20" height="5" rx="2" fill="#78350f" transform="rotate(-15 180 197)" />
  <rect x="170" y="195" width="20" height="5" rx="2" fill="#92400e" transform="rotate(25 180 197)" />
  <!-- Flame -->
  <path d="M180 175 Q 186 188, 180 193 Q 174 188, 180 175 Z" fill="#fbbf24" />
  <path d="M180 180 Q 183 189, 180 191 Q 177 189, 180 180 Z" fill="#f43f5e" />

  <!-- Camper Van / Travel Vehicle (Left Side) -->
  <g filter="url(#shadow)">
    <!-- Van Body -->
    <rect x="25" y="125" width="75" height="45" rx="12" fill="#38bdf8" />
    <path d="M 70 125 L 90 140 L 100 140 L 100 170 L 25 170 L 25 145 Q 25 125, 50 125 Z" fill="#0284c7" />
    <!-- Roof rack items (Luggage for weekend trip) -->
    <rect x="35" y="117" width="20" height="8" rx="2" fill="#f97316" />
    <rect x="60" y="115" width="16" height="10" rx="2" fill="#10b981" />
    <!-- Windows -->
    <rect x="35" y="133" width="18" height="14" rx="4" fill="#f8fafc" />
    <rect x="58" y="133" width="18" height="14" rx="4" fill="#f8fafc" />
    <path d="M 83 133 L 95 133 Q 97 133, 97 135 L 97 145 L 83 145 Z" fill="#f8fafc" />
    <!-- Wheels -->
    <circle cx="45" cy="170" r="10" fill="#334155" />
    <circle cx="45" cy="170" r="4" fill="#94a3b8" />
    <circle cx="85" cy="170" r="10" fill="#334155" />
    <circle cx="85" cy="170" r="4" fill="#94a3b8" />
    <!-- Headlight -->
    <circle cx="27" cy="155" r="3" fill="#fef08a" />
  </g>

  <!-- Backpack / Hiking Gear (Foreground prop representing weekend leisure) -->
  <g transform="translate(130, 160)" filter="url(#shadow)">
    <rect x="0" y="5" width="22" height="28" rx="6" fill="#ec4899" />
    <rect x="-4" y="12" width="30" height="15" rx="4" fill="#db2777" />
    <!-- Straps -->
    <path d="M 5 5 Q 11 -2, 17 5" fill="none" stroke="#be185d" stroke-width="3" stroke-linecap="round" />
    <!-- Sleeping roll attached -->
    <rect x="-6" y="25" width="34" height="8" rx="4" fill="#10b981" />
  </g>

  <!-- MAIN FOCAL POINT: Calendar showing "Weekend" & Leisure Iconography -->
  <g transform="translate(100, 35)" filter="url(#shadow)">
    <!-- Calendar Base -->
    <rect x="-35" y="0" width="110" height="95" rx="14" fill="#f8fafc" />
    <!-- Calendar Header (Red accent for weekend excitement) -->
    <path d="M -35 14 A 14 14 0 0 1 -21 0 L 65 0 A 14 14 0 0 1 79 14 L 79 28 L -35 28 Z" fill="#ef4444" />
    
    <!-- Spiral Rings -->
    <rect x="-20" y="-8" width="6" height="12" rx="3" fill="#cbd5e1" />
    <rect x="0" y="-8" width="6" height="12" rx="3" fill="#cbd5e1" />
    <rect x="35" y="-8" width="6" height="12" rx="3" fill="#cbd5e1" />
    <rect x="55" y="-8" width="6" height="12" rx="3" fill="#cbd5e1" />

    <!-- Calendar Grid Dots / Mini Days (Abstract representation) -->
    <circle cx="-15" cy="45" r="4" fill="#cbd5e1" />
    <circle cx="5" cy="45" r="4" fill="#cbd5e1" />
    <circle cx="25" cy="45" r="4" fill="#cbd5e1" />
    <circle cx="45" cy="45" r="4" fill="#cbd5e1" />
    
    <circle cx="-15" cy="62" r="4" fill="#cbd5e1" />
    <circle cx="5" cy="62" r="4" fill="#cbd5e1" />
    <!-- The Highlighted Weekend Days (Saturday & Sunday circled/marked) -->
    <rect x="12" y="53" width="40" height="18" rx="9" fill="#fef08a" />
    <circle cx="25" cy="62" r="5" fill="#eab308" />
    <circle cx="45" cy="62" r="5" fill="#eab308" />

    <!-- Fun Leisure Icons inside Calendar (Sun, Coffee/Relaxation) -->
    <!-- Sun icon on top right of calendar -->
    <circle cx="50" cy="14" r="5" fill="#fde047" />
    <path d="M 50 6 L 50 4 M 50 22 L 50 24 M 42 14 L 40 14 M 58 14 L 60 14" stroke="#fde047" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Floating Leisure Elements (Balloons/Confetti/Stars to denote "Free Time / Holiday") -->
  <g filter="url(#shadow)">
    <!-- Small Hot Air Balloon representing Weekend Outing -->
    <g transform="translate(30, 50)">
      <path d="M 12 0 C 22 0, 24 12, 12 20 C 0 12, 2 0, 12 0 Z" fill="#fb923c" />
      <path d="M 12 20 L 12 24" stroke="#64748b" stroke-width="1.5" />
      <rect x="9" y="24" width="6" height="5" rx="1" fill="#78350f" />
    </g>
    <!-- Music note / fun vibe -->
    <path d="M 205 70 L 205 50 L 218 45 L 218 65" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="201" cy="67" r="4" fill="#38bdf8" />
    <circle cx="214" cy="62" r="4" fill="#38bdf8" />
    
    <!-- Sparkles -->
    <path d="M 190 35 L 193 42 L 200 45 L 193 48 L 190 55 L 187 48 L 180 45 L 187 42 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M 45 30 L 47 34 L 52 36 L 47 38 L 45 42 L 43 38 L 38 36 L 43 34 Z" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>