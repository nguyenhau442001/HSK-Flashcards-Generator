  <!-- Thought Bubble/Visual Metaphor for "Assumption" -->
  <path d="M160 60c0-15-20-25-40-25s-40 10-40 25 20 25 40 25h10l10 10z" fill="#f1f5f9"/>
  <circle cx="110" cy="55" r="5" fill="#fb923c"/>
  <circle cx="130" cy="55" r="5" fill="#fb923c"/>
  <circle cx="150" cy="55" r="5" fill="#fb923c"/>
  
  <!-- Floor/Depth -->
