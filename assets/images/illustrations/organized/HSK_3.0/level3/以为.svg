<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Doorway/Context -->
  <path d="M60 40h120v160H60z" fill="#334155" stroke="#475569" stroke-width="4"/>
  <path d="M120 40v160" stroke="#475569" stroke-width="4"/>
  
  <!-- The "Mistaken" Character -->
  <g transform="translate(140, 120)">
    <circle cx="0" cy="-20" r="25" fill="#fbbf24"/>
    <path d="M-10 -25h20M-10 -15h20" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M-15 10c0 15 30 15 30 0" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <path d="M-20 20l-10 40h60l-10-40" fill="#38bdf8"/>
    <path d="M-30 60l-10 80h80l-10-80" fill="#0ea5e9"/>
  </g>
  
  <!-- The "Left" Character (Ghostly/Fading) -->
