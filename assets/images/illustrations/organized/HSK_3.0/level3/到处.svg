<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light for "Everywhere" Blossoms -->
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Glow representing "everywhere" vibrancy -->
  <circle cx="120" cy="140" r="100" fill="url(#glow)"/>

  <!-- Background Park Elements (Hills / Slopes) -->
  <path d="M-10 180 Q 60 140 130 170 T 250 160 L 250 240 L -10 240 Z" fill="#065f46" opacity="0.6"/>
  <path d="M-10 195 Q 80 165 170 190 T 250 185 L 250 240 L -10 240 Z" fill="#047857"/>

  <!-- Winding Park Path -->
  <path d="M 80 240 Q 100 190 125 185 T 160 140" fill="none" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
  <path d="M 80 240 Q 100 190 125 185 T 160 140" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 6"/>

  <!-- Background Trees -->
  <!-- Tree Left -->
  <circle cx="45" cy="120" r="24" fill="#065f46"/>
  <circle cx="30" cy="130" r="18" fill="#047857"/>
  <circle cx="60" cy="130" r="18" fill="#047857"/>
  <rect x="42" y="135" width="6" height="30" fill="#78350f" rx="3"/>

  <!-- Tree Right -->
  <circle cx="195" cy="110" r="28" fill="#065f46"/>
  <circle cx="178" cy="122" r="20" fill="#047857"/>
  <circle cx="212" cy="120" r="20" fill="#047857"/>
  <rect x="192" y="125" width="7" height="35" fill="#78350f" rx="3.5"/>

  <!-- ==================== "DAOCHU" (EVERYWHERE) FLOWERS & BUTTERFLIES ==================== -->
  <!-- Ground Flowers Layer 1 (Scattered everywhere across foreground) -->
  <!-- Bottom Left Cluster -->
  <g fill="#fbbf24">
    <circle cx="25" cy="210" r="4"/><circle cx="33" cy="215" r="3.5"/><circle cx="20" cy="222" r="4"/>
  </g>
  <g fill="#ec4899">
    <circle cx="29" cy="205" r="3.5"/><circle cx="24" cy="218" r="4"/>
  </g>

  <!-- Mid Ground Left -->
  <g fill="#38bdf8">
    <circle cx="55" cy="180" r="3.5"/><circle cx="65" cy="185" r="4"/><circle cx="48" cy="190" r="3"/>
  </g>
  <g fill="#fb923c">
    <circle cx="60" cy="176" r="3"/><circle cx="52" cy="186" r="3.5"/>
  </g>

  <!-- Center Path Edges -->
  <g fill="#fbbf24"><circle cx="100" cy="170" r="3.5"/><circle cx="145" cy="165" r="4"/></g>
  <g fill="#ec4899"><circle cx="106" cy="175" r="3"/><circle cx="138" cy="160" r="3.5"/></g>

  <!-- Right Ground Cluster -->
  <g fill="#38bdf8">
    <circle cx="180" cy="200" r="4"/><circle cx="195" cy="210" r="3.5"/><circle cx="210" cy="205" r="4"/><circle cx="225" cy="215" r="3.5"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="188" cy="205" r="3.5"/><circle cx="202" cy="200" r="4"/><circle cx="218" cy="210" r="3.5"/>
  </g>
  <g fill="#ec4899">
    <circle cx="175" cy="212" r="3"/><circle cx="192" cy="216" r="3.5"/><circle cx="220" cy="200" r="3"/>
  </g>

  <!-- Floating Petals & Butterflies (Adding dynamic action and "everywhere" feel) -->
  <!-- Pink Petals Floating -->
  <path d="M 40 140 Q 45 135 48 142 Q 42 145 40 140 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M 95 120 Q 100 115 103 122 Q 97 125 95 120 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M 160 100 Q 165 95 168 102 Q 162 105 160 100 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M 120 80 Q 125 75 128 82 Q 122 85 120 80 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M 75 90 Q 80 85 83 92 Q 77 95 75 90 Z" fill="#38bdf8" opacity="0.9"/>

  <!-- Cute Butterflies -->
  <!-- Butterfly 1 (Left) -->
  <g transform="translate(70, 115) rotate(-15)">
    <path d="M 0 0 C -6 -6 -10 0 0 6 C 10 0 6 -6 0 0 Z" fill="#38bdf8"/>
    <path d="M 0 0 C -6 4 -8 10 0 8 C 8 10 6 4 0 0 Z" fill="#fbbf24"/>
    <line x1="0" y1="-2" x2="0" y2="10" stroke="#0f172a" stroke-width="1"/>
  </g>

  <!-- Butterfly 2 (Right) -->
  <g transform="translate(165, 130) rotate(25)">
    <path d="M 0 0 C -6 -6 -10 0 0 6 C 10 0 6 -6 0 0 Z" fill="#ec4899"/>
    <path d="M 0 0 C -6 4 -8 10 0 8 C 8 10 6 4 0 0 Z" fill="#fbbf24"/>
    <line x1="0" y1="-2" x2="0" y2="10" stroke="#0f172a" stroke-width="1"/>
  </g>

  <!-- ==================== CENTRAL CHARACTER ==================== -->
  <g transform="translate(105, 110)">
    <!-- Character Shadow -->
    <ellipse cx="15" cy="85" rx="20" ry="6" fill="#0f172a" opacity="0.5"/>

    <!-- Cute Boy/Girl Explorer Character -->
    <!-- Backpack -->
    <rect x="3" y="32" width="12" height="22" rx="4" fill="#f97316"/>
    <rect x="6" y="35" width="6" height="8" rx="2" fill="#ea580c"/>

    <!-- Legs & Shoes -->
    <!-- Left Leg -->
    <rect x="7" y="65" width="6" height="18" rx="3" fill="#38bdf8"/>
    <ellipse cx="10" cy="83" rx="5" ry="3" fill="#1e293b"/>
    <!-- Right Leg -->
    <rect x="17" y="65" width="6" height="18" rx="3" fill="#38bdf8"/>
    <ellipse cx="20" cy="83" rx="5" ry="3" fill="#1e293b"/>

    <!-- Torso (Yellow Hoodie) -->
    <path d="M 8 30 L 22 30 C 26 30 28 35 27 50 L 3 50 C 2 35 4 30 8 30 Z" fill="#facc15"/>
    <path d="M 15 30 L 15 50" stroke="#eab308" stroke-width="2"/>
    <circle cx="15" cy="40" r="1.5" fill="#ca8a04"/>
    <circle cx="15" cy="46" r="1.5" fill="#ca8a04"/>

    <!-- Arms (Joyful pose - arms up looking around) -->
    <!-- Left Arm -->
    <path d="M 5 33 C -2 33 -4 42 -2 48" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <!-- Right Arm holding magnifying glass -->
    <path d="M 25 33 C 32 30 38 38 35 45" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>

    <!-- Head & Face -->
    <circle cx="15" cy="20" r="14" fill="#fde047"/>
    <!-- Hair -->
    <path d="M 2 18 C 2 8 10 4 20 8 C 25 10 28 15 28 18 C 25 14 18 10 10 14 C 5 16 3 18 2 18 Z" fill="#451a03"/>

    <!-- Happy Eyes (Arched lines) -->
    <path d="M 9 19 Q 11 16 13 19" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 17 19 Q 19 16 21 19" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Big joyful smile -->
    <path d="M 11 23 Q 15 27 19 23" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="8" cy="22" r="2" fill="#fda4af" opacity="0.8"/>
    <circle cx="22" cy="22" r="2" fill="#fda4af" opacity="0.8"/>

    <!-- Magnifying Glass Tool (Highlighting details everywhere) -->
    <g transform="translate(32, 40)">
      <line x1="0" y1="0" x2="8" y2="8" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-3" cy="-3" r="8" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="-3" cy="-3" r="7" fill="#ffffff" opacity="0.2"/>
    </g>
  </g>

  <!-- Foreground Large Flower (Frame Accent Bottom Left) -->
  <g transform="translate(15, 215)">
    <!-- Stem -->
    <path d="M 0 25 C 2 10 10 5 15 0" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M 5 15 C -2 12 -5 20 2 22 Z" fill="#059669"/>
    <!-- Petals -->
    <circle cx="15" cy="-5" r="5" fill="#f43f5e"/>
    <circle cx="25" cy="0" r="5" fill="#f43f5e"/>
    <circle cx="20" cy="10" r="5" fill="#f43f5e"/>
    <circle cx="10" cy="5" r="5" fill="#f43f5e"/>
    <circle cx="15" cy="2" r="4" fill="#fbbf24"/>
  </g>

  <!-- Foreground Large Flower (Frame Accent Bottom Right) -->
  <g transform="translate(210, 210)">
    <!-- Stem -->
    <path d="M 10 30 C 8 15 0 8 -5 0" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M 4 20 C 12 18 15 25 8 28 Z" fill="#059669"/>
    <!-- Petals -->
    <circle cx="-5" cy="-5" r="6" fill="#38bdf8"/>
    <circle cx="-15" cy="2" r="6" fill="#38bdf8"/>
    <circle cx="-10" cy="12" r="6" fill="#38bdf8"/>
    <circle cx="0" cy="5" r="6" fill="#38bdf8"/>
    <circle cx="-7" cy="3" r="5" fill="#facc15"/>
  </g>
</svg>