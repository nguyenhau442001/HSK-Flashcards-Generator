<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wall shadow/glow -->
    <radialGradient id="angerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Laptop Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Motion lines / steam -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Anger Glow on Wall -->
  <circle cx="120" cy="100" r="90" fill="url(#angerGlow)" />

  <!-- Room Background Elements -->
  <!-- Window/Frame -->
  <rect x="25" y="30" width="60" height="75" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2" />
  <!-- Window City Silhouette outside -->
  <path d="M35 105 L35 75 L45 75 L45 65 L55 65 L55 80 L65 80 L65 70 L75 70 L75 105 Z" fill="#1e293b" />
  <!-- Window Rain/Lines -->
  <line x1="40" y1="80" x2="38" y2="90" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
  <line x1="60" y1="70" x2="58" y2="80" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
  <line x1="70" y1="85" x2="68" y2="95" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

  <!-- Wall Shelf with Books -->
  <rect x="140" y="45" width="70" height="6" rx="2" fill="#475569" />
  <path d="M150 45 L150 25 L162 25 L162 45 Z" fill="#f43f5e" />
  <path d="M165 45 L165 20 L177 20 L177 45 Z" fill="#eab308" />
  <path d="M180 45 L180 28 L195 28 L195 45 Z" fill="#10b981" />

  <!-- Desk Surface -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#deskGrad)" />
  <!-- Desk Edge Highlight -->
  <rect x="0" y="170" width="240" height="4" fill="#64748b" />

  <!-- Background Props on Desk -->
  <!-- Coffee Mug (Steam rising) -->
  <rect x="180" y="135" width="18" height="25" rx="3" fill="#cbd5e1" />
  <path d="M198 142 C204 142, 204 154, 198 154" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M185 125 Q188 115, 184 105" fill="none" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M192 128 Q195 118, 191 108" fill="none" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Laptop / Computer Setup -->
  <!-- Laptop Base -->
  <path d="M100 170 L170 170 L185 155 L85 155 Z" fill="#94a3b8" />
  <rect x="120" y="161" width="30" height="6" rx="1" fill="#64748b" />
  <!-- Laptop Screen -->
  <path d="M88 155 L182 155 L175 100 L95 100 Z" fill="#334155" />
  <path d="M92 152 L178 152 L172 104 L98 104 Z" fill="url(#screenGrad)" />
  <!-- Broken Screen Crack Graphic -->
  <path d="M135 128 L120 115 M135 128 L150 140 M135 128 L145 112 M135 128 L115 138" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <circle cx="135" cy="128" r="4" fill="#f8fafc" opacity="0.9" />

  <!-- Desk Lamp -->
  <path d="M40 170 L45 170 L50 130 L35 130 Z" fill="#64748b" />
  <path d="M42 132 C30 130, 25 110, 30 100" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <path d="M18 95 L42 93 L37 107 L23 107 Z" fill="#e2e8f0" />
  <ellipse cx="30" cy="100" rx="7" ry="3" fill="#f59e0b" opacity="0.8" />

  <!-- MAIN CHARACTER: ANGRY MAN -->
  <!-- Torso & Shoulders -->
  <path d="M85 200 C85 175, 95 160, 120 160 C145 160, 155 175, 155 200 Z" fill="url(#shirtGrad)" filter="url(#shadow)" />
  <!-- Collar -->
  <path d="M105 160 L120 175 L135 160 Z" fill="#e2e8f0" />

  <!-- Neck -->
  <rect x="108" y="140" width="24" height="25" rx="6" fill="#fed7aa" />

  <!-- Head (Slightly tilted forward in anger) -->
  <circle cx="120" cy="115" r="32" fill="#fed7aa" filter="url(#shadow)" />

  <!-- Angry Red Face Flush / Aura -->
  <circle cx="120" cy="120" r="28" fill="#ef4444" opacity="0.3" />

  <!-- Hair (Messy, spiky black hair) -->
  <path d="M88 110 C85 90, 100 80, 120 82 C140 80, 155 90, 152 110 C155 100, 150 85, 135 78 C120 72, 105 78, 92 88 C85 95, 86 105, 88 110 Z" fill="#0f172a" />
  <!-- Extra spiky hair tufts -->
  <path d="M115 80 L120 70 L125 82 Z" fill="#0f172a" />
  <path d="M130 79 L138 68 L142 81 Z" fill="#0f172a" />

  <!-- Facial Expressions (Angry) -->
  <!-- Eyebrows (Slanted down aggressively into V-shape) -->
  <path d="M98 102 L115 112" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
  <path d="M142 102 L125 112" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />

  <!-- Eyes (Determined, narrowed, angry glare) -->
  <circle cx="107" cy="117" r="4.5" fill="#0f172a" />
  <circle cx="133" cy="117" r="4.5" fill="#0f172a" />
  <!-- Eye highlights -->
  <circle cx="108.5" cy="115.5" r="1.5" fill="#ffffff" />
  <circle cx="134.5" cy="115.5" r="1.5" fill="#ffffff" />

  <!-- Nose -->
  <path d="M120 115 L116 130 L123 131" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Mouth (Yelling / Gritted teeth / Open angry expression) -->
  <path d="M107 136 C107 136, 120 150, 133 136 C133 136, 120 143, 107 136 Z" fill="#7f1d1d" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Teeth -->
  <path d="M110 137 L130 137 L128 141 L112 141 Z" fill="#f8fafc" />

  <!-- Flush Cheeks -->
  <ellipse cx="100" cy="125" rx="5" ry="3" fill="#ef4444" opacity="0.6" />
  <ellipse cx="140" cy="125" rx="5" ry="3" fill="#ef4444" opacity="0.6" />

  <!-- ARMS & HANDS (Fists Slamming Down) -->
  <!-- Left Arm & Fist (Slamming the desk edge) -->
  <path d="M90 170 C70 175, 60 150, 65 135" fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" />
  <!-- Left Fist -->
  <circle cx="65" cy="130" r="12" fill="#fed7aa" stroke="#c2410c" stroke-width="2" filter="url(#shadow)" />
  <path d="M58 135 L72 135" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />

  <!-- Right Arm & Fist (Slamming the desk) -->
  <path d="M150 170 C170 175, 180 150, 175 135" fill="none" stroke="#1d4ed8" stroke-width="16" stroke-linecap="round" />
  <!-- Right Fist -->
  <circle cx="175" cy="130" r="12" fill="#fed7aa" stroke="#c2410c" stroke-width="2" filter="url(#shadow)" />
  <path d="M168 135 L182 135" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />

  <!-- IMPACT & ANGER EFFECTS -->
  <!-- Steam / Smoke from Head (Anger symbol vibe) -->
  <path d="M112 70 C105 60, 115 50, 110 40" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.8" />
  <path d="M128 72 C135 60, 125 50, 132 38" fill="none" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" opacity="0.8" />

  <!-- Comic Anger Vein Symbol (Top Right of Head) -->
  <path d="M142 85 C146 78, 155 78, 158 85 C155 90, 145 90, 142 85 Z" fill="#ef4444" />
  <path d="M147 80 L153 87 M153 80 L147 87" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Desk Impact Lines / Shockwaves near fists -->
  <path d="M50 145 L42 140" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M52 138 L40 132" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M190 145 L198 140" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M188 138 L200 132" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  
  <!-- Desk Tremble / Vibration Marks -->
  <path d="M110 176 L130 176" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 2" />
  <path d="M90 182 L150 182" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 3" />
</svg>