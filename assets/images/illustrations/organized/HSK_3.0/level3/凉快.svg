<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glow Effect for Moon/Lamp -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <!-- Cool Breeze Gradient -->
    <linearGradient id="breezeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- SCENE LAYER 1: Background & Window View (Evening/Night Atmosphere) -->
  <g id="window-scene">
    <!-- Window Frame Outer Shadow -->
    <rect x="25" y="22" width="115" height="130" rx="6" fill="#0b0f19" />
    <!-- Window Night Sky -->
    <rect x="28" y="25" width="109" height="124" rx="4" fill="url(#nightSky)" />

    <!-- Stars & Crescent Moon -->
    <circle cx="45" cy="45" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="95" cy="38" r="1" fill="#fef08a" opacity="0.9" />
    <circle cx="115" cy="75" r="1.2" fill="#ffffff" opacity="0.7" />
    <!-- Crescent Moon -->
    <path d="M 75 45 A 12 12 0 1 1 65 60 A 10 10 0 1 0 75 45 Z" fill="#fef08a" opacity="0.9" />

    <!-- Distant City Silhouette / Hills -->
    <path d="M 28 120 L 45 105 L 60 115 L 85 95 L 105 110 L 137 90 L 137 149 L 28 149 Z" fill="#172033" opacity="0.8" />

    <!-- Window Pane Dividers -->
    <rect x="28" y="84" width="109" height="4" fill="#0b0f19" />
    <rect x="79" y="25" width="4" height="124" fill="#0b0f19" />
    <!-- Window Sill -->
    <rect x="22" y="147" width="125" height="8" rx="2" fill="#334155" />
    <rect x="20" y="153" width="129" height="4" rx="1" fill="#1e293b" />
  </g>

  <!-- SCENE LAYER 2: Indoor Room & Furniture (Cozy Evening Interior) -->
  <g id="room-interior">
    <!-- Wall & Floor Divider -->
    <line x1="0" y1="155" x2="240" y2="155" stroke="#0f172a" stroke-width="2" />
    
    <!-- Wooden Floor -->
    <rect x="0" y="156" width="240" height="84" fill="#1e1b4b" />
    <path d="M 0 175 L 240 175" stroke="#090d16" stroke-width="1.5" opacity="0.5" />
    <path d="M 0 200 L 240 200" stroke="#090d16" stroke-width="1.5" opacity="0.5" />
    <path d="M 0 225 L 240 225" stroke="#090d16" stroke-width="1.5" opacity="0.5" />

    <!-- Bookshelf / Wall Shelf on Right -->
    <rect x="160" y="55" width="60" height="8" rx="2" fill="#475569" />
    <!-- Books on Shelf -->
    <rect x="170" y="33" width="8" height="22" rx="1" fill="#f43f5e" />
    <rect x="179" y="30" width="10" height="25" rx="1" fill="#3b82f6" />
    <rect x="191" y="36" width="7" height="19" rx="1" fill="#10b981" />
    <path d="M 205 50 C 205 40 215 40 215 50 Z" fill="#f59e0b" /> <!-- Little potted plant on shelf -->
    <rect x="202" y="50" width="16" height="5" rx="1" fill="#64748b" />
  </g>

  <!-- SCENE LAYER 3: The Potted Plant (Freshness element) -->
  <g id="indoor-plant">
    <!-- Pot -->
    <path d="M 148 130 L 162 130 L 159 150 L 151 150 Z" fill="#cbd5e1" />
    <ellipse cx="155" cy="130" rx="7" ry="2" fill="#94a3b8" />
    <!-- Leaves -->
    <path d="M 155 130 Q 140 115 135 105 Q 150 115 155 130 Z" fill="url(#leafGrad)" />
    <path d="M 155 130 Q 165 110 175 100 Q 165 120 155 130 Z" fill="url(#leafGrad)" />
    <path d="M 155 130 Q 155 100 155 90 Q 155 110 155 130 Z" fill="#10b981" />
  </g>

  <!-- SCENE LAYER 4: Cozy Desk, Warm Lamp & Refreshing Drink (Focal Props) -->
  <g id="desk-setup">
    <!-- Study Desk -->
    <rect x="110" y="150" width="115" height="10" rx="2" fill="#334155" />
    <rect x="120" y="160" width="8" height="80" fill="#1e293b" />
    <rect x="205" y="160" width="8" height="80" fill="#1e293b" />

    <!-- Desk Lamp (Warm Glow) -->
    <circle cx="130" cy="115" r="30" fill="url(#lampGlow)" />
    <path d="M 125 150 L 135 150 L 133 130 L 127 130 Z" fill="#64748b" />
    <path d="M 122 130 L 138 130 C 142 120 138 110 130 110 C 122 110 118 120 122 130 Z" fill="#fbbf24" />

    <!-- Refreshing Iced Drink (Glass with Mint & Straw - representing "Cool/凉快") -->
    <!-- Glass Body -->
    <path d="M 180 125 L 195 125 L 192 150 L 183 150 Z" fill="#e0f2fe" opacity="0.3" />
    <!-- Liquid inside (Light Blue/Teal) -->
    <path d="M 181.5 133 L 193.5 133 L 192 150 L 183 150 Z" fill="#38bdf8" opacity="0.7" />
    <!-- Ice Cubes -->
    <rect x="184" y="135" width="5" height="5" rx="1" fill="#ffffff" opacity="0.6" transform="rotate(15 186.5 137.5)" />
    <rect x="188" y="140" width="5" height="5" rx="1" fill="#ffffff" opacity="0.6" transform="rotate(-10 190.5 142.5)" />
    <!-- Straw -->
    <line x1="192" y1="120" x2="187" y2="145" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />
    <!-- Mint Leaf garnish -->
    <path d="M 187 131 C 185 127 189 125 191 128 C 193 125 195 129 191 131 Z" fill="#10b981" />
  </g>

  <!-- SCENE LAYER 5: The Main Character Relaxing (Experiencing 'Liángkuai') -->
  <g id="character-relaxing">
    <!-- Cozy Armchair / Beanbag -->
    <path d="M 45 130 C 35 130 30 150 30 180 C 30 205 50 215 85 215 C 120 215 125 195 125 170 C 125 145 110 130 95 130 Z" fill="#4f46e5" />
    <path d="M 40 150 C 35 170 40 200 65 210 C 50 200 45 175 50 150 Z" fill="#4338ca" opacity="0.6" /> <!-- Chair shadow -->

    <!-- Character Body (Sitting comfortably, leaning back) -->
    <!-- Hoodie / Sweater (Cozy warm clothing contrasted with cool breeze) -->
    <path d="M 60 160 C 55 175 60 195 75 205 C 90 205 100 190 100 170 L 90 150 L 70 150 Z" fill="#f43f5e" />
    
    <!-- Relaxed Legs in Cozy Pants & Slippers -->
    <path d="M 95 195 L 115 210 L 130 205" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <ellipse cx="133" cy="203" rx="6" ry="4" fill="#cbd5e1" /> <!-- Slipper -->

    <!-- Arms (One resting on chair, one holding a book) -->
    <!-- Arm resting -->
    <path d="M 62 165 C 50 175 45 185 50 195" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" fill="none" />
    
    <!-- Head & Face (Serene, eyes closed peacefully enjoying the cool breeze) -->
    <circle cx="75" cy="135" r="14" fill="#fcd34d" />
    <!-- Peaceful Closed Eyes (Smile curves) -->
    <path d="M 70 135 Q 73 138 76 135" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 78 135 Q 81 138 84 135" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Content Smile -->
    <path d="M 74 142 Q 77 145 80 142" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Hair (Casual styled) -->
    <path d="M 62 130 C 62 120 70 118 78 120 C 86 118 90 125 88 135 C 83 130 75 130 62 130 Z" fill="#334155" />
    <!-- Rosy Cheeks -->
    <circle cx="68" cy="139" r="2.5" fill="#f43f5e" opacity="0.4" />
    <circle cx="85" cy="139" r="2.5" fill="#f43f5e" opacity="0.4" />

    <!-- Open Book in Lap -->
    <path d="M 65 180 L 85 170 L 105 185 L 85 195 Z" fill="#f8fafc" />
    <path d="M 85 170 L 85 195" stroke="#cbd5e1" stroke-width="1" />
    <line x1="70" y1="178" x2="78" y2="175" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="72" y1="183" x2="80" y2="180" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="90" y1="178" x2="98" y2="181" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="92" y1="183" x2="100" y2="186" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- SCENE LAYER 6: Atmospheric Cool Breeze (Visualizing '凉快' / Refreshing Cool Air) -->
  <g id="cool-breeze-currents">
    <!-- Flowing wind swishes entering from the open window -->
    <!-- Wind Stream 1 -->
    <path d="M 35 70 C 60 65 80 90 110 85 C 130 82 145 70 170 75" stroke="url(#breezeGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Little wind swirl loop -->
    <path d="M 105 85 C 112 85 115 90 110 95 C 105 98 100 95 103 90" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" fill="none" />

    <!-- Wind Stream 2 (Passing over the character and drink) -->
    <path d="M 35 100 C 55 95 90 120 120 115 C 150 110 170 130 210 120" stroke="url(#breezeGrad)" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Wind Stream 3 (Lower breeze) -->
    <path d="M 35 125 C 60 125 70 140 100 135 C 130 130 165 145 190 140" stroke="url(#breezeGrad)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Floating leaf carried by the gentle cool breeze -->
    <g transform="translate(115, 95) rotate(25)">
      <path d="M 0 0 Q 6 -4 10 0 Q 6 4 0 0 Z" fill="#34d399" opacity="0.9" />
      <path d="M 0 0 L 8 0" stroke="#059669" stroke-width="0.7" />
    </g>

    <g transform="translate(155, 115) rotate(-40)">
      <path d="M 0 0 Q 5 -3 8 0 Q 5 3 0 0 Z" fill="#34d399" opacity="0.8" />
    </g>
  </g>

  <!-- Foreground Atmospheric Vignette / Frame Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />
</svg>