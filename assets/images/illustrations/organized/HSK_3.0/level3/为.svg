<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Gradient for the Gift -->
    <radialGradient id="giftGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Box Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Background Shapes / Depth -->
  <g opacity="0.3">
    <circle cx="120" cy="120" r="90" fill="url(#giftGlow)" filter="url(#softGlow)"/>
    <path d="M40 180 L200 180" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="70" r="3" fill="#38bdf8" opacity="0.6"/>
    <circle cx="190" cy="90" r="4" fill="#fbbf24" opacity="0.6"/>
    <circle cx="170" cy="50" r="2" fill="#ec4899" opacity="0.6"/>
    <circle cx="70" cy="50" r="2.5" fill="#10b981" opacity="0.6"/>
  </g>

  <!-- Interactive Scene: Giving a Gift / Doing something "for" someone (为) -->
  <!-- Context Table / Surface -->
  <path d="M40 185 L200 185 C208 185, 210 195, 205 200 L35 200 C30 195, 32 185, 40 185 Z" fill="#0f172a" filter="url(#shadow)"/>
  <rect x="35" y="180" width="170" height="8" rx="3" fill="#475569"/>

  <!-- Action Sparkles / Energy (Representing 'For you / Dedicated to') -->
  <g>
    <path d="M120 40 L124 52 L136 56 L124 60 L120 72 L116 60 L104 56 L116 52 Z" fill="#fbbf24"/>
    <path d="M70 70 L72.5 77.5 L80 80 L72.5 82.5 L70 90 L67.5 82.5 L60 80 L67.5 77.5 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M170 80 L172 86 L178 88 L172 90 L170 96 L168 90 L162 88 L168 86 Z" fill="#ec4899" opacity="0.8"/>
  </g>

  <!-- Giving Hands / Arms extending gesture -->
  <!-- Left Giver Arm -->
  <path d="M10 145 C30 140, 50 155, 75 160" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
  <!-- Left Hand Cuffs / Sleeve -->
  <path d="M68 150 C74 150, 78 160, 75 170 C70 170, 65 165, 62 158 Z" fill="#ea580c"/>
  <!-- Left Hand Palm holding box -->
  <circle cx="78" cy="165" r="9" fill="#fbcfe8"/>

  <!-- Right Giver Arm -->
  <path d="M230 145 C210 140, 190 155, 165 160" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
  <!-- Right Hand Cuffs / Sleeve -->
  <path d="M172 150 C166 150, 162 160, 165 170 C170 170, 175 165, 178 158 Z" fill="#ea580c"/>
  <!-- Right Hand Palm holding box -->
  <circle cx="162" cy="165" r="9" fill="#fbcfe8"/>

  <!-- Central Gift Box (The focal point of action/devotion) -->
  <g filter="url(#shadow)">
    <!-- Box Shadow on table -->
    <ellipse cx="120" cy="182" rx="35" ry="8" fill="#000000" opacity="0.4"/>

    <!-- Box Base -->
    <path d="M85 130 L155 130 L155 175 C155 180, 150 183, 145 183 L95 183 C90 183, 85 180, 85 175 Z" fill="url(#boxGrad)"/>
    
    <!-- Box Front Vertical Ribbon -->
    <path d="M112 130 L128 130 L128 183 L112 183 Z" fill="url(#ribbonGrad)"/>

    <!-- Box Lid -->
    <path d="M78 115 L162 115 C166 115, 168 118, 168 122 L168 128 C168 132, 166 135, 162 135 L78 135 C74 135, 72 132, 72 128 L72 122 C72 118, 74 115, 78 115 Z" fill="#0ea5e9"/>
    
    <!-- Lid Ribbon Center -->
    <path d="M110 115 L130 115 L130 135 L110 135 Z" fill="url(#ribbonGrad)"/>

    <!-- Decorative Bow / Ribbon Flower -->
    <g transform="translate(120, 112)">
      <!-- Left Loop -->
      <path d="M-2 -8 C-18 -22, -24 -2, -10 2 C-4 4, -2 2, -2 -8 Z" fill="url(#ribbonGrad)" filter="url(#shadow)"/>
      <!-- Right Loop -->
      <path d="M2 -8 C18 -22, 24 -2, 10 2 C4 4, 2 2, 2 -8 Z" fill="url(#ribbonGrad)" filter="url(#shadow)"/>
      <!-- Center Knot -->
      <circle cx="0" cy="-3" r="5" fill="#fda4af"/>
      <!-- Ribbon Tails -->
      <path d="M-4 1 L-12 14 L-6 16 L-2 4 Z" fill="url(#ribbonGrad)"/>
      <path d="M4 1 L12 14 L6 16 L2 4 Z" fill="url(#ribbonGrad)"/>
    </g>
  </g>

  <!-- Floating Heart Symbol (Symbolizing "for you" / care / dedication) -->
  <g transform="translate(120, 75) scale(0.9)" filter="url(#shadow)">
    <path d="M0 10 C-10 0, -25 0, -25 15 C-25 30, 0 45, 0 52 C0 45, 25 30, 25 15 C25 0, 10 0, 0 10 Z" fill="#ec4899"/>
    <path d="M-12 16 C-15 10, -8 6, -3 10" stroke="#f472b6" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Additional Atmospheric Lighting Sparkles -->
  <path d="M90 95 Q95 90 100 95 Q95 100 90 95 Z" fill="#fde047" opacity="0.8"/>
  <path d="M140 95 Q145 90 150 95 Q145 100 140 95 Z" fill="#fde047" opacity="0.8"/>
</svg>