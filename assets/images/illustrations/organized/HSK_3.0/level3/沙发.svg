<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Sofa Fabric Gradient (Teal/Cyan modern) -->
    <linearGradient id="sofaBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sofaDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Cushion Gradient -->
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Throw Pillow Gradient (Coral/Orange accent) -->
    <linearGradient id="pillowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Rug Gradient -->
    <linearGradient id="rugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- TV Screen Glow -->
    <linearGradient id="tvScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Details: Floor and Wall -->
  <!-- Back wall -->
  <rect x="12" y="12" width="216" height="150" fill="#1e293b" />
  <!-- Wall art / window frame accent -->
  <rect x="35" y="25" width="40" height="50" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="40" y="30" width="30" height="40" rx="2" fill="#1e293b" opacity="0.6"/>

  <!-- Floor -->
  <path d="M 12 162 L 228 162 L 236 228 L 4 228 Z" fill="#0f172a" />
  <!-- Wooden floor planks (subtle lines) -->
  <line x1="12" y1="180" x2="228" y2="180" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
  <line x1="4" y1="205" x2="236" y2="205" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>

  <!-- Large Cozy Rug -->
  <ellipse cx="120" cy="195" rx="85" ry="22" fill="url(#rugGrad)" />
  <ellipse cx="120" cy="195" rx="75" ry="17" fill="#1e293b" opacity="0.3"/>

  <!-- TV Stand & TV on the left/back wall -->
  <rect x="25" y="95" width="60" height="45" rx="3" fill="#334155"/>
  <!-- TV Screen showing action scene -->
  <rect x="29" y="99" width="52" height="33" rx="2" fill="url(#tvScreen)"/>
  <!-- TV content: abstract mountain/sun landscape -->
  <circle cx="45" cy="110" r="6" fill="#fde047" opacity="0.8"/>
  <path d="M 29 132 L 45 115 L 61 132 Z" fill="#6366f1" opacity="0.6"/>
  <path d="M 45 132 L 62 118 L 81 132 Z" fill="#4f46e5" opacity="0.8"/>
  <!-- TV stand legs -->
  <line x1="37" y1="140" x2="33" y2="148" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="73" y1="140" x2="77" y2="148" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Standing Lamp on the right -->
  <circle cx="200" cy="90" r="35" fill="url(#lampGlow)" />
  <!-- Lamp shade -->
  <path d="M 190 60 L 210 60 L 218 80 L 182 80 Z" fill="#fbbf24" />
  <!-- Lamp stand -->
  <line x1="200" y1="80" x2="200" y2="200" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Lamp base -->
  <ellipse cx="200" cy="200" rx="12" ry="4" fill="#475569"/>

  <!-- POTTED PLANT for lifestyle context -->
  <path d="M 195 145 L 215 145 L 210 165 L 200 165 Z" fill="#f8fafc" />
  <ellipse cx="205" cy="145" rx="10" ry="3" fill="#cbd5e1"/>
  <!-- Plant leaves -->
  <path d="M 205 142 C 205 120 190 115 185 110 C 195 125 200 135 205 142 Z" fill="#10b981"/>
  <path d="M 205 142 C 210 115 225 110 230 105 C 220 120 215 135 205 142 Z" fill="#059669"/>
  <path d="M 205 142 C 190 130 180 130 175 125 C 190 135 198 138 205 142 Z" fill="#34d399"/>

  <!-- ==================== THE MAIN SUBJECT: GHẾ SOFA (SHĀFĀ) ==================== -->
  <g id="sofa-group">
    <!-- Sofa Back Shadow -->
    <rect x="42" y="85" width="126" height="55" rx="16" fill="#0284c7" opacity="0.3"/>

    <!-- Sofa Outer Backrest -->
    <rect x="45" y="80" width="120" height="52" rx="16" fill="url(#sofaDark)"/>

    <!-- Sofa Inner Backrest (Tufted sections) -->
    <rect x="49" y="84" width="112" height="44" rx="12" fill="url(#sofaBase)"/>
    <!-- Tufting vertical stitches -->
    <line x1="86" y1="88" x2="86" y2="124" stroke="#0284c7" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="124" y1="88" x2="124" y2="124" stroke="#0284c7" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <!-- Tufting buttons -->
    <circle cx="86" cy="106" r="2" fill="#0369a1" opacity="0.6"/>
    <circle cx="124" cy="106" r="2" fill="#0369a1" opacity="0.6"/>

    <!-- Left Armrest -->
    <path d="M 38 95 C 38 85 45 80 55 80 L 55 140 C 45 140 38 135 38 125 Z" fill="url(#sofaDark)"/>
    <path d="M 42 98 C 42 90 47 84 54 84 L 54 136 C 47 136 42 130 42 122 Z" fill="url(#sofaBase)"/>

    <!-- Right Armrest -->
    <path d="M 172 95 C 172 85 165 80 155 80 L 155 140 C 165 140 172 135 172 125 Z" fill="url(#sofaDark)"/>
    <path d="M 168 98 C 168 90 163 84 156 84 L 156 136 C 163 136 168 130 168 122 Z" fill="url(#sofaBase)"/>

    <!-- Sofa Base Frame (Front Panel) -->
    <rect x="42" y="128" width="126" height="26" rx="8" fill="url(#sofaDark)"/>

    <!-- Sofa Seat Cushions (Plush and 3D) -->
    <rect x="48" y="120" width="56" height="20" rx="8" fill="url(#cushionGrad)"/>
    <rect x="106" y="120" width="56" height="20" rx="8" fill="url(#cushionGrad)"/>
    <!-- Cushion highlights -->
    <line x1="56" y1="123" x2="96" y2="123" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="114" y1="123" x2="154" y2="123" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Sofa Wooden Legs -->
    <rect x="52" y="154" width="8" height="14" rx="2" fill="#b45309" transform="rotate(-10 52 154)"/>
    <rect x="150" y="154" width="8" height="14" rx="2" fill="#b45309" transform="rotate(10 150 154)"/>
    <rect x="62" y="156" width="7" height="12" rx="2" fill="#92400e"/>
    <rect x="141" y="156" width="7" height="12" rx="2" fill="#92400e"/>

    <!-- Throw Pillows for added coziness and color contrast -->
    <!-- Left Pillow (Coral/Orange) -->
    <g transform="translate(56, 92) rotate(-12)">
      <rect x="0" y="0" width="26" height="26" rx="8" fill="url(#pillowGrad)"/>
      <path d="M 5 13 Q 13 8 21 13" stroke="#ffedd5" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round"/>
    </g>

    <!-- Right Pillow (Emerald/Mint accent) -->
    <g transform="translate(128, 90) rotate(15)">
      <rect x="0" y="0" width="26" height="26" rx="8" fill="#10b981"/>
      <rect x="4" y="4" width="18" height="18" rx="5" fill="#34d399" opacity="0.4"/>
    </g>
  </g>
  <!-- ==================== END SOFA ==================== -->

  <!-- Coffee Table in front of Sofa -->
  <g transform="translate(80, 155)">
    <!-- Table shadow -->
    <ellipse cx="40" cy="20" rx="35" ry="10" fill="#020617" opacity="0.4"/>
    <!-- Tabletop (Ellipse, modern wood/slate) -->
    <ellipse cx="40" cy="14" rx="38" ry="14" fill="#334155"/>
    <ellipse cx="40" cy="12" rx="38" ry="14" fill="#475569"/>
    <!-- Table rim highlight -->
    <ellipse cx="40" cy="10" rx="36" ry="12" fill="#64748b"/>
    <ellipse cx="40" cy="11" rx="34" ry="10" fill="#1e293b"/>

    <!-- Items on table: Teapot and teacup -->
    <!-- Teapot -->
    <circle cx="28" cy="8" r="6" fill="#f8fafc"/>
    <path d="M 22 8 C 22 4 34 4 34 8 Z" fill="#cbd5e1"/>
    <path d="M 20 9 C 17 9 17 6 15 5" stroke="#f8fafc" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Small Teacup & saucer -->
    <ellipse cx="53" cy="12" rx="5" ry="2" fill="#cbd5e1"/>
    <path d="M 49 10 L 51 14 L 55 14 L 57 10 Z" fill="#f8fafc"/>

    <!-- Table legs -->
    <line x1="16" y1="18" x2="10" y2="28" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="64" y1="18" x2="70" y2="28" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="20" x2="25" y2="30" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground ambient light dust / magical speckles for app polish -->
  <circle cx="65" cy="70" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="175" cy="55" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="125" cy="45" r="1" fill="#f8fafc" opacity="0.5"/>
</svg>