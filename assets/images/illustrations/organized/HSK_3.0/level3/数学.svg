<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing effect for holographic formulas -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Board surface gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    
    <!-- Desk gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background mathematical geometry lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" fill="none">
    <circle cx="120" cy="110" r="85"/>
    <circle cx="120" cy="110" r="55"/>
    <line x1="35" y1="110" x2="205" y2="110"/>
    <line x1="120" y1="25" x2="120" y2="195"/>
    <path d="M 60,50 L 180,170"/>
    <path d="M 180,50 L 60,170"/>
  </g>

  <!-- Giant Chalkboard / Workspace Backing -->
  <rect x="25" y="25" width="190" height="170" rx="14" fill="url(#boardGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="31" y="31" width="178" height="158" rx="10" fill="#090d16" opacity="0.6"/>

  <!-- Floating 3D Holographic Math Shapes (Action elements) -->
  <!-- 3D Cube with neon cyan and amber edges -->
  <g transform="translate(145, 65)">
    <!-- Back faces -->
    <polygon points="0,0 25,-12 25,18 0,30" fill="#0284c7" opacity="0.3"/>
    <polygon points="0,0 -25,-12 -25,18 0,30" fill="#0369a1" opacity="0.4"/>
    <!-- Wireframe edges -->
    <polygon points="0,-25 25,-12 0,0 -25,-12" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="-25,-12 -25,18 0,30 0,0" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="25,-12 25,18 0,30 0,0" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Glowing Geometric Sphere / Orbit -->
  <g transform="translate(75, 75)">
    <ellipse cx="0" cy="0" rx="24" ry="8" fill="none" stroke="#fbbf24" stroke-width="1.5" transform="rotate(-30)" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="24" ry="8" fill="none" stroke="#fb923c" stroke-width="1.5" transform="rotate(45)" opacity="0.8"/>
    <circle cx="0" cy="0" r="10" fill="#f59e0b" opacity="0.2"/>
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
  </g>

  <!-- Floating Mathematical Symbols & Graphs (Abstract clean vector representations) -->
  <g filter="url(#glow)">
    <!-- Sine wave / Function curve -->
    <path d="M 45,135 Q 60,115 75,135 T 105,135" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pi symbol stylized -->
    <path d="M 165,130 L 195,130 M 173,130 L 173,155 M 187,130 L 187,150 Q 187,156 193,155" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <!-- Square Root icon stylized -->
    <path d="M 40,75 L 48,75 L 55,95 L 68,45 L 85,45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 10,195 L 230,195 L 220,225 L 20,225 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="1"/>
  <!-- Desk highlight line -->
  <line x1="10" y1="195" x2="230" y2="195" stroke="#64748b" stroke-width="2"/>

  <!-- Tangible Props on Desk -->
  <!-- Open Math Notebook / Textbook -->
  <g transform="translate(90, 185)">
    <!-- Book shadow -->
    <ellipse cx="30" cy="15" rx="35" ry="8" fill="#0f172a" opacity="0.6"/>
    <!-- Left page -->
    <path d="M 0,15 L 30,5 L 30,25 L 0,30 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Right page -->
    <path d="M 60,15 L 30,5 L 30,25 L 60,30 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Spine -->
    <line x1="30" y1="5" x2="30" y2="25" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Tiny geometric drawings on pages -->
    <path d="M 10,18 L 15,12 L 20,18 Z" fill="none" stroke="#ef4444" stroke-width="1"/>
    <circle cx="45" cy="18" r="4" fill="none" stroke="#3b82f6" stroke-width="1"/>
  </g>

  <!-- Modern Compass / Divider (Precision math tool) -->
  <g transform="translate(55, 175) rotate(-15)">
    <!-- Legs -->
    <line x1="10" y1="0" x2="0" y2="35" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="20" y2="35" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hinge head -->
    <circle cx="10" cy="0" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <!-- Adjuster arc -->
    <path d="M 5,20 Q 10,23 15,20" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Professional Scientific Calculator with colorful buttons -->
  <g transform="translate(150, 165)">
    <!-- Calculator body -->
    <rect x="0" y="0" width="30" height="42" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
    <!-- Screen -->
    <rect x="4" y="5" width="22" height="9" rx="2" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Screen calculation graph/glow -->
    <path d="M 6,10 L 10,8 L 14,11 L 22,7" fill="none" stroke="#34d399" stroke-width="1"/>
    <!-- Keypad grid -->
    <rect x="5" y="17" width="5" height="4" rx="1" fill="#64748b"/>
    <rect x="12" y="17" width="5" height="4" rx="1" fill="#64748b"/>
    <rect x="19" y="17" width="6" height="4" rx="1" fill="#f59e0b"/>

    <rect x="5" y="23" width="5" height="4" rx="1" fill="#64748b"/>
    <rect x="12" y="23" width="5" height="4" rx="1" fill="#64748b"/>
    <rect x="19" y="23" width="6" height="4" rx="1" fill="#f59e0b"/>

    <rect x="5" y="29" width="5" height="4" rx="1" fill="#64748b"/>
    <rect x="12" y="29" width="5" height="4" rx="1" fill="#64748b"/>
    <rect x="19" y="29" width="6" height="10" rx="1" fill="#3b82f6"/>

    <rect x="5" y="35" width="12" height="4" rx="1" fill="#64748b"/>
  </g>

  <!-- Foreground Atmospheric Sparks / Math Particles -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="105" cy="55" r="2"/>
    <circle cx="135" cy="115" r="1.5"/>
    <circle cx="65" cy="105" r="2.5" fill="#fbbf24"/>
    <circle cx="170" cy="95" r="2" fill="#ec4899"/>
    <circle cx="45" cy="165" r="1.5" fill="#10b981"/>
  </g>

</svg>