<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Sunlight Gradient -->
    <linearGradient id="sunlight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Window Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- T-Shirt Gradients (Dry & Vibrant) -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Pants Gradient -->
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Towel Gradient -->
    <linearGradient id="towelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Window & Sunlight Context -->
  <path d="M 140 20 L 220 20 L 220 180 L 140 180 Z" fill="#1e293b" opacity="0.5"/>
  <polygon points="140,20 220,20 240,240 80,240" fill="url(#sunlight)"/>
  
  <!-- Indoor Wall Details & Shelf -->
  <rect x="20" y="195" width="200" height="6" rx="3" fill="#334155"/>
  <rect x="35" y="201" width="12" height="15" rx="2" fill="#475569"/>
  <rect x="180" y="201" width="16" height="15" rx="2" fill="#475569"/>
  <!-- Little potted plant on shelf for cozy real-world atmosphere -->
  <path d="M 55 195 L 65 195 L 63 185 L 57 185 Z" fill="#cbd5e1"/>
  <circle cx="60" cy="183" r="6" fill="#10b981"/>
  <circle cx="56" cy="180" r="5" fill="#34d399"/>
  <circle cx="64" cy="180" r="5" fill="#059669"/>

  <!-- Laundry Line & Clothespins Background Elements -->
  <!-- Main Clothesline Wire -->
  <line x1="15" y1="70" x2="225" y2="70" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>

  <!-- ================= CLOTHES (ALL DRY, CRISP, AND VIVID) ================= -->

  <!-- Item 1: Yellow Socks -->
  <g transform="translate(28, 70)" filter="url(#shadow)">
    <!-- Clothespin -->
    <rect x="10" y="-8" width="5" height="10" rx="2.5" fill="#fbbf24"/>
    <rect x="18" y="-8" width="5" height="10" rx="2.5" fill="#fbbf24"/>
    <!-- Sock 1 -->
    <path d="M 8 2 L 18 2 L 18 22 C 18 28 8 28 8 22 Z" fill="#facc15"/>
    <path d="M 16 2 L 26 2 L 26 22 C 26 28 16 28 16 22 Z" fill="#facc15" opacity="0.9"/>
  </g>

  <!-- Item 2: Bright Blue T-Shirt (Dry & Fluffy) -->
  <g transform="translate(55, 70)" filter="url(#shadow)">
    <!-- Clothespins -->
    <rect x="18" y="-8" width="5" height="10" rx="2.5" fill="#fbbf24"/>
    <rect x="42" y="-8" width="5" height="10" rx="2.5" fill="#fbbf24"/>
    <!-- Shirt Body -->
    <path d="M 15 2 
             L 30 2 
             Q 35 12 40 2
             L 55 2
             L 63 45
             Q 63 48 60 48
             L 10 48
             Q 7 48 7 45
             Z" fill="url(#shirtGrad)"/>
    <!-- Sleeves -->
    <path d="M 15 2 L 2 18 L 12 24 L 30 12 Z" fill="#0284c7"/>
    <path d="M 55 2 L 68 18 L 58 24 L 40 12 Z" fill="#38bdf8"/>
    <!-- Collar -->
    <path d="M 27 2 Q 35 10 43 2 Z" fill="#1e293b" opacity="0.3"/>
    <!-- Cute happy subtle crease indicating clean, dry fabric -->
    <path d="M 35 20 Q 38 30 32 40" stroke="#0284c7" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Item 3: Green Striped Towel -->
  <g transform="translate(130, 70)" filter="url(#shadow)">
    <!-- Clothespins -->
    <rect x="12" y="-8" width="5" height="10" rx="2.5" fill="#fbbf24"/>
    <rect x="32" y="-8" width="5" height="10" rx="2.5" fill="#fbbf24"/>
    <!-- Towel Rectangle -->
    <rect x="10" y="2" width="35" height="55" rx="6" fill="url(#towelGrad)"/>
    <!-- Stripes -->
    <rect x="10" y="12" width="35" height="8" fill="#6ee7b7" opacity="0.6"/>
    <rect x="10" y="32" width="35" height="8" fill="#6ee7b7" opacity="0.6"/>
    <!-- Wavy bottom edge for fabric feel -->
    <path d="M 10 57 Q 14 62 18 57 Q 22 62 26 57 Q 30 62 34 57 Q 38 62 42 57 L 45 57 L 45 52 L 10 52 Z" fill="#059669"/>
  </g>

  <!-- Item 4: Red Pants / Trousers -->
  <g transform="translate(180, 70)" filter="url(#shadow)">
    <!-- Clothespins -->
    <rect x="8" y="-8" width="5" height="10" rx="2.5" fill="#fbbf24"/>
    <rect x="22" y="-8" width="5" height="10" rx="2.5" fill="#fbbf24"/>
    <!-- Pants Waist (hanging upside down) -->
    <path d="M 5 2 L 30 2 L 28 60 L 22 60 L 19 35 L 16 60 L 10 60 Z" fill="url(#pantsGrad)"/>
    <!-- Belt loop details -->
    <rect x="10" y="2" width="4" height="5" fill="#9f1239"/>
    <rect x="20" y="2" width="4" height="5" fill="#9f1239"/>
  </g>

  <!-- Sparkles / Radiance indicating "Dry & Clean" (Freshness indicators) -->
  <g transform="translate(100, 45)">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(40, 140)">
    <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="#38bdf8" opacity="0.8"/>
  </g>
  <g transform="translate(170, 145)">
    <path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" fill="#34d399" opacity="0.9"/>
  </g>
  <g transform="translate(120, 30)">
    <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- Warm Sun Beam Effect Overlay -->
  <circle cx="200" cy="40" r="25" fill="#fbbf24" opacity="0.15" filter="url(#shadow)"/>
  <circle cx="200" cy="40" r="15" fill="#fff" opacity="0.3"/>

</svg>