<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Market Light Glow -->
    <radialGradient id="marketGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Wooden Counter Gradient -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Wood Highlight -->
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Wicker Basket Gradient -->
    <linearGradient id="basketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Apple Red Gradient -->
    <radialGradient id="appleGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- Orange Gradient -->
    <radialGradient id="orangeGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <!-- Kiwi Green Gradient -->
    <radialGradient id="kiwiGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="70%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#365314"/>
    </radialGradient>

    <!-- Dew Drop Highlight -->
    <linearGradient id="dewDrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#marketGlow)"/>

  <!-- Background Ambience: Wooden Wall / Market Stall Back -->
  <rect x="0" y="30" width="240" height="110" fill="#0f172a" opacity="0.3"/>
  <line x1="0" y1="60" x2="240" y2="60" stroke="#1e293b" stroke-width="2"/>
  <line x1="0" y1="100" x2="240" y2="100" stroke="#1e293b" stroke-width="2"/>

  <!-- Hanging Decorative Leafy Vines (Atmosphere of Freshness) -->
  <path d="M40 0 Q50 30 30 50 Q20 60 25 70" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 0 Q190 25 210 45 Q215 55 205 65" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <!-- Leaf Accents -->
  <path d="M30 50 Q45 45 40 35 Z" fill="#34d399"/>
  <path d="M25 70 Q15 65 20 55 Z" fill="#059669"/>
  <path d="M210 45 Q195 45 200 35 Z" fill="#34d399"/>
  <path d="M205 65 Q215 65 210 55 Z" fill="#059669"/>

  <!-- Back Counter Shelf Base Shadow -->
  <ellipse cx="120" cy="180" rx="95" ry="18" fill="#020617" opacity="0.6"/>

  <!-- Wooden Counter / Display Table -->
  <path d="M25 155 L215 155 L200 205 L40 205 Z" fill="url(#woodGrad)"/>
  <path d="M20 150 L220 150 L215 155 L25 155 Z" fill="url(#woodTop)" filter="url(#shadow)"/>
  <!-- Counter Wood Grain Line -->
  <path d="M32 175 L208 175" stroke="#78350f" stroke-width="2" opacity="0.5"/>

  <!-- MAIN SCENE: Wicker Fruit Display Basket -->
  <g filter="url(#shadow)">
    <!-- Basket Back Rim -->
    <ellipse cx="120" cy="142" rx="76" ry="14" fill="#b45309"/>
    <!-- Basket Body -->
    <path d="M44 142 C44 185, 60 198, 120 198 C180 198, 196 185, 196 142 C196 155, 180 206, 120 206 C60 206, 44 155, 44 142 Z" fill="url(#basketGrad)"/>
    <!-- Wicker Crosshatch Texture (Stylized) -->
    <path d="M60 150 Q120 175 180 150" fill="none" stroke="#78350f" stroke-width="2" opacity="0.4"/>
    <path d="M52 165 Q120 190 188 165" fill="none" stroke="#78350f" stroke-width="2" opacity="0.4"/>
    <path d="M70 180 Q120 200 170 180" fill="none" stroke="#78350f" stroke-width="2" opacity="0.4"/>
    <!-- Basket Front Lip Rim -->
    <ellipse cx="120" cy="144" rx="76" ry="12" fill="none" stroke="#fef3c7" stroke-width="3"/>
  </g>

  <!-- FRESH FRUITS PILED IN BASKET -->
  <g id="fruits">
    <!-- Back Layer Fruits -->
    <!-- Pineapple Corner Left -->
    <g transform="translate(65, 125)">
      <ellipse cx="0" cy="15" rx="16" ry="20" fill="#d97706" transform="rotate(-15)"/>
      <path d="M-5 -2 L-10 -15 L2 -10 L10 -18 L3 -2 L8 0 Z" fill="#10b981"/>
    </g>

    <!-- Green Pear Right -->
    <g transform="translate(170, 120)">
      <path d="M0 10 C14 10, 16 -5, 8 -15 C4 -20, 0 -22, -2 -22 C-4 -22, -8 -20, -12 -15 C-20 -5, -14 10, 0 10 Z" fill="#84cc16"/>
      <path d="M-2 -22 L-2 -30" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <path d="M-2 -28 Q5 -32 8 -26" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Orange / Citrus Center-Back -->
    <circle cx="105" cy="122" r="18" fill="url(#orangeGrad)"/>
    <circle cx="105" cy="122" r="18" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.6"/>

    <!-- MAIN HERO FRUIT 1: Red Apple (Left Center) -->
    <g filter="url(#shadow)">
      <circle cx="90" cy="138" r="24" fill="url(#appleGrad)"/>
      <!-- Apple Stem & Leaf -->
      <path d="M90 114 Q92 105 87 100" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
      <path d="M89 105 Q98 100 95 110 Z" fill="#10b981"/>
      <!-- Apple Shine / Dew -->
      <ellipse cx="80" cy="128" rx="5" ry="8" fill="#ffffff" opacity="0.4" transform="rotate(-20 80 128)"/>
      <circle cx="95" cy="148" r="3.5" fill="url(#dewDrop)" stroke="#ffffff" stroke-width="0.8"/>
    </g>

    <!-- MAIN HERO FRUIT 2: Juicy Orange (Right Center) -->
    <g filter="url(#shadow)">
      <circle cx="150" cy="136" r="25" fill="url(#orangeGrad)"/>
      <!-- Citrus Dimple & Stem -->
      <circle cx="150" cy="111" r="3" stroke="#c2410c" stroke-width="1.5" fill="none"/>
      <path d="M150 111 Q155 103 162 106" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Orange Texture & Dew -->
      <circle cx="140" cy="125" r="2" fill="#ffedd5" opacity="0.6"/>
      <circle cx="160" cy="145" r="4" fill="url(#dewDrop)" stroke="#ffffff" stroke-width="0.8"/>
      <circle cx="138" cy="142" r="2.5" fill="url(#dewDrop)" stroke="#ffffff" stroke-width="0.6"/>
    </g>

    <!-- MAIN HERO FRUIT 3: Ripe Banana Bunch (Front Overlap) -->
    <g filter="url(#shadow)" transform="translate(120, 155)">
      <!-- Banana 1 -->
      <path d="M-45 -5 C-25 -25, 10 -25, 35 -5 C20 0, -10 -5, -45 -5 Z" fill="#facc15"/>
      <path d="M-45 -5 C-25 -25, 10 -25, 35 -5 C20 -2, -10 -5, -45 -5 Z" fill="#fde047"/>
      <!-- Banana Stem -->
      <path d="M-45 -5 L-52 -8" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
      <!-- Banana 2 (Lower) -->
      <path d="M-35 5 C-15 -10, 20 -10, 40 8 C25 12, -5 8, -35 5 Z" fill="#eab308"/>
      <!-- Dew on Banana -->
      <circle cx="5" cy="-12" r="3" fill="url(#dewDrop)" stroke="#ffffff" stroke-width="0.7"/>
    </g>

    <!-- FRESHNESS ACCENT: Fresh Kiwi Slice & Whole Kiwi on Side -->
    <g filter="url(#shadow)">
      <!-- Whole Kiwi -->
      <ellipse cx="62" cy="155" rx="15" ry="12" fill="#78350f" transform="rotate(15)"/>
      <ellipse cx="62" cy="155" rx="13" ry="10" fill="#a16207" transform="rotate(15)"/>
      <!-- Kiwi Dew -->
      <circle cx="58" cy="148" r="2.5" fill="url(#dewDrop)" stroke="#ffffff" stroke-width="0.5"/>

      <!-- Fresh Cut Kiwi Half (Showing vibrant green center) -->
      <g transform="translate(182, 152)">
        <ellipse cx="0" cy="0" rx="17" ry="15" fill="#65a30d" stroke="#fef08a" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="11" ry="9" fill="#ecfccb"/>
        <!-- Kiwi Seeds Pattern -->
        <circle cx="-3" cy="-2" r="1" fill="#365314"/>
        <circle cx="3" cy="-3" r="1" fill="#365314"/>
        <circle cx="4" cy="3" r="1" fill="#365314"/>
        <circle cx="-4" cy="2" r="1" fill="#365314"/>
        <circle cx="0" cy="5" r="1" fill="#365314"/>
        <circle cx="0" cy="-5" r="1" fill="#365314"/>
        <!-- Dew on kiwi slice -->
        <circle cx="8" cy="-5" r="3" fill="url(#dewDrop)" stroke="#ffffff" stroke-width="0.7"/>
      </g>
    </g>
  </g>

  <!-- SPARKS & VIBRANT ATMOSPHERE OF "FRESHNESS" (Xīnxiān) -->
  <g id="sparkles">
    <!-- Glowing Sparkle 1 (Top Left) -->
    <path d="M60 75 Q60 65 50 65 Q60 65 60 55 Q60 65 70 65 Q60 65 60 75 Z" fill="#38bdf8" filter="url(#shadow)"/>
    <circle cx="60" cy="65" r="1.5" fill="#ffffff"/>

    <!-- Glowing Sparkle 2 (Top Right) -->
    <path d="M185 85 Q185 75 175 75 Q185 75 185 65 Q185 75 195 75 Q185 75 185 85 Z" fill="#facc15" filter="url(#shadow)"/>
    <circle cx="185" cy="75" r="1.5" fill="#ffffff"/>

    <!-- Glowing Sparkle 3 (Center Near Apple) -->
    <path d="M115 95 Q115 88 108 88 Q115 88 115 81 Q115 88 122 88 Q115 88 115 95 Z" fill="#34d399" filter="url(#shadow)"/>
    <circle cx="115" cy="88" r="1.2" fill="#ffffff"/>

    <!-- Floating Crisp Air Bubbles / Vitality Dots -->
    <circle cx="95" cy="100" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="155" cy="92" r="3" fill="#34d399" opacity="0.7"/>
    <circle cx="45" cy="115" r="2" fill="#facc15" opacity="0.8"/>
    <circle cx="195" cy="125" r="2.5" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Dynamic Steam / Fresh Crisp Vapor wisps -->
  <path d="M75 110 Q70 95 80 85" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M165 105 Q170 90 160 80" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Foreground Frame / Clean Border Outline -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.5"/>
</svg>