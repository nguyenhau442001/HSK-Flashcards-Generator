<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Vinyl Record Gradient -->
    <radialGradient id="vinyl-shine" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="15%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glowing Amber Accent Gradient -->
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Cyan Headphone Glow -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Magenta Accent Gradient -->
    <linearGradient id="magenta-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Ambient Glows -->
  <circle cx="120" cy="120" r="80" fill="#f59e0b" opacity="0.05" filter="url(#glow)"/>
  <circle cx="60" cy="180" r="50" fill="#38bdf8" opacity="0.07" filter="url(#glow)"/>
  <circle cx="190" cy="70" r="60" fill="#ec4899" opacity="0.06" filter="url(#glow)"/>

  <!-- Ambient Musical Notes Floating -->
  <g fill="#38bdf8" opacity="0.3">
    <!-- Note 1 -->
    <path d="M45 80 a 4 3 0 1 1 8 0 v -15 l 10 -3 v 8 a 4 3 0 1 1 8 0 v -15 l -18 5 z" />
    <!-- Note 2 -->
    <path d="M185 140 a 3 2.5 0 1 1 6 0 v -10 l 8 -2 v 6 a 3 2.5 0 1 1 6 0 v -12 l -14 4 z" fill="#fbbf24" opacity="0.4"/>
  </g>

  <!-- Turntable / DJ Setup Base (Rounded Square Desk Surface) -->
  <rect x="25" y="70" width="190" height="135" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Turntable Inner Surface -->
  <rect x="35" y="80" width="170" height="115" rx="10" fill="#1e293b"/>
  
  <!-- Wood grain accent strip / Control panel -->
  <rect x="35" y="175" width="170" height="20" rx="4" fill="#0f172a"/>
  <!-- Control Knobs -->
  <circle cx="55" cy="185" r="4" fill="#64748b"/>
  <circle cx="70" cy="185" r="4" fill="#64748b"/>
  <rect x="160" y="182" width="25" height="6" rx="3" fill="#38bdf8"/>

  <!-- Left Speaker / Sound Waves Area (Left side) -->
  <g transform="translate(15, 0)">
    <circle cx="35" cy="137" r="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="35" cy="137" r="12" fill="#1e293b"/>
    <circle cx="35" cy="137" r="6" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- VINYL RECORD (Center-Left) -->
  <g transform="translate(115, 137)" filter="url(#shadow)">
    <!-- Vinyl Outer Groove Disk -->
    <circle cx="0" cy="0" r="54" fill="url(#vinyl-shine)"/>
    
    <!-- Grooves (Concentric rings) -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.6"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.6"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.6"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.6"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.6"/>

    <!-- Vinyl Center Label -->
    <circle cx="0" cy="0" r="18" fill="url(#amber-glow)"/>
    <circle cx="0" cy="0" r="14" fill="#ea580c" opacity="0.3"/>
    
    <!-- Spindle Hole -->
    <circle cx="0" cy="0" r="4" fill="#0f172a"/>
  </g>

  <!-- Turntable Tonearm (Right side of vinyl) -->
  <g transform="translate(165, 95)" filter="url(#shadow)">
    <!-- Base pivot -->
    <circle cx="0" cy="0" r="8" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#0f172a"/>
    <!-- Arm Stick -->
    <path d="M 0 0 L -12 25 L -25 38" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cartridge / Stylus head -->
    <path d="M -25 38 L -30 46 L -26 47 L -22 41 Z" fill="#38bdf8"/>
  </g>

  <!-- OVER-EAR HEADPHONES (Draped dynamically over the top right) -->
  <g filter="url(#shadow)">
    <!-- Headband Arch -->
    <path d="M 115 50 C 140 30, 185 45, 195 85" fill="none" stroke="url(#cyan-glow)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 115 50 C 140 30, 185 45, 195 85" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Left Ear Cup (Angled) -->
    <g transform="translate(105, 52) rotate(-15)">
      <rect x="-8" y="-4" width="16" height="24" rx="8" fill="#0284c7"/>
      <rect x="-5" y="0" width="10" height="18" rx="5" fill="#38bdf8"/>
    </g>

    <!-- Right Ear Cup (Main prominent one on the right edge) -->
    <g transform="translate(192, 88) rotate(25)">
      <!-- Cable wire connecting -->
      <path d="M 3 -10 C 10 15, -5 30, -10 50" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
      
      <!-- Cup Housing -->
      <rect x="-12" y="-18" width="24" height="36" rx="10" fill="url(#cyan-glow)" stroke="#bae6fd" stroke-width="1.5"/>
      <!-- Inner Pad Accent -->
      <rect x="-8" y="-14" width="16" height="28" rx="6" fill="#0f172a"/>
      <!-- Glowing ring on cup -->
      <circle cx="0" cy="0" r="4" fill="#fbbf24" filter="url(#glow)"/>
    </g>
  </g>

  <!-- VIBRANT SOUND WAVES & MUSICAL ELEMENTS (Bursting out action-packed) -->
  <g filter="url(#glow)">
    <!-- Sound Wave Arc 1 (Magenta) -->
    <path d="M 75 100 Q 95 65 135 70" fill="none" stroke="url(#magenta-glow)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Sound Wave Arc 2 (Cyan/Blue) -->
    <path d="M 60 120 Q 80 80 130 85" fill="none" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round"/>

    <!-- Equalizer / Frequency Bars (Right side backdrop) -->
    <rect x="202" y="110" width="4" height="25" rx="2" fill="#38bdf8" opacity="0.9"/>
    <rect x="210" y="95" width="4" height="40" rx="2" fill="#ec4899" opacity="0.9"/>
    <rect x="218" y="120" width="4" height="15" rx="2" fill="#fbbf24" opacity="0.9"/>

    <!-- Floating Energetic Music Notes -->
    <!-- Note 1 (Amber) -->
    <g transform="translate(85, 38) rotate(15)">
      <ellipse cx="4" cy="12" rx="4.5" ry="3.5" fill="#fbbf24"/>
      <path d="M 8 12 L 8 2" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 8 2 L 16 0 L 16 5" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Note 2 (Magenta) -->
    <g transform="translate(155, 32) rotate(-10)">
      <ellipse cx="4" cy="10" rx="4" ry="3" fill="#ec4899"/>
      <path d="M 8 10 L 8 1" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Star / Sparkles for dynamic atmosphere -->
    <path d="M 130 45 L 133 52 L 140 55 L 133 58 L 130 65 L 127 58 L 120 55 L 127 52 Z" fill="#fbbf24"/>
    <path d="M 55 60 L 57 65 L 62 67 L 57 69 L 55 74 L 53 69 L 48 67 L 53 65 Z" fill="#38bdf8" transform="scale(0.7) translate(20, 10)"/>
  </g>

  <!-- Foreground details: Coffee cup or desk props for real-world depth -->
  <g transform="translate(45, 145)" filter="url(#shadow)">
    <!-- Cute Mug -->
    <path d="M 0 5 L 4 25 C 4 28, 6 30, 10 30 L 22 30 C 26 30, 28 28, 28 25 L 32 5 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="16" cy="5" rx="16" ry="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Coffee liquid -->
    <ellipse cx="16" cy="6" rx="13" ry="3" fill="#78350f"/>
    <!-- Mug Handle -->
    <path d="M 28 10 C 36 10, 36 22, 28 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Steam / Warmth -->
    <path d="M 12 -2 C 14 -6, 10 -8, 14 -12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>