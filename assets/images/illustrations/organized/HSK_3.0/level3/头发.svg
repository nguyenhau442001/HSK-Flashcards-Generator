<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Salon Mirror Frame Gradient -->
    <linearGradient id="mirrorFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Warm Vanity Glow -->
    <radialGradient id="vanityGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Hair Gradient (Rich Dark Brown/Black with highlights) -->
    <linearGradient id="hairGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#382110"/>
      <stop offset="40%" stop-color="#180e07"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </linearGradient>

    <!-- Hair Highlight -->
    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lighting / Glow behind vanity -->
  <circle cx="120" cy="110" r="90" fill="url(#vanityGlow)"/>

  <!-- Salon Environment: Shelf / Counter Top -->
  <path d="M 20 205 L 220 205 L 210 215 L 30 215 Z" fill="#0f172a" filter="url(#dropShadow)"/>
  <rect x="25" y="200" width="190" height="6" rx="3" fill="#334155"/>

  <!-- Vanity Mirror (Elliptical arch) -->
  <rect x="65" y="30" width="110" height="155" rx="55" fill="#0f172a" stroke="url(#mirrorFrame)" stroke-width="4" filter="url(#dropShadow)"/>
  <!-- Mirror Glass Reflection Effect -->
  <path d="M 73 85 C 90 60, 150 60, 167 85 C 150 150, 90 150, 73 85 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M 80 45 Q 120 35 140 45 Q 110 50 80 45 Z" fill="#38bdf8" opacity="0.25"/>

  <!-- Salon Props on Counter (Left): Scissors and Spray Bottle -->
  <!-- Spray Bottle -->
  <rect x="36" y="170" width="14" height="28" rx="4" fill="#10b981"/>
  <path d="M 33 170 L 47 170 L 45 165 L 35 165 Z" fill="#34d399"/>
  <path d="M 40 165 L 48 159 L 44 157 L 39 162 Z" fill="#94a3b8"/>
  <circle cx="48" cy="158" r="2" fill="#f59e0b"/>

  <!-- Professional Hair Scissors -->
  <g transform="translate(185, 172) rotate(-25)">
    <circle cx="0" cy="15" r="5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="0" cy="27" r="5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="0" y1="10" x2="0" y2="-15" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="12" y2="-12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="1.5" fill="#f59e0b"/>
  </g>

  <!-- MAIN SUBJECT: CHARACTER WITH EXTREMELY LONG HAIR (头发) -->
  <g id="character-and-hair" filter="url(#dropShadow)">
    
    <!-- EXTREMELY LONG HAIR (Flowing gracefully down past the frame) -->
    <!-- Back hair volume / base flow -->
    <path d="M 85 90 C 70 120, 75 160, 70 205 C 100 210, 140 210, 170 205 C 165 160, 170 120, 155 90 Z" fill="url(#hairGrad)"/>
    
    <!-- Long sweeping hair strands (Left side wave) -->
    <path d="M 80 85 C 60 110, 55 150, 65 210 C 72 212, 78 208, 75 190 C 68 140, 75 110, 90 90 Z" fill="url(#hairGrad)"/>
    
    <!-- Long sweeping hair strands (Right side wave - cascading gracefully) -->
    <path d="M 160 85 C 180 115, 185 155, 175 210 C 168 212, 162 208, 165 190 C 172 140, 165 110, 150 90 Z" fill="url(#hairGrad)"/>

    <!-- Hair Dynamic Highlights (Adding silky texture and shine) -->
    <path d="M 88 95 C 78 130, 82 170, 76 205" fill="none" stroke="url(#hairHighlight)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 98 90 C 88 130, 92 170, 85 208" fill="none" stroke="url(#hairHighlight)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 152 90 C 162 130, 158 170, 164 208" fill="none" stroke="url(#hairHighlight)" stroke-width="3" stroke-linecap="round"/>

    <!-- Character Body / Shoulders -->
    <path d="M 90 145 Q 120 140 150 145 C 165 150, 185 175, 190 205 L 50 205 C 55 175, 75 150, 90 145 Z" fill="#ec4899"/>
    <!-- Collar detail -->
    <path d="M 105 147 Q 120 160 135 147 L 130 142 Q 120 150 110 142 Z" fill="#fbcfe8"/>

    <!-- Character Neck -->
    <path d="M 110 115 L 110 148 L 130 148 L 130 115 Z" fill="#fed7aa"/>

    <!-- Character Head / Face Profile -->
    <circle cx="120" cy="100" r="24" fill="#fed7aa"/>

    <!-- Face Features (Friendly expression, eyes closed happily enjoying hair styling) -->
    <!-- Gentle Smiling Eyes -->
    <path d="M 111 98 Q 115 103 119 98" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
    <path d="M 121 98 Q 125 103 129 98" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
    <!-- Blush -->
    <circle cx="109" cy="103" r="3" fill="#fb7185" opacity="0.6"/>
    <circle cx="131" cy="103" r="3" fill="#fb7185" opacity="0.6"/>
    <!-- Smile -->
    <path d="M 117 107 Q 120 110 123 107" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>

    <!-- Front Bangs (Framing the face neatly) -->
    <path d="M 96 90 Q 120 80 144 90 C 145 98, 135 102, 120 100 C 105 102, 95 98, 96 90 Z" fill="url(#hairGrad)"/>
    <!-- Bangs highlight -->
    <path d="M 105 87 Q 120 82 135 87" fill="none" stroke="url(#hairHighlight)" stroke-width="2" stroke-linecap="round"/>

  </g>

  <!-- Sparkles / Magic Hair Shine Accents -->
  <g fill="#fbbf24">
    <path d="M 62 130 Q 62 138 54 138 Q 62 138 62 146 Q 62 138 70 138 Q 62 138 62 130 Z" opacity="0.9"/>
    <path d="M 180 160 Q 180 165 175 165 Q 180 165 180 170 Q 180 165 185 165 Q 180 165 180 160 Z" opacity="0.7"/>
    <path d="M 100 200 Q 100 204 96 204 Q 100 204 100 208 Q 100 204 104 204 Q 100 204 100 200 Z" opacity="0.8"/>
    <circle cx="140" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="75" cy="80" r="2" fill="#38bdf8"/>
  </g>
</svg>