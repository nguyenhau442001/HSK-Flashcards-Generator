<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Golden Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Motion Action "Just Arrived" Particle Gradient -->
    <linearGradient id="motionTrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light / Environment Layer -->
  <circle cx="120" cy="90" r="110" fill="url(#lampGlow)" />

  <!-- Wall & Floor Architecture -->
  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="175" fill="#1e293b" />
  <rect x="0" y="0" width="240" height="175" fill="#38bdf8" fill-opacity="0.03" />

  <!-- Wooden Floor -->
  <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="#0f172a" />
  <path d="M0 175 L240 175 L240 180 L0 180 Z" fill="#334155" fill-opacity="0.5" />
  <!-- Floor Planks perspective lines -->
  <line x1="60" y1="175" x2="20" y2="240" stroke="#1e293b" stroke-width="1.5" />
  <line x1="140" y1="175" x2="120" y2="240" stroke="#1e293b" stroke-width="1.5" />
  <line x1="200" y1="175" x2="210" y2="240" stroke="#1e293b" stroke-width="1.5" />

  <!-- Entryway Props: Door Frame & Open Door -->
  <!-- Door frame structure -->
  <rect x="15" y="30" width="65" height="145" fill="#0b0f19" rx="2" />
  <!-- Open door panel (perspective) -->
  <path d="M20 35 L50 42 L50 168 L20 163 Z" fill="#334155" filter="url(#dropShadow)" />
  <circle cx="44" cy="102" r="3" fill="#fbbf24" />

  <!-- Wall Decor: Warm welcoming wall light -->
  <path d="M120 35 L125 45 L115 45 Z" fill="#fbbf24" />
  <path d="M110 45 L130 45 L132 50 L108 50 Z" fill="#475569" />
  <path d="M112 50 C112 58 128 58 128 50 Z" fill="#fbbf24" fill-opacity="0.9" filter="url(#dropShadow)" />

  <!-- Homey Details: Coat rack on wall with a dropped scarf -->
  <rect x="185" y="65" width="25" height="6" rx="3" fill="#475569" />
  <circle cx="190" cy="68" r="2" fill="#fb923c" />
  <circle cx="205" cy="68" r="2" fill="#fb923c" />
  <!-- Hanging Scarf (indicates recent arrival) -->
  <path d="M195 68 C190 85 205 95 195 115" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" filter="url(#dropShadow)" />
  <path d="M195 68 C202 82 195 100 200 110" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />

  <!-- Action Props: Newly Dropped Items on the Floor (The "Just Happened" Vibe) -->
  <!-- Slippers neatly stepped out of -->
  <g filter="url(#dropShadow)">
    <!-- Right Slipper -->
    <path d="M135 195 C135 188 148 188 152 196 C156 204 148 212 138 210 C133 209 135 199 135 195 Z" fill="#38bdf8" />
    <path d="M139 194 C142 192 148 193 150 197" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" />
    <!-- Left Slipper (slightly kicked off) -->
    <path d="M115 202 C113 195 125 191 131 198 C137 205 131 214 121 214 C116 214 116 206 115 202 Z" fill="#38bdf8" />
    <path d="M118 200 C122 198 127 200 129 204" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Briefcase / Backpack freshly set down -->
  <g transform="translate(75, 170)" filter="url(#dropShadow)">
    <rect x="0" y="10" width="28" height="22" rx="4" fill="#fb923c" />
    <path d="M8 10 C8 4 20 4 20 10" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" />
    <rect x="11" y="16" width="6" height="8" rx="2" fill="#ea580c" />
  </g>

  <!-- Key ring with keys dropped on a small mat -->
  <ellipse cx="165" cy="210" rx="14" ry="7" fill="#334155" />
  <circle cx="163" cy="209" r="3" fill="#fbbf24" filter="url(#dropShadow)" />
  <path d="M165 209 L173 205 M170 207 L173 209" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" filter="url(#dropShadow)" />

  <!-- Action Visual Effects: "JUST ARRIVED" Motion & Energy Lines -->
  <!-- Swirling dynamic wind/motion lines showing recent entrance from the door -->
  <path d="M45 110 C70 110 80 150 110 170" fill="none" stroke="url(#motionTrail)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6" />
  <path d="M35 130 C55 130 65 160 90 180" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Sparkles / Freshness indicators (Action moment highlights) -->
  <g fill="#10b981">
    <!-- Sparkle 1 -->
    <path d="M95 135 C95 135 97 129 99 135 C101 135 97 141 95 135 Z" />
    <path d="M93 137 C93 137 99 133 99 133 C99 133 95 139 93 137 Z" />
    
    <!-- Sparkle 2 -->
    <path d="M125 115 C125 115 126 111 128 115 C130 115 126 119 125 115 Z" />
    <path d="M124 116 C124 116 129 113 129 113 C129 113 126 118 124 116 Z" fill="#fbbf24" />

    <!-- Sparkle 3 (near door) -->
    <path d="M55 85 C55 85 57 81 59 85 C61 85 57 89 55 85 Z" fill="#38bdf8" />
  </g>

  <!-- Floating "Just Now" Ripple Rings (Expanding energy from entrance) -->
  <ellipse cx="65" cy="150" rx="15" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  <ellipse cx="85" cy="165" rx="22" ry="8" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Foreground Atmospheric Vignette / Frame Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15" />
</svg>