<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm Outdoor / Golden Hour Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2d4a"/>
      <stop offset="50%" stop-color="#4a3525"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Rain / Water ripple gradient -->
    <linearGradient id="rain-grad" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Umbrella Gradient -->
    <linearGradient id="umbrella-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Wind Gust Gradient -->
    <linearGradient id="wind-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- SCENE LAYER: Outdoor Picnic / Travel Plan Context (Impacted by Weather) -->
  <g id="scene-background">
    <!-- Sky backdrop -->
    <rect x="0" y="0" width="240" height="150" fill="url(#sky-grad)" rx="24"/>
    <path d="M0 150 H240 V240 H0 Z" fill="#0f172a"/>

    <!-- Distant park hills / trees -->
    <path d="M-10 150 Q 50 110, 110 145 T 250 135 V 150 Z" fill="#1b2a3a"/>
    <path d="M30 150 Q 100 120, 180 148 T 260 140 V 150 Z" fill="#16202b"/>

    <!-- Puddle on the ground (Showing effect) -->
    <ellipse cx="140" cy="180" rx="45" ry="12" fill="#0284c7" opacity="0.3"/>
    <ellipse cx="140" cy="180" rx="35" ry="8" fill="#0ea5e9" opacity="0.4"/>
    <!-- Ripple concentric lines -->
    <ellipse cx="140" cy="180" rx="20" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="135" cy="179" rx="8" ry="2" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>

    <!-- Toppled picnic basket (Impact/Disruption prop) -->
    <g transform="translate(60, 160) rotate(-25)">
      <!-- Basket body -->
      <path d="M0 15 C0 5, 5 0, 15 0 C25 0, 30 5, 30 15 L28 25 C28 28, 25 30, 15 30 C5 30, 2 28, 2 25 Z" fill="#d97706" filter="url(#shadow)"/>
      <path d="M2 12 H28 M4 20 H26" stroke="#92400e" stroke-width="2"/>
      <!-- Handle -->
      <path d="M8 3 C8 -8, 22 -8, 22 3" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Spilled apple rolling from basket -->
    <circle cx="95" cy="172" r="6" fill="#ef4444" filter="url(#shadow)"/>
    <path d="M95 166 L96 163" stroke="#166534" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Blown away picnic mat / cloth -->
    <path d="M40 165 Q 80 150, 120 170 T 180 160" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- WIND GUST / IMPACT LINES (Visualizing "Influence/Effect") -->
  <g id="wind-effects">
    <path d="M10 50 Q 60 45, 110 60 T 210 50" fill="none" stroke="url(#wind-grad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 80 Q 90 70, 150 90 T 230 75" fill="none" stroke="url(#wind-grad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 110 Q 70 100, 130 120 T 225 110" fill="none" stroke="url(#wind-grad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- RAIN STREAKS (Atmospheric Weather Element) -->
  <g id="rain" opacity="0.6">
    <line x1="45" y1="20" x2="35" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="10" x2="75" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="125" y1="30" x2="115" y2="70" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="175" y1="15" x2="165" y2="55" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="210" y1="40" x2="200" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <line x1="25" y1="80" x2="15" y2="120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="65" y1="70" x2="55" y2="110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="105" y1="90" x2="95" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="155" y1="75" x2="145" y2="115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="195" y1="95" x2="185" y2="135" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: Traveler/Person struggling against the weather (Impacted Plans) -->
  <g id="main-character" filter="url(#shadow)" transform="translate(10, 0)">
    <!-- Character Shadow -->
    <ellipse cx="110" cy="212" rx="22" ry="6" fill="#000000" opacity="0.5"/>

    <!-- Legs leaning forward against the wind -->
    <g id="legs">
      <!-- Back Leg -->
      <path d="M100 170 L90 205 L102 208" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Front Leg -->
      <path d="M115 170 L125 202 L115 208" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Shoes -->
      <ellipse cx="100" cy="208" rx="7" ry="4" fill="#f59e0b"/>
      <ellipse cx="116" cy="208" rx="7" ry="4" fill="#f59e0b"/>
    </g>

    <!-- Torso (leaning heavily into the wind to the left) -->
    <path d="M95 125 Q 115 130, 112 172 L 98 172 Q 90 145, 95 125 Z" fill="#0ea5e9"/>

    <!-- Backpack -->
    <path d="M85 130 C75 130, 75 160, 85 165 L92 165 C92 150, 92 140, 85 130 Z" fill="#fb923c"/>

    <!-- Arms holding umbrella shaft -->
    <path d="M102 138 L 125 125" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round"/>
    <path d="M105 145 L 122 135" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="126" cy="124" rx="4" ry="4" fill="#fbcfe8"/>

    <!-- Head & Face (determined/surprised expression) -->
    <g id="head" transform="translate(100, 110)">
      <circle cx="0" cy="0" r="15" fill="#fbcfe8"/>
      <!-- Hair blowing back -->
      <path d="M-10 -10 C -5 -18, 10 -15, 12 -5 C 15 -8, 8 -20, -5 -18 Z" fill="#334155"/>
      <!-- Face features (eyes squinted against wind) -->
      <path d="M-4 -2 L 2 -4" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M4 -2 L 10 -4" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Surprised/O-shaped mouth -->
      <circle cx="3" cy="6" r="3" fill="#1e293b"/>
      <!-- Rosy cheek -->
      <circle cx="-3" cy="3" r="3" fill="#f43f5e" opacity="0.4"/>
    </g>

    <!-- AN UMBRELLA BEING FLIPPED INSIDE OUT (Classic symbol of strong external influence/force) -->
    <g id="flipped-umbrella" transform="translate(135, 100)">
      <!-- Umbrella Handle & Shaft -->
      <path d="M-15 45 C -15 20, -5 0, 0 -15" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <path d="M-18 42 C -18 50, -12 52, -12 47" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

      <!-- Canopy inverted upward by wind force -->
      <path d="M-55 -35 Q 0 -65, 55 -35 Q 15 -10, 0 -15 Q -15 -10, -55 -35 Z" fill="url(#umbrella-grad)" filter="url(#shadow)"/>
      <!-- Umbrella ribs showing inside out -->
      <path d="M0 -15 Q -10 -25, -55 -35" fill="none" stroke="#fda4af" stroke-width="2"/>
      <path d="M0 -15 Q 0 -35, 0 -65" fill="none" stroke="#fda4af" stroke-width="2"/>
      <path d="M0 -15 Q 10 -25, 55 -35" fill="none" stroke="#fda4af" stroke-width="2"/>
      <!-- Umbrella tip pointing backward -->
      <circle cx="0" cy="-68" r="4" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- DECORATIVE FRONT ELEMENTS (Depth of Field blur particles) -->
  <g id="foreground-particles" opacity="0.8">
    <circle cx="30" cy="190" r="3" fill="#38bdf8"/>
    <circle cx="200" cy="170" r="4" fill="#38bdf8"/>
    <circle cx="220" cy="210" r="2" fill="#fbbf24"/>
    <circle cx="15" cy="140" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- High-end vignette/border glow inside the rounded canvas -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1"/>
</svg>