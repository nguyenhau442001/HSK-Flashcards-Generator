<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Road Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Van Body Gradient -->
    <linearGradient id="vanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Background Elements (Stars, City Silhouette, Sunrise/Sunset Glow) -->
  <circle cx="190" cy="70" r="25" fill="#fbbf24" opacity="0.2" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="90" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="140" cy="45" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="210" cy="30" r="1" fill="#ffffff" opacity="0.7"/>

  <!-- Distant Mountains / City Skyline -->
  <path d="M0 130 L30 110 L55 125 L90 95 L120 120 L160 85 L200 115 L240 90 L240 140 L0 140 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Road / Pathway (Perspective View representing "Departure/Journey") -->
  <path d="M0 240 L90 130 L150 130 L240 240 Z" fill="url(#roadGrad)"/>
  
  <!-- Road Center Dashed Lines -->
  <polygon points="118,135 122,135 124,150 116,150" fill="#fbbf24" opacity="0.8"/>
  <polygon points="116,160 124,160 126,180 114,180" fill="#fbbf24" opacity="0.8"/>
  <polygon points="113,190 127,190 130,220 110,220" fill="#fbbf24" opacity="0.8"/>

  <!-- Motion Lines / Speed Lines (Action) -->
  <line x1="20" y1="180" x2="60" y2="165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="10" y1="200" x2="50" y2="185" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="180" y1="165" x2="220" y2="180" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="190" y1="185" x2="230" y2="200" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Headlight Beams -->
  <polygon points="75,168 15,225 35,235 80,175" fill="url(#beamGrad)"/>
  <polygon points="165,168 225,225 205,235 160,175" fill="url(#beamGrad)"/>

  <!-- Main Subject: Adventure Travel Van (Ready for Departure) -->
  <g transform="translate(0, 5)">
    <!-- Van Shadow -->
    <ellipse cx="120" cy="180" rx="55" ry="12" fill="#020617" opacity="0.6"/>

    <!-- Van Roof Rack & Luggage (Detail for journey) -->
    <rect x="90" y="112" WIDTH="60" HEIGHT="4" rx="2" fill="#0f172a"/>
    <rect x="98" y="100" width="22" height="12" rx="2" fill="#10b981"/>
    <rect x="124" y="104" width="18" height="8" rx="2" fill="#f59e0b"/>

    <!-- Van Body Base -->
    <path d="M 75 140 
             L 85 122 
             C 88 118, 93 115, 100 115 
             L 140 115 
             C 147 115, 152 118, 155 122 
             L 165 140 
             Z" fill="#e2e8f0"/> <!-- Roof/Top trim -->

    <!-- Main Chassis -->
    <rect x="70" y="138" width="100" height="35" rx="8" fill="url(#vanGrad)"/>
    
    <!-- Side Door Panel Line -->
    <line x1="120" y1="138" x2="120" y2="173" stroke="#be123c" stroke-width="2"/>
    <circle cx="115" cy="155" r="2" fill="#be123c"/>

    <!-- Windshield & Windows -->
    <path d="M 88 138 L 96 122 L 144 122 L 152 138 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Windshield Divider -->
    <line x1="120" y1="122" x2="120" y2="138" stroke="#0f172a" stroke-width="2" opacity="0.3"/>

    <!-- Side Windows -->
    <rect x="76" y="142" width="18" height="12" rx="2" fill="#38bdf8" opacity="0.7"/>
    <rect x="146" y="142" width="18" height="12" rx="2" fill="#38bdf8" opacity="0.7"/>

    <!-- Headlights & Grill -->
    <rect x="68" y="152" width="4" height="8" rx="2" fill="#fef08a" filter="url(#glow)"/>
    <rect x="168" y="152" width="4" height="8" rx="2" fill="#fef08a" filter="url(#glow)"/>
    <rect x="85" y="156" width="70" height="6" rx="3" fill="#0f172a"/>
    <!-- Front Emblem/Bumper -->
    <rect x="110" y="166" width="20" height="3" rx="1.5" fill="#94a3b8"/>

    <!-- Wheels -->
    <!-- Rear Left Wheel -->
    <circle cx="92" cy="173" r="14" fill="#0f172a"/>
    <circle cx="92" cy="173" r="7" fill="#94a3b8"/>
    <circle cx="92" cy="173" r="3" fill="#0f172a"/>

    <!-- Rear Right Wheel -->
    <circle cx="148" cy="173" r="14" fill="#0f172a"/>
    <circle cx="148" cy="173" r="7" fill="#94a3b8"/>
    <circle cx="148" cy="173" r="3" fill="#0f172a"/>
  </g>

  <!-- Foreground Atmospheric Elements (Departure excitement, dust/sparkles) -->
  <circle cx="65" cy="195" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="55" cy="205" r="2" fill="#f59e0b" opacity="0.9"/>
  <circle cx="180" cy="190" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="195" cy="200" r="3.5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="120" cy="225" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- Decorative Border / Frame consistency -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>