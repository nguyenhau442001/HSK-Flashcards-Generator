<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light Cone -->
    <linearGradient id="lightCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements -->
  <!-- Cityscape Silhouette / Windows -->
  <g fill="#334155" opacity="0.4">
    <rect x="20" y="80" width="30" height="120" rx="2" />
    <rect x="190" y="70" width="35" height="130" rx="2" />
    <rect x="15" y="100" width="10" height="15" fill="#64748b" />
    <rect x="35" y="110" width="10" height="15" fill="#64748b" />
    <rect x="200" y="90" width="12" height="18" fill="#64748b" />
  </g>

  <!-- Streetlamp & Light Beam -->
  <path d="M 215 30 L 215 150 L 212 150 L 212 30 Z" fill="#475569" />
  <path d="M 200 25 L 230 25 L 240 35 L 190 35 Z" fill="#64748b" />
  <polygon points="215,35 110,240 240,240" fill="url(#lightCone)" />

  <!-- Ground Plane (Street/Crosswalk) -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16" />
  <rect x="0" y="186" width="240" height="4" fill="#38bdf8" opacity="0.8" />
  
  <!-- Crosswalk Stripes -->
  <g fill="#64748b" opacity="0.5">
    <polygon points="30,210 50,210 55,240 25,240" />
    <polygon points="80,210 100,210 115,240 85,240" />
    <polygon points="130,210 150,210 165,240 135,240" />
    <polygon points="180,210 200,210 215,240 185,240" />
  </g>

  <!-- Hazard / Caution Glowing Element (Teetering Stack on a tray) -->
  <g filter="url(#shadow)">
    <!-- Motion lines indicating sudden stop/balance -->
    <path d="M 50 110 C 45 115 45 125 50 130" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 42 118 C 38 122 38 128 42 132" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Tray -->
    <path d="M 85 160 L 135 160 L 130 166 L 90 166 Z" fill="#94a3b8" />
    
    <!-- Teetering Stack of Objects (Cups, Bowls - suggesting fragility & care) -->
    <ellipse cx="110" cy="160" rx="22" ry="4" fill="#cbd5e1" />
    
    <!-- Bowl 1 -->
    <path d="M 95 160 Q 110 145 125 160 Z" fill="#ec4899" />
    <ellipse cx="110" cy="147" rx="15" ry="3" fill="#f472b6" />
    
    <!-- Glowing Liquid / Splash about to spill -->
    <path d="M 102 147 Q 110 138 118 147 Z" fill="#fbbf24" />
    
    <!-- Bowl 2 (Balanced precariously) -->
    <path d="M 100 144 Q 110 130 120 144 Z" fill="#38bdf8" />
    
    <!-- Tiny floating droplet -->
    <circle cx="124" cy="132" r="3" fill="#fbbf24" />
  </g>

  <!-- Main Character: Expressive, Balancing, Cautious Posture -->
  <g filter="url(#shadow)">
    <!-- Back Leg / Foot planted carefully -->
    <path d="M 115 165 L 100 200 L 115 205 L 125 175 Z" fill="#1e293b" />
    <ellipse cx="118" cy="204" rx="12" ry="4" fill="#0f172a" />

    <!-- Front Leg / Stepping cautiously -->
    <path d="M 135 165 L 155 195 L 175 190 L 150 160 Z" fill="#334155" />
    <ellipse cx="168" cy="191" rx="10" ry="4" fill="#0f172a" />

    <!-- Torso (Leaning back slightly to counterbalance) -->
    <path d="M 100 115 L 140 120 L 135 170 L 105 165 Z" fill="#f43f5e" />
    <!-- Trendy Hoodie Details -->
    <path d="M 100 115 L 120 145 L 140 120" fill="#e11d48" opacity="0.4" />
    <path d="M 118 145 L 122 170" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

    <!-- Left Arm (Reaching forward, holding tray/balancing) -->
    <path d="M 105 120 L 75 145 L 90 162 L 110 135 Z" fill="#f43f5e" />
    <!-- Hand -->
    <circle cx="80" cy="153" r="6" fill="#fbcfe8" />

    <!-- Right Arm (Raised for balance) -->
    <path d="M 135 125 L 155 110 L 165 125 L 145 135 Z" fill="#e11d48" />
    <circle cx="160" cy="117" r="6" fill="#fbcfe8" />

    <!-- Neck -->
    <rect x="115" y="105" width="12" height="15" fill="#fbcfe8" />

    <!-- Head (Slightly tilted, intense focus) -->
    <circle cx="122" cy="90" r="22" fill="#fbcfe8" />

    <!-- Hair (Dynamic, wind-blown or tension-spiked) -->
    <path d="M 100 90 C 100 70 120 65 135 75 C 142 80 145 90 145 90 C 145 90 140 75 125 72 C 110 70 102 80 100 90 Z" fill="#0f172a" />
    <path d="M 132 73 C 142 75 148 85 148 95 L 142 90 C 142 85 138 78 132 73 Z" fill="#0f172a" />

    <!-- Facial Expression: Extreme Focus & Caution ("小心") -->
    <!-- Eyebrows (Furrowed, tense) -->
    <path d="M 110 82 L 122 86" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 128 86 L 140 82" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Wide, focused, darting intently) -->
    <circle cx="116" cy="91" r="3.5" fill="#0f172a" />
    <circle cx="134" cy="91" r="3.5" fill="#0f172a" />
    <circle cx="117" cy="90" r="1" fill="#ffffff" />
    <circle cx="135" cy="90" r="1" fill="#ffffff" />

    <!-- Sweat Drop (Classic visual shorthand for tension/careful effort) -->
    <path d="M 142 85 C 145 90 142 95 139 93 C 137 91 137 87 142 85 Z" fill="#38bdf8" opacity="0.9" filter="url(#shadow)" />
    <path d="M 140 88 Q 142 91 141 92" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" />

    <!-- Mouth (Tensed, small 'o' shape of concentration) -->
    <ellipse cx="125" cy="102" rx="3.5" ry="2.5" fill="#0f172a" />
  </g>

  <!-- Foreground Atmospheric Sparks / Caution Ambiance -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="65" cy="120" r="2" />
    <circle cx="155" cy="150" r="1.5" />
    <circle cx="95" cy="85" r="2.5" />
    <circle cx="180" cy="80" r="1.5" />
  </g>
</svg>