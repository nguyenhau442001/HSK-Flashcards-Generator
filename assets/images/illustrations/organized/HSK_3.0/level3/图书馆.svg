<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Lamp Cone Light -->
    <linearGradient id="lamp-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.05" />
    </linearGradient>

    <!-- Window/Moonlight Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment: Archways & Large Bookshelves -->
  <!-- Left Arch Wall -->
  <path d="M0 0 L60 0 L60 240 L0 240 Z" fill="#1e293b" />
  <path d="M40 20 L60 20 L60 220 L40 220 Z" fill="#0f172a" opacity="0.6" />
  
  <!-- Right Arch Wall -->
  <path d="M180 0 L240 0 L240 240 L180 240 Z" fill="#1e293b" />
  <path d="M180 20 L200 20 L200 220 L180 220 Z" fill="#0f172a" opacity="0.6" />

  <!-- Arched Window in Background Center -->
  <path d="M95 30 Q120 15 145 30 L145 110 L95 110 Z" fill="url(#window-glow)" />
  <!-- Window Panes -->
  <path d="M120 30 L120 110 M95 70 L145 70" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4" />
  <path d="M95 30 Q120 15 145 30 L145 110 L95 110 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7" />

  <!-- Background Bookshelf Rows -->
  <g fill="#0f172a" opacity="0.85">
    <!-- Shelf 1 -->
    <rect x="60" y="45" width="35" height="6" rx="2" />
    <rect x="145" y="45" width="35" height="6" rx="2" />
    <!-- Colorful tiny books on bg shelves -->
    <path d="M65 30 h4 v15 h-4 z" fill="#f43f5e" />
    <path d="M71 33 h5 v12 h-5 z" fill="#3b82f6" />
    <path d="M78 28 h4 v17 h-4 z" fill="#10b981" />
    
    <path d="M152 31 h5 v14 h-5 z" fill="#eab308" />
    <path d="M159 29 h4 v16 h-4 z" fill="#a855f7" />
    <path d="M165 33 h6 v12 h-6 z" fill="#fb923c" />

    <!-- Shelf 2 -->
    <rect x="60" y="85" width="35" height="6" rx="2" />
    <rect x="145" y="85" width="35" height="6" rx="2" />
    <path d="M66 70 h4 v15 h-4 z" fill="#06b6d4" />
    <path d="M72 73 h5 v12 h-5 z" fill="#ec4899" />
    <path d="M153 71 h5 v14 h-5 z" fill="#84cc16" />
    <path d="M160 68 h4 v17 h-4 z" fill="#6366f1" />
  </g>

  <!-- Main Wooden Study Desk (Foreground) -->
  <g filter="url(#shadow)">
    <!-- Desk Top Surface -->
    <path d="M30 140 L210 140 L220 190 L20 190 Z" fill="#78350f" />
    <!-- Desk Front Bevel -->
    <path d="M20 190 L220 190 L220 198 L20 198 Z" fill="#451a03" />
    <!-- Desk Legs -->
    <rect x="35" y="198" width="14" height="35" rx="3" fill="#451a03" />
    <rect x="191" y="198" width="14" height="35" rx="3" fill="#451a03" />
  </g>

  <!-- Open Magic Book (Centerpiece) -->
  <g filter="url(#shadow)">
    <!-- Book Shadow Base -->
    <ellipse cx="120" cy="165" rx="55" ry="12" fill="#000000" opacity="0.5" />

    <!-- Left Page -->
    <path d="M70 145 Q120 135 120 175 Q95 180 70 170 Z" fill="#f8fafc" />
    <!-- Right Page -->
    <path d="M170 145 Q120 135 120 175 Q145 180 170 170 Z" fill="#f8fafc" />
    <!-- Center Spine Binding -->
    <path d="M117 137 L123 137 L123 177 L117 177 Z" fill="#334155" />

    <!-- Abstract Book Illustrations & Glowing Text lines (No real text per rules) -->
    <!-- Left page content -->
    <path d="M80 152 H105 M80 158 H100 M80 164 H108" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="95" cy="155" r="3" fill="#38bdf8" />
    
    <!-- Right page content with Action/Knowledge Starburst -->
    <path d="M135 152 H160 M135 158 H155 M135 164 H150" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <path d="M145 152 L148 148 L152 145" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />

    <!-- Glowing magical elements lifting from the book -->
    <path d="M120 135 Q130 110 145 100" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />
    <path d="M120 135 Q110 115 95 105" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Floating Glowing Knowledge Orbs & Sparkles -->
  <g>
    <circle cx="148" cy="95" r="4" fill="#fbbf24" filter="url(#shadow)" />
    <circle cx="90" cy="100" r="3" fill="#38bdf8" filter="url(#shadow)" />
    <path d="M110 85 L113 91 L119 94 L113 97 L110 103 L107 97 L101 94 L107 91 Z" fill="#f43f5e" opacity="0.9" />
    <path d="M158 115 L160 119 L164 121 L160 123 L158 127 L156 123 L152 121 L156 119 Z" fill="#a855f7" opacity="0.8" />
  </g>

  <!-- Cozy Desk Lamp (Left Side) -->
  <g filter="url(#shadow)">
    <!-- Lamp Base -->
    <ellipse cx="60" cy="142" rx="14" ry="5" fill="#334155" />
    <!-- Lamp Stand/Arm -->
    <path d="M60 142 L50 110 L65 90" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp Shade -->
    <path d="M52 82 L78 82 L86 98 L44 98 Z" fill="#f59e0b" />
    <!-- Bulb / Inner Glow -->
    <ellipse cx="65" cy="98" rx="8" ry="3" fill="#fef08a" />
  </g>

  <!-- Light Cone from Desk Lamp -->
  <polygon points="65,100 25,185 105,185" fill="url(#lamp-cone)" style="mix-blend-mode: screen;" />

  <!-- Stack of Extra Books (Right Side) -->
  <g filter="url(#shadow)">
    <!-- Bottom Book (Blue) -->
    <path d="M175 168 L205 160 L212 172 L182 180 Z" fill="#0284c7" />
    <path d="M175 168 L182 180 L182 183 L175 171 Z" fill="#0369a1" />
    
    <!-- Middle Book (Coral) -->
    <path d="M172 156 L202 150 L208 161 L178 167 Z" fill="#f43f5e" />
    <path d="M172 156 L178 167 L178 170 L172 159 Z" fill="#be123c" />

    <!-- Top Book (Emerald) -->
    <path d="M176 144 L200 140 L205 150 L181 154 Z" fill="#10b981" />
    <path d="M176 144 L181 154 L181 157 L176 147 Z" fill="#047857" />

    <!-- Cute Small Plant in Pot on top of Books -->
    <path d="M185 130 L195 130 L197 141 L183 141 Z" fill="#f8fafc" />
    <ellipse cx="190" cy="130" rx="5" ry="2" fill="#e2e8f0" />
    <!-- Plant Leaves -->
    <path d="M190 130 Q183 115 178 120 Q183 128 190 130 Z" fill="#22c55e" />
    <path d="M190 130 Q198 112 203 118 Q198 126 190 130 Z" fill="#16a34a" />
    <path d="M190 130 Q190 110 193 110 Q193 125 190 130 Z" fill="#4ade80" />
  </g>

  <!-- Foreground Ambient Depth Vignette -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.15" />
</svg>