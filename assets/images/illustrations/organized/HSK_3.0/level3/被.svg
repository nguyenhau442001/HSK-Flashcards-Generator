<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Table Surface -->
    <rect x="0" y="120" width="160" height="15" rx="4" fill="#334155"/>
    
    <!-- Broken Cup Fragments -->
    <path d="M40 120 L55 80 L70 120 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M80 120 L95 90 L110 120 Z" fill="#fbbf24" opacity="0.9"/>
    <path d="M120 120 L135 100 L150 120 Z" fill="#fbbf24" opacity="0.7"/>
    
    <!-- Main Cup Body (Broken) -->
    <path d="M50 40 C 50 30, 130 30, 130 40 L 125 115 C 125 120, 55 120, 55 115 Z" fill="#f59e0b"/>
    <path d="M130 50 C 150 50, 150 80, 130 85" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Motion/Action Lines -->
    <path d="M30 70 Q 50 50 70 70" stroke="#38bdf8" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
    <path d="M110 60 Q 130 40 150 60" stroke="#ec4899" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
    
    <!-- Impact Star -->
    <path d="M90 100 L95 85 L100 100 L115 105 L100 110 L95 125 L90 110 L75 105 Z" fill="#10b981"/>
