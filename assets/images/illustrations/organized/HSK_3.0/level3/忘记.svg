<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Phone Screen Glow -->
    <radialGradient id="phoneGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Layers -->
  <circle cx="180" cy="80" r="90" fill="url(#lampGlow)" />
  <circle cx="75" cy="145" r="50" fill="url(#phoneGlow)" />

  <!-- SCENE: Cozy Room Interior (Wooden Desk & Wall) -->
  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="150" fill="#1b263b" />
  
  <!-- Wall Shelf -->
  <rect x="30" y="60" width="100" height="8" rx="2" fill="#334155" />
  <!-- Items on Shelf (Books/Plant) -->
  <path d="M45 60 L45 35 L55 35 L55 60 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M57 60 L57 42 L65 42 L65 60 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="100" cy="50" r="8" fill="#10b981" />
  <path d="M96 60 L104 60 L102 50 L98 50 Z" fill="#64748b" />

  <!-- Wooden Desk Surface -->
  <rect x="0" y="150" width="240" height="90" fill="#334155" />
  <rect x="0" y="145" width="240" height="8" rx="2" fill="#475569" />

  <!-- PROP 1: Desk Lamp (Right Side) -->
  <path d="M190 145 L180 90 L200 90 Z" fill="#64748b" />
  <path d="M165 90 C165 60 195 60 195 90 Z" fill="#f59e0b" filter="url(#shadow)" />
  <ellipse cx="180" cy="90" rx="15" ry="5" fill="#fbbf24" />

  <!-- PROP 2: Coffee Mug -->
  <path d="M145 130 L165 130 L160 148 L150 148 Z" fill="#cbd5e1" filter="url(#shadow)" />
  <path d="M165 135 C172 135 172 143 165 143" stroke="#cbd5e1" stroke-width="2.5" fill="none" />
  <!-- Steam from coffee -->
  <path d="M152 120 C150 115 156 110 153 105" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- PROP 3: Open Notebook & Pen -->
  <path d="M25 170 L75 160 L95 195 L45 205 Z" fill="#f8fafc" filter="url(#shadow)" />
  <line x1="60" y1="165" x2="80" y2="200" stroke="#cbd5e1" stroke-width="1" />
  <!-- Pen -->
  <path d="M70 155 L115 180 L113 183 L68 158 Z" fill="#ec4899" filter="url(#shadow)" />

  <!-- MAIN FOCUS SUBJECT: The Forgotten Smartphone & Spatial "Forgot" Effect -->
  <g transform="translate(60, 110)">
    <!-- Phone Shadow -->
    <ellipse cx="25" cy="35" rx="22" ry="8" fill="#000000" opacity="0.6" />

    <!-- Smartphone Body (Tilted, abandoned) -->
    <g transform="rotate(-15, 25, 25)">
      <rect x="5" y="5" width="40" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" filter="url(#shadow)" />
      <!-- Screen -->
      <rect x="8" y="10" width="34" height="60" rx="4" fill="#1e293b" />
      <!-- Subtle notification dot on screen -->
      <circle cx="25" cy="40" r="4" fill="#38bdf8" />
    </g>
  </g>

  <!-- ACTION/NARRATIVE EFFECT: Floating Abstract "Absence" / Forgetfulness Elements -->
  <!-- Glowing question marks & fading memory bubbles drifting away from the phone -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fading Trail Bubbles -->
    <circle cx="95" cy="115" r="3" fill="#38bdf8" opacity="0.4" />
    <circle cx="105" cy="100" r="5" fill="#38bdf8" opacity="0.6" />
    <circle cx="118" cy="80" r="8" fill="#38bdf8" opacity="0.2" />

    <!-- Stylized Floating Question Mark (representing memory slip) -->
    <path d="M102 98 C102 92 110 90 110 96 C110 101 103 102 103 107" stroke="#fbbf24" stroke-width="3" filter="url(#glow)" />
    <circle cx="103" cy="113" r="1.5" fill="#fbbf24" />

    <!-- Second smaller floating question mark -->
    <path d="M130 75 C130 71 135 70 135 74 C135 77 130 78 130 81" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <circle cx="130" cy="85" r="1" fill="#38bdf8" />
  </g>

  <!-- Foreground Atmospheric Vignette / Frame enhancement -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15" />
</svg>