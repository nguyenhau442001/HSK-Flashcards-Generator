<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Floor and Perspective -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#1e293b"/>
  <path d="M0 190 L240 190" stroke="#334155" stroke-width="1"/>

  <!-- Light Spill from Fridge -->
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M145 55 L220 70 L230 210 L145 195 Z" fill="url(#glow)"/>

  <!-- Refrigerator Main Body -->
  <rect x="55" y="45" width="90" height="150" rx="4" fill="#334155"/>
  <rect x="55" y="45" width="90" height="50" rx="4" fill="#475569"/> <!-- Freezer section -->
  
  <!-- Door Gap/Shadow -->
  <rect x="142" y="45" width="3" height="150" fill="#020617" opacity="0.5"/>

  <!-- Open Fridge Interior (Slightly visible) -->
  <rect x="145" y="55" width="5" height="130" fill="#fef3c7"/>
  
  <!-- Refrigerator Door (Ajar) -->
  <rect x="145" y="45" width="12" height="150" rx="2" fill="#64748b"/>
  <rect x="150" y="100" width="4" height="40" rx="2" fill="#94a3b8"/> <!-- Handle -->

  <!-- Context Props: Kitchen Counter -->
  <rect x="0" y="140" width="55" height="50" fill="#1e293b"/>
  <rect x="0" y="140" width="55" height="4" fill="#334155"/>
  
  <!-- Small Plant on Counter -->
  <path d="M20 140 L35 140 L32 130 L23 130 Z" fill="#475569"/>
  <path d="M27 130 Q27 115 35 110" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M27 130 Q27 115 20 115" stroke="#10b981" stroke-width="2" fill="none"/>

  <!-- Interior Details (Visible through the crack) -->
  <!-- Milk Carton (The Context Subject) -->
  <rect x="145" y="130" width="4" height="12" fill="#f8fafc"/>
  <path d="M145 130 L149 130 L147 127 Z" fill="#38bdf8"/>
  
  <!-- Fruit on Shelf -->
  <circle cx="147" cy="155" r="2.5" fill="#fb923c"/>
  <circle cx="147" cy="162" r="2.5" fill="#10b981"/>

  <!-- Decorative Wall Tiles -->
  <line x1="0" y1="80" x2="55" y2="80" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="110" x2="55" y2="110" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  <line x1="25" y1="45" x2="25" y2="140" stroke="#1e293b" stroke-width="1" opacity="0.5"/>

  <!-- Highlights and Reflections -->
  <rect x="65" y="55" width="20" height="2" rx="1" fill="#94a3b8" opacity="0.3"/>
  <rect x="65" y="105" width="40" height="2" rx="1" fill="#94a3b8" opacity="0.3"/>
</svg>