<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Coffee Mug Gradient -->
    <linearGradient id="mugGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Alarm Clock Bell Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Scene Background -->
  <g id="room-background">
    <!-- Wall & Floor Divider -->
    <rect x="0" y="0" width="240" height="170" fill="#1e293b"/>
    <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
    <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="3"/>

    <!-- Window Frame -->
    <g id="window" transform="translate(160, 25)">
      <rect x="0" y="0" width="55" height="95" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <!-- Window Pane Light Beam -->
      <polygon points="5,5 50,5 65,145 -15,145" fill="url(#windowLight)"/>
      <rect x="4" y="4" width="47" height="87" fill="#38bdf8" fill-opacity="0.1"/>
      <!-- Window Cross Bars -->
      <line x1="27" y1="4" x2="27" y2="91" stroke="#475569" stroke-width="2"/>
      <line x1="4" y1="47" x2="51" y2="47" stroke="#475569" stroke-width="2"/>
    </g>

    <!-- Wall Shelf -->
    <rect x="25" y="60" width="80" height="6" rx="2" fill="#475569" filter="url(#softShadow)"/>
    <circle cx="45" cy="48" r="10" fill="#10b981" opacity="0.8"/>
    <path d="M40 58 Q45 45 50 58 Z" fill="#059669"/>
    <rect x="65" y="38" width="16" height="22" rx="2" fill="#ec4899"/>
    <rect x="83" y="40" width="14" height="20" rx="2" fill="#fb923c"/>
  </g>

  <!-- Foreground Props & Main Subject (The "General Routine" scene: Alarm clock, routine cozy setup) -->
  <g id="scene-props">
    <!-- Nightstand -->
    <rect x="60" y="130" width="120" height="75" rx="6" fill="#334155" filter="url(#softShadow)"/>
    <rect x="70" y="145" width="100" height="25" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="120" cy="157.5" r="4" fill="#94a3b8"/>
    <rect x="70" y="178" width="100" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="120" cy="189" r="4" fill="#94a3b8"/>

    <!-- Coffee Mug on Nightstand -->
    <g id="mug" transform="translate(145, 110)">
      <path d="M5 10 C5 5, 25 5, 25 10 L22 28 C22 31, 8 31, 8 28 Z" fill="url(#mugGrad)" filter="url(#softShadow)"/>
      <path d="M22 13 C29 13, 29 23, 22 24" stroke="#0284c7" stroke-width="3" fill="none"/>
      <!-- Steam -->
      <path d="M12 2 C12 0, 16 -1, 14 -4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M18 1 C18 -1, 22 -2, 20 -5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Alarm Clock (Centerpiece representing scheduled / everyday routine time like 7:00) -->
    <g id="alarm-clock" transform="translate(85, 95)" filter="url(#softShadow)">
      <!-- Clock Legs -->
      <line x1="8" y1="42" x2="3" y2="48" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="42" x2="37" y2="48" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <!-- Clock Bells/Hammers -->
      <path d="M12 10 L8 3" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
      <path d="M28 10 L32 3" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
      <path d="M15 4 Q20 -2 25 4 Z" fill="url(#goldGrad)"/>
      <!-- Clock Body -->
      <circle cx="20" cy="24" r="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
      <!-- Clock Face Details -->
      <circle cx="20" cy="24" r="14" fill="#ffffff"/>
      <!-- Clock Hands pointing to 7:00 (Routine time) -->
      <line x1="20" y1="24" x2="14" y2="28" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <line x1="20" y1="24" x2="20" y2="13" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="20" cy="24" r="2" fill="#1e293b"/>
      <!-- Tick Marks -->
      <line x1="20" y1="11" x2="20" y2="12.5" stroke="#64748b" stroke-width="1.5"/>
      <line x1="31" y1="24" x2="29.5" y2="24" stroke="#64748b" stroke-width="1.5"/>
      <line x1="20" y1="37" x2="20" y2="35.5" stroke="#64748b" stroke-width="1.5"/>
      <line x1="9" y1="24" x2="10.5" y2="24" stroke="#64748b" stroke-width="1.5"/>
    </g>

    <!-- Houseplant in Terracotta Pot -->
    <g id="plant" transform="translate(30, 125)" filter="url(#softShadow)">
      <!-- Pot -->
      <path d="M6 30 L10 50 C10 52, 26 52, 26 50 L30 30 Z" fill="#f97316"/>
      <ellipse cx="18" cy="30" rx="12" ry="3" fill="#ea580c"/>
      <!-- Foliage (Rubber Plant / Monstera style leaves) -->
      <path d="M18 30 Q10 15 2 10 Q12 5 18 30 Z" fill="#10b981"/>
      <path d="M18 30 Q25 12 34 5 Q24 2 18 30 Z" fill="#059669"/>
      <path d="M18 30 Q20 8 18 -2 Q15 8 18 30 Z" fill="#34d399"/>
    </g>

    <!-- Slippers neatly placed on the floor (Signifying everyday comfortable routine) -->
    <g id="slippers" transform="translate(100, 195)" filter="url(#softShadow)">
      <!-- Slipper 1 -->
      <g transform="translate(0, 0)">
        <ellipse cx="15" cy="10" rx="14" ry="7" fill="#fbbf24"/>
        <path d="M3 10 C3 4, 27 4, 27 10 C27 13, 23 15, 15 15 C7 15, 3 13, 3 10 Z" fill="#f59e0b"/>
        <ellipse cx="15" cy="9" rx="8" ry="4" fill="#fb923c" opacity="0.5"/>
      </g>
      <!-- Slipper 2 -->
      <g transform="translate(32, 5)">
        <ellipse cx="15" cy="10" rx="14" ry="7" fill="#fbbf24"/>
        <path d="M3 10 C3 4, 27 4, 27 10 C27 13, 23 15, 15 15 C7 15, 3 13, 3 10 Z" fill="#f59e0b"/>
        <ellipse cx="15" cy="9" rx="8" ry="4" fill="#fb923c" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- Atmospheric Lighting & Polish Overlay -->
  <!-- Soft Ambient Glow from Window -->
  <path d="M160 25 L215 25 L240 170 L160 170 Z" fill="#38bdf8" opacity="0.04" style="mix-blend-mode: screen;"/>
</svg>