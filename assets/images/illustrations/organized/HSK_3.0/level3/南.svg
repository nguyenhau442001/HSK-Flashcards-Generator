<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Compass Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Warm Sunlight/Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Building 1 Gradient (School/Institution) -->
    <linearGradient id="bldg1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Building 2 Gradient -->
    <linearGradient id="bldg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="80" r="120" fill="url(#sunGlow)"/>

  <!-- SCENE LAYER: Cityscape / School in the Southern Context -->
  <!-- Distant Hills/Horizon representing terrain -->
  <path d="M0 170 Q 60 150, 120 165 T 240 155 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M0 180 Q 90 165, 160 185 T 240 175 L 240 240 L 0 240 Z" fill="#1e293b" opacity="0.8"/>

  <!-- Background Buildings -->
  <rect x="30" y="110" width="40" height="70" fill="#1e293b" rx="2"/>
  <rect x="170" y="100" width="45" height="80" fill="#1e293b" rx="2"/>

  <!-- Foreground School Building (Contextual Example: School in the southern part of the city) -->
  <g filter="url(#shadow)">
    <!-- Main Structure -->
    <rect x="75" y="90" width="90" height="90" rx="4" fill="url(#bldg1)"/>
    
    <!-- Roof / Accent Top -->
    <polygon points="70,90 120,60 170,90" fill="#0284c7"/>
    <rect x="112" y="50" width="16" height="15" rx="2" fill="#38bdf8"/>
    <circle cx="120" cy="45" r="4" fill="#fbbf24"/>

    <!-- School Windows (Grid) -->
    <!-- Row 1 -->
    <rect x="87" y="105" width="14" height="18" rx="2" fill="#bae6fd"/>
    <rect x="113" y="105" width="14" height="18" rx="2" fill="#bae6fd"/>
    <rect x="139" y="105" width="14" height="18" rx="2" fill="#bae6fd"/>
    
    <!-- Row 2 -->
    <rect x="87" y="133" width="14" height="18" rx="2" fill="#bae6fd"/>
    <rect x="113" y="133" width="14" height="18" rx="2" fill="#e0f2fe"/>
    <rect x="139" y="133" width="14" height="18" rx="2" fill="#bae6fd"/>

    <!-- Double Entrance Door -->
    <path d="M 106 180 L 106 163 Q 120 158 134 163 L 134 180 Z" fill="#0f172a"/>
  </g>

  <!-- Side Building / Trees for Environmental Depth -->
  <rect x="40" y="130" width="30" height="50" fill="url(#bldg2)" rx="2" opacity="0.9"/>
  <!-- Windows on side building -->
  <rect x="48" y="140" width="6" height="10" rx="1" fill="#e9d5ff"/>
  <rect x="56" y="140" width="6" height="10" rx="1" fill="#e9d5ff"/>

  <!-- Street / Ground level -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <!-- Pathway leading to school -->
  <polygon points="105,180 135,180 155,240 85,240" fill="#334155"/>
  <line x1="120" y1="180" x2="120" y2="240" stroke="#64748b" stroke-dasharray="4,4" stroke-width="2"/>

  <!-- Compass Overlay (Emphasizing 'South' Direction) -->
  <g transform="translate(195, 55)" filter="url(#shadow)">
    <!-- Compass Outer Ring -->
    <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="#1e293b"/>
    
    <!-- Compass Needle -->
    <!-- North Pointer (Neutral/Dim) -->
    <polygon points="0,-14 -3,0 0,2" fill="#64748b"/>
    <polygon points="0,-14 3,0 0,2" fill="#475569"/>
    
    <!-- SOUTH Pointer (Highlighted Vibrant Amber/Gold for 'South') -->
    <polygon points="0,16 -3,0 0,-2" fill="#fbbf24"/>
    <polygon points="0,16 3,0 0,-2" fill="#f59e0b"/>
    
    <!-- Center Pin -->
    <circle cx="0" cy="0" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Floating Directional Indicator / Floating Arrow pointing Down/South towards the school -->
  <g filter="url(#shadow)">
    <path d="M 120 10 L 127 20 L 123 20 L 123 28 L 117 28 L 117 20 L 113 20 Z" fill="#fb923c" transform="rotate(180 120 19)" />
  </g>

  <!-- Decorative Foreground Foliage (Stylized Trees) -->
  <g fill="#10b981">
    <!-- Tree Left -->
    <circle cx="25" cy="175" r="16" fill="#059669"/>
    <circle cx="18" cy="185" r="12" fill="#10b981"/>
    <rect x="23" y="190" width="4" height="15" fill="#78350f"/>

    <!-- Tree Right -->
    <circle cx="215" cy="170" r="18" fill="#059669"/>
    <circle cx="223" cy="183" r="14" fill="#10b981"/>
    <rect x="213" y="190" width="4" height="15" fill="#78350f"/>
  </g>

  <!-- Sparkles / Atmosphere -->
  <circle cx="80" cy="50" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="160" cy="40" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="50" cy="80" r="1" fill="#38bdf8" opacity="0.9"/>
  <circle cx="190" cy="90" r="1.5" fill="#38bdf8" opacity="0.7"/>

  <!-- Frame Border / Clean Outline -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>