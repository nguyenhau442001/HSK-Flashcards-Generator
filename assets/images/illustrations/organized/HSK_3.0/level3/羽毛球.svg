<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Court Lines -->
  <path d="M40 180 L200 180 M60 140 L180 140 M120 140 L120 220" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Net -->
  <rect x="20" y="120" width="200" height="20" fill="#334155"/>
  <path d="M20 120 L220 120 M20 130 L220 130 M20 140 L220 140 M40 120 L40 140 M80 120 L80 140 M120 120 L120 140 M160 120 L160 140 M200 120 L200 140" stroke="#475569" stroke-width="1"/>
  
  <!-- Shuttlecock (羽毛球) -->
  <g transform="translate(120, 80) rotate(15)">
    <path d="M-15 -10 L15 -10 L10 20 L-10 20 Z" fill="#f1f5f9"/>
    <path d="M-15 -10 L-20 -30 L-5 -15 Z" fill="#e2e8f0"/>
    <path d="M-5 -10 L0 -35 L10 -10 Z" fill="#e2e8f0"/>
    <path d="M5 -10 L20 -30 L15 -15 Z" fill="#e2e8f0"/>
    <circle cx="0" cy="20" r="8" fill="#fbbf24"/>
    <circle cx="0" cy="20" r="4" fill="#f59e0b"/>
  </g>
  
  <!-- Racket -->
  <g transform="translate(60, 160) rotate(-20)">
    <ellipse cx="0" cy="-40" rx="25" ry="30" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <path d="M-20 -40 L20 -40 M-15 -25 L15 -25 M-22 -40 L22 -40 M0 -65 L0 -15 M-10 -65 L-10 -15 M10 -65 L10 -15" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <rect x="-5" y="-10" width="10" height="60" rx="2" fill="#ec4899"/>
    <rect x="-8" y="40" width="16" height="10" rx="2" fill="#fb923c"/>
  </g>
  
  <!-- Motion Blur/Action Lines -->
  <path d="M140 70 Q160 50 180 40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M135 75 Q150 60 165 55" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>