<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="30" y="160" width="180" height="15" rx="2" fill="#475569"/>
  <rect x="40" y="175" width="10" height="65" fill="#334155"/>
  <rect x="190" y="175" width="10" height="65" fill="#334155"/>
  
  <!-- Books and Props -->
  <path d="M60 150 L110 150 L105 160 L55 160 Z" fill="#fbbf24"/>
  <rect x="120" y="140" width="40" height="20" rx="2" fill="#ec4899"/>
  <circle cx="175" cy="150" r="8" fill="#38bdf8"/>
  
  <!-- Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 20 Q-40 60 0 60 Q40 60 40 20 L20 -20 L-20 -20 Z" fill="#94a3b8"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="30" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-30 -45 Q-20 -75 0 -75 Q20 -75 30 -45 Z" fill="#fb923c"/>
    <!-- Arms -->
    <path d="M-40 0 L-60 30" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 0 L60 30" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-45" r="3" fill="#0f172a"/>
    <circle cx="10" cy="-45" r="3" fill="#0f172a"/>
    <!-- Mouth -->
    <path d="M-10 -30 Q0 -25 10 -30" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="100" r="100" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>