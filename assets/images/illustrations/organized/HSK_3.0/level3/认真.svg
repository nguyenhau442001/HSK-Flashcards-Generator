<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Top Gradient -->
    <linearGradient id="deskTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Character Skin Shadow -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting (Lamp cone) -->
  <polygon points="120,45 20,200 220,200" fill="url(#lampGlow)" style="mix-blend-mode: screen;" />

  <!-- Background Environment & Bookshelf -->
  <g opacity="0.4">
    <!-- Shelf -->
    <rect x="25" y="70" width="190" height="6" rx="3" fill="#475569"/>
    <!-- Books on shelf -->
    <rect x="35" y="45" width="14" height="25" rx="2" fill="#ef4444"/>
    <rect x="51" y="40" width="18" height="30" rx="2" fill="#3b82f6"/>
    <rect x="71" y="50" width="10" height="20" rx="2" fill="#10b981"/>
    <rect x="185" y="42" width="16" height="28" rx="2" fill="#f59e0b"/>
    <rect x="203" y="47" width="12" height="23" rx="2" fill="#ec4899"/>
    <!-- Window with Night City Silhouette -->
    <rect x="95" y="15" width="50" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="120" y1="15" x2="120" y2="70" stroke="#334155" stroke-width="2"/>
    <line x1="95" y1="42" x2="145" y2="42" stroke="#334155" stroke-width="2"/>
    <rect x="102" y="25" width="6" height="10" fill="#38bdf8" opacity="0.6"/>
    <rect x="111" y="30" width="5" height="15" fill="#f59e0b" opacity="0.5"/>
    <rect x="132" y="22" width="7" height="18" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- Hanging Desk Lamp -->
  <path d="M120,0 L120,35" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M100,35 L140,35 L148,45 L92,45 Z" fill="#64748b"/>
  <ellipse cx="120" cy="45" rx="28" ry="8" fill="#fbbf24" opacity="0.9"/>

  <!-- Back of Chair -->
  <rect x="85" y="110" width="70" height="85" rx="16" fill="#334155"/>
  <rect x="95" y="120" width="50" height="65" rx="10" fill="#1e293b" opacity="0.5"/>

  <!-- Desk Surface (Lower Third) -->
  <path d="M 0,175 L 240,175 L 240,230 Q 240,240 230,240 L 10,240 Q 0,240 0,230 Z" fill="url(#deskGrad)"/>
  <path d="M 0,175 L 240,175 L 240,183 L 0,183 Z" fill="url(#deskTop)"/>

  <!-- Desk Props (Laptop, Papers, Pen Holder) -->
  <g transform="translate(0, 5)">
    <!-- Laptop Base -->
    <path d="M 140,173 L 215,173 L 225,182 L 130,182 Z" fill="#94a3b8"/>
    <!-- Laptop Screen -->
    <path d="M 142,125 L 213,125 L 215,173 L 140,173 Z" fill="#475569"/>
    <!-- Screen Display / Code or Charts -->
    <path d="M 147,130 L 208,130 L 210,168 L 145,168 Z" fill="#0f172a"/>
    <rect x="152" y="136" width="25" height="4" rx="2" fill="#38bdf8"/>
    <rect x="152" y="144" width="45" height="3" rx="1.5" fill="#10b981"/>
    <rect x="152" y="151" width="35" height="3" rx="1.5" fill="#f59e0b"/>
    <rect x="152" y="158" width="20" height="3" rx="1.5" fill="#ec4899"/>
    <!-- Screen Glow overlay -->
    <polygon points="145,130 210,130 210,168 145,168" fill="url(#screenGlow)" style="mix-blend-mode: screen;"/>

    <!-- Coffee Mug -->
    <rect x="200" y="157" width="16" height="20" rx="3" fill="#f8fafc"/>
    <path d="M 216,161 C 221,161 221,171 216,171" stroke="#f8fafc" stroke-width="2.5" fill="none"/>
    <path d="M204,153 Q206,148 204,143" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Open Notebook & Papers -->
    <path d="M 45,170 Q 75,164 105,170 L 105,185 Q 75,179 45,185 Z" fill="#f1f5f9"/>
    <path d="M 75,166 L 75,182" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Pencil / Pen -->
    <path d="M 30,178 L 55,168 L 57,172 L 32,182 Z" fill="#fbbf24"/>
    <polygon points="55,168 59,166 57,172" fill="#334155"/>
  </g>

  <!-- CHARACTER: "Renzhen" (Intensely focused, lean-forward posture, expressive concentrated eyebrows) -->
  <g id="focused-character">
    <!-- Body / Hoodie / Torso leaning forward -->
    <path d="M 75,210 C 70,185 85,155 120,150 C 155,155 170,185 165,210 Z" fill="#3b82f6"/>
    <!-- Hoodie Collar / Details -->
    <path d="M 100,152 C 110,165 130,165 140,152" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <path d="M 115,162 L 110,185" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <path d="M 125,162 L 130,185" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>

    <!-- Arms / Hands propping up the head or typing -->
    <!-- Left Arm (bent, supporting chin/head area) -->
    <path d="M 85,170 Q 95,145 110,140" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/>
    <!-- Right Arm (reaching forward to keyboard/desk) -->
    <path d="M 150,170 Q 155,155 140,150" fill="none" stroke="#3b82f6" stroke-width="15" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="112" cy="138" r="8" fill="url(#skinGrad)"/>
    <circle cx="138" cy="148" r="7" fill="url(#skinGrad)"/>

    <!-- Neck -->
    <path d="M 108,135 L 132,135 L 130,155 L 110,155 Z" fill="url(#skinGrad)"/>
    <path d="M 115,138 L 125,138" stroke="#cbd5e1" stroke-width="2" opacity="0.5"/>

    <!-- Head / Face (Angled slightly forward with intense concentration) -->
    <g transform="translate(120, 118)">
      <!-- Hair Base (Dark messy/styled hair) -->
      <path d="M -32,-15 C -35,-35 -15,-42 0,-42 C 15,-42 35,-35 32,-15 C 35,5 30,15 28,15 C 25,15 22,-5 18,-8 C 12,-12 8,-5 0,-10 C -8,-5 -12,-12 -18,-8 C -22,-5 -25,15 -28,15 C -30,15 -35,5 -32,-15 Z" fill="#0f172a"/>
      
      <!-- Face Shape -->
      <path d="M -28,-10 C -28,18 -18,28 0,28 C 18,28 28,18 28,-10 C 28,-22 15,-28 0,-28 C -15,-28 -28,-22 -28,-10 Z" fill="url(#skinGrad)"/>

      <!-- Dynamic Ears -->
      <circle cx="-29" cy="-2" r="6" fill="url(#skinGrad)"/>
      <circle cx="29" cy="-2" r="6" fill="url(#skinGrad)"/>

      <!-- Intensity Feature: Focused Eyebrows (Slanted down inward aggressively for extreme concentration) -->
      <path d="M -18,-9 L -4,-3" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 18,-9 L 4,-3" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Eyes (Determined, sharp dots with light reflection) -->
      <circle cx="-11" cy="0" r="3.5" fill="#0f172a"/>
      <circle cx="11" cy="0" r="3.5" fill="#0f172a"/>
      <circle cx="-10" cy="-1" r="1.2" fill="#ffffff"/>
      <circle cx="12" cy="-1" r="1.2" fill="#ffffff"/>

      <!-- Intense/Focused Mouth (Firmly set, straight line with slight tension) -->
      <path d="M -6,14 L 6,14" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

      <!-- Rosy Concentrated Cheeks / Sweat Drop for hard work -->
      <circle cx="-18" cy="6" r="5" fill="#fb7185" opacity="0.3"/>
      <circle cx="18" cy="6" r="5" fill="#fb7185" opacity="0.3"/>

      <!-- Hard Work Sweat Bead -->
      <path d="M 23,-18 Q 26,-13 23,-10 Q 20,-13 23,-18 Z" fill="#38bdf8" opacity="0.8"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles of "Deep Focus" -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="45" cy="110" r="2.5"/>
    <circle cx="195" cy="90" r="2"/>
    <circle cx="160" cy="80" r="3.5"/>
    <circle cx="70" cy="140" r="2"/>
    <circle cx="25" cy="155" r="3"/>
  </g>
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="180" cy="115" r="2.5"/>
    <circle cx="60" cy="90" r="3"/>
    <circle cx="140" cy="75" r="2"/>
  </g>

</svg>