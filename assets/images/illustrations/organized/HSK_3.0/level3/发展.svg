<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Cityscape Glow -->
    <linearGradient id="cityGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Holographic Screen Gradient -->
    <linearGradient id="holoScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Hologram Line Glow -->
    <linearGradient id="growthLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Desk & Interior Shadows -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Modern Office Background -->
  <!-- City Windowscape in Background -->
  <g id="window-city">
    <!-- Window Frame -->
    <rect x="130" y="30" width="80" height="110" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <rect x="135" y="35" width="33" height="100" fill="url(#cityGlow)"/>
    <rect x="172" y="35" width="33" height="100" fill="url(#cityGlow)"/>
    <!-- Distant City Buildings Silhouette -->
    <path d="M138 135 L138 90 L145 90 L145 135 Z M148 135 L148 70 L158 70 L158 135 Z M162 135 L162 85 L168 85 L168 135 Z M176 135 L176 60 L188 60 L188 135 Z M192 135 L192 80 L200 80 L200 135 Z" fill="#1e293b" opacity="0.8"/>
    <!-- Glowing Windows in City -->
    <rect x="150" y="75" width="3" height="4" fill="#fbbf24" opacity="0.6"/>
    <rect x="154" y="80" width="3" height="4" fill="#38bdf8" opacity="0.6"/>
    <rect x="179" y="65" width="3" height="5" fill="#fbbf24" opacity="0.8"/>
    <rect x="184" y="72" width="3" height="4" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Bookshelf / Environment Props -->
  <g id="bookshelf" opacity="0.7">
    <rect x="20" y="40" width="40" height="8" rx="2" fill="#475569"/>
    <rect x="25" y="22" width="30" height="18" rx="2" fill="#334155"/>
    <!-- Books -->
    <rect x="26" y="24" width="6" height="16" fill="#f43f5e" rx="1"/>
    <rect x="33" y="23" width="5" height="17" fill="#38bdf8" rx="1"/>
    <rect x="39" y="25" width="7" height="15" fill="#fbbf24" rx="1"/>
  </g>

  <!-- Ambient Light Beam -->
  <polygon points="120,0 240,160 240,240 60,240" fill="#38bdf8" opacity="0.03" />

  <!-- PROPS: Standing Desk and Equipment -->
  <g id="desk-and-props">
    <!-- Desk Surface -->
    <path d="M40 160 L200 160 L210 175 L30 175 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Desk Legs -->
    <rect x="55" y="175" width="8" height="50" fill="#334155"/>
    <rect x="175" y="175" width="8" height="50" fill="#334155"/>

    <!-- Potted Growing Plant (Symbolizing "Development") -->
    <g id="growing-plant">
      <path d="M48 160 L58 160 L56 148 L50 148 Z" fill="#64748b"/> <!-- Pot -->
      <path d="M53 148 C53 144 57 142 57 138 C57 134 51 130 53 126" fill="none" stroke="url(#leafGrad)" stroke-width="2.5" stroke-linecap="round"/> <!-- Stem -->
      <!-- Leaves -->
      <path d="M53 140 C46 138 43 144 48 146 C51 147 53 143 53 140 Z" fill="url(#leafGrad)"/>
      <path d="M55 132 C62 130 65 136 60 138 C57 139 55 135 55 132 Z" fill="url(#leafGrad)"/>
      <path d="M53 126 C47 122 46 128 50 130 C52 131 53 128 53 126 Z" fill="url(#leafGrad)"/>
    </g>

    <!-- Coffee Mug -->
    <rect x="180" y="146" width="12" height="14" rx="2" fill="#cbd5e1"/>
    <path d="M192 150 C196 150 196 156 192 158" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M183 142 Q186 138 184 134" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- HOLOGRAPHIC PROJECTION (The Core Concept of "Development/Growth") -->
  <g id="hologram">
    <!-- Hologram Projector Base -->
    <ellipse cx="120" cy="162" rx="22" ry="6" fill="#0ea5e9" opacity="0.8"/>
    <ellipse cx="120" cy="162" rx="14" ry="4" fill="#38bdf8"/>
    
    <!-- Holographic Cone / Screen Area -->
    <polygon points="120,158 85,90 155,90" fill="url(#holoScreen)" />
    
    <!-- Rising Growth Chart & Bar Elements inside Hologram -->
    <g id="chart-elements">
      <!-- Grid lines -->
      <line x1="95" y1="140" x2="145" y2="140" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>
      <line x1="95" y1="125" x2="145" y2="125" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>
      <line x1="95" y1="110" x2="145" y2="110" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>

      <!-- Rising Bars -->
      <rect x="100" y="130" width="6" height="12" rx="1" fill="#38bdf8" opacity="0.7"/>
      <rect x="110" y="120" width="6" height="22" rx="1" fill="#38bdf8" opacity="0.8"/>
      <rect x="120" y="112" width="6" height="30" rx="1" fill="#10b981" opacity="0.9"/>
      <rect x="130" y="98" width="6" height="44" rx="1" fill="#fbbf24"/>

      <!-- Upward Trend Line connecting nodes -->
      <path d="M103 132 L113 122 L123 114 L133 100" fill="none" stroke="url(#growthLine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Glowing Data Nodes -->
      <circle cx="103" cy="132" r="2" fill="#38bdf8"/>
      <circle cx="113" cy="122" r="2" fill="#38bdf8"/>
      <circle cx="123" cy="114" r="2.5" fill="#10b981"/>
      <circle cx="133" cy="100" r="3" fill="#fbbf24"/>

      <!-- Upward Arrow Floating Above -->
      <path d="M133 90 L137 84 L133 78 M137 84 L125 84" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- MAIN CHARACTER: Entrepreneur/Innovator actively analyzing & developing -->
  <g id="character">
    <!-- Character Shadow on Floor -->
    <ellipse cx="120" cy="216" rx="35" ry="8" fill="#000000" opacity="0.3"/>

    <!-- Torso & Body (Leaning forward enthusiastically with dynamic pose) -->
    <g id="body">
      <!-- Jacket/Shirt -->
      <path d="M100 140 C100 120 110 115 120 115 C130 115 140 120 140 140 L145 180 L95 180 Z" fill="#0284c7"/>
      <!-- Inner Collar & Shirt -->
      <path d="M112 115 L120 128 L128 115 Z" fill="#f8fafc"/>
      <!-- Jacket Zipper / Lapel accent -->
      <line x1="120" y1="128" x2="120" y2="180" stroke="#0369a1" stroke-width="2"/>
    </g>

    <!-- Head & Hair -->
    <g id="head">
      <!-- Neck -->
      <rect x="114" y="105" width="12" height="15" fill="#fed7aa"/>
      
      <!-- Head Shape -->
      <circle cx="120" cy="92" r="18" fill="#fed7aa"/>

      <!-- Hair Style (Modern stylized dark hair) -->
      <path d="M102 90 C102 78 112 73 122 74 C132 75 138 82 138 92 C138 92 135 84 126 82 C117 80 105 84 102 90 Z" fill="#334155"/>
      <path d="M104 88 C106 82 112 78 120 78 C128 78 134 83 136 88 C130 85 110 85 104 88 Z" fill="#475569"/>

      <!-- Facial Expression: Focused, inspired, smiling confidently -->
      <!-- Eyes (Determined & bright) -->
      <circle cx="114" cy="92" r="2" fill="#1e293b"/>
      <circle cx="126" cy="92" r="2" fill="#1e293b"/>
      <!-- Eyebrows (Slightly angled up with enthusiasm) -->
      <path d="M111 88 Q114 86 117 88" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M123 88 Q126 86 129 88" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Confident Smile -->
      <path d="M116 99 Q120 103 124 99" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Warm Cheek Blush -->
      <circle cx="111" cy="96" r="3" fill="#f43f5e" opacity="0.3"/>
      <circle cx="129" cy="96" r="3" fill="#f43f5e" opacity="0.3"/>
    </g>

    <!-- Arms & Hands in Action -->
    <g id="arms">
      <!-- Left Arm (Reaching out, pointing/interacting with the hologram) -->
      <path d="M104 125 L85 145 L95 155" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M104 125 L85 145 L95 155" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Left Hand -->
      <circle cx="95" cy="157" r="5" fill="#fed7aa"/>

      <!-- Right Arm (Raised enthusiastically, gesturing growth/success) -->
      <path d="M136 122 L155 105 L150 90" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Right Hand pointing up/forward -->
      <circle cx="149" cy="87" r="5" fill="#fed7aa"/>
      <path d="M152 84 L156 79" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- FOREGROUND ACCENTS & DYNAMIC PARTICLES -->
  <g id="particles" opacity="0.8">
    <!-- Glowing success sparkles representing development and progress -->
    <path d="M75 70 L77 75 L82 77 L77 79 L75 84 L73 79 L68 77 L73 75 Z" fill="#fbbf24"/>
    <path d="M175 110 L176 113 L179 114 L176 115 L175 118 L174 115 L171 114 L174 113 Z" fill="#38bdf8"/>
    <path d="M160 50 L161 53 L164 54 L161 55 L160 58 L159 55 L156 54 L159 53 Z" fill="#10b981"/>
    
    <!-- Floating Data Sparkles -->
    <circle cx="90" cy="65" r="2" fill="#38bdf8"/>
    <circle cx="150" cy="68" r="1.5" fill="#fbbf24"/>
    <circle cx="138" cy="135" r="2" fill="#10b981"/>
    <circle cx="78" cy="120" r="1.5" fill="#38bdf8"/>
  </g>
</svg>