  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Wall and Floor -->
  <rect x="20" y="20" width="200" height="150" fill="#334155" rx="8"/>
  <rect x="20" y="170" width="200" height="50" fill="#475569" rx="8"/>
  
  <!-- Sink Unit -->
