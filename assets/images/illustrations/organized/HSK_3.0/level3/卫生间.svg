  <circle cx="100" cy="70" r="4" fill="#fb923c"/>
  
  <!-- Towel -->
  <rect x="155" y="130" width="40" height="10" rx="2" fill="#ec4899"/>
  <rect x="155" y="140" width="40" height="20" rx="2" fill="#f472b6"/>
  
