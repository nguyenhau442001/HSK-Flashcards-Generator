<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Success Aura -->
    <radialGradient id="successAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT DETAILS: Room Background -->
  <!-- Wallpaper subtle accents / Shelf -->
  <rect x="25" y="45" width="70" height="6" rx="3" fill="#334155" opacity="0.6"/>
  <!-- Small potted plant on shelf -->
  <path d="M 45 45 L 50 32 L 60 32 L 65 45 Z" fill="#64748b"/>
  <circle cx="55" cy="27" r="10" fill="#10b981"/>
  <circle cx="48" cy="24" r="7" fill="#34d399"/>

  <!-- Window with night city lights -->
  <rect x="155" y="30" width="50" height="65" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <rect x="162" y="38" width="14" height="22" rx="2" fill="#f59e0b" opacity="0.6"/>
  <rect x="184" y="38" width="14" height="35" rx="2" fill="#38bdf8" opacity="0.4"/>
  <rect x="162" y="68" width="14" height="20" rx="2" fill="#334155"/>

  <!-- Ambient Light from Desk Lamp -->
  <circle cx="95" cy="95" r="85" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Desk Surface -->
  <path d="M 10 185 L 230 185 L 220 220 L 20 220 Z" fill="url(#deskGrad)" filter="url(#softShadow)"/>
  <!-- Desk edge highlight -->
  <line x1="15" y1="185" x2="225" y2="185" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- PROPS: Laptop / Computer Setup -->
  <!-- Laptop Base -->
  <path d="M 60 185 L 130 185 L 140 165 L 50 165 Z" fill="#475569" filter="url(#softShadow)"/>
  <!-- Laptop Screen Frame -->
  <rect x="53" y="105" width="84" height="62" rx="6" fill="#334155" stroke="#64748b" stroke-width="2" filter="url(#softShadow)"/>
  <!-- Laptop Screen Inner -->
  <rect x="58" y="110" width="74" height="52" rx="3" fill="#0f172a"/>
  <!-- Screen Glow/Content (Code/Task completed UI) -->
  <rect x="58" y="110" width="74" height="52" rx="3" fill="url(#screenGlow)"/>
  <line x1="65" y1="120" x2="100" y2="120" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="130" x2="115" y2="130" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="140" x2="90" y2="140" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Checkmark icon on screen -->
  <circle cx="112" cy="147" r="10" fill="#10b981"/>
  <path d="M 107 147 L 110 150 L 118 142" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PROPS: Coffee Mug -->
  <rect x="155" y="160" width="18" height="22" rx="4" fill="#cbd5e1" filter="url(#softShadow)"/>
  <path d="M 173 166 C 182 166, 182 176, 173 176" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Steam rising from coffee -->
  <path d="M 160 152 C 162 147, 158 142, 160 138" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- PROPS: Stack of Notebooks / Papers -->
  <path d="M 180 180 L 225 180 L 220 168 L 175 168 Z" fill="#ef4444" filter="url(#softShadow)"/>
  <path d="M 177 172 L 223 172 L 221 162 L 175 162 Z" fill="#f8fafc"/>
  <path d="M 175 165 L 221 165 L 219 157 L 173 157 Z" fill="#3b82f6"/>

  <!-- CHARACTER: Energetic Young Professional / Student "Completing" work -->
  <!-- Chair Back -->
  <path d="M 115 170 L 140 100 C 145 90, 160 90, 165 100 L 180 170 Z" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <circle cx="147.5" cy="85" r="14" fill="#334155"/>

  <!-- Character Body / Torso (leaning back in triumphant stretch) -->
  <path d="M 115 175 C 105 150, 110 125, 125 110 L 145 125 C 152 135, 155 155, 150 180 Z" fill="#6366f1" filter="url(#softShadow)"/>
  
  <!-- Collar / Shirt details -->
  <path d="M 124 110 L 133 122 L 142 112" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head & Face -->
  <!-- Neck -->
  <path d="M 128 108 L 136 100 L 142 108 Z" fill="#fbcfe8"/>
  <!-- Head Base -->
  <circle cx="136" cy="85" r="18" fill="#fbcfe8" filter="url(#softShadow)"/>
  <!-- Hair (Stylish dark messy bob) -->
  <path d="M 118 85 C 116 70, 130 65, 145 68 C 154 70, 156 80, 155 88 C 150 82, 142 80, 135 81 C 124 82, 120 85, 118 85 Z" fill="#1e293b"/>
  <path d="M 120 85 C 120 75, 128 68, 138 67 C 148 66, 154 74, 154 84" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Joyful / Accomplished Facial Expression -->
  <!-- Closed happy smiling eyes -->
  <path d="M 130 83 C 132 86, 135 86, 137 83" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 141 83 C 143 86, 146 86, 148 83" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="131" cy="89" r="3" fill="#fda4af" opacity="0.6"/>
  <circle cx="147" cy="89" r="3" fill="#fda4af" opacity="0.6"/>
  <!-- Big Happy Open Smile -->
  <path d="M 136 91 C 138 95, 142 95, 144 91 Z" fill="#e11d48"/>

  <!-- Arms in Victory / Stretch Pose (Action of Completion!) -->
  <!-- Left Arm (bent holding head/stretching) -->
  <path d="M 122 115 L 105 100 L 115 85" fill="none" stroke="#6366f1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="115" cy="85" r="5" fill="#fbcfe8"/> <!-- Hand -->

  <!-- Right Arm (reaching up high in triumph) -->
  <path d="M 142 118 C 155 110, 165 95, 175 75" fill="none" stroke="#6366f1" stroke-width="10" stroke-linecap="round"/>
  <circle cx="177" cy="70" r="5.5" fill="#fbcfe8"/> <!-- Hand reaching up -->

  <!-- FOREGROUND EFFECTS & CELEBRATION (Hoàn thành - Success / Done) -->
  <!-- Massive Success Aura behind head/hand -->
  <circle cx="170" cy="70" r="45" fill="url(#successAura)" pointer-events="none"/>

  <!-- Glowing Stars / Sparkles representing completion & success -->
  <!-- Sparkle 1 (Top Right) -->
  <path d="M 195 45 L 198 55 L 208 58 L 198 61 L 195 71 L 192 61 L 182 58 L 192 55 Z" fill="#fbbf24" filter="url(#softShadow)"/>
  <!-- Sparkle 2 (Mid Right) -->
  <path d="M 210 95 L 212 100 L 217 102 L 212 104 L 210 109 L 208 104 L 203 102 L 208 100 Z" fill="#38bdf8"/>
  <!-- Sparkle 3 (Center Top) -->
  <path d="M 145 35 L 147 41 L 153 43 L 147 45 L 145 51 L 143 45 L 137 43 L 143 41 Z" fill="#34d399"/>

  <!-- Confetti / Celebration Dots -->
  <circle cx="120" cy="55" r="3.5" fill="#fb923c"/>
  <circle cx="180" cy="115" r="3" fill="#ec4899"/>
  <circle cx="215" cy="140" r="2.5" fill="#38bdf8"/>
  <circle cx="165" cy="40" r="2.5" fill="#fbbf24"/>
  <circle cx="130" cy="30" r="3" fill="#10b981"/>

  <!-- PROPS: Desk Lamp Details -->
  <!-- Lamp Base on desk -->
  <ellipse cx="95" cy="175" rx="12" ry="4" fill="#64748b"/>
  <!-- Lamp Stand -->
  <path d="M 95 175 L 95 125 L 75 95" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lamp Shade -->
  <path d="M 65 92 L 85 92 L 90 82 L 60 82 Z" fill="#f59e0b"/>

  <!-- Vignette Border (Rounded Stroke) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>