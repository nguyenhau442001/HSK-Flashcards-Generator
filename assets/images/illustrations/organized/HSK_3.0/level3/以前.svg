<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Sepia Photo Overlay / Old Memory Gradient -->
    <linearGradient id="sepiaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="1" stop-color="#78350f" stop-opacity="0.3" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background -->
  <!-- Wooden Wall Panel / Backboard -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#334155" />
  
  <!-- Window Frame looking into the past/rural landscape -->
  <rect x="135" y="35" width="70" height="90" rx="6" fill="#0f172a" />
  <!-- Rural landscape through window -->
  <path d="M135 90 Q 155 75, 175 85 T 205 80 L 205 125 L 135 125 Z" fill="#065f46" opacity="0.8"/>
  <path d="M135 100 Q 165 90, 205 95 L 205 125 L 135 125 Z" fill="#047857" />
  <!-- Sun in window -->
  <circle cx="155" cy="55" r="10" fill="#f59e0b" />
  <!-- Window Crossbars -->
  <rect x="168" y="35" width="4" height="90" fill="#334155" />
  <rect x="135" y="77" width="70" height="4" fill="#334155" />
  
  <!-- Light Beam from Window -->
  <polygon points="135,35 205,35 215,170 30,170" fill="url(#lightBeam)" />

  <!-- Shelf on Wall -->
  <rect x="35" y="65" width="85" height="6" rx="3" fill="#475569" />
  <!-- Small potted plant on shelf -->
  <path d="M45 65 L 50 52 L 60 52 L 65 65 Z" fill="#10b981" />
  <circle cx="55" cy="48" r="8" fill="#34d399" />

  <!-- Wooden Floor -->
  <path d="M 20 170 L 220 170 L 230 220 L 10 220 Z" fill="#1e1b4b" />
  <!-- Floor Planks perspective lines -->
  <line x1="120" y1="170" x2="120" y2="220" stroke="#0f172a" stroke-width="2" />
  <line x1="70" y1="170" x2="40" y2="220" stroke="#0f172a" stroke-width="2" />
  <line x1="170" y1="170" x2="200" y2="220" stroke="#0f172a" stroke-width="2" />

  <!-- MAIN SUBJECT: Vintage Wooden Desk / Retro Trunk representing "Past / Trước đây" -->
  <g id="retro-trunk">
    <!-- Trunk Shadow -->
    <ellipse cx="120" cy="188" rx="75" ry="12" fill="#020617" opacity="0.6" />

    <!-- Trunk Body (Isometric-ish 2D) -->
    <rect x="50" y="130" width="140" height="50" rx="8" fill="#9a3412" />
    <!-- Trunk Lid (slightly open / angled back) -->
    <path d="M 50 130 C 50 115, 60 105, 75 105 L 165 105 C 180 105, 190 115, 190 130 Z" fill="#c2410c" />
    <rect x="50" y="126" width="140" height="8" rx="4" fill="#ea580c" />

    <!-- Metal Straps & Rivets -->
    <rect x="75" y="105" width="8" height="75" fill="#475569" />
    <rect x="155" y="105" width="8" height="75" fill="#475569" />
    <!-- Rivets -->
    <circle cx="79" cy="115" r="2" fill="#94a3b8" />
    <circle cx="79" cy="140" r="2" fill="#94a3b8" />
    <circle cx="79" cy="165" r="2" fill="#94a3b8" />
    <circle cx="159" cy="115" r="2" fill="#94a3b8" />
    <circle cx="159" cy="140" r="2" fill="#94a3b8" />
    <circle cx="159" cy="165" r="2" fill="#94a3b8" />

    <!-- Center Brass Latch -->
    <rect x="113" y="122" width="14" height="16" rx="3" fill="#fbbf24" />
    <circle cx="120" cy="130" r="3" fill="#78350f" />
  </g>

  <!-- NOSTALGIC PROPS EMERGING FROM THE TRUNK (Representing memories of 'before') -->
  <!-- Old Framed Photograph (leaning inside trunk) -->
  <g transform="translate(70, 75) rotate(-10)">
    <rect x="0" y="0" width="45" height="55" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="4" />
    <!-- Photo content: simplified house & tree (rural home) -->
    <path d="M 8 35 L 22 20 L 37 35 Z" fill="#047857" />
    <rect x="14" y="35" width="16" height="15" fill="#94a3b8" />
    <circle cx="32" cy="15" r="5" fill="#f59e0b" />
    <!-- Sepia overlay for vintage feel -->
    <rect x="0" y="0" width="45" height="55" fill="url(#sepiaGrad)" />
  </g>

  <!-- Vintage Camera -->
  <g transform="translate(130, 90) rotate(8)">
    <!-- Camera Body -->
    <rect x="0" y="10" width="36" height="26" rx="5" fill="#334155" />
    <!-- Top Dial -->
    <rect x="6" y="5" width="8" height="5" rx="1" fill="#64748b" />
    <rect x="22" y="6" width="6" height="4" rx="1" fill="#64748b" />
    <!-- Lens -->
    <circle cx="18" cy="23" r="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
    <circle cx="18" cy="23" r="4" fill="#38bdf8" opacity="0.6" />
    <!-- Flash / Viewfinder Accent -->
    <circle cx="28" cy="15" r="2" fill="#fbbf24" />
  </g>

  <!-- Rolled Scroll / Old Map -->
  <g transform="translate(100, 85) rotate(15)">
    <rect x="0" y="0" width="30" height="40" rx="3" fill="#fef08a" />
    <path d="M 5 10 L 25 10 M 5 20 L 25 20 M 5 30 L 20 30" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" />
    <!-- Roll ends -->
    <ellipse cx="15" cy="2" rx="15" ry="3" fill="#eab308" />
    <ellipse cx="15" cy="38" rx="15" ry="3" fill="#eab308" />
  </g>

  <!-- Floating Glowing Memory Particles (Atmospheric Depth) -->
  <circle cx="65" cy="60" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="180" cy="70" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="150" cy="110" r="4" fill="#fb923c" opacity="0.5" />
  <circle cx="95" cy="50" r="2" fill="#fef08a" opacity="0.9" />

  <!-- Foreground Lighting and Vignette Overlay -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
    <stop offset="0.6" stop-color="#0f172a" stop-opacity="0" />
    <stop offset="1" stop-color="#020617" stop-opacity="0.6" />
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none" />

</svg>