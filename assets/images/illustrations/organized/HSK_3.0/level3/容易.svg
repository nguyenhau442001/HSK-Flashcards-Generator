<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Glow Gradient -->
    <radialGradient id="windowGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Paper / Exam Glow Gradient -->
    <radialGradient id="paperGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Hoodie Gradient (Energetic Teal/Blue) -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Cozy Study Room) -->
  <!-- Window frame background light -->
  <rect x="150" y="20" width="70" height="90" rx="6" fill="#090d16" opacity="0.6"/>
  <rect x="155" y="25" width="60" height="80" fill="url(#windowGlow)"/>
  <!-- Window crossbars -->
  <line x1="185" y1="25" x2="185" y2="105" stroke="#1e293b" stroke-width="3"/>
  <line x1="155" y1="65" x2="215" y2="65" stroke="#1e293b" stroke-width="3"/>

  <!-- Bookshelf / Prop in background -->
  <rect x="20" y="45" width="40" height="7" rx="2" fill="#334155"/>
  <path d="M25 45 L25 30 L32 30 L32 45 Z" fill="#f43f5e" opacity="0.8"/>
  <path d="M34 45 L34 26 L42 26 L42 45 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M44 45 L44 33 L52 33 L52 45 Z" fill="#a855f7" opacity="0.8"/>

  <!-- Potted Plant on Shelf -->
  <rect x="25" y="105" width="20" height="15" rx="3" fill="#cbd5e1"/>
  <path d="M35 105 Q30 90 20 85 Q32 95 35 105 Z" fill="url(#leafGrad)"/>
  <path d="M35 105 Q42 90 52 80 Q42 93 35 105 Z" fill="url(#leafGrad)"/>
  <path d="M35 105 Q35 85 35 75 Q35 90 35 105 Z" fill="#10b981"/>

  <!-- Hanging Lamp illuminating the desk -->
  <path d="M100 0 L140 0 L130 15 L110 15 Z" fill="#334155"/>
  <line x1="120" y1="0" x2="120" y2="40" stroke="#334155" stroke-width="2"/>
  <polygon points="100,15 140,15 150,35 90,35" fill="#475569"/>
  <path d="M90 35 L150 35 L135 120 L105 120 Z" fill="#fbbf24" opacity="0.08"/>

  <!-- Desk Surface -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#0f172a"/>
  <rect x="0" y="165" width="240" height="8" rx="2" fill="#334155"/>

  <!-- Desk Items: Pencil holder & Extra papers -->
  <rect x="190" y="130" width="18" height="35" rx="3" fill="#64748b"/>
  <!-- Pencils sticking out -->
  <line x1="195" y1="130" x2="190" y2="115" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="130" x2="202" y2="112" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="205" y1="130" x2="212" y2="118" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- MAIN SCENE: The Test / Exam Paper (Effortless Success) -->
  <g filter="url(#shadow)">
    <!-- Glowing backdrop under paper -->
    <circle cx="120" cy="165" r="50" fill="url(#paperGlow)"/>
    
    <!-- Tilted Exam Paper -->
    <g transform="rotate(-6 120 165)">
      <rect x="80" y="120" width="80" height="95" rx="4" fill="#f8fafc"/>
      <!-- Paper Header Lines -->
      <line x1="92" y1="134" x2="120" y2="134" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <circle cx="145" cy="134" r="7" fill="#ef4444"/> <!-- Big Red 'A+' or perfect score circle marker -->
      
      <!-- Mock Question Lines -->
      <line x1="92" y1="150" x2="148" y2="150" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
      <line x1="92" y1="162" x2="135" y2="162" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
      <line x1="92" y1="174" x2="140" y2="174" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>

      <!-- Glowing Checkmark Stamp (Dễ dàng - Easy!) -->
      <path d="M102 188 L114 200 L138 176" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- CHARACTER: Confident, Happy Student -->
  <g id="character" filter="url(#shadow)">
    <!-- Hoodie Body / Torso -->
    <path d="M75 225 C75 190 95 180 120 180 C145 180 165 190 165 225 Z" fill="url(#hoodieGrad)"/>
    <!-- Hoodie Strings -->
    <path d="M105 185 Q110 205 107 215" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M135 185 Q130 205 133 215" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M108 145 L108 165 L132 165 L132 145 Z" fill="url(#skinGrad)"/>

    <!-- Head & Face -->
    <circle cx="120" cy="120" r="32" fill="url(#skinGrad)"/>

    <!-- Hair (Trendy Dark Messy/Fluffy Bob) -->
    <path d="M88 120 C88 95 105 85 120 85 C135 85 152 95 152 120 C152 125 150 120 148 110 C144 95 132 90 120 90 C108 90 96 95 92 110 C90 120 88 125 88 120 Z" fill="#1e293b"/>
    <!-- Playful hair tuft -->
    <path d="M120 87 Q125 75 135 78 Q130 84 120 87 Z" fill="#1e293b"/>

    <!-- Facial Expression: Smiling Confidently / Eyes Closed in Blissful Ease -->
    <!-- Eyebrows (Relaxed/Happy curve) -->
    <path d="M100 110 Q106 106 112 110" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M128 110 Q134 106 140 110" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Happy Closed Eyes (Arc) -->
    <path d="M102 116 Q106 120 110 116" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M130 116 Q134 120 138 116" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="102" cy="125" r="5" fill="#f43f5e" opacity="0.3"/>
    <circle cx="138" cy="125" r="5" fill="#f43f5e" opacity="0.3"/>

    <!-- Big Confident Open Smile -->
    <path d="M110 130 Q120 142 130 130" fill="#1e293b"/>
    <!-- Tongue hint -->
    <path d="M115 134 Q120 140 125 134" fill="#f43f5e"/>

    <!-- ARMS & HANDS: Relaxed, holding a pen effortlessly with one hand resting -->
    <!-- Left Arm & Hand (Relaxed on table) -->
    <path d="M80 195 Q65 205 60 215" fill="none" stroke="#0ea5e9" stroke-width="14" stroke-linecap="round"/>
    <circle cx="58" cy="217" r="7" fill="url(#skinGrad)"/>

    <!-- Right Arm & Hand (Holding pencil casually up near paper) -->
    <path d="M160 195 Q175 195 180 175" fill="none" stroke="#0ea5e9" stroke-width="14" stroke-linecap="round"/>
    <circle cx="182" cy="170" r="7" fill="url(#skinGrad)"/>
    
    <!-- Pen being twiddled/held effortlessly -->
    <line x1="182" y1="170" x2="195" y2="145" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <!-- Pen tip -->
    <polygon points="195,145 198,140 192,143" fill="#1e293b"/>
  </g>

  <!-- Sparkles / "Easy" Aura Elements (Visualizing 'Rongyi' success energy) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M65 95 Q65 105 55 105 Q65 105 65 115 Q65 105 75 105 Q65 105 65 95 Z" opacity="0.9"/>
    <!-- Star 2 -->
    <path d="M185 85 Q185 92 178 92 Q185 92 185 99 Q185 92 192 92 Q185 92 185 85 Z" opacity="0.8"/>
    <!-- Star 3 (Green success sparkle) -->
    <path d="M150 145 Q150 151 144 151 Q150 151 150 157 Q150 151 156 151 Q150 151 150 145 Z" fill="#34d399"/>
  </g>
</svg>