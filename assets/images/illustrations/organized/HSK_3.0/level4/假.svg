<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gemGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="realGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="fakeGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light / Environment Details -->
  <circle cx="120" cy="120" r="90" fill="url(#gemGlow)" filter="url(#glow)" />
  
  <!-- Wooden Display Table / Surface -->
  <path d="M 20 180 L 220 180 L 200 220 L 40 220 Z" fill="#0f172a" opacity="0.6"/>
  <rect x="20" y="170" width="200" height="12" rx="4" fill="#334155" />
  <rect x="30" y="182" width="180" height="4" fill="#1e293b" />

  <!-- Detective / App Context Props: Magnifying Glass floating & inspecting -->
  <!-- Velvet Pad for Gems -->
  <ellipse cx="120" cy="155" rx="85" ry="30" fill="#475569" />
  <ellipse cx="120" cy="152" rx="80" ry="26" fill="#334155" />
  <ellipse cx="120" cy="150" rx="76" ry="23" fill="#1e1b4b" />
  <ellipse cx="120" cy="148" rx="72" ry="20" fill="#311042" />

  <!-- Gem 1: The REAL Gem (Sparkling Blue Diamond) -->
  <g transform="translate(75, 120)">
    <!-- Gem Shadow -->
    <ellipse cx="0" cy="30" rx="20" ry="8" fill="#000000" opacity="0.4" />
    <!-- Facets -->
    <polygon points="0,0 18,15 0,35 -18,15" fill="url(#realGem)" />
    <polygon points="0,0 -18,15 -8,15" fill="#7dd3fc" />
    <polygon points="0,0 18,15 8,15" fill="#0ea5e9" />
    <polygon points="0,35 -18,15 -8,15" fill="#0369a1" />
    <polygon points="0,35 18,15 8,15" fill="#0284c7" />
    <!-- Highlights -->
    <polygon points="0,4 -10,14 -4,14" fill="#ffffff" opacity="0.6" />
    <!-- Sparkle Animation Element -->
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="scale" values="0.8;1.2;0.8" dur="2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Gem 2: The FAKE Gem (Red Fake Plastic/Glass Gem with Bubble) -->
  <g transform="translate(165, 130)">
    <!-- Gem Shadow -->
    <ellipse cx="0" cy="22" rx="16" ry="6" fill="#000000" opacity="0.4" />
    <!-- Body -->
    <path d="M -12,10 L 12,10 L 18,22 L 0,28 L -18,22 Z" fill="url(#fakeGem)" />
    <!-- Top Crown -->
    <polygon points="0,0 15,10 -15,10" fill="#fb7185" />
    <polygon points="0,0 -15,10 -6,10" fill="#fda4af" />
    <polygon points="0,0 15,10 6,10" fill="#f43f5e" />
    <!-- Internal 'Fake' Defect: Air Bubble inside -->
    <circle cx="3" cy="18" r="3" fill="#ffffff" opacity="0.4" />
    <circle cx="2" cy="17" r="1" fill="#ffffff" opacity="0.8" />
    <!-- Dull Highlight -->
    <path d="M 0,3 -8,8 -4,8" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Magnifying Glass Inspecting the Fake Gem -->
  <g transform="translate(145, 100) rotate(-15)">
    <!-- Glass Lens Reflection -->
    <circle cx="0" cy="0" r="35" fill="#0f172a" opacity="0.3" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="#fbbf24" stroke-width="6" />
    <circle cx="0" cy="0" r="32" fill="#38bdf8" fill-opacity="0.1" />
    <!-- Glass Glare -->
    <path d="M -22 -12 Q -10 -25 5 -22 Q -5 -15 -22 -12 Z" fill="#ffffff" opacity="0.4" />
    <!-- Handle -->
    <rect x="-6" y="32" width="12" height="45" rx="6" fill="#b45309" />
    <rect x="-3" y="32" width="6" height="45" rx="3" fill="#f59e0b" />
    <!-- Handle Connector -->
    <rect x="-4" y="28" width="8" height="6" fill="#92400e" />
  </g>

  <!-- Question / Mystery Elements (Glowing Sparkles & Question vibe) -->
  <g transform="translate(110, 55)" fill="#fbbf24">
    <path d="M 0,-6 L 1.5,-1.5 L 6,0 L 1.5,1.5 L 0,6 L -1.5,1.5 L -6,0 L -1.5,-1.5 Z" />
  </g>
  <g transform="translate(85, 75) scale(0.6)" fill="#38bdf8">
    <path d="M 0,-6 L 1.5,-1.5 L 6,0 L 1.5,1.5 L 0,6 L -1.5,1.5 L -6,0 L -1.5,-1.5 Z" />
  </g>

  <!-- Action / Detection Alert (Red Warning Cross / Question vibe near fake item) -->
  <g transform="translate(175, 80)">
    <circle cx="0" cy="0" r="12" fill="#ef4444" opacity="0.9" />
    <path d="M -4,-4 L 4,4 M 4,-4 L -4,4" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Verification Check near real item -->
  <g transform="translate(65, 85)">
    <circle cx="0" cy="0" r="12" fill="#10b981" opacity="0.9" />
    <path d="M -4,0 L -1,3 L 5,-3" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="40" cy="110" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="200" cy="90" r="1.5" fill="#fbbf24" opacity="0.7" />
  <circle cx="110" cy="195" r="2" fill="#ec4899" opacity="0.5" />
</svg>