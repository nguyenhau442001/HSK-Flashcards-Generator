<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient background glow & environment gradients -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="kidSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="kidPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="slideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" fill="url(#bgGlow)"/>

  <!-- Dynamic Energy Rays & Background Elements -->
  <circle cx="120" cy="120" r="90" fill="url(#sunburst)"/>
  
  <!-- Motion Action Lines / Sparkles in background -->
  <g opacity="0.6">
    <!-- Star sparkles -->
    <path d="M45 70 L48 78 L56 81 L48 84 L45 92 L42 84 L34 81 L42 78 Z" fill="#fbbf24" filter="url(#glow)"/>
    <path d="M195 90 L197 95 L202 97 L197 99 L195 104 L193 99 L188 97 L193 95 Z" fill="#38bdf8" filter="url(#glow)"/>
    <path d="M180 160 L182 164 L186 166 L182 168 L180 172 L178 168 L174 166 L178 164 Z" fill="#f43f5e" filter="url(#glow)"/>
    
    <!-- Swooshing motion arcs representing lively energy -->
    <path d="M 30,140 Q 60,110 90,130" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M 150,80 Q 180,60 210,90" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M 60,190 Q 100,210 140,180" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Playground Environment: Colorful Slide & Grass Mound -->
  <!-- Grass ground curve -->
  <path d="M 0,200 Q 80,180 240,200 L 240,240 L 0,240 Z" fill="#065f46" opacity="0.4"/>
  <path d="M 0,210 Q 120,190 240,215 L 240,240 L 0,240 Z" fill="#047857"/>

  <!-- Playground Slide Structure -->
  <!-- Slide legs -->
  <rect x="175" y="130" width="8" height="85" rx="4" fill="#94a3b8"/>
  <rect x="205" y="145" width="8" height="70" rx="4" fill="#64748b"/>
  <!-- Slide ramp -->
  <path d="M 160,120 L 220,150 L 210,165 L 155,135 Z" fill="#e2e8f0"/>
  <path d="M 160,120 L 220,150 L 215,142 L 160,115 Z" fill="url(#slideGrad)"/>

  <!-- Vibrant Park Tree in background -->
  <g opacity="0.9">
    <rect x="35" y="110" width="14" height="90" fill="#78350f" rx="4"/>
    <circle cx="42" cy="90" r="35" fill="#059669"/>
    <circle cx="22" cy="105" r="25" fill="#10b981"/>
    <circle cx="62" cy="105" r="25" fill="#047857"/>
  </g>

  <!-- MAIN SUBJECT: A lively, energetic child leaping/jumping with pure joy -->
  <!-- Shadow on the ground -->
  <ellipse cx="120" cy="210" rx="25" ry="8" fill="#020617" opacity="0.6"/>

  <g transform="translate(10, 5)">
    <!-- Motion lines behind child -->
    <path d="M 90,120 Q 80,140 70,155" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 105,110 Q 95,135 85,160" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Left Leg (bent upward dynamically) -->
    <path d="M 105,155 Q 90,175 75,165" stroke="url(#kidPants)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Left Shoe -->
    <ellipse cx="70" cy="165" rx="10" ry="7" fill="#f43f5e" transform="rotate(-15 70 165)"/>

    <!-- Right Leg (kicking out cheerfully) -->
    <path d="M 125,155 Q 145,185 160,175" stroke="url(#kidPants)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right Shoe -->
    <ellipse cx="163" cy="173" rx="10" ry="7" fill="#f43f5e" transform="rotate(25 163 173)"/>

    <!-- Torso / Hoodie -->
    <path d="M 100,105 Q 115,95 130,105 L 140,155 Q 115,165 95,155 Z" fill="url(#kidSuit)"/>
    <!-- Hoodie pocket & details -->
    <path d="M 108,135 Q 115,145 122,135" stroke="#0284c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="115" cy="108" r="4" fill="#fbbf24"/>
    <line x1="112" y1="108" x2="110" y2="120" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="118" y1="108" x2="120" y2="120" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Arm (raised high in victorious excitement) -->
    <path d="M 102,110 Q 80,90 70,75" stroke="url(#kidSuit)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Left Hand -->
    <circle cx="66" cy="71" r="7" fill="#ffedd5"/>

    <!-- Right Arm (spread out for balance/joy) -->
    <path d="M 128,110 Q 155,100 170,115" stroke="url(#kidSuit)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Right Hand -->
    <circle cx="175" cy="118" r="7" fill="#ffedd5"/>

    <!-- Head & Hair -->
    <!-- Neck -->
    <rect x="110" y="88" width="10" height="15" fill="#ffedd5" rx="4"/>
    <!-- Head Circle -->
    <circle cx="115" cy="80" r="22" fill="#ffedd5"/>

    <!-- Spiky, energetic hair -->
    <path d="M 94,80 Q 92,60 110,60 Q 120,50 130,65 Q 138,62 140,78 Q 135,70 125,72 Q 120,58 110,65 Q 98,68 94,80 Z" fill="#1e293b"/>
    <path d="M 95,75 Q 90,68 98,62" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

    <!-- Joyful Facial Expression (Big happy open smile, glowing eyes) -->
    <!-- Rosy Cheeks -->
    <circle cx="102" cy="85" r="4" fill="#f43f5e" opacity="0.5"/>
    <circle cx="128" cy="85" r="4" fill="#f43f5e" opacity="0.5"/>
    
    <!-- Big Happy Closed-Happy Eyes (Arched curves of pure delight) -->
    <path d="M 100,77 Q 106,71 112,77" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 118,77 Q 124,71 130,77" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Open Laughing Mouth -->
    <path d="M 107,85 Q 115,97 123,85 Z" fill="#9f1239"/>
    <!-- Tongue -->
    <path d="M 111,90 Q 115,95 119,90 Z" fill="#fb7185"/>

  </g>

  <!-- Foreground Joyful Elements & Sparks -->
  <g filter="url(#glow)">
    <!-- Floating energy stars / confetti -->
    <path d="M 25,120 L 27,125 L 32,127 L 27,129 L 25,134 L 23,129 L 18,127 L 23,125 Z" fill="#38bdf8"/>
    <path d="M 145,50 L 147,55 L 152,57 L 147,59 L 145,64 L 143,59 L 138,57 L 143,55 Z" fill="#fbbf24"/>
    <circle cx="200" cy="65" r="4" fill="#10b981"/>
    <circle cx="35" cy="175" r="5" fill="#f43f5e"/>
    <circle cx="215" cy="195" r="3" fill="#fbbf24"/>
  </g>

  <!-- Dynamic foreground speed lines -->
  <line x1="15" y1="105" x2="35" y2="105" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="205" y1="50" x2="220" y2="45" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Border Frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>