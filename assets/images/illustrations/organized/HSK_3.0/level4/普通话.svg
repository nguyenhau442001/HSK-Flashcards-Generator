<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="micBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="soundWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="avatarSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow elements -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />
  <circle cx="180" cy="70" r="40" fill="#f59e0b" opacity="0.05" filter="url(#glow)" />

  <!-- ENVIRONMENT: Language Learning / Broadcasting Studio Setting -->
  <!-- Desk / Recording Console -->
  <path d="M 30,180 L 210,180 L 225,220 L 15,220 Z" fill="url(#boothGrad)" />
  <path d="M 30,180 L 210,180 L 205,190 L 35,190 Z" fill="#475569" />

  <!-- Control Panel & Screen on Desk -->
  <rect x="140" y="145" width="60" height="40" rx="4" fill="#0f172a" />
  <rect x="144" y="149" width="52" height="32" rx="2" fill="url(#screenGrad)" />
  <!-- Waveform animation mock on screen -->
  <path d="M 150,165 Q 155,155 160,165 T 170,165 T 180,160 T 190,165" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="190" cy="153" r="2" fill="#10b981" />

  <!-- Studio Acoustic Panels / Background Details -->
  <rect x="25" y="40" width="30" height="80" rx="4" fill="#1e293b" opacity="0.7" />
  <line x1="25" y1="60" x2="55" y2="60" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="80" x2="55" y2="80" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="100" x2="55" y2="100" stroke="#334155" stroke-width="2" />

  <rect x="185" y="40" width="30" height="80" rx="4" fill="#1e293b" opacity="0.7" />
  <line x1="185" y1="60" x2="215" y2="60" stroke="#334155" stroke-width="2" />
  <line x1="185" y1="80" x2="215" y2="80" stroke="#334155" stroke-width="2" />
  <line x1="185" y1="100" x2="215" y2="100" stroke="#334155" stroke-width="2" />

  <!-- SUBJECT: Main Professional Broadcasting Microphone (Standard Language Symbol) -->
  <!-- Mic Stand Base -->
  <ellipse cx="95" cy="180" rx="15" ry="6" fill="#64748b" />
  <!-- Articulated Arm -->
  <path d="M 95,180 L 95,130 L 105,95" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="95" cy="130" r="4" fill="#cbd5e1" />
  
  <!-- Shock Mount -->
  <circle cx="105" cy="85" r="18" fill="none" stroke="#475569" stroke-width="3" />
  
  <!-- Professional Studio Microphone Body -->
  <rect x="94" y="65" width="22" height="40" rx="11" fill="url(#micBody)" />
  <rect x="98" y="70" width="14" height="25" rx="7" fill="#1e293b" opacity="0.3" />
  <!-- Mic Grille Highlights -->
  <line x1="99" y1="73" x2="107" y2="73" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="99" y1="77" x2="109" y2="77" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="99" y1="81" x2="107" y2="81" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" />

  <!-- ACTION & DYNAMICS: Sound Waves & Standard Language Radiance (Representing Clear Speech / Putonghua) -->
  <g filter="url(#glow)">
    <!-- Expanding Sound Waves -->
    <path d="M 125,75 C 135,78 142,88 142,95 C 142,102 135,112 125,115" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 133,65 C 147,70 157,83 157,95 C 157,107 147,120 133,125" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M 141,55 C 159,62 172,77 172,95 C 172,113 159,128 141,135" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Floating Phonetic / Speech Sparks -->
    <circle cx="138" cy="65" r="3" fill="#38bdf8" />
    <circle cx="152" cy="80" r="4" fill="#10b981" />
    <circle cx="162" cy="110" r="3" fill="#f59e0b" />
    <circle cx="145" cy="125" r="2.5" fill="#ec4899" />
  </g>

  <!-- Secondary Context Element: Friendly Speaker Character (Partial View, engaged in speaking standard language) -->
  <!-- Character Head & Shoulders -->
  <path d="M 35,220 C 35,190 50,175 75,175 C 75,185 70,220 70,220 Z" fill="#0284c7" /> <!-- Shirt/Suit -->
  <path d="M 50,150 C 50,130 60,120 75,120 C 90,120 100,130 100,150 C 100,170 90,180 75,180 C 60,180 50,170 50,150 Z" fill="url(#avatarSkin)" /> <!-- Face -->
  
  <!-- Hair -->
  <path d="M 50,140 C 48,120 60,105 78,105 C 96,105 102,120 101,145 C 90,135 70,135 50,140 Z" fill="#0f172a" />

  <!-- Facial features (Profile facing right towards mic) -->
  <!-- Eye -->
  <circle cx="86" cy="145" r="3" fill="#0f172a" />
  <path d="M 83,141 Q 87,139 90,142" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Open confident mouth speaking clearly -->
  <path d="M 91,155 Q 96,156 93,162 Q 88,162 91,155 Z" fill="#991b1b" />
  <path d="M 91,155 Q 96,156 93,162 Q 88,162 91,155 Z" fill="#ef4444" opacity="0.8" />

  <!-- Subtle Sound Notes rising near speaker -->
  <path d="M 60,110 Q 65,100 60,90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M 70,105 Q 75,95 70,85" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

  <!-- Foreground Atmospheric Polish / Sparkles -->
  <g opacity="0.9">
    <path d="M 195,50 L 197,55 L 202,57 L 197,59 L 195,64 L 193,59 L 188,57 L 193,55 Z" fill="#fde047" />
    <path d="M 120,35 L 121,38 L 124,39 L 121,40 L 120,43 L 119,40 L 116,39 L 119,38 Z" fill="#38bdf8" />
  </g>
</svg>