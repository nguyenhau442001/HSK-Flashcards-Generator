<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mug Body Gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Mug Inner Depth Gradient -->
    <radialGradient id="mugInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <!-- Steam Gradient -->
    <linearGradient id="airGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow Filter for Depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Background Ambient Lights / Kitchen Window Vibe -->
  <circle cx="180" cy="60" r="40" fill="#fbbf24" opacity="0.05"/>
  <circle cx="60" cy="100" r="70" fill="#38bdf8" opacity="0.03"/>

  <!-- Wooden/Modern Kitchen Table Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#tableGrad)"/>
  <!-- Table edge highlight -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2"/>

  <!-- Background Props: Full Cookie Jar (Contrast to the empty mug) -->
  <g transform="translate(180, 110)" filter="url(#dropShadow)">
    <!-- Jar Base Shadow -->
    <ellipse cx="0" cy="55" rx="22" ry="7" fill="#000000" opacity="0.5"/>
    <!-- Jar Body -->
    <path d="M -16 15 C -16 5 -12 -5 -10 -15 L 10 -15 C 12 -5 16 5 16 15 L 18 50 C 18 55 12 58 0 58 C -12 58 -18 55 -18 50 Z" fill="#94a3b8" opacity="0.25"/>
    <!-- Cookies inside -->
    <circle cx="-5" cy="25" r="8" fill="#d97706"/>
    <circle cx="6" cy="35" r="9" fill="#b45309"/>
    <circle cx="2" cy="15" r="8" fill="#f59e0b"/>
    <!-- Jar Lid -->
    <ellipse cx="0" cy="-15" rx="12" ry="4" fill="#cbd5e1"/>
    <rect x="-4" y="-22" width="8" height="7" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Main Subject: The Empty Mug (Cái cốc rỗng) -->
  <g filter="url(#dropShadow)">
    <!-- Mug Shadow on Table -->
    <ellipse cx="105" cy="172" rx="34" ry="10" fill="#000000" opacity="0.6"/>

    <!-- Mug Handle (drawn behind body for correct layering) -->
    <path d="M 126 102 C 150 102, 150 148, 126 148" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <path d="M 126 102 C 146 102, 146 148, 126 148" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>

    <!-- Mug Outer Body -->
    <path d="M 72 90 L 128 90 C 132 90, 136 94, 134 105 L 120 160 C 118 168, 112 172, 100 172 L 100 172 C 88 172, 82 168, 80 160 L 66 105 C 64 94, 68 90, 72 90 Z" fill="url(#mugGrad)"/>

    <!-- Mug Rim (Outer Oval) -->
    <ellipse cx="100" cy="90" rx="28" ry="10" fill="#38bdf8"/>

    <!-- Mug Inside / The Empty Space (Visualizing 'Rỗng') -->
    <ellipse cx="100" cy="90" rx="22" ry="7" fill="url(#mugInner)"/>

    <!-- Highlight Reflection on Mug -->
    <path d="M 76 105 L 84 150" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Playful Air/Echo Lines hovering inside to emphasize "Nothing inside / Empty" -->
    <path d="M 95 110 Q 100 125 93 140" fill="none" stroke="url(#airGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 105 115 Q 101 128 107 138" fill="none" stroke="url(#airGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Tiny floating dust motes / light air current above the empty cup -->
    <circle cx="92" cy="72" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="108" cy="65" r="1.5" fill="#38bdf8" opacity="0.4"/>
    <circle cx="100" cy="55" r="2.5" fill="#38bdf8" opacity="0.5"/>
  </g>

  <!-- Foreground Prop: A playful little spoon resting beside the mug -->
  <g transform="translate(45, 160) rotate(-15)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="7" ry="9" fill="#cbd5e1"/>
    <ellipse cx="0" cy="0" rx="4" ry="6" fill="#94a3b8"/>
    <rect x="-2.5" y="8" width="5" height="35" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Action-packed Scene Sparkles / App Polish -->
  <path d="M 40 70 L 43 78 L 51 81 L 43 84 L 40 92 L 37 84 L 29 81 L 37 78 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 195 140 L 197 145 L 202 147 L 197 149 L 195 154 L 193 149 L 188 147 L 193 145 Z" fill="#38bdf8" opacity="0.7"/>
  <circle cx="160" cy="70" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="70" cy="130" r="2" fill="#38bdf8" opacity="0.5"/>
</svg>