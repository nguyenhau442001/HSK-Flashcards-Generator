<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="65%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Glow for Expression -->
    <radialGradient id="actionGlow" cx="62%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Character Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    
    <!-- Plant & Lamp Gradients -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT / BACKGROUND DETAILS -->
  <!-- Room Wall & Floor Divider -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#0f172a" stroke-width="3" />
  <rect x="0" y="180" width="240" height="60" fill="#090d16" />

  <!-- Window Frame in Background -->
  <rect x="15" y="30" width="50" height="95" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M17 32 H63 V123 H17 Z" fill="url(#windowLight)" />
  <line x1="40" y1="32" x2="40" y2="123" stroke="#334155" stroke-width="2" />
  <line x1="17" y1="77" x2="63" y2="77" stroke="#334155" stroke-width="2" />
  <!-- City silhouette outside window -->
  <path d="M22 123 L22 105 L28 105 L28 123 L34 123 L34 95 L42 95 L42 123 L50 123 L50 110 L58 110 L58 123 Z" fill="#1e293b" opacity="0.6" />

  <!-- Bookshelf / Wall Decor -->
  <rect x="175" y="45" width="50" height="8" rx="2" fill="#475569" />
  <path d="M185 45 L187 32 H193 L195 45 Z" fill="#fb923c" />
  <path d="M200 45 L202 28 H209 L211 45 Z" fill="#38bdf8" />
  <path d="M213 45 L214 36 H219 L220 45 Z" fill="#10b981" />

  <!-- Houseplant on a small stand -->
  <rect x="180" y="145" width="30" height="35" rx="4" fill="#334155" />
  <path d="M185 145 L195 125 H205 L215 145 Z" fill="url(#potGrad)" filter="url(#shadow)" />
  <!-- Plant leaves -->
  <path d="M200 125 Q180 110 170 120 Q185 130 200 125 Z" fill="#34d399" />
  <path d="M200 125 Q220 105 230 115 Q215 125 200 125 Z" fill="#10b981" />
  <path d="M200 125 Q195 95 205 90 Q205 110 200 125 Z" fill="#059669" />

  <!-- Desk and Props -->
  <path d="M80 180 L70 150 H165 L155 180 Z" fill="#334155" />
  <rect x="65" y="146" width="105" height="6" rx="2" fill="#475569" filter="url(#shadow)" />
  
  <!-- Desk Lamp -->
  <path d="M90 146 L95 110 H105 L100 146 Z" fill="#64748b" />
  <path d="M92 110 C85 95 105 85 105 100 Z" fill="url(#lampGrad)" />
  <ellipse cx="100" cy="103" rx="10" ry="4" fill="#fbbf24" opacity="0.8" />
  <!-- Lamp Light Cone Projection -->
  <path d="M95 107 L70 180 H120 L105 107 Z" fill="#fbbf24" opacity="0.08" />

  <!-- Coffee Mug & Notebook on Desk -->
  <rect x="135" y="138" width="16" height="10" rx="3" fill="#f8fafc" />
  <path d="M151 141 C155 141 155 146 151 146" stroke="#f8fafc" stroke-width="2" fill="none" />
  <rect x="110" y="140" width="18" height="8" rx="1" fill="#cbd5e1" transform="rotate(-5 110 140)" />

  <!-- ACTION: "Biểu thị" (Expressing agreement with a polite, confident gesture) -->
  <!-- Ambient Action Glow -->
  <circle cx="110" cy="100" r="70" fill="url(#actionGlow)" />

  <!-- Character Group -->
  <g transform="translate(15, 10)">
    <!-- Shadow beneath character -->
    <ellipse cx="95" cy="172" rx="35" ry="8" fill="#020617" opacity="0.4" />

    <!-- Torso (Leaning slightly forward in an engaging, communicative posture) -->
    <path d="M75 115 L90 170 H115 L105 115 Z" fill="url(#jacketGrad)" filter="url(#shadow)" />
    <!-- Shirt collar -->
    <path d="M85 115 L95 128 L105 115 Z" fill="#f8fafc" />
    <path d="M90 128 L95 145 L100 128 Z" fill="url(#shirtGrad)" />

    <!-- Back Arm / Hand resting on chest or table -->
    <path d="M80 120 Q65 140 75 155" stroke="#ea580c" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="75" cy="155" r="6" fill="url(#skinGrad)" />

    <!-- Head & Neck -->
    <path d="M91 112 H99 V120 H91 Z" fill="url(#skinGrad)" />
    <!-- Head shape with warm, expressive expression -->
    <circle cx="95" cy="85" r="24" fill="url(#skinGrad)" filter="url(#shadow)" />

    <!-- Hair (Stylish, modern layered cut) -->
    <path d="M73 85 C73 65 117 65 117 85 C117 92 115 95 115 95 C115 95 110 80 95 78 C80 80 73 85 73 85 Z" fill="#334155" />
    <path d="M75 83 C80 75 95 74 105 78 C110 80 115 88 117 85 C112 70 85 68 75 83 Z" fill="#475569" />

    <!-- Facial Features (Expressing agreement / confidence: bright eyes, gentle smile) -->
    <!-- Eyebrows (slightly raised, showing active engagement) -->
    <path d="M83 78 Q88 75 93 78" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M97 78 Q102 75 107 78" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Eyes (Happy, crescent/rounded friendly anime-inspired vector style) -->
    <circle cx="88" cy="85" r="3.5" fill="#0f172a" />
    <circle cx="102" cy="85" r="3.5" fill="#0f172a" />
    <circle cx="89" cy="84" r="1" fill="#ffffff" />
    <circle cx="103" cy="84" r="1" fill="#ffffff" />

    <!-- Friendly Smile (Expressing clear, positive communication) -->
    <path d="M91 94 Q95 99 99 94" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Cheeks (Blush of warmth/enthusiasm) -->
    <circle cx="84" cy="91" r="4" fill="#fb7185" opacity="0.4" />
    <circle cx="106" cy="91" r="4" fill="#fb7185" opacity="0.4" />

    <!-- Front Arm / Hand (The core action: "Biểu thị" / Expressing / Affirming gesture with open palm forward) -->
    <!-- Upper arm & Forearm coming forward dynamically -->
    <path d="M100 120 Q125 125 130 100" stroke="url(#jacketGrad)" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M125 103 Q132 90 135 80" stroke="url(#skinGrad)" stroke-width="11" stroke-linecap="round" fill="none" />
    <!-- Open Palm / Expressive Hand making an affirming gesture -->
    <circle cx="137" cy="74" r="7" fill="url(#skinGrad)" />
    <!-- Fingers outstretched communicating clarity -->
    <path d="M135 67 C140 65 144 70 142 75" stroke="url(#skinGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Dynamic floating motion lines & sparkle particles emphasizing the communicative action ("biểu thị") -->
  <g fill="none" stroke-linecap="round">
    <!-- Action Arc Lines -->
    <path d="M135 70 C145 65 155 75 150 85" stroke="#fbbf24" stroke-width="2.5" opacity="0.8" />
    <path d="M145 60 C155 55 165 65 160 75" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

    <!-- Sparkles / Accent Dots -->
    <circle cx="155" cy="55" r="3" fill="#fbbf24" />
    <circle cx="168" cy="75" r="2" fill="#38bdf8" />
    <circle cx="140" cy="50" r="1.5" fill="#f472b6" />
  </g>
</svg>