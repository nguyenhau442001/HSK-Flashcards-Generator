<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Masks -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Platform / Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Train Body Gradient (Sleek Modern High-Speed Train) -->
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Train Stripe Gradient -->
    <linearGradient id="trainStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Clock Glow Gradient -->
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Motion Blur Line Filter -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment: Railway Station Interior & Atmosphere -->
  <!-- Station Architectural Pillars & Structural Beams -->
  <rect x="15" y="0" width="12" height="180" fill="#1b263b" opacity="0.6" />
  <rect x="213" y="0" width="12" height="180" fill="#1b263b" opacity="0.6" />
  <line x1="21" y1="0" x2="21" y2="180" stroke="#0f172a" stroke-width="2" />
  <line x1="219" y1="0" x2="219" y2="180" stroke="#0f172a" stroke-width="2" />

  <!-- Glowing Station Departure Board / Big Clock in background -->
  <circle cx="120" cy="55" r="32" fill="url(#clockGlow)" />
  <circle cx="120" cy="55" r="26" fill="#0f172a" stroke="#ef4444" stroke-width="3" />
  <!-- Clock Hands pointing urgently (e.g., 11:59) -->
  <line x1="120" y1="55" x2="120" y2="39" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <line x1="120" y1="55" x2="133" y2="52" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <circle cx="120" cy="55" r="3" fill="#ef4444" />

  <!-- Platform Edge and Tracks -->
  <rect x="0" y="175" width="240" height="65" fill="url(#groundGrad)" />
  <!-- Yellow Safety Warning Line with Stripes -->
  <path d="M0 178 L240 178" stroke="#fbbf24" stroke-width="5" stroke-dasharray="12 6" />
  <!-- Train Tracks -->
  <rect x="0" y="200" width="240" height="6" fill="#090d16" />
  <line x1="0" y1="206" x2="240" y2="206" stroke="#64748b" stroke-width="3" />
  <line x1="0" y1="215" x2="240" y2="215" stroke="#64748b" stroke-width="3" />
  <!-- Track Ties -->
  <g stroke="#334155" stroke-width="3">
    <line x1="20" y1="203" x2="20" y2="218" />
    <line x1="60" y1="203" x2="60" y2="218" />
    <line x1="100" y1="203" x2="100" y2="218" />
    <line x1="140" y1="203" x2="140" y2="218" />
    <line x1="180" y1="203" x2="180" y2="218" />
    <line x1="220" y1="203" x2="220" y2="218" />
  </g>

  <!-- The Train Leaving (Moving Right, Motion Lines) -->
  <g transform="translate(130, 140)">
    <!-- Train Body -->
    <path d="M -10 20 C 30 20, 70 22, 90 25 C 100 26, 105 30, 105 38 L 105 48 C 105 52, 100 55, 90 55 L -10 55 Z" fill="url(#trainGrad)" />
    <!-- Train Front Nose (Aerodynamic Bullet) -->
    <path d="M 90 25 C 115 28, 125 35, 130 40 C 125 45, 115 52, 90 55 Z" fill="url(#trainGrad)" />
    <!-- Train Window / Windshield -->
    <path d="M 95 31 C 108 33, 117 37, 122 40 C 117 43, 108 47, 95 49 Z" fill="#0ea5e9" opacity="0.8" />
    <!-- Stripe on Train -->
    <path d="M -10 36 L 110 36 L 115 40 L -10 40 Z" fill="url(#trainStripe)" />
    <!-- Headlight beam / Glow -->
    <path d="M 125 40 L 160 30 L 160 50 Z" fill="#fbbf24" opacity="0.3" />
    <circle cx="127" cy="40" r="3" fill="#ffffff" />
    <!-- Speed / Motion Lines Behind Train -->
    <line x1="-30" y1="28" x2="-60" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" filter="url(#blurFilter)" />
    <line x1="-20" y1="42" x2="-70" y2="42" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#blurFilter)" />
    <line x1="-40" y1="50" x2="-80" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" filter="url(#blurFilter)" />
  </g>


  <!-- MAIN SUBJECT: Traveler Missing The Train ("Too Late" / 来不及 Action) -->
  <!-- Falling / Stumbling / Reaching dynamic pose -->
  <g transform="translate(68, 115)">
    <!-- Motion lines for stumbling body -->
    <line x1="20" y1="15" x2="-10" y2="25" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="15" y1="35" x2="-15" y2="45" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Dropped Suitcase & Papers Flying (Chaos of being late) -->
    <!-- Suitcase Open/Flying -->
    <g transform="translate(-25, 42) rotate(-25)">
      <rect x="0" y="0" width="18" height="13" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1.5" />
      <path d="M 5 0 C 5 -4, 13 -4, 13 0" fill="none" stroke="#78350f" stroke-width="1.5" />
      <line x1="0" y1="6" x2="18" y2="6" stroke="#78350f" stroke-width="1" />
    </g>
    <!-- Flying Ticket / Papers -->
    <path d="M -5 32 L 5 28 L 8 36 L -2 40 Z" fill="#f8fafc" transform="rotate(15)" />
    <path d="M -18 20 L -8 15 L -5 22 L -15 27 Z" fill="#cbd5e1" transform="rotate(-40)" />

    <!-- Traveler Body Parts -->
    <!-- Backpack -->
    <rect x="-12" y="10" width="14" height="22" rx="4" fill="#3b82f6" />
    <path d="M -8 10 C -8 5, -2 5, -2 10" fill="none" stroke="#1d4ed8" stroke-width="2" />

    <!-- Body / Torso (Leaning forward urgently) -->
    <path d="M -8 12 L 15 22 L 5 45 L -12 35 Z" fill="#ec4899" /> <!-- Bright pink/magenta jacket -->
    <path d="M -2 18 L 8 22" stroke="#be185d" stroke-width="2" /> <!-- Jacket zipper line -->

    <!-- Head & Face (Shocked/Desperate expression) -->
    <g transform="translate(18, 12)">
      <!-- Hair -->
      <circle cx="2" cy="0" r="9" fill="#1e293b" />
      <path d="M -5 -3 C -5 -8, 5 -9, 8 -4" fill="#1e293b" />
      <!-- Face skin -->
      <circle cx="4" cy="4" r="8" fill="#ffedd5" />
      <!-- Wide open shocked eye -->
      <circle cx="7" cy="3" r="2.5" fill="#ffffff" />
      <circle cx="8" cy="3" r="1" fill="#0f172a" />
      <!-- Open mouth (gasping/shouting "Oh no!") -->
      <ellipse cx="9" cy="8" rx="2.5" ry="3.5" fill="#7f1d1d" />
      <!-- Sweat drop representing panic -->
      <path d="M 12 -2 C 12 -2, 15 2, 12 4 C 10 4, 10 2, 12 -2 Z" fill="#38bdf8" />
    </g>

    <!-- Arms (One arm reaching forward desperately towards train, one back) -->
    <!-- Reaching Arm (Right Arm) -->
    <path d="M 12 25 C 25 22, 35 25, 48 20" fill="none" stroke="#ffedd5" stroke-width="5" stroke-linecap="round" />
    <!-- Sleeve -->
    <path d="M 12 25 L 28 24" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />
    <!-- Hand reaching out -->
    <circle cx="50" cy="19" r="3" fill="#ffedd5" />

    <!-- Back Arm (Left Arm) -->
    <path d="M -5 20 C -15 25, -22 32, -18 38" fill="none" stroke="#ffedd5" stroke-width="5" stroke-linecap="round" />
    <path d="M -5 20 L -12 24" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />

    <!-- Legs (Running stride / stumbling motion) -->
    <!-- Back Leg (Bent) -->
    <path d="M -5 42 C -12 52, -2 62, 5 58" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <!-- Front Leg (Stumbling forward) -->
    <path d="M 2 42 C 12 55, 22 62, 28 55" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <!-- Shoes -->
    <ellipse cx="5" cy="60" rx="4" ry="2.5" fill="#f97316" />
    <ellipse cx="30" cy="54" rx="5" ry="2.5" fill="#f97316" />
  </g>

  <!-- Foreground Atmospheric Details & Particles -->
  <!-- Dust / Wind particles swirling around the platform -->
  <circle cx="45" cy="160" r="1.5" fill="#94a3b8" opacity="0.6" />
  <circle cx="85" cy="170" r="2" fill="#94a3b8" opacity="0.4" />
  <circle cx="110" cy="155" r="1" fill="#cbd5e1" opacity="0.8" />
  <circle cx="155" cy="165" r="2.5" fill="#94a3b8" opacity="0.5" />
  <path d="M 30 165 Q 40 162, 50 167" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.4" />
  <path d="M 135 158 Q 145 154, 155 160" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.4" />
</svg>