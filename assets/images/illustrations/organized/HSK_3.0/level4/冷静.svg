<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Tea Liquid Gradient -->
    <linearGradient id="tea-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.95" />
    </linearGradient>

    <!-- Cup Body Gradient -->
    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glowing Zen Circle Gradient -->
    <linearGradient id="zen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    
    <!-- Window Light -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Background Details -->
  <!-- Window light beam casting across the desk -->
  <polygon points="0,0 120,0 240,180 240,240 0,240" fill="url(#window-light)" />
  
  <!-- Subtle Wall Shelf line -->
  <line x1="30" y1="50" x2="210" y2="50" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  
  <!-- Decorative small plant on shelf (miniature bonsai pot) -->
  <path d="M55,50 L65,50 L63,42 L57,42 Z" fill="#64748b" />
  <path d="M60,42 C56,38 56,32 60,30 C64,32 64,38 60,42 Z" fill="#10b981" opacity="0.8" />
  <path d="M57,38 C54,35 55,30 58,28" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  
  <!-- Hanging Zen Ring / Moon Motif -->
  <circle cx="120" cy="95" r="55" fill="url(#zen-glow)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />
  <circle cx="120" cy="95" r="45" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3" />

  <!-- Wooden Desk Surface -->
  <path d="M0,170 L240,170 L240,240 L0,240 Z" fill="#090d16" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#1e293b" stroke-width="3" />
  <path d="M0,176 L240,176" stroke="#0f172a" stroke-width="2" />

  <!-- Scene Elements: The "Bình Tĩnh" (Calmness) Composition -->
  <!-- A steaming cup of warm herbal tea on a saucer -->
  
  <!-- Desk Shadow for Cup -->
  <ellipse cx="120" cy="188" rx="35" ry="10" fill="#020617" opacity="0.8" />

  <!-- Saucer -->
  <g filter="url(#shadow)">
    <ellipse cx="120" cy="180" rx="42" ry="12" fill="#cbd5e1" />
    <ellipse cx="120" cy="178" rx="42" ry="12" fill="#e2e8f0" />
    <ellipse cx="120" cy="176" rx="32" ry="8" fill="#94a3b8" />
  </g>

  <!-- Tea Cup Handle -->
  <path d="M148,145 C165,145 168,168 148,172" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
  <path d="M148,147 C161,147 163,166 148,170" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

  <!-- Tea Cup Body -->
  <g filter="url(#shadow)">
    <!-- Outer Cup -->
    <path d="M92,135 L148,135 C148,135 154,178 120,178 C86,178 92,135 92,135 Z" fill="url(#cup-grad)" />
    
    <!-- Cup Rim -->
    <ellipse cx="120" cy="135" rx="28" ry="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Tea Liquid Inside -->
    <ellipse cx="120" cy="137" rx="25" ry="5" fill="url(#tea-grad)" />
  </g>

  <!-- Subtle calming face/smile detail etched on the cup (friendly minimal touch) -->
  <g stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M113,158 Q120,163 127,158" />
    <circle cx="112" cy="152" r="1" fill="#64748b" />
    <circle cx="128" cy="152" r="1" fill="#64748b" />
  </g>

  <!-- Elegant Steam / Qi Flow (Representing Calm Breathing & Serenity) -->
  <g stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Left Steam Wisp -->
    <path d="M110,125 C105,115 115,105 110,95 C105,85 112,75 108,65" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" />
    
    <!-- Center Steam Wisp (Tallest) -->
    <path d="M120,128 C125,116 115,106 122,94 C129,82 118,70 124,56" fill="none" stroke="#10b981" stroke-width="3" opacity="0.7" />
    
    <!-- Right Steam Wisp -->
    <path d="M130,125 C136,117 127,108 133,96 C139,84 131,74 136,62" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Floating Zen Elements (Glowing Orbs / Dust Motes in sunlight) -->
  <circle cx="85" cy="110" r="3" fill="#38bdf8" opacity="0.8" filter="url(#glow)" />
  <circle cx="160" cy="100" r="2" fill="#10b981" opacity="0.9" filter="url(#glow)" />
  <circle cx="150" cy="65" r="4" fill="#fbbf24" opacity="0.6" filter="url(#glow)" />
  <circle cx="95" cy="75" r="1.5" fill="#38bdf8" opacity="0.7" />
  
  <!-- Small pebble / zen stone beside the cup for environmental storytelling -->
  <ellipse cx="75" cy="176" rx="10" ry="6" fill="#475569" filter="url(#shadow)" />
  <ellipse cx="74" cy="175" rx="8" ry="4" fill="#64748b" />
</svg>