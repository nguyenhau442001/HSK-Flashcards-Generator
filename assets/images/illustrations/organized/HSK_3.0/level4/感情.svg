<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for the Core Emotive Object -->
    <radialGradient id="heart-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character & Object Gradients -->
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <linearGradient id="gift-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="gift-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="sweater-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="sweater-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Ambient Glow / Warmth -->
  <circle cx="120" cy="110" r="80" fill="url(#heart-glow)"/>

  <!-- Cozy Environment: Background Elements (Window, Stars, String Lights) -->
  <g opacity="0.4">
    <!-- Window Frame -->
    <rect x="70" y="30" width="100" height="70" rx="8" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="120" y1="30" x2="120" y2="100" stroke="#334155" stroke-width="2"/>
    <line x1="70" y1="65" x2="170" y2="65" stroke="#334155" stroke-width="2"/>
    
    <!-- Night Sky & Stars outside window -->
    <circle cx="90" cy="45" r="1.5" fill="#facc15"/>
    <circle cx="150" cy="50" r="1" fill="#facc15"/>
    <circle cx="140" cy="80" r="1.5" fill="#facc15"/>
    <circle cx="95" cy="85" r="1" fill="#facc15"/>

    <!-- Fairy Lights String -->
    <path d="M 15 20 Q 60 40 120 25 T 225 35" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="60" cy="32" r="3" fill="#facc15"/>
    <circle cx="120" cy="25" r="3" fill="#38bdf8"/>
    <circle cx="180" cy="31" r="3" fill="#ec4899"/>
  </g>

  <!-- Indoor Surface / Bookshelf / Planter Shelf -->
  <rect x="30" y="190" width="180" height="6" rx="3" fill="#334155"/>
  <!-- Decorative small plant on shelf -->
  <path d="M 45 190 L 50 175 L 55 190 Z" fill="#10b981"/>
  <path d="M 50 175 Q 45 160 38 155" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 175 Q 55 155 62 150" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Main Characters: Two friends sharing a warm moment representing "gǎnqíng" (tình cảm) -->
  
  <!-- Left Character (Leaning in, holding a gift/flower) -->
  <g transform="translate(0, 0)">
    <!-- Body / Torso -->
    <path d="M 70 190 L 70 155 C 70 145 78 135 90 135 L 105 135 C 117 135 125 145 125 155 L 125 190 Z" fill="url(#sweater-l)" filter="url(#soft-shadow)"/>
    <!-- Head -->
    <circle cx="95" cy="115" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 77 115 C 77 100 85 95 95 95 C 105 95 113 100 113 115 C 113 120 110 122 108 120 C 102 110 88 110 82 120 C 80 122 77 120 77 115 Z" fill="#475569"/>
    <!-- Face expression: Happy closed eyes -->
    <path d="M 88 113 Q 91 116 94 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 96 113 Q 99 116 102 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Warm Smile -->
    <path d="M 93 120 Q 95 123 97 120" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm reaching out -->
    <path d="M 115 145 Q 130 140 138 145" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Right Character (Smiling warmly back, receptive gesture) -->
  <g transform="translate(0, 0)">
    <!-- Body / Torso -->
    <path d="M 115 190 L 115 155 C 115 145 123 135 135 135 L 150 135 C 162 135 170 145 170 155 L 170 190 Z" fill="url(#sweater-r)" filter="url(#soft-shadow)"/>
    <!-- Head -->
    <circle cx="145" cy="115" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 127 115 C 127 98 138 93 148 93 C 158 93 165 98 165 115 C 165 120 160 122 158 118 C 152 108 138 108 132 118 C 130 122 127 120 127 115 Z" fill="#1e293b"/>
    <!-- Face expression -->
    <path d="M 138 113 Q 141 116 144 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 146 113 Q 149 116 152 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 143 120 Q 145 123 147 120" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm -->
    <path d="M 125 145 Q 115 142 110 148" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Centerpiece: The tangible symbol of deep connection / 'gǎnqíng' (Floating Glowing Heart & Gift Box between them) -->
  <g transform="translate(120, 135)" filter="url(#soft-shadow)">
    <!-- Gift Box Base -->
    <rect x="-12" y="-2" width="24" height="22" rx="4" fill="url(#gift-box)"/>
    <!-- Gift Ribbon Vertical -->
    <rect x="-3" y="-2" width="6" height="22" fill="url(#gift-ribbon)"/>
    <!-- Gift Ribbon Horizontal -->
    <rect x="-12" y="6" width="24" height="5" fill="url(#gift-ribbon)"/>
    <!-- Gift Lid -->
    <rect x="-14" y="-8" width="28" height="6" rx="2" fill="#0284c7"/>
    <!-- Ribbon Bow -->
    <path d="M -6 -8 C -12 -16 0 -18 -2 -10 Z" fill="url(#gift-ribbon)"/>
    <path d="M 6 -8 C 12 -16 0 -18 2 -10 Z" fill="url(#gift-ribbon)"/>
    <circle cx="0" cy="-9" r="2.5" fill="#fef08a"/>

    <!-- Floating Glowing Heart above the gift -->
    <g transform="translate(0, -32)">
      <path d="M 0 6 C -10 -4 -16 -12 -12 -18 C -9 -22 -3 -20 0 -15 C 3 -20 9 -22 12 -18 C 16 -12 10 -4 0 6 Z" fill="url(#rose-grad)" filter="url(#soft-shadow)"/>
      <!-- Heart highlight -->
      <path d="M -5 -14 C -7 -17 -4 -19 -2 -17" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- Floating Sparkles / Warm Emotional Energy Particles -->
  <g fill="#facc15">
    <circle cx="95" cy="75" r="2.5" opacity="0.9"/>
    <path d="M 145 65 L 147 70 L 152 72 L 147 74 L 145 79 L 143 74 L 138 72 L 143 70 Z" fill="#fbbf24" opacity="0.8" transform="scale(0.6) translate(100, 20)"/>
    
    <circle cx="165" cy="110" r="1.5" opacity="0.6"/>
    <circle cx="75" cy="130" r="2" opacity="0.7"/>
    
    <!-- Tiny floating hearts for atmosphere -->
    <path d="M 80 85 C 76 80 72 77 75 73 C 77 70 81 72 83 75 C 85 72 89 70 91 73 C 94 77 90 80 86 85 Z" fill="#ec4899" opacity="0.4" transform="scale(0.5) translate(30, 20)"/>
    <path d="M 170 140 C 166 135 162 132 165 128 C 167 125 171 127 173 130 C 175 127 179 125 181 128 C 184 132 180 135 176 140 Z" fill="#ec4899" opacity="0.5" transform="scale(0.6) translate(80, 25)"/>
  </g>

  <!-- Ambient Foreground Rim Light / Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
</svg>