<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Main Subject: A 'Temporary' Repair Scene (Broken Pipe with Duct Tape) -->
  <!-- Pipe -->
  <rect x="60" y="80" width="120" height="30" rx="4" fill="#64748b"/>
  <rect x="60" y="110" width="120" height="30" rx="4" fill="#64748b"/>
  
  <!-- Duct Tape (The 'Temporary' fix) -->
  <rect x="100" y="95" width="40" height="50" rx="2" fill="#fb923c"/>
  <path d="M100 95 L140 95 L145 145 L95 145 Z" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Water Drip (Action element) -->
  <circle cx="120" cy="155" r="4" fill="#38bdf8"/>
  <circle cx="120" cy="170" r="3" fill="#38bdf8"/>
  
  <!-- Context Props: Wrench -->
  <path d="M160 180 L200 160 L210 170 L170 190 Z" fill="#94a3b8"/>
  <circle cx="205" cy="165" r="8" fill="#94a3b8"/>
  <path d="M200 160 L210 170" stroke="#475569" stroke-width="2"/>
  
  <!-- Background Details -->
  <rect x="30" y="40" width="180" height="5" rx="2" fill="#1e293b" opacity="0.5"/>
  <circle cx="40" cy="60" r="15" fill="#1e293b" opacity="0.3"/>
  
  <!-- Lighting/Atmosphere -->
  <ellipse cx="120" cy="120" rx="80" ry="80" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>