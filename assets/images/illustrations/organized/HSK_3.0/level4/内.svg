<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Golden Glow for Treasure Chest Inner Chamber -->
    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Gem Gradient -->
    <linearGradient id="gem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Chest Wood Gradients -->
    <linearGradient id="wood-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="wood-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="wood-lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Metal Trim Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements (Dungeon/Secret Chamber vibe) -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 12"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="#fbbf24" stroke-width="1"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="202" rx="68" ry="12" fill="#020617" opacity="0.7"/>

  <!-- TREASURE CHEST SCENE (Focusing heavily on '内' - inside/interior) -->
  <g filter="url(#shadow)">
    
    <!-- BACK INTERIOR WALL OF CHEST (The 'Inside' space) -->
    <path d="M 64 120 L 176 120 L 176 175 L 64 175 Z" fill="url(#wood-back)"/>
    <!-- Interior Planks Texture -->
    <line x1="64" y1="138" x2="176" y2="138" stroke="#451a03" stroke-width="2" opacity="0.6"/>
    <line x1="64" y1="156" x2="176" y2="156" stroke="#451a03" stroke-width="2" opacity="0.6"/>

    <!-- MAGICAL GLOW EMANATING FROM INSIDE -->
    <ellipse cx="120" cy="145" rx="45" ry="20" fill="url(#inner-glow)" filter="url(#glow-filter)" opacity="0.85"/>
    <ellipse cx="120" cy="140" rx="30" ry="12" fill="#fef08a" opacity="0.9"/>

    <!-- TREASURES HIDDEN INSIDE -->
    <!-- Gold Coins Stack -->
    <g transform="translate(95, 142)">
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="#ca8a04"/>
      <ellipse cx="0" cy="-3" rx="14" ry="6" fill="#eab308"/>
      <ellipse cx="0" cy="-6" rx="14" ry="6" fill="#facc15"/>
    </g>
    <g transform="translate(135, 145)">
      <ellipse cx="0" cy="0" rx="12" ry="5" fill="#ca8a04"/>
      <ellipse cx="0" cy="-3" rx="12" ry="5" fill="#eab308"/>
      <ellipse cx="0" cy="-6" rx="12" ry="5" fill="#facc15"/>
    </g>

    <!-- Glowing Magic Crystal Inside -->
    <path d="M 120 115 L 128 135 L 120 150 L 112 135 Z" fill="url(#gem-grad)" filter="url(#glow-filter)"/>
    <path d="M 120 115 L 128 135 L 120 150 L 112 135 Z" fill="#e0f2fe" opacity="0.8"/>

    <!-- Floating Magical Sparkles Inside/Emerging -->
    <g fill="#fef08a">
      <circle cx="105" cy="120" r="2.5"/>
      <circle cx="138" cy="125" r="2"/>
      <circle cx="115" cy="105" r="3"/>
      <circle cx="130" cy="108" r="1.5"/>
    </g>
    <path d="M 120 95 Q 123 100 128 102 Q 123 104 120 109 Q 117 104 112 102 Q 117 100 120 95 Z" fill="#fef08a"/>
    <path d="M 90 110 Q 92 113 95 114 Q 92 115 90 118 Q 88 115 85 114 Q 88 113 90 110 Z" fill="#38bdf8"/>
    <path d="M 150 115 Q 152 118 155 119 Q 152 120 150 123 Q 148 120 145 119 Q 148 118 150 115 Z" fill="#38bdf8"/>

    <!-- CHEST LOWER BASE (FRONT) -->
    <path d="M 52 145 L 188 145 L 182 195 C 182 200, 178 204, 172 204 L 68 204 C 62 204, 58 200, 58 195 Z" fill="url(#wood-front)"/>
    
    <!-- Front Wood Planks / Texture -->
    <line x1="56" y1="165" x2="184" y2="165" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="185" x2="182" y2="185" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>

    <!-- Metal Reinforcement Bands (Front) -->
    <!-- Left Band -->
    <path d="M 68 145 L 82 145 L 80 203 L 68 202 Z" fill="url(#metal-grad)"/>
    <circle cx="75" cy="155" r="2" fill="#451a03"/>
    <circle cx="75" cy="192" r="2" fill="#451a03"/>

    <!-- Right Band -->
    <path d="M 158 145 L 172 145 L 172 202 L 160 203 Z" fill="url(#metal-grad)"/>
    <circle cx="165" cy="155" r="2" fill="#451a03"/>
    <circle cx="165" cy="192" r="2" fill="#451a03"/>

    <!-- Center Keyhole Plate -->
    <path d="M 110 162 L 130 162 L 133 182 L 107 182 Z" fill="url(#metal-grad)"/>
    <circle cx="120" cy="170" r="3.5" fill="#451a03"/>
    <path d="M 118.5 170 L 121.5 170 L 122 178 L 118 178 Z" fill="#451a03"/>
    <circle cx="120" cy="165" r="1" fill="#78350f"/>
    <circle cx="120" cy="179" r="1" fill="#78350f"/>

    <!-- OPEN LID (Tilted Up and Back to reveal the '内' / Inside) -->
    <g transform="translate(120, 142) rotate(-45) translate(-120, -142)">
      <!-- Lid Base -->
      <path d="M 50 142 C 50 115, 75 98, 120 98 C 165 98, 190 115, 190 142 Z" fill="url(#wood-lid)"/>
      <!-- Lid Rim / Metal Edge -->
      <path d="M 48 140 C 48 112, 74 95, 120 95 C 166 95, 192 112, 192 140 C 192 144, 188 147, 184 147 L 56 147 C 52 147, 48 144, 48 140 Z" fill="url(#metal-grad)"/>
      <!-- Lid Planks -->
      <path d="M 54 122 C 75 110, 165 110, 186 122" fill="none" stroke="#451a03" stroke-width="3" opacity="0.7"/>
      <path d="M 51 132 C 75 120, 165 120, 189 132" fill="none" stroke="#451a03" stroke-width="3" opacity="0.7"/>
      <!-- Rivets on Lid Rim -->
      <circle cx="65" cy="142" r="2" fill="#451a03"/>
      <circle cx="95" cy="142" r="2" fill="#451a03"/>
      <circle cx="120" cy="142" r="2" fill="#451a03"/>
      <circle cx="145" cy="142" r="2" fill="#451a03"/>
      <circle cx="175" cy="142" r="2" fill="#451a03"/>
    </g>

    <!-- Hinges connecting lid to box -->
    <rect x="85" y="141" width="10" height="6" rx="2" fill="url(#metal-grad)"/>
    <rect x="145" y="141" width="10" height="6" rx="2" fill="url(#metal-grad)"/>

  </g>

  <!-- FOREGROUND ACCENTS & DYNAMIC PARTICLES (Enhancing depth & action) -->
  <!-- Floating magical dust around the open interior -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="75" cy="135" r="3"/>
    <circle cx="165" cy="130" r="2.5"/>
    <circle cx="85" cy="95" r="2"/>
    <circle cx="155" cy="90" r="3.5"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="100" cy="85" r="2"/>
    <circle cx="140" cy="80" r="2.5"/>
  </g>

  <!-- Magical energy burst rings (Subtle) -->
  <path d="M 90 130 Q 120 110 150 130" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <path d="M 80 140 Q 120 115 160 140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

</svg>