<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Laptop -->
  <path d="M60 160 L180 160 L190 130 L50 130 Z" fill="#475569"/>
  <rect x="65" y="135" width="110" height="20" rx="2" fill="#38bdf8"/>
  
  <!-- Coffee Mug -->
  <circle cx="190" cy="150" r="12" fill="#fb923c"/>
  <path d="M202 145 Q210 145 210 155" stroke="#fb923c" stroke-width="3" fill="none"/>
  
  <!-- Character (Head/Shoulders) -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="30" fill="#fde68a"/>
    <path d="M-10 -5 Q-5 -10 0 -5 T10 -5" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="-8" cy="-5" r="2" fill="#475569"/>
    <circle cx="8" cy="-5" r="2" fill="#475569"/>
    <!-- Sweat Drop -->
    <path d="M15 -15 Q20 -25 15 -30 Q10 -25 15 -15" fill="#38bdf8"/>
  </g>
  
  <!-- Stack of Papers -->
  <rect x="30" y="170" width="40" height="50" rx="2" fill="#e2e8f0"/>
  <rect x="35" y="180" width="30" height="5" rx="1" fill="#cbd5e1"/>
  <rect x="35" y="190" width="30" height="5" rx="1" fill="#cbd5e1"/>
  
  <!-- Clock -->
  <circle cx="210" cy="30" r="15" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <line x1="210" y1="30" x2="210" y2="20" stroke="#fbbf24" stroke-width="2"/>
  <line x1="210" y1="30" x2="220" y2="30" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="80" fill="#fb923c" opacity="0.05"/>
</svg>