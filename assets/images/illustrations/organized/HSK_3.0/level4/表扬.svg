<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Character 1 (Teacher) Gradients -->
    <linearGradient id="teacherShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 (Student) Gradients -->
    <linearGradient id="studentShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Certificate Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Classroom Back Wall & Floor -->
  <rect x="0" y="0" width="240" height="170" fill="#1e293b"/>
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <!-- Floor line -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="3"/>

  <!-- Window with night sky & warm light -->
  <rect x="18" y="25" width="50" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <rect x="20" y="27" width="46" height="81" fill="url(#windowLight)"/>
  <!-- Window grid -->
  <line x1="43" y1="25" x2="43" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="18" y1="67" x2="68" y2="67" stroke="#334155" stroke-width="2"/>
  <!-- Stars outside -->
  <circle cx="30" cy="40" r="1.5" fill="#f8fafc"/>
  <circle cx="55" cy="50" r="1" fill="#f8fafc"/>
  <circle cx="35" cy="85" r="1.5" fill="#f8fafc"/>

  <!-- Bookshelf Background Prop -->
  <g transform="translate(180, 30)">
    <rect x="0" y="0" width="42" height="110" fill="#151c2c" rx="2" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="35" x2="42" y2="35" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="72" x2="42" y2="72" stroke="#334155" stroke-width="2"/>
    <!-- Books on shelf -->
    <rect x="6" y="12" width="6" height="23" fill="#10b981" rx="1"/>
    <rect x="14" y="10" width="8" height="25" fill="#f59e0b" rx="1"/>
    <rect x="24" y="15" width="5" height="20" fill="#38bdf8" rx="1"/>
    <rect x="6" y="45" width="7" height="27" fill="#ec4899" rx="1"/>
    <rect x="15" y="50" width="12" height="22" fill="#8b5cf6" rx="1"/>
  </g>

  <!-- Warm Spotlight illuminating the interaction -->
  <circle cx="120" cy="110" r="110" fill="url(#spotlight)" style="mix-blend-mode: screen;"/>

  <!-- Teacher's Desk Foreground Prop -->
  <g transform="translate(10, 155)">
    <!-- Desk Surface -->
    <path d="M0,15 L100,15 L105,30 L-5,30 Z" fill="#475569" filter="url(#shadow)"/>
    <rect x="-5" y="30" width="115" height="8" rx="2" fill="#334155"/>
    <!-- Desk leg -->
    <rect x="10" y="38" width="6" height="37" fill="#1e293b"/>
    <rect x="85" y="38" width="6" height="37" fill="#1e293b"/>
    <!-- Props on desk: Globe / Stack of papers / Pen holder -->
    <cylinder cx="20" cy="10" rx="8" ry="4"/>
    <rect x="70" y="-5" width="16" height="20" rx="1" fill="#cbd5e1"/>
    <rect x="68" y="-2" width="20" height="15" rx="1" fill="#f8fafc" transform="rotate(-10 78 5)"/>
    <circle cx="20" cy="2" r="7" fill="#38bdf8"/>
    <path d="M15,2 C17,5 23,5 25,2" stroke="#0f172a" stroke-width="1.5" fill="none"/>
  </g>

  <!-- CHARACTERS: TEACHER & STUDENT -->

  <!-- Teacher (Left side, standing, proudly presenting award / praising) -->
  <g id="teacher" transform="translate(65, 80)">
    <!-- Teacher Shadow -->
    <ellipse cx="-5" cy="95" rx="18" ry="6" fill="#090d16" opacity="0.6"/>

    <!-- Teacher Legs & Body -->
    <rect x="-16" y="50" width="10" height="45" rx="5" fill="#334155"/>
    <rect x="-2" y="50" width="10" height="45" rx="5" fill="#334155"/>
    <path d="M-22,15 L12,15 L16,55 L-26,55 Z" fill="url(#teacherShirt)" filter="url(#shadow)"/>
    
    <!-- Teacher Tie / Detail -->
    <polygon points="-3,20 3,20 1,45 -1,45" fill="#fbbf24"/>

    <!-- Teacher Head & Hair -->
    <circle cx="-5" cy="-8" r="15" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M-20,-8 C-20,-18 10,-20 10,-5 C10,-3 8,-3 5,-6 C2,-9 -5,-12 -12,-8 C-16,-6 -19,-7 -20,-8 Z" fill="#334155"/>

    <!-- Teacher Expressive Face (Smiling warmly, encouraging eyes) -->
    <circle cx="-10" cy="-10" r="1.5" fill="#1e293b"/>
    <circle cx="0" cy="-10" r="1.5" fill="#1e293b"/>
    <path d="M-6,-4 C-4,-1 -2,-1 0,-4" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Teacher Back Arm (Holding certificate) -->
    <path d="M-18,20 C-30,25 -35,10 -30,0" stroke="#0284c7" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="-30" cy="0" r="5" fill="#fcd34d"/>

    <!-- Teacher Front Arm (Gesturing / pointing approvingly toward student) -->
    <path d="M10,20 C25,25 35,15 42,22" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="42" cy="22" r="5" fill="#fcd34d"/>
  </g>

  <!-- Certificate / Award Prop (Held between them or presented by teacher) -->
  <g transform="translate(100, 75) rotate(-15)" filter="url(#shadow)">
    <!-- Scroll / Certificate -->
    <rect x="0" y="0" width="30" height="22" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <!-- Golden seal -->
    <circle cx="15" cy="11" r="5" fill="#fbbf24"/>
    <circle cx="15" cy="11" r="3" fill="#f59e0b"/>
    <!-- Ribbon tails -->
    <path d="M13,16 L10,22 L15,19 L20,22 L17,16 Z" fill="#ef4444"/>
    <!-- Fake text lines representing merit -->
    <line x1="6" y1="4" x2="24" y2="4" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="8" x2="20" y2="8" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Student (Right side, sitting/standing happily, receiving praise) -->
  <g id="student" transform="translate(155, 95)">
    <!-- Student Shadow -->
    <ellipse cx="5" cy="75" rx="16" ry="5" fill="#090d16" opacity="0.6"/>

    <!-- Student Legs -->
    <rect x="-3" y="35" width="8" height="40" rx="4" fill="#1e293b"/>
    <rect x="9" y="35" width="8" height="40" rx="4" fill="#1e293b"/>

    <!-- Student Body -->
    <path d="M-8,0 L20,0 L24,40 L-12,40 Z" fill="url(#studentShirt)" filter="url(#shadow)"/>
    <!-- Backpack straps -->
    <path d="M-3,0 L-7,18" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M12,0 L16,18" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

    <!-- Student Head -->
    <circle cx="6" cy="-22" r="14" fill="#fcd34d"/>
    <!-- Student Hair (Cute messy bob / spiky student hair) -->
    <path d="M-9,-25 C-10,-38 10,-40 18,-28 C22,-22 24,-30 20,-33 C12,-38 -2,-38 -8,-28 C-9,-27 -10,-26 -9,-25 Z" fill="#0f172a"/>

    <!-- Student Expressive Face (Happy, blushing eyes closed in joy, big smile) -->
    <path d="M1,-23 C3,-25 5,-25 7,-23" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M9,-23 C11,-25 13,-25 15,-23" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Blushing Cheeks -->
    <circle cx="0" cy="-18" r="3" fill="#f43f5e" opacity="0.5"/>
    <circle cx="15" cy="-18" r="3" fill="#f43f5e" opacity="0.5"/>
    <!-- Big joyful smile -->
    <path d="M4,-16 C6,-13 10,-13 12,-16" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Student Hands Raised in Excitement / Gratitude -->
    <!-- Left Arm reaching up toward certificate -->
    <path d="M-8,10 C-18,5 -20,-10 -15,-15" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="-15" cy="-15" r="4" fill="#fcd34d"/>

    <!-- Right Arm holding bag strap / resting -->
    <path d="M20,10 C30,15 28,30 22,35" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="22" cy="35" r="4" fill="#fcd34d"/>
  </g>

  <!-- ACTION VECTORS & SPARKLES (Praise atmosphere) -->
  <g transform="translate(130, 60)">
    <!-- Glowing Sparkles representing praise, success, and positive reinforcement -->
    <!-- Star 1 (Gold) -->
    <path d="M0,-10 C0,-3 3,0 10,0 C3,0 0,3 0,10 C0,3 -3,0 -10,0 C-3,0 0,-3 0,-10 Z" fill="#fbbf24" transform="scale(0.8)" filter="url(#shadow)"/>
    
    <!-- Star 2 (Cyan Accent) -->
    <g transform="translate(40, -30) scale(0.6)">
      <path d="M0,-10 C0,-3 3,0 10,0 C3,0 0,3 0,10 C0,3 -3,0 -10,0 C-3,0 0,-3 0,-10 Z" fill="#38bdf8"/>
    </g>

    <!-- Star 3 (Emerald Accent) -->
    <g transform="translate(-45, -20) scale(0.5)">
      <path d="M0,-10 C0,-3 3,0 10,0 C3,0 0,3 0,10 C0,3 -3,0 -10,0 C-3,0 0,-3 0,-10 Z" fill="#34d399"/>
    </g>

    <!-- Glowing circles / confetti -->
    <circle cx="25" cy="-10" r="3" fill="#f43f5e"/>
    <circle cx="-25" cy="15" r="2.5" fill="#fbbf24"/>
    <circle cx="15" cy="25" r="2" fill="#38bdf8"/>
  </g>

  <!-- Foreground decorative elements for depth (Out-of-focus plant leaf in corner) -->
  <path d="M0,240 C10,210 25,200 40,240 Z" fill="#0f172a" opacity="0.9"/>
  <path d="M-5,240 C15,195 35,190 50,240 Z" fill="#10b981" opacity="0.8"/>
</svg>