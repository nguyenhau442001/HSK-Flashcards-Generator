<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Reading Light Gradient -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Heart Glow Gradient for Emotional Climax -->
    <radialGradient id="heart-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweater-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="mug-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Glow (Warm Reading Light) -->
  <circle cx="120" cy="90" r="110" fill="url(#lamp-glow)"/>

  <!-- Room Interior Elements (Background Scene) -->
  <!-- Bookshelf / Wall Line -->
  <rect x="30" y="40" width="180" height="4" rx="2" fill="#334155" opacity="0.6"/>
  <!-- Little books on shelf -->
  <rect x="45" y="20" width="10" height="20" rx="2" fill="#64748b"/>
  <rect x="57" y="16" width="14" height="24" rx="2" fill="#0ea5e9"/>
  <rect x="73" y="22" width="8" height="18" rx="2" fill="#f43f5e"/>

  <!-- Hanging Pendant Light (Top Center) -->
  <path d="M120 0 L120 35" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 35 L140 35 L145 42 L95 42 Z" fill="#334155"/>
  <path d="M105 42 L135 42 L120 52 Z" fill="#fbbf24"/>

  <!-- Wooden Desk Surface -->
  <rect x="15" y="190" width="210" height="12" rx="4" fill="#334155"/>
  <rect x="25" y="202" width="190" height="8" rx="2" fill="#1e293b"/>

  <!-- Open Book & Glowing Emotional Core (The "Cảm động" / Touching Moment Catalyst) -->
  <!-- Book Shadow -->
  <ellipse cx="120" cy="180" rx="45" ry="8" fill="#0f172a" opacity="0.5"/>
  <!-- Open Book Pages -->
  <path d="M75 165 Q120 150 165 165 L165 185 Q120 170 75 185 Z" fill="#f1f5f9"/>
  <path d="M120 153 L120 173" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Magical/Emotional Floating Story Elements (Little stars/pages floating up) -->
  <path d="M90 155 Q100 140 105 130" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <path d="M150 155 Q140 140 135 130" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>

  <!-- Heart Emotional Aura Emitting from the Book -->
  <circle cx="120" cy="115" r="35" fill="url(#heart-glow)"/>

  <!-- Floating Glowing Hearts (Visualizing "Cảm động" / Heart-touched feeling) -->
  <path d="M120 120 C120 112 110 105 105 112 C100 119 112 128 120 135 C128 128 140 119 135 112 C130 105 120 112 120 120 Z" fill="#ec4899" transform="scale(0.8) translate(30, 20)"/>
  <path d="M120 120 C120 112 110 105 105 112 C100 119 112 128 120 135 C128 128 140 119 135 112 C130 105 120 112 120 120 Z" fill="#f43f5e" transform="scale(0.5) translate(80, 70)"/>
  <path d="M120 120 C120 112 110 105 105 112 C100 119 112 128 120 135 C128 128 140 119 135 112 C130 105 120 112 120 120 Z" fill="#fb7185" transform="scale(0.6) translate(10, 80)"/>

  <!-- Main Character (Expressive, deeply moved posture) -->
  <!-- Character Body / Cozy Sweater -->
  <path d="M85 190 C85 160 95 145 120 145 C145 145 155 160 155 190 Z" fill="url(#sweater-grad)"/>
  
  <!-- Character Neck & Head -->
  <rect x="110" y="130" width="20" height="20" fill="#fcd34d"/>
  <circle cx="120" cy="115" r="22" fill="#fde047"/>

  <!-- Hair Style -->
  <path d="M98 115 C98 98 110 95 120 95 C132 95 142 98 142 115 C142 122 138 120 138 115 C138 102 130 100 120 100 C110 100 102 102 102 115 C102 120 98 122 98 115 Z" fill="#451a03"/>

  <!-- Expressive Face (Tearful/Moved: closed happy/touched eyes, gentle smile, glowing cheeks) -->
  <!-- Rosy Cheeks (Emotions) -->
  <circle cx="109" cy="120" r="4" fill="#fb7185" opacity="0.6"/>
  <circle cx="131" cy="120" r="4" fill="#fb7185" opacity="0.6"/>

  <!-- Closed Happy/Moved Eyes (Arches upward) -->
  <path d="M106 113 Q110 109 114 113" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M126 113 Q130 109 134 113" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Tender, Heart-touched Smile -->
  <path d="M115 123 Q120 127 125 123" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Happy Tear Dropping near Eye (Iconic Cảm động detail) -->
  <path d="M113 116 C113 116 111 119 111 121 C111 122.5 112.3 123.5 113.5 123.5 C114.7 123.5 116 122.5 116 121 C116 119 113 116 113 116 Z" fill="#38bdf8"/>

  <!-- Cozy Arms Holding Cheeks / Leaning forward -->
  <!-- Left Arm & Hand on cheek -->
  <path d="M85 175 C85 160 98 150 108 135" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="108" cy="132" r="7" fill="#fcd34d"/>

  <!-- Right Arm & Hand on cheek -->
  <path d="M155 175 C155 160 142 150 132 135" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="132" cy="132" r="7" fill="#fcd34d"/>

  <!-- Foreground Prop: Warm Mug on Desk -->
  <rect x="175" y="170" width="18" height="22" rx="4" fill="url(#mug-grad)"/>
  <path d="M193 175 C199 175 199 187 193 187" stroke="#be123c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Steam from mug -->
  <path d="M181 162 Q185 155 181 148" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Secondary Foreground Prop: Small Plant in Pot -->
  <path d="M45 192 L55 175 L65 192 Z" fill="#cbd5e1"/>
  <ellipse cx="55" cy="192" rx="10" ry="3" fill="#94a3b8"/>
  <!-- Plant stems & leaves -->
  <path d="M55 175 Q50 160 40 160" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M55 175 Q60 155 70 155" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M55 175 Q55 150 55 145" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>