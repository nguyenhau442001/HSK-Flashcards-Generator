<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Gradient for Mother/Child Environment -->
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Gift Box Gradients -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting / Glow Background -->
  <circle cx="120" cy="120" r="100" fill="url(#warmGlow)" />

  <!-- Decorative Background Elements (Cozy Room Atmosphere) -->
  <g opacity="0.3">
    <!-- Hanging warm lights / bokeh -->
    <circle cx="50" cy="40" r="3" fill="#fbbf24" />
    <circle cx="190" cy="60" r="2" fill="#fbbf24" />
    <circle cx="210" cy="140" r="2.5" fill="#fbbf24" />
    <circle cx="30" cy="160" r="2" fill="#fbbf24" />
    <path d="M70 20 Q120 10 170 25" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="3,3" />
  </g>

  <!-- Wooden Table / Surface -->
  <rect x="20" y="180" width="200" height="8" rx="4" fill="#334155" />
  <rect x="15" y="188" width="210" height="20" rx="4" fill="#1e293b" />

  <!-- SCENE: Mother & Child Interaction (Mother's Day Context) -->
  <g transform="translate(0, 5)">
    <!-- Mother Character (Left / Center-Left) -->
    <g id="mother">
      <!-- Mother's Body / Torso (Warm knit sweater) -->
      <path d="M 65 140 C 55 140 45 150 42 175 L 98 175 C 95 150 85 140 75 140 Z" fill="#10b981" />
      <path d="M 70 140 C 70 132 75 128 82 128 C 89 128 94 132 94 140 Z" fill="#fbcfe8" /> <!-- Neck -->

      <!-- Mother's Hair (Gentle bun style) -->
      <path d="M 60 90 C 45 90 42 110 45 125 C 48 135 58 135 65 130 C 60 115 65 105 75 105 C 85 105 92 115 88 130 C 95 135 102 130 105 120 C 108 105 95 90 75 90 Z" fill="#334155" />
      <circle cx="75" cy="83" r="10" fill="#334155" /> <!-- Hair bun -->

      <!-- Mother's Face -->
      <circle cx="75" cy="105" r="16" fill="#fbcfe8" />
      <!-- Gentle smiling eye -->
      <path d="M 70 103 Q 73 106 76 103" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Warm Rosy Cheek -->
      <circle cx="68" cy="109" r="3" fill="#f43f5e" opacity="0.4" />
      <!-- Gentle smile -->
      <path d="M 72 113 Q 75 116 78 113" stroke="#e11d48" stroke-width="1.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Child Character (Right / Hugging or Giving Gift to Mother) -->
    <g id="child">
      <!-- Child's Body (Orange hoodie) -->
      <path d="M 145 145 C 155 145 165 152 168 175 L 112 175 C 115 152 125 145 135 145 Z" fill="#fb923c" />
      <path d="M 140 145 C 140 138 136 134 130 134 C 124 134 120 138 120 145 Z" fill="#fed7aa" /> <!-- Neck -->

      <!-- Child's Hair -->
      <path d="M 115 105 C 115 90 130 85 142 90 C 152 95 155 110 152 122 C 145 125 125 125 118 120 C 115 115 115 110 115 105 Z" fill="#1e293b" />

      <!-- Child's Face -->
      <circle cx="132" cy="108" r="14" fill="#fed7aa" />
      <!-- Happy closed eye -->
      <path d="M 134 105 Q 137 108 140 105" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Rosy cheek -->
      <circle cx="138" cy="111" r="2.5" fill="#f43f5e" opacity="0.4" />
      <!-- Big happy smile -->
      <path d="M 132 114 Q 135 117 138 114" stroke="#c2410c" stroke-width="1.2" stroke-linecap="round" fill="none" />

      <!-- Child's Arm reaching out to present gift/hug -->
      <path d="M 125 148 C 110 152 95 148 85 142" stroke="#fb923c" stroke-width="8" stroke-linecap="round" fill="none" />
      <circle cx="83" cy="141" r="4" fill="#fed7aa" /> <!-- Hand -->
    </g>

    <!-- Mother's Arm embracing child -->
    <path d="M 82 145 C 95 155 110 155 125 148" stroke="#10b981" stroke-width="9" stroke-linecap="round" fill="none" />
    <circle cx="127" cy="148" r="4.5" fill="#fbcfe8" /> <!-- Mother's Hand -->
  </g>

  <!-- Foreground Scene Props: Gift Box & Heart Felt Craft (Mother's Day Theme) -->
  <g id="props" transform="translate(0, 5)">
    <!-- Small Gift Box placed on the table -->
    <g transform="translate(100, 150)">
      <!-- Box Body -->
      <rect x="0" y="10" width="24" height="20" rx="2" fill="url(#boxGrad)" />
      <!-- Box Lid -->
      <rect x="-2" y="6" width="28" height="6" rx="2" fill="#0284c7" />
      <!-- Vertical Ribbon -->
      <rect x="10" y="6" width="4" height="24" fill="url(#ribbonGrad)" />
      <!-- Horizontal Ribbon -->
      <rect x="-2" y="13" width="28" height="3" fill="url(#ribbonGrad)" />
      <!-- Bow on top -->
      <path d="M 8 6 C 5 2 2 5 7 7 C 5 9 8 10 10 6 Z" fill="#ec4899" />
      <path d="M 16 6 C 19 2 22 5 17 7 C 19 9 16 10 14 6 Z" fill="#ec4899" />
      <circle cx="12" cy="6" r="1.5" fill="#be185d" />
    </g>

    <!-- Floating Hand-crafted Love Card with Heart -->
    <g transform="translate(145, 125) rotate(15)">
      <!-- Card Base -->
      <rect x="0" y="0" width="22" height="28" rx="2" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Cute Red Heart Symbol on Card -->
      <path d="M 11 10 C 9 7 6 8 6 11 C 6 14 11 17 11 17 C 11 17 16 14 16 11 C 16 8 13 7 11 10 Z" fill="#ef4444" />
      <!-- Decorative lines suggesting writing/drawing -->
      <line x1="6" y1="20" x2="16" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="8" y1="23" x2="14" y2="23" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Floating Magical Hearts / Sparkles (Emotional Warmth) -->
  <g id="sparkles">
    <!-- Heart 1 -->
    <path d="M 105 75 C 101 70 95 72 95 77 C 95 83 105 89 105 89 C 105 89 115 83 115 77 C 115 72 109 70 105 75 Z" fill="#f43f5e" opacity="0.8" transform="scale(0.6) translate(80, 40)" />
    <!-- Heart 2 (Smaller) -->
    <path d="M 105 75 C 101 70 95 72 95 77 C 95 83 105 89 105 89 C 105 89 115 83 115 77 C 115 72 109 70 105 75 Z" fill="#fb7185" opacity="0.9" transform="scale(0.4) translate(220, 110)" />
    
    <!-- Star sparkles -->
    <path d="M 45 95 L 47 100 L 52 102 L 47 104 L 45 109 L 43 104 L 38 102 L 43 100 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M 195 105 L 196.5 108.5 L 200 110 L 196.5 111.5 L 195 115 L 193.5 111.5 L 190 110 L 193.5 108.5 Z" fill="#38bdf8" opacity="0.8" />
    <circle cx="160" cy="70" r="2" fill="#fbbf24" opacity="0.7" />
    <circle cx="85" cy="55" r="1.5" fill="#f43f5e" opacity="0.6" />
  </g>
</svg>