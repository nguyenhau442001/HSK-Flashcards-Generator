<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 180 C 80 170, 160 170, 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Tree Trunk -->
  <rect x="110" y="100" width="20" height="90" rx="4" fill="#94a3b8"/>
  
  <!-- Tree Canopy (Growth/Time metaphor) -->
  <circle cx="120" cy="90" r="45" fill="#10b981"/>
  <circle cx="95" cy="100" r="35" fill="#059669"/>
  <circle cx="145" cy="100" r="35" fill="#059669"/>
  
  <!-- Person (Maturing) -->
  <g transform="translate(40, 140)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M20 32 L 20 60 M 20 40 L 5 50 M 20 40 L 35 50 M 20 60 L 10 85 M 20 60 L 30 85" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Floating leaves/elements representing "following along" -->
  <path d="M180 60 Q 190 50, 200 60 T 220 60" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M170 80 Q 180 70, 190 80 T 210 80" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Atmosphere/Depth -->
  <circle cx="200" cy="40" r="15" fill="#38bdf8" opacity="0.2"/>
  <circle cx="215" cy="55" r="8" fill="#38bdf8" opacity="0.3"/>
</svg>