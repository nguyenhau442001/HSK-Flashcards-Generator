<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Deep Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Underwater Light Rays -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Cliff / Lake Bank Gradient -->
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Lantern Gradient -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Diver Suit Colors -->
    <linearGradient id="diverSuit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- DISTANT SCENERY & SKY -->
  <path d="M0 80 Q60 70 120 78 T240 75 L240 100 L0 100 Z" fill="#334155" opacity="0.4"/>
  
  <!-- Pine Trees on Bank -->
  <path d="M30 80 L38 60 L46 80 Z M35 70 L41 52 L47 70 Z" fill="#065f46" opacity="0.6"/>
  <path d="M190 75 L197 58 L204 75 Z" fill="#065f46" opacity="0.6"/>

  <!-- THE LAKE / WATER BODY (Representing 'Deep') -->
  <!-- Water Surface Curve -->
  <path d="M10 95 C 70 85, 170 85, 230 95 L230 220 C 170 230, 70 230, 10 220 Z" fill="url(#waterGrad)"/>

  <!-- Underwater Light Beams / Shafts penetrating deep -->
  <polygon points="50,95 30,220 70,220" fill="url(#rayGrad)"/>
  <polygon points="90,95 75,220 125,220" fill="url(#rayGrad)"/>
  <polygon points="140,95 150,220 190,220" fill="url(#rayGrad)" opacity="0.6"/>

  <!-- ATMOSPHERIC DEPTH (Dark gradient overlay for lower depths) -->
  <rect x="10" y="160" width="220" height="60" rx="10" fill="#020617" opacity="0.4"/>

  <!-- UNDERWATER FLORA & FAUNA (Showing depth scale) -->
  <!-- Giant Kelp / Seaweed swaying upwards from deep bottom -->
  <path d="M25 220 Q15 190 30 160 Q45 130 35 100" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <path d="M38 220 Q50 185 38 150 Q26 115 42 95" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M215 220 Q225 180 210 150 Q195 120 205 100" fill="none" stroke="#059670" stroke-width="5" stroke-linecap="round"/>

  <!-- Floating Bubbles from deep below -->
  <circle cx="70" cy="170" r="3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="68" cy="150" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="72" cy="135" r="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="70" cy="115" r="1.5" fill="#38bdf8" opacity="0.5"/>

  <circle cx="170" cy="190" r="2.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="175" cy="170" r="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="168" cy="150" r="2" fill="#38bdf8" opacity="0.6"/>

  <!-- MAIN SUBJECT: A little diver with a glowing underwater lantern exploring the depth -->
  <!-- Diver Body -->
  <g transform="translate(100, 130)">
    <!-- Swimfins -->
    <path d="M-5 42 L-12 55 L-2 52 Z" fill="#1e293b"/>
    <path d="M9 42 L16 55 L6 52 Z" fill="#1e293b"/>
    
    <!-- Legs -->
    <rect x="-8" y="25" width="8" height="20" rx="4" fill="#f43f5e"/>
    <rect x="2" y="25" width="8" height="20" rx="4" fill="#f43f5e"/>

    <!-- Oxygen Tank -->
    <rect x="8" y="-5" width="7" height="28" rx="3.5" fill="#94a3b8"/>
    <line x1="11.5" y1="-5" x2="11.5" y2="23" stroke="#64748b" stroke-width="1"/>

    <!-- Torso -->
    <rect x="-8" y="-8" width="20" height="35" rx="8" fill="url(#diverSuit)"/>

    <!-- Arms (Reaching forward holding lantern) -->
    <path d="M-8 0 Q-20 5 -18 18" fill="none" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Helmet -->
    <circle cx="2" cy="-14" r="9" fill="#e2e8f0"/>
    <!-- Visor (Glowing faceplate) -->
    <circle cx="4" cy="-14" r="6" fill="#38bdf8"/>
    <path d="M2 -18 Q6 -16 5 -10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

    <!-- Lantern/Flashlight illuminating the deep water -->
    <circle cx="-22" cy="22" r="16" fill="url(#lanternGlow)"/>
    <circle cx="-18" cy="20" r="5" fill="#fbbf24"/>
    <rect x="-24" y="18" width="8" height="6" rx="2" fill="#334155"/>
    <line x1="-18" y1="18" x2="-22" y2="12" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Curious Little Fish swimming in the deep -->
  <g transform="translate(150, 165)">
    <path d="M0 0 Q8 -4 12 0 Q8 4 0 0 Z" fill="#fb923c"/>
    <polygon points="12,-3 17,0 12,3" fill="#fb923c"/>
    <circle cx="3" cy="-1" r="1" fill="#0f172a"/>
  </g>
  <g transform="translate(60, 195) scale(0.7)">
    <path d="M0 0 Q8 -4 12 0 Q8 4 0 0 Z" fill="#38bdf8"/>
    <polygon points="12,-3 17,0 12,3" fill="#38bdf8"/>
    <circle cx="3" cy="-1" r="1" fill="#0f172a"/>
  </g>

  <!-- FOREGROUND / SHORE / CLIFF STRUCTURE (Framing the scene to emphasize depth drop-off) -->
  <!-- Left Cliff -->
  <path d="M0 0 L35 0 C 25 40, 15 70, 8 110 L0 110 Z" fill="url(#cliffGrad)"/>
  <!-- Grass on Left Cliff -->
  <path d="M35 0 C 28 15, 20 30, 12 45 C 20 40, 28 25, 35 0 Z" fill="#10b981"/>

  <!-- Right Cliff (Deep edge) -->
  <path d="M240 0 L205 0 C 215 45, 225 75, 232 110 L240 110 Z" fill="url(#cliffGrad)"/>
  <!-- Grass on Right Cliff -->
  <path d="M205 0 C 212 15, 220 30, 228 45 C 220 40, 212 25, 205 0 Z" fill="#10b981"/>

  <!-- Water Surface Ripples / Waves near top -->
  <path d="M 40 93 Q 55 90, 70 93 T 100 93 T 130 93 T 160 93 T 190 93" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 70 96 Q 85 93, 100 96 T 130 96 T 160 96" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating Lily Pad on the surface for scale -->
  <g transform="translate(170, 89)">
    <ellipse cx="0" cy="0" rx="10" ry="4" fill="#059669"/>
    <path d="M0 0 L8 -2" stroke="#022c22" stroke-width="1"/>
    <!-- Tiny flower -->
    <circle cx="-2" cy="-1" r="2" fill="#f43f5e"/>
    <circle cx="-2" cy="-1" r="0.8" fill="#fbbf24"/>
  </g>

  <!-- Vignette / Frame border smoothing -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.5"/>
</svg>