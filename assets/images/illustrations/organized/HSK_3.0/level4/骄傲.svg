<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Golden Glow for Trophy -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Star/Sparkle Gradient -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pedestal Gradient -->
    <linearGradient id="pedestal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background light rays / celebration circles -->
  <circle cx="120" cy="110" r="90" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6, 6" />
  <circle cx="120" cy="110" r="70" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Background Confetti / Stars -->
  <g fill="#fbbf24">
    <path d="M 50,45 L 53,53 L 61,55 L 53,57 L 50,65 L 47,57 L 39,55 L 47,53 Z" opacity="0.8" transform="scale(0.8) translate(10, 10)" />
    <path d="M 190,65 L 192,70 L 197,72 L 192,74 L 190,79 L 188,74 L 183,72 L 188,70 Z" opacity="0.9" />
    <path d="M 40,140 L 42,144 L 46,146 L 42,148 L 40,152 L 38,148 L 34,146 L 38,144 Z" opacity="0.6" />
    <circle cx="195" cy="140" r="2.5" fill="#38bdf8" opacity="0.7" />
    <circle cx="45" cy="95" r="2" fill="#ec4899" opacity="0.7" />
    <circle cx="165" cy="35" r="3" fill="#10b981" opacity="0.8" />
  </g>

  <!-- Stage / Pedestal -->
  <g filter="url(#shadow)">
    <!-- Top ellipse of pedestal -->
    <ellipse cx="120" cy="195" rx="65" ry="16" fill="#64748b" />
    <ellipse cx="120" cy="192" rx="60" ry="14" fill="url(#pedestal-grad)" />
    <!-- Front face of pedestal -->
    <path d="M 60 192 L 60 215 C 60 223, 180 223, 180 215 L 180 192 Z" fill="#334155" />
    <path d="M 60 215 C 60 223, 180 223, 180 215 C 180 223, 60 223, 60 215 Z" fill="#1e293b" />
    <!-- Golden plaque on pedestal -->
    <rect x="95" y="200" width="50" height="12" rx="3" fill="#fbbf24" opacity="0.9" />
    <rect x="100" y="204" width="40" height="4" rx="1" fill="#d97706" opacity="0.6" />
  </g>

  <!-- Character (Proud Achiever) -->
  <g id="character" filter="url(#shadow)">
    <!-- Back Arm / Raised Arm holding Trophy -->
    <!-- Torso -->
    <path d="M 95 135 C 95 115, 145 115, 145 135 L 150 190 C 150 195, 90 195, 90 190 Z" fill="url(#shirt-grad)" />
    
    <!-- Jacket collar details -->
    <path d="M 110 135 L 120 155 L 130 135 Z" fill="#f8fafc" />
    <path d="M 120 155 L 120 190" stroke="#0284c7" stroke-width="2" />

    <!-- Head & Neck -->
    <path d="M 112 118 L 128 118 L 130 132 L 110 132 Z" fill="#fed7aa" />
    <circle cx="120" cy="98" r="22" fill="#fed7aa" />

    <!-- Hair (Stylish spiky energetic hair) -->
    <path d="M 98 95 C 96 78, 110 72, 122 74 C 135 72, 146 80, 144 98 C 144 98, 148 88, 140 84 C 146 88, 144 98, 144 98 C 148 90, 138 82, 132 82 C 132 78, 120 74, 112 78 C 104 76, 98 84, 98 95 Z" fill="#1e293b" />
    <path d="M 116 74 C 122 66, 132 68, 136 72 C 130 68, 122 68, 116 74 Z" fill="#334155" />

    <!-- Facial Expression: Confident Smile & Closed Happy Eyes -->
    <!-- Eyebrows (Confident slant) -->
    <path d="M 108 90 L 115 92" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 125 92 L 132 90" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Happy curved eyes (^ ^) -->
    <path d="M 107 96 Q 111 92 115 96" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 125 96 Q 129 92 133 96" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Cheeks (Blush of pride) -->
    <circle cx="106" cy="102" r="4" fill="#ec4899" opacity="0.4" />
    <circle cx="134" cy="102" r="4" fill="#ec4899" opacity="0.4" />

    <!-- Big Proud Grin -->
    <path d="M 112 104 Q 120 114 128 104" stroke="#1e293b" stroke-width="2" fill="#ef4444" stroke-linecap="round" />
    <path d="M 114 106 Q 120 112 126 106" fill="#ffffff" />

    <!-- Right Arm (Raised triumphantly holding trophy base) -->
    <path d="M 142 130 C 160 120, 165 95, 165 95" stroke="url(#shirt-grad)" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="165" cy="92" r="6" fill="#fed7aa" />

    <!-- Left Arm (On hip, confident stance) -->
    <path d="M 98 135 C 80 140, 78 165, 85 175 C 90 180, 95 170, 95 170" stroke="url(#shirt-grad)" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="85" cy="175" r="5" fill="#fed7aa" />
  </g>

  <!-- The Grand Trophy (Centerpiece of Pride & Achievement) -->
  <g id="trophy" transform="translate(120, 75)" filter="url(#shadow)">
    <!-- Trophy Glow Backing -->
    <circle cx="0" cy="-15" r="35" fill="#fbbf24" opacity="0.3" filter="url(#glow)" />

    <!-- Trophy Cup Body -->
    <path d="M -22 -35 C -22 -10, -12 5, 0 8 C 12 5, 22 -10, 22 -35 Z" fill="url(#gold-grad)" />
    <!-- Shiny Inner Highlight on Cup -->
    <path d="M -16 -32 C -16 -12, -8 2, -3 5 C -7 2, -12 -10, -12 -32 Z" fill="#ffffff" opacity="0.4" />

    <!-- Trophy Rim -->
    <ellipse cx="0" cy="-35" rx="22" ry="6" fill="#fef08a" />
    <ellipse cx="0" cy="-35" rx="18" ry="4" fill="#d97706" opacity="0.5" />

    <!-- Handles -->
    <path d="M -20 -30 C -35 -30, -35 -10, -20 -5" fill="none" stroke="url(#gold-grad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 20 -30 C 35 -30, 35 -10, 20 -5" fill="none" stroke="url(#gold-grad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Stem & Base -->
    <rect x="-3" y="8" width="6" height="12" fill="#d97706" />
    <rect x="-10" y="20" width="20" height="6" rx="2" fill="url(#gold-grad)" />

    <!-- Star Emblem on Trophy -->
    <path d="M 0 -18 L 2.5 -11 L 9 -11 L 4 -7 L 6 0 L 0 -4 L -6 0 L -4 -7 L -9 -11 L -2.5 -11 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Floating Sparkles & Celebration Elements -->
  <g id="sparkles">
    <!-- Top center big sparkle -->
    <path d="M 120 20 L 123 28 L 131 31 L 123 34 L 120 42 L 117 34 L 109 31 L 117 28 Z" fill="url(#sparkle-grad)" filter="url(#glow)" />
    
    <!-- Left floating star -->
    <path d="M 75 60 L 77 65 L 82 67 L 77 69 L 75 74 L 73 69 L 68 67 L 73 65 Z" fill="#38bdf8" opacity="0.9" />

    <!-- Right floating star -->
    <path d="M 165 75 L 167 80 L 172 82 L 167 84 L 165 89 L 163 84 L 158 82 L 163 80 Z" fill="#fbbf24" opacity="0.9" />

    <!-- Dynamic motion/pride arcs -->
    <path d="M 80 110 C 70 100, 70 80, 85 70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 160 110 C 170 100, 170 80, 155 70" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Foreground Lighting Accents -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" pointer-events="none" />
</svg>