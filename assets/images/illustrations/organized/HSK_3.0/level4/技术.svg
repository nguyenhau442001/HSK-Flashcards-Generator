<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Hologram/Energy Gradients -->
    <linearGradient id="holoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="laserOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="droneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="glowGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Environment / Workbench Details -->
  <g opacity="0.15">
    <!-- Grid Lines -->
    <path d="M0 40 H240 M0 80 H240 M0 120 H240 M0 160 H240 M0 200 H240" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 4" />
    <path d="M40 0 V240 M80 0 V240 M120 0 V240 M160 0 V240 M200 0 V240" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 4" />
  </g>

  <!-- Workbench Surface -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#0f172a" />
  <path d="M0 190 L240 190" stroke="#334155" stroke-width="2" />
  <path d="M20 215 H110" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <circle cx="130" cy="215" r="3" fill="#10b981" />
  <circle cx="145" cy="215" r="3" fill="#ef4444" />

  <!-- Robotic Arm (Advanced Technology Element) -->
  <g filter="url(#shadow)">
    <!-- Base -->
    <path d="M30 190 L50 150 L70 190 Z" fill="#475569" />
    <ellipse cx="50" cy="190" rx="25" ry="8" fill="#334155" />
    
    <!-- Lower Segment -->
    <path d="M45 160 L85 100" stroke="#64748b" stroke-width="12" stroke-linecap="round" />
    <circle cx="65" cy="130" r="8" fill="#334155" />
    <circle cx="65" cy="130" r="4" fill="#38bdf8" />

    <!-- Upper Segment -->
    <path d="M85 100 L120 115" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" />
    <circle cx="85" cy="100" r="7" fill="#475569" />

    <!-- Articulated Pliers/Laser Head -->
    <path d="M120 115 L135 110" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
    <!-- Laser Beam Emitting -->
    <polygon points="135,110 165,135 155,145" fill="url(#laserOrange)" opacity="0.8" filter="url(#glow)" />
    <line x1="135" y1="110" x2="160" y2="140" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- High-Tech Holographic Display -->
  <g filter="url(#shadow)">
    <!-- Hologram Projection Cone -->
    <polygon points="160,190 130,130 190,130" fill="#38bdf8" opacity="0.08" />
    
    <!-- Holographic Interface Ring / Target -->
    <ellipse cx="160" cy="125" rx="32" ry="12" fill="none" stroke="url(#holoCyan)" stroke-width="2" stroke-dasharray="6 3" />
    <ellipse cx="160" cy="125" rx="22" ry="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <circle cx="160" cy="125" r="3" fill="#38bdf8" />
  </g>

  <!-- Advanced Autonomous Drone (Main Subject of Technology) -->
  <g filter="url(#shadow)">
    <!-- Rotors & Motion Blur -->
    <ellipse cx="105" cy="65" rx="22" ry="5" fill="#38bdf8" opacity="0.4" />
    <ellipse cx="175" cy="65" rx="22" ry="5" fill="#38bdf8" opacity="0.4" />
    
    <!-- Rotor Arms -->
    <line x1="115" y1="75" x2="140" y2="85" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="165" y1="75" x2="140" y2="85" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="115" y1="95" x2="140" y2="85" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="165" y1="95" x2="140" y2="85" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <!-- Rotor Motors -->
    <circle cx="105" cy="65" r="6" fill="#64748b" />
    <circle cx="175" cy="65" r="6" fill="#64748b" />

    <!-- Drone Central Body -->
    <path d="M120 78 C120 70, 160 70, 160 78 L165 92 C165 100, 115 100, 115 92 Z" fill="url(#droneBody)" />
    <path d="M125 83 H155" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />
    
    <!-- Optical Lens/Sensor -->
    <circle cx="140" cy="92" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="142" cy="90" r="2" fill="#ef4444" filter="url(#glow)" />
  </g>

  <!-- Floating UI / Circuit Accents (Representing Innovation & Tech) -->
  <g opacity="0.8">
    <!-- Floating Data Nodes -->
    <circle cx="45" cy="80" r="4" fill="#10b981" filter="url(#glow)" />
    <path d="M45 84 L45 95 L60 95" fill="none" stroke="#10b981" stroke-width="1.5" />
    <rect x="60" y="90" width="16" height="10" rx="2" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />

    <circle cx="195" cy="165" r="4" fill="#f59e0b" filter="url(#glow)" />
    <path d="M195 161 L195 150 L180 150" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="156" y="142" width="24" height="16" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="164" cy="150" r="2" fill="#f59e0b" />
    <circle cx="172" cy="150" r="2" fill="#38bdf8" />

    <!-- Floating Hexagon Tech Grid -->
    <path d="M 190 50 L 200 55 L 200 65 L 190 70 L 180 65 L 180 55 Z" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <path d="M 50 130 L 58 134 L 58 142 L 50 146 L 42 142 L 42 134 Z" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.5" />
  </g>

  <!-- Sparkle / Energy Flares -->
  <g fill="#ffffff">
    <circle cx="140" cy="40" r="1.5" opacity="0.8" />
    <circle cx="95" cy="45" r="1" opacity="0.6" />
    <circle cx="210" cy="100" r="1.5" opacity="0.7" />
    <circle cx="30" cy="150" r="1" opacity="0.5" />
  </g>
</svg>