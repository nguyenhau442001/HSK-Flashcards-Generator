<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1c29"/>
      <stop offset="100%" stop-color="#0f111a"/>
    </linearGradient>

    <!-- Heat Radiance Gradient -->
    <radialGradient id="heatGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ff3b00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun/Heat Source Gradient -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sweat Drop Path -->
    <path id="sweat" d="M0,0 C2,3 2,5 0,7 C-2,5 -2,3 0,0 Z" fill="#38bdf8"/>
    
    <!-- Heat Wave Filter effect using simple vectors instead -->
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Heat atmosphere glow -->
  <circle cx="120" cy="100" r="110" fill="url(#heatGlow)"/>

  <!-- Window and Blazing Sun outside -->
  <g>
    <!-- Window frame / Backdrop -->
    <rect x="50" y="25" width="140" height="110" rx="4" fill="#090d16" stroke="#334155" stroke-width="3"/>
    
    <!-- Blazing Sky -->
    <rect x="53" y="28" width="134" height="104" fill="#ea580c"/>
    
    <!-- Blazing Sun -->
    <circle cx="120" cy="80" r="28" fill="url(#sunGrad)"/>
    
    <!-- Heat Waves radiating from window -->
    <path d="M70,50 Q75,45 80,50 T90,50" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M140,40 Q145,35 150,40 T160,40" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M90,110 Q95,105 100,110 T110,110" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.4"/>
    
    <!-- Window Panes Grid -->
    <line x1="120" y1="28" x2="120" y2="132" stroke="#334155" stroke-width="3"/>
    <line x1="53" y1="80" x2="187" y2="80" stroke="#334155" stroke-width="3"/>
  </g>

  <!-- Office/Room Interior Environment -->
  <!-- Desk surface -->
  <path d="M20,175 L220,175 L230,210 L10,210 Z" fill="url(#deskGrad)"/>
  <rect x="10" y="210" width="220" height="8" fill="#0f172a"/>

  <!-- Desk Props: Melted Ice Drink -->
  <g transform="translate(170, 145)">
    <!-- Glass cup -->
    <path d="M0,0 L6,30 C6,32 8,34 10,34 L20,34 C22,34 24,32 24,30 L30,0 Z" fill="#93c5fd" opacity="0.4"/>
    <!-- Melted liquid -->
    <rect x="3" y="12" width="24" height="18" fill="#60a5fa" opacity="0.7"/>
    <!-- Floating umbrella/straw -->
    <line x1="20" y1="32" x2="10" y2="-5" stroke="#ec4899" stroke-width="2"/>
    <!-- Puddle of condensation -->
    <ellipse cx="15" cy="35" rx="16" ry="3" fill="#38bdf8" opacity="0.5"/>
  </g>

  <!-- Desk Props: Smoking/Overheated Laptop -->
  <g transform="translate(35, 155)">
    <!-- Laptop base -->
    <polygon points="0,20 60,20 70,30 -10,30" fill="#64748b"/>
    <!-- Screen -->
    <polygon points="5,20 55,20 55,-5 5,-5" fill="#475569"/>
    <!-- Screen error glow (Red) -->
    <rect x="10" y="0" width="40" height="15" fill="#ef4444" rx="2"/>
    <!-- Warning lines on screen -->
    <line x1="15" y1="5" x2="35" y2="5" stroke="#f8fafc" stroke-width="2"/>
    <line x1="15" y1="10" x2="25" y2="10" stroke="#f8fafc" stroke-width="2"/>
    <!-- Heat steam from laptop -->
    <path d="M25,-8 Q28,-15 22,-22 T25,-35" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- MAIN CHARACTER: Struggling / Overheated (受不了 - Can't take it!) -->
  <g transform="translate(120, 150)">
    
    <!-- Body / Torso (leaning forward in distress) -->
    <path d="M-25,10 C-25,-5 -15,-20 0,-20 C15,-20 25,-5 25,10 L20,35 L-20,35 Z" fill="#3b82f6"/>
    <!-- Collar / Tie loosened -->
    <polygon points="-8,-15 8,-15 5,-5 -5,-5" fill="#ffffff"/>
    <polygon points="-2,-5 2,-5 4,10 0,15 -4,10" fill="#ef4444"/>

    <!-- Head (Pushed back, mouth open in agony/heat exhaustion) -->
    <g transform="translate(0, -38)">
      <!-- Neck -->
      <rect x="-6" y="10" width="12" height="15" fill="#fcd34d"/>
      
      <!-- Head shape -->
      <circle cx="0" cy="0" r="22" fill="#fbbf24"/>
      
      <!-- Hair (Messy from sweat) -->
      <path d="M-22,-5 C-20,-18 -10,-24 0,-24 C10,-24 20,-18 22,-5 C15,-10 5,-12 0,-10 C-5,-12 -15,-10 -22,-5 Z" fill="#1e293b"/>

      <!-- Face Expressions: Overwhelmed & Sweating -->
      <!-- Crossed / Dizzy Eyes -->
      <path d="M-10,-4 L-4,2 M-4,-4 L-10,2" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M4,-4 L10,2 M10,-4 L4,2" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Eyebrows angled in distress -->
      <line x1="-12" y1="-9" x2="-4" y2="-6" stroke="#1e293b" stroke-width="2"/>
      <line x1="12" y1="-9" x2="4" y2="-6" stroke="#1e293b" stroke-width="2"/>

      <!-- Wide Open Panting Mouth -->
      <path d="M-6,8 C-6,16 6,16 6,8 Z" fill="#7f1d1d"/>
      <path d="M-3,10 C-3,14 3,14 3,10 Z" fill="#ef4444"/>

      <!-- Heavy Blushes (Heat) -->
      <ellipse cx="-13" cy="3" rx="4" ry="2" fill="#ef4444" opacity="0.6"/>
      <ellipse cx="13" cy="3" rx="4" ry="2" fill="#ef4444" opacity="0.6"/>

      <!-- Sweat Stream 1 (Forehead) -->
      <path d="M0,-22 C3,-15 4,-10 2,-5" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <use href="#sweat" x="2" y="-3"/>

      <!-- Sweat Drop 2 (Cheek) -->
      <use href="#sweat" x="16" y="-8" transform="scale(1.2)"/>
      <!-- Sweat Drop 3 (Side) -->
      <use href="#sweat" x="-18" y="2" transform="rotate(-20)"/>
    </g>

    <!-- Arms dramatically clutching head / hair -->
    <!-- Left Arm -->
    <path d="M-22,-15 C-35,-20 -38,-5 -28,5" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-28" cy="5" r="5" fill="#fbbf24"/> <!-- Hand -->

    <!-- Right Arm -->
    <path d="M22,-15 C35,-20 38,-5 28,5" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="28" cy="5" r="5" fill="#fbbf24"/> <!-- Hand -->

  </g>

  <!-- Dynamic Flying Sweat Drops & Heat FX in the room -->
  <use href="#sweat" x="75" y="110" transform="scale(1.5)" />
  <use href="#sweat" x="155" y="100" transform="scale(1.8) rotate(15)" />
  <use href="#sweat" x="90" y="150" transform="scale(1.2) rotate(-30)" />

  <!-- Heat Shimmer FX lines near character -->
  <path d="M85,120 Q90,115 85,110 T85,100" stroke="#fb923c" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M155,125 Q150,120 155,115 T155,105" stroke="#fb923c" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Outer Vignette / Border overlay for polished vector look -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>