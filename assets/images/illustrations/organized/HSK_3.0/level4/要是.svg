<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Weather/Decision Concept: A split scene representing the "If" condition -->
  <!-- Left side: Rain cloud -->
  <path d="M60 120c-15 0-25 10-25 25s10 25 25 25h50c10 0 15-5 15-15s-5-15-15-15c-5-15-20-20-35-20z" fill="#38bdf8" opacity="0.6"/>
  <path d="M65 160l-5 15M80 165l-5 15M95 160l-5 15" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right side: Sunny park bench -->
  <rect x="140" y="150" width="60" height="10" rx="2" fill="#fbbf24"/>
  <rect x="145" y="160" width="5" height="20" fill="#fbbf24"/>
  <rect x="190" y="160" width="5" height="20" fill="#fbbf24"/>
  <circle cx="190" cy="80" r="25" fill="#f59e0b"/>
  
  <!-- The "Decision" path: A winding trail connecting the two -->
  <path d="M100 150 Q 140 150 160 130" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6 6" fill="none"/>
  
  <!-- Character looking at the sky -->
  <g transform="translate(100, 100)">
    <circle cx="20" cy="20" r="15" fill="#f1f5f9"/>
    <path d="M15 40l5 20M25 40l-5 20" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 50l20 0" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
    <circle cx="15" cy="18" r="2" fill="#0f172a"/>
    <circle cx="25" cy="18" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="210" cy="30" r="3" fill="#fb923c"/>
  <circle cx="30" cy="40" r="4" fill="#10b981"/>
  <path d="M200 200l10-10" stroke="#ec4899" stroke-width="2"/>
</svg>