<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Stormy Environment -->
  <path d="M0 180 Q 60 160 120 180 T 240 180 V 240 H 0 Z" fill="#334155" opacity="0.6"/>
  <path d="M20 50 L 30 70 M 50 40 L 60 60 M 180 30 L 190 50" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- The Umbrella (The "Regardless" Shield) -->
  <path d="M120 80 C 80 80 60 100 60 120 L 180 120 C 180 100 160 80 120 80 Z" fill="#f59e0b"/>
  <path d="M120 120 L 120 200" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="200" r="4" fill="#fbbf24"/>
  
  <!-- The Character (Standing firm) -->
  <g transform="translate(120, 160)">
    <ellipse cx="0" cy="0" rx="15" ry="20" fill="#38bdf8"/>
    <circle cx="0" cy="-25" r="10" fill="#38bdf8"/>
    <path d="M-10 5 L -20 25 M 10 5 L 20 25" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Elements of "Whatever happens" -->
  <circle cx="40" cy="140" r="3" fill="#ec4899"/>
  <circle cx="200" cy="150" r="4" fill="#10b981"/>
  <circle cx="160" cy="130" r="2" fill="#fb923c"/>
  <path d="M10 150 L 20 160" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <path d="M220 140 L 230 150" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
