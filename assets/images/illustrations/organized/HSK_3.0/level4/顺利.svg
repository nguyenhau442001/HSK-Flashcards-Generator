<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Rocket Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>

    <!-- Rocket Body Gradient -->
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Green Success Trail -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Starry Background & Atmospheric Depth -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="35" cy="50" r="1.5"/>
    <circle cx="205" cy="40" r="1"/>
    <circle cx="185" cy="110" r="1.5"/>
    <circle cx="55" cy="180" r="1"/>
    <circle cx="25" cy="120" r="1.2"/>
    <circle cx="215" cy="175" r="1.5"/>
    <circle cx="110" cy="30" r="1"/>
  </g>

  <!-- Glowing Stars / Sparkles -->
  <g fill="#fbbf24">
    <path d="M 190 70 Q 190 75 185 75 Q 190 75 190 80 Q 190 75 195 75 Q 190 75 190 70" />
    <path d="M 50 90 Q 50 94 46 94 Q 50 94 50 98 Q 50 94 54 94 Q 50 94 50 90" />
  </g>

  <!-- Dynamic Flow Path (Smooth, unhindered upward journey representing "thuận lợi") -->
  <path d="M 120 210 C 90 170 160 120 120 60" fill="none" stroke="url(#trailGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 8"/>

  <!-- Floating Environment / Clouds -->
  <path d="M 45 150 C 35 150 30 142 35 135 C 40 125 55 125 65 132 C 70 125 85 128 88 138 C 92 145 88 150 80 150 Z" fill="url(#cloudGrad)"/>
  <path d="M 175 105 C 168 105 164 99 168 94 C 172 87 184 87 191 92 C 195 87 205 90 207 97 C 210 102 206 105 200 105 Z" fill="url(#cloudGrad)"/>

  <!-- Main Subject: Action-Packed Rocket Launch (Smooth & Successful Journey) -->
  <g transform="translate(0, 0)">
    <!-- Rocket Exhaust Flame -->
    <path d="M 112 145 L 120 175 L 128 145 Z" fill="url(#flameGrad)" filter="url(#softGlow)"/>
    <path d="M 115 145 L 120 165 L 125 145 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Rocket Fins -->
    <path d="M 105 125 L 92 142 L 105 135 Z" fill="#f43f5e"/>
    <path d="M 135 125 L 148 142 L 135 135 Z" fill="#f43f5e"/>

    <!-- Rocket Main Body -->
    <path d="M 120 70 C 130 95 132 120 132 135 L 108 135 C 108 120 110 95 120 70 Z" fill="url(#rocketGrad)"/>

    <!-- Rocket Nose Cone -->
    <path d="M 120 70 C 125 80 132 95 132 95 L 108 95 C 108 95 115 80 120 70 Z" fill="#f43f5e"/>

    <!-- Rocket Window / Porthole -->
    <circle cx="120" cy="110" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="120" cy="110" r="4" fill="#38bdf8"/>
    <!-- Window shine -->
    <path d="M 118 108 A 2 2 0 0 1 121 107" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Center Stripe Accent -->
    <rect x="118" y="120" width="4" height="15" fill="#38bdf8"/>
  </g>

  <!-- Speed Lines / Success Vectors -->
  <g stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="95" y1="85" x2="85" y2="75"/>
    <line x1="145" y1="95" x2="155" y2="85"/>
    <line x1="100" y1="130" x2="88" y2="135"/>
  </g>

  <!-- Foreground Atmospheric Glow (Warm Optimistic Lighting) -->
  <circle cx="120" cy="70" r="40" fill="#38bdf8" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Success Checkmark Badge (Ambient context element) -->
  <g transform="translate(155, 60)">
    <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.9" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="14" fill="#10b981"/>
    <path d="M -5 -1 L -1 3 L 6 -4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>