<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- The "Pressure" - Stack of Papers -->
  <rect x="70" y="100" width="100" height="60" rx="4" fill="#cbd5e1"/>
  <rect x="75" y="95" width="90" height="5" rx="2" fill="#94a3b8"/>
  <rect x="80" y="90" width="80" height="5" rx="2" fill="#64748b"/>
  
  <!-- Character head/shoulders peeking out -->
  <circle cx="120" cy="180" r="30" fill="#fde68a"/>
  <path d="M100 180 Q120 200 140 180" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="110" cy="175" r="3" fill="#78350f"/>
  <circle cx="130" cy="175" r="3" fill="#78350f"/>
  
  <!-- Coffee Mug with Steam -->
  <rect x="180" y="130" width="30" height="30" rx="4" fill="#fb923c"/>
  <path d="M210 135 a 5 5 0 0 1 5 5 v 10 a 5 5 0 0 1 -5 5" stroke="#fb923c" stroke-width="4" fill="none"/>
  <path d="M195 120 q 5 -10 0 -20" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M205 120 q -5 -10 0 -20" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Clock showing late time -->
  <circle cx="40" cy="40" r="25" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <line x1="40" y1="40" x2="40" y2="25" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="55" y2="40" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ambient glow/stress lines -->
  <path d="M170 100 L190 80" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M70 100 L50 80" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4"/>
</svg>