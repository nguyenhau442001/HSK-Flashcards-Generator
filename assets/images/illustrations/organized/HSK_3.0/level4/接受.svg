<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow for Acceptance/Opportunity -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Envelope/Offer Gradient -->
    <linearGradient id="envelope-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    
    <linearGradient id="envelope-flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light / Focus Glow -->
  <circle cx="120" cy="110" r="90" fill="url(#glow)"/>

  <!-- SCENE ENVIRONMENT & PROPS -->
  <!-- Window / Background Office Vibe -->
  <g opacity="0.15">
    <rect x="40" y="45" width="50" height="70" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="65" y1="45" x2="65" y2="115" stroke="#94a3b8" stroke-width="2"/>
    <line x1="40" y1="80" x2="90" y2="80" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Bookshelf / Plant props in background -->
  <rect x="180" y="50" width="20" height="65" rx="2" fill="#334155" opacity="0.6"/>
  <rect x="185" y="60" width="10" height="4" fill="#64748b"/>
  <rect x="183" y="70" width="14" height="4" fill="#38bdf8"/>
  <rect x="185" y="80" width="10" height="4" fill="#fb923c"/>
  
  <!-- Desk Surface -->
  <path d="M 20 185 L 220 185 L 205 215 L 35 215 Z" fill="url(#desk-grad)"/>
  <path d="M 20 185 L 220 185" stroke="#475569" stroke-width="2"/>

  <!-- Laptop on Desk -->
  <path d="M 160 160 L 200 165 L 195 188 L 150 183 Z" fill="#475569"/>
  <path d="M 145 185 L 205 185 L 215 190 L 135 190 Z" fill="#64748b"/>
  <!-- Coffee Mug -->
  <rect x="195" y="155" width="14" height="18" rx="2" fill="#cbd5e1"/>
  <path d="M 209 160 C 214 160 214 170 209 170" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- MAIN CHARACTER: Upper Body Receiving Offer -->
  <!-- Torso & Shoulders -->
  <path d="M 85 190 C 85 155 100 145 120 145 C 140 145 155 155 155 190 Z" fill="url(#shirt-grad)"/>
  <!-- Collar -->
  <path d="M 105 145 L 120 162 L 135 145 Z" fill="#f8fafc"/>

  <!-- Neck & Head -->
  <rect x="112" y="125" width="16" height="25" fill="#fbcfe8" rx="4"/>
  <!-- Head Base -->
  <circle cx="120" cy="105" r="26" fill="#fbcfe8"/>
  
  <!-- Hair (Neat Modern Style) -->
  <path d="M 95 105 C 95 85 110 80 120 80 C 135 80 145 90 146 108 C 143 102 138 92 120 92 C 103 92 97 100 95 105 Z" fill="#334155"/>

  <!-- Friendly Facial Expression (Accepting/Happy) -->
  <!-- Closed Happy Eyes -->
  <path d="M 108 102 Q 112 108 116 102" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M 124 102 Q 128 108 132 102" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Cheeks (Blush) -->
  <circle cx="107" cy="110" r="4" fill="#fb7185" opacity="0.4"/>
  <circle cx="133" cy="110" r="4" fill="#fb7185" opacity="0.4"/>
  <!-- Smile -->
  <path d="M 113 113 Q 120 120 127 113" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- HANDS & ACTION: Grasping/Accepting the Offer -->
  <!-- Left Arm & Hand reaching out/up proudly -->
  <path d="M 90 160 C 75 150 70 130 85 120" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round"/>
  <!-- Left Hand holding envelope -->
  <circle cx="85" cy="118" r="8" fill="#fbcfe8"/>

  <!-- Right Arm & Hand -->
  <path d="M 150 160 C 165 155 170 140 160 125" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round"/>
  <circle cx="160" cy="122" r="8" fill="#fbcfe8"/>

  <!-- THE OFFER / CONTRACT (The core object being accepted) -->
  <g transform="translate(95, 75) rotate(-12)">
    <!-- Envelope Shadow -->
    <rect x="2" y="2" width="50" height="36" rx="4" fill="#0f172a" opacity="0.3"/>
    <!-- Envelope Base -->
    <rect width="50" height="36" rx="4" fill="url(#envelope-grad)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Envelope Flap -->
    <path d="M 0 0 L 25 20 L 50 0 Z" fill="url(#envelope-flap)"/>
    <!-- Document Peek (Golden/Success accent) -->
    <rect x="10" y="-8" width="30" height="15" rx="2" fill="#fbbf24"/>
    <rect x="15" y="-4" width="20" height="2" rx="1" fill="#d97706"/>
    <!-- Checkmark on Document/Offer indicating acceptance -->
    <path d="M 22 0 L 25 3 L 31 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ACTION & SPARKLES (Visual feedback for successful acceptance) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 155 55 L 157 62 L 164 64 L 157 66 L 155 73 L 153 66 L 146 64 L 153 62 Z" transform="scale(0.8) translate(40, 10)"/>
    <!-- Star 2 -->
    <path d="M 75 80 L 76.5 84 L 80.5 85 L 76.5 86 L 75 90 L 73.5 86 L 69.5 85 L 73.5 84 Z"/>
    <!-- Sparkle dot -->
    <circle cx="130" cy="50" r="3" opacity="0.8"/>
    <circle cx="85" cy="140" r="2" opacity="0.6"/>
  </g>

  <g fill="#38bdf8">
    <circle cx="170" cy="95" r="2.5" opacity="0.7"/>
    <circle cx="65" cy="115" r="3" opacity="0.9"/>
  </g>

</svg>