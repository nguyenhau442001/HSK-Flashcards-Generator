<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Window Warm Glow Gradient -->
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Suitcase gradient -->
    <linearGradient id="suitcaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Scarf Gradient -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Snow Shadow -->
    <linearGradient id="snowDrift" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Stars / Night Sky details -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="35" cy="40" r="1.5" />
    <circle cx="95" cy="25" r="1" />
    <circle cx="160" cy="35" r="1.5" />
    <circle cx="215" cy="55" r="1" />
    <circle cx="20" cy="85" r="1" />
  </g>

  <!-- Distant Mountains/Hills -->
  <path d="M 0 160 Q 40 130 90 150 T 190 140 Q 220 135 240 150 L 240 240 L 0 240 Z" fill="#1e293b" opacity="0.7" />

  <!-- Falling Snowflakes Background Layer -->
  <g fill="#94a3b8" opacity="0.4">
    <circle cx="45" cy="70" r="2" />
    <circle cx="75" cy="110" r="1.5" />
    <circle cx="130" cy="65" r="2.5" />
    <circle cx="185" cy="90" r="1.5" />
    <circle cx="210" cy="130" r="2" />
    <circle cx="15" cy="135" r="2" />
  </g>

  <!-- Cozy House & Window (Home context) -->
  <g id="cozy-house">
    <!-- Roof -->
    <polygon points="175,95 235,120 115,120" fill="#0f172a" />
    <path d="M 115 120 L 235 120 L 235 125 L 115 125 Z" fill="#cbd5e1" />
    
    <!-- House Body -->
    <rect x="130" y="120" width="90" height="70" fill="#475569" />
    
    <!-- Warm Glowing Window -->
    <rect x="155" y="135" width="40" height="45" rx="4" fill="#1e293b" />
    <rect x="160" y="140" width="30" height="35" rx="2" fill="url(#windowGlow)" />
    <!-- Window Frame Cross -->
    <line x1="175" y1="140" x2="175" y2="175" stroke="#475569" stroke-width="2" />
    <line x1="160" y1="157" x2="190" y2="157" stroke="#475569" stroke-width="2" />
    
    <!-- Warm Light Beam on Snow -->
    <path d="M 155 175 L 130 215 L 210 215 L 195 175 Z" fill="#f59e0b" opacity="0.15" />
  </g>

  <!-- Pine Tree with Snow (Winter scenery) -->
  <g id="pine-tree">
    <!-- Tree Trunk -->
    <rect x="42" y="155" width="8" height="35" fill="#78350f" />
    <!-- Foliage Layers -->
    <polygon points="46,100 20,135 72,135" fill="#065f46" />
    <polygon points="46,100 25,135 67,135" fill="#10b981" opacity="0.2" /> <!-- highlight -->
    <!-- Snow on top -->
    <path d="M 46 100 Q 52 110 72 135 Q 46 130 20 135 Q 38 115 46 100 Z" fill="#f1f5f9" />

    <polygon points="46,125 15,165 77,165" fill="#047857" />
    <!-- Snow on mid -->
    <path d="M 46 125 Q 55 138 77 165 Q 46 155 15 165 Q 32 140 46 125 Z" fill="#f1f5f9" />

    <polygon points="46,150 10,195 82,195" fill="#065f46" />
    <!-- Snow on bottom -->
    <path d="M 46 150 Q 55 170 82 195 Q 46 185 10 195 Q 30 170 46 150 Z" fill="#f1f5f9" />
  </g>

  <!-- Foreground Snowy Ground -->
  <path d="M 0 190 Q 60 180 120 195 T 240 185 L 240 240 L 0 240 Z" fill="url(#snowDrift)" />
  <!-- Snow Sparkles / Texture -->
  <circle cx="100" cy="205" r="1" fill="#ffffff" />
  <circle cx="140" cy="220" r="1.5" fill="#ffffff" />
  <circle cx="205" cy="200" r="1" fill="#ffffff" />
  <circle cx="65" cy="215" r="1" fill="#ffffff" />

  <!-- MAIN CHARACTER (Traveler / Student heading home for Winter Break) -->
  <g id="traveler" transform="translate(90, 105)">
    <!-- Backpack / Travel Gear -->
    <rect x="-14" y="25" width="14" height="26" rx="5" fill="#3b82f6" />
    <path d="M -14 32 L 0 32" stroke="#1d4ed8" stroke-width="2" />

    <!-- Legs & Winter Boots -->
    <!-- Left Leg -->
    <rect x="-6" y="55" width="8" height="25" rx="3" fill="#1e293b" />
    <!-- Left Boot -->
    <path d="M -10 75 L 0 75 C 4 75 6 78 6 82 L -10 82 Z" fill="#78350f" />
    
    <!-- Right Leg -->
    <rect x="2" y="55" width="8" height="25" rx="3" fill="#1e293b" />
    <!-- Right Boot -->
    <path d="M -2 75 L 8 75 C 12 75 14 78 14 82 L -2 82 Z" fill="#78350f" />

    <!-- Winter Puffer Coat Body -->
    <path d="M -12 20 L 14 20 C 18 20 20 24 18 35 L 12 60 C 12 62 8 63 6 60 L 0 45 L -6 60 C -8 63 -12 62 -12 60 L -18 35 C -20 24 -16 20 -12 20 Z" fill="#0284c7" />
    <!-- Coat zipper line -->
    <line x1="0" y1="20" x2="0" y2="50" stroke="#bae6fd" stroke-width="1.5" />
    <!-- Coat puffy horizontal lines -->
    <path d="M -15 28 C -5 28 5 28 15 28" stroke="#0369a1" stroke-width="1.5" fill="none" />
    <path d="M -17 38 C -5 38 5 38 17 38" stroke="#0369a1" stroke-width="1.5" fill="none" />
    <path d="M -14 48 C -5 48 5 48 14 48" stroke="#0369a1" stroke-width="1.5" fill="none" />

    <!-- Arms -->
    <!-- Left Arm holding suitcase -->
    <path d="M -12 22 L -22 38 L -18 45" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Arm waving/balanced -->
    <path d="M 14 22 L 25 32 L 22 40" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Glove (Hand) -->
    <circle cx="22" cy="41" r="4" fill="#ec4899" />

    <!-- Head & Face -->
    <circle cx="0" cy="5" r="13" fill="#fde68a" /> <!-- Skin -->
    
    <!-- Happy Closed Eyes (Joyful expression for going home) -->
    <path d="M -5 3 C -3 1 -1 3 -1 3" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 1 3 C 3 1 5 3 5 3" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />
    <!-- Smiling Cheeks -->
    <circle cx="-6" cy="6" r="2.5" fill="#f43f5e" opacity="0.6" />
    <circle cx="6" cy="6" r="2.5" fill="#f43f5e" opacity="0.6" />
    <!-- Smile -->
    <path d="M -3 9 C -1 11 1 11 3 9" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />

    <!-- Winter Beanie Hat -->
    <path d="M -13.5 5 C -14 -4 -6 -9 0 -9 C 6 -9 14 -4 13.5 5 Z" fill="#ec4899" />
    <!-- Beanie Brim -->
    <path d="M -14 3 C -5 6 5 6 14 3 L 14 7 C 5 10 -5 10 -14 7 Z" fill="#be185d" />
    <!-- Pom Pom -->
    <circle cx="0" cy="-12" r="4.5" fill="#fbcfe8" />

    <!-- Cozy Scarf around neck -->
    <path d="M -11 15 C -3 18 3 18 11 15 C 13 18 10 22 6 20 C 2 18 -2 18 -6 20 C -10 22 -13 18 -11 15 Z" fill="url(#scarfGrad)" />
    <!-- Scarf Tails blowing in wind -->
    <path d="M 8 18 Q 18 22 24 32 L 20 34 Q 15 25 7 21 Z" fill="url(#scarfGrad)" />

    <!-- SUITCASE (Essential travel prop representing holiday trip) -->
    <g id="suitcase" transform="translate(-32, 40)">
      <!-- Handle -->
      <path d="M 6 -6 L 6 -11 C 6 -13 8 -14 10 -14 L 14 -14 C 16 -14 18 -13 18 -11 L 18 -6" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
      <!-- Case Body -->
      <rect x="0" y="-6" width="24" height="30" rx="4" fill="url(#suitcaseGrad)" />
      <!-- Corner Protectors & Detailing -->
      <rect x="0" y="6" width="24" height="3" fill="#9a3412" opacity="0.4" />
      <rect x="8" y="-6" width="8" height="30" fill="#ea580c" opacity="0.3" />
      <!-- Wheels/Base -->
      <rect x="3" y="24" width="4" height="3" rx="1" fill="#334155" />
      <rect x="17" y="24" width="4" height="3" rx="1" fill="#334155" />
    </g>
  </g>

  <!-- Foreground Falling Snowflakes (Depth Effect) -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="30" cy="45" r="2.5" />
    <circle cx="110" cy="20" r="3" />
    <circle cx="225" cy="95" r="2.5" />
    <circle cx="75" cy="165" r="2" />
    <circle cx="185" cy="180" r="3" />
    <!-- Custom star-like snowflake -->
    <path d="M 205 30 L 205 40 M 200 35 L 210 35" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
    <path d="M 55 90 L 55 98 M 51 94 L 59 94" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>