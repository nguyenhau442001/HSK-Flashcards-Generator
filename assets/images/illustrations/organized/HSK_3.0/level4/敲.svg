<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Door Wood Gradient -->
    <linearGradient id="doorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="30%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Action Impact Glow -->
    <radialGradient id="impactGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Action Motion Lines Clip/Path -->
    <style>
      .knock-motion {
        animation: pulse 1s infinite alternate;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Wall & Warm Light from Off-screen Hallway/Peephole -->
  <circle cx="160" cy="110" r="90" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT: Cozy Room Interior -->
  <!-- Wall base & Floor line -->
  <line x1="20" y1="200" x2="220" y2="200" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- FRONT-AND-CENTER: Wooden Door Frame and Door -->
  <!-- Door Frame Outer -->
  <rect x="45" y="25" width="150" height="175" rx="6" fill="#334155" filter="url(#shadow)"/>
  <!-- Door Panel -->
  <rect x="52" y="30" width="136" height="168" rx="4" fill="url(#doorGrad)"/>
  <!-- Door Detailing / Panels -->
  <rect x="62" y="42" width="50" height="65" rx="3" fill="none" stroke="#52270b" stroke-width="3" opacity="0.6"/>
  <rect x="128" y="42" width="50" height="65" rx="3" fill="none" stroke="#52270b" stroke-width="3" opacity="0.6"/>
  <rect x="62" y="119" width="50" height="65" rx="3" fill="none" stroke="#52270b" stroke-width="3" opacity="0.6"/>
  <rect x="128" y="119" width="50" height="65" rx="3" fill="none" stroke="#52270b" stroke-width="3" opacity="0.6"/>

  <!-- Golden Door Knob -->
  <circle cx="68" cy="115" r="5" fill="#facc15" filter="url(#shadow)"/>
  <circle cx="68" cy="115" r="2" fill="#eab308"/>

  <!-- CONTEXT PROP: Wall Painting / Frame next to door for interior depth -->
  <rect x="15" y="60" width="22" height="30" rx="2" fill="#475569" filter="url(#shadow)"/>
  <rect x="18" y="63" width="16" height="24" fill="#38bdf8" opacity="0.3"/>

  <!-- CONTEXT PROP: Small Floor Plant -->
  <path d="M 25 200 Q 25 180 32 170 Q 39 180 39 200 Z" fill="#64748b"/>
  <ellipse cx="32" cy="168" rx="10" ry="4" fill="#475569"/>
  <!-- Plant Leaves -->
  <path d="M 32 168 Q 20 150 15 155 Q 15 168 32 168 Z" fill="#10b981"/>
  <path d="M 32 168 Q 45 145 50 152 Q 45 168 32 168 Z" fill="#34d399"/>
  <path d="M 32 168 Q 30 140 35 140 Q 40 145 32 168 Z" fill="#059669"/>

  <!-- ACTION SUBJECT: Hand Knocking on Door (Representing 敲 - gõ, đập) -->
  <!-- Motion Lines / Impact Waves radiating from the knock point -->
  <g transform="translate(138, 105)">
    <!-- Shockwave / Sound ripples -->
    <path d="M -15 -15 C -5 -25 15 -25 25 -15" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M -25 -25 C -5 -40 25 -40 40 -25" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="0" cy="0" r="18" fill="url(#impactGlow)"/>
  </g>

  <!-- Knocking Hand Arm and Fist -->
  <!-- Sleeve / Forearm entering from right -->
  <path d="M 205 130 C 180 120 160 115 142 112" fill="none" stroke="#38bdf8" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
  
  <!-- Cuff -->
  <path d="M 175 112 C 170 118 165 125 162 132" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>

  <!-- Hand / Knuckles hitting the door -->
  <g filter="url(#shadow)">
    <!-- Wrist/Hand base -->
    <path d="M 135 102 Q 150 105 155 115 Q 152 125 138 122 Z" fill="#fbcfe8"/>
    <!-- Knuckles (Curled Fist striking) -->
    <circle cx="137" cy="106" r="6" fill="#f472b6"/>
    <circle cx="134" cy="113" r="6" fill="#f472b6"/>
    <circle cx="133" cy="120" r="5" fill="#f472b6"/>
    <!-- Thumb tucked -->
    <path d="M 142 116 Q 148 122 145 128" fill="#f472b6" stroke="#db2777" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Impact Spark / Star Effect -->
  <g transform="translate(136, 107)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fef08a"/>
    <circle cx="-5" cy="-6" r="1.5" fill="#ffffff"/>
    <circle cx="6" cy="5" r="1" fill="#ffffff"/>
  </g>

  <!-- Atmospheric Lighting Overlay (Top Vignette) -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
    <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#020617" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none"/>
</svg>