<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Clipboard Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Stamp Red Gradient -->
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background glow representing success -->
  <circle cx="120" cy="120" r="90" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Scene Elements: Wooden Desk Surface at Bottom -->
  <path d="M 20 200 L 220 200 L 235 230 L 5 230 Z" fill="#0f172a" opacity="0.6"/>
  <rect x="0" y="215" width="240" height="25" fill="#334155" opacity="0.4"/>

  <!-- Secondary Prop: Coffee Mug with Steam -->
  <g transform="translate(180, 150)">
    <rect x="0" y="10" width="26" height="32" rx="4" fill="#38bdf8"/>
    <path d="M 26 16 C 33 16, 33 32, 26 32" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 8 6 C 8 2, 12 2, 12 -2" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 18 6 C 18 2, 22 2, 22 -2" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Secondary Prop: Drafting Pencil / Ruler -->
  <g transform="translate(30, 160) rotate(-25)">
    <polygon points="0,4 60,0 60,8" fill="#fbbf24"/>
    <polygon points="60,0 68,4 60,8" fill="#f59e0b"/>
    <polygon points="0,4 8,2 8,6" fill="#cbd5e1"/>
    <polygon points="0,4 8,4 8,8" fill="#e2e8f0"/>
  </g>

  <!-- Main Subject: Official Inspection Clipboard (Rotated dynamic angle) -->
  <g transform="translate(120, 115) rotate(5)">
    
    <!-- Clipboard Shadow -->
    <rect x="-62" y="-82" width="124" height="164" rx="10" fill="#000000" opacity="0.4"/>
    
    <!-- Clipboard Board (Wooden/Dark Modern Base) -->
    <rect x="-60" y="-80" width="120" height="160" rx="8" fill="#f8fafc"/>
    <rect x="-56" y="-76" width="112" height="152" rx="6" fill="#ffffff"/>

    <!-- Document Content Lines (Simulated Inspection Form) -->
    <line x1="-40" y1="-50" x2="10" y2="-50" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="-40" y1="-35" x2="-10" y2="-35" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

    <!-- Checklist items with Green Checkmarks -->
    <g transform="translate(-45, -20)">
      <circle cx="5" cy="5" r="6" fill="#ecfdf5"/>
      <path d="M 2 5 L 4 7 L 8 2" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="16" y1="5" x2="35" y2="5" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g transform="translate(-45, 2)">
      <circle cx="5" cy="5" r="6" fill="#ecfdf5"/>
      <path d="M 2 5 L 4 7 L 8 2" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="16" y1="5" x2="42" y2="5" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g transform="translate(-45, 24)">
      <circle cx="5" cy="5" r="6" fill="#ecfdf5"/>
      <path d="M 2 5 L 4 7 L 8 2" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="16" y1="5" x2="30" y2="5" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Graph / Quality chart illustration on paper -->
    <rect x="-45" y="45" width="90" height="32" rx="4" fill="#f1f5f9"/>
    <path d="M -35 65 L -15 55 L 5 60 L 35 48" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="48" r="3" fill="#3b82f6"/>

    <!-- Metallic Clip at Top -->
    <rect x="-22" y="-90" width="44" height="18" rx="4" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="-14" y="-84" width="28" height="8" rx="2" fill="#475569"/>
    <!-- Clip handle -->
    <path d="M -18 -90 L -18 -98 L 18 -98 L 18 -90 Z" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Giant Action-Packed "PASSED / APPROVED" Stamp Overlay -->
  <g transform="translate(135, 110) rotate(-12)" filter="url(#softGlow)">
    <!-- Outer Ring Stamp Effect -->
    <rect x="-55" y="-30" width="110" height="60" rx="12" fill="none" stroke="url(#stampGrad)" stroke-width="5" stroke-dasharray="100 4" opacity="0.9"/>
    <rect x="-51" y="-26" width="102" height="52" rx="9" fill="none" stroke="url(#stampGrad)" stroke-width="2" opacity="0.8"/>

    <!-- Dynamic Check Symbol inside Stamp (Universal symbol for 'Qualified/Passed') -->
    <g transform="translate(0, 0)">
      <path d="M -22 -2 L -8 12 L 24 -14" stroke="url(#stampGrad)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Sparkles / Success Highlights -->
  <g transform="translate(50, 60)">
    <path d="M 0 10 Q 0 0 10 0 Q 0 0 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Z" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <g transform="translate(190, 80)">
    <path d="M 0 7 Q 0 0 7 0 Q 0 0 0 -7 Q 0 0 -7 0 Q 0 0 0 7 Z" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <g transform="translate(70, 180)">
    <path d="M 0 6 Q 0 0 6 0 Q 0 0 0 -6 Q 0 0 -6 0 Q 0 0 0 6 Z" fill="#10b981" filter="url(#glow)"/>
  </g>
</svg>