<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="trunk" x1="120" y1="100" x2="120" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="canopy1" cx="50%" cy="40%" r="50%" fx="50%" fy="30%">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="canopy2" cx="40%" cy="40%" r="50%">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Atmospheric background details -->
  <circle cx="190" cy="50" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="50" cy="70" r="1.5" fill="#f43f5e" opacity="0.6"/>
  <circle cx="70" cy="40" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="210" cy="120" r="1.5" fill="#34d399" opacity="0.5"/>
  <path d="M20 190 Q 60 180, 100 185 T 220 188" stroke="#334155" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Courtyard Ground / Platform -->
  <ellipse cx="120" cy="205" rx="90" ry="18" fill="#0f172a"/>
  <path d="M40 205 Q 120 185, 200 205 L 210 220 Q 120 235, 30 220 Z" fill="#334155" opacity="0.5"/>
  <ellipse cx="120" cy="208" rx="75" ry="12" fill="#475569" opacity="0.8"/>

  <!-- Ancient Tree (Cây) -->
  <!-- Roots -->
  <path d="M120 170 Q 95 185, 80 195 L 90 202 Q 110 190, 120 185 Z" fill="#7c2d12"/>
  <path d="M120 170 Q 145 185, 160 195 L 150 202 Q 130 190, 120 185 Z" fill="#7c2d12"/>
  <path d="M100 175 Q 110 195, 115 205 L 125 205 Q 120 190, 110 180 Z" fill="#9a3412"/>

  <!-- Trunk -->
  <path d="M95 100 C 90 130, 95 160, 85 195 L 155 195 C 145 160, 150 130, 145 100 Z" fill="url(#trunk)"/>
  <path d="M115 100 C 112 130, 118 160, 115 195 L 125 195 C 122 160, 128 130, 125 100 Z" fill="#65a30d" opacity="0.1"/> <!-- bark texture hint -->
  
  <!-- Tree Branches -->
  <path d="M105 110 Q 75 90, 50 75 L 60 65 Q 85 80, 115 100 Z" fill="#7c2d12"/>
  <path d="M135 115 Q 165 95, 190 80 L 180 70 Q 155 85, 125 105 Z" fill="#7c2d12"/>
  <path d="M120 100 Q 120 60, 130 50 L 140 55 Q 130 65, 130 100 Z" fill="#7c2d12"/>

  <!-- Foliage / Canopy (Layered for depth) -->
  <!-- Back Canopy Layer -->
  <circle cx="80" cy="90" r="40" fill="#047857"/>
  <circle cx="160" cy="90" r="40" fill="#047857"/>
  <circle cx="120" cy="65" r="45" fill="#065f46"/>

  <!-- Mid Canopy Layer -->
  <circle cx="70" cy="95" r="35" fill="url(#canopy1)"/>
  <circle cx="170" cy="95" r="35" fill="url(#canopy1)"/>
  <circle cx="120" cy="75" r="40" fill="url(#canopy2)"/>

  <!-- Front Canopy Highlights / Puffs -->
  <circle cx="95" cy="70" r="30" fill="#34d399"/>
  <circle cx="145" cy="70" r="30" fill="#34d399"/>
  <circle cx="120" cy="50" r="28" fill="#6ee7b7"/>
  <circle cx="65" cy="115" r="25" fill="#059669"/>
  <circle cx="175" cy="115" r="25" fill="#059669"/>

  <!-- Hanging Lanterns (Action/Atmosphere props) -->
  <!-- Lantern 1 -->
  <line x1="75" y1="85" x2="75" y2="115" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="75" cy="115" r="16" fill="url(#lanternGlow)" filter="url(#glow)"/>
  <path d="M68 110 Q 75 105, 82 110 L 80 122 Q 75 125, 70 122 Z" fill="#ef4444"/>
  <path d="M67 110 L 83 110" stroke="#fbbf24" stroke-width="2"/>
  <path d="M70 122 L 80 122" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="75" cy="125" r="1.5" fill="#fbbf24"/>

  <!-- Lantern 2 -->
  <line x1="165" y1="85" x2="165" y2="125" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="165" cy="125" r="16" fill="url(#lanternGlow)" filter="url(#glow)"/>
  <path d="M158 120 Q 165 115, 172 120 L 170 132 Q 165 135, 160 132 Z" fill="#ef4444"/>
  <path d="M157 120 L 173 120" stroke="#fbbf24" stroke-width="2"/>
  <path d="M160 132 L 170 132" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="165" cy="135" r="1.5" fill="#fbbf24"/>

  <!-- Foreground Ground Props -->
  <!-- Cute little stone lantern or rock on the ground -->
  <path d="M85 195 Q 92 185, 100 195 Z" fill="#64748b"/>
  <circle cx="155" cy="198" r="4" fill="#64748b"/>
  <circle cx="162" cy="196" r="3" fill="#475569"/>

  <!-- Fallen Leaves / Petals -->
  <path d="M100 205 Q 105 203, 108 207 Q 103 209, 100 205 Z" fill="#fbbf24" transform="rotate(15 100 205)"/>
  <path d="M140 202 Q 146 200, 148 204 Q 143 206, 140 202 Z" fill="#f43f5e" transform="rotate(-30 140 202)"/>
  <path d="M75 198 Q 78 196, 82 199 Q 78 202, 75 198 Z" fill="#34d399" transform="rotate(45 75 198)"/>

  <!-- Floating Fireflies / Magic Sparks -->
  <circle cx="95" cy="140" r="2.5" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="145" cy="145" r="2" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="110" cy="120" r="1.5" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="135" cy="160" r="2" fill="#38bdf8" filter="url(#glow)"/>
</svg>