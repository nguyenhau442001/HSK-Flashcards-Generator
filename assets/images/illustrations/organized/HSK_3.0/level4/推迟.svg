<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="desk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light / Environment -->
  <circle cx="120" cy="120" r="90" fill="url(#desk-glow)"/>
  
  <!-- Wall / Office Background Details -->
  <path d="M30 60 H210" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 8"/>
  <rect x="40" y="45" width="24" height="32" rx="4" fill="#334155" opacity="0.5"/>
  <rect x="176" y="45" width="24" height="20" rx="4" fill="#334155" opacity="0.3"/>

  <!-- Desk Surface -->
  <path d="M20 185 L220 185 L200 215 L40 215 Z" fill="#0f172a" opacity="0.6"/>
  <rect x="20" y="180" width="200" height="6" rx="3" fill="#475569"/>

  <!-- Coffee Mug (Prop) -->
  <g transform="translate(45, 140)">
    <rect x="0" y="5" width="18" height="22" rx="3" fill="#cbd5e1" filter="url(#shadow)"/>
    <path d="M18 10 H22 C24 10 24 18 22 18 H18" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <path d="M5 2 L7 -2 M9 2 L11 -2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Laptop / Meeting Context (Background Element) -->
  <g transform="translate(145, 125)">
    <!-- Base -->
    <path d="M-15 25 L45 25 L55 33 L-25 33 Z" fill="#475569"/>
    <!-- Screen -->
    <rect x="-15" y="-5" width="55" height="32" rx="3" fill="#334155" />
    <rect x="-11" y="-1" width="47" height="24" rx="2" fill="#1e293b" />
    <!-- Video call abstract shapes -->
    <circle. x="2" y="8" r="5" fill="#64748b"/>
    <rect x="12" y="5" width="16" height="6" rx="2" fill="#3b82f6" opacity="0.7"/>
    <rect x="12" y="14" width="12" height="4" rx="1" fill="#64748b" opacity="0.7"/>
  </g>

  <!-- MAIN SUBJECT: The Calendar & Clock (Representing 'Tuìchí' - Delay/Postpone) -->
  <g transform="translate(70, 65)" filter="url(#shadow)">
    <!-- Calendar Backplate / Shadow -->
    <rect x="12" y="12" width="80" height="90" rx="10" fill="#0f172a" opacity="0.5"/>

    <!-- Calendar Body -->
    <rect x="5" y="5" width="80" height="90" rx="10" fill="#f8fafc"/>
    
    <!-- Calendar Header (Red) -->
    <path d="M 5 15 Q 5 5 15 5 L 75 5 Q 85 5 85 15 L 85 30 L 5 30 Z" fill="#ef4444"/>
    
    <!-- Binding Rings -->
    <rect x="22" y="1" width="6" height="8" rx="3" fill="#cbd5e1"/>
    <rect x="62" y="1" width="6" height="8" rx="3" fill="#cbd5e1"/>

    <!-- Calendar Grid / Days -->
    <rect x="15" y="42" width="12" height="10" rx="2" fill="#e2e8f0"/>
    <rect x="34" y="42" width="12" height="10" rx="2" fill="#e2e8f0"/>
    <rect x="53" y="42" width="12" height="10" rx="2" fill="#e2e8f0"/>
    
    <rect x="15" y="58" width="12" height="10" rx="2" fill="#e2e8f0"/>
    <!-- The Rescheduled/Moved Date cell -->
    <rect x="32" y="56" width="16" height="14" rx="3" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
    <rect x="53" y="58" width="12" height="10" rx="2" fill="#e2e8f0"/>

    <rect x="15" y="74" width="12" height="10" rx="2" fill="#e2e8f0"/>
    <rect x="34" y="74" width="12" height="10" rx="2" fill="#e2e8f0"/>
    <rect x="53" y="74" width="12" height="10" rx="2" fill="#e2e8f0"/>
  </g>

  <!-- ACTION & MOTION: The Clock Overlay & Rewind/Push Arrow -->
  <g transform="translate(125, 95)" filter="url(#shadow)">
    <!-- Clock Background -->
    <circle cx="35" cy="35" r="32" fill="#1e293b" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="35" cy="35" r="27" fill="#0f172a"/>
    
    <!-- Clock ticks -->
    <line x1="35" y1="11" x2="35" y2="14" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="56" x2="35" y2="59" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="11" y1="35" x2="14" y2="35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="56" y1="35" x2="59" y2="35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Clock Hands (Pointing backwards/delaying) -->
    <line x1="35" y1="35" x2="24" y2="28" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="35" x2="45" y2="45" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="35" cy="35" r="4" fill="#3b82f6"/>
  </g>

  <!-- Dynamic Postpone / Backward Arrow Graphic -->
  <g transform="translate(60, 115)">
    <!-- Curved Action Arrow indicating pushing back in time -->
    <path d="M 45 45 C 10 45 -5 15 15 -5" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 4" filter="url(#shadow)"/>
    <!-- Arrow Head -->
    <path d="M 7 -12 L 15 -5 L 5 3" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Sparkles / Action Accents -->
  <g transform="translate(35, 75)">
    <path d="M0 0 L3 3 L0 6 L-3 3 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(180, 85)">
    <path d="M0 0 L4 4 L0 8 L-4 4 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(130, 165)">
    <circle cx="0" cy="0" r="3" fill="#ec4899" opacity="0.8"/>
  </g>

</svg>