<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Table Top Highlight -->
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cloth Gradient (Vibrant Action Teal/Mint) -->
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sparkle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Background Window/Light Effect -->
  <path d="M 60 20 L 180 20 L 210 100 L 30 100 Z" fill="#38bdf8" opacity="0.03" />

  <!-- Scene Elements: Plant in background corner -->
  <g transform="translate(195, 80)" opacity="0.9">
    <!-- Pot -->
    <path d="M -12 25 L 12 25 L 8 45 L -8 45 Z" fill="#cbd5e1" />
    <ellipse cx="0" cy="25" rx="12" ry="4" fill="#94a3b8" />
    <!-- Leaves -->
    <path d="M 0 25 C -5 10, -25 5, -20 -5 C -15 -15, -5 -5, 0 25 Z" fill="#10b981" />
    <path d="M 0 25 C 5 5, 25 10, 20 -2 C 15 -12, 5 -2, 0 25 Z" fill="#059669" />
    <path d="M 0 25 C -2 5, 5 -15, 0 -25 C -5 -15, 2 5, 0 25 Z" fill="#34d399" />
  </g>

  <!-- Cup / Object on Table -->
  <g transform="translate(170, 105)" filter="url(#softShadow)">
    <ellipse cx="0" cy="0" rx="12" ry="4" fill="#f1f5f9" />
    <path d="M -12 0 L -9 25 C -9 27, -7 28, -5 28 L 5 28 C 7 28, 9 27, 9 25 L 12 0 Z" fill="#e2e8f0" />
    <path d="M 11 5 C 18 5, 18 20, 11 20" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Main Table Surface (Perspective) -->
  <!-- Table Front/Side thickness -->
  <path d="M 15 150 L 225 150 L 225 190 C 225 200, 215 210, 205 210 L 35 210 C 25 210, 15 200, 15 190 Z" fill="url(#tableGrad)" />
  <!-- Table Top Surface -->
  <path d="M 15 90 L 225 90 L 225 150 L 15 150 Z" fill="url(#tableTop)" />

  <!-- Wood Grain Details on Table -->
  <path d="M 30 110 Q 90 125 160 115 T 210 130" stroke="#b45309" stroke-width="2" fill="none" opacity="0.4" />
  <path d="M 40 135 Q 100 120 170 140 T 200 125" stroke="#92400e" stroke-width="1.5" fill="none" opacity="0.3" />

  <!-- Sparkling Clean/Polished Area (Contrast against matte table) -->
  <path d="M 70 110 L 130 110 L 145 135 L 55 135 Z" fill="#fbbf24" opacity="0.15" />

  <!-- Action: Hand with Cleaning Cloth wiping the table -->
  <g filter="url(#softShadow)">
    <!-- Motion Trails / Swipe Effect -->
    <path d="M 60 115 C 80 100, 110 100, 130 115" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" filter="url(#glow)" />
    <path d="M 70 125 C 90 112, 120 112, 140 125" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- The Cleaning Cloth (Deformed dynamically during wipe) -->
    <g transform="translate(100, 120) rotate(-10)">
      <!-- Cloth Drop Shadow -->
      <path d="M -30 0 C -10 -20, 30 -15, 35 15 C 20 25, -20 25, -30 0 Z" fill="#047857" opacity="0.4" />
      <!-- Cloth Main Body -->
      <path d="M -28 -5 C -8 -22, 32 -17, 37 13 C 22 23, -18 23, -28 -5 Z" fill="url(#clothGrad)" />
      <!-- Cloth Folds / Texture Lines -->
      <path d="M -15 -10 C -5 0, 10 -5, 20 5" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M -20 5 C -5 12, 10 8, 25 18" stroke="#047857" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <!-- Hand holding the cloth -->
    <g transform="translate(125, 110) rotate(-15)">
      <!-- Arm / Cuff -->
      <path d="M 30 20 L 70 35 L 60 55 L 20 40 Z" fill="#38bdf8" />
      <!-- Sleeve fold -->
      <path d="M 25 30 L 65 45" stroke="#0ea5e9" stroke-width="3" />

      <!-- Palm & Fingers wrapping around cloth -->
      <path d="M -5 10 C 5 5, 25 10, 35 25 C 40 32, 30 40, 20 35 C 10 30, -5 20, -5 10 Z" fill="#fbcfe8" />
      <!-- Thumb -->
      <path d="M 10 5 C 0 -2, -10 5, -5 15 C 0 20, 10 15, 10 5 Z" fill="#f472b6" />
      <!-- Finger joints details -->
      <path d="M 20 18 C 25 22, 25 28, 20 32" stroke="#db2777" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
      <path d="M 27 22 C 31 25, 31 30, 27 34" stroke="#db2777" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
    </g>
  </g>

  <!-- Sparkles / Cleaning Success Indicators -->
  <g transform="translate(85, 95)" filter="url(#glow)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(135, 105) scale(0.6)" filter="url(#glow)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fef08a" />
  </g>
  <g transform="translate(60, 125) scale(0.8)" filter="url(#glow)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24" />
  </g>

  <!-- Bubbles / Dust being wiped away -->
  <circle cx="95" cy="115" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="105" cy="105" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="80" cy="120" r="1.5" fill="#38bdf8" opacity="0.9" />

  <!-- Foreground/Atmospheric overlay for depth -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15" />
</svg>