<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Scrub Uniform Gradient -->
    <linearGradient id="scrubsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Hospital Room Environment & Backwall Details -->
  <g id="environment">
    <!-- Window with night city glow -->
    <rect x="25" y="25" width="55" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="29" y="29" width="47" height="67" rx="4" fill="url(#windowGlow)"/>
    <path d="M29 62 H76 M52 29 V96" stroke="#334155" stroke-width="2"/>
    <!-- Stars outside window -->
    <circle cx="38" cy="42" r="1" fill="#f8fafc" opacity="0.8"/>
    <circle cx="65" cy="50" r="1.5" fill="#f8fafc" opacity="0.6"/>
    <circle cx="45" cy="78" r="1" fill="#f8fafc" opacity="0.5"/>

    <!-- Wall Shelf with Medical Supplies -->
    <rect x="150" y="45" width="65" height="5" rx="2" fill="#475569"/>
    <!-- Medicine Bottle 1 -->
    <rect x="160" y="28" width="12" height="17" rx="3" fill="#f43f5e" opacity="0.9"/>
    <rect x="163" y="24" width="6" height="4" rx="1" fill="#e2e8f0"/>
    <!-- Medicine Bottle 2 -->
    <rect x="180" y="32" width="16" height="13" rx="3" fill="#38bdf8" opacity="0.9"/>
    <rect x="185" y="29" width="6" height="3" rx="1" fill="#e2e8f0"/>

    <!-- Ambient Warm Wall Light (Exam Lamp) -->
    <circle cx="120" cy="30" r="50" fill="url(#lampGlow)" />
  </g>

  <!-- Foreground Medical Cart / Counter -->
  <g id="medical-cart" filter="url(#softShadow)">
    <!-- Cart Body -->
    <rect x="145" y="130" width="70" height="85" rx="8" fill="#334155"/>
    <rect x="150" y="138" width="60" height="22" rx="4" fill="#1e293b"/>
    <rect x="150" y="166" width="60" height="22" rx="4" fill="#1e293b"/>
    <rect x="150" y="194" width="60" height="15" rx="4" fill="#1e293b"/>
    <!-- Cart Handles & Details -->
    <circle cx="157" cy="149" r="2" fill="#94a3b8"/>
    <circle cx="157" cy="177" r="2" fill="#94a3b8"/>
    <path d="M 215 140 H 222 C 224 140 225 141 225 143 V 190 C 225 192 224 193 222 193 H 215" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

    <!-- Clipboard on Cart Top -->
    <g transform="translate(160, 115) rotate(-5)">
      <rect width="25" height="32" rx="3" fill="#f1f5f9"/>
      <rect x="9" y="-3" width="7" height="5" rx="1" fill="#94a3b8"/>
      <!-- Chart lines -->
      <line x1="5" y1="8" x2="20" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="14" x2="16" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="20" x2="18" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <circle cx="7" cy="26" r="2" fill="#10b981"/>
    </g>
    
    <!-- Stethoscope resting on cart -->
    <path d="M 180 125 C 190 120 205 130 195 145 C 190 152 180 150 185 140" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="195" cy="145" r="5" fill="#cbd5e1" stroke="#0ea5e9" stroke-width="2"/>
  </g>

  <!-- Main Subject: The Nurse (护士) -->
  <g id="nurse-character" filter="url(#softShadow)">
    <!-- Nurse Shadow on Floor -->
    <ellipse cx="95" cy="225" rx="45" ry="8" fill="#020617" opacity="0.4"/>

    <!-- Body & Scrubs Torso -->
    <path d="M 75 140 L 115 140 C 124 140 130 148 128 157 L 120 215 C 119 220 115 224 110 224 H 80 C 75 224 71 220 70 215 L 62 157 C 60 148 66 140 75 140 Z" fill="url(#scrubsGrad)"/>

    <!-- Scrub V-Neck & Collar Details -->
    <path d="M 95 140 L 82 165 H 108 Z" fill="#f8fafc"/>
    <!-- Medical ID Badge / Name Tag -->
    <rect x="98" y="160" width="14" height="10" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="105" cy="163" r="1.5" fill="#f43f5e"/>
    <line x1="101" y1="167" x2="109" y2="167" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms & Hands -->
    <!-- Left Arm (Holding Medicine Tray or Clipboard) -->
    <path d="M 68 145 L 48 165 C 45 168 45 173 48 175 L 55 180 C 58 182 62 180 65 177 L 76 158" fill="url(#scrubsGrad)"/>
    <!-- Hand -->
    <circle cx="48" cy="177" r="6" fill="#fbcfe8"/>

    <!-- Right Arm (Friendly waving / gesturing towards patient) -->
    <path d="M 122 145 L 140 162 C 143 165 143 170 140 173 L 132 180" fill="url(#scrubsGrad)"/>
    <circle cx="135" cy="182" r="6" fill="#fbcfe8"/>

    <!-- Neck -->
    <rect x="85" y="125" width="20" height="20" rx="6" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <circle cx="95" cy="105" r="28" fill="#fbcfe8"/>

    <!-- Hair (Friendly styling under nurse cap) -->
    <path d="M 67 105 C 67 90 75 80 95 80 C 115 80 123 90 123 105 C 123 110 122 115 120 120 C 115 110 105 105 95 105 C 85 105 75 110 70 120 C 68 115 67 110 67 105 Z" fill="#334155"/>

    <!-- Friendly Facial Expression -->
    <!-- Eyes (Happy closed arcs) -->
    <path d="M 82 102 Q 87 97 92 102" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 98 102 Q 103 97 108 102" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Warm Smiling Mouth -->
    <path d="M 89 113 Q 95 119 101 113" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="80" cy="108" r="4" fill="#fda4af" opacity="0.6"/>
    <circle cx="110" cy="108" r="4" fill="#fda4af" opacity="0.6"/>

    <!-- Nurse Cap (护士帽) - Iconic Symbol without text -->
    <g transform="translate(95, 74)">
      <!-- Base Cap Shape -->
      <path d="M -22 10 C -22 2 -12 -3 0 -5 C 12 -3 22 2 22 10 C 15 13 -15 13 -22 10 Z" fill="#ffffff" filter="url(#softShadow)"/>
      <rect x="-16" y="4" width="32" height="8" rx="2" fill="#f8fafc"/>
      <!-- Red Cross Emblem on Cap -->
      <rect x="-4" y="2" width="8" height="6" rx="1" fill="#ef4444"/>
      <rect x="-2" y="0" width="4" height="10" rx="1" fill="#ef4444"/>
    </g>
  </g>

  <!-- Floating Medical Accents & Sparkles (Action/Vividness) -->
  <g id="sparkles">
    <!-- Medical Cross Floating (Stylized Iconography for Learning Context) -->
    <g transform="translate(45, 65) scale(0.7)">
      <rect x="-3" y="-10" width="6" height="20" rx="2" fill="#10b981" opacity="0.8"/>
      <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#10b981" opacity="0.8"/>
    </g>
    <!-- Soft Glowing Dots -->
    <circle cx="135" cy="90" r="3" fill="#38bdf8" opacity="0.7"/>
    <circle cx="145" cy="80" r="1.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="35" cy="140" r="2" fill="#10b981" opacity="0.8"/>
  </g>
</svg>