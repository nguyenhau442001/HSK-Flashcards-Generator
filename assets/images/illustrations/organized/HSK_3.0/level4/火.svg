<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Kitchen Environment & Walls -->
  <rect x="20" y="30" width="200" height="130" rx="8" fill="#1e293b"/>
  <!-- Kitchen Tiles Line -->
  <line x1="20" y1="90" x2="220" y2="90" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="30" x2="90" y2="90" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="30" x2="160" y2="90" stroke="#334155" stroke-width="2"/>

  <!-- Kitchen Countertop -->
  <rect x="20" y="160" width="200" height="50" rx="4" fill="#334155"/>
  <rect x="15" y="150" width="210" height="14" rx="4" fill="#475569"/>

  <!-- Ambient Glow from Fire -->
  <circle cx="120" cy="140" r="60" fill="#f59e0b" opacity="0.15" filter="blur(8px)"/>

  <!-- Kitchen Props: Spice Jar / Container -->
  <rect x="45" y="125" width="20" height="35" rx="4" fill="#64748b"/>
  <rect x="43" y="120" width="24" height="7" rx="2" fill="#94a3b8"/>
  <!-- Kitchen Props: Cutting Board -->
  <path d="M 190 110 C 195 110 195 150 190 155 L 180 155 C 175 150 175 110 180 110 Z" fill="#92400e" opacity="0.8"/>
  <circle cx="185" cy="118" r="3" fill="#451a03"/>

  <!-- Cooking Pan / Skillet -->
  <!-- Pan handle -->
  <rect x="40" y="145" width="45" height="8" rx="4" fill="#475569"/>
  <!-- Pan body -->
  <ellipse cx="95" cy="150" rx="35" ry="12" fill="#64748b"/>
  <ellipse cx="95" cy="147" rx="32" ry="9" fill="#1e293b"/>

  <!-- LỖI (HUO/FIRE) - Vibrant Action Flames erupting from pan -->
  <!-- Smoke / Heat Waves -->
  <path d="M 80 120 Q 75 100 85 90 Q 95 80 90 65" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 110 118 Q 115 95 105 85 Q 95 75 105 55" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Back Flames (Orange/Red) -->
  <path d="M 75 145 C 70 120, 90 100, 85 75 C 100 95, 105 110, 100 145 Z" fill="#ea580c"/>
  <path d="M 115 145 C 120 115, 100 95, 115 65 C 125 90, 135 110, 125 145 Z" fill="#ea580c"/>

  <!-- Main Flames (Golden/Amber) -->
  <path d="M 85 145 C 80 110, 105 90, 95 60 C 110 85, 115 110, 105 145 Z" fill="#f59e0b"/>
  <path d="M 100 145 C 95 120, 115 90, 110 70 C 120 90, 125 120, 115 145 Z" fill="#fbbf24"/>

  <!-- Foreground Sparks & Embers -->
  <circle cx="85" cy="70" r="3.5" fill="#fef08a"/>
  <circle cx="115" cy="55" r="2.5" fill="#fef08a"/>
  <circle cx="130" cy="85" r="3" fill="#fef08a"/>
  <circle cx="70" cy="95" r="2" fill="#fef08a"/>
  <circle cx="100" cy="40" r="2" fill="#fef08a"/>
  <circle cx="135" cy="115" r="1.5" fill="#f59e0b"/>
  <circle cx="75" cy="125" r="2" fill="#fb923c"/>

  <!-- Dynamic Flying Spark / Ember Trails -->
  <path d="M 95 60 Q 90 50 100 40" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 110 70 Q 120 60 130 50" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Action Details: Over-boiling pot contents -->
  <circle cx="95" cy="143" r="6" fill="#ef4444"/>
  <circle cx="88" cy="146" r="4" fill="#f97316"/>
  <circle cx="102" cy="145" r="5" fill="#f97316"/>

  <!-- Scene Framing / Vignette Overlay for depth -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
</svg>