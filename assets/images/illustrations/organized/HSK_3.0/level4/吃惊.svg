<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light / Shock Effect Gradient -->
    <radialGradient id="shock-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Phone Screen Glow -->
    <linearGradient id="phone-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background with rounded container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Room Interior Details -->
  <!-- Wallpaper / Wall Lines -->
  <path d="M 0,160 L 240,160" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  
  <!-- Bookshelf / Prop in Background -->
  <rect x="180" y="70" width="40" height="90" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="190" y="90" width="20" height="8" rx="2" fill="#64748b" opacity="0.5"/>
  <rect x="185" y="120" width="30" height="8" rx="2" fill="#64748b" opacity="0.5"/>
  <rect x="195" y="145" width="15" height="8" rx="2" fill="#64748b" opacity="0.5"/>

  <!-- Dramatic Shock Radial Glow behind the character -->
  <circle cx="120" cy="115" r="90" fill="url(#shock-glow)" />

  <!-- Comic Action Shocklines radiating out -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="120" y1="55" x2="120" y2="35" />
    <line x1="75" y1="75" x2="60" y2="60" />
    <line x1="165" y1="75" x2="180" y2="60" />
    <line x1="55" y1="120" x2="35" y2="120" />
    <line x1="185" y1="120" x2="205" y2="120" />
  </g>

  <!-- Falling / Dropped Items (Context of being startled) -->
  <!-- Coffee Mug -->
  <g transform="translate(185, 155) rotate(25)" filter="url(#shadow)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#ec4899" />
    <path d="M 16,4 C 20,4 21,10 16,12" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Splashing Coffee Drops -->
    <circle cx="-10" cy="-5" r="2" fill="#78350f" />
    <circle cx="-5" cy="-12" r="3" fill="#78350f" />
    <path d="M-2,2 C-6,-2 -4,-8 0,-6" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER: Surprised/Shocked Person (Kinh ngạc, giật mình) -->
  <g id="surprised-character" filter="url(#shadow)">
    
    <!-- Torso & Shoulders -->
    <path d="M 75,200 C 75,170 95,160 120,160 C 145,160 165,170 165,200 Z" fill="url(#shirt-grad)" />
    <!-- Collar detail -->
    <path d="M 100,160 L 120,178 L 140,160" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Neck -->
    <rect x="108" y="135" width="24" height="30" rx="6" fill="#fcd34d" />

    <!-- Head (Leaned slightly back in shock) -->
    <g transform="translate(120, 110)">
      
      <!-- Hair Base (Spiky/Disheveled from shock) -->
      <path d="M -30,-20 C -45,-30 -40,-50 -20,-55 C -5,-65 15,-60 25,-45 C 40,-50 50,-30 40,-15 C 48,-5 42,10 30,15 C 30,25 25,35 10,38 C -10,40 -25,30 -28,15 C -40,10 -42,-5 -30,-20 Z" fill="#1e293b" />
      
      <!-- Face Base -->
      <rect x="-26" y="-22" width="52" height="60" rx="26" fill="#fef08a" />
      
      <!-- Ears -->
      <circle cx="-27" cy="5" r="6" fill="#fde047" />
      <circle cx="27" cy="5" r="6" fill="#fde047" />

      <!-- Eyebrows (Arching way up high in utter shock) -->
      <path d="M -20,-12 C -15,-20 -5,-20 -2,-18" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <path d="M 20,-12 C 15,-20 5,-20 2,-18" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round" />

      <!-- Wide Shocked Eyes (Tiny pupils, massive whites) -->
      <g>
        <!-- Left Eye -->
        <circle cx="-11" cy="-2" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
        <circle cx="-11" cy="-2" r="3.5" fill="#0f172a" />
        <circle cx="-9.5" cy="-4" r="1.5" fill="#ffffff" /> <!-- highlight -->
        
        <!-- Right Eye -->
        <circle cx="11" cy="-2" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
        <circle cx="11" cy="-2" r="3.5" fill="#0f172a" />
        <circle cx="12.5" cy="-4" r="1.5" fill="#ffffff" /> <!-- highlight -->
      </g>

      <!-- Sweat Drop (Classic anime reaction trope for shock/surprise) -->
      <path d="M 28,-18 C 28,-24 36,-24 36,-18 C 36,-13 28,-10 28,-18 Z" fill="#38bdf8" opacity="0.9" />

      <!-- Open "O" Shaped Mouth (Expressing loud gasp/shock) -->
      <ellipse cx="0" cy="20" rx="8" ry="12" fill="#0f172a" />
      <!-- Tongue inside mouth -->
      <path d="M -5,26 C -5,23 5,23 5,26 C 5,29 -5,29 -5,26 Z" fill="#f43f5e" />
    </g>

    <!-- Arms Flailing in Surprise -->
    <!-- Left Arm (bent up, palm out) -->
    <path d="M 75,175 C 50,175 40,150 45,130" fill="none" stroke="url(#shirt-grad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="45" cy="125" r="7" fill="#fcd34d" /> <!-- Left Hand -->

    <!-- Right Arm (reaching out, holding dropped phone) -->
    <path d="M 165,175 C 190,175 205,150 200,130" fill="none" stroke="url(#shirt-grad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="202" cy="125" r="7" fill="#fcd34d" /> <!-- Right Hand -->
  </g>

  <!-- Dropped Smartphone (Source of the shocking news!) -->
  <g transform="translate(130, 185) rotate(-35)" filter="url(#shadow)">
    <rect x="-12" y="-22" width="24" height="44" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <rect x="-9" y="-17" width="18" height="34" rx="2" fill="url(#phone-glow)" />
    <!-- Alert exclamation on phone screen -->
    <path d="M 0,-6 L 0,3 M 0,7 L 0,9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Impact / Shock Waves around the character -->
  <path d="M 50,90 C 45,100 45,110 50,120" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M 190,90 C 195,100 195,110 190,120" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
</svg>