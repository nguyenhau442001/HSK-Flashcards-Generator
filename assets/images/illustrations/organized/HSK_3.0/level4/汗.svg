<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Sweat Drop Gradient -->
    <linearGradient id="sweatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Gym/Workout Vibe) -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" />
    <circle cx="120" cy="120" r="70" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M40 120 L200 120" stroke="#94a3b8" stroke-width="1" />
    <path d="M120 40 L120 200" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Ambient Gym Lights / Speed Lines -->
  <path d="M70 50 L90 80" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M170 50 L150 80" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <circle cx="190" cy="90" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="50" cy="100" r="3" fill="#38bdf8" opacity="0.5" />

  <!-- Dumbbell Handle in background (Context Prop) -->
  <g opacity="0.3" transform="translate(120, 200) rotate(-15)">
    <rect x="-50" y="-6" width="100" height="12" rx="6" fill="#64748b" />
    <circle cx="-50" cy="0" r="14" fill="#475569" />
    <circle cx="50" cy="0" r="14" fill="#475569" />
  </g>

  <!-- Main Character: Head and Shoulders (Exertion Pose) -->
  <!-- Shoulders & Athletic Wear -->
  <path d="M 60 215 C 60 175, 90 160, 120 160 C 150 160, 180 175, 180 215 Z" fill="#0284c7" />
  <path d="M 85 190 C 85 170, 105 160, 120 160 C 135 160, 155 170, 155 190" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  
  <!-- Head Base -->
  <path d="M 75 110 C 75 70, 95 55, 120 55 C 145 55, 165 70, 165 110 C 165 145, 150 165, 120 165 C 90 165, 75 145, 75 110 Z" fill="url(#skinGrad)" />

  <!-- Ears -->
  <circle cx="72" cy="112" r="8" fill="#fed7aa" />
  <circle cx="168" cy="112" r="8" fill="#fed7aa" />

  <!-- Hair (Messy/Dynamic Workout Hair) -->
  <path d="M 75 105 C 70 80, 85 60, 110 52 C 120 48, 135 48, 145 55 C 160 55, 172 75, 168 100 C 162 90, 155 75, 135 68 C 115 62, 90 75, 80 95 Z" fill="#1e293b" />
  <!-- Dynamic hair strands flying -->
  <path d="M 145 53 C 155 45, 175 48, 182 60" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
  <path d="M 130 50 C 135 38, 155 35, 165 42" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

  <!-- Cheeks (Flushed/Exerted) -->
  <circle cx="92" cy="125" r="10" fill="#f43f5e" opacity="0.3" filter="url(#softGlow)" />
  <circle cx="148" cy="125" r="10" fill="#f43f5e" opacity="0.3" filter="url(#softGlow)" />

  <!-- Eyes (Determined/Tired Straining Expression) -->
  <g stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- Left Eye (Arc down for intensity) -->
    <path d="M 90 102 Q 100 94 110 102" />
    <!-- Right Eye -->
    <path d="M 130 102 Q 140 94 150 102" />
  </g>

  <!-- Eyebrows (Angled Downwards for Effort) -->
  <path d="M 88 90 L 112 95" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <path d="M 152 90 L 128 95" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M 120 108 L 116 122 Q 120 125 124 122 Z" fill="#fdba74" />

  <!-- Mouth (Panting/Exhaling) -->
  <path d="M 105 136 C 105 130, 135 130, 135 136 C 135 148, 105 148, 105 136 Z" fill="#881337" />
  <!-- Tongue -->
  <path d="M 112 142 C 112 138, 128 138, 128 142 C 128 146, 112 146, 112 142 Z" fill="#f43f5e" />

  <!-- Sweat Headband -->
  <path d="M 73 85 C 95 80, 145 80, 167 85 L 169 98 C 145 93, 95 93, 71 98 Z" fill="#f59e0b" />
  <path d="M 72 91 C 95 86, 145 86, 168 91" fill="none" stroke="#d97706" stroke-width="2" />

  <!-- ========================================== -->
  <!-- PRIMARY FOCUS: MỒ HÔI (SWEAT DROPS & SPLASHES) -->
  <!-- ========================================== -->

  <!-- Glowing Aura behind major sweat drops for emphasis -->
  <circle cx="120" cy="45" r="25" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="65" cy="115" r="20" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="175" cy="135" r="20" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />

  <!-- Big Forehead Sweat Drop (Centerpiece) -->
  <g filter="url(#glow)">
    <path d="M 120 30 C 120 30, 108 52, 108 62 C 108 68, 113 73, 120 73 C 127 73, 132 68, 132 62 C 132 52, 120 30, 120 30 Z" fill="url(#sweatGrad)" />
    <!-- Highlight on drop -->
    <path d="M 113 58 C 113 58, 116 50, 118 44" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Sweat Streaming Down Left Temple -->
  <path d="M 88 88 Q 83 105, 85 120" fill="none" stroke="url(#sweatGrad)" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="85" cy="124" r="3.5" fill="#38bdf8" />
  <path d="M 83 95 L 86 98" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Sweat Streaming Down Right Temple -->
  <path d="M 152 88 Q 157 105, 155 125" fill="none" stroke="url(#sweatGrad)" stroke-width="5" stroke-linecap="round" />
  <circle cx="155" cy="130" r="4" fill="#38bdf8" />
  <path d="M 154 100 L 157 104" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Flying Sweat Drop 1 (Top Left Action) -->
  <g transform="translate(-15, -10) rotate(-25 65 95)">
    <path d="M 65 85 C 65 85, 58 97, 58 103 C 58 107, 61 110, 65 110 C 69 110, 72 107, 72 103 C 72 97, 65 85, 65 85 Z" fill="url(#sweatGrad)" />
    <path d="M 62 100 C 62 100, 63 96, 64 93" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Flying Sweat Drop 2 (Top Right Action) -->
  <g transform="translate(15, -5) rotate(35 175 95)">
    <path d="M 175 85 C 175 85, 168 97, 168 103 C 168 107, 171 110, 175 110 C 179 110, 182 107, 182 103 C 182 97, 175 85, 175 85 Z" fill="url(#sweatGrad)" />
    <path d="M 172 100 C 172 100, 173 96, 174 93" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Jawline Sweat Drop (Right) -->
  <g transform="translate(20, 30)">
    <path d="M 140 120 C 140 120, 134 130, 134 135 C 134 138, 137 141, 140 141 C 143 141, 146 138, 146 135 C 146 130, 140 120, 140 120 Z" fill="url(#sweatGrad)" />
    <circle cx="140" cy="144" r="2" fill="#38bdf8" />
  </g>

  <!-- Tiny Splashes / Ambient Droplets around the Head -->
  <circle cx="95" cy="55" r="3" fill="#38bdf8" opacity="0.9" filter="url(#softGlow)" />
  <circle cx="148" cy="58" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="52" cy="135" r="3.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="188" cy="115" r="4" fill="#38bdf8" opacity="0.9" filter="url(#softGlow)" />
  <circle cx="178" cy="165" r="2.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="62" cy="175" r="3" fill="#38bdf8" opacity="0.8" />

  <!-- Motion/Energy Sparkles -->
  <path d="M 45 75 L 55 80 L 45 85 L 40 75 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M 195 70 L 202 75 L 195 80 L 190 70 Z" fill="#fbbf24" opacity="0.8" />

</svg>