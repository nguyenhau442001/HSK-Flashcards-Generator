<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Deep Slate Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="chalkboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#113028"/>
      <stop offset="100%" stop-color="#0a1f1a"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient light -->
  <circle cx="120" cy="120" r="100" fill="url(#neonGlow)"/>

  <!-- DETECTIVE DESK / SCENE ENVIRONMENT -->
  <!-- Wooden Desktop Surface -->
  <path d="M 0 170 Q 120 160 240 170 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 175 C 60 168, 180 168, 240 175 L 240 185 C 180 178, 60 178, 0 185 Z" fill="#1e293b" opacity="0.4"/>

  <!-- Corkboard/Chalkboard Backdrop with Frame -->
  <rect x="25" y="25" width="190" height="145" rx="6" fill="url(#frameGrad)" filter="url(#softShadow)"/>
  <rect x="31" y="31" width="178" height="133" rx="3" fill="url(#chalkboardGrad)"/>

  <!-- Chalkboard subtle texture/grid lines -->
  <line x1="31" y1="65" x2="209" y2="65" stroke="#1c4e40" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="31" y1="100" x2="209" y2="100" stroke="#1c4e40" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="31" y1="135" x2="209" y2="135" stroke="#1c4e40" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- String connections (Evidence board style) -->
  <path d="M 65 60 L 120 95 L 175 65" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.6"/>
  <path d="M 120 95 L 95 135" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.6"/>

  <!-- EVIDENCE CARDS / STICKY NOTES WITH NUMBERS (The core subject: 数字 - numbers/digits) -->
  
  <!-- Note 1: Top Left -->
  <g transform="translate(45, 45) rotate(-6)" filter="url(#softShadow)">
    <rect width="40" height="40" rx="2" fill="#fef08a"/>
    <!-- Red Pin -->
    <circle cx="20" cy="6" r="3" fill="url(#pinGrad)"/>
    <circle cx="20" cy="5" r="1" fill="#fda4af"/>
    <!-- Digit "7" in chalk style -->
    <path d="M 13 15 L 27 15 L 18 30" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Note 2: Top Right -->
  <g transform="translate(155, 42) rotate(8)" filter="url(#softShadow)">
    <rect width="40" height="40" rx="2" fill="#bae6fd"/>
    <!-- Red Pin -->
    <circle cx="20" cy="6" r="3" fill="url(#pinGrad)"/>
    <circle cx="20" cy="5" r="1" fill="#fda4af"/>
    <!-- Digit "4" in chalk style -->
    <path d="M 23 13 L 13 25 L 27 25 M 23 13 L 23 32" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Note 3: Bottom Left -->
  <g transform="translate(75, 110) rotate(-4)" filter="url(#softShadow)">
    <rect width="40" height="40" rx="2" fill="#fed7aa"/>
    <!-- Red Pin -->
    <circle cx="20" cy="6" r="3" fill="url(#pinGrad)"/>
    <!-- Digit "9" in chalk style -->
    <path d="M 22 22 C 22 15, 14 15, 14 20 C 14 25, 22 25, 22 20 L 22 30" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- MAIN CENTRAL EVIDENCE CARD (The highlighted 'number') -->
  <g transform="translate(95, 75) rotate(2)" filter="url(#softShadow)">
    <rect width="50" height="55" rx="3" fill="#ffffff"/>
    <!-- Red Pin -->
    <circle cx="25" cy="6" r="3.5" fill="url(#pinGrad)"/>
    <circle cx="24" cy="5" r="1" fill="#fda4af"/>
    <!-- Glowing/Chalk Number Sequence "8" & "5" -->
    <path d="M 20 22 C 16 22, 16 16, 20 16 C 24 16, 24 22, 20 22 C 16 22, 16 29, 20 29 C 24 29, 24 22, 20 22 Z M 32 16 L 29 22 L 34 26 L 29 30" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Decorative mini barcode at bottom of photo -->
    <rect x="10" y="44" width="30" height="6" fill="#cbd5e1" rx="1"/>
    <line x1="13" y1="44" x2="13" y2="50" stroke="#0f172a" stroke-width="1"/>
    <line x1="16" y1="44" x2="16" y2="50" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="44" x2="20" y2="50" stroke="#0f172a" stroke-width="1"/>
    <line x1="24" y1="44" x2="24" y2="50" stroke="#0f172a" stroke-width="3"/>
    <line x1="29" y1="44" x2="29" y2="50" stroke="#0f172a" stroke-width="1"/>
    <line x1="33" y1="44" x2="33" y2="50" stroke="#0f172a" stroke-width="2"/>
    <line x1="37" y1="44" x2="37" y2="50" stroke="#0f172a" stroke-width="1"/>
  </g>

  <!-- FOREGROUND PROPS ON THE DESK -->
  
  <!-- Magnifying Glass (Investigating the numbers) -->
  <g transform="translate(155, 140) rotate(-25)" filter="url(#softShadow)">
    <!-- Handle -->
    <path d="M 0 0 L -25 25" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
    <path d="M -3 3 L -22 22" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <!-- Rim -->
    <circle cx="15" cy="-15" r="22" fill="#1e293b" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Glass/Lens Reflection -->
    <circle cx="15" cy="-15" r="19" fill="#38bdf8" fill-opacity="0.25"/>
    <path d="M 1 2 C 10 -10, 20 -20, 28 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Colorful Chalks scattered on the desk -->
  <!-- Chalk 1 (Orange) -->
  <g transform="translate(55, 185) rotate(15)">
    <rect x="0" y="0" width="22" height="6" rx="3" fill="#fb923c" filter="url(#softShadow)"/>
    <ellipse cx="22" cy="3" rx="1" ry="3" fill="#fdba74"/>
  </g>

  <!-- Chalk 2 (Teal) -->
  <g transform="translate(80, 190) rotate(-10)">
    <rect x="0" y="0" width="26" height="6" rx="3" fill="#2dd4bf" filter="url(#softShadow)"/>
    <ellipse cx="26" cy="3" rx="1" ry="3" fill="#99f6e4"/>
  </g>

  <!-- Chalk 3 (Pink, broken piece) -->
  <g transform="translate(115, 188) rotate(45)">
    <rect x="0" y="0" width="12" height="5" rx="2.5" fill="#f43f5e" filter="url(#softShadow)"/>
  </g>
  <g transform="translate(125, 192) rotate(-20)">
    <rect x="0" y="0" width="8" height="5" rx="2.5" fill="#f43f5e" filter="url(#softShadow)"/>
  </g>

  <!-- Notebook / Ledger open on the side -->
  <g transform="translate(30, 160) rotate(-5)" filter="url(#softShadow)">
    <path d="M 0 10 L 35 0 L 35 35 L 0 45 Z" fill="#f8fafc"/>
    <path d="M 35 0 L 70 10 L 70 45 L 35 35 Z" fill="#e2e8f0"/>
    <!-- Spine -->
    <line x1="35" y1="0" x2="35" y2="35" stroke="#94a3b8" stroke-width="2"/>
    <!-- Mini Number rows written in the book -->
    <line x1="8" y1="18" x2="25" y2="13" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="26" x2="22" y2="21" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="16" x2="62" y2="21" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="24" x2="58" y2="29" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric Light Particles / Dust Motes -->
  <circle cx="105" cy="50" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="145" cy="115" r="1" fill="#38bdf8" opacity="0.8"/>
  <circle cx="60" cy="95" r="2" fill="#f43f5e" opacity="0.5"/>
  <circle cx="180" cy="90" r="1.5" fill="#34d399" opacity="0.6"/>
  
</svg>