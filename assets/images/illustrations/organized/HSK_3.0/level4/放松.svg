<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Plant Shadow -->
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Blanket Pattern Clip -->
    <clipPath id="blanketClip">
      <path d="M 60 145 C 80 135 110 135 130 145 L 140 190 C 140 195 135 200 130 200 L 60 200 C 55 200 50 195 50 190 Z"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting / Atmosphere -->
  <circle cx="120" cy="100" r="110" fill="url(#lampGlow)" />

  <!-- Background Interior Elements (Bookshelf / Wall art) -->
  <!-- Wall Shelf -->
  <rect x="40" y="55" width="70" height="4" rx="2" fill="#334155" />
  <!-- Book 1 -->
  <rect x="50" y="31" width="12" height="24" rx="2" fill="#38bdf8" />
  <!-- Book 2 -->
  <rect x="64" y="35" width="10" height="20" rx="2" fill="#ec4899" />
  <!-- Small Potted Plant on Shelf -->
  <path d="M 90 47 L 100 47 L 98 55 L 92 55 Z" fill="#64748b" />
  <path d="M 96 47 C 96 43 93 40 90 40 C 93 40 96 37 96 34 C 96 37 99 40 102 40 C 99 40 96 43 96 47 Z" fill="#10b981" />

  <!-- Warm Cozy Floor Lamp -->
  <path d="M 205 200 L 215 200 L 210 70 Z" fill="#334155" />
  <ellipse cx="210" cy="70" rx="15" ry="6" fill="#f59e0b" />
  <path d="M 195 70 L 225 70 L 220 50 L 200 50 Z" fill="#fbbf24" />
  <!-- Light Beam from Lamp -->
  <polygon points="210,76 240,210 180,210" fill="#fbbf24" opacity="0.08" />

  <!-- Monstera Plant in Corner -->
  <g transform="translate(15, 110)">
    <!-- Pot -->
    <path d="M 10 65 L 30 65 L 27 90 L 13 90 Z" fill="#475569" />
    <ellipse cx="20" cy="65" rx="10" ry="3" fill="#64748b" />
    <!-- Leaves -->
    <path d="M 20 65 C 10 50 0 40 -5 45 C -10 50 -5 60 5 65" fill="#10b981" />
    <path d="M 20 65 C 25 45 40 35 45 42 C 50 48 40 60 25 65" fill="#059669" />
    <path d="M 20 65 C 20 40 10 25 20 20 C 30 25 20 40 20 65" fill="#34d399" />
  </g>

  <!-- Floor / Rug Shadow -->
  <ellipse cx="110" cy="202" rx="80" ry="12" fill="#0f172a" opacity="0.6" />
  
  <!-- Cozy Round Rug -->
  <ellipse cx="110" cy="175" rx="75" ry="32" fill="#334155" opacity="0.5" />
  <ellipse cx="110" cy="175" rx="68" ry="28" fill="#1e293b" />

  <!-- MAIN SUBJECT: Comfortable Armchair & Relaxed Character -->
  <g id="armchair-and-person">
    <!-- Armchair Back -->
    <path d="M 65 80 C 65 60 115 60 115 80 L 120 160 C 120 165 115 170 110 170 L 70 170 C 65 170 60 165 60 160 Z" fill="#475569" />
    <!-- Armchair Cushion -->
    <rect x="62" y="130" width="56" height="35" rx="8" fill="#64748b" />

    <!-- Sleeping/Relaxed Cat on the Chair (Extra cozy detail) -->
    <ellipse cx="95" cy="138" rx="14" ry="10" fill="#f97316" />
    <circle cx="83" cy="136" r="7" fill="#f97316" />
    <triangle points="80,131 82,126 85,131" fill="#ea580c" />
    <triangle points="86,131 88,126 91,131" fill="#ea580c" />
    <!-- Cat tail -->
    <path d="M 107 142 C 115 145 112 135 108 138" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" />

    <!-- Character Body (Relaxed, slouching/leaning back) -->
    <!-- Head -->
    <circle cx="105" cy="95" r="14" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 91 95 C 91 85 101 80 110 83 C 117 85 119 92 119 96 C 115 94 105 92 98 96 Z" fill="#334155" />
    <!-- Closed Happy Eyes (Relaxed arc) -->
    <path d="M 98 97 Q 101 100 104 97" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 107 97 Q 110 100 113 97" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Gentle Smile -->
    <path d="M 104 102 Q 106 105 108 102" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Torso (Comfortable hoodie) -->
    <path d="M 90 110 C 90 105 120 105 125 115 L 135 145 C 135 148 130 150 125 150 L 90 150 C 85 150 80 145 85 140 Z" fill="#38bdf8" />

    <!-- Relaxed Legs stretched out on Ottoman / Floor -->
    <!-- Left Leg -->
    <path d="M 125 145 L 155 160 L 175 165" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Leg crossed -->
    <path d="M 125 145 L 150 168 L 170 173" fill="none" stroke="#0ea5e9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cozy Slippers/Feet -->
    <ellipse cx="178" cy="166" rx="7" ry="5" fill="#f43f5e" />
    <ellipse cx="173" cy="175" rx="7" ry="5" fill="#f43f5e" />

    <!-- Armchair Arms -->
    <path d="M 55 110 C 50 110 50 150 55 155 C 60 160 65 150 65 130 Z" fill="#475569" />
    <path d="M 125 110 C 130 110 130 150 125 155 C 120 160 115 150 115 130 Z" fill="#475569" />

    <!-- Cozy Blanket draped over legs -->
    <path d="M 95 130 C 115 130 145 140 160 165 L 150 190 C 130 195 100 195 90 180 Z" fill="#f59e0b" opacity="0.9" />
    <!-- Blanket Stripes for visual texture -->
    <path d="M 115 138 L 135 188" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.7" />
    <path d="M 130 142 L 150 192" stroke="#ea580c" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Side Table with Warm Mug and Book -->
  <g id="side-table">
    <!-- Table Top & Legs -->
    <ellipse cx="185" cy="140" rx="22" ry="9" fill="#94a3b8" />
    <path d="M 170 140 L 165 185" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M 200 140 L 205 185" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M 185 143 L 188 180" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Open Book on Table -->
    <path d="M 172 135 Q 185 130 198 135 L 196 142 Q 185 137 174 142 Z" fill="#f8fafc" />
    <path d="M 174 142 Q 185 137 196 142 L 195 146 Q 185 141 175 146 Z" fill="#e2e8f0" />

    <!-- Steaming Mug of Tea/Coffee -->
    <rect x="180" y="120" width="10" height="12" rx="2" fill="#ec4899" />
    <path d="M 190 123 C 193 123 193 128 190 129" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round" />
    <!-- Steam wisps representing peaceful relaxation -->
    <path d="M 183 116 C 182 112 186 110 185 106" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M 187 115 C 188 112 185 110 186 107" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Floating Peaceful Zzz's / Floating Elements to reinforce 'Relaxation' theme -->
  <g opacity="0.7">
    <text x="75" y="75" font-family="sans-serif" font-weight="bold" font-size="14" fill="#38bdf8" transform="rotate(-15 75 75)">z</text>
    <text x="85" y="62" font-family="sans-serif" font-weight="bold" font-size="18" fill="#38bdf8" transform="rotate(-10 85 62)">Z</text>
    <text x="100" y="48" font-family="sans-serif" font-weight="bold" font-size="22" fill="#38bdf8" transform="rotate(-5 100 48)">Z</text>
  </g>

  <!-- Gentle Ambient Dust/Sparkles for atmosphere -->
  <circle cx="50" cy="110" r="1.5" fill="#fbfbfe" opacity="0.4" />
  <circle cx="140" cy="80" r="2" fill="#fbfbfe" opacity="0.5" />
  <circle cx="130" cy="120" r="1" fill="#fbfbfe" opacity="0.6" />
  <circle cx="160" cy="110" r="1.5" fill="#fbfbfe" opacity="0.3" />
</svg>