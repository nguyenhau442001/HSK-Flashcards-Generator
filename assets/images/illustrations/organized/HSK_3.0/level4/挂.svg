<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Photo Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Plant Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Floor Structure -->
  <rect x="20" y="20" width="200" height="170" rx="12" fill="url(#wallGrad)"/>
  <rect x="20" y="175" width="200" height="45" rx="8" fill="url(#floorGrad)"/>

  <!-- Subtle Wall Paneling / Accent Line -->
  <line x1="20" y1="175" x2="220" y2="175" stroke="#475569" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Hanging Hook on Wall -->
  <circle cx="120" cy="50" r="3.5" fill="#94a3b8" filter="url(#shadow)"/>
  <path d="M117 50 L123 50" stroke="#64748b" stroke-width="2"/>

  <!-- Hanging Cord -->
  <path d="M120 53 L120 70" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- THE HANGING PICTURE FRAME (Core representation of 'guà' - treo) -->
  <g filter="url(#shadow)">
    <!-- Outer Golden Frame -->
    <rect x="75" y="70" width="90" height="75" rx="6" fill="url(#frameGrad)"/>
    <!-- Inner Mat / White Border -->
    <rect x="81" y="76" width="78" height="63" rx="3" fill="#f8fafc"/>
    
    <!-- Painting Content: Scenery (Sun, Hills, Trees) -->
    <rect x="85" y="80" width="70" height="55" rx="2" fill="#e0f2fe"/>
    
    <!-- Sun -->
    <circle cx="140" cy="100" r="10" fill="#fde047"/>
    
    <!-- Hills / Mountains -->
    <path d="M85 125 L110 105 L135 120 L160 100 L160 135 L85 135 Z" fill="#38bdf8" opacity="0.6"/>
    <path d="M85 130 L105 115 L125 125 L150 110 L165 120 L165 135 L85 135 Z" fill="#0ea5e9" opacity="0.8"/>
    
    <!-- Tree inside painting -->
    <path d="M100 135 L100 120 M96 125 L104 125" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="116" r="7" fill="#10b981"/>
  </g>

  <!-- Ambient / Environmental Props for Scene Context -->
  <!-- Hanging Houseplant on the right side -->
  <g filter="url(#shadow)">
    <!-- Hook & Cord -->
    <circle cx="195" cy="85" r="2.5" fill="#94a3b8"/>
    <path d="M195 87 L195 105" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Pot -->
    <path d="M185 105 L205 105 L202 120 L188 120 Z" fill="url(#potGrad)"/>
    
    <!-- Trailing Vines / Leaves -->
    <path d="M190 120 Q180 135 185 145" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 120 Q210 130 205 142" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <circle cx="183" cy="138" r="4" fill="#34d399"/>
    <circle cx="207" cy="135" r="4.5" fill="#10b981"/>
    <circle cx="186" cy="147" r="3.5" fill="#059669"/>
  </g>

  <!-- Low Wooden Credenza / Shelf below the painting -->
  <g filter="url(#shadow)">
    <rect x="50" y="170" width="140" height="8" rx="3" fill="#b45309"/>
    <rect x="65" y="178" width="8" height="20" fill="#92400e"/>
    <rect x="167" y="178" width="8" height="20" fill="#92400e"/>
  </g>

  <!-- Small objects on the shelf -->
  <!-- Lamp -->
  <path d="M75 170 L79 160 L85 160 L89 170 Z" fill="#cbd5e1" filter="url(#shadow)"/>
  <path d="M82 160 L82 153" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="82" cy="152" r="3" fill="#fbbf24"/>
  
  <!-- Stack of Books -->
  <rect x="145" y="164" width="22" height="6" rx="1" fill="#ec4899"/>
  <rect x="143" y="160" width="25" height="4" rx="1" fill="#3b82f6"/>

  <!-- Foreground Atmospheric Lighting Accent -->
  <circle cx="120" cy="90" r="60" fill="#ffffff" opacity="0.03" pointer-events="none"/>
</svg>