<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Sock 1 Gradient (Bright Accent: Teal/Mint) -->
    <linearGradient id="sock1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Sock 2 Gradient (Warm Coral/Pink) -->
    <linearGradient id="sock2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Wood Floor Gradient -->
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0f172a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="140" cy="100" r="90" fill="url(#glow)"/>

  <!-- Wooden Floor Surface / Shelf Base -->
  <rect x="0" y="160" width="240" height="80" fill="url(#floor)"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2" opacity="0.5"/>

  <!-- Background Props: Cozy Armchair Back / Cushion Outline -->
  <path d="M30 160 C30 90, 80 50, 140 50 C200 50, 210 100, 210 160" fill="#334155" opacity="0.3"/>

  <!-- Laundry Basket / Open Drawer Backdrop -->
  <g transform="translate(25, 110)">
    <!-- Basket Body -->
    <path d="M15 15 L35 75 C35 78, 38 80, 42 80 L148 80 C152 80, 155 78, 155 75 L175 15 Z" fill="#334155" opacity="0.6" filter="url(#shadow)"/>
    <path d="M10 15 C10 10, 15 8, 20 8 L170 8 C175 8, 180 10, 180 15 C180 20, 175 22, 170 22 L20 22 C15 22, 10 20, 10 15 Z" fill="#475569" opacity="0.8"/>
  </g>

  <!-- MAIN SUBJECT: A Pair of Socks (袜子 - wàzi) -->
  <!-- Sock 1: Back/Second Sock (Partially behind, angled) -->
  <g transform="translate(115, 80) rotate(-15)" filter="url(#shadow)">
    <!-- Main Sock Shape -->
    <path d="M25 0 
             C25 -10, 45 -10, 45 0 
             L45 50 
             C45 65, 30 75, 15 75 
             L-25 75 
             C-35 75, -40 65, -35 55 
             L-15 10 
             C-10 0, 0 0, 0 0 Z" 
          fill="url(#sock2)"/>
    <!-- Cuff Ribbing -->
    <path d="M24 -2 L46 -2 L46 12 L24 12 Z" fill="#ffe4e6" opacity="0.9"/>
    <path d="M27 2 L43 2" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <path d="M27 7 L43 7" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <!-- Pattern (Cute Stripes / Dots) -->
    <circle cx="5" cy="35" r="4" fill="#ffe4e6" opacity="0.8"/>
    <circle cx="-10" cy="50" r="4" fill="#ffe4e6" opacity="0.8"/>
    <!-- Heel and Toe Accents -->
    <path d="M-30 65 C-35 65, -38 60, -35 55 L-20 30 C-20 30, -30 45, -30 65 Z" fill="#be123c" opacity="0.4"/>
  </g>

  <!-- Sock 2: Front/Main Sock (Curved upright, playful pose) -->
  <g transform="translate(100, 95) rotate(10)" filter="url(#shadow)">
    <!-- Main Sock Shape -->
    <path d="M20 -10 
             C20 -20, 40 -20, 40 -10 
             L40 45 
             C40 65, 25 75, 10 75 
             L-30 75 
             C-42 75, -45 62, -38 52 
             L-15 5 
             C-10 -5, 0 -10, 20 -10 Z" 
          fill="url(#sock1)"/>
    <!-- Cuff Ribbing -->
    <path d="M19 -12 L41 -12 L41 2 L19 2 Z" fill="#e0f2fe" opacity="0.95"/>
    <path d="M22 -7 L38 -7" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 -2 L38 -2" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <!-- Pattern: Playful Stars / Hearts / Stripes -->
    <path d="M-2 25 L1 32 L8 33 L3 38 L4 45 L-2 42 L-8 45 L-7 38 L-12 33 L-5 32 Z" fill="#e0f2fe" opacity="0.7" transform="scale(0.6) translate(10, 10)"/>
    <path d="M12 40 L15 47 L22 48 L17 53 L18 60 L12 57 L6 60 L7 53 L2 48 L9 47 Z" fill="#e0f2fe" opacity="0.7" transform="scale(0.5) translate(10, 15)"/>
    <!-- Heel and Toe Accents -->
    <path d="M-35 65 C-40 65, -42 58, -38 52 L-22 28 C-22 28, -35 42, -35 65 Z" fill="#0369a1" opacity="0.35"/>
    <path d="M20 75 C30 75, 35 70, 38 65 C35 72, 25 78, 10 78 Z" fill="#0369a1" opacity="0.35"/>
  </g>

  <!-- Foreground Atmospheric Elements / Sparkles for Joyful Learning Vibe -->
  <g fill="#fbbf24">
    <circle cx="65" cy="75" r="3" opacity="0.8"/>
    <circle cx="185" cy="115" r="2" opacity="0.6"/>
    <path d="M170 65 L173 72 L180 75 L173 78 L170 85 L167 78 L160 75 L167 72 Z" opacity="0.9" transform="scale(0.5) translate(160, 60)"/>
    <path d="M50 135 L52 139 L56 140 L52 141 L50 145 L48 141 L44 140 L48 139 Z" opacity="0.7" transform="scale(0.6) translate(20, 50)"/>
  </g>
</svg>