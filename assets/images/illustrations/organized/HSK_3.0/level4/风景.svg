<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="distantMountain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    
    <linearGradient id="midMountain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="closeMountain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Viewfinder Frame Clip Path -->
    <clipPath id="viewportClip">
      <rect x="20" y="20" width="200" height="155" rx="16" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Decorative App Frame / Window Wrapper -->
  <g clip-path="url(#viewportClip)">
    <!-- Sky & Sun -->
    <rect x="20" y="20" width="200" height="155" fill="url(#skyGrad)"/>
    <circle cx="160" cy="75" r="35" fill="url(#sunGlow)"/>
    <circle cx="160" cy="75" r="18" fill="#fef08a"/>

    <!-- Distant Mountains -->
    <path d="M 10 135 L 70 70 L 140 125 L 190 85 L 240 135 Z" fill="url(#distantMountain)"/>

    <!-- Mid-ground Mountains & Pagoda Silhouette -->
    <path d="M 0 145 L 50 95 L 90 130 L 160 80 L 220 140 L 240 145 Z" fill="url(#midMountain)"/>
    
    <!-- Traditional Pagoda Architecture Details -->
    <g fill="#115e59">
      <rect x="153" y="68" width="14" height="4" rx="1"/>
      <polygon points="152,68 168,68 160,62"/>
      <rect x="155" y="73" width="10" height="5"/>
      <polygon points="153,73 167,73 160,68"/>
      <rect x="156" y="80" width="8" height="6"/>
      <polygon points="154,80 166,80 160,75"/>
    </g>

    <!-- Close Landscape / Hills & Pine Trees -->
    <path d="M -10 160 Q 60 110 120 140 T 250 130 L 250 180 L -10 180 Z" fill="url(#closeMountain)"/>

    <!-- Pine Trees (Stylized Vector) -->
    <g fill="#047857">
      <!-- Left Trees -->
      <polygon points="45,120 38,135 52,135" />
      <polygon points="45,127 35,145 55,145" />
      <rect x="43" y="145" width="4" height="8" fill="#78350f" />

      <polygon points="65,115 58,130 72,130" />
      <polygon points="65,122 55,140 75,140" />
      <rect x="63" y="140" width="4" height="10" fill="#78350f" />

      <!-- Right Trees -->
      <polygon points="195,125 188,140 202,140" />
      <polygon points="195,132 185,150 205,150" />
      <rect x="193" y="150" width="4" height="8" fill="#78350f" />
    </g>

    <!-- Water Body / River meandering -->
    <path d="M 80 140 Q 110 145 130 155 Q 160 170 190 175 L 240 175 L 240 160 L 200 158 Q 170 152 145 145 Q 120 138 95 138 Z" fill="url(#waterGrad)"/>
    <!-- Water Reflection Accent -->
    <path d="M 140 162 Q 160 168 180 170" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Flying Birds (V-shapes) -->
    <path d="M 75 55 Q 80 50 85 55 Q 90 50 95 55" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 60 65 Q 63 61 67 65 Q 71 61 74 65" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Camera Viewfinder UI Overlay (Focus corners & framing) -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Top-Left Corner -->
    <path d="M 32 44 L 32 32 L 44 32" />
    <!-- Top-Right Corner -->
    <path d="M 208 44 L 208 32 L 196 32" />
    <!-- Bottom-Left Corner -->
    <path d="M 32 151 L 32 163 L 44 163" />
    <!-- Bottom-Right Corner -->
    <path d="M 208 151 L 208 163 L 196 163" />
    
    <!-- Center Crosshair (Subtle) -->
    <circle cx="120" cy="97" r="16" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  </g>

  <!-- Foreground Interaction Deck / UI Base -->
  <g transform="translate(0, 180)">
    <!-- Glassmorphism control bar -->
    <rect x="20" y="5" width="200" height="40" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>

    <!-- Shutter / Snapshot Icon button (Left) -->
    <circle cx="45" cy="25" r="12" fill="#38bdf8" fill-opacity="0.2"/>
    <circle cx="45" cy="25" r="7" fill="#38bdf8"/>

    <!-- Scenic Landscape Icon / Mini representation -->
    <g transform="translate(68, 17)" fill="#fbbf24">
      <circle cx="8" cy="8" r="3"/>
      <path d="M 2 20 L 7 11 L 11 16 L 15 10 L 22 20 Z"/>
    </g>

    <!-- Decorative Audio / Play Button (Right) -->
    <rect x="180" y="16" width="28" height="18" rx="9" fill="#10b981"/>
    <!-- Play triangle -->
    <polygon points="191,21 191,29 198,25" fill="#ffffff"/>

    <!-- Elegant Progress / Scene Indicator dots -->
    <circle cx="110" cy="25" r="3" fill="#fbbf24"/>
    <circle cx="120" cy="25" r="3" fill="#64748b"/>
    <circle cx="130" cy="25" r="3" fill="#64748b"/>
  </g>

  <!-- Sparkle Highlights for "Wonderful Scenery" vibe -->
  <g fill="#fef08a">
    <!-- Star 1 -->
    <path d="M 50 75 Q 50 82 43 82 Q 50 82 50 89 Q 50 82 57 82 Q 50 82 50 75 Z" />
    <!-- Star 2 -->
    <path d="M 190 55 Q 190 60 185 60 Q 190 60 190 65 Q 190 60 195 60 Q 190 60 190 55 Z" />
  </g>
</svg>