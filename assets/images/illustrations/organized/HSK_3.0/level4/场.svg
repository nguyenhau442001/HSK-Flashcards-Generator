<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="floodlight" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Night Sky & Floodlights -->
  <circle cx="60" cy="40" r="70" fill="url(#floodlight)" />
  <circle cx="180" cy="40" r="70" fill="url(#floodlight)" />

  <!-- Stadium Lights (Poles & Fixtures) -->
  <rect x="56" y="20" width="8" height="50" fill="#475569" rx="2" />
  <path d="M46 20 L66 20 L62 14 L50 14 Z" fill="#94a3b8" />
  <ellipse cx="56" cy="17" rx="9" ry="4" fill="#fef08a" />

  <rect x="176" y="20" width="8" height="50" fill="#475569" rx="2" />
  <path d="M166 20 L186 20 L182 14 L170 14 Z" fill="#94a3b8" />
  <ellipse cx="180" cy="17" rx="9" ry="4" fill="#fef08a" />

  <!-- Stadium Stands / Background Bleachers -->
  <path d="M20 80 L220 80 L230 100 L10 100 Z" fill="#334155" />
  <line x1="30" y1="88" x2="210" y2="88" stroke="#475569" stroke-width="2" />
  <!-- Simple spectator silhouettes -->
  <circle cx="50" cy="74" r="3" fill="#64748b" />
  <circle cx="70" cy="74" r="3" fill="#64748b" />
  <circle cx="90" cy="74" r="3" fill="#64748b" />
  <circle cx="110" cy="74" r="3" fill="#64748b" />
  <circle cx="130" cy="74" r="3" fill="#64748b" />
  <circle cx="150" cy="74" r="3" fill="#64748b" />
  <circle cx="170" cy="74" r="3" fill="#64748b" />
  <circle cx="190" cy="74" r="3" fill="#64748b" />

  <!-- MAIN SUBJECT: The Sports Field (Bãi, sân) -->
  <!-- Perspective Field Shape -->
  <path d="M10 100 L230 100 L210 215 C210 215 150 225 120 225 C90 225 30 215 30 215 Z" fill="url(#fieldGrad)" />

  <!-- Field Markings (Lines & Center Circle) -->
  <!-- Center line and circle -->
  <ellipse cx="120" cy="162" rx="25" ry="12" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7" />
  <line x1="120" y1="100" x2="120" y2="222" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7" />

  <!-- Penalty Box (Perspective) -->
  <path d="M75 218 L85 185 L155 185 L165 218" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7" />
  
  <!-- Goal Net Structure (Back) -->
  <path d="M95 150 L145 150 L150 135 L90 135 Z" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3" />
  <!-- Goal Post -->
  <path d="M92 152 L90 135 L150 135 L148 152" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linejoin="round" />

  <!-- ACTION-PACKED PROPS: Glowing Soccer Ball in Motion -->
  <g transform="translate(120, 165)">
    <!-- Motion trails -->
    <path d="M -15 10 L -30 20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M -10 15 L -20 25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Ball Body -->
    <circle cx="0" cy="0" r="11" fill="#ffffff" />
    <!-- Ball Pentagons/Patterns -->
    <path d="M-3 -3 L3 -5 L5 1 L0 5 L-5 1 Z" fill="#0f172a" />
    <path d="M-7 -6 L-3 -3 L-5 1 Z" fill="#0f172a" />
    <path d="M5 1 L7 -4 L3 -5 Z" fill="#0f172a" />
    <path d="M0 5 L4 9 L-4 9 Z" fill="#0f172a" />
    <!-- Dynamic glow -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Foreground Atmospheric Glow & Framing -->
  <path d="M0 240 L240 240 L240 220 L0 220 Z" fill="#0f172a" />
  
  <!-- Sparkles / Action Energy Particles -->
  <circle cx="85" cy="130" r="2" fill="#fbbf24" opacity="0.9" />
  <circle cx="160" cy="120" r="1.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="140" cy="190" r="2" fill="#fbbf24" opacity="0.7" />
  <circle cx="70" cy="180" r="1" fill="#ec4899" opacity="0.8" />
</svg>