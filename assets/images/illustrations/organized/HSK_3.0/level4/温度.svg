<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Thermometer Body -->
  <rect x="105" y="60" width="30" height="120" rx="15" fill="#334155" stroke="#475569" stroke-width="4"/>
  <circle cx="120" cy="180" r="22" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- Mercury level -->
  <rect x="114" y="90" width="12" height="90" rx="6" fill="#fb923c"/>
  <circle cx="120" cy="180" r="14" fill="#fb923c"/>
  
  <!-- Heat waves/Atmosphere -->
  <path d="M150 70 C 165 70, 165 90, 150 90" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M155 50 C 175 50, 175 80, 155 80" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Background details: Window frame/Wall -->
  <rect x="20" y="20" width="200" height="200" rx="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Sun glow reflection -->
  <circle cx="190" cy="50" r="20" fill="#f59e0b" opacity="0.2"/>
  <circle cx="190" cy="50" r="10" fill="#fbbf24" opacity="0.4"/>
  
  <!-- Table surface -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2"/>
</svg>