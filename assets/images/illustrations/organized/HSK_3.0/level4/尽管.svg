<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="deskLamp" cx="70%" cy="30%" r="80%" fx="70%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Desk Light Layer -->
  <rect width="240" height="240" rx="24" fill="url(#deskLamp)" />

  <!-- ENVIRONMENT: Room Background & Window (Showing "Busy/Late Night" context) -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="150" y="30" width="60" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
    <rect x="154" y="34" width="52" height="77" fill="url(#nightSky)" />
    <!-- Window Panes Grid -->
    <line x1="180" y1="34" x2="180" y2="111" stroke="#334155" stroke-width="2" />
    <line x1="154" y1="72" x2="206" y2="72" stroke="#334155" stroke-width="2" />

    <!-- City skyline outside window (busy urban setting) -->
    <path d="M158 95 L162 95 L162 111 L158 111 Z M165 85 L170 85 L170 111 L165 111 Z M173 90 L179 90 L179 111 L173 111 Z M188 80 L195 80 L195 111 L188 111 Z M198 88 L203 88 L203 111 L198 111 Z" fill="#1e293b" />
    <circle cx="160" cy="88" r="1" fill="#fde047" opacity="0.8" />
    <circle cx="167" cy="78" r="1" fill="#fde047" opacity="0.8" />
    <circle cx="191" cy="74" r="1" fill="#fde047" opacity="0.8" />

    <!-- Bookshelf in background -->
    <rect x="25" y="40" width="45" height="75" fill="#1e293b" opacity="0.6" />
    <line x1="25" y1="65" x2="70" y2="65" stroke="#0f172a" stroke-width="2" />
    <line x1="25" y1="90" x2="70" y2="90" stroke="#0f172a" stroke-width="2" />
    <!-- Books on shelf -->
    <rect x="29" y="48" width="8" height="17" fill="#ef4444" rx="1" />
    <rect x="38" y="50" width="6" height="15" fill="#38bdf8" rx="1" />
    <rect x="46" y="46" width="10" height="19" fill="#10b981" rx="1" />
    <rect x="30" y="72" width="7" height="18" fill="#f59e0b" rx="1" />
    <rect x="39" y="75" width="12" height="15" fill="#ec4899" rx="1" />
  </g>

  <!-- PROPS: Desk & Office Equipment (Showing heavy workload context) -->
  <g id="desk-and-props">
    <!-- Main Desk Surface -->
    <path d="M10 175 L230 175 L220 215 L20 215 Z" fill="#334155" filter="url(#shadow)" />
    <path d="M10 170 L230 170 L230 175 L10 175 Z" fill="#475569" />

    <!-- Laptop showing graphs/charts (Busy working state) -->
    <path d="M135 155 L185 155 L195 172 L125 172 Z" fill="#94a3b8" />
    <rect x="138" y="115" width="44" height="42" rx="3" fill="#0f172a" />
    <!-- Screen content: Glowing Analytics/Charts -->
    <rect x="142" y="119" width="36" height="34" fill="#0284c7" />
    <circle cx="160" cy="136" r="12" fill="url(#screenGlow)" />
    <!-- Bar charts on screen -->
    <rect x="146" y="138" width="5" height="11" fill="#38bdf8" rx="1" />
    <rect x="154" y="130" width="5" height="19" fill="#f59e0b" rx="1" />
    <rect x="162" y="125" width="5" height="24" fill="#10b981" rx="1" />
    <line x1="144" y1="149" x2="176" y2="149" stroke="#cbd5e1" stroke-width="1" />

    <!-- Desk Lamp (Casting warm directional light) -->
    <path d="M75 170 L85 170 L82 120 L78 120 Z" fill="#64748b" />
    <path d="M70 115 L90 115 L95 125 L65 125 Z" fill="#f59e0b" filter="url(#glow)" />
    <!-- Lamp Cone -->
    <path d="M65 125 L95 125 L105 135 L55 135 Z" fill="#e2e8f0" />
    <!-- Light beam overlay -->
    <polygon points="80,135 40,175 120,175" fill="#fef08a" opacity="0.12" />

    <!-- Coffee Mug with steam (Late night working) -->
    <path d="M195 155 L210 155 C213 155 215 158 215 162 L215 168 C215 172 213 175 210 175 L195 175 Z" fill="#ec4899" />
    <path d="M215 159 C220 159 222 163 220 168 C218 170 215 168 215 168" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam lines -->
    <path d="M200 148 Q202 144 200 140" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <path d="M206 146 Q204 142 206 138" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />

    <!-- Stack of documents/folders -->
    <rect x="25" y="160" width="35" height="12" rx="2" fill="#cbd5e1" />
    <rect x="27" y="154" width="32" height="8" rx="2" fill="#f8fafc" />
    <rect x="24" y="165" width="37" height="7" rx="2" fill="#94a3b8" />
  </g>

  <!-- SUBJECT: Stylized Expressive Character ("Despite being very busy, he still came to help") -->
  <g id="main-character" filter="url(#shadow)">
    <!-- Character Torso & Jacket -->
    <path d="M85 145 C80 130 95 110 110 115 C125 120 135 145 135 145 L130 190 L90 190 Z" fill="#2563eb" />
    <!-- Collar / Shirt -->
    <path d="M100 116 L110 128 L120 116 Z" fill="#f8fafc" />
    <path d="M105 125 L115 125 L110 140 Z" fill="#dc2626" /> <!-- Tie -->

    <!-- Head & Neck -->
    <path d="M103 110 L117 110 L115 120 L105 120 Z" fill="#fbcfe8" />
    <circle cx="110" cy="92" r="18" fill="#fbcfe8" />

    <!-- Hair (Dynamic, slightly messy modern hairstyle) -->
    <path d="M92 90 C92 75 105 72 115 75 C125 78 128 88 128 95 C125 90 120 82 110 82 C100 82 94 86 92 90 Z" fill="#1e293b" />
    <path d="M110 75 C115 70 122 72 125 76 C122 74 116 74 110 75 Z" fill="#1e293b" />

    <!-- Facial Expression: Determined, warm, helpful smile -->
    <!-- Eyes (Focused & friendly) -->
    <circle cx="103" cy="90" r="2.5" fill="#0f172a" />
    <circle cx="117" cy="90" r="2.5" fill="#0f172a" />
    <!-- Eyebrows (Slightly slanted showing earnest effort) -->
    <path d="M100 85 Q104 83 107 86" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <path d="M113 86 Q116 83 120 85" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <!-- Warm Confident Smile -->
    <path d="M106 98 Q110 103 114 98" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="98" cy="95" r="3" fill="#f43f5e" opacity="0.3" />
    <circle cx="122" cy="95" r="3" fill="#f43f5e" opacity="0.3" />

    <!-- Arms & Action: Reaching forward dynamically to help/give support -->
    <!-- Back Arm (Holding or resting) -->
    <path d="M90 130 C75 135 70 150 75 160" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
    <circle cx="75" cy="162" r="5" fill="#fbcfe8" />

    <!-- Front Arm (Reaching out actively, expressing readiness to assist) -->
    <path d="M125 130 C145 135 155 145 165 135" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
    <circle cx="167" cy="133" r="6" fill="#fbcfe8" /> <!-- Hand reaching out -->

    <!-- Holding a helpful prop: A gift box or a tool box/folder offering assistance -->
    <g transform="translate(155, 125) rotate(15)">
      <rect x="0" y="0" width="24" height="20" rx="3" fill="#10b981" />
      <rect x="-2" y="-3" width="28" height="5" rx="1.5" fill="#059669" />
      <!-- Ribbon -->
      <rect x="10" y="0" width="4" height="20" fill="#fde047" />
      <rect x="0" y="8" width="24" height="4" fill="#fde047" />
    </g>
  </g>

  <!-- FOREGROUND ELEMENTS (Depth framing: Warm glowing particles & desk edge details) -->
  <g id="foreground-accents">
    <!-- Glowing interaction particles (symbolizing positive energy, action overcoming obstacles) -->
    <circle cx="185" cy="110" r="3" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="140" cy="95" r="2" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="160" cy="80" r="4" fill="#10b981" filter="url(#glow)" opacity="0.8" />
    <circle cx="130" cy="170" r="2.5" fill="#f43f5e" filter="url(#glow)" />

    <!-- Sparkle star accents -->
    <path d="M195 95 L197 100 L202 102 L197 104 L195 109 L193 104 L188 102 L193 100 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M125 65 L126 68 L129 69 L126 70 L125 73 L124 70 L121 69 L124 68 Z" fill="#38bdf8" opacity="0.7" />

    <!-- Foreground silhouette desk edge to create deep 3D perspective frame -->
    <path d="M0 220 L240 220 L240 240 L0 240 Z" fill="#0f172a" opacity="0.4" />
  </g>

</svg>