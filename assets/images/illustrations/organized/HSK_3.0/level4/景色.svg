<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31103f"/>
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="farMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="midMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="closeMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>

    <!-- Sun/Moon Glow -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Foreground Deck Gradient -->
    <linearGradient id="woodFloor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Foliage Gradients -->
    <linearGradient id="pineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    
    <!-- UI Frame Clip -->
    <clipPath id="frameClip">
      <rect width="240" height="240" rx="24" fill="#1e293b"/>
    </clipPath>
  </defs>

  <!-- Base container -->
  <g clip-path="url(#frameClip)">
    <!-- Deep Space Sky -->
    <rect width="240" height="240" fill="url(#skyGrad)"/>

    <!-- Stars / Sparkles -->
    <g fill="#fde047" opacity="0.8">
      <circle cx="35" cy="30" r="1.5"/>
      <circle cx="85" cy="20" r="1"/>
      <circle cx="155" cy="35" r="1.5"/>
      <circle cx="210" cy="25" r="2"/>
      <circle cx="25" cy="70" r="1"/>
      <circle cx="195" cy="75" r="1.2"/>
    </g>

    <!-- Glowing Celestial Body (Sun/Moon blend) -->
    <circle cx="170" cy="75" r="45" fill="url(#sunGlow)"/>
    <circle cx="170" cy="75" r="22" fill="#fef08a"/>

    <!-- Clouds / Mist Layer 1 -->
    <path d="M -20 110 Q 30 100 80 115 T 180 110 T 260 120 L 260 150 L -20 150 Z" fill="#6366f1" opacity="0.2"/>

    <!-- Far Mountain Range -->
    <path d="M -10 140 L 40 80 L 95 130 L 140 70 L 190 120 L 250 85 L 250 180 L -10 180 Z" fill="url(#farMountain)"/>

    <!-- Mist Layer 2 -->
    <path d="M -10 125 Q 60 115 120 130 T 250 125 L 250 160 L -10 160 Z" fill="#818cf8" opacity="0.25"/>

    <!-- Mid Mountain Range (Majestic Peaks) -->
    <path d="M -10 150 L 70 95 L 120 135 L 185 80 L 250 130 L 250 190 L -10 190 Z" fill="url(#midMountain)"/>
    
    <!-- Mountain Highlights/Snow Caps -->
    <path d="M 70 95 L 82 112 L 76 115 L 63 105 Z" fill="#ffffff" opacity="0.6"/>
    <path d="M 185 80 L 198 102 L 192 105 L 178 92 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Mist Layer 3 (Low Valley Fog) -->
    <path d="M 0 140 Q 50 130 110 145 T 240 135 L 240 170 L 0 170 Z" fill="#c7d2fe" opacity="0.3"/>

    <!-- Close Pine Trees Layer (Right & Left) -->
    <g fill="url(#pineGrad)">
      <!-- Left hill trees -->
      <path d="M 20 160 L 10 175 L 30 175 Z"/>
      <path d="M 20 150 L 8 168 L 32 168 Z"/>
      <path d="M 45 165 L 35 180 L 55 180 Z"/>
      <path d="M 45 155 L 32 172 L 58 172 Z"/>
    </g>

    <!-- Foreground Cliff / Viewpoint Edge -->
    <path d="M -10 200 L 70 185 L 150 195 L 250 180 L 250 240 L -10 240 Z" fill="#0f172a"/>
    <path d="M 0 195 L 65 183 L 145 192 L 240 180 L 240 190 L 0 205 Z" fill="#1e293b"/>

    <!-- Wooden Viewing Deck / Pavilion Floor -->
    <path d="M 120 200 L 240 185 L 240 240 L 90 240 Z" fill="url(#woodFloor)"/>
    <!-- Wood Planks Detail -->
    <line x1="130" y1="202" x2="105" y2="240" stroke="#451a03" stroke-width="2" opacity="0.7"/>
    <line x1="150" y1="199" x2="130" y2="240" stroke="#451a03" stroke-width="2" opacity="0.7"/>
    <line x1="175" y1="196" x2="160" y2="240" stroke="#451a03" stroke-width="2" opacity="0.7"/>
    <line x1="200" y1="193" x2="195" y2="240" stroke="#451a03" stroke-width="2" opacity="0.7"/>
    <line x1="225" y1="189" x2="225" y2="240" stroke="#451a03" stroke-width="2" opacity="0.7"/>

    <!-- Foreground Railing (Right side) -->
    <g stroke="#b45309" stroke-width="4" stroke-linecap="round">
      <!-- Vertical Posts -->
      <line x1="125" y1="175" x2="125" y2="205"/>
      <line x1="170" y1="168" x2="170" y2="198"/>
      <line x1="220" y1="160" x2="220" y2="190"/>
      <!-- Horizontal Rails -->
      <line x1="120" y1="180" x2="230" y2="165"/>
      <line x1="120" y1="192" x2="230" y2="177"/>
    </g>
    <!-- Railing highlights -->
    <g stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
      <line x1="120" y1="178" x2="230" y2="163"/>
      <line x1="120" y1="190" x2="230" y2="175"/>
    </g>

    <!-- Character / Traveler enjoying the scenery (Silhouette with glowing accents) -->
    <g transform="translate(155, 160)">
      <!-- Body / Jacket -->
      <path d="M 0 25 Q -5 10 5 0 Q 15 10 10 25 Z" fill="#ec4899"/>
      <!-- Head -->
      <circle cx="5" cy="-6" r="6" fill="#fbcfe8"/>
      <!-- Hair/Cap -->
      <path d="M -1 -10 Q 5 -14 11 -8 Q 5 -12 -1 -10 Z" fill="#831843"/>
      <!-- Backpack -->
      <rect x="-6" y="5" width="5" height="15" rx="2.5" fill="#f59e0b"/>
      <!-- Binoculars held to eyes / pointing -->
      <path d="M 8 2 L 18 -2 L 20 2 L 10 6 Z" fill="#38bdf8"/>
    </g>

    <!-- Flying Birds (Adding life and scale to the scenery) -->
    <g stroke="#e2e8f0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M 75 75 Q 82 68 90 75 Q 98 68 105 75"/>
      <path d="M 60 85 Q 65 80 70 85 Q 75 80 80 85" transform="scale(0.7) translate(40, 20)"/>
    </g>

    <!-- Floating Lanterns for magical/festive touch -->
    <g transform="translate(60, 95)">
      <ellipse cx="0" cy="0" rx="6" ry="8" fill="#f43f5e"/>
      <rect x="-2" y="-11" width="4" height="3" fill="#fbbf24"/>
      <line x1="0" y1="-15" x2="0" y2="-11" stroke="#fbbf24" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="#f43f5e" opacity="0.4" filter="blur(2px)"/>
    </g>
    <g transform="translate(45, 120)">
      <ellipse cx="0" cy="0" rx="4" ry="6" fill="#f97316"/>
      <rect x="-1.5" y="-8" width="3" height="2" fill="#fbbf24"/>
      <circle cx="0" cy="0" r="6" fill="#fbbf24" opacity="0.3" filter="blur(2px)"/>
    </g>

    <!-- Decorative HSK Scene Frame Border (Inset) -->
    <rect x="8" y="8" width="224" height="224" rx="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
    <rect x="4" y="4" width="232" height="232" rx="20" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  </g>
</svg>