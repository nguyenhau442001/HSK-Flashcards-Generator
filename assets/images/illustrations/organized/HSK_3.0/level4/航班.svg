<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient (Dark Mode Aviation Theme) -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Airplane Body Gradient -->
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Glow/Action Gradient -->
    <linearGradient id="actionGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- Window Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Elements / Background Stars & Dots -->
  <g fill="#64748b" opacity="0.4">
    <circle cx="30" cy="40" r="1.5"/>
    <circle cx="210" cy="50" r="1"/>
    <circle cx="190" cy="30" r="2"/>
    <circle cx="45" cy="180" r="1"/>
    <circle cx="200" cy="200" r="1.5"/>
  </g>

  <!-- Distant Glowing Moon/Sun -->
  <circle cx="195" cy="65" r="18" fill="#fbbf24" opacity="0.15"/>
  <circle cx="195" cy="65" r="12" fill="#fbbf24" opacity="0.25"/>

  <!-- Background Clouds -->
  <path d="M 20 190 Q 30 170 50 175 Q 70 160 95 175 Q 120 170 135 190 Z" fill="url(#cloudGrad)"/>
  <path d="M 130 90 Q 145 75 165 80 Q 185 65 210 80 Q 235 85 240 105 Z" fill="url(#cloudGrad)"/>
  <path d="M 10 75 Q 25 60 45 65 Q 65 50 90 65 Q 105 70 115 90 Z" fill="url(#cloudGrad)"/>

  <!-- Dynamic Flight Trail / Motion Lines -->
  <path d="M 20 185 Q 70 150 110 130" stroke="url(#actionGlow)" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="6 4"/>
  <path d="M 40 200 Q 90 165 130 145" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- MAIN SUBJECT: The Airplane (Flight / 航班) -->
  <g transform="rotate(-25 120 115)">
    
    <!-- Exhaust / Speed Lines -->
    <path d="M 20 125 L -10 120" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 25 133 L -5 128" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Tail Wing (Back) -->
    <path d="M 28 105 L 15 85 L 45 95 Z" fill="#94a3b8"/>

    <!-- Main Fuselage -->
    <path d="M 20 120 C 20 120 40 100 100 95 C 160 90 205 102 215 110 C 225 118 225 128 215 135 C 205 142 160 145 100 140 C 40 135 20 120 20 120 Z" fill="url(#planeGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Fuselage Stripe (Branding Accent) -->
    <path d="M 45 119 C 90 115 160 117 205 122" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 50 122 C 95 118 155 120 200 125" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Cabin Windows (Portholes) -->
    <g fill="url(#glassGrad)">
      <circle cx="70" cy="116" r="3.5"/>
      <circle cx="85" cy="116" r="3.5"/>
      <circle cx="100" cy="116" r="3.5"/>
      <circle cx="115" cy="117" r="3.5"/>
      <circle cx="130" cy="117" r="3.5"/>
      <circle cx="145" cy="118" r="3.5"/>
      <circle cx="160" cy="118" r="3.5"/>
      <circle cx="175" cy="119" r="3.5"/>
      <circle cx="190" cy="120" r="3.5"/>
    </g>

    <!-- Cockpit Windshield -->
    <path d="M 195 112 C 202 114 208 117 211 120 C 208 121 202 121 195 119 Z" fill="#0f172a" opacity="0.8"/>

    <!-- Main Wing (Top/Foreground perspective) -->
    <path d="M 85 118 L 130 70 L 155 75 L 120 125 Z" fill="url(#wingGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Wing flap detail -->
    <path d="M 127 73 L 152 77 L 138 100 L 118 95 Z" fill="#cbd5e1" opacity="0.7"/>

    <!-- Tail Wing (Front) -->
    <path d="M 32 108 L 22 75 L 55 88 Z" fill="url(#planeGrad)" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Engine Underside Nacelle -->
    <path d="M 100 124 L 125 126 L 120 136 L 95 134 Z" fill="#94a3b8"/>
    <ellipse cx="110" cy="130" rx="3" ry="5" fill="#475569"/>

  </g>

  <!-- Foreground Foreground Elements (Depth Framing) -->
  <!-- Low fluffy clouds passing by -->
  <path d="M -10 220 Q 20 195 55 210 Q 90 190 130 215 Q 170 200 210 215 Q 240 210 250 240 L -10 240 Z" fill="#334155" opacity="0.8"/>
  <path d="M 0 225 Q 35 205 70 220 Q 110 205 150 230 Q 190 215 230 235 L 240 240 L 0 240 Z" fill="#475569" opacity="0.6"/>

  <!-- Sparkling Stars / Sparkles in the Sky -->
  <g fill="#fbbf24">
    <path d="M 45 45 L 47 50 L 52 52 L 47 54 L 45 59 L 43 54 L 38 52 L 43 50 Z" opacity="0.9"/>
    <path d="M 140 35 L 141.5 38.5 L 145 40 L 141.5 41.5 L 140 45 L 138.5 41.5 L 135 40 L 138.5 38.5 Z" opacity="0.7"/>
    <path d="M 180 155 L 181 158 L 184 159 L 181 160 L 180 163 L 179 160 L 176 159 L 179 158 Z" opacity="0.5"/>
  </g>

  <!-- Tiny floating travel items (passport stamp vibe, abstract travel context) -->
  <g transform="translate(35, 80) rotate(15)" opacity="0.85">
    <!-- Mini Luggage Tag -->
    <rect x="0" y="0" width="18" height="24" rx="4" fill="#ec4899"/>
    <circle cx="9" cy="6" r="2" fill="#fbcfe8"/>
    <path d="M 9 -4 C 6 -4 4 -6 4 -8" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  </g>

  <!-- Glowing Flight Path Arcs -->
  <path d="M 95 180 C 130 140 170 120 220 90" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.25" stroke-dasharray="4 4"/>

</svg>