<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 50)">
    <!-- Magnifying Glass -->
    <circle cx="100" cy="60" r="45" fill="none" stroke="#38bdf8" stroke-width="8"/>
    <path d="M132 92 L170 130" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Focus Area (Detailed Map/Blueprint) -->
    <clipPath id="lensClip">
      <circle cx="100" cy="60" r="40"/>
    </clipPath>
    <g clip-path="url(#lensClip)">
      <rect x="60" y="20" width="80" height="80" fill="#fbbf24"/>
      <path d="M60 40 h80 M60 60 h80 M60 80 h80 M80 20 v80 M100 20 v80 M120 20 v80" stroke="#0f172a" stroke-width="2"/>
      <circle cx="100" cy="60" r="10" fill="#ec4899"/>
      <circle cx="80" cy="40" r="5" fill="#10b981"/>
      <circle cx="120" cy="80" r="5" fill="#10b981"/>
    </g>
    
    <!-- Supporting Props -->
    <path d="M20 160 h160 v40 h-160 Z" fill="#334155" rx="5"/>
    <rect x="40" y="170" width="20" height="20" fill="#fb923c" rx="2"/>
    <rect x="70" y="170" width="40" height="20" fill="#38bdf8" rx="2"/>
    <rect x="120" y="170" width="30" height="20" fill="#10b981" rx="2"/>
    
    <!-- Floating particles for action -->
    <circle cx="160" cy="30" r="3" fill="#fbbf24"/>
    <circle cx="180" cy="50" r="2" fill="#38bdf8"/>
    <circle cx="30" cy="40" r="4" fill="#ec4899"/>
  </g>
</svg>