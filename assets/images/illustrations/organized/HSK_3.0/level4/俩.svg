<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm Golden Glow behind characters -->
    <radialGradient id="glow" cx="50%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradients (Friendly Chef/Friend) -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Gradients (Companion) -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Table & Food Gradients -->
    <linearGradient id="tableWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Café/Home Vibe) -->
  <g opacity="0.4">
    <!-- Hanging warm lights -->
    <path d="M 60 0 L 60 40" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="60" cy="45" r="8" fill="#fbbf24" filter="url(#shadow)"/>
    
    <path d="M 180 0 L 180 50" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="180" cy="55" r="10" fill="#fbbf24" filter="url(#shadow)"/>

    <!-- Window / Frame outline in background -->
    <rect x="90" y="20" width="60" height="80" rx="8" fill="none" stroke="#334155" stroke-width="3"/>
    <line x1="120" y1="20" x2="120" y2="100" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Central Glow highlighting "The Pair" (俩) -->
  <circle cx="120" cy="140" r="80" fill="url(#glow)"/>

  <!-- Environment: Table and Props -->
  <g id="environment">
    <!-- Table Legs -->
    <rect x="75" y="180" width="12" height="40" fill="#451a03"/>
    <rect x="153" y="180" width="12" height="40" fill="#451a03"/>

    <!-- Table Body (Side view / Perspective) -->
    <path d="M 40 180 L 200 180 L 190 205 L 50 205 Z" fill="url(#tableWood)" filter="url(#shadow)"/>
    <!-- Table Top Surface -->
    <ellipse cx="120" cy="180" rx="85" ry="12" fill="url(#tableTop)"/>

    <!-- Props on Table: Teapot and Cups -->
    <!-- Teapot -->
    <path d="M 112 165 C 108 160 108 150 115 145 L 125 145 C 132 150 132 160 128 165 Z" fill="#e2e8f0"/>
    <circle cx="120" cy="143" r="3" fill="#cbd5e1"/>
    <path d="M 128 152 C 138 152 140 158 138 162" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Cups representing sharing -->
    <path d="M 95 173 L 103 173 L 101 180 L 97 180 Z" fill="#f8fafc"/>
    <path d="M 137 173 L 145 173 L 143 180 L 139 180 Z" fill="#f8fafc"/>
  </g>

  <!-- MAIN SUBJECT: "HAI NGƯỜI" (The Pair - 俩) -->
  <!-- Character 1 (Left: Friendly blue shirt, enthusiastic pose) -->
  <g id="character-left" filter="url(#shadow)">
    <!-- Body & Torso -->
    <path d="M 75 185 C 70 155 85 135 100 135 C 115 135 125 155 120 185 Z" fill="url(#shirt1)"/>
    
    <!-- Left Arm raised/glowing in friendship -->
    <path d="M 80 145 C 65 140 55 120 60 110 C 65 105 75 110 78 120 L 92 145" fill="url(#shirt1)" stroke="#0284c7" stroke-width="2" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="58" cy="107" r="7" fill="#fcd34d"/>

    <!-- Head & Hair -->
    <circle cx="95" cy="100" r="22" fill="#fcd34d"/>
    <!-- Hair Dark Base -->
    <path d="M 74 100 C 74 80 116 80 116 100 C 112 90 78 90 74 100 Z" fill="#334155"/>
    <path d="M 85 85 Q 95 75 110 85" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

    <!-- Face Details (Happy Expression) -->
    <!-- Eyes (happy arcs) -->
    <path d="M 86 98 Q 90 94 94 98" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 100 98 Q 104 94 108 98" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="87" cy="103" r="4" fill="#fb7185" opacity="0.6"/>
    <circle cx="107" cy="103" r="4" fill="#fb7185" opacity="0.6"/>
    <!-- Smile -->
    <path d="M 93 105 Q 97 111 101 105" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Right: Red/Coral shirt, leaning in happily) -->
  <g id="character-right" filter="url(#shadow)">
    <!-- Body & Torso -->
    <path d="M 165 185 C 170 155 155 135 140 135 C 125 135 115 155 120 185 Z" fill="url(#shirt2)"/>

    <!-- Right Arm welcoming -->
    <path d="M 160 145 C 175 140 185 120 180 110 C 175 105 165 110 162 120 L 148 145" fill="url(#shirt2)" stroke="#be123c" stroke-width="2" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="182" cy="107" r="7" fill="#fcd34d"/>

    <!-- Head & Hair -->
    <circle cx="145" cy="100" r="22" fill="#fcd34d"/>
    <!-- Hair / Ponytail style -->
    <path d="M 123 100 C 123 80 167 80 167 100 C 160 85 130 85 123 100 Z" fill="#1e293b"/>
    <!-- Ponytail bounce -->
    <path d="M 162 90 C 175 85 180 95 175 105" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

    <!-- Face Details (Happy Expression) -->
    <!-- Eyes -->
    <path d="M 136 98 Q 140 94 144 98" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 150 98 Q 154 94 158 98" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="137" cy="103" r="4" fill="#fb7185" opacity="0.6"/>
    <circle cx="157" cy="103" r="4" fill="#fb7185" opacity="0.6"/>
    <!-- Smile -->
    <path d="M 143 105 Q 147 111 151 105" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Interactive Dynamic Elements (Hearts / Connection symbols floating between them) -->
  <g id="connection-elements">
    <!-- Floating gentle sparkles representing companionship -->
    <path d="M 120 85 L 122 90 L 127 92 L 122 94 L 120 99 L 118 94 L 113 92 L 118 90 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M 105 70 L 106 73 L 109 74 L 106 75 L 105 78 L 104 75 L 101 74 L 104 73 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M 135 72 L 136 74 L 138 75 L 136 76 L 135 78 L 134 76 L 132 75 L 134 74 Z" fill="#f43f5e" opacity="0.8"/>
    
    <!-- Small floating heart symbolizing "俩" (the two of them together) -->
    <path d="M 120 62 C 120 57 113 55 110 60 C 107 55 100 57 100 62 C 100 68 110 74 110 74 C 110 74 120 68 120 62 Z" fill="#f43f5e" transform="translate(10, -5) scale(0.7)" filter="url(#shadow)"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Frame enhancement -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.3"/>
</svg>