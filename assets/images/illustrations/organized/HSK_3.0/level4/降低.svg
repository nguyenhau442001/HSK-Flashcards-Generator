<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Shelf Structure -->
  <rect x="40" y="80" width="160" height="10" rx="2" fill="#475569"/>
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#475569"/>
  
  <!-- Lowering Mechanism (The Action) -->
  <path d="M120 80 L120 130" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6 6"/>
  
  <!-- The Object (Price Tag/Box) being lowered -->
  <g transform="translate(90, 110)">
    <rect width="60" height="40" rx="6" fill="#f59e0b"/>
    <rect x="15" y="10" width="30" height="20" rx="2" fill="#fff" opacity="0.2"/>
    <circle cx="30" cy="20" r="8" fill="#1e293b"/>
  </g>
  
  <!-- Downward Arrow Indicator -->
  <path d="M120 175 L110 165 M120 175 L130 165 M120 175 L120 150" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="50" r="4" fill="#38bdf8"/>
  <circle cx="60" cy="200" r="3" fill="#ec4899"/>
  <path d="M190 190 L205 190 L197.5 205 Z" fill="#fb923c"/>
</svg>