<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Earth Atmosphere Glow -->
    <radialGradient id="atmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.6" />
    </radialGradient>

    <!-- Earth Ocean Gradient -->
    <radialGradient id="earthOcean" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>

    <!-- Sun/Light Glow -->
    <radialGradient id="sunGlow" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    
    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6" />
    </linearGradient>

    <!-- Comet Trail Gradient -->
    <linearGradient id="cometTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#spaceBg)"/>

  <!-- Ambient Light from top-left -->
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Background Space Elements (Stars & Constellations) -->
  <g id="space-elements" opacity="0.8">
    <!-- Tiny Stars -->
    <circle cx="35" cy="45" r="1" fill="#ffffff" opacity="0.9" />
    <circle cx="205" cy="35" r="1.5" fill="#fef08a" opacity="0.8" />
    <circle cx="215" cy="185" r="1" fill="#ffffff" opacity="0.5" />
    <circle cx="25" cy="195" r="1.2" fill="#38bdf8" opacity="0.7" />
    <circle cx="95" cy="25" r="0.8" fill="#ffffff" opacity="0.6" />
    <circle cx="15" cy="115" r="0.8" fill="#ffffff" opacity="0.4" />
    <circle cx="220" cy="95" r="1" fill="#ffffff" opacity="0.7" />

    <!-- Cross/Sparkle Stars -->
    <g transform="translate(190, 60) scale(0.6)">
      <path d="M0 -10 C0 -2 2 0 10 0 C2 0 0 2 0 10 C0 2 -2 0 -10 0 C-2 0 0 -2 0 -10 Z" fill="#fef08a" />
    </g>
    <g transform="translate(45, 155) scale(0.4)">
      <path d="M0 -10 C0 -2 2 0 10 0 C2 0 0 2 0 10 C0 2 -2 0 -10 0 C-2 0 0 -2 0 -10 Z" fill="#38bdf8" />
    </g>
    <g transform="translate(145, 25) scale(0.5)">
      <path d="M0 -10 C0 -2 2 0 10 0 C2 0 0 2 0 10 C0 2 -2 0 -10 0 C-2 0 0 -2 0 -10 Z" fill="#ffffff" />
    </g>

    <!-- Distant Nebula / Cosmic Dust -->
    <path d="M 180 140 Q 210 160 190 200 Q 150 210 170 170 Z" fill="#ec4899" opacity="0.15" filter="blur(8px)" />
    <path d="M 30 40 Q 70 20 90 60 Q 60 90 20 70 Z" fill="#8b5cf6" opacity="0.15" filter="blur(10px)" />
  </g>

  <!-- Shooting Star / Comet -->
  <g id="comet" transform="rotate(-25 120 120)">
    <path d="M 120 20 L 220 -20" stroke="url(#cometTail)" stroke-width="3" stroke-linecap="round" />
    <circle cx="120" cy="20" r="2" fill="#ffffff" />
  </g>

  <!-- MAIN SUBJECT: THE EARTH (地球) -->
  <g id="earth-system" transform="translate(120, 120)">
    
    <!-- Outer Atmosphere Glow (Layered for depth) -->
    <circle cx="0" cy="0" r="76" fill="url(#atmGlow)" />
    <circle cx="0" cy="0" r="71" fill="#38bdf8" opacity="0.2" filter="blur(4px)" />

    <!-- Earth Base (Ocean) -->
    <circle cx="0" cy="0" r="68" fill="url(#earthOcean)" />

    <!-- Continents & Landmasses (Stylized vector shapes matching a tilted globe) -->
    <g id="continents" clip-path="url(#earthClip)">
      <clipPath id="earthClip">
        <circle cx="0" cy="0" r="68" />
      </clipPath>

      <!-- Landmass Group with warm vibrant green/earthy tones -->
      <g fill="#22c55e" stroke="#15803d" stroke-width="1.5" stroke-linejoin="round">
        <!-- North/South America stylized mass -->
        <path d="M -35 -50 Q -20 -30 -35 -10 Q -45 10 -30 30 Q -15 45 -25 55 Q -40 60 -50 40 Q -60 10 -45 -20 Z" />
        
        <!-- Eurasia / Africa stylized mass -->
        <path d="M 15 -60 Q 40 -40 50 -10 Q 60 20 40 45 Q 20 60 5 45 Q 25 20 10 -10 Q -5 -30 15 -60 Z" />

        <!-- Australia / Islands -->
        <path d="M 45 40 Q 60 45 55 60 Q 40 60 45 40 Z" />
      </g>

      <!-- Secondary Land/Desert details for rich texture -->
      <g fill="#16a34a">
        <path d="M -30 5 Q -20 20 -35 35 Q -40 25 -30 5 Z" opacity="0.8"/>
        <path d="M 30 -20 Q 45 -10 35 15 Q 25 0 30 -20 Z" opacity="0.8"/>
      </g>

      <!-- Friendly Expressive Face (Anthropomorphic touch for app engagement) -->
      <g id="earth-face">
        <!-- Eyes (Happy curved arcs with catchlights) -->
        <g stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none">
          <path d="M -22 -12 C -22 -5 -15 -5 -15 -12" />
          <path d="M 15 -12 C 15 -5 22 -5 22 -12" />
        </g>
        <!-- Sparkles in eyes -->
        <circle cx="-16" cy="-14" r="1" fill="#ffffff" />
        <circle cx="21" cy="-14" r="1" fill="#ffffff" />

        <!-- Rosy Cheeks -->
        <circle cx="-24" cy="-5" r="5" fill="#f43f5e" opacity="0.4" filter="blur(1px)" />
        <circle cx="24" cy="-5" r="5" fill="#f43f5e" opacity="0.4" filter="blur(1px)" />

        <!-- Cheerful Smile with tongue -->
        <path d="M -12 2 C -12 12 12 12 12 2" fill="#0f172a" />
        <path d="M -5 7 C -2 10 2 10 5 7 Z" fill="#fb7185" />
      </g>

      <!-- Dynamic Stylized Clouds -->
      <g id="clouds" fill="url(#cloudGrad)">
        <!-- Cloud 1 -->
        <path d="M -55 -35 Q -45 -45 -35 -35 Q -25 -40 -15 -30 Q -25 -20 -40 -25 Q -55 -25 -55 -35 Z" opacity="0.85" />
        <!-- Cloud 2 -->
        <path d="M 10 25 Q 20 15 35 20 Q 45 25 40 35 Q 25 45 10 35 Q 5 30 10 25 Z" opacity="0.9" />
        <!-- Cloud 3 (Small swirl) -->
        <path d="M -20 -55 Q -10 -60 0 -50 Q -10 -45 -20 -55 Z" opacity="0.7" />
      </g>

      <!-- Globe 3D Depth Shadow (Crescent shading on right side) -->
      <path d="M 0 -68 A 68 68 0 0 1 0 68 A 45 68 0 0 0 0 -68 Z" fill="#090d16" opacity="0.35" />
    </g>

    <!-- Globe Outer Rim / Atmosphere Stroke -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Orbiting Satellite (Adds active, real-world context and scale) -->
  <g id="satellite" transform="translate(50, 65) rotate(-15)">
    <!-- Orbit path arc (faint dashed) -->
    <path d="M -50 45 Q 30 -30 120 -10" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.3" />
    
    <!-- Satellite Body -->
    <rect x="-6" y="-4" width="12" height="8" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1" />
    <!-- Solar Panels -->
    <rect x="-18" y="-7" width="10" height="14" rx="1" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />
    <rect x="8" y="-7" width="10" height="14" rx="1" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />
    <!-- Panel Grid Lines -->
    <line x1="-13" y1="-7" x2="-13" y2="7" stroke="#0f172a" stroke-width="0.75" />
    <line x1="13" y1="-7" x2="13" y2="7" stroke="#0f172a" stroke-width="0.75" />
    <!-- Dish / Antenna -->
    <path d="M 0 -4 L 0 -9" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="0" cy="-10" r="2.5" fill="#f59e0b" />
    <!-- Signal waves -->
    <path d="M -3 -14 Q 0 -17 3 -14" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.8" />
  </g>

  <!-- Floating Green Leaf / Eco Symbol (Reinforces 'Home of all of us' theme) -->
  <g id="floating-leaf" transform="translate(180, 160) rotate(25) scale(0.9)">
    <path d="M 0 12 C 0 12 -12 2 -10 -10 C -8 -22 0 -24 0 -24 C 0 -24 8 -22 10 -10 C 12 2 0 12 0 12 Z" fill="#10b981" stroke="#059669" stroke-width="1.5" />
    <path d="M 0 10 L 0 -18" stroke="#065f46" stroke-width="1" stroke-linecap="round" />
    <path d="M 0 -5 L -5 -10" stroke="#065f46" stroke-width="0.75" stroke-linecap="round" />
    <path d="M 0 -10 L 5 -15" stroke="#065f46" stroke-width="0.75" stroke-linecap="round" />
  </g>

  <!-- Second Tiny Leaf -->
  <g id="floating-leaf-2" transform="translate(60, 185) rotate(-35) scale(0.6)">
    <path d="M 0 12 C 0 12 -12 2 -10 -10 C -8 -22 0 -24 0 -24 C 0 -24 8 -22 10 -10 C 12 2 0 12 0 12 Z" fill="#34d399" stroke="#059669" stroke-width="1.5" />
    <path d="M 0 10 L 0 -18" stroke="#065f46" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Sparkles / Magic Dust around Earth -->
  <circle cx="165" cy="90" r="2" fill="#fbbf24" opacity="0.9" />
  <circle cx="75" cy="140" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="130" cy="195" r="2" fill="#34d399" opacity="0.9" />

  <!-- Frame Border / Vignette (Subtle inset stroke for premium app card feel) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>