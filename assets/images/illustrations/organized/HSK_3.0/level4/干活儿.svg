<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Deep Slate Navy Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Warm Construction Glow -->
    <radialGradient id="workGlow" cx="0.45" cy="0.6" r="0.7">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Metal Gradient for Tools -->
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Wood Texture Gradient -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#workGlow)"/>

  <!-- ENVIRONMENT & BACKGROUND DETAILS -->
  <!-- Exposed brick / Architecture structure -->
  <path d="M20 200 H220 V215 H20 Z" fill="#334155" opacity="0.6"/>
  <rect x="35" y="160" width="30" height="40" rx="4" fill="#334155" opacity="0.3"/>
  <rect x="180" y="140" width="25" height="60" rx="4" fill="#334155" opacity="0.3"/>

  <!-- Scaffolding / Steel Beam structure in background -->
  <path d="M190 20 L190 200 M185 20 H195 M185 60 H195 M185 100 H195 M185 140 H195 M185 180 H195" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 50 L220 80 M190 120 L220 150" stroke="#475569" stroke-width="2"/>

  <!-- Hanging Work Light -->
  <path d="M110 0 V35" stroke="#64748b" stroke-width="2"/>
  <path d="M95 35 H125 L130 45 H90 Z" fill="#fbbf24"/>
  <circle cx="110" cy="46" r="4" fill="#fef08a"/>
  <!-- Light cone casting down -->
  <polygon points="110,46 50,210 170,210" fill="#fbbf24" opacity="0.08"/>

  <!-- Pile of Bricks (Foreground Prop) -->
  <g transform="translate(15, 170)">
    <rect x="0" y="15" width="35" height="15" rx="2" fill="#ea580c"/>
    <rect x="5" y="0" width="35" height="15" rx="2" fill="#c2410c"/>
    <rect x="35" y="8" width="15" height="22" rx="2" fill="#9a3412"/>
  </g>

  <!-- Wooden Workbench / Surface -->
  <rect x="40" y="195" width="140" height="12" fill="url(#woodGrad)" rx="2"/>
  <rect x="50" y="207" width="15" height="25" fill="#78350f"/>
  <rect x="155" y="207" width="15" height="25" fill="#78350f"/>

  <!-- Working Props on Bench -->
  <!-- Blueprint rolled up -->
  <path d="M60 190 C65 188 85 188 90 190 C85 192 65 192 60 190 Z" fill="#38bdf8"/>
  <circle cx="60" cy="190" r="2" fill="#0284c7"/>
  <!-- Toolbox -->
  <rect x="120" y="175" width="35" height="20" rx="3" fill="#ef4444"/>
  <path d="M130 175 V170 H140 V175" fill="none" stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
  <rect x="132" y="182" width="11" height="6" rx="1" fill="#f87171"/>

  <!-- MAIN CHARACTER: Working / Hammering Action -->
  <g transform="translate(10, 0)">
    <!-- Character Shadow -->
    <ellipse cx="105" cy="210" rx="35" ry="6" fill="#020617" opacity="0.5"/>

    <!-- Left Leg (Back) -->
    <path d="M95 150 L85 200 L100 202 L105 160 Z" fill="#1e3a8a"/>
    <!-- Right Leg (Front, braced) -->
    <path d="M110 150 L125 198 L110 200 L102 160 Z" fill="#2563eb"/>
    <!-- Boots -->
    <path d="M80 200 H102 V208 H80 Z" fill="#78350f"/>
    <path d="M110 198 H130 V206 H110 Z" fill="#78350f"/>

    <!-- Torso (Dynamic leaning forward posture for hard work) -->
    <g transform="rotate(-15, 105, 130)">
      <!-- Safety Vest / Shirt -->
      <path d="M85 100 H125 L130 150 H80 Z" fill="#f59e0b"/>
      <!-- Vest stripes -->
      <path d="M92 100 L88 150" stroke="#fef3c7" stroke-width="4"/>
      <path d="M118 100 L122 150" stroke="#fef3c7" stroke-width="4"/>
      <!-- Blue Shirt Underneath -->
      <path d="M90 95 H120 V110 H90 Z" fill="#3b82f6"/>
      
      <!-- Head and Hard Hat -->
      <g transform="translate(105, 80)">
        <!-- Neck -->
        <rect x="-6" y="-5" width="12" height="15" fill="#fcd34d"/>
        <!-- Face Profile/Determined Expression -->
        <circle cx="0" cy="-20" r="16" fill="#fcd34d"/>
        <!-- Focused Eye/Brow -->
        <path d="M-2 -24 L6 -22" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Determiend Mouth / Sweat drop -->
        <path d="M4 -12 C6 -10 10 -10 12 -12" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M14 -20 C16 -16 14 -14 12 -16" fill="#38bdf8"/> <!-- Sweat drop -->

        <!-- Yellow Construction Hard Hat -->
        <path d="M-20 -30 C-20 -45 20 -45 20 -30 Z" fill="#fbbf24"/>
        <path d="M-24 -30 H24 V-26 C24 -24 20 -24 0 -24 C-20 -24 -24 -24 -24 -26 Z" fill="#d97706"/>
      </g>
    </g>

    <!-- Arms & Action: Wrench / Hammer swinging down -->
    <!-- Left Arm (Supporting/Guiding) -->
    <path d="M95 110 L70 135 L60 130" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="130" r="5" fill="#fcd34d"/>

    <!-- Right Arm & Heavy Tool (Dynamic Action Arc) -->
    <!-- Upper arm -->
    <path d="M115 115 L145 130" fill="none" stroke="#f59e0b" stroke-width="13" stroke-linecap="round"/>
    <!-- Forearm swinging down with Wrench/Hammer -->
    <g transform="translate(145, 130) rotate(45)">
      <path d="M0 0 L35 15" fill="none" stroke="#f59e0b" stroke-width="11" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#fcd34d"/>
      
      <!-- Heavy Adjustable Wrench / Tool Head -->
      <g transform="translate(35, 15) rotate(-20)">
        <rect x="-5" y="-12" width="22" height="28" rx="4" fill="url(#metalGrad)"/>
        <rect x="5" y="-6" width="15" height="16" rx="2" fill="#1e293b"/> <!-- cutout -->
        <path d="M17 -15 L26 -8 L22 4 L14 -2 Z" fill="url(#metalGrad)"/>
      </g>
    </g>
  </g>

  <!-- ACTION FX / IMPACT PARTICLES (Shows active 'làm việc' movement) -->
  <g transform="translate(130, 160)">
    <!-- Spark / Energy bursts -->
    <path d="M0 0 L12 -8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 10 L20 15" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M-5 8 L-18 18" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="8" cy="-2" r="2" fill="#38bdf8"/>
    <circle cx="15" cy="8" r="3" fill="#fbbf24"/>
  </g>

  <!-- Floating secondary motion sparks for dynamic feel -->
  <circle cx="165" cy="130" r="2.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="155" cy="115" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <path d="M140 100 Q150 105 158 95" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
</svg>