<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Globe Glow -->
    <radialGradient id="globe-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </radialGradient>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment / Classroom Wall -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="25" y="30" width="70" height="90" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="30" y="35" width="60" height="80" fill="url(#window-light)" />
    <!-- Window Cross Bars -->
    <line x1="60" y1="35" x2="60" y2="115" stroke="#334155" stroke-width="2"/>
    <line x1="30" y1="75" x2="90" y2="75" stroke="#334155" stroke-width="2"/>
    
    <!-- Bookshelf in Background -->
    <rect x="160" y="25" width="55" height="110" rx="2" fill="#0f172a" opacity="0.7"/>
    <line x1="160" y1="60" x2="215" y2="60" stroke="#334155" stroke-width="3"/>
    <line x1="160" y1="95" x2="215" y2="95" stroke="#334155" stroke-width="3"/>
    <!-- Background Books -->
    <rect x="168" y="38" width="10" height="22" rx="1" fill="#ec4899" />
    <rect x="180" y="35" width="12" height="25" rx="1" fill="#38bdf8" />
    <rect x="195" y="40" width="8" height="20" rx="1" fill="#10b981" />
    <rect x="166" y="72" width="14" height="23" rx="1" fill="#f59e0b" />
    <rect x="183" y="70" width="10" height="25" rx="1" fill="#8b5cf6" />

    <!-- Bulletin Board -->
    <rect x="105" y="35" width="42" height="32" rx="2" fill="#334155" opacity="0.6"/>
    <circle cx="115" cy="45" r="3" fill="#ec4899" />
    <circle cx="135" cy="55" r="3" fill="#38bdf8" />
  </g>

  <!-- Interactive Light Beam on Floor/Desk -->
  <polygon points="30,115 90,115 130,180 10,180" fill="#38bdf8" opacity="0.05" />

  <!-- Foreground Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 230 C 240 235 235 240 230 240 L 10 240 C 5 240 0 235 0 230 Z" fill="url(#desk-grad)" filter="url(#shadow)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="3" />

  <!-- Main Subject: Educational Scene (Open Book, Globe, Apple, Graduation Cap & Interactive Elements) -->
  <g id="main-scene" filter="url(#shadow)">
    
    <!-- Globe (Representing World Knowledge/Education) -->
    <g id="globe" transform="translate(180, 135)">
      <!-- Globe Glow -->
      <circle cx="0" cy="0" r="28" fill="url(#globe-glow)" />
      <!-- Stand Base -->
      <path d="M-10 32 L10 32 L6 26 L-6 26 Z" fill="#94a3b8" />
      <path d="M-3 26 L3 26 L3 15 L-3 15 Z" fill="#64748b" />
      <!-- Arc Holder -->
      <path d="M-18 -5 C-18 15 18 15 18 -5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <!-- Sphere (Earth) -->
      <circle cx="0" cy="0" r="20" fill="#38bdf8" />
      <!-- Continents (Stylized) -->
      <path d="M-12 -5 C-5 -12 2 -15 8 -8 C12 -4 8 5 3 10 C-3 15 -8 8 -12 -5 Z" fill="#10b981" />
      <path d="M-5 5 C-2 3 3 8 0 12 C-3 12 -5 8 -5 5 Z" fill="#10b981" />
      <!-- Globe Axis Line -->
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 2" />
    </g>

    <!-- Stack of Textbooks -->
    <g id="book-stack" transform="translate(55, 145)">
      <!-- Bottom Book -->
      <path d="M-35 15 L15 25 L45 10 L-5 0 Z" fill="#475569" />
      <path d="M-35 15 L-35 20 L-5 25 L-5 20 Z" fill="#1e293b" />
      <path d="M-5 0 L45 10 L45 15 L-5 5 Z" fill="#334155" />

      <!-- Middle Book -->
      <path d="M-30 5 L20 13 L45 -2 L-5 -10 Z" fill="#ec4899" />
      <path d="M-30 5 L-30 9 L-5 4 L-5 0 Z" fill="#be185d" />
      <path d="M-5 -10 L45 -2 L45 2 L-5 -6 Z" fill="#f472b6" />

      <!-- Top Book -->
      <path d="M-25 -5 L25 3 L40 -10 L-10 -18 Z" fill="#38bdf8" />
      <path d="M-25 -5 L-25 -1 L-10 -14 L-10 -18 Z" fill="#0284c7" />
      <path d="M-10 -18 L40 -10 L40 -6 L-10 -14 Z" fill="#7dd3fc" />
    </g>

    <!-- Open Textbook & Learning Magic (Centerpiece) -->
    <g id="open-book" transform="translate(120, 150)">
      <!-- Book Shadow -->
      <ellipse cx="0" cy="20" rx="55" ry="12" fill="#000000" opacity="0.3" />

      <!-- Book Cover (Bottom/Back) -->
      <path d="M-55 10 L0 25 L55 10 L55 14 L0 30 L-55 14 Z" fill="#854d0e" />

      <!-- Left Page -->
      <path d="M-52 5 C-30 15 0 20 0 20 L0 -15 C-25 -15 -45 -5 -52 5 Z" fill="#f8fafc" />
      <!-- Right Page -->
      <path d="M52 5 C30 15 0 20 0 20 L0 -15 C25 -15 45 -5 52 5 Z" fill="#f1f5f9" />
      
      <!-- Book Spine Center -->
      <line x1="0" y1="20" x2="0" y2="-15" stroke="#cbd5e1" stroke-width="2" />

      <!-- Fake Text Lines Left -->
      <line x1="-42" y1="-2" x2="-15" y2="3" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="-40" y1="3" x2="-20" y2="7" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="-45" y1="8" x2="-15" y2="13" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

      <!-- Fake Text Lines Right -->
      <line x1="15" y1="-2" x2="42" y2="3" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="20" y1="3" x2="40" y2="7" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="15" y1="8" x2="45" y2="13" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

      <!-- Rising Educational Magic / Icons from Book -->
      <!-- Lightbulb (Idea / Education) -->
      <g transform="translate(0, -35)" filter="url(#shadow)">
        <circle cx="0" cy="0" r="14" fill="#fbbf24" />
        <path d="M-5 10 L5 10 L3 15 L-3 15 Z" fill="#94a3b8" />
        <path d="M-8 -3 C-8 -8 -4 -12 0 -12 C4 -12 8 -8 8 -3 C8 2 4 4 2 7 L-2 7 C-4 4 -8 2 -8 -3 Z" fill="#fef3c7" opacity="0.6" />
        <!-- Filament -->
        <path d="M-2 2 C-2 -1 2 -1 2 2" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Floating Sparkles / Stars -->
      <path d="M-30 -25 L-27 -30 L-24 -25 L-29 -22 Z" fill="#fb923c" />
      <path d="M32 -20 L35 -26 L38 -20 L33 -17 Z" fill="#38bdf8" />
      <circle cx="-20" cy="-10" r="2.5" fill="#10b981" />
      <circle cx="25" cy="-8" r="2" fill="#ec4899" />
    </g>

    <!-- Graduation Cap (Academic Achievement) perched on book stack / desk -->
    <g id="grad-cap" transform="translate(90, 115)">
      <!-- Cap Shadow -->
      <ellipse cx="0" cy="15" rx="18" ry="6" fill="#000000" opacity="0.3" />
      <!-- Skull cap / base -->
      <path d="M-10 5 C-10 12 10 12 10 5 Z" fill="#0f172a" />
      <!-- Diamond Top -->
      <polygon points="0,0 24,7 0,14 -24,7" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Button Center -->
      <circle cx="0" cy="7" r="2" fill="#f59e0b" />
      <!-- Tassel -->
      <path d="M0 7 C10 8 16 14 18 22" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
      <circle cx="18" cy="23" r="2" fill="#f59e0b" />
    </g>

    <!-- Apple for Teacher / School Tradition -->
    <g id="apple" transform="translate(155, 142)">
      <!-- Apple Shadow -->
      <ellipse cx="0" cy="10" rx="9" ry="3" fill="#000000" opacity="0.4" />
      <!-- Apple Body -->
      <circle cx="0" cy="3" r="9" fill="#ef4444" />
      <circle cx="-4" cy="2" r="7" fill="#dc2626" />
      <!-- Highlight -->
      <ellipse cx="-3" cy="0" rx="2" ry="3" fill="#f87171" transform="rotate(-20 -3 0)" />
      <!-- Stem -->
      <path d="M0 -6 C2 -10 4 -10 6 -8" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
      <!-- Leaf -->
      <path d="M3 -8 C7 -12 10 -7 6 -5 C4 -4 2 -6 3 -8 Z" fill="#10b981" />
    </g>
  </g>

  <!-- Foreground / Depth Elements (Pencil Holder / Stationery) -->
  <g id="stationery-cup" transform="translate(30, 135)">
    <!-- Cup Body -->
    <path d="M-12 0 L12 0 L10 30 L-10 30 Z" fill="#475569" />
    <ellipse cx="0" cy="0" rx="12" ry="4" fill="#64748b" />
    <ellipse cx="0" cy="0" rx="9" ry="2.5" fill="#1e293b" />
    
    <!-- Pencils and Ruler inside -->
    <rect x="-7" y="-20" width="3" height="25" rx="1" fill="#f59e0b" transform="rotate(-15 -7 -20)" />
    <polygon points="-9,-23 -7,-27 -5,-23" fill="#ef4444" transform="rotate(-15 -7 -20)" />

    <rect x="-1" y="-25" width="3" height="30" rx="1" fill="#38bdf8" transform="rotate(5 -1 -25)" />
    <polygon points="-3,-28 -1,-32 1,-28" fill="#10b981" transform="rotate(5 -1 -25)" />

    <rect x="4" y="-18" width="4" height="23" rx="1" fill="#ec4899" transform="rotate(20 4 -18)" />
  </g>

  <!-- Ambient Floating Particles (Focus & Energy) -->
  <circle cx="45" cy="90" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="25" cy="110" r="2" fill="#f59e0b" opacity="0.8" />
  <circle cx="195" cy="95" r="2" fill="#ec4899" opacity="0.7" />
  <circle cx="210" cy="130" r="1.5" fill="#10b981" opacity="0.5" />
  <circle cx="130" cy="80" r="2.5" fill="#fbbf24" opacity="0.4" />
</svg>