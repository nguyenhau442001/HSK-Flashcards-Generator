<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Restart Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Filter for glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient lighting / window glow -->
  <path d="M160 0 L240 0 L240 120 Z" fill="#38bdf8" opacity="0.03" />
  <circle cx="200" cy="40" r="80" fill="#38bdf8" filter="url(#glow)" opacity="0.05" />

  <!-- Back Wall Details -->
  <line x1="0" y1="140" x2="240" y2="140" stroke="#0f172a" stroke-width="2" />
  
  <!-- Desk Setup (Surface) -->
  <path d="M0 165 L240 165 L240 240 L0 240 Z" fill="url(#deskGrad)" />
  <path d="M0 165 L240 165" stroke="#475569" stroke-width="3" opacity="0.5" />

  <!-- Environment Props: Desk Lamp -->
  <g opacity="0.9">
    <!-- Lamp Base -->
    <ellipse cx="200" cy="170" rx="14" ry="6" fill="#64748b" />
    <!-- Lamp Stand -->
    <path d="M200 170 L210 110 L195 105" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp Head -->
    <path d="M180 95 L210 95 L215 110 L175 110 Z" fill="#cbd5e1" />
    <!-- Light Cone -->
    <polygon points="195,110 140,205 210,205" fill="#f59e0b" opacity="0.07" />
  </g>

  <!-- Environment Props: Coffee Mug -->
  <g transform="translate(25, 150)">
    <rect x="0" y="5" width="16" height="18" rx="3" fill="#cbd5e1" />
    <path d="M16 9 C21 9, 21 19, 16 19" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="8" cy="5" rx="8" ry="3" fill="#e2e8f0" />
    <!-- Coffee Surface -->
    <ellipse cx="8" cy="6" rx="6" ry="2" fill="#78350f" />
    <!-- Steam -->
    <path d="M5 -1 C3 -4, 9 -7, 6 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Main Subject: Broken/Glitching Computer Setup -->
  <g transform="translate(35, 45)">
    <!-- Monitor Stand -->
    <path d="M60 110 L80 110 L85 125 L55 125 Z" fill="#475569" />
    <rect x="35" y="125" width="70" height="6" rx="3" fill="#64748b" />

    <!-- Monitor Frame -->
    <rect x="5" y="5" width="130" height="105" rx="8" fill="#334155" stroke="#475569" stroke-width="3" />
    
    <!-- Inner Screen -->
    <rect x="12" y="12" width="116" height="91" rx="4" fill="#0f172a" />
    
    <!-- Screen Glitch / Error Visuals -->
    <rect x="12" y="12" width="116" height="91" rx="4" fill="url(#screenGlow)" />
    
    <!-- Error Dialog Box inside Screen -->
    <rect x="26" y="28" width="88" height="55" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="40" cy="45" r="7" fill="#ef4444" />
    <path d="M37 42 L43 48 M43 42 L37 48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Error lines graphic -->
    <rect x="52" y="41" width="48" height="5" rx="2.5" fill="#ef4444" opacity="0.8" />
    <rect x="52" y="52" width="30" height="4" rx="2" fill="#64748b" />

    <!-- Glitch artifacts on screen -->
    <rect x="20" y="18" width="40" height="3" fill="#38bdf8" opacity="0.6" />
    <rect x="80" y="85" width="35" height="3" fill="#ec4899" opacity="0.6" />
    <line x1="15" y1="70" x2="50" y2="70" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2" opacity="0.5" />
  </g>

  <!-- Action Element: The "Restart" / "Start Over" Glowing Floating Interface & Cursor -->
  <g transform="translate(100, 105)">
    <!-- Glowing Aura -->
    <circle cx="20" cy="20" r="35" fill="#f59e0b" filter="url(#glow)" opacity="0.25" />

    <!-- Main Restart Button (Circular Arrow Concept) -->
    <circle cx="20" cy="20" r="22" fill="url(#btnGrad)" stroke="#fed7aa" stroke-width="2.5" />
    
    <!-- Dynamic Curved Arrow / Reset Icon -->
    <path d="M11 13 A 10 10 0 1 1 10 23" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <path d="M7 19 L11 23 L15 18" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sparkles / Action Energy -->
    <path d="M -8 -8 L -4 -4" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <path d="M 45 45 L 40 40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <path d="M 45 -5 L 40 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="-12" cy="15" r="2" fill="#38bdf8" />
    <circle cx="35" cy="-15" r="2.5" fill="#f59e0b" />
  </g>

  <!-- Animated-style Hand / Cursor Clicking the Button -->
  <g transform="translate(130, 130)">
    <!-- Sleeve Cuff -->
    <path d="M25 45 L50 25 L65 40 L40 60 Z" fill="#6366f1" />
    <!-- Arm -->
    <path d="M40 35 L75 5" fill="none" stroke="#f1f5f9" stroke-width="16" stroke-linecap="round" />
    <!-- Hand Palm & Thumb -->
    <circle cx="12" cy="10" r="10" fill="#f8fafc" />
    <path d="M8 18 C3 15, -2 10, 2 5" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />
    <!-- Index Finger Pointing/Pressing -->
    <path d="M12 10 L-2 -2" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
    <!-- Finger tip highlight -->
    <circle cx="-2" cy="-2" r="3.5" fill="#e2e8f0" />
  </g>

  <!-- Floating particles for vivid atmosphere -->
  <circle cx="50" cy="30" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="190" cy="80" r="2" fill="#f59e0b" opacity="0.5" />
  <circle cx="110" cy="25" r="1" fill="#ffffff" opacity="0.8" />
  <circle cx="25" cy="115" r="2" fill="#ec4899" opacity="0.4" />
</svg>