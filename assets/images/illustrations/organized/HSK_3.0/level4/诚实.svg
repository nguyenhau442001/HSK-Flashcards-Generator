<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Wooden Desk Surface -->
  <path d="M0 170 L240 170 L240 230 C240 235.5 235.5 240 230 240 L10 240 C4.5 240 0 235.5 0 230 Z" fill="#334155"/>
  <path d="M0 170 L240 170 L240 176 L0 176 Z" fill="#475569"/>
  <line x1="20" y1="173" x2="80" y2="173" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="173" x2="210" y2="173" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Background Wall Details -->
  <rect x="35" y="40" width="50" height="70" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="60" cy="70" r="15" fill="#38bdf8" opacity="0.3"/>
  <path d="M45 95 Q60 85 75 95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Ambient Lamp Light Cone -->
  <polygon points="190,0 150,170 230,170" fill="url(#beamGrad)"/>

  <!-- Open Wooden Treasure Chest / Box of Truth (Centerpiece) -->
  <!-- Box Back Wall (Inside) -->
  <path d="M70 120 L170 120 L170 160 L70 160 Z" fill="#78350f"/>
  
  <!-- Box Base -->
  <path d="M60 160 L180 160 L190 185 L50 185 Z" fill="#92400e"/>
  <path d="M50 185 L190 185 L185 192 L55 192 Z" fill="#451a03"/>
  
  <!-- Glowing Heart/Gem Symbolizing Honest Core / Pure Intent -->
  <g transform="translate(120, 135)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="url(#lampGlow)"/>
    <path d="M0 14 C-12 4 -22 -6 -14 -16 C-8 -22 0 -14 0 -14 C0 -14 8 -22 14 -16 C22 -6 12 4 0 14 Z" fill="#fb923c"/>
    <path d="M0 10 C-8 3 -15 -4 -10 -11 C-6 -15 0 -10 0 -10 C0 -10 6 -15 10 -11 C15 -4 8 3 0 10 Z" fill="#f43f5e"/>
    <!-- Sparkles -->
    <path d="M-18 -8 L-12 -8 L-15 -14 Z" fill="#fef08a"/>
    <path d="M15 -2 L20 -5 L15 -8 Z" fill="#fef08a"/>
  </g>

  <!-- Box Front Rim & Details -->
  <path d="M60 160 L180 160 L180 168 L60 168 Z" fill="#b45309"/>
  <rect x="112" y="158" width="16" height="14" rx="2" fill="#fbbf24"/>
  <circle cx="120" cy="165" r="2" fill="#78350f"/>

  <!-- Box Open Lid (Angled Upwards) -->
  <!-- Lid Back -->
  <path d="M60 120 L180 120 L175 95 L65 95 Z" fill="#78350f"/>
  <!-- Lid Top/Outer -->
  <path d="M55 95 L185 95 L180 85 L60 85 Z" fill="#b45309"/>
  <!-- Metal Hinges & Straps -->
  <rect x="75" y="90" width="8" height="70" rx="2" fill="#fbbf24" opacity="0.8"/>
  <rect x="157" y="90" width="8" height="70" rx="2" fill="#fbbf24" opacity="0.8"/>

  <!-- Foreground Props: Magnifying Glass of Truth / Examination -->
  <g transform="translate(80, 185) rotate(-15)">
    <!-- Glass Handle -->
    <rect x="-6" y="20" width="12" height="40" rx="6" fill="#78350f"/>
    <rect x="-3" y="25" width="6" height="30" rx="3" fill="#92400e"/>
    <!-- Rim -->
    <circle cx="0" cy="0" r="24" fill="#334155" stroke="#fbbf24" stroke-width="4"/>
    <!-- Lens Reflection -->
    <circle cx="0" cy="0" r="20" fill="#38bdf8" opacity="0.25"/>
    <path d="M-10 -10 Q 0 -15 10 -10 Q 5 5 -10 -10 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Floating Golden Sparkles / Aura of Integrity -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M35 130 L37 136 L43 138 L37 140 L35 146 L33 140 L27 138 L33 136 Z" transform="scale(0.8) translate(10, 10)" opacity="0.9"/>
    <!-- Star 2 -->
    <path d="M205 110 L207 114 L211 116 L207 118 L205 122 L203 118 L199 116 L203 114 Z" transform="scale(1.2) translate(10, -10)" opacity="0.8"/>
    <!-- Star 3 -->
    <path d="M100 70 L102 75 L107 77 L102 79 L100 84 L98 79 L93 77 L98 75 Z" transform="scale(0.7) translate(30, 20)" opacity="0.7"/>
    <!-- Small glowing dots -->
    <circle cx="150" cy="100" r="3" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="85" cy="115" r="2" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="130" cy="95" r="2.5" fill="#fef08a"/>
  </g>

  <!-- Gentle Ambient Lighting & Vignette Overlay -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="70%" stop-color="#0f172a" stop-opacity="0"/>
    <stop offset="100%" stop-color="#090d16" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none"/>
</svg>