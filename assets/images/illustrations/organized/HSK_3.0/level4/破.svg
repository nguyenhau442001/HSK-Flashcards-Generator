<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment (Laundry Room / Closet hint) -->
  <path d="M40 190 L200 190" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- Hanger hanging from top -->
  <path d="M120 40 L120 60 M100 65 L140 65 L120 60 Z" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Subject: Torn Shirt (Cái áo bị rách) -->
  <g transform="translate(0, 15)">
    <!-- Shadow beneath shirt -->
    <ellipse cx="120" cy="180" rx="55" ry="10" fill="#020617" opacity="0.6"/>

    <!-- Shirt Base (Bright energetic color) -->
    <path d="M90 60 
             L70 70 L55 90 L75 110 L90 100 
             L90 170 L150 170 L150 100 
             L165 110 L185 90 L170 70 L150 60 
             Q135 68 120 68 Q105 68 90 60 Z" 
          fill="#38bdf8" stroke="#0ea5e9" stroke-width="3" stroke-linejoin="round"/>

    <!-- Collar detail -->
    <path d="M90 60 Q120 85 150 60" fill="none" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>
    <path d="M105 63 Q120 78 135 63" fill="#0ea5e9" opacity="0.3"/>

    <!-- Vertical button seam & buttons -->
    <line x1="120" y1="68" x2="120" y2="160" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="120" cy="90" r="3" fill="#e0f2fe"/>
    <circle cx="120" cy="115" r="3" fill="#e0f2fe"/>
    <circle cx="120" cy="140" r="3" fill="#e0f2fe"/>

    <!-- Fold lines / shading -->
    <path d="M90 100 L90 150" stroke="#0284c7" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <path d="M150 100 L150 150" stroke="#0284c7" stroke-width="3" opacity="0.4" stroke-linecap="round"/>

    <!-- THE TEAR / RIP (破) - Dramatic jagged hole in fabric -->
    <g transform="translate(115, 110)">
      <!-- Dark void behind the tear -->
      <path d="M -10 -15 L 15 -10 L 20 15 L -5 20 L -15 5 Z" fill="#090d16"/>
      
      <!-- Frayed fabric edges & loose threads -->
      <path d="M-12 -18 L-8 -12 L-14 -5" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 -12 L12 -5 L22 8" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 18 L5 12 L10 22" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-8 18 L-2 10 L-12 15" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Ragged hole flaps curling outward -->
      <path d="M-12 -18 Q-5 -15 0 -20 Q5 -12 18 -12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <path d="M18 -12 Q20 5 22 8 Q10 15 15 18" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <path d="M15 18 Q0 12 -5 20 Q-10 12 -8 18" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <path d="M-8 18 Q-15 5 -12 -18" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Loose hanging thread action lines -->
      <path d="M5 12 Q15 25 25 22" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-5 10 Q-18 20 -25 15" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Atmospheric Context Props & Action Sparks -->
  <!-- Floating fiber dust / tension effects -->
  <circle cx="85" cy="100" r="2.5" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="155" cy="130" r="2" fill="#fbbf24"/>
  <circle cx="140" cy="90" r="1.5" fill="#38bdf8"/>
  <circle cx="95" cy="150" r="2" fill="#38bdf8"/>

  <!-- Sewing needle hinting at repair/damage context -->
  <g transform="translate(170, 140) rotate(35)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="3" cy="0" rx="1.5" ry="0.8" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Thread coming out of needle -->
    <path d="M3 0 Q-10 -5 -25 5" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Safety Pin floating near the tear for narrative depth -->
  <g transform="translate(70, 125) rotate(-25)">
    <path d="M 0 0 C 10 -15 25 -15 35 0 C 25 5 10 5 0 0 Z" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="17" y1="-8" x2="17" y2="2" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="17" cy="-9" r="1" fill="#cbd5e1"/>
  </g>

  <!-- Dramatic Accent glow around the tear -->
  <circle cx="130" cy="125" r="25" fill="#f43f5e" opacity="0.15" filter="url(#glow)"/>
</svg>