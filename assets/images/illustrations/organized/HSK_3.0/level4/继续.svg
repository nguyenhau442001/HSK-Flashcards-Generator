<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric background glow / study desk gradient surface -->
  <defs>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#deskGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Light beam from desk lamp -->
  <polygon points="120,40 210,210 30,210" fill="url(#beamGrad)" />

  <!-- Scene Elements: Desk Surface -->
  <path d="M 0,190 L 240,190 L 240,240 L 0,240 Z" fill="#0b0f19"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- Open Study Book / Notebook -->
  <g filter="url(#shadow)">
    <!-- Book Shadow -->
    <path d="M 50,165 L 190,165 L 180,185 L 60,185 Z" fill="#020617" opacity="0.7"/>
    <!-- Left Page -->
    <path d="M 120,135 C 100,132 70,135 50,145 L 50,178 C 70,168 100,165 120,168 Z" fill="#f8fafc"/>
    <!-- Right Page -->
    <path d="M 120,135 C 140,132 170,135 190,145 L 190,178 C 170,168 140,165 120,168 Z" fill="#f1f5f9"/>
    <!-- Book Spine -->
    <path d="M 118,135 L 122,135 L 122,168 L 118,168 Z" fill="#cbd5e1"/>
    
    <!-- Abstract study lines (no real text) -->
    <line x1="62" y1="152" x2="95" y2="150" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="160" x2="105" y2="157" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="145" y1="150" x2="178" y2="152" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="135" y1="157" x2="178" y2="160" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug / Hot Drink (Context Prop) -->
  <g filter="url(#shadow)">
    <ellipse cx="195" cy="145" rx="12" ry="5" fill="#e2e8f0"/>
    <path d="M 183,145 L 187,175 C 187,178 190,180 195,180 C 200,180 203,178 203,175 L 207,145 Z" fill="#f43f5e"/>
    <path d="M 205,152 C 212,152 214,162 206,166" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Steam wisps representing ongoing energy -->
    <path d="M 192,133 C 195,128 190,123 194,118" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 199,130 C 196,125 201,120 197,115" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Desk Lamp (Top Left) -->
  <path d="M 20,40 L 40,40 L 50,60 L 10,60 Z" fill="#334155"/>
  <path d="M 30,60 L 30,190" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <circle cx="30" cy="190" r="10" fill="#334155"/>

  <!-- MAIN DYNAMIC ELEMENT: The "CONTINUE" Action Symbol (Glowing Play / Fast-Forward Vector Suite) -->
  <g filter="url(#shadow)">
    <!-- Outer Pulsing Ring / Aura -->
    <circle cx="120" cy="85" r="38" fill="#10b981" opacity="0.2"/>
    <circle cx="120" cy="85" r="30" fill="#059669" opacity="0.4"/>
    
    <!-- Main Circular Badge -->
    <circle cx="120" cy="85" r="24" fill="#10b981"/>
    <circle cx="120" cy="85" r="24" fill="url(#lampGlow)" opacity="0.5"/>

    <!-- Double Forward Triangles (The universal 'Continue / Keep Going' symbol) -->
    <!-- First triangle -->
    <polygon points="110,72 122,85 110,98" fill="#ffffff"/>
    <!-- Second triangle (offset to show momentum) -->
    <polygon points="122,72 134,85 122,98" fill="#ffffff"/>
    
    <!-- Motion lines / Action speed marks -->
    <path d="M 148,77 L 158,75" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 152,85 L 164,85" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 148,93 L 158,95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <path d="M 92,77 L 82,75" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M 88,85 L 76,85" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 92,93 L 82,95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Glowing particles / Sparkles for lively learning vibe -->
  <circle cx="75" cy="55" r="3" fill="#fbbf24"/>
  <circle cx="165" cy="50" r="2" fill="#38bdf8"/>
  <circle cx="160" cy="115" r="2.5" fill="#ec4899"/>
  <circle cx="85" cy="120" r="2" fill="#10b981"/>

  <!-- Sparkle Star shape top right -->
  <path d="M 175,35 Q 175,45 185,45 Q 175,45 175,55 Q 175,45 165,45 Q 175,45 175,35 Z" fill="#fbbf24"/>
  <path d="M 65,95 Q 65,100 70,100 Q 65,100 65,105 Q 65,100 60,100 Q 65,100 65,95 Z" fill="#38bdf8"/>
</svg>