<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wood Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Map Paper Gradient -->
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Travel Photo Gradient -->
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Highlighter Yellow Gradient -->
    <linearGradient id="highlighterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow in background -->
  <circle cx="180" cy="60" r="50" fill="#38bdf8" opacity="0.08" filter="blur(20px)"/>
  <circle cx="60" cy="180" r="60" fill="#f59e0b" opacity="0.08" filter="blur(20px)"/>

  <!-- Wooden Desk / Surface at bottom -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#475569" stroke-width="2"/>

  <!-- SCENE: TRAVEL PLANNING (Representing '计划' - Plan) -->
  
  <!-- Stack of Travel Photos (Secondary Prop) -->
  <g transform="rotate(-8 60 150)" filter="url(#softShadow)">
    <rect x="35" y="115" width="50" height="60" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="40" y="120" width="40" height="38" fill="url(#photoGrad)"/>
    <!-- Mountain drawing in photo -->
    <path d="M 40 148 L 52 132 L 64 145 L 72 136 L 80 148 Z" fill="#e0f2fe"/>
    <circle cx="70" cy="128" r="4" fill="#fef08a"/>
  </g>

  <!-- Passport (Secondary Prop) -->
  <g transform="rotate(15 180 150)" filter="url(#softShadow)">
    <rect x="155" y="120" width="45" height="55" rx="4" fill="#b91c1c" stroke="#991b1b" stroke-width="1.5"/>
    <rect x="160" y="125" width="35" height="45" rx="2" fill="none" stroke="#fca5a5" stroke-width="1" opacity="0.6"/>
    <!-- Gold Foil Crest -->
    <circle cx="177" cy="142" r="8" fill="#fbbf24"/>
    <path d="M 174 142 L 180 142 M 177 139 L 177 145" stroke="#991b1b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: The Travel Map / Itinerary (计划 - Plan) -->
  <g filter="url(#shadow)">
    <!-- Main Map Sheet, slightly folded/angled -->
    <path d="M 55 50 L 185 40 L 195 160 L 65 170 Z" fill="url(#mapGrad)" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Map Grid lines & Topography -->
    <path d="M 75 75 Q 120 65 160 85" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="4 4"/>
    <path d="M 70 110 Q 130 130 170 100" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Decorative Map Terrain Icons (Mountains & Trees) -->
    <path d="M 85 95 L 92 80 L 99 95 Z" fill="#cbd5e1"/>
    <path d="M 93 98 L 98 88 L 103 98 Z" fill="#94a3b8"/>
    <circle cx="150" cy="130" r="12" fill="#dbeafe" opacity="0.6"/> <!-- Lake -->

    <!-- Route Path with Waypoints (The Plan) -->
    <path d="M 75 145 C 90 100, 130 150, 165 75" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 3"/>
    
    <!-- Start Pin -->
    <circle cx="75" cy="145" r="5" fill="#ef4444"/>
    <circle cx="75" cy="145" r="2" fill="#ffffff"/>

    <!-- Destination Flag / Pin -->
    <g transform="translate(160, 60)">
      <path d="M 5 20 L 5 0 L 18 8 L 5 16 Z" fill="#f59e0b" filter="url(#softShadow)"/>
      <line x1="5" y1="0" x2="5" y2="25" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="5" cy="25" r="3" fill="#334155"/>
    </g>

    <!-- Highlighter Streak emphasizing the plan -->
    <path d="M 85 82 Q 120 70 155 90" fill="none" stroke="url(#highlighterGrad)" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Coffee Mug (Context Prop for working on plans) -->
  <g transform="translate(30, 90)" filter="url(#shadow)">
    <!-- Mug Body -->
    <path d="M 10 10 L 25 55 L 45 55 L 60 10 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Coffee Surface -->
    <ellipse cx="35" cy="10" rx="22" ry="5" fill="#78350f"/>
    <!-- Mug Handle -->
    <path d="M 8 18 C -2 18, -2 42, 13 45" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 30 0 C 25 -8, 35 -12, 30 -20" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 40 -2 C 45 -10, 35 -14, 40 -22" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Pen / Pencil (Active planning tool) -->
  <g transform="translate(130, 110) rotate(-35)" filter="url(#shadow)">
    <!-- Pencil Body -->
    <polygon points="0,0 10,-3 65,45 55,48" fill="#f59e0b"/>
    <polygon points="10,-3 15,-4.5 70,43.5 65,45" fill="#fbbf24"/>
    <polygon points="5,-1.5 10,-3 55,48 50,49.5" fill="#d97706"/>
    <!-- Pencil Tip -->
    <polygon points="0,0 5,-1.5 2,3" fill="#cbd5e1"/>
    <polygon points="0,0 2,3 1,4" fill="#1e293b"/>
    <!-- Eraser / Ferrule at back -->
    <rect x="55" y="42" width="6" height="8" transform="rotate(32 55 42)" fill="#94a3b8"/>
    <rect x="61" y="45.5" width="8" height="8" transform="rotate(32 61 45.5)" fill="#f43f5e"/>
  </g>

  <!-- Sparkles / Success Indicators (Highlighting the "Completed Plan" feeling) -->
  <g transform="translate(190, 40)">
    <path d="M 0 10 Q 0 0 10 0 Q 0 0 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(45, 45) scale(0.6)">
    <path d="M 0 10 Q 0 0 10 0 Q 0 0 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(125, 30) scale(0.8)">
    <path d="M 0 10 Q 0 0 10 0 Q 0 0 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Z" fill="#f43f5e"/>
  </g>

</svg>