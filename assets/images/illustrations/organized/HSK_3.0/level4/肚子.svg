<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Environment -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Blanket Gradient -->
    <linearGradient id="blanketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Hot Water Bag Gradient -->
    <linearGradient id="hotWaterBagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <circle cx="120" cy="120" r="100" fill="url(#lampGlow)" />

  <!-- Room Environment Props (Background) -->
  <g id="environment">
    <!-- Bed headboard -->
    <rect x="30" y="150" width="180" height="10" rx="5" fill="#334155" />
    
    <!-- Nightstand / Table edge -->
    <rect x="170" y="160" width="50" height="60" rx="4" fill="#1e293b" opacity="0.8" />
    
    <!-- Warm Desk Lamp / Cup on Nightstand -->
    <path d="M190,160 L195,140 L205,140 L210,160 Z" fill="#475569" />
    <circle cx="200" cy="135" r="8" fill="#fbbf24" />
  </g>

  <!-- Character / Main Subject (Focus on 'Bùzi' / Tummyache context) -->
  <g id="character-and-bed">
    <!-- Pillow -->
    <rect x="75" y="115" width="90" height="40" rx="12" fill="#64748b" />
    
    <!-- Under Blanket Body Contour -->
    <!-- Cozy Winter Blanket covering the body up to chest -->
    <path d="M40,210 C40,160 80,150 120,150 C160,150 200,160 200,210 Z" fill="url(#blanketGrad)" />
    
    <!-- Blanket fold/rim detail -->
    <path d="M45,160 C90,153 150,153 195,160" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Character Head and Expression -->
    <!-- Hair -->
    <path d="M90,115 C90,95 150,95 150,115 Z" fill="#0f172a" />
    <!-- Face Circle -->
    <circle cx="120" cy="115" r="22" fill="#fed7aa" />
    
    <!-- Closed uneasy eyes (expressing slight pain/discomfort) -->
    <path d="M109,114 Q113,118 117,114" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M123,114 Q127,118 131,114" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Wince mouth -->
    <path d="M116,126 Q120,123 124,126" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Rosy/Pale Cheeks -->
    <circle cx="107" cy="120" r="4" fill="#f87171" opacity="0.4" />
    <circle cx="133" cy="120" r="4" fill="#f87171" opacity="0.4" />

    <!-- Sweat Drop (Classic comic sign of discomfort) -->
    <path d="M136,100 C136,100 140,106 140,109 C140,111 138,113 136,113 C134,113 132,111 132,109 C132,106 136,100 136,100 Z" fill="#38bdf8" opacity="0.85" />

    <!-- ARMS HOLDING THE TUMMY (Central HSK target focus: Bùzi) -->
    <!-- Left arm curving to tummy -->
    <path d="M95,155 C95,165 105,175 115,175" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Right arm curving to tummy -->
    <path d="M145,155 C145,165 135,175 125,175" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Hot Water Bag placed gently on the tummy -->
    <g transform="translate(108, 160)">
      <!-- Bag Body -->
      <rect x="0" y="0" width="24" height="28" rx="8" fill="url(#hotWaterBagGrad)" />
      <!-- Cap / Neck -->
      <rect x="8" y="-5" width="8" height="6" rx="2" fill="#9f1239" />
      <!-- Tiny White Cross/Heart accent on bag -->
      <path d="M12,10 L12,18 M8,14 L16,14" stroke="#ffe4e6" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Hands resting over the hot water bag -->
    <circle cx="114" cy="172" r="7" fill="#fed7aa" />
    <circle cx="126" cy="172" r="7" fill="#fed7aa" />
  </g>

  <!-- Foreground Atmospheric Elements / Comfort items -->
  <g id="foreground-props">
    <!-- Medicine Cup on the nightstand -->
    <rect x="180" y="195" width="14" height="18" rx="2" fill="#f1f5f9" />
    <path d="M182,190 L192,190 L190,195 L184,195 Z" fill="#cbd5e1" />
    <!-- Liquid inside cup -->
    <rect x="182" y="200" width="10" height="11" fill="#34d399" opacity="0.7" />

    <!-- Ambient glowing cozy particles -->
    <circle cx="60" cy="90" r="2" fill="#fbbf24" opacity="0.6" />
    <circle cx="180" cy="80" r="1.5" fill="#fbbf24" opacity="0.4" />
    <circle cx="45" cy="130" r="1" fill="#fbbf24" opacity="0.5" />
  </g>
</svg>