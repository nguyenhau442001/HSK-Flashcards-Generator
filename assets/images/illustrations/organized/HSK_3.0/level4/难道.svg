<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light Cone -->
    <linearGradient id="lightCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Desk & Lamp Gradients -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Room Interior) -->
  <g opacity="0.6">
    <!-- Bookshelf in background -->
    <rect x="25" y="45" width="40" height="75" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="70" x2="65" y2="70" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="95" x2="65" y2="95" stroke="#334155" stroke-width="2"/>
    <!-- Colorful books -->
    <rect x="30" y="52" width="8" height="18" rx="1" fill="#ec4899"/>
    <rect x="40" y="50" width="10" height="20" rx="1" fill="#10b981"/>
    <rect x="52" y="55" width="8" height="15" rx="1" fill="#fb923c"/>
    <rect x="30" y="77" width="12" height="18" rx="1" fill="#38bdf8"/>
    <rect x="45" y="80" width="7" height="15" rx="1" fill="#fbbf24"/>

    <!-- Window with night city view -->
    <rect x="175" y="40" width="40" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="195" y1="40" x2="195" y2="100" stroke="#334155" stroke-width="2"/>
    <!-- City lights outside -->
    <rect x="181" y="65" width="4" height="8" fill="#fbbf24" opacity="0.8"/>
    <rect x="188" y="55" width="4" height="18" fill="#38bdf8" opacity="0.8"/>
    <rect x="202" y="70" width="5" height="12" fill="#ec4899" opacity="0.8"/>
  </g>

  <!-- Desk Surface -->
  <path d="M20 175 L220 175 L235 210 L5 210 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="10" y="200" width="220" height="8" fill="#0f172a" opacity="0.5"/>

  <!-- Desk Props: Laptop & Glowing Screen (representing realization/puzzle) -->
  <g transform="translate(130, 135)">
    <!-- Laptop Base -->
    <path d="M -15 35 L 55 35 L 65 42 L -25 42 Z" fill="#64748b"/>
    <!-- Laptop Screen -->
    <rect x="-18" y="-10" width="70" height="47" rx="4" fill="#334155"/>
    <rect x="-14" y="-6" width="62" height="39" rx="2" fill="url(#screenGrad)"/>
    <!-- Question mark graphic on screen representing "Could it be?!" -->
    <path d="M 11 5 C 11 2 14 0 17 0 C 20 0 23 2 23 5 C 23 8 17 9 17 13 L 17 15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="17" cy="20" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Desk Prop: Coffee Mug -->
  <g transform="translate(38, 160)">
    <rect x="0" y="0" width="14" height="16" rx="3" fill="#cbd5e1"/>
    <path d="M 14 3 C 18 3 18 11 14 11" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Steam -->
    <path d="M 4 -3 C 4 -6 7 -6 7 -9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 10 -4 C 10 -7 7 -7 7 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Desk Lamp & Golden Light Cone -->
  <polygon points="90,40 60,170 120,170" fill="url(#lightCone)" style="mix-blend-mode: screen;"/>
  <g transform="translate(85, 35)">
    <path d="M 0 0 L 10 0 L 15 15 L -5 15 Z" fill="#f59e0b"/>
    <path d="M 5 15 L 5 45" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="5" cy="45" r="8" fill="#334155"/>
  </g>

  <!-- MAIN CHARACTER: Expressing 'Could it be?!' (Chẳng lẽ) -->
  <g transform="translate(75, 75)">
    <!-- Body & Shirt -->
    <path d="M 15 70 C 15 55 30 50 45 50 C 60 50 75 55 75 70 L 85 100 L 5 100 Z" fill="url(#shirtGrad)"/>
    <!-- Collar -->
    <path d="M 33 50 L 45 62 L 57 50 Z" fill="#ffffff"/>

    <!-- Neck -->
    <rect x="37" y="38" width="16" height="15" rx="6" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="45" cy="28" r="22" fill="#fed7aa"/>

    <!-- Hair -->
    <path d="M 23 28 C 23 15 33 10 45 10 C 57 10 67 15 67 28 C 67 32 65 35 65 35 C 65 35 60 20 45 18 C 30 20 25 35 25 35 C 25 35 23 32 23 28 Z" fill="url(#hairGrad)"/>

    <!-- Eyebrows (Raised high in disbelief/astonishment) -->
    <path d="M 30 20 C 32 17 37 18 39 20" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 51 20 C 53 18 58 17 60 20" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Wide Open Eyes (Shocked expression) -->
    <circle cx="34" cy="26" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="35" cy="26" r="1.5" fill="#0f172a"/>
    <circle cx="56" cy="26" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="55" cy="26" r="1.5" fill="#0f172a"/>

    <!-- Surprised Open Mouth ("O" shape for realization) -->
    <ellipse cx="45" cy="38" rx="4" ry="6" fill="#1e293b"/>

    <!-- Hand 1: Hand on cheek in realization/shock -->
    <g transform="translate(10, 38)">
      <path d="M 10 15 C 5 10 0 20 5 25 C 8 28 15 25 18 20 Z" fill="#fed7aa" stroke="#f43f5e" stroke-width="1.5"/>
      <circle cx="12" cy="18" r="5" fill="#fed7aa" stroke="#f43f5e" stroke-width="1.5"/>
      <!-- Arm -->
      <path d="M 12 22 C 15 35 25 45 35 50" fill="none" stroke="url(#shirtGrad)" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- Hand 2: Pointing forward dramatically ("Wait... could it really be?!") -->
    <g transform="translate(62, 50)">
      <!-- Arm pointing out -->
      <path d="M 10 15 L 35 5" fill="none" stroke="url(#shirtGrad)" stroke-width="10" stroke-linecap="round"/>
      <!-- Hand / Finger pointing -->
      <circle cx="35" cy="5" r="4" fill="#fed7aa"/>
      <path d="M 38 4 L 46 2" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating Dramatic Realization Particles & Sparkles (Representing 'Chẳng lẽ') -->
  <g filter="url(#glow)">
    <!-- Glowing Sparkle 1 -->
    <path d="M 50 50 L 53 58 L 61 61 L 53 64 L 50 72 L 47 64 L 39 61 L 47 58 Z" fill="#fbbf24" opacity="0.9"/>
    <!-- Glowing Sparkle 2 -->
    <path d="M 180 70 L 182 75 L 187 77 L 182 79 L 180 84 L 178 79 L 173 77 L 178 75 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Glowing Sparkle 3 -->
    <path d="M 140 30 L 141.5 34 L 145.5 35.5 L 141.5 37 L 140 41 L 138.5 37 L 134.5 35.5 L 138.5 34 Z" fill="#ec4899" opacity="0.9"/>
    
    <!-- Floating Question Marks for Emphasis -->
    <text x="35" y="45" font-family="sans-serif" font-weight="bold" font-size="22" fill="#fb923c" opacity="0.9">?</text>
    <text x="165" y="105" font-family="sans-serif" font-weight="bold" font-size="28" fill="#38bdf8" opacity="0.85">?</text>
  </g>
</svg>