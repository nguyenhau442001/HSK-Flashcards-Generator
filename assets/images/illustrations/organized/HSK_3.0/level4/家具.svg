<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Room Environment -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="wood-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <clipPath id="window-clip">
      <path d="M 170 30 L 210 30 L 210 90 L 170 90 Z"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Wallpaper accent lines & Floor -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2"/>
  <path d="M0 162 L240 162" stroke="#0f172a" stroke-width="4"/>
  <rect x="0" y="164" width="240" height="76" fill="#0f172a"/>

  <!-- Window with Night Scene & Cozy Glow -->
  <rect x="165" y="25" width="50" height="70" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="170" y="30" width="40" height="60" rx="2" fill="#0284c7" opacity="0.3"/>
  <!-- Window frames -->
  <path d="M190 30 L190 90 M170 60 L210 60" stroke="#1e293b" stroke-width="3"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M 95 0 L 95 40" stroke="#64748b" stroke-width="2"/>
  <path d="M 80 40 L 110 40 L 115 55 L 75 55 Z" fill="#38bdf8"/>
  <circle cx="95" cy="55" r="35" fill="url(#lamp-glow)"/>

  <!-- Bookshelf (Furniture Item 1) -->
  <g transform="translate(15, 60)">
    <rect x="0" y="0" width="35" height="100" fill="url(#wood-dark)" rx="2"/>
    <rect x="3" y="5" width="29" height="20" fill="#334155" opacity="0.6"/>
    <rect x="3" y="30" width="29" height="20" fill="#334155" opacity="0.6"/>
    <rect x="3" y="55" width="29" height="20" fill="#334155" opacity="0.6"/>
    <rect x="3" y="80" width="29" height="15" fill="#334155" opacity="0.6"/>
    <!-- Books on shelf -->
    <path d="M 6 18 L 12 18 L 12 23 L 6 23 Z" fill="#ec4899"/>
    <path d="M 14 16 L 19 16 L 19 23 L 14 23 Z" fill="#10b981"/>
    <path d="M 21 19 L 26 19 L 26 23 L 21 23 Z" fill="#38bdf8"/>
    <path d="M 6 42 L 15 42 L 15 48 L 6 48 Z" fill="#fbbf24"/>
  </g>

  <!-- Modern Sofa / Couch (Main Furniture Item - 'Jiā jù') -->
  <g transform="translate(55, 100)">
    <!-- Sofa Shadow -->
    <ellipse cx="65" cy="68" rx="55" ry="8" fill="#020617" opacity="0.5"/>
    
    <!-- Sofa Backrest -->
    <rect x="10" y="5" width="110" height="40" rx="12" fill="#ec4899"/>
    <rect x="15" y="10" width="50" height="30" rx="8" fill="#f472b6" opacity="0.5"/>
    <rect x="65" y="10" width="50" height="30" rx="8" fill="#f472b6" opacity="0.5"/>

    <!-- Sofa Base / Frame -->
    <rect x="5" y="35" width="120" height="30" rx="8" fill="#db2777"/>

    <!-- Sofa Cushions (Seat) -->
    <rect x="8" y="38" width="57" height="25" rx="8" fill="#f472b6"/>
    <rect x="67" y="38" width="57" height="25" rx="8" fill="#f472b6"/>

    <!-- Left Armrest -->
    <path d="M 5 20 Q 5 10 15 10 L 25 10 Q 15 10 15 35 L 5 35 Z" fill="#be185d"/>
    <rect x="0" y="20" width="15" height="40" rx="7" fill="#db2777"/>

    <!-- Right Armrest -->
    <rect x="115" y="20" width="15" height="40" rx="7" fill="#db2777"/>

    <!-- Sofa Wooden Legs -->
    <rect x="15" y="60" width="6" height="8" rx="2" fill="#b45309"/>
    <rect x="109" y="60" width="6" height="8" rx="2" fill="#b45309"/>

    <!-- Cozy Pillows on Sofa -->
    <rect x="20" y="20" width="18" height="18" rx="5" fill="#38bdf8" transform="rotate(-10 20 20)"/>
    <rect x="90" y="18" width="18" height="18" rx="5" fill="#fbbf24" transform="rotate(15 90 18)"/>
  </g>

  <!-- Coffee Table (Furniture Item 3) with Decor -->
  <g transform="translate(130, 140)">
    <!-- Table Shadow -->
    <ellipse cx="35" cy="32" rx="32" ry="6" fill="#020617" opacity="0.4"/>
    
    <!-- Tabletop -->
    <path d="M 5 15 L 65 15 L 70 25 L 0 25 Z" fill="url(#wood-dark)"/>
    <rect x="0" y="10" width="70" height="7" rx="3" fill="url(#wood-light)"/>

    <!-- Table Legs -->
    <rect x="10" y="25" width="4" height="12" rx="2" fill="#78350f"/>
    <rect x="56" y="25" width="4" height="12" rx="2" fill="#78350f"/>

    <!-- Cute Plant on Coffee Table -->
    <path d="M 30 10 L 35 3 L 40 10 Z" fill="#10b981"/>
    <ellipse cx="35" cy="10" rx="5" ry="3" fill="#059669"/>
    <!-- Teacup -->
    <rect x="18" y="7" width="6" height="5" rx="1" fill="#f8fafc"/>
  </g>

  <!-- Warm Foreground Details (Houseplant) -->
  <g transform="translate(20, 130)">
    <!-- Pot -->
    <path d="M 5 25 L 15 45 L 35 45 L 45 25 Z" fill="#cbd5e1"/>
    <ellipse cx="25" cy="25" rx="20" ry="4" fill="#94a3b8"/>
    <!-- Foliage / Stems -->
    <path d="M 25 21 Q 25 5 10 2" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 25 21 Q 30 0 45 5" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 25 21 Q 20 -5 28 -10" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Leaves -->
    <circle cx="10" cy="2" r="6" fill="#10b981"/>
    <circle cx="45" cy="5" r="7" fill="#059669"/>
    <circle cx="28" cy="-10" r="6" fill="#34d399"/>
  </g>

  <!-- Floor Rug under Sofa & Table -->
  <ellipse cx="115" cy="190" rx="85" ry="22" fill="#334155" opacity="0.6"/>
  <ellipse cx="115" cy="190" rx="75" ry="17" fill="#475569" opacity="0.4"/>

  <!-- Playful Ambient Light Particles / Sparkles -->
  <circle cx="65" cy="80" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="135" cy="70" r="2" fill="#fef08a" opacity="0.6"/>
  <circle cx="110" cy="95" r="1" fill="#fef08a" opacity="0.9"/>
  <circle cx="150" cy="120" r="1.5" fill="#38bdf8" opacity="0.7"/>
</svg>