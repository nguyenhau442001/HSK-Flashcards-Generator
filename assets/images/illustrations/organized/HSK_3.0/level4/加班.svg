<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window City Glow Gradient -->
    <linearGradient id="cityGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Desk Lamp Cone Light -->
    <linearGradient id="lampLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.05" />
    </linearGradient>

    <!-- Character Outfit Colors -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Coffee Mug Gradient -->
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT & BACKGROUND -->
  <!-- Night Window -->
  <path d="M150 30 H210 V110 H150 Z" fill="#090d16" stroke="#334155" stroke-width="3" rx="4" />
  <!-- Cityscape outside window -->
  <path d="M155 110 V70 H165 V110 H175 V50 H185 V110 H195 V80 H205 V110 Z" fill="#1e293b" />
  <circle cx="160" cy="65" r="1" fill="#fbbf24" opacity="0.8" />
  <circle cx="180" cy="45" r="1" fill="#fbbf24" opacity="0.6" />
  <circle cx="200" cy="75" r="1" fill="#38bdf8" opacity="0.8" />
  <!-- Window Glass Gradient Overlay -->
  <path d="M150 30 H210 V110 H150 Z" fill="url(#cityGlow)" />

  <!-- Wall Shelf with books/plants -->
  <rect x="30" y="45" width="70" height="4" rx="2" fill="#475569" />
  <rect x="40" y="25" width="12" height="20" rx="2" fill="#ec4899" />
  <rect x="54" y="28" width="10" height="17" rx="2" fill="#10b981" />
  <circle cx="80" cy="35" r="7" fill="#fb923c" />
  <path d="M75 45 Q80 38 85 45 Z" fill="#334155" />

  <!-- Hanging Wall Clock (Showing late time: e.g., 11:15) -->
  <circle cx="120" cy="40" r="12" fill="#334155" stroke="#64748b" stroke-width="2" />
  <circle cx="120" cy="40" r="10" fill="#f8fafc" />
  <!-- Clock hands -->
  <line x1="120" y1="40" x2="116" y2="35" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <line x1="120" y1="40" x2="126" y2="42" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="120" cy="40" r="1.5" stroke="#ef4444" stroke-width="1.5" fill="#ef4444" />

  <!-- Large Office Desk -->
  <rect x="15" y="150" width="210" height="12" rx="3" fill="#334155" filter="url(#softShadow)" />
  <rect x="30" y="162" width="16" height="58" fill="#1e293b" />
  <rect x="194" y="162" width="16" height="58" fill="#1e293b" />

  <!-- DESK PROPS -->
  <!-- Laptop Computer -->
  <path d="M70 125 L95 125 L90 150 L65 150 Z" fill="#64748b" /> <!-- Base -->
  <rect x="75" y="100" width="70" height="27" rx="3" fill="#475569" /> <!-- Screen Back -->
  <rect x="78" y="103" width="64" height="21" rx="1" fill="#0f172a" /> <!-- Screen Face -->
  <!-- Code/Chart lines on screen -->
  <line x1="82" y1="108" x2="105" y2="108" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="82" y1="114" x2="120" y2="114" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <line x1="82" y1="120" x2="98" y2="120" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

  <!-- Desk Lamp & Light Beam -->
  <path d="M175 150 L175 90 L160 80 L165 75 L182 87 L182 150 Z" fill="#475569" />
  <polygon points="140,150 190,150 215,220 115,220" fill="url(#lampLight)" style="mix-blend-mode: screen;" />

  <!-- Coffee Mug (Overtime Fuel) -->
  <rect x="145" y="132" width="14" height="18" rx="3" fill="url(#coffeeGrad)" />
  <path d="M159 137 C164 137, 164 145, 159 145" stroke="#c2410c" stroke-width="2.5" fill="none" />
  <!-- Steam from coffee -->
  <path d="M149 126 C149 122, 153 120, 151 116" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M155 128 C155 124, 159 122, 157 118" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Papers / Stack of Documents -->
  <rect x="40" y="138" width="22" height="12" rx="1" fill="#cbd5e1" transform="rotate(-5 50 144)" />
  <rect x="38" y="142" width="24" height="10" rx="1" fill="#f8fafc" transform="rotate(3 50 147)" />

  <!-- CHARACTER: Overworked Professional -->
  <!-- Chair Back -->
  <path d="M100 80 Q105 130 100 165 H125 Q120 130 125 80 Z" fill="#334155" />

  <!-- Character Body / Torso -->
  <path d="M85 130 Q110 120 135 130 L142 160 H78 Z" fill="url(#shirtGrad)" filter="url(#softShadow)" />
  <!-- Collar & Tie -->
  <path d="M102 130 L110 142 L118 130 Z" fill="#ffffff" />
  <path d="M108 140 L112 140 L114 160 L110 163 L106 160 Z" fill="#ef4444" />

  <!-- Head & Hair -->
  <!-- Neck -->
  <path d="M104 118 H116 V132 H104 Z" fill="#fed7aa" />
  <!-- Ears -->
  <circle cx="95" cy="106" r="4" fill="#fed7aa" />
  <!-- Head Base -->
  <circle cx="110" cy="104" r="16" fill="#fed7aa" />
  <!-- Hair (Messy/Tired style) -->
  <path d="M94 102 C93 90, 100 86, 110 86 C122 86, 128 92, 127 104 C124 98, 120 92, 110 92 C100 92, 96 98, 94 102 Z" fill="#1e293b" />
  <path d="M124 96 C128 98, 131 104, 130 108 C128 104, 126 100, 124 96 Z" fill="#1e293b" />

  <!-- Facial Expression: Tired, Straining, Heavy Eyes -->
  <!-- Eyebrows tilted in stress/concentration -->
  <path d="M99 98 L106 101" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M114 101 L121 98" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Tired Eyes / Bags under eyes -->
  <circle cx="102" cy="105" r="2" fill="#1e293b" />
  <circle cx="118" cy="105" r="2" fill="#1e293b" />
  <path d="M100 109 Q102 111 104 109" stroke="#cbd5e1" stroke-width="1" fill="none" />
  <path d="M116 109 Q118 111 120 109" stroke="#cbd5e1" stroke-width="1" fill="none" />
  <!-- Glasses (crooked or sliding slightly) -->
  <rect x="98" y="101" width="8" height="6" rx="1" fill="none" stroke="#475569" stroke-width="1.5" />
  <rect x="114" y="101" width="8" height="6" rx="1" fill="none" stroke="#475569" stroke-width="1.5" />
  <line x1="106" y1="104" x2="114" y2="104" stroke="#475569" stroke-width="1.5" />
  <!-- Exhausted open/panting mouth -->
  <path d="M108 114 Q110 117 112 114 Z" fill="#991b1b" />

  <!-- Arms / Hands Typing Actively -->
  <!-- Left Arm -->
  <path d="M88 135 L65 145 L78 152" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left Hand -->
  <circle cx="76" cy="153" r="4" fill="#fed7aa" />

  <!-- Right Arm -->
  <path d="M132 135 L155 145 L140 152" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Hand -->
  <circle cx="138" cy="153" r="4" fill="#fed7aa" />

  <!-- ZZZ / Tired floating indicator (Subtle narrative detail) -->
  <text x="135" y="75" font-family="sans-serif" font-weight="bold" font-size="12" fill="#94a3b8" opacity="0.6">Z</text>
  <text x="143" y="63" font-family="sans-serif" font-weight="bold" font-size="16" fill="#94a3b8" opacity="0.4">Z</text>

  <!-- Foreground Atmospheric Glow / Vignette -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.5" />
</svg>