<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient and room ambiance -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="120" cy="50" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cakeGlow" x1="120" y1="160" x2="120" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="120" cy="115" r="32"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient lighting effects -->
  <circle cx="120" cy="50" r="110" fill="url(#lampGlow)"/>
  <ellipse cx="120" cy="180" rx="70" ry="30" fill="url(#cakeGlow)"/>

  <!-- Room Interior Elements (Shelf & Clock in Background) -->
  <path d="M40 70 L200 70" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- Small potted plant on shelf -->
  <path d="M55 70 L65 55 L75 70 Z" fill="#475569"/>
  <path d="M65 55 Q65 42 60 40 Q70 40 65 55" fill="#10b981"/>
  <path d="M65 55 Q75 42 75 38 Q78 50 65 55" fill="#059669"/>
  <!-- Wall clock showing late time -->
  <circle cx="185" cy="45" r="14" fill="#334155"/>
  <circle cx="185" cy="45" r="12" fill="#0f172a"/>
  <path d="M185 45 L185 37" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M185 45 L191 48" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Surprise Confetti floating -->
  <circle cx="50" cy="110" r="3" fill="#38bdf8"/>
  <rect x="175" y="100" width="6" height="4" rx="1" fill="#fbbf24" transform="rotate(30 178 102)"/>
  <circle cx="195" cy="140" r="2.5" fill="#ec4899"/>
  <rect x="42" y="150" width="5" height="5" rx="1" fill="#10b981" transform="rotate(45 44 152)"/>

  <!-- Table Surface -->
  <path d="M20 185 L220 185 L230 220 L10 220 Z" fill="#334155"/>
  <path d="M20 185 L220 185" stroke="#475569" stroke-width="3"/>

  <!-- Birthday Cake Object -->
  <g transform="translate(100, 150)">
    <!-- Cake Plate -->
    <ellipse cx="20" cy="35" rx="35" ry="8" fill="#cbd5e1"/>
    <!-- Cake Body -->
    <path d="M-10 35 L-10 15 Q20 5 50 15 L50 35 Z" fill="#f43f5e"/>
    <!-- Frosting Drips -->
    <path d="M-10 15 Q-5 25 0 18 Q5 25 10 17 Q15 26 20 18 Q25 25 30 17 Q35 25 40 17 Q45 25 50 15 Z" fill="#ffffff"/>
    <ellipse cx="20" cy="15" rx="30" ry="7" fill="#ffffff"/>
    <!-- Candles -->
    <rect x="15" y="0" width="4" height="12" rx="1" fill="#38bdf8"/>
    <ellipse cx="17" cy="-2" rx="3" ry="5" fill="#fbbf24"/>
    <ellipse cx="17" cy="-3" rx="1.5" ry="3" fill="#fef08a"/>
  </g>

  <!-- Gift Box Object -->
  <g transform="translate(45, 160)">
    <rect x="0" y="5" width="30" height="25" rx="2" fill="#8b5cf6"/>
    <!-- Ribbon vertical -->
    <rect x="12" y="5" width="6" height="25" fill="#fbbf24"/>
    <!-- Ribbon horizontal -->
    <rect x="0" y="14" width="30" height="6" fill="#fbbf24"/>
    <!-- Bow -->
    <path d="M9 3 Q15 -3 15 5 Q15 -3 21 3 Q24 7 15 5 Q6 7 9 3 Z" fill="#f59e0b"/>
  </g>

  <!-- Main Character: Shocked / Unbelieving Face ("竟然" moment) -->
  <g transform="translate(0, 0)">
    <!-- Character Shoulders / Hoodie -->
    <path d="M80 185 C80 145 95 140 120 140 C145 140 160 145 160 185 Z" fill="#0284c7"/>
    <path d="M105 140 L120 165 L135 140 Z" fill="#f8fafc"/> <!-- Hoodie strings/collar -->
    
    <!-- Neck -->
    <rect x="108" y="125" width="24" height="20" rx="6" fill="#ffd6a5"/>

    <!-- Head & Face Structure -->
    <circle cx="120" cy="110" r="32" fill="#ffdec1"/>

    <!-- Ears -->
    <circle cx="87" cy="112" r="5" fill="#fbc5a2"/>
    <circle cx="153" cy="112" r="5" fill="#fbc5a2"/>

    <!-- Hair -->
    <path d="M88 105 C88 80 100 75 120 75 C140 75 152 80 152 105 C152 115 148 100 140 90 C130 82 110 82 100 90 C92 100 88 115 88 105 Z" fill="#334155"/>
    <path d="M110 78 Q120 72 135 80 Q125 76 110 78 Z" fill="#475569"/> <!-- Hair highlight -->

    <!-- Shocked Eyebrows (Arched way up high) -->
    <path d="M98 96 Q106 91 112 97" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M128 97 Q134 91 142 96" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Wide Shocked Eyes (Classic anime/cartoon surprise) -->
    <circle cx="106" cy="108" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="107" cy="108" r="4.5" fill="#0f172a"/>
    <circle cx="109" cy="106" r="1.5" fill="#ffffff"/>

    <circle cx="134" cy="108" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="133" cy="108" r="4.5" fill="#0f172a"/>
    <circle cx="131" cy="106" r="1.5" fill="#ffffff"/>

    <!-- Sweat Drop (Classic realization/disbelief trope) -->
    <path d="M152 100 Q156 108 152 112 Q148 108 152 100 Z" fill="#38bdf8"/>

    <!-- Open "O" Shaped Mouth (Expressing "竟然" - You actually remembered / did this?!) -->
    <ellipse cx="120" cy="126" rx="6" ry="9" fill="#1e293b"/>
    <ellipse cx="120" cy="129" rx="3.5" ry="5" fill="#f43f5e"/>

    <!-- Rosy Cheeks -->
    <circle cx="98" cy="118" r="5" fill="#f43f5e" opacity="0.25"/>
    <circle cx="142" cy="118" r="5" fill="#f43f5e" opacity="0.25"/>
  </g>

  <!-- Dramatic Action Lines / Framing vignette -->
  <path d="M15 15 L35 15 M15 15 L15 35" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M225 15 L205 15 M225 15 L225 35" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Subtle floor shadow -->
  <ellipse cx="120" cy="223" rx="90" ry="4" fill="#020617" opacity="0.4"/>
</svg>