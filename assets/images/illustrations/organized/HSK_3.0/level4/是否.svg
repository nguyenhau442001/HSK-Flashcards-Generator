<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric background glow -->
  <circle cx="120" cy="110" r="90" fill="url(#glow-grad)" />

  <!-- ENVIRONMENT: Cozy Detective/Research Desk representing uncertainty, weighing choices ("có hay không") -->
  <g filter="url(#shadow)">
    <!-- Wooden desk surface -->
    <path d="M 20 185 L 220 185 L 205 210 L 35 210 Z" fill="#334155" />
    <path d="M 20 185 L 220 185 L 218 190 L 22 190 Z" fill="#475569" />
  </g>

  <!-- Cork notice board / Wall backdrop props -->
  <rect x="45" y="40" width="150" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <!-- Pinned clues and binary pathways (Yes/No concept) -->
  <rect x="58" y="52" width="55" height="40" rx="4" fill="#334155" transform="rotate(-5 58 52)" />
  <circle cx="85" cy="72" r="10" fill="#f59e0b" />
  <path d="M 81 72 L 84 75 L 90 68" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <rect x="127" y="50" width="55" height="40" rx="4" fill="#334155" transform="rotate(6 127 50)" />
  <circle cx="154" cy="70" r="10" fill="#ef4444" />
  <path d="M 149 65 L 159 75 M 159 65 L 149 75" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Connecting string / question thread on the board -->
  <path d="M 85 82 Q 105 110 154 80" fill="none" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="2" opacity="0.8" />

  <!-- MAIN SUBJECT: Vintage Dual-Path Scale / Mechanism of Choice (Representing "Whether... or not") -->
  <g filter="url(#shadow)">
    <!-- Scale Base -->
    <path d="M 100 175 L 140 175 L 145 185 L 95 185 Z" fill="#64748b" />
    <rect x="115" y="115" width="10" height="65" fill="#475569" />
    <!-- Scale Top Beam Pivot -->
    <circle cx="120" cy="115" r="8" fill="#fbbf24" />

    <!-- Balancing Arm (Tilted dynamically to show deliberation) -->
    <g transform="rotate(8 120 115)">
      <path d="M 60 112 L 180 112 L 180 118 L 60 118 Z" fill="#cbd5e1" />
      
      <!-- Left Pan (Option A: Green / Yes) -->
      <path d="M 60 115 L 45 155 L 75 155 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
      <path d="M 40 155 Q 60 163 80 155 Z" fill="#10b981" />
      <circle cx="60" cy="148" r="8" fill="#34d399" />
      
      <!-- Right Pan (Option B: Orange / No) -->
      <path d="M 180 115 L 165 140 L 195 140 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
      <path d="M 160 140 Q 180 148 200 140 Z" fill="#f97316" />
      <circle cx="180" cy="133" r="8" fill="#fb923c" />
    </g>
  </g>

  <!-- FOREGROUND PROPS: Magnifying Glass & Mystery Document (Active Investigation of "Whether") -->
  <g filter="url(#shadow)">
    <!-- Open Folder / File -->
    <path d="M 75 160 L 115 150 L 145 160 L 165 185 L 55 185 Z" fill="#e2e8f0" />
    <!-- Document lines inside -->
    <line x1="68" y1="167" x2="95" y2="160" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="65" y1="175" x2="90" y2="168" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Magnifying Glass hovering, inspecting the choice -->
    <g transform="translate(130, 130) rotate(-25)">
      <!-- Glass handle -->
      <rect x="0" y="0" width="8" height="35" rx="4" fill="#b45309" />
      <!-- Rim -->
      <circle cx="4" cy="-15" r="20" fill="none" stroke="#fbbf24" stroke-width="5" />
      <!-- Lens reflection -->
      <circle cx="4" cy="-15" r="18" fill="#38bdf8" fill-opacity="0.25" />
      <path d="M -6 -22 Q 0 -28 8 -20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    </g>
  </g>

  <!-- Sparkles / Atmosphere of decision making -->
  <circle cx="45" cy="115" r="3" fill="#fbbf24" opacity="0.8" />
  <path d="M 195 100 L 199 104 L 195 108 L 191 104 Z" fill="#38bdf8" />
  <path d="M 105 45 L 107 48 L 105 51 L 103 48 Z" fill="#f43f5e" />

</svg>