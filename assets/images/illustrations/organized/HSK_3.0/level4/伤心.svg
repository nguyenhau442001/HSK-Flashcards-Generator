<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Lamp Light -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="sweater-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Tear Drop Gradient -->
    <linearGradient id="tear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lamp Glow -->
  <circle cx="180" cy="50" r="90" fill="url(#lamp-glow)" />

  <!-- Background Environment: Room Interior -->
  <!-- Wallpaper subtle stripe lines -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240" />
    <line x1="80" y1="0" x2="80" y2="240" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="160" y1="0" x2="160" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
  </g>

  <!-- Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16" />
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2" />

  <!-- Window Frame in Background (Rainy night mood) -->
  <g opacity="0.6">
    <rect x="25" y="40" width="50" height="90" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <line x1="50" y1="40" x2="50" y2="130" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="85" x2="75" y2="85" stroke="#334155" stroke-width="1.5" />
    <!-- Window Light Projection -->
    <polygon points="25,130 75,130 95,200 10,200" fill="url(#window-light)" />
    <!-- Raindrops on window -->
    <line x1="35" y1="55" x2="33" y2="62" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="62" y1="95" x2="60" y2="104" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="42" y1="110" x2="41" y2="115" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Hanging Desk Lamp -->
  <path d="M 180 0 L 180 35" stroke="#64748b" stroke-width="2" />
  <path d="M 160 35 L 200 35 L 210 50 L 150 50 Z" fill="#475569" />
  <path d="M 165 50 L 195 50 L 180 58 Z" fill="#fbbf24" />

  <!-- Cozy Bookshelf / Props in Background -->
  <g transform="translate(195, 100)">
    <rect x="0" y="0" width="35" height="100" fill="#1e293b" opacity="0.5"/>
    <!-- Books -->
    <rect x="6" y="20" width="8" height="30" rx="1" fill="#ef4444" />
    <rect x="15" y="15" width="7" height="35" rx="1" fill="#3b82f6" />
    <rect x="23" y="22" width="7" height="28" rx="1" fill="#10b981" />
    <rect x="5" y="70" width="26" height="6" rx="2" fill="#475569" />
    <!-- Small house plant -->
    <path d="M 12 70 Q 18 60 18 50 Q 24 60 24 70 Z" fill="#059669" />
    <ellipse cx="18" cy="70" rx="6" ry="3" fill="#94a3b8" />
  </g>

  <!-- MAIN CHARACTER: Sitting, hunched over, sad/heartbroken -->
  <g transform="translate(10, 15)" filter="url(#soft-shadow)">
    <!-- Wooden Chair -->
    <g id="chair">
      <!-- Chair Back -->
      <rect x="75" y="60" width="55" height="90" rx="8" fill="#475569" />
      <rect x="83" y="68" width="39" height="74" rx="4" fill="#334155" />
      <!-- Chair Seat -->
      <path d="M 60 145 L 150 145 L 140 155 L 50 155 Z" fill="#64748b" />
      <!-- Chair Legs -->
      <line x1="55" y1="155" x2="40" y2="210" stroke="#334155" stroke-width="5" stroke-linecap="round" />
      <line x1="135" y1="155" x2="150" y2="210" stroke="#334155" stroke-width="5" stroke-linecap="round" />
      <line x1="70" y1="155" x2="65" y2="210" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
      <line x1="120" y1="155" x2="125" y2="210" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
      <!-- Crossbars -->
      <line x1="52" y1="185" x2="138" y2="185" stroke="#1e293b" stroke-width="3" />
    </g>

    <!-- Character Body / Slouched Posture -->
    <g id="character">
      <!-- Legs (Sitting) -->
      <path d="M 75 145 C 75 160, 80 175, 95 175 L 125 170" fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 95 173 L 100 200 C 100 203, 97 205, 94 205 L 86 205 C 83 205, 80 203, 80 200 L 80 173" fill="#cbd5e1" /> <!-- Shoes -->

      <!-- Torso (Hunched Forward) -->
      <path d="M 70 100 C 65 115, 75 145, 105 145 C 125 145, 135 130, 130 110 C 125 95, 100 90, 70 100 Z" fill="url(#sweater-grad)" />

      <!-- Back Hair Layer -->
      <path d="M 80 65 C 65 70, 55 95, 60 115 C 62 125, 70 120, 70 110 C 70 95, 75 80, 85 70 Z" fill="url(#hair-grad)" />

      <!-- Head (Tilted Downward, Expressing Sadness) -->
      <g transform="translate(85, 75) rotate(15)">
        <!-- Neck -->
        <rect x="5" y="15" width="16" height="15" rx="6" fill="#fde047" /> <!-- Skin tone base/shadow -->
        <path d="M 3 18 C 3 18, 12 25, 21 18 C 21 18, 18 10, 12 10 C 6 10, 3 18, 3 18 Z" fill="#fbcfe8" opacity="0.4" /> <!-- Neck shadow -->

        <!-- Head Base -->
        <circle cx="12" cy="5" r="22" fill="#ffedd5" />

        <!-- Ears -->
        <circle cx="-8" cy="7" r="4" fill="#fed7aa" />

        <!-- Hair Front & Bangs -->
        <path d="M -8 -8 C -5 -16, 15 -18, 28 -10 C 32 -7, 34 2, 32 8 C 30 14, 25 10, 22 2 C 18 -6, 5 -8, -4 -3 C -8 -1, -8 -8, -8 -8 Z" fill="url(#hair-grad)" />
        <path d="M -9 2 C -5 2, 2 -2, 8 -4 C 14 -6, 20 -2, 24 3 C 26 5, 25 8, 22 6 C 14 0, 0 3, -9 2 Z" fill="url(#hair-grad)" />

        <!-- Facial Expression: Sad / Tearful -->
        <!-- Eyebrows (Slanted up in sadness: inner corners raised) -->
        <path d="M 2 0 Q 7 -4 12 1" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 16 2 Q 21 -4 26 0" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />

        <!-- Closed/Watery Sad Eyes (Arcs pointing down or tight shut with tears) -->
        <path d="M 3 6 Q 7 11 11 6" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
        <path d="M 17 7 Q 21 12 25 7" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

        <!-- Rosy Sad Cheeks -->
        <circle cx="5" cy="11" r="3" fill="#f43f5e" opacity="0.25" />
        <circle cx="23" cy="12" r="3" fill="#f43f5e" opacity="0.25" />

        <!-- Frowning/Quivering Mouth -->
        <path d="M 11 19 Q 14 15 17 19" stroke="#945555" stroke-width="2" stroke-linecap="round" fill="none" />

        <!-- Tears Falling -->
        <path d="M 8 13 C 8 16, 10 17, 10 19 C 10 21, 8 21, 8 19 C 8 17, 6 16, 8 13 Z" fill="url(#tear-grad)" />
        <path d="M 20 14 C 20 18, 23 20, 23 23 C 23 25, 20 25, 20 23 C 20 20, 17 18, 20 14 Z" fill="url(#tear-grad)" />
      </g>

      <!-- Arms Wrapping Around / Hugging Knees or Drooped (Heartbroken posture) -->
      <!-- Left Arm (Drooping down despondently) -->
      <path d="M 75 105 C 60 115, 50 135, 55 150" fill="none" stroke="#60a5fa" stroke-width="14" stroke-linecap="round" />
      <!-- Left Hand -->
      <circle cx="56" cy="154" r="7" fill="#ffedd5" />

      <!-- Right Arm (Supporting or Resting on Knee) -->
      <path d="M 115 105 C 130 115, 135 135, 125 150" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" />
      <!-- Right Hand -->
      <circle cx="123" cy="154" r="7" fill="#ffedd5" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Floating Tear / Droplets / Melancholy Vibe) -->
  <g opacity="0.7">
    <!-- Extra falling tear near character's face -->
    <path d="M 115 110 C 115 114, 118 116, 118 119 C 118 121, 115 121, 115 119 C 115 116, 112 114, 115 110 Z" fill="url(#tear-grad)" />
    <circle cx="116" cy="115" r="1" fill="#ffffff" opacity="0.8" />

    <!-- Small Heart Symbol broken or floating away faintly to signify heartbreak (shāngxīn) -->
    <g transform="translate(145, 70) scale(0.8)" opacity="0.6">
      <path d="M 12 5 C 9 0, 2 1, 0 6 C -2 12, 6 17, 12 22 C 18 17, 26 12, 24 6 C 22 1, 15 0, 12 5 Z" fill="#f43f5e" />
      <!-- Crack line through heart -->
      <path d="M 12 5 L 10 10 L 14 13 L 11 18" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Dramatic Vignette / Border Shadow Overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.3" />
</svg>