<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow Gradient -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Blush Gradient -->
    <radialGradient id="blush-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- Background Environment / Room Context -->
  <g id="room-context">
    <!-- Bookshelf and Books -->
    <rect x="25" y="80" width="45" height="110" rx="4" fill="#334155" opacity="0.6" />
    <rect x="30" y="110" width="35" height="8" rx="2" fill="#64748b" opacity="0.8" />
    <rect x="30" y="150" width="35" height="8" rx="2" fill="#475569" opacity="0.8" />
    <!-- Colorful Books on Shelf -->
    <path d="M35 108 L35 90 C35 88.8 35.8 88 37 88 L43 88 C44.2 88 45 88.8 45 90 L45 108 Z" fill="#38bdf8" />
    <path d="M48 108 L48 93 C48 91.8 48.8 91 50 91 L56 91 C57.2 91 58 91.8 58 93 L58 108 Z" fill="#ec4899" />

    <!-- Hanging Pendant Light (Casting the Warm Glow) -->
    <line x1="190" y1="0" x2="190" y2="45" stroke="#475569" stroke-width="2" />
    <path d="M175 45 L205 45 L212 55 L168 55 Z" fill="#64748b" />
    <ellipse cx="190" cy="55" rx="22" ry="6" fill="#fbb6ce" opacity="0.2" />

    <!-- House Plant for Organic Warmth -->
    <path d="M200 190 C200 170 215 160 215 160 C215 160 225 175 220 190 Z" fill="#10b981" opacity="0.8" filter="url(#shadow)" />
    <path d="M205 190 C195 180 190 165 190 165 C190 165 205 160 210 190 Z" fill="#059669" opacity="0.9" />
    <rect x="192" y="190" width="22" height="25" rx="4" fill="#cbd5e1" />
  </g>

  <!-- Main Character: Shy Girl (害羞 - Hàixiū) -->
  <g id="character" filter="url(#shadow)" transform="translate(15, 15)">

    <!-- Character Body / Torso & Cozy Sweater -->
    <path d="M75 160 C65 160 45 175 35 195 L115 195 C105 175 85 160 75 160 Z" fill="#38bdf8" />
    <path d="M75 160 C65 160 45 175 35 195 L115 195 C105 175 85 160 75 160 Z" fill="url(#lamp-glow)" opacity="0.3" />
    <!-- Sweater collar -->
    <path d="M60 148 C60 143 67 140 75 140 C83 140 90 143 90 148 C90 154 83 158 75 158 C67 158 60 154 60 148 Z" fill="#bae6fd" />

    <!-- Long Hair Back Layers -->
    <path d="M45 100 C35 120 38 150 48 175 L62 170 C55 145 52 125 58 105 Z" fill="#1e1b4b" />
    <path d="M105 100 C115 120 112 150 102 175 L88 170 C95 145 98 125 92 105 Z" fill="#1e1b4b" />

    <!-- Neck -->
    <rect x="67" y="130" width="16" height="22" fill="#fed7aa" />

    <!-- Head / Face Base -->
    <circle cx="75" cy="98" r="34" fill="#fed7aa" />

    <!-- Long Hair Bangs & Sides framing the shy face -->
    <path d="M43 85 C43 70 55 58 75 58 C95 58 107 70 107 85 C107 95 102 110 98 125 L90 120 C95 100 96 85 90 75 C80 65 65 65 58 75 C52 85 54 100 58 120 L50 125 C46 110 43 95 43 85 Z" fill="#1e1b4b" />

    <!-- Shy Face Expression Elements -->
    <!-- Intense Blush (Key indicator for Hàixiū) -->
    <circle cx="58" cy="102" r="11" fill="url(#blush-grad)" />
    <circle cx="92" cy="102" r="11" fill="url(#blush-grad)" />

    <!-- Shy Closed Eyes (Curved happy/shy arcs ^ ^) -->
    <path d="M54 94 C57 90 62 90 65 94" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M85 94 C88 90 93 90 96 94" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Shy Open Smiling Mouth (Embarrassed giggling / sheepish grin) -->
    <path d="M70 106 C70 106 73 112 75 112 C77 112 80 106 80 106 Z" fill="#e11d48" />

    <!-- Shy Posture: Hands raised to cheeks/mouth in embarrassment -->
    <!-- Left Arm & Hand hiding face slightly -->
    <path d="M45 170 C40 150 50 125 60 115 L68 122 C60 130 52 148 55 168 Z" fill="#38bdf8" />
    <circle cx="62" cy="113" r="8" fill="#fed7aa" />

    <!-- Right Arm & Hand nervously clutching the sweater near collar -->
    <path d="M105 170 C110 150 100 125 90 115 L82 122 C90 130 98 148 95 168 Z" fill="#38bdf8" />
    <circle cx="88" cy="113" r="8" fill="#fed7aa" />

  </g>

  <!-- Emotional Atmosphere Floating Accents (Sweat drop & shy aura) -->
  <g id="atmosphere-details" transform="translate(15, 15)">
    <!-- Shy Sweat Drop (Classic anime trope for nervous/shy/embarrassed) -->
    <path d="M112 72 C112 72 118 80 118 85 C118 88.3 115.3 91 112 91 C108.7 91 106 88.3 106 85 C106 80 112 72 112 72 Z" fill="#38bdf8" opacity="0.85" filter="url(#shadow)" />
    <!-- Sparkles of awkward tension / shy cute vibe -->
    <path d="M30 75 L33 82 L40 85 L33 88 L30 95 L27 88 L20 85 L27 82 Z" fill="#fbbf24" opacity="0.7" />
    <path d="M125 125 L127 130 L132 132 L127 134 L125 139 L123 134 L118 132 L123 130 Z" fill="#fbbf24" opacity="0.6" />
  </g>

</svg>