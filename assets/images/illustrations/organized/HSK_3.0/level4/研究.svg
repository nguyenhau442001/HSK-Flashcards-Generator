<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(20, 40)">
    <!-- Desk -->
    <rect x="0" y="120" width="200" height="15" rx="2" fill="#334155"/>
    <rect x="10" y="135" width="10" height="40" fill="#334155"/>
    <rect x="180" y="135" width="10" height="40" fill="#334155"/>
    
    <!-- Books/Papers -->
    <rect x="20" y="100" width="50" height="20" rx="2" fill="#fb923c"/>
    <rect x="25" y="95" width="45" height="5" rx="1" fill="#f59e0b"/>
    
    <!-- Magnifying Glass -->
    <circle cx="140" cy="70" r="25" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <line x1="158" y1="88" x2="185" y2="115" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Character Head/Upper Body -->
    <path d="M80 120 L120 120 L115 60 L85 60 Z" fill="#94a3b8"/>
    <circle cx="100" cy="50" r="25" fill="#fde68a"/>
    
    <!-- Hair -->
    <path d="M75 50 Q100 20 125 50 Q100 35 75 50" fill="#475569"/>
    
    <!-- Glasses -->
    <circle cx="90" cy="50" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="110" cy="50" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="96" y1="50" x2="104" y2="50" stroke="#0f172a" stroke-width="2"/>
    
    <!-- Lamp -->
    <path d="M160 120 L170 40 L190 40 L180 120" fill="#10b981"/>
    <circle cx="180" cy="40" r="10" fill="#fbbf24"/>
  </g>
  
  <!-- Ambient Glow -->
  <circle cx="140" cy="70" r="40" fill="#38bdf8" opacity="0.1"/>
</svg>