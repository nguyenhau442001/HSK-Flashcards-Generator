<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Seat (The Subject) -->
  <g transform="translate(60, 80)">
    <!-- Legs -->
    <rect x="20" y="80" width="10" height="40" fill="#fb923c"/>
    <rect x="90" y="80" width="10" height="40" fill="#fb923c"/>
    
    <!-- Seat Cushion -->
    <rect x="10" y="60" width="100" height="20" rx="4" fill="#f59e0b"/>
    
    <!-- Backrest -->
    <path d="M10 60 L10 20 Q10 10 20 10 L100 10 Q110 10 110 20 L110 60 Z" fill="#fbbf24"/>
    
    <!-- Seat Detail -->
    <rect x="25" y="25" width="70" height="25" rx="2" fill="#fef3c7" opacity="0.3"/>
  </g>
  
  <!-- Context Props -->
  <circle cx="180" cy="190" r="30" fill="#10b981" opacity="0.2"/>
  <path d="M170 190 L190 190 M180 180 L180 200" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  
  <path d="M30 40 L50 40 L45 60 L25 60 Z" fill="#38bdf8"/>
  <circle cx="200" cy="60" r="15" fill="#ec4899"/>
  
  <!-- Ambient Light -->
  <ellipse cx="120" cy="120" rx="100" ry="80" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 8"/>
</svg>