<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Puddle Gradient -->
    <linearGradient id="puddle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glowing Streetlamp Cone -->
    <linearGradient id="light-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="pants-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="wind-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT: Park / Street Background -->
  <g id="environment">
    <!-- Distant City/Trees Silhouettes -->
    <path d="M 0 160 L 20 150 L 40 165 L 70 145 L 90 155 L 120 135 L 150 160 L 180 140 L 210 155 L 240 130 L 240 240 L 0 240 Z" fill="#090d16" />
    
    <!-- Streetlamp Post -->
    <rect x="185" y="60" width="4" height="140" fill="#475569" rx="2" />
    <path d="M 175 65 L 195 65 L 190 75 L 180 75 Z" fill="#334155" />
    <!-- Lamp Head & Glow -->
    <path d="M 170 75 L 200 75 L 205 85 L 165 85 Z" fill="#fef08a" />
    <polygon points="187,85 130,220 240,220" fill="url(#light-cone)" />

    <!-- Park Bench -->
    <g transform="translate(15, 160)">
      <rect x="0" y="10" width="45" height="4" fill="#78350f" rx="1" />
      <rect x="0" y="17" width="45" height="4" fill="#78350f" rx="1" />
      <rect x="5" y="4" width="4" height="25" fill="#451a03" rx="1" />
      <rect x="36" y="4" width="4" height="25" fill="#451a03" rx="1" />
    </g>

    <!-- Heavy Rain Effect (Angled Lines) -->
    <g stroke="#94a3b8" stroke-width="1" stroke-linecap="round" opacity="0.6">
      <line x1="20" y1="10" x2="5" y2="50" />
      <line x1="50" y1="5" x2="35" y2="45" />
      <line x1="80" y1="20" x2="65" y2="60" />
      <line x1="110" y1="10" x2="95" y2="50" />
      <line x1="140" y1="25" x2="125" y2="65" />
      <line x1="170" y1="15" x2="155" y2="55" />
      <line x1="200" y1="5" x2="185" y2="45" />
      <line x1="230" y1="20" x2="215" y2="60" />

      <line x1="30" y1="70" x2="15" y2="110" />
      <line x1="60" y1="80" x2="45" y2="120" />
      <line x1="90" y1="65" x2="75" y2="105" />
      <line x1="120" y1="75" x2="105" y2="115" />
      <line x1="150" y1="60" x2="135" y2="100" />
      <line x1="210" y1="70" x2="195" y2="110" />

      <line x1="10" y1="130" x2="-5" y2="170" />
      <line x1="70" y1="140" x2="55" y2="180" />
      <line x1="130" y1="135" x2="115" y2="175" />
      <line x1="190" y1="125" x2="175" y2="165" />
    </g>

    <!-- Ground / Pavement -->
    <path d="M 0 190 Q 120 180 240 195 L 240 240 L 0 240 Z" fill="#0f172a" />
    <!-- Glowing Puddle on Ground -->
    <ellipse cx="100" cy="205" rx="45" ry="10" fill="url(#puddle-grad)" />
  </g>

  <!-- SUBJECT: Runner pushing through storm (Regardless of weather) -->
  <g id="runner">
    <!-- Motion Wind Swirls -->
    <path d="M 130 110 Q 100 100 70 120" stroke="url(#wind-grad)" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 150 140 Q 110 130 80 150" stroke="url(#wind-grad)" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Back Leg (Stretching back) -->
    <path d="M 95 160 L 60 185 L 45 180" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Back Foot & Splash -->
    <ellipse cx="43" cy="183" rx="6" ry="3" fill="#cbd5e1" />
    <circle cx="40" cy="180" r="2" fill="#38bdf8" />
    <circle cx="48" cy="180" r="1.5" fill="#38bdf8" />

    <!-- Front Leg (Dynamic stride forward) -->
    <path d="M 110 160 L 135 190 L 155 185" stroke="#2563eb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Shoe & Splash -->
    <ellipse cx="158" cy="186" rx="8" ry="4" fill="#ef4444" />
    <path d="M 150 190 Q 158 198 165 190" stroke="#38bdf8" stroke-width="2" fill="none" />
    <circle cx="162" cy="182" r="2" fill="#38bdf8" />
    <circle cx="152" cy="185" r="1.5" fill="#38bdf8" />

    <!-- Torso (Leaning forward with determination) -->
    <g transform="rotate(-15 105 135)">
      <!-- Jacket -->
      <path d="M 90 110 L 120 115 L 115 160 L 85 155 Z" fill="url(#jacket-grad)" />
      <!-- Backpack -->
      <path d="M 80 115 Q 70 130 82 150 L 92 145 Q 85 130 88 115 Z" fill="#0284c7" rx="3" />
      
      <!-- Back Arm (Pumping back) -->
      <path d="M 95 118 L 75 140 L 65 135" stroke="#ea580c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="63" cy="133" rx="4" fill="#fde047" /> <!-- Hand -->

      <!-- Front Arm (Pumping forward) -->
      <path d="M 112 122 L 135 135 L 145 125" stroke="#f97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="147" cy="123" rx="4" fill="#fde047" /> <!-- Hand -->
    </g>

    <!-- Head & Cap (Leaned forward, determined expression) -->
    <g transform="translate(5, -2)">
      <!-- Neck -->
      <path d="M 108 102 L 114 112" stroke="#fde047" stroke-width="6" stroke-linecap="round" />
      
      <!-- Head Circle -->
      <circle cx="118" cy="95" r="11" fill="#fde047" />
      
      <!-- Baseball Cap -->
      <path d="M 106 90 Q 118 84 130 92 L 138 95 L 106 93 Z" fill="#ef4444" />
      <path d="M 125 93 L 142 97 L 138 99 Z" fill="#dc2626" /> <!-- Visor -->

      <!-- Determined Eye / Expression -->
      <path d="M 120 95 L 126 97" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
      <!-- Determined Mouth / Cheek -->
      <path d="M 124 100 Q 127 101 130 99" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- FOREGROUND ATMOSPHERE: Raindrops & Splashes close to camera -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <line x1="20" y1="180" x2="10" y2="210" />
    <line x1="220" y1="140" x2="210" y2="170" />
    <line x1="200" y1="190" x2="190" y2="220" />
  </g>

  <!-- Glowing accent details for visual polish -->
  <circle cx="190" cy="40" r="1.5" fill="#fef08a" opacity="0.6" />
  <circle cx="210" cy="25" r="1" fill="#fef08a" opacity="0.4" />
  <circle cx="30" cy="50" r="1.5" fill="#38bdf8" opacity="0.5" />
</svg>