<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 (The sarcastic speaker) skin gradient -->
    <linearGradient id="skin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Character 2 (The annoyed/confused listener) skin gradient -->
    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Suit 1 Gradient -->
    <linearGradient id="suit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Suit 2 Gradient -->
    <linearGradient id="suit2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" fill="url(#bgGrad)"/>
  <rect width="240" height="240" fill="url(#spotlight)"/>

  <!-- Ambient Stage / Interior Elements -->
  <!-- Back Wall & Floor Line -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#334155" stroke-width="2"/>
  <ellipse cx="120" cy="185" rx="100" ry="25" fill="#0b0f19" opacity="0.6"/>

  <!-- Background props (Art deco / Office lamps) -->
  <circle cx="40" cy="80" r="15" fill="#334155" opacity="0.3"/>
  <path d="M35 65 L45 65 L48 95 L32 95 Z" fill="#334155" opacity="0.2"/>
  
  <circle cx="200" cy="70" r="12" fill="#334155" opacity="0.3"/>
  <path d="M196 58 L204 58 L206 85 L194 85 Z" fill="#334155" opacity="0.2"/>

  <!-- SCENE GRAPHICS: SARCASTIC DIALOGUE INTERACTION -->

  <!-- CHARACTER 1: The Sarcastic Speaker (Left) -->
  <g transform="translate(45, 85)" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M 15 50 L 55 50 L 65 100 L 5 100 Z" fill="url(#suit1)"/>
    <!-- Shirt collar -->
    <path d="M 28 50 L 35 62 L 42 50 Z" fill="#ffffff"/>
    <path d="M 35 62 L 35 90" stroke="#3730a3" stroke-width="3"/>

    <!-- Neck -->
    <rect x="27" y="38" width="16" height="15" fill="url(#skin1)"/>

    <!-- Head -->
    <circle cx="35" cy="25" r="22" fill="url(#skin1)"/>

    <!-- Stylish Hair -->
    <path d="M 13 25 C 13 10, 25 5, 42 8 C 52 10, 56 18, 57 25 C 57 25, 50 15, 35 15 C 20 15, 13 25, 13 25 Z" fill="#1e1b4b"/>

    <!-- Sarcastic Face Expression -->
    <!-- Smirk Eye (Left - Winking/Narrowed) -->
    <path d="M 23 23 Q 27 20 31 23" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Normal Eye (Right - Looking smugly at listener) -->
    <circle cx="43" cy="22" r="2.5" fill="#1e1b4b"/>
    <path d="M 40 18 Q 43 16 46 18" stroke="#1e1b4b" stroke-width="1.5" fill="none"/> <!-- Eyebrow raised -->

    <!-- Smirking Mouth (Asymmetric, iconic sarcasm grin) -->
    <path d="M 27 32 Q 35 28 44 33 C 44 33, 40 37, 35 34 Z" fill="#1e1b4b"/>

    <!-- Sarcastic Gesture Arm (Leaning forward, hand on chin or pointing mockingly) -->
    <path d="M 15 55 Q -5 65 5 80" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="5" cy="80" r="6" fill="url(#skin1)"/>
    
    <!-- Other arm resting -->
    <path d="M 55 55 L 65 80" stroke="#3730a3" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>


  <!-- CHARACTER 2: The Annoyed/Unamused Listener (Right) -->
  <g transform="translate(140, 90)" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M 10 45 L 50 45 L 60 95 L 0 95 Z" fill="url(#suit2)"/>
    <!-- Shirt collar -->
    <path d="M 23 45 L 30 55 L 37 45 Z" fill="#ffffff"/>

    <!-- Neck -->
    <rect x="22" y="33" width="16" height="15" fill="url(#skin2)"/>

    <!-- Head (Tilted slightly back in exasperation) -->
    <circle cx="30" cy="20" r="21" fill="url(#skin2)"/>

    <!-- Neat Hair -->
    <path d="M 11 20 C 11 8, 20 2, 33 3 C 45 4, 49 12, 50 20 C 45 15, 35 12, 25 14 C 15 16, 11 20, 11 20 Z" fill="#78350f"/>

    <!-- Annoyed Face Expression -->
    <!-- Heavy Flat Eyebrows (Annoyance) -->
    <path d="M 17 14 L 25 17" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 35 17 L 43 14" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Half-closed Eyes (Unamused glare) -->
    <line x1="19" y1="20" x2="25" y2="20" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="20" x2="41" y2="20" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>

    <!-- Flat, Unimpressed Mouth -->
    <line x1="22" y1="30" x2="38" y2="30" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Blushing/Frustration marks on cheek -->
    <ellipse cx="38" cy="26" rx="3" ry="1.5" fill="#f43f5e" opacity="0.4"/>

    <!-- Arms crossed in annoyance -->
    <path d="M 5 55 Q 30 70 55 55" stroke="#0369a1" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 10 65 Q 30 80 50 65" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="60" r="5" fill="url(#skin2)"/>
    <circle cx="10" cy="60" r="5" fill="url(#skin2)"/>
  </g>


  <!-- ATMOSPHERIC VIZ: The "Sarcasm" Sub-Context Visualized -->
  <!-- Instead of flat dialogue bubbles, we use an ironic floating visual metaphor: 
       A glowing, overly-cheerful trophy/medal or sparkles dripping with heavy irony, 
       surrounded by sharp geometric contrast vectors (spiky soundwaves/glint elements). -->

  <g transform="translate(120, 65)" filter="url(#glow)">
    <!-- Glowing Golden Trophy of "Fake Praise" / Sarcastic compliment -->
    <path d="M -12 -12 L 12 -12 L 9 8 C 9 15, 3 18, 0 20 C -3 18, -9 15, -9 8 Z" fill="#fbbf24"/>
    <path d="M -15 -8 C -22 -8, -22 2, -15 2" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 15 -8 C 22 -8, 22 2, 15 2" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Trophy Base -->
    <rect x="-6" y="20" width="12" height="4" fill="#d97706" rx="1"/>
    <rect x="-10" y="24" width="20" height="4" fill="#b45309" rx="1"/>

    <!-- Sharp, Mocking "Sparkles" / Ironic stingers shooting off -->
    <path d="M -25 -25 L -18 -18" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 25 -25 L 18 -18" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 -30 L 0 -20" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Little floating danger/irony geometric triangles -->
    <polygon points="25,-5 32,0 28,7" fill="#fb923c"/>
    <polygon points="-28,-2 -35,3 -25,8" fill="#ec4899"/>
  </g>

  <!-- Sound wave / tone indicator: wavy mocking line bridging between them -->
  <path d="M 85 95 Q 100 80 115 95 T 145 95" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Little contrasting sharp visual notes floating up -->
  <path d="M 95 78 L 98 70 L 102 75 Z" fill="#f59e0b"/>
  <path d="M 130 72 L 134 65 L 138 71 Z" fill="#ec4899"/>

  <!-- Foreground Atmospheric Lighting / Vignette -->
  <circle cx="120" cy="120" r="115" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.15"/>
</svg>