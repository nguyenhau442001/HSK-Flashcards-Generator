<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <path d="M40 180 L200 180 L190 200 L50 200 Z" fill="#475569"/>
  <path d="M50 200 L60 220 L180 220 L190 200 Z" fill="#334155"/>
  
  <!-- Elderly person sitting -->
  <circle cx="80" cy="130" r="25" fill="#fde68a"/>
  <path d="M65 155 Q80 170 95 155" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  <rect x="60" y="155" width="40" height="40" rx="5" fill="#38bdf8"/>
  
  <!-- Young person serving tea -->
  <g transform="translate(140, 110)">
    <circle cx="0" cy="0" r="20" fill="#fb923c"/>
    <path d="M-15 20 Q0 35 15 20" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <rect x="-15" y="20" width="30" height="60" rx="5" fill="#ec4899"/>
    <!-- Hands holding tray -->
    <circle cx="-25" cy="40" r="8" fill="#fde68a"/>
    <circle cx="25" cy="40" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Tea set on table -->
  <ellipse cx="110" cy="175" rx="15" ry="8" fill="#f1f5f9"/>
  <circle cx="110" cy="165" r="10" fill="#f8fafc"/>
  <path d="M100 165 Q90 155 95 150" fill="none" stroke="#f8fafc" stroke-width="3"/>
  
  <!-- Warm glow accents -->
  <circle cx="120" cy="100" r="40" fill="#f59e0b" opacity="0.1"/>
  <circle cx="120" cy="100" r="20" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Decorative elements -->
  <path d="M20 50 L40 30 M20 30 L40 50" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="50" r="5" fill="#38bdf8"/>
  <circle cx="180" cy="70" r="3" fill="#ec4899"/>
</svg>