<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Counter Desk -->
  <path d="M20 160 L220 160 L230 200 L10 200 Z" fill="#334155"/>
  <path d="M20 160 L220 160 L210 150 L30 150 Z" fill="#475569"/>
  
  <!-- Bank Teller Window Frame -->
  <rect x="40" y="40" width="160" height="110" rx="8" fill="none" stroke="#64748b" stroke-width="4"/>
  <path d="M40 80 L200 80" stroke="#64748b" stroke-width="4"/>
  
  <!-- Money Stacks (The Exchange) -->
  <rect x="60" y="120" width="40" height="30" rx="2" fill="#fbbf24"/>
  <rect x="65" y="115" width="40" height="30" rx="2" fill="#f59e0b"/>
  <rect x="140" y="125" width="35" height="25" rx="2" fill="#10b981"/>
  <rect x="145" y="120" width="35" height="25" rx="2" fill="#059669"/>
  
  <!-- Hands interacting -->
  <path d="M100 135 C110 130, 120 130, 130 135 L135 150 L100 150 Z" fill="#fde68a"/>
  <path d="M120 135 C130 130, 140 130, 150 135 L155 150 L120 150 Z" fill="#fb923c"/>
  
  <!-- Decorative elements -->
  <circle cx="210" cy="50" r="6" fill="#38bdf8"/>
  <circle cx="30" cy="50" r="6" fill="#ec4899"/>
  
  <!-- Ambient light reflection -->
  <path d="M40 40 L200 40 L200 50 L40 150 Z" fill="#ffffff" opacity="0.05"/>
