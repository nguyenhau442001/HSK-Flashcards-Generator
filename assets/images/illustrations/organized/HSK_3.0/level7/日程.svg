<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Planner Cover Gradient -->
    <linearGradient id="plannerCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sticky Note Yellow -->
    <linearGradient id="stickyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Sticky Note Pink -->
    <linearGradient id="stickyPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow elements representing schedule efficiency/time -->
  <circle cx="190" cy="60" r="35" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />
  <circle cx="50" cy="180" r="45" fill="#f59e0b" opacity="0.05" filter="url(#glow)" />

  <!-- Background Desk/Environment Structure -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <!-- Desk Rim Light -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" opacity="0.6" />

  <!-- Laptop / Ambient Desk Prop in Background -->
  <g transform="translate(145, 105)">
    <!-- Laptop Base -->
    <path d="M -15 35 L 55 35 L 65 50 L -25 50 Z" fill="#475569" opacity="0.8"/>
    <path d="M -20 50 L 60 50 L 65 53 L -25 53 Z" fill="#64748b"/>
    <!-- Laptop Screen -->
    <path d="M -10 0 L 50 0 L 55 35 L -15 35 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Screen Content (Abstract UI lines) -->
    <rect x="-2" y="6" width="30" height="4" rx="2" fill="#38bdf8" opacity="0.6"/>
    <rect x="-2" y="14" width="40" height="3" rx="1.5" fill="#94a3b8" opacity="0.4"/>
    <rect x="-2" y="20" width="20" height="3" rx="1.5" fill="#f43f5e" opacity="0.5"/>
  </g>

  <!-- Coffee Mug Prop -->
  <g transform="translate(35, 135)" filter="url(#shadow)">
    <!-- Mug Body -->
    <rect x="0" y="5" width="22" height="28" rx="4" fill="#ffffff" />
    <path d="M 22 10 C 28 10, 28 25, 22 28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Coffee Surface -->
    <ellipse cx="11" cy="7" rx="9" ry="3" fill="#78350f" />
    <!-- Steam -->
    <path d="M 6 -2 Q 9 -7, 6 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 14 -4 Q 11 -9, 14 -14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- MAIN SUBJECT: The Schedule Planner / Calendar (日程) -->
  <g transform="translate(45, 55)" filter="url(#shadow)">
    
    <!-- Planner Shadow Base -->
    <rect x="12" y="12" width="128" height="118" rx="8" fill="#0f172a" opacity="0.5" />

    <!-- Open Planner Left Page (Backdrop Layer) -->
    <path d="M 10 10 L 75 5 L 75 115 L 10 115 Z" fill="#f8fafc" />
    <!-- Open Planner Right Page (Backdrop Layer) -->
    <path d="M 75 5 L 140 10 L 140 115 L 75 115 Z" fill="#f1f5f9" />

    <!-- Planner Cover Base (Slightly angled/skewed for 3D dynamic look) -->
    <g transform="rotate(-4, 75, 60)">
      <!-- Main Cover Back/Thickness -->
      <rect x="8" y="12" width="134" height="114" rx="8" fill="#0284c7" />
      
      <!-- Main Cover Front -->
      <rect x="6" y="8" width="134" height="114" rx="8" fill="url(#plannerCover)" />
      
      <!-- Cover Spine Design element -->
      <rect x="6" y="8" width="12" height="114" fill="#0369a1" />
      <line x1="18" y1="8" x2="18" y2="122" stroke="#38bdf8" stroke-width="1" opacity="0.4" />

      <!-- Decorative Graphic on Cover (Abstract Time/Schedule rings) -->
      <circle cx="75" cy="65" r="32" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.4" stroke-dasharray="6 4"/>
      <circle cx="75" cy="65" r="22" fill="#0284c7" opacity="0.3" />
      <path d="M 75 48 L 75 65 L 87 65" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Bookmark Ribbon hanging from cover -->
      <path d="M 110 8 L 115 8 L 115 45 L 112.5 40 L 110 45 Z" fill="#f43f5e" />
    </g>

    <!-- Spiral Binding Rings (Center) -->
    <g fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
      <line x1="73" y1="18" x2="77" y2="16" />
      <line x1="73" y1="33" x2="77" y2="31" />
      <line x1="73" y1="48" x2="77" y2="46" />
      <line x1="73" y1="63" x2="77" y2="61" />
      <line x1="73" y1="78" x2="77" y2="76" />
      <line x1="73" y1="93" x2="77" y2="91" />
      <line x1="73" y1="108" x2="77" y2="106" />
    </g>

    <!-- Inside Left Page Details (Calendar Grid & Schedule items) -->
    <g transform="translate(18, 16)">
      <!-- Header Bar -->
      <rect x="0" y="0" width="50" height="6" rx="3" fill="#cbd5e1" />
      <circle cx="58" cy="3" r="3" fill="#f43f5e" />

      <!-- Mini Calendar Grid -->
      <g transform="translate(0, 14)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="8" height="8" rx="2" fill="#e2e8f0" />
        <rect x="10" y="0" width="8" height="8" rx="2" fill="#e2e8f0" />
        <rect x="20" y="0" width="8" height="8" rx="2" fill="#e2e8f0" />
        <rect x="30" y="0" width="8" height="8" rx="2" fill="#e2e8f0" />
        <rect x="40" y="0" width="8" height="8" rx="2" fill="#e2e8f0" />
        
        <!-- Row 2 -->
        <rect x="0" y="10" width="8" height="8" rx="2" fill="#e2e8f0" />
        <rect x="10" y="10" width="8" height="8" rx="2" fill="#38bdf8" /> <!-- Highlighted active day -->
        <rect x="20" y="10" width="8" height="8" rx="2" fill="#e2e8f0" />
        <rect x="30" y="10" width="8" height="8" rx="2" fill="#e2e8f0" />
        <rect x="40" y="10" width="8" height="8" rx="2" fill="#e2e8f0" />

        <!-- Row 3 -->
        <rect x="0" y="20" width="8" height="8" rx="2" fill="#e2e8f0" />
        <rect x="10" y="20" width="8" height="8" rx="2" fill="#e2e8f0" />
        <rect x="20" y="20" width="8" height="8" rx="2" fill="#e2e8f0" />
        <rect x="30" y="20" width="8" height="8" rx="2" fill="#f59e0b" /> <!-- Starred event day -->
        <rect x="40" y="20" width="8" height="8" rx="2" fill="#e2e8f0" />
      </g>

      <!-- To-Do List Lines & Checkboxes -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="6" height="6" rx="1.5" fill="#10b981" />
        <!-- Checkmark -->
        <path d="M 1.5 3 L 2.5 4.5 L 5 1.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="10" y="1" width="35" height="4" rx="2" fill="#94a3b8" />

        <rect x="0" y="12" width="6" height="6" rx="1.5" fill="#38bdf8" />
        <path d="M 1.5 15 L 2.5 16.5 L 5 13.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="10" y="13" width="28" height="4" rx="2" fill="#94a3b8" />

        <rect x="0" y="24" width="6" height="6" rx="1.5" fill="#cbd5e1" />
        <rect x="10" y="25" width="32" height="4" rx="2" fill="#cbd5e1" />
      </g>
    </g>

    <!-- Inside Right Page Details (Timeline & Schedule blocks) -->
    <g transform="translate(85, 16)">
      <!-- Timeline Row 1 -->
      <circle cx="4" cy="5" r="3" fill="#38bdf8" />
      <line x1="4" y1="8" x2="4" y2="28" stroke="#e2e8f0" stroke-width="2" />
      <rect x="12" y="2" width="35" height="8" rx="3" fill="#bae6fd" />
      <rect x="16" y="5" width="20" height="2.5" rx="1" fill="#0284c7" />

      <!-- Timeline Row 2 -->
      <circle cx="4" cy="32" r="3" fill="#f59e0b" />
      <line x1="4" y1="35" x2="4" y2="55" stroke="#e2e8f0" stroke-width="2" />
      <rect x="12" y="29" width="42" height="8" rx="3" fill="#fef3c7" />
      <rect x="16" y="32" width="26" height="2.5" rx="1" fill="#d97706" />

      <!-- Timeline Row 3 -->
      <circle cx="4" cy="59" r="3" fill="#10b981" />
      <line x1="4" y1="62" x2="4" y2="82" stroke="#e2e8f0" stroke-width="2" />
      <rect x="12" y="56" width="38" height="8" rx="3" fill="#d1fae5" />
      <rect x="16" y="59" width="22" height="2.5" rx="1" fill="#059669" />

      <!-- Timeline Row 4 -->
      <circle cx="4" cy="86" r="3" fill="#f43f5e" />
      <rect x="12" y="83" width="30" height="8" rx="3" fill="#ffe4e6" />
      <rect x="16" y="86" width="16" height="2.5" rx="1" fill="#e11d48" />
    </g>

  </g>

  <!-- OVERLAPPING PROPS: Sticky Notes & Pen for dynamic action-packed depth -->

  <!-- Sticky Note Yellow (Top Right Floating) -->
  <g transform="translate(170, 40) rotate(12)" filter="url(#shadow)">
    <path d="M 0 0 L 35 0 L 35 35 L 0 35 Z" fill="url(#stickyYellow)" />
    <!-- Pin / Tape -->
    <rect x="11" y="-4" width="13" height="7" fill="#cbd5e1" opacity="0.8" />
    <!-- Scribble lines representing schedule notes -->
    <line x1="6" y1="10" x2="26" y2="10" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="6" y1="17" x2="20" y2="17" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="6" y1="24" x2="23" y2="24" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Sticky Note Pink (Bottom Left Floating) -->
  <g transform="translate(25, 125) rotate(-8)" filter="url(#shadow)">
    <path d="M 0 0 L 32 0 L 32 32 L 0 32 Z" fill="url(#stickyPink)" />
    <!-- Scribble -->
    <circle cx="8" cy="10" r="3" fill="#db2777" opacity="0.7"/>
    <line x1="14" y1="9" x2="26" y2="9" stroke="#db2777" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="6" y1="18" x2="24" y2="18" stroke="#db2777" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="6" y1="24" x2="18" y2="24" stroke="#db2777" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- High-End Vector Pen resting across the planner -->
  <g transform="translate(100, 135) rotate(-25)" filter="url(#shadow)">
    <!-- Pen Shadow -->
    <path d="M 0 4 L 110 4 L 110 8 L 0 8 Z" fill="#000000" opacity="0.2" />
    <!-- Pen Body -->
    <rect x="10" y="0" width="90" height="6" rx="3" fill="#f43f5e" />
    <!-- Pen Grip / Clip -->
    <rect x="25" y="-1" width="10" height="8" rx="2" fill="#cbd5e1" />
    <path d="M 30 7 L 30 14 L 32 14 L 32 7 Z" fill="#94a3b8" />
    <!-- Pen Tip -->
    <path d="M 100 0 L 108 3 L 100 6 Z" fill="#cbd5e1" />
    <!-- Pen Nib -->
    <path d="M 108 3 L 112 3" stroke="#1e293b" stroke-width="1.5" />
    <!-- Pen Cap End -->
    <path d="M 10 0 L 7 3 L 10 6 Z" fill="#e11d48" />
  </g>

  <!-- Sparkles / Accent highlights (Action & Focus elements) -->
  <g fill="#fbbf24">
    <path d="M 185 115 L 188 122 L 195 125 L 188 128 L 185 135 L 182 128 L 175 125 L 182 122 Z" opacity="0.9" filter="url(#glow)" />
    <path d="M 55 45 L 57 50 L 62 52 L 57 54 L 55 59 L 53 54 L 48 52 L 53 50 Z" opacity="0.8" />
  </g>

  <!-- Additional glowing time particle -->
  <circle cx="160" cy="35" r="2" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="70" cy="30" r="1.5" fill="#f43f5e" />

</svg>