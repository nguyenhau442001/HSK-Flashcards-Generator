<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Main Subject: Organized Files/Folders -->
  <g transform="translate(60, 80)">
    <!-- Folder 1 -->
    <path d="M10 20 L70 20 L80 40 L0 40 Z" fill="#fbbf24"/>
    <path d="M0 40 L80 40 L80 110 L0 110 Z" fill="#f59e0b"/>
    <!-- Folder 2 -->
    <path d="M30 10 L90 10 L100 30 L20 30 Z" fill="#38bdf8"/>
    <path d="M20 30 L100 30 L100 100 L20 100 Z" fill="#0ea5e9"/>
    <!-- Folder 3 -->
    <path d="M50 0 L110 0 L120 20 L40 20 Z" fill="#10b981"/>
    <path d="M40 20 L120 20 L120 90 L40 90 Z" fill="#059669"/>
  </g>
  
  <!-- Sorting/Gathering Action Elements -->
  <circle cx="180" cy="120" r="30" fill="none" stroke="#ec4899" stroke-width="4" stroke-dasharray="6 6" opacity="0.6"/>
  <path d="M170 120 L180 130 L195 110" stroke="#ec4899" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Supporting Props: Magnifying Glass -->
  <g transform="translate(40, 150) rotate(-20)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="#fb923c" stroke-width="3"/>
    <rect x="32" y="18" width="20" height="4" rx="2" fill="#fb923c"/>
  </g>
  
  <!-- Decorative floating data points -->
  <circle cx="200" cy="50" r="3" fill="#f59e0b"/>
  <circle cx="215" cy="70" r="4" fill="#38bdf8"/>
  <circle cx="190" cy="85" r="2" fill="#10b981"/>
</svg>