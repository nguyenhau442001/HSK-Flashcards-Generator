<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ground -->
  <path d="M0 200 C 80 190, 160 190, 240 200 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Suitcase -->
  <rect x="50" y="140" width="60" height="70" rx="8" fill="#fb923c"/>
  <rect x="55" y="125" width="50" height="15" rx="4" fill="#fb923c"/>
  <rect x="65" y="150" width="40" height="20" rx="2" fill="#ea580c"/>
  <circle cx="65" cy="210" r="8" fill="#1e293b"/>
  <circle cx="100" cy="210" r="8" fill="#1e293b"/>
  
  <!-- Passport/Travel Doc -->
  <rect x="130" y="160" width="40" height="50" rx="4" fill="#38bdf8"/>
  <rect x="135" y="165" width="30" height="5" rx="1" fill="#ffffff" opacity="0.3"/>
  <rect x="135" y="175" width="30" height="5" rx="1" fill="#ffffff" opacity="0.3"/>
  
  <!-- Plane silhouette in distance -->
  <path d="M180 60 L 210 50 L 190 70 L 170 65 Z" fill="#f59e0b"/>
  
  <!-- Globe/Map element -->
  <circle cx="180" cy="150" r="30" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M160 150 Q 180 130 200 150 T 180 170" fill="none" stroke="#10b981" stroke-width="2"/>
  
  <!-- Person silhouette (partial) -->
  <path d="M30 120 C 30 80, 60 60, 90 60 C 120 60, 150 80, 150 120 L 150 240 L 30 240 Z" fill="#475569" opacity="0.4"/>
  
  <!-- Decorative stars/travel accents -->
  <circle cx="200" cy="30" r="2" fill="#fbbf24"/>
  <circle cx="220" cy="80" r="3" fill="#fbbf24"/>
  <circle cx="30" cy="50" r="2" fill="#fbbf24"/>
</svg>