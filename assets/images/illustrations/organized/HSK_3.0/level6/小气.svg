<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M20 180 L220 180 L230 220 L10 220 Z" fill="#334155"/>
  
  <!-- The Character (The "Xiaoqi" person) -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 80 C-40 40, -20 20, 0 20 C20 20, 40 40, 40 80 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="30" fill="#fde68a"/>
    <!-- Suspicious Eyes -->
    <path d="M-15 -15 L-5 -15 M5 -15 L15 -15" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- Tight Mouth -->
    <path d="M-10 5 L10 5" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- The Money/Object of stinginess -->
  <g transform="translate(60, 160)">
    <rect x="-20" y="-15" width="40" height="25" rx="4" fill="#10b981"/>
    <rect x="-15" y="-10" width="30" height="15" rx="2" fill="#065f46"/>
    <circle cx="0" cy="-2" r="4" fill="#fbbf24"/>
  </g>

  <!-- Protective Arm Gesture -->
  <path d="M80 140 C70 120, 90 100, 110 110" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Decorative Sparkles/Accents -->
  <path d="M180 60 L185 50 L190 60 L200 65 L190 70 L185 80 L180 70 L170 65 Z" fill="#fb923c"/>
  <path d="M40 50 L43 45 L46 50 L52 53 L46 56 L43 61 L40 56 L34 53 Z" fill="#38bdf8"/>
  
  <!-- Shadow under character -->
  <ellipse cx="120" cy="200" rx="60" ry="10" fill="#0f172a" opacity="0.4"/>
</svg>