<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155" opacity="0.5"/>
  
  <!-- Character A (The one asking) -->
  <g transform="translate(40, 80)">
    <circle cx="40" cy="40" r="30" fill="#fbbf24"/>
    <path d="M25 35 Q30 25 40 25 T55 35" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="30" cy="35" r="3" fill="#0f172a"/>
    <circle cx="50" cy="35" r="3" fill="#0f172a"/>
    <path d="M30 50 Q40 55 50 50" stroke="#0f172a" stroke-width="3" fill="none"/>
    <path d="M40 70 L40 120" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- Character B (The one being addressed) -->
  <g transform="translate(140, 60)">
    <rect x="10" y="10" width="60" height="80" rx="10" fill="#38bdf8"/>
    <circle cx="40" cy="40" r="15" fill="#f1f5f9"/>
    <path d="M30 35 L35 35 M45 35 L50 35" stroke="#0f172a" stroke-width="2"/>
    <path d="M35 50 Q40 55 45 50" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Suit/Formal wear detail -->
    <path d="M10 60 L40 80 L70 60" fill="#1e293b"/>
  </g>

  <!-- Interaction Element: Speech Bubble Outline -->
  <path d="M90 60 Q80 40 100 40 L140 40 Q160 40 160 60 L160 80 Q160 100 140 100 L110 100 L90 120 L100 100" 
        fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="30" r="5" fill="#10b981"/>
  <circle cx="20" cy="200" r="8" fill="#ec4899"/>
  <path d="M180 150 L200 140 L220 150" stroke="#fbbf24" stroke-width="2" fill="none"/>
</svg>