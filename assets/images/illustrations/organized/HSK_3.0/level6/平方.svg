<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Room Interior Gradient -->
    <linearGradient id="roomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Floor Grid / Tile Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Laser Grid Accent -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow behind the room -->
  <circle cx="120" cy="110" r="90" fill="url(#glow)" />

  <!-- ==================== ROOM ENVIRONMENT (Context for 'Square Meters') ==================== -->
  
  <!-- Back Wall -->
  <rect x="25" y="25" width="190" height="120" rx="4" fill="url(#roomGrad)" />

  <!-- Window with Warm Light Beam -->
  <g transform="translate(150, 35)">
    <rect x="0" y="0" width="45" height="60" rx="2" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <line x1="22.5" y1="0" x2="22.5" y2="60" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="30" x2="45" y2="30" stroke="#475569" stroke-width="2"/>
    <!-- Light streaming down -->
    <polygon points="0,60 45,60 70,145 -35,145" fill="url(#lightBeam)" />
  </g>

  <!-- Wall Shelf with Prop -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="55" height="4" rx="1" fill="#64748b" />
    <!-- Miniature House/Building model on shelf -->
    <path d="M15,-10 L25,-20 L35,-10 L35,0 L15,0 Z" fill="#fb923c" />
    <rect x="20" y="-5" width="10" height="5" fill="#fde047" />
  </g>

  <!-- Floor (Isometric perspective representing square area) -->
  <path d="M15,145 L225,145 L215,215 L25,215 Z" fill="url(#floorGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Floor Grid Lines (Visualizing 'Square' Area / 平方 / Meters) -->
  <!-- Horizontal Grid Lines -->
  <line x1="40" y1="162" x2="200" y2="162" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="32" y1="182" x2="208" y2="182" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="26" y1="200" x2="214" y2="200" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <!-- Vertical Grid Lines -->
  <line x1="120" y1="145" x2="120" y2="215" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="75" y1="145" x2="60" y2="215" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="165" y1="145" x2="180" y2="215" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- ==================== MAIN SUBJECT: THE INTERACTIVE SQUARE AREA/LASER PROJECTION ==================== -->
  
  <!-- Glowing Square Floor Projection (Literal representation of "Square/Area") -->
  <g transform="translate(120, 180)">
    <!-- Base Glow Area -->
    <polygon points="0,-28 55,0 0,28 -55,0" fill="#38bdf8" opacity="0.15" />
    
    <!-- Neon Square Border Outline (Isometric Projection) -->
    <polygon points="0,-32 62,0 0,32 -62,0" fill="none" stroke="url(#laserGrad)" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Inner Grid Accent on Projection -->
    <polygon points="0,-16 31,0 0,16 -31,0" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  </g>

  <!-- ==================== PROPS & CHARACTER ELEMENTS ==================== -->

  <!-- Modern House Plant in Square Pot (Reinforcing square theme) -->
  <g transform="translate(40, 140)">
    <!-- Plant Square Pot -->
    <rect x="-12" y="10" width="24" height="22" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="-14" y="8" width="28" height="4" rx="1" fill="#e2e8f0" />
    <!-- Soil -->
    <ellipse cx="0" cy="12" rx="10" ry="3" fill="#475569" />
    <!-- Green Leaves -->
    <path d="M0,9 C-5,-5 -20,-15 -10,-25 C-2,-18 0,0 0,9 Z" fill="#10b981" />
    <path d="M0,9 C5,-8 18,-18 22,-10 C15,2 3,5 0,9 Z" fill="#34d399" />
    <path d="M0,9 C-2,-10 5,-22 12,-25 C8,-12 2,2 0,9 Z" fill="#059669" />
  </g>

  <!-- Cute Character/Architect holding a measuring tool, interacting with the space -->
  <g transform="translate(165, 125)">
    <!-- Character Shadow -->
    <ellipse cx="-5" cy="58" rx="18" ry="6" fill="#0f172a" opacity="0.5" />

    <!-- Body / Outfit (Orange Architect Vest) -->
    <path d="M-12,30 L12,30 L16,52 L-16,52 Z" fill="#f97316" />
    <rect x="-8" y="30" width="16" height="22" fill="#ea580c" />
    <!-- Inner Shirt -->
    <path d="M-6,30 L6,30 L6,42 L-6,42 Z" fill="#38bdf8" />

    <!-- Head -->
    <circle cx="0" cy="18" r="14" fill="#fbcfe8" /> <!-- Face base -->
    
    <!-- Hair -->
    <path d="M-14,15 C-15,6 -6,4 0,4 C8,4 15,6 14,15 C13,10 9,8 0,8 C-9,8 -13,10 -14,15 Z" fill="#1e293b" />

    <!-- Hard Hat (Yellow Construction/Architect Hat) -->
    <path d="M-16,10 C-16,2 -8,0 0,0 C8,0 16,2 16,10 Z" fill="#fbbf24" />
    <rect x="-18" y="9" width="36" height="3" rx="1.5" fill="#f59e0b" />

    <!-- Friendly Expression (Eyes & Smile) -->
    <circle cx="-4" cy="18" r="1.5" fill="#1e293b" />
    <circle cx="4" cy="18" r="1.5" fill="#1e293b" />
    <path d="M-2,23 Q0,26 2,23" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm gesturing towards the square floor space -->
    <path d="M-12,35 C-22,35 -28,45 -25,50" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" />
    <!-- Hand holding a futuristic blue laser measure/stylus -->
    <circle cx="-25" cy="51" r="3" fill="#38bdf8" />
    <line x1="-25" y1="51" x2="-35" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating Dimensional/Area Measurement Hologram Effect (Iconic vector narrative without text) -->
  <g transform="translate(100, 95)" opacity="0.9">
    <!-- Bracket Top-Left -->
    <path d="M-10,-5 L-15,-5 L-15,0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Bracket Bottom-Right -->
    <path d="M10,5 L15,5 L15,0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Small floating square badge -->
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="2,2" />
  </g>

  <!-- Decorative Foreground Plant Leaf (Framing the bottom left) -->
  <path d="M-10,250 C10,230 20,200 15,180 C10,200 0,220 -10,250 Z" fill="#059669" opacity="0.8" />
</svg>