<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Action Glow/Impact Gradient -->
    <radialGradient id="impactGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <!-- Indoor subway/crowded platform interior -->
  <rect x="20" y="20" width="200" height="120" rx="12" fill="#1e293b" opacity="0.5"/>
  <line x1="20" y1="60" x2="220" y2="60" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="20" y1="100" x2="220" y2="100" stroke="#334155" stroke-width="1"/>

  <!-- Floor Surface -->
  <path d="M 0 140 L 240 140 L 240 240 L 0 240 Z" fill="url(#floorGrad)"/>
  <!-- Floor Tile Lines for Depth -->
  <path d="M -20 140 L 40 240 M 60 140 L 140 240 M 140 140 L 220 240 M 200 140 L 280 240" stroke="#475569" stroke-width="1.5" opacity="0.4"/>

  <!-- Impact/Action Focus Glow -->
  <ellipse cx="120" cy="180" rx="70" ry="35" fill="url(#impactGlow)"/>

  <!-- Motion/Action Impact Lines (Context for 'treading/stepping') -->
  <path d="M 90 155 L 75 145" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 150 155 L 165 145" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="170" r="3" fill="#fbbf24"/>
  <circle cx="105" cy="165" r="2" fill="#38bdf8"/>
  <circle cx="135" cy="165" r="2" fill="#38bdf8"/>

  <!-- Person A's Foot (Victim's shoe, stationary on the ground) -->
  <g filter="url(#shadow)">
    <!-- Leg/Pant cuff A -->
    <path d="M 60 130 L 95 130 L 90 170 L 65 170 Z" fill="#38bdf8"/>
    <!-- Shoe A (Blue sneaker side view) -->
    <path d="M 50 175 C 50 165, 70 160, 95 160 C 105 160, 110 168, 110 175 L 50 175 Z" fill="#0284c7"/>
    <path d="M 50 175 L 110 175 L 110 185 C 110 188, 107 190, 104 190 L 56 190 C 53 190, 50 188, 50 185 Z" fill="#f8fafc"/>
    <path d="M 75 165 L 90 165 L 85 175 L 70 175 Z" fill="#bae6fd" opacity="0.6"/>
  </g>

  <!-- Person B's Foot (The active 'stepping/treading' action - 踩) -->
  <g filter="url(#shadow)">
    <!-- Leg/Pant cuff B (Dynamic angle) -->
    <path d="M 130 110 L 170 120 L 150 160 L 115 150 Z" fill="#ec4899"/>
    
    <!-- Shoe B (Orange/Amber dynamic sneaker coming down firmly) -->
    <!-- The angle clearly shows downward pressure onto Shoe A -->
    <g transform="translate(110, 150) rotate(-15)">
      <!-- Upper Shoe -->
      <path d="M 5 20 C 5 5, 35 -5, 65 5 C 75 8, 80 18, 75 25 L 5 25 Z" fill="#f97316"/>
      <!-- Shoe Accents -->
      <path d="M 35 3 C 45 3, 55 6, 62 12 L 55 20 C 45 15, 35 12, 25 12 Z" fill="#fb923c"/>
      <!-- Thick Sole -->
      <path d="M 0 25 L 80 25 L 78 35 C 78 38, 75 40, 72 40 L 6 40 C 3 40, 0 38, 0 35 Z" fill="#1e293b"/>
      <!-- Sole tread detail -->
      <line x1="20" y1="32" x2="25" y2="40" stroke="#f8fafc" stroke-width="2"/>
      <line x1="40" y1="32" x2="45" y2="40" stroke="#f8fafc" stroke-width="2"/>
      <line x1="60" y1="32" x2="65" y2="40" stroke="#f8fafc" stroke-width="2"/>
    </g>
  </g>

  <!-- Foreground / Environment Props for Spatial Context -->
  <!-- Dropped commute bag / coffee cup to add realistic emergency/clumsy narrative -->
  <g transform="translate(180, 185)" filter="url(#shadow)">
    <ellipse cx="0" cy="15" rx="14" ry="6" fill="#000000" opacity="0.3"/>
    <path d="M -8 0 L 8 0 L 10 18 L -10 18 Z" fill="#e2e8f0"/>
    <path d="M -6 0 L 6 0 L 4 -8 L -4 -8 Z" fill="#94a3b8"/>
    <!-- Spilled drops -->
    <circle cx="-15" cy="15" r="2" fill="#38bdf8"/>
    <circle cx="-22" cy="18" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Visual reaction lines/stars near the contact point to emphasize the surprise of being stepped on -->
  <path d="M 75 140 L 82 147" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 82 140 L 75 147" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  
  <path d="M 60 150 L 64 154" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 64 150 L 60 154" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

</svg>