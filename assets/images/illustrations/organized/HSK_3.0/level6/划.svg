<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Canoe Wooden Gradient -->
    <linearGradient id="canoeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Background Elements (Mountains & Moon) -->
  <circle cx="190" cy="60" r="22" fill="#fbbf24" opacity="0.9"/>
  <circle cx="190" cy="60" r="28" fill="#fbbf24" opacity="0.2"/>

  <!-- Distant Mountains -->
  <path d="M0 130 L60 90 L130 140 L200 85 L240 120 L240 150 L0 150 Z" fill="#334155" opacity="0.5"/>
  <path d="M20 150 L90 100 L160 150 L220 110 L240 130 L240 150 L0 150 Z" fill="#475569" opacity="0.6"/>

  <!-- Water Body -->
  <path d="M0 135 C 60 125, 120 145, 240 135 L240 240 L0 240 Z" fill="url(#waterGrad)"/>

  <!-- Water Ripple Lines -->
  <path d="M30 155 Q 50 150, 70 155" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M150 165 Q 170 160, 190 165" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M80 190 Q 110 185, 140 190" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M170 210 Q 190 205, 215 210" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Lily Pads / Nature Details -->
  <ellipse cx="45" cy="175" rx="8" ry="4" fill="#10b981" opacity="0.8"/>
  <path d="M45 175 L50 173" stroke="#065f46" stroke-width="1"/>
  <ellipse cx="205" cy="195" rx="10" ry="5" fill="#059669" opacity="0.8"/>

  <!-- MAIN SCENE: Canoe (Chèo thuyền) & Paddler -->
  <g filter="url(#shadow)">
    <!-- Water Splashes around Canoe -->
    <path d="M75 162 Q 82 155, 88 160" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M145 168 Q 152 162, 158 167" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Canoe Hull -->
    <path d="M50 160 C 70 180, 160 180, 190 160 C 160 170, 80 170, 50 160 Z" fill="#92400e"/>
    <path d="M45 155 C 65 178, 165 178, 195 155 C 165 168, 75 168, 45 155 Z" fill="url(#canoeGrad)"/>
    <!-- Canoe Inner Rim / Depth -->
    <path d="M50 157 C 70 172, 160 172, 190 157 C 160 164, 80 164, 50 157 Z" fill="#78350f"/>

    <!-- Paddler Character -->
    <!-- Life Vest / Torso -->
    <path d="M105 138 C 112 135, 125 135, 132 138 L 135 155 C 130 160, 110 160, 102 155 Z" fill="#f43f5e"/>
    <path d="M115 137 L 115 156" stroke="#be123c" stroke-width="2"/>

    <!-- Head & Hat -->
    <circle cx="118" cy="123" r="10" fill="#fde047"/>
    <!-- Straw Hat (Cone) -->
    <path d="M100 120 Q 118 108, 136 120 L 130 123 Q 118 116, 106 123 Z" fill="#ca8a04"/>

    <!-- Arms & Paddle Action (The Action of "划" - Paddling) -->
    <!-- Back Arm -->
    <path d="M112 140 Q 100 135, 95 145" stroke="#fde047" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Front Arm reaching forward -->
    <path d="M124 140 Q 138 130, 148 135" stroke="#fde047" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Paddle Shaft & Blade (Dynamic Motion Angle) -->
    <path d="M85 110 L 155 150" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <!-- Paddle Blade Top (In Air) -->
    <path d="M75 100 L 92 118 L 88 122 L 71 104 Z" fill="#b45309" stroke="#78350f" stroke-linejoin="round"/>
    <!-- Paddle Blade Bottom (In Water Splash) -->
    <path d="M150 146 L 168 158 L 164 163 L 146 151 Z" fill="#b45309" stroke="#78350f" stroke-linejoin="round"/>
    <!-- Splash droplets at paddle tip -->
    <circle cx="172" cy="160" r="2" fill="#38bdf8"/>
    <circle cx="165" cy="167" r="1.5" fill="#38bdf8"/>
    <circle cx="158" cy="155" r="2" fill="#38bdf8"/>
  </g>

  <!-- Foreground Atmospheric Lighting / Glow Effects -->
  <circle cx="120" cy="120" r="100" fill="url(#skyGrad)" opacity="0.05" style="mix-blend-mode: overlay;"/>

  <!-- Dynamic Motion Lines indicating forward paddling -->
  <path d="M35 150 Q 40 148, 48 150" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M25 158 Q 32 156, 38 158" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>