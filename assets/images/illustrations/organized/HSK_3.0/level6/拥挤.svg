<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Bus Window Frame -->
  <rect x="20" y="30" width="200" height="180" rx="10" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- Passengers (Crowded) -->
  <g fill="#fbbf24">
    <circle cx="60" cy="90" r="15"/>
    <circle cx="100" cy="80" r="15"/>
    <circle cx="140" cy="95" r="15"/>
    <circle cx="180" cy="85" r="15"/>
    <circle cx="40" cy="140" r="15"/>
    <circle cx="80" cy="130" r="15"/>
    <circle cx="120" cy="145" r="15"/>
    <circle cx="160" cy="135" r="15"/>
    <circle cx="200" cy="150" r="15"/>
    <circle cx="50" cy="180" r="15"/>
    <circle cx="90" cy="190" r="15"/>
    <circle cx="130" cy="185" r="15"/>
    <circle cx="170" cy="195" r="15"/>
  </g>
  
  <!-- Clothing Accents -->
  <rect x="50" y="105" width="20" height="20" fill="#38bdf8" rx="4"/>
  <rect x="90" y="95" width="20" height="20" fill="#ec4899" rx="4"/>
  <rect x="130" y="110" width="20" height="20" fill="#10b981" rx="4"/>
  <rect x="170" y="100" width="20" height="20" fill="#fb923c" rx="4"/>
  <rect x="30" y="155" width="20" height="20" fill="#10b981" rx="4"/>
  <rect x="70" y="145" width="20" height="20" fill="#fb923c" rx="4"/>
  <rect x="110" y="160" width="20" height="20" fill="#38bdf8" rx="4"/>
  <rect x="150" y="150" width="20" height="20" fill="#ec4899" rx="4"/>
  
  <!-- Handrails -->
  <rect x="40" y="30" width="4" height="180" fill="#94a3b8"/>
  <rect x="120" y="30" width="4" height="180" fill="#94a3b8"/>
  <rect x="200" y="30" width="4" height="180" fill="#94a3b8"/>
  
  <!-- Ceiling Handle -->
  <path d="M80 30 L80 50 M70 50 L90 50 A 10 10 0 0 1 70 50" stroke="#94a3b8" stroke-width="4" fill="none"/>
</svg>