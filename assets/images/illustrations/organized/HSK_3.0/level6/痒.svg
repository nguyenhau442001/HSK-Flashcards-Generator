    <path d="M20 60 L 40 40 L 60 50 L 50 70 Z" fill="#fbbf24"/>
    <path d="M45 45 L 55 35 L 65 45 L 55 55 Z" fill="#fbbf24"/>
    <path d="M55 35 L 65 25 L 75 35 L 65 45 Z" fill="#fbbf24"/>
    <path d="M65 25 L 75 15 L 85 25 L 75 35 Z" fill="#fbbf24"/>
  </g>
  
  <!-- Motion lines for action -->
  <path d="M80 130 Q 100 110 120 130" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M70 140 Q 90 120 110 140" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Decorative elements to ground the scene -->
  <circle cx="200" cy="40" r="15" fill="#10b981" opacity="0.3"/>
  <circle cx="30" cy="50" r="8" fill="#fb923c" opacity="0.4"/>
