<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for Energy -->
    <radialGradient id="energyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Slide Gradient -->
    <linearGradient id="slideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Kid Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Motion Blur Filter Effect via opacity/layering in vector -->
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Energy Glow -->
  <circle cx="120" cy="120" r="100" fill="url(#energyGlow)" />

  <!-- Background Environment: Playground Elements -->
  <!-- Playful abstract background floating stars/confetti for lively mood -->
  <g fill="#fbbf24" opacity="0.6">
    <path d="M40,50 L42,56 L48,58 L42,60 L40,66 L38,60 L32,58 L38,56 Z" transform="scale(0.8) translate(10, 10)" />
    <path d="M200,80 L201,84 L205,85 L201,86 L200,90 L199,86 L195,85 L199,84 Z" />
    <circle cx="180" cy="45" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="50" cy="170" r="4" fill="#ec4899" opacity="0.7" />
  </g>

  <!-- Playground Structure: Jungle Gym / Slide Base -->
  <path d="M160,200 L210,200 L210,120 L160,140 Z" fill="#334155" opacity="0.4" />
  
  <!-- Slide -->
  <path d="M140,90 Q180,120 215,190 L195,200 Q165,140 130,110 Z" fill="url(#slideGrad)" />
  <path d="M135,95 Q175,125 210,195" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Motion lines indicating high energy / movement -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M60,110 Q90,95 120,105" />
    <path d="M45,125 Q75,110 105,120" />
    <path d="M70,95 Q90,85 110,90" />
  </g>

  <!-- Secondary Motion Sparks -->
  <path d="M110,70 L118,75 L110,80 L105,72 Z" fill="#38bdf8" />
  <circle cx="140" cy="75" r="5" fill="#f43f5e" />
  <path d="M60,150 Q65,140 75,145" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- MAIN CHARACTER: Dynamic Energetic Kid -->
  <g transform="translate(10, 10)">
    <!-- Dynamic Body Tilt & Action Pose -->
    
    <!-- Action Arms (Flailing joyfully in air) -->
    <path d="M85,95 L65,75" stroke="#fcd34d" stroke-width="10" stroke-linecap="round" />
    <circle cx="60" cy="72" r="6" fill="#fcd34d" /> <!-- Left Hand -->

    <path d="M115,95 L135,75" stroke="#fcd34d" stroke-width="10" stroke-linecap="round" />
    <circle cx="140" cy="72" r="6" fill="#fcd34d" /> <!-- Right Hand -->

    <!-- Torso -->
    <path d="M85,85 L115,85 L110,125 L90,125 Z" fill="url(#shirtGrad)" />
    <!-- Shirt Stripe Details -->
    <path d="M88,100 L112,100" stroke="#fecdd3" stroke-width="4" />
    <path d="M89,112 L111,112" stroke="#fecdd3" stroke-width="4" />

    <!-- Legs (Running / Jumping Action) -->
    <!-- Left Leg Bent -->
    <path d="M92,123 L75,145 L60,135" stroke="url(#pantsGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="56" cy="132" r="5" fill="#334155" /> <!-- Left Shoe -->

    <!-- Right Leg Extended -->
    <path d="M108,123 L125,150 L145,155" stroke="url(#pantsGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="150" cy="156" r="5" fill="#334155" /> <!-- Right Shoe -->

    <!-- Head & Face (Expressive, laughing/excited) -->
    <g transform="translate(100, 65)">
      <!-- Hair -->
      <path d="M-20,-10 Q0,-30 20,-10 Q25,5 15,10 Q5,-5 -5,10 Q-25,5 -20,-10 Z" fill="#0f172a" />
      <circle cx="-18" cy="-5" r="4" fill="#0f172a" />
      <circle cx="18" cy="-5" r="4" fill="#0f172a" />

      <!-- Face Base -->
      <circle cx="0" cy="0" r="18" fill="#fcd34d" />

      <!-- Cheeks (Excited Blush) -->
      <circle cx="-10" cy="4" r="3" fill="#f43f5e" opacity="0.6" />
      <circle cx="10" cy="4" r="3" fill="#f43f5e" opacity="0.6" />

      <!-- Eyes (Happy Closed Arcs) -->
      <path d="M-10,-2 Q-6,-6 -2,-2" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M2,-2 Q6,-6 10,-2" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

      <!-- Big Open Laughing Mouth -->
      <path d="M-6,5 Q0,14 6,5 Z" fill="#1e293b" />
      <path d="M-4,7 Q0,11 4,7" fill="#f43f5e" />
    </g>
  </g>

  <!-- Foreground Energy Particles & Ground details -->
  <ellipse cx="100" cy="190" rx="40" ry="8" fill="#0f172a" opacity="0.5" />
  
  <!-- Bouncing Ball representing playful activity -->
  <circle cx="50" cy="170" r="12" fill="#10b981" />
  <path d="M42,164 Q46,162 52,165" stroke="#a7f3d0" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Ball motion trail -->
  <path d="M30,190 Q40,175 46,172" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" fill="none" />

  <!-- Additional glowing star bursts for maximum 'sôi động' (vibrant/active) vibe -->
  <g fill="#38bdf8">
    <path d="M210,40 L212,46 L218,48 L212,50 L210,56 L208,50 L202,48 L208,46 Z" />
  </g>
  <g fill="#fb923c">
    <path d="M30,80 L31,84 L35,85 L31,86 L30,90 L29,86 L25,85 L29,84 Z" />
  </g>
</svg>