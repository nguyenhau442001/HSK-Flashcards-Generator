<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Gold Mic Gradients -->
    <linearGradient id="micHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="micBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Stand & Base Gradient -->
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Soundwave Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Studio Elements (Ambiance) -->
  <g opacity="0.4">
    <!-- Acoustic Foam Panels -->
    <path d="M 20 40 L 40 20 L 40 60 L 20 40 Z" fill="#334155"/>
    <path d="M 210 180 L 230 160 L 230 200 L 210 180 Z" fill="#334155"/>
    <!-- Floating Music/Sound Notes -->
    <circle cx="50" cy="80" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="190" cy="60" r="3" fill="#ec4899" opacity="0.6"/>
    <circle cx="170" cy="150" r="1.5" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Sound Waves & Energy (Action-packed) -->
  <g filter="url(#neonGlow)">
    <!-- Left Waves -->
    <path d="M 85 95 C 75 100 75 110 85 115" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 70 85 C 55 95 55 115 70 125" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    
    <!-- Right Waves -->
    <path d="M 155 95 C 165 100 165 110 155 115" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 170 85 C 185 95 185 115 170 125" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Top Expanding Pulse -->
    <ellipse cx="120" cy="70" rx="15" ry="6" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <ellipse cx="120" cy="62" rx="25" ry="9" fill="none" stroke="#fb923c" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Vibrant Floating Audio Spectrum Bars -->
  <g opacity="0.9">
    <rect x="35" y="140" width="4" height="18" rx="2" fill="#38bdf8"/>
    <rect x="45" y="125" width="4" height="33" rx="2" fill="#38bdf8"/>
    <rect x="55" y="135" width="4" height="23" rx="2" fill="#10b981"/>
    
    <rect x="181" y="135" width="4" height="23" rx="2" fill="#10b981"/>
    <rect x="191" y="125" width="4" height="33" rx="2" fill="#ec4899"/>
    <rect x="201" y="140" width="4" height="18" rx="2" fill="#ec4899"/>
  </g>

  <!-- MICROPHONE ILLUSTRATION -->
  <g transform="translate(0, 5)">
    <!-- Base Desk Stand -->
    <ellipse cx="120" cy="205" rx="32" ry="10" fill="url(#metalDark)"/>
    <ellipse cx="120" cy="203" rx="26" ry="7" fill="#475569"/>
    
    <!-- Vertical Stand Rod -->
    <rect x="117" y="150" width="6" height="55" rx="3" fill="url(#metalDark)"/>

    <!-- Adjuster Knob -->
    <rect x="114" y="145" width="12" height="8" rx="2" fill="#f59e0b"/>

    <!-- U-Shaped Metal Mount (Yoke) -->
    <path d="M 98 115 C 98 145 142 145 142 115" stroke="url(#metalDark)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Microphone Body -->
    <!-- Lower Handle -->
    <path d="M 108 115 L 132 115 L 129 160 C 129 163 125 165 120 165 C 115 165 111 163 111 160 Z" fill="url(#micBody)"/>
    <!-- Handle Grip Lines -->
    <line x1="113" y1="125" x2="127" y2="125" stroke="#92400e" stroke-width="1.5" opacity="0.6"/>
    <line x1="112" y1="135" x2="128" y2="135" stroke="#92400e" stroke-width="1.5" opacity="0.6"/>
    <line x1="111" y1="145" x2="129" y2="145" stroke="#92400e" stroke-width="1.5" opacity="0.6"/>

    <!-- Connector Ring -->
    <rect x="107" y="112" width="26" height="5" rx="1" fill="#cbd5e1"/>

    <!-- Microphone Head (Vintage Retro Style Capsule) -->
    <!-- Outer Golden Frame -->
    <path d="M 102 85 C 102 65 138 65 138 85 L 138 112 C 138 115 102 115 102 112 Z" fill="url(#micHead)"/>
    
    <!-- Inner Dark Mesh Grille -->
    <path d="M 105 85 C 105 68 135 68 135 85 L 135 110 C 135 112 105 112 105 110 Z" fill="#334155"/>
    
    <!-- Grille Highlights & Crosshatch Details -->
    <path d="M 105 85 L 135 85" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
    <path d="M 105 95 L 135 95" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
    <path d="M 120 68 L 120 112" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
    <path d="M 110 70 C 115 70 120 75 120 85 C 120 95 125 100 130 102" stroke="#d97706" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 130 70 C 125 70 120 75 120 85 C 120 95 115 100 110 102" stroke="#d97706" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- Top Metallic Cap Rim -->
    <path d="M 102 85 C 102 80 138 80 138 85 C 138 90 102 90 102 85 Z" fill="url(#micHead)" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- Foreground Atmospheric Elements (Depth) -->
  <!-- Cute little glowing dots / interface sparks -->
  <circle cx="95" cy="190" r="3" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="145" cy="180" r="2" fill="#10b981" filter="url(#neonGlow)"/>
  <circle cx="130" cy="45" r="2.5" fill="#f59e0b" filter="url(#neonGlow)"/>

  <!-- Subtle floor reflection under mic base -->
  <ellipse cx="120" cy="214" rx="18" ry="4" fill="#0f172a" opacity="0.6"/>
</svg>