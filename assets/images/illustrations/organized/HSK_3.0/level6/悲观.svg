<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="rain-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Puddle Reflection Gradient -->
    <linearGradient id="puddle-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.1" />
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <radialGradient id="window-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements: Window / Room Interior -->
  <g id="interior-background" opacity="0.6">
    <!-- Wall Texture / Back Drop -->
    <rect x="20" y="20" width="200" height="170" rx="12" fill="#090d16" />
    
    <!-- Window Frame Structure -->
    <rect x="130" y="40" width="70" height="110" rx="8" fill="#1e293b" />
    <!-- Window Pane (Dark rainy night outside) -->
    <rect x="135" y="45" width="60" height="100" rx="4" fill="#0284c7" opacity="0.2" />
    
    <!-- Window Pane Grid -->
    <line x1="165" y1="45" x2="165" y2="145" stroke="#1e293b" stroke-width="3" />
    <line x1="135" y1="95" x2="195" y2="95" stroke="#1e293b" stroke-width="3" />

    <!-- Distant City Lights / Bokeh Outside Window -->
    <circle cx="145" cy="65" r="3" fill="#f59e0b" opacity="0.8" />
    <circle cx="180" cy="80" r="4" fill="#ec4899" opacity="0.5" />
    <circle cx="150" cy="120" r="2.5" fill="#38bdf8" opacity="0.7" />

    <!-- Bookshelf / Props in background -->
    <rect x="35" y="55" width="75" height="8" rx="2" fill="#334155" />
    <rect x="45" y="35" width="12" height="20" rx="2" fill="#f43f5e" />
    <rect x="59" y="38" width="10" height="17" rx="2" fill="#0ea5e9" />
    <rect x="71" y="30" width="14" height="25" rx="2" fill="#eab308" />
  </g>

  <!-- Rain Falling Inside/Outside (Atmospheric streaks) -->
  <g id="rain-streaks" stroke="url(#rain-grad)" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="50" x2="30" y2="80" />
    <line x1="80" y1="30" x2="70" y2="60" />
    <line x1="110" y1="70" x2="100" y2="100" />
    <line x1="20" y1="120" x2="10" y2="150" />
  </g>

  <!-- Foreground Floor / Surface -->
  <path d="M10 190 L230 190 L220 220 L20 220 Z" fill="#090d16" />
  <ellipse cx="110" cy="205" rx="90" ry="10" fill="url(#puddle-grad)" />

  <!-- Main Subject: A sad, slumped character sitting on a floor/chair, embodying "pessimism/gloomy mood" -->
  <g id="pessimistic-character" transform="translate(10, 15)">
    <!-- Character Shadow -->
    <ellipse cx="95" cy="180" rx="35" ry="8" fill="#020617" opacity="0.6" />

    <!-- Drooping Umbrella / Cover (symbolizing gloom) -->
    <path d="M 60 110 C 60 80, 130 80, 130 110 Z" fill="#334155" />
    <path d="M 95 75 L 95 165" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M 95 165 C 90 170, 85 168, 85 163" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Character Body (Slumped, Hugging Knees) -->
    <!-- Legs / Knees drawn up -->
    <path d="M 70 160 Q 75 130 95 130 Q 115 130 120 160 Z" fill="#475569" />
    
    <!-- Shoes / Feet -->
    <ellipse cx="65" cy="172" rx="10" ry="6" fill="#1e293b" />
    <ellipse cx="125" cy="172" rx="10" ry="6" fill="#1e293b" />

    <!-- Torso / Back (Slumped forward) -->
    <path d="M 75 145 C 65 130, 75 105, 95 105 C 115 105, 125 130, 115 145 Z" fill="#64748b" />

    <!-- Arms wrapped around knees -->
    <path d="M 75 135 Q 95 120 115 135" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" />

    <!-- Head (Hanging down, buried in arms/knees) -->
    <circle cx="95" cy="115" r="18" fill="#94a3b8" />
    
    <!-- Sad Closed Eyes / Expression (Simple curved lines pointing downward) -->
    <path d="M 90 115 Q 93 118 96 115" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M 98 115 Q 101 118 104 115" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    
    <!-- Gloomy Rain Cloud hovering directly over the character -->
    <g id="gloomy-cloud" transform="translate(65, 45)">
      <!-- Cloud Shape -->
      <path d="M 15 30 
               C 5 30, 0 20, 10 10 
               C 15 0, 30 -2, 40 8 
               C 55 0, 70 10, 65 22 
               C 75 25, 75 40, 60 40 
               L 15 40 Z" 
            fill="#475569" />
      
      <!-- Inner Darker Cloud Detail -->
      <path d="M 25 35 
               C 18 35, 15 28, 22 22 
               C 25 16, 35 15, 42 21 
               C 52 16, 60 22, 57 30 
               C 63 32, 62 38, 52 38 
               L 25 38 Z" 
            fill="#334155" />

      <!-- Heavy Rain Drops Falling from Cloud onto Character -->
      <line x1="20" y1="45" x2="15" y2="65" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="35" y1="48" x2="30" y2="70" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="50" y1="45" x2="45" y2="65" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Foreground details: A wilted potted plant reinforcing the melancholic theme -->
  <g id="wilted-plant" transform="translate(170, 130)">
    <!-- Plant Pot -->
    <path d="M 10 40 L 20 70 L 40 70 L 50 40 Z" fill="#b45309" />
    <ellipse cx="30" cy="40" rx="20" ry="5" fill="#d97706" />
    
    <!-- Soil -->
    <ellipse cx="30" cy="41" rx="17" ry="3" fill="#78350f" />

    <!-- Wilted Stems & Drooping Leaves -->
    <path d="M 30 40 Q 20 20 10 25" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" />
    <path d="M 9 23 Q 5 28 2 25" fill="#16a34a" /> <!-- Drooping leaf -->

    <path d="M 30 40 Q 40 15 50 20" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" />
    <path d="M 51 18 Q 57 23 55 26" fill="#16a34a" /> <!-- Drooping leaf -->

    <path d="M 30 40 Q 30 10 32 15" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Ambient glowing contrast accent (Hope glimmering faintly in the distance, unused by the pessimist) -->
  <circle cx="200" cy="30" r="15" fill="url(#window-glow)" />

  <!-- Vignette Border Overlay (Clean rounded inset) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>