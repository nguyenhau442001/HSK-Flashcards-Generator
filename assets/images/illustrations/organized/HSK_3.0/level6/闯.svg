<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light / Burst Gradient -->
    <radialGradient id="burstGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Door Wood Gradient -->
    <linearGradient id="doorWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background -->
  <g id="room-interior">
    <!-- Back Wall -->
    <rect x="20" y="20" width="200" height="150" fill="#1e293b" />
    
    <!-- Wallpaper Stripe Details -->
    <line x1="60" y1="20" x2="60" y2="170" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>
    <line x1="120" y1="20" x2="120" y2="170" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>
    <line x1="180" y1="20" x2="180" y2="170" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>

    <!-- Background Props (Bookshelf & Lamp to establish room context) -->
    <rect x="180" y="50" width="30" height="90" rx="2" fill="#334155" />
    <rect x="185" y="70" width="20" height="4" fill="#64748b" />
    <rect x="185" y="95" width="20" height="4" fill="#64748b" />
    <rect x="185" y="120" width="20" height="4" fill="#64748b" />

    <!-- Floor Perspective -->
    <polygon points="20,170 220,170 240,220 0,220" fill="url(#floorGrad)" />
    <!-- Floor Planks -->
    <line x1="20" y1="185" x2="220" y2="185" stroke="#0f172a" stroke-width="1.5" opacity="0.7"/>
    <line x1="10" y1="202" x2="230" y2="202" stroke="#0f172a" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Dramatic Burst / Light effect from breaking in -->
  <circle cx="95" cy="115" r="70" fill="url(#burstGlow)" />
  <path d="M 50 80 L 75 100 L 40 130 Z" fill="#fbbf24" opacity="0.3" filter="url(#glow)"/>
  <path d="M 130 70 L 115 105 L 145 90 Z" fill="#f59e0b" opacity="0.3" filter="url(#glow)"/>

  <!-- Broken Door (Flying outwards to emphasize 'xông vào' / breaking through) -->
  <g id="broken-door" filter="url(#shadow)">
    <!-- Left Door Frame -->
    <path d="M 20 40 L 45 50 L 45 170 L 20 170 Z" fill="#451a03" />
    <!-- Right Door Frame -->
    <path d="M 125 50 L 150 40 L 150 170 L 125 170 Z" fill="#451a03" />

    <!-- Shattered Door Panel (Left piece tilted out) -->
    <g transform="translate(15, 60) rotate(-25) scale(0.7)">
      <path d="M 0 0 L 50 10 L 50 140 L 0 130 Z" fill="url(#doorWood)" stroke="#451a03" stroke-width="2"/>
      <rect x="10" y="20" width="30" height="40" rx="2" fill="#451a03" opacity="0.3" />
      <rect x="10" y="70" width="30" height="40" rx="2" fill="#451a03" opacity="0.3" />
    </g>

    <!-- Shattered Door Panel (Right piece flying/falling) -->
    <g transform="translate(135, 90) rotate(35) scale(0.6)">
      <path d="M 0 0 L 50 -10 L 50 120 L 0 130 Z" fill="url(#doorWood)" stroke="#451a03" stroke-width="2"/>
      <rect x="10" y="20" width="30" height="30" rx="2" fill="#451a03" opacity="0.3" />
    </g>

    <!-- Flying Wood Splinters and Dust Particles -->
    <polygon points="75,95 82,92 78,102" fill="#b45309" />
    <polygon points="105,75 115,70 110,85" fill="#d97706" />
    <polygon points="60,130 68,125 64,138" fill="#92400e" />
    <circle cx="90" cy="85" r="3" fill="#fef08a" opacity="0.8" />
    <circle cx="120" cy="115" r="2" fill="#fef08a" opacity="0.8" />
    <circle cx="65" cy="105" r="2.5" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Main Character (Bashing/Bursting through the doorway - 'Xông vào') -->
  <g id="character" filter="url(#shadow)">
    <!-- Motion lines behind character -->
    <path d="M 40 105 L 75 105" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 30 125 L 65 125" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 45 145 L 80 145" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Dynamic Torso (Leaning forward with momentum) -->
    <path d="M 70 95 C 75 80, 95 80, 105 95 L 115 135 C 115 145, 95 150, 80 145 Z" fill="#3b82f6" />
    <!-- Hoodie Pocket & Detail -->
    <path d="M 85 120 L 105 120 L 100 138 L 90 138 Z" fill="#2563eb" />

    <!-- Head & Expressive Face -->
    <g transform="translate(100, 75)">
      <!-- Hair -->
      <path d="M -12 -5 C -10 -18, 12 -18, 16 -5 C 18 2, 14 10, 14 10 L -15 10 Z" fill="#1e293b" />
      <!-- Face Skin -->
      <circle cx="2" cy="4" r="14" fill="#fed7aa" />
      <!-- Determined Eyes (Slanted for action) -->
      <path d="M -2 2 L 4 4" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 6 2 L 12 4" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
      <!-- Determined Open Mouth (Shouting/Surging energy) -->
      <path d="M 2 9 C 4 9, 7 9, 8 12 C 6 14, 3 14, 2 9 Z" fill="#991b1b" />
      <!-- Action Blush / Sweat drop -->
      <path d="M 16 -2 C 18 2, 14 4, 15 7" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Arms Reaching/Bursting Forward -->
    <!-- Back Arm -->
    <path d="M 75 100 L 50 90 L 40 100" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="38" cy="102" r="5" fill="#fed7aa" />

    <!-- Front Arm (Pushing/Breaking threshold) -->
    <path d="M 100 100 L 125 105 L 135 100" fill="none" stroke="#3b82f6" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="138" cy="98" r="6" fill="#fed7aa" />

    <!-- Legs in Mid-Stride / Dynamic Jump -->
    <!-- Back Leg -->
    <path d="M 80 142 L 60 160 L 45 155" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Leg -->
    <path d="M 105 142 L 125 165 L 140 160" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shoes / Sneakers with Accent Color -->
    <circle cx="43" cy="154" r="6" fill="#ef4444" />
    <circle cx="142" cy="159" r="6" fill="#ef4444" />
  </g>

  <!-- Foreground Room Details (Desk & Plant to frame the scene) -->
  <g id="foreground-props">
    <!-- Desk on the left -->
    <rect x="0" y="150" width="55" height="70" fill="#334155" rx="4" />
    <path d="M 0 150 L 55 150 L 60 160 L 0 160 Z" fill="#475569" />
    <!-- Lamp on Desk -->
    <path d="M 30 150 L 30 130 L 45 125 L 30 120 Z" fill="#0ea5e9" />
    <circle cx="15" cy="140" r="8" fill="#10b981" /> <!-- Small plant pot -->
    <path d="M 10 140 Q 15 120 20 140 Z" fill="#059669" />
  </g>

  <!-- Sparkles & Action Impact Flashes -->
  <g id="impact-sparkles">
    <path d="M 125 65 L 128 75 L 138 78 L 128 81 L 125 91 L 122 81 L 112 78 L 122 75 Z" fill="#fbbf24" />
    <path d="M 55 110 L 57 116 L 63 118 L 57 120 L 55 126 L 53 120 L 47 118 L 53 116 Z" fill="#f59e0b" />
    <circle cx="110" cy="55" r="3" fill="#38bdf8" opacity="0.9" />
    <circle cx="70" cy="165" r="2" fill="#38bdf8" opacity="0.9" />
  </g>

  <!-- Outer Frame / Border Overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="4" opacity="0.3"/>
</svg>