<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Water Drop Gradient -->
    <linearGradient id="drop-grad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#glow)" />

  <!-- Background Environment: Cozy Room with Window & Rain -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="140" y="30" width="70" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <rect x="145" y="35" width="60" height="80" rx="3" fill="url(#window-light)" />
    <!-- Window cross bars -->
    <line x1="175" y1="35" x2="175" y2="115" stroke="#334155" stroke-width="2" />
    <line x1="145" y1="75" x2="205" y2="75" stroke="#334155" stroke-width="2" />
    
    <!-- Rain outside window -->
    <line x1="155" y1="45" x2="151" y2="55" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="185" y1="50" x2="181" y2="60" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="165" y1="85" x2="161" y2="95" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="195" y1="90" x2="191" y2="100" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Indoor Shelf & Plant/Prop -->
    <path d="M20 180 L130 180" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Leaking Pipe / Ceiling Source (Top Left) -->
  <g id="leak-source">
    <path d="M30 0 L30 45 L50 45 L50 0" fill="none" stroke="#475569" stroke-width="6" stroke-linejoin="round" />
    <ellipse cx="40" cy="45" rx="12" ry="4" fill="#334155" />
    
    <!-- Hanging Drop (Forming) -->
    <path d="M40 47 C37 47 35 50 35 53 C35 57 40 61 40 61 C40 61 45 57 45 53 C45 50 43 47 40 47 Z" fill="url(#drop-grad)" />
  </g>

  <!-- Falling Water Drops (The core action: "từng giọt từng giọt") -->
  <g id="falling-drops">
    <!-- Mid-air drop 1 -->
    <path d="M40 95 C38 95 36 97 36 100 C36 103 40 108 40 108 C40 108 44 103 44 100 C44 97 42 95 40 95 Z" fill="url(#drop-grad)" />
    <path d="M38 98 Q39 97 40 97" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Mid-air drop 2 (closer to target) -->
    <path d="M40 135 C38.5 135 37 136.5 37 139 C37 142 40 146 40 146 C40 146 43 142 43 139 C43 136.5 41.5 135 40 135 Z" fill="url(#drop-grad)" />
  </g>

  <!-- Impact Splash on the Bucket/Pot -->
  <g id="splash">
    <ellipse cx="40" cy="172" rx="6" ry="2" fill="#38bdf8" opacity="0.6" />
    <path d="M35 172 Q30 168 27 170" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M45 172 Q50 168 53 170" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="33" cy="166" r="1.5" fill="#7dd3fc" />
    <circle cx="47" cy="166" r="1.5" fill="#7dd3fc" />
  </g>

  <!-- Catching Container (Metal Bucket) -->
  <g id="bucket">
    <path d="M22 170 L58 170 L54 210 C54 213 51 215 48 215 L32 215 C29 215 26 213 26 210 Z" fill="#64748b" stroke="#94a3b8" stroke-width="2" />
    <!-- Bucket rim -->
    <ellipse cx="40" cy="170" rx="18" ry="4" fill="#94a3b8" />
    <ellipse cx="40" cy="170" rx="15" ry="2.5" fill="#334155" />
    <!-- Water inside bucket -->
    <ellipse cx="40" cy="171" rx="14" ry="2" fill="#0ea5e9" opacity="0.8" />
    <!-- Bucket handle -->
    <path d="M24 170 C15 150 20 135 40 135 C60 135 65 150 56 170" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Main Expressive Character (Surprised/Annoyed by the leak) -->
  <g id="character" transform="translate(30, 0)">
    <!-- Body & Torso (Leaning back defensively) -->
    <path d="M95 180 C95 155 105 140 125 135 L140 180 Z" fill="url(#shirt-grad)" />
    
    <!-- Shoulders & Neck -->
    <path d="M110 138 C110 128 118 122 128 122 C138 122 146 128 146 138 Z" fill="#fcd34d" />
    
    <!-- Head (Expressive, looking up at the leak with wide eyes and open mouth) -->
    <g transform="translate(128, 98)">
      <!-- Hair Base -->
      <path d="M-22 -10 C-22 -28 -5 -32 5 -32 C20 -32 24 -22 24 -10 C24 -2 22 5 22 5 C22 5 18 -4 10 -6 C2 -8 -5 -4 -12 2 C-18 8 -22 2 -22 -10 Z" fill="#334155" />
      
      <!-- Face Skin -->
      <ellipse cx="0" cy="0" rx="20" ry="22" fill="#fde047" />

      <!-- Surprised Eyebrows (Arched high up) -->
      <path d="M-13 -9 C-9 -14 -5 -12 -3 -10" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M3 -10 C5 -12 9 -14 13 -9" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

      <!-- Wide Expressive Eyes -->
      <circle cx="-8" cy="-3" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <circle cx="-8" cy="-3" r="2" fill="#1e293b" />
      <circle cx="-7" cy="-5" r="0.8" fill="#ffffff" /> <!-- highlight -->

      <circle cx="8" cy="-3" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <circle cx="8" cy="-3" r="2" fill="#1e293b" />
      <circle cx="9" cy="-5" r="0.8" fill="#ffffff" /> <!-- highlight -->

      <!-- Shocked Open Mouth ("O" shape) -->
      <ellipse cx="0" cy="9" rx="5" ry="7" fill="#1e293b" />
      <path d="M-5 7 Q0 6 5 7" fill="#f43f5e" />

      <!-- Sweat drop of panic/annoyance -->
      <path d="M22 -4 C22 -4 26 2 26 5 C26 7 24 9 22 9 C20 9 18 7 18 5 C18 2 22 -4 22 -4 Z" fill="#38bdf8" opacity="0.8" />
    </g>

    <!-- Arms (Gesturing in exasperation / pointing at the drop) -->
    <!-- Left arm reaching up/out -->
    <path d="M105 140 C85 135 75 120 70 110" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" />
    <circle cx="68" cy="108" r="4" fill="#fcd34d" />

    <!-- Right arm braced on hip -->
    <path d="M140 145 C155 145 160 160 155 175" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" />
    <circle cx="155" cy="177" r="4" fill="#fcd34d" />

    <!-- Seated Lower Body / Legs -->
    <path d="M100 178 L140 178 L145 210 L105 210 Z" fill="#3b82f6" />
    <!-- Shoes -->
    <path d="M95 210 L115 210 C118 210 120 213 118 215 L95 215 Z" fill="#1e293b" />
    <path d="M130 210 L150 210 C152 213 150 215 147 215 L125 215 Z" fill="#1e293b" />
  </g>

  <!-- Atmospheric Details: Extra subtle background droplets & lighting -->
  <circle cx="190" cy="150" r="1.5" fill="#38bdf8" opacity="0.3" />
  <circle cx="170" cy="170" r="1" fill="#38bdf8" opacity="0.2" />
  <circle cx="205" cy="180" r="2" fill="#38bdf8" opacity="0.4" />

</svg>