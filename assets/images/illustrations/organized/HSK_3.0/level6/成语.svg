<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Golden Scroll Gradients -->
    <linearGradient id="scroll-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    
    <linearGradient id="scroll-end" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Brush Gradient -->
    <linearGradient id="brush-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Ink Splash Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Ambient Glows (Literary/Magical Atmosphere) -->
  <circle cx="120" cy="110" r="80" fill="#f59e0b" opacity="0.05" filter="url(#glow)"/>
  <circle cx="180" cy="60" r="30" fill="#38bdf8" opacity="0.07" filter="url(#glow)"/>

  <!-- Wooden Table/Desk Surface at Bottom -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.8"/>
  <path d="M 0 190 Q 120 180 240 190 L 240 194 Q 120 184 0 194 Z" fill="#334155" opacity="0.4"/>

  <!-- Main Scroll Scene (Represents Traditional Idioms/Chengyu Stories) -->
  <g filter="url(#shadow)">
    <!-- Unfurled Scroll Base Shadow -->
    <path d="M 40 85 L 200 85 L 200 165 L 40 165 Z" fill="#000000" opacity="0.3" transform="translate(0, 6)"/>

    <!-- Open Scroll Paper -->
    <path d="M 45 80 L 195 80 Q 200 80 200 85 L 200 155 Q 200 160 195 160 L 45 160 Q 40 160 40 155 L 40 85 Q 40 80 45 80 Z" fill="url(#scroll-paper)"/>

    <!-- Scroll Inner Texture Lines (Horizontal) -->
    <line x1="55" y1="95" x2="185" y2="95" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
    <line x1="55" y1="145" x2="185" y2="145" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>

    <!-- Abstract Action/Story Art on Scroll (Visualizing a dynamic Chengyu story like soaring dragon or mountain/river) -->
    <!-- Stylized Mountain & Rising Sun (classic poetic motif) -->
    <path d="M 60 140 L 85 105 L 110 140 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 95 140 L 125 95 L 160 140 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="145" cy="110" r="10" fill="#f59e0b" opacity="0.8"/>
    <!-- Flowing River / Calligraphic Brush Sweep across scroll -->
    <path d="M 55 130 Q 90 150 130 120 T 185 135" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <path d="M 65 115 Q 100 100 140 125" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Four abstract glowing node boxes representing the 4 characters of a Chengyu without using actual text -->
    <rect x="62" y="98" width="16" height="16" rx="3" fill="#f59e0b" opacity="0.2"/>
    <rect x="88" y="98" width="16" height="16" rx="3" fill="#f59e0b" opacity="0.2"/>
    <rect x="114" y="98" width="16" height="16" rx="3" fill="#f59e0b" opacity="0.2"/>
    <rect x="140" y="98" width="16" height="16" rx="3" fill="#f59e0b" opacity="0.2"/>
    
    <!-- Mini glyph placeholders inside nodes -->
    <circle cx="70" cy="106" r="3" fill="#b45309"/>
    <circle cx="96" cy="106" r="3" fill="#b45309"/>
    <circle cx="122" cy="106" r="3" fill="#b45309"/>
    <circle cx="148" cy="106" r="3" fill="#b45309"/>

    <!-- Scroll Wooden Rollers (Left & Right Ends) -->
    <!-- Left Roller -->
    <rect x="32" y="72" width="14" height="96" rx="5" fill="url(#scroll-end)"/>
    <rect x="35" y="68" width="8" height="4" rx="2" fill="#78350f"/>
    <rect x="35" y="168" width="8" height="4" rx="2" fill="#78350f"/>
    <!-- Right Roller -->
    <rect x="194" y="72" width="14" height="96" rx="5" fill="url(#scroll-end)"/>
    <rect x="197" y="68" width="8" height="4" rx="2" fill="#78350f"/>
    <rect x="197" y="168" width="8" height="4" rx="2" fill="#78350f"/>
  </g>

  <!-- Dynamic Calligraphy Brush (Leaning over the scroll, creating the action) -->
  <g transform="translate(130, 20) rotate(-25)" filter="url(#shadow)">
    <!-- Brush Handle -->
    <path d="M 45 10 L 55 10 Q 57 12 57 15 L 53 105 Q 52 110 50 110 Q 48 110 47 105 L 43 15 Q 43 12 45 10 Z" fill="url(#brush-handle)"/>
    <!-- Brass Ferrule -->
    <path d="M 43 105 L 57 105 L 56 120 L 44 120 Z" fill="#fbbf24"/>
    <!-- Brush Bristles (Dark ink tip) -->
    <path d="M 44 120 L 56 120 Q 53 145 50 150 Q 47 145 44 120 Z" fill="#1e293b"/>
    <!-- Dripping / Energetic Ink Drop -->
    <circle cx="50" cy="158" r="3.5" fill="#3b82f6" filter="url(#glow)"/>
    <path d="M 49 150 Q 50 155 50 157" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- Ambient Floating Sparkles / Cultural Magic Accents -->
  <g fill="#fbbf24">
    <!-- Star/Sparkle 1 -->
    <path d="M 45 45 Q 45 55 35 55 Q 45 55 45 65 Q 45 55 55 55 Q 45 55 45 45 Z" opacity="0.9"/>
    <!-- Star/Sparkle 2 -->
    <path d="M 185 40 Q 185 47 178 47 Q 185 47 185 54 Q 185 47 192 47 Q 185 47 185 40 Z" opacity="0.7" transform="scale(0.8) translate(50, 0)"/>
    <!-- Floating Ink / Qi Dots -->
    <circle cx="75" cy="55" r="2.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="165" cy="70" r="2" fill="#ec4899" opacity="0.7"/>
    <circle cx="100" cy="40" r="3" fill="#f59e0b" opacity="0.6"/>
  </g>

  <!-- Decorative Traditional Seal Stamp (Red square with abstract symbol inside) -->
  <g transform="translate(165, 125) rotate(8)" filter="url(#shadow)">
    <rect width="22" height="22" rx="3" fill="#dc2626"/>
    <rect x="3" y="3" width="16" height="16" fill="none" stroke="#fef2f2" stroke-width="1.5" opacity="0.8"/>
    <!-- Abstract geometric seal carving lines -->
    <path d="M 7 7 L 15 7 M 7 11 L 15 11 M 11 7 L 11 15" stroke="#fef2f2" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Foreground Atmospheric Elements (Jade Pendant / Traditional Knot hanging off the desk) -->
  <g transform="translate(45, 175)" filter="url(#shadow)">
    <path d="M 0 0 Q 10 15 5 30" fill="none" stroke="#dc2626" stroke-width="2"/>
    <!-- Jade Ring -->
    <circle cx="5" cy="38" r="8" fill="none" stroke="#10b981" stroke-width="4" opacity="0.9"/>
    <circle cx="5" cy="38" r="8" fill="#34d399" opacity="0.2"/>
  </g>

</svg>