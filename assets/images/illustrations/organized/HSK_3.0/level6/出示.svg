<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <radialGradient id="glow" cx="70%" cy="30%" r="60%" fx="70%" fy="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Passport Cover Gradient -->
    <linearGradient id="passport-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Ticket/Boarding Pass Gradient -->
    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Scanner Light Gradient -->
    <linearGradient id="scanner-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5" />
    </filter>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#glow)" />

  <!-- Counter/Desk Environment -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="#090d16" />
  <path d="M 0 176 L 240 176 L 240 180 L 0 180 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M 0 180 L 240 180 L 240 185 L 0 185 Z" fill="#0f172a" />

  <!-- Scanner Device in Background -->
  <g transform="translate(160, 110)">
    <!-- Scanner Base -->
    <rect x="-25" y="20" width="50" height="35" rx="4" fill="#334155" />
    <path d="M -20 20 L 20 20 L 15 35 L -15 35 Z" fill="#475569" />
    <!-- Scanner Lens / Light source -->
    <ellipse cx="0" cy="20" rx="15" ry="5" fill="#0f172a" />
    <ellipse cx="0" cy="20" rx="10" ry="2" fill="#10b981" filter="url(#glow-filter)" />
    <!-- Scanner Beam -->
    <polygon points="-15,20 15,20 40,-40 -40,-40" fill="url(#scanner-beam)" opacity="0.7" />
  </g>

  <!-- Decorative Background Elements -->
  <circle cx="50" cy="80" r="2" fill="#64748b" opacity="0.4" />
  <circle cx="40" cy="110" r="1.5" fill="#64748b" opacity="0.3" />
  <circle cx="190" cy="60" r="2" fill="#64748b" opacity="0.4" />
  <path d="M 180 140 L 210 140" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- MAIN ACTION: PRESENTING PASSPORT & TICKET (TRÌNH RA) -->
  <g filter="url(#drop-shadow)">
    <!-- Boarding Pass / ID Card sliding out/being presented -->
    <g transform="translate(65, 75) rotate(-12)">
      <rect x="0" y="0" width="110" height="65" rx="6" fill="url(#ticket-grad)" />
      <!-- Ticket Details -->
      <rect x="12" y="12" width="20" height="20" rx="3" fill="#cbd5e1" />
      <rect x="40" y="14" width="45" height="6" rx="2" fill="#334155" />
      <rect x="40" y="24" width="30" height="4" rx="2" fill="#94a3b8" />
      
      <!-- Barcode Accent -->
      <path d="M 12 42 L 98 42" stroke="#94a3b8" stroke-width="8" stroke-dasharray="4,2,2,2,6,2,3,3" />
      
      <!-- Highlight Accent -->
      <path d="M 0 6 L 110 6" stroke="#38bdf8" stroke-width="3" />
    </g>

    <!-- Open Passport -->
    <g transform="translate(45, 95) rotate(-5)">
      <!-- Passport Back Cover (Left Side) -->
      <path d="M 10 10 L 60 0 L 60 85 L 10 75 Z" fill="#172554" />
      
      <!-- Passport Right Side (Pages) -->
      <path d="M 60 0 L 115 12 L 115 87 L 60 75 Z" fill="#f8fafc" />
      
      <!-- Passport Spine -->
      <path d="M 60 0 L 60 75" stroke="#0f172a" stroke-width="2" />

      <!-- Gold Crest on Cover -->
      <circle cx="35" cy="35" r="10" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" />
      <path d="M 35 28 L 37 34 L 43 35 L 38 39 L 40 45 L 35 41 L 30 45 L 32 39 L 27 35 L 33 34 Z" fill="url(#gold-grad)" transform="translate(0, 3) scale(0.4)" />

      <!-- Inside Page Graphics (Stamps & Visa lines) -->
      <rect x="72" y="20" width="16" height="20" rx="2" fill="#e2e8f0" />
      <circle cx="80" cy="30" r="5" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.7" />
      <line x1="95" y1="22" x2="108" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="95" y1="30" x2="105" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="95" y1="38" x2="102" y2="38" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      
      <!-- Photo Placeholder inside passport -->
      <rect x="72" y="48" width="18" height="22" rx="1" fill="#cbd5e1" />
      <circle cx="81" cy="55" r="4" fill="#64748b" />
      <path d="M 75 67 C 75 63 77 62 81 62 C 85 62 87 63 87 67 Z" fill="#64748b" />
    </g>
  </g>

  <!-- Hand Presenting (Foreground element reaching forward) -->
  <g transform="translate(10, 30)">
    <!-- Sleeve Cuff -->
    <path d="M 10 160 L 45 140 L 55 155 L 20 175 Z" fill="#3b82f6" />
    <path d="M 18 171 L 48 152" stroke="#1d4ed8" stroke-width="3" />

    <!-- Forearm & Hand -->
    <path d="M 40 148 L 95 118 C 105 113 118 120 115 130 L 95 155 C 80 165 55 162 40 148 Z" fill="#fde047" /> <!-- Skin tone base/shadow mapped to stylized warm yellow/peach -->
    <path d="M 42 146 L 97 116 C 103 113 110 116 112 122 C 114 128 108 135 108 135 L 50 162 Z" fill="#fcd34d" />
    
    <!-- Stylized fingers gripping the passport -->
    <path d="M 85 110 C 90 105 100 105 105 110 L 115 125 C 117 128 112 132 108 128 L 95 115 Z" fill="#fbbf24" />
    <path d="M 100 118 C 105 114 112 116 115 120 L 122 132 C 124 135 120 138 116 135 L 106 124 Z" fill="#f59e0b" />
    
    <!-- Thumb resting on top -->
    <path d="M 75 125 C 80 120 92 122 95 128 C 98 134 88 142 82 138 C 77 134 72 130 75 125 Z" fill="#fbbf24" />
  </g>

  <!-- Action Motion Lines / Sparkles (Highlighting the 'Presenting/Showing' action) -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="160" y1="65" x2="180" y2="55" />
    <line x1="170" y1="85" x2="195" y2="78" />
    <line x1="150" y1="45" x2="162" y2="38" />
  </g>

  <!-- Glowing Focus Sparkle -->
  <path d="M 185 68 L 188 75 L 195 78 L 188 81 L 185 88 L 182 81 L 175 78 L 182 75 Z" fill="#38bdf8" filter="url(#glow-filter)" />
  <path d="M 125 55 L 127 60 L 132 62 L 127 64 L 125 69 L 123 64 L 118 62 L 123 60 Z" fill="#fde047" opacity="0.8" />
</svg>