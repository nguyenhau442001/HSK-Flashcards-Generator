<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Thought Cloud Gradient -->
    <linearGradient id="thoughtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient (representing inner thoughts/ideas) -->
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Accent Turquoise Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Ambient Glows & Environment -->
  <circle cx="120" cy="90" r="70" fill="#38bdf8" opacity="0.05" filter="blur(20px)"/>
  <circle cx="160" cy="140" r="50" fill="#f59e0b" opacity="0.07" filter="blur(15px)"/>

  <!-- Desk Surface -->
  <path d="M 20 200 L 220 200 C 220 200, 220 216, 200 220 L 40 220 C 20 216, 20 200, 20 200 Z" fill="#334155" opacity="0.8"/>
  <rect x="30" y="200" width="180" height="4" rx="2" fill="#475569"/>

  <!-- Context Props: Coffee Mug -->
  <g transform="translate(170, 165)">
    <rect x="0" y="0" width="22" height="26" rx="4" fill="#cbd5e1" filter="url(#dropShadow)"/>
    <path d="M 22 6 C 28 6, 28 20, 22 20" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 6 4 Q 11 0 16 4" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Context Props: Open Journal/Notebook -->
  <g transform="translate(60, 170)" filter="url(#dropShadow)">
    <!-- Notebook Cover -->
    <path d="M -10 10 L 60 -2 L 130 10 L 130 32 L 60 20 L -10 32 Z" fill="#0284c7"/>
    <!-- Notebook Pages -->
    <path d="M -6 6 L 60 -5 L 126 6 L 126 26 L 60 15 L -6 26 Z" fill="#f8fafc"/>
    <line x1="60" y1="-5" x2="60" y2="15" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Lines representing text/thoughts -->
    <line x1="10" y1="5" x2="45" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="12" x2="40" y2="7" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="75" y1="3" x2="110" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="75" y1="10" x2="105" y2="15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Main Subject: Character Silhouette / Bust (Thoughtful Person) -->
  <g transform="translate(120, 185)">
    <!-- Shoulders & Torso -->
    <path d="M -50 35 C -50 10, -25 5, 0 5 C 25 5, 50 10, 50 35 Z" fill="#38bdf8" filter="url(#dropShadow)"/>
    <!-- Neck -->
    <rect x="-10" y="-8" width="20" height="18" fill="#f1f5f9"/>
    <!-- Head -->
    <circle cx="0" cy="-28" r="22" fill="#f1f5f9" filter="url(#dropShadow)"/>
    <!-- Hair -->
    <path d="M -22 -32 C -24 -46, 0 -50, 22 -32 C 20 -42, 5 -46, -5 -45 Z" fill="#0f172a"/>
    <!-- Closed Thoughtful Eye / Smile contour -->
    <path d="M -4 -25 C -2 -23, 2 -23, 4 -25" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -3 -18 Q 0 -15 3 -18" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating Thought Bubbles (Representing '感想' - impressions/thoughts bubbling up) -->
  <g filter="url(#dropShadow)">
    <!-- Small bubble -->
    <circle cx="100" cy="115" r="5" fill="url(#thoughtGrad)" opacity="0.8"/>
    <!-- Medium bubble -->
    <circle cx="92" cy="100" r="9" fill="url(#thoughtGrad)" opacity="0.9"/>
    
    <!-- Large Main Thought Cloud -->
    <path d="M 120 40 
             C 145 40, 165 55, 160 75 
             C 175 80, 180 100, 165 112 
             C 160 125, 140 130, 125 125 
             C 110 130, 90 120, 95 105 
             C 80 95, 85 75, 100 68 
             C 98 50, 110 40, 120 40 Z" 
          fill="url(#thoughtGrad)"/>
  </g>

  <!-- Action-Packed Dynamic Inner Icons inside the Thought Bubble (Expressing Ideas, Emotions, Reflections) -->
  <g transform="translate(120, 85)">
    <!-- Glowing Idea Bulb Centerpiece -->
    <path d="M 0 -18 C -10 -18, -16 -10, -16 -2 C -16 6, -8 10, -6 16 L 6 16 C 8 10, 16 6, 16 -2 C 16 -10, 10 -18, 0 -18 Z" fill="url(#warmGlow)"/>
    <rect x="-4" y="16" width="8" height="4" rx="1" fill="#94a3b8"/>
    <rect x="-3" y="21" width="6" height="3" rx="1" fill="#64748b"/>

    <!-- Radiant Sparkles / Action lines around thought -->
    <path d="M -24 -22 L -20 -18" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 24 -22 L 20 -18" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 -30 L 0 -24" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -28 2 L -22 2" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 22 2 L 28 2" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Floating mini emotion symbols inside thought space -->
    <circle cx="-16" cy="-8" r="3" fill="#ec4899" opacity="0.8"/>
    <circle cx="18" cy="-10" r="2.5" fill="#10b981" opacity="0.8"/>
    <path d="M -12 12 Q -8 16 -4 12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Ambient Sparkles & Energy Dots in the Upper Air -->
  <circle cx="60" cy="50" r="2.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="180" cy="65" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="150" cy="30" r="1.5" fill="#ec4899" opacity="0.6"/>
  <circle cx="85" cy="25" r="2" fill="#10b981" opacity="0.7"/>

  <!-- Additional Action/Impression Wave Marks -->
  <path d="M 45 110 C 40 100, 40 90, 45 80" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 195 90 C 200 100, 200 110, 195 120" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>