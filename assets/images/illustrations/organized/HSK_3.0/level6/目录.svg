<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="book-cover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="20%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Table of Contents Page Gradient -->
    <linearGradient id="page-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Spotlight/Glow -->
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Glow -->
  <circle cx="120" cy="110" r="100" fill="url(#glow)"/>

  <!-- Atmospheric Background Elements (Desk/Environment) -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#090d16" opacity="0.6"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Background Props: Coffee Mug -->
  <g transform="translate(185, 135)" filter="url(#subtle-shadow)">
    <!-- Mug Body -->
    <path d="M6 10 C6 24 18 28 22 28 C26 28 38 24 38 10 Z" fill="#f1f5f9"/>
    <path d="M6 10 C6 6 14 4 22 4 C30 4 38 6 38 10 C38 14 30 16 22 16 C14 16 6 14 6 10 Z" fill="#cbd5e1"/>
    <!-- Mug Handle -->
    <path d="M36 12 C44 12 44 22 36 24" fill="none" stroke="#f1f5f9" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M16 0 C14 -4 18 -6 16 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M26 -2 C28 -6 24 -8 26 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Background Props: Reading Glasses -->
  <g transform="translate(35, 145) rotate(-12)" filter="url(#subtle-shadow)">
    <circle cx="15" cy="12" r="12" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="45" cy="12" r="12" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <line x1="27" y1="12" x2="33" y2="12" stroke="#fbbf24" stroke-width="2.5"/>
    <path d="M 3 12 C -4 12 -8 5 -12 0" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 57 12 C 64 12 68 5 72 0" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: Open Book / Table of Contents -->
  <g filter="url(#shadow)">
    <!-- Book Shadow Base -->
    <path d="M35 85 L205 85 L215 190 L25 190 Z" fill="#020617" opacity="0.5"/>

    <!-- Book Cover Background (slightly larger to show border) -->
    <path d="M30 75 Q120 65 210 75 L215 185 Q120 195 25 185 Z" fill="url(#book-cover)" stroke="#0369a1" stroke-width="2"/>

    <!-- Left Page (Decorative Chapter Art Side) -->
    <path d="M33 78 Q118 70 118 182 L28 182 Q28 120 33 78 Z" fill="url(#page-grad)"/>

    <!-- Right Page (Table of Contents / Index Page) -->
    <path d="M122 70 Q207 78 212 182 L122 182 Z" fill="url(#page-grad)"/>

    <!-- Book Center Binding / Spine shadow -->
    <path d="M118 70 C118 120 122 150 122 182 C120 150 116 120 118 70 Z" fill="#cbd5e1"/>

    <!-- LEFT PAGE CONTENT: Illustration & Chapter Header -->
    <g transform="translate(45, 90)">
      <!-- Mini Map / Chapter Graphic -->
      <rect x="10" y="10" width="54" height="40" rx="6" fill="#e0f2fe"/>
      <path d="M15 40 Q25 25 35 32 T55 20 L55 45 L15 45 Z" fill="#38bdf8" opacity="0.4"/>
      <circle cx="45" cy="27" r="4" fill="#f43f5e"/>
      <path d="M22 35 L28 28 L34 32 L44 22" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Decorative Lines representing paragraphs -->
      <rect x="10" y="60" width="40" height="4" rx="2" fill="#94a3b8"/>
      <rect x="10" y="70" width="50" height="3" rx="1.5" fill="#cbd5e1"/>
      <rect x="10" y="78" width="30" height="3" rx="1.5" fill="#cbd5e1"/>
    </g>

    <!-- RIGHT PAGE CONTENT: Table of Contents (Mùlù) -->
    <g transform="translate(132, 85)">
      <!-- TOC Header Badge -->
      <rect x="0" y="0" width="35" height="8" rx="4" fill="#0284c7"/>
      
      <!-- TOC Item 1 (Active/Highlighted) -->
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="72" height="16" rx="4" fill="#bae6fd" opacity="0.6"/>
        <circle cx="5" cy="8" r="3" fill="#0284c7"/>
        <!-- Text lines simulation -->
        <rect x="12" y="6" width="35" height="4" rx="2" fill="#0369a1"/>
        <circle cx="62" cy="8" r="3" fill="#f59e0b"/>
      </g>

      <!-- TOC Item 2 -->
      <g transform="translate(0, 36)">
        <circle cx="5" cy="8" r="2.5" fill="#94a3b8"/>
        <rect x="12" y="6" width="45" height="3" rx="1.5" fill="#64748b"/>
        <circle cx="62" cy="8" r="2.5" fill="#cbd5e1"/>
      </g>

      <!-- TOC Item 3 -->
      <g transform="translate(0, 52)">
        <circle cx="5" cy="8" r="2.5" fill="#94a3b8"/>
        <rect x="12" y="6" width="30" height="3" rx="1.5" fill="#64748b"/>
        <circle cx="62" cy="8" r="2.5" fill="#cbd5e1"/>
      </g>

      <!-- TOC Item 4 -->
      <g transform="translate(0, 68)">
        <circle cx="5" cy="8" r="2.5" fill="#94a3b8"/>
        <rect x="12" y="6" width="40" height="3" rx="1.5" fill="#64748b"/>
        <circle cx="62" cy="8" r="2.5" fill="#cbd5e1"/>
      </g>

      <!-- TOC Item 5 -->
      <g transform="translate(0, 84)">
        <circle cx="5" cy="8" r="2.5" fill="#94a3b8"/>
        <rect x="12" y="6" width="25" height="3" rx="1.5" fill="#64748b"/>
        <circle cx="62" cy="8" r="2.5" fill="#cbd5e1"/>
      </g>
    </g>

    <!-- Interactive / Action Element: Glowing Magnifying Glass hovering over the Table of Contents -->
    <g transform="translate(135, 125)" filter="url(#shadow)">
      <!-- Glass Handle -->
      <path d="M22 22 L45 45" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
      <path d="M22 22 L45 45" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Lens Rim -->
      <circle cx="12" cy="12" r="20" fill="#0284c7" opacity="0.2"/>
      <circle cx="12" cy="12" r="20" fill="none" stroke="#fbbf24" stroke-width="4.5"/>
      <circle cx="12" cy="12" r="17" fill="url(#glow)" opacity="0.8"/>
      
      <!-- Lens Glass Reflection -->
      <path d="M 2 -2 Q 12 -8 22 -2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- Floating UI / Decorative Accents (Gamification HSK vibe) -->
  <!-- Star 1 -->
  <g transform="translate(25, 45)" filter="url(#subtle-shadow)">
    <path d="M12 0 L15 8 L24 9 L17 15 L19 23 L12 19 L5 23 L7 15 L0 9 L9 8 Z" fill="#fbbf24" transform="scale(0.6)"/>
  </g>
  <!-- Star 2 -->
  <g transform="translate(205, 55)" filter="url(#subtle-shadow)">
    <path d="M12 0 L15 8 L24 9 L17 15 L19 23 L12 19 L5 23 L7 15 L0 9 L9 8 Z" fill="#38bdf8" transform="scale(0.5)"/>
  </g>
  <!-- Floating bookmark tag -->
  <g transform="translate(195, 100) rotate(15)" filter="url(#subtle-shadow)">
    <path d="M0 0 L16 0 L16 24 L8 18 L0 24 Z" fill="#f43f5e"/>
    <path d="M4 6 L12 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M4 11 L10 11" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>