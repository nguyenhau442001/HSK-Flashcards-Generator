<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Receipt Paper Gradient -->
    <linearGradient id="receiptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Counter Top Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lightGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Receipt Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Light -->
  <circle cx="120" cy="120" r="110" fill="url(#lightGlow)"/>

  <!-- SCENE CONTEXT: Coffee Shop / Retail Counter Background Elements -->
  <!-- Ambient Shelves / Wall -->
  <path d="M40 70 L200 70" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Coffee Cup Prop (Left) -->
  <g transform="translate(45, 95)">
    <path d="M 6 0 L 18 0 L 21 28 C 21 33 17 37 12 37 C 7 37 3 33 3 28 Z" fill="#64748b"/>
    <path d="M 19 8 C 25 8 27 15 23 20" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="12" cy="0" rx="6" ry="2" fill="#94a3b8"/>
    <!-- Steam -->
    <path d="M 9 -5 C 9 -10 15 -10 15 -15" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 15 -4 C 15 -8 11 -8 11 -12" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Stylized Plant Prop (Right) -->
  <g transform="translate(180, 85)">
    <path d="M 10 35 L 20 35 L 17 48 L 13 48 Z" fill="#475569"/>
    <path d="M 15 35 C 15 20 25 15 28 10 C 28 20 20 30 15 35 Z" fill="#10b981"/>
    <path d="M 15 35 C 10 15 0 10 -5 5 C 0 18 10 28 15 35 Z" fill="#059669"/>
  </g>

  <!-- Counter Surface (Foreground) -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="url(#counterGrad)"/>
  <!-- Counter Edge Highlight -->
  <path d="M 0 180 L 240 180" stroke="#475569" stroke-width="2"/>

  <!-- MAIN SUBJECT: 发票 (Receipt / Invoice) -->
  <g transform="translate(75, 45)" filter="url(#dropShadow)">
    
    <!-- Receipt Base Paper with jagged bottom -->
    <path d="M 0 0 
             L 90 0 
             L 90 135 
             L 85 140 L 80 135 L 75 140 L 70 135 L 65 140 L 60 135 L 55 140 L 50 135 L 45 140 L 40 135 L 35 140 L 30 135 L 25 140 L 20 135 L 15 140 L 10 135 L 5 140 L 0 135 
             Z" 
          fill="url(#receiptGrad)"/>

    <!-- Receipt Header Section -->
    <circle cx="45" cy="22" r="8" fill="#38bdf8" opacity="0.2"/>
    <path d="M 42 22 L 44 24 L 49 19" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Decorative Header Lines (Simulating text/branding) -->
    <rect x="25" y="38" width="40" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="33" y="46" width="24" height="3" rx="1.5" fill="#e2e8f0"/>

    <!-- Line Items (Simulating purchased goods on invoice) -->
    <g transform="translate(15, 62)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="30" height="3" rx="1.5" fill="#94a3b8"/>
      <rect x="45" y="0" width="15" height="3" rx="1.5" fill="#cbd5e1"/>
      
      <!-- Item 2 -->
      <rect x="0" y="12" width="40" height="3" rx="1.5" fill="#94a3b8"/>
      <rect x="45" y="12" width="15" height="3" rx="1.5" fill="#cbd5e1"/>

      <!-- Item 3 -->
      <rect x="0" y="24" width="25" height="3" rx="1.5" fill="#94a3b8"/>
      <rect x="45" y="24" width="15" height="3" rx="1.5" fill="#cbd5e1"/>
    </g>

    <!-- Divider Dotted/Dashe Line -->
    <path d="M 12 105 L 78 105" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Total Amount Section -->
    <rect x="15" y="115" width="20" height="4" rx="2" fill="#64748b"/>
    <rect x="42" y="113" width="33" height="8" rx="2" fill="#10b981" opacity="0.2"/>
    <circle cx="48" cy="117" r="2.5" fill="#059669"/>
    <rect x="54" y="115" width="16" height="4" rx="2" fill="#059669"/>
  </g>

  <!-- ACTION-PACKED ACCENTS: Floating gold coins / digital sparkles -->
  <!-- Coin 1 (Left) -->
  <g transform="translate(50, 140)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="12" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="8" fill="#f59e0b"/>
    <path d="M -3 -3 L 3 3 M -3 3 L 3 -3" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coin 2 (Right, higher) -->
  <g transform="translate(185, 110)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="15" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="11" fill="#fbbf24"/>
    <text x="0" y="4" font-family="sans-serif" font-weight="bold" font-size="12" fill="#d97706" text-anchor="middle">$</text>
  </g>

  <!-- Sparkles / Success Indicators -->
  <g transform="translate(160, 50)" fill="#38bdf8">
    <path d="M 0 0 L 2 5 L 7 7 L 2 9 L 0 14 L -2 9 L -7 7 L -2 5 Z"/>
  </g>
  <g transform="translate(70, 30)" fill="#fbbf24" opacity="0.8">
    <path d="M 0 0 L 1.5 3.5 L 5 5 L 1.5 6.5 L 0 10 L -1.5 6.5 L -5 5 L -1.5 3.5 Z"/>
  </g>

</svg>