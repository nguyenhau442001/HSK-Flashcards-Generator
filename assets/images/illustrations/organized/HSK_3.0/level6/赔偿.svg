<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light Gradient for Compensation/Appreciation -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    
    <linearGradient id="coinEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Glow behind the scene -->
  <circle cx="120" cy="110" r="90" fill="url(#goldGlow)" />

  <!-- SCENE CONTEXT: Wooden Desk/Counter Surface -->
  <path d="M 20 180 L 220 180 L 230 220 L 10 220 Z" fill="#0f172a" opacity="0.6" />
  <rect x="25" y="175" width="190" height="8" rx="4" fill="#334155" filter="url(#softShadow)" />
  <path d="M 35 183 L 205 183 L 210 215 L 30 215 Z" fill="#1e293b" />

  <!-- ACCIDENT CONTEXT: Slightly damaged ceramic vase (Reason for compensation) -->
  <g transform="translate(45, 110)" filter="url(#softShadow)">
    <!-- Base Vase -->
    <path d="M 15 25 Q 0 45 10 60 Q 20 65 30 65 Q 40 65 50 60 Q 60 45 45 25 Z" fill="#38bdf8" />
    <ellipse cx="30" cy="25" rx="15" ry="4" fill="#0284c7" />
    <!-- Crack on Vase -->
    <path d="M 30 35 L 25 45 L 35 52 L 28 60" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Falling shard -->
    <path d="M 48 48 L 55 52 L 50 56 Z" fill="#38bdf8" />
  </g>

  <!-- MAIN OBJECT OF COMPENSATION: Leather Briefcase / Document folder with Gold Coins & Cash -->
  <g filter="url(#softShadow)">
    <!-- Briefcase Body (Back/Open) -->
    <rect x="75" y="100" width="90" height="60" rx="8" fill="#78350f" />
    <rect x="79" y="104" width="82" height="52" rx="6" fill="#92400e" />
    
    <!-- Briefcase Interior Contents (Documents & Money) -->
    <!-- Papers inside -->
    <path d="M 90 104 L 115 80 L 145 80 L 150 104 Z" fill="#f8fafc" />
    <path d="M 100 95 L 135 95" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <path d="M 105 100 L 130 100" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

    <!-- Stack of Cash/Banknotes -->
    <g transform="translate(85, 95)">
      <rect x="0" y="10" width="40" height="25" rx="2" fill="#10b981" />
      <rect x="5" y="15" width="30" height="15" rx="1" fill="#059669" />
      <circle cx="20" cy="22" r="4" fill="#d1fae5" />
    </g>

    <!-- Gold Coins spilling out (Compensation payment) -->
    <!-- Coin 1 -->
    <g transform="translate(135, 115)">
      <circle cx="10" cy="10" r="12" fill="url(#coinEdge)" />
      <circle cx="10" cy="10" r="9" fill="url(#coinGrad)" />
      <circle cx="10" cy="10" r="6" fill="none" stroke="#fef08a" stroke-width="1.5" />
    </g>
    <!-- Coin 2 -->
    <g transform="translate(155, 125)">
      <circle cx="10" cy="10" r="10" fill="url(#coinEdge)" />
      <circle cx="10" cy="10" r="7.5" fill="url(#coinGrad)" />
    </g>
    <!-- Coin 3 (Floating slightly for action feel) -->
    <g transform="translate(125, 90)">
      <circle cx="8" cy="8" r="8" fill="url(#coinEdge)" />
      <circle cx="8" cy="8" r="6" fill="url(#coinGrad)" />
    </g>

    <!-- Briefcase Lid (Opened downwards/forward) -->
    <path d="M 75 160 Q 120 175 165 160 L 165 165 Q 120 180 75 165 Z" fill="#451a03" />
    <!-- Briefcase Handle -->
    <path d="M 105 100 Q 120 90 135 100" stroke="#b45309" stroke-width="4" stroke-linecap="round" fill="none" />
    <rect x="113" y="96" width="14" height="6" rx="2" fill="#fbbf24" />
  </g>

  <!-- ACTION/MOTION ELEMENTS: Sparkles & Impact highlights -->
  <g fill="#fbbf24">
    <!-- Sparkle top right -->
    <path d="M 180 60 Q 180 70 190 70 Q 180 70 180 80 Q 180 70 170 70 Q 180 70 180 60 Z" />
    <!-- Sparkle middle left -->
    <path d="M 55 90 Q 55 95 60 95 Q 55 95 55 100 Q 55 95 50 95 Q 55 95 55 90 Z" />
    <!-- Small accent dot -->
    <circle cx="140" cy="70" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="70" cy="140" r="2" fill="#10b981" opacity="0.8" />
  </g>

  <!-- Hand/Responsibility Element (Abstracted friendly gesture offering compensation) -->
  <g transform="translate(130, 110)">
    <!-- Suit Cuff -->
    <path d="M 30 65 L 50 65 L 45 45 L 25 45 Z" fill="#3b82f6" />
    <!-- Shirt Cuff -->
    <path d="M 35 65 L 45 65 L 43 62 L 37 62 Z" fill="#f8fafc" />
    <!-- Hand Palm & Thumb -->
    <path d="M 25 45 Q 15 35 5 40 Q -2 43 0 50 Q 3 55 15 50 Z" fill="#fcd34d" />
  </g>

</svg>