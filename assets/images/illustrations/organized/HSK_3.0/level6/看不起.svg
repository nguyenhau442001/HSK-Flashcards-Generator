<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Rich Gold/Amber Accent -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Character 1 (Arrogant) Gradient -->
    <linearGradient id="suitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Atmospheric Background Elements: Office/Street Context -->
  <g opacity="0.2">
    <!-- Window Frame / City Skyline Silhouette -->
    <rect x="170" y="40" width="40" height="80" rx="4" fill="#64748b" />
    <path d="M 180 50 L 200 50 L 200 110 L 180 110 Z" fill="#0f172a" />
    <rect x="30" y="60" width="30" height="60" rx="4" fill="#64748b" />
    <path d="M 38 70 L 52 70 L 52 110 L 38 110 Z" fill="#0f172a" />
  </g>

  <!-- Flooring / Ground Plane -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" opacity="0.6" />

  <!-- Environmental Props: Plant in the background -->
  <g transform="translate(20, 115)">
    <path d="M 10 55 C 10 40 25 35 25 25 C 25 35 40 40 40 55 Z" fill="#334155" />
    <path d="M 25 25 Q 10 10 0 20 Q -5 30 10 35 Z" fill="#10b981" opacity="0.8" />
    <path d="M 25 20 Q 35 0 50 10 Q 55 20 40 28 Z" fill="#059669" opacity="0.8" />
    <path d="M 25 30 Q 30 5 22 -5 Q 15 5 25 15 Z" fill="#34d399" opacity="0.8" />
  </g>

  <!-- SCENE SUBJECT: Character 2 (The Vulnerable/Looked-down-upon person) -->
  <g id="character-poor" transform="translate(60, 130)" filter="url(#shadow)">
    <!-- Shadow beneath -->
    <ellipse cx="20" cy="42" rx="18" ry="6" fill="#000000" opacity="0.5" />
    
    <!-- Body/Posture: Crouched, holding simple box or broom -->
    <path d="M 10 15 Q 15 5 25 10 L 35 35 L 5 35 Z" fill="#f97316" /> <!-- Simple orange worker vest/shirt -->
    <path d="M 8 35 L 32 35 L 28 42 L 12 42 Z" fill="#334155" /> <!-- Trousers -->
    
    <!-- Head lowered -->
    <circle cx="20" cy="8" r="9" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 11 6 C 11 2 15 1 20 1 C 25 1 29 2 29 6 Z" fill="#334155" />
    
    <!-- Sad/Submissive Expression (implied by posture and lowered head) -->
    <path d="M 17 9 Q 20 11 23 9" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Simple Prop: Dropped papers or cleaning tool -->
    <rect x="-10" y="30" width="16" height="12" rx="1" fill="#f8fafc" transform="rotate(-15)" />
    <rect x="-6" y="34" width="12" height="8" rx="1" fill="#cbd5e1" transform="rotate(-15)" />
  </g>

  <!-- SCENE SUBJECT: Character 1 (The Arrogant/Dismissive person - "Coi thường") -->
  <g id="character-arrogant" transform="translate(130, 95)" filter="url(#shadow)">
    <!-- Shadow beneath standing figure -->
    <ellipse cx="30" cy="77" rx="22" ry="7" fill="#000000" opacity="0.5" />

    <!-- Legs in confident pose -->
    <path d="M 20 45 L 22 75 L 28 75 L 26 45 Z" fill="#1e293b" />
    <path d="M 35 45 L 42 75 L 48 75 L 38 45 Z" fill="#1e293b" />
    <!-- Shoes -->
    <path d="M 18 75 L 28 75 L 28 78 L 16 78 Z" fill="#0f172a" />
    <path d="M 38 75 L 50 75 L 52 78 L 36 78 Z" fill="#0f172a" />

    <!-- Torso in Sharp Suit -->
    <path d="M 18 20 C 18 15 42 15 42 20 L 45 48 C 45 48 30 52 15 48 Z" fill="url(#suitGrad)" />
    <!-- White shirt collar & red tie -->
    <path d="M 26 20 L 34 20 L 32 32 L 30 32 Z" fill="#f8fafc" />
    <path d="M 29 24 L 31 24 L 32 30 L 30 30 Z" fill="#ef4444" />

    <!-- Head tilted back in arrogance -->
    <circle cx="30" cy="8" r="11" fill="#fcd34d" />
    <!-- Sleek Hair -->
    <path d="M 19 6 C 19 0 25 -1 33 2 C 40 4 41 8 41 8 C 41 8 36 3 30 3 C 24 3 20 5 19 6 Z" fill="#1e293b" />

    <!-- Arrogant Facial Features: Smirk and raised chin -->
    <path d="M 33 9 Q 36 11 39 8" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round" /> <!-- Smirk -->
    <path d="M 33 5 L 38 6" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" /> <!-- Raised Eyebrow -->

    <!-- ARROGANT GESTURE: Looking down nose, arms crossed or hand waving dismissively -->
    <!-- Arms crossed over chest -->
    <path d="M 17 25 Q 30 35 43 28 L 41 35 Q 30 40 21 32 Z" fill="#475569" />
    <path d="M 19 29 Q 30 39 41 32 L 39 39 Q 30 44 23 36 Z" fill="#334155" />

    <!-- Nose up accent lines (visualizing looking down on someone) -->
    <path d="M 43 5 L 49 2" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 44 9 L 52 8" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- FOREGROUND / INTERACTION ELEMENTS -->
  <!-- Subtle downward gaze vector / dynamic visual hierarchy lines -->
  <path d="M 145 105 Q 120 120 90 135" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.8" />

  <!-- Accent lighting & polished app finish -->
  <circle cx="195" cy="55" r="3" fill="#fbbf24" opacity="0.6" />
  <circle cx="205" cy="65" r="2" fill="#fbbf24" opacity="0.4" />
  
  <!-- Interactive Framing Vignette (Inner Border Glow) -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />
</svg>