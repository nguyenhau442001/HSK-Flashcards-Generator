<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Window Frame -->
  <path d="M40 40h160v160H40z" fill="#334155" stroke="#475569" stroke-width="4"/>
  <path d="M120 40v160M40 120h160" stroke="#475569" stroke-width="4"/>
  
  <!-- Character: Pointing and Looking -->
  <g transform="translate(60, 80)">
    <!-- Arm pointing -->
    <path d="M40 60c20-10 40-10 60 0" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="105" cy="60" r="6" fill="#fbbf24"/>
    
    <!-- Body -->
    <path d="M20 120c0-30 20-50 50-50s50 20 50 50v40H20z" fill="#38bdf8"/>
    
    <!-- Head -->
    <circle cx="70" cy="50" r="25" fill="#fde68a"/>
    
    <!-- Eyes looking -->
    <circle cx="60" cy="45" r="4" fill="#0f172a"/>
    <circle cx="80" cy="45" r="4" fill="#0f172a"/>
    
    <!-- Mouth -->
    <path d="M65 60c5 5 15 5 20 0" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Object of interest: A glowing butterfly -->
  <g transform="translate(160, 70)">
    <path d="M-10-10c10-20 30-20 40 0-10 20-30 20-40 0" fill="#10b981"/>
    <path d="M-10 10c10 20 30 20 40 0-10-20-30-20-40 0" fill="#10b981"/>
    <circle cx="15" cy="0" r="3" fill="#fb923c"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="180" r="15" fill="#ec4899" opacity="0.3"/>
  <circle cx="210" cy="30" r="10" fill="#fbbf24" opacity="0.4"/>
</svg>