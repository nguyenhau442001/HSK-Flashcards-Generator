<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light / Motion Gradient -->
    <linearGradient id="motion-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.8" />
    </linearGradient>

    <!-- Doorway Shadow Gradient -->
    <linearGradient id="door-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="pants-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Floor Reflection -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior - Walls & Perspective -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" />
  
  <!-- Wallpaper subtle stripe details -->
  <line x1="60" y1="20" x2="60" y2="170" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
  <line x1="120" y1="20" x2="120" y2="170" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
  <line x1="180" y1="20" x2="180" y2="170" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />

  <!-- Room Floor -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#floor-grad)" />
  <!-- Floor Wooden Planks perspective -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#090d16" stroke-width="2" />
  <line x1="0" y1="215" x2="240" y2="215" stroke="#090d16" stroke-width="2" />

  <!-- Background Props: Room Elements -->
  <!-- Bookshelf on the left wall -->
  <rect x="25" y="45" width="35" height="90" fill="#0f172a" rx="2" />
  <rect x="30" y="70" width="25" height="4" fill="#334155" />
  <rect x="30" y="95" width="25" height="4" fill="#334155" />
  <rect x="30" y="120" width="25" height="4" fill="#334155" />
  <!-- Colored Books -->
  <rect x="32" y="52" width="6" height="18" fill="#ef4444" rx="1" />
  <rect x="40" y="50" width="8" height="20" fill="#10b981" rx="1" />
  <rect x="33" y="77" width="12" height="18" fill="#f59e0b" rx="1" />

  <!-- Framed Picture on Wall -->
  <rect x="85" y="40" width="30" height="24" fill="#334155" rx="2" />
  <rect x="88" y="43" width="24" height="18" fill="#475569" rx="1" />
  <circle cx="100" cy="52" r="5" fill="#38bdf8" opacity="0.6" />

  <!-- Doorway frame opening to the right -->
  <path d="M 160 30 L 220 30 L 220 190 L 160 190 Z" fill="url(#door-grad)" />
  <!-- Door frame trim -->
  <rect x="156" y="26" width="8" height="168" fill="#334155" rx="1" />
  <rect x="216" y="26" width="8" height="168" fill="#334155" rx="1" />
  <rect x="156" y="22" width="68" height="6" fill="#475569" rx="1" />

  <!-- Action: Motion lines / Speed Streaks rushing into the room -->
  <path d="M 140 110 L 210 110" stroke="url(#motion-grad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 120 135 L 190 135" stroke="url(#motion-grad)" stroke-width="5" stroke-linecap="round" />
  <path d="M 150 85 L 200 85" stroke="url(#motion-grad)" stroke-width="4" stroke-linecap="round" />
  <!-- Dynamic Wind Swoosh -->
  <path d="M 130 120 C 160 110, 180 125, 215 115" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" opacity="0.7" />

  <!-- Foreground Subject: Energetic Character "Xông tới" (Rushing forward) -->
  <g filter="url(#soft-shadow)">
    <!-- Character Head & Hair -->
    <circle cx="110" cy="85" r="14" fill="#fbcfe8" />
    <!-- Hair Spilling Backwards due to speed -->
    <path d="M 100 75 C 95 70, 90 80, 85 85 C 92 82, 98 88, 102 90 Z" fill="#334155" />
    
    <!-- Torso leaning dramatically forward -->
    <path d="M 95 100 L 125 105 L 115 135 L 90 125 Z" fill="url(#shirt-grad)" rx="4" />

    <!-- Back Arm swinging back -->
    <path d="M 105 105 L 85 120 L 75 115" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Front Arm reaching aggressively forward -->
    <path d="M 115 105 L 145 115 L 165 112" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand -->
    <circle cx="168" cy="111" r="4" fill="#fbcfe8" />

    <!-- Rushing Legs in wide stride -->
    <!-- Back Leg kicking back -->
    <path d="M 95 130 L 75 145 L 60 135" fill="none" stroke="url(#pants-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Front Leg lunging forward -->
    <path d="M 105 130 L 135 155 L 155 155" fill="none" stroke="url(#pants-grad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shoe -->
    <path d="M 148 152 L 164 154 L 166 160 L 148 160 Z" fill="#f43f5e" rx="2" />
  </g>

  <!-- Foreground Prop: Small table or object being passed quickly -->
  <g>
    <!-- Modern Side Table -->
    <rect x="40" y="145" width="30" height="35" fill="#475569" rx="2" />
    <path d="M 45 180 L 40 205" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <path d="M 65 180 L 70 205" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <!-- Lamp on table, wobbling from the rush -->
    <path d="M 50 145 L 52 125 L 58 125 L 60 145 Z" fill="#e2e8f0" />
    <path d="M 43 125 C 43 115, 67 115, 67 125 Z" fill="#fb923c" />
    <!-- Wobble / Sound lines near lamp -->
    <path d="M 67 130 C 72 132, 72 138, 67 140" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Atmospheric Lighting & Dust particles -->
  <circle cx="130" cy="90" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="150" cy="130" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="115" cy="140" r="2.5" fill="#f59e0b" opacity="0.5" />
  <circle cx="170" cy="95" r="1.5" fill="#ffffff" opacity="0.9" />

  <!-- Crisp vector frame border overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>