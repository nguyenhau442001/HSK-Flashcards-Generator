<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- The Naughty Child (Action: Tipping over a vase) -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 120 C40 100, 60 90, 80 90 C100 90, 120 100, 120 120 L110 150 L50 150 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="80" cy="80" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M60 70 Q70 50, 80 50 Q90 50, 100 70" fill="#78350f"/>
    <!-- Arms -->
    <path d="M50 100 L30 130" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <path d="M110 100 L130 130" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="60" y="150" width="15" height="30" fill="#38bdf8" rx="5"/>
    <rect x="85" y="150" width="15" height="30" fill="#38bdf8" rx="5"/>
  </g>

  <!-- The Tipped Vase -->
  <g transform="translate(160, 140)">
    <path d="M-10 0 L10 0 L20 40 L-20 40 Z" fill="#ec4899"/>
    <ellipse cx="0" cy="0" rx="10" ry="4" fill="#be185d"/>
    <!-- Spilled Flowers -->
    <circle cx="-20" cy="-10" r="8" fill="#10b981"/>
    <circle cx="-30" cy="-20" r="8" fill="#f59e0b"/>
  </g>

  <!-- Motion lines -->
  <path d="M140 130 Q150 120, 160 130" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M150 110 Q160 100, 170 110" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>