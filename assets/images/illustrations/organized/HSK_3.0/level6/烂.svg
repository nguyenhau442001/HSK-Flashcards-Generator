<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Fresh Apple Gradient -->
    <linearGradient id="freshApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Rotten Apple Gradient -->
    <linearGradient id="rottenApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#291104"/>
    </linearGradient>

    <!-- Decay/Muck Gradient -->
    <linearGradient id="decaySpot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f2b1d"/>
      <stop offset="70%" stop-color="#1c130d"/>
      <stop offset="100%" stop-color="#0f0905"/>
    </linearGradient>

    <!-- Glow Effect for Freshness -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting / Glow in background -->
  <circle cx="150" cy="120" r="70" fill="#3b82f6" opacity="0.08" filter="url(#glow)"/>
  <circle cx="90" cy="140" r="60" fill="#f59e0b" opacity="0.05" filter="url(#glow)"/>

  <!-- Wooden Cutting Board / Surface -->
  <g filter="url(#shadow)">
    <!-- Board Base -->
    <ellipse cx="120" cy="180" rx="90" ry="32" fill="url(#tableGrad)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="120" cy="177" rx="84" ry="28" fill="#1e293b"/>
    <!-- Board Wood Grain Rings (Stylized) -->
    <path d="M 60 177 Q 120 165 180 177" stroke="#334155" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M 80 183 Q 120 173 160 183" stroke="#334155" stroke-width="2" fill="none" opacity="0.3"/>
  </g>

  <!-- SCENE OBJECTS: The Fruit Basket / Context -->
  <g id="scene-props">
    <!-- Drop Shadow for Left Apple (Fresh) -->
    <ellipse cx="75" cy="175" rx="22" ry="8" fill="#020617" opacity="0.6"/>
    <!-- Drop Shadow for Right Apple (Rotten) -->
    <ellipse cx="155" cy="175" rx="28" ry="10" fill="#020617" opacity="0.8"/>
  </g>

  <!-- FRESH APPLE (Background Context for contrast) -->
  <g id="fresh-apple" transform="translate(10, 15)">
    <!-- Stem -->
    <path d="M 65 85 Q 68 73 75 70" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Leaf -->
    <path d="M 72 78 Q 85 70 82 85 Q 75 88 72 78" fill="#10b981"/>
    <!-- Apple Body -->
    <circle cx="65" cy="105" r="22" fill="url(#freshApple)"/>
    <!-- Highlight -->
    <path d="M 57 95 Q 61 90 67 93" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Cute Expression on Fresh Apple -->
    <circle cx="58" cy="103" r="2" fill="#7f1d1d"/>
    <circle cx="72" cy="103" r="2" fill="#7f1d1d"/>
    <path d="M 63 110 Q 65 113 67 110" stroke="#7f1d1d" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ROTTEN, MASHED, SPOILED APPLE (Main Subject: 烂 - làn) -->
  <g id="rotten-apple" transform="translate(110, 85)" filter="url(#shadow)">
    <!-- Slumped, Sagging Apple Body (Collapsed shape representing "hỏng/nát") -->
    <path d="M 15 25 
             C -5 20, -10 60, 5 75 
             C 25 90, 55 90, 75 75 
             C 90 60, 85 20, 65 25 
             C 55 10, 25 10, 15 25 Z" 
          fill="url(#rottenApple)"/>

    <!-- Major Bruised / Rotten Indentation (Sagging / Melting effect) -->
    <path d="M 25 35 
             C 40 30, 60 40, 55 60 
             C 50 80, 20 75, 25 50 
             C 27 40, 20 40, 25 35 Z" 
          fill="url(#decaySpot)"/>

    <!-- Dripping / Melted Decay Texture at the bottom -->
    <path d="M 35 72 C 38 82, 42 85, 45 92 C 48 85, 52 82, 55 72 Z" fill="#291104"/>
    <path d="M 18 65 C 19 72, 21 75, 23 80 C 25 75, 27 72, 28 65 Z" fill="#1c130d"/>

    <!-- Shriveled, Broken Stem -->
    <path d="M 40 18 Q 43 10 38 5" stroke="#291104" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Flies / Spores Swarming around (Indicates decay & rot) -->
    <!-- Fly 1 -->
    <g transform="translate(-10, 20)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#0f172a"/>
      <ellipse cx="-2" cy="-2" rx="3" ry="1.5" fill="#94a3b8" opacity="0.7"/>
      <ellipse cx="2" cy="-2" rx="3" ry="1.5" fill="#94a3b8" opacity="0.7"/>
    </g>
    <!-- Fly 2 -->
    <g transform="translate(75, 10)">
      <ellipse cx="0" cy="0" rx="2.5" ry="1.5" fill="#0f172a"/>
      <ellipse cx="-2" cy="-2" rx="2.5" ry="1" fill="#94a3b8" opacity="0.7"/>
    </g>

    <!-- Little Sparkle/Stench lines indicating spoilage -->
    <path d="M 68 35 Q 75 30 72 20" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 15 30 Q 8 20 12 12" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Sad/Spoiled Facial Expression (Expressive animation element) -->
    <!-- Droopy X eyes showing it's ruined/dead -->
    <!-- Left Eye X -->
    <path d="M 28 42 L 34 48 M 34 42 L 28 48" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
    <!-- Right Eye X -->
    <path d="M 48 44 L 54 50 M 54 44 L 48 50" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Wavy / Dizzy Mouth -->
    <path d="M 36 62 Q 39 57, 42 62 T 48 62" stroke="#fcd34d" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sparkles / Atmosphere accents -->
  <circle cx="200" cy="60" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="40" cy="80" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="30" cy="40" r="2.5" fill="#38bdf8" opacity="0.4"/>
</svg>