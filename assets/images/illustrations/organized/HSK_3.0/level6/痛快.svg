      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Bowl -->
  <path d="M70 160 L170 160 C170 190, 150 210, 120 210 C90 210, 70 190, 70 160" fill="#fbbf24"/>
  <path d="M75 160 L165 160 C165 185, 145 205, 120 205 C95 205, 75 185, 75 160" fill="#f59e0b"/>
  
  <!-- Noodles/Food -->
  <path d="M85 150 Q100 130 120 150 T155 150" stroke="#fb923c" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M90 140 Q110 120 130 140 T160 140" stroke="#fb923c" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <!-- Character Face (Expressing satisfaction) -->
  <circle cx="120" cy="90" r="40" fill="#f8fafc"/>
  <path d="M105 85 Q110 80 115 85" stroke="#1e293b" stroke-width="3" fill="none"/>
  <path d="M135 85 Q140 80 145 85" stroke="#1e293b" stroke-width="3" fill="none"/>
  <path d="M105 105 Q120 120 135 105" stroke="#ec4899" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Steam/Action lines -->
  <path d="M140 120 Q150 100 145 80" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M100 120 Q90 100 95 80" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Chopsticks -->
  <rect x="170" y="130" width="4" height="50" rx="2" fill="#10b981" transform="rotate(20 170 130)"/>
  <rect x="175" y="135" width="4" height="50" rx="2" fill="#10b981" transform="rotate(10 175 135)"/>
</svg>