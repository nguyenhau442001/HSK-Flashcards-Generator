<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Golden Mouse Body Gradient -->
    <linearGradient id="mouseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Ear Inner Pink Gradient -->
    <linearGradient id="earInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Cheese Yellow Gradient -->
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Spotlight/Glow -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting / Spotlight -->
  <rect width="240" height="240" fill="url(#spotlight)" />

  <!-- Background Room Elements (Baseboard & Wall texture) -->
  <path d="M0 170 L240 170" stroke="#475569" stroke-width="4" />
  <rect x="0" y="170" width="240" height="70" fill="url(#floorGrad)" />
  
  <!-- Wooden floor planks perspective lines -->
  <path d="M0 195 L240 195" stroke="#1e293b" stroke-width="2" />
  <path d="M0 220 L240 220" stroke="#1e293b" stroke-width="2" />
  <path d="M80 170 L40 240" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.5" />
  <path d="M160 170 L200 240" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Background Prop: Cozy House Interior Shelf/Box corner -->
  <path d="M180 120 L240 100 L240 170 L180 170 Z" fill="#475569" opacity="0.3" />
  <path d="M20 130 Q35 110 50 130 T80 130" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Prop: Delicious Wedge of Swiss Cheese -->
  <g filter="url(#shadow)" transform="translate(140, 145)">
    <!-- Cheese Body -->
    <path d="M 0 25 L 50 0 L 60 30 L 10 55 Z" fill="url(#cheeseGrad)" />
    <!-- Cheese Front Face -->
    <path d="M 0 25 L 10 55 L 60 55 L 60 30 Z" fill="#ca8a04" />
    <!-- Cheese Holes -->
    <circle cx="25" cy="42" r="5" fill="#a16207" opacity="0.5" />
    <circle cx="45" cy="48" r="3" fill="#a16207" opacity="0.5" />
    <circle cx="38" cy="18" r="4" fill="#ca8a04" opacity="0.5" />
    <!-- Top Highlight -->
    <path d="M 5 27 L 45 7 L 53 30 L 13 48 Z" fill="#fff" opacity="0.15" />
  </g>

  <!-- MAIN SUBJECT: The Cute Mouse (老鼠) -->
  <g filter="url(#shadow)">
    <!-- Mouse Tail (Sleek curving tail behind) -->
    <path d="M 75 160 C 50 170, 30 150, 20 130 C 15 115, 25 100, 35 110" fill="none" stroke="#f472b6" stroke-width="5" stroke-linecap="round" />

    <!-- Back Left Foot -->
    <ellipse cx="85" cy="172" rx="10" ry="6" fill="#d97706" />
    <ellipse cx="87" cy="173" rx="7" ry="4" fill="#fbbf24" />

    <!-- Mouse Body (Action-packed crouching/reaching pose) -->
    <path d="M 70 125 C 60 100, 90 90, 110 110 C 130 120, 145 140, 135 160 C 125 175, 80 175, 70 160 Z" fill="url(#mouseGrad)" />

    <!-- Body Shading/Highlight -->
    <path d="M 80 112 C 95 105, 120 115, 125 135 C 120 120, 100 110, 80 112 Z" fill="#fff" opacity="0.3" />

    <!-- Front Left Paw (Reaching out towards cheese) -->
    <ellipse cx="125" cy="155" rx="7" ry="5" fill="#fbbf24" />
    <circle cx="128" cy="154" r="2" fill="#fff" opacity="0.6" />

    <!-- Front Right Paw -->
    <ellipse cx="110" cy="168" rx="7" ry="5" fill="#d97706" />

    <!-- Large Cute Mouse Head -->
    <g transform="translate(85, 95)">
      <!-- Back Ear -->
      <g transform="translate(-10, -15) rotate(-15)">
        <circle cx="0" cy="0" r="18" fill="#d97706" />
        <circle cx="0" cy="2" r="11" fill="url(#earInner)" />
      </g>

      <!-- Front Ear -->
      <g transform="translate(15, -22) rotate(15)">
        <circle cx="0" cy="0" r="18" fill="url(#mouseGrad)" />
        <circle cx="0" cy="2" r="11" fill="url(#earInner)" />
      </g>

      <!-- Head Base Shape -->
      <path d="M -15 -5 C -15 -25, 25 -25, 25 -5 C 25 15, -5 20, -15 -5 Z" fill="url(#mouseGrad)" />

      <!-- Cheek/Snout Highlight -->
      <ellipse cx="8" cy="2" rx="10" ry="8" fill="#fbbf24" />

      <!-- Sparkling Happy Eyes -->
      <circle cx="3" cy="-4" r="4.5" fill="#0f172a" />
      <circle cx="4.5" cy="-5.5" r="1.5" fill="#ffffff" />
      <circle cx="1.5" cy="-2.5" r="0.6" fill="#ffffff" />

      <!-- Eyebrow (Curious/Happy expression) -->
      <path d="M -1 -12 Q 3 -16 8 -11" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round" />

      <!-- Cute Pink Nose -->
      <path d="M 17 -1 Q 21 -1 19 -4 Z" fill="#ec4899" />
      <ellipse cx="18" cy="-2" rx="2.5" ry="1.5" fill="#f472b6" />

      <!-- Smiling Mouth & Whiskers -->
      <path d="M 12 3 Q 17 8 20 4" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      
      <!-- Whiskers Left -->
      <path d="M 2 -2 L -12 -5" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      <path d="M 3 2 L -12 3" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      
      <!-- Whiskers Right -->
      <path d="M 22 -2 L 32 -5" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      <path d="M 22 2 L 32 6" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Dust motes / Magic sparkles) -->
  <circle cx="165" cy="115" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="166" cy="116" r="1" fill="#ffffff" />
  <circle cx="130" cy="100" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="100" cy="70" r="2.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="60" cy="105" r="1.5" fill="#38bdf8" opacity="0.8" />
  <path d="M 150 90 L 153 96 L 159 93 L 153 99 Z" fill="#fde047" opacity="0.9" />
</svg>