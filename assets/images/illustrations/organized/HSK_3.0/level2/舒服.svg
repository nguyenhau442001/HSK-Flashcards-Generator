<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Blanket Gradient -->
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Pillow Gradient -->
    <linearGradient id="pillowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Lighting / Glow Effect from Bedside Lamp -->
  <circle cx="190" cy="90" r="70" fill="url(#lampGlow)"/>

  <!-- Wall & Floor Divider -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Background Props: Window with Night Sky & Stars -->
  <g transform="translate(20, 30)">
    <rect width="55" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="6" y="6" width="43" height="63" rx="4" fill="#1e293b"/>
    <!-- Tiny Stars -->
    <circle cx="16" cy="20" r="1.5" fill="#fef08a"/>
    <circle cx="38" cy="45" r="1" fill="#fef08a"/>
    <circle cx="25" cy="58" r="1.5" fill="#fef08a"/>
    <!-- Cute crescent moon -->
    <path d="M38 18 C35 22 35 28 39 31 C33 32 29 27 31 21 C32 18 35 17 38 18 Z" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Background Props: Bedside Table & Lamp -->
  <g transform="translate(165, 95)">
    <!-- Table -->
    <rect x="0" y="35" width="55" height="65" rx="4" fill="#334155"/>
    <rect x="8" y="45" width="39" height="18" rx="2" fill="#1e293b"/>
    <!-- Table Drawer Handle -->
    <circle cx="27.5" cy="54" r="2" fill="#94a3b8"/>
    
    <!-- Lamp Stand -->
    <path d="M22 35 L32 35 L29 15 L25 15 Z" fill="#64748b"/>
    <rect x="19" y="33" width="17" height="4" rx="2" fill="#475569"/>
    <!-- Lamp Shade -->
    <path d="M14 15 L40 15 L34 2 L20 2 Z" fill="#f59e0b"/>
  </g>

  <!-- HOUSEPLANT ON TABLE -->
  <g transform="translate(173, 83)">
    <path d="M5 12 L11 12 L9 20 L7 20 Z" fill="#cbd5e1"/>
    <ellipse cx="8" cy="12" rx="3" ry="1" fill="#94a3b8"/>
    <!-- Leaves -->
    <path d="M8 12 Q4 5 1 8 Q4 11 8 12 Z" fill="#10b981"/>
    <path d="M8 12 Q12 4 16 7 Q13 11 8 12 Z" fill="#059669"/>
    <path d="M8 12 Q8 2 10 0 Q11 6 8 12 Z" fill="#34d399"/>
  </g>

  <!-- MAIN SUBJECT: Cozy Bed with Person Resting (舒服 - Comfortable/Relaxed) -->
  <g transform="translate(25, 105)">
    <!-- Bed Frame / Wooden Headboard -->
    <rect x="5" y="-15" width="160" height="85" rx="12" fill="#475569" filter="url(#shadow)"/>
    <rect x="10" y="-10" width="150" height="75" rx="8" fill="#334155"/>

    <!-- Fluffy Pillow -->
    <g transform="translate(18, 0)">
      <rect x="0" y="0" width="55" height="35" rx="14" fill="url(#pillowGrad)" filter="url(#shadow)"/>
      <path d="M12 8 C22 12 33 12 43 8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Sleeping Person (Head & Relaxed Face) -->
    <g transform="translate(25, 4)">
      <!-- Head -->
      <circle cx="24" cy="16" r="16" fill="#fed7aa"/>
      <!-- Closed Happy Eyes (Arcs) -->
      <path d="M17 14 C19 16 21 16 23 14" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M27 14 C29 16 31 16 33 14" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Blissful Smile -->
      <path d="M23 20 Q25 23 27 20" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Rosy Cheeks -->
      <circle cx="16" cy="19" r="3" fill="#fb7185" opacity="0.5"/>
      <circle cx="34" cy="19" r="3" fill="#fb7185" opacity="0.5"/>
      <!-- Hair tuft -->
      <path d="M15 8 Q20 2 28 6" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Cozy Blanket / Duvet -->
    <g transform="translate(45, 12)">
      <path d="M 0 5 Q 40 -5 115 5 L 120 58 Q 60 65 0 58 Z" fill="url(#blanketGrad)" filter="url(#shadow)"/>
      <!-- Blanket Pattern / Waves -->
      <path d="M 20 20 Q 40 25 60 20" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 50 38 Q 70 43 90 38" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
      <!-- Cute Sleeping Cat on Top of Blanket -->
      <g transform="translate(75, -2)">
        <!-- Cat Body -->
        <ellipse cx="18" cy="14" rx="14" ry="10" fill="#fb923c"/>
        <!-- Cat Head -->
        <circle cx="8" cy="10" r="9" fill="#fb923c"/>
        <!-- Cat Ears -->
        <path d="M2 5 L5 1 L8 7 Z" fill="#ea580c"/>
        <path d="M9 4 L12 0 L14 6 Z" fill="#ea580c"/>
        <!-- Closed Eyes -->
        <path d="M5 9 C6 10 7 10 8 9" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <!-- Tail -->
        <path d="M30 14 Q38 12 36 6" stroke="#fb923c" stroke-width="3" stroke-linecap="round" fill="none"/>
        <!-- Zzz Floating Up -->
        <text x="24" y="-4" fill="#cbd5e1" font-family="sans-serif" font-weight="bold" font-size="10" opacity="0.8">z</text>
        <text x="32" y="-12" fill="#cbd5e1" font-family="sans-serif" font-weight="bold" font-size="12" opacity="0.6">Z</text>
      </g>
    </g>
  </g>

  <!-- Foreground Atmospheric Elements: Floating Cozy Zzz's & Sparkles -->
  <g transform="translate(60, 95)">
    <path d="M 0 0 Q 3 -4 6 -2 Q 9 0 12 -4" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5"/>
    <circle cx="-5" cy="15" r="2" fill="#fef08a" opacity="0.7"/>
    <circle cx="120" cy="10" r="1.5" fill="#fef08a" opacity="0.6"/>
    <circle cx="135" cy="-25" r="2.5" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Rug under the bed -->
  <ellipse cx="110" cy="195" rx="85" ry="18" fill="#334155" opacity="0.7"/>
  <ellipse cx="110" cy="195" rx="75" ry="14" fill="#475569" opacity="0.6"/>

  <!-- Slippers neatly placed on the rug -->
  <g transform="translate(85, 185)">
    <!-- Left Slipper -->
    <path d="M0 6 C0 2 5 0 10 3 C15 6 16 12 12 14 C6 16 0 10 0 6 Z" fill="#ec4899"/>
    <ellipse cx="8" cy="8" rx="3" ry="2" fill="#fbcfe8"/>
    <!-- Right Slipper -->
    <path d="M16 6 C16 2 21 0 26 3 C31 6 32 12 28 14 C22 16 16 10 16 6 Z" fill="#ec4899"/>
    <ellipse cx="24" cy="8" rx="3" ry="2" fill="#fbcfe8"/>
  </g>
</svg>