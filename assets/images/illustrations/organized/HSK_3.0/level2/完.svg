  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#475569"/>
  <rect x="40" y="175" width="10" height="65" fill="#334155"/>
  <rect x="190" y="175" width="10" height="65" fill="#334155"/>
  
  <!-- Empty Bowl and Chopsticks -->
  <path d="M70 150 Q70 165 90 165 Q110 165 110 150 Z" fill="#f1f5f9"/>
  <path d="M75 145 L105 145 L102 155 L78 155 Z" fill="#e2e8f0"/>
  <rect x="115" y="130" width="4" height="40" rx="2" fill="#fb923c" transform="rotate(15 117 150)"/>
  <rect x="122" y="130" width="4" height="40" rx="2" fill="#fb923c" transform="rotate(-10 124 150)"/>
  
  <!-- Character -->
