<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Stack of Papers/Files (The "Shìqing" / Task) -->
  <g transform="translate(60, 100)">
    <rect x="0" y="20" width="120" height="80" rx="4" fill="#e2e8f0"/>
    <rect x="5" y="15" width="120" height="80" rx="4" fill="#cbd5e1"/>
    <rect x="10" y="10" width="120" height="80" rx="4" fill="#f8fafc"/>
    <!-- Sticky Notes -->
    <rect x="90" y="25" width="30" height="30" fill="#f59e0b" rx="2"/>
    <rect x="80" y="50" width="30" height="30" fill="#fbbf24" rx="2"/>
  </g>
  
  <!-- Coffee Cup (Atmospheric prop) -->
  <g transform="translate(180, 140)">
    <path d="M0 0 L40 0 L35 40 L5 40 Z" fill="#38bdf8"/>
    <ellipse cx="20" cy="0" rx="20" ry="6" fill="#0ea5e9"/>
    <path d="M35 10 A15 15 0 0 1 35 30" fill="none" stroke="#38bdf8" stroke-width="4"/>
  </g>
  
  <!-- Pen -->
  <rect x="40" y="170" width="60" height="8" rx="4" fill="#ec4899" transform="rotate(-15 70 174)"/>
  
  <!-- Clock (Urgency/Task context) -->
  <circle cx="200" cy="40" r="25" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <circle cx="200" cy="40" r="20" fill="#f1f5f9"/>
  <line x1="200" y1="40" x2="200" y2="25" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="40" x2="215" y2="40" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="4" fill="#10b981"/>
  <circle cx="50" cy="30" r="6" fill="#fb923c"/>
</svg>