<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#0f172a" opacity="0.4"/>
  
  <!-- Glass of Water -->
  <path d="M170 100 L200 100 L195 180 L175 180 Z" fill="#38bdf8" opacity="0.3"/>
  <ellipse cx="185" cy="100" rx="15" ry="5" fill="#38bdf8" opacity="0.5"/>
  <ellipse cx="185" cy="180" rx="15" ry="5" fill="#38bdf8" opacity="0.2"/>
  
  <!-- Pill Bottle -->
  <rect x="60" y="90" width="60" height="90" rx="8" fill="#fb923c"/>
  <rect x="65" y="80" width="50" height="15" rx="4" fill="#f59e0b"/>
  <rect x="70" y="100" width="40" height="10" rx="2" fill="#ffffff" opacity="0.2"/>
  <rect x="70" y="120" width="40" height="10" rx="2" fill="#ffffff" opacity="0.2"/>
  
  <!-- Scattered Pills -->
  <ellipse cx="135" cy="170" rx="12" ry="6" fill="#ec4899" transform="rotate(20 135 170)"/>
  <circle cx="155" cy="175" r="7" fill="#10b981"/>
  <ellipse cx="145" cy="185" rx="10" ry="5" fill="#fbbf24" transform="rotate(-15 145 185)"/>
  
  <!-- Clock/Time indicator -->
  <circle cx="180" cy="50" r="25" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <line x1="180" y1="50" x2="180" y2="35" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="50" x2="195" y2="50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="120" r="80" fill="#fb923c" opacity="0.05"/>
</svg>