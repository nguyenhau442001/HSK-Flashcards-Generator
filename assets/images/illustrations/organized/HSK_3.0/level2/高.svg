<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Basketball Hoop Pole -->
  <rect x="180" y="20" width="12" height="220" rx="4" fill="#475569"/>
  <path d="M186 60 L220 75 L186 90 Z" fill="#fb923c"/>
  
  <!-- Character: Tall Basketball Player -->
  <g transform="translate(60, 40)">
    <!-- Legs -->
    <rect x="40" y="120" width="10" height="80" rx="4" fill="#38bdf8"/>
    <rect x="60" y="120" width="10" height="80" rx="4" fill="#38bdf8"/>
    
    <!-- Torso -->
    <rect x="30" y="50" width="50" height="70" rx="10" fill="#f59e0b"/>
    
    <!-- Arms reaching up -->
    <rect x="20" y="30" width="10" height="60" rx="4" fill="#fbbf24"/>
    <rect x="80" y="30" width="10" height="60" rx="4" fill="#fbbf24"/>
    
    <!-- Head -->
    <circle cx="55" cy="30" r="25" fill="#fde68a"/>
    <!-- Face -->
    <circle cx="45" cy="25" r="3" fill="#0f172a"/>
    <circle cx="65" cy="25" r="3" fill="#0f172a"/>
    <path d="M45 40 Q55 48 65 40" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Basketball -->
  <circle cx="150" cy="50" r="12" fill="#ec4899"/>
  <path d="M150 38 A12 12 0 0 1 150 62 M138 50 A12 12 0 0 1 162 50" stroke="#0f172a" stroke-width="2" fill="none"/>
  
  <!-- Ambient lighting/Floor -->
  <rect x="0" y="220" width="240" height="20" fill="#10b981" opacity="0.3"/>
</svg>