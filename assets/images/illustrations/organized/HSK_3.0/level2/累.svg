<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk/Environment -->
  <rect x="20" y="140" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="155" width="10" height="85" rx="2" fill="#475569"/>
  <rect x="190" y="155" width="10" height="85" rx="2" fill="#475569"/>
  
  <!-- Props -->
  <circle cx="180" cy="120" r="15" fill="#f59e0b" opacity="0.3"/>
  <path d="M170 130 L190 130 L185 140 L175 140 Z" fill="#fb923c"/>
  <rect x="60" y="125" width="40" height="15" rx="2" fill="#38bdf8"/>
  
  <!-- Character: Slumped posture -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-40 80 Q-20 40 0 40 T40 80 L30 100 L-30 100 Z" fill="#94a3b8"/>
    
    <!-- Head -->
    <circle cx="0" cy="10" r="35" fill="#fde68a"/>
    
    <!-- Eyes: Closed/Exhausted -->
    <path d="M-20 5 Q-10 0 0 5" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M10 5 Q20 0 30 5" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Mouth: Sighing -->
    <ellipse cx="5" cy="30" rx="8" ry="4" fill="#fb923c"/>
    
    <!-- Hair -->
    <path d="M-30 0 Q-35 -20 -10 -30 Q10 -35 30 -20 Q40 -10 35 5" stroke="#1e293b" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Arms -->
    <path d="M-40 60 L-70 90" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 60 L70 90" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Exhaustion lines/Atmosphere -->
  <path d="M160 60 Q170 50 180 60" stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M170 40 Q180 30 190 40" stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
</svg>