<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Table Surface -->
    <path d="M0 120 L160 120 L140 150 L-20 150 Z" fill="#334155"/>
    
    <!-- Tea Pot -->
    <circle cx="120" cy="100" r="25" fill="#fbbf24"/>
    <path d="M145 100 L160 90 L160 110 Z" fill="#fbbf24"/>
    <path d="M105 80 Q105 60 125 60" stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Person (Head and Shoulders) -->
    <circle cx="60" cy="60" r="35" fill="#fde68a"/>
    <path d="M30 150 Q60 100 90 150" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    
    <!-- Cultural Artifact: Traditional Red Lantern hanging slightly in background -->
    <circle cx="160" cy="30" r="20" fill="#ec4899"/>
    <rect x="158" y="50" width="4" height="20" fill="#fb923c"/>
    
    <!-- Decorative Window Frame -->
    <path d="M10 10 L150 10 L150 140 L10 140 Z" stroke="#334155" stroke-width="4" fill="none"/>
    <path d="M80 10 L80 140" stroke="#334155" stroke-width="4"/>
  </g>
  
  <!-- Accent details -->
  <circle cx="30" cy="180" r="5" fill="#10b981"/>
  <circle cx="210" cy="60" r="8" fill="#fb923c"/>
</svg>