<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight for "Aha!" moment -->
    <radialGradient id="spotlight" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Atmospheric Background Elements (Room Setting) -->
  <!-- Bookshelf / Wall details -->
  <path d="M 20 60 L 220 60" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
  <rect x="170" y="25" width="35" height="35" rx="6" fill="#334155" opacity="0.3"/>
  <rect x="180" y="20" width="15" height="40" rx="3" fill="#475569" opacity="0.4"/>

  <!-- Desk Surface -->
  <path d="M 10 190 L 230 190" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M 30 194 L 210 194" stroke="#0f172a" stroke-width="6"/>
  <path d="M 20 190 L 220 190 L 230 210 L 10 210 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Prop 1: Open Envelope / Acceptance Letter (Context of "passed university") -->
  <g transform="translate(130, 115) rotate(12)" filter="url(#soft-shadow)">
    <!-- Letter Base -->
    <rect x="-35" y="-45" width="70" height="90" rx="4" fill="#f8fafc"/>
    <!-- Mock text lines on letter -->
    <rect x="-25" y="-30" width="40" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="-25" y="-18" width="50" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="-25" y="-8" width="30" height="4" rx="2" fill="#e2e8f0"/>
    <!-- Gold Seal / Star badge on letter -->
    <circle cx="15" cy="20" r="12" fill="#fbbf24"/>
    <path d="M 15 13 L 17 18 L 22 18 L 18 21 L 19 26 L 15 23 L 11 26 L 12 21 L 8 18 L 13 18 Z" fill="#d97706" transform="scale(0.6) translate(10, 8)"/>
  </g>

  <!-- Open Envelope Pocket overlapping letter -->
  <g transform="translate(140, 140) rotate(12)" filter="url(#soft-shadow)">
    <path d="M -40 -15 L 0 25 L 40 -15 L 40 30 C 40 33 37 35 34 35 L -34 35 C -37 35 -40 33 -40 30 Z" fill="#3b82f6"/>
    <path d="M -40 -15 L 0 15 L 40 -15 L 0 -45 Z" fill="#60a5fa"/>
  </g>

  <!-- Main Character (Surprised & Delighted "Aha!" moment representing "Chẳng trách/Không lạ gì") -->
  <g transform="translate(85, 120)" filter="url(#soft-shadow)">
    <!-- Character Body / Hoodie -->
    <path d="M -45 70 C -45 45 -25 35 0 35 C 25 35 45 45 45 70 L 55 85 L -55 85 Z" fill="#ec4899"/>
    <!-- Hoodie Pocket & Strings -->
    <path d="M -20 65 L 20 65 L 15 80 L -15 80 Z" fill="#db2777" opacity="0.6"/>
    <path d="M -8 40 L -15 60" stroke="#fce7f3" stroke-width="3" stroke-linecap="round"/>
    <path d="M 8 40 L 15 60" stroke="#fce7f3" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="-10" y="25" width="20" height="15" fill="#ffd6a5"/>

    <!-- Head -->
    <circle cx="0" cy="0" r="32" fill="#ffeadd"/>

    <!-- Hair (Expressive, slightly messy from excitement) -->
    <path d="M -32 -5 C -35 -25 -15 -35 0 -35 C 18 -35 34 -22 32 -2 C 34 -15 25 -30 5 -30 C -15 -30 -30 -15 -32 -5 Z" fill="#1e293b"/>

    <!-- Facial Expression: "Aha!" realization with wide happy eyes and open mouth -->
    <!-- Eyebrows raised high -->
    <path d="M -18 -12 C -13 -16 -8 -12 -6 -12" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 6 -12 C 8 -12 13 -16 18 -12" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Sparkling Happy Eyes (Arcs/Closed happy or wide open with shine) -->
    <circle cx="-12" cy="-3" r="4" fill="#1e293b"/>
    <circle cx="12" cy="-3" r="4" fill="#1e293b"/>
    <circle cx="-13" cy="-5" r="1.5" fill="#ffffff"/>
    <circle cx="11" cy="-5" r="1.5" fill="#ffffff"/>

    <!-- Blushing Cheeks -->
    <circle cx="-18" cy="4" r="5" fill="#fda4af" opacity="0.6"/>
    <circle cx="18" cy="4" r="5" fill="#fda4af" opacity="0.6"/>

    <!-- Big Open Happy Mouth (Realization) -->
    <path d="M -8 8 C -8 16 8 16 8 8 Z" fill="#be123c"/>
    <path d="M -5 8 C -5 12 5 12 5 8 Z" fill="#ffe4e6"/>

    <!-- Arms in gesture of sudden understanding -->
    <!-- Left arm raised up -->
    <path d="M -40 45 C -55 30 -60 10 -55 5" stroke="#ec4899" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="-55" cy="5" r="7" fill="#ffeadd"/>

    <!-- Right arm bent holding cheek / pointing to head -->
    <path d="M 40 45 C 55 40 50 15 35 15" stroke="#ec4899" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="35" cy="15" r="7" fill="#ffeadd"/>
  </g>

  <!-- Prop 2: Glowing Lightbulb (Visual metaphor for "Chẳng trách/Aha! Now I get it!") -->
  <g transform="translate(175, 45)" filter="url(#glow)">
    <circle cx="0" cy="0" r="16" fill="#fbbf24" opacity="0.3"/>
    <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
    <!-- Lightbulb Rays -->
    <path d="M 0 -16 L 0 -22" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 12 -12 L 17 -17" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 12 12 L 17 17" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M -12 -12 L -17 -17" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(175, 45)">
    <path d="M -7 6 C -7 12 7 12 7 6 C 7 2 4 0 4 -4 L -4 -4 C -4 0 -7 2 -7 6 Z" fill="#fde047"/>
    <rect x="-3" y="6" width="6" height="4" fill="#94a3b8"/>
    <rect x="-2" y="10" width="4" height="3" rx="1" fill="#64748b"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Sparkles & Action Flourishes (Emphasis on realization) -->
  <g fill="#38bdf8">
    <path d="M 45 40 L 48 48 L 56 51 L 48 54 L 45 62 L 42 54 L 34 51 L 42 48 Z" opacity="0.8"/>
    <path d="M 205 130 L 207 135 L 212 137 L 207 139 L 205 144 L 203 139 L 198 137 L 203 135 Z" opacity="0.6"/>
  </g>
  <g fill="#fbbf24">
    <path d="M 110 35 L 112 40 L 117 42 L 112 44 L 110 49 L 108 44 L 103 42 L 108 40 Z"/>
  </g>
</svg>