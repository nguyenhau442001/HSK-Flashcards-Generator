<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="8"/>
  
  <!-- The "Loss" Scene: Empty wallet and scattered coins -->
  <g transform="translate(120, 140)">
    <!-- Open Wallet -->
    <path d="M-40 0 L40 0 L30 40 L-30 40 Z" fill="#fb923c"/>
    <path d="M-35 5 L35 5 L25 35 L-25 35 Z" fill="#c2410c"/>
    <rect x="-10" y="10" width="20" height="20" fill="#1e293b" opacity="0.3"/>
    
    <!-- Scattered Coins -->
    <circle cx="-50" cy="30" r="8" fill="#fbbf24"/>
    <circle cx="-65" cy="45" r="6" fill="#fbbf24"/>
    <circle cx="55" cy="35" r="7" fill="#fbbf24"/>
  </g>
  
  <!-- Frustrated Character (Head and Shoulders) -->
  <g transform="translate(120, 100)">
    <!-- Shoulders -->
    <path d="M-50 40 Q0 30 50 40 L60 80 L-60 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="35" fill="#fde68a"/>
    <!-- Expression: Downcast eyes and downturned mouth -->
    <path d="M-15 -5 L-5 -5 M5 -5 L15 -5" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M-12 15 Q0 22 12 15" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Hair -->
    <path d="M-30 -10 C-30 -40 30 -40 30 -10 C30 -20 10 -30 0 -30 C-10 -30 -30 -20 -30 -10" fill="#1e293b"/>
  </g>
  
  <!-- Background Elements: Faded upward graphs -->
  <path d="M30 120 L70 80 L110 100 L150 40" stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M180 100 L210 130" stroke="#10b981" stroke-width="3" fill="none"/>
</svg>