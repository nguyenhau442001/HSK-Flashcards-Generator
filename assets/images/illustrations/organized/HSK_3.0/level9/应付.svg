<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Character (The one dealing with the situation) -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-30" r="25" fill="#fde68a"/>
    <path d="M-10 -35 Q-5 -40 0 -35 T10 -35" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M-15 -25 Q0 -15 15 -25" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="-30" y="-5" width="60" height="40" rx="10" fill="#38bdf8"/>
  </g>

  <!-- The "Difficulties" (Falling papers/tasks) -->
  <g transform="rotate(-15 180 60)">
    <rect x="160" y="40" width="40" height="50" rx="4" fill="#fb923c"/>
    <line x1="170" y1="55" x2="190" y2="55" stroke="#fff" stroke-width="2"/>
    <line x1="170" y1="65" x2="190" y2="65" stroke="#fff" stroke-width="2"/>
    <line x1="170" y1="75" x2="180" y2="75" stroke="#fff" stroke-width="2"/>
  </g>
  
  <g transform="rotate(10 60 80)">
    <rect x="40" y="60" width="40" height="50" rx="4" fill="#fbbf24"/>
    <circle cx="60" cy="85" r="8" fill="#fff"/>
    <path d="M55 80 L65 90 M65 80 L55 90" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- Action lines/Energy -->
  <path d="M90 120 Q110 100 130 120" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="140" cy="110" r="3" fill="#10b981"/>
  <circle cx="80" cy="130" r="3" fill="#ec4899"/>
</svg>