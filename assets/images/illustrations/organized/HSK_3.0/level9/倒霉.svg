<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Puddle Gradient -->
    <linearGradient id="puddleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Banana Peel Gradient -->
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Jacket Gradient (Orange/Red for bad luck contrast) -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Pants Gradient -->
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Floor/Street Gradient -->
    <linearGradient id="streetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Briefcase shadow -->
    <radialGradient id="shadowGrad" x1="50%" y1="50%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Path for Canvas Bounds -->
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <!-- Base Card -->
  <g clip-path="url(#canvasClip)">
    <rect width="240" height="240" fill="url(#bgGrad)" />

    <!-- Atmospheric Lighting (Moody amber streetlamp glow from top right) -->
    <circle cx="200" cy="-20" r="140" fill="#f59e0b" opacity="0.08" />
    <circle cx="40" cy="220" r="100" fill="#38bdf8" opacity="0.05" />

    <!-- Street Environment / Ground -->
    <rect x="0" y="160" width="240" height="80" fill="url(#streetGrad)" />
    <path d="M0 160 L240 160" stroke="#475569" stroke-width="2" opacity="0.5" />
    
    <!-- Brick pattern on ground (subtle) -->
    <path d="M0 180 L240 180 M0 200 L240 200 M0 220 L240 220" stroke="#1e293b" stroke-width="1" opacity="0.3" />
    <path d="M40 160 L40 240 M120 160 L120 240 M200 160 L200 240" stroke="#1e293b" stroke-width="1" opacity="0.3" />

    <!-- Background Props: Brick Wall & Rain/Storm feel -->
    <path d="M0 0 H240 V160 H0 Z" fill="#0f172a" opacity="0.3" />
    
    <!-- Big Splash / Water Puddle on the floor -->
    <ellipse cx="150" cy="195" rx="45" ry="15" fill="url(#puddleGrad)" />
    <ellipse cx="155" cy="194" rx="30" ry="9" fill="#38bdf8" opacity="0.4" />

    <!-- Motion lines for slipping/falling -->
    <path d="M 60 70 Q 90 90 120 110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 8" opacity="0.6" />
    <path d="M 80 50 Q 110 70 140 90" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 6" opacity="0.4" />

    <!-- FALLING CHARACTER (Mid-air slip action pose) -->
    <g transform="translate(10, 5)">
      <!-- Shadow on ground under falling guy -->
      <ellipse cx="120" cy="180" rx="35" ry="8" fill="url(#shadowGrad)" />

      <!-- Flying Papers / Documents (Work disaster) -->
      <!-- Paper 1 -->
      <g transform="translate(180, 110) rotate(25)">
        <rect x="0" y="0" width="18" height="24" rx="2" fill="#f8fafc" />
        <line x1="3" y1="5" x2="12" y2="5" stroke="#cbd5e1" stroke-width="1.5" />
        <line x1="3" y1="9" x2="15" y2="9" stroke="#cbd5e1" stroke-width="1.5" />
        <line x1="3" y1="13" x2="9" y2="13" stroke="#cbd5e1" stroke-width="1.5" />
      </g>
      <!-- Paper 2 -->
      <g transform="translate(160, 75) rotate(-40)">
        <rect x="0" y="0" width="16" height="20" rx="2" fill="#f1f5f9" />
        <line x1="3" y1="4" x2="11" y2="4" stroke="#94a3b8" stroke-width="1.5" />
        <line x1="3" y1="8" x2="13" y2="8" stroke="#94a3b8" stroke-width="1.5" />
      </g>
      <!-- Paper 3 (falling near puddle) -->
      <g transform="translate(130, 155) rotate(75)">
        <rect x="0" y="0" width="14" height="18" rx="2" fill="#e2e8f0" />
        <line x1="2" y1="4" x2="10" y2="4" stroke="#64748b" stroke-width="1" />
      </g>

      <!-- Flying Briefcase -->
      <g transform="translate(195, 85) rotate(55)">
        <rect x="0" y="0" width="24" height="18" rx="3" fill="#78350f" />
        <rect x="2" y="2" width="20" height="14" rx="2" fill="#92400e" />
        <path d="M8 0 C8 -3 16 -3 16 0" fill="none" stroke="#b45309" stroke-width="2.5" />
        <circle cx="12" cy="9" r="2" fill="#fbbf24" />
      </g>

      <!-- Character Body Group (Tilting backward, legs flailing) -->
      <g transform="translate(100, 115) rotate(-35)">
        
        <!-- Back Leg ( bent up ) -->
        <path d="M 0 15 L -20 35 L -35 30" fill="none" stroke="url(#pantsGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Shoe flying off -->
        <g transform="translate(-45, 25) rotate(-60)">
          <path d="M0 0 C5 -5 12 -2 15 5 C15 8 5 8 0 5 Z" fill="#1e293b" />
          <ellipse cx="4" cy="4" rx="2" ry="1" fill="#cbd5e1" />
        </g>

        <!-- Front Leg ( kicking forward/up ) -->
        <path d="M 15 20 L 35 45 L 50 35" fill="none" stroke="url(#pantsGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Shoe 2 -->
        <path d="M 45 30 C 52 28 60 32 62 38 C 63 43 53 45 48 40 Z" fill="#1e293b" />

        <!-- Torso (Jacket) -->
        <rect x="-10" y="-20" width="30" height="40" rx="8" fill="url(#jacketGrad)" />
        <path d="M 5 -20 L 5 20" stroke="#9f1239" stroke-width="2" />
        <!-- Tie flying up -->
        <path d="M 5 -10 L 15 -25 L 20 -20 L 10 -5 Z" fill="#38bdf8" />

        <!-- Arms flailing -->
        <!-- Left Arm (Back) -->
        <path d="M -5 -10 L -25 -25 L -35 -15" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="-35" cy="-15" r="5" fill="#ffedd5" />

        <!-- Right Arm (Front) -->
        <path d="M 15 -10 L 35 -5 L 45 10" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="45" cy="10" r="5" fill="#ffedd5" />

        <!-- Head & Face (Shocked expression) -->
        <g transform="translate(5, -35)">
          <!-- Hair -->
          <path d="M -8 -5 C -10 -15 5 -18 12 -12 C 18 -12 20 -2 18 5 C 10 2 0 2 -8 -5 Z" fill="#0f172a" />
          <!-- Head Base -->
          <circle cx="5" cy="0" r="14" fill="#ffedd5" />
          
          <!-- Surprised Eyes (Wide open dots/ovals) -->
          <circle cx="2" cy="-2" r="2.5" fill="#0f172a" />
          <circle cx="10" cy="-2" r="2.5" fill="#0f172a" />
          <!-- Eyebrows raised high -->
          <path d="M 0 -8 C 2 -10 5 -8 5 -8" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
          <path d="M 8 -8 C 10 -10 13 -8 13 -8" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

          <!-- Shocked O-mouth -->
          <ellipse cx="6" cy="6" rx="3.5" ry="5" fill="#0f172a" />
          
          <!-- Sweat drop of panic -->
          <path d="M 18 -4 C 18 -4 22 2 18 6 C 16 8 14 6 14 4 C 14 2 16 -1 18 -4 Z" fill="#38bdf8" />
        </g>

      </g>
    </g>

    <!-- THE CULPRIT: The Banana Peel (Foreground detail) -->
    <g transform="translate(90, 160)">
      <!-- Drop shadow for peel -->
      <ellipse cx="5" cy="15" rx="14" ry="4" fill="#000000" opacity="0.4" />
      
      <!-- Banana Peel Open Star Shape -->
      <path d="M 0 10 C -10 15 -15 5 -10 -2 C -5 -8 0 0 0 10 Z" fill="url(#bananaGrad)" stroke="#a16207" stroke-width="1" stroke-linejoin="round" />
      <path d="M 2 12 C 12 18 20 12 18 2 C 16 -5 8 -2 2 12 Z" fill="url(#bananaGrad)" stroke="#a16207" stroke-width="1" stroke-linejoin="round" />
      <path d="M 3 10 C 10 5 15 12 10 22 C 6 28 0 20 3 10 Z" fill="url(#bananaGrad)" stroke="#a16207" stroke-width="1" stroke-linejoin="round" />
      <!-- Center core -->
      <circle cx="3" cy="11" r="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1" />
    </g>

    <!-- Additional Splash Droplets (Action effects) -->
    <circle cx="120" cy="190" r="3" fill="#38bdf8" opacity="0.8" />
    <path d="M 125 185 Q 128 180 132 182" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="175" cy="180" r="2" fill="#38bdf8" opacity="0.9" />
    <path d="M 178 175 Q 182 170 185 174" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Action Star / Impact Spark near feet -->
    <g transform="translate(80, 150) scale(0.7)">
      <path d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#fbbf24" />
    </g>

    <!-- Atmospheric Drizzle / Floating Bad Luck Sparks -->
    <path d="M 30 40 L 25 55" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
    <path d="M 50 20 L 42 35" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
    <path d="M 210 50 L 203 65" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 190 25 L 182 40" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

    <!-- Vignette / Frame Border overlay for polish -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.5" />
  </g>
</svg>