<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="watch-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric background details: Room/Desk environment -->
  <!-- Bookshelf / Wall line -->
  <path d="M 0 180 L 240 180" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Background props: Stack of books -->
  <rect x="25" y="150" width="35" height="30" rx="3" fill="#334155"/>
  <rect x="20" y="158" width="40" height="22" rx="3" fill="#475569"/>
  <rect x="22" y="142" width="38" height="10" rx="2" fill="#0d9488"/>

  <!-- Desk Surface -->
  <path d="M 0 200 L 240 200 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 200 L 240 200" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Coffee Mug Prop -->
  <g transform="translate(185, 160)">
    <rect x="0" y="5" width="20" height="25" rx="3" fill="#cbd5e1" filter="url(#shadow)"/>
    <path d="M 20 10 C 26 10 26 22 20 22" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <path d="M 4 5 L 16 5" stroke="#94a3b8" stroke-width="2"/>
    <!-- Steam -->
    <path d="M 7 0 C 7 -4 13 -4 13 -8" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 13 2 C 13 -2 17 -2 17 -6" stroke="#64748b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Hanging Desk Lamp (Warm illumination) -->
  <path d="M 120 0 L 120 45" stroke="#64748b" stroke-width="3"/>
  <path d="M 95 45 L 145 45 L 155 60 L 85 60 Z" fill="#475569" filter="url(#shadow)"/>
  <!-- Light Beam Cone representing "approximate / estimation" -->
  <polygon points="120,60 40,200 200,200" fill="url(#beam-grad)"/>

  <!-- Main Subject: The "Approximately / Estimation" Concept -->
  <!-- Character or Central Focus: Hand holding a pocket watch / estimating time -->
  <!-- We'll feature an expressive floating smart clock / pocket watch with dynamic motion lines and blurred "approximate" projections -->

  <!-- Floating Estimator / Timer Element -->
  <g transform="translate(120, 115)" filter="url(#shadow)">
    <!-- Outer Glowing Estimation Aura -->
    <circle cx="0" cy="0" r="48" fill="#38bdf8" fill-opacity="0.1" />
    <circle cx="0" cy="0" r="40" fill="url(#watch-glow)" />
    
    <!-- Watch Body Inner -->
    <circle cx="0" cy="0" r="34" fill="#0f172a" />
    <circle cx="0" cy="0" r="34" fill="none" stroke="#fbbf24" stroke-width="3" />

    <!-- Clock hands pointing vaguely (representing approximate time "about 10 minutes") -->
    <line x1="0" y1="0" x2="12" y2="-18" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-16" y2="10" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#fbbf24"/>

    <!-- Top watch crown -->
    <rect x="-5" y="-39" width="10" height="7" rx="2" fill="#fbbf24"/>
    <path d="M 0 -39 L 0 -44" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating "Approximate" indicators: Tilde/Wave symbols and uncertainty sparkles -->
  <g stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- Tilde ~ symbol indicating 'about/roughly' -->
    <path d="M 68 85 C 73 78, 83 78, 88 85 C 93 92, 103 92, 108 85" filter="url(#shadow)"/>
    <path d="M 132 85 C 137 78, 147 78, 152 85 C 157 92, 167 92, 172 85" filter="url(#shadow)"/>
  </g>

  <!-- Dynamic floating dots / calculation particles (representing vague timeframe) -->
  <circle cx="80" cy="130" r="4" fill="#38bdf8" />
  <circle cx="160" cy="135" r="5" fill="#f43f5e" />
  <circle cx="150" cy="80" r="3" fill="#10b981" />
  <circle cx="95" cy="70" r="2.5" fill="#fbbf24" />

  <!-- Stylized magnifying glass scanning back and forth (idea of estimating/checking) -->
  <g transform="translate(75, 145) rotate(-15)" filter="url(#shadow)">
    <!-- Handle -->
    <rect x="-3" y="15" width="6" height="25" rx="3" fill="#64748b" transform="rotate(45 0 15)"/>
    <!-- Glass Rim -->
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.15"/>
    <!-- Reflection highlight on lens -->
    <path d="M -8 -8 C -4 -12 4 -12 8 -8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Sparkles for visual charm and action-packed feel -->
  <path d="M 45 60 L 48 50 L 58 47 L 48 44 L 45 34 L 42 44 L 32 47 L 42 50 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 195 90 L 197 83 L 204 81 L 197 79 L 195 72 L 193 79 L 186 81 L 193 83 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 60 175 L 62 170 L 67 168 L 62 166 L 60 161 L 58 166 L 53 168 L 58 170 Z" fill="#f43f5e" opacity="0.7"/>

  <!-- Foreground Vignette overlay for depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15"/>
</svg>