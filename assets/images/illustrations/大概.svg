<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>
  
  <!-- Desk surface -->
  <path d="M 30 135 L 170 135 L 160 148 L 40 148 Z" fill="#334155" />
  <rect x="35" y="148" width="130" height="6" rx="3" fill="#0f172a" />
  
  <!-- Modern Wall Clock representing approx time -->
  <circle cx="100" cy="75" r="42" fill="#334155" stroke="#475569" stroke-width="4"/>
  <circle cx="100" cy="75" r="37" fill="#0f172a"/>
  
  <!-- Clock ticks -->
  <line x1="100" y1="41" x2="100" y2="45" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="105" x2="100" y2="109" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="75" x2="70" y2="75" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="75" x2="134" y2="75" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Clock Hands (Showing "around 10 minutes" concept - slightly offset) -->
  <line x1="100" y1="75" x2="100" y2="55" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="75" x2="120" y2="65" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="75" r="4" fill="#f8fafc"/>

  <!-- Approximate / Estimation Indicator (Wavy motion/about symbol floating above clock) -->
  <path d="M 80 25 C 87 20, 93 30, 100 25 C 107 20, 113 30, 120 25" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 83 19 C 90 14, 96 24, 103 19 C 110 14, 116 24, 123 19" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Coffee Mug representing waiting/time passing -->
  <path d="M 125 110 L 155 110 C 157 110, 158 112, 157 114 L 149 130 C 148 132, 146 133, 144 133 L 130 133 C 128 133, 126 132, 125 130 L 123 114 C 123 112, 123 110, 125 110 Z" fill="#fb923c"/>
  <path d="M 154 116 C 160 116, 163 119, 163 123 C 163 126, 160 129, 154 129" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Steam from mug (approximate/soft shapes) -->
  <path d="M 133 100 C 131 95, 137 90, 135 85" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 145 102 C 147 97, 141 92, 143 87" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>