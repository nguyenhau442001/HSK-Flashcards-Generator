<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark mode container background -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Subtle floor shadow / stage -->
  <ellipse cx="100" cy="155" rx="55" ry="6" fill="#0f172a" opacity="0.6"/>

  <!-- Motion lines / flow representation for 'action/movement' -->
  <path d="M 65 70 Q 100 45 135 70" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.7"/>
  <path d="M 50 95 Q 100 65 150 95" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- Stylized dynamic human silhouette demonstrating a graceful dance pose / action (动作为跳舞/体操) -->
  <g transform="translate(0, 5)">
    <!-- Back arm/leg layer for depth -->
    <path d="M 100 75 L 125 95 L 140 85" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 115 L 115 130 L 95 140" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Torso -->
    <path d="M 95 65 L 105 115 L 90 120 L 85 70 Z" fill="#38bdf8"/>

    <!-- Front leg -->
    <path d="M 90 120 L 70 145 L 60 135" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Front arm -->
    <path d="M 98 75 L 75 90 L 65 80" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Head -->
    <circle cx="103" cy="50" r="11" fill="#f59e0b"/>
  </g>

  <!-- Accent sparkles to indicate precision and fluidity of movement -->
  <path d="M 135 55 L 138 62 L 145 65 L 138 68 L 135 75 L 132 68 L 125 65 L 132 62 Z" fill="#f59e0b"/>
  <path d="M 55 105 L 57 110 L 62 112 L 57 114 L 55 119 L 53 114 L 48 112 L 53 110 Z" fill="#38bdf8"/>
</svg>