<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Police Station Counter -->
  <path d="M20 160h200v50c0 5-5 10-10 10H30c-5 0-10-5-10-10V160z" fill="#334155"/>
  <rect x="20" y="150" width="200" height="10" fill="#475569"/>
  
  <!-- Officer -->
  <circle cx="180" cy="130" r="15" fill="#cbd5e1"/>
  <path d="M165 145h30v40h-30z" fill="#1e40af"/>
  <path d="M170 145l-5 15h40l-5-15z" fill="#1e3a8a"/>
  
  <!-- Character (The person who lost the wallet) -->
  <g transform="translate(60, 110)">
    <circle cx="20" cy="20" r="18" fill="#fde68a"/>
    <path d="M5 35c0-10 5-15 15-15s15 5 15 15" stroke="#92400e" stroke-width="2" fill="none"/>
    <path d="M10 45h20v20h-20z" fill="#fb923c"/>
    <path d="M5 65l5 40h10l5-40" fill="#38bdf8"/>
    <path d="M25 65l5 40h10l5-40" fill="#38bdf8"/>
    <!-- Hands gesturing -->
    <circle cx="45" cy="80" r="6" fill="#fde68a"/>
  </g>
  
  <!-- Lost Wallet Icon (on counter) -->
  <rect x="110" y="155" width="20" height="12" rx="2" fill="#92400e"/>
  <path d="M110 158h20" stroke="#f59e0b" stroke-width="1"/>
  
  <!-- Background Details -->
  <rect x="40" y="80" width="60" height="40" rx="4" fill="#334155"/>
  <circle cx="70" cy="100" r="10" fill="#475569"/>
  <path d="M50 110h40" stroke="#10b981" stroke-width="2"/>
  
  <!-- Ambient Light -->
  <circle cx="200" cy="40" r="30" fill="#f59e0b" opacity="0.1"/>
