<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Hologram/Dashboard Glow -->
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT BACKGROUND -->
  <!-- Back Wall & Architectural Lines -->
  <path d="M0 0 H240 V180 H0 Z" fill="#1e293b" />
  <path d="M0 180 H240 V240 H0 Z" fill="#0f172a" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Window with Cityscape Silhouette (Showing Professional Context) -->
  <g transform="translate(20, 25)">
    <rect width="55" height="90" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2" />
    <!-- City buildings silhouette inside window -->
    <rect x="8" y="40" width="12" height="50" fill="#1e293b" />
    <rect x="23" y="25" width="14" height="65" fill="#1e293b" />
    <rect x="40" y="50" width="10" height="40" fill="#1e293b" />
    <!-- Window Light Glow -->
    <path d="M5 5 L50 15 V85 H5 Z" fill="#38bdf8" fill-opacity="0.05" />
  </g>

  <!-- Bookshelf Background Prop -->
  <g transform="translate(175, 45)">
    <rect width="45" height="110" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="35" x2="45" y2="35" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="75" x2="45" y2="75" stroke="#334155" stroke-width="1.5" />
    <!-- Colorful books -->
    <rect x="6" y="15" width="6" height="20" rx="1" fill="#f43f5e" />
    <rect x="14" y="12" width="8" height="23" rx="1" fill="#38bdf8" />
    <rect x="25" y="18" width="5" height="17" rx="1" fill="#10b981" />
    <rect x="8" y="50" width="7" height="25" rx="1" fill="#fbbf24" />
    <rect x="17" y="53" width="6" height="22" rx="1" fill="#ec4899" />
  </g>

  <!-- DESK & FOREGROUND PROPS -->
  <!-- Wooden Desk Surface -->
  <path d="M20 180 H220 L210 215 H30 Z" fill="#334155" />
  <path d="M20 180 H220 V186 H20 Z" fill="#475569" />

  <!-- Desk Lamp -->
  <g transform="translate(190, 130)">
    <circle cx="0" cy="50" r="14" fill="#475569" />
    <path d="M0 50 C -5 20, 15 10, 25 0" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <path d="M15 -10 L35 0 L25 15 Z" fill="#fbbf24" />
  </g>

  <!-- Laptop on Desk -->
  <g transform="translate(145, 145)">
    <!-- Base -->
    <path d="M-15 35 H45 L50 42 H-20 Z" fill="#94a3b8" />
    <!-- Screen -->
    <path d="M-12 35 L-5 -5 H35 L42 35 Z" fill="#475569" />
    <path d="M-8 32 L-2 0 H30 L36 32 Z" fill="#0f172a" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(50, 155)">
    <rect x="0" y="5" width="14" height="20" rx="2" fill="#f8fafc" />
    <path d="M14 9 C 20 9, 20 20, 14 21" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <path d="M4 2 L6 -2 H10 L12 2" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- CENTRAL NARRATIVE ELEMENT: THE HOLOGRAPHIC ACHIEVEMENT DISPLAY ("MANIFESTING ABILITY") -->
  <!-- Represents the concrete output/result showcasing capability/competence -->
  <g transform="translate(95, 75)" filter="url(#softShadow)">
    <!-- Hologram Projector Base -->
    <ellipse cx="25" cy="95" rx="22" ry="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M15 95 L5 105 H45 L35 95 Z" fill="#334155" />
    
    <!-- Holographic Screen Area -->
    <path d="M-15 10 L65 10 L50 85 H0 Z" fill="url(#holoGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Hologram Graph & Skill Visualizers (Showing "Capability" / Nengli) -->
    <path d="M5 65 L20 40 L35 50 L50 25" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Data Points on Graph -->
    <circle cx="5" cy="65" r="3" fill="#10b981" />
    <circle cx="20" cy="40" r="3" fill="#10b981" />
    <circle cx="35" cy="50" r="3" fill="#38bdf8" />
    <circle cx="50" cy="25" r="4" fill="#fbbf24" />

    <!-- Mini Progress Bars inside Hologram -->
    <rect x="10" y="70" width="35" height="4" rx="2" fill="#0f172a" opacity="0.6" />
    <rect x="10" y="70" width="28" height="4" rx="2" fill="#10b981" />
  </g>

  <!-- MAIN CHARACTER (Professional, confident, pointing proudly at the result) -->
  <g transform="translate(65, 90)">
    <!-- Body / Torso -->
    <path d="M 30 55 C 20 55, 10 65, 5 95 H 65 C 60 65, 50 55, 40 55 Z" fill="url(#shirtGrad)" />
    <!-- Collar & Tie Details -->
    <path d="M 30 55 L 35 68 L 30 75 L 25 68 Z" fill="#f8fafc" />
    <path d="M 30 68 L 32 88 L 30 92 L 28 88 Z" fill="#f43f5e" />

    <!-- Neck -->
    <rect x="24" y="44" width="12" height="14" rx="4" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="30" cy="30" r="18" fill="#fbcfe8" />
    
    <!-- Hair (Stylized modern neat cut) -->
    <path d="M 12 30 C 12 15, 22 12, 32 12 C 43 12, 48 18, 48 30 C 48 32, 46 32, 46 28 C 46 18, 40 15, 31 15 C 20 15, 15 20, 14 32 C 14 34, 12 34, 12 30 Z" fill="#1e293b" />

    <!-- Confident facial expression -->
    <!-- Smiling open mouth -->
    <path d="M 24 36 C 26 39, 34 39, 36 36 Z" fill="#be123c" />
    <!-- Friendly confident eyes -->
    <path d="M 20 27 Q 23 24 26 27" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 34 27 Q 37 24 40 27" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Cheeks -->
    <circle cx="19" cy="31" r="3" fill="#f43f5e" opacity="0.3" />
    <circle cx="41" cy="31" r="3" fill="#f43f5e" opacity="0.3" />

    <!-- Back Arm (Holding coffee or resting) -->
    <path d="M 10 60 C 0 70, -5 85, -2 95" fill="none" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
    <circle cx="-2" cy="95" r="5" fill="#fbcfe8" />

    <!-- Front Arm (Pointing dynamically toward the holographic achievement display) -->
    <!-- Shoulder to Elbow -->
    <path d="M 50 60 L 68 70" fill="none" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
    <!-- Elbow to Hand pointing -->
    <path d="M 68 70 L 90 55" fill="none" stroke="#4f46e5" stroke-width="9" stroke-linecap="round" />
    <!-- Hand / Pointing Finger -->
    <circle cx="93" cy="53" r="5" fill="#fbcfe8" />
    <path d="M 95 50 L 105 47 L 97 55 Z" fill="#fbcfe8" />
  </g>

  <!-- LIGHTING & ATMOSPHERE EFFECTS -->
  <!-- Ambient rim light over character from lamp & hologram -->
  <path d="M 110 110 C 115 130, 110 150, 100 170" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" filter="url(#softShadow)" />
  <circle cx="120" cy="115" r="45" fill="url(#lampGlow)" pointer-events="none" />

  <!-- Sparkling success particles (visualizing capability/achievement) -->
  <g fill="#fbbf24">
    <circle cx="160" cy="80" r="2" />
    <circle cx="175" cy="65" r="1.5" />
    <circle cx="145" cy="50" r="2.5" />
    <circle cx="130" cy="90" r="1" />
  </g>
  <g fill="#38bdf8">
    <circle cx="150" cy="100" r="2" />
    <circle cx="168" cy="115" r="1.5" />
  </g>
</svg>