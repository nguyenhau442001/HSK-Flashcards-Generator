<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Map Glow Gradient -->
    <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Spotlight -->
    <radialGradient id="spotlight" cx="60%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip Path for Card Container -->
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Canvas Background -->
    <rect width="240" height="240" fill="url(#bgGrad)"/>
    <rect width="240" height="240" fill="url(#spotlight)"/>

    <!-- ENVIRONMENT & PROPS: Room Background & Travel Desk -->
    <!-- Window with City/Nature Silhouette -->
    <g transform="translate(14, 15)">
      <rect x="0" y="0" width="60" height="75" rx="4" fill="#1b2a4a" opacity="0.6"/>
      <!-- Window panes -->
      <line x1="30" y1="0" x2="30" y2="75" stroke="#0f172a" stroke-width="2"/>
      <line x1="0" y1="37" x2="60" y2="37" stroke="#0f172a" stroke-width="2"/>
      <!-- Mountains/Scenery outside -->
      <path d="M5 75 L15 55 L25 68 L42 45 L55 75 Z" fill="#38bdf8" opacity="0.2"/>
      <circle cx="48" cy="22" r="6" fill="#fbbf24" opacity="0.4"/>
    </g>

    <!-- Bookshelf / Plant on wall -->
    <path d="M190 25 L225 25 L220 55 L195 55 Z" fill="#334155" opacity="0.7"/>
    <path d="M200 15 Q210 5 220 15 L215 25 L205 25 Z" fill="#10b981"/>

    <!-- Desk / Table Surface -->
    <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="#0f172a"/>
    <path d="M0 175 L240 175 L240 182 L0 182 Z" fill="#334155"/>

    <!-- PROPS ON DESK: Globe, Souvenirs, Passport -->
    <!-- Globe -->
    <g transform="translate(195, 130)">
      <circle cx="15" cy="15" r="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <!-- Globe stand -->
      <path d="M15 31 L15 38 M10 38 L20 38" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <path d="M5 15 C5 8 25 8 25 15" fill="none" stroke="#64748b" stroke-width="2"/>
      <!-- Continents graphic -->
      <path d="M8 12 Q12 8 18 10 T20 20 Q15 22 10 18 Z" fill="#38bdf8" opacity="0.5"/>
    </g>

    <!-- Travel Souvenir / Camera -->
    <g transform="translate(165, 145)">
      <rect x="0" y="6" width="22" height="16" rx="3" fill="#cbd5e1"/>
      <circle cx="11" cy="14" r="5" fill="#0f172a"/>
      <circle cx="11" cy="14" r="3" fill="#38bdf8"/>
      <rect x="6" y="2" width="10" height="4" rx="1" fill="#94a3b8"/>
    </g>

    <!-- Passport & Ticket -->
    <g transform="translate(25, 160) rotate(-10)">
      <rect x="0" y="0" width="26" height="34" rx="2" fill="#b91c1c"/>
      <rect x="3" y="4" width="20" height="2" fill="#fbbf24" opacity="0.8"/>
      <circle cx="13" cy="18" r="5" fill="#fbbf24" opacity="0.8"/>
    </g>
    <g transform="translate(42, 155) rotate(5)">
      <rect x="0" y="0" width="35" height="22" rx="2" fill="#f8fafc"/>
      <line x1="5" y1="6" x2="20" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="12" x2="30" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <circle cx="27" cy="17" r="3" fill="#10b981"/>
    </g>

    <!-- BACKGROUND MAP GRAPHIC (Connecting "from" to "here") -->
    <g transform="translate(120, 95)">
      <!-- Map glow circle -->
      <circle cx="0" cy="0" r="65" fill="url(#mapGlow)"/>
      
      <!-- Dotted Arc Trajectory (Indicating "Coming from") -->
      <path d="M -50,30 Q -10,-20 45,-5" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.8"/>
      
      <!-- Origin Pin (Far away) -->
      <g transform="translate(-50, 30)">
        <circle cx="0" cy="0" r="4" fill="#fb923c"/>
        <circle cx="0" cy="0" r="8" fill="none" stroke="#fb923c" stroke-width="1.5" opacity="0.6"/>
      </g>

      <!-- Destination Pin (Current Location) -->
      <g transform="translate(45, -5)">
        <path d="M0 0 C-4 -6 -6 -10 -6 -14 C-6 -19 -2 -22 0 -22 C2 -22 6 -19 6 -14 C6 -10 4 -6 0 0 Z" fill="#ef4444"/>
        <circle cx="0" cy="-14" r="2.5" fill="#fff"/>
        <!-- Pulse ring -->
        <ellipse cx="0" cy="2" rx="6" ry="2" fill="#38bdf8" opacity="0.6"/>
      </g>
    </g>

    <!-- MAIN SUBJECT: Traveler / International Friend arriving dynamically -->
    <!-- Shadow beneath character -->
    <ellipse cx="110" cy="182" rx="35" ry="8" fill="#020617" opacity="0.5"/>

    <!-- CHARACTER GROUP -->
    <g transform="translate(85, 82)">
      <!-- Back Leg (Stepping forward) -->
      <path d="M25 65 L10 88 L0 92" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25 65 L10 88 L0 92" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Shoe -->
      <path d="M-5 95 L5 95 L12 90 L-2 90 Z" fill="#0f172a"/>

      <!-- Front Leg -->
      <path d="M35 65 L48 85 L58 96" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M35 65 L48 85 L58 96" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Shoe -->
      <path d="M52 98 L65 98 L68 93 L50 93 Z" fill="#0f172a"/>

      <!-- Torso & Backpack (Traveler theme) -->
      <!-- Backpack -->
      <path d="M12 18 C8 18 5 22 5 35 C5 48 8 55 12 58 L18 58 C22 55 25 48 25 35 C25 22 22 18 18 18 Z" fill="#fb923c"/>
      <path d="M10 28 L20 28" stroke="#ea580c" stroke-width="3"/>
      <path d="M12 45 L18 45" stroke="#ea580c" stroke-width="3"/>
      <!-- Backpack Straps -->
      <path d="M15 20 L28 32" stroke="#ea580c" stroke-width="3"/>

      <!-- Jacket / Torso -->
      <path d="M22 20 C22 20 40 22 42 38 C44 55 38 72 38 72 L22 72 C22 72 26 50 24 38 Z" fill="#3b82f6"/>
      <!-- Inner Shirt / Zipper -->
      <line x1="32" y1="25" x2="32" y2="65" stroke="#1d4ed8" stroke-width="2"/>
      <path d="M28 25 L36 25 L34 35 L30 35 Z" fill="#f8fafc"/> <!-- Collar -->

      <!-- Left Arm (Waving / Greeting gesture) -->
      <path d="M25 28 Q10 20 8 35 T15 50" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="15" cy="51" r="5" fill="#fcd34d"/>

      <!-- Right Arm (Holding luggage handle / Active pose) -->
      <path d="M38 28 Q52 35 50 50 L48 65" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="48" cy="67" r="5" fill="#fcd34d"/>

      <!-- Luggage / Trolley Bag (Prop emphasizing "coming from afar") -->
      <g transform="translate(42, 60)">
        <rect x="0" y="10" width="22" height="28" rx="4" fill="#10b981"/>
        <rect x="2" y="14" width="18" height="20" rx="2" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="3,3"/>
        <!-- Handle & Telescopic rod -->
        <path d="M8 10 L8 2" stroke="#94a3b8" stroke-width="2"/>
        <path d="M14 10 L14 2" stroke="#94a3b8" stroke-width="2"/>
        <rect x="7" y="0" width="8" height="3" rx="1" fill="#64748b"/>
        <!-- Wheels -->
        <circle cx="5" cy="40" r="3" fill="#0f172a"/>
        <circle cx="17" cy="40" r="3" fill="#0f172a"/>
      </g>

      <!-- Neck -->
      <rect x="30" y="14" width="6" height="8" fill="#fcd34d"/>

      <!-- Head & Face -->
      <circle cx="33" cy="8" r="15" fill="#fcd34d"/>
      
      <!-- Hair (Stylized modern cut) -->
      <path d="M18 5 C22 -2 42 -2 46 6 C42 4 38 2 33 2 C25 2 21 3 18 5 Z" fill="#1e293b"/>
      
      <!-- Friendly Expression (Smiling eyes & open smile) -->
      <!-- Happy curved eyes -->
      <path d="M26 8 C27 6 29 6 30 8" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M36 8 C37 6 39 6 40 8" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Cheeks -->
      <circle cx="25" cy="11" r="2.5" fill="#f87171" opacity="0.6"/>
      <circle cx="41" cy="11" r="2.5" fill="#f87171" opacity="0.6"/>
      
      <!-- Smile -->
      <path d="M29 13 Q33 17 37 13" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- FOREGROUND ATMOSPHERIC DETAILS -->
    <!-- Floating Sparkles / Motion lines reinforcing action and arrival -->
    <g transform="translate(140, 50)">
      <path d="M0 0 L6 6 M6 0 L0 6" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(60, 40)">
      <path d="M0 0 L8 8 M8 0 L0 8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <circle cx="120" cy="45" r="2" fill="#fbbf24"/>
    <circle cx="150" cy="75" r="1.5" fill="#38bdf8"/>
    <circle cx="75" cy="70" r="2" fill="#10b981"/>

    <!-- Dynamic Speed/Motion lines near the arriving traveler -->
    <path d="M65 110 L75 115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M60 125 L72 130" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>