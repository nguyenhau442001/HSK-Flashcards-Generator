<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Amber Effect -->
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Roast Duck Skin Gradient -->
    <linearGradient id="duckSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Golden Crispy Highlight -->
    <linearGradient id="crispyHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>

    <!-- Steamed Pancake Gradient -->
    <linearGradient id="pancakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Hoisin Sauce Gradient -->
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#180b02"/>
    </linearGradient>

    <!-- Ceramic Bowl Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow & Tabletop Surface -->
  <circle cx="120" cy="140" r="100" fill="url(#tableGlow)"/>
  
  <!-- Wooden Table Surface -->
  <ellipse cx="120" cy="165" rx="95" ry="45" fill="#090d16" opacity="0.8"/>
  <ellipse cx="120" cy="160" rx="90" ry="40" fill="#33180c"/>
  <ellipse cx="120" cy="158" rx="86" ry="37" fill="#45220f"/>

  <!-- Bamboo Steamer / Plate underneath -->
  <ellipse cx="120" cy="140" rx="75" ry="28" fill="#78350f" opacity="0.6"/>
  <ellipse cx="120" cy="137" rx="73" ry="26" fill="#fef3c7" opacity="0.1"/>

  <!-- BACKGROUND PROPS: Scallions & Cucumber in a small dish -->
  <g transform="translate(180, 110)">
    <!-- Small Dish -->
    <ellipse cx="0" cy="15" rx="20" ry="10" fill="#334155"/>
    <ellipse cx="0" cy="13" rx="18" ry="8" fill="url(#bowlGrad)"/>
    <!-- Cucumber strips & Scallions -->
    <path d="M-8 8 L-12 0 M-4 10 L-6 1 M0 7 L2 -2 M5 9 L10 2" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-2 8 L-3 2 M3 7 L7 -1" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- BACKGROUND PROPS: Hoisin Sauce Bowl with Spoon -->
  <g transform="translate(55, 115)">
    <!-- Small Sauce Bowl -->
    <ellipse cx="0" cy="15" rx="22" ry="11" fill="#334155"/>
    <ellipse cx="0" cy="13" rx="20" ry="9" fill="url(#bowlGrad)"/>
    <!-- Dark Sauce -->
    <ellipse cx="0" cy="14" rx="16" ry="7" fill="url(#sauceGrad)"/>
    <ellipse cx="-4" cy="12" rx="6" ry="3" fill="#78350f" opacity="0.4"/>
  </g>

  <!-- MAIN SUBJECT: Peking Duck Platter -->
  <!-- Whole Roasted Duck Body (Stylized Artistic Interpretation) -->
  <g transform="translate(120, 125)">
    <!-- Duck Platter Base (Large Oval Plate) -->
    <ellipse cx="0" cy="18" rx="68" ry="32" fill="#1e293b" opacity="0.5"/>
    <ellipse cx="0" cy="15" rx="65" ry="30" fill="#f8fafc"/>
    <ellipse cx="0" cy="17" rx="61" ry="27" fill="#e2e8f0"/>

    <!-- Carved Crispy Duck Slices (Layered beautifully) -->
    <!-- Back layer of meat -->
    <path d="M-45 10 C-45 -5 -25 -15 0 -15 C25 -15 45 -5 45 10 C45 22 25 30 0 30 C-25 30 -45 22 -45 10 Z" fill="url(#duckSkin)"/>
    
    <!-- Individual Crispy Slices (overlapping) -->
    <!-- Slice 1 (Left) -->
    <path d="M-35 5 C-40 -2 -30 -12 -15 -10 C-25 0 -30 12 -35 5 Z" fill="url(#duckSkin)"/>
    <path d="M-33 4 C-37 -1 -28 -10 -16 -8 C-24 -1 -28 10 -33 4 Z" fill="url(#crispyHighlight)"/>

    <!-- Slice 2 (Center-Left) -->
    <path d="M-20 -5 C-25 -18 -5 -22 8 -15 C-5 -12 -15 -2 -20 -5 Z" fill="url(#duckSkin)"/>
    <path d="M-18 -6 C-22 -16 -5 -20 6 -14 C-4 -11 -13 -3 -18 -6 Z" fill="url(#crispyHighlight)"/>

    <!-- Slice 3 (Center-Right - Main Crispy Skin Showcase) -->
    <path d="M-5 -12 C5 -22 25 -18 32 -5 C18 -2 5 -12 -5 -12 Z" fill="url(#duckSkin)"/>
    <path d="M-3 -11 C6 -20 22 -17 29 -6 C17 -3 4 -11 -3 -11 Z" fill="url(#crispyHighlight)"/>

    <!-- Slice 4 (Right) -->
    <path d="M20 -2 C30 -10 42 2 38 15 C32 10 30 -2 20 -2 Z" fill="url(#duckSkin)"/>

    <!-- Foreground Slices & Juiciness -->
    <path d="M-25 12 C-30 2 -15 -5 5 2 C-5 12 -15 18 -25 12 Z" fill="url(#duckSkin)"/>
    <path d="M-23 11 C-27 3 -14 -3 3 1 C-5 10 -13 16 -23 11 Z" fill="url(#crispyHighlight)"/>

    <path d="M2 15 C15 5 35 10 38 20 C25 25 10 22 2 15 Z" fill="url(#duckSkin)"/>
    <path d="M4 16 C14 7 32 11 35 19 C24 23 10 20 4 16 Z" fill="url(#crispyHighlight)"/>

    <!-- Steam/Aroma Wisps -->
    <path d="M-10 -25 C-12 -35 -2 -40 -5 -50" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M15 -22 C18 -32 10 -38 12 -48" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- FOREGROUND PROPS: Steamed Pancakes & Chopsticks -->
  <!-- Steamed Pancakes Stack (Left foreground) -->
  <g transform="translate(65, 175)">
    <!-- Pancake Plate -->
    <ellipse cx="0" cy="12" rx="30" ry="14" fill="#334155"/>
    <ellipse cx="0" cy="10" rx="28" ry="12" fill="url(#bowlGrad)"/>
    
    <!-- Folded/Stacked Pancakes -->
    <ellipse cx="0" cy="6" rx="24" ry="10" fill="url(#pancakeGrad)"/>
    <path d="M-24 6 C-15 12 15 12 24 6 C15 2 -15 2 -24 6 Z" fill="#fde68a"/>
    <ellipse cx="2" cy="2" rx="22" ry="9" fill="url(#pancakeGrad)"/>
    <path d="M-22 2 C-10 8 10 8 22 2 C12 -1 -12 -1 -22 2 Z" fill="#fef3c7"/>
  </g>

  <!-- Chopsticks (Resting diagonally across) -->
  <g transform="translate(150, 195) rotate(-15)">
    <!-- Chopstick 1 -->
    <rect x="-40" y="-4" width="90" height="3.5" rx="1.5" fill="#d97706"/>
    <rect x="-40" y="-4" width="90" height="1.5" rx="1" fill="#fbbf24"/>
    <!-- Chopstick Tip -->
    <path d="M50 -4 L58 -2.2 L50 -0.5 Z" fill="#78350f"/>

    <!-- Chopstick 2 -->
    <rect x="-35" y="3" width="85" height="3.5" rx="1.5" fill="#b45309"/>
    <rect x="-35" y="3" width="85" height="1.5" rx="1" fill="#d97706"/>
    <!-- Chopstick Tip -->
    <path d="M50 3 L57 4.7 L50 6.5 Z" fill="#78350f"/>
  </g>

  <!-- Action Sparkles / Culinary Magic Accents -->
  <g fill="#fbbf24">
    <circle cx="95" cy="75" r="2" opacity="0.8"/>
    <circle cx="155" cy="85" r="1.5" opacity="0.6"/>
    <circle cx="130" cy="65" r="2.5" opacity="0.9"/>
    <!-- Star sparkle -->
    <path d="M140 70 L142 74 L146 76 L142 78 L140 82 L138 78 L134 76 L138 74 Z" fill="#f59e0b" opacity="0.8"/>
  </g>
</svg>