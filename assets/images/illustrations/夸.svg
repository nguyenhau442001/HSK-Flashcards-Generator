<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Award Plaque/Trophy Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Podium Gradient -->
    <linearGradient id="podium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Background Environment (Office/Stage Setting) -->
  <g id="environment">
    <!-- Back wall details & banners -->
    <rect x="30" y="40" width="180" height="90" rx="6" fill="#1e293b" opacity="0.4" />
    <path d="M 60 40 L 80 80 L 100 40 Z" fill="#38bdf8" opacity="0.15" />
    <path d="M 140 40 L 160 80 L 180 40 Z" fill="#ec4899" opacity="0.15" />

    <!-- Stage floor / base -->
    <ellipse cx="120" cy="210" rx="90" ry="15" fill="#0f172a" />
    <path d="M 40 200 L 200 200 L 210 220 L 30 220 Z" fill="url(#podium)" />
    <!-- Floor reflection highlight -->
    <line x1="50" y1="205" x2="190" y2="205" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Confetti / Celebration Particles -->
  <g id="confetti" filter="url(#glow)">
    <circle cx="50" cy="70" r="3" fill="#38bdf8" />
    <rect x="180" y="60" width="5" height="5" rx="1" fill="#fbbf24" transform="rotate(25 180 60)" />
    <circle cx="195" cy="110" r="2.5" fill="#ec4899" />
    <rect x="40" y="120" width="4" height="6" rx="1" fill="#10b981" transform="rotate(-15 40 120)" />
    <path d="M 70 95 L 75 100 L 70 105 Z" fill="#fb923c" />
    <path d="M 170 140 L 174 145 L 170 150 Z" fill="#38bdf8" />
  </g>

  <!-- Supporting Character Left (Clapping/Admiration) -->
  <g id="supporter-left" transform="translate(15, 20)">
    <!-- Body & Outfit -->
    <path d="M 40 135 C 40 120 50 115 58 115 C 66 115 76 120 76 135 L 76 175 L 40 175 Z" fill="#0284c7" />
    <path d="M 58 110 C 64 110 68 105 68 98 C 68 91 64 88 58 88 C 52 88 48 91 48 98 C 48 105 52 110 58 110 Z" fill="url(#skin)" />
    <!-- Hair -->
    <path d="M 48 95 C 46 88 52 83 58 83 C 64 83 70 88 68 96 C 65 92 51 92 48 95 Z" fill="#334155" />
    <!-- Clapping Hands -->
    <circle cx="58" cy="125" r="8" fill="url(#skin)" />
    <!-- Happy Expression -->
    <path d="M 54 99 Q 58 103 62 99" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Supporting Character Right (Smiling/Thumbs Up) -->
  <g id="supporter-right" transform="translate(155, 20)">
    <!-- Body & Outfit -->
    <path d="M 35 135 C 35 120 45 115 53 115 C 61 115 71 120 71 135 L 71 175 L 35 175 Z" fill="#0d9488" />
    <path d="M 53 110 C 59 110 63 105 63 98 C 63 91 59 88 53 88 C 47 88 43 91 43 98 C 43 105 47 110 53 110 Z" fill="url(#skin)" />
    <!-- Hair -->
    <path d="M 43 96 C 45 87 61 87 63 96 C 60 90 46 90 43 96 Z" fill="#b45309" />
    <!-- Arm raising in praise -->
    <path d="M 35 125 C 25 120 20 110 25 105 C 30 100 38 115 42 120 Z" fill="url(#skin)" />
    <!-- Happy Expression -->
    <path d="M 49 99 Q 53 103 57 99" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER (The Proud/Praised Person: Confident posture, holding award) -->
  <g id="main-character" transform="translate(75, 25)">
    <!-- Legs & Shoes -->
    <rect x="38" y="145" width="10" height="35" rx="3" fill="#1e293b" />
    <rect x="52" y="145" width="10" height="35" rx="3" fill="#1e293b" />
    <ellipse cx="43" cy="180" rx="7" ry="3" fill="#0f172a" />
    <ellipse cx="57" cy="180" rx="7" ry="3" fill="#0f172a" />

    <!-- Torso / Stylish Outfit (Orange/Warm jacket) -->
    <path d="M 32 95 L 68 95 L 75 145 L 25 145 Z" fill="#f97316" />
    <path d="M 50 95 L 50 145" stroke="#ea580c" stroke-width="2" />
    <!-- Inner Shirt Collar -->
    <path d="M 42 95 L 50 105 L 58 95 Z" fill="#ffffff" />

    <!-- Head & Neck -->
    <rect x="46" y="80" width="8" height="18" fill="url(#skin)" />
    <circle cx="50" cy="70" r="18" fill="url(#skin)" />

    <!-- Dynamic Hair (Confident spiked/styled hair) -->
    <path d="M 33 70 C 33 55 45 50 52 50 C 62 50 68 56 67 65 C 72 65 70 75 65 78 C 65 70 60 60 52 60 C 44 60 38 65 33 70 Z" fill="#1e293b" />

    <!-- Proud/Happy Facial Expression -->
    <!-- Eyes (Happy closed curves or bright arcs) -->
    <path d="M 42 67 Q 45 63 48 67" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 52 67 Q 55 63 58 67" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="41" cy="73" r="3" fill="#ec4899" opacity="0.4" />
    <circle cx="59" cy="73" r="3" fill="#ec4899" opacity="0.4" />
    <!-- Confident Big Smile -->
    <path d="M 44 74 Q 50 81 56 74" stroke="#1e293b" stroke-width="2" fill="#ef4444" stroke-linejoin="round" />

    <!-- Arms & Interaction: Lifting up a Golden Trophy/Plaque proudly -->
    <!-- Left arm raised proudly -->
    <path d="M 32 100 C 18 100 15 85 22 75 C 28 70 35 85 38 95 Z" fill="url(#skin)" />
    <!-- Right arm supporting trophy -->
    <path d="M 68 100 C 82 100 85 85 78 75 C 72 70 65 85 62 95 Z" fill="url(#skin)" />

    <!-- TROPHY / AWARD PROP (Symbol of being praised/accomplishment) -->
    <g id="trophy" transform="translate(36, 40)">
      <!-- Trophy Base -->
      <path d="M 11 38 L 17 38 L 15 45 L 13 45 Z" fill="#64748b" />
      <rect x="9" y="45" width="10" height="4" rx="1" fill="#334155" />
      <!-- Trophy Cup -->
      <path d="M 8 15 C 8 28 20 28 20 28 C 20 28 32 28 32 15 C 32 10 28 10 20 10 C 12 10 8 10 8 15 Z" fill="url(#gold)" />
      <!-- Trophy Stem -->
      <rect x="18" y="28" width="4" height="10" fill="url(#gold)" />
      <!-- Handles -->
      <path d="M 10 14 C 4 14 4 22 10 24" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M 30 14 C 36 14 36 22 30 24" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Star on Trophy -->
      <path d="M 20 16 L 21.5 19 L 25 19.5 L 22.5 22 L 23 25.5 L 20 24 L 17 25.5 L 17.5 22 L 15 19.5 L 18.5 19 Z" fill="#ffffff" opacity="0.8" />
    </g>
  </g>

  <!-- Sparkles / Praise Aura Effect around the main subject -->
  <g id="praise-sparkles" filter="url(#glow)">
    <!-- Top Sparkle -->
    <path d="M 120 40 L 122 47 L 129 49 L 122 51 L 120 58 L 118 51 L 111 49 L 118 47 Z" fill="#fbbf24" />
    <!-- Left Sparkle -->
    <path d="M 85 90 L 86 94 L 90 95 L 86 96 L 85 100 L 84 96 L 80 95 L 84 94 Z" fill="#38bdf8" />
    <!-- Right Sparkle -->
    <path d="M 155 80 L 156 84 L 160 85 L 156 86 L 155 90 L 154 86 L 150 85 L 154 84 Z" fill="#ec4899" />
  </g>
</svg>