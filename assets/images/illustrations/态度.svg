<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#1e293b" opacity="0.5"/>
  
  <!-- Character: A helpful service person/waiter leaning forward with a positive posture -->
  <g transform="translate(60, 40)">
    <!-- Body -->
    <path d="M40 160 L80 160 L75 100 L45 100 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="70" r="30" fill="#fde68a"/>
    <!-- Friendly Face -->
    <path d="M45 65 Q50 75 55 65" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M65 65 Q70 75 75 65" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M50 85 Q60 95 70 85" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Arm reaching out -->
    <path d="M80 120 L110 100" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Object: A tray with a steaming cup representing service/attitude -->
  <g transform="translate(140, 130)">
    <rect x="0" y="0" width="50" height="10" rx="2" fill="#fb923c"/>
    <circle cx="25" cy="-25" r="20" fill="#ffffff"/>
    <path d="M20 -40 Q25 -50 30 -40" stroke="#fbbf24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Sparkles for positive vibe -->
  <circle cx="180" cy="60" r="4" fill="#fbbf24"/>
  <circle cx="200" cy="80" r="3" fill="#10b981"/>
  <circle cx="190" cy="40" r="2" fill="#ec4899"/>
</svg>