<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  
  <!-- Stars -->
  <circle cx="40" cy="40" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="200" cy="30" r="1.2" fill="#94a3b8" opacity="0.8"/>
  <circle cx="220" cy="80" r="0.8" fill="#94a3b8" opacity="0.5"/>
  <circle cx="30" cy="100" r="1" fill="#94a3b8" opacity="0.7"/>

  <!-- Ground -->
  <path d="M0 210 Q120 205 240 210 L240 240 L0 240 Z" fill="#0f172a"/>
  <rect x="0" y="215" width="240" height="25" fill="#1e293b" opacity="0.5"/>

  <!-- Building Structure (4 Floors) -->
  <rect x="65" y="40" width="110" height="175" rx="4" fill="#334155"/>
  <rect x="60" y="210" width="120" height="5" fill="#475569"/>
  
  <!-- Floor Separators (Subtle) -->
  <line x1="65" y1="85" x2="175" y2="85" stroke="#1e293b" stroke-width="2"/>
  <line x1="65" y1="130" x2="175" y2="130" stroke="#1e293b" stroke-width="2"/>
  <line x1="65" y1="175" x2="175" y2="175" stroke="#1e293b" stroke-width="2"/>

  <!-- Ground Floor (Entrance) -->
  <rect x="105" y="185" width="30" height="25" rx="2" fill="#1e293b"/>
  <circle cx="130" cy="198" r="1.5" fill="#fbbf24"/>
  <rect x="75" y="185" width="20" height="20" rx="2" fill="#475569"/>

  <!-- First Floor (Tầng Một) -->
  <rect x="80" y="140" width="30" height="25" rx="2" fill="#1e293b"/>
  <rect x="130" y="140" width="30" height="25" rx="2" fill="url(#windowGlow)" opacity="0.3"/>
  <path d="M135 165 Q145 155 155 165" fill="none" stroke="#10b981" stroke-width="2"/> <!-- Plant silhouette -->

  <!-- Second Floor (Tầng Hai) -->
  <rect x="80" y="95" width="30" height="25" rx="2" fill="url(#windowGlow)"/>
  <rect x="130" y="95" width="30" height="25" rx="2" fill="#1e293b"/>
  <!-- Balcony -->
  <rect x="125" y="115" width="40" height="4" fill="#64748b"/>
  <path d="M125 105 L125 115 M135 105 L135 115 M145 105 L145 115 M155 105 L155 115 M165 105 L165 115" stroke="#94a3b8" stroke-width="1"/>
  <rect x="125" y="105" width="40" height="2" fill="#94a3b8"/>

  <!-- Third Floor (Tầng Ba - Focus) -->
  <rect x="80" y="50" width="30" height="25" rx="2" fill="url(#windowGlow)"/>
  <rect x="130" y="50" width="30" height="25" rx="2" fill="url(#windowGlow)"/>
  <!-- Silhouette in window -->
  <circle cx="95" cy="58" r="4" fill="#78350f" opacity="0.6"/>
  <rect x="90" y="62" width="10" height="8" rx="2" fill="#78350f" opacity="0.6"/>
  
  <!-- Street Details -->
  <!-- Street Lamp -->
  <rect x="30" y="140" width="4" height="75" fill="#475569"/>
  <circle cx="32" cy="140" r="8" fill="#fbbf24" opacity="0.2"/>
  <circle cx="32" cy="140" r="4" fill="#fbbf24"/>
  
  <!-- Delivery Scooter (Action Element) -->
  <g transform="translate(190, 205)">
    <rect x="0" y="0" width="25" height="10" rx="4" fill="#ec4899"/>
    <circle cx="5" cy="12" r="4" fill="#334155"/>
    <circle cx="20" cy="12" r="4" fill="#334155"/>
    <rect x="18" y="-8" width="10" height="10" rx="1" fill="#fb923c"/> <!-- Delivery box -->
    <path d="M5 0 L10 -10 L15 0" fill="none" stroke="#ec4899" stroke-width="2"/>
  </g>

  <!-- Tree -->
  <rect x="205" y="180" width="6" height="35" fill="#78350f"/>
  <circle cx="208" cy="175" r="15" fill="#10b981" opacity="0.8"/>
  <circle cx="218" cy="185" r="12" fill="#059669" opacity="0.8"/>
  <circle cx="198" cy="185" r="10" fill="#059669" opacity="0.8"/>

  <!-- Light spill on ground -->
  <ellipse cx="32" cy="215" rx="25" ry="5" fill="#fbbf24" opacity="0.1"/>
  <ellipse cx="120" cy="215" rx="40" ry="4" fill="#fbbf24" opacity="0.05"/>
</svg>