<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Amber Glow for 'Condition/If' Metaphor -->
    <radialGradient id="amberGlow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Rain / Cloud Gradient -->
    <linearGradient id="rainCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Park Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Path Gradient -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#amberGlow)" />

  <!-- SCENE BACKGROUND: Park Environment -->
  <!-- Distant Hills / Trees -->
  <path d="M0 150 Q40 130 90 145 T190 135 T240 142 L240 180 L0 180 Z" fill="#065f46" opacity="0.6" />
  
  <!-- Park Ground -->
  <path d="M0 165 C60 150 180 150 240 165 L240 220 C240 231 231 240 220 240 L20 240 C9 240 0 231 0 220 Z" fill="url(#groundGrad)" />

  <!-- Winding Park Path (Destination: Park) -->
  <path d="M120 165 C120 190 150 210 180 240 L140 240 C120 215 100 195 90 165 Z" fill="url(#pathGrad)" opacity="0.4" />

  <!-- Park Bench -->
  <g transform="translate(145, 175)">
    <rect x="0" y="8" width="35" height="4" rx="2" fill="#b45309" />
    <rect x="0" y="14" width="35" height="4" rx="2" fill="#b45309" />
    <rect x="3" y="4" width="4" height="18" fill="#78350f" />
    <rect x="28" y="4" width="4" height="18" fill="#78350f" />
    <path d="M6 4 L6 0 L29 0 L29 4" stroke="#78350f" stroke-width="2" fill="none" />
  </g>

  <!-- Park Tree -->
  <g transform="translate(190, 110)">
    <rect x="10" y="30" width="8" height="35" fill="#78350f" />
    <circle cx="14" cy="20" r="22" fill="#047857" />
    <circle cx="26" cy="28" r="16" fill="#065f46" />
    <circle cx="2" cy="28" r="16" fill="#059669" />
  </g>

  <!-- WEATHER CONDITION METAPHOR: Split Sky (Rain vs. Sun/Park) -->
  <!-- Left Side: Dark Rain Cloud (The "If" - Negative condition) -->
  <g transform="translate(10, 15)">
    <path d="M15 25 C15 16 23 8 33 8 C40 8 46 12 49 18 C55 16 62 20 64 26 C70 28 73 35 70 41 C68 46 62 50 55 50 L20 50 C12 50 8 44 10 38 C11 32 15 27 15 25 Z" fill="url(#rainCloud)" />
    <!-- Raindrops falling -->
    <line x1="25" y1="56" x2="21" y2="66" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="40" y1="58" x2="36" y2="68" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="55" y1="54" x2="51" y2="64" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Right Side: Radiant Sun (The Result / Park) -->
  <g transform="translate(180, 20)">
    <circle cx="20" cy="20" r="14" fill="#fbbf24" />
    <!-- Sun rays -->
    <path d="M20 0 L20 -4 M20 40 L20 44 M0 20 L-4 20 M40 20 L44 20 M6 6 L3 3 M34 34 L37 37 M6 34 L3 37 M34 6 L37 3" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- DECISION / PATHWAY BRIDGE (Visualizing "If... Then...") -->
  <!-- Glowing branching indicator arrow floating in center-air -->
  <g transform="translate(85, 65)">
    <path d="M0 25 Q20 5 45 25" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-dasharray="6 4" />
    <polygon points="45,20 53,26 43,30" fill="#38bdf8" />
  </g>

  <!-- MAIN SUBJECT: Traveler / Character pausing to check weather (Making the 'If' decision) -->
  <g transform="translate(60, 115)">
    <!-- Shadow -->
    <ellipse cx="25" cy="54" rx="16" ry="5" fill="#0f172a" opacity="0.4" />

    <!-- Legs -->
    <rect x="17" y="36" width="6" height="20" rx="3" fill="#3b82f6" />
    <rect x="27" y="36" width="6" height="20" rx="3" fill="#3b82f6" />
    <!-- Shoes -->
    <path d="M14 54 C14 52 18 52 23 54 L24 57 C24 58 14 58 14 54 Z" fill="#1e293b" />
    <path d="M26 54 C26 52 30 52 35 54 L36 57 C36 58 26 58 26 54 Z" fill="#1e293b" />

    <!-- Torso / Jacket -->
    <path d="M14 16 C14 12 20 10 25 10 C30 10 36 12 36 16 L38 38 C38 40 36 41 34 41 L16 41 C14 41 12 40 12 38 Z" fill="#f43f5e" />
    <!-- Jacket Zipper Line -->
    <line x1="25" y1="12" x2="25" y2="41" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />

    <!-- Backpack -->
    <path d="M9 18 C7 18 6 20 6 23 L6 34 C6 36 8 38 11 38 L13 38 L13 18 Z" fill="#8b5cf6" />

    <!-- Head & Face -->
    <circle cx="25" cy="5" r="10" fill="#fde047" />
    <!-- Hair -->
    <path d="M15 5 C15 0 20 -2 25 -2 C30 -2 35 0 35 5 C35 7 33 5 30 3 C27 1 23 1 20 3 C17 5 15 7 15 5 Z" fill="#b45309" />

    <!-- Arm holding Umbrella (Prepared for rain) -->
    <path d="M14 18 L4 26 L8 29 L16 22" fill="#fb923c" />
    
    <!-- Arm pointing up/wondering -->
    <path d="M36 18 C40 15 43 20 40 24" fill="#fb923c" />

    <!-- Umbrella (Closed or held vertically) -->
    <g transform="translate(0, -10)">
      <line x1="2" y1="10" x2="2" y2="45" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <path d="M2 10 C-3 10 -6 18 -6 20 L10 20 C10 18 7 10 2 10 Z" fill="#10b981" />
      <path d="M-2 45 C-2 42 2 42 2 45" stroke="#10b981" stroke-width="2" fill="none" />
    </g>
  </g>

  <!-- FOREGROUND ACCENTS & VIVID ATMOSPHERE -->
  <!-- Cute little responsive weather companion (Weather Leaf/Sprite) floating -->
  <g transform="translate(115, 120)">
    <circle cx="12" cy="12" r="10" fill="#38bdf8" opacity="0.9" />
    <circle cx="9" cy="10" r="1.5" fill="#0f172a" />
    <circle cx="15" cy="10" r="1.5" fill="#0f172a" />
    <path d="M10 15 Q12 17 14 15" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Question mark floating above to emphasize condition/possibility -->
    <text x="12" y="-2" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fbbf24" text-anchor="middle">?</text>
  </g>

  <!-- Foreground Flora (Bush / Flowers framing bottom edge) -->
  <path d="M0 240 L0 215 C10 210 20 220 30 215 C40 210 50 205 60 215 L60 240 Z" fill="#047857" opacity="0.8" />
  <circle cx="20" cy="218" r="3" fill="#f43f5e" />
  <circle cx="45" cy="223" r="2.5" fill="#fbbf24" />

  <path d="M190 240 L190 220 C200 212 210 225 220 218 C225 214 235 215 240 220 L240 240 Z" fill="#047857" opacity="0.8" />
  <circle cx="210" cy="222" r="3" fill="#f43f5e" />
  <circle cx="228" cy="226" r="2.5" fill="#38bdf8" />
</svg>