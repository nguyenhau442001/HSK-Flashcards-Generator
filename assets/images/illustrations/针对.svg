<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Interior Environment (Town Hall / Community Center Meeting) -->
  <g id="environment">
    <!-- Back wall & floor division -->
    <rect x="20" y="160" width="200" height="4" fill="#334155" rx="2"/>
    
    <!-- Presentation screen showing a generic universal chart/graph (no text) -->
    <rect x="70" y="45" width="100" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Abstract universal graph representing "the issue/problem" -->
    <path d="M 85 90 L 105 75 L 125 82 L 145 60 L 155 85" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="145" cy="60" r="3" fill="#f43f5e"/>
    
    <!-- Light beam from projector/spotlight pointing at the audience -->
    <polygon points="120,20 60,170 180,170" fill="url(#beam)"/>
  </g>

  <!-- Diverse Crowd representing "Everyone" (所有人) -->
  <g id="audience">
    <!-- Person Left 1 -->
    <circle cx="65" cy="140" r="10" fill="#fbcfe8"/>
    <path d="M 50 175 C 50 155, 80 155, 80 175" fill="#ec4899"/>
    <path d="M 55 135 C 55 125, 75 125, 75 135" fill="#475569"/>

    <!-- Person Left 2 -->
    <circle cx="90" cy="145" r="11" fill="#fed7aa"/>
    <path d="M 75 180 C 75 158, 105 158, 105 180" fill="#f97316"/>
    <path d="M 80 138 C 80 128, 100 128, 100 138" fill="#1e293b"/>

    <!-- Person Center (Foreground listener looking engaged) -->
    <circle cx="120" cy="138" r="12" fill="#c7d2fe"/>
    <path d="M 103 175 C 103 150, 137 150, 137 175" fill="#6366f1"/>
    <path d="M 108 130 C 108 120, 132 120, 132 130" fill="#312e81"/>

    <!-- Person Right 1 -->
    <circle cx="150" cy="145" r="11" fill="#bae6fd"/>
    <path d="M 135 180 C 135 158, 165 158, 165 180" fill="#0ea5e9"/>
    <path d="M 140 140 C 140 130, 160 130, 160 140" fill="#0f172a"/>

    <!-- Person Right 2 -->
    <circle cx="175" cy="140" r="10" fill="#a7f3d0"/>
    <path d="M 160 175 C 160 155, 190 155, 190 175" fill="#10b981"/>
    <path d="M 165 135 C 165 125, 185 125, 185 135" fill="#065f46"/>
  </g>

  <!-- Speaker / Subject Addressing Everyone ("针对") -->
  <g id="speaker">
    <!-- Speaker Body & Gesture pointing forward -->
    <path d="M 110 200 L 110 170 C 110 160, 130 160, 130 170 L 130 200" fill="#fbbf24"/>
    <!-- Speaker Head -->
    <circle cx="120" cy="145" r="13" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M 107 142 C 107 132, 133 132, 133 142 C 133 145, 127 140, 120 140 C 113 140, 107 145, 107 142" fill="#78350f"/>
    
    <!-- Outstretched Arm and Hand pointing dynamically to the entire crowd (ZhenDui - aimed at all) -->
    <path d="M 125 168 Q 145 160 160 165" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="163" cy="166" r="4" fill="#fde68a"/>
    
    <!-- Directional Focus Indicator: Dotted arcs or energy pulses spreading out from speaker to all audience members -->
    <path d="M 135 155 Q 150 140 170 145" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>
    <path d="M 130 150 Q 155 130 185 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  </g>

  <!-- Foreground ambiance / framing elements -->
  <g id="foreground-props">
    <!-- Meeting table -->
    <path d="M 30 195 L 210 195 L 220 220 L 20 220 Z" fill="#334155"/>
    <rect x="20" y="190" width="200" height="8" rx="4" fill="#475569"/>
    
    <!-- Small props on table (microphones, notepad) -->
    <rect x="112" y="185" width="16" height="6" rx="2" fill="#94a3b8"/>
    <line x1="120" y1="185" x2="120" y2="175" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="120" cy="173" r="4" fill="#cbd5e1"/>
    
    <rect x="65" y="193" width="20" height="4" rx="1" fill="#f8fafc"/>
    <rect x="155" y="192" width="18" height="5" rx="1" fill="#e2e8f0"/>
  </g>
</svg>