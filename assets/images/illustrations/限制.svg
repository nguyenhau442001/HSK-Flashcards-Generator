<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Indoor Light -->
    <radialGradient id="indoorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / SCENERY -->
  <!-- Indoor Room Back Wall & Floor -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" />
  <path d="M 20 170 L 220 170 L 230 220 L 10 220 Z" fill="#0f172a" opacity="0.8" />
  
  <!-- Large Window Frame (Symbolizing the outside world / freedom) -->
  <rect x="80" y="35" width="80" height="100" rx="4" fill="#0284c7" opacity="0.2" />
  <!-- Window Panes -->
  <line x1="120" y1="35" x2="120" y2="135" stroke="#334155" stroke-width="3" />
  <line x1="80" y1="85" x2="160" y2="85" stroke="#334155" stroke-width="3" />
  <rect x="76" y="31" width="88" height="108" rx="6" fill="none" stroke="#475569" stroke-width="4" />

  <!-- Sunlight Beam shining through window into the room -->
  <polygon points="120,85 40,210 180,210" fill="url(#lightBeam)" />

  <!-- Potted Plant on Floor (representing natural freedom/growth) -->
  <path d="M 45 185 Q 45 170 55 170 L 65 170 Q 75 170 75 185 L 70 215 L 50 215 Z" fill="#64748b" />
  <path d="M 60 170 C 50 140 30 140 25 130 C 35 150 50 160 60 170 Z" fill="#10b981" />
  <path d="M 60 170 C 70 135 90 135 95 125 C 85 145 70 155 60 170 Z" fill="#34d399" />
  <path d="M 60 170 C 60 140 50 120 50 110 C 55 130 58 150 60 170 Z" fill="#059669" />

  <!-- THE "RULE / REGULATION" BARRIER (Visualizing 限制 - Constraint/Restriction) -->
  <!-- Official Red/Orange Caution Barrier glowing vertically across the scene -->
  <g opacity="0.9">
    <!-- Glowing vertical constraint beams -->
    <rect x="95" y="50" width="6" height="150" rx="3" fill="#ef4444" />
    <rect x="139" y="50" width="6" height="150" rx="3" fill="#ef4444" />
    
    <!-- Horizontal warning stripes on barrier -->
    <rect x="92" y="70" width="56" height="8" rx="2" fill="#fb923c" />
    <rect x="92" y="100" width="56" height="8" rx="2" fill="#fb923c" />
    <rect x="92" y="130" width="56" height="8" rx="2" fill="#fb923c" />
    <rect x="92" y="160" width="56" height="8" rx="2" fill="#fb923c" />
    
    <!-- Energy Shield Lines representing restriction -->
    <line x1="101" y1="50" x2="101" y2="200" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="139" y1="50" x2="139" y2="200" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- MAIN CHARACTER (Expressive human reaching towards freedom/window, held back) -->
  <g transform="translate(-10, 0)">
    <!-- Body / Torso -->
    <path d="M 75 160 C 75 135 85 130 95 130 L 115 130 C 125 130 135 135 135 160 L 140 210 L 70 210 Z" fill="#3b82f6" />
    <!-- Collar / Shirt Details -->
    <polygon points="90,130 105,150 120,130" fill="#e2e8f0" />

    <!-- Head -->
    <circle cx="105" cy="105" r="18" fill="#fbcfe8" />
    <!-- Face / Expression (Yearning / Restricted) -->
    <path d="M 98 100 Q 102 96 106 100" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 110 100 Q 114 96 118 100" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Sad/Pouty Mouth -->
    <path d="M 104 114 Q 108 110 112 114" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Hair -->
    <path d="M 87 105 C 87 90 95 85 105 85 C 115 85 123 90 123 105 C 120 100 110 95 105 95 C 100 95 90 100 87 105 Z" fill="#334155" />

    <!-- Back Arm -->
    <path d="M 80 135 L 60 160 L 70 170" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Front Arm (Reaching eagerly towards the window/freedom, stopped by the red barrier) -->
    <path d="M 125 135 L 145 135" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
    <!-- Hand hitting the barrier -->
    <circle cx="148" cy="135" r="7" fill="#fbcfe8" />

    <!-- Interaction Sparks / Impact on barrier -->
    <circle cx="143" cy="125" r="3" fill="#fef08a" />
    <circle cx="147" cy="148" r="2.5" fill="#fef08a" />
  </g>

  <!-- SECONDARY CHARACTER / DOCUMENT PROP (Representing the "Rule/Quy định" document) -->
  <g transform="translate(145, 130)">
    <!-- Clipboard / Document Base -->
    <rect x="0" y="0" width="35" height="45" rx="3" fill="#cbd5e1" />
    <rect x="3" y="6" width="29" height="36" fill="#f8fafc" />
    <!-- Clip -->
    <rect x="12" y="-3" width="11" height="6" rx="2" fill="#475569" />
    <!-- Abstract lines representing text of the rule -->
    <line x1="7" y1="12" x2="25" y2="12" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="18" x2="22" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="24" x2="26" y2="24" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="30" x2="17" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Red Official Seal Stamp (Giving it official regulation vibe) -->
    <circle cx="23" cy="31" r="5" fill="#ef4444" opacity="0.8" />
  </g>

  <!-- Foreground Atmospheric Lighting / Soft Vignette -->
  <rect width="240" height="240" rx="24" fill="url(#indoorGlow)" pointer-events="none" />
</svg>