<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Kitchen/Dining Glow -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Food Steam Animation Helper -->
    <linearGradient id="steam-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" fill="url(#lamp-glow)"/>

  <!-- BACKGROUND ENVIRONMENT: DINING ROOM / KITCHEN -->
  <!-- Wall shelf with plates -->
  <rect x="30" y="45" width="90" height="6" rx="3" fill="#334155"/>
  <circle cx="50" cy="35" r="9" fill="#64748b"/>
  <circle cx="75" cy="33" r="11" fill="#cbd5e1"/>
  <path d="M 95 38 Q 105 38 105 45 L 95 45 Z" fill="#94a3b8"/>

  <!-- Warm Hanging Lamp -->
  <path d="M 175 0 L 175 35" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M 155 35 L 195 35 L 205 50 L 145 50 Z" fill="#f59e0b"/>
  <!-- Lamp light beam cone -->
  <polygon points="175,50 110,190 240,190" fill="#fbbf24" opacity="0.08"/>

  <!-- Window with night city lights blur -->
  <rect x="25" y="70" width="50" height="75" rx="4" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <line x1="50" y1="70" x2="50" y2="145" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="107" x2="75" y2="107" stroke="#334155" stroke-width="2"/>
  <circle cx="38" cy="85" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="62" cy="95" r="1.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="42" cy="125" r="2" fill="#fbbf24" opacity="0.8"/>

  <!-- DINING TABLE -->
  <rect x="80" y="165" width="145" height="15" rx="4" fill="#475569" filter="url(#shadow)"/>
  <rect x="100" y="180" width="14" height="40" fill="#334155"/>
  <rect x="190" y="180" width="14" height="40" fill="#334155"/>

  <!-- PROP: THE DESIRED BOWL OF RICE / NOODLES ("吃饭") -->
  <g transform="translate(130, 135)">
    <!-- Bowl -->
    <path d="M 10 15 L 30 15 Q 38 35 20 35 Q 2 35 10 15 Z" fill="#ffffff" filter="url(#shadow)"/>
    <ellipse cx="20" cy="15" rx="10" ry="3" fill="#e2e8f0"/>
    <!-- Food inside (Rice & steam) -->
    <ellipse cx="20" cy="18" rx="8" ry="4" fill="#f8fafc"/>
    <!-- Chopsticks -->
    <line x1="5" y1="5" x2="35" y2="25" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="2" x2="38" y2="22" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam wisps -->
    <path d="M 16 10 Q 12 0 20 -8 Q 28 -16 22 -24" fill="none" stroke="url(#steam-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 24 12 Q 28 3 22 -4 Q 16 -10 20 -18" fill="none" stroke="url(#steam-grad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER: EXPRESSING HUNGER ("饿了") -->
  <!-- Chair Back -->
  <path d="M 85 110 L 95 165" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <g transform="translate(60, 85)">
    <!-- Body / Torso leaning slightly forward -->
    <path d="M 35 60 Q 45 40 55 70 L 60 100 L 25 100 Z" fill="#38bdf8" filter="url(#shadow)"/>
    
    <!-- Arms hugging the hungry tummy -->
    <!-- Left arm -->
    <path d="M 40 65 Q 20 70 30 90 Q 45 95 50 85" fill="#38bdf8" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right arm pressing stomach -->
    <path d="M 50 65 Q 65 75 55 90 Q 40 95 35 85" fill="#38bdf8" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Head -->
    <circle cx="45" cy="30" r="22" fill="#fed7aa" filter="url(#shadow)"/>
    
    <!-- Hair -->
    <path d="M 23 30 Q 30 10 50 12 Q 68 15 67 32 Q 55 20 45 22 Q 30 20 23 30 Z" fill="#1e293b"/>

    <!-- Face Expression: Hungry, yearning, slight discomfort (dizzy/hungry eyes & open pleading mouth) -->
    <!-- Closed/Strained Crescent Eyes indicating hunger/dizziness -->
    <path d="M 34 28 Q 38 32 42 28" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 48 28 Q 52 32 56 28" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Blush / Hunger flush -->
    <circle cx="34" cy="35" r="4" fill="#f43f5e" opacity="0.4"/>
    <circle cx="56" cy="35" r="4" fill="#f43f5e" opacity="0.4"/>

    <!-- Mouth: Open in an "Ah" / longing expression -->
    <ellipse cx="45" cy="40" rx="4" ry="5" fill="#9f1239"/>

    <!-- Cute Hunger Sweat Drop -->
    <path d="M 62 20 Q 66 24 64 27 Q 62 29 60 27 Q 58 24 62 20 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- FOREGROUND VIBE: SUBTLE INTERACTION DETAILS -->
  <!-- Plate on table -->
  <ellipse cx="105" cy="172" rx="16" ry="6" fill="#cbd5e1"/>

</svg>