<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Morning Light -->
  <rect x="30" y="30" width="180" height="100" rx="8" fill="#334155" opacity="0.5"/>
  <circle cx="180" cy="60" r="25" fill="#f59e0b" opacity="0.8"/>
  
  <!-- Table -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  
  <!-- Character (Upper body) -->
  <g transform="translate(40, 100)">
    <path d="M20 120 C20 80, 60 60, 80 60 C100 60, 140 80, 140 120" fill="#64748b"/>
    <circle cx="80" cy="50" r="25" fill="#fde68a"/>
    <path d="M70 50 L75 55 M85 50 L90 55" stroke="#475569" stroke-width="2"/>
    <path d="M72 65 Q80 72 88 65" stroke="#475569" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Soy Milk Cup -->
  <g transform="translate(150, 140)">
    <path d="M0 0 L40 0 L35 60 L5 60 Z" fill="#f1f5f9"/>
    <ellipse cx="20" cy="0" rx="20" ry="6" fill="#e2e8f0"/>
    <path d="M10 10 L30 10" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M12 20 L28 20" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Steam -->
    <path d="M20 -5 Q25 -15 20 -25" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M25 -10 Q30 -20 25 -30" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Hand holding cup -->
  <path d="M130 160 C120 160, 120 180, 145 180" fill="#fde68a"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="200" r="3" fill="#38bdf8"/>
  <circle cx="220" cy="180" r="2" fill="#10b981"/>
  <circle cx="20" cy="190" r="4" fill="#ec4899"/>
