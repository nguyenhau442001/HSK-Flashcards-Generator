<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bank Counter -->
  <path d="M20 160h200v60H20z" fill="#334155"/>
  <rect x="20" y="150" width="200" height="10" fill="#475569"/>
  
  <!-- Teller Window/Glass -->
  <rect x="80" y="80" width="80" height="70" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="2"/>
  <path d="M120 150v-70" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Character: Customer -->
  <g transform="translate(40, 110)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 35c0 15 20 15 20 0" stroke="#fde68a" stroke-width="3" fill="none"/>
    <path d="M5 50h30l-5 40h-20z" fill="#ec4899"/>
    <rect x="15" y="90" width="10" height="30" fill="#1e293b"/>
  </g>
  
  <!-- Character: Teller -->
  <g transform="translate(160, 110)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 35c0 15 20 15 20 0" stroke="#fde68a" stroke-width="3" fill="none"/>
    <rect x="5" y="50" width="30" height="40" fill="#10b981"/>
  </g>
  
  <!-- Props: Money/Deposit -->
  <rect x="90" y="130" width="20" height="15" fill="#fbbf24" rx="2"/>
  <rect x="95" y="125" width="20" height="15" fill="#f59e0b" rx="2"/>
  
  <!-- Bank Interior Details -->
  <circle cx="200" cy="30" r="15" fill="#fb923c" fill-opacity="0.2"/>
  <path d="M180 200h40v5h-40z" fill="#475569"/>
  <path d="M20 200h40v5h-40z" fill="#475569"/>
  
  <!-- Decorative light accents -->
  <circle cx="220" cy="20" r="2" fill="#fbbf24"/>
  <circle cx="210" cy="10" r="1" fill="#fbbf24"/>
</svg>