<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight for Tour Guide -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Flagpole Gradient -->
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Banner Flag Gradient -->
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Lanyard Gradient -->
    <linearGradient id="lanyardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Atmospheric Background Elements (Travel/Landmark Vibe) -->
  <g opacity="0.15">
    <!-- Stylized Mountains / Horizon -->
    <path d="M0 190 L40 140 L80 170 L130 110 L190 180 L240 130 L240 240 L0 240 Z" fill="#64748b"/>
    <!-- Cloud accents -->
    <circle cx="50" cy="70" r="15" fill="#94a3b8"/>
    <circle cx="65" cy="65" r="20" fill="#94a3b8"/>
    <circle cx="190" cy="90" r="18" fill="#94a3b8"/>
    <circle cx="210" cy="85" r="12" fill="#94a3b8"/>
  </g>

  <!-- DISTANT TOURIST GROUP (Contextual Depth) -->
  <g transform="translate(160, 140)" opacity="0.6">
    <!-- Tourist 1 -->
    <circle cx="0" cy="15" r="8" fill="#38bdf8"/>
    <path d="M-6 40 C-6 25, 6 25, 6 40 Z" fill="#f43f5e"/>
    <!-- Tourist 2 -->
    <circle cx="25" cy="20" r="7" fill="#38bdf8"/>
    <path d="M20 45 C20 32, 30 32, 30 45 Z" fill="#10b981"/>
    <!-- Camera icon held up -->
    <rect x="5" y="15" width="6" height="4" rx="1" fill="#fbbf24"/>
  </g>

  <!-- MAIN SUBJECT: TOUR GUIDE (导游) -->
  <!-- Body/Torso -->
  <g transform="translate(100, 120)">
    <!-- Backpack straps / Bag -->
    <path d="M-15 20 L-25 70 L-15 75 L-5 25 Z" fill="#334155"/>
    
    <!-- Shoulders & Shirt -->
    <path d="M-30 80 C-30 45, 30 45, 30 80 Z" fill="url(#shirtGrad)"/>
    <!-- Vest/Jacket (Travel Vibe) -->
    <path d="M-32 50 L-18 48 L-18 80 L-32 80 Z" fill="#0284c7"/>
    <path d="M32 50 L18 48 L18 80 L32 80 Z" fill="#0284c7"/>
    <!-- Vest Details (pockets) -->
    <rect x="-28" y="58" width="7" height="6" rx="1" fill="#0369a1"/>
    <rect x="21" y="58" width="7" height="6" rx="1" fill="#0369a1"/>

    <!-- ID Badge / Tour Guide Pass -->
    <path d="M0 40 L-4 55 L4 55 Z" fill="url(#lanyardGrad)"/>
    <rect x="-6" y="55" width="12" height="15" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="0" cy="60" r="3" fill="#38bdf8"/>
    <rect x="-4" y="65" width="8" height="2" rx="1" fill="#94a3b8"/>

    <!-- Neck -->
    <rect x="-6" y="36" width="12" height="14" fill="#fbcfe8" rx="4"/>

    <!-- Head & Face -->
    <circle cx="0" cy="18" r="20" fill="#fbcfe8"/>

    <!-- Hair (Friendly, dynamic style) -->
    <path d="M-20 15 C-22 -5, 15 -10, 21 8 C23 3, 20 -2, 14 -6 C5 -10, -12 -5, -20 15 Z" fill="url(#hairGrad)"/>
    <path d="M-18 16 C-12 12, -4 14, 2 12 C10 10, 16 15, 19 21 C15 24, 5 21, -3 22 C-11 23, -16 20, -18 16 Z" fill="url(#hairGrad)"/>

    <!-- Facial Expression (Enthusiastic & Welcoming) -->
    <!-- Eyes (Happy arcs) -->
    <path d="M-9 16 C-7 13, -5 13, -3 16" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M3 16 C5 13, 7 13, 9 16" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks (Blush) -->
    <circle cx="-11" cy="20" r="3" fill="#fb7185" opacity="0.6"/>
    <circle cx="11" cy="20" r="3" fill="#fb7185" opacity="0.6"/>
    <!-- Smiling Mouth -->
    <path d="M-5 22 C-5 27, 5 27, 5 22" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Arm (Holding high the guiding flag) -->
    <path d="M-26 55 C-35 30, -55 20, -50 0" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="-50" cy="0" r="5" fill="#fbcfe8"/>

    <!-- Right Arm (Gesturing warmly forward) -->
    <path d="M26 55 C40 50, 45 35, 35 25" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="35" cy="25" r="5" fill="#fbcfe8"/>
  </g>

  <!-- TOUR GUIDE FLAG (The signature prop: 导游旗) -->
  <g transform="translate(50, 60)">
    <!-- Pole -->
    <line x1="0" y1="-40" x2="0" y2="70" stroke="url(#poleGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Flag Banner (Waving animation shape) -->
    <path d="M2 -35 C15 -42, 35 -28, 45 -35 L45 0 C35 -7, 15 7, 2 0 Z" fill="url(#flagGrad)" filter="drop-shadow(0px 4px 4px rgba(0,0,0,0.2))"/>
    <!-- Decorative Star/Compass on Flag -->
    <path d="M23 -20 L25 -15 L30 -14 L26 -10 L27 -5 L23 -8 L19 -5 L20 -10 L16 -14 L21 -15 Z" fill="#fef08a"/>
    <!-- Pole Top Ball -->
    <circle cx="0" cy="-42" r="4" fill="#fbbf24"/>
  </g>

  <!-- FOREGROUND PROPS & ACTION DETAILS (Map & Compass / Travel Gear) -->
  <g transform="translate(35, 175)">
    <!-- Unfurled Tourist Map on ground/ledge -->
    <path d="M-10 10 L30 -5 L50 15 L10 30 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.3))"/>
    <!-- Map Routes & Markers -->
    <path d="M 0 5 Q 15 0 25 10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2"/>
    <circle cx="28" cy="12" r="3" fill="#f43f5e"/>
    <path d="M 10 18 Q 20 15 35 22" fill="none" stroke="#10b981" stroke-width="2"/>
    <!-- Compass Icon lying next to map -->
    <circle cx="-2" cy="22" r="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="-2,15 1,22 -2,20 -5,22" fill="#f43f5e"/>
    <polygon points="-2,29 1,22 -2,24 -5,22" fill="#94a3b8"/>
  </g>

  <!-- Action / Sparkle Effects (Enthusiastic Vibe) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 45 40 Q 45 45 50 45 Q 45 45 45 50 Q 45 45 40 45 Q 45 45 45 40 Z"/>
    <!-- Star 2 -->
    <path d="M 190 60 Q 190 65 195 65 Q 190 65 190 70 Q 190 65 185 65 Q 190 65 190 60 Z"/>
    <!-- Star 3 (cyan accent) -->
    <path d="M 205 130 Q 205 134 209 134 Q 205 134 205 138 Q 205 134 201 134 Q 205 134 205 130 Z" fill="#38bdf8"/>
  </g>

</svg>