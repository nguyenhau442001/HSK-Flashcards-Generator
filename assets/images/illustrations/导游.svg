<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Sun / Horizon Accent -->
  <circle cx="100" cy="95" r="55" fill="#334155" opacity="0.4"/>
  <path d="M 45 130 Q 100 110 155 130" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Tour Guide Character Representation -->
  <!-- Body/Shirt (Teal/Emerald Theme) -->
  <path d="M 75 145 C 75 125 125 125 125 145 L 135 170 L 65 170 Z" fill="#0d9488"/>
  <path d="M 100 125 L 100 170" stroke="#042f2e" stroke-width="2"/>

  <!-- Head & Neck -->
  <rect x="92" y="102" width="16" height="15" fill="#fbcfe8" rx="4"/>
  <circle cx="100" cy="90" r="18" fill="#fbcfe8"/>

  <!-- Hair (Stylish brown/slate) -->
  <path d="M 82 90 C 82 75 118 75 118 90 C 118 90 115 82 100 82 C 85 82 82 90 82 90 Z" fill="#334155"/>

  <!-- Safari Hat (Classic Tour Guide) -->
  <ellipse cx="100" cy="78" rx="26" ry="7" fill="#fb923c"/>
  <path d="M 84 76 C 84 62 116 62 116 76 Z" fill="#fed7aa"/>
  <rect x="85" y="73" width="30" height="4" fill="#d97706" rx="1"/>

  <!-- Pointing Arm & Hand -->
  <path d="M 120 135 C 135 130 150 115 155 110" stroke="#0d9488" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="157" cy="108" r="4" fill="#fbcfe8"/>

  <!-- Raised Flag / Tour Guide Pole in Left Hand -->
  <!-- Pole -->
  <path d="M 68 140 L 55 50" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Pennant Flag (Amber & Sky Blue) -->
  <path d="M 55 50 L 85 62 L 55 74 Z" fill="#f59e0b"/>

  <!-- Camera around neck -->
  <path d="M 88 118 C 94 125 106 125 112 118" stroke="#64748b" stroke-width="2" fill="none"/>
  <rect x="92" y="117" width="16" height="11" rx="3" fill="#334155"/>
  <circle cx="100" cy="122" r="3" fill="#38bdf8"/>

  <!-- Scenic Landmark Icon in background (Small pyramid/mountain) -->
  <path d="M 140 130 L 155 105 L 175 130 Z" fill="#334155" opacity="0.6"/>
  <path d="M 155 105 L 158 115 L 150 130" fill="#475569" opacity="0.6"/>

  <!-- Ground Line -->
  <line x1="40" y1="170" x2="160" y2="170" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
</svg>