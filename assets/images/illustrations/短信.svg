<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Phone Screen Glow Gradient -->
    <linearGradient id="phoneGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Avatar Gradient -->
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting -->
  <circle cx="120" cy="0" r="140" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Window frame showing a cozy evening cityscape outside -->
  <g opacity="0.4">
    <rect x="25" y="30" width="60" height="85" rx="4" fill="#334155" />
    <rect x="30" y="35" width="23" height="35" rx="2" fill="#1e293b" />
    <rect x="57" y="35" width="23" height="35" rx="2" fill="#1e293b" />
    <rect x="30" y="75" width="23" height="35" rx="2" fill="#1e293b" />
    <rect x="57" y="75" width="23" height="35" rx="2" fill="#1e293b" />
    <!-- City lights outside -->
    <circle cx="38" cy="45" r="1.5" fill="#f59e0b" />
    <circle cx="45" cy="85" r="1.5" fill="#38bdf8" />
    <circle cx="70" cy="55" r="1.5" fill="#f59e0b" />
  </g>

  <!-- Bookshelf / Plant in Background -->
  <rect x="180" y="40" width="35" height="90" rx="3" fill="#334155" opacity="0.6"/>
  <path d="M185 80 L210 80" stroke="#1e293b" stroke-width="3" />
  <!-- Small Plant -->
  <path d="M197 75 Q192 65 190 55 Q200 60 197 75" fill="#10b981" />
  <path d="M197 75 Q202 63 207 53 Q197 60 197 75" fill="#34d399" />
  <ellipse cx="197" cy="76" rx="6" ry="4" fill="#fb923c" />

  <!-- Desk Surface -->
  <path d="M0 165 L240 165 L240 240 L0 240 Z" fill="#0f172a" />
  <rect x="0" y="165" width="240" height="6" fill="#334155" />

  <!-- Desk Lamp -->
  <path d="M200 165 L200 110 L215 95" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M205 90 L225 105 L215 115 Z" fill="#fbbf24" />
  <ellipse cx="200" cy="165" rx="15" ry="4" fill="#334155" />

  <!-- Coffee Mug on Desk -->
  <rect x="160" y="145" width="16" height="20" rx="3" fill="#f8fafc" />
  <path d="M176 150 C182 150 182 160 176 160" stroke="#f8fafc" stroke-width="2" fill="none" />
  <ellipse cx="168" cy="145" rx="8" ry="3" fill="#cbd5e1" />
  <!-- Steam from coffee -->
  <path d="M164 135 Q168 125 164 115" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- MAIN CHARACTER & ACTION -->
  <!-- Chair Back -->
  <path d="M70 180 L70 100 Q70 90 80 90 L110 90 Q120 90 120 100 L120 180 Z" fill="#334155" />

  <!-- Character Body (Sitting, leaning forward attentively) -->
  <g transform="translate(0, 5)">
    <!-- Torso (Cozy Sweater) -->
    <path d="M85 115 Q115 110 135 125 L145 170 C145 170 100 175 75 170 Z" fill="#38bdf8" />
    <path d="M95 117 Q115 114 130 122" stroke="#0284c7" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Head & Hair -->
    <!-- Neck -->
    <path d="M105 105 L115 118 L95 118 Z" fill="#fed7aa" />

    <!-- Hair Back/Base -->
    <circle cx="107" cy="85" r="22" fill="#1e293b" />

    <!-- Face Profile / Skin -->
    <circle cx="107" cy="88" r="18" fill="#fed7aa" />

    <!-- Hair Bangs & Styling -->
    <path d="M89 82 Q95 70 115 72 Q125 73 125 85 Q125 95 115 95 Z" fill="#1e293b" />
    <path d="M93 83 Q100 77 108 79" fill="#1e293b" />

    <!-- Facial Expression: Focused, slightly smiling while typing -->
    <!-- Eye closed/content curved or focused dot -->
    <path d="M112 87 Q115 90 118 87" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheek -->
    <circle cx="116" cy="93" r="4" fill="#fb7185" opacity="0.6" />
    <!-- Gentle Smile -->
    <path d="M113 97 Q117 101 121 97" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Arms & Hands composing the message -->
    <!-- Left arm resting -->
    <path d="M90 125 Q80 145 90 165" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Right arm reaching forward to phone -->
    <path d="M130 125 Q150 135 145 150" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Hand holding phone / tapping -->
    <circle cx="145" cy="153" r="6" fill="#fed7aa" />
  </g>

  <!-- THE SMARTPHONE & ACTION PROPS -->
  <g transform="translate(130, 120) rotate(-15)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="45" height="75" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Phone Screen -->
    <rect x="3" y="5" width="39" height="65" rx="4" fill="url(#phoneGlow)" />

    <!-- UI Elements inside phone (Abstract UI representing chat/messaging) -->
    <!-- Incoming bubble -->
    <rect x="6" y="10" width="22" height="12" rx="4" fill="#ffffff" opacity="0.9" />
    <path d="M6 18 L4 22 L10 20 Z" fill="#ffffff" opacity="0.9" />

    <!-- Outgoing bubble (Being typed/sent right now) -->
    <rect x="15" y="27" width="24" height="15" rx="4" fill="#10b981" />
    <path d="M39 37 L42 42 L35 40 Z" fill="#10b981" />

    <!-- Typing indicator dots -->
    <circle cx="21" cy="34" r="1.5" fill="#ffffff" />
    <circle cx="27" cy="34" r="1.5" fill="#ffffff" />
    <circle cx="33" cy="34" r="1.5" fill="#ffffff" />

    <!-- Keyboard area on screen -->
    <rect x="6" y="48" width="33" height="18" rx="2" fill="#0f172a" opacity="0.3" />
  </g>

  <!-- FLYING MESSAGE / SENDING EFFECT (Dynamic motion lines & bubbles) -->
  <g filter="url(#shadow)">
    <!-- Sending particle bubble 1 -->
    <circle cx="110" cy="115" r="8" fill="#10b981" />
    <!-- Paper airplane or small chat icon shape inside bubble -->
    <path d="M107 115 L114 112 L111 118 Z" fill="#ffffff" />

    <!-- Sending particle bubble 2 (smaller, trailing) -->
    <circle cx="90" cy="100" r="5" fill="#38bdf8" />

    <!-- Dynamic arc showing the path of the sent message -->
    <path d="M135 115 Q115 100 85 90" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.7" />
    <path d="M135 115 Q120 105 100 95" stroke="#10b981" stroke-width="2" fill="none" />
  </g>

  <!-- Secondary floating interactive elements for richness -->
  <g opacity="0.8">
    <circle cx="70" cy="65" r="12" fill="#334155" />
    <!-- Heart/Like floating icon -->
    <path d="M70 68 C65 62 64 58 67 56 C70 54 70 58 70 58 C70 58 70 54 73 56 C76 58 75 62 70 68 Z" fill="#ec4899" />
  </g>

</svg>