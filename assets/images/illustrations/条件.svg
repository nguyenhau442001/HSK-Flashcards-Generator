<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Environment -->
  <rect x="20" y="40" width="200" height="160" rx="8" fill="#334155"/>
  <rect x="25" y="45" width="190" height="150" rx="6" fill="#1e293b"/>
  
  <!-- Window -->
  <rect x="40" y="60" width="60" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <line x1="70" y1="60" x2="70" y2="110" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Desk/Table -->
  <rect x="120" y="130" width="80" height="10" fill="#fb923c"/>
  <rect x="130" y="140" width="10" height="40" fill="#fb923c"/>
  <rect x="180" y="140" width="10" height="40" fill="#fb923c"/>
  
  <!-- Amenities (Representing 'Conditions') -->
  <!-- Lamp -->
  <circle cx="155" cy="110" r="15" fill="#f59e0b"/>
  <rect x="150" y="115" width="10" height="15" fill="#f59e0b"/>
  
  <!-- Plant -->
  <rect x="185" y="115" width="15" height="15" fill="#10b981"/>
  <path d="M192 115 L185 100 L200 100 Z" fill="#10b981"/>
  
  <!-- Chair -->
  <rect x="50" y="150" width="40" height="10" fill="#ec4899"/>
  <rect x="55" y="160" width="5" height="20" fill="#ec4899"/>
  <rect x="80" y="160" width="5" height="20" fill="#ec4899"/>
  
  <!-- Floor Detail -->
  <rect x="20" y="190" width="200" height="10" fill="#0f172a"/>
  
  <!-- Atmospheric Accents -->
  <circle cx="210" cy="50" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="70" r="2" fill="#fbbf24"/>
</svg>