<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>

    <!-- Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Floor -->
  <!-- Back Wall -->
  <rect x="15" y="15" width="210" height="155" fill="#1b263b"/>
  <!-- Floor -->
  <polygon points="15,170 225,170 235,225 5,225" fill="#111827"/>
  <polygon points="15,170 225,170 225,173 15,173" fill="#334155" opacity="0.5"/>

  <!-- Window with Arched Top (Showing a hint of ruined cityscape outside) -->
  <path d="M 175 45 L 205 45 L 205 115 L 175 115 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Distant ruins silhouette through window -->
  <path d="M 178 115 L 178 95 L 184 95 L 184 90 L 188 90 L 188 98 L 194 98 L 194 85 L 199 85 L 199 115 Z" fill="#1e293b"/>
  <!-- Window Light Beam casting across the room -->
  <polygon points="175,45 205,45 235,185 140,185" fill="url(#windowLight)"/>
  <!-- Window Panes -->
  <line x1="190" y1="45" x2="190" y2="115" stroke="#334155" stroke-width="1.5"/>
  <line x1="175" y1="80" x2="205" y2="80" stroke="#334155" stroke-width="1.5"/>

  <!-- Background Environment: Shelves with books/supplies -->
  <rect x="25" y="55" width="45" height="6" rx="2" fill="#334155"/>
  <rect x="32" y="38" width="8" height="17" fill="#475569" rx="1"/>
  <rect x="42" y="42" width="6" height="13" fill="#64748b" rx="1"/>
  <rect x="50" y="40" width="10" height="15" fill="#3b82f6" rx="1" opacity="0.6"/>

  <!-- Hanging Desk Lamp -->
  <path d="M 85 15 L 85 45" stroke="#475569" stroke-width="2"/>
  <path d="M 70 45 L 100 45 L 105 55 L 65 55 Z" fill="#334155"/>
  <ellipse cx="85" cy="55" rx="20" ry="15" fill="url(#lampGlow)"/>

  <!-- Wooden Desk -->
  <rect x="55" y="145" width="100" height="8" rx="2" fill="#78350f"/>
  <rect x="65" y="153" width="8" height="30" fill="#451a03"/>
  <rect x="137" y="153" width="8" height="30" fill="#451a03"/>

  <!-- Desk Props: Open Letter / Document -->
  <rect x="85" y="125" width="22" height="18" rx="1" fill="#f8fafc" transform="rotate(-10 96 134)"/>
  <line x1="88" y1="130" x2="102" y2="130" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="88" y1="135" x2="98" y2="135" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Small broken toy / memento representing lost home/childhood -->
  <path d="M 120 138 L 128 132 L 135 140 Z" fill="#64748b"/>
  <circle cx="123" cy="136" r="3" fill="#ef4444"/>

  <!-- MAIN CHARACTER: Sitting at desk, showing sorrow/pain ("战争带来了很多痛苦") -->
  <!-- Chair Back -->
  <rect x="92" y="95" width="26" height="60" rx="4" fill="#451a03"/>
  
  <!-- Character Body / Torso (hunched over in grief) -->
  <path d="M 85 140 C 85 120, 110 115, 120 130 L 118 155 C 105 160, 90 160, 85 140 Z" fill="#1e3a8a"/>

  <!-- Character Arms resting on table / holding head -->
  <!-- Left Arm -->
  <path d="M 90 130 C 80 135, 75 145, 82 148 C 89 151, 95 140, 95 135 Z" fill="#1e3a8a"/>
  <!-- Right Arm supporting head -->
  <path d="M 115 132 C 122 138, 118 148, 110 148 C 102 148, 100 138, 105 132 Z" fill="#1e3a8a"/>

  <!-- Character Head (bowed down in heavy emotional pain) -->
  <circle cx="103" cy="112" r="14" fill="#fde68a"/>
  
  <!-- Hair (Messy, muted brown) -->
  <path d="M 90 110 C 90 98, 115 98, 117 110 C 117 105, 110 100, 103 100 C 95 100, 90 104, 90 110 Z" fill="#78350f"/>

  <!-- Face details (Eyes closed tightly in distress, downturned mouth) -->
  <!-- Closed Eyebrows (angled in sorrow) -->
  <line x1="97" y1="110" x2="102" y2="112" stroke="#451a03" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="106" y1="112" x2="111" y2="110" stroke="#451a03" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tear Drop -->
  <path d="M 100 116 C 100 116, 98 120, 98 122 C 98 123.1, 98.9 124, 100 124 C 101.1 124, 102 123.1, 102 122 C 102 120, 100 116, 100 116 Z" fill="#38bdf8"/>

  <!-- Foreground shadows / atmosphere -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8"/>
</svg>