<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Warm Ambiance Overlay -->
    <radialGradient id="warmLight" cx="65%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Counter Top Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Apron Gradient -->
    <linearGradient id="apronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Coffee Machine Metallic -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>
  <rect width="240" height="240" rx="24" fill="url(#warmLight)" style="mix-blend-mode: screen;"/>

  <!-- Atmospheric Cafe Background Elements -->
  <!-- Hanging Lights -->
  <path d="M70 0 L70 50 M170 0 L170 35" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <circle cx="70" cy="52" r="10" fill="#fbbf24" filter="url(#softShadow)" opacity="0.9"/>
  <circle cx="170" cy="37" r="8" fill="#fbbf24" filter="url(#softShadow)" opacity="0.9"/>
  <!-- Light Cones -->
  <polygon points="70,52 30,140 110,140" fill="#fbbf24" opacity="0.06"/>
  <polygon points="170,37 130,130 210,130" fill="#fbbf24" opacity="0.04"/>

  <!-- Shelves with Bottles and Cups -->
  <rect x="25" y="65" width="90" height="4" rx="2" fill="#475569"/>
  <rect x="35" y="45" width="12" height="20" rx="2" fill="#f43f5e" opacity="0.8"/>
  <rect x="52" y="40" width="14" height="25" rx="3" fill="#10b981" opacity="0.8"/>
  <path d="M78 48 C78 44 86 44 86 48 L86 65 L78 65 Z" fill="#f59e0b" opacity="0.9"/>
  <ellipse cx="98" cy="55" rx="6" ry="8" fill="#a855f7" opacity="0.8"/>

  <!-- Coffee Machine in Background -->
  <g transform="translate(145, 60)">
    <rect x="0" y="0" width="55" height="70" rx="6" fill="url(#metalGrad)" filter="url(#softShadow)"/>
    <rect x="8" y="10" width="39" height="18" rx="3" fill="#0f172a"/>
    <circle cx="16" cy="19" r="4" fill="#38bdf8"/>
    <circle cx="28" cy="19" r="4" fill="#10b981"/>
    <rect x="18" y="38" width="19" height="14" rx="2" fill="#334155"/>
    <path d="M22 52 L34 52 L31 64 L25 64 Z" fill="#1e293b"/>
    <!-- Steam -->
    <path d="M38 6 C36 2 41 0 38 -4" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Counter Top -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#counterGrad)"/>
  <rect x="0" y="154" width="240" height="6" fill="#475569"/>

  <!-- Counter Props (Pastry display dome & cups) -->
  <g transform="translate(180, 125)">
    <ellipse cx="25" cy="35" rx="22" ry="6" fill="#334155"/>
    <path d="M3 35 C3 15 13 8 25 8 C37 8 47 15 47 35 Z" fill="#38bdf8" opacity="0.15" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Croissant inside -->
    <path d="M15 32 Q25 24 35 32 Q25 36 15 32 Z" fill="#d97706"/>
  </g>
  
  <!-- Stack of To-Go Cups -->
  <g transform="translate(15, 120)">
    <rect x="0" y="10" width="16" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="-2" y="5" width="20" height="6" rx="2" fill="#ea580c"/>
    <rect x="3" y="32" width="14" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="1" y="27" width="18" height="6" rx="2" fill="#ea580c"/>
  </g>

  <!-- MAIN CHARACTER: Enthusiastic Barista / Server -->
  <g transform="translate(60, 50)" filter="url(#softShadow)">
    
    <!-- Torso & Apron -->
    <!-- Body Base (Shirt) -->
    <path d="M25 80 C25 70 35 65 50 65 C65 65 75 70 75 80 L85 125 L15 125 Z" fill="#0f172a"/>
    <!-- Apron -->
    <path d="M30 75 L70 75 L78 125 L22 125 Z" fill="url(#apronGrad)"/>
    <!-- Apron Straps -->
    <path d="M38 75 L50 95 L62 75" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="95" r="4" fill="#fbbf24"/>
    <!-- Apron Pocket -->
    <rect x="38" y="102" width="24" height="18" rx="3" fill="#0284c7" opacity="0.8"/>
    <!-- Cute Latte Art Icon on Apron (Abstract Heart) -->
    <path d="M50 110 C48 106 44 106 44 109 C44 113 50 116 50 116 C50 116 56 113 56 109 C56 106 52 106 50 110 Z" fill="#fef08a"/>

    <!-- Neck -->
    <rect x="42" y="54" width="16" height="15" fill="url(#skinGrad)" rx="4"/>

    <!-- Head & Hair -->
    <!-- Back Hair -->
    <circle cx="50" cy="40" r="22" fill="#1e1b4b"/>
    <!-- Face Shape -->
    <rect x="30" y="25" width="40" height="36" rx="20" fill="url(#skinGrad)"/>
    <!-- Ears -->
    <circle cx="28" cy="42" r="4" fill="url(#skinGrad)"/>
    <circle cx="72" cy="42" r="4" fill="url(#skinGrad)"/>

    <!-- Hair Bangs & Top Details -->
    <path d="M28 32 C30 20 45 16 55 18 C65 20 72 28 72 38 L72 32 C72 22 62 14 50 14 C38 14 28 22 28 32 Z" fill="#1e1b4b"/>
    <circle cx="68" cy="24" r="6" fill="#1e1b4b"/> <!-- Cute bun/tuft -->

    <!-- Facial Expressions - EXTREMELY ENTHUSIASTIC -->
    <!-- Cheeks (Blushing with Joy) -->
    <ellipse cx="37" cy="46" rx="5" ry="3" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="63" cy="46" rx="5" ry="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Eyes (Happy Arches / Wink of Welcome) -->
    <path d="M35 39 Q39 34 43 39" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M57 39 Q61 34 65 39" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dynamic Open Joyful Mouth ("ยินดีต้อนรับ! / Welcome!") -->
    <path d="M43 45 Q50 56 57 45 Z" fill="#991b1b"/>
    <path d="M46 47 Q50 52 54 47 Z" fill="#f87171"/>

    <!-- Raised Dynamic Arms Embodying 'Nhiệt tình' (Warm & Welcoming Gesture) -->
    <!-- Left Arm (Waving / Welcoming) -->
    <g transform="translate(15, 60)">
      <path d="M15 15 C5 5 -10 15 -15 25" fill="none" stroke="url(#apronGrad)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-16" cy="26" r="6" fill="url(#skinGrad)"/>
      <!-- Motion lines for energetic wave -->
      <path d="M-20 15 C-24 18 -24 24 -20 28" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Right Arm (Holding tray with steaming coffee with high enthusiasm) -->
    <g transform="translate(70, 70)">
      <path d="M0 10 C15 15 25 5 35 -5" fill="none" stroke="url(#apronGrad)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="36" cy="-7" r="6" fill="url(#skinGrad)"/>
      
      <!-- Serving Tray & Coffee Cup -->
      <g transform="translate(25, -22)">
        <!-- Tray -->
        <ellipse cx="12" cy="15" rx="18" ry="5" fill="#94a3b8" filter="url(#softShadow)"/>
        <!-- Ceramic Coffee Mug -->
        <rect x="4" y="-3" width="16" height="15" rx="3" fill="#ffffff"/>
        <path d="M20 2 C23 2 24 5 24 7 C24 9 23 11 20 11" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <!-- Heart Latte Art on Cup -->
        <path d="M12 4 C11 2 9 2 9 4 C9 6 12 8 12 8 C12 8 15 6 15 4 C15 2 13 2 12 4 Z" fill="#ea580c"/>
        <!-- Energetic Steam Plumes -->
        <path d="M9 -6 C7 -10 13 -13 10 -18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M15 -5 C13 -9 17 -12 15 -16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
      </g>
    </g>

  </g>

  <!-- Atmospheric Sparkles / Energy Embellishments (Showing warmth & friendliness) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M35 85 L37 91 L43 93 L37 95 L35 101 L33 95 L27 93 L33 91 Z" opacity="0.9" transform="scale(0.8) translate(10, 10)"/>
    <!-- Star 2 -->
    <path d="M205 75 L206.5 79.5 L211 81 L206.5 82.5 L205 87 L203.5 82.5 L199 81 L203.5 79.5 Z" opacity="0.7"/>
    <!-- Star 3 -->
    <path d="M180 45 L181 48 L184 49 L181 50 L180 53 L179 50 L176 49 L179 48 Z" opacity="0.8"/>
    <!-- Floating warm bubbles -->
    <circle cx="140" cy="90" r="3" fill="#f43f5e" opacity="0.6"/>
    <circle cx="155" cy="75" r="2" fill="#38bdf8" opacity="0.7"/>
    <circle cx="30" cy="110" r="3.5" fill="#fb923c" opacity="0.8"/>
  </g>

  <!-- Dynamic Foreground Glow Ring for Polish -->
  <circle cx="110" cy="120" r="95" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.15" stroke-dasharray="8 6"/>

</svg>