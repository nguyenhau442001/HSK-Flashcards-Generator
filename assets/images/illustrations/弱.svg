<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" clip-path="url(#canvasClip)" />

  <!-- Room Interior & Environment Props -->
  <!-- Window & Night Sky -->
  <g opacity="0.6">
    <rect x="155" y="30" width="55" height="70" rx="4" fill="#334155" />
    <rect x="160" y="35" width="45" height="60" fill="#0f172a" />
    <!-- Moon & Stars outside -->
    <circle cx="190" cy="50" r="6" fill="#fbbf24" opacity="0.8" />
    <circle cx="170" cy="70" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="180" cy="85" r="1" fill="#ffffff" opacity="0.5" />
  </g>

  <!-- Ambient Light from Lamp -->
  <path d="M75 55 L35 155 L145 155 Z" fill="url(#warmLight)" />

  <!-- Wall Shelf with Medicine Bottle and Plant -->
  <rect x="25" y="65" width="60" height="4" rx="2" fill="#475569" />
  <!-- Medicine Bottle -->
  <rect x="40" y="45" width="12" height="20" rx="2" fill="#ef4444" />
  <rect x="43" y="42" width="6" height="3" rx="1" fill="#f8fafc" />
  <circle cx="46" cy="55" r="3" fill="#f8fafc" />
  <!-- Small Potted Plant -->
  <path d="M68 65 L72 55 L78 55 L82 65 Z" fill="#38bdf8" />
  <path d="M75 55 C70 45 60 48 65 40 C72 45 75 55 75 55 Z" fill="#10b981" />
  <path d="M75 55 C80 45 90 48 85 40 C78 45 75 55 75 55 Z" fill="#059669" />

  <!-- Side Table & Desk Lamp -->
  <path d="M20 185 L50 185 L45 225 L25 225 Z" fill="#334155" />
  <!-- Lamp Base & Stand -->
  <ellipse cx="75" cy="185" rx="15" ry="4" fill="#64748b" />
  <path d="M73 185 L73 140 L77 140 L77 185 Z" fill="#64748b" />
  <!-- Lamp Shade -->
  <path d="M60 140 L90 140 L100 120 L50 120 Z" fill="#fbbf24" />

  <!-- Floor Line -->
  <rect x="0" y="225" width="240" height="15" fill="#090d16" />

  <!-- Main Character (Feeling weak, resting after workout or recovering) -->
  <g transform="translate(10, 15)">
    <!-- Chair / Armchair -->
    <path d="M85 110 C85 90 145 90 145 110 L155 170 C155 180 145 185 135 185 L95 185 C85 185 75 180 75 170 Z" fill="#475569" />
    <path d="M90 115 C90 100 140 100 140 115 L145 165 C145 172 138 175 130 175 L100 175 C92 175 85 172 85 165 Z" fill="#334155" />
    <!-- Chair legs -->
    <rect x="87" y="185" width="6" height="30" rx="3" fill="#1e293b" />
    <rect x="137" y="185" width="6" height="30" rx="3" fill="#1e293b" />

    <!-- Character Body Slumped -->
    <!-- Legs in sweatpants -->
    <path d="M95 165 Q110 185 125 175 L135 140 L120 135 L105 155 Z" fill="#64748b" />
    
    <!-- Torso slumped backward -->
    <path d="M95 125 C95 105 125 100 135 125 L130 165 C120 170 105 170 95 165 Z" fill="#3b82f6" />

    <!-- Left Arm hanging limply -->
    <path d="M100 125 C90 140 80 160 70 175 C68 178 72 182 76 179 C85 165 95 140 105 130 Z" fill="#cbd5e1" />
    <!-- Hand holding a thermometer or weak pose -->
    <circle cx="68" cy="180" r="4" fill="#fca5a5" />

    <!-- Right Arm resting on armrest -->
    <path d="M130 130 C145 140 155 155 165 160 C169 162 172 158 168 154 C158 145 145 135 135 125 Z" fill="#cbd5e1" />

    <!-- Neck and Head tilted back tiredly -->
    <path d="M110 108 L120 108 L122 120 L108 120 Z" fill="#fca5a5" />
    
    <!-- Head -->
    <circle cx="115" cy="95" r="18" fill="#fca5a5" />

    <!-- Messy / Relaxed Hair -->
    <path d="M98 95 C98 80 110 75 125 82 C132 85 134 95 134 95 C134 95 128 85 118 83 C108 81 101 88 98 95 Z" fill="#334155" />

    <!-- Face details (Tired expression, eyes closed with fatigue arcs, pale cheeks) -->
    <!-- Closed tired eyes -->
    <path d="M106 94 Q111 98 116 94" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M120 94 Q125 98 130 94" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Slight frown / weak mouth -->
    <path d="M115 104 Q118 102 121 104" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Sweat drop showing weakness/illness -->
    <path d="M132 88 C132 88 136 94 136 97 C136 99 134 101 132 101 C130 101 128 99 128 97 C128 94 132 88 132 88 Z" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Foreground details to create depth -->
  <!-- Blanket dropped on the floor -->
  <path d="M60 205 C70 195 100 200 120 210 C140 220 110 235 80 230 C50 225 50 215 60 205 Z" fill="#818cf8" opacity="0.7" />
</svg>