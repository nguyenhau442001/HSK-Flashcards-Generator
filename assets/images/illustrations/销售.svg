<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Interior Wall & Window Background Context -->
  <path d="M20 30 H220 V190 H20 Z" fill="#1e293b" opacity="0.5"/>
  <!-- Window Grid showing city lights outside -->
  <rect x="160" y="45" width="55" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="187" y1="45" x2="187" y2="115" stroke="#334155" stroke-width="1.5"/>
  <line x1="160" y1="80" x2="215" y2="80" stroke="#334155" stroke-width="1.5"/>
  <!-- City lights through window -->
  <circle cx="172" cy="60" r="1.5" fill="#fbbf24"/>
  <circle cx="178" cy="95" r="1.5" fill="#f43f5e"/>
  <circle cx="202" cy="70" r="1.5" fill="#38bdf8"/>
  <circle cx="195" cy="100" r="1.5" fill="#fbbf24"/>

  <!-- Hanging Pendant Light -->
  <path d="M110 15 H130 V25 H110 Z" fill="#475569"/>
  <path d="M120 25 V45" stroke="#64748b" stroke-width="2"/>
  <path d="M95 45 H145 L135 60 H105 Z" fill="#fbbf24" filter="url(#glow)" opacity="0.9"/>
  <path d="M85 60 L120 130 L155 60 Z" fill="#fbbf24" opacity="0.05"/>

  <!-- Office Desk -->
  <path d="M15 170 H225 V185 H15 Z" fill="#334155"/>
  <path d="M25 185 V215 H40 V185 Z" fill="#1e293b"/>
  <path d="M200 185 V215 H215 V185 Z" fill="#1e293b"/>

  <!-- Product Box (The "Product" being sold successfully) -->
  <g transform="translate(30, 130)">
    <path d="M0 15 L20 5 L40 15 L20 25 Z" fill="#f59e0b"/>
    <path d="M0 15 V35 L20 45 V25 Z" fill="#d97706"/>
    <path d="M40 15 V35 L20 45 V25 Z" fill="#fbbf24"/>
    <circle cx="20" cy="22" r="4" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Analytics Dashboard Screen / Large Display -->
  <g transform="translate(65, 75)">
    <!-- Monitor Frame -->
    <rect x="-5" y="-5" width="90" height="95" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Screen Background -->
    <rect x="0" y="0" width="80" height="70" rx="3" fill="#1e293b"/>
    
    <!-- Rising Sales Trend Chart (Showing "销售很好" - Great sales) -->
    <path d="M10 55 L25 45 L42 50 L60 20 L72 15" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M10 55 L25 45 L42 50 L60 20 L72 15 V65 H10 Z" fill="url(#chart-grad)"/>

    <!-- Data Points / Sparkles -->
    <circle cx="60" cy="20" r="3" fill="#38bdf8"/>
    <circle cx="72" cy="15" r="3.5" fill="#10b981"/>

    <!-- Stand -->
    <path d="M35 70 H45 V80 H35 Z" fill="#475569"/>
    <path d="M25 80 H55 V83 H25 Z" fill="#64748b" rx="1"/>
  </g>

  <!-- Happy Character (Business Professional celebrating successful sales) -->
  <g transform="translate(130, 105)">
    <!-- Chair back -->
    <path d="M5 10 H35 V75 H5 Z" fill="#334155" rx="4"/>
    
    <!-- Character Body / Suit -->
    <path d="M-15 75 C-15 50 15 50 15 75 Z" fill="#3b82f6"/>
    <path d="M-5 45 H5 L10 75 H-10 Z" fill="#1e293b"/> <!-- Shirt/Tie area -->
    <path d="M-2 45 L0 60 L2 45 Z" fill="#ef4444"/> <!-- Red Tie -->

    <!-- Character Head -->
    <circle cx="0" cy="25" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M-16 20 C-16 10 -5 8 5 12 C12 15 15 25 15 25 C15 25 5 16 -5 18 C-12 19 -16 20 -16 20 Z" fill="#334155"/>

    <!-- Happy Facial Expression -->
    <path d="M-5 22 Q-3 20 -1 22" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M5 22 Q7 20 9 22" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Big happy smile -->
    <path d="M-4 28 Q0 34 4 28" fill="#e11d48"/>

    <!-- Raised Arms Celebrating Success -->
    <!-- Left Arm -->
    <path d="M-12 50 C-25 40 -30 25 -25 20" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-25" cy="18" r="4" fill="#fbcfe8"/>
    <!-- Right Arm -->
    <path d="M12 50 C25 40 35 25 30 15" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="30" cy="13" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Success / Celebration Elements (Stars, upward arrows) -->
  <g transform="translate(170, 75)">
    <path d="M0 0 L3 -6 L9 -3 L4 2 L6 9 L0 5 L-6 9 L-4 2 L-9 -3 L-3 -6 Z" fill="#fbbf24" filter="url(#glow)" transform="scale(0.8)"/>
  </g>
  <g transform="translate(55, 45)">
    <path d="M0 0 L2 -4 L6 -2 L3 1 L4 6 L0 3 L-4 6 L-3 1 L-6 -2 L-2 -4 Z" fill="#10b981" filter="url(#glow)" transform="scale(0.6)"/>
  </g>

  <!-- Mini Bar Chart Prop on Desk -->
  <g transform="translate(100, 160)">
    <rect x="0" y="10" width="6" height="15" fill="#38bdf8" rx="1"/>
    <rect x="9" y="5" width="6" height="20" fill="#fbbf24" rx="1"/>
    <rect x="18" y="-2" width="6" height="27" fill="url(#bar-grad)" rx="1"/>
    <path d="M-2 25 H24" stroke="#64748b" stroke-width="1.5"/>
  </g>

</svg>