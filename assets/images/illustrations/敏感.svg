<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="redPenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" clip-path="url(#canvasClip)" />

  <!-- Background Environment / Office Interior -->
  <g id="environment">
    <!-- Back wall details / bookshelves -->
    <rect x="30" y="30" width="180" height="90" fill="#131c31" rx="4" />
    <!-- Bookshelf shelves -->
    <rect x="40" y="55" width="70" height="4" fill="#1e293b" />
    <rect x="40" y="85" width="70" height="4" fill="#1e293b" />
    <!-- Mini books -->
    <rect x="45" y="40" width="8" height="15" fill="#3b82f6" rx="1" />
    <rect x="55" y="37" width="10" height="18" fill="#10b981" rx="1" />
    <rect x="67" y="42" width="6" height="13" fill="#f59e0b" rx="1" />
    
    <rect x="45" y="70" width="12" height="15" fill="#ec4899" rx="1" />
    <rect x="60" y="68" width="8" height="17" fill="#6366f1" rx="1" />

    <!-- Window showing night city / subtle blue ambient light -->
    <path d="M 140 35 L 190 35 L 190 100 L 140 100 Z" fill="#1b2a4a" />
    <!-- Window frame -->
    <path d="M 140 35 L 190 35 L 190 100 L 140 100 Z" stroke="#334155" stroke-width="2" fill="none" />
    <line x1="165" y1="35" x2="165" y2="100" stroke="#334155" stroke-width="2" />
    <line x1="140" y1="67" x2="190" y2="67" stroke="#334155" stroke-width="2" />
    <!-- City lights outside -->
    <circle cx="150" cy="50" r="1" fill="#38bdf8" />
    <circle cx="158" cy="80" r="1.5" fill="#f59e0b" />
    <circle cx="180" cy="45" r="1" fill="#ec4899" />
    <circle cx="175" cy="85" r="1" fill="#38bdf8" />

    <!-- Hanging Desk Lamp -->
    <path d="M 180 0 L 180 40" stroke="#64748b" stroke-width="3" />
    <path d="M 165 40 L 195 40 L 205 52 L 155 52 Z" fill="#475569" />
    <ellipse cx="180" cy="52" rx="25" ry="35" fill="url(#lampGlow)" />
  </g>

  <!-- Desk Surface -->
  <rect x="10" y="155" width="220" height="75" fill="url(#deskGrad)" rx="6" />
  <path d="M 10 155 L 230 155" stroke="#475569" stroke-width="2" />

  <!-- Desk Props (Paperwork with red critique marks) -->
  <g id="desk-props">
    <!-- Open Folder / Report -->
    <path d="M 60 170 L 130 160 L 135 205 L 65 215 Z" fill="#f8fafc" />
    <path d="M 65 175 L 125 167" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <path d="M 67 185 L 115 178" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <path d="M 68 195 L 105 190" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    
    <!-- Red Correction Marks (Crucial for "Criticism" context) -->
    <!-- Big Red X / Circles -->
    <path d="M 80 180 L 95 195 M 95 180 L 80 195" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <path d="M 100 170 C 105 168 112 172 110 178" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Red glowing aura over document -->
    <ellipse cx="90" cy="185" rx="30" ry="15" fill="url(#redPenGlow)" />

    <!-- Coffee Mug -->
    <rect x="180" y="170" width="22" height="28" fill="#e2e8f0" rx="3" />
    <path d="M 202 176 C 210 176 210 190 202 190" stroke="#e2e8f0" stroke-width="3" fill="none" />
    <!-- Steam -->
    <path d="M 188 162 C 185 158 193 154 190 150" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Main Character (Man showing extreme sensitivity/hurt/defensiveness to criticism) -->
  <g id="main-character">
    <!-- Character Body / Torso & Hoodie -->
    <path d="M 95 210 C 95 180 110 165 135 165 C 160 165 175 180 175 210 Z" fill="#3b82f6" />
    <!-- Hoodie Strings -->
    <path d="M 125 175 L 122 195" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
    <path d="M 145 175 L 148 195" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
    <!-- Hoodie Collar / Hood behind head -->
    <path d="M 110 140 C 105 125 120 115 135 115 C 150 115 165 125 160 140 Z" fill="#2563eb" />

    <!-- Neck -->
    <rect x="125" y="125" width="20" height="20" fill="#f1d0b5" />

    <!-- Head & Face (Expressing emotional shock/hurt/sensitivity) -->
    <circle cx="135" cy="110" r="28" fill="#fbd5b5" />

    <!-- Hair (Stylish dark messy hair) -->
    <path d="M 108 105 C 107 88 120 80 135 82 C 150 80 163 88 162 105 C 165 95 155 85 135 85 C 115 85 105 95 108 105 Z" fill="#1e293b" />
    <path d="M 110 102 L 120 92 L 128 98 L 138 90 L 145 96 L 158 92" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Eye Brows (Tilted upward dynamically, showing upset/defensive state) -->
    <path d="M 115 102 L 128 106" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 142 106 L 155 102" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Wide, expressive, slightly tearful/hurt) -->
    <circle cx="122" cy="111" r="3.5" fill="#1e293b" />
    <circle cx="148" cy="111" r="3.5" fill="#1e293b" />
    <!-- Highlight in eyes -->
    <circle cx="123.5" cy="110" r="1" fill="#ffffff" />
    <circle cx="149.5" cy="110" r="1" fill="#ffffff" />
    <!-- Tear drop of sensitivity -->
    <path d="M 151 115 C 151 117 149 119 148 119 C 147 119 145 117 145 115 C 145 113 148 111 148 111 C 148 111 151 113 151 115 Z" fill="#38bdf8" />

    <!-- Mouth (Trembling / tight line of reaction) -->
    <path d="M 126 126 C 131 123 139 123 144 126" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Rosy Sensitive Cheeks / Emotional flush -->
    <ellipse cx="116" cy="117" rx="5" ry="3" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="154" cy="117" rx="5" ry="3" fill="#f43f5e" opacity="0.4" />

    <!-- Hands in defense/reaction near chest or head -->
    <!-- Left Hand reacting near chin/chest -->
    <circle cx="115" cy="155" r="8" fill="#fbd5b5" />
    <path d="M 105 168 L 120 160 L 125 175 Z" fill="#3b82f6" />
    <!-- Right Hand clutching shoulder/neck defensively -->
    <circle cx="158" cy="145" r="8" fill="#fbd5b5" />
    <path d="M 155 165 L 168 155 L 160 145 Z" fill="#3b82f6" />
  </g>

  <!-- Floating Visual Metaphor for "Criticism / Words" bouncing off or affecting him -->
  <g id="criticism-symbols">
    <!-- Abstract sharp speech bubbles / harsh critique elements floating near him -->
    <!-- Speech bubble 1 (sharp red-tinted) -->
    <path d="M 65 115 L 85 105 L 80 125 L 68 122 L 60 130 Z" fill="#ef4444" opacity="0.8" />
    <path d="M 70 113 L 78 118 M 78 113 L 70 118" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Speech bubble 2 (exclamation mark of warning/harsh feedback) -->
    <path d="M 180 100 L 195 90 L 190 115 Z" fill="#f59e0b" opacity="0.8" />
    <circle cx="188" cy="98" r="1.5" fill="#ffffff" />
    <line x1="188" y1="102" x2="188" y2="108" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Impact shockwaves / vibration lines around head indicating high sensitivity -->
    <path d="M 98 95 C 95 100 95 115 98 120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 172 95 C 175 100 175 115 172 120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

</svg>