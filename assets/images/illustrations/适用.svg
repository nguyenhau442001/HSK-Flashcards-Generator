<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk Surface -->
  <rect x="20" y="140" width="200" height="80" rx="8" fill="#334155"/>
  
  <!-- Characters -->
  <!-- Person 1 (Manager) -->
  <circle cx="60" cy="100" r="20" fill="#fde68a"/>
  <path d="M45 120 Q60 140 75 120" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <rect x="40" y="130" width="40" height="40" rx="5" fill="#38bdf8"/>
  
  <!-- Person 2 (Employee) -->
  <circle cx="180" cy="100" r="20" fill="#fde68a"/>
  <path d="M165 120 Q180 140 195 120" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <rect x="160" y="130" width="40" height="40" rx="5" fill="#ec4899"/>

  <!-- The "Regulation" Document -->
  <rect x="95" y="150" width="50" height="60" rx="2" fill="#f8fafc"/>
  <line x1="105" y1="165" x2="135" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <line x1="105" y1="175" x2="135" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="105" y1="185" x2="125" y2="185" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Universal Application Symbol (Checkmarks) -->
  <path d="M100 100 L110 110 L130 90" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M110 100 L120 110 L140 90" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Background Decor -->
  <circle cx="200" cy="40" r="10" fill="#fbbf24" opacity="0.3"/>
  <rect x="30" y="30" width="40" height="5" rx="2" fill="#475569"/>
  <rect x="30" y="45" width="30" height="5" rx="2" fill="#475569"/>
</svg>