  <rect x="175" y="45" width="45" height="60" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <circle cx="197" cy="65" r="8" fill="#f59e0b" opacity="0.8"/>
  <path d="M185 90 Q197 80 209 90" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>

