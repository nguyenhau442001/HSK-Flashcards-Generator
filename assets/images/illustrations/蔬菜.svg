  <line x1="35" y1="40" x2="35" y2="55" stroke="#64748b" stroke-width="2"/>
  <circle cx="35" cy="57" r="5" fill="#10b981"/>
  <line x1="75" y1="40" x2="75" y2="52" stroke="#64748b" stroke-width="2"/>
  <path d="M67 52 H83 V58 C83 62 79 65 75 65 C71 65 67 62 67 58 Z" fill="#f43f5e"/>

