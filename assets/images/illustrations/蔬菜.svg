  <path d="M90 180 C88 173 95 170 98 176 Z" fill="#fbcfe8"/>
  <!-- Right hand holding chopsticks -->
  <path d="M135 168 L158 152" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
