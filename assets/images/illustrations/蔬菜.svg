  <path d="M147 140 C149 155 144 170 138 175 C138 175 143 160 142 145 Z" fill="#1e293b"/>

  <!-- Friendly Face Expressions -->
  <!-- Blushing cheeks -->
  <circle cx="102" cy="153" r="5" fill="#fda4af" opacity="0.6"/>
  <circle cx="138" cy="153" r="5" fill="#fda4af" opacity="0.6"/>

