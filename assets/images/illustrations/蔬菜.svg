  <path d="M75 115 L77 122 L84 124 L77 126 L75 133 L73 126 L66 124 L73 122 Z" fill="#fbbf24"/>
  <path d="M155 85 L156 89 L160 90 L156 91 L155 95 L154 91 L150 90 L154 89 Z" fill="#38bdf8"/>
