<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Peak/Trophy Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Decorative Stars / Confetti (Atmospheric depth) -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="35" cy="45" r="2" />
    <circle cx="205" cy="55" r="1.5" />
    <circle cx="180" cy="30" r="2.5" />
    <circle cx="60" cy="80" r="1.5" />
  </g>
  
  <g fill="#38bdf8" opacity="0.5">
    <circle cx="40" cy="120" r="2" />
    <circle cx="200" cy="140" r="2" />
  </g>

  <!-- Ambient Glow Behind Peak -->
  <circle cx="120" cy="115" r="50" fill="#fbbf24" opacity="0.15" filter="url(#glow)" />
  <circle cx="120" cy="115" r="30" fill="#fbbf24" opacity="0.25" filter="url(#glow)" />

  <!-- Mountain Landscape (Context Environment) -->
  <!-- Back Mountain Range -->
  <polygon points="20,190 90,110 160,190" fill="#1e293b" opacity="0.7"/>
  <polygon points="100,190 160,120 220,190" fill="#1e293b" opacity="0.5"/>

  <!-- Main Climbing Mountain -->
  <polygon points="40,210 120,80 200,210" fill="url(#mountainGrad)" filter="url(#shadow)" />
  <!-- Mountain Face Highlight / Polygon -->
  <polygon points="120,80 200,210 120,210" fill="#0f172a" opacity="0.4" />

  <!-- Summit Flag Pole & Flag (Reaching the top / Success) -->
  <line x1="120" y1="80" x2="120" y2="45" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <polygon points="120,45 155,57 120,69" fill="#10b981" filter="url(#shadow)" />
  <!-- Flag detail -->
  <polygon points="120,45 138,51 120,57" fill="#34d399" />

  <!-- Path / Trail leading to the top -->
  <path d="M 70,200 Q 110,170 95,140 T 130,105 T 120,80" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Climber / Hero Character (Successful Adventurer) -->
  <g transform="translate(112, 95)" filter="url(#shadow)">
    <!-- Climber Body/Bag -->
    <circle cx="8" cy="6" r="5" fill="#f8fafc" /> <!-- Head/Helmet -->
    <path d="M 3,12 C 3,10 13,10 13,12 L 15,22 C 15,24 1,24 3,22 Z" fill="#ec4899" /> <!-- Torso & Backpack -->
    <!-- Arms raised in victory -->
    <path d="M 3,13 L -2,8" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 13,13 L 18,8" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Dynamic Elements: Golden Trophy & Confetti Burst (Celebrating Success) -->
  <!-- Trophy Base -->
  <path d="M 100,205 L 140,205 L 135,195 L 105,195 Z" fill="#64748b" />
  <rect x="112" y="190" width="16" height="5" fill="#94a3b8" rx="1" />

  <!-- Trophy Cup -->
  <path d="M 107,150 C 107,175 133,175 133,150 L 135,150 C 135,138 125,135 120,135 C 115,135 105,138 105,150 Z" fill="url(#goldGrad)" filter="url(#shadow)" />
  <!-- Trophy Rim -->
  <ellipse cx="120" cy="135" rx="15" ry="4" fill="#fef08a" />
  <!-- Trophy Handles -->
  <path d="M 107,140 C 98,140 98,155 107,160" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <path d="M 133,140 C 142,140 142,155 133,160" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <!-- Trophy Star Emboss -->
  <polygon points="120,143 122,148 127,148 123,151 125,156 120,153 115,156 117,151 113,148 118,148" fill="#fff" opacity="0.8" />

  <!-- Floating Success Stars / Sparks around Trophy -->
  <g transform="translate(120, 115)">
    <!-- Top Large Star -->
    <path d="M 0,-15 L 3,-6 L 12,-4 L 5,2 L 7,11 L 0,6 L -7,11 L -5,2 L -12,-4 L -3,-6 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- Left Small Star -->
    <path d="M -35,-5 L -33,-1 L -29,0 L -33,1 L -35,5 L -37,1 L -41,0 L -37,-1 Z" fill="#38bdf8" />
    <!-- Right Small Star -->
    <path d="M 35,-10 L 37,-6 L 41,-5 L 37,-4 L 35,0 L 33,-4 L 29,-5 L 33,-6 Z" fill="#10b981" />
  </g>

  <!-- Dynamic Confetti / Streamers (Action-packed celebration) -->
  <path d="M 75,130 Q 85,115 95,125" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
  <path d="M 165,135 Q 155,120 145,130" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  
  <rect x="65" y="150" width="6" height="4" rx="1" fill="#fb923c" transform="rotate(25 68 152)" />
  <rect x="170" y="155" width="5" height="7" rx="1" fill="#f43f5e" transform="rotate(-30 172 158)" />
  <rect x="90" y="95" width="4" height="6" rx="1" fill="#34d399" transform="rotate(45 92 98)" />
  <rect x="150" y="100" width="6" height="4" rx="1" fill="#fbbf24" transform="rotate(-15 153 102)" />

  <!-- Ground Plane / Foreground Base -->
  <path d="M 0,210 Q 120,200 240,210 L 240,240 L 0,240 Z" fill="#0f172a" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" />

</svg>