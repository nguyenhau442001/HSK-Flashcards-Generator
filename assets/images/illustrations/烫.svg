<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="steamGlow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="soupGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <clipPath id="bowlClip">
      <path d="M 60,140 Q 60,195 120,195 Q 180,195 180,140 Z"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient glow behind bowl -->
  <circle cx="120" cy="130" r="80" fill="url(#steamGlow)"/>

  <!-- Background Interior Elements -->
  <!-- Wooden table surface -->
  <path d="M 10,185 L 230,185 L 230,230 L 10,230 Z" fill="#0f172a"/>
  <rect x="0" y="180" width="240" height="6" fill="#334155" rx="3"/>

  <!-- Restaurant/Home Wall details -->
  <rect x="40" y="45" width="160" height="110" rx="8" fill="#1e293b" opacity="0.4"/>
  <!-- Warm window glow in background -->
  <rect x="95" y="30" width="50" height="70" rx="4" fill="#fbbf24" opacity="0.1"/>

  <!-- Rising Steam (indicating high temperature '烫') -->
  <g fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 100,110 Q 90,90 105,75 T 100,40" />
    <path d="M 120,115 Q 135,95 115,75 T 125,35" stroke-width="3" opacity="0.9"/>
    <path d="M 140,110 Q 150,90 135,75 T 140,45" />
  </g>
  
  <!-- Heat waves (shimmer effect) -->
  <path d="M 80,125 Q 85,120 80,115" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 160,125 Q 155,120 160,115" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Soup Bowl & Contents -->
  <!-- Bowl Outer (Shadow/Rim) -->
  <ellipse cx="120" cy="140" rx="62" ry="16" fill="#cbd5e1"/>
  <!-- Bowl Body -->
  <path d="M 58,140 Q 58,200 120,200 Q 182,200 182,140 Z" fill="#e2e8f0"/>
  <!-- Bowl Inner Soup -->
  <ellipse cx="120" cy="142" rx="58" ry="13" fill="url(#soupGrad)"/>
  
  <!-- Soup Ingredients/Details -->
  <circle cx="105" cy="144" r="5" fill="#facc15"/>
  <circle cx="135" cy="140" r="4" fill="#4ade80"/>
  <path d="M 115,147 Q 122,150 128,143" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>

  <!-- Bowl Highlight/Rim Interior -->
  <path d="M 62,140 Q 62,192 120,192 Q 178,192 178,140 Q 178,135 120,135 Q 62,135 62,140 Z" fill="#f1f5f9" opacity="0.2"/>

  <!-- Character Reacting with Caution (Hands up, leaning back slightly) -->
  <g transform="translate(0, 5)">
    <!-- Character Body / Shoulders -->
    <path d="M 75,200 L 90,165 L 150,165 L 165,200 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt detail -->
    <path d="M 105,165 L 120,178 L 135,165 Z" fill="#f8fafc"/>

    <!-- Neck -->
    <rect x="111" y="150" width="18" height="20" rx="6" fill="#ffedd5"/>

    <!-- Head -->
    <circle cx="120" cy="125" r="24" fill="#ffedd5"/>
    
    <!-- Hair -->
    <path d="M 96,125 C 96,105 110,100 125,100 C 142,100 146,112 146,125 C 140,118 132,116 120,116 C 108,116 102,120 96,125 Z" fill="#334155"/>

    <!-- Expressive Face (Surprised / Warning expression) -->
    <!-- Eyebrows raised -->
    <path d="M 106,117 Q 112,113 118,117" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M 122,117 Q 128,113 134,117" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Eyes (Wide, alert) -->
    <circle cx="112" cy="124" r="3" fill="#1e293b"/>
    <circle cx="128" cy="124" r="3" fill="#1e293b"/>

    <!-- Open mouth (expressing caution/blow air "ooh") -->
    <ellipse cx="120" cy="136" rx="4" ry="5" fill="#1e293b"/>

    <!-- Sweat drop (classic reaction trope for hot/nervous) -->
    <path d="M 142,120 Q 146,126 142,130 Q 138,126 142,120 Z" fill="#38bdf8"/>

    <!-- Arms gesturing "Stop / Be careful" -->
    <!-- Left arm -->
    <path d="M 85,170 Q 65,160 55,140" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <!-- Left hand (stop palm) -->
    <circle cx="53" cy="136" r="6" fill="#ffedd5"/>

    <!-- Right arm -->
    <path d="M 155,170 Q 175,160 185,140" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <!-- Right hand -->
    <circle cx="187" cy="136" r="6" fill="#ffedd5"/>
  </g>

  <!-- Cute Chopsticks resting on a holder -->
  <rect x="145" y="195" width="45" height="4" rx="2" fill="#fbbf24" transform="rotate(-10 145 195)"/>
  <rect x="145" y="203" width="45" height="4" rx="2" fill="#f59e0b" transform="rotate(-10 145 203)"/>
  <ellipse cx="138" cy="201" rx="5" ry="4" fill="#cbd5e1"/>

</svg>