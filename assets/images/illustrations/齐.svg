<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <rect x="20" y="180" width="200" height="4" rx="2" fill="#334155"/>
  
  <!-- Characters: Three people working together to lift a heavy wooden beam -->
  <!-- Person 1 -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M10 40 L15 80 M30 40 L35 80" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 50 L35 50" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(100, 90)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M10 40 L15 80 M30 40 L35 80" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 50 L35 50" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(160, 100)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M10 40 L15 80 M30 40 L35 80" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 50 L35 50" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- The Task: A heavy beam being lifted -->
  <rect x="30" y="130" width="180" height="20" rx="4" fill="#fb923c"/>
  
  <!-- Background elements: Construction site context -->
  <path d="M20 180 L20 140 L40 140 L40 180" fill="#475569" opacity="0.3"/>
  <path d="M200 180 L200 140 L220 140 L220 180" fill="#475569" opacity="0.3"/>
  
  <!-- Decorative sparks/energy -->
  <circle cx="120" cy="70" r="3" fill="#f59e0b"/>
  <circle cx="140" cy="60" r="2" fill="#f59e0b"/>
  <circle cx="100" cy="65" r="2" fill="#f59e0b"/>
</svg>