<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Bar Lights -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Accent Glows -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glass Highlights -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light from Ceiling Pendants -->
  <circle cx="90" cy="90" r="60" fill="url(#lamp-glow)" />
  <circle cx="160" cy="80" r="50" fill="url(#lamp-glow)" />

  <!-- BACKGROUND: Bar Interior & Shelves -->
  <g id="bar-shelves">
    <!-- Back wall panels -->
    <rect x="20" y="30" width="200" height="95" fill="#172554" rx="4" />
    <!-- Glowing shelf lines -->
    <rect x="30" y="60" width="120" height="4" fill="#334155" rx="2" />
    <rect x="30" y="90" width="120" height="4" fill="#334155" rx="2" />
    
    <!-- Colorful Bottles on Shelves -->
    <!-- Shelf 1 -->
    <rect x="40" y="42" width="10" height="18" fill="#ec4899" rx="2" />
    <rect x="55" y="38" width="12" height="22" fill="#10b981" rx="2" />
    <rect x="72" y="45" width="8" height="15" fill="#f59e0b" rx="2" />
    <rect x="85" y="40" width="14" height="20" fill="#38bdf8" rx="2" />
    <rect x="105" y="43" width="9" height="17" fill="#8b5cf6" rx="2" />

    <!-- Shelf 2 -->
    <rect x="45" y="72" width="12" height="18" fill="#f43f5e" rx="2" />
    <rect x="62" y="68" width="10" height="22" fill="#0ea5e9" rx="2" />
    <rect x="78" y="75" width="14" height="15" fill="#10b981" rx="2" />
    <rect x="98" y="70" width="11" height="20" fill="#fbbf24" rx="2" />
  </g>

  <!-- Ambient Neon Wall Strip -->
  <path d="M 20 120 L 220 120" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.7" filter="url(#neon-glow)" />
  <path d="M 20 122 L 220 122" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />

  <!-- PENDANT LIGHTS (Left & Right) -->
  <g id="pendant-lights">
    <line x1="90" y1="0" x2="90" y2="40" stroke="#475569" stroke-width="2" />
    <path d="M 75 40 L 105 40 L 100 50 L 80 50 Z" fill="#64748b" />
    <polygon points="80,50 100,50 105,75 75,75" fill="#fbbf24" opacity="0.9" />

    <line x1="160" y1="0" x2="160" y2="30" stroke="#475569" stroke-width="2" />
    <path d="M 148 30 L 172 30 L 168 38 L 152 38 Z" fill="#64748b" />
    <polygon points="152,38 168,38 172,60 148,60" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- FOREGROUND: BAR COUNTER -->
  <g id="bar-counter">
    <!-- Counter Surface -->
    <polygon points="10,135 230,135 240,195 0,195" fill="#0f172a" />
    <!-- Counter Top Edge (Highlight) -->
    <polygon points="10,130 230,130 230,135 10,135" fill="#334155" />
    <polygon points="0,132 240,132 240,135 0,135" fill="#64748b" />
    <!-- Counter Front Panel (Wood/Dark texture with ambient neon glow) -->
    <rect x="0" y="195" width="240" height="45" fill="#090d16" />
    <path d="M 0 195 L 240 195" stroke="#38bdf8" stroke-width="2" opacity="0.4" filter="url(#neon-glow)" />
  </g>

  <!-- GLASSES OF DRINKS (The "喝一杯" focal props) -->
  <g id="drinks">
    <!-- Glass 1 (Left Friend) -->
    <path d="M 70 115 L 82 115 L 80 132 L 72 132 Z" fill="url(#glass-grad)" />
    <!-- Liquid inside Glass 1 -->
    <path d="M 72 121 L 80 121 L 79 131 L 73 131 Z" fill="#f59e0b" opacity="0.85" />
    <ellipse cx="76" cy="121" rx="4" ry="1" fill="#fbbf24" />
    
    <!-- Glass 2 (Right Friend - Toasting) -->
    <path d="M 152 112 L 164 112 L 162 130 L 154 130 Z" fill="url(#glass-grad)" />
    <!-- Liquid inside Glass 2 -->
    <path d="M 153 118 L 163 118 L 161 129 L 155 129 Z" fill="#f43f5e" opacity="0.85" />
    <ellipse cx="158" cy="118" rx="5" ry="1" fill="#fda4af" />
  </g>

  <!-- CHARACTERS -->
  <!-- Character Left (Male, Friendly, Raising drink) -->
  <g id="character-left">
    <!-- Body/Torso -->
    <path d="M 45,170 Q 55,130 75,130 Q 95,130 105,170 Z" fill="#1e40af" />
    <!-- Head & Hair -->
    <circle cx="75" cy="110" r="16" fill="#fcd34d" />
    <path d="M 59,106 Q 75,90 91,102 Q 88,116 75,114 Z" fill="#1e293b" />
    <!-- Smiling Face Expression -->
    <circle cx="71" cy="108" r="1.5" fill="#1e293b" />
    <circle cx="79" cy="108" r="1.5" fill="#1e293b" />
    <path d="M 73,113 Q 75,116 77,113" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Arm raising glass -->
    <path d="M 60,135 Q 65,115 73,115" stroke="#1e40af" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="73" cy="115" r="4" fill="#fcd34d" />
  </g>

  <!-- Character Right (Female, Cheerful, Toasting) -->
  <g id="character-right">
    <!-- Body/Torso -->
    <path d="M 135,170 Q 145,130 165,130 Q 185,130 195,170 Z" fill="#db2777" />
    <!-- Head & Hair -->
    <circle cx="165" cy="108" r="15" fill="#fcd34d" />
    <!-- Ponytail / Hair styling -->
    <path d="M 178,105 Q 190,110 185,125 Q 175,118 172,112 Z" fill="#451a03" />
    <path d="M 150,102 Q 165,92 180,102 Q 175,112 165,112 Z" fill="#451a03" />
    <!-- Happy Face -->
    <circle cx="161" cy="106" r="1.5" fill="#1e293b" />
    <circle cx="169" cy="106" r="1.5" fill="#1e293b" />
    <path d="M 163,111 Q 165,114 167,111" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Arm clinking glass -->
    <path d="M 180,135 Q 168,115 160,113" stroke="#db2777" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="160" cy="113" r="4" fill="#fcd34d" />
  </g>

  <!-- Atmospheric Sparkles / Cheers effect -->
  <g id="sparkles" fill="#fbbf24">
    <path d="M 115,95 L 117,100 L 122,102 L 117,104 L 115,109 L 113,104 L 108,102 L 113,100 Z" opacity="0.9" />
    <path d="M 125,115 L 126,118 L 129,119 L 126,120 L 125,123 L 124,120 L 121,119 L 124,118 Z" opacity="0.6" />
    <circle cx="100" cy="120" r="1.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="138" cy="105" r="2" fill="#f43f5e" opacity="0.8" />
  </g>
</svg>