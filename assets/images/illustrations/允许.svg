<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Classroom Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  
  <!-- Teacher -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="10" y="35" width="20" height="40" rx="4" fill="#38bdf8"/>
    <path d="M10 45 L0 60 M40 45 L50 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M15 75 L15 110 M25 75 L25 110" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Gesture of Permission (Open hand) -->
    <circle cx="55" cy="50" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Student -->
  <g transform="translate(50, 100)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="10" y="35" width="20" height="40" rx="4" fill="#ec4899"/>
    <path d="M10 45 L-5 55 M30 45 L45 55" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <path d="M15 75 L15 110 M25 75 L25 110" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Doorway/Exit -->
  <rect x="180" y="60" width="40" height="120" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="210" cy="120" r="4" fill="#fbbf24"/>
  
  <!-- Desk -->
  <rect x="20" y="150" width="80" height="10" fill="#fbbf24" rx="2"/>
  <rect x="30" y="160" width="10" height="20" fill="#fbbf24"/>
  <rect x="80" y="160" width="10" height="20" fill="#fbbf24"/>
  
  <!-- Clock on wall -->
  <circle cx="120" cy="40" r="15" fill="#334155" stroke="#fbbf24" stroke-width="2"/>
  <line x1="120" y1="40" x2="120" y2="30" stroke="#fbbf24" stroke-width="2"/>
  <line x1="120" y1="40" x2="130" y2="40" stroke="#fbbf24" stroke-width="2"/>
</svg>