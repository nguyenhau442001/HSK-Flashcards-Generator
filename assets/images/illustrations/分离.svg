<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Environment: Train Station Platform -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <rect x="20" y="180" width="200" height="4" fill="#475569"/>
  <rect x="20" y="195" width="200" height="4" fill="#475569"/>
  
  <!-- Clock showing passage of time -->
  <circle cx="120" cy="40" r="25" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <path d="M120 20 L120 40 L135 40" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <circle cx="120" cy="40" r="2" fill="#fbbf24"/>
  
  <!-- Character 1 (Left) -->
  <g transform="translate(60, 100)">
    <circle cx="0" cy="0" r="15" fill="#f59e0b"/>
    <path d="M-20 20 L20 20 L15 80 L-15 80 Z" fill="#38bdf8"/>
    <rect x="-15" y="80" width="10" height="40" fill="#38bdf8"/>
    <rect x="5" y="80" width="10" height="40" fill="#38bdf8"/>
  </g>
  
  <!-- Character 2 (Right) -->
  <g transform="translate(180, 100)">
    <circle cx="0" cy="0" r="15" fill="#ec4899"/>
    <path d="M-20 20 L20 20 L15 80 L-15 80 Z" fill="#10b981"/>
    <rect x="-15" y="80" width="10" height="40" fill="#10b981"/>
    <rect x="5" y="80" width="10" height="40" fill="#10b981"/>
  </g>
  
  <!-- Reunion Action: Reaching out -->
  <path d="M75 110 Q120 90 165 110" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Suitcase (Symbol of travel/separation) -->
  <rect x="30" y="140" width="20" height="15" rx="2" fill="#fb923c"/>
  <rect x="190" y="140" width="20" height="15" rx="2" fill="#fb923c"/>
  
  <!-- Ambient light particles -->
  <circle cx="100" cy="70" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="140" cy="80" r="3" fill="#fbbf24" opacity="0.4"/>
  <circle cx="120" cy="120" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>