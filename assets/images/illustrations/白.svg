<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Snowflakes -->
  <circle cx="40" cy="50" r="2" fill="#f8fafc" opacity="0.6"/>
  <circle cx="180" cy="30" r="3" fill="#f8fafc" opacity="0.8"/>
  <circle cx="210" cy="120" r="2" fill="#f8fafc" opacity="0.5"/>
  <circle cx="60" cy="180" r="3" fill="#f8fafc" opacity="0.7"/>

  <!-- Character -->
  <g transform="translate(60, 40)">
    <!-- Coat (White) -->
    <path d="M40 60 L100 60 L110 160 L30 160 Z" fill="#f8fafc"/>
    <path d="M45 65 L95 65 L90 155 L50 155 Z" fill="#e2e8f0"/>
    
    <!-- Scarf -->
    <path d="M35 55 Q70 45 105 55 L100 70 Q70 60 40 70 Z" fill="#fb923c"/>
    
    <!-- Head -->
    <circle cx="70" cy="40" r="30" fill="#fcd34d"/>
    <!-- Face -->
    <circle cx="60" cy="35" r="3" fill="#1e293b"/>
    <circle cx="80" cy="35" r="3" fill="#1e293b"/>
    <path d="M60 50 Q70 55 80 50" stroke="#1e293b" stroke-width="2" fill="none"/>
    
    <!-- Hair -->
    <path d="M45 25 Q70 5 95 25 Q80 15 70 15 Q60 15 45 25" fill="#1e293b"/>
  </g>

  <!-- Ground/Snow -->
  <path d="M0 200 Q120 180 240 200 L240 240 L0 240 Z" fill="#f1f5f9"/>
  
  <!-- Accents -->
  <circle cx="190" cy="190" r="15" fill="#38bdf8" opacity="0.2"/>
  <circle cx="30" cy="210" r="10" fill="#10b981" opacity="0.2"/>
</svg>