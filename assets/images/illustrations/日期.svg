<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- UI/Clipboard Gradients -->
    <linearGradient id="calendar-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="160" cy="70" r="90" fill="url(#lamp-glow)" />

  <!-- ENVIRONMENT / BACKGROUND PROPS -->
  <!-- Bookshelf / Wall detail -->
  <rect x="25" y="45" width="40" height="8" rx="2" fill="#334155" />
  <rect x="30" y="30" width="12" height="15" rx="1" fill="#38bdf8" opacity="0.6" />
  <rect x="44" y="33" width="10" height="12" rx="1" fill="#ec4899" opacity="0.6" />
  <rect x="20" y="85" width="200" height="4" rx="2" fill="#334155" opacity="0.5" />

  <!-- Desk Surface -->
  <path d="M 10 180 L 230 180 L 220 220 L 20 220 Z" fill="#0f172a" />
  <rect x="0" y="175" width="240" height="8" rx="2" fill="#334155" />

  <!-- Laptop / Study Setup -->
  <g transform="translate(145, 125)">
    <!-- Laptop Base -->
    <path d="M -25 45 L 65 45 L 55 55 L -15 55 Z" fill="#64748b" />
    <path d="M -15 55 L 55 55 L 57 58 L -17 58 Z" fill="#475569" />
    <!-- Laptop Screen (Exam portal / calendar graphics) -->
    <rect x="-20" y="0" width="80" height="47" rx="4" fill="#334155" />
    <rect x="-16" y="4" width="72" height="39" rx="2" fill="url(#screen-grad)" />
    <!-- Abstract UI bars on screen -->
    <rect x="-10" y="10" width="40" height="4" rx="2" fill="#38bdf8" />
    <rect x="-10" y="18" width="60" height="3" rx="1.5" fill="#94a3b8" opacity="0.6" />
    <rect x="-10" y="24" width="50" height="3" rx="1.5" fill="#94a3b8" opacity="0.6" />
    <circle cx="35" cy="32" r="6" fill="#10b981" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#cbd5e1" />
    <path d="M 16 4 C 21 4 21 14 16 14" stroke="#cbd5e1" stroke-width="2.5" fill="none" />
    <path d="M 4 -3 C 6 -6 10 -6 12 -3" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- Desk Lamp -->
  <path d="M 195 175 L 205 175 L 200 110 Z" fill="#475569" />
  <path d="M 180 112 C 190 95 210 95 220 112 Z" fill="#f59e0b" />
  <ellipse cx="200" cy="112" rx="20" ry="6" fill="#d97706" />

  <!-- CHARACTER 1: Student / Inquirer (Left, asking) -->
  <g transform="translate(15, 65)">
    <!-- Body / Hoodie -->
    <path d="M 25 70 C 25 55 45 50 60 65 L 75 115 L 5 115 Z" fill="#38bdf8" />
    <!-- Head & Hair -->
    <circle cx="45" cy="35" r="18" fill="#fbcfe8" />
    <!-- Hair style -->
    <path d="M 27 33 C 28 18 60 18 63 32 C 60 27 33 27 27 33 Z" fill="#0f172a" />
    <path d="M 28 32 C 28 22 45 20 50 22 C 40 25 35 30 28 32 Z" fill="#0f172a" />
    <!-- Face expression (curious/asking) -->
    <circle cx="40" cy="36" r="1.5" fill="#1e293b" />
    <circle cx="51" cy="36" r="1.5" fill="#1e293b" />
    <path d="M 44 42 Q 46 45 48 42" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Pointing / Asking gesture arm -->
    <path d="M 55 70 L 78 80 L 72 88" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="75" cy="85" r="4" fill="#fbcfe8" />
  </g>

  <!-- CHARACTER 2: Teacher / Friend explaining (Right, pointing to calendar) -->
  <g transform="translate(110, 50)">
    <!-- Body / Sweater -->
    <path d="M 35 85 C 35 70 55 65 70 85 L 85 130 L 20 130 Z" fill="#10b981" />
    <!-- Head & Hair -->
    <circle cx="50" cy="45" r="19" fill="#fde68a" />
    <path d="M 31 45 C 31 25 69 25 69 45 C 60 38 40 38 31 45 Z" fill="#b45309" />
    <!-- Friendly face -->
    <circle cx="44" cy="46" r="1.5" fill="#1e293b" />
    <circle cx="56" cy="46" r="1.5" fill="#1e293b" />
    <path d="M 48 52 Q 50 55 52 52" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    
    <!-- Arm pointing forward -->
    <path d="M 35 85 L 4 95 L -2 90" stroke="#10b981" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="-5" cy="88" r="4.5" fill="#fde68a" />
  </g>

  <!-- CENTRAL PROP: THE CALENDAR / "DATE" (日期) FOCUS -->
  <g transform="translate(75, 45)">
    <!-- Calendar Clip / Holder -->
    <rect x="25" y="-5" width="40" height="12" rx="4" fill="#64748b" />
    <rect x="33" y="-10" width="6" height="8" rx="2" fill="#cbd5e1" />
    <rect x="51" y="-10" width="6" height="8" rx="2" fill="#cbd5e1" />

    <!-- Calendar Main Body -->
    <rect x="10" y="5" width="70" height="80" rx="8" fill="#ffffff" />
    
    <!-- Calendar Header banner (Red/Pink for attention) -->
    <path d="M 10 13 C 10 9 13 6 17 6 L 73 6 C 77 6 80 9 80 13 L 80 30 L 10 30 Z" fill="url(#calendar-header)" />
    
    <!-- Calendar Rings / Binding holes -->
    <circle cx="30" cy="18" r="3" fill="#ffffff" />
    <circle cx="60" cy="18" r="3" fill="#ffffff" />

    <!-- Grid of Dates (Representing 'Date' / 日期 concept clearly) -->
    <!-- Row 1 -->
    <rect x="18" y="38" width="10" height="10" rx="2" fill="#e2e8f0" />
    <rect x="32" y="38" width="10" height="10" rx="2" fill="#e2e8f0" />
    <rect x="46" y="38" width="10" height="10" rx="2" fill="#e2e8f0" />
    <rect x="60" y="38" width="10" height="10" rx="2" fill="#e2e8f0" />
    
    <!-- Row 2 (Target Exam Date Highlighted vividly) -->
    <rect x="18" y="52" width="10" height="10" rx="2" fill="#e2e8f0" />
    <!-- Highlighted Target Date Box (Red/Pink accent for "The Date") -->
    <rect x="30" y="50" width="14" height="14" rx="3" fill="#f43f5e" />
    <!-- Little tick or indicator inside target date -->
    <path d="M 34 57 L 37 60 L 41 53" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <rect x="46" y="52" width="10" height="10" rx="2" fill="#e2e8f0" />
    <rect x="60" y="52" width="10" height="10" rx="2" fill="#e2e8f0" />

    <!-- Row 3 -->
    <rect x="18" y="66" width="10" height="10" rx="2" fill="#e2e8f0" />
    <rect x="32" y="66" width="10" height="10" rx="2" fill="#e2e8f0" />
    <rect x="46" y="66" width="10" height="10" rx="2" fill="#e2e8f0" />
    <rect x="60" y="66" width="10" height="10" rx="2" fill="#e2e8f0" />
  </g>

  <!-- Speach bubble / interaction spark -->
  <g transform="translate(115, 22)">
    <path d="M 0 15 C 0 7 7 0 15 0 L 35 0 C 43 0 50 7 50 15 C 50 23 43 30 35 30 L 25 30 L 15 40 L 18 30 L 15 30 C 7 30 0 23 0 15 Z" fill="#ffffff" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.2))" />
    <!-- Mini clock/date icon inside speech bubble to reinforce meaning visually -->
    <circle cx="25" cy="15" r="9" fill="#f43f5e" />
    <path d="M 21 15 L 25 12 L 25 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>