<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- School Building Wall Gradient -->
    <linearGradient id="schoolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Warm Window Light -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Sunset / Street Glow -->
    <radialGradient id="sunGlow" cx="20%" cy="80%" r="70%" fx="20%" fy="80%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Distant City Silhouette / Trees -->
  <path d="M0 160 L20 150 L40 165 L60 145 L80 160 L100 135 L120 155 L150 140 L180 160 L210 145 L240 165 L240 240 L0 240 Z" fill="#090d16" />

  <!-- School Building (The Landmark Being Passed) -->
  <rect x="110" y="40" width="115" height="120" rx="4" fill="url(#schoolGrad)" />
  <!-- School Roof / Accent Top -->
  <polygon points="100,40 170,15 235,40" fill="#1d4ed8" />
  <rect x="105" y="35" width="130" height="8" rx="2" fill="#60a5fa" />

  <!-- School Gate / Entrance Area -->
  <path d="M145 110 L145 160 C145 150 185 150 185 160 L185 110 Z" fill="#1e3a8a" />
  <rect x="157" y="125" width="16" height="35" rx="8" fill="#fbbf24" opacity="0.8" />

  <!-- School Windows (Lit up warmly) -->
  <!-- Row 1 -->
  <rect x="120" y="55" width="14" height="20" rx="2" fill="url(#windowGlow)" />
  <rect x="145" y="55" width="14" height="20" rx="2" fill="url(#windowGlow)" />
  <rect x="195" y="55" width="14" height="20" rx="2" fill="url(#windowGlow)" />
  <!-- Row 2 -->
  <rect x="120" y="85" width="14" height="20" rx="2" fill="url(#windowGlow)" />
  <rect x="195" y="85" width="14" height="20" rx="2" fill="url(#windowGlow)" />

  <!-- Decorative Tree in front of School -->
  <path d="M85 160 C80 130 100 110 115 125 C130 110 150 130 145 160 Z" fill="#047857" />
  <path d="M95 160 C90 140 105 125 115 135 C125 125 140 140 135 160 Z" fill="#10b981" />
  <rect x="111" y="155" width="8" height="25" fill="#78350f" />

  <!-- FOREGROUND & MIDGROUND ELEMENTS -->
  <!-- Sidewalk / Path -->
  <path d="M0 170 Q120 160 240 180 L240 240 L0 240 Z" fill="#334155" />
  <path d="M0 177 Q120 167 240 187" stroke="#475569" stroke-width="2" stroke-dasharray="8 6" fill="none" />
  <path d="M0 195 Q120 185 240 205" stroke="#1e293b" stroke-width="3" fill="none" />

  <!-- Street Lamp Casting Light -->
  <rect x="25" y="100" width="4" height="80" fill="#64748b" />
  <path d="M22 100 L27 90 L32 100 Z" fill="#475569" />
  <circle cx="27" cy="95" r="4" fill="#fbbf24" />
  <polygon points="27,98 -10,240 70,240" fill="#fbbf24" opacity="0.08" />

  <!-- MAIN CHARACTER (Walking home past the school) -->
  <g transform="translate(85, 128)">
    <!-- Character Shadow -->
    <ellipse cx="22" cy="52" rx="16" ry="5" fill="#090d16" opacity="0.6" />

    <!-- Backpack (Going home from school/work) -->
    <path d="M10 14 L20 12 L22 28 L12 28 Z" fill="#ec4899" rx="3" />
    <path d="M14 12 L18 8 L20 10" stroke="#db2777" stroke-width="2" fill="none" />

    <!-- Back Leg (Stepping forward) -->
    <path d="M22 36 L28 48 L34 47" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Body / Jacket -->
    <path d="M14 15 L30 17 L26 38 L14 36 Z" fill="#0284c7" rx="4" />
    <path d="M20 16 L20 37" stroke="#0369a1" stroke-width="2" />

    <!-- Front Leg (Passing by) -->
    <path d="M18 36 L14 48 L8 50" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Shoe -->
    <ellipse cx="7" cy="50" rx="5" ry="3" fill="#1e293b" />

    <!-- Back Arm (Swinging back) -->
    <path d="M26 18 L34 26" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Head & Hair -->
    <circle cx="21" cy="7" r="7" fill="#fde047" /> <!-- Face skin -->
    <path d="M13 6 C13 1 29 1 29 7 C29 9 27 6 21 5 C15 4 13 6 13 6 Z" fill="#78350f" /> <!-- Hair -->

    <!-- Front Arm (Swinging forward, holding a small pouch/phone) -->
    <path d="M16 18 L10 26 L12 30" stroke="#0369a1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="12" cy="31" r="3" fill="#10b981" />
  </g>

  <!-- Motion / Passing Effect Lines (Subtle vector cue for "passing through/by") -->
  <path d="M60 140 L75 140" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <path d="M50 148 L68 148" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M65 156 L80 156" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.3" />

  <!-- Atmospheric Foreground Plant Details -->
  <path d="M0 220 C10 210 25 215 30 240 Z" fill="#047857" opacity="0.8" />
  <path d="M220 230 C225 215 235 210 240 240 Z" fill="#047857" opacity="0.9" />
</svg>