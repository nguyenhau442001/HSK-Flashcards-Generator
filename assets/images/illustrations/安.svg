<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall Details -->
  <rect x="20" y="180" width="200" height="2" fill="#334155" opacity="0.5"/>
  <path d="M40 180 L40 60 Q40 40 60 40 L180 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>

  <!-- Window on the Left -->
  <rect x="30" y="60" width="45" height="70" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="34" y="64" width="17" height="29" rx="1" fill="#334155" opacity="0.6"/>
  <rect x="54" y="64" width="17" height="29" rx="1" fill="#334155" opacity="0.6"/>
  <rect x="34" y="97" width="17" height="29" rx="1" fill="#334155" opacity="0.6"/>
  <rect x="54" y="97" width="17" height="29" rx="1" fill="#334155" opacity="0.6"/>

  <!-- Small Potted Plant on Floor -->
  <path d="M190 180 L210 180 L206 195 L194 195 Z" fill="#fb923c"/>
  <path d="M200 180 Q205 165 215 165 M200 180 Q195 160 185 165 M200 180 Q200 155 205 150" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- The Ladder -->
  <path d="M90 190 L115 70 M135 190 L115 70" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="160" x2="125" y2="160" stroke="#f59e0b" stroke-width="3"/>
  <line x1="105" y1="130" x2="125" y2="130" stroke="#f59e0b" stroke-width="3"/>
  <line x1="110" y1="100" x2="120" y2="100" stroke="#f59e0b" stroke-width="3"/>

  <!-- The Air Conditioner (The "Installed" Object) -->
  <rect x="120" y="45" width="90" height="32" rx="4" fill="#f8fafc"/>
  <rect x="125" y="70" width="80" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="200" cy="55" r="1.5" fill="#38bdf8" filter="url(#glow)"/>
  <line x1="130" y1="55" x2="185" y2="55" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="130" y1="60" x2="185" y2="60" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Cool Air Breeze Lines -->
  <path d="M135 85 Q130 105 140 115" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M165 85 Q160 105 170 115" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M195 85 Q190 105 200 115" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Technician Character -->
  <!-- Legs -->
  <path d="M110 130 L105 105" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 130 L115 105" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M105 105 Q115 75 125 105" fill="#0d9488"/>
  <rect x="108" y="85" width="14" height="25" rx="4" fill="#0d9488"/>
  <!-- Head -->
  <circle cx="115" cy="75" r="7" fill="#fde68a"/>
  <path d="M110 70 Q115 65 120 70" fill="#475569"/> <!-- Hair -->
  <!-- Arms reaching to install -->
  <path d="M108 90 L115 55" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  <path d="M122 90 L135 60" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  <!-- Tool in hand -->
  <rect x="133" y="55" width="2" height="8" fill="#94a3b8" transform="rotate(45 133 55)"/>

  <!-- Toolbox on floor -->
  <rect x="145" y="180" width="25" height="12" rx="2" fill="#ef4444"/>
  <rect x="152" y="177" width="10" height="3" rx="1" fill="#991b1b"/>
</svg>