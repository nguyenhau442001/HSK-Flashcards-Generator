<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Decorative Background Glow/Elements -->
  <circle cx="100" cy="100" r="70" fill="#0f172a" opacity="0.5"/>

  <!-- Left Side: Smart/Idea (Lightbulb & Brain silhouette) representing " thông minh " -->
  <g transform="translate(45, 60)">
    <!-- Bulb Base -->
    <rect x="12" y="42" width="16" height="8" rx="2" fill="#64748b"/>
    <rect x="14" y="52" width="12" height="6" rx="2" fill="#475569"/>
    
    <!-- Bulb Glass (Sky Blue) -->
    <path d="M 20 5 C 9 5 1 13 1 24 C 1 31 5 37 11 40 L 11 42 L 29 42 L 29 40 C 35 37 39 31 39 24 C 39 13 31 5 20 5 Z" fill="#38bdf8"/>
    
    <!-- Shine highlight on bulb -->
    <path d="M 12 14 C 10 17 10 22 13 25" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Central Bridge / Connector ("Mà" / Addition Concept) -->
  <g transform="translate(75, 80)">
    <!-- Plus symbol glowing in the middle connecting both traits -->
    <circle cx="25" cy="20" r="18" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
    <path d="M 19 20 L 31 20 M 25 14 L 25 26" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Right Side: Hardworking (Graduation Cap / Star / Effort Trophy) representing " chăm chỉ " -->
  <g transform="translate(120, 60)">
    <!-- Trophy Base -->
    <path d="M 10 52 L 30 52 L 26 62 L 14 62 Z" fill="#64748b"/>
    <rect x="12" y="62" width="16" height="6" rx="2" fill="#475569"/>
    
    <!-- Trophy Cup (Amber Gold) -->
    <path d="M 8 16 C 8 32 12 36 20 42 C 28 36 32 32 32 16 Z" fill="#f59e0b"/>
    <!-- Trophy Handles -->
    <path d="M 8 20 C 2 20 2 30 8 32" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 32 20 C 38 20 38 30 32 32" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Star on Trophy -->
    <path d="M 20 22 L 22 26 L 26 26 L 23 28 L 24 32 L 20 30 L 16 32 L 17 28 L 14 26 L 18 26 Z" fill="#fffbeb"/>
  </g>

  <!-- Bottom Visual Scale / Ground Line binding them together -->
  <rect x="40" y="145" width="120" height="4" rx="2" fill="#334155"/>
  <circle cx="65" cy="147" r="3" fill="#38bdf8"/>
  <circle cx="100" cy="147" r="3" fill="#10b981"/>
  <circle cx="135" cy="147" r="3" fill="#f59e0b"/>

  <!-- Dynamic Accent Sparks -->
  <path d="M 32 45 L 36 50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 165 45 L 161 50" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="45" r="3" fill="#fb923c"/>
</svg>