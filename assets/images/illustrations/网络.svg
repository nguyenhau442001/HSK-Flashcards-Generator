<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow & Content Gradients -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Background Details -->
  <path d="M 0,170 L 240,170" stroke="#334155" stroke-width="2"/>
  
  <!-- Cozy Window showing night city / modern connectivity vibe -->
  <rect x="25" y="25" width="55" height="95" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="3"/>
  <rect x="30" y="30" width="45" height="85" fill="url(#windowGrad)"/>
  <!-- Window frames -->
  <line x1="52" y1="30" x2="52" y2="115" stroke="#334155" stroke-width="2"/>
  <line x1="30" y1="72" x2="75" y2="72" stroke="#334155" stroke-width="2"/>
  <!-- City lights outside -->
  <circle cx="38" cy="95" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="48" cy="102" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="62" cy="88" r="1.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="67" cy="105" r="1.5" fill="#34d399" opacity="0.8"/>

  <!-- Wall shelf with cozy props -->
  <rect x="155" y="45" width="60" height="4" rx="2" fill="#475569"/>
  <!-- Plant on shelf -->
  <path d="M 175,45 Q 175,32 185,32 Q 195,32 195,45 Z" fill="#334155"/>
  <path d="M 185,32 Q 170,20 165,25 Q 160,30 180,35 Z" fill="#10b981"/>
  <path d="M 185,32 Q 200,18 205,23 Q 210,28 190,34 Z" fill="#059669"/>

  <!-- Hanging Pendant Light -->
  <path d="M 120,0 L 120,35" stroke="#475569" stroke-width="2"/>
  <path d="M 105,35 L 135,35 L 140,42 L 100,42 Z" fill="#64748b"/>
  <!-- Light cone -->
  <polygon points="120,42 40,210 200,210" fill="#f59e0b" opacity="0.04"/>

  <!-- Wooden Desk Surface -->
  <path d="M 10,175 L 230,175 L 220,210 L 20,210 Z" fill="#334155"/>
  <rect x="15" y="170" width="210" height="8" rx="2" fill="#475569"/>

  <!-- Laptop (Centerpiece of "Network / Internet") -->
  <!-- Laptop Base -->
  <path d="M 75,170 L 165,170 L 180,182 L 60,182 Z" fill="#94a3b8" filter="url(#softShadow)"/>
  <rect x="110" y="174" width="20" height="4" rx="2" fill="#64748b"/>
  
  <!-- Laptop Screen Lid -->
  <rect x="78" y="105" width="84" height="67" rx="6" fill="#475569" filter="url(#softShadow)"/>
  <!-- Laptop Screen Inner Display -->
  <rect x="82" y="109" width="76" height="59" rx="3" fill="url(#screenGrad)"/>

  <!-- UI Elements on Laptop Screen (Representing fast, seamless internet/connection) -->
  <!-- Video Call / Streaming window -->
  <rect x="90" y="117" width="38" height="28" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Avatar inside video -->
  <circle cx="109" cy="127" r="6" fill="#fb923c"/>
  <path d="M 101,139 Q 109,133 117,139 Z" fill="#38bdf8"/>
  
  <!-- Chat / E-commerce cards on screen -->
  <rect x="133" y="117" width="18" height="12" rx="2" fill="#10b981" opacity="0.8"/>
  <rect x="133" y="133" width="18" height="12" rx="2" fill="#f59e0b" opacity="0.8"/>
  
  <!-- Floating Network Signal / Speed Waves (Visualizing "Convenient Network") -->
  <g filter="url(#glow)">
    <path d="M 100,95 Q 120,85 140,95" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 92,89 Q 120,75 148,89" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 84,83 Q 120,65 156,83" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Connection Nodes / Sparkles -->
  <circle cx="120" cy="80" r="3" fill="#38bdf8"/>
  <circle cx="95" cy="88" r="2" fill="#fbbf24"/>
  <circle cx="145" cy="88" r="2" fill="#10b981"/>

  <!-- Coffee Mug (Cozy context prop) -->
  <rect x="175" y="155" width="16" height="18" rx="3" fill="#f8fafc" filter="url(#softShadow)"/>
  <path d="M 191,159 C 196,159 196,169 191,169" stroke="#f8fafc" stroke-width="2.5" fill="none"/>
  <!-- Steam from coffee -->
  <path d="M 181,150 Q 183,145 181,140" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Smartphone on Desk -->
  <rect x="52" y="162" width="16" height="22" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-15 60 173)" filter="url(#softShadow)"/>
  <rect x="55" y="165" width="10" height="15" fill="#38bdf8" rx="1" transform="rotate(-15 60 173)" opacity="0.8"/>

  <!-- Main Character (Relaxed, happy person enjoying convenient internet) -->
  <!-- Chair Backrest -->
  <path d="M 115,115 L 135,115 L 140,175 L 110,175 Z" fill="#334155" rx="5"/>
  <rect x="117" y="125" width="16" height="40" rx="3" fill="#475569"/>

  <!-- Character Body / Hoodie -->
  <path d="M 95,190 C 95,160 110,150 125,150 C 140,150 155,160 155,190 Z" fill="url(#amberGlow)" filter="url(#softShadow)"/>
  
  <!-- Character Neck & Head -->
  <rect x="118" y="138" width="14" height="18" fill="#fdba74"/>
  
  <!-- Head (Expressive, smiling profile/3-quarter) -->
  <circle cx="125" cy="122" r="18" fill="#fdba74"/>
  
  <!-- Hair (Modern styled dark hair) -->
  <path d="M 108,122 C 108,105 142,105 142,122 C 142,122 140,112 133,108 C 125,104 115,108 108,122 Z" fill="#0f172a"/>
  <path d="M 110,122 L 114,130 L 118,124 Z" fill="#0f172a"/>

  <!-- Face Details (Happy expression) -->
  <!-- Eyes (Happy closed curves or bright dots) -->
  <path d="M 129,120 Q 133,117 137,120" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="134" cy="126" r="3" fill="#f43f5e" opacity="0.4"/>
  <!-- Smile -->
  <path d="M 129,128 Q 134,133 139,128" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms / Hands interacting easily -->
  <!-- Right Arm reaching toward laptop -->
  <path d="M 145,165 Q 155,175 140,182" fill="none" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>
  <!-- Hand typing/touching -->
  <circle cx="138" cy="183" r="4" fill="#fdba74"/>

  <!-- Left Arm relaxed -->
  <path d="M 105,165 Q 95,175 105,185" fill="none" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>

  <!-- Foreground decorative elements for depth (Out of focus plant leaf corner) -->
  <path d="M 0,240 Q 20,210 10,195 Q 5,190 0,205 Z" fill="#059669" opacity="0.8"/>
  <path d="M 240,220 Q 210,210 220,190 Q 225,185 235,200 Z" fill="#047857" opacity="0.9"/>
</svg>