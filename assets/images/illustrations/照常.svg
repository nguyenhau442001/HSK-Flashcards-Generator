<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Morning Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.03" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / OFFICE BACKGROUND -->
  <!-- Wallpaper / Wall Detail -->
  <rect x="20" y="20" width="200" height="120" rx="4" fill="#1e293b" />
  
  <!-- Window with Morning Sun & City Silhouette -->
  <g>
    <!-- Window Frame -->
    <rect x="145" y="30" width="65" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Cityscape outside -->
    <path d="M149 85 L149 111 L160 111 L160 70 L168 70 L168 111 L185 111 L185 60 L195 60 L195 111 L206 111 L206 80 Z" fill="#334155" opacity="0.5"/>
    <!-- Sun glowing -->
    <circle cx="175" cy="55" r="10" fill="#f59e0b" opacity="0.8" />
    <!-- Window Light Beam hitting room -->
    <polygon points="145,30 210,30 240,180 80,180" fill="url(#windowLight)" />
    <!-- Window panes divider -->
    <line x1="177" y1="30" x2="177" y2="115" stroke="#475569" stroke-width="1.5" />
    <line x1="145" y1="72" x2="210" y2="72" stroke="#475569" stroke-width="1.5" />
  </g>

  <!-- Wall Shelf with Plant & Clock -->
  <g>
    <rect x="35" y="45" width="60" height="4" rx="2" fill="#64748b" />
    <!-- Clock showing normal morning time (e.g. 8:00) -->
    <circle cx="50" cy="32" r="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5" />
    <line x1="50" y1="32" x2="50" y2="26" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="50" y1="32" x2="55" y2="34" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="50" cy="32" r="1" fill="#ef4444" />
    <!-- Small Plant -->
    <path d="M78 45 C78 39 85 39 85 45 Z" fill="#10b981" />
    <path d="M85 45 C85 37 92 37 92 45 Z" fill="#059669" />
    <path d="M74 41 C76 36 82 38 80 43 Z" fill="#34d399" />
    <rect x="79" y="43" width="8" height="3" fill="#cbd5e1" rx="1" />
  </g>

  <!-- OFFICE DESK & PROPS -->
  <g>
    <!-- Desk Base/Legs -->
    <rect x="35" y="180" width="170" height="8" rx="2" fill="url(#deskGrad)" />
    <rect x="50" y="188" width="8" height="35" fill="#334155" />
    <rect x="182" y="188" width="8" height="35" fill="#334155" />

    <!-- Computer Setup -->
    <!-- Monitor Stand -->
    <rect x="100" y="158" width="20" height="22" fill="#475569" rx="2" />
    <rect x="90" y="178" width="40" height="2" fill="#64748b" rx="1" />
    <!-- Monitor Screen -->
    <rect x="75" y="110" width="90" height="50" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <!-- Dashboard UI Elements (Abstract charts) -->
    <rect x="83" y="120" width="30" height="4" rx="2" fill="#38bdf8" />
    <rect x="83" y="128" width="50" height="3" rx="1.5" fill="#475569" />
    <rect x="83" y="134" width="40" height="3" rx="1.5" fill="#475569" />
    <path d="M135 148 L142 138 L149 143 L157 130" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="157" cy="130" r="2.5" fill="#10b981" />

    <!-- Coffee Mug -->
    <rect x="175" y="160" width="12" height="15" rx="2" fill="#f8fafc" />
    <path d="M187 163 C191 163 191 172 187 172" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
    <!-- Steam from coffee -->
    <path d="M178 152 C178 148 182 148 182 144" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Keyboard & Mouse -->
    <rect x="95" y="184" width="45" height="4" rx="1" fill="#cbd5e1" />
    <rect x="148" y="183" width="6" height="5" rx="1.5" fill="#cbd5e1" />
  </g>

  <!-- MAIN CHARACTER (Working normally, confident and calm) -->
  <g id="character">
    <!-- Chair Back -->
    <rect x="95" y="125" width="28" height="58" rx="6" fill="#334155" />
    <rect x="101" y="133" width="16" height="42" rx="4" fill="#475569" />

    <!-- Character Body / Torso -->
    <path d="M90 155 Q109 145 128 155 L132 185 L86 185 Z" fill="url(#shirtGrad)" />
    <!-- Collar / Tie detail -->
    <polygon points="109,150 106,165 112,165" fill="#f8fafc" />
    <polygon points="109,165 107.5,178 110.5,178" fill="#ef4444" />

    <!-- Arms & Hands Typing / Working -->
    <!-- Left Arm -->
    <path d="M90 158 C80 162 78 175 92 182" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="94" cy="183" r="4" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Right Arm -->
    <path d="M128 158 C138 162 140 175 126 182" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="124" cy="183" r="4" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Neck -->
    <rect x="104" y="138" width="10" height="15" fill="#fbcfe8" />

    <!-- Head & Face -->
    <circle cx="109" cy="122" r="17" fill="#fbcfe8" />

    <!-- Hair (Professional, neat styling) -->
    <path d="M93 120 C93 108 102 105 112 105 C122 105 127 112 126 123 C124 115 118 111 110 111 C102 111 96 114 93 120 Z" fill="#334155" />

    <!-- Facial Expressions (Calm, focused, routine/steady vibe) -->
    <!-- Glasses -->
    <circle cx="103" cy="122" r="5.5" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="117" cy="122" r="5.5" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <line x1="108.5" y1="122" x2="111.5" y2="122" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Gentle confident smile (Business as usual) -->
    <path d="M106 130 C108 132 112 132 114 130" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Cheeks (Warm subtle blush) -->
    <circle cx="100" cy="126" r="2.5" fill="#f43f5e" opacity="0.3" />
    <circle cx="120" cy="126" r="2.5" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- FOREGROUND ACCENTS & POLISH -->
  <!-- Indoor hanging light fixture top left -->
  <line x1="20" y1="0" x2="20" y2="25" stroke="#475569" stroke-width="2" />
  <path d="M12 25 L28 25 L24 35 L16 35 Z" fill="#64748b" />
  <circle cx="20" cy="36" r="3" fill="#fbbf24" opacity="0.9" />

  <!-- Decorative small floating checkmark/habit aura to reinforce "usual routine" -->
  <g transform="translate(185, 95)" opacity="0.8">
    <circle cx="12" cy="12" r="12" fill="#10b981" />
    <path d="M7 12 L10.5 15.5 L17 9" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>