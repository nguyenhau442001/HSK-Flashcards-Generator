<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Motion Lines -->
  <path d="M180 60 L150 90 M190 80 L160 110 M200 100 L170 130" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Character Body -->
  <g transform="translate(100, 120)">
    <!-- Legs in stride -->
    <path d="M-20 40 L-10 80 M20 40 L30 80" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <!-- Torso -->
    <path d="M0 0 L0 50" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
    <!-- Arms pumping -->
    <path d="M-10 10 L-40 40 M10 10 L40 -20" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#fbbf24"/>
    <!-- Face -->
    <path d="M-10 -25 L-5 -20 M5 -25 L10 -20" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M-8 -10 Q0 -5 8 -10" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Environment Elements -->
  <rect x="0" y="190" width="240" height="50" fill="#1e293b" opacity="0.8"/>
  <circle cx="200" cy="40" r="20" fill="#f59e0b" opacity="0.3"/>
  <circle cx="200" cy="40" r="10" fill="#fb923c"/>
  
  <!-- Speed blur effect -->
  <path d="M50 150 Q120 120 190 150" stroke="#ec4899" stroke-width="2" stroke-dasharray="10 10" opacity="0.4"/>
</svg>