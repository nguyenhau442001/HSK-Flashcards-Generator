<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Glow / City Lights -->
    <linearGradient id="window-glow" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Golden Target / Trophy Glow -->
    <radialGradient id="target-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Board Glow -->
    <linearGradient id="board-grad" x1="0" y1="0" x2="160" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Large Studio Window with City Silhouette -->
  <path d="M40 20 H200 V160 H40 Z" fill="url(#window-glow)" rx="4"/>
  <!-- Cityscape silhouettes -->
  <path d="M50 160 V120 H65 V160 H80 V100 H100 V160 H115 V130 H130 V160 H160 V110 H185 V160 Z" fill="#1e293b" opacity="0.6"/>
  <!-- Window frame and dividers -->
  <rect x="40" y="20" width="160" height="140" rx="4" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="20" x2="120" y2="160" stroke="#475569" stroke-width="1.5"/>
  <line x1="40" y1="90" x2="200" y2="90" stroke="#475569" stroke-width="1.5"/>

  <!-- Stars / Night ambiance -->
  <circle cx="60" cy="40" r="1" fill="#f8fafc" opacity="0.8"/>
  <circle cx="150" cy="50" r="1.5" fill="#f8fafc" opacity="0.6"/>
  <circle cx="180" cy="30" r="1" fill="#f8fafc" opacity="0.9"/>

  <!-- WORKSPACE DESK -->
  <rect x="20" y="195" width="200" height="8" rx="2" fill="#475569"/>
  <rect x="35" y="203" width="170" height="20" fill="#334155"/>
  <!-- Desk Props: Laptop & Coffee -->
  <path d="M140 195 L180 195 L185 203 L135 203 Z" fill="#64748b"/>
  <rect x="145" y="180" width="30" height="15" rx="2" fill="#94a3b8"/>
  <rect x="150" y="183" width="20" height="10" fill="#38bdf8" opacity="0.4"/>
  <!-- Coffee Mug -->
  <rect x="55" y="188" width="12" height="15" rx="2" fill="#e2e8f0"/>
  <path d="M67 192 C72 192 72 199 67 199" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- GOAL / ACHIEVEMENT BOARD (Visualizing the "Goal Realized") -->
  <!-- Ambient glow behind the target board -->
  <circle cx="120" cy="115" r="45" fill="url(#target-glow)"/>

  <!-- Whiteboard / Vision Board mounted on wall -->
  <rect x="80" y="70" width="80" height="65" rx="4" fill="url(#board-grad)" stroke="#475569" stroke-width="2"/>
  <!-- Board content: Checkmarks & Success chart (Goal achieved) -->
  <polyline points="92,115 102,122 120,95" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="130" y1="100" x2="152" y2="100" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="110" x2="145" y2="110" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="83" x2="125" y2="83" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>

  <!-- Golden Trophy / Target Symbol on Board -->
  <path d="M115 62 L125 62 L123 72 L117 72 Z" fill="#fbbf24"/>
  <path d="M120 72 V77" stroke="#fbbf24" stroke-width="2"/>
  <path d="M112 77 H128" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- MAIN CHARACTER (Enthusiastic, successful professional/student celebrating) -->
  <!-- Chair Backrest -->
  <path d="M95 160 C95 130 145 130 145 160 Z" fill="#334155"/>
  <rect x="115" y="145" width="10" height="55" fill="#1e293b"/>

  <!-- Character Body & Torso (Leaning back in triumph with arms raised) -->
  <!-- Torso (Navy/Teal hoodie or shirt) -->
  <path d="M95 160 C90 140 100 125 120 125 C140 125 150 140 145 160 Z" fill="#0ea5e9"/>
  <!-- Collar -->
  <path d="M110 125 L120 133 L130 125" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="120" cy="105" r="14" fill="#fbcfe8"/>
  <!-- Hair (Stylish dark hair) -->
  <path d="M106 102 C106 90 134 90 134 102 C134 97 130 92 120 92 C110 92 106 97 106 102 Z" fill="#334155"/>

  <!-- Face expression: Joyful, eyes closed in happy smile, open mouth -->
  <path d="M114 105 Q117 108 120 105" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M120 105 Q123 108 126 105" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M117 111 Q120 115 123 111 Z" fill="#e11d48"/> <!-- Happy open smile -->

  <!-- Arms Raised in Celebration (Realizing the goal) -->
  <!-- Left arm raised -->
  <path d="M100 130 C85 120 75 100 70 90" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  <circle cx="68" cy="87" r="5" fill="#fbcfe8"/> <!-- Left hand -->

  <!-- Right arm raised -->
  <path d="M140 130 C155 120 165 100 170 90" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  <circle cx="172" cy="87" r="5" fill="#fbcfe8"/> <!-- Right hand -->

  <!-- CELEBRATORY CONFETTI & SPARKLES -->
  <rect x="75" y="55" width="4" height="8" rx="1" fill="#fbbf24" transform="rotate(25 77 59)"/>
  <rect x="165" y="65" width="5" height="5" rx="1" fill="#ec4899" transform="rotate(-15 167 67)"/>
  <circle cx="95" cy="45" r="2.5" fill="#38bdf8"/>
  <circle cx="150" cy="40" r="3" fill="#10b981"/>
  <path d="M135 50 L137 55 L142 57 L137 59 L135 64 L133 59 L128 57 L133 55 Z" fill="#fbbf24" transform="scale(0.6) translate(100, 10)"/>

</svg>