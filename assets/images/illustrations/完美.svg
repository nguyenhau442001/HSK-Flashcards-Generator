<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Board/Glow Gradient -->
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Amber Glow -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Shadows -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background details -->
  <circle cx="120" cy="120" r="90" fill="url(#amber-glow)" />
  <circle cx="200" cy="40" r="30" fill="#38bdf8" opacity="0.05" />
  <circle cx="40" cy="200" r="40" fill="#ec4899" opacity="0.03" />

  <!-- Window frame background element -->
  <path d="M 30,50 L 110,30 L 110,210 L 30,190 Z" fill="#1e293b" opacity="0.4" />
  <path d="M 110,30 L 190,50 L 190,190 L 110,210 Z" fill="#1e293b" opacity="0.2" />

  <!-- SCENE: Strategy / Planning Board -->
  <g filter="url(#soft-shadow)">
    <!-- Corkboard/Plan Background -->
    <rect x="45" y="45" width="150" height="110" rx="8" fill="url(#board-grad)" stroke="#475569" stroke-width="2" />
    <rect x="53" y="53" width="134" height="94" rx="4" fill="#0f172a" opacity="0.6" />
    
    <!-- Flowchart nodes & connections (representing a plan) -->
    <!-- Lines connecting nodes -->
    <line x1="75" y1="75" x2="110" y2="75" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="110" y1="75" x2="145" y2="105" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="145" y1="105" x2="175" y2="75" stroke="#10b981" stroke-width="2.5" />
    <line x1="110" y1="75" x2="110" y2="130" stroke="#64748b" stroke-width="2" />

    <!-- Node 1: Idea -->
    <circle cx="75" cy="75" r="10" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <circle cx="75" cy="75" r="4" fill="#fbbf24" />

    <!-- Node 2: Milestone -->
    <rect x="100" y="65" width="20" height="20" rx="4" fill="#38bdf8" opacity="0.8" />
    <path d="M106,75 L110,79 L118,71" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Node 3: Centerpiece / Perfect Goal -->
    <circle cx="145" cy="105" r="14" fill="#f59e0b" filter="url(#soft-shadow)" />
    <polygon points="145,95 148,102 155,103 150,108 152,115 145,111 138,115 140,108 135,103 142,102" fill="#ffffff" />

    <!-- Node 4: Execution -->
    <rect x="165" y="65" width="20" height="20" rx="4" fill="#10b981" opacity="0.9" />
    <path d="M171,75 L175,79 L183,71" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sticky notes on plan -->
    <rect x="60" y="105" width="30" height="25" rx="2" fill="#fb923c" opacity="0.85" transform="rotate(-5 60 105)" />
    <line x1="64" y1="113" x2="82" y2="113" stroke="#fff" stroke-width="2" opacity="0.8" />
    <line x1="64" y1="119" x2="78" y2="119" stroke="#fff" stroke-width="2" opacity="0.8" />

    <rect x="102" y="118" width="28" height="22" rx="2" fill="#ec4899" opacity="0.85" transform="rotate(4 102 118)" />
    <circle cx="116" cy="129" r="5" fill="#fff" opacity="0.9" />

    <!-- Checkmark Badge highlighting perfection (Gold Starburst) -->
    <g transform="translate(170, 115)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" filter="url(#soft-shadow)" />
      <circle cx="0" cy="0" r="13" fill="#fbbf24" />
      <path d="M-5,1 L-1,5 L6,-3" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Desk Surface -->
  <path d="M 10,185 L 230,185 L 235,215 L 5,215 Z" fill="#334155" />
  <path d="M 0,180 L 240,180 L 240,187 L 0,187 Z" fill="#64748b" opacity="0.6" />

  <!-- Desk Props -->
  <!-- Laptop base -->
  <path d="M 140,185 L 210,185 L 220,197 L 130,197 Z" fill="#94a3b8" />
  <!-- Laptop screen showing code/charts -->
  <path d="M 145,145 L 205,145 L 210,185 L 140,185 Z" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <line x1="152" y1="155" x2="185" y2="155" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="152" y1="163" x2="175" y2="163" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <line x1="152" y1="171" x2="195" y2="171" stroke="#fb923c" stroke-width="2" stroke-linecap="round" />

  <!-- Coffee Mug -->
  <rect x="25" y="165" width="20" height="22" rx="3" fill="#f8fafc" />
  <path d="M 45,170 C 50,170 50,180 45,182" fill="none" stroke="#f8fafc" stroke-width="2" />
  <!-- Coffee steam -->
  <path d="M 31,158 C 31,154 35,152 35,148" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- CHARACTER: Confident Young Professional / Planner -->
  <!-- Body / Torso -->
  <g transform="translate(75, 120)">
    <!-- Shoulders & Outfit (Dark blue blazer) -->
    <path d="M -35,70 C -35,45 -20,35 0,35 C 20,35 35,45 35,70 L 45,95 C 45,98 42,100 38,100 L -38,100 C -42,100 -45,98 -45,95 Z" fill="#1e3a8a" />
    <!-- Shirt collar & tie -->
    <path d="M -10,35 L 0,50 L 10,35 Z" fill="#f8fafc" />
    <polygon points="-3,48 3,48 4,68 0,72 -4,68" fill="#ec4899" />

    <!-- Neck -->
    <rect x="-7" y="24" width="14" height="15" fill="#fde047" opacity="0.2" />
    <path d="M -7,25 C -7,20 7,20 7,25 L 7,37 L -7,37 Z" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="0" cy="5" r="18" fill="#fbcfe8" />

    <!-- Hair (Stylish modern side-parting) -->
    <path d="M -18,5 C -18,-7 -5,-15 8,-10 C 15,-7 19,0 19,7 C 19,7 19,10 18,10 C 12,5 5,2 -5,5 C -12,7 -17,2 -18,5 Z" fill="#0f172a" />

    <!-- Facial Expression: Satisfied, confident smile -->
    <!-- Eyes (happy curves) -->
    <path d="M -7,2 C -5,0 -3,0 -1,2" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 3,2 C 5,0 7,0 9,2" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <!-- Glasses -->
    <rect x="-10" y="-3" width="9" height="7" rx="1.5" fill="none" stroke="#0f172a" stroke-width="1.2" />
    <rect x="1" y="-3" width="9" height="7" rx="1.5" fill="none" stroke="#0f172a" stroke-width="1.2" />
    <line x1="-1" y1="0" x2="1" y2="0" stroke="#0f172a" stroke-width="1.2" />
    <!-- Smile -->
    <path d="M -4,11 C -2,14 2,14 4,11" fill="none" stroke="#be185d" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms / Gestures -->
    <!-- Left arm pointing proudly/confidently at the board -->
    <path d="M -30,50 C -45,55 -55,70 -50,85" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" />
    <circle cx="-50" cy="85" r="5" fill="#fbcfe8" />

    <!-- Right arm bent, hand gesturing thumbs up near chest -->
    <path d="M 25,50 C 40,55 35,75 25,80" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" />
    <!-- Thumbs up hand -->
    <circle cx="23" cy="80" r="5" fill="#fbcfe8" />
    <path d="M 23,73 L 23,78" fill="none" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Highlight sparkles for perfection theme -->
  <g fill="#fbbf24">
    <path d="M 195,35 Q 195,45 205,45 Q 195,45 195,55 Q 195,45 185,45 Q 195,45 195,35" />
    <path d="M 35,85 Q 35,90 40,90 Q 35,90 35,95 Q 35,90 30,90 Q 35,90 35,85" transform="scale(0.7) translate(10, 20)" />
  </g>
</svg>