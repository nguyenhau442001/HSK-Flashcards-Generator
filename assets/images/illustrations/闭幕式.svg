<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Stadium Background Elements -->
  <path d="M20 180 L220 180 L200 240 L40 240 Z" fill="#334155"/>
  <circle cx="120" cy="160" r="80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
  
  <!-- Fireworks/Lights -->
  <circle cx="60" cy="60" r="3" fill="#fbbf24"/>
  <circle cx="180" cy="50" r="4" fill="#ec4899"/>
  <circle cx="120" cy="40" r="3" fill="#10b981"/>
  
  <!-- Characters -->
  <!-- Character 1: Cheering -->
  <g transform="translate(70, 140)">
    <circle cx="0" cy="-30" r="12" fill="#fde68a"/>
    <path d="M-15 -15 L15 -15 L10 20 L-10 20 Z" fill="#38bdf8"/>
    <path d="M-10 -20 L-25 -5" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 -20 L25 -5" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2: Waving -->
  <g transform="translate(140, 140)">
    <circle cx="0" cy="-30" r="12" fill="#fde68a"/>
    <path d="M-15 -15 L15 -15 L10 20 L-10 20 Z" fill="#fb923c"/>
    <path d="M-10 -20 L-25 -30" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 -20 L25 -10" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Stage/Podium -->
  <rect x="80" y="170" width="80" height="20" rx="4" fill="#fbbf24"/>
  <rect x="90" y="190" width="60" height="50" fill="#1e293b" opacity="0.5"/>
  
  <!-- Confetti/Atmosphere -->
  <rect x="50" y="100" width="4" height="4" fill="#ec4899" transform="rotate(20)"/>
  <rect x="190" y="120" width="4" height="4" fill="#38bdf8" transform="rotate(45)"/>
  <rect x="150" y="80" width="4" height="4" fill="#fbbf24" transform="rotate(-10)"/>
</svg>