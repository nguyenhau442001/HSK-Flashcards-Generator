<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ground -->
  <path d="M0 200 C 80 180, 160 180, 240 200 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Tortoise Shell (Main Subject) -->
  <g transform="translate(120, 150)">
    <ellipse cx="0" cy="0" rx="70" ry="45" fill="#b45309"/>
    <ellipse cx="0" cy="-5" rx="60" ry="35" fill="#d97706"/>
    <!-- Shell Pattern -->
    <path d="M-40 -10 L 40 -10 M-30 10 L 30 10 M0 -35 L 0 25" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="-50" cy="-20" rx="20" ry="18" fill="#f59e0b"/>
    <circle cx="-55" cy="-25" r="3" fill="#0f172a"/>
    <!-- Legs -->
    <ellipse cx="-40" cy="20" rx="12" ry="18" fill="#d97706"/>
    <ellipse cx="40" cy="20" rx="12" ry="18" fill="#d97706"/>
  </g>
  
  <!-- Environment/Props -->
  <path d="M30 210 L 40 160 L 50 210 Z" fill="#10b981"/>
  <path d="M190 215 L 205 170 L 220 215 Z" fill="#059669"/>
  <circle cx="180" cy="80" r="30" fill="#38bdf8" opacity="0.2"/>
  <circle cx="190" cy="70" r="15" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Decorative elements to imply longevity/time -->
  <path d="M20 50 Q 50 20 80 50 T 140 50" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
  <circle cx="20" cy="50" r="4" fill="#fbbf24"/>
  <circle cx="140" cy="50" r="4" fill="#fbbf24"/>
</svg>