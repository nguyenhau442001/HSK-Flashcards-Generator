<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Mirror / Stage -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Mirror Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Mirror Glass Reflection Gradient -->
    <linearGradient id="mirrorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Floor & Backdrop Props (Cozy Room Interior) -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />
  
  <!-- Background Shelf with Plant & Toy Props -->
  <rect x="25" y="70" width="70" height="6" rx="3" fill="#334155" />
  <!-- Small potted plant on shelf -->
  <path d="M45 70 L55 55 L65 70 Z" fill="#10b981" />
  <rect x="50" y="60" width="10" height="10" fill="#f43f5e" rx="2" />
  
  <!-- Background Warm Glow behind the Mirror -->
  <circle cx="120" cy="110" r="70" fill="url(#glowGrad)" />

  <!-- THE DRESSING TABLE / VANITY SETUP -->
  <ellipse cx="120" cy="190" rx="75" ry="12" fill="#334155" />
  <ellipse cx="120" cy="188" rx="70" ry="10" fill="#475569" />

  <!-- MIRROR STAND & FRAME (Representing 'giống như' - reflection/resemblance) -->
  <path d="M116 150 L116 178 L124 178 L124 150 Z" fill="#b45309" />
  <ellipse cx="120" cy="180" rx="18" ry="5" fill="#92400e" />

  <!-- Large Oval Vanity Mirror -->
  <ellipse cx="120" cy="100" rx="46" ry="58" fill="url(#frameGrad)" />
  <ellipse cx="120" cy="100" rx="41" ry="53" fill="url(#mirrorGlass)" />
  <!-- Mirror Glass Highlight Reflection -->
  <path d="M90 75 Q115 65 125 75 Q110 85 90 75 Z" fill="#ffffff" opacity="0.2" />

  <!-- REFLECTION INSIDE MIRROR (Mother & Daughter profile silhouettes/features) -->
  <!-- Mom (Behind/Larger) -->
  <circle cx="112" cy="90" r="14" fill="#64748b" opacity="0.6" />
  <path d="M98 115 Q112 100 126 115 Z" fill="#64748b" opacity="0.6" />
  
  <!-- FOREGROUND CHARACTERS (Mother and Daughter posing, emphasizing 'giống như' - looking alike) -->
  <!-- Mother (Left) -->
  <!-- Body & Outfit -->
  <path d="M75 190 C72 165 85 150 100 150 C115 150 128 165 125 190 Z" fill="#ec4899" />
  <path d="M85 150 C80 135 90 125 100 125 C110 125 120 135 115 150 Z" fill="#fbcfe8" />
  <!-- Head & Hair -->
  <circle cx="100" cy="112" r="16" fill="#fbcfe8" />
  <path d="M84 112 C84 95 116 95 116 112 C116 125 110 130 100 130 C90 130 84 120 84 112 Z" fill="#1e293b" />
  <circle cx="95" cy="112" r="2" fill="#0f172a" />
  <path d="M94 118 Q98 122 102 118" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Daughter (Right, mirroring mother's pose - 'giống nhau') -->
  <!-- Body & Outfit (matching style/color) -->
  <path d="M125 190 C122 168 133 155 145 155 C157 155 168 168 165 190 Z" fill="#f43f5e" />
  <path d="M133 155 C130 142 138 132 145 132 C152 132 160 142 157 155 Z" fill="#fbcfe8" />
  <!-- Head & Hair (Ponytail mimicking mom) -->
  <circle cx="145" cy="118" r="13" fill="#fbcfe8" />
  <path d="M132 118 C132 103 158 103 158 118 C158 128 152 132 145 132 C138 132 132 125 132 118 Z" fill="#1e293b" />
  <circle cx="158" cy="110" r="5" fill="#1e293b" /> <!-- Ponytail -->
  <circle cx="141" cy="118" r="1.5" fill="#0f172a" />
  <path d="M140 123 Q144 126 148 123" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Foreground Atmospheric Props / Vanity items -->
  <rect x="80" y="182" width="12" height="8" rx="2" fill="#38bdf8" />
  <circle cx="155" cy="184" r="5" fill="#fb923c" />
  <rect x="145" y="180" width="6" height="10" rx="1" fill="#10b981" />

  <!-- Sparkles / Emphasis on likeness and visual matching -->
  <path d="M60 90 L63 97 L70 100 L63 103 L60 110 L57 103 L50 100 L57 97 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M185 80 L187 85 L192 87 L187 89 L185 94 L183 89 L178 87 L183 85 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M170 130 L171.5 133.5 L175 135 L171.5 136.5 L170 140 L168.5 136.5 L165 135 L168.5 133.5 Z" fill="#fbbf24" opacity="0.7" />

  <!-- Interactive/Action floating comparison indicator (Curved dotted arc connecting them) -->
  <path d="M110 95 Q120 85 135 95" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.8" />
</svg>