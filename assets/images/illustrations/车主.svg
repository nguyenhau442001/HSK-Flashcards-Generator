<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Road Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Car -->
  <g transform="translate(20, 140)">
    <path d="M10 40 L130 40 L120 10 L40 10 L20 40 Z" fill="#fb923c"/>
    <circle cx="40" cy="45" r="12" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="100" cy="45" r="12" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <rect x="50" y="15" width="30" height="15" fill="#e0f2fe" rx="2"/>
  </g>
  
  <!-- Traffic Warden / Security Guard -->
  <g transform="translate(160, 120)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="10" y="35" width="20" height="40" fill="#38bdf8" rx="4"/>
    <path d="M5 45 L10 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 45 L40 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="15" y="80" width="5" height="30" fill="#475569"/>
    <rect x="30" y="80" width="5" height="30" fill="#475569"/>
    <!-- Pointing Gesture -->
    <path d="M30 50 L50 40" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- No Parking Sign -->
  <g transform="translate(180, 50)">
    <rect x="18" y="60" width="4" height="40" fill="#94a3b8"/>
    <circle cx="20" cy="50" r="15" fill="#ec4899"/>
    <line x1="10" y1="60" x2="30" y2="40" stroke="#f8fafc" stroke-width="4"/>
  </g>
  
  <!-- Speech Bubble Indicator -->
  <path d="M140 100 Q130 80 150 80 L170 80 Q190 80 190 100 Q190 120 170 120 L155 120 L145 135 Z" fill="#f8fafc"/>
  <circle cx="155" cy="100" r="3" fill="#0f172a"/>
  <circle cx="165" cy="100" r="3" fill="#0f172a"/>
  <circle cx="175" cy="100" r="3" fill="#0f172a"/>
</svg>