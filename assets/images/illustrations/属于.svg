<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting & Library interior backdrop -->
  <path d="M0 0h240v240H0z" fill="url(#bg-grad)"/>
  
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="shelf-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="warm-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="book-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Warm Light Cone from Window/Lamp -->
  <polygon points="120,0 200,240 40,240" fill="url(#warm-glow)" opacity="0.6"/>

  <!-- Bookshelves in Background -->
  <g opacity="0.5">
    <rect x="20" y="30" width="60" height="110" fill="#1e293b" rx="4"/>
    <rect x="160" y="30" width="60" height="110" fill="#1e293b" rx="4"/>
    <!-- Shelf lines -->
    <line x1="20" y1="65" x2="80" y2="65" stroke="#334155" stroke-width="3"/>
    <line x1="20" y1="100" x2="80" y2="100" stroke="#334155" stroke-width="3"/>
    <line x1="160" y1="65" x2="220" y2="65" stroke="#334155" stroke-width="3"/>
    <line x1="160" y1="100" x2="220" y2="100" stroke="#334155" stroke-width="3"/>
    <!-- Tiny colorful books on background shelves -->
    <rect x="28" y="45" width="8" height="20" fill="#38bdf8"/>
    <rect x="38" y="42" width="6" height="23" fill="#ec4899"/>
    <rect x="46" y="47" width="10" height="18" fill="#10b981"/>
    <rect x="170" y="80" width="7" height="20" fill="#f59e0b"/>
    <rect x="180" y="78" width="9" height="22" fill="#38bdf8"/>
  </g>

  <!-- Library Desk / Counter -->
  <rect x="30" y="155" width="180" height="65" fill="url(#shelf-grad)" rx="6"/>
  <!-- Desk Top Surface Highlight -->
  <rect x="30" y="155" width="180" height="6" fill="#475569" rx="2"/>

  <!-- Library Stamp/Scan Pad on Desk -->
  <rect x="50" y="170" width="30" height="12" fill="#334155" rx="3"/>
  <ellipse cx="65" cy="176" rx="10" ry="3" fill="#1e293b"/>

  <!-- Librarian Character (Friendly, welcoming gesture) -->
  <g transform="translate(160, 95)">
    <!-- Body / Torso -->
    <path d="M10 50 C10 35 25 30 35 30 C45 30 60 35 60 50 L60 85 L10 85 Z" fill="#38bdf8"/>
    <!-- Collar / Uniform detail -->
    <path d="M35 30 L25 45 L45 45 Z" fill="#ffffff"/>
    
    <!-- Head -->
    <circle cx="35" cy="18" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M21 18 C21 8 28 5 35 5 C42 5 49 8 49 18 C49 14 44 10 35 10 C26 10 21 14 21 18 Z" fill="#475569"/>
    <!-- Friendly Face & Glasses -->
    <circle cx="31" cy="18" r="1.5" fill="#1e293b"/>
    <circle cx="39" cy="18" r="1.5" fill="#1e293b"/>
    <path d="M33 22 Q35 24 37 22" stroke="#1e293b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    
    <!-- Arm pointing/presenting towards the book -->
    <path d="M15 45 C5 50 -5 45 -12 38" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="-14" cy="36" r="4" fill="#fbcfe8"/>
  </g>

  <!-- THE SPECIAL FOCUS OBJECT: The Library Book ("这本书属于图书馆") -->
  <!-- Glowing aura behind the book to emphasize ownership/connection -->
  <ellipse cx="100" cy="165" rx="30" ry="12" fill="url(#warm-glow)"/>

  <!-- Open/Upright Book Resting on Desk -->
  <g transform="translate(85, 125)">
    <!-- Book Cover (Bottom/Back thick edge) -->
    <rect x="-2" y="32" width="34" height="6" fill="#b45309" rx="2"/>
    
    <!-- Book Pages Block -->
    <path d="M0 10 L30 10 L30 32 L0 32 Z" fill="#f8fafc"/>
    <path d="M2 12 L28 12 L28 30 L2 30 Z" fill="#e2e8f0"/>
    
    <!-- Book Spine / Hard Cover -->
    <rect x="-4" y="8" width="8" height="26" fill="#f59e0b" rx="2"/>
    
    <!-- Glowing Bookmark / Library Tag hanging down -->
    <path d="M12 10 L12 36" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="9,36 15,36 12,42" fill="#ef4444"/>
    
    <!-- Abstract page lines (simulated text) -->
    <line x1="7" y1="16" x2="16" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7" y1="21" x2="22" y2="21" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7" y1="26" x2="18" y2="26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Library Building/Ownership Symbol Overlay (Subtle architectural stamp above book) -->
  <g transform="translate(100, 102)" opacity="0.9">
    <!-- Tiny golden arch / library pillar badge to signify 'Library Property' -->
    <path d="M-8 8 L8 8 L8 11 L-8 11 Z" fill="#fbbf24"/>
    <path d="M-6 2 L-6 8 M-2 2 L-2 8 M2 2 L2 8 M6 2 L6 8" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="-8,2 0,-4 8,2" fill="#fbbf24"/>
  </g>

  <!-- Connection / Ownership indicator sparkles -->
  <g fill="#fbbf24">
    <circle cx="100" cy="85" r="2.5"/>
    <circle cx="118" cy="95" r="1.5"/>
    <circle cx="82" cy="95" r="2"/>
    <path d="M100 75 L101.5 79 L105.5 80.5 L101.5 82 L100 86 L98.5 82 L94.5 80.5 L98.5 79 Z" fill="#fde047"/>
  </g>

  <!-- Foreground plant for visual depth -->
  <g transform="translate(15, 175)">
    <path d="M0 25 C0 10 10 5 15 0 C15 10 10 20 0 25 Z" fill="#10b981"/>
    <path d="M10 30 C10 15 22 10 30 5 C25 18 18 25 10 30 Z" fill="#059669"/>
    <ellipse cx="12" cy="27" rx="12" ry="6" fill="#334155"/>
  </g>
</svg>