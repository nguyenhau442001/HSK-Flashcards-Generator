<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and lighting effects -->
  <defs>
    <!-- Background night sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing lantern light -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground gradient -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Path gradient -->
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed canvas background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Background Elements (Park Environment) -->
  <!-- Distant Glowing Moon / Soft Light -->
  <circle cx="190" cy="50" r="18" fill="#fbbf24" opacity="0.15"/>
  <circle cx="190" cy="50" r="32" fill="#f59e0b" opacity="0.06"/>

  <!-- Distant Trees and Foliage Silhouettes -->
  <path d="M20 150 Q28 110 40 100 Q52 110 60 150 Z" fill="#0f172a" opacity="0.7"/>
  <path d="M45 150 Q55 95 70 85 Q85 95 95 150 Z" fill="#131c2e" opacity="0.8"/>
  <path d="M160 150 Q175 100 190 90 Q205 100 220 150 Z" fill="#131c2e" opacity="0.8"/>
  <path d="M185 150 Q200 110 215 100 Q230 110 240 150 Z" fill="#0f172a" opacity="0.7"/>

  <!-- Park Bridge / Arch Structure in Background -->
  <path d="M70 145 C110 120 130 120 170 145" fill="none" stroke="#334155" stroke-width="3" opacity="0.4"/>

  <!-- Traditional Park Lamppost casting warm glow -->
  <g transform="translate(145, 75)">
    <!-- Glow circle around lantern -->
    <circle cx="5" cy="30" r="45" fill="url(#lanternGlow)"/>
    <!-- Post -->
    <rect x="2" y="35" width="6" height="115" fill="#0f172a"/>
    <!-- Lamp Head -->
    <path d="M-2 35 L12 35 L15 20 L-5 20 Z" fill="#334155"/>
    <path d="M5 20 L5 8" stroke="#334155" stroke-width="2"/>
    <polygon points="5,5 -3,15 13,15" fill="#f59e0b"/>
    <rect x="0" y="22" width="10" height="12" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Ground Plane -->
  <path d="M0 150 Q120 140 240 150 L240 240 L0 240 Z" fill="url(#groundGrad)"/>

  <!-- Winding Park Stone Path -->
  <path d="M-10 165 C60 155 100 210 250 195 L250 240 L-10 240 Z" fill="url(#pathGrad)"/>
  
  <!-- Path Stone Details -->
  <ellipse cx="60" cy="175" rx="12" ry="5" fill="#475569" opacity="0.3"/>
  <ellipse cx="110" cy="190" rx="16" ry="6" fill="#475569" opacity="0.3"/>
  <ellipse cx="165" cy="182" rx="10" ry="4" fill="#475569" opacity="0.2"/>
  <ellipse cx="200" cy="205" rx="14" ry="5" fill="#475569" opacity="0.25"/>

  <!-- Foreground Bushes for Depth -->
  <path d="M-10 160 Q15 135 40 160 Q65 140 90 165 Z" fill="#1e293b"/>
  <path d="M190 175 Q215 145 240 165 L240 240 L190 240 Z" fill="#162032"/>

  <!-- ==================== MAIN CHARACTERS WALKING (散步) ==================== -->

  <!-- CHARACTER 1: Woman Walking (Left/Lead) -->
  <g transform="translate(85, 125)">
    <!-- Shadow beneath character -->
    <ellipse cx="15" cy="45" rx="16" ry="6" fill="#000000" opacity="0.3"/>

    <!-- Back Arm (swinging forward) -->
    <path d="M10,12 C18,18 22,25 25,32" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Torso (Dynamic leaning forward slightly for walking motion) -->
    <path d="M5,5 C12,5 15,22 12,35 L18,35 C16,20 12,10 5,5 Z" fill="#ec4899"/> <!-- Stylish pink jacket -->

    <!-- Back Leg (stepping back) -->
    <path d="M8,33 C-2,38 -8,45 -12,52" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Back Shoe -->
    <ellipse cx="-13" cy="54" rx="5" ry="3" fill="#0f172a"/>

    <!-- Front Leg (stepping forward) -->
    <path d="M14,33 C22,40 28,48 32,54" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Front Shoe -->
    <ellipse cx="34" cy="55" rx="6" ry="3" fill="#0f172a"/>

    <!-- Head & Hair -->
    <circle cx="8" cy="-5" r="9" fill="#fde047"/> <!-- Face -->
    <path d="M-2,-7 C2,-14 16,-10 14,-1 C16,-7 8,-12 -1,-8 Z" fill="#0f172a"/> <!-- Ponytail hair -->

    <!-- Front Arm (swinging backward) -->
    <path d="M8,12 C2,18 -3,24 -8,30" fill="none" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="-10" cy="31" r="2.5" fill="#fde047"/>
  </g>

  <!-- CHARACTER 2: Man Walking (Right/Following) -->
  <g transform="translate(130, 115)">
    <!-- Shadow beneath character -->
    <ellipse cx="15" cy="55" rx="18" ry="7" fill="#000000" opacity="0.3"/>

    <!-- Back Arm (swinging backward) -->
    <path d="M15,18 C10,25 4,32 0,38" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

    <!-- Torso (blue casual jacket) -->
    <path d="M8,8 C16,8 20,25 16,42 L24,42 C20,25 15,15 8,8 Z" fill="#0ea5e9"/>

    <!-- Back Leg (stepping forward) -->
    <path d="M12,40 C18,48 24,56 30,62" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <!-- Back Shoe -->
    <ellipse cx="32" cy="63" rx="6" ry="3" fill="#0f172a"/>

    <!-- Front Leg (stepping back) -->
    <path d="M18,40 C10,48 4,55 -2,62" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <!-- Front Shoe -->
    <ellipse cx="-4" cy="63" rx="6" ry="3" fill="#0f172a"/>

    <!-- Head & Hair -->
    <circle cx="12" cy="-1" r="10" fill="#fde047"/> <!-- Face -->
    <path d="M3,-9 C12,-12 21,-5 20,1 L5,-2 Z" fill="#334155"/> <!-- Short hair -->

    <!-- Front Arm (swinging forward, slightly bent) -->
    <path d="M16,18 C24,24 28,32 24,40" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="23" cy="42" r="3" fill="#fde047"/>
  </g>

  <!-- Cute Little Companion Dog Walking Along -->
  <g transform="translate(180, 155)">
    <!-- Dog Shadow -->
    <ellipse cx="12" cy="23" rx="12" ry="4" fill="#000000" opacity="0.3"/>
    
    <!-- Body -->
    <ellipse cx="12" cy="12" rx="13" ry="8" fill="#fb923c"/>
    
    <!-- Head -->
    <circle cx="23" cy="7" r="7" fill="#fb923c"/>
    <!-- Floppy Ear -->
    <path d="M22,2 C18,2 18,10 21,11 Z" fill="#ea580c"/>
    
    <!-- Legs (Walking pose) -->
    <line x1="5" y1="18" x2="3" y2="24" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="18" x2="11" y2="24" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="18" x2="14" y2="24" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="18" x2="22" y2="24" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

    <!-- Tail (wagging up) -->
    <path d="M-1,10 C-6,7 -4,2 -2,4" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Leaves / Glowing Particles for atmosphere -->
  <circle cx="35" cy="80" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="105" cy="55" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="215" cy="115" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="75" cy="130" r="1" fill="#f472b6" opacity="0.8"/>
</svg>