<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Classroom Background -->
  <rect x="20" y="40" width="200" height="120" rx="4" fill="#334155" opacity="0.5"/>
  <rect x="30" y="50" width="180" height="100" rx="2" fill="#1e293b"/>
  <rect x="40" y="60" width="160" height="80" fill="#0f172a" rx="2"/>
  
  <!-- Teacher -->
  <g transform="translate(140, 90)">
    <circle cx="0" cy="-20" r="15" fill="#fde68a"/>
    <path d="M-5 -15 Q0 -10 5 -15" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="-20" y="-5" width="40" height="50" rx="8" fill="#38bdf8"/>
    <rect x="-22" y="0" width="44" height="10" rx="2" fill="#0ea5e9"/>
    <path d="M-10 45 L-15 80 M10 45 L15 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Student -->
  <g transform="translate(80, 110)">
    <circle cx="0" cy="-20" r="12" fill="#fecaca"/>
    <rect x="-15" y="-5" width="30" height="40" rx="6" fill="#ec4899"/>
    <path d="M-8 35 L-10 60 M8 35 L10 60" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Desk and Props -->
  <rect x="20" y="160" width="200" height="40" fill="#475569" rx="4"/>
  <rect x="30" y="170" width="180" height="20" fill="#334155" rx="2"/>
  
  <!-- Books/Papers -->
  <rect x="150" y="145" width="40" height="30" rx="2" fill="#fbbf24"/>
  <rect x="155" y="150" width="30" height="2" fill="#0f172a"/>
  <rect x="155" y="155" width="30" height="2" fill="#0f172a"/>
  <rect x="155" y="160" width="20" height="2" fill="#0f172a"/>
  
  <!-- Pointer/Pen -->
  <path d="M130 100 L150 130" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="30" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="40" cy="200" r="3" fill="#10b981" opacity="0.6"/>
</svg>