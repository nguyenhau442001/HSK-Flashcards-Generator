<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>
  
  <!-- Background Road/Journey path representing distance/time -->
  <path d="M 40 140 Q 100 130 160 90" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <path d="M 40 140 Q 100 130 160 90" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>

  <!-- Starting Point (Location A) -->
  <circle cx="45" cy="138" r="8" fill="#fb923c"/>
  <circle cx="45" cy="138" r="4" fill="#1e293b"/>

  <!-- Ending Point (Airport/Destination B) -->
  <circle cx="155" cy="92" r="10" fill="#10b981"/>
  <path d="M 151 92 L 154 95 L 160 88" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clock & Approximate Symbol (Main Visual Anchor for '大约' / 'khoảng') -->
  <!-- Clock Body -->
  <circle cx="100" cy="75" r="32" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
  
  <!-- Clock Inner Details -->
  <circle cx="100" cy="75" r="2" fill="#f59e0b"/>
  <!-- Clock Hands (Showing roughly 1 hour duration arc) -->
  <line x1="100" y1="75" x2="100" y2="57" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="75" x2="114" y2="75" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Tilde / Approximate Wave Symbol floating above clock -->
  <path d="M 85 30 Q 92 24 100 30 Q 108 36 115 30" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 85 38 Q 92 32 100 38 Q 108 44 115 38" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Airplane Icon in flight near airport -->
  <g transform="translate(125, 55) rotate(-20) scale(0.6)">
    <path d="M 0 10 L 25 0 L 28 4 L 10 12 L 25 18 L 25 22 L 10 16 L 2 24 L -2 22 L 4 13 L 0 10 Z" fill="#38bdf8"/>
  </g>

</svg>