<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- INTERIOR ENVIRONMENT (Startup Office) -->
  <!-- Wallpaper / Back wall -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Window showing city skyline / growth -->
  <g opacity="0.8">
    <rect x="155" y="35" width="50" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <path d="M 155 35 L 205 35 L 205 105 L 155 105 Z" fill="url(#windowLight)"/>
    <!-- City Buildings outside -->
    <rect x="162" y="60" width="10" height="45" fill="#334155"/>
    <rect x="175" y="50" width="12" height="55" fill="#1e293b"/>
    <rect x="190" y="70" width="10" height="35" fill="#334155"/>
    <!-- Window pane grid -->
    <line x1="180" y1="35" x2="180" y2="105" stroke="#475569" stroke-width="1"/>
    <line x1="155" y1="70" x2="205" y2="70" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Inspirational Startup Wall Art (Abstract growth chart) -->
  <g transform="translate(35, 38)">
    <rect width="35" height="45" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <polyline points="8,35 17,25 27,12" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="27" cy="12" r="3" fill="#38bdf8"/>
  </g>

  <!-- Bookshelf / Storage Box in background -->
  <rect x="80" y="45" width="25" height="40" rx="2" fill="#334155" />
  <rect x="83" y="50" width="19" height="6" rx="1" fill="#64748b" />
  <rect x="83" y="60" width="19" height="6" rx="1" fill="#38bdf8" />

  <!-- Hanging Pendent Lamp -->
  <line x1="120" y1="20" x2="120" y2="55" stroke="#64748b" stroke-width="2"/>
  <path d="M 105 55 L 135 55 L 140 65 L 100 65 Z" fill="#fbbf24" filter="url(#softShadow)"/>
  <!-- Light cone -->
  <polygon points="120,65 70,170 170,170" fill="#fbbf24" opacity="0.08"/>

  <!-- WORKSTATION DESK -->
  <!-- Main Desk Surface -->
  <path d="M 20 160 L 220 160 L 210 195 L 30 195 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="1.5" filter="url(#softShadow)"/>
  <!-- Desk Front Edge Accent -->
  <path d="M 30 195 L 210 195 L 210 199 L 30 199 Z" fill="#0f172a" rx="2"/>

  <!-- PROPS ON DESK -->
  <!-- Laptop -->
  <g transform="translate(130, 135)">
    <!-- Base -->
    <polygon points="-10,25 45,25 55,35 -20,35" fill="#64748b"/>
    <polygon points="-5,26 40,26 48,34 -12,34" fill="#94a3b8"/>
    <!-- Screen -->
    <rect x="-8" y="-5" width="50" height="30" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <rect x="-4" y="-1" width="42" height="22" rx="1" fill="#38bdf8" opacity="0.2"/>
    <!-- Code/UI lines on screen -->
    <line x1="0" y1="4" x2="20" y2="4" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="30" y2="10" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="15" y2="16" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Startup Startup Document / Business Plan -->
  <g transform="translate(75, 145) rotate(-8)">
    <rect width="28" height="35" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="6" y1="8" x2="22" y2="8" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="18" y2="14" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="22" y2="20" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="26" x2="14" y2="26" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Red Stamp for official startup creation -->
    <circle cx="20" cy="26" r="5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(50, 142)">
    <rect x="0" y="5" width="14" height="18" rx="2" fill="#ec4899"/>
    <path d="M 14 8 C 19 8, 19 18, 14 18" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 4 1 C 6 0, 4 -3, 6 -5" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 10 2 C 12 1, 10 -2, 12 -4" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Small Indoor Plant (representing growth of the small business) -->
  <g transform="translate(190, 135)">
    <path d="M 2 15 L 12 15 L 10 26 L 4 26 Z" fill="#f43f5e"/>
    <!-- Leaves -->
    <path d="M 7 15 Q 2 5, -3 8 Q -2 15, 7 15" fill="#10b981"/>
    <path d="M 7 15 Q 12 2, 17 6 Q 14 15, 7 15" fill="#34d399"/>
    <path d="M 7 15 Q 7 2, 7 -2 Q 9 5, 7 15" fill="#059669"/>
  </g>

  <!-- MAIN CHARACTER: Entrepreneur starting his business -->
  <g transform="translate(90, 85)">
    <!-- Torso & Body -->
    <path d="M 25 50 C 15 50, 5 65, 0 85 L 60 85 C 55 65, 45 50, 35 50 Z" fill="#3b82f6" filter="url(#softShadow)"/>
    <!-- Collar & Tie (Professional look) -->
    <polygon points="30,50 35,62 30,70 25,62" fill="#ffffff"/>
    <polygon points="29,58 31,58 32,72 30,76 28,72" fill="#ef4444"/>

    <!-- Arms -->
    <!-- Left arm (reaching forward/typing or gesturing proudly) -->
    <path d="M 10 55 Q -5 65, 5 78" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <!-- Right arm (bent, hand near chin/laptop) -->
    <path d="M 50 55 Q 65 65, 50 75" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>

    <!-- Head & Neck -->
    <rect x="25" y="40" width="10" height="12" fill="#fbcfe8"/>
    <circle cx="30" cy="28" r="15" fill="#fbcfe8" filter="url(#softShadow)"/>

    <!-- Hair (Stylized modern neat hair) -->
    <path d="M 15 28 C 15 15, 30 12, 43 20 C 45 25, 42 28, 42 28 C 42 28, 38 18, 28 18 C 18 18, 16 25, 15 28 Z" fill="#1e293b"/>

    <!-- Facial Expression: Confident, smiling, entrepreneurial spark -->
    <!-- Glasses (Smart founder look) -->
    <rect x="20" y="21" width="9" height="7" rx="1.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="31" y="21" width="9" height="7" rx="1.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="29" y1="24" x2="31" y2="24" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Gentle confident smile -->
    <path d="M 26 34 Q 30 38, 34 34" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cheeks (Warmth) -->
    <circle cx="21" cy="32" r="2.5" fill="#f43f5e" opacity="0.3"/>
    <circle cx="39" cy="32" r="2.5" fill="#f43f5e" opacity="0.3"/>
  </g>

  <!-- FLOATING SYMBOL OF SUCCESS / LAUNCH (Subtle, non-textual context enhancer) -->
  <g transform="translate(170, 75)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="12" fill="#fbbf24" opacity="0.9"/>
    <!-- Rocket / Arrow upward icon inside badge -->
    <path d="M 0 -6 L 4 2 L 1 2 L 1 6 L -1 6 L -1 2 L -4 2 Z" fill="#0f172a"/>
  </g>
</svg>