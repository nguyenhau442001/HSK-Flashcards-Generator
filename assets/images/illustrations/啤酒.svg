<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Amber Beer Gradient -->
    <linearGradient id="beerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glass Glow / Highlight -->
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <circle cx="120" cy="90" r="70" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>
  
  <!-- Wooden Table Surface -->
  <path d="M 0,165 L 240,165 L 240,240 L 0,240 Z" fill="url(#tableGrad)"/>
  <!-- Table Edge Highlight -->
  <path d="M 0,165 L 240,165" stroke="#475569" stroke-width="2" opacity="0.6"/>

  <!-- Scene Context Props: Secondary Small Glass / Coaster -->
  <g transform="translate(45, 145)">
    <!-- Coaster -->
    <ellipse cx="25" cy="20" rx="28" ry="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
    <!-- Small Glass Body -->
    <path d="M 14,0 L 36,0 L 32,22 L 18,22 Z" fill="url(#beerGrad)" opacity="0.8"/>
    <!-- Small Glass Foam -->
    <ellipse cx="25" cy="0" rx="11" ry="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- MAIN SUBJECT: Frothy Beer Mug (啤酒) -->
  <g filter="url(#dropShadow)">
    
    <!-- Mug Handle -->
    <path d="M 152,78 
             C 185,78 185,138 152,138" 
          fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M 152,86 
             C 173,86 173,130 152,130" 
          fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

    <!-- Glass Body Outer Shape -->
    <path d="M 78,55 
             L 142,55 
             L 134,155 
             C 133,160 128,164 122,164 
             L 98,164 
             C 92,164 87,160 86,155 Z" 
          fill="#334155" opacity="0.3"/>

    <!-- Beer Liquid with Dimples/Facets -->
    <path d="M 82,65 
             L 138,65 
             L 131,152 
             C 131,156 127,159 123,159 
             L 97,159 
             C 93,159 89,156 88,152 Z" 
          fill="url(#beerGrad)"/>

    <!-- Glass Base (Thick Bottom) -->
    <path d="M 86,155 L 134,155 L 132,163 C 132,166 128,168 124,168 L 96,168 C 92,168 88,166 88,163 Z" fill="#64748b" opacity="0.8"/>

    <!-- Beer Surface Wave inside Glass -->
    <ellipse cx="110" cy="65" rx="28" ry="5" fill="#fb923c" opacity="0.7"/>

    <!-- Rising Bubbles inside Beer -->
    <circle cx="102" cy="130" r="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="105" cy="110" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="118" cy="120" r="3.5" fill="#ffffff" opacity="0.4"/>
    <circle cx="114" cy="95" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="124" cy="105" r="1.5" fill="#ffffff" opacity="0.6"/>

    <!-- Glass Facet Lines (Vertical Highlights) -->
    <path d="M 98,68 L 98,154" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
    <path d="M 110,68 L 110,156" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
    <path d="M 122,68 L 122,154" stroke="#ffffff" stroke-width="2" opacity="0.15"/>

    <!-- Glass Shine Overlay -->
    <path d="M 82,65 L 138,65 L 131,152 C 131,156 127,159 123,159 L 97,159 C 93,159 89,156 88,152 Z" fill="url(#glassShine)"/>

    <!-- Overflowing Creamy Foam (Rich and Dynamic) -->
    <g>
      <!-- Base Foam Mass -->
      <path d="M 75,65 
               C 70,65 68,50 78,42 
               C 82,35 90,30 100,35 
               C 108,22 124,20 134,32 
               C 145,28 152,38 149,48 
               C 158,52 155,68 145,68 Z" 
            fill="#f8fafc"/>
      
      <!-- Foam Bubbles / Puffs Overlay for Depth -->
      <circle cx="85" cy="45" r="12" fill="#ffffff"/>
      <circle cx="100" cy="35" r="15" fill="#ffffff"/>
      <circle cx="118" cy="33" r="14" fill="#ffffff"/>
      <circle cx="136" cy="42" r="13" fill="#ffffff"/>
      <circle cx="142" cy="55" r="10" fill="#f1f5f9"/>
      <circle cx="78" cy="58" r="10" fill="#e2e8f0"/>

      <!-- Drips of Foam -->
      <path d="M 74,58 C 70,62 70,72 76,75 C 79,77 82,72 80,68 Z" fill="#ffffff"/>
      <path d="M 144,60 C 150,65 152,74 147,78 C 144,80 141,74 143,68 Z" fill="#ffffff"/>
      <circle cx="112" cy="72" r="5" fill="#ffffff"/>
    </g>

    <!-- Flying Foam Droplets (Action-packed energy) -->
    <circle cx="95" cy="18" r="3.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="110" cy="12" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="128" cy="16" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="140" cy="24" r="2.5" fill="#ffffff" opacity="0.7"/>
    <path d="M 125,8 Q 128,4 131,8 Z" fill="#ffffff" opacity="0.8"/>

  </g>

  <!-- Atmospheric Lighting / Ambient Sparkles -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="40" cy="80" r="2"/>
    <circle cx="55" cy="50" r="1.5"/>
    <circle cx="190" cy="90" r="2.5"/>
    <circle cx="205" cy="120" r="1.5"/>
    <circle cx="180" cy="50" r="2"/>
  </g>

  <!-- Subtle floor shadow under main glass -->
  <ellipse cx="110" cy="170" rx="30" ry="6" fill="#020617" opacity="0.5"/>

</svg>