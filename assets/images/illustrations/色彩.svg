<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a" />
  
  <!-- Atmospheric Interior Glow -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6" />

  <!-- Artist's Studio Wall & Decor -->
  <!-- Hanging plant / Warm studio light accent -->
  <path d="M195 20 L210 50 L180 50 Z" fill="#334155" opacity="0.7" />
  <path d="M195 50 L195 70" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <circle cx="195" cy="78" r="8" fill="#10b981" />
  <path d="M187 75 Q195 70 203 76 Q195 86 187 75" fill="#34d399" />

  <!-- Wooden Easel Structure -->
  <!-- Rear leg -->
  <line x1="120" y1="35" x2="135" y2="210" stroke="#332922" stroke-width="4" stroke-linecap="round" />
  <!-- Left front leg -->
  <line x1="120" y1="35" x2="65" y2="215" stroke="#45352c" stroke-width="5" stroke-linecap="round" />
  <!-- Right front leg -->
  <line x1="120" y1="35" x2="175" y2="215" stroke="#45352c" stroke-width="5" stroke-linecap="round" />
  
  <!-- Easel Crossbar & Canvas Platform -->
  <line x1="78" y1="175" x2="162" y2="175" stroke="#5c4538" stroke-width="6" stroke-linecap="round" />

  <!-- THE VIBRANT PAINTING (Representing 'rich/abundant colors') -->
  <rect x="74" y="55" width="92" height="122" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  
  <!-- Painting Inner Art - Rich, colorful abstract landscape scene -->
  <g clip-path="url(#canvasClip)">
    <clipPath id="canvasClip">
      <rect x="76" y="57" width="88" height="118" rx="2" />
    </clipPath>
    <!-- Sky gradient simulation with multiple bright color strokes -->
    <rect x="76" y="57" width="88" height="60" fill="#fef08a" />
    <path d="M76 57 Q 120 80 164 65 L 164 57 L 76 57 Z" fill="#fb923c" />
    <path d="M76 80 Q 110 50 164 90 L 164 110 L 76 110 Z" fill="#ec4899" opacity="0.8" />
    
    <!-- Radiant Sun -->
    <circle cx="120" cy="85" r="16" fill="#facc15" />
    <circle cx="120" cy="85" r="22" fill="#f97316" opacity="0.4" />

    <!-- Hills / Mountains with diverse saturated colors -->
    <path d="M76 125 Q 100 100 130 120 Q 150 135 164 115 L 164 175 L 76 175 Z" fill="#38bdf8" />
    <path d="M76 140 Q 110 115 140 145 Q 155 155 164 140 L 164 175 L 76 175 Z" fill="#10b981" />
    <path d="M90 175 Q 120 130 164 155 L 164 175 Z" fill="#a855f7" />
    
    <!-- Paint splatters & rich texture on canvas -->
    <circle cx="95" cy="70" r="3" fill="#ef4444" />
    <circle cx="145" cy="100" r="4" fill="#3b82f6" />
    <circle cx="105" cy="140" r="3.5" fill="#fef08a" />
    <circle cx="135" cy="130" r="2.5" fill="#ec4899" />
  </g>

  <!-- Artist Character (Lower Left / Side View) -->
  <!-- Body/Apron -->
  <path d="M55 215 C55 190 70 175 80 170 L70 215 Z" fill="#0284c7" />
  <path d="M60 215 C60 185 80 175 85 170 L95 215 Z" fill="#0369a1" />

  <!-- Painter's Arm holding brush up to canvas -->
  <path d="M75 185 Q 95 160 108 145" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M108 145 L 118 135" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" /> <!-- Brush handle -->
  <path d="M117 134 L 121 130" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" /> <!-- Wet brush tip -->

  <!-- Head & Hair -->
  <circle cx="58" cy="162" r="14" fill="#fbcfe8" /> <!-- Face -->
  <path d="M44 162 C44 148 55 144 68 152 C65 142 55 145 48 155 Z" fill="#334155" /> <!-- Stylish hair -->
  
  <!-- Expressive Happy Eye/Smile (Profile) -->
  <path d="M54 160 Q 57 163 60 160" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M57 167 Q 60 170 63 167" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- Smile -->

  <!-- Palette Table / Stool prop with paint tubes & jars -->
  <!-- Small side table -->
  <rect x="25" y="195" width="45" height="25" rx="3" fill="#334155" />
  <line x1="33" y1="220" x2="30" y2="235" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <line x1="62" y1="220" x2="65" y2="235" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

  <!-- Artist Palette with colorful blobs -->
  <ellipse cx="40" cy="190" rx="14" ry="9" fill="#fef08a" transform="rotate(-15 40 190)" />
  <circle cx="35" cy="188" r="2.5" fill="#ef4444" />
  <circle cx="42" cy="186" r="2.5" fill="#3b82f6" />
  <circle cx="46" cy="192" r="2.5" fill="#10b981" />
  <circle cx="37" cy="194" r="2" fill="#ec4899" />

  <!-- Paint Jar & Brushes container -->
  <rect x="52" y="178" width="12" height="17" rx="2" fill="#cbd5e1" opacity="0.9" />
  <rect x="54" y="176" width="8" height="3" fill="#f59e0b" />
  <!-- Brushes in jar -->
  <line x1="56" y1="176" x2="52" y2="164" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="176" x2="64" y2="162" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />

  <!-- Floating color spectrum accents to emphasize 'rich colors' -->
  <circle cx="178" cy="100" r="6" fill="#f43f5e" opacity="0.8" />
  <circle cx="188" cy="115" r="4" fill="#0ea5e9" opacity="0.9" />
  <circle cx="172" cy="130" r="5" fill="#a855f7" opacity="0.85" />
  <circle cx="184" cy="145" r="3" fill="#10b981" opacity="0.9" />
  
  <path d="M178 94 Q 185 110 188 115" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2" opacity="0.5" fill="none" />
  <path d="M188 115 Q 180 125 172 130" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2" opacity="0.5" fill="none" />
</svg>