<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Train Exterior Gradient -->
    <linearGradient id="trainBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Warm Interior Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Platform Light Gradient -->
    <linearGradient id="lightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Railway Station Interior & Background Elements -->
  <g id="station-environment">
    <!-- Tunnel/Architecture background -->
    <path d="M0 60 L240 60 L240 240 L0 240 Z" fill="#090d16" />
    
    <!-- Overhead Station Structure & Lights -->
    <rect x="0" y="40" width="240" height="15" fill="#334155" />
    <circle cx="60" cy="55" r="4" fill="#fbbf24" />
    <circle cx="120" cy="55" r="4" fill="#fbbf24" />
    <circle cx="180" cy="55" r="4" fill="#fbbf24" />
    
    <polygon points="40,55 80,55 70,40 50,40" fill="#475569" />
    <polygon points="100,55 140,55 130,40 110,40" fill="#475569" />
    <polygon points="160,55 200,55 190,40 170,40" fill="#475569" />

    <!-- Ambient Platform Lights -->
    <polygon points="20,55 10,240 50,240" fill="url(#lightCone)" />
    <polygon points="220,55 190,240 230,240" fill="url(#lightCone)" />

    <!-- Station Pillar -->
    <rect x="195" y="55" width="25" height="185" fill="#1e293b" />
    <rect x="190" y="55" width="35" height="10" fill="#334155" />
  </g>

  <!-- THE TRAIN (Modern High-Speed Rail) -->
  <g id="train-carriage" filter="url(#shadow)">
    <!-- Train Main Body -->
    <path d="M 15 100 Q 15 85 30 85 L 225 85 Q 240 85 240 100 L 240 195 Q 240 205 225 205 L 30 205 Q 15 205 15 195 Z" fill="url(#trainBody)" />
    
    <!-- Train Nose/Curve (Left side facing forward slightly) -->
    <path d="M 30 85 L 15 100 L 15 195 L 30 205 Z" fill="#0284c7" />

    <!-- Train Stripe Accent -->
    <rect x="15" y="130" width="225" height="12" fill="#fb923c" />
    <rect x="15" y="142" width="225" height="4" fill="#f97316" />

    <!-- Train Windows with Warm Interior Glow -->
    <!-- Window 1 -->
    <rect x="40" y="98" width="35" height="24" rx="4" fill="url(#windowGlow)" />
    <rect x="42" y="100" width="31" height="20" rx="2" fill="#fef08a" opacity="0.6" />
    
    <!-- Window 2 (Boarding Door Area) -->
    <rect x="85" y="98" width="35" height="24" rx="4" fill="url(#windowGlow)" />
    
    <!-- Window 3 -->
    <rect x="130" y="98" width="35" height="24" rx="4" fill="url(#windowGlow)" />
    
    <!-- Window 4 -->
    <rect x="175" y="98" width="35" height="24" rx="4" fill="url(#windowGlow)" />

    <!-- Train Underbelly / Tracks -->
    <rect x="25" y="205" width="200" height="12" rx="3" fill="#0f172a" />
    <rect x="45" y="217" width="160" height="6" fill="#334155" />
    
    <!-- Railway Track -->
    <rect x="0" y="222" width="240" height="4" fill="#64748b" />
    <line x1="20" y1="222" x2="10" y2="240" stroke="#475569" stroke-width="4" />
    <line x1="70" y1="222" x2="60" y2="240" stroke="#475569" stroke-width="4" />
    <line x1="120" y1="222" x2="110" y2="240" stroke="#475569" stroke-width="4" />
    <line x1="170" y1="222" x2="160" y2="240" stroke="#475569" stroke-width="4" />
    <line x1="220" y1="222" x2="210" y2="240" stroke="#475569" stroke-width="4" />
  </g>

  <!-- PLATFORM FLOOR -->
  <path d="M 0 210 L 240 210 L 240 240 L 0 240 Z" fill="#334155" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#475569" stroke-width="3" />
  <!-- Yellow safety line on platform -->
  <line x1="0" y1="215" x2="240" y2="215" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10, 5" />

  <!-- MAIN CHARACTER BOARDING THE TRAIN (Action: 乘坐 - Riding/Entering Public Transport) -->
  <g id="character-boarding" filter="url(#shadow)">
    <!-- Luggage (Rolling suitcase prop establishing travel context) -->
    <g id="suitcase" transform="translate(145, 175)">
      <rect x="0" y="0" width="18" height="26" rx="4" fill="#ec4899" />
      <rect x="3" y="-6" width="12" height="6" rx="2" fill="#be185d" />
      <line x1="9" y1="0" x2="9" y2="26" stroke="#be185d" stroke-width="1.5" />
      <!-- Wheels -->
      <circle cx="4" cy="28" r="2" fill="#0f172a" />
      <circle cx="14" cy="28" r="2" fill="#0f172a" />
      <!-- Handle/Pull -->
      <path d="M 9 -6 L 9 -12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Character Body & Poses -->
    <!-- Right Leg (Stepping up onto train) -->
    <path d="M 112 185 L 115 155 L 102 125" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shoe Right -->
    <ellipse cx="98" cy="123" rx="7" ry="4" fill="#1e293b" />

    <!-- Torso (Dynamic leaning forward into the train doors) -->
    <path d="M 105 165 C 105 140, 115 110, 100 90" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" />

    <!-- Left Leg (Pushing off platform) -->
    <path d="M 118 185 L 130 200 L 142 205" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shoe Left -->
    <ellipse cx="145" cy="207" rx="8" ry="4" fill="#1e293b" />

    <!-- Left Arm (Reaching forward/balancing inside the open train door) -->
    <path d="M 100 100 L 80 105 L 65 115" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand -->
    <circle cx="62" cy="116" r="4" fill="#fcd34d" />

    <!-- Right Arm (Pulling luggage behind) -->
    <path d="M 108 100 L 125 125 L 138 145" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand holding suitcase handle -->
    <circle cx="140" cy="148" r="3.5" fill="#fcd34d" />

    <!-- Backpack -->
    <path d="M 92 88 C 85 90, 85 110, 95 115 C 100 115, 102 100, 102 95 Z" fill="#8b5cf6" />
    <path d="M 94 92 L 88 102" stroke="#6d28d9" stroke-width="2" />

    <!-- Head & Face (Action-oriented expression, looking forward) -->
    <g id="head" transform="translate(95, 75)">
      <!-- Hair -->
      <path d="M -8 -2 C -10 -12, 10 -15, 14 -4 C 18 2, 12 6, 8 6 Z" fill="#1e293b" />
      <!-- Face Base -->
      <circle cx="2" cy="2" r="11" fill="#fcd34d" />
      <!-- Dynamic Hair Bangs -->
      <path d="M -5 -4 C -2 -8, 8 -6, 10 -2 C 6 -3, -2 -3, -5 -4 Z" fill="#1e293b" />
      <!-- Determined Eye (Slanted forward for motion) -->
      <circle cx="6" cy="1" r="1.5" fill="#1e293b" />
      <!-- Cheeks with happy flush -->
      <ellipse cx="5" cy="5" rx="2" ry="1" fill="#f43f5e" opacity="0.4" />
      <!-- Scarf fluttering in motion -->
      <path d="M -3 10 C 5 12, 12 15, 20 10" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>

  <!-- FOREGROUND ATMOSPHERIC DETAILS -->
  <!-- Subtle motion lines emphasizing boarding speed -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="130" x2="35" y2="130" />
    <line x1="10" y1="145" x2="30" y2="145" />
    <line x1="25" y1="160" x2="40" y2="160" />
  </g>

</svg>