<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>
  
  <!-- Subtle decorative road/track element representing travel -->
  <path d="M 50 140 L 150 140" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>

  <!-- Transport (Sleek Modern Train/Bus Icon) representing 'chéng' (ride/take) -->
  <g transform="translate(0, 5)">
    <!-- Main Body -->
    <rect x="55" y="70" width="90" height="45" rx="14" fill="#38bdf8"/>
    
    <!-- Windshield / Front Window -->
    <path d="M 125 74 L 140 74 C 143.314 74 146 76.686 146 80 L 146 92 L 125 92 Z" fill="#0f172a" opacity="0.8"/>
    
    <!-- Passenger Windows -->
    <rect x="100" y="76" width="18" height="16" rx="4" fill="#0f172a" opacity="0.8"/>
    <rect x="76" y="76" width="18" height="16" rx="4" fill="#0f172a" opacity="0.8"/>
    
    <!-- Headlight / Accent -->
    <rect x="142" y="96" width="5" height="6" rx="2" fill="#f59e0b"/>

    <!-- Wheels -->
    <circle cx="75" cy="120" r="8" fill="#0f172a"/>
    <circle cx="75" cy="120" r="3" fill="#64748b"/>
    
    <circle cx="125" cy="120" r="8" fill="#0f172a"/>
    <circle cx="125" cy="120" r="3" fill="#64748b"/>
  </g>

  <!-- Motion / Speed Lines (Left side) -->
  <path d="M 35 85 L 45 85" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 30 100 L 45 100" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Boarding / Action Indicator (Curved arrow wrapping into the vehicle) representing the verb aspect of entering/riding -->
  <path d="M 70 45 C 90 35, 110 45, 115 65" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M 108 58 L 116 66 L 122 56" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>