<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Stage Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Comedian Body -->
  <g transform="translate(120, 140)">
    <!-- Legs -->
    <rect x="-15" y="0" width="10" height="40" rx="4" fill="#fb923c"/>
    <rect x="5" y="0" width="10" height="40" rx="4" fill="#fb923c"/>
    <!-- Torso -->
    <path d="M-20 -40 L20 -40 L15 0 L-15 0 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-65" r="25" fill="#fde68a"/>
    <!-- Expressive Face -->
    <path d="M-10 -70 Q-5 -75 0 -70 T10 -70" stroke="#1e293b" stroke-width="2" fill="none"/>
    <circle cx="-8" cy="-75" r="2" fill="#1e293b"/>
    <circle cx="8" cy="-75" r="2" fill="#1e293b"/>
    <path d="M-8 -60 Q0 -50 8 -60" stroke="#1e293b" stroke-width="3" fill="none"/>
    <!-- Microphone Stand -->
    <rect x="25" y="-50" width="4" height="90" rx="2" fill="#94a3b8"/>
    <circle cx="27" cy="-55" r="8" fill="#f1f5f9"/>
  </g>
  
  <!-- Audience/Atmosphere -->
  <circle cx="40" cy="200" r="15" fill="#ec4899" opacity="0.6"/>
  <circle cx="200" cy="200" r="12" fill="#10b981" opacity="0.6"/>
  
  <!-- Spotlight Effect -->
  <path d="M120 -20 L60 240 L180 240 Z" fill="#f59e0b" opacity="0.05"/>
  
  <!-- Decorative Laughing Shapes -->
  <path d="M180 50 Q190 40 200 50 T220 50" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <path d="M20 50 Q30 40 40 50 T60 50" stroke="#fbbf24" stroke-width="3" fill="none"/>
</svg>