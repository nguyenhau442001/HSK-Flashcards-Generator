<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk Lamp Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Globe Gradient -->
    <linearGradient id="globeGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Shadow Filter for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Environment / Background details -->
  <!-- Bookshelf in background -->
  <g opacity="0.6">
    <rect x="25" y="40" width="60" height="90" rx="2" fill="#334155" />
    <!-- Shelf dividers -->
    <line x1="25" y1="70" x2="85" y2="70" stroke="#1e293b" stroke-width="3" />
    <line x1="25" y1="100" x2="85" y2="100" stroke="#1e293b" stroke-width="3" />
    <!-- Books on shelf -->
    <rect x="30" y="48" width="8" height="20" fill="#f43f5e" rx="1" />
    <rect x="40" y="45" width="10" height="23" fill="#10b981" rx="1" />
    <rect x="52" y="50" width="6" height="18" fill="#fbbf24" rx="1" />
    <rect x="62" y="46" width="12" height="22" fill="#8b5cf6" rx="1" />
    
    <rect x="30" y="78" width="14" height="20" fill="#0ea5e9" rx="1" />
    <rect x="47" y="80" width="8" height="18" fill="#f97316" rx="1" />
    <rect x="58" y="76" width="10" height="22" fill="#ec4899" rx="1" />
  </g>

  <!-- Window with subtle night/evening view -->
  <g transform="translate(160, 30)">
    <rect x="0" y="0" width="50" height="75" rx="4" fill="#090d16" stroke="#475569" stroke-width="2" />
    <!-- Window pane cross -->
    <line x1="25" y1="0" x2="25" y2="75" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="37" x2="50" y2="37" stroke="#475569" stroke-width="2" />
    <!-- Outside building silhouette / moon -->
    <circle cx="38" cy="18" r="6" fill="#cbd5e1" opacity="0.8" />
    <polygon points="5,75 5,55 18,48 18,75" fill="#1e293b" />
    <polygon points="20,75 20,40 38,32 38,75" fill="#1e293b" />
    <!-- Light beam from window -->
    <polygon points="0,0 50,0 120,160 0,160" fill="url(#windowLight)" pointer-events="none" />
  </g>

  <!-- Hanging Wall Banner / Chart (representing institutional context of politics) -->
  <g transform="translate(100, 25)">
    <rect x="0" y="0" width="35" height="45" rx="2" fill="#e2e8f0" filter="url(#softShadow)" />
    <!-- Wooden rod top -->
    <rect x="-3" y="-3" width="41" height="4" rx="2" fill="#b45309" />
    <!-- Abstract graphic representing structure/hierarchy (political science concept) -->
    <circle cx="17.5" cy="12" r="4" fill="#ef4444" />
    <circle cx="10" cy="24" r="3" fill="#3b82f6" />
    <circle cx="25" cy="24" r="3" fill="#3b82f6" />
    <line x1="15" y1="15" x2="11" y2="21" stroke="#64748b" stroke-width="1.5" />
    <line x1="20" y1="15" x2="24" y2="21" stroke="#64748b" stroke-width="1.5" />
    <!-- Accent lines simulating text/structure -->
    <line x1="8" y1="33" x2="27" y2="33" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="11" y1="38" x2="24" y2="38" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Study Desk Surface -->
  <g filter="url(#softShadow)">
    <path d="M 15 175 L 225 175 L 210 215 L 30 215 Z" fill="#334155" />
    <path d="M 15 170 L 225 170 L 225 175 L 15 175 Z" fill="#475569" />
  </g>

  <!-- Desk Props -->
  <!-- Globe (representing political geography/world affairs) -->
  <g transform="translate(45, 130)" filter="url(#softShadow)">
    <!-- Stand base -->
    <ellipse cx="12" cy="42" rx="10" ry="3" fill="#64748b" />
    <rect x="10" y="25" width="4" height="18" fill="#64748b" />
    <path d="M 6 12 C 16 8, 16 28, 12 32" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <!-- Globe sphere -->
    <circle cx="12" cy="14" r="14" fill="url(#globeGrad)" />
    <!-- Continents abstract silhouettes -->
    <path d="M 5 10 Q 9 6, 14 10 T 18 18 Q 12 22, 7 17 Z" fill="#10b981" opacity="0.8" />
    <path d="M 16 12 Q 20 15, 18 22 Z" fill="#10b981" opacity="0.8" />
  </g>

  <!-- Desk Lamp -->
  <g transform="translate(180, 110)">
    <!-- Lamp Base -->
    <ellipse cx="0" cy="62" rx="14" ry="4" fill="#0f172a" />
    <!-- Arm -->
    <path d="M 0 60 C -10 40, -15 20, -25 5" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <!-- Lamp Head & Bulb glow -->
    <path d="M -38 -3 C -30 -12, -15 -8, -20 5 Z" fill="#0f172a" />
    <circle cx="-29" cy="-1" r="18" fill="url(#lampGlow)" pointer-events="none" />
  </g>

  <!-- Open Textbook / Notebook on Desk -->
  <g transform="translate(100, 150)" filter="url(#softShadow)">
    <!-- Book cover shadow -->
    <path d="M -25 5 L 45 5 L 40 32 L -30 32 Z" fill="#0f172a" opacity="0.4" />
    <!-- Left Page -->
    <path d="M -22 2 C -5 0, 5 0, 22 2 L 22 28 C 5 26, -5 26, -22 28 Z" fill="#f8fafc" />
    <!-- Right Page -->
    <path d="M 22 2 C 39 0, 49 0, 66 2 L 66 28 C 49 26, 39 26, 22 28 Z" fill="#f8fafc" />
    <!-- Spine center line -->
    <line x1="22" y1="2" x2="22" y2="28" stroke="#cbd5e1" stroke-width="2" />
    <!-- Abstract text lines on pages (representing study material) -->
    <line x1="-15" y1="8" x2="5" y2="8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="-15" y1="13" x2="10" y2="13" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="-15" y1="18" x2="2" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    
    <line x1="29" y1="8" x2="55" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="29" y1="13" x2="59" y2="13" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="29" y1="18" x2="45" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="29" y1="23" x2="52" y2="23" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(155, 155)" filter="url(#softShadow)">
    <rect x="0" y="5" width="14" height="18" rx="2" fill="#ec4899" />
    <path d="M 14 8 C 19 8, 19 18, 14 18" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 4 0 C 6 -3, 2 -6, 4 -9" fill="none" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- MAIN CHARACTER: Student studying political science -->
  <g id="student-character">
    <!-- Chair Back -->
    <rect x="90" y="110" width="30" height="50" rx="6" fill="#475569" />
    
    <!-- Torso (leaning forward attentively) -->
    <g transform="translate(105, 125)">
      <path d="M -15 35 C -15 10, 10 5, 25 30 L 20 60 C 0 65, -10 60, -15 35 Z" fill="#2563eb" filter="url(#softShadow)" />
      <!-- Collar -->
      <path d="M 0 5 L 8 12 L 2 18" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 5 5 L -2 12 L 3 17" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Head and Face -->
    <g transform="translate(115, 95)" filter="url(#softShadow)">
      <!-- Neck -->
      <rect x="-4" y="12" width="10" height="15" fill="#fbcfe8" />

      <!-- Head Base -->
      <circle cx="0" cy="0" r="18" fill="#fbcfe8" />

      <!-- Hair Style (Modern neat student hair, dark brown/black) -->
      <path d="M -18 -2 C -18 -15, -5 -20, 10 -15 C 18 -12, 19 -5, 18 -2 C 16 -8, 8 -12, -2 -11 C -12 -10, -16 -4, -18 -2 Z" fill="#1e293b" />
      <path d="M -18 -2 C -15 -12, -5 -16, 5 -16 C 12 -16, 17 -10, 18 -4 C 14 -10, 5 -12, -5 -10 C -12 -8, -16 -4, -18 -2 Z" fill="#334155" />

      <!-- Focused Facial Expression -->
      <!-- Eyebrows (focused, slightly angled down) -->
      <line x1="-7" y1="-3" x2="-2" y2="-5" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <line x1="3" y1="-5" x2="8" y2="-3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      
      <!-- Eyes (concentrated dots) -->
      <circle cx="-4" cy="1" r="1.5" fill="#1e293b" />
      <circle cx="5" cy="1" r="1.5" fill="#1e293b" />

      <!-- Focused mouth (slight determined line) -->
      <path d="M -1 8 C 1 8, 2 9, 3 9" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

      <!-- Glasses (smart student look) -->
      <rect x="-8" y="-3" width="7" height="6" rx="1" fill="none" stroke="#334155" stroke-width="1.5" />
      <rect x="2" y="-3" width="7" height="6" rx="1" fill="none" stroke="#334155" stroke-width="1.5" />
      <line x1="-1" y1="0" x2="2" y2="0" stroke="#334155" stroke-width="1.5" />
    </g>

    <!-- Arms and Hands actively engaged in studying -->
    <!-- Left arm resting on desk -->
    <path d="M 100 135 C 90 145, 80 155, 75 160" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
    <circle cx="73" cy="161" r="5" fill="#fbcfe8" />

    <!-- Right arm holding pen / pointing at book -->
    <g filter="url(#softShadow)">
      <path d="M 130 140 C 135 145, 140 152, 135 158" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
      <!-- Hand holding pen -->
      <circle cx="134" cy="160" r="5" fill="#fbcfe8" />
      <!-- Pen -->
      <line x1="134" y1="160" x2="145" y2="168" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Foreground Atmospheric Highlight Overlay -->
  <circle cx="180" cy="110" r="80" fill="url(#lampGlow)" opacity="0.5" pointer-events="none" style="mix-blend-mode: screen;" />

</svg>