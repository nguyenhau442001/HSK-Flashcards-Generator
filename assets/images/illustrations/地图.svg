<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Cityscape Gradient -->
    <linearGradient id="windowNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient Lamp Glow from Top -->
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- BACKGROUND ARCHITECTURE -->
  <!-- Window Frame -->
  <path d="M140 30 H210 V130 H140 Z" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
  <rect x="144" y="34" width="62" height="92" fill="url(#windowNight)"/>
  <!-- City Skyline through window -->
  <path d="M148 126 V90 H155 V126 H160 V70 H168 V126 H175 V100 H182 V126 H190 V80 H202 V126 Z" fill="#1e293b" opacity="0.6"/>
  <!-- Window crossbars -->
  <line x1="175" y1="34" x2="175" y2="126" stroke="#334155" stroke-width="2"/>
  <line x1="144" y1="80" x2="206" y2="80" stroke="#334155" stroke-width="2"/>
  <!-- Warm light spilling from window -->
  <polygon points="144,126 206,126 220,165 130,165" fill="#38bdf8" opacity="0.04"/>

  <!-- Bookshelf / Wall Props -->
  <rect x="20" y="40" width="45" height="6" rx="2" fill="#334155"/>
  <path d="M26 28 H33 V40 H26 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M35 32 H42 V40 H35 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M44 25 H53 V40 H44 Z" fill="#10b981" opacity="0.8"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M100 0 V35" stroke="#64748b" stroke-width="2"/>
  <path d="M80 35 H120 L112 48 H88 Z" fill="#fb923c"/>
  <circle cx="100" cy="50" r="4" fill="#fef08a"/>

  <!-- FURNITURE: Wooden Desk -->
  <rect x="10" y="165" width="220" height="12" rx="3" fill="#334155"/>
  <rect x="25" y="177" width="12" height="50" fill="#1e293b"/>
  <rect x="203" y="177" width="12" height="50" fill="#1e293b"/>

  <!-- DESK PROPS -->
  <!-- Coffee Mug -->
  <rect x="200" y="138" width="16" height="22" rx="3" fill="#f8fafc"/>
  <path d="M216 144 H220 C223 144 223 152 220 152 H216" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <!-- Small Desk Plant -->
  <path d="M30 152 C30 142 40 142 40 152 Z" fill="#f43f5e"/>
  <path d="M35 142 Q32 130 25 125" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M35 142 Q40 128 48 123" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M35 142 Q36 125 35 118" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- THE MAP (Centerpiece being pointed at/shared) -->
  <g transform="translate(85, 125) rotate(-5)">
    <!-- Map Paper Base -->
    <polygon points="0,15 70,0 85,45 15,60" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <polygon points="15,60 85,45 80,55 10,70" fill="#fef9c3" opacity="0.7"/>
    <!-- Map Details (Abstract roads, mountains, rivers) -->
    <path d="M15 25 Q35 15 55 35" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M25 45 Q45 35 65 20" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2,2" fill="none"/>
    <path d="M40 10 L45 18 L35 18 Z" fill="#10b981" opacity="0.8"/>
    <!-- Location Pin Icon on Map -->
    <path d="M50 25 C47 25 45 27 45 30 C45 34 50 38 50 38 C50 38 55 34 55 30 C55 27 53 25 50 25 Z" fill="#ef4444"/>
    <circle cx="50" cy="30" r="1.5" fill="#fef08a"/>
  </g>

  <!-- CHARACTER 1: Person pointing/asking (Left) -->
  <g transform="translate(15, 95)">
    <!-- Body / Torso -->
    <path d="M30 65 Q30 50 45 45 L60 70 V90 H25 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="45" cy="32" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M31 32 C31 20 59 20 59 32 C59 28 55 24 45 24 C35 24 31 28 31 32 Z" fill="#475569"/>
    <!-- Arm reaching out to point at map -->
    <path d="M52 50 L75 58 L72 66 L48 58 Z" fill="#38bdf8"/>
    <!-- Hand / Pointing Finger -->
    <circle cx="77" cy="59" r="4" fill="#fbcfe8"/>
    <path d="M80 58 L85 57" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 2: Person holding/showing the map (Right) -->
  <g transform="translate(130, 90)">
    <!-- Body / Torso -->
    <path d="M30 60 Q30 45 45 40 L60 70 V90 H25 Z" fill="#f43f5e"/>
    <!-- Head -->
    <circle cx="45" cy="28" r="14" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M31 28 C31 16 59 16 59 28 C55 20 35 20 31 28 Z" fill="#1e293b"/>
    <!-- Arm holding map -->
    <path d="M35 52 L15 62 L18 70 L40 58 Z" fill="#f43f5e"/>
    <!-- Hand -->
    <circle cx="13" cy="63" r="3.5" fill="#ffedd5"/>
    <!-- Friendly smiling expression cues (implied clean vector style without heavy lines) -->
    <path d="M48 30 Q51 33 54 30" stroke="#9a3412" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND VIGNETTE / DEPTH -->
  <!-- Subtle bottom shadow gradient for grounding -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" opacity="0.4"/>
</svg>