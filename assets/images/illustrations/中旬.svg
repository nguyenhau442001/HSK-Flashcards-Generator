<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 40)">
    <!-- Calendar Body -->
    <rect x="20" y="10" width="120" height="150" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="10" width="120" height="30" rx="8" fill="#fb923c"/>
    
    <!-- Grid representing the middle of the month -->
    <rect x="35" y="60" width="90" height="80" rx="4" fill="#1e293b"/>
    
    <!-- Highlighted middle section (11th-20th) -->
    <rect x="35" y="85" width="90" height="30" rx="2" fill="#f59e0b" fill-opacity="0.3"/>
    
    <!-- Calendar squares -->
    <rect x="40" y="65" width="15" height="15" rx="2" fill="#475569"/>
    <rect x="60" y="65" width="15" height="15" rx="2" fill="#475569"/>
    <rect x="80" y="65" width="15" height="15" rx="2" fill="#475569"/>
    <rect x="100" y="65" width="15" height="15" rx="2" fill="#475569"/>
    
    <rect x="40" y="90" width="15" height="15" rx="2" fill="#fbbf24"/>
    <rect x="60" y="90" width="15" height="15" rx="2" fill="#fbbf24"/>
    <rect x="80" y="90" width="15" height="15" rx="2" fill="#fbbf24"/>
    <rect x="100" y="90" width="15" height="15" rx="2" fill="#fbbf24"/>
    
    <rect x="40" y="115" width="15" height="15" rx="2" fill="#475569"/>
    <rect x="60" y="115" width="15" height="15" rx="2" fill="#475569"/>
    <rect x="80" y="115" width="15" height="15" rx="2" fill="#475569"/>
    <rect x="100" y="115" width="15" height="15" rx="2" fill="#475569"/>
    
    <!-- Decorative elements -->
    <circle cx="50" cy="25" r="4" fill="#0f172a"/>
    <circle cx="110" cy="25" r="4" fill="#0f172a"/>
    
    <!-- Travel Icon/Context -->
    <path d="M140 140 L180 140 L170 170 L150 170 Z" fill="#38bdf8"/>
    <path d="M160 130 L160 140" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="160" cy="125" r="5" fill="#ec4899"/>
  </g>
  
  <!-- Ambient glow -->
  <circle cx="180" cy="60" r="30" fill="#f59e0b" fill-opacity="0.1" filter="blur(10px)"/>
</svg>