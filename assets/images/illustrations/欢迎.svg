<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="indoorGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Doorway Warm Light -->
    <linearGradient id="doorLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#indoorGlow)" />

  <!-- ENVIRONMENT: Interior Wall & Floor -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" />
  
  <!-- Wallpaper subtle stripe pattern / Deco -->
  <line x1="60" y1="20" x2="60" y2="150" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
  <line x1="120" y1="20" x2="120" y2="150" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
  <line x1="180" y1="20" x2="180" y2="150" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />

  <!-- Picture Frame on Wall -->
  <rect x="150" y="45" width="45" height="35" rx="3" fill="#334155" />
  <rect x="153" y="48" width="39" height="29" fill="#0f172a" />
  <circle cx="165" cy="58" r="5" fill="#38bdf8" />
  <path d="M153 72 L165 62 L175 69 L185 58 L192 72 Z" fill="#10b981" opacity="0.8" />

  <!-- Houseplant in Background Corner -->
  <path d="M35 140 L45 170 L25 170 Z" fill="#334155" />
  <ellipse cx="35" cy="140" rx="12" ry="5" fill="#475569" />
  <path d="M35 135 Q 25 105 15 110" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <path d="M35 135 Q 45 100 55 105" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <path d="M35 135 Q 35 90 35 95" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />

  <!-- Open Doorway & Threshold (Context: Coming into "my house") -->
  <path d="M90 35 L145 35 L145 170 L90 170 Z" fill="#090d16" />
  <!-- Door frame trim -->
  <rect x="87" y="32" width="61" height="139" fill="none" stroke="#475569" stroke-width="3" rx="2" />
  <!-- Warm welcoming light spilling from inside/outside threshold -->
  <polygon points="90,35 145,35 165,170 70,170" fill="url(#doorLight)" opacity="0.15" />
  
  <!-- Floor -->
  <rect x="0" y="170" width="240" height="70" fill="url(#floorGrad)" />
  <!-- Baseboard trim -->
  <rect x="0" y="166" width="240" height="4" fill="#334155" />

  <!-- WELCOMING HOST (Character Inside the House) -->
  <g id="host-character" filter="url(#softShadow)">
    <!-- Shadow on floor -->
    <ellipse cx="140" cy="195" rx="18" ry="6" fill="#000000" opacity="0.5" />

    <!-- Host Legs & Shoes -->
    <rect x="131" y="165" width="8" height="30" fill="#3b82f6" />
    <rect x="143" y="165" width="8" height="30" fill="#3b82f6" />
    <ellipse cx="134" cy="196" rx="6" ry="3" fill="#1e293b" />
    <ellipse cx="147" cy="196" rx="6" ry="3" fill="#1e293b" />

    <!-- Host Torso & Sweater -->
    <path d="M128 115 Q 140 110 152 115 L156 168 L124 168 Z" fill="#f59e0b" />
    <!-- Collar -->
    <path d="M135 115 Q 140 122 145 115 Z" fill="#fde68a" />

    <!-- Host Left Arm (Resting on hip / casual) -->
    <path d="M128 120 Q 116 135 124 150" fill="none" stroke="#d97706" stroke-width="9" stroke-linecap="round" />
    <circle cx="124" cy="150" r="4" fill="#fbbf24" />

    <!-- Host Right Arm (Raised in Welcome / Waving gesture) -->
    <path d="M152 118 Q 166 110 162 130" fill="none" stroke="#d97706" stroke-width="9" stroke-linecap="round" />
    <circle cx="162" cy="130" r="4.5" fill="#fbbf24" />

    <!-- Host Head & Hair -->
    <circle cx="140" cy="95" r="16" fill="#fbbf24" />
    <!-- Hair -->
    <path d="M124 95 Q 128 78 140 78 Q 154 78 156 95 Q 148 83 140 83 Q 132 83 124 95 Z" fill="#78350f" />

    <!-- Host Face Expressions (Smiling, friendly eyes) -->
    <circle cx="135" cy="94" r="1.5" fill="#1e293b" />
    <circle cx="145" cy="94" r="1.5" fill="#1e293b" />
    <path d="M136 100 Q 140 104 144 100" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="132" cy="97" r="2.5" fill="#f43f5e" opacity="0.4" />
    <circle cx="148" cy="97" r="2.5" fill="#f43f5e" opacity="0.4" />
  </g>


  <!-- VISITING GUEST (Character Arriving at the Door) -->
  <g id="guest-character" filter="url(#softShadow)">
    <!-- Shadow on floor -->
    <ellipse cx="85" cy="197" rx="16" ry="5" fill="#000000" opacity="0.5" />

    <!-- Guest Legs & Shoes -->
    <rect x="77" y="168" width="7" height="28" fill="#10b981" />
    <rect x="88" y="168" width="7" height="28" fill="#10b981" />
    <ellipse cx="80" cy="197" rx="5" ry="3" fill="#065f46" />
    <ellipse cx="92" cy="197" rx="5" ry="3" fill="#065f46" />

    <!-- Guest Torso & Jacket -->
    <path d="M74 118 Q 85 113 96 118 L100 170 L70 170 Z" fill="#38bdf8" />
    <!-- Zipper line -->
    <line x1="85" y1="118" x2="85" y2="170" stroke="#0ea5e9" stroke-width="2" />

    <!-- Guest Arms (Carrying a small gift/bag for the host) -->
    <!-- Back Arm -->
    <path d="M74 122 Q 65 135 72 145" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <!-- Front Arm holding gift box -->
    <path d="M96 122 Q 106 135 98 148" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    
    <!-- Small Gift Box / Souvenir Prop -->
    <rect x="91" y="142" width="14" height="14" rx="2" fill="#ec4899" />
    <line x1="98" y1="142" x2="98" y2="156" stroke="#fbcfe8" stroke-width="2" />
    <line x1="91" y1="149" x2="105" y2="149" stroke="#fbcfe8" stroke-width="2" />
    <path d="M98 142 Q 95 137 92 140" fill="none" stroke="#fbcfe8" stroke-width="2" />
    <path d="M98 142 Q 101 137 104 140" fill="none" stroke="#fbcfe8" stroke-width="2" />

    <!-- Guest Head & Hair -->
    <circle cx="85" cy="98" r="15" fill="#fde047" />
    <!-- Cap/Hair styling -->
    <path d="M70 98 Q 72 82 85 82 Q 98 82 100 98 Q 92 88 85 88 Q 78 88 70 98 Z" fill="#b45309" />
    <path d="M92 90 L104 86" stroke="#b45309" stroke-width="3" stroke-linecap="round" /> <!-- Cap brim -->

    <!-- Guest Face (Happy, arriving expression) -->
    <circle cx="81" cy="98" r="1.5" fill="#1e293b" />
    <circle cx="89" cy="98" r="1.5" fill="#1e293b" />
    <!-- Big happy open smile -->
    <path d="M82 103 Q 85 107 88 103" fill="#1e293b" />
    <!-- Rosy Cheeks -->
    <circle cx="78" cy="101" r="2" fill="#f43f5e" opacity="0.4" />
    <circle cx="92" cy="101" r="2" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- Foreground Interior Props (Context richness) -->
  <!-- Cozy Welcome Mat -->
  <ellipse cx="85" cy="203" rx="22" ry="7" fill="#334155" />
  <ellipse cx="85" cy="202" rx="18" ry="5" fill="#475569" />
  <path d="M75 202 Q 85 199 95 202" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Small side table inside the room -->
  <rect x="180" y="140" width="35" height="30" fill="#334155" rx="2" />
  <rect x="183" y="143" width="29" height="4" fill="#475569" />
  <!-- Table legs -->
  <line x1="186" y1="170" x2="183" y2="195" stroke="#1e293b" stroke-width="3" />
  <line x1="211" y1="170" x2="214" y2="195" stroke="#1e293b" stroke-width="3" />
  <!-- Teapot prop on table -->
  <circle cx="195" cy="132" r="7" fill="#e2e8f0" />
  <path d="M190 132 L185 128" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  <path d="M200 132 Q 204 132 202 136" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  <circle cx="195" cy="123" r="2" fill="#38bdf8" />

  <!-- Warm ambient light sparkles to emphasize the welcoming feeling -->
  <circle cx="115" cy="70" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="125" cy="55" r="1" fill="#fbbf24" opacity="0.6" />
  <circle cx="105" cy="85" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="155" cy="100" r="1.5" fill="#fbbf24" opacity="0.9" />
</svg>