<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Amber for Clock/Time concept -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Room Interior Background Elements -->
  <g opacity="0.4">
    <!-- Window with night city view -->
    <rect x="25" y="35" width="60" height="85" rx="4" fill="#334155" />
    <rect x="30" y="40" width="23" height="75" rx="2" fill="#475569" />
    <rect x="57" y="40" width="23" height="75" rx="2" fill="#475569" />
    <!-- City lights through window -->
    <rect x="34" y="55" width="6" height="10" fill="#fbbf24" opacity="0.6" />
    <rect x="44" y="70" width="5" height="15" fill="#38bdf8" opacity="0.5" />
    <rect x="61" y="50" width="6" height="20" fill="#fbbf24" opacity="0.8" />
    <rect x="70" y="85" width="7" height="12" fill="#f43f5e" opacity="0.6" />

    <!-- Bookshelf in background -->
    <rect x="155" y="45" width="55" height="110" rx="2" fill="#334155" />
    <line x1="155" y1="80" x2="210" y2="80" stroke="#1e293b" stroke-width="3" />
    <line x1="155" y1="115" x2="210" y2="115" stroke="#1e293b" stroke-width="3" />
    <line x1="155" y1="145" x2="210" y2="145" stroke="#1e293b" stroke-width="3" />
    <!-- Book props -->
    <rect x="162" y="60" width="8" height="20" fill="#f43f5e" rx="1" />
    <rect x="172" y="58" width="12" height="22" fill="#38bdf8" rx="1" />
    <rect x="187" y="63" width="6" height="17" fill="#fbbf24" rx="1" />
    <rect x="162" y="95" width="15" height="20" fill="#10b981" rx="1" />
    <rect x="180" y="90" width="10" height="25" fill="#a855f7" rx="1" />
  </g>

  <!-- Wooden Floor -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#0f172a" />
  <path d="M 0 190 L 240 190 L 240 210 L 0 210 Z" fill="#1e293b" opacity="0.8" />

  <!-- MAIN SCENE: The "Flashback / Memory" Moment (当时的 Scene) -->
  <g filter="url(#dropShadow)">
    
    <!-- Desk / Table Surface -->
    <rect x="35" y="150" width="170" height="45" rx="6" fill="#334155" />
    <rect x="30" y="145" width="180" height="10" rx="3" fill="#475569" />
    <!-- Desk legs -->
    <rect x="45" y="195" width="12" height="30" fill="#1e293b" />
    <rect x="183" y="195" width="12" height="30" fill="#1e293b" />

    <!-- Open Photo Album / Memory Book in the Center -->
    <g transform="translate(70, 115)">
      <!-- Book Shadow -->
      <path d="M 10 50 Q 50 70 90 50 L 90 85 Q 50 105 10 85 Z" fill="#0f172a" opacity="0.6" />
      
      <!-- Left Page -->
      <path d="M 10 20 Q 50 10 50 70 Q 50 75 10 75 Z" fill="#f8fafc" />
      <!-- Right Page -->
      <path d="M 90 20 Q 50 10 50 70 Q 50 75 90 75 Z" fill="#f1f5f9" />
      
      <!-- Bookmark ribbon hanging out -->
      <path d="M 50 70 L 52 95 L 48 95 Z" fill="#ef4444" />

      <!-- Photo attached to left page -->
      <rect x="18" y="25" width="24" height="30" fill="#cbd5e1" rx="2" />
      <circle cx="30" cy="35" r="5" fill="#38bdf8" />
      <path d="M 22 50 Q 30 42 38 50 Z" fill="#10b981" />

      <!-- Action element: Glowing "Flashback" / "Moment in time" energy swirling from the book -->
      <circle cx="50" cy="40" r="35" fill="url(#amberGlow)" />

      <!-- Floating Time/Memory Sparkles -->
      <path d="M 45 10 L 47 15 L 52 17 L 47 19 L 45 24 L 43 19 L 38 17 L 43 15 Z" fill="#fbbf24" transform="scale(0.6) translate(20, -25)" />
      <path d="M 45 10 L 47 15 L 52 17 L 47 19 L 45 24 L 43 19 L 38 17 L 43 15 Z" fill="#38bdf8" transform="scale(0.4) translate(90, 40)" />
      <path d="M 45 10 L 47 15 L 52 17 L 47 19 L 45 24 L 43 19 L 38 17 L 43 15 Z" fill="#f43f5e" transform="scale(0.5) translate(-10, 60)" />
    </g>

    <!-- Vintage Alarm Clock (Representing "Time/Moment") -->
    <g transform="translate(155, 110)">
      <!-- Clock legs -->
      <rect x="6" y="32" width="4" height="8" rx="1" fill="#cbd5e1" />
      <rect x="22" y="32" width="4" height="8" rx="1" fill="#cbd5e1" />
      <!-- Clock Body -->
      <circle cx="16" cy="20" r="16" fill="#64748b" />
      <circle cx="16" cy="20" r="13" fill="#f8fafc" />
      <!-- Clock Bells on top -->
      <path d="M 8 7 L 13 3 L 19 7 Z" fill="#94a3b8" />
      <circle cx="16" cy="3" r="3" fill="#cbd5e1" />
      <!-- Clock hands frozen at a specific moment -->
      <line x1="16" y1="20" x2="22" y2="15" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <line x1="16" y1="20" x2="13" y2="11" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="16" cy="20" r="1.5" fill="#1e293b" />
    </g>

    <!-- Coffee Mug (Adding cozy daily-life context) -->
    <g transform="translate(45, 125)">
      <!-- Mug Body -->
      <rect x="0" y="5" width="16" height="20" rx="3" fill="#38bdf8" />
      <!-- Mug Handle -->
      <path d="M 16 9 C 22 9, 22 21, 16 21" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Steam lines showing warmth/moment -->
      <path d="M 5 0 Q 7 -3 5 -6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
      <path d="M 11 -1 Q 13 -4 11 -7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
    </g>

    <!-- Character / Observer leaning in ("Looking back at that moment") -->
    <g transform="translate(100, 75)">
      <!-- Head / Hair -->
      <circle cx="20" cy="20" r="15" fill="#fbcfe8" /> <!-- Skin tone -->
      <!-- Hair back/base -->
      <path d="M 5 20 C 5 8, 12 5, 20 5 C 28 5, 35 8, 35 20 C 35 23, 34 26, 32 28 L 32 20 C 32 12, 27 9, 20 9 C 13 9, 8 12, 8 20 Z" fill="#0f172a" />
      <!-- Hair bangs -->
      <path d="M 8 18 C 12 24, 18 22, 23 20 C 28 22, 32 18, 32 18 C 32 18, 25 10, 20 10 C 15 10, 8 18, 8 18 Z" fill="#0f172a" />
      
      <!-- Thoughtful expression / eyes closed remembering -->
      <path d="M 14 20 Q 17 22 20 20" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M 23 20 Q 26 22 29 20" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Gentle smile -->
      <path d="M 19 25 Q 21 27 23 25" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <!-- Body / Hoodie -->
      <path d="M 5 50 C 5 35, 12 32, 20 32 C 28 32, 35 35, 35 50 Z" fill="#10b981" />
      <!-- Hoodie strings -->
      <line x1="16" y1="35" x2="16" y2="44" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
      <line x1="24" y1="35" x2="24" y2="44" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />

      <!-- Hand resting on chin/cheek in contemplation -->
      <circle cx="27" cy="27" r="4" fill="#fbcfe8" />
    </g>

  </g>

</svg>