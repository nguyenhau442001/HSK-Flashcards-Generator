<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Ambient background glow representing 'past moment/time' -->
  <circle cx="100" cy="100" r="60" fill="#334155" opacity="0.4"/>

  <!-- Floating time-shift glowing particles/stars -->
  <circle cx="50" cy="60" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="150" cy="50" r="1.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="145" cy="130" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="55" cy="140" r="2" fill="#10b981" opacity="0.7"/>

  <!-- Hourglass / Time representation -->
  <!-- Top glass bulb -->
  <path d="M 70 55 Q 100 55 100 85 Q 100 55 130 55 Z" fill="#334155" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Bottom glass bulb -->
  <path d="M 70 145 Q 100 145 100 115 Q 100 145 130 145 Z" fill="#334155" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Sand in bottom bulb (representing 'then' / 'moment') -->
  <path d="M 77 135 C 90 120 110 120 123 135 Q 100 145 77 135 Z" fill="#f59e0b"/>

  <!-- Falling sand stream -->
  <line x1="100" y1="92" x2="100" y2="108" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Sand in top bulb -->
  <path d="M 78 68 Q 100 68 122 68 C 115 85 85 85 78 68 Z" fill="#f59e0b"/>

  <!-- Frame/Stand for the hourglass -->
  <!-- Top wooden bar -->
  <rect x="62" y="47" width="76" height="8" rx="4" fill="#fb923c"/>
  <!-- Bottom wooden bar -->
  <rect x="62" y="145" width="76" height="8" rx="4" fill="#fb923c"/>
  <!-- Left support pillar -->
  <rect x="68" y="55" width="4" height="90" rx="2" fill="#cbd5e1" opacity="0.4"/>
  <!-- Right support pillar -->
  <rect x="128" y="55" width="4" height="90" rx="2" fill="#cbd5e1" opacity="0.4"/>

  <!-- Flashback / Memory frame accent (Polaroid-style snapshot silhouette floating left to show a specific past moment) -->
  <g transform="translate(14, 75) rotate(-12)">
    <rect x="0" y="0" width="34" height="42" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect x="4" y="4" width="26" height="26" rx="2" fill="#38bdf8" opacity="0.3"/>
    <!-- Tiny landscape inside photo -->
    <circle cx="10" cy="12" r="3" fill="#f59e0b"/>
    <path d="M 4 24 L 12 16 L 18 22 L 26 14 L 30 24 Z" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Focus / Spotlight ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5"/>
</svg>