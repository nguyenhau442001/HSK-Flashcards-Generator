<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Kitchen Light Gradient -->
    <radialGradient id="lamp-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Peach Gradient -->
    <linearGradient id="peach-grad" x1="30%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Character Skin -->
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Table Wood -->
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting from above -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- Window / Kitchen Interior Context (Background Elements) -->
  <g opacity="0.4">
    <!-- Kitchen Shelf -->
    <rect x="30" y="50" width="80" height="6" rx="3" fill="#475569" />
    <!-- Jar on shelf -->
    <rect x="45" y="26" width="20" height="24" rx="4" fill="#38bdf8" opacity="0.3" />
    <path d="M50 26 h10 v-3 h-10 z" fill="#64748b" />
    <!-- Plant on shelf -->
    <circle cx="85" cy="40" r="10" fill="#10b981" opacity="0.4" />
    <path d="M75 50 c5 -15 15 -15 20 0 Z" fill="#334155" />
  </g>

  <!-- Hanging Pendant Lamp -->
  <path d="M120 0 v25" stroke="#64748b" stroke-width="2" />
  <path d="M100 25 h40 l-10 15 h-20 z" fill="#fbbf24" opacity="0.8" />
  
  <!-- Character: Upper Body & Head -->
  <!-- Chair Back -->
  <rect x="150" y="110" width="22" height="70" rx="6" fill="#334155" />

  <!-- Torso & Clothes (Teal Hoodie) -->
  <path d="M125 150 c-15 10 -25 25 -30 50 h65 c-5 -25 -15 -40 -30 -50 z" fill="#0ea5e9" />
  <path d="M110 150 l15 20 l15 -20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="113" y="125" width="14" height="28" rx="7" fill="url(#skin-grad)" />

  <!-- Head -->
  <circle cx="120" cy="105" r="24" fill="url(#skin-grad)" />

  <!-- Hair (Stylish Dark Bob) -->
  <path d="M98 100 c0 -18 15 -28 24 -28 c15 0 24 10 24 28 v12 c0 4 -2 6 -6 4 c-6 -3 -12 -5 -18 -5 c-6 0 -12 2 -18 5 c-4 2 -6 0 -6 -4 z" fill="#1e1811" />
  <path d="M96 102 c2 12 8 22 14 26" fill="none" stroke="#1e1811" stroke-width="5" stroke-linecap="round" />

  <!-- Happy Facial Expression (Eyes closed in delight, smiling mouth) -->
  <path d="M110 102 q4 -4 8 0" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <path d="M124 102 q4 -4 8 0" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <!-- Blushing Cheeks -->
  <circle cx="109" cy="110" r="4" fill="#f43f5e" opacity="0.4" />
  <circle cx="133" cy="110" r="4" fill="#f43f5e" opacity="0.4" />
  <path d="M116 114 q4 4 8 0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Arms & Hands holding a Peach -->
  <!-- Back Arm -->
  <path d="M100 155 c-10 5 -15 15 -10 25" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" />

  <!-- Front Arm reaching forward to the table -->
  <path d="M135 155 c15 5 25 15 20 25" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" />
  <!-- Hand -->
  <circle cx="155" cy="180" r="7" fill="url(#skin-grad)" />

  <!-- Wooden Table Surface -->
  <path d="M20 190 h200 v8 a12 12 0 0 1 -12 12 h-176 a12 12 0 0 1 -12 -12 z" fill="#475569" />
  <rect x="20" y="198" width="200" height="22" fill="url(#wood-grad)" />

  <!-- Table Details (Ceramic Plate) -->
  <ellipse cx="110" cy="198" rx="45" ry="10" fill="#f8fafc" />
  <ellipse cx="110" cy="196" rx="38" ry="7" fill="#e2e8f0" />

  <!-- Multiple Peaches on Plate & Hand -->
  <!-- Peach 1 (In front/hand area) -->
  <g transform="translate(145, 168) scale(0.9)">
    <path d="M15 5 c-10 -12 -25 -5 -20 10 c5 15 20 15 20 25 c0 -10 15 -10 20 -25 c5 -15 -10 -22 -20 -10 z" fill="url(#peach-grad)" />
    <!-- Stem & Leaf -->
    <path d="M15 5 q5 -6 10 -4" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <path d="M22 2 c6 -4 10 2 6 7 c-4 2 -8 1 -6 -7 z" fill="#10b981" />
  </g>

  <!-- Peach 2 (On the plate - Whole) -->
  <g transform="translate(95, 180) scale(0.8)">
    <path d="M15 5 c-10 -12 -25 -5 -20 10 c5 15 20 15 20 25 c0 -10 15 -10 20 -25 c5 -15 -10 -22 -20 -10 z" fill="url(#peach-grad)" />
    <!-- Stem & Leaf -->
    <path d="M15 5 q5 -6 10 -4" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <path d="M20 3 c5 -5 9 1 5 6 c-3 2 -6 1 -5 -6 z" fill="#10b981" />
  </g>

  <!-- Peach 3 (Sliced half showing juicy interior & pit) -->
  <g transform="translate(120, 183) scale(0.75)">
    <!-- Outer skin arc -->
    <path d="M-10 15 a20 20 0 0 0 40 0 z" fill="url(#peach-grad)" />
    <!-- Inner yellow flesh -->
    <ellipse cx="10" cy="15" rx="17" ry="12" fill="#fef08a" />
    <!-- Peach pit (Stone) -->
    <path d="M7 10 c4 0 7 3 5 7 c-2 3 -5 5 -7 3 c-3 -2 -4 -6 -1 -8 c1 -1 2 -2 3 -2 z" fill="#b45309" />
  </g>

  <!-- Sparkles / Joy indicators -->
  <path d="M80 135 l4 -4 m0 4 l-4 -4" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <path d="M165 140 l5 -5 m0 5 l-5 -5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <circle cx="155" cy="130" r="2" fill="#f43f5e" />
  <circle cx="85" cy="155" r="1.5" fill="#38bdf8" />

  <!-- Foreground Atmospheric Bubble (depth) -->
  <circle cx="35" cy="100" r="3" fill="#38bdf8" opacity="0.2" />
  <circle cx="205" cy="80" r="5" fill="#fbbf24" opacity="0.15" />
</svg>