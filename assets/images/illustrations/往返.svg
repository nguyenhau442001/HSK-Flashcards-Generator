<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ticket Gradient (Golden/Amber) -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Counter Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window/Travel Glow -->
    <linearGradient id="travelGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment (Station / Airport Wall & Travel Poster) -->
  <g id="environment">
    <!-- Travel Poster on Wall -->
    <rect x="140" y="25" width="70" height="50" rx="4" fill="#334155" />
    <circle cx="175" cy="42" r="10" fill="#38bdf8" opacity="0.6" />
    <path d="M 150 60 Q 175 45 200 60 L 200 70 L 150 70 Z" fill="#10b981" opacity="0.8" />

    <!-- Station Info Board / Glow -->
    <rect x="30" y="20" width="80" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle cx="45" cy="37" r="5" fill="#10b981" />
    <rect x="58" y="33" width="40" height="8" rx="2" fill="#38bdf8" opacity="0.8" />

    <!-- Ambient light rays -->
    <path d="M 0 0 L 100 240 L 0 240 Z" fill="url(#travelGlow)" />
  </g>

  <!-- Ticket Counter Structure -->
  <g id="counter">
    <!-- Glass Partition / Divider -->
    <rect x="110" y="90" width="12" height="110" rx="3" fill="#64748b" opacity="0.5" />
    <path d="M 116 90 L 116 200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

    <!-- Main Counter Surface -->
    <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#counterGrad)" filter="url(#shadow)" />
    <!-- Counter Top Highlight -->
    <rect x="0" y="160" width="240" height="4" fill="#475569" />
  </g>

  <!-- Ticket Agent (Left Side, Behind Counter) -->
  <g id="agent" transform="translate(15, 75)">
    <!-- Body / Uniform -->
    <path d="M 25 70 C 25 55 45 55 55 70 L 70 95 L 10 95 Z" fill="#3b82f6" />
    <!-- Neck & Head -->
    <rect x="35" y="38" width="12" height="20" rx="4" fill="#fcd34d" />
    <circle cx="41" cy="32" r="15" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 26 32 C 26 18 56 18 56 32 C 50 25 32 25 26 32 Z" fill="#475569" />
    <!-- Friendly Smile -->
    <path d="M 38 36 Q 41 40 44 36" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Main Customer / Traveler (Right Side, Holding the Ticket) -->
  <g id="customer" transform="translate(125, 65)">
    <!-- Torso / Jacket -->
    <path d="M 25 75 C 25 55 65 55 75 75 L 90 110 L 10 110 Z" fill="#ec4899" filter="url(#shadow)" />
    <!-- Collar / Scarf -->
    <path d="M 35 70 L 50 85 L 65 70 Z" fill="#f43f5e" />

    <!-- Neck & Head -->
    <circle cx="50" cy="32" r="16" fill="#fcd34d" />
    <!-- Hair (Stylish Bob) -->
    <path d="M 33 30 C 32 15 68 15 67 30 C 67 40 60 45 58 40 C 50 45 42 45 35 40 C 33 45 33 40 33 30 Z" fill="#1e293b" />
    <!-- Face Expression (Happy, Accomplished) -->
    <circle cx="44" cy="31" r="1.5" fill="#1e293b" />
    <circle cx="56" cy="31" r="1.5" fill="#1e293b" />
    <path d="M 47 37 Q 50 41 53 37" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="42" cy="35" r="2" fill="#fb7185" opacity="0.5" />
    <circle cx="58" cy="35" r="2" fill="#fb7185" opacity="0.5" />

    <!-- Arms & Hands Presenting/Holding Ticket -->
    <!-- Back Arm -->
    <path d="M 30 80 Q 20 95 35 105" stroke="#ec4899" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Front Arm reaching forward to the counter -->
    <path d="M 65 80 Q 80 95 65 105" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="62" cy="106" r="6" fill="#fcd34d" />
  </g>

  <!-- The "Round Trip" Ticket (Central Focus of '往返') -->
  <!-- Represents going there and coming back with dual directional arrows stylized graphically -->
  <g id="roundTripTicket" transform="translate(95, 130)" filter="url(#shadow)">
    <!-- Ticket Body -->
    <rect x="0" y="0" width="60" height="34" rx="6" fill="url(#ticketGrad)" />
    <!-- Perforated Ticket Edge Cuts -->
    <circle cx="0" cy="17" r="4" fill="#0f172a" />
    <circle cx="60" cy="17" r="4" fill="#0f172a" />
    
    <!-- Ticket Details (Abstract Graphics representing travel/arrows) -->
    <!-- Dashed path for round trip journey -->
    <path d="M 12 12 Q 30 4 48 12" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 2" fill="none" />
    <path d="M 48 22 Q 30 30 12 22" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 2" fill="none" />
    
    <!-- Directional Arrow Heads -->
    <polygon points="45,10 52,12 47,15" fill="#ffffff" />
    <polygon points="15,24 8,22 13,19" fill="#ffffff" />

    <!-- Cute mini airplane icon in the center -->
    <path d="M 27 17 L 33 15 L 30 19 Z" fill="#ffffff" />
  </g>

  <!-- Foreground Props on Counter (Passport, Luggage tag) -->
  <g id="counterProps" transform="translate(30, 165)">
    <!-- Small Passport / Document -->
    <rect x="0" y="0" width="22" height="15" rx="2" fill="#3b82f6" transform="rotate(-10 11 7.5)" />
    <rect x="4" y="4" width="10" height="3" rx="1" fill="#fbbf24" transform="rotate(-10 11 7.5)" />

    <!-- Travel Bag / Backpack resting on counter edge -->
    <path d="M 190 5 L 210 5 C 213 5 215 7 215 10 L 215 30 C 215 33 213 35 210 35 L 190 35 C 187 35 185 33 185 30 L 185 10 C 185 7 187 5 190 5 Z" fill="#10b981" />
    <path d="M 195 5 L 195 2 C 195 1 196 0 198 0 L 202 0 C 204 0 205 1 205 2 L 205 5" stroke="#059669" stroke-width="3" fill="none" />
    <rect x="193" y="12" width="14" height="10" rx="2" fill="#047857" />
  </g>

</svg>