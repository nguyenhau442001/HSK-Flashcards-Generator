<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Road and Distance Marker -->
  <path d="M0 180 L240 180" stroke="#475569" stroke-width="40" stroke-dasharray="20 20"/>
  <path d="M0 200 L240 200" fill="#334155"/>
  
  <!-- Car -->
  <g transform="translate(140, 155)">
    <path d="M5 10 L45 10 L40 25 L10 25 Z" fill="#fb923c"/>
    <path d="M12 2 L38 2 L35 10 L15 10 Z" fill="#38bdf8"/>
    <circle cx="12" cy="25" r="6" fill="#0f172a" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="38" cy="25" r="6" fill="#0f172a" stroke="#f8fafc" stroke-width="2"/>
  </g>
  
  <!-- Signpost -->
  <rect x="40" y="80" width="4" height="100" fill="#94a3b8"/>
  <rect x="20" y="60" width="44" height="25" rx="4" fill="#f59e0b"/>
  <circle cx="42" cy="72" r="8" fill="#0f172a"/>
  <path d="M36 72 L48 72 M42 66 L42 78" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Airport Icon (Simplified) -->
  <path d="M180 60 L210 60 L195 90 Z" fill="#10b981"/>
  <rect x="192" y="90" width="6" height="20" fill="#10b981"/>
  
  <!-- Character looking at phone -->
  <g transform="translate(80, 130)">
    <circle cx="15" cy="15" r="15" fill="#fbbf24"/>
    <path d="M5 30 L10 60 M25 30 L20 60" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <rect x="25" y="10" width="15" height="25" rx="2" fill="#334155" stroke="#f8fafc" stroke-width="1"/>
    <line x1="28" y1="15" x2="37" y2="15" stroke="#38bdf8" stroke-width="2"/>
    <line x1="28" y1="20" x2="37" y2="20" stroke="#38bdf8" stroke-width="2"/>
    <line x1="28" y1="25" x2="37" y2="25" stroke="#38bdf8" stroke-width="2"/>
  </g>
  
  <!-- Distance lines -->
  <path d="M64 72 L180 72" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M64 68 L64 76 M180 68 L180 76" stroke="#ec4899" stroke-width="2"/>
</svg>