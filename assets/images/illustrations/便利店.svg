<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Apartment Building Exterior -->
  <rect x="20" y="40" width="60" height="200" fill="#334155" rx="4"/>
  <rect x="30" y="60" width="40" height="20" fill="#1e293b" rx="2"/>
  <rect x="30" y="90" width="40" height="20" fill="#1e293b" rx="2"/>
  <rect x="30" y="120" width="40" height="20" fill="#1e293b" rx="2"/>
  
  <!-- Convenience Store Front -->
  <rect x="100" y="120" width="120" height="100" fill="#cbd5e1" rx="4"/>
  <rect x="110" y="130" width="100" height="80" fill="#f1f5f9" rx="2"/>
  
  <!-- Store Signage (Abstract glow) -->
  <rect x="110" y="105" width="100" height="10" fill="#fbbf24" rx="2"/>
  <circle cx="120" cy="110" r="3" fill="#f59e0b"/>
  <circle cx="130" cy="110" r="3" fill="#f59e0b"/>
  <circle cx="140" cy="110" r="3" fill="#f59e0b"/>
  
  <!-- Store Interior Details -->
  <rect x="115" y="140" width="20" height="60" fill="#94a3b8"/>
  <rect x="145" y="140" width="20" height="60" fill="#94a3b8"/>
  <rect x="175" y="140" width="20" height="60" fill="#94a3b8"/>
  
  <!-- Character walking towards store -->
  <g transform="translate(150, 160)">
    <circle cx="0" cy="-20" r="8" fill="#fb923c"/>
    <path d="M-10 0 L10 0 L5 30 L-5 30 Z" fill="#38bdf8"/>
    <rect x="-8" y="30" width="5" height="15" fill="#475569"/>
    <rect x="3" y="30" width="5" height="15" fill="#475569"/>
  </g>
  
  <!-- Night Atmosphere -->
  <circle cx="200" cy="30" r="15" fill="#fef3c7" opacity="0.8"/>
  <path d="M100 220 L220 220 L230 240 L90 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Street Lamp Glow -->
  <circle cx="90" cy="150" r="40" fill="#fbbf24" opacity="0.1"/>
</svg>