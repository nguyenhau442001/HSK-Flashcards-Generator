<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Subway Interior -->
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#2d3748"/>
  <!-- Back Wall -->
  <path d="M0 180 L0 80 C30 70 210 70 240 80 L240 180 Z" fill="#4a5568"/>
  <!-- Ceiling -->
  <path d="M0 80 C30 70 210 70 240 80 L240 40 C210 30 30 30 0 40 Z" fill="#6b7280"/>

  <!-- Window (on the side, implying the character is facing slightly towards it) -->
  <rect x="150" y="90" width="70" height="70" rx="8" fill="#2f3e4e"/>
  <!-- Window interior / blurred outside -->
  <rect x="155" y="95" width="60" height="60" rx="6" fill="#1a202c"/>
  <circle cx="185" cy="125" r="15" fill="#38bdf8" opacity="0.4"/>
  <rect x="160" y="100" width="10" height="40" fill="#fbbf24" opacity="0.3" transform="rotate(15 165 120)"/>
  <rect x="190" y="110" width="8" height="30" fill="#10b981" opacity="0.3" transform="rotate(-10 194 125)"/>

  <!-- Handrail -->
  <rect x="80" y="40" width="5" height="120" rx="2.5" fill="#cbd5e0"/>
  <circle cx="82.5" cy="160" r="4" fill="#cbd5e0"/>
  <circle cx="82.5" cy="40" r="4" fill="#cbd5e0"/>

  <!-- Seats (minimalist, in the background) -->
  <rect x="10" y="160" width="40" height="15" rx="4" fill="#5a67d8"/>
  <rect x="10" y="150" width="40" height="10" rx="2" fill="#434190"/>

  <!-- Character -->
  <!-- Body -->
  <rect x="70" y="100" width="25" height="60" rx="8" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="82.5" cy="90" r="15" fill="#fbd38d"/>
  <!-- Hair -->
  <path d="M70 80 C65 70 90 70 95 80 L95 90 C90 100 75 100 70 90 Z" fill="#4a5568"/>
  <!-- Face details (minimalist) -->
  <circle cx="78" cy="88" r="1.5" fill="#1a202c"/>
  <circle cx="87" cy="88" r="1.5" fill="#1a202c"/>
  <path d="M80 93 Q82.5 95 85 93" stroke="#1a202c" stroke-width="1.5" fill="none"/>

  <!-- Arm holding handrail -->
  <rect x="85" y="105" width="10" height="40" rx="5" fill="#fbd38d" transform="rotate(-15 85 105)"/>
  <rect x="77" y="100" width="10" height="40" rx="5" fill="#fbd38d" transform="rotate(15 77 100)"/>
  <!-- Hand on handrail -->
  <circle cx="82.5" cy="155" r="7" fill="#fbd38d"/>
  <rect x="79" y="150" width="7" height="10" fill="#cbd5e0"/> <!-- Handrail part covered by hand -->

  <!-- Legs -->
  <rect x="73" y="160" width="10" height="25" rx="5" fill="#4a5568"/>
  <rect x="85" y="160" width="10" height="25" rx="5" fill="#4a5568"/>
  <!-- Feet -->
  <rect x="70" y="185" width="15" height="8" rx="4" fill="#1a202c"/>
  <rect x="82" y="185" width="15" height="8" rx="4" fill="#1a202c"/>

  <!-- Briefcase/Work Bag -->
  <rect x="50" y="140" width="20" height="25" rx="5" fill="#fbbf24"/>
  <rect x="55" y="142" width="10" height="3" rx="1" fill="#f59e0b"/>
  <rect x="55" y="147" width="10" height="15" rx="2" fill="#f59e0b"/>
</svg>