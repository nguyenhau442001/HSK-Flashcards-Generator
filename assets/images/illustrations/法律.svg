<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Scale Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Wood Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Hammer Gradient -->
    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Glow -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />
  <circle cx="120" cy="90" r="40" fill="#fbbf24" opacity="0.08" filter="url(#glow)" />

  <!-- Background Environment: Law Library Shelves & Pillars -->
  <g opacity="0.4">
    <!-- Pillar Left -->
    <rect x="15" y="20" width="16" height="150" fill="#334155" />
    <rect x="12" y="20" width="22" height="8" fill="#475569" />
    <rect x="12" y="162" width="22" height="8" fill="#475569" />
    
    <!-- Pillar Right -->
    <rect x="209" y="20" width="16" height="150" fill="#334155" />
    <rect x="206" y="20" width="22" height="8" fill="#475569" />
    <rect x="206" y="162" width="22" height="8" fill="#475569" />

    <!-- Bookshelves in Background -->
    <rect x="45" y="40" width="40" height="80" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <line x1="45" y1="65" x2="85" y2="65" stroke="#334155" stroke-width="2" />
    <line x1="45" y1="95" x2="85" y2="95" stroke="#334155" stroke-width="2" />
    <!-- Mini books -->
    <rect x="50" y="45" width="6" height="18" fill="#ef4444" rx="1" />
    <rect x="58" y="47" width="5" height="16" fill="#10b981" rx="1" />
    <rect x="65" y="44" width="7" height="19" fill="#f59e0b" rx="1" />
    <rect x="74" y="46" width="6" height="17" fill="#8b5cf6" rx="1" />

    <rect x="155" y="40" width="40" height="80" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <line x1="155" y1="65" x2="195" y2="65" stroke="#334155" stroke-width="2" />
    <line x1="155" y1="95" x2="195" y2="95" stroke="#334155" stroke-width="2" />
    <!-- Mini books -->
    <rect x="160" y="72" width="6" height="18" fill="#3b82f6" rx="1" />
    <rect x="168" y="70" width="8" height="20" fill="#ec4899" rx="1" />
    <rect x="178" y="73" width="5" height="15" fill="#10b981" rx="1" />
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 220 C 240 231 231 240 220 240 L 20 240 C 9 240 0 231 0 220 Z" fill="url(#deskGrad)" />
  <rect x="0" y="166" width="240" height="4" fill="#64748b" opacity="0.5" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="1.5" />

  <!-- PROPS: Law Book (Constitution / Code) -->
  <g transform="translate(45, 145)">
    <!-- Book Shadow -->
    <ellipse cx="45" cy="30" rx="42" ry="12" fill="#020617" opacity="0.6" />
    <!-- Open Book Base -->
    <path d="M 5 25 C 25 15, 45 22, 45 35 L 45 52 C 45 42, 25 35, 5 42 Z" fill="#cbd5e1" />
    <path d="M 85 25 C 65 15, 45 22, 45 35 L 45 52 C 45 42, 65 35, 85 42 Z" fill="#cbd5e1" />
    <!-- Book Covers -->
    <path d="M 2 28 C 22 18, 43 25, 43 38 L 43 55 C 43 45, 22 38, 2 48 Z" fill="url(#bookGrad)" />
    <path d="M 88 28 C 68 18, 47 25, 47 38 L 47 55 C 47 45, 68 38, 88 48 Z" fill="url(#bookGrad)" />
    <!-- Pages lines -->
    <line x1="15" y1="34" x2="35" y2="28" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="15" y1="38" x2="32" y2="33" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="55" y1="28" x2="75" y2="34" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="58" y1="33" x2="75" y2="38" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <!-- Bookmark Ribbon hanging down -->
    <path d="M 43 35 L 43 58 L 47 62 L 51 58 L 51 35 Z" fill="#ef4444" />
  </g>

  <!-- PROPS: Judge's Gavel (Gavel & Block) -->
  <g transform="translate(145, 140)">
    <!-- Block Shadow -->
    <ellipse cx="30" cy="35" rx="28" ry="10" fill="#020617" opacity="0.6" />
    <!-- Wooden Striking Block -->
    <path d="M 5 28 L 55 28 C 58 28, 60 32, 57 35 L 3 35 C 0 32, 2 28, 5 28 Z" fill="#78350f" />
    <rect x="10" y="23" width="40" height="6" fill="#b45309" rx="2" />
    <rect x="8" y="21" width="44" height="3" fill="#d97706" rx="1" />

    <!-- Gavel (Hammer) slanted -->
    <g transform="translate(30, 10) rotate(-25)">
      <!-- Handle -->
      <rect x="-6" y="-35" width="12" height="50" rx="3" fill="url(#woodHandle)" />
      <!-- Handle Rings -->
      <rect x="-6" y="-20" width="12" height="3" fill="#b45309" />
      <rect x="-6" y="-5" width="12" height="3" fill="#b45309" />
      <!-- Hammer Head -->
      <rect x="-26" y="-48" width="52" height="18" rx="5" fill="#78350f" stroke="#92400e" stroke-width="1.5" />
      <rect x="-24" y="-46" width="48" height="14" rx="3" fill="url(#woodHandle)" />
      <!-- Metallic gold bands on gavel head ends -->
      <rect x="-26" y="-48" width="6" height="18" rx="2" fill="url(#goldGrad)" />
      <rect x="20" y="-48" width="6" height="18" rx="2" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- MAIN SUBJECT: Scales of Justice (Balanced, Epic, Detailed) -->
  <g transform="translate(120, 95)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="72" rx="35" ry="12" fill="#020617" opacity="0.7" />

    <!-- Ornate Base / Stand -->
    <path d="M -25 65 L 25 65 C 28 65, 30 68, 28 72 L -28 72 C -30 68, -28 65, -25 65 Z" fill="url(#goldGrad)" />
    <path d="M -15 58 L 15 58 C 18 58, 20 62, 18 65 L -18 65 C -20 62, -18 58, -15 58 Z" fill="url(#goldGrad)" />
    <cylinder />
    <rect x="-5" y="-10" width="10" height="70" rx="3" fill="url(#goldGrad)" />
    <!-- Center Pillar Details / Rings -->
    <rect x="-8" y="25" width="16" height="8" rx="3" fill="url(#goldLight)" />
    <rect x="-8" y="-5" width="16" height="8" rx="3" fill="url(#goldLight)" />

    <!-- Top Ornate Finial (Ring & Globe) -->
    <circle cx="0" cy="-18" r="8" fill="url(#goldGrad)" />
    <circle cx="0" cy="-18" r="5" fill="#0f172a" />
    <circle cx="0" cy="-28" r="5" fill="url(#goldGrad)" />

    <!-- Balance Beam (Perpetually perfectly balanced) -->
    <g id="balanceBeam">
      <path d="M -55 -25 L 55 -25 C 58 -25, 60 -21, 55 -18 L -55 -18 C -60 -21, -58 -25, -55 -25 Z" fill="url(#goldGrad)" />
      <!-- Center Pivot Connection -->
      <circle cx="0" cy="-21" r="6" fill="url(#goldLight)" />
      <circle cx="0" cy="-21" r="2" fill="#0f172a" />

      <!-- Left Pan Assembly -->
      <g transform="translate(-55, -20)">
        <!-- Chains/Strings -->
        <path d="M 0 0 L -20 30 L 20 30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />
        <line x1="0" y1="0" x2="0" y2="30" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7" />
        
        <!-- Left Scale Pan -->
        <path d="M -22 30 C -22 42, 22 42, 22 30 Z" fill="url(#goldGrad)" stroke="url(#goldLight)" stroke-width="1.5" />
        
        <!-- Golden Glow / Sparks inside Left Pan -->
        <circle cx="0" cy="33" r="10" fill="#38bdf8" opacity="0.3" filter="url(#glow)" />
        <circle cx="-5" cy="32" r="3" fill="#ffffff" opacity="0.8" />
        <circle cx="6" cy="34" r="2" fill="#38bdf8" opacity="0.9" />
        <circle cx="1" cy="36" r="2.5" fill="#fbbf24" opacity="0.9" />
      </g>

      <!-- Right Pan Assembly -->
      <g transform="translate(55, -20)">
        <!-- Chains/Strings -->
        <path d="M 0 0 L -20 30 L 20 30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />
        <line x1="0" y1="0" x2="0" y2="30" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7" />
        
        <!-- Right Scale Pan -->
        <path d="M -22 30 C -22 42, 22 42, 22 30 Z" fill="url(#goldGrad)" stroke="url(#goldLight)" stroke-width="1.5" />
        
        <!-- Golden Glow / Sparks inside Right Pan -->
        <circle cx="0" cy="33" r="10" fill="#38bdf8" opacity="0.3" filter="url(#glow)" />
        <circle cx="4" cy="32" r="3.5" fill="#ffffff" opacity="0.8" />
        <circle cx="-6" cy="35" r="2" fill="#38bdf8" opacity="0.9" />
        <circle cx="2" cy="36" r="2" fill="#fbbf24" opacity="0.9" />
      </g>
    </g>
  </g>

  <!-- Dynamic Ambient Sparkles / Magic Learning Particles -->
  <g opacity="0.8">
    <circle cx="45" cy="80" r="2" fill="#38bdf8" />
    <path d="M 45 74 L 45 86 M 39 80 L 51 80" stroke="#38bdf8" stroke-width="1" opacity="0.5" />

    <circle cx="195" cy="70" r="2.5" fill="#fbbf24" />
    <path d="M 195 63 L 195 77 M 188 70 L 202 70" stroke="#fbbf24" stroke-width="1" opacity="0.6" />

    <circle cx="100" cy="35" r="1.5" fill="#38bdf8" />
    <circle cx="140" cy="45" r="2" fill="#fbbf24" />
    <circle cx="75" cy="115" r="1.5" fill="#10b981" />
    <circle cx="165" cy="120" r="2" fill="#ec4899" />
  </g>

  <!-- Foreground Vignette Framing -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>