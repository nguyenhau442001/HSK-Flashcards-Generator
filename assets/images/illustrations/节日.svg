<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Festive Glow Gradient -->
    <radialGradient id="festiveGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Dumpling Steam Filter -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Festive Ambient Light -->
  <circle cx="120" cy="100" r="110" fill="url(#festiveGlow)" />

  <!-- BACKGROUND ARCHITECTURE & WINDOW -->
  <g id="window-and-wall">
    <!-- Traditional Chinese Window Frame / Moon Gate silhouette -->
    <circle cx="120" cy="110" r="85" fill="#090d16" stroke="#334155" stroke-width="4" />
    
    <!-- Night Sky View outside window -->
    <circle cx="120" cy="110" r="83" fill="#0f172a" />
    
    <!-- Distant Firework bursts -->
    <circle cx="80" cy="70" r="1" fill="#fbbf24" opacity="0.8" />
    <path d="M75 70 L85 70 M80 65 L80 75" stroke="#fbbf24" stroke-width="0.75" opacity="0.6" />
    <circle cx="170" cy="90" r="1.5" fill="#f43f5e" opacity="0.9" />
    <path d="M164 90 L176 90 M170 84 L170 96" stroke="#f43f5e" stroke-width="0.75" opacity="0.7" />
    <circle cx="140" cy="60" r="1" fill="#38bdf8" opacity="0.8" />

    <!-- Indoor Wall Texture/Shadow -->
    <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#1e293b" opacity="0.3" />
  </g>

  <!-- HANGING TRADITIONAL LANTERNS -->
  <g id="lanterns">
    <!-- Left Lantern -->
    <line x1="60" y1="0" x2="60" y2="35" stroke="#b45309" stroke-width="1.5" />
    <circle cx="60" cy="35" r="14" fill="url(#lanternGlow)" />
    <path d="M 50 30 Q 60 22 70 30 Q 75 45 70 60 Q 60 66 50 60 Q 45 45 50 30 Z" fill="#ef4444" />
    <!-- Lantern Ribs -->
    <path d="M 60 24 Q 65 45 60 66" fill="none" stroke="#f59e0b" stroke-width="1" />
    <path d="M 50 30 Q 55 45 50 60" fill="none" stroke="#f59e0b" stroke-width="1" />
    <path d="M 70 30 Q 65 45 70 60" fill="none" stroke="#f59e0b" stroke-width="1" />
    <!-- Caps & Tassel -->
    <rect x="56" y="27" width="8" height="3" rx="1" fill="#f59e0b" />
    <rect x="56" y="59" width="8" height="3" rx="1" fill="#f59e0b" />
    <line x1="60" y1="62" x2="60" y2="72" stroke="#f59e0b" stroke-width="1" />
    <circle cx="60" cy="73" r="2" fill="#ef4444" />

    <!-- Right Lantern -->
    <line x1="180" y1="0" x2="180" y2="45" stroke="#b45309" stroke-width="1.5" />
    <circle cx="180" cy="45" r="18" fill="url(#lanternGlow)" />
    <path d="M 168 38 Q 180 28 192 38 Q 198 56 192 74 Q 180 82 168 74 Q 162 56 168 38 Z" fill="#ef4444" />
    <!-- Lantern Ribs -->
    <path d="M 180 32 Q 187 56 180 80" fill="none" stroke="#f59e0b" stroke-width="1.2" />
    <path d="M 168 38 Q 174 56 168 74" fill="none" stroke="#f59e0b" stroke-width="1.2" />
    <path d="M 192 38 Q 186 56 192 74" fill="none" stroke="#f59e0b" stroke-width="1.2" />
    <!-- Caps & Tassel -->
    <rect x="175" y="35" width="10" height="4" rx="1" fill="#f59e0b" />
    <rect x="175" y="73" width="10" height="4" rx="1" fill="#f59e0b" />
    <line x1="180" y1="77" x2="180" y2="90" stroke="#f59e0b" stroke-width="1" />
    <circle cx="180" cy="91" r="2.5" fill="#ef4444" />
  </g>

  <!-- CHARACTERS (FAMILY CELEBRATING THE FESTIVAL) -->
  <g id="characters">
    <!-- Older Person / Grandfather (Left) -->
    <g id="grandfather">
      <!-- Body / Torso (Red Festive Tangsuit) -->
      <path d="M 50 160 Q 50 130 75 130 Q 95 130 95 160 Z" fill="#b91c1c" />
      <path d="M 65 130 L 65 160 M 80 130 L 80 160" stroke="#f59e0b" stroke-width="1.5" />
      <!-- Collar -->
      <path d="M 62 130 L 73 138 L 83 130" fill="none" stroke="#f59e0b" stroke-width="2" />

      <!-- Head & Face -->
      <circle cx="73" cy="112" r="14" fill="#fde047" />
      <!-- Friendly Smiling Eyes -->
      <path d="M 67 110 Q 70 107 73 110" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 73 110 Q 76 107 79 110" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
      <!-- Warm Smile & Cheeks -->
      <circle cx="67" cy="113" r="2.5" fill="#f43f5e" opacity="0.5" />
      <circle cx="79" cy="113" r="2.5" fill="#f43f5e" opacity="0.5" />
      <path d="M 70 115 Q 73 118 76 115" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
      <!-- Grey Hair / Ears -->
      <path d="M 59 112 Q 59 100 73 100 Q 87 100 87 112" fill="#cbd5e1" />
      <circle cx="58" cy="113" r="2" fill="#fde047" />
      <circle cx="88" cy="113" r="2" fill="#fde047" />

      <!-- Arm holding bowl / offering -->
      <path d="M 70 138 Q 85 140 95 145" fill="none" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Child / Grandchild (Right, joyfully holding dumplings) -->
    <g id="child">
      <!-- Body (Bright Festive Outfit) -->
      <path d="M 145 165 Q 145 135 165 135 Q 185 135 185 165 Z" fill="#ea580c" />
      
      <!-- Head & Face -->
      <circle cx="165" cy="115" r="13" fill="#fef08a" />
      <!-- Happy Open Face / Eyes -->
      <circle cx="160" cy="113" r="1.5" fill="#78350f" />
      <circle cx="170" cy="113" r="1.5" fill="#78350f" />
      <path d="M 163 117 Q 165 120 167 117" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
      <!-- Cheeks -->
      <circle cx="157" cy="116" r="2.5" fill="#f43f5e" opacity="0.6" />
      <circle cx="173" cy="116" r="2.5" fill="#f43f5e" opacity="0.6" />
      
      <!-- Hair (Pigtails / Traditional buns) -->
      <circle cx="155" cy="106" r="5" fill="#1e293b" />
      <circle cx="175" cy="106" r="5" fill="#1e293b" />
      <path d="M 153 103 Q 165 95 177 103" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

      <!-- Arms raised excitedly -->
      <path d="M 150 140 Q 140 130 148 125" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" />
      <path d="M 180 140 Q 190 130 182 125" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Center Young Adult / Mother holding festive tray -->
    <g id="mother">
      <!-- Red Tangsuit / Top -->
      <path d="M 100 165 Q 100 130 120 130 Q 140 130 140 165 Z" fill="#dc2626" />
      <path d="M 120 130 L 120 165" stroke="#fbbf24" stroke-width="2" />
      <path d="M 112 133 L 128 133" stroke="#fbbf24" stroke-width="2" />

      <!-- Head & Face -->
      <circle cx="120" cy="105" r="15" fill="#fde047" />
      <!-- Warm Expression -->
      <path d="M 113 104 Q 115 102 117 104" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 123 104 Q 125 102 127 104" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="114" cy="107" r="2.5" fill="#f43f5e" opacity="0.5" />
      <circle cx="126" cy="107" r="2.5" fill="#f43f5e" opacity="0.5" />
      <path d="M 117 110 Q 120 113 123 110" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />

      <!-- Hair Style (Bun with hairpin) -->
      <path d="M 105 105 Q 105 90 120 90 Q 135 90 135 105 Z" fill="#0f172a" />
      <circle cx="120" cy="85" r="6" fill="#0f172a" />
      <line x1="112" y1="83" x2="128" y2="87" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

      <!-- Arms extending forward to hold tray -->
      <path d="M 108 142 Q 115 145 120 142" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />
      <path d="M 132 142 Q 125 145 120 142" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>

  <!-- FOREGROUND TABLE & BANQUET PROPS (Jiaozi / Dumplings, Tangerines, Tea) -->
  <g id="table-and-feast">
    <!-- Wooden Table Surface -->
    <path d="M 20 160 L 220 160 L 230 220 L 10 220 Z" fill="url(#woodGrad)" />
    <!-- Table Edge Highlight -->
    <path d="M 15 160 L 225 160" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M 10 165 L 230 165" stroke="#451a03" stroke-width="2" />

    <!-- Center Banquet Tray / Bamboo Steamer with Dumplings (Jiaozi) -->
    <g id="dumpling-steamer" transform="translate(120, 168)">
      <!-- Steamer Base/Rim -->
      <ellipse cx="0" cy="12" rx="35" ry="12" fill="#78350f" />
      <ellipse cx="0" cy="10" rx="34" ry="11" fill="#d97706" />
      <ellipse cx="0" cy="8" rx="32" ry="10" fill="#fef3c7" />

      <!-- Dumplings (Jiaozi - Traditional New Year Food) -->
      <!-- Dumpling 1 -->
      <path d="M -15 8 Q -10 0 -5 8 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <path d="M -15 8 Q -10 4 -5 8" fill="none" stroke="#cbd5e1" stroke-width="1" />
      
      <!-- Dumpling 2 -->
      <path d="M -5 5 Q 0 -3 5 5 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <path d="M -5 5 Q 0 1 5 5" fill="none" stroke="#cbd5e1" stroke-width="1" />

      <!-- Dumpling 3 -->
      <path d="M 3 10 Q 10 2 17 10 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

      <!-- Dumpling 4 -->
      <path d="M -22 12 Q -16 4 -10 12 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

      <!-- Dumpling 5 -->
      <path d="M 8 12 Q 15 5 22 12 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

      <!-- Steam Effect -->
      <path d="M -5 -2 Q -8 -10 -2 -18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" filter="url(#softBlur)" />
      <path d="M 5 -4 Q 8 -12 4 -20" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" filter="url(#softBlur)" />
    </g>

    <!-- Bowl of Tangerines / Oranges (Lucky symbol for prosperity) -->
    <g id="tangerine-bowl" transform="translate(55, 172)">
      <!-- Little Bowl -->
      <path d="M -15 15 Q 0 25 15 15 L 12 8 Q 0 14 -12 8 Z" fill="#38bdf8" />
      <ellipse cx="0" cy="8" rx="12" ry="4" fill="#0284c7" />
      
      <!-- Tangerines -->
      <circle cx="-5" cy="5" r="6" fill="#f97316" />
      <path d="M -5 -1 L -4 1" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" />
      
      <circle cx="5" cy="4" r="6" fill="#ea580c" />
      <path d="M 5 -2 L 6 0" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" />
      
      <circle cx="0" cy="-1" r="6.5" fill="#f97316" />
      <path d="M 0 -7.5 L 0 -5.5" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Traditional Teapot & Cup Set -->
    <g id="tea-set" transform="translate(185, 175)">
      <!-- Teapot -->
      <ellipse cx="0" cy="10" rx="14" ry="8" fill="#b91c1c" />
      <path d="M -10 5 C -20 2 -18 -5 -10 -2" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" />
      <path d="M 10 5 C 16 2 16 -4 10 -2" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="0" cy="2" r="3" fill="#fbbf24" />
      
      <!-- Small Tea Cup -->
      <path d="M 16 12 L 24 12 L 22 18 L 18 18 Z" fill="#fef3c7" />
      <ellipse cx="20" cy="12" rx="4" ry="1.5" fill="#f59e0b" />
    </g>
  </g>

  <!-- FESTIVE ATMOSPHERE PARTICLES / CONFETTI / GLOW DOTS -->
  <g id="sparkles" opacity="0.8">
    <circle cx="35" cy="100" r="1.5" fill="#fbbf24" />
    <circle cx="25" cy="130" r="1" fill="#f43f5e" />
    <circle cx="205" cy="115" r="1.5" fill="#fbbf24" />
    <circle cx="215" cy="140" r="2" fill="#38bdf8" />
    <circle cx="105" cy="75" r="1.5" fill="#f43f5e" />
    <circle cx="135" cy="65" r="1" fill="#fbbf24" />
  </g>

</svg>