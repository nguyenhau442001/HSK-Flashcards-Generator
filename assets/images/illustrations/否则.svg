<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Amber Light Gradient (Urgency/Otherwise concept) -->
    <radialGradient id="glowGrad" cx="70%" cy="30%" r="70%" fx="70%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Clock face gradient -->
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Running Shoe Gradient -->
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Train/Portal Glow -->
    <linearGradient id="trainGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#glowGrad)" />

  <!-- Atmospheric Background Elements (Train Station / Urban context) -->
  <g opacity="0.3">
    <!-- Platform pillars -->
    <rect x="20" y="40" width="12" height="160" fill="#475569" rx="4" />
    <rect x="208" y="40" width="12" height="160" fill="#475569" rx="4" />
    <!-- Overhead lights -->
    <ellipse cx="120" cy="20" rx="40" ry="8" fill="#fbbf24" opacity="0.6" />
    <polygon points="100,20 140,20 150,40 90,40" fill="#334155" />
  </g>

  <!-- Speed lines / Motion effect representing "otherwise / running out of time" -->
  <g opacity="0.4" stroke-linecap="round" stroke-width="2">
    <line x1="20" y1="180" x2="90" y2="180" stroke="#38bdf8" stroke-dasharray="8 6" />
    <line x1="10" y1="195" x2="110" y2="195" stroke="#f59e0b" stroke-dasharray="12 4" />
    <line x1="30" y1="210" x2="80" y2="210" stroke="#38bdf8" stroke-dasharray="6 6" />
  </g>

  <!-- Train / Destination Gate (The consequence if too late) -->
  <g transform="translate(150, 60)" filter="url(#shadow)">
    <!-- Gate Arch -->
    <path d="M10,80 L10,20 C10,5 25,0 40,0 C55,0 70,5 70,20 L70,80" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <!-- Departure Light / Barrier -->
    <rect x="20" y="25" width="30" height="18" rx="4" fill="#ef4444" />
    <circle cx="35" cy="34" r="5" fill="#f8fafc" />
    <!-- Departing Train/Door light -->
    <path d="M15,80 L65,80 L60,30 L20,30 Z" fill="url(#trainGlow)" opacity="0.7" />
  </g>

  <!-- Main Subject: The Urgent Action (Running Footwear & Motion) -->
  <g transform="translate(45, 110)" filter="url(#shadow)">
    <!-- Motion Trail / Dust -->
    <path d="M-20,40 C -10,35 0,42 10,38" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <circle cx="-15" cy="45" r="3" fill="#64748b" opacity="0.5" />
    <circle cx="-5" cy="48" r="2" fill="#64748b" opacity="0.4" />

    <!-- Dynamic Running Shoe (Representing the "Hurry up" action of the phrase) -->
    <g transform="rotate(-15, 40, 20)">
      <!-- Sole -->
      <path d="M0,32 C15,35 60,35 75,30 C85,26 80,18 70,18 C50,18 20,20 0,25 Z" fill="#0f172a" />
      <path d="M5,30 C20,32 55,32 70,28" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <!-- Shoe Upper Body -->
      <path d="M5,25 C10,10 30,5 50,8 C70,10 75,20 70,26 C50,25 20,27 5,25 Z" fill="url(#shoeGrad)" />
      <!-- Accents / Laces -->
      <path d="M35,10 L45,18 M42,9 L52,17" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
      <path d="M15,18 C25,14 35,14 45,16" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
      <!-- Star/Speed emblem on shoe -->
      <circle cx="55" cy="18" r="4" fill="#f59e0b" />
    </g>
  </g>

  <!-- Secondary Subject: The Pressure Clock (Time running out -> "Otherwise...") -->
  <g transform="translate(110, 30)" filter="url(#shadow)">
    <!-- Clock Outer Ring -->
    <circle cx="30" cy="30" r="28" fill="#334155" />
    <circle cx="30" cy="30" r="24" fill="url(#clockGrad)" />

    <!-- Clock Face Ticks -->
    <line x1="30" y1="8" x2="30" y2="12" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="30" y1="48" x2="30" y2="52" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="30" x2="12" y2="30" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="48" y1="30" x2="52" y2="30" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Alarm Bells on Top -->
    <path d="M18,10 L12,4 M42,10 L48,4" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <circle cx="15" cy="4" r="4" fill="#ef4444" />
    <circle cx="45" cy="4" r="4" fill="#ef4444" />

    <!-- Clock Hands (Showing urgent time - pointing sharply) -->
    <line x1="30" y1="30" x2="30" y2="16" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="30" x2="42" y2="34" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="30" cy="30" r="3" fill="#0f172a" />

    <!-- Flashing Exclamation / Warning vibe emanating from clock -->
    <path d="M60,15 L68,22" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <path d="M2,15 L-6,22" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Foreground Atmospheric Elements / Sparks of Urgency -->
  <g fill="#fbbf24">
    <circle cx="95" cy="115" r="3" opacity="0.8" />
    <circle cx="105" cy="100" r="2" opacity="0.6" />
    <circle cx="85" cy="130" r="1.5" opacity="0.9" />
    <polygon points="180,110 183,116 190,117 185,122 186,128 180,125 174,128 175,122 170,117 177,116" fill="#f59e0b" opacity="0.7" transform="scale(0.5) translate(200, 150)" />
  </g>

  <!-- Floor Surface Line with strong perspective -->
  <path d="M0,190 L240,190" stroke="#334155" stroke-width="4" />
  <path d="M0,194 L240,194" stroke="#0f172a" stroke-width="2" />
</svg>