<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Cloud Gradient (Ominous storm rolling in) -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Golden Hour / Warm Streetlight Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="rainGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    
    <!-- Umbrella Canopy Gradient -->
    <linearGradient id="umbrellaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Windowpane Clip Path for indoor/outdoor illusion -->
    <clipPath id="windowClip">
      <rect x="25" y="85" width="70" height="95" rx="8"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- OUTDOOR SCENE (Visible through the window & background) -->
  <g id="outdoor-scene">
    <!-- Distant City Skyline / Trees Silhouette -->
    <path d="M 20 160 L 35 130 L 45 130 L 60 160 L 90 160 L 90 180 L 20 180 Z" fill="#334155" opacity="0.6"/>
    
    <!-- Rolling Storm Clouds (dường như - feeling of weather shift) -->
    <path d="M 10 70 Q 25 45 55 55 Q 85 40 120 50 Q 150 40 180 55 Q 210 45 230 70 Z" fill="url(#cloudGrad)" />
    <path d="M 40 90 Q 70 65 110 75 Q 150 65 190 85 L 230 95 L 230 180 L 10 180 L 10 90 Z" fill="#1e293b" opacity="0.4"/>

    <!-- Streetlamp casting warm light -->
    <circle cx="190" cy="110" r="45" fill="url(#lampGlow)" />
    <rect x="187" y="110" width="6" height="70" fill="#475569" />
    <path d="M 180 110 L 200 110 L 195 100 L 185 100 Z" fill="#64748b" />
    <!-- Light bulb -->
    <circle cx="190" cy="113" r="3" fill="#fef08a" />

    <!-- Action Element: Falling Raindrops (Dynamic diagonals indicating "it looks like rain") -->
    <g stroke="url(#rainGrad)" stroke-width="2" stroke-linecap="round">
      <line x1="30" y1="90" x2="22" y2="115" />
      <line x1="60" y1="75" x2="52" y2="100" />
      <line x1="90" y1="100" x2="82" y2="125" />
      <line x1="120" y1="80" x2="112" y2="105" />
      <line x1="150" y1="95" x2="142" y2="120" />
      <line x1="210" y1="120" x2="202" y2="145" />
      
      <!-- More intense drops closer to foreground -->
      <line x1="45" y1="120" x2="35" y2="150" stroke-width="2.5" />
      <line x1="135" y1="130" x2="125" y2="160" stroke-width="2.5" />
      <line x1="175" y1="105" x2="165" y2="135" stroke-width="2.5" />
    </g>
  </g>

  <!-- INDOOR WINDOW FRAME & SILL (Foreground Contextual Elements) -->
  <g id="window-frame">
    <!-- Window Wall backing -->
    <rect x="15" y="75" width="90" height="110" rx="4" fill="#0f172a" />
    
    <!-- Windowpane reflection / Glass sheen -->
    <g clip-path="url(#windowClip)">
      <rect x="25" y="85" width="70" height="95" fill="#38bdf8" opacity="0.08" />
      <polygon points="25,85 55,85 25,145" fill="#ffffff" opacity="0.12" />
    </g>

    <!-- Window Frame Structure (Wooden/Slate interior border) -->
    <rect x="20" y="80" width="80" height="100" rx="6" fill="none" stroke="#334155" stroke-width="6" />
    <!-- Window cross bars -->
    <line x1="60" y1="80" x2="60" y2="180" stroke="#334155" stroke-width="4" />
    <line x1="20" y1="130" x2="100" y2="130" stroke="#334155" stroke-width="4" />

    <!-- Window Sill -->
    <rect x="10" y="176" width="100" height="10" rx="2" fill="#475569" />
    <rect x="8" y="184" width="104" height="4" rx="1" fill="#334155" />
  </g>

  <!-- PROPS ON WINDOWSILL (Enhancing the 'dường như' / observation narrative) -->
  <g id="windowsill-props">
    <!-- Potted Plant (Adds life & realism) -->
    <path d="M 75 160 L 87 160 L 84 176 L 78 176 Z" fill="#fb923c" />
    <ellipse cx="81" cy="160" rx="6" ry="2" fill="#fdba74" />
    <!-- Plant stems & leaves -->
    <path d="M 81 160 Q 75 150 70 145" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M 81 160 Q 88 145 92 140" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M 81 160 Q 82 148 81 138" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" />
    <circle cx="70" cy="144" r="4" fill="#34d399" />
    <circle cx="93" cy="139" r="5" fill="#34d399" />
    <circle cx="81" cy="137" r="4" fill="#10b981" />

    <!-- Coffee Mug (Cozy indoor observational setting) -->
    <rect x="32" y="158" width="14" height="18" rx="2" fill="#f8fafc" />
    <path d="M 46 162 C 50 162, 50 172, 46 172" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
    <!-- Steam rising (dường như - subtle ethereal curves) -->
    <path d="M 36 152 Q 39 146 36 140" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 42 154 Q 39 148 42 142" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- MAIN CHARACTER / OBSERVER (Looking out the window, realizing "It looks like rain") -->
  <g id="character">
    <!-- Character Body / Shoulders -->
    <path d="M 110 240 L 110 205 C 110 190, 130 180, 155 180 C 180 180, 200 190, 200 205 L 200 240 Z" fill="#38bdf8" />
    <path d="M 130 240 L 130 210 C 130 200, 140 190, 155 190 C 170 190, 180 200, 180 210 L 180 240 Z" fill="#0284c7" /> <!-- Shirt collar/inner -->

    <!-- Neck -->
    <rect x="145" y="165" width="20" height="20" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="155" cy="145" r="24" fill="#fbcfe8" />

    <!-- Hair (Stylish modern cut) -->
    <path d="M 133 145 C 132 125, 150 120, 165 122 C 178 124, 180 138, 178 150 C 174 140, 165 130, 150 130 C 138 130, 133 138, 133 145 Z" fill="#334155" />
    <path d="M 133 145 C 130 155, 135 162, 140 158 Z" fill="#334155" />

    <!-- Expressive Face (Peering intently / pondering "it seems...") -->
    <!-- Eyebrow raised inquisitively -->
    <path d="M 158 138 Q 165 134 172 139" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes looking toward window -->
    <circle cx="165" cy="145" r="3" fill="#1e293b" />
    <circle cx="148" cy="145" r="2.5" fill="#1e293b" opacity="0.3" /> <!-- Profile perspective shadow -->

    <!-- Thoughtful expression (slight curve of mouth) -->
    <path d="M 162 156 Q 166 159 170 155" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" />

    <!-- Hand resting on chin (Classic "hǎoxiàng" pondering pose) -->
    <circle cx="170" cy="168" r="8" fill="#fbcfe8" />
    <path d="M 175 165 C 178 175, 170 185, 160 185" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND PREPARATION (Ready for action: Umbrella leaning nearby) -->
  <g id="foreground-prep">
    <!-- Umbrella Handle & Shaft -->
    <line x1="215" y1="140" x2="200" y2="230" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="M 215 138 C 223 138, 223 148, 215 148" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    
    <!-- Closed Umbrella Canopy -->
    <path d="M 205 150 C 195 170, 198 195, 200 215 L 205 215 C 208 195, 212 170, 205 150 Z" fill="url(#umbrellaGrad)" />
    <!-- Umbrella Rib accents -->
    <line x1="205" y1="150" x2="202" y2="215" stroke="#f472b6" stroke-width="1.5" />
    <line x1="205" y1="150" x2="208" y2="215" stroke="#f472b6" stroke-width="1.5" />
  </g>

  <!-- AMBIENT ATMOSPHERE & LIGHTING HIGHLIGHTS -->
  <!-- Top inner shadow/vignette for depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15" />
</svg>