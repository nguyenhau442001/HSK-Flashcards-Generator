<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Skateboard Deck Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Hoodie Gradient -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <!-- Hair Highlight -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Room Environment / Background details -->
  <!-- Ambient window light beam -->
  <polygon points="120,0 240,0 240,240 60,240" fill="url(#windowLight)"/>
  <circle cx="190" cy="60" r="18" fill="#fef08a" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Wall Shelf -->
  <rect x="25" y="75" width="85" height="4" rx="2" fill="#334155"/>
  <!-- Plant Pot on Shelf -->
  <path d="M42,75 L48,63 L62,63 L68,75 Z" fill="#f8fafc"/>
  <path d="M55,63 Q52,50 45,45 Q55,55 55,63 Z" fill="url(#plantGrad)"/>
  <path d="M55,63 Q60,48 68,42 Q62,56 55,63 Z" fill="url(#plantGrad)"/>
  <!-- Framed Abstract Art on Wall -->
  <rect x="75" y="30" width="30" height="38" rx="3" fill="#475569"/>
  <rect x="78" y="33" width="24" height="32" rx="2" fill="#1e293b"/>
  <circle cx="90" cy="45" r="8" fill="#f43f5e" opacity="0.8"/>
  <path d="M82,55 Q90,48 98,55" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Floor Surface -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>

  <!-- Floor Props (Stickers, Stereo/Boombox) -->
  <!-- Boombox -->
  <rect x="25" y="172" width="40" height="28" rx="4" fill="#334155"/>
  <rect x="30" y="178" width="12" height="12" rx="6" fill="#1e293b"/>
  <circle cx="36" cy="184" r="3" fill="#64748b"/>
  <rect x="48" y="178" width="12" height="12" rx="6" fill="#1e293b"/>
  <circle cx="54" cy="184" r="3" fill="#64748b"/>
  <path d="M35,172 L35,167 L55,167 L55,172" stroke="#64748b" stroke-width="2" fill="none"/>
  <!-- Star sticker on floor -->
  <path d="M195,212 L198,218 L204,219 L200,223 L201,229 L195,226 L189,229 L190,223 L186,219 L192,218 Z" fill="#fbbf24" opacity="0.8"/>

  <!-- Drop Shadow for Skater -->
  <ellipse cx="120" cy="203" rx="45" ry="6" fill="#000000" opacity="0.5"/>

  <!-- MAIN SUBJECT: Youthful Skater Character in Action -->
  <g transform="translate(10, 0)">
    <!-- Skateboard -->
    <!-- Back Wheel -->
    <circle cx="95" cy="198" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Front Wheel -->
    <circle cx="165" cy="198" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Trucks -->
    <rect x="98" y="191" width="8" height="5" fill="#94a3b8"/>
    <rect x="154" y="191" width="8" height="5" fill="#94a3b8"/>
    <!-- Deck -->
    <path d="M 80 193 Q 130 183 180 193 Q 185 194 182 196 Q 130 186 78 196 Q 75 194 80 193 Z" fill="url(#boardGrad)" stroke="#fda4af" stroke-width="1.5"/>
    <!-- Motion lines under board -->
    <path d="M65,199 L75,199" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M55,202 L68,202" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Character Legs (Dynamic skating pose) -->
    <!-- Back Leg (Bent) -->
    <path d="M 105 155 Q 95 175 100 190" stroke="#10b981" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="190" r="6" fill="#f43f5e"/> <!-- Sneaker -->

    <!-- Front Leg (Balanced forward) -->
    <path d="M 130 155 Q 150 175 160 190" stroke="#10b981" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="160" cy="190" r="6" fill="#f43f5e"/> <!-- Sneaker -->

    <!-- Torso (Oversized Hoodie) -->
    <path d="M 100 110 L 135 110 L 142 158 L 98 158 Z" fill="url(#hoodieGrad)"/>
    <!-- Hoodie Pocket -->
    <path d="M 110 142 L 130 142 L 133 154 L 107 154 Z" fill="#047857"/>
    <!-- Hoodie Strings -->
    <line x1="114" y1="110" x2="114" y2="125" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="126" y1="110" x2="126" y2="125" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <!-- Neck -->
    <rect x="114" y="98" int="12" width="12" height="15" fill="#fcd34d" rx="4"/>
    
    <!-- Face Profile -->
    <circle cx="123" cy="88" r="16" fill="#fde68a"/>
    
    <!-- Playful Expression (Cheeky smile, closed happy eyes) -->
    <path d="M 127 85 Q 131 83 135 86" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/> <!-- Eye -->
    <path d="M 116 85 Q 120 83 124 86" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/> <!-- Eye -->
    <path d="M 126 93 Q 131 98 136 93" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" fill="none"/> <!-- Smile -->
    <!-- Cute blush -->
    <circle cx="134" cy="91" r="3.5" fill="#f43f5e" opacity="0.5"/>

    <!-- Dynamic Modern Hairstyle -->
    <path d="M 105 85 Q 102 68 122 68 Q 140 68 141 85 Q 142 93 138 90 Q 143 75 125 73 Q 108 72 107 88 Z" fill="url(#hairGrad)"/>

    <!-- Arms (Dynamic pose: one raised for balance) -->
    <!-- Back Arm -->
    <path d="M 105 115 Q 90 125 95 140" stroke="#fde68a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="95" cy="140" r="5" fill="#10b981"/> <!-- Cuff -->

    <!-- Front Arm (Raised up high with fist/peace sign vibe) -->
    <path d="M 130 112 Q 145 100 152 85" stroke="#fde68a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="152" cy="85" r="5" fill="#10b981"/> <!-- Cuff / Hand -->

    <!-- Headphones (Youthful lifestyle accessory) -->
    <path d="M 110 75 Q 120 58 136 75" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="105" y="75" width="6" height="12" rx="3" fill="#f43f5e"/>
    <rect x="133" y="75" width="6" height="12" rx="3" fill="#f43f5e"/>
  </g>

  <!-- Floating Energy Sparkles/Stars (Representing vitality, youth, action) -->
  <g transform="translate(15, -10)">
    <!-- Star 1 -->
    <path d="M 35 90 L 38 96 L 44 98 L 38 100 L 35 106 L 32 100 L 26 98 L 32 96 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- Star 2 -->
    <path d="M 210 115 L 212 119 L 217 120 L 212 122 L 210 127 L 208 122 L 203 120 L 208 119 Z" fill="#fbbf24" opacity="0.9"/>
    <!-- Glowing Dot -->
    <circle cx="195" cy="85" r="3" fill="#f43f5e" filter="url(#softGlow)"/>
    <circle cx="45" cy="145" r="2.5" fill="#38bdf8" filter="url(#softGlow)"/>
  </g>
</svg>