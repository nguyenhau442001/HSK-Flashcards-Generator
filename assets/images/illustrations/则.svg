<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window light beam gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Desk / Furniture Gradient -->
    <linearGradient id="woodDesk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Accent Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Architecture -->
  <!-- Office Back Wall -->
  <rect x="20" y="20" width="200" height="150" rx="6" fill="#1e293b"/>
  
  <!-- Bookshelf / Academic context (Left side - Study) -->
  <rect x="30" y="40" width="35" height="110" rx="2" fill="#0f172a"/>
  <line x1="30" y1="70" x2="65" y2="70" stroke="#334155" stroke-width="2"/>
  <line x1="30" y1="100" x2="65" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="30" y1="130" x2="65" y2="130" stroke="#334155" stroke-width="2"/>
  <!-- Books on shelf -->
  <rect x="35" y="50" width="6" height="20" rx="1" fill="#38bdf8"/>
  <rect x="43" y="48" width="8" height="22" rx="1" fill="#fb923c"/>
  <rect x="53" y="52" width="5" height="18" rx="1" fill="#10b981"/>
  <rect x="36" y="80" width="10" height="20" rx="1" fill="#ec4899"/>
  <rect x="48" y="82" width="7" height="18" rx="1" fill="#fbbf24"/>

  <!-- Window with city/nature view (Study/Mind context) -->
  <rect x="165" y="40" width="45" height="60" rx="4" fill="#0b0f19"/>
  <rect x="169" y="44" width="17" height="25" rx="2" fill="#38bdf8" fill-opacity="0.2"/>
  <rect x="190" y="44" width="17" height="25" rx="2" fill="#38bdf8" fill-opacity="0.2"/>
  <rect x="169" y="72" width="17" height="25" rx="2" fill="#38bdf8" fill-opacity="0.2"/>
  <rect x="190" y="72" width="17" height="25" rx="2" fill="#38bdf8" fill-opacity="0.2"/>

  <!-- Light Beam from Window -->
  <polygon points="165,40 210,40 240,170 120,170" fill="url(#lightBeam)"/>

  <!-- Hanging Plant for rich environment -->
  <path d="M 80,20 Q 85,35 90,20" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="85" cy="35" r="8" fill="#10b981"/>
  <path d="M 77,33 Q 80,45 85,38" fill="#059669"/>
  <path d="M 93,33 Q 90,45 85,38" fill="#059669"/>

  <!-- Modern Desk Surface -->
  <path d="M 10,160 L 230,160 L 220,200 L 20,200 Z" fill="url(#woodDesk)"/>
  <rect x="15" y="155" width="210" height="7" rx="3" fill="#475569"/>

  <!-- Foreground Props: Study & Professional Work Tools -->
  <!-- Open Textbook / Study Notes (Left) -->
  <path d="M 45,168 L 75,160 L 85,178 L 55,186 Z" fill="#f8fafc"/>
  <path d="M 75,160 L 105,168 L 95,186 L 65,178 Z" fill="#f1f5f9"/>
  <line x1="53" y1="171" x2="68" y2="167" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="55" y1="176" x2="70" y2="172" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="82" y1="167" x2="97" y2="171" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="80" y1="172" x2="95" y2="176" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Laptop / Professional Work (Center-Right) -->
  <path d="M 130,155 L 180,155 L 195,175 L 115,175 Z" fill="#cbd5e1"/>
  <path d="M 135,120 L 175,120 L 180,155 L 130,155 Z" fill="#94a3b8"/>
  <!-- Laptop Screen UI (Charts showing strong performance/capability) -->
  <rect x="138" y="126" width="34" height="22" rx="2" fill="#0f172a"/>
  <polyline points="142,143 148,137 154,140 162,130 168,133" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="162" cy="130" r="2.5" fill="#10b981"/>

  <!-- Coffee Mug -->
  <rect x="195" y="145" width="14" height="16" rx="2" fill="#fb923c"/>
  <path d="M 209,148 C 214,148 214,156 209,158" fill="none" stroke="#fb923c" stroke-width="2"/>
  <!-- Steam from coffee -->
  <path d="M 199,140 Q 202,135 199,130" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- MAIN SUBJECT: Smart, Capable Character -->
  <!-- Character Torso & Shoulders -->
  <path d="M 95,185 C 95,150 145,150 145,185 Z" fill="#3b82f6"/> <!-- Professional blue shirt -->
  <path d="M 112,150 L 120,165 L 128,150 Z" fill="#f8fafc"/> <!-- Collar -->
  <polygon points="120,158 117,175 123,175" fill="#ef4444"/> <!-- Red tie representing high achievement -->

  <!-- Character Neck -->
  <rect x="113" y="132" width="14" height="22" rx="4" fill="#fbcfe8"/>

  <!-- Character Head -->
  <circle cx="120" cy="115" r="20" fill="#fbcfe8"/>

  <!-- Hair (Stylish, modern, neat) -->
  <path d="M 100,115 C 100,98 140,98 140,115 C 140,105 135,93 120,93 C 105,93 100,105 100,115 Z" fill="#1e293b"/>

  <!-- Friendly, Confident Facial Expressions -->
  <!-- Eyes (Smart & Focused) -->
  <circle cx="113" cy="113" r="2" fill="#1e293b"/>
  <circle cx="127" cy="113" r="2" fill="#1e293b"/>
  <!-- Smile -->
  <path d="M 115,122 Q 120,126 125,122" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="110" cy="117" r="3" fill="#fda4af" opacity="0.6"/>
  <circle cx="130" cy="117" r="3" fill="#fda4af" opacity="0.6"/>

  <!-- Arms / Action Gestures -->
  <!-- Left arm resting on study notes -->
  <path d="M 100,165 L 75,172 L 78,180" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="77" cy="180" r="5" fill="#fbcfe8"/>

  <!-- Right arm active / pointing towards work capability (expressing "则更强" - even stronger capability) -->
  <path d="M 140,165 L 165,150 L 175,142" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="177" cy="140" r="5" fill="#fbcfe8"/>

  <!-- Glowing Aura of High Competence & Success (Visual metaphor for "更强" / even stronger) -->
  <circle cx="160" cy="130" r="18" fill="url(#goldGlow)"/>
  <!-- Floating Performance / Success Sparkles -->
  <path d="M 160,115 L 163,122 L 170,125 L 163,128 L 160,135 L 157,128 L 150,125 L 157,122 Z" fill="#fbbf24"/>
  <path d="M 188,125 L 190,129 L 195,131 L 190,133 L 188,138 L 186,133 L 181,131 L 186,129 Z" fill="#38bdf8" transform="scale(0.7) translate(80, 40)"/>
  <path d="M 135,95 L 137,98 L 141,100 L 137,102 L 135,105 L 133,102 L 129,100 L 133,98 Z" fill="#10b981" transform="scale(0.8) translate(30, -5)"/>

  <!-- Additional interior details to ground the scene -->
  <circle cx="110" cy="45" r="4" fill="#334155"/>
  <circle cx="130" cy="45" r="4" fill="#334155"/>

</svg>