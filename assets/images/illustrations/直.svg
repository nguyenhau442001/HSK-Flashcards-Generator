<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with dark modern gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Environment / Urban Street / Corridor Context -->
  <!-- Background Wall / Buildings -->
  <rect x="20" y="30" width="80" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="140" y="30" width="80" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Architectural details (Windows/Doors in perspective) -->
  <rect x="35" y="45" width="20" height="35" rx="2" fill="#0f172a"/>
  <rect x="65" y="45" width="20" height="35" rx="2" fill="#0f172a"/>
  <rect x="155" y="45" width="20" height="35" rx="2" fill="#0f172a"/>
  <rect x="185" y="45" width="20" height="35" rx="2" fill="#0f172a"/>

  <!-- Perspective Floor Grid / Street Floor -->
  <polygon points="0,140 240,140 220,240 20,240" fill="url(#floorGrad)"/>
  
  <!-- Floor tiles/lines pointing STRAIGHT forward (emphasizing '直') -->
  <line x1="120" y1="140" x2="120" y2="240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <line x1="80" y1="140" x2="40" y2="240" stroke="#475569" stroke-width="1.5"/>
  <line x1="160" y1="140" x2="200" y2="240" stroke="#475569" stroke-width="1.5"/>

  <!-- Ambient Lighting / Directional Glow -->
  <polygon points="100,140 140,140 170,240 70,240" fill="url(#beamGrad)"/>

  <!-- Overhead Street / Corridor Light Fixture -->
  <rect x="105" y="20" width="30" height="10" rx="3" fill="#64748b"/>
  <path d="M110,30 L130,30 L145,140 L95,140 Z" fill="url(#beamGrad)"/>

  <!-- Main Subject: Guide / Helper Character pointing STRAIGHT ahead -->
  <!-- Guide character (Left, professional pose) -->
  <g transform="translate(60, 115)">
    <!-- Shadow -->
    <ellipse cx="0" cy="30" rx="14" ry="5" fill="#0f172a" opacity="0.7"/>
    <!-- Body / Suit -->
    <path d="M -10,0 L 10,0 L 12,25 L -12,25 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="0" cy="-14" r="10" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M -10,-18 Q 0,-26 10,-18 Q 12,-12 8,-10 Q 0,-14 -8,-10 Q -12,-12 -10,-18 Z" fill="#334155"/>
    <!-- Pointing Arm (pointing STRAIGHT forward) -->
    <path d="M 10,-5 L 28,-12" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
    <circle cx="28" cy="-12" r="4" fill="#fbcfe8"/>
    <!-- Standing Leg -->
    <rect x="-6" y="25" width="5" height="15" rx="2" fill="#1e293b"/>
    <rect x="2" y="25" width="5" height="15" rx="2" fill="#1e293b"/>
  </g>

  <!-- Main Subject: Traveler / Passerby Character walking STRAIGHT -->
  <!-- Traveler character (Center, moving forward along the straight path) -->
  <g transform="translate(135, 140)">
    <!-- Shadow -->
    <ellipse cx="0" cy="45" rx="16" ry="6" fill="#0f172a" opacity="0.8"/>
    
    <!-- Backpack / Travel gear -->
    <rect x="-14" y="5" width="10" height="20" rx="4" fill="#fb923c"/>
    
    <!-- Torso / Jacket -->
    <path d="M -10,0 L 10,0 L 12,32 L -12,32 Z" fill="#10b981"/>
    
    <!-- Head -->
    <circle cx="0" cy="-14" r="11" fill="#fed7aa"/>
    <!-- Travel Hat / Cap -->
    <path d="M -12,-18 C -12,-24 12,-24 12,-18 L 16,-15 L -14,-15 Z" fill="#059669"/>
    
    <!-- Walking Legs (in motion) -->
    <!-- Back Leg -->
    <path d="M -6,32 L -12,50" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <!-- Front Leg -->
    <path d="M 6,32 L 14,48" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Arms swinging naturally -->
    <path d="M -10,5 L -20,18" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <path d="M 10,5 L 20,15" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Clear visual directional indicators (Graphic elements reinforcing '直' - STRAIGHT line motion) -->
  <g opacity="0.85">
    <!-- Sleek forward movement arrow elements floating -->
    <path d="M 135,80 L 135,45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
    <polygon points="135,35 127,48 143,48" fill="#38bdf8"/>

    <!-- Additional subtle geometric straight trajectory lines on the floor matching the concept -->
    <line x1="135" y1="150" x2="135" y2="210" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.9"/>
  </g>

  <!-- Additional scenic details: Signage post pointing the way -->
  <g transform="translate(45, 95)">
    <!-- Post -->
    <rect x="0" y="0" width="4" height="65" fill="#64748b"/>
    <!-- Arrow Signboard pointing straight up/forward -->
    <path d="M -15,-15 L 2,-25 L 19,-15 L 2,-5 Z" fill="#f59e0b"/>
    <!-- Decorative arrow cutout/icon on sign -->
    <path d="M 2,-20 L 2,-10 M -2,-15 L 2,-19 L 6,-15" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Atmospheric subtle particle dots -->
  <circle cx="100" cy="70" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="160" cy="90" r="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="120" cy="60" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="80" cy="110" r="1.5" fill="#f59e0b" opacity="0.5"/>
</svg>