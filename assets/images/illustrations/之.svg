<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Main Subject: A golden trophy (symbolizing the 'result' of collective effort) -->
  <g transform="translate(120, 130)">
    <!-- Base -->
    <ellipse cx="0" cy="40" rx="30" ry="10" fill="#fbbf24"/>
    <rect x="-15" y="20" width="30" height="20" fill="#f59e0b"/>
    <!-- Stem -->
    <rect x="-5" y="0" width="10" height="20" fill="#fb923c"/>
    <!-- Cup -->
    <path d="M-30 -10 C-30 -40, -20 -50, 0 -50 C20 -50, 30 -40, 30 -10 Z" fill="#fbbf24"/>
    <!-- Handles -->
    <path d="M-30 -20 C-45 -20, -45 -40, -30 -40" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M30 -20 C45 -20, 45 -40, 30 -40" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Supporting elements: Hands connecting to the trophy (representing collective effort) -->
  <g transform="translate(60, 160)">
    <path d="M0 0 C10 -20, 30 -20, 40 0" stroke="#38bdf8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="-10" r="8" fill="#38bdf8"/>
  </g>
  
  <g transform="translate(140, 160)">
    <path d="M0 0 C10 -20, 30 -20, 40 0" stroke="#10b981" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="-10" r="8" fill="#10b981"/>
  </g>

  <!-- Atmospheric details: Floating particles of success -->
  <circle cx="50" cy="50" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="190" cy="40" r="4" fill="#ec4899" opacity="0.6"/>
  <circle cx="120" cy="20" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="120" r="3" fill="#10b981" opacity="0.6"/>
</svg>