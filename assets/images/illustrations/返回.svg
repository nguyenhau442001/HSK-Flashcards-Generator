<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background: Train station platform elements -->
  <rect x="20" y="180" width="200" height="60" fill="#334155"/>
  <rect x="30" y="190" width="180" height="5" fill="#475569"/>
  <circle cx="120" cy="140" r="40" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Suitcase -->
  <rect x="160" y="160" width="30" height="40" rx="4" fill="#fb923c"/>
  <rect x="165" y="155" width="20" height="5" rx="2" fill="#fb923c"/>
  <rect x="172" y="165" width="6" height="10" rx="1" fill="#ea580c"/>
  
  <!-- Characters -->
  <!-- Person 1 -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 40 Q20 60 30 40" stroke="#fde68a" stroke-width="4" fill="none"/>
    <rect x="5" y="50" width="30" height="60" rx="5" fill="#38bdf8"/>
    <rect x="5" y="110" width="12" height="15" rx="2" fill="#1e293b"/>
    <rect x="23" y="110" width="12" height="15" rx="2" fill="#1e293b"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(100, 130)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="5" y="50" width="30" height="50" rx="5" fill="#ec4899"/>
    <rect x="5" y="100" width="12" height="15" rx="2" fill="#1e293b"/>
    <rect x="23" y="100" width="12" height="15" rx="2" fill="#1e293b"/>
  </g>
  
  <!-- Directional Arrow (Abstract movement) -->
  <path d="M140 100 L180 100 L170 90 M180 100 L170 110" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- City silhouette in distance -->
  <path d="M20 180 L40 140 L60 170 L80 130 L100 160 L120 120 L140 150 L160 140 L180 180 Z" fill="#334155"/>
</svg>