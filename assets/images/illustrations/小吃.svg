<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Stall Counter -->
  <path d="M20 180 L220 180 L210 220 L30 220 Z" fill="#334155"/>
  <path d="M30 220 L210 220 L205 240 L35 240 Z" fill="#1e293b"/>
  
  <!-- Steam/Atmosphere -->
  <circle cx="120" cy="100" r="30" fill="#fbbf24" opacity="0.1"/>
  <path d="M110 120 Q120 110 130 120 T150 120" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Skewers (The Snacks) -->
  <g transform="rotate(-15 120 140)">
    <rect x="118" y="100" width="4" height="80" rx="2" fill="#d97706"/>
    <circle cx="120" cy="100" r="12" fill="#ec4899"/>
    <circle cx="120" cy="130" r="14" fill="#fb923c"/>
    <circle cx="120" cy="160" r="12" fill="#10b981"/>
  </g>
  
  <g transform="rotate(10 160 150)">
    <rect x="158" y="110" width="4" height="70" rx="2" fill="#d97706"/>
    <circle cx="160" cy="115" r="10" fill="#fbbf24"/>
    <circle cx="160" cy="140" r="12" fill="#ec4899"/>
  </g>
  
  <!-- Paper Tray -->
  <path d="M80 170 L160 170 L150 190 L90 190 Z" fill="#f8fafc"/>
  
  <!-- Lanterns -->
  <circle cx="40" cy="40" r="15" fill="#f59e0b"/>
  <path d="M40 55 L40 70" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="200" cy="50" r="12" fill="#ec4899"/>
  <path d="M200 62 L200 75" stroke="#ec4899" stroke-width="2"/>
  
  <!-- Decorative Accents -->
  <circle cx="70" cy="120" r="3" fill="#38bdf8"/>
  <circle cx="180" cy="100" r="4" fill="#10b981"/>
</svg>