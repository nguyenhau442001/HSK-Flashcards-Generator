<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed and Night Scene -->
  <rect x="40" y="140" width="160" height="60" rx="8" fill="#334155"/>
  <path d="M50 140 Q120 110 190 140 Z" fill="#475569"/>
  
  <!-- Character sleeping -->
  <circle cx="80" cy="130" r="15" fill="#fde68a"/>
  <path d="M72 125 Q75 122 78 125 M82 125 Q85 122 88 125" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M75 132 Q80 135 85 132" stroke="#1e293b" stroke-width="2" fill="none"/>
  
  <!-- Clock showing late time -->
  <circle cx="180" cy="70" r="25" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
  <line x1="180" y1="70" x2="180" y2="50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="70" x2="195" y2="70" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Night atmosphere -->
  <circle cx="40" cy="50" r="3" fill="#f8fafc"/>
  <circle cx="60" cy="30" r="2" fill="#f8fafc"/>
  <circle cx="200" cy="40" r="2" fill="#f8fafc"/>
  
  <!-- Repetitive action indicators (dots representing 'often') -->
  <circle cx="120" cy="100" r="4" fill="#fb923c" opacity="0.8"/>
  <circle cx="135" cy="90" r="4" fill="#fb923c" opacity="0.6"/>
  <circle cx="150" cy="80" r="4" fill="#fb923c" opacity="0.4"/>
  
  <!-- Bedside Lamp -->
  <rect x="180" y="120" width="10" height="20" fill="#38bdf8"/>
  <path d="M170 120 L190 120 L195 100 L165 100 Z" fill="#fbbf24"/>
</svg>