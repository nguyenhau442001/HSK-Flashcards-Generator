<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Doorway frame -->
  <path d="M60 40 L180 40 L180 200 L60 200 Z" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="70" y="50" width="100" height="140" fill="#0f172a"/>
  
  <!-- Interior scene (Inside the room) -->
  <circle cx="120" cy="100" r="30" fill="#fbbf24" opacity="0.15"/>
  <path d="M105 120 Q120 135 135 120" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M100 110 Q105 105 110 110" stroke="#fb923c" stroke-width="2" fill="none"/>
  <path d="M130 110 Q135 105 140 110" stroke="#fb923c" stroke-width="2" fill="none"/>
  
  <!-- Person 1 inside -->
  <circle cx="110" cy="140" r="15" fill="#38bdf8"/>
  <rect x="105" y="155" width="10" height="45" fill="#38bdf8"/>
  
  <!-- Person 2 inside -->
  <circle cx="140" cy="145" r="15" fill="#ec4899"/>
  <rect x="135" y="160" width="10" height="40" fill="#ec4899"/>
  
  <!-- Door handle -->
  <circle cx="165" cy="120" r="4" fill="#94a3b8"/>
  
  <!-- Exterior context (Outside the room) -->
  <path d="M20 180 L60 180 L60 240 L20 240 Z" fill="#1e293b"/>
  <path d="M180 180 L220 180 L220 240 L180 240 Z" fill="#1e293b"/>
  
  <!-- Light spilling from the door -->
  <path d="M60 50 L180 50 L190 200 L50 200 Z" fill="#fbbf24" opacity="0.05"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="30" r="2" fill="#f8fafc" opacity="0.3"/>
  <circle cx="30" cy="50" r="3" fill="#f8fafc" opacity="0.2"/>
  <circle cx="210" cy="210" r="2" fill="#f8fafc" opacity="0.3"/>
</svg>