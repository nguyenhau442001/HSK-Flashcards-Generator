<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <circle cx="180" cy="60" r="40" fill="#334155" opacity="0.3"/>
  
  <!-- Main Subject: Two friends sharing a moment (Real friendship) -->
  <!-- Character 1 (Left) -->
  <g transform="translate(60, 100)">
    <path d="M20 120 L60 120 L55 80 L25 80 Z" fill="#38bdf8"/>
    <circle cx="40" cy="50" r="25" fill="#fde68a"/>
    <path d="M30 45 Q35 40 40 45 Q45 40 50 45" stroke="#78350f" stroke-width="2" fill="none"/>
    <path d="M35 55 Q40 60 45 55" stroke="#78350f" stroke-width="2" fill="none"/>
  </g>

  <!-- Character 2 (Right) -->
  <g transform="translate(120, 100)">
    <path d="M20 120 L60 120 L55 80 L25 80 Z" fill="#fb923c"/>
    <circle cx="40" cy="50" r="25" fill="#fde68a"/>
    <path d="M30 45 Q35 40 40 45 Q45 40 50 45" stroke="#78350f" stroke-width="2" fill="none"/>
    <path d="M35 55 Q40 60 45 55" stroke="#78350f" stroke-width="2" fill="none"/>
    <!-- Handshake / Connection -->
    <circle cx="10" cy="80" r="12" fill="#fbbf24"/>
  </g>

  <!-- Symbolic "Real/True" Heart Glow -->
  <path d="M120 70 C 130 60, 145 60, 145 75 C 145 90, 120 105, 120 105 C 120 105, 95 90, 95 75 C 95 60, 110 60, 120 70" fill="#ec4899"/>
  
  <!-- Ground/Surface -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a" opacity="0.5"/>
  <ellipse cx="120" cy="210" rx="100" ry="10" fill="#000" opacity="0.2"/>
</svg>