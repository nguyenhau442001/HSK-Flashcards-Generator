<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Water Gradient -->
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Moon/Glow Gradient -->
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>

    <!-- Boat Hull Gradient -->
    <linearGradient id="boat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="sail-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Starry Night Background Elements -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="35" cy="40" r="1.5" />
    <circle cx="90" cy="25" r="1" />
    <circle cx="150" cy="35" r="2" opacity="0.9"/>
    <circle cx="205" cy="20" r="1" />
    <circle cx="220" cy="55" r="1.5" />
  </g>

  <!-- Moon with soft glow -->
  <circle cx="190" cy="45" r="30" fill="url(#moon-glow)"/>
  <circle cx="190" cy="45" r="14" fill="#fef08a"/>

  <!-- Distant Mountains/Hills -->
  <path d="M 0 135 Q 40 120, 80 135 T 160 130 T 240 135 L 240 150 L 0 150 Z" fill="#334155" opacity="0.5"/>

  <!-- Water Body -->
  <rect x="0" y="140" width="240" height="100" fill="url(#water-grad)"/>

  <!-- Dynamic Water Wave Ripples (Background) -->
  <path d="M -10 155 Q 30 150, 70 155 T 150 155 T 230 155 T 250 155" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <path d="M -10 170 Q 40 165, 90 170 T 190 170 T 250 170" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

  <!-- Rock / Reed in background for spatial anchoring -->
  <g fill="#0f172a" opacity="0.7">
    <path d="M 220 145 L 223 125 L 226 145 Z"/>
    <path d="M 227 145 L 231 120 L 234 145 Z"/>
    <path d="M 215 147 Q 212 135, 210 128" stroke="#0f172a" stroke-width="1.5" fill="none"/>
  </g>

  <!-- GROUP: The Rocking Boat and Characters (Tilting to show '摇晃') -->
  <g transform="translate(120, 150) rotate(-8) translate(-120, -150)">
    
    <!-- Reflection under boat -->
    <ellipse cx="120" cy="165" rx="45" ry="5" fill="#0284c7" opacity="0.6"/>

    <!-- Boat Hull -->
    <path d="M 75 145 Q 120 175, 165 145 L 155 160 Q 120 183, 85 160 Z" fill="url(#boat-grad)" stroke="#78350f" stroke-width="1.5"/>
    <path d="M 77 147 C 95 157, 145 157, 163 147" fill="none" stroke="#92400e" stroke-width="1"/>

    <!-- Wooden Plank Detail inside boat -->
    <line x1="95" y1="152" x2="145" y2="152" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Mast & Sail -->
    <line x1="120" y1="148" x2="120" y2="85" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <!-- Cute triangular folding sail -->
    <path d="M 122 88 L 150 115 L 122 135 Z" fill="url(#sail-grad)" opacity="0.95"/>
    <!-- Small pennant flag at top of mast -->
    <path d="M 120 85 L 132 89 L 120 93 Z" fill="#ef4444"/>

    <!-- Character 1: Sitting/Fishing or Relaxing (Left) -->
    <g transform="translate(98, 138)">
      <!-- Body/Torso -->
      <path d="M -8 15 C -8 5, 8 5, 8 15 Z" fill="#3b82f6"/>
      <!-- Head -->
      <circle cx="0" cy="-2" r="7" fill="#fde047"/>
      <!-- Hair/Hat -->
      <path d="M -8 -3 Q 0 -10, 8 -3 C 8 -7, -8 -7, -8 -3 Z" fill="#1e293b"/>
      <!-- Arm holding fishing rod -->
      <path d="M 4 8 L 15 2" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
      <!-- Fishing rod -->
      <line x1="15" y1="2" x2="35" y2="-20" stroke="#78350f" stroke-width="1.5"/>
      <line x1="35" y1="-20" x2="35" y2="15" stroke="#cbd5e1" stroke-width="0.5" opacity="0.7"/>
    </g>

    <!-- Character 2: Excited Passenger pointing at motion (Right) -->
    <g transform="translate(138, 136)">
      <!-- Body/Torso -->
      <path d="M -7 17 C -7 7, 7 7, 7 17 Z" fill="#ec4899"/>
      <!-- Head -->
      <circle cx="0" cy="0" r="7" fill="#fde047"/>
      <!-- Hair -->
      <circle cx="0" cy="-3" r="7" fill="#475569" clip-path="polygon(-10 -10, 10 -10, 10 2, -10 2)"/>
      <path d="M -6 -4 Q 0 -9, 6 -4" fill="none" stroke="#475569" stroke-width="2"/>
      <!-- Raised arm showing wonder/motion -->
      <path d="M 4 10 L 12 2" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Lantern hanging from mast for cozy realism -->
    <g transform="translate(110, 115)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="1"/>
      <rect x="-3" y="6" width="6" height="8" rx="2" fill="#f59e0b"/>
      <circle cx="0" cy="10" r="2" fill="#fef08a"/>
      <!-- Lantern glow -->
      <circle cx="0" cy="10" r="10" fill="#f59e0b" opacity="0.25"/>
    </g>

  </g> <!-- End of Boat Group -->

  <!-- Foreground Dynamic Water Ripples and Splashes (Emphasizing '摇晃' motion) -->
  <path d="M 60 175 Q 85 168, 110 175 T 160 175" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 130 188 Q 155 182, 180 188 T 220 188" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 30 185 Q 50 180, 70 185" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Ripple rings around the swaying boat hull base -->
  <ellipse cx="100" cy="168" rx="12" ry="3" fill="none" stroke="#e0f2fe" stroke-width="1" opacity="0.5"/>
  <ellipse cx="145" cy="168" rx="15" ry="3.5" fill="none" stroke="#e0f2fe" stroke-width="1" opacity="0.4"/>

  <!-- Floating Lotus Leaf for added environment richness -->
  <g transform="translate(45, 178)">
    <path d="M 0 0 C 10 -6, 20 -2, 22 6 C 24 14, 12 18, 0 12 C -8 16, -14 8, -6 2 Z" fill="#047857" stroke="#065f46" stroke-width="1"/>
    <path d="M 0 6 L 18 6" stroke="#065f46" stroke-width="0.7" opacity="0.6"/>
  </g>

  <!-- Small glowing firefly near reeds -->
  <circle cx="205" cy="135" r="2" fill="#fde047"/>
  <circle cx="205" cy="135" r="5" fill="#fde047" opacity="0.3"/>

</svg>