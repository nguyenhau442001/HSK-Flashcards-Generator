<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Warm Bowl Gradient -->
    <linearGradient id="bowlBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="bowlFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="brothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Chili Gradients -->
    <linearGradient id="chiliRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e4c"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="chiliStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Atmosphere -->
  <g opacity="0.15">
    <!-- Wooden Table Texture / Lines -->
    <path d="M0 180 L240 180" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 8"/>
    <path d="M0 200 L240 200" stroke="#f59e0b" stroke-width="1" stroke-dasharray="8 4"/>
  </g>

  <!-- Ambient Heat Glow behind the bowl -->
  <circle cx="120" cy="145" r="55" fill="#f97316" filter="url(#glow)" opacity="0.3"/>
  <circle cx="120" cy="130" r="30" fill="#fbbf24" filter="url(#glow)" opacity="0.2"/>

  <!-- Back Rim of the Ceramic Bowl -->
  <ellipse cx="120" cy="115" rx="75" ry="18" fill="url(#bowlBack)"/>
  
  <!-- Spicy Broth Surface -->
  <ellipse cx="120" cy="118" rx="69" ry="14" fill="url(#brothGrad)"/>
  
  <!-- Broth Details / Oil Bubbles -->
  <circle cx="95" cy="115" r="3" fill="#fef08a" opacity="0.8"/>
  <circle cx="140" cy="120" r="2" fill="#fef08a" opacity="0.9"/>
  <circle cx="115" cy="124" r="4" fill="#fef08a" opacity="0.7"/>
  <circle cx="80" cy="120" r="2" fill="#ea580c"/>
  <circle cx="155" cy="115" r="2.5" fill="#ea580c"/>

  <!-- Floating Chili Slices in Broth -->
  <g transform="translate(100, 114) rotate(-15)">
    <ellipse cx="0" cy="0" rx="8" ry="5" fill="#7f1d1d"/>
    <ellipse cx="0" cy="0" rx="6" ry="3.5" fill="#f97316"/>
  </g>
  <g transform="translate(135, 122) rotate(25)">
    <ellipse cx="0" cy="0" rx="9" ry="5.5" fill="#7f1d1d"/>
    <ellipse cx="0" cy="0" rx="7" ry="4" fill="#ef4444"/>
  </g>
  <g transform="translate(118, 118) rotate(5)">
    <ellipse cx="0" cy="0" rx="7" ry="4" fill="#7f1d1d"/>
    <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="#f59e0b"/>
  </g>

  <!-- Steam / Heat Waves -->
  <path d="M 95 95 Q 90 75 105 55 T 95 25" fill="none" stroke="#fdba74" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 120 100 Q 135 80 120 60 T 130 30" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 145 95 Q 150 75 135 55 T 145 25" fill="none" stroke="#fdba74" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Front Body of the Ceramic Bowl -->
  <path d="M 45 115 C 45 165, 75 185, 120 185 C 165 185, 195 165, 195 115 Z" fill="url(#bowlFront)"/>
  <!-- Bowl Inner Shadow/Depth -->
  <path d="M 45 115 C 45 125, 75 135, 120 135 C 165 135, 195 125, 195 115 C 195 128, 165 142, 120 142 C 75 142, 45 128, 45 115 Z" fill="#7f1d1d" opacity="0.6"/>

  <!-- Decorative Pattern on Bowl -->
  <path d="M 85 155 Q 120 170 155 155" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>

  <!-- Action / Heat Sparkles & Floating Chili Flakes around -->
  <g fill="#f59e0b">
    <circle cx="45" cy="95" r="2" opacity="0.8"/>
    <circle cx="195" cy="100" r="3" opacity="0.9"/>
    <circle cx="30" cy="140" r="1.5" opacity="0.7"/>
    <circle cx="210" cy="145" r="2" opacity="0.8"/>
  </g>
  <g fill="#ef4444">
    <circle cx="60" cy="70" r="2.5" opacity="0.9"/>
    <circle cx="180" cy="65" r="3.5" opacity="0.8"/>
    <circle cx="105" cy="40" r="2" opacity="0.7"/>
  </g>

  <!-- Foreground Main Chili Pepper 1 (Curved, dynamic, crossing the bowl) -->
  <g filter="url(#glow)">
    <!-- Shadow for depth -->
    <path d="M 42 162 C 35 130, 60 90, 110 75 C 125 70, 140 75, 140 75" fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round" opacity="0.3"/>
  </g>
  
  <!-- Chili Pepper 1 Body -->
  <path d="M 40 160 C 32 125, 58 88, 108 73 C 122 69, 138 73, 142 75 C 142 75, 125 95, 95 110 C 68 123, 48 150, 40 160 Z" fill="url(#chiliRed)"/>
  <!-- Chili Pepper 1 Highlight -->
  <path d="M 52 145 C 48 122, 68 95, 102 82" fill="none" stroke="#fca5a5" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Chili Pepper 1 Stem -->
  <path d="M 37 165 C 33 172, 28 178, 22 182 C 26 180, 31 176, 35 168 Z" fill="url(#chiliStem)"/>
  <path d="M 38 162 L 32 170" stroke="#14532d" stroke-width="3" stroke-linecap="round"/>

  <!-- Foreground Main Chili Pepper 2 (Dynamic, crossing right) -->
  <g>
    <!-- Chili Pepper 2 Body -->
    <path d="M 195 155 C 205 125, 185 90, 135 80 C 120 77, 105 83, 102 85 C 102 85, 118 102, 145 118 C 170 132, 190 148, 195 155 Z" fill="url(#chiliRed)"/>
    <!-- Chili Pepper 2 Highlight -->
    <path d="M 180 140 C 188 118, 172 98, 140 90" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Chili Pepper 2 Stem -->
    <path d="M 198 160 C 203 167, 209 173, 215 178 C 210 176, 204 171, 197 163 Z" fill="url(#chiliStem)"/>
    <path d="M 197 158 L 205 166" stroke="#14532d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Extra Floating Pepper Flake 1 -->
  <g transform="translate(70, 55) rotate(-45)">
    <path d="M0 0 C 4 8, 12 10, 16 6 C 12 2, 4 -2, 0 0 Z" fill="url(#chiliRed)"/>
    <path d="M -4 -2 L 2 -4" stroke="url(#chiliStem)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Extra Floating Pepper Flake 2 -->
  <g transform="translate(170, 50) rotate(35)">
    <path d="M0 0 C -4 9, -12 11, -16 6 C -11 2, -4 -3, 0 0 Z" fill="url(#chiliRed)"/>
    <path d="M 3 -3 L -2 -5" stroke="url(#chiliStem)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

</svg>