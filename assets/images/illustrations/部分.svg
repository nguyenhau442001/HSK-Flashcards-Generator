<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Pizza Crust Gradient -->
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Pizza Base/Cheese Gradient -->
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting / Glow -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="120" cy="120" r="50" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

  <!-- Surface / Table -->
  <ellipse cx="120" cy="190" rx="95" ry="30" fill="url(#floorGrad)"/>
  <ellipse cx="120" cy="190" rx="85" ry="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- SCENE: Pizza Box (The Whole) - Open in background -->
  <g transform="translate(120, 95) scale(0.85)" filter="url(#dropShadow)">
    <!-- Open Pizza Box Bottom -->
    <polygon points="-70,10 70,10 50,75 -50,75" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="-60,20 60,20 42,68 -42,68" fill="#f8fafc"/>
    <!-- Box Lid (upright/angled back) -->
    <polygon points="-70,10 70,10 55,-40 -55,-40" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <polygon points="-64,6 64,6 50,-34 -50,-34" fill="#cbd5e1"/>
    <!-- Faded Pizza graphic inside box background -->
    <circle cx="0" cy="42" r="30" fill="#fbbf24" opacity="0.5"/>
    <!-- Missing slice void inside box -->
    <path d="M0,42 L25,20 A30,30 0 0,1 30,42 Z" fill="#cbd5e1"/>
  </g>

  <!-- MAIN OBJECT: A Single Part (A Slice of Pizza being lifted) -->
  <g filter="url(#dropShadow)" transform="translate(0, -10)">
    <!-- Motion Action Lines indicating movement of the part -->
    <path d="M 85,85 Q 95,75 105,65" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 75,95 Q 85,85 95,75" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <circle cx="108" cy="62" r="2.5" fill="#38bdf8" opacity="0.9"/>

    <!-- Glowing highlight underneath the lifted slice -->
    <path d="M 120,135 L 75,105 L 145,85 Z" fill="#f59e0b" opacity="0.25" filter="url(#glow)"/>

    <!-- The Lifted Slice Group (Rotated & Translated for dynamic action) -->
    <g transform="translate(120, 115) rotate(-15) translate(-120, -115)">
      <!-- Pepperoni Slice 1 -->
      <circle cx="115" cy="115" r="9" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
      <circle cx="113" cy="113" r="1.5" fill="#fca5a5"/>
      <circle cx="118" cy="117" r="1" fill="#fca5a5"/>

      <!-- Pepperoni Slice 2 -->
      <circle cx="135" cy="95" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
      <circle cx="133" cy="93" r="1.5" fill="#fca5a5"/>

      <!-- Pizza Slice Body (Triangle/Sector) -->
      <path d="M 120,130 L 70,85 A 70,70 0 0,1 155,100 Z" fill="url(#cheeseGrad)" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Crust Edge (arc part) -->
      <path d="M 70,85 A 70,70 0 0,1 155,100 L 120,130 Z" fill="none"/>
      <path d="M 68,82 A 73,73 0 0,1 158,98" stroke="url(#crustGrad)" stroke-width="8" stroke-linecap="round"/>

      <!-- Melted Cheese / Details -->
      <path d="M 110,110 Q 120,115 125,105 Q 130,115 140,105" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="95" cy="100" r="4" fill="#fef08a" opacity="0.8"/>
      <circle cx="110" cy="122" r="3" fill="#fef08a" opacity="0.8"/>

      <!-- Stretchy Melted Cheese Strings connecting to the base/rest -->
      <path d="M 95,125 Q 85,145 70,155" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" filter="url(#dropShadow)"/>
      <path d="M 102,128 Q 92,148 85,158" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
      <path d="M 85,120 Q 75,135 60,140" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Context Props (Spices / Drink cup to frame the scene) -->
  <g transform="translate(35, 150)" filter="url(#dropShadow)">
    <!-- Chili Flakes Shaker / Jar -->
    <rect x="0" y="10" width="22" height="30" rx="4" fill="#38bdf8" opacity="0.8" stroke="#0284c7" stroke-width="2"/>
    <rect x="4" y="2" width="14" height="8" rx="2" fill="#94a3b8"/>
    <path d="M 5,20 L 17,20 M 5,25 L 17,25" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Secondary Context Prop: A Drink Cup with Straw -->
  <g transform="translate(180, 130)" filter="url(#dropShadow)">
    <path d="M 5,10 L 15,60 L 35,60 L 45,10 Z" fill="#ec4899" stroke="#db2777" stroke-width="2"/>
    <ellipse cx="25" cy="10" rx="20" ry="5" fill="#f472b6"/>
    <!-- Straw -->
    <path d="M 20,5 L 12,-15 L 8,-18" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ice cubes visible through cup -->
    <rect x="18" y="25" width="8" height="8" rx="1" fill="#ffffff" opacity="0.4" transform="rotate(15 22 29)"/>
    <rect x="25" y="40" width="7" height="7" rx="1" fill="#ffffff" opacity="0.4" transform="rotate(-10 28 43)"/>
  </g>

  <!-- Sparkles / Atmosphere indicating quality/focus on the 'part' -->
  <g fill="#fbbf24">
    <path d="M 70,55 Q 70,65 60,65 Q 70,65 70,75 Q 70,65 80,65 Q 70,65 70,55" opacity="0.9"/>
    <path d="M 165,75 Q 165,81 159,81 Q 165,81 165,87 Q 165,81 171,81 Q 165,81 165,75" opacity="0.7"/>
    <circle cx="140" cy="45" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="55" cy="105" r="1.5" fill="#38bdf8" opacity="0.6"/>
  </g>
</svg>