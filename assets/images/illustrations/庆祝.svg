<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Festive Glow -->
    <radialGradient id="festiveGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Skin & Clothes Gradients -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    
    <!-- Table Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#festiveGlow)"/>

  <!-- Background Environment (Interior, Window, Hanging Decorations) -->
  <g id="environment">
    <!-- Window Frame & Night Sky -->
    <path d="M 80 40 L 160 40 L 160 110 L 80 110 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <line x1="120" y1="40" x2="120" y2="110" stroke="#334155" stroke-width="2"/>
    <!-- City lights outside -->
    <circle cx="95" cy="65" r="1.5" fill="#fbbf24" opacity="0.6"/>
    <circle cx="105" cy="85" r="1" fill="#38bdf8" opacity="0.7"/>
    <circle cx="135" cy="60" r="1.5" fill="#ec4899" opacity="0.6"/>
    <circle cx="145" cy="90" r="2" fill="#fbbf24" opacity="0.8"/>

    <!-- Festive Hanging Garlands & Lanterns -->
    <path d="M 10 20 Q 70 45 120 20 Q 170 45 230 20" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Lantern 1 -->
    <path d="M 65 32 Q 55 45 65 58 Q 75 45 65 32 Z" fill="#ef4444"/>
    <rect id="lanternGlow" x="63" y="30" width="4" height="3" fill="#f59e0b"/>
    <line x1="65" y1="27" x2="65" y2="32" stroke="#f59e0b" stroke-width="1"/>

    <!-- Lantern 2 -->
    <path d="M 175 32 Q 165 45 175 58 Q 185 45 175 32 Z" fill="#f59e0b"/>
    <rect x="173" y="30" width="4" height="3" fill="#ef4444"/>
    <line x1="175" y1="27" x2="175" y2="32" stroke="#f59e0b" stroke-width="1"/>

    <!-- Confetti / Streamers -->
    <path d="M 30 70 Q 35 60 40 75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 200 65 Q 205 75 210 60" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <path d="M 50 110 Q 55 100 45 105" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Table and Feast Props -->
  <g id="table-and-props">
    <!-- Table Surface -->
    <path d="M 30 170 L 210 170 L 220 210 L 20 210 Z" fill="url(#tableGrad)"/>
    <rect x="25" y="165" width="190" height="7" rx="3.5" fill="#475569"/>

    <!-- Celebration Cake in the Center -->
    <path d="M 105 150 L 135 150 L 132 170 L 108 170 Z" fill="#f43f5e"/>
    <path d="M 100 150 C 100 146 140 146 140 150 C 140 154 100 154 100 150 Z" fill="#fda4af"/>
    <!-- Cake Frosting Drips -->
    <path d="M 100 150 Q 105 157 110 150 Q 115 158 120 150 Q 125 157 130 150 Q 135 158 140 150 Z" fill="#ffffff"/>
    <!-- Candles -->
    <rect x="117" y="136" width="3" height="14" fill="#fbbf24"/>
    <ellipse cx="118.5" cy="133" rx="2" ry="4" fill="#f97316"/>
    <ellipse cx="118.5" cy="132" rx="1" ry="2" fill="#fef08a"/>

    <!-- Gift Box Left -->
    <rect x="50" y="152" width="22" height="20" rx="2" fill="#10b981"/>
    <rect x="58" y="152" width="6" height="20" fill="#fef08a"/>
    <rect x="48" y="150" width="26" height="4" rx="1" fill="#059669"/>
    <path d="M 61 145 Q 55 142 59 148 Q 63 145 61 145 Z" fill="#fef08a"/>

    <!-- Drink Glasses / Toasting Props -->
    <path d="M 155 155 L 163 155 L 161 170 L 157 170 Z" fill="#38bdf8" opacity="0.8"/>
    <line x1="159" y1="170" x2="159" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="159" cy="175" rx="4" ry="1" fill="#94a3b8"/>
  </g>

  <!-- Characters (Actively Celebrating / Toasting) -->
  <g id="characters">
    <!-- Character 1 (Left - Cheering with arm up) -->
    <g id="char-left">
      <!-- Body / Torso -->
      <path d="M 70 170 C 70 140 95 140 95 170 Z" fill="url(#shirt1)"/>
      <!-- Head & Face -->
      <circle cx="82.5" cy="122" r="14" fill="#ffedd5"/>
      <!-- Hair -->
      <path d="M 69 122 C 69 110 96 110 96 122 C 92 115 73 115 69 122 Z" fill="#1e293b"/>
      <!-- Happy Expressive Eyes (Arched / Closed in joy) -->
      <path d="M 77 121 Q 80 118 83 121" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 83 121 Q 86 118 89 121" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Big Open Smile -->
      <path d="M 80 126 Q 83 131 86 126" fill="#e11d48"/>
      
      <!-- Raised Arm (Toasting/Cheering action) -->
      <path d="M 90 145 Q 105 130 115 135" fill="none" stroke="url(#shirt1)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="116" cy="136" r="4.5" fill="#ffedd5"/>
    </g>

    <!-- Character 2 (Right - Smiling warmly, raising glass) -->
    <g id="char-right">
      <!-- Body / Torso -->
      <path d="M 145 170 C 145 140 170 140 170 170 Z" fill="url(#shirt2)"/>
      <!-- Head & Face -->
      <circle cx="157.5" cy="122" r="14" fill="#ffedd5"/>
      <!-- Hair -->
      <path d="M 144 122 C 144 108 171 108 171 122 C 165 113 150 113 144 122 Z" fill="#475569"/>
      <!-- Happy Eyes -->
      <circle cx="153" cy="121" r="1.5" fill="#1e293b"/>
      <circle cx="162" cy="121" r="1.5" fill="#1e293b"/>
      <!-- Smile -->
      <path d="M 154 126 Q 157.5 130 161 126" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Raised Arm holding glass -->
      <path d="M 150 145 Q 138 130 130 138" fill="none" stroke="url(#shirt2)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="129" cy="139" r="4.5" fill="#ffedd5"/>
      
      <!-- Glass in hand -->
      <path d="M 125 130 L 133 132 L 131 142 L 127 142 Z" fill="#38bdf8" opacity="0.9"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Sparkles & Celebration Elements -->
  <g id="sparkles">
    <!-- Sparkle 1 -->
    <path d="M 40 100 Q 40 90 50 90 Q 40 90 40 80 Q 40 90 30 90 Q 40 90 40 100 Z" fill="#fef08a"/>
    <!-- Sparkle 2 -->
    <path d="M 190 90 Q 190 82 198 82 Q 190 82 190 74 Q 190 82 182 82 Q 190 82 190 90 Z" fill="#fef08a"/>
    <!-- Sparkle 3 -->
    <path d="M 120 95 Q 120 90 125 90 Q 120 90 120 85 Q 120 90 115 90 Q 120 90 120 95 Z" fill="#38bdf8"/>
    <!-- Sparkle 4 (Near Cake) -->
    <path d="M 100 130 Q 100 126 104 126 Q 100 126 100 122 Q 100 126 96 126 Q 100 126 100 130 Z" fill="#f43f5e"/>
  </g>
</svg>