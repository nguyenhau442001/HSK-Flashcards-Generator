<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="140" width="180" height="15" rx="2" fill="#334155"/>
  <rect x="40" y="155" width="10" height="60" fill="#475569"/>
  <rect x="190" y="155" width="10" height="60" fill="#475569"/>
  
  <!-- Character -->
  <circle cx="120" cy="80" r="25" fill="#fde68a"/>
  <path d="M105 75 Q110 70 115 75 M125 75 Q130 70 135 75" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M110 95 Q120 100 130 95" stroke="#ec4899" stroke-width="2" fill="none"/>
  <rect x="80" y="110" width="80" height="40" rx="10" fill="#cbd5e1"/>
  
  <!-- Papers and Chaos -->
  <rect x="50" y="120" width="30" height="20" fill="#f1f5f9" transform="rotate(-10 65 130)"/>
  <rect x="160" y="125" width="30" height="20" fill="#f1f5f9" transform="rotate(15 175 135)"/>
  <path d="M140 120 L150 100 L160 120" fill="#fb923c"/>
  
  <!-- Computer Screen -->
  <rect x="90" y="50" width="60" height="45" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <line x1="100" y1="65" x2="140" y2="65" stroke="#38bdf8" stroke-width="2"/>
  <line x1="100" y1="75" x2="130" y2="75" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Coffee Mug -->
  <rect x="170" y="115" width="15" height="20" rx="2" fill="#fbbf24"/>
  <path d="M185 120 Q195 120 195 130" stroke="#fbbf24" stroke-width="3" fill="none"/>
  
  <!-- Clock showing late time -->
  <circle cx="200" cy="30" r="15" fill="#334155"/>
  <line x1="200" y1="30" x2="200" y2="20" stroke="#f8fafc" stroke-width="2"/>
  <line x1="200" y1="30" x2="210" y2="30" stroke="#f8fafc" stroke-width="2"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="100" r="100" fill="url(#lightGrad)" opacity="0.1"/>
  <defs>
    <radialGradient id="lightGrad">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>