<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Canvas/Easel Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Canvas Texture/Background -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Glowing Magic Palette Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background art studio details -->
  <!-- Bookshelf / Reference prints in background -->
  <rect x="25" y="45" width="30" height="40" rx="4" fill="#334155" opacity="0.6" />
  <rect x="30" y="50" width="20" height="5" rx="2" fill="#fb923c" opacity="0.7" />
  <rect x="30" y="60" width="20" height="5" rx="2" fill="#38bdf8" opacity="0.7" />
  
  <rect x="185" y="35" width="25" height="50" rx="4" fill="#334155" opacity="0.6" />
  <circle cx="197" cy="60" r="8" fill="#10b981" opacity="0.6" />

  <!-- Studio Easel Legs -->
  <line x1="120" y1="40" x2="60" y2="210" stroke="url(#woodGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="120" y1="40" x2="180" y2="210" stroke="url(#woodGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="120" y1="35" x2="120" y2="210" stroke="url(#woodGrad)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Easel Shelf -->
  <rect x="45" y="165" width="150" height="8" rx="3" fill="url(#woodGrad)" filter="url(#shadow)" />

  <!-- Canvas Board (Framing the Abstract Artwork) -->
  <rect x="55" y="35" width="130" height="135" rx="6" fill="#0f172a" filter="url(#shadow)" />
  <rect x="58" y="38" width="124" height="129" rx="4" fill="url(#canvasGrad)" />

  <!-- ========================================== -->
  <!-- THE "ABSTRACT" (抽象) ARTWORK ON CANVAS -->
  <!-- Breaking away from concrete shapes into fluid, energetic forms -->
  <!-- ========================================== -->
  
  <!-- Abstract Swirl / Fluid Art Background -->
  <path d="M 75 120 C 75 80, 110 70, 130 90 C 150 110, 165 70, 155 50" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Swirling Dynamic Abstract Shapes (Representing abstract thought & non-representational art) -->
  <!-- Vibrant Purple/Pink Fluid Splash -->
  <path d="M 70 110 Q 90 60, 130 80 T 170 100 Q 180 140, 140 145 Q 90 150, 70 110 Z" fill="url(#glowGrad)" opacity="0.85" filter="url(#glow)" />

  <!-- Geometric elements floating out of bounds (breaking reality) -->
  <circle cx="150" cy="70" r="14" fill="#fb923c" opacity="0.9" filter="url(#shadow)" />
  <rect x="75" y="100" width="22" height="22" rx="4" fill="#38bdf8" transform="rotate(25 86 111)" opacity="0.9" filter="url(#shadow)" />
  
  <!-- Floating Star / Sparkle Accent -->
  <path d="M 115 55 L 118 63 L 126 66 L 118 69 L 115 77 L 112 69 L 104 66 L 112 63 Z" fill="#facc15" filter="url(#glow)" />
  <path d="M 155 125 L 157 130 L 162 132 L 157 134 L 155 139 L 153 134 L 148 132 L 153 130 Z" fill="#38bdf8" />

  <!-- Fluid Ribbon/Wave crossing over -->
  <path d="M 65 140 C 95 130, 110 150, 135 120 C 160 90, 175 110, 175 110" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.9"/>


  <!-- ========================================== -->
  <!-- FOREGROUND PROPS (Artist's Palette & Brush) -->
  <!-- Anchoring the abstract scene in a real studio -->
  <!-- ========================================== -->
  
  <!-- Wooden Artist Palette -->
  <g transform="translate(45, 175) rotate(-10)" filter="url(#shadow)">
    <!-- Palette Body -->
    <ellipse cx="45" cy="30" rx="35" ry="25" fill="#fde68a" stroke="#d97706" stroke-width="3" />
    <!-- Thumb Hole -->
    <ellipse cx="25" cy="35" rx="5" ry="7" fill="#0f172a" />
    
    <!-- Paint Blobs on Palette -->
    <circle cx="55" cy="18" r="5" fill="#ec4899" />
    <circle cx="65" cy="30" r="6" fill="#38bdf8" />
    <circle cx="50" cy="42" r="5" fill="#10b981" />
    <circle cx="35" cy="45" r="4" fill="#facc15" />
  </g>

  <!-- Paintbrush dripping with creative color -->
  <g transform="translate(140, 160) rotate(35)" filter="url(#shadow)">
    <!-- Brush Handle -->
    <rect x="-3" y="0" width="6" height="65" rx="3" fill="#b45309" />
    <!-- Ferrule (Metal part) -->
    <rect x="-3.5" y="-12" width="7" height="12" rx="1.5" fill="#94a3b8" />
    <!-- Bristles -->
    <path d="M -3.5 -12 Q 0 -22 3.5 -12 Z" fill="#38bdf8" />
    <!-- Magical Paint Drop falling from brush -->
    <path d="M 0 -25 Q 2 -29 0 -33 Q -2 -29 0 -25 Z" fill="#ec4899" filter="url(#glow)" />
  </g>

  <!-- Studio Ambient Lighting / Highlights on Easel -->
  <line x1="61" y1="210" x2="63" y2="210" stroke="#f59e0b" stroke-width="4" opacity="0.6" />
  <circle cx="120" cy="40" r="3" fill="#fde68a" />

</svg>