<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Water Surface -->
  <path d="M0 160 Q 60 150, 120 160 T 240 160 L 240 240 L 0 240 Z" fill="#0ea5e9" opacity="0.3"/>
  <path d="M0 165 Q 60 155, 120 165 T 240 165 L 240 240 L 0 240 Z" fill="#0284c7" opacity="0.4"/>
  
  <!-- Boat -->
  <g transform="translate(60, 140)">
    <path d="M10 20 L 110 20 L 100 50 L 20 50 Z" fill="#fb923c"/>
    <path d="M10 20 L 20 50 L 10 50 Z" fill="#ea580c"/>
    <rect x="50" y="5" width="20" height="15" fill="#f59e0b"/>
    <rect x="55" y="10" width="10" height="10" fill="#0f172a"/>
    <!-- Bubbles -->
    <circle cx="120" cy="60" r="3" fill="#38bdf8" opacity="0.6"/>
    <circle cx="130" cy="75" r="5" fill="#38bdf8" opacity="0.4"/>
    <circle cx="115" cy="85" r="2" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Moon/Light Reflection -->
  <circle cx="180" cy="50" r="25" fill="#fbbf24" opacity="0.2"/>
  <circle cx="180" cy="50" r="15" fill="#fef3c7" opacity="0.1"/>
  
  <!-- Waves/Disturbance -->
  <path d="M80 160 Q 90 155, 100 160" stroke="#bae6fd" stroke-width="2" fill="none"/>
  <path d="M70 165 Q 85 160, 100 165" stroke="#bae6fd" stroke-width="2" fill="none"/>
  
  <!-- Decorative Stars -->
  <circle cx="30" cy="40" r="1" fill="#f8fafc"/>
  <circle cx="200" cy="30" r="1.5" fill="#f8fafc"/>
  <circle cx="50" cy="80" r="1" fill="#f8fafc"/>
</svg>