<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Lab Table -->
  <rect x="20" y="160" width="200" height="15" rx="2" fill="#334155"/>
  <rect x="40" y="175" width="10" height="50" fill="#475569"/>
  <rect x="190" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Scientist -->
  <circle cx="120" cy="80" r="25" fill="#fde68a"/>
  <path d="M105 85 Q120 100 135 85" stroke="#475569" stroke-width="2" fill="none"/>
  <rect x="95" y="105" width="50" height="60" rx="5" fill="#e2e8f0"/>
  <path d="M95 110 L80 140 M145 110 L160 140" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Experiment Props -->
  <path d="M60 160 L60 120 L80 120 L80 160" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="70" cy="110" r="10" fill="#38bdf8"/>
  <path d="M160 160 L180 130 L200 160" fill="#ec4899" opacity="0.8"/>
