<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Chalkboard Glow / Ambient Light -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Blackboard Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132a22" />
      <stop offset="100%" stop-color="#0b1b15" />
    </linearGradient>

    <!-- Wood Trim Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Teacher Clothing Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- Classroom Interior Background Elements -->
  <!-- Wall accents / cork board / window hint -->
  <rect x="180" y="30" width="35" height="45" rx="4" fill="#334155" opacity="0.4" />
  <rect x="185" y="35" width="25" height="35" fill="#475569" opacity="0.3" />
  
  <!-- Hanging Lamp / Spotlight -->
  <path d="M120,0 L120,25" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <path d="M105,25 L135,25 L140,35 L100,35 Z" fill="#475569" />
  <ellipse cx="120" cy="35" rx="20" ry="8" fill="#38bdf8" opacity="0.6" filter="url(#shadow)" />

  <!-- THE BLACKBOARD (黑板) - Central Hero Prop -->
  <g filter="url(#shadow)">
    <!-- Wooden Outer Frame -->
    <rect x="25" y="45" width="190" height="115" rx="6" fill="url(#woodGrad)" />
    <!-- Blackboard Inner Surface -->
    <rect x="29" y="49" width="182" height="107" rx="3" fill="url(#boardGrad)" />
    
    <!-- Blackboard Gloss / Reflection -->
    <path d="M35,55 L90,55 L75,145 L35,145 Z" fill="#ffffff" opacity="0.03" />

    <!-- Chalk Tray -->
    <rect x="23" y="158" width="194" height="6" rx="2" fill="#78350f" />
    <!-- Chalk pieces and eraser on tray -->
    <rect x="40" y="154" width="10" height="4" rx="1" fill="#f1f5f9" />
    <rect x="53" y="155" width="8" height="3" rx="1" fill="#f1f5f9" opacity="0.8" />
    <rect x="175" y="152" width="22" height="6" rx="2" fill="#cbd5e1" />

    <!-- Abstract Chalk Drawings & Writing on Board (Simulating Chinese characters/writing without real text) -->
    <!-- Graphical glyph representation 1 -->
    <path d="M 50,75 Q 55,70 65,75 T 75,80" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M 55,72 L 55,92 M 45,85 L 65,82" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- Graphical glyph representation 2 -->
    <path d="M 90,73 L 115,73 M 95,82 L 110,82 M 88,95 Q 100,88 115,96" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- Graphical glyph representation 3 (Active writing area near teacher) -->
    <path d="M 135,78 L 155,75 M 140,70 L 140,90 M 133,85 Q 145,88 158,82" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
    <!-- Glowing chalk dust effect around active writing point -->
    <circle cx="138" cy="78" r="4" fill="#fef08a" opacity="0.4" filter="url(#shadow)" />

    <!-- Simple geometric diagram drawn with chalk -->
    <circle cx="185" cy="80" r="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
    <polygon points="185,68 195,90 175,90" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Foreground Classroom Elements (Desk edge / Plant) -->
  <!-- Potted desk plant for rich environmental framing -->
  <path d="M10,210 Q10,195 25,195 L35,195 Q50,195 50,210 Z" fill="#475569" />
  <ellipse cx="30" cy="195" rx="12" ry="4" fill="#64748b" />
  <!-- Plant leaves -->
  <path d="M30,195 Q15,175 20,160 Q30,180 30,195 Z" fill="#10b981" />
  <path d="M30,195 Q40,170 50,165 Q45,185 30,195 Z" fill="#059669" />
  <path d="M30,195 Q30,170 32,155 Q33,175 30,195 Z" fill="#34d399" />

  <!-- THE TEACHER (Subject actively writing) -->
  <g id="teacher" filter="url(#shadow)">
    <!-- Teacher Body / Torso -->
    <path d="M 100,180 L 115,145 L 145,150 L 155,185 Z" fill="url(#shirtGrad)" />
    <!-- Collar / Tie -->
    <path d="M 124,145 L 132,145 L 135,160 L 122,160 Z" fill="#ffffff" />
    <polygon points="128,150 131,150 130,170" fill="#ef4444" />

    <!-- Head & Face Profile / 3/4 view facing the board -->
    <circle cx="130" cy="115" r="18" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 112,115 Q 115,95 132,97 Q 150,98 147,118 Q 140,110 130,110 Q 118,110 112,115 Z" fill="#334155" />
    <!-- Glasses -->
    <rect x="122" y="110" width="8" height="6" rx="1" fill="none" stroke="#b45309" stroke-width="1.5" />
    <rect x="132" y="110" width="8" height="6" rx="1" fill="none" stroke="#b45309" stroke-width="1.5" />
    <line x1="130" y1="113" x2="132" y2="113" stroke="#b45309" stroke-width="1.5" />

    <!-- Left Arm (Resting or holding book/posture) -->
    <path d="M 108,150 L 95,175 L 105,180" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Arm (Raised actively writing on the board) -->
    <path d="M 140,150 Q 150,135 142,125" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <!-- Hand holding chalk -->
    <circle cx="142" cy="122" r="5" fill="#fbcfe8" />
    <!-- Chalk piece in hand -->
    <rect x="140" y="118" width="6" height="3" rx="1" fill="#ffffff" transform="rotate(-30 143 119)" />
  </g>

  <!-- Desk and Student silhouette in foreground (Bottom right corner depth) -->
  <g opacity="0.9">
    <!-- Student Back/Head (Foreground framing) -->
    <circle cx="205" cy="225" r="22" fill="#334155" />
    <path d="M 185,240 Q 190,205 225,205 Q 240,210 240,240 Z" fill="#64748b" />
    <!-- Student hair -->
    <path d="M 186,220 Q 205,195 225,215 Q 210,210 186,220 Z" fill="#0f172a" />
  </g>

  <!-- Ambient lighting particles / chalk dust floating -->
  <circle cx="155" cy="95" r="1.5" fill="#fef08a" opacity="0.8" />
  <circle cx="125" cy="85" r="1" fill="#fef08a" opacity="0.6" />
  <circle cx="165" cy="115" r="2" fill="#fef08a" opacity="0.5" />
  <circle cx="95" cy="100" r="1" fill="#38bdf8" opacity="0.5" />
</svg>