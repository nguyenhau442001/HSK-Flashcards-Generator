<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character Fur Gradient -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Props -->
  <!-- Bookshelf in background -->
  <rect x="25" y="40" width="60" height="90" rx="4" fill="#0f172a" opacity="0.6" />
  <rect x="35" y="60" width="40" height="8" rx="2" fill="#334155" />
  <rect x="30" y="85" width="50" height="8" rx="2" fill="#334155" />
  <rect x="35" y="110" width="42" height="8" rx="2" fill="#334155" />
  
  <!-- Tilted books on shelf -->
  <path d="M40 60 L45 48 L52 50 L47 62 Z" fill="#38bdf8" />
  <path d="M54 60 L58 46 L65 48 L61 62 Z" fill="#ec4899" />

  <!-- Wall Plant -->
  <path d="M195 70 C195 55 210 50 215 65 C220 80 205 95 195 90 Z" fill="#10b981" opacity="0.8" />
  <path d="M205 75 C215 70 220 85 210 95 C200 105 195 90 205 75 Z" fill="#059669" opacity="0.8" />
  <path d="M195 90 L195 65" stroke="#334155" stroke-width="3" stroke-linecap="round" />

  <!-- Desk Surface -->
  <path d="M0 170 L240 170 L240 230 C240 235 235 240 230 240 L10 240 C5 240 0 235 0 230 Z" fill="url(#deskGrad)" />
  <rect x="0" y="170" width="240" height="6" fill="#475569" opacity="0.5" />

  <!-- Desk Lamp (Ambient Lighting) -->
  <path d="M190 170 L210 100 L225 100 L215 170 Z" fill="#334155" />
  <circle cx="217" cy="95" r="18" fill="#f59e0b" filter="url(#shadow)" />
  <circle cx="217" cy="95" r="60" fill="url(#lampGlow)" />

  <!-- Study Props: Open Notebook & Pencil -->
  <g filter="url(#shadow)">
    <!-- Notebook Base -->
    <path d="M50 185 L120 175 L145 210 L75 220 Z" fill="#f8fafc" />
    <path d="M97.5 177.5 L110 195" stroke="#cbd5e1" stroke-width="2" />
    <!-- Scribbles in notebook (abstract, non-text) -->
    <path d="M60 195 Q65 190 70 198 T80 192" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <path d="M62 205 Q70 200 75 208" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Dropped Pencil -->
    <path d="M130 190 L160 220" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <path d="M128 188 L133 193" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- MAIN SUBJECT: Confused/Clueless Orange Monster/Character (Representing 'bèn' / clumsy moment) -->
  <g filter="url(#shadow)">
    <!-- Body Drop Shadow / Base -->
    <ellipse cx="120" cy="180" rx="45" ry="12" fill="#0f172a" opacity="0.5" />

    <!-- Main Round Body -->
    <circle cx="120" cy="140" r="50" fill="url(#furGrad)" />

    <!-- Soft Fur Tufts (Edges) -->
    <path d="M72 125 C68 120 70 110 77 115 Z" fill="#ea580c" />
    <path d="M168 125 C172 120 170 110 163 115 Z" fill="#ea580c" />
    <path d="M150 95 C155 90 160 98 155 103 Z" fill="#ea580c" />
    <path d="M90 95 C85 90 80 98 85 103 Z" fill="#ea580c" />

    <!-- Short Arms Scratching Head / Confused Pose -->
    <!-- Left arm down in frustration -->
    <path d="M75 155 C60 160 55 175 65 180 C75 185 85 170 85 160 Z" fill="#ea580c" />
    
    <!-- Right arm up, scratching head -->
    <path d="M155 130 C170 120 175 105 165 100 C155 95 145 115 145 125 Z" fill="#ea580c" />

    <!-- Big Expression Face Area -->
    <ellipse cx="120" cy="145" rx="35" ry="25" fill="#ffedd5" opacity="0.2" />

    <!-- Confused / Cross-Eyed Eyes (Silly / 'Ngu ngốc' expression) -->
    <!-- Left Eye (Looking inward/up) -->
    <circle cx="103" cy="135" r="9" fill="#ffffff" />
    <circle cx="106" cy="133" r="4" fill="#0f172a" />
    <!-- Right Eye (Looking opposite direction, funny cross-eye) -->
    <circle cx="137" cy="135" r="9" fill="#ffffff" />
    <circle cx="134" cy="133" r="4" fill="#0f172a" />

    <!-- Eyebrows (Uneven, confused slant) -->
    <path d="M93 120 Q103 126 113 120" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />
    <path d="M127 120 Q137 126 147 120" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />

    <!-- Open Wavy/Dumbfounded Mouth -->
    <path d="M110 152 Q120 168 130 152 Z" fill="#0f172a" />
    <path d="M115 157 Q120 163 125 157 Z" fill="#ec4899" /> <!-- Tongue -->

    <!-- Cute Rosy Cheeks -->
    <ellipse cx="92" cy="148" rx="6" ry="4" fill="#fb7185" opacity="0.6" />
    <ellipse cx="148" cy="148" rx="6" ry="4" fill="#fb7185" opacity="0.6" />

    <!-- Comical Sweat Drop (Classic cartoon indicator of confusion/dorkiness) -->
    <path d="M162 105 C162 105 168 115 168 120 C168 123.3 165.3 126 162 126 C158.7 126 156 123.3 156 120 C156 115 162 105 162 105 Z" fill="#38bdf8" />
    <!-- Sweat highlight -->
    <path d="M160 115 Q161 118 163 119" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Floating Question Marks (Illustrating "Clueless/Stupid Moment" context safely without text) -->
  <g fill="#38bdf8" opacity="0.8" filter="url(#shadow)">
    <!-- Q-Mark 1 (Left) -->
    <path d="M68 95 C68 85 78 80 85 88 C90 94 82 102 82 108 L82 112 L76 112 L76 107 C76 102 82 98 79 94 C77 91 73 93 72 96 Z" />
    <circle cx="79" cy="120" r="3" />

    <!-- Q-Mark 2 (Right, larger, tilted) -->
    <g transform="translate(145, 65) rotate(15)">
      <path d="M15 10 C15 0 25 -5 32 3 C37 9 29 17 29 23 L29 27 L23 27 L23 22 C23 17 29 13 26 9 C24 6 20 8 19 11 Z" />
      <circle cx="26" cy="35" r="3" />
    </g>
  </g>

</svg>