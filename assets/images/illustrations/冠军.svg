<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Podium Gold Gradient -->
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Spotlight Gradient -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Confetti Colors -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Spotlight Beams -->
  <polygon points="120,0 60,240 180,240" fill="url(#spotlight)"/>
  <polygon points="120,0 30,240 90,240" fill="url(#spotlight)" opacity="0.5"/>
  <polygon points="120,0 150,240 210,240" fill="url(#spotlight)" opacity="0.5"/>

  <!-- Atmospheric Glowing Particles / Confetti (Background) -->
  <circle cx="50" cy="70" r="2.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="190" cy="50" r="3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="210" cy="110" r="2" fill="#f472b6" opacity="0.9"/>
  <circle cx="35" cy="140" r="2" fill="#34d399" opacity="0.8"/>
  <circle cx="105" cy="40" r="1.5" fill="#fbbf24" opacity="0.9"/>

  <rect x="75" y="80" width="6" height="12" rx="1" fill="url(#pinkGrad)" transform="rotate(35 78 86)"/>
  <rect x="160" y="90" width="8" height="5" rx="1" fill="url(#cyanGrad)" transform="rotate(-20 164 92)"/>
  <rect x="40" y="110" width="7" height="7" rx="1" fill="#fbbf24" transform="rotate(15 43 113)"/>
  <rect x="195" y="145" width="6" height="10" rx="1" fill="url(#pinkGrad)" transform="rotate(-45 198 150)"/>

  <!-- Stadium Background Elements / Arch Grills -->
  <path d="M40,200 L200,200" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Podium Structure -->
  <!-- 2nd Place (Left) -->
  <path d="M64,150 L96,150 L96,205 L64,205 Z" fill="#475569"/>
  <path d="M64,150 L96,150 L86,142 L54,142 Z" fill="#64748b"/>
  <path d="M54,142 L86,142 L86,205 L54,205 Z" fill="#334155"/>
  <text x="70" y="180" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="16">2</text>

  <!-- 3rd Place (Right) -->
  <path d="M144,165 L176,165 L176,205 L144,205 Z" fill="#334155"/>
  <path d="M144,165 L176,165 L166,157 L134,157 Z" fill="#475569"/>
  <path d="M134,157 L166,157 L166,205 L134,205 Z" fill="#1e293b"/>
  <text x="150" y="190" fill="#64748b" font-family="sans-serif" font-weight="bold" font-size="16">3</text>

  <!-- 1st Place (Center - Champion) -->
  <path d="M96,115 L144,115 L144,205 L96,205 Z" fill="#d97706"/>
  <path d="M96,115 L144,115 L128,105 L80,105 Z" fill="url(#podiumGrad)"/>
  <path d="M80,105 L128,105 L128,205 L80,205 Z" fill="#b45309"/>
  <text x="101" y="158" fill="#fef08a" font-family="sans-serif" font-weight="900" font-size="28" filter="drop-shadow(0px 2px 0px rgba(0,0,0,0.3))">1</text>

  <!-- Champion Character (Joyful, Arms Raised) -->
  <!-- Body / Torso -->
  <path d="M100,105 C100,90 140,90 140,105 L135,130 C135,130 120,135 105,130 Z" fill="#10b981"/>
  <!-- Champion Medal Ribbon & Medal -->
  <path d="M112,105 L120,122 L128,105 Z" fill="#ef4444"/>
  <circle cx="120" cy="124" r="5" fill="#f59e0b"/>

  <!-- Head & Happy Expression -->
  <circle cx="120" cy="78" r="16" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M104,74 C104,64 112,60 120,60 C128,60 136,64 136,74 C132,70 128,68 120,68 C112,68 108,70 104,74 Z" fill="#b45309"/>
  <!-- Eyes (Happy Arcs) -->
  <path d="M113,76 Q116,73 119,76" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M121,76 Q124,73 127,76" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Big Smile -->
  <path d="M115,82 Q120,88 125,82" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="111" cy="80" r="2" fill="#f43f5e" opacity="0.6"/>
  <circle cx="129" cy="80" r="2" fill="#f43f5e" opacity="0.6"/>

  <!-- Arms Raised in Victory -->
  <!-- Left Arm -->
  <path d="M102,98 C90,90 80,75 74,65" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Right Arm -->
  <path d="M138,98 C150,90 160,75 166,65" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Massive Champion Trophy (Floating/Held above or prominent) -->
  <g transform="translate(120, 36)">
    <!-- Trophy Glow -->
    <circle cx="0" cy="-10" r="25" fill="#fbbf24" opacity="0.2" filter="blur(4px)"/>
    
    <!-- Trophy Base -->
    <path d="M-6,22 L6,22 L4,28 L-4,28 Z" fill="#334155"/>
    <rect x="-10" y="28" width="20" height="5" rx="1" fill="#1e293b"/>
    
    <!-- Trophy Stem -->
    <rect x="-3" y="10" width="6" height="12" fill="url(#trophyGrad)"/>
    
    <!-- Trophy Cup Body -->
    <path d="M-16,-12 C-16,10 16,10 16,-12 L12,-16 C12,-16 10,-18 -10,-18 L-16,-12 Z" fill="url(#trophyGrad)"/>
    
    <!-- Cup Rim -->
    <ellipse cx="0" cy="-16" rx="12" ry="3" fill="#fef08a"/>
    <ellipse cx="0" cy="-16" rx="10" ry="2" fill="#d97706"/>

    <!-- Handles -->
    <path d="M-12,-13 C-20,-13 -20,-3 -12,2" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M12,-13 C20,-13 20,-3 12,2" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
    <!-- Star Emblem on Trophy -->
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Foreground Confetti / Streamers -->
  <path d="M15,180 Q25,160 40,175 T65,190" stroke="url(#pinkGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M180,170 Q195,150 210,165 T225,180" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <circle cx="25" cy="85" r="3" fill="#38bdf8"/>
  <circle cx="215" cy="70" r="2.5" fill="#f472b6"/>
  <circle cx="15" cy="120" r="2" fill="#fbbf24"/>
  <circle cx="225" cy="125" r="3" fill="#34d399"/>
</svg>