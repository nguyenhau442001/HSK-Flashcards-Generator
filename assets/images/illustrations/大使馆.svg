<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="sky-glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="building-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="pillar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="path-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Night Sky & Glow -->
  <rect x="0" y="0" width="240" height="150" fill="url(#sky-glow)" />
  
  <!-- Subtle Stars -->
  <circle cx="35" cy="30" r="1" fill="#94a3b8" opacity="0.6" />
  <circle cx="85" cy="20" r="1.5" fill="#f8fafc" opacity="0.8" />
  <circle cx="155" cy="40" r="1" fill="#94a3b8" opacity="0.5" />
  <circle cx="205" cy="25" r="1.5" fill="#f8fafc" opacity="0.7" />
  <circle cx="220" cy="65" r="1" fill="#94a3b8" opacity="0.4" />

  <!-- Distant Foliage / Trees -->
  <path d="M 0 130 Q 15 110, 30 130 Q 50 105, 75 130 Q 100 115, 120 130 Q 150 100, 180 130 Q 210 110, 240 130 L 240 160 L 0 160 Z" fill="#0f172a" />

  <!-- Embassy Building Base & Structure -->
  <!-- Building Ground Shadow -->
  <ellipse cx="120" cy="165" rx="90" ry="15" fill="#020617" opacity="0.6" />

  <!-- Main Structure Body -->
  <rect x="45" y="75" width="150" height="90" fill="url(#building-grad)" filter="url(#soft-shadow)" />

  <!-- Building Side Wings (Architectural Depth) -->
  <polygon points="25,95 45,75 45,165 25,165" fill="#1e293b" />
  <polygon points="215,95 195,75 195,165 215,165" fill="#1e293b" />

  <!-- Grand Roof Structure (Classical Embassy Style) -->
  <polygon points="120,40 210,75 30,75" fill="url(#roof-grad)" filter="url(#soft-shadow)" />
  <!-- Roof Gold Trim -->
  <polygon points="120,45 204,75 200,78 120,48 40,78 36,75" fill="url(#gold-accent)" />

  <!-- Windows (Illuminated Office Lights) -->
  <!-- Top Row -->
  <rect x="60" y="90" width="16" height="22" rx="3" fill="#38bdf8" opacity="0.8" />
  <rect x="85" y="90" width="16" height="22" rx="3" fill="#38bdf8" opacity="0.8" />
  <rect x="112" y="90" width="16" height="22" rx="3" fill="#fef08a" opacity="0.9" />
  <rect x="139" y="90" width="16" height="22" rx="3" fill="#38bdf8" opacity="0.8" />
  <rect x="164" y="90" width="16" height="22" rx="3" fill="#38bdf8" opacity="0.8" />

  <!-- Bottom Row -->
  <rect x="60" y="125" width="16" height="22" rx="3" fill="#38bdf8" opacity="0.5" />
  <rect x="85" y="125" width="16" height="22" rx="3" fill="#38bdf8" opacity="0.8" />
  <rect x="139" y="125" width="16" height="22" rx="3" fill="#fef08a" opacity="0.9" />
  <rect x="164" y="125" width="16" height="22" rx="3" fill="#38bdf8" opacity="0.5" />

  <!-- Grand Entrance Portico & Columns -->
  <rect x="100" y="110" width="40" height="55" fill="#1e293b" />
  <!-- Pillars -->
  <rect x="103" y="115" width="6" height="50" rx="1" fill="url(#pillar-grad)" />
  <rect x="117" y="115" width="6" height="50" rx="1" fill="url(#pillar-grad)" />
  <rect x="131" y="115" width="6" height="50" rx="1" fill="url(#pillar-grad)" />
  <!-- Double Doors -->
  <rect x="111" y="130" width="9" height="35" rx="2" fill="#78350f" />
  <rect x="120" y="130" width="9" height="35" rx="2" fill="#78350f" />
  <circle cx="118" cy="148" r="1" fill="#fbbf24" />
  <circle cx="121" cy="148" r="1" fill="#fbbf24" />

  <!-- Diplomatic Emblem / Crest Mount Above Portico -->
  <circle cx="120" cy="95" r="10" fill="url(#gold-accent)" filter="url(#soft-shadow)" />
  <circle cx="120" cy="95" r="7" fill="#b45309" />
  <path d="M 120 89 L 122 93 L 126 93 L 123 96 L 124 100 L 120 98 L 116 100 L 117 96 L 114 93 L 118 93 Z" fill="#fbbf24" />

  <!-- Flags Flanking the Entrance (International Symbol) -->
  <!-- Left Flagpole & Flag -->
  <line x1="45" y1="160" x2="45" y2="95" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <path d="M 46 96 C 55 92, 60 100, 68 96 L 68 114 C 60 118, 55 110, 46 114 Z" fill="#ef4444" filter="url(#soft-shadow)" />
  <circle cx="45" cy="94" r="2" fill="url(#gold-accent)" />

  <!-- Right Flagpole & Flag -->
  <line x1="195" y1="160" x2="195" y2="95" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <path d="M 194 96 C 185 92, 180 100, 172 96 L 172 114 C 180 118, 185 110, 194 114 Z" fill="#3b82f6" filter="url(#soft-shadow)" />
  <circle cx="195" cy="94" r="2" fill="url(#gold-accent)" />

  <!-- Foreground Environment & Action Context -->
  <!-- Landscaping / Hedges -->
  <path d="M 15 180 Q 25 160, 45 165 Q 60 155, 75 165 L 75 180 Z" fill="#065f46" />
  <path d="M 165 180 Q 180 155, 195 165 Q 215 160, 225 180 Z" fill="#065f46" />

  <!-- Classic Street Lamps casting warm light -->
  <!-- Left Lamp -->
  <path d="M 35 180 L 37 140" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <circle cx="37" cy="138" r="6" fill="#f59e0b" filter="url(#soft-shadow)" />
  <circle cx="37" cy="138" r="4" fill="#fef08a" />
  <circle cx="37" cy="150" r="18" fill="url(#lamp-glow)" opacity="0.6" style="mix-blend-mode: screen;" />

  <!-- Right Lamp -->
  <path d="M 205 180 L 203 140" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <circle cx="203" cy="138" r="6" fill="#f59e0b" filter="url(#soft-shadow)" />
  <circle cx="203" cy="138" r="4" fill="#fef08a" />
  <circle cx="203" cy="150" r="18" fill="url(#lamp-glow)" opacity="0.6" style="mix-blend-mode: screen;" />

  <!-- Paved Walkway / Plaza Foreground -->
  <path d="M 75 165 L 165 165 L 205 240 L 35 240 Z" fill="url(#path-grad)" />
  
  <!-- Walkway perspective tile lines -->
  <line x1="120" y1="165" x2="120" y2="240" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  <line x1="95" y1="180" x2="60" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.4" />
  <line x1="145" y1="180" x2="180" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.4" />

  <!-- Interactive/Action Element: Traveler approaching the Embassy with Passport/Visa documents -->
  <!-- Traveler Shadow -->
  <ellipse cx="92" cy="218" rx="14" ry="5" fill="#020617" opacity="0.7" />

  <!-- Traveler Character Body (Stylized Flat Vector) -->
  <!-- Legs -->
  <rect x="85" y="200" width="5" height="18" rx="2.5" fill="#1e293b" />
  <rect x="94" y="200" width="5" height="18" rx="2.5" fill="#1e293b" />
  <!-- Shoes -->
  <path d="M 83 218 L 88 218 C 90 218, 90 215, 87 215 L 83 215 Z" fill="#0f172a" />
  <path d="M 93 218 L 98 218 C 100 218, 100 215, 97 215 L 93 215 Z" fill="#0f172a" />

  <!-- Coat / Torso -->
  <path d="M 83 180 L 101 180 L 105 205 L 79 205 Z" fill="#38bdf8" filter="url(#soft-shadow)" />
  <path d="M 86 180 L 98 180 L 96 205 L 88 205 Z" fill="#0284c7" /> <!-- Jacket opening -->

  <!-- Scarf (Warm accent) -->
  <path d="M 86 175 C 92 178, 96 175, 100 177 L 98 182 C 94 180, 90 182, 86 180 Z" fill="#fb923c" />
  <path d="M 94 180 L 96 193 L 91 193 Z" fill="#fb923c" /> <!-- Scarf tail -->

  <!-- Head & Hair -->
  <circle cx="92" cy="166" r="8" fill="#fcd34d" />
  <path d="M 84 164 C 84 160, 88 157, 92 157 C 96 157, 100 160, 100 165 C 97 163, 87 163, 84 164 Z" fill="#451a03" />

  <!-- Arm holding Visa/Passport document -->
  <path d="M 84 183 C 78 185, 74 190, 72 196" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" />
  
  <!-- Passport / Visa Document Prop -->
  <g transform="translate(62, 192) rotate(-15)">
    <rect x="0" y="0" width="12" height="15" rx="1.5" fill="#f8fafc" filter="url(#soft-shadow)" />
    <rect x="2" y="3" width="8" height="2" fill="#ef4444" />
    <line x1="2" y1="7" x2="10" y2="7" stroke="#64748b" stroke-width="1" />
    <line x1="2" y1="10" x2="8" y2="10" stroke="#64748b" stroke-width="1" />
  </g>

  <!-- Atmospheric Lighting Overlay (Vignette & Warm Glow) -->
  <circle cx="120" cy="135" r="110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.1" />
</svg>