<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Medical Professional/Doctor Figure -->
  <g transform="translate(60, 80)">
    <circle cx="40" cy="30" r="15" fill="#fde68a"/>
    <path d="M25 45h30v40h-30z" fill="#38bdf8"/>
    <path d="M30 85h20v40h-20z" fill="#38bdf8"/>
    <circle cx="40" cy="30" r="18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Anatomical Heart Model on Stand -->
  <g transform="translate(140, 90)">
    <path d="M20 10 C 10 0, 0 10, 0 25 C 0 40, 20 50, 20 50 C 20 50, 40 40, 40 25 C 40 10, 30 0, 20 10" fill="#ec4899"/>
    <path d="M15 5 L 15 15 M25 5 L 25 15" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <rect x="5" y="55" width="30" height="5" rx="2" fill="#94a3b8"/>
    <rect x="15" y="60" width="10" height="20" fill="#475569"/>
  </g>

  <!-- Background Elements: Medical Chart/Monitor -->
  <rect x="180" y="40" width="40" height="30" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <path d="M185 55 L 195 45 L 205 60 L 215 50" stroke="#10b981" stroke-width="2" fill="none"/>

  <!-- Ambient Glows -->
  <circle cx="160" cy="110" r="40" fill="#fb923c" opacity="0.05"/>
  
  <!-- Table Surface -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>
</svg>