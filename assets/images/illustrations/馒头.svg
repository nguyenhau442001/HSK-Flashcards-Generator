<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Morning Sun / Window Glow -->
    <linearGradient id="morningLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Bamboo Steamer Gradient -->
    <linearGradient id="woodSteamer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Mantou Gradient -->
    <linearGradient id="mantouGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Morning Window & Interior -->
  <!-- Warm sunlight rays coming through a window on the left -->
  <polygon points="0,0 130,0 180,240 0,240" fill="url(#morningLight)"/>
  
  <!-- Wall shelf / Kitchen backdrop -->
  <rect x="20" y="45" width="80" height="6" rx="3" fill="#334155" opacity="0.6"/>
  <circle cx="45" cy="35" r="8" fill="#475569" opacity="0.5"/>
  <rect x="70" y="25" width="12" height="20" rx="2" fill="#64748b" opacity="0.4"/>

  <!-- Hanging plant for cozy atmosphere -->
  <path d="M 205,0 Q 210,35 200,60" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="200" cy="60" r="10" fill="#059669"/>
  <path d="M 190,55 Q 200,75 210,65" fill="#10b981"/>
  <path d="M 195,65 Q 205,80 215,70" fill="#047857"/>

  <!-- Dining Table Surface -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <rect x="0" y="176" width="240" height="6" rx="2" fill="#334155"/>
  <path d="M 0,182 L 240,182" stroke="#475569" stroke-width="1" opacity="0.5"/>

  <!-- CHARACTER: Happy Morning Person (Upper Body, Sitting at Table) -->
  <g transform="translate(130, 85)">
    <!-- Body / Hoodie / Sleepwear -->
    <path d="M -25,95 Q 5,95 35,95 L 45,120 L -35,120 Z" fill="#38bdf8"/>
    <path d="M -5,95 L -5,120 L 5,120 L 5,95 Z" fill="#0284c7"/> <!-- Hoodie pocket/detail -->

    <!-- Neck -->
    <rect x="-6" y="75" width="12" height="15" rx="4" fill="#fcd34d"/>

    <!-- Head -->
    <circle cx="0" cy="50" r="28" fill="#fcd34d"/>

    <!-- Cute Expression: Eyes closed happily, big smile -->
    <!-- Eyebrows / Cheeks -->
    <circle cx="-14" cy="52" r="5" fill="#fb923c" opacity="0.6"/>
    <circle cx="14" cy="52" r="5" fill="#fb923c" opacity="0.6"/>
    
    <!-- Closed Happy Eyes (Arcs) -->
    <path d="M -16,46 Q -12,40 -8,46" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 8,46 Q 12,40 16,46" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M -6,56 Q 0,64 6,56" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Hair (Casual messy morning style) -->
    <path d="M -28,45 Q -32,20 0,22 Q 32,20 28,45 Q 35,25 20,15 Q 0,10 -20,15 Q -35,25 -28,45 Z" fill="#1e293b"/>

    <!-- Raised Hand holding chopsticks / gesturing happily -->
    <path d="M 32,75 Q 45,65 52,50" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    <!-- Chopsticks -->
    <line x1="45" y1="35" x2="65" y2="65" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="33" x2="68" y2="63" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- PROPS: Breakfast Setting (Bamboo Steamer with Mantou) -->
  <!-- Ceramic Plate/Mat -->
  <ellipse cx="65" cy="195" rx="45" ry="15" fill="#334155"/>
  <ellipse cx="65" cy="193" rx="42" ry="13" fill="#f8fafc"/>

  <!-- Bamboo Steamer Base (Open, revealing Mantou) -->
  <g transform="translate(45, 155)">
    <!-- Steamer Rim Outer -->
    <ellipse cx="25" cy="30" rx="35" ry="14" fill="url(#woodSteamer)"/>
    <ellipse cx="25" cy="27" rx="33" ry="12" fill="#fef3c7"/> <!-- Inside depth -->

    <!-- Steam Wisp (Morning freshness) -->
    <path d="M 10,10 Q 5,-5 15,-15 Q 25,-25 18,-35" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 35,15 Q 42,0 35,-10 Q 28,-20 38,-30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- THE TARGET VOCABULARY: 馒头 (White Steamed Buns / Mantou) -->
    <!-- Mantou 1 (Center Front, plump and fluffy) -->
    <path d="M 15,28 Q 15,12 25,12 Q 35,12 35,28 Q 35,32 15,32 Z" fill="url(#mantouGrad)"/>
    <path d="M 23,13 Q 25,18 27,13" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/> <!-- Natural fold crease -->

    <!-- Mantou 2 (Back Left) -->
    <path d="M 2,23 Q 2,10 10,10 Q 18,10 18,23 Q 18,26 2,26 Z" fill="url(#mantouGrad)"/>

    <!-- Mantou 3 (Back Right) -->
    <path d="M 28,24 Q 28,12 36,12 Q 44,12 44,24 Q 44,27 28,27 Z" fill="url(#mantouGrad)"/>

    <!-- Steamer Rim Front Wrap -->
    <path d="M -10,30 Q 25,48 60,30 L 60,38 Q 25,56 -10,38 Z" fill="url(#woodSteamer)"/>
    <!-- Wood grain details -->
    <line x1="10" y1="36" x2="10" y2="44" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="36" x2="40" y2="44" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Warm Tea Mug -->
  <g transform="translate(15, 170)">
    <!-- Mug Body -->
    <path d="M 5,5 L 10,25 Q 15,28 20,25 L 25,5 Z" fill="#ec4899"/>
    <!-- Mug Rim -->
    <ellipse cx="15" cy="5" rx="10" ry="3" fill="#f472b6"/>
    <!-- Handle -->
    <path d="M 3,8 Q -3,15 5,20" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <!-- Tea Steam -->
    <path d="M 15,0 Q 12,-8 16,-14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>