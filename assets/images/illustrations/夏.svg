<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
    <clipPath id="poolClip">
      <ellipse cx="120" cy="180" rx="90" ry="35" />
    </clipPath>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Scorching Summer Sun & Rays -->
  <circle cx="120" cy="70" r="70" fill="url(#sunGlow)" />
  <circle cx="120" cy="70" r="28" fill="#fbbf24" />
  <!-- Sun Rays -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="30" x2="120" y2="18" />
    <line x1="120" y1="110" x2="120" y2="122" />
    <line x1="80" y1="70" x2="68" y2="70" />
    <line x1="160" y1="70" x2="172" y2="70" />
    <line x1="92" y1="42" x2="84" y2="34" />
    <line x1="148" y1="42" x2="156" y2="34" />
    <line x1="92" y1="98" x2="84" y2="106" />
    <line x1="148" y1="98" x2="156" y2="106" />
  </g>

  <!-- Heat Waves (Atmospheric Distortion effect) -->
  <path d="M 60,110 Q 70,105 80,110 T 100,110" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M 140,105 Q 150,100 160,105 T 180,105" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M 90,120 Q 100,115 110,120 T 130,120" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Tropical Palm Tree (Left) -->
  <!-- Trunk -->
  <path d="M 35,185 Q 40,140 30,100" fill="none" stroke="#854d0e" stroke-width="8" stroke-linecap="round" />
  <path d="M 37,180 Q 42,138 32,100" fill="none" stroke="#a16207" stroke-width="4" stroke-linecap="round" />
  <!-- Fronds -->
  <path d="M 30,100 Q 10,90 5,75 Q 20,85 30,100 Z" fill="#15803d" />
  <path d="M 30,100 Q 15,110 5,115 Q 20,110 30,100 Z" fill="#16a34a" />
  <path d="M 30,100 Q 45,75 55,60 Q 45,80 30,100 Z" fill="#22c55e" />
  <path d="M 30,100 Q 55,90 70,95 Q 50,98 30,100 Z" fill="#15803d" />
  <path d="M 30,100 Q 30,70 20,55 Q 28,75 30,100 Z" fill="#16a34a" />

  <!-- Swimming Pool Rim / Deck -->
  <ellipse cx="120" cy="183" rx="95" ry="38" fill="#334155" />
  <ellipse cx="120" cy="180" rx="92" ry="36" fill="#f8fafc" />
  
  <!-- Swimming Pool Interior & Water -->
  <g clip-path="url(#poolClip)">
    <ellipse cx="120" cy="180" rx="90" ry="35" fill="url(#poolGrad)" />
    <!-- Water Ripples / Caustics -->
    <path d="M 50,175 Q 70,165 90,180 T 130,175 T 170,185" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
    <path d="M 70,195 Q 95,185 115,195 T 155,190" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.5" />
    
    <!-- Floating Pool Ring (Floatie) -->
    <g transform="translate(140, 175) rotate(-15)">
      <!-- Outer ring -->
      <ellipse cx="0" cy="0" rx="22" ry="16" fill="#ec4899" />
      <ellipse cx="0" cy="0" rx="22" ry="16" fill="none" stroke="#f43f5e" stroke-width="2" />
      <!-- Inner hole (water visible) -->
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="#0284c7" />
      <!-- Stripes on floatie -->
      <path d="M -15,-6 Q -10,-12 0,-14 Q 10,-12 15,-6" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Beach Ball Floating -->
    <g transform="translate(85, 170)">
      <circle cx="0" cy="0" r="11" fill="#f8fafc" />
      <!-- Color segments -->
      <path d="M 0,-11 A 11 11 0 0 1 9,6 L 0,0 Z" fill="#ef4444" />
      <path d="M 9,6 A 11 11 0 0 1 -9,6 L 0,0 Z" fill="#3b82f6" />
      <path d="M -9,6 A 11 11 0 0 1 0,-11 L 0,0 Z" fill="#eab308" />
      <circle cx="0" cy="0" r="11" fill="none" stroke="#0f172a" stroke-width="1" />
    </g>
  </g>

  <!-- Refreshing Drink with Straw & Umbrella (Foreground Prop) -->
  <g transform="translate(50, 135)">
    <!-- Glass Drop Shadow -->
    <ellipse cx="12" cy="38" rx="14" ry="4" fill="#0f172a" opacity="0.4" />
    <!-- Glass Body -->
    <path d="M 2,5 L 22,5 L 19,38 C 19,40 17,41 15,41 L 9,41 C 7,41 5,40 5,38 Z" fill="#e2e8f0" opacity="0.25" stroke="#f8fafc" stroke-width="1.5" />
    <!-- Liquid (Juice) -->
    <path d="M 4,15 L 20,15 L 18,37 C 18,39 17,39 15,39 L 9,39 C 7,39 6,39 6,37 Z" fill="#fb923c" />
    <!-- Ice Cubes -->
    <rect x="7" y="18" width="7" height="7" rx="1" fill="#bae6fd" opacity="0.8" transform="rotate(15 10.5 21.5)" />
    <rect x="12" y="25" width="6" height="6" rx="1" fill="#bae6fd" opacity="0.8" transform="rotate(-10 15 28)" />
    <!-- Slice of Orange on Rim -->
    <path d="M 19,8 C 26,4 28,12 24,15 C 22,16 20,13 19,11 Z" fill="#f97316" stroke="#ea580c" stroke-width="1" />
    <path d="M 20,9 C 24,6 25,11 22,13" fill="none" stroke="#fef08a" stroke-width="1" />
    <!-- Straw -->
    <path d="M 8,5 L 2,-12 C 1,-15 4,-17 7,-16 L 14,-14" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
    <!-- Mini Umbrella -->
    <path d="M 16,12 L 26,-5" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 18,-3 Q 26,-10 32,-3 Q 26,-5 18,-3 Z" fill="#ef4444" />
    <path d="M 22,-5 Q 26,-8 30,-5" fill="none" stroke="#f8fafc" stroke-width="1" />
  </g>

  <!-- Hibiscus Flower Accent (Bottom Right) -->
  <g transform="translate(190, 160)">
    <!-- Petals -->
    <path d="M 0,0 C -15,-15 -25,0 -15,15 C -5,25 0,10 0,0 Z" fill="#f43f5e" />
    <path d="M 0,0 C 0,-20 15,-25 20,-10 C 25,5 10,10 0,0 Z" fill="#fb7185" />
    <path d="M 0,0 C 15,-5 25,10 10,20 C -5,25 -5,10 0,0 Z" fill="#f43f5e" />
    <path d="M 0,0 C -10,15 -25,10 -20,-5 C -15,-20 0,-10 0,0 Z" fill="#fb7185" />
    <!-- Center Stamen -->
    <circle cx="0" cy="0" r="4" fill="#fde047" />
    <path d="M 0,0 L 8,-12" fill="none" stroke="#fde047" stroke-width="1.5" />
    <circle cx="9" cy="-14" r="1.5" fill="#ea580c" />
    <circle cx="6" cy="-13" r="1.5" fill="#ea580c" />
  </g>

  <!-- Sparkles / Summer Heat Shimmer Highlights -->
  <g fill="#fef08a">
    <path d="M 70,50 L 72,55 L 77,57 L 72,59 L 70,64 L 68,59 L 63,57 L 68,55 Z" opacity="0.9" />
    <path d="M 170,90 L 171,93 L 174,94 L 171,95 L 170,98 L 169,95 L 166,94 L 169,93 Z" opacity="0.7" />
    <path d="M 110,35 L 111,38 L 114,39 L 111,40 L 110,43 L 109,40 L 106,39 L 109,38 Z" opacity="0.8" />
  </g>
</svg>