<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Gentle Atmosphere -->
    <radialGradient id="warmGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Lamp Light -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Gentle Soundwave / Tone Wave Gradients -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Clip Paths for Room Atmosphere -->
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <!-- Container -->
  <g clip-path="url(#canvasClip)">
    <rect width="240" height="240" fill="url(#bgGrad)" />
    <rect width="240" height="240" fill="url(#warmGlow)" />

    <!-- Cozy Room Interior & Wallpaper Accents -->
    <!-- Window with Night Scene -->
    <g transform="translate(170, 25)">
      <rect x="0" y="0" width="45" height="70" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
      <!-- Window Panes & Moon -->
      <line x1="22.5" y1="0" x2="22.5" y2="70" stroke="#334155" stroke-width="2"/>
      <line x1="0" y1="35" x2="45" y2="35" stroke="#334155" stroke-width="2"/>
      <circle cx="32" cy="15" r="5" fill="#fde047" opacity="0.8"/>
      <!-- Tiny stars outside -->
      <circle cx="10" cy="20" r="1" fill="#ffffff" opacity="0.6"/>
      <circle cx="15" cy="50" r="0.8" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- Bookshelf in Background -->
    <g transform="translate(25, 30)">
      <rect x="0" y="0" width="40" height="90" fill="#1e293b" opacity="0.6"/>
      <line x1="0" y1="30" x2="40" y2="30" stroke="#334155" stroke-width="2"/>
      <line x1="0" y1="60" x2="40" y2="60" stroke="#334155" stroke-width="2"/>
      <!-- Books -->
      <rect x="5" y="12" width="6" height="18" rx="1" fill="#64748b"/>
      <rect x="13" y="10" width="8" height="20" rx="1" fill="#38bdf8"/>
      <rect x="23" y="15" width="5" height="15" rx="1" fill="#f43f5e"/>
      <rect x="6" y="42" width="7" height="18" rx="1" fill="#10b981"/>
      <rect x="15" y="38" width="6" height="22" rx="1" fill="#fbbf24"/>
    </g>

    <!-- House Plant for warmth & life -->
    <g transform="translate(15, 140)">
      <path d="M10 35 L20 35 L17 60 L13 60 Z" fill="#475569" />
      <path d="M15 35 Q5 20 2 10 Q15 20 15 35 Z" fill="#10b981" />
      <path d="M15 35 Q25 15 32 5 Q20 20 15 35 Z" fill="#059669" />
      <path d="M15 35 Q12 10 10 2 Q15 20 15 35 Z" fill="#34d399" />
    </g>

    <!-- Warm Table / Desk Surface -->
    <rect x="0" y="195" width="240" height="45" fill="#0f172a" />
    <path d="M0 195 L240 195" stroke="#334155" stroke-width="3" />

    <!-- Cozy Desk Lamp -->
    <g transform="translate(195, 135)">
      <ellipse cx="12" cy="60" rx="14" ry="4" fill="#334155" />
      <path d="M12 60 L12 30" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
      <path d="M12 30 Q12 10 25 15" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" />
      <!-- Lampshade -->
      <path d="M12 12 L2 25 L32 25 Z" fill="#fbbf24" />
      <ellipse cx="17" cy="25" rx="15" ry="5" fill="url(#lampGlow)" />
    </g>

    <!-- Teacup on Desk -->
    <g transform="translate(160, 175)">
      <path d="M4 8 C4 16 16 16 16 8 Z" fill="#f8fafc" />
      <ellipse cx="10" cy="8" rx="6" ry="2" fill="#cbd5e1" />
      <ellipse cx="10" cy="9" rx="5" ry="1.5" fill="#94a3b8" />
      <path d="M16 9 C19 9 19 13 16 14" stroke="#f8fafc" stroke-width="1.5" fill="none" />
      <!-- Steam -->
      <path d="M8 4 Q10 0 8 -4" stroke="#f8fafc" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
      <path d="M12 3 Q14 -1 12 -5" stroke="#f8fafc" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    </g>

    <!-- MAIN CHARACTER: The speaker (Kind, gentle man talking warmly) -->
    <g transform="translate(75, 75)">
      <!-- Body & Torso -->
      <path d="M45 80 L75 125 L15 125 Z" fill="#334155" />
      <path d="M30 75 Q45 70 60 75 L75 125 L15 125 Z" fill="#1e293b" />
      <!-- Cozy Sweater / Collar -->
      <path d="M35 75 Q45 85 55 75 L50 70 Q45 73 40 70 Z" fill="#f8fafc" />
      <path d="M30 75 L45 95 L60 75" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

      <!-- Neck -->
      <rect x="40" y="62" width="10" height="15" fill="#fbcfe8" rx="3" />

      <!-- Head -->
      <circle cx="45" cy="45" r="22" fill="#fbcfe8" />

      <!-- Hair (Soft, neat brown hair) -->
      <path d="M25 45 Q25 25 45 23 Q65 25 67 45 Q65 33 45 30 Q25 33 25 45 Z" fill="#334155" />

      <!-- Gentle Facial Expression -->
      <!-- Eyebrows (relaxed, soft arch) -->
      <path d="M33 38 Q37 36 41 38" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <path d="M49 38 Q53 36 57 38" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round" />

      <!-- Closed Happy/Gentle Eyes (Arc shapes showing warm smile/tone) -->
      <path d="M34 43 Q37 46 40 43" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M50 43 Q53 46 56 43" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />

      <!-- Soft Rosy Cheeks -->
      <circle cx="34" cy="48" r="4" fill="#fda4af" opacity="0.6" />
      <circle cx="56" cy="48" r="4" fill="#fda4af" opacity="0.6" />

      <!-- Gentle Warm Smile -->
      <path d="M40 54 Q45 58 50 54" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />

      <!-- Expressive Hands (One hand open gesturing warmly) -->
      <g transform="translate(62, 95)">
        <path d="M0 0 Q10 -5 15 5 Q18 10 12 15 Z" fill="#fbcfe8" />
        <path d="M12 5 Q16 8 13 12" stroke="#db2777" stroke-width="1" fill="none" />
      </g>
    </g>

    <!-- VISUALIZING "TONE/VOICE" (语气 - Yǔqì) -->
    <!-- Gentle, flowing, harmonious sound waves emanating from the speaker, 
         styled softly like glowing pastel ribbons to visually represent "gentle tone/speech" -->
    <g transform="translate(135, 110)">
      <!-- Wave 1 (Inner, soft warm golden/cyan pulse) -->
      <path d="M 0 0 Q 15 -15 30 -5 T 60 -10" fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" />
      
      <!-- Wave 2 (Middle, gentle sweeping curve upward) -->
      <path d="M -10 15 Q 15 -5 40 10 T 80 0" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />

      <!-- Wave 3 (Outer, peaceful flowing arc) -->
      <path d="M -5 30 Q 25 10 55 25 T 90 10" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

      <!-- Floating gentle music/speech notes or sparkles representing pleasant conversation -->
      <path d="M25 -15 Q28 -22 35 -20 Q42 -18 39 -10" fill="#38bdf8" opacity="0.8" />
      <circle cx="35" cy="-21" r="2.5" fill="#38bdf8" opacity="0.8" />

      <path d="M55 5 Q58 -2 65 0 Q72 2 69 10" fill="#fbbf24" opacity="0.7" />
      <circle cx="65" cy="-1" r="2" fill="#fbbf24" opacity="0.7" />

      <circle cx="15" cy="-25" r="1.5" fill="#f43f5e" opacity="0.6" />
      <circle cx="75" cy="20" r="2" fill="#38bdf8" opacity="0.6" />
      <circle cx="45" cy="35" r="1.5" fill="#fbbf24" opacity="0.8" />
    </g>

    <!-- Ambient Lighting Highlights on Top Frame -->
    <path d="M0 0 L240 0" stroke="#38bdf8" stroke-width="4" opacity="0.3" />
  </g>
</svg>