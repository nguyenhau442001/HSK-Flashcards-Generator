<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Clothing Gradient (Borrower returning money) -->
    <linearGradient id="shirtGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Clothing Gradient (Friend receiving money) -->
    <linearGradient id="shirtGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Cash/Wallet Gradient -->
    <linearGradient id="moneyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- Environmental Context (Room Interior) -->
  <!-- Window / Night City View in Background -->
  <g opacity="0.6">
    <rect x="140" y="30" width="70" height="80" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <line x1="175" y1="30" x2="175" y2="110" stroke="#334155" stroke-width="2"/>
    <line x1="140" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="2"/>
    <!-- City lights outside -->
    <rect x="148" y="45" width="8" height="12" rx="2" fill="#fbbf24" opacity="0.7"/>
    <rect x="160" y="85" width="10" height="18" rx="2" fill="#38bdf8" opacity="0.5"/>
    <rect x="185" y="50" width="12" height="15" rx="2" fill="#f43f5e" opacity="0.6"/>
    <rect x="190" y="80" width="8" height="22" rx="2" fill="#fbbf24" opacity="0.4"/>
  </g>

  <!-- House Plant on Bookshelf -->
  <g transform="translate(25, 65)">
    <path d="M10 35 C10 20, 30 20, 30 35 Z" fill="#475569" />
    <path d="M20 20 C10 10, 0 15, 5 5 C15 5, 20 12, 20 20 Z" fill="#10b981" />
    <path d="M20 20 C30 8, 40 12, 35 3 C25 2, 20 10, 20 20 Z" fill="#059669" />
    <path d="M20 20 C20 5, 25 0, 20 -5 C15 0, 20 10, 20 20 Z" fill="#34d399" />
  </g>

  <!-- Wooden Table/Desk Surface -->
  <path d="M 0 185 L 240 185 L 240 220 L 0 220 Z" fill="#334155" />
  <path d="M 0 180 L 240 180 L 240 185 L 0 185 Z" fill="#475569" />
  <path d="M 15 180 L 225 180 L 220 240 L 20 240 Z" fill="#1e293b" opacity="0.3" /> <!-- Table shadow overlay -->

  <!-- Desk Props (Coffee Mug & Calendar) -->
  <g transform="translate(180, 155)">
    <!-- Mug -->
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#cbd5e1" />
    <path d="M 16 10 C 22 10, 22 20, 16 20" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 5 0 Q 7 -5, 5 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Character 1 (Left: Friend returning money - Active Giver) -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <!-- Body/Torso -->
    <path d="M 30 50 C 30 35, 45 30, 60 40 L 75 85 L 25 85 Z" fill="url(#shirtGrad1)" />
    <!-- Head & Hair -->
    <circle cx="52" cy="18" r="14" fill="#fbcfe8" /> <!-- Skin tone -->
    <path d="M 38 15 C 38 5, 66 5, 66 18 C 66 22, 60 20, 52 22 C 44 20, 38 22, 38 15 Z" fill="#1e293b" /> <!-- Hair -->
    <!-- Facial Expression (Friendly, honest smile) -->
    <circle cx="47" cy="17" r="1.5" fill="#334155" />
    <circle cx="57" cy="17" r="1.5" fill="#334155" />
    <path d="M 50 23 Q 52 26, 54 23" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Arm reaching out to return money -->
    <path d="M 55 45 Q 75 55, 90 50" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="93" cy="50" r="5" fill="#fbcfe8" />
  </g>

  <!-- Character 2 (Right: Friend receiving money back - Surprised/Happy) -->
  <g transform="translate(130, 90)" filter="url(#shadow)">
    <!-- Body/Torso -->
    <path d="M 50 55 C 50 40, 35 35, 20 45 L 5 90 L 65 90 Z" fill="url(#shirtGrad2)" />
    <!-- Head & Hair -->
    <circle cx="28" cy="22" r="14" fill="#fbcfe8" />
    <path d="M 14 20 C 14 8, 42 8, 42 22 C 35 25, 20 25, 14 20 Z" fill="#b45309" /> <!-- Brown hair -->
    <!-- Facial Expression (Delighted, eyes wide) -->
    <circle cx="23" cy="21" r="1.5" fill="#334155" />
    <circle cx="33" cy="21" r="1.5" fill="#334155" />
    <path d="M 26 27 Q 28 31, 30 27" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm receiving -->
    <path d="M 25 50 Q 10 55, 3 52" fill="none" stroke="#e11d48" stroke-width="10" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="1" cy="52" r="5" fill="#fbcfe8" />
  </g>

  <!-- The Money Being Returned (Central Focus) -->
  <g transform="translate(118, 137)" filter="url(#shadow)">
    <!-- Stack of cash / Envelope -->
    <rect x="-8" y="-5" width="28" height="16" rx="3" fill="url(#moneyGrad)" transform="rotate(-10 6 3)" />
    <rect x="-5" y="-3" width="22" height="12" rx="2" fill="#6ee7b7" transform="rotate(-10 6 3)" opacity="0.8" />
    <!-- Dollar/Currency symbol mark -->
    <circle cx="6" cy="3" r="3" fill="#047857" transform="rotate(-10 6 3)" />
  </g>

  <!-- Sparkles / Action Emphasis (Highlighting the "Returning/Repaying" moment) -->
  <g transform="translate(125, 120)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(100, 155) scale(0.6)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#38bdf8" />
  </g>
</svg>