<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Shield Glow & Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Warm Light Gradient -->
    <radialGradient id="artifactLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Pyramid Gradient -->
    <linearGradient id="pyramidGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="pyramidGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle Museum/Archive Environment Elements -->
  <!-- Ambient Back Light -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.05" />

  <!-- Display Pedestal -->
  <path d="M 70 180 L 170 180 L 185 210 L 55 210 Z" fill="#334155" />
  <path d="M 65 174 L 175 174 L 170 180 L 70 180 Z" fill="#475569" />
  <rect x="85" y="190" width="70" height="12" rx="2" fill="#1e293b" opacity="0.6" />

  <!-- Ancient Artifacts representing Human Civilization (Statue head, Scroll, Pyramid) -->
  <!-- Greek-style Column Fragment -->
  <g transform="translate(65, 130)">
    <rect x="0" y="0" width="16" height="44" fill="#94a3b8" rx="1" />
    <line x1="4" y1="0" x2="4" y2="44" stroke="#64748b" stroke-width="2" />
    <line x1="8" y1="0" x2="8" y2="44" stroke="#64748b" stroke-width="2" />
    <line x1="12" y1="0" x2="12" y2="44" stroke="#64748b" stroke-width="2" />
    <rect x="-2" y="-3" width="20" height="4" fill="#cbd5e1" rx="1" />
  </g>

  <!-- Mini Ancient Pyramid -->
  <g transform="translate(145, 140)">
    <polygon points="17,0 0,34 34,34" fill="url(#pyramidGrad1)" />
    <polygon points="17,0 34,34 20,34" fill="url(#pyramidGrad2)" />
    <line x1="17" y1="0" x2="20" y2="34" stroke="#9a3412" stroke-width="0.7" opacity="0.5" />
  </g>

  <!-- Glowing Artifact Core (Centerpiece of Civilization) -->
  <circle cx="120" cy="130" r="22" fill="url(#artifactLight)" filter="url(#glow)" />
  <circle cx="120" cy="130" r="10" fill="#fef08a" />

  <!-- Protective Energy Dome / Shield (Visualizing "Protecting Civilization") -->
  <circle cx="120" cy="125" r="58" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4" />
  <path d="M 65 125 A 55 55 0 0 1 175 125" fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Character 1: Young Archaeologist / Curator (Left) -->
  <g transform="translate(35, 100)">
    <!-- Body & Lab Coat -->
    <path d="M 20 40 L 38 40 L 45 80 L 15 80 Z" fill="#e2e8f0" />
    <path d="M 27 40 L 31 80" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Head & Hair -->
    <circle cx="29" cy="22" r="12" fill="#fcd34d" />
    <path d="M 17 20 C 17 12, 41 12, 41 20 C 41 24, 38 27, 35 25 C 32 23, 26 23, 23 25 C 20 27, 17 24, 17 20 Z" fill="#334155" />
    
    <!-- Face Expression (Determined/Caring) -->
    <circle cx="33" cy="22" r="1.5" fill="#1e293b" />
    <path d="M 31 27 Q 34 29 37 27" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms reaching out to protect/inspect -->
    <path d="M 35 45 Q 50 50 55 40" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="56" cy="38" r="3.5" fill="#fcd34d" />
  </g>

  <!-- Character 2: Young Explorer / Guardian (Right) -->
  <g transform="translate(150, 95)">
    <!-- Body & Jacket -->
    <path d="M 20 45 L 38 45 L 43 85 L 15 85 Z" fill="#0284c7" />
    <path d="M 29 45 L 29 85" stroke="#0369a1" stroke-width="1.5" />
    
    <!-- Head & Hair -->
    <circle cx="27" cy="23" r="12" fill="#fcd34d" />
    <!-- Cap -->
    <path d="M 14 20 C 14 14, 40 14, 40 20 Z" fill="#0369a1" />
    <path d="M 35 19 L 45 21 L 35 23 Z" fill="#0284c7" />

    <!-- Face Expression -->
    <circle cx="23" cy="23" r="1.5" fill="#1e293b" />
    <path d="M 20 28 Q 23 30 26 28" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms -->
    <path d="M 25 50 Q 5 50 8 38" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="7" cy="36" r="3.5" fill="#fcd34d" />
  </g>

  <!-- Floating Sparkles / Magic of Knowledge & Culture -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="95" cy="85" r="2" />
    <circle cx="145" cy="95" r="1.5" />
    <circle cx="110" cy="65" r="2.5" />
    <path d="M 135 75 L 137 79 L 141 81 L 137 83 L 135 87 L 133 83 L 129 81 L 133 79 Z" fill="#fef08a" opacity="0.9" />
    <path d="M 95 140 L 96 142 L 98 143 L 96 144 L 95 146 L 94 144 L 92 143 L 94 142 Z" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Foreground Atmospheric Vignette / Floor shadow -->
  <ellipse cx="120" cy="215" rx="75" ry="8" fill="#090d16" opacity="0.6" />
</svg>