<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Window Light Glow -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Umbrella Surface Gradient -->
    <linearGradient id="umbrellaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Indoor Room Background / Wall -->
  <rect x="0" y="0" width="240" height="175" fill="#172033"/>
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <!-- Floor line -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- Interior Window Frame (Right side) -->
  <g transform="translate(145, 25)">
    <!-- Window Background (Night sky outside with rain) -->
    <rect x="0" y="0" width="70" height="110" rx="4" fill="#0b1329" stroke="#334155" stroke-width="3"/>
    
    <!-- Rain outside the window -->
    <line x1="15" y1="15" x2="10" y2="35" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="35" y1="20" x2="30" y2="40" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="55" y1="10" x2="50" y2="30" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="25" y1="50" x2="20" y2="70" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="45" y1="60" x2="40" y2="80" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="85" x2="10" y2="105" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Subtle clouds outside -->
    <path d="M15 30 Q25 20 35 30 Q45 20 55 30 Z" fill="#1e293b" opacity="0.6"/>

    <!-- Window panes cross grid -->
    <line x1="35" y1="0" x2="35" y2="110" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="55" x2="70" y2="55" stroke="#334155" stroke-width="2"/>

    <!-- Light beam spilling from window -->
    <polygon points="0,55 -50,170 30,170" fill="url(#windowLight)" opacity="0.5"/>
  </g>

  <!-- Bookshelf / Prop in Background -->
  <g transform="translate(20, 40)">
    <rect x="0" y="0" width="40" height="90" fill="#111827" rx="2"/>
    <line x1="0" y1="30" x2="40" y2="30" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="60" x2="40" y2="60" stroke="#334155" stroke-width="2"/>
    <!-- Books -->
    <rect x="5" y="10" width="8" height="20" rx="1" fill="#f43f5e"/>
    <rect x="15" y="12" width="6" height="18" rx="1" fill="#38bdf8"/>
    <rect x="24" y="8" width="10" height="22" rx="1" fill="#fbbf24"/>
    <rect x="8" y="38" width="7" height="22" rx="1" fill="#10b981"/>
    <rect x="18" y="42" width="9" height="18" rx="1" fill="#a855f7"/>
  </g>

  <!-- Desk & Weather Forecast Tablet/Screen -->
  <g transform="translate(30, 115)">
    <!-- Desk Surface -->
    <path d="M-10 55 L120 55 L110 85 L-20 85 Z" fill="#334155"/>
    <path d="M-10 50 L120 50 L120 55 L-10 55 Z" fill="#475569"/>

    <!-- Desk Lamp -->
    <circle cx="90" cy="20" r="25" fill="url(#lampGlow)"/>
    <path d="M85 55 L90 25 L95 55 Z" fill="#64748b"/>
    <path d="M75 15 Q90 0 105 15 Z" fill="#cbd5e1"/>
    <circle cx="90" cy="15" r="4" fill="#fbbf24"/>

    <!-- Tablet / Weather Forecast Display (The core "根据" visual anchor) -->
    <g transform="translate(15, 10)">
      <!-- Tablet Stand -->
      <polygon points="25,45 35,45 40,52 20,52" fill="#64748b"/>
      <!-- Tablet Body -->
      <rect x="0" y="0" width="55" height="45" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Weather App UI Inside Screen: Cloud & Rain icon -->
      <path d="M16 18 C13 18 11 20 11 23 C11 25 13 27 16 27 L38 27 C41 27 43 25 43 23 C43 20 41 18 38 18 C37 13 32 10 27 12 C23 10 18 13 16 18 Z" fill="#94a3b8"/>
      
      <!-- Raindrops icon on screen -->
      <line x1="20" y1="31" x2="18" y2="36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <line x1="27" y1="31" x2="25" y2="36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <line x1="34" y1="31" x2="32" y2="36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

      <!-- Sun fading / Transition indicator (Tomorrow indicator) -->
      <circle cx="43" cy="12" r="4" fill="#fbbf24"/>
      
      <!-- Mini analytical bar chart representing forecast data -->
      <rect x="12" y="39" width="5" height="4" rx="1" fill="#38bdf8"/>
      <rect x="20" y="37" width="5" height="6" rx="1" fill="#38bdf8"/>
      <rect x="28" y="34" width="5" height="9" rx="1" fill="#f43f5e"/>
      <rect x="36" y="38" width="5" height="5" rx="1" fill="#38bdf8"/>
    </g>

    <!-- Coffee Mug -->
    <rect x="75" y="35" width="12" height="16" rx="2" fill="#f8fafc"/>
    <path d="M87 38 C91 38 91 46 87 46" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <path d="M78 32 Q81 27 79 24" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Main Character (Planning / Preparing based on forecast) -->
  <g transform="translate(95, 80)">
    <!-- Body / Torso (Sitting posture leaning forward) -->
    <path d="M35 55 C25 55 15 65 10 85 L50 90 L55 60 Z" fill="#6366f1"/>
    
    <!-- Neck & Head -->
    <path d="M30 43 L34 56 L42 54 L38 43 Z" fill="#fca5a5"/>
    <circle cx="37" cy="30" r="14" fill="#fca5a5"/>
    
    <!-- Hair (Stylized modern neat hair) -->
    <path d="M23 28 C23 18 32 16 42 20 C48 22 51 28 50 33 C45 28 35 25 28 32 Z" fill="#334155"/>

    <!-- Face Profile / Expression (Thoughtful, looking at tablet) -->
    <!-- Glasses -->
    <circle cx="43" cy="28" r="4.5" fill="none" stroke="#334155" stroke-width="1.5"/>
    <path d="M39 28 L35 27" stroke="#334155" stroke-width="1.5"/>
    <circle cx="43" cy="28" r="2" fill="#1e293b"/>
    <!-- Gentle smile -->
    <path d="M42 37 Q45 39 48 36" fill="none" stroke="#9b2c2c" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms reaching forward toward tablet / holding umbrella -->
    <!-- Right Arm holding ready umbrella -->
    <path d="M42 60 C55 60 65 65 72 55" fill="none" stroke="#4f46e5" stroke-width="7" stroke-linecap="round"/>
    <circle cx="72" cy="53" r="4" fill="#fca5a5"/>

    <!-- Left Arm resting on desk -->
    <path d="M25 65 Q20 75 5 78" fill="none" stroke="#4f46e5" stroke-width="7" stroke-linecap="round"/>
    <circle cx="4" cy="78" r="3.5" fill="#fca5a5"/>
  </g>

  <!-- Prepared Red Umbrella resting next to character -->
  <g transform="translate(175, 100)">
    <!-- Umbrella Handle & Shaft -->
    <line x1="15" y1="20" x2="15" y2="110" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 110 C15 118 10 120 7 115" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Opened/Folded Umbrella Canopy (Placed upright ready for tomorrow's rain) -->
    <path d="M-5 25 Q15 -5 35 25 Q15 35 -5 25 Z" fill="url(#umbrellaGrad)"/>
    <path d="M-5 25 Q15 45 35 25" fill="none" stroke="#9f1239" stroke-width="2"/>
    <circle cx="15" cy="-5" r="3" fill="#fbbf24"/>
  </g>

  <!-- Ambient indoor lighting & cozy accents -->
  <circle cx="200" cy="220" r="1.5" fill="#38bdf8" opacity="0.3"/>
  <circle cx="150" cy="210" r="1" fill="#38bdf8" opacity="0.2"/>
  <circle cx="10" cy="190" r="2" fill="#38bdf8" opacity="0.2"/>
</svg>