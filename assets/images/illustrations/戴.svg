<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- App Icon Background -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>
  
  <!-- Ambient cold weather background elements (snowflakes / frost dots) -->
  <circle cx="50" cy="50" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="150" cy="60" r="3" fill="#38bdf8" opacity="0.4"/>
  <circle cx="130" cy="130" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="60" cy="140" r="2.5" fill="#38bdf8" opacity="0.7"/>

  <!-- Scarf representing cold weather context -->
  <path d="M 65 130 C 75 110, 125 110, 135 130 C 138 138, 125 142, 115 138 C 105 134, 95 134, 85 138 C 75 142, 62 138, 65 130 Z" fill="#fb923c"/>
  <path d="M 120 135 L 130 165 C 132 170, 124 174, 120 168 L 110 138 Z" fill="#ea580c"/>
  <path d="M 125 150 L 133 154" stroke="#fed7aa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 122 160 L 130 164" stroke="#fed7aa" stroke-width="2" stroke-linecap="round"/>

  <!-- Head / Neck Silhouette Base -->
  <path d="M 70 120 C 70 100, 85 95, 100 95 C 115 95, 130 100, 130 120 L 135 150 C 135 155, 65 155, 65 150 Z" fill="#334155"/>
  <path d="M 85 90 C 85 75, 115 75, 115 90 Z" fill="#cbd5e1" opacity="0.2"/>

  <!-- Main Concrete Object: Winter Hat (Đội mũ) -->
  <!-- Hat Base / Fold -->
  <path d="M 68 88 C 68 83, 132 83, 132 88 L 135 100 C 135 106, 65 106, 68 100 Z" fill="#10b981"/>
  
  <!-- Hat Main Dome -->
  <path d="M 68 88 C 65 60, 135 60, 132 88 Z" fill="#059669"/>

  <!-- Hat Stripes / Details for visual appeal -->
  <path d="M 70 80 C 85 76, 115 76, 130 80" stroke="#34d399" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Pom-Pom on top -->
  <circle cx="100" cy="52" r="12" fill="#f59e0b"/>
  <circle cx="93" cy="48" r="4" fill="#fbbf24"/>
  <circle cx="107" cy="48" r="4" fill="#fbbf24"/>
  <circle cx="100" cy="58" r="4" fill="#fbbf24"/>

  <!-- Action Motion Lines (indicating the act of wearing/putting on) -->
  <path d="M 85 35 Q 100 25 115 35" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 92 28 Q 100 22 108 28" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 58 75 Q 50 85 58 95" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 142 75 Q 150 85 142 95" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>