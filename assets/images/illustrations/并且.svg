<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for Restaurant Vibe -->
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Hot Soup Gradient -->
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#glow)" />

  <!-- Restaurant Ambient Details (Lanterns/Bokeh) -->
  <circle cx="45" cy="50" r="16" fill="#ef4444" opacity="0.2" />
  <circle cx="195" cy="40" r="12" fill="#f59e0b" opacity="0.2" />
  <circle cx="210" cy="80" r="8" fill="#ef4444" opacity="0.15" />

  <!-- Wooden Table Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#tableGrad)" />
  <line x1="0" y1="174" x2="240" y2="174" stroke="#475569" stroke-width="2" opacity="0.5" />

  <!-- PLUS / ADDITION Visual Metaphor Integration ("Hơn nữa" - accumulation of great food & value) -->
  <!-- Floating Glowing Plus Badge (Represents "Furthermore / And") -->
  <g transform="translate(120, 95)">
    <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
    <path d="M -8 0 L 8 0 M 0 -8 L 0 8" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- LEFT DISH: Delicious Steaming Noodles / Soup (Deliciousness) -->
  <g transform="translate(65, 140)">
    <!-- Bowl Shadow -->
    <ellipse cx="0" cy="30" rx="35" ry="8" fill="#000000" opacity="0.4" />
    
    <!-- Bowl Outer -->
    <path d="M -35 15 C -35 35 35 35 35 15 L 30 5 C 25 10 -25 10 -30 5 Z" fill="#38bdf8" />
    <!-- Bowl Rim -->
    <ellipse cx="0" cy="5" rx="35" ry="8" fill="#7dd3fc" />
    <!-- Soup / Noodles -->
    <ellipse cx="0" cy="8" rx="30" ry="6" fill="url(#soupGrad)" />
    <!-- Noodle swirls & toppings -->
    <path d="M -12 7 Q -5 12 2 6 T 15 9" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    <circle cx="-10" cy="6" r="4" fill="#ef4444" /> <!-- Egg/Tomato slice -->
    <circle cx="12" cy="8" r="3" fill="#10b981" /> <!-- Scallion -->

    <!-- Steam rising -->
    <path d="M -10 -2 Q -15 -15 -5 -25 T -10 -40" fill="none" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 10 -2 Q 15 -15 5 -25 T 10 -40" fill="none" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- RIGHT OBJECT: Golden Glowing Coins / Low Price Tag (Affordability/Value) -->
  <g transform="translate(175, 135)">
    <!-- Plate / Tray Shadow -->
    <ellipse cx="0" cy="35" rx="32" ry="7" fill="#000000" opacity="0.4" />
    
    <!-- Serving Plate -->
    <ellipse cx="0" cy="32" rx="34" ry="9" fill="#e2e8f0" />
    <ellipse cx="0" cy="30" rx="30" ry="7" fill="#cbd5e1" />

    <!-- Stack of Golden Coins / Treasure representation of "Cheap/Great Value" -->
    <!-- Coin 3 (Bottom) -->
    <ellipse cx="0" cy="18" rx="18" ry="7" fill="#d97706" />
    <path d="M -18 18 L -18 24 C -18 28 18 28 18 24 L 18 18 Z" fill="#b45309" />
    <ellipse cx="0" cy="24" rx="18" ry="7" fill="#d97706" />

    <!-- Coin 2 (Middle) -->
    <ellipse cx="-4" cy="5" rx="17" ry="7" fill="#f59e0b" />
    <path d="M -21 5 L -21 11 C -21 15 13 15 13 11 L 13 5 Z" fill="#d97706" />
    <ellipse cx="-4" cy="11" rx="17" ry="7" fill="#f59e0b" />

    <!-- Coin 1 (Top) -->
    <ellipse cx="2" cy="-8" rx="16" ry="6" fill="#fbbf24" />
    <path d="M -14 -8 L -14 -3 C -14 1 18 1 18 -3 L 18 -8 Z" fill="#d97706" />
    <ellipse cx="2" cy="-3" rx="16" ry="6" fill="#f59e0b" />
    <ellipse cx="2" cy="-3" rx="12" ry="4" fill="#fbbf24" />

    <!-- Sparkles around the coins for value/appeal -->
    <path d="M 22 -20 L 22 -12 M 18 -16 L 26 -16" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <circle cx="-22" cy="-5" r="2" fill="#fbbf24" />
  </g>

  <!-- Action/Connection Sparks (Connecting left and right to emphasize "and furthermore") -->
  <path d="M 95 120 Q 120 105 145 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  
  <!-- Star accents representing high quality and satisfaction -->
  <path d="M 40 90 L 42 96 L 48 98 L 42 100 L 40 106 L 38 100 L 32 98 L 38 96 Z" fill="#fbbf24" />
  <path d="M 200 95 L 201 99 L 205 100 L 201 101 L 200 105 L 199 101 L 195 100 L 199 99 Z" fill="#fbbf24" />
</svg>