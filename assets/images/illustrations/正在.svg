<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="150" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Bowl of Rice -->
  <path d="M70 150 Q70 180 100 180 Q130 180 130 150 Z" fill="#f8fafc"/>
  <path d="M75 155 Q100 170 125 155" fill="#e2e8f0"/>
  
  <!-- Chopsticks in motion -->
  <rect x="85" y="110" width="4" height="50" rx="2" fill="#fbbf24" transform="rotate(-15 87 135)"/>
  <rect x="105" y="115" width="4" height="50" rx="2" fill="#fbbf24" transform="rotate(10 107 140)"/>
  
  <!-- Steam/Action lines -->
  <path d="M90 140 Q80 120 90 100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M110 140 Q120 120 110 100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Character Arm/Sleeve -->
  <path d="M40 180 L80 140 L100 160 L60 200 Z" fill="#ec4899"/>
  <circle cx="40" cy="200" r="15" fill="#fde68a"/>
  
  <!-- Side Dish -->
  <circle cx="170" cy="165" r="20" fill="#10b981"/>
  <circle cx="170" cy="165" r="10" fill="#065f46"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="120" r="80" fill="#fb923c" opacity="0.05"/>
</svg>