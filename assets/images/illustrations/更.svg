<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Background Gradient & Environment -->
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Room Wall -->
  <rect x="0" y="0" width="240" height="240" fill="url(#nightSky)"/>
  
  <!-- Window Frame showing cold snowy night outside -->
  <g transform="translate(145, 25)">
    <rect x="0" y="0" width="70" height="95" rx="6" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <!-- Window glass glow -->
    <rect x="4" y="4" width="62" height="87" fill="url(#windowGlow)"/>
    <!-- Window Panes -->
    <line x1="35" y1="4" x2="35" y2="91" stroke="#334155" stroke-width="2"/>
    <line x1="4" y1="48" x2="66" y2="48" stroke="#334155" stroke-width="2"/>
    <!-- Snowflakes outside window -->
    <circle cx="15" cy="20" r="1.5" fill="#bae6fd"/>
    <circle cx="50" cy="35" r="2" fill="#bae6fd"/>
    <circle cx="25" cy="70" r="1.5" fill="#bae6fd"/>
    <circle cx="55" cy="75" r="2" fill="#bae6fd"/>
    <!-- Frost on window bottom -->
    <path d="M4 80 Q 20 85, 35 80 T 66 82 L 66 91 L 4 91 Z" fill="#e0f2fe" opacity="0.4"/>
  </g>

  <!-- Indoor Elements: Bookshelf / Warm Lamp in background -->
  <circle cx="45" cy="50" r="18" fill="#fbbf24" opacity="0.15" filter="url(#glow)"/>
  <path d="M45 32 L45 55 M38 40 L52 40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <rect x="25" y="140" width="90" height="80" rx="4" fill="#334155" opacity="0.3"/> <!-- Sofa/Seat back -->

  <!-- COMPARISON VISUAL PROP: Weather App / Thermometer showing drop in temperature -->
  <g transform="translate(25, 35)">
    <!-- Phone / Device Body -->
    <rect x="0" y="0" width="50" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="6" y="8" width="38" height="50" rx="4" fill="#0f172a"/>
    <!-- Yesterday indicator (Higher up / Warmer) -->
    <circle cx="16" cy="22" r="4" fill="#fb923c" opacity="0.6"/>
    <text x="26" y="25" font-size="10" fill="#94a3b8" font-family="sans-serif" font-weight="bold">昨天</text> <!-- Wait, no text rule! Remove text elements immediately -->
    <!-- Graphical comparison bars inside phone -->
    <rect x="12" y="18" width="10" height="25" rx="3" fill="#fb923c" opacity="0.4"/>
    <!-- Today indicator (Lower down / Colder, glowing blue) -->
    <rect x="28" y="28" width="10" height="35" rx="3" fill="#38bdf8" filter="url(#glow)"/>
    <!-- Trend arrow pointing down -->
    <path d="M21 38 L25 44 L29 38" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- MAIN CHARACTER: Cold Person bundled up -->
  <g transform="translate(90, 85)">
    <!-- Character Body / Blue Winter Coat -->
    <path d="M25 65 C 15 65, 5 80, 0 115 L 75 115 C 70 80, 60 65, 50 65 Z" fill="url(#coatGrad)"/>
    
    <!-- Shoulders / Coat Collar -->
    <path d="M15 60 L 37 78 L 60 60 L 52 50 L 23 50 Z" fill="#2563eb"/>

    <!-- Shivering Lines / Motion / Cold Aura -->
    <path d="M-10 70 C -15 75, -15 85, -10 90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M85 70 C 90 75, 90 85, 85 90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Head & Face (Tense expression, eyes closed tight due to cold) -->
    <circle cx="37" cy="35" r="18" fill="#fcd34d"/>
    <!-- Rosy cold cheeks -->
    <circle cx="26" cy="40" r="4" fill="#f43f5e" opacity="0.6"/>
    <circle cx="48" cy="40" r="4" fill="#f43f5e" opacity="0.6"/>

    <!-- Eyes (Tight squints showing shivering/cold) -->
    <path d="M28 33 Q 32 30, 35 34" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M39 34 Q 42 30, 46 33" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Mouth (Chattering / shivering wave) -->
    <path d="M33 46 Q 37 43, 41 46" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Cozy Winter Hat (Beanie) -->
    <path d="M19 32 C 19 15, 55 15, 55 32 Z" fill="#f43f5e"/>
    <ellipse cx="37" cy="15" rx="8" ry="6" fill="#fb7185"/>
    <circle cx="37" cy="8" r="5" fill="#ffffff"/>

    <!-- Thick Wrapped Scarf (Red/Pink gradient) -->
    <path d="M20 48 C 25 58, 50 58, 55 48 C 55 48, 50 54, 37 54 C 23 54, 20 48, 20 48 Z" fill="url(#scarfGrad)" stroke="#be123c" stroke-width="1.5"/>
    <!-- Scarf hanging ends -->
    <path d="M45 52 L 52 85 L 40 85 L 36 54 Z" fill="url(#scarfGrad)"/>

    <!-- Steam / Breath from cold air -->
    <g transform="translate(42, 45)" opacity="0.8">
      <path d="M0 0 Q 8 -10, 5 -20 T 15 -35" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="5" cy="-20" r="3" fill="#ffffff" opacity="0.6"/>
      <circle cx="12" cy="-30" r="4" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- Foreground Floor / Surface -->
  <rect x="0" y="210" width="240" height="30" fill="#090d16"/>
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2"/>

  <!-- Hot Mug of Tea/Coffee for contrast (emphasizing the cold environment) -->
  <g transform="translate(185, 175)">
    <!-- Mug Body -->
    <rect x="0" y="10" width="20" height="25" rx="3" fill="#ffffff"/>
    <!-- Handle -->
    <path d="M20 15 C 26 15, 26 30, 20 30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Hot Steam rising -->
    <path d="M6 5 Q 10 -2, 6 -8 T 10 -18" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M14 8 Q 18 2, 14 -4 T 16 -14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

</svg>