<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Interior Lighting / Warm Room Gradient -->
  <defs>
    <radialGradient id="roomGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="240" height="240" fill="url(#roomGlow)"/>
  
  <!-- Background Interior Details (Traditional & Cozy Home) -->
  <!-- Wooden floor / Wall separation -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#1e293b" stroke-width="4"/>
  <rect x="0" y="180" width="240" height="60" fill="#090d16"/>
  
  <!-- Window with warm soft light -->
  <rect x="25" y="45" width="50" height="80" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="50" width="18" height="34" rx="2" fill="#38bdf8" fill-opacity="0.2"/>
  <rect x="52" y="50" width="18" height="34" rx="2" fill="#38bdf8" fill-opacity="0.2"/>
  <rect x="30" y="88" width="18" height="32" rx="2" fill="#38bdf8" fill-opacity="0.2"/>
  <rect x="52" y="88" width="18" height="32" rx="2" fill="#38bdf8" fill-opacity="0.2"/>
  
  <!-- Wall Decoration (Hanging Scroll / Painting) -->
  <rect x="160" y="40" width="45" height="65" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="182" cy="72" r="14" fill="#f59e0b" fill-opacity="0.2"/>
  <path d="M170 85 Q182 70 194 85" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Houseplant for cozy atmosphere -->
  <path d="M210 180 L215 140 L225 140 L230 180 Z" fill="#475569" rx="2"/>
  <path d="M220 140 C210 120 195 110 190 100 C205 115 215 130 220 140 Z" fill="#10b981"/>
  <path d="M220 140 C230 115 240 105 245 95 C235 115 225 130 220 140 Z" fill="#34d399"/>
  <path d="M220 140 C220 110 210 95 215 85 C215 110 218 130 220 140 Z" fill="#059669"/>

  <!-- Furniture: Traditional Tea Table & Teapot -->
  <!-- Table Top -->
  <path d="M90 145 L170 145 L180 160 L80 160 Z" fill="#334155"/>
  <rect x="85" y="160" width="90" height="8" rx="2" fill="#475569"/>
  <!-- Table Legs -->
  <rect x="95" y="168" width="8" height="25" fill="#1e293b"/>
  <rect x="157" y="168" width="8" height="25" fill="#1e293b"/>
  
  <!-- Teapot & Cups on Table -->
  <circle cx="130" cy="142" r="8" fill="#f8fafc"/>
  <path d="M122 142 C122 136 138 136 138 142 Z" fill="#e2e8f0"/>
  <path d="M138 140 L143 138" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="112" cy="144" r="4" fill="#f8fafc"/>
  <circle cx="148" cy="144" r="4" fill="#f8fafc"/>

  <!-- CHARACTER 1: Grandfather (长辈 - Senior/Elder) sitting on a chair -->
  <!-- Wooden Chair Back -->
  <rect x="135" y="90" width="30" height="75" rx="4" fill="#1e293b"/>
  <rect x="142" y="98" width="16" height="50" rx="2" fill="#334155"/>

  <!-- Grandfather's Body & Outfit -->
  <!-- Legs -->
  <rect x="140" y="150" width="10" height="35" rx="3" fill="#3b82f6"/>
  <rect x="155" y="150" width="10" height="35" rx="3" fill="#3b82f6"/>
  <ellipse cx="145" cy="185" rx="6" ry="3" fill="#0f172a"/>
  <ellipse cx="160" cy="185" rx="6" ry="3" fill="#0f172a"/>

  <!-- Torso (Cardigan / Traditional tunic) -->
  <path d="M133 115 L167 115 L172 155 L128 155 Z" fill="#1e40af"/>
  <path d="M150 115 L150 155" stroke="#1e3a8a" stroke-width="2"/>
  <!-- Soft warm collar / shirt inside -->
  <path d="M142 115 L150 125 L158 115" fill="#f8fafc"/>

  <!-- Grandfather's Head & Face -->
  <circle cx="150" cy="92" r="15" fill="#fcd34d"/>
  <!-- Friendly smiling eyes (closed in warm expression) -->
  <path d="M143 90 Q146 93 149 90" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M151 90 Q154 93 157 90" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Gentle smile & friendly wrinkles -->
  <path d="M146 98 Q150 101 154 98" stroke="#d97706" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- White/Grey Hair & Gentle Beard -->
  <path d="M135 92 C135 80 145 77 150 77 C155 77 165 80 165 92 C165 95 163 92 163 88 C163 82 157 80 150 80 C143 80 137 82 137 88 C137 92 135 95 135 92 Z" fill="#94a3b8"/>
  <path d="M144 100 Q150 106 156 100 Q152 103 150 103 Q148 103 144 100 Z" fill="#cbd5e1"/>

  <!-- Grandfather's Arms in welcoming gesture -->
  <path d="M135 125 Q125 135 128 145" stroke="#1e40af" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="127" cy="146" r="5" fill="#fcd34d"/>


  <!-- CHARACTER 2: Young Person (Junior showing respect with a bow / gesture) -->
  <!-- Torso leaning forward in a respectful bow -->
  <path d="M75 140 C85 130 100 125 115 135 L110 165 L80 165 Z" fill="#ec4899"/>
  
  <!-- Junior's Legs -->
  <rect x="75" y="160" width="9" height="28" rx="3" fill="#0f172a"/>
  <rect x="90" y="160" width="9" height="28" rx="3" fill="#0f172a"/>
  <ellipse cx="79" cy="188" rx="6" ry="3" fill="#334155"/>
  <ellipse cx="94" cy="188" rx="6" ry="3" fill="#334155"/>

  <!-- Junior's Head bowing respectfully towards Grandfather -->
  <circle cx="100" cy="120" r="13" fill="#fcd34d"/>
  
  <!-- Respectful polite expression / closed polite eyes -->
  <path d="M95 118 Q97 120 99 118" stroke="#831843" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M101 118 Q103 120 105 118" stroke="#831843" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Polite smile -->
  <path d="M98 124 Q100 126 102 124" stroke="#be185d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Stylish modern hair -->
  <path d="M88 118 C88 108 96 106 103 106 C110 106 113 112 113 118 C110 113 105 110 99 111 C93 112 90 115 88 118 Z" fill="#1e293b"/>

  <!-- Junior's Arms outstretched in a respectful greeting / serving gesture -->
  <path d="M105 133 Q118 135 125 139" stroke="#db2777" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Hands together politely -->
  <circle cx="127" cy="140" r="5" fill="#fcd34d"/>


  <!-- Warm glowing highlights representing respect, warmth, harmony -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="115" cy="100" r="2"/>
    <circle cx="125" cy="85" r="3"/>
    <circle cx="138" cy="70" r="1.5"/>
  </g>
  
  <!-- Vignette / Frame Border overlay for polished vector look -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>