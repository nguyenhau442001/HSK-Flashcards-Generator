<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Forest Ground -->
  <path d="M0 180 C 80 160, 160 160, 240 180 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Character: Hiker -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 35 L 30 35 L 25 80 L 15 80 Z" fill="#38bdf8"/>
    <path d="M5 40 L 15 55 L 20 50" stroke="#fde68a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M35 40 L 25 55 L 20 50" stroke="#fde68a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M15 80 L 10 120 L 5 120" fill="#38bdf8"/>
    <path d="M25 80 L 30 120 L 35 120" fill="#38bdf8"/>
  </g>

  <!-- Warning Gesture -->
  <circle cx="130" cy="90" r="8" fill="#ec4899" opacity="0.8"/>
  <rect x="128" y="70" width="4" height="15" rx="2" fill="#ec4899"/>

  <!-- The Poisonous Mushrooms -->
  <g transform="translate(60, 140)">
    <path d="M0 0 C -15 -30, 15 -30, 0 0" fill="#ec4899"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="#ec4899"/>
    <rect x="-3" y="0" width="6" height="20" fill="#fef3c7"/>
    
    <g transform="translate(40, 10)">
      <path d="M0 0 C -10 -20, 10 -20, 0 0" fill="#ec4899"/>
      <ellipse cx="0" cy="0" rx="12" ry="6" fill="#ec4899"/>
      <rect x="-2" y="0" width="4" height="15" fill="#fef3c7"/>
    </g>
  </g>

  <!-- Decorative Forest Elements -->
  <path d="M20 200 L 30 150 L 40 200" stroke="#10b981" stroke-width="4" fill="none"/>
  <path d="M200 210 L 210 170 L 220 210" stroke="#10b981" stroke-width="3" fill="none"/>
  
  <!-- Warning Symbol (Abstracted) -->
  <path d="M130 60 L 145 85 L 115 85 Z" fill="none" stroke="#fb923c" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="130" cy="78" r="2" fill="#fb923c"/>
  <rect x="128" y="68" width="4" height="7" rx="2" fill="#fb923c"/>
</svg>