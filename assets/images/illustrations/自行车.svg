<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm Golden Light Glow for Commute/Environment -->
    <radialGradient id="sunGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Wheel Spoke Pattern -->
    <pattern id="spokes" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="10" y1="0" x2="10" y2="20" stroke="#64748b" stroke-width="0.8"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="#64748b" stroke-width="0.8"/>
    </pattern>

    <!-- Drop Shadow for Bicycle -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#030712" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)"/>

  <!-- Scenic Elements (Urban Park / Street Backdrop) -->
  <g opacity="0.4">
    <!-- Far buildings / trees silhouette -->
    <path d="M0 160 L0 190 L40 190 L40 140 L70 140 L70 190 L130 190 L130 120 L160 120 L160 190 L240 190 L240 170 C200 165 170 175 140 160 C110 145 80 150 40 155 Z" fill="#334155"/>
    <!-- Distant Streetlamp -->
    <rect x="200" y="80" width="3" height="110" fill="#475569"/>
    <path d="M195 85 L205 85 L201 78 Z" fill="#fbbf24"/>
    <circle cx="201" cy="85" r="8" fill="#fbbf24" opacity="0.3"/>
  </g>

  <!-- Ground / Road Surface -->
  <rect x="0" y="185" width="240" height="55" fill="#0b0f19"/>
  <line x1="0" y1="185" x2="240" y2="185" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <!-- Road dashes -->
  <line x1="20" y1="205" x2="60" y2="205" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
  <line x1="90" y1="205" x2="150" y2="205" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
  <line x1="180" y1="205" x2="220" y2="205" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>

  <!-- MOTION LINES (Action-packed commute feel) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="15" y1="120" x2="45" y2="120"/>
    <line x1="5" y1="135" x2="30" y2="135"/>
    <line x1="10" y1="150" x2="35" y2="150"/>
  </g>

  <!-- BICYCLE (Main Subject - 自行车 zìxíngchē) -->
  <g filter="url(#dropShadow)">
    
    <!-- REAR WHEEL -->
    <g transform="translate(65, 155)">
      <!-- Tire -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="7"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <!-- Inner Hub -->
      <circle cx="0" cy="0" r="6" fill="#94a3b8"/>
      <!-- Spokes Accent -->
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="-20" y1="20" x2="20" y2="-20" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <!-- FRONT WHEEL -->
    <g transform="translate(175, 155)">
      <!-- Tire -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="7"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <!-- Inner Hub -->
      <circle cx="0" cy="0" r="6" fill="#94a3b8"/>
      <!-- Spokes Accent -->
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="-20" y1="20" x2="20" y2="-20" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <!-- BIKE FRAME -->
    <!-- Chainstays & Seatstays (Rear to Bottom Bracket) -->
    <polyline points="65,155 105,155 120,110" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Seat Tube & Top Tube -->
    <polyline points="105,155 120,110 65,95" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Down Tube & Chainstay (Bottom Bracket to Head Tube & Front Hub) -->
    <polyline points="105,155 165,100 175,155" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Fork -->
    <polyline points="165,100 175,155" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- GEAR CRACK & PEDAL -->
    <circle cx="105" cy="155" r="10" fill="#cbd5e1" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="105" cy="155" r="3" fill="#0f172a"/>
    <!-- Pedal Arm & Pedal -->
    <line x1="105" y1="155" x2="115" y2="170" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <rect x="110" y="167" width="12" height="6" rx="2" fill="#fb923c"/>

    <!-- SADDLE (Seat) -->
    <path d="M 50,90 C 50,85 70,85 78,90 C 82,93 80,98 65,98 C 55,98 50,95 50,90 Z" fill="#ec4899" stroke="#db2777" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 60,95 L 65,110" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>

    <!-- HANDLEBARS & STEM -->
    <polyline points="165,100 168,85 178,80" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Handlebar Grip -->
    <path d="M 175,74 C 175,70 183,70 185,78 C 187,85 180,88 177,85" fill="#ec4899" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>

    <!-- FRONT BASKET (Adds real-world commuting narrative) -->
    <g transform="translate(170, 90)">
      <path d="M -5,0 L 15,0 L 12,20 C 12,22 10,24 8,24 L 2,24 C 0,24 -2,22 -2,20 Z" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round"/>
      <line x1="-4" y1="5" x2="14" y2="5" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="-3" y1="12" x2="13" y2="12" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Little parcel/book inside basket -->
      <rect x="0" y="8" width="10" height="8" rx="1" fill="#10b981"/>
      <rect x="2" y="6" width="6" height="3" rx="0.5" fill="#f59e0b"/>
    </g>
    
  </g>

  <!-- ENVIRONMENT PROPS (Leaves/Nature floating for friendly vector aesthetic) -->
  <g>
    <path d="M 40,60 C 45,55 52,58 50,65 C 48,72 40,70 40,60 Z" fill="#10b981" opacity="0.8" transform="rotate(25 45 60)"/>
    <path d="M 190,50 C 193,45 198,47 197,52 C 196,57 190,56 190,50 Z" fill="#38bdf8" opacity="0.7" transform="rotate(-15 190 50)"/>
    <path d="M 210,130 C 214,125 220,128 218,134 C 216,140 210,138 210,130 Z" fill="#fbbf24" opacity="0.6" transform="rotate(45 210 130)"/>
  </g>

  <!-- Foreground Atmospheric Glow & Polish -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
</svg>