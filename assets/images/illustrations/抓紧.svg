<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed container with rounded corners -->
  <rect width="240" height="240" rx="24" fill="#1e293b"/>

  <!-- Room background: Wall and Floor -->
  <!-- Wall (upper part of the room) -->
  <rect x="0" y="0" width="240" height="150" fill="#2d3a4b"/>
  <!-- Floor (lower part of the room) -->
  <rect x="0" y="150" width="240" height="90" fill="#222f3f"/>

  <!-- Window in the background -->
  <rect x="150" y="30" width="60" height="80" fill="#0f172a" rx="8"/>
  <rect x="155" y="35" width="50" height="70" fill="#1a273a" rx="5"/> <!-- Inner window pane -->
  <!-- Subtle city glow outside the window -->
  <circle cx="180" cy="100" r="20" fill="#fbbf24" opacity="0.15"/>

  <!-- Wall Clock -->
  <circle cx="50" cy="50" r="25" fill="#475569"/> <!-- Clock frame -->
  <circle cx="50" cy="50" r="20" fill="#e2e8f0"/> <!-- Clock face -->
  <!-- Clock hands showing late time, e.g., 11:50 -->
  <line x1="50" y1="50" x2="50" y2="35" stroke="#334155" stroke-width="2" stroke-linecap="round" transform="rotate(-30 50 50)"/> <!-- Hour hand (pointing towards 11) -->
  <line x1="50" y1="50" x2="50" y2="30" stroke="#334155" stroke-width="2" stroke-linecap="round" transform="rotate(150 50 50)"/> <!-- Minute hand (pointing towards 10) -->

  <!-- Desk -->
  <rect x="40" y="120" width="160" height="80" fill="#3a4758" rx="8"/>
  <rect x="45" y="115" width="150" height="10" fill="#475569" rx="4"/> <!-- Desk surface edge -->

  <!-- Character sitting at the desk -->
  <!-- Body -->
  <rect x="85" y="140" width="70" height="60" fill="#60a5fa" rx="10"/> <!-- Torso -->
  <!-- Head -->
  <circle cx="120" cy="115" r="20" fill="#f0c29a"/>
  <!-- Hair -->
  <path d="M100 105 C95 90, 110 85, 120 85 C130 85, 145 90, 140 105 C135 120, 105 120, 100 105 Z" fill="#4a3d3d"/>
  <!-- Eyes (focused/determined) -->
  <circle cx="110" cy="110" r="2" fill="#334155"/>
  <circle cx="130" cy="110" r="2" fill="#334155"/>
  <!-- Mouth (slight frown or determined line) -->
  <path d="M115 120 Q120 122, 125 120" stroke="#334155" stroke-width="1.5" fill="none"/>
  <!-- Arms -->
  <rect x="70" y="145" width="20" height="40" fill="#f0c29a" rx="5"/> <!-- Left arm -->
  <rect x="150" y="145" width="20" height="40" fill="#f0c29a" rx="5"/> <!-- Right arm -->
  <!-- Hands on laptop -->
  <rect x="75" y="175" width="25" height="15" fill="#f0c29a" rx="3"/> <!-- Left hand -->
  <rect x="140" y="175" width="25" height="15" fill="#f0c29a" rx="3"/> <!-- Right hand -->

  <!-- Laptop on desk -->
  <rect x="80" y="165" width="80" height="50" fill="#334155" rx="5"/> <!-- Laptop base -->
  <rect x="80" y="125" width="80" height="45" fill="#334155" rx="5"/> <!-- Laptop screen casing -->
  <rect x="85" y="130" width="70" height="35" fill="#bfdbfe"/> <!-- Laptop screen (glowing) -->
  <!-- Keyboard detail -->
  <rect x="85" y="170" width="70" height="10" fill="#475569" rx="2"/>

  <!-- Papers on desk -->
  <rect x="50" y="170" width="30" height="25" fill="#e2e8f0" rx="3"/>
  <rect x="160" y="175" width="30" height="20" fill="#e2e8f0" rx="3"/>
  <rect x="60" y="180" width="20" height="15" fill="#e2e8f0" rx="2"/> <!-- Overlapping paper -->

  <!-- Coffee Mug -->
  <rect x="170" y="155" width="15" height="20" fill="#fb923c" rx="4"/>
  <path d="M185 160 C190 160, 190 170, 185 170" stroke="#fb923c" stroke-width="3" fill="none"/> <!-- Mug handle -->

  <!-- Desk lamp -->
  <path d="M60 110 L70 110 L75 100 L65 100 Z" fill="#475569"/> <!-- Lamp base -->
  <path d="M67 105 L67 80 L75 75 L75 80 Z" fill="#475569"/> <!-- Lamp arm -->
  <path d="M70 75 C75 70, 85 70, 90 75 L85 85 L75 85 Z" fill="#fbbf24"/> <!-- Lamp shade, glowing -->
  <circle cx="80" cy="80" r="15" fill="#fbbf24" opacity="0.2"/> <!-- Lamp glow -->

</svg>