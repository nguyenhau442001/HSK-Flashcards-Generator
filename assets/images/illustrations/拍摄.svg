<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Tripod Legs -->
  <path d="M100 200 L80 230 M140 200 L160 230 M120 190 L120 230" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Camera Body -->
  <rect x="95" y="160" width="50" height="35" rx="4" fill="#38bdf8"/>
  <circle cx="120" cy="175" r="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Director/Cameraman -->
  <circle cx="180" cy="150" r="15" fill="#fde68a"/>
  <path d="M180 165 L180 195 M180 175 L165 185 M180 175 L195 185 M180 195 L170 220 M180 195 L190 220" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Film Set Elements -->
  <circle cx="40" cy="60" r="25" fill="#fb923c" opacity="0.3"/>
  <path d="M30 100 L70 100 L65 130 L35 130 Z" fill="#ec4899"/>
  <path d="M30 100 L70 100 L75 90 L35 90 Z" fill="#db2777"/>
  
  <!-- Lighting/Atmosphere -->
  <path d="M200 40 L220 20" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M210 50 L230 30" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="220" cy="30" r="4" fill="#fbbf24"/>
  
  <!-- Abstract Film Strip elements -->
  <rect x="20" y="180" width="10" height="10" fill="#10b981" rx="2"/>
  <rect x="40" y="190" width="10" height="10" fill="#10b981" rx="2"/>
  
  <!-- Focus/Viewfinder visual -->
  <path d="M105 165 L110 160 M135 165 L130 160" stroke="#f8fafc" stroke-width="2"/>
</svg>