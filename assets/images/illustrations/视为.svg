<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Museum Display Case -->
  <rect x="40" y="80" width="160" height="120" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="50" y="90" width="140" height="100" rx="4" fill="#0f172a" opacity="0.5"/>
  
  <!-- Panda (The Treasure) -->
  <g transform="translate(110, 110)">
    <circle cx="0" cy="0" r="25" fill="#f1f5f9"/>
    <circle cx="-12" cy="-10" r="8" fill="#1e293b"/>
    <circle cx="12" cy="-10" r="8" fill="#1e293b"/>
    <path d="M-8 5 Q0 12 8 5" stroke="#1e293b" stroke-width="2" fill="none"/>
    <circle cx="-15" cy="15" r="7" fill="#1e293b"/>
    <circle cx="15" cy="15" r="7" fill="#1e293b"/>
  </g>
  
  <!-- Spotlight -->
  <path d="M120 80 L100 0 L140 0 Z" fill="#fbbf24" opacity="0.2"/>
  <circle cx="120" cy="110" r="35" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Characters looking at the panda -->
  <g transform="translate(60, 160)">
    <circle cx="0" cy="0" r="12" fill="#38bdf8"/>
    <rect x="-15" y="12" width="30" height="40" rx="5" fill="#38bdf8"/>
  </g>
  
  <g transform="translate(180, 160)">
    <circle cx="0" cy="0" r="12" fill="#ec4899"/>
    <rect x="-15" y="12" width="30" height="40" rx="5" fill="#ec4899"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="3" fill="#fb923c"/>
  <circle cx="210" cy="50" r="4" fill="#10b981"/>
  <path d="M180 200 L200 220 M200 200 L180 220" stroke="#475569" stroke-width="2"/>
</svg>