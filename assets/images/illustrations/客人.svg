<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" clip-path="url(#cardClip)" />

  <!-- Ambient Light / Living Room Atmosphere -->
  <path d="M0 0h240v180H0z" fill="url(#warmLight)" />

  <!-- ENVIRONMENT: Interior Living Room -->
  <!-- Wallpaper / Wall -->
  <rect x="20" y="25" width="200" height="130" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Window with Night/Evening View -->
  <rect x="35" y="40" width="45" height="65" rx="4" fill="#090d16" stroke="#475569" stroke-width="2" />
  <!-- Window pane cross -->
  <path d="M57.5 40v65M35 72.5h45" stroke="#475569" stroke-width="1.5" />
  <!-- Cozy glow on window sill -->
  <path d="M33 105h49v3H33z" fill="#64748b" />

  <!-- Wall Decor (Picture Frame) -->
  <rect x="155" y="45" width="35" height="25" rx="2" fill="#334155" />
  <rect x="158" y="48" width="29" height="19" fill="#1e293b" />
  <!-- Abstract landscape inside frame -->
  <circle cx="165" cy="55" r="3" fill="#fbbf24" />
  <path d="M158 64l8-6 6 4 7-7 8 9z" fill="#475569" />

  <!-- House Plant in background -->
  <path d="M195 120c0-10 8-15 12-25 4 10 12 15 12 25z" fill="#10b981" opacity="0.8" />
  <path d="M207 105c-3-8-1-15-5-22 6 6 10 14 10 22z" fill="#059669" opacity="0.8" />
  <rect x="200" y="120" width="14" height="15" rx="2" fill="#cbd5e1" />

  <!-- Wooden Floor -->
  <path d="M20 155h200v60H20z" fill="#334155" />
  <!-- Floor planks lines -->
  <path d="M20 170h200M20 185h200M20 200h200" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />

  <!-- FURNITURE: Coffee Table -->
  <path d="M85 145h70v22H85z" fill="#475569" />
  <path d="M82 142h76v5H82z" fill="#64748b" />
  <!-- Table legs -->
  <path d="M90 167l-5 18M150 167l5 18" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  
  <!-- PROPS on Table: Teapot and Cups -->
  <path d="M115 132c-6 0-10 4-10 9h20c0-5-4-9-10-9z" fill="#f8fafc" /> <!-- Teapot lid -->
  <path d="M110 141h10v5h-10z" fill="#e2e8f0" />
  <path d="M123 136c3 0 5 2 5 4s-2 4-5 4" stroke="#e2e8f0" stroke-width="2" fill="none" /> <!-- spout -->
  <path d="M101 137c-2 0-3 2-3 3s1 3 3 3" stroke="#e2e8f0" stroke-width="2" fill="none" /> <!-- handle -->
  <!-- Teacups -->
  <rect x="92" y="139" width="8" height="6" rx="1" fill="#f8fafc" />
  <rect x="140" y="139" width="8" height="6" rx="1" fill="#f8fafc" />

  <!-- RUG under table and characters -->
  <ellipse cx="120" cy="175" rx="65" ry="18" fill="#1e293b" opacity="0.7" />
  <ellipse cx="120" cy="175" rx="55" ry="13" fill="#3b82f6" opacity="0.25" />

  <!-- CHARACTERS -->
  
  <!-- Character 1: Host (Standing / welcoming gesture) -->
  <g transform="translate(45, 95)">
    <!-- Body/Torso -->
    <path d="M25 35c0-8 6-15 14-15h12c8 0 14 7 14 15v30H25z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="45" cy="14" r="11" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M34 12c1-6 6-9 11-9s10 3 11 9c-2-2-5-3-11-3s-9 1-11 3z" fill="#451a03" />
    <!-- Arm gesturing welcome -->
    <path d="M31 38l-12 8c-2 1-2 4 0 5s4-1 6-3l10-8z" fill="#fcd34d" />
    <!-- Legs -->
    <path d="M35 65l-2 30h8l2-25M53 65l2 30h-8l-2-25" fill="#3b82f6" />
    <!-- Feet -->
    <path d="M31 95h10v3H31zM51 95h10v3H51z" fill="#1e293b" />
  </g>

  <!-- Character 2: The Guest (Sitting on sofa, holding a cup, smiling) -->
  <g transform="translate(130, 95)">
    <!-- Sofa (Armchair back and seat) -->
    <path d="M-10 15c0-10 8-18 18-18h40c10 0 18 8 18 18v50H-10z" fill="#334155" />
    <path d="M-15 45c0-8 6-15 14-15h52c8 0 14 7 14 15v30H-15z" fill="#475569" />

    <!-- Guest Body -->
    <path d="M12 25c0-8 6-14 14-14h12c8 0 14 6 14 14v32H12z" fill="#0ea5e9" />
    <!-- Head -->
    <circle cx="32" cy="4" r="11" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M21 2c2-5 7-7 12-7s10 2 12 7c-3-2-6-3-12-3s-9 1-12 3z" fill="#1e293b" />
    <!-- Arm holding cup -->
    <path d="M20 30c-4 2-8 7-6 12l6 3c2-1 4-5 5-8" fill="#0ea5e9" />
    <circle cx="21" cy="45" r="4" fill="#fcd34d" />
    <!-- Teacup in hand -->
    <rect x="18" y="42" width="6" height="7" rx="1" fill="#f8fafc" />

    <!-- Legs sitting -->
    <path d="M16 57l-15 5c-3 1-4 4-2 6s4 0 6-2l14-5z" fill="#1e293b" />
  </g>

  <!-- Foreground Atmospheric Elements (Warm cozy lighting overlay) -->
  <circle cx="120" cy="110" r="70" fill="#fbbf24" opacity="0.04" />
  
  <!-- Subtle UI container border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" />
</svg>