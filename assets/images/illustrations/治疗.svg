<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Medical Light Glow Gradient -->
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Light for Doctor -->
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Hospital Room Environment / Background details -->
  <g id="environment">
    <!-- Back wall shelf with medical equipment & monitor -->
    <rect x="25" y="45" width="70" height="6" rx="3" fill="#334155"/>
    <path d="M40 45 L40 32 L75 32 L75 45 Z" fill="#475569" opacity="0.4"/>
    <!-- Heart monitor display -->
    <rect x="145" y="40" width="65" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="151" y="46" width="53" height="33" rx="3" fill="#020617"/>
    <!-- EKG Line Animation -->
    <path d="M155 63 L165 63 L170 52 L175 74 L180 63 L195 63 L200 63" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="157" cy="50" r="2" fill="#ef4444"/>

    <!-- Medical Cabinet / Chart Holder -->
    <rect x="175" y="105" width="35" height="45" rx="3" fill="#334155"/>
    <line x1="182" y1="115" x2="203" y2="115" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="182" y1="125" x2="198" y2="125" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Ambient Lighting / Medical Spotlight cone -->
    <path d="M120 0 L60 240 L180 240 Z" fill="url(#lightGlow)" style="mix-blend-mode: screen;"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>

  <!-- SCENE: Patient on Hospital Bed -->
  <g id="patient-scene" filter="url(#softShadow)">
    <!-- Hospital Bed Frame -->
    <rect x="20" y="155" width="135" height="12" rx="6" fill="#64748b"/>
    <rect x="25" y="167" width="12" height="35" fill="#475569"/>
    <rect x="138" y="167" width="12" height="35" fill="#475569"/>
    
    <!-- Pillow -->
    <ellipse cx="45" cy="148" rx="14" ry="9" fill="#f8fafc"/>
    <path d="M35 142 C40 140 50 140 55 142 C53 154 37 154 35 142 Z" fill="#e2e8f0"/>

    <!-- Patient Body under Blanket -->
    <path d="M40 160 Q70 135 135 150 L140 172 L35 172 Z" fill="#38bdf8"/>
    <!-- Blanket fold/detail -->
    <path d="M40 160 Q70 135 135 150" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>

    <!-- Patient Head & Face -->
    <circle cx="42" cy="142" r="13" fill="#fcd34d"/>
    <!-- Patient Closed Eyes (relaxing/sleeping during treatment) -->
    <path d="M38 141 Q40 144 43 141" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M45 141 Q47 144 50 141" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Patient Hair -->
    <path d="M31 142 C30 134 36 128 45 129 C53 129 55 136 53 143 C49 140 37 140 31 142 Z" fill="#475569"/>

    <!-- IV Drip Stand & Bag -->
    <line x1="25" y1="90" x2="25" y2="200" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 195 L35 195" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- IV Bag -->
    <rect x="18" y="95" width="14" height="22" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
    <path d="M25 90 L25 95" stroke="#94a3b8" stroke-width="2"/>
    <!-- IV Tube to Patient Arm -->
    <path d="M25 117 Q25 150 45 155" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- SCENE: Doctor performing treatment (治疗) -->
  <g id="doctor-scene" filter="url(#softShadow)">
    <!-- Doctor Body / Lab Coat -->
    <path d="M125 115 C125 105 140 95 155 95 C170 95 185 105 185 115 L190 200 L120 200 Z" fill="#f8fafc"/>
    <!-- Lab Coat lapel and buttons -->
    <path d="M155 95 L145 140 L165 140 Z" fill="#e2e8f0"/>
    <circle cx="155" cy="150" r="2" fill="#cbd5e1"/>
    <circle cx="155" cy="165" r="2" fill="#cbd5e1"/>
    <circle cx="155" cy="180" r="2" fill="#cbd5e1"/>
    <!-- Inner Blue Scrub top -->
    <path d="M142 98 L168 98 L165 115 L145 115 Z" fill="#0ea5e9"/>

    <!-- Doctor Neck & Head -->
    <path d="M147 90 L163 90 L165 100 L145 100 Z" fill="#fcd34d"/>
    <circle cx="155" cy="78" r="15" fill="#fcd34d"/>

    <!-- Doctor Hair (Stylized Professional) -->
    <path d="M140 76 C140 65 150 62 155 62 C163 62 170 68 170 78 C170 78 168 74 165 72 C160 70 150 71 140 76 Z" fill="#334155"/>

    <!-- Face details (Focused expression) -->
    <!-- Eyes (focused, slightly downward towards patient) -->
    <circle cx="150" cy="77" r="1.5" fill="#1e293b"/>
    <circle cx="160" cy="77" r="1.5" fill="#1e293b"/>
    <!-- Eyebrows angled in concentration -->
    <path d="M147 73 L153 74" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M157 74 L163 73" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Smile/Concentration mouth -->
    <path d="M153 84 Q155 86 157 84" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Stethoscope around neck -->
    <path d="M148 90 C140 100 135 110 140 120 C142 124 148 122 146 117 C142 110 146 102 155 96 C164 102 168 110 164 117 C162 122 168 124 170 120 C175 110 170 100 162 90" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="140" cy="122" r="4" fill="#94a3b8"/>

    <!-- Arms & Active Treatment Interaction (Stethoscope checking patient's chest / examining) -->
    <!-- Right Arm holding stethoscope chest piece -->
    <path d="M170 105 Q185 120 165 145" fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
    <circle cx="165" cy="147" r="6" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <!-- Left Arm holding medical tablet/chart -->
    <path d="M140 110 Q115 130 110 150" fill="none" stroke="#f8fafc" stroke-width="13" stroke-linecap="round"/>
    <circle cx="110" cy="153" r="5" fill="#fcd34d"/>

    <!-- Medical Chart Clipboard in hand -->
    <g transform="translate(90, 135) rotate(-15)">
      <rect x="0" y="0" width="30" height="38" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="8" y="-3" width="14" height="6" rx="2" fill="#64748b"/>
      <line x1="6" y1="8" x2="24" y2="8" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="15" x2="20" y2="15" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="22" x2="22" y2="22" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <!-- Small cross symbol on chart -->
      <path d="M15 28 L15 34 M12 31 L18 31" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Highlights (Warm soft glow from top center) -->
  <circle cx="120" cy="40" r="90" fill="url(#warmGlow)" style="mix-blend-mode: overlay; pointer-events: none;"/>
</svg>