<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting & tabletop surface -->
  <path d="M 0 170 Q 120 160 240 170 L 240 240 L 0 240 Z" fill="#1e293b"/>
  <ellipse cx="120" cy="180" rx="90" ry="25" fill="#0b0f19" opacity="0.6"/>

  <!-- Decorative background elements (Cozy room atmosphere) -->
  <circle cx="190" cy="70" r="30" fill="#38bdf8" opacity="0.08"/>
  <circle cx="50" cy="100" r="18" fill="#fbbf24" opacity="0.06"/>
  
  <!-- Wooden Photo Frame (Outer) resting on surface -->
  <g transform="rotate(-8 120 130)">
    <!-- Shadow for Frame -->
    <rect x="52" y="57" width="136" height="146" rx="12" fill="#000000" opacity="0.35"/>
    
    <!-- Frame border -->
    <rect x="50" y="55" width="136" height="146" rx="10" fill="#b45309"/>
    <rect x="54" y="59" width="128" height="138" rx="7" fill="#d97706"/>
    <rect x="60" y="65" width="116" height="126" rx="4" fill="#fef3c7"/>
    
    <!-- THE PHOTO (zhàopiàn): Scenic Landscape & Family memory -->
    <clipPath id="photoClip">
      <rect x="62" y="67" width="112" height="122" rx="3"/>
    </clipPath>
    
    <g clip-path="url(#photoClip)">
      <!-- Sky gradient -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="60%" stop-color="#bae6fd"/>
        <stop offset="100%" stop-color="#fed7aa"/>
      </linearGradient>
      <rect x="62" y="67" width="112" height="122" fill="url(#skyGrad)"/>
      
      <!-- Sun -->
      <circle cx="140" cy="105" r="14" fill="#f59e0b" opacity="0.9"/>

      <!-- Distant Hills -->
      <path d="M 62 145 Q 90 120 125 140 Q 150 155 174 135 L 174 189 L 62 189 Z" fill="#65a30d" opacity="0.6"/>
      
      <!-- Closer Green Fields -->
      <path d="M 62 155 Q 100 135 140 160 Q 165 175 174 165 L 174 189 L 62 189 Z" fill="#16a34a"/>

      <!-- Stylized Family Silhouettes (representing the 'family photo' context) -->
      <!-- Adult left -->
      <path d="M 90 175 C 90 162 96 155 102 155 C 108 155 114 162 114 175 Z" fill="#1e293b"/>
      <circle cx="102" cy="148" r="5" fill="#1e293b"/>
      
      <!-- Adult right -->
      <path d="M 118 175 C 118 160 125 152 131 152 C 137 152 144 160 144 175 Z" fill="#1e293b"/>
      <circle cx="131" cy="145" r="5" fill="#1e293b"/>

      <!-- Child middle -->
      <path d="M 106 178 C 106 168 110 164 114 164 C 118 164 122 168 122 178 Z" fill="#ec4899"/>
      <circle cx="114" cy="158" r="4" fill="#1e293b"/>

      <!-- Glossy sheen on photo -->
      <path d="M 62 67 L 110 67 L 85 189 L 62 189 Z" fill="#ffffff" opacity="0.15"/>
    </g>
    
    <!-- Photo corner photo-mount corners (aesthetic detail) -->
    <rect x="60" y="65" width="12" height="12" fill="#e2e8f0" opacity="0.4"/>
    <rect x="164" y="65" width="12" height="12" fill="#e2e8f0" opacity="0.4"/>
  </g>

  <!-- Foreground Props for Real-World Scene Context -->
  <!-- A small potted succulent next to the frame -->
  <g transform="translate(170, 140)">
    <!-- Pot shadow -->
    <ellipse cx="18" cy="42" rx="14" ry="4" fill="#000000" opacity="0.4"/>
    <!-- Pot -->
    <path d="M 8 38 L 11 20 C 11 18 13 16 16 16 L 20 16 C 23 16 25 18 25 20 L 28 38 Z" fill="#f8fafc"/>
    <ellipse cx="18" cy="20" rx="7" ry="2" fill="#cbd5e1"/>
    
    <!-- Succulent leaves -->
    <path d="M 18 18 Q 12 10 15 6 Q 18 12 18 18 Z" fill="#10b981"/>
    <path d="M 18 18 Q 24 8 21 5 Q 18 12 18 18 Z" fill="#34d399"/>
    <path d="M 18 18 Q 15 4 19 3 Q 20 10 18 18 Z" fill="#059669"/>
    <path d="M 18 18 Q 22 12 26 10 Q 22 16 18 18 Z" fill="#10b981"/>
    <path d="M 18 18 Q 13 12 10 11 Q 14 16 18 18 Z" fill="#34d399"/>
  </g>

  <!-- Floating interactive accent elements / sparkles -->
  <path d="M 35 75 L 38 85 L 48 88 L 38 91 L 35 101 L 32 91 L 22 88 L 32 85 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 205 120 L 207 125 L 212 127 L 207 129 L 205 134 L 203 129 L 198 127 L 203 125 Z" fill="#38bdf8" opacity="0.7"/>
  <circle cx="165" cy="50" r="3" fill="#ec4899" opacity="0.7"/>

  <!-- Warm light rays washing over the scene -->
  <polygon points="0,0 120,0 80,240 0,240" fill="#fbbf24" opacity="0.03"/>
</svg>