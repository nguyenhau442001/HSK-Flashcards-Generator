<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark-mode background container -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Decorative background elements (soft glowing grid/facets representing 'perspectives/sides') -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Main Illustration: A glowing 3D Cube / Faceted Gem symbolizing 'Aspects / Faces / Sides' (方面) -->
  <g transform="translate(0, 5)">
    <!-- Back/Bottom shadow -->
    <ellipse cx="100" cy="142" rx="35" ry="10" fill="#0f172a" opacity="0.6"/>

    <!-- Left Facet (Sky Blue) -->
    <polygon points="100,120 55,95 55,45 100,70" fill="#0284c7"/>
    <polygon points="100,120 55,95 55,45 100,70" fill="#38bdf8" opacity="0.3"/>

    <!-- Right Facet (Emerald Green) -->
    <polygon points="100,120 145,95 145,45 100,70" fill="#059669"/>
    <polygon points="100,120 145,95 145,45 100,70" fill="#10b981" opacity="0.4"/>

    <!-- Top Facet (Amber/Coral) -->
    <polygon points="100,70 55,45 100,20 145,45" fill="#d97706"/>
    <polygon points="100,70 55,45 100,20 145,45" fill="#fb923c" opacity="0.5"/>

    <!-- Inner dividing lines for crisp vector edge look -->
    <line x1="100" y1="70" x2="100" y2="120" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="70" x2="55" y2="45" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="70" x2="145" y2="45" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Floating accent icons/markers on each side to represent different 'aspects' -->
    <!-- Left aspect marker (Magnifying glass / details) -->
    <circle cx="77" cy="70" r="8" fill="#bae6fd" opacity="0.9"/>
    <line x1="83" y1="76" x2="88" y2="81" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right aspect marker (Gear / experience) -->
    <circle cx="123" cy="70" r="8" fill="#a7f3d0" opacity="0.9"/>
    <circle cx="123" cy="70" r="3" fill="#059669"/>

    <!-- Top aspect marker (Star / quality) -->
    <polygon points="100,38 102,43 107,43 103,46 105,51 100,48 95,51 97,46 93,43 98,43" fill="#fef08a"/>
  </g>

  <!-- Foreground floating interface nodes representing connectivity of different facets -->
  <circle cx="45" cy="130" r="6" fill="#38bdf8"/>
  <path d="M 45 130 Q 65 110 80 115" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

  <circle cx="155" cy="130" r="6" fill="#10b981"/>
  <path d="M 155 130 Q 135 110 120 115" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

  <circle cx="100" cy="155" r="6" fill="#fb923c"/>
  <path d="M 100 155 L 100 135" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
</svg>