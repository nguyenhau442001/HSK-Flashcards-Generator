<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Scarf Gradient (Vibrant Warm Red/Orange) -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Coat Gradient -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- INTERIOR ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall Details & Window -->
  <g id="room-background">
    <!-- Window Frame Structure -->
    <rect x="145" y="30" width="65" height="90" rx="4" fill="#334155" />
    <rect x="150" y="35" width="55" height="80" rx="2" fill="#090d16" />
    <!-- Window Glass Panes -->
    <rect x="153" y="38" width="24" height="36" fill="#1e293b" opacity="0.6" />
    <rect x="181" y="38" width="21" height="36" fill="#1e293b" opacity="0.6" />
    <rect x="153" y="77" width="24" height="35" fill="#1e293b" opacity="0.6" />
    <rect x="181" y="77" width="21" height="35" fill="#1e293b" opacity="0.6" />

    <!-- Window Light Beam projecting into room -->
    <polygon points="150,35 210,35 240,180 80,180" fill="url(#windowLight)" />

    <!-- Outdoor Snow / Night Details (Winter context) -->
    <circle cx="165" cy="50" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="195" cy="65" r="1" fill="#ffffff" opacity="0.6" />
    <circle cx="180" cy="90" r="1.5" fill="#ffffff" opacity="0.7" />

    <!-- Bookshelf / Prop on Wall -->
    <rect x="25" y="45" width="50" height="6" rx="2" fill="#475569" />
    <path d="M35 45 L35 32 L42 32 L42 45 Z" fill="#f43f5e" />
    <path d="M44 45 L44 28 L52 28 L52 45 Z" fill="#fbbf24" />
    <path d="M54 45 L54 35 L62 35 L62 45 Z" fill="#38bdf8" />
    
    <!-- Warm Hanging Lamp -->
    <path d="M95 0 L95 25" stroke="#475569" stroke-width="2" />
    <path d="M80 25 L110 25 L105 32 L85 32 Z" fill="#64748b" />
    <circle cx="95" cy="34" r="4" fill="#fbbf24" filter="url(#softGlow)" />

    <!-- Indoor Plant Shelf / Sill -->
    <rect x="135" y="115" width="85" height="6" rx="3" fill="#475569" />
    <!-- Plant pot -->
    <path d="M185 115 L190 102 L202 102 L207 115 Z" fill="#cbd5e1" />
    <!-- Plant leaves -->
    <path d="M196 102 C196 90 185 85 180 82 C188 88 191 94 193 102" fill="url(#leafGrad)" />
    <path d="M196 102 C205 92 215 92 220 90 C212 96 204 98 196 102" fill="url(#leafGrad)" />
    <path d="M196 102 C196 88 202 82 205 78 C200 86 198 94 196 102" fill="url(#leafGrad)" />

    <!-- Floor -->
    <rect x="0" y="180" width="240" height="60" fill="#090d16" />
    <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="3" />
  </g>

  <!-- MAIN CHARACTER: WOMAN WEARING A SCARF -->
  <g id="character">
    <!-- Character Shadow on Floor -->
    <ellipse cx="105" cy="183" rx="35" ry="8" fill="#020617" opacity="0.6" />

    <!-- Body & Coat -->
    <!-- Lower Coat / Skirt section -->
    <path d="M75 140 L80 181 C80 182 125 182 130 181 L135 140 Z" fill="url(#coatGrad)" />
    <!-- Coat lapels / details -->
    <path d="M95 125 L95 181" stroke="#0284c7" stroke-width="2" opacity="0.5" />
    <path d="M115 125 L115 181" stroke="#0284c7" stroke-width="2" opacity="0.5" />

    <!-- Torso & Arms -->
    <rect x="80" y="115" width="50" height="35" rx="8" fill="url(#coatGrad)" />

    <!-- Left Arm (bent holding scarf end) -->
    <path d="M80 120 C70 125 65 140 72 150" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <!-- Left Hand -->
    <circle cx="73" cy="153" r="5" fill="#fbcfe8" />

    <!-- Right Arm (resting gently) -->
    <path d="M130 120 C140 130 142 145 138 155" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <!-- Right Hand -->
    <circle cx="137" cy="158" r="5" fill="#fbcfe8" />

    <!-- Neck -->
    <rect x="98" y="98" width="14" height="18" fill="#fbcfe8" />

    <!-- Head & Hair Base -->
    <!-- Back Hair -->
    <path d="M86 75 C86 55 124 55 124 75 C124 95 120 115 120 115 L90 115 C90 115 86 95 86 75 Z" fill="#33180d" />
    
    <!-- Face / Head Shape -->
    <circle cx="105" cy="82" r="18" fill="#fbcfe8" />

    <!-- Facial Features -->
    <!-- Gentle Smiling Eyes (Closed happy arcs) -->
    <path d="M96 80 C98 83 100 83 102 80" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M108 80 C110 83 112 83 114 80" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="95" cy="85" r="3" fill="#fda4af" opacity="0.6" />
    <circle cx="115" cy="85" r="3" fill="#fda4af" opacity="0.6" />
    <!-- Gentle Smile -->
    <path d="M102 88 C104 90 106 90 108 88" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Front Hair / Bangs -->
    <path d="M88 72 C90 82 98 82 105 76 C112 82 120 82 122 72 C120 66 110 65 105 68 C100 65 90 66 88 72 Z" fill="#451a03" />

    <!-- THE TARGET OBJECT: WÉIJĪN (KHĂN QUÀNG CỔ / SCARF) -->
    <!-- Richly draped around the neck and flowing down -->
    <g id="scarf">
      <!-- Main Neck Loop (Wrapped snugly) -->
      <path d="M90 95 C90 92 100 90 105 90 C110 90 120 92 120 95 C120 102 90 102 90 95 Z" fill="url(#scarfGrad)" />
      
      <!-- Scarf Knot/Fold in front -->
      <path d="M96 95 C98 102 112 102 114 95 C116 103 94 103 96 95 Z" fill="#be123c" />

      <!-- Long Flowing Scarf Tail 1 (Draped over shoulder/chest) -->
      <path d="M98 100 C95 115 88 135 78 150 C75 155 82 158 86 152 C95 138 102 120 104 105 Z" fill="url(#scarfGrad)" />
      
      <!-- Long Flowing Scarf Tail 2 (Dropping down dynamically) -->
      <path d="M108 100 C112 120 122 140 130 165 C132 172 139 168 136 160 C128 135 116 115 112 100 Z" fill="url(#scarfGrad)" />

      <!-- Scarf Fringe / Tassels (Bottom of Tail 1) -->
      <line x1="77" y1="152" x2="75" y2="158" stroke="#ffe4e6" stroke-width="2" stroke-linecap="round" />
      <line x1="81" y1="154" x2="80" y2="160" stroke="#ffe4e6" stroke-width="2" stroke-linecap="round" />
      <line x1="85" y1="153" x2="85" y2="159" stroke="#ffe4e6" stroke-width="2" stroke-linecap="round" />

      <!-- Scarf Fringe / Tassels (Bottom of Tail 2) -->
      <line x1="129" y1="166" x2="128" y2="173" stroke="#ffe4e6" stroke-width="2" stroke-linecap="round" />
      <line x1="133" y1="168" x2="133" y2="175" stroke="#ffe4e6" stroke-width="2" stroke-linecap="round" />
      <line x1="137" y1="167" x2="138" y2="174" stroke="#ffe4e6" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- FOREGROUND COMFORT PROPS -->
  <g id="foreground-props">
    <!-- Small Side Table / Stool -->
    <rect x="25" y="150" width="35" height="30" rx="4" fill="#334155" />
    <path d="M30 180 L28 200" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <path d="M55 180 L57 200" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    
    <!-- Mug of Warm Tea on Table -->
    <rect x="35" y="135" width="16" height="15" rx="3" fill="#cbd5e1" />
    <path d="M51 138 C55 138 55 147 51 147" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Steam from tea -->
    <path d="M40 130 C42 125 38 120 40 115" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
    <path d="M46 131 C48 126 44 121 46 116" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>