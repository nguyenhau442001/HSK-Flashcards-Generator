<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wall & Floor Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Character Outfit & Skin Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow & Light Effects -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background -->
  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="170" fill="url(#wallGrad)" />
  <!-- Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#0f172a" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" />

  <!-- Background Environment: Window with City View -->
  <g transform="translate(145, 25)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="65" height="95" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <!-- City Silhouette Outside -->
    <path d="M6 50 L6 90 L20 90 L20 35 L30 35 L30 90 L50 90 L50 60 L60 60 L60 90 Z" fill="#1e293b" />
    <circle cx="50" cy="20" r="6" fill="#f59e0b" opacity="0.8" filter="url(#amberGlow)" />
    <!-- Window Panes Highlight -->
    <line x1="32" y1="0" x2="32" y2="95" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="47" x2="65" y2="47" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Background Environment: Wall Shelf with Plant & Books -->
  <g transform="translate(25, 35)">
    <rect x="0" y="25" width="70" height="4" rx="2" fill="#64748b" />
    <!-- Small Plant -->
    <path d="M12 25 C12 15 22 15 22 25 Z" fill="#10b981" />
    <path d="M15 25 C15 10 28 10 25 25 Z" fill="#34d399" opacity="0.8" />
    <rect x="14" y="20" width="4" height="5" rx="1" fill="#cbd5e1" />
    <!-- Books -->
    <rect x="35" y="10" width="6" height="15" rx="1" fill="#f43f5e" />
    <rect x="42" y="7" width="8" height="18" rx="1" fill="#38bdf8" />
    <rect x="51" y="12" width="5" height="13" rx="1" fill="#fbbf24" />
  </g>

  <!-- WORKPLACE DESK & PROPS -->
  <!-- Desk Surface -->
  <path d="M15 170 L225 170 L210 215 L30 215 Z" fill="#334155" />
  <path d="M15 170 L225 170 L225 174 L15 174 Z" fill="#475569" />
  <path d="M25 174 L215 174 L205 211 L35 211 Z" fill="url(#deskGrad)" />

  <!-- Desk Props: Coffee Mug -->
  <g transform="translate(180, 160)">
    <rect x="0" y="5" width="12" height="15" rx="2" fill="#e2e8f0" />
    <path d="M12 8 C16 8 16 16 12 16" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- PROPS: The Planning Board / Project Flow (Large Document / Plan on Desk) -->
  <g transform="translate(45, 150) rotate(-6)">
    <!-- Clipboard / Paper Base -->
    <rect x="0" y="0" width="70" height="55" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Clip -->
    <rect x="25" y="-4" width="20" height="6" rx="2" fill="#64748b" />
    <!-- Abstract Plan Charts (Bars & Checkboxes) -->
    <rect x="10" y="12" width="25" height="4" rx="2" fill="#3b82f6" />
    <rect x="10" y="22" width="40" height="3" rx="1.5" fill="#94a3b8" />
    <rect x="10" y="29" width="30" height="3" rx="1.5" fill="#94a3b8" />
    <rect x="10" y="36" width="35" height="3" rx="1.5" fill="#94a3b8" />
    
    <circle.marker />
    <circle cx="55" cy="14" r="4" fill="#10b981" />

    <!-- HUGE RED 'X' OVERLAYING THE PLAN (Explicit Cancellation Visual) -->
    <g filter="url(#amberGlow)">
      <line x1="12" y1="8" x2="58" y2="48" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
      <line x1="58" y1="8" x2="12" y2="48" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
    </g>
    <!-- Core white core for punchy vector look -->
    <line x1="12" y1="8" x2="58" y2="48" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" />
    <line x1="58" y1="8" x2="12" y2="48" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Laptop / Screen showing cancelled project state -->
  <g transform="translate(105, 130)">
    <!-- Laptop Base (Perspective) -->
    <path d="M-15 35 L65 35 L55 50 L-5 50 Z" fill="#64748b" />
    <path d="M-12 38 L62 38" stroke="#475569" stroke-width="2" />
    <path d="M20 42 L30 42" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    
    <!-- Screen Back -->
    <rect x="-5" y="-15" width="60" height="52" rx="4" fill="#334155" />
    <!-- Screen Display -->
    <rect x="-1" y="-11" width="52" height="42" rx="2" fill="#0f172a" />
    
    <!-- UI elements on screen -->
    <rect x="5" y="-3" width="20" height="3" rx="1" fill="#38bdf8" />
    <rect x="5" y="3" width="35" height="2" rx="1" fill="#64748b" />
    <rect x="5" y="8" width="25" height="2" rx="1" fill="#64748b" />
    
    <!-- Red Cancel Button on UI -->
    <circle cx="38" cy="22" r="8" fill="#ef4444" />
    <path d="M35 19 L41 25 M41 19 L35 25" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER: "He" (他 - Tā) expressing the action of cancelling -->
  <g transform="translate(10, 65)">
    <!-- Character Body / Torso (Leaning slightly forward over desk) -->
    <path d="M60 90 L85 90 C95 105 100 120 100 135 L45 135 C50 115 55 100 60 90 Z" fill="url(#shirtGrad)" />
    <!-- Collar & Details -->
    <path d="M65 90 L72 102 L80 90" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Neck & Head -->
    <path d="M68 75 L76 75 L75 92 L69 92 Z" fill="#fdba74" />
    
    <!-- Head Circle/Shape -->
    <circle cx="72" cy="55" r="22" fill="#fdba74" />

    <!-- Hair (Modern styled short dark hair) -->
    <path d="M50 55 C50 35 94 35 94 55 C94 55 92 42 85 38 C75 32 65 32 58 38 C52 42 50 55 50 55 Z" fill="url(#hairGrad)" />

    <!-- Facial Expression: Decisive / Focused / Serious -->
    <!-- Eyebrows (Slanted down thoughtfully) -->
    <line x1="60" y1="48" x2="68" y2="51" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    <line x1="76" y1="51" x2="84" y2="48" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="64" cy="55" r="2.5" fill="#1e293b" />
    <circle cx="80" cy="55" r="2.5" fill="#1e293b" />
    <!-- Mouth (Determined straight/frown line) -->
    <path d="M69 66 L75 66" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />

    <!-- Right Arm / Hand (Reaching forward, actively dismissing/cancelling over the desk) -->
    <path d="M85 95 C100 100 115 110 125 105" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="127" cy="104" r="7" fill="#fdba74" />
    
    <!-- Left Arm (Bent resting on hip or table edge) -->
    <path d="M60 95 C45 105 45 125 50 135" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <circle cx="50" cy="135" r="6" fill="#fdba74" />
  </g>

  <!-- Atmospheric Lighting & Contextual Floating Accent (Red/Orange Cross Symbolizing "Cancellation" / "Stop") -->
  <g transform="translate(190, 50)" filter="url(#amberGlow)">
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#ef4444" stroke-width="3" />
    <path d="M-6 -6 L6 6 M6 -6 L-6 6" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  </g>

</svg>