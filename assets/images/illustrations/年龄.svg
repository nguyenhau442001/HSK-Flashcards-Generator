<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cakeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="frosting" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting / Wall Decs -->
  <circle cx="120" cy="110" r="90" fill="url(#ambientGlow)"/>
  
  <!-- Hanging Party Garland / Bunting -->
  <path d="M 20,40 Q 60,65 100,40 Q 140,65 180,40 Q 210,60 220,50" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Colorful pennants -->
  <polygon points="50,52 65,75 35,75" fill="#38bdf8"/>
  <polygon points="110,48 125,70 95,70" fill="#f59e0b"/>
  <polygon points="170,43 185,65 155,65" fill="#ec4899"/>
  <polygon points="205,52 215,70 195,70" fill="#10b981"/>

  <!-- Background Shelf with Props -->
  <rect x="40" y="80" width="160" height="6" rx="3" fill="#475569"/>
  <!-- Small potted plant -->
  <path d="M 58,80 L 62,68 L 78,68 L 82,80 Z" fill="#10b981"/>
  <ellipse cx="70" cy="68" rx="8" ry="3" fill="#059669"/>
  <path d="M 70,68 Q 60,50 65,45 Q 75,55 70,68" fill="#34d399"/>
  <path d="M 72,68 Q 85,52 80,45 Q 70,55 72,68" fill="#34d399"/>
  <!-- Wrapped Gift Box -->
  <rect x="145" y="60" width="20" height="20" rx="2" fill="#8b5cf6"/>
  <rect x="152" y="60" width="6" height="20" fill="#f43f5e"/>
  <rect x="145" y="67" width="20" height="6" fill="#f43f5e"/>
  <path d="M 155,60 C 150,52 160,52 155,60" fill="none" stroke="#f43f5e" stroke-width="2"/>

  <!-- Table Surface -->
  <rect x="0" y="185" width="240" height="55" fill="url(#woodTable)"/>
  <rect x="0" y="180" width="240" height="6" fill="#1e293b" opacity="0.4"/>

  <!-- Birthday Cake Plate -->
  <ellipse cx="120" cy="182" rx="65" ry="12" fill="#94a3b8"/>
  <ellipse cx="120" cy="180" rx="60" ry="10" fill="#e2e8f0"/>

  <!-- Cake Bottom Tier -->
  <path d="M 75,150 L 75,178 C 75,184 165,184 165,178 L 165,150 Z" fill="url(#cakeBody)"/>
  <ellipse cx="120" cy="150" rx="45" ry="8" fill="#fb7185"/>

  <!-- Frosting Drips -->
  <path d="M 75,150 C 75,165 85,168 85,158 C 85,168 95,168 95,155 C 95,168 105,168 105,155 C 105,168 115,168 115,155 C 115,168 125,168 125,155 C 125,168 135,168 135,155 C 135,168 145,168 145,158 C 145,168 155,165 165,150 Z" fill="url(#frosting)"/>

  <!-- Candle Sticks (Representing Years / 年龄) -->
  <!-- Candle 1 (Blue) -->
  <rect x="100" y="115" width="8" height="35" rx="2" fill="#38bdf8"/>
  <ellipse cx="104" cy="115" rx="4" ry="2" fill="#bae6fd"/>
  <!-- Candle 2 (Yellow) -->
  <rect x="116" y="110" width="8" height="40" rx="2" fill="#fbbf24"/>
  <ellipse cx="120" cy="110" rx="4" ry="2" fill="#fef08a"/>
  <!-- Candle 3 (Pink) -->
  <rect x="132" y="115" width="8" height="35" rx="2" fill="#ec4899"/>
  <ellipse cx="136" cy="115" rx="4" ry="2" fill="#fbcfe8"/>

  <!-- Candle Flames with Glow -->
  <!-- Flame 1 -->
  <path d="M 104,112 C 100,105 102,98 104,92 C 106,98 108,105 104,112 Z" fill="#fbbf24" filter="url(#glow)"/>
  <path d="M 104,108 C 102,104 103,100 104,95 C 105,100 106,104 104,108 Z" fill="#fef08a"/>

  <!-- Flame 2 (Taller center flame) -->
  <path d="M 120,106 C 115,97 117,90 120,83 C 123,90 125,97 120,106 Z" fill="#fb923c" filter="url(#glow)"/>
  <path d="M 120,101 C 117,95 119,91 120,87 C 121,91 123,95 120,101 Z" fill="#fef08a"/>

  <!-- Flame 3 -->
  <path d="M 136,112 C 132,105 134,98 136,92 C 138,98 140,105 136,112 Z" fill="#fbbf24" filter="url(#glow)"/>
  <path d="M 136,108 C 134,104 135,100 136,95 C 137,100 138,104 136,108 Z" fill="#fef08a"/>

  <!-- Sparkles/Confetti in Air -->
  <circle cx="85" cy="100" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="155" cy="105" r="2.5" fill="#ec4899" opacity="0.8"/>
  <circle cx="100" cy="75" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="140" cy="80" r="2" fill="#10b981" opacity="0.8"/>
  
  <!-- Number '1' and '8' shaped sparklers or golden decoration on cake front (Abstract representation of age number without text) -->
  <g transform="translate(110, 163) scale(0.6)">
    <!-- Decorative badge / medallion representing years/age counter -->
    <circle cx="16" cy="16" r="16" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
    <path d="M 10,22 L 10,12 L 14,14" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 20,14 C 20,10 24,10 24,13 C 24,16 20,17 20,20 L 26,20" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>