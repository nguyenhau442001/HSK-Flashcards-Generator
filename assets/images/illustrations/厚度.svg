<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Wall Section -->
  <rect x="120" y="40" width="80" height="160" rx="4" fill="#64748b"/>
  <rect x="110" y="40" width="10" height="160" rx="2" fill="#475569"/>
  
  <!-- Measurement Indicator -->
  <path d="M 120 80 L 100 80 M 120 140 L 100 140 M 110 80 L 110 140" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2"/>
  <path d="M 105 80 L 105 140" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 102 80 L 108 80 M 102 140 L 108 140" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Character -->
  <g transform="translate(40, 100)">
    <!-- Body -->
    <path d="M 20 100 L 20 60 Q 20 40 40 40 L 50 40 Q 70 40 70 60 L 70 100" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="45" cy="35" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M 30 30 Q 45 15 60 30" fill="#78350f"/>
    <!-- Arm holding tool -->
    <path d="M 65 60 L 90 80 L 100 75" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Tool (Tape measure) -->
    <rect x="95" y="70" width="15" height="15" rx="2" fill="#ec4899"/>
  </g>
  
  <!-- Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
  
  <!-- Decor -->
  <circle cx="180" cy="60" r="5" fill="#fb923c"/>
  <circle cx="140" cy="180" r="3" fill="#10b981"/>
</svg>