<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%
" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Spotlight / Glow -->
    <radialGradient id="golden-glow" cx="50%" cy="40%" r="55%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#eab308" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Podium / Stage Glow -->
    <linearGradient id="podium-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="ribbon-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting / Golden Moment Glow -->
  <circle cx="120" cy="95" r="90" fill="url(#golden-glow)"/>

  <!-- Confetti / Celebration Particles (Representing a momentous occasion) -->
  <g opacity="0.8">
    <circle cx="55" cy="70" r="3" fill="#38bdf8"/>
    <rect x="180" y="65" width="5" height="5" rx="1" fill="#fbbf24" transform="rotate(25 182 67)"/>
    <rect x="45" y="140" width="4" height="6" rx="1" fill="#ec4899" transform="rotate(-15 47 143)"/>
    <circle cx="195" cy="130" r="2.5" fill="#10b981"/>
    <circle cx="85" cy="45" r="2" fill="#fb923c"/>
    <rect x="155" y="40" width="6" height="3" rx="1" fill="#38bdf8" transform="rotate(45 158 41)"/>
    <circle cx="130" cy="35" r="1.5" fill="#fef08a"/>
  </g>

  <!-- ENVIRONMENT: Stage backdrop / Curtains -->
  <path d="M20 30 Q120 15 220 30 L220 180 L20 180 Z" fill="#1e1b4b" opacity="0.5"/>

  <!-- Stage Podium Base -->
  <path d="M70 185 L170 185 L185 205 L55 205 Z" fill="#334155" filter="url(#soft-shadow)"/>
  <path d="M75 185 L165 185 L165 190 L75 190 Z" fill="url(#podium-grad)"/>
  <rect x="85" y="190" width="70" height="15" fill="#1e293b"/>
  <!-- Glowing accent on podium -->
  <rect x="95" y="195" width="50" height="3" rx="1.5" fill="#38bdf8" opacity="0.8"/>

  <!-- MAIN CHARACTER: Person experiencing an important moment on stage -->
  <!-- Shadow under character -->
  <ellipse cx="120" cy="186" rx="28" ry="6" fill="#000000" opacity="0.5"/>

  <!-- Character Body & Suit -->
  <g id="character" filter="url(#soft-shadow)">
    <!-- Legs/Shoes -->
    <rect x="106" y="165" width="10" height="22" rx="3" fill="#0f172a"/>
    <rect x="124" y="165" width="10" height="22" rx="3" fill="#0f172a"/>
    <ellipse cx="111" cy="187" rx="6" ry="3" fill="#020617"/>
    <ellipse cx="129" cy="187" rx="6" ry="3" fill="#020617"/>

    <!-- Torso (Suit Jacket) -->
    <path d="M96 110 L144 110 L150 168 L90 168 Z" fill="#1e3a8a"/>
    <!-- Shirt inner & Tie -->
    <polygon points="120,110 112,130 128,130" fill="#f8fafc"/>
    <polygon points="118,125 122,125 124,155 120,162 116,155" fill="#dc2626"/>

    <!-- Left Arm (Raised holding award/cert or gesturing excitedly) -->
    <path d="M96 115 L72 100 L78 90 L98 108 Z" fill="#1e3a8a"/>
    <circle cx="72" cy="94" r="6" fill="#fde047"/> <!-- Hand -->

    <!-- Right Arm (Slightly back / holding context prop) -->
    <path d="M144 115 L165 130 L160 142 L140 122 Z" fill="#1e3a8a"/>
    <circle cx="165" cy="135" r="6" fill="#fde047"/> <!-- Hand -->

    <!-- Neck -->
    <rect x="114" y="100" width="12" height="15" rx="4" fill="#fde047"/>

    <!-- Head -->
    <circle cx="120" cy="85" r="18" fill="#fde047"/>

    <!-- Hair (Stylized neat professional hair) -->
    <path d="M102 85 C102 70, 110 66, 120 66 C130 66, 138 70, 138 85 C136 85, 134 74, 120 73 C106 74, 104 85, 102 85 Z" fill="#334155"/>

    <!-- Facial Expression: Smiling, proud, eyes closed in joyful triumph -->
    <!-- Eyebrows -->
    <path d="M109 80 Q114 77 118 80" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M122 80 Q126 77 131 80" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Happy Closed Eyes (Arches) -->
    <path d="M110 85 Q114 89 118 85" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M122 85 Q126 89 130 85" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Big Joyful Smile -->
    <path d="M114 93 Q120 100 126 93" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="109" cy="91" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="131" cy="91" r="3" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- CENTRAL PROP: Giant Gold Trophy / Medal representing an "Important Moment" -->
  <g id="trophy" transform="translate(120, 75)" filter="url(#soft-shadow)">
    <!-- Trophy floating / held up or displayed centrally -->
    <!-- Center ribbon / award badge element floating right above head -->
    <path d="M0 -35 L15 -20 L0 -5 L-15 -20 Z" fill="url(#ribbon-gold)"/>
    <circle cx="0" cy="-20" r="10" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
    <circle cx="0" cy="-20" r="5" fill="#f59e0b"/>
    <!-- Ribbon tails -->
    <path d="M-8 -10 L-15 8 L0 2 L5 -7 Z" fill="#b45309"/>
    <path d="M8 -10 L15 8 L0 2 L-5 -7 Z" fill="#d97706"/>
  </g>

  <!-- Sparkles / Star bursts accentuating the "Important / Significant Moment" -->
  <g fill="#fef08a">
    <!-- Star 1 (Top Left) -->
    <path d="M50 45 Q50 55 40 55 Q50 55 50 65 Q50 55 60 55 Q50 55 50 45 Z"/>
    <!-- Star 2 (Top Right) -->
    <path d="M190 55 Q190 63 182 63 Q190 63 190 71 Q190 63 198 63 Q190 63 190 55 Z"/>
    <!-- Star 3 (Mid Right) -->
    <path d="M210 105 Q210 112 203 112 Q210 112 210 119 Q210 112 217 112 Q210 112 210 105 Z"/>
    <!-- Star 4 (Mid Left) -->
    <path d="M30 115 Q30 122 23 122 Q30 122 30 129 Q30 122 37 122 Q30 122 30 115 Z"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Frame enhancement -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>