<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window Moonlight Gradient -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / BACKGROUND DETAILS -->
  <!-- Bookshelf Background -->
  <g fill="#172554" opacity="0.6">
    <rect x="25" y="40" width="45" height="110" rx="4" />
    <!-- Shelf Dividers -->
    <rect x="25" y="70" width="45" height="4" fill="#0f172a" />
    <rect x="25" y="105" width="45" height="4" fill="#0f172a" />
    <rect x="25" y="140" width="45" height="4" fill="#0f172a" />
    <!-- Mini Books on shelf -->
    <rect x="30" y="52" width="6" height="18" fill="#f59e0b" rx="1" />
    <rect x="38" y="48" width="8" height="22" fill="#ec4899" rx="1" />
    <rect x="48" y="54" width="5" height="16" fill="#10b981" rx="1" />
    <rect x="56" y="50" width="9" height="20" fill="#38bdf8" rx="1" />
    
    <rect x="32" y="80" width="7" height="25" fill="#a855f7" rx="1" />
    <rect x="41" y="85" width="6" height="20" fill="#fb923c" rx="1" />
    <rect x="50" y="82" width="12" height="23" fill="#64748b" rx="1" />
  </g>

  <!-- Window with Night Scene & Moon -->
  <g>
    <rect x="165" y="35" width="45" height="65" rx="6" fill="#090d16" stroke="#334155" stroke-width="2" />
    <!-- Window Glass Glow -->
    <path d="M167 37h41v61h-41z" fill="url(#moonlight)" />
    <!-- Crescent Moon -->
    <circle cx="195" cy="55" r="8" fill="#e2e8f0" />
    <circle cx="198" cy="53" r="7" fill="#090d16" />
    <!-- Window Frame Cross -->
    <path d="M187.5 35v65M165 67.5h45" stroke="#334155" stroke-width="2" />
    <!-- House Plants on Windowsill -->
    <path d="M162 100h51v4h-51z" fill="#475569" />
    <circle cx="177" cy="94" r="5" fill="#10b981" />
    <circle cx="175" cy="91" r="4" fill="#059669" />
    <circle cx="195" cy="93" r="6" fill="#10b981" />
  </g>

  <!-- Desk Surface -->
  <path d="M20 175h200v8H20z" fill="#334155" />
  <path d="M15 183h210v10H15z" fill="#1e293b" />
  <!-- Desk Legs -->
  <rect x="35" y="193" width="10" height="35" fill="#0f172a" />
  <rect x="195" y="193" width="10" height="35" fill="#0f172a" />

  <!-- LAMP & LIGHTING -->
  <!-- Lamp Base & Stand -->
  <path d="M185 175c0-15-20-30-35-65" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <ellipse cx="185" cy="175" rx="12" ry="4" fill="#475569" />
  <!-- Lamp Shade -->
  <path d="M135 105l15-15h20l15 15z" fill="#fbbf24" />
  <!-- Light Cone/Glow Over Desk -->
  <circle cx="120" cy="150" r="70" fill="url(#lamp-glow)" />

  <!-- PROPS ON DESK -->
  <!-- Open Philosophical Book / Notebook -->
  <g transform="translate(90, 145)">
    <!-- Book Cover -->
    <path d="M -25 15 L 0 25 L 25 15 L 25 30 L 0 40 L -25 30 Z" fill="#334155" />
    <!-- Left Page -->
    <path d="M -23 17 L -2 25 L -2 38 L -23 30 Z" fill="#f8fafc" />
    <!-- Right Page -->
    <path d="M 23 17 L 2 25 L 2 38 L 23 30 Z" fill="#f1f5f9" />
    <!-- Page Lines (Abstract Text) -->
    <path d="M-18 20h10M-18 24h12M-18 28h8M6 20h12M6 24h10M6 28h14" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Bust / Statue (Symbolizing Philosophy / Thinker / Classical Tradition) -->
  <g transform="translate(60, 135)">
    <!-- Pedestal Base -->
    <rect x="-10" y="25" width="20" height="15" fill="#475569" rx="2" />
    <rect x="-14" y="38" width="28" height="5" fill="#334155" rx="1" />
    <!-- Bust Body & Head -->
    <path d="M-8 25 C-8 15 -5 10 0 10 C5 10 8 15 8 25 Z" fill="#cbd5e1" />
    <circle cx="0" cy="2" r="8" fill="#cbd5e1" />
    <!-- Head Details (Classical hair/profile) -->
    <path d="M-6 -2 C-6 -7 0 -8 5 -3 C7 2 5 7 5 7 L-5 7 Z" fill="#94a3b8" />
    <!-- Highlights -->
    <path d="M-2 -2c2 1 4 3 4 5" stroke="#f8fafc" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Coffee Mug with Steam -->
  <g transform="translate(145, 155)">
    <rect x="-7" y="0" width="14" height="18" rx="3" fill="#ec4899" />
    <path d="M7 3 c4 0 4 8 0 8" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M-2 -4 c-2 -4 2 -6 0 -10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M3 -5 c2 -3 -1 -5 1 -9" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- MAIN CHARACTER: Student studying philosophy -->
  <g id="character">
    <!-- Chair Back -->
    <rect x="95" y="90" width="30" height="65" rx="8" fill="#334155" />

    <!-- Character Torso & Arms -->
    <!-- Sleeves / Shoulders -->
    <path d="M80 145 C80 120 100 115 120 115 C140 115 160 120 160 145 Z" fill="url(#shirt-grad)" />
    
    <!-- Left Arm leaning on desk, hand supporting chin (Pensive pose) -->
    <path d="M90 125 L100 150 L108 147 L98 123 Z" fill="#2563eb" />
    <!-- Left Hand touching chin -->
    <circle cx="107" cy="142" r="6" fill="#fcd34d" />

    <!-- Right Arm resting / writing -->
    <path d="M145 125 L135 155 L125 152 L138 123 Z" fill="#2563eb" />
    <!-- Right Hand holding pen -->
    <circle cx="123" cy="153" r="5" fill="#fcd34d" />
    <line x1="120" y1="150" x2="110" y2="152" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="110" y="105" width="20" height="18" fill="#fcd34d" />

    <!-- Head -->
    <circle cx="120" cy="95" r="22" fill="#fcd34d" />

    <!-- Hair (Thoughtful/Messy student hair, dark brown/black) -->
    <path d="M98 95 C98 75 142 75 142 95 C142 100 138 90 135 88 C130 78 110 78 105 88 C102 90 98 92 98 95 Z" fill="#1e293b" />
    <path d="M98 92 C95 98 98 105 102 108" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

    <!-- Facial Expression: Deep in thought / Contemplating -->
    <!-- Closed / Focused Eyes (Concentrating on complex philosophical ideas) -->
    <path d="M110 94 q4 -3 8 0" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M124 94 q4 -3 8 0" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyebrows (Slightly furrowed in deep thought) -->
    <path d="M108 90 q4 -2 8 2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M124 92 q4 2 8 -2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Thoughtful subtle smile / neutral mouth -->
    <path d="M116 104 q4 2 8 0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Glasses (Intellectual touch) -->
    <circle cx="114" cy="95" r="7" fill="none" stroke="#64748b" stroke-width="1.5" />
    <circle cx="128" cy="95" r="7" fill="none" stroke="#64748b" stroke-width="1.5" />
    <line x1="121" y1="95" x2="121" y2="94" stroke="#64748b" stroke-width="1.5" />
  </g>

  <!-- FLOATING LIGHT BULB / THOUGHT SYMBOL (Subtle nod to "Idea / Philosophy") -->
  <g transform="translate(115, 45)" opacity="0.85">
    <!-- Glow -->
    <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.25" />
    <!-- Bulb Body -->
    <path d="M-5 4 C-5 -3 5 -3 5 4 C5 8 2 10 2 12 L-2 12 C-2 10 -5 8 -5 4 Z" fill="#fef08a" />
    <rect x="-2" y="12" width="4" height="3" fill="#94a3b8" />
    <rect x="-1.5" y="15" width="3" height="2" fill="#64748b" />
    <!-- Filament -->
    <path d="M-2 4 L0 0 L2 4" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />
    <!-- Sparkles around bulb -->
    <circle cx="-12" cy="-6" r="1.5" fill="#fde047" />
    <circle cx="13" cy="-4" r="1" fill="#fde047" />
    <circle cx="10" cy="10" r="1.5" fill="#fde047" />
  </g>

</svg>