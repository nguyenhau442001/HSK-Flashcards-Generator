<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Hologram/Spotlight Gradient -->
    <linearGradient id="holo-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Document glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment (Detective/Investigator Office) -->
  <!-- Window Grid showing night city -->
  <g opacity="0.4">
    <rect x="25" y="25" width="60" height="90" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <line x1="55" y1="25" x2="55" y2="115" stroke="#475569" stroke-width="2"/>
    <line x1="25" y1="70" x2="85" y2="70" stroke="#475569" stroke-width="2"/>
    <!-- City lights -->
    <rect x="33" y="35" width="8" height="12" fill="#fbbf24" opacity="0.6"/>
    <rect x="45" y="50" width="8" height="15" fill="#38bdf8" opacity="0.6"/>
    <rect x="65" y="40" width="12" height="20" fill="#fbbf24" opacity="0.4"/>
    <rect x="33" y="80" width="10" height="18" fill="#38bdf8" opacity="0.5"/>
    <rect x="60" y="85" width="15" height="10" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- Bookshelf Background Props -->
  <rect x="175" y="40" width="40" height="90" fill="#1e293b" stroke="#334155" stroke-width="2" rx="2"/>
  <line x1="175" y1="70" x2="215" y2="70" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="100" x2="215" y2="100" stroke="#334155" stroke-width="2"/>
  <rect x="182" y="48" width="8" height="22" fill="#ec4899" rx="1"/>
  <rect x="193" y="52" width="12" height="18" fill="#38bdf8" rx="1"/>
  <rect x="180" y="78" width="10" height="22" fill="#f59e0b" rx="1"/>

  <!-- Desk Surface -->
  <path d="M 10 185 L 230 185 L 220 220 L 20 220 Z" fill="url(#desk-grad)" />
  <rect x="10" y="177" width="220" height="8" rx="4" fill="#475569" />

  <!-- Spotlight Cone from Desk Lamp -->
  <path d="M 185 105 L 125 185 L 185 185 Z" fill="url(#holo-grad)" />

  <!-- Props on Desk: Magnifying Glass & Evidence Folder -->
  <g transform="translate(145, 175)">
    <!-- Folder -->
    <path d="M -15 0 L 25 -5 L 30 15 L -10 20 Z" fill="#f59e0b" opacity="0.9" />
    <path d="M -10 -5 L 15 -10 L 20 0 L -5 5 Z" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- EVIDENCE HIGHLIGHT / THE "FACT" REVELATION -->
  <!-- Glowing central evidence document / photo popping out -->
  <g filter="url(#glow)">
    <rect x="95" y="125" width="50" height="38" rx="4" fill="#ffffff" transform="rotate(-8 120 144)" />
    <!-- Abstract clear photo on document -->
    <circle cx="112" cy="138" r="8" fill="#38bdf8" opacity="0.8" transform="rotate(-8 120 144)"/>
    <path d="M 124 135 L 138 135" stroke="#64748b" stroke-width="3" stroke-linecap="round" transform="rotate(-8 120 144)"/>
    <path d="M 124 144 L 135 144" stroke="#64748b" stroke-width="3" stroke-linecap="round" transform="rotate(-8 120 144)"/>
    <!-- Checkmark badge representing absolute truth/fact -->
    <circle cx="120" cy="144" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <path d="M 113 144 L 118 149 L 128 138" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CHARACTER: Investigator / Analyst pointing definitively at the truth -->
  <!-- Body / Torso -->
  <path d="M 55 210 L 55 155 C 55 140, 75 140, 75 155 L 75 210 Z" fill="#1e293b" />
  <path d="M 50 155 L 80 155 L 85 190 L 45 190 Z" fill="#334155" /> <!-- Suit jacket -->
  <path d="M 65 155 L 65 175" stroke="#f8fafc" stroke-width="4" /> <!-- Shirt collar/tie base -->
  <polygon points="65,160 62,175 68,175" fill="#ec4899" /> <!-- Red tie -->

  <!-- Head & Face -->
  <circle cx="65" cy="115" r="22" fill="#fbcfe8" /> <!-- Skin tone -->
  <!-- Hair -->
  <path d="M 43 115 C 43 95, 87 95, 87 115 C 87 105, 80 92, 65 92 C 50 92, 43 105, 43 115 Z" fill="#334155" />
  <!-- Confident/Sure Expression -->
  <path d="M 56 112 Q 60 108 64 112" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" /> <!-- Eyebrow 1 -->
  <path d="M 66 112 Q 70 108 74 112" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" /> <!-- Eyebrow 2 -->
  <circle cx="60" cy="118" r="2" fill="#1e293b" /> <!-- Eye 1 -->
  <circle cx="70" cy="118" r="2" fill="#1e293b" /> <!-- Eye 2 -->
  <path d="M 63 126 Q 65 130 67 126" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" /> <!-- Confident smile -->
  <circle cx="53" cy="122" r="3" fill="#f43f5e" opacity="0.3" /> <!-- Blush -->
  <circle cx="77" cy="122" r="3" fill="#f43f5e" opacity="0.3" /> <!-- Blush -->

  <!-- Back Arm (Holding posture) -->
  <path d="M 50 160 L 35 180 L 45 190" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Front Arm & Hand (Pointing firmly and clearly at the glowing fact) -->
  <path d="M 80 155 L 105 140" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <!-- Forearm pointing directly to the fact badge -->
  <path d="M 100 142 L 115 142" fill="none" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round" />
  <!-- Pointing Index Finger -->
  <circle cx="118" cy="142" r="5" fill="#fbcfe8" />
  <path d="M 115 138 L 124 142 L 115 146 Z" fill="#fbcfe8" />

  <!-- Desk Lamp Prop (Top Right casting light) -->
  <g transform="translate(195, 95)">
    <path d="M 0 45 L 20 45" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <path d="M 10 45 L 10 15 L 25 5" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp Shade -->
    <path d="M 15 0 L 35 5 L 28 20 L 5 15 Z" fill="#f59e0b" />
    <!-- Bulb glow -->
    <circle cx="18" cy="12" r="5" fill="#fef08a" filter="url(#glow)" />
  </g>

  <!-- Coffee Mug Prop on Desk -->
  <g transform="translate(35, 165)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#38bdf8" />
    <path d="M 16 4 C 22 4, 22 14, 16 14" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 5 -4 C 8 -8, 2 -12, 5 -16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

</svg>