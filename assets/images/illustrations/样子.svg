<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Tailor's Table Surface -->
  <path d="M20 180 L220 180 L200 230 L40 230 Z" fill="#334155"/>
  
  <!-- The Garment (The "Yàngzi" - Shape/Style) -->
  <g transform="translate(70, 40)">
    <!-- Main Body -->
    <path d="M40 10 L60 10 L70 30 L90 20 L100 50 L90 140 L10 140 L0 50 L10 20 L30 30 Z" fill="#f59e0b" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>
    <!-- Collar Detail -->
    <path d="M40 10 L50 25 L60 10" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <!-- Pattern/Buttons -->
    <circle cx="50" cy="60" r="4" fill="#1e293b"/>
    <circle cx="50" cy="90" r="4" fill="#1e293b"/>
    <circle cx="50" cy="120" r="4" fill="#1e293b"/>
  </g>

  <!-- Contextual Props: Measuring Tape -->
  <path d="M160 150 C 190 150, 210 170, 200 190" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  <rect x="195" y="185" width="10" height="10" rx="2" fill="#ec4899"/>
  
  <!-- Contextual Props: Scissors -->
  <g transform="translate(30, 150) rotate(-20)">
    <path d="M0 0 L20 20 L10 30 L-10 10 Z" fill="#94a3b8"/>
    <circle cx="-5" cy="5" r="8" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="15" cy="25" r="8" fill="none" stroke="#38bdf8" stroke-width="4"/>
  </g>

  <!-- Atmospheric Highlights -->
  <circle cx="200" cy="40" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="40" cy="30" r="3" fill="#fbbf24" opacity="0.4"/>
</svg>