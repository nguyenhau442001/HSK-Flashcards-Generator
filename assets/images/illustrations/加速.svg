<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Road/Motion lines -->
  <path d="M0 180 L240 180" stroke="#334155" stroke-width="4" stroke-dasharray="10 10"/>
  <path d="M20 210 L220 210" stroke="#334155" stroke-width="2" stroke-dasharray="5 15"/>
  
  <!-- Motion Blur Effect -->
  <path d="M200 160 L240 160" stroke="#fb923c" stroke-width="2" opacity="0.6"/>
  <path d="M210 170 L240 170" stroke="#fb923c" stroke-width="2" opacity="0.4"/>
  
  <!-- Car Body -->
  <g transform="translate(60, 130)">
    <path d="M10 40 L110 40 C120 40 120 20 100 20 L70 20 L50 0 L20 0 Z" fill="#38bdf8"/>
    <rect x="25" y="5" width="20" height="15" fill="#0f172a" rx="2"/>
    <rect x="55" y="5" width="30" height="15" fill="#0f172a" rx="2"/>
    <circle cx="30" cy="45" r="12" fill="#334155"/>
    <circle cx="90" cy="45" r="12" fill="#334155"/>
    <circle cx="30" cy="45" r="5" fill="#f8fafc"/>
    <circle cx="90" cy="45" r="5" fill="#f8fafc"/>
  </g>

  <!-- Driver -->
  <g transform="translate(85, 135)">
    <circle cx="0" cy="0" r="8" fill="#fbbf24"/>
    <rect x="-10" y="5" width="20" height="15" fill="#ec4899" rx="4"/>
    <!-- Arm pressing pedal -->
    <path d="M-5 15 L-15 25" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Speed lines/Action -->
  <path d="M180 140 L220 140" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 150 L230 150" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pedal/Floor detail -->
  <rect x="75" y="170" width="10" height="5" fill="#94a3b8"/>
  <path d="M80 170 L80 160" stroke="#fb923c" stroke-width="2"/>
</svg>