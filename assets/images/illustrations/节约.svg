<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Water Drop Gradient -->
    <linearGradient id="water-grad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Tap Metallic Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Golden Coin/Glow Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Basin Gradient -->
    <linearGradient id="basin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment Details (Tile wall and shelf) -->
  <g opacity="0.15">
    <path d="M0 60 H240 M0 120 H240 M0 180 H240" stroke="#94a3b8" stroke-width="1"/>
    <path d="M60 0 V240 M120 0 V240 M180 0 V240" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Ambient Glow behind the main saving action -->
  <circle cx="120" cy="130" r="60" fill="#10b981" opacity="0.1" filter="url(#glow)"/>

  <!-- Wall Shelf -->
  <rect x="30" y="55" width="90" height="8" rx="2" fill="#334155" filter="url(#soft-shadow)"/>
  
  <!-- Potted Plant on Shelf (Eco theme) -->
  <path d="M55 55 L60 38 H80 L85 55 Z" fill="#cbd5e1" filter="url(#soft-shadow)"/>
  <ellipse cx="70" cy="38" rx="10" ry="3" fill="#94a3b8"/>
  <path d="M70 38 C60 25 50 30 50 20 C50 15 60 18 70 28 C80 18 90 15 90 20 C90 30 80 25 70 38 Z" fill="url(#leaf-grad)" filter="url(#soft-shadow)"/>

  <!-- Sink Basin Countertop -->
  <path d="M20 180 H220 V200 C220 211 211 220 200 220 H40 C28.95 220 20 211 20 200 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M50 180 C50 200 190 200 190 180" fill="none" stroke="#475569" stroke-width="3"/>

  <!-- Water Basin/Bucket for saving water -->
  <g filter="url(#soft-shadow)">
    <!-- Bucket Body -->
    <path d="M85 140 L95 205 H145 L155 140 Z" fill="url(#basin-grad)" stroke="#475569" stroke-width="2"/>
    <!-- Bucket Rim -->
    <ellipse cx="120" cy="140" rx="36" ry="7" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Water inside bucket -->
    <ellipse cx="120" cy="145" rx="33" ry="5" fill="#0284c7" opacity="0.8"/>
    <!-- Bucket Handle -->
    <path d="M88 138 C80 100 160 100 152 138" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Water Saving Eco-Heart Drop Icon hovering above bucket -->
  <g filter="url(#glow)">
    <path d="M120 100 C120 100 102 78 102 64 C102 54 110 46 120 56 C130 46 138 54 138 64 C138 78 120 100 120 100 Z" fill="url(#water-grad)"/>
    <!-- Little Leaf sprout on water drop -->
    <path d="M120 56 C120 56 127 46 133 48 C137 49 135 55 127 58 Z" fill="url(#leaf-grad)"/>
  </g>

  <!-- Modern Wall-Mounted Water Tap (Turned OFF / Conserving) -->
  <g filter="url(#soft-shadow)">
    <!-- Wall mount plate -->
    <rect x="110" y="70" width="20" height="25" rx="4" fill="url(#metal-grad)"/>
    <!-- Spout curve -->
    <path d="M120 80 C95 80 95 110 105 115" fill="none" stroke="url(#metal-grad)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Tap Handle (Lever pointing horizontally - Closed state) -->
    <rect x="115" y="72" width="25" height="6" rx="3" fill="#10b981" filter="url(#glow)"/>
    <circle cx="135" cy="75" r="5" fill="#34d399"/>

    <!-- Aerator tip -->
    <rect x="100" y="112" width="10" height="6" rx="2" fill="#64748b"/>
  </g>

  <!-- Sparkling Efficiency / Saving indicators (Green check and stars) -->
  <g transform="translate(155, 95)" filter="url(#glow)">
    <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.2"/>
    <circle cx="0" cy="0" r="10" fill="#10b981"/>
    <!-- Checkmark -->
    <path d="M-4 -1 L-1 3 L5 -3" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Golden Coins symbolizing money saved through conservation -->
  <g filter="url(#soft-shadow)">
    <!-- Coin 1 -->
    <ellipse cx="65" cy="115" rx="8" ry="6" fill="url(#gold-grad)" stroke="#fde047" stroke-width="1"/>
    <ellipse cx="65" cy="115" rx="4" ry="3" fill="none" stroke="#b45309" stroke-width="0.8"/>
    <!-- Coin 2 -->
    <ellipse cx="175" cy="155" rx="10" ry="7" fill="url(#gold-grad)" stroke="#fde047" stroke-width="1"/>
    <ellipse cx="175" cy="155" rx="5" ry="3.5" fill="none" stroke="#b45309" stroke-width="0.8"/>
    <path d="M170 152 L180 158" stroke="#b45309" stroke-width="0.8"/>
  </g>

  <!-- Tiny sparkles for eco-friendly magic touch -->
  <g fill="#38bdf8">
    <path d="M45 90 L47 95 L52 97 L47 99 L45 104 L43 99 L38 97 L43 95 Z" opacity="0.6"/>
    <path d="M190 70 L191.5 73.5 L195 75 L191.5 76.5 L190 80 L188.5 76.5 L185 75 L188.5 73.5 Z" opacity="0.8"/>
  </g>
</svg>