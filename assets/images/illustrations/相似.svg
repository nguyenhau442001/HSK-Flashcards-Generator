<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Left Vase (Subject 1) -->
  <g transform="translate(60, 100)">
    <path d="M-20 80 L20 80 L15 20 L-15 20 Z" fill="#fbbf24"/>
    <ellipse cx="0" cy="20" rx="15" ry="5" fill="#f59e0b"/>
    <path d="M-5 20 L-5 0 M5 20 L5 0" stroke="#fb923c" stroke-width="2"/>
    <circle cx="-5" cy="0" r="3" fill="#ec4899"/>
    <circle cx="5" cy="0" r="3" fill="#10b981"/>
  </g>
  
  <!-- Right Vase (Subject 2 - Similar) -->
  <g transform="translate(180, 100)">
    <path d="M-20 80 L20 80 L15 20 L-15 20 Z" fill="#fbbf24"/>
    <ellipse cx="0" cy="20" rx="15" ry="5" fill="#f59e0b"/>
    <path d="M-5 20 L-5 0 M5 20 L5 0" stroke="#fb923c" stroke-width="2"/>
    <circle cx="-5" cy="0" r="3" fill="#ec4899"/>
    <circle cx="5" cy="0" r="3" fill="#10b981"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="120" cy="50" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="140" cy="40" r="3" fill="#fb923c" opacity="0.4"/>
  <path d="M30 180 L210 180" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Ambient Glow -->
  <ellipse cx="120" cy="120" rx="100" ry="40" fill="#38bdf8" opacity="0.05"/>
