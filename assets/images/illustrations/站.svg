<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%?" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Amber Glow for Platform -->
    <linearGradient id="platformLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Train Body Gradient -->
    <linearGradient id="trainBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Window Glow -->
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Character Jacket Gradient -->
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Elements / Ambient Lights -->
  <circle cx="190" cy="50" r="30" fill="#38bdf8" opacity="0.05"/>
  <circle cx="50" cy="80" r="50" fill="#f59e0b" opacity="0.03"/>

  <!-- DISTANT CITY / TUNNEL BACKGROUND -->
  <path d="M0 130 L240 130 L240 180 L0 180 Z" fill="#0f172a"/>
  
  <!-- Railway Tracks / Depth lines -->
  <line x1="120" y1="130" x2="20" y2="180" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="130" x2="220" y2="180" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="130" x2="120" y2="180" stroke="#475569" stroke-width="1.5"/>
  <line x1="70" y1="150" x2="170" y2="150" stroke="#64748b" stroke-width="2"/>
  <line x1="50" y1="165" x2="190" y2="165" stroke="#64748b" stroke-width="2"/>

  <!-- THE TRAIN (GA TÀU HỎA / BẾN) arriving -->
  <g transform="translate(15, 65)">
    <!-- Train Body -->
    <path d="M 30 10 L 170 10 Q 195 10 200 35 L 200 65 Q 200 70 195 70 L 5 70 Q 0 70 0 65 L 0 35 Q 0 10 30 10 Z" fill="url(#trainBody)"/>
    <!-- Train Stripe -->
    <rect x="0" y="38" width="200" height="8" fill="#fb923c"/>
    <!-- Headlight beam -->
    <path d="M 180 50 L 240 75 L 240 30 Z" fill="#fef08a" opacity="0.15"/>
    <circle cx="185" cy="50" r="6" fill="#fef08a"/>
    
    <!-- Train Windows with Passengers Silhouettes -->
    <rect x="25" y="18" width="25" height="16" rx="4" fill="url(#windowGlow)"/>
    <rect x="60" y="18" width="25" height="16" rx="4" fill="url(#windowGlow)"/>
    <rect x="95" y="18" width="25" height="16" rx="4" fill="url(#windowGlow)"/>
    <rect x="130" y="18" width="25" height="16" rx="4" fill="url(#windowGlow)"/>
    
    <!-- Wheels -->
    <circle cx="40" cy="70" r="8" fill="#1e293b"/>
    <circle cx="40" cy="70" r="4" fill="#64748b"/>
    <circle cx="160" cy="70" r="8" fill="#1e293b"/>
    <circle cx="160" cy="70" r="4" fill="#64748b"/>
  </g>

  <!-- STATION PLATFORM (BẾN / GA) -->
  <!-- Platform floor -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#groundGrad)"/>
  <!-- Platform Yellow Safety Line -->
  <path d="M 0 168 L 240 168" stroke="#fbbf24" stroke-width="4" stroke-dasharray="12 6"/>

  <!-- Station Pillar & Overhead Roof structure -->
  <rect x="195" y="80" width="16" height="85" fill="#475569" rx="3"/>
  <rect x="190" y="75" width="26" height="8" fill="#334155" rx="2"/>
  <!-- Station Signage Board (Visual element only, no text) -->
  <rect x="175" y="90" width="56" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="187" cy="102" r="4" fill="#10b981"/>
  <line x1="197" y1="100" x2="221" y2="100" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <line x1="197" y1="105" x2="213" y2="105" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Overhead roof beam curving in -->
  <path d="M 240 60 L 160 60 L 160 80 L 240 80 Z" fill="#334155" opacity="0.6"/>

  <!-- FOREGROUND: PERSON STANDING AT THE STATION (ĐỨNG - Zhàn) -->
  <g transform="translate(85, 120)">
    <!-- Shadow -->
    <ellipse cx="22" cy="57" rx="14" ry="4" fill="#020617" opacity="0.6"/>

    <!-- Backpack -->
    <rect x="10" y="16" width="10" height="18" rx="4" fill="#3b82f6"/>

    <!-- Legs (Standing straight, firmly planted) -->
    <!-- Left Leg -->
    <path d="M 14 38 L 14 54 Q 14 58 18 58 L 20 58" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 15 56 L 22 56" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/> <!-- Shoe -->

    <!-- Right Leg -->
    <path d="M 26 38 L 26 54 Q 26 58 30 58 L 32 58" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 27 56 L 34 56" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/> <!-- Shoe -->

    <!-- Torso / Jacket -->
    <path d="M 12 16 Q 20 14 28 16 L 32 38 L 8 38 Z" fill="url(#jacket)"/>
    <!-- Jacket zipper/details -->
    <line x1="20" y1="16" x2="20" y2="38" stroke="#831843" stroke-width="2"/>

    <!-- Scarf -->
    <path d="M 14 14 Q 20 18 26 14 Q 30 22 24 24 Q 20 22 16 24 Q 10 20 14 14 Z" fill="#38bdf8"/>
    <path d="M 24 22 L 28 34" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <circle cx="20" cy="8" r="8" fill="#fbcfe8"/> <!-- Face -->
    <!-- Hair -->
    <path d="M 12 8 Q 12 1 20 1 Q 28 1 28 8 Q 28 10 24 10 L 16 10 Q 12 10 12 8 Z" fill="#0f172a"/>

    <!-- Arms (Relaxed, holding luggage handle or phone) -->
    <!-- Left Arm -->
    <path d="M 12 18 L 6 30" stroke="#be185d" stroke-width="5" stroke-linecap="round"/>
    <!-- Right Arm pointing forward/holding -->
    <path d="M 28 18 L 34 28 L 30 32" stroke="#be185d" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Luggage Trolley / Suitcase beside the person -->
    <g transform="translate(42, 22)">
      <rect x="0" y="8" width="16" height="26" rx="4" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
      <!-- Suitcase ribs -->
      <line x1="0" y1="18" x2="16" y2="18" stroke="#047857" stroke-width="1.5"/>
      <!-- Handle -->
      <path d="M 5 8 L 5 4 Q 5 2 8 2 Q 11 2 11 4 L 11 8" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Wheels -->
      <circle cx="3" cy="35" r="2" fill="#0f172a"/>
      <circle cx="13" cy="35" r="2" fill="#0f172a"/>
    </g>
  </g>

  <!-- Atmospheric Glow from Platform Light Fixtures -->
  <path d="M 0 160 L 240 160" stroke="url(#platformLight)" stroke-width="15" opacity="0.6"/>

</svg>