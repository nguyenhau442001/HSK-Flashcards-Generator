<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Construction Site / Project Scene -->
  <g transform="translate(20, 40)">
    <!-- Building Frame -->
    <path d="M40 160 L40 40 L160 40 L160 160 Z" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>
    
    <!-- Materials (Wuli) -->
    <rect x="170" y="100" width="30" height="40" rx="2" fill="#fb923c"/>
    <rect x="175" y="110" width="20" height="30" rx="2" fill="#f59e0b"/>
    <rect x="170" y="140" width="30" height="10" rx="2" fill="#fbbf24"/>
    
    <!-- Characters (Renli) -->
    <!-- Character 1 -->
    <g transform="translate(50, 100)">
      <circle cx="15" cy="15" r="10" fill="#fbbf24"/>
      <path d="M5 30 L25 30 L20 60 L10 60 Z" fill="#38bdf8"/>
      <path d="M15 30 L15 50" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Character 2 -->
    <g transform="translate(90, 80)">
      <circle cx="15" cy="15" r="10" fill="#fbbf24"/>
      <path d="M5 30 L25 30 L20 60 L10 60 Z" fill="#ec4899"/>
      <path d="M15 30 L25 45" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Character 3 -->
    <g transform="translate(130, 110)">
      <circle cx="15" cy="15" r="10" fill="#fbbf24"/>
      <path d="M5 30 L25 30 L20 60 L10 60 Z" fill="#10b981"/>
      <path d="M15 30 L5 45" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Blueprint/Table -->
    <rect x="30" y="160" width="140" height="10" rx="2" fill="#475569"/>
    <path d="M40 165 L150 165" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Decorative accents -->
  <circle cx="200" cy="40" r="3" fill="#f59e0b"/>
  <circle cx="30" cy="200" r="2" fill="#38bdf8"/>
  <circle cx="210" cy="210" r="4" fill="#ec4899"/>
</svg>