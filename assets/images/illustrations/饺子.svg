<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332211"/>
      <stop offset="100%" stop-color="#1a1109"/>
    </linearGradient>

    <!-- Bamboo Steamer Base -->
    <linearGradient id="steamerWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Dumpling Dough Gradient -->
    <linearGradient id="dumplingBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Warm Ambient Glow from Lanterns/Lights -->
  <circle cx="120" cy="110" r="90" fill="#f59e0b" opacity="0.08" filter="blur(20px)"/>
  <circle cx="180" cy="50" r="40" fill="#ec4899" opacity="0.06" filter="blur(15px)"/>

  <!-- Background Wooden Table Surface -->
  <path d="M 0 140 Q 120 130 240 140 L 240 240 L 0 240 Z" fill="url(#tableGrad)" />
  <!-- Table Edge highlight -->
  <path d="M 0 140 Q 120 130 240 140" fill="none" stroke="#78350f" stroke-width="2" opacity="0.6"/>

  <!-- Bamboo Steamer Basket (Container for Dumplings) -->
  <g filter="url(#dropShadow)">
    <!-- Steamer Rim Back Shadow -->
    <ellipse cx="120" cy="135" rx="85" ry="35" fill="#0f172a" opacity="0.6"/>
    
    <!-- Steamer Outer Wall -->
    <path d="M 35 135 L 35 160 C 35 180, 205 180, 205 160 L 205 135 Z" fill="url(#steamerWood)"/>
    <!-- Steamer Texture Bands -->
    <path d="M 35 143 C 120 155, 205 143, 205 143" fill="none" stroke="#b45309" stroke-width="3" opacity="0.6"/>
    <path d="M 35 153 C 120 165, 205 153, 205 153" fill="none" stroke="#b45309" stroke-width="3" opacity="0.6"/>

    <!-- Steamer Rim (Top Ellipse Edge) -->
    <ellipse cx="120" cy="135" rx="85" ry="25" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <!-- Steamer Inner Floor -->
    <ellipse cx="120" cy="138" rx="78" ry="21" fill="#78350f"/>
    <!-- Steamer Slats Inner Detail -->
    <path d="M 45 138 Q 120 146 195 138" fill="none" stroke="#451a03" stroke-width="2" opacity="0.4"/>
    <path d="M 52 143 Q 120 152 188 143" fill="none" stroke="#451a03" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Steam Rising Wisps -->
  <g fill="none" stroke-linecap="round" opacity="0.4">
    <path d="M 90 110 Q 80 90 95 70 T 90 40" stroke="#ffffff" stroke-width="3" filter="blur(2px)"/>
    <path d="M 130 115 Q 140 95 125 75 T 135 45" stroke="#ffffff" stroke-width="3" filter="blur(2px)"/>
    <path d="M 160 120 Q 150 100 165 80" stroke="#ffffff" stroke-width="2" filter="blur(1.5px)"/>
  </g>

  <!-- Delicious Jiaozi (Dumplings) inside the steamer -->
  <g id="dumplings" filter="url(#dropShadow)">
    
    <!-- Dumpling 4 (Back Left) -->
    <g transform="translate(75, 115) scale(0.7)">
      <path d="M 0 25 C -5 20, -20 10, -15 -5 C -10 -20, 10 -25, 25 -15 C 35 -5, 30 20, 25 25 Z" fill="url(#dumplingBody)"/>
      <!-- Pleats -->
      <path d="M -15 -5 Q 5 -12 25 -15" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M -5 -2 Q 2 -10 15 -13" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M -10 2 Q 5 -5 18 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M -15 8 Q 2 0 20 -5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Dumpling 3 (Back Right) -->
    <g transform="translate(150, 112) rotate(15) scale(0.75)">
      <path d="M 0 25 C -5 20, -20 10, -15 -5 C -10 -20, 10 -25, 25 -15 C 35 -5, 30 20, 25 25 Z" fill="url(#dumplingBody)"/>
      <!-- Pleats -->
      <path d="M -15 -5 Q 5 -12 25 -15" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M -5 -2 Q 2 -10 15 -13" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M -10 2 Q 5 -5 18 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M -15 8 Q 2 0 20 -5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Dumpling 2 (Front Right - Hero Angle) -->
    <g transform="translate(130, 130) rotate(-10) scale(0.95)">
      <path d="M -30 15 C -25 -5, -15 -25, 10 -22 C 30 -20, 40 0, 35 15 C 30 25, -20 30, -30 15 Z" fill="url(#dumplingBody)"/>
      <!-- Pleats Detail -->
      <path d="M -15 -22 C -5 -28, 15 -25, 28 -15" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <path d="M -8 -15 C -2 -22, 10 -20, 20 -12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <path d="M -15 -8 C -5 -15, 8 -13, 16 -6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <path d="M -22 -1 C -10 -8, 2 -7, 10 0" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <!-- Highlight/Shadow -->
      <path d="M -28 12 C -18 24, 20 25, 33 12" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Dumpling 1 (Front Center - Main Hero Jiaozi) -->
    <g transform="translate(95, 122) rotate(5) scale(1.05)">
      <!-- Main Body -->
      <path d="M -32 15 C -28 -8, -12 -28, 12 -25 C 32 -22, 42 2, 36 17 C 30 28, -22 30, -32 15 Z" fill="url(#dumplingBody)" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Artistic Pleats (Crimp ridges) -->
      <path d="M -18 -22 C -5 -30, 12 -27, 26 -18" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M -10 -16 C -2 -24, 10 -21, 20 -13" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <path d="M -17 -9 C -6 -17, 6 -14, 15 -7" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <path d="M -23 -2 C -10 -10, 2 -8, 10 -1" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <path d="M -28 6 C -15 -2, -2 -2, 5 6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Gentle Surface Lighting -->
      <path d="M -28 13 C -15 26, 20 26, 32 14" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9" stroke-linecap="round"/>
    </g>

  </g>

  <!-- Foreground Context Props (Small Sauce Dish & Chopsticks) -->
  <g filter="url(#dropShadow)">
    <!-- Small Ceramic Sauce Dish -->
    <ellipse cx="185" cy="185" rx="28" ry="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="185" cy="183" rx="22" ry="10" fill="#b91c1c"/>
    <ellipse cx="183" cy="182" rx="18" ry="8" fill="#7f1d1d"/>
    <!-- Soy Sauce Surface Reflection -->
    <ellipse cx="178" cy="180" rx="8" ry="3" fill="#ef4444" opacity="0.4" transform="rotate(-10 178 180)"/>

    <!-- Chopsticks resting on a ceramic holder (or table edge) -->
    <g transform="rotate(-15 70 190)">
      <!-- Chopstick 1 -->
      <rect x="30" y="185" width="85" height="4" rx="2" fill="#d97706"/>
      <rect x="30" y="185" width="85" height="2" rx="1" fill="#fbbf24" opacity="0.6"/>
      <!-- Chopstick 2 -->
      <rect x="30" y="193" width="85" height="4" rx="2" fill="#b45309"/>
      <rect x="30" y="193" width="85" height="2" rx="1" fill="#d97706" opacity="0.6"/>
    </g>
  </g>

  <!-- Festive Hanging Lantern (Atmospheric background element top right) -->
  <g opacity="0.9" filter="url(#dropShadow)">
    <line x1="205" y1="0" x2="205" y2="25" stroke="#b45309" stroke-width="2"/>
    <path d="M 190 25 C 190 20, 220 20, 220 25 L 225 45 C 225 55, 185 55, 185 45 Z" fill="#ef4444"/>
    <path d="M 192 30 C 205 35, 218 30, 218 30" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 190 45 C 205 50, 220 45, 220 45" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <rect x="202" y="55" width="6" height="10" fill="#f59e0b"/>
  </g>

  <!-- Ambient Sparkles / Magic particles representing delicious warmth -->
  <g fill="#fbbf24">
    <circle cx="50" cy="80" r="2" opacity="0.8"/>
    <circle cx="195" cy="95" r="1.5" opacity="0.6"/>
    <circle cx="110" cy="45" r="2.5" opacity="0.9"/>
    <circle cx="65" cy="140" r="1.5" opacity="0.5"/>
  </g>
</svg>