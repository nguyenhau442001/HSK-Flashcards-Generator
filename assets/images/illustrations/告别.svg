<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Station Light Gradient -->
    <radialGradient id="stationLight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Train Window Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Character 1 Palette (Traveler inside/leaving) -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Palette (Friend waving goodbye on platform) -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#stationLight)" />

  <!-- ENVIRONMENT: Railway Station Platform background -->
  <!-- Distant station structure / pillars -->
  <rect x="20" y="40" width="12" height="130" fill="#475569" opacity="0.3" rx="2" />
  <rect x="208" y="40" width="12" height="130" fill="#475569" opacity="0.3" rx="2" />
  
  <!-- Station roof arches & warm hanging lights -->
  <path d="M 0 50 Q 120 20 240 50" fill="none" stroke="#64748b" stroke-width="3" opacity="0.4" />
  <circle cx="120" cy="35" r="6" fill="#fef08a" filter="url(#softShadow)" />
  <path d="M 120 35 L 120 55" stroke="#475569" stroke-width="2" />
  <circle cx="60" cy="42" r="4" fill="#fef08a" />
  <circle cx="180" cy="42" r="4" fill="#fef08a" />

  <!-- Platform floor & train tracks perspective -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a" />
  <!-- Platform edge line -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#f59e0b" stroke-width="3" />
  <!-- Tactile paving -->
  <line x1="0" y1="175" x2="240" y2="175" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4" />

  <!-- THE TRAIN (Modern sleek vector train carriage on the right/center) -->
  <g transform="translate(90, 65)" filter="url(#softShadow)">
    <!-- Train Body -->
    <rect x="0" y="0" width="130" height="110" rx="16" fill="#cbd5e1" />
    <path d="M 16 0 L 114 0 C 122 0 128 6 128 14 L 128 110 L 0 110 L 0 14 C 0 6 6 0 14 0 Z" fill="#94a3b8" />
    
    <!-- Train Stripe -->
    <rect x="0" y="30" width="130" height="25" fill="#0f172a" opacity="0.8" />
    <rect x="0" y="35" width="130" height="4" fill="#ec4899" />

    <!-- Train Window (Large glowing window where departure happens) -->
    <rect x="15" y="45" width="70" height="50" rx="8" fill="url(#windowGlow)" />
    <!-- Window Frame -->
    <rect x="12" y="42" width="76" height="56" rx="10" fill="none" stroke="#475569" stroke-width="4" />

    <!-- Luggage rack inside train silhouette -->
    <rect x="20" y="15" width="60" height="6" rx="3" fill="#64748b" opacity="0.6" />
  </g>

  <!-- TRAVELER (Inside the train, leaning out/waving from the glowing window) -->
  <g transform="translate(108, 95)">
    <!-- Traveler Body/Jacket -->
    <path d="M 12 40 L 32 40 L 38 65 L 6 65 Z" fill="url(#jacketGrad)" />
    <!-- Traveler Neck & Head -->
    <circle cx="22" cy="18" r="10" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 12 16 Q 22 6 32 16 Q 32 12 22 8 Q 12 12 12 16 Z" fill="#451a03" />
    <!-- Happy/Waving Face Profile (Facing Left towards friend) -->
    <circle cx="16" cy="18" r="1.5" fill="#1e293b" />
    <path d="M 13 22 Q 16 25 19 22" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Waving Arm inside/at window -->
    <path d="M 28 35 Q 38 25 42 18" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="43" cy="16" r="4" fill="#fbcfe8" />
    
    <!-- Travel Bag/Scarf accent -->
    <path d="M 14 38 L 30 38 L 28 44 L 16 44 Z" fill="#fb923c" />
  </g>

  <!-- PLATFORM FRIEND (Standing on platform, waving back warmly) -->
  <g transform="translate(35, 115)" filter="url(#softShadow)">
    <!-- Ground Shadow -->
    <ellipse cx="25" cy="58" rx="18" ry="6" fill="#000" opacity="0.4" />

    <!-- Legs & Shoes -->
    <rect x="16" y="38" width="7" height="20" rx="3.5" fill="#334155" />
    <rect x="27" y="38" width="7" height="20" rx="3.5" fill="#334155" />
    <ellipse cx="19" cy="58" rx="5" ry="2" fill="#0f172a" />
    <ellipse cx="30" cy="58" rx="5" ry="2" fill="#0f172a" />

    <!-- Coat / Torso -->
    <path d="M 12 14 C 12 10 38 10 38 14 L 42 42 C 42 44 40 46 38 46 L 12 46 C 10 46 8 44 8 42 Z" fill="url(#coatGrad)" />
    <!-- Scarf -->
    <path d="M 14 14 C 18 18 32 18 36 14 L 38 20 C 32 23 18 23 12 20 Z" fill="#f43f5e" />
    <path d="M 28 20 L 32 38 L 26 39 L 24 20 Z" fill="#f43f5e" />

    <!-- Neck & Head -->
    <circle cx="25" cy="6" r="9" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 16 4 C 18 -2 32 -2 34 4 C 34 8 16 8 16 4 Z" fill="#78350f" />
    <!-- Face (Smiling, emotional expression) -->
    <circle cx="30" cy="6" r="1.5" fill="#1e293b" />
    <path d="M 27 9 Q 30 12 33 9" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Rosy cheek -->
    <circle cx="28" cy="8" r="2" fill="#fda4af" opacity="0.6" />

    <!-- Waving Arm (Up high, dynamic gesture) -->
    <path d="M 36 18 Q 48 10 52 2" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <circle cx="53" cy="1" r="4.5" fill="#fcd34d" />
  </g>

  <!-- LUGGAGE ON PLATFORM (Contextual travel props) -->
  <g transform="translate(15, 145)" filter="url(#softShadow)">
    <!-- Suitcase 1 (Orange/Amber) -->
    <rect x="0" y="5" width="22" height="18" rx="4" fill="#ea580c" />
    <rect x="8" y="1" width="6" height="4" rx="2" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <line x1="0" y1="12" x2="22" y2="12" stroke="#9a3412" stroke-width="2" />
    <!-- Wheels & Handle -->
    <circle cx="5" cy="24" r="2" fill="#334155" />
    <circle cx="17" cy="24" r="2" fill="#334155" />

    <!-- Suitcase 2 (Blue backpack leaning on it) -->
    <path d="M 20 8 C 20 4 26 2 30 4 L 33 22 C 33 24 31 25 29 25 L 22 25 C 20 25 20 23 20 21 Z" fill="#0284c7" />
    <rect x="23" y="10" width="8" height="10" rx="2" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- EMOTIONAL PARTICLES / SPEED / GOODBYE EFFECT -->
  <!-- Floating heart/sparkle elements representing emotional farewell -->
  <g transform="translate(75, 80)">
    <!-- Heart 1 -->
    <path d="M 0 5 C -4 0 -10 2 -10 7 C -10 12 -4 16 0 20 C 4 16 10 12 10 7 C 10 2 4 0 0 5 Z" fill="#ec4899" opacity="0.8" transform="scale(0.6) rotate(-15)" />
  </g>
  <g transform="translate(100, 60)">
    <!-- Heart 2 (smaller, floating up) -->
    <path d="M 0 5 C -4 0 -10 2 -10 7 C -10 12 -4 16 0 20 C 4 16 10 12 10 7 C 10 2 4 0 0 5 Z" fill="#f43f5e" opacity="0.9" transform="scale(0.4) rotate(10)" />
  </g>
  
  <!-- Motion Lines / Departure effect from train -->
  <path d="M 180 80 L 195 80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M 185 95 L 205 95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 175 110 L 200 110" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- Soft vignette framing border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />
</svg>