<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="140" y="85" width="70" height="45" rx="6"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment & Room Details -->
  <circle cx="120" cy="120" r="100" fill="url(#glowGrad)"/>
  
  <!-- Bookshelf / Background wall elements -->
  <rect x="25" y="45" width="40" height="90" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="30" y="70" width="30" height="6" fill="#475569" opacity="0.5"/>
  <rect x="30" y="100" width="30" height="6" fill="#475569" opacity="0.5"/>
  <rect x="30" y="55" width="12" height="12" rx="2" fill="#f59e0b" opacity="0.6"/>
  <rect x="45" y="80" width="10" height="15" rx="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M120 0 L120 40" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 40 L140 40 L145 48 L95 48 Z" fill="#475569"/>
  <path d="M95 48 Q120 120 120 130 Q120 120 145 48 Z" fill="url(#lampGlow)"/>

  <!-- Table/Counter -->
  <rect x="15" y="175" width="210" height="12" rx="4" fill="#475569"/>
  <rect x="35" y="187" width="12" height="40" rx="3" fill="#334155"/>
  <rect x="193" y="187" width="12" height="40" rx="3" fill="#334155"/>

  <!-- Coffee mug on table -->
  <path d="M30 155 L35 175 L55 175 L60 155 Z" fill="#cbd5e1"/>
  <path d="M60 160 C68 160 68 170 60 170" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <!-- Steam from coffee -->
  <path d="M40 148 Q43 140 40 132" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M50 150 Q47 142 50 135" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- CHARACTER 1 (The speaker / shocked friend, LEFT) -->
  <!-- Body / Torso -->
  <path d="M45 180 C45 150 75 150 75 180 Z" fill="#0284c7"/>
  <!-- Head & Hair -->
  <circle cx="60" cy="115" r="18" fill="#ffedd5"/>
  <path d="M42 115 C42 95 78 95 78 115 C78 120 70 112 60 112 C50 112 42 120 42 115 Z" fill="#1e293b"/>
  
  <!-- Face expressions (Shocked / Disbelieving) -->
  <circle cx="55" cy="113" r="2" fill="#1e293b"/>
  <circle cx="67" cy="113" r="2" fill="#1e293b"/>
  <!-- Open O-mouth of disbelief -->
  <ellipse cx="61" cy="123" rx="4" ry="6" fill="#991b1b"/>

  <!-- Character 1 Hand on cheek (Shocked gesture) -->
  <path d="M50 140 C45 130 55 120 58 125" stroke="#ffedd5" stroke-width="6" stroke-linecap="round" fill="none"/>


  <!-- CHARACTER 2 (The one who forgot, RIGHT - holding head in embarrassment) -->
  <!-- Body / Torso -->
  <path d="M150 180 C150 150 190 150 190 180 Z" fill="#e11d48"/>
  
  <!-- Head -->
  <circle cx="170" cy="112" r="19" fill="#ffedd5"/>
  <!-- Hair (Messy/Awkward style) -->
  <path d="M150 112 C150 90 192 90 192 112 C185 105 160 102 150 112 Z" fill="#334155"/>
  <path d="M175 92 Q182 85 188 95" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Face expressions (Embarrassed, sweating, nervous smile) -->
  <!-- Sweat drop -->
  <path d="M185 102 Q188 108 185 114 Q182 108 185 102 Z" fill="#38bdf8"/>
  <!-- Nervous closed eyes (Arcs) -->
  <path d="M162 110 Q166 106 170 110" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M172 110 Q176 106 180 110" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Embarrassed blush marks -->
  <ellipse cx="162" cy="116" rx="3" ry="1.5" fill="#fda4af"/>
  <ellipse cx="180" cy="116" rx="3" ry="1.5" fill="#fda4af"/>
  <!-- Awkward wavy mouth -->
  <path d="M166 122 Q171 125 176 122" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Hand scratching head (Sign of forgetting/awkwardness) -->
  <path d="M175 100 C185 85 165 80 162 95" stroke="#ffedd5" stroke-width="6" stroke-linecap="round" fill="none"/>


  <!-- THE PROP: ID Card / Name Tag with blank/question mark representing the forgotten name -->
  <g transform="translate(100, 75)">
    <!-- Card Base -->
    <rect x="0" y="0" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Lanyard hole -->
    <circle cx="25" cy="-4" r="3" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Avatar placeholder on card -->
    <circle cx="12" cy="12" r="5" fill="#94a3b8"/>
    <path d="M6 24 C6 20 18 20 18 24" fill="#94a3b8"/>
    <!-- Name lines replaced by wavy confusion lines / question mark vibe -->
    <rect x="22" y="8" width="22" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="22" y="16" width="16" height="4" rx="2" fill="#e2e8f0"/>
    
    <!-- Red exclamation mark / question mark hovering above to emphasize "forgotten name!" -->
    <circle cx="25" cy="-15" r="8" fill="#ef4444"/>
    <path d="M25 -19 L25 -13 M25 -10 L25 -9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Dramatic Speech/Thought bubble outline connecting the shock -->
  <path d="M 85 95 Q 100 80 115 90" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.8"/>

</svg>