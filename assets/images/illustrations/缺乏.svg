<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="8" fill="#334155"/>
  
  <!-- Empty Wallet/Financial context -->
  <path d="M70 120h100v60c0 5-5 10-10 10H80c-5 0-10-5-10-10V120z" fill="#475569"/>
  <path d="M70 120h100v20H70z" fill="#64748b"/>
  <circle cx="120" cy="130" r="8" fill="#1e293b"/>
  
  <!-- The "Lack" - Empty Coin Slots/Empty Pockets -->
  <rect x="90" y="145" width="60" height="10" rx="2" fill="#0f172a"/>
  <rect x="90" y="160" width="60" height="10" rx="2" fill="#0f172a"/>
  
  <!-- Floating "Missing" elements (Abstracting the concept of 'lacking' through visual emptiness) -->
  <path d="M180 80l-10 10m10 0l-10-10" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 70l-15 15m15 0l-15-15" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative elements to ground the scene -->
  <circle cx="200" cy="40" r="15" fill="#f59e0b" opacity="0.2"/>
  <path d="M30 180h180" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Character hand reaching into empty space -->
  <path d="M150 180c-5-20-10-40-30-40s-25 20-25 40" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <circle cx="150" cy="180" r="10" fill="#fbbf24"/>
  
  <!-- Subtle glow -->
  <ellipse cx="120" cy="140" rx="40" ry="10" fill="#f59e0b" opacity="0.05"/>
</svg>