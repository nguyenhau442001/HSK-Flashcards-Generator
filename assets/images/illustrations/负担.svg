<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk/Environment -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="80" fill="#475569"/>
  <rect x="190" y="150" width="10" height="80" fill="#475569"/>
  
  <!-- The Burden (Stack of heavy books/files) -->
  <rect x="70" y="80" width="100" height="60" rx="4" fill="#fb923c"/>
  <rect x="75" y="70" width="90" height="10" rx="2" fill="#fbbf24"/>
  <rect x="80" y="60" width="80" height="10" rx="2" fill="#f59e0b"/>
  
  <!-- Character -->
  <g transform="translate(120, 140)">
    <!-- Body -->
    <path d="M-40 0 L40 0 L30 80 L-30 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-30" r="25" fill="#fde68a"/>
    <!-- Arms pushing down -->
    <path d="M-35 10 L-55 40 M35 10 L55 40" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Expression -->
    <line x1="-10" y1="-35" x2="-5" y2="-30" stroke="#1e293b" stroke-width="2"/>
    <line x1="5" y1="-35" x2="10" y2="-30" stroke="#1e293b" stroke-width="2"/>
    <path d="M-10 -20 Q0 -15 10 -20" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Sweat drop -->
    <path d="M20 -45 Q25 -35 20 -30 Q15 -35 20 -45" fill="#38bdf8"/>
  </g>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="100" r="100" fill="#fb923c" fill-opacity="0.05"/>
</svg>