<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Deep Slate Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  
  <!-- Ambient Warm Light from Above -->
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- Room Interior Background Props -->
  <!-- Bookshelf / Wall detail -->
  <path d="M30 60 H90 V65 H30 Z" fill="#334155" opacity="0.6" />
  <rect x="40" y="42" width="10" height="18" rx="2" fill="#38bdf8" opacity="0.4" />
  <rect x="52" y="38" width="8" height="22" rx="2" fill="#fb923c" opacity="0.5" />
  <rect x="62" y="45" width="12" height="15" rx="2" fill="#10b981" opacity="0.4" />

  <!-- Soft Window Silhouette -->
  <rect x="150" y="30" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <line x1="180" y1="30" x2="180" y2="110" stroke="#334155" stroke-width="2" />
  <line x1="150" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="2" />

  <!-- House Plant on Shelf -->
  <path d="M165 105 Q170 95 180 105 Z" fill="#10b981" />
  <path d="M172 105 Q178 90 188 102 Z" fill="#34d399" />
  <path d="M162 103 Q167 92 175 104 Z" fill="#059669" />
  <path d="M166 105 H184 L180 115 H170 Z" fill="#64748b" />

  <!-- Warm Wooden Table Surface -->
  <path d="M10 185 H230 V195 H10 Z" fill="#b45309" />
  <rect x="10" y="195" width="220" height="15" fill="#78350f" />
  <!-- Table Legs -->
  <rect x="30" y="210" width="12" height="30" fill="#451a03" />
  <rect x="198" y="210" width="12" height="30" fill="#451a03" />

  <!-- CHARACTER 1 (Left - Female "She" giving the flower) -->
  <g id="female-character">
    <!-- Body / Torso -->
    <path d="M65 140 Q65 125 75 120 L95 130 V185 H65 Z" fill="#38bdf8" />
    <!-- Head & Hair -->
    <circle cx="75" cy="100" r="16" fill="#fbcfe8" />
    <path d="M58 100 C58 80 92 80 92 100 C92 115 88 125 80 125 C70 125 65 110 58 100 Z" fill="#334155" />
    <!-- Friendly Face Profile -->
    <circle cx="82" cy="98" r="1.5" fill="#1e293b" />
    <path d="M84 103 Q87 106 90 103" stroke="#f43f5e" stroke-width="1.5" fill="none" stroke-linecap="round" />
    
    <!-- Arm reaching forward to give the flower -->
    <path d="M80 130 Q105 135 120 135" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="121" cy="135" r="5" fill="#fbcfe8" />
  </g>

  <!-- CHARACTER 2 (Right - Male "Me" receiving the flower) -->
  <g id="male-character">
    <!-- Body / Torso -->
    <path d="M175 140 Q175 125 165 120 L145 130 V185 H175 Z" fill="#fb923c" />
    <!-- Head & Hair -->
    <circle cx="165" cy="100" r="16" fill="#fed7aa" />
    <path d="M150 95 C150 82 180 82 180 95 C180 98 175 102 170 102 C160 102 155 95 150 95 Z" fill="#78350f" />
    <!-- Friendly Face Profile -->
    <circle cx="158" cy="98" r="1.5" fill="#1e293b" />
    <path d="M151 103 Q154 106 157 103" stroke="#f43f5e" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Arm reaching forward to receive -->
    <path d="M160 130 Q140 135 125 135" stroke="#fb923c" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="124" cy="135" r="5" fill="#fed7aa" />
  </g>

  <!-- THE CENTRAL FLOWER (Target Object: "花" - huā) -->
  <g id="target-flower">
    <!-- Stem & Leaves -->
    <path d="M122 155 Q120 145 122 135" stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M121 148 Q114 145 112 149 Q116 153 121 148 Z" fill="#10b981" />
    <path d="M122 142 Q128 139 130 143 Q126 147 122 142 Z" fill="#34d399" />

    <!-- Flower Petals (Bright, beautiful red-pink bloom) -->
    <circle cx="122" cy="120" r="5" fill="url(#petalGrad)" />
    <circle cx="112" cy="123" r="5" fill="url(#petalGrad)" />
    <circle cx="115" cy="132" r="5" fill="url(#petalGrad)" />
    <circle cx="129" cy="132" r="5" fill="url(#petalGrad)" />
    <circle cx="132" cy="123" r="5" fill="url(#petalGrad)" />
    
    <!-- Flower Center (Golden Stamen) -->
    <circle cx="122" cy="126" r="4.5" fill="#fbbf24" />
    <circle cx="122" cy="126" r="2" fill="#d97706" />
  </g>

  <!-- Additional Foreground Details (Coffee Cup on Table for real-world context) -->
  <g id="coffee-mug">
    <rect x="185" y="165" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M201 170 C207 170 207 180 201 182" stroke="#f8fafc" stroke-width="2.5" fill="none" />
    <ellipse cx="193" cy="165" rx="8" ry="2.5" fill="#cbd5e1" />
  </g>
</svg>