<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Shanghai Skyline Silhouette -->
  <path d="M160 180 L160 120 L175 110 L190 120 L190 180 Z" fill="#334155"/>
  <path d="M195 180 L195 100 L215 90 L235 100 L235 180 Z" fill="#475569"/>
  <circle cx="215" cy="95" r="3" fill="#fbbf24"/>
  
  <!-- Desk/Office Context -->
  <rect x="20" y="160" width="120" height="10" fill="#334155" rx="2"/>
  <rect x="30" y="170" width="10" height="30" fill="#1e293b"/>
  <rect x="120" y="170" width="10" height="30" fill="#1e293b"/>
  
  <!-- Relocation Props -->
  <rect x="40" y="130" width="40" height="30" fill="#fb923c" rx="4"/>
  <path d="M45 130 L45 120 L55 120 L55 130" stroke="#fb923c" stroke-width="4" fill="none"/>
  
  <!-- Character -->
  <g transform="translate(70, 100)">
    <!-- Body -->
    <path d="M20 80 L60 80 L55 40 L25 40 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="40" cy="30" r="15" fill="#fde68a"/>
    <!-- Arm pointing -->
    <path d="M55 50 L80 40" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Suitcase Handle -->
    <rect x="10" y="50" width="10" height="20" fill="#ec4899" rx="2"/>
  </g>
  
  <!-- Travel/Movement Lines -->
  <path d="M90 60 Q120 40 150 70" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  
  <!-- Window Frame -->
  <rect x="10" y="10" width="220" height="220" rx="14" stroke="#334155" stroke-width="4" fill="none"/>
</svg>