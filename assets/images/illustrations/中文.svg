<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Lantern Gradient -->
    <linearGradient id="lanternGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Ceramic Teapot & Cup Gradient -->
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Open Scroll Paper Gradient -->
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Brush Handle Gradient -->
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Window Frame & Lantern) -->
  <g opacity="0.6">
    <!-- Circular Moon Window Outline -->
    <circle cx="120" cy="110" r="95" fill="none" stroke="#334155" stroke-width="3" />
    <circle cx="120" cy="110" r="90" fill="#090d16" />
    
    <!-- Bamboo Silhouette outside window -->
    <path d="M70,150 Q75,110 65,70 M68,110 L60,105 M72,90 L80,85" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M170,160 Q165,120 175,70 M168,130 L178,125 M172,95 L164,90" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Glowing Red/Gold Lantern hanging -->
    <path d="M120,15 L120,40" stroke="#64748b" stroke-width="2" />
    <path d="M105,40 L135,40 L140,75 L100,75 Z" fill="url(#lanternGrad)" filter="url(#glow)"/>
    <ellipse cx="120" cy="40" rx="15" ry="4" fill="#f59e0b"/>
    <ellipse cx="120" cy="75" rx="20" ry="5" fill="#f59e0b"/>
    <path d="M120,75 L120,95" stroke="#ef4444" stroke-width="2" />
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 0,165 Q 120,155 240,165 L 240,240 L 0,240 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <!-- Desk edge highlight -->
  <path d="M 0,165 Q 120,155 240,165" fill="none" stroke="#475569" stroke-width="2" opacity="0.8"/>

  <!-- Main Focal Point: Open Traditional Scroll & Calligraphy Station -->
  <g transform="translate(0, 15)" filter="url(#shadow)">
    <!-- Scroll Paper Base (Angled gracefully) -->
    <g transform="rotate(-6, 120, 135)">
      <!-- Left & Right Wooden Scroll Rollers -->
      <rect x="55" y="100" width="14" height="75" rx="7" fill="#b45309" />
      <circle cx="62" cy="97" r="8" fill="#d97706" />
      <circle cx="62" cy="178" r="8" fill="#d97706" />

      <rect x="171" y="90" width="14" height="75" rx="7" fill="#b45309" />
      <circle cx="178" cy="87" r="8" fill="#d97706" />
      <circle cx="178" cy="168" r="8" fill="#d97706" />

      <!-- Scroll Parchment Sheet -->
      <path d="M 62,102 Q 120,92 178,92 L 178,167 Q 120,177 62,177 Z" fill="url(#scrollGrad)" />

      <!-- Artistic Calligraphy Strokes (Abstract cultural representation of learning writing, NO actual valid characters) -->
      <g stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Dynamic brush strokes representing learning character structure -->
        <path d="M 85,120 Q 95,115 110,125" stroke-width="5" />
        <path d="M 98,110 L 95,150" stroke-width="6" />
        <path d="M 80,145 Q 98,140 115,148" stroke-width="4" />
        
        <!-- Second character brush cluster -->
        <path d="M 130,115 L 155,112" stroke-width="5" />
        <path d="M 142,108 L 138,155" stroke-width="6" />
        <path d="M 128,135 Q 142,130 160,138" stroke-width="4" />
        <path d="M 132,152 Q 145,162 158,150" stroke-width="5" />
      </g>

      <!-- Red Seal Stamp (Traditional chop) -->
      <rect x="150" y="142" width="16" height="16" rx="2" fill="#dc2626" opacity="0.85" />
      <rect x="153" y="145" width="10" height="10" fill="none" stroke="#fefce8" stroke-width="1.5" opacity="0.9" />
    </g>
  </g>

  <!-- Interactive Learning & Cultural Props (Teapot, Teacup, Inkstone) -->
  <!-- Ceramic Teapot on the left -->
  <g transform="translate(35, 145)" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="20" cy="22" rx="14" ry="12" fill="url(#ceramicGrad)" />
    <path d="M 10,20 Q 3,10 5,5 Q 10,2 15,12 Z" fill="url(#ceramicGrad)" /> <!-- Spout -->
    <path d="M 28,18 Q 36,18 34,28 Q 32,32 28,30" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" /> <!-- Handle -->
    <ellipse cx="20" cy="10" rx="6" ry="2" fill="#94a3b8" /> <!-- Lid -->
    <circle cx="20" cy="7" r="2" fill="#f59e0b" />
  </g>

  <!-- Teacup -->
  <g transform="translate(15, 175)" filter="url(#shadow)">
    <path d="M 8,5 L 12,22 C 12,24 18,24 18,22 L 22,5 Z" fill="url(#ceramicGrad)" />
    <ellipse cx="15" cy="5" rx="7" ry="2.5" fill="#f1f5f9" />
    <!-- Tea Liquid Inside -->
    <ellipse cx="15" cy="6" rx="5" ry="1.5" fill="#d97706" opacity="0.8" />
  </g>

  <!-- Inkstone & Traditional Calligraphy Brush resting -->
  <g transform="translate(150, 135)" filter="url(#shadow)">
    <!-- Inkstone Tray -->
    <ellipse cx="30" cy="35" rx="22" ry="10" fill="#334155" />
    <ellipse cx="25" cy="34" rx="14" ry="6" fill="#0f172a" />
    <ellipse cx="23" cy="33" rx="10" ry="4" fill="#1e293b" /> <!-- Wet ink pool -->

    <!-- Bamboo Brush laid across -->
    <g transform="rotate(-25, 30, 25)">
      <rect x="0" y="22" width="55" height="4" rx="2" fill="url(#brushGrad)" />
      <!-- Brush tip -->
      <path d="M 55,21 Q 65,24 55,27 Z" fill="#1e293b" />
      <path d="M 0,22 L -5,24 L 0,26 Z" fill="#94a3b8" /> <!-- End cap -->
    </g>
  </g>

  <!-- Floating Sparkles / Ambient Learning Energy (Golden and Cyan accents) -->
  <g filter="url(#glow)">
    <circle cx="50" cy="75" r="3" fill="#fcd34d" opacity="0.9" />
    <circle cx="195" cy="115" r="2.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="170" cy="50" r="4" fill="#fbbf24" opacity="0.7" />
    <circle cx="90" cy="60" r="2" fill="#34d399" opacity="0.9" />
    
    <!-- Four-point star accents -->
    <path d="M 125,50 Q 125,58 133,58 Q 125,58 125,66 Q 125,58 117,58 Q 125,58 125,50 Z" fill="#fef08a" opacity="0.9"/>
    <path d="M 40,110 Q 40,114 44,114 Q 40,114 40,118 Q 40,114 36,114 Q 40,114 40,110 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Frame Border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
</svg>