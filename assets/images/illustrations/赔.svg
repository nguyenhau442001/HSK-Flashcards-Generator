<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Broken Vase Fragments -->
  <path d="M70 160 L60 140 L80 135 L90 155 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M85 160 L95 145 L105 160 Z" fill="#ec4899" opacity="0.6"/>
  
  <!-- Character 1 (The one who broke it - apologetic) -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M10 40 Q20 60 30 40" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <rect x="10" y="35" width="20" height="40" rx="5" fill="#38bdf8"/>
    <path d="M5 40 L0 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 40 L40 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (The owner - receiving compensation) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <rect x="10" y="35" width="20" height="40" rx="5" fill="#10b981"/>
    <path d="M5 40 L0 60" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 40 L40 60" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Compensation Action (Money/Envelope) -->
  <rect x="95" y="110" width="40" height="25" rx="3" fill="#f59e0b"/>
  <rect x="100" y="115" width="30" height="5" rx="1" fill="#0f172a"/>
  
  <!-- Decorative Background Elements -->
  <circle cx="200" cy="40" r="3" fill="#334155"/>
  <circle cx="40" cy="30" r="2" fill="#334155"/>
  <path d="M180 180 L220 180" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
</svg>