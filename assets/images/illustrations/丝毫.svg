<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Glow Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Desk Lamp Cone Light -->
    <linearGradient id="lamp-cone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment: Cozy Study/Office Interior -->
  <!-- Wall & Window -->
  <rect x="20" y="25" width="200" height="150" fill="#1e293b" />
  <rect x="35" y="40" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <rect x="39" y="44" width="52" height="72" fill="url(#window-glow)" />
  <!-- Window frames -->
  <line x1="65" y1="40" x2="65" y2="112" stroke="#334155" stroke-width="2" />
  <line x1="35" y1="76" x2="95" y2="76" stroke="#334155" stroke-width="2" />
  <!-- Raindrops outside window -->
  <line x1="45" y1="50" x2="43" y2="58" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="60" y1="85" x2="58" y2="93" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="80" y1="60" x2="78" y2="68" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Bookshelf Background Props -->
  <rect x="180" y="50" width="30" height="70" fill="#0f172a" />
  <rect x="184" y="60" width="22" height="6" fill="#3b82f6" opacity="0.6" />
  <rect x="184" y="75" width="22" height="6" fill="#10b981" opacity="0.6" />
  <rect x="184" y="90" width="22" height="6" fill="#f59e0b" opacity="0.6" />

  <!-- Desk Surface -->
  <rect x="10" y="165" width="220" height="12" rx="3" fill="#334155" filter="url(#soft-shadow)" />
  <rect x="15" y="177" width="210" height="40" fill="#0f172a" />

  <!-- Desk Lamp -->
  <path d="M 195,165 L 195,120 L 175,100 L 185,95 L 200,118 L 200,165 Z" fill="#64748b" />
  <!-- Lamp Head -->
  <path d="M 160,85 L 190,85 L 180,105 L 170,105 Z" fill="#fbbf24" />
  <!-- Light Cone -->
  <polygon points="175,105 130,170 190,170" fill="url(#lamp-cone)" />

  <!-- Laptop / Computer Screen (Glowing Accent) -->
  <path d="M 85,130 L 135,130 L 140,165 L 80,165 Z" fill="#334155" />
  <path d="M 88,133 L 132,133 L 136,162 L 84,162 Z" fill="#0f172a" />
  <ellipse cx="110" cy="147" rx="12" ry="8" fill="#38bdf8" opacity="0.2" />
  <!-- Laptop Keyboard Base -->
  <path d="M 65,165 L 155,165 L 165,172 L 55,172 Z" fill="#64748b" />

  <!-- Main Character (Calm, Unbothered, Relaxed Posture) -->
  <!-- Chair Back -->
  <path d="M 115,90 L 145,90 L 142,165 L 118,165 Z" fill="#3b82f6" opacity="0.2" rx="6" />

  <!-- Character Body & Hoodie (Muted Warm Navy / Slate Blue) -->
  <path d="M 105,120 Q 130,115 150,135 L 155,170 L 100,170 Z" fill="#3b82f6" filter="url(#soft-shadow)" />
  <!-- Hoodie Hood / Shoulders -->
  <path d="M 110,118 Q 130,110 150,118 L 155,130 Q 130,122 105,130 Z" fill="#2563eb" />

  <!-- Character Neck & Head -->
  <rect x="123" y="102" width="14" height="18" fill="#fbcfe8" rx="4" />
  <circle cx="130" cy="92" r="16" fill="#fbcfe8" />

  <!-- Hair (Modern Stylized Cut) -->
  <path d="M 114,90 Q 130,76 146,90 Q 148,80 138,78 Q 130,75 120,78 Q 112,82 114,90 Z" fill="#334155" />

  <!-- Facial Expression (Calm, Dismissive of Drama, Unbothered) -->
  <!-- Peaceful Eyes (Closed or relaxed gentle lines) -->
  <path d="M 124,91 Q 127,94 130,91" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M 134,91 Q 137,94 140,91" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Subtle Neutral/Slight Smile Mouth -->
  <path d="M 129,98 Q 132,100 135,98" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Cute Blush -->
  <circle cx="123" cy="96" r="2" fill="#f43f5e" opacity="0.3" />
  <circle cx="141" cy="96" r="2" fill="#f43f5e" opacity="0.3" />

  <!-- Relaxed Hand Gesturing "Not a big deal / Doesn't matter at all" -->
  <path d="M 148,130 Q 162,125 168,135 Q 172,142 165,145" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Palm/Fingers flicking away -->
  <circle cx="168" cy="135" r="4" fill="#fbcfe8" />

  <!-- Foreground Props: Coffee Mug (Cozy atmosphere) -->
  <path d="M 70,150 L 85,150 L 83,165 L 72,165 Z" fill="#f8fafc" />
  <path d="M 85,153 Q 90,153 90,157 Q 90,161 85,161" fill="none" stroke="#f8fafc" stroke-width="2" />
  <!-- Steam from coffee -->
  <path d="M 74,142 Q 77,137 74,132" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />
  <path d="M 80,140 Q 83,135 80,130" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />

  <!-- Environmental Accent: Floating minimal particles representing triviality/insignificance being brushed away -->
  <circle cx="178" cy="122" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="188" cy="112" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="195" cy="130" r="1.5" fill="#f43f5e" opacity="0.7" />
  <!-- Tiny motion arc lines showing dismissing gesture -->
  <path d="M 172,120 Q 182,118 190,125" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />

</svg>