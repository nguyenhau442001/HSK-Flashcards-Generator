<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- TV Screen Glow & Gradient -->
    <linearGradient id="tv-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Stage / Show Highlight Gradient -->
    <linearGradient id="show-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Lamp Light Gradient -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Characters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Wall & Floor Structure -->
  <!-- Back wall -->
  <rect x="0" y="0" width="240" height="180" fill="#1e293b"/>
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a"/>
  <!-- Floor line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>

  <!-- Background Environment & Props -->
  <!-- Window showing night city -->
  <g transform="translate(160, 25)">
    <rect width="50" height="70" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <line x1="25" y1="0" x2="25" y2="70" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="35" x2="50" y2="35" stroke="#475569" stroke-width="1.5"/>
    <!-- City lights outside -->
    <rect x="8" y="15" width="4" height="8" fill="#fbbf24" opacity="0.6"/>
    <rect x="15" y="45" width="5" height="12" fill="#38bdf8" opacity="0.5"/>
    <rect x="35" y="20" width="6" height="15" fill="#f43f5e" opacity="0.5"/>
    <rect x="38" y="50" width="4" height="10" fill="#fbbf24" opacity="0.4"/>
    <!-- Moon -->
    <circle cx="40" cy="10" r="4" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Bookshelf / Plant in Background -->
  <g transform="translate(20, 40)">
    <rect x="0" y="0" width="30" height="100" fill="#334155" rx="2"/>
    <!-- Shelves -->
    <line x1="0" y1="30" x2="30" y2="30" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="65" x2="30" y2="65" stroke="#475569" stroke-width="2"/>
    <!-- Plant on top shelf -->
    <path d="M10 30 Q12 15 20 18 Q16 22 18 30 Z" fill="#10b981"/>
    <circle cx="15" cy="22" r="6" fill="#059669"/>
    <!-- Books on bottom shelf -->
    <rect x="5" y="45" width="4" height="20" fill="#38bdf8" rx="1"/>
    <rect x="10" y="42" width="6" height="23" fill="#f43f5e" rx="1"/>
    <rect x="17" y="48" width="5" height="17" fill="#fbbf24" rx="1"/>
  </g>

  <!-- Living Room TV Unit & Entertainment Center -->
  <g transform="translate(45, 95)">
    <!-- TV Stand -->
    <rect x="10" y="70" width="130" height="18" rx="2" fill="#334155"/>
    <rect x="25" y="88" width="6" height="17" fill="#1e293b"/>
    <rect x="119" y="88" width="6" height="17" fill="#1e293b"/>

    <!-- TV Frame -->
    <rect x="20" y="5" width="110" height="68" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
    <!-- TV Screen -->
    <rect x="23" y="8" width="104" height="62" rx="3" fill="url(#tv-screen)"/>

    <!-- TV Show Content (The 'Jiémù' / Program graphics) -->
    <!-- Stage spotlight effect inside TV -->
    <path d="M75 8 L40 70 L110 70 Z" fill="url(#show-glow)"/>
    <!-- Performer / Dancer icon inside TV screen -->
    <circle cx="75" cy="30" r="6" fill="#f59e0b"/>
    <path d="M75 38 Q75 50 65 65 L70 65 Q77 50 80 45 L85 65 L90 65 Q80 50 75 38 Z" fill="#ec4899"/>
    <!-- Floating musical notes / excitement stars inside TV -->
    <circle cx="50" cy="25" r="1.5" fill="#38bdf8"/>
    <path d="M100 20 L102 24 L106 25 L103 28 L104 32 L100 30 L96 32 L97 28 L94 25 L98 24 Z" fill="#fbbf24" transform="scale(0.3) translate(240, 20)"/>
    <circle cx="95" cy="45" r="1.5" fill="#10b981"/>

    <!-- TV Stand Deco Items -->
    <!-- Small lamp on TV console -->
    <path d="M112 60 L118 60 L116 70 L114 70 Z" fill="#64748b"/>
    <path d="M110 55 Q115 50 120 55 L118 60 L112 60 Z" fill="#fbbf24"/>
    <!-- Small plant on console -->
    <rect x="28" y="62" width="8" height="8" rx="1" fill="#cbd5e1"/>
    <circle cx="32" cy="58" r="5" fill="#10b981"/>
  </g>

  <!-- Cozy Floor Lamp (Left) casting warm light -->
  <circle cx="30" cy="110" r="50" fill="url(#lamp-glow)" pointer-events="none"/>
  <g transform="translate(15, 110)">
    <line x1="15" y1="70" x2="15" y2="160" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 25 L25 25 L20 40 L10 40 Z" fill="#fbbf24"/>
    <path d="M15 70 C5 70 0 100 0 110 C0 115 5 115 5 115 C5 115 8 80 15 80 Z" fill="#0f172a" opacity="0.3"/> <!-- Base -->
    <ellipse cx="15" cy="115" rx="12" ry="4" fill="#334155"/>
  </g>

  <!-- Characters (Enjoying the evening show together) -->
  <g filter="url(#shadow)">
    <!-- Sofa -->
    <path d="M75 160 Q75 135 100 135 L190 135 Q215 135 215 160 L220 200 L70 200 Z" fill="#3b82f6"/>
    <!-- Sofa Cushions & Backrest -->
    <rect x="80" y="138" width="130" height="45" rx="8" fill="#2563eb"/>
    <line x1="145" y1="138" x2="145" y2="183" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
    <!-- Sofa Base / Legs -->
    <rect x="75" y="195" width="140" height="12" rx="4" fill="#1d4ed8"/>
    <rect x="85" y="207" width="6" height="12" fill="#0f172a"/>
    <rect x="199" y="207" width="6" height="12" fill="#0f172a"/>

    <!-- Character 1 (Left: Woman smiling, pointing/gesturing excitedly at the TV) -->
    <g transform="translate(90, 110)">
      <!-- Body & Torso -->
      <path d="M15 35 Q15 25 25 25 L45 25 Q55 25 55 35 L50 75 L20 75 Z" fill="#ec4899"/>
      <!-- Collar -->
      <path d="M25 25 L35 33 L45 25 Z" fill="#fbcfe8"/>
      <!-- Head & Hair -->
      <circle cx="35" cy="12" r="11" fill="#fde047"/> <!-- Face skin tone proxy or hair base -->
      <path d="M24 10 C24 4 30 1 35 1 C40 1 46 4 46 10 C46 15 42 22 35 22 C28 22 24 15 24 10 Z" fill="#332922"/> <!-- Dark hair -->
      <circle cx="35" cy="13" r="10" fill="#fbcfe8"/> <!-- Face -->
      <!-- Hair bun / ponytail -->
      <circle cx="35" cy="-2" r="5" fill="#332922"/>
      <!-- Eyes & Happy Expression (Looking at TV) -->
      <path d="M31 12 Q33 10 35 12" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M37 12 Q39 10 41 12" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Smiling open mouth -->
      <path d="M34 16 Q36 19 38 16" fill="#e11d48"/>
      <!-- Arm pointing excitedly towards TV -->
      <path d="M48 35 L68 28 L66 24 L47 31 Z" fill="#ec4899"/>
      <circle cx="68" cy="26" r="3" fill="#fbcfe8"/> <!-- Hand -->
    </g>

    <!-- Character 2 (Right: Man leaning back comfortably, smiling/clapping) -->
    <g transform="translate(145, 115)">
      <!-- Body & Torso -->
      <path d="M15 30 Q15 20 25 20 L55 20 Q65 20 65 30 L60 70 L20 70 Z" fill="#0ea5e9"/>
      <!-- Collar / Shirt details -->
      <path d="M32 20 L40 28 L48 20 Z" fill="#e0f2fe"/>
      <!-- Head & Hair -->
      <circle cx="40" cy="10" r="10" fill="#334155"/> <!-- Dark hair -->
      <circle cx="40" cy="12" r="9.5" fill="#fde68a"/> <!-- Face -->
      <!-- Glasses / Face details -->
      <circle cx="37" cy="11" r="2.5" fill="none" stroke="#1e293b" stroke-width="1"/>
      <circle cx="43" cy="11" r="2.5" fill="none" stroke="#1e293b" stroke-width="1"/>
      <line x1="39.5" y1="11" x2="40.5" y2="11" stroke="#1e293b" stroke-width="1"/>
      <!-- Smile -->
      <path d="M38 16 Q40 18 42 16" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Arm relaxed / gesturing -->
      <path d="M20 35 Q10 45 15 55" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" fill="none"/>
      <circle cx="15" cy="56" r="3" fill="#fde68a"/> <!-- Hand -->
    </g>
  </g>

  <!-- Coffee Table with Snacks / Drinks in foreground -->
  <g transform="translate(85, 185)">
    <!-- Table shadow -->
    <ellipse cx="40" cy="18" rx="45" ry="10" fill="#000000" opacity="0.3"/>
    <!-- Table Top (Oval wooden) -->
    <ellipse cx="40" cy="15" rx="45" ry="12" fill="#b45309"/>
    <ellipse cx="40" cy="13" rx="43" ry="10" fill="#d97706"/>
    <!-- Table Legs -->
    <path d="M10 18 L5 32 L8 33 L13 19 Z" fill="#78350f"/>
    <path d="M70 18 L75 32 L72 33 L67 19 Z" fill="#78350f"/>

    <!-- Snack bowl / Cup on table -->
    <path d="M30 10 Q30 5 40 5 Q50 5 50 10 Z" fill="#f8fafc"/>
    <ellipse cx="40" cy="10" rx="10" ry="3" fill="#cbd5e1"/>
    <!-- Popcorn / Snacks inside bowl -->
    <circle cx="37" cy="7" r="3" fill="#fef08a"/>
    <circle cx="42" cy="6" r="3.5" fill="#fef08a"/>
    <circle cx="40" cy="8" r="3" fill="#fef08a"/>
  </g>

  <!-- Ambient lighting highlights and atmosphere particles -->
  <circle cx="190" cy="80" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="175" cy="65" r="1" fill="#38bdf8" opacity="0.5"/>
  <circle cx="60" cy="70" r="1.5" fill="#ec4899" opacity="0.4"/>
</svg>