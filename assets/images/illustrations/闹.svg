<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window Frame -->
  <rect x="140" y="40" width="80" height="160" rx="4" fill="#334155" stroke="#475569" stroke-width="4"/>
  <line x1="180" y1="40" x2="180" y2="200" stroke="#475569" stroke-width="4"/>
  
  <!-- Outside Noise (Stylized sound waves/activity) -->
  <path d="M150 80 Q160 70 170 80 T190 80" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M155 110 Q165 100 175 110 T195 110" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="205" cy="140" r="6" fill="#fbbf24"/>
  <circle cx="160" cy="160" r="4" fill="#38bdf8"/>
  
  <!-- Desk and Subject -->
  <rect x="20" y="140" width="100" height="10" rx="2" fill="#64748b"/>
  <rect x="30" y="150" width="10" height="90" fill="#475569"/>
  <rect x="100" y="150" width="10" height="90" fill="#475569"/>
  
  <!-- Character -->
  <circle cx="70" cy="100" r="25" fill="#f1f5f9"/>
  <path d="M55 125 Q70 140 85 125" fill="#f1f5f9"/>
  <rect x="45" y="125" width="50" height="60" rx="10" fill="#38bdf8"/>
  
  <!-- Expression: Frustrated/Distracted -->
  <line x1="58" y1="95" x2="65" y2="102" stroke="#0f172a" stroke-width="2"/>
  <line x1="65" y1="95" x2="58" y2="102" stroke="#0f172a" stroke-width="2"/>
  <line x1="75" y1="95" x2="82" y2="102" stroke="#0f172a" stroke-width="2"/>
  <line x1="82" y1="95" x2="75" y2="102" stroke="#0f172a" stroke-width="2"/>
  <path d="M60 112 Q70 108 80 112" stroke="#0f172a" stroke-width="2" fill="none"/>
  
  <!-- Hands covering ears -->
  <circle cx="40" cy="100" r="10" fill="#f1f5f9"/>
  <circle cx="100" cy="100" r="10" fill="#f1f5f9"/>
  
  <!-- Laptop/Book on desk -->
  <rect x="40" y="145" width="60" height="40" rx="2" fill="#cbd5e1"/>
  <rect x="45" y="150" width="50" height="30" fill="#1e293b"/>
  
  <!-- Ambient light glow -->
  <circle cx="70" cy="100" r="40" fill="#fbbf24" opacity="0.05"/>
</svg>