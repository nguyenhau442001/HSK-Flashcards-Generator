<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 190 C 80 180, 160 200, 240 190 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Characters (The Team) -->
  <!-- Person 1 -->
  <g transform="translate(40, 150)">
    <circle cx="10" cy="-30" r="8" fill="#fbbf24"/>
    <path d="M2 0 L 18 0 L 15 40 L 5 40 Z" fill="#38bdf8"/>
    <path d="M5 40 L 5 60 M15 40 L 15 60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(80, 140)">
    <circle cx="10" cy="-30" r="8" fill="#fbbf24"/>
    <path d="M2 0 L 18 0 L 15 40 L 5 40 Z" fill="#10b981"/>
    <path d="M5 40 L 5 60 M15 40 L 15 60" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(120, 130)">
    <circle cx="10" cy="-30" r="8" fill="#fbbf24"/>
    <path d="M2 0 L 18 0 L 15 40 L 5 40 Z" fill="#ec4899"/>
    <path d="M5 40 L 5 60 M15 40 L 15 60" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 4 -->
  <g transform="translate(160, 120)">
    <circle cx="10" cy="-30" r="8" fill="#fbbf24"/>
    <path d="M2 0 L 18 0 L 15 40 L 5 40 Z" fill="#fb923c"/>
    <path d="M5 40 L 5 60 M15 40 L 15 60" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Motion lines -->
  <path d="M180 100 L 200 100 M190 90 L 210 90 M185 110 L 205 110" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Background elements -->
  <circle cx="200" cy="50" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="190" width="200" height="2" fill="#475569"/>
</svg>