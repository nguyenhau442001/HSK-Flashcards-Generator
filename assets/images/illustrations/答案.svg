<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Decorative ambient glow -->
  <circle cx="100" cy="100" r="60" fill="#38bdf8" opacity="0.08"/>

  <!-- Clipboard / Document Base representing a test or question sheet -->
  <g transform="translate(45, 30)">
    <!-- Clipboard Shadow -->
    <rect x="5" y="5" width="100" height="130" rx="8" fill="#0f172a" opacity="0.5"/>
    <!-- Clipboard Paper -->
    <rect x="0" y="0" width="100" height="130" rx="8" fill="#f8fafc"/>
    
    <!-- Clip at top -->
    <rect x="32" y="-6" width="36" height="14" rx="4" fill="#64748b"/>
    <rect x="38" y="-3" width="24" height="6" rx="2" fill="#94a3b8"/>

    <!-- Question lines (muted gray) -->
    <rect x="16" y="22" width="50" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="16" y="36" width="35" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Incorrect/Unsolved item with cross -->
    <rect x="16" y="56" width="30" height="6" rx="3" fill="#e2e8f0"/>
    <circle cx="78" cy="59" r="8" fill="#fef2f2"/>
    <path d="M75 56 L81 62 M81 56 L75 62" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

    <!-- Highlighted Answer Area (The focus: 答案) -->
    <rect x="12" y="78" width="86" height="40" rx="6" fill="#f0fdf4"/>
    <rect x="16" y="90" width="40" height="8" rx="4" fill="#86efac"/>
    
    <!-- Glowing Checkmark Badge representing the correct Answer -->
    <circle cx="78" cy="98" r="14" fill="#10b981"/>
    <path d="M71 98 L76 103 L85 93" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Sparkles / Accents for success/discovery of the answer -->
  <g transform="translate(140, 50)">
    <path d="M0 10 C5 10 10 5 10 0 C10 5 15 10 20 10 C15 10 10 15 10 20 C10 15 5 10 0 10 Z" fill="#f59e0b"/>
  </g>
  <g transform="translate(28, 125) scale(0.6)">
    <path d="M0 10 C5 10 10 5 10 0 C10 5 15 10 20 10 C15 10 10 15 10 20 C10 15 5 10 0 10 Z" fill="#38bdf8"/>
  </g>

  <!-- Glowing Pencil/Pen writing the answer -->
  <g transform="translate(125, 120) rotate(-45)">
    <!-- Pencil Body -->
    <path d="M0 0 L12 -12 L22 -2 L10 10 Z" fill="#fb923c"/>
    <!-- Pencil Tip -->
    <path d="M0 0 L-6 6 L-2 10 L4 4 Z" fill="#cbd5e1"/>
    <!-- Pencil Lead -->
    <path d="M0 0 L-6 6 L-4 8 Z" fill="#0f172a"/>
    <!-- Eraser/Metal Band -->
    <rect x="12" y="-12" width="6" height="6" transform="rotate(45 15 -9)" fill="#94a3b8"/>
    <rect x="15" y="-15" width="5" height="6" transform="rotate(45 17.5 -12)" fill="#f43f5e"/>
  </g>
</svg>