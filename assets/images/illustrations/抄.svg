<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Desk Surface -->
    <rect x="0" y="100" width="160" height="20" rx="4" fill="#334155"/>
    
    <!-- Open Notebook -->
    <path d="M20 40 L140 40 L130 110 L10 110 Z" fill="#f8fafc"/>
    <path d="M75 40 L75 110" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="25" y1="55" x2="65" y2="55" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="70" x2="65" y2="70" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="55" x2="125" y2="55" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="70" x2="125" y2="70" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Source Paper -->
    <rect x="110" y="10" width="60" height="80" rx="2" fill="#fbbf24"/>
    <line x1="120" y1="25" x2="150" y2="25" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="40" x2="150" y2="40" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Hand holding pen -->
    <path d="M80 90 C80 70, 90 60, 100 60 L110 80 L90 100 Z" fill="#fde68a"/>
    <path d="M105 75 L125 55" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="125" cy="55" r="3" fill="#38bdf8"/>
    
    <!-- Motion lines -->
    <path d="M110 50 Q120 45 130 50" stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Ambient light -->
  <circle cx="180" cy="50" r="40" fill="#f59e0b" opacity="0.1"/>
</svg>