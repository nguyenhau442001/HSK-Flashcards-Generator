<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- House (The Reference Point) -->
  <rect x="20" y="90" width="80" height="90" fill="#fbbf24" rx="4"/>
  <rect x="35" y="110" width="20" height="30" fill="#0f172a"/>
  <rect x="65" y="110" width="20" height="30" fill="#0f172a"/>
  <path d="M20 90 L60 50 L100 90 Z" fill="#ec4899"/>
  
  <!-- School (The Subject) -->
  <rect x="140" y="100" width="70" height="80" fill="#38bdf8" rx="4"/>
  <rect x="150" y="120" width="50" height="50" fill="#0f172a"/>
  <rect x="165" y="120" width="20" height="50" fill="#1e293b"/>
  <rect x="140" y="90" width="70" height="10" fill="#10b981"/>
  
  <!-- Path connecting them to show proximity -->
  <path d="M100 170 L140 170" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6 6"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="15" fill="#fb923c"/>
  <path d="M180 180 L185 160 L190 180 Z" fill="#10b981"/>
  <path d="M195 180 L200 155 L205 180 Z" fill="#10b981"/>
  <path d="M30 180 L35 165 L40 180 Z" fill="#10b981"/>
</svg>