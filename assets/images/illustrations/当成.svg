<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="90" fill="#334155"/>
  <rect x="190" y="150" width="10" height="90" fill="#334155"/>
  
  <!-- Person A (The one being treated like a child) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#fde68a"/>
    <path d="M10 25 q10 5 20 0" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="2" fill="#1e293b"/>
    <circle cx="28" cy="15" r="2" fill="#1e293b"/>
    <path d="M0 40 l10 60 l-10 20 m40 0 l-10 -20 l10 -60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <rect x="5" y="40" width="30" height="40" rx="5" fill="#38bdf8"/>
    <!-- Gesture: Hand pushing away -->
    <path d="M40 60 l20 -10" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Person B (The one holding the toy) -->
  <g transform="translate(40, 90)">
    <circle cx="20" cy="20" r="20" fill="#fecaca"/>
    <circle cx="12" cy="15" r="2" fill="#1e293b"/>
    <circle cx="28" cy="15" r="2" fill="#1e293b"/>
    <path d="M15 25 q5 5 10 0" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="5" y="40" width="30" height="60" rx="5" fill="#fb923c"/>
    <!-- Holding a rattle/toy -->
    <circle cx="45" cy="50" r="10" fill="#ec4899"/>
    <rect x="42" y="60" width="6" height="20" fill="#fbbf24"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="180" cy="60" r="2" fill="#38bdf8"/>
  <circle cx="30" cy="30" r="4" fill="#10b981"/>
</svg>