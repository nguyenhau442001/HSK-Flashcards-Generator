<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Indoor Wall Gradient -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Night Sky Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31103f" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <linearGradient id="indoor-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- Window Frame Wood Gradient -->
    <linearGradient id="wood-frame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    
    <linearGradient id="wood-frame-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Glass / Air Gradient -->
    <linearGradient id="glass-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25" />
    </linearGradient>

    <!-- House Plant Leaves -->
    <linearGradient id="leaf-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <linearGradient id="leaf-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Window Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Interior Wall Context -->
  <rect x="0" y="0" width="240" height="240" fill="url(#wall-grad)" />
  
  <!-- Wallpaper subtle pattern / texture lines -->
  <path d="M0 60 H240 M0 120 H240 M0 180 H240" stroke="#1e293b" stroke-width="2" opacity="0.4" />

  <!-- ==================== OUTSIDE SCENERY (Visible through the window) ==================== -->
  <g id="outside-scenery">
    <!-- Night Sky View -->
    <rect x="36" y="36" width="168" height="138" fill="url(#sky-grad)" />

    <!-- Stars -->
    <circle cx="60" cy="55" r="1.5" fill="#fff" opacity="0.8" />
    <circle cx="120" cy="48" r="1" fill="#38bdf8" opacity="0.9" />
    <circle cx="165" cy="65" r="1.5" fill="#fff" opacity="0.9" />
    <circle cx="185" cy="45" r="2" fill="#fde047" opacity="0.9" />
    <circle cx="90" cy="85" r="1" fill="#fff" opacity="0.6" />
    
    <!-- Crescent Moon -->
    <path d="M145 60 A 15 15 0 1 0 155 85 A 12 12 0 1 1 145 60 Z" fill="#fef08a" opacity="0.9" />

    <!-- Distant City Silhouette & Hills -->
    <path d="M36 145 L50 130 L65 140 L85 125 L100 135 L125 115 L145 130 L170 120 L190 135 L204 125 L204 174 L36 174 Z" fill="#0f172a" opacity="0.8" />
    <path d="M36 155 L70 142 L110 155 L160 138 L204 150 L204 174 L36 174 Z" fill="#090d16" />

    <!-- Distant glowing windows -->
    <rect x="55" y="138" width="4" height="6" fill="#fb923c" opacity="0.8" />
    <rect x="63" y="138" width="4" height="6" fill="#fde047" opacity="0.6" />
    <rect x="130" y="125" width="5" height="8" fill="#fb923c" opacity="0.9" />
    <rect x="175" y="130" width="4" height="5" fill="#38bdf8" opacity="0.7" />

    <!-- Fresh Air Swirls / Wind breeze lines representing 'chuānghu' airflow example -->
    <path d="M 45 90 Q 70 80 95 95 T 145 90" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 60 115 Q 85 105 110 120 T 160 115" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
    <path d="M 50 70 Q 65 62 80 72" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- ==================== WINDOW FRAME (The core subject '窗户') ==================== -->
  <g id="window-structure" filter="url(#drop-shadow)">
    <!-- Outer Window Sill (Bottom) -->
    <rect x="24" y="170" width="192" height="14" rx="3" fill="url(#wood-frame)" />
    <rect x="22" y="180" width="196" height="5" rx="2.5" fill="#78350f" />

    <!-- Outer Window Frame Outer Border -->
    <rect x="32" y="32" width="176" height="142" rx="6" fill="url(#wood-frame)" />
    
    <!-- Window Opening Inner Wall / Cavity Depth -->
    <rect x="36" y="36" width="168" height="134" fill="#1e293b" opacity="0.7" />

    <!-- Glass Pane Inner Reflections / Highlights -->
    <rect x="36" y="36" width="168" height="134" fill="url(#glass-glow)" />
    
    <!-- Diagonal Glass Glare -->
    <polygon points="36,36 75,36 36,95" fill="#ffffff" opacity="0.1" />
    <polygon points="165,170 204,110 204,170" fill="#ffffff" opacity="0.1" />

    <!-- Window Pane Dividers (Muntins / Crossbars) -->
    <!-- Vertical Center Bar -->
    <rect x="116" y="36" width="8" height="134" fill="url(#wood-frame-v)" />
    <rect x="117" y="36" width="2" height="134" fill="#fde047" opacity="0.3" /> <!-- highlight -->

    <!-- Horizontal Center Bar -->
    <rect x="36" y="99" width="168" height="8" fill="url(#wood-frame)" />
    <rect x="36" y="100" width="168" height="2" fill="#fde047" opacity="0.3" /> <!-- highlight -->

    <!-- Inner Frame Depth Bevels -->
    <rect x="32" y="32" width="176" height="142" rx="6" fill="none" stroke="#b45309" stroke-width="3" />
  </g>

  <!-- ==================== INTERIOR PROPS & CONTEXT ==================== -->
  
  <!-- Indoor Curtains (Left & Right) -->
  <g id="curtains">
    <!-- Left Curtain -->
    <path d="M 32 32 Q 15 80 25 130 Q 35 160 32 174 L 32 32 Z" fill="#ec4899" opacity="0.9" />
    <path d="M 32 32 Q 22 80 28 130 Q 32 160 32 174" fill="none" stroke="#be185d" stroke-width="2" opacity="0.8" />
    <!-- Left Curtain Folds -->
    <path d="M 32 32 Q 20 70 24 110 Q 28 150 25 174" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.6" />

    <!-- Right Curtain -->
    <path d="M 208 32 Q 225 80 215 130 Q 205 160 208 174 L 208 32 Z" fill="#ec4899" opacity="0.9" />
    <path d="M 208 32 Q 218 80 212 130 Q 208 160 208 174" fill="none" stroke="#be185d" stroke-width="2" opacity="0.8" />
    <!-- Right Curtain Folds -->
    <path d="M 208 32 Q 220 70 216 110 Q 212 150 215 174" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.6" />

    <!-- Curtain Rod -->
    <rect x="20" y="27" width="200" height="5" rx="2.5" fill="#64748b" />
    <circle cx="20" cy="29" r="4" fill="#475569" />
    <circle cx="220" cy="29" r="4" fill="#475569" />
  </g>

  <!-- Potted Plant on Window Sill (Adds life and environment scale) -->
  <g id="window-plant" transform="translate(145, 135)">
    <!-- Plant Pot -->
    <path d="M 8 20 L 22 20 L 26 35 L 4 35 Z" fill="#fb923c" />
    <ellipse cx="15" cy="20" rx="7" ry="2" fill="#ea580c" />
    <ellipse cx="15" cy="35" rx="11" ry="3" fill="#c2410c" opacity="0.4" />

    <!-- Leaves -->
    <!-- Leaf 1 (Blowing slightly in the fresh air) -->
    <path d="M 15 20 Q 5 5 0 2 Q 10 12 15 20 Z" fill="url(#leaf-grad-1)" />
    <!-- Leaf 2 -->
    <path d="M 15 20 Q 25 2 30 -2 Q 22 10 15 20 Z" fill="url(#leaf-grad-2)" />
    <!-- Leaf 3 (Center) -->
    <path d="M 15 20 Q 18 2 16 -8 Q 12 5 15 20 Z" fill="url(#leaf-grad-1)" />
    <!-- Leaf 4 (Drooping front) -->
    <path d="M 15 22 Q 28 18 32 25 Q 22 26 15 22 Z" fill="url(#leaf-grad-2)" />
  </g>

  <!-- Cute Coffee Mug on the windowsill -->
  <g id="coffee-mug" transform="translate(55, 148)">
    <!-- Mug Body -->
    <rect x="4" y="4" width="14" height="18" rx="3" fill="#38bdf8" />
    <path d="M 18 8 C 22 8 22 16 18 18" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Mug Inner/Rim -->
    <ellipse cx="11" cy="4" rx="5" ry="1.5" fill="#bae6fd" />
    <!-- Steam / Warmth lines -->
    <path d="M 9 0 Q 11 -3 9 -6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 13 -1 Q 15 -4 13 -7" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Indoor Light Glow washing over the sill -->
  <rect x="24" y="174" width="192" height="35" fill="url(#indoor-light)" style="mix-blend-mode: overlay;" />

  <!-- Soft Vignette / Frame Border overlay for polished finish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>