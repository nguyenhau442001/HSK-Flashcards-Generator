<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#121b2f" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Dark Alley Floor Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Flashlight Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="30%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.0" />
    </linearGradient>

    <!-- Lantern Glow Gradient -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Wall Brick Pattern Effect (subtle) -->
    <linearGradient id="wallLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wallRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ATMOSPHERIC BACKGROUND ELEMENTS -->
  <!-- Distant dark night sky / alley end -->
  <rect x="75" y="70" width="90" height="90" fill="#030712" />

  <!-- Left Wall -->
  <path d="M0,0 L75,70 L75,200 L0,220 Z" fill="url(#wallLeft)" />
  <!-- Left Wall Details: Brick Lines -->
  <path d="M0,40 L75,90 M0,80 L75,120 M0,120 L75,155 M0,160 L75,185" stroke="#090d16" stroke-width="2" opacity="0.6" />
  <!-- Window on Left Wall with eerie faint blue light -->
  <path d="M20,60 L45,75 L45,105 L20,90 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M25,70 L40,79 L40,95 L25,86 Z" fill="#38bdf8" opacity="0.25" />

  <!-- Right Wall -->
  <path d="M240,0 L165,70 L165,200 L240,220 Z" fill="url(#wallRight)" />
  <!-- Right Wall Details: Brick Lines -->
  <path d="M240,40 L165,90 M240,80 L165,120 M240,120 L165,155 M240,160 L165,185" stroke="#090d16" stroke-width="2" opacity="0.6" />
  <!-- Wall Pipe / Plumbing -->
  <path d="M210,50 L210,180" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <path d="M205,80 L215,80 M205,140 L215,140" stroke="#1e293b" stroke-width="3" />

  <!-- Ground / Cobblestone Alley Floor -->
  <path d="M0,200 L75,160 L165,160 L240,200 L240,240 L0,240 Z" fill="url(#groundGrad)" />
  <!-- Ground cobblestone accents -->
  <ellipse cx="120" cy="180" rx="40" ry="8" fill="#1f2937" opacity="0.5" />
  <ellipse cx="80" cy="195" rx="20" ry="4" fill="#1f2937" opacity="0.4" />
  <ellipse cx="170" cy="190" rx="30" ry="6" fill="#1f2937" opacity="0.4" />

  <!-- FLASHLIGHT BEAM (Illuminating the dark path, showing courage/daring) -->
  <polygon points="120,135 60,240 180,240" fill="url(#beamGrad)" />

  <!-- AMBIENT CREATURE / SHADOW EYES (The scary dark element) -->
  <g opacity="0.85">
    <!-- Glowing yellow eyes in the deep dark -->
    <circle cx="108" cy="100" r="3.5" fill="#facc15" />
    <circle cx="108" cy="100" r="1.5" fill="#ffffff" />
    <circle cx="122" cy="100" r="3.5" fill="#facc15" />
    <circle cx="122" cy="100" r="1.5" fill="#ffffff" />
    <!-- Subtle shadow form beneath eyes -->
    <path d="M102,108 Q115,114 128,108" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.6" />
  </g>

  <!-- MAIN CHARACTER (Brave Explorer stepping forward into the dark) -->
  <g transform="translate(0, 0)">
    <!-- Backpack -->
    <rect x="105" y="115" ry="4" width="22" height="28" fill="#d97706" />
    <rect x="110" y="122" width="12" height="8" rx="2" fill="#b45309" />

    <!-- Body / Jacket (Warm modern outdoor style: Teal/Blue #0ea5e9 & #0284c7) -->
    <path d="M100,125 L125,125 L132,158 L108,158 Z" fill="#0284c7" />
    <!-- Jacket zipper and collar -->
    <path d="M116,125 L116,158" stroke="#e0f2fe" stroke-width="2" />
    <path d="M110,122 L122,122 L125,128 L107,128 Z" fill="#0369a1" />

    <!-- Head & Face (Determined, brave expression) -->
    <circle cx="116" cy="106" r="14" fill="#fcd34d" />
    <!-- Hair (Stylish brown tuft) -->
    <path d="M102,102 Q110,90 124,96 Q128,102 126,106 Q116,98 104,106 Z" fill="#78350f" />
    
    <!-- Determined Face Features -->
    <!-- Confident Eyebrows (angled down with grit) -->
    <line x1="108" y1="102" x2="115" y2="104" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <line x1="119" y1="104" x2="126" y2="102" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes (focused forward) -->
    <circle cx="111" cy="107" r="1.5" fill="#1e293b" />
    <circle cx="121" cy="107" r="1.5" fill="#1e293b" />
    <!-- Firm mouth / smirk of courage -->
    <path d="M113,113 Q116,115 120,113" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Rosy confident cheeks -->
    <circle cx="109" cy="111" r="2" fill="#f43f5e" opacity="0.4" />
    <circle cx="123" cy="111" r="2" fill="#f43f5e" opacity="0.4" />

    <!-- Left Arm (Holding flashlight forward) -->
    <path d="M104,130 L132,133 L138,127" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="138" cy="127" r="5" fill="#fcd34d" /> <!-- Hand -->

    <!-- Flashlight Object -->
    <g transform="translate(136, 120) rotate(15)">
      <rect x="0" y="-3" width="14" height="6" rx="2" fill="#334155" />
      <rect x="12" y="-5" width="8" height="10" rx="3" fill="#f8fafc" />
      <!-- Flashlight Glow Core -->
      <circle cx="16" cy="0" r="5" fill="url(#lanternGlow)" />
    </g>

    <!-- Right Arm (Swinging naturally, determined pose) -->
    <path d="M128,132 L120,148" stroke="#0369a1" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="118" cy="151" r="4.5" fill="#fcd34d" />

    <!-- Legs & Boots (Stepping forward) -->
    <!-- Back Leg -->
    <path d="M110,155 L102,185 L94,185" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="88" y="181" width="12" height="6" rx="3" fill="#0f172a" />
    
    <!-- Front Leg (Brave step ahead) -->
    <path d="M124,155 L138,180 L148,180" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="144" y="176" width="14" height="7" rx="3" fill="#0f172a" />
  </g>

  <!-- FOREGROUND ATMOSPHERIC PARTICLES (Dust motes caught in the flashlight beam) -->
  <circle cx="110" cy="160" r="1.5" fill="#fef08a" opacity="0.8" />
  <circle cx="95" cy="190" r="1" fill="#fef08a" opacity="0.6" />
  <circle cx="130" cy="205" r="2" fill="#fef08a" opacity="0.9" />
  <circle cx="105" cy="220" r="1.2" fill="#fef08a" opacity="0.5" />
  <circle cx="145" cy="150" r="1.8" fill="#fef08a" opacity="0.7" />

  <!-- TOP HANGING STREET LAMP (Adds environmental contrast, casting warm amber downlight from top left) -->
  <path d="M0,25 L35,25 L35,35" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M25,35 L45,35 L50,45 L20,45 Z" fill="#1e293b" />
  <circle cx="35" cy="48" r="6" fill="#f59e0b" />
  <!-- Lamp Light Aura -->
  <circle cx="35" cy="50" r="30" fill="url(#lanternGlow)" opacity="0.4" />
</svg>