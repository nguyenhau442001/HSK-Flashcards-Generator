<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: High-tech office/studio -->
  <rect x="30" y="140" width="180" height="60" rx="4" fill="#334155"/>
  <circle cx="120" cy="180" r="15" fill="#1e293b"/>
  <path d="M90 140 L80 120 L160 120 L150 140 Z" fill="#475569"/>
  
  <!-- The "Talent" (Subject) -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-20 80 C-20 50, 20 50, 20 80 L15 100 L-15 100 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-18 25 C-20 10, 0 5, 15 20 C10 10, 20 15, 18 25 Z" fill="#78350f"/>
    <!-- Glasses -->
    <rect x="-12" y="25" width="8" height="6" rx="1" fill="#1e293b"/>
    <rect x="4" y="25" width="8" height="6" rx="1" fill="#1e293b"/>
  </g>

  <!-- Context: Rare/Brilliant Idea (The "Rare Talent" aspect) -->
  <g transform="translate(180, 80)">
    <path d="M0 -15 L5 -5 L15 -5 L7 2 L10 12 L0 6 L-10 12 L-7 2 L-15 -5 L-5 -5 Z" fill="#fbbf24"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Colleagues/Observers -->
  <g transform="translate(60, 150)">
    <circle cx="0" cy="0" r="12" fill="#94a3b8"/>
    <path d="M-10 10 L10 10 L5 30 L-5 30 Z" fill="#64748b"/>
  </g>
  <g transform="translate(180, 150)">
    <circle cx="0" cy="0" r="12" fill="#94a3b8"/>
    <path d="M-10 10 L10 10 L5 30 L-5 30 Z" fill="#64748b"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="40" cy="50" r="3" fill="#ec4899"/>
  <circle cx="200" cy="40" r="4" fill="#10b981"/>
  <path d="M150 50 L160 40 L170 50" stroke="#fb923c" stroke-width="2" fill="none"/>
</svg>