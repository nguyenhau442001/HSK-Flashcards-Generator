<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Subtle Background Office Elements / World Map Silhouette -->
  <path d="M40 70 Q90 50 140 70 T240 60 V190 H40 Z" fill="#1e293b" opacity="0.4"/>
  <circle cx="120" cy="120" r="85" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Window with City View indicating International Trade -->
  <path d="M165 35 L215 45 L215 110 L165 100 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Skyline shapes -->
  <rect x="175" y="60" width="8" height="40" fill="#334155" opacity="0.6"/>
  <rect x="187" y="50" width="10" height="50" fill="#334155" opacity="0.6"/>
  <rect x="201" y="70" width="8" height="30" fill="#334155" opacity="0.6"/>
  <!-- City Warm Glow -->
  <circle cx="192" cy="45" r="3" fill="#fbbf24" opacity="0.8"/>

  <!-- Large Modern Meeting Table -->
  <path d="M35 155 L205 155 L185 205 L55 205 Z" fill="#334155"/>
  <path d="M40 150 L200 150 L185 155 L55 155 Z" fill="#475569"/>

  <!-- Tabletop Props: Laptops, Documents, Globe, Coffee Cups -->
  <!-- Globe (representing international trade) -->
  <circle cx="120" cy="135" r="14" fill="#38bdf8" opacity="0.2"/>
  <circle cx="120" cy="135" r="12" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M108 135 H132 M120 123 V147" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  <!-- Stand -->
  <path d="M120 147 V155 M114 155 H126" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Laptops -->
  <path d="M70 148 L90 140 L95 152 L75 160 Z" fill="#64748b"/>
  <path d="M73 130 L87 125 L90 140 L70 148 Z" fill="#cbd5e1"/>
  <path d="M150 148 L170 140 L175 152 L155 160 Z" fill="#64748b"/>
  <path d="M153 130 L167 125 L170 140 L150 148 Z" fill="#cbd5e1"/>

  <!-- Documents / Charts -->
  <rect x="95" y="145" width="18" height="12" rx="1" fill="#f8fafc" transform="rotate(-10 95 145)"/>
  <line x1="98" y1="149" x2="108" y2="147" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="98" y1="152" x2="105" y2="150" stroke="#10b981" stroke-width="1.5"/>

  <!-- Coffee Cup -->
  <rect x="138" y="140" width="8" height="10" rx="2" fill="#f1f5f9"/>
  <path d="M146 142 C149 142 149 146 146 148" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Character 1 (Left - Representing Party A, active gesture) -->
  <!-- Body/Torso -->
  <path d="M50 160 C50 135 70 130 85 130 C100 130 110 145 110 165 V195 H50 Z" fill="#2563eb"/>
  <!-- Collar / Tie -->
  <path d="M72 130 L78 145 L85 130 Z" fill="#f8fafc"/>
  <polygon points="78,145 76,165 80,165" fill="#dc2626"/>
  <!-- Head & Face -->
  <circle cx="80" cy="112" r="16" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M66 112 C66 98 94 98 94 112 C90 104 70 104 66 112 Z" fill="#1e293b"/>
  <!-- Hand gesturing (Handshake or cooperation motion) -->
  <circle cx="105" cy="152" r="6" fill="#fcd34d"/>
  <path d="M85 140 L102 150" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>

  <!-- Character 2 (Right - Representing Party B, smiling, agreeing) -->
  <!-- Body/Torso -->
  <path d="M190 160 C190 135 170 130 155 130 C140 130 130 145 130 165 V195 H190 Z" fill="#059669"/>
  <!-- Collar / Scarf/Tie -->
  <path d="M150 130 L155 145 L160 130 Z" fill="#f8fafc"/>
  <polygon points="155,145 153,165 157,165" fill="#1e293b"/>
  <!-- Head & Face -->
  <circle cx="155" cy="112" r="16" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M141 110 C143 96 169 96 171 110 C167 102 145 102 141 110 Z" fill="#451a03"/>
  <!-- Hand meeting in the center (Cooperation / Trade Agreement metaphor) -->
  <circle cx="135" cy="152" r="6" fill="#fcd34d"/>
  <path d="M155 140 L138 150" stroke="#059669" stroke-width="10" stroke-linecap="round"/>

  <!-- Central Handshake Glow / Partnership Spark (Visualizing "Cooperation" 合作) -->
  <circle cx="120" cy="150" r="10" fill="#fbbf24" opacity="0.4"/>
  <circle cx="120" cy="150" r="5" fill="#f59e0b"/>

  <!-- Decorative Elements: Floating Dynamic Trade/Connection Icons (Abstract, non-text) -->
  <!-- Connection Arc with glowing nodes -->
  <path d="M85 90 Q120 70 155 90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="85" cy="90" r="3" fill="#38bdf8"/>
  <circle cx="120" cy="77" r="4" fill="#fbbf24"/>
  <circle cx="155" cy="90" r="3" fill="#10b981"/>

  <!-- Ambient Light Highlights -->
  <ellipse cx="120" cy="20" width="100" height="30" fill="#38bdf8" opacity="0.08" filter="blur(10px)"/>
</svg>