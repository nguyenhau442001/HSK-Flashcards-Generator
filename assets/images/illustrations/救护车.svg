<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing effect for ambulance lights -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Headlight beam gradient -->
    <linearGradient id="headlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>

    <!-- Speed Lines Filter/Gradient -->
    <linearGradient id="speedFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Urban Environment: Buildings & Night Sky -->
  <!-- Distant buildings -->
  <rect x="15" y="60" width="35" height="110" fill="#141c2e"/>
  <rect x="55" y="40" width="40" height="130" fill="#172138"/>
  <rect x="150" y="50" width="45" height="120" fill="#141c2e"/>
  <rect x="200" y="70" width="30" height="100" fill="#111827"/>

  <!-- Building windows (lit yellow/blue dots) -->
  <g fill="#334155" opacity="0.6">
    <rect x="22" y="70" width="6" height="8" rx="1"/>
    <rect x="34" y="70" width="6" height="8" rx="1"/>
    <rect x="22" y="90" width="6" height="8" rx="1" fill="#f59e0b" opacity="0.5"/>
    <rect x="34" y="90" width="6" height="8" rx="1"/>
    
    <rect x="65" y="50" width="8" height="10" rx="1" fill="#f59e0b" opacity="0.7"/>
    <rect x="78" y="50" width="8" height="10" rx="1"/>
    <rect x="65" y="75" width="8" height="10" rx="1"/>
    <rect x="78" y="75" width="8" height="10" rx="1" fill="#38bdf8" opacity="0.4"/>

    <rect x="160" y="65" width="8" height="10" rx="1"/>
    <rect x="174" y="65" width="8" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="160" y="90" width="8" height="10" rx="1" fill="#f59e0b" opacity="0.4"/>
  </g>

  <!-- Street lamp casting warm light -->
  <path d="M205 170 L205 95 L215 90" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="215" cy="88" r="4" fill="#f59e0b"/>
  <path d="M190 170 L235 125" stroke="#f59e0b" stroke-width="35" opacity="0.08" stroke-linecap="round"/>

  <!-- Roadway Background -->
  <rect x="0" y="160" width="240" height="80" fill="#0f172a"/>
  <!-- Road markings (dashed lines) -->
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="12 12"/>

  <!-- SPEED MOTION LINES (showing "quickly arrived") -->
  <path d="M20 185 L70 185" stroke="url(#speedFade)" stroke-width="2" stroke-linecap="round"/>
  <path d="M10 195 L60 195" stroke="url(#speedFade)" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 215 L80 215" stroke="url(#speedFade)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- AMBULANCE VEHICLE (救护车) -->
  <g transform="translate(65, 125)">
    <!-- Headlight Beam -->
    <path d="M-5 35 L-60 20 L-60 55 Z" fill="url(#headlight)"/>
    <circle cx="-5" cy="38" r="4" fill="#fef08a"/>

    <!-- Vehicle Main Body -->
    <!-- Rear/Cabin shape -->
    <path d="M10 5 L55 5 C62 5 68 10 70 18 L75 42 C76 46 73 50 68 50 L-5 50 C-10 50 -13 46 -12 42 L-5 18 C-3 10 3 5 10 5 Z" fill="#f8fafc"/>
    <!-- Front Cab Extension -->
    <path d="M-5 18 L-25 22 C-32 24 -36 30 -35 38 L-35 46 C-35 49 -32 52 -28 52 L-5 52 Z" fill="#f1f5f9"/>
    
    <!-- Windshield & Windows -->
    <path d="M-22 25 L-6 22 L-5 40 L-26 40 C-29 40 -31 37 -30 34 L-24 27 Z" fill="#38bdf8" opacity="0.5"/>
    <path d="M2 22 L35 22 L35 40 L2 40 Z" fill="#38bdf8" opacity="0.4"/>
    <path d="M42 22 L65 22 C67 22 69 24 70 27 L72 40 L42 40 Z" fill="#38bdf8" opacity="0.4"/>

    <!-- Red Cross Medical Symbol on Side -->
    <g transform="translate(35, 27)">
      <rect x="-3" y="-10" width="6" height="20" rx="1.5" fill="#ef4444"/>
      <rect x="-10" y="-3" width="20" height="6" rx="1.5" fill="#ef4444"/>
    </g>

    <!-- Red stripe accent -->
    <path d="M-35 42 L72 42" stroke="#ef4444" stroke-width="4"/>

    <!-- Wheels -->
    <!-- Back Wheel -->
    <circle cx="15" cy="52" r="12" fill="#0f172a"/>
    <circle cx="15" cy="52" r="6" fill="#94a3b8"/>
    <!-- Front Wheel -->
    <circle cx="-20" cy="52" r="12" fill="#0f172a"/>
    <circle cx="-20" cy="52" r="6" fill="#94a3b8"/>

    <!-- Siren / Emergency Lights on Roof -->
    <rect x="25" y="-1" width="14" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Flashing Red Light -->
    <circle cx="28" cy="-4" r="5" fill="#ef4444"/>
    <circle cx="28" cy="-4" r="8" fill="url(#redGlow)" opacity="0.8"/>
    <!-- Flashing Blue Light -->
    <circle cx="36" cy="-4" r="5" fill="#38bdf8"/>
    <circle cx="36" cy="-4" r="8" fill="url(#blueGlow)" opacity="0.8"/>
  </g>

  <!-- FOREGROUND CHARACTERS (Relieved onlookers / family waiting) -->
  <!-- Character 1: Worried/Relieved Person gesturing toward ambulance -->
  <g transform="translate(185, 145)">
    <!-- Body / Jacket (Warm amber/orange tone) -->
    <path d="M-10 35 L10 35 L14 70 L-14 70 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="18" r="9" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M-9 15 C-9 10 -4 9 0 9 C4 9 9 10 9 15 C9 15 4 13 0 13 C-4 13 -9 15 -9 15 Z" fill="#451a03"/>
    <!-- Arms gesturing relief / pointing -->
    <path d="M-10 40 L-22 30" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 40 L22 25" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <!-- Face expression: relieved smile, wide eyes -->
    <circle cx="-3" cy="18" r="1.5" fill="#1e293b"/>
    <circle cx="3" cy="18" r="1.5" fill="#1e293b"/>
    <path d="M-2 23 Q0 26 2 23" stroke="#1e293b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="-8" y="70" width="5" height="25" fill="#334155"/>
    <rect x="3" y="70" width="5" height="25" fill="#334155"/>
  </g>

  <!-- Character 2: Second person holding phone (having called the ambulance) -->
  <g transform="translate(155, 150)">
    <!-- Body (Teal/Green tone) -->
    <path d="M-8 30 L10 30 L12 65 L-10 65 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="0" cy="15" r="8.5" fill="#fde047"/>
    <!-- Hair (Ponytail) -->
    <circle cx="0" cy="12" r="8" fill="#1e293b"/>
    <path d="M6 12 C12 12 15 8 18 5" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Hand holding phone to chest / relief gesture -->
    <path d="M-8 35 L-15 45" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <rect x="-18" y="42" width="6" height="10" rx="1" fill="#38bdf8"/>
    <!-- Legs -->
    <rect x="-7" y="65" width="4" height="25" fill="#1e293b"/>
    <rect x="2" y="65" width="4" height="25" fill="#1e293b"/>
  </g>

  <!-- Ground plane shadow under characters -->
  <ellipse cx="170" cy="215" rx="45" ry="6" fill="#000000" opacity="0.4"/>
</svg>