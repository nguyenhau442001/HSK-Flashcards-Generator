<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Library/Quiet Space Environment -->
  <rect x="20" y="140" width="200" height="80" fill="#334155" rx="8"/>
  <rect x="30" y="150" width="180" height="60" fill="#0f172a" rx="4"/>
  <path d="M40 160h160v10h-160z" fill="#475569"/>
  <path d="M40 180h160v10h-160z" fill="#475569"/>
  <path d="M40 200h160v10h-160z" fill="#475569"/>
  
  <!-- Characters -->
  <!-- Person 1 (Pointing/Shushing) -->
  <circle cx="80" cy="110" r="15" fill="#f59e0b"/>
  <path d="M65 125h30v40h-30z" fill="#38bdf8"/>
  <path d="M70 130l-15 20" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M90 130l15 10" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Person 2 (Angry/Gesturing) -->
  <circle cx="160" cy="110" r="15" fill="#ec4899"/>
  <path d="M145 125h30v40h-30z" fill="#fb923c"/>
  <path d="M150 130l-15 10" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
