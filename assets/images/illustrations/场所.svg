  <!-- Contextual "Shush" visual cue -->
  <path d="M95 95 Q 105 85 115 95" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="100" cy="90" r="2" fill="#fbbf24"/>
  <circle cx="110" cy="90" r="2" fill="#fbbf24"/>
  
  <!-- "No" Symbol (Subtle) -->
  <circle cx="120" cy="60" r="25" stroke="#ef4444" stroke-width="4" fill="none" opacity="0.6"/>
  <line x1="105" y1="75" x2="135" y2="45" stroke="#ef4444" stroke-width="4" opacity="0.6"/>
  
  <!-- Ambient lighting -->
