<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Rounded Corners -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Background Elements (Restroom hallway / Interior walls) -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b"/>
  <!-- Floor with perspective grid line -->
  <path d="M 20 170 L 220 170 L 240 220 L 0 220 Z" fill="#334155"/>
  <path d="M 120 170 L 120 220" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Wall Tile Details -->
  <path d="M 20 50 L 220 50 M 20 80 L 220 80 M 20 110 L 220 110 M 20 140 L 220 140" stroke="#1e293b" stroke-width="1"/>
  <path d="M 60 20 L 60 170 M 100 20 L 100 170 M 140 20 L 140 170 M 180 20 L 180 170" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Ambient Warm Glow from Restroom Sign / Light -->
  <circle cx="120" cy="20" r="80" fill="#38bdf8" opacity="0.05"/>

  <!-- Hanging Restroom Direction Sign -->
  <line x1="120" y1="0" x2="120" y2="35" stroke="#64748b" stroke-width="3"/>
  <rect x="95" y="35" width="50" height="25" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <!-- Simplified universal door figures inside the sign -->
  <!-- Person 1 (Dress) -->
  <circle cx="110" cy="43" r="3" fill="#ffffff"/>
  <path d="M 107 48 L 113 48 L 115 55 L 105 55 Z" fill="#ffffff"/>
  <!-- Person 2 (Pants) -->
  <circle cx="130" cy="43" r="3" fill="#ffffff"/>
  <path d="M 128 48 L 132 48 L 132 55 L 130 55 L 130 52 L 130 52 L 130 55 L 128 55 Z" fill="#ffffff"/>

  <!-- Main Subject: Modern Restroom Stall Door & Exterior Context -->
  <!-- Stall Frame -->
  <rect x="50" y="60" width="140" height="130" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  
  <!-- Stall Door (Slightly ajar or prominent teal-blue panel) -->
  <rect x="60" y="70" width="120" height="115" rx="2" fill="#0d9488" stroke="#14b8a6" stroke-width="2"/>
  <rect x="70" y="80" width="100" height="40" rx="1" fill="#0f766e" opacity="0.6"/>
  <rect x="70" y="130" width="100" height="40" rx="1" fill="#0f766e" opacity="0.6"/>
  
  <!-- Door Handle & Lock Indicator (Green/Red lock - set to available/green) -->
  <circle cx="160" cy="110" r="6" fill="#fbbf24"/>
  <rect x="153" y="115" width="14" height="25" rx="3" fill="#94a3b8"/>
  <circle cx="160" cy="122" r="3" fill="#10b981"/> <!-- Green indicator light -->

  <!-- Context Prop: Wall Sink / Washbasin on the side -->
  <rect x="15" y="110" width="30" height="20" rx="3" fill="#e2e8f0"/>
  <path d="M 25 105 Q 30 100 35 105" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <rect x="23" y="130" width="14" height="30" fill="#64748b"/>

  <!-- Context Prop: Potted Plant for Atmosphere & Depth -->
  <rect x="195" y="145" width="25" height="30" rx="4" fill="#f43f5e"/>
  <path d="M 207 145 C 190 130 200 100 207 90 C 214 100 224 130 207 145 Z" fill="#10b981"/>
  <path d="M 207 145 C 215 135 230 110 220 100 C 210 110 205 130 207 145 Z" fill="#34d399"/>

  <!-- Action/Search Element: Floating cute magnifying glass inspecting the location (learning app motif) -->
  <g transform="translate(130, 80)">
    <circle cx="15" cy="15" r="18" fill="none" stroke="#f59e0b" stroke-width="6"/>
    <circle cx="15" cy="15" r="15" fill="#38bdf8" fill-opacity="0.2"/>
    <line x1="28" y1="28" x2="42" y2="42" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Glowing sparkle on glass -->
    <path d="M 8 8 Q 12 4 16 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Footprints leading towards the restroom -->
  <path d="M 90 200 C 95 190 105 190 100 200 Z" fill="#fb923c" opacity="0.6"/>
  <path d="M 115 190 C 120 180 130 180 125 190 Z" fill="#fb923c" opacity="0.6"/>
  <path d="M 105 180 C 110 170 120 170 115 180 Z" fill="#fb923c" opacity="0.6"/>

  <!-- Foreground Vignette / Lighting Overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
</svg>