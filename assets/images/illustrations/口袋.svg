<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Door frame and wall -->
  <path d="M180 40 L180 240 M60 40 L60 240" stroke="#334155" stroke-width="4"/>
  <rect x="70" y="50" width="100" height="180" rx="10" fill="#334155" opacity="0.3"/>
  
  <!-- Character: Upper body -->
  <g transform="translate(40, 60)">
    <!-- Coat -->
    <path d="M40 20 L120 20 L130 160 L30 160 Z" fill="#fb923c"/>
    <path d="M80 20 L80 160" stroke="#ea580c" stroke-width="4"/>
    
    <!-- Pocket -->
    <path d="M90 80 L120 80 L115 120 L95 120 Z" fill="#ea580c"/>
    <path d="M90 80 L120 80" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Arm and Hand -->
    <path d="M110 90 L130 110" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
    <circle cx="130" cy="110" r="8" fill="#fde68a"/>
    
    <!-- Key -->
    <g transform="translate(125, 105) rotate(45)">
      <rect x="0" y="0" width="12" height="4" rx="2" fill="#38bdf8"/>
      <circle cx="12" cy="2" r="4" fill="#38bdf8"/>
    </g>
    
    <!-- Face -->
    <circle cx="80" cy="0" r="25" fill="#fde68a"/>
    <circle cx="70" cy="-5" r="3" fill="#0f172a"/>
    <circle cx="90" cy="-5" r="3" fill="#0f172a"/>
    <path d="M75 10 Q80 15 85 10" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="180" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="210" cy="190" r="5" fill="#fbbf24" opacity="0.3"/>
</svg>