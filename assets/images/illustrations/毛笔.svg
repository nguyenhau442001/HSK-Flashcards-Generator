<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="150" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Paper -->
  <rect x="50" y="100" width="140" height="100" rx="4" fill="#f8fafc"/>
  
  <!-- Ink Stone -->
  <ellipse cx="70" cy="170" rx="15" ry="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  
  <!-- The Brush (The Subject) -->
  <g transform="translate(110, 100) rotate(20)">
    <rect x="-2" y="0" width="4" height="60" rx="1" fill="#92400e"/>
    <path d="M-4 60 Q 0 85 4 60 Z" fill="#0f172a"/>
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- Character Hands -->
  <g fill="#fcd34d">
    <circle cx="105" cy="130" r="12"/>
    <circle cx="135" cy="140" r="12"/>
  </g>
  
  <!-- Character Head -->
  <circle cx="160" cy="80" r="30" fill="#fcd34d"/>
  <path d="M145 75 Q150 65 160 65 Q170 65 175 75" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="150" cy="75" r="3" fill="#0f172a"/>
  <circle cx="170" cy="75" r="3" fill="#0f172a"/>
  
  <!-- Background Decor -->
  <path d="M200 40 L220 40 L210 60 Z" fill="#fb923c" opacity="0.6"/>
  <circle cx="30" cy="50" r="10" fill="#38bdf8" opacity="0.3"/>
  <rect x="200" y="100" width="20" height="80" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Ambient Light Glow -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.1"/>
</svg>