<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Urban Street Context -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 180 L240 180" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Subway/Bus Station Signage Element -->
  <rect x="20" y="60" width="40" height="80" rx="4" fill="#38bdf8"/>
  <circle cx="40" cy="90" r="12" fill="#fff"/>
  <path d="M35 90 L45 90 M40 85 L40 95" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Character 1: Walking happily -->
  <g transform="translate(80, 120)">
    <circle cx="10" cy="20" r="8" fill="#fbbf24"/>
    <path d="M10 28 L10 50 M10 35 L0 45 M10 35 L20 45 M10 50 L5 70 M10 50 L15 70" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2: Waiting for transport -->
  <g transform="translate(160, 120)">
    <circle cx="10" cy="20" r="8" fill="#ec4899"/>
    <path d="M10 28 L10 50 M10 35 L0 40 M10 35 L20 40 M10 50 L5 70 M10 50 L15 70" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Transport Vehicle (Stylized Bus/Train) -->
  <rect x="180" y="130" width="50" height="40" rx="6" fill="#10b981"/>
  <rect x="190" y="135" width="15" height="15" rx="2" fill="#fff"/>
  <rect x="210" y="135" width="15" height="15" rx="2" fill="#fff"/>
  <circle cx="195" cy="175" r="6" fill="#0f172a" stroke="#fff" stroke-width="2"/>
  <circle cx="220" cy="175" r="6" fill="#0f172a" stroke="#fff" stroke-width="2"/>
  
  <!-- Decorative Cityscape Background -->
  <path d="M10 180 L30 140 L50 180 Z" fill="#475569"/>
  <path d="M180 180 L210 120 L240 180 Z" fill="#475569"/>
  
  <!-- Ambient glow -->
  <circle cx="200" cy="50" r="30" fill="#fb923c" opacity="0.1"/>
</svg>