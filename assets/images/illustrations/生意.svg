<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for Success -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Awning Stripes Pattern / Gradients -->
    <linearGradient id="awningRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="awningWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Wood Counter Gradient -->
    <linearGradient id="woodCounter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glass Jar Gradient -->
    <linearGradient id="glassJar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow representing thriving business/success -->
  <circle cx="120" cy="110" r="90" fill="url(#goldGlow)"/>

  <!-- Shop Environment Background Details -->
  <!-- Shelf in background -->
  <rect x="40" y="55" width="160" height="6" rx="3" fill="#334155"/>
  <rect x="70" y="32" width="20" height="23" rx="4" fill="#10b981"/>
  <rect x="100" y="28" width="25" height="27" rx="4" fill="#38bdf8"/>
  <rect x="135" y="35" width="18" height="20" rx="4" fill="#ec4899"/>

  <!-- Store Awning -->
  <g filter="url(#softShadow)">
    <path d="M 20,40 L 220,40 L 205,75 L 35,75 Z" fill="#0f172a" opacity="0.2"/>
    <path d="M 15,35 L 225,35 L 210,70 L 30,70 Z" fill="url(#awningRed)"/>
    <!-- Alternating Awning Stripes -->
    <path d="M 45,35 L 60,35 L 52,70 L 37,70 Z" fill="url(#awningWhite)"/>
    <path d="M 75,35 L 90,35 L 82,70 L 67,70 Z" fill="url(#awningWhite)"/>
    <path d="M 105,35 L 120,35 L 112,70 L 97,70 Z" fill="url(#awningWhite)"/>
    <path d="M 135,35 L 150,35 L 142,70 L 127,70 Z" fill="url(#awningWhite)"/>
    <path d="M 165,35 L 180,35 L 172,70 L 157,70 Z" fill="url(#awningWhite)"/>
    <path d="M 195,35 L 210,35 L 202,70 L 187,70 Z" fill="url(#awningWhite)"/>
    <!-- Awning Scallop Edge -->
    <path d="M 30,70 Q 37.5,78 45,70 Q 52.5,78 60,70 Q 67.5,78 75,70 Q 82.5,78 90,70 Q 97.5,78 105,70 Q 112.5,78 120,70 Q 127.5,78 135,70 Q 142.5,78 150,70 Q 157.5,78 165,70 Q 172.5,78 180,70 Q 187.5,78 195,70 Q 202.5,78 210,70 Z" fill="url(#awningRed)"/>
  </g>

  <!-- Hanging Sign (Business/Open vibe) -->
  <g transform="translate(120, 75)" filter="url(#softShadow)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#64748b" stroke-width="2"/>
    <rect x="-35" y="15" width="70" height="22" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <!-- Briefcase / Commerce Symbol on Sign -->
    <g transform="translate(0, 21) scale(0.6)">
      <rect x="-12" y="-5" width="24" height="16" rx="3" fill="#b45309"/>
      <path d="M -6,-5 L -6,-8 C -6,-9.5 -4,-10 -2,-10 L 2,-10 C 4,-10 6,-9.5 6,-8 L 6,-5" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="3" r="2" fill="#fef3c7"/>
    </g>
  </g>

  <!-- Main Counter / Shop Desk -->
  <g filter="url(#softShadow)">
    <!-- Counter Front Base -->
    <rect x="30" y="160" width="180" height="55" fill="url(#woodCounter)" rx="4"/>
    <!-- Counter Panel Accents -->
    <rect x="42" y="170" width="45" height="38" rx="3" fill="#92400e" opacity="0.4"/>
    <rect x="97" y="170" width="46" height="38" rx="3" fill="#92400e" opacity="0.4"/>
    <rect x="153" y="170" width="45" height="38" rx="3" fill="#92400e" opacity="0.4"/>
    <!-- Counter Top Surface -->
    <rect x="24" y="150" width="192" height="12" rx="3" fill="url(#woodTop)"/>
  </g>

  <!-- Merchant / Shopkeeper (Friendly & Enthusiastic) -->
  <g transform="translate(120, 140)">
    <!-- Body / Apron -->
    <path d="M -30,25 C -30,10 -15,5 0,5 C 15,5 30,10 30,25 L 35,45 C 35,48 32,50 28,50 L -28,50 C -32,50 -35,48 -35,45 Z" fill="#3b82f6"/>
    <!-- Apron Pocket & Details -->
    <rect x="-12" y="25" width="24" height="18" rx="3" fill="#2563eb"/>
    <path d="M -6,31 L 6,31" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck & Head -->
    <rect x="-6" y="-3" width="12" height="10" fill="#fcd34d"/>
    <circle cx="0" cy="-18" r="18" fill="#fcd34d"/>

    <!-- Hair (Friendly neat style) -->
    <path d="M -16,-22 C -16,-30 -5,-32 2,-32 C 12,-32 18,-25 18,-18 C 18,-15 17,-12 17,-12 C 17,-12 12,-16 5,-16 C -2,-16 -12,-14 -16,-22 Z" fill="#1e293b"/>

    <!-- Face Expression (Happy winking/smiling) -->
    <circle cx="-6" cy="-20" r="2.5" fill="#1e293b"/>
    <path d="M 4,-21 Q 7,-24 10,-21" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M -3,-12 Q 0,-8 3,-12" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-10" cy="-14" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="10" cy="-14" r="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Welcoming Waving Arms -->
    <!-- Left arm raised waving -->
    <path d="M -28,15 C -42,10 -48, -5 -42,-12 C -38,-16 -32,-12 -30,-5" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-42" cy="-12" r="5" fill="#fcd34d"/>

    <!-- Right arm resting on counter -->
    <path d="M 28,15 Q 40,20 45,10" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="45" cy="10" r="5" fill="#fcd34d"/>
  </g>

  <!-- Commerce & Business Props on Counter -->
  <!-- Modern Cash Register / POS Terminal -->
  <g transform="translate(155, 122)" filter="url(#softShadow)">
    <!-- Base -->
    <path d="M 0,28 L 35,28 C 38,28 40,26 38,23 L 32,5 C 31,3 29,2 27,2 L 8,2 C 6,2 4,3 3,5 L -3,23 C -5,26 -3,28 0,28 Z" fill="#e2e8f0"/>
    <!-- Screen -->
    <rect x="5" y="6" width="22" height="14" rx="2" fill="#0f172a"/>
    <rect x="7" y="8" width="10" height="5" rx="1" fill="#38bdf8"/>
    <!-- Card Reader Slot / Details -->
    <line x1="8" y1="23" x2="24" y2="23" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Contactless Wave Icon -->
    <path d="M 29,12 C 30,13 30,15 29,16" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 31,10 C 33,12 33,16 31,18" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Glowing Gold Coins & Paper Money (Signifying Profit / Successful Business) -->
  <g filter="url(#softShadow)">
    <!-- Stack of Coins Left -->
    <g transform="translate(65, 152)">
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="#fbbf24"/>
      <rect x="-10" y="-3" width="20" height="6" fill="#f59e0b"/>
      <ellipse cx="0" cy="-3" rx="10" ry="4" fill="#fcd34d"/>
      
      <ellipse cx="12" cy="2" rx="9" ry="3.5" fill="#fbbf24"/>
      <rect x="3" y="-1" width="18" height="5" fill="#f59e0b"/>
      <ellipse cx="12" cy="-1" rx="9" ry="3.5" fill="#fcd34d"/>

      <ellipse cx="-8" cy="5" rx="8" ry="3" fill="#fbbf24"/>
      <rect x="-16" y="2" width="16" height="5" fill="#f59e0b"/>
      <ellipse cx="-8" cy="2" rx="8" ry="3" fill="#fcd34d"/>
    </g>

    <!-- Crisp Banknotes / Bills -->
    <g transform="translate(90, 142) rotate(-12)">
      <rect x="0" y="0" width="32" height="18" rx="2" fill="#10b981" stroke="#047857" stroke-width="1"/>
      <circle cx="16" cy="9" r="4" fill="#6ee7b7" opacity="0.6"/>
      <rect x="3" y="3" width="4" height="3" rx="1" fill="#047857"/>
      <rect x="25" y="12" width="4" height="3" rx="1" fill="#047857"/>
    </g>
    <g transform="translate(108, 138) rotate(18)">
      <rect x="0" y="0" width="32" height="18" rx="2" fill="#34d399" stroke="#059669" stroke-width="1"/>
      <circle cx="16" cy="9" r="4" fill="#a7f3d0" opacity="0.6"/>
    </g>
  </g>

  <!-- Floating Sparkles / Success Indicators -->
  <g fill="#fbbf24">
    <path d="M 50,85 L 53,92 L 60,95 L 53,98 L 50,105 L 47,98 L 40,95 L 47,92 Z" opacity="0.8"/>
    <path d="M 195,95 L 197,100 L 202,102 L 197,104 L 195,109 L 193,104 L 188,102 L 193,100 Z" opacity="0.9"/>
    <path d="M 175,60 L 176.5,63.5 L 180,65 L 176.5,66.5 L 175,70 L 173.5,66.5 L 170,65 L 173.5,63.5 Z" opacity="0.7"/>
  </g>
</svg>