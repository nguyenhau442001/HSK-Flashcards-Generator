<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Couch/Chair Gradient -->
    <linearGradient id="couch-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pain Aura Glow Filter -->
    <filter id="pain-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Background Details -->
  <!-- Window / Night City Vibe -->
  <rect x="150" y="25" width="60" height="75" rx="4" fill="#090d16" opacity="0.6" />
  <path d="M 180 25 L 180 100" stroke="#1e293b" stroke-width="2" />
  <path d="M 150 60 L 210 60" stroke="#1e293b" stroke-width="2" />
  <!-- City light dots outside -->
  <circle cx="165" cy="40" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="195" cy="45" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="170" cy="80" r="1.5" fill="#fb923c" opacity="0.8" />

  <!-- House Plant Background Prop -->
  <path d="M 35 110 L 45 110 L 42 145 L 38 145 Z" fill="#64748b" />
  <path d="M 40 110 C 20 90, 10 70, 20 50 C 30 70, 35 90, 40 110 Z" fill="#10b981" />
  <path d="M 40 110 C 60 90, 65 60, 55 45 C 45 65, 42 85, 40 110 Z" fill="#059669" />

  <!-- Wooden Floor & Rug -->
  <path d="M 0 145 L 240 145 L 240 240 L 0 240 Z" fill="url(#floor-grad)" />
  <!-- Cozy Floor Rug -->
  <ellipse cx="120" cy="190" rx="80" ry="25" fill="#334155" opacity="0.8" />
  <ellipse cx="120" cy="190" rx="72" ry="20" fill="#475569" opacity="0.6" />

  <!-- Modern Sofa / Armchair -->
  <path d="M 50 110 C 50 95, 65 85, 85 85 L 155 85 C 175 85, 190 95, 190 110 L 190 155 L 50 155 Z" fill="url(#couch-grad)" />
  <!-- Sofa Cushion/Seat -->
  <path d="M 55 115 L 185 115 L 180 150 L 60 150 Z" fill="#0369a1" />
  <!-- Sofa Armrest Sides -->
  <path d="M 45 95 C 45 85, 55 80, 65 80 L 65 155 L 45 155 Z" fill="#0284c7" />
  <path d="M 195 95 C 195 85, 185 80, 175 80 L 175 155 L 195 155 Z" fill="#0284c7" />

  <!-- Character: Sitting on couch, holding sore foot -->
  <!-- Torso & Head -->
  <path d="M 90 95 C 90 75, 110 65, 125 75 C 140 85, 145 105, 140 135 L 90 135 Z" fill="#fb923c" />
  <!-- Hoodie / Clothes -->
  <path d="M 85 95 C 85 80, 105 70, 120 75 C 135 80, 142 95, 145 135 L 85 135 Z" fill="#ec4899" />
  <!-- Hoodie Collar / Details -->
  <path d="M 110 75 C 115 85, 125 85, 130 75" stroke="#be185d" stroke-width="3" fill="none" />

  <!-- Character Head & Face (Grimacing in Pain) -->
  <circle cx="115" cy="52" r="16" fill="#fbcfe8" />
  <!-- Hair (Messy, cute style) -->
  <path d="M 99 50 C 98 35, 115 32, 128 38 C 135 42, 133 55, 133 55 C 120 48, 105 52, 99 50 Z" fill="#451a03" />
  
  <!-- Face Expression (Pain / Grimace) -->
  <!-- Tightly closed curved eyes representing ouch -->
  <path d="M 107 51 L 113 54" stroke="#881337" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 119 54 L 125 51" stroke="#881337" stroke-width="2.5" stroke-linecap="round" />
  <!-- Grimacing open mouth -->
  <path d="M 112 62 Q 116 58 120 62 Q 116 66 112 62 Z" fill="#881337" />

  <!-- Arms reaching down to the foot -->
  <path d="M 90 100 C 75 110, 75 135, 95 145" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" />
  <!-- Hands holding foot -->
  <circle cx="98" cy="146" r="5" fill="#fbcfe8" />

  <!-- Left Leg (Normal, resting on floor) -->
  <path d="M 100 135 L 105 180 L 125 180" fill="none" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Shoe / Slipper left -->
  <ellipse cx="130" cy="181" rx="8" ry="5" fill="#3b82f6" />

  <!-- RIGHT LEG & FOOT (THE PAINFUL FOCUS - 脚 jiǎo) -->
  <!-- Lifted leg bent at knee, grabbed by hands -->
  <path d="M 130 135 C 120 145, 105 145, 98 146" fill="none" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" />
  
  <!-- The Target Foot (脚 - jiǎo) with Pain Aura -->
  <!-- Glowing red pain aura around the foot -->
  <ellipse cx="88" cy="155" rx="14" ry="10" fill="#ef4444" opacity="0.4" filter="url(#pain-glow)" />
  <!-- Foot Shape -->
  <path d="M 80 150 C 75 148, 70 152, 73 158 C 76 163, 90 162, 95 156 C 97 153, 90 149, 80 150 Z" fill="#fbcfe8" stroke="#f43f5e" stroke-width="2" />
  <!-- Ankle -->
  <circle cx="92" cy="150" r="5" fill="#fbcfe8" />

  <!-- PAIN VISUAL CUES (Sparks & Zaps) -->
  <!-- Little star / pain flashes near foot -->
  <path d="M 72 142 L 75 147 L 80 145 L 77 150 L 82 153 L 76 153 L 74 158 L 72 153 L 67 153 L 71 150 Z" fill="#fbbf24" transform="scale(0.8) translate(20, 20)" />
  <path d="M 60 140 L 61 143 L 64 144 L 61 145 L 60 148 L 59 145 L 56 144 L 59 143 Z" fill="#f59e0b" />
  <!-- Sweat drop representing agony -->
  <path d="M 133 48 C 133 48, 137 53, 137 56 C 137 58, 135 60, 133 60 C 131 60, 129 58, 129 56 C 129 53, 133 48, 133 48 Z" fill="#38bdf8" opacity="0.9" />

  <!-- Foreground Context Prop: Dropped item or slipper -->
  <path d="M 60 170 C 55 170, 50 175, 52 182 C 55 188, 68 186, 72 180 C 74 176, 68 170, 60 170 Z" fill="#fb923c" />
  <path d="M 55 176 C 58 175, 65 176, 68 178" stroke="#ea580c" stroke-width="2" fill="none" />

</svg>