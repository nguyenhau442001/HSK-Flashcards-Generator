<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- Sun/Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Field/Crop Gradients -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    
    <linearGradient id="cropGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="kidShirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Ambient Golden Hour Glow -->
  <circle cx="180" cy="70" r="70" fill="url(#sunGlow)" />
  <circle cx="180" cy="70" r="24" fill="#f59e0b" opacity="0.8" />

  <!-- Distant Rolling Hills -->
  <path d="M0 130 Q60 110 120 125 T240 115 L240 180 L0 180 Z" fill="#1e3a8a" opacity="0.3" />
  <path d="M0 140 Q90 120 180 140 T240 135 L240 180 L0 180 Z" fill="#065f46" opacity="0.4" />

  <!-- Midground Farmland Rows -->
  <path d="M0 150 Q120 135 240 155 L240 180 L0 180 Z" fill="url(#soilGrad)" />
  
  <!-- Perspective Crop Rows / Plant sprouts -->
  <path d="M20 158 Q110 145 220 162" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M10 168 Q115 153 230 170" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M5 177 Q120 160 235 180" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Foreground Soil Bank -->
  <path d="M0 175 Q120 160 240 178 L240 240 L0 240 Z" fill="url(#soilGrad)" />

  <!-- Environment Props: Wooden Fence & Basket of Harvest -->
  <!-- Fence -->
  <rect x="15" y="145" width="6" height="35" rx="2" fill="#92400e" />
  <rect x="35" y="142" width="6" height="38" rx="2" fill="#92400e" />
  <rect x="12" y="152" width="32" height="4" rx="1" fill="#b45309" />
  <rect x="12" y="165" width="32" height="4" rx="1" fill="#b45309" />

  <!-- Basket with vegetables (Harvest) -->
  <ellipse cx="205" cy="182" rx="18" ry="8" fill="#78350f" />
  <path d="M189 182 Q187 205 205 208 Q223 205 221 182 Z" fill="#b45309" />
  <!-- Veggies poking out -->
  <circle cx="198" cy="178" r="5" fill="#10b981" />
  <circle cx="206" cy="176" r="6" fill="#f87171" />
  <circle cx="214" cy="179" r="5" fill="#facc15" />

  <!-- CHARACTER 1: The Father (Farmer / 农民) -->
  <g transform="translate(85, 95)">
    <!-- Shadow beneath -->
    <ellipse cx="20" cy="85" rx="22" ry="6" fill="#020617" opacity="0.4" />

    <!-- Straw Hat (Classic Farmer Hat) -->
    <ellipse cx="20" cy="12" rx="26" ry="7" fill="#fde047" />
    <ellipse cx="20" cy="10" rx="16" ry="8" fill="#facc15" />

    <!-- Head & Face -->
    <circle cx="20" cy="22" r="12" fill="#fed7aa" />
    <!-- Friendly Smile & Eyes -->
    <path d="M15 22 Q17 25 19 22" stroke="#78350f" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M22 22 Q24 25 26 22" stroke="#78350f" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M17 27 Q20 30 23 27" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Torso (Blue Shirt with Rolled Sleeves) -->
    <path d="M8 36 Q20 33 32 36 L35 62 L5 62 Z" fill="url(#shirtGrad)" />
    <!-- Arms holding Hoe -->
    <path d="M8 38 L-4 50 L2 54 L12 44" fill="#fed7aa" />

    <!-- Pants (Dark / Khaki) -->
    <path d="M10 60 L10 82 L18 82 L18 60 Z" fill="#334155" />
    <path d="M22 60 L22 82 L30 82 L30 60 Z" fill="#334155" />
    <!-- Boots -->
    <path d="M6 82 L18 82 L18 87 L4 87 Z" fill="#1e293b" />
    <path d="M22 82 L34 82 L36 87 L22 87 Z" fill="#1e293b" />

    <!-- Tool: Farming Hoe -->
    <line x1="-15" y1="10" x2="35" y2="70" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
    <!-- Metal Hoe Blade -->
    <path d="M-18 6 L-8 4 L-12 18 L-22 16 Z" fill="#94a3b8" stroke="#475569" stroke-width="1" />
  </g>

  <!-- CHARACTER 2: The Child / Son (Proudly pointing to his father) -->
  <g transform="translate(135, 110)">
    <!-- Shadow beneath -->
    <ellipse cx="15" cy="70" rx="16" ry="5" fill="#020617" opacity="0.4" />

    <!-- Head & Hair -->
    <circle cx="15" cy="15" r="10" fill="#fed7aa" />
    <path d="M6 13 Q15 4 24 13 Q20 8 15 8 Q10 8 6 13 Z" fill="#334155" />

    <!-- Face -->
    <circle cx="12" cy="15" r="1.5" fill="#78350f" />
    <circle cx="18" cy="15" r="1.5" fill="#78350f" />
    <path d="M13 19 Q15 21 17 19" stroke="#e11d48" stroke-width="1.2" fill="none" stroke-linecap="round" />

    <!-- Torso (Orange/Warm Kid Shirt) -->
    <path d="M6 25 Q15 23 24 25 L26 48 L4 48 Z" fill="url(#kidShirtGrad)" />
    
    <!-- Pointing Arm reaching toward Dad -->
    <path d="M22 28 L35 22" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" />

    <!-- Pants -->
    <path d="M8 48 L8 68 L13 68 L13 48 Z" fill="#1e3a8a" />
    <path d="M17 48 L17 68 L22 68 L22 48 Z" fill="#1e3a8a" />
    <!-- Shoes -->
    <rect x="5" y="66" width="9" height="4" rx="2" fill="#f8fafc" />
    <rect x="16" y="66" width="9" height="4" rx="2" fill="#f8fafc" />
  </g>

  <!-- Atmospheric nature details (Birds in the sky) -->
  <path d="M45 50 Q50 42 55 50 Q60 42 65 50" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M75 35 Q78 30 82 35 Q86 30 89 35" stroke="#cbd5e1" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5" />

  <!-- Foreground leafy plant frame for depth -->
  <path d="M0 240 Q15 210 0 190" stroke="#059669" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M240 240 Q225 215 235 200" stroke="#10b981" stroke-width="6" fill="none" stroke-linecap="round" />
</svg>