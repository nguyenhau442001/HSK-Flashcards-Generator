<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background rounded rectangle clip -->
    <clipPath id="card-clip">
      <rect x="10" y="10" width="180" height="180" rx="24" />
    </clipPath>
    
    <!-- Shadow for cars -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#090d16" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Background (Dark Mode) -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <g clip-path="url(#card-clip)">
    <!-- Road / Asphalt Background -->
    <path d="M 65 20 L 65 190 L 135 190 L 135 20 Z" fill="#0f172a" />
    
    <!-- Road Curbs / Edges -->
    <line x1="65" y1="20" x2="65" y2="190" stroke="#334155" stroke-width="3" />
    <line x1="135" y1="20" x2="135" y2="190" stroke="#334155" stroke-width="3" />

    <!-- Dashed Center Divider (Glowing Amber) -->
    <line x1="100" y1="25" x2="100" y2="45" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="100" y1="55" x2="100" y2="75" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="100" y1="85" x2="100" y2="105" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="100" y1="115" x2="100" y2="135" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="100" y1="145" x2="100" y2="165" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="100" y1="175" x2="100" y2="195" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />

    <!-- TRAFFIC JAM VEHICLES (Packed tightly from bottom to top) -->

    <!-- Car 1: Red Sedan (Bottom, facing up) -->
    <g filter="url(#shadow)" transform="translate(74, 138)">
      <!-- Body -->
      <rect x="0" y="0" width="22" height="38" rx="6" fill="#ef4444" />
      <!-- Windshield & Rear window -->
      <path d="M 3 12 L 19 12 L 18 24 L 4 24 Z" fill="#38bdf8" opacity="0.8" />
      <rect x="5" y="4" width="12" height="4" rx="1" fill="#38bdf8" opacity="0.8" />
      <!-- Headlights / Taillights (Red glow for traffic jam) -->
      <rect x="2" y="36" width="4" height="2" fill="#fca5a5" />
      <rect x="16" y="36" width="4" height="2" fill="#fca5a5" />
      <!-- Brake Lights Glow -->
      <circle cx="4" cy="37" r="3" fill="#ef4444" opacity="0.6" />
      <circle cx="18" cy="37" r="3" fill="#ef4444" opacity="0.6" />
    </g>

    <!-- Car 2: Sky Blue Hatchback (Directly behind Car 1) -->
    <g filter="url(#shadow)" transform="translate(104, 134)">
      <rect x="0" y="0" width="22" height="36" rx="6" fill="#38bdf8" />
      <path d="M 3 11 L 19 11 L 18 23 L 4 23 Z" fill="#0f172a" opacity="0.7" />
      <rect x="5" y="4" width="12" height="4" rx="1" fill="#0f172a" opacity="0.7" />
      <!-- Brake lights -->
      <rect x="2" y="34" width="4" height="2" fill="#fca5a5" />
      <rect x="16" y="34" width="4" height="2" fill="#fca5a5" />
      <circle cx="4" cy="35" r="3" fill="#ef4444" opacity="0.7" />
      <circle cx="18" cy="35" r="3" fill="#ef4444" opacity="0.7" />
    </g>

    <!-- Car 3: Emerald SUV (Middle-Left) -->
    <g filter="url(#shadow)" transform="translate(73, 88)">
      <rect x="0" y="0" width="24" height="42" rx="7" fill="#10b981" />
      <path d="M 3 13 L 21 13 L 20 28 L 4 28 Z" fill="#38bdf8" opacity="0.8" />
      <rect x="5" y="5" width="14" height="5" rx="1" fill="#38bdf8" opacity="0.8" />
      <!-- Brake lights -->
      <rect x="3" y="40" width="4" height="2" fill="#fca5a5" />
      <rect x="17" y="40" width="4" height="2" fill="#fca5a5" />
      <circle cx="5" cy="41" r="3" fill="#ef4444" opacity="0.7" />
      <circle cx="19" cy="41" r="3" fill="#ef4444" opacity="0.7" />
    </g>

    <!-- Car 4: Amber Taxi/Sedan (Middle-Right, slightly staggered) -->
    <g filter="url(#shadow)" transform="translate(103, 82)">
      <rect x="0" y="0" width="22" height="38" rx="6" fill="#f59e0b" />
      <path d="M 3 12 L 19 12 L 18 25 L 4 25 Z" fill="#1e293b" opacity="0.8" />
      <rect x="5" y="4" width="12" height="4" rx="1" fill="#1e293b" opacity="0.8" />
      <!-- Brake lights -->
      <rect x="2" y="36" width="4" height="2" fill="#fca5a5" />
      <rect x="16" y="36" width="4" height="2" fill="#fca5a5" />
      <circle cx="4" cy="37" r="3" fill="#ef4444" opacity="0.7" />
      <circle cx="18" cy="37" r="3" fill="#ef4444" opacity="0.7" />
    </g>

    <!-- Car 5: Purple/Indigo Car (Top-Left) -->
    <g filter="url(#shadow)" transform="translate(75, 40)">
      <rect x="0" y="0" width="22" height="38" rx="6" fill="#8b5cf6" />
      <path d="M 3 12 L 19 12 L 18 24 L 4 24 Z" fill="#38bdf8" opacity="0.8" />
      <rect x="5" y="4" width="12" height="4" rx="1" fill="#38bdf8" opacity="0.8" />
      <!-- Brake lights -->
      <rect x="2" y="36" width="4" height="2" fill="#fca5a5" />
      <rect x="16" y="36" width="4" height="2" fill="#fca5a5" />
      <circle cx="4" cy="37" r="3" fill="#ef4444" opacity="0.7" />
      <circle cx="18" cy="37" r="3" fill="#ef4444" opacity="0.7" />
    </g>

    <!-- Car 6: Coral Orange Car (Top-Right) -->
    <g filter="url(#shadow)" transform="translate(104, 36)">
      <rect x="0" y="0" width="22" height="38" rx="6" fill="#fb923c" />
      <path d="M 3 12 L 19 12 L 18 24 L 4 24 Z" fill="#1e293b" opacity="0.8" />
      <rect x="5" y="4" width="12" height="4" rx="1" fill="#1e293b" opacity="0.8" />
      <!-- Brake lights -->
      <rect x="2" y="36" width="4" height="2" fill="#fca5a5" />
      <rect x="16" y="36" width="4" height="2" fill="#fca5a5" />
      <circle cx="4" cy="37" r="3" fill="#ef4444" opacity="0.7" />
      <circle cx="18" cy="37" r="3" fill="#ef4444" opacity="0.7" />
    </g>

    <!-- Ambient Roadside Elements (Simple minimalist blocks representing buildings/sidewalks) -->
    <rect x="30" y="30" width="25" height="140" rx="4" fill="#334155" opacity="0.4" />
    <rect x="145" y="30" width="25" height="140" rx="4" fill="#334155" opacity="0.4" />
    
    <!-- Building Windows (Night lights) -->
    <rect x="38" y="45" width="4" height="6" rx="1" fill="#f59e0b" opacity="0.6" />
    <rect x="48" y="45" width="4" height="6" rx="1" fill="#38bdf8" opacity="0.6" />
    <rect x="38" y="70" width="4" height="6" rx="1" fill="#38bdf8" opacity="0.6" />
    <rect x="48" y="70" width="4" height="6" rx="1" fill="#f59e0b" opacity="0.6" />
    <rect x="38" y="110" width="4" height="6" rx="1" fill="#f59e0b" opacity="0.6" />
    <rect x="48" y="135" width="4" height="6" rx="1" fill="#38bdf8" opacity="0.6" />

    <rect x="153" y="55" width="4" height="6" rx="1" fill="#f59e0b" opacity="0.6" />
    <rect x="163" y="55" width="4" height="6" rx="1" fill="#38bdf8" opacity="0.6" />
    <rect x="153" y="95" width="4" height="6" rx="1" fill="#38bdf8" opacity="0.6" />
    <rect x="163" y="120" width="4" height="6" rx="1" fill="#f59e0b" opacity="0.6" />
    <rect x="153" y="145" width="4" height="6" rx="1" fill="#f59e0b" opacity="0.6" />

  </g>
</svg>