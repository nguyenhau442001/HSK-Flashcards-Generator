<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Active Speaker Spotlight -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting / Glow -->
  <circle cx="120" cy="0" r="140" fill="url(#lampGlow)" />
  <polygon points="120,0 70,200 170,200" fill="url(#spotlight)" />

  <!-- Room Interior Details / Environment -->
  <!-- Window Grid in Background -->
  <g opacity="0.15">
    <rect x="30" y="30" width="50" height="80" rx="4" fill="#ffffff" />
    <line x1="55" y1="30" x2="55" y2="110" stroke="#0f172a" stroke-width="2" />
    <line x1="30" y1="70" x2="80" y2="70" stroke="#0f172a" stroke-width="2" />
    
    <rect x="160" y="30" width="50" height="80" rx="4" fill="#ffffff" />
    <line x1="185" y1="30" x2="185" y2="110" stroke="#0f172a" stroke-width="2" />
    <line x1="160" y1="70" x2="210" y2="70" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Hanging Pendant Lamp -->
  <path d="M120,0 L120,40" stroke="#475569" stroke-width="2" />
  <path d="M100,40 L140,40 L145,50 L95,50 Z" fill="#334155" />
  <ellipse cx="120" cy="50" rx="25" ry="8" fill="#fbbf24" filter="url(#softShadow)" />

  <!-- Meeting Table -->
  <path d="M35,160 L205,160 L220,200 L20,200 Z" fill="#334155" filter="url(#softShadow)" />
  <path d="M35,160 L205,160 L205,166 L35,166 Z" fill="#475569" />
  <!-- Table props: Coffee mug, notes -->
  <rect x="50" y="170" width="14" height="16" rx="3" fill="#cbd5e1" />
  <path d="M45,175 C42,175 42,183 45,183" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <rect x="175" y="172" width="22" height="16" rx="2" fill="#f8fafc" transform="rotate(-10 175 172)" />
  <line x1="179" y1="177" x2="191" y2="177" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="179" y1="182" x2="188" y2="182" stroke="#94a3b8" stroke-width="1.5" />

  <!-- === CHARACTERS DEPICTING "轮流发言" (TAKING TURNS TO SPEAK) === -->

  <!-- Character 1: Left (Listening attentively, resting chin on hand) -->
  <g transform="translate(15, 110)">
    <!-- Body & Chair -->
    <path d="M35,80 L65,80 L70,110 L30,110 Z" fill="#1e293b" />
    <path d="M40,35 C40,20 60,20 60,35 L60,60 L40,60 Z" fill="#0ea5e9" />
    <!-- Head & Face -->
    <circle cx="50" cy="22" r="14" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M36,22 C36,10 64,10 64,22 C64,26 60,24 58,18 C54,12 46,12 42,18 C40,24 36,26 36,22 Z" fill="#0f172a" />
    <!-- Arm resting -->
    <path d="M45,50 C45,50 30,55 35,65 C38,70 48,65 52,55" fill="#fbcfe8" />
    <!-- Expression: Calm, attentive listening -->
    <circle cx="45" cy="21" r="1.5" fill="#0f172a" />
    <circle cx="55" cy="21" r="1.5" fill="#0f172a" />
    <path d="M49,27 Q50,29 51,27" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Character 2: Right (Listening attentively, smiling) -->
  <g transform="translate(165, 110)">
    <!-- Body & Outfit -->
    <path d="M35,80 L65,80 L70,110 L30,110 Z" fill="#1e293b" />
    <path d="M40,35 C40,20 60,20 60,35 L60,60 L40,60 Z" fill="#10b981" />
    <!-- Head & Face -->
    <circle cx="50" cy="22" r="14" fill="#fed7aa" />
    <!-- Hair (Bob cut) -->
    <path d="M35,18 C35,8 65,8 65,18 L65,30 L59,26 L50,32 L41,26 L35,30 Z" fill="#78350f" />
    <!-- Arm -->
    <path d="M55,50 C65,55 60,70 50,75" fill="none" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" />
    <!-- Expression: Warm smile -->
    <circle cx="45" cy="21" r="1.5" fill="#1e293b" />
    <circle cx="55" cy="21" r="1.5" fill="#1e293b" />
    <path d="M48,26 Q50,29 52,26" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Character 3: CENTER / ACTIVE SPEAKER (The main focus holding a microphone/gesture, speaking their turn) -->
  <g transform="translate(85, 95)" filter="url(#softShadow)">
    <!-- Torso / Outfit -->
    <path d="M25,85 L75,85 L85,125 L15,125 Z" fill="#1e293b" />
    <path d="M32,35 C32,20 68,20 68,35 L70,75 L30,75 Z" fill="#ec4899" />
    <!-- Collar -->
    <path d="M42,35 L50,45 L58,35 Z" fill="#fbcfe8" />
    
    <!-- Raised Active Arm (Speaking gesture) -->
    <path d="M65,45 C80,45 85,30 90,20" fill="none" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" />
    <!-- Hand holding small mic/gesture -->
    <circle cx="92" cy="17" r="5" fill="#94a3b8" />
    <rect x="90" y="12" width="4" height="8" rx="2" fill="#cbd5e1" />

    <!-- Head & Face (Looking energetic and engaged) -->
    <circle cx="50" cy="22" r="16" fill="#fed7aa" />
    
    <!-- Dynamic Hair (Ponytail) -->
    <path d="M33,20 C33,6 67,6 67,20 C75,18 78,12 82,8 C74,26 50,26 33,20 Z" fill="#b45309" />
    <circle cx="83" cy="8" r="4" fill="#b45309" />

    <!-- Expression: Talking (Open mouth, expressive eyes) -->
    <circle cx="43" cy="20" r="2" fill="#1e293b" />
    <circle cx="57" cy="20" r="2" fill="#1e293b" />
    <path d="M47,26 Q50,32 53,26 Z" fill="#be123c" />

    <!-- Speech/Sound Action Waves (Representing '发言' - speaking/presentation) -->
    <path d="M102,12 C106,15 106,20 102,23" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M107,9 C113,14 113,21 107,26" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Turn-Taking Visual Indicator: Circular Arrow / Flow Motif floating above subtly -->
  <g transform="translate(120, 32)" opacity="0.6">
    <path d="M-15,0 C-15,-8 15,-8 15,0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
    <path d="M12,-3 L16,0 L12,3" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M15,5 C15,13 -15,13 -15,5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
    <path d="M-12,8 L-16,5 L-12,2" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

</svg>