<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="teaGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teaLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Warm ambient light circle behind scene -->
  <circle cx="120" cy="130" r="80" fill="url(#teaGlow)"/>

  <!-- Wooden Table Surface -->
  <path d="M 20,180 L 220,180 L 230,220 L 10,220 Z" fill="#090d16" opacity="0.6"/>
  <rect x="0" y="175" width="240" height="10" rx="3" fill="#334155"/>

  <!-- Background interior props: shelf / plant hint -->
  <path d="M 40,90 L 80,90 L 75,130 L 45,130 Z" fill="#334155" opacity="0.2"/>
  <circle cx="60" cy="80" r="12" fill="#10b981" opacity="0.3"/>

  <!-- Teapot (Glass/Ceramic style with dark strong tea inside) -->
  <g transform="translate(45, 110)">
    <!-- Pot body -->
    <path d="M 15,10 C 5,10 0,20 0,35 C 0,50 10,58 20,60 L 30,60 C 40,58 50,50 50,35 C 50,20 45,10 35,10 Z" fill="#cbd5e1" opacity="0.9"/>
    <!-- Lid -->
    <ellipse cx="25" cy="10" rx="12" ry="3" fill="#94a3b8"/>
    <circle cx="25" cy="5" r="3" fill="#cbd5e1"/>
    <!-- Handle -->
    <path d="M 0,22 C -10,22 -12,45 0,50" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Spout -->
    <path d="M 45,20 C 58,15 62,25 55,35" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- The Teacup (Centerpiece: "这杯茶") -->
  <g transform="translate(100, 130)">
    <!-- Saucer -->
    <ellipse cx="20" cy="40" rx="26" ry="7" fill="#64748b"/>
    <ellipse cx="20" cy="39" rx="22" ry="5" fill="#475569"/>
    
    <!-- Cup Body -->
    <path d="M 6,5 L 8,36 C 8,40 32,40 34,36 L 36,5 Z" fill="#f8fafc"/>
    <!-- Inner liquid (Very dark, thick "nóng" tea) -->
    <ellipse cx="21" cy="8" rx="13" ry="4" fill="url(#teaLiquid)"/>

    <!-- Steam / Aroma lines representing strong rich flavor ("味道很浓") -->
    <path d="M 16,0 C 14,-6 18,-10 16,-16" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 26,0 C 28,-7 23,-12 26,-18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 21,-3 C 23,-9 19,-13 22,-20" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Character Experiencing the Tea (Head & Shoulders, Expressive Reaction) -->
  <g transform="translate(135, 75)">
    <!-- Body / Shoulders -->
    <path d="M 10,95 C 10,75 30,70 50,70 C 70,70 90,75 90,95 Z" fill="#3b82f6"/>
    <path d="M 30,73 L 50,90 L 70,73" fill="none" stroke="#1d4ed8" stroke-width="3"/>

    <!-- Neck -->
    <rect x="42" y="55" width="16" height="20" fill="#fbcfe8" rx="4"/>

    <!-- Head -->
    <circle cx="50" cy="40" r="26" fill="#fbcfe8"/>

    <!-- Hair -->
    <path d="M 24,35 C 24,15 40,12 52,14 C 70,16 76,26 76,42 C 76,42 70,30 52,28 C 36,26 28,32 24,35 Z" fill="#0f172a"/>

    <!-- Facial Expression: Delighted/Satisfied smelling/tasting the strong aroma -->
    <!-- Closed happy eyes -->
    <path d="M 38,38 C 40,41 44,41 46,38" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 54,38 C 56,41 60,41 62,38" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="37" cy="45" r="4" fill="#fda4af" opacity="0.6"/>
    <circle cx="63" cy="45" r="4" fill="#fda4af" opacity="0.6"/>

    <!-- Smile (appreciating rich taste) -->
    <path d="M 44,49 C 47,53 53,53 56,49" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Hand near chin / gesturing appreciation -->
    <path d="M 70,65 C 75,60 82,68 76,75 C 72,80 65,75 68,70" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5"/>
  </g>

  <!-- Floating flavor sparkle indicators (richness detail) -->
  <g transform="translate(125, 110)">
    <path d="M 0,0 L 2,4 L 6,6 L 2,8 L 0,12 L -2,8 L -6,6 L -2,4 Z" fill="#fbbf24" opacity="0.9"/>
  </g>
  <g transform="translate(80, 105)">
    <path d="M 0,0 L 1.5,3 L 4.5,4.5 L 1.5,6 L 0,9 L -1.5,6 L -4.5,4.5 L -1.5,3 Z" fill="#f59e0b" opacity="0.8"/>
  </g>
</svg>