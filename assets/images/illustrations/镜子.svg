<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Wood / Vanity Table Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Mirror Frame Gradient (Warm Gold/Amber) -->
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Mirror Reflection Gradient -->
    <linearGradient id="mirrorReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#cbd5e1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Reflection Sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Plant Pot & Foliage Gradients -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Perfume Bottle Gradients -->
    <linearGradient id="perfumeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Wall Lighting / Glow Behind Mirror -->
  <circle cx="120" cy="100" r="60" fill="#fbbf24" opacity="0.08" filter="url(#glow)"/>

  <!-- BACKGROUND PROPS (Shelf / Wall Details) -->
  <!-- Hanging wall shelf or accent line -->
  <path d="M 40 45 L 200 45" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Small framed picture in background -->
  <rect x="175" y="60" width="30" height="35" rx="3" fill="#334155" opacity="0.4"/>
  <rect x="180" y="65" width="20" height="25" fill="#475569" opacity="0.4"/>

  <!-- VANITY TABLE / SURFACE -->
  <!-- Table Top Surface -->
  <path d="M 20 185 L 220 185 L 230 215 L 10 215 Z" fill="url(#deskTop)" filter="url(#softShadow)"/>
  <!-- Table Front Edge -->
  <rect x="10" y="212" width="220" height="8" rx="2" fill="#334155"/>
  <!-- Table Legs (Subtle) -->
  <rect x="35" y="220" width="8" height="15" fill="#1e293b"/>
  <rect x="197" y="220" width="8" height="15" fill="#1e293b"/>

  <!-- TABLETOP PROPS: Potted Plant (Left) -->
  <g transform="translate(32, 160)">
    <path d="M 5 15 L 25 15 L 22 35 L 8 35 Z" fill="url(#potGrad)"/>
    <ellipse cx="15" cy="15" rx="10" ry="3" fill="#fda4af"/>
    <!-- Leaves -->
    <path d="M 15 15 Q 0 5 2 -10 Q 10 0 15 15 Z" fill="url(#leafGrad)"/>
    <path d="M 15 15 Q 25 0 28 -15 Q 20 -2 15 15 Z" fill="url(#leafGrad)"/>
    <path d="M 15 15 Q 12 -5 20 -20 Q 18 -5 15 15 Z" fill="#10b981"/>
  </g>

  <!-- TABLETOP PROPS: Perfume Bottle (Right) -->
  <g transform="translate(170, 162)">
    <rect x="6" y="2" width="8" height="6" rx="1" fill="#f59e0b"/>
    <rect x="2" y="8" width="16" height="22" rx="4" fill="url(#perfumeGlass)" filter="url(#softShadow)"/>
    <path d="M 7 14 Q 10 10 13 14" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- MAIN SUBJECT: THE MIRROR (镜子 - jìngzi) -->
  <g filter="url(#softShadow)">
    <!-- Mirror Stand / Base -->
    <ellipse cx="120" cy="186" rx="26" ry="7" fill="url(#goldFrame)"/>
    <path d="M 117 175 L 123 175 L 125 186 L 115 186 Z" fill="#b45309"/>
    
    <!-- Mirror Stem / Pivot -->
    <rect x="116" y="155" width="8" height="23" rx="3" fill="url(#goldFrame)"/>
    <circle cx="120" cy="162" r="6" fill="#d97706"/>

    <!-- Arch / Vanity Mirror Outer Frame -->
    <!-- Centered at x=120, spanning y from 50 to 175 -->
    <path d="M 75 95 
             C 75 60, 95 50, 120 50 
             C 145 50, 165 60, 165 95 
             L 165 155 
             C 165 162, 158 168, 150 168 
             L 90 168 
             C 82 168, 75 162, 75 155 Z" 
          fill="url(#goldFrame)" />

    <!-- Mirror Inner Bezel -->
    <path d="M 80 96 
             C 80 65, 98 56, 120 56 
             C 142 56, 160 65, 160 96 
             L 160 152 
             C 160 157, 155 162, 150 162 
             L 90 162 
             C 85 162, 80 157, 80 152 Z" 
          fill="#475569" />

    <!-- Mirror Glass (Reflective Surface) -->
    <path d="M 83 96 
             C 83 68, 99 59, 120 59 
             C 141 59, 157 68, 157 96 
             L 157 150 
             C 157 154, 153 158, 149 158 
             L 91 158 
             C 87 158, 83 154, 83 150 Z" 
          fill="url(#mirrorReflect)" />

    <!-- REFLECTED SCENE (Inside the Mirror) -->
    <!-- Abstract cute reflection: colorful cozy room elements inside mirror -->
    <g clip-path="url(#mirrorClip)">
      <clipPath id="mirrorClip">
        <path d="M 83 96 C 83 68, 99 59, 120 59 C 141 59, 157 68, 157 96 L 157 150 C 157 154, 153 158, 149 158 L 91 158 C 87 158, 83 154, 83 150 Z"/>
      </clipPath>

      <!-- Reflection background gradient -->
      <path d="M 83 50 H 157 V 160 H 83 Z" fill="#0f172a" clip-path="url(#mirrorClip)"/>
      
      <!-- Reflected wall glow and mini lamp -->
      <circle cx="120" cy="80" r="25" fill="#fbbf24" opacity="0.15" clip-path="url(#mirrorClip)"/>
      <path d="M 115 70 L 125 70 L 122 85 L 118 85 Z" fill="#38bdf8" opacity="0.6" clip-path="url(#mirrorClip)"/>

      <!-- Friendly stylized reflection silhouette (person looking in mirror) -->
      <circle cx="120" cy="115" r="16" fill="#f43f5e" opacity="0.8" clip-path="url(#mirrorClip)"/> <!-- Head -->
      <path d="M 100 150 C 100 132, 140 132, 140 150 Z" fill="#38bdf8" opacity="0.8" clip-path="url(#mirrorClip)"/> <!-- Shoulders/Shirt -->
      
      <!-- Sparkle on Face/Reflection -->
      <circle cx="125" cy="110" r="2" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Mirror Glass Sheen (Gloss Overlay) -->
    <path d="M 85 96 C 85 70, 100 61, 120 61 L 85 130 Z" fill="url(#sheen)"/>
    <path d="M 130 61 C 145 65, 155 75, 155 95 L 140 95 C 140 80, 135 70, 130 61 Z" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- FOREGROUND / INTERACTION SPARKS & HIGHLIGHTS -->
  <!-- Cute sparkle star top left of mirror -->
  <g transform="translate(70, 50)" fill="#fbbf24" filter="url(#glow)">
    <path d="M 0 6 C 3 6, 6 3, 6 0 C 6 -3, 3 -6, 0 -6 C -3 -6, -6 -3, -6 0 C -6 3, -3 6, 0 6 Z" opacity="0.9"/>
    <path d="M 0 10 L 0 -10 M -10 0 L 10 0" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Cute sparkle star top right of mirror -->
  <g transform="translate(175, 75)" fill="#38bdf8">
    <path d="M 0 4 C 2 4, 4 2, 4 0 C 4 -2, 2 -4, 0 -4 C -2 -4, -4 -2, -4 0 C -4 2, -2 4, 0 4 Z" opacity="0.9"/>
    <path d="M 0 7 L 0 -7 M -7 0 L 7 0" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Tiny floating sparkle bubble -->
  <circle cx="155" cy="40" r="3" fill="#f43f5e" opacity="0.7"/>
  <circle cx="65" cy="110" r="2" fill="#34d399" opacity="0.8"/>
</svg>