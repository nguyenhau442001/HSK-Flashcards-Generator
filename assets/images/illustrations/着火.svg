<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Night Sky & Environment -->
  <path d="M0 130 H240 V240 H0 Z" fill="#1e293b"/>
  
  <!-- Distant Background House Silhouette -->
  <path d="M30 140 L70 100 L110 140 Z" fill="#334155"/>
  <rect x="40" y="140" width="60" height="60" fill="#334155"/>
  
  <!-- Main Burning House (Center) -->
  <g id="burning-house">
    <!-- House Base/Walls -->
    <rect x="80" y="110" width="100" height="90" fill="#475569" rx="4"/>
    <!-- Wall texture/darkening from fire -->
    <path d="M80 150 Q130 170 180 150 V200 H80 Z" fill="#1e293b" opacity="0.6"/>
    
    <!-- Roof Structure -->
    <path d="M70 110 L130 60 L190 110 Z" fill="#334155"/>
    <path d="M72 108 L130 62 L188 108 Z" fill="#64748b"/>
    
    <!-- Windows -->
    <rect x="95" y="125" width="22" height="25" rx="3" fill="#0f172a"/>
    <rect x="143" y="125" width="22" height="25" rx="3" fill="#0f172a"/>
    <!-- Window glowing from fire inside -->
    <rect x="98" y="128" width="16" height="19" fill="#fbbf24" opacity="0.8"/>
    <rect x="146" y="128" width="16" height="19" fill="#fb923c" opacity="0.8"/>
    
    <!-- Door -->
    <rect x="112" y="160" width="36" height="40" rx="2" fill="#0f172a"/>
    
    <!-- Fire and Flames engulfing the house -->
    <!-- Base Orange/Yellow Glow -->
    <path d="M60 115 Q90 60 130 50 Q180 60 200 115 Q210 160 180 200 H60 Q30 160 60 115 Z" fill="#f59e0b" opacity="0.2"/>
    
    <!-- Large Flames on Roof and Left Side -->
    <path d="M110 80 Q120 40 130 20 Q145 50 155 70 Q170 30 180 45 Q190 80 170 110 Z" fill="#fbbf24"/>
    <path d="M120 70 Q128 35 135 15 Q145 40 150 60 Q162 25 170 40 Q178 75 160 100 Z" fill="#fb923c"/>
    <path d="M125 65 Q130 30 135 10 Q140 30 145 50 Q152 20 158 35 Q165 65 150 90 Z" fill="#fef08a"/>
    
    <!-- Side Flames bursting through walls -->
    <path d="M75 115 Q60 90 65 75 Q80 90 90 100 Z" fill="#fb923c"/>
    <path d="M175 110 Q195 90 190 75 Q175 95 165 105 Z" fill="#fbbf24"/>
    <path d="M70 130 Q50 120 55 105 Q70 120 80 125 Z" fill="#ef4444"/>
    <path d="M180 135 Q205 125 195 110 Q180 125 170 130 Z" fill="#ef4444"/>
    
    <!-- Smoke Clouds -->
    <circle cx="110" cy="25" r="14" fill="#64748b" opacity="0.7"/>
    <circle cx="125" cy="15" r="18" fill="#64748b" opacity="0.6"/>
    <circle cx="145" cy="10" r="12" fill="#94a3b8" opacity="0.5"/>
    <circle cx="160" cy="20" r="16" fill="#64748b" opacity="0.6"/>
  </g>
  
  <!-- Foreground Ground & Street -->
  <path d="M0 200 H240 V240 H0 Z" fill="#0f172a"/>
  <!-- Sidewalk/Road Curb -->
  <path d="M0 200 H240 V206 H0 Z" fill="#334155"/>
  <path d="M0 206 H240 V240 H0 Z" fill="#1e293b"/>
  
  <!-- Shocked Human Characters in Foreground (Eyewitnesses) -->
  <!-- Character 1 (Left: Shocked Resident) -->
  <g id="character-left">
    <!-- Body -->
    <path d="M35 240 V220 C35 210 45 205 55 205 C65 205 75 210 75 220 V240 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="55" cy="190" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M41 188 C41 180 48 175 55 175 C62 175 69 180 69 188 Z" fill="#475569"/>
    <!-- Shocked Open Mouth -->
    <circle cx="55" cy="195" r="3" fill="#881337"/>
    <!-- Raised Hands in Alarm -->
    <circle cx="40" cy="190" r="5" fill="#fbcfe8"/>
    <circle cx="70" cy="190" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Character 2 (Right: Concerned Neighbor pointing) -->
  <g id="character-right">
    <!-- Body -->
    <path d="M170 240 V215 C170 205 180 200 190 200 C200 200 210 205 210 215 V240 Z" fill="#f43f5e"/>
    <!-- Head -->
    <circle cx="190" cy="185" r="13" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M178 183 C178 175 184 170 190 170 C196 170 202 175 202 183 Z" fill="#1e293b"/>
    <!-- Pointing Arm -->
    <path d="M175 205 L150 190 L155 185 L178 198 Z" fill="#fed7aa"/>
    <!-- Shocked/Worried Eyes -->
    <circle cx="186" cy="183" r="1.5" fill="#1e293b"/>
    <circle cx="194" cy="183" r="1.5" fill="#1e293b"/>
  </g>

  <!-- Dynamic Lighting/Glow on Foreground elements from the Fire -->
  <path d="M0 200 H240 V240 H0 Z" fill="url(#fireGlow)" opacity="0.3"/>
  <defs>
    <linearGradient id="fireGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>