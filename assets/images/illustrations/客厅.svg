<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window City View Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Soft Shadow for Furniture -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ==================== ROOM STRUCTURE ==================== -->
  
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#334155" rx="4"/>
  
  <!-- Wooden Floor -->
  <path d="M 20 170 L 220 170 L 235 220 L 5 220 Z" fill="#b45309" filter="url(#shadow)"/>
  <!-- Floor Planks perspective lines -->
  <line x1="60" y1="170" x2="35" y2="220" stroke="#92400e" stroke-width="1.5"/>
  <line x1="100" y1="170" x2="75" y2="220" stroke="#92400e" stroke-width="1.5"/>
  <line x1="140" y1="170" x2="120" y2="220" stroke="#92400e" stroke-width="1.5"/>
  <line x1="180" y1="170" x2="175" y2="220" stroke="#92400e" stroke-width="1.5"/>
  <line x1="20" y1="190" x2="220" y2="190" stroke="#92400e" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="207" x2="230" y2="207" stroke="#92400e" stroke-width="1" opacity="0.5"/>

  <!-- Baseboard -->
  <rect x="20" y="165" width="200" height="5" fill="#475569"/>

  <!-- ==================== BACKGROUND PROPS ==================== -->

  <!-- Window Frame & Night View -->
  <rect x="145" y="35" width="60" height="85" fill="url(#nightSky)" stroke="#475569" stroke-width="3" rx="2"/>
  <!-- City Lights in Window -->
  <rect x="152" y="60" width="8" height="12" fill="#fbbf24" opacity="0.6"/>
  <rect x="165" y="85" width="10" height="25" fill="#38bdf8" opacity="0.5"/>
  <rect x="185" y="50" width="12" height="18" fill="#fbbf24" opacity="0.4"/>
  <rect x="180" y="75" width="8" height="15" fill="#38bdf8" opacity="0.7"/>
  <!-- Window Grid -->
  <line x1="175" y1="35" x2="175" y2="120" stroke="#475569" stroke-width="2"/>
  <line x1="145" y1="77" x2="205" y2="77" stroke="#475569" stroke-width="2"/>
  <!-- Window Sill -->
  <rect x="141" y="118" width="68" height="4" fill="#64748b" rx="1"/>

  <!-- Wall Painting / Art -->
  <rect x="50" y="40" width="50" height="35" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" rx="2"/>
  <circle cx="75" cy="52" r="8" fill="#38bdf8"/>
  <path d="M 55 65 Q 70 50 85 65 Z" fill="#10b981"/>

  <!-- Potted Plant on Floor (Left) -->
  <path d="M 25 155 L 45 155 L 42 172 L 28 172 Z" fill="#cbd5e1"/> <!-- Pot -->
  <ellipse cx="35" cy="155" rx="10" ry="3" fill="#94a3b8"/>
  <!-- Plant Leaves -->
  <path d="M 35 152 Q 20 135 25 120 Q 35 140 35 152" fill="#10b981"/>
  <path d="M 35 152 Q 45 130 55 125 Q 45 145 35 152" fill="#059669"/>
  <path d="M 35 152 Q 30 120 40 110 Q 38 135 35 152" fill="#34d399"/>

  <!-- ==================== MAIN FURNITURE & CHARACTERS ==================== -->

  <!-- Floor Lamp (Right side) -->
  <circle cx="115" cy="85" r="45" fill="url(#lampGlow)"/>
  <line x1="115" y1="35" x2="115" y2="170" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="115" cy="170" rx="12" ry="4" fill="#475569"/>
  <!-- Lamp Shade -->
  <path d="M 98 35 L 132 35 L 125 55 L 105 55 Z" fill="#fbbf24" filter="url(#shadow)"/>

  <!-- Modern Sofa (Center-Left) -->
  <!-- Sofa Shadow -->
  <ellipse cx="85" cy="158" rx="65" ry="10" fill="#0f172a" opacity="0.4"/>
  
  <!-- Sofa Base & Cushions -->
  <rect x="30" y="115" width="110" height="40" fill="#38bdf8" rx="8" filter="url(#shadow)"/>
  <rect x="30" y="105" width="110" height="20" fill="#0284c7" rx="6"/> <!-- Backrest -->
  <!-- Sofa Armrests -->
  <rect x="25" y="110" height="45" width="12" fill="#0369a1" rx="4"/>
  <rect x="133" y="110" height="45" width="12" fill="#0369a1" rx="4"/>
  
  <!-- Accent Pillows -->
  <rect x="36" y="110" width="18" height="18" fill="#ec4899" rx="4" transform="rotate(15 45 119)"/>
  <rect x="110" y="112" width="16" height="16" fill="#f59e0b" rx="4" transform="rotate(-10 118 120)"/>

  <!-- Coffee Table in Front of Sofa -->
  <rect x="55" y="150" width="60" height="22" fill="#cbd5e1" rx="3" filter="url(#shadow)"/>
  <rect x="60" y="172" width="4" height="12" fill="#64748b"/>
  <rect x="106" y="172" width="4" height="12" fill="#64748b"/>
  <!-- Teacup on Table -->
  <rect x="75" y="143" width="8" height="7" fill="#ffffff" rx="1"/>
  <path d="M 83 145 C 86 145 86 148 83 149" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <!-- Book on Table -->
  <rect x="90" y="145" width="14" height="4" fill="#ef4444" rx="1"/>
  <rect x="91" y="143" width="12" height="3" fill="#f87171" rx="1"/>

  <!-- Rug under Coffee Table & Sofa -->
  <ellipse cx="85" cy="165" rx="75" ry="20" fill="#475569" opacity="0.4"/>
  <ellipse cx="85" cy="165" rx="70" ry="17" fill="#64748b" opacity="0.3"/>

  <!-- ==================== CHARACTER (Visiting Guest waiting in Living Room) ==================== -->
  
  <!-- Guest sitting on Sofa -->
  <!-- Body / Torso -->
  <rect x="75" y="112" width="28" height="30" fill="#10b981" rx="6" filter="url(#shadow)"/>
  <!-- Head -->
  <circle cx="89" cy="94" r="11" fill="#fde68a"/>
  <!-- Hair -->
  <path d="M 78 93 Q 89 80 100 93 Q 95 86 89 86 Q 83 86 78 93 Z" fill="#334155"/>
  <!-- Friendly Face / Expression (Looking relaxed, waiting) -->
  <circle cx="85" cy="94" r="1.5" fill="#334155"/>
  <circle cx="93" cy="94" r="1.5" fill="#334155"/>
  <path d="M 88 98 Q 89 100 90 98" stroke="#334155" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Arms resting -->
  <rect x="65" y="120" width="14" height="10" fill="#059669" rx="5"/>
  <rect x="99" y="120" width="14" height="10" fill="#059669" rx="5"/>
  
  <!-- Legs (Sitting posture over edge of sofa) -->
  <rect x="78" y="150" width="8" height="18" fill="#334155" rx="3"/>
  <rect x="92" y="150" width="8" height="18" fill="#334155" rx="3"/>
  <!-- Shoes -->
  <ellipse cx="82" cy="169" rx="5" ry="3" fill="#f8fafc"/>
  <ellipse cx="96" cy="169" rx="5" ry="3" fill="#f8fafc"/>

  <!-- Atmospheric Lighting Overlay for Warm Inviting Vibe -->
  <rect width="240" height="240" rx="24" fill="#fbbf24" opacity="0.04" pointer-events="none"/>
</svg>