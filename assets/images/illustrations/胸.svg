<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="sun-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Jacket Gradient -->
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Skin Gradient -->
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#sun-glow)"/>

  <!-- Background Environment: Park / Outdoor scene hinting at breadth -->
  <g id="environment">
    <!-- Distant mountains/hills -->
    <path d="M 0 160 Q 60 130 120 150 T 240 140 L 240 240 L 0 240 Z" fill="#1e293b" opacity="0.6"/>
    <!-- Park path and ground -->
    <path d="M 0 190 Q 120 170 240 195 L 240 240 L 0 240 Z" fill="#0f172a"/>
    
    <!-- Horizon trees / lamppost for scale -->
    <circle cx="35" cy="140" r="12" fill="#065f46" opacity="0.4"/>
    <rect x="33" y="145" width="4" height="25" fill="#334155" opacity="0.5"/>
    
    <circle cx="205" cy="135" r="16" fill="#047857" opacity="0.5"/>
    <rect x="203" y="145" width="4" height="30" fill="#334155" opacity="0.5"/>

    <!-- Decorative width measurement line emphasizing "kuān" (wide chest) -->
    <g opacity="0.4">
      <line x1="68" y1="100" x2="172" y2="100" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
      <polygon points="68,100 76,96 76,104" fill="#f59e0b"/>
      <polygon points="172,100 164,96 164,104" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Main Character: Athletic man standing with a broad, confident posture -->
  <g id="character">
    <!-- Shadow under feet -->
    <ellipse cx="120" cy="205" rx="35" ry="8" fill="#020617" opacity="0.6"/>

    <!-- Legs & Shoes -->
    <rect x="103" y="170" width="12" height="35" fill="#334155" rx="6"/>
    <rect x="125" y="170" width="12" height="35" fill="#334155" rx="6"/>
    <path d="M 98 202 L 115 202 C 118 202 120 205 120 207 L 98 207 Z" fill="#0f172a"/>
    <path d="M 125 202 L 142 202 C 145 202 147 205 147 207 L 125 207 Z" fill="#0f172a"/>

    <!-- Torso: Broad chest emphasizing "xiōng" (chest) and "kuān" (wide) -->
    <!-- Open jacket showing broad chest -->
    <path d="M 85 95 L 155 95 C 165 95 172 110 168 135 L 160 175 C 158 180 152 180 148 175 L 138 130 L 120 145 L 102 130 L 92 175 C 88 180 82 180 80 175 L 72 135 C 68 110 75 95 85 95 Z" fill="url(#jacket-grad)"/>

    <!-- Inner shirt (white/light grey) spanning wide across the chest -->
    <path d="M 92 105 L 148 105 L 140 150 L 120 160 L 100 150 Z" fill="#f8fafc"/>

    <!-- Arms (Akimbo / Hands on hips to expand and showcase chest width) -->
    <!-- Left Arm -->
    <path d="M 85 98 C 65 105 55 125 60 145 C 63 155 72 155 75 145 C 72 130 80 115 95 110 Z" fill="#0284c7"/>
    <!-- Right Arm -->
    <path d="M 155 98 C 175 105 185 125 180 145 C 177 155 168 155 165 145 C 168 130 160 115 145 110 Z" fill="#0284c7"/>

    <!-- Neck -->
    <rect x="110" y="80" width="20" height="20" fill="url(#skin-grad)" rx="4"/>

    <!-- Head -->
    <circle cx="120" cy="68" r="22" fill="url(#skin-grad)"/>

    <!-- Hair (Stylish dark blue/slate short hair) -->
    <path d="M 98 68 C 98 48 142 48 142 68 C 142 72 138 72 138 65 C 138 54 102 54 102 65 C 102 72 98 72 98 68 Z" fill="#1e293b"/>

    <!-- Friendly, confident facial expression -->
    <!-- Eyes (happy arcs) -->
    <path d="M 110 66 Q 114 62 118 66" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 122 66 Q 126 62 130 66" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Confident Smile -->
    <path d="M 113 77 Q 120 83 127 77" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Cheeks (subtle blush for friendly vibe) -->
    <circle cx="108" cy="72" r="3" fill="#fb7185" opacity="0.4"/>
    <circle cx="132" cy="72" r="3" fill="#fb7185" opacity="0.4"/>
  </g>

  <!-- Foreground details / lighting accents -->
  <g id="accents">
    <!-- Warm floating particles / atmosphere -->
    <circle cx="50" cy="80" r="2" fill="#fbbf24" opacity="0.6"/>
    <circle cx="190" cy="90" r="3" fill="#fbbf24" opacity="0.4"/>
    <circle cx="170" cy="50" r="1.5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="75" cy="40" r="2.5" fill="#fbbf24" opacity="0.5"/>
  </g>
</svg>