<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="scale-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Atmospheric background highlights -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>
  <circle cx="120" cy="110" r="40" fill="#fbbf24" opacity="0.05" filter="url(#glow)"/>

  <!-- Background architectural elements (isometric shelf / desk) -->
  <path d="M40 180 L120 200 L200 180 L200 188 L120 208 L40 188 Z" fill="#334155" opacity="0.7"/>
  <rect x="55" y="145" width="25" height="35" rx="3" fill="#475569" opacity="0.5"/>
  <rect x="85" y="135" width="20" height="45" rx="3" fill="#64748b" opacity="0.5"/>
  <rect x="160" y="150" width="30" height="30" rx="3" fill="#334155" opacity="0.6"/>

  <!-- MAIN SUBJECT: The Scale of Balance / Reasonableness (合理) -->
  <!-- Base Stand -->
  <path d="M100 200 L140 200 L145 190 L95 190 Z" fill="#475569"/>
  <rect x="114" y="65" width="12" height="125" rx="3" fill="url(#scale-beam)"/>
  <circle cx="120" cy="65" r="10" fill="#f59e0b"/>

  <!-- Pivot Top Piece -->
  <path d="M110 55 L130 55 L120 40 Z" fill="#fbbf24"/>

  <!-- Balance Beam (Balanced horizontally, representing "reasonable/fair") -->
  <g transform="rotate(0 120 65)">
    <path d="M50 62 L190 62 L185 70 L55 70 Z" fill="url(#scale-beam)"/>
    <circle cx="50" cy="66" r="4" fill="#94a3b8"/>
    <circle cx="190" cy="66" r="4" fill="#94a3b8"/>
    
    <!-- Left Chain & Pan -->
    <path d="M55 70 L55 105 L40 105" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M55 70 L55 105 L70 105" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M35 105 C35 120 85 120 85 105 Z" fill="#cbd5e1"/>
    <ellipse cx="60" cy="105" rx="25" ry="4" fill="#94a3b8"/>

    <!-- Right Chain & Pan -->
    <path d="M185 70 L185 105 L170 105" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M185 70 L185 105 L200 105" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M165 105 C165 120 215 120 215 105 Z" fill="#cbd5e1"/>
    <ellipse cx="190" cy="105" rx="25" ry="4" fill="#94a3b8"/>
  </g>

  <!-- Items on Scales (Representing logical distribution / accurate matching) -->
  <!-- Left Pan Items: Document / Data representation -->
  <rect x="48" y="90" width="20" height="15" rx="2" fill="#38bdf8" transform="rotate(-10 58 97)"/>
  <rect x="55" y="85" width="18" height="14" rx="2" fill="#e2e8f0" transform="rotate(5 64 92)"/>

  <!-- Right Pan Items: Polished Gem / Value representation -->
  <polygon points="190,85 202,97 190,105 178,97" fill="url(#gold-glow)"/>
  <polygon points="190,85 196,97 190,105" fill="#fef08a" opacity="0.6"/>

  <!-- Floating Glow Sparks / Harmony Indicators -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="85" cy="55" r="3" opacity="0.8"/>
    <circle cx="155" cy="55" r="3" opacity="0.8"/>
  </g>
  <g fill="#fbbf24" filter="url(#glow)">
    <circle cx="120" cy="30" r="4"/>
    <circle cx="120" cy="30" r="8" opacity="0.4"/>
  </g>

  <!-- Sparkle cross top-left -->
  <path d="M45 45 Q45 55 35 55 Q45 55 45 65 Q45 55 55 55 Q45 55 45 45 Z" fill="#38bdf8" opacity="0.8"/>
  <!-- Sparkle cross bottom-right -->
  <path d="M195 145 Q195 152 188 152 Q195 152 195 159 Q195 152 202 152 Q195 152 195 145 Z" fill="#10b981" opacity="0.8"/>

  <!-- Foreground accent element: Checklist clipboard leaning on the base -->
  <g transform="translate(110, 140) rotate(15)">
    <rect x="0" y="0" width="28" height="36" rx="4" fill="#f8fafc"/>
    <rect x="6" y="-3" width="16" height="6" rx="2" fill="#64748b"/>
    <line x1="7" y1="10" x2="14" y2="10" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="17" y1="10" x2="22" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="7" y1="17" x2="14" y2="17" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="17" y1="17" x2="22" y2="17" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="7" y1="24" x2="14" y2="24" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="17" y1="24" x2="22" y2="24" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dynamic checkmark floating gracefully (symbolizing correct/reasonable choice) -->
  <path d="M95 130 L103 138 L118 120" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>