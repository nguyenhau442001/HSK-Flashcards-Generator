<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Subtle glow/shadow for context -->
  <ellipse cx="100" cy="155" rx="55" ry="8" fill="#0f172a" opacity="0.6"/>

  <!-- Person/Belly Illustration Group -->
  <g transform="translate(0, 10)">
    
    <!-- Head/Neck area (simplified, cut off at top) -->
    <path d="M 85 45 C 85 38 92 35 100 35 C 108 35 115 38 115 45 L 115 55 L 85 55 Z" fill="#cbd5e1" opacity="0.3"/>
    
    <!-- Outfit / Shirt (Dark navy/slate contrast with bright belly focus) -->
    <path d="M 65 55 C 65 55 80 50 100 50 C 120 50 135 55 135 55 L 142 95 C 142 95 125 100 100 100 C 75 100 58 95 58 95 Z" fill="#334155"/>
    
    <!-- Lower Body / Pants -->
    <path d="M 60 125 C 60 125 75 120 100 120 C 125 120 140 125 140 125 L 138 145 C 138 145 120 148 100 148 C 80 148 62 145 62 145 Z" fill="#0f172a"/>

    <!-- THE BELLY (Concrete focal point: rounded, warm tone, highlighted) -->
    <g>
      <!-- Belly shape protruding forward -->
      <path d="M 60 95 C 50 110 65 128 100 128 C 135 128 150 110 140 95 C 120 110 80 110 60 95 Z" fill="#fb923c"/>
      <!-- Belly soft highlight for 2D depth -->
      <ellipse cx="100" cy="111" rx="22" ry="10" fill="#fed7aa" opacity="0.4"/>
      <!-- Navel -->
      <circle cx="100" cy="113" r="3" fill="#ea580c" opacity="0.6"/>
    </g>

    <!-- Hands gently holding the belly (indicating mild discomfort/pain context) -->
    <!-- Left Hand -->
    <path d="M 68 100 C 65 105 72 115 82 112 C 88 110 89 105 84 101 Z" fill="#cbd5e1"/>
    <!-- Right Hand -->
    <path d="M 132 100 C 135 105 128 115 118 112 C 112 110 111 105 116 101 Z" fill="#cbd5e1"/>

    <!-- Pain/Discomfort Indicator: Subtle pulsing/wavy lines near the belly -->
    <g stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9">
      <!-- Left spark/pain wave -->
      <path d="M 52 98 Q 47 95 52 92" />
      <!-- Right spark/pain wave -->
      <path d="M 148 98 Q 153 95 148 92" />
      <!-- Top spark -->
      <path d="M 97 84 Q 100 79 103 84" />
    </g>

    <!-- Subtle glow behind pain area for high contrast & modern UI feel -->
    <circle cx="100" cy="110" r="35" fill="#f43f5e" opacity="0.1" filter="blur(4px)"/>

  </g>
</svg>