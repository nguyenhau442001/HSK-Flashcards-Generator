<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="30" y="175" width="10" height="50" fill="#475569"/>
  <rect x="200" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Laptop -->
  <path d="M70 160 L170 160 L185 120 L55 120 Z" fill="#64748b"/>
  <path d="M75 125 L165 125 L165 155 L75 155 Z" fill="#0f172a"/>
  
  <!-- Screen Content (The "Deletion" action) -->
  <circle cx="120" cy="140" r="12" fill="#ef4444"/>
  <path d="M114 140 L126 140 M120 134 L120 146" stroke="#ffffff" stroke-width="3" stroke-linecap="round" transform="rotate(45 120 140)"/>
  
  <!-- Character -->
  <g transform="translate(100, 80)">
    <circle cx="20" cy="20" r="15" fill="#fcd34d"/>
    <path d="M10 20 Q15 10 20 10 Q25 10 30 20" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="15" cy="18" r="2" fill="#0f172a"/>
    <circle cx="25" cy="18" r="2" fill="#0f172a"/>
    <path d="M12 28 Q20 32 28 28" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Shocked Hands -->
  <circle cx="90" cy="120" r="8" fill="#fcd34d"/>
  <circle cx="150" cy="120" r="8" fill="#fcd34d"/>
  
  <!-- Floating Document Icon (The "Deleted" file) -->
  <g transform="translate(180, 80) rotate(15)">
    <rect width="30" height="40" rx="2" fill="#94a3b8"/>
    <rect x="5" y="10" width="20" height="3" fill="#334155"/>
    <rect x="5" y="20" width="20" height="3" fill="#334155"/>
    <rect x="5" y="30" width="10" height="3" fill="#334155"/>
    <path d="M0 0 L30 40" stroke="#ef4444" stroke-width="4"/>
  </g>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="140" r="40" fill="#fb923c" opacity="0.1"/>
</svg>