<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Shopping Basket -->
  <path d="M60 190 L180 190 L170 120 L70 120 Z" fill="#334155"/>
  <path d="M70 120 C70 100 170 100 170 120" stroke="#94a3b8" stroke-width="6" fill="none"/>
  
  <!-- Items inside -->
  <circle cx="90" cy="160" r="15" fill="#f59e0b"/>
  <rect x="115" y="145" width="20" height="30" rx="4" fill="#10b981"/>
  <path d="M150 175 L165 140 L180 175 Z" fill="#ec4899"/>
  
  <!-- Floating Total Indicator (Visual representation of sum) -->
  <g transform="translate(120, 80)">
    <circle cx="0" cy="0" r="35" fill="#fbbf24" opacity="0.2"/>
    <circle cx="0" cy="0" r="25" fill="#fbbf24" opacity="0.4"/>
    <circle cx="0" cy="0" r="15" fill="#fbbf24"/>
    <path d="M-5 -5 L0 5 L5 -5" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="50" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="70" r="6" fill="#fb923c" opacity="0.6"/>
  <path d="M190 190 L210 170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
</svg>