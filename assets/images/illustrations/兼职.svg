<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1e293b"/>

  <!-- Wall -->
  <rect x="0" y="0" width="240" height="160" fill="#2d3b50"/>
  <!-- Floor -->
  <rect x="0" y="160" width="240" height="80" fill="#253245"/>

  <!-- Desk -->
  <rect x="40" y="130" width="160" height="15" fill="#4a5568"/>
  <rect x="45" y="145" width="10" height="60" fill="#4a5568"/>
  <rect x="185" y="145" width="10" height="60" fill="#4a5568"/>

  <!-- Chair -->
  <path d="M110 160 C100 150 90 150 80 160 L80 180 C90 190 100 190 110 180 Z" fill="#3b465a"/>
  <rect x="85" y="180" width="20" height="20" fill="#3b465a"/>
  <rect x="87" y="200" width="5" height="15" fill="#3b465a"/>
  <rect x="103" y="200" width="5" height="15" fill="#3b465a"/>
  
  <!-- Person (simplified) -->
  <circle cx="95" cy="105" r="15" fill="#fbbf24"/> <!-- Head -->
  <path d="M95 120 C110 120 115 140 110 155 L80 155 C75 140 80 120 95 120 Z" fill="#38bdf8"/> <!-- Body -->
  <path d="M85 130 Q80 135 85 140 L90 140 Q95 135 90 130 Z" fill="#fbbf24"/> <!-- Left Arm -->
  <path d="M105 130 Q110 135 105 140 L100 140 Q95 135 100 130 Z" fill="#fbbf24"/> <!-- Right Arm -->
  
  <!-- Laptop -->
  <rect x="115" y="115" width="60" height="40" rx="4" fill="#4a5568"/> <!-- Screen base -->
  <rect x="110" y="150" width="70" height="5" rx="2" fill="#4a5568"/> <!-- Keyboard base -->
  
  <!-- Laptop Screen Glow -->
  <rect x="120" y="120" width="50" height="30" rx="2" fill="#38bdf8"/>
  
  <!-- Delivery Bag -->
  <path d="M190 180 L170 180 L165 210 L195 210 L190 180 Z" fill="#fb923c"/>
  <path d="M190 180 Q180 170 170 180" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="175" y="185" width="10" height="5" fill="#f59e0b" rx="2"/>
  
</svg>