<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Background Environment / Window & Blinds -->
  <g opacity="0.4">
    <!-- Window Frame -->
    <rect x="150" y="30" width="60" height="90" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2" />
    <!-- Night City Skyline Outside -->
    <rect x="156" y="70" width="12" height="50" fill="#1e293b" />
    <rect x="172" y="50" width="16" height="70" fill="#1e293b" />
    <rect x="192" y="80" width="10" height="40" fill="#1e293b" />
    <!-- Window City Lights -->
    <circle cx="162" cy="78" r="1" fill="#fbbf24" />
    <circle cx="162" cy="92" r="1" fill="#fbbf24" />
    <circle cx="178" cy="60" r="1" fill="#38bdf8" />
    <circle cx="184" cy="75" r="1" fill="#fbbf24" />
    <!-- Vertical Blinds -->
    <line x1="165" y1="30" x2="165" y2="120" stroke="#334155" stroke-width="2" />
    <line x1="180" y1="30" x2="180" y2="120" stroke="#334155" stroke-width="2" />
    <line x1="195" y1="30" x2="195" y2="120" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Bookshelf & Props in Background -->
  <g fill="#334155" opacity="0.6">
    <rect x="25" y="45" width="40" height="6" rx="2" />
    <rect x="30" y="25" width="30" height="20" rx="2" />
    <rect x="28" y="55" width="8" height="25" rx="1" fill="#10b981" />
    <rect x="38" y="53" width="10" height="27" rx="1" fill="#f43f5e" />
    <rect x="50" y="58" width="7" height="22" rx="1" fill="#38bdf8" />
  </g>

  <!-- Desk Lamp -->
  <g>
    <!-- Lamp Glow Area -->
    <ellipse cx="185" cy="115" rx="35" ry="25" fill="url(#lampGlow)" />
    <!-- Lamp Stand & Arm -->
    <path d="M195 185 L185 185 L185 130 L205 110" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp Shade -->
    <path d="M195 102 L215 118 L195 122 Z" fill="#f59e0b" filter="url(#shadow)" />
  </g>

  <!-- Office Desk Surface -->
  <rect x="15" y="180" width="210" height="45" rx="4" fill="url(#deskGrad)" />
  <rect x="15" y="175" width="210" height="8" rx="2" fill="#475569" />

  <!-- Desk Items -->
  <!-- Laptop with Screen Glow -->
  <g transform="translate(130, 135)">
    <!-- Laptop Base -->
    <path d="M-25 45 L45 45 L35 32 L-15 32 Z" fill="#64748b" />
    <rect x="-17" y="32" width="54" height="2" fill="#94a3b8" rx="1" />
    <!-- Laptop Screen -->
    <path d="M-15 32 L35 32 L25 -10 L-5 -10 Z" fill="#334155" />
    <path d="M-12 28 L32 28 L23 -6 L-3 -6 Z" fill="url(#screenGlow)" />
    <!-- Code/Chart Lines on Screen -->
    <line x1="-2" y1="2" x2="10" y2="2" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <line x1="-2" y1="8" x2="18" y2="8" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <line x1="-2" y1="14" x2="8" y2="14" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <polyline points="-2,22 4,18 10,20 20,16" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Coffee Mug & Stack of Papers -->
  <g transform="translate(45, 155)">
    <!-- Papers -->
    <rect x="-10" y="15" width="30" height="12" rx="1" fill="#cbd5e1" transform="rotate(-6)" />
    <rect x="-5" y="12" width="28" height="14" rx="1" fill="#f1f5f9" transform="rotate(3)" />
    <!-- Mug -->
    <rect x="25" y="8" width="16" height="19" rx="3" fill="#ec4899" />
    <path d="M41 12 C45 12 45 20 41 22" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam / Fatigue lines -->
    <path d="M30 2 C28 -2 32 -4 30 -8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Main Character: Exhausted Office Worker -->
  <g transform="translate(95, 80)">
    <!-- Office Chair Backrest -->
    <rect x="-25" y="-10" width="38" height="95" rx="8" fill="#334155" />
    <rect x="-21" y="-5" width="30" height="85" rx="6" fill="#1e293b" />
    <path d="M-6 85 L-6 115" stroke="#475569" stroke-width="6" />

    <!-- Character Body (Slumped forward over desk) -->
    <!-- Torso (Blue button-up shirt) -->
    <path d="M-20 45 C-20 20 10 20 25 45 L30 85 L-15 85 Z" fill="#3b82f6" filter="url(#shadow)" />
    <!-- Collar & Tie -->
    <path d="M-2 30 L6 30 L2 42 Z" fill="#ffffff" />
    <polygon points="1,38 5,38 3,55" fill="#f43f5e" />

    <!-- Arms resting on desk / head in hands -->
    <!-- Left Arm -->
    <path d="M-15 45 C-30 55 -40 70 -50 85" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M20 45 C35 55 45 70 55 85" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />

    <!-- Head & Hair (Slumped down, face resting on hands/desk) -->
    <g transform="translate(0, 15)">
      <!-- Hair (Dark/Black) -->
      <path d="M-15 -5 C-15 -20 15 -20 15 -5 C18 -2 18 10 12 12 C5 15 -5 15 -12 12 C-18 10 -18 -2 -15 -5 Z" fill="#0f172a" />
      <!-- Face Base -->
      <circle cx="0" cy="5" r="14" fill="#fcd34d" />
      
      <!-- Closed/Tired Eyes (Arched exhausted lines) -->
      <path d="M-6 3 C-4 1 -2 1 0 3" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      <path d="M2 3 C4 1 6 1 8 3" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

      <!-- Rosy / Pale Tired Cheeks -->
      <circle cx="-7" cy="8" r="3" fill="#f87171" opacity="0.4" />
      <circle cx="7" cy="8" r="3" fill="#f87171" opacity="0.4" />

      <!-- Hands supporting head -->
      <circle cx="-10" cy="12" r="6" fill="#fcd34d" />
      <circle cx="10" cy="12" r="6" fill="#fcd34d" />
    </g>

    <!-- Floating Exhaustion / Sleep Zzz & Sweat Drop elements -->
    <g transform="translate(25, -20)">
      <path d="M0 0 L10 0 L0 12 L10 12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    </g>
    <g transform="translate(38, -38)">
      <path d="M0 0 L6 0 L0 8 L6 8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
    </g>
    <!-- Sweat Drop near head -->
    <path d="M18 -5 C18 -5 22 2 22 6 C22 8.2 20.2 10 18 10 C15.8 10 14 8.2 14 6 C14 2 18 -5 18 -5 Z" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>