<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Blueprint Glow Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <linearGradient id="goldenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.0" />
    </linearGradient>

    <!-- Wood Texture / Workbench -->
    <linearGradient id="benchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Metal Arm / Clamp Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Gear 1 (Theory / Blue) -->
    <linearGradient id="gearBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gear 2 (Practice / Amber) -->
    <linearGradient id="gearAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glowing Fusion Energy -->
    <radialGradient id="fusionCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1" />
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment: Architectural drafting lines & Workshop details -->
  <g opacity="0.4">
    <!-- Grid lines -->
    <path d="M 0,60 H 240 M 0,120 H 240 M 0,180 H 240 M 60,0 V 240 M 120,0 V 240 M 180,0 V 240" stroke="#334155" stroke-width="0.75" stroke-dasharray="3 3"/>
    
    <!-- Blueprint circles -->
    <circle cx="120" cy="110" r="80" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
    <circle cx="120" cy="110" r="50" fill="url(#blueGlow)" />
  </g>

  <!-- Workbench Surface at Bottom -->
  <path d="M 0,195 L 240,195 L 240,240 L 0,240 Z" fill="url(#benchGrad)" />
  <rect x="0" y="193" width="240" height="3" fill="#475569" />

  <!-- Workshop Props: Blueprint paper & Drafting tools -->
  <g transform="translate(0, 5)">
    <!-- Rolled blueprint scroll on desk -->
    <path d="M 25,193 C 25,188 35,185 45,188 C 55,191 60,193 70,193 L 25,193 Z" fill="#94a3b8" />
    <circle cx="25" cy="190.5" r="2.5" fill="#cbd5e1" />

    <!-- Wrench leaning on the right -->
    <path d="M 210,193 L 220,165 C 221,163 219,161 217,162 L 207,190 Z" fill="url(#metalGrad)" />
    <circle cx="219" cy="164" r="3" fill="#94a3b8" />
  </g>

  <!-- MAIN ILLUSTRATION: THE INTERLOCKING "KẾT HỢP" (THEORY + PRACTICE) -->
  <!-- Ambient fusion glow behind the mechanism -->
  <circle cx="120" cy="110" r="45" fill="url(#fusionCore)" />

  <!-- Connecting Mechanical Arms (Structure) -->
  <g filter="url(#shadow)">
    <!-- Left Arm (Theory Anchor) -->
    <path d="M 50,110 L 85,110" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="50" cy="110" r="6" fill="#475569" />

    <!-- Right Arm (Practice Anchor) -->
    <path d="M 155,110 L 190,110" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="190" cy="110" r="6" fill="#475569" />

    <!-- Top support bracket -->
    <path d="M 120,45 L 120,75" stroke="url(#metalGrad)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Left Element: THE BLUEPRINT / THEORY (Blue Gear & Compass/Nodes) -->
  <g transform="translate(85, 110)" filter="url(#shadow)">
    <!-- Gear Body -->
    <circle cx="0" cy="0" r="28" fill="url(#gearBlue)" />
    <path d="M -8,-32 L 8,-32 L 6,-28 L -6,-28 Z M -8,32 L 8,32 L 6,28 L -6,28 Z M -32,-8 L -32,8 L -28,6 L -28,-6 Z M 32,-8 L 32,8 L 28,6 L 28,-6 Z M -22,-22 L -10,-28 L -8,-24 L -19,-19 Z M 22,22 L 10,28 L 8,24 L 19,19 Z M -22,22 L -19,19 L -8,24 L -10,28 Z M 22,-22 L 19,-19 L 8,-24 L 10,-28 Z" fill="#0284c7" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" />
    <!-- Center Icon: Floating drafting square/nodes -->
    <path d="M -5,4 L 5,-4 M -5,-4 L 5,4" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
  </g>

  <!-- Right Element: THE TANGIBLE REALITY / PRACTICE (Amber Gear & Hammer/Spark) -->
  <g transform="translate(155, 110)" filter="url(#shadow)">
    <!-- Gear Body -->
    <circle cx="0" cy="0" r="28" fill="url(#gearAmber)" />
    <path d="M -8,-32 L 8,-32 L 6,-28 L -6,-28 Z M -8,32 L 8,32 L 6,28 L -6,28 Z M -32,-8 L -32,8 L -28,6 L -28,-6 Z M 32,-8 L 32,8 L 28,6 L 28,-6 Z M -22,-22 L -10,-28 L -8,-24 L -19,-19 Z M 22,22 L 10,28 L 8,24 L 19,19 Z M -22,22 L -19,19 L -8,24 L -10,28 Z M 22,-22 L 19,-19 L 8,-24 L 10,-28 Z" fill="#b45309" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" />
    <!-- Center Icon: Spark/Action core -->
    <path d="M 0,-6 L 2,-2 L 6,0 L 2,2 L 0,6 L -2,2 L -6,0 L -2,-2 Z" fill="#fbbf24" />
  </g>

  <!-- INTERLOCKING ZONE (The Fusion Point in the center) -->
  <g transform="translate(120, 110)">
    <!-- Interlocking teeth highlight / energy pulse -->
    <circle cx="0" cy="0" r="10" fill="#34d399" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
    <!-- Action Sparkles / Success Indicators -->
    <path d="M 0,-25 L 3,-18 L 10,-15 L 3,-12 L 0,-5 L -3,-12 L -10,-15 L -3,-18 Z" fill="#34d399" transform="scale(0.6) translate(0, -45)" filter="url(#shadow)" />
    <path d="M 0,20 L 2,15 L 7,13 L 2,11 L 0,6 L -2,11 L -7,13 L -2,15 Z" fill="#fbbf24" transform="scale(0.5) translate(25, 10)" />
    <path d="M 0,20 L 2,15 L 7,13 L 2,11 L 0,6 L -2,11 L -7,13 L -2,15 Z" fill="#38bdf8" transform="scale(0.5) translate(-35, 15)" />
  </g>

  <!-- Dynamic Energy Arcs connecting Theory & Practice -->
  <path d="M 95,80 C 105,70 135,70 145,80" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M 95,140 C 105,150 135,150 145,140" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;16" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Foreground Atmospheric Particles / Glows -->
  <circle cx="70" cy="65" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="170" cy="155" r="2.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="120" cy="40" r="1.5" fill="#34d399" opacity="0.9" />
  <circle cx="45" cy="130" r="1" fill="#38bdf8" opacity="0.5" />
  <circle cx="195" cy="85" r="2" fill="#fb923c" opacity="0.7" />
</svg>