<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Amber Glow for Sunset Park Vibe -->
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Foliage Gradient -->
    <linearGradient id="treeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <linearGradient id="treeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Path Gradient -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Full Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Background Layer: Distant Park Elements -->
  <!-- Distant Hills / Greenery -->
  <path d="M0 140 Q 60 120, 140 135 T 240 125 L 240 180 L 0 180 Z" fill="#064e3b" opacity="0.6" />
  
  <!-- Distant Trees -->
  <circle cx="40" cy="125" r="22" fill="#065f46" opacity="0.8" />
  <circle cx="70" cy="118" r="28" fill="#047857" opacity="0.8" />
  <circle cx="200" cy="115" r="30" fill="#065f46" opacity="0.8" />
  <circle cx="225" cy="120" r="20" fill="#047857" opacity="0.8" />

  <!-- Park Lamppost -->
  <rect x="185" y="85" width="4" height="75" fill="#64748b" />
  <path d="M 187 85 C 180 80, 180 70, 187 65 C 194 70, 194 80, 187 85 Z" fill="#fbbf24" />
  <circle cx="187" cy="75" r="6" fill="#fef08a" />
  <!-- Lamppost Light Glow -->
  <circle cx="187" cy="75" r="22" fill="#fbbf24" opacity="0.15" />

  <!-- Winding Park Path (散步步道) -->
  <path d="M 0 190 Q 90 170, 130 195 T 240 185 L 240 240 L 0 240 Z" fill="url(#pathGrad)" />
  <!-- Path Stone Details -->
  <ellipse cx="60" cy="195" rx="8" ry="3" fill="#64748b" opacity="0.4" />
  <ellipse cx="110" cy="210" rx="12" ry="4" fill="#64748b" opacity="0.4" />
  <ellipse cx="180" cy="205" rx="10" ry="3.5" fill="#64748b" opacity="0.4" />

  <!-- Mid-ground Trees (Foreground Framing) -->
  <!-- Left Tree -->
  <rect x="15" y="100" width="12" height="90" fill="#78350f" rx="4" />
  <path d="M 21 60 Q 45 60, 40 90 Q 45 120, 21 110 Q -5 120, 2 95 Q -5 70, 21 60 Z" fill="url(#treeGrad2)" />

  <!-- Right Lush Bush/Tree -->
  <circle cx="225" cy="170" r="35" fill="url(#treeGrad1)" />
  <circle cx="205" cy="180" r="25" fill="#047857" />

  <!-- Scenic Park Bench -->
  <g transform="translate(115, 150)">
    <!-- Bench Legs -->
    <rect x="8" y="15" width="3" height="12" fill="#334155" />
    <rect x="34" y="15" width="3" height="12" fill="#334155" />
    <!-- Bench Seat & Backrest -->
    <rect x="4" y="12" width="37" height="4" rx="2" fill="#b45309" />
    <rect x="4" y="4" width="37" height="6" rx="2" fill="#d97706" />
    <rect x="7" y="2" width="3" height="12" fill="#92400e" />
    <rect x="35" y="2" width="3" height="12" fill="#92400e" />
  </g>

  <!-- Main Characters Strolling (散步) -->
  <!-- Character 1 (Left - Person A, e.g., wearing teal jacket & orange pants) -->
  <g transform="translate(75, 155)">
    <!-- Motion Shadow -->
    <ellipse cx="12" cy="30" rx="10" ry="3" fill="#000000" opacity="0.3" />
    <!-- Legs in walking stride -->
    <!-- Back Leg -->
    <line x1="8" y1="18" x2="2" y2="28" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <!-- Front Leg -->
    <line x1="14" y1="18" x2="20" y2="28" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <!-- Shoes -->
    <circle cx="1" cy="29" r="2.5" fill="#1e293b" />
    <circle cx="21" cy="29" r="2.5" fill="#1e293b" />

    <!-- Torso (Teal Jacket) -->
    <path d="M 6 8 L 18 8 L 20 20 L 4 20 Z" fill="#0ea5e9" rx="2" />
    
    <!-- Arms in motion -->
    <line x1="16" y1="10" x2="23" y2="18" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round" />
    <line x1="8" y1="10" x2="2" y2="16" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Head & Hair -->
    <circle cx="12" cy="2" r="6" fill="#fde047" />
    <path d="M 6 0 Q 12 -5, 18 0 Q 16 3, 12 3 Z" fill="#b45309" />
  </g>

  <!-- Character 2 (Right - Person B, e.g., wearing warm coral sweater & jeans, holding hands or walking closely) -->
  <g transform="translate(100, 152)">
    <!-- Motion Shadow -->
    <ellipse cx="12" cy="33" rx="10" ry="3" fill="#000000" opacity="0.3" />
    <!-- Legs in stride -->
    <line x1="10" y1="20" x2="5" y2="31" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" />
    <line x1="14" y1="20" x2="21" y2="30" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" />
    <!-- Shoes -->
    <circle cx="4" cy="32" r="2.5" fill="#334155" />
    <circle cx="22" cy="31" r="2.5" fill="#334155" />

    <!-- Torso (Coral Sweater) -->
    <path d="M 6 8 L 18 8 L 19 21 L 5 21 Z" fill="#f43f5e" rx="2" />
    
    <!-- Arms swaying -->
    <line x1="8" y1="10" x2="3" y2="17" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />
    <line x1="16" y1="10" x2="22" y2="18" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Head & Hair (Ponytail) -->
    <circle cx="12" cy="1" r="5.5" fill="#fde047" />
    <path d="M 6 -1 Q 12 -5, 17 -1 Q 19 -4, 21 -3 Q 18 2, 12 2 Z" fill="#451a03" />
  </g>

  <!-- Cute Park Details (Foreground/Environment) -->
  <!-- Floating leaves / Nature touch -->
  <path d="M 50 70 Q 55 65, 60 72 Q 55 75, 50 70 Z" fill="#34d399" opacity="0.7" transform="rotate(25 55 70)" />
  <path d="M 160 50 Q 164 46, 168 52 Q 164 55, 160 50 Z" fill="#10b981" opacity="0.6" transform="rotate(-15 164 50)" />
  <path d="M 180 110 Q 183 106, 186 112 Q 183 114, 180 110 Z" fill="#34d399" opacity="0.8" transform="rotate(45 183 110)" />

  <!-- Little Park Flower Bed -->
  <ellipse cx="40" cy="180" rx="15" ry="6" fill="#047857" />
  <circle cx="35" cy="178" r="2.5" fill="#f43f5e" />
  <circle cx="43" cy="177" r="2.5" fill="#fbbf24" />
  <circle cx="48" cy="180" r="2.5" fill="#f43f5e" />

</svg>