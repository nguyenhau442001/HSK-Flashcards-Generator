<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <linearGradient id="room-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <!-- AC Cold Breeze Gradient -->
    <linearGradient id="breeze-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ROOM INTERIOR BACKGROUND -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4"/>
  <!-- Ambient Room Light -->
  <rect x="20" y="20" width="200" height="150" fill="url(#room-glow)" rx="4"/>

  <!-- Window with Night Cityscape View -->
  <g transform="translate(145, 35)">
    <rect width="55" height="75" rx="6" fill="url(#window-grad)" stroke="#334155" stroke-width="2"/>
    <!-- City Buildings outside -->
    <rect x="8" y="30" width="12" height="45" fill="#1e1b4b"/>
    <rect x="24" y="20" width="16" height="55" fill="#17153b"/>
    <rect x="43" y="40" width="9" height="35" fill="#1e1b4b"/>
    <!-- Window pane crossbars -->
    <line x1="27" y1="0" x2="27" y2="75" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="37" x2="55" y2="37" stroke="#334155" stroke-width="2"/>
    <!-- Warm city lights -->
    <circle cx="14" cy="40" r="1" fill="#fbbf24"/>
    <circle cx="30" cy="30" r="1" fill="#fbbf24"/>
    <circle cx="34" cy="50" r="1" fill="#fbbf24"/>
  </g>

  <!-- Wall Poster / Art Frame -->
  <rect x="40" y="45" width="35" height="50" rx="3" fill="#334155" />
  <rect x="44" y="49" width="27" height="42" fill="#0f172a" />
  <circle cx="58" cy="65" r="8" fill="#f43f5e" opacity="0.8"/>
  <path d="M48 85 L58 70 L68 85 Z" fill="#10b981" opacity="0.8"/>

  <!-- THE MAIN SUBJECT: AIR CONDITIONER (空调) -->
  <g id="air-conditioner" filter="url(#shadow)" transform="translate(75, 28)">
    <!-- AC Main Body -->
    <rect x="0" y="0" width="90" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- AC Inner Panel Seam -->
    <rect x="4" y="4" width="82" height="20" rx="4" fill="#f1f5f9"/>
    <!-- Air Vent Grille -->
    <rect x="15" y="20" width="60" height="5" rx="2" fill="#cbd5e1"/>
    <line x1="25" y1="20" x2="25" y2="25" stroke="#94a3b8" stroke-width="1"/>
    <line x1="35" y1="20" x2="35" y2="25" stroke="#94a3b8" stroke-width="1"/>
    <line x1="45" y1="20" x2="45" y2="25" stroke="#94a3b8" stroke-width="1"/>
    <line x1="55" y1="20" x2="55" y2="25" stroke="#94a3b8" stroke-width="1"/>
    <line x1="65" y1="20" x2="65" y2="25" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- LED Indicator Light (Running State - Cool Cyan) -->
    <circle cx="78" cy="10" r="2" fill="#06b6d4" />
    <circle cx="78" cy="10" r="3.5" fill="#06b6d4" opacity="0.4" />
    
    <!-- Digital Temperature Display on AC -->
    <text x="14" y="14" font-family="sans-serif" font-weight="bold" font-size="9" fill="#0f172a">22°</text>
  </g>

  <!-- Cool Air Breeze Flow Effect (Visualizing the AC working) -->
  <path d="M 85 58 Q 75 75 65 95" stroke="url(#breeze-grad)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 115 58 Q 105 75 95 95" stroke="url(#breeze-grad)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 145 58 Q 135 75 125 95" stroke="url(#breeze-grad)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Floating snowflake icons indicating cool air -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M 60 105 L 68 113 M 68 105 L 60 113 M 64 101 L 64 117 M 56 109 L 72 109" transform="scale(0.6) translate(60, 90)"/>
    <path d="M 60 105 L 68 113 M 68 105 L 60 113 M 64 101 L 64 117 M 56 109 L 72 109" transform="scale(0.4) translate(180, 180)" stroke="#93c5fd"/>
  </g>

  <!-- FLOOR -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <!-- Wooden Floor Planks Line -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="3"/>
  <!-- Floor Perspective Lines -->
  <line x1="0" y1="200" x2="240" y2="200" stroke="#172033" stroke-width="1"/>

  <!-- INTERIOR FURNITURE & PROPS -->
  <!-- Plant Pot & Monstera Plant (Adds life to the room) -->
  <g transform="translate(30, 130)">
    <!-- Pot -->
    <path d="M 10 25 L 18 45 L 32 45 L 40 25 Z" fill="#cbd5e1" />
    <ellipse cx="25" cy="25" rx="15" ry="4" fill="#94a3b8" />
    <!-- Leaves -->
    <path d="M 25 21 C 25 10, 10 5, 5 0 C 12 5, 20 8, 25 21 Z" fill="#10b981" />
    <path d="M 25 21 C 30 5, 45 2, 50 -3 C 44 5, 35 10, 25 21 Z" fill="#059669" />
    <path d="M 25 21 C 25 -2, 28 -10, 35 -15 C 28 -5, 26 5, 25 21 Z" fill="#34d399" />
  </g>

  <!-- CHARACTER: Relaxing comfortably in the air-conditioned room -->
  <g id="character" transform="translate(90, 115)">
    <!-- Shadow under sofa/chair -->
    <ellipse cx="40" cy="58" rx="35" ry="6" fill="#000000" opacity="0.4"/>

    <!-- Cozy Armchair -->
    <path d="M 10 30 Q 10 10 30 10 L 50 10 Q 70 10 70 30 L 75 55 Q 75 60 70 60 L 10 60 Q 5 60 5 55 Z" fill="#475569" filter="url(#shadow)"/>
    <path d="M 15 25 Q 15 15 30 15 L 50 15 Q 65 15 65 25 L 68 50 L 12 50 Z" fill="#64748b"/>
    <!-- Armchair Cushion -->
    <rect x="15" y="35" width="50" height="20" rx="6" fill="#cbd5e1"/>

    <!-- Character Body (Sitting Relaxed) -->
    <!-- Legs in comfy home pants -->
    <path d="M 25 45 L 15 57 L 35 58 L 40 48 Z" fill="#3b82f6"/>
    <path d="M 45 45 L 55 57 L 38 58 L 40 48 Z" fill="#3b82f6"/>
    <!-- Slippers -->
    <ellipse cx="12" cy="58" rx="6" ry="3" fill="#f43f5e"/>
    <ellipse cx="58" cy="58" rx="6" ry="3" fill="#f43f5e"/>

    <!-- Torso in casual t-shirt -->
    <path d="M 22 20 Q 40 18 58 20 L 62 48 Q 40 52 18 48 Z" fill="#ec4899"/>
    
    <!-- Head & Hair -->
    <circle cx="40" cy="8" r="13" fill="#fbcfe8"/>
    <!-- Hair styling -->
    <path d="M 27 8 Q 30 -3 42 -4 Q 53 -3 53 8 Q 50 4 40 3 Q 30 4 27 8 Z" fill="#451a03"/>

    <!-- Relaxed Happy Facial Expression -->
    <!-- Eyes closed happily (arcs) -->
    <path d="M 34 8 Q 37 11 40 8" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 44 8 Q 47 11 50 8" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 40 12 Q 42 15 44 12" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Blushing cheeks -->
    <circle cx="33" cy="11" r="2.5" fill="#f43f5e" opacity="0.4"/>
    <circle cx="51" cy="11" r="2.5" fill="#f43f5e" opacity="0.4"/>

    <!-- Arms resting happily -->
    <path d="M 23 25 Q 15 35 22 42" stroke="#ec4899" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="22" cy="43" r="3.5" fill="#fbcfe8"/>

    <!-- Holding a cup of warm drink (or smartphone) -->
    <rect x="52" y="32" width="10" height="12" rx="2" fill="#fbbf24"/>
    <path d="M 57 28 L 57 32" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Side Table with Lamp -->
  <g transform="translate(180, 130)">
    <!-- Table Leg & Top -->
    <rect x="0" y="20" width="30" height="4" rx="1" fill="#475569"/>
    <rect x="12" y="24" width="6" height="36" fill="#334155"/>
    <!-- Lamp -->
    <path d="M 7 10 L 17 10 L 22 20 L 2 20 Z" fill="#fbbf24"/>
    <line x1="12" y1="20" x2="12" y2="24" fill="#334155"/>
  </g>

</svg>