<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="building" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Night sky / Exterior backdrop -->
  <rect x="20" y="20" width="200" height="120" rx="16" fill="url(#sky)"/>
  
  <!-- Distant city buildings silhouette -->
  <rect x="30" y="50" width="30" height="90" fill="#1e293b" opacity="0.6"/>
  <rect x="70" y="40" width="40" height="100" fill="#1e293b" opacity="0.5"/>
  <rect x="180" y="60" width="30" height="80" fill="#1e293b" opacity="0.6"/>

  <!-- Main apartment building facade showing floors -->
  <!-- Building Body -->
  <rect x="80" y="30" width="80" height="180" rx="4" fill="url(#building)"/>
  
  <!-- Floors (1 to 5) -->
  <!-- Floor 1 -->
  <rect x="90" y="180" width="60" height="25" rx="2" fill="#0f172a"/>
  <!-- Floor 2 -->
  <rect x="90" y="145" width="60" height="25" rx="2" fill="#0f172a"/>
  <!-- Floor 3 -->
  <rect x="90" y="110" width="60" height="25" rx="2" fill="#0f172a"/>
  <!-- Floor 4 -->
  <rect x="90" y="75" width="60" height="25" rx="2" fill="#0f172a"/>
  <!-- Floor 5 (Target Floor) - Highlighted warmly -->
  <rect x="90" y="40" width="60" height="25" rx="2" fill="#fbbf24" opacity="0.15"/>
  <rect x="90" y="40" width="60" height="25" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Floor windows and lights -->
  <!-- Fl 1 lights -->
  <rect x="98" y="188" width="16" height="12" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="126" y="188" width="16" height="12" rx="1" fill="#38bdf8" opacity="0.4"/>
  <!-- Fl 2 lights -->
  <rect x="98" y="153" width="16" height="12" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="126" y="153" width="16" height="12" rx="1" fill="#fbbf24" opacity="0.5"/>
  <!-- Fl 3 lights -->
  <rect x="98" y="118" width="16" height="12" rx="1" fill="#fbbf24" opacity="0.5"/>
  <rect x="126" y="118" width="16" height="12" rx="1" fill="#fbbf24" opacity="0.5"/>
  <!-- Fl 4 lights -->
  <rect x="98" y="83" width="16" height="12" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="126" y="83" width="16" height="12" rx="1" fill="#38bdf8" opacity="0.4"/>

  <!-- Fl 5 (The 5th Floor / 五楼) Warm Interior Room -->
  <rect x="94" y="44" width="52" height="17" rx="1" fill="#fef08a" opacity="0.9"/>
  <!-- Window frames for 5th floor -->
  <line x1="120" y1="44" x2="120" y2="61" stroke="#334155" stroke-width="1.5"/>

  <!-- Balcony on the 5th floor with character -->
  <path d="M 86 55 L 154 55 L 150 67 L 90 67 Z" fill="#64748b"/>
  <line x1="90" y1="59" x2="150" y2="59" stroke="#94a3b8" stroke-width="1"/>

  <!-- Character on the 5th floor balcony ("I live on the 5th floor") -->
  <!-- Body / Outfit -->
  <circle cx="120" cy="42" r="7" fill="#fbcfe8"/> <!-- Head -->
  <path d="M 115 48 C 115 45 125 45 125 48 L 128 60 L 112 60 Z" fill="#ec4899"/> <!-- Shirt -->
  <!-- Arms waving happily -->
  <path d="M 115 50 L 107 44" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 125 50 L 133 44" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>

  <!-- Potted plant on 5th floor balcony for cozy context -->
  <ellipse cx="140" cy="62" rx="5" ry="3" fill="#334155"/>
  <path d="M 138 62 Q 140 54 142 62 Z" fill="#10b981"/>

  <!-- Floating indicator badge pointing to the 5th floor (Visual cue without text) -->
  <g transform="translate(162, 42)">
    <path d="M 0 6 L 6 0 L 6 4 L 18 4 L 18 8 L 6 8 L 6 12 Z" fill="#fbbf24" transform="rotate(180 9 6)" />
    <!-- Mini floor indicator block -->
    <rect x="18" y="-2" width="18" height="16" rx="4" fill="#fbbf24"/>
    <text x="27" y="10" font-family="sans-serif" font-weight="bold" font-size="10" fill="#0f172a" text-anchor="middle">5</text>
  </g>

  <!-- Foreground Interior cutaway at bottom for grounding -->
  <path d="M 0 200 L 240 200 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="3"/>

  <!-- Interior props: Houseplants, warm lamp, homy atmosphere -->
  <circle cx="40" cy="200" r="14" fill="#10b981" opacity="0.2"/>
  <!-- Lamp stand -->
  <path d="M 210 200 L 210 160" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 200 160 L 220 160 L 215 150 L 205 150 Z" fill="#f59e0b"/>
  <circle cx="210" cy="165" r="12" fill="#fbbf24" opacity="0.3"/>

  <!-- Decorative warm ambient lighting dots -->
  <circle cx="60" cy="70" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="170" cy="90" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="50" cy="130" r="1" fill="#38bdf8" opacity="0.5"/>
</svg>