<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Workbench -->
  <rect x="30" y="150" width="180" height="15" rx="2" fill="#334155"/>
  <rect x="40" y="165" width="10" height="60" fill="#475569"/>
  <rect x="190" y="165" width="10" height="60" fill="#475569"/>

  <!-- The New Product (Robot Prototype) -->
  <circle cx="100" cy="130" r="25" fill="#38bdf8"/>
  <circle cx="90" cy="125" r="5" fill="#0f172a"/>
  <circle cx="110" cy="125" r="5" fill="#0f172a"/>
  <rect x="90" y="140" width="20" height="5" fill="#fb923c"/>

  <!-- Engineer Character -->
  <g transform="translate(150, 100)">
    <circle cx="20" cy="20" r="20" fill="#fde68a"/>
    <path d="M10 25 Q20 35 30 25" stroke="#92400e" stroke-width="2" fill="none"/>
    <rect x="0" y="40" width="40" height="60" rx="5" fill="#ec4899"/>
    <rect x="5" y="100" width="12" height="30" fill="#ec4899"/>
    <rect x="23" y="100" width="12" height="30" fill="#ec4899"/>
  </g>

  <!-- Testing Equipment (Oscilloscope/Monitor) -->
  <rect x="30" y="80" width="60" height="50" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M35 110 L50 90 L65 120 L80 100" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Ambient Details -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="180" cy="60" r="2" fill="#fbbf24"/>
  <path d="M40 50 L60 50 M50 40 L50 60" stroke="#475569" stroke-width="2"/>
</svg>