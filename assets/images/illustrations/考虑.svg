<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Thought Bubble Gradient -->
    <linearGradient id="thought-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Effect -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- ENVIRONMENT / PROPS (Background Layer) -->
  <!-- Bookshelf & Books -->
  <g opacity="0.4">
    <rect x="25" y="45" width="45" height="6" rx="2" fill="#64748b" />
    <path d="M30 45 L30 30 L38 30 L38 45 Z" fill="#f43f5e" />
    <path d="M40 45 L40 27 L48 27 L48 45 Z" fill="#10b981" />
    <path d="M50 45 L50 33 L58 33 L58 45 Z" fill="#fbbf24" />
  </g>

  <!-- Wall Art / Framed Blueprint (Sign of weighing options) -->
  <g transform="translate(170, 35)" opacity="0.4">
    <rect x="0" y="0" width="35" height="45" rx="3" fill="#334155" stroke="#475569" stroke-width="2"/>
    <path d="M8 12 L27 12 M8 22 L27 22 M8 32 L20 32" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Tiny balance scale icon in art -->
    <path d="M17.5 15 L17.5 28 M12 20 L23 20" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="10" cy="23" r="3" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="25" cy="23" r="3" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Window with Night City Silhouette -->
  <g transform="translate(15, 75)" opacity="0.3">
    <rect x="0" y="0" width="40" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="6" y="10" width="10" height="25" fill="#38bdf8" opacity="0.5"/>
    <rect x="22" y="20" width="12" height="40" fill="#fbbf24" opacity="0.3"/>
    <rect x="6" y="40" width="10" height="20" fill="#38bdf8" opacity="0.2"/>
  </g>

  <!-- Desk & Foreground Props -->
  <!-- Desk Surface -->
  <path d="M20 195 L220 195 L230 220 L10 220 Z" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="15" y="190" width="210" height="8" rx="2" fill="#475569" />

  <!-- Desk Lamp -->
  <path d="M190 190 L195 140 L205 140 L200 190 Z" fill="#334155" />
  <path d="M180 135 C180 120, 210 120, 210 135 Z" fill="#fbbf24" filter="url(#shadow)" />
  <ellipse cx="195" cy="135" rx="15" ry="4" fill="#f59e0b" />

  <!-- Coffee Mug (Comfort prop) -->
  <g transform="translate(160, 170)">
    <rect x="0" y="5" width="14" height="18" rx="3" fill="#f8fafc" />
    <path d="M14 9 C18 9, 18 19, 14 19" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M4 0 C4 -3, 7 -3, 7 -6" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <path d="M10 -2 C10 -5, 13 -5, 13 -8" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Open Document / Decision Paperwork -->
  <g transform="translate(60, 180) rotate(-5)">
    <polygon points="0,5 35,0 40,25 5,30" fill="#f1f5f9" filter="url(#shadow)"/>
    <path d="M8 8 L25 6 M8 13 L28 11 M8 18 L20 17" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Checkmarks / Question marks hinting at choices -->
    <circle cx="30" cy="18" r="3" fill="#f43f5e" opacity="0.8"/>
    <circle cx="30" cy="8" r="3" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- THOUGHT BUBBLE / THINKING PROCESS (Abstract representation of weighing options) -->
  <g opacity="0.85">
    <!-- Small bubbles -->
    <circle cx="100" cy="100" r="6" fill="url(#thought-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 1"/>
    <circle cx="90" cy="115" r="4" fill="url(#thought-grad)" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Main Thought Cloud -->
    <path d="M 95 85 
             C 80 80, 70 95, 75 110 
             C 65 115, 65 130, 80 135 
             C 85 145, 100 145, 110 135 
             C 125 140, 135 125, 130 110 
             C 140 100, 130 85, 115 90 
             C 105 80, 95 85, 95 85 Z" 
          fill="url(#thought-grad)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" filter="url(#shadow)" />

    <!-- Icons inside thought bubble representing "evaluating options" -->
    <!-- Scale icon inside thought -->
    <path d="M102 100 L118 100 M110 100 L110 120 M100 115 L120 115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M96 115 L100 122 L104 122 Z" fill="#fbbf24"/>
    <path d="M116 115 L120 122 L124 122 Z" fill="#38bdf8"/>
  </g>

  <!-- MAIN CHARACTER: Deep in thought / Xem xét, suy nghĩ -->
  <g id="character" transform="translate(10, 15)">
    <!-- Body / Torso leaning forward -->
    <path d="M95 120 C90 105, 110 95, 125 105 L140 160 C140 160, 90 170, 75 160 Z" fill="url(#shirt-grad)" filter="url(#shadow)" />

    <!-- Chair Back -->
    <path d="M60 70 L80 65 L85 175 L65 180 Z" fill="#475569" />
    <ellipse cx="72" cy="67" rx="10" ry="4" fill="#64748b" />

    <!-- Arms & Hands in Classic "Thinking" Pose (Chin resting on hand) -->
    <!-- Back Arm -->
    <path d="M100 110 L115 130 L100 150" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Front Arm & Hand supporting head -->
    <!-- Upper arm -->
    <path d="M125 110 L110 140" fill="none" stroke="url(#shirt-grad)" stroke-width="14" stroke-linecap="round" />
    <!-- Forearm leaning up to chin -->
    <path d="M110 140 L118 115" fill="none" stroke="url(#shirt-grad)" stroke-width="12" stroke-linecap="round" />

    <!-- Hand touching chin/cheek -->
    <circle cx="118" cy="112" r="8" fill="#fbcfe8" filter="url(#shadow)" />
    <!-- Fingers curled near mouth -->
    <path d="M112 110 C114 107, 120 108, 122 112" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M112 95 L118 105" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round" />

    <!-- Head & Hair (Thoughtful expression, angled slightly downward/forward) -->
    <g transform="translate(105, 80)">
      <!-- Head Base -->
      <circle cx="12" cy="0" r="22" fill="#fbcfe8" filter="url(#shadow)" />

      <!-- Hair Style (Modern stylized dark hair) -->
      <path d="M-9 -5 C-10 -20, 10 -25, 25 -18 C33 -15, 36 -2, 33 8 C30 15, 25 10, 22 5 C15 -5, 0 -2, -9 -5 Z" fill="#1e293b" />
      <path d="M-10 -2 C-12 10, -5 20, 2 22" fill="#1e293b" />

      <!-- Face Details -->
      <!-- Eyebrow furrowed in deep concentration/consideration -->
      <path d="M5 -3 C10 -6, 20 -2, 23 2" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

      <!-- Closed/Focused Eye (looking down/pondering) -->
      <path d="M8 4 C12 7, 18 6, 21 3" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

      <!-- Pensive/Thoughtful Mouth (slight frown/straight line, biting lip slightly) -->
      <path d="M14 16 C17 16, 20 15, 22 14" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" />

      <!-- Rosy Cheeks (Concentration flush) -->
      <circle cx="18" cy="10" r="4" fill="#f43f5e" opacity="0.3" />
    </g>
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles of realization -->
  <g opacity="0.8">
    <path d="M 140 70 L 143 75 L 148 78 L 143 81 L 140 86 L 137 81 L 132 78 L 137 75 Z" fill="#38bdf8" />
    <path d="M 60 110 L 62 113 L 65 115 L 62 117 L 60 120 L 58 117 L 55 115 L 58 113 Z" fill="#fbbf24" transform="scale(0.7) translate(30, 20)" />
    <circle cx="155" cy="130" r="2" fill="#38bdf8" />
    <circle cx="55" cy="85" r="1.5" fill="#fbbf24" />
  </g>
</svg>