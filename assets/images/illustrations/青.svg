<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Effects -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- BACKGROUND ARCHITECTURE & PROPS -->
  <!-- Wall/Floor Split -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" />
  
  <!-- Window Frame casting light -->
  <path d="M160 20 L210 20 L210 130 L160 130 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M165 25 L205 25 L205 125 L165 125 Z" fill="url(#window-light)" />
  <line x1="185" y1="25" x2="185" y2="125" stroke="#334155" stroke-width="2" />
  <line x1="165" y1="75" x2="205" y2="75" stroke="#334155" stroke-width="2" />

  <!-- Bookshelf & Books in Background -->
  <rect x="20" y="50" width="50" height="120" fill="#1e293b" rx="4" />
  <line x1="20" y1="90" x2="70" y2="90" stroke="#334155" stroke-width="3" />
  <line x1="20" y1="130" x2="70" y2="130" stroke="#334155" stroke-width="3" />
  <!-- Books -->
  <rect x="26" y="65" width="8" height="25" fill="#f43f5e" rx="1" />
  <rect x="36" y="60" width="10" height="30" fill="#38bdf8" rx="1" />
  <rect x="48" y="68" width="6" height="22" fill="#fbbf24" rx="1" />
  <rect x="26" y="105" width="12" height="25" fill="#10b981" rx="1" />
  <rect x="40" y="100" width="8" height="30" fill="#a855f7" rx="1" />

  <!-- Potted Plant (Symbolizing fresh/young growth - "青") -->
  <path d="M205 155 L225 155 L220 180 L210 180 Z" fill="#cbd5e1" filter="url(#shadow)" />
  <ellipse cx="215" cy="155" rx="10" ry="3" fill="#94a3b8" />
  <!-- Plant Stems & Leaves -->
  <path d="M215 152 Q215 130 200 120" fill="none" stroke="url(#leaf-grad)" stroke-width="3" stroke-linecap="round" />
  <path d="M215 152 Q225 125 235 115" fill="none" stroke="url(#leaf-grad)" stroke-width="3" stroke-linecap="round" />
  <path d="M215 152 Q210 100 218 90" fill="none" stroke="url(#leaf-grad)" stroke-width="3" stroke-linecap="round" />
  <!-- Leaf shapes -->
  <path d="M200 120 C190 115 195 105 200 120 Z" fill="#34d399" />
  <path d="M235 115 C240 105 230 100 235 115 Z" fill="#10b981" />
  <path d="M218 90 C225 80 210 75 218 90 Z" fill="#34d399" />

  <!-- MAIN CHARACTER & DESK SETUP -->
  <!-- Desk -->
  <path d="M70 160 L180 160 L190 185 L60 185 Z" fill="#334155" filter="url(#shadow)" />
  <rect x="65" y="160" width="120" height="6" fill="#475569" rx="2" />
  <rect x="75" y="185" width="10" height="35" fill="#1e293b" />
  <rect x="165" y="185" width="10" height="35" fill="#1e293b" />

  <!-- Desk Props (Art Supplies / Sketchbook representing youth/inexperience/starting out) -->
  <path d="M85 155 L115 150 L120 170 L90 175 Z" fill="#f8fafc" />
  <path d="M100 152 L112 172" stroke="#cbd5e1" stroke-width="1" />
  <!-- Pencil Holder & Pencils -->
  <rect x="145" y="140" width="16" height="22" fill="#cbd5e1" rx="2" />
  <path d="M149 140 L147 125 L151 125 Z" fill="#f59e0b" />
  <path d="M155 140 L156 122 L160 122 Z" fill="#ec4899" />

  <!-- CHARACTER: Young Girl ("青" - young/inexperienced yet focused) -->
  <g id="young-character" filter="url(#shadow)">
    <!-- Chair Back -->
    <rect x="100" y="110" width="30" height="60" rx="6" fill="#334155" />
    
    <!-- Torso (Youthful yellow hoodie/sweater) -->
    <path d="M95 145 Q115 130 135 145 L145 190 L85 190 Z" fill="#fbbf24" />
    <path d="M103 148 L127 148 L120 165 L110 165 Z" fill="#fef3c7" opacity="0.5" /> <!-- Collar accent -->

    <!-- Neck -->
    <rect x="107" y="122" width="16" height="15" fill="#fde047" rx="4" />
    <path d="M107 130 Q115 136 123 130 Z" fill="#facc15" opacity="0.3" /> <!-- Collarbone shadow -->

    <!-- Head -->
    <circle cx="115" cy="105" r="22" fill="#fde047" />

    <!-- Hair (Stylized bob cut, youthful look) -->
    <!-- Back Hair -->
    <path d="M93 100 Q90 125 105 130 Q115 125 125 130 Q140 125 137 100 Q140 85 125 80 L105 80 Q90 85 93 100 Z" fill="#1e293b" />
    <!-- Bangs & Face Framing -->
    <path d="M93 102 C93 85 102 82 115 82 C128 82 137 85 137 102 C137 112 130 115 125 108 C120 100 110 100 105 108 C100 115 93 112 93 102 Z" fill="#1e293b" />
    <!-- Hair highlights -->
    <path d="M102 86 Q115 84 128 86" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Face Features -->
    <!-- Expressive Eyes (Curved focus/determination or mild uncertainty) -->
    <circle cx="108" cy="106" r="2.5" fill="#0f172a" />
    <circle cx="122" cy="106" r="2.5" fill="#0f172a" />
    <!-- Soft blush -->
    <ellipse cx="104" cy="111" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3" />
    <ellipse cx="126" cy="111" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3" />
    <!-- Gentle thoughtful mouth -->
    <path d="M113 114 Q115 117 118 114" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms & Hands in Action (Posing thoughtfully over desk) -->
    <!-- Left Arm -->
    <path d="M98 145 Q85 155 95 168" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
    <!-- Left Hand touching chin / thinking pose -->
    <circle cx="97" cy="165" r="5" fill="#fde047" />

    <!-- Right Arm -->
    <path d="M132 145 Q145 155 135 168" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
    <!-- Right Hand resting on table -->
    <circle cx="133" cy="166" r="5" fill="#fde047" />
  </g>

  <!-- Foreground decorative elements for depth (Soft bokeh / lighting particles) -->
  <circle cx="50" cy="80" r="3" fill="#38bdf8" opacity="0.4" />
  <circle cx="40" cy="100" r="1.5" fill="#fbbf24" opacity="0.5" />
  <circle cx="150" cy="60" r="2" fill="#34d399" opacity="0.4" />
  <circle cx="130" cy="40" r="3" fill="#38bdf8" opacity="0.3" />
  <circle cx="190" cy="190" r="2" fill="#fbbf24" opacity="0.6" />
</svg>