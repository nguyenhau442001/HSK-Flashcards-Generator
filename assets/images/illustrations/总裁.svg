<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <clipPath id="roundCorner">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <g clip-path="url(#roundCorner)">
    <!-- City Skyline View (Through Window) -->
    <rect x="40" y="30" width="160" height="120" fill="#1e293b" opacity="0.5" />
    <rect x="55" y="90" width="20" height="60" fill="#0f172a" />
    <rect x="85" y="70" width="25" height="80" fill="#0f172a" />
    <rect x="120" y="100" width="15" height="50" fill="#0f172a" />
    <rect x="145" y="60" width="30" height="90" fill="#0f172a" />
    
    <!-- City Lights -->
    <circle cx="60" cy="100" r="1" fill="#f59e0b" />
    <circle cx="65" cy="115" r="1" fill="#f59e0b" />
    <circle cx="90" cy="85" r="1" fill="#fbbf24" />
    <circle cx="100" cy="110" r="1" fill="#fbbf24" />
    <circle cx="155" cy="75" r="1" fill="#f59e0b" />
    <circle cx="165" cy="120" r="1" fill="#fbbf24" />

    <!-- Window Frame -->
    <rect x="40" y="30" width="160" height="120" fill="none" stroke="#334155" stroke-width="4" />
    <line x1="120" y1="30" x2="120" y2="150" stroke="#334155" stroke-width="2" />

    <!-- Office Desk -->
    <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155" />
    <rect x="20" y="170" width="80" height="10" rx="2" fill="#475569" />
    
    <!-- Desk Props: Laptop & Plant -->
    <path d="M35 170 L75 170 L80 155 L40 155 Z" fill="#1e293b" /> <!-- Laptop base -->
    <rect x="45" y="135" width="30" height="20" rx="1" fill="#1e293b" stroke="#38bdf8" stroke-width="0.5" /> <!-- Laptop screen -->
    
    <rect x="180" y="155" width="15" height="15" fill="#fb923c" /> <!-- Pot -->
    <path d="M187 155 Q180 140 175 145 Q187 150 187 155" fill="#10b981" /> <!-- Leaf 1 -->
    <path d="M187 155 Q195 140 200 145 Q187 150 187 155" fill="#10b981" /> <!-- Leaf 2 -->

    <!-- The CEO (Subject) -->
    <!-- Body -->
    <path d="M130 240 Q130 160 155 160 Q180 160 180 240" fill="#1e293b" /> <!-- Suit jacket -->
    <path d="M150 160 L160 160 L155 180 Z" fill="#f8fafc" /> <!-- Shirt collar -->
    <path d="M154 165 L156 165 L155 185 Z" fill="#ec4899" /> <!-- Tie -->
    
    <!-- Head -->
    <circle cx="155" cy="140" r="15" fill="#fbbf24" /> <!-- Face -->
    <path d="M140 135 Q140 120 155 120 Q170 120 170 135 L170 140 L140 140 Z" fill="#0f172a" /> <!-- Hair -->
    
    <!-- Arms and Action -->
    <path d="M135 185 Q120 185 115 205" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" /> <!-- Left arm -->
    <path d="M175 185 Q190 185 195 205" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" /> <!-- Right arm -->
    
    <!-- Tablet -->
    <rect x="105" y="200" width="35" height="25" rx="2" transform="rotate(-10 122 212)" fill="#334155" stroke="#38bdf8" stroke-width="1" />
    <rect x="110" y="205" width="25" height="15" rx="1" transform="rotate(-10 122 212)" fill="#38bdf8" opacity="0.3" />
    
    <!-- Hands -->
    <circle cx="112" cy="210" r="4" fill="#fbbf24" />
    <circle cx="138" cy="205" r="4" fill="#fbbf24" />

    <!-- High-back Executive Chair (Partial view behind) -->
    <path d="M135 240 L135 170 Q135 150 155 150 Q175 150 175 170 L175 240" fill="#0f172a" opacity="0.4" />
  </g>

  <!-- Subtle Glow Overlay -->
  <circle cx="155" cy="140" r="60" fill="url(#glow)" opacity="0.1" />
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>
</svg>