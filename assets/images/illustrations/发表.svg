<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Podium Glow Gradient -->
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen/Publication Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Warm Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment & Architecture -->
  <g id="environment">
    <!-- Back wall panels -->
    <rect x="20" y="25" width="200" height="135" rx="8" fill="#1e293b" opacity="0.6"/>
    <line x1="120" y1="25" x2="120" y2="160" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Large Publication/Media Screen in Background -->
    <g transform="translate(60, 35)">
      <rect x="0" y="0" width="120" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="6" y="6" width="108" height="73" rx="4" fill="url(#screenGlow)"/>
      
      <!-- Abstract Article/Document Graphic on Screen -->
      <rect x="18" y="18" width="55" height="42" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="26" y1="26" x2="55" y2="26" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <line x1="26" y1="35" x2="65" y2="35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="44" x2="50" y2="44" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Floating Publishing Sparkles/Nodes -->
      <circle cx="90" cy="30" r="8" fill="#10b981" opacity="0.8" filter="url(#glow)"/>
      <path d="M87 30 L90 27 L93 30 L90 33 Z" fill="#ffffff"/>
      <circle cx="82" cy="60" r="5" fill="#f59e0b" opacity="0.8"/>
      <circle cx="98" cy="48" r="3" fill="#38bdf8" opacity="0.8"/>
      
      <!-- Connection lines -->
      <line x1="73" y1="39" x2="82" y2="55" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2"/>
    </g>

    <!-- Ambient Lighting / Light Beams from top -->
    <path d="M 120 0 L 60 160 L 180 160 Z" fill="url(#lightBeam)" style="mix-blend-mode: screen;" pointer-events="none"/>
  </g>

  <!-- Dynamic Action Particles (Published Article flying out) -->
  <g id="flying-articles" filter="url(#softShadow)">
    <g transform="translate(145, 75) rotate(15)">
      <rect x="0" y="0" width="24" height="30" rx="3" fill="#fb923c" />
      <line x1="4" y1="8" x2="16" y2="8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="14" x2="20" y2="14" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="20" x2="14" y2="20" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(45, 95) rotate(-20)">
      <rect x="0" y="0" width="20" height="26" rx="3" fill="#38bdf8" />
      <line x1="3" y1="7" x2="14" y2="7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="3" y1="13" x2="17" y2="13" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="3" y1="18" x2="11" y2="18" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Speaker / Character at Podium (The act of "Phát biểu" - presenting/speaking) -->
  <g id="speaker-and-podium" filter="url(#softShadow)">
    <!-- Podium Structure -->
    <path d="M 95 155 L 145 155 L 155 210 L 85 210 Z" fill="url(#podiumGrad)" stroke="#475569" stroke-width="2"/>
    <!-- Podium Accent Glow Strip -->
    <path d="M 100 165 L 140 165 L 142 173 L 98 173 Z" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>
    <rect x="105" y="185" width="30" height="4" rx="2" fill="#64748b"/>

    <!-- Microphone & Stand -->
    <path d="M 120 155 L 120 125" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 116 118 C 116 114 124 114 124 118 L 124 124 C 124 128 116 128 116 124 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <!-- Sound Waves from Mic -->
    <path d="M 105 115 C 102 118 102 124 105 127" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 135 115 C 138 118 138 124 135 127" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Character Body (Torso behind podium) -->
    <path d="M 85 180 C 85 160 155 160 155 180 L 160 215 L 80 215 Z" fill="#1e293b"/>
    <!-- Suit Jacket / Outfit -->
    <path d="M 95 165 L 120 195 L 145 165" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="120,165 110,185 130,185" fill="#f43f5e"/> <!-- Tie / Accent -->

    <!-- Character Neck & Head -->
    <rect x="112" y="145" width="16" height="15" fill="#fcd34d"/>
    <!-- Head / Face Profile or Front -->
    <circle cx="120" cy="130" r="18" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 102 128 C 102 115 138 115 138 128 C 138 120 128 112 120 112 C 112 112 102 120 102 128 Z" fill="#334155"/>
    
    <!-- Expressive Facial Features (Confident Speaking Expression) -->
    <!-- Friendly Confident Eyes -->
    <path d="M 112 128 Q 115 124 118 128" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 122 128 Q 125 124 128 128" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Open Happy Mouth (Speaking) -->
    <path d="M 116 136 Q 120 142 124 136 Z" fill="#be123c"/>

    <!-- Gesturing Arm / Hand -->
    <path d="M 145 170 C 160 165 165 145 155 135" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="155" cy="133" r="5" fill="#fcd34d"/>
  </g>

  <!-- Foreground Atmospheric Elements & UI Accents -->
  <g id="foreground-accents">
    <!-- Published Document floating/landing gracefully on the podium -->
    <g transform="translate(100, 142) rotate(-8)" filter="url(#softShadow)">
      <rect x="0" y="0" width="32" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="6" y1="6" x2="20" y2="6" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="6" y1="12" x2="26" y2="12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="6" y1="17" x2="16" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Success stamp/badge -->
      <circle cx="25" cy="17" r="4" fill="#10b981"/>
      <path d="M 23 17 L 24.5 18.5 L 27.5 15" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Sparkles of Achievement / Official Announcement -->
    <g transform="translate(35, 150)">
      <circle cx="0" cy="0" r="12" fill="#f59e0b" opacity="0.2" filter="url(#glow)"/>
      <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24"/>
    </g>
    <g transform="translate(205, 110)">
      <circle cx="0" cy="0" r="16" fill="#10b981" opacity="0.2" filter="url(#glow)"/>
      <path d="M 0 -10 L 2.5 -3 L 10 0 L 2.5 3 L 0 10 L -2.5 3 L -10 0 L -2.5 -3 Z" fill="#34d399"/>
    </g>
    <g transform="translate(185, 45)">
      <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#fbbf24"/>
    </g>
  </g>
</svg>