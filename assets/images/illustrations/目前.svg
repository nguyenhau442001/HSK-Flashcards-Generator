<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window View Gradient (Positive "Good" Weather/Cityscape) -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Chart Positive Gradient -->
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ROOM INTERIOR BACKGROUND -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" />
  
  <!-- Window showing positive outside situation -->
  <g filter="url(#shadow)">
    <rect x="135" y="35" width="70" height="85" rx="4" fill="#334155" />
    <rect x="140" y="40" width="60" height="75" rx="2" fill="url(#sky-grad)" />
    <!-- City silhouette / Sun -->
    <circle cx="170" cy="70" r="12" fill="#fde047" opacity="0.9" />
    <path d="M145 115 L145 95 L155 95 L155 115 L165 85 L175 85 L175 115 L190 90 L200 90 L200 115 Z" fill="#7dd3fc" opacity="0.6" />
    <!-- Window Frame cross -->
    <line x1="170" y1="40" x2="170" y2="115" stroke="#334155" stroke-width="3" />
    <line x1="140" y1="77" x2="200" y2="77" stroke="#334155" stroke-width="3" />
  </g>

  <!-- Wall Shelf with Books & Plant -->
  <rect x="35" y="55" width="80" height="6" rx="2" fill="#475569" />
  <!-- Mini Potted Plant on Shelf -->
  <path d="M45 55 L50 45 L56 45 L61 55 Z" fill="#cbd5e1" />
  <path d="M53 45 Q47 35 42 40 Q47 48 53 45 Z" fill="url(#leaf-grad)" />
  <path d="M53 45 Q59 33 64 38 Q58 46 53 45 Z" fill="url(#leaf-grad)" />
  <!-- Books -->
  <rect x="68" y="35" width="8" height="20" rx="1" fill="#ec4899" />
  <rect x="77" y="38" width="6" height="17" rx="1" fill="#38bdf8" />
  <rect x="84" y="33" width="10" height="22" rx="1" fill="#fbbf24" />

  <!-- DESK & PROPS -->
  <!-- Wooden Desk Surface -->
  <rect x="10" y="165" width="220" height="12" rx="3" fill="#334155" filter="url(#shadow)" />
  <rect x="25" y="177" width="10" height="43" fill="#1e293b" />
  <rect x="205" y="177" width="10" height="43" fill="#1e293b" />

  <!-- Laptop showing "Good Current Situation" (Upward Trend Chart) -->
  <g transform="translate(115, 115)" filter="url(#shadow)">
    <!-- Laptop Base -->
    <path d="M-30 50 L50 50 L40 54 L-20 54 Z" fill="#64748b" />
    <rect x="-10" y="52" width="20" height="2" rx="1" fill="#475569" />
    <!-- Laptop Screen -->
    <rect x="-26" y="5" width="66" height="47" rx="4" fill="#334155" />
    <rect x="-22" y="9" width="58" height="39" rx="2" fill="url(#screen-glow)" />
    <!-- Dashboard elements (Positive upward chart) -->
    <rect x="-18" y="13" width="20" height="4" rx="1" fill="#38bdf8" opacity="0.7" />
    <path d="M-18 38 L-6 30 L6 33 L22 18" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="-18,38 -6,30 6,33 22,18 22,42 -18,42" fill="url(#chart-grad)" />
    <circle cx="22" cy="18" r="2.5" fill="#10b981" />
  </g>

  <!-- Coffee Mug with Steam -->
  <g transform="translate(190, 140)" filter="url(#shadow)">
    <rect x="0" y="5" width="14" height="18" rx="3" fill="#f8fafc" />
    <path d="M14 8 C18 8, 18 16, 14 18" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam wisps representing calm, good times -->
    <path d="M4 1 Q7 -2, 4 -5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M10 2 Q13 -1, 10 -4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- CHARACTERS -->
  <!-- Main Character (Confident Professional smiling, looking at the positive results) -->
  <g transform="translate(65, 95)" filter="url(#shadow)">
    <!-- Body / Torso (Modern teal sweater) -->
    <path d="M -22 65 C -22 45, 22 45, 22 65 L 30 90 L -30 90 Z" fill="#0d9488" />
    <!-- Collar -->
    <path d="M -8 45 L 0 52 L 8 45 L 0 42 Z" fill="#f8fafc" />

    <!-- Neck -->
    <rect x="-5" y="33" width="10" height="15" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="0" cy="20" r="16" fill="#fbcfe8" />
    
    <!-- Hair (Stylish dark bun/short hair) -->
    <path d="M -16 15 C -18 -2, 16 -2, 16 15 C 16 8, 10 3, 0 3 C -10 3, -16 8, -16 15 Z" fill="#334155" />
    <circle cx="0" cy="1" r="5" fill="#334155" />

    <!-- Facial Expression (Happy, reassuring smile) -->
    <!-- Eyes (Happy closed curves) -->
    <path d="M -7 18 C -5 15, -3 18, -3 18" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 3 18 C 5 15, 7 18, 7 18" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Cheeks (Warm blush) -->
    <circle cx="-9" cy="22" r="3" fill="#f43f5e" opacity="0.3" />
    <circle cx="9" cy="22" r="3" fill="#f43f5e" opacity="0.3" />
    <!-- Confident Smile -->
    <path d="M -4 25 C -2 28, 2 28, 4 25" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms & Hands in a relaxed, satisfied posture -->
    <!-- Left arm resting -->
    <path d="M -20 50 C -30 55, -35 70, -25 75" fill="none" stroke="#0d9488" stroke-width="9" stroke-linecap="round" />
    <!-- Right arm gesturing towards the screen/thumbs up -->
    <path d="M 20 50 C 32 55, 35 68, 25 72" fill="none" stroke="#0d9488" stroke-width="9" stroke-linecap="round" />
    <circle cx="25" cy="72" r="4" fill="#fbcfe8" />
  </g>

  <!-- Foreground Floor Line for anchoring elements -->
  <rect x="0" y="220" width="240" height="20" fill="#0f172a" />
</svg>