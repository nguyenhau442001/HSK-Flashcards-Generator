<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Running Track Lines -->
  <path d="M0 180 Q120 150 240 180" stroke="#334155" stroke-width="4" fill="none"/>
  <path d="M0 200 Q120 170 240 200" stroke="#334155" stroke-width="4" fill="none"/>
  
  <!-- Stopwatch/Timer Display (Floating) -->
  <circle cx="180" cy="60" r="35" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
  <path d="M180 35 L180 45 M180 85 L180 75 M205 60 L195 60 M155 60 L165 60" stroke="#fbbf24" stroke-width="2"/>
  <path d="M180 60 L180 40 L195 55" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Runner -->
  <g transform="translate(80, 120)">
    <!-- Body -->
    <path d="M0 0 L20 -40 L40 -20 L20 20 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="25" cy="-50" r="12" fill="#fde68a"/>
    <!-- Legs -->
    <path d="M15 15 L5 50 M25 15 L35 50" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M20 -20 L0 -10 M20 -20 L40 -10" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Finish Line Ribbon (Broken) -->
  <path d="M140 100 L140 160" stroke="#ec4899" stroke-width="6" stroke-dasharray="10 5"/>
  <path d="M135 100 L150 110 L135 120" fill="#ec4899"/>
  <path d="M145 140 L160 150 L145 160" fill="#ec4899"/>
  
  <!-- Confetti/Celebration -->
  <circle cx="160" cy="90" r="3" fill="#fb923c"/>
  <circle cx="170" cy="110" r="2" fill="#10b981"/>
  <circle cx="150" cy="130" r="3" fill="#fbbf24"/>
  <circle cx="190" cy="140" r="2" fill="#ec4899"/>
  
  <!-- Speed lines -->
  <path d="M40 100 L60 100 M30 120 L50 120" stroke="#475569" stroke-width="2"/>
</svg>