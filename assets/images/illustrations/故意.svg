<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Action/Mischief Glow -->
    <radialGradient id="mischief-glow" cx="70%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="table-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#mischief-glow)" />

  <!-- Ambient Background Details -->
  <g opacity="0.15">
    <!-- Bookshelf in background -->
    <rect x="25" y="40" width="40" height="70" rx="2" fill="#64748b" />
    <rect x="30" y="55" width="30" height="4" fill="#1e293b" />
    <rect x="30" y="75" width="30" height="4" fill="#1e293b" />
    <rect x="30" y="95" width="30" height="4" fill="#1e293b" />
    <!-- Wall clock -->
    <circle cx="185" cy="55" r="18" fill="none" stroke="#64748b" stroke-width="3" />
    <line x1="185" y1="45" x2="185" y2="55" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="185" y1="55" x2="193" y2="58" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 225 L 0 225 Z" fill="url(#table-top)" filter="url(#shadow)" />
  <path d="M 0 165 L 240 165 L 240 171 L 0 171 Z" fill="#475569" />

  <!-- SCENE: DELIBERATE MISCHIEF (A finger about to tip over a teacup/vase) -->
  
  <!-- Spilled Liquid / Puddle Base (Foreshadowing the act) -->
  <ellipse cx="145" cy="180" rx="28" ry="8" fill="#38bdf8" opacity="0.3" />

  <!-- Teacup / Mug (The Target) -->
  <g id="cup" filter="url(#shadow)">
    <!-- Saucer -->
    <ellipse cx="130" cy="175" rx="22" ry="7" fill="#cbd5e1" />
    <ellipse cx="130" cy="173" rx="19" ry="5" fill="#e2e8f0" />
    
    <!-- Cup Body (Tilted slightly to show it's being pushed) -->
    <g transform="rotate(12 130 165)">
      <!-- Cup shadow inside -->
      <ellipse cx="130" cy="148" rx="11" ry="3" fill="#94a3b8" />
      <!-- Outer Cup -->
      <path d="M 119 148 L 122 170 C 122 172 138 172 138 170 L 141 148 Z" fill="#f8fafc" />
      <!-- Cup Handle -->
      <path d="M 140 152 C 148 152 148 166 140 166" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
      <!-- Tea Liquid Inside -->
      <ellipse cx="130" cy="151" rx="10" ry="2.5" fill="#f59e0b" />
      <!-- Steam / Action lines indicating impending spill -->
      <path d="M 124 140 C 122 135 127 130 125 125" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

  <!-- The Mischievous Character / Hand (Representing 'Gùyì' - On Purpose) -->
  <g id="mischievous-hand" filter="url(#shadow)">
    <!-- Sleeve Cuff -->
    <path d="M 210 205 L 180 185 C 170 178 165 170 162 165 L 175 155 C 180 160 185 168 195 175 L 220 195 Z" fill="#ec4899" />
    <path d="M 180 185 L 175 155 C 180 160 185 168 195 175 Z" fill="#db2777" opacity="0.4" /> <!-- sleeve fold shadow -->

    <!-- Forearm / Hand Base -->
    <path d="M 162 165 C 155 155 145 148 135 145 L 142 135 C 155 140 168 150 175 155 Z" fill="#ffedd5" />

    <!-- Palm and Fingers (Curled except index finger pointing/pushing) -->
    <!-- Curled fingers -->
    <path d="M 135 145 C 130 148 122 153 125 158 C 128 162 135 155 140 152" fill="#fed7aa" />
    <path d="M 133 149 C 128 153 122 158 126 163 C 130 167 136 160 141 156" fill="#fed7aa" />
    <path d="M 132 154 C 128 159 123 164 128 169 C 132 173 138 166 142 162" fill="#fed7aa" />

    <!-- DELIBERATE PUSHING INDEX FINGER -->
    <path d="M 142 135 C 138 128 132 118 120 120 C 112 121 112 130 120 134 C 126 137 135 138 142 142 Z" fill="#ffedd5" />
    
    <!-- Fingernail detail -->
    <path d="M 119 121 C 116 122 116 126 119 127" fill="none" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Dynamic Motion / Action Effects (Emphasizing INTENTIONAL action) -->
  <g id="action-fx">
    <!-- Push impact lines near the cup -->
    <line x1="110" y1="145" x2="118" y2="148" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="107" y1="155" x2="115" y2="155" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Glowing mischief spark -->
    <circle cx="114" cy="142" r="4" fill="#fbbf24" />
    <path d="M 114 135 L 114 149 M 107 142 L 121 142" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground Atmospheric Elements / Props for Depth -->
  <!-- A stray notebook or book lying on the desk -->
  <g transform="rotate(-8 60 190)" filter="url(#shadow)">
    <rect x="40" y="175" width="50" height="35" rx="3" fill="#3b82f6" />
    <rect x="43" y="178" width="44" height="29" rx="1" fill="#f8fafc" />
    <!-- Notebook lines -->
    <line x1="48" y1="185" x2="75" y2="185" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="48" y1="192" x2="70" y2="192" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="48" y1="199" x2="77" y2="199" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Binding -->
    <rect x="38" y="175" width="5" height="35" rx="1" fill="#1d4ed8" />
  </g>

  <!-- Stray pencil -->
  <g transform="rotate(25 90 205)" filter="url(#shadow)">
    <polygon points="75,203 115,203 118,205 115,207 75,207" fill="#fbbf24" />
    <polygon points="115,203 121,205 115,207" fill="#f43f5e" /> <!-- eraser tip -->
    <polygon points="75,203 70,205 75,207" fill="#fef08a" /> <!-- sharpened tip -->
    <polygon points="73,205 70,205 73,205" fill="#1e293b" /> <!-- graphite -->
  </g>

  <!-- Soft Vignette Frame Overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>