<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Medal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Red Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Uniform Blue Gradient -->
    <linearGradient id="uniformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Elderly Vest Gradient -->
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  
  <!-- Spotlight Effect -->
  <circle cx="120" cy="90" r="110" fill="url(#spotlight)" />

  <!-- EXHIBITION / MUSEUM BACKGROUND ELEMENTS -->
  <!-- Wooden Display Table -->
  <rect x="50" y="195" width="140" height="15" rx="3" fill="#334155" />
  <rect x="40" y="210" width="160" height="8" rx="2" fill="#1e293b" />
  <rect x="65" y="218" width="15" height="15" fill="#0f172a" />
  <rect x="160" y="218" width="15" height="15" fill="#0f172a" />

  <!-- Display Case / Glass Shelf Line -->
  <line x1="20" y1="195" x2="220" y2="195" stroke="#475569" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Historic Photo Frames on the Wall (Background) -->
  <rect x="35" y="45" width="40" height="50" rx="2" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <rect x="41" y="51" width="28" height="32" fill="#1e293b" />
  <circle cx="55" cy="65" r="8" fill="#475569" />
  <path d="M 45 80 Q 55 73 65 80" stroke="#475569" stroke-width="3" fill="none" />

  <rect x="165" y="45" width="40" height="50" rx="2" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <rect x="171" y="51" width="28" height="32" fill="#1e293b" />
  <circle cx="185" cy="63" r="7" fill="#475569" />
  <path d="M 175 80 Q 185jou72 195 80" fill="none" stroke="#475569" stroke-width="3" />

  <!-- Laurel Wreath Decoration on Wall Center -->
  <path d="M 105 50 Q 120 40 135 50" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <path d="M 107 55 Q 120 47 133 55" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />

  <!-- FOREGROUND: TWO CHARACTERS (ELDERLY HERO & YOUNG VISITOR) -->

  <!-- CHARACTER 1: The Elderly Hero (Center-Left) -->
  <g transform="translate(10, 0)">
    <!-- Body & Uniform Jacket -->
    <path d="M 80 130 L 115 130 L 122 200 L 73 200 Z" fill="url(#uniformGrad)" filter="url(#shadow)" />
    <!-- Hero Medals on Chest -->
    <circle cx="93" cy="148" r="5" fill="url(#goldGrad)" />
    <path d="M 90 143 L 96 143 L 95 140 L 91 140 Z" fill="url(#ribbonGrad)" />
    
    <circle cx="107" cy="150" r="4" fill="url(#goldGrad)" />
    <path d="M 104 145 L 110 145 L 109 142 L 105 142 Z" fill="#38bdf8" />

    <!-- Head & Face (Elderly, dignified, smiling gently) -->
    <circle cx="98" cy="100" r="18" fill="#fed7aa" />
    <!-- Gray Hair Sides -->
    <path d="M 81 100 Q 80 85 98 83 Q 116 85 115 100 Q 115 90 98 88 Q 81 90 81 100 Z" fill="#cbd5e1" />
    <!-- Gentle Smile & Wrinkles -->
    <path d="M 93 106 Q 98 111 103 106" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="91" cy="98" r="1.5" fill="#1e293b" />
    <circle cx="105" cy="98" r="1.5" fill="#1e293b" />
    <!-- Friendly Eyebrows -->
    <path d="M 89 93 Q 92 91 95 94" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 103 94 Q 106 91 109 93" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm gesturing towards the case/exhibit -->
    <path d="M 115 135 Q 130 140 138 130" fill="none" stroke="url(#uniformGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="140" cy="127" r="5" fill="#fed7aa" />
  </g>

  <!-- CHARACTER 2: Young Admirer / Descendant (Right) -->
  <g transform="translate(60, 0)">
    <!-- Body & Modern Jacket -->
    <path d="M 90 140 L 125 140 L 132 200 L 83 200 Z" fill="#334155" filter="url(#shadow)" />
    <path d="M 107 140 L 107 200" stroke="#1e293b" stroke-width="3" />

    <!-- Head & Face (Young, respectful, looking up with admiration) -->
    <circle cx="108" cy="105" r="16" fill="#fbcfe8" />
    <!-- Modern Dark Hair -->
    <path d="M 93 105 Q 92 88 108 88 Q 124 88 123 105 Q 120 93 108 92 Q 96 93 93 105 Z" fill="#0f172a" />
    <!-- Eyes looking left toward hero -->
    <circle cx="103" cy="103" r="1.5" fill="#0f172a" />
    <circle cx="111" cy="103" r="1.5" fill="#0f172a" />
    <!-- Polite Smile -->
    <path d="M 104 111 Q 107 114 110 111" fill="none" stroke="#be185d" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm holding a notebook or gesturing respectfully -->
    <path d="M 92 145 Q 80 160 85 175" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round" />
    <circle cx="86" cy="178" r="4.5" fill="#fbcfe8" />

    <!-- Red Notebook / Tablet Prop -->
    <rect x="70" y="170" width="22" height="26" rx="2" fill="#ef4444" transform="rotate(-15 70 170)" />
    <line x1="75" y1="178" x2="87" y2="178" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
    <line x1="75" y1="184" x2="85" y2="184" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND PROPS ON DISPLAY TABLE -->
  <!-- Historic Honor Flag / Scroll Stand -->
  <g transform="translate(115, 185)">
    <!-- Stand Base -->
    <rect x="-10" y="15" width="30" height="5" rx="2" fill="#94a3b8" />
    <!-- Stand Pole -->
    <line x1="5" y1="15" x2="5" y2="-15" stroke="#cbd5e1" stroke-width="3" />
    <!-- Hanging Banner (Red & Gold star motif) -->
    <path d="M -5 -12 L 15 -12 L 15 15 L 5 10 L -5 15 Z" fill="url(#ribbonGrad)" filter="url(#shadow)" />
    <!-- Star on Banner -->
    <polygon points="5,-2 7,3 12,3 8,6 9,11 5,8 1,11 2,6 -2,3 3,3" fill="#fbbf24" transform="translate(0, -3) scale(0.6)" />
  </g>

  <!-- Vintage Medal on Display Pillow -->
  <g transform="translate(55, 192)">
    <!-- Velvet Pillow -->
    <rect x="0" y="0" width="28" height="10" rx="5" fill="#7f1d1d" />
    <!-- Gold Star Medal on Pillow -->
    <circle cx="14" cy="3" r="7" fill="url(#goldGrad)" filter="url(#shadow)" />
    <polygon points="14,-1 15,2 18,2 16,4 17,7 14,5 11,7 12,4 10,2 13,2" fill="#fef08a" transform="translate(14, 3) scale(0.6) translate(-14, -3)" />
  </g>

</svg>