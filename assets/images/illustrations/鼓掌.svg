<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Spotlight/Glow Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Hand Gradients -->
    <linearGradient id="skinGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Clothing Gradients -->
    <linearGradient id="sleeve1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sleeve2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Confetti & Sparkle Shapes -->
    <g id="sparkle">
      <path d="M0,-8 Q0,0 8,0 Q0,0 0,8 Q0,0 -8,0 Q0,0 0,-8" fill="#fbbf24"/>
    </g>
    <g id="star">
      <path d="M0,-6 L1.8,-1.8 L6,0 L1.8,1.8 L0,6 L-1.8,1.8 L-6,0 L-1.8,-1.8 Z" fill="#38bdf8"/>
    </g>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Spotlight -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Stage / Environment elements -->
  <!-- Ambient glowing confetti in background -->
  <use href="#sparkle" x="50" y="70" transform="scale(0.8) rotate(15 50 70)" opacity="0.8"/>
  <use href="#star" x="190" y="60" transform="scale(0.7) rotate(-20 190 60)" opacity="0.9"/>
  <circle cx="75" cy="45" r="3" fill="#ec4899" opacity="0.7"/>
  <circle cx="165" cy="90" r="2.5" fill="#10b981" opacity="0.8"/>
  <rect x="35" y="100" width="6" height="6" rx="1" fill="#fbbf24" transform="rotate(45 38 103)" opacity="0.8"/>
  <rect x="200" y="130" width="5" height="5" rx="1" fill="#38bdf8" transform="rotate(30 202 132)" opacity="0.9"/>

  <!-- Motion lines / sound waves of applause -->
  <path d="M85,100 C75,110 75,130 85,140" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M70,90 C55,105 55,135 70,150" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M155,100 C165,110 165,130 155,140" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M170,90 C185,105 185,135 170,150" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Center Action: Clapping Hands (鼓掌) -->
  <g transform="translate(0, 10)">
    
    <!-- Left Arm & Sleeve -->
    <path d="M 120,145 Q 85,135 55,155 L 45,135 Q 75,115 115,125 Z" fill="url(#sleeve1)"/>
    <!-- Left Cuffs -->
    <path d="M 55,155 L 45,135" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right Arm & Sleeve -->
    <path d="M 120,145 Q 155,135 185,155 L 195,135 Q 165,115 125,125 Z" fill="url(#sleeve2)"/>
    <!-- Right Cuffs -->
    <path d="M 185,155 L 195,135" stroke="#be185d" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Hand (Dynamic angled clapping pose) -->
    <g transform="translate(100, 122) rotate(-15)">
      <!-- Palm and Fingers -->
      <path d="M 0,25 C -5,10 5,0 20,5 C 30,8 35,20 30,30 C 25,40 10,35 0,25 Z" fill="url(#skinGrad1)"/>
      <!-- Fingers extended -->
      <path d="M 18,2 C 22,-5 32,-3 32,5 C 32,10 25,12 22,10" fill="url(#skinGrad1)"/>
      <path d="M 28,7 C 35,2 43,8 40,15 C 37,20 31,18 29,15" fill="url(#skinGrad1)"/>
      <path d="M 33,16 C 40,14 45,22 41,28 C 37,32 32,27 31,23" fill="url(#skinGrad1)"/>
      <path d="M 32,27 C 38,28 40,36 34,40 C 29,43 27,35 28,32" fill="url(#skinGrad1)"/>
      <!-- Thumb -->
      <path d="M 5,22 C -2,25 -5,35 2,38 C 8,40 12,30 10,25" fill="url(#skinGrad1)"/>
    </g>

    <!-- Right Hand (Mirrored clapping pose) -->
    <g transform="translate(140, 122) scale(-1, 1) rotate(-15)">
      <!-- Palm and Fingers -->
      <path d="M 0,25 C -5,10 5,0 20,5 C 30,8 35,20 30,30 C 25,40 10,35 0,25 Z" fill="url(#skinGrad2)"/>
      <!-- Fingers extended -->
      <path d="M 18,2 C 22,-5 32,-3 32,5 C 32,10 25,12 22,10" fill="url(#skinGrad2)"/>
      <path d="M 28,7 C 35,2 43,8 40,15 C 37,20 31,18 29,15" fill="url(#skinGrad2)"/>
      <path d="M 33,16 C 40,14 45,22 41,28 C 37,32 32,27 31,23" fill="url(#skinGrad2)"/>
      <path d="M 32,27 C 38,28 40,36 34,40 C 29,43 27,35 28,32" fill="url(#skinGrad2)"/>
      <!-- Thumb -->
      <path d="M 5,22 C -2,25 -5,35 2,38 C 8,40 12,30 10,25" fill="url(#skinGrad2)"/>
    </g>

    <!-- Impact / Applause Spark Effects right in the center -->
    <g transform="translate(120, 115)">
      <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.3"/>
      <use href="#sparkle" x="0" y="-18" transform="scale(1.2)"/>
      <use href="#sparkle" x="-16" y="5" transform="scale(0.9) rotate(45)"/>
      <use href="#sparkle" x="16" y="5" transform="scale(0.9) rotate(-45)"/>
      <circle cx="-10" cy="-12" r="2.5" fill="#ec4899"/>
      <circle cx="12" cy="-14" r="2" fill="#38bdf8"/>
      <circle cx="0" cy="18" r="3" fill="#10b981"/>
    </g>

  </g>

  <!-- Foreground Atmosphere / Confetti Pieces -->
  <use href="#star" x="70" y="170" transform="scale(1) rotate(10 70 170)"/>
  <use href="#sparkle" x="175" y="165" transform="scale(0.9) rotate(25 175 165)"/>
  <circle cx="45" cy="130" r="2" fill="#fbbf24"/>
  <circle cx="195" cy="100" r="3" fill="#ec4899"/>
  <rect x="150" y="180" width="6" height="6" rx="1.5" fill="#10b981" transform="rotate(15 153 183)"/>
  <rect x="80" y="70" width="5" height="5" rx="1" fill="#38bdf8" transform="rotate(60 82 72)"/>

  <!-- Stage Floor Line & Gradient glow -->
  <path d="M 30,205 Q 120,195 210,205" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="120" cy="204" rx="75" ry="8" fill="#38bdf8" opacity="0.15"/>
</svg>