<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Toolkit -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Toolbox Red/Orange Gradient -->
    <linearGradient id="toolbox-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Toolbox Lid Gradient -->
    <linearGradient id="toolbox-lid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Wrench Metal Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light/Glow representing 'Essential Need' -->
  <circle cx="120" cy="130" r="80" fill="url(#amber-glow)" filter="url(#glow)" />

  <!-- WORKBENCH SURFACE -->
  <!-- Back wall line -->
  <line x1="20" y1="175" x2="220" y2="175" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Wooden/Slate Workbench Top -->
  <path d="M 20 175 L 220 175 L 230 220 L 10 220 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M 15 175 L 225 175" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- SCENE PROPS: Background Elements (Blueprint/Notes) -->
  <g opacity="0.6" transform="translate(150, 45) rotate(12)">
    <rect width="55" height="70" rx="4" fill="#cbd5e1"/>
    <line x1="10" y1="15" x2="45" y2="15" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="28" x2="35" y2="28" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="40" x2="40" y2="40" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="27" cy="55" r="8" fill="none" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- Gear/Cog (Secondary Essential Tool Prop) -->
  <g transform="translate(185, 135) scale(0.8)" filter="url(#shadow)">
    <path d="M 12 2 L 15 8 L 22 7 L 20 13 L 26 17 L 21 21 L 23 28 L 17 26 L 14 32 L 10 27 L 3 29 L 5 22 L 0 18 L 5 13 L 2 7 L 9 9 Z" fill="#38bdf8" />
    <circle cx="13" cy="17" r="6" fill="#0f172a"/>
  </g>

  <!-- MAIN SUBJECT: Open Essential Toolkit (Representing 'Necessity/Requirement') -->
  <g filter="url(#shadow)">
    <!-- Toolbox Base / Back Compartment -->
    <path d="M 50 130 L 190 130 L 180 180 L 60 180 Z" fill="#c2410c" />
    
    <!-- Toolbox Front Open Flap -->
    <path d="M 50 140 L 190 140 L 205 190 L 35 190 Z" fill="url(#toolbox-grad)" />
    
    <!-- Inner Contents / Trays -->
    <rect x="55" y="145" width="130" height="15" rx="3" fill="#1e293b" opacity="0.3"/>
    
    <!-- Toolbox Lid (Open backwards/upwards) -->
    <path d="M 45 130 L 195 130 L 185 95 L 55 95 Z" fill="url(#toolbox-lid)" />
    <path d="M 50 112 L 190 112" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />
    
    <!-- Toolbox Clasp/Latch -->
    <rect x="112" y="160" width="16" height="10" rx="3" fill="#e2e8f0" />
    <circle cx="120" cy="165" r="2" fill="#64748b" />
    
    <!-- Handle -->
    <path d="M 90 95 C 90 75, 150 75, 150 95" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- CRITICAL TOOLS EMERGING (Visualizing 'What is Needed/Essential') -->
  
  <!-- Wrench (Primary Tool) angled dynamically -->
  <g transform="translate(85, 105) rotate(-25)" filter="url(#shadow)">
    <!-- Wrench Handle -->
    <path d="M 0 0 L 12 70 C 14 78, 6 82, 0 80 C -6 82, -14 78, -12 70 Z" fill="url(#metal-grad)" />
    <!-- Wrench Head -->
    <circle cx="0" cy="-6" r="14" fill="url(#metal-grad)" />
    <path d="M -6 -12 L 6 0 L 2 4 L -10 -8 Z" fill="#0f172a" /> <!-- Cutout -->
  </g>

  <!-- Screwdriver (Secondary Tool) crossing over -->
  <g transform="translate(155, 100) rotate(35)" filter="url(#shadow)">
    <!-- Screwdriver Handle -->
    <rect x="-6" y="20" width="12" height="45" rx="4" fill="#ef4444" />
    <rect x="-4" y="25" width="8" height="35" rx="2" fill="#b91c1c" />
    <!-- Metal Shaft -->
    <rect x="-2" y="-15" width="4" height="35" fill="url(#metal-grad)" />
    <!-- Flat Head Tip -->
    <polygon points="-4,-15 4,-15 2,-22 -2,-22" fill="#94a3b8" />
  </g>

  <!-- Sparkle / Essential Indicator Icons (Highlighting Importance) -->
  <g transform="translate(120, 50)">
    <!-- Main Glowing Star -->
    <path d="M 0 -12 C 3 -4, 4 -3, 12 0 C 4 3, 3 4, 0 12 C -3 4, -4 3, -12 0 C -4 -3, -3 -4, 0 -12 Z" fill="#fbbf24" filter="url(#glow)" />
  </g>
  
  <g transform="translate(65, 80) scale(0.6)">
    <!-- Small Star -->
    <path d="M 0 -12 C 3 -4, 4 -3, 12 0 C 4 3, 3 4, 0 12 C -3 4, -4 3, -12 0 C -4 -3, -3 -4, 0 -12 Z" fill="#f59e0b" />
  </g>

  <g transform="translate(175, 75) scale(0.7)">
    <!-- Small Star -->
    <path d="M 0 -12 C 3 -4, 4 -3, 12 0 C 4 3, 3 4, 0 12 C -3 4, -4 3, -12 0 C -4 -3, -3 -4, 0 -12 Z" fill="#38bdf8" />
  </g>

</svg>