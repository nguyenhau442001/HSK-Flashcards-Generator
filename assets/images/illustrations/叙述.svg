<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background with atmospheric gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Window Context -->
  <path d="M0 0 H240 V160 H0 Z" fill="#1e293b"/>
  <rect x="28" y="24" width="60" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="34" y="30" width="48" height="78" fill="url(#windowGlow)"/>
  <!-- Window frame details -->
  <line x1="58" y1="30" x2="58" y2="108" stroke="#334155" stroke-width="2"/>
  <line x1="34" y1="69" x2="82" y2="69" stroke="#334155" stroke-width="2"/>

  <!-- Bookshelf / Environment Props in Background -->
  <rect x="180" y="40" width="36" height="80" fill="#111827" rx="2"/>
  <line x1="180" y1="65" x2="216" y2="65" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="95" x2="216" y2="95" stroke="#334155" stroke-width="2"/>
  <rect x="186" y="48" width="8" height="17" fill="#f59e0b" rx="1"/>
  <rect x="196" y="50" width="6" height="15" fill="#38bdf8" rx="1"/>
  <rect x="188" y="75" width="12" height="20" fill="#10b981" rx="1"/>

  <!-- Office Desk -->
  <path d="M20 185 H220 V195 H20 Z" fill="url(#deskGrad)" rx="2"/>
  <rect x="16" y="165" width="208" height="20" fill="#475569" rx="3"/>

  <!-- Narrative / Event Storyboard Elements floating to visualize "telling a sequence of events" -->
  <g transform="translate(135, 38)" opacity="0.85">
    <!-- Connecting thread of the story -->
    <path d="M 15 35 Q 40 10 65 35" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Story Node 1: Time/Event start -->
    <circle cx="15" cy="35" r="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <path d="M12 32 L15 35 L19 30" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

    <!-- Story Node 2: Climax/Action -->
    <circle cx="65" cy="35" r="12" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="65" cy="35" r="4" fill="#f43f5e"/>
  </g>

  <!-- LAPTOP & PROPS ON DESK -->
  <!-- Laptop Base -->
  <path d="M70 165 L80 145 H140 L150 165 Z" fill="#94a3b8"/>
  <!-- Laptop Screen showing timeline/story graphics -->
  <rect x="85" y="105" width="50" height="42" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Abstract sequence icons on screen -->
  <rect x="91" y="113" width="12" height="8" rx="1" fill="#38bdf8"/>
  <rect x="107" y="113" width="22" height="3" rx="1" fill="#64748b"/>
  <rect x="107" y="119" width="15" height="3" rx="1" fill="#64748b"/>
  <rect x="91" y="129" width="12" height="8" rx="1" fill="#10b981"/>
  <rect x="107" y="131" width="20" height="3" rx="1" fill="#64748b"/>

  <!-- Coffee Mug -->
  <rect x="160" y="145" width="14" height="18" rx="2" fill="#f8fafc"/>
  <path d="M174 149 C178 149 178 159 174 159" fill="none" stroke="#f8fafc" stroke-width="2"/>

  <!-- LISTENER / MANAGER CHARACTER (Right side, attentive, listening to the narrative) -->
  <g transform="translate(155, 75)">
    <!-- Body / Torso -->
    <path d="M30 65 Q 30 45 45 45 H 65 Q 80 45 80 65 L 85 90 H 25 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="55" cy="28" r="15" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M40 25 Q 55 10 70 25 Q 73 18 65 15 Q 55 12 45 15 Q 37 18 40 25 Z" fill="#1e293b"/>
    <!-- Ear & Glasses -->
    <circle cx="70" cy="28" r="2" fill="#fbcfe8"/>
    <path d="M50 26 H 62" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="53" cy="26" r="4" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Attentive hand on chin -->
    <path d="M 50 50 Q 42 55 45 62" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- SPEAKER / NARRATOR CHARACTER (Left/Center, actively recounting the sequence of events) -->
  <g transform="translate(60, 68)">
    <!-- Torso (leaning forward earnestly) -->
    <path d="M 25 72 Q 25 45 45 45 H 65 Q 85 45 85 72 L 95 97 H 15 Z" fill="#10b981"/>
    
    <!-- Neck -->
    <path d="M 48 40 L 48 48" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>

    <!-- Head (Expressive, mid-speech) -->
    <circle cx="48" cy="25" r="16" fill="#fef08a"/>
    
    <!-- Hair (Dynamic neat side-sweep) -->
    <path d="M32 24 Q 45 8 62 20 Q 64 28 58 26 Q 48 18 36 28 Z" fill="#334155"/>

    <!-- Facial features: Focused eyes and open mouth gesturing explanation -->
    <!-- Open enthusiastic mouth -->
    <path d="M 44 33 Q 48 38 52 33 Z" fill="#991b1b"/>
    <!-- Eyes (focused forward) -->
    <circle cx="42" cy="22" r="2" fill="#1e293b"/>
    <circle cx="54" cy="22" r="2" fill="#1e293b"/>
    <!-- Eyebrows raised in explanation -->
    <path d="M 39 18 Q 42 16 45 19" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 51 19 Q 54 16 57 18" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Gesturing Hands (Describing the process/steps) -->
    <!-- Hand 1: Palm up explaining -->
    <path d="M 75 60 C 85 62 90 55 85 50" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand 2: Pointing forward to detail -->
    <path d="M 20 62 Q 5 65 0 60" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Speech/Narrative Flow Particles (Visualizing "Telling the process") -->
  <g fill="#38bdf8">
    <circle cx="118" cy="75" r="3" opacity="0.8"/>
    <circle cx="128" cy="65" r="4" opacity="0.9"/>
    <circle cx="124" cy="85" r="2" opacity="0.7"/>
    <path d="M 112 70 Q 116 68 120 72" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Foreground ambient lighting overlay -->
  <circle cx="100" cy="110" r="80" fill="url(#windowGlow)" style="mix-blend-mode: overlay;" pointer-events="none"/>
</svg>