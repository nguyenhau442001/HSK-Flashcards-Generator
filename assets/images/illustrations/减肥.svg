<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Scale Metallic Gradient -->
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Warm Glow / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Room Elements -->
  <!-- Ambient Wall Glow -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.05" />

  <!-- Window Frame Silhouette -->
  <rect x="160" y="30" width="50" height="70" rx="4" fill="#0f172a" opacity="0.6" />
  <rect x="165" y="35" width="18" height="28" rx="2" fill="#38bdf8" opacity="0.1" />
  <rect x="187" y="35" width="18" height="28" rx="2" fill="#38bdf8" opacity="0.1" />
  <rect x="165" y="67" width="18" height="28" rx="2" fill="#38bdf8" opacity="0.1" />
  <rect x="187" y="67" width="18" height="28" rx="2" fill="#38bdf8" opacity="0.1" />

  <!-- Potted Plant on Floor -->
  <path d="M210 170 L225 195 L195 195 Z" fill="#475569" filter="url(#shadow)" />
  <ellipse cx="210" cy="170" rx="15" ry="4" fill="#64748b" />
  <!-- Plant Leaves -->
  <path d="M210 166 Q200 140 185 130 Q205 145 210 166 Z" fill="url(#leafGrad)" />
  <path d="M213 166 Q225 135 235 125 Q220 145 213 166 Z" fill="url(#leafGrad)" />
  <path d="M210 166 Q210 130 210 115 Q210 135 210 166 Z" fill="url(#leafGrad)" />

  <!-- Floor Surface -->
  <path d="M0 195 L240 195 L240 240 L0 240 Z" fill="url(#floorGrad)" />
  <!-- Floor line perspective -->
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2" />

  <!-- MAIN SCENE: Bathroom/Fitness Corner -->

  <!-- Yoga Mat Rolled Out / Placed -->
  <path d="M30 185 C30 180 50 175 90 180 C130 185 150 190 150 195 C150 200 130 205 90 200 C50 195 30 190 30 185 Z" fill="#ec4899" opacity="0.8" filter="url(#shadow)" />
  <path d="M40 183 C40 179 60 175 95 178 C130 181 140 186 140 190 C140 194 130 198 95 195 C60 192 40 187 40 183 Z" fill="#f43f5e" />

  <!-- Dumbbells Prop -->
  <g transform="translate(45, 175) rotate(-15)" filter="url(#shadow)">
    <rect x="0" y="5" width="24" height="6" rx="3" fill="#64748b" />
    <circle cx="2" cy="8" r="7" fill="#fb923c" />
    <circle cx="22" cy="8" r="7" fill="#fb923c" />
  </g>

  <!-- Water Bottle Prop -->
  <g transform="translate(170, 150)" filter="url(#shadow)">
    <!-- Bottle body -->
    <path d="M6 15 L6 40 C6 43 9 45 12 45 L18 45 C21 45 24 43 24 40 L24 15 Z" fill="#38bdf8" opacity="0.9" />
    <!-- Bottle cap -->
    <rect x="10" y="8" width="10" height="7" rx="2" fill="#0284c7" />
    <rect x="12" y="5" width="6" height="3" rx="1" fill="#0f172a" />
    <!-- Highlight -->
    <path d="M8 18 L8 38" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- SMART DIGITAL SCALE (Main Focal Point) -->
  <g transform="translate(90, 135)" filter="url(#shadow)">
    <!-- Scale Outer Shadow Base -->
    <rect x="-2" y="-2" width="64" height="44" rx="12" fill="#0f172a" opacity="0.5" />
    
    <!-- Scale Body -->
    <rect x="0" y="0" width="60" height="40" rx="10" fill="url(#scaleGrad)" />
    <rect x="3" y="3" width="54" height="34" rx="8" fill="#f8fafc" />

    <!-- Scale Display Screen -->
    <rect x="15" y="8" width="30" height="14" rx="3" fill="#0f172a" />
    
    <!-- Digital Numbers (Stylized LED segments representing weight drop) -->
    <!-- '5' -->
    <path d="M19 11 L22 11 L22 13 L19 13 L19 16 L23 16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- '.' -->
    <circle cx="26" cy="18" r="1" fill="#38bdf8" />
    <!-- '6' -->
    <path d="M31 16 L29 16 L29 11 L32 11 L32 14 L29 14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- '5' -->
    <path d="M35 11 L38 11 L38 13 L35 13 L35 16 L39 16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Scale Metallic Corner Accents -->
    <circle cx="8" cy="30" r="3" fill="#cbd5e1" />
    <circle cx="52" cy="30" r="3" fill="#cbd5e1" />
    <circle cx="8" cy="10" r="3" fill="#cbd5e1" />
    <circle cx="52" cy="10" r="3" fill="#cbd5e1" />
  </g>

  <!-- Floating Achievement Elements (Action & Progress Concept) -->
  <!-- Glowing Arrow Down (Indicating weight loss/reduction) -->
  <g transform="translate(120, 70)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="16" fill="#10b981" opacity="0.2" />
    <circle cx="0" cy="0" r="12" fill="#10b981" />
    <path d="M0 -5 L0 5 M-4 1 L0 5 L4 1" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkles / Success indicators -->
  <g fill="#fbbf24">
    <!-- Sparkle 1 -->
    <path d="M75 80 Q75 70 65 70 Q75 70 75 60 Q75 70 85 70 Q75 70 75 80 Z" />
    <!-- Sparkle 2 -->
    <path d="M165 100 Q165 93 158 93 Q165 93 165 86 Q165 93 172 93 Q165 93 165 100 Z" />
    <!-- Sparkle 3 -->
    <path d="M100 50 Q100 45 95 45 Q100 45 100 40 Q100 45 105 45 Q100 45 100 50 Z" />
  </g>

  <!-- Cute Tape Measure (Curved around the scene context) -->
  <path d="M15 120 Q30 100 60 115" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" filter="url(#shadow)" />
  <!-- Tape measure ticks -->
  <path d="M22 117 L25 111" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <path d="M35 110 L39 105" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <path d="M48 111 L53 107" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

  <!-- Ambient light overlay for rich atmosphere -->
  <radialGradient id="lightGlow" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#lightGlow)" pointer-events="none" />
</svg>