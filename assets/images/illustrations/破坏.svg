<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Lightning Glow -->
    <radialGradient id="stormGlow" cx="60%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- House Wood/Brick Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#stormGlow)"/>

  <!-- Background Elements: Distant Hills & Stormy Wind Lines -->
  <path d="M0 180 Q60 165 120 180 T240 170 L240 240 L0 240 Z" fill="#0f172a" opacity="0.8"/>
  
  <!-- Wind / Rain Streaks (Atmospheric Depth) -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <line x1="20" y1="40" x2="60" y2="55"/>
    <line x1="80" y1="30" x2="120" y2="45"/>
    <line x1="140" y1="60" x2="180" y2="75"/>
    <line x1="40" y1="90" x2="90" y2="110"/>
    <line x1="160" y1="100" x2="210" y2="120"/>
    <line x1="10" y1="130" x2="50" y2="145"/>
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16"/>
  
  <!-- Flying Debris (Representing the chaotic destruction of the storm) -->
  <g filter="url(#shadow)">
    <!-- Roof Tile 1 -->
    <path d="M190 70 L210 75 L200 85 Z" fill="#991b1b" transform="rotate(25 200 78)"/>
    <!-- Wooden Plank -->
    <rect x="150" y="110" width="24" height="6" rx="2" fill="#b45309" transform="rotate(-40 162 113)"/>
    <!-- Roof Tile 2 -->
    <path d="M40 90 L60 95 L55 105 Z" fill="#7f1d1d" transform="rotate(-15 50 97)"/>
    <!-- Shrapnel / Leaf -->
    <path d="M70 150 Q80 145 75 160 Z" fill="#10b981" transform="rotate(60 75 152)"/>
  </g>

  <!-- Main Subject: The Damaged House ("Phá hoại") -->
  <g id="damaged-house" filter="url(#shadow)" transform="translate(15, 45)">
    
    <!-- Ground debris pile -->
    <path d="M30 145 Q50 135 80 145 Q110 135 140 145 Z" fill="#475569"/>

    <!-- House Base Walls (Leaning slightly or structurally damaged) -->
    <polygon points="35,70 125,60 130,140 30,140" fill="url(#wallGrad)"/>

    <!-- Wall Crack (Visualizing 'destruction') -->
    <path d="M70,70 L75,95 L65,110 L78,140" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M75,95 L90,105" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Broken Door (Off-hinge) -->
    <polygon points="70,100 95,105 92,140 68,140" fill="#78350f" transform="rotate(15 80 120)"/>
    <circle cx="85" cy="122" r="2" fill="#fbbf24"/>

    <!-- Broken/Shattered Window -->
    <g transform="translate(95, 75)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <!-- Shatter lines inside window frame -->
      <line x1="0" y1="0" x2="12" y2="15" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="22" y1="0" x2="12" y2="15" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="12" y1="15" x2="22" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <!-- Intact/Half Window -->
    <g transform="translate(42, 80)">
      <rect x="0" y="0" width="22" height="26" rx="2" fill="#38bdf8" fill-opacity="0.6" stroke="#475569" stroke-width="2"/>
      <line x1="11" y1="0" x2="11" y2="26" stroke="#475569" stroke-width="2"/>
      <line x1="0" y1="13" x2="22" y2="13" stroke="#475569" stroke-width="2"/>
    </g>

    <!-- Roof Structure (Collapsing / Damaged) -->
    <!-- Left solid roof part -->
    <polygon points="20,72 80,45 80,72" fill="url(#roofGrad)"/>
    
    <!-- Right collapsed/missing roof part -->
    <polygon points="80,45 140,65 125,60" fill="url(#roofGrad)"/>
    
    <!-- Exposed broken rafters sticking out -->
    <path d="M75,50 L95,30" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <path d="M85,48 L110,35" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <path d="M95,50 L125,40" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

    <!-- Missing roof gap area (dark void of destruction) -->
    <path d="M80,45 L115,62 L80,72 Z" fill="#0f172a"/>
  </g>

  <!-- Foreground Dynamic Elements: Severe Wind / Swirling Storm Vortex -->
  <g opacity="0.7">
    <path d="M 180 120 Q 210 100 220 70" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
    <path d="M 15 160 Q 50 170 70 150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dramatic Lightning Strike Bolt in Sky -->
  <g filter="url(#shadow)">
    <polygon points="170,10 150,55 168,55 145,105 185,45 162,45" fill="#fef08a"/>
  </g>

  <!-- Foreground Tree Bent Severely by Wind (Environmental Context) -->
  <g filter="url(#shadow)" transform="translate(15, 140)">
    <!-- Bent trunk -->
    <path d="M15,50 Q10,25 35,5 Q40,0 45,5 Q35,25 28,50 Z" fill="#78350f"/>
    <!-- Foliage whipped to the side -->
    <ellipse cx="40" cy="5" rx="18" ry="10" fill="#059669" transform="rotate(-30 40 5)"/>
    <ellipse cx="50" cy="12" rx="12" ry="8" fill="#10b981" transform="rotate(-15 50 12)"/>
  </g>

</svg>