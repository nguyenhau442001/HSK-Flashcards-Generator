<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric background lighting -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  <circle cx="120" cy="120" r="50" fill="#38bdf8" opacity="0.08" filter="blur(20px)"/>

  <!-- Shop Counter & Environment -->
  <path d="M20 185 L220 185 L230 215 L10 215 Z" fill="#334155"/>
  <path d="M20 185 L220 185 L220 192 L20 192 Z" fill="#475569"/>
  <rect x="35" y="195" width="25" height="12" rx="3" fill="#1e293b"/>
  <rect x="180" y="195" width="25" height="12" rx="3" fill="#1e293b"/>

  <!-- Action Papers Flying / Copied Effect -->
  <g opacity="0.85">
    <!-- Paper 1 (Background stack) -->
    <path d="M45 130 L75 115 L85 135 L55 150 Z" fill="#e2e8f0"/>
    <path d="M52 133 L70 124 M55 140 L73 131" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Paper 2 (Action flying out) -->
    <path d="M150 90 L185 70 L200 95 L165 115 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M160 88 L180 77 M163 97 L183 86 M166 106 L175 101" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Glowing Scan Light Ray Effect -->
    <polygon points="120,70 155,140 85,140" fill="#38bdf8" opacity="0.15"/>
  </g>

  <!-- Modern Photocopier Machine -->
  <g transform="translate(65, 55)">
    <!-- Machine Body Back/Bottom -->
    <rect x="10" y="45" width="90" height="85" rx="12" fill="#cbd5e1"/>
    <rect x="15" y="55" width="80" height="70" rx="8" fill="#e2e8f0"/>

    <!-- Paper Input/Output Trays -->
    <!-- Output Tray -->
    <path d="M8 115 L102 115 L112 135 L-2 135 Z" fill="#94a3b8"/>
    <rect x="25" y="122" width="60" height="8" rx="2" fill="#f8fafc"/>
    
    <!-- Side Paper Cassette -->
    <rect x="25" y="90" width="60" height="22" rx="4" fill="#cbd5e1"/>
    <circle cx="35" cy="101" r="3" fill="#64748b"/>

    <!-- Control Panel & Screen -->
    <rect x="62" y="65" width="26" height="20" rx="4" fill="#0f172a"/>
    <!-- Glowing Screen -->
    <rect x="65" y="68" width="14" height="10" rx="2" fill="#38bdf8"/>
    <!-- Buttons -->
    <circle cx="85" cy="71" r="2" fill="#10b981"/>
    <circle cx="85" cy="79" r="2" fill="#ef4444"/>

    <!-- Scanner Lid (Top) -->
    <path d="M5 40 L105 40 L98 52 L12 52 Z" fill="#64748b"/>
    <rect x="15" y="32" width="80" height="10" rx="3" fill="#475569"/>

    <!-- Glowing Glass Scan Bar Inside -->
    <rect x="20" y="50" width="70" height="3" fill="#38bdf8" filter="drop-shadow(0 0 4px #38bdf8)"/>

    <!-- Status Indicator LED -->
    <circle cx="22" cy="62" r="3" fill="#10b981"/>
  </g>

  <!-- Foreground Dynamic Elements / Additional Props -->
  <!-- Extra stacked papers on counter -->
  <g transform="translate(15, 145)">
    <rect x="0" y="15" width="35" height="25" rx="2" transform="rotate(-10 0 15)" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="5" y="10" width="35" height="25" rx="2" transform="rotate(-5 5 10)" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="8" y="5" width="35" height="25" rx="2" fill="#ffffff"/>
    <path d="M14 12 L31 12 M14 17 L31 17 M14 22 L24 22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Colorful binder clip -->
    <path d="M22 2 L26 2 L26 7 L22 7 Z" fill="#f59e0b"/>
    <circle cx="24" cy="2" r="2.5" fill="none" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Energy / Copy Action Sparkles -->
  <g transform="translate(180, 50)">
    <path d="M0 10 L4 4 L10 0 L4 -4 L0 -10 L-4 -4 L-10 0 L-4 4 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(45, 75)">
    <path d="M0 6 L2.4 2.4 L6 0 L2.4 -2.4 L0 -6 L-2.4 -2.4 L-6 0 L-2.4 2.4 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(135, 35)">
    <path d="M0 8 L3.2 3.2 L8 0 L3.2 -3.2 L0 -8 L-3.2 -3.2 L-8 0 L-3.2 3.2 Z" fill="#f472b6"/>
  </g>

</svg>