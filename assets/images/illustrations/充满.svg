<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Glass Cup -->
  <path d="M80 80 L160 80 L150 190 L90 190 Z" fill="#e2e8f0" fill-opacity="0.2"/>
  <path d="M80 80 L160 80 L150 190 L90 190 Z" stroke="#94a3b8" stroke-width="2" fill="none"/>
  
  <!-- Liquid (The "Full" aspect) -->
  <path d="M82 90 L158 90 L148 188 L92 188 Z" fill="#fbbf24"/>
  
  <!-- Bubbles -->
  <circle cx="100" cy="120" r="4" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="130" cy="150" r="6" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="115" cy="100" r="3" fill="#ffffff" fill-opacity="0.4"/>
  
  <!-- Reflective highlights -->
  <path d="M85 85 L100 85 L95 180 L85 180 Z" fill="#ffffff" fill-opacity="0.1"/>
  
  <!-- Surrounding props: A lemon slice -->
  <circle cx="180" cy="180" r="25" fill="#f59e0b"/>
  <circle cx="180" cy="180" r="20" fill="#fb923c"/>
  <path d="M180 160 L180 200 M160 180 L200 180" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Steam/Atmosphere -->
  <path d="M120 70 Q130 50 120 30" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M135 75 Q145 55 135 35" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>