<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Golden Glow for Wedding Arch -->
    <radialGradient id="golden-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Heart Gradient -->
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Suit Gradient (Groom) -->
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Soft Vignette Shadow -->
    <radialGradient id="floor-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient lighting / bokeh elements -->
  <circle cx="120" cy="110" r="100" fill="url(#golden-glow)"/>
  
  <circle cx="50" cy="60" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="70" cy="40" r="1.5" fill="#f43f5e" opacity="0.5"/>
  <circle cx="190" cy="50" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="210" cy="80" r="1.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="35" cy="120" r="1" fill="#fbbf24" opacity="0.5"/>
  <circle cx="205" cy="140" r="2" fill="#f43f5e" opacity="0.6"/>

  <!-- Floor reflection / base shadow -->
  <ellipse cx="120" cy="205" rx="75" ry="12" fill="url(#floor-shadow)"/>

  <!-- Archway / Wedding Backdrop Structure -->
  <path d="M70 195 L70 95 C70 65, 170 65, 170 95 L170 195" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <path d="M78 195 L78 98 C78 72, 162 72, 162 98 L162 195" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Floral Garland on Arch -->
  <path d="M65 110 Q120 70 175 110" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <!-- Flowers on Arch -->
  <circle cx="85" cy="95" r="5" fill="#f43f5e"/>
  <circle cx="105" cy="83" r="6" fill="#fbcfe8"/>
  <circle cx="120" cy="80" r="5.5" fill="#f43f5e"/>
  <circle cx="135" cy="83" r="6" fill="#fbcfe8"/>
  <circle cx="155" cy="95" r="5" fill="#f43f5e"/>
  <circle cx="72" cy="103" r="4" fill="#fbbf24"/>
  <circle cx="168" cy="103" r="4" fill="#fbbf24"/>

  <!-- Hanging string lights inside arch -->
  <path d="M90 90 Q120 115 150 90" fill="none" stroke="#64748b" stroke-width="1"/>
  <circle cx="105" cy="102" r="2.5" fill="#fbbf24"/>
  <circle cx="120" cy="107" r="2.5" fill="#fbbf24"/>
  <circle cx="135" cy="102" r="2.5" fill="#fbbf24"/>

  <!-- Floating Hearts (Celebrating the memory/past year: "last year") -->
  <g transform="translate(0, -5)">
    <path d="M120 50 C120 45, 126 40, 131 45 C136 40, 142 45, 142 50 C142 57, 131 63, 131 63 C131 63, 120 57, 120 50 Z" fill="url(#heart-grad)" transform="scale(0.8) translate(40, 10)" opacity="0.8"/>
    <path d="M120 50 C120 45, 126 40, 131 45 C136 40, 142 45, 142 50 C142 57, 131 63, 131 63 C131 63, 120 57, 120 50 Z" fill="url(#heart-grad)" transform="scale(0.6) translate(65, 30)" opacity="0.6"/>
  </g>

  <!-- COUPLE ILLUSTRATION -->
  
  <!-- GROOM (Left Side) -->
  <g id="groom">
    <!-- Groom Body & Suit -->
    <path d="M90 150 L102 150 L105 195 L87 195 Z" fill="url(#suit-grad)"/>
    <!-- White Shirt & Tie -->
    <polygon points="95,150 99,168 102,150" fill="#ffffff"/>
    <polygon points="97,156 99,165 101,156" fill="#38bdf8"/>
    <!-- Suit Lapels -->
    <path d="M95 150 L98 175 L90 195" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M102 150 L99 175 L106 195" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    
    <!-- Groom Head & Face -->
    <circle cx="96" cy="132" r="12" fill="#fcd34d"/> <!-- Skin -->
    <!-- Hair -->
    <path d="M84 132 C84 122, 92 120, 104 124 C108 126, 108 132, 108 132 L104 128 C98 125, 90 126, 86 132 Z" fill="#1e293b"/>
    <!-- Groom Smile (Looking at Bride) -->
    <path d="M98 135 C99 137, 101 137, 102 135" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Groom Eye (Closed happy crescent) -->
    <path d="M100 130 C102 131, 103 131, 104 130" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Groom Arm holding hands / around bride -->
    <path d="M100 155 Q115 155 120 162" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- BRIDE (Right Side) -->
  <g id="bride">
    <!-- Wedding Dress (A-Line Ballgown) -->
    <path d="M120 155 L150 155 L162 198 L110 198 Z" fill="#f8fafc"/>
    <!-- Dress Subtle Shading / Folds -->
    <path d="M135 155 L130 198" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M125 155 L118 198" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M145 155 L152 198" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Bride Torso & Neck -->
    <path d="M128 142 L142 142 L145 156 L125 156 Z" fill="#ffffff"/>
    <rect x="133" y="137" width="4" height="6" fill="#fcd34d"/>

    <!-- Bride Head & Face -->
    <circle cx="135" cy="128" r="12" fill="#fcd34d"/> <!-- Skin -->
    
    <!-- Elegant Updo Hair & Veil -->
    <circle cx="137" cy="122" r="8" fill="#334155"/> <!-- Bun -->
    <path d="M123 128 C123 120, 130 118, 142 124 C146 126, 146 132, 146 132 L140 128 C135 125, 128 126, 125 130 Z" fill="#334155"/>
    
    <!-- Veil (Translucent white overlay) -->
    <path d="M137 122 C150 120, 165 145, 155 185" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5" stroke-linecap="round"/>
    <path d="M137 122 C145 125, 155 140, 148 175" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round"/>

    <!-- Bride Face Details (Happy closed eyes, blushing cheeks) -->
    <path d="M132 126 C133 127, 134 127, 135 126" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M135 131 C136 133, 138 133, 139 131" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="130" cy="130" r="2" fill="#fda4af" opacity="0.6"/>

    <!-- Bride Arm / Holding Bouquet -->
    <path d="M135 155 Q125 160 120 162" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- INTERLOCKING HANDS & WEDDING RINGS GLOW -->
  <circle cx="120" cy="162" r="3.5" fill="#fbbf24"/>
  <circle cx="120" cy="162" r="5" fill="#f59e0b" opacity="0.4"/>

  <!-- WEDDING BOUQUET -->
  <g transform="translate(112, 158)">
    <circle cx="0" cy="0" r="9" fill="#f43f5e"/>
    <circle cx="-6" cy="-4" r="6" fill="#fb7185"/>
    <circle cx="6" cy="-4" r="6" fill="#f43f5e"/>
    <circle cx="0" cy="-8" r="6" fill="#fbcfe8"/>
    <!-- Stem wrap -->
    <path d="M-2 5 L2 12 L-1 12 Z" fill="#10b981"/>
    <path d="M-4 9 L4 9" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- FOREGROUND PROPS & DETAILS -->
  <!-- Wooden Platform / Stage Floor -->
  <path d="M40 195 L200 195 L210 215 L30 215 Z" fill="#334155" opacity="0.8"/>
  <path d="M30 195 L210 195" stroke="#475569" stroke-width="2"/>

  <!-- Potted Plant Left -->
  <g transform="translate(50, 175)">
    <path d="M-8 20 L8 20 L5 38 L-5 38 Z" fill="#64748b"/>
    <!-- Leaves -->
    <path d="M0 20 Q-15 0 -25 10 Q-10 15 0 20 Z" fill="#10b981"/>
    <path d="M0 20 Q-5 -10 -2 -15 Q2 -5 0 20 Z" fill="#059669"/>
    <path d="M0 20 Q15 0 22 12 Q10 16 0 20 Z" fill="#34d399"/>
  </g>

  <!-- Gift Box Right (Representing celebration/wedding event) -->
  <g transform="translate(175, 185)">
    <rect x="0" y="0" width="18" height="15" rx="2" fill="#ec4899"/>
    <rect x="-2" y="-3" width="22" height="4" rx="1" fill="#f43f5e"/>
    <!-- Ribbon -->
    <rect x="7" y="0" width="4" height="15" fill="#fbbf24"/>
    <path d="M9 -3 C7 -8, 4 -5, 9 -3 C14 -5, 11 -8, 9 -3 Z" fill="#fbbf24"/>
  </g>

  <!-- Sparkles / Celebration Confetti -->
  <path d="M75 145 L77 150 L82 152 L77 154 L75 159 L73 154 L68 152 L73 150 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M165 130 L166 133 L169 134 L166 135 L165 138 L164 135 L161 134 L164 133 Z" fill="#38bdf8" opacity="0.9"/>
  <path d="M150 175 L151 177 L153 178 L151 179 L150 181 L149 179 L147 178 L149 177 Z" fill="#f43f5e" opacity="0.8"/>
  <path d="M90 180 L91 182 L93 183 L91 184 L90 186 L89 184 L87 183 L89 182 Z" fill="#34d399" opacity="0.7"/>

  <!-- Subtle vignette frame overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>