<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Window/Sky Background -->
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.2"/>
  <path d="M0 180 Q 120 150 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Desk and Props -->
  <rect x="20" y="150" width="200" height="10" rx="2" fill="#475569"/>
  <rect x="40" y="160" width="10" height="80" fill="#334155"/>
  <rect x="190" y="160" width="10" height="80" fill="#334155"/>
  
  <!-- Paper Airplane (The Dream) -->
  <path d="M120 120 L 160 110 L 130 150 Z" fill="#f59e0b"/>
  <path d="M120 120 L 160 110 L 135 125 Z" fill="#fb923c"/>
  
  <!-- Character -->
  <g transform="translate(60, 100)">
    <!-- Body -->
    <path d="M20 120 Q 40 80 80 120" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <rect x="30" y="80" width="40" height="50" rx="10" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="50" cy="60" r="20" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="42" cy="55" r="3" fill="#0f172a"/>
    <circle cx="58" cy="55" r="3" fill="#0f172a"/>
    <!-- Hair -->
    <path d="M35 50 Q 50 30 65 50" fill="#fb923c"/>
  </g>
  
  <!-- Model Plane on Desk -->
  <g transform="translate(160, 160) scale(0.5)">
    <rect x="0" y="0" width="60" height="10" rx="2" fill="#94a3b8"/>
    <rect x="20" y="-10" width="20" height="30" rx="2" fill="#94a3b8"/>
  </g>
  
  <!-- Floating Stars/Dreams -->
  <circle cx="140" cy="80" r="2" fill="#fbbf24"/>
  <circle cx="170" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="190" cy="90" r="2" fill="#fbbf24"/>
</svg>