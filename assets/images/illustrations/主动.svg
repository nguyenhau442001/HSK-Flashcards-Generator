<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with rounded corners -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Ambient background lighting / office environment -->
  <rect x="24" y="24" width="192" height="150" rx="16" fill="#1e293b"/>
  <path d="M 24 134 L 216 134" stroke="#334155" stroke-width="2"/>

  <!-- Window showing night/evening cityscape outside -->
  <rect x="150" y="38" width="52" height="65" rx="8" fill="#090d16"/>
  <rect x="158" y="46" width="16" height="24" rx="2" fill="#38bdf8" fill-opacity="0.2"/>
  <rect x="178" y="46" width="16" height="24" rx="2" fill="#38bdf8" fill-opacity="0.3"/>
  <rect x="158" y="74" width="16" height="22" rx="2" fill="#38bdf8" fill-opacity="0.4"/>
  <rect x="178" y="74" width="16" height="22" rx="2" fill="#38bdf8" fill-opacity="0.2"/>

  <!-- Bookshelf / plant details -->
  <rect x="36" y="38" width="40" height="6" rx="3" fill="#334155"/>
  <rect x="42" y="44" width="8" height="20" rx="1" fill="#38bdf8"/>
  <rect x="52" y="42" width="10" height="22" rx="1" fill="#f59e0b"/>
  <rect x="64" y="46" width="6" height="18" rx="1" fill="#ec4899"/>
  <!-- Potted plant -->
  <path d="M 115 58 L 125 58 L 128 66 L 112 66 Z" fill="#64748b"/>
  <path d="M 120 58 C 115 50, 110 44, 115 38 C 120 44, 125 50, 120 58 Z" fill="#10b981"/>
  <path d="M 118 58 C 124 50, 130 46, 128 40 C 122 46, 116 52, 118 58 Z" fill="#059669"/>

  <!-- Work Desk -->
  <path d="M 40 134 L 200 134 L 210 160 L 30 160 Z" fill="#334155"/>
  <rect x="30" y="156" width="180" height="6" rx="3" fill="#475569"/>

  <!-- Desk Props: Laptop, Lamp, Coffee Mug, Sticky notes -->
  <!-- Laptop -->
  <path d="M 55 134 L 95 134 L 100 120 L 50 120 Z" fill="#64748b"/>
  <rect x="53" y="116" width="45" height="28" rx="3" fill="#cbd5e1"/>
  <rect x="56" y="119" width="39" height="22" rx="1" fill="#0f172a"/>
  <!-- Code/Chart lines on laptop screen -->
  <path d="M 60 124 H 75 M 60 129 H 85 M 60 134 H 70" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Mug -->
  <rect x="175" y="122" width="12" height="14" rx="2" fill="#fb923c"/>
  <path d="M 187 125 C 191 125, 191 133, 187 133" stroke="#fb923c" stroke-width="2" fill="none"/>

  <!-- Extra proactive idea board / glowing sticky notes -->
  <rect x="135" y="110" width="16" height="16" rx="2" fill="#facc15" transform="rotate(12 135 110)"/>
  <rect x="154" y="108" width="16" height="16" rx="2" fill="#fb7185" transform="rotate(-8 154 108)"/>

  <!-- Desk Lamp illuminating the scene -->
  <path d="M 195 134 L 190 90 L 198 90 L 203 134 Z" fill="#94a3b8"/>
  <path d="M 182 86 C 182 78, 204 78, 204 86 Z" fill="#f59e0b"/>
  <!-- Light beam cone -->
  <polygon points="193,86 110,134 230,134" fill="#f59e0b" fill-opacity="0.12"/>

  <!-- MAIN CHARACTER: Proactive worker standing enthusiastically, pointing/explaining actively -->
  <!-- Chair pushed back -->
  <path d="M 95 140 L 115 140 L 110 162 L 90 162 Z" fill="#1e293b"/>
  <ellipse cx="102" cy="162" rx="14" ry="4" fill="#0f172a"/>

  <!-- Character Legs -->
  <rect x="100" y="145" width="8" height="35" rx="3" fill="#3b82f6"/>
  <rect x="115" y="145" width="8" height="35" rx="3" fill="#3b82f6"/>
  <!-- Shoes -->
  <path d="M 95 180 H 108 C 111 180, 111 176, 107 176 H 95 Z" fill="#1e293b"/>
  <path d="M 115 180 H 128 C 131 180, 131 176, 127 176 H 115 Z" fill="#1e293b"/>

  <!-- Character Torso & Shirt -->
  <path d="M 92 105 L 132 105 L 138 148 L 86 148 Z" fill="#f8fafc"/>
  <!-- Tie / Details -->
  <polygon points="112,105 116,105 118,125 112,130 106,125 108,105" fill="#ef4444"/>

  <!-- Character Head & Hair -->
  <circle cx="112" cy="85" r="16" fill="#fde047"/>
  <!-- Stylish hair -->
  <path d="M 96 85 C 96 72, 106 68, 116 70 C 126 72, 130 80, 128 86 C 122 80, 102 80, 96 85 Z" fill="#334155"/>

  <!-- Energetic Face expression (smiling, motivated eyes) -->
  <circle cx="107" cy="84" r="2" fill="#1e293b"/>
  <circle cx="117" cy="84" r="2" fill="#1e293b"/>
  <path d="M 109 90 Q 112 94 115 90" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Arms depicting proactive gesture (one arm raised confidently, pointing at innovative ideas) -->
  <!-- Left arm (bent, hand on hip or supporting) -->
  <path d="M 88 110 L 76 130 L 84 134 L 92 115 Z" fill="#f8fafc"/>
  <circle cx="75" cy="132" r="5" fill="#fde047"/>

  <!-- Right arm (actively pointing up/forward with confidence) -->
  <path d="M 130 108 L 150 92 L 155 98 L 136 118 Z" fill="#f8fafc"/>
  <circle cx="153" cy="95" r="5" fill="#fde047"/>

  <!-- Spark / Energy icons highlighting "proactive initiative" (主动) -->
  <g transform="translate(165, 75)">
    <path d="M 0 10 L 5 5 L 0 0 L -5 5 Z" fill="#38bdf8"/>
    <circle cx="12" cy="-4" r="3" fill="#f59e0b"/>
    <path d="M 10 15 L 14 12 L 10 9 L 6 12 Z" fill="#10b981"/>
  </g>

  <!-- Floor shadow -->
  <ellipse cx="112" cy="186" rx="55" ry="6" fill="#020617" fill-opacity="0.6"/>
</svg>