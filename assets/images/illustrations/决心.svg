<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Determination Aura Gradient -->
    <linearGradient id="auraGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Room Interior & Window -->
  <g id="environment">
    <!-- Bookshelf background silhouette -->
    <rect x="25" y="45" width="40" height="95" fill="#1e293b" opacity="0.6"/>
    <rect x="30" y="55" width="30" height="4" fill="#334155" opacity="0.6"/>
    <rect x="30" y="75" width="30" height="4" fill="#334155" opacity="0.6"/>
    <rect x="30" y="95" width="30" height="4" fill="#334155" opacity="0.6"/>
    <!-- Books on shelf -->
    <rect x="33" y="60" width="6" height="15" fill="#f43f5e" rx="1"/>
    <rect x="41" y="58" width="8" height="17" fill="#10b981" rx="1"/>
    <rect x="52" y="62" width="5" height="13" fill="#fbbf24" rx="1"/>

    <!-- Window with night city skyline silhouette -->
    <rect x="150" y="30" width="60" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <!-- City buildings inside window -->
    <rect x="155" y="70" width="12" height="45" fill="#1e293b"/>
    <rect x="169" y="60" width="15" height="55" fill="#1a233a"/>
    <rect x="186" y="75" width="18" height="40" fill="#1e293b"/>
    <!-- City lights -->
    <circle cx="161" cy="78" r="1" fill="#fbbf24"/>
    <circle cx="165" cy="85" r="1" fill="#fbbf24"/>
    <circle cx="175" cy="70" r="1" fill="#38bdf8"/>
    <circle cx="180" cy="90" r="1" fill="#fbbf24"/>
    <circle cx="192" cy="82" r="1" fill="#38bdf8"/>

    <!-- Window Light Beam -->
    <polygon points="150,30 210,30 235,160 120,160" fill="url(#windowLight)"/>

    <!-- Room Flooring & Desk Setup -->
    <!-- Large sturdy desk -->
    <rect x="20" y="150" width="200" height="12" fill="#334155" rx="3"/>
    <rect x="35" y="162" width="15" height="68" fill="#1e293b"/>
    <rect x="190" y="162" width="15" height="68" fill="#1e293b"/>

    <!-- Desk Lamp -->
    <path d="M 50,150 L 55,120 L 60,120 L 55,150 Z" fill="#64748b"/>
    <path d="M 42,122 C 42,112 52,108 62,115 C 67,118 70,125 70,125 Z" fill="#475569"/>
    <!-- Lamp Light Cone -->
    <polygon points="45,123 65,123 90,195 20,195" fill="url(#lampGlow)" opacity="0.6"/>

    <!-- Laptop / Blueprint props on desk -->
    <rect x="75" y="138" width="45" height="12" rx="2" fill="#64748b"/>
    <polygon points="70,150 125,150 135,162 60,162" fill="#475569"/>
    <!-- Screen content: planning graphs -->
    <path d="M 80,144 L 88,141 L 95,145 L 105,139 L 115,142" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

    <!-- Coffee Mug -->
    <rect x="180" y="134" width="12" height="16" rx="2" fill="#f8fafc"/>
    <path d="M 192,138 C 196,138 196,146 192,146" stroke="#f8fafc" stroke-width="2" fill="none"/>
  </g>

  <!-- DETERMINATION / RESOLVE AURA EFFECT ("下很大的决心") -->
  <!-- Radiating powerful energetic fields around the character to show extreme mental resolve -->
  <g id="determination-aura">
    <!-- Rising energy waves -->
    <path d="M 80,130 C 70,100 90,80 100,60" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 160,130 C 170,100 150,80 140,60" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    
    <!-- Focus glowing particles / sparks -->
    <circle cx="105" cy="75" r="3" fill="#fbbf24"/>
    <circle cx="135" cy="70" r="2" fill="#38bdf8"/>
    <circle cx="95" cy="95" r="2" fill="#fb923c"/>
    <circle cx="145" cy="90" r="3" fill="#f59e0b"/>

    <!-- Upward directional arrows of determination (stylized energy lines) -->
    <path d="M 120,110 L 120,70 M 115,75 L 120,67 L 125,75" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- MAIN CHARACTER: Deeply Focused, Strong Posture -->
  <g id="character">
    <!-- Torso leaning forward with fierce intent -->
    <path d="M 95,150 C 95,130 110,115 120,115 C 130,115 145,130 145,150 Z" fill="url(#shirtGrad)"/>
    
    <!-- Collar -->
    <path d="M 110,115 L 120,125 L 130,115" stroke="#f8fafc" stroke-width="2" fill="none"/>

    <!-- Head & Face (Determined expression) -->
    <circle cx="120" cy="92" r="18" fill="#ffedd5"/>
    
    <!-- Hair (Styled neat modern cut) -->
    <path d="M 102,90 C 102,78 110,72 122,72 C 134,72 138,80 138,92 L 138,95 L 102,95 Z" fill="#1e293b"/>
    <path d="M 102,85 L 108,78 L 116,83" fill="#1e293b"/>

    <!-- Fierce Confident Eyebrows (Slanted down for determination) -->
    <path d="M 108,87 L 116,90" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 124,90 L 132,87" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Focused Eyes -->
    <circle cx="112" cy="93" r="1.5" fill="#1e293b"/>
    <circle cx="128" cy="93" r="1.5" fill="#1e293b"/>

    <!-- Determined Firm Mouth (Straight line / slight grimace of resolve) -->
    <path d="M 116,102 L 124,102" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>

    <!-- Robust Arms & Clenched Fists (Demonstrating "Hà quyết tâm") -->
    <!-- Left Arm & Fist resting/slamming on desk -->
    <path d="M 100,125 L 85,138 L 95,145" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="93" cy="145" r="7" fill="#ffedd5"/> <!-- Clenched fist -->

    <!-- Right Arm & Fist firmly clenched near chest -->
    <path d="M 140,125 L 150,135 L 140,145" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="138" cy="146" r="7" fill="#ffedd5"/> <!-- Clenched fist -->
  </g>

  <!-- Foreground details to create depth -->
  <g id="foreground-elements">
    <!-- Open Notebook with ambitious plans/sketches -->
    <path d="M 130,148 L 175,145 L 178,162 L 133,165 Z" fill="#f8fafc"/>
    <line x1="154" y1="146" x2="155" y2="164" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Scribbled goals/graphs -->
    <line x1="138" y1="153" x2="148" y2="151" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <line x1="138" y1="158" x2="145" y2="156" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="151" x2="170" y2="155" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>