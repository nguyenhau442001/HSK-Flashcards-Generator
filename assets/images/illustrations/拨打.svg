<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Character (Upper body) -->
  <g transform="translate(40, 60)">
    <circle cx="60" cy="40" r="25" fill="#fde68a"/>
    <path d="M45 45 Q60 55 75 45" stroke="#78350f" stroke-width="2" fill="none"/>
    <circle cx="52" cy="35" r="3" fill="#78350f"/>
    <circle cx="68" cy="35" r="3" fill="#78350f"/>
    <path d="M30 80 Q60 60 90 80 L80 120 L40 120 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Smartphone -->
  <g transform="translate(130, 100) rotate(15)">
    <rect width="60" height="110" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
    <rect x="5" y="10" width="50" height="80" rx="4" fill="#0f172a"/>
    <!-- Keypad Dots -->
    <circle cx="20" cy="30" r="4" fill="#fb923c"/>
    <circle cx="30" cy="30" r="4" fill="#fb923c"/>
    <circle cx="40" cy="30" r="4" fill="#fb923c"/>
    <circle cx="20" cy="45" r="4" fill="#fb923c"/>
    <circle cx="30" cy="45" r="4" fill="#fb923c"/>
    <circle cx="40" cy="45" r="4" fill="#fb923c"/>
    <circle cx="30" cy="60" r="6" fill="#10b981"/>
  </g>
  
  <!-- Hand interacting -->
  <path d="M120 130 L140 120 L150 140 L130 150 Z" fill="#fde68a"/>
  
  <!-- Decorative elements -->
  <circle cx="190" cy="40" r="15" fill="#ec4899" opacity="0.3"/>
