<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window City Glow Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Sound Wave Gradient for Ringing -->
    <linearGradient id="soundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Phone Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Wallpaper Pattern / Accent Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="40" x2="240" y2="40" />
    <line x1="0" y1="80" x2="240" y2="80" />
    <line x1="0" y1="120" x2="240" y2="120" />
  </g>

  <!-- Window Frame in Background -->
  <rect x="150" y="20" width="70" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="154" y="24" width="62" height="82" rx="4" fill="url(#windowGlow)" />
  <!-- City Skyline Silhouette through Window -->
  <path d="M154 85 L162 70 L170 78 L180 60 L190 75 L200 65 L216 90 L216 106 L154 106 Z" fill="#1e293b" opacity="0.6"/>
  <!-- Window Panes Grid -->
  <line x1="185" y1="24" x2="185" y2="106" stroke="#334155" stroke-width="2"/>
  <line x1="154" y1="65" x2="216" y2="65" stroke="#334155" stroke-width="2"/>

  <!-- Bookshelf on Wall -->
  <rect x="20" y="30" width="80" height="8" rx="2" fill="#475569"/>
  <path d="M30 15 L38 30 L22 30 Z" fill="#f43f5e"/>
  <rect x="42" y="12" width="10" height="18" rx="2" fill="#38bdf8"/>
  <rect x="54" y="16" width="14" height="14" rx="2" fill="#10b981"/>

  <!-- Desk Surface -->
  <path d="M10 170 L230 170 L230 220 L10 220 Z" fill="#334155" filter="url(#shadow)"/>
  <path d="M10 166 L230 166 L230 172 L10 172 Z" fill="#475569"/>

  <!-- Desk Lamp -->
  <path d="M190 170 L195 120 L205 120 L210 170 Z" fill="#64748b"/>
  <path d="M185 110 C185 95 215 95 215 110 Z" fill="#f59e0b"/>
  <circle cx="200" cy="115" r="45" fill="url(#lampGlow)" style="mix-blend-mode: screen;" />

  <!-- Coffee Mug -->
  <rect x="155" y="140" width="18" height="26" rx="4" fill="#cbd5e1"/>
  <path d="M173 145 C180 145 180 159 173 159" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <!-- Steam from mug -->
  <path d="M161 132 C164 126 158 122 161 116" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- CHARACTER -->
  <!-- Character Body / Torso (Sitting behind desk) -->
  <path d="M60 170 C60 140 100 140 100 170 Z" fill="#4f46e5"/>
  <circle cx="80" cy="118" r="22" fill="#fcd34d" filter="url(#shadow)"/> <!-- Head -->
  
  <!-- Hair -->
  <path d="M60 115 C60 98 100 98 100 115 C100 125 90 120 80 120 C70 120 60 125 60 115 Z" fill="#1e293b"/>

  <!-- Surprised Face Expressions -->
  <!-- Eyes wide open -->
  <circle cx="73" cy="118" r="3.5" fill="#1e293b"/>
  <circle cx="87" cy="118" r="3.5" fill="#1e293b"/>
  <!-- Eyebrows raised -->
  <path d="M70 111 Q73 108 76 111" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M84 111 Q87 108 90 111" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Shocked Open Mouth -->
  <ellipse cx="80" cy="128" rx="4" ry="5" fill="#1e293b"/>

  <!-- Character Arms reacting to the ring -->
  <!-- Left arm reaching/gesturing -->
  <path d="M62 150 L45 135 L38 145" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="38" cy="145" r="5" fill="#fcd34d"/>

  <!-- FOREGROUND: TELEPHONE & RINGING ACTION (THE TARGET "铃") -->
  <!-- Old-school / Modern Desk Telephone -->
  <g transform="translate(90, 125)">
    <!-- Phone Base -->
    <rect x="0" y="20" width="45" height="30" rx="8" fill="#ec4899" filter="url(#shadow)"/>
    <rect x="6" y="26" width="33" height="18" rx="4" fill="#fbcfe8"/>
    <!-- Keypad Dots -->
    <circle cx="14" cy="32" r="2" fill="#be185d"/>
    <circle cx="22" cy="32" r="2" fill="#be185d"/>
    <circle cx="30" cy="32" r="2" fill="#be185d"/>
    <circle cx="14" cy="39" r="2" fill="#be185d"/>
    <circle cx="22" cy="39" r="2" fill="#be185d"/>
    <circle cx="30" cy="39" r="2" fill="#be185d"/>

    <!-- Glowing Screen on Phone (Ringing indicator) -->
    <rect x="12" y="5" width="21" height="12" rx="2" fill="url(#screenGlow)" />

    <!-- Telephone Handset (Vibrating / Ringing offset) -->
    <g transform="translate(-2, -8)">
      <!-- Handset Body -->
      <path d="M-2 15 C-2 5 47 5 47 15 C47 18 43 18 43 15 C43 9 2 9 2 15 C2 18 -2 18 -2 15 Z" fill="#db2777" filter="url(#shadow)"/>
      <!-- Handset Earpiece/Mouthpiece caps -->
      <rect x="-4" y="10" width="8" height="10" rx="3" fill="#be185d"/>
      <rect x="41" y="10" width="8" height="10" rx="3" fill="#be185d"/>
      
      <!-- Cords / Connection -->
      <path d="M 6 20 Q -5 30 -5 45" stroke="#ec4899" stroke-width="3" fill="none"/>
    </g>

    <!-- RINGING SOUND WAVES & BELL VIBRATION VISUALS (Explicitly illustrating "铃" / Ringing) -->
    <!-- Left Sound Waves -->
    <path d="M -10 0 C -15 5 -15 15 -10 20" stroke="url(#soundGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M -18 -4 C -26 4 -26 16 -18 24" stroke="url(#soundGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Right Sound Waves -->
    <path d="M 55 0 C 60 5 60 15 55 20" stroke="url(#soundGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 63 -4 C 71 4 71 16 63 24" stroke="url(#soundGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Dynamic Ring Sparks / Action Lines -->
    <circle cx="-14" cy="-5" r="2.5" fill="#f59e0b"/>
    <path d="M -8 -12 L -12 -16" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    
    <circle cx="59" cy="-5" r="2.5" fill="#f59e0b"/>
    <path d="M 53 -12 L 57 -16" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    
    <path d="M 22 -18 L 22 -24" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Additional interior details for immersion -->
  <!-- Plant on Desk Corner -->
  <path d="M205 170 L210 148 L225 148 L230 170 Z" fill="#059669"/>
  <circle cx="217" cy="144" r="12" fill="#10b981"/>
  <circle cx="208" cy="138" r="9" fill="#34d399"/>
  <circle cx="224" cy="136" r="10" fill="#34d399"/>
</svg>