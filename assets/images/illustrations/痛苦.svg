<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Background Elements -->
  <!-- Floor -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16"/>
  
  <!-- Back Wall & Wallpaper Accents -->
  <line x1="60" y1="0" x2="60" y2="190" stroke="#162032" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="180" y1="0" x2="180" y2="190" stroke="#162032" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Window Frame -->
  <rect x="150" y="40" width="60" height="80" rx="4" fill="#0b1323" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="40" x2="180" y2="120" stroke="#334155" stroke-width="1.5"/>
  <line x1="150" y1="80" x2="210" y2="80" stroke="#334155" stroke-width="1.5"/>
  <!-- Moonlight beam -->
  <polygon points="150,80 210,80 230,190 120,190" fill="url(#window-light)"/>

  <!-- Bookshelf Background Props -->
  <rect x="25" y="50" width="45" height="110" fill="#111827" rx="2"/>
  <line x1="25" y1="85" x2="70" y2="85" stroke="#1f293d" stroke-width="2"/>
  <line x1="25" y1="125" x2="70" y2="125" stroke="#1f293d" stroke-width="2"/>
  <!-- Books -->
  <rect x="30" y="65" width="8" height="20" fill="#3b82f6" rx="1"/>
  <rect x="40" y="62" width="10" height="23" fill="#ef4444" rx="1"/>
  <rect x="52" y="67" width="12" height="18" fill="#10b981" rx="1"/>
  <rect x="30" y="102" width="14" height="23" fill="#f59e0b" rx="1"/>
  <rect x="47" y="105" width="8" height="20" fill="#8b5cf6" rx="1"/>

  <!-- Wooden Desk -->
  <g filter="url(#shadow)">
    <!-- Desk Top -->
    <path d="M50,150 L190,150 L200,165 L40,165 Z" fill="#b45309"/>
    <!-- Desk Front Face -->
    <rect x="40" y="165" width="160" height="15" fill="#92400e"/>
    <!-- Desk Legs -->
    <rect x="55" y="180" width="8" height="35" fill="#78350f"/>
    <rect x="177" y="180" width="8" height="35" fill="#78350f"/>
  </g>

  <!-- Desk Props (Messy environment indicating heavy stress/long work) -->
  <!-- Laptop Open -->
  <path d="M75,145 L115,145 L120,152 L70,152 Z" fill="#64748b"/>
  <path d="M73,152 L117,152 L122,154 L68,154 Z" fill="#475569"/>
  <rect x="80" y="125" width="30" height="20" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <!-- Glowing screen line representing late-night work -->
  <line x1="85" y1="132" x2="105" y2="132" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="138" x2="98" y2="138" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stack of Papers / Documents -->
  <rect x="135" y="142" width="32" height="10" rx="1" fill="#cbd5e1" transform="rotate(-5 135 142)"/>
  <rect x="133" y="146" width="35" height="10" rx="1" fill="#e2e8f0" transform="rotate(2 133 146)"/>
  
  <!-- Coffee Mug -->
  <rect x="175" y="135" width="12" height="15" rx="2" fill="#f8fafc"/>
  <path d="M187,138 C192,138 192,146 187,146" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <!-- Steam lines -->
  <path d="M178,128 C180,125 178,122 181,119" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Character: Burdened, Exhausted, Experiencing "痛苦" (Pain/Suffering/Hardship) -->
  <g id="suffering-character" filter="url(#shadow)">
    <!-- Chair Back -->
    <rect x="95" y="95" width="30" height="65" rx="6" fill="#334155"/>
    <rect x="100" y="105" width="20" height="45" rx="3" fill="#1e293b"/>

    <!-- Hunched Torso -->
    <path d="M95,125 C105,120 120,130 125,155 L95,155 Z" fill="#1d4ed8"/>

    <!-- Crossed Arms on Desk hiding face / expressing sorrow -->
    <!-- Lower Arm / Forearms resting on desk -->
    <path d="M85,145 Q110,135 135,145" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Hands clasped / near head -->
    <circle cx="110" cy="132" r="7" fill="#fca5a5"/>

    <!-- Drooped Head / Face buried in arms -->
    <circle cx="112" cy="122" r="13" fill="#fca5a5"/>
    <!-- Messy Hair over slumped head -->
    <path d="M98,120 C100,112 110,110 122,115 C125,120 125,125 125,125 C115,118 105,118 98,120 Z" fill="#1e293b"/>

    <!-- Slumped Shoulders / Upper Back -->
    <path d="M92,122 C100,115 118,118 126,132 C126,132 110,128 92,122 Z" fill="#2563eb"/>
  </g>

  <!-- Atmospheric / Emotional Elements (Subtle visual cues of mental weight/pain) -->
  <!-- Shadow overlay on character/desk to convey heavy emotional burden -->
  <path d="M90,110 Q120,100 140,120 Q120,135 90,110 Z" fill="#000000" opacity="0.25"/>

</svg>