<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>
  
  <!-- Motion arc for wiping/cleaning action -->
  <path d="M 60 115 A 50 25 0 0 1 140 115" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 6" opacity="0.6"/>
  
  <!-- Sparkles indicating cleanliness -->
  <path d="M 130 50 L 133 58 L 141 61 L 133 64 L 130 72 L 127 64 L 119 61 L 127 58 Z" fill="#f59e0b"/>
  <path d="M 65 65 L 67 70 L 72 72 L 67 74 L 65 79 L 63 74 L 58 72 L 63 70 Z" fill="#f59e0b" transform="scale(0.8) translate(20, -10)"/>

  <!-- Surface being cleaned (a sleek tablet/glass pane) -->
  <rect x="45" y="125" width="110" height="12" rx="6" fill="#334155" />
  
  <!-- The Sponge / Eraser Tool (representing 'lau, chùi') -->
  <g transform="rotate(-15 100 95)">
    <!-- Sponge handle/top -->
    <rect x="70" y="70" width="60" height="20" rx="6" fill="#475569" />
    
    <!-- Sponge absorbing base -->
    <rect x="65" y="90" width="70" height="22" rx="8" fill="#38bdf8" />
    
    <!-- Dynamic wipe streak on the sponge -->
    <rect x="75" y="96" width="50" height="8" rx="4" fill="#e0f2fe" opacity="0.6"/>
  </g>
</svg>