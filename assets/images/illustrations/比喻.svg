<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk and Environment -->
  <rect x="30" y="140" width="180" height="10" fill="#334155" rx="2"/>
  <rect x="40" y="150" width="10" height="80" fill="#475569"/>
  <rect x="190" y="150" width="10" height="80" fill="#475569"/>
  
  <!-- Teacher Character -->
  <circle cx="180" cy="100" r="25" fill="#fde68a"/>
  <path d="M165 115 Q180 125 195 115" stroke="#92400e" stroke-width="2" fill="none"/>
  <circle cx="172" cy="95" r="3" fill="#475569"/>
  <circle cx="188" cy="95" r="3" fill="#475569"/>
  <path d="M160 130 L150 180 M200 130 L210 180" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Student Character -->
  <circle cx="60" cy="110" r="20" fill="#bae6fd"/>
  <path d="M50 105 Q60 115 70 105" stroke="#0c4a6e" stroke-width="2" fill="none"/>
  <circle cx="55" cy="105" r="2" fill="#0c4a6e"/>
  <circle cx="65" cy="105" r="2" fill="#0c4a6e"/>
  
  <!-- The Metaphor Visualization (The "Vivid" Comparison) -->
  <!-- A glowing lightbulb (idea) being compared to a sun -->
  <g transform="translate(120, 80)">
    <circle cx="0" cy="0" r="20" fill="#fbbf24" opacity="0.3"/>
    <path d="M-5 -10 A10 10 0 0 1 5 -10 L8 5 A5 5 0 0 1 -8 5 Z" fill="#fb923c"/>
    <rect x="-2" y="5" width="4" height="6" fill="#fb923c"/>
    <path d="M-15 -15 L-20 -20 M15 -15 L20 -20 M0 -25 L0 -30 M-20 0 L-25 0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Book on desk -->
  <rect x="80" y="145" width="40" height="30" fill="#ec4899" rx="2"/>
  <path d="M85 150 L115 150 M85 160 L115 160 M85 170 L115 170" stroke="#fce7f3" stroke-width="2"/>
  
  <!-- Floating sparkles of "vividness" -->
  <circle cx="140" cy="50" r="3" fill="#10b981"/>
  <circle cx="160" cy="40" r="2" fill="#38bdf8"/>
  <circle cx="100" cy="60" r="2" fill="#fb923c"/>
</svg>