<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light / Magic Beam -->
    <linearGradient id="lightBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Mailbox Body Gradient -->
    <linearGradient id="mailboxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Envelope Gradient -->
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Letter Flap Gradient -->
    <linearGradient id="envFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#030712" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting (Ambient glow from receiving action) -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.07" filter="url(#glow)"/>
  <circle cx="120" cy="110" r="40" fill="#fbbf24" opacity="0.1" filter="url(#glow)"/>

  <!-- Light beam coming from above -->
  <polygon points="90,30 150,30 180,140 60,140" fill="url(#lightBeam)"/>

  <!-- Background Environment: Cute Sidewalk / Bush details -->
  <!-- Ground plane -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <ellipse cx="120" cy="195" rx="90" ry="12" fill="#090d16" opacity="0.6"/>

  <!-- Mailbox Post -->
  <rect x="111" y="140" width="18" height="60" rx="4" fill="#64748b"/>
  <rect x="114" y="140" width="4" height="60" fill="#475569" opacity="0.5"/>

  <!-- Main Subject: Classic Retro Mailbox (Receiving Context) -->
  <g filter="url(#softShadow)">
    <!-- Mailbox Base/Stand connection -->
    <path d="M 100 140 L 140 140 L 135 148 L 105 148 Z" fill="#334155"/>

    <!-- Mailbox Main Rounded Body -->
    <path d="M 80 90 
             Q 80 65 120 65 
             Q 160 65 160 90 
             L 160 140 
             L 80 140 Z" fill="url(#mailboxGrad)"/>

    <!-- Mailbox Front Door Rim/Border (Darker Shade for depth) -->
    <path d="M 85 90 
             Q 85 70 120 70 
             Q 155 70 155 90 
             L 155 135 
             L 85 135 Z" fill="#be123c" opacity="0.4"/>

    <!-- Mail Slot on Front -->
    <rect x="95" y="95" width="50" height="8" rx="4" fill="#881337"/>
    <rect x="97" y="96" width="46" height="4" rx="2" fill="#4c0519"/>

    <!-- Little Flag (Indicates mail inside / received) -->
    <!-- Pivot -->
    <circle cx="160" cy="100" r="4" fill="#cbd5e1"/>
    <!-- Flag Arm & Banner -->
    <path d="M 160 98 L 160 75 L 182 81 L 160 87 Z" fill="#f59e0b" filter="url(#softShadow)"/>
    <path d="M 160 98 L 160 75 L 182 81 L 160 87 Z" fill="#fbbf24"/>
  </g>

  <!-- ACTION SCENE: Receiving Letters (Falling into the slot and floating magically) -->
  <!-- Sparkles / Energy indicating "Receiving" action -->
  <g fill="#fbbf24">
    <path d="M 75 75 L 78 82 L 85 85 L 78 88 L 75 95 L 72 88 L 65 85 L 72 82 Z" opacity="0.8" transform="scale(0.5) translate(60, 40)"/>
    <path d="M 165 65 L 167 70 L 172 72 L 167 74 L 165 79 L 163 74 L 158 72 L 163 70 Z" opacity="0.9" transform="scale(0.6) translate(110, 20)"/>
    <circle cx="145" cy="55" r="3" fill="#38bdf8"/>
    <circle cx="95" cy="60" r="2" fill="#38bdf8"/>
  </g>

  <!-- Action Item 1: Main Letter being received (Entering the slot dynamically) -->
  <g filter="url(#softShadow)" transform="translate(0, -5) rotate(-12, 120, 85)">
    <!-- Envelope Body -->
    <rect x="95" y="70" width="50" height="34" rx="4" fill="url(#envGrad)"/>
    <!-- Envelope Back Flap / Fold lines -->
    <path d="M 95 74 L 120 92 L 145 74" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cute Stamp on Envelope -->
    <rect x="130" y="76" width="10" height="10" rx="1" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Action Item 2: Secondary small glowing parcel/letter floating in -->
  <g filter="url(#softShadow)" transform="translate(25, -25) rotate(15, 140, 70)">
    <rect x="130" y="60" width="24" height="18" rx="3" fill="#38bdf8"/>
    <path d="M 130 64 L 142 71 L 154 64" fill="none" stroke="#bae6fd" stroke-width="1.5"/>
  </g>

  <!-- Foreground Atmospheric Elements (Plants/Leaves framing the scene) -->
  <!-- Left Bush -->
  <path d="M -10 240 Q 10 200 35 210 Q 60 190 75 220 Q 90 205 105 240 Z" fill="#047857" opacity="0.9"/>
  <path d="M 10 240 Q 25 210 45 220 Q 65 200 80 240 Z" fill="#10b981"/>

  <!-- Right Bush/Flower -->
  <path d="M 240 240 Q 220 205 195 215 Q 175 195 160 225 Q 145 210 130 240 Z" fill="#047857" opacity="0.9"/>
  <path d="M 220 240 Q 205 215 185 225 Q 165 205 150 240 Z" fill="#10b981"/>

  <!-- Cute little glowing flower dots -->
  <circle cx="45" cy="215" r="4" fill="#fb7185"/>
  <circle cx="38" cy="222" r="3" fill="#f43f5e"/>
  <circle cx="175" cy="220" r="4" fill="#fb7185"/>
  <circle cx="185" cy="216" r="3" fill="#f43f5e"/>

  <!-- Sparkles around the mailbox to emphasize successful action -->
  <path d="M 50 120 L 52 125 L 57 127 L 52 129 L 50 134 L 48 129 L 43 127 L 48 125 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 195 105 L 196 109 L 200 110 L 196 111 L 195 115 L 194 111 L 190 110 L 194 109 Z" fill="#38bdf8" opacity="0.9"/>

  <!-- Dynamic Motion lines showing receipt -->
  <path d="M 120 40 L 120 58" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.8"/>

</svg>