<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Mountain and Sun -->
  <path d="M0 240 L80 120 L160 240 Z" fill="#334155"/>
  <path d="M100 240 L180 100 L240 240 Z" fill="#475569"/>
  <circle cx="190" cy="60" r="25" fill="#f59e0b" opacity="0.8"/>
  
  <!-- Tourism Infrastructure: Modern Cable Car -->
  <path d="M40 180 L200 180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="120" y="140" width="30" height="25" rx="4" fill="#38bdf8"/>
  <rect x="125" y="145" width="20" height="10" fill="#0f172a" opacity="0.3"/>
  <path d="M135 140 L135 120" stroke="#fb923c" stroke-width="3"/>
  
  <!-- Characters: Tourists looking at the scene -->
  <g transform="translate(40, 160)">
    <circle cx="10" cy="10" r="8" fill="#fbbf24"/>
    <path d="M2 25 L18 25 L15 50 L5 50 Z" fill="#ec4899"/>
    <path d="M5 50 L5 70 M15 50 L15 70" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(70, 170)">
    <circle cx="10" cy="10" r="8" fill="#fbbf24"/>
    <path d="M2 25 L18 25 L15 50 L5 50 Z" fill="#10b981"/>
    <path d="M5 50 L5 70 M15 50 L15 70" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Growth Indicator: Upward Arrow -->
  <path d="M200 40 L220 20 L240 40 M220 20 L220 80" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="3" fill="#fb923c"/>
  <circle cx="50" cy="60" r="2" fill="#38bdf8"/>
</svg>