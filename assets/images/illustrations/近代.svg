<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Desk Glow -->
    <radialGradient id="desk-glow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Brass Gradient -->
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Wood Desk Gradient -->
    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#331808"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>

    <!-- Leather Tome Gradient -->
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="30%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <!-- Blueprint Cyan Gradient -->
    <linearGradient id="blueprint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Lens Glass Reflection -->
    <linearGradient id="glass-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Light Cone from Lamp -->
  <polygon points="120,10 40,210 200,210" fill="#fbbf24" opacity="0.04" />
  <circle cx="120" cy="140" r="90" fill="url(#desk-glow)"/>

  <!-- Background Environment: Vintage Architecture Silhouette & Window -->
  <g opacity="0.25">
    <!-- Window Frame -->
    <rect x="35" y="30" width="170" height="110" rx="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="120" y1="30" x2="120" y2="140" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="35" y1="85" x2="205" y2="85" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Industrial Gear & Factory Silhouette outside window -->
    <circle cx="70" cy="70" r="22" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6,4"/>
    <path d="M 160,100 L 180,140 L 140,140 Z" fill="#64748b"/>
    <rect x="150" y="110" width="20" height="30" fill="#64748b"/>
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 10,185 L 230,185 L 235,230 L 5,230 Z" fill="url(#wood-desk)"/>
  <line x1="10" y1="185" x2="230" y2="185" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>

  <!-- PROPS LAYER -->
  
  <!-- Stack of History Archives / Books (Left) -->
  <g transform="translate(35, 155)" filter="url(#shadow)">
    <!-- Bottom Book -->
    <path d="M 0,15 L 45,5 L 65,20 L 20,30 Z" fill="#1e3a8a"/>
    <path d="M 45,5 L 65,20 L 65,25 L 45,10 Z" fill="#172554"/>
    <!-- Middle Book -->
    <path d="M 5,5 L 50,-3 L 70,12 L 25,20 Z" fill="#047857"/>
    <path d="M 50,-3 L 70,12 L 70,16 L 50,1 Z" fill="#065f46"/>
    <!-- Top Book -->
    <path d="M 10,-5 L 52,-12 L 72,3 L 30,10 Z" fill="#b91c1c"/>
    <path d="M 52,-12 L 72,3 L 72,6 L 52,-9 Z" fill="#991b1b"/>
  </g>

  <!-- Vintage Brass Pocket Watch / Chronometer (Right) -->
  <g transform="translate(180, 170)" filter="url(#shadow)">
    <!-- Watch Chain -->
    <path d="M -20,-10 Q -5,-25 10,-10" fill="none" stroke="url(#brass)" stroke-width="2.5"/>
    <path d="M 10,-10 Q 25,5 30,25" fill="none" stroke="url(#brass)" stroke-width="2.5"/>
    <!-- Watch Body -->
    <circle cx="0" cy="5" r="18" fill="url(#brass)"/>
    <circle cx="0" cy="5" r="15" fill="#fef08a"/>
    <circle cx="0" cy="5" r="13" fill="#ffffff"/>
    <!-- Watch Dial Hands -->
    <line x1="0" y1="5" x2="5" y2="-2" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="-4" y2="8" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="5" r="1.5" stroke="#b45309" stroke-width="1" fill="#fef08a"/>
    <!-- Top Crown -->
    <rect x="-3" y="-15" width="6" height="4" rx="1" fill="url(#brass)"/>
    <circle cx="0" cy="-16" r="2" fill="url(#brass)"/>
  </g>

  <!-- MAIN SUBJECT: Open Modern Era Historical Tome & Blueprint (Centerpiece) -->
  <g transform="translate(55, 115)" filter="url(#shadow)">
    
    <!-- Blueprint Document underneath book -->
    <g transform="translate(-15, 10) rotate(-8)">
      <rect x="0" y="-10" width="90" height="65" rx="2" fill="url(#blueprint)" opacity="0.9"/>
      <!-- Technical lines/schematics on blueprint -->
      <rect x="10" y="0" width="30" height="20" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
      <circle cx="65" cy="20" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="10" y1="35" x2="70" y2="35" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="10" y1="45" x2="50" y2="45" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <!-- Leather Bound Historical Tome (Open) -->
    <!-- Left Cover Page Edge -->
    <path d="M -30,45 L 2,55 L 2,15 L -30,5 Z" fill="#7c2d12"/>
    <!-- Right Cover Page Edge -->
    <path d="M 160,45 L 128,55 L 128,15 L 160,5 Z" fill="#7c2d12"/>

    <!-- Left Page -->
    <path d="M 2,15 Q 65,-5 65,42 L 2,55 Z" fill="#fefce8" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Right Page -->
    <path d="M 128,15 Q 65,-5 65,42 L 128,55 Z" fill="#fefce8" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Spine Center Shadow -->
    <line x1="65" y1="-5" x2="65" y2="42" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Abstract Text Lines on Pages (representing modern history chronicles) -->
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <!-- Left Page Lines -->
      <line x1="12" y1="12" x2="45" y2="8"/>
      <line x1="14" y1="20" x2="50" y2="15"/>
      <line x1="12" y1="28" x2="40" y2="23"/>
      <line x1="15" y1="36" x2="48" y2="31"/>

      <!-- Right Page Lines -->
      <line x1="85" y1="8" x2="118" y2="12"/>
      <line x1="80" y1="15" x2="116" y2="20"/>
      <line x1="82" y1="23" x2="110" y2="28"/>
      <line x1="85" y1="31" x2="115" y2="36"/>
    </g>

    <!-- Mini Steam Locomotive Illustration on Left Page (Industrialization theme) -->
    <g transform="translate(20, 14) scale(0.35)">
      <rect x="0" y="10" width="40" height="25" rx="4" fill="#0f172a"/>
      <rect x="40" y="15" width="25" height="20" fill="#0f172a"/>
      <circle cx="12" cy="38" r="8" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="32" cy="38" r="8" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="52" cy="38" r="6" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 15,10 L 15,3 Q 15,0 20,0 L 25,0" fill="none" stroke="#94a3b8" stroke-width="3"/>
    </g>

    <!-- Mini Factory Silhouette on Right Page -->
    <g transform="translate(85, 15) scale(0.35)">
      <polygon points="0,35 0,15 10,10 10,35" fill="#0f172a"/>
      <polygon points="12,35 12,5 22,10 22,35" fill="#0f172a"/>
      <polygon points="24,35 24,20 38,15 38,35" fill="#0f172a"/>
      <path d="M 6,-5 Q 12,-15 8,-25" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <path d="M 17,-10 Q 24,-22 20,-32" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    </g>

  </g>

  <!-- Vintage Magnifying Glass inspecting the book (Action / Discovery Element) -->
  <g transform="translate(130, 85) rotate(-15)" filter="url(#shadow)">
    <!-- Handle -->
    <rect x="-6" y="25" width="12" height="45" rx="6" fill="url(#brass)"/>
    <circle cx="0" cy="65" r="5" fill="#713f12"/>
    
    <!-- Lens Rim -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#brass)" stroke-width="6"/>
    
    <!-- Glass with Reflection & Distortion Effect -->
    <circle cx="0" cy="0" r="27" fill="url(#glass-shine)"/>
    
    <!-- Highlight Sparkle inside Lens -->
    <path d="M -12,-12 Q -5,-15 -2,-20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Magnified focal detail underneath lens (small golden compass star) -->
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#fbbf24"/>
  </g>

  <!-- Ambient Light Sparks / Particles representing historical energy & enlightenment -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="60" cy="60" r="2.5" filter="url(#glow-soft)"/>
    <circle cx="175" cy="50" r="2" filter="url(#glow-soft)"/>
    <circle cx="100" cy="40" r="3" filter="url(#glow-soft)"/>
    <circle cx="145" cy="130" r="1.5"/>
    <circle cx="45" cy="130" r="2"/>
  </g>
  <g fill="#38bdf8" opacity="0.9">
    <circle cx="120" cy="70" r="2" filter="url(#glow-soft)"/>
    <circle cx="85" cy="95" r="1.5"/>
  </g>

</svg>