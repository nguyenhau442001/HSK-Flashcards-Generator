<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Box Gradient -->
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Floor Setup -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4"/>
  <rect x="20" y="160" width="200" height="60" fill="url(#floorGrad)"/>
  <!-- Floor line -->
  <line x1="20" y1="160" x2="220" y2="160" stroke="#334155" stroke-width="2"/>

  <!-- Big City Window Background (Moving to a new city concept) -->
  <g transform="translate(130, 30)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="70" height="110" rx="4" fill="#0b0f19" stroke="#475569" stroke-width="3"/>
    <!-- City Silhouette inside window -->
    <path d="M10 110 L10 70 L18 70 L18 110 L25 110 L25 50 L35 50 L35 110 L45 110 L45 60 L55 60 L55 110 Z" fill="#1e293b"/>
    <!-- Distant skyscraper lights -->
    <rect x="28" y="55" width="2" height="3" fill="#38bdf8" opacity="0.6"/>
    <rect x="32" y="65" width="2" height="3" fill="#fbbf24" opacity="0.6"/>
    <rect x="48" y="70" width="2" height="3" fill="#38bdf8" opacity="0.6"/>
    <!-- Window Light Beam casting into room -->
    <polygon points="0,0 70,0 90,130 -30,130" fill="url(#windowGlow)" style="mix-blend-mode: screen;"/>
    <!-- Window pane divider -->
    <line x1="35" y1="0" x2="35" y2="110" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="55" x2="70" y2="55" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Wall Decor: Calendar (Indicating "Next Month") -->
  <g transform="translate(35, 35)" filter="url(#shadow)">
    <rect x="0" y="0" width="32" height="38" rx="3" fill="#f8fafc"/>
    <rect x="0" y="0" width="32" height="10" rx="3" fill="#ef4444"/>
    <circle cx="10" cy="5" r="2" fill="#cbd5e1"/>
    <circle cx="22" cy="5" r="2" fill="#cbd5e1"/>
    <!-- Grid dots representing calendar days -->
    <circle cx="8" cy="18" r="1.5" fill="#64748b"/>
    <circle cx="16" cy="18" r="1.5" fill="#64748b"/>
    <circle cx="24" cy="18" r="1.5" fill="#ef4444"/> <!-- Highlighted future date -->
    <circle cx="8" cy="25" r="1.5" fill="#64748b"/>
    <circle cx="16" cy="25" r="1.5" fill="#64748b"/>
    <circle cx="24" cy="25" r="1.5" fill="#64748b"/>
  </g>

  <!-- Packed Moving Boxes (Context Props) -->
  <!-- Box 1 (Back) -->
  <g transform="translate(30, 115)" filter="url(#shadow)">
    <rect x="0" y="10" width="45" height="35" fill="url(#boxGrad)" rx="2"/>
    <polygon points="0,10 12,0 57,0 45,10" fill="url(#boxTop)"/>
    <line x1="22" y1="0" x2="22" y2="10" stroke="#78350f" stroke-width="1.5"/>
    <line x1="0" y1="27" x2="45" y2="27" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Main Character (Preparing to move, holding a checked clipboard/ticket, looking forward) -->
  <g transform="translate(85, 60)" filter="url(#shadow)">
    <!-- Legs -->
    <rect x="24" y="65" width="8" height="38" rx="3" fill="#334155"/>
    <rect x="38" y="65" width="8" height="38" rx="3" fill="#334155"/>
    <!-- Shoes -->
    <path d="M20 101 C20 99, 24 99, 28 99 L34 103 C35 105, 30 106, 25 106 Z" fill="#0f172a"/>
    <path d="M34 101 C34 99, 38 99, 42 99 L48 103 C49 105, 44 106, 39 106 Z" fill="#0f172a"/>

    <!-- Body / Torso (Stylish blue jacket over orange sweater) -->
    <rect x="18" y="25" width="34" height="45" rx="6" fill="#38bdf8"/>
    <!-- Jacket collar / inner shirt -->
    <path d="M28 25 L35 38 L42 25 Z" fill="#ea580c"/>
    <line x1="35" y1="38" x2="35" y2="70" stroke="#0284c7" stroke-width="2"/>

    <!-- Head & Face -->
    <circle cx="35" cy="12" r="14" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M21 12 C21 5, 27 1, 35 1 C43 1, 49 5, 49 12 C49 14, 47 13, 47 10 C47 5, 42 3, 35 3 C28 3, 23 5, 23 10 C23 13, 21 14, 21 12 Z" fill="#334155"/>
    <!-- Confident/Excited Expression -->
    <circle cx="39" cy="11" r="1.5" fill="#1e293b"/>
    <path d="M38 16 Q41 19 44 16" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left Arm (Holding clipboard) -->
    <path d="M18 30 C12 35, 10 45, 14 52" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Right Arm (Gesturing forward towards the new city) -->
    <path d="M52 30 C62 35, 65 25, 68 20" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="69" cy="18" r="4" fill="#fed7aa"/>

    <!-- Clipboard Prop (Travel plans / map) -->
    <g transform="translate(2, 40) rotate(-10)">
      <rect x="0" y="0" width="16" height="20" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
      <rect x="4" y="-3" width="8" height="4" rx="1" fill="#64748b"/>
      <!-- Checkmarks inside -->
      <line x1="3" y1="5" x2="6" y2="8" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="8" x2="12" y2="3" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <line x1="3" y1="12" x2="13" y2="12" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="3" y1="16" x2="10" y2="16" stroke="#94a3b8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Foreground Box (Stacked nicely in the room) -->
  <g transform="translate(160, 115)" filter="url(#shadow)">
    <rect x="0" y="5" width="50" height="40" fill="url(#boxGrad)" rx="2"/>
    <polygon points="0,5 15,-5 65,-5 50,5" fill="url(#boxTop)"/>
    <line x1="25" y1="-5" x2="25" y2="5" stroke="#78350f" stroke-width="1.5"/>
    <line x1="0" y1="25" x2="50" y2="25" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Packing Tape -->
    <rect x="21" y="-5" width="8" height="50" fill="#fde047" opacity="0.8"/>
  </g>

  <!-- Small Globe Prop (Symbolizing relocation/moving to a new place) -->
  <g transform="translate(145, 95)" filter="url(#shadow)">
    <!-- Stand -->
    <path d="M12 25 L12 20 C12 10, 2 10, 2 20 L2 25" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="7" cy="25" rx="8" ry="3" fill="#64748b"/>
    <!-- Globe Sphere -->
    <circle cx="7" cy="10" r="10" fill="#38bdf8"/>
    <!-- Continents stylized -->
    <path d="M3 6 Q6 4 9 7 Q11 10 8 13 Q4 14 3 6 Z" fill="#10b981"/>
    <!-- Axis ring -->
    <circle cx="7" cy="10" r="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

</svg>