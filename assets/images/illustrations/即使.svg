<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Amber Glow for Determination / Action -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Umbrella Gradient -->
    <linearGradient id="umbrellaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Raindrop Def -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Glow behind the Scene -->
  <circle cx="120" cy="120" r="90" fill="url(#glowGrad)" />

  <!-- Background Environment: Park/Path Elements -->
  <!-- Distant Bush/Tree Shapes -->
  <path d="M40 180 Q55 155 80 165 Q100 145 130 160 Q160 140 190 165 Q210 155 220 180 Z" fill="#1e3a8a" opacity="0.4" />
  <path d="M20 190 Q40 165 70 175 Q100 155 135 170 Q170 150 200 180 Q220 170 230 190 Z" fill="#0f2942" opacity="0.6" />

  <!-- Ground / Pavement -->
  <path d="M0 190 Q120 175 240 190 L240 240 L0 240 Z" fill="#090d16" />
  <path d="M0 195 Q120 180 240 195" stroke="#334155" stroke-width="2" fill="none" opacity="0.5" />

  <!-- Puddle with Ripple -->
  <ellipse cx="140" cy="205" rx="35" ry="10" fill="#1e293b" />
  <ellipse cx="140" cy="205" rx="25" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  <ellipse cx="140" cy="205" rx="12" ry="3" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />

  <!-- Ambient Rain (Diagonal streaks) -->
  <g stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="20" x2="14" y2="50" />
    <line x1="60" y1="10" x2="44" y2="40" />
    <line x1="90" y1="30" x2="74" y2="60" />
    <line x1="120" y1="15" x2="104" y2="45" />
    <line x1="160" y1="25" x2="144" y2="55" />
    <line x1="190" y1="10" x2="174" y2="40" />
    <line x1="220" y1="30" x2="204" y2="60" />

    <line x1="15" y1="70" x2="-1" y2="100" />
    <line x1="45" y1="85" x2="29" y2="115" />
    <line x1="75" y1="65" x2="59" y2="95" />
    <line x1="105" y1="80" x2="89" y2="110" />
    <line x1="145" y1="70" x2="129" y2="100" />
    <line x1="175" y1="90" x2="159" y2="120" />
    <line x1="205" y1="75" x2="189" y2="105" />
    <line x1="235" y1="85" x2="219" y2="115" />

    <line x1="30" y1="130" x2="14" y2="160" />
    <line x1="60" y1="140" x2="44" y2="170" />
    <line x1="100" y1="125" x2="84" y2="155" />
    <line x1="130" y1="145" x2="114" y2="175" />
    <line x1="160" y1="130" x2="144" y2="160" />
    <line x1="190" y1="140" x2="174" y2="170" />
    <line x1="220" y1="135" x2="204" y2="165" />
  </g>

  <!-- MAIN SUBJECT: Traveler / Hiker striding forward despite the storm -->
  <g transform="translate(10, 0)">
    <!-- Back Leg (stepping forward) -->
    <path d="M100 150 L115 190 L130 190" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Back Boot -->
    <path d="M125 190 L140 193" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Backpack -->
    <path d="M82 105 C75 105 72 115 75 130 C78 145 85 150 92 145 C95 142 93 110 82 105 Z" fill="#ec4899" />
    <rect x="75" y="115" width="6" height="20" rx="3" fill="#fb923c" />

    <!-- Body / Torso (leaning forward into the wind/rain) -->
    <path d="M92 100 L110 150 C110 150 95 155 85 140 Z" fill="#38bdf8" />

    <!-- Front Leg (planting firmly) -->
    <path d="M95 145 L75 185 L65 190" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Boot -->
    <path d="M60 190 L75 193" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Head & Scarf -->
    <!-- Scarf flowing back -->
    <path d="M102 92 C115 90 130 95 140 85" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Neck/Head -->
    <circle cx="103" cy="84" r="11" fill="#fde68a" />
    <!-- Friendly Determined Face Profile -->
    <path d="M109 84 C109 87 106 89 103 89" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M107 81 L110 83" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none" /> <!-- Determined eye -->
    
    <!-- Hat / Hood -->
    <path d="M91 80 C91 72 100 70 110 75 C113 77 112 83 105 84 Z" fill="#38bdf8" />

    <!-- Front Arm holding Umbrella Shaft -->
    <path d="M100 100 L115 115 L125 110" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Hand -->
    <circle cx="126" cy="110" r="4" fill="#fde68a" />
  </g>

  <!-- Giant Vibrant Umbrella (Symbolizes protection/action 'even though') -->
  <g transform="translate(15, -5)">
    <!-- Umbrella Shaft -->
    <line x1="120" y1="50" x2="120" y2="120" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <!-- Curved Handle -->
    <path d="M120 120 C120 128 112 128 112 122" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Umbrella Canopy -->
    <path d="M50 65 Q120 10 190 65 Q150 75 120 70 Q90 75 50 65 Z" fill="url(#umbrellaGrad)" />
    <!-- Canopy Segments / Ribs -->
    <path d="M120 50 L50 65" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
    <path d="M120 50 L85 62" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
    <path d="M120 50 L155 62" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
    <path d="M120 50 L190 65" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
    <!-- Umbrella Edge Highlights -->
    <path d="M50 65 Q85 78 120 70 Q155 78 190 65" fill="none" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" />
    <!-- Umbrella Top Tip -->
    <circle cx="120" cy="48" r="3" fill="#fef3c7" />
  </g>

  <!-- Heavy Foreground Rain Splash & Droplets for Action/Intensity -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="185" x2="75" y2="192" />
    <line x1="130" y1="180" x2="125" y2="187" />
    <line x1="180" y1="160" x2="174" y2="169" />
  </g>

  <!-- Extra Splash Dots -->
  <circle cx="73" cy="194" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="123" cy="189" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="172" cy="171" r="1.5" fill="#38bdf8" opacity="0.8" />

  <!-- Vignette / Frame Border inside 240x240 -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#64748b" stroke-width="2" opacity="0.2" />
</svg>