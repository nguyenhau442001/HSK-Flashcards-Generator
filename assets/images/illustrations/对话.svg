<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Warm ambient lighting behind the main conversation -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Speech bubble gradient 1 (Left character) -->
    <linearGradient id="bubbleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Speech bubble gradient 2 (Right character) -->
    <linearGradient id="bubbleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Character 1 skin gradient -->
    <linearGradient id="skin1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Character 2 skin gradient -->
    <linearGradient id="skin2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Coffee mug gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient lamp lighting -->
  <circle cx="120" cy="80" r="100" fill="url(#lampGlow)"/>

  <!-- Background Environment & Café Details -->
  <!-- Wooden Table Surface -->
  <path d="M 20 180 L 220 180 L 235 220 L 5 220 Z" fill="#334155" opacity="0.6"/>
  <path d="M 15 174 L 225 174 C 228 174 230 176 230 179 C 230 182 228 184 225 184 L 15 184 C 12 184 10 182 10 179 C 10 176 12 174 15 174 Z" fill="#475569"/>

  <!-- Background Plant on Shelf/Corner -->
  <path d="M 205 130 C 205 115 215 105 225 105 C 235 105 240 115 240 130 Z" fill="#10b981" opacity="0.8"/>
  <path d="M 215 125 C 220 110 230 115 235 135 Z" fill="#34d399"/>
  <rect x="212" y="130" width="16" height="20" rx="4" fill="#cbd5e1"/>

  <!-- Warm Hanging Lamp -->
  <path d="M 110 0 L 130 0 L 125 35 L 115 35 Z" fill="#64748b"/>
  <path d="M 100 35 L 140 35 L 150 55 L 90 55 Z" fill="#fbbf24" filter="url(#dropShadow)"/>
  <circle cx="120" cy="55" r="8" fill="#fef08a"/>

  <!-- Coffee Cups on Table -->
  <!-- Cup 1 (Left) -->
  <rect x="55" y="160" width="14" height="18" rx="2" fill="url(#mugGrad)"/>
  <path d="M 69 164 C 73 164 73 172 69 172" stroke="#9333ea" stroke-width="2" fill="none"/>
  <!-- Cup 2 (Right) -->
  <rect x="170" y="160" width="14" height="18" rx="2" fill="#38bdf8"/>
  <path d="M 170 164 C 166 164 166 172 170 172" stroke="#0284c7" stroke-width="2" fill="none"/>

  <!-- ================= CHARACTER 1 (LEFT) ================= -->
  <!-- Body/Shoulders -->
  <path d="M 35 190 C 35 165 55 155 80 155 C 105 155 125 165 125 190 Z" fill="#3b82f6"/>
  <path d="M 65 155 L 75 135 L 95 135 L 100 155 Z" fill="#ffffff"/> <!-- Collar -->

  <!-- Head & Neck -->
  <rect x="73" y="125" width="14" height="15" fill="url(#skin1)"/>
  <circle cx="80" cy="115" r="22" fill="url(#skin1)" filter="url(#dropShadow)"/>

  <!-- Hair (Left Character - Styled Dark) -->
  <path d="M 60 110 C 60 95 70 90 85 92 C 100 90 102 100 102 115 C 102 120 100 110 95 105 C 85 100 70 102 62 112 Z" fill="#0f172a"/>

  <!-- Facial Features (Looking Right towards other character) -->
  <circle cx="88" cy="113" r="2" fill="#0f172a"/> <!-- Eye -->
  <path d="M 92 118 Q 95 120 98 117" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Smile -->
  <circle cx="74" cy="120" r="4" fill="#fda4af" opacity="0.6"/> <!-- Blush -->

  <!-- ================= CHARACTER 2 (RIGHT) ================= -->
  <!-- Body/Shoulders -->
  <path d="M 115 190 C 115 165 135 155 160 155 C 185 155 205 165 205 190 Z" fill="#f43f5e"/>
  <path d="M 145 155 L 150 135 L 170 135 L 175 155 Z" fill="#ffffff"/> <!-- Collar -->

  <!-- Head & Neck -->
  <rect x="153" y="125" width="14" height="15" fill="url(#skin2)"/>
  <circle cx="160" cy="115" r="22" fill="url(#skin2)" filter="url(#dropShadow)"/>

  <!-- Hair (Right Character - Warm Blonde/Brown Bob) -->
  <path d="M 140 115 C 140 95 150 90 165 90 C 180 90 182 100 182 120 C 182 125 178 125 175 120 C 170 105 155 105 145 125 Z" fill="#92400e"/>

  <!-- Facial Features (Looking Left towards other character) -->
  <circle cx="152" cy="113" r="2" fill="#0f172a"/> <!-- Eye -->
  <path d="M 142 118 Q 145 120 148 117" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Smile -->
  <circle cx="166" cy="120" r="4" fill="#f43f5e" opacity="0.4"/> <!-- Blush -->


  <!-- ================= INTERACTIVE DIALOGUE ELEMENTS (THE CORE CONCEPT) ================= -->
  <!-- Dynamic Floating Speech Bubbles Intersecting in Center -->
  
  <!-- Left Speech Bubble (Outgoing) -->
  <g filter="url(#bubbleShadow)">
    <path d="M 85 95 
             C 70 95 60 85 60 70 
             C 60 55 75 45 100 45 
             C 125 45 140 55 140 70 
             C 140 85 125 95 110 95 
             L 100 110 
             L 95 95 Z" 
          fill="url(#bubbleGrad1)"/>
          
    <!-- Abstract conversational graphic lines inside bubble 1 -->
    <rect x="72" y="62" width="40" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="72" y="74" width="28" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Right Speech Bubble (Incoming / Responding) -->
  <g filter="url(#bubbleShadow)">
    <path d="M 155 75 
             C 170 75 180 85 180 100 
             C 180 115 165 125 140 125 
             C 115 125 100 115 100 100 
             C 100 85 115 75 130 75 
             L 140 60 
             L 145 75 Z" 
          fill="url(#bubbleGrad2)"/>
          
    <!-- Abstract conversational graphic dots / waveform inside bubble 2 -->
    <circle cx="125" cy="100" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="140" cy="100" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="155" cy="100" r="4" fill="#ffffff" opacity="0.9"/>
    <path d="M 120 90 L 130 90 L 135 95 L 145 85 L 160 90" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Central Connection / Spark of Conversation (Action element) -->
  <g filter="url(#dropShadow)">
    <circle cx="120" cy="72" r="14" fill="#fbbf24" opacity="0.9"/>
    <!-- Tiny abstract exchange icons in the spark -->
    <path d="M 113 72 L 127 72 M 120 65 L 120 79" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating decorative communication nodes/particles -->
  <circle cx="45" cy="50" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="195" cy="55" r="5" fill="#ec4899" opacity="0.6"/>
  <circle cx="25" cy="100" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="215" cy="90" r="3.5" fill="#34d399" opacity="0.7"/>

  <!-- Foreground Vignette / Frame enhancement -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>