<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Clothing Gradient -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Clothing Gradient -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Window City View Gradient -->
    <linearGradient id="windowView" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lamp Glow -->
  <circle cx="120" cy="0" r="140" fill="url(#lampGlow)"/>

  <!-- BACKGROUND ARCHITECTURE & PROPS -->
  <!-- Window Frame & Night Cityscape -->
  <g id="window-scene" transform="translate(145, 20)">
    <rect width="70" height="90" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <rect x="6" y="6" width="58" height="78" rx="2" fill="url(#windowView)"/>
    <!-- City lights in window -->
    <rect x="12" y="30" width="8" height="12" rx="1" fill="#fde047" opacity="0.6"/>
    <rect x="26" y="20" width="10" height="25" rx="1" fill="#38bdf8" opacity="0.4"/>
    <rect x="42" y="45" width="14" height="20" rx="1" fill="#fde047" opacity="0.5"/>
    <rect x="16" y="60" width="10" height="15" rx="1" fill="#ec4899" opacity="0.5"/>
    <!-- Window pane crossbars -->
    <line x1="35" y1="6" x2="35" y2="84" stroke="#334155" stroke-width="2"/>
    <line x1="6" y1="45" x2="64" y2="45" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Bookshelf Background Element -->
  <g id="bookshelf" transform="translate(15, 30)" opacity="0.6">
    <rect width="45" height="110" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="35" x2="45" y2="35" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="75" x2="45" y2="75" stroke="#334155" stroke-width="1.5"/>
    <!-- Books -->
    <rect x="6" y="12" width="8" height="23" rx="1" fill="#f59e0b"/>
    <rect x="16" y="15" width="10" height="20" rx="1" fill="#10b981"/>
    <rect x="28" y="10" width="12" height="25" rx="1" fill="#38bdf8"/>
    <rect x="8" y="48" width="10" height="27" rx="1" fill="#ec4899"/>
    <rect x="20" y="52" width="7" height="23" rx="1" fill="#8b5cf6"/>
  </g>

  <!-- Indoor Plant -->
  <g id="plant" transform="translate(25, 140)">
    <path d="M10 25 L18 55 H2 L10 25 Z" fill="#64748b"/>
    <path d="M10 25 C10 10, -5 5, -10 -5 C-5 10, 5 15, 10 25 Z" fill="#10b981"/>
    <path d="M10 25 C15 5, 30 0, 35 -10 C25 5, 15 15, 10 25 Z" fill="#34d399"/>
    <path d="M10 25 C5 -5, 10 -20, 15 -30 C12 -5, 10 10, 10 25 Z" fill="#059669"/>
  </g>

  <!-- Desk and Workspace -->
  <g id="desk">
    <!-- Desk Surface -->
    <path d="M10 175 L230 175 L220 215 L20 215 Z" fill="#334155" filter="url(#shadow)"/>
    <rect x="15" y="168" width="210" height="9" rx="3" fill="#475569"/>
    <!-- Desk Lamp -->
    <path d="M195 168 L195 135 L205 130" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M190 125 L215 125 L210 135 L195 135 Z" fill="#f59e0b"/>
    <!-- Laptop -->
    <path d="M75 168 L125 168 L133 158 L67 158 Z" fill="#94a3b8"/>
    <rect x="73" y="167" width="54" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="80" y="138" width="40" height="22" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  </g>


  <!-- CHARACTERS INTERACTING -->

  <!-- Character 1 (Left - Explaining/Speaking): Giving the idea -->
  <g id="character-speaker" transform="translate(45, 75)">
    <!-- Body & Torso -->
    <path d="M30 65 L60 65 L65 100 L25 100 Z" fill="url(#shirt1)" filter="url(#shadow)"/>
    <!-- Head -->
    <circle cx="45" cy="35" r="22" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M25 35 C25 18, 40 12, 60 20 C62 25, 62 32, 60 38 C55 30, 35 30, 28 40 Z" fill="#1e293b"/>
    <!-- Face Profile / Expression -->
    <circle cx="53" cy="36" r="2" fill="#1e293b"/> <!-- Eye -->
    <path d="M56 43 Q60 46 64 43" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Friendly Smile -->
    <!-- Gesture Arm pointing/explaining -->
    <path d="M55 70 Q75 60 85 50" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" filter="url(#shadow)"/>
    <circle cx="85" cy="50" r="5" fill="#ffedd5"/> <!-- Hand -->
  </g>

  <!-- Character 2 (Right - Understanding / 明白): The "Aha!" Moment -->
  <g id="character-listener" transform="translate(130, 65)">
    <!-- Body & Torso (Leaning forward slightly) -->
    <path d="M25 75 L60 75 L55 115 L20 115 Z" fill="url(#shirt2)" filter="url(#shadow)"/>
    
    <!-- Head & Expressive Tilt -->
    <g transform="translate(35, 38)">
      <circle cx="0" cy="0" r="22" fill="#ffedd5"/>
      <!-- Hair -->
      <path d="M-22 -5 C-22 -22, 0 -25, 20 -15 C22 -5, 18 10, 15 15 C5 5, -10 10, -20 15 Z" fill="#3b0764"/>
      <!-- Eyes (Bright, wide, showing realization) -->
      <circle cx="6" cy="-2" r="3.5" fill="#1e293b"/>
      <circle cx="7" cy="-3" r="1" fill="#ffffff"/> <!-- Eye shine -->
      <!-- Eyebrow raised in understanding -->
      <path d="M1 -9 Q7 -13 12 -8" fill="none" stroke="#3b0764" stroke-width="2" stroke-linecap="round"/>
      <!-- Happy Open Smile ("Ah, I get it!") -->
      <path d="M4 8 Q10 15 14 8" fill="#1e293b"/>
      <!-- Rosy Cheeks -->
      <circle cx="11" cy="4" r="4" fill="#fda4af" opacity="0.6"/>
    </g>

    <!-- Arms: One hand raised in realization / touching chin, one on desk -->
    <!-- Arm raising up -->
    <path d="M45 80 Q65 65 50 45" fill="none" stroke="#be185d" stroke-width="10" stroke-linecap="round" filter="url(#shadow)"/>
    <circle cx="50" cy="42" r="5" fill="#ffedd5"/> <!-- Hand near chin -->

    <!-- LIGHTBULB / IDEA MOMENT (Visual metaphor for "Míngbai" / Clarity) -->
    <g transform="translate(65, -5)" filter="url(#shadow)">
      <!-- Glow rays -->
      <path d="M-12 12 L-20 8" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M12 12 L20 8" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="3" x2="0" y2="-7" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Bulb Body -->
      <path d="M-9 12 C-9 5, -5 2, 0 2 C5 2, 9 5, 9 12 C9 16, 6 19, 5 21 L-5 21 C-6 19, -9 16, -9 12 Z" fill="#fde047"/>
      <!-- Bulb Base -->
      <rect x="-3" y="21" width="6" height="4" fill="#94a3b8"/>
      <rect x="-2" y="25" width="4" height="2" fill="#64748b"/>
      <!-- Sparkle inside bulb -->
      <path d="M0 6 L1.5 9 L4.5 10.5 L1.5 12 L0 15 L-1.5 12 L-4.5 10.5 L-1.5 9 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Foreground aesthetic coffee cup / props -->
  <g id="coffee-cup" transform="translate(175, 160)">
    <path d="M4 5 L16 5 L14 18 L6 18 Z" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M14 8 C18 8, 18 15, 14 16" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="10" cy="5" rx="6" ry="2" fill="#cbd5e1"/>
    <!-- Steam -->
    <path d="M8 -2 Q10 -6 8 -10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M12 -4 Q14 -8 12 -12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>