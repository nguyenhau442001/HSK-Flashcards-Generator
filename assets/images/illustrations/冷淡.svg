<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 (Me) Accent Light -->
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Character 2 (Him) Cool Shadow / Detached Tone -->
    <linearGradient id="coolShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Window City Night Gradient -->
    <linearGradient id="windowNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>

    <!-- Clip Path for Window View -->
    <clipPath id="windowClip">
      <path d="M 150 45 L 210 45 L 210 115 L 150 115 Z"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ==================== ENVIRONMENT & PROPS ==================== -->
  
  <!-- Bookshelf Background Details -->
  <g fill="#1a2638" opacity="0.7">
    <rect x="20" y="50" width="40" height="8" rx="2"/>
    <rect x="25" y="38" width="8" height="12"/>
    <rect x="35" y="35" width="6" height="15"/>
    <rect x="45" y="40" width="10" height="10"/>
  </g>

  <!-- Window to the City (Symbolizing emotional distance / cold night) -->
  <rect x="148" y="43" width="64" height="74" rx="4" fill="#334155"/>
  <rect x="150" y="45" width="60" height="70" fill="url(#windowNight)" clip-path="url(#windowClip)"/>
  <!-- City Lights outside -->
  <g fill="#38bdf8" opacity="0.4" clip-path="url(#windowClip)">
    <rect x="158" y="70" width="4" height="40"/>
    <rect x="166" y="85" width="3" height="30"/>
    <rect x="178" y="60" width="5" height="55"/>
    <rect x="190" y="90" width="4" height="25"/>
    <rect x="198" y="75" width="3" height="40"/>
  </g>
  <!-- Window Frame Divider -->
  <line x1="180" y1="45" x2="180" y2="115" stroke="#1e293b" stroke-width="2"/>
  <line x1="150" y1="80" x2="210" y2="80" stroke="#1e293b" stroke-width="2"/>

  <!-- Living Room Table / Desk Surface -->
  <path d="M 20 185 L 220 185 L 210 155 L 30 155 Z" fill="#2a394f"/>
  <rect x="25" y="180" width="190" height="6" rx="2" fill="#3b4f6b"/>
  <!-- Table Legs -->
  <rect x="45" y="186" width="8" height="35" fill="#172033"/>
  <rect x="185" y="186" width="8" height="35" fill="#172033"/>

  <!-- Warm Table Lamp (Casting light on 'Me', away from 'Him') -->
  <circle cx="85" cy="140" r="35" fill="url(#lampGlow)" pointer-events="none"/>
  <path d="M 85 130 L 73 155 L 97 155 Z" fill="#fbbf24"/>
  <rect x="83" y="155" width="4" height="25" fill="#64748b"/>
  <ellipse cx="85" cy="180" rx="10" ry="3" fill="#475569"/>

  <!-- Props on Table: Coffee mugs & unopened notebook -->
  <rect x="105" y="165" width="18" height="12" rx="3" fill="#e2e8f0"/>
  <path d="M 123 168 C 127 168 127 174 123 174" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  
  <rect x="135" y="168" width="22" height="10" rx="2" fill="#cbd5e1" transform="rotate(-5 135 168)"/>
  <line x1="138" y1="172" x2="153" y2="171" stroke="#64748b" stroke-width="1.5"/>


  <!-- ==================== CHARACTER 1: HE ("Anh ấy" - Cold, Turned Away) ==================== -->
  <g transform="translate(130, 82)">
    <!-- Body / Torso (Angled away) -->
    <path d="M 30 50 C 30 35 45 30 55 30 C 65 30 75 40 75 55 L 75 98 L 25 98 L 25 70 Z" fill="url(#coolShadow)"/>
    
    <!-- Right Arm crossed or hanging defensively -->
    <path d="M 65 45 L 45 65 L 55 75" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Head (Looking away to the right, showing emotional coldness) -->
    <circle cx="55" cy="22" r="15" fill="#94a3b8"/>
    <!-- Hair (Dark, neat, detached style) -->
    <path d="M 41 20 C 41 12 48 8 57 9 C 66 10 69 16 69 23 L 65 23 C 65 18 61 13 55 13 C 48 13 45 16 45 22 Z" fill="#1e293b"/>

    <!-- Facial Expression: Unresponsive, flat mouth, closed/cold eyes -->
    <!-- Flat/Cold Mouth line -->
    <line x1="62" y1="26" x2="67" y2="26" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cold closed eye -->
    <line x1="61" y1="20" x2="65" y2="20" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  </g>


  <!-- ==================== CHARACTER 2: ME ("Tôi" - Sad, Reaching Out, Hurt) ==================== -->
  <g transform="translate(45, 78)">
    <!-- Body / Torso (Leaning forward slightly, vulnerable) -->
    <path d="M 25 45 C 25 32 38 30 48 32 C 58 35 62 42 62 55 L 62 102 L 18 102 L 18 65 Z" fill="url(#warmLight)"/>

    <!-- Arm reaching out tentatively toward him -->
    <path d="M 52 48 C 65 52 75 58 85 62" fill="none" stroke="#e0a96d" stroke-width="9" stroke-linecap="round"/>
    <!-- Hand open, expressive rejection/distance feel -->
    <circle cx="87" cy="63" r="4" fill="#e0a96d"/>

    <!-- Head (Tilted downward with sad/hurt expression) -->
    <circle cx="45" cy="20" r="15" fill="#fcd34d"/>
    <!-- Hair (Soft brown/dark style) -->
    <path d="M 31 20 C 31 11 39 7 47 7 C 56 7 59 13 59 22 L 53 22 C 53 16 49 12 45 12 C 39 12 37 15 37 20 Z" fill="#78350f"/>

    <!-- Facial Expression: Sad, eyes wide with disappointment, slight downward frown -->
    <!-- Sad Eyebrow (tilted up inside) -->
    <path d="M 39 16 C 40 14 43 14 44 16" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sad Eye (open, vulnerable) -->
    <circle cx="41" cy="19" r="1.5" fill="#78350f"/>
    <!-- Sad Mouth (small downward curve showing sorrow) -->
    <path d="M 39 26 C 41 24 43 24 44 26" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Subtle teardrop or emotional cue near eye -->
    <path d="M 43 22 C 43 23.5 41.5 24 41.5 24 C 41.5 24 40 23.5 40 22 C 40 21.2 40.7 20.5 41.5 20.5 C 42.3 20.5 43 21.2 43 22 Z" fill="#38bdf8" opacity="0.8"/>
  </g>


  <!-- ==================== ATMOSPHERIC DETAILS ==================== -->
  <!-- Floating emotional cold air wisps / minimal separation lines between characters -->
  <path d="M 115 75 Q 120 85 112 95 Q 105 105 110 115" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.4"/>
  <path d="M 122 65 Q 127 75 120 85" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.3"/>

</svg>