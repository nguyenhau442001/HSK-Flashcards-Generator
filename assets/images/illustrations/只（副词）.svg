<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="120" y1="160" x2="120" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Coin Gold Gradient -->
    <linearGradient id="coinGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>

    <!-- Pouch Fabric Gradient -->
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>

    <!-- Spotlight/Glow Effect -->
    <radialGradient id="spotlight" cx="120" cy="120" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment & Props -->
  <!-- Cozy shop shelf or interior backdrop line -->
  <path d="M40 80 L200 80" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <circle cx="70" cy="65" r="12" fill="#334155" opacity="0.3"/>
  <rect x="160" y="55" width="20" height="25" rx="4" fill="#334155" opacity="0.3"/>

  <!-- Table/Counter Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#tableGrad)"/>
  <!-- Table edge highlight -->
  <path d="M0 160 L240 160" stroke="#475569" stroke-width="2"/>

  <!-- Main Subject: Empty/Nearly Empty Scene representing "Only" (Tôi chỉ có mười đồng) -->
  
  <!-- Opened/Tipped Small Coin Pouch (indicating almost all coins are gone) -->
  <g transform="translate(85, 135)">
    <!-- Pouch shadow -->
    <ellipse cx="20" cy="30" rx="25" ry="8" fill="#0f172a" opacity="0.6"/>
    <!-- Pouch back fold -->
    <path d="M 5 20 C 0 5, 20 0, 30 10 C 35 15, 30 25, 25 30 Z" fill="#9f1239"/>
    <!-- Main pouch body -->
    <path d="M 5 20 C -5 25, 0 40, 15 42 C 30 44, 40 30, 35 25 C 25 20, 20 30, 10 25 Z" fill="url(#pouchGrad)"/>
    <!-- Pouch opening/interior dark -->
    <ellipse cx="22" cy="12" rx="8" ry="4" fill="#881337"/>
    <!-- Drawstring -->
    <path d="M 14 10 Q 22 18 32 12" stroke="#fbbf24" stroke-width="2" fill="none"/>
  </g>

  <!-- The "Only" Visual Element: Exactly 10 Coins (Grouped neatly to show "Only this much") -->
  <!-- We arrange a small cluster of distinct golden coins -->
  <g transform="translate(120, 150)">
    <!-- Coin 1 -->
    <g transform="translate(-25, 5)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coinGold)"/>
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fef3c7" opacity="0.5"/>
    </g>
    <!-- Coin 2 -->
    <g transform="translate(-12, 10)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coinGold)"/>
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fef3c7" opacity="0.5"/>
    </g>
    <!-- Coin 3 -->
    <g transform="translate(-20, -5)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coinGold)"/>
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fef3c7" opacity="0.5"/>
    </g>
    <!-- Coin 4 -->
    <g transform="translate(-2, 2)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coinGold)"/>
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fef3c7" opacity="0.5"/>
    </g>
    <!-- Coin 5 -->
    <g transform="translate(-8, -10)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coinGold)"/>
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fef3c7" opacity="0.5"/>
    </g>
    <!-- Coin 6 -->
    <g transform="translate(8, 8)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coinGold)"/>
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fef3c7" opacity="0.5"/>
    </g>
    <!-- Coin 7 -->
    <g transform="translate(3, -6)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coinGold)"/>
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fef3c7" opacity="0.5"/>
    </g>
    <!-- Coin 8 -->
    <g transform="translate(18, 0)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coinGold)"/>
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fef3c7" opacity="0.5"/>
    </g>
    <!-- Coin 9 -->
    <g transform="translate(12, -12)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coinGold)"/>
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fef3c7" opacity="0.5"/>
    </g>
    <!-- Coin 10 (The final tenth coin resting slightly apart) -->
    <g transform="translate(26, -7)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coinGold)"/>
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fef3c7" opacity="0.6"/>
      <!-- Sparkle on the last coin to emphasize exact count/focus -->
      <path d="M 0 -10 L 1 -4 L 7 -3 L 1 -2 L 0 4 L -1 -2 L -7 -3 L -1 -4 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Atmospheric Lighting & Accent Elements -->
  <!-- Soft focus sparkles floating around the meager coins to highlight the focal point -->
  <path d="M 90 95 L 91.5 98.5 L 95 100 L 91.5 101.5 L 90 105 L 88.5 101.5 L 85 100 L 88.5 98.5 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 155 110 L 156 112 L 158 113 L 156 114 L 155 116 L 154 114 L 152 113 L 154 112 Z" fill="#fbbf24" opacity="0.7"/>

  <!-- Foreground framing / depth vignette -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.1"/>
</svg>