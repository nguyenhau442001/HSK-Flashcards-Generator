<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="120" cy="115" r="75"/>
    </clipPath>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Atmospheric Glow & Window Background Elements -->
  <circle cx="120" cy="115" r="75" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  
  <g clip-path="url(#circle-clip)">
    <!-- Office Background Wall -->
    <rect x="45" y="40" width="150" height="90" fill="#1e293b"/>
    <!-- Large Office Window showing city lights -->
    <rect x="130" y="50" width="55" height="70" fill="#0f172a" rx="4"/>
    <rect x="138" y="60" width="12" height="20" fill="#fbbf24" opacity="0.6" rx="2"/>
    <rect x="156" y="75" width="15" height="35" fill="#38bdf8" opacity="0.4" rx="2"/>
    <rect x="138" y="85" width="12" height="25" fill="#f43f5e" opacity="0.4" rx="2"/>
    
    <!-- Ambient Light Spill -->
    <path d="M45 130 L120 115 L195 130 Z" fill="url(#amber-glow)"/>

    <!-- Bookshelf / Plant background -->
    <rect x="55" y="65" width="25" height="55" fill="#334155" rx="2"/>
    <rect x="60" y="70" width="15" height="4" fill="#fb923c"/>
    <rect x="60" y="80" width="15" height="4" fill="#38bdf8"/>
    <circle cx="67" cy="62" r="8" fill="#10b981"/>
    <path d="M60 62 Q67 52 74 62 Z" fill="#059669"/>

    <!-- Desk Surface -->
    <path d="M40 155 L200 155 L210 190 L30 190 Z" fill="url(#desk)"/>
    <rect x="30" y="150" width="180" height="6" fill="#475569" rx="2"/>

    <!-- Office Props on Desk -->
    <!-- Coffee Mug -->
    <rect x="175" y="138" width="12" height="15" fill="#f8fafc" rx="2"/>
    <path d="M187 142 C191 142 191 149 187 149" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <path d="M178 134 Q180 130 177 126" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Desk Lamp -->
    <path d="M60 155 L65 115 L75 115 L70 155 Z" fill="#64748b"/>
    <path d="M55 115 C55 105 75 105 75 115 Z" fill="#fbbf24"/>
    <path d="M50 110 L80 110 L72 100 L58 100 Z" fill="#f59e0b"/>

    <!-- Laptop / Computer -->
    <path d="M85 125 L135 125 L142 152 L78 152 Z" fill="#94a3b8"/>
    <rect x="88" y="92" width="44" height="34" fill="#cbd5e1" rx="3"/>
    <rect x="91" y="95" width="38" height="28" fill="url(#screen)"/>
    <!-- Dashboard UI Bars on Screen -->
    <rect x="95" y="99" width="16" height="3" fill="#e2e8f0" rx="1"/>
    <rect x="95" y="105" width="28" height="2" fill="#38bdf8" rx="1"/>
    <rect x="95" y="110" width="22" height="2" fill="#10b981" rx="1"/>
    <circle cx="123" cy="118" r="4" fill="#fbbf24"/>

    <!-- Secretary Character (Action-focused: organizing schedule & typing) -->
    <!-- Body & Suit Jacket -->
    <path d="M95 180 C95 160 105 148 120 148 C135 148 145 160 145 180 Z" fill="#3b82f6"/> <!-- Blue suit -->
    <path d="M108 148 L120 168 L132 148 Z" fill="#f8fafc"/> <!-- White blouse collar -->
    <!-- Necktie / Accent Ribbon -->
    <polygon points="118,158 122,158 121,170 120,173 119,170" fill="#f43f5e"/>

    <!-- Head & Hair -->
    <circle cx="120" cy="128" r="17" fill="#fed7aa"/> <!-- Face base -->
    <!-- Professional Hair Bun & Styling -->
    <path d="M103 125 C103 112 137 112 137 125 C137 135 130 140 120 140 C110 140 103 135 103 125 Z" fill="#1e293b"/>
    <circle cx="120" cy="107" r="7" fill="#1e293b"/> <!-- Hair Bun -->
    <path d="M103 125 Q120 132 137 125 Q135 143 120 142 Q105 143 103 125 Z" fill="#1e293b"/>

    <!-- Facial Expressions (Friendly, focused, confident) -->
    <circle cx="114" cy="127" r="1.5" fill="#0f172a"/>
    <circle cx="126" cy="127" r="1.5" fill="#0f172a"/>
    <!-- Glasses -->
    <rect x="110" y="123" width="8" height="6" rx="1" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <rect x="122" y="123" width="8" height="6" rx="1" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <line x1="118" y1="125" x2="122" y2="125" stroke="#fbbf24" stroke-width="1.2"/>
    <!-- Smile -->
    <path d="M117 133 Q120 136 123 133" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheeks -->
    <circle cx="112" cy="131" r="2" fill="#fda4af" opacity="0.6"/>
    <circle cx="128" cy="131" r="2" fill="#fda4af" opacity="0.6"/>

    <!-- Arms & Hands typing/organizing -->
    <path d="M95 160 Q85 170 92 182" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="93" cy="183" r="3.5" fill="#fed7aa"/> <!-- Hand on keyboard -->

    <path d="M145 160 Q155 172 142 182" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="140" cy="183" r="3.5" fill="#fed7aa"/>

    <!-- Foreground floating work items (Schedule/Documents) -->
    <g transform="translate(145, 105) rotate(15)">
      <rect x="0" y="0" width="24" height="30" fill="#f8fafc" rx="2"/>
      <rect x="3" y="5" width="12" height="3" fill="#38bdf8" rx="1"/>
      <line x1="3" y1="11" x2="21" y2="11" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="3" y1="15" x2="18" y2="15" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="3" y1="19" x2="15" y2="19" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Checkmark -->
      <path d="M16 23 L18 25 L22 21" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Sticky Note -->
    <polygon points="50,115 70,112 73,132 53,135" fill="#fef08a"/>
    <line x1="55" y1="120" x2="65" y2="119" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="55" y1="125" x2="68" y2="124" stroke="#ca8a04" stroke-width="1.5"/>

  </g>

  <!-- Outer Frame Ring / UI Accent -->
  <circle cx="120" cy="115" r="75" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Decorative dynamic sparkles/dots -->
  <circle cx="42" cy="75" r="3" fill="#fbbf24"/>
  <circle cx="202" cy="95" r="2" fill="#38bdf8"/>
  <circle cx="195" cy="175" r="3.5" fill="#ec4899"/>
  <circle cx="45" cy="155" r="2" fill="#10b981"/>
</svg>