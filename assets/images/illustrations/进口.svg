<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Box Gradient 1 -->
    <linearGradient id="box-grad-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Box Gradient 2 -->
    <linearGradient id="box-grad-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Global Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Shop Interior Environment -->
  <!-- Back Wall & Shelving -->
  <rect x="24" y="40" width="192" height="110" rx="4" fill="#334155" opacity="0.6"/>
  <!-- Shelf 1 -->
  <rect x="20" y="85" width="200" height="6" rx="3" fill="#475569" filter="url(#shadow)"/>
  <!-- Shelf 2 -->
  <rect x="20" y="130" width="200" height="6" rx="3" fill="#475569" filter="url(#shadow)"/>

  <!-- Decorative background items on shelves -->
  <circle cx="50" cy="72" r="10" fill="#64748b" opacity="0.5"/>
  <rect x="80" y="60" width="16" height="25" rx="3" fill="#64748b" opacity="0.5"/>
  <rect x="170" y="65" width="22" height="20" rx="4" fill="#64748b" opacity="0.5"/>

  <!-- Counter / Table Surface -->
  <path d="M12 185 L228 185 L210 210 L30 210 Z" fill="#475569" filter="url(#shadow)"/>
  <rect x="12" y="175" width="216" height="14" rx="3" fill="#64748b"/>

  <!-- IMPORTED PRODUCTS (Main focus: boxes arriving/displayed) -->
  <!-- Product Box 1 (Front Left) -->
  <g transform="translate(38, 140)" filter="url(#shadow)">
    <path d="M0 15 L25 5 L50 15 L50 45 L25 55 L0 45 Z" fill="url(#box-grad-1)"/>
    <path d="M25 5 L50 15 L25 25 L0 15 Z" fill="#7dd3fc"/>
    <path d="M25 25 L25 55 L50 45 L50 15 Z" fill="#0284c7" opacity="0.3"/>
    <!-- Stamp/Globe graphic suggesting imported goods -->
    <circle cx="25" cy="35" r="8" fill="#f8fafc" opacity="0.9"/>
    <circle cx="25" cy="35" r="6" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  </g>

  <!-- Product Box 2 (Stacked Center) -->
  <g transform="translate(75, 125)" filter="url(#shadow)">
    <path d="M0 15 L25 5 L50 15 L50 45 L25 55 L0 45 Z" fill="url(#box-grad-2)"/>
    <path d="M25 5 L50 15 L25 25 L0 15 Z" fill="#6ee7b7"/>
    <path d="M25 25 L25 55 L50 45 L50 15 Z" fill="#047857" opacity="0.3"/>
    <!-- Stamp graphic -->
    <circle cx="25" cy="35" r="8" fill="#f8fafc" opacity="0.9"/>
    <path d="M21 35 L29 35 M25 31 L25 39" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Product Box 3 (Open with item, right) -->
  <g transform="translate(130, 135)" filter="url(#shadow)">
    <!-- Open box back -->
    <path d="M0 20 L20 10 L40 20 L40 50 L20 60 L0 50 Z" fill="#f59e0b"/>
    <path d="M20 10 L40 20 L20 30 L0 20 Z" fill="#fbbf24"/>
    <!-- Glowing imported gadget inside -->
    <circle cx="20" cy="32" r="10" fill="#38bdf8" filter="url(#shadow)"/>
    <path d="M16 32 L19 35 L25 29" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- STORE CLERK CHARACTER (Proudly presenting the products) -->
  <!-- Clerk Body & Apron -->
  <g transform="translate(155, 95)" filter="url(#shadow)">
    <!-- Torso -->
    <path d="M15 35 C10 35 5 45 5 65 L55 65 C55 45 50 35 45 35 Z" fill="#38bdf8"/>
    <!-- Apron -->
    <path d="M15 40 L45 40 L48 95 L12 95 Z" fill="#f8fafc"/>
    <!-- Apron pocket detail -->
    <rect x="22" y="60" width="16" height="12" rx="2" fill="#cbd5e1"/>
    
    <!-- Arms -->
    <!-- Left Arm (pointing to products) -->
    <path d="M12 42 C-2 50 -10 65 -15 62" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-16" cy="61" r="5" fill="#fbcfe8"/>

    <!-- Right Arm (resting hip) -->
    <path d="M48 42 C60 50 60 70 50 80" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="51" cy="82" r="5" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <circle cx="30" cy="18" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M14 18 C14 6 22 2 30 2 C38 2 46 6 46 18 C46 20 44 14 30 12 C16 14 14 20 14 18 Z" fill="#334155"/>
    <!-- Cheerful Expression -->
    <path d="M24 18 Q30 24 36 18" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <circle cx="23" cy="15" r="2" fill="#334155"/>
    <circle cx="37" cy="15" r="2" fill="#334155"/>
    <!-- Smile -->
    <path d="M27 22 Q30 26 33 22" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CUSTOMER CHARACTER (Observing / Inspecting) -->
  <g transform="translate(15, 105)" filter="url(#shadow)">
    <!-- Body -->
    <path d="M10 40 C5 40 0 50 0 70 L40 70 C40 50 35 40 30 40 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="20" cy="20" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M8 20 C8 8 15 6 20 6 C28 6 32 10 32 20 C28 16 12 16 8 20 Z" fill="#b45309"/>
    <!-- Eye & Curious Expression -->
    <circle cx="24" cy="18" r="1.5" fill="#334155"/>
    <path d="M18 23 Q21 26 24 23" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Quality / Origin Sparkles (Contextualizing global shipment) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 115 50 Q 115 55 120 55 Q 115 55 115 60 Q 115 55 110 55 Q 115 55 115 50 Z" opacity="0.9"/>
    <!-- Star 2 -->
    <path d="M 60 30 Q 60 34 64 34 Q 60 34 60 38 Q 60 34 56 34 Q 60 34 60 30 Z" opacity="0.6"/>
    <!-- Globe/Flight Arc Indicator (Subtle background graphic) -->
    <path d="M 20 120 Q 60 90 110 110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
    <path d="M 102 107 L 110 110 L 106 117" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  </g>
</svg>