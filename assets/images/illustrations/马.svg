<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Sun/Sunset Gradient -->
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Horse Body Gradient -->
    <linearGradient id="horse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Landscape Foreground Gradient -->
    <linearGradient id="ground-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Distant Hills Gradient -->
    <linearGradient id="hills-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Elements: Distant Sunset & Clouds -->
  <circle cx="180" cy="90" r="30" fill="url(#sun-grad)" opacity="0.9"/>
  <!-- Glowing aura -->
  <circle cx="180" cy="90" r="45" fill="#f59e0b" opacity="0.15"/>
  
  <!-- Clouds -->
  <path d="M40 70 Q55 60 70 70 Q85 65 95 75 Q110 75 110 90 Q40 90 40 70 Z" fill="#334155" opacity="0.4"/>
  <path d="M140 50 Q150 42 165 50 Q175 45 185 55 Q200 55 200 68 Q140 68 140 50 Z" fill="#334155" opacity="0.3"/>

  <!-- Distant Hills -->
  <path d="M0 150 Q60 110 130 140 Q180 160 240 130 L240 240 L0 240 Z" fill="url(#hills-grad)" opacity="0.7"/>

  <!-- Ground Landscape -->
  <path d="M0 170 Q70 140 150 165 Q200 180 240 160 L240 240 L0 240 Z" fill="url(#ground-grad)"/>

  <!-- Environmental Details: Pine Trees & Grass tufts -->
  <!-- Tree 1 -->
  <polygon points="25,170 32,150 39,170" fill="#047857"/>
  <polygon points="28,155 32,140 36,155" fill="#10b981"/>
  <rect x="30" y="170" width="4" height="8" fill="#78350f"/>

  <!-- Tree 2 -->
  <polygon points="205,175 213,152 221,175" fill="#047857"/>
  <polygon points="209,158 213,142 217,158" fill="#10b981"/>
  <rect x="211" y="175" width="4" height="9" fill="#78350f"/>

  <!-- Grass blades foreground -->
  <path d="M10 200 L12 190 L15 200 M18 202 L21 193 L23 202 M215 210 L218 200 L220 210 M225 208 L228 198 L231 208" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>

  <!-- THE MAIN SUBJECT: HORSE AND RIDER -->
  <g transform="translate(15, 30)">
    <!-- Horse Legs (Back) -->
    <path d="M60 125 L55 155 M85 125 L90 152" stroke="#92400e" stroke-width="6" stroke-linecap="round"/>

    <!-- Horse Tail -->
    <path d="M42 100 Q30 115 35 135 Q40 120 48 108" fill="#78350f"/>

    <!-- Horse Body & Rump -->
    <ellipse cx="68" cy="108" rx="28" ry="18" fill="url(#horse-grad)"/>
    <path d="M45 100 Q55 90 75 95 L85 120 L50 120 Z" fill="url(#horse-grad)"/>

    <!-- Horse Neck & Head -->
    <path d="M82 95 Q105 75 112 60 Q118 70 102 98 Z" fill="url(#horse-grad)"/>
    <!-- Horse Muzzle -->
    <circle cx="114" cy="63" r="6" fill="#b45309"/>
    <!-- Horse Mane -->
    <path d="M85 85 Q95 75 102 65 Q97 78 88 92 Z" fill="#78350f"/>
    <!-- Horse Ear -->
    <polygon points="102,60 106,48 110,58" fill="#b45309"/>

    <!-- Horse Legs (Front) -->
    <path d="M52 122 L45 156 M75 122 L78 155" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
    <!-- Hooves -->
    <path d="M43 156 L47 156 M76 155 L80 155 M53 155 L57 155 M88 152 L92 152" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>

    <!-- RIDER (Character) -->
    <!-- Torso (Dynamic lean forward) -->
    <g transform="translate(62, 82) rotate(-15)">
      <!-- Backpack / Travel satchel suggesting "going somewhere" -->
      <rect x="-14" y="-2" width="10" height="14" rx="3" fill="#ef4444"/>
      <path d="M-9 -2 L-9 12" stroke="#b91c1c" stroke-width="2"/>

      <!-- Jacket / Shirt (Bright modern color) -->
      <path d="M-10 -8 Q0 -12 12 -4 L10 16 L-12 14 Z" fill="#38bdf8"/>
      <!-- Scarf fluttering behind -->
      <path d="M 6 -12 Q 20 -20 32 -10 Q 22 -5 10 -6 Z" fill="#ec4899"/>

      <!-- Head & Face -->
      <circle cx="8" cy="-18" r="9" fill="#fde68a"/>
      <!-- Hair -->
      <path d="M -1 -20 Q 8 -28 16 -18 Q 12 -23 4 -22 Z" fill="#1e293b"/>
      <!-- Happy/Excited Expression: Eye curve & smile -->
      <path d="M 8 -16 Q 10 -14 12 -16" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M 10 -12 Q 13 -10 15 -12" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

      <!-- Reins -->
      <path d="M 15 8 L 95 62" stroke="#78350f" stroke-width="2" fill="none"/>

      <!-- Arms -->
      <!-- Back Arm holding rein -->
      <path d="M -5 -4 Q 8 2 15 8" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="15" cy="8" r="3" fill="#fde68a"/>
      <!-- Front Arm bent -->
      <path d="M 4 -6 Q 18 2 25 10" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="25" cy="10" r="3" fill="#fde68a"/>

      <!-- Legs (Riding posture draped over horse) -->
      <path d="M -8 14 Q -15 25 -2 32" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Motion lines / Dust clouds behind horse -->
  <path d="M35 155 Q25 158 20 152" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M28 163 Q20 165 12 160" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <circle cx="42" cy="158" r="4" fill="#cbd5e1" opacity="0.5"/>
  <circle cx="32" cy="164" r="3" fill="#cbd5e1" opacity="0.4"/>

  <!-- Artistic framing & lighting highlight -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>