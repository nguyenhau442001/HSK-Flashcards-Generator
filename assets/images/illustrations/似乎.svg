<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- Character (The "Subject") -->
  <g transform="translate(60, 60)">
    <!-- Body -->
    <path d="M40 160 C40 130 60 110 80 110 C100 110 120 130 120 160 L120 180 L40 180 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="80" cy="90" r="30" fill="#fde68a"/>
    <!-- Expression: "Sìhū" (Uncertain/Pensive) -->
    <path d="M65 85 Q70 80 75 85" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M85 85 Q90 80 95 85" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M70 105 Q80 98 90 105" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M55 80 Q60 50 80 50 Q100 50 105 80" fill="#fb923c"/>
  </g>

  <!-- Contextual Props: A gift box and a question mark-like shadow -->
  <rect x="160" y="150" width="40" height="40" rx="4" fill="#ec4899"/>
  <rect x="175" y="140" width="10" height="50" rx="2" fill="#f59e0b"/>
  
  <!-- Atmospheric "Doubt" cloud/shadow -->
  <path d="M140 100 Q160 80 180 100 T220 100" stroke="#fbbf24" stroke-width="4" fill="none" stroke-dasharray="6 6" opacity="0.6"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="5" fill="#10b981"/>
  <circle cx="210" cy="50" r="8" fill="#38bdf8" opacity="0.3"/>
</svg>