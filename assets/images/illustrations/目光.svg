<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Window frame -->
  <rect x="40" y="40" width="160" height="120" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="120" y="40" width="4" height="120" fill="#475569"/>
  
  <!-- Night sky outside -->
  <circle cx="180" cy="70" r="15" fill="#fef3c7"/>
  <path d="M60 100 L80 80 L100 100 Z" fill="#94a3b8" opacity="0.3"/>
  
  <!-- Character -->
  <g transform="translate(60, 100)">
    <!-- Body -->
    <path d="M20 120 Q60 120 100 120 L110 140 L10 140 Z" fill="#38bdf8"/>
    <!-- Face -->
    <circle cx="60" cy="60" r="35" fill="#fde68a"/>
    <!-- Eyes (The focus of the illustration) -->
    <ellipse cx="45" cy="55" rx="6" ry="8" fill="#0f172a"/>
    <ellipse cx="75" cy="55" rx="6" ry="8" fill="#0f172a"/>
    <!-- Highlights in eyes -->
    <circle cx="47" cy="53" r="2" fill="#ffffff"/>
    <circle cx="77" cy="53" r="2" fill="#ffffff"/>
    <!-- Mouth -->
    <path d="M50 80 Q60 88 70 80" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M30 40 Q60 10 90 40 Q95 60 80 70 Q60 50 40 70 Z" fill="#fb923c"/>
  </g>
  
  <!-- Desk/Foreground -->
  <rect x="0" y="180" width="240" height="60" fill="#1e293b"/>
  <rect x="0" y="180" width="240" height="10" fill="#334155"/>
  
  <!-- Props: Gift box -->
  <rect x="160" y="170" width="40" height="40" rx="4" fill="#ec4899"/>
  <rect x="178" y="170" width="4" height="40" fill="#fce7f3"/>
  <rect x="160" y="188" width="40" height="4" fill="#fce7f3"/>
  
  <!-- Glowing particles representing expectation -->
  <circle cx="70" cy="40" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="90" cy="50" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="80" cy="30" r="2" fill="#fbbf24" opacity="0.4"/>
</svg>