<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk / Surface Gradient -->
    <linearGradient id="desk-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Clipboard Main Gradient -->
    <linearGradient id="board-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paper-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Mug Gradient -->
    <linearGradient id="mug-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient lighting/glow behind desk elements -->
  <circle cx="120" cy="110" r="70" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- Isometric Wooden/Modern Desk Surface -->
  <path d="M 0,165 L 240,165 L 240,240 L 0,240 Z" fill="url(#desk-grad)"/>
  <line x1="0" y1="165" x2="240" y2="165" stroke="#475569" stroke-width="2"/>

  <!-- Background Props: Potted Plant on Desk -->
  <g transform="translate(185, 120)" filter="url(#soft-shadow)">
    <!-- Pot -->
    <path d="M 8,25 L 22,25 L 26,45 L 4,45 Z" fill="#64748b"/>
    <!-- Leaves -->
    <circle cx="15" cy="15" r="14" fill="#10b981"/>
    <circle cx="8" cy="8" r="10" fill="#34d399"/>
    <circle cx="22" cy="10" r="9" fill="#059669"/>
  </g>

  <!-- Background Props: Hot Coffee Mug with Steam -->
  <g transform="translate(40, 130)" filter="url(#soft-shadow)">
    <!-- Steam -->
    <path d="M 10, -5 Q 15, -12 10, -20 Q 5, -28 10, -35" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 20, -2 Q 25, -9 20, -17 Q 15, -25 20, -32" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <!-- Handle -->
    <path d="M 24, 8 C 34, 8 34, 26 24, 26" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="0" y="0" width="24" height="32" rx="4" fill="url(#mug-grad)"/>
    <!-- Coffee Surface -->
    <ellipse cx="12" cy="4" rx="10" ry="3" fill="#0369a1"/>
  </g>

  <!-- MAIN SUBJECT: The Mission Clipboard & Task Items -->
  <g transform="translate(68, 30)" filter="url(#soft-shadow)">
    
    <!-- Clipboard Base (Amber/Gold Board) -->
    <rect x="5" y="5" width="94" height="135" rx="10" fill="url(#board-grad)"/>
    <rect x="8" y="8" width="88" height="129" rx="8" fill="#d97706" opacity="0.3"/>

    <!-- Metallic Clip Top -->
    <path d="M 32,5 L 32,0 L 72,0 L 72,5 Z" fill="#64748b" rx="2"/>
    <rect x="24" y="4" width="56" height="12" rx="4" fill="#94a3b8"/>
    <rect x="30" y="7" width="44" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Clip Handle/Hole -->
    <circle cx="52" cy="10" r="2" fill="#475569"/>

    <!-- Paper Sheet -->
    <rect x="12" y="18" width="80" height="114" rx="4" fill="url(#paper-grad)"/>

    <!-- Decorative Red Stamp / Seal (Mission Accepted vibe) -->
    <g transform="translate(62, 90) rotate(-15)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.8"/>
      <path d="M -7,0 L -2,5 L 7,-4" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    </g>

    <!-- Task Items (Checklist Lines & Custom Graphic Checkmarks) -->
    <!-- Task 1: Completed (Green Check) -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#10b981"/>
      <path d="M 3,6 L 5,8 L 9,3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Text Line Placeholder -->
      <rect x="18" y="2" width="42" height="4" rx="2" fill="#cbd5e1"/>
      <rect x="18" y="8" width="28" height="3" rx="1.5" fill="#e2e8f0"/>
    </g>

    <!-- Task 2: Completed (Green Check) -->
    <g transform="translate(20, 58)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#10b981"/>
      <path d="M 3,6 L 5,8 L 9,3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Text Line Placeholder -->
      <rect x="18" y="2" width="48" height="4" rx="2" fill="#cbd5e1"/>
      <rect x="18" y="8" width="34" height="3" rx="1.5" fill="#e2e8f0"/>
    </g>

    <!-- Task 3: Active / In Progress (Highlighted Blue Box) -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#38bdf8"/>
      <!-- Dot inside active box -->
      <circle cx="6" cy="6" r="3" fill="#ffffff"/>
      <!-- Text Line Placeholder (Bold/Darker for current task) -->
      <rect x="18" y="2" width="52" height="5" rx="2.5" fill="#334155"/>
      <rect x="18" y="9" width="40" height="3" rx="1.5" fill="#64748b"/>
    </g>

    <!-- Task 4: Pending (Empty Box) -->
    <g transform="translate(20, 104)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <!-- Text Line Placeholder -->
      <rect x="18" y="2" width="36" height="4" rx="2" fill="#e2e8f0"/>
      <rect x="18" y="8" width="20" height="3" rx="1.5" fill="#f1f5f9"/>
    </g>
  </g>

  <!-- Action Prop: Floating Modern Stylus/Pen pointing at the active task -->
  <g transform="translate(135, 115) rotate(-35)" filter="url(#soft-shadow)">
    <!-- Pen Body -->
    <path d="M 0,0 L 8,-3 L 12,45 L -4,45 Z" fill="#ec4899"/>
    <!-- Pen Tip -->
    <path d="M -4,45 L 4,45 L 0,53 Z" fill="#1e293b"/>
    <!-- Pen Grip/Accent -->
    <rect x="-3" y="10" width="14" height="8" fill="#f43f5e"/>
    <!-- Metallic Clip -->
    <rect x="3" y="-1" width="2" height="15" rx="1" fill="#cbd5e1"/>
  </g>

  <!-- Sparkles / Action Accents to add visual pop -->
  <g transform="translate(175, 45)" filter="url(#glow)">
    <path d="M 0,-8 C 0,-2 2,0 8,0 C 2,0 0,2 0,8 C 0,2 -2,0 -8,0 C -2,0 0,-2 0,-8 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(45, 75)">
    <path d="M 0,-5 C 0,-1 1,0 5,0 C 1,0 0,1 0,5 C 0,1 -1,0 -5,0 C -1,0 0,-1 0,-5 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(155, 145)">
    <path d="M 0,-4 C 0,-1 1,0 4,0 C 1,0 0,1 0,4 C 0,1 -1,0 -4,0 C -1,0 0,-1 0,-4 Z" fill="#10b981"/>
  </g>
</svg>