<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk / Workspace Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Hologram Glow -->
    <radialGradient id="holoGlow" x1="50%" y1="50%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Energy Core Gradient -->
    <linearGradient id="energyCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Office/Lab Environment) -->
  <g opacity="0.15">
    <!-- Window Grid -->
    <rect x="30" y="25" width="60" height="80" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="60" y1="25" x2="60" y2="105" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="30" y1="65" x2="90" y2="65" stroke="#94a3b8" stroke-width="1.5"/>

    <rect x="150" y="25" width="60" height="80" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="180" y1="25" x2="180" y2="105" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="150" y1="65" x2="210" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Ambient light rays -->
    <polygon points="30,25 0,160 80,160" fill="#ffffff" opacity="0.03" />
    <polygon points="210,25 160,160 240,160" fill="#ffffff" opacity="0.03" />
  </g>

  <!-- Desk Surface -->
  <path d="M 0 175 L 240 175 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <line x1="0" y1="175" x2="240" y2="175" stroke="#475569" stroke-width="2" />
  <!-- Desk highlight -->
  <line x1="0" y1="177" x2="240" y2="177" stroke="#64748b" stroke-width="1" opacity="0.5" />

  <!-- Background Props: Monitor / Hologram Projector Base -->
  <g transform="translate(120, 160)">
    <!-- Projector stand base -->
    <ellipse cx="0" cy="15" rx="36" ry="10" fill="#0f172a" filter="url(#shadow)"/>
    <path d="M -24 15 L -16 0 L 16 0 L 24 15 Z" fill="#475569" />
    <ellipse cx="0" cy="0" rx="16" ry="5" fill="#64748b" />
    <ellipse cx="0" cy="0" rx="10" ry="3" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Holographic Display Area (Representing multi-faceted capability/skills) -->
  <!-- Hologram Cone Light -->
  <polygon points="120,160 80,75 160,75" fill="url(#beamGrad)" />
  <ellipse cx="120" cy="75" rx="40" ry="12" fill="url(#holoGlow)" />

  <!-- Central Character / Action Subject: Multi-Tasking Robotic/Smart Assistant Core -->
  <!-- Floating Main Core (Energy Orb) -->
  <g transform="translate(120, 85)" filter="url(#shadow)">
    <!-- Outer Rings -->
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="36" ry="14" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Energy Core Sphere -->
    <circle cx="0" cy="0" r="18" fill="url(#energyCore)" filter="url(#glow)"/>
    <circle cx="-5" cy="-5" r="4" fill="#ffffff" opacity="0.6"/>

    <!-- Orbiting Skill Nodes (Representing diverse capabilities: analysis, execution, power) -->
    <!-- Node 1: Gear / Mechanics -->
    <g transform="translate(-32, -18)">
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <path d="M-3,-3 L3,-3 L3,3 L-3,3 Z" fill="#38bdf8"/>
    </g>

    <!-- Node 2: Lightning / Energy -->
    <g transform="translate(32, -12)">
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
      <polygon points="0,-5 -4,1 1,1 -1,6 4,0 -1,0" fill="#fbbf24"/>
    </g>

    <!-- Node 3: Target / Precision -->
    <g transform="translate(0, 32)">
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#10b981" stroke-width="2"/>
    </g>
  </g>

  <!-- Foreground Environment & Interactive Elements -->
  <!-- Holographic Bar Charts & Analytics (Floating around the core) -->
  <g transform="translate(45, 105)" filter="url(#shadow)">
    <!-- Panel Background -->
    <rect x="0" y="0" width="36" height="48" rx="4" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Bars -->
    <rect x="6" y="28" width="5" height="14" rx="1" fill="#38bdf8"/>
    <rect x="15" y="16" width="5" height="26" rx="1" fill="#10b981"/>
    <rect x="24" y="8" width="5" height="34" rx="1" fill="#fbbf24"/>
    <!-- Line graph overlay -->
    <polyline points="8,24 17,12 26,16" fill="none" stroke="#ec4899" stroke-width="1.5" />
  </g>

  <!-- Secondary Hologram Panel (Performance metrics) -->
  <g transform="translate(160, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="40" height="36" rx="4" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="18" r="12" fill="none" stroke="#334155" stroke-width="3"/>
    <path d="M 20 6 A 12 12 0 1 1 10 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="18" r="4" fill="#38bdf8"/>
  </g>

  <!-- Desk Foreground Props -->
  <!-- Coffee Mug (Cozy real-world touch) -->
  <g transform="translate(185, 185)" filter="url(#shadow)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#cbd5e1" />
    <path d="M 16 10 C 21 10 21 18 16 18" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
    <ellipse cx="8" cy="5" rx="8" ry="3" fill="#94a3b8" />
    <!-- Steam -->
    <path d="M 5 -2 C 3 -6 9 -8 7 -12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 11 -1 C 9 -5 13 -7 11 -11" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Mechanical Tool / Wrench (Hands-on capability symbol) -->
  <g transform="translate(30, 180) rotate(-25)" filter="url(#shadow)">
    <path d="M 0 0 L 25 -25 C 28 -28 33 -28 36 -25 C 39 -22 39 -17 36 -14 L 11 11 Z" fill="#64748b"/>
    <circle cx="28" cy="-20" r="3" fill="#1e293b"/>
    <rect x="-8" y="8" width="14" height="24" rx="3" fill="#fb923c" />
  </g>

  <!-- Tablet / Blueprint Device on Desk -->
  <g transform="translate(75, 175)" filter="url(#shadow)">
    <!-- Tablet Body -->
    <rect x="0" y="0" width="55" height="35" rx="4" fill="#334155" transform="rotate(-10)" />
    <!-- Screen -->
    <rect x="4" y="4" width="47" height="27" rx="2" fill="#0f172a" transform="rotate(-10)" />
    <!-- Blueprint lines on tablet -->
    <path d="M 12 15 L 22 22 L 40 10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" transform="rotate(-10)" opacity="0.8"/>
    <circle cx="40" cy="10" r="2.5" fill="#10b981" transform="rotate(-10)" />
  </g>

  <!-- Sparkles & Action Energy Particles -->
  <g fill="#fbbf24">
    <circle cx="105" cy="55" r="2" filter="url(#glow)"/>
    <circle cx="145" cy="60" r="1.5" />
    <circle cx="130" cy="40" r="2.5" filter="url(#glow)"/>
    <circle cx="95" cy="85" r="1" />
  </g>
  <g fill="#38bdf8">
    <circle cx="75" cy="120" r="2" filter="url(#glow)"/>
    <circle cx="165" cy="110" r="1.5" />
    <circle cx="110" cy="135" r="2" filter="url(#glow)"/>
  </g>
  <g fill="#10b981">
    <circle cx="135" cy="125" r="1.5" />
    <circle cx="85" cy="70" r="2" filter="url(#glow)"/>
  </g>

  <!-- Vignette / Frame Border overlay for depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />
</svg>