<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / SCENERY -->
  <!-- Bookshelf Background -->
  <rect x="25" y="40" width="45" height="90" fill="#334155" rx="2" />
  <rect x="30" y="55" width="35" height="4" fill="#475569" />
  <rect x="30" y="75" width="35" height="4" fill="#475569" />
  <rect x="30" y="95" width="35" height="4" fill="#475569" />
  <!-- Colorful books on shelf -->
  <path d="M32 55 L32 48 L38 48 L38 55 Z" fill="#f43f5e" />
  <path d="M39 55 L39 46 L45 46 L45 55 Z" fill="#38bdf8" />
  <path d="M48 55 L48 49 L55 49 L55 55 Z" fill="#10b981" />
  <path d="M32 75 L32 62 L37 62 L37 75 Z" fill="#fb923c" />
  <path d="M38 75 L38 65 L44 65 L44 75 Z" fill="#a855f7" />

  <!-- Window with City View & Light Beam -->
  <path d="M165 30 L210 30 L210 110 L165 110 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <path d="M187 30 L187 110 M165 70 L210 70" stroke="#475569" stroke-width="1.5" />
  <!-- City skyline outside -->
  <path d="M170 110 L170 90 L176 90 L176 110 Z" fill="#334155" />
  <path d="M179 110 L179 80 L185 80 L185 110 Z" fill="#334155" />
  <path d="M190 110 L190 85 L200 85 L200 110 Z" fill="#334155" />
  <!-- Window Light projection -->
  <polygon points="165,30 210,30 230,180 110,180" fill="url(#window-light)" />

  <!-- Big Office Desk -->
  <rect x="30" y="150" width="180" height="12" fill="#475569" rx="3" filter="url(#soft-shadow)" />
  <rect x="45" y="162" width="12" height="40" fill="#334155" />
  <rect x="183" y="162" width="12" height="40" fill="#334155" />

  <!-- PROPS DEPICTING COMPREHENSIVE THINKING ("全面") -->
  <!-- Central Corkboard / Mind Map on Wall -->
  <rect x="85" y="45" width="70" height="45" rx="4" fill="#b45309" stroke="#78350f" stroke-width="2" filter="url(#soft-shadow)" />
  <rect x="90" y="50" width="60" height="35" fill="#fef3c7" rx="2" />
  <!-- Connected nodes on the mind map (representing looking at things comprehensively) -->
  <circle cx="120" cy="67" r="6" fill="#f43f5e" />
  <circle cx="103" cy="58" r="4" fill="#38bdf8" />
  <circle cx="137" cy="58" r="4" fill="#10b981" />
  <circle cx="103" cy="77" r="4" fill="#fb923c" />
  <circle cx="137" cy="77" r="4" fill="#a855f7" />
  <line x1="120" y1="67" x2="103" y2="58" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="120" y1="67" x2="137" y2="58" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="120" y1="67" x2="103" y2="77" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="120" y1="67" x2="137" y2="77" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Laptop on Desk -->
  <path d="M125 150 L155 150 L162 138 L118 138 Z" fill="#cbd5e1" />
  <rect x="120" y="125" width="35" height="15" rx="2" fill="#94a3b8" />
  <rect x="122" y="127" width="31" height="11" fill="#0f172a" />
  <path d="M125 130 L135 130 M140 130 L148 130" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />

  <!-- Desk Lamp on Left -->
  <path d="M50 150 L58 150 L56 120 L52 120 Z" fill="#64748b" />
  <path d="M38 105 C50 105 56 115 56 120 L52 120 C52 116 48 109 38 108 Z" fill="#fbbf24" />
  <circle cx="45" cy="115" r="25" fill="url(#lamp-glow)" />

  <!-- Documents & Magnifying Glass (Analyzing details) -->
  <rect x="65" y="138" width="22" height="15" rx="1" fill="#f8fafc" transform="rotate(-10 75 145)" />
  <line x1="68" y1="142" x2="82" y2="142" stroke="#cbd5e1" stroke-width="1" />
  <line x1="68" y1="146" x2="78" y2="146" stroke="#cbd5e1" stroke-width="1" />
  
  <rect x="80" y="140" width="22" height="15" rx="1" fill="#f1f5f9" transform="rotate(15 90 145)" />
  <line x1="83" y1="144" x2="98" y2="144" stroke="#cbd5e1" stroke-width="1" />
  <line x1="83" y1="148" x2="93" y2="148" stroke="#cbd5e1" stroke-width="1" />

  <!-- Magnifying glass overlay -->
  <circle cx="95" cy="135" r="8" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="101" y1="141" x2="108" y2="148" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- MAIN CHARACTER -->
  <!-- Character Body & Torso (Leaning forward thoughtfully) -->
  <g transform="translate(0, 5)">
    <!-- Chair Back -->
    <path d="M102 120 C102 105 118 105 118 120 L118 155 L102 155 Z" fill="#334155" />
    
    <!-- Torso (Wearing a cozy teal sweater) -->
    <path d="M92 125 C92 112 128 112 128 125 L135 152 C135 152 115 157 90 152 Z" fill="#0d9488" filter="url(#soft-shadow)" />

    <!-- Neck & Head -->
    <rect x="104" y="100" width="12" height="18" fill="#fdba74" />
    <!-- Head -->
    <circle cx="110" cy="88" r="18" fill="#fdba74" />
    
    <!-- Hair (Stylish dark brown messy bob) -->
    <path d="M93 85 C92 72 102 68 112 68 C124 68 129 76 128 90 C128 90 125 80 112 80 C99 80 93 85 93 85 Z" fill="#332924" />
    <path d="M95 85 C94 92 98 100 102 98 C100 92 97 88 95 85 Z" fill="#332924" />

    <!-- Facial Expression: Thoughtful / Considering deeply -->
    <!-- Eyes closed in deep concentration or looking focused -->
    <path d="M101 88 Q105 91 109 88" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M113 88 Q117 91 121 88" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Eyebrows tilted thoughtfully -->
    <path d="M100 83 Q105 81 110 84" stroke="#332924" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M112 84 Q117 81 122 83" stroke="#332924" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Gentle thoughtful mouth/smile -->
    <path d="M108 97 Q111 99 114 97" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Cute rosy cheeks -->
    <circle cx="99" cy="93" r="3" fill="#f43f5e" opacity="0.3" />
    <circle cx="121" cy="93" r="3" fill="#f43f5e" opacity="0.3" />

    <!-- Arms & Hands in "Thinking" Pose (Hand on chin) -->
    <!-- Right arm resting on desk -->
    <path d="M95 130 C90 130 80 145 75 145" stroke="#0d9488" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Left arm up, hand touching chin -->
    <path d="M125 130 C132 125 125 105 118 100" stroke="#0d9488" stroke-width="11" stroke-linecap="round" fill="none" />
    <!-- Hand near chin -->
    <circle cx="116" cy="98" r="5" fill="#fdba74" />
  </g>

  <!-- Floating colorful analysis particles (representing multiple aspects/perspectives of "全面") -->
  <circle cx="75" cy="90" r="4" fill="#38bdf8" opacity="0.8" />
  <circle cx="155" cy="100" r="5" fill="#f43f5e" opacity="0.8" />
  <circle cx="145" cy="70" r="3" fill="#fbbf24" opacity="0.9" />
  <circle cx="68" cy="115" r="3.5" fill="#10b981" opacity="0.8" />
  <path d="M72 87 L78 93" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M152 97 L158 103" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" />

</svg>