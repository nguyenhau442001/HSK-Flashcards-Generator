<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Environment: Train Station Platform -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <path d="M0 160 L240 160 L220 180 L20 180 Z" fill="#475569"/>
  <circle cx="180" cy="80" r="30" fill="#f59e0b" opacity="0.2"/>
  
  <!-- The Protagonist (Left) -->
  <g transform="translate(40, 100)">
    <path d="M20 120 L20 60 Q20 40 40 40 L50 40 Q70 40 70 60 L70 120" fill="#38bdf8"/>
    <circle cx="45" cy="30" r="15" fill="#fde68a"/>
    <path d="M35 25 L40 30 M50 25 L55 30" stroke="#1e293b" stroke-width="2"/>
    <path d="M38 35 Q45 38 52 35" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- The Departing Figure (Right - Fading/Walking away) -->
  <g transform="translate(140, 110)">
    <path d="M10 110 L10 60 Q10 40 30 40 L40 40 Q60 40 60 60 L60 110" fill="#94a3b8"/>
    <circle cx="35" cy="30" r="12" fill="#cbd5e1"/>
    <path d="M60 70 L80 80" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Visual Narrative Elements -->
  <path d="M100 120 L130 120" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="140" cy="120" r="3" fill="#fb923c"/>
  
  <!-- Platform details -->
  <rect x="0" y="180" width="240" height="60" fill="#1e293b"/>
  <rect x="20" y="190" width="200" height="5" fill="#475569"/>
  <rect x="20" y="210" width="200" height="5" fill="#475569"/>
  
  <!-- Atmosphere -->
  <circle cx="200" cy="40" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="180" cy="30" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="220" cy="50" r="1.5" fill="#ffffff" opacity="0.4"/>
</svg>