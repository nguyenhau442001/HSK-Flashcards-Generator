<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Office Background Details -->
  <rect x="30" y="60" width="180" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="140" y="80" width="60" height="40" rx="4" fill="#334155"/>
  <circle cx="170" cy="100" r="12" fill="#475569"/>
  
  <!-- Desk -->
  <rect x="40" y="150" width="160" height="15" fill="#334155"/>
  <rect x="50" y="165" width="10" height="30" fill="#475569"/>
  <rect x="180" y="165" width="10" height="30" fill="#475569"/>
  
  <!-- The Deputy Manager (Character) -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-30 100 Q 0 80 30 100 L 25 140 L -25 140 Z" fill="#38bdf8"/>
    <!-- Tie -->
    <path d="M-5 95 L 5 95 L 0 120 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="75" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-18 75 Q -20 55 0 55 Q 20 55 18 75" fill="#475569"/>
    <!-- Glasses -->
    <rect x="-12" y="70" width="8" height="6" rx="1" fill="#1e293b"/>
    <rect x="4" y="70" width="8" height="6" rx="1" fill="#1e293b"/>
  </g>
  
  <!-- The Manager (Character - slightly taller/higher position) -->
  <g transform="translate(60, 90)">
    <path d="M-25 100 Q 0 80 25 100 L 20 140 L -20 140 Z" fill="#ec4899"/>
    <circle cx="0" cy="75" r="22" fill="#fde68a"/>
    <path d="M-20 75 Q -22 50 0 50 Q 22 50 20 75" fill="#94a3b8"/>
  </g>

  <!-- Props: Chart/Document -->
  <rect x="150" y="120" width="40" height="30" rx="2" fill="#f1f5f9"/>
  <line x1="155" y1="130" x2="185" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="155" y1="140" x2="175" y2="140" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Accent Light -->
  <circle cx="200" cy="40" r="30" fill="#f59e0b" opacity="0.1"/>
</svg>