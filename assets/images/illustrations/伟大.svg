<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Lab Glow Gradient -->
    <radialGradient id="lab-glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Beam (Greatness/Inspiration) -->
    <linearGradient id="gold-beam" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Flask Liquid Gradient -->
    <linearGradient id="liquid-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- DNA Strand Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Laboratory Light -->
  <circle cx="120" cy="120" r="110" fill="url(#lab-glow)"/>

  <!-- Background Environment: Laboratory Architecture & Equipment -->
  <!-- Laboratory Wall Grid / Panels -->
  <path d="M20 180 L220 180" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M40 50 L40 180 M200 50 L200 180" stroke="#334155" stroke-width="1"/>

  <!-- Shelves with Scientific Equipment & Books -->
  <rect x="25" y="75" width="65" height="4" rx="2" fill="#475569"/>
  <rect x="35" y="55" width="12" height="20" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="50" y="50" width="10" height="25" rx="2" fill="#ec4899" opacity="0.8"/>
  <rect x="63" y="58" width="14" height="17" rx="2" fill="#10b981" opacity="0.8"/>
  <!-- Small Flask on Shelf -->
  <path d="M78 65 L82 65 L83 75 L77 75 Z" fill="#fb923c" opacity="0.9"/>
  <circle cx="80" cy="62" r="3" fill="#fb923c" opacity="0.9"/>

  <!-- Holographic / Illuminated DNA Helix (Symbolizing Great Scientific Discovery) -->
  <g filter="url(#glow)" opacity="0.85">
    <path d="M185 60 Q170 80 185 100 Q200 120 185 140 Q170 160 185 180" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M185 60 Q200 80 185 100 Q170 120 185 140 Q200 160 185 180" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
    <!-- DNA rungs -->
    <line x1="178" y1="70" x2="192" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="174" y1="90" x2="196" y2="90" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="178" y1="110" x2="192" y2="110" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="174" y1="130" x2="196" y2="130" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="178" y1="150" x2="192" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="174" y1="170" x2="196" y2="170" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Golden Aura / Light Beam of "Greatness" framing the scientist -->
  <polygon points="120,20 60,220 180,220" fill="url(#gold-beam)" style="mix-blend-mode: screen;"/>

  <!-- Laboratory Desk / Workbench -->
  <rect x="20" y="180" width="200" height="12" rx="3" fill="#334155"/>
  <rect x="35" y="192" width="12" height="35" rx="2" fill="#1e293b"/>
  <rect x="193" y="192" width="12" height="35" rx="2" fill="#1e293b"/>

  <!-- Microscope on Desk -->
  <g transform="translate(45, 135)">
    <!-- Base -->
    <path d="M 0 45 L 25 45 L 20 40 L 5 40 Z" fill="#64748b"/>
    <!-- Stand / Arm -->
    <path d="M 12 40 L 12 15 C 12 10, 15 8, 20 10 L 25 12" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <!-- Stage -->
    <rect x="2" y="30" width="22" height="4" rx="1" fill="#cbd5e1"/>
    <!-- Eyepiece & Body Tube -->
    <path d="M 15 8 L 30 2" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <circle cx="31" cy="1" r="3" fill="#38bdf8"/>
    <!-- Light source -->
    <circle cx="12" cy="37" r="3" fill="#fbbf24"/>
  </g>

  <!-- Erlenmeyer Flask with Glowing Liquid -->
  <g transform="translate(155, 145)">
    <path d="M 15 0 L 21 0 L 21 10 L 30 32 C 33 38, 29 45, 22 45 L 14 45 C 7 45, 3 38, 6 32 L 15 10 Z" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <!-- Liquid inside -->
    <path d="M 9.5 28 C 11 26, 25 26, 26.5 28 C 29 34, 26 43, 21 43 L 15 43 C 10 43, 7 34, 9.5 28 Z" fill="url(#liquid-grad)"/>
    <!-- Bubbles -->
    <circle cx="16" cy="32" r="1.5" fill="#a7f3d0"/>
    <circle cx="21" cy="36" r="2" fill="#a7f3d0"/>
    <circle cx="18" cy="25" r="1" fill="#a7f3d0"/>
  </g>

  <!-- Main Subject: The Wise Scientist / Researcher -->
  <g transform="translate(85, 95)">
    <!-- Body / Lab Coat Torso -->
    <path d="M 20 50 L 50 50 L 60 90 L 10 90 Z" fill="#cbd5e1"/>
    <!-- Inner Dark Shirt / Tie -->
    <path d="M 30 50 L 40 50 L 38 75 L 32 75 Z" fill="#1e293b"/>
    <polygon points="35,52 38,62 32,62" fill="#ef4444"/> <!-- Red bow tie / tie detail -->

    <!-- Lab Coat Details & Lapels -->
    <path d="M 28 50 L 35 70 L 20 90" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 42 50 L 35 70 L 50 90" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Coat Buttons -->
    <circle cx="35" cy="73" r="1.5" fill="#64748b"/>
    <circle cx="35" cy="82" r="1.5" fill="#64748b"/>

    <!-- Arms & Hands in thoughtful/confident pose -->
    <!-- Left Arm (bent holding chin/goggles) -->
    <path d="M 18 53 C 5 55, -2 70, 10 75" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
    <circle cx="10" cy="75" r="5" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Right Arm (resting on desk or holding instrument) -->
    <path d="M 52 53 C 65 60, 60 75, 55 85" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
    <circle cx="55" cy="85" r="5" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Neck -->
    <rect x="28" y="40" width="14" height="12" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <!-- Hair (Wise, slightly graying/distinguished stylized hair) -->
    <path d="M 22 28 C 20 12, 50 10, 52 26 C 56 26, 58 32, 56 36 C 54 40, 50 35, 48 35 C 44 22, 28 22, 24 35 C 22 35, 18 36, 18 32 C 18 28, 22 28, 22 28 Z" fill="#94a3b8"/>
    <!-- Head Base -->
    <circle cx="35" cy="30" r="14" fill="#fbcfe8"/>

    <!-- Friendly facial expression with wise gentle smile and kind eyes -->
    <!-- Eyebrows (Thoughtful curve) -->
    <path d="M 26 24 Q 30 21 33 24" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 37 24 Q 40 21 44 24" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Scientific Glasses (Classic round frames) -->
    <circle cx="30" cy="28" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="40" cy="28" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="35" y1="28" x2="37" y2="28" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Eyes (Happy closed-lid crescents indicating wisdom and satisfaction) -->
    <path d="M 27 29 Q 30 32 33 29" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 37 29 Q 40 32 43 29" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Gentle Smile -->
    <path d="M 32 37 Q 35 40 38 37" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="25" cy="34" r="2.5" fill="#f43f5e" opacity="0.3"/>
    <circle cx="45" cy="34" r="2.5" fill="#f43f5e" opacity="0.3"/>
  </g>

  <!-- Foreground Sparkles / Excellence Dust (subtle golden particles) -->
  <circle cx="95" cy="70" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="135" cy="95" r="1.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="65" cy="115" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="110" cy="50" r="1.2" fill="#fef08a" opacity="0.8"/>
  <circle cx="150" cy="120" r="2.5" fill="#fbbf24" opacity="0.6"/>

  <!-- Desk Reflection / Accent Line -->
  <rect x="20" y="181" width="200" height="2" fill="#64748b" opacity="0.5"/>
</svg>