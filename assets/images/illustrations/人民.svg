<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Distant smoke and ruins -->
  <path d="M0 180 L60 140 L120 170 L180 130 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  <circle cx="180" cy="80" r="15" fill="#fb923c" opacity="0.3"/>
  <path d="M190 70 Q210 50 230 60" stroke="#475569" stroke-width="4" fill="none"/>
  
  <!-- The People (人民) -->
  <!-- Character 1: Standing firm -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="30" r="10" fill="#f8fafc"/>
    <path d="M10 45 L30 45 L25 80 L15 80 Z" fill="#38bdf8"/>
    <path d="M10 50 L0 70" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 50 L45 65" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2: Defending -->
  <g transform="translate(110, 110)">
    <circle cx="20" cy="30" r="10" fill="#f8fafc"/>
    <path d="M10 45 L30 45 L25 85 L15 85 Z" fill="#fbbf24"/>
    <path d="M20 45 L20 90" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 55 L35 55" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Character 3: Supporting -->
  <g transform="translate(160, 130)">
    <circle cx="20" cy="30" r="10" fill="#f8fafc"/>
    <path d="M10 45 L30 45 L25 75 L15 75 Z" fill="#10b981"/>
    <path d="M15 50 L5 80" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <path d="M25 50 L35 80" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Invaders (Abstract dark shapes) -->
  <path d="M220 150 L240 150 L230 180 Z" fill="#ec4899"/>
  <path d="M200 160 L220 160 L210 190 Z" fill="#ec4899"/>
  
  <!-- Shield/Barrier effect -->
  <path d="M40 110 Q120 90 200 110" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
</svg>