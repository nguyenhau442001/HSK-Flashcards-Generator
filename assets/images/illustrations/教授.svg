<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="chalkboardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="lampGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Ambient Lighting / Glow -->
  <circle cx="120" cy="90" r="80" fill="url(#lampGlow)" />

  <!-- Classroom / Office Interior: Chalkboard Background -->
  <rect x="24" y="24" width="192" height="110" rx="4" fill="url(#chalkboardGrad)" stroke="#334155" stroke-width="4" />
  
  <!-- Chalkboard Diagrams (Math/Science lines & equations stylized as vectors) -->
  <path d="M 40 50 Q 55 35 70 50 T 100 50" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" />
  <circle cx="85" cy="75" r="15" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="3,3" stroke-opacity="0.6" />
  <line x1="120" y1="40" x2="120" y2="90" stroke="#f472b6" stroke-width="2" stroke-opacity="0.6" />
  <line x1="100" y1="70" x2="140" y2="70" stroke="#f472b6" stroke-width="2" stroke-opacity="0.6" />
  <polygon points="160,80 180,50 190,75" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.6" />

  <!-- Bookshelf / Background Props -->
  <rect x="185" y="45" width="22" height="75" fill="#334155" rx="2" />
  <rect x="189" y="50" width="14" height="20" fill="#38bdf8" />
  <rect x="189" y="73" width="14" height="18" fill="#f43f5e" />
  <rect x="189" y="94" width="14" height="20" fill="#10b981" />

  <!-- Professor Character (Upper Body & Action) -->
  <!-- Body/Suit -->
  <path d="M 85 160 C 85 140 100 135 120 135 C 140 135 155 140 155 160 L 170 195 L 70 195 Z" fill="#1e3a8a" />
  <!-- Shirt & Tie -->
  <polygon points="110,135 130,135 120,165" fill="#f8fafc" />
  <polygon points="117,145 123,145 125,175 120,185 115,175" fill="#ef4444" />
  <!-- Suit Lapels -->
  <path d="M 110 135 L 95 175 L 105 175 Z" fill="#3b82f6" />
  <path d="M 130 135 L 145 175 L 135 175 Z" fill="#3b82f6" />

  <!-- Head & Face -->
  <circle cx="120" cy="105" r="22" fill="#fed7aa" />
  
  <!-- Hair (Distinguished gray/white sides with dark top, or classic smart professor hair) -->
  <path d="M 98 105 C 98 90 108 82 120 82 C 132 82 142 90 142 105 C 142 105 143 95 138 90 C 133 85 125 84 120 84 C 115 84 107 85 102 90 C 97 95 98 105 98 105 Z" fill="#cbd5e1" />

  <!-- Friendly Face Details -->
  <!-- Glasses -->
  <rect x="105" y="96" width="13" height="9" rx="2" fill="none" stroke="#475569" stroke-width="2" />
  <rect x="122" y="96" width="13" height="9" rx="2" fill="none" stroke="#475569" stroke-width="2" />
  <line x1="118" y1="100" x2="122" y2="100" stroke="#475569" stroke-width="2" />
  <!-- Eyes (Happy curved lines) -->
  <path d="M 108 100 Q 111 97 114 100" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M 125 100 Q 128 97 131 100" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Warm Smile -->
  <path d="M 113 113 Q 120 119 127 113" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />
  <!-- Cute Mustache / Cheeks -->
  <circle cx="110" cy="110" r="3" fill="#fdba74" opacity="0.6" />
  <circle cx="130" cy="110" r="3" fill="#fdba74" opacity="0.6" />
  <path d="M 115 111 Q 120 114 125 111" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Arms and Pointer / Gestures -->
  <!-- Left Arm (Holding pointer/chalk or gesturing) -->
  <path d="M 85 150 L 60 130 L 50 135" fill="none" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Pointer stick -->
  <line x1="45" y1="137" x2="25" y2="145" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
  <!-- Right Arm (Raised enthusiastically explaining) -->
  <path d="M 155 150 C 170 140 180 120 185 105" fill="none" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round" />
  <circle cx="185" cy="100" r="6" fill="#fed7aa" />

  <!-- Foreground Desk / Podium -->
  <rect x="20" y="180" width="200" height="40" rx="6" fill="url(#deskGrad)" stroke="#9a3412" stroke-width="2" />
  <rect x="30" y="170" width="180" height="14" rx="3" fill="#b45309" />

  <!-- Desk Props: Globe, Stack of Books, Coffee Mug -->
  <!-- Stack of Books -->
  <rect x="38" y="152" width="35" height="8" rx="2" fill="#0ea5e9" />
  <rect x="35" y="160" width="40" height="8" rx="2" fill="#e11d48" />
  <rect x="40" y="144" width="30" height="8" rx="2" fill="#10b981" />
  <!-- Bookmark ribbon -->
  <polygon points="45,152 48,152 48,158 46.5,156 45,158" fill="#facc15" />

  <!-- Coffee Mug with Steam -->
  <rect x="175" y="150" width="16" height="20" rx="3" fill="#f8fafc" />
  <path d="M 191 155 C 196 155 196 165 191 165" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <!-- Steam lines -->
  <path d="M 180 142 Q 183 138 180 134" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M 186 144 Q 189 140 186 136" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Globe (representing academic exploration) -->
  <circle cx="120" cy="148" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <!-- Globe Stand -->
  <path d="M 115 164 L 125 164" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M 120 164 L 120 170" stroke="#64748b" stroke-width="3" />
  <ellipse cx="120" cy="171" rx="8" ry="3" fill="#64748b" />
  <!-- Globe Continents (Stylized) -->
  <path d="M 112 140 Q 118 138 122 144 Q 120 152 114 150 Z" fill="#22c55e" opacity="0.8" />
  <path d="M 126 148 Q 130 146 132 152 Q 128 156 125 152 Z" fill="#22c55e" opacity="0.8" />
</svg>