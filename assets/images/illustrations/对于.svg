<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Amber Glow for Focus/Perspective -->
    <radialGradient id="amberGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="120" cy="110" r="100" fill="url(#amberGlow)"/>

  <!-- Background Environment / Walls -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="1.5" opacity="0.6"/>

  <!-- Perspective Art Easel / Central Subject Stage -->
  <g filter="url(#shadow)">
    <!-- Easel Legs & Back Support -->
    <line x1="120" y1="40" x2="80" y2="200" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="40" x2="160" y2="200" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="40" x2="135" y2="205" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Easel Shelf -->
    <rect x="65" y="150" width="110" height="8" rx="3" fill="#94a3b8"/>
    <rect x="75" y="158" width="90" height="4" rx="2" fill="#475569"/>
  </g>

  <!-- Central Canvas / "Venture/Perspective Object" -->
  <g filter="url(#shadow)">
    <!-- Canvas Outer Frame -->
    <rect x="72" y="65" width="96" height="88" rx="6" fill="#cbd5e1"/>
    <!-- Canvas Inner Art Board -->
    <rect x="76" y="69" width="88" height="80" rx="4" fill="#f8fafc"/>
    
    <!-- Creative Abstract Diagram Representing "Points of View / Perspectives" -->
    <!-- Center Point -->
    <circle cx="120" cy="109" r="6" fill="#f59e0b"/>

    <!-- Perspective Beam 1 (Left - Blue Accent) -->
    <path d="M 120 109 L 90 85 L 90 95 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M 90 85 C 95 85, 105 90, 110 98" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Perspective Beam 2 (Right - Pink Accent) -->
    <path d="M 120 109 L 150 125 L 150 135 Z" fill="#ec4899" opacity="0.8"/>
    <path d="M 150 135 C 145 130, 135 120, 130 115" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Perspective Beam 3 (Top/Center - Emerald Accent) -->
    <path d="M 120 109 L 125 78 L 135 78 Z" fill="#10b981" opacity="0.8"/>
    
    <!-- Floating Idea Nodes / Dynamic Elements -->
    <circle cx="95" cy="130" r="5" fill="#fb923c" filter="url(#shadow)"/>
    <circle cx="145" cy="85" r="4" fill="#38bdf8" filter="url(#shadow)"/>
    <path d="M 95 130 Q 110 120 120 109" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M 145 85 Q 130 95 120 109" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  </g>

  <!-- Foreground / Environment Props (Adding Tangible Context) -->
  <!-- Left Side: Stack of Reference Books/Different Angles -->
  <g filter="url(#shadow)">
    <!-- Bottom Book -->
    <rect x="30" y="170" width="38" height="12" rx="3" fill="#3b82f6"/>
    <rect x="30" y="173" width="38" height="2" fill="#93c5fd"/>
    <!-- Top Book (Tilted) -->
    <rect x="28" y="158" width="35" height="10" rx="3" fill="#10b981" transform="rotate(-8 45 163)"/>
    <rect x="28" y="160" width="35" height="2" fill="#6ee7b7" transform="rotate(-8 45 163)"/>
    <!-- Magnifying Glass leaning on books (Symbolizes 'focus towards') -->
    <circle cx="52" cy="148" r="10" fill="none" stroke="#f1f5f9" stroke-width="4"/>
    <circle cx="52" cy="148" r="10" fill="#38bdf8" fill-opacity="0.2"/>
    <line x1="59" y1="155" x2="68" y2="164" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Right Side: Coffee Cup and Plant (Warmth & Realism) -->
  <g filter="url(#shadow)">
    <!-- Small Desk Plant Pot -->
    <path d="M 178 175 L 186 195 L 204 195 L 212 175 Z" fill="#e2e8f0"/>
    <ellipse cx="195" cy="175" rx="17" ry="4" fill="#cbd5e1"/>
    <!-- Plant Leaves (Succulent/Sprout) -->
    <path d="M 195 175 C 190 160, 180 155, 175 150 C 185 155, 192 165, 195 175 Z" fill="#10b981"/>
    <path d="M 195 175 C 200 158, 210 150, 218 145 C 210 155, 200 165, 195 175 Z" fill="#34d399"/>
    <path d="M 195 175 C 193 155, 195 145, 195 138 C 195 148, 196 160, 195 175 Z" fill="#059669"/>

    <!-- Coffee Mug -->
    <rect x="145" y="172" width="22" height="24" rx="4" fill="#fb923c"/>
    <path d="M 167 178 C 174 178, 174 190, 167 190" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 150 172 L 153 166 L 163 166 L 166 172 Z" fill="#fed7aa"/>
    <!-- Steam / Warmth lines -->
    <path d="M 152 160 C 150 155, 156 152, 154 147" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 160 162 C 162 157, 158 154, 160 149" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Ambient Lighting Sparks / Details -->
  <circle cx="120" cy="35" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="70" cy="50" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="180" cy="60" r="2" fill="#ec4899" opacity="0.8"/>
  <path d="M 215 110 L 218 113 L 215 116 L 212 113 Z" fill="#fbbf24" opacity="0.6"/>
  <path d="M 25 100 L 27 102 L 25 104 L 23 102 Z" fill="#38bdf8" opacity="0.6"/>
</svg>