<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="#1e293b"/>

  <!-- Decorative Background Elements (Subtle connection lines) -->
  <path d="M 60 110 Q 100 80 140 110" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Central Topic Object: A Clipboard / Document representing "the issue/matter" -->
  <g transform="translate(75, 45)">
    <!-- Document shadow -->
    <rect x="2" y="4" width="50" height="64" rx="6" fill="#0f172a" opacity="0.4"/>
    <!-- Document Base -->
    <rect x="0" y="0" width="50" height="64" rx="6" fill="#f8fafc"/>
    <!-- Document Clip -->
    <rect x="15" y="-4" width="20" height="8" rx="3" fill="#cbd5e1"/>
    <!-- Document Lines (representing text/different views) -->
    <rect x="8" y="14" width="34" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="8" y="24" width="24" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="8" y="34" width="30" height="4" rx="2" fill="#e2e8f0"/>
  </g>

  <!-- Person A (Left - Pointing toward the issue, representing "Đối với") -->
  <g transform="translate(30, 95)">
    <!-- Body/Shoulders -->
    <path d="M 5 55 C 5 40, 15 35, 25 35 C 35 35, 45 40, 45 55 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="25" cy="18" r="12" fill="#fb923c"/>
    <!-- Pointing Arm extending right -->
    <path d="M 35 38 L 52 45 L 35 48 Z" fill="#fb923c"/>
  </g>

  <!-- Person B (Right - Observing/Responding with a different perspective) -->
  <g transform="translate(125, 95)">
    <!-- Body/Shoulders -->
    <path d="M 5 55 C 5 40, 15 35, 25 35 C 35 35, 45 40, 45 55 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="25" cy="18" r="12" fill="#f59e0b"/>
    <!-- Gesturing Arm -->
    <path d="M 15 38 L 2 46 L 18 48 Z" fill="#f59e0b"/>
  </g>

  <!-- Focus/Direction Indicator Arrow (Highlighting the "regarding / đối với" vector) -->
  <path d="M 72 85 L 85 85 L 80 80 M 85 85 L 80 90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>