<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall & Floor Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Back Wall & Interior Atmosphere -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="url(#wallGrad)"/>

  <!-- Background Office Partition / Glass Wall -->
  <path d="M 60 20 L 60 140 L 180 140 L 180 20 Z" fill="#0f172a" opacity="0.4"/>
  <!-- Glowing neon accent lines representing different "bùmén" (departments) on the glass -->
  <line x1="80" y1="40" x2="120" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="80" y1="52" x2="100" y2="52" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <line x1="130" y1="40" x2="160" y2="40" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="130" y1="52" x2="150" y2="52" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <line x1="80" y1="90" x2="160" y2="90" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Hanging Office Lights -->
  <path d="M 90 20 L 90 45" stroke="#475569" stroke-width="2"/>
  <circle cx="90" cy="48" r="6" fill="#fbbf24" filter="url(#glow)"/>
  
  <path d="M 150 20 L 150 45" stroke="#475569" stroke-width="2"/>
  <circle cx="150" cy="48" r="6" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Main Work Desk -->
  <path d="M 30 145 L 210 145 L 200 185 L 40 185 Z" fill="url(#deskGrad)"/>
  <path d="M 30 145 L 210 145 L 210 152 L 30 152 Z" fill="#475569"/>

  <!-- Department Props: Computer Setup (Sales / Operations Department feel) -->
  <!-- Monitor Stand -->
  <rect x="110" y="105" width="20" height="25" fill="#475569"/>
  <rect x="95" y="128" width="50" height="5" rx="2" fill="#64748b"/>
  <!-- Monitor Screen -->
  <rect x="75" y="70" width="90" height="40" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="79" y="74" width="82" height="32" rx="4" fill="url(#screenGrad)" opacity="0.9"/>
  <!-- UI Dashboard Charts on Screen -->
  <polyline points="85,98 95,90 105,94 115,82 125,86 135,78" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="135" cy="78" r="3" fill="#f59e0b"/>

  <!-- Secondary Monitor (Multi-department workflow) -->
  <rect x="170" y="80" width="45" height="55" rx="5" transform="rotate(-10 170 80)" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="174" y="84" width="37" height="47" rx="3" transform="rotate(-10 170 80)" fill="#10b981" opacity="0.8"/>
  <line x1="180" y1="95" x2="200" y2="95" stroke="#ffffff" stroke-width="3" stroke-linecap="round" transform="rotate(-10 170 80)"/>
  <line x1="180" y1="105" x2="195" y2="105" stroke="#ffffff" stroke-width="3" stroke-linecap="round" transform="rotate(-10 170 80)"/>

  <!-- Desk Plant (Adds lively ecosystem feel) -->
  <path d="M 45 145 C 45 130 55 130 55 145 Z" fill="#64748b"/>
  <ellipse cx="50" cy="144" rx="7" ry="3" fill="#334155"/>
  <path d="M 50 132 C 40 120 40 105 50 100 C 60 105 60 120 50 132 Z" fill="#10b981" filter="url(#glow)"/>
  <path d="M 50 132 C 35 125 30 115 42 110 C 47 118 48 125 50 132 Z" fill="#34d399"/>
  <path d="M 50 132 C 65 125 70 115 58 110 C 53 118 52 125 50 132 Z" fill="#059669"/>

  <!-- Coffee Mug -->
  <rect x="180" y="132" width="14" height="16" rx="3" fill="#fb923c"/>
  <path d="M 194 136 C 198 136 198 144 194 144" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam from coffee -->
  <path d="M 184 125 C 182 120 188 115 186 110" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Character / Employee working (Back of head & shoulders visible, interacting with department tasks) -->
  <!-- Body/Shirt -->
  <path d="M 95 185 L 90 155 C 105 145 135 145 150 155 L 145 185 Z" fill="#3b82f6"/>
  <!-- Collar -->
  <path d="M 110 152 L 120 162 L 130 152" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="113" y="140" width="14" height="15" fill="#fbcfe8"/>
  <!-- Head -->
  <circle cx="120" cy="125" r="16" fill="#fbcfe8"/>
  <!-- Hair Style -->
  <path d="M 104 125 C 104 110 136 110 136 125 C 136 118 128 112 120 112 C 112 112 104 118 104 125 Z" fill="#1e293b"/>

  <!-- Foreground / Ambient Lighting Effects -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>
</svg>