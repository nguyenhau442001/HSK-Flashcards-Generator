<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental background elements: Office/Civic space -->
  <path d="M40 130 L200 130" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />
  <circle cx="120" cy="70" r="45" fill="url(#glowGrad)" />
  
  <!-- Large Window showing city skyline silhouette -->
  <path d="M85 35 H155 V95 H85 Z" fill="#1e293b" stroke="#475569" stroke-width="2" rx="4" />
  <path d="M95 45 L105 75 L115 50 L130 80 L145 45" stroke="#334155" stroke-width="1.5" fill="none" opacity="0.8" />
  <line x1="120" y1="35" x2="120" y2="95" stroke="#475569" stroke-width="1.5" />

  <!-- Floating individual speech bubble / thought shapes representing personal choice/voice -->
  <g filter="url(#softGlow)">
    <circle cx="55" cy="85" r="12" fill="#38bdf8" opacity="0.15" />
    <path d="M52 82 H58 M55 79 V85" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" />

    <circle cx="185" cy="85" r="12" fill="#10b981" opacity="0.15" />
    <path d="M181 85 L184 88 L189 82" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
  </g>

  <!-- Person Left: Diverse Character 1 (Signing/Voting action) -->
  <g transform="translate(45, 105)">
    <!-- Body & Chair -->
    <path d="M25 70 C25 55 45 55 45 70 Z" fill="#0f172a" />
    <path d="M15 95 C15 75 55 75 55 95 Z" fill="#6366f1" />
    <!-- Head & Hair -->
    <circle cx="35" cy="40" r="14" fill="#fbcfe8" />
    <path d="M21 40 C21 28 49 28 49 40 C49 45 45 45 45 42 C45 35 25 35 25 42 C25 45 21 45 21 40 Z" fill="#f43f5e" />
    <!-- Arm writing -->
    <path d="M35 60 L45 75 L55 70" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Ballot Box / Desk element -->
  </g>

  <!-- Person Center: Diverse Character 2 (Confident speaking/standing) -->
  <g transform="translate(100, 95)">
    <!-- Body -->
    <path d="M10 115 C10 95 30 95 30 115 Z" fill="#334155" />
    <path d="M5 75 C5 60 35 60 35 75 Z" fill="#fb923c" />
    <!-- Head & Hair -->
    <circle cx="20" cy="40" r="13" fill="#fed7aa" />
    <path d="M10 38 C10 25 30 25 30 38 C28 35 12 35 10 38 Z" fill="#78350f" />
    <!-- Raised arm showing empowerment/expression -->
    <path d="M25 65 L38 50 L42 55" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Mic or badge symbol representing voice -->
    <circle cx="42" cy="52" r="3" fill="#fbbf24" />
  </g>

  <!-- Person Right: Diverse Character 3 (Holding document/rights paper) -->
  <g transform="translate(150, 105)">
    <!-- Body -->
    <path d="M20 115 C20 95 40 95 40 115 Z" fill="#0f172a" />
    <path d="M15 75 C15 60 45 60 45 75 Z" fill="#10b981" />
    <!-- Head & Hair -->
    <circle cx="30" cy="40" r="13" fill="#fed7aa" />
    <path d="M18 36 C20 25 40 25 42 36 C35 32 25 32 18 36 Z" fill="#0f172a" />
    <!-- Document prop -->
    <rect x="35" y="65" width="16" height="20" rx="2" fill="#f8fafc" transform="rotate(15 35 65)" />
    <line x1="39" y1="70" x2="47" y2="70" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="39" y1="74" x2="45" y2="74" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Foreground Desk / Surface spanning across -->
  <path d="M10 170 H230 V210 C230 216 225 220 220 220 H20 C14 220 10 216 10 210 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="2" />
  
  <!-- Desk Props: Scales of justice minimalist vector / Equality symbols representing rights -->
  <g transform="translate(110, 145)">
    <!-- Scale Stand -->
    <path d="M10 25 V5 H20 V25 Z" fill="#94a3b8" />
    <line x1="0" y1="5" x2="30" y2="5" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <!-- Left pan -->
    <path d="M0 5 L-8 18 H8 Z" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <ellipse cx="0" cy="18" rx="8" ry="3" fill="#f59e0b" />
    <!-- Right pan -->
    <path d="M30 5 L22 18 H38 Z" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <ellipse cx="30" cy="18" rx="8" ry="3" fill="#f59e0b" />
    <!-- Base -->
    <ellipse cx="15" cy="25" rx="12" ry="3" fill="#64748b" />
  </g>

  <!-- Additional desk items for rich real-world context -->
  <!-- Coffee cup -->
  <path d="M35 155 H55 V170 C55 173 52 175 50 175 H40 C37 175 35 173 35 170 Z" fill="#f8fafc" />
  <path d="M55 160 C58 160 60 162 60 165 C60 168 58 170 55 170" fill="none" stroke="#f8fafc" stroke-width="2" />
  <!-- Pen holder -->
  <rect x="180" y="150" width="15" height="20" rx="3" fill="#38bdf8" opacity="0.8" />
  <line x1="184" y1="150" x2="182" y2="142" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  <line x1="191" y1="150" x2="193" y2="140" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />

  <!-- Warm ambient light highlights -->
  <circle cx="120" cy="170" r="70" fill="#f59e0b" opacity="0.04" />
</svg>