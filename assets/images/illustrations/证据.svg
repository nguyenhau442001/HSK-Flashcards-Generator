<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Magnifying Glass Lens Glow -->
    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Document Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light from Desk Lamp -->
  <circle cx="160" cy="130" r="90" fill="url(#lamp-glow)"/>

  <!-- Background Environment: Bookshelf & Interior -->
  <g opacity="0.4">
    <!-- Bookshelf -->
    <rect x="18" y="40" width="60" height="110" rx="4" fill="#334155"/>
    <rect x="22" y="70" width="52" height="6" fill="#1e293b"/>
    <rect x="22" y="105" width="52" height="6" fill="#1e293b"/>
    <rect x="22" y="140" width="52" height="6" fill="#1e293b"/>
    <!-- Books on shelf -->
    <path d="M26 70 L26 50 C26 48 28 46 30 46 L36 46 C38 46 40 48 40 50 L40 70 Z" fill="#f43f5e"/>
    <path d="M42 70 L42 55 C42 53 44 51 46 51 L52 51 C54 51 56 53 56 55 L56 70 Z" fill="#38bdf8"/>
    <path d="M26 105 L26 85 C26 83 28 81 30 81 L38 81 C40 81 42 83 42 85 L42 105 Z" fill="#10b981"/>
  </g>

  <!-- Office Desk Surface -->
  <path d="M0 185 L240 185 L240 240 L0 240 Z" fill="#0f172a"/>
  <rect x="0" y="180" width="240" height="8" rx="2" fill="#334155"/>

  <!-- Desk Lamp -->
  <g>
    <!-- Lamp Base -->
    <ellipse cx="200" cy="180" rx="14" ry="5" fill="#64748b"/>
    <!-- Lamp Pole -->
    <path d="M197 180 L197 130 C197 120 185 110 175 110 L165 110" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Lamp Shade & Bulb -->
    <path d="M150 95 L180 95 L170 115 L160 115 Z" fill="#fbbf24"/>
    <circle cx="165" cy="118" r="4" fill="#fef08a"/>
  </g>

  <!-- Evidence Files / Documents on Desk -->
  <g filter="url(#shadow)">
    <!-- Document 1 (Bottom) -->
    <g transform="translate(60, 140) rotate(-8)">
      <rect width="65" height="80" rx="3" fill="#f8fafc"/>
      <!-- Mock text lines -->
      <rect x="10" y="12" width="30" height="4" rx="2" fill="#cbd5e1"/>
      <rect x="10" y="22" width="45" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect x="10" y="30" width="40" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect x="10" y="38" width="45" height="3" rx="1.5" fill="#e2e8f0"/>
      <!-- Red Stamp / Fingerprint accent indicating evidence -->
      <circle cx="45" cy="60" r="10" fill="#ef4444" opacity="0.8"/>
      <path d="M41 60 L44 63 L51 56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Document 2 (Top - Main Evidence) -->
    <g transform="translate(85, 120) rotate(5)">
      <rect width="70" height="85" rx="3" fill="#ffffff"/>
      <!-- Photo Placeholder -->
      <rect x="12" y="12" width="46" height="35" rx="2" fill="#e2e8f0"/>
      <circle cx="35" cy="25" r="8" fill="#94a3b8"/>
      <path d="M22 40 C22 35 28 35 35 35 C42 35 48 35 48 40 Z" fill="#94a3b8"/>
      <!-- Text Lines -->
      <rect x="12" y="55" width="35" height="3" rx="1.5" fill="#cbd5e1"/>
      <rect x="12" y="63" width="45" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect x="12" y="71" width="25" height="3" rx="1.5" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- Character: Investigator / Requesting Evidence (Upper Body) -->
  <g>
    <!-- Character Body & Suit Jacket -->
    <path d="M25 215 C25 190 45 175 75 175 C105 175 125 190 125 215 Z" fill="#1e293b"/>
    <path d="M50 175 L75 205 L100 175 Z" fill="#ffffff"/> <!-- Shirt V-neck -->
    <path d="M72 185 L78 185 L80 205 L70 205 Z" fill="#ef4444"/> <!-- Tie -->
    <!-- Jacket lapels -->
    <path d="M50 175 L65 215 L50 215 Z" fill="#334155"/>
    <path d="M100 175 L85 215 L100 215 Z" fill="#334155"/>

    <!-- Neck & Head -->
    <rect x="65" y="145" width="20" height="35" fill="#fbcfe8"/>
    <!-- Head Shape -->
    <circle cx="75" cy="120" r="26" fill="#fbcfe8"/>

    <!-- Hair -->
    <path d="M49 120 C49 100 60 92 75 92 C90 92 101 100 101 120 C101 125 99 123 99 115 C99 100 89 96 75 96 C61 96 51 100 51 115 C51 123 49 125 49 120 Z" fill="#334155"/>

    <!-- Serious/Requesting Facial Expression -->
    <!-- Eyebrows (slanted slightly for intense/asking look) -->
    <path d="M60 110 L68 113" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M82 113 L90 110" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="64" cy="118" r="3" fill="#1e293b"/>
    <circle cx="86" cy="118" r="3" fill="#1e293b"/>
    <!-- Determined / Requesting Mouth (Open slightly as if speaking "Qing ti gong...") -->
    <path d="M70 132 C73 136 77 136 80 132 Z" fill="#991b1b"/>

    <!-- Pointing Arm / Hand gesturing toward the evidence -->
    <!-- Upper arm and forearm -->
    <path d="M115 185 C130 175 145 160 155 150" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M115 185 C130 175 145 160 155 150" stroke="#fbcfe8" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Hand pointing index finger -->
    <circle cx="158" cy="146" r="6" fill="#fbcfe8"/>
    <path d="M158 142 L172 135 L162 148 Z" fill="#fbcfe8"/>
  </g>

  <!-- Foreground Props: Magnifying Glass hovering over evidence (Highlighting 'Evidence') -->
  <g filter="url(#shadow)" transform="translate(95, 80)">
    <!-- Glass Lens Circle -->
    <circle cx="30" cy="30" r="24" fill="url(#lens-grad)" stroke="#94a3b8" stroke-width="5"/>
    <!-- Glass Reflection Highlight -->
    <path d="M15 18 C20 14 26 14 30 16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Handle -->
    <path d="M45 45 L65 65" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <path d="M45 45 L65 65" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>