<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Main Subject: A curious character pointing at a mysterious glowing gift box -->
  <!-- The "ya" (particle of suggestion/inquiry) is represented by the inquisitive gesture -->
  
  <!-- Gift Box -->
  <rect x="130" y="140" width="60" height="60" rx="8" fill="#f59e0b"/>
  <rect x="155" y="140" width="10" height="60" fill="#fbbf24"/>
  <rect x="130" y="165" width="60" height="10" fill="#fbbf24"/>
  <circle cx="160" cy="130" r="15" fill="#fb923c" stroke="#f59e0b" stroke-width="4"/>
  
  <!-- Character Hand/Arm -->
  <path d="M80 150 C 90 130, 110 130, 120 145" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="125" cy="148" r="8" fill="#38bdf8"/>
  
  <!-- Character Head (Inquisitive expression) -->
  <circle cx="70" cy="120" r="35" fill="#e2e8f0"/>
  <circle cx="60" cy="110" r="5" fill="#0f172a"/>
  <circle cx="85" cy="110" r="5" fill="#0f172a"/>
  <path d="M60 135 Q 72 145 85 135" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Atmospheric Details (Sparkles/Curiosity) -->
  <circle cx="180" cy="110" r="3" fill="#fbbf24"/>
  <circle cx="195" cy="125" r="5" fill="#fbbf24"/>
  <circle cx="210" cy="100" r="2" fill="#fbbf24"/>
  
  <!-- Decorative elements -->
  <path d="M20 200 L40 180 M30 210 L50 190" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="50" r="20" fill="#ec4899" opacity="0.3"/>
</svg>