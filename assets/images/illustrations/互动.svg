<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Classroom Background Elements -->
  <rect x="20" y="40" width="200" height="100" rx="4" fill="#334155" opacity="0.5"/>
  <rect x="30" y="50" width="180" height="80" rx="2" fill="#1e293b"/>
  <path d="M40 70 L60 70 M40 85 L80 85 M40 100 L70 100" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Teacher -->
  <g transform="translate(160, 110)">
    <circle cx="0" cy="-40" r="15" fill="#fbbf24"/>
    <path d="M-5 -35 Q0 -30 5 -35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="-20" y="-25" width="40" height="50" rx="10" fill="#38bdf8"/>
    <path d="M-20 -10 L-35 10 M20 -10 L35 10" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M10 -20 L25 -5" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Student -->
  <g transform="translate(80, 130)">
    <circle cx="0" cy="-40" r="12" fill="#fca5a5"/>
    <rect x="-15" y="-28" width="30" height="40" rx="8" fill="#ec4899"/>
    <path d="M-10 -15 L-20 5 M10 -15 L20 5" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <path d="M-5 -20 L5 -20" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Interaction Spark -->
  <g transform="translate(120, 90)">
    <path d="M0 0 L10 -10 M-10 -10 L0 0 M0 0 L-10 10 M10 10 L0 0" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#fb923c"/>
  </g>
  
  <!-- Desk -->
  <rect x="40" y="160" width="160" height="20" rx="4" fill="#475569"/>
  <rect x="50" y="180" width="10" height="40" fill="#334155"/>
  <rect x="180" y="180" width="10" height="40" fill="#334155"/>
  
  <!-- Books -->
  <rect x="60" y="145" width="30" height="15" rx="2" fill="#10b981"/>
  <rect x="100" y="140" width="30" height="20" rx="2" fill="#fbbf24"/>
</svg>