<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="50" y="150" width="10" height="60" fill="#475569"/>
  <rect x="180" y="150" width="10" height="60" fill="#475569"/>
  
  <!-- Laptop Screen showing a new project chart -->
  <rect x="70" y="90" width="100" height="60" rx="4" fill="#cbd5e1"/>
  <path d="M80 130 L100 110 L120 120 L150 100" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="150" cy="100" r="3" fill="#f59e0b"/>
  
  <!-- Characters -->
  <!-- Person 1 (Pointing) -->
  <g transform="translate(40, 80)">
    <circle cx="30" cy="30" r="12" fill="#fbbf24"/>
    <path d="M30 42 L30 80 M30 50 L15 65 M30 50 L45 65" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 55 L50 45" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 (Listening/Nodding) -->
  <g transform="translate(140, 80)">
    <circle cx="30" cy="30" r="12" fill="#38bdf8"/>
    <path d="M30 42 L30 80 M30 50 L15 70 M30 50 L45 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements (New Business Launch) -->
  <circle cx="190" cy="60" r="15" fill="#10b981" opacity="0.6"/>
  <path d="M185 60 L190 65 L195 55" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <rect x="20" y="180" width="30" height="30" rx="5" fill="#ec4899" opacity="0.3"/>
  <rect x="210" y="100" width="20" height="20" rx="5" fill="#fb923c" opacity="0.3"/>
  
  <!-- Floating abstract growth indicators -->
  <path d="M200 120 Q210 110 220 120" stroke="#fb923c" stroke-width="2" fill="none"/>
  <path d="M20 170 Q30 160 40 170" stroke="#ec4899" stroke-width="2" fill="none"/>
</svg>