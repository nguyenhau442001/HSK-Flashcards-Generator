<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Temporary Light -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Cardboard texture gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="boxFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Metallic/Construction accents -->
    <linearGradient id="metalPole" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Moving/Temporary Office Context) -->
  <!-- Background wall seam / industrial vibe -->
  <path d="M 0 160 L 240 160" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
  
  <!-- Stack of unpacked boxes in the corner -->
  <rect x="25" y="115" width="45" height="45" rx="4" fill="#92400e" opacity="0.6"/>
  <rect x="15" y="130" width="50" height="35" rx="4" fill="#b45309" opacity="0.8"/>

  <!-- Floor Surface -->
  <path d="M 0 165 L 240 165 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <!-- Floor line reflection -->
  <path d="M 0 165 L 240 165" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

  <!-- Temporary Light Source (Clamp Lamp mounted on a shelf/pole) -->
  <circle cx="120" cy="50" r="60" fill="url(#lampGlow)"/>
  <!-- Lamp arm & clamp -->
  <path d="M 190 20 L 160 40 L 140 35" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lamp shade -->
  <path d="M 125 30 L 155 45 L 145 65 L 115 50 Z" fill="#38bdf8"/>
  <ellipse cx="130" cy="57" rx="8" ry="6" fill="#fef08a"/>
  <!-- Light beam cone -->
  <polygon points="130,57 60,180 180,180" fill="#fbbf24" opacity="0.08"/>

  <!-- MAIN SUBJECT: A "Temporary" Workstation Setup (Improvised Desk) -->
  
  <!-- Trestle legs -->
  <path d="M 65 165 L 80 100 L 95 165 Z" fill="#334155"/>
  <path d="M 145 165 L 160 100 L 175 165 Z" fill="#334155"/>
  <line x1="72" y1="135" x2="88" y2="135" stroke="#475569" stroke-width="3"/>
  <line x1="152" y1="135" x2="168" y2="135" stroke="#475569" stroke-width="3"/>

  <!-- Improvised Tabletop (A wide wooden plank or folded table) -->
  <rect x="45" y="94" width="150" height="12" rx="3" fill="#cbd5e1"/>
  <rect x="40" y="90" width="160" height="6" rx="2" fill="#e2e8f0"/>

  <!-- PROPS ON THE IMPROVISED DESK (Context for 'temporary' situation) -->
  
  <!-- 1. Open Cardboard Moving Box (Acting as temporary storage) -->
  <path d="M 55 90 L 65 55 L 105 55 L 115 90 Z" fill="url(#boxGrad)"/>
  <!-- Box flaps open outward -->
  <path d="M 65 55 L 45 40 L 55 90" fill="url(#boxFlap)" opacity="0.9"/>
  <path d="M 105 55 L 125 40 L 115 90" fill="url(#boxFlap)" opacity="0.7"/>
  <!-- Stuff poking out of the temporary box (rolled up blueprints/posters) -->
  <circle cx="80" cy="50" r="6" fill="#10b981"/>
  <path d="M 75 45 L 85 25" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <circle cx="95" cy="52" r="5" fill="#f43f5e"/>
  <path d="M 92 48 L 102 28" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>

  <!-- 2. Laptop on a temporary stack of books -->
  <!-- Stack of books -->
  <rect x="125" y="82" width="45" height="8" rx="1" fill="#ec4899"/>
  <rect x="123" y="74" width="48" height="8" rx="1" fill="#8b5cf6"/>
  <!-- Laptop base -->
  <path d="M 115 74 L 130 50 L 175 50 L 165 74 Z" fill="#94a3b8"/>
  <!-- Laptop screen (glowing with activity) -->
  <path d="M 132 52 L 140 18 L 172 18 L 168 52 Z" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <!-- Screen UI graphics (abstract, no text) -->
  <rect x="144" y="24" width="16" height="10" rx="2" fill="#38bdf8"/>
  <circle cx="152" cy="38" r="3" fill="#10b981"/>

  <!-- 3. Coffee Mug (Essential for temporary/urgent setups) -->
  <rect x="95" y="75" width="12" height="15" rx="2" fill="#f8fafc"/>
  <path d="M 107 79 C 112 79, 112 87, 107 87" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <!-- Steam from coffee -->
  <path d="M 98 70 Q 101 64 98 58" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 103 72 Q 106 66 103 60" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- 4. "Caution / Temporary" Sign (A-frame warning sign on the floor to anchor the concept) -->
  <g transform="translate(180, 125)">
    <!-- A-Frame Structure -->
    <polygon points="15,0 0,40 30,40" fill="#f59e0b"/>
    <polygon points="15,5 5,35 25,35" fill="#1e293b"/>
    <!-- Warning exclamation icon (abstract symbol, perfectly HSK app appropriate) -->
    <circle cx="15" cy="18" r="2" fill="#fbbf24"/>
    <path d="M 15 22 L 15 28" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Particles / Dust motes in the warm light beam -->
  <circle cx="95" cy="110" r="1.5" fill="#fef08a" opacity="0.7"/>
  <circle cx="110" cy="130" r="2" fill="#fef08a" opacity="0.5"/>
  <circle cx="75" cy="140" r="1" fill="#fef08a" opacity="0.8"/>
  <circle cx="135" cy="115" r="1.5" fill="#fef08a" opacity="0.6"/>

  <!-- Border Frame / Outer Glow subtle constraint -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>