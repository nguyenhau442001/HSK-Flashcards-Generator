<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Subway Interior Structure -->
  <rect x="20" y="40" width="200" height="160" rx="8" fill="#334155"/>
  <rect x="25" y="45" width="190" height="150" rx="6" fill="#1e293b"/>
  <rect x="20" y="180" width="200" height="20" fill="#475569"/>
  
  <!-- Subway Handrails -->
  <path d="M60 45 L60 100 M120 45 L120 100 M180 45 L180 100" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="100" r="8" stroke="#94a3b8" stroke-width="4" fill="none"/>
  <circle cx="120" cy="100" r="8" stroke="#94a3b8" stroke-width="4" fill="none"/>
  <circle cx="180" cy="100" r="8" stroke="#94a3b8" stroke-width="4" fill="none"/>

  <!-- Characters (Crowded) -->
  <!-- Person 1 -->
  <circle cx="70" cy="130" r="12" fill="#fbbf24"/>
  <rect x="58" y="142" width="24" height="40" rx="4" fill="#38bdf8"/>
  
  <!-- Person 2 -->
  <circle cx="120" cy="120" r="12" fill="#fb923c"/>
  <rect x="108" y="132" width="24" height="50" rx="4" fill="#ec4899"/>
  
  <!-- Person 3 -->
  <circle cx="170" cy="135" r="12" fill="#10b981"/>
  <rect x="158" y="147" width="24" height="45" rx="4" fill="#fbbf24"/>
  
  <!-- Person 4 (Back) -->
  <circle cx="95" cy="150" r="10" fill="#94a3b8"/>
  <rect x="85" y="160" width="20" height="30" rx="4" fill="#64748b"/>

  <!-- Motion/Crowd Lines -->
  <path d="M40 60 L50 70 M200 60 L190 70" stroke="#f8fafc" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Window view -->
  <rect x="40" y="55" width="160" height="30" rx="4" fill="#0f172a" opacity="0.5"/>
  <rect x="45" y="60" width="30" height="20" rx="2" fill="#334155"/>
  <rect x="85" y="60" width="30" height="20" rx="2" fill="#334155"/>
  <rect x="125" y="60" width="30" height="20" rx="2" fill="#334155"/>
  <rect x="165" y="60" width="30" height="20" rx="2" fill="#334155"/>
</svg>