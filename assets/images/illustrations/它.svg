<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor/Surface -->
  <path d="M0 180 Q120 160 240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The Cat (Subject: 它) -->
  <g transform="translate(60, 80)">
    <!-- Tail -->
    <path d="M100 80 Q130 80 120 40" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <ellipse cx="60" cy="80" rx="50" ry="40" fill="#f59e0b"/>
    <!-- Head -->
    <circle cx="60" cy="40" r="35" fill="#f59e0b"/>
    <!-- Ears -->
    <path d="M35 15 L25 -10 L50 15 Z" fill="#f59e0b"/>
    <path d="M85 15 L95 -10 L70 15 Z" fill="#f59e0b"/>
    <!-- Eyes -->
    <circle cx="45" cy="35" r="5" fill="#0f172a"/>
    <circle cx="75" cy="35" r="5" fill="#0f172a"/>
    <!-- Nose -->
    <path d="M60 45 L55 50 L65 50 Z" fill="#ec4899"/>
  </g>
  
  <!-- Context Props: Yarn Ball -->
  <circle cx="170" cy="190" r="25" fill="#38bdf8"/>
  <path d="M170 165 Q190 180 170 215" stroke="#38bdf8" stroke-width="4" fill="none"/>
  <path d="M145 190 Q170 170 195 190" stroke="#38bdf8" stroke-width="4" fill="none"/>
  
  <!-- Atmospheric Accents -->
  <circle cx="40" cy="120" r="3" fill="#fb923c" opacity="0.6"/>
  <circle cx="200" cy="60" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="150" cy="40" r="2" fill="#ffffff" opacity="0.3"/>
</svg>