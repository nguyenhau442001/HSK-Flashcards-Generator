<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Stage Lights -->
  <circle cx="60" cy="0" r="80" fill="#f59e0b" opacity="0.15"/>
  <circle cx="180" cy="0" r="80" fill="#38bdf8" opacity="0.1"/>
  
  <!-- Spotlight Beam -->
  <path d="M120 0 L60 240 L180 240 Z" fill="#ffffff" opacity="0.05"/>
  
  <!-- Actor Figure -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-20 80 C-20 40, 20 40, 20 80 L15 110 L-15 110 Z" fill="#fb923c"/>
    <!-- Arms -->
    <path d="M-25 50 L-40 80 M25 50 L40 80" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-22 15 C-25 -10, 25 -10, 22 15 C15 5, -15 5, -22 15" fill="#1e293b"/>
    <!-- Face Features -->
    <circle cx="-8" cy="15" r="3" fill="#0f172a"/>
    <circle cx="8" cy="15" r="3" fill="#0f172a"/>
    <path d="M-8 25 Q0 32 8 25" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Stage Props -->
  <rect x="20" y="210" width="200" height="30" fill="#334155"/>
  <rect x="40" y="200" width="30" height="10" fill="#64748b"/>
  <rect x="170" y="200" width="30" height="10" fill="#64748b"/>
  
  <!-- Dramatic Accents -->
  <circle cx="190" cy="60" r="6" fill="#ec4899"/>
  <circle cx="50" cy="80" r="4" fill="#10b981"/>
  <path d="M180 120 L190 110 L200 120 L190 130 Z" fill="#fbbf24"/>
</svg>