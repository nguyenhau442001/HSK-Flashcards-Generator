<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glass Bottle Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Water Liquid Gradient (Bright, full) -->
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Water Surface Highlight -->
    <linearGradient id="surface-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%\" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment / Window & Ambient Glow -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />
  
  <!-- Wooden/Modern Surface Table -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="url(#table-grad)" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2" opacity="0.6" />

  <!-- Secondary Background Prop: Small Plant in Pot -->
  <g transform="translate(45, 140)">
    <!-- Pot -->
    <path d="M 8 15 L 22 15 L 26 35 L 4 35 Z" fill="#cbd5e1" />
    <ellipse cx="15" cy="15" rx="7" ry="2" fill="#94a3b8" />
    <!-- Plant Leaves -->
    <path d="M 15 15 Q 10 0 0 5 Q 8 12 15 15 Z" fill="#10b981" />
    <path d="M 15 15 Q 22 -2 30 5 Q 20 12 15 15 Z" fill="#34d399" />
    <path d="M 15 15 Q 15 -5 18 -8 Q 18 8 15 15 Z" fill="#059669" />
  </g>

  <!-- Secondary Background Prop: Wooden Coaster -->
  <ellipse cx="120" cy="182" rx="42" ry="12" fill="#64748b" opacity="0.8" />
  <ellipse cx="120" cy="180" rx="40" ry="10" fill="#94a3b8" />

  <!-- MAIN SUBJECT: The Glass Bottle / Carafe (Representing '满' - Full) -->
  <g filter="url(#shadow)">
    
    <!-- Bottle Base/Body Back Contour -->
    <path d="M 95 70 
             C 90 70, 85 90, 85 110 
             L 85 160 
             C 85 173, 98 175, 120 175 
             C 142 175, 155 173, 155 160 
             L 155 110 
             C 155 90, 150 70, 145 70 Z" 
          fill="none" />

    <!-- WATER FILLING (Completely FULL to the brim) -->
    <path d="M 86 93
             L 86 160
             C 86 172, 98 174, 120 174
             C 142 174, 154 172, 154 160
             L 154 93
             Z" 
          fill="url(#water-grad)" />

    <!-- Surface Meniscus (Water level right at the top narrow neck, slightly domed / bulging full) -->
    <path d="M 99 93 C 109 95, 131 95, 141 93 C 131 91, 109 91, 99 93 Z" fill="url(#surface-grad)" />

    <!-- Dynamic Action Splash / Overflow Droplets (Indicating overfilled/completely full action) -->
    <circle cx="112" cy="78" r="4" fill="#38bdf8" opacity="0.9" />
    <path d="M 112 74 C 113 72, 115 72, 116 74" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="132" cy="82" r="2.5" fill="#7dd3fc" opacity="0.8" />
    <circle cx="123" cy="70" r="1.5" fill="#bae6fd" opacity="0.9" />

    <!-- Glass Bottle Outer Shell -->
    <path d="M 100 55 
             L 140 55 
             L 140 70 
             C 148 75, 155 90, 155 110 
             L 155 160 
             C 155 174, 142 176, 120 176 
             C 98 176, 85 174, 85 160 
             L 85 110 
             C 85 90, 92 75, 100 70 
             Z" 
          fill="url(#glass-grad)" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-opacity="0.8" />

    <!-- Bottle Neck Opening / Rim -->
    <ellipse cx="120" cy="55" rx="20" ry="5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9" />
    <ellipse cx="120" cy="55" rx="18" ry="3.5" fill="#bae6fd" opacity="0.4" />

    <!-- Glass Highlights & Reflections (Glossy 2D Vector style) -->
    <!-- Long vertical left highlight -->
    <path d="M 91 100 L 91 155" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" fill="none" />
    <!-- Soft wide right highlight -->
    <path d="M 147 110 L 147 150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4" fill="none" />
    <!-- Curved shoulder reflection -->
    <path d="M 104 74 C 112 78, 120 78, 128 75" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" fill="none" />

    <!-- Subtly Floating Air Bubbles Inside Water (Showing fullness and life) -->
    <circle cx="105" cy="130" r="3" fill="#ffffff" opacity="0.6" />
    <circle cx="105" cy="130" r="1" fill="#ffffff" opacity="0.9" />
    
    <circle cx="135" cy="145" r="4" fill="#ffffff" opacity="0.5" />
    <circle cx="135" cy="145" r="1.5" fill="#ffffff" opacity="0.8" />
    
    <circle cx="120" cy="115" r="2" fill="#ffffff" opacity="0.7" />
    
    <circle cx="128" cy="165" r="3.5" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Ambient Sparkles / Action Accents (Emphasizing the state of being full/complete) -->
  <g transform="translate(165, 95)">
    <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <circle cx="10" cy="10" r="2" fill="#fef08a" />
  </g>
  <g transform="translate(50, 115) scale(0.6)">
    <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  </g>
  <g transform="translate(150, 45) scale(0.7)">
    <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

</svg>