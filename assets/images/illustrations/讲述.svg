<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Screen/Projection Area -->
  <rect x="30" y="40" width="180" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- Sci-fi Time Travel Visuals on Screen -->
  <path d="M120 50 L150 90 L120 130 L90 90 Z" fill="#fb923c" opacity="0.6"/>
  <circle cx="120" cy="90" r="15" fill="#38bdf8"/>
  <path d="M60 60 L80 80 M180 60 L160 80 M60 120 L80 100 M180 120 L160 100" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Characters -->
  <!-- Person 1 -->
  <g transform="translate(70, 160)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M10 40 Q20 60 30 40 L30 80 L10 80 Z" fill="#ec4899"/>
    <rect x="15" y="80" width="10" height="20" fill="#334155"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(130, 160)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M10 40 Q20 60 30 40 L30 80 L10 80 Z" fill="#38bdf8"/>
    <rect x="15" y="80" width="10" height="20" fill="#334155"/>
  </g>
  
  <!-- Couch -->
  <path d="M40 180 L200 180 Q210 180 210 190 L210 210 Q210 220 200 220 L40 220 Q30 220 30 210 L30 190 Q30 180 40 180 Z" fill="#475569"/>
  
  <!-- Ambient Light Glow -->
  <ellipse cx="120" cy="90" rx="60" ry="30" fill="#fb923c" opacity="0.1"/>
</svg>