<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Mirror -->
  <rect x="70" y="40" width="100" height="120" rx="10" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="75" y="45" width="90" height="110" rx="6" fill="#e2e8f0"/>
  
  <!-- Character in Mirror -->
  <circle cx="120" cy="75" r="25" fill="#fde68a"/>
  <path d="M100 70 Q120 50 140 70" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <path d="M105 80 Q120 95 135 80" fill="#78350f"/>
  
  <!-- Barber/Stylist Hands -->
  <g transform="translate(140, 100)">
    <path d="M0 0 L20 10 L10 20 Z" fill="#fb923c"/>
    <path d="M15 5 L40 -10 L50 0 L25 15 Z" fill="#38bdf8" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M15 5 L40 20 L50 10 L25 -5 Z" fill="#38bdf8" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="15" cy="5" r="3" fill="#1e293b"/>
  </g>
  
  <!-- Chair -->
  <rect x="80" y="160" width="80" height="20" rx="5" fill="#475569"/>
  <rect x="110" y="180" width="20" height="30" fill="#334155"/>
  
  <!-- Falling Hair -->
  <path d="M115 110 Q120 130 110 140" stroke="#78350f" stroke-width="2" fill="none"/>
  <path d="M125 110 Q130 135 120 145" stroke="#78350f" stroke-width="2" fill="none"/>
  
  <!-- Barber Cape -->
  <path d="M90 100 L150 100 L160 160 L80 160 Z" fill="#ec4899" opacity="0.8"/>
  
  <!-- Ambient light -->
  <circle cx="200" cy="40" r="60" fill="#f59e0b" opacity="0.05"/>
</svg>