<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Bathroom Mirror/Wall -->
  <rect x="40" y="30" width="160" height="180" rx="10" fill="#334155" opacity="0.3"/>
  <circle cx="120" cy="90" r="45" fill="#e2e8f0" opacity="0.1"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <path d="M40 120c0-20 15-35 35-35s35 15 35 35v40H40z" fill="#fde68a"/>
    <circle cx="75" cy="65" r="25" fill="#fde68a"/>
    <path d="M60 60h5m20 0h5m-25 10s5 5 10 5 10-5 10-5" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Electric Toothbrush -->
  <g transform="translate(130, 110) rotate(15)">
    <rect x="0" y="0" width="12" height="60" rx="6" fill="#38bdf8"/>
    <rect x="2" y="5" width="8" height="15" rx="2" fill="#e2e8f0"/>
    <circle cx="6" cy="55" r="4" fill="#fb923c"/>
    <!-- Motion lines -->
    <path d="M15 10h10M18 5h8M15 15h12" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Shelf/Sink area -->
  <rect x="30" y="170" width="180" height="10" rx="5" fill="#64748b"/>
  <ellipse cx="180" cy="175" rx="15" ry="5" fill="#10b981" opacity="0.6"/>
  
  <!-- Decorative bubbles/sparkles -->
  <circle cx="150" cy="70" r="3" fill="#ec4899"/>
  <circle cx="170" cy="90" r="2" fill="#38bdf8"/>
  <circle cx="190" cy="60" r="4" fill="#fbbf24"/>
</svg>