<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Forest Background Layers -->
  <path d="M0 240 L0 120 Q60 80 120 120 T240 120 L240 240 Z" fill="#1e293b" opacity="0.8"/>
  
  <!-- Various Trees -->
  <!-- Tree 1: Tall Pine -->
  <path d="M30 240 L30 100 M20 130 L30 100 L40 130 M20 150 L30 120 L40 150" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Tree 2: Broad Leaf -->
  <circle cx="80" cy="90" r="25" fill="#38bdf8"/>
  <path d="M80 115 L80 240" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Tree 3: Golden Autumn -->
  <path d="M160 240 L160 140 L140 160 M160 140 L180 160" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <circle cx="160" cy="130" r="20" fill="#f59e0b"/>
  
  <!-- Tree 4: Small Bush/Tree -->
  <path d="M210 240 L210 180" stroke="#10b981" stroke-width="4"/>
  <circle cx="210" cy="170" r="15" fill="#10b981"/>

  <!-- Character: Explorer observing -->
  <g transform="translate(110, 180)">
    <!-- Body -->
    <path d="M0 0 L10 0 L8 60 L-8 60 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="0" cy="-15" r="12" fill="#fde68a"/>
    <!-- Binoculars -->
    <rect x="-10" y="-18" width="20" height="8" rx="2" fill="#334155"/>
    <!-- Legs -->
    <path d="M-5 60 L-5 80 M5 60 L5 80" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ground details -->
  <circle cx="40" cy="220" r="2" fill="#fb923c"/>
  <circle cx="190" cy="230" r="3" fill="#10b981"/>
  <path d="M0 235 Q120 225 240 235" stroke="#334155" stroke-width="2" fill="none"/>
</svg>