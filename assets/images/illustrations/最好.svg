<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Clock indicating early morning -->
    <circle cx="160" cy="20" r="15" fill="#334155"/>
    <path d="M160 10 L160 20 L168 20" stroke="#fbbf24" stroke-width="2" fill="none"/>
    
    <!-- Character: Determined traveler pointing at watch -->
    <g transform="translate(0, 20)">
      <path d="M40 120 Q60 100 80 120 L70 160 L50 160 Z" fill="#38bdf8"/>
      <circle cx="60" cy="80" r="25" fill="#fde68a"/>
      <path d="M50 75 Q50 70 55 70 Q60 70 60 75" stroke="#475569" stroke-width="2" fill="none"/>
      <path d="M65 75 Q65 70 70 70 Q75 70 75 75" stroke="#475569" stroke-width="2" fill="none"/>
      <path d="M55 90 Q60 95 65 90" stroke="#ec4899" stroke-width="2" fill="none"/>
      
      <!-- Arm pointing -->
      <path d="M85 90 L110 70" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="115" cy="65" r="8" fill="#fde68a"/>
    </g>
    
    <!-- Suitcase -->
    <rect x="110" y="110" width="40" height="50" rx="4" fill="#fb923c"/>
    <rect x="120" y="100" width="20" height="10" rx="2" fill="#fb923c"/>
    
    <!-- Sun rising -->
    <path d="M180 140 A 40 40 0 0 0 200 140" fill="#fbbf24"/>
    <line x1="190" y1="130" x2="190" y2="120" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="205" y1="140" x2="215" y2="140" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>