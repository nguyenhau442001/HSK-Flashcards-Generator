<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="backpackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Motion Blur / Speed Lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting / Hallway Windows Background Context -->
  <g opacity="0.15">
    <polygon points="0,0 70,240 30,240 0,60" fill="#38bdf8"/>
    <polygon points="120,0 200,240 160,240 90,0" fill="#38bdf8"/>
    <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  </g>

  <!-- Giant Clock / Departure Time Metaphor -->
  <g transform="translate(185, 55)">
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="19" fill="#0f172a"/>
    <!-- Clock Hands (Showing "Go/Now") -->
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="4" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" stroke="#f59e0b" stroke-width="1.5" fill="#1e293b"/>
  </g>

  <!-- Doorway / Departure Gate Frame -->
  <g transform="translate(18, 25)">
    <!-- Exit Sign Glow -->
    <rect x="150" y="5" width="24" height="12" rx="3" fill="#10b981" filter="url(#glow)" opacity="0.4"/>
    <rect x="150" y="5" width="24" height="12" rx="3" fill="#10b981"/>
    <path d="M156,11 L162,8 L162,14 Z" fill="#0f172a" /> <!-- minimalist arrow icon -->

    <!-- Door Frame Structure -->
    <rect x="135" y="0" width="54" height="215" rx="4" fill="none" stroke="#334155" stroke-width="3"/>
    <path d="M135,215 L189,215" stroke="#475569" stroke-width="4"/>
  </g>

  <!-- Floor Perspective Lines & Speed Lines -->
  <g opacity="0.3">
    <line x1="0" y1="215" x2="240" y2="215" stroke="#38bdf8" stroke-width="1"/>
    <line x1="20" y1="240" x2="110" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4"/>
    <line x1="60" y1="240" x2="130" y2="200" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="12 6"/>
  </g>

  <!-- Motion Trails / "立即" (Right Now / Departure) Action Lines -->
  <g opacity="0.4" stroke-linecap="round">
    <path d="M 40,150 Q 70,140 100,150" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 30,170 Q 70,160 110,170" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M 50,190 Q 80,180 120,190" stroke="#38bdf8" stroke-width="2" fill="none"/>
  </g>

  <!-- MAIN CHARACTER (Traveler / Commuter rushing out immediately) -->
  <g transform="translate(60, 40)">
    
    <!-- Backpack (Flying back slightly due to momentum) -->
    <g transform="translate(-15, 60)">
      <rect x="-14" y="0" width="20" height="28" rx="8" fill="url(#backpackGrad)"/>
      <path d="M-10,0 C-10,-8 0,-8 0,0" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
      <!-- Straps -->
      <path d="M-4,4 L10,10" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Torso (Leaning forward aggressively for swift motion) -->
    <g transform="rotate(22, 15, 80)">
      <!-- Jacket -->
      <path d="M 0,60 L 30,55 L 35,95 L 5,100 Z" fill="url(#jacketGrad)"/>
      <!-- Inner Shirt Collar -->
      <path d="M 15,57 L 22,56 L 20,65 L 12,65 Z" fill="#f8fafc"/>
      <!-- Belt -->
      <rect x="3" y="95" width="30" height="5" rx="2" fill="#0f172a"/>
    </g>

    <!-- Left Arm (Swinging back) -->
    <g transform="translate(10, 65) rotate(-35, 0, 0)">
      <path d="M 0,0 C -10,15 -15,25 -25,35" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="-27" cy="38" r="5" fill="#fcd34d"/>
    </g>

    <!-- Right Arm (Reaching forward urgently) -->
    <g transform="translate(25, 75) rotate(45, 0, 0)">
      <path d="M 0,0 C 12,10 25,20 38,25" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
      <!-- Hand pointing / gripping -->
      <circle cx="42" cy="27" r="5" fill="#fcd34d"/>
    </g>

    <!-- Head & Face (Determined expression, dynamic hair) -->
    <g transform="translate(25, 30) rotate(15, 15, 25)">
      <!-- Hair -->
      <path d="M 2,15 C 2,5 12,0 25,2 C 35,3 42,12 40,22 C 38,20 35,12 25,10 C 15,8 8,12 5,20 Z" fill="#1e293b"/>
      <path d="M 35,10 C 42,8 48,15 45,22 C 43,18 40,14 35,10 Z" fill="#1e293b"/>

      <!-- Face Base -->
      <rect x="8" y="12" width="26" height="28" rx="12" fill="#fcd34d"/>
      
      <!-- Determined Eye (Slanted sharply) -->
      <path d="M 22,22 L 30,24" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Eyebrow (Stern/Focused) -->
      <path d="M 20,19 L 31,21" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Determined Mouth (Open, shouting/breathing hard) -->
      <path d="M 26,30 Q 30,34 32,32" stroke="#1e293b" stroke-width="2" fill="#b91c1c" stroke-linecap="round"/>
      
      <!-- Motion lines on cheek -->
      <line x1="13" y1="24" x2="9" y2="25" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Legs (Running stride - wide dynamic pose) -->
    <!-- Back Leg (Kicked back) -->
    <g transform="translate(15, 100)">
      <path d="M 0,0 C -15,15 -35,30 -45,45" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
      <!-- Shoe -->
      <path d="M -45,43 C -55,45 -58,52 -53,54 C -48,56 -42,50 -40,46 Z" fill="#ef4444"/>
    </g>

    <!-- Front Leg (Stepping forward powerfully) -->
    <g transform="translate(25, 100)">
      <path d="M 0,0 C 15,20 30,35 45,48" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
      <!-- Dynamic Foot / Sneaker -->
      <path d="M 43,45 C 55,50 62,55 58,62 C 54,69 42,62 38,52 Z" fill="#ef4444"/>
      <!-- Sole highlight -->
      <path d="M 44,58 C 50,60 55,60 57,61" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Speed Lines & Ambient Particle Bursts (Emphasizing "Immediately / Right Now") -->
  <g fill="#f59e0b">
    <circle cx="130" cy="110" r="2.5"/>
    <circle cx="150" cy="140" r="1.5"/>
    <circle cx="115" cy="85" r="2"/>
    <circle cx="90" cy="60" r="1.5"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="140" cy="90" r="2"/>
    <circle cx="165" cy="120" r="3"/>
    <circle cx="100" cy="130" r="1.5"/>
  </g>

  <!-- Foreground Props (Luggage ready by the door, emphasizing instant departure) -->
  <g transform="translate(145, 145)">
    <!-- Small Trolley Bag -->
    <rect x="0" y="20" width="22" height="30" rx="4" fill="#38bdf8"/>
    <rect x="3" y="16" width="16" height="6" rx="2" fill="#0284c7"/>
    <!-- Trolley Handle -->
    <path d="M 8,16 L 8,10 C 8,8 14,8 14,10 L 14,16" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="5" cy="52" r="2.5" fill="#1e293b"/>
    <circle cx="17" cy="52" r="2.5" fill="#1e293b"/>
    <!-- Bag Detail Stripe -->
    <rect x="0" y="32" width="22" height="4" fill="#0284c7" opacity="0.5"/>
  </g>

  <!-- Rim Lighting / Glow around the main subject for visual pop -->
  <circle cx="85" cy="110" r="50" fill="url(#amberGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>

</svg>