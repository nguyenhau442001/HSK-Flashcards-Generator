<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="120" cy="110" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Hanger Gradient -->
    <linearGradient id="metal-grad" x1="100" y1="40" x2="140" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>

    <!-- Jacket Main Gradient (Emerald/Teal) -->
    <linearGradient id="jacket-grad" x1="60" y1="80" x2="180" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>

    <!-- Jacket Shadow/Inner -->
    <linearGradient id="jacket-inner" x1="100" y1="90" x2="140" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>

    <!-- Tag Gradient (Vibrant Pink/Red for Sale) -->
    <linearGradient id="tag-grad" x1="130" y1="120" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Atmospheric Background Elements (Store Rack & Rails) -->
  <g opacity="0.25">
    <!-- Horizontal Clothing Rail -->
    <rect x="30" y="55" width="180" height="6" rx="3" fill="#64748b"/>
    <!-- Rail Support Left -->
    <rect x="35" y="25" width="4" height="35" rx="2" fill="#475569"/>
    <!-- Rail Support Right -->
    <rect x="201" y="25" width="4" height="35" rx="2" fill="#475569"/>
    
    <!-- Background Silhouetted Garments -->
    <path d="M50 70 L65 70 L75 110 L40 110 Z" fill="#334155"/>
    <path d="M175 70 L190 70 L200 115 L165 115 Z" fill="#334155"/>
  </g>

  <!-- MAIN SCENE: Retail Clothing Display -->
  <g filter="url(#shadow)">
    
    <!-- Clothing Hanger -->
    <path d="M120 42 C120 38 123 35 127 35 C131 35 134 38 134 42 L134 52 L120 52 Z" fill="none" stroke="url(#metal-grad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M70 70 L120 52 L170 70" fill="none" stroke="url(#metal-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Jacket Base -->
    <path d="M70 75 
             C70 75 85 72 95 72 
             C105 72 112 80 120 80 
             C128 80 135 72 145 72 
             C155 72 170 75 170 75 
             L185 110 
             L160 120 
             L165 200 
             L75 200 
             L80 120 
             L55 110 Z" 
          fill="url(#jacket-grad)"/>

    <!-- Jacket Inner Collar & Opening -->
    <path d="M120 80 
             L100 130 
             L110 200 
             L130 200 
             L140 130 Z" 
          fill="url(#jacket-inner)"/>

    <!-- Lapels -->
    <path d="M120 80 L95 115 L105 130 Z" fill="#065f46" opacity="0.6"/>
    <path d="M120 80 L145 115 L135 130 Z" fill="#065f46" opacity="0.6"/>

    <!-- Zipper Line -->
    <line x1="120" y1="80" x2="120" y2="200" stroke="#042f2e" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Sleeves -->
    <!-- Left Sleeve -->
    <path d="M70 75 L45 140 L65 150 L90 100 Z" fill="#047857"/>
    <!-- Right Sleeve (Action Pose - slightly raised/curved) -->
    <path d="M170 75 L195 135 L175 145 L150 100 Z" fill="#059669"/>

    <!-- Dynamic Action & Emphasis Sparkles / Glow around the Jacket -->
    <g fill="#fbbf24">
      <path d="M 45 65 Q 50 60 55 65 Q 50 70 45 65 Z" />
      <path d="M 190 85 Q 195 80 200 85 Q 195 90 190 85 Z" />
      <circle cx="160" cy="55" r="2.5"/>
      <circle cx="75" cy="180" r="2"/>
    </g>

    <!-- SALE / DISCOUNT TAG (Focal Point representing 打折) -->
    <g transform="translate(130, 95) rotate(15)">
      <!-- Tag String -->
      <path d="M -10 -5 C -5 -20 5 -30 10 -43" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2 2"/>
      
      <!-- Tag Body -->
      <polygon points="0,0 55,0 70,30 55,60 0,60" fill="url(#tag-grad)" filter="url(#shadow)"/>
      
      <!-- Tag Hole & Metal Ring -->
      <circle cx="12" cy="30" r="5" fill="#1e293b"/>
      <circle cx="12" cy="30" r="3" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Stylized Percentage / Discount Visual (Graphical representation instead of text) -->
      <!-- Percent sign stylized geometrically -->
      <circle cx="38" cy="22" r="5" fill="#fef08a"/>
      <line x1="52" y1="15" x2="30" y2="45" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="44" cy="38" r="5" fill="#fef08a"/>

      <!-- Starburst Badge on Tag -->
      <g transform="translate(58, 48) scale(0.6)">
        <path d="M0 -12 L3 -4 L11 -7 L6 0 L12 5 L4 6 L2 13 L-2 7 L-10 9 L-6 2 L-12 -3 L-4 -5 Z" fill="#38bdf8"/>
      </g>
    </g>

  </g>

  <!-- Foreground Atmospheric Glow & Floor Shadow -->
  <ellipse cx="120" cy="215" rx="55" ry="8" fill="#020617" opacity="0.6"/>

  <!-- Additional Action Energy Elements (Sparkles & Downward Price Drop Arrow Motif) -->
  <g transform="translate(25, 140)" opacity="0.8">
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Downward Price Arrow (Visualizing 'Reduction') -->
    <path d="M-4 -5 L0 3 L4 -5" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-7" x2="0" y2="3" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g transform="translate(210, 160)" opacity="0.8">
    <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <path d="M-3 -4 L0 2 L3 -4" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-5" x2="0" y2="2" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>