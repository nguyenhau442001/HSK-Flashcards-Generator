<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="8"/>
  
  <!-- Empty Chair (Indicating he is not here) -->
  <rect x="40" y="120" width="40" height="60" fill="#475569" rx="4"/>
  <circle cx="60" cy="100" r="15" fill="#94a3b8"/>
  
  <!-- Person leaving the note -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fcd34d"/>
    <path d="M5 45 Q20 35 35 45 L30 90 L10 90 Z" fill="#38bdf8"/>
    <rect x="15" y="90" width="5" height="40" fill="#38bdf8"/>
    <rect x="25" y="90" width="5" height="40" fill="#38bdf8"/>
  </g>
  
  <!-- Sticky Note on Desk -->
  <rect x="130" y="170" width="60" height="50" fill="#fbbf24" rx="2"/>
  <line x1="135" y1="180" x2="185" y2="180" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  <line x1="135" y1="190" x2="185" y2="190" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  <line x1="135" y1="200" x2="160" y2="200" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pen -->
  <rect x="195" y="175" width="20" height="4" fill="#ec4899" rx="2" transform="rotate(-20 205 177)"/>
  
  <!-- Ambient Light/Window Glow -->
  <circle cx="200" cy="50" r="30" fill="#f59e0b" opacity="0.1"/>
  <circle cx="200" cy="50" r="15" fill="#f59e0b" opacity="0.2"/>
</svg>