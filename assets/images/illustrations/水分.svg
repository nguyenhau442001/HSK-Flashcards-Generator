<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Water Droplet/Hydration Effect (Stylized) -->
  <path d="M120 40 C 135 40, 145 55, 145 70 C 145 90, 120 110, 120 110 C 120 110, 95 90, 95 70 C 95 55, 105 40, 120 40 Z" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Character (Upper Body) -->
  <g transform="translate(40, 80)">
    <circle cx="40" cy="30" r="25" fill="#fbbf24"/>
    <path d="M25 35 Q40 45 55 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="32" cy="25" r="3" fill="#0f172a"/>
    <circle cx="48" cy="25" r="3" fill="#0f172a"/>
    <rect x="10" y="60" width="60" height="80" rx="10" fill="#ec4899"/>
  </g>
  
  <!-- Watermelon Slice -->
  <g transform="translate(130, 110)">
    <path d="M0 0 L60 0 L30 40 Z" fill="#ef4444"/>
    <path d="M0 0 L60 0" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="15" r="2" fill="#0f172a"/>
    <circle cx="40" cy="15" r="2" fill="#0f172a"/>
    <circle cx="30" cy="25" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="50" r="15" fill="#fb923c" opacity="0.2"/>
  <circle cx="180" cy="40" r="8" fill="#fb923c" opacity="0.4"/>
  
  <!-- Hand reaching for watermelon -->
  <path d="M90 120 L120 130" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
</svg>