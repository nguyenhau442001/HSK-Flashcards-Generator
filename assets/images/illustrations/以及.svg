<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and effects -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="doorwayLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment: Warm indoor hallway / living room entrance -->
  <!-- Wooden floor -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#1b1928" />
  <path d="M 0 190 L 240 190 L 240 195 L 0 195 Z" fill="#2d2640" opacity="0.5" />
  
  <!-- Wall base color -->
  <rect x="0" y="50" width="240" height="140" fill="#1e2330" />

  <!-- Doorway / Entryway on the right -->
  <rect x="150" y="70" width="70" height="120" fill="#111827" />
  <path d="M 150 70 L 160 50 L 220 50 L 230 70 Z" fill="#1a2234" />
  <!-- Warm welcoming light spilling in from outside -->
  <path d="M 155 70 L 195 190 L 155 190 Z" fill="url(#doorwayLight)" />

  <!-- Interior Wall Decor (Plant & Picture Frame) -->
  <rect x="40" y="80" width="35" height="45" rx="3" fill="#334155" />
  <rect x="44" y="84" width="27" height="37" fill="#475569" />
  <circle cx="57" cy="102" r="8" fill="#fbbf24" opacity="0.8" />

  <!-- Ceiling Warm Light Source -->
  <ellipse cx="120" cy="50" rx="60" ry="15" fill="url(#warmGlow)" />
  <circle cx="120" cy="50" r="4" fill="#fbbf24" />

  <!-- SHOE RACK & PROPS AT ENTRANCE -->
  <rect x="180" y="160" width="45" height="30" rx="2" fill="#332922" />
  <rect x="185" y="170" width="35" height="4" fill="#4a3b32" />
  <!-- Shoes neatly lined up -->
  <ellipse cx="190" cy="167" rx="4" ry="2" fill="#94a3b8" />
  <ellipse cx="202" cy="167" rx="4" ry="2" fill="#38bdf8" />
  <ellipse cx="214" cy="167" rx="4" ry="2" fill="#ec4899" />

  <!-- GROUP OF CHARACTERS ("He AND his family have all arrived") -->
  <!-- We show 4 happy characters arriving together at the doorway/hallway -->

  <!-- Character 1: The Main Subject (Dad/He) gesturing welcome/arrival -->
  <g transform="translate(110, 105)" filter="url(#softShadow)">
    <!-- Body / Suit -->
    <path d="M 12 35 C 12 25 22 22 28 22 C 34 22 44 25 44 35 L 48 85 L 8 85 Z" fill="#3b82f6" />
    <path d="M 28 22 L 28 50" stroke="#1d4ed8" stroke-width="3" />
    <!-- Head -->
    <circle cx="28" cy="12" r="10" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 18 10 C 18 5 24 3 28 3 C 32 3 38 5 38 10 Z" fill="#1e293b" />
    <!-- Arm gesturing -->
    <path d="M 12 30 C 5 35 2 45 5 50" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Legs -->
    <rect x="16" y="85" width="8" height="40" fill="#1e293b" />
    <rect x="32" y="85" width="8" height="40" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="20" cy="126" rx="6" ry="3" fill="#0f172a" />
    <ellipse cx="36" cy="126" rx="6" ry="3" fill="#0f172a" />
  </g>

  <!-- Character 2: Family member (Partner/Wife) -->
  <g transform="translate(75, 110)" filter="url(#softShadow)">
    <!-- Dress -->
    <path d="M 10 30 C 10 20 20 20 25 20 C 30 20 40 20 40 30 L 45 85 L 5 85 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="25" cy="12" r="9" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 15 10 C 15 4 22 2 25 2 C 32 2 35 6 38 15 C 32 16 28 15 25 15 C 20 15 17 12 15 10 Z" fill="#831843" />
    <!-- Legs -->
    <rect x="15" y="85" width="6" height="35" fill="#fcd34d" />
    <rect x="29" y="85" width="6" height="35" fill="#fcd34d" />
    <!-- Shoes -->
    <ellipse cx="18" cy="121" rx="5" ry="2.5" fill="#be185d" />
    <ellipse cx="32" cy="121" rx="5" ry="2.5" fill="#be185d" />
  </g>

  <!-- Character 3: Family member (Child 1) -->
  <g transform="translate(50, 125)" filter="url(#softShadow)">
    <!-- Sweater -->
    <path d="M 8 25 C 8 18 15 18 20 18 C 25 18 32 18 32 25 L 35 70 L 5 70 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="20" cy="10" r="8" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 12 8 C 12 4 16 2 20 2 C 24 2 28 4 28 8 Z" fill="#332922" />
    <!-- Legs -->
    <rect x="11" y="70" width="5" height="25" fill="#0f172a" />
    <rect x="24" y="70" width="5" height="25" fill="#0f172a" />
    <!-- Shoes -->
    <ellipse cx="13" cy="96" rx="4" ry="2" fill="#334155" />
    <ellipse cx="26" cy="96" rx="4" ry="2" fill="#334155" />
  </g>

  <!-- Character 4: Family member (Child 2 / Younger) waving -->
  <g transform="translate(145, 115)" filter="url(#softShadow)">
    <!-- Hoodie -->
    <path d="M 8 22 C 8 15 15 15 20 15 C 25 15 32 15 32 22 L 35 75 L 5 75 Z" fill="#f59e0b" />
    <!-- Head -->
    <circle cx="20" cy="10" r="8" fill="#fcd34d" />
    <!-- Hair / Hood -->
    <path d="M 11 8 C 11 3 16 2 20 2 C 24 2 29 3 29 8 Z" fill="#78350f" />
    <!-- Waving Arm -->
    <path d="M 32 25 C 38 20 42 25 38 32" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Legs -->
    <rect x="10" y="75" width="5" height="30" fill="#1e293b" />
    <rect x="23" y="75" width="5" height="30" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="12" cy="106" rx="4" ry="2" fill="#b45309" />
    <ellipse cx="25" cy="106" rx="4" ry="2" fill="#b45309" />
  </g>

  <!-- Foreground details: Potted plant on floor adding depth -->
  <path d="M 15 175 L 25 195 L 5 195 Z" fill="#64748b" />
  <ellipse cx="15" cy="175" rx="5" ry="2" fill="#94a3b8" />
  <path d="M 15 173 C 15 160 5 150 5 140 C 5 150 15 155 15 173 Z" fill="#10b981" />
  <path d="M 15 173 C 15 155 25 145 28 135 C 25 150 20 160 15 173 Z" fill="#34d399" />

  <!-- Subtle overlay rim light representing arrival/gathering atmosphere -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.1" />
</svg>