<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="65" fill="#1e293b"/>
  <rect x="190" y="175" width="10" height="65" fill="#1e293b"/>
  
  <!-- Laptop -->
  <path d="M70 160 L170 160 L185 130 L55 130 Z" fill="#475569"/>
  <path d="M75 135 L165 135 L165 155 L75 155 Z" fill="#0f172a"/>
  <circle cx="120" cy="145" r="3" fill="#38bdf8"/>
  
  <!-- Manager Character -->
  <g transform="translate(150, 60)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 40 L30 40 L35 90 L5 90 Z" fill="#fb923c"/>
    <path d="M5 40 L10 70 L5 70 Z" fill="#f59e0b"/>
    <path d="M30 40 L35 70 L40 70 Z" fill="#f59e0b"/>
    <circle cx="15" cy="15" r="2" fill="#0f172a"/>
    <circle cx="25" cy="15" r="2" fill="#0f172a"/>
    <path d="M15 25 Q20 28 25 25" stroke="#0f172a" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Employee Character -->
  <g transform="translate(40, 80)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 40 L30 40 L35 100 L5 100 Z" fill="#38bdf8"/>
    <path d="M5 40 L10 80 L5 80 Z" fill="#0ea5e9"/>
    <path d="M30 40 L35 80 L40 80 Z" fill="#0ea5e9"/>
    <circle cx="15" cy="15" r="2" fill="#0f172a"/>
    <circle cx="25" cy="15" r="2" fill="#0f172a"/>
    <path d="M15 25 Q20 22 25 25" stroke="#0f172a" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Emphasis/Action Lines -->
  <path d="M140 60 L120 80" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="145" cy="55" r="4" fill="#fbbf24"/>
  <circle cx="150" cy="45" r="2" fill="#fbbf24"/>
  
  <!-- Calendar on wall -->
  <rect x="180" y="20" width="40" height="50" rx="4" fill="#334155"/>
  <rect x="185" y="35" width="30" height="30" fill="#f1f5f9"/>
  <rect x="185" y="25" width="30" height="5" fill="#ec4899"/>
</svg>