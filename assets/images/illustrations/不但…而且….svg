<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Light Gradient -->
    <radialGradient id="desk-light" cx="65%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Smart Glow (Lightbulb/Brain area) -->
    <radialGradient id="smart-glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Layer -->
  <rect width="240" height="240" rx="24" fill="url(#desk-light)" />

  <!-- BACKGROUND ENVIRONMENT: Study Room / Workspace -->
  <g id="environment">
    <!-- Window with Night City Glow -->
    <rect x="20" y="25" width="55" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- City lights outside -->
    <rect x="28" y="40" width="10" height="15" fill="#38bdf8" opacity="0.3" rx="1" />
    <rect x="44" y="35" width="14" height="22" fill="#fbbf24" opacity="0.3" rx="1" />
    <rect x="28" y="65" width="16" height="18" fill="#ec4899" opacity="0.2" rx="1" />
    <line x1="47" y1="25" x2="47" y2="100" stroke="#334155" stroke-width="2" />
    <line x1="20" y1="62" x2="75" y2="62" stroke="#334155" stroke-width="2" />

  <!-- Bookshelf Background -->
    <rect x="170" y="30" width="45" height="90" fill="#0f172a" stroke="#334155" stroke-width="2" rx="2"/>
    <!-- Books on Shelf -->
    <path d="M176 60h8v24h-8z" fill="#f43f5e" />
    <path d="M186 54h7v30h-7z" fill="#10b981" />
    <path d="M195 58h9v26h-9z" fill="#38bdf8" />
    <path d="M176 95h12v25h-12z" fill="#fbbf24" />
    <path d="M190 98h14v22h-14z" fill="#8b5cf6" />
    <line x1="170" y1="85" x2="215" y2="85" stroke="#334155" stroke-width="2" />

    <!-- Desk Surface -->
    <path d="M10 180 L230 180 L220 215 L20 215 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="0" y="210" width="240" height="30" fill="#090d16" />

    <!-- Desk Lamp -->
    <path d="M195 180 L205 130 L195 125" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M185 120 L210 120 L202 105 L193 105 Z" fill="#fbbf24" />
    <!-- Lamp Light Beam Cone -->
    <path d="M192 120 L130 180 L220 180 Z" fill="#fbbf24" opacity="0.08" />

    <!-- Extra Study Props: Laptop & Notebooks -->
    <rect x="110" y="165" width="55" height="18" rx="2" fill="#64748b" />
    <path d="M105 182 L170 182 L175 186 L100 186 Z" fill="#475569" />
    <!-- Open Book -->
    <path d="M50 170 Q70 160 90 175 L90 190 Q70 178 50 190 Z" fill="#f8fafc" />
    <path d="M70 163 L70 183" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="56" y1="172" x2="65" y2="175" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="75" y1="175" x2="84" y2="172" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER: Diligent & Smart Student -->
  <g id="character">
    <!-- Chair Back -->
    <path d="M70 100 Q70 70 95 70 Q120 70 120 100 L125 180 L65 180 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Character Body / Torso (Hard working pose - leaning forward slightly) -->
    <path d="M75 140 C75 115 115 115 115 140 L120 185 L70 185 Z" fill="#3b82f6" />
    <!-- Collar -->
    <path d="M90 138 L95 148 L100 138 Z" fill="#f8fafc" />

    <!-- Arms & Hands actively working/writing -->
    <!-- Left arm resting -->
    <path d="M78 140 L60 165 L70 172 L85 150 Z" fill="#2563eb" />
    <!-- Right arm reaching forward with pencil -->
    <path d="M112 140 L135 155 L130 163 L105 148 Z" fill="#2563eb" />
    <!-- Hand -->
    <circle cx="133" cy="160" r="6" fill="#fde68a" />
    <!-- Pencil -->
    <path d="M125 168 L142 152 L145 155 L128 171 Z" fill="#f59e0b" />
    <path d="M142 152 L145 155 L147 153 L144 150 Z" fill="#334155" />

    <!-- Neck -->
    <path d="M90 115 L90 125 L100 125 L100 115 Z" fill="#fde68a" />

    <!-- Head -->
    <circle cx="95" cy="98" r="22" fill="#fde68a" />

    <!-- Hair (Smart, neat styling) -->
    <path d="M73 98 C73 78 117 78 117 98 C117 98 115 88 105 84 C95 80 85 84 73 98 Z" fill="#0f172a" />
    <path d="M75 96 Q85 85 102 88 L110 94 Q100 82 82 86 Z" fill="#1e293b" />

    <!-- Facial Expressions (Focused, intelligent, determined) -->
    <!-- Eyebrows (Slanted down slightly with concentration/effort) -->
    <path d="M82 92 L90 94" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <path d="M100 94 L108 92" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Glasses (Signifying intelligence) -->
    <circle cx="87" cy="98" r="7" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="103" cy="98" r="7" fill="none" stroke="#334155" stroke-width="1.5" />
    <line x1="94" y1="98" x2="96" y2="98" stroke="#334155" stroke-width="1.5" />

    <!-- Eyes (Focused looking down at work) -->
    <circle cx="87" cy="98" r="2" fill="#0f172a" />
    <circle cx="103" cy="98" r="2" fill="#0f172a" />

    <!-- Confident, subtle smile (hard work pays off) -->
    <path d="M92 107 Q95 111 98 107" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="81" cy="103" r="3" fill="#f43f5e" opacity="0.3" />
    <circle cx="109" cy="103" r="3" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- NARRATIVE SYMBOLISM (Visualizing "Smart" and "Hardworking") -->
  <!-- Smart Lightbulb / Idea Glow above head -->
  <g transform="translate(95, 45)">
    <circle cx="0" cy="0" r="16" fill="url(#smart-glow)" />
    <!-- Lightbulb Icon -->
    <path d="M0 -8 C-5 -8 -8 -5 -8 -1 C-8 3 -5 5 -4 8 L4 8 C5 5 8 3 8 -1 C8 -5 5 -8 0 -8 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <path d="M-3 10 L3 10" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
    <path d="M-2 12 L2 12" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
    <!-- Sparkles for "Cleverness / Brilliance" -->
    <path d="M-15 -5 L-12 -2 L-15 1 L-18 -2 Z" fill="#38bdf8" />
    <path d="M15 -5 L18 -2 L15 1 L12 -2 Z" fill="#38bdf8" />
    <path d="M0 -18 L2 -15 L0 -12 L-2 -15 Z" fill="#f43f5e" />
  </g>

  <!-- Hard Work Sparkles / Sweat drop of effort -->
  <g transform="translate(114, 88)">
    <path d="M0 0 C2 3 2 6 0 8 C-2 6 -2 3 0 0 Z" fill="#38bdf8" opacity="0.8" />
    <!-- Motion lines showing diligence/fast writing -->
    <path d="M18 70 L26 65" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M22 77 L30 72" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

</svg>