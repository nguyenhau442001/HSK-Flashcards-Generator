<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="deskGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Background & Room Environment -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#deskGlow)"/>

  <!-- Wallpaper accent lines / Room details -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2" opacity="0.6"/>
  <path d="M 180 40 L 210 70 M 210 40 L 180 70" stroke="#334155" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <circle cx="50" cy="50" r="16" fill="none" stroke="#334155" stroke-width="2" opacity="0.3"/>
  
  <!-- Desk surface -->
  <path d="M 0 185 L 240 185 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 185 L 240 185" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- Desk Props: Coffee Mug -->
  <g transform="translate(185, 155)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#64748b"/>
    <path d="M 16 10 C 22 10 22 20 16 20" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 4 2 L 6 0 M 8 3 L 10 0 M 12 2 L 14 0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Desk Props: Plant / Lamp base -->
  <path d="M 20 185 L 35 155 L 50 185 Z" fill="#475569" opacity="0.5"/>
  <circle cx="35" cy="150" r="12" fill="#10b981" opacity="0.8"/>

  <!-- Character: Upper Body, Head, Arms -->
  <g id="character">
    <!-- Torso / Hoodie -->
    <path d="M 80 200 C 80 170 100 160 120 160 C 140 160 160 170 160 200 Z" fill="#3b82f6"/>
    <!-- Collar -->
    <path d="M 105 160 L 120 175 L 135 160" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="110" y="140" width="20" height="25" fill="#fbcfe8" rx="6"/>

    <!-- Head & Hair -->
    <path d="M 95 110 C 95 85 145 85 145 110 C 145 130 135 145 120 145 C 105 145 95 130 95 110 Z" fill="#fbcfe8"/>
    <!-- Hair Style -->
    <path d="M 95 110 C 95 80 145 80 145 110 C 145 110 138 90 120 90 C 102 90 95 110 95 110 Z" fill="#0f172a"/>
    <path d="M 93 100 C 90 105 92 115 96 120" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

    <!-- Face Expression: Worried / Shocked ("Huai" / broken phone reaction) -->
    <!-- Eyebrows (tilted inward) -->
    <line x1="102" y1="107" x2="114" y2="111" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="126" y1="111" x2="138" y2="107" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes (wide circles) -->
    <circle cx="108" cy="117" r="4" fill="#0f172a"/>
    <circle cx="132" cy="117" r="4" fill="#0f172a"/>
    <circle cx="109" cy="116" r="1.5" fill="#ffffff"/>
    <circle cx="133" cy="116" r="1.5" fill="#ffffff"/>
    <!-- Sweat drop -->
    <path d="M 142 105 C 145 110 145 115 142 115 C 139 115 139 110 142 105 Z" fill="#38bdf8"/>
    <!-- Mouth (Open in dismay / "O" shape) -->
    <ellipse cx="120" cy="132" rx="4" ry="6" fill="#0f172a"/>

    <!-- Left Arm & Hand (Holding phone bottom) -->
    <path d="M 90 175 C 80 185 85 195 95 195 C 100 195 105 190 105 185" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="98" cy="193" r="6" fill="#fbcfe8"/>

    <!-- Right Arm & Hand (Supporting phone side) -->
    <path d="M 150 175 C 160 185 155 195 145 195 C 140 195 135 190 135 185" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="142" cy="193" r="6" fill="#fbcfe8"/>
  </g>

  <!-- BROKEN SMARTPHONE (Central Focus of "Huai" / Broken) -->
  <g transform="translate(100, 110)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="40" height="75" rx="8" fill="url(#phoneGrad)" stroke="#475569" stroke-width="2"/>
    
    <!-- Screen Area -->
    <rect x="3" y="6" width="34" height="63" rx="4" fill="url(#screenGrad)"/>

    <!-- Glitchy / Broken Screen Lines (Visualizing 'Huai' - broken state) -->
    <!-- Error red glow inside screen -->
    <path d="M 3 6 L 37 69 L 3 69 Z" fill="#ef4444" opacity="0.15"/>
    
    <!-- Diagonal Crack across screen -->
    <path d="M 6 12 L 18 35 L 12 42 L 32 64" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 18 35 L 26 30" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 12 42 L 8 50" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Glitch pixel blocks -->
    <rect x="8" y="16" width="12" height="4" fill="#ef4444" opacity="0.8"/>
    <rect x="20" y="50" width="10" height="5" fill="#3b82f6" opacity="0.8"/>
    <rect x="14" y="24" width="6" height="3" fill="#10b981" opacity="0.7"/>

    <!-- Phone Speaker Notch -->
    <rect x="14" y="3" width="12" height="2" rx="1" fill="#64748b"/>
  </g>

  <!-- Spark / Error indicators floating around broken phone -->
  <g transform="translate(120, 105)" stroke="#fbbf24" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-10" x2="0" y2="-4"/>
    <line x1="7" y1="-7" x2="3" y2="-3"/>
    <line x1="10" y1="0" x2="4" y2="0"/>
  </g>
  <g transform="translate(95, 140)" stroke="#ef4444" stroke-width="2" stroke-linecap="round">
    <line x1="-5" y1="0" x2="-2" y2="0"/>
    <line x1="-4" y1="-4" x2="-2" y2="-2"/>
  </g>

</svg>