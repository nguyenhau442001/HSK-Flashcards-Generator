<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="towerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="towerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Night Sky & Stars -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="35" cy="45" r="1.5"/>
    <circle cx="75" cy="25" r="1"/>
    <circle cx="120" cy="35" r="2" opacity="0.9"/>
    <circle cx="180" cy="20" r="1.5"/>
    <circle cx="210" cy="55" r="1"/>
    <circle cx="25" cy="90" r="1"/>
    <circle cx="215" cy="95" r="1.5"/>
  </g>

  <!-- Distant City Skyline & Glowing Windows -->
  <g opacity="0.4">
    <rect x="15" y="100" width="18" height="60" fill="#334155"/>
    <rect x="35" y="80" width="22" height="80" fill="#1e293b"/>
    <rect x="60" y="90" width="15" height="70" fill="#334155"/>
    <rect x="165" y="85" width="20" height="75" fill="#334155"/>
    <rect x="188" y="70" width="25" height="90" fill="#1e293b"/>
    <rect x="216" y="95" width="18" height="65" fill="#334155"/>
  </g>

  <!-- Mid-ground Vibrant Cityscape (Representing massive population / 万) -->
  <g>
    <!-- Skyscrapers Left -->
    <rect x="30" y="110" width="30" height="90" fill="url(#towerGrad1)"/>
    <rect x="65" y="95" width="35" height="105" fill="url(#towerGrad2)"/>
    
    <!-- Skyscrapers Right -->
    <rect x="140" y="100" width="35" height="100" fill="url(#towerGrad1)"/>
    <rect x="180" y="85" width="32" height="115" fill="url(#towerGrad2)"/>

    <!-- Glowing Windows Grid (Dense City Lights) -->
    <g fill="#fbbf24" opacity="0.8">
      <!-- Tower 1 windows -->
      <rect x="36" y="120" width="4" height="6"/><rect x="44" y="120" width="4" height="6"/><rect x="52" y="120" width="4" height="6"/>
      <rect x="36" y="132" width="4" height="6"/><rect x="44" y="132" width="4" height="6"/><rect x="52" y="132" width="4" height="6"/>
      <rect x="36" y="144" width="4" height="6"/><rect x="44" y="144" width="4" height="6"/><rect x="52" y="144" width="4" height="6"/>
      <rect x="36" y="156" width="4" height="6"/><rect x="44" y="156" width="4" height="6"/><rect x="52" y="156" width="4" height="6"/>

      <!-- Tower 2 windows (Dense) -->
      <rect x="72" y="105" width="5" height="7" fill="#38bdf8"/>
      <rect x="82" y="105" width="5" height="7" fill="#38bdf8"/>
      <rect x="72" y="118" width="5" height="7"/>
      <rect x="82" y="118" width="5" height="7"/>
      <rect x="72" y="131" width="5" height="7"/>
      <rect x="82" y="131" width="5" height="7" fill="#ec4899"/>
      <rect x="72" y="144" width="5" height="7"/>
      <rect x="82" y="144" width="5" height="7"/>
      <rect x="72" y="157" width="5" height="7"/>
      <rect x="82" y="157" width="5" height="7"/>

      <!-- Tower 3 windows -->
      <rect x="148" y="112" width="5" height="6" fill="#fb923c"/>
      <rect x="158" y="112" width="5" height="6"/>
      <rect x="148" y="124" width="5" height="6"/>
      <rect x="158" y="124" width="5" height="6" fill="#fb923c"/>
      <rect x="148" y="136" width="5" height="6"/>
      <rect x="158" y="136" width="5" height="6"/>
      <rect x="148" y="148" width="5" height="6" fill="#38bdf8"/>
      <rect x="158" y="148" width="5" height="6"/>

      <!-- Tower 4 windows -->
      <rect x="188" y="95" width="4" height="5"/>
      <rect x="196" y="95" width="4" height="5" fill="#38bdf8"/>
      <rect x="204" y="95" width="4" height="5"/>
      <rect x="188" y="106" width="4" height="5" fill="#ec4899"/>
      <rect x="196" y="106" width="4" height="5"/>
      <rect x="204" y="106" width="4" height="5"/>
      <rect x="188" y="117" width="4" height="5"/>
      <rect x="196" y="117" width="4" height="5"/>
      <rect x="204" y="117" width="4" height="5" fill="#fbbf24"/>
      <rect x="188" y="128" width="4" height="5"/>
      <rect x="196" y="128" width="4" height="5"/>
      <rect x="204" y="128" width="4" height="5"/>
    </g>
  </g>

  <!-- Atmospheric Light Beams from Skyline -->
  <polygon points="75,95 40,0 110,0" fill="url(#beamGrad)" opacity="0.6"/>
  <polygon points="195,85 150,0 225,0" fill="url(#beamGrad)" opacity="0.4"/>

  <!-- Foreground Elevated Highway / Bridge curving across -->
  <path d="M 0 170 Q 120 150 240 185" fill="none" stroke="url(#bridgeGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 0 170 Q 120 150 240 185" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 12" opacity="0.8"/>

  <!-- Tiny Commuter Vehicles on Highway (Representing bustling life) -->
  <g>
    <!-- Car 1 (Red) -->
    <rect x="70" y="157" width="12" height="6" rx="2" fill="#ec4899"/>
    <circle cx="73" cy="164" r="1.5" fill="#0f172a"/>
    <circle cx="79" cy="164" r="1.5" fill="#0f172a"/>
    <!-- Car 2 (Amber Headlights) -->
    <rect x="130" y="153" width="14" height="7" rx="2" fill="#38bdf8"/>
    <circle cx="133" cy="161" r="1.5" fill="#0f172a"/>
    <circle cx="141" cy="161" r="1.5" fill="#0f172a"/>
    <!-- Car 3 -->
    <rect x="180" y="165" width="10" height="5" rx="1.5" fill="#fbbf24"/>
  </g>

  <!-- Central Focal Point: Observational Park / Crowd Silhouette Overlook -->
  <path d="M 80 215 Q 120 185 160 215 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="120" cy="180" r="35" fill="url(#glowGrad)"/>

  <!-- Stylized Diverse Crowd silhouettes at the viewpoint representing "10,000 people" -->
  <g fill="#cbd5e1">
    <!-- Person 1 (Pointing to city) -->
    <circle cx="105" cy="195" r="4"/>
    <path d="M 100 215 L 100 201 Q 105 198 110 201 L 110 215 Z"/>
    <path d="M 105 203 L 116 198" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Person 2 (Holding camera/phone) -->
    <circle cx="120" cy="192" r="4.5"/>
    <path d="M 114 215 L 114 198 Q 120 195 126 198 L 126 215 Z"/>
    <rect x="121" y="196" width="5" height="3" rx="1" fill="#38bdf8"/>

    <!-- Person 3 -->
    <circle cx="135" cy="197" r="4"/>
    <path d="M 130 215 L 130 202 Q 135 199 140 202 L 140 215 Z"/>
  </g>

  <!-- Glowing City Plaza Ground / Ambient Light Reflection -->
  <ellipse cx="120" cy="210" rx="60" ry="12" fill="#38bdf8" opacity="0.15"/>

  <!-- Floating Glowing Metric / Counter Indicator (Cinematic touch for '10,000') -->
  <g transform="translate(120, 75)">
    <!-- Pill background -->
    <rect x="-42" y="-14" width="84" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
    
    <!-- Glowing dot icon -->
    <circle cx="-25" cy="0" r="4" fill="#10b981"/>
    <circle cx="-25" cy="0" r="7" fill="#10b981" opacity="0.4"/>

    <!-- Data Bars simulating "10,000 +" quantity vibe -->
    <rect x="-14" y="-5" width="4" height="10" rx="1" fill="#38bdf8"/>
    <rect x="-7" y="-8" width="4" height="16" rx="1" fill="#38bdf8"/>
    <rect x="0" y="-3" width="4" height="6" rx="1" fill="#38bdf8"/>
    <rect x="7" y="-10" width="4" height="20" rx="1" fill="#fbbf24"/>
    <rect x="14" y="-6" width="4" height="12" rx="1" fill="#ec4899"/>
  </g>

  <!-- Sparkles / City Life Energy Particles -->
  <g fill="#fbbf24">
    <circle cx="95" cy="135" r="1.5" opacity="0.8"/>
    <circle cx="155" cy="120" r="2" opacity="0.9"/>
    <circle cx="130" cy="140" r="1" opacity="0.7"/>
    <circle cx="105" cy="115" r="1.5" opacity="0.8"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="85" cy="125" r="1.5" opacity="0.9"/>
    <circle cx="145" cy="135" r="2" opacity="0.7"/>
    <circle cx="170" cy="110" r="1.5" opacity="0.8"/>
  </g>

  <!-- Frame border accent -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>