<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Beam -->
    <linearGradient id="lightBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Action Upward Arrows Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Light Shafts (Upward motion theme) -->
  <polygon points="60,240 90,40 150,40 180,240" fill="url(#lightBeam)"/>

  <!-- Background Environment: Cozy Room Elements -->
  <!-- Window framing morning rise -->
  <path d="M165,30 L210,30 L210,120 L165,120 Z" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <line x1="187.5" y1="30" x2="187.5" y2="120" stroke="#334155" stroke-width="2"/>
  <line x1="165" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="2"/>

  <!-- Floating Rising Energy Particles -->
  <circle cx="70" cy="110" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="170" cy="90" r="2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="100" cy="70" r="2.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="140" cy="50" r="3.5" fill="#fb923c" opacity="0.8"/>
  <circle cx="85" cy="40" r="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Upward Motion Vector Trails / Arrows -->
  <path d="M75,170 C75,130 95,90 120,60" fill="none" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M115,65 L120,55 L125,65" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bed / Floor Surface Context -->
  <!-- Modern bed frame base -->
  <rect x="25" y="190" width="130" height="15" rx="4" fill="#334155" filter="url(#shadow)"/>
  <rect x="35" y="175" width="110" height="20" rx="4" fill="#64748b"/>
  <!-- Mattress & Pillow -->
  <rect x="30" y="180" width="120" height="12" rx="4" fill="#f8fafc"/>
  <path d="M35,180 Q45,160 70,165 L45,180 Z" fill="#cbd5e1"/>

  <!-- MAIN CHARACTER: Rising Up Energetically -->
  <g filter="url(#shadow)">
    <!-- Motion lines behind character -->
    <line x1="90" y1="180" x2="90" y2="120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="105" y1="190" x2="105" y2="110" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <line x1="120" y1="185" x2="120" y2="130" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Left Leg (Planting / Rising) -->
    <path d="M95,175 L90,145 L100,125" fill="none" stroke="url(#pantsGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="102" cy="123" rx="5" ry="3" fill="#1e293b"/> <!-- Shoe -->

    <!-- Right Leg (Stepping up) -->
    <path d="M115,180 L125,155 L115,130" fill="none" stroke="url(#pantsGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="113" cy="128" rx="5" ry="3" fill="#1e293b"/> <!-- Shoe -->

    <!-- Torso (Dynamic upward stretch) -->
    <path d="M90,135 Q105,115 120,130 L115,95 Q100,90 85,100 Z" fill="url(#shirtGrad)" stroke="#0284c7" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Left Arm (Stretching up vigorously) -->
    <path d="M90,100 L70,75 L60,65" fill="none" stroke="url(#shirtGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="63" r="4" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Right Arm (Raised high in triumph/waking up) -->
    <path d="M110,95 L130,70 L140,55" fill="none" stroke="url(#shirtGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="142" cy="53" r="4" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Neck -->
    <rect x="97" y="85" width="8" height="12" rx="3" fill="#fbcfe8"/>

    <!-- Head (Tilted back cheerfully) -->
    <circle cx="101" cy="72" r="15" fill="#fbcfe8"/>
    
    <!-- Hair (Spiky, energetic morning hair) -->
    <path d="M86,72 Q88,55 101,55 Q115,55 116,72 Q110,62 101,62 Q92,62 86,72 Z" fill="#0f172a"/>
    <path d="M111,60 L118,52 L114,64 Z" fill="#0f172a"/>
    <path d="M91,58 L85,50 L93,60 Z" fill="#0f172a"/>

    <!-- Happy Face Expressions (Eyes closed in joyful stretch) -->
    <path d="M93,72 Q97,76 101,72" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M103,72 Q107,76 111,72" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Big happy open smile -->
    <path d="M96,78 Q102,84 108,78" fill="#1e293b" stroke="#1e293b" stroke-width="1" stroke-linejoin="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="91" cy="76" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="113" cy="76" r="3" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- Foreground Props: Alarm Clock bouncing/rising off nightstand -->
  <g transform="translate(180, 160)" filter="url(#shadow)">
    <!-- Nightstand -->
    <rect x="-15" y="15" width="40" height="25" rx="3" fill="#334155"/>
    <rect x="-12" y="22" width="34" height="6" rx="2" fill="#475569"/>

    <!-- Clock Body -->
    <circle cx="5" cy="0" r="12" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="5" cy="0" r="9" fill="#f8fafc"/>
    <!-- Clock Hands -->
    <line x1="5" y1="0" x2="5" y2="-5" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="0" x2="9" y2="2" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Bells & Legs -->
    <path d="M0,-10 L2,-15 L8,-15 L10,-10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="5" cy="-16" r="2" fill="#cbd5e1"/>
    <line x1="-1" y1="10" x2="-4" y2="15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="11" y1="10" x2="14" y2="15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Sound Waves / Action (Vibrating Up) -->
    <path d="M19,-4 Q23,0 19,4" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M22,-8 Q28,0 22,8" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating upward ZZZs or wake-up sparkles -->
  <g fill="#38bdf8" opacity="0.8">
    <text x="145" y="105" font-family="sans-serif" font-weight="bold" font-size="14" transform="rotate(-15 145 105)">Z</text>
    <text x="157" y="85" font-family="sans-serif" font-weight="bold" font-size="18" transform="rotate(-10 157 85)">Z</text>
    <text x="173" y="62" font-family="sans-serif" font-weight="bold" font-size="22" transform="rotate(-5 173 62)">Z</text>
  </g>

  <!-- Interactive floor shadow beneath the rising motion -->
  <ellipse cx="105" cy="198" rx="35" ry="6" fill="#0f172a" opacity="0.6"/>

  <!-- Framing Border Glow / Vignette (Subtle) -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
</svg>