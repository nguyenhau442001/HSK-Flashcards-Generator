<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="sunbeam" cx="80%" cy="20%" r="80%" fx="80%" fy="20%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#sunbeam)"/>

  <!-- Interior Wall & Window Setting -->
  <!-- Warm home window showing lush green plant life (health/vitality) -->
  <rect x="140" y="30" width="70" height="90" rx="6" fill="#334155" opacity="0.5"/>
  <rect x="146" y="36" width="27" height="78" rx="3" fill="#64748b" opacity="0.3"/>
  <rect x="177" y="36" width="27" height="78" rx="3" fill="#64748b" opacity="0.3"/>
  
  <!-- Potted plant on window ledge representing wellness/good health -->
  <path d="M155,120 L195,120 L188,140 L162,140 Z" fill="#f97316"/>
  <circle cx="175" cy="115" r="14" fill="#10b981"/>
  <path d="M165,110 Q175,90 190,105 Q205,95 195,120" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <!-- Shelf with healthy props (tea pot, wellness books) -->
  <rect x="30" y="65" width="80" height="6" rx="3" fill="#475569"/>
  <!-- Teapot -->
  <path d="M50,65 C50,52 60,50 65,50 C70,50 80,52 80,65 Z" fill="#38bdf8"/>
  <path d="M45,55 L52,58" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Vitality/Health symbol implied via bright orange glowing tea cup -->
  <path d="M90,55 C90,52 96,52 96,55 L94,65 C94,67 92,67 90,65 Z" fill="#fbbf24"/>

  <!-- Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>

  <!-- Grandma Character (奶奶): Energetic, smiling, vibrant posture (身体很健康) -->
  <g transform="translate(100, 105)">
    <!-- Body / Torso (Active upright posture) -->
    <path d="M-22,60 C-22,35 -15,25 0,25 C15,25 22,35 22,60 L28,95 C28,98 25,100 22,100 L-22,100 C-25,100 -28,98 -28,95 Z" fill="#ec4899"/>
    <!-- Collar / Inner Shirt -->
    <path d="M-10,25 L0,38 L10,25 Z" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <circle cx="0" cy="-2" r="20" fill="#fde68a"/>
    
    <!-- Friendly Silver Hair Bun -->
    <path d="M-18,-5 C-22,-18 -10,-25 0,-25 C10,-25 22,-18 18,-5 C18,3 15,8 12,12 C-12,12 -15,3 -18,-5 Z" fill="#cbd5e1"/>
    <circle cx="0" cy="-27" r="8" fill="#94a3b8"/>

    <!-- Facial Expressions - Happy, Healthy Glow -->
    <!-- Smiling Eyes (Arcs) -->
    <path d="M-8,-5 C-6,-8 -4,-8 -2,-5" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M2,-5 C4,-8 6,-8 8,-5" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Warm Cheeks -->
    <circle cx="-10" cy="1" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="10" cy="1" r="3" fill="#f43f5e" opacity="0.4"/>
    <!-- Big Smile -->
    <path d="M-5,4 C-2,8 2,8 5,4" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Arms in an energetic, healthy stretch/gesture -->
    <!-- Left Arm (Raised dynamically) -->
    <path d="M-20,35 C-35,30 -45,15 -50,5" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-52" cy="2" r="5" fill="#fde68a"/>

    <!-- Right Arm (Hand on hip / confident) -->
    <path d="M20,35 C35,35 40,50 32,65" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <circle cx="30" cy="67" r="5" fill="#fde68a"/>

    <!-- Legs (Strong, standing tall) -->
    <path d="M-10,100 L-12,165 C-12,168 -10,170 -7,170 L-2,170 C1,170 3,168 3,165 L5,100" fill="#3b82f6"/>
    <path d="M5,100 L7,165 C7,168 9,170 12,170 L17,170 C20,170 22,168 22,165 L18,100" fill="#3b82f6"/>

    <!-- Shoes -->
    <ellipse cx="-5" cy="172" rx="9" ry="4" fill="#1e293b"/>
    <ellipse cx="15" cy="172" rx="9" ry="4" fill="#1e293b"/>
  </g>

  <!-- Vitality / Health Indicator Sparkles (Golden Energy) -->
  <g transform="translate(45, 110)">
    <path d="M0,0 L0,-12 M-6,-6 L6,-6" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(195, 140)">
    <path d="M0,0 L0,-16 M-8,-8 L8,-8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(75, 45)">
    <path d="M0,0 L0,-10 M-5,-5 L5,-5" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Ground Shadow for Grandma -->
  <ellipse cx="100" cy="210" rx="25" ry="6" fill="#090d16" opacity="0.6"/>
</svg>