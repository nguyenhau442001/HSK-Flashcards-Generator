  <!-- Directional Indicator (Subtle visual cue for 'Right') -->
  <path d="M110 120 L130 110 L110 100 Z" fill="#38bdf8"/>
  <rect x="100" y="108" width="15" height="4" fill="#38bdf8"/>
  
  <!-- Street details -->
