  <rect x="20" y="60" width="70" height="100" fill="#475569" rx="4"/>
  <rect x="35" y="80" width="40" height="30" fill="#1e293b"/>
  
  <!-- Right Building (The Bank - The Target Subject) -->
  <rect x="130" y="40" width="90" height="120" fill="#f59e0b" rx="4"/>
  <rect x="145" y="60" width="60" height="40" fill="#1e293b"/>
  <rect x="160" y="120" width="30" height="40" fill="#fb923c"/>
  
  <!-- Decorative elements -->
