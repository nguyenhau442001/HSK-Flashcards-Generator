<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="52" y="52" width="136" height="84" rx="6"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Window Scene in Background -->
  <path d="M 160 35 L 205 35 L 205 95 L 160 95 Z" fill="url(#windowGrad)" opacity="0.6"/>
  <circle cx="185" cy="55" r="8" fill="#fbbf24" opacity="0.8"/>
  <path d="M 165 75 Q 185 65 205 75 L 205 95 L 165 95 Z" fill="#334155" opacity="0.4"/>

  <!-- Ambient Light Cone from Screen -->
  <path d="M 50 140 L -20 210 L 260 210 L 190 140 Z" fill="url(#glowGrad)"/>

  <!-- Bookshelf / Wall Details -->
  <rect x="30" y="35" width="40" height="6" rx="2" fill="#475569" opacity="0.5"/>
  <rect x="35" y="21" width="8" height="14" rx="1" fill="#ec4899" opacity="0.7"/>
  <rect x="45" y="17" width="10" height="18" rx="1" fill="#38bdf8" opacity="0.7"/>
  <rect x="57" y="23" width="7" height="12" rx="1" fill="#10b981" opacity="0.7"/>

  <!-- Houseplant -->
  <path d="M 205 130 Q 215 130 210 145 L 200 145 Q 195 130 205 130 Z" fill="#64748b"/>
  <path d="M 205 130 Q 195 105 185 110" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 205 130 Q 220 100 225 105" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 205 130 Q 210 95 200 90" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Desk Surface -->
  <path d="M 10 180 L 230 180 L 220 210 L 20 210 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <rect x="15" y="176" width="210" height="6" rx="3" fill="#475569"/>

  <!-- Desk Lamp -->
  <path d="M 195 180 L 205 140 L 215 180 Z" fill="#475569" opacity="0.8"/>
  <path d="M 192 142 Q 205 125 185 110" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 175 105 L 195 100 L 190 115 Z" fill="#fbbf24"/>

  <!-- Coffee Mug -->
  <rect x="165" y="155" width="18" height="22" rx="3" fill="#f8fafc" filter="url(#shadow)"/>
  <path d="M 183 160 C 190 160 190 172 183 172" stroke="#f8fafc" stroke-width="3" fill="none"/>
  <path d="M 171 150 Q 174 144 171 140" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 177 149 Q 180 143 177 139" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Laptop Setup -->
  <!-- Laptop Base -->
  <path d="M 35 178 L 205 178 L 195 160 L 45 160 Z" fill="#94a3b8" filter="url(#shadow)"/>
  <path d="M 95 178 L 145 178 L 143 175 L 97 175 Z" fill="#64748b"/>
  
  <!-- Laptop Screen Frame -->
  <rect x="44" y="44" width="152" height="100" rx="10" fill="#475569" filter="url(#shadow)"/>
  <rect x="48" y="48" width="144" height="92" rx="8" fill="#1e293b"/>
  
  <!-- Screen Content (The Internet Concept) -->
  <g clip-path="url(#screenClip)">
    <rect x="52" y="52" width="136" height="84" fill="url(#screenGrad)"/>
    
    <!-- Browser UI Bar -->
    <rect x="52" y="52" width="136" height="14" fill="#0f172a"/>
    <circle cx="60" cy="59" r="2.5" fill="#ef4444"/>
    <circle cx="68" cy="59" r="2.5" fill="#f59e0b"/>
    <circle cx="76" cy="59" r="2.5" fill="#10b981"/>
    <rect x="86" y="56" width="70" height="6" rx="3" fill="#334155"/>

    <!-- Dynamic Web Interface Graphic (Network/Connectivity) -->
    <!-- Connection Grid / Waves -->
    <path d="M 52 110 Q 80 85 120 100 T 188 80" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M 52 125 Q 90 95 130 115 T 188 95" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Floating UI Windows / Data Cards -->
    <rect x="62" y="74" width="45" height="30" rx="4" fill="#ffffff" fill-opacity="0.9" filter="url(#shadow)"/>
    <rect x="68" y="80" width="25" height="4" rx="2" fill="#3b82f6"/>
    <rect x="68" y="88" width="33" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="68" y="94" width="20" height="3" rx="1.5" fill="#cbd5e1"/>

    <rect x="120" y="85" width="55" height="38" rx="4" fill="#ffffff" fill-opacity="0.9" filter="url(#shadow)"/>
    <circle cx="135" cy="98" r="8" fill="#10b981" opacity="0.2"/>
    <path d="M 131 98 L 134 101 L 141 94" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="148" y="94" width="20" height="3" rx="1.5" fill="#475569"/>
    <rect x="148" y="100" width="14" height="3" rx="1.5" fill="#94a3b8"/>
    <rect x="126" y="111" width="42" height="4" rx="2" fill="#3b82f6" opacity="0.8"/>

    <!-- Glowing Network Nodes & Connections -->
    <line x1="107" y1="89" x2="120" y2="104" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="107" cy="89" r="3" fill="#fbbf24"/>
    <circle cx="120" cy="104" r="3" fill="#38bdf8"/>
    <circle cx="155" cy="74" r="4" fill="#ec4899"/>
    <line x1="155" y1="74" x2="140" y2="85" stroke="#ec4899" stroke-width="1.5"/>

    <!-- Wifi Signal Icon pulsing on screen -->
    <path d="M 172 68 A 6 6 0 0 1 184 68" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 170 66 A 9 9 0 0 1 186 66" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <circle cx="178" cy="70" r="1" fill="#38bdf8"/>
  </g>

  <!-- Laptop Hinge & Glow reflection -->
  <rect x="110" y="142" width="20" height="3" rx="1" fill="#334155"/>
  <ellipse cx="120" cy="144" rx="40" ry="4" fill="#38bdf8" opacity="0.3"/>

  <!-- Character Arms interacting with laptop -->
  <!-- Left arm -->
  <path d="M 15 210 Q 25 180 50 170" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
  <circle cx="50" cy="170" r="6" fill="#f87171"/>
  
  <!-- Right arm -->
  <path d="M 225 210 Q 210 180 185 172" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
  <circle cx="185" cy="172" r="6" fill="#f87171"/>

  <!-- Foreground Atmospheric Particles / Sparkles (Data stream vibe) -->
  <circle cx="35" cy="100" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="25" cy="130" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="215" cy="70" r="2" fill="#ec4899" opacity="0.7"/>
  <circle cx="200" cy="95" r="1" fill="#38bdf8" opacity="0.9"/>
</svg>