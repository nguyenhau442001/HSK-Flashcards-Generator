<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="40" y="160" width="160" height="15" fill="#334155" rx="2"/>
  <rect x="50" y="175" width="10" height="65" fill="#1e293b"/>
  <rect x="180" y="175" width="10" height="65" fill="#1e293b"/>
  
  <!-- Desk items -->
  <rect x="60" y="130" width="80" height="30" fill="#f1f5f9" rx="4"/>
  <circle cx="160" cy="145" r="12" fill="#fb923c"/>
  
  <!-- Character -->
  <g transform="translate(0, 10)">
    <!-- Body -->
    <path d="M80 230 Q120 180 160 230" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="120" cy="100" r="35" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M90 90 Q120 60 150 90 Q120 70 90 90" fill="#475569"/>
    <!-- Eyes (The "Aha" moment) -->
    <circle cx="105" cy="95" r="4" fill="#0f172a"/>
    <circle cx="135" cy="95" r="4" fill="#0f172a"/>
    <!-- Mouth (Smiling realization) -->
    <path d="M105 115 Q120 125 135 115" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Hand pointing to head -->
    <path d="M140 100 L160 80" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="165" cy="75" r="6" fill="#fde68a"/>
  </g>

  <!-- Light bulb glow effect -->
  <circle cx="165" cy="75" r="15" fill="#fbbf24" opacity="0.2"/>
  <circle cx="165" cy="75" r="8" fill="#fef3c7" opacity="0.4"/>
  
  <!-- Background elements -->
  <rect x="20" y="40" width="40" height="60" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M30 50 L50 50 M30 65 L50 65 M30 80 L40 80" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
</svg>