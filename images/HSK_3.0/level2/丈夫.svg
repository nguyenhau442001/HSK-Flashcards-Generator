<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Hospital/Office Context -->
  <rect x="20" y="140" width="200" height="100" fill="#334155" rx="10"/>
  <circle cx="120" cy="180" r="40" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- The Husband (Doctor) -->
  <g transform="translate(60, 60)">
    <!-- Body -->
    <path d="M60 160 L100 160 L110 110 L50 110 Z" fill="#f1f5f9"/>
    <path d="M65 110 L95 110 L95 80 L65 80 Z" fill="#f1f5f9"/>
    <!-- Stethoscope -->
    <path d="M70 100 C 60 100, 50 110, 50 120" stroke="#ec4899" stroke-width="4" fill="none"/>
    <circle cx="80" cy="120" r="8" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="80" cy="65" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M60 60 C 60 40, 100 40, 100 60" fill="#475569"/>
    <!-- Glasses -->
    <rect x="65" y="60" width="12" height="8" fill="#0f172a"/>
    <rect x="83" y="60" width="12" height="8" fill="#0f172a"/>
    <line x1="77" y1="64" x2="83" y2="64" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Props -->
  <rect x="160" y="150" width="40" height="60" fill="#fbbf24" rx="4"/>
  <circle cx="180" cy="170" r="10" fill="#10b981"/>
  <path d="M175 170 L185 170 M180 165 L180 175" stroke="#fff" stroke-width="3"/>
</svg>