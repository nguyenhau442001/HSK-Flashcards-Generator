<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Distant Mountain Range -->
  <path d="M0 160 L40 120 L80 150 L120 110 L160 140 L200 100 L240 130 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Path leading to distance -->
  <path d="M100 240 L120 180 L140 240 Z" fill="#475569"/>
  
  <!-- House in the foreground -->
  <rect x="20" y="150" width="60" height="50" fill="#fb923c"/>
  <polygon points="20,150 50,120 80,150" fill="#ec4899"/>
  <rect x="40" y="170" width="20" height="30" fill="#1e293b"/>
  
  <!-- Distant City/Landmarks (The 'Far' element) -->
  <rect x="180" y="130" width="20" height="30" fill="#38bdf8" opacity="0.6"/>
  <rect x="205" y="120" width="15" height="40" fill="#38bdf8" opacity="0.6"/>
  
  <!-- Atmospheric elements -->
  <circle cx="200" cy="40" r="20" fill="#fbbf24"/>
  <path d="M10 80 Q 30 60 50 80 T 90 80" stroke="#f1f5f9" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M150 50 Q 170 30 190 50 T 230 50" stroke="#f1f5f9" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Perspective lines -->
  <path d="M120 180 L240 240" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M120 180 L0 240" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
</svg>