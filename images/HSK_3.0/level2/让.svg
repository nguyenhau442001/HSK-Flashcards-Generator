<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Kitchen Counter -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <rect x="0" y="160" width="240" height="10" fill="#475569"/>
  
  <!-- Sink Basin -->
  <path d="M40 170 H200 L190 220 H50 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Bubbles -->
  <circle cx="70" cy="180" r="8" fill="#e0f2fe" opacity="0.6"/>
  <circle cx="85" cy="175" r="12" fill="#e0f2fe" opacity="0.4"/>
  <circle cx="100" cy="185" r="6" fill="#e0f2fe" opacity="0.8"/>
  
  <!-- Mom Figure (Upper Body) -->
  <g transform="translate(140, 60)">
    <path d="M0 20 C0 0 40 0 40 20 L35 80 L5 80 Z" fill="#ec4899"/>
    <circle cx="20" cy="15" r="15" fill="#fde68a"/>
    <path d="M10 10 Q15 5 20 5 T30 10" stroke="#92400e" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Child Figure (Rinsing Plate) -->
  <g transform="translate(40, 90)">
    <path d="M10 100 L10 150 L70 150 L70 100 Z" fill="#38bdf8"/>
    <circle cx="40" cy="80" r="20" fill="#fde68a"/>
    <!-- Plate -->
    <ellipse cx="80" cy="110" rx="15" ry="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Hands -->
    <rect x="55" y="105" width="10" height="5" fill="#fde68a"/>
    <rect x="70" y="105" width="10" height="5" fill="#fde68a"/>
  </g>
  
  <!-- Faucet -->
  <path d="M160 160 V100 C160 80 180 80 180 100 V120" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M180 120 L185 140" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative highlights -->
  <circle cx="210" cy="40" r="4" fill="#fbbf24"/>
  <circle cx="30" cy="50" r="3" fill="#fbbf24"/>
</svg>