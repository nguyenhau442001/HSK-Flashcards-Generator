<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Doorway Frame -->
  <path d="M70 40 L170 40 L170 200 L140 200 L140 70 L100 70 L100 200 L70 200 Z" fill="#334155"/>
  <rect x="135" y="65" width="10" height="135" fill="#475569"/>
  
  <!-- Character stepping out -->
  <g transform="translate(120, 110)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#f59e0b"/>
    <!-- Head -->
    <circle cx="0" cy="-35" r="12" fill="#f59e0b"/>
    <!-- Legs in motion -->
    <path d="M-5 25 L-15 50 M5 25 L15 60" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M-15 -5 L-25 15 M15 -5 L25 10" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Floor details -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
  
  <!-- Atmospheric light -->
  <circle cx="120" cy="120" r="80" fill="#fbbf24" fill-opacity="0.05"/>
  
  <!-- Motion lines -->
  <path d="M160 100 Q180 120 160 140" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M170 90 Q200 120 170 150" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>