<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="240" height="240" fill="url(#bgGrad)" />
    <rect width="240" height="240" fill="url(#lampGlow)" />

    <!-- Ambient Room Details -->
    <!-- Window backdrop showing evening sky -->
    <path d="M150 30 H205 V130 H150 Z" fill="#334155" opacity="0.4" />
    <path d="M155 35 H200 V125 H155 Z" fill="#0284c7" opacity="0.15" />
    <path d="M177 35 V125" stroke="#334155" stroke-width="2" opacity="0.5" />
    <path d="M155 80 H200" stroke="#334155" stroke-width="2" opacity="0.5" />

    <!-- Bookshelf / Warm background props -->
    <rect x="25" y="45" width="40" height="85" rx="4" fill="#334155" opacity="0.3" />
    <rect x="30" y="60" width="30" height="8" fill="#fb923c" opacity="0.6" />
    <rect x="30" y="75" width="25" height="8" fill="#38bdf8" opacity="0.6" />
    <rect x="30" y="90" width="28" height="8" fill="#10b981" opacity="0.6" />

    <!-- Floor / Rug -->
    <ellipse cx="120" cy="205" rx="90" ry="20" fill="#0b0f19" opacity="0.6" />
    <ellipse cx="120" cy="202" rx="75" ry="14" fill="#3b82f6" opacity="0.15" />

    <!-- Grandfather Chair (Rocking Chair / Armchair) -->
    <!-- Chair legs and rocking base -->
    <path d="M70 190 Q50 205 40 198" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M170 190 Q190 205 200 198" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none" />
    <line x1="85" y1="192" x2="80" y2="150" stroke="#64748b" stroke-width="4" />
    <line x1="155" y1="192" x2="160" y2="150" stroke="#64748b" stroke-width="4" />

    <!-- Chair Back & Cushion -->
    <path d="M75 130 C70 80 170 80 165 130 C160 170 80 170 75 130 Z" fill="#475569" />
    <path d="M82 135 C78 95 162 95 158 135 C154 165 86 165 82 135 Z" fill="#64748b" />

    <!-- Grandfather Character (爷爷) -->
    <!-- Body / Torso -->
    <path d="M95 160 C95 135 145 135 145 160 L155 195 C155 200 85 200 85 195 Z" fill="#1e40af" />
    <!-- Collar / Shirt -->
    <path d="M110 135 L120 150 L130 135 Z" fill="#e2e8f0" />
    <path d="M115 138 H125 V165 H115 Z" fill="#f8fafc" />
    <!-- Cardigan / Vest -->
    <path d="M95 140 L110 135 L115 195 H88 C88 195 93 160 95 140 Z" fill="#b45309" />
    <path d="M145 140 L130 135 L125 195 H152 C152 195 147 160 145 140 Z" fill="#b45309" />

    <!-- Arms & Hands -->
    <!-- Left arm holding tea cup -->
    <path d="M96 148 Q75 155 85 175" stroke="#b45309" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Right arm resting -->
    <path d="M144 148 Q165 155 155 180" stroke="#b45309" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="85" cy="177" r="6" fill="#fcd34d" />
    <circle cx="155" cy="182" r="6" fill="#fcd34d" />

    <!-- Neck -->
    <rect x="112" y="125" width="16" height="15" rx="4" fill="#fcd34d" />

    <!-- Head -->
    <circle cx="120" cy="105" r="24" fill="#fef3c7" />

    <!-- Facial Features -->
    <!-- Friendly Wrinkles / Smile Lines -->
    <path d="M107 105 Q113 112 120 112 Q127 112 133 105" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M104 98 Q108 102 106 106" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M136 98 Q132 102 134 106" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    <!-- Gentle Closed Happy Eyes -->
    <path d="M106 95 Q110 99 114 95" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M126 95 Q130 99 134 95" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Cheeks -->
    <circle cx="103" cy="104" r="5" fill="#f43f5e" opacity="0.25" />
    <circle cx="137" cy="104" r="5" fill="#f43f5e" opacity="0.25" />
    <!-- Friendly Smile (Open and warm) -->
    <path d="M113 108 Q120 116 127 108" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Glasses (Round vintage frames) -->
    <circle cx="110" cy="96" r="8" stroke="#fbbf24" stroke-width="2" fill="none" />
    <circle cx="130" cy="96" r="8" stroke="#fbbf24" stroke-width="2" fill="none" />
    <line x1="118" y1="96" x2="122" y2="96" stroke="#fbbf24" stroke-width="2" />
    <path d="M102 94 Q97 92 95 95" stroke="#fbbf24" stroke-width="2" fill="none" />
    <path d="M138 94 Q143 92 145 95" stroke="#fbbf24" stroke-width="2" fill="none" />

    <!-- White Hair & Beard (Signifier of age/wisdom - 爷爷) -->
    <!-- Hair tufts on sides -->
    <path d="M96 100 C92 90 98 80 108 82 C114 70 126 70 132 82 C142 80 148 90 144 100 C148 105 145 112 140 110 C140 120 100 120 100 110 C95 112 92 105 96 100 Z" fill="#f1f5f9" />
    <!-- Fluffy Beard -->
    <path d="M105 110 C105 125 135 125 135 110 C138 115 135 128 120 132 C105 128 102 115 105 110 Z" fill="#f8fafc" />

    <!-- Foreground Props -->
    <!-- Teacup and Steam -->
    <rect x="80" y="168" width="14" height="16" rx="3" fill="#e2e8f0" />
    <path d="M94 172 C98 172 98 178 94 180" stroke="#e2e8f0" stroke-width="2" fill="none" />
    <path d="M83 162 Q85 156 83 150" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M89 164 Q91 158 89 152" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Small Side Table & Plant -->
    <rect x="175" y="150" width="35" height="45" rx="4" fill="#334155" />
    <rect x="182" y="130" width="20" height="20" rx="3" fill="#0ea5e9" />
    <path d="M192 130 C192 115 180 110 175 105 C185 110 192 120 192 130 Z" fill="#10b981" />
    <path d="M192 130 C192 115 204 110 209 105 C199 110 192 120 192 130 Z" fill="#34d399" />
    <path d="M192 130 C192 110 192 100 192 95 C192 100 192 110 192 130 Z" fill="#059669" />

    <!-- Warm Overhead Reading Lamp -->
    <path d="M120 0 V35" stroke="#64748b" stroke-width="4" />
    <path d="M100 35 H140 L150 50 H90 Z" fill="#f59e0b" />
    <!-- Light Cone Overlay -->
    <polygon points="120,50 60,220 180,220" fill="#fbbf24" opacity="0.07" />

    <!-- Atmospheric Star/Sparkles for warmth -->
    <circle cx="50" cy="80" r="2" fill="#fbbf24" opacity="0.8" />
    <circle cx="210" cy="70" r="1.5" fill="#fbbf24" opacity="0.6" />
    <circle cx="35" cy="150" r="1.5" fill="#38bdf8" opacity="0.5" />
  </g>
</svg>