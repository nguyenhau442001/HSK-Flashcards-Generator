<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Context: Travel / Journey Setting -->
  <!-- Indoor Departure Hall / Station Background -->
  <rect x="20" y="30" width="200" height="130" fill="url(#skyGrad)" rx="8" />
  
  <!-- Large Window / Departure Gate Backdrop -->
  <path d="M40 40 L200 40 L200 150 L40 150 Z" fill="#1e293b" opacity="0.6" />
  <rect x="50" y="50" width="45" height="90" fill="#334155" rx="4" opacity="0.5" />
  <rect x="105" y="50" width="45" height="90" fill="#334155" rx="4" opacity="0.5" />
  <rect x="160" y="50" width="30" height="90" fill="#334155" rx="4" opacity="0.5" />

  <!-- Warm ambient light from departure board / sign -->
  <rect x="70" y="20" width="100" height="15" rx="3" fill="#f59e0b" opacity="0.2" />
  <circle cx="120" cy="27" r="3" fill="#fbb6ce" />

  <!-- Floor / Ground Plane -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#groundGrad)" />
  <!-- Floor tile lines for perspective -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="1" opacity="0.3" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#475569" stroke-width="1" opacity="0.3" />
  <line x1="120" y1="160" x2="140" y2="240" stroke="#475569" stroke-width="1" opacity="0.2" />
  <line x1="120" y1="160" x2="100" y2="240" stroke="#475569" stroke-width="1" opacity="0.2" />

  <!-- Context Props: Travel Bags -->
  <!-- Suitcase 1 -->
  <rect x="20" y="155" width="22" height="30" rx="4" fill="#ec4899" />
  <path d="M25 155 C25 150, 37 150, 37 155" fill="none" stroke="#f472b6" stroke-width="2" />
  <line x1="20" y1="165" x2="42" y2="165" stroke="#be185d" stroke-width="2" />
  <circle cx="25" cy="188" r="3" fill="#0f172a" />
  <circle cx="37" cy="188" r="3" fill="#0f172a" />

  <!-- Backpack on floor -->
  <path d="M195 160 C190 150, 210 150, 205 160 L212 185 C212 188, 208 190, 204 190 L196 190 C192 190, 188 188, 188 185 Z" fill="#10b981" />
  <path d="M198 152 C198 148, 202 148, 202 152" fill="none" stroke="#059669" stroke-width="2" />

  <!-- Character 1 (Left - 'Anh ấy' / He) Walking Forward -->
  <g transform="translate(75, 105)">
    <!-- Shadow -->
    <ellipse cx="5" cy="67" rx="14" ry="4" fill="#000000" opacity="0.4" />
    
    <!-- Legs in motion -->
    <!-- Back Leg -->
    <path d="M2 38 L-8 62" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" />
    <!-- Front Leg -->
    <path d="M8 38 L16 62" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round" />
    <!-- Shoes -->
    <path d="M-12 62 L-5 62" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <path d="M14 62 L22 62" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

    <!-- Torso -->
    <path d="M-4 15 C-4 15, -6 38, 2 38 C10 38, 8 15, 8 15 Z" fill="#38bdf8" />
    
    <!-- Jacket / Shirt Details -->
    <path d="M2 15 L2 38" stroke="#0284c7" stroke-width="2" />

    <!-- Arms in motion (carrying bag straps or relaxed) -->
    <path d="M-4 18 L-12 35" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <path d="M8 18 L18 32" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />

    <!-- Head & Face -->
    <circle cx="2" cy="4" r="11" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M-9 2 C-9 -4, 11 -4, 13 2 C13 5, 10 3, 7 0 C4 -3, -2 -3, -5 0 C-8 3, -9 0, -9 2 Z" fill="#475569" />
    <!-- Friendly Expression -->
    <circle cx="6" cy="4" r="1.5" fill="#0f172a" />
    <path d="M4 8 C5 9, 7 9, 8 8" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Character 2 (Right - 'Tôi' / Me) Following closely / Going together ("Cùng với... đi") -->
  <g transform="translate(135, 105)">
    <!-- Shadow -->
    <ellipse cx="5" cy="67" rx="14" ry="4" fill="#000000" opacity="0.4" />

    <!-- Legs in motion (synchronized step) -->
    <!-- Back Leg -->
    <path d="M2 38 L-4 62" stroke="#fb923c" stroke-width="6" stroke-linecap="round" />
    <!-- Front Leg -->
    <path d="M8 38 L14 62" stroke="#ea580c" stroke-width="6" stroke-linecap="round" />
    <!-- Shoes -->
    <path d="M-8 62 L-1 62" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <path d="M12 62 L19 62" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

    <!-- Torso -->
    <path d="M-4 15 C-4 15, -6 38, 2 38 C10 38, 8 15, 8 15 Z" fill="#fbbf24" />

    <!-- Arms swinging harmoniously -->
    <path d="M-4 18 L-10 32" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
    <path d="M8 18 L15 32" stroke="#d97706" stroke-width="5" stroke-linecap="round" />

    <!-- Head & Face -->
    <circle cx="2" cy="4" r="11" fill="#fbcfe8" />
    <!-- Hair (Pigtail / Bob) -->
    <path d="M-8 2 C-8 -5, 12 -5, 11 2 C8 1, 6 -2, 2 -2 C-2 -2, -5 1, -8 2 Z" fill="#1e293b" />
    <circle cx="12" cy="3" r="3" fill="#1e293b" />
    <!-- Happy Expression -->
    <circle cx="6" cy="4" r="1.5" fill="#0f172a" />
    <path d="M4 7 C5 9, 8 9, 9 7" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Directional Motion / Action Indicator (Subtle glowing arrow on floor showing "Going together") -->
  <path d="M90 195 Q 120 185 150 195" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.6" />
  <path d="M142 191 L152 195 L144 201" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

</svg>