<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Room Glow -->
    <radialGradient id="roomGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- New Trousers Gradient (Vibrant Blue) -->
    <linearGradient id="newPantsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Mirror Shine Gradient -->
    <linearGradient id="mirrorShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#roomGlow)"/>

  <!-- ENVIRONMENT / INTERIOR -->
  <!-- Wooden Floor Line / Baseboard -->
  <rect x="0" y="200" width="240" height="40" fill="url(#floorGrad)"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>

  <!-- Wallpaper Stripe Pattern background -->
  <g opacity="0.15">
    <line x1="40" y1="0" x2="40" y2="200" stroke="#94a3b8" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="200" stroke="#94a3b8" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="200" stroke="#94a3b8" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="200" stroke="#94a3b8" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="200" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- CLOSET / WARDROBE IN BACKGROUND -->
  <rect x="20" y="30" width="70" height="170" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="55" y1="30" x2="55" y2="200" stroke="#334155" stroke-width="2"/>
  <circle cx="48" cy="110" r="3" fill="#64748b"/>
  <circle cx="62" cy="110" r="3" fill="#64748b"/>

  <!-- OPEN SHOPPING BOX WITH "NEW" TAG VIBE -->
  <g transform="translate(180, 160)" filter="url(#softShadow)">
    <!-- Box Body -->
    <path d="M-25,10 L-20,40 L20,40 L25,10 Z" fill="#9a3412"/>
    <path d="M-28,10 L0,0 L28,10 L20,13 L0,3 L-20,13 Z" fill="#ea580c"/>
    <!-- Tissue Paper spilling out -->
    <path d="M-15,5 C-10,-5 10,-5 15,5 C10,2 -10,2 -15,5 Z" fill="#f8fafc" opacity="0.8"/>
  </g>

  <!-- FULL-LENGTH MIRROR ON THE RIGHT -->
  <g transform="translate(185, 25)" filter="url(#softShadow)">
    <!-- Mirror Frame -->
    <rect x="0" y="0" width="35" height="165" rx="17.5" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Mirror Glass -->
    <rect x="4" y="4" width="27" height="157" rx="13.5" fill="#0f172a"/>
    <!-- Reflection/Shine -->
    <path d="M6,10 L20,10 L10,120 L6,120 Z" fill="url(#mirrorShine)"/>
  </g>

  <!-- MAIN CHARACTER (HE) - POSING PROUDLY IN NEW TROUSERS -->
  <g transform="translate(105, 70)" filter="url(#softShadow)">
    <!-- Shadow on floor -->
    <ellipse cx="5" cy="132" rx="22" ry="6" fill="#000000" opacity="0.5"/>

    <!-- SHOES -->
    <path d="M-13,130 C-13,126 -7,126 -2,126 C4,126 12,128 12,132 C12,134 8,135 -2,135 C-10,135 -13,133 -13,130 Z" fill="#0f172a"/>
    <path d="M10,130 C10,126 16,126 21,126 C27,126 35,128 35,132 C35,134 31,135 21,135 C13,135 10,133 10,130 Z" fill="#0f172a"/>

    <!-- THE TARGET VOCABULARY: 裤子 (NEW TROUSERS) -->
    <!-- Crisp, bright blue stylish trousers with clean crease lines -->
    <g>
      <!-- Left Leg -->
      <path d="M-11,62 L-2,62 L-4,128 L-13,128 Z" fill="url(#newPantsGrad)"/>
      <!-- Right Leg -->
      <path d="M3,62 L12,62 L17,128 L8,128 Z" fill="url(#newPantsGrad)"/>
      <!-- Trouser Crease / Highlight -->
      <line x1="-7" y1="65" x2="-8" y2="125" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
      <line x1="7" y1="65" x2="12" y2="125" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
      <!-- Waistband -->
      <rect x="-13" y="57" width="28" height="8" rx="2" fill="#0284c7"/>
      <!-- Belt -->
      <rect x="-12" y="59" width="26" height="3" fill="#1e293b"/>
      <rect x="-2" y="58" width="4" height="5" fill="#fbbf24"/>
    </g>

    <!-- TORSO (Casual fitted shirt tucked in) -->
    <path d="M-13,18 C-13,15 -7,12 0,12 C7,12 13,15 13,18 L15,58 C15,60 12,62 10,62 C5,62 -5,62 -10,62 C-12,62 -15,60 -15,58 Z" fill="#f8fafc"/>
    <!-- Shirt Buttons -->
    <circle cx="0" cy="25" r="1.5" fill="#cbd5e1"/>
    <circle cx="0" cy="35" r="1.5" fill="#cbd5e1"/>
    <circle cx="0" cy="45" r="1.5" fill="#cbd5e1"/>

    <!-- ARMS & HANDS (Confident pose: hands on hips / relaxed) -->
    <!-- Left arm -->
    <path d="M-13,20 C-22,25 -22,40 -16,48" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-16" cy="49" r="3.5" fill="#fde047"/> <!-- Hand -->
    <!-- Right arm -->
    <path d="M13,20 C22,25 22,40 16,48" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
    <circle cx="16" cy="49" r="3.5" fill="#fde047"/> <!-- Hand -->

    <!-- HEAD & FACE (Happy, satisfied expression) -->
    <!-- Neck -->
    <rect x="-4" y="8" width="8" height="8" fill="#fde047"/>
    <!-- Head/Face Shape -->
    <circle cx="0" cy="-2" r="16" fill="#fde047"/>
    <!-- Hair (Trendy dark haircut) -->
    <path d="M-15,-6 C-15,-14 -5,-17 0,-17 C7,-17 15,-14 15,-6 C15,-2 13,-2 13,-8 C13,-13 6,-14 0,-14 C-6,-14 -12,-13 -13,-8 C-13,-2 -15,-2 -15,-6 Z" fill="#0f172a"/>

    <!-- Facial Features -->
    <!-- Eyes: Happy closed curves -->
    <path d="M-6,-3 C-5,-5 -3,-5 -2,-3" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M2,-3 C3,-5 5,-5 6,-3" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Big joyful smile -->
    <path d="M-4,3 C-4,7 4,7 4,3" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="-9" cy="1" r="2.5" fill="#f43f5e" opacity="0.4"/>
    <circle cx="9" cy="1" r="2.5" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- SPARKLES / "NEW" VISUAL ACCENTS (NO TEXT) -->
  <g transform="translate(75, 115)">
    <!-- Sparkle 1 -->
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(155, 95)">
    <!-- Sparkle 2 (smaller) -->
    <path d="M0,-5 L1.5,-1.5 L5,0 L1.5,1.5 L0,5 L-1.5,1.5 L-5,0 L-1.5,-1.5 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(95, 165)">
    <!-- Sparkle 3 -->
    <path d="M0,-6 L2,-2 L6,0 L2,2 L0,6 L-2,2 L-6,0 L-2,-2 Z" fill="#fbbf24"/>
  </g>

</svg>