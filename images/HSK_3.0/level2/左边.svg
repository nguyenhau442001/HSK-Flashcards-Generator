<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground Plane -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- School Building (Left Side) -->
  <g transform="translate(30, 60)">
    <rect width="80" height="120" rx="4" fill="#38bdf8"/>
    <rect x="15" y="20" width="20" height="20" fill="#0f172a"/>
    <rect x="45" y="20" width="20" height="20" fill="#0f172a"/>
    <rect x="25" y="70" width="30" height="50" fill="#fb923c"/>
    <path d="M0 60 L40 20 L80 60 Z" fill="#ec4899"/>
  </g>
  
  <!-- Decorative Props (Right Side - Contrast) -->
  <g transform="translate(150, 100)">
    <rect width="60" height="80" rx="4" fill="#475569"/>
    <circle cx="30" cy="40" r="15" fill="#10b981"/>
    <path d="M10 70 L50 70 L45 80 L15 80 Z" fill="#f59e0b"/>
  </g>

  <!-- Directional Indicator (Subtle visual cue) -->
  <path d="M120 120 L100 100 L120 80" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 100 L180 100" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
</svg>