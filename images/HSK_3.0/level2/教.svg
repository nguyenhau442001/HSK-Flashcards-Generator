<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character Gradients -->
    <linearGradient id="teacher-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="teacher-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="student1-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="student2-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Board Gradient -->
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light Effects -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- BACKGROUND ARCHITECTURE & PROPS -->
  <!-- Classroom Wall -->
  <rect x="16" y="16" width="208" height="180" rx="12" fill="#1e293b" opacity="0.6" />

  <!-- Window with Night City Silhouette -->
  <path d="M 175 25 L 215 25 L 215 95 L 175 95 Z" fill="url(#window-light)" stroke="#334155" stroke-width="2" />
  <path d="M 195 25 L 195 95 M 175 60 L 215 60" stroke="#334155" stroke-width="1.5" />
  <!-- City stars/lights outside -->
  <circle cx="183" cy="35" r="1" fill="#facc15" />
  <circle cx="205" cy="45" r="1.5" fill="#38bdf8" />
  <circle cx="188" cy="75" r="1" fill="#f43f5e" />

  <!-- Bookshelf on Back Wall -->
  <rect x="25" y="30" width="45" height="60" fill="#334155" rx="3" opacity="0.4" />
  <line x1="25" y1="50" x2="70" y2="50" stroke="#1e293b" stroke-width="2" />
  <line x1="25" y1="70" x2="70" y2="70" stroke="#1e293b" stroke-width="2" />
  <!-- Books on shelf -->
  <rect x="30" y="38" width="6" height="12" fill="#f59e0b" rx="1" />
  <rect x="38" y="36" width="8" height="14" fill="#38bdf8" rx="1" />
  <rect x="48" y="40" width="5" height="10" fill="#ec4899" rx="1" />
  <rect x="30" y="58" width="7" height="12" fill="#10b981" rx="1" />
  <rect x="39" y="56" width="6" height="14" fill="#fb923c" rx="1" />

  <!-- Large Blackboard / Whiteboard -->
  <rect x="78" y="24" width="88" height="65" rx="4" fill="url(#board-grad)" stroke="#475569" stroke-width="3" />
  <!-- Diagram on board (illustrating teaching concept without words) -->
  <path d="M 95 45 Q 105 35 115 45 T 135 45" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="145" cy="42" r="6" fill="none" stroke="#f43f5e" stroke-width="2" />
  <line x1="93" y1="62" x2="130" y2="62" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <line x1="93" y1="72" x2="120" y2="72" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <!-- Little decorative drawing on board -->
  <path d="M 150 68 L 155 58 L 160 68 Z" fill="#fbbf24" opacity="0.8" />

  <!-- Hanging Pendant Lamp -->
  <path d="M 120 0 L 120 22" stroke="#64748b" stroke-width="2" />
  <path d="M 105 22 L 135 22 L 140 28 L 100 28 Z" fill="#64748b" />
  <circle cx="120" cy="28" r="6" fill="#fbbf24" />

  <!-- Class Desk / Surface -->
  <path d="M 10 185 L 230 185 L 220 205 L 20 205 Z" fill="#334155" />
  <rect x="15" y="180" width="210" height="7" rx="3" fill="#475569" />

  <!-- FOREGROUND & CHARACTERS (Teacher + 2 Students) -->

  <!-- Student Left (Listening attentively, taking notes) -->
  <!-- Body/Outfit -->
  <path d="M 50 185 C 50 150 75 150 75 185 Z" fill="url(#student1-top)" />
  <!-- Head & Face -->
  <circle cx="62" cy="130" r="14" fill="#fed7aa" />
  <!-- Hair -->
  <path d="M 48 128 C 48 115 76 115 76 128 C 76 135 70 140 70 140 L 54 140 C 54 140 48 135 48 128 Z" fill="#451a03" />
  <!-- Arms & Hands on desk -->
  <path d="M 55 170 L 68 185 L 75 180" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Open Notebook on Desk -->
  <path d="M 60 182 L 85 178 L 90 192 L 65 196 Z" fill="#f8fafc" />
  <line x1="75" y1="180" x2="77" y2="194" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M 68 186 L 72 185 M 78 184 L 83 183" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />

  <!-- Student Right (Engaged, pointing/looking up) -->
  <!-- Body/Outfit -->
  <path d="M 165 185 C 165 150 190 150 190 185 Z" fill="url(#student2-top)" />
  <!-- Head & Face -->
  <circle cx="178" cy="132" r="14" fill="#fbcfe8" />
  <!-- Hair (Ponytail) -->
  <path d="M 164 128 C 164 116 192 116 192 128 C 192 133 198 138 202 135 C 196 120 170 120 164 128 Z" fill="#1e293b" />
  <circle cx="203" cy="133" r="3.5" fill="#1e293b" />
  <!-- Arm raised slightly -->
  <path d="M 170 165 L 160 152 L 168 148" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- TEACHER (Main Subject - Center, Expressive Gesture) -->
  <!-- Teacher Torso -->
  <path d="M 105 190 C 105 145 135 145 135 190 Z" fill="url(#teacher-top)" />
  <path d="M 115 145 L 125 145 L 122 165 L 118 165 Z" fill="#f8fafc" /> <!-- Collar -->

  <!-- Teacher Neck & Head -->
  <path d="M 115 135 L 125 135 L 123 148 L 117 148 Z" fill="#fde047" opacity="0.3" /> <!-- Neck shadow -->
  <rect x="114" y="132" width="12" height="15" fill="#fed7aa" rx="4" />
  <circle cx="120" cy="120" r="16" fill="#fed7aa" />

  <!-- Teacher Hair (Stylish bob cut) -->
  <path d="M 104 120 C 104 105 136 105 136 120 C 136 130 134 140 130 140 L 110 140 C 106 140 104 130 104 120 Z" fill="url(#teacher-hair)" />
  <path d="M 104 120 C 104 112 112 108 120 108 C 128 108 136 112 136 120 C 136 125 130 125 128 120" fill="none" stroke="url(#teacher-hair)" stroke-width="4" />

  <!-- Teacher Face Expression (Warm, smiling, communicative) -->
  <!-- Eyes (Happy arcs) -->
  <path d="M 113 118 Q 116 114 119 118" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <path d="M 121 118 Q 124 114 127 118" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <!-- Gentle Smile -->
  <path d="M 117 125 Q 120 129 123 125" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
  <!-- Rosy Cheeks -->
  <circle cx="111" cy="123" r="2.5" fill="#fda4af" opacity="0.6" />
  <circle cx="129" cy="123" r="2.5" fill="#fda4af" opacity="0.6" />

  <!-- Teacher Left Arm (Gesturing towards board/students - Teaching Action) -->
  <path d="M 110 155 L 90 140 L 82 145" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hand pointing/explaining -->
  <circle cx="80" cy="146" r="3.5" fill="#fed7aa" />

  <!-- Teacher Right Arm (Holding pointer stick or chalk towards board) -->
  <path d="M 130 155 L 148 135 L 155 125" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Pointer stick extending to board -->
  <path d="M 155 125 L 175 100" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="175" cy="100" r="2" fill="#f43f5e" />
  <circle cx="147" cy="134" r="3.5" fill="#fed7aa" />

  <!-- FOREGROUND PROPS & DETAILS -->
  <!-- Desk items: Coffee cup & plant for rich real-world context -->
  <!-- Mug -->
  <rect x="25" y="172" width="12" height="15" rx="3" fill="#f8fafc" />
  <path d="M 37 175 C 41 175 41 183 37 183" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 27 172 L 35 172" stroke="#f43f5e" stroke-width="2" /> <!-- Coffee art -->

  <!-- Small potted desk plant -->
  <path d="M 200 178 L 214 178 L 211 190 C 211 190 203 190 203 190 Z" fill="#fb923c" />
  <path d="M 207 178 C 205 168 198 165 195 162" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <circle cx="194" cy="161" r="5" fill="#34d399" />
  <path d="M 207 178 C 210 168 217 163 221 160" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <circle cx="222" cy="159" r="6" fill="#34d399" />
  <path d="M 207 178 C 207 167 207 160 207 155" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="207" cy="153" r="7" fill="#10b981" />

  <!-- Outer frame border overlay for clean app card look -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4" />
</svg>