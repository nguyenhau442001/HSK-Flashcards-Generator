<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Pain Aura Gradient -->
    <radialGradient id="painAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Lighting / Room Background Elements -->
  <!-- Wooden Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 166 L 240 166 L 240 170 L 0 170 Z" fill="#334155"/>

  <!-- Background Props: Bookshelf & Ambient Objects -->
  <rect x="25" y="80" width="45" height="90" rx="4" fill="#1e293b"/>
  <rect x="30" y="90" width="35" height="12" rx="2" fill="#38bdf8" opacity="0.4"/>
  <rect x="30" y="106" width="35" height="12" rx="2" fill="#f59e0b" opacity="0.4"/>
  <rect x="30" y="122" width="35" height="12" rx="2" fill="#10b981" opacity="0.4"/>

  <!-- Desk Lamp -->
  <path d="M 195 170 L 205 170 L 200 110 Z" fill="#475569"/>
  <path d="M 185 105 C 185 95 215 95 215 105 Z" fill="#fbbf24"/>
  <circle cx="200" cy="103" r="8" fill="#fef08a"/>
  <!-- Lamp Light Cone Projection -->
  <circle cx="160" cy="140" r="70" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Coffee Mug -->
  <rect x="175" y="140" width="18" height="26" rx="3" fill="#cbd5e1"/>
  <path d="M 193 145 C 200 145 200 159 193 159" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <!-- Steam from mug -->
  <path d="M 181 132 C 183 126 179 122 181 116" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Opened Work Document / Laptop Base -->
  <path d="M 100 155 L 160 150 L 170 168 L 90 170 Z" fill="#334155" filter="url(#softShadow)"/>
  <path d="M 105 157 L 155 153 L 163 166 L 97 168 Z" fill="#f8fafc"/>
  <!-- Lines of text on document -->
  <line x1="112" y1="159" x2="135" y2="157" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="163" x2="145" y2="161" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- MAIN SCENE: Character experiencing head pain (Đầu tôi rất đau) -->

  <!-- Pain Aura / Throbbing Head Effect -->
  <circle cx="120" cy="88" r="42" fill="url(#painAura)"/>
  <!-- Comic/Visual Action Pulsing Waves -->
  <path d="M 90 65 Q 85 60 80 62" stroke="#fb7185" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 150 65 Q 155 60 160 62" stroke="#fb7185" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 75 88 Q 68 88 70 95" stroke="#fb7185" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 165 88 Q 172 88 170 95" stroke="#fb7185" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Character Body / Torso & Hoodie -->
  <path d="M 90 170 C 90 135 150 135 150 170 Z" fill="#38bdf8" filter="url(#softShadow)"/>
  <!-- Hoodie Collar / Details -->
  <path d="M 105 138 C 120 148 135 138 135 138" stroke="#0284c7" stroke-width="3" fill="none"/>
  <path d="M 112 145 L 118 165" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <path d="M 128 145 L 122 165" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="110" y="115" width="20" height="25" fill="url(#skinGrad)"/>

  <!-- Head (Main Focal Point) -->
  <circle cx="120" cy="90" r="32" fill="url(#skinGrad)" filter="url(#softShadow)"/>

  <!-- Hair Style -->
  <path d="M 88 95 C 85 70 100 56 122 56 C 145 56 155 72 153 95 C 150 82 142 62 122 62 C 100 62 92 80 88 95 Z" fill="#1e293b"/>
  <path d="M 110 58 C 120 54 135 56 142 62 C 135 60 120 60 110 58 Z" fill="#334155"/>

  <!-- Facial Expression: Pain (Téng) -->
  <!-- Eyebrows in distress (furrowed, tilted up inwards) -->
  <path d="M 102 77 L 112 81" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <path d="M 138 77 L 128 81" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Closed, Pain-tensing Eyes (X shapes or tight curves) -->
  <path d="M 103 86 Q 108 91 113 86" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 127 86 Q 132 91 137 86" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Rosy/Stressed Cheeks -->
  <circle cx="104" cy="96" r="5" fill="#f43f5e" opacity="0.3"/>
  <circle cx="136" cy="96" r="5" fill="#f43f5e" opacity="0.3"/>

  <!-- Wincing/Grimacing Open Mouth (Showing pain) -->
  <path d="M 112 104 Q 120 100 128 104 Q 120 112 112 104 Z" fill="#881337"/>
  <path d="M 113 104 Q 120 107 127 104" stroke="#fecdd3" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Hands Grabbing Head (Expressing 'Đau' / Pain Action) -->
  <!-- Left Hand gripping side of head -->
  <path d="M 88 85 C 82 85 75 90 78 100 C 80 106 88 108 92 102" fill="url(#skinGrad)" filter="url(#softShadow)"/>
  <!-- Fingers detail -->
  <path d="M 82 88 L 89 91" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 81 94 L 88 96" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right Hand gripping side of head -->
  <path d="M 152 85 C 158 85 165 90 162 100 C 160 106 152 108 148 102" fill="url(#skinGrad)" filter="url(#softShadow)"/>
  <!-- Fingers detail -->
  <path d="M 158 88 L 151 91" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 159 94 L 152 96" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dynamic Sweat Drops (Action details showing stress/pain) -->
  <path d="M 96 70 C 96 70 93 75 93 77 C 93 79 94 80 96 80 C 98 80 99 79 99 77 C 99 75 96 70 96 70 Z" fill="#38bdf8" filter="url(#softShadow)"/>
  <path d="M 148 65 C 148 65 145 70 145 72 C 145 74 146 75 148 75 C 150 75 151 74 151 72 C 151 70 148 65 148 65 Z" fill="#38bdf8" filter="url(#softShadow)"/>

  <!-- Overhead Star / Pain Sparkles -->
  <g transform="translate(120, 42) scale(0.8)">
    <path d="M 0 -12 C 1 -4 4 -1 12 0 C 4 1 1 4 0 12 C -1 4 -4 1 -12 0 C -4 -1 -1 -4 0 -12 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(95, 48) scale(0.5)">
    <path d="M 0 -12 C 1 -4 4 -1 12 0 C 4 1 1 4 0 12 C -1 4 -4 1 -12 0 C -4 -1 -1 -4 0 -12 Z" fill="#f43f5e"/>
  </g>
</svg>