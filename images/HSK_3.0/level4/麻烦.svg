<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Paper Stack Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Glow for Chaos/Stress -->
    <radialGradient id="stressGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Ambience & Chaos Indicators -->
  <circle cx="120" cy="110" r="90" fill="url(#stressGlow)"/>

  <!-- Floating Tangled Lines/Errors (Representing "Máfan" - Complication/Trouble) -->
  <path d="M 60 70 Q 75 40 100 60 T 150 50 T 190 70" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 45 130 Q 70 100 85 120 T 130 110" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Wooden Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="3"/>

  <!-- BACKDROP PROPS -->
  <!-- Coffee Mug with Swirling Steam -->
  <rect x="180" y="130" width="22" height="28" rx="4" fill="#cbd5e1" filter="url(#shadow)"/>
  <path d="M 202 136 C 212 136 212 150 202 150" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <path d="M 188 120 Q 192 110 186 100" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 194 122 Q 198 112 192 102" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Laptop Screen Base (Half visible on side) -->
  <rect x="25" y="130" width="55" height="40" rx="4" fill="#475569" transform="skewX(-10)" filter="url(#shadow)"/>
  <rect x="30" y="135" width="45" height="30" rx="2" fill="#0f172a" transform="skewX(-10)"/>
  <!-- Error dialog on screen -->
  <rect x="38" y="143" width="28" height="14" rx="2" fill="#ef4444" transform="skewX(-10)"/>
  <circle.error cx="45" cy="150" r="3" fill="#fff" transform="skewX(-10)"/>

  <!-- MAIN SCENE: Overwhelmed Desk Environment ("Máfan" - Tangled paperwork & cascading files) -->

  <!-- Base Paper Folder (Open) -->
  <path d="M 60 185 L 90 155 L 180 155 L 180 185 Z" fill="#e2e8f0" filter="url(#shadow)"/>

  <!-- Tangled Stack of Papers (Falling/Messy) -->
  <!-- Paper Sheet 1 (Tilted Left) -->
  <g transform="rotate(-12 100 140)">
    <rect x="75" y="115" width="50" height="65" rx="2" fill="#f8fafc" filter="url(#shadow)"/>
    <line x1="83" y1="125" x2="110" y2="125" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="83" y1="135" x2="117" y2="135" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="83" y1="145" x2="100" y2="145" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Red correction marks (Trouble/Complication) -->
    <path d="M 105 155 L 115 165 M 115 155 L 105 165" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Paper Sheet 2 (Tilted Right - Centerpiece) -->
  <g transform="rotate(8 130 130)">
    <rect x="105" y="95" width="55" height="70" rx="2" fill="#ffffff" filter="url(#shadow)"/>
    <line x1="115" y1="108" x2="145" y2="108" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="120" x2="150" y2="120" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="132" x2="135" y2="132" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="144" x2="145" y2="144" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Giant Red Stamp/Cross indicating "Problem/Issue" -->
    <circle cx="132" cy="140" r="14" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.85"/>
    <path d="M 125 133 L 139 147 M 139 133 L 125 147" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Paper Sheet 3 (Flying/Flailing out) -->
  <g transform="rotate(25 160 110)">
    <rect x="135" y="80" width="45" height="60" rx="2" fill="#f1f5f9" filter="url(#shadow)"/>
    <line x1="143" y1="92" x2="165" y2="92" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="143" y1="102" x2="170" y2="102" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Exclamation mark on paper -->
    <circle cx="157" cy="120" r="4" fill="#f59e0b"/>
    <rect x="155" y="108" width="4" height="8" rx="2" fill="#f59e0b"/>
  </g>

  <!-- Tangled Red Tape / Ribbon winding through the papers (Visual metaphor for "Máfan" / Tangle) -->
  <path d="M 50 150 Q 80 180 120 140 T 170 160 T 200 110" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M 50 150 Q 80 180 120 140 T 170 160 T 200 110" fill="none" stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>

  <!-- FOREGROUND ACCENTS & DYNAMIC PARTICLES -->
  <!-- Floating Paperclips & Flying Notes -->
  <path d="M 85 90 C 85 85 95 85 95 90 L 95 110 C 95 115 85 115 85 110 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" transform="rotate(45 90 100)" filter="url(#shadow)"/>
  <path d="M 160 70 C 160 65 170 65 170 70 L 170 90 C 170 95 160 95 160 90 Z" fill="none" stroke="#fbbf24" stroke-width="2.5" transform="rotate(-30 165 80)" filter="url(#shadow)"/>

  <!-- Stress sweat drops floating near top center -->
  <path d="M 115 45 C 115 45 110 52 110 56 C 110 58.76 112.24 61 115 61 C 117.76 61 120 58.76 120 56 C 120 52 115 45 115 45 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 130 55 C 130 55 127 60 127 63 C 127 64.65 128.35 66 130 66 C 131.65 66 133 64.65 133 63 C 133 60 130 55 130 55 Z" fill="#38bdf8" opacity="0.7"/>

  <!-- Pen rolling off the desk -->
  <g transform="rotate(65 150 165)">
    <rect x="135" y="162" width="30" height="5" rx="2.5" fill="#10b981" filter="url(#shadow)"/>
    <polygon points="165,162 170,164.5 165,167" fill="#cbd5e1"/>
  </g>
</svg>