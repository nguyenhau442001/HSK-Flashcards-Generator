<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Paper Stack Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Amber Glow (Magic/Creation) -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Warm Desk Lamp Glow & Bookshelf hints) -->
  <circle cx="180" cy="60" r="70" fill="url(#amberGlow)"/>
  
  <!-- Desk Surface -->
  <path d="M 0 185 L 240 185 L 240 240 L 0 240 Z" fill="url(#deskGrad)"/>
  <rect x="0" y="180" width="240" height="5" fill="#475569" opacity="0.6"/>

  <!-- Secondary Papers / Stack (Contextualizing "Bài") -->
  <g filter="url(#softShadow)" transform="translate(35, 125) rotate(-12)">
    <rect x="0" y="0" width="90" height="70" rx="4" fill="#cbd5e1" opacity="0.7"/>
    <!-- Mock lines of text -->
    <line x1="10" y1="15" x2="70" y2="15" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="27" x2="80" y2="27" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="39" x2="50" y2="39" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <g filter="url(#softShadow)" transform="translate(130, 135) rotate(8)">
    <rect x="0" y="0" width="80" height="65" rx="4" fill="#94a3b8" opacity="0.6"/>
    <line x1="10" y1="15" x2="65" y2="15" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="27" x2="55" y2="27" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: The Completed Article / Essay ("Bài văn") -->
  <!-- Main Paper Leaf floating/resting dynamically -->
  <g filter="url(#dropShadow)" transform="translate(60, 45) rotate(4)">
    <!-- Base Paper Sheet -->
    <rect x="0" y="0" width="120" height="150" rx="8" fill="url(#paperGrad)"/>
    
    <!-- Paper Header Accent / Red Stamp (Authenticity) -->
    <circle cx="100" cy="20" r="8" fill="#ef4444" opacity="0.8"/>
    
    <!-- Title Line -->
    <rect x="20" y="20" width="45" height="6" rx="3" fill="#3b82f6"/>

    <!-- Rich Paragraph Lines (Simulating a full essay/article - "Bài") -->
    <g transform="translate(20, 42)">
      <!-- Paragraph 1 -->
      <line x1="0" y1="0" x2="80" y2="0" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="70" y2="10" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="20" x2="75" y2="20" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Paragraph 2 -->
      <line x1="0" y1="38" x2="78" y2="38" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="48" x2="65" y2="48" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="58" x2="80" y2="58" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="68" x2="40" y2="68" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

      <!-- Paragraph 3 -->
      <line x1="0" y1="86" x2="72" y2="86" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="96" x2="50" y2="96" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Cute Checkmark / Success Badge on the paper -->
    <circle cx="95" cy="125" r="14" fill="#10b981"/>
    <path d="M 89 125 L 93 129 L 102 119" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ACTION PROP: Modern Fountain Pen creating/writing the piece -->
  <g filter="url(#dropShadow)" transform="translate(130, 25) rotate(35)">
    <!-- Pen Body -->
    <path d="M 0 0 L 12 0 L 16 90 L -4 90 Z" fill="#3b82f6"/>
    <!-- Pen Grip -->
    <rect x="-4" y="90" width="20" height="25" rx="2" fill="#1e293b"/>
    <!-- Gold Accent Ring -->
    <rect x="-4" y="87" width="20" height="3" fill="#fbbf24"/>
    <!-- Pen Nib -->
    <path d="M -4 115 L 16 115 L 6 135 L 6 115 Z" fill="#fbbf24"/>
    <line x1="6" y1="115" x2="6" y2="132" stroke="#b45309" stroke-width="1.5"/>
    <!-- Clip -->
    <rect x="4" y="10" width="3" height="45" rx="1.5" fill="#fbbf24"/>
  </g>

  <!-- Sparkles / Action Dust representing creative energy -->
  <g fill="#fbbf24">
    <circle cx="45" cy="55" r="3"/>
    <circle cx="170" cy="115" r="2.5"/>
    <path d="M 125 35 Q 130 35 130 30 Q 130 35 135 35 Q 130 35 130 40 Q 130 35 125 35 Z"/>
    <path d="M 55" transform="translate(30, 95) scale(0.6)" d="M 0 0 Q 5 0 5 -5 Q 5 0 10 0 Q 5 0 5 5 Q 5 0 0 0 Z" fill="#38bdf8"/>
  </g>

  <!-- Foreground Atmospheric Leaf / Pen Holder silhouette on desk -->
  <path d="M 195 190 L 220 160 L 235 190 Z" fill="#1e293b" opacity="0.5"/>
</svg>