<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Floor/Entryway -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  <path d="M20 200 L220 200 L230 240 L10 240 Z" fill="#334155"/>
  
  <!-- Door Frame -->
  <path d="M80 40 L160 40 L160 200 L80 200 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Shoes being taken off -->
  <g transform="translate(120, 190)">
    <!-- Left Shoe (kicked off) -->
    <path d="M-50 0 L-20 0 L-15 10 L-55 10 Z" fill="#fb923c"/>
    <path d="M-55 10 L-15 10 L-10 20 L-60 20 Z" fill="#f59e0b"/>
    
    <!-- Right Shoe (still on foot) -->
    <path d="M10 0 L40 0 L45 10 L5 10 Z" fill="#fb923c"/>
    <path d="M5 10 L45 10 L50 20 L0 20 Z" fill="#f59e0b"/>
    
    <!-- Motion lines -->
    <path d="M-20 5 L-5 5 M-25 15 L-10 15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Person's leg/foot detail -->
  <g transform="translate(160, 180)">
    <ellipse cx="0" cy="0" rx="15" ry="5" fill="#ec4899" opacity="0.3"/>
    <path d="M-10 -40 L10 -40 L12 0 L-12 0 Z" fill="#fbbf24"/>
    <circle cx="0" cy="-45" r="8" fill="#fbbf24"/>
  </g>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="120" r="100" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>