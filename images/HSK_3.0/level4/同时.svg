<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="screenGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background lighting representing "simultaneous focus" -->
  <circle cx="80" cy="110" r="50" fill="#0ea5e9" opacity="0.15" filter="url(#glow)"/>
  <circle cx="160" cy="110" r="50" fill="#10b981" opacity="0.15" filter="url(#glow)"/>

  <!-- Bookshelf / Background Environment details -->
  <path d="M40 70 L200 70" stroke="#334155" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <rect x="50" y="45" width="12" height="25" rx="2" fill="#f43f5e" opacity="0.7"/>
  <rect x="64" y="40" width="10" height="30" rx="2" fill="#38bdf8" opacity="0.7"/>
  <rect x="76" y="50" width="16" height="20" rx="2" fill="#fbbf24" opacity="0.7"/>

  <!-- Plant Prop -->
  <path d="M190 70 Q195 50 185 40 Q200 45 190 70" fill="#10b981" opacity="0.8"/>
  <path d="M185 70 Q175 55 180 45 Q170 60 185 70" fill="#34d399" opacity="0.8"/>
  <path d="M187 70 L193 70 L195 85 L185 85 Z" fill="#cbd5e1" opacity="0.8"/>

  <!-- Desk Surface -->
  <path d="M20 185 L220 185 L230 205 L10 205 Z" fill="url(#deskGrad)"/>
  <path d="M10 185 L230 185" stroke="#475569" stroke-width="2"/>

  <!-- Desk Lamp (Ambient warm light) -->
  <path d="M210 185 L215 130 L205 130 Z" fill="#64748b"/>
  <path d="M195 125 C195 110 225 110 225 125 Z" fill="#fbbf24"/>
  <ellipse cx="210" cy="185" rx="12" ry="4" fill="#475569"/>

  <!-- Dual Screens (Representing learning two things at once) -->
  <!-- Left Screen (Language A) -->
  <g transform="translate(45, 95)">
    <!-- Stand -->
    <path d="M20 70 L35 70 L30 90 L25 90 Z" fill="#64748b"/>
    <ellipse cx="27" cy="91" rx="15" ry="3" fill="#475569"/>
    <!-- Monitor Body -->
    <rect x="-5" y="5" width="65" height="48" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="0" y="10" width="55" height="38" rx="2" fill="url(#screenGrad1)"/>
    <!-- Abstract UI / Language symbols on screen -->
    <path d="M10 20 L25 20 M10 28 L35 28 M10 36 L20 36" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <circle cx="43" cy="32" r="6" fill="#fbbf24"/>
  </g>

  <!-- Right Screen (Language B) -->
  <g transform="translate(130, 95)">
    <!-- Stand -->
    <path d="M20 70 L35 70 L30 90 L25 90 Z" fill="#64748b"/>
    <ellipse cx="27" cy="91" rx="15" ry="3" fill="#475569"/>
    <!-- Monitor Body -->
    <rect x="-5" y="5" width="65" height="48" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="0" y="10" width="55" height="38" rx="2" fill="url(#screenGrad2)"/>
    <!-- Abstract UI / Language symbols on screen -->
    <path d="M10 22 L40 22 M10 32 L30 32" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <polygon points="42,16 48,20 42,24" fill="#fbbf24"/>
  </g>

  <!-- Central Character (Multitasking Learner) -->
  <g transform="translate(95, 115)">
    <!-- Body & Hoodie -->
    <path d="M-12 70 Q-15 45 15 45 Q45 45 42 70 Z" fill="url(#hoodieGrad)"/>
    <!-- Hoodie Strings -->
    <path d="M10 47 Q12 58 8 65" stroke="#f8fafc" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M20 47 Q18 58 22 65" stroke="#f8fafc" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="11" y="36" width="8" height="12" fill="#fcd34d"/>

    <!-- Head -->
    <circle cx="15" cy="24" r="16" fill="#fcd34d"/>

    <!-- Hair -->
    <path d="M-1 20 C-1 10 12 8 22 10 C31 12 32 20 32 24 C32 24 31 15 22 14 C12 13 2 16 -1 20 Z" fill="url(#hairGrad)"/>
    <path d="M2 14 C4 10 12 10 18 12" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

    <!-- Face Profile / Focus Expression -->
    <circle cx="23" cy="24" r="2" fill="#1e293b"/>
    <!-- Cheeks (Concentration blush) -->
    <ellipse cx="21" cy="28" rx="3" ry="1.5" fill="#f43f5e" opacity="0.4"/>

    <!-- Hands juggling / interacting with both streams -->
    <!-- Left Hand -->
    <circle cx="-5" cy="52" r="5" fill="#fcd34d"/>
    <!-- Right Hand -->
    <circle cx="35" cy="52" r="5" fill="#fcd34d"/>
  </g>

  <!-- Coffee Mug for stamina -->
  <g transform="translate(75, 160)">
    <path d="M0 0 L14 0 L12 18 L2 18 Z" fill="url(#cupGrad)"/>
    <path d="M12 4 Q18 4 18 9 Q18 14 12 14" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Steam waves -->
    <path d="M4 -4 Q7 -8 4 -12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
    <path d="M9 -6 Q12 -10 9 -14" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- Synchronized Action Sparks / Dynamic Focus Energy -->
  <!-- Left stream energy -->
  <path d="M60 120 Q50 110 40 125" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="38" cy="128" r="3" fill="#38bdf8"/>
  
  <!-- Right stream energy -->
  <path d="M160 120 Q170 110 180 125" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="182" cy="128" r="3" fill="#10b981"/>

  <!-- Sparkles representing dual simultaneous success -->
  <g fill="#fbbf24">
    <path d="M120 75 L122 80 L127 82 L122 84 L120 89 L118 84 L113 82 L118 80 Z" transform="scale(0.6) translate(100, 20)"/>
    <path d="M120 75 L122 80 L127 82 L122 84 L120 89 L118 84 L113 82 L118 80 Z" transform="scale(0.4) translate(220, 110)"/>
    <circle cx="75" cy="85" r="2" fill="#38bdf8"/>
    <circle cx="145" cy="85" r="2" fill="#10b981"/>
  </g>
</svg>