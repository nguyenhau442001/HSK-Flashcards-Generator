<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Clock showing late time -->
  <circle cx="180" cy="60" r="30" fill="#334155"/>
  <path d="M180 40 L180 60 L195 60" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Running Character -->
  <g transform="translate(40, 120)">
    <path d="M40 80 L60 80 L50 40 Z" fill="#38bdf8"/>
    <ellipse cx="50" cy="30" rx="15" ry="15" fill="#fde68a"/>
    <path d="M30 60 L45 70" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M70 60 L55 70" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 90 L30 110" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M60 90 L70 110" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Stairs -->
  <path d="M100 240 L240 240 L240 220 L180 220 L180 180 L120 180 L120 140 L100 140 Z" fill="#475569"/>
  
  <!-- Motion lines -->
  <path d="M20 130 Q10 140 20 150" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M10 120 Q0 130 10 140" stroke="#94a3b8" stroke-width="2" fill="none"/>
  
  <!-- Door at top -->
  <rect x="190" y="100" width="40" height="80" rx="5" fill="#ec4899"/>
  <circle cx="200" cy="140" r="3" fill="#fbbf24"/>
</svg>