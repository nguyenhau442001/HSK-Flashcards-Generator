<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient for Night Alley -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#162238" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Amber Streetlight Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Cone of Light -->
    <linearGradient id="lightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warning / Tension Red Glow -->
    <radialGradient id="dangerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Character Shadow Gradient -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Path for Card Container -->
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <!-- Base Container with Rounded Corners -->
  <g clip-path="url(#cardClip)">
    <!-- Deep Night Sky & Background Buildings -->
    <rect width="240" height="240" fill="url(#bgGrad)" />

    <!-- Distant Dark Buildings / Skyline silhouette -->
    <path d="M0 160 L20 150 L35 160 L60 140 L85 145 L100 130 L120 135 L140 120 L160 125 L180 115 L205 125 L220 110 L240 120 L240 240 L0 240 Z" fill="#0f172a" opacity="0.7" />
    
    <!-- Alley Brick Walls (Left & Right Perspective) -->
    <!-- Left Wall -->
    <path d="M0 0 L55 0 L55 240 L0 240 Z" fill="#131c2e" />
    <!-- Right Wall -->
    <path d="M190 0 L240 0 L240 240 L190 240 Z" fill="#131c2e" />
    
    <!-- Windows on Left Wall (Dark with faint light) -->
    <rect x="12" y="40" width="16" height="24" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="12" y="90" width="16" height="24" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="12" y="140" width="16" height="24" rx="2" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Windows on Right Wall -->
    <rect x="212" y="60" width="16" height="24" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="212" y="110" width="16" height="24" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Ground / Cobblestone Perspective -->
    <path d="M55 240 L100 170 L140 170 L185 240 Z" fill="#0b1120" />
    <ellipse cx="120" cy="205" rx="45" ry="15" fill="url(#floorShadow)" />

    <!-- Street Lamp Pole & Fixture (Top Right curving in) -->
    <path d="M190 0 L185 45 L175 75" fill="none" stroke="#090d16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp Head -->
    <path d="M162 70 L188 70 L196 82 L154 82 Z" fill="#090d16" />
    <circle cx="175" cy="85" r="8" fill="#fef08a" />
    
    <!-- Cone of Light from Lamp -->
    <polygon points="175,85 80,240 200,240" fill="url(#lightCone)" />
    <circle cx="175" cy="85" r="40" fill="url(#lampGlow)" />

    <!-- ================= DANGER ELEMENTS (The Threat) ================= -->
    <!-- Glowing Red Eyes in the Dark Alley Corner (Left deep shadow) -->
    <g transform="translate(42, 135)">
      <circle cx="0" cy="0" r="16" fill="url(#dangerGlow)" />
      <!-- Left Eye -->
      <ellipse cx="-5" cy="-2" rx="3" ry="1.5" fill="#ef4444" transform="rotate(-10 -5 -2)" />
      <ellipse cx="-5" cy="-2" rx="1.5" ry="0.8" fill="#fef08a" />
      <!-- Right Eye -->
      <ellipse cx="4" cy="-3" rx="3" ry="1.5" fill="#ef4444" transform="rotate(10 4 -3)" />
      <ellipse cx="4" cy="-3" rx="1.5" ry="0.8" fill="#fef08a" />
      <!-- Menacing Shadow Claw/Silhouette -->
      <path d="M-10 10 Q -2 4 10 12 Q 2 16 -10 10 Z" fill="#090d16" />
    </g>

    <!-- Second set of glowing eyes peering from deep background center -->
    <g transform="translate(145, 115)" opacity="0.8">
      <circle cx="0" cy="0" r="12" fill="url(#dangerGlow)" />
      <ellipse cx="-3" cy="0" rx="2" ry="1" fill="#ef4444" />
      <ellipse cx="3" cy="0" rx="2" ry="1" fill="#ef4444" />
    </g>

    <!-- ================= MAIN CHARACTER ================= -->
    <g transform="translate(108, 120)">
      <!-- Drop Shadow -->
      <ellipse cx="12" cy="85" rx="25" ry="8" fill="#000000" fill-opacity="0.5" />

      <!-- Back Leg (Stepping back / Tense) -->
      <path d="M0 50 L-12 75 L-6 78 L6 55" fill="#1e3a8a" />
      <!-- Back Shoe -->
      <path d="M-16 77 L-4 76 L-2 82 L-14 82 Z" fill="#0f172a" />

      <!-- Front Leg (Bracing) -->
      <path d="M12 50 L18 73 L28 75 L20 48" fill="#2563eb" />
      <!-- Front Shoe -->
      <path d="M14 73 L32 72 L34 78 L18 78 Z" fill="#0f172a" />

      <!-- Torso / Hoodie (Teal / Blue with dynamic lean) -->
      <g transform="rotate(-15 10 30)">
        <!-- Backpack -->
        <path d="M-6 10 L4 8 L8 35 L-4 37 Z" fill="#334155" />
        <path d="M-2 14 L2 13" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

        <!-- Main Body -->
        <path d="M-2 8 Q 12 5 18 25 L 14 55 Q 0 58 -8 40 Z" fill="#0ea5e9" />
        <!-- Hoodie Pocket & Details -->
        <path d="M2 35 L12 37 L10 48 L1 46 Z" fill="#0284c7" />
        <!-- Hoodie Strings -->
        <path d="M4 12 L2 22" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
        <path d="M9 12 L11 22" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Left Arm (Clutching strap / defensive) -->
      <g transform="rotate(-25 -2 20)">
        <path d="M-6 15 L-18 32 L-10 38 L-2 25" fill="#0284c7" />
        <!-- Hand gripping shoulder strap -->
        <circle cx="-14" cy="35" r="4" fill="#fde047" />
      </g>

      <!-- Right Arm (Raised in alarm / pushing away gesture) -->
      <g transform="rotate(25 15 25)">
        <path d="M10 18 L28 14 L32 24 L16 30" fill="#0ea5e9" />
        <!-- Hand / Palm open in shock -->
        <circle cx="30" cy="19" r="4.5" fill="#fde047" />
        <!-- Fingers splayed out in panic -->
        <path d="M33 16 L37 13" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
        <path d="M34 19 L39 18" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
        <path d="M33 22 L37 25" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Neck -->
      <path d="M6 3 L10 12 L4 13 Z" fill="#fde047" />

      <!-- Head & Face (Expressing intense fear/alertness) -->
      <g transform="translate(6, -10) rotate(-10)">
        <!-- Hair (Messy, wind-blown or scared spike) -->
        <path d="M-6 2 Q 4 -8 16 -2 Q 22 5 18 10 Q 10 4 -2 8 Z" fill="#1e293b" />
        <path d="M10 -4 L18 -10 L15 -2 Z" fill="#1e293b" />

        <!-- Head Base -->
        <circle cx="6" cy="12" r="13" fill="#fde047" />

        <!-- Ear -->
        <circle cx="-5" cy="13" r="2.5" fill="#eab308" />

        <!-- Terrified Eyes (Wide, dilated, looking toward danger on left) -->
        <circle cx="2" cy="9" r="4.5" fill="#ffffff" />
        <circle cx="1" cy="9" r="2" fill="#0f172a" />
        <!-- Highlight in eye -->
        <circle cx="0.5" cy="8" r="0.8" fill="#ffffff" />

        <circle cx="12" cy="10" r="4.5" fill="#ffffff" />
        <circle cx="11" cy="10" r="2" fill="#0f172a" />
        <circle cx="10.5" cy="9" r="0.8" fill="#ffffff" />

        <!-- Eyebrows (Angled sharply upwards in panic) -->
        <path d="M-1 3 L5 6" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
        <path d="M9 4 L16 2" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

        <!-- Open Mouth (Gasping / Yelling in alarm) -->
        <ellipse cx="7" cy="18" rx="3.5" ry="4.5" fill="#7f1d1d" />
        <!-- Tongue -->
        <path d="M5 20 Q 7 21 9 20 Z" fill="#f87171" />

        <!-- Sweat Drop (Classic anime fear indicator) -->
        <g transform="translate(18, 5) scale(0.8)">
          <path d="M0 0 C 0 -4 -4 -8 -4 -10 C -4 -12 -2 -14 0 -14 C 2 -14 4 -12 4 -10 C 4 -8 0 -4 0 0 Z" fill="#38bdf8" opacity="0.9" />
          <path d="M-1 -9 C -1 -10 -0.5 -11 0 -12" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
        </g>
      </g>
    </g>

    <!-- ================= FOREGROUND ATMOSPHERIC DETAILS ================= -->
    <!-- Floating dust motes / danger ambiance particles -->
    <circle cx="70" cy="100" r="1.5" fill="#fef08a" opacity="0.6" />
    <circle cx="95" cy="140" r="2" fill="#ef4444" opacity="0.7" />
    <circle cx="150" cy="180" r="1" fill="#fef08a" opacity="0.5" />
    <circle cx="45" cy="200" r="2" fill="#38bdf8" opacity="0.4" />
    <circle cx="180" cy="90" r="1.5" fill="#fef08a" opacity="0.8" />

    <!-- Cautionary Amber/Red Vignette Border / Shadow overlay for cinematic tension -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#ef4444" stroke-width="4" stroke-opacity="0.3" />
    <rect x="0" y="0" width="240" height="240" rx="24" fill="url(#dangerGlow)" opacity="0.15" style="mix-blend-mode: overlay;" />
  </g>
</svg>