<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Secondary Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements -->
  <g opacity="0.15">
    <circle cx="190" cy="60" r="40" fill="#38bdf8" />
    <path d="M 20 180 L 220 180" stroke="#64748b" stroke-width="2" stroke-dasharray="4 8" />
  </g>

  <!-- Ground / Surface -->
  <path d="M 12 185 L 228 185 C 234 185, 238 189, 238 195 C 238 201, 234 205, 228 205 L 12 205 C 6 205, 2 201, 2 195 C 2 189, 6 185, 12 185 Z" fill="url(#floorGrad)" />

  <!-- SCENE: Action-packed sequence representing "Secondly / Next" (First step book, Second step runner/trophy/action item) -->
  
  <!-- Step 1: The Foundation (First: Study / Knowledge - represented as a glowing book/base in background) -->
  <g transform="translate(60, 110)" filter="url(#shadow)" opacity="0.8">
    <!-- Book Base -->
    <path d="M -30 20 L 0 30 L 30 20 L 30 50 L 0 60 L -30 50 Z" fill="#334155" />
    <path d="M -30 20 L 0 30 L 30 20 L 0 10 Z" fill="#475569" />
    <!-- Number 1 Marker (Visualized as a solid glowing block) -->
    <rect x="-8" y="-5" width="16" height="25" rx="4" fill="#10b981" />
  </g>

  <!-- Step 2: The Main Focus ("其次" - Secondly, Next in sequence - Highlighted Action/Object) -->
  <g transform="translate(140, 95)" filter="url(#shadow)">
    <!-- Motion / Action Lines indicating "Next" -->
    <path d="M -55 -10 C -40 -25 -20 -25 -5 -10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M -50 5 C -35 -10 -15 -10 0 5" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    
    <!-- Secondary Podium / Platform (Elevated to show "Second") -->
    <ellipse cx="0" cy="65" rx="35" ry="12" fill="#0f172a" />
    <path d="M -35 45 L 35 45 L 35 65 C 35 71.5, 19.3 77, 0 77 C -19.3 77, -35 71.5, -35 65 Z" fill="url(#tealGrad)" />
    <ellipse cx="0" cy="45" rx="35" ry="12" fill="#38bdf8" />

    <!-- Main Active Subject: Glowing Award Trophy / Target Achievement representing the next crucial step -->
    <!-- Trophy Base -->
    <path d="M -10 45 L 10 45 L 6 35 L -6 35 Z" fill="#64748b" />
    
    <!-- Trophy Cup -->
    <path d="M -18 5 C -18 -10, 18 -10, 18 5 C 18 20, 10 35, 0 35 C -10 35, -18 20, -18 5 Z" fill="url(#goldGrad)" />
    
    <!-- Trophy Handles -->
    <path d="M -14 0 C -25 0, -25 20, -13 22" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
    <path d="M 14 0 C 25 0, 25 20, 13 22" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

    <!-- Sparkles / Energy bursts around Step 2 -->
    <path d="M -32 -25 L -28 -15 L -18 -19 L -27 -10 Z" fill="#fef08a" />
    <path d="M 28 -35 L 25 -25 L 35 -22 L 27 -17 Z" fill="#fef08a" />
    <circle cx="0" cy="-22" r="3" fill="#fef08a" />
  </g>

  <!-- Foreground Atmospheric Elements & Context Props -->
  <!-- Small Health/Energy Apple or Vitality Icon (Contextualizing the health aspect of the prompt example) -->
  <g transform="translate(85, 150)" filter="url(#shadow)">
    <circle cx="0" cy="5" r="14" fill="#ec4899" />
    <!-- Apple Leaf -->
    <path d="M 0 -9 C 6 -15, 12 -9, 6 -3 Z" fill="#10b981" />
    <!-- Apple Stem -->
    <path d="M 0 -9 C 0 -13, -2 -14, -3 -15" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <!-- Highlight -->
    <circle cx="-4" cy="1" r="3" fill="#fbcfe8" opacity="0.6" />
  </g>

  <!-- Connecting Pathway / Arrow Sequence (Flow from First to Second) -->
  <path d="M 85 130 C 100 115, 110 115, 120 120" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round" />
  <polygon points="124,122 113,127 116,118" fill="#38bdf8" />

  <!-- Additional Sparkles & Ambient Light Dots -->
  <circle cx="45" cy="70" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="170" cy="50" r="3" fill="#fbbf24" opacity="0.7" />
  <circle cx="205" cy="135" r="2" fill="#10b981" opacity="0.9" />
  <circle cx="35" cy="155" r="1.5" fill="#f43f5e" opacity="0.8" />

</svg>