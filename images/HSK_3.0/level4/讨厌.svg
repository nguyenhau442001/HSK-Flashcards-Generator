<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Raindrops in background -->
  <path d="M40 20 L40 40 M80 10 L80 30 M120 20 L120 40 M160 10 L160 30 M200 20 L200 40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Window frame -->
  <rect x="20" y="20" width="200" height="200" rx="10" fill="none" stroke="#334155" stroke-width="4"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M60 160 C60 130, 100 120, 100 120 L120 120 C120 120, 160 130, 160 160 L160 180 L60 180 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="110" cy="90" r="30" fill="#fde68a"/>
    <!-- Annoyed face -->
    <path d="M95 85 L105 90 M115 90 L125 85" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M100 105 Q110 112 120 105" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Arms crossed -->
    <path d="M70 130 L100 145 L70 160" stroke="#fb923c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 130 L120 145 L150 160" stroke="#fb923c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Puddle on floor -->
  <ellipse cx="120" cy="220" rx="80" ry="15" fill="#1e293b" opacity="0.6"/>
  <path d="M50 215 Q80 205 110 215 T170 215" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5"/>
</svg>