<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Photo Glow / Aura Gradient -->
    <radialGradient id="memoryGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Memory Projection Beam -->
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Wood Texture for Table -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Room/Desk Ambient) -->
  <g opacity="0.3">
    <!-- Bookshelf silhouettes in background -->
    <rect x="20" y="40" width="30" height="80" rx="4" fill="#334155"/>
    <rect x="60" y="50" width="25" height="70" rx="4" fill="#475569"/>
    <rect x="190" y="45" width="30" height="75" rx="4" fill="#334155"/>
    <line x1="20" y1="70" x2="50" y2="70" stroke="#1e293b" stroke-width="2"/>
    <line x1="60" y1="80" x2="85" y2="80" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Ambient Memory Glow Circle behind photo -->
  <circle cx="120" cy="115" r="90" fill="url(#memoryGlow)"/>

  <!-- Wooden Surface / Desk -->
  <path d="M 0 175 Q 120 165 240 175 L 240 240 L 0 240 Z" fill="url(#tableGrad)" filter="url(#softShadow)"/>
  <line x1="0" y1="175" x2="240" y2="175" stroke="#475569" stroke-width="1.5" opacity="0.6"/>

  <!-- Prop: Vintage Camera on the desk (Left side) -->
  <g transform="translate(32, 140)" filter="url(#softShadow)">
    <!-- Camera Body -->
    <rect x="0" y="10" width="44" height="28" rx="6" fill="#64748b"/>
    <!-- Top prism/housing -->
    <path d="M 12 10 L 16 2 L 28 2 L 32 10 Z" fill="#475569"/>
    <!-- Shutter button & dial -->
    <rect x="8" y="5" width="5" height="5" rx="1" fill="#cbd5e1"/>
    <rect x="30" y="6" width="6" height="3" rx="1" fill="#cbd5e1"/>
    <!-- Lens outer -->
    <circle cx="22" cy="23" r="9" fill="#334155"/>
    <!-- Lens inner glass -->
    <circle cx="22" cy="23" r="6" fill="#0ea5e9"/>
    <!-- Lens reflection -->
    <path d="M 19 20 A 4 4 0 0 1 24 20" stroke="#bae6fd" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Camera grip line -->
    <line x1="4" y1="14" x2="4" y2="34" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Prop: Small potted plant on the desk (Right side) -->
  <g transform="translate(175, 138)" filter="url(#softShadow)">
    <!-- Pot -->
    <path d="M 6 22 L 12 36 L 28 36 L 34 22 Z" fill="#f8fafc"/>
    <!-- Soil -->
    <ellipse cx="20" cy="22" rx="8" ry="3" fill="#334155"/>
    <!-- Stem & Leaves (Childhood/growth theme) -->
    <path d="M 20 22 Q 20 12 12 8" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 20 17 Q 24 10 28 12" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaf blobs -->
    <circle cx="10" cy="8" r="5" fill="#34d399"/>
    <circle cx="30" cy="13" r="4" fill="#34d399"/>
    <circle cx="20" cy="12" r="4.5" fill="#10b981"/>
  </g>

  <!-- Main Subject: The Floating Magical Photograph (Hồi ức / Memory) -->
  <g filter="url(#softShadow)">
    <!-- Golden magical ascending particle/sparkles from the photo -->
    <circle cx="85" cy="55" r="2.5" fill="#fbbf24" filter="url(#glowFilter)"/>
    <circle cx="155" cy="48" r="2" fill="#f59e0b" filter="url(#glowFilter)"/>
    <circle cx="120" cy="38" r="3" fill="#fef08a" filter="url(#glowFilter)"/>
    <path d="M 95 65 L 98 70 L 93 72 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M 148 60 L 152 63 L 149 67 Z" fill="#fbbf24" opacity="0.8"/>

    <!-- Polaroid Photo Frame (Angled floating in air) -->
    <g transform="translate(62, 50) rotate(-6)">
      <!-- Photo drop shadow on background -->
      <rect x="0" y="0" width="116" height="135" rx="8" fill="#0f172a" opacity="0.5" transform="translate(4, 8)"/>

      <!-- White Polaroid Paper Background -->
      <rect x="0" y="0" width="116" height="135" rx="6" fill="#f8fafc"/>

      <!-- Inner Photo Window (Landscape View inside) -->
      <rect x="12" y="12" width="92" height="92" rx="3" fill="#0284c7"/>

      <!-- Scene Inside Memory Photo: Childhood / Youth & Nature -->
      <!-- Sky gradient/sunset inside photo -->
      <linearGradient id="photoSky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="60%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#fb923c"/>
      </linearGradient>
      <rect x="12" y="12" width="92" height="92" rx="3" fill="url(#photoSky)"/>

      <!-- Sun inside photo -->
      <circle cx="58" cy="60" r="18" fill="#fef08a" opacity="0.9"/>

      <!-- Distant Hills / Mountains inside photo -->
      <path d="M 12 80 Q 35 55 60 75 Q 80 60 104 78 L 104 104 L 12 104 Z" fill="#15803d"/>
      <path d="M 12 88 Q 45 70 75 85 L 104 90 L 104 104 L 12 104 Z" fill="#16a34a"/>

      <!-- Stylized Child / Figure silhouette running happily in the memory -->
      <g transform="translate(50, 72)">
        <!-- Head -->
        <circle cx="6" cy="4" r="4" fill="#1e293b"/>
        <!-- Body / Cape or clothes -->
        <path d="M 4 8 C 4 8 2 16 0 20 L 12 20 C 10 16 8 8 8 8 Z" fill="#ec4899"/>
        <!-- Arms in motion -->
        <line x1="6" y1="10" x2="1" y2="13" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="6" y1="10" x2="12" y2="8" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Legs in running motion -->
        <line x1="4" y1="20" x2="1" y2="27" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="8" y1="20" x2="13" y2="25" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Second smaller figure (representing friendship/family in the past) -->
      <g transform="translate(32, 77)" opacity="0.9">
        <circle cx="5" cy="4" r="3.5" fill="#1e293b"/>
        <path d="M 3 7.5 C 3 7.5 1 14 0 18 L 10 18 C 8 14 7 7.5 7 7.5 Z" fill="#3b82f6"/>
        <line x1="5" y1="9" x2="9" y2="13" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <line x1="4" y1="18" x2="2" y2="24" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <line x1="7" y1="18" x2="9" y2="24" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Floating paper texture highlights on the photo frame -->
      <rect x="12" y="12" width="92" height="92" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

      <!-- Little heart symbol floating out of the memory -->
      <g transform="translate(75, 22) scale(0.7)" filter="url(#glowFilter)">
        <path d="M 12 5 C 12 2 9 0 6 3 C 3 0 0 2 0 5 C 0 9 6 13 6 13 C 6 13 12 9 12 5 Z" fill="#f43f5e"/>
      </g>
    </g>
  </g>

  <!-- Glowing Light Beams emanating from the floating photograph down toward the desk -->
  <polygon points="90,110 50,175 190,175 150,110" fill="url(#beamGrad)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Additional glowing sparkles floating around the scene to emphasize magical remembrance -->
  <g filter="url(#glowFilter)">
    <circle cx="45" cy="115" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="195" cy="100" r="2.5" fill="#f43f5e" opacity="0.8"/>
    <circle cx="110" cy="155" r="1.5" fill="#fef08a" opacity="0.9"/>
    <circle cx="70" cy="130" r="2" fill="#10b981" opacity="0.7"/>
    <!-- Tiny star/sparkle shapes -->
    <path d="M 170 75 L 172 80 L 177 82 L 172 84 L 170 89 L 168 84 L 163 82 L 168 80 Z" fill="#fbbf24" transform="scale(0.5) translate(160, 40)"/>
    <path d="M 70 35 L 71.5 38 L 74.5 39.5 L 71.5 41 L 70 44 L 68.5 41 L 65.5 39.5 L 68.5 38 Z" fill="#38bdf8" transform="scale(0.6) translate(30, -10)"/>
  </g>
</svg>