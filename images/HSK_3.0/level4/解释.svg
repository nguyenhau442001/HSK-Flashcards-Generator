<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Chalkboard Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a34"/>
      <stop offset="100%" stop-color="#132622"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Spotlight/Atmosphere -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment: Classroom / Study Room -->
  <!-- Wooden floor line -->
  <path d="M0 200 L240 200" stroke="#0f172a" stroke-width="4"/>
  <rect x="0" y="200" width="240" height="40" fill="#0b111e"/>

  <!-- Large Chalkboard in background -->
  <rect x="25" y="30" width="190" height="115" rx="6" fill="#292524" filter="url(#shadow)"/>
  <rect x="28" y="33" width="184" height="109" rx="4" fill="url(#boardGrad)"/>
  <!-- Chalkboard wooden frame highlights -->
  <rect x="25" y="30" width="190" height="115" rx="6" fill="none" stroke="#78350f" stroke-width="3"/>

  <!-- Diagrams and sketches on the chalkboard (representing 'explanation' of grammar/concepts) -->
  <!-- Concept node map -->
  <circle cx="55" cy="65" r="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="120" cy="55" r="10" fill="none" stroke="#fb923c" stroke-width="2"/>
  <circle cx="185" cy="70" r="7" fill="none" stroke="#34d399" stroke-width="2"/>
  <line x1="63" y1="62" x2="110" y2="57" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="130" y1="58" x2="178" y2="67" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Abstract geometric shapes being explained -->
  <path d="M50 105 L65 85 L80 105 Z" fill="none" stroke="#f472b6" stroke-width="2" stroke-linejoin="round"/>
  <path d="M100 90 L125 90 L125 115 L100 115 Z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M150 100 Q170 80 190 100" fill="none" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Sparkles / Aha! Lightbulb moment floating above board -->
  <circle cx="120" cy="20" r="16" fill="url(#lampGlow)"/>
  <path d="M120 12 C116 12 113 15 113 19 C113 22 115 24 117 25 L123 25 C125 24 127 22 127 19 C127 15 124 12 120 12 Z" fill="#fbbf24" filter="url(#softGlow)"/>
  <rect x="117" y="26" width="6" height="3" rx="1" fill="#94a3b8"/>
  <!-- Light rays -->
  <line x1="120" y1="6" x2="120" y2="9" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="9" x2="112" y2="11" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="9" x2="128" y2="11" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Teacher / Presenter Foreground Elements -->
  <!-- Teacher's Desk -->
  <path d="M40 185 L200 185 L210 215 L30 215 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="35" y="180" width="170" height="8" rx="3" fill="#475569"/>
  
  <!-- Desk Props: Open book, glowing tablet, plant -->
  <!-- Open Book -->
  <path d="M60 183 C60 177 75 175 90 176 L90 193 C75 192 60 190 60 183 Z" fill="#f8fafc"/>
  <path d="M120 183 C120 177 105 175 90 176 L90 193 C105 192 120 190 120 183 Z" fill="#f1f5f9"/>
  <line x1="90" y1="176" x2="90" y2="193" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="68" y1="181" x2="82" y2="182" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <line x1="68" y1="186" x2="80" y2="187" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <line x1="98" y1="181" x2="112" y2="182" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <line x1="98" y1="186" x2="110" y2="187" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>

  <!-- Glowing Digital Tablet / Visual Aid (Representing clear explanation/breakdown) -->
  <g transform="translate(140, 160)">
    <rect x="0" y="0" width="38" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <!-- Screen content: animated arrow / breakdown -->
    <circle cx="10" cy="13" r="4" fill="#38bdf8"/>
    <path d="M16 13 L24 13 M21 10 L24 13 L21 16" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="13" r="4" fill="#34d399"/>
  </g>

  <!-- Potted Plant on Desk -->
  <path d="M190 173 L204 173 L201 183 L193 183 Z" fill="#ec4899"/>
  <path d="M197 163 Q190 155 185 160 Q180 165 188 171 Z" fill="#10b981"/>
  <path d="M197 163 Q205 150 212 157 Q218 164 205 172 Z" fill="#34d399"/>
  <path d="M197 163 Q197 150 197 145 Q197 140 202 148 Z" fill="#059669"/>

  <!-- Main Action: Teacher's Arm & Pointer emphasizing the explanation -->
  <!-- Teacher Torso/Shoulder (Left side) -->
  <path d="M10 220 C10 180 30 160 55 155 L55 220 Z" fill="#4f46e5"/>
  <!-- Collar / Scarf accent -->
  <path d="M35 159 C45 159 52 165 55 172 C45 172 38 167 35 159 Z" fill="#818cf8"/>

  <!-- Dynamic Arm pointing dynamically at the board/diagram -->
  <g filter="url(#shadow)">
    <!-- Upper arm -->
    <path d="M45 160 Q70 140 100 120" fill="none" stroke="#4f46e5" stroke-width="18" stroke-linecap="round"/>
    <!-- Forearm extending up-right -->
    <path d="M96 123 Q125 100 145 75" fill="none" stroke="#6366f1" stroke-width="14" stroke-linecap="round"/>
    <!-- Hand / Palm -->
    <circle cx="148" cy="71" r="7" fill="#fde047"/>
    <!-- Glowing Laser Pointer Stick -->
    <line x1="148" y1="71" x2="175" y2="45" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <!-- Laser glowing tip effect -->
    <circle cx="175" cy="45" r="6" fill="#f43f5e" filter="url(#softGlow)"/>
    <circle cx="175" cy="45" r="3" fill="#ffffff"/>
  </g>

  <!-- Interactive Visual Elements / Floating "Explanation" Magic Sparks -->
  <!-- Glowing Connection Arcs (Visualizing breakdown and clarity) -->
  <path d="M105 110 Q140 80 175 45" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6" filter="url(#softGlow)"/>
  
  <!-- Floating Sparkles / Concept Nodes -->
  <g fill="#38bdf8" filter="url(#softGlow)">
    <circle cx="95" cy="95" r="3"/>
    <circle cx="130" cy="75" r="4"/>
    <circle cx="160" cy="55" r="2.5"/>
  </g>
  <g fill="#fbbf24">
    <path d="M135 105 L138 112 L145 115 L138 118 L135 125 L132 118 L125 115 L132 112 Z"/>
    <path d="M75 55 L77 59 L81 60 L77 61 L75 65 L73 61 L69 60 L73 59 Z" transform="scale(0.7) translate(40, 20)"/>
  </g>

  <!-- Ambient Light Highlights on Top Border -->
  <path d="M0 24 C0 10 10 0 24 0 L216 0 C230 0 240 10 240 24 L240 26 L0 26 Z" fill="#ffffff" fill-opacity="0.05"/>
</svg>