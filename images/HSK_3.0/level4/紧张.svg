<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Nervous Sweat Shimmer -->
    <linearGradient id="sweatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effects (Nervous, tense atmosphere) -->
  <circle cx="120" cy="110" r="80" fill="#f59e0b" opacity="0.08" filter="url(#glow)" />
  <circle cx="120" cy="80" r="40" fill="#ef4444" opacity="0.05" filter="url(#glow)" />

  <!-- Background Environment: Exam Room / Desk Setup -->
  <g id="environment">
    <!-- Clock on Wall (Showing countdown pressure) -->
    <circle cx="120" cy="42" r="22" fill="#334155" stroke="#475569" stroke-width="2" />
    <circle cx="120" cy="42" r="19" fill="#0f172a" />
    <!-- Clock ticks -->
    <line x1="120" y1="25" x2="120" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="120" y1="56" x2="120" y2="59" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <line x1="103" y1="42" x2="106" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="134" y1="42" x2="137" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Clock Hands (Pointing frantically) -->
    <line x1="120" y1="42" x2="120" y2="32" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
    <line x1="120" y1="42" x2="130" y2="46" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="120" cy="42" r="2.5" fill="#ef4444" />

    <!-- Wooden/Modern Desk Surface -->
    <path d="M 12 185 L 228 185 L 210 220 L 30 220 Z" fill="url(#deskGrad)" />
    <path d="M 12 185 L 228 185 L 228 190 L 12 190 Z" fill="#475569" opacity="0.6" />

    <!-- Exam Paper / Test Sheet with red marks and urgent scribbles -->
    <g transform="translate(75, 140) rotate(-4)">
      <!-- Paper Shadow -->
      <rect x="2" y="2" width="90" height="70" rx="3" fill="#000000" opacity="0.3" />
      <!-- Paper Body -->
      <rect x="0" y="0" width="90" height="70" rx="3" fill="#f8fafc" />
      <!-- Red Header/Stamp area -->
      <rect x="10" y="10" width="30" height="6" rx="1.5" fill="#ef4444" opacity="0.8" />
      <!-- Question Lines / Scribbled Answers (Showing stress) -->
      <line x1="10" y1="24" x2="80" y2="24" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <line x1="10" y1="34" x2="65" y2="34" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <path d="M 10 46 Q 25 38, 40 48 T 70 44" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 10 58 Q 30 64, 50 54" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Pen rolling off edge (sign of panic/clumsiness) -->
    <g transform="translate(165, 172) rotate(35)">
      <rect x="0" y="0" width="28" height="4" rx="2" fill="#fb923c" />
      <rect x="22" y="0" width="6" height="4" fill="#0f172a" />
      <path d="M 0 2 L -4 1" stroke="#fb923c" stroke-width="1.5" />
    </g>
  </g>

  <!-- Main Character: Experiencing '紧张' (Tense, Nervous) -->
  <g id="character">
    <!-- Shoulders & Torso -->
    <path d="M 75 220 C 75 185, 95 175, 120 175 C 145 175, 165 185, 165 220 Z" fill="url(#shirtGrad)" />
    <!-- Collar -->
    <path d="M 105 175 L 120 192 L 135 175 Z" fill="#f8fafc" />

    <!-- Trembling Arms gripped to head / cheeks -->
    <!-- Left Arm -->
    <path d="M 85 185 C 75 160, 85 135, 100 130" fill="none" stroke="url(#shirtGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M 155 185 C 165 160, 155 135, 140 130" fill="none" stroke="url(#shirtGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="108" y="138" width="24" height="20" rx="6" fill="#fcd34d" />

    <!-- Head (Slightly tilted, wide-eyed with anxiety) -->
    <g transform="translate(120, 115)">
      <!-- Head Base -->
      <rect x="-32" y="-38" width="64" height="66" rx="30" fill="#fcd34d" />

      <!-- Ears -->
      <circle cx="-34" cy="-5" r="7" fill="#f59e0b" />
      <circle cx="34" cy="-5" r="7" fill="#f59e0b" />

      <!-- Messy/Spiky Hair (Expressing frantic energy) -->
      <path d="M -34 -15 C -40 -35, -15 -45, 0 -42 C 20 -45, 38 -32, 34 -12 C 40 -25, 20 -52, -5 -46 C -25 -48, -38 -30, -34 -15 Z" fill="#1e293b" />

      <!-- Tense Eyebrows (Slanted high and angled inward) -->
      <path d="M -20 -16 L -6 -10" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 20 -16 L 6 -10" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />

      <!-- Wide, Nervous Eyes (Staring blankly in panic) -->
      <circle cx="-13" cy="-4" r="8" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5" />
      <circle cx="13" cy="-4" r="8" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5" />
      <!-- Pupils (Dilated and shaking) -->
      <circle cx="-12" cy="-4" r="3.5" fill="#0f172a" />
      <circle cx="14" cy="-4" r="3.5" fill="#0f172a" />
      <!-- Eye highlight -->
      <circle cx="-14" cy="-6" r="1.2" fill="#ffffff" />
      <circle cx="12" cy="-6" r="1.2" fill="#ffffff" />

      <!-- Frantic Open Mouth (Gasping / Catching breath) -->
      <path d="M -7 12 C -7 22, 7 22, 7 12 Z" fill="#0f172a" />
      <!-- Teeth/Tongue hint -->
      <path d="M -5 12 C -5 14, 5 14, 5 12 Z" fill="#f8fafc" />

      <!-- Blushing / Sweat drop on cheeks -->
      <ellipse cx="-22" cy="4" rx="5" ry="3" fill="#f87171" opacity="0.4" />
      <ellipse cx="22" cy="4" rx="5" ry="3" fill="#f87171" opacity="0.4" />

      <!-- Giant Cold Sweat Drop (Classic manga/illustration trope for extreme nervous tension) -->
      <g transform="translate(24, -28) rotate(15)">
        <path d="M 0 0 C 6 8, 6 14, 0 18 C -6 14, -6 8, 0 0 Z" fill="url(#sweatGrad)" />
      </g>
      <!-- Tiny secondary sweat drop -->
      <g transform="translate(-28, -20) rotate(-15)">
        <path d="M 0 0 C 4 5, 4 9, 0 12 C -4 9, -4 5, 0 0 Z" fill="url(#sweatGrad)" />
      </g>
    </g>

    <!-- Hands gripping head in stress/worry -->
    <circle cx="86" cy="115" r="9" fill="#fcd34d" stroke="#f59e0b" stroke-width="2" />
    <circle cx="154" cy="115" r="9" fill="#fcd34d" stroke="#f59e0b" stroke-width="2" />
  </g>

  <!-- Visual Action Lines / Stress Vibrations (Flanking the character) -->
  <g id="stress-vibrations" opacity="0.8">
    <!-- Left side vibration / trembling arcs -->
    <path d="M 45 95 C 38 105, 38 115, 45 125" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 35 105 C 30 110, 30 115, 35 120" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Right side vibration / trembling arcs -->
    <path d="M 195 95 C 202 105, 202 115, 195 125" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 205 105 C 210 110, 210 115, 205 120" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Floating sweat / tension particles -->
    <circle cx="55" cy="75" r="3.5" fill="#38bdf8" opacity="0.7" />
    <circle cx="185" cy="80" r="2.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="65" cy="145" r="2" fill="#f87171" opacity="0.8" />
    <circle cx="178" cy="140" r="3" fill="#38bdf8" opacity="0.6" />
  </g>
</svg>