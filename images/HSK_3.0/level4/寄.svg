<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Mailbox -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Envelope Gradient -->
    <linearGradient id="envGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="envInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Mailbox Red Gradient -->
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    
    <!-- Post Box Cap Gradient -->
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#030712" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <!-- Warm Ambient Light Circle -->
  <circle cx="160" cy="110" r="80" fill="url(#lampGlow)"/>

  <!-- Background Wall / Brick Texture hint or subtle shapes -->
  <path d="M0 190 L240 190" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- Distant street lamp source -->
  <circle cx="170" cy="45" r="12" fill="#fde047" opacity="0.8" filter="url(#glow)"/>
  <path d="M170 57 L170 190" stroke="#334155" stroke-width="4"/>

  <!-- Ground Plane -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16"/>
  <ellipse cx="120" cy="190" rx="110" ry="8" fill="#1e293b" opacity="0.5"/>

  <!-- ==================== MAIN SUBJECT: MAILBOX & POSTING ACTION ==================== -->

  <!-- Mailbox Post -->
  <rect x="110" y="120" width="20" height="75" fill="#475569" filter="url(#shadow)"/>
  <rect x="115" y="120" width="10" height="75" fill="#64748b"/>

  <!-- Mailbox Body (Cylindrical / Rounded) -->
  <g filter="url(#shadow)">
    <!-- Base stand connector -->
    <path d="M95 120 L145 120 L140 110 L100 110 Z" fill="#334155"/>
    
    <!-- Main Red Cylinder/Box -->
    <rect x="85" y="65" width="70" height="50" rx="10" fill="url(#boxGrad)"/>
    <rect x="85" y="55" width="70" height="20" rx="6" fill="url(#capGrad)"/>
    
    <!-- Mailbox Door / Slot Border -->
    <rect x="100" y="80" width="40" height="20" rx="4" fill="#9f1239" opacity="0.6"/>
    <rect x="105" y="86" width="30" height="4" rx="2" fill="#0f172a"/>

    <!-- Gold Emblems / Details on Box -->
    <circle cx="120" cy="72" r="4" fill="#fbbf24"/>
    <path d="M112 103 L128 103" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ACTION ELEMENT: The Envelope being 'Gửi' (Sent) -->
  <g filter="url(#shadow)">
    <!-- Motion Trails -->
    <path d="M40 75 Q60 85 78 92" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M48 95 Q65 100 78 102" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Envelope Group angled dynamically entering slot -->
    <g transform="translate(68, 78) rotate(18)">
      <!-- Envelope Back/Base -->
      <rect x="0" y="0" width="55" height="38" rx="4" fill="url(#envGrad)" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Envelope Inner Flap / Pocket lines -->
      <path d="M0 0 L27 22 L55 0" fill="none" stroke="url(#envInner)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 38 L22 18" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
      <path d="M55 38 L33 18" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

      <!-- Tiny stamp accent -->
      <rect x="40" y="6" width="10" height="8" rx="1" fill="#f43f5e" opacity="0.8"/>
    </g>
  </g>

  <!-- Foreground / Context Prop: Extra parcels/letters resting near the base to enhance real-world environment -->
  <g filter="url(#shadow)" transform="translate(0, 5)">
    <!-- Small blue package box -->
    <g transform="translate(45, 175)">
      <rect x="0" y="5" width="28" height="20" rx="3" fill="#0ea5e9"/>
      <rect x="0" y="5" width="28" height="6" fill="#38bdf8" opacity="0.6"/>
      <!-- Ribbon -->
      <rect x="12" y="5" width="4" height="20" fill="#f59e0b"/>
      <rect x="0" y="13" width="28" height="4" fill="#f59e0b"/>
    </g>

    <!-- Stacked envelope on ground -->
    <g transform="translate(160, 180) rotate(-10)">
      <rect x="0" y="0" width="36" height="24" rx="3" fill="#ffffff"/>
      <path d="M0 0 L18 14 L36 0" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Dynamic floating particles / magic delivery sparkles -->
  <g fill="#38bdf8">
    <circle cx="55" cy="65" r="2.5" opacity="0.9"/>
    <circle cx="72" cy="55" r="1.5" opacity="0.7"/>
    <circle cx="35" cy="100" r="2" opacity="0.8"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="95" cy="45" r="2" opacity="0.9"/>
    <circle cx="140" cy="50" r="1.5" opacity="0.6"/>
  </g>
</svg>