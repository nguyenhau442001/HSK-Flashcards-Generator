<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Amber Glow for Sunset/Suburban Vibe -->
    <radialGradient id="sunGlow" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- House Windows Warm Light -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- House 1 Walls -->
    <linearGradient id="house1Wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    
    <!-- House 2 Walls -->
    <linearGradient id="house2Wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Road Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Canopy Gradients -->
    <linearGradient id="treeCanopy1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="treeCanopy2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)"/>

  <!-- Distant Hills / Suburb Horizon -->
  <path d="M0 140 Q 60 110, 140 130 T 240 125 L 240 180 L 0 180 Z" fill="#334155" opacity="0.6"/>
  <path d="M0 130 Q 90 100, 180 125 T 240 115 L 240 180 L 0 180 Z" fill="#475569" opacity="0.5"/>

  <!-- Distant Wind Turbine / Suburban Electricity Pylon (Symbolizing edge of city/nature) -->
  <line x1="195" y1="120" x2="195" y2="85" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="195" cy="85" r="2" fill="#cbd5e1"/>
  <path d="M195 85 L 205 75" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M195 85 L 187 90" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M195 85 L 197 95" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Back Hills Greenery -->
  <path d="M-10 160 Q 40 130, 110 145 T 250 140 L 250 190 L -10 190 Z" fill="#047857" opacity="0.8"/>

  <!-- House 2 (Right Background Suburban Cottage) -->
  <g transform="translate(145, 105)">
    <!-- Roof -->
    <polygon points="40,10 75,35 5,35" fill="#f43f5e"/>
    <polygon points="40,10 75,35 70,35 40,15" fill="#fda4af" opacity="0.4"/>
    <!-- Walls -->
    <rect x="12" y="35" width="56" height="40" fill="url(#house2Wall)"/>
    <!-- Door -->
    <rect x="32" y="50" width="16" height="25" rx="8" fill="#78350f"/>
    <!-- Window -->
    <rect x="18" y="45" width="10" height="10" rx="2" fill="url(#windowGlow)"/>
    <rect x="48" y="45" width="10" height="10" rx="2" fill="url(#windowGlow)"/>
  </g>

  <!-- House 1 (Left Main Suburban House) -->
  <g transform="translate(25, 90)">
    <!-- Chimney -->
    <rect x="48" y="10" width="10" height="18" fill="#b91c1c"/>
    <!-- Small smoke puff -->
    <circle cx="53" cy="2" r="3" fill="#cbd5e1" opacity="0.5"/>
    <circle cx="56" cy="-4" r="4.5" fill="#cbd5e1" opacity="0.3"/>

    <!-- Roof -->
    <polygon points="40,15 80,45 0,45" fill="#3b82f6"/>
    <!-- Roof highlight -->
    <polygon points="40,15 80,45 74,45 40,20" fill="#93c5fd" opacity="0.4"/>

    <!-- Walls -->
    <rect x="10" y="45" width="60" height="45" fill="url(#house1Wall)"/>
    
    <!-- Garage / Side Extension -->
    <rect x="-18" y="55" width="32" height="35" fill="#cbd5e1"/>
    <path d="M-22 55 L -2 40 L 14 55 Z" fill="#64748b"/>
    <!-- Garage Door -->
    <rect x="-13" y="65" width="22" height="25" rx="2" fill="#475569"/>
    <line x1="-13" y1="71" x2="9" y2="71" stroke="#334155" stroke-width="1.5"/>
    <line x1="-13" y1="77" x2="9" y2="77" stroke="#334155" stroke-width="1.5"/>
    <line x1="-13" y1="83" x2="9" y2="83" stroke="#334155" stroke-width="1.5"/>

    <!-- Front Door -->
    <rect x="36" y="62" width="16" height="28" rx="2" fill="#b45309"/>
    <circle cx="48" cy="78" r="1.5" fill="#fbbf24"/>

    <!-- Windows (Warm glowing lights) -->
    <rect x="18" y="58" width="12" height="14" rx="2" fill="url(#windowGlow)"/>
    <line x1="24" y1="58" x2="24" y2="72" stroke="#78350f" stroke-width="1.5"/>
    <line x1="18" y1="65" x2="30" y2="65" stroke="#78350f" stroke-width="1.5"/>

    <rect x="58" y="58" width="12" height="14" rx="2" fill="url(#windowGlow)"/>
    <line x1="64" y1="58" x2="64" y2="72" stroke="#78350f" stroke-width="1.5"/>
    <line x1="58" y1="65" x2="70" y2="65" stroke="#78350f" stroke-width="1.5"/>
    
    <!-- Attic Window (Round) -->
    <circle cx="40" cy="32" r="6" fill="url(#windowGlow)"/>
  </g>

  <!-- Lush Green Lawn & Foreground Terrain -->
  <path d="M0 160 Q 90 140, 240 155 L 240 240 L 0 240 Z" fill="#065f46"/>
  <path d="M0 175 Q 120 155, 240 170 L 240 240 L 0 240 Z" fill="#047857"/>

  <!-- Winding Suburban Road / Driveway -->
  <path d="M95 160 C 95 190, 75 200, 40 240 L 80 240 C 115 200, 125 190, 125 160 Z" fill="url(#roadGrad)"/>
  <path d="M110 160 C 110 190, 140 205, 185 240 L 225 240 C 170 200, 135 190, 130 160 Z" fill="url(#roadGrad)" opacity="0.7"/>
  
  <!-- Dashed Road Lines -->
  <path d="M110 165 C 110 195, 95 205, 60 240" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.6"/>

  <!-- Suburban Vegetation & Trees -->
  <!-- Big Tree Left -->
  <g transform="translate(5, 110)">
    <rect x="22" y="30" width="8" height="40" rx="3" fill="#78350f"/>
    <circle cx="26" cy="25" r="22" fill="url(#treeCanopy1)"/>
    <circle cx="14" cy="18" r="16" fill="url(#treeCanopy2)"/>
    <circle cx="38" cy="16" r="17" fill="url(#treeCanopy1)"/>
  </g>

  <!-- Big Tree Right Foreground -->
  <g transform="translate(195, 125)">
    <rect x="18" y="30" width="7" height="45" rx="3" fill="#78350f"/>
    <circle cx="21" cy="20" r="20" fill="url(#treeCanopy2)"/>
    <circle cx="9" cy="15" r="15" fill="url(#treeCanopy1)"/>
    <circle cx="32" cy="12" r="18" fill="url(#treeCanopy2)"/>
    <!-- Hanging leaves highlight -->
    <circle cx="21" cy="8" r="10" fill="#a7f3d0" opacity="0.4"/>
  </g>

  <!-- White Picket Fence -->
  <g stroke="#f8fafc" stroke-width="2" stroke-linecap="round">
    <!-- Horizontal rails -->
    <line x1="85" y1="175" x2="160" y2="175"/>
    <line x1="85" y1="185" x2="160" y2="185"/>

    <!-- Pickets -->
    <path d="M 88 188 L 88 170 M 88 170 L 91 172 L 91 188" fill="#f8fafc"/>
    <path d="M 98 188 L 98 169 M 98 169 L 101 171 L 101 188" fill="#f8fafc"/>
    <path d="M 108 189 L 108 170 M 108 170 L 111 172 L 111 189" fill="#f8fafc"/>
    <!-- Gate opening spacer -->
    <path d="M 134 191 L 134 172 M 134 172 L 137 174 L 137 191" fill="#f8fafc"/>
    <path d="M 144 191 L 144 171 M 144 171 L 147 173 L 147 191" fill="#f8fafc"/>
    <path d="M 154 192 L 154 170 M 154 170 L 157 172 L 157 192" fill="#f8fafc"/>
  </g>

  <!-- Mailbox near driveway -->
  <g transform="translate(75, 175)">
    <rect x="0" y="10" width="3" height="25" fill="#64748b"/>
    <path d="M -5 5 Q 1.5 -2, 8 5 Z" fill="#ef4444"/>
    <rect x="-4" y="5" width="11" height="8" rx="2" fill="#ef4444"/>
    <!-- Flag -->
    <line x1="7" y1="8" x2="12" y2="6" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Foreground Bushes & Flowers -->
  <circle cx="45" cy="205" r="10" fill="#059669"/>
  <circle cx="37" cy="210" r="8" fill="#34d399"/>
  <circle cx="53" cy="212" r="9" fill="#10b981"/>
  <!-- Tiny flowers -->
  <circle cx="42" cy="203" r="2" fill="#f43f5e"/>
  <circle cx="50" cy="208" r="2" fill="#fbbf24"/>

  <!-- Left Foreground Bush -->
  <circle cx="15" cy="225" r="12" fill="#059669"/>
  <circle cx="26" cy="230" r="10" fill="#34d399"/>

  <!-- Right Foreground Bicycle leaning against the fence (Classic suburban touch) -->
  <g transform="translate(162, 190) scale(0.8)">
    <!-- Wheels -->
    <circle cx="10" cy="25" r="12" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="40" cy="25" r="12" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
    <!-- Frame -->
    <path d="M10 25 L 25 10 L 35 25 L 25 25 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M25 10 L 28 5" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M35 25 L 40 25" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 25 L 18 28" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- Seat & Handlebar -->
    <path d="M23 8 L 29 8" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M38 18 L 41 22" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Birds in the sky (Suburban peaceful atmosphere) -->
  <path d="M 60 50 Q 65 43, 70 50 Q 75 43, 80 50" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 72 38 Q 76 33, 80 38 Q 84 33, 88 38" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Glowing Sun / Sunset Orb -->
  <circle cx="180" cy="60" r="18" fill="#fbbf24" opacity="0.9"/>
  <circle cx="180" cy="60" r="24" fill="#f59e0b" opacity="0.3"/>
</svg>