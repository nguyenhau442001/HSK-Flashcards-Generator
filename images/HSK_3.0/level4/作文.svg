<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 50)">
    <!-- Desk Surface -->
    <rect x="-10" y="130" width="180" height="10" rx="2" fill="#334155"/>
    
    <!-- Paper -->
    <rect x="20" y="10" width="120" height="140" rx="4" fill="#f8fafc"/>
    <line x1="35" y1="30" x2="125" y2="30" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="35" y1="50" x2="125" y2="50" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="35" y1="70" x2="125" y2="70" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="35" y1="90" x2="125" y2="90" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="35" y1="110" x2="125" y2="110" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Pen -->
    <path d="M140 120 L155 105 L160 110 L145 125 Z" fill="#fb923c"/>
    <path d="M135 125 L145 115" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Lamp Glow -->
    <circle cx="170" cy="30" r="40" fill="#f59e0b" opacity="0.15"/>
    <path d="M160 40 L180 40 L185 80 L155 80 Z" fill="#fbbf24"/>
    <rect x="165" y="80" width="10" height="50" fill="#475569"/>
    
    <!-- Coffee Mug -->
    <rect x="0" y="100" width="30" height="35" rx="4" fill="#ec4899"/>
    <path d="M30 105 Q40 105 40 115 Q40 125 30 125" stroke="#ec4899" stroke-width="4" fill="none"/>
    
    <!-- Decorative element -->
    <circle cx="10" cy="20" r="5" fill="#10b981"/>
  </g>
</svg>