<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Cup Gradients -->
    <linearGradient id="cupGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cupLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Podium Gradients -->
    <linearGradient id="podiumTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="podiumFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Confetti & Accent Colors -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Decorative Rays/Lighting -->
  <g opacity="0.15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
    <line x1="120" y1="110" x2="60" y2="40"/>
    <line x1="120" y1="110" x2="180" y2="40"/>
    <line x1="120" y1="110" x2="40" y2="90"/>
    <line x1="120" y1="110" x2="200" y2="90"/>
  </g>

  <!-- Confetti & Celebration Elements -->
  <g>
    <!-- Streamers -->
    <path d="M40 70 Q 50 50, 70 60" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 80 Q 185 60, 170 75" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 160 Q 50 180, 70 190" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Confetti Pieces -->
    <rect x="75" y="45" width="6" height="6" rx="1.5" fill="#38bdf8" transform="rotate(25 75 45)"/>
    <rect x="165" y="50" width="7" height="5" rx="1.5" fill="#fbbf24" transform="rotate(-15 165 50)"/>
    <circle cx="50" cy="115" r="3" fill="#10b981"/>
    <circle cx="190" cy="130" r="3.5" fill="#f43f5e"/>
    <rect x="155" y="155" width="5" height="8" rx="1.5" fill="#a855f7" transform="rotate(45 155 155)"/>
    <rect x="70" y="130" width="6" height="4" rx="1" fill="#fb923c" transform="rotate(-30 70 130)"/>
  </g>

  <!-- Backdrop Glow for the Trophy (Achievement Vibe) -->
  <circle cx="120" cy="105" r="45" fill="#fbbf24" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Stage / Podium Structure -->
  <g id="podium">
    <!-- Base Platform Shadow -->
    <ellipse cx="120" cy="195" rx="65" ry="12" fill="#090d16" opacity="0.6"/>
    
    <!-- Main Podium Block (1st Place) -->
    <path d="M 85 145 L 155 145 L 165 185 L 75 185 Z" fill="url(#podiumFront)"/>
    <path d="M 85 145 L 155 145 L 145 137 L 95 137 Z" fill="url(#podiumTop)"/>
    
    <!-- Side Supporting Blocks for Depth -->
    <path d="M 55 160 L 85 145 L 75 185 L 45 195 Z" fill="#0369a1" opacity="0.7"/>
    <path d="M 185 160 L 155 145 L 165 185 L 195 195 Z" fill="#0284c7" opacity="0.7"/>

    <!-- Podium Emblem / Star Graphic -->
    <polygon points="120,152 122.5,158 129,158.5 124,162.5 125.5,169 120,165.5 114.5,169 116,162.5 111,158.5 117.5,158" fill="#fbbf24"/>
  </g>

  <!-- The Trophy (Main Subject: Achieving/Winning) -->
  <g id="trophy" transform="translate(0, -5)">
    <!-- Trophy Glow Effect -->
    <circle cx="120" cy="95" r="30" fill="#fbbf24" opacity="0.2" filter="url(#glow)"/>

    <!-- Trophy Base -->
    <path d="M 105 137 L 135 137 L 130 145 L 110 145 Z" fill="#94a3b8"/>
    <rect x="112" y="132" width="16" height="5" rx="1" fill="#cbd5e1"/>

    <!-- Trophy Stem -->
    <rect x="116" y="115" width="8" height="18" fill="url(#cupGold)"/>

    <!-- Trophy Cup Body -->
    <path d="M 96 70 C 96 95, 104 115, 120 115 C 136 115, 144 95, 144 70 Z" fill="url(#cupGold)"/>
    
    <!-- Inner Cup Rim Highlight -->
    <ellipse cx="120" cy="70" rx="24" ry="6" fill="url(#cupLight)"/>
    <ellipse cx="120" cy="70" rx="20" ry="4" fill="#d97706"/>

    <!-- Left Handle -->
    <path d="M 98 75 C 84 75, 84 95, 98 100" fill="none" stroke="url(#cupGold)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Right Handle -->
    <path d="M 142 75 C 156 75, 156 95, 142 100" fill="none" stroke="url(#cupGold)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Trophy Body Front Shine -->
    <path d="M 112 80 C 112 80, 110 95, 115 105" fill="none" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Star Emblem on Trophy -->
    <polygon points="120,87 122,92 127,92.5 123,96 124,101 120,98.5 116,101 117,96 113,92.5 118,92" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Sparkles & Action Elements around Trophy -->
  <g id="sparkles">
    <!-- Top Sparkle -->
    <path d="M 120 40 Q 120 50, 130 50 Q 120 50, 120 60 Q 120 50, 110 50 Q 120 50, 120 40 Z" fill="#fbbf24"/>
    
    <!-- Left Sparkle -->
    <path d="M 85 70 Q 85 76, 91 76 Q 85 76, 85 82 Q 85 76, 79 76 Q 85 76, 85 70 Z" fill="#38bdf8"/>

    <!-- Right Sparkle -->
    <path d="M 155 75 Q 155 80, 160 80 Q 155 80, 155 85 Q 155 80, 150 80 Q 155 80, 155 75 Z" fill="#f43f5e"/>

    <!-- Tiny Star Dots -->
    <circle cx="95" cy="55" r="2" fill="#fef3c7"/>
    <circle cx="145" cy="58" r="2.5" fill="#fef3c7"/>
    <circle cx="102" cy="120" r="1.5" fill="#38bdf8"/>
    <circle cx="138" cy="122" r="2" fill="#10b981"/>
  </g>
</svg>