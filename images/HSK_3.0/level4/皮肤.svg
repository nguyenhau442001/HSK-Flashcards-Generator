<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mirror Frame Gradient -->
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Skin Glow Gradient -->
    <linearGradient id="skinGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Background Shapes & Props (Vanity Table setting) -->
  <!-- Wall shelf / background line -->
  <path d="M 30,190 L 210,190" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Skincare Bottle Left (Essence dropper) -->
  <g transform="translate(42, 130)">
    <rect x="0" y="20" width="22" height="40" rx="4" fill="#38bdf8" opacity="0.8"/>
    <path d="M 6,20 L 6,10 L 16,10 L 16,20 Z" fill="#94a3b8"/>
    <rect x="9" y="4" width="4" height="6" fill="#f59e0b"/>
    <!-- Liquid inside -->
    <rect x="3" y="30" width="16" height="26" rx="2" fill="#7dd3fc" opacity="0.6"/>
  </g>

  <!-- Skincare Jar Right (Cream) -->
  <g transform="translate(175, 145)">
    <rect x="0" y="15" width="28" height="25" rx="4" fill="#ec4899" opacity="0.85"/>
    <ellipse cx="14" cy="15" rx="14" ry="4" fill="#fbcfe8"/>
    <rect x="4" y="0" width="20" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Green Leaf / Natural Element -->
  <g transform="translate(35, 160) rotate(-15)">
    <path d="M 0,20 Q 15,0 25,-10 Q 10,10 0,20 Z" fill="#10b981"/>
    <path d="M 0,20 Q 12,12 25,-10" stroke="#065f46" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Main Mirror Object (Representing reflection of healthy skin) -->
  <g filter="url(#shadow)">
    <!-- Mirror Stand Base -->
    <ellipse cx="120" cy="205" rx="35" ry="8" fill="#b45309"/>
    <path d="M 116,190 L 124,190 L 122,145 L 118,145 Z" fill="url(#goldFrame)"/>

    <!-- Mirror Outer Ring -->
    <circle cx="120" cy="95" r="52" fill="url(#goldFrame)"/>
    <!-- Mirror Inner Reflection Surface -->
    <circle cx="120" cy="95" r="46" fill="#0f172a"/>
    <circle cx="120" cy="95" r="44" fill="#fef3c7" opacity="0.15"/>

    <!-- Inside Mirror: Character's face highlighting glowing skin -->
    <g clip-path="url(#mirrorClip)">
      <clipPath id="mirrorClip">
        <circle cx="120" cy="95" r="44"/>
      </clipPath>
      
      <!-- Neck & Shoulders -->
      <path d="M 95,145 Q 120,120 145,145 L 155,160 L 85,160 Z" fill="url(#skinGlow)"/>

      <!-- Face Base -->
      <ellipse cx="120" cy="95" rx="28" ry="34" fill="url(#skinGlow)"/>

      <!-- Hair Back/Sides -->
      <path d="M 90,80 Q 90,50 120,55 Q 150,50 150,80 Q 155,120 145,140 L 95,140 Q 85,120 90,80 Z" fill="#78350f"/>
      
      <!-- Cute Bangs -->
      <path d="M 95,75 Q 120,90 145,75 Q 130,65 120,68 Q 110,65 95,75 Z" fill="#92400e"/>

      <!-- Gentle Closed Happy Eyes (Crescent shapes) -->
      <path d="M 104,88 Q 109,94 114,88" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 126,88 Q 131,94 136,88" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Rosy Cheeks (Highlighting healthy skin) -->
      <ellipse cx="103" cy="97" r="5" fill="#fb7185" opacity="0.5" filter="url(#glow)"/>
      <ellipse cx="137" cy="97" r="5" fill="#fb7185" opacity="0.5" filter="url(#glow)"/>

      <!-- Smile -->
      <path d="M 115,106 Q 120,111 125,106" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Sparkling Skin Care Glow Effects (Sparkles near cheek) -->
      <g fill="#fbbf24" filter="url(#glow)">
        <path d="M 93,105 L 95,100 L 97,105 L 102,107 L 97,109 L 95,114 L 93,109 L 88,107 Z" transform="scale(0.5) translate(100, 90)"/>
        <path d="M 145,85 L 146,82 L 149,85 L 146,88 Z" fill="#ffffff"/>
      </g>
    </g>

    <!-- Mirror Glass Reflection Glare -->
    <path d="M 90,65 Q 110,55 130,60 Q 100,70 90,65 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Magnifying Glass / Skincare Inspection Tool (Interacting with the concept of checking skin) -->
  <g transform="translate(135, 115) rotate(25)" filter="url(#shadow)">
    <!-- Glass Rim -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <circle cx="0" cy="0" r="20" fill="#bae6fd" opacity="0.2"/>
    <!-- Handle -->
    <path d="M 14,14 L 32,32" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 14,14 L 32,32" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Lens Reflection -->
    <path d="M -10,-10 Q 0,-15 10,-10" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
  </g>

  <!-- Floating Sparkles / Healthy Skin Radiance -->
  <g fill="#f59e0b" filter="url(#glow)">
    <circle cx="65" cy="70" r="3" opacity="0.9"/>
    <circle cx="170" cy="85" r="2" opacity="0.7"/>
    <circle cx="155" cy="45" r="3.5" opacity="0.8"/>
    <!-- Tiny sparkle cross -->
    <path d="M 65,35 L 65,45 M 60,40 L 70,40" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 185,120 L 185,128 M 181,124 L 189,124" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>