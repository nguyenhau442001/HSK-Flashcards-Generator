<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="70%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Road Gradient -->
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Marker Post Gradient -->
    <linearGradient id="markerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Sign Top Gradient -->
    <linearGradient id="signTopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Elements / Distant Hills -->
  <path d="M-10 145 Q 60 115 130 135 T 250 120 L 250 180 L -10 180 Z" fill="#1b2a47"/>
  <path d="M-10 160 Q 90 130 170 150 T 250 135 L 250 180 L -10 180 Z" fill="#1e3354"/>

  <!-- Stars / City Lights in Distance -->
  <circle cx="45" cy="50" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="85" cy="35" r="1.5" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="165" cy="45" r="1" fill="#38bdf8" opacity="0.7"/>
  <circle cx="205" cy="65" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="25" cy="80" r="1" fill="#e2e8f0" opacity="0.5"/>

  <!-- Winding Road (Perspective) -->
  <path d="M 60 170 L 120 170 L 200 240 L 20 240 Z" fill="url(#roadGrad)"/>
  
  <!-- Road Dashes -->
  <polygon points="117,180 123,180 121,195 119,195" fill="#fbbf24" opacity="0.9"/>
  <polygon points="115,205 121,205 118,220 116,220" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Roadside Grass & Foliage (Left) -->
  <path d="M 10 175 Q 25 160 40 175 T 70 172 L 70 240 L 10 240 Z" fill="#0f2922"/>
  <path d="M15 174 Q 18 162 22 174" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 171 Q 33 158 38 172" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50 173 Q 54 163 58 173" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Roadside Details (Right/Stripe) -->
  <path d="M 60 170 L 68 170 L 25 240 L 15 240 Z" fill="#475569" opacity="0.3"/>

  <!-- === DISTANCE MILEPOST (The Hero Object representing 'Kilometer') === -->
  <g filter="url(#shadow)">
    <!-- Post Shadow on Ground -->
    <ellipse cx="145" cy="173" rx="18" ry="6" fill="#020617" opacity="0.6"/>

    <!-- Main Concrete Body -->
    <path d="M 132 110 L 158 110 L 160 168 L 130 168 Z" fill="url(#markerGrad)"/>
    
    <!-- Marker Right Side Shading (Depth) -->
    <path d="M 158 110 L 160 112 L 160 168 L 160 168 Z" fill="#64748b"/>
    
    <!-- Blue Highway Header Band -->
    <path d="M 131.5 110 L 158.5 110 L 158.8 126 L 131.2 126 Z" fill="url(#signTopGrad)"/>
    
    <!-- White Distance Indicator Plate (Graphic representation instead of text) -->
    <rect x="136" y="132" width="18" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
    
    <!-- Stylized Distance Numeric Representation (Three directional bars / dots denoting '3 Kilometers') -->
    <circle cx="145" cy="139" r="2.5" fill="#0284c7"/>
    <circle cx="145" cy="145" r="2.5" fill="#0284c7"/>
    <circle cx="145" cy="151" r="2.5" fill="#0284c7"/>
  </g>

  <!-- Directional Arrow Sign (Mounting Pole & Sign) -->
  <g filter="url(#shadow)">
    <!-- Thin Metal Pole -->
    <rect x="78" y="90" width="4" height="85" fill="#94a3b8"/>
    <rect x="79" y="90" width="1.5" height="85" fill="#e2e8f0"/>

    <!-- Direction Sign Board (Pointing towards destination) -->
    <path d="M 45 96 L 75 96 L 85 106 L 75 116 L 45 116 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <path d="M 48 99 L 73 99 L 80 106 L 73 113 L 48 113 Z" fill="#0369a1"/>
    
    <!-- School/Destination Icon on Sign (Little graduation cap / building glyph) -->
    <path d="M 58 103 L 64 100 L 70 103 L 64 106 Z" fill="#fbbf24"/>
    <path d="M 60 105.5 L 60 109 C 60 110.5 68 110.5 68 109 L 68 105.5" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Atmospheric Warm Glow (Streetlamp or ambient source) -->
  <circle cx="210" cy="30" r="40" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Modern Scenic Lighting / Accent Overlay -->
  <path d="M0 0 L240 0 L240 240 L0 240 Z" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>

  <!-- Cute Dynamic Element: Traveling glowing orb / motion particle representing journey/distance -->
  <g filter="url(#glow)">
    <circle cx="170" cy="190" r="4" fill="#38bdf8"/>
    <circle cx="150" cy="205" r="3" fill="#38bdf8" opacity="0.7"/>
    <circle cx="130" cy="218" r="2" fill="#38bdf8" opacity="0.4"/>
    <!-- Motion Trail -->
    <path d="M 190 175 Q 180 182 170 190" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

</svg>