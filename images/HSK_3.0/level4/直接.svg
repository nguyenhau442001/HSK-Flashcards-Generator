<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#334155" opacity="0.3"/>
  
  <!-- Person A (Speaker) -->
  <g transform="translate(40, 80)">
    <circle cx="30" cy="30" r="25" fill="#fbbf24"/>
    <path d="M15 60 Q30 80 45 60 L45 120 L15 120 Z" fill="#38bdf8"/>
    <path d="M20 40 L25 45 M35 40 L40 45" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 52 Q30 58 38 52" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Person B (Listener) -->
  <g transform="translate(150, 80)">
    <circle cx="30" cy="30" r="25" fill="#fb923c"/>
    <path d="M15 60 Q30 80 45 60 L45 120 L15 120 Z" fill="#ec4899"/>
    <path d="M20 40 L25 45 M35 40 L40 45" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M25 55 L35 55" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Direct Connection Beam -->
  <g>
    <path d="M95 110 L150 110" stroke="#10b981" stroke-width="6" stroke-dasharray="8 8" stroke-linecap="round"/>
    <path d="M140 100 L150 110 L140 120" stroke="#10b981" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Ambient Decor -->
  <circle cx="200" cy="40" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="30" cy="180" r="6" fill="#38bdf8" opacity="0.3"/>
  <path d="M180 190 L220 190" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
</svg>