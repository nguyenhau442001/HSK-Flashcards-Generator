<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Background Elements (Cozy Nursery Room) -->
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect x="0" y="0" width="240" height="240" fill="url(#wallGradient)"/>

  <!-- Wallpaper Polka Dots / Details -->
  <g fill="#334155" opacity="0.4">
    <circle cx="30" cy="40" r="3"/>
    <circle cx="90" cy="30" r="2"/>
    <circle cx="150" cy="50" r="3"/>
    <circle cx="210" cy="35" r="2.5"/>
    <circle cx="50" cy="90" r="2"/>
    <circle cx="190" cy="80" r="3"/>
  </g>

  <!-- Warm Wall Lamp & Light -->
  <circle cx="195" cy="55" r="40" fill="url(#lampGlow)"/>
  <path d="M190 35 H200 L205 50 H185 Z" fill="#fbbf24"/>
  <path d="M195 20 V35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bookshelf Background Prop -->
  <rect x="15" y="70" width="55" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="15" y1="110" x2="70" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="15" y1="150" x2="70" y2="150" stroke="#334155" stroke-width="2"/>
  <!-- Books -->
  <path d="M22 110 V85 H32 V110 Z" fill="#ec4899"/>
  <path d="M34 110 V90 H43 V110 Z" fill="#38bdf8"/>
  <path d="M46 110 V95 H58 V110 Z" fill="#10b981"/>
  <path d="M22 150 V130 H35 V150 Z" fill="#f59e0b"/>
  <path d="M38 150 V125 H47 V150 Z" fill="#8b5cf6"/>

  <!-- Potted Plant Prop -->
  <path d="M205 170 L212 195 H188 L195 170 Z" fill="#cbd5e1"/>
  <circle cx="200" cy="162" r="14" fill="#10b981"/>
  <circle cx="188" cy="158" r="10" fill="#059669"/>
  <circle cx="212" cy="155" r="11" fill="#34d399"/>

  <!-- Floor / Rug -->
  <ellipse cx="120" cy="210" rx="90" ry="16" fill="#334155" opacity="0.6"/>
  <ellipse cx="120" cy="213" rx="75" ry="12" fill="#475569" opacity="0.4"/>

  <!-- MAIN CHARACTERS: Mother hugging baby -->
  <!-- Mother's Body & Chair -->
  <!-- Cozy Armchair -->
  <path d="M70 120 C60 120 50 130 50 140 V205 C50 213 57 220 65 220 H120 C128 220 135 213 135 205 V140 C135 130 125 120 115 120 Z" fill="#38bdf8" opacity="0.2"/>
  <path d="M60 135 C50 135 45 145 45 155 V195 C45 203 52 210 60 210 H75 V135 Z" fill="#0ea5e9"/>
  
  <!-- Mother Torso & Back Arm -->
  <path d="M95 125 C95 110 115 105 125 115 C135 125 135 155 135 180 C135 195 125 210 110 210 H85 C75 210 70 200 75 190 C80 175 90 150 95 125 Z" fill="#fb923c"/>
  
  <!-- Mother's Head & Face (Warm, tender expression) -->
  <circle cx="115" cy="85" r="18" fill="#ffedd5"/>
  <!-- Hair -->
  <path d="M98 85 C98 70 110 65 125 70 C132 72 135 80 135 90 C135 90 135 105 130 105 C125 105 120 95 115 95 C110 95 100 100 98 85 Z" fill="#334155"/>
  <circle cx="110" cy="84" r="1.5" fill="#1e293b"/> <!-- Eye closed happily -->
  <path d="M107 88 Q110 91 113 88" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <ellipse cx="103" cy="90" rx="3" ry="2" fill="#fda4af" opacity="0.6"/> <!-- Blush -->

  <!-- Baby Character (Snuggled tightly in mother's arms) -->
  <!-- Baby Body & Swaddle/Clothes -->
  <g transform="translate(15, 5)">
    <!-- Baby Head -->
    <circle cx="95" cy="115" r="13" fill="#ffedd5"/>
    <!-- Baby Hair tuft -->
    <path d="M93 102 C93 98 97 98 97 102" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <!-- Baby Face -->
    <circle cx="91" cy="114" r="1" fill="#1e293b"/>
    <path d="M93 118 Q95 120 97 118" stroke="#1e293b" stroke-width="1" stroke-linecap="round" fill="none"/>
    <ellipse cx="87" cy="117" rx="2" ry="1.5" fill="#fda4af" opacity="0.6"/>
    
    <!-- Baby Body wrapped in cute yellow sleeper -->
    <path d="M82 125 C80 120 90 115 100 120 C110 125 115 140 105 155 C95 170 80 160 78 145 Z" fill="#fef08a"/>
    <!-- Baby little arms hugging back -->
    <path d="M92 128 C85 130 80 138 85 142 C90 146 98 138 98 135 Z" fill="#fde047"/>
  </g>

  <!-- Mother's Arms Embracing (The core action 'bào') -->
  <!-- Lower arm supporting baby -->
  <path d="M75 165 C80 175 100 180 115 175 C130 170 140 155 140 155 C140 155 125 170 105 172 C90 173 80 168 75 165 Z" fill="#f97316"/>
  <!-- Upper arm wrapping around -->
  <path d="M125 115 C135 125 145 145 135 165 C130 170 120 165 125 155 C130 140 120 130 115 120 Z" fill="#ea580c"/>
  <!-- Hand gently touching baby's back -->
  <circle cx="110" cy="155" r="6" fill="#ffedd5"/>

  <!-- Foreground Details & Warmth -->
  <!-- Little heart floating gently above to show affection/hugging warmth -->
  <path d="M125 60 C125 55 132 50 137 55 C142 50 149 55 149 60 C149 68 137 73 137 73 C137 73 125 68 125 60 Z" fill="#f43f5e" opacity="0.9"/>
  <path d="M110 45 C110 42 114 38 117 41 C120 38 124 42 124 45 C124 50 117 54 117 54 C117 54 110 50 110 45 Z" fill="#fb7185" opacity="0.7"/>

  <!-- Soft rim lighting on bottom border -->
  <rect x="0" y="236" width="240" height="4" fill="#38bdf8" opacity="0.5"/>
</svg>