<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Construction/Estimation Area -->
    <radialGradient id="amber-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window/Blue Light Gradient -->
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-gradient)" />

  <!-- Ambient Lighting Glows -->
  <circle cx="120" cy="110" r="100" fill="url(#amber-glow)" />

  <!-- BACKDROP ENVIRONMENT (Architect's Studio / Workshop) -->
  <g id="environment">
    <!-- Window with City Skyline Silhouette -->
    <path d="M 160 35 L 210 35 L 210 120 L 160 120 Z" fill="url(#window-grad)" stroke="#334155" stroke-width="1.5" />
    <path d="M 185 35 L 185 120 M 160 75 L 210 75" stroke="#334155" stroke-width="1" />
    <!-- Skyline outside -->
    <path d="M 165 120 L 165 95 L 172 95 L 172 120 L 178 120 L 178 85 L 190 85 L 190 120 L 196 120 L 196 100 L 205 100 L 205 120 Z" fill="#1e293b" opacity="0.6" />

    <!-- Wall Shelves & Blueprint Rolls -->
    <path d="M 25 55 L 75 55" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <circle cx="35" cy="52" r="4" fill="#fb923c" />
    <circle cx="48" cy="51" r="5" fill="#38bdf8" />
    <path d="M 30 75 L 90 75" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <rect x="40" y="65" width="20" height="10" rx="2" fill="#10b981" />
    <rect x="65" y="62" width="15" height="13" rx="2" fill="#f59e0b" />

    <!-- Desk / Drafting Table (Angled) -->
    <path d="M 20 180 L 150 150 L 180 200 L 30 220 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Table Surface -->
    <path d="M 25 170 L 140 145 L 170 190 L 45 205 Z" fill="#334155" />
    <!-- Drafting Surface Texture (Grid lines) -->
    <path d="M 40 173 L 135 152 M 60 185 L 155 164" stroke="#475569" stroke-width="0.75" opacity="0.5" />

    <!-- Desk Props: Architectural Model / Building Blocks -->
    <g transform="translate(115, 135) rotate(-10)">
      <polygon points="10,15 25,5 40,15 25,25" fill="#38bdf8" opacity="0.8" />
      <polygon points="10,15 10,25 25,35 25,25" fill="#0284c7" opacity="0.9" />
      <polygon points="40,15 40,25 25,35 25,25" fill="#0ea5e9" opacity="0.9" />
      <rect x="18" y="22" width="6" height="12" fill="#f59e0b" />
    </g>

    <!-- Hard Hat on Desk -->
    <path d="M 45 178 Q 55 168 70 175 Q 60 182 45 178 Z" fill="#f59e0b" />
    <ellipse cx="57" cy="176" rx="12" ry="4" fill="#fbbf24" />
  </g>

  <!-- FOREGROUND / CHARACTER (The Estimator / Architect analyzing and calculating) -->
  <g id="character" filter="url(#shadow)">
    <!-- Chair Back -->
    <path d="M 85 130 L 75 210 L 95 215 L 105 140 Z" fill="#334155" />

    <!-- Character Body & Torso (Leaning forward, thoughtful posture) -->
    <path d="M 85 135 Q 100 120 120 135 L 135 175 L 95 190 Z" fill="#3b82f6" /> <!-- Blue shirt/vest -->
    <path d="M 100 130 L 118 145 L 110 185 L 95 180 Z" fill="#2563eb" /> <!-- Vest shadow/detail -->

    <!-- Head & Hair -->
    <circle cx="122" cy="112" r="16" fill="#fbcfe8" /> <!-- Skin tone -->
    <!-- Hair -->
    <path d="M 108 110 Q 110 95 125 96 Q 138 97 136 112 Q 130 102 120 102 Q 112 102 108 110 Z" fill="#1e293b" />
    <!-- Concentrated Eyebrow (Expressing "Estimating / Thinking") -->
    <path d="M 115 108 L 128 112" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Eye (Focused, looking down at blueprints/calculations) -->
    <circle cx="127" cy="116" r="2" fill="#1e293b" />
    <!-- Thoughtful Mouth -->
    <path d="M 126 123 Q 130 124 133 121" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Left Arm (Resting on table) -->
    <path d="M 90 145 Q 75 160 85 175 L 105 170" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="85" cy="175" r="5" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Right Arm (Raised to chin, pointing/calculating gesture) -->
    <path d="M 120 130 Q 140 135 135 155 Q 133 160 128 158" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand touching chin thoughtfully -->
    <circle cx="128" cy="158" r="5" fill="#fbcfe8" />
  </g>

  <!-- CENTRAL ACTION PROPS: Blueprint, Calculator, and Floating "Estimation" Hologram Data -->
  <g id="action-props" filter="url(#shadow)">
    <!-- Large Unrolled Blueprint on Table -->
    <polygon points="60,160 140,140 160,180 80,200" fill="#0284c7" opacity="0.9" />
    <polygon points="65,162 138,145 155,178 82,195" fill="#0369a1" />
    <!-- Blueprint White Lines (Drawings & Calculations) -->
    <path d="M 75 180 L 100 170 L 110 185 M 120 160 L 140 155 M 90 168 L 105 165" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <circle cx="130" cy="170" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />

    <!-- Ruler / Drafting Tool -->
    <path d="M 100 195 L 150 165" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
    <path d="M 110 192 L 115 189 M 120 186 L 125 183 M 130 180 L 135 177" stroke="#ca8a04" stroke-width="1" />

    <!-- Digital Calculator / Estimation Device -->
    <g transform="translate(135, 175) rotate(-15)">
      <rect x="0" y="0" width="24" height="32" rx="3" fill="#334155" stroke="#64748b" stroke-width="1" />
      <rect x="3" y="4" width="18" height="8" rx="1" fill="#10b981" opacity="0.9" />
      <!-- Tiny green graph/digits representation -->
      <path d="M 5 10 L 9 7 L 13 9 L 19 5" fill="none" stroke="#ffffff" stroke-width="1" />
      <!-- Buttons -->
      <circle cx="7" cy="18" r="1.5" fill="#94a3b8" />
      <circle cx="12" cy="18" r="1.5" fill="#94a3b8" />
      <circle cx="17" cy="18" r="1.5" fill="#94a3b8" />
      <circle cx="7" cy="23" r="1.5" fill="#94a3b8" />
      <circle cx="12" cy="23" r="1.5" fill="#fb923c" />
      <circle cx="17" cy="23" r="1.5" fill="#38bdf8" />
      <circle cx="7" cy="28" r="1.5" fill="#94a3b8" />
      <circle cx="12" cy="28" r="1.5" fill="#94a3b8" />
      <circle cx="17" cy="28" r="1.5" fill="#10b981" />
    </g>

    <!-- Floating Graphic Elements representing "Estimation / Calculation / Forecasting" -->
    <!-- Upward Trend Graph Hologram (Glowing Amber/Gold) -->
    <g transform="translate(90, 80)">
      <path d="M 0 30 L 15 20 L 30 25 L 50 5" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="50" cy="5" r="4" fill="#fbbf24" />
      <circle cx="0" cy="30" r="2" fill="#f59e0b" opacity="0.7" />
      <circle cx="15" cy="20" r="2" fill="#f59e0b" opacity="0.7" />
      <circle cx="30" cy="25" r="2" fill="#f59e0b" opacity="0.7" />
      <!-- Glow under curve -->
      <path d="M 0 30 L 15 20 L 30 25 L 50 5 L 50 35 L 0 35 Z" fill="#f59e0b" opacity="0.1" />
    </g>

    <!-- Floating Percentage / Data Tags (Visualizing 'Estimating' future metrics) -->
    <g transform="translate(45, 110)">
      <rect x="0" y="0" width="32" height="18" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="8" cy="9" r="3" fill="#38bdf8" />
      <circle cx="20" cy="9" r="2" fill="#38bdf8" />
      <circle cx="26" cy="9" r="2" fill="#38bdf8" />
      <path d="M 14 6 L 18 12" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Target / Precision Marker floating above desk -->
    <g transform="translate(145, 65)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.8" />
      <circle cx="0" cy="0" r="4" fill="#ec4899" />
      <path d="M 0 -14 L 0 -10 M 0 10 L 0 14 M -14 0 L -10 0 M 10 0 L 14 0" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- FOREGROUND ACCENTS & LIGHTING -->
  <!-- Ambient dust motes / glowing particles -->
  <circle cx="75" cy="115" r="1.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="105" cy="65" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="140" cy="110" r="1" fill="#f59e0b" opacity="0.6" />
  <circle cx="60" cy="140" r="1.5" fill="#10b981" opacity="0.8" />

  <!-- Vignette Border (Subtle app frame polish) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5" />
</svg>