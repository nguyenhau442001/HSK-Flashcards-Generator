<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gradient for Tools/Wrench -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Golden Sparkle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Path for Card/Canvas -->
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <g clip-path="url(#cardClip)">
    <rect width="240" height="240" fill="url(#bgGrad)" />
    <rect width="240" height="240" fill="url(#spotlight)" />

    <!-- Ambient Workshop Environment / Back Wall -->
    <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" />
    <!-- Tool Rack / Pegboard pattern in background -->
    <g fill="#334155" opacity="0.4">
      <circle cx="30" cy="50" r="2" />
      <circle cx="50" cy="50" r="2" />
      <circle cx="70" cy="50" r="2" />
      <circle cx="30" cy="70" r="2" />
      <circle cx="50" cy="70" r="2" />
      <circle cx="70" cy="70" r="2" />
      
      <circle cx="170" cy="40" r="2" />
      <circle cx="190" cy="40" r="2" />
      <circle cx="210" cy="40" r="2" />
      <circle cx="170" cy="60" r="2" />
      <circle cx="190" cy="60" r="2" />
      <circle cx="210" cy="60" r="2" />
    </g>

    <!-- Wall Shelf -->
    <path d="M15 85 L95 85 L90 80 L20 80 Z" fill="#475569" />
    <!-- Gear on Shelf -->
    <circle cx="45" cy="70" r="10" fill="#64748b" />
    <circle cx="45" cy="70" r="5" fill="#1e293b" />
    <!-- Oil Can on Shelf -->
    <path d="M70 80 L82 80 L80 65 L72 65 Z" fill="#f59e0b" />
    <path d="M76 65 Q80 58 84 62" fill="none" stroke="#f59e0b" stroke-width="2" />

    <!-- Workbench Surface -->
    <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="#0f172a" />
    <path d="M0 160 L240 160 L240 175 L0 175 Z" fill="#334155" />
    <!-- Wood plank lines on workbench edge -->
    <path d="M40 160 L40 175 M120 160 L120 175 M180 160 L180 175" stroke="#1e293b" stroke-width="2" />

    <!-- Scooter / Motorcycle Engine Part (Context for '师傅 sửa xe') -->
    <g transform="translate(145, 130)">
      <!-- Tire/Rim Base -->
      <circle cx="35" cy="35" r="30" fill="#334155" />
      <circle cx="35" cy="35" r="22" fill="#1e293b" />
      <circle cx="35" cy="35" r="8" fill="url(#metalGrad)" />
      <!-- Spokes -->
      <path d="M35 13 L35 57 M13 35 L57 35 M20 20 L50 50 M20 50 L50 20" stroke="#475569" stroke-width="3" />
      <!-- Brake Disc -->
      <circle cx="35" cy="35" r="16" fill="none" stroke="url(#metalGrad)" stroke-width="4" stroke-dasharray="6 3" />
    </g>

    <!-- Main Subject: Mechanic '师傅' (Shifu) -->
    <g transform="translate(15, 45)">
      <!-- Shadow beneath mechanic -->
      <ellipse cx="85" cy="130" rx="45" ry="10" fill="#020617" opacity="0.6" />

      <!-- Body / Blue Mechanic Uniform (Jumpsuit) -->
      <!-- Torso -->
      <path d="M55 75 L115 75 L125 125 L45 125 Z" fill="#0284c7" />
      <!-- Uniform Collar / Details -->
      <path d="M75 75 L85 95 L95 75" fill="#f8fafc" />
      <path d="M85 75 L85 125" stroke="#0369a1" stroke-width="2" />
      <!-- Pocket with wrench emblem / outline -->
      <rect x="95" y="85" width="14" height="16" rx="2" fill="#0369a1" />
      <!-- Yellow safety belt/strap -->
      <path d="M48 110 L122 110" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

      <!-- Head & Hair -->
      <!-- Ears -->
      <circle cx="68" cy="50" r="6" fill="#fcd34d" />
      <circle cx="102" cy="50" r="6" fill="#fcd34d" />
      <!-- Face Base -->
      <circle cx="85" cy="50" r="22" fill="#fef08a" />
      
      <!-- Friendly Confident Expression / Smiling Eyes -->
      <path d="M76 46 Q80 42 84 46" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
      <path d="M88 46 Q92 42 96 46" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
      <!-- Smiling Open Mouth -->
      <path d="M79 56 Q85 64 91 56" fill="#1e293b" />
      <!-- Rosy Cheeks -->
      <circle cx="74" cy="54" r="4" fill="#fb7185" opacity="0.5" />
      <circle cx="96" cy="54" r="4" fill="#fb7185" opacity="0.5" />

      <!-- Cap / Mechanic Hat (Blue with yellow brim) -->
      <path d="M63 38 Q85 22 107 38 L112 42 Q85 30 58 42 Z" fill="#0284c7" />
      <path d="M58 42 Q85 32 115 42 L110 46 Q85 38 60 46 Z" fill="#f59e0b" />

      <!-- Arms & Dynamic Actions -->
      <!-- Left Arm (Holding wrench aloft) -->
      <path d="M55 78 L32 60 L42 45 L62 65 Z" fill="#0284c7" />
      <!-- Left Hand -->
      <circle cx="36" cy="42" r="7" fill="#fcd34d" />

      <!-- Right Arm (Working on Scooter part) -->
      <path d="M115 78 L142 95 L135 110 L108 95 Z" fill="#0284c7" />
      <!-- Right Hand -->
      <circle cx="145" cy="100" r="7" fill="#fcd34d" />

      <!-- Legs (Kneeling/Working stance) -->
      <path d="M60 120 L50 150 L75 152 L80 120 Z" fill="#0369a1" />
      <path d="M100 120 L115 148 L95 152 L90 120 Z" fill="#0369a1" />
      <!-- Boots -->
      <path d="M45 150 L75 152 L75 160 L45 160 Z" fill="#334155" />
      <path d="M95 152 L120 150 L120 160 L95 160 Z" fill="#334155" />
    </g>

    <!-- Large Action Wrench in Hand (Symbol of 'Thợ / Sư phụ') -->
    <g transform="translate(15, 30)">
      <!-- Wrench Handle -->
      <path d="M30 45 L15 15" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" />
      <!-- Wrench Head -->
      <path d="M12 12 C8 8 5 12 8 16 C11 20 16 18 18 15 Z" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5" />
      <circle cx="10" cy="11" r="2" fill="#1e293b" />
    </g>

    <!-- Action Sparks & Highlights (Emphasizing professional craftsmanship / 'sửa xe rất tốt') -->
    <g filter="url(#glow)">
      <!-- Spark 1 -->
      <path d="M170 95 L173 103 L181 106 L173 109 L170 117 L167 109 L159 106 L167 103 Z" fill="#fbbf24" />
      <!-- Spark 2 -->
      <path d="M135 75 L137 80 L142 82 L137 84 L135 89 L133 84 L128 82 L133 80 Z" fill="#38bdf8" />
      <!-- Spark 3 (Tiny) -->
      <circle cx="155" cy="85" r="3" fill="#f59e0b" />
      <circle cx="185" cy="115" r="2" fill="#fb923c" />
    </g>

    <!-- Additional Foreground Workshop Props on Table -->
    <!-- Toolbox -->
    <g transform="translate(15, 140)">
      <rect x="0" y="10" width="35" height="25" rx="4" fill="#ef4444" />
      <path d="M5 10 L10 2 L25 2 L30 10 Z" fill="#b91c1c" />
      <!-- Metal Latch -->
      <rect x="15" y="18" width="5" height="4" rx="1" fill="#f8fafc" />
      <!-- Handle -->
      <path d="M12 2 Q17 -2 22 2" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Oil Bottle -->
    <g transform="translate(200, 135)">
      <path d="M5 25 L15 25 L18 10 L12 5 L8 5 L2 10 Z" fill="#10b981" />
      <rect x="6" y="2" width="4" height="4" fill="#047857" />
    </g>

    <!-- Vignette / Frame border -->
    <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
  </g>
</svg>