<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Glow Gradient for Excitement -->
    <radialGradient id="emotion-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Outfit Gradient (Energetic teal/blue) -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Letter Gradient (Good news envelope) -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Environment & Props (Cozy Room Interior) -->
  <g id="environment">
    <!-- Window / Light source in background -->
    <path d="M 160 30 L 210 40 L 210 110 L 160 100 Z" fill="#334155" opacity="0.4" />
    <path d="M 165 38 L 205 46 L 205 104 L 165 96 Z" fill="#64748b" opacity="0.2" />
    
    <!-- Floating emotional sparkles / confetti representing excitement -->
    <g id="sparkles" filter="url(#soft-shadow)">
      <!-- Golden star 1 -->
      <path d="M 45 60 L 48 68 L 56 71 L 48 74 L 45 82 L 42 74 L 34 71 L 42 68 Z" fill="#fbbf24" />
      <!-- Golden star 2 -->
      <path d="M 190 85 L 192 90 L 197 92 L 192 94 L 190 99 L 188 94 L 183 92 L 188 90 Z" fill="#f59e0b" />
      <!-- Pink accent circles -->
      <circle cx="65" cy="40" r="4" fill="#ec4899" opacity="0.8" />
      <circle cx="175" cy="140" r="5" fill="#38bdf8" opacity="0.8" />
      <circle cx="35" cy="130" r="3" fill="#10b981" opacity="0.9" />
      <!-- Dynamic burst lines -->
      <line x1="200" y1="50" x2="215" y2="40" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
      <line x1="30" y1="90" x2="18" y2="85" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
      <line x1="170" y1="60" x2="182" y2="48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Emotional Aura/Glow behind character -->
    <circle cx="120" cy="135" r="75" fill="url(#emotion-glow)" />
  </g>

  <!-- Main Character: Excited Person receiving good news -->
  <g id="character" filter="url(#soft-shadow)">
    
    <!-- Torso / Shoulders -->
    <path d="M 75 210 C 75 175 95 165 120 165 C 145 165 165 175 165 210 Z" fill="url(#shirt-grad)" />
    <!-- Collar details -->
    <path d="M 105 165 L 120 185 L 135 165 Z" fill="#e0f2fe" />
    <path d="M 95 168 Q 120 180 145 168" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

    <!-- Raised Arms showing extreme joy & dynamic motion -->
    <!-- Left Arm (bent up) -->
    <path d="M 78 175 C 60 150 45 120 55 105 C 60 98 72 102 70 115 C 68 128 85 155 92 170 Z" fill="url(#shirt-grad)" />
    <!-- Left Hand -->
    <circle cx="52" cy="100" r="10" fill="url(#skin-grad)" />

    <!-- Right Arm (raised high in victory) -->
    <path d="M 162 175 C 180 150 195 110 185 95 C 180 88 168 92 170 105 C 172 118 155 145 148 170 Z" fill="url(#shirt-grad)" />
    <!-- Right Hand holding the Good News Letter -->
    <circle cx="188" cy="90" r="10" fill="url(#skin-grad)" />

    <!-- Neck -->
    <path d="M 105 145 L 105 170 C 105 170 120 175 135 170 L 135 145 Z" fill="url(#skin-grad)" />

    <!-- Head & Face -->
    <g id="head">
      <!-- Hair Back / Volume -->
      <path d="M 85 95 C 75 80 85 50 120 45 C 155 50 165 80 155 95 C 160 110 155 130 140 140 C 120 145 100 140 95 130 C 85 120 82 105 85 95 Z" fill="url(#hair-grad)" />

      <!-- Face Base -->
      <ellipse cx="120" cy="100" rx="27" ry="32" fill="url(#skin-grad)" />

      <!-- Cheeks flushing with excitement (blush) -->
      <ellipse cx="100" cy="110" rx="6" ry="4" fill="#fb7185" opacity="0.6" />
      <ellipse cx="140" cy="110" rx="6" ry="4" fill="#fb7185" opacity="0.6" />

      <!-- Dynamic Open Mouth (Cheering/Shouting with Joy) -->
      <path d="M 110 112 Q 120 132 130 112 Z" fill="#991b1b" />
      <!-- Tongue -->
      <path d="M 114 118 Q 120 128 126 118 Z" fill="#f43f5e" />

      <!-- Expressive Eyes (Joyfully closed in tight arcs ^_^) -->
      <path d="M 98 94 Q 104 88 110 94" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 130 94 Q 136 88 142 94" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />

      <!-- Eyebrows raised high -->
      <path d="M 96 84 Q 104 80 112 85" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 128 85 Q 136 80 144 84" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

      <!-- Hair Bangs (Stylized anime-ish vector fringe) -->
      <path d="M 92 75 Q 105 90 118 78 Q 130 90 148 76 C 145 60 120 50 100 60 Z" fill="url(#hair-grad)" />
      <!-- Cute hair lock bouncing -->
      <path d="M 135 72 Q 150 78 145 92" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- The 'Good News' Letter / Envelope flying out of hand in excitement -->
    <g id="envelope" transform="translate(160, 45) rotate(25)" filter="url(#soft-shadow)">
      <!-- Envelope Body -->
      <rect x="0" y="0" width="36" height="26" rx="3" fill="url(#paper-grad)" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Envelope Flap (open/excited) -->
      <path d="M 0 0 L 18 14 L 36 0 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Letter paper inside peeking out -->
      <rect x="6" y="-6" width="24" height="10" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
      <!-- Abstract emotion lines on paper (representing good news text without letters) -->
      <line x1="10" y1="-3" x2="22" y2="-3" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
      <line x1="10" y1="0" x2="18" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Motion lines around the jumping/excited body -->
    <path d="M 65 190 Q 60 205 68 220" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M 175 190 Q 180 205 172 220" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Foreground Floor / Surface grounding the scene -->
  <path d="M 0 220 L 240 220 L 240 240 L 0 240 Z" fill="#0f172a" />
  <line x1="0" y1="220" x2="240" y2="220" stroke="#334155" stroke-width="2" />
  <!-- Drop shadow under character on floor -->
  <ellipse cx="120" cy="220" rx="35" ry="6" fill="#000000" opacity="0.4" />
</svg>