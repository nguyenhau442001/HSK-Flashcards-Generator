<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Coin Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldGradientSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Plant Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Ambient Glow for Multiplier Theme -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="120" cy="110" r="40" fill="#fbbf24" opacity="0.1" filter="url(#glow)"/>

  <!-- Wall shelf / background element -->
  <path d="M40 70 L200 70 L190 60 L50 60 Z" fill="#334155" opacity="0.5"/>
  <rect x="70" y="35" width="22" height="25" rx="4" fill="#38bdf8" opacity="0.3"/>
  <rect x="100" y="25" width="22" height="35" rx="4" fill="#10b981" opacity="0.3"/>
  <rect x="130" y="42" width="22" height="18" rx="4" fill="#f43f5e" opacity="0.3"/>

  <!-- Wooden Table Surface -->
  <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="url(#tableGrad)"/>
  <path d="M0 170 L240 170 L240 175 L0 175 Z" fill="#475569"/>

  <!-- ================= STACK 1: SINGLE REFERENCE (Left Stack) ================= -->
  <!-- Stack 1 Base Shadow -->
  <ellipse cx="65" cy="173" rx="22" ry="7" fill="#0f172a" opacity="0.6"/>
  <!-- Coin 1 (Bottom) -->
  <path d="M43 162 A22 7 0 0 0 87 162 L87 168 A22 7 0 0 1 43 168 Z" fill="url(#goldGradientSide)"/>
  <ellipse cx="65" cy="162" rx="22" ry="7" fill="url(#goldGradient)"/>
  <!-- Coin 2 (Top) -->
  <path d="M43 152 A22 7 0 0 0 87 152 L87 158 A22 7 0 0 1 43 158 Z" fill="url(#goldGradientSide)"/>
  <ellipse cx="65" cy="152" rx="22" ry="7" fill="url(#goldGradient)"/>
  <!-- Label 1: "1x" visual representation (Single Treasure Chest on Left) -->
  <rect x="48" y="125" width="34" height="24" rx="4" fill="#b45309"/>
  <path d="M48 131 L82 131 L82 135 L48 135 Z" fill="#78350f"/>
  <rect x="61" y="131" width="8" height="6" rx="2" fill="#fbbf24"/>
  <path d="M48 125 Q65 118 82 125 Z" fill="#78350f"/>


  <!-- ================= STACK 2: DOUBLE/MULTIPLIED (Right Stack - 倍 / x2) ================= -->
  <!-- Stack 2 Base Shadow -->
  <ellipse cx="175" cy="173" rx="25" ry="8" fill="#0f172a" opacity="0.7"/>
  
  <!-- Stack of 4 Coins (Double the height to visually represent "Gấp đôi / 倍") -->
  <!-- Coin 4 (Bottom) -->
  <path d="M150 162 A25 8 0 0 0 200 162 L200 169 A25 8 0 0 1 150 169 Z" fill="url(#goldGradientSide)"/>
  <ellipse cx="175" cy="162" rx="25" ry="8" fill="url(#goldGradient)"/>
  <!-- Coin 3 -->
  <path d="M150 152 A25 8 0 0 0 200 152 L200 159 A25 8 0 0 1 150 159 Z" fill="url(#goldGradientSide)"/>
  <ellipse cx="175" cy="152" rx="25" ry="8" fill="url(#goldGradient)"/>
  <!-- Coin 2 -->
  <path d="M150 142 A25 8 0 0 0 200 142 L200 149 A25 8 0 0 1 150 149 Z" fill="url(#goldGradientSide)"/>
  <ellipse cx="175" cy="142" rx="25" ry="8" fill="url(#goldGradient)"/>
  <!-- Coin 1 (Top) -->
  <path d="M150 132 A25 8 0 0 0 200 132 L200 139 A25 8 0 0 1 150 139 Z" fill="url(#goldGradientSide)"/>
  <ellipse cx="175" cy="132" rx="25" ry="8" fill="url(#goldGradient)"/>
  <ellipse cx="175" cy="132" rx="18" ry="5" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.6"/>

  <!-- Larger Treasure Chest on Right Stack -->
  <rect x="153" y="96" width="44" height="32" rx="6" fill="#d97706"/>
  <path d="M153 105 L197 105 L197 111 L153 111 Z" fill="#b45309"/>
  <rect x="169" y="104" width="12" height="9" rx="3" fill="#fef08a"/>
  <circle cx="175" cy="108" r="2" fill="#78350f"/>
  <path d="M153 96 Q175 85 197 96 Z" fill="#b45309"/>
  <path d="M165 96 L165 90 Q175 87 185 90 L185 96 Z" fill="#fef08a" opacity="0.4"/>


  <!-- ================= MULTIPLIER EFFECT / COMPARISON ELEMENTS ================= -->
  <!-- Magical upward scaling beam or multiplier arrow linking them -->
  <path d="M92 145 C 110 120, 130 120, 148 135" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" filter="url(#glow)"/>
  <polygon points="148,135 140,131 143,139" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Sparkles representing growth/multiplication -->
  <g transform="translate(120, 95)" filter="url(#glow)">
    <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(145, 75) scale(0.6)" filter="url(#glow)">
    <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(95, 80) scale(0.5)" filter="url(#glow)">
    <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" fill="#10b981"/>
  </g>


  <!-- ================= FOREGROUND PROPS (Contextual Environment) ================= -->
  <!-- Potted Plant on the Left side of table -->
  <ellipse cx="28" cy="173" rx="12" ry="4" fill="#0f172a" opacity="0.5"/>
  <path d="M18 156 L38 156 L35 170 L21 170 Z" fill="url(#potGrad)"/>
  <ellipse cx="28" cy="156" rx="10" ry="3" fill="#fb7185"/>
  <!-- Plant Leaves -->
  <path d="M28 153 C28 140, 15 130, 12 120 C18 130, 26 135, 28 153 Z" fill="#10b981"/>
  <path d="M28 153 C28 135, 42 125, 45 115 C40 128, 30 135, 28 153 Z" fill="#34d399"/>
  <path d="M28 153 C25 142, 22 135, 20 125 C26 132, 27 140, 28 153 Z" fill="#059669"/>

  <!-- Magnifying Glass / Analysis Tool leaning on the right -->
  <g transform="translate(205, 130) rotate(25)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#e2e8f0" stroke-width="4" opacity="0.9"/>
    <circle cx="0" cy="0" r="12" fill="#38bdf8" opacity="0.2"/>
    <rect x="-3" y="12" width="6" height="22" rx="3" fill="#cbd5e1"/>
  </g>

  <!-- Cute floating magical multiplier indicator (Abstract representation of scaling up, NO TEXT) -->
  <g transform="translate(120, 50)" filter="url(#glow)">
    <!-- Upward rising bar chart or growth icon to signify doubling/tripling -->
    <rect x="-22" y="2" width="10" height="12" rx="3" fill="#64748b" opacity="0.6"/>
    <rect x="-8" y="-4" width="10" height="18" rx="3" fill="#38bdf8"/>
    <rect x="6" y="-12" width="10" height="26" rx="3" fill="#fbbf24"/>
    <!-- Arrow swooping over growth -->
    <path d="M -18 6 C -10 -2, 0 -12, 11 -8" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <polygon points="11,-12 15,-5 8,-6" fill="#f43f5e"/>
  </g>

</svg>