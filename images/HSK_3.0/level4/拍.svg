<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light / Flash Gradient -->
    <radialGradient id="amberGlow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Photo Card Drop Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- UI Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <circle cx="150" cy="80" r="100" fill="url(#amberGlow)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Window frame showing night cityscape/nature silhouette -->
  <path d="M 25 35 L 85 35 L 85 185 L 25 185 Z" fill="#090d16" opacity="0.6"/>
  <!-- City skyline silhouettes outside window -->
  <path d="M 32 185 L 32 135 L 42 135 L 42 185 L 50 185 L 50 115 L 60 115 L 60 185 L 70 185 L 70 145 L 80 145 L 80 185 Z" fill="#1e293b" opacity="0.8"/>
  <circle cx="72" cy="100" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="38" cy="120" r="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Indoor Studio / Room details -->
  <!-- Plant in corner -->
  <path d="M 215 185 C 215 165 225 155 225 135 C 225 155 235 165 235 185 Z" fill="#10b981" opacity="0.8"/>
  <path d="M 210 185 C 210 170 200 160 195 145 C 205 160 215 170 220 185 Z" fill="#059669" opacity="0.9"/>
  <path d="M 220 185 L 225 210 C 225 212 223 214 220 214 C 217 214 215 212 215 210 L 220 185 Z" fill="#b45309"/>

  <!-- FLOATING PHOTOS (Representing "many photos" - 拍了很多照片) -->
  <!-- Photo 1 (Back left, tilted) -->
  <g transform="translate(35, 75) rotate(-14)" filter="url(#cardShadow)">
    <rect width="45" height="52" rx="3" fill="#f8fafc"/>
    <rect x="4" y="4" width="37" height="34" rx="2" fill="#38bdf8"/>
    <circle cx="14" cy="14" r="5" fill="#fef08a"/>
    <path d="M 4 30 L 14 20 L 24 30 L 34 18 L 41 27 L 41 38 L 4 38 Z" fill="#047857" opacity="0.9"/>
  </g>

  <!-- Photo 2 (Top center, tilted right) -->
  <g transform="translate(145, 30) rotate(18)" filter="url(#cardShadow)">
    <rect width="42" height="48" rx="3" fill="#f8fafc"/>
    <rect x="4" y="4" width="34" height="30" rx="2" fill="#f43f5e"/>
    <circle cx="28" cy="12" r="4" fill="#fed7aa"/>
    <path d="M 4 28 C 12 22 22 24 38 20 L 38 34 L 4 34 Z" fill="#be123c" opacity="0.8"/>
  </g>

  <!-- Photo 3 (Mid right, tilted) -->
  <g transform="translate(180, 95) rotate(-8)" filter="url(#cardShadow)">
    <rect width="48" height="55" rx="3" fill="#f8fafc"/>
    <rect x="4" y="4" width="40" height="38" rx="2" fill="#fbbf24"/>
    <path d="M 4 32 Q 20 18 30 28 T 44 26 L 44 42 L 4 42 Z" fill="#d97706"/>
    <circle cx="36" cy="14" r="5" fill="#fef08a"/>
  </g>


  <!-- MAIN CHARACTER (Photographer holding camera) -->
  <g id="photographer">
    <!-- Body / Torso (Stylish teal hoodie/jacket) -->
    <path d="M 100 170 C 100 150 110 135 125 135 C 140 135 150 150 150 170 L 160 215 L 90 215 Z" fill="#0ea5e9"/>
    <!-- Hoodie Strings & Details -->
    <path d="M 120 145 L 122 165" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M 130 145 L 128 165" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M 108 135 C 115 130 135 130 142 135 C 145 142 125 145 108 135 Z" fill="#0284c7"/>

    <!-- Neck -->
    <path d="M 116 126 L 134 126 L 134 138 L 116 138 Z" fill="#ffedd5"/>

    <!-- Head & Face -->
    <circle cx="125" cy="105" r="22" fill="#ffedd5"/>
    
    <!-- Hair (Trendy messy dark hair) -->
    <path d="M 103 105 C 102 90 110 82 125 82 C 142 82 148 92 147 106 C 144 100 140 87 125 87 C 110 87 105 100 103 105 Z" fill="#334155"/>
    <path d="M 104 103 C 102 108 105 115 110 118 C 106 112 103 106 104 103 Z" fill="#334155"/>
    <path d="M 142 98 C 148 102 149 110 147 115 C 148 108 147 102 142 98 Z" fill="#334155"/>

    <!-- Glasses (Smart, friendly look) -->
    <circle cx="117" cy="106" r="6" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="133" cy="106" r="6" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="123" y1="106" x2="127" y2="106" stroke="#334155" stroke-width="2"/>

    <!-- Smiling Expression -->
    <path d="M 121 117 C 123 119 127 119 129 117" stroke="#9a3412" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="113" cy="113" r="3" fill="#fca5a5" opacity="0.6"/>
    <circle cx="137" cy="113" r="3" fill="#fca5a5" opacity="0.6"/>

    <!-- Arms & Hands holding Camera -->
    <!-- Left Arm -->
    <path d="M 105 145 C 95 155 90 170 95 185" fill="none" stroke="#0ea5e9" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Right Arm (Raised holding camera shutter) -->
    <path d="M 145 145 C 158 150 162 165 158 180" fill="none" stroke="#0ea5e9" stroke-width="16" stroke-linecap="round"/>

    <!-- Professional Camera in Hands -->
    <g transform="translate(108, 155)">
      <!-- Camera Body -->
      <rect x="0" y="10" width="36" height="26" rx="6" fill="#475569"/>
      <!-- Camera Top Grip / Flash Housing -->
      <path d="M 8 10 L 12 4 L 24 4 L 28 10 Z" fill="#334155"/>
      <!-- Shutter Button -->
      <rect x="25" y="2" width="5" height="3" rx="1" fill="#f59e0b"/>
      <!-- Lens Mount & Big Glass Lens -->
      <circle cx="18" cy="23" r="10" fill="#1e293b"/>
      <circle cx="18" cy="23" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="16" cy="21" r="2.5" fill="#ffffff" opacity="0.8"/>
      <!-- Camera Strap -->
      <path d="M -2 15 C -15 25 -5 40 -20 45" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Hands gripping camera -->
    <circle cx="106" cy="175" r="5" fill="#ffedd5"/>
    <circle cx="140" cy="175" r="5" fill="#ffedd5"/>
  </g>

  <!-- FOREGROUND / INTERACTION ELEMENTS -->
  <!-- Floating Sparkles / Shutter Action indicators -->
  <g transform="translate(150, 130)" filter="url(#glow)">
    <path d="M 0 0 L 8 -8 M 0 -8 L 8 0" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(90, 130)" filter="url(#glow)">
    <path d="M 0 0 L 6 -6 M 0 -6 L 6 0" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="168" cy="120" r="3" fill="#fef08a"/>
  <circle cx="85" cy="145" r="2" fill="#38bdf8"/>

  <!-- Modern UI Pill / Photo Gallery Counter Indicator at Bottom -->
  <g transform="translate(85, 205)" filter="url(#cardShadow)">
    <rect width="70" height="22" rx="11" fill="#0f172a" opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    <!-- Mini Gallery Icon -->
    <rect x="10" y="7" width="10" height="8" rx="1.5" fill="#38bdf8"/>
    <circle cx="13" cy="10" r="1.5" fill="#ffffff"/>
    <!-- Stack dots -->
    <circle cx="28" cy="11" r="2" fill="#f59e0b"/>
    <circle cx="36" cy="11" r="2" fill="#f59e0b"/>
    <circle cx="44" cy="11" r="2" fill="#f59e0b"/>
    <circle cx="52" cy="11" r="2" fill="#94a3b8"/>
  </g>

</svg>