<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Podium/Stage -->
  <path d="M40 180 L200 180 L180 210 L60 210 Z" fill="#334155"/>
  <path d="M60 210 L180 210 L185 220 L55 220 Z" fill="#1e293b"/>
  
  <!-- Spotlight Beam -->
  <path d="M120 0 L180 240 L60 240 Z" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Main Subject: The "First" Runner/Speaker at the starting line -->
  <!-- Legs -->
  <path d="M100 180 L100 130" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M140 180 L140 130" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Body -->
  <circle cx="120" cy="110" r="25" fill="#f8fafc"/>
  <path d="M105 130 L135 130 L130 160 L110 160 Z" fill="#38bdf8"/>
  
  <!-- Arm pointing forward -->
  <path d="M120 110 L160 90" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
  <circle cx="165" cy="88" r="6" fill="#f8fafc"/>
  
  <!-- Starting Line Marker (The "First" indicator) -->
  <rect x="50" y="180" width="140" height="5" fill="#10b981"/>
  <circle cx="50" cy="182" r="8" fill="#10b981"/>
  <circle cx="190" cy="182" r="8" fill="#10b981"/>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="50" r="4" fill="#fbbf24"/>
  <circle cx="40" cy="60" r="3" fill="#ec4899"/>
  <path d="M180 120 L190 110 L200 120" stroke="#fb923c" stroke-width="3" fill="none"/>
</svg>