<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Water Gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Bridge Wood/Stone Gradient -->
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Lantern Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Night Sky & Stars -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="40" cy="35" r="1.5"/>
    <circle cx="90" cy="20" r="1"/>
    <circle cx="160" cy="30" r="2"/>
    <circle cx="205" cy="50" r="1"/>
    <circle cx="25" cy="70" r="1"/>
  </g>

  <!-- Distant Mountains / Hills -->
  <path d="M0 120 Q50 95 100 110 T240 100 L240 160 L0 160 Z" fill="#334155" opacity="0.5"/>
  <path d="M0 130 Q70 110 140 125 T240 115 L240 160 L0 160 Z" fill="#1e293b"/>

  <!-- River / Water Area -->
  <path d="M0 150 Q60 140 120 150 T240 145 L240 210 L0 210 Z" fill="url(#waterGrad)"/>
  
  <!-- Water Ripples -->
  <path d="M30 165 Q45 162 60 165" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M140 175 Q160 172 180 175" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M80 190 Q100 187 120 190" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Riverbanks (Foreground/Background Grass & Rocks) -->
  <path d="M0 145 Q50 140 90 150 L80 240 L0 240 Z" fill="#065f46"/>
  <path d="M170 145 Q210 140 240 150 L240 240 L160 240 Z" fill="#065f46"/>
  
  <!-- Reed Details -->
  <path d="M15 150 L12 125" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 152 L21 130" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M225 152 L228 128" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

  <!-- THE BRIDGE (Cây cầu) - Elegant Arch Bridge -->
  <!-- Bridge Shadow in Water -->
  <path d="M35 155 Q120 185 205 155 Q120 175 35 155 Z" fill="#0c4a6e" opacity="0.5"/>

  <!-- Bridge Piers / Foundation -->
  <path d="M45 160 L55 150 L65 160 Z" fill="#b45309"/>
  <path d="M175 160 L185 150 L195 160 Z" fill="#b45309"/>

  <!-- Main Arch Structure -->
  <path d="M25 155 Q120 110 215 155 L215 165 Q120 120 25 165 Z" fill="url(#bridgeGrad)" stroke="#78350f" stroke-width="2"/>
  
  <!-- Bridge Deck / Top surface -->
  <path d="M20 152 Q120 105 220 152 L220 156 Q120 109 20 156 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>

  <!-- Bridge Stone/Wood Segments -->
  <line x1="60" y1="135" x2="60" y2="159" stroke="#b45309" stroke-width="2" opacity="0.5"/>
  <line x1="90" y1="126" x2="90" y2="153" stroke="#b45309" stroke-width="2" opacity="0.5"/>
  <line x1="120" y1="123" x2="120" y2="152" stroke="#b45309" stroke-width="2" opacity="0.5"/>
  <line x1="150" y1="126" x2="150" y2="153" stroke="#b45309" stroke-width="2" opacity="0.5"/>
  <line x1="180" y1="135" x2="180" y2="159" stroke="#b45309" stroke-width="2" opacity="0.5"/>

  <!-- Bridge Railings (Posts and Rails) -->
  <!-- Back Rail -->
  <path d="M22 147 Q120 100 218 147" stroke="#d97706" stroke-width="3" fill="none"/>
  <!-- Rail Posts -->
  <line x1="35" y1="150" x2="35" y2="140" stroke="#b45309" stroke-width="3"/>
  <line x1="65" y1="141" x2="65" y2="131" stroke="#b45309" stroke-width="3"/>
  <line x1="95" y1="134" x2="95" y2="124" stroke="#b45309" stroke-width="3"/>
  <line x1="120" y1="132" x2="120" y2="122" stroke="#b45309" stroke-width="3"/>
  <line x1="145" y1="134" x2="145" y2="124" stroke="#b45309" stroke-width="3"/>
  <line x1="175" y1="141" x2="175" y2="131" stroke="#b45309" stroke-width="3"/>
  <line x1="205" y1="150" x2="205" y2="140" stroke="#b45309" stroke-width="3"/>

  <!-- Front Rail / Overlay -->
  <path d="M20 152 Q120 105 220 152" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Ambient / Lantern Decor on Bridge -->
  <circle cx="120" cy="115" r="18" fill="url(#glow)"/>
  <path d="M116 103 L124 103 L126 115 L114 115 Z" fill="#f97316"/>
  <path d="M120 101 L120 103" stroke="#b45309" stroke-width="2"/>
  <rect x="117" y="115" width="6" height="4" rx="1" fill="#b45309"/>

  <!-- Action Character Crossing the Bridge (Friendly Adventure Context) -->
  <g transform="translate(135, 115)">
    <!-- Character Shadow -->
    <ellipse cx="0" cy="19" rx="6" ry="2" fill="#0f172a" opacity="0.4"/>
    
    <!-- Backpack -->
    <rect x="-6" y="5" rx="2" width="6" height="9" fill="#ec4899"/>
    
    <!-- Body / Outfit -->
    <path d="M-4 6 L4 6 L5 16 L-5 16 Z" fill="#38bdf8"/>
    
    <!-- Head -->
    <circle cx="0" cy="1" r="5" fill="#fde68a"/>
    
    <!-- Hair / Hat -->
    <path d="M-5 0 Q0 -7 5 0 Z" fill="#fb923c"/>

    <!-- Arms in motion -->
    <path d="M-4 8 L-8 12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M4 8 L8 6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Legs in motion -->
    <path d="M-2 16 L-5 22" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M2 16 L4 21" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Cherry Blossom / Willow Tree Branch overlay for depth -->
  <path d="M0 0 Q40 30 50 80" stroke="#334155" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M30 20 Q50 40 70 30" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Pink Blossoms -->
  <circle cx="45" cy="45" r="4" fill="#f472b6"/>
  <circle cx="55" cy="35" r="5" fill="#fb7185"/>
  <circle cx="35" cy="30" r="3" fill="#f472b6"/>
  <circle cx="65" cy="48" r="4.5" fill="#fb7185"/>
  <circle cx="25" cy="55" r="3.5" fill="#f472b6"/>

  <!-- Frame/Border stroke -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>