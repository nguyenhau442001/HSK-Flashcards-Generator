<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Tiger Fur Gradients -->
    <linearGradient id="tigerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="tigerBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Jungle Environment Gradients -->
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="deepLeaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Ambient Glow -->
  <circle cx="120" cy="120" r="90" fill="url(#amberGlow)" />

  <!-- Background Jungle Layer (Deep Leaves & Bamboo) -->
  <g opacity="0.6">
    <!-- Back Bamboo Stalks -->
    <rect x="35" y="40" width="6" height="150" rx="3" fill="#065f46" />
    <rect x="200" y="50" width="8" height="140" rx="4" fill="#065f46" />
    <!-- Back Leaves -->
    <path d="M 38 60 Q 15 50 10 30 Q 30 35 38 50 Z" fill="url(#deepLeaf)" />
    <path d="M 38 100 Q 10 90 5 70 Q 25 75 38 90 Z" fill="url(#deepLeaf)" />
    <path d="M 204 80 Q 225 70 235 50 Q 215 55 204 70 Z" fill="url(#deepLeaf)" />
    <path d="M 204 140 Q 230 130 238 110 Q 218 115 204 130 Z" fill="url(#deepLeaf)" />
  </g>

  <!-- Foreground Environment: Jungle Floor & Rocks -->
  <path d="M 0 210 Q 60 195 120 205 T 240 200 L 240 240 L 0 240 Z" fill="#0f172a" />
  
  <!-- Mossy Rock Structure (Habitat Context) -->
  <path d="M 20 220 C 20 195, 40 185, 70 190 C 95 165, 135 170, 155 195 C 185 190, 210 205, 220 220 Z" fill="url(#rockGrad)" filter="url(#softShadow)" />
  <!-- Moss patches on rock -->
  <path d="M 65 192 C 75 188, 85 190, 90 198 C 75 200, 68 198, 65 192 Z" fill="#10b981" opacity="0.8" />
  <path d="M 145 198 C 155 193, 165 196, 170 203 C 155 206, 148 204, 145 198 Z" fill="#10b981" opacity="0.8" />

  <!-- MAIN SUBJECT: Lǎohǔ (Tiger) in action pose -->
  <g filter="url(#softShadow)">
    <!-- Tiger Shadow on Ground -->
    <ellipse cx="125" cy="208" rx="55" ry="8" fill="#020617" opacity="0.6" />

    <!-- Tiger Body -->
    <!-- Tail (dynamic curved stripe) -->
    <path d="M 75 160 Q 50 150 45 125 Q 42 110 55 115 Q 65 120 70 140" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round" />
    <!-- Tail Stripes -->
    <path d="M 50 140 Q 45 133 48 128" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <path d="M 60 128 Q 57 122 62 118" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Back Legs -->
    <path d="M 70 140 C 65 170 75 195 95 195 C 105 195 110 185 105 165" fill="url(#tigerBody)" />
    <!-- Back Paw Stripes -->
    <path d="M 78 170 L 88 175" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <path d="M 83 183 L 93 186" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Main Torso -->
    <path d="M 80 120 C 70 140, 95 175, 135 165 C 165 155, 175 130, 160 110 C 145 95, 95 95, 80 120 Z" fill="url(#tigerBody)" />

    <!-- Belly (Light Cream) -->
    <path d="M 90 130 C 85 145, 110 165, 135 155 C 145 150, 150 135, 145 125 C 125 125, 105 125, 90 130 Z" fill="url(#tigerBelly)" />

    <!-- Body Stripes -->
    <path d="M 95 110 L 105 135" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <path d="M 115 105 L 122 135" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 135 107 L 140 132" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 152 115 L 155 135" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

    <!-- Front Legs (Action stance - stepping forward) -->
    <!-- Front Right Leg -->
    <path d="M 140 145 C 145 170 155 195 175 195 C 185 195 188 185 180 165 C 175 150 165 135 155 130" fill="url(#tigerBody)" />
    <path d="M 155 170 L 168 173" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <path d="M 163 183 L 175 185" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Front Left Leg (slightly bent/raised) -->
    <path d="M 115 145 C 115 165 120 180 135 185 C 145 188 150 175 145 160 C 140 145, 130 135, 125 130" fill="url(#tigerBody)" />
    <path d="M 125 168 L 135 175" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Tiger Head & Face -->
    <!-- Head Base -->
    <path d="M 145 95 C 135 75, 165 60, 185 75 C 205 90, 205 115, 185 125 C 165 135, 150 115, 145 95 Z" fill="url(#tigerBody)" />

    <!-- Ears -->
    <path d="M 155 68 L 145 45 L 168 55 Z" fill="url(#tigerBody)" />
    <path d="M 153 62 L 148 50 L 162 56 Z" fill="#fde68a" />
    <path d="M 185 68 L 195 48 L 178 54 Z" fill="url(#tigerBody)" />
    <path d="M 183 63 L 190 53 L 178 56 Z" fill="#fde68a" />

    <!-- White Muzzle Area -->
    <path d="M 170 100 C 170 90, 195 90, 200 105 C 205 120, 185 130, 175 120 C 170 115, 168 108, 170 100 Z" fill="#fef3c7" />

    <!-- Nose & Mouth -->
    <polygon points="192,108 198,108 195,113" fill="#1e293b" />
    <path d="M 195 113 Q 195 120 190 122" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 195 113 Q 195 120 200 122" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Expressive Eyes -->
    <ellipse cx="185" cy="88" rx="5" ry="7" fill="#1e293b" />
    <circle cx="183" cy="86" r="2" fill="#ffffff" />
    <ellipse cx="170" cy="92" rx="4" ry="6" fill="#1e293b" />
    <circle cx="168" cy="90" r="1.5" fill="#ffffff" />

    <!-- Whiskers -->
    <path d="M 200 112 L 218 108" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M 201 117 L 220 118" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M 175 115 L 160 115" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M 176 120 L 162 124" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

    <!-- Head Stripes & Wang (王) Symbol Stylized -->
    <path d="M 172 70 Q 178 78 185 70" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <path d="M 162 76 L 168 82" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <path d="M 195 78 L 189 82" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <path d="M 158 90 L 166 92" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Foreground Jungle Foliage (Framing & Depth) -->
  <!-- Hanging tropical leaves top-left -->
  <path d="M 0 0 Q 30 20 60 0 Q 40 40 0 30 Z" fill="url(#leafGrad)" />
  <path d="M 30 0 Q 60 30 90 10 Q 70 50 30 40 Z" fill="url(#deepLeaf)" />

  <!-- Foreground tropical plants bottom-right -->
  <path d="M 200 240 Q 180 190 240 180 L 240 240 Z" fill="url(#leafGrad)" />
  <path d="M 220 240 Q 210 205 240 200 L 240 240 Z" fill="#047857" />

  <!-- Foreground tropical plants bottom-left -->
  <path d="M 0 240 Q 20 200 60 210 Q 40 230 0 240 Z" fill="url(#leafGrad)" />
  <path d="M 0 220 Q 30 180 50 190 Q 20 210 0 220 Z" fill="#047857" />

  <!-- Glowing Fireflies / Sparkles for magical HSK app atmosphere -->
  <circle cx="95" cy="80" r="2.5" fill="#fde68a" opacity="0.9" filter="url(#softShadow)" />
  <circle cx="125" cy="65" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="215" cy="140" r="3" fill="#fde68a" opacity="0.9" filter="url(#softShadow)" />
  <circle cx="70" cy="170" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="150" cy="50" r="1.5" fill="#ffffff" opacity="0.9" />

  <!-- Interactive/Action Energy Accents (Amber/Orange Dynamic Streaks) -->
  <path d="M 100 185 Q 115 190 130 185" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 160 190 Q 170 195 185 188" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>