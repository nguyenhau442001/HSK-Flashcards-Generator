<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Amber Glow for Environment -->
    <radialGradient id="lamp-glow" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Hat Gradient (The Hero Prop: 帽子) -->
    <linearGradient id="hat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="hat-trim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Jacket Gradient -->
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  
  <!-- Environment Lighting & Ambient Glow -->
  <circle cx="160" cy="50" r="120" fill="url(#lamp-glow)"/>

  <!-- Interior Wall & Shelf Background Details -->
  <g opacity="0.4">
    <!-- Window Frame in Background -->
    <rect x="25" y="35" width="50" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <line x1="50" y1="35" x2="50" y2="105" stroke="#475569" stroke-width="2"/>
    <line x1="25" y1="70" x2="75" y2="70" stroke="#475569" stroke-width="2"/>
    <!-- Window View (Night Sky + Stars) -->
    <circle cx="38" cy="50" r="1.5" fill="#f8fafc"/>
    <circle cx="62" cy="58" r="1" fill="#f8fafc"/>
    <circle cx="45" cy="85" r="1.5" fill="#f8fafc"/>

    <!-- Wall Shelf -->
    <rect x="140" y="65" width="75" height="6" rx="2" fill="#475569"/>
    <!-- Plant on Shelf -->
    <path d="M155 65 Q 155 45 165 40 Q 175 45 175 65 Z" fill="#10b981"/>
    <path d="M165 65 L 165 55" stroke="#047857" stroke-width="2"/>
    <!-- Small Photo Frame -->
    <rect x="185" y="38" width="22" height="27" rx="2" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="196" cy="48" r="5" fill="#fbbf24"/>
    <path d="M189 60 Q 196 53 203 60 Z" fill="#10b981"/>
  </g>

  <!-- Floor/Desk Surface -->
  <path d="M0 200 L 240 200 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="3"/>

  <!-- Character Group: "他" (The man wearing the hat) -->
  <g transform="translate(10, 15)" filter="url(#shadow)">
    
    <!-- Chair Back -->
    <path d="M45 105 Q 45 75 75 75 Q 105 75 105 105 L 100 185 L 50 185 Z" fill="#334155"/>

    <!-- Character Body / Torso -->
    <!-- Jacket -->
    <path d="M75 110 L 125 110 L 140 185 L 60 185 Z" fill="url(#jacket-grad)"/>
    <!-- Collar & Shirt Inside -->
    <path d="M90 110 L 110 110 L 100 135 Z" fill="#f8fafc"/>
    <path d="M95 125 L 105 125 L 100 160 Z" fill="#cbd5e1"/>

    <!-- Arms & Hands (Relaxed/Content pose) -->
    <!-- Left Arm -->
    <path d="M65 115 Q 45 130 50 155" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>
    <circle cx="50" cy="160" r="7" fill="url(#skin-grad)"/>

    <!-- Right Arm -->
    <path d="M135 115 Q 155 130 145 155" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>
    <circle cx="142" cy="160" r="7" fill="url(#skin-grad)"/>

    <!-- Neck -->
    <rect x="90" y="95" width="20" height="20" rx="6" fill="url(#skin-grad)"/>

    <!-- Head & Face -->
    <circle cx="100" cy="80" r="26" fill="url(#skin-grad)"/>
    
    <!-- Friendly Facial Expression -->
    <!-- Eyes (Happy closed arcs or content dots) -->
    <path d="M88 75 Q 92 71 96 75" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M104 75 Q 108 71 112 75" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cheeks (Blush) -->
    <circle cx="87" cy="82" r="4" fill="#ec4899" opacity="0.4"/>
    <circle cx="113" cy="82" r="4" fill="#ec4899" opacity="0.4"/>
    <!-- Smile -->
    <path d="M94 87 Q 100 93 106 87" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Hair Tuft -->
    <path d="M85 62 Q 95 55 102 63" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

    <!-- THE HERO PROP: 帽子 (The Hat clearly worn on his head) -->
    <g transform="translate(100, 68)">
      <!-- Hat Crown -->
      <path d="M-22 0 Q -20 -22 0 -22 Q 20 -22 22 0 Z" fill="url(#hat-grad)" filter="url(#shadow)"/>
      <!-- Hat Brim/Visor -->
      <path d="M-26 0 Q 0 6 30 1 Q 25 -3 0 -1 Q -20 -3 -26 0 Z" fill="url(#hat-trim)"/>
      <!-- Hat Accent Stripe -->
      <path d="M-20 -2 Q 0 2 20 -2" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <!-- Top Button -->
      <circle cx="0" cy="-22" r="3" fill="#fb923c"/>
    </g>

  </g>

  <!-- Foreground Props for Rich Context (Desk & Coffee Mug) -->
  <g transform="translate(15, 175)" filter="url(#shadow)">
    <!-- Wooden Table Surface -->
    <rect x="0" y="15" width="210" height="15" rx="4" fill="#b45309"/>
    <rect x="0" y="25" width="210" height="25" fill="#92400e"/>
    <path d="M 10 15 L 20 40" stroke="#78350f" stroke-width="3" opacity="0.5"/>
    <path d="M 180 15 L 170 40" stroke="#78350f" stroke-width="3" opacity="0.5"/>

    <!-- Hot Coffee Mug -->
    <g transform="translate(160, -10)">
      <!-- Steam -->
      <path d="M 10 -5 Q 5 -15 15 -25 Q 20 -30 10 -40" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <!-- Mug Body -->
      <rect x="0" y="0" width="22" height="25" rx="3" fill="#f43f5e"/>
      <!-- Mug Handle -->
      <path d="M 22 5 Q 32 5 32 12 Q 32 20 22 20" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Coffee Surface -->
      <ellipse cx="11" cy="3" rx="9" ry="3" fill="#78350f"/>
    </g>

    <!-- Open Book / Notebook -->
    <g transform="translate(30, 5)">
      <path d="M 0 10 Q 25 0 50 10 L 50 30 Q 25 20 0 30 Z" fill="#f8fafc"/>
      <path d="M 50 10 Q 75 0 100 10 L 100 30 Q 75 20 50 30 Z" fill="#f1f5f9"/>
      <line x1="50" y1="10" x2="50" y2="30" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Dummy text lines -->
      <line x1="10" y1="14" x2="35" y2="12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="19" x2="32" y2="17" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="65" y1="14" x2="90" y2="16" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="62" y1="19" x2="88" y2="21" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

</svg>