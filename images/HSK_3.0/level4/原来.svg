<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background elements - Library/Study -->
  <rect x="30" y="80" width="180" height="120" rx="8" fill="#334155"/>
  <rect x="40" y="90" width="160" height="100" rx="4" fill="#1e293b"/>
  
  <!-- The "Realization" Moment: A person looking behind a bookshelf/curtain -->
  <!-- Shelf -->
  <rect x="140" y="60" width="60" height="140" fill="#475569"/>
  
  <!-- Person (Surprised) -->
  <g transform="translate(60, 100)">
    <circle cx="40" cy="40" r="25" fill="#fde68a"/>
    <path d="M30 35 Q35 30 40 35 T50 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="32" cy="35" r="3" fill="#0f172a"/>
    <circle cx="48" cy="35" r="3" fill="#0f172a"/>
    <path d="M35 50 Q40 55 45 50" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="20" y="70" width="40" height="60" rx="5" fill="#38bdf8"/>
  </g>

  <!-- The "Discovery" (The object they didn't expect to see) -->
  <g transform="translate(150, 120)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24"/>
    <path d="M10 20 L30 20 M20 10 L20 30" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric Light -->
  <circle cx="170" cy="140" r="40" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Decorative elements -->
  <path d="M20 200 L220 200" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
</svg>