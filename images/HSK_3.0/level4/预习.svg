<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="150" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="165" width="10" height="60" fill="#475569"/>
  <rect x="190" y="165" width="10" height="60" fill="#475569"/>
  
  <!-- Lamp -->
  <path d="M170 150 L185 80 L205 80 L190 150 Z" fill="#fbbf24" opacity="0.8"/>
  <circle cx="195" cy="80" r="15" fill="#f59e0b"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M20 140 Q60 140 100 140 L110 70 L10 70 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="40" r="30" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M35 35 Q60 10 85 35 Q60 20 35 35" fill="#475569"/>
    <!-- Eyes -->
    <circle cx="50" cy="40" r="3" fill="#0f172a"/>
    <circle cx="70" cy="40" r="3" fill="#0f172a"/>
    <!-- Arms -->
    <path d="M20 80 L5 120" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <path d="M100 80 L115 120" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Book -->
  <path d="M70 130 L170 130 L160 150 L60 150 Z" fill="#ec4899"/>
  <path d="M75 135 L165 135" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M75 140 L165 140" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Coffee Mug -->
  <circle cx="45" cy="135" r="10" fill="#10b981"/>
  <path d="M55 130 Q60 130 60 140" stroke="#10b981" stroke-width="4" fill="none"/>
  
  <!-- Floating highlight sparks -->
  <circle cx="150" cy="60" r="2" fill="#fb923c"/>
  <circle cx="160" cy="50" r="3" fill="#fb923c"/>
</svg>