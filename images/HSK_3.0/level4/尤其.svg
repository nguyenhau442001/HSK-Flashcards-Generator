<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Pool Water Surface -->
  <path d="M0 160 Q 60 140, 120 160 T 240 160 L 240 240 L 0 240 Z" fill="#0ea5e9" opacity="0.6"/>
  <path d="M0 170 Q 60 150, 120 170 T 240 170 L 240 240 L 0 240 Z" fill="#0284c7" opacity="0.8"/>
  
  <!-- Swimmer (The focus) -->
  <g transform="translate(120, 190)">
    <circle cx="0" cy="-20" r="12" fill="#fbbf24"/>
    <path d="M-15 0 L 15 0 L 10 20 L -10 20 Z" fill="#f472b6"/>
    <path d="M-20 -5 L -40 -15 M 20 -5 L 40 -15" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Background Sports Equipment (The context) -->
  <g transform="translate(40, 80)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="8 8"/>
    <circle cx="0" cy="0" r="15" fill="#fb923c"/>
  </g>
  
  <g transform="translate(200, 70)">
    <rect x="-10" y="-30" width="20" height="60" rx="5" fill="#10b981"/>
    <circle cx="0" cy="-40" r="8" fill="#10b981"/>
  </g>
  
  <!-- Decorative bubbles -->
  <circle cx="180" cy="190" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="190" cy="210" r="6" fill="#ffffff" opacity="0.2"/>
  <circle cx="50" cy="200" r="3" fill="#ffffff" opacity="0.4"/>
</svg>