<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Path Gradient (The Process Curve) -->
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- UI Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Grid/Dots for Engineering Context -->
  <g fill="#475569" opacity="0.3">
    <circle cx="30" cy="30" r="1.5"/>
    <circle cx="60" cy="30" r="1.5"/>
    <circle cx="90" cy="30" r="1.5"/>
    <circle cx="120" cy="30" r="1.5"/>
    <circle cx="150" cy="30" r="1.5"/>
    <circle cx="180" cy="30" r="1.5"/>
    <circle cx="210" cy="30" r="1.5"/>
    
    <circle cx="30" cy="60" r="1.5"/>
    <circle cx="60" cy="60" r="1.5"/>
    <circle cx="90" cy="60" r="1.5"/>
    <circle cx="120" cy="60" r="1.5"/>
    <circle cx="150" cy="60" r="1.5"/>
    <circle cx="180" cy="60" r="1.5"/>
    <circle cx="210" cy="60" r="1.5"/>

    <circle cx="30" cy="210" r="1.5"/>
    <circle cx="60" cy="210" r="1.5"/>
    <circle cx="90" cy="210" r="1.5"/>
    <circle cx="120" cy="210" r="1.5"/>
    <circle cx="150" cy="210" r="1.5"/>
    <circle cx="180" cy="210" r="1.5"/>
    <circle cx="210" cy="210" r="1.5"/>
  </g>

  <!-- Ambient Glow Background Elements -->
  <circle cx="180" cy="60" r="40" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="60" cy="180" r="50" fill="#ec4899" opacity="0.08" filter="url(#glow)"/>

  <!-- Main Holographic Display Base/Surface -->
  <path d="M 40,200 L 80,180 L 190,180 L 210,205 L 30,205 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="120" cy="192" rx="85" ry="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Central Action: The Process (Connecting Steps into a dynamic journey) -->
  <g>
    <!-- Background Track Line -->
    <path d="M 45,175 C 60,175 70,120 100,110 C 130,100 150,150 185,85 C 200,60 195,50 200,45" 
          fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

    <!-- Foreground Gradient Flow Line -->
    <path d="M 45,175 C 60,175 70,120 100,110 C 130,100 150,150 185,85 C 200,60 195,50 200,45" 
          fill="none" stroke="url(#pathGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="0"/>

    <!-- STEP 1: Idea / Seed (Bottom Left) -->
    <g transform="translate(45, 175)">
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
      <!-- Icon: Lightbulb/Idea -->
      <path d="M-3,3 C-3,1 -1,-1 0,-3 C1,-1 3,1 3,3 C3,4 2,5 1,5 L-1,5 C-2,5 -3,4 -3,3 Z" fill="#38bdf8"/>
      <rect x="-2" y="6" width="4" height="2" fill="#94a3b8"/>
    </g>

    <!-- STEP 2: Development / Gears (Middle) -->
    <g transform="translate(100, 110)">
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="3"/>
      <!-- Icon: Tiny Gear -->
      <path d="M0,-6 L1,-4 L3,-5 L4,-3 L3,-1 L5,0 L5,2 L3,3 L4,5 L3,7 L1,6 L0,8 L-1,8 L-3,6 L-4,7 L-3,5 L-4,3 L-3,2 L-5,0 L-5,-1 L-3,-3 L-4,-5 L-3,-5 L-1,-4 Z" fill="#818cf8" transform="scale(0.9)"/>
      <circle cx="0" cy="0" r="2" fill="#1e293b"/>
    </g>

    <!-- STEP 3: Progress / Scaling (Center-Right) -->
    <g transform="translate(155, 125)">
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
      <!-- Icon: Rising Bar Chart -->
      <rect x="-5" y="2" width="3" height="4" fill="#fbbf24" rx="0.5"/>
      <rect x="-1" y="-1" width="3" height="7" fill="#fbbf24" rx="0.5"/>
      <rect x="3" y="-5" width="3" height="11" fill="#fbbf24" rx="0.5"/>
    </g>

    <!-- STEP 4: Success / Target (Top Right) -->
    <g transform="translate(200, 45)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#ec4899" stroke-width="3" filter="url(#glow)"/>
      <!-- Icon: Star / Trophy -->
      <path d="M0,-8 L2,-3 L7,-3 L3,0 L5,5 L0,2 L-5,5 L-3,0 L-7,-3 L-2,-3 Z" fill="#ec4899"/>
    </g>

    <!-- Animated Data Particles floating along the process -->
    <circle cx="75" cy="140" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="125" cy="115" r="2" fill="#818cf8"/>
    <circle cx="175" cy="95" r="3.5" fill="#fb923c" filter="url(#glow)"/>
    <circle cx="190" cy="65" r="2" fill="#ec4899"/>
  </g>

  <!-- Foreground UI Floating Diagnostic Panel (Adding authentic environment depth) -->
  <g transform="translate(25, 40)">
    <rect x="0" y="0" width="65" height="45" rx="6" fill="url(#panelGrad)" stroke="#475569" stroke-width="1"/>
    <!-- Mock UI Elements Inside Panel -->
    <circle cx="10" cy="12" r="4" fill="#38bdf8"/>
    <rect x="20" y="10" width="35" height="4" rx="2" fill="#64748b"/>
    <rect x="10" y="22" width="45" height="3" rx="1.5" fill="#334155"/>
    
    <!-- Mini Progress Bar inside UI -->
    <rect x="10" y="32" width="45" height="4" rx="2" fill="#1e293b"/>
    <rect x="10" y="32" width="28" height="4" rx="2" fill="url(#pathGrad)"/>
  </g>

  <!-- Floating Construction / Creative Elements (Pencil / Tool) -->
  <g transform="translate(130, 45) rotate(25)">
    <!-- Stylus/Pencil body -->
    <path d="M-15,-3 L10,-3 L15,0 L10,3 L-15,3 Z" fill="#fbbf24"/>
    <path d="M10,-3 L15,0 L10,3 Z" fill="#f59e0b"/>
    <path d="M-15,-3 L-20,0 L-15,3 Z" fill="#64748b"/>
    <rect x="-10" y="-3" width="5" height="6" fill="#3b82f6"/>
  </g>

  <!-- Accent Sparkles -->
  <path d="M 45,95 L 47,100 L 52,102 L 47,104 L 45,109 L 43,104 L 38,102 L 43,100 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 170,170 L 171.5,173.5 L 175,175 L 171.5,176.5 L 170,180 L 168.5,176.5 L 165,175 L 168.5,173.5 Z" fill="#fbbf24" opacity="0.7"/>

  <!-- Additional Atmospheric Glow Overlay -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.1"/>
</svg>