<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Wooden Table Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#334155" opacity="0.3"/>
  
  <!-- Keyring and Keys -->
  <g transform="translate(120, 120) rotate(15)">
    <!-- Keyring -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#94a3b8" stroke-width="6"/>
    
    <!-- Main Key -->
    <g transform="translate(20, -10)">
      <path d="M0 0 L40 0 L40 15 L30 15 L30 25 L20 25 L20 15 L10 15 Z" fill="#fbbf24"/>
      <circle cx="-10" cy="0" r="10" fill="none" stroke="#fbbf24" stroke-width="6"/>
    </g>
    
    <!-- Secondary Key -->
    <g transform="translate(-40, 20) rotate(-45)">
      <path d="M0 0 L30 0 L30 10 L25 10 L25 20 L15 20 L15 10 L5 10 Z" fill="#f59e0b"/>
      <circle cx="-8" cy="0" r="8" fill="none" stroke="#f59e0b" stroke-width="5"/>
    </g>
  </g>

  <!-- Atmospheric Details -->
  <circle cx="180" cy="60" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="60" cy="180" r="6" fill="#10b981" opacity="0.4"/>
  <path d="M190 190 L210 170" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 50 L50 70" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Depth Shadow -->
  <ellipse cx="120" cy="190" rx="60" ry="10" fill="#000" opacity="0.2"/>
</svg>