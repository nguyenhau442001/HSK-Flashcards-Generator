<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
<stop offset="0%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#1e293b"/>
</linearGradient>
</defs>
<rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

<g transform="translate(40, 60)">
<!-- Table -->
<rect x="0" y="100" width="160" height="15" rx="2" fill="#475569"/>
<rect x="20" y="115" width="10" height="40" fill="#334155"/>
<rect x="130" y="115" width="10" height="40" fill="#334155"/>

<!-- Person 1 (Listening) -->
<circle cx="40" cy="60" r="25" fill="#f59e0b"/>
<path d="M25 85 Q40 100 55 85" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="32" cy="55" r="3" fill="#0f172a"/>
<circle cx="48" cy="55" r="3" fill="#0f172a"/>

<!-- Person 2 (Speaking/Sharing) -->
<circle cx="120" cy="60" r="25" fill="#38bdf8"/>
<path d="M105 85 Q120 100 135 85" stroke="#0ea5e9" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="112" cy="55" r="3" fill="#0f172a"/>
<circle cx="128" cy="55" r="3" fill="#0f172a"/>

<!-- Interaction Element: Golden Glow of Mutual Understanding -->
<circle cx="80" cy="40" r="15" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
<path d="M75 35 L85 45 M85 35 L75 45" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

<!-- Decorative elements for atmosphere -->
<circle cx="180" cy="30" r="4" fill="#ec4899"/>
<circle cx="20" cy="20" r="3" fill="#10b981"/>
<path d="M190 100 L210 100" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
</g>
</svg>