<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="puzzle-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="puzzle-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="gear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient light circles in background -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.05" filter="blur(20px)"/>
  <circle cx="140" cy="100" r="40" fill="#fbbf24" opacity="0.08" filter="blur(15px)"/>

  <!-- Workshop environment surface (Isometric/Perspective workbench) -->
  <path d="M 20 180 L 120 150 L 220 180 L 220 200 L 120 230 L 20 200 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M 20 180 L 120 150 L 220 180 L 120 210 Z" fill="url(#table-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Background workshop props (Blueprint & tools) -->
  <!-- Blueprint paper lying flat -->
  <path d="M 40 140 L 90 125 L 110 145 L 60 160 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="145" x2="75" y2="138" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  <line x1="55" y1="150" x2="80" y2="143" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Floating particles / energy sparks representing "fit / match" -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="85" cy="70" r="2"/>
    <circle cx="165" cy="85" r="1.5"/>
    <circle cx="150" cy="55" r="2.5"/>
    <circle cx="75" cy="115" r="1.5"/>
  </g>

  <!-- ACTION SCENE: Mechanical Puzzle / Fitting Concept -->
  <!-- We show a complex mechanical gear slot and a matching puzzle piece clicking together perfectly -->

  <!-- Fixed base block with a shaped cavity (The Context/Environment) -->
  <g transform="translate(120, 105)">
    <!-- Base plate -->
    <rect x="-60" y="-35" width="120" height="70" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    
    <!-- Cavity (star/hexagon inset) -->
    <path d="M 0 -18 L 14 -8 L 9 10 L -9 10 L -14 -8 Z" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

    <!-- Decorative circuit lines on base -->
    <path d="M -45 -20 L -25 -20 L -18 -8" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 45 20 L 25 20 L 15 10" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-45" cy="-20" r="2.5" fill="#334155"/>
    <circle cx="45" cy="20" r="2.5" fill="#334155"/>
  </g>

  <!-- Floating / Descending Matching Piece (The "Fit") -->
  <!-- Glowing aura behind the fitting piece -->
  <circle cx="120" cy="85" r="30" fill="#fbbf24" opacity="0.2" filter="url(#glow-gold)"/>

  <!-- The matching golden star-gear element dropping perfectly into place -->
  <g transform="translate(120, 80)">
    <!-- Drop shadow for depth -->
    <path d="M 0 -16 L 13 -6 L 8 12 L -8 12 L -13 -6 Z" fill="#000000" opacity="0.4" transform="translate(0, 8) scale(0.9)"/>

    <!-- Main golden puzzle/gear piece -->
    <path d="M 0 -18 L 14 -8 L 9 10 L -9 10 L -14 -8 Z" fill="url(#puzzle-gold)" stroke="#fef08a" stroke-width="1.5"/>
    
    <!-- Inner mechanical detail of the fitting piece -->
    <circle cx="0" cy="0" r="4" fill="#0f172a"/>
    <circle cx="0" cy="0" r="1.5" fill="#fef08a"/>
    
    <!-- Motion lines indicating "snapping" or "fitting" action -->
    <path d="M -22 -15 L -16 -10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M 22 -15 L 16 -10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Secondary contrasting fitting element on the side (Gear mesh context) -->
  <g transform="translate(65, 115)">
    <circle cx="0" cy="0" r="16" fill="url(#gear-grad)" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#0f172a"/>
    <!-- Gear teeth representation -->
    <rect x="-2.5" y="-19" width="5" height="4" rx="1" fill="url(#gear-grad)"/>
    <rect x="-2.5" y="15" width="5" height="4" rx="1" fill="url(#gear-grad)"/>
    <rect x="-19" y="-2.5" width="4" height="5" rx="1" fill="url(#gear-grad)"/>
    <rect x="15" y="-2.5" width="4" height="5" rx="1" fill="url(#gear-grad)"/>
  </g>

  <!-- Third matching element (Blue puzzle piece sliding in from right) -->
  <g transform="translate(175, 110) rotate(25)">
    <path d="M 0 -14 L 11 -5 L 7 9 L -7 9 L -11 -5 Z" fill="url(#puzzle-blue)" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#0f172a"/>
  </g>

  <!-- Success Sparkles / Connection Flares -->
  <g transform="translate(120, 85)" filter="url(#glow-gold)">
    <path d="M 0 -25 L 3 -15 L 13 -12 L 3 -9 L 0 1 L -3 -9 L -13 -12 L -3 -15 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <g transform="translate(95, 70) scale(0.5)">
    <path d="M 0 -25 L 3 -15 L 13 -12 L 3 -9 L 0 1 L -3 -9 L -13 -12 L -3 -15 Z" fill="#fbbf24" opacity="0.8"/>
  </g>

  <g transform="translate(148, 75) scale(0.6)">
    <path d="M 0 -25 L 3 -15 L 13 -12 L 3 -9 L 0 1 L -3 -9 L -13 -12 L -3 -15 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground Atmospheric Elements (Depth of field blur dots) -->
  <circle cx="45" cy="50" r="3" fill="#38bdf8" opacity="0.3" filter="blur(1px)"/>
  <circle cx="195" cy="140" r="4" fill="#fbbf24" opacity="0.3" filter="blur(1px)"/>
  <circle cx="35" cy="160" r="2" fill="#34d399" opacity="0.4"/>
</svg>