<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Passport Cover Gradient -->
    <linearGradient id="passportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Glowing Accent Gradient (千萬 emphasis) -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Shadow Filter for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment: Wooden Table Surface with Perspective Lines -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#090d16" opacity="0.6"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="0" y1="210" x2="240" y2="210" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ambient background props: Boarding pass / Travel ticket -->
  <g transform="translate(35, 140) rotate(-12)" filter="url(#dropShadow)">
    <rect width="90" height="50" rx="6" fill="#f1f5f9"/>
    <rect x="8" y="8" width="20" height="20" rx="4" fill="#cbd5e1"/>
    <line x1="36" y1="12" x2="75" y2="12" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="22" x2="60" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="75" cy="35" r="6" fill="#38bdf8"/>
  </g>

  <!-- Glowing "Attention/千萬" Energy Aura behind Passport -->
  <circle cx="120" cy="115" r="55" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="120" cy="115" r="65" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>

  <!-- MAIN SUBJECT: The Passport (Context for "Nhất định không được quên") -->
  <g transform="translate(120, 115) rotate(-6)" filter="url(#dropShadow)">
    
    <!-- Passport Back Shadow/Thickness -->
    <rect x="-42" y="-57" width="84" height="114" rx="10" fill="#991b1b"/>
    
    <!-- Passport Main Cover -->
    <rect x="-45" y="-60" width="84" height="114" rx="10" fill="url(#passportGrad)"/>
    
    <!-- Gold Foil Border Frame -->
    <rect x="-40" y="-55" width="74" height="104" rx="7" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>

    <!-- Gold Foil Globe / Crest Emblem -->
    <circle cx="3" cy="-12" r="18" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.9"/>
    <!-- Latitude/Longitude arcs inside crest -->
    <path d="M-15 -12 Q 3 -25 21 -12" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>
    <path d="M-15 -12 Q 3 1 21 -12" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>
    <line x1="3" y1="-30" x2="3" y2="6" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>

    <!-- Gold Foil Biometric Symbol (Camera Icon) -->
    <g transform="translate(3, 22) scale(0.7)">
      <circle cx="0" cy="0" r="9" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
      <path d="M-12 -6 L-14 -6 L-14 6 L-12 6" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 -6 L14 -6 L14 6 L12 6" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Elegant Stylized Passport Title Lines (Abstract, no text) -->
    <line x1="-25" y1="-42" x2="31" y2="-42" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="-18" y1="-34" x2="24" y2="-34" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  </g>

  <!-- ACTION / EMPHASIS ELEMENTS: Exclamation/Attention Sparkles & Reminder Pin -->
  <!-- Dynamic Exclamation Mark Floating (representing "千萬 / Nhất định") -->
  <g transform="translate(190, 65)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="18" fill="#f59e0b" opacity="0.2"/>
    <circle cx="0" cy="0" r="14" fill="#fbbf24"/>
    <!-- Stylized Exclamation Shape -->
    <path d="M0 -7 C 2 -7 2 -2 1 3 L 1 5 C 1 6 0 7 0 7 C 0 7 -1 6 -1 5 L -1 3 C -2 -2 -2 -7 0 -7 Z" fill="#0f172a"/>
    <circle cx="0" cy="10" r="1.5" fill="#0f172a"/>
  </g>

  <!-- Glowing Reminder Sparkles / Action Dots -->
  <g fill="#38bdf8" filter="url(#softGlow)">
    <circle cx="50" cy="70" r="3"/>
    <circle cx="175" cy="140" r="4"/>
    <circle cx="80" cy="40" r="2"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="50" cy="70" r="1.5"/>
    <circle cx="175" cy="140" r="2"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M160 45 L163 52 L170 55 L163 58 L160 65 L157 58 L150 55 L157 52 Z" fill="#fbbf24" opacity="0.9" transform="scale(0.8) translate(50, -10)"/>
  <path d="M70 120 L72 125 L77 127 L72 129 L70 134 L68 129 L63 127 L68 125 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Cute Check-Badge / Reminder Ribbon at bottom corner (Visual cue for "Must remember") -->
  <g transform="translate(185, 175)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="18" fill="#10b981"/>
    <!-- Checkmark -->
    <path d="M-6 -1 L-2 4 L7 -5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>