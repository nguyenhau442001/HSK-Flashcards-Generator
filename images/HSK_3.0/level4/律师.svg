<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wood Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Glow for Gavel/Highlights -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Scale Metallic Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements: Bookshelf & Window -->
  <g opacity="0.4">
    <!-- Window Frame -->
    <rect x="160" y="20" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <line x1="190" y1="20" x2="190" y2="100" stroke="#334155" stroke-width="2" />
    <line x1="160" y1="60" x2="220" y2="60" stroke="#334155" stroke-width="2" />
    
    <!-- Light Beam from Window -->
    <polygon points="160,20 220,60 140,165 90,165" fill="url(#light-beam)" />

    <!-- Bookshelf in Background -->
    <rect x="20" y="30" width="50" height="90" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <line x1="20" y1="60" x2="70" y2="60" stroke="#334155" stroke-width="1.5" />
    <line x1="20" y1="90" x2="70" y2="90" stroke="#334155" stroke-width="1.5" />
    <!-- Mini Books -->
    <rect x="25" y="42" width="8" height="18" rx="1" fill="#f43f5e" />
    <rect x="35" y="40" width="6" height="20" rx="1" fill="#38bdf8" />
    <rect x="43" y="45" width="10" height="15" rx="1" fill="#fbbf24" />
    <rect x="26" y="70" width="12" height="20" rx="1" fill="#10b981" />
    <rect x="40" y="72" width="7" height="18" rx="1" fill="#a855f7" />
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 0 165 L 240 165 L 240 240 L 0 240 Z" fill="url(#desk-grad)" />
  <line x1="0" y1="165" x2="240" y2="165" stroke="#475569" stroke-width="3" />

  <!-- The Lawyer Character (Professional, confident, friendly 2D style) -->
  <g id="lawyer-character">
    <!-- Suit Body & Shoulders -->
    <path d="M 85 210 L 95 145 L 145 145 L 155 210 Z" fill="#0f172a" />
    
    <!-- Crisp White Shirt Collar & Red Tie -->
    <polygon points="110,145 130,145 120,175" fill="#f8fafc" />
    <polygon points="116,155 124,155 122,195 118,195" fill="#ef4444" />
    <path d="M 95 145 L 110 170 L 120 145 L 130 170 L 145 145 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

    <!-- Neck -->
    <rect x="112" y="130" width="16" height="20" rx="4" fill="#fcd34d" />

    <!-- Head & Face -->
    <circle cx="120" cy="110" r="22" fill="#fcd34d" />

    <!-- Hair (Neat Professional Cut, Dark Slate) -->
    <path d="M 98 105 C 98 90, 110 86, 120 86 C 132 86, 142 92, 142 108 C 142 112, 140 115, 140 115 C 140 115, 137 100, 130 96 C 122 92, 110 94, 104 100 C 100 104, 98 105, 98 105 Z" fill="#1e293b" />

    <!-- Friendly Expressive Eyes -->
    <circle cx="112" cy="108" r="2.5" fill="#0f172a" />
    <circle cx="128" cy="108" r="2.5" fill="#0f172a" />
    <!-- Smiling Mouth -->
    <path d="M 116 118 Q 120 123 124 118" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Confident Hand Gesturing / Holding Briefcase or Document -->
    <!-- Left Arm -->
    <path d="M 95 155 Q 80 175 90 195" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
    <circle cx="90" cy="195" r="6" fill="#fcd34d" />
  </g>

  <!-- Foreground Props: Law Book, Scales of Justice, and Gavel -->
  
  <!-- Stack of Legal Documents / Law Books (Left Foreground) -->
  <g transform="translate(30, 150)">
    <!-- Book Base -->
    <rect x="0" y="20" width="45" height="10" rx="2" fill="#3b82f6" />
    <rect x="2" y="22" width="41" height="6" fill="#1d4ed8" />
    <!-- Top Book (Gold Accents) -->
    <rect x="-5" y="10" width="50" height="12" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <rect x="0" y="13" width="40" height="2" fill="url(#gold-grad)" />
    <!-- Standing Briefcase -->
    <rect x="10" y="-10" width="30" height="22" rx="4" fill="#78350f" />
    <rect x="12" y="-8" width="26" height="18" rx="2" fill="#92400e" />
    <!-- Handle -->
    <path d="M 20 -10 C 20 -16, 30 -16, 30 -10" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
    <!-- Gold Clasp -->
    <rect x="22" y="-1" width="6" height="4" rx="1" fill="url(#gold-grad)" />
  </g>

  <!-- The Scales of Justice (Right Foreground on Desk) -->
  <g transform="translate(170, 115)">
    <!-- Base -->
    <ellipse cx="20" cy="50" rx="16" ry="6" fill="url(#gold-grad)" />
    <!-- Pillar -->
    <rect x="18" y="10" width="4" height="40" fill="url(#metal-grad)" />
    <!-- Top Finial -->
    <circle cx="20" cy="10" r="5" fill="url(#gold-grad)" />
    <!-- Crossbar -->
    <line x1="2" y1="15" x2="38" y2="15" stroke="url(#metal-grad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Left Pan -->
    <line x1="2" y1="15" x2="6" y2="35" stroke="url(#metal-grad)" stroke-width="1.5" />
    <line x1="2" y1="15" x2="14" y2="35" stroke="url(#metal-grad)" stroke-width="1.5" />
    <path d="M 4 35 Q 10 42 16 35 Z" fill="url(#metal-grad)" />

    <!-- Right Pan (Tilted slightly for dynamism) -->
    <line x1="38" y1="15" x2="28" y2="32" stroke="url(#metal-grad)" stroke-width="1.5" />
    <line x1="38" y1="15" x2="36" y2="32" stroke="url(#metal-grad)" stroke-width="1.5" />
    <path d="M 26 32 Q 32 39 38 32 Z" fill="url(#metal-grad)" />
  </g>

  <!-- Wooden Gavel (Center Foreground) -->
  <g transform="translate(105, 175) rotate(-15)">
    <!-- Sound Block -->
    <ellipse cx="0" cy="20" rx="14" ry="6" fill="#78350f" stroke="#92400e" stroke-width="1" />
    
    <!-- Gavel Handle -->
    <rect x="-3" y="-18" width="6" height="32" rx="3" fill="#b45309" />
    <!-- Gavel Head -->
    <rect x="-16" y="-24" width="32" height="12" rx="4" fill="#92400e" />
    <!-- Gold Ring Accents on Gavel -->
    <rect x="-14" y="-22" width="4" height="8" fill="url(#gold-grad)" />
    <rect x="10" y="-22" width="4" height="8" fill="url(#gold-grad)" />
  </g>

  <!-- Dynamic Action/Sparkle Accents representing authority & justice -->
  <g fill="url(#gold-grad)">
    <!-- Star sparkle near scales -->
    <path d="M 215 105 L 217 112 L 224 114 L 217 116 L 215 123 L 213 116 L 206 114 L 213 112 Z" opacity="0.9" />
    <!-- Star sparkle near gavel -->
    <path d="M 95 160 L 96 164 L 100 165 L 96 166 L 95 170 L 94 166 L 90 165 L 94 164 Z" opacity="0.8" />
  </g>
</svg>