<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for individual focus -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradients (Blue/Tech) -->
    <linearGradient id="char1-suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Gradients (Green/Nature) -->
    <linearGradient id="char2-suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Character 3 Gradients (Pink/Creative) -->
    <linearGradient id="char3-suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting / Ground plane -->
  <ellipse cx="120" cy="205" rx="100" ry="20" fill="#0b0f19" opacity="0.8"/>
  <circle cx="120" cy="130" r="90" fill="url(#amber-glow)"/>

  <!-- Background Environment: Shared Idea Workspace/Table -->
  <path d="M 20 185 L 220 185 L 205 210 L 35 210 Z" fill="#334155" opacity="0.5"/>
  <path d="M 30 185 L 210 185" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Background Props: "Different thoughts/bubbles" rising softly to show individuality -->
  <g opacity="0.6">
    <!-- Thought bubble 1 (Left) -->
    <circle cx="55" cy="70" r="14" fill="#38bdf8" opacity="0.2"/>
    <path d="M 55 64 L 55 76 M 49 70 L 61 70" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="45" cy="88" r="5" fill="#38bdf8" opacity="0.2"/>
    <circle cx="40" cy="98" r="2.5" fill="#38bdf8" opacity="0.2"/>

    <!-- Thought bubble 2 (Center) -->
    <circle cx="120" cy="50" r="16" fill="#fbbf24" opacity="0.25"/>
    <path d="M 112 50 L 128 50" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="120" cy="72" r="6" fill="#fbbf24" opacity="0.25"/>
    <circle cx="120" cy="85" r="3" fill="#fbbf24" opacity="0.25"/>

    <!-- Thought bubble 3 (Right) -->
    <circle cx="185" cy="70" r="14" fill="#f472b6" opacity="0.2"/>
    <circle cx="185" cy="70" r="6" fill="#f472b6" opacity="0.4"/>
    <circle cx="195" cy="88" r="5" fill="#f472b6" opacity="0.2"/>
    <circle cx="200" cy="98" r="2.5" fill="#f472b6" opacity="0.2"/>
  </g>

  <!-- ================= PERSON 1 (LEFT - ANALYTICAL/BLUE) ================= -->
  <g filter="url(#shadow)" transform="translate(-25, 10)">
    <!-- Body & Shoulders -->
    <path d="M 55 185 C 55 160 75 150 95 150 C 115 150 135 160 135 185 Z" fill="url(#char1-suit)"/>
    <!-- Collar / Details -->
    <path d="M 82 150 L 95 165 L 108 150" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Neck -->
    <rect x="87" y="132" width="16" height="22" rx="6" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="95" cy="115" r="20" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 75 115 C 75 95 115 95 115 115 C 115 120 110 120 108 115 C 102 105 88 105 82 115 C 80 120 75 120 75 115 Z" fill="#0f172a"/>

    <!-- Expressive Face (Thoughtful / Focused) -->
    <!-- Glasses -->
    <rect x="83" y="107" width="11" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="96" y="107" width="11" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="94" y1="111" x2="96" y2="111" stroke="#0f172a" stroke-width="2"/>
    <!-- Smile -->
    <path d="M 91 124 Q 95 127 99 124" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Distinct Prop: Holding a unique glowing blueprint/idea tablet -->
    <rect x="95" y="145" width="22" height="16" rx="3" transform="rotate(-15 95 145)" fill="#38bdf8" filter="url(#glow-effect)" opacity="0.8"/>
    <rect x="95" y="145" width="22" height="16" rx="3" transform="rotate(-15 95 145)" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5"/>
    <path d="M 100 152 L 110 155" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================= PERSON 3 (RIGHT - CREATIVE/PINK) ================= -->
  <g filter="url(#shadow)" transform="translate(25, 15)">
    <!-- Body & Shoulders -->
    <path d="M 105 180 C 105 155 125 145 145 145 C 165 145 185 155 185 180 Z" fill="url(#char3-suit)"/>
    <!-- Collar / Details -->
    <path d="M 132 145 L 145 160 L 158 145" fill="none" stroke="#fce7f3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="137" y="127" width="16" height="20" rx="6" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="145" cy="110" r="20" fill="#fbcfe8"/>
    <!-- Hair (Bun style) -->
    <circle cx="145" cy="87" r="9" fill="#475569"/>
    <path d="M 125 112 C 125 92 165 92 165 112 C 165 117 160 115 155 112 C 145 105 135 105 135 112 C 130 115 125 117 125 112 Z" fill="#475569"/>

    <!-- Expressive Face (Inspired / Joyful) -->
    <!-- Eyes (Happy Arcs) -->
    <path d="M 137 107 Q 140 103 143 107" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 147 107 Q 150 103 153 107" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Confident Smile -->
    <path d="M 140 118 Q 145 123 150 118" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Distinct Prop: Holding a creative paintbrush/pen -->
    <path d="M 155 140 L 175 120" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M 173 118 L 178 123" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ================= PERSON 2 (CENTER - FOREGROUND/GREEN) ================= -->
  <g filter="url(#shadow)" transform="translate(0, 0)">
    <!-- Body & Shoulders -->
    <path d="M 80 195 C 80 165 100 155 120 155 C 140 155 160 165 160 195 Z" fill="url(#char2-suit)"/>
    <!-- Collar / Details -->
    <path d="M 107 155 L 120 170 L 133 155" fill="none" stroke="#d1fae5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="112" y="137" width="16" height="22" rx="6" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="120" cy="120" r="22" fill="#fbcfe8"/>
    <!-- Hair (Spiky/Energetic) -->
    <path d="M 98 120 C 98 95 142 95 142 120 C 142 125 138 125 135 120 C 130 110 110 110 105 120 C 102 125 98 125 98 120 Z" fill="#1e293b"/>
    <path d="M 112 98 L 120 90 L 128 98 Z" fill="#1e293b"/>

    <!-- Expressive Face (Active / Engaging) -->
    <!-- Eyes -->
    <circle cx="112" cy="118" r="2.5" fill="#0f172a"/>
    <circle cx="128" cy="118" r="2.5" fill="#0f172a"/>
    <!-- Open enthusiastic smile -->
    <path d="M 114 128 Q 120 135 126 128 Z" fill="#0f172a"/>

    <!-- Distinct Prop: Holding a glowing personal gear/heart/star representing individual passion -->
    <circle cx="120" cy="155" r="14" fill="#34d399" filter="url(#glow-effect)" opacity="0.6"/>
    <circle cx="120" cy="155" r="10" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
    <path d="M 120 148 L 122 153 L 127 155 L 122 157 L 120 162 L 118 157 L 113 155 L 118 153 Z" fill="#ffffff"/>
  </g>

  <!-- Foreground Atmospheric Particles (Highlighting "Each one is distinct") -->
  <circle cx="70" cy="165" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="170" cy="175" r="3.5" fill="#f472b6" opacity="0.8"/>
  <circle cx="120" cy="85" r="4" fill="#34d399" opacity="0.8"/>
  <circle cx="95" cy="55" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="145" cy="65" r="2.5" fill="#38bdf8" opacity="0.9"/>

  <!-- Dynamic Accent Frame / Vignette -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
</svg>