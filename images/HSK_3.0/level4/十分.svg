<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Golden Glow for "Ten / 100%" Concept -->
    <radialGradient id="goldenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Gauge Gradients -->
    <linearGradient id="gaugeActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="giftBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Details -->
  <!-- Subtle back room shelf / ambient lines -->
  <path d="M30 190 L210 190" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 130 L190 130" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Ambient golden radial aura representing 'maximum / completely' (十分) -->
  <circle cx="120" cy="110" r="90" fill="url(#goldenGlow)"/>

  <!-- Glowing particles / Sparkles floating (denoting high intensity / great appreciation) -->
  <g fill="#fbbf24">
    <path d="M 70 60 Q 75 60 75 55 Q 75 60 80 60 Q 75 60 75 65 Q 75 60 70 60 Z" opacity="0.8"/>
    <path d="M 170 70 Q 174 70 174 66 Q 174 70 178 70 Q 174 70 174 74 Q 174 70 170 70 Z" opacity="0.6"/>
    <path d="M 50 110 Q 53 110 53 107 Q 53 110 56 110 Q 53 110 53 113 Q 53 110 50 110 Z" opacity="0.5"/>
    <path d="M 190 120 Q 193 120 193 117 Q 193 120 196 120 Q 193 120 193 123 Q 193 120 190 120 Z" opacity="0.9"/>
  </g>

  <!-- SCENE: Person expressing deep gratitude / "Ten parts / Completely" (十分感谢) -->
  <!-- Table Surface -->
  <path d="M20 190 L220 190 L205 210 L35 210 Z" fill="#334155"/>
  <path d="M35 210 L205 210 L200 215 L40 215 Z" fill="#1e293b"/>

  <!-- Gift Box representing help received / appreciation context -->
  <g transform="translate(145, 150)">
    <!-- Box base -->
    <rect x="0" y="15" width="35" height="25" rx="3" fill="url(#giftBox)"/>
    <!-- Ribbon vertical -->
    <rect x="15" y="15" width="5" height="25" fill="#fef08a"/>
    <!-- Box lid -->
    <rect x="-2" y="10" width="39" height="7" rx="2" fill="#db2777"/>
    <!-- Ribbon horizontal -->
    <rect x="-2" y="12" width="39" height="3" fill="#fef08a"/>
    <!-- Bow -->
    <path d="M12 10 C 8 5, 2 8, 8 10 C 4 8, 2 12, 10 10 Z" fill="#fef08a"/>
    <path d="M23 10 C 27 5, 33 8, 27 10 C 31 8, 33 12, 25 10 Z" fill="#fef08a"/>
  </g>

  <!-- Character Bowing / Expressing Extreme Gratitude -->
  <g transform="translate(70, 105)">
    <!-- Body / Torso (Bowing forward at ~45 degree angle) -->
    <g transform="rotate(-30 25 50)">
      <!-- Torso -->
      <rect x="10" y="30" width="30" height="35" rx="8" fill="url(#shirtGrad)"/>
      
      <!-- Arms outstretched forward holding a gift or hands together -->
      <path d="M 25 35 Q 45 35 55 45" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
      <circle cx="57" cy="47" r="5" fill="#fbcfe8"/> <!-- Hands -->
      
      <!-- Head / Hair -->
      <circle cx="20" cy="18" r="13" fill="#fbcfe8"/>
      <!-- Hair styling -->
      <path d="M 8 15 C 8 8, 18 5, 28 10 C 25 8, 15 8, 10 16 Z" fill="#0f172a"/>
      
      <!-- Happy closed eyes (bowing, expressing sincerity) -->
      <path d="M 14 18 Q 17 21 20 18" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Rosy cheeks -->
      <circle cx="16" cy="22" r="3" fill="#fda4af" opacity="0.8"/>
    </g>

    <!-- Legs planted -->
    <rect x="35" y="70" width="8" height="20" rx="3" fill="#334155"/>
    <rect x="50" y="70" width="8" height="20" rx="3" fill="#334155"/>
    <ellipse cx="38" cy="90" rx="7" ry="3" fill="#0f172a"/>
    <ellipse cx="54" cy="90" rx="7" ry="3" fill="#0f172a"/>
  </g>

  <!-- Second Character (Helper) receiving thanks, smiling warmly -->
  <g transform="translate(145, 95)">
    <!-- Torso -->
    <rect x="10" y="45" width="28" height="40" rx="8" fill="#10b981"/>
    <!-- Head -->
    <circle cx="24" cy="28" r="13" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 13 25 C 13 16, 35 16, 35 25 C 32 20, 16 20, 13 25 Z" fill="#334155"/>
    <!-- Smiling Eyes -->
    <path d="M 19 27 Q 22 24 25 27" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 27 27 Q 30 24 33 27" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Warm smile -->
    <path d="M 23 33 Q 26 36 29 33" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheek -->
    <circle cx="31" cy="31" r="3" fill="#fda4af" opacity="0.8"/>
    
    <!-- Arm raised in friendly acceptance / modesty -->
    <path d="M 12 55 Q -2 45 2 30" stroke="#059669" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="2" cy="28" r="4.5" fill="#fbcfe8"/>
  </g>

  <!-- FOREGROUND CONCEPTUAL UI ELEMENT: "10/10" Max Level Indicator / Gauge -->
  <g transform="translate(40, 25)">
    <!-- Gauge Background Box -->
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Icon / Star Symbol (Left inside pill) -->
    <circle cx="18" cy="16" r="10" fill="#f59e0b"/>
    <path d="M18 10 L19.5 13.5 L23 14 L20.5 16.5 L21 20 L18 18.2 L15 20 L15.5 16.5 L13 14 L16.5 13.5 Z" fill="#ffffff" transform="scale(0.6) translate(19, 16)"/>

    <!-- Progress Fill Bar (100% / Ten Parts full) -->
    <rect x="35" y="8" width="115" height="16" rx="8" fill="#1e293b"/>
    <rect x="35" y="8" width="115" height="16" rx="8" fill="url(#gaugeActive)"/>
    
    <!-- Segment Dividers representing "Ten Parts" (十) -->
    <g stroke="#0f172a" stroke-width="1.5" opacity="0.7">
      <line x1="46" y1="8" x2="46" y2="24"/>
      <line x1="58" y1="8" x2="58" y2="24"/>
      <line x1="70" y1="8" x2="70" y2="24"/>
      <line x1="82" y1="8" x2="82" y2="24"/>
      <line x1="94" y1="8" x2="94" y2="24"/>
      <line x1="106" y1="8" x2="106" y2="24"/>
      <line x1="118" y1="8" x2="118" y2="24"/>
      <line x1="130" y1="8" x2="130" y2="24"/>
      <line x1="142" y1="8" x2="142" y2="24"/>
    </g>

    <!-- Sparkles on the gauge end -->
    <circle cx="145" cy="16" r="3" fill="#ffffff"/>
  </g>

  <!-- Additional decorative sparkles around the scene -->
  <path d="M 30 90 L 33 93 L 30 96 L 27 93 Z" fill="#38bdf8" opacity="0.7"/>
  <path d="M 210 100 L 213 103 L 210 106 L 207 103 Z" fill="#ec4899" opacity="0.7"/>
  <circle cx="110" cy="50" r="2" fill="#fbbf24"/>
</svg>