<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Magnifier Cone -->
    <radialGradient id="lightCone" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Detective Coat Gradient -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Props -->
  <!-- Bookshelf / Wall grid backdrop -->
  <path d="M30 30 H210 V140 H30 Z" fill="#1e293b" opacity="0.5" />
  <line x1="30" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="2" />
  <line x1="30" y1="110" x2="210" y2="110" stroke="#334155" stroke-width="2" />
  <!-- Background Books -->
  <rect x="45" y="45" width="12" height="25" rx="2" fill="#475569" />
  <rect x="60" y="40" width="15" height="30" rx="2" fill="#0d9488" />
  <rect x="78" y="48" width="10" height="22" rx="2" fill="#f43f5e" />
  <rect x="160" y="85" width="14" height="25" rx="2" fill="#8b5cf6" />
  <rect x="177" y="80" width="12" height="30" rx="2" fill="#f59e0b" />

  <!-- Desk Surface -->
  <path d="M10 160 L230 160 L240 230 L0 230 Z" fill="url(#deskGrad)" filter="url(#shadow)" />
  <path d="M0 160 H240" stroke="#475569" stroke-width="2" />

  <!-- Desk Props: Tangled String/Clues Board item -->
  <path d="M40 180 Q60 170 80 190 T120 185" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <circle cx="80" cy="190" r="3" fill="#f43f5e" />
  
  <!-- Coffee Mug -->
  <rect x="185" y="170" width="22" height="26" rx="4" fill="#cbd5e1" />
  <path d="M207 176 H212 C216 176 216 186 212 186 H207" fill="none" stroke="#cbd5e1" stroke-width="3" />
  <!-- Steam from coffee -->
  <path d="M191 162 Q194 154 191 146" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- MAIN CHARACTER: Curious Detective / Investigator -->
  <!-- Body/Coat -->
  <path d="M75 195 C75 170 95 160 120 160 C145 160 165 170 165 195 Z" fill="url(#coatGrad)" filter="url(#shadow)" />
  <!-- Coat Lapels -->
  <path d="M100 160 L110 185 L120 165 L130 185 L140 160" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Collar -->
  <path d="M95 160 L120 175 L145 160" fill="#ea580c" />

  <!-- Neck -->
  <rect x="110" y="145" width="20" height="20" fill="#fed7aa" />

  <!-- Head / Face -->
  <circle cx="120" cy="130" r="22" fill="#fed7aa" filter="url(#shadow)" />

  <!-- Detective Hat (Fedora) -->
  <path d="M92 120 Q120 110 148 120 C150 122 148 125 145 125 H95 C92 125 90 122 92 120 Z" fill="#c2410c" />
  <path d="M102 118 Q120 95 138 118 C135 119 105 119 102 118 Z" fill="#9a3412" />
  <rect x="102" y="118" width="36" height="4" fill="#f59e0b" />

  <!-- Face Expressions (Puzzled / Searching "Bottom of it") -->
  <!-- Eyebrows (Scrunched up thoughtfully) -->
  <path d="M106 126 L114 130" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />
  <path d="M134 126 L126 130" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />
  <!-- Eyes (Determined dots/curves) -->
  <circle cx="110" cy="134" r="2.5" fill="#1e293b" />
  <circle cx="130" cy="134" r="2.5" fill="#1e293b" />
  <!-- Mouth (Small curious 'O' or wavy line) -->
  <circle cx="120" cy="143" r="3" fill="#9a3412" />

  <!-- THE CENTRAL MYSTERY / OBJECT: The "Bottom" of the puzzle -->
  <!-- Glowing Document/File on Desk -->
  <g filter="url(#shadow)">
    <path d="M90 190 L150 190 L155 220 L85 220 Z" fill="#f8fafc" />
    <!-- Mystery Lines on Document -->
    <line x1="98" y1="198" x2="130" y2="198" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="96" y1="206" x2="140" y2="206" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="94" y1="214" x2="120" y2="214" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- MAGNIFYING GLASS (Active Investigation - Representing finding out "到底" / the root cause) -->
  <!-- Light Beam Cone radiating down to the document -->
  <polygon points="120,90 70,215 170,215" fill="url(#lightCone)" style="mix-blend-mode: screen;" />

  <!-- Magnifying Glass Arm & Frame -->
  <!-- Arm holding it -->
  <path d="M140 100 L170 70" stroke="#334155" stroke-width="8" stroke-linecap="round" />
  <path d="M140 100 L170 70" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <!-- Hand -->
  <circle cx="138" cy="102" r="9" fill="#fed7aa" />

  <!-- Lens Rim -->
  <circle cx="120" cy="115" r="32" fill="none" stroke="#0f172a" stroke-width="6" />
  <circle cx="120" cy="115" r="32" fill="none" stroke="#38bdf8" stroke-width="3" />
  <!-- Glass Reflection -->
  <path d="M102 100 Q112 90 125 95" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Magnified "Core Truth" element inside the lens view -->
  <circle cx="120" cy="115" r="14" fill="#fef08a" opacity="0.9" />
  <path d="M120 105 V120" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
  <circle cx="120" cy="125" r="2" fill="#d97706" />

  <!-- Sparkles / Atmosphere indicating "Got to the bottom of it!" -->
  <path d="M60 90 L63 97 L70 100 L63 103 L60 110 L57 103 L50 100 L57 97 Z" fill="#fbbf24" />
  <path d="M180 120 L182 125 L187 127 L182 129 L180 134 L178 129 L173 127 L178 125 Z" fill="#38bdf8" />
  <circle cx="50" cy="150" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="195" cy="140" r="3" fill="#38bdf8" opacity="0.8" />

</svg>