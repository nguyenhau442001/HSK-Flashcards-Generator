<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="deskGlow" cx="120" cy="180" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Chalkboard Glow -->
    <radialGradient id="boardGlow" cx="120" cy="70" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="windowLight" x1="30" y1="30" x2="80" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effects -->
  <rect width="240" height="240" rx="24" fill="url(#deskGlow)" />
  <rect width="240" height="240" rx="24" fill="url(#boardGlow)" />

  <!-- Background Environment: Classroom / Study Room -->
  <g id="environment">
    <!-- Back Wall -->
    <rect x="20" y="25" width="200" height="135" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Blackboard / Teaching Board -->
    <rect x="40" y="38" width="160" height="75" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Abstract Math/Science Drawings on Board (No text!) -->
    <path d="M 55 75 Q 70 55 85 75 T 115 75" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <circle cx="145" cy="65" r="12" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.6" />
    <line x1="145" y1="53" x2="145" y2="77" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <polygon points="175,75 190,55 165,55" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round" opacity="0.6" />

    <!-- Window on the Left -->
    <path d="M 25 45 L 45 40 L 45 110 L 25 105 Z" fill="url(#windowLight)" />
    <line x1="35" y1="42" x2="35" y2="108" stroke="#334155" stroke-width="1.5" />

    <!-- Bookshelf in Background -->
    <rect x="185" y="45" width="25" height="90" fill="#0f172a" opacity="0.5" />
    <line x1="185" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="1.5" />
    <line x1="185" y1="105" x2="210" y2="105" stroke="#334155" stroke-width="1.5" />
    <!-- Colorful Book Spines -->
    <rect x="190" y="55" width="5" height="20" fill="#ec4899" rx="1" />
    <rect x="197" y="52" width="6" height="23" fill="#38bdf8" rx="1" />
    <rect x="190" y="85" width="8" height="20" fill="#fbbf24" rx="1" />
  </g>

  <!-- Foreground: Wooden Teacher's Desk -->
  <g id="desk" filter="url(#shadow)">
    <!-- Desk Surface Top -->
    <polygon points="25,160 215,160 230,190 10,190" fill="#b45309" />
    <!-- Desk Front Panel -->
    <polygon points="10,190 230,190 230,215 10,215" fill="#92400e" />
    <!-- Desk Rim Highlight -->
    <polygon points="25,160 215,160 218,165 22,165" fill="#f59e0b" opacity="0.5" />

    <!-- Props on Desk -->
    <!-- Globe -->
    <circle cx="50" cy="138" r="14" fill="#38bdf8" opacity="0.8" />
    <path d="M 40 135 Q 50 128 55 142" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M 46 148 Q 52 143 58 147" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M 50,124 L 50,152" stroke="#64748b" stroke-width="2" />
    <path d="M 44,152 L 56,152" stroke="#64748b" stroke-width="2" />

    <!-- Stack of Books & Glasses -->
    <rect x="170" y="148" width="30" height="7" rx="2" fill="#ef4444" />
    <rect x="167" y="155" width="34" height="6" rx="2" fill="#3b82f6" />
    <rect x="172" y="161" width="28" height="8" rx="2" fill="#10b981" />
    <!-- Glasses -->
    <circle cx="180" cy="144" r="5" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="192" cy="144" r="5" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="185" y1="143" x2="187" y2="143" stroke="#e2e8f0" stroke-width="1.5" />
  </g>

  <!-- Main Character: The Father (Cha) - Friendly Teacher / Professional -->
  <g id="father-character" filter="url(#shadow)">
    <!-- Body / Torso (Suit Jacket over Shirt) -->
    <!-- Shoulders & Jacket -->
    <path d="M 85,215 C 85,185 95,165 120,165 C 145,165 155,185 155,215 Z" fill="#1e3a8a" />
    <!-- White Shirt Collar & Red Tie -->
    <polygon points="120,175 110,195 130,195" fill="#f8fafc" />
    <polygon points="118,188 122,188 124,215 116,215" fill="#ef4444" />
    <!-- Lapels -->
    <path d="M 100,165 L 110,195 L 120,175 Z" fill="#1d4ed8" />
    <path d="M 140,165 L 130,195 L 120,175 Z" fill="#1d4ed8" />

    <!-- Neck -->
    <rect x="110" y="148" width="20" height="25" fill="#fed7aa" rx="4" />

    <!-- Head & Face Structure -->
    <rect x="96" y="95" width="48" height="60" rx="24" fill="#fed7aa" />

    <!-- Ears -->
    <circle cx="94" cy="125" r="5" fill="#fdba74" />
    <circle cx="146" cy="125" r="5" fill="#fdba74" />

    <!-- Friendly Expression / Facial Features -->
    <!-- Gentle Warm Eyes (Friendly Teacher Vibe) -->
    <path d="M 106,120 Q 112,114 118,120" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 122,120 Q 128,114 134,120" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Warm Smiling Mouth -->
    <path d="M 112,138 Q 120,146 128,138" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" />
    <!-- Smile dimples/cheeks -->
    <circle cx="108" cy="135" r="3" fill="#f87171" opacity="0.4" />
    <circle cx="132" cy="135" r="3" fill="#f87171" opacity="0.4" />

    <!-- Gentle Eyebrows -->
    <path d="M 105,110 Q 112,107 119,111" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M 121,111 Q 128,107 135,110" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Hair (Mature, Neat, Dark with subtle highlights) -->
    <path d="M 96,115 C 96,92 104,90 120,90 C 136,90 144,92 144,115 C 144,118 142,120 140,118 C 130,105 110,105 100,118 C 98,120 96,118 96,115 Z" fill="#334155" />
    <!-- Hair fringe side sweep -->
    <path d="M 100,108 Q 115,96 132,104 C 135,105 136,102 133,100 C 120,93 105,94 98,104 C 96,107 98,110 100,108 Z" fill="#475569" />

    <!-- Action Gesture: Holding/Pointing with Chalk or Book -->
    <!-- Right Arm & Hand writing/explaining -->
    <path d="M 150,180 C 165,175 175,160 178,145" fill="none" stroke="#1e3a8a" stroke-width="14" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="179" cy="140" r="7" fill="#fed7aa" />
    <!-- Chalk stick -->
    <line x1="179" y1="135" x2="183" y2="125" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

    <!-- Left Arm resting -->
    <path d="M 90,180 C 75,185 70,200 65,215" fill="none" stroke="#1e3a8a" stroke-width="14" stroke-linecap="round" />
    <circle cx="63" cy="218" r="6" fill="#fed7aa" />
  </g>

  <!-- Foreground Accent Particles (Warm light dust / inspiring atmosphere) -->
  <circle cx="70" cy="80" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="170" cy="70" r="1.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="150" cy="100" r="2.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="90" cy="150" r="1.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="125" cy="55" r="2" fill="#10b981" opacity="0.8" />
</svg>