<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Ticket Booth Window Glow -->
    <linearGradient id="booth-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment / Ambient Glow -->
  <circle cx="180" cy="80" r="70" fill="#38bdf8" opacity="0.05"/>
  <circle cx="60" cy="140" r="90" fill="#fbbf24" opacity="0.04"/>

  <!-- Queue Stanchions & Barrier Ropes (Back) -->
  <g opacity="0.8">
    <!-- Post 1 -->
    <rect x="35" y="115" width="4" height="60" rx="2" fill="#64748b"/>
    <circle cx="37" cy="113" r="4" fill="#cbd5e1"/>
    <!-- Post 2 -->
    <rect x="75" y="110" width="4" height="65" rx="2" fill="#64748b"/>
    <circle cx="77" cy="108" r="4" fill="#cbd5e1"/>
    <!-- Post 3 -->
    <rect x="115" y="105" width="4" height="70" rx="2" fill="#64748b"/>
    <circle cx="117" cy="103" r="4" fill="#cbd5e1"/>
    
    <!-- Red Velvet Ropes (Catenary) -->
    <path d="M 37 116 Q 56 130 77 111" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <path d="M 77 111 Q 96 125 117 106" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floor Surface -->
  <path d="M 0 175 L 240 175 L 240 240 L 0 240 Z" fill="url(#floor-grad)"/>
  <!-- Floor Tile Lines (Perspective) -->
  <path d="M 0 195 L 240 195 M 0 215 L 240 215" stroke="#475569" stroke-width="1" opacity="0.4"/>

  <!-- Ticket Booth / Counter Structure (Right Side) -->
  <g id="ticket-booth">
    <!-- Booth Back Wall -->
    <rect x="160" y="60" width="65" height="115" rx="4" fill="#334155"/>
    <!-- Counter Top -->
    <path d="M 150 135 L 240 135 L 240 143 L 150 143 Z" fill="#475569"/>
    <!-- Glowing Service Window -->
    <rect x="175" y="80" width="45" height="55" rx="6" fill="url(#booth-glow)" opacity="0.9"/>
    <!-- Window Frame Bars -->
    <rect x="175" y="105" width="45" height="4" fill="#d97706" opacity="0.5"/>
    <!-- Ticket Machine / Sign on Counter -->
    <rect x="165" y="118" width="12" height="17" rx="2" fill="#0ea5e9"/>
    <circle cx="171" cy="123" r="2" fill="#e0f2fe"/>
  </g>

  <!-- Character 3 (Back of the queue, waiting patiently) -->
  <g id="person-3" transform="translate(15, 25)">
    <!-- Shadow -->
    <ellipse cx="30" cy="153" rx="10" ry="4" fill="#020617" opacity="0.6"/>
    <!-- Body/Backpack -->
    <rect x="23" y="115" width="14" height="24" rx="4" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="30" cy="102" r="9" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 21 100 Q 30 90 39 100" fill="#1e293b"/>
    <!-- Legs -->
    <rect x="25" y="137" width="4" height="16" rx="2" fill="#334155"/>
    <rect x="31" y="137" width="4" height="16" rx="2" fill="#334155"/>
  </g>

  <!-- Character 2 (Middle of the queue, holding a ticket) -->
  <g id="person-2" transform="translate(55, 15)">
    <!-- Shadow -->
    <ellipse cx="30" cy="163" rx="11" ry="4.5" fill="#020617" opacity="0.6"/>
    <!-- Torso -->
    <rect x="22" y="120" width="16" height="28" rx="6" fill="#10b981"/>
    <!-- Head (Profile/Turned slightly forward) -->
    <circle cx="30" cy="107" r="10" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M 20 106 Q 30 94 40 105" fill="#78350f"/>
    <!-- Hand holding ticket/phone -->
    <rect x="36" y="130" width="6" height="8" rx="2" fill="#fde68a"/>
    <rect x="38" y="128" width="8" height="5" rx="1" fill="#f8fafc"/>
    <!-- Legs -->
    <rect x="24" y="146" width="5" height="19" rx="2.5" fill="#1e293b"/>
    <rect x="31" y="146" width="5" height="19" rx="2.5" fill="#1e293b"/>
  </g>

  <!-- Character 1 (Front of the queue, looking towards the booth excitedly) -->
  <g id="person-1" transform="translate(100, 5)">
    <!-- Shadow -->
    <ellipse cx="32" cy="173" rx="12" ry="5" fill="#020617" opacity="0.6"/>
    
    <!-- Torso / Jacket -->
    <path d="M 22 130 C 22 125, 42 125, 42 130 L 44 160 L 20 160 Z" fill="#ec4899"/>
    <!-- Scarf -->
    <path d="M 24 124 Q 32 132 40 124 L 38 135 Q 32 138 26 135 Z" fill="#f59e0b"/>

    <!-- Head -->
    <circle cx="32" cy="111" r="11" fill="#ffedd5"/>
    <!-- Hair / Ponytail -->
    <path d="M 21 110 Q 30 96 41 108 C 45 105, 47 110, 44 115" fill="#0f172a"/>
    <circle cx="45" cy="116" r="3" fill="#0f172a"/>

    <!-- Gesturing Arm pointing forward -->
    <path d="M 40 135 L 52 128" stroke="#ffedd5" stroke-width="5" stroke-linecap="round"/>

    <!-- Legs -->
    <rect x="25" y="157" width="5" height="18" rx="2.5" fill="#334155"/>
    <rect x="34" y="157" width="5" height="18" rx="2.5" fill="#334155"/>
  </g>

  <!-- Ambient Light / Highlights -->
  <path d="M 140 0 L 240 100 L 240 0 Z" fill="#ffffff" opacity="0.03"/>
</svg>