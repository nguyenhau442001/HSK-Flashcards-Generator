<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Table Top Gradient (Vibrant Blue/Green athletic surface) -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Paddle Rubber Gradient (Classic Red) -->
    <linearGradient id="paddle-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Paddle Rubber Gradient (Energetic Black/Blue) -->
    <linearGradient id="paddle-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Wooden Handle Gradient -->
    <linearGradient id="wood-handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Ping Pong Ball Gradient -->
    <radialGradient id="ball-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting & Accents -->
  <circle cx="120" cy="80" r="90" fill="#38bdf8" opacity="0.04" filter="url(#glow)"/>
  <circle cx="180" cy="160" r="60" fill="#f59e0b" opacity="0.06" filter="url(#glow)"/>

  <!-- Ping Pong Table Surface (Perspective View) -->
  <g transform="translate(0, 30)">
    <!-- Table shadow -->
    <path d="M 20 150 L 220 150 L 200 190 L 40 190 Z" fill="#020617" opacity="0.5"/>
    
    <!-- Table main board -->
    <path d="M 15 40 L 225 40 L 205 155 L 35 155 Z" fill="url(#table-grad)" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Table white boundary lines -->
    <!-- Outer edge line -->
    <path d="M 27 48 L 213 48 L 197 147 L 43 147 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
    <!-- Center line -->
    <line x1="120" y1="48" x2="120" y2="147" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Net side line -->
    <line x1="15" y1="97" x2="225" y2="97" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
  </g>

  <!-- Net Assembly -->
  <g transform="translate(0, 15)">
    <!-- Net shadow -->
    <path d="M 12 70 Q 120 85 228 70 L 228 85 Q 120 100 12 85 Z" fill="#000000" opacity="0.3"/>
    
    <!-- Net posts -->
    <rect x="8" y="55" width="6" height="30" rx="2" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="226" y="55" width="6" height="30" rx="2" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Net mesh background panel -->
    <path d="M 12 58 Q 120 73 228 58 L 228 80 Q 120 95 12 80 Z" fill="#f8fafc" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Net grid pattern (vector crosshatch) -->
    <path d="
      M 12 63 Q 120 78 228 63
      M 12 68 Q 120 83 228 68
      M 12 73 Q 120 88 228 73
      M 40 59 Q 45 74 35 83
      M 70 60 Q 75 75 65 85
      M 100 60 Q 105 76 95 86
      M 130 60 Q 135 76 125 86
      M 160 60 Q 165 75 155 85
      M 190 59 Q 195 74 185 83
    " fill="none" stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.8"/>
    
    <!-- Net top band -->
    <path d="M 11 56 Q 120 71 229 56 L 229 60 Q 120 75 11 60 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  </g>

  <!-- Action Elements: Crossing Paddles & Dynamic Ball -->

  <!-- Background Paddle (Player 1 / Left - angled dynamically) -->
  <g transform="translate(65, 110) rotate(-25)">
    <!-- Paddle Handle Shadow -->
    <rect x="-10" y="20" width="20" height="50" rx="8" fill="#000" opacity="0.3"/>
    <!-- Paddle Wood Handle -->
    <path d="M -8 20 L 8 20 L 10 65 Q 10 70 0 72 Q -10 70 -10 65 Z" fill="url(#wood-handle)" stroke="#b45309" stroke-width="1"/>
    <!-- Handle grip lines -->
    <line x1="-7" y1="30" x2="7" y2="30" stroke="#b45309" stroke-width="1.5" opacity="0.6"/>
    <line x1="-8" y1="40" x2="8" y2="40" stroke="#b45309" stroke-width="1.5" opacity="0.6"/>
    <line x1="-9" y1="50" x2="9" y2="50" stroke="#b45309" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Paddle Blade (Dark side showing) -->
    <circle cx="0" cy="-10" r="38" fill="url(#paddle-dark)" stroke="#1e293b" stroke-width="2"/>
    <circle cx="0" cy="-10" r="34" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Foreground Paddle (Player 2 / Right - striking forward) -->
  <g transform="translate(165, 105) rotate(18)" filter="url(#glow)">
    <!-- Paddle Shadow -->
    <ellipse cx="5" cy="40" rx="35" ry="15" fill="#000" opacity="0.4"/>
    
    <!-- Wood Handle -->
    <path d="M -8 22 L 8 22 L 11 68 Q 11 74 0 76 Q -11 74 -11 68 Z" fill="url(#wood-handle)" stroke="#92400e" stroke-width="1.5"/>
    <line x1="-7" y1="32" x2="7" y2="32" stroke="#b45309" stroke-width="2" opacity="0.7"/>
    <line x1="-9" y1="44" x2="9" y2="44" stroke="#b45309" stroke-width="2" opacity="0.7"/>
    <line x1="-10" y1="56" x2="10" y2="56" stroke="#b45309" stroke-width="2" opacity="0.7"/>

    <!-- Paddle Blade (Red rubber) -->
    <circle cx="0" cy="-12" r="40" fill="#9f1239" stroke="#881337" stroke-width="2"/>
    <circle cx="0" cy="-12" r="38" fill="url(#paddle-red)"/>
    <!-- Rubber texture ring / highlight -->
    <circle cx="-5" cy="-18" r="30" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Speed/Impact gloss arc -->
    <path d="M -22 -32 A 32 32 0 0 1 22 -32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- The Ping Pong Ball (Bouncing with motion trails) -->
  <g transform="translate(115, 75)">
    <!-- Motion trails / Action lines -->
    <path d="M -45 25 Q -20 10 0 -5" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M -30 35 Q -15 20 -5 5" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Ball glow -->
    <circle cx="0" cy="0" r="14" fill="#fde047" opacity="0.3" filter="url(#glow)"/>
    
    <!-- Main Ball Body -->
    <circle cx="0" cy="0" r="9" fill="url(#ball-grad)" stroke="#a16207" stroke-width="1"/>
    
    <!-- Crisp Specular Highlight -->
    <circle cx="-3" cy="-3" r="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Secondary decorative elements for vibrancy (Flying sparkles / energy dots) -->
  <circle cx="145" cy="50" r="3" fill="#38bdf8" opacity="0.9"/>
  <circle cx="155" cy="45" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="95" cy="125" r="2.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="85" cy="132" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="185" cy="115" r="2" fill="#f43f5e" opacity="0.8"/>

  <!-- Foreground framing vignette edges for depth -->
  <path d="M 0 0 L 240 0 L 240 15 L 0 15 Z" fill="#0f172a" opacity="0.2"/>
  <path d="M 0 225 L 240 225 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.4"/>
</svg>