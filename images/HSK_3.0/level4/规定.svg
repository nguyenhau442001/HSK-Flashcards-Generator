<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light / Notice Board Glow -->
    <radialGradient id="boardGlow" cx="120" cy="110" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Texture Gradient for Board Frame -->
    <linearGradient id="woodFrame" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="120" cy="120" r="110" fill="url(#boardGlow)"/>

  <!-- Background Environment: School Hallway / Office Wall Texture -->
  <path d="M0 180 L240 180" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M40 0 L40 240 M200 0 L200 240" stroke="#1e293b" stroke-width="4" opacity="0.3"/>

  <!-- Potted Plant (Left Context Prop) -->
  <g transform="translate(18, 145)">
    <!-- Pot -->
    <path d="M4 25 L20 25 L18 55 L6 55 Z" fill="#64748b"/>
    <ellipse cx="12" cy="25" rx="8" ry="3" fill="#94a3b8"/>
    <!-- Foliage -->
    <circle cx="12" cy="12" r="14" fill="#10b981"/>
    <circle cx="2" cy="18" r="10" fill="#059669"/>
    <circle cx="20" cy="16" r="11" fill="#34d399"/>
    <circle cx="12" cy="2" r="9" fill="#047857"/>
  </g>

  <!-- Hanging Notice Board (Main Subject Representing "Quy Định" / Rules) -->
  <g transform="translate(45, 30)" filter="url(#shadow)">
    <!-- Mounting Strings -->
    <line x1="30" y1="-30" x2="30" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="120" y1="-30" x2="120" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="30" cy="-30" r="3" fill="#cbd5e1"/>
    <circle cx="120" cy="-30" r="3" fill="#cbd5e1"/>

    <!-- Board Outer Frame -->
    <rect x="0" y="0" width="150" height="135" rx="10" fill="url(#woodFrame)"/>
    <!-- Board Cork Surface -->
    <rect x="8" y="8" width="134" height="119" rx="6" fill="#fde68a"/>
    <!-- Cork Texture Details -->
    <circle cx="25" cy="25" r="2" fill="#f59e0b" opacity="0.4"/>
    <circle cx="120" cy="45" r="1.5" fill="#f59e0b" opacity="0.4"/>
    <circle cx="75" cy="85" r="2" fill="#f59e0b" opacity="0.4"/>
    <circle cx="45" cy="105" r="1.5" fill="#f59e0b" opacity="0.4"/>

    <!-- Notice Paper 1 (Central Rule Document with Red Stamp) -->
    <g transform="translate(18, 16) rotate(-3)">
      <rect width="60" height="75" rx="2" fill="#ffffff" filter="url(#shadow)"/>
      <!-- Push Pin -->
      <circle cx="30" cy="5" r="3" fill="#ef4444"/>
      <circle cx="30" cy="4" r="1" fill="#fca5a5"/>
      <!-- Simulated Lines of Rules -->
      <line x1="10" y1="18" x2="50" y2="18" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="28" x2="45" y2="28" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="38" x2="48" y2="38" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="48" x2="35" y2="48" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <!-- Official Red Approval Stamp / Seal -->
      <circle cx="42" cy="58" r="10" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 1"/>
      <path d="M37 58 L41 62 L48 54" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Notice Paper 2 (Checklist / Compliance Rule) -->
    <g transform="translate(76, 24) rotate(4)">
      <rect width="55" height="68" rx="2" fill="#f8fafc" filter="url(#shadow)"/>
      <!-- Push Pin -->
      <circle cx="28" cy="5" r="3" fill="#3b82f6"/>
      <circle cx="28" cy="4" r="1" fill="#bfdbfe"/>
      <!-- Checkbox Items -->
      <rect x="10" y="16" width="6" height="6" rx="1" fill="#10b981"/>
      <line x1="20" y1="19" x2="42" y2="19" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

      <rect x="10" y="30" width="6" height="6" rx="1" fill="#10b981"/>
      <line x1="20" y1="33" x2="45" y2="33" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

      <rect x="10" y="44" width="6" height="6" rx="1" fill="#10b981"/>
      <line x1="20" y1="47" x2="38" y2="47" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Small Photo / Visual Rule Graphic -->
    <g transform="translate(30, 90) rotate(-2)" filter="url(#shadow)">
      <rect width="40" height="30" rx="1" fill="#ffffff"/>
      <rect x="4" y="4" width="32" height="22" fill="#e0f2fe"/>
      <!-- Simple graphic inside photo: Person silhouette obeying rule -->
      <circle cx="20" cy="12" r="5" fill="#0284c7"/>
      <path d="M12 24 C12 18 28 18 28 24 Z" fill="#0284c7"/>
    </g>

    <!-- Sticky Note (Highlighting Important Regulation) -->
    <g transform="translate(78, 88) rotate(6)" filter="url(#shadow)">
      <polygon points="0,0 35,0 35,35 0,35" fill="#fef08a"/>
      <!-- Fold corner effect -->
      <polygon points="25,35 35,25 35,35" fill="#fde047"/>
      <!-- Scribble lines -->
      <line x1="8" y1="12" x2="27" y2="12" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="8" y1="20" x2="22" y2="20" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Interactive Pointer / Magnifying Glass emphasizing rule checking (Foreground Prop) -->
  <g transform="translate(145, 130)" filter="url(#shadow)">
    <!-- Glass Handle -->
    <path d="M35 35 L60 60" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M35 35 L60 60" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <!-- Glass Rim -->
    <circle cx="22" cy="22" r="24" fill="#0f172a" opacity="0.3"/>
    <circle cx="20" cy="20" r="22" fill="none" fill-opacity="0.1" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="20" cy="20" r="22" fill="#e0f2fe" fill-opacity="0.15"/>
    <!-- Lens Highlight -->
    <path d="M 6 10 A 18 18 0 0 1 30 6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sparkles / Attention Elements -->
  <g transform="translate(35, 45)">
    <path d="M0 0 L3 6 L9 9 L3 12 L0 18 L-3 12 L-9 9 L-3 6 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(205, 75)">
    <path d="M0 0 L2 4 L6 6 L2 8 L0 12 L-2 8 L-6 6 L-2 4 Z" fill="#38bdf8"/>
  </g>

  <!-- Floor line with ambient shadow -->
  <ellipse cx="120" cy="210" rx="90" ry="8" fill="#000000" opacity="0.4"/>
</svg>