<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light/Spotlight Effect -->
  <circle cx="120" cy="110" r="100" fill="url(#spotlight)" />

  <!-- Background Classroom Elements (Bookshelf & Window hint) -->
  <!-- Shelf Backing -->
  <rect x="35" y="45" width="170" height="12" rx="4" fill="#334155" opacity="0.4" />
  <!-- Books on shelf -->
  <path d="M45 45 L45 25 L55 25 L55 45 Z" fill="#38bdf8" opacity="0.6" />
  <path d="M57 45 L57 20 L70 20 L70 45 Z" fill="#ec4899" opacity="0.6" />
  <path d="M72 45 L72 28 L82 28 L82 45 Z" fill="#10b981" opacity="0.6" />
  <path d="M165 45 L165 22 L180 22 L180 45 Z" fill="#fbbf24" opacity="0.6" />
  <path d="M182 45 L182 27 L192 27 L192 45 Z" fill="#38bdf8" opacity="0.5" />

  <!-- Teacher Character (Left) -->
  <g id="teacher">
    <!-- Body/Torso -->
    <path d="M 60 145 C 60 130 75 120 90 120 C 105 120 120 130 120 145 L 120 180 L 60 180 Z" fill="#1e40af" />
    <!-- Collar/Shirt -->
    <path d="M 85 120 L 90 132 L 95 120 Z" fill="#f8fafc" />
    <!-- Head -->
    <circle cx="90" cy="98" r="16" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 74 98 C 74 85 82 80 90 80 C 98 80 106 85 106 96 C 102 92 96 90 90 90 C 84 90 78 93 74 98 Z" fill="#475569" />
    <!-- Friendly Face/Expression -->
    <circle cx="85" cy="97" r="1.5" fill="#1e293b" />
    <circle cx="95" cy="97" r="1.5" fill="#1e293b" />
    <path d="M 87 103 Q 90 107 93 103" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Encouraging Gesturing Arm (Right Arm reaching out to student) -->
    <path d="M 105 130 Q 125 125 135 115" stroke="#1e40af" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="138" cy="113" r="5" fill="#fcd34d" />
  </g>

  <!-- Student Character (Right) -->
  <g id="student">
    <!-- Body/Torso -->
    <path d="M 120 155 C 120 140 135 130 150 130 C 165 130 180 140 180 155 L 180 185 L 120 185 Z" fill="#047857" />
    <!-- Collar/Scarf or Details -->
    <circle cx="150" cy="140" r="8" fill="#f8fafc" />
    <!-- Head (Proud, Happy) -->
    <circle cx="150" cy="108" r="15" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 135 108 C 135 95 142 90 150 90 C 158 90 165 95 165 108 C 162 102 156 100 150 100 C 144 100 138 102 135 108 Z" fill="#1e293b" />
    <!-- Face Expressions -->
    <circle cx="145" cy="107" r="1.5" fill="#1e293b" />
    <circle cx="155" cy="107" r="1.5" fill="#1e293b" />
    <!-- Big Happy Smile -->
    <path d="M 145 113 Q 150 119 155 113" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheeks -->
    <circle cx="142" cy="111" r="2" fill="#f43f5e" opacity="0.6" />
    <circle cx="158" cy="111" r="2" fill="#f43f5e" opacity="0.6" />

    <!-- Raised Receiving/Confident Arm -->
    <path d="M 135 140 Q 125 130 125 115" stroke="#047857" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="125" cy="112" r="4.5" fill="#fcd34d" />
  </g>

  <!-- Central Encouragement Prop: Glowing Golden Trophy / Award -->
  <g id="trophy" transform="translate(120, 95)" filter="url(#glow)">
    <!-- Trophy Glow Base -->
    <circle cx="0" cy="15" r="30" fill="#fbbf24" opacity="0.15" />
    
    <!-- Trophy Cup -->
    <path d="M -12 0 L 12 0 C 12 18 -12 18 -12 0 Z" fill="url(#goldGrad)" />
    <!-- Cup Rim -->
    <ellipse cx="0" cy="0" rx="12" ry="3" fill="#fef08a" />
    <!-- Handles -->
    <path d="M -11 2 C -18 2 -18 12 -11 10" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 11 2 C 18 2 18 12 11 10" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Stem & Base -->
    <rect x="-2" y="18" width="4" height="8" fill="#d97706" />
    <path d="M -8 26 L 8 26 L 6 30 L -6 30 Z" fill="url(#goldGrad)" />

    <!-- Floating Sparkles / Energy of Encouragement -->
    <g fill="#fef08a">
      <!-- Star 1 -->
      <path d="M -22 -15 L -20 -10 L -15 -8 L -20 -6 L -22 -1 L -24 -6 L -29 -8 L -24 -10 Z" transform="scale(0.8)" />
      <!-- Star 2 -->
      <path d="M 24 -12 L 25 -8 L 29 -7 L 25 -6 L 24 -2 L 23 -6 L 19 -7 L 23 -8 Z" transform="scale(0.9)" />
      <!-- Floating Hearts/Sparkles representing positive reinforcement -->
      <path d="M 0 -22 C 3 -27 8 -22 0 -16 C -8 -22 -3 -27 0 -22 Z" fill="#ec4899" opacity="0.9" />
    </g>
  </g>

  <!-- Desk Surface -->
  <rect x="25" y="180" width="190" height="8" rx="3" fill="#475569" />
  <rect x="40" y="188" width="160" height="4" rx="2" fill="#334155" />

  <!-- Props on Desk (Open Book & Pencil to tie to contextual example) -->
  <g id="desk-props">
    <!-- Open Notebook -->
    <path d="M 75 180 Q 95 174 115 180 L 115 183 Q 95 177 75 183 Z" fill="#f8fafc" />
    <path d="M 115 180 Q 135 174 155 180 L 155 183 Q 135 177 115 183 Z" fill="#f1f5f9" />
    <!-- Book Spine/Center line -->
    <line x1="115" y1="180" x2="115" y2="183" stroke="#cbd5e1" stroke-width="1" />
    <!-- Fictional abstract lines representing reading/studying -->
    <line x1="82" y1="178" x2="100" y2="176" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="130" y1="178" x2="148" y2="176" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />

    <!-- Cute Pencil -->
    <path d="M 165 181 L 185 175 L 186 177 L 166 183 Z" fill="#fbbf24" />
    <path d="M 185 175 L 189 174 L 186 177 Z" fill="#f43f5e" />
    <path d="M 165 181 L 163 182 L 166 183 Z" fill="#1e293b" />
  </g>

  <!-- Dynamic Action/Energy Flourishes (Sparkles in the air) -->
  <circle cx="105" cy="70" r="2" fill="#38bdf8" />
  <circle cx="135" cy="65" r="3" fill="#f43f5e" />
  <circle cx="160" cy="85" r="2" fill="#10b981" />
  <circle cx="75" cy="125" r="2.5" fill="#fbbf24" />
</svg>