<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Paper Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment Details (Study Room Atmosphere) -->
  <g opacity="0.3">
    <!-- Bookshelf silhouette -->
    <rect x="25" y="40" width="40" height="70" rx="2" fill="#475569" />
    <line x1="25" y1="65" x2="65" y2="65" stroke="#1e293b" stroke-width="3" />
    <line x1="25" y1="90" x2="65" y2="90" stroke="#1e293b" stroke-width="3" />
    
    <!-- Plant in background -->
    <circle cx="205" cy="85" r="14" fill="#10b981" />
    <path d="M205 99 L205 115" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="M195 75 Q205 60 215 75" fill="#34d399" />
  </g>

  <!-- Desk Surface -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2" />

  <!-- DESK LAMP (Warm golden glow) -->
  <path d="M190 160 L200 120 L210 160 Z" fill="#64748b" />
  <path d="M200 120 Q180 80 140 85" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <!-- Lamp Shade -->
  <path d="M115 75 L155 75 L165 95 L105 95 Z" fill="#fbbf24" filter="url(#shadow)" />
  <!-- Light Cone Base -->
  <polygon points="120,95 150,95 190,180 80,180" fill="#f59e0b" opacity="0.1" />

  <!-- MAIN SCENE: Hard Work vs. Unexpected Twist (Representation of "却" - but/yet) -->
  
  <!-- LEFT SIDE: Hard Work (Stack of heavy books, glowing sweat/effort) -->
  <g transform="translate(45, 125)">
    <!-- Book 1 (Bottom) -->
    <path d="M 0 20 L 45 10 L 75 22 L 30 32 Z" fill="#3b82f6" />
    <path d="M 0 20 L 0 35 L 30 47 L 30 32 Z" fill="#1d4ed8" />
    <path d="M 30 32 L 75 22 L 75 37 L 30 47 Z" fill="#2563eb" />

    <!-- Book 2 (Middle) -->
    <path d="M 5 5 L 42 -3 L 70 8 L 33 16 Z" fill="#ec4899" />
    <path d="M 5 5 L 5 18 L 33 29 L 33 16 Z" fill="#be185d" />
    <path d="M 33 16 L 70 8 L 70 21 L 33 29 Z" fill="#db2777" />

    <!-- Book 3 (Top) -->
    <path d="M 12 -8 L 40 -14 L 62 -5 L 34 1 Z" fill="#10b981" />
    <path d="M 12 -8 L 12 3 L 34 12 L 34 1 Z" fill="#047857" />
    <path d="M 34 1 L 62 -5 L 62 6 L 34 12 Z" fill="#059669" />

    <!-- Glowing Effort Sparks -->
    <circle cx="35" cy="-25" r="3" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="55" cy="-15" r="2" fill="#fbbf24" />
    <path d="M30 -18 Q35 -28 45 -22" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- RIGHT SIDE: The Twist / Obstacle ("却" concept: tried hard, BUT...) -->
  <!-- Falling/Tipping Gear & Broken Plan (Symbolizing unexpected result) -->
  <g transform="translate(135, 115)">
    <!-- Angled notepad with unfinished checklist -->
    <g transform="rotate(12) filter="url(#shadow)">
      <rect x="0" y="0" width="55" height="70" rx="4" fill="#f8fafc" />
      <!-- Red Header Bar -->
      <path d="M 0 4 C 0 1.7 1.7 0 4 0 L 51 0 C 53.3 0 55 1.7 55 4 L 55 16 L 0 16 Z" fill="#ef4444" />
      
      <!-- Checkmarks (Effort) -->
      <circle cx="10" cy="26" r="4" fill="#10b981" />
      <path d="M 8 26 L 10 28 L 13 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />
      <line x1="18" y1="26" x2="42" y2="26" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

      <circle cx="10" cy="40" r="4" fill="#10b981" />
      <path d="M 8 40 L 10 42 L 13 38" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />
      <line x1="18" y1="40" x2="38" y2="40" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

      <!-- The "BUT" Twist: Big Red Question Mark / Crossout overlay representing unexpected outcome -->
      <circle cx="10" cy="54" r="4" fill="#ef4444" />
      <path d="M 8 52 L 12 56 M 12 52 L 8 56" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />
      <line x1="18" y1="54" x2="30" y2="54" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Floating exclamation/twist indicator -->
    <g transform="translate(60, 10)">
      <circle cx="0" cy="0" r="14" fill="#ef4444" filter="url(#glow)" />
      <path d="M0 -7 L0 2 M0 6 L0 8" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- CENTRAL DYNAMIC BRIDGE: Visualizing the "Transition/Contrast" (却) -->
  <!-- A glowing curved arrow swooping from left hard-work to right unexpected barrier -->
  <path d="M 85 125 Q 120 90 145 130" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round" filter="url(#glow)" />
  <!-- Arrowhead pointing to the twist -->
  <path d="M 138 120 L 147 131 L 135 134 Z" fill="#38bdf8" />

  <!-- Foreground decorative elements for depth -->
  <!-- Coffee Mug representing late-night effort -->
  <g transform="translate(100, 155)">
    <rect x="0" y="5" width="18" height="22" rx="3" fill="#e2e8f0" filter="url(#shadow)" />
    <!-- Mug handle -->
    <path d="M 18 10 C 24 10 24 22 18 22" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <!-- Steam wisps -->
    <path d="M 5 0 Q 7 -5 5 -10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 12 2 Q 14 -3 12 -8" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

</svg>