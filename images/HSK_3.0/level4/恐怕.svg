<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="door-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Atmospheric background room details -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#090d16"/>
  <!-- Floor line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>

  <!-- Wall Clock showing late time (e.g., ticking past hours) -->
  <g transform="translate(180, 50)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#334155" stroke="#475569" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="#f8fafc"/>
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="5" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <!-- Clock ticks -->
    <circle cx="0" cy="-14" r="1.5" fill="#64748b"/>
    <circle cx="14" cy="0" r="1.5" fill="#64748b"/>
    <circle cx="0" cy="14" r="1.5" fill="#64748b"/>
    <circle cx="-14" cy="0" r="1.5" fill="#64748b"/>
  </g>

  <!-- Open Door emitting warm urgent light (Late / Missing out context) -->
  <path d="M20 70 L90 50 L90 180 L20 180 Z" fill="url(#door-glow)"/>
  <path d="M90 50 L90 180" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>

  <!-- Plant silhouette in background -->
  <path d="M210 180 Q215 150 200 130 Q220 140 230 180 Z" fill="#1e293b"/>
  <path d="M205 180 Q190 150 175 140 Q195 160 210 180 Z" fill="#1e293b"/>

  <!-- Coat rack with umbrella and jacket -->
  <g transform="translate(45, 80)">
    <line x1="0" y1="0" x2="0" y2="100" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="-10" y1="10" x2="10" y2="10" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <!-- Hanging jacket -->
    <path d="M-15 25 L-25 45 L-5 45 Z" fill="#38bdf8" filter="url(#shadow)"/>
  </g>

  <!-- MAIN CHARACTER: Expressing "Sợ rằng, e là" (Anxious realization, checking watch, looking at clock/door) -->
  <g transform="translate(110, 90)" filter="url(#shadow)">
    <!-- Character Body / Suit / Outfit -->
    <path d="M-25 90 C-25 60 -15 50 -15 50 L15 50 C15 50 25 60 25 90 Z" fill="#3b82f6"/>
    <!-- Tie / Collar detail -->
    <polygon points="0,50 -5,65 0,75 5,65" fill="#f8fafc"/>

    <!-- Head & Face -->
    <circle cx="0" cy="25" r="22" fill="#fed7aa"/>
    
    <!-- Anxious / Worried Eyebrows (angled up inward) -->
    <line x1="-10" y1="16" x2="-2" y2="19" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="2" y1="19" x2="10" y2="16" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (wide, nervous dots) -->
    <circle cx="-6" cy="23" r="2.5" fill="#1e293b"/>
    <circle cx="6" cy="23" r="2.5" fill="#1e293b"/>

    <!-- Worried Open Mouth (slight gasp/frown) -->
    <path d="M-4,35 Q0,30 4,35 Q0,40 -4,35 Z" fill="#9a3412"/>

    <!-- Hair -->
    <path d="M-20 20 C-20 5 -10 2 0 2 C10 2 20 5 20 20 C15 12 5 10 0 12 C-5 10 -15 12 -20 20 Z" fill="#1e293b"/>

    <!-- Arms & Wristwatch (Checking time urgently) -->
    <!-- Left arm holding wrist -->
    <path d="M-20 60 C-30 65 -35 80 -25 85" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <!-- Right arm bent up to face -->
    <path d="M20 60 C35 60 30 35 15 30" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>

    <!-- Wristwatch highlight -->
    <rect x="8" y="27" width="8" height="6" rx="2" fill="#fb923c" transform="rotate(15 12 30)"/>
  </g>

  <!-- Droplet of nervous sweat -->
  <path d="M125 105 Q128 112 125 115 Q122 112 125 105 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Foreground Luggage / Props reinforcing "Leaving/Trip/Late" context -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <!-- Suitcase -->
    <rect x="0" y="0" width="36" height="24" rx="4" fill="#fb923c"/>
    <rect x="14" y="-4" width="8" height="4" rx="1" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="8" x2="36" y2="8" stroke="#ea580c" stroke-width="2"/>
    <!-- Suitcase wheels -->
    <circle cx="6" cy="26" r="3" fill="#0f172a"/>
    <circle cx="30" cy="26" r="3" fill="#0f172a"/>
  </g>

  <!-- Shoes rushed out -->
  <g transform="translate(145, 180)">
    <path d="M0 4 C0 0 6 -2 12 0 C16 1 18 4 18 6 L0 6 Z" fill="#334155"/>
    <path d="M20 2 C20 -2 26 -4 32 -2 C36 -1 38 2 38 4 L20 4 Z" fill="#334155"/>
  </g>

  <!-- Soft ambient lighting vignette overlay -->
  <rect width="240" height="240" rx="24" fill="url(#amber-glow)" pointer-events="none" style="mix-blend-mode: overlay;"/>
</svg>