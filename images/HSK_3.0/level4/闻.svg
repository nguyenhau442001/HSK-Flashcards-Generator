<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Glow for Flowers/Scent -->
    <radialGradient id="scentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Scent Wave Line Style -->
    <style>
      .scent-wave {
        fill: none;
        stroke: #f472b6;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 4 4;
        opacity: 0.8;
      }
      .window-frame {
        stroke: #334155;
        stroke-width: 3;
        fill: none;
      }
    </style>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Elements: Window & Outdoor hint -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="130" y="20" width="85" height="130" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="138" y="28" width="33" height="114" fill="#1e293b" opacity="0.6"/>
    <rect x="175" y="28" width="33" height="114" fill="#1e293b" opacity="0.6"/>
    <!-- Window Light beam casting on floor/wall -->
    <polygon points="130,150 220,150 240,240 80,240" fill="url(#windowLight)"/>

    <!-- Bookshelf / Wall details -->
    <rect x="20" y="40" width="40" height="6" rx="2" fill="#334155"/>
    <rect x="30" y="22" width="20" height="18" rx="2" fill="#475569"/>
    <rect x="25" y="46" width="30" height="3" fill="#1e293b"/>
  </g>

  <!-- Table & Vase of Flowers (The Source of Fragrance) -->
  <g id="table-and-flowers" transform="translate(130, 110)">
    <!-- Table Surface -->
    <rect x="-10" y="50" width="95" height="8" rx="3" fill="#475569"/>
    <rect x="0" y="58" width="10" height="72" fill="#334155"/>
    <rect x="65" y="58" width="10" height="72" fill="#334155"/>

    <!-- Scent Ambient Glow behind flowers -->
    <circle cx="37" cy="20" r="35" fill="url(#scentGlow)"/>

    <!-- Vase -->
    <path d="M27,50 L47,50 L52,25 C52,25 45,20 37,20 C29,20 22,25 22,25 Z" fill="#38bdf8" opacity="0.85"/>
    <path d="M37,20 C45,20 52,25 52,25 L50,23 C50,23 44,18 37,18 C30,18 24,23 24,23 Z" fill="#7dd3fc"/>

    <!-- Stems -->
    <line x1="37" y1="20" x2="30" y2="5" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="37" y1="20" x2="45" y2="2" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

    <!-- Flowers (Blossoms) -->
    <!-- Flower 1 (Pink) -->
    <circle cx="28" cy="2" r="8" fill="#f472b6"/>
    <circle cx="28" cy="2" r="3" fill="#fef08a"/>
    <!-- Flower 2 (Orange/Yellow) -->
    <circle cx="46" cy="0" r="9" fill="#fb923c"/>
    <circle cx="46" cy="0" r="3.5" fill="#fef08a"/>
    <!-- Flower 3 (Center Back) -->
    <circle cx="37" cy="-6" r="8" fill="#ec4899"/>
    <circle cx="37" cy="-6" r="3" fill="#fef08a"/>
  </g>

  <!-- Scent Visual Waves (Curved rising lines showing fragrance moving to character) -->
  <g id="fragrance-waves">
    <path d="M 150 115 Q 130 100 120 110 T 90 100" class="scent-wave"/>
    <path d="M 160 100 Q 140 80 125 90 T 95 80" class="scent-wave"/>
    <path d="M 140 130 Q 120 120 105 125 T 80 115" class="scent-wave"/>
    <!-- Sparkles of fragrance -->
    <path d="M 115 95 L 117 99 L 121 101 L 117 103 L 115 107 L 113 103 L 109 101 L 113 99 Z" fill="#fbbf24" opacity="0.9"/>
    <path d="M 95 75 L 96.5 78 L 99.5 79.5 L 96.5 81 L 95 84 L 93.5 81 L 90.5 79.5 L 93.5 78 Z" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- Main Character (Experiencing the scent: eyes closed, smiling, leaning in) -->
  <g id="character" transform="translate(10, 85)">
    <!-- Chair Back -->
    <rect x="0" y="20" width="16" height="90" rx="6" fill="#334155"/>

    <!-- Torso (Leaning slightly right toward flowers) -->
    <path d="M 25 50 C 25 35, 45 35, 55 50 L 65 110 L 20 110 Z" fill="#6366f1"/>
    <!-- Collar details -->
    <path d="M 35 44 L 45 44 L 42 55 L 38 55 Z" fill="#e0e7ff"/>

    <!-- Neck -->
    <rect x="36" y="24" width="12" height="16" rx="4" fill="#fcd34d"/>

    <!-- Head (Tilted back/up in delight, eyes closed with joyful arcs) -->
    <g transform="translate(42, 18) rotate(10)">
      <!-- Hair Base -->
      <circle cx="0" cy="-6" r="18" fill="#1e293b"/>
      <!-- Face Base -->
      <circle cx="0" cy="0" r="16" fill="#fcd34d"/>
      <!-- Hair Styling (Front Bangs) -->
      <path d="M -16 -6 C -10 -18, 10 -18, 16 -10 C 12 -4, 4 -8, -6 -2 Z" fill="#1e293b"/>

      <!-- Eyes Closed (Happy curved lines) -->
      <path d="M -6 -2 C -4 1, -2 1, 0 -2" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 4 -2 C 6 1, 8 1, 10 -2" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Rosy Cheeks -->
      <circle cx="-7" cy="4" r="4" fill="#f43f5e" opacity="0.4"/>
      <circle cx="9" cy="4" r="4" fill="#f43f5e" opacity="0.4"/>

      <!-- Happy Open Smile -->
      <path d="M -3 7 C -3 11, 3 11, 3 7" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="#e11d48"/>
      <!-- Nose -->
      <circle cx="1" cy="2" r="1.5" fill="#d97706"/>
    </g>

    <!-- Arms reaching out gently/relaxed -->
    <path d="M 28 55 C 15 65, 15 80, 25 90" stroke="#6366f1" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="90" r="5" fill="#fcd34d"/>
  </g>

  <!-- Foreground Floor Line -->
  <rect x="0" y="225" width="240" height="15" fill="#0f172a"/>
</svg>