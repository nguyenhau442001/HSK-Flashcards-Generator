<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed frame -->
  <path d="M40 180 L200 180 L190 210 L50 210 Z" fill="#334155"/>
  
  <!-- Pillow -->
  <path d="M60 140 Q60 120 80 120 L160 120 Q180 120 180 140 L170 160 Q120 165 70 160 Z" fill="#e2e8f0"/>
  
  <!-- Blanket -->
  <path d="M50 160 L190 160 L200 220 L40 220 Z" fill="#64748b"/>
  
  <!-- Character head (waking up) -->
  <circle cx="120" cy="130" r="35" fill="#fde68a"/>
  
  <!-- Eyes (wide open) -->
  <ellipse cx="105" cy="125" rx="6" ry="8" fill="#1e293b"/>
  <ellipse cx="135" cy="125" rx="6" ry="8" fill="#1e293b"/>
  
  <!-- Mouth (surprised/awake) -->
  <path d="M112 145 Q120 152 128 145" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Sun rays coming through window -->
  <path d="M180 20 L220 20 L210 60 L190 60 Z" fill="#fbbf24" opacity="0.6"/>
  <path d="M190 10 L230 10 L220 40 L200 40 Z" fill="#f59e0b" opacity="0.8"/>
  
  <!-- Alarm clock on nightstand -->
  <rect x="185" y="140" width="30" height="40" rx="4" fill="#38bdf8"/>
  <circle cx="200" cy="150" r="8" fill="#f8fafc"/>
  <line x1="200" y1="150" x2="200" y2="145" stroke="#1e293b" stroke-width="2"/>
  <line x1="200" y1="150" x2="205" y2="150" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Ambient light glow -->
  <circle cx="120" cy="130" r="50" fill="#fbbf24" opacity="0.05"/>
</svg>