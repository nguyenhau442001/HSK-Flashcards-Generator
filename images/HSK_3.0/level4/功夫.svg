<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light / Energy Beam -->
    <linearGradient id="goldenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Wood Texture / Post Gradients -->
    <linearGradient id="woodPost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Wooden Floor -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33180c"/>
      <stop offset="100%" stop-color="#180b04"/>
    </linearGradient>

    <!-- Kinetic Slash/Energy Effect -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Dojo Window & Moonlight) -->
  <g opacity="0.15">
    <!-- Traditional Moon Gate Outline -->
    <circle cx="120" cy="110" r="85" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <!-- Diagonal Bamboo Silhouettes in background -->
    <line x1="40" y1="200" x2="40" y2="40" stroke="#64748b" stroke-width="4"/>
    <line x1="28" y1="200" x2="28" y2="60" stroke="#64748b" stroke-width="2"/>
    <line x1="200" y1="200" x2="200" y2="30" stroke="#64748b" stroke-width="5"/>
  </g>

  <!-- Dramatic Ambient Light Cone -->
  <polygon points="120,0 20,200 220,200" fill="url(#goldenGlow)" opacity="0.6" style="mix-blend-mode: screen;"/>

  <!-- Wooden Floor Base -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="185" x2="240" y2="185" stroke="#451a03" stroke-width="2"/>
  <line x1="0" y1="205" x2="240" y2="205" stroke="#451a03" stroke-width="1.5"/>
  <line x1="0" y1="225" x2="240" y2="225" stroke="#451a03" stroke-width="1.5"/>

  <!-- Hanging Lanterns (Atmospheric Props) -->
  <g transform="translate(180, 20)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#475569" stroke-width="1.5"/>
    <path d="M-10 30 L10 30 L14 60 L-14 60 Z" fill="#ef4444" filter="url(#shadow)"/>
    <ellipse cx="0" cy="30" rx="10" ry="3" fill="#b91c1c"/>
    <ellipse cx="0" cy="60" rx="14" ry="4" fill="#b91c1c"/>
    <path d="M-5 60 L-5 75 L5 75 L5 60" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <g transform="translate(60, 10)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#475569" stroke-width="1.5"/>
    <path d="M-8 20 L8 20 L11 45 L-11 45 Z" fill="#ef4444" filter="url(#shadow)"/>
    <ellipse cx="0" cy="20" rx="8" ry="2.5" fill="#b91c1c"/>
    <ellipse cx="0" cy="45" rx="11" ry="3" fill="#b91c1c"/>
  </g>

  <!-- MAIN SCENE: Kung Fu Training Dummy (Muk Yan Jong) & Props -->
  
  <!-- Wooden Dummy Shadow on Floor -->
  <ellipse cx="120" cy="183" rx="35" ry="10" fill="#000000" opacity="0.6"/>

  <!-- Dummy Main Trunk -->
  <rect x="106" y="70" width="28" height="115" rx="6" fill="url(#woodPost)" filter="url(#shadow)"/>
  <!-- Wood grain highlights -->
  <line x1="112" y1="75" x2="112" y2="180" stroke="#78350f" stroke-width="2" opacity="0.5"/>
  <line x1="126" y1="75" x2="126" y2="180" stroke="#451a03" stroke-width="2" opacity="0.4"/>

  <!-- Dummy Arms & Leg (Action-packed angled setup) -->
  <!-- Upper Left Arm (Sticking out) -->
  <path d="M106 95 L65 85 L67 77 L106 87 Z" fill="url(#woodPost)" filter="url(#shadow)"/>
  <circle cx="66" cy="81" r="5" fill="#78350f"/>

  <!-- Upper Right Arm -->
  <path d="M134 105 L175 95 L173 87 L134 97 Z" fill="url(#woodPost)" filter="url(#shadow)"/>
  <circle cx="174" cy="91" r="5" fill="#78350f"/>

  <!-- Lower Leg (Kicking target angle) -->
  <path d="M120 140 L155 175 L147 182 L115 148 Z" fill="url(#woodPost)" filter="url(#shadow)"/>

  <!-- Dummy Peg Holes and Details -->
  <circle cx="120" cy="91" r="3" fill="#451a03"/>
  <circle cx="120" cy="101" r="3" fill="#451a03"/>
  <circle cx="120" cy="144" r="4" fill="#451a03"/>

  <!-- ACTION ELEMENT: Dynamic Kick Impact & Motion Trails -->
  <!-- Speed lines radiating from impact point -->
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="145" y1="165" x2="165" y2="180"/>
    <line x1="152" y1="152" x2="178" y2="160"/>
    <line x1="138" y1="172" x2="152" y2="195"/>
  </g>

  <!-- Glowing Impact Shockwave (Burst) -->
  <path d="M 148 168 Q 160 160 170 175 Q 160 185 148 168 Z" fill="#fbbf24" opacity="0.9"/>
  <circle cx="148" cy="168" r="8" fill="#ffffff" opacity="0.7"/>

  <!-- Kinetic Energy Slash Arc (Representing mastery/skill/công phu in motion) -->
  <path d="M 60 120 Q 120 60 190 110" fill="none" stroke="url(#slashGrad)" stroke-width="5" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M 80 140 Q 130 90 180 135" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Foreground Props: Traditional Weapon / Staff leaned against the wall -->
  <g transform="translate(0, 0)" filter="url(#shadow)">
    <!-- Bo Staff -->
    <line x1="45" y1="210" x2="75" y2="90" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <line x1="47" y1="210" x2="77" y2="90" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Staff metallic brass caps -->
    <ellipse cx="46" cy="207" rx="3" ry="1.5" fill="#cbd5e1" transform="rotate(-75 46 207)"/>
    <ellipse cx="74" cy="93" rx="3" ry="1.5" fill="#cbd5e1" transform="rotate(-75 74 93)"/>
  </g>

  <!-- Small details: Energy sparks / leaf particles floating -->
  <circle cx="95" cy="115" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="150" cy="100" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="110" cy="65" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="135" cy="125" r="3" fill="#f43f5e" opacity="0.8"/>

  <!-- Vignette / Frame border soft shadow inside -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.08"/>
</svg>