<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100% " stop-color="#090d16" />
    </linearGradient>

    <!-- Map Board Gradient -->
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Compass Glow -->
    <radialGradient id="compassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- UI Glow / Estimating Radius -->
    <radialGradient id="radiusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background decorative floating map grid lines -->
  <g opacity="0.15">
    <circle cx="120" cy="115" r="85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="120" cy="115" r="55" fill="none" stroke="#38bdf8" stroke-width="1" />
    <line x1="35" y1="115" x2="205" y2="115" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="120" y1="30" x2="120" y2="200" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4" />
  </g>

  <!-- Surface / Table Base -->
  <path d="M 20 200 L 220 200 L 200 230 L 40 230 Z" fill="#090d16" opacity="0.8" />
  <line x1="20" y1="200" x2="220" y2="200" stroke="#334155" stroke-width="2" />

  <!-- --- SCENE: Map & Estimation Setup --- -->

  <!-- Rolled Map / Blueprint Base -->
  <g filter="url(#shadow)">
    <!-- Map Paper -->
    <path d="M 45 75 L 185 55 L 195 165 L 55 185 Z" fill="url(#mapGrad)" stroke="#475569" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Map Grid Details -->
    <path d="M 70 120 Q 120 100 160 85" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <path d="M 60 150 Q 110 135 175 115" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <path d="M 90 80 Q 100 130 85 170" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  </g>

  <!-- Dynamic Estimation Radius (Approximately Area) -->
  <g transform="translate(130, 110)">
    <!-- Outer Pulsing Range Ring -->
    <circle cx="0" cy="0" r="48" fill="url(#radiusGlow)" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7" />
    
    <!-- Inner Range Ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    
    <!-- Approx wave ripples -->
    <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.15" />
  </g>

  <!-- Start Destination Pin (A) -->
  <g transform="translate(75, 140)" filter="url(#shadow)">
    <circle cx="0" cy="-6" r="6" fill="#10b981" />
    <path d="M 0 0 L -3 -12 L 3 -12 Z" fill="#10b981" />
    <circle cx="0" cy="-6" r="2" fill="#ffffff" />
  </g>

  <!-- Target Destination Pin with 'Approximate' Radius Marker (B) -->
  <g transform="translate(130, 110)" filter="url(#shadow)">
    <!-- Pulsing glowing beacon -->
    <circle cx="0" cy="0" r="18" fill="url(#compassGlow)" />
    
    <!-- Pin body -->
    <path d="M 0 10 C 0 10 -10 -2 -10 -10 C -10 -15 -5 -20 0 -20 C 5 -20 10 -15 10 -10 C 10 -2 0 10 0 10 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
    <circle cx="0" cy="-10" r="4" fill="#ffffff" />
  </g>

  <!-- Dotted Trajectory Arc with Question Mark / Estimation Symbol Vibe -->
  <path d="M 80 134 Q 100 95 124 104" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" filter="url(#glow)" />
  <path d="M 80 134 Q 100 95 124 104" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 6" />

  <!-- --- PROPS & CONTEXTUAL ELEMENTS --- -->

  <!-- Modern Metallic Compass / Estimation Tool -->
  <g transform="translate(65, 75) rotate(-15)" filter="url(#shadow)">
    <!-- Compass Body (Circular) -->
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5" />
    <circle cx="0" cy="0" r="18" fill="#0f172a" />
    
    <!-- Compass Rose / Needle pointing approximately -->
    <polygon points="0,-14 3,0 0,12 -3,0" fill="#ef4444" />
    <polygon points="0,14 3,0 0,-12 -3,0" fill="#94a3b8" />
    <circle cx="0" cy="0" r="2.5" fill="#fbbf24" />
    
    <!-- Compass Loop top -->
    <rect x="-3" y="-27" width="6" height="6" rx="1" fill="none" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- Estimation Hourglass / Time-Approximate Concept Prop -->
  <g transform="translate(170, 110)" filter="url(#shadow)">
    <!-- Glass body frame -->
    <path d="M -10 -22 L 10 -22 L 6 -10 L 10 2 L 10 4 C 10 12 4 16 0 16 C -4 16 -10 12 -10 4 L -10 2 L -6 -10 Z" fill="#38bdf8" fill-opacity="0.1" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Sand bottom (accumulating) -->
    <path d="M -8 3 L 8 3 L 6 12 C 4 14 2 15 0 15 C -2 15 -4 14 -6 12 Z" fill="#f59e0b" />
    
    <!-- Sand top (draining) -->
    <path d="M -7 -18 L 7 -18 L 5 -10 L -5 -10 Z" fill="#f59e0b" />
    
    <!-- Falling sand stream -->
    <line x1="0" y1="-10" x2="0" y2="3" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Wooden caps -->
    <rect x="-12" y="-25" width="24" height="4" rx="2" fill="#b45309" />
    <rect x="-12" y="21" width="24" height="4" rx="2" fill="#b45309" />
  </g>

  <!-- Magnifying Glass for "Calculating/Approximating" Focus -->
  <g transform="translate(145, 155) rotate(25)" filter="url(#shadow)">
    <!-- Handle -->
    <rect x="-3" y="15" width="6" height="22" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1" />
    <!-- Metal Connector -->
    <rect x="-4" y="12" width="8" height="5" fill="#94a3b8" />
    <!-- Glass Rim -->
    <circle cx="0" cy="0" r="16" fill="#38bdf8" fill-opacity="0.15" stroke="#fbbf24" stroke-width="3" />
    <!-- Lens highlight reflection -->
    <path d="M -10 -6 Q -2 -12 6 -8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Floating Sparkles / Approximate Measurement Indicators -->
  <g fill="#fbbf24">
    <path d="M 110 55 L 112 62 L 119 64 L 112 66 L 110 73 L 108 66 L 101 64 L 108 62 Z" opacity="0.9" transform="scale(0.7) translate(60, 20)" />
    <path d="M 45 105 L 46.5 110 L 51.5 111.5 L 46.5 113 L 45 118 L 43.5 113 L 38.5 111.5 L 43.5 110 Z" opacity="0.6" transform="scale(0.5) translate(20, 90)" />
    <path d="M 185 85 L 186 89 L 190 90 L 186 91 L 185 95 L 184 91 L 180 90 L 184 89 Z" fill="#38bdf8" opacity="0.8" />
  </g>

</svg>