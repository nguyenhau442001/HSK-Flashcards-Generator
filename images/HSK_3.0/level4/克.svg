<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Background Glow -->
  <circle cx="120" cy="120" r="90" fill="#1e293b" opacity="0.6"/>
  
  <!-- Countertop / Surface -->
  <path d="M 30,190 L 210,190 L 225,220 L 15,220 Z" fill="#334155"/>
  <ellipse cx="120" cy="190" rx="90" ry="12" fill="#475569"/>

  <!-- Kitchen Scale Base -->
  <path d="M 85,160 L 155,160 L 165,190 L 75,190 Z" fill="#64748b"/>
  <rect x="95" y="145" width="50" height="20" rx="4" fill="#94a3b8"/>
  <!-- Scale Dial/Display -->
  <circle cx="120" cy="155" r="12" fill="#0f172a"/>
  <circle cx="120" cy="155" r="9" fill="#f8fafc"/>
  <line x1="120" y1="155" x2="125" y2="151" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Scale Platform -->
  <path d="M 70,140 L 170,140 L 180,145 L 60,145 Z" fill="#cbd5e1"/>

  <!-- Meat Slab (Contextual Example: Tảng thịt - Slab of Meat) -->
  <!-- Meat Under-layer/Fat -->
  <path d="M 85,110 C 85,100 100,95 120,98 C 145,95 160,102 155,115 C 160,125 150,135 130,138 C 100,140 80,130 85,110 Z" fill="#fbcfe8"/>
  <!-- Main Red Meat Body -->
  <path d="M 88,112 C 88,104 102,99 120,102 C 142,99 155,106 150,116 C 155,124 145,132 128,135 C 102,136 85,128 88,112 Z" fill="#f43f5e"/>
  
  <!-- Marbling Lines (Fat details) -->
  <path d="M 105,112 Q 115,118 125,110" fill="none" stroke="#ffe4e6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120,122 Q 130,125 138,118" fill="none" stroke="#ffe4e6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 98,120 Q 105,125 112,120" fill="none" stroke="#ffe4e6" stroke-width="2" stroke-linecap="round"/>

  <!-- Shiny highlight on meat -->
  <path d="M 100,105 Q 110,103 120,107" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Precision Weights Set (Representing grams/measurement) -->
  <!-- Weight 1 (Cylindrical brass weight) -->
  <rect x="40" y="165" width="18" height="25" rx="3" fill="#f59e0b"/>
  <ellipse cx="49" cy="165" rx="9" ry="3" fill="#fbbf24"/>
  <ellipse cx="49" cy="167" rx="6" ry="1.5" fill="#d97706" opacity="0.5"/>

  <!-- Weight 2 (Smaller stacked weight) -->
  <rect x="23" y="172" width="14" height="18" rx="2" fill="#fbbf24"/>
  <ellipse cx="30" cy="172" rx="7" ry="2.5" fill="#fde047"/>

  <!-- Sprinkled Herbs/Context Props (Peppercorns/Rosemary) -->
  <circle cx="155" cy="130" r="3" fill="#065f46"/>
  <circle cx="162" cy="136" r="2.5" fill="#047857"/>
  <path d="M 148,138 Q 152,135 158,140" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Digital Glow / Measurement vibe elements -->
  <circle cx="120" cy="70" r="18" fill="#38bdf8" opacity="0.15"/>
  <circle cx="120" cy="70" r="12" fill="#38bdf8" opacity="0.25"/>
  <path d="M 114,70 L 120,64 L 126,70" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="120" y1="64" x2="120" y2="76" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sparkles / Highlights for app UI polish -->
  <path d="M 185,75 L 188,82 L 195,85 L 188,88 L 185,95 L 182,88 L 175,85 L 182,82 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 55,90 L 57,94 L 61,96 L 57,98 L 55,102 L 53,98 L 49,96 L 53,94 Z" fill="#38bdf8" opacity="0.6"/>

</svg>