  <!-- Smoke/Atmospheric effect -->
  <path d="M170 100 Q180 80 170 60 Q160 40 170 20" fill="none" stroke="#64748b" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Coffee Mug -->
  <rect x="20" y="150" width="30" height="30" rx="4" fill="#f59e0b"/>
  <path d="M50 155 Q60 155 60 165 Q60 175 50 175" fill="none" stroke="#f59e0b" stroke-width="4"/>
  
  <!-- Desk clutter -->
  <circle cx="210" cy="200" r="8" fill="#38bdf8"/>
  <rect x="190" y="210" width="20" height="5" rx="2" fill="#10b981"/>
