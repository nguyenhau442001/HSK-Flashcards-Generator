<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- Laptop Body -->
  <rect x="60" y="100" width="120" height="80" rx="4" fill="#64748b"/>
  <rect x="65" y="105" width="110" height="70" fill="#0f172a"/>
  
  <!-- Screen Content: The "Severe" Problem (Cracked Screen) -->
  <path d="M75 120 L165 160 M165 120 L75 160" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="140" r="15" fill="none" stroke="#ec4899" stroke-width="4" stroke-dasharray="6 6"/>
  
  <!-- Warning Elements -->
  <path d="M190 80 L210 110 L170 110 Z" fill="#fb923c"/>
  <rect x="188" y="90" width="4" height="10" rx="2" fill="#0f172a"/>
