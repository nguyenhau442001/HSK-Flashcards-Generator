<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Metallic/Bin Gradients -->
    <linearGradient id="binOuter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="binInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Eco-Green Accents -->
    <linearGradient id="ecoGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <!-- Floor surface -->
  <ellipse cx="120" cy="215" rx="90" ry="15" fill="#090d16" opacity="0.6"/>
  <!-- Ambient Eco Glow on Floor -->
  <ellipse cx="120" cy="180" rx="70" ry="12" fill="url(#ecoGlow)" filter="url(#glow)"/>

  <!-- Background Environment/Wall details -->
  <path d="M40 40 L200 40" stroke="#334155" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M40 70 L160 70" stroke="#334155" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
  
  <!-- Holographic Scanner / Reduction Aura -->
  <path d="M 75 110 L 45 150 L 195 150 L 165 110 Z" fill="url(#beamGrad)" />
  <ellipse cx="120" cy="110" rx="45" ry="12" fill="#34d399" opacity="0.15" filter="url(#glow)"/>

  <!-- 3D Isometric-ish Smart Bin (Representing Reduction/Minimizing Waste) -->
  <!-- Bin Back Lip -->
  <ellipse cx="120" cy="125" rx="42" ry="10" fill="#475569"/>
  <!-- Bin Inner Depth -->
  <ellipse cx="120" cy="127" rx="38" ry="8" fill="url(#binInner)"/>

  <!-- Bin Body -->
  <path d="M 78 125 
           L 86 195 
           C 86 202, 154 202, 154 195 
           L 162 125 Z" 
        fill="url(#binOuter)"/>
  
  <!-- Bin Body Highlight (Reflective vector sheen) -->
  <path d="M 95 130 
           L 100 190 
           C 100 190, 107 190, 109 130 Z" 
        fill="#ffffff" opacity="0.08"/>

  <!-- Smart Eco-Band on Bin -->
  <path d="M 81 150 L 159 150 L 158 162 L 82 162 Z" fill="#0f172a" opacity="0.6"/>
  <!-- Glowing Reduced Status Indicator -->
  <circle cx="120" cy="156" r="4" fill="#34d399" filter="url(#glow)"/>
  <circle cx="120" cy="156" r="2.5" fill="#ffffff"/>

  <!-- Bin Front Rim -->
  <ellipse cx="120" cy="125" rx="42" ry="10" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- ACTION-PACKED FALLING/DISAPPEARING OBJECTS (Illustrating Reduction) -->
  <!-- Object 1: Large Box turning into energy particles (Being Reduced) -->
  <g transform="translate(0, -10)">
    <!-- Fading Box -->
    <path d="M 105 85 L 135 85 L 145 105 L 115 105 Z" fill="#fb923c" opacity="0.6"/>
    <path d="M 105 85 L 115 75 L 145 75 L 135 85 Z" fill="#fdba74" opacity="0.6"/>
    <path d="M 135 85 L 145 75 L 145 105 L 135 105 Z" fill="#f97316" opacity="0.5"/>
    
    <!-- Disintegration upward / conversion particles -->
    <circle cx="125" cy="70" r="3" fill="#34d399" filter="url(#glow)"/>
    <circle cx="110" cy="65" r="2" fill="#38bdf8"/>
    <circle cx="135" cy="60" r="1.5" fill="#34d399"/>
  </g>

  <!-- Object 2: Clean falling waste paper/cup plunging cleanly into the bin -->
  <g transform="translate(-35, -20) rotate(-15 120 100)">
    <!-- Crumpled Paper ball -->
    <circle cx="120" cy="100" r="11" fill="#f8fafc"/>
    <path d="M 113 93 Q 120 97 127 94" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 112 104 Q 118 101 125 107" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Object 3: Small dynamic action debris getting minimized -->
  <g transform="translate(40, -5) rotate(25 120 100)">
    <rect x="115" y="95" width="10" height="10" rx="2" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Dynamic Energy Swirls / Reduction Effect Lines -->
  <path d="M 90 90 Q 105 110 115 120" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>
  <path d="M 150 90 Q 135 110 125 120" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>

  <!-- Floating Green Eco Leaves (Symbolizing reduction of footprint/waste) -->
  <g transform="translate(-45, -40)">
    <path d="M140 80 C 140 70, 155 65, 160 75 C 165 85, 150 95, 140 80 Z" fill="#10b981" filter="url(#glow)"/>
    <path d="M140 80 Q 148 78 153 73" stroke="#6ee7b7" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(15, -60) scale(0.7)">
    <path d="M140 80 C 140 70, 155 65, 160 75 C 165 85, 150 95, 140 80 Z" fill="#34d399" filter="url(#glow)"/>
    <path d="M140 80 Q 148 78 153 73" stroke="#a7f3d0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Highlights -->
  <circle cx="75" cy="55" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="175" cy="65" r="2" fill="#34d399" opacity="0.6" filter="url(#glow)"/>
  <circle cx="165" cy="185" r="1" fill="#fbbf24" opacity="0.4"/>
  <circle cx="65" cy="170" r="1.5" fill="#38bdf8" opacity="0.5"/>
</svg>