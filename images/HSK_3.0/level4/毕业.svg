<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- Golden Hour Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Confetti / Particle Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Character Robe Gradient -->
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting & Architecture in Background -->
  <g opacity="0.4">
    <!-- Campus Arch / Window Silhouette -->
    <path d="M40 240 L40 140 C40 110, 60 90, 120 90 C180 90, 200 110, 200 140 L200 240 Z" fill="#0f172a" />
    <path d="M50 240 L50 145 C50 120, 70 100, 120 100 C170 100, 190 120, 190 145 L190 240 Z" fill="url(#skyGrad)" />
    <!-- Sunbeams / Rays -->
    <polygon points="120,90 20,240 60,240" fill="#f59e0b" opacity="0.1" />
    <polygon points="120,90 180,240 220,240" fill="#f59e0b" opacity="0.1" />
    <polygon points="120,90 90,240 150,240" fill="#fbbf24" opacity="0.15" />
  </g>

  <!-- Floating Confetti & Streamers (Celebration) -->
  <g filter="url(#glow)">
    <!-- Streamers -->
    <path d="M 20 80 Q 35 60, 50 90 T 80 100" fill="none" stroke="url(#pinkGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 190 60 Q 210 80, 200 110 T 170 130" fill="none" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Confetti Pieces -->
    <rect x="35" y="40" width="6" height="12" rx="2" fill="url(#goldGrad)" transform="rotate(25 38 46)" />
    <rect x="180" y="90" width="8" height="6" rx="1.5" fill="url(#pinkGrad)" transform="rotate(-15 184 93)" />
    <circle cx="55" cy="140" r="4" fill="url(#tealGrad)" />
    <circle cx="170" cy="45" r="3" fill="url(#goldGrad)" />
    <polygon points="200,160 205,170 195,170" fill="url(#pinkGrad)" />
    <polygon points="30,180 34,188 26,188" fill="url(#goldGrad)" />
    <rect x="140" y="50" width="5" height="10" rx="1" fill="url(#tealGrad)" transform="rotate(45 142 55)" />
    <circle cx="90" cy="50" r="2.5" fill="url(#pinkGrad)" />
  </g>

  <!-- Central Character: Graduate Student -->
  <g transform="translate(0, 10)">
    
    <!-- Body & Graduation Robe -->
    <g id="body">
      <!-- Robe Base -->
      <path d="M 90 140 L 150 140 C 165 140, 175 160, 180 200 L 190 230 L 50 230 L 60 200 C 65 160, 75 140, 90 140 Z" fill="url(#robeGrad)" />
      <!-- Robe Flaps / V-neck -->
      <path d="M 105 140 L 120 180 L 135 140 Z" fill="#3b82f6" opacity="0.3" />
      <path d="M 112 140 L 120 185 L 128 140 Z" fill="#f59e0b" />
      
      <!-- Arms Raised Dynamically in Victory -->
      <!-- Left Arm (Viewer's Left, character's right - holding diploma high) -->
      <path d="M 90 145 Q 65 110, 50 85" fill="none" stroke="#1e3a8a" stroke-width="18" stroke-linecap="round" />
      <!-- Left Hand -->
      <circle cx="45" cy="80" r="8" fill="#fde047" />

      <!-- Right Arm (Viewer's Right, character's left - punching air) -->
      <path d="M 150 145 Q 175 110, 195 95" fill="none" stroke="#1e3a8a" stroke-width="18" stroke-linecap="round" />
      <!-- Right Hand -->
      <circle cx="200" cy="90" r="8" fill="#fde047" />
    </g>

    <!-- Neck & Head -->
    <g id="head">
      <rect x="110" y="125" width="20" height="25" rx="8" fill="#fde047" />
      
      <!-- Head Base -->
      <circle cx="120" cy="115" r="28" fill="#fde047" />
      
      <!-- Cheeks (Excited Blush) -->
      <circle cx="104" cy="122" r="5" fill="#f43f5e" opacity="0.4" />
      <circle cx="136" cy="122" r="5" fill="#f43f5e" opacity="0.4" />

      <!-- Hair -->
      <path d="M 95 110 C 95 90, 110 85, 120 85 C 130 85, 145 90, 145 110 C 145 115, 140 120, 140 120 C 140 120, 135 100, 120 100 C 105 100, 100 120, 100 120 C 100 120, 95 115, 95 110 Z" fill="#0f172a" />
      <!-- Friendly hair tuft -->
      <path d="M 120 85 C 122 75, 130 75, 133 80" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

      <!-- Facial Expression: Overjoyed / Laughing -->
      <!-- Eyes (Happy Arcs) -->
      <path d="M 106 112 Q 112 106, 118 112" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 122 112 Q 128 106, 134 112" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
      
      <!-- Open Big Laughing Mouth -->
      <path d="M 110 120 C 110 130, 130 130, 130 120 Z" fill="#881337" />
      <!-- Tongue -->
      <path d="M 115 125 C 115 128, 125 128, 125 125 Z" fill="#f43f5e" />
    </g>

    <!-- Graduation Cap (Mortarboard) & Tassel -->
    <g id="cap">
      <!-- Cap Base (Skull cap part) -->
      <path d="M 96 98 C 96 85, 144 85, 144 98 Z" fill="#0f172a" />
      
      <!-- Mortarboard Diamond Top -->
      <polygon points="120,72 165,88 120,104 75,88" fill="#0f172a" />
      <!-- Top Highlight Plane for Depth -->
      <polygon points="120,72 165,88 120,89 75,88" fill="#334155" />

      <!-- Center Button -->
      <circle cx="120" cy="88" r="3" fill="#fbbf24" />

      <!-- Golden Tassel hanging dynamically to the right -->
      <path d="M 120 88 Q 145 95, 142 125" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
      <!-- Tassel Fringe -->
      <circle cx="142" cy="128" r="4" fill="#f59e0b" />
    </g>

    <!-- PROPS: Flying Diploma Scroll in the Air -->
    <g id="diploma" transform="translate(-10, -20) rotate(-15 45 75)">
      <!-- Rolled Paper -->
      <rect x="35" y="70" width="30" height="12" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Red Ribbon Tie -->
      <rect x="47" y="70" width="6" height="12" fill="#ef4444" />
      <!-- Ribbon Bow -->
      <path d="M 45 68 C 40 64, 42 60, 48 68" fill="#ef4444" />
      <path d="M 55 68 C 60 64, 58 60, 52 68" fill="#ef4444" />
      <!-- Sparkle on Diploma -->
      <circle cx="40" cy="74" r="1.5" fill="#fbbf24" filter="url(#glow)" />
    </g>

  </g>

  <!-- Foreground Dynamic Confetti & Energy Bursts -->
  <g filter="url(#glow)">
    <!-- Glowing Star 1 -->
    <path d="M 205 130 L 208 138 L 216 141 L 208 144 L 205 152 L 202 144 L 194 141 L 202 138 Z" fill="#fbbf24" opacity="0.9" />
    <!-- Glowing Star 2 -->
    <path d="M 35 110 L 37 115 L 42 117 L 37 119 L 35 124 L 33 119 L 28 117 L 33 115 Z" fill="#fef08a" opacity="0.8" />
    <!-- Additional Confetti Streamers -->
    <path d="M 70 210 Q 90 220, 110 200 T 150 215" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <circle cx="120" cy="225" r="3.5" fill="url(#pinkGrad)" />
    <rect x="180" y="190" width="6" height="10" rx="2" fill="url(#tealGrad)" transform="rotate(30 183 195)" />
    <rect x="50" y="150" width="7" height="7" rx="1.5" fill="url(#goldGrad)" transform="rotate(-20 53 153)" />
  </g>

  <!-- Vignette / Framing Shadow Edge for polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>