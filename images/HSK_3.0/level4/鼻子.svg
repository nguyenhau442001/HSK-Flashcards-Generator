<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Window/Background Detail -->
  <rect x="140" y="40" width="60" height="80" rx="4" fill="#334155" opacity="0.3"/>
  <circle cx="180" cy="60" r="2" fill="#94a3b8"/>
  <circle cx="160" cy="80" r="1.5" fill="#94a3b8"/>

  <!-- Steam/Aroma Swirls -->
  <path d="M100,160 Q110,130 90,110 T100,70" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" from="0,150" to="150,0" dur="3s" repeatCount="indefinite" />
  </path>
  <path d="M120,155 Q135,125 115,105 T125,65" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Character Profile -->
  <!-- Neck -->
  <path d="M60,200 Q70,180 75,170 L95,170 Q100,185 105,210" fill="#fcd34d"/>
  
  <!-- Face Profile -->
  <path d="M60,60 
           Q85,55 95,70 
           L100,105 
           L125,125 
           L102,132 
           Q105,145 100,155 
           Q90,165 75,165 
           L60,165" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  
  <!-- The Nose Detail (Focal Point) -->
  <!-- Highlight on the bridge to show "high/tall" nose -->
  <path d="M101,106 L123,124" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Nostril shadow -->
  <path d="M108,128 Q112,126 115,128" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Eye (Closed in enjoyment) -->
  <path d="M82,95 Q88,92 94,95" stroke="#451a03" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Hair -->
  <path d="M60,60 Q50,55 45,75 Q40,100 50,120 Q55,135 60,140 L60,60" fill="#451a03"/>
  <path d="M60,60 Q75,45 95,55 Q110,65 100,85" fill="#451a03"/>

  <!-- Coffee Mug -->
  <path d="M80,170 L140,170 Q145,170 145,175 L145,205 Q145,215 135,215 L85,215 Q75,215 75,205 L75,175 Q75,170 80,170" fill="#ec4899"/>
  <path d="M145,180 Q155,180 155,190 Q155,200 145,200" stroke="#ec4899" stroke-width="4" fill="none"/>
  <!-- Liquid in Mug -->
  <ellipse cx="110" cy="175" rx="30" ry="5" fill="#451a03"/>
  
  <!-- Lighting effects -->
  <circle cx="120" cy="120" r="40" fill="url(#glow)" opacity="0.6"/>
  
  <!-- Floating particles -->
  <circle cx="130" cy="90" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="110" cy="50" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="145" cy="110" r="1" fill="#fbbf24" opacity="0.4"/>
</svg>