<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155" stop-opacity="1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light / Environment -->
  <circle cx="120" cy="110" r="95" fill="url(#tableGlow)" />

  <!-- Wooden Table Surface (Oval perspective) -->
  <ellipse cx="120" cy="140" rx="100" ry="60" fill="url(#woodTable)" filter="url(#dropShadow)" />
  <ellipse cx="120" cy="137" rx="90" ry="52" fill="#222b38" opacity="0.6"/>

  <!-- Background Props: Cozy Restaurant/Home Setting -->
  <!-- Chopstick Rest 1 -->
  <rect x="75" y="115" width="16" height="6" rx="3" fill="#fb923c" transform="rotate(-15 83 118)" />
  <!-- Chopsticks -->
  <path d="M 60,90 L 145,128" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" filter="url(#dropShadow)"/>
  <path d="M 63,94 L 148,132" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Side Dish Bowl 1 (Left) -->
  <ellipse cx="65" cy="125" rx="22" ry="14" fill="#334155" />
  <ellipse cx="65" cy="123" rx="18" ry="10" fill="#10b981" />
  <circle cx="62" cy="122" r="3" fill="#34d399" />
  <circle cx="70" cy="124" r="2.5" fill="#059669" />

  <!-- Side Dish Bowl 2 (Right Background) -->
  <ellipse cx="170" cy="110" rx="18" ry="12" fill="#334155" />
  <ellipse cx="170" cy="108" rx="14" ry="9" fill="#ef4444" />
  <circle cx="167" cy="107" r="2" fill="#f87171" />

  <!-- MAIN SUBJECT: The Hearty Meal (Large Rice/Noodle Bowl representing 'bữa ăn') -->
  <!-- Bowl Shadow -->
  <ellipse cx="120" cy="165" rx="38" ry="12" fill="#0f172a" opacity="0.8"/>
  
  <!-- Bowl Base -->
  <path d="M 95,145 L 105,160 L 135,160 L 145,145 Z" fill="#94a3b8" />
  
  <!-- Outer Bowl -->
  <path d="M 80,115 C 80,145 160,145 160,115 Z" fill="url(#bowlGrad)" filter="url(#dropShadow)" />
  
  <!-- Bowl Rim -->
  <ellipse cx="120" cy="115" rx="40" ry="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Inner Content (The Meal / Food) -->
  <ellipse cx="120" cy="116" rx="36" ry="8" fill="url(#soupGrad)" />
  
  <!-- Rice / Noodles / Toppings inside the meal -->
  <circle cx="110" cy="114" r="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="125" cy="113" r="9" fill="#fef08a" opacity="0.9"/>
  <circle cx="132" cy="117" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="103" cy="118" r="7" fill="#fbbf24" opacity="0.9"/>

  <!-- Delicious Food Details (Chopsticks picking up food or steam) -->
  <!-- Steaming Effect -->
  <path d="M 110,100 C 105,90 115,80 110,70" fill="none" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 125,95 C 130,85 120,75 125,65" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 135,102 C 140,92 135,82 140,72" fill="none" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Additional Meal Context: Spoon resting on edge -->
  <path d="M 155,100 Q 165,115 150,125" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" filter="url(#dropShadow)" />
  <circle cx="152" cy="122" r="5" fill="#cbd5e1" />

  <!-- Foreground Ambient Glow & Warmth Highlights -->
  <circle cx="120" cy="50" r="30" fill="#fbbf24" opacity="0.08" filter="blur(10px)" />
</svg>