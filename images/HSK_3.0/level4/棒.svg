<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Basketball Wood Floor Gradient -->
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Basketball Gradient -->
    <radialGradient id="ballGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>

    <!-- Gold/Awesome Glow Gradient -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting / Awesome Glow behind hoop -->
  <circle cx="120" cy="110" r="90" fill="url(#goldGlow)" />

  <!-- Basketball Court Background Elements -->
  <!-- Court wood floor section -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#courtGrad)" opacity="0.9" />
  <!-- Floor lines -->
  <path d="M 120 170 C 80 200 40 240 20 240" stroke="#fef3c7" stroke-width="2" fill="none" opacity="0.4" />
  <path d="M 120 170 C 160 200 200 240 220 240" stroke="#fef3c7" stroke-width="2" fill="none" opacity="0.4" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#f59e0b" stroke-width="3" opacity="0.6" />

  <!-- Action Sparks / Excellence Flares -->
  <g transform="translate(190, 60)">
    <path d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(50, 80) scale(0.6)">
    <path d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(75, 45) scale(0.8)">
    <path d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#f59e0b" />
  </g>

  <!-- Basketball Backboard Support & Backboard -->
  <rect x="70" y="25" width="100" height="65" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
  <rect x="85" y="40" width="70" height="35" rx="2" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />

  <!-- Basketball Rim (Cây gậy / Hoop context) -->
  <ellipse cx="120" cy="95" rx="26" ry="10" fill="none" stroke="url(#rimGrad)" stroke-width="5" />
  
  <!-- Net -->
  <path d="M 96 97 L 104 130 L 112 99 L 120 132 L 128 99 L 136 130 L 144 97" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.8" />
  <path d="M 100 110 L 140 110" fill="none" stroke="#f8fafc" stroke-width="1" opacity="0.5" />
  <path d="M 104 120 L 136 120" fill="none" stroke="#f8fafc" stroke-width="1" opacity="0.5" />

  <!-- Flying Basketball (Action Shot) -->
  <g transform="translate(120, 115)">
    <circle cx="0" cy="0" r="22" fill="url(#ballGrad)" />
    <!-- Ball seams -->
    <path d="M -22 0 C -10 -10 -10 10 0 22" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 22 0 C 10 -10 10 10 0 22" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 0 -22 C -10 -10 10 -10 22 0" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 0 -22 C -10 10 10 10 22 0" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" opacity="0" />
    <!-- Dynamic motion swoosh lines behind ball -->
    <path d="M -15 15 L -28 28" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M -5 22 L -12 35" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Trophy / "Awesome" Badge Object (representing 棒 / excellent) -->
  <g transform="translate(120, 175)">
    <!-- Trophy Glow -->
    <circle cx="0" cy="-15" r="30" fill="#fbbf24" opacity="0.2" filter="blur(4px)" />
    
    <!-- Trophy Base -->
    <path d="M -12 12 L 12 12 L 9 20 L -9 20 Z" fill="#475569" />
    <rect x="-16" y="20" width="32" height="6" rx="2" fill="#334155" />
    
    <!-- Trophy Stem -->
    <rect x="-4" y="2" width="8" height="10" fill="#cbd5e1" />
    
    <!-- Trophy Cup -->
    <path d="M -16 -18 C -16 6 16 6 16 -18 Z" fill="url(#ballGrad)" stroke="#fef3c7" stroke-width="2" />
    <path d="M -16 -18 L 16 -18 L 13 -14 L -13 -14 Z" fill="#fbbf24" />
    
    <!-- Trophy Handles -->
    <path d="M -14 -15 C -24 -15 -22 -2 C -13 0" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M 14 -15 C 24 -15 22 -2 13 0" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    
    <!-- Star Emblem on Trophy -->
    <path d="M 0 -12 L 2 -6 L 8 -6 L 3 -2 L 5 4 L 0 1 L -5 4 L -3 -2 L -8 -6 L -2 -6 Z" fill="#fef3c7" transform="scale(0.7) translate(0, -6)" />
  </g>

  <!-- Dynamic foreground ambient light particles -->
  <circle cx="45" cy="130" r="3" fill="#38bdf8" opacity="0.6" />
  <circle cx="195" cy="140" r="2.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="170" cy="110" r="1.5" fill="#fbbf24" opacity="0.5" />
  <circle cx="70" cy="100" r="2" fill="#38bdf8" opacity="0.4" />
</svg>