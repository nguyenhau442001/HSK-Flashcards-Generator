<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall & Floor Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- ATM Body Gradient -->
    <linearGradient id="atmBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Cash Glow -->
    <linearGradient id="cashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Golden Coin / Light -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Shadow Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Floor -->
  <rect x="0" y="0" width="240" height="170" fill="url(#wallGrad)"/>
  <rect x="0" y="170" width="240" height="70" fill="#090d16"/>
  <!-- Floor line reflection -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- Ambient Light from ATM Screen -->
  <path d="M 85 105 L 30 200 L 170 200 Z" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <!-- ATM Machine Structure -->
  <g filter="url(#shadow)">
    <!-- Main Chassis -->
    <rect x="75" y="35" width="90" height="145" rx="8" fill="url(#atmBody)" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Top Beacon / Logo Area -->
    <path d="M 83 35 L 157 35 L 165 47 L 75 47 Z" fill="#1e293b"/>
    <circle cx="120" cy="41" r="3" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Screen Bezel -->
    <rect x="85" y="55" width="70" height="50" rx="4" fill="#0f172a"/>
    <!-- Screen -->
    <rect x="88" y="58" width="64" height="44" rx="2" fill="url(#screenGrad)"/>
    <!-- Abstract UI Elements on Screen -->
    <rect x="96" y="66" width="24" height="6" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="96" y="78" width="48" height="4" rx="1" fill="#bae6fd" opacity="0.5"/>
    <rect x="96" y="86" width="32" height="4" rx="1" fill="#bae6fd" opacity="0.5"/>
    <circle cx="140" cy="69" r="4" fill="#10b981"/>

    <!-- Card Insertion Slot (Top Right of Keypad) -->
    <rect x="133" y="115" width="16" height="4" rx="2" fill="#0f172a"/>
    <rect x="135" y="116" width="12" height="2" fill="#38bdf8" opacity="0.8"/>

    <!-- Keypad Area -->
    <rect x="90" y="115" width="35" height="30" rx="3" fill="#1e293b"/>
    <!-- Keypad Grid Dots -->
    <circle.pad cx="97" cy="122" r="1.5" fill="#64748b"/><circle.pad cx="107" cy="122" r="1.5" fill="#64748b"/><circle.pad cx="117" cy="122" r="1.5" fill="#64748b"/>
    <circle.pad cx="97" cy="129" r="1.5" fill="#64748b"/><circle.pad cx="107" cy="129" r="1.5" fill="#64748b"/><circle.pad cx="117" cy="129" r="1.5" fill="#64748b"/>
    <circle.pad cx="97" cy="136" r="1.5" fill="#64748b"/><circle.pad cx="107" cy="136" r="1.5" fill="#64748b"/><circle.pad cx="117" cy="136" r="1.5" fill="#64748b"/>

    <!-- Cash Dispenser Slot (Bottom) -->
    <rect x="90" y="152" width="60" height="14" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <rect x="96" y="157" width="48" height="4" rx="2" fill="#1e293b"/>
  </g>

  <!-- Plant Decor on the Side for Environmental Richness -->
  <g transform="translate(190, 130)">
    <!-- Pot -->
    <path d="M 5 20 L 15 45 L 35 45 L 45 20 Z" fill="#64748b" filter="url(#shadow)"/>
    <ellipse cx="25" cy="20" rx="20" ry="4" fill="#94a3b8"/>
    <!-- Leaves -->
    <path d="M 25 16 Q 10 -10 0 -5" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <path d="M 25 16 Q 35 -15 48 -10" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    <path d="M 25 16 Q 25 -25 25 -35" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
    <path d="M 25 16 Q 5 10 -5 20" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ACTION: Cash emerging from the ATM slot (Representing "Lấy" / To Withdraw/Take) -->
  <g filter="url(#shadow)">
    <!-- Stack of Cash Bills Sliding Out -->
    <!-- Bill 3 (Back) -->
    <rect x="88" y="132" width="64" height="26" rx="3" fill="#059669" transform="rotate(-5 120 145)"/>
    <!-- Bill 2 (Middle) -->
    <rect x="85" y="125" width="66" height="26" rx="3" fill="#10b981" transform="rotate(-3 120 138)"/>
    <!-- Bill 1 (Front, Main Focal Point) -->
    <g transform="translate(80, 115) rotate(-2)">
      <rect width="72" height="28" rx="4" fill="url(#cashGrad)" stroke="#065f46" stroke-width="1.5"/>
      <!-- Inner border on cash -->
      <rect x="4" y="4" width="64" height="20" rx="2" fill="none" stroke="#047857" stroke-width="1" stroke-dasharray="3 2"/>
      <!-- Currency Symbol / Graphic element (Abstract, non-text) -->
      <circle cx="36" cy="14" r="6" fill="#065f46" opacity="0.3"/>
      <circle cx="36" cy="14" r="4" fill="#34d399"/>
    </g>
  </g>

  <!-- Golden Success Sparkles / Coins Flying Upward -->
  <g filter="url(#glow)">
    <circle cx="70" cy="110" r="5" fill="url(#goldGrad)"/>
    <circle cx="165" cy="100" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="120" cy="95" r="2.5" fill="#fde047"/>
    
    <!-- Sparkle Stars -->
    <path d="M 60 90 L 62 95 L 67 97 L 62 99 L 60 104 L 58 99 L 53 97 L 58 95 Z" fill="#fbbf24"/>
    <path d="M 160 125 L 161.5 129 L 165.5 130.5 L 161.5 132 L 160 136 L 158.5 132 L 154.5 130.5 L 158.5 129 Z" fill="#fbbf24"/>
  </g>

  <!-- Foreground Atmospheric Lighting / Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#090d16" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none"/>
</svg>