<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(40, 60)">
    <!-- Desk surface -->
    <rect x="0" y="100" width="160" height="10" rx="2" fill="#334155"/>
    
    <!-- Stack of documents -->
    <rect x="20" y="80" width="120" height="20" rx="2" fill="#f8fafc"/>
    <rect x="25" y="75" width="110" height="5" rx="2" fill="#e2e8f0"/>
    <rect x="30" y="70" width="100" height="5" rx="2" fill="#cbd5e1"/>
    
    <!-- Folder -->
    <path d="M10 110 L150 110 L140 150 L20 150 Z" fill="#fbbf24"/>
    <path d="M10 110 L150 110 L145 125 L15 125 Z" fill="#f59e0b"/>
    
    <!-- Pen -->
    <rect x="130" y="50" width="10" height="40" rx="2" fill="#38bdf8"/>
    <circle cx="135" cy="45" r="3" fill="#38bdf8"/>
    
    <!-- Coffee mug -->
    <circle cx="170" cy="130" r="25" fill="#ec4899"/>
    <path d="M195 120 A 10 10 0 0 1 195 140" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Ambient light/glow -->
    <circle cx="120" cy="40" r="40" fill="#fb923c" opacity="0.15"/>
    <circle cx="40" cy="140" r="30" fill="#10b981" opacity="0.1"/>
  </g>
</svg>