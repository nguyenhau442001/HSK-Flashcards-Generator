<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Reading Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Cozy Window Night Sky -->
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Lamp Lighting -->
  <circle cx="120" cy="110" r="110" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Background Environment: Cozy Room Interior -->
  <!-- Wallpaper / Back Wall -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#1e293b" opacity="0.5"/>

  <!-- Window showing night staying/lingering outside -->
  <g transform="translate(145, 30)">
    <rect x="0" y="0" width="60" height="85" rx="6" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <rect x="4" y="4" width="52" height="77" rx="4" fill="url(#nightSky)"/>
    <!-- Distant cute crescent moon -->
    <path d="M 40 20 A 10 10 0 0 1 30 35 A 12 12 0 0 0 40 20 Z" fill="#fde047" opacity="0.9"/>
    <!-- Window Frame Cross -->
    <line x1="30" y1="4" x2="30" y2="81" stroke="#334155" stroke-width="2"/>
    <line x1="4" y1="42" x2="56" y2="42" stroke="#334155" stroke-width="2"/>
    <!-- Indoor reflection curve -->
    <path d="M 6 10 Q 25 30 10 70" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.1"/>
  </g>

  <!-- Bookshelf on Back Wall -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="70" height="8" rx="2" fill="#475569"/>
    <!-- Colorful stacked books -->
    <rect x="8" y="-18" width="10" height="18" rx="1" fill="#ec4899"/>
    <rect x="19" y="-22" width="12" height="22" rx="1" fill="#38bdf8"/>
    <rect x="32" y="-16" width="9" height="16" rx="1" fill="#10b981"/>
    <rect x="43" y="-20" width="14" height="20" rx="1" fill="#f59e0b"/>
  </g>

  <!-- Houseplant representing staying/growing roots -->
  <g transform="translate(32, 108)" filter="url(#shadow)">
    <!-- Pot -->
    <path d="M 4 18 L 12 36 L 28 36 L 36 18 Z" fill="#cbd5e1"/>
    <ellipse cx="20" cy="18" rx="16" ry="4" fill="#e2e8f0"/>
    <!-- Vines hanging/staying -->
    <path d="M 15 18 Q 8 28 6 42" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 25 18 Q 32 30 34 48" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Leaves -->
    <circle cx="6" cy="42" r="4" fill="#34d399"/>
    <circle cx="34" cy="48" r="5" fill="#10b981"/>
    <circle cx="10" cy="24" r="4" fill="#34d399"/>
    <circle cx="30" cy="26" r="4.5" fill="#059669"/>
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 15 155 L 225 155 L 210 205 L 30 205 Z" fill="#b45309" filter="url(#shadow)"/>
  <!-- Desk front edge (3D thickness) -->
  <path d="M 30 205 L 210 205 L 210 212 L 30 212 Z" fill="#78350f"/>
  <!-- Wood grain highlight -->
  <path d="M 40 165 L 200 165" stroke="#d97706" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- Desk Lamp (Casting Warm Light) -->
  <g transform="translate(185, 120)">
    <!-- Base -->
    <ellipse cx="0" cy="35" rx="14" ry="5" fill="#64748b"/>
    <!-- Stand -->
    <path d="M -2 35 C -2 15 -15 -10 -25 -15" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Lamp Shade -->
    <path d="M -38 -25 L -12 -25 L -5 -10 L -45 -10 Z" fill="#fbbf24" filter="url(#shadow)"/>
    <!-- Light Beam Polygon -->
    <polygon points="-25,-12 -45,100 45,100" fill="#fef08a" opacity="0.12" style="mix-blend-mode: screen;"/>
  </g>

  <!-- MAIN FOCUS: Open Book & Cozy Reading Setup (Representing 'staying in to read') -->
  <g transform="translate(85, 135)" filter="url(#shadow)">
    <!-- Book Shadow -->
    <ellipse cx="35" cy="45" rx="42" ry="12" fill="#000000" opacity="0.5"/>

    <!-- Open Book Base (White Pages) -->
    <path d="M -5 35 Q 35 15 75 35 L 70 75 Q 35 60 0 75 Z" fill="#f8fafc"/>
    <path d="M 35 18 L 35 68" stroke="#cbd5e1" stroke-width="2"/> <!-- Center binding spine -->

    <!-- Left Page Content (Abstract text lines & warm reading graphics) -->
    <line x1="8" y1="28" x2="28" y2="30" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="38" x2="26" y2="40" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="48" x2="22" y2="50" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Bookmark ribbon hanging out -->
    <path d="M 22 40 L 15 75 L 18 78 L 22 73 Z" fill="#ef4444"/>

    <!-- Right Page Content -->
    <line x1="44" y1="30" x2="64" y2="28" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="40" x2="66" y2="38" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="44" y1="50" x2="60" y2="48" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Cute bookmark marker (Stay / Bookmark concept) -->
    <circle cx="54" cy="40" r="6" fill="#38bdf8"/>
    <path d="M 52 38 L 54 43 L 57 37" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Warm Teacup (Completing the 'Staying in' atmosphere) -->
  <g transform="translate(60, 165)" filter="url(#shadow)">
    <!-- Saucer -->
    <ellipse cx="0" cy="14" rx="16" ry="5" fill="#cbd5e1"/>
    <!-- Cup Body -->
    <path d="M -10 0 L -8 14 C -8 15 -7 16 -6 16 L 6 16 C 7 16 8 15 8 14 L 10 0 Z" fill="#ffffff"/>
    <!-- Cup Rim -->
    <ellipse cx="0" cy="0" rx="10" ry="3" fill="#f1f5f9"/>
    <!-- Tea Liquid Inside -->
    <ellipse cx="0" cy="1" rx="8" ry="2" fill="#d97706"/>
    <!-- Handle -->
    <path d="M 8 3 C 14 3 14 11 8 12" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Rising Steam (Staying cozy indoors) -->
    <path d="M -3 -3 Q -6 -10 -2 -16 Q 2 -22 -1 -28" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 3 -2 Q 6 -8 3 -14 Q 0 -20 4 -26" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- Cozy Floor Rug at the bottom foreground -->
  <ellipse cx="120" cy="225" rx="85" ry="12" fill="#334155" opacity="0.6"/>
  <ellipse cx="120" cy="225" rx="75" ry="9" fill="#475569" opacity="0.4"/>
</svg>