<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window/Campus Glow Gradient -->
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Tablet Screen Glow -->
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Ambient Warm Lamp Light -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: University Library / Lecture Hall Interior -->
  <!-- Background Wall -->
  <rect x="0" y="0" width="240" height="150" fill="#1e293b"/>
  <!-- Floor -->
  <path d="M0 150 L240 150 L240 240 L0 240 Z" fill="#0f172a"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Large Arched University Window showing campus tree/sky -->
  <path d="M165 40 L215 40 L215 130 L165 130 Z" fill="url(#windowGrad)" rx="25"/>
  <path d="M165 65 Q190 35 215 65 L215 130 L165 130 Z" fill="url(#windowGrad)"/>
  <!-- Window Frame -->
  <path d="M163 63 Q190 33 217 63 L217 132 L163 132 Z" fill="none" stroke="#475569" stroke-width="3"/>
  <line x1="190" y1="52" x2="190" y2="130" stroke="#475569" stroke-width="2"/>
  <line x1="165" y1="95" x2="215" y2="95" stroke="#475569" stroke-width="2"/>
  <!-- Campus tree silhouette outside window -->
  <path d="M190 100 Q195 85 185 75 Q195 65 205 75 Q210 85 190 100 Z" fill="#059669" opacity="0.4"/>
  <rect x="188" y="98" width="4" height="25" fill="#334155"/>

  <!-- Bookshelf Background Props -->
  <g opacity="0.6">
    <rect x="15" y="50" width="60" height="70" fill="#334155" rx="2"/>
    <line x1="15" y1="72" x2="75" y2="72" stroke="#1e293b" stroke-width="2"/>
    <line x1="15" y1="95" x2="75" y2="95" stroke="#1e293b" stroke-width="2"/>
    <!-- Colorful books on shelf -->
    <rect x="20" y="56" width="8" height="16" fill="#f43f5e"/>
    <rect x="30" y="54" width="6" height="18" fill="#38bdf8"/>
    <rect x="38" y="58" width="10" height="14" fill="#fbbf24"/>
    <rect x="20" y="78" width="12" height="17" fill="#10b981"/>
    <rect x="34" y="80" width="7" height="15" fill="#a855f7"/>
  </g>

  <!-- Ambient Light from Study Lamp -->
  <circle cx="95" cy="50" r="70" fill="url(#lampGlow)"/>
  <!-- Modern Desk Lamp -->
  <path d="M85 80 L95 45 L105 80 Z" fill="#64748b"/>
  <path d="M75 145 L115 145" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M95 145 L95 50" stroke="#64748b" stroke-width="3"/>
  <path d="M95 50 Q95 40 105 40 L115 40" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="115" cy="40" rx="6" ry="10" fill="#fbbf24"/>

  <!-- FOREGROUND: University Study Desk -->
  <path d="M20 145 L180 145 L190 175 L10 175 Z" fill="#334155"/>
  <path d="M15 145 L185 145 L185 150 L15 150 Z" fill="#475569"/>

  <!-- CHARACTER: University Student studying the Course Curriculum -->
  <!-- Chair Back -->
  <path d="M60 170 L80 110 L95 110 L85 170 Z" fill="#1e293b"/>

  <!-- Student Body & Hoodie (Academic/Youthful Navy & Orange accent) -->
  <path d="M55 175 Q60 130 90 130 Q120 130 125 175 Z" fill="#0284c7"/>
  <!-- Hoodie Strings & Details -->
  <path d="M82 138 L82 150" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round"/>
  <path d="M98 138 L98 150" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck & Head -->
  <path d="M82 122 L98 122 L98 132 L82 132 Z" fill="#fbcfe8"/>
  <circle cx="90" cy="105" r="18" fill="#fbcfe8"/>
  
  <!-- Hair (Stylized Dark Neat Hair) -->
  <path d="M72 102 Q75 85 90 85 Q105 85 108 102 Q108 112 102 110 Q90 92 78 110 Q72 112 72 102 Z" fill="#0f172a"/>

  <!-- Facial Expressions (Focused, engaged in learning) -->
  <circle cx="85" cy="106" r="1.5" fill="#1e293b"/>
  <circle cx="95" cy="106" r="1.5" fill="#1e293b"/>
  <!-- Glasses -->
  <rect x="81" y="101" width="9" height="7" rx="1" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="90" y="101" width="9" height="7" rx="1" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="90" y1="104" x2="90" y2="104" stroke="#0f172a" stroke-width="1.2"/>
  <path d="M87 114 Q90 117 93 114" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arms & Hands -->
  <!-- Left arm interacting with laptop/tablet -->
  <path d="M65 150 Q70 135 85 140" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
  <circle cx="85" cy="142" r="4" fill="#fbcfe8"/>
  <!-- Right arm writing / taking notes -->
  <path d="M115 150 Q110 135 100 142" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
  <circle cx="98" cy="143" r="4" fill="#fbcfe8"/>

  <!-- PROPS: University Course Materials (Laptop, Digital Tablet showing Curriculum graph, Textbook) -->
  
  <!-- Open Textbook on Desk -->
  <g transform="translate(115, 148) rotate(-10)">
    <path d="M0 0 L30 -10 L50 10 L20 20 Z" fill="#f8fafc"/>
    <path d="M20 20 L50 10 L50 25 L20 35 Z" fill="#e2e8f0"/>
    <!-- Page lines indicating text -->
    <line x1="8" y1="-2" x2="22" y2="-7" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="7" y1="2" x2="20" y2="-3" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="32" y1="-2" x2="44" y2="3" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="33" y1="2" x2="45" y2="7" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Digital Tablet / E-Learning Device (The core "Course / Curriculum" Display) -->
  <g transform="translate(60, 140)">
    <!-- Tablet Body -->
    <rect x="0" y="0" width="55" height="38" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- Screen -->
    <rect x="3" y="3" width="49" height="32" rx="2" fill="url(#screenGrad)"/>
    
    <!-- UI Elements representing "University Curriculum / Course Schedule" -->
    <!-- Syllabus header bar -->
    <rect x="7" y="6" width="20" height="4" rx="1" fill="#38bdf8"/>
    <rect x="30" y="6" width="18" height="4" rx="1" fill="#334155"/>
    
    <!-- Course modules / progress bars (representing university modules) -->
    <!-- Module 1: Completed -->
    <rect x="7" y="14" width="41" height="5" rx="1.5" fill="#1e293b"/>
    <rect x="7" y="14" width="30" height="5" rx="1.5" fill="#10b981"/>
    <circle cx="43" cy="16.5" r="1.5" fill="#f8fafc"/>

    <!-- Module 2: Active Course / Curriculum highlight -->
    <rect x="7" y="22" width="41" height="5" rx="1.5" fill="#1e293b"/>
    <rect x="7" y="22" width="18" height="5" rx="1.5" fill="#f59e0b"/>
    <circle cx="43" cy="24.5" r="1.5" fill="#f8fafc"/>
  </g>

  <!-- Coffee Mug for late-night university studying -->
  <g transform="translate(35, 148)">
    <rect x="0" y="0" width="12" height="15" rx="2" fill="#f8fafc"/>
    <path d="M12 3 C16 3 16 11 12 11" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Steam wisps -->
    <path d="M3 -3 Q5 -6 3 -9" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M8 -2 Q10 -5 8 -8" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Graduation Cap Icon subtly placed as a prop/sticker on the laptop lid or background to reinforce 'University Course' context -->
  <g transform="translate(155, 150) rotate(15) scale(0.6)">
    <polygon points="20,0 40,10 20,20 0,10" fill="#1e293b"/>
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M10,15 L10,25 C10,28 30,28 30,25 L30,15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M32,12 L35,22 L33,23" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="33" cy="23" r="1.5" fill="#fbbf24"/>
  </g>

</svg>