<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Canvas Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Counter Top Gradient -->
    <linearGradient id="counterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for "Portion / Food" -->
    <radialGradient id="foodGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Ceramic Bowl Gradient -->
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Takeout Box Gradient -->
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="boxSideGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Chopsticks Wood Gradient -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light/Glow behind the scene -->
  <circle cx="120" cy="130" r="80" fill="url(#foodGlow)"/>

  <!-- Atmospheric Background Elements (Restaurant/Kitchen Vibe) -->
  <g opacity="0.4">
    <!-- Shelf line -->
    <rect x="30" y="45" width="180" height="4" rx="2" fill="#475569"/>
    <!-- Small sauce bottle 1 -->
    <path d="M 65 25 L 75 25 L 73 45 L 67 45 Z" fill="#38bdf8"/>
    <rect x="68" y="20" width="4" height="6" rx="1" fill="#f8fafc"/>
    <!-- Small sauce bottle 2 -->
    <path d="M 165 30 L 173 30 L 171 45 L 167 45 Z" fill="#ec4899"/>
    <rect x="168" y="25" width="3" height="6" rx="1" fill="#f8fafc"/>
  </g>

  <!-- Wooden Counter / Table Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#counterGrad)"/>
  <!-- Counter Edge Highlight -->
  <rect x="0" y="170" width="240" height="4" fill="#475569" opacity="0.8"/>

  <!-- ================= MAIN SUBJECT: "份" (A specific portion/serving of food) ================= -->
  <!-- We illustrate this as a distinct, complete meal set / portion: A main bowl of fried rice + takeout box + portion tag/accent -->
  
  <g id="mealPortion">
    <!-- Drop Shadow for Bowl & Tray -->
    <ellipse cx="120" cy="172" rx="65" ry="14" fill="#020617" opacity="0.6"/>

    <!-- Bamboo Serving Mat / Tray -->
    <ellipse cx="120" cy="168" rx="85" ry="22" fill="#334155"/>
    <ellipse cx="120" cy="166" rx="82" ry="20" fill="#1e293b"/>
    <ellipse cx="120" cy="164" rx="80" ry="18" fill="#475569"/>

    <!-- BACK BOWL (Soup / Side) -->
    <g transform="translate(170, 135)">
      <ellipse cx="0" cy="0" rx="22" ry="8" fill="#334155"/>
      <path d="M -22 0 C -22 14 22 14 22 0 Z" fill="url(#bowlGrad)"/>
      <!-- Soup Content -->
      <ellipse cx="0" cy="1" rx="19" ry="6" fill="#f59e0b"/>
      <!-- Green onion garnish -->
      <circle cx="-4" cy="1" r="1.5" fill="#10b981"/>
      <circle cx="5" cy="2" r="1" fill="#10b981"/>
      <circle cx="2" cy="0" r="1.2" fill="#10b981"/>
    </g>

    <!-- MAIN BOWL (Fried Rice Portion) -->
    <g transform="translate(100, 140)">
      <!-- Bowl Rim -->
      <ellipse cx="0" cy="0" rx="42" ry="14" fill="#e2e8f0"/>
      <!-- Bowl Body -->
      <path d="M -42 0 C -42 30 42 30 42 0 Z" fill="url(#bowlGrad)"/>
      <path d="M -25 21 C -15 27 15 27 25 21 Z" fill="#94a3b8"/> <!-- Bowl base shadow -->
      
      <!-- Delicious Fried Rice Heap (The "Portion") -->
      <ellipse cx="0" cy="-3" rx="38" ry="12" fill="#fbbf24"/>
      <!-- Rice Texture Details (Golden grains & mixed veggies) -->
      <circle cx="-15" cy="-5" r="3" fill="#f59e0b"/>
      <circle cx="10" cy="-6" r="2.5" fill="#f59e0b"/>
      <circle cx="-5" cy="-8" r="3" fill="#fb923c"/>
      <circle cx="20" cy="-2" r="2.5" fill="#f59e0b"/>
      <circle cx="0" cy="-4" r="3" fill="#f8fafc"/>
      
      <!-- Carrot cubes (Orange) -->
      <rect x="-8" y="-3" width="4" height="4" rx="1" fill="#ea580c" transform="rotate(15 -8 -3)"/>
      <rect x="12" y="-5" width="3" height="3" rx="0.8" fill="#ea580c" transform="rotate(45 12 -5)"/>
      
      <!-- Green Peas / Scallions -->
      <circle cx="-22" cy="-2" r="2" fill="#10b981"/>
      <circle cx="5" cy="-9" r="2" fill="#10b981"/>
      <circle cx="18" cy="-4" r="2.2" fill="#10b981"/>
      
      <!-- Egg bits -->
      <path d="M -15 -10 Q -12 -12 -9 -9 T -3 -8" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 8 -8 Q 12 -10 15 -7" stroke="#fef08a" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- SECONDARY ITEM: Takeout / Side Dish Box (Reinforcing the "Portion" concept) -->
    <g transform="translate(45, 130)">
      <!-- Box shadow -->
      <ellipse cx="0" cy="22" rx="20" ry="6" fill="#0f172a" opacity="0.5"/>
      <!-- Box Base -->
      <path d="M -16 5 L 16 5 L 13 25 L -13 25 Z" fill="url(#boxSideGrad)"/>
      <!-- Box Front Panel -->
      <path d="M -18 -3 L 18 -3 L 16 5 L -16 5 Z" fill="url(#boxGrad)"/>
      <!-- Cute heart/star detail on box representing a complete portion item -->
      <path d="M 0 5 L 2 9 L 6 10 L 3 13 L 4 17 L 0 15 L -4 17 L -3 13 L -6 10 L -2 9 Z" fill="#ec4899" transform="scale(0.5) translate(0, 10)"/>
      <!-- Box Lid Folded Open Top -->
      <path d="M -18 -3 L 0 -12 L 18 -3 Z" fill="#e2e8f0"/>
      <!-- Steam wisps rising from takeout box -->
      <path d="M -4 -16 Q -8 -22 0 -28 T -2 -38" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 6 -15 Q 10 -20 4 -26 T 8 -34" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    </g>

    <!-- CHOPSTICKS resting neatly (Indicates ready-to-eat portion) -->
    <g transform="translate(110, 115) rotate(-15)">
      <rect x="-35" y="-3" width="70" height="2.5" rx="1.25" fill="url(#woodGrad)"/>
      <rect x="-35" y="1" width="70" height="2.5" rx="1.25" fill="url(#woodGrad)"/>
      <!-- Chopstick golden tips -->
      <rect x="30" y="-3" width="5" height="2.5" fill="#fef08a"/>
      <rect x="30" y="1" width="5" height="2.5" fill="#fef08a"/>
    </g>

    <!-- Steam rising from main bowl -->
    <g opacity="0.7">
      <path d="M 90 115 Q 85 100 95 90 T 90 70" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 110 112 Q 118 98 108 88 T 114 68" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Atmospheric Foreground Accent (Out-of-focus bubble/dot for depth) -->
  <circle cx="205" cy="110" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="35" cy="100" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="25" cy="190" r="5" fill="#ec4899" opacity="0.4"/>
  <circle cx="215" cy="195" r="3" fill="#10b981" opacity="0.5"/>
</svg>