<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Diary Cover Gradient (Teal/Emerald rich tone) -->
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Diary Page Gradient -->
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="15%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Mug Gradient -->
    <linearGradient id="mugGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting (Warm overhead glow simulating a desk lamp) -->
  <circle cx="170" cy="50" r="90" fill="url(#lampGlow)"/>

  <!-- Background Elements: Bookshelf / Wall details -->
  <path d="M20 75 L110 75" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <rect x="30" y="45" width="12" height="30" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="44" y="50" width="10" height="25" rx="2" fill="#64748b" opacity="0.6"/>
  <rect x="56" y="40" width="14" height="35" rx="2" fill="#334155" opacity="0.6"/>

  <!-- Wooden/Modern Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#deskGrad)"/>
  <path d="M0 160 L240 160" stroke="#475569" stroke-width="2" opacity="0.8"/>

  <!-- Potted Succulent (Context Prop) -->
  <g transform="translate(200, 130)" filter="url(#softShadow)">
    <!-- Pot -->
    <path d="M-10 15 L10 15 L7 30 L-7 30 Z" fill="#f8fafc"/>
    <ellipse cx="0" cy="15" rx="10" ry="3" fill="#e2e8f0"/>
    <!-- Leaves -->
    <circle cx="0" cy="8" r="7" fill="#10b981"/>
    <circle cx="-5" cy="11" r="5" fill="#34d399"/>
    <circle cx="5" cy="11" r="5" fill="#059669"/>
    <circle cx="0" cy="3" r="5" fill="#34d399"/>
  </g>

  <!-- Hot Coffee Mug (Context Prop) -->
  <g transform="translate(185, 145)" filter="url(#softShadow)">
    <!-- Steam -->
    <path d="M-3 -8 Q-7 -15 -3 -22 T-3 -36" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M7 -6 Q3 -13 7 -20 T7 -32" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <!-- Handle -->
    <path d="M10 5 C18 5 18 20 10 20" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <!-- Mug Body -->
    <rect x="-8" y="0" width="20" height="26" rx="4" fill="url(#mugGrad)"/>
    <ellipse cx="2" cy="0" rx="10" ry="3" fill="#38bdf8"/>
    <ellipse cx="2" cy="3" rx="8" ry="2" fill="#78350f" opacity="0.8"/> <!-- Coffee -->
  </g>

  <!-- MAIN SUBJECT: DIARY (日记) -->
  <g transform="translate(50, 105)" filter="url(#shadow)">
    <!-- Shadow beneath diary -->
    <ellipse cx="70" cy="65" rx="60" ry="12" fill="#020617" opacity="0.6"/>

    <!-- Open Diary Book Base -->
    <!-- Left Cover -->
    <path d="M10 50 C10 45 15 42 20 42 L70 47 L70 95 L20 95 C15 95 10 90 10 85 Z" fill="url(#coverGrad)"/>
    <!-- Right Cover -->
    <path d="M130 50 C130 45 125 42 120 42 L70 47 L70 95 L120 95 C125 95 130 90 130 85 Z" fill="url(#coverGrad)"/>

    <!-- Pages Spread -->
    <!-- Left Page -->
    <path d="M15 48 C15 45 18 43 22 43 L69 47 L69 90 L22 90 C18 90 15 87 15 84 Z" fill="url(#pageGrad)"/>
    <!-- Right Page -->
    <path d="M125 48 C125 45 122 43 118 43 L71 47 L71 90 L118 90 C122 90 125 87 125 84 Z" fill="url(#pageGrad)"/>

    <!-- Spine / Center Binding Shadow -->
    <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <path d="M68 46 L72 46 L72 91 L68 91 Z" fill="url(#spineGrad)"/>

    <!-- Bookmark Ribbon hanging out -->
    <path d="M68 90 L65 115 L70 120 L75 115 L72 90 Z" fill="#ef4444" filter="url(#softShadow)"/>

    <!-- Page Content Lines (Left Page) -->
    <line x1="25" y1="55" x2="55" y2="57" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="63" x2="60" y2="65" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="71" x2="50" y2="73" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="79" x2="58" y2="81" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>

    <!-- Page Content & Sketches (Right Page - actively being written) -->
    <line x1="80" y1="55" x2="115" y2="55" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="63" x2="105" y2="63" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="71" x2="112" y2="71" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Mini cute doodle drawn in diary (A tiny sun/heart sketch) -->
    <circle cx="95" cy="82" r="5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M92 82 L98 82 M95 79 L95 85" stroke="#f59e0b" stroke-width="1.2"/>

    <!-- Decorative Cover Elements (Golden foil star/emblem on diary cover edges) -->
    <circle cx="22" cy="55" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="22" cy="82" r="3" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Floating Fountain Pen / Writing Action -->
  <g transform="translate(130, 95) rotate(-35)" filter="url(#shadow)">
    <!-- Pen Cap/Body -->
    <path d="M0 0 L8 -2 L12 35 L-4 37 Z" fill="#3b82f6"/>
    <!-- Pen Grip/Tip -->
    <path d="M-4 37 L12 35 L4 50 L2 50 Z" fill="#e2e8f0"/>
    <!-- Golden Nib -->
    <path d="M4 50 L2 50 L3 56 L5 56 Z" fill="#fbbf24"/>
    <!-- Pen Clip -->
    <path d="M4 5 L6 5 L5 25 L3 25 Z" fill="#fbbf24"/>
  </g>

  <!-- Action Sparkles / Writing Energy (Highlighting the "Active/Real-world" vibe) -->
  <g fill="#fbbf24">
    <path d="M145 92 Q148 95 151 92 Q148 89 145 92 Z"/>
    <path d="M125 135 Q127 137 129 135 Q127 133 125 135 Z"/>
    <circle cx="110" cy="100" r="1.5" fill="#38bdf8"/>
    <circle cx="140" cy="115" r="2" fill="#34d399"/>
  </g>

</svg>