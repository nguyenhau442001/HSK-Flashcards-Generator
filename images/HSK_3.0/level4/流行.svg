<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Atmosphere -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31103f"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="vinylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting & Sparks (Popularity/Hype vibe) -->
  <circle cx="120" cy="120" r="100" fill="url(#stageGlow)"/>
  
  <g fill="#f43f5e" opacity="0.8">
    <circle cx="45" cy="55" r="3"/>
    <circle cx="195" cy="45" r="2"/>
    <circle cx="210" cy="130" r="3.5"/>
    <circle cx="30" cy="170" r="2.5"/>
  </g>
  <g fill="#fbbf24" opacity="0.9">
    <circle cx="70" cy="35" r="2"/>
    <circle cx="170" cy="70" r="3"/>
    <circle cx="190" cy="190" r="2.5"/>
    <circle cx="50" cy="120" r="2"/>
  </g>
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="110" cy="30" r="2.5"/>
    <circle cx="35" cy="95" r="3"/>
    <circle cx="200" cy="95" r="2"/>
  </g>

  <!-- Ambient Stage Lights (Concert / Trend Vibe) -->
  <polygon points="120,0 70,240 100,240" fill="#38bdf8" opacity="0.1"/>
  <polygon points="120,0 140,240 170,240" fill="#fb923c" opacity="0.1"/>
  <polygon points="120,0 30,240 50,240" fill="#ec4899" opacity="0.08"/>
  <polygon points="120,0 190,240 210,240" fill="#10b981" opacity="0.08"/>

  <!-- Floating Popularity / Trend Elements (Notes & Fire icons) -->
  <!-- Musical Note 1 -->
  <g transform="translate(42, 85) rotate(-15)">
    <ellipse cx="6" cy="18" rx="5" ry="4" fill="#38bdf8"/>
    <path d="M10 18 L10 4 L18 6 L18 8 L12 6 L12 18 Z" fill="#38bdf8"/>
    <ellipse cx="14" cy="16" rx="5" ry="4" fill="#38bdf8"/>
  </g>

  <!-- Musical Note 2 -->
  <g transform="translate(180, 75) rotate(20)">
    <circle cx="5" cy="15" r="4" fill="#ec4899"/>
    <path d="M9 15 L9 2 L17 5 L17 8 L11 6 L11 15 Z" fill="#ec4899"/>
    <circle cx="13" cy="13" r="4" fill="#ec4899"/>
  </g>

  <!-- Trending Fire / Hot Badge background aura -->
  <path d="M120 42 C125 50, 133 55, 133 63 C133 71, 127 75, 120 75 C113 75, 107 71, 107 63 C107 55, 115 50, 120 42 Z" fill="#f59e0b" opacity="0.2"/>

  <!-- CENTRAL SUBJECT: Modern Smartphone broadcasting a trending hit (Viral/Popular representation) -->
  <!-- Phone Shadow -->
  <rect x="73" y="47" width="94" height="150" rx="18" fill="#000000" opacity="0.4"/>
  
  <!-- Phone Body -->
  <rect x="70" y="44" width="100" height="152" rx="18" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="73" y="47" width="94" height="146" rx="16" fill="url(#phoneScreen)"/>

  <!-- Phone Notch & Speaker -->
  <rect x="102" y="52" width="36" height="5" rx="2.5" fill="#1e293b"/>

  <!-- Screen Content: Animated Equalizer & Vinyl Record -->
  <circle cx="120" cy="115" r="36" fill="url(#vinylGrad)" stroke="#475569" stroke-width="1.5"/>
  <circle cx="120" cy="115" r="14" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <circle cx="120" cy="115" r="4" fill="#fbbf24"/>
  
  <!-- Vinyl grooves -->
  <circle cx="120" cy="115" r="28" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.6"/>
  <circle cx="120" cy="115" r="22" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.6"/>

  <!-- Dynamic Equalizer Bars at bottom of screen -->
  <g transform="translate(85, 155)">
    <rect x="0" y="6" width="6" height="14" rx="3" fill="#38bdf8"/>
    <rect x="10" y="2" width="6" height="18" rx="3" fill="#ec4899"/>
    <rect x="20" y="10" width="6" height="10" rx="3" fill="#fbbf24"/>
    <rect x="30" y="0" width="6" height="20" rx="3" fill="#10b981"/>
    <rect x="40" y="8" width="6" height="12" rx="3" fill="#38bdf8"/>
    <rect x="50" y="4" width="6" height="16" rx="3" fill="#ec4899"/>
    <rect x="60" y="12" width="6" height="8" rx="3" fill="#fbbf24"/>
  </g>

  <!-- Streaming / Hearts / Likes floating up from phone -->
  <g transform="translate(135, 130)">
    <path d="M0 6 C0 2, 4 0, 7 3 C10 0, 14 2, 14 6 C14 11, 7 15, 7 15 C7 15, 0 11, 0 6 Z" fill="#ec4899" transform="scale(0.8)"/>
  </g>
  <g transform="translate(85, 110)">
    <path d="M0 6 C0 2, 4 0, 7 3 C10 0, 14 2, 14 6 C14 11, 7 15, 7 15 C7 15, 0 11, 0 6 Z" fill="#38bdf8" transform="scale(0.6)"/>
  </g>
  <g transform="translate(145, 90)">
    <path d="M0 6 C0 2, 4 0, 7 3 C10 0, 14 2, 14 6 C14 11, 7 15, 7 15 C7 15, 0 11, 0 6 Z" fill="#fbbf24" transform="scale(0.7)"/>
  </g>

  <!-- Foreground Contextual Props: Hot Trending Flame Icon Badge overlapping phone base -->
  <g transform="translate(108, 168)">
    <circle cx="12" cy="12" r="18" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
    <!-- Flame icon -->
    <path d="M12 4 C12 4, 7 9, 7 13 C7 16, 9 18, 12 19 C15 18, 17 16, 17 13 C17 9, 12 4, 12 4 Z" fill="#fbbf24"/>
    <path d="M12 9 C12 9, 9.5 12, 9.5 14.5 C9.5 16, 10.5 17, 12 17.5 C13.5 17, 14.5 16, 14.5 14.5 C14.5 12, 12 9, 12 9 Z" fill="#f43f5e"/>
  </g>

  <!-- Star sparkles for extra visual flair -->
  <path d="M 55 140 Q 55 145 50 145 Q 55 145 55 150 Q 55 145 60 145 Q 55 145 55 140 Z" fill="#fbbf24"/>
  <path d="M 185 130 Q 185 136 179 136 Q 185 136 185 142 Q 185 136 191 136 Q 185 136 185 130 Z" fill="#38bdf8"/>

  <!-- Ground reflection / Surface glow -->
  <ellipse cx="120" cy="204" rx="55" ry="6" fill="#0f172a"/>
  <ellipse cx="120" cy="202" rx="35" ry="3" fill="#38bdf8" opacity="0.3"/>
</svg>