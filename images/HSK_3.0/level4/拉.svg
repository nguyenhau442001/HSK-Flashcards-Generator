<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Amber Glow for Action -->
    <radialGradient id="actionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Door Gradient -->
    <linearGradient id="woodDoor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Glass Window Gradient -->
    <linearGradient id="windowGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Metallic Handle Gradient -->
    <linearGradient id="metalHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Clothing Gradient (Character) -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    
    <!-- Motion Lines Filter / Dash -->
    <style>
      .motion-dash {
        stroke-dasharray: 4 6;
        animation: pulse 1.5s infinite linear;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light/Glow around the pulling action -->
  <circle cx="120" cy="130" r="80" fill="url(#actionGlow)"/>

  <!-- ENVIRONMENT: Cozy Room Interior / Shop Front -->
  <!-- Floor -->
  <path d="M 10 210 L 230 210 L 240 240 L 0 240 Z" fill="#090d16"/>
  <!-- Wall baseboard -->
  <rect x="10" y="200" width="220" height="10" fill="#1e293b"/>

  <!-- Wall Plant (Context prop left) -->
  <path d="M 25 100 Q 30 110 25 130" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 25 115 Q 15 110 12 120" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 25 125 Q 38 120 40 130" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="25" cy="98" rx="8" ry="6" fill="#475569"/>

  <!-- THE MAIN OBJECT: A Realistic Wooden Door with Glass Panel -->
  <g id="door-structure">
    <!-- Door Frame -->
    <rect x="65" y="30" width="110" height="175" rx="4" fill="#334155"/>
    <rect x="70" y="35" width="100" height="165" rx="2" fill="url(#woodDoor)"/>

    <!-- Door Wood Panels & Details -->
    <rect x="78" y="45" width="84" height="75" rx="2" fill="#713f12" opacity="0.6"/>
    <!-- Glass Pane in Door -->
    <rect x="84" y="51" width="72" height="63" rx="1" fill="url(#windowGlass)"/>
    <!-- Window Grid -->
    <line x1="120" y1="51" x2="120" y2="114" stroke="#0284c7" stroke-width="2" opacity="0.4"/>
    <line x1="84" y1="82" x2="156" y2="82" stroke="#0284c7" stroke-width="2" opacity="0.4"/>

    <!-- Lower Wood Panel -->
    <rect x="78" y="128" width="84" height="64" rx="2" fill="#713f12" opacity="0.6"/>
    <rect x="84" y="134" width="72" height="52" rx="1" fill="#65280b" opacity="0.4"/>

    <!-- Door Hinges -->
    <rect x="68" y="60" width="4" height="12" rx="1" fill="#94a3b8"/>
    <rect x="68" y="150" width="4" height="12" rx="1" fill="#94a3b8"/>
  </g>

  <!-- THE ACTION: Pulling Handle and Dynamic Pull Elements -->
  <g id="door-handle-and-pull">
    <!-- Pull Arrow / Vector Arc indicating the "Pull" direction (Out of the door towards viewer) -->
    <path d="M 152 115 C 170 115, 185 130, 185 145" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="6 4"/>
    <polygon points="185,152 178,142 192,142" fill="#fbbf24"/>

    <!-- Heavy Vertical Pull Handle (The literal object being pulled) -->
    <!-- Shadow for depth -->
    <rect x="146" y="96" width="12" height="42" rx="3" fill="#0f172a" opacity="0.4"/>
    <!-- Handle Base Plates -->
    <ellipse cx="152" cy="100" rx="4" ry="2" fill="#64748b"/>
    <ellipse cx="152" cy="138" rx="4" ry="2" fill="#64748b"/>
    <!-- Handle Bar -->
    <rect x="148" y="98" width="8" height="40" rx="4" fill="url(#metalHandle)"/>
    <!-- Handle Specular Highlight -->
    <line x1="150" y1="102" x2="150" y2="134" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- CHARACTER PERFORMING THE ACTION: Energetic Person Pulling -->
  <g id="pulling-character">
    <!-- Character Body / Torso (Leaning back to pull) -->
    <path d="M 155 125 Q 180 120 195 145 L 180 170 Q 165 145 155 135 Z" fill="url(#shirtGrad)"/>

    <!-- Character Arm (Gripping the handle) -->
    <path d="M 152 118 Q 140 115 148 102" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Hand on Handle -->
    <circle cx="152" cy="116" r="6" fill="#fbcfe8"/>

    <!-- Character Head & Face (Determined expression) -->
    <circle cx="202" cy="132" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 188 132 C 188 120, 200 116, 212 124 C 215 128, 214 135, 210 135 C 205 135, 202 130, 195 130 Z" fill="#334155"/>
    <!-- Eye (Focused/Intense) -->
    <line x1="202" y1="130" x2="208" y2="132" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Character Legs (Bracing against the floor) -->
    <!-- Thigh / Leg 1 -->
    <path d="M 180 165 Q 195 175 205 195" stroke="url(#pantsGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Shoe 1 -->
    <ellipse cx="210" cy="198" rx="8" ry="4" fill="#0f172a"/>

    <!-- Leg 2 -->
    <path d="M 172 165 Q 160 180 150 198" stroke="url(#pantsGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Shoe 2 -->
    <ellipse cx="145" cy="201" rx="7" ry="4" fill="#0f172a"/>
  </g>

  <!-- ATMOSPHERIC DETAILS / FOREGROUND -->
  <!-- Floating dust particles / energy sparkles for vivid action feel -->
  <circle cx="110" cy="100" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="130" cy="80" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="170" cy="95" r="2.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="140" cy="150" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Notice board / Sign beside the door (Context prop right wall) -->
  <rect x="195" y="55" width="30" height="40" rx="2" fill="#e2e8f0"/>
  <rect x="200" y="62" width="20" height="4" rx="1" fill="#cbd5e1"/>
  <rect x="200" y="70" width="15" height="3" rx="1" fill="#cbd5e1"/>
  <rect x="200" y="76" width="18" height="3" rx="1" fill="#cbd5e1"/>
  <!-- Pin -->
  <circle cx="210" cy="58" r="1.5" fill="#ef4444"/>

  <!-- Floor shadow under character and door -->
  <ellipse cx="120" cy="208" r="55" fill="#020617" opacity="0.5"/>
</svg>