<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Blood Accent Gradient -->
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="80" r="120" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- SCENE BACKGROUND: Home Workshop / Kitchen Counter -->
  <!-- Back Wall -->
  <rect x="20" y="40" width="200" height="120" rx="4" fill="#334155" opacity="0.4"/>
  <!-- Wooden Countertop / Table -->
  <rect x="20" y="160" width="200" height="12" fill="#475569" rx="2"/>
  <rect x="15" y="172" width="210" height="36" fill="#1e293b"/>

  <!-- Context Props: Cutting Board & Knife (Accident Source) -->
  <g transform="translate(145, 120)">
    <!-- Cutting Board -->
    <path d="M 0 15 Q 0 5 10 5 L 45 5 Q 55 5 55 15 L 55 45 Q 55 55 45 55 L 10 55 Q 0 55 0 45 Z" fill="#b45309" opacity="0.8"/>
    <circle cx="10" cy="30" r="3" fill="#78350f" opacity="0.6"/>
    <!-- Knife -->
    <path d="M -15 25 L 25 18 L 35 22 L -15 32 Z" fill="#cbd5e1"/>
    <path d="M -30 28 L -15 26 L -15 31 L -30 33 Z" fill="#334155"/>
  </g>

  <!-- Dropped vegetable/fruit (Tomato/Red prop for context) -->
  <circle cx="130" cy="155" r="9" fill="#ef4444"/>
  <path d="M 130 146 Q 133 143 136 146" stroke="#15803d" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- CHARACTER: Man in distress holding his hand (受伤的人) -->
  <g id="injured-character">
    <!-- Body / Torso (Blue Hoodie) -->
    <path d="M 75 190 L 75 145 C 75 130, 90 120, 105 120 L 135 120 C 150 120, 165 130, 165 145 L 165 190 Z" fill="#38bdf8"/>
    <!-- Hoodie Hood & Collar details -->
    <path d="M 85 125 C 95 110, 145 110, 155 125 L 150 135 C 140 125, 100 125, 90 135 Z" fill="#0ea5e9"/>
    
    <!-- Head & Face -->
    <circle cx="120" cy="95" r="22" fill="#fed7aa"/>
    <!-- Hair (Dark modern crop) -->
    <path d="M 98 95 C 98 75, 142 75, 142 95 C 142 98, 138 92, 130 88 C 120 83, 110 83, 104 88 C 98 92, 98 95, 98 95 Z" fill="#334155"/>
    
    <!-- Pain Expression (Squinting eyes, open anxious mouth) -->
    <!-- Eyebrows tilted in pain -->
    <line x1="108" y1="91" x2="114" y2="93" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="126" y1="93" x2="132" y2="91" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes (closed/squinted) -->
    <path d="M 108 96 Q 111 99 114 96" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 126 96 Q 129 99 132 96" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Open Mouth (shock/pain gasp) -->
    <ellipse cx="120" cy="106" rx="4" ry="5" fill="#991b1b"/>
    <!-- Blush of stress / sweat drop -->
    <path d="M 135 85 C 137 87, 137 90, 135 91" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Left Arm (Reaching down/away) -->
    <path d="M 78 135 L 60 160 L 70 165" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Arm (Clutching injured hand near chest) -->
    <path d="M 162 135 Q 150 150, 135 140" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
    <!-- Injured Hand being tightly grabbed/held -->
    <circle cx="130" cy="142" r="8" fill="#fed7aa"/>
  </g>

  <!-- FOREGROUND / FOCAL ELEMENT: BLOOD ("流了很多血") -->
  <!-- Dynamic, expressive blood splatters and pooling representing "lots of blood" -->
  <g id="blood-elements">
    <!-- Splatter drops floating/falling -->
    <path d="M 115 152 C 115 149, 118 145, 118 142 C 118 139, 115 139, 115 142 C 115 145, 115 149, 115 152 Z" fill="url(#bloodGrad)"/>
    <circle cx="125" cy="158" r="2.5" fill="#f43f5e"/>
    <circle cx="108" cy="162" r="1.5" fill="#be123c"/>
    <circle cx="140" cy="150" r="3" fill="#e11d48"/>

    <!-- Main Blood Flow Drops from Hand -->
    <path d="M 126 145 Q 123 155, 120 165 Q 118 172, 122 176 Q 126 172, 125 165 Z" fill="url(#bloodGrad)"/>
    <path d="M 133 146 Q 136 158, 134 168" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Pooling Blood on Countertop (Conveying "a lot") -->
    <path d="M 100 178 C 100 174, 155 174, 160 178 C 165 182, 160 188, 140 189 C 110 190, 95 184, 100 178 Z" fill="url(#bloodGrad)" opacity="0.95"/>
    
    <!-- Glossy highlights on blood pool -->
    <path d="M 110 178 Q 120 176, 130 178" stroke="#fda4af" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 125 183 Q 135 181, 145 183" stroke="#fda4af" stroke-width="1" stroke-linecap="round" fill="none"/>
    
    <!-- Splatter droplets on counter surface -->
    <circle cx="92" cy="181" r="2" fill="#e11d48"/>
    <circle cx="168" cy="180" r="2.5" fill="#f43f5e"/>
    <circle cx="155" cy="185" r="1.5" fill="#be123c"/>
  </g>

  <!-- Medical/Urgency Accent Elements (Subtle warm cross glow in background or first aid kit hint) -->
  <g transform="translate(195, 45)" opacity="0.8">
    <rect x="0" y="0" width="24" height="24" rx="6" fill="#334155"/>
    <rect x="10" y="5" width="4" height="14" rx="1" fill="#f87171"/>
    <rect x="5" y="10" width="14" height="4" rx="1" fill="#f87171"/>
  </g>

</svg>