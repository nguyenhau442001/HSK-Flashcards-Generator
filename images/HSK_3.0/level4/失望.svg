<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="sweater-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Paper Shadow/Base -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light from Desk Lamp -->
  <circle cx="120" cy="80" r="120" fill="url(#lamp-glow)" style="mix-blend-mode: screen;"/>

  <!-- Wooden Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 166 L 240 166 L 240 170 L 0 170 Z" fill="#334155"/>

  <!-- BACKGROUND PROPS: Books & Study Materials -->
  <g id="bookshelf-background" opacity="0.6">
    <!-- Stack of books left -->
    <rect x="25" y="130" width="35" height="10" rx="2" fill="#475569"/>
    <rect x="20" y="140" width="45" height="12" rx="2" fill="#0d9488"/>
    <rect x="22" y="152" width="40" height="14" rx="2" fill="#4f46e5"/>
    
    <!-- Pen holder / cup right -->
    <rect x="185" y="132" width="22" height="34" rx="4" fill="#64748b"/>
    <path d="M 188 132 L 182 120 L 192 120 L 194 132 Z" fill="#ec4899"/>
    <path d="M 198 132 L 204 118 L 210 125 L 202 132 Z" fill="#38bdf8"/>
  </g>

  <!-- MAIN SCENE: The Exam Paper & Slumped Student -->
  <!-- Exam Paper with Low Score -->
  <g transform="translate(115, 140) rotate(-12)">
    <!-- Paper Sheet -->
    <rect x="-30" y="-40" width="60" height="75" rx="3" fill="url(#paper-grad)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Mock red score mark (Circle with low grade connotation) -->
    <circle cx="0" cy="-5" r="16" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M -8 -15 C -2 -18, 5 -10, 8 2" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -15 8 L 15 8" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M -15 18 L 5 18" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M -15 28 L 0 28" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Desk Lamp (Atmospheric framing) -->
  <path d="M 120 0 L 120 45" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M 95 45 L 145 45 L 135 25 L 105 25 Z" fill="#334155"/>
  <ellipse cx="120" cy="45" rx="25" ry="8" fill="#1e293b"/>

  <!-- STUDENT CHARACTER (Slumped posture, expressing 'Thất vọng') -->
  <g id="disappointed-character">
    <!-- Body / Shoulders slumped forward -->
    <path d="M 70 200 C 70 170, 90 155, 120 155 C 150 155, 170 170, 170 200 Z" fill="url(#sweater-grad)"/>

    <!-- Arms resting forward on the desk, hiding hands or supporting head -->
    <!-- Left Arm -->
    <path d="M 80 185 C 95 165, 120 165, 130 185" fill="none" stroke="#2563eb" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm -->
    <path d="M 160 185 C 145 165, 120 165, 110 185" fill="none" stroke="#2563eb" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Head (Tilted downward in despair / sadness) -->
    <g transform="translate(120, 132)">
      <!-- Hair Back/Base -->
      <circle cx="0" cy="0" r="28" fill="#1e293b"/>
      
      <!-- Face Skin -->
      <circle cx="2" cy="4" r="24" fill="#ffedd5"/>
      
      <!-- Hair Bangs drooping over forehead -->
      <path d="M -24 -5 C -15 -18, 10 -15, 22 -8 C 15 5, -10 8, -24 -5 Z" fill="#1e293b"/>

      <!-- Facial Expression: Disappointed / Sad Eyes Closed Tight -->
      <!-- Left Eye (Arch indicating sadness/pain) -->
      <path d="M -10 2 C -7 -1, -3 -1, 0 2" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Right Eye -->
      <path d="M 6 2 C 9 -1, 13 -1, 16 2" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Sad Teardrop / Sweat Drop -->
      <path d="M -12 6 C -12 6, -16 12, -16 15 C -16 17.2, -14.2 19, -12 19 C -9.8 19, -8 17.2, -8 15 C -8 12, -12 6, -12 6 Z" fill="#38bdf8" opacity="0.85"/>

      <!-- Downturned Mouth -->
      <path d="M 0 14 C 3 11, 7 11, 10 14" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Rosy Sad Cheeks -->
      <circle cx="-10" cy="9" r="4" fill="#fda4af" opacity="0.6"/>
      <circle cx="16" cy="9" r="4" fill="#fda4af" opacity="0.6"/>
    </g>
  </g>

  <!-- FOREGROUND ATMOSPHERIC DETAILS (Depth of field particles) -->
  <circle cx="40" cy="90" r="2" fill="#fbbf24" opacity="0.3"/>
  <circle cx="200" cy="70" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="180" cy="110" r="2.5" fill="#fbbf24" opacity="0.2"/>
  <circle cx="60" cy="50" r="1" fill="#fbbf24" opacity="0.5"/>

  <!-- Vignette / Frame Border Overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="4" opacity="0.5"/>
</svg>