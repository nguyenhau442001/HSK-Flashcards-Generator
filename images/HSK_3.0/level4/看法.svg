<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Telescope/Device Metallic Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Golden Warmth Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Vibrant Screen/View Gradient -->
    <linearGradient id="view-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Ambient Glows (Contextual Atmosphere) -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.08" filter="blur(20px)"/>
  <circle cx="180" cy="160" r="50" fill="#ec4899" opacity="0.08" filter="blur(15px)"/>
  
  <!-- Environment Ground Surface -->
  <path d="M 20 200 L 220 200 C 220 200 230 220 220 225 L 20 225 C 10 220 20 200 20 200 Z" fill="#0f172a" opacity="0.8"/>
  <line x1="30" y1="200" x2="210" y2="200" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Environment Elements: Plant / Creative Props (Left Side) -->
  <g transform="translate(45, 160)">
    <!-- Pot -->
    <path d="M 0 25 L 24 25 C 22 40, 2 40, 0 25 Z" fill="#475569"/>
    <ellipse cx="12" cy="25" rx="12" ry="3" fill="#64748b"/>
    <!-- Leaves -->
    <path d="M 12 25 Q 5 10, -5 5 Q 5 0, 12 15 Z" fill="#10b981"/>
    <path d="M 12 25 Q 20 5, 30 0 Q 20 -5, 12 10 Z" fill="#34d399"/>
    <path d="M 12 25 Q 12 0, 15 -10 Q 18 0, 12 20 Z" fill="#059669"/>
  </g>

  <!-- Environment Elements: Creative Light/Lamp or Notebook (Right Side) -->
  <g transform="translate(170, 165)">
    <!-- Small Notebook -->
    <rect x="0" y="15" width="25" height="20" rx="2" fill="#f8fafc" transform="rotate(-10 0 15)"/>
    <rect x="3" y="18" width="25" height="20" rx="2" fill="#cbd5e1" transform="rotate(-5 3 18)"/>
    <!-- Pencil -->
    <rect x="-10" y="28" width="20" height="3" rx="1" fill="#f59e0b" transform="rotate(35 -10 28)"/>
    <polygon points="-12,29 -15,30 -12,31" fill="#0f172a" transform="rotate(35 -10 28)"/>
  </g>

  <!-- MAIN SUBJECT: The Specialized Perspective Scope / Augmented Reality Visor ("Quan Điểm" - Point of View) -->
  <g filter="url(#shadow)">
    <!-- Tripod Stand Base -->
    <path d="M 120 135 L 90 200" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 120 135 L 150 200" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 120 135 L 120 205" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <!-- Tripod Joint -->
    <circle cx="120" cy="135" r="8" fill="#94a3b8"/>

    <!-- Main Scope Body (Angled upward and forward) -->
    <g transform="translate(0, 0)">
      <!-- Connecting Arm -->
      <path d="M 120 135 L 120 115" stroke="url(#metal-grad)" stroke-width="8" stroke-linecap="round"/>

      <!-- Large Cylindrical/Futuristic Monocular / Viewfinder Body -->
      <g transform="rotate(-25 120 100)">
        <!-- Back Eyepiece -->
        <rect x="80" y="90" width="16" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
        
        <!-- Main Housing Tube -->
        <rect x="95" y="85" width="55" height="30" rx="8" fill="url(#metal-grad)"/>
        
        <!-- Focus Ring / Dial -->
        <rect x="110" y="83" width="10" height="34" rx="2" fill="#fbbf24"/>
        <line x1="113" y1="83" x2="113" y2="117" stroke="#b45309" stroke-width="1"/>
        <line x1="117" y1="83" x2="117" y2="117" stroke="#b45309" stroke-width="1"/>

        <!-- Front Lens / Projection Screen (Glowing with ideas/perspectives) -->
        <path d="M 150 85 L 165 89 C 170 90, 170 110, 165 111 L 150 115 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
        <ellipse cx="158" cy="100" rx="4" ry="11" fill="url(#view-grad)"/>
      </g>
    </g>
  </g>

  <!-- PROJECTED CREATIVE VISION / MULTI-PERSPECTIVE ELEMENTS (Emerging from the Scope Lens) -->
  <!-- Visualizing "Cách Nhìn" (The way of seeing / Different perspectives floating in space) -->
  <g transform="translate(145, 45)">
    <!-- Central Idea Burst (Golden Star / Insight) -->
    <path d="M 25 15 L 28 22 L 35 25 L 28 28 L 25 35 L 22 28 L 15 25 L 22 22 Z" fill="url(#gold-grad)" filter="url(#shadow)"/>
    <circle cx="25" cy="25" r="18" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

    <!-- Floating Perspective Bubble 1 (Blue - Analytical View) -->
    <g transform="translate(-30, -5)" filter="url(#shadow)">
      <circle cx="12" cy="12" r="14" fill="#38bdf8" opacity="0.9"/>
      <!-- Tiny geometric abstract graph inside bubble -->
      <polyline points="6,16 10,10 14,13 18,7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Floating Perspective Bubble 2 (Pink - Creative View) -->
    <g transform="translate(25, -20)" filter="url(#shadow)">
      <circle cx="12" cy="12" r="11" fill="#ec4899" opacity="0.9"/>
      <!-- Tiny lightbulb / heart shape inside -->
      <path d="M 12 7 C 9 7, 8 10, 10 12 C 11 13, 11 14, 12 16 C 13 14, 13 13, 14 12 C 16 10, 15 7, 12 7 Z" fill="#ffffff"/>
    </g>

    <!-- Floating Perspective Bubble 3 (Green - Growth/Solution View) -->
    <g transform="translate(10, 25)" filter="url(#shadow)">
      <circle cx="10" cy="10" r="9" fill="#10b981" opacity="0.9"/>
      <!-- Tiny checkmark -->
      <polyline points="6,10 9,13 14,7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Connecting Light Beams from Scope to Visions -->
  <path d="M 175 80 L 190 60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 4"/>
  <path d="M 175 90 L 175 105" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 4"/>

  <!-- Sparkles / Atmosphere -->
  <circle cx="60" cy="80" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="85" cy="50" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="195" cy="130" r="2" fill="#ec4899" opacity="0.8"/>
  <circle cx="40" cy="130" r="1" fill="#ffffff" opacity="0.5"/>

  <!-- Dynamic Foreground Framing Accent -->
  <path d="M 0 0 L 240 0 L 240 240 L 0 240 Z" fill="none" stroke="#334155" stroke-width="2" opacity="0.3"/>
</svg>