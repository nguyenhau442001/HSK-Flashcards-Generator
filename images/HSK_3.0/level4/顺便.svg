<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Grocery Shelf -->
  <rect x="20" y="140" width="200" height="10" fill="#475569" rx="2"/>
  <rect x="30" y="150" width="180" height="5" fill="#334155" rx="2"/>
  
  <!-- Character Body -->
  <path d="M120 120 C140 120 150 140 150 180 L90 180 C90 140 100 120 120 120" fill="#38bdf8"/>
  
  <!-- Head -->
  <circle cx="120" cy="100" r="25" fill="#fde68a"/>
  
  <!-- Arm reaching for fruit while holding a bag -->
  <path d="M145 140 L170 110" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  <path d="M100 140 L70 170" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Shopping Bag -->
  <path d="M60 170 L80 170 L75 210 L65 210 Z" fill="#fb923c"/>
  
  <!-- Fruit (The "Shunbian" action) -->
  <circle cx="175" cy="105" r="12" fill="#ec4899"/>
  <path d="M175 95 L178 90" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Facial Expression -->
  <circle cx="112" cy="95" r="2" fill="#1e293b"/>
  <circle cx="128" cy="95" r="2" fill="#1e293b"/>
  <path d="M112 108 Q120 112 128 108" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="120" cy="120" r="80" fill="#fbbf24" fill-opacity="0.05"/>
  
  <!-- Background Details -->
  <rect x="180" y="50" width="30" height="60" fill="#334155" rx="4"/>
  <rect x="30" y="40" width="40" height="80" fill="#334155" rx="4"/>
</svg>