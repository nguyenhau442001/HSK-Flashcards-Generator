<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Connection Beam Gradient -->
    <linearGradient id="beamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Window Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Ambient Light, Windows, Wall decor) -->
  <g opacity="0.4">
    <!-- Window Frame casting light -->
    <path d="M 30,10 L 90,10 L 90,120 L 30,120 Z" fill="#38bdf8" opacity="0.03"/>
    <path d="M 100,10 L 160,10 L 160,120 L 100,120 Z" fill="#38bdf8" opacity="0.03"/>
    
    <!-- Floating geometric network nodes in background -->
    <circle cx="45" cy="50" r="2" fill="#38bdf8"/>
    <circle cx="85" cy="35" r="3" fill="#fbbf24"/>
    <circle cx="195" cy="45" r="2.5" fill="#ec4899"/>
    <circle cx="210" cy="90" r="2" fill="#38bdf8"/>
    
    <!-- Background constellation lines -->
    <line x1="45" y1="50" x2="85" y2="35" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="195" y1="45" x2="210" y2="90" stroke="#ec4899" stroke-width="0.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Bookshelf / Plant Prop in background -->
  <g transform="translate(190, 60)">
    <!-- Pot -->
    <path d="M 5,25 L 15,25 L 13,40 L 7,40 Z" fill="#64748b"/>
    <!-- Plant Leaves -->
    <path d="M 10,25 Q 5,10 0,15 Q 8,18 10,25 Z" fill="#10b981"/>
    <path d="M 10,25 Q 15,5 22,10 Q 15,18 10,25 Z" fill="#34d399"/>
    <path d="M 10,25 Q 12,2 8,0 Q 6,15 10,25 Z" fill="#059669"/>
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 0,175 L 240,175 L 240,240 L 0,240 Z" fill="url(#deskGrad)"/>
  <!-- Desk rim highlight -->
  <rect x="0" y="175" width="240" height="3" fill="#475569"/>

  <!-- Coffee Mug Prop -->
  <g transform="translate(195, 145)">
    <path d="M 4,5 L 16,5 L 18,25 C 18,28 15,30 11,30 L 9,30 C 5,30 2,28 2,25 Z" fill="#cbd5e1"/>
    <path d="M 16,8 C 21,8 21,20 16,20" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 7,0 Q 9,-5 7,-10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 13,-2 Q 11,-7 13,-12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- INTERNET CORE: Globe / Router Hub on Desk (Central Subject) -->
  <g transform="translate(120, 140)">
    <!-- Globe Stand Base -->
    <ellipse cx="0" cy="35" rx="22" ry="7" fill="#1e293b"/>
    <path d="M -5,35 L -3,15 L 3,15 L 5,35 Z" fill="#64748b"/>
    
    <!-- Glowing Holographic Globe / Router Core -->
    <circle cx="0" cy="-5" r="32" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Meridian/Latitude lines on Globe -->
    <ellipse cx="0" cy="-5" rx="32" ry="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <line x1="-32" y1="-5" x2="32" y2="-5" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-37" x2="0" y2="27" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    
    <!-- Orbiting Data Rings / Connection Waves -->
    <ellipse cx="0" cy="-5" rx="42" ry="16" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(-15)"/>
    <ellipse cx="0" cy="-5" rx="48" ry="10" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 8" transform="rotate(25)"/>

    <!-- Glowing Data Nodes / Sparkles emanating -->
    <circle cx="-35" cy="-25" r="3" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="38" cy="15" r="2.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="25" cy="-30" r="2" fill="#ec4899" filter="url(#glow)"/>
  </g>

  <!-- Laptop / Workstation Setup (Contextualizing the Internet) -->
  <g transform="translate(30, 115)">
    <!-- Laptop Base -->
    <path d="M -15,45 L 75,45 L 85,60 L -25,60 Z" fill="#475569"/>
    <path d="M 20,45 L 40,45 L 39,47 L 21,47 Z" fill="#64748b"/> <!-- Touchpad area -->
    
    <!-- Laptop Screen (Angled back) -->
    <path d="M -15,45 L -20,-15 L 70,-15 L 75,45 Z" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <!-- Screen Inner Glowing Display -->
    <path d="M -11,40 L -15,-10 L 65,-10 L 69,40 Z" fill="#1e1b4b"/>
    
    <!-- Data Visualizations on Laptop Screen (Charts & Nodes) -->
    <polyline points="-5,25 10,10 25,20 45,0 55,10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="45" cy="0" r="3" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="10" cy="10" r="2.5" fill="#10b981"/>
    
    <!-- Code / Data lines on screen -->
    <line x1="-5" y1="30" x2="15" y2="30" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="30" x2="40" y2="30" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Smartphone Connected (Wi-Fi / Data Transfer Active) -->
  <g transform="translate(160, 130)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="22" height="42" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="2" y="4" width="18" height="34" rx="2" fill="#0f172a"/>
    <!-- Screen UI Wave -->
    <path d="M 5,20 Q 8,15 11,20 T 17,20" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Connection Beams / Data Packets flowing through the air -->
  <g>
    <!-- Packet Stream from Laptop to Central Globe -->
    <path d="M 90,135 Q 105,120 115,125" fill="none" stroke="url(#beamGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <circle cx="105" cy="125" r="3.5" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Packet Stream from Globe to Smartphone -->
    <path d="M 135,120 Q 150,115 160,130" fill="none" stroke="url(#beamGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <circle cx="148" cy="120" r="3.5" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Upward Signal Waves from Globe -->
    <path d="M 110,95 Q 120,85 130,95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 105,88 Q 120,73 135,88" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 100,81 Q 120,61 140,81" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Floating Ambient Particles / Data Sparkles -->
  <g filter="url(#glow)">
    <circle cx="70" cy="90" r="2.5" fill="#fbbf24"/>
    <circle cx="165" cy="85" r="2" fill="#38bdf8"/>
    <circle cx="130" cy="50" r="3" fill="#ec4899"/>
    <circle cx="95" cy="65" r="1.5" fill="#10b981"/>
    
    <!-- Tiny floating binary-like aesthetic dots -->
    <circle cx="55" cy="120" r="1.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="185" cy="110" r="1.5" fill="#fbbf24" opacity="0.7"/>
  </g>
</svg>