<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Sparkle/Item Gradients -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="plantPot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting / Glow -->
  <circle cx="120" cy="110" r="90" fill="url(#magicGlow)" />

  <!-- Background Ambient Elements (Shelf/Wall) -->
  <path d="M 30 50 L 210 50" stroke="#334155" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <rect x="45" y="32" width="18" height="18" rx="3" fill="#64748b" opacity="0.3" />
  <rect x="68" y="28" width="12" height="22" rx="2" fill="#38bdf8" opacity="0.3" />
  <rect x="175" y="30" width="22" height="20" rx="3" fill="#f43f5e" opacity="0.3" />

  <!-- Table/Surface -->
  <path d="M 0 170 Q 120 160 240 170 L 240 240 L 0 240 Z" fill="url(#tableGrad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" />

  <!-- Side Props: Cozy Plant representing "richness of life/nature" -->
  <path d="M 35 170 L 45 145 L 65 145 L 75 170 Z" fill="url(#plantPot)" />
  <ellipse cx="55" cy="145" rx="10" ry="3" fill="#065f46" />
  <!-- Plant Leaves -->
  <path d="M 55 142 Q 40 120 30 130 Q 30 145 55 142 Z" fill="#34d399" />
  <path d="M 55 142 Q 70 115 85 125 Q 80 142 55 142 Z" fill="#10b981" />
  <path d="M 55 142 Q 50 110 58 105 Q 65 115 55 142 Z" fill="#6ee7b7" />

  <!-- Side Props: Potion/Item representing "rich content" -->
  <path d="M 195 170 L 190 145 L 210 145 L 205 170 Z" fill="#475569" />
  <path d="M 192 145 L 208 145 L 208 138 L 192 138 Z" fill="#94a3b8" />
  <path d="M 195 145 Q 185 130 200 115 Q 215 130 205 145 Z" fill="#38bdf8" opacity="0.8" />
  <circle cx="200" cy="132" r="4" fill="#bae6fd" />

  <!-- MAIN SUBJECT: Open Magical Book (Symbolizing "Rich Content/丰富") -->
  <!-- Book Shadow -->
  <ellipse cx="120" cy="172" rx="65" ry="10" fill="#020617" opacity="0.6" />

  <!-- Book Base / Cover -->
  <path d="M 55 130 Q 120 155 185 130 L 185 165 Q 120 190 55 165 Z" fill="#1e40af" />
  <path d="M 58 135 Q 120 158 182 135 L 182 162 Q 120 185 58 162 Z" fill="url(#bookCoverGrad)" />

  <!-- Book Pages (Left & Right) -->
  <path d="M 60 132 Q 120 152 118 162 L 118 125 Q 60 105 60 132 Z" fill="#f8fafc" />
  <path d="M 180 132 Q 120 152 122 162 L 122 125 Q 180 105 180 132 Z" fill="#f1f5f9" />

  <!-- Book Spine Center crease -->
  <line x1="120" y1="125" x2="120" y2="162" stroke="#cbd5e1" stroke-width="2" />

  <!-- Abstract Rich Content Lines on Pages -->
  <!-- Left Page Lines -->
  <line x1="72" y1="120" x2="105" y2="112" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="70" y1="130" x2="108" y2="122" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="70" y1="140" x2="100" y2="132" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="72" y1="150" x2="95" y2="143" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

  <!-- Right Page Lines -->
  <line x1="135" y1="112" x2="168" y2="120" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="132" y1="122" x2="170" y2="130" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="140" y1="132" x2="170" y2="140" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="135" y1="143" x2="160" y2="150" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- EMERGENCE / ABUNDANCE: Pop-up colorful icons & elements bursting from the book -->
  
  <!-- Central Rising Light Beam -->
  <path d="M 100 120 L 120 40 L 140 120 Z" fill="url(#magicGlow)" opacity="0.6" />

  <!-- Floating Element 1: Glowing Star (Top Center) -->
  <g transform="translate(120, 55)">
    <path d="M 0 -14 L 3 -4 L 13 -4 L 5 2 L 8 12 L 0 6 L -8 12 L -5 2 L -13 -4 L -3 -4 Z" fill="url(#starGrad)" />
    <circle cx="0" cy="0" r="16" fill="#fef08a" opacity="0.3" filter="blur(2px)" />
  </g>

  <!-- Floating Element 2: Magic Gem/Crystal (Left) -->
  <g transform="translate(85, 75) rotate(-15)">
    <path d="M 0 -10 L 8 -2 L 5 10 L -5 10 L -8 -2 Z" fill="url(#gemGrad)" />
    <path d="M 0 -10 L 0 10" stroke="#fbcfe8" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="12" fill="#f472b6" opacity="0.3" />
  </g>

  <!-- Floating Element 3: Vibrant Leaf/Nature (Right) -->
  <g transform="translate(155, 70) rotate(20)">
    <path d="M 0 12 Q 10 0 0 -12 Q -10 0 0 12 Z" fill="#34d399" />
    <path d="M 0 12 L 0 -12" stroke="#065f46" stroke-width="1.5" />
    <circle cx="0" cy="0" r="12" fill="#6ee7b7" opacity="0.3" />
  </g>

  <!-- Floating Element 4: Mini Golden Coin / Wealth (Lower Left) -->
  <g transform="translate(100, 95)">
    <circle cx="0" cy="0" r="8" fill="#fbbf24" />
    <circle cx="0" cy="0" r="5" fill="#f59e0b" />
    <circle cx="0" cy="0" r="8" fill="#fef08a" opacity="0.4" />
  </g>

  <!-- Floating Element 5: Magic Sparkle / Diamond (Lower Right) -->
  <g transform="translate(145, 90) rotate(10)">
    <path d="M 0 -7 L 5 0 L 0 7 L -5 0 Z" fill="#38bdf8" />
    <circle cx="0" cy="0" r="10" fill="#bae6fd" opacity="0.4" />
  </g>

  <!-- Sparkle Dots (Scattered Magic) -->
  <circle cx="70" cy="95" r="2.5" fill="#fef08a" />
  <circle cx="170" cy="105" r="2" fill="#f43f5e" />
  <circle cx="110" cy="45" r="3" fill="#38bdf8" />
  <circle cx="135" cy="50" r="1.5" fill="#34d399" />
  <circle cx="90" cy="120" r="2" fill="#fbbf24" />
  <circle cx="150" cy="120" r="2.5" fill="#ec4899" />

  <!-- Action / Dynamic Motion Swirls -->
  <path d="M 75 110 Q 60 90 75 70" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M 165 105 Q 185 85 165 65" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
</svg>