<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient (Dark mode harmonious) -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Warm lighting from desk lamp -->
    <radialGradient id="lamp-glow" cx="65%" cy="30%" r="70%" fx="65%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Magic Transformation Gradient -->
    <linearGradient id="magic-flow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)"/>

  <!-- ENVIRONMENT DETAILS (Cozy Creative Room) -->
  <!-- Wallpaper / Back wall details -->
  <path d="M 0 170 L 240 170" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="40" width="45" height="60" rx="4" fill="#334155" opacity="0.4"/>
  <path d="M 40 55 L 65 55 M 40 65 L 60 65 M 40 75 L 55 75" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Bookshelf background -->
  <rect x="175" y="50" width="35" height="120" fill="#0f172a" opacity="0.6"/>
  <line x1="175" y1="80" x2="210" y2="80" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="120" x2="210" y2="120" stroke="#334155" stroke-width="2"/>
  <!-- Books on shelf -->
  <rect x="180" y="65" width="8" height="15" fill="#f43f5e" rx="1"/>
  <rect x="190" y="62" width="6" height="18" fill="#38bdf8" rx="1"/>
  <rect x="182" y="95" width="12" height="25" fill="#10b981" rx="1"/>
  <rect x="196" y="100" width="7" height="20" fill="#fbbf24" rx="1"/>

  <!-- Plant on shelf -->
  <path d="M 183 145 C 183 138 197 138 197 145 Z" fill="#64748b"/>
  <path d="M 190 138 C 185 125 175 120 170 115" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 190 138 C 195 123 205 118 210 112" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Desk & Props -->
  <path d="M 15 190 L 225 190 L 215 170 L 25 170 Z" fill="#334155"/>
  <rect x="15" y="190" width="210" height="8" fill="#1e293b"/>
  
  <!-- Desk Lamp -->
  <path d="M 195 170 L 195 130 L 180 115" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 172 107 C 172 102 182 100 188 107 C 193 113 190 120 185 120 C 180 120 172 112 172 107 Z" fill="#fbbf24"/>

  <!-- Coffee Mug -->
  <rect x="145" y="152" width="16" height="18" rx="2" fill="#cbd5e1"/>
  <path d="M 161 156 C 166 156 166 166 161 166" stroke="#cbd5e1" stroke-width="2" fill="none"/>

  <!-- MAIN CHARACTER (Stylized, expressive, middle of changing/transforming) -->
  <g transform="translate(0, 5)">
    <!-- Character Shadow -->
    <ellipse cx="105" cy="170" rx="35" ry="8" fill="#0f172a" opacity="0.6"/>

    <!-- Chair -->
    <path d="M 85 170 L 80 130 C 80 115 115 115 115 130 L 110 170 Z" fill="#475569"/>
    <rect x="75" y="165" width="45" height="8" rx="3" fill="#334155"/>

    <!-- Lower Body (Sitting posture) -->
    <path d="M 85 145 L 110 145 L 115 168 L 80 168 Z" fill="#3b82f6"/> <!-- Pants -->

    <!-- Torso (Twisted dynamically to show action) -->
    <path d="M 80 100 L 120 105 L 115 148 L 85 148 Z" fill="#ec4899"/> <!-- Hoodie/Shirt -->
    
    <!-- Collar / Details -->
    <path d="M 95 102 L 105 102 L 108 112 L 92 112 Z" fill="#fbcfe8"/>

    <!-- Left Arm (Holding old paper/sketch) -->
    <path d="M 83 105 C 70 115 65 130 60 140" stroke="#ec4899" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="58" cy="142" r="5" fill="#fde047"/> <!-- Hand -->

    <!-- Right Arm (Reaching out, directing the transformation magic) -->
    <path d="M 117 107 C 135 115 145 125 155 115" stroke="#ec4899" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="158" cy="112" r="5" fill="#fde047"/> <!-- Hand -->

    <!-- Head & Face (Determined, creative expression, looking at transformation) -->
    <path d="M 90 75 C 90 60 115 60 115 75 C 115 88 90 88 90 75 Z" fill="#fde047"/> <!-- Face skin -->
    <!-- Hair (Dynamic, flowing back) -->
    <path d="M 85 75 C 80 50 115 45 122 65 C 125 60 135 65 130 75 C 135 85 120 90 110 88 C 100 90 85 85 85 75 Z" fill="#1e293b"/>
    
    <!-- Facial Features -->
    <!-- Determined Eyebrow -->
    <path d="M 95 70 L 105 73" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 110 70 L 118 72" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes (Focused/sparkling) -->
    <circle cx="100" cy="76" r="2.5" fill="#1e293b"/>
    <circle cx="114" cy="75" r="2.5" fill="#1e293b"/>
    <!-- Confident Smile -->
    <path d="M 103 82 Q 108 87 113 82" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheek -->
    <circle cx="116" cy="81" r="3" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- THE TRANSFORMATION SCENE (Visualizing "改变" - Change from old/dull to new/vibrant) -->
  
  <!-- Old state floating papers (Left) -->
  <g transform="translate(35, 95) rotate(-15)">
    <rect x="0" y="0" width="30" height="40" rx="2" fill="#94a3b8" opacity="0.8"/>
    <!-- Scribbles on old paper -->
    <path d="M 6 10 L 24 10 M 6 18 L 20 18 M 6 26 L 16 26" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Transformation Stream (Flowing from left to right, bending around character) -->
  <path d="M 65 110 C 90 80, 110 140, 150 90" stroke="url(#magic-flow)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  
  <!-- Magic sparkles / particle effects -->
  <g fill="#fbbf24" filter="url(#glow)">
    <circle cx="95" cy="95" r="3"/>
    <circle cx="110" cy="120" r="4"/>
    <circle cx="130" cy="95" r="2.5"/>
    <circle cx="145" cy="80" r="3.5"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="80" cy="100" r="2"/>
    <circle cx="105" cy="105" r="3"/>
    <circle cx="135" cy="110" r="2"/>
  </g>

  <!-- New state vibrant creation (Right - emerging from magic) -->
  <g transform="translate(160, 65) rotate(12)">
    <!-- Glowing canvas/blueprint base -->
    <rect x="0" y="0" width="45" height="55" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Vibrant glowing design elements inside the new creation -->
    <path d="M 8 38 L 18 22 L 26 30 L 37 15" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="37" cy="15" r="4" fill="#fbbf24" filter="url(#glow)"/>
    <path d="M 12 45 L 33 45" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating architectural / creative building blocks (showing progress of change) -->
  <g transform="translate(180, 130)">
    <polygon points="12,0 24,10 12,20 0,10" fill="#fb923c" filter="url(#glow)"/>
  </g>
  <g transform="translate(45, 60)">
    <polygon points="10,0 20,15 0,15" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="25" cy="140" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="215" cy="100" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="140" cy="40" r="1.5" fill="#10b981" opacity="0.8"/>
  <circle cx="75" cy="30" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>