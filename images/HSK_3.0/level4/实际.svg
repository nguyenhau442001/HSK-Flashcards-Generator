<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Hologram Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#grid)"/>

  <!-- Atmospheric Floor/Environment -->
  <ellipse cx="120" cy="195" rx="90" ry="25" fill="#090d16" opacity="0.6"/>
  
  <!-- Holographic Base Projector (Physical Reality Anchor) -->
  <path d="M 70 190 L 90 170 L 150 170 L 170 190 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="120" cy="170" rx="30" ry="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 105 170 L 120 145 L 135 170" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" stroke-dasharray="3 3"/>

  <!-- Holographic Cone Beam -->
  <polygon points="120,145 75,95 165,95" fill="url(#holoBeam)" opacity="0.12"/>
  <linearGradient id="holoBeam" x1="0" y1="145" x2="0" y2="95" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
  </linearGradient>

  <!-- Central 3D Object: Tangible Globe / Model floating in Reality -->
  <g filter="url(#glow)">
    <!-- Outer Hologram Ring -->
    <ellipse cx="120" cy="100" rx="42" ry="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>
    
    <!-- Globe Base Sphere -->
    <circle cx="120" cy="100" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Continents / Landmasses (Stylized vector paths) -->
    <path d="M 105 85 C 112 80, 125 82, 130 90 C 135 98, 120 108, 110 102 C 102 98, 98 90, 105 85 Z" fill="#10b981" opacity="0.75"/>
    <path d="M 125 110 C 132 108, 142 112, 138 122 C 134 130, 120 125, 125 110 Z" fill="#10b981" opacity="0.6"/>
    <path d="M 98 108 C 104 105, 112 110, 108 118 C 104 122, 94 116, 98 108 Z" fill="#10b981" opacity="0.5"/>

    <!-- Latitude / Longitude Arcs -->
    <ellipse cx="120" cy="100" rx="32" ry="10" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <path d="M 120 68 C 105 80, 105 120, 120 132" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <path d="M 120 68 C 135 80, 135 120, 120 132" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Orbiting Data Nodes (Representing practical, real-world data points) -->
  <g filter="url(#subtle-glow)">
    <!-- Node 1 (Amber) -->
    <circle cx="82" cy="78" r="4" fill="#fbbf24"/>
    <path d="M 82 78 L 100 90" stroke="#fbbf24" stroke-width="1" opacity="0.5" stroke-dasharray="2 2"/>
    
    <!-- Node 2 (Pink/Magenta) -->
    <circle cx="160" cy="115" r="5" fill="#ec4899"/>
    <path d="M 160 115 L 138 105" stroke="#ec4899" stroke-width="1" opacity="0.5" stroke-dasharray="2 2"/>

    <!-- Node 3 (Emerald) -->
    <circle cx="138" cy="65" r="3.5" fill="#10b981"/>
    <path d="M 138 65 L 125 85" stroke="#10b981" stroke-width="1" opacity="0.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Blueprint / Drafting Tangible Compass Calipers framing the scene -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Top-left bracket -->
    <path d="M 35 60 L 35 40 L 55 40"/>
    <!-- Bottom-right bracket -->
    <path d="M 205 180 L 205 200 L 185 200"/>
    <!-- Crosshairs -->
    <path d="M 120 30 L 120 38" stroke-width="1.5"/>
    <path d="M 30 100 L 38 100" stroke-width="1.5"/>
    <path d="M 202 100 L 210 100" stroke-width="1.5"/>
  </g>

  <!-- Foreground Atmospheric Particles / Dust Motes -->
  <circle cx="60" cy="130" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="180" cy="70" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="95" cy="150" r="1" fill="#10b981" opacity="0.8"/>
  <circle cx="155" cy="155" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="75" cy="65" r="1.2" fill="#ec4899" opacity="0.6"/>

  <!-- Warm/Cool Lighting Accents on Base -->
  <circle cx="120" cy="170" r="2" fill="#ffffff" filter="url(#glow)"/>
</svg>