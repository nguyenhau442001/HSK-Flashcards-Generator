<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Bin Gradients -->
    <linearGradient id="binBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="binLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Bottle Gradients -->
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Motion Trail Gradient -->
    <linearGradient id="motionFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Lighting / Ground plane -->
  <ellipse cx="120" cy="205" rx="90" ry="15" fill="#090d16" opacity="0.6"/>

  <!-- Background Park Elements (Subtle) -->
  <!-- Bush 1 -->
  <circle cx="40" cy="170" r="35" fill="#1e3932" opacity="0.4"/>
  <circle cx="65" cy="180" r="25" fill="#1e3932" opacity="0.4"/>
  <!-- Bush 2 -->
  <path d="M 180,185 Q 200,140 220,185 Z" fill="#1e3932" opacity="0.4"/>

  <!-- Motion Trail for the Thrown Object -->
  <path d="M 65,95 Q 100,60 145,95" fill="none" stroke="url(#motionFade)" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 8"/>

  <!-- Recycle Bin (Target) -->
  <g transform="translate(140, 115)">
    <!-- Bin Shadow -->
    <ellipse cx="25" cy="82" rx="28" ry="8" fill="#000000" opacity="0.3"/>
    
    <!-- Bin Back Rim / Inner -->
    <ellipse cx="25" cy="10" rx="26" ry="6" fill="#1d4ed8"/>

    <!-- Bin Body -->
    <path d="M -1,10 L 4,80 C 4,84 10,87 25,87 C 40,87 46,84 46,80 L 51,10 Z" fill="url(#binBody)"/>
    
    <!-- Vertical Stripe on Bin -->
    <rect x="22" y="15" width="6" height="65" fill="#ffffff" opacity="0.15" rx="3"/>

    <!-- Bin Lid (Slightly open/dynamic) -->
    <g transform="translate(25, 4) rotate(-15)">
      <rect x="-28" y="-6" width="56" height="10" rx="5" fill="url(#binLid)"/>
      <rect x="-8" y="-11" width="16" height="6" rx="3" fill="#60a5fa"/>
    </g>

    <!-- Recycle Symbol (Simplified geometric representation) -->
    <path d="M 25,35 L 20,45 L 30,45 Z" fill="#ffffff" opacity="0.4"/>
    <circle cx="25" cy="48" r="10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="12 6" opacity="0.4"/>
  </g>

  <!-- Flying Object (Plastic Bottle being tossed) -->
  <g transform="translate(95, 75) rotate(35)">
    <!-- Bottle Glow -->
    <path d="M-15,-6 L15,-6 C18,-6 20,-4 20,0 C20,4 18,6 15,6 L-15,6 C-18,6 -20,4 -20,0 C-20,-4 -18,-6 -15,-6 Z" fill="#34d399" opacity="0.3" filter="url(#glow)"/>
    
    <!-- Bottle Cap -->
    <rect x="-22" y="-3" width="5" height="6" rx="1.5" fill="#f59e0b"/>
    <rect x="-20" y="-4" width="2" height="8" fill="#fbbf24"/>

    <!-- Bottle Neck -->
    <path d="M-17,-3 L-13,-5 L-13,5 L-17,3 Z" fill="#10b981"/>

    <!-- Bottle Main Body -->
    <rect x="-13" y="-7" width="30" height="14" rx="5" fill="url(#bottleGrad)"/>

    <!-- Bottle Highlights / Details -->
    <path d="M-10,-4 L15,-4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <rect x="-4" y="-5" width="8" height="10" rx="1" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Action Spark / Energy Lines -->
  <g transform="translate(75, 75)" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="-10" y1="-5" x2="-20" y2="-10"/>
    <line x1="0" y1="-12" x2="-5" y2="-22"/>
    <line x1="12" y1="-8" x2="20" y2="-15"/>
  </g>

  <!-- Person Throwing (Dynamic Hand / Arm Action) -->
  <g transform="translate(30, 95)">
    <!-- Arm Back Layer / Shoulder -->
    <path d="M 15,20 C 5,20 -5,35 -15,55" fill="none" stroke="#fb923c" stroke-width="16" stroke-linecap="round"/>

    <!-- Hoodie / Torso -->
    <path d="M -15,115 C -15,70 10,60 25,50 C 45,70 55,90 60,125 Z" fill="#38bdf8"/>
    <!-- Hoodie Hood/Collar -->
    <path d="M 0,55 C 10,40 30,40 40,55" fill="none" stroke="#0284c7" stroke-width="6"/>

    <!-- Dynamic Throwing Arm (Forearm & Hand releasing) -->
    <path d="M 25,52 C 45,35 65,45 80,60" fill="none" stroke="#fb923c" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Hand Motion Blur Effect -->
    <circle cx="82" cy="62" r="9" fill="#f97316" opacity="0.7"/>
    <circle cx="82" cy="62" r="7" fill="#fed7aa"/>

    <!-- Head / Face Profile (Determined, looking towards target) -->
    <g transform="translate(10, 15)">
      <!-- Hair -->
      <path d="M -15,15 C -15,-5 10,-5 15,15 C 20,20 15,30 15,30 C 15,30 -5,32 -15,15 Z" fill="#1e293b"/>
      <!-- Face Skin -->
      <circle cx="5" cy="22" r="12" fill="#fed7aa"/>
      <!-- Determined Eye -->
      <path d="M 10,20 Q 13,18 16,21" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Cheek / Smile line -->
      <path d="M 12,24 Q 14,26 11,28" fill="none" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Ground Plane (Floor surface) -->
  <path d="M 0,205 Q 120,195 240,205 L 240,240 L 0,240 Z" fill="#0f172a"/>
  <!-- Floor Highlight Edge -->
  <path d="M 0,205 Q 120,195 240,205" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Tiny Decorative Ground Debris / Sparks -->
  <circle cx="115" cy="215" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="175" cy="220" r="1.5" fill="#34d399" opacity="0.5"/>
  <circle cx="75" cy="210" r="1" fill="#fbbf24" opacity="0.5"/>
</svg>