<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="table-grad" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.5" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>

    <!-- Glow Filter for Action/Energy -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Bowl/Plates -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements -->
  <g opacity="0.15">
    <circle cx="190" cy="50" r="40" fill="#38bdf8"/>
    <circle cx="50" cy="70" r="25" fill="#f59e0b"/>
    <path d="M 20 180 Q 60 160 100 180 T 180 170" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  </g>

  <!-- Restaurant/Home Table Surface -->
  <path d="M 0 160 L 240 160 L 240 230 C 240 235 235 240 230 240 L 10 240 C 5 240 0 235 0 230 Z" fill="url(#table-grad)" filter="url(#shadow)"/>
  <ellipse cx="120" cy="160" rx="120" ry="12" fill="#64748b"/>

  <!-- SCENE: Overflowing Rice Bowl & Food Waste representing "Lãng Phí" (Waste) -->
  
  <!-- Spilled/Wasted Rice Pile on Table (Left Side) -->
  <path d="M 40 175 Q 60 160 85 178 Q 70 190 40 175 Z" fill="#e2e8f0" opacity="0.9" filter="url(#shadow)"/>
  <circle cx="55" cy="172" r="3" fill="#cbd5e1"/>
  <circle cx="68" cy="176" r="2.5" fill="#cbd5e1"/>

  <!-- Main Bowl Outer (Front/Rim) -->
  <ellipse cx="120" cy="155" rx="55" ry="22" fill="#0f172a" opacity="0.4"/>

  <!-- Ceramic Bowl Body -->
  <path d="M 70 145 C 70 175 170 175 170 145 C 160 130 80 130 70 145 Z" fill="#cbd5e1" filter="url(#shadow)"/>
  <path d="M 73 145 C 73 171 167 171 167 145 Z" fill="#f8fafc"/>
  <!-- Bowl Blue Pattern Line -->
  <path d="M 85 152 Q 120 164 155 152" stroke="#3b82f6" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Overflowing Rice in Bowl (Piled high, uneaten) -->
  <ellipse cx="120" cy="142" rx="46" ry="18" fill="#e2e8f0"/>
  <!-- Rice texture mounds -->
  <path d="M 80 142 Q 95 110 120 115 Q 145 110 160 142 Q 140 150 120 148 Q 100 150 80 142 Z" fill="#f8fafc"/>
  <circle cx="105" cy="130" r="4" fill="#e2e8f0"/>
  <circle cx="125" cy="122" r="5" fill="#e2e8f0"/>
  <circle cx="135" cy="135" r="4.5" fill="#e2e8f0"/>
  <circle cx="112" cy="138" r="3.5" fill="#e2e8f0"/>
  <circle cx="95" cy="138" r="4" fill="#e2e8f0"/>

  <!-- Untouched/Wasted Premium Food Items (Broccoli, Meat chunks, Carrots) -->
  <!-- Broccoli Floret (Green) -->
  <g transform="translate(130, 110)">
    <circle cx="0" cy="0" r="10" fill="#10b981"/>
    <circle cx="-6" cy="4" r="7" fill="#059669"/>
    <circle cx="6" cy="4" r="7" fill="#059669"/>
    <path d="M -3 6 L -3 12 L 3 12 L 3 6 Z" fill="#047857"/>
  </g>

  <!-- Juicy Meat Chunk / Dumpling (Amber/Orange) -->
  <g transform="translate(100, 115) rotate(15)">
    <rect x="-10" y="-8" width="20" height="16" rx="6" fill="#f59e0b" filter="url(#shadow)"/>
    <path d="M -6 -4 Q 0 -8 6 -4" stroke="#d97706" stroke-width="2" fill="none"/>
  </g>

  <!-- Carrot Slice (Orange) -->
  <path d="M 85 130 L 95 125 L 98 135 L 88 138 Z" fill="#fb923c" filter="url(#shadow)"/>

  <!-- Action / Neglect Elements: Dramatic Steam & Waving Stop Hand / Warning Accent -->
  <!-- Wasted Steam (fading away uselessly) -->
  <path d="M 110 100 Q 100 80 115 65 Q 130 50 120 35" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 130 105 Q 140 90 130 75 Q 120 60 135 45" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Floating Warning / Waste Indicator (Red/Amber Glowing Cross-Out / Stop symbol vibe) -->
  <g transform="translate(180, 75)" filter="url(#glow)">
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#ef4444" stroke-width="4"/>
    <!-- Diagonal Slash (No/Waste) -->
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    <!-- Water droplet / Drop of food being discarded -->
    <path d="M 0 -7 C 5 -1 5 6 0 6 C -5 6 -5 -1 0 -7 Z" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Chopsticks carelessly placed across the bowl -->
  <g filter="url(#shadow)">
    <!-- Chopstick 1 -->
    <line x1="60" y1="125" x2="175" y2="155" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="125" x2="68" y2="127" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
    <!-- Chopstick 2 -->
    <line x1="65" y1="132" x2="172" y2="162" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Droplets / Spillage Accents (Dynamic visual cue for careless action) -->
  <circle cx="155" cy="170" r="3.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="163" cy="176" r="2" fill="#f59e0b" opacity="0.8"/>
  <path d="M 152 165 C 158 168 156 174 150 172 Z" fill="#10b981" opacity="0.8"/>

  <!-- Foreground Lighting & Depth Highlights -->
  <ellipse cx="120" cy="165" rx="35" ry="3" fill="#0f172a" opacity="0.6"/>
</svg>