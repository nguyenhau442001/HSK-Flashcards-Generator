<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Street Scene -->
  <path d="M0 180h240v60H0z" fill="#334155"/>
  <path d="M20 200h40v10H20zM80 200h40v10H80zM140 200h40v10H140zM200 200h40v10H200z" fill="#475569"/>
  
  <!-- Street Lamp -->
  <path d="M200 180V80h-4v100h4z" fill="#94a3b8"/>
  <circle cx="198" cy="75" r="15" fill="#fbbf24"/>
  <circle cx="198" cy="75" r="8" fill="#fef3c7"/>
  
  <!-- Characters -->
  <g transform="translate(60, 100)">
    <!-- Person 1 -->
    <circle cx="30" cy="30" r="15" fill="#f59e0b"/>
    <path d="M30 45v40M30 60l-15 15M30 60l15 15M30 85l-10 25M30 85l10 25" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Person 2 -->
    <circle cx="80" cy="30" r="15" fill="#38bdf8"/>
    <path d="M80 45v40M80 60l-15 15M80 60l15 15M80 85l-10 25M80 85l10 25" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Clock/Time Indicator -->
  <circle cx="40" cy="40" r="20" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
  <path d="M40 30v10l7 7" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Rain/Atmosphere -->
  <path d="M30 20l-5 10M60 10l-5 10M90 30l-5 10M120 20l-5 10M150 40l-5 10" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>
</svg>