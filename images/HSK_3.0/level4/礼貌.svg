<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for Politeness/Respect -->
    <radialGradient id="warmGlow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Gradients -->
    <linearGradient id="elderCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="youthJacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#warmGlow)"/>

  <!-- Atmospheric Background Elements (Traditional tea house / warm interior setting) -->
  <g opacity="0.4">
    <!-- Window / Shoji frame -->
    <rect x="30" y="30" width="180" height="130" rx="6" fill="none" stroke="#475569" stroke-width="2"/>
    <line x1="120" y1="30" x2="120" y2="160" stroke="#475569" stroke-width="2"/>
    <line x1="30" y1="95" x2="210" y2="95" stroke="#475569" stroke-width="2"/>
    <!-- Lantern accent -->
    <path d="M 200 40 L 210 50 L 210 70 L 200 80 L 190 70 L 190 50 Z" fill="#f59e0b" opacity="0.6"/>
    <path d="M 195 35 L 205 35" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floor Plane -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <!-- Wooden floor planks perspective lines -->
  <line x1="0" y1="190" x2="0" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="190" x2="40" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <line x1="120" y1="190" x2="120" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <line x1="180" y1="190" x2="200" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <line x1="240" y1="190" x2="240" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- Centerpiece Prop: Traditional Tea Table with Tea Set -->
  <g filter="url(#softShadow)">
    <!-- Table base -->
    <rect x="90" y="155" width="60" height="35" rx="4" fill="#334155"/>
    <path d="M 95 190 L 105 215 L 115 215 L 110 190 Z" fill="#1e293b"/>
    <path d="M 145 190 L 135 215 L 125 215 L 130 190 Z" fill="#1e293b"/>
    <!-- Table top -->
    <ellipse cx="120" cy="155" rx="35" ry="10" fill="#475569"/>
    
    <!-- Teapot -->
    <path d="M 115 140 Q 120 130 125 140 Z" fill="#cbd5e1"/>
    <circle cx="120" cy="142" r="8" fill="#e2e8f0"/>
    <path d="M 111 142 C 105 140 107 148 112 146" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <path d="M 128 141 Q 134 140 133 145" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Teacups -->
    <ellipse cx="102" cy="150" rx="4" ry="2" fill="#e2e8f0"/>
    <ellipse cx="138" cy="150" rx="4" ry="2" fill="#e2e8f0"/>
  </g>

  <!-- LEFT FIGURE: The Elder (Showing respect receiver, seated with dignity) -->
  <g filter="url(#softShadow)">
    <!-- Elder Body / Chair -->
    <rect x="55" y="115" width="35" height="75" rx="8" fill="#334155"/>
    <path d="M 50 110 L 95 110 L 95 185 L 50 185 Z" fill="none"/>
    <!-- Elder Coat -->
    <path d="M 55 125 Q 72 118 90 125 L 92 185 L 53 185 Z" fill="url(#elderCoat)"/>
    <!-- Elder Head & Hair -->
    <circle cx="72" cy="95" r="16" fill="#fbcfe8"/>
    <!-- White hair/beard detail -->
    <path d="M 60 92 Q 72 82 84 92 Q 86 102 72 108 Q 58 102 60 92 Z" fill="#f8fafc"/>
    <path d="M 68 102 Q 72 112 76 102 Z" fill="#cbd5e1"/> <!-- Beard accent -->
    <!-- Elder Face profile/expression (calm, welcoming smile) -->
    <path d="M 78 94 Q 81 96 79 98" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Elder Arm gesturing warmly -->
    <path d="M 88 135 Q 100 145 95 155" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="95" cy="155" r="5" fill="#fbcfe8"/>
  </g>

  <!-- RIGHT FIGURE: The Youth (Bowing respectfully - 礼貌 lǐmào action) -->
  <g filter="url(#softShadow)">
    <!-- Body angled in a respectful bow -->
    <g transform="translate(160, 135) rotate(-25)">
      <!-- Torso -->
      <rect x="-15" y="-30" width="30" height="50" rx="8" fill="url(#youthJacket)"/>
      <!-- Head bowing down respectfully -->
      <circle cx="0" cy="-42" r="14" fill="#fbcfe8"/>
      <!-- Neat black hair -->
      <path d="M -12 -48 Q 0 -58 12 -48 Q 14 -40 8 -42 Q 0 -46 -8 -42 Q -14 -40 -12 -48 Z" fill="#0f172a"/>
      <!-- Closed respectful eyes (happy/polite curved lines) -->
      <path d="M -4 -42 Q -2 -40 0 -42" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 2 -42 Q 4 -40 6 -42" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Folded hands performing formal polite greeting gesture (Chánggǒng / Bowing hands) -->
      <path d="M -10 -15 Q 0 -22 10 -15 L 15 -5 Q 0 0 -15 -5 Z" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
      <circle cx="0" cy="-12" r="6" fill="#fbcfe8" stroke="#c2410c" stroke-width="1.5"/>
    </g>

    <!-- Youth Legs (Standing firm while bowing) -->
    <path d="M 148 150 L 145 190" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M 160 150 L 165 190" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="143" cy="190" rx="6" ry="3" fill="#0f172a"/>
    <ellipse cx="167" cy="190" rx="6" ry="3" fill="#0f172a"/>
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles of Respect & Harmony -->
  <g fill="#fbbf24">
    <circle cx="115" cy="100" r="2.5" opacity="0.8"/>
    <circle cx="130" cy="90" r="1.5" opacity="0.6"/>
    <circle cx="100" cy="115" r="2" opacity="0.7"/>
    <!-- Sparkle star 1 -->
    <path d="M 125 110 Q 125 115 130 115 Q 125 115 125 120 Q 125 115 120 115 Q 125 115 125 110 Z" fill="#f59e0b"/>
    <!-- Sparkle star 2 -->
    <path d="M 105 95 Q 105 98 108 98 Q 105 98 105 101 Q 105 98 102 98 Q 105 98 105 95 Z" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Dynamic Accent Frame/Border -->
  <rect x="8" y="8" width="224" height="224" rx="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>
</svg>