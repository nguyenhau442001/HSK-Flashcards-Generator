<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm/Good Temper Gradient (Left Side) -->
    <linearGradient id="goodSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Fiery/Bad Temper Gradient (Right Side) -->
    <linearGradient id="fieryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Character Outfit / Sofa Gradients -->
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Room Details & Environment (Atmospheric Depth) -->
  <!-- Floor -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="#090d16" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Wall Decor: Window showing split mood (Sunny vs Stormy) -->
  <rect x="90" y="30" width="60" height="70" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <!-- Split Window Pane -->
  <line x1="120" y1="30" x2="120" y2="100" stroke="#475569" stroke-width="2"/>
  <line x1="90" y1="65" x2="120" y2="65" stroke="#475569" stroke-width="2"/>
  <!-- Left Window: Sunny Good Temper -->
  <circle cx="105" cy="48" r="8" fill="#fbbf24" opacity="0.9"/>
  <path d="M 95 60 Q 105 52 115 60" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <!-- Right Window: Stormy Bad Temper -->
  <path d="M 130 50 L 136 44 L 133 54 L 142 46" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Potted Plant (Good Temper Symbol: thriving, green) -->
  <path d="M 30 155 L 50 155 L 45 180 L 35 180 Z" fill="#64748b"/>
  <circle cx="40" cy="145" r="14" fill="#10b981" opacity="0.8"/>
  <circle cx="30" cy="150" r="10" fill="#059669" opacity="0.9"/>
  <circle cx="50" cy="150" r="10" fill="#34d399" opacity="0.9"/>

  <!-- Teapot & Steam (Calm environment props) -->
  <path d="M 195 160 Q 205 160 210 168 L 190 168 Q 195 160 195 160 Z" fill="#cbd5e1"/>
  <path d="M 190 145 Q 200 145 200 160 L 180 160 Q 180 145 190 145 Z" fill="#e2e8f0"/>
  <!-- Steam curls -->
  <path d="M 185 138 Q 190 130 185 122" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Central Subject: The Duality of Temper (Personified / Scene Objects) -->
  <!-- Sofa / Seat where the character sits -->
  <path d="M 70 140 Q 120 130 170 140 L 180 180 L 60 180 Z" fill="url(#sofaGrad)"/>
  <path d="M 60 130 L 180 130 L 170 140 L 70 140 Z" fill="#475569"/>

  <!-- Split Persona Character illustrating "Temper" (脾气) -->
  <!-- Left Half: Calm, Smiling, Gentle Temper -->
  <g>
    <!-- Body / Shirt (Left) -->
    <path d="M 120 170 L 90 170 L 85 125 L 120 120 Z" fill="#38bdf8"/>
    <!-- Arm relaxed -->
    <path d="M 85 130 Q 70 140 75 155" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Head (Left Half) -->
    <path d="M 120 85 C 100 85 90 100 90 115 C 90 125 100 135 120 135 Z" fill="#fde047"/>
    <!-- Gentle Eye & Smile -->
    <path d="M 102 110 Q 106 105 110 110" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 103 118 Q 107 122 111 118" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <!-- Soft Aura Glow -->
    <circle cx="105" cy="110" r="18" fill="#10b981" opacity="0.15" filter="url(#glow)"/>
  </g>

  <!-- Right Half: Fiery, Intense, Hot Temper -->
  <g>
    <!-- Body / Shirt (Right) -->
    <path d="M 120 170 L 150 170 L 155 125 L 120 120 Z" fill="#fb923c"/>
    <!-- Arm tense/fisted -->
    <path d="M 155 130 Q 175 130 165 150" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="165" cy="152" r="5" fill="#ea580c"/>
    <!-- Head (Right Half) -->
    <path d="M 120 85 C 140 85 150 100 150 115 C 150 125 140 135 120 135 Z" fill="#fed7aa"/>
    <!-- Sharp Angry Eye & Frown -->
    <path d="M 130 108 L 138 112" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 128 106 L 138 108" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 131 118 Q 134 115 137 118" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Fiery Hair / Spikes -->
    <path d="M 135 85 L 145 70 L 140 82 L 152 75 L 143 88" fill="#ea580c"/>
    <!-- Fiery Aura Glow -->
    <circle cx="135" cy="110" r="22" fill="#ef4444" opacity="0.25" filter="url(#glow)"/>
  </g>

  <!-- Floating Expression Elements (Action & Narrative reinforcement) -->
  <!-- Floating Hearts (Good Temper vibe) on left -->
  <path d="M 70 85 Q 75 78 80 85 Q 85 92 75 100 Q 65 92 70 85 Z" fill="#34d399" opacity="0.8"/>
  <path d="M 50 105 Q 53 100 56 105 Q 59 110 53 115 Q 47 110 50 105 Z" fill="#34d399" opacity="0.6"/>

  <!-- Floating Sparks / Flame Embers (Bad Temper vibe) on right -->
  <path d="M 175 80 Q 180 70 170 65 Q 180 75 175 80 Z" fill="#fbbf24"/>
  <path d="M 190 95 Q 195 88 188 85 Q 193 92 190 95 Z" fill="#ef4444"/>
  <circle cx="165" cy="95" r="2" fill="#f59e0b"/>
  <circle cx="182" cy="110" r="1.5" fill="#ea580c"/>

  <!-- Foreground / Composition Polish -->
  <!-- Subtle lighting vignette -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>