<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Classroom Atmosphere / Back wall props -->
  <path d="M40 70 L90 70 L85 100 L45 100 Z" fill="#334155" opacity="0.4"/>
  <circle cx="65" cy="85" r="12" fill="#475569" opacity="0.5"/>
  <line x1="60" y1="85" x2="70" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <line x1="65" y1="80" x2="65" y2="90" stroke="#94a3b8" stroke-width="2"/>

  <!-- Classroom Desk (Foreground/Midground) -->
  <path d="M20 160 L220 160 L205 210 L35 210 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <path d="M25 160 L215 160 L215 166 L25 166 Z" fill="#475569"/>

  <!-- Teacher's Gesture / Pointing Hand (Left / Off-canvas context implied or side angle) -->
  <!-- Student Character (Right side, looking down remorseful/corrected) -->
  <!-- Student Body & Hoodie -->
  <path d="M150 210 L140 170 C140 155 165 145 180 145 C195 145 220 155 220 170 L210 210 Z" fill="#0284c7" filter="url(#shadow)"/>
  <path d="M180 145 C170 145 160 155 160 165 L200 165 C200 155 190 145 180 145 Z" fill="#38bdf8"/> <!-- Hoodie collar -->

  <!-- Student Head -->
  <circle cx="180" cy="120" r="24" fill="#fed7aa"/>
  <!-- Hair -->
  <path d="M156 120 C156 104 170 96 180 96 C195 96 204 104 204 120 C202 114 196 110 180 110 C164 110 158 114 156 120 Z" fill="#334155"/>
  
  <!-- Worried/Guilty Facial Expression -->
  <!-- Drooping Eyebrows -->
  <line x1="168" y1="116" x2="176" y2="120" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="184" y1="120" x2="192" y2="116" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes (downcast, anxious dots/arcs) -->
  <circle cx="172" cy="124" r="2" fill="#1e293b"/>
  <circle cx="188" cy="124" r="2" fill="#1e293b"/>
  <!-- Nervous Sweat Drop -->
  <path d="M196 114 C196 114 200 120 200 123 C200 125 198 126 196 126 C194 126 192 125 192 123 C192 120 196 114 196 114 Z" fill="#38bdf8" opacity="0.8"/>
  <!-- Small Frown -->
  <path d="M177 136 C180 134 183 134 185 136" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Teacher's Evaluation / Exam Paper with Corrections (Central Focus of 'Criticism') -->
  <!-- Rotated clipboard / paper on desk -->
  <g transform="translate(75, 125) rotate(-12)" filter="url(#shadow)">
    <!-- Paper base -->
    <rect x="0" y="0" width="70" height="85" rx="4" fill="url(#paperGrad)"/>
    <!-- Clip at top -->
    <rect x="22" y="-6" width="26" height="10" rx="3" fill="#64748b"/>
    <rect x="25" y="-4" width="20" height="6" rx="2" fill="#cbd5e1"/>

    <!-- Incorrect Lines / Student writing -->
    <line x1="10" y1="20" x2="50" y2="20" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="32" x2="40" y2="32" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="44" x2="55" y2="44" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="56" x2="45" y2="56" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Heavy Red Pen Corrections (The essence of Criticism/Pifing) -->
    <!-- Big Red Cross / Corrections -->
    <path d="M35 15 L55 35 M55 15 L35 35" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    <!-- Red Circling & Underlines -->
    <path d="M8 68 C20 62 45 62 58 68 C50 78 20 78 8 68 Z" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,2"/>
    <path d="M12 48 Q 28 58 52 42" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Big Bold Red Score at Top -->
    <path d="M14 14 C14 11 18 11 18 14 L18 26 C18 29 14 29 14 26 Z" fill="#ef4444"/>
    <circle cx="16" cy="31" r="2" fill="#ef4444"/>
  </g>

  <!-- Teacher's Red Pen (Pointing directly at the errors, active action) -->
  <g transform="translate(10, 60) rotate(25)" filter="url(#shadow)">
    <!-- Pen Body -->
    <path d="M100 80 L120 70 L160 110 L140 120 Z" fill="#ef4444"/>
    <path d="M110 75 L125 67 L130 72 L115 80 Z" fill="#fca5a5"/>
    <!-- Pen Tip -->
    <path d="M90 85 L100 80 L105 90 Z" fill="#b91c1c"/>
    <path d="M86 87 L90 85 L88 89 Z" fill="#ffffff"/> <!-- highlight glare -->
  </g>

  <!-- Ambient / Action Sparkles or Visual Tension Indicators -->
  <g fill="#fbbf24">
    <circle cx="115" cy="95" r="2.5" opacity="0.8"/>
    <circle cx="45" cy="115" r="2" opacity="0.6"/>
  </g>
  <g stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="55" y1="105" x2="62" y2="112"/>
    <line x1="62" y1="105" x2="55" y2="112"/>
  </g>
</svg>