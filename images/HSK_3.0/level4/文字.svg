<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment & Props -->
  <!-- Ambient light pool from desk lamp -->
  <circle cx="120" cy="110" r="90" fill="url(#lamp-glow)" />

  <!-- Bookshelf / Wall details in background -->
  <rect x="25" y="30" width="40" height="60" rx="4" fill="#334155" opacity="0.6" />
  <rect x="30" y="40" width="30" height="4" fill="#64748b" opacity="0.4" />
  <rect x="30" y="55" width="25" height="4" fill="#64748b" opacity="0.4" />
  
  <rect x="175" y="45" width="35" height="45" rx="4" fill="#334155" opacity="0.6" />
  <polygon points="180,75 195,55 205,75" fill="#475569" opacity="0.5" />

  <!-- Wooden Desk Surface -->
  <path d="M 10 180 L 230 180 L 220 220 L 20 220 Z" fill="#334155" />
  <path d="M 10 175 L 230 175 L 230 180 L 10 180 Z" fill="#475569" />

  <!-- Laptop / Tablet (The Writing Tool) -->
  <g transform="translate(105, 125)">
    <!-- Laptop Base -->
    <path d="M -30 35 L 50 35 L 60 48 L -40 48 Z" fill="#64748b" />
    <path d="M -38 46 L 58 46 L 60 49 L -40 49 Z" fill="#94a3b8" />
    <rect x="-5" y="38" width="18" height="6" rx="2" fill="#475569" />
    
    <!-- Screen Frame -->
    <path d="M -32 -5 L 42 -5 L 50 35 L -40 35 Z" fill="#475569" />
    <rect x="-37" y="-8" width="84" height="41" rx="4" fill="#1e293b" />
    <rect x="-33" y="-5" width="76" height="35" rx="2" fill="url(#screen-glow)" />

    <!-- Abstract strokes on screen representing the act of writing Chinese characters -->
    <path d="M -20 5 L -10 5 M -15 2 L -15 15" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <path d="M 0 3 L 15 3 M 7 3 L 7 18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <path d="M 22 8 L 32 8 M 27 6 L 25 17" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Physical Notebook (Alternative medium on desk) -->
  <g transform="translate(45, 155) rotate(-8)">
    <rect x="0" y="0" width="45" height="35" rx="2" fill="#f8fafc" />
    <line x1="6" y1="8" x2="39" y2="8" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="6" y1="15" x2="35" y2="15" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="6" y1="22" x2="39" y2="22" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Red check/stroke mark -->
    <path d="M 10 25 L 14 28 L 22 18" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Coffee Mug with Steam -->
  <g transform="translate(195, 145)">
    <rect x="0" y="5" width="14" height="18" rx="2" fill="#f1f5f9" />
    <path d="M 14 8 C 19 8, 19 18, 14 18" fill="none" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 4 0 C 4 -3, 8 -3, 8 -6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 10 2 C 10 -1, 6 -1, 6 -4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Character / Person actively writing -->
  <g transform="translate(70, 75)">
    <!-- Body & Hoodie -->
    <path d="M 15 70 C 5 70, -5 85, -15 105 L 65 105 C 50 85, 40 70, 30 70 Z" fill="#6366f1" />
    <!-- Hoodie Hood / Shoulders -->
    <path d="M 8 40 C -2 40, -10 50, -5 65 C 10 75, 30 75, 45 65 C 50 50, 42 40, 32 40 Z" fill="#4f46e5" />

    <!-- Neck -->
    <rect x="15" y="33" width="10" height="12" fill="#fdba74" />

    <!-- Head -->
    <circle cx="20" cy="22" r="15" fill="#fed7aa" />

    <!-- Hair -->
    <path d="M 6 18 C 6 8, 15 5, 23 6 C 31 7, 34 14, 34 22 C 34 22, 30 14, 21 13 C 12 12, 8 16, 6 18 Z" fill="#1e293b" />

    <!-- Face Profile / Expression (Focused, smiling slightly while writing) -->
    <circle cx="27" cy="21" r="1.5" fill="#1e293b" />
    <path d="M 28 26 C 29 27, 31 27, 32 26" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" />

    <!-- Arm & Hand Actively Typing / Writing -->
    <!-- Upper Arm -->
    <path d="M 25 55 C 35 55, 45 65, 50 75" fill="none" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" />
    <!-- Forearm & Hand reaching forward -->
    <path d="M 50 75 C 55 82, 65 85, 75 80" fill="none" stroke="#fdba74" stroke-width="6" stroke-linecap="round" />
    <circle cx="76" cy="79" r="3.5" fill="#fed7aa" />
  </g>

  <!-- Adjustable Desk Lamp (Overhead) -->
  <g transform="translate(160, 0)">
    <!-- Lamp Base/Arm mount -->
    <path d="M 0 0 L -20 40 L -25 45" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp Shade -->
    <path d="M -40 45 L -5 45 L -15 65 L -30 65 Z" fill="#f59e0b" />
    <!-- Light cone overlay for atmosphere -->
    <polygon points="-22,65 -55,160 30,160" fill="#fbbf24" opacity="0.08" />
  </g>

</svg>