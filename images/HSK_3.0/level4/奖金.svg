<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Laptop Base -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#64748b"/>
  <rect x="50" y="150" width="140" height="30" rx="2" fill="#475569"/>
  
  <!-- Screen -->
  <rect x="60" y="60" width="120" height="80" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="120" cy="100" r="15" fill="#fbbf24" opacity="0.2"/>
  <path d="M110 90 L130 110 M130 90 L110 110" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The Bonus (Envelope) -->
  <g transform="translate(140, 150) rotate(15)">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#f59e0b"/>
    <path d="M0 0 L30 20 L60 0" fill="#fb923c"/>
    <rect x="10" y="10" width="40" height="20" rx="2" fill="#fff" opacity="0.2"/>
  </g>

  <!-- Confetti/Celebration Accents -->
  <circle cx="30" cy="50" r="4" fill="#10b981"/>
  <circle cx="210" cy="40" r="3" fill="#ec4899"/>
  <circle cx="190" cy="190" r="5" fill="#38bdf8"/>
  
  <!-- Coffee Cup -->
  <rect x="20" y="150" width="20" height="25" rx="2" fill="#94a3b8"/>
  <path d="M40 155 Q45 155 45 165 Q45 175 40 175" fill="none" stroke="#94a3b8" stroke-width="3"/>
</svg>