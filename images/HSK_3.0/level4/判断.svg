<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Hologram & Screen Gradients -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Scale & Judge Elements Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Background Details (Detective/Analysis Office Environment) -->
  <g opacity="0.15">
    <!-- Grid Pattern -->
    <path d="M0 40 H240 M0 80 H240 M0 120 H240 M0 160 H240 M0 200 H240" stroke="#38bdf8" stroke-width="0.5"/>
    <path d="M40 0 V240 M80 0 V240 M120 0 V240 M160 0 V240 M200 0 V240" stroke="#38bdf8" stroke-width="0.5"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 20 195 L 220 195 L 235 220 L 5 220 Z" fill="#090d16" filter="url(#softShadow)"/>
  <rect x="20" y="190" width="200" height="6" rx="3" fill="#334155"/>

  <!-- Holographic Analysis Projection Cone -->
  <polygon points="120,95 70,190 170,190" fill="url(#beamGrad)" />

  <!-- Holographic Floating Data Nodes (Representing evaluation, facts, and logical choice) -->
  <g filter="url(#glow)">
    <!-- Left Data Node (Fact A) -->
    <circle cx="85" cy="130" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M79 130 L83 134 L91 126" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Right Data Node (Fact B) -->
    <circle cx="155" cy="130" r="14" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <circle cx="155" cy="130" r="6" fill="#fb923c"/>

    <!-- Connecting Data Lines -->
    <path d="M99 130 H141" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  </g>

  <!-- Central Holographic Target / Decision Grid -->
  <circle cx="120" cy="165" r="22" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="120" cy="165" r="10" fill="#38bdf8" opacity="0.3"/>
  <circle cx="120" cy="165" r="4" fill="#38bdf8"/>

  <!-- Main Subject: The Balance Scale / Judgment Device (Modern Stylized) -->
  <g transform="translate(0, -10)" filter="url(#softShadow)">
    <!-- Scale Base / Stand -->
    <path d="M 105 185 L 135 185 L 130 190 L 110 190 Z" fill="#64748b"/>
    <rect x="117" y="105" width="6" height="82" rx="3" fill="url(#goldGrad)"/>
    <circle cx="120" cy="105" r="8" fill="#f59e0b"/>

    <!-- Scale Beam -->
    <path d="M 75 102 L 165 102 L 160 110 L 80 110 Z" fill="url(#goldGrad)" rx="2"/>

    <!-- Left Pan (Weighing Evidence) -->
    <path d="M 75 106 L 60 145 H 90 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="75" cy="145" rx="18" ry="6" fill="url(#accentCyan)" stroke="#bae6fd" stroke-width="1.5"/>
    <!-- Evidence Cube in Left Pan -->
    <path d="M 70 141 L 75 137 L 80 141 L 75 145 Z" fill="#f43f5e"/>

    <!-- Right Pan (Decided Outcome) -->
    <path d="M 165 106 L 150 140 H 180 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="165" cy="140" rx="18" ry="6" fill="url(#goldGrad)" stroke="#fde68a" stroke-width="1.5"/>
    <!-- Glowing Star/Result in Right Pan -->
    <path d="M 165 125 L 167.5 131.5 L 174.5 132 L 169 136.5 L 171 143 L 165 139.5 L 159 143 L 161 136.5 L 155.5 132 L 162.5 131.5 Z" fill="#fef08a"/>
  </g>

  <!-- Holographic Magnifying Glass / Analysis Tool hovering above -->
  <g transform="translate(145, 45) rotate(-15)" filter="url(#softShadow)">
    <!-- Handle -->
    <rect x="-4" y="20" width="8" height="28" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
    <!-- Glass Rim -->
    <circle cx="0" cy="0" r="22" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="3"/>
    <!-- Internal Lens Reflection -->
    <path d="M -12 -12 Q 0 -18 12 -12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Floating Ambient Particles / Sparkles for Action/Insight -->
  <g fill="#38bdf8">
    <circle cx="45" cy="85" r="2.5" opacity="0.8"/>
    <circle cx="55" cy="75" r="1.5" opacity="0.5"/>
    <circle cx="195" cy="95" r="2" opacity="0.9"/>
    <circle cx="185" cy="65" r="3" opacity="0.4"/>
    <circle cx="105" cy="55" r="1.5" opacity="0.7"/>
  </g>
  
  <g fill="#fbbf24">
    <circle cx="135" cy="50" r="2" opacity="0.9"/>
    <circle cx="75" cy="115" r="1.5" opacity="0.6"/>
    <circle cx="165" cy="110" r="2.5" opacity="0.8"/>
  </g>

  <!-- Foreground Atmospheric Glow Accent -->
  <circle cx="120" cy="190" r="50" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
</svg>