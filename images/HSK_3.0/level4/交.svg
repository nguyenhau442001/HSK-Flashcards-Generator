<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Motion/Handover Path Glow -->
    <linearGradient id="handoverGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Overhead Warm Light -->
  <circle cx="120" cy="0" r="140" fill="url(#lampGlow)"/>

  <!-- Background Environment / Bookshelf & Interior -->
  <g opacity="0.6">
    <!-- Shelf -->
    <rect x="30" y="40" width="180" height="6" rx="3" fill="#475569"/>
    <!-- Books on Shelf -->
    <rect x="45" y="18" width="10" height="22" rx="2" fill="#f43f5e"/>
    <rect x="57" y="15" width="14" height="25" rx="2" fill="#38bdf8"/>
    <rect x="73" y="20" width="8" height="20" rx="2" fill="#fbbf24"/>
    <rect x="175" y="14" width="16" height="26" rx="2" fill="#10b981"/>
    <rect x="193" y="18" width="12" height="22" rx="2" fill="#a855f7"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <rect x="0" y="176" width="240" height="4" fill="#475569"/>

  <!-- Desk Props (Pencil holder & small lamp base) -->
  <!-- Pencil Holder -->
  <rect x="25" y="145" width="22" height="35" rx="4" fill="#64748b"/>
  <path d="M 23 145 L 49 145 L 47 151 L 25 151 Z" fill="#94a3b8"/>
  <line x1="31" y1="145" x2="28" y2="132" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <line x1="37" y1="145" x2="38" y2="130" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="43" y1="145" x2="46" y2="134" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- MOTION / HANDOVER ARC (Representing 'giao, đưa' - transferring/handing over) -->
  <path d="M 95 125 Q 120 100 145 125" fill="none" stroke="url(#handoverGlow)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Floating action sparkles -->
  <circle cx="120" cy="102" r="3" fill="#38bdf8"/>
  <circle cx="110" cy="107" r="2" fill="#fbbf24"/>
  <circle cx="130" cy="107" r="2" fill="#fbbf24"/>

  <!-- MAIN SUBJECT: Handing over Homework / Document (Giao, đưa) -->
  
  <!-- Character Left (Student giving) - Sleeves/Arm -->
  <!-- Left Body/Shoulder -->
  <path d="M 10 200 Q 15 160 55 150 L 65 180 Z" fill="#3b82f6"/>
  <!-- Left Arm extending forward -->
  <path d="M 40 155 Q 70 150 95 135 L 98 148 Q 75 160 45 168 Z" fill="#3b82f6"/>
  <!-- Left Hand -->
  <circle cx="98" cy="142" r="8" fill="#fbcfe8"/>

  <!-- Character Right (Teacher/Person receiving) - Sleeves/Arm -->
  <!-- Right Body/Shoulder -->
  <path d="M 230 200 Q 225 160 185 150 L 175 180 Z" fill="#10b981"/>
  <!-- Right Arm extending forward to receive -->
  <path d="M 200 155 Q 170 150 145 135 L 142 148 Q 165 160 195 168 Z" fill="#10b981"/>
  <!-- Right Hand -->
  <circle cx="142" cy="142" r="8" fill="#fbcfe8"/>

  <!-- THE ITEM BEING HANDED OVER: Homework/Assignment Folder & Papers -->
  <g filter="url(#shadow)">
    <!-- Folder Base (Tilt-angle representing active transfer) -->
    <g transform="translate(120, 125) rotate(-10)">
      <!-- Folder Back -->
      <rect x="-22" y="-16" width="44" height="32" rx="4" fill="#fb923c"/>
      <!-- Papers inside -->
      <rect x="-18" y="-22" width="36" height="28" rx="2" fill="#f8fafc"/>
      <!-- Mock lines on paper -->
      <line x1="-12" y1="-14" x2="6" y2="-14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="-12" y1="-8" x2="10" y2="-8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="-12" y1="-2" x2="2" y2="-2" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <!-- Red checkmark stamp on top paper -->
      <polyline points="2,2 6,7 12, -1" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Folder Front Cover -->
      <path d="M -22 -6 L 22 -6 L 22 16 C 22 18.2 20.2 20 18 20 L -18 20 C -20.2 20 -22 18.2 -22 16 Z" fill="#f97316"/>
      <!-- Folder Tab -->
      <path d="M -12 -16 L -4 -16 L -1 -6 L -15 -6 Z" fill="#ea580c"/>
    </g>
  </g>

  <!-- Character Heads/Faces for rich scene context -->
  <!-- Left Character Head (Peeking into frame) -->
  <g transform="translate(35, 125)">
    <circle cx="0" cy="0" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M -16 -5 Q -2 -20 16 -5 Q 12 -22 -4 -20 Q -18 -18 -16 -5" fill="#1e293b"/>
    <!-- Friendly smiling eye -->
    <path d="M -4 -2 Q -1 2 2 -2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy cheek -->
    <circle cx="5" cy="5" r="4" fill="#fda4af" opacity="0.6"/>
  </g>

  <!-- Right Character Head (Peeking into frame) -->
  <g transform="translate(205, 125)">
    <circle cx="0" cy="0" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M -16 -8 Q 4 -22 18 -5 Q 10 -15 -2 -15 Q -10 -15 -16 -8" fill="#334155"/>
    <!-- Glasses -->
    <circle cx="4" cy="-2" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <!-- Friendly smiling eye -->
    <path d="M 2 -2 Q 4 1 6 -2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy cheek -->
    <circle cx="-3" cy="5" r="4" fill="#fda4af" opacity="0.6"/>
  </g>

  <!-- Foreground Atmospheric Details -->
  <!-- Small plant on desk right -->
  <path d="M 205 180 L 215 160 L 225 180 Z" fill="#475569"/>
  <ellipse cx="215" cy="160" rx="10" ry="4" fill="#64748b"/>
  <!-- Leaves -->
  <path d="M 215 156 Q 205 140 198 145 Q 205 155 215 156 Z" fill="#10b981"/>
  <path d="M 215 156 Q 225 135 232 142 Q 222 150 215 156 Z" fill="#34d399"/>
  <path d="M 215 156 Q 215 130 215 135 Q 215 145 215 156 Z" fill="#10b981"/>

</svg>