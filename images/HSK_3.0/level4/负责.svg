<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk / Surface Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Project Board Gradient -->
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Golden Highlight Glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Badge/Stamp Gradient (Symbolizing Ownership/Responsibility) -->
    <linearGradient id="stamp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#glow)" />

  <!-- Background Environment (Office Wall & Shelves) -->
  <path d="M0 0 H240 V150 H0 Z" fill="#1e293b" />
  <line x1="0" y1="150" x2="240" y2="150" stroke="#475569" stroke-width="2" />
  
  <!-- Ambient Wall Props (Project Charts on Wall) -->
  <rect x="30" y="30" width="50" height="60" rx="4" fill="#334155" opacity="0.6" />
  <polyline points="40,75 50,55 60,65 70,45" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  
  <rect x="90" y="40" width="40" height="50" rx="4" fill="#334155" opacity="0.6" />
  <line x1="100" y1="55" x2="120" y2="55" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="100" y1="65" x2="115" y2="65" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="100" y1="75" x2="110" y2="75" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Desk Surface -->
  <path d="M0 150 L240 150 L240 240 L0 240 Z" fill="url(#desk-grad)" />
  <path d="M0 150 H240 V156 H0 Z" fill="#475569" />

  <!-- Laptop / Workstation Setup -->
  <g filter="url(#shadow)">
    <!-- Laptop Base -->
    <path d="M60 175 L120 175 L135 195 L45 195 Z" fill="#64748b" />
    <path d="M40 195 H140 V198 H40 Z" fill="#94a3b8" rx="1" />
    <rect x="80" y="182" width="20" height="8" rx="2" fill="#475569" />

    <!-- Laptop Screen -->
    <path d="M52 115 H128 V175 H52 Z" fill="#334155" rx="4" />
    <rect x="58" y="121" width="64" height="48" rx="2" fill="#0f172a" />
    <!-- Dashboard UI on screen -->
    <rect x="64" y="128" width="20" height="12" rx="2" fill="#38bdf8" opacity="0.8" />
    <rect x="88" y="128" width="28" height="12" rx="2" fill="#10b981" opacity="0.8" />
    <rect x="64" y="144" width="52" height="18" rx="2" fill="#334155" />
    <polyline points="68,158 78,150 88,155 108,147" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Main Focal Object: The Project Blueprint/Contract with Approval Stamp (Representing Responsibility) -->
  <g filter="url(#shadow)" transform="translate(100, 110)">
    <!-- Document Stack / Base Paper -->
    <rect x="15" y="15" width="75" height="95" rx="4" fill="#cbd5e1" transform="rotate(8 50 50)" />
    <!-- Main Blueprint Document -->
    <rect x="10" y="10" width="75" height="95" rx="4" fill="#ffffff" />
    
    <!-- Blueprint Header -->
    <rect x="20" y="20" width="35" height="8" rx="2" fill="#3b82f6" />
    <circle cx="70" cy="24" r="5" fill="#ef4444" />

    <!-- Document Content Lines -->
    <line x1="20" y1="38" x2="75" y2="38" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="48" x2="65" y2="48" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="58" x2="70" y2="58" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Mini Bar Chart on Document -->
    <rect x="20" y="70" width="10" height="15" rx="1" fill="#10b981" />
    <rect x="35" y="65" width="10" height="20" rx="1" fill="#3b82f6" />
    <rect x="50" y="60" width="10" height="25" rx="1" fill="#f59e0b" />

    <!-- Official Approval Seal / Responsibility Stamp (The core visual metaphor for "chịu trách nhiệm") -->
    <g transform="translate(45, 60)">
      <circle cx="20" cy="20" r="18" fill="url(#stamp-grad)" opacity="0.9" />
      <circle cx="20" cy="20" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" />
      <!-- Checkmark Icon inside stamp -->
      <polyline points="12,20 18,26 28,14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Secondary Context Prop: Coffee Mug with Energy/Action Steam -->
  <g filter="url(#shadow)">
    <!-- Mug Body -->
    <path d="M195 170 H225 V205 C225 213 218 220 210 220 H210 C202 220 195 213 195 205 Z" fill="#ec4899" />
    <!-- Mug Handle -->
    <path d="M225 178 C238 178 238 202 225 202" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round" />
    <!-- Coffee Surface -->
    <ellipse cx="210" cy="170" rx="15" ry="4" fill="#701a75" />
    <!-- Steam / Focus Waves -->
    <path d="M205 155 C203 150 213 145 208 138" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <path d="M215 158 C217 153 207 148 212 140" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Foreground Plant / Nature Accent for Vibrancy -->
  <g filter="url(#shadow)">
    <!-- Pot -->
    <path d="M15 195 H35 L32 220 H18 Z" fill="#f97316" />
    <!-- Leaves -->
    <path d="M25 195 C25 180 10 165 5 160 C10 175 25 180 25 195 Z" fill="#10b981" />
    <path d="M25 195 C35 175 50 165 55 160 C45 175 25 185 25 195 Z" fill="#34d399" />
    <path d="M25 195 C20 175 25 155 25 150 C25 165 25 185 25 195 Z" fill="#059669" />
  </g>

  <!-- Action Sparkles / Success Highlights (Amplifying the "Ownership & Achievement" vibe) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M190 60 L193 68 L201 71 L193 74 L190 82 L187 74 L179 71 L187 68 Z" transform="scale(0.8) translate(40, -10)" />
    <!-- Star 2 -->
    <path d="M40 100 L42 105 L47 107 L42 109 L40 114 L38 109 L33 107 L38 105 Z" transform="scale(0.6) translate(10, 20)" opacity="0.8" />
  </g>
</svg>