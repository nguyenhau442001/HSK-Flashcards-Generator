<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Portal/Time Glow Gradient -->
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Gold Gradient for Clock/Century Rings -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Sci-Fi Blue Ring Gradient -->
    <linearGradient id="sciFiBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Stars/Particles -->
  <g fill="#94a3b8" opacity="0.4">
    <circle cx="35" cy="45" r="1.5" />
    <circle cx="205" cy="55" r="1" />
    <circle cx="180" cy="30" r="1.5" />
    <circle cx="60" cy="180" r="1" />
    <circle cx="210" cy="190" r="1.5" />
    <circle cx="25" cy="130" r="1" />
  </g>

  <!-- Ambient Portal Glow behind the Time Machine / Epoch Monolith -->
  <circle cx="120" cy="115" r="75" fill="url(#portalGlow)" />

  <!-- Floating Floor / Platform (Sci-Fi Observatory Deck) -->
  <ellipse cx="120" cy="190" rx="85" ry="25" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <ellipse cx="120" cy="190" rx="65" ry="18" fill="#0f172a" />
  <!-- Glowing floor ring -->
  <ellipse cx="120" cy="190" rx="75" ry="21" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="6 4" />

  <!-- Background Cogs / Time Gear Elements (Representing Eras / Centuries) -->
  <g transform="translate(120, 115)">
    <!-- Outer Large Gear (Ancient / Past Century) -->
    <g transform="rotate(15)" opacity="0.3">
      <circle cx="0" cy="0" r="62" fill="none" stroke="#fb923c" stroke-width="6" stroke-dasharray="16 8" />
    </g>
    <!-- Middle Sci-Fi Ring (Present/Future Century) -->
    <g transform="rotate(-30)" filter="url(#glow)">
      <circle cx="0" cy="0" r="50" fill="none" stroke="url(#sciFiBlue)" stroke-width="3" stroke-dasharray="24 12" />
    </g>
    <!-- Inner Gold Ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Central Monumental Time Portal / Century Gateway Structure -->
  <!-- Left Pillar -->
  <path d="M 75 160 L 82 60 L 92 65 L 87 165 Z" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  <path d="M 82 60 L 87 65 L 87 165 L 82 160 Z" fill="#475569" />
  <!-- Right Pillar -->
  <path d="M 165 160 L 158 60 L 148 65 L 153 165 Z" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  <path d="M 158 60 L 153 65 L 153 165 L 158 160 Z" fill="#1e293b" />

  <!-- Top Arch Connecting Pillars -->
  <path d="M 78 65 Q 120 45 162 65 L 158 55 Q 120 35 82 55 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Floating Core: The Grand Epoch Clock / Century Sphere -->
  <circle cx="120" cy="105" r="28" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Clock Inner Details -->
  <circle cx="120" cy="105" r="23" fill="#1e293b" />
  <!-- Clock hands pointing across time -->
  <line x1="120" y1="105" x2="120" y2="90" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
  <line x1="120" y1="105" x2="133" y2="109" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="120" cy="105" r="3.5" fill="#f59e0b" />

  <!-- Energy Beam / Time Vortex rays inside portal -->
  <path d="M 120 75 L 120 135" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
  <path d="M 90 105 L 150 105" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />

  <!-- Foreground Adventurer Character (Time Traveler / Explorer pointing forward) -->
  <g transform="translate(120, 155)">
    <!-- Character Shadow -->
    <ellipse cx="0" cy="30" rx="18" ry="6" fill="#090d16" opacity="0.6" />

    <!-- Legs (Dynamic Stance) -->
    <path d="M -8 15 L -14 30 L -6 32 L -2 18 Z" fill="#0284c7" />
    <path d="M 6 15 L 12 30 L 18 28 L 10 16 Z" fill="#0284c7" />
    <!-- Boots -->
    <path d="M -18 30 L -5 30 L -5 34 L -18 34 Z" fill="#334155" />
    <path d="M 10 28 L 22 28 L 22 32 L 10 32 Z" fill="#334155" />

    <!-- Torso (Jacket with Futuristic Vibe) -->
    <path d="M -12 -2 L 12 -2 L 14 18 L -14 18 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <!-- Jacket lapels/stripes -->
    <path d="M -4 -2 L 0 10 L 4 -2" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    <rect x="-3" y="4" width="6" height="12" rx="2" fill="#d97706" />

    <!-- Backpack / Time Device -->
    <rect x="-10" y="-1" width="20" height="15" rx="3" fill="#64748b" stroke="#94a3b8" stroke-width="1" />
    <circle cx="0" cy="6" r="3" fill="#38bdf8" />

    <!-- Head & Helmet -->
    <circle cx="0" cy="-12" r="9" fill="#fbcfe8" />
    <!-- Visor / Sci-Fi Goggles -->
    <path d="M -7 -14 L 7 -14 L 8 -10 L -8 -10 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
    <!-- Explorer Hair / Cap -->
    <path d="M -9 -17 Q 0 -22 9 -17 Q 8 -12 0 -13 Q -8 -12 -9 -17 Z" fill="#b45309" />

    <!-- Extended Arm Pointing at the Century Gateway -->
    <path d="M 10 -2 L 24 -6 L 26 -2 L 12 4 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="1" />
    <!-- Hand -->
    <circle cx="25" cy="-4" r="3" fill="#fbcfe8" />
  </g>

  <!-- Floating Historical & Futuristic Artifacts (Symbolizing passing centuries) -->
  <!-- Ancient Gear / Compass Cog (Left) -->
  <g transform="translate(50, 110) scale(0.7)" filter="url(#glow)">
    <circle cx="0" cy="0" r="16" fill="#b45309" stroke="#fef08a" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#1e293b" />
    <path d="M -22 0 L 22 0 M 0 -22 L 0 22" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Futuristic Floating Hologram Diamond (Right) -->
  <g transform="translate(190, 100)" filter="url(#glow)">
    <polygon points="0,-14 10,0 0,14 -10,0" fill="#38bdf8" opacity="0.8" stroke="#e0f2fe" stroke-width="1.5" />
    <polygon points="0,-14 10,0 0,0" fill="#7dd3fc" opacity="0.9" />
    <!-- Floating particle trail below -->
    <circle cx="0" cy="22" r="2" fill="#38bdf8" />
    <circle cx="0" cy="28" r="1" fill="#7dd3fc" opacity="0.6" />
  </g>

  <!-- Foreground Vignette Elements (Depth framing) -->
  <!-- Left corner glowing node -->
  <circle cx="20" cy="220" r="15" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="20" cy="220" r="4" fill="#38bdf8" opacity="0.8" />

  <!-- Right corner glowing node -->
  <circle cx="220" cy="220" r="15" fill="#f59e0b" opacity="0.15" filter="url(#glow)" />
  <circle cx="220" cy="220" r="4" fill="#f59e0b" opacity="0.8" />
</svg>