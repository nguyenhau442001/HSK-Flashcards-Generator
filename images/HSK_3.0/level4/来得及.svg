<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="platform" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="train" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Atmospheric Light Beams from station roof -->
  <polygon points="40,0 80,0 120,240 20,240" fill="url(#beam)"/>
  <polygon points="130,0 170,0 230,240 180,240" fill="url(#beam)"/>

  <!-- Station Structure / Background -->
  <rect x="20" y="20" width="200" height="15" rx="4" fill="#334155"/>
  <line x1="60" y1="35" x2="60" y2="170" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="120" y1="35" x2="120" y2="170" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="180" y1="35" x2="180" y2="170" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Big Station Clock (Showing "Just in time") -->
  <circle cx="120" cy="65" r="22" fill="#0f172a" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/>
  <circle cx="120" cy="65" r="2" fill="#fbbf24"/>
  <!-- Clock hands: almost at the limit, but not quite (Just in time!) -->
  <line x1="120" y1="65" x2="120" y2="51" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="65" x2="131" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Train Tracks & Platform -->
  <rect x="0" y="170" width="240" height="50" fill="url(#platform)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#64748b" stroke-width="3"/>
  
  <!-- Railway tracks below -->
  <rect x="0" y="215" width="240" height="6" fill="#0f172a"/>
  <line x1="0" y1="225" x2="240" y2="225" stroke="#475569" stroke-width="4"/>
  <line x1="0" y1="235" x2="240" y2="235" stroke="#475569" stroke-width="2"/>
  <!-- Rail ties -->
  <path d="M15,215 L25,238 M45,215 L55,238 M75,215 L85,238 M105,215 L115,238 M135,215 L145,238 M165,215 L175,238 M195,215 L205,238 M225,215 L235,238" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- High-Speed Train (Arriving, dynamic perspective) -->
  <g transform="translate(130, 130)">
    <!-- Train body -->
    <path d="M 0 40 L 80 40 C 95 40 105 25 100 15 L 70 -5 C 50 -15 20 -15 0 -5 Z" fill="url(#train)" filter="url(#glow)"/>
    <!-- Windshield -->
    <path d="M 55 10 L 85 15 C 90 15 92 20 88 25 L 65 30 Z" fill="#0f172a"/>
    <!-- Headlight beam & glow -->
    <path d="M 90 25 L 140 10 L 140 45 Z" fill="#fbbf24" opacity="0.3"/>
    <circle cx="92" cy="22" r="5" fill="#ffffff" filter="url(#glow)"/>
    <!-- Speed lines on train -->
    <line x1="10" y1="15" x2="40" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="20" y1="23" x2="50" y2="23" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Action Character (Running energetically, luggage flying slightly, "Just in time" pose) -->
  <g transform="translate(65, 110)">
    <!-- Motion dust/wind trails -->
    <path d="M -25 45 C -35 45 -40 40 -45 42" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M -15 52 C -25 52 -30 48 -35 50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Suitcase (Trailing behind) -->
    <g transform="translate(-25, 25) rotate(-15)">
      <rect x="0" y="0" width="16" height="20" rx="3" fill="#ec4899"/>
      <rect x="4" y="-5" width="8" height="5" rx="1" fill="none" stroke="#ec4899" stroke-width="2"/>
      <line x1="0" y1="7" x2="16" y2="7" stroke="#be185d" stroke-width="2"/>
      <circle cx="4" cy="22" r="2.5" fill="#0f172a"/>
      <circle cx="12" cy="22" r="2.5" fill="#0f172a"/>
    </g>

    <!-- Back arm (pumping forward) -->
    <path d="M 12 15 L 30 25" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32" cy="27" r="4" fill="#f8fafc"/>

    <!-- Torso (leaning forward for speed) -->
    <path d="M 0 5 L 15 35 C 15 38 10 42 5 40 L -5 20 Z" fill="#38bdf8"/>

    <!-- Scarf flowing back -->
    <path d="M 5 -2 C -10 -5 -25 0 -35 -10" stroke="#ef4444" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M -25 -6 C -32 -2 -38 2 -45 0" stroke="#ef4444" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Head & Face (Determined, smiling, sweating slightly of relief) -->
    <circle cx="5" cy="-8" r="11" fill="#f8fafc"/>
    <!-- Hair -->
    <path d="M -2 -14 C 2 -18 12 -16 14 -10 C 10 -12 4 -12 -2 -14 Z" fill="#1e293b"/>
    <!-- Determined Eye -->
    <line x1="7" y1="-8" x2="13" y2="-7" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 7 -3 C 9 -1 12 -3 13 -4" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Relief Sweat Drop -->
    <circle cx="14" cy="-12" r="2" fill="#38bdf8"/>

    <!-- Front Leg (Stiding forward) -->
    <path d="M 10 38 L 22 55" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <path d="M 22 55 L 32 58" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/> <!-- Shoe -->

    <!-- Back Leg (Pushing off) -->
    <path d="M -2 38 L -12 52" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <path d="M -12 52 L -20 50" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/> <!-- Shoe -->

    <!-- Front arm (pumping back) -->
    <path d="M 2 15 L -8 28" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-10" cy="30" r="4" fill="#f8fafc"/>
  </g>

  <!-- Sparkles / Success accents indicating "Just in time!" -->
  <g transform="translate(100, 95)" fill="#fbbf24">
    <path d="M 0 -8 C 1 -2 2 -1 8 0 C 2 1 1 2 0 8 C -1 2 -2 1 -8 0 C -2 -1 -1 -2 0 -8 Z" filter="url(#glow)"/>
  </g>
  <g transform="translate(145, 105) scale(0.6)" fill="#38bdf8">
    <path d="M 0 -8 C 1 -2 2 -1 8 0 C 2 1 1 2 0 8 C -1 2 -2 1 -8 0 C -2 -1 -1 -2 0 -8 Z" filter="url(#glow)"/>
  </g>
  <g transform="translate(75, 75) scale(0.8)" fill="#10b981">
    <path d="M 0 -8 C 1 -2 2 -1 8 0 C 2 1 1 2 0 8 C -1 2 -2 1 -8 0 C -2 -1 -1 -2 0 -8 Z" filter="url(#glow)"/>
  </g>
</svg>