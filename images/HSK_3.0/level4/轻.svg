<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for lightness/magic -->
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Teal/Blue accent glow for balance -->
    <radialGradient id="tealGlow" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Bag Leather Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Bag Pocket Gradient -->
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Balloon Gradient -->
    <linearGradient id="balloonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    
    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Lighting & Atmosphere -->
  <circle cx="120" cy="120" r="110" fill="url(#amberGlow)" />
  <circle cx="60" cy="180" r="80" fill="url(#tealGlow)" />

  <!-- Background Ambient Elements (Floating Leaves / Particles to show lightness) -->
  <g opacity="0.6">
    <path d="M40,90 Q45,85 52,92 Q47,97 40,90 Z" fill="#38bdf8" transform="rotate(15 45 90)" />
    <path d="M195,140 Q200,132 208,138 Q203,146 195,140 Z" fill="#fbbf24" transform="rotate(-30 200 140)" />
    <circle cx="180" cy="70" r="2.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="55" cy="150" r="2" fill="#fbbf24" opacity="0.8" />
    <circle cx="140" cy="45" r="1.5" fill="#ec4899" opacity="0.7" />
  </g>

  <!-- Floating Clouds (Setting the scene as airy/light) -->
  <g fill="url(#cloudGrad)" opacity="0.4">
    <path d="M20,190 Q25,180 38,185 Q45,175 60,180 Q75,175 82,185 Q95,182 100,195 Z" />
    <path d="M140,55 Q145,45 158,50 Q165,40 180,45 Q195,40 202,50 Q215,47 220,60 Z" />
  </g>

  <!-- MAIN SCENE: Floating Modern Backpack (Representing 'Light / 轻') -->
  <g filter="url(#dropShadow)" transform="translate(0, -4)">
    
    <!-- Floating Motion Trails / Magic Sparks beneath the bag -->
    <g opacity="0.8">
      <path d="M100,165 Q120,180 140,165" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="120" cy="182" r="3" fill="#fbbf24" filter="url(#softGlow)" />
      <circle cx="105" cy="177" r="1.5" fill="#38bdf8" />
      <circle cx="135" cy="177" r="1.5" fill="#38bdf8" />
    </g>

    <!-- Backpack Straps (Floating upward gracefully) -->
    <path d="M95,85 C80,70 75,50 85,35" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round" />
    <path d="M145,85 C160,70 165,50 155,35" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round" />

    <!-- Backpack Hanging Loop -->
    <path d="M108,74 C108,66 132,66 132,74" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" />

    <!-- Main Backpack Body -->
    <rect x="80" y="78" width="80" height="92" rx="22" fill="url(#bagGrad)" />
    
    <!-- Bag Zipper/Trim Accent -->
    <path d="M82,98 L158,98" stroke="#c2410c" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <!-- Front Pocket -->
    <rect x="92" y="112" width="56" height="46" rx="14" fill="url(#pocketGrad)" />
    <path d="M104,112 L136,112" stroke="#c2410c" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    
    <!-- Cute Details on Pocket: Tiny pinned badge / patch (Abstract playful shape, NO letters) -->
    <circle cx="120" cy="135" r="8" fill="#38bdf8" />
    <path d="M116,135 L120,131 L124,135 L120,139 Z" fill="#ffffff" opacity="0.9" />

    <!-- Side Pockets -->
    <path d="M74,105 Q80,105 80,125 Q80,140 74,135 Z" fill="#ea580c" />
    <path d="M166,105 Q160,105 160,125 Q160,140 166,135 Z" fill="#ea580c" />

    <!-- Highlight on Bag (Glossy 2D vector look) -->
    <path d="M88,86 C88,82 92,80 98,80 C104,80 106,84 106,88" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />

  </g>

  <!-- Floating Accessory: Cute Red Balloon tied to the bag, emphasizing lightness -->
  <g filter="url(#dropShadow)" transform="translate(25, -15)">
    <!-- String -->
    <path d="M85,145 Q70,120 75,90" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3" />
    <!-- Balloon Body -->
    <path d="M75,70 C60,70 55,50 65,38 C75,25 90,30 90,45 C90,60 85,70 75,70 Z" fill="url(#balloonGrad)" />
    <!-- Balloon Knot & Highlight -->
    <polygon points="73,70 77,70 75,74" fill="#be185d" />
    <path d="M68,45 C66,40 68,35 72,33" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Foreground Sparkles / Effortless Floating Effect -->
  <g>
    <!-- Sparkle top right -->
    <path d="M175,70 L178,78 L186,81 L178,84 L175,92 L172,84 L164,81 L172,78 Z" fill="#fbbf24" opacity="0.9" />
    <!-- Sparkle bottom left -->
    <path d="M65,160 L67,165 L72,167 L67,169 L65,174 L63,169 L58,167 L63,165 Z" fill="#38bdf8" opacity="0.8" />
    <!-- Tiny sparkle center top -->
    <circle cx="120" cy="42" r="2" fill="#ffffff" filter="url(#softGlow)" />
  </g>

</svg>