<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Document Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment & Window -->
  <g id="environment">
    <!-- Office Wall / Bookshelf in Background -->
    <rect x="30" y="25" width="180" height="95" rx="6" fill="#1b263b" />
    <!-- Bookshelf books -->
    <rect x="42" y="35" width="8" height="25" rx="2" fill="#3b82f6" />
    <rect x="52" y="32" width="12" height="28" rx="2" fill="#ef4444" />
    <rect x="66" y="38" width="6" height="22" rx="2" fill="#10b981" />
    <rect x="74" y="30" width="10" height="30" rx="2" fill="#f59e0b" />
    <!-- Shelf divider -->
    <rect x="36" y="60" width="168" height="3" fill="#334155" />
    <rect x="42" y="70" width="14" height="22" rx="2" fill="#8b5cf6" />
    <rect x="58" y="68" width="8" height="24" rx="2" fill="#ec4899" />

    <!-- Ambient Lamp Light Cone -->
    <path d="M190 20 L130 150 L230 150 Z" fill="url(#lamp-glow)" />

    <!-- Large Office Desk -->
    <rect x="15" y="145" width="210" height="75" rx="8" fill="#334155" />
    <rect x="15" y="145" width="210" height="10" rx="4" fill="#475569" />
  </g>

  <!-- Props & Office Equipment -->
  <g id="props">
    <!-- Desk Lamp -->
    <path d="M190 60 L170 145" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <path d="M180 50 C180 45 195 45 200 55 C205 65 190 70 180 70 Z" fill="#f59e0b" />
    <circle cx="170" cy="146" r="8" fill="#64748b" />

    <!-- Laptop showing organized workflow/stats -->
    <path d="M85 145 L65 120 L135 120 L125 145 Z" fill="#64748b" />
    <rect x="60" y="142" width="80" height="5" rx="2" fill="#94a3b8" />
    <rect x="70" y="123" width="60" height="20" rx="2" fill="#0f172a" />
    <!-- Screen UI Elements -->
    <rect x="74" y="127" width="15" height="4" rx="1" fill="#38bdf8" />
    <rect x="92" y="127" width="30" height="4" rx="1" fill="#334155" />
    <rect x="74" y="135" width="25" height="4" rx="1" fill="#10b981" />

    <!-- Coffee Mug -->
    <rect x="155" y="130" width="14" height="16" rx="3" fill="#cbd5e1" />
    <path d="M169 134 C174 134 174 142 169 142" stroke="#cbd5e1" stroke-width="2" fill="none" />
  </g>

  <!-- TARGET OBJECTS: 文件 (The Documents / Files being organized) -->
  <g id="target-documents" filter="url(#shadow)">
    <!-- Stack of documents (Being organized) -->
    <g transform="translate(100, 135) rotate(-5)">
      <rect x="0" y="0" width="36" height="26" rx="2" fill="#e2e8f0" />
      <line x1="6" y1="6" x2="20" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="12" x2="30" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="18" x2="24" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(115, 128) rotate(8)">
      <rect x="0" y="0" width="34" height="24" rx="2" fill="#f8fafc" />
      <circle cx="8" cy="8" r="3" fill="#3b82f6" />
      <line x1="14" y1="7" x2="28" y2="7" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="14" x2="28" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(108, 122) rotate(-2)">
      <rect x="0" y="0" width="32" height="22" rx="2" fill="#ffffff" />
      <line x1="6" y1="6" x2="20" y2="6" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="12" x2="26" y2="12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- File Folder (Open, containing sorted documents) -->
    <path d="M 85 155 L 145 155 L 155 175 L 75 175 Z" fill="#f59e0b" />
    <path d="M 80 148 L 110 148 L 115 155 L 75 155 Z" fill="#d97706" />
  </g>

  <!-- Character: Professional Working Woman Organizing Files -->
  <g id="character">
    <!-- Torso & Arms (Leaning forward, active posture) -->
    <path d="M 50 160 C 50 140, 70 130, 85 145 L 90 200 L 45 200 Z" fill="#0284c7" /> <!-- Blue Blouse -->
    
    <!-- Neck & Head -->
    <path d="M 68 115 L 72 132 L 62 132 Z" fill="#f8d7da" />
    <circle cx="67" cy="105" r="16" fill="#fcd34d" /> <!-- Face Base -->
    
    <!-- Hair Styling -->
    <path d="M 51 100 C 51 85, 83 85, 85 105 C 85 115, 80 130, 78 135 L 60 135 C 55 120, 51 110, 51 100 Z" fill="#1e293b" />
    <path d="M 53 102 C 60 92, 78 92, 83 105 C 80 100, 60 100, 53 102 Z" fill="#334155" /> <!-- Hair highlight -->

    <!-- Facial Expression: Focused, positive, diligent -->
    <path d="M 61 102 Q 65 98 69 102" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" /> <!-- Eyebrow -->
    <path d="M 73 102 Q 77 98 81 102" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" /> <!-- Eyebrow -->
    <circle cx="65" cy="107" r="2" fill="#1e293b" /> <!-- Eye -->
    <circle cx="77" cy="107" r="2" fill="#1e293b" /> <!-- Eye -->
    <!-- Warm confident smile -->
    <path d="M 69 113 Q 71 116 73 113" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Cute blush -->
    <circle cx="63" cy="111" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="79" cy="111" r="3" fill="#f43f5e" opacity="0.4" />

    <!-- Active Hands Organizing the Files -->
    <!-- Left Arm & Hand reaching down -->
    <path d="M 52 145 C 50 155, 60 165, 75 160" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" />
    <circle cx="78" cy="158" r="5" fill="#f8d7da" />

    <!-- Right Arm & Hand actively sorting -->
    <path d="M 85 145 C 95 150, 95 165, 88 172" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" />
    <circle cx="86" cy="174" r="5" fill="#f8d7da" />
  </g>

  <!-- Foreground Details & Polish -->
  <g id="foreground-accents">
    <!-- Pen Holder with Pens -->
    <rect x="25" y="165" width="16" height="20" rx="3" fill="#cbd5e1" />
    <line x1="29" y1="165" x2="27" y2="152" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="33" y1="165" x2="35" y2="150" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <line x1="37" y1="165" x2="40" y2="155" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

    <!-- Additional scattered sticky notes for "organization" theme -->
    <rect x="180" y="170" width="18" height="18" rx="2" fill="#fef08a" transform="rotate(12 180 170)" />
    <line x1="183" y1="176" x2="193" y2="176" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" />
    <line x1="183" y1="182" x2="190" y2="182" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>