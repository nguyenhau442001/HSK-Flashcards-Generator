<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Easel and Canvas -->
  <rect x="60" y="50" width="120" height="100" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <path d="M120 150 L100 210 M120 150 L140 210" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Painting on canvas: A stylized landscape with golden sun -->
  <circle cx="120" cy="90" r="25" fill="#f59e0b"/>
  <path d="M70 120 Q120 80 170 120 L170 140 L70 140 Z" fill="#10b981"/>
  
  <!-- Artist Character -->
  <g transform="translate(40, 140)">
    <circle cx="20" cy="20" r="12" fill="#fb923c"/>
    <path d="M10 35 L30 35 L35 70 L5 70 Z" fill="#38bdf8"/>
    <rect x="15" y="32" width="10" height="5" fill="#fbbf24"/>
  </g>
  
  <!-- Observer Character pointing at the painting -->
  <g transform="translate(160, 140)">
    <circle cx="20" cy="20" r="12" fill="#ec4899"/>
    <path d="M10 35 L30 35 L35 70 L5 70 Z" fill="#fbbf24"/>
    <path d="M25 20 L45 15" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Floor/Ground -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <rect x="0" y="200" width="240" height="2" fill="#334155"/>
  
  <!-- Studio Props -->
  <circle cx="190" cy="190" r="8" fill="#38bdf8"/>
  <rect x="30" y="180" width="15" height="20" rx="2" fill="#f59e0b"/>
</svg>