<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for Accumulation/Knowledge -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Book Gradients -->
    <linearGradient id="book-spine-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="book-cover-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="book-spine-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="book-cover-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="book-spine-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="book-cover-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Coin/Gem Gradients -->
    <linearGradient id="coin-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient background glow representing accumulation/growth -->
  <circle cx="120" cy="120" r="90" fill="url(#glow)"/>

  <!-- Atmospheric Particles / Energy Dots -->
  <circle cx="60" cy="80" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="180" cy="70" r="3" fill="#f59e0b" opacity="0.7"/>
  <circle cx="195" cy="130" r="1.5" fill="#34d399" opacity="0.5"/>
  <circle cx="45" cy="150" r="2" fill="#ec4899" opacity="0.6"/>
  <circle cx="100" cy="45" r="2.5" fill="#fde047" opacity="0.8"/>

  <!-- SCENE ENVIRONMENT: Wooden/Modern Desk Surface -->
  <path d="M 20 195 L 220 195 L 230 220 L 10 220 Z" fill="#0f172a" opacity="0.6"/>
  <rect x="20" y="190" width="200" height="6" rx="3" fill="#334155"/>

  <!-- MAIN SUBJECT: Bookshelf / Stacking Books (Representing Accumulation of Knowledge) -->
  <g filter="url(#shadow)">
    <!-- Base Book 1 (Bottom, Wide) -->
    <path d="M 60 170 L 180 170 L 175 190 L 65 190 Z" fill="#1e293b"/>
    <path d="M 65 160 L 175 160 L 180 170 L 60 170 Z" fill="url(#book-cover-1)"/>
    <path d="M 65 160 L 60 170 L 65 190 L 70 180 Z" fill="url(#book-spine-1)"/>
    <!-- Pages side -->
    <path d="M 175 160 L 180 170 L 175 190 L 170 180 Z" fill="#e2e8f0"/>

    <!-- Book 2 (Middle) -->
    <path d="M 75 135 L 165 135 L 160 153 L 80 153 Z" fill="#1e293b"/>
    <path d="M 80 125 L 160 125 L 165 135 L 75 135 Z" fill="url(#book-cover-2)"/>
    <path d="M 80 125 L 75 135 L 80 153 L 85 143 Z" fill="url(#book-spine-2)"/>
    <!-- Pages side -->
    <path d="M 160 125 L 165 135 L 160 153 L 155 143 Z" fill="#e2e8f0"/>

    <!-- Book 3 (Top, Slanted) -->
    <g transform="rotate(-6 120 110)">
      <path d="M 85 105 L 155 105 L 150 121 L 90 121 Z" fill="#1e293b"/>
      <path d="M 90 95 L 150 95 L 155 105 L 85 105 Z" fill="url(#book-cover-3)"/>
      <path d="M 90 95 L 85 105 L 90 121 L 95 111 Z" fill="url(#book-spine-3)"/>
      <!-- Pages side -->
      <path d="M 150 95 L 155 105 L 150 121 L 145 111 Z" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- ACTION & DYNAMIC ELEMENTS: Rising/Accumulating Gems & Sparkles (Tích lũy) -->
  <g filter="url(#shadow)">
    <!-- Gem 1 (Lower Floating) -->
    <path d="M 105 85 L 115 75 L 125 85 L 115 95 Z" fill="#38bdf8"/>
    <path d="M 115 75 L 125 85 L 115 95 Z" fill="#0ea5e9" opacity="0.6"/>

    <!-- Gem 2 (Higher Floating, Golden) -->
    <path d="M 125 55 L 135 43 L 145 55 L 135 67 Z" fill="url(#coin-gold)"/>
    <path d="M 135 43 L 145 55 L 135 67 Z" fill="#ca8a04" opacity="0.4"/>

    <!-- Small Star/Sparkle near top -->
    <path d="M 140 25 L 143 32 L 150 35 L 143 38 L 140 45 L 137 38 L 130 35 L 137 32 Z" fill="#fde047"/>
    <path d="M 95 65 L 97 69 L 101 71 L 97 73 L 95 77 L 93 73 L 89 71 L 93 69 Z" fill="#38bdf8"/>
  </g>

  <!-- Additional Context Props: Small potted plant representing gradual growth/accumulation -->
  <g filter="url(#shadow)" transform="translate(30, 130)">
    <!-- Pot -->
    <path d="M 10 30 L 25 30 L 22 50 L 13 50 Z" fill="#cbd5e1"/>
    <ellipse cx="17" cy="30" rx="7.5" ry="2" fill="#94a3b8"/>
    <!-- Plant Stem & Leaves -->
    <path d="M 17 30 Q 15 15 8 10" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 17 30 Q 20 12 26 8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="7" cy="9" r="4" fill="#4ade80"/>
    <circle cx="27" cy="7" r="4.5" fill="#22c55e"/>
    <circle cx="17" cy="18" r="3.5" fill="#4ade80"/>
  </g>

  <!-- Additional Context Props: Rolled Scroll / Notes -->
  <g filter="url(#shadow)" transform="translate(175, 150) rotate(15)">
    <rect x="0" y="0" width="30" height="18" rx="4" fill="#fef08a"/>
    <rect x="-2" y="2" width="4" height="14" rx="2" fill="#eab308"/>
    <line x1="6" y1="6" x2="24" y2="6" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="12" x2="20" y2="12" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Arrow / Flow Curve showing accumulation process -->
  <path d="M 65 110 C 50 90 70 50 100 45" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.5"/>
  <path d="M 100 45 L 93 42 L 96 48 Z" fill="#38bdf8" opacity="0.6"/>

</svg>