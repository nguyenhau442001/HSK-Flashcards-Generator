<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Market Stall Counter -->
  <path d="M20 160 L220 160 L200 220 L40 220 Z" fill="#334155"/>
  <path d="M20 160 L220 160 L225 175 L15 175 Z" fill="#475569"/>
  
  <!-- Fruit Basket -->
  <path d="M60 160 C60 140, 100 140, 100 160" fill="#fb923c"/>
  <circle cx="70" cy="150" r="12" fill="#ef4444"/>
  <circle cx="90" cy="150" r="12" fill="#ef4444"/>
  <circle cx="80" cy="140" r="12" fill="#ef4444"/>
  
  <!-- Price Tag Card (Visual representation of 'Price') -->
  <rect x="140" y="100" width="60" height="40" rx="4" fill="#f8fafc"/>
  <rect x="145" y="105" width="50" height="10" rx="2" fill="#cbd5e1"/>
  <rect x="145" y="120" width="30" height="10" rx="2" fill="#cbd5e1"/>
  
  <!-- Hand pointing to price -->
  <path d="M170 180 L170 140" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="170" cy="135" r="8" fill="#f59e0b"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="60" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="50" r="6" fill="#10b981" opacity="0.6"/>
  <path d="M180 80 L190 70" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ambient light glow -->
  <ellipse cx="170" cy="120" rx="30" ry="20" fill="#f59e0b" opacity="0.15" filter="blur(8px)"/>
</svg>