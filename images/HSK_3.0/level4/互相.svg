<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm Golden Glow for Action -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradients -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Gradients -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Box Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting & Environment Details -->
  <circle cx="120" cy="120" r="90" fill="url(#glow)"/>
  
  <!-- Floor/Ground Plane -->
  <ellipse cx="120" cy="200" rx="90" ry="18" fill="#090d16" opacity="0.8"/>
  <ellipse cx="120" cy="197" rx="75" ry="12" fill="#1e293b" opacity="0.6"/>

  <!-- Ambient Background Props (Bookshelf / Workspace) -->
  <g opacity="0.3">
    <!-- Shelf -->
    <rect x="30" y="60" width="180" height="4" rx="2" fill="#64748b"/>
    <!-- Books on shelf -->
    <rect x="45" y="36" width="10" height="24" rx="2" fill="#38bdf8"/>
    <rect x="57" y="30" width="14" height="30" rx="2" fill="#fbbf24"/>
    <rect x="73" y="38" width="8" height="22" rx="2" fill="#f43f5e"/>
    <!-- Plant pot -->
    <path d="M170 60 L176 42 L188 42 L194 60 Z" fill="#10b981"/>
    <circle cx="182" cy="38" r="10" fill="#059669"/>
    <circle cx="174" cy="42" r="8" fill="#10b981"/>
    <circle cx="190" cy="42" r="8" fill="#34d399"/>
  </g>

  <!-- Reciprocal Action Arrows (Symbolizing 'Lẫn nhau / Mutual Exchange') -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <!-- Upper Flow: Left to Right -->
    <path d="M 85 92 Q 120 72 155 92" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4"/>
    <path d="M 148 86 L 156 93 L 147 98" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Lower Flow: Right to Left -->
    <path d="M 155 108 Q 120 128 85 108" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4 4"/>
    <path d="M 92 114 L 84 107 L 93 102" stroke="#f43f5e" stroke-width="3"/>
  </g>

  <!-- MAIN SCENE: Two friendly characters helping each other (Mutual / 互相) -->

  <!-- CHARACTER 1 (Left - Blue Shirt, lifting/passing) -->
  <g id="characterLeft" filter="url(#softShadow)">
    <!-- Body/Torso -->
    <path d="M 65 190 L 70 145 C 70 135 80 130 90 135 L 98 185 Z" fill="url(#shirt1)"/>
    <!-- Legs -->
    <rect x="68" y="180" width="10" height="24" rx="5" fill="#334155"/>
    <rect x="84" y="180" width="10" height="24" rx="5" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="73" cy="204" rx="8" ry="4" fill="#0f172a"/>
    <ellipse cx="89" cy="204" rx="8" ry="4" fill="#0f172a"/>
    
    <!-- Head & Face -->
    <circle cx="82" cy="115" r="16" fill="#fed7aa"/>
    <!-- Hair (Brown/Styled) -->
    <path d="M 68 115 C 68 102 82 98 96 106 C 94 100 86 97 78 99 C 72 101 68 108 68 115 Z" fill="#78350f"/>
    <!-- Friendly Expression -->
    <circle cx="77" cy="114" r="1.5" fill="#1e293b"/>
    <path d="M 81 118 Q 84 121 87 118" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="73" cy="117" r="2.5" fill="#fca5a5" opacity="0.6"/>

    <!-- Left Arm (Reaching forward) -->
    <path d="M 72 140 Q 95 130 112 138" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="112" cy="138" r="5" fill="#fed7aa"/>
  </g>


  <!-- CHARACTER 2 (Right - Red Shirt, receiving/passing) -->
  <g id="characterRight" filter="url(#softShadow)">
    <!-- Body/Torso -->
    <path d="M 175 190 L 170 145 C 170 135 160 130 150 135 L 142 185 Z" fill="url(#shirt2)"/>
    <!-- Legs -->
    <rect x="146" y="180" width="10" height="24" rx="5" fill="#334155"/>
    <rect x="162" y="180" width="10" height="24" rx="5" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="151" cy="204" rx="8" ry="4" fill="#0f172a"/>
    <ellipse cx="167" cy="204" rx="8" ry="4" fill="#0f172a"/>

    <!-- Head & Face -->
    <circle cx="158" cy="115" r="16" fill="#fed7aa"/>
    <!-- Hair (Dark/Styled) -->
    <path d="M 144 112 C 144 100 158 98 172 105 C 168 98 156 97 150 101 C 146 104 144 108 144 112 Z" fill="#1e293b"/>
    <!-- Friendly Expression -->
    <circle cx="163" cy="114" r="1.5" fill="#1e293b"/>
    <path d="M 153 118 Q 156 121 159 118" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="167" cy="117" r="2.5" fill="#fca5a5" opacity="0.6"/>

    <!-- Right Arm (Reaching forward) -->
    <path d="M 168 140 Q 145 130 128 138" stroke="#e11d48" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="128" cy="138" r="5" fill="#fed7aa"/>
  </g>


  <!-- CENTRAL OBJECT BEING EXCHANGED (Glowing Gift Box / Mutual Aid Object) -->
  <g id="sharedObject" filter="url(#shadow)">
    <!-- Box Base -->
    <rect x="105" y="125" width="30" height="26" rx="4" fill="url(#boxGrad)"/>
    <!-- Box Lid -->
    <rect x="102" y="120" width="36" height="8" rx="3" fill="#f59e0b"/>
    <!-- Ribbon Vertical -->
    <rect x="117" y="120" width="6" height="31" fill="#ec4899"/>
    <!-- Ribbon Horizontal -->
    <rect x="102" y="133" width="36" height="5" fill="#ec4899"/>
    <!-- Bow -->
    <path d="M 113 117 C 110 110 117 105 120 115 C 123 105 130 110 127 117 Z" fill="#ec4899"/>
    <!-- Sparkles around the box -->
    <circle cx="98" cy="115" r="2" fill="#fbbf24"/>
    <circle cx="142" cy="130" r="1.5" fill="#38bdf8"/>
    <circle cx="120" cy="100" r="2" fill="#f43f5e"/>
  </g>

  <!-- Dynamic Foreground Sparkles / Interactive Energy -->
  <g opacity="0.9">
    <path d="M 120 78 L 122 84 L 128 86 L 122 88 L 120 94 L 118 88 L 112 86 L 118 84 Z" fill="#fbbf24"/>
    <path d="M 75 140 L 76 143 L 79 144 L 76 145 L 75 148 L 74 145 L 71 144 L 74 143 Z" fill="#38bdf8" transform="scale(0.7) translate(30, 20)"/>
    <path d="M 165 140 L 166 143 L 169 144 L 166 145 L 165 148 L 164 145 L 161 144 L 164 143 Z" fill="#f43f5e" transform="scale(0.7) translate(80, 20)"/>
  </g>

</svg>