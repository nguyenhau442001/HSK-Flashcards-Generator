<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Screen Glow -->
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character Skin Tone -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Hoodie Gradient -->
    <linearGradient id="hoodieGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Environment (Room) -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Desk Lamp Glow from top right -->
  <circle cx="180" cy="40" r="120" fill="url(#lampGlow)"/>

  <!-- Wallpaper / Bookshelf details in background -->
  <g opacity="0.3">
    <!-- Shelf -->
    <rect x="20" y="55" width="200" height="4" rx="2" fill="#475569"/>
    <!-- Books on shelf -->
    <rect x="35" y="31" width="10" height="24" rx="2" fill="#f43f5e"/>
    <rect x="47" y="27" width="14" height="28" rx="2" fill="#38bdf8"/>
    <rect x="63" y="35" width="8" height="20" rx="2" fill="#fbbf24"/>
    <rect x="180" y="30" width="12" height="25" rx="2" fill="#a855f7"/>
    <rect x="194" y="38" width="16" height="17" rx="2" fill="#ec4899"/>
    <!-- Wall plant pot -->
    <path d="M 140 45 L 156 45 L 152 55 L 144 55 Z" fill="#94a3b8"/>
    <path d="M 148 45 Q 130 35 125 25 Q 148 35 148 45 Z" fill="#10b981"/>
    <path d="M 148 45 Q 165 35 170 25 Q 148 35 148 45 Z" fill="#34d399"/>
  </g>

  <!-- Window Frame showing night city / stars -->
  <g opacity="0.4">
    <rect x="20" y="75" width="55" height="70" rx="4" fill="#020617" stroke="#334155" stroke-width="2"/>
    <line x1="47" y1="75" x2="47" y2="145" stroke="#334155" stroke-width="2"/>
    <line x1="20" y1="110" x2="75" y2="110" stroke="#334155" stroke-width="2"/>
    <!-- Tiny stars -->
    <circle cx="30" cy="90" r="1" fill="#fbbf24"/>
    <circle cx="60" cy="95" r="1.5" fill="#fff"/>
    <circle cx="40" cy="130" r="1" fill="#fff"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#0f172a" filter="url(#shadow)"/>
  <path d="M 0 170 L 240 170 L 240 175 L 0 175 Z" fill="#334155"/> <!-- Desk edge highlight -->

  <!-- Props: Desk Lamp (Left) -->
  <g>
    <!-- Base -->
    <ellipse cx="35" cy="170" rx="15" ry="5" fill="#64748b"/>
    <!-- Stand -->
    <path d="M 35 170 L 35 120 L 50 100" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lamp Head -->
    <path d="M 42 93 L 58 93 L 65 105 L 35 105 Z" fill="#fbbf24"/>
    <!-- Light Beam projection -->
    <polygon points="45,105 80,170 110,170" fill="#fbbf24" opacity="0.08"/>
  </g>

  <!-- Props: Coffee Mug with Steam -->
  <g transform="translate(195, 145)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#cbd5e1" filter="url(#shadow)"/>
    <path d="M 16 10 C 22 10, 22 20, 16 20" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 5 0 Q 8 -5 5 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 11 2 Q 14 -3 11 -8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Main Laptop / Registration Device -->
  <g filter="url(#shadow)" transform="translate(85, 125)">
    <!-- Laptop Base / Keyboard deck -->
    <path d="M -30 45 L 90 45 L 75 20 L -15 20 Z" fill="#cbd5e1"/>
    <path d="M -25 43 L 85 43" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Laptop Screen (Angled back) -->
    <path d="M -15 20 L 75 20 L 65 -25 L -5 -25 Z" fill="#334155"/>
    <!-- Screen Display -->
    <path d="M -11 17 L 71 17 L 62 -22 L -2 -22 Z" fill="url(#screenGrad)"/>
    
    <!-- UI Elements on Screen representing "Registration Form / Submission" -->
    <!-- Form header bar -->
    <rect x="5" y="-15" width="45" height="5" rx="2" fill="#ffffff" opacity="0.9"/>
    <!-- Form input lines -->
    <rect x="5" y="-5" width="30" height="3" rx="1.5" fill="#bae6fd"/>
    <rect x="5" y="0" width="45" height="3" rx="1.5" fill="#bae6fd"/>
    <rect x="5" y="5" width="20" height="3" rx="1.5" fill="#bae6fd"/>
    
    <!-- Big prominent Confirmation / Checkmark Button (representing successful registration) -->
    <circle cx="45" cy="10" r="8" fill="#10b981"/>
    <path d="M 42 10 L 44 12 L 49 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Character: Upper Body & Dynamic Registration Pose -->
  <g transform="translate(100, 110)">
    <!-- Body / Hoodie (Leaning forward, engaged) -->
    <path d="M -45 70 C -45 40, -25 30, 0 35 C 25 30, 45 40, 45 70 L 35 100 L -35 100 Z" fill="url(#hoodieGrad)" filter="url(#shadow)"/>
    
    <!-- Hoodie Strings -->
    <path d="M -10 38 Q -8 50 -12 60" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 38 Q 8 50 12 60" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="-8" y="20" width="16" height="15" fill="url(#skinGrad)"/>

    <!-- Head -->
    <g transform="translate(0, -5)">
      <!-- Face Base -->
      <circle cx="0" cy="10" r="22" fill="url(#skinGrad)" filter="url(#shadow)"/>

      <!-- Hair Styling (Expressive modern cut) -->
      <path d="M -22 10 C -24 -5, -15 -15, 0 -16 C 15 -15, 24 -5, 22 10 C 20 2, 12 -8, 0 -8 C -12 -8, -20 2, -22 10 Z" fill="#0f172a"/>
      <path d="M -15 -10 Q 0 -22 12 -12 Q 5 -18 -15 -10 Z" fill="#334155"/> <!-- Hair highlight/texture -->

      <!-- Facial Features: Focused, determined, happy expression -->
      <!-- Eyebrows (Slightly angled up for focused engagement) -->
      <path d="M -10 2 Q -5 0 -2 3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 6 3 Q 9 0 14 2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Eyes (Bright, focused on screen/action) -->
      <circle cx="-6" cy="7" r="2.5" fill="#0f172a"/>
      <circle cx="10" cy="7" r="2.5" fill="#0f172a"/>
      <!-- Eye shine -->
      <circle cx="-5" cy="6" r="1" fill="#ffffff"/>
      <circle cx="11" cy="6" r="1" fill="#ffffff"/>

      <!-- Cheeks (Excited blush) -->
      <circle cx="-12" cy="13" r="3" fill="#f43f5e" opacity="0.3"/>
      <circle cx="16" cy="13" r="3" fill="#f43f5e" opacity="0.3"/>

      <!-- Smile (Confident/Satisfied grin of completing registration) -->
      <path d="M -3 15 Q 2 20 7 15" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Arms & Hands interacting with laptop / clicking "register" -->
    <!-- Left Arm (Resting on desk) -->
    <path d="M -35 45 C -45 55, -40 75, -50 85" fill="none" stroke="#059669" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Hand -->
    <circle cx="-52" cy="87" r="6" fill="url(#skinGrad)"/>

    <!-- Right Arm (Reaching forward, actively clicking/submitting form) -->
    <path d="M 35 45 C 50 50, 45 70, 25 75" fill="none" stroke="#059669" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Hand (Pressing down) -->
    <circle cx="22" cy="78" r="6" fill="url(#skinGrad)" filter="url(#shadow)"/>
  </g>

  <!-- Foreground decorative element for depth (Blurry desk edge leaf/pen) -->
  <g opacity="0.7">
    <!-- Stylus / Pen on desk -->
    <path d="M 120 200 L 160 185" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#shadow)"/>
    <path d="M 120 200 L 115 202" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Success Sparkles / Confetti (Representing successful "Bàomíng" / Registration action) -->
  <g transform="translate(130, 80)">
    <!-- Sparkle 1 -->
    <path d="M 0 -10 L 2 -3 L 9 -1 L 2 1 L 0 8 L -2 1 L -9 -1 L -2 -3 Z" fill="#fbbf24" filter="url(#shadow)"/>
  </g>
  <g transform="translate(70, 60)">
    <!-- Sparkle 2 -->
    <path d="M 0 -6 L 1.5 -2 L 5 -1 L 1.5 0 L 0 4 L -1.5 0 L -5 -1 L -1.5 -2 Z" fill="#38bdf8" filter="url(#shadow)"/>
  </g>
  <g transform="translate(160, 110)">
    <!-- Sparkle 3 -->
    <path d="M 0 -8 L 2 -2.5 L 7 -1 L 2 0.5 L 0 6 L -2 0.5 L -7 -1 L -2 -2.5 Z" fill="#10b981" filter="url(#shadow)"/>
  </g>

</svg>