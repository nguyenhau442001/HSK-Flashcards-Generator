<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing effect for the key -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background light rays / circuit patterns for technical/puzzle context -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M40 180 L80 180 L110 150 L110 110" />
    <path d="M200 60 L160 60 L130 90 L130 130" />
    <circle cx="110" cy="110" r="3" fill="#38bdf8" />
    <circle cx="130" cy="130" r="3" fill="#38bdf8" />
  </g>

  <!-- Giant Puzzle / Clockwork Mechanism Surface (Context) -->
  <g transform="translate(120, 130)" filter="url(#shadow)">
    <!-- Outer Gear Base -->
    <circle cx="0" cy="0" r="75" fill="#334155" />
    <!-- Gear teeth representation -->
    <path d="M -15 -78 L 15 -78 L 12 -65 L -12 -65 Z" fill="#475569" />
    <path d="M -15 -78 L 15 -78 L 12 -65 L -12 -65 Z" fill="#475569" transform="rotate(45)" />
    <path d="M -15 -78 L 15 -78 L 12 -65 L -12 -65 Z" fill="#475569" transform="rotate(90)" />
    <path d="M -15 -78 L 15 -78 L 12 -65 L -12 -65 Z" fill="#475569" transform="rotate(135)" />
    <path d="M -15 -78 L 15 -78 L 12 -65 L -12 -65 Z" fill="#475569" transform="rotate(180)" />
    <path d="M -15 -78 L 15 -78 L 12 -65 L -12 -65 Z" fill="#475569" transform="rotate(225)" />
    <path d="M -15 -78 L 15 -78 L 12 -65 L -12 -65 Z" fill="#475569" transform="rotate(270)" />
    <path d="M -15 -78 L 15 -78 L 12 -65 L -12 -65 Z" fill="#475569" transform="rotate(315)" />
    
    <circle cx="0" cy="0" r="60" fill="#1e293b" />
    
    <!-- Mechanism Inner Details -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6 4" />
    
    <!-- Central Lock / Mechanism Slot -->
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    
    <!-- Keyhole (where the key fits) -->
    <path d="M -5 -2 A 5 5 0 1 1 5 -2 L 7 12 L -7 12 Z" fill="#fbbf24" opacity="0.3" />
  </g>

  <!-- Magical / Energy Glow behind the key -->
  <circle cx="120" cy="110" r="40" fill="#f59e0b" opacity="0.2" filter="url(#glow)" />

  <!-- THE HERO OBJECT: The Golden Key (关键 - The Crucial Key) -->
  <g transform="translate(120, 110) rotate(-35)" filter="url(#shadow)">
    <!-- Key Bow (Handle) - Decorated with gem -->
    <circle cx="0" cy="-55" r="20" fill="none" stroke="#f59e0b" stroke-width="7" />
    <circle cx="0" cy="-55" r="14" fill="#fbbf24" />
    <circle cx="0" cy="-55" r="8" fill="#fef08a" />
    
    <!-- Key Shaft -->
    <rect x="-4" y="-40" width="8" height="65" rx="3" fill="#fbbf24" />
    
    <!-- Shaft Highlight -->
    <rect x="-2" y="-38" width="2" height="60" fill="#fef08a" opacity="0.7" />

    <!-- Key Bit (The complex teeth that unlock the problem) -->
    <g transform="translate(0, 15)">
      <path d="M 4 0 L 18 0 L 18 8 L 12 8 L 12 14 L 18 14 L 18 22 L 4 22 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2" stroke-linejoin="round" />
      <rect x="7" y="3" width="8" height="4" rx="1" fill="#fef08a" opacity="0.6" />
      <rect x="7" y="11" width="8" height="4" rx="1" fill="#fef08a" opacity="0.6" />
    </g>
  </g>

  <!-- Action Sparks / Magical Energy Particles -->
  <g fill="#fbbf24">
    <circle cx="85" cy="75" r="3" filter="url(#glow)" />
    <circle cx="165" cy="70" r="2" />
    <circle cx="145" cy="155" r="3.5" filter="url(#glow)" />
    <circle cx="80" cy="140" r="2" />
    <!-- Star sparkles -->
    <path d="M 160 90 L 163 97 L 170 100 L 163 103 L 160 110 L 157 103 L 150 100 L 157 97 Z" fill="#fef08a" transform="scale(0.5) translate(140, 20)" />
    <path d="M 80 50 L 82 55 L 87 57 L 82 59 L 80 64 L 78 59 L 73 57 L 78 55 Z" fill="#38bdf8" transform="scale(0.6) translate(30, -20)" />
  </g>

  <!-- Floating puzzle pieces / context props representing "the problem" being solved -->
  <g transform="translate(45, 65) rotate(-15)" filter="url(#shadow)">
    <path d="M 0 0 L 15 0 C 15 -5, 20 -8, 25 -8 C 30 -8, 35 -5, 35 0 L 50 0 L 50 15 C 45 15, 42 20, 42 25 C 42 30, 45 35, 50 35 L 50 50 L 35 50 C 35 45, 30 42, 25 42 C 20 42, 15 45, 15 50 L 0 50 Z" fill="#38bdf8" opacity="0.85" />
    <circle cx="25" cy="21" r="5" fill="#bae6fd" opacity="0.5" />
  </g>

  <g transform="translate(160, 155) rotate(25)" filter="url(#shadow)">
    <path d="M 0 0 L 15 0 C 15 -5, 20 -8, 25 -8 C 30 -8, 35 -5, 35 0 L 50 0 L 50 15 C 45 15, 42 20, 42 25 C 42 30, 45 35, 50 35 L 50 50 L 35 50 C 35 45, 30 42, 25 42 C 20 42, 15 45, 15 50 L 0 50 Z" fill="#10b981" opacity="0.85" />
    <circle cx="25" cy="21" r="5" fill="#a7f3d0" opacity="0.5" />
  </g>

  <!-- Foreground Atmospheric Lighting Accent -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.1" />
</svg>