<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a" />
  
  <!-- Subtle Background Decor / Room Interior -->
  <path d="M20 180 L220 180 L220 200 L20 200 Z" fill="#1e293b" />
  <rect x="40" y="60" width="160" height="120" rx="8" fill="#1e293b" opacity="0.4" />
  
  <!-- Window or Ambient Light Source -->
  <circle cx="120" cy="50" r="100" fill="#38bdf8" opacity="0.05" />

  <!-- Group of People (人数 - Headcounts) being counted -->
  <!-- Person 1 (Left) -->
  <g transform="translate(60, 110)">
    <!-- Body -->
    <path d="M0 70 C0 50, 10 40, 25 40 C40 40, 50 50, 50 70 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="25" cy="22" r="14" fill="#fde68a" />
    <!-- Hair -->
    <path d="M11 20 C11 10, 20 8, 25 8 C30 8, 39 10, 39 20 C35 15, 15 15, 11 20 Z" fill="#b45309" />
  </g>

  <!-- Person 2 (Center-Left) -->
  <g transform="translate(95, 105)">
    <!-- Body -->
    <path d="M0 75 C0 55, 10 45, 25 45 C40 45, 50 55, 50 75 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="25" cy="22" r="14" fill="#fde68a" />
    <!-- Hair -->
    <path d="M11 22 C12 10, 20 10, 25 10 C32 10, 38 12, 39 22 Z" fill="#1e293b" />
    <!-- Raised hand gesture of the group -->
    <circle cx="38" cy="40" r="5" fill="#fde68a" />
  </g>

  <!-- Person 3 (Center-Right) -->
  <g transform="translate(130, 110)">
    <!-- Body -->
    <path d="M0 70 C0 50, 10 40, 25 40 C40 40, 50 50, 50 70 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="25" cy="22" r="14" fill="#fde68a" />
    <!-- Hair -->
    <path d="M11 18 C15 10, 35 10, 39 18 C30 12, 20 12, 11 18 Z" fill="#451a03" />
  </g>

  <!-- Foreground / Leader Counting (请数一下人数) -->
  <!-- Clipboard / Checklist Prop -->
  <g transform="translate(35, 120) rotate(-10)">
    <rect x="0" y="0" width="28" height="36" rx="3" fill="#f8fafc" />
    <rect x="6" y="6" width="16" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="6" y="13" width="12" height="2" rx="1" fill="#cbd5e1" />
    <rect x="6" y="18" width="14" height="2" rx="1" fill="#cbd5e1" />
    <rect x="10" y="-3" width="8" height="5" rx="1" fill="#fbbf24" />
  </g>

  <!-- Counter Character (Instructor/Leader pointing and counting) -->
  <g transform="translate(20, 95)">
    <!-- Body / Torso -->
    <path d="M10 85 C10 60, 20 50, 35 50 C50 50, 60 60, 60 85 Z" fill="#6366f1" />
    <!-- Head -->
    <circle cx="35" cy="25" r="16" fill="#fde68a" />
    <!-- Hair / Glasses detail -->
    <path d="M19 25 C19 12, 30 10, 35 10 C45 10, 51 15, 51 25 C45 20, 25 20, 19 25 Z" fill="#334155" />
    
    <!-- Pointing Arm / Hand enacting "Counting" -->
    <path d="M50 60 C65 55, 75 45, 82 35" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <circle cx="84" cy="33" r="5" fill="#fde68a" />
  </g>

  <!-- Glowing Indicator Sparks / Visualizing the action of "counting/tallying" -->
  <g fill="#fbbf24">
    <circle cx="75" cy="85" r="3" opacity="0.8" />
    <circle cx="105" cy="75" r="4" opacity="0.9" />
    <circle cx="140" cy="80" r="3.5" opacity="0.85" />
    <!-- Connection beam indicating count sequence -->
    <path d="M 75 85 Q 90 65 105 75 T 140 80" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  </g>

  <!-- Ambient light warmth on floor -->
  <ellipse cx="120" cy="180" rx="90" ry="12" fill="#38bdf8" opacity="0.1" />
</svg>