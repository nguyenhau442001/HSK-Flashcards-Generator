<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with dark modern theme -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="pouchGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="pouchFront" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="goldCoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="silverCoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Shadow filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer / Wooden Countertop Effect -->
  <rect x="0" y="0" width="240" height="240" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Surface/Counter -->
  <path d="M0 160 C60 150, 180 150, 240 160 L240 232 C240 236.4, 236.4 240, 232 240 L8 240 C3.6 240, 0 236.4, 0 232 Z" fill="#090d16"/>
  <ellipse cx="120" cy="185" rx="90" ry="25" fill="#030712" opacity="0.6"/>

  <!-- Atmospheric Glow for Coins -->
  <circle cx="120" cy="140" r="60" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

  <!-- Background Coins (Scattered 'língqián') -->
  <!-- Coin 1 (Silver, left) -->
  <g transform="translate(65, 175) rotate(-15)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="url(#silverCoin)"/>
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="3" fill="#94a3b8"/>
  </g>

  <!-- Coin 2 (Gold, right) -->
  <g transform="translate(170, 165) rotate(25)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="url(#goldCoin)"/>
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="#fcd34d"/>
    <rect x="-2" y="-4" width="4" height="8" rx="1" fill="#b45309" transform="rotate(45)"/>
  </g>

  <!-- Coin 3 (Small gold, foreground left) -->
  <g transform="translate(85, 200) rotate(10)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="url(#goldCoin)"/>
    <ellipse cx="0" cy="0" rx="9" ry="6" fill="#fcd34d"/>
  </g>

  <!-- Coin 4 (Silver, foreground right) -->
  <g transform="translate(155, 195) rotate(-20)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="13" ry="9" fill="url(#silverCoin)"/>
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#cbd5e1"/>
  </g>

  <!-- Main Coin Stack / Tumbling Action -->
  <g transform="translate(120, 130)" filter="url(#shadow)">
    <!-- Main dynamic coin spinning up -->
    <g transform="translate(15, -45) rotate(35)">
      <ellipse cx="0" cy="0" rx="15" ry="15" fill="url(#goldCoin)"/>
      <circle cx="0" cy="0" r="11" fill="#fcd34d"/>
      <rect x="-3" y="-3" width="6" height="6" fill="#d97706"/>
    </g>

    <!-- Another flying coin -->
    <g transform="translate(-25, -35) rotate(-25)">
      <ellipse cx="0" cy="0" rx="14" ry="14" fill="url(#goldCoin)"/>
      <circle cx="0" cy="0" r="10" fill="#fcd34d"/>
      <rect x="-2.5" y="-2.5" width="5" height="5" fill="#d97706"/>
    </g>
  </g>

  <!-- Coin Pouch / Purse (钱袋 - qiándài) -->
  <g filter="url(#shadow)">
    <!-- Pouch Ties / Strings -->
    <path d="M95 90 C105 100, 135 100, 145 90" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="95" r="5" fill="#d97706"/>

    <!-- Pouch Back -->
    <path d="M95 90 C80 90, 70 120, 75 150 C80 180, 100 195, 120 195 C140 195, 160 180, 165 150 C170 120, 160 90, 145 90 Z" fill="url(#pouchGrad)"/>

    <!-- Pouch folds/shading -->
    <path d="M105 100 C100 130, 105 160, 95 185" fill="none" stroke="#9f1239" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <path d="M135 100 C140 130, 135 160, 145 185" fill="none" stroke="#9f1239" stroke-width="4" opacity="0.4" stroke-linecap="round"/>

    <!-- Pouch Flap / Front Open Section -->
    <path d="M85 95 C95 110, 145 110, 155 95 C160 115, 165 145, 155 170 C145 195, 95 195, 85 170 C75 145, 80 115, 85 95 Z" fill="url(#pouchFront)"/>

    <!-- Golden Embroidered Accent on Pouch (Decorative circle, no text/letters) -->
    <circle cx="120" cy="145" r="18" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.8"/>
    <circle cx="120" cy="145" r="10" fill="#fbbf24" opacity="0.4"/>
    <circle cx="120" cy="145" r="4" fill="#fbbf24"/>
  </g>

  <!-- Sparkles / Details (Action & Vibe) -->
  <g fill="#fcd34d" filter="url(#glow)">
    <path d="M 60 90 Q 60 100 50 100 Q 60 100 60 110 Q 60 100 70 100 Q 60 100 60 90 Z" />
    <path d="M 180 80 Q 180 88 172 88 Q 180 88 180 96 Q 180 88 188 88 Q 180 88 180 80 Z" />
    <path d="M 130 65 Q 130 72 123 72 Q 130 72 130 79 Q 130 72 137 72 Q 130 72 130 65 Z" />
  </g>

  <!-- Small floating sparkle dots -->
  <circle cx="95" cy="75" r="2.5" fill="#67e8f9"/>
  <circle cx="150" cy="70" r="2" fill="#f43f5e"/>
  <circle cx="50" cy="140" r="3" fill="#fbbf24"/>
  <circle cx="195" cy="130" r="2" fill="#38bdf8"/>
</svg>