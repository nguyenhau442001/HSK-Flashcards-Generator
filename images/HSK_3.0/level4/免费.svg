<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stall Canopy Gradients -->
    <linearGradient id="stripeRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="stripeWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Wooden Counter Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gift Box Gradients -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Ambient Glow for the "Free" item -->
  <circle cx="120" cy="115" r="70" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>
  <circle cx="120" cy="115" r="45" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>

  <!-- ENVIRONMENT: Community Event / Market Stall background elements -->
  <g opacity="0.25">
    <!-- Building silhouettes / string lights -->
    <path d="M20 60 Q 60 40 100 60 T 180 60 T 220 50" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="60" cy="53" r="3" fill="#f59e0b"/>
    <circle cx="100" cy="60" r="3" fill="#38bdf8"/>
    <circle cx="140" cy="57" r="3" fill="#f43f5e"/>
    <circle cx="180" cy="58" r="3" fill="#10b981"/>
  </g>

  <!-- THE STALL STRUCTURE -->
  <!-- Stall back wall / interior -->
  <rect x="40" y="80" width="160" height="70" fill="#334155" rx="4"/>
  
  <!-- Stall Canopy Poles -->
  <rect x="48" y="70" width="8" height="85" fill="#64748b" rx="2"/>
  <rect x="184" y="70" width="8" height="85" fill="#64748b" rx="2"/>

  <!-- Striped Awning -->
  <g filter="url(#softShadow)">
    <path d="M30 70 L210 70 L195 45 L45 45 Z" fill="#334155"/>
    <!-- Stripes -->
    <polygon points="45,45 65,45 70,70 50,70" fill="url(#stripeRed)"/>
    <polygon points="65,45 85,45 90,70 70,70" fill="url(#stripeWhite)"/>
    <polygon points="85,45 105,45 110,70 90,70" fill="url(#stripeRed)"/>
    <polygon points="105,45 125,45 130,70 110,70" fill="url(#stripeWhite)"/>
    <polygon points="125,45 145,45 150,70 130,70" fill="url(#stripeRed)"/>
    <polygon points="145,45 165,45 170,70 150,70" fill="url(#stripeWhite)"/>
    <polygon points="165,45 185,45 190,70 170,70" fill="url(#stripeRed)"/>
    <!-- Awning Scalloped Edge -->
    <path d="M 45 70 Q 52.5 78 60 70 Q 67.5 78 75 70 Q 82.5 78 90 70 Q 97.5 78 105 70 Q 112.5 78 120 70 Q 127.5 78 135 70 Q 142.5 78 150 70 Q 157.5 78 165 70 Q 172.5 78 180 70 Q 187.5 78 195 70 Z" fill="url(#stripeWhite)"/>
  </g>

  <!-- THE COUNTER -->
  <!-- Counter base -->
  <rect x="35" y="145" width="170" height="55" fill="url(#woodGrad)" filter="url(#softShadow)" rx="2"/>
  <!-- Counter top shelf -->
  <rect x="30" y="140" width="180" height="10" fill="url(#woodTop)" rx="2"/>
  <!-- Counter panel detail -->
  <rect x="45" y="155" width="45" height="35" fill="#78350f" opacity="0.3" rx="2"/>
  <rect x="97" y="155" width="45" height="35" fill="#78350f" opacity="0.3" rx="2"/>
  <rect x="150" y="155" width="45" height="35" fill="#78350f" opacity="0.3" rx="2"/>

  <!-- SIDE PROPS: VIBRANT CONTEXT ITEMS -->
  <!-- Small potted plant on counter left -->
  <path d="M 50 140 Q 48 125 55 125 Q 62 125 60 140 Z" fill="#10b981"/>
  <path d="M 60 140 Q 65 120 72 122 Q 78 125 70 140 Z" fill="#059669"/>
  <path d="M 45 140 L 65 140 L 62 148 L 48 148 Z" fill="#f43f5e" rx="1"/>

  <!-- Vouchers / Tickets stack on counter right -->
  <g transform="translate(160, 125) rotate(10)">
    <rect x="0" y="0" width="22" height="15" fill="#f8fafc" rx="2" filter="url(#softShadow)"/>
    <circle cx="6" cy="7.5" r="2" fill="#cbd5e1"/>
    <line x1="10" y1="6" x2="18" y2="6" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="10" x2="15" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(155, 130) rotate(-5)">
    <rect x="0" y="0" width="22" height="15" fill="#38bdf8" rx="2" filter="url(#softShadow)"/>
    <circle cx="6" cy="7.5" r="2" fill="#bae6fd"/>
    <line x1="10" y1="6" x2="18" y2="6" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: CENTRAL "FREE" GIFT BOX (Representing Miǎnfèi / Free) -->
  <g filter="url(#softShadow)">
    <!-- Gift Box Shadow on Counter -->
    <ellipse cx="120" cy="143" rx="28" ry="8" fill="#0f172a" opacity="0.5"/>

    <!-- Box Base -->
    <path d="M 96 110 L 144 110 L 144 140 L 96 140 Z" fill="url(#boxGrad)"/>
    <!-- Box Base Right Shading -->
    <path d="M 120 110 L 144 110 L 144 140 L 120 140 Z" fill="#000000" opacity="0.15"/>

    <!-- Vertical Ribbon -->
    <path d="M 113 110 L 127 110 L 127 140 L 113 140 Z" fill="url(#ribbonGrad)"/>

    <!-- Box Lid -->
    <path d="M 92 100 L 148 100 L 148 110 L 92 110 Z" fill="#0284c7" rx="1"/>
    <!-- Horizontal Ribbon on Lid -->
    <path d="M 92 104 L 148 104 L 148 108 L 92 108 Z" fill="url(#ribbonGrad)"/>

    <!-- Big Gorgeous Bow on Top -->
    <!-- Left Loop -->
    <path d="M 120 100 C 105 95 100 80 112 78 C 122 76 122 92 120 100 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <path d="M 120 100 C 108 96 104 84 113 82 C 120 80 121 92 120 100 Z" fill="#fde047" opacity="0.6"/>

    <!-- Right Loop -->
    <path d="M 120 100 C 135 95 140 80 128 78 C 118 76 118 92 120 100 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <path d="M 120 100 C 132 96 136 84 127 82 C 120 80 119 92 120 100 Z" fill="#fde047" opacity="0.6"/>

    <!-- Center Knot -->
    <circle cx="120" cy="99" r="5" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
    
    <!-- Ribbon Tails -->
    <path d="M 116 108 C 110 115 105 118 102 122" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
    <path d="M 124 108 C 130 115 135 118 138 122" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- CELEBRATORY ACTION ELEMENTS (Sparkles & Energy) -->
  <g>
    <!-- Top Sparkle 1 -->
    <path d="M 80 85 Q 80 70 65 70 Q 80 70 80 55 Q 80 70 95 70 Q 80 70 80 85 Z" fill="#f59e0b" filter="url(#glow)"/>
    <path d="M 80 80 Q 80 70 70 70 Q 80 70 80 60 Q 80 70 90 70 Q 80 70 80 80 Z" fill="#fef08a"/>

    <!-- Top Sparkle 2 -->
    <path d="M 165 95 Q 165 85 155 85 Q 165 85 165 75 Q 165 85 175 85 Q 165 85 165 95 Z" fill="#38bdf8" filter="url(#glow)"/>
    <path d="M 165 92 Q 165 85 158 85 Q 165 85 165 78 Q 165 85 172 85 Q 165 85 165 92 Z" fill="#e0f2fe"/>

    <!-- Small Confetti Dots -->
    <circle cx="95" cy="85" r="2.5" fill="#ec4899"/>
    <circle cx="145" cy="80" r="3" fill="#10b981"/>
    <circle cx="155" cy="120" r="2" fill="#f59e0b"/>
    <circle cx="85" cy="130" r="2.5" fill="#38bdf8"/>
    <circle cx="105" cy="65" r="2" fill="#f43f5e"/>
    <circle cx="135" cy="60" r="2.5" fill="#facc15"/>
  </g>

  <!-- FOREGROUND VIGNETTE / ATMOSPHERE -->
  <!-- Bottom soft lighting gradient -->
  <rect x="0" y="210" width="240" height="30" fill="url(#bgGrad)" opacity="0.8" style="mix-blend-mode: multiply;"/>
  
  <!-- Friendly glowing rim light on bottom counter edge -->
  <line x1="30" y1="140" x2="210" y2="140" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
</svg>