<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Golden Light / Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Backlit Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <clipPath id="windowClip">
      <path d="M 40,20 Q 80,10 120,20 L 120,130 L 40,130 Z" />
    </clipPath>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow -->
  <circle cx="80" cy="80" r="90" fill="url(#lanternGlow)" />
  <circle cx="200" cy="180" r="60" fill="#38bdf8" opacity="0.08" />

  <!-- ENVIRONMENT / SCENE LAYER -->
  <!-- Indoor Wall / Room Structure -->
  <path d="M 0,160 L 240,160 L 240,240 L 0,240 Z" fill="#090d16" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#1e293b" stroke-width="3" />

  <!-- Background Window / Balcony View -->
  <path d="M 40,15 L 120,15 C 122,15 124,17 124,19 L 124,135 C 124,137 122,139 120,139 L 40,139 C 38,139 36,137 36,135 L 36,19 C 36,17 38,15 40,15 Z" fill="#0f172a" />
  <path d="M 40,18 L 120,18 L 120,136 L 40,136 Z" fill="url(#windowGlow)" />
  
  <!-- Window Panes & Cityscape silhouette inside window -->
  <g clip-path="url(#windowClip)">
    <!-- Distant cute abstract city buildings / rooftops -->
    <path d="M 35,130 L 35,100 L 45,100 L 45,130 Z" fill="#1e1b4b" opacity="0.6"/>
    <path d="M 48,130 L 48,80 L 65,80 L 65,130 Z" fill="#1e1b4b" opacity="0.8"/>
    <path d="M 68,130 L 68,95 L 85,95 L 85,130 Z" fill="#1e1b4b" opacity="0.7"/>
    <path d="M 90,130 L 90,70 L 115,70 L 115,130 Z" fill="#1e1b4b" opacity="0.9"/>
    <!-- Cute glowing moon -->
    <circle cx="100" cy="40" r="10" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- Window Frame Border -->
  <path d="M 36,15 L 124,15 L 124,139 L 36,139 Z" fill="none" stroke="#334155" stroke-width="4" />
  <line x1="80" y1="15" x2="80" y2="139" stroke="#334155" stroke-width="3" />
  <line x1="36" y1="77" x2="124" y2="77" stroke="#334155" stroke-width="3" />

  <!-- Hanging Lantern -->
  <path d="M 170,10 L 190,10 L 195,20 L 165,20 Z" fill="#d97706" />
  <path d="M 160,20 C 160,20 155,50 180,60 C 205,50 200,20 200,20 Z" fill="#fbbf24" />
  <path d="M 165,60 L 195,60 L 190,70 L 170,70 Z" fill="#d97706" />
  <line x1="180" y1="0" x2="180" y2="10" stroke="#64748b" stroke-width="2" />
  <!-- Lantern glow ring -->
  <circle cx="180" cy="40" r="30" fill="url(#lanternGlow)" />

  <!-- Indoor Shelf / Plant Stand -->
  <rect x="140" y="110" width="80" height="8" rx="3" fill="#475569" />
  
  <!-- Potted Plant on Shelf -->
  <path d="M 170,95 L 185,95 L 190,110 L 165,110 Z" fill="#f43f5e" />
  <ellipse cx="177" cy="95" rx="7" ry="2" fill="#fda4af" />
  <!-- Plant Leaves -->
  <path d="M 177,95 Q 160,75 155,70 Q 170,85 177,95 Z" fill="url(#leafGrad)" />
  <path d="M 177,95 Q 190,70 205,65 Q 195,85 177,95 Z" fill="url(#leafGrad)" />
  <path d="M 177,95 Q 175,65 177,55 Q 179,65 177,95 Z" fill="url(#leafGrad)" />

  <!-- Foreground Floor Surface & Rug -->
  <ellipse cx="120" cy="205" rx="80" ry="25" fill="#334155" opacity="0.4" />
  <ellipse cx="120" cy="200" rx="70" ry="20" fill="#4f46e5" opacity="0.25" />

  <!-- MAIN SUBJECT: 姑娘 (The Young Woman / Girl) -->
  <g id="young-woman">
    <!-- Shadow beneath her -->
    <ellipse cx="120" cy="212" rx="35" ry="10" fill="#020617" opacity="0.6" />

    <!-- Body & Dress -->
    <!-- Lower body / skirt -->
    <path d="M 90,185 C 90,165 105,155 120,155 C 135,155 150,165 150,185 L 155,210 C 155,212 153,214 150,214 L 90,214 C 87,214 85,212 85,210 Z" fill="url(#dressGrad)" />
    <!-- Skirt playful pleat details -->
    <path d="M 105,175 L 105,214" stroke="#0284c7" stroke-width="2" opacity="0.4" />
    <path d="M 135,175 L 135,214" stroke="#0284c7" stroke-width="2" opacity="0.4" />

    <!-- Torso & Jacket / Cardigan -->
    <path d="M 100,120 L 140,120 L 145,165 L 95,165 Z" fill="#fb923c" />
    <!-- Collar V-neck -->
    <path d="M 105,120 L 120,140 L 135,120 Z" fill="#f8fafc" />
    
    <!-- Arms and Gestures (Warm, lively pose) -->
    <!-- Left Arm (Waving / Holding a teacup or smiling gesture) -->
    <path d="M 98,125 Q 75,135 85,155" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round" />
    <!-- Left Hand -->
    <circle cx="85" cy="158" r="6" fill="#fbcfe8" />

    <!-- Right Arm (Relaxed, holding side) -->
    <path d="M 142,125 Q 165,140 155,165" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round" />
    <!-- Right Hand -->
    <circle cx="155" cy="168" r="6" fill="#fbcfe8" />

    <!-- Neck -->
    <rect x="112" y="110" width="16" height="15" rx="6" fill="#fbcfe8" />

    <!-- Head & Hair Base -->
    <circle cx="120" cy="95" r="28" fill="#fbcfe8" />
    
    <!-- Beautiful flowing hair (Back layer) -->
    <path d="M 92,90 C 90,65 150,65 148,90 C 152,120 145,145 135,155 L 105,155 C 95,145 88,120 92,90 Z" fill="url(#hairGrad)" />

    <!-- Cute Hair Buns / Otome style double buns (characteristic lively silhouette) -->
    <circle cx="98" cy="72" r="14" fill="#0f172a" />
    <circle cx="142" cy="72" r="14" fill="#0f172a" />
    <!-- Hair accessories / cute ribbons -->
    <path d="M 90,75 Q 85,65 95,62" fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" />
    <path d="M 150,75 Q 155,65 145,62" fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" />

    <!-- Face Details -->
    <!-- Bangs -->
    <path d="M 95,85 Q 120,105 145,85 Q 140,75 120,78 Q 100,75 95,85 Z" fill="#0f172a" />
    
    <!-- Cheeks (Blush) -->
    <circle cx="105" cy="102" r="6" fill="#fda4af" opacity="0.6" />
    <circle cx="135" cy="102" r="6" fill="#fda4af" opacity="0.6" />

    <!-- Gentle Friendly Eyes -->
    <circle cx="110" cy="96" r="3.5" fill="#0f172a" />
    <circle cx="130" cy="96" r="3.5" fill="#0f172a" />
    <!-- Eye highlights -->
    <circle cx="111" cy="95" r="1.2" fill="#ffffff" />
    <circle cx="131" cy="95" r="1.2" fill="#ffffff" />

    <!-- Happy Smiling Mouth -->
    <path d="M 115,103 Q 120,109 125,103" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyebrows -->
    <path d="M 106,90 Q 110,87 114,90" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 126,90 Q 130,87 134,90" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND ACCENTS & ATMOSPHERE -->
  <!-- Cute glowing floating particles / fireflies representing vibrant life -->
  <circle cx="60" cy="140" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="50" cy="150" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="180" cy="130" r="2.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="195" cy="145" r="3.5" fill="#f43f5e" opacity="0.6" />
  <circle cx="75" cy="190" r="2" fill="#34d399" opacity="0.8" />

  <!-- Teacup prop floating near her hand for vivid real-world interaction -->
  <g transform="translate(68, 145)">
    <ellipse cx="10" cy="5" rx="6" ry="3" fill="#f8fafc" />
    <path d="M 5,5 L 7,15 C 7,17 9,18 11,18 L 13,18 C 15,18 17,17 17,15 L 19,5 Z" fill="#e2e8f0" />
    <path d="M 17,8 C 20,8 20,13 17,14" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 8,0 Q 6,-5 10,-8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Frame border overlay for polished vector card look -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#475569" stroke-width="2" opacity="0.5" />
</svg>