<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mountain Gradient (Back) -->
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mountain Gradient (Front) -->
    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Sunrise/Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Fresh Air Stream Gradient -->
    <linearGradient id="airStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Pine Tree Leaf Gradient -->
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Glow (Sunrise over mountains) -->
  <circle cx="170" cy="90" r="70" fill="url(#sunGlow)"/>

  <!-- Background Distant Mountains -->
  <polygon points="10,160 80,90 150,160" fill="url(#mountainBack)"/>
  <polygon points="110,160 180,70 240,160" fill="url(#mountainBack)"/>

  <!-- Foreground Mountain Peak -->
  <polygon points="40,180 130,100 220,180" fill="url(#mountainFront)"/>
  <!-- Mountain snow cap -->
  <path d="M130,100 L150,125 L140,130 L130,120 L120,130 L110,125 Z" fill="#f8fafc" opacity="0.9"/>

  <!-- Wooden Lookout Deck / Foreground Surface -->
  <path d="M20,180 L220,180 L230,220 L10,220 Z" fill="#0f172a"/>
  <!-- Wooden Planks -->
  <line x1="20" y1="190" x2="220" y2="190" stroke="#1e293b" stroke-width="2"/>
  <line x1="15" y1="202" x2="225" y2="202" stroke="#1e293b" stroke-width="2"/>
  <line x1="10" y1="214" x2="230" y2="214" stroke="#1e293b" stroke-width="2"/>
  <!-- Railing Posts -->
  <rect x="35" y="160" width="8" height="30" rx="2" fill="#334155"/>
  <rect x="195" y="160" width="8" height="30" rx="2" fill="#334155"/>
  <line x1="30" y1="170" x2="210" y2="170" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- Lush Pine Trees (Representing clean nature & fresh air) -->
  <!-- Tree Left -->
  <path d="M45,150 L30,180 L60,180 Z" fill="url(#pineGrad)"/>
  <path d="M45,135 L33,160 L57,160 Z" fill="url(#pineGrad)"/>
  <rect x="42" y="180" width="6" height="10" fill="#78350f"/>

  <!-- Tree Right -->
  <path d="M185,155 L170,185 L200,185 Z" fill="url(#pineGrad)"/>
  <path d="M185,140 L174,163 L196,163 Z" fill="url(#pineGrad)"/>
  <rect x="182" y="185" width="6" height="10" fill="#78350f"/>

  <!-- Dynamic Swirling Clean Air Streams (Visualizing "空气") -->
  <!-- Air Stream 1 -->
  <path d="M30,140 C60,110 80,160 120,130 C150,100 180,120 210,95" fill="none" stroke="url(#airStream)" stroke-width="8" stroke-linecap="round"/>
  <!-- Air Stream 2 -->
  <path d="M50,155 C80,135 100,175 140,145 C170,120 190,140 225,115" fill="none" stroke="url(#airStream)" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- Floating Oxygen Bubbles / Freshness Sparks -->
  <circle cx="85" cy="115" r="5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="95" cy="112" r="3" fill="#ffffff" opacity="0.9"/>
  
  <circle cx="135" cy="95" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="145" cy="90" r="3.5" fill="#ffffff" opacity="0.9"/>

  <circle cx="180" cy="110" r="4" fill="#38bdf8" opacity="0.9"/>
  <circle cx="172" cy="105" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Character / Hiker enjoying the fresh air -->
  <!-- Body/Torso -->
  <path d="M110,195 C110,175 120,165 130,165 C140,165 150,175 150,195 Z" fill="#ec4899"/>
  <!-- Backpack -->
  <rect x="100" y="170" width="14" height="22" rx="4" fill="#f97316"/>
  
  <!-- Head & Neck -->
  <circle cx="130" cy="150" r="11" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M119,148 C119,140 125,138 131,138 C138,138 141,142 141,148 Z" fill="#334155"/>

  <!-- Raised Arms in pure enjoyment/breathing in -->
  <!-- Left Arm (bent up) -->
  <path d="M118,172 L105,155 L115,150" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Arm (bent up) -->
  <path d="M142,172 L155,155 L145,150" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Happy Closed Eyes (Arc) -->
  <path d="M126,149 Q129,152 132,149" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M127,155 Q130,158 133,155" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Ambient Floating Leaves in the breeze -->
  <path d="M60,95 Q65,90 70,98 Q60,102 60,95 Z" fill="#34d399" transform="rotate(25 65 95)"/>
  <path d="M165,75 Q170,70 175,78 Q165,82 165,75 Z" fill="#10b981" transform="rotate(-35 170 75)"/>
  <path d="M100,75 Q104,70 108,77 Q100,80 100,75 Z" fill="#38bdf8" transform="rotate(45 104 75)" opacity="0.8"/>

</svg>