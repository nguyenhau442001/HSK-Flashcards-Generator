<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Hall Glow -->
    <linearGradient id="hallGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Pillar Gradient -->
    <linearGradient id="pillarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Diploma Paper Gradient -->
    <linearGradient id="diplomaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Light Beams from University Hallway -->
  <path d="M 60,0 L 0,240 L 90,240 Z" fill="#fbbf24" opacity="0.05"/>
  <path d="M 180,0 L 150,240 L 240,240 Z" fill="#fbbf24" opacity="0.05"/>
  <polygon points="120,30 20,220 220,220" fill="url(#hallGlow)"/>

  <!-- Architectural Columns (University Hall) -->
  <rect x="15" y="40" width="16" height="180" rx="4" fill="url(#pillarGrad)" opacity="0.8"/>
  <rect x="209" y="40" width="16" height="180" rx="4" fill="url(#pillarGrad)" opacity="0.8"/>
  <!-- Column Capitals -->
  <rect x="12" y="35" width="22" height="8" rx="2" fill="#93c5fd" opacity="0.9"/>
  <rect x="206" y="35" width="22" height="8" rx="2" fill="#93c5fd" opacity="0.9"/>

  <!-- Ground / Floor Surface -->
  <path d="M 0,200 Q 120,185 240,200 L 240,240 L 0,240 Z" fill="url(#floorGrad)"/>
  <ellipse cx="120" cy="205" rx="90" ry="12" fill="#000000" opacity="0.4"/>

  <!-- University Graduation Cap (Mortarboard) -->
  <g transform="translate(120, 95)">
    <!-- Cap Shadow -->
    <ellipse cx="0" cy="35" rx="45" ry="12" fill="#000000" opacity="0.5"/>
    
    <!-- Cap Skull Cap / Base -->
    <path d="M -22,15 C -22,32 22,32 22,15 Z" fill="#1e293b"/>
    <path d="M -18,18 C -18,28 18,28 18,18 Z" fill="#0f172a"/>

    <!-- Mortarboard Top Diamond -->
    <polygon points="0,-22 62,5 0,32 -62,5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <polygon points="0,-19 55,5 0,29 -55,5" fill="#0f172a"/>

    <!-- Center Button -->
    <circle cx="0" cy="5" r="5" fill="#fbbf24"/>
    <circle cx="0" cy="5" r="2" fill="#fef08a"/>

    <!-- Tassel String & Pendant -->
    <path d="M 0,5 C 25,12 45,25 42,42" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tassel Fringe -->
    <rect x="38" y="40" width="8" height="18" rx="2" fill="#f59e0b"/>
    <rect x="39" y="41" width="6" height="16" rx="1" fill="#fbbf24"/>
  </g>

  <!-- Official University Degree Scroll / Diploma (Core Representation of 本科) -->
  <g transform="translate(120, 160)">
    <!-- Diploma Drop Shadow -->
    <ellipse cx="0" cy="22" rx="55" ry="10" fill="#000000" opacity="0.5"/>

    <!-- Unrolled Main Certificate Body -->
    <path d="M -60,-15 L 60,-15 L 60,20 L -60,20 Z" fill="url(#diplomaGrad)" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Certificate Inner Border / Decorative Lines -->
    <rect x="-54" y="-10" width="108" height="25" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3, 3"/>
    
    <!-- Abstract Text Lines on Diploma -->
    <line x1="-42" y1="-2" x2="-15" y2="-2" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-42" y1="5" x2="-25" y2="5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-42" y1="11" x2="-30" y2="11" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Academic Seal / Badge on Diploma -->
    <circle cx="35" cy="5" r="9" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="35" cy="5" r="5" fill="#f59e0b"/>

    <!-- Red Ribbon Tied Around Diploma -->
    <rect x="-8" y="-17" width="16" height="39" rx="3" fill="url(#ribbonGrad)"/>
    <rect x="-6" y="-17" width="12" height="39" fill="#ef4444"/>
    <!-- Ribbon Bow / Ends -->
    <path d="M -12,22 C -18,25 -22,18 -16,14 C -12,12 -8,15 -8,18 Z" fill="#dc2626"/>
    <path d="M 12,22 C 18,25 22,18 16,14 C 12,12 8,15 8,18 Z" fill="#dc2626"/>
    <path d="M -4,22 L -10,34 L -2,29 Z" fill="#b91c1c"/>
    <path d="M 4,22 L 10,34 L 2,29 Z" fill="#b91c1c"/>
  </g>

  <!-- Floating Academic / Success Sparkles & Stars -->
  <g fill="#fbbf24">
    <!-- Star Top Left -->
    <path d="M 50,55 Q 50,65 40,65 Q 50,65 50,75 Q 50,65 60,65 Q 50,65 50,55 Z" opacity="0.9"/>
    <!-- Star Top Right -->
    <path d="M 190,70 Q 190,77 183,77 Q 190,77 190,84 Q 190,77 197,77 Q 190,77 190,70 Z" opacity="0.8"/>
    <!-- Star Mid Right -->
    <path d="M 210,140 Q 210,146 204,146 Q 210,146 210,152 Q 210,146 216,146 Q 210,146 210,140 Z" opacity="0.6"/>
    <!-- Small Dot Accents -->
    <circle cx="75" cy="110" r="2.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="165" cy="115" r="3" fill="#34d399" opacity="0.8"/>
    <circle cx="95" cy="50" r="2" fill="#fb7185" opacity="0.7"/>
    <circle cx="145" cy="45" r="2.5" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Glowing Aura behind central composition -->
  <circle cx="120" cy="120" r="50" fill="#3b82f6" opacity="0.1" filter="blur(15px)"/>
</svg>