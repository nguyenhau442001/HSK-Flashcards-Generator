<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Holographic glow / complexity aura -->
    <radialGradient id="holoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Panel Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Node Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="circleClip">
      <circle cx="120" cy="115" r="95"/>
    </clipPath>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Atmospheric Background Elements (Subtle Grid/Tech lines) -->
  <g opacity="0.15">
    <line x1="20" y1="40" x2="220" y2="40" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="20" y1="80" x2="220" y2="80" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="20" y1="120" x2="220" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="20" y1="160" x2="220" y2="160" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="20" y1="200" x2="220" y2="200" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="60" y1="20" x2="60" y2="220" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="120" y1="20" x2="120" y2="220" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="180" y1="20" x2="180" y2="220" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Central Scene Frame -->
  <circle cx="120" cy="115" r="96" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <g clip-path="url(#circleClip)">
    <!-- Inner Backdrop Glow -->
    <circle cx="120" cy="100" r="80" fill="url(#holoGlow)"/>

    <!-- COMPLEX NETWORK/GEARS BACKGROUND (Representing 'Complex / 复杂') -->
    <g opacity="0.6" filter="url(#glow)">
      <!-- Connecting nodes & lines -->
      <path d="M40,70 L80,50 L110,90 L150,60 L190,90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2"/>
      <path d="M50,150 L90,130 L130,160 L170,120 L200,160" fill="none" stroke="#ec4899" stroke-width="1.5"/>
      <path d="M80,50 L90,130 M110,90 L130,160 M150,60 L170,120" fill="none" stroke="#fbbf24" stroke-width="1"/>
      
      <!-- Nodes / Cogs -->
      <circle cx="80" cy="50" r="5" fill="#38bdf8"/>
      <circle cx="110" cy="90" r="7" fill="#fbbf24"/>
      <circle cx="150" cy="60" r="4" fill="#ec4899"/>
      <circle cx="90" cy="130" r="6" fill="#10b981"/>
      <circle cx="130" cy="160" r="5" fill="#38bdf8"/>
      <circle cx="170" cy="120" r="8" fill="#fbbf24"/>
    </g>

    <!-- Floating holographic screens / puzzles -->
    <g opacity="0.85">
      <!-- Left Floating Hexagon Card -->
      <polygon points="45,85 65,75 85,85 85,115 65,125 45,115" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="65" cy="100" r="8" fill="#38bdf8" opacity="0.5"/>
      <path d="M55,95 L75,105 M55,105 L75,95" stroke="#f8fafc" stroke-width="1.5"/>

      <!-- Right Floating Square Card -->
      <rect x="155" y="70" width="36" height="36" rx="6" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5"/>
      <circle cx="173" cy="88" r="10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
      <circle cx="173" cy="88" r="4" fill="#ec4899"/>

      <!-- Top Center Floating Gear/Puzzle piece -->
      <path d="M115,35 L125,35 L128,42 L135,45 L140,39 L147,45 L144,52 L151,55 L151,62 L144,65 L147,72 L140,78 L135,72 L128,75 L125,82 L115,82 L112,75 L105,72 L100,78 L93,72 L96,65 L89,62 L89,55 L96,52 L93,45 L100,39 L105,45 L112,42 Z" fill="#334155" stroke="#fbbf24" stroke-width="1.5" opacity="0.9"/>
      <circle cx="120" cy="58" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    </g>

    <!-- CHARACTER: Confused/Puzzled student/expert trying to solve a complex problem -->
    <g id="character">
      <!-- Shoulders & Torso (Jacket/Shirt) -->
      <path d="M75,200 C75,170 95,155 120,155 C145,155 165,170 165,200 L185,225 L55,225 Z" fill="#1e293b"/>
      <path d="M85,200 C85,175 100,162 120,162 C140,162 155,175 155,200 L165,225 L75,225 Z" fill="#3b82f6"/> <!-- Inner Shirt -->
      
      <!-- Collar & Tie -->
      <path d="M100,162 L120,185 L140,162 Z" fill="#f8fafc"/>
      <polygon points="116,180 124,180 127,215 120,222 113,215" fill="#ef4444"/>

      <!-- Neck -->
      <rect x="110" y="135" width="20" height="25" rx="6" fill="#f1d0bc"/>

      <!-- Head & Ears -->
      <circle cx="120" cy="115" r="32" fill="#fcd34d" opacity="0.2"/> <!-- Thought glow -->
      <circle cx="120" cy="110" r="28" fill="#f8d7c4"/>
      
      <!-- Ears -->
      <circle cx="91" cy="112" r="5" fill="#f8d7c4"/>
      <circle cx="149" cy="112" r="5" fill="#f8d7c4"/>

      <!-- Hair (Messy/Stressed style to show complexity) -->
      <path d="M92,105 C90,85 105,75 120,75 C135,75 150,85 148,105 C152,95 150,80 138,72 C126,64 110,65 100,72 C90,80 90,95 92,105 Z" fill="#334155"/>
      <path d="M115,74 C115,70 120,65 128,68 C136,70 142,75 142,75 C142,75 130,62 115,68 C105,72 103,78 103,78 Z" fill="#475569"/>

      <!-- Expressive Eyebrows (Scrunched, asymmetrical, showing deep thought/confusion) -->
      <path d="M102,96 L116,101" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M124,101 L138,95" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Eyes (Wide, staring, looking at complex floating elements) -->
      <circle cx="108" cy="107" r="4.5" fill="#ffffff"/>
      <circle cx="109" cy="107" r="2" fill="#0f172a"/>
      
      <circle cx="132" cy="107" r="4.5" fill="#ffffff"/>
      <circle cx="131" cy="107" r="2" fill="#0f172a"/>

      <!-- Sweat Drop (Classic sign of mental overload / complexity) -->
      <path d="M148,95 C148,95 155,105 155,110 C155,114 151,117 148,117 C145,117 141,114 141,110 C141,105 148,95 148,95 Z" fill="#38bdf8" filter="url(#glow)"/>

      <!-- Nose -->
      <path d="M120,110 L117,121 L123,121" fill="none" stroke="#e0b8a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Mouth (Wavy/Pout line of uncertainty) -->
      <path d="M110,128 Q120,123 130,128" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Hands scratching head / holding chin in contemplation -->
      <!-- Right Hand on Chin -->
      <path d="M130,135 C135,130 145,135 142,145 C140,150 132,148 132,148" fill="#f8d7c4" stroke="#e0b8a2" stroke-width="1.5"/>
      <circle cx="140" cy="142" r="3" fill="#f8d7c4"/>

      <!-- Left Hand scratching head -->
      <path d="M95,95 C85,90 82,105 90,110 C94,112 98,105 98,105" fill="#f8d7c4" stroke="#e0b8a2" stroke-width="1.5"/>
    </g>

    <!-- Floating Question Marks / Complexity symbols (Abstract shapes, NO text) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <!-- Glowing Orange Question Mark Shape (stylized curve) -->
      <path d="M60,110 C55,95 75,85 80,100 C83,110 70,115 70,125" stroke="#fb923c" stroke-width="3"/>
      <circle cx="70" cy="135" r="1.5" fill="#fb923c"/>

      <!-- Glowing Green Spiral / Knot -->
      <path d="M175,140 C185,130 185,155 170,155 C160,155 160,135 175,135" stroke="#10b981" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Outer Border & Polish -->
  <circle cx="120" cy="115" r="96" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

  <!-- Bottom Accent Tag (Decorative UI element representing app badge context, strictly NO text) -->
  <g transform="translate(85, 215)">
    <rect x="0" y="0" width="70" height="16" rx="8" fill="#334155" opacity="0.8"/>
    <circle cx="12" cy="8" r="4" fill="#38bdf8"/>
    <circle cx="27" cy="8" r="4" fill="#fbbf24"/>
    <circle cx="42" cy="8" r="4" fill="#ec4899"/>
    <circle cx="57" cy="8" r="4" fill="#10b981"/>
  </g>
</svg>