<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Workbench Gradient -->
    <linearGradient id="benchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden/Amber Glow for Action Focus -->
    <radialGradient id="toolGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Laser/Energy Ray Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Workshop Interior) -->
  <g id="environment">
    <!-- Back wall shelving & tool silhouettes -->
    <path d="M40 70 L200 70 L200 72 L40 72 Z" fill="#475569" opacity="0.6"/>
    <rect x="55" y="45" width="25" height="25" rx="3" fill="#334155" opacity="0.4"/>
    <rect x="90" y="40" width="30" height="30" rx="3" fill="#334155" opacity="0.4"/>
    <rect x="135" y="50" width="20" height="20" rx="3" fill="#334155" opacity="0.4"/>
    
    <!-- Pegboard dots pattern -->
    <g fill="#475569" opacity="0.3">
      <circle cx="60" cy="90" r="1.5"/><circle cx="75" cy="90" r="1.5"/><circle cx="90" cy="90" r="1.5"/><circle cx="105" cy="90" r="1.5"/><circle cx="120" cy="90" r="1.5"/><circle cx="135" cy="90" r="1.5"/><circle cx="150" cy="90" r="1.5"/><circle cx="165" cy="90" r="1.5"/><circle cx="180" cy="90" r="1.5"/>
      <circle cx="60" cy="110" r="1.5"/><circle cx="75" cy="110" r="1.5"/><circle cx="90" cy="110" r="1.5"/><circle cx="105" cy="110" r="1.5"/><circle cx="120" cy="110" r="1.5"/><circle cx="135" cy="110" r="1.5"/><circle cx="150" cy="110" r="1.5"/><circle cx="165" cy="110" r="1.5"/><circle cx="180" cy="110" r="1.5"/>
    </g>

    <!-- Warm ambient lighting from upper corner -->
    <circle cx="210" cy="30" r="80" fill="#fbbf24" opacity="0.1"/>
  </g>

  <!-- Foreground Workbench -->
  <rect x="20" y="175" width="200" height="45" rx="4" fill="url(#benchGrad)"/>
  <rect x="20" y="170" width="200" height="8" rx="2" fill="#475569"/>
  <!-- Workbench legs -->
  <rect x="35" y="220" width="14" height="20" fill="#0f172a"/>
  <rect x="191" y="220" width="14" height="20" fill="#0f172a"/>

  <!-- Background Props on Bench -->
  <g id="workshop-props">
    <!-- Spare parts box -->
    <rect x="165" y="145" width="35" height="25" rx="3" fill="#10b981"/>
    <path d="M165 153 L200 153" stroke="#065f46" stroke-width="2"/>
    <circle cx="182" cy="149" r="2" fill="#065f46"/>
    <!-- Screws/bolts container -->
    <path d="M140 155 L155 155 L152 170 L143 170 Z" fill="#64748b"/>
    <circle cx="147" cy="153" r="4" fill="#cbd5e1"/>
  </g>

  <!-- Action Focus Glow around the tool and object -->
  <circle cx="105" cy="130" r="45" fill="url(#toolGlow)"/>

  <!-- Character: Upper Body & Dynamic Posture -->
  <g id="character">
    <!-- Torso (leaning forward actively using the tool) -->
    <path d="M90 140 C85 115 100 100 115 105 C130 110 145 130 150 175 L85 175 Z" fill="#3b82f6"/>
    
    <!-- Collar / Shirt details -->
    <path d="M105 107 L115 115 L125 107" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>

    <!-- Head & Face (Focused expression) -->
    <g id="head">
      <ellipse cx="118" cy="82" rx="16" ry="18" fill="#fcd34d"/>
      <!-- Hair -->
      <path d="M102 82 C102 65 134 65 134 82 C134 85 132 82 130 76 C124 68 112 68 106 76 C104 82 102 85 102 82 Z" fill="#1e293b"/>
      <!-- Focused Eye -->
      <path d="M116 80 L122 83" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Concentrated Eyebrow -->
      <path d="M114 77 L124 80" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Mouth (determined smirk/focus) -->
      <path d="M118 90 C120 92 122 90 123 89" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
      <!-- Safety Goggles pushed up on forehead -->
      <path d="M104 73 C112 68 124 68 132 73" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="108" cy="71" r="5" fill="#38bdf8" opacity="0.6"/>
      <circle cx="128" cy="71" r="5" fill="#38bdf8" opacity="0.6"/>
    </g>

    <!-- Left Arm (Supporting / Stabilizing) -->
    <path d="M95 125 C80 135 70 150 65 165 L75 170 C80 158 90 145 100 135 Z" fill="#2563eb"/>
    <circle cx="63" cy="167" r="6" fill="#fcd34d"/>

    <!-- Right Arm (Active grip pushing down on tool) -->
    <path d="M130 115 C145 120 155 135 150 150 L140 148 C144 140 138 130 128 123 Z" fill="#2563eb"/>
    <circle cx="149" cy="152" r="6" fill="#fcd34d"/>
  </g>

  <!-- Central Tool / Object Being Used (High-Tech Rotary Drill/Sander) -->
  <g id="main-tool">
    <!-- Tool Body -->
    <rect x="110" y="115" width="28" height="45" rx="8" fill="#fb923c" transform="rotate(25 124 137)"/>
    <!-- Grip accents -->
    <line x1="118" y1="125" x2="128" y2="130" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
    <line x1="116" y1="133" x2="126" y2="138" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Tool Head / Chuck -->
    <rect x="130" y="145" width="12" height="15" rx="3" fill="#cbd5e1" transform="rotate(25 136 152)"/>
    
    <!-- Spinning Drill Bit / Laser Tip -->
    <polygon points="138,154 165,162 138,168" fill="#38bdf8"/>
    
    <!-- Active Action Sparks / Energy Particles -->
    <g id="sparks">
      <circle cx="152" cy="158" r="3" fill="#f59e0b"/>
      <circle cx="160" cy="152" r="2" fill="#fbbf24"/>
      <circle cx="158" cy="168" r="2.5" fill="#f97316"/>
      <path d="M163 155 L175 152" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <path d="M165 165 L178 170" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M160 160 L172 162" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- The Object Being Worked On (Detailed Mechanical Part in Vice) -->
  <g id="target-object">
    <!-- Metal Base Plate clamped on workbench -->
    <rect x="75" y="160" width="70" height="15" rx="2" fill="#64748b"/>
    <!-- Vice grip left -->
    <path d="M70 150 L85 150 L85 178 L70 178 Z" fill="#475569"/>
    <!-- Vice grip right -->
    <path d="M135 150 L150 150 L150 178 L135 178 Z" fill="#475569"/>

    <!-- Intricate Gear / Mechanical Component receiving the action -->
    <g transform="translate(105, 160)">
      <!-- Main gear body -->
      <circle cx="0" cy="0" r="18" fill="#94a3b8"/>
      <circle cx="0" cy="0" r="8" fill="#334155"/>
      <!-- Gear teeth -->
      <rect x="-3" y="-22" width="6" height="6" fill="#64748b"/>
      <rect x="-3" y="16" width="6" height="6" fill="#64748b"/>
      <rect x="-22" y="-3" width="6" height="6" fill="#64748b"/>
      <rect x="16" y="-3" width="6" height="6" fill="#64748b"/>
      
      <!-- Highlight where tool is touching -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    </g>
  </g>

  <!-- Foreground Action Frame Enhancements (Depth of field) -->
  <g id="foreground-bokeh" opacity="0.4">
    <circle cx="25" cy="110" r="4" fill="#38bdf8"/>
    <circle cx="215" cy="100" r="6" fill="#f59e0b"/>
    <circle cx="205" cy="195" r="3" fill="#10b981"/>
  </g>
</svg>