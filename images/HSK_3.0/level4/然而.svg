<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Warm Light Gradient -->
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ticket Glow Gradient -->
    <linearGradient id="ticketGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements: Cozy Room Environment -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="140" y="30" width="70" height="85" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="3"/>
    <!-- Window Light Projection -->
    <polygon points="143,33 207,33 225,145 120,145" fill="url(#warmLight)" opacity="0.3"/>
    
    <!-- Potted Plant Silhouette -->
    <path d="M25,120 Q20,145 15,150 L35,150 Q30,145 25,120 Z" fill="#334155"/>
    <circle cx="25" cy="112" r="10" fill="#10b981" opacity="0.8"/>
    <circle cx="18" cy="102" r="8" fill="#059669" opacity="0.8"/>
    <circle cx="34" cy="105" r="9" fill="#34d399" opacity="0.8"/>

    <!-- Bookshelf in background -->
    <rect x="25" y="35" width="45" height="60" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="55" x2="70" y2="55" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="75" x2="70" y2="75" stroke="#334155" stroke-width="2"/>
    <!-- Books -->
    <rect x="29" y="42" width="6" height="13" rx="1" fill="#ec4899"/>
    <rect x="37" y="40" width="8" height="15" rx="1" fill="#38bdf8"/>
    <rect x="47" y="44" width="5" height="11" rx="1" fill="#f59e0b"/>
    <rect x="30" y="61" width="10" height="14" rx="1" fill="#10b981"/>
    <rect x="42" y="59" width="7" height="16" rx="1" fill="#8b5cf6"/>
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M0,150 L240,150 L240,240 L0,240 Z" fill="url(#deskGrad)"/>
  <rect x="0" y="145" width="240" height="6" fill="#475569"/>

  <!-- Foreground Props (Context: Wanting to go out, but prevented/interrupted) -->
  <g id="props">
    <!-- Travel Backpack (Desire to go) -->
    <g transform="translate(180, 115)">
      <!-- Straps -->
      <path d="M10,5 Q5,20 15,35" fill="none" stroke="#b45309" stroke-width="4"/>
      <!-- Main body -->
      <rect x="8" y="15" width="35" height="45" rx="10" fill="#d97706"/>
      <!-- Front pocket -->
      <rect x="13" y="32" width="25" height="22" rx="6" fill="#b45309"/>
      <!-- Buckle -->
      <rect x="22" y="38" width="7" height="4" rx="1" fill="#fde68a"/>
      <!-- Sleeping bag roll attached on top -->
      <rect x="5" y="10" width="41" height="12" rx="6" fill="#0284c7"/>
    </g>

    <!-- Airplane Ticket / Itinerary (The Goal) -->
    <g transform="translate(130, 135) rotate(-15)">
      <rect x="0" y="0" width="55" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Ticket Header -->
      <rect x="0" y="0" width="55" height="9" fill="url(#ticketGlow)"/>
      <!-- Barcode/Lines simulation -->
      <line x1="8" y1="15" x2="25" y2="15" stroke="#94a3b8" stroke-width="2"/>
      <line x1="8" y1="20" x2="20" y2="20" stroke="#94a3b8" stroke-width="2"/>
      <line x1="8" y1="25" x2="16" y2="25" stroke="#94a3b8" stroke-width="2"/>
      <!-- Mini plane icon graphic -->
      <path d="M40,20 L48,15 L46,19 L52,19 L53,21 L46,21 L45,25 L40,20 Z" fill="#0284c7"/>
      <!-- Stub perforated line -->
      <line x1="38" y1="9" x2="38" y2="32" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>
    </g>

    <!-- Warm Glowing Desk Lamp (Illuminating the scene) -->
    <g transform="translate(45, 105)">
      <!-- Lamp Base -->
      <ellipse cx="15" cy="45" rx="15" ry="5" fill="#64748b"/>
      <!-- Stand -->
      <path d="M15,45 L15,20 Q15,10 25,12" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <!-- Shade -->
      <path d="M15,10 L5,25 L35,25 Z" fill="#fbbf24"/>
      <!-- Light beam cast downward -->
      <polygon points="12,25 18,25 32,80 -2,80" fill="#fbbf24" opacity="0.15"/>
    </g>

    <!-- Clock showing late time / constraint (Contrast) -->
    <g transform="translate(190, 45)">
      <circle cx="12" cy="12" r="12" fill="#334155" stroke="#64748b" stroke-width="2"/>
      <circle cx="12" cy="12" r="10" fill="#0f172a"/>
      <!-- Hands -->
      <line x1="12" y1="12" x2="12" y2="6" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="12" x2="17" y2="12" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Red second hand pointing aggressively -->
      <line x1="12" y1="12" x2="7" y2="16" stroke="#ef4444" stroke-width="1"/>
      <circle cx="12" cy="12" r="1.5" stroke="#ef4444" fill="#f8fafc"/>
    </g>
  </g>

  <!-- Main Subject: Action-packed expressive character showing hesitation/contrast ("Tuy nhiên" / However) -->
  <g id="main-character" transform="translate(70, 75)">
    <!-- Character Shadow -->
    <ellipse cx="45" cy="78" rx="35" ry="10" fill="#020617" opacity="0.5"/>

    <!-- Body / Torso (Leaning forward eagerly, but stopped) -->
    <path d="M30,45 Q45,35 60,45 L68,75 L22,75 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt detail -->
    <path d="M38,45 L45,55 L52,45 Z" fill="#f8fafc"/>

    <!-- Head -->
    <g transform="translate(42, 22)">
      <!-- Hair Base -->
      <path d="M-14,-5 Q0,-18 16,-5 Q20,10 14,18 Q0,12 -16,18 Q-20,10 -14,-5 Z" fill="#1e293b"/>
      
      <!-- Face Base -->
      <ellipse cx="0" cy="5" rx="14" ry="15" fill="#fde047"/>
      
      <!-- Expressive Eyebrows (Conflicted / "However" emotion) -->
      <path d="M-10,-1 Q-5,-4 0,-1" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M2,-1 Q7,-4 12,-1" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Eyes (Wide, looking at the clock/constraint) -->
      <circle cx="-5" cy="5" r="3" fill="#1e293b"/>
      <circle cx="7" cy="5" r="3" fill="#1e293b"/>
      <circle cx="-4" cy="4" r="1" fill="#ffffff"/>
      <circle cx="8" cy="4" r="1" fill="#ffffff"/>

      <!-- Hesitant / Puzzled Mouth (Small wavy line) -->
      <path d="M-3,13 Q0,10 4,13" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Warm Rosy Cheeks -->
      <circle cx="-9" cy="9" r="2.5" fill="#fb7185" opacity="0.6"/>
      <circle cx="11" cy="9" r="2.5" fill="#fb7185" opacity="0.6"/>
    </g>

    <!-- Arms & Hands (One hand reaching for ticket/door, one hand scratching head in dilemma) -->
    <!-- Left Arm (Reaching towards the travel ticket / eager to go) -->
    <path d="M25,48 Q-5,50 -2,35" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="-4" cy="33" r="4" fill="#fde047"/>

    <!-- Right Arm (Scratching head, hesitating - "however...") -->
    <path d="M60,48 Q82,30 65,15" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand on head -->
    <circle cx="63" cy="13" r="4" fill="#fde047"/>
  </g>

  <!-- Narrative Contrast Elements (Visualizing the "However" transition) -->
  <g id="contrast-sparkles" transform="translate(100, 50)">
    <!-- Glowing orange warning / unexpected turn star-bursts -->
    <path d="M0,0 L3,8 L11,11 L3,14 L0,22 L-3,14 L-11,11 L-3,8 Z" fill="#fb923c" opacity="0.9"/>
    <path d="M35,-15 L37,-10 L42,-8 L37,-6 L35,-1 L33,-6 L28,-8 L33,-10 Z" fill="#38bdf8" opacity="0.8"/>
  </g>
</svg>