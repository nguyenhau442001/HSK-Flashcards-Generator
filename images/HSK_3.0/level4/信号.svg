<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Signal Wave Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Room Environment / Background Details -->
  <!-- Window framing a night city view or outdoor antenna tower -->
  <path d="M160 40 L210 40 L210 140 L160 140 Z" fill="#1e293b" opacity="0.6"/>
  <rect x="165" y="45" width="40" height="90" rx="4" fill="#0f172a"/>
  <!-- Distant city lights outside window -->
  <circle cx="175" cy="65" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="195" cy="85" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="180" cy="110" r="2" fill="#ec4899" opacity="0.6"/>
  <!-- Radio Tower silhouette in distance -->
  <polygon points="185,50 188,50 190,115 183,115" fill="#334155"/>
  <line x1="182" y1="60" x2="191" y2="60" stroke="#334155" stroke-width="1.5"/>
  <line x1="181" y1="80" x2="192" y2="80" stroke="#334155" stroke-width="1.5"/>
  <line x1="180" y1="100" x2="193" y2="100" stroke="#334155" stroke-width="1.5"/>
  <circle cx="186.5" cy="48" r="1.5" fill="#ef4444" filter="url(#glow)"/> <!-- Blinking beacon -->

  <!-- Cozy Interior Elements: Bookshelf / Lamp -->
  <path d="M20 180 L80 180 L80 220 L20 220 Z" fill="#334155" opacity="0.4"/>
  <rect x="30" y="150" width="35" height="30" rx="2" fill="#475569" opacity="0.5"/> <!-- books -->
  <rect x="35" y="130" width="8" height="20" rx="1" fill="#fb923c"/>
  <rect x="45" y="125" width="8" height="25" rx="1" fill="#38bdf8"/>

  <!-- Desk Surface -->
  <rect x="0" y="190" width="240" height="50" fill="#0f172a"/>
  <path d="M0 190 L240 190" stroke="#334155" stroke-width="2"/>

  <!-- Coffee Mug Prop -->
  <path d="M195 175 C195 168 205 168 205 175 L205 190 C205 195 195 195 195 190 Z" fill="#f8fafc"/>
  <path d="M205 178 C210 178 212 184 205 187" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <!-- Steam from mug -->
  <path d="M198 162 C196 158 202 154 200 150" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Main Character (Seated, leaning forward with excitement/surprise) -->
  <!-- Chair Back -->
  <path d="M55 100 C55 80 75 80 75 100 L75 180 L55 180 Z" fill="#475569"/>
  
  <!-- Character Body / Torso -->
  <path d="M70 130 C85 120 115 130 120 160 L125 190 L75 190 Z" fill="#6366f1"/>
  <!-- Collar -->
  <path d="M90 130 L100 142 L110 130 Z" fill="#e0e7ff"/>

  <!-- Character Head & Hair -->
  <circle cx="95" cy="100" r="22" fill="#ffedd5"/> <!-- Face -->
  <!-- Hair (Stylized modern cut) -->
  <path d="M73 100 C73 78 117 78 117 100 C117 105 115 110 112 110 C108 110 108 105 105 105 C100 105 95 108 90 105 C85 105 80 110 75 105 C74 103 73 101 73 100 Z" fill="#334155"/>

  <!-- Expressive Face (Joyful / Alert) -->
  <!-- Eyes (Wide, bright) -->
  <circle cx="88" cy="98" r="2.5" fill="#1e293b"/>
  <circle cx="104" cy="98" r="2.5" fill="#1e293b"/>
  <!-- Eyebrows raised higher in pleasant surprise -->
  <path d="M85 92 C87 90 91 90 93 92" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M101 92 C103 90 107 90 109 92" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M92 108 C95 112 99 112 102 108" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Cheeks (Blush) -->
  <circle cx="84" cy="105" r="3" fill="#fca5a5" opacity="0.6"/>
  <circle cx="108" cy="105" r="3" fill="#fca5a5" opacity="0.6"/>

  <!-- Arms holding the phone -->
  <!-- Left Arm -->
  <path d="M75 140 C80 150 95 155 105 145" stroke="#6366f1" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Right Arm -->
  <path d="M115 140 C110 150 105 155 110 145" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Hands -->
  <circle cx="102" cy="142" r="5" fill="#ffedd5"/>
  <circle cx="112" cy="142" r="5" fill="#ffedd5"/>

  <!-- Smartphone (Central Prop representing "手机收到了一个信号") -->
  <g transform="translate(95, 115) rotate(-10)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="28" height="48" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <!-- Phone Screen -->
    <rect x="2" y="3" width="24" height="42" rx="3" fill="url(#screenGrad)"/>
    <!-- Screen Details (App UI elements, glowing notification) -->
    <rect x="6" y="8" width="16" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="6" y="16" width="10" height="3" rx="1.5" fill="#ffffff" opacity="0.5"/>
    
    <!-- Incoming Signal Visual / Success Notification Banner on screen -->
    <rect x="4" y="24" width="20" height="16" rx="2" fill="#10b981" filter="url(#glow)"/>
    <!-- Mini Signal Waves inside screen badge -->
    <path d="M10 35 C11 33 13 33 14 35" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M8 33 C10 30 14 30 16 33" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="12" cy="28" r="1.5" fill="#ffffff"/>
  </g>

  <!-- CRITICAL ILLUSTRATION ELEMENT: Active Signal Waves ("信号") -->
  <!-- Radiating energetic gold/cyan waves from the phone reaching the user and environment -->
  <g filter="url(#glow)">
    <!-- Wave Arc 1 (Closest to phone) -->
    <path d="M125 110 C145 115 145 145 125 155" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Wave Arc 2 (Middle) -->
    <path d="M135 100 C160 110 160 155 135 168" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Wave Arc 3 (Outer big wave) -->
    <path d="M145 90 C175 105 175 165 145 180" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" fill="none"/>

    <!-- Floating Sparkles / Signal Particles -->
    <circle cx="138" cy="115" r="2.5" fill="#fbbf24"/>
    <circle cx="152" cy="130" r="3.5" fill="#38bdf8"/>
    <circle cx="142" cy="155" r="2" fill="#10b981"/>
    <circle cx="162" cy="145" r="2.5" fill="#fbbf24"/>
  </g>

</svg>