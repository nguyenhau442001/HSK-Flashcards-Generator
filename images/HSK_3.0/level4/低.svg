<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Stool/Chair Gradient -->
    <linearGradient id="stoolGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow behind scene -->
  <circle cx="120" cy="120" r="100" fill="url(#glow)"/>

  <!-- Room Background Elements -->
  <!-- Ambient Wall Panel / Window frame hint -->
  <path d="M40 30 L200 30 L200 170 L40 170 Z" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2"/>

  <!-- Context Props: Normal Height Desk (To contrast and emphasize the 'low' chair) -->
  <g opacity="0.4">
    <!-- Tall Desk in background -->
    <rect x="150" y="90" width="60" height="80" rx="4" fill="#475569"/>
    <line x1="160" y1="170" x2="160" y2="210" stroke="#334155" stroke-width="6"/>
    <line x1="200" y1="170" x2="200" y2="210" stroke="#334155" stroke-width="6"/>
  </g>

  <!-- THE LOW CHAIR / STOOL (Main anchor for '低') -->
  <g id="low-chair">
    <!-- Stool Shadow -->
    <ellipse cx="90" cy="192" rx="22" ry="6" fill="#020617" opacity="0.6"/>
    
    <!-- Stool Legs (Splayed, very short) -->
    <line x1="75" y1="180" x2="68" y2="194" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
    <line x1="105" y1="180" x2="112" y2="194" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Stool Seat (Comically low to the ground) -->
    <ellipse cx="90" cy="180" rx="24" ry="8" fill="url(#stoolGrad)"/>
    <ellipse cx="90" cy="178" rx="24" ry="8" fill="#fdba74"/>
  </g>

  <!-- EXPRESSIVE CHARACTER (Squished/Cramped posture, illustrating '低') -->
  <g id="character">
    <!-- Character Shadow -->
    <ellipse cx="90" cy="195" rx="18" ry="5" fill="#020617" opacity="0.5"/>

    <!-- Legs folded / cramped due to low seat -->
    <!-- Knees poked up high -->
    <path d="M 78 180 Q 72 155 85 150" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <path d="M 102 180 Q 108 155 95 150" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>

    <!-- Shoes -->
    <circle cx="80" cy="192" r="5" fill="#f59e0b"/>
    <circle cx="100" cy="192" r="5" fill="#f59e0b"/>

    <!-- Torso (Slumped forward, sitting low) -->
    <path d="M 75 160 Q 90 145 105 160 L 100 180 L 80 180 Z" fill="url(#shirtGrad)"/>

    <!-- Arms resting on knees, comical frustrated/awkward pose -->
    <path d="M 78 158 Q 65 165 78 178" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M 102 158 Q 115 165 102 178" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Hands -->
    <circle cx="78" cy="178" r="4" fill="#fbbf24"/>
    <circle cx="102" cy="178" r="4" fill="#fbbf24"/>

    <!-- Head & Neck (Slightly scrunched down) -->
    <circle cx="90" cy="132" r="18" fill="#fbbf24"/>
    
    <!-- Hair -->
    <path d="M 73 130 C 73 115 107 115 107 130 C 102 124 78 124 73 130 Z" fill="#b45309"/>
    
    <!-- Facial Expression: Humorous surprise/awkwardness at being so low -->
    <!-- Eyebrows raised high -->
    <path d="M 81 126 Q 85 122 89 126" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <path d="M 91 126 Q 95 122 99 126" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

    <!-- Wide expressive eyes -->
    <circle cx="85" cy="132" r="3" fill="#1e293b"/>
    <circle cx="95" cy="132" r="3" fill="#1e293b"/>
    <circle cx="86" cy="131" r="1" fill="#ffffff"/>
    <circle cx="96" cy="131" r="1" fill="#ffffff"/>

    <!-- Sweat drop (classic anime indicator of awkward predicament) -->
    <path d="M 108 126 C 108 126 113 132 113 135 C 113 138 110 140 108 140 C 106 140 103 138 103 135 C 103 132 108 126 108 126 Z" fill="#38bdf8" opacity="0.8"/>

    <!-- Open "O" mouth of mild disbelief -->
    <ellipse cx="90" cy="141" rx="3" ry="4" fill="#78350f"/>
  </g>

  <!-- Visual Height Indicator (Subtle graphic element to reinforce 'low' relative concept without text) -->
  <g opacity="0.7">
    <!-- Vertical dimension marker on the left -->
    <line x1="30" y1="180" x2="30" y2="132" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- Top arrow -->
    <polyline points="26,136 30,130 34,136" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom arrow -->
    <polyline points="26,176 30,182 34,176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Horizontal baseline indicator -->
    <line x1="20" y1="180" x2="105" y2="180" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>
  </g>

  <!-- Foreground Atmospheric Particles/Sparkles -->
  <circle cx="50" cy="90" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="130" cy="70" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="190" cy="130" r="1" fill="#fbbf24" opacity="0.8"/>
  <circle cx="70" cy="50" r="2.5" fill="#f472b6" opacity="0.4"/>
</svg>