<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background lighting -->
  <circle cx="120" cy="130" r="70" fill="#f59e0b" opacity="0.1" filter="url(#glow)" />

  <!-- Wooden Table Surface -->
  <path d="M 20 180 L 220 180 L 230 215 L 10 215 Z" fill="#334155" opacity="0.6" />
  <ellipse cx="120" cy="180" rx="100" ry="12" fill="#475569" />

  <!-- BACK PROP: Bamboo mat or coaster -->
  <ellipse cx="120" cy="175" rx="85" ry="18" fill="#1e293b" />
  <ellipse cx="120" cy="173" rx="80" ry="15" fill="#f59e0b" opacity="0.15" />

  <!-- MAIN SCENE: Cooking Pot (Wok style) containing the remaining rice -->
  <!-- Pot base/shadow -->
  <ellipse cx="120" cy="160" rx="65" ry="15" fill="#0f172a" />
  
  <!-- Pot Outer Body -->
  <path d="M 55 130 C 50 165, 190 165, 185 130 C 180 115, 60 115, 55 130 Z" fill="url(#potGrad)" />
  <ellipse cx="120" cy="130" rx="65" ry="12" fill="#c2410c" />

  <!-- Pot Rim -->
  <ellipse cx="120" cy="125" rx="68" ry="14" fill="#fdba74" />
  <!-- Pot Interior (Darkness) -->
  <ellipse cx="120" cy="127" rx="60" ry="10" fill="#431407" />

  <!-- RICE PORTION: 'Cơm còn lại một ít' - A small, cozy mound of white rice shifted to one side -->
  <!-- Rice mound shadow inside pot -->
  <ellipse cx="105" cy="128" rx="32" ry="7" fill="#7c2d12" />
  
  <!-- Rice mound bulk -->
  <path d="M 75 130 C 75 110, 135 110, 135 130 C 135 133, 75 133, 75 130 Z" fill="url(#riceGrad)" />
  
  <!-- Individual rice grain highlights for texture -->
  <circle cx="90" cy="120" r="2.5" fill="#ffffff" />
  <circle cx="100" cy="116" r="3" fill="#ffffff" />
  <circle cx="115" cy="118" r="2.5" fill="#ffffff" />
  <circle cx="105" cy="124" r="3" fill="#ffffff" />
  <circle cx="95" cy="126" r="2.5" fill="#ffffff" />
  <circle cx="122" cy="122" r="2" fill="#ffffff" />
  
  <!-- Chopsticks resting across the pot -->
  <g transform="rotate(-15 120 100)">
    <rect x="40" y="98" width="130" height="4" rx="2" fill="#fbbf24" />
    <rect x="40" y="104" width="130" height="3" rx="1.5" fill="#f59e0b" />
    <circle cx="43" cy="100.5" r="1.5" fill="#78350f" />
    <circle cx="43" cy="105.5" r="1.5" fill="#78350f" />
  </g>

  <!-- Wafting Steam (indicating warm leftover food) -->
  <path d="M 100 110 C 95 90, 115 80, 105 60" stroke="url(#steamGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 125 115 C 130 95, 110 85, 120 65" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- FOREGROUND PROP: A small empty ceramic bowl waiting for the leftovers -->
  <!-- Bowl shadow -->
  <ellipse cx="190" cy="170" rx="22" ry="7" fill="#0f172a" opacity="0.8" />
  <!-- Bowl outer -->
  <path d="M 170 155 C 168 172, 212 172, 210 155 Z" fill="#e2e8f0" />
  <!-- Bowl rim -->
  <ellipse cx="190" cy="155" rx="20" ry="5" fill="#f8fafc" />
  <!-- Bowl interior -->
  <ellipse cx="190" cy="157" rx="17" ry="4" fill="#cbd5e1" />

  <!-- Atmospheric Accent Sparks / Warm Glow particles -->
  <circle cx="70" cy="80" r="2" fill="#fbbf24" opacity="0.6" filter="url(#glow)" />
  <circle cx="160" cy="70" r="3" fill="#f59e0b" opacity="0.8" filter="url(#glow)" />
  <circle cx="190" cy="110" r="1.5" fill="#fb923c" opacity="0.5" />
  <circle cx="50" cy="140" r="2" fill="#38bdf8" opacity="0.4" />
</svg>