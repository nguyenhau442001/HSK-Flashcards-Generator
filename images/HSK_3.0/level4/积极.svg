<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Window Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Plant Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Energy/Spark Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Room -->
  <g id="environment">
    <!-- Accent Wallpaper lines -->
    <path d="M 0,130 L 240,130" stroke="#334155" stroke-width="2" opacity="0.4" />
    
    <!-- Large Round Window showing night-to-dawn energy -->
    <circle cx="180" cy="70" r="45" fill="#0f172a" stroke="#475569" stroke-width="4" />
    <circle cx="180" cy="70" r="41" fill="url(#windowGlow)" />
    <!-- City silhouette in window -->
    <path d="M 145,95 L 145,80 L 155,80 L 155,95 L 165,95 L 165,65 L 175,65 L 175,95 L 190,95 L 190,75 L 200,75 L 200,95 Z" fill="#1e293b" opacity="0.8" />
    <circle cx="195" cy="50" r="6" fill="#fbbf24" filter="url(#glow)" opacity="0.8" />

    <!-- Wall Shelf with props -->
    <rect x="25" y="45" width="70" height="6" rx="3" fill="#475569" />
    <!-- Books on shelf -->
    <path d="M 35,45 L 35,25 L 43,25 L 43,45 Z" fill="#ec4899" />
    <path d="M 44,45 L 44,22 L 53,22 L 53,45 Z" fill="#38bdf8" />
    <path d="M 54,45 L 54,28 L 60,28 L 60,45 Z" fill="#10b981" />
  </g>

  <!-- Desk Surface -->
  <path d="M 0,165 L 240,165 L 240,240 L 0,240 Z" fill="url(#deskGrad)" />
  <!-- Desk edge highlight -->
  <rect x="0" y="162" width="240" height="4" rx="2" fill="#64748b" opacity="0.6" />

  <!-- Desk Props: Plant (Representing growth/positivity) -->
  <g id="plant" transform="translate(25, 125)">
    <path d="M 12,37 Q 10,20 20,5 Q 15,22 1,30 Z" fill="#10b981" />
    <path d="M 15,37 Q 25,18 35,10 Q 25,22 15,37 Z" fill="#34d399" />
    <path d="M 8,37 Q -2,15 2,5 Q 5,20 12,37 Z" fill="#059669" />
    <path d="M 6,32 Q 20,25 28,33" fill="none" stroke="#065f46" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 5,30 C 5,25 15,25 18,37 C 18,37 5,37 5,30 Z" fill="url(#potGrad)" />
    <ellipse cx="11.5" cy="31" rx="6.5" ry="2" fill="#7c2d12" />
  </g>

  <!-- Desk Props: Coffee Mug with energetic steam -->
  <g id="mug" transform="translate(195, 135)">
    <rect x="4" y="10" width="16" height="18" rx="3" fill="#f8fafc" />
    <path d="M 20,13 C 24,13 24,23 20,23" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <!-- Coffee liquid -->
    <ellipse cx="12" cy="12" rx="6" ry="2" fill="#78350f" />
    <!-- Steam swirls (active/energetic vibe) -->
    <path d="M 9,5 Q 6,0 12,-4 Q 18,-8 15,-13" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" filter="url(#softGlow)" />
  </g>

  <!-- Main Subject: Enthusiastic Character Working Proactively -->
  <g id="character">
    <!-- Chair Back -->
    <path d="M 85,170 C 85,125 125,125 125,170 Z" fill="#334155" />

    <!-- Torso / Hoodie (Energetic Blue/Teal) -->
    <path d="M 75,175 C 75,145 90,135 105,135 C 120,135 135,145 135,175 L 145,210 L 65,210 Z" fill="#0ea5e9" />
    <path d="M 105,135 L 105,175" stroke="#0284c7" stroke-width="2" />
    <!-- Hoodie Strings -->
    <path d="M 98,145 Q 105,155 102,165" fill="none" stroke="#e0f2fe" stroke-width="1.5" />
    <path d="M 112,145 Q 105,155 108,165" fill="none" stroke="#e0f2fe" stroke-width="1.5" />

    <!-- Head and Neck -->
    <path d="M 97,130 L 113,130 L 115,140 L 95,140 Z" fill="#fdba74" />
    <circle cx="105" cy="115" r="20" fill="#fed7aa" />

    <!-- Hair (Dynamic, swept up/forward to show action/focus) -->
    <path d="M 87,110 C 85,95 100,90 115,98 C 125,103 125,115 123,122 C 115,115 100,118 90,125 C 88,120 87,115 87,110 Z" fill="#1e293b" />
    <path d="M 110,95 C 118,92 128,98 132,105 C 128,102 120,98 110,95 Z" fill="#334155" />

    <!-- Face Expression (Determined, smiling, proactive) -->
    <!-- Confident Eyes -->
    <path d="M 98,113 Q 102,110 106,113" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 110,113 Q 114,110 118,113" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Cheeks (Excitement blush) -->
    <circle cx="99" cy="118" r="3" fill="#fb7185" opacity="0.5" />
    <circle cx="117" cy="118" r="3" fill="#fb7185" opacity="0.5" />
    <!-- Confident Smile -->
    <path d="M 104,121 Q 108,126 112,121" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Raised Arms in Celebration/Action (Tích cực - Proactive/Active/Positive energy) -->
    <!-- Left Arm -->
    <path d="M 78,145 L 58,125 L 68,115 L 86,138 Z" fill="#0284c7" />
    <circle cx="63" cy="118" r="6" fill="#fed7aa" />
    
    <!-- Right Arm (Punching the air / highly motivated) -->
    <path d="M 132,145 L 152,125 L 162,135 L 140,158 Z" fill="#0284c7" />
    <circle cx="157" cy="130" r="6" fill="#fed7aa" />

    <!-- Laptop / Workspace in Front -->
    <g id="laptop" transform="translate(75, 150)">
      <!-- Laptop Base -->
      <path d="M -15,25 L 75,25 L 60,45 L 0,45 Z" fill="#94a3b8" />
      <path d="M 22,25 L 38,25 L 37,45 L 23,45 Z" fill="#cbd5e1" />
      <!-- Laptop Screen -->
      <path d="M -10,25 L 10,-10 L 50,-10 L 70,25 Z" fill="#475569" />
      <path d="M -6,22 L 13,-6 L 47,-6 L 66,22 Z" fill="#0f172a" />
      <!-- Screen Code/Data Visuals (Bright positive UI lines) -->
      <path d="M -1,15 L 15,15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <path d="M 5,10 L 28,10" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
      <path d="M 3,5 L 20,5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
      <path d="M 25,15 L 45,15" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
      <circle cx="55" cy="5" r="4" fill="#34d399" filter="url(#softGlow)" />
    </g>
  </g>

  <!-- Floating Dynamic Energy Elements (Representing 'Tích cực' - proactive, active, glowing progress) -->
  <g id="energy-sparks">
    <!-- Glowing Star 1 (Top Left) -->
    <path d="M 50,70 L 53,78 L 61,81 L 53,84 L 50,92 L 47,84 L 39,81 L 47,78 Z" fill="url(#energyGrad)" filter="url(#glow)" />
    
    <!-- Glowing Star 2 (Top Right near character's raised hand) -->
    <path d="M 165,85 L 167,90 L 172,92 L 167,94 L 165,99 L 163,94 L 158,92 L 163,90 Z" fill="#38bdf8" filter="url(#glow)" />

    <!-- Dynamic Upward Energy Trail / Swoosh -->
    <path d="M 40,140 Q 30,110 50,85" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6" filter="url(#softGlow)" />
    <circle cx="43" cy="115" r="4" fill="#fb923c" filter="url(#glow)" />
    <circle cx="34" cy="130" r="2.5" fill="#fef08a" />

    <!-- Upward Action Arrow / Spark constellation floating near head -->
    <g transform="translate(110, 50)">
      <circle cx="0" cy="10" r="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
      <!-- Arrow up icon representing upward momentum/positivity -->
      <path d="M 0,16 L 0,4 M -4,8 L 0,4 L 4,8" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <!-- Connecting energy dots -->
    <circle cx="135" cy="70" r="3" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="90" cy="75" r="2" fill="#10b981" filter="url(#glow)" />
  </g>

  <!-- Frame / Border Vignette Overlay for polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>