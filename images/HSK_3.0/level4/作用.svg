<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 190 C 80 180, 160 180, 240 190 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Person (Jogger) -->
  <g transform="translate(60, 80)">
    <circle cx="40" cy="30" r="12" fill="#fbbf24"/>
    <path d="M35 50 L30 90 M45 50 L50 90" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <path d="M40 42 L25 70 M40 42 L55 70" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="40" cy="42" rx="10" ry="15" fill="#f8fafc"/>
  </g>

  <!-- Effect/Action lines (Representing 'tác dụng' - positive impact) -->
  <g stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6">
    <path d="M130 120 Q 160 80, 200 100"/>
    <path d="M140 140 Q 180 110, 220 130"/>
    <path d="M120 100 Q 150 60, 190 80"/>
  </g>

  <!-- Glowing Aura/Energy -->
  <circle cx="100" cy="120" r="30" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="120" r="45" fill="none" stroke="#fb923c" stroke-width="1" opacity="0.2"/>

  <!-- Environment Props -->
  <rect x="180" y="150" width="20" height="40" rx="4" fill="#38bdf8"/>
  <rect x="210" y="160" width="15" height="30" rx="4" fill="#38bdf8"/>
  <circle cx="30" cy="180" r="8" fill="#ec4899"/>
</svg>