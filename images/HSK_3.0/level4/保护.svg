<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Canopy Gradient -->
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shield/Energy Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Background Elements: Distant Hills & Trees -->
  <path d="M0 160 Q60 130 120 155 T240 145 L240 240 L0 240 Z" fill="#09203f" />
  <path d="M0 180 Q80 160 160 175 T240 170 L240 240 L0 240 Z" fill="#0f2942" />

  <!-- Moon / Ambient Light -->
  <circle cx="195" cy="55" r="18" fill="#fbbf24" opacity="0.15" filter="url(#glow)" />
  <circle cx="195" cy="55" r="10" fill="#fef08a" opacity="0.4" />

  <!-- Ground Plane (Forest Floor) -->
  <path d="M0 200 Q120 185 240 200 L240 240 L0 240 Z" fill="#064e3b" />

  <!-- Sprout to be Protected -->
  <g transform="translate(120, 195)">
    <!-- Soil mound -->
    <ellipse cx="0" cy="10" rx="18" ry="6" fill="#022c22" />
    <!-- Stem -->
    <path d="M0 8 Q -2 -5 0 -15" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Leaves -->
    <path d="M0 -10 C -8 -15 -10 -5 0 -2 C 10 -5 8 -15 0 -10 Z" fill="#10b981" filter="url(#shadow)" />
  </g>

  <!-- Protective Energy Dome / Shield -->
  <ellipse cx="120" cy="185" rx="55" ry="35" fill="url(#shieldGrad)" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#glow)" />

  <!-- Background Forest Elements (Outside Shield) -->
  <g fill="#065f46" opacity="0.8">
    <path d="M30 190 L45 150 L60 190 Z" />
    <path d="M190 195 L205 155 L220 195 Z" />
  </g>

  <!-- Main Character: Environmental Protector / Guardian -->
  <g transform="translate(120, 155)" filter="url(#shadow)">
    <!-- Character Shadow on Ground -->
    <ellipse cx="0" cy="45" rx="28" ry="8" fill="#02130e" opacity="0.5" />

    <!-- Legs/Pants (Crouched stance) -->
    <path d="M-10 30 L-15 42 L-6 44 L-2 30 Z" fill="#0f172a" />
    <path d="M10 30 L15 42 L6 44 L2 30 Z" fill="#0f172a" />
    <!-- Boots -->
    <path d="M-20 42 L-10 42 L-8 46 L-22 46 Z" fill="#78350f" />
    <path d="M20 42 L10 42 L8 46 L22 46 Z" fill="#78350f" />

    <!-- Torso / Hoodie -->
    <path d="M-16 10 C-18 0 -12 -12 0 -12 C12 -12 18 0 16 10 L18 32 C18 35 14 36 10 34 L0 30 L-10 34 C-14 36 -18 35 -18 32 Z" fill="#fb923c" />
    <!-- Hoodie Pocket / Detail -->
    <path d="M-8 22 L8 22 L6 30 L-6 30 Z" fill="#ea580c" opacity="0.6" />

    <!-- Head & Hair -->
    <circle cx="0" cy="-22" r="13" fill="#fde047" />
    <!-- Hair / Cap -->
    <path d="M-13 -24 C-15 -32 13 -32 13 -24 C13 -20 10 -18 0 -18 C-10 -18 -13 -20 -13 -24 Z" fill="#451a03" />

    <!-- Arms Action: Dynamic Shielding Posture -->
    <!-- Left Arm (Extended forward defensively) -->
    <path d="M-14 0 C-24 5 -35 15 -42 12" stroke="#fb923c" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="-42" cy="12" r="4" fill="#fde047" />

    <!-- Right Arm (Extended back/balancing) -->
    <path d="M14 0 C24 8 32 18 38 22" stroke="#fb923c" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="38" cy="22" r="4" fill="#fde047" />
  </g>

  <!-- Foreground Forest Elements (Frame & Depth) -->
  <!-- Left Tree Trunk & Foliage -->
  <path d="M-10 240 L10 240 L15 120 L-5 120 Z" fill="#78350f" />
  <circle cx="5" cy="110" r="35" fill="url(#canopyGrad)" filter="url(#shadow)" />
  <circle cx="-15" cy="130" r="25" fill="#059669" />

  <!-- Right Tree Trunk & Foliage -->
  <path d="M230 240 L250 240 L245 130 L225 130 Z" fill="#78350f" />
  <circle cx="235" cy="120" r="30" fill="url(#canopyGrad)" filter="url(#shadow)" />

  <!-- Nature Details: Floating glowing leaves/sparkles representing protected life -->
  <g fill="#34d399">
    <path d="M80 130 Q85 125 90 130 Q85 135 80 130 Z" transform="rotate(15 85 130)" opacity="0.8" />
    <path d="M155 115 Q160 110 165 115 Q160 120 155 115 Z" transform="rotate(-30 160 115)" opacity="0.8" />
    <path d="M95 90 Q98 86 101 90 Q98 94 95 90 Z" transform="rotate(45 98 90)" opacity="0.6" />
    <circle cx="135" cy="100" r="2" fill="#fef08a" opacity="0.9" />
    <circle cx="75" cy="160" r="1.5" fill="#fef08a" opacity="0.7" />
    <circle cx="170" cy="150" r="2" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Ground Foliage / Grass Tufts -->
  <path d="M20 200 L25 188 L30 200 Z" fill="#34d399" />
  <path d="M35 200 L40 190 L45 200 Z" fill="#10b981" />
  <path d="M205 200 L210 187 L215 200 Z" fill="#34d399" />
  <path d="M185 200 L190 191 L195 200 Z" fill="#10b981" />

  <!-- Vignette / Border Ring for polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>