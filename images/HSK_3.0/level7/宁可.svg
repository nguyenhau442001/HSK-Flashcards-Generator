<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Active Choice -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Cool Blue Glow for Rejected Choice -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting / Glows -->
  <circle cx="170" cy="130" r="70" fill="url(#amberGlow)" />
  <circle cx="70" cy="130" r="70" fill="url(#blueGlow)" />

  <!-- Ground Plane / Sidewalk -->
  <path d="M 0 190 Q 120 170 240 190 L 240 240 L 0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" />

  <!-- SCENE LEFT: The Rejected Option (Crowded, Stalled Bus/Car) -->
  <g id="rejected-option" filter="url(#shadow)">
    <!-- Traffic Jam Ambient Glow (Red/Orange warning) -->
    <circle cx="75" cy="130" r="30" fill="#ef4444" opacity="0.1" />

    <!-- Isometric-ish Car Body -->
    <path d="M 45 145 L 95 135 L 115 160 L 45 160 Z" fill="#475569" />
    <path d="M 45 125 L 95 115 L 95 135 L 45 145 Z" fill="#64748b" />
    <path d="M 95 115 L 110 125 L 115 160 L 95 135 Z" fill="#334155" />
    
    <!-- Windshield & Windows -->
    <path d="M 55 128 L 85 122 L 88 135 L 52 140 Z" fill="#94a3b8" opacity="0.6" />
    
    <!-- Exhaust / Red Stop Light (Frustration) -->
    <circle cx="48" cy="148" r="4" fill="#ef4444" />
    <path d="M 38 145 Q 32 143 28 140" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 36 153 Q 30 152 26 150" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Wheels -->
    <circle cx="60" cy="160" r="10" fill="#0f172a" />
    <circle cx="60" cy="160" r="4" fill="#64748b" />
    <circle cx="102" cy="152" r="9" fill="#0f172a" />
    <circle cx="102" cy="152" r="3" fill="#64748b" />

    <!-- Red "X" Marker indicating "Rather NOT this" -->
    <g transform="translate(75, 115)">
      <circle cx="0" cy="0" r="12" fill="#ef4444" opacity="0.9" />
      <path d="M -5 -5 L 5 5 M 5 -5 L -5 5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>


  <!-- SCENE RIGHT: The Chosen Active Option (Energetic Walking / Fresh Air) -->
  <g id="chosen-option" filter="url(#shadow)">
    <!-- Motion Lines / Speed Lines -->
    <path d="M 130 110 L 150 110" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 125 120 L 145 120" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Walking Character (Dynamic Poses) -->
    <!-- Head & Hat/Hair -->
    <circle cx="175" cy="95" r="10" fill="#f59e0b" />
    <path d="M 167 92 Q 175 83 183 90" fill="#d97706" />

    <!-- Torso (Active lean forward) -->
    <path d="M 170 105 L 182 130 L 170 135 Z" fill="#38bdf8" />

    <!-- Backpack -->
    <path d="M 183 108 L 192 115 L 187 130 L 178 123 Z" fill="#ec4899" />

    <!-- Arms (Swinging) -->
    <path d="M 175 110 L 160 125" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
    <path d="M 178 112 L 190 120" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />

    <!-- Legs (Stride) -->
    <path d="M 172 133 L 155 155" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <path d="M 172 133 L 195 150" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <!-- Shoes -->
    <ellipse cx="151" cy="158" rx="5" ry="3" fill="#ffffff" />
    <ellipse cx="199" cy="153" rx="5" ry="3" fill="#ffffff" />

    <!-- Green Checkmark indicating "RATHER THIS" -->
    <g transform="translate(180, 75)">
      <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.95" />
      <path d="M -5 -1 L -1 4 L 6 -5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>


  <!-- Environmental Details: Trees / Streetlight to establish real-world scale -->
  <!-- Stylized Modern Streetlamp -->
  <path d="M 215 190 L 215 110 L 225 100" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 221 100 L 229 105" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
  <circle cx="225" cy="103" r="12" fill="#fbbf24" opacity="0.2" />

  <!-- Small Bush / Foliage Left -->
  <path d="M 25 190 Q 20 175 35 170 Q 45 165 55 175 Q 65 170 70 190 Z" fill="#059669" opacity="0.8" />
  <path d="M 35 190 Q 30 178 42 175 Q 50 180 55 190 Z" fill="#34d399" opacity="0.6" />

  <!-- Decision / Weighing Scale Indicator in the Sky (Subtle metaphor for preference/choice) -->
  <g transform="translate(120, 45)" opacity="0.85">
    <!-- Beam -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="4" fill="#cbd5e1" />
    <path d="M 0 0 L 0 -10" stroke="#94a3b8" stroke-width="2" />

    <!-- Left Pan (Car - tilted up/light/rejected) -->
    <path d="M -30 0 L -40 20 L -20 20 Z" fill="none" stroke="#64748b" stroke-width="2" />
    <line x1="-30" y1="0" x2="-40" y2="20" stroke="#64748b" stroke-width="1.5" />
    <line x1="-30" y1="0" x2="-20" y2="20" stroke="#64748b" stroke-width="1.5" />
    <circle cx="-30" cy="20" r="6" fill="#ef4444" opacity="0.8" />

    <!-- Right Pan (Walking figure - tilted down/heavy preference/chosen) -->
    <path d="M 30 0 L 15 30 L 45 30 Z" fill="none" stroke="#fbbf24" stroke-width="2" />
    <line x1="30" y1="0" x2="15" y2="30" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="30" y1="0" x2="45" y2="30" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="30" cy="30" r="8" fill="#10b981" />
  </g>

</svg>