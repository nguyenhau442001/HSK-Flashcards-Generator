<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Card/License Glow -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    
    <!-- Steering Wheel Gradient -->
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT / CONTEXT: Driver's Seat & Dashboard -->
  <!-- Car Interior Background / Window -->
  <path d="M40,90 L90,50 L160,50 L200,90 Z" fill="#334155" opacity="0.4" />
  <!-- City Lights outside window (abstract warm blobs) -->
  <circle cx="95" cy="70" r="4" fill="#fbbf24" opacity="0.6" />
  <circle cx="115" cy="65" r="3" fill="#f43f5e" opacity="0.6" />
  <circle cx="140" cy="72" r="5" fill="#34d399" opacity="0.6" />

  <!-- Dashboard -->
  <path d="M10,170 C60,150 180,150 230,170 L240,220 L0,220 Z" fill="#0f172a" />
  <path d="M20,168 C70,152 170,152 220,168" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" />
  <!-- Dashboard gauges/vents -->
  <rect x="35" y="175" width="25" height="10" rx="3" fill="#1e293b" />
  <circle cx="195" cy="180" r="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <circle cx="195" cy="180" r="8" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10 5" opacity="0.8" />

  <!-- Steering Wheel (partially visible below/behind) -->
  <path d="M85,210 C85,185 100,175 120,175 C140,175 155,185 155,210" stroke="url(#wheelGrad)" stroke-width="10" stroke-linecap="round" fill="none" />
  
  <!-- CHARACTER: Happy Driver / Newly Licensed Person -->
  <!-- Torso & Jacket -->
  <path d="M75,220 L75,185 C75,165 90,150 120,150 C150,150 165,165 165,185 L165,220 Z" fill="url(#jacketGrad)" />
  <!-- Inner Shirt / Collar -->
  <path d="M105,150 L120,170 L135,150 Z" fill="#f8fafc" />
  <!-- Jacket zipper/details -->
  <line x1="120" y1="170" x2="120" y2="220" stroke="#0284c7" stroke-width="2" />

  <!-- Neck -->
  <rect x="108" y="130" width="24" height="25" rx="8" fill="#fbcfe8" />

  <!-- Head & Face -->
  <circle cx="120" cy="115" r="26" fill="#fbcfe8" />
  
  <!-- Hair (Stylish short dark hair) -->
  <path d="M94,115 C94,95 105,90 120,90 C135,90 146,95 146,115 C146,120 144,115 142,105 C138,96 130,94 120,94 C110,94 102,96 98,105 C96,115 94,120 94,115 Z" fill="#1e293b" />
  
  <!-- Facial Expression: Big Happy Smile & Sparkling Eyes -->
  <!-- Closed Happy Eyes (Arcs) -->
  <path d="M107,112 C110,116 115,116 118,112" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M122,112 C125,116 130,116 133,112" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Rosy Cheeks -->
  <circle cx="104" cy="120" r="5" fill="#f43f5e" opacity="0.3" />
  <circle cx="136" cy="120" r="5" fill="#f43f5e" opacity="0.3" />
  
  <!-- Big Grin -->
  <path d="M112,122 C115,128 125,128 128,122" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="#fda4af" />

  <!-- HANDS & THE MAIN OBJECT: DRIVER'S LICENSE ("执照") -->
  <!-- Left Hand holding bottom of license -->
  <path d="M90,165 C85,160 80,165 85,175 C88,180 95,182 100,178 Z" fill="#fbcfe8" />
  
  <!-- Right Hand supporting side of license -->
  <path d="M150,165 C155,160 160,165 155,175 C152,180 145,182 140,178 Z" fill="#fbcfe8" />

  <!-- THE LICENSE / PERMIT CARD (Prominently held in center, tilted cheerfully) -->
  <g transform="translate(120, 140) rotate(-8)">
    <!-- Card Base -->
    <rect x="-35" y="-35" width="70" height="46" rx="6" fill="url(#cardGrad)" stroke="#fff" stroke-width="2" />
    
    <!-- Card Inner Elements (Abstract graphics mimicking ID / License layout without text) -->
    <!-- Mini Photo Placeholder -->
    <rect x="-28" y="-27" width="16" height="20" rx="3" fill="#cbd5e1" />
    <circle cx="-20" cy="-20" r="4" fill="#64748b" />
    <path d="M-26,-12 C-26,-15 -24,-15 -20,-15 C-16,-15 -14,-15 -14,-12 Z" fill="#64748b" />

    <!-- Details / Lines representing text & fields -->
    <rect x="-8" y="-25" width="28" height="4" rx="2" fill="#b45309" opacity="0.8" />
    <rect x="-8" y="-17" width="20" height="3" rx="1.5" fill="#78350f" opacity="0.6" />
    <rect x="-8" y="-10" width="24" height="3" rx="1.5" fill="#78350f" opacity="0.6" />

    <!-- Car Symbol / Emblem on License (Indicating Driving License) -->
    <path d="M-22,3 L-18,-2 L-6,-2 L-2,3 Z" fill="#1e293b" />
    <circle cx="-16" cy="4" r="2.5" fill="#38bdf8" />
    <circle cx="-8" cy="4" r="2.5" fill="#38bdf8" />
    
    <!-- Checkmark Badge on License (Success / Acquired) -->
    <circle cx="20" cy="5" r="7" fill="#10b981" />
    <path d="M17,5 L19,7 L24,2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Sparkles / Celebration Effects around the License -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M75,100 L77,106 L83,108 L77,110 L75,116 L73,110 L67,108 L73,106 Z" />
    <!-- Star 2 -->
    <path d="M165,90 L166.5,94.5 L171,96 L166.5,97.5 L165,102 L163.5,97.5 L159,96 L163.5,94.5 Z" />
    <!-- Star 3 (Cyan accent) -->
    <path d="M150,125 L151,128 L154,129 L151,130 L150,133 L149,130 L146,129 L149,128 Z" fill="#38bdf8" />
  </g>
  
  <!-- Glowing Floating Confetti / Joy Bubbles -->
  <circle cx="95" cy="88" r="3" fill="#f43f5e" opacity="0.8" />
  <circle cx="145" cy="80" r="4" fill="#10b981" opacity="0.8" />
  <circle cx="170" cy="120" r="2.5" fill="#fb923c" opacity="0.8" />
  <circle cx="70" cy="135" r="3.5" fill="#38bdf8" opacity="0.8" />
</svg>