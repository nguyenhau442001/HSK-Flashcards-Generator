<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Pants Gradient -->
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Environment: Urban/Studio Room Details -->
  <!-- Ambient background elements: geometric window frame / neon strip -->
  <path d="M 30,50 L 90,30 L 90,210 L 30,210 Z" fill="#ffffff" fill-opacity="0.02"/>
  <line x1="180" y1="40" x2="180" y2="200" stroke="#ffffff" stroke-width="2" stroke-opacity="0.05" stroke-dasharray="4 8"/>
  <circle cx="195" cy="70" r="18" fill="#f59e0b" fill-opacity="0.15"/>
  <path d="M 190,65 L 200,75 M 200,65 L 190,75" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Floor Plane -->
  <ellipse cx="120" cy="215" rx="90" ry="15" fill="#020617" fill-opacity="0.6"/>
  
  <!-- Motion Action Lines (Background context for the flick/whip motion) -->
  <path d="M 125,55 C 160,40 185,60 195,95" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" stroke-dasharray="2 6"/>
  <path d="M 130,65 C 165,55 185,75 190,105" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.3"/>

  <!-- CHARACTER -->
  <g filter="url(#shadow)">
    <!-- Back Foot & Leg -->
    <path d="M 100,175 L 90,210 L 115,212 L 122,185 Z" fill="url(#pantsGrad)"/>
    <ellipse cx="106" cy="213" rx="14" ry="5" fill="#0f172a"/>
    <!-- Sneaker accent -->
    <path d="M 94,211 L 114,213" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Front Foot & Leg -->
    <path d="M 135,175 L 145,210 L 120,212 L 125,185 Z" fill="url(#pantsGrad)"/>
    <ellipse cx="132" cy="213" rx="14" ry="5" fill="#0f172a"/>
    <path d="M 122,211 L 140,213" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Torso (Dynamic Twist) -->
    <path d="M 100,110 L 140,115 L 148,175 L 92,175 Z" fill="url(#jacketGrad)" rx="10"/>
    <!-- Jacket details / zipper -->
    <line x1="120" y1="113" x2="124" y2="175" stroke="#ffe4e6" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M 100,110 L 120,130 L 140,115" fill="none" stroke="#ffe4e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>

    <!-- Head & Neck -->
    <path d="M 112,100 L 128,100 L 132,115 L 108,115 Z" fill="url(#skin)"/>
    <!-- Head Circle, tilted backwards/sideways for the head-shake/hair-flick action -->
    <circle cx="120" cy="82" r="22" fill="url(#skin)"/>
    
    <!-- Face Features (Confident, eyes closed/focused in motion) -->
    <!-- Eyebrow dynamic -->
    <path d="M 112,74 L 122,76" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M 128,74 L 136,78" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes closed / happy slashes -->
    <path d="M 113,80 Q 117,84 121,80" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M 127,81 Q 131,85 135,81" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Confident smile -->
    <path d="M 118,92 Q 123,97 128,92" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheek blush -->
    <ellipse cx="112" cy="87" rx="3" ry="1.5" fill="#f43f5e" fill-opacity="0.3"/>

    <!-- Arms -->
    <!-- Left Arm (Balanced out back) -->
    <path d="M 100,115 L 80,140 L 90,150" fill="none" stroke="url(#jacketGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="150" r="5" fill="url(#skin)"/>

    <!-- Right Arm (Raised / Cool pose) -->
    <path d="M 140,118 L 165,130 L 155,150" fill="none" stroke="url(#jacketGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="155" cy="150" r="5" fill="url(#skin)"/>

    <!-- HAIR FLICK ACTION (The core of "甩头发") -->
    <!-- Base Hair behind head -->
    <path d="M 98,85 C 95,65 110,55 125,58 Z" fill="url(#hairGrad)"/>
    
    <!-- Dynamic Flowing Hair Strands whipping through the air -->
    <!-- Main dynamic whip curve -->
    <path d="M 130,68 C 160,55 185,75 205,105 C 190,115 165,100 145,90" fill="url(#hairGrad)"/>
    <!-- Secondary hair strands for motion depth -->
    <path d="M 135,62 C 170,45 200,65 220,90 C 205,105 180,85 150,75" fill="#38bdf8" opacity="0.8"/>
    <path d="M 125,58 C 155,40 180,50 195,70 C 185,80 160,65 135,62" fill="#7dd3fc" opacity="0.9"/>
    
    <!-- Sparkles / Water droplets flying off the hair (emphasizing the 'flick' energy) -->
    <circle cx="210" cy="80" r="3" fill="#38bdf8"/>
    <circle cx="222" cy="98" r="2" fill="#bae6fd"/>
    <circle cx="195" cy="60" r="2.5" fill="#38bdf8"/>
    <path d="M 213,75 L 217,79" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 185,50 L 188,53" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground decorative elements for depth (Out-of-focus elements) -->
  <circle cx="25" cy="190" r="6" fill="#38bdf8" fill-opacity="0.2"/>
  <circle cx="215" cy="150" r="4" fill="#f59e0b" fill-opacity="0.2"/>
  <circle cx="45" cy="80" r="3" fill="#ffffff" fill-opacity="0.1"/>
</svg>