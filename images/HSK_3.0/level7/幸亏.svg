<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Reminder/Realization -->
    <radialGradient id="glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 (Friend reminding) Skin/Clothes -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 (Relieved person) Skin/Clothes -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#glow)"/>

  <!-- ENVIRONMENT / INTERIOR CONTEXT -->
  <!-- Back Wall & Window Frame -->
  <path d="M140 30 H210 V110 H140 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Night cityscape outside window -->
  <rect x="145" y="40" width="12" height="60" fill="#334155" opacity="0.4"/>
  <rect x="162" y="55" width="15" height="45" fill="#475569" opacity="0.4"/>
  <rect x="182" y="35" width="10" height="65" fill="#334155" opacity="0.4"/>
  <circle cx="151" cy="45" r="1" fill="#fde047"/>
  <circle cx="187" cy="42" r="1" fill="#fde047"/>

  <!-- Office / Living Room Desk -->
  <path d="M20 180 H220 V195 H20 Z" fill="#334155"/>
  <path d="M30 195 H210 V205 H30 Z" fill="#1e293b"/>
  <!-- Desk Props -->
  <!-- Laptop open -->
  <path d="M60 165 L80 165 L85 180 L55 180 Z" fill="#64748b"/>
  <path d="M50 180 H90 V183 H50 Z" fill="#94a3b8"/>
  <rect x="62" y="168" width="16" height="10" rx="1" fill="#38bdf8" opacity="0.6"/>
  
  <!-- Coffee Cup with steam -->
  <rect x="105" y="168" width="12" height="14" rx="2" fill="#cbd5e1"/>
  <path d="M117 171 C121 171, 121 179, 117 179" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <path d="M109 162 C110 159, 108 156, 111 153" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Calendar / Clock on wall -->
  <rect x="35" y="35" width="28" height="32" rx="4" fill="#cbd5e1"/>
  <rect x="39" y="45" width="20" height="18" fill="#ef4444"/>
  <circle cx="49" cy="32" r="2" fill="#64748b"/>

  <!-- CHARACTER 1: FRIEND REMINDING (Left) -->
  <g transform="translate(10, 0)">
    <!-- Body / Torso -->
    <path d="M 65 140 Q 65 120 85 120 Q 105 120 105 140 L 105 180 L 65 180 Z" fill="url(#shirt1)"/>
    <!-- Arm gesturing / pointing towards head/watch/task -->
    <path d="M 85 125 C 105 120, 115 135, 110 145 C 105 155, 95 140, 95 140" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <!-- Head & Hair -->
    <circle cx="85" cy="95" r="18" fill="#fbcfe8"/> <!-- face base -->
    <path d="M 68 95 C 68 75, 102 75, 102 95 C 95 90, 75 90, 68 95 Z" fill="#334155"/> <!-- hair -->
    <!-- Friendly smiling expression -->
    <circle cx="79" cy="93" r="2" fill="#1e293b"/>
    <circle cx="91" cy="93" r="2" fill="#1e293b"/>
    <path d="M 82 101 Q 85 105 88 101" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Speech / Reminder Accent (Visual metaphor: bulb/thought bubble coming from friend) -->
    <path d="M 105 85 C 115 80, 125 90, 120 100 C 115 105, 110 100, 105 105" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="122" cy="88" r="3" fill="#f59e0b"/>
  </g>

  <!-- CHARACTER 2: RELIEVED PERSON (Right) -->
  <g transform="translate(60, 0)">
    <!-- Body / Torso -->
    <path d="M 65 140 Q 65 115 90 115 Q 115 115 115 140 L 115 180 L 65 180 Z" fill="url(#shirt2)"/>
    <!-- Arm in realization (hand on forehead) -->
    <path d="M 75 125 C 70 105, 80 90, 95 95" fill="none" stroke="#059669" stroke-width="9" stroke-linecap="round"/>
    <!-- Head & Hair -->
    <circle cx="90" cy="95" r="19" fill="#fed7aa"/> <!-- face base -->
    <path d="M 73 95 C 73 75, 107 75, 107 95 C 100 88, 80 88, 73 95 Z" fill="#b45309"/> <!-- hair -->
    <!-- Relieved / realization expression (sweat drop of "whew, close call", eyes closed happily) -->
    <path d="M 83 94 Q 87 97 91 94" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 97 94 Q 101 97 105 94" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 91 103 Q 94 107 97 103" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Relief Sweat Drop -->
    <path d="M 112 88 C 115 92, 115 96, 112 96 C 109 96, 109 92, 112 88 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- FOREGROUND / ATMOSPHERE ACCENTS -->
  <!-- Floating Sparkles of 'May Mạc' / Realization Moment -->
  <path d="M 110 50 L 113 58 L 121 61 L 113 64 L 110 72 L 107 64 L 99 61 L 107 58 Z" fill="#fbbf24"/>
  <path d="M 45 90 L 47 95 L 52 97 L 47 99 L 45 104 L 43 99 L 38 97 L 43 95 Z" fill="#fbbf24" opacity="0.6"/>

</svg>