<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Table -->
  <path d="M20 180 L220 180 L230 210 L10 210 Z" fill="#334155"/>
  <rect x="20" y="180" width="200" height="4" fill="#475569"/>

  <!-- Victim (Right Side) -->
  <g transform="translate(150, 100)">
    <!-- Body -->
    <path d="M20 80 Q40 80 45 40 L15 40 Q20 80 20 80" fill="#64748b"/>
    <!-- Head -->
    <circle cx="30" cy="25" r="12" fill="#fde68a"/>
    <!-- Sad Face -->
    <path d="M27 28 Q30 32 33 28" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="26" cy="23" r="1" fill="#1e293b"/>
    <circle cx="34" cy="23" r="1" fill="#1e293b"/>
    <!-- Empty Plate -->
    <ellipse cx="30" cy="78" rx="25" ry="6" fill="#f8fafc" opacity="0.9"/>
  </g>

  <!-- Selfish Person (Left Side) -->
  <g transform="translate(40, 85)">
    <!-- Body -->
    <path d="M10 95 Q30 95 60 50 L20 40 Q0 80 10 95" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="45" cy="25" r="14" fill="#fde68a"/>
    <!-- Greedy Face -->
    <path d="M48 28 Q52 30 55 26" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="48" cy="22" rx="1.5" ry="2" fill="#1e293b"/>
    <ellipse cx="56" cy="22" rx="1.5" ry="2" fill="#1e293b"/>
    
    <!-- Hoarded Food Pile -->
    <ellipse cx="60" cy="92" rx="45" ry="12" fill="#f8fafc"/>
    <!-- Food Items -->
    <path d="M35 85 Q45 65 60 85" fill="#fb923c"/> <!-- Chicken/Meat -->
    <path d="M55 80 Q65 60 80 80" fill="#fb923c"/>
    <circle cx="45" cy="88" r="6" fill="#10b981"/> <!-- Veggies -->
    <circle cx="55" cy="85" r="5" fill="#10b981"/>
    <circle cx="65" cy="88" r="7" fill="#f59e0b"/>
    <circle cx="75" cy="84" r="5" fill="#f59e0b"/>
    
    <!-- Arms Hoarding the Food -->
    <path d="M25 55 Q50 60 85 85" stroke="#fde68a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M35 65 Q60 70 95 90" stroke="#fde68a" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Extra Bowl being pulled away -->
  <g transform="translate(105, 165)">
    <path d="M0 0 Q15 25 30 0 Z" fill="#ec4899"/>
    <path d="M5 5 Q15 15 25 5" fill="#fbbf24"/>
  </g>
  
  <!-- Steam lines -->
  <g stroke="#f8fafc" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M80 140 Q85 130 80 120"/>
    <path d="M100 145 Q105 135 100 125"/>
    <path d="M120 150 Q125 140 120 130"/>
  </g>

  <!-- Ambient Light -->
  <circle cx="120" cy="40" r="80" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>