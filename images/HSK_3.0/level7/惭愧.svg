<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Shadow/Floor -->
  <ellipse cx="120" cy="210" rx="80" ry="15" fill="#0f172a" opacity="0.4"/>

  <!-- Character Body -->
  <g transform="translate(60, 60)">
    <!-- Shoulders hunched -->
    <path d="M40 80 Q 60 70 80 80 L 100 140 L 20 140 Z" fill="#334155"/>
    <!-- Neck -->
    <rect x="50" y="60" width="20" height="20" fill="#fde68a"/>
    <!-- Head -->
    <circle cx="60" cy="50" r="35" fill="#fde68a"/>
    
    <!-- Face: Shame/Embarrassment -->
    <!-- Blush -->
    <circle cx="40" cy="55" r="8" fill="#ec4899" opacity="0.6"/>
    <circle cx="80" cy="55" r="8" fill="#ec4899" opacity="0.6"/>
    <!-- Eyes closed tight -->
    <path d="M35 45 L 45 50 M 35 50 L 45 45" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M75 45 L 85 50 M 75 50 L 85 45" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M45 70 Q 60 65 75 70" stroke="#1e293b" stroke-width="2" fill="none"/>
    
    <!-- Hands covering face -->
    <path d="M30 60 L 20 50 L 35 40 Z" fill="#fde68a"/>
    <path d="M90 60 L 100 50 L 85 40 Z" fill="#fde68a"/>
  </g>

  <!-- Environment Props -->
  <!-- Broken Vase/Spilled item -->
  <path d="M160 180 L 190 180 L 185 210 L 165 210 Z" fill="#fb923c"/>
  <path d="M155 180 L 195 180 L 200 190 L 150 190 Z" fill="#fbbf24"/>
  
  <!-- Dramatic Light Beam -->
  <path d="M180 0 L 240 0 L 150 240 L 90 240 Z" fill="#f59e0b" opacity="0.05"/>
  
  <!-- Accent dots -->
  <circle cx="30" cy="30" r="3" fill="#38bdf8"/>
  <circle cx="210" cy="40" r="2" fill="#10b981"/>
</svg>