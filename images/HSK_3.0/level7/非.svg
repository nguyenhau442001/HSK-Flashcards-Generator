<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- The "Not This" Narrative: A person pointing at the wrong puzzle piece -->
  <!-- Puzzle Piece (The "Wrong" one) -->
  <path d="M120 100 L160 100 L160 140 L120 140 Z" fill="#fb923c" stroke="#0f172a" stroke-width="4"/>
  <circle cx="140" cy="100" r="12" fill="#fb923c" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Hand pointing (The "Not" gesture) -->
  <path d="M180 180 L160 130 L150 140 L170 190 Z" fill="#f59e0b"/>
  <circle cx="180" cy="180" r="10" fill="#f59e0b"/>
  
  <!-- The "Correct" Placeholder (Empty slot) -->
  <rect x="60" y="100" width="40" height="40" rx="4" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="50" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="40" r="8" fill="#ec4899" opacity="0.6"/>
  <path d="M30 180 L50 180 L40 160 Z" fill="#fbbf24" opacity="0.4"/>
  
  <!-- Atmospheric depth -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="url(#bgGrad)" opacity="0.1"/>
</svg>