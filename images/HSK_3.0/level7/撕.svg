<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Paper Rip Edge Filter / Effect -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container & Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="80" r="110" fill="url(#lamp-glow)"/>

  <!-- Interior / Desk Environment -->
  <!-- Wooden Desk Surface -->
  <rect x="20" y="175" width="200" height="45" rx="6" fill="#334155"/>
  <path d="M 20 175 L 220 175 L 220 183 L 20 183 Z" fill="#475569"/>

  <!-- Background Bookshelf / Interior Props -->
  <rect x="35" y="90" width="16" height="50" rx="2" fill="#0284c7" opacity="0.8"/>
  <rect x="53" y="85" width="12" height="55" rx="2" fill="#10b981" opacity="0.8"/>
  <rect x="67" y="95" width="18" height="45" rx="2" fill="#f43f5e" opacity="0.8"/>
  
  <!-- Desk Lamp Base & Stand -->
  <path d="M 185 175 L 205 175 L 200 130 L 190 130 Z" fill="#64748b"/>
  <path d="M 195 130 L 195 90 C 195 70, 160 70, 160 90 L 160 100" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Lamp Shade -->
  <path d="M 140 95 L 180 95 L 170 115 L 150 115 Z" fill="#fbbf24"/>

  <!-- Character: Upper Body & Clothing -->
  <!-- Torso (Blue Sweater) -->
  <path d="M 85 200 C 85 165, 155 165, 155 200 Z" fill="#2563eb" filter="url(#shadow)"/>
  <!-- Collar -->
  <path d="M 105 163 C 120 173, 120 173, 135 163" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Character Neck & Head -->
  <rect x="112" y="145" width="16" height="25" fill="#fbcfe8"/>
  <!-- Head / Face -->
  <circle cx="120" cy="130" r="22" fill="#fbcfe8"/>
  <!-- Hair (Neat Dark Bob/Crop) -->
  <path d="M 98 125 C 98 105, 142 105, 142 125 C 142 135, 138 128, 135 120 C 125 112, 115 112, 105 120 C 102 128, 98 135, 98 125 Z" fill="#0f172a"/>
  <!-- Focused Expression (Eyebrows & Eyes) -->
  <line x1="110" y1="126" x2="118" y2="128" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="122" y1="128" x2="130" y2="126" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="114" cy="132" r="1.5" fill="#1e293b"/>
  <circle cx="126" cy="132" r="1.5" fill="#1e293b"/>

  <!-- Character Arms & Hands Actively Tearing Paper -->
  <!-- Left Arm & Hand (Pulling Left) -->
  <path d="M 85 180 C 70 175, 60 160, 75 145" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <circle cx="78" cy="142" r="6" fill="#fbcfe8"/>

  <!-- Right Arm & Hand (Pulling Right) -->
  <path d="M 155 180 C 170 175, 180 160, 165 145" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <circle cx="162" cy="142" r="6" fill="#fbcfe8"/>

  <!-- The Tearing Paper (Central Focus) -->
  <!-- Left Half of Paper -->
  <g filter="url(#shadow)">
    <path d="M 78 125 
             L 112 120 
             L 108 142 
             L 116 155 
             L 110 170 
             L 74 165 Z" 
          fill="#f8fafc"/>
    <!-- Abstract lines to show it's a document/paper -->
    <line x1="84" y1="135" x2="102" y2="133" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="84" y1="145" x2="98" y2="143" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="84" y1="155" x2="104" y2="153" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right Half of Paper -->
  <g filter="url(#shadow)">
    <path d="M 162 125 
             L 118 120 
             L 122 142 
             L 114 155 
             L 120 170 
             L 166 165 Z" 
          fill="#f1f5f9"/>
    <!-- Abstract lines on right paper half -->
    <line x1="136" y1="133" x2="154" y2="135" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="143" x2="150" y2="145" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="126" y1="153" x2="154" y2="155" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Tear Effect (Motion Lines & Tiny Paper Shards in Center) -->
  <polygon points="112,130 118,135 113,140" fill="#ffffff" opacity="0.9"/>
  <polygon points="115,150 120,158 114,162" fill="#e2e8f0" opacity="0.9"/>
  <circle cx="115" cy="146" r="1.5" fill="#ffffff"/>
  <circle cx="113" cy="125" r="1" fill="#ffffff"/>
  
  <!-- Motion Action Lines indicating separation force -->
  <path d="M 65 135 L 55 130" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 175 135 L 185 130" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Foreground Desk Details (Coffee Mug) -->
  <rect x="35" y="155" width="18" height="20" rx="3" fill="#ec4899"/>
  <path d="M 53 160 C 58 160, 58 170, 53 170" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <!-- Steam from mug -->
  <path d="M 40 148 C 42 144, 38 140, 40 136" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

</svg>