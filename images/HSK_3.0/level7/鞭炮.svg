<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Firecracker Red Gradient -->
    <linearGradient id="red-tube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Spark Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Intense Explosion Glow -->
    <filter id="boom-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Festive Lighting (Background glow) -->
  <circle cx="120" cy="120" r="90" fill="#ea580c" opacity="0.12" filter="url(#glow)"/>
  <circle cx="140" cy="80" r="40" fill="#facc15" opacity="0.08" filter="url(#glow)"/>

  <!-- Atmospheric Confetti / Sparks in Background -->
  <g opacity="0.6">
    <circle cx="45" cy="65" r="2.5" fill="#f43f5e" />
    <circle cx="195" cy="50" r="2" fill="#fbbf24" />
    <circle cx="205" cy="165" r="3" fill="#38bdf8" />
    <circle cx="35" cy="180" r="2" fill="#a855f7" />
    <rect x="75" y="40" width="4" height="4" rx="1" fill="#fb7185" transform="rotate(25 77 42)" />
    <rect x="175" y="125" width="5" height="3" rx="1" fill="#34d399" transform="rotate(-15 177 126)" />
    <rect x="55" y="130" width="3" height="5" rx="1" fill="#fde047" transform="rotate(45 56 132)" />
  </g>

  <!-- Ground / Surface shadow context -->
  <ellipse cx="120" cy="210" rx="75" ry="12" fill="#020617" opacity="0.7"/>

  <!-- FIRECRACKER STRING (BIAN PAO) GROUP -->
  <g id="firecracker-string" transform="translate(0, 5)">
    
    <!-- Main Fuse (Top hanging wire) -->
    <path d="M 120 10 Q 130 25 125 35" fill="none" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 125 35 Q 120 42 123 52" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

    <!-- Central connecting cord (Zigzag behind/between tubes) -->
    <path d="
      M 123 52 L 105 68 
      L 135 84 L 105 100 
      L 135 116 L 105 132 
      L 135 148 L 105 164 
      L 135 180 L 120 196" 
      fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Individual Firecrackers (Paired alternating left/right along the string) -->
    
    <!-- Pair 1 (Top) -->
    <g transform="translate(114, 55)">
      <!-- Left Tube -->
      <g transform="translate(-14, 0) rotate(-12)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="url(#red-tube)" stroke="#7f1d1d" stroke-width="1"/>
        <!-- Gold bands -->
        <rect x="0" y="3" width="16" height="3" fill="url(#gold-grad)"/>
        <rect x="0" y="18" width="16" height="3" fill="url(#gold-grad)"/>
        <!-- Highlight -->
        <path d="M 3 6 L 3 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
      <!-- Right Tube -->
      <g transform="translate(2, 6) rotate(8)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="url(#red-tube)" stroke="#7f1d1d" stroke-width="1"/>
        <rect x="0" y="3" width="16" height="3" fill="url(#gold-grad)"/>
        <rect x="0" y="18" width="16" height="3" fill="url(#gold-grad)"/>
        <path d="M 3 6 L 3 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>

    <!-- Pair 2 -->
    <g transform="translate(114, 87)">
      <g transform="translate(-16, -2) rotate(-15)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="url(#red-tube)" stroke="#7f1d1d" stroke-width="1"/>
        <rect x="0" y="3" width="16" height="3" fill="url(#gold-grad)"/>
        <rect x="0" y="18" width="16" height="3" fill="url(#gold-grad)"/>
        <path d="M 3 6 L 3 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
      <g transform="translate(0, 4) rotate(12)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="url(#red-tube)" stroke="#7f1d1d" stroke-width="1"/>
        <rect x="0" y="3" width="16" height="3" fill="url(#gold-grad)"/>
        <rect x="0" y="18" width="16" height="3" fill="url(#gold-grad)"/>
        <path d="M 3 6 L 3 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>

    <!-- Pair 3 -->
    <g transform="translate(114, 119)">
      <g transform="translate(-15, -1) rotate(-10)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="url(#red-tube)" stroke="#7f1d1d" stroke-width="1"/>
        <rect x="0" y="3" width="16" height="3" fill="url(#gold-grad)"/>
        <rect x="0" y="18" width="16" height="3" fill="url(#gold-grad)"/>
        <path d="M 3 6 L 3 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
      <g transform="translate(1, 5) rotate(15)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="url(#red-tube)" stroke="#7f1d1d" stroke-width="1"/>
        <rect x="0" y="3" width="16" height="3" fill="url(#gold-grad)"/>
        <rect x="0" y="18" width="16" height="3" fill="url(#gold-grad)"/>
        <path d="M 3 6 L 3 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>

    <!-- Pair 4 -->
    <g transform="translate(114, 151)">
      <g transform="translate(-16, -3) rotate(-18)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="url(#red-tube)" stroke="#7f1d1d" stroke-width="1"/>
        <rect x="0" y="3" width="16" height="3" fill="url(#gold-grad)"/>
        <rect x="0" y="18" width="16" height="3" fill="url(#gold-grad)"/>
        <path d="M 3 6 L 3 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
      <g transform="translate(2, 3) rotate(10)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="url(#red-tube)" stroke="#7f1d1d" stroke-width="1"/>
        <rect x="0" y="3" width="16" height="3" fill="url(#gold-grad)"/>
        <rect x="0" y="18" width="16" height="3" fill="url(#gold-grad)"/>
        <path d="M 3 6 L 3 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>

    <!-- Pair 5 (Bottom active/exploding part) -->
    <g transform="translate(114, 183)">
      <g transform="translate(-14, 0) rotate(-8)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="url(#red-tube)" stroke="#7f1d1d" stroke-width="1"/>
        <rect x="0" y="3" width="16" height="3" fill="url(#gold-grad)"/>
        <rect x="0" y="18" width="16" height="3" fill="url(#gold-grad)"/>
        <path d="M 3 6 L 3 15" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
      <!-- Bottom right exploding barrel -->
      <g transform="translate(2, 2) rotate(20)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1"/>
        <rect x="0" y="3" width="16" height="3" fill="url(#gold-grad)"/>
        <!-- Bursting effect at the end of bottom tube -->
        <path d="M 8 24 L 4 35 L 12 33 Z" fill="#fbbf24"/>
      </g>
    </g>

  </g> <!-- End Firecracker String -->

  <!-- ACTION-PACKED EXPLOSION & SPARKS (Foreground Dynamic Layer) -->
  <g filter="url(#boom-glow)">
    <!-- Central Burst Flare -->
    <circle cx="130" cy="195" r="16" fill="#fef08a" opacity="0.9"/>
    <circle cx="130" cy="195" r="8" fill="#ffffff"/>
    <circle cx="130" cy="195" r="26" fill="#f97316" opacity="0.4"/>

    <!-- Dynamic Spark Lines radiating out -->
    <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
      <line x1="130" y1="195" x2="165" y2="175" />
      <line x1="130" y1="195" x2="178" y2="200" />
      <line x1="130" y1="195" x2="150" y2="225" />
      <line x1="130" y1="195" x2="110" y2="222" />
      <line x1="130" y1="195" x2="88" y2="205" />
      <line x1="130" y1="195" x2="95" y2="172" />
      <line x1="130" y1="195" x2="125" y2="155" />
      <line x1="130" y1="195" x2="155" y2="145" />
    </g>

    <!-- Secondary Bright Spark Dots -->
    <circle cx="170" cy="170" r="3.5" fill="#fef08a"/>
    <circle cx="185" cy="205" r="2.5" fill="#fef08a"/>
    <circle cx="152" cy="228" r="3" fill="#fef08a"/>
    <circle cx="92" cy="212" r="2.5" fill="#fef08a"/>
    <circle cx="85" cy="175" r="3.5" fill="#fef08a"/>
    <circle cx="158" cy="142" r="3" fill="#fef08a"/>
    <circle cx="118" cy="148" r="2" fill="#fef08a"/>
    
    <!-- Smoke Puffs (Stylized soft circles) -->
    <circle cx="145" cy="165" r="12" fill="#64748b" opacity="0.35"/>
    <circle cx="165" cy="185" r="10" fill="#94a3b8" opacity="0.3"/>
    <circle cx="100" cy="180" r="14" fill="#64748b" opacity="0.3"/>
    <circle cx="115" cy="140" r="9" fill="#94a3b8" opacity="0.25"/>
  </g>

</svg>