<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Boulder Gradients -->
    <linearGradient id="boulderShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boulderMain" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="boulderHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0"/>
    </linearGradient>

    <!-- Water Stream Gradient -->
    <linearGradient id="waterStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="frogBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="frogBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Motion & Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Scenery (Atmospheric Depth) -->
  <!-- Distant foliage / Mossy banks -->
  <path d="M 20 210 Q 50 190 90 205 T 160 200 T 220 215 L 240 240 L 0 240 Z" fill="#064e3b" opacity="0.4"/>
  <path d="M 0 220 Q 60 200 120 215 T 240 210 L 240 240 L 0 240 Z" fill="#065f46" opacity="0.6"/>

  <!-- Glowing ambient light source (Moonlight/Stream glow) -->
  <circle cx="120" cy="140" r="70" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>

  <!-- Water Pool at Base -->
  <ellipse cx="120" cy="210" rx="90" ry="18" fill="#0369a1" opacity="0.3"/>
  <ellipse cx="120" cy="212" rx="70" ry="12" fill="#38bdf8" opacity="0.4"/>

  <!-- MAIN SUBJECT: Smooth Boulder (光洁圆润的大石头) -->
  <!-- Base Shadow / Undercut -->
  <path d="M 50 185 Q 120 205 190 185 Q 200 200 120 205 Q 40 200 50 185 Z" fill="#0f172a" opacity="0.7"/>

  <!-- Boulder Base Body -->
  <path d="M 50 160 
           C 40 130, 60 90, 95 85 
           C 120 80, 150 75, 175 90 
           C 200 105, 205 145, 195 175 
           C 185 200, 55 200, 50 160 Z" 
        fill="url(#boulderMain)" stroke="#334155" stroke-width="2"/>

  <!-- Boulder Surface Curvature & Smooth Shading (Glossy effect) -->
  <!-- Top-left highlight curving along the rounded surface -->
  <path d="M 65 130 
           C 65 100, 90 88, 120 86
           C 105 86, 75 98, 70 125 
           C 68 140, 72 165, 90 180
           C 75 165, 65 145, 65 130 Z" 
        fill="url(#boulderHighlight)"/>

  <!-- Specular highlight streak indicating ultra-smooth, wet stone -->
  <path d="M 110 92 C 135 90, 165 98, 180 115 C 185 120, 175 125, 168 120 C 150 105, 130 100, 110 102 Z" 
        fill="#ffffff" opacity="0.6"/>
  <ellipse cx="145" cy="104" rx="18" ry="5" transform="rotate(15 145 104)" fill="#ffffff" opacity="0.4"/>
  <circle cx="165" cy="115" r="3" fill="#ffffff" opacity="0.7"/>

  <!-- Soft Secondary Highlight -->
  <path d="M 75 165 C 100 185, 150 185, 175 165 C 185 155, 190 140, 190 140 C 190 140, 185 165, 170 177 C 145 195, 95 195, 75 175 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Cascading Water Stream over the smooth rock -->
  <path d="M 125 75 Q 128 100 120 125 Q 112 150 125 180 Q 130 190 122 205" 
        fill="none" stroke="url(#waterStream)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 127 77 Q 130 102 122 127 Q 114 152 127 182" 
        fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- ACTION/NARRATIVE PROPS: Surprised little green frog slipping -->
  <g transform="translate(130, 105) rotate(25)">
    <!-- Frog Shadow -->
    <ellipse cx="2" cy="18" rx="12" ry="4" fill="#0f172a" opacity="0.4"/>
    
    <!-- Frog Body -->
    <ellipse cx="0" cy="10" rx="12" ry="10" fill="url(#frogBody)" stroke="#065f46" stroke-width="1.5"/>
    <ellipse cx="0" cy="12" rx="8" ry="7" fill="url(#frogBelly)"/>

    <!-- Frog Legs (slipping pose) -->
    <!-- Back Leg stretched out -->
    <path d="M -10 15 Q -22 22 -20 15" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    <!-- Front Leg sliding -->
    <path d="M 8 15 Q 18 22 15 18" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>

    <!-- Frog Head -->
    <circle cx="0" cy="-2" r="10" fill="url(#frogBody)" stroke="#065f46" stroke-width="1.5"/>
    
    <!-- Big Expressive Eyes -->
    <circle cx="-5" cy="-8" r="4.5" fill="#ffffff" stroke="#065f46" stroke-width="1"/>
    <circle cx="-5" cy="-8" r="1.5" fill="#0f172a"/>
    <circle cx="5" cy="-8" r="4.5" fill="#ffffff" stroke="#065f46" stroke-width="1"/>
    <circle cx="5" cy="-8" r="1.5" fill="#0f172a"/>
    
    <!-- Surprised Mouth -->
    <ellipse cx="0" cy="-1" rx="2" ry="2.5" fill="#0f172a"/>
  </g>

  <!-- Motion lines for slip/slide -->
  <path d="M 152 122 Q 162 132 172 142" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 142 110 Q 152 120 162 130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.6"/>

  <!-- Additional Environmental Details (Tiny glowing mushrooms and pebbles for scale) -->
  <!-- Mushroom 1 -->
  <path d="M 45 195 L 47 185 L 49 195 Z" fill="#94a3b8"/>
  <path d="M 42 185 C 42 180, 52 180, 52 185 Z" fill="#fb7185"/>
  <circle cx="47" cy="182" r="1" fill="#ffffff"/>

  <!-- Mushroom 2 -->
  <path d="M 185 190 L 186.5 182 L 188 190 Z" fill="#94a3b8"/>
  <path d="M 182 182 C 182 177, 192 177, 192 182 Z" fill="#f43f5e"/>
  <circle cx="187" cy="179" r="1" fill="#ffffff"/>

  <!-- Glowing Firefly / Magic Sparkles -->
  <circle cx="75" cy="85" r="2.5" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="75" cy="85" r="1" fill="#ffffff"/>

  <circle cx="160" cy="70" r="2" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="160" cy="70" r="0.8" fill="#ffffff"/>

  <circle cx="100" cy="150" r="1.5" fill="#38bdf8" opacity="0.8"/>
</svg>