<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Workshop Glow -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.8"/>
  <path d="M 40 180 L 200 180 L 200 200 L 40 200 Z" fill="#334155" opacity="0.3"/>
  <line x1="40" y1="180" x2="200" y2="180" stroke="#475569" stroke-width="2"/>

  <!-- Workshop Elements / Environment -->
  <!-- Tool rack in background -->
  <rect x="160" y="50" width="50" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="170" y1="70" x2="190" y2="70" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="90" x2="200" y2="90" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="110" x2="185" y2="110" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Main Machine (Broken / Open for Repair) -->
  <g transform="translate(45, 95)">
    <!-- Machine Body -->
    <rect x="0" y="20" width="85" height="65" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Machine Screen / Panel -->
    <rect x="12" y="32" width="30" height="20" rx="3" fill="#0f172a"/>
    <circle cx="20" cy="42" r="3" fill="#ef4444" opacity="0.9"/> <!-- Warning red light -->
    <line x1="28" y1="39" x2="36" y2="39" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="45" x2="34" y2="45" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Control Buttons -->
    <circle cx="60" cy="38" r="4" fill="#fb923c"/>
    <circle cx="72" cy="38" r="4" fill="#38bdf8"/>
    <rect x="52" y="50" width="24" height="6" rx="2" fill="#1e293b"/>

    <!-- Open Access Panel exposing internal mechanism -->
    <path d="M 10 85 L 75 85 L 85 15 L 0 15 Z" fill="#1e293b" opacity="0.6"/>
    <!-- Broken gears inside -->
    <circle cx="35" cy="55" r="12" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="6 3"/>
    <circle cx="35" cy="55" r="5" fill="#475569"/>
    
    <!-- Sparks indicating issue -->
    <path d="M 22 25 L 18 18 M 45 28 L 50 20" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- WORKBENCH SURFACE -->
  <path d="M 30 160 L 210 160 L 220 185 L 20 185 Z" fill="#334155"/>
  <rect x="20" y="160" width="200" height="6" fill="#475569"/>

  <!-- NEW SPARE PARTS (零件 - The core vocabulary focus) -->
  <!-- Sleek new mechanical gear & component on table -->
  <g transform="translate(130, 145)">
    <!-- Small box containing parts -->
    <rect x="0" y="10" width="35" height="25" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 0 16 L 35 16" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Shiny new golden gear (lingjian / part) -->
    <circle cx="50" cy="20" r="10" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="50" cy="20" r="4" fill="#f59e0b"/>
    <path d="M 50 7 L 50 11 M 50 29 L 50 33 M 37 20 L 41 20 M 59 20 L 63 20" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Sparkling highlight on the new part -->
    <path d="M 55 12 L 58 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER: Mechanic / Technician -->
  <g transform="translate(110, 50)">
    <!-- Body / Torso (Blue overalls/shirt) -->
    <path d="M 30 75 Q 45 65 60 75 L 70 120 L 20 120 Z" fill="#0284c7"/>
    <path d="M 40 75 L 40 120 M 50 75 L 50 120" stroke="#0369a1" stroke-width="2"/>
    
    <!-- Arms -->
    <!-- Left arm holding wrench / gesturing -->
    <path d="M 28 80 Q 10 90 15 105" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <circle cx="15" cy="107" r="5" fill="#fbcfe8"/> <!-- Hand -->
    
    <!-- Right arm pointing at the new part -->
    <path d="M 62 80 Q 80 95 70 110" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <circle cx="70" cy="112" r="5" fill="#fbcfe8"/> <!-- Hand pointing -->

    <!-- Head & Face -->
    <circle cx="45" cy="45" r="18" fill="#fbcfe8"/>
    <!-- Hair (Dark brown/slate) -->
    <path d="M 28 45 Q 30 25 45 27 Q 62 25 62 45 Q 55 35 45 35 Q 35 35 28 45 Z" fill="#334155"/>
    <!-- Cap -->
    <path d="M 28 35 Q 45 22 65 32 L 60 38 L 30 38 Z" fill="#f59e0b"/>
    <path d="M 58 33 L 72 36 L 70 39 L 58 37 Z" fill="#d97706"/> <!-- Cap brim -->

    <!-- Facial expression: focused, thoughtful/caring -->
    <!-- Eyes (focused down towards machine/parts) -->
    <line x1="38" y1="46" x2="44" y2="48" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="48" x2="54" y2="46" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Gentle confident smile -->
    <path d="M 41 55 Q 45 59 49 55" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="37" cy="52" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="53" cy="52" r="3" fill="#fda4af" opacity="0.6"/>
  </g>

  <!-- Wrench tool resting on table -->
  <g transform="translate(60, 155)">
    <path d="M 0 10 L 25 -5 L 30 0 L 5 15 Z" fill="#94a3b8"/>
    <circle cx="2" cy="12" r="4" fill="#64748b"/>
  </g>

  <!-- Highlights & Action FX (Subtle floating stars/sparkles indicating successful fix/new part prep) -->
  <g transform="translate(170, 110)">
    <path d="M 0 0 L 4 4 L 0 8 L -4 4 Z" fill="#38bdf8" opacity="0.8"/>
  </g>
  <g transform="translate(135, 95)">
    <path d="M 0 0 L 3 3 L 0 6 L -3 3 Z" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>