<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Supermarket Shelf Gradient -->
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Price Tag Highlight Gradient -->
    <linearGradient id="tagHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    
    <!-- Chart Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Supermarket / Store Interior Background -->
  <!-- Back Wall Panels -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="8"/>
  
  <!-- Subtle Grid Lines on Wall -->
  <path d="M 20 60 H 220 M 20 100 H 220 M 20 140 H 220" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <path d="M 70 20 V 170 M 120 20 V 170 M 170 20 V 170" stroke="#334155" stroke-width="1" opacity="0.3"/>

  <!-- Grocery Shelves -->
  <rect x="15" y="80" width="210" height="12" fill="url(#shelfGrad)" rx="3"/>
  <rect x="15" y="140" width="210" height="12" fill="url(#shelfGrad)" rx="3"/>

  <!-- PROPS ON SHELVES (Cans, Boxes, Fruits) -->
  <!-- Top Shelf Items -->
  <rect x="35" y="55" width="16" height="25" rx="3" fill="#3b82f6"/>
  <rect x="55" y="50" width="20" height="30" rx="3" fill="#10b981"/>
  <circle cx="100" cy="65" r="12" fill="#ef4444"/> <!-- Apple -->
  <circle cx="125" cy="65" r="11" fill="#f59e0b"/> <!-- Orange -->
  <rect x="155" y="52" width="18" height="28" rx="2" fill="#8b5cf6"/>
  <rect x="180" y="58" width="15" height="22" rx="3" fill="#ec4899"/>

  <!-- Bottom Shelf Items -->
  <rect x="30" y="115" width="22" height="25" rx="4" fill="#06b6d4"/>
  <rect x="60" y="112" width="18" height="28" rx="3" fill="#f97316"/>
  <rect x="90" y="118" width="30" height="22" rx="4" fill="#64748b"/>
  <circle cx="150" cy="128" r="10" fill="#10b981"/>
  <rect x="175" y="110" width="25" height="30" rx="4" fill="#3b82f6"/>

  <!-- RISING PRICE METRIC / ARROW OVERLAY (Visualizing "zhǎng" - increase) -->
  <g filter="url(#glow)">
    <!-- Background glowing trend curve -->
    <path d="M 30 190 Q 90 180 130 130 T 210 60" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
    <path d="M 30 190 Q 90 180 130 130 T 210 60" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating Upward Arrow & Bar Graph Icon Element representing Price Surge -->
  <g transform="translate(145, 30)">
    <!-- Bar chart pillars -->
    <rect x="0" y="25" width="10" height="15" rx="2" fill="#475569"/>
    <rect x="14" y="15" width="10" height="25" rx="2" fill="#64748b"/>
    <rect x="28" y="0" width="10" height="40" rx="2" fill="url(#barGrad)"/>
    
    <!-- Big red rising arrow -->
    <path d="M 45 10 L 58 -3 L 58 6 M 58 -3 L 49 -3" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- PRIMARY CHARACTER: Shocked / Concerned Shopper -->
  <g transform="translate(10, 75)">
    <!-- Body / Torso (Teal Jacket) -->
    <path d="M 50 115 Q 50 95 65 95 L 85 95 Q 100 95 100 115 L 105 145 L 45 145 Z" fill="#0ea5e9"/>
    <!-- Jacket collar / inner shirt -->
    <path d="M 67 95 L 75 110 L 83 95 Z" fill="#f8fafc"/>

    <!-- Neck -->
    <rect x="68" y="85" width="14" height="14" rx="4" fill="#fbcfe8"/>

    <!-- Head / Face -->
    <circle cx="75" cy="72" r="18" fill="#fbcfe8"/>

    <!-- Hair (Stylish dark bob) -->
    <path d="M 57 72 C 57 58 65 54 75 54 C 85 54 93 58 93 72 C 93 76 91 82 91 82 C 91 82 87 74 85 70 C 81 62 69 62 65 70 C 61 78 57 72 57 72 Z" fill="#334155"/>

    <!-- Shocked Facial Expression -->
    <!-- Eyebrows (Raised high in surprise) -->
    <path d="M 64 63 Q 68 59 72 63" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 78 63 Q 82 59 86 63" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Wide Open Eyes -->
    <circle cx="68" cy="69" r="3.5" fill="#1e293b"/>
    <circle cx="82" cy="69" r="3.5" fill="#1e293b"/>
    <circle cx="69" cy="68" r="1" fill="#ffffff"/>
    <circle cx="83" cy="68" r="1" fill="#ffffff"/>

    <!-- Shocked Open Mouth (O Shape) -->
    <ellipse cx="75" cy="80" rx="4" ry="5.5" fill="#1e293b"/>

    <!-- Hands in reaction (Clutched to cheeks in disbelief) -->
    <!-- Left Hand -->
    <circle cx="56" cy="82" r="6" fill="#fbcfe8" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Right Hand -->
    <circle cx="94" cy="82" r="6" fill="#fbcfe8" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Shopping Basket held in left arm -->
    <path d="M 35 110 L 45 135 L 75 135 L 85 110 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>
    <!-- Basket handle -->
    <path d="M 38 110 Q 60 90 82 110" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Items peeking out of basket -->
    <circle cx="52" cy="112" r="6" fill="#ef4444"/>
    <circle cx="65" cy="110" r="7" fill="#10b981"/>
  </g>

  <!-- FOREGROUND PROP: Giant Exaggerated Price Tag highlighting the spike -->
  <g transform="translate(135, 120)">
    <!-- Tag String -->
    <path d="M 30 0 Q 20 -15 10 -25" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Tag Body -->
    <path d="M 15 0 L 55 0 C 60 0 63 3 63 8 L 63 42 C 63 47 60 50 55 50 L 15 50 C 10 50 7 47 7 42 L 7 8 C 7 3 10 0 15 0 Z" fill="url(#tagHighlight)" stroke="#b91c1c" stroke-width="2"/>
    
    <!-- Tag Hole -->
    <circle cx="15" cy="25" r="4" fill="#0f172a"/>

    <!-- Upward Trend Line / Icon inside the tag instead of text -->
    <path d="M 25 32 L 35 20 L 43 25 L 53 13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrowhead -->
    <path d="M 47 13 H 53 V 19" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Exclamation mark accent for high price urgency -->
    <circle cx="55" cy="38" r="3" fill="#fef08a"/>
  </g>

  <!-- Secondary decorative floating warning sparkles -->
  <path d="M 125 105 L 128 112 L 135 115 L 128 118 L 125 125 L 122 118 L 115 115 L 122 112 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 45 45 L 47 49 L 52 51 L 47 53 L 45 57 L 43 53 L 38 51 L 43 49 Z" fill="#fbbf24" opacity="0.6"/>
</svg>