<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Clock Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Wall Lighting / Window Effect -->
  <path d="M 0 0 L 140 0 L 80 160 L 0 160 Z" fill="#38bdf8" opacity="0.03" />

  <!-- Back Wall & Desk Surface -->
  <rect x="0" y="150" width="240" height="90" fill="url(#deskGrad)" />
  <line x1="0" y1="150" x2="240" y2="150" stroke="#64748b" stroke-width="2" opacity="0.4" />

  <!-- CONTEXTUAL SCENE: The Late Alarm Clock / "The Excuse" Setup -->
  
  <!-- Coffee Mug (Prop for tiredness/excuse) -->
  <g transform="translate(180, 160)" filter="url(#dropShadow)">
    <path d="M 8 10 C 8 6 12 4 16 4 L 24 4 C 28 4 32 6 32 10 L 30 32 C 30 36 26 38 22 38 L 18 38 C 14 38 10 36 10 32 Z" fill="#f1f5f9" />
    <path d="M 30 14 C 36 14 38 18 38 22 C 38 26 36 30 30 30" fill="none" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />
    <!-- Coffee Surface -->
    <ellipse cx="20" cy="10" rx="6" ry="2" fill="#78350f" />
    <!-- Steam -->
    <path d="M 16 -2 Q 14 -8 18 -12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <path d="M 24 -4 Q 26 -10 22 -14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Open Laptop (Context of work/school) -->
  <g transform="translate(30, 130)" filter="url(#dropShadow)">
    <!-- Laptop Base -->
    <path d="M -10 40 L 90 40 L 100 50 L -20 50 Z" fill="#64748b" />
    <path d="M 30 40 L 50 40 L 50 48 L 30 48 Z" fill="#475569" />
    <!-- Laptop Screen Back -->
    <path d="M 0 -20 L 80 -20 C 85 -20 85 -15 85 -15 L 75 40 L 5 40 L -5 -15 C -5 -15 -5 -20 0 -20 Z" fill="#475569" />
    <!-- Screen -->
    <path d="M 3 -15 L 77 -15 L 71 35 L 9 35 Z" fill="url(#screenGrad)" />
    <!-- Abstract UI on Screen (Busy/Late vibe) -->
    <rect x="15" y="-8" width="20" height="4" rx="2" fill="#38bdf8" opacity="0.8" />
    <rect x="15" y="0" width="45" height="3" rx="1.5" fill="#64748b" opacity="0.6" />
    <rect x="15" y="6" width="35" height="3" rx="1.5" fill="#64748b" opacity="0.6" />
    <!-- Red notification dot representing missed deadline / need for an excuse -->
    <circle cx="65" cy="-6" r="4" fill="#ef4444" />
  </g>

  <!-- MAIN SUBJECT: The Oversized Alarm Clock (Symbolizing lateness, the root of "an excuse") -->
  <g transform="translate(100, 75)" filter="url(#dropShadow)">
    <!-- Clock Feet -->
    <path d="M 15 52 L 5 65 L 20 65 Z" fill="#cbd5e1" />
    <path d="M 45 52 L 55 65 L 40 65 Z" fill="#cbd5e1" />

    <!-- Clock Body (Outer Casing) -->
    <circle cx="30" cy="25" r="32" fill="#fb923c" />
    <circle cx="30" cy="25" r="28" fill="#1e293b" />

    <!-- Twin Bells on Top -->
    <path d="M 12 0 C 12 -8 20 -10 20 -10 L 14 -18 C 14 -18 6 -16 8 -6 Z" fill="#f59e0b" />
    <path d="M 48 0 C 48 -8 40 -10 40 -10 L 46 -18 C 46 -18 54 -16 52 -6 Z" fill="#f59e0b" />
    <rect x="25" y="-10" width="10" height="6" rx="2" fill="#cbd5e1" />

    <!-- Glowing Clock Face Elements -->
    <circle cx="30" cy="25" r="24" fill="#0f172a" filter="url(#amberGlow)" />
    <circle cx="30" cy="25" r="24" fill="#f8fafc" />

    <!-- Clock Hands (Showing very early or chaotic time) -->
    <line x1="30" y1="25" x2="30" y2="13" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="25" x2="42" y2="25" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <circle cx="30" cy="25" r="3" fill="#ef4444" />

    <!-- Action / Motion Lines radiating from the alarm clock (Ringing intensely) -->
    <path d="M -8 -2 Q -12 -6 -15 -10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M 68 -2 Q 72 -6 75 -10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M -12 25 Q -18 25 -22 25" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M 72 25 Q 78 25 82 25" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

    <!-- Zzz / Sleeping through the alarm conceptual floaters -->
    <g transform="translate(55, -20)" opacity="0.9">
      <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="14" fill="#38bdf8">Z</text>
    </g>
    <g transform="translate(70, -35)" opacity="0.6">
      <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="18" fill="#38bdf8">Z</text>
    </g>
  </g>

  <!-- Interactive Dynamic Accent: Dropped Papers / Tangled Excuse Notes -->
  <g transform="translate(85, 175) rotate(-12)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="35" height="45" rx="2" fill="#f8fafc" />
    <line x1="6" y1="8" x2="26" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="14" x2="29" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="20" x2="20" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Red scribble / crossed-out text simulation -->
    <path d="M 6 30 L 29 38 M 6 38 L 29 30" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <g transform="translate(55, 185) rotate(15)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="30" height="40" rx="2" fill="#f1f5f9" />
    <line x1="5" y1="8" x2="25" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="5" y1="14" x2="20" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <circle cx="15" cy="28" r="5" fill="#f59e0b" />
  </g>

</svg>