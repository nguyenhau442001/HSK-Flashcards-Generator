<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Definitions for Gradients & Filters -->
  <defs>
    <!-- Background Night/Misty Atmosphere Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Warm Indoor/Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Windowpane Dew/Condensation Shimmer -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Atmospheric Background -->
  <rect width="240" height="240" fill="url(#bgGrad)"/>
  
  <!-- Night Window Frame Exterior (Misty Out-of-focus background) -->
  <circle cx="180" cy="120" r="45" fill="#1e293b" opacity="0.6"/>
  <circle cx="60" cy="180" r="30" fill="#334155" opacity="0.4"/>
  
  <!-- Ambient Room Light Glow -->
  <circle cx="120" cy="120" r="120" fill="url(#lampGlow)"/>

  <!-- Houseplant representing thriving in humid air -->
  <g transform="translate(180, 140)">
    <!-- Pot -->
    <path d="M-15,30 L15,30 L12,65 L-12,65 Z" fill="#64748b"/>
    <ellipse cx="0" cy="30" rx="15" ry="4" fill="#94a3b8"/>
    <!-- Lush Tropical Leaves (Monstera / Potted plant) -->
    <path d="M0,30 Q-25,10 -30,-15 Q-15,-25 0,0 Q15,-25 30,-15 Q25,10 0,30 Z" fill="#10b981"/>
    <path d="M-5,30 Q-45,20 -55,-5 Q-35,-15 -10,5 Q-5,20 -5,30 Z" fill="#059669"/>
    <path d="M5,30 Q45,25 50,0 Q30,-10 5,10 Z" fill="#047857"/>
    <!-- Water droplets on leaves -->
    <circle cx="-15" cy="-5" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="20" cy="-2" r="2.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="-35" cy="5" r="2" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- Bookshelf / Interior Wall Context -->
  <rect x="20" y="40" width="90" height="12" rx="3" fill="#334155"/>
  <rect x="35" y="20" width="16" height="20" rx="2" fill="#f43f5e"/>
  <rect x="53" y="16" width="12" height="24" rx="2" fill="#0ea5e9"/>
  <rect x="67" y="22" width="20" height="18" rx="2" fill="#eab308"/>

  <!-- MAIN CHARACTER: Relaxed person enjoying the fresh, humid outdoor breeze from the window -->
  <g transform="translate(0, 10)">
    <!-- Character Chair -->
    <path d="M65,130 L95,130 L100,185 L60,185 Z" fill="#475569" filter="url(#softShadow)"/>
    <rect x="55" y="100" width="50" height="40" rx="6" fill="#64748b"/>

    <!-- Body / Torso (Comfortable green sweater) -->
    <path d="M70,115 Q90,110 110,115 L115,165 Q90,170 65,165 Z" fill="#0d9488"/>

    <!-- Arms resting naturally -->
    <path d="M70,118 Q55,135 60,155" stroke="#0d9488" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="60" cy="158" r="6" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Neck & Head -->
    <rect x="83" y="90" width="14" height="25" rx="5" fill="#fbcfe8"/>
    <circle cx="90" cy="85" r="20" fill="#fbcfe8"/>

    <!-- Hair (Stylish dark short hair) -->
    <path d="M70,82 Q90,60 110,82 Q105,95 105,85 Q90,75 75,85 Z" fill="#334155"/>

    <!-- Relaxed Happy Facial Expression (Eyes closed, gentle smile) -->
    <path d="M82,85 Q86,89 90,85" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M94,85 Q98,89 102,85" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M89,93 Q92,97 95,93" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Cozy Scarf (Adding warmth to contrast cool moisture) -->
    <path d="M78,102 Q90,112 102,102 L105,115 Q90,122 75,115 Z" fill="#f43f5e"/>
    <path d="M95,112 L98,135 L108,133 L102,110 Z" fill="#e11d48"/>
  </g>

  <!-- Large Open Window Frame with Misty Rain Atmosphere -->
  <!-- Window Sill -->
  <rect x="110" y="165" width="115" height="12" rx="3" fill="#cbd5e1" filter="url(#softShadow)"/>
  <rect x="115" y="157" width="105" height="8" rx="2" fill="#e2e8f0"/>

  <!-- Window Frame Structure -->
  <rect x="120" y="40" width="95" height="125" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="125" y="45" width="85" height="115" fill="#0284c7" opacity="0.2"/>

  <!-- Condensation / Water Droplets on Window Pane (Crucial for "湿润" / Humid) -->
  <g fill="#38bdf8" opacity="0.85">
    <!-- Big sliding drops -->
    <path d="M140,60 Q142,70 140,75 A2,2 0 1,1 136,75 Q134,70 140,60 Z"/>
    <path d="M185,90 Q187,105 185,112 A2.5,2.5 0 1,1 180,112 Q178,105 185,90 Z"/>
    <path d="M160,130 Q161,140 160,145 A2,2 0 1,1 156,145 Q155,140 160,130 Z"/>
    
    <!-- Small scattered condensation beads -->
    <circle cx="135" cy="52" r="2"/>
    <circle cx="150" cy="68" r="1.5"/>
    <circle cx="133" cy="95" r="2.5"/>
    <circle cx="170" cy="75" r="1.8"/>
    <circle cx="195" cy="60" r="2.2"/>
    <circle cx="190" cy="130" r="1.5"/>
    <circle cx="145" cy="140" r="2"/>
    <circle cx="175" cy="150" r="2.5"/>
  </g>

  <!-- Fog / Mist wisps floating past the window -->
  <path d="M125,100 Q150,90 175,105 Q195,115 210,100" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.15"/>
  <path d="M130,130 Q160,120 185,135 Q200,140 210,125" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.1"/>

  <!-- Outdoor Scenery through window: Soft blurry night trees/city lights in mist -->
  <circle cx="150" cy="110" r="8" fill="#fbbf24" opacity="0.6"/> <!-- Streetlight glowing through fog -->
  <path d="M125,145 L150,115 L175,145 Z" fill="#065f46" opacity="0.6"/> <!-- Pine Tree -->
  <path d="M160,150 L185,120 L210,150 Z" fill="#047857" opacity="0.5"/> <!-- Pine Tree -->

  <!-- Subtle floor reflection and cozy interior details -->
  <ellipse cx="90" cy="185" rx="40" ry="8" fill="#020617" opacity="0.5"/>
  
  <!-- Warm Teacup on windowsill for cozy human touch -->
  <g transform="translate(130, 145)">
    <rect x="0" y="4" width="10" height="12" rx="2" fill="#f8fafc"/>
    <path d="M10,7 Q14,7 14,10 Q14,13 10,13" stroke="#f8fafc" stroke-width="1.5" fill="none"/>
    <ellipse cx="5" cy="4" rx="5" ry="1.5" fill="#cbd5e1"/>
    <!-- Steam rising into the humid air -->
    <path d="M3,0 Q5,-4 3,-8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>