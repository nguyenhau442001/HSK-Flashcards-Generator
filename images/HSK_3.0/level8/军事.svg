<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090d16"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Hologram Screen Glow -->
    <linearGradient id="holoGrad" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="240" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Light Cone -->
    <linearGradient id="lightCone" x1="120" y1="0" x2="120" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- UI/Holo Grid Pattern -->
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>

    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Light Cone from above -->
  <polygon points="60,0 180,0 220,240 20,240" fill="url(#lightCone)"/>

  <!-- Background Environment & Props -->
  <g id="environment">
    <!-- Wall Panels / Blueprint Grid Lines -->
    <line x1="20" y1="40" x2="100" y2="40" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="140" y1="40" x2="220" y2="40" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="120" cy="40" r="12" fill="none" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Radar Sweep Arc Background -->
    <path d="M 70,80 A 60,60 0 0,1 170,80" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 6"/>
  </g>

  <!-- Central Work Desk / Command Console -->
  <g id="console-base">
    <!-- Desk Surface -->
    <path d="M 30,170 L 210,170 L 230,225 L 10,225 Z" fill="url(#tableGrad)"/>
    <path d="M 30,170 L 210,170" stroke="#475569" stroke-width="2"/>
    <!-- Console Glowing Edge -->
    <path d="M 10,225 L 230,225" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
  </g>

  <!-- Holographic Strategic Map (Centerpiece) -->
  <g id="hologram" transform="translate(0, 10)">
    <!-- Base Projector Emitter -->
    <ellipse cx="120" cy="170" rx="45" ry="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="120" cy="170" rx="30" ry="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <circle cx="120" cy="170" r="4" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Holographic Projection Cone -->
    <polygon points="120,95 75,170 165,170" fill="url(#holoGrad)"/>

    <!-- Floating Hologram Screen / Terrain Map -->
    <g transform="translate(0, -10)">
      <!-- Outer Hexagon Map Boundary -->
      <polygon points="120,80 165,100 165,140 120,160 75,140 75,100" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="120,85 158,102 158,138 120,155 82,138 82,102" fill="url(#grid)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.4"/>

      <!-- Tactical Relief Contours (Terrain) -->
      <path d="M 95,120 Q 110,105 130,125 T 145,115" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
      <path d="M 100,135 Q 120,120 135,130" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>

      <!-- Miniature 3D Vehicle Models on Hologram -->
      <!-- Recon Drone Icon (Floating) -->
      <g transform="translate(120, 100)">
        <ellipse cx="0" cy="0" rx="10" ry="4" fill="#38bdf8" filter="url(#glow)"/>
        <line x1="-14" y1="-4" x2="14" y2="4" stroke="#e2e8f0" stroke-width="1"/>
        <line x1="-14" y1="4" x2="14" y2="-4" stroke="#e2e8f0" stroke-width="1"/>
      </g>

      <!-- Tactical Vehicle / Tank Mini -->
      <g transform="translate(140, 130)">
        <rect x="-8" y="-4" width="16" height="8" rx="2" fill="#fb923c"/>
        <rect x="-5" y="-7" width="10" height="4" fill="#f59e0b"/>
        <line x1="0" y1="-5" x2="7" y2="-8" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Animated Radar Ping -->
      <circle cx="100" cy="125" r="8" fill="none" stroke="#ef4444" stroke-width="1.5" filter="url(#glow)">
        <animate attributeName="r" values="4;16" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="125" r="3" fill="#ef4444"/>
    </g>
  </g>

  <!-- Foreground Props: Tactical Gear & Documents -->
  <g id="foreground-props">
    <!-- Tactical Tablet / Data Pad -->
    <g transform="translate(35, 155) rotate(-10)">
      <rect x="0" y="0" width="35" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <rect x="4" y="6" width="27" height="25" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <!-- Chart lines on tablet -->
      <polyline points="7,24 13,17 19,20 27,12" fill="none" stroke="#10b981" stroke-width="1.5"/>
      <!-- Home button dot -->
      <circle cx="17.5" cy="38" r="2" fill="#475569"/>
    </g>

    <!-- Military Blueprint / Map Scroll -->
    <g transform="translate(165, 160) rotate(12)">
      <rect x="0" y="0" width="40" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Blueprint details -->
      <line x1="6" y1="8" x2="20" y2="8" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="6" y1="14" x2="30" y2="14" stroke="#64748b" stroke-width="1"/>
      <line x1="6" y1="20" x2="24" y2="20" stroke="#64748b" stroke-width="1"/>
      <circle cx="30" cy="22" r="4" fill="none" stroke="#ef4444" stroke-width="1"/>
    </g>

    <!-- Coffee Mug (Researcher's desk touch) -->
    <g transform="translate(195, 145)">
      <rect x="0" y="0" width="14" height="18" rx="2" fill="#334155" stroke="#64748b" stroke-width="1"/>
      <path d="M 14,3 C 18,3 19,9 14,12" fill="none" stroke="#334155" stroke-width="2"/>
      <!-- Steam -->
      <path d="M 4,-4 Q 6,-8 4,-12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M 10,-3 Q 8,-7 10,-10" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

  <!-- Ambient Light / Vignette Effect overlay -->
  <circle cx="120" cy="120" r="130" fill="none" stroke="#000000" stroke-width="16" opacity="0.4"/>
</svg>