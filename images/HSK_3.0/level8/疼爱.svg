<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm indoor light gradient -->
    <radialGradient id="lamp-glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Soft blush gradient for characters -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- ROOM ENVIRONMENT (BACKGROUND) -->
  <!-- Window with warm night glow -->
  <g opacity="0.6">
    <rect x="150" y="25" width="60" height="75" rx="8" fill="#334155" />
    <rect x="156" y="31" width="48" height="63" rx="4" fill="#1e293b" />
    <path d="M180 31 V94 M156 62 H204" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Wall shelf with cozy props -->
  <path d="M20 70 L90 70 L85 75 L25 75 Z" fill="#475569" />
  <!-- Small potted plant on shelf -->
  <path d="M35 70 L45 70 L43 58 L37 58 Z" fill="#cbd5e1" />
  <path d="M40 58 C35 55 35 45 40 45 C45 45 45 55 40 58 Z" fill="#10b981" />
  <path d="M40 58 C43 53 47 52 49 48 C46 54 42 56 40 58 Z" fill="#34d399" />
  <!-- Book stack on shelf -->
  <rect x="55" y="55" width="22" height="15" rx="2" fill="#38bdf8" />
  <rect x="57" y="50" width="18" height="5" rx="1" fill="#f43f5e" />

  <!-- Warm Floor Lamp (Right side context) -->
  <path d="M210 190 L210 50" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M195 50 L225 50 L217 30 L203 30 Z" fill="#f59e0b" />
  <ellipse cx="210" cy="190" rx="15" ry="5" fill="#475569" />

  <!-- Cozy Armchair -->
  <g filter="url(#shadow)">
    <!-- Chair back -->
    <path d="M20 100 C20 85 35 75 60 75 L110 75 C135 75 150 85 150 100 L150 170 C150 185 135 190 110 190 L60 190 C35 190 20 185 20 170 Z" fill="#3b82f6" />
    <!-- Chair seat cushion -->
    <path d="M15 145 C15 135 30 130 65 130 L115 130 C150 130 165 135 165 145 L165 165 C165 175 150 180 115 180 L65 180 C30 180 15 175 15 165 Z" fill="#60a5fa" />
    <!-- Chair arms -->
    <path d="M15 110 C10 110 5 120 5 135 L5 160 C5 175 15 180 25 180 L35 180 L35 130 C35 115 25 110 15 110 Z" fill="#2563eb" />
    <path d="M165 110 C170 110 175 120 175 135 L175 160 C175 175 165 180 155 180 L145 180 L145 130 C145 115 155 110 165 110 Z" fill="#2563eb" />
  </g>

  <!-- Wooden Floor -->
  <rect x="0" y="190" width="240" height="50" fill="#1e1b4b" />
  <path d="M0 190 L240 190" stroke="#090d16" stroke-width="3" />
  <!-- Floor planks line pattern -->
  <path d="M0 205 H240 M0 220 H240 M0 235 H240" stroke="#172554" stroke-width="1" opacity="0.5" />

  <!-- MAIN CHARACTERS: GRANDMOTHER & GRANDSON -->
  <g id="characters" filter="url(#shadow)">
    <!-- GRANDMOTHER (Left side, sitting, leaning forward affectionately) -->
    <g id="grandmother">
      <!-- Grandmother Body / Outfit -->
      <path d="M45 175 C40 150 55 130 75 130 C95 130 105 150 100 175 Z" fill="#7c3aed" /> <!-- Purple cardigan -->
      <path d="M60 145 H90" stroke="#ddd6fe" stroke-width="2" /> <!-- Cardigan trim -->

      <!-- Grandmother Head & Face -->
      <path d="M72 100 C58 100 52 112 55 125 C58 135 68 138 78 138 C88 138 95 135 98 125 C101 112 92 100 78 100 Z" fill="#fed7aa" />
      <!-- Silver Bun / Hair -->
      <circle cx="78" cy="94" r="18" fill="#e2e8f0" />
      <path d="M60 108 C65 98 90 98 98 108 C90 104 68 104 60 108 Z" fill="#cbd5e1" />
      <!-- Friendly Wrinkles & Gentle Eyes -->
      <path d="M68 116 Q73 119 78 116" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M84 116 Q89 119 94 116" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Warm Smile -->
      <path d="M78 123 Q82 128 86 123" stroke="#9a3412" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Rosy Cheeks (Teng'ai warmth) -->
      <circle cx="67" cy="122" r="6" fill="url(#blush)" />
      <circle cx="95" cy="122" r="6" fill="url(#blush)" />

      <!-- Grandmother Arms holding Grandson -->
      <path d="M65 140 C55 145 50 155 60 165 C68 172 85 165 95 150" fill="none" stroke="#7c3aed" stroke-width="12" stroke-linecap="round" />
      <!-- Hand gently touching grandson's cheek -->
      <circle cx="108" cy="140" r="7" fill="#fed7aa" />
    </g>

    <!-- GRANDSON (Right side, leaning into grandmother, smiling happily) -->
    <g id="grandson">
      <!-- Grandson Outfit / Torso -->
      <path d="M100 175 C95 150 110 135 125 135 C140 135 150 150 145 175 Z" fill="#0284c7" /> <!-- Bright blue hoodie -->

      <!-- Grandson Head -->
      <path d="M125 105 C112 105 108 115 112 128 C115 138 125 142 135 142 C145 142 152 138 155 128 C158 115 152 105 135 105 Z" fill="#ffedd5" />
      
      <!-- Playful Boy Hair (Dark Brown/Black) -->
      <path d="M112 115 C110 100 125 92 140 95 C152 98 158 108 156 120 C150 110 135 102 120 110 Z" fill="#334155" />
      <path d="M110 115 L118 120 L113 125 Z" fill="#334155" /> <!-- cute fringe -->

      <!-- Happy Closed Eyes (Curved upwards in joy) -->
      <path d="M120 120 Q125 115 130 120" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M138 120 Q143 115 148 120" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
      
      <!-- Big Happy Open Smile -->
      <path d="M128 128 Q135 136 142 128" fill="#e11d48" />
      <path d="M130 130 Q135 135 140 130" fill="#ffffff" /> <!-- teeth -->

      <!-- Big Rosy Cheeks of Delight -->
      <circle cx="118" cy="126" r="7" fill="url(#blush)" />
      <circle cx="150" cy="126" r="7" fill="url(#blush)" />

      <!-- Grandson Arms hugging / cozying up -->
      <path d="M115 150 C105 155 100 165 110 170 C120 175 135 165 135 150" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    </g>
  </g>

  <!-- FOREGROUND / INTERACTION DETAILS (FLAT VECTOR ACCENTS) -->
  <!-- Floating Hearts representing "疼爱" (Deep Affection & Care) -->
  <g id="affection-hearts" filter="url(#shadow)">
    <path d="M95 90 C95 82 85 75 80 82 C75 75 65 82 65 90 C65 100 80 110 80 110 C80 110 95 100 95 90 Z" fill="#fb7185" transform="scale(0.8) translate(30, 0)" />
    <path d="M135 70 C135 63 127 57 122 63 C117 57 109 63 109 70 C109 78 122 86 122 86 C122 86 135 78 135 70 Z" fill="#f43f5e" transform="scale(0.6) translate(80, 20)" />
    <path d="M75 60 C75 55 69 50 65 55 C61 50 55 55 55 60 C55 67 65 73 65 73 C65 73 75 67 75 60 Z" fill="#fda4af" transform="scale(0.5) translate(60, 20)" />
  </g>

  <!-- Cozy Tea Mug on small side table -->
  <g id="side-table">
    <ellipse cx="190" cy="175" rx="20" ry="8" fill="#334155" />
    <rect x="185" y="175" width="10" height="15" fill="#475569" />
    <!-- Mug -->
    <path d="M175 155 H187 V168 H175 Z" fill="#f8fafc" />
    <path d="M187 158 C192 158 192 165 187 165" stroke="#f8fafc" stroke-width="2" fill="none" />
    <!-- Steam swirls -->
    <path d="M178 150 Q181 145 178 140" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>
</svg>