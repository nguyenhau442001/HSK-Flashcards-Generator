<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f4a261" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting -->
  <circle cx="120" cy="120" r="120" fill="url(#lampGlow)" />

  <!-- Background Environment / Doctor's Office Interior -->
  <g id="environment">
    <!-- Wall Shelf with Medical Props -->
    <rect x="30" y="55" width="70" height="6" rx="3" fill="#334155" />
    <rect x="42" y="33" width="14" height="22" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="62" y="38" width="18" height="17" rx="2" fill="#10b981" opacity="0.8" />
    <circle cx="88" cy="45" r="7" fill="#f43f5e" opacity="0.8" />

    <!-- Eye Chart Poster on Wall -->
    <rect x="150" y="30" width="50" height="70" rx="4" fill="#f8fafc" />
    <circle cx="175" cy="45" r="8" fill="none" stroke="#0f172a" stroke-width="2" />
    <path d="M167 60 L183 60 M175 56 L175 64" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <path d="M165 75 L185 75 M170 70 L180 80" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <rect x="160" y="88" width="30" height="4" rx="2" fill="#94a3b8" />

    <!-- Desk / Counter Surface -->
    <rect x="0" y="195" width="240" height="45" fill="#0f172a" />
    <rect x="0" y="190" width="240" height="6" rx="2" fill="#334155" />

    <!-- Medical Lamp on Desk -->
    <path d="M190 190 L195 130 L210 120" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M202 114 L220 126" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Main Character (Patient sitting at the doctor's office) -->
  <g id="character">
    <!-- Body / Torso -->
    <path d="M80 210 C80 170 100 160 120 160 C140 160 160 170 160 210 Z" fill="#38bdf8" />
    <!-- Collar / Shirt Detail -->
    <path d="M105 160 L120 175 L135 160 Z" fill="#e2e8f0" />
    <!-- Jacket / Coat -->
    <path d="M80 175 L65 210 L95 210 Z" fill="#0284c7" />
    <path d="M160 175 L175 210 L145 210 Z" fill="#0284c7" />

    <!-- Neck -->
    <rect x="110" y="140" width="20" height="25" rx="10" fill="url(#skin)" />

    <!-- Head -->
    <circle cx="120" cy="115" r="32" fill="url(#skin)" />

    <!-- Hair -->
    <path d="M88 115 C88 90 100 80 120 80 C140 80 152 90 152 115 C152 120 148 110 140 100 C130 92 110 92 100 100 C92 110 88 115 88 115 Z" fill="#1e293b" />

    <!-- Eyebrows -->
    <!-- Left normal eyebrow -->
    <path d="M100 106 C105 103 112 103 116 106" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right relaxed eyebrow -->
    <path d="M128 106 C133 104 138 104 142 106" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Left Eye (Normal, Open, Looking Forward) -->
    <circle cx="108" cy="115" r="4" fill="#1e293b" />
    <circle cx="109.5" cy="113.5" r="1.5" fill="#ffffff" /> <!-- highlight -->

    <!-- Right Eye (Affected / Blind eye indicator: smooth milky scar / closed appearance with gentle white overlay) -->
    <!-- Closed/clouded eye curve -->
    <path d="M128 115 C132 118 138 118 142 115" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Subtle milky-white opacity overlay to denote the impaired vision on one eye -->
    <ellipse cx="135" cy="115" rx="6" ry="4" fill="#cbd5e1" opacity="0.7" />

    <!-- Nose -->
    <path d="M117 116 Q122 124 125 119" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mouth (Neutral/Calm expression) -->
    <path d="M112 130 C116 133 124 133 128 130" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />

    <!-- Hand gently raising to touch/indicate the eye area -->
    <path d="M135 150 C145 145 155 130 145 120 C142 117 138 122 140 126 C143 130 140 135 135 140 Z" fill="url(#skin)" />
    <!-- Fingers -->
    <circle cx="146" cy="119" r="3.5" fill="url(#skin)" />
  </g>

  <!-- Foreground Props (Doctor's Clipboard / Tabletop items) -->
  <g id="foreground-props">
    <!-- Clipboard on Desk -->
    <rect x="40" y="200" width="45" height="30" rx="3" transform="rotate(-10 40 200)" fill="#f8fafc" />
    <rect x="55" y="195" width="15" height="8" rx="2" transform="rotate(-10 40 200)" fill="#64748b" />
    <line x1="48" y1="210" x2="70" y2="206" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="46" y1="216" x2="65" y2="212" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

    <!-- Medical Stethoscope resting on desk -->
    <path d="M95 215 C100 205 110 205 115 215 C120 225 130 225 135 210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="115" cy="215" r="6" fill="#94a3b8" />
  </g>
</svg>