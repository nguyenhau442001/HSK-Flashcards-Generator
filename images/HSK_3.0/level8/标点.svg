<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(40, 40)">
    <!-- Desk Surface -->
    <rect x="0" y="120" width="160" height="40" rx="8" fill="#334155"/>
    
    <!-- Large Antique Fountain Pen -->
    <path d="M20 130 L140 100 L145 105 L25 135 Z" fill="#fbbf24"/>
    <path d="M140 100 L155 115 L145 105 Z" fill="#f59e0b"/>
    
    <!-- The "Subject": Expressive Punctuation Marks as physical objects -->
    <!-- A large 3D comma (douhao) -->
    <path d="M60 60 C60 90, 80 100, 70 110 C65 115, 60 110, 65 100 Z" fill="#38bdf8"/>
    
    <!-- A large 3D period (juhào) -->
    <circle cx="110" cy="100" r="12" fill="#ec4899"/>
    
    <!-- A large 3D exclamation mark (gantanhào) -->
    <rect x="150" y="30" width="12" height="50" rx="4" fill="#10b981"/>
    <circle cx="156" cy="95" r="8" fill="#10b981"/>
    
    <!-- Decorative elements: Ink splatters -->
    <circle cx="40" cy="40" r="4" fill="#fb923c" opacity="0.6"/>
    <circle cx="180" cy="60" r="3" fill="#fb923c" opacity="0.6"/>
    <path d="M100 20 L105 25 L100 30 L95 25 Z" fill="#fb923c" opacity="0.6"/>
  </g>
</svg>