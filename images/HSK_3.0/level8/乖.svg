<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm Light Beam for "Good Child / Obedient" atmosphere -->
    <linearGradient id="warm-light" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Child Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd1a9"/>
      <stop offset="100%" stop-color="#fbc294"/>
    </linearGradient>

    <!-- Pajama Gradient (Cozy Blue) -->
    <linearGradient id="pajama" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Blanket Gradient -->
    <linearGradient id="blanket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Bed Frame & Pillow -->
    <linearGradient id="pillow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-glow)"/>

  <!-- Warm Light Beam from Lamp -->
  <polygon points="120,40 50,220 190,220" fill="url(#warm-light)"/>

  <!-- SCENE: BEDROOM ENVIRONMENT -->
  <!-- Wallpaper / Wall Details (Subtle Stars & Moon) -->
  <g fill="#334155" opacity="0.4">
    <circle cx="40" cy="50" r="1.5"/>
    <circle cx="70" cy="30" r="2"/>
    <circle cx="190" cy="45" r="1"/>
    <circle cx="210" cy="80" r="2"/>
  </g>

  <!-- Crescent Moon on Wall -->
  <path d="M 195 30 A 12 12 0 0 1 210 45 A 14 14 0 0 0 195 30 Z" fill="#fbbf24" opacity="0.7"/>

  <!-- Bed Headboard -->
  <rect x="35" y="85" width="170" height="110" rx="16" fill="#334155"/>
  <rect x="42" y="92" width="156" height="96" rx="12" fill="#1e293b"/>

  <!-- Bedside Table (Left) -->
  <rect x="15" y="140" width="30" height="60" rx="4" fill="#475569"/>
  <!-- Bedside Lamp -->
  <path d="M 22 140 L 25 120 L 33 120 L 36 140 Z" fill="#fbbf24" filter="url(#glow)"/>
  <path d="M 29 120 L 29 105" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 105 Q 29 95 38 105 Z" fill="#38bdf8"/>

  <!-- Bedding: Mattress -->
  <rect x="30" y="125" width="180" height="85" rx="12" fill="#e2e8f0"/>

  <!-- Pillow -->
  <rect x="45" y="132" width="60" height="25" rx="10" fill="url(#pillow)"/>
  <!-- Teddy Bear sitting neatly beside pillow, looking 'ngoan' too -->
  <g transform="translate(170, 125)">
    <circle cx="12" cy="12" r="10" fill="#d97706"/> <!-- Bear Head -->
    <circle cx="6" cy="7" r="4" fill="#b45309"/>  <!-- Left Ear -->
    <circle cx="18" cy="7" r="4" fill="#b45309"/> <!-- Right Ear -->
    <circle cx="12" cy="14" r="5" fill="#fde68a"/> <!-- Snout -->
    <circle cx="12" cy="13" r="1" fill="#451a03"/> <!-- Nose -->
    <rect x="6" y="20" width="12" height="14" rx="4" fill="#d97706"/> <!-- Body -->
  </g>

  <!-- MAIN SUBJECT: THE CHILD SLEEPING PEACEFULLY / "NGOAN" (OBEDIENT/GOOD) -->
  <g id="sleeping-child">
    <!-- Child's Head resting on pillow -->
    <circle cx="85" cy="150" r="22" fill="url(#skin)"/>

    <!-- Hair (Cute brown tufts) -->
    <path d="M 68 142 Q 75 125 90 130 Q 102 133 105 145 Q 98 138 88 138 Z" fill="#451a03"/>

    <!-- Peaceful Closed Eyes (Happy curved lines) -->
    <path d="M 85 148 Q 88 152 91 148" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 75 148 Q 78 152 81 148" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Gentle Blush -->
    <circle cx="74" cy="154" r="4" fill="#f43f5e" opacity="0.4"/>
    <circle cx="94" cy="154" r="4" fill="#f43f5e" opacity="0.4"/>

    <!-- Smiling peaceful mouth -->
    <path d="M 83 157 Q 85 160 88 157" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Pajama Body tucked under blanket -->
    <rect x="70" y="165" width="45" height="35" rx="8" fill="url(#pajama)"/>
    <!-- Collar -->
    <path d="M 80 165 L 85 173 L 90 165" stroke="#e0f2fe" stroke-width="2" fill="none"/>

    <!-- Arms folded neatly on top of blanket -->
    <path d="M 72 175 Q 85 180 98 175" stroke="url(#pajama)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Hands tucked nicely -->
    <circle cx="85" cy="178" r="5" fill="url(#skin)"/>
  </g>

  <!-- Blanket covering the child nicely -->
  <path d="M 50 210 Q 70 160 120 165 Q 180 170 200 210 Z" fill="url(#blanket)"/>
  <!-- Blanket pattern (Cute white stars on blanket) -->
  <g fill="#ffffff" opacity="0.8">
    <polygon points="90,185 92,190 97,191 93,195 94,200 90,197 86,200 87,195 83,191 88,190" transform="scale(0.3) translate(220, 540)"/>
    <polygon points="90,185 92,190 97,191 93,195 94,200 90,197 86,200 87,195 83,191 88,190" transform="scale(0.25) translate(420, 660)"/>
    <polygon points="90,185 92,190 97,191 93,195 94,200 90,197 86,200 87,195 83,191 88,190" transform="scale(0.35) translate(300, 480)"/>
  </g>

  <!-- ATMOSPHERIC "NGOAN" VIBES (Floating peaceful symbols, Zzz & glowing stars) -->
  <g filter="url(#glow)">
    <!-- Sleeping Zzz -->
    <text x="105" y="130" font-family="sans-serif" font-weight="bold" font-size="14" fill="#38bdf8" opacity="0.9">Z</text>
    <text x="115" y="118" font-family="sans-serif" font-weight="bold" font-size="16" fill="#38bdf8" opacity="0.7">z</text>
    <text x="125" y="105" font-family="sans-serif" font-weight="bold" font-size="20" fill="#38bdf8" opacity="0.5">z</text>

    <!-- Floating magic/good vibe sparkles -->
    <path d="M 60 90 L 63 97 L 70 100 L 63 103 L 60 110 L 57 103 L 50 100 L 57 97 Z" fill="#fbbf24"/>
    <path d="M 150 70 L 152 74 L 156 75 L 152 76 L 150 80 L 148 76 L 144 75 L 148 74 Z" fill="#34d399"/>
    <path d="M 175 140 L 177 144 L 181 145 L 177 146 L 175 150 L 173 146 L 169 145 L 173 144 Z" fill="#f472b6"/>
  </g>

  <!-- Foreground Floor / Rug touch -->
  <ellipse cx="120" cy="215" rx="90" ry="10" fill="#0f172a" opacity="0.6"/>

  <!-- Outer frame border for polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#475569" stroke-width="2" opacity="0.5"/>
</svg>