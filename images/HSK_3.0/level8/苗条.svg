<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Mirror Reflection -->
    <linearGradient id="mirrorReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Outfit Gradient -->
    <linearGradient id="outfitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Wallpaper Stripe Details -->
  <path d="M 0,0 L 0,240" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <path d="M 60,0 L 60,240" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <path d="M 120,0 L 120,240" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <path d="M 180,0 L 180,240" stroke="#334155" stroke-width="1" opacity="0.3"/>

  <!-- Wooden Floor -->
  <path d="M 0,180 L 240,180 L 240,240 L 0,240 Z" fill="url(#floorGrad)"/>
  <path d="M 0,180 L 240,180" stroke="#475569" stroke-width="2"/>
  <path d="M 0,200 L 240,200" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  <path d="M 0,220 L 240,220" stroke="#1e293b" stroke-width="1" opacity="0.5"/>

  <!-- Light Beam from Window -->
  <polygon points="180,0 240,0 240,220 80,180" fill="url(#lightBeam)"/>

  <!-- Potted Plant (Left Context) -->
  <g transform="translate(25, 130)">
    <!-- Pot -->
    <path d="M 8,20 L 22,20 L 26,50 L 4,50 Z" fill="#fb923c" filter="url(#dropShadow)"/>
    <ellipse cx="15" cy="20" rx="7" ry="2" fill="#fdba74"/>
    <!-- Plant Stems & Leaves -->
    <path d="M 15,20 Q 15,5 5,-5" fill="none" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15,20 Q 25,5 30,-10" fill="none" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15,20 Q 10,0 20,-15" fill="none" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="5" cy="-5" r="5" fill="#10b981"/>
    <circle cx="30" cy="-10" r="6" fill="#059669"/>
    <circle cx="20" cy="-15" r="5.5" fill="#34d399"/>
  </g>

  <!-- Full-length Standing Mirror (Centerpiece representing the figure) -->
  <g transform="translate(130, 25)" filter="url(#dropShadow)">
    <!-- Mirror Stand / Base -->
    <ellipse cx="35" cy="158" rx="25" ry="5" fill="#0f172a" opacity="0.6"/>
    <path d="M 25,150 L 45,150 L 50,158 L 20,158 Z" fill="#64748b"/>
    <path d="M 32,130 L 38,130 L 38,150 L 32,150 Z" fill="#94a3b8"/>

    <!-- Mirror Oval Frame -->
    <rect x="5" y="0" width="60" height="135" rx="30" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <!-- Mirror Glass Surface -->
    <rect x="9" y="4" width="52" height="127" rx="26" fill="#1e293b"/>

    <!-- REFLECTED SLENDER FIGURE INSIDE MIRROR -->
    <g transform="translate(9, 4)">
      <!-- Soft reflection gradient base inside mirror -->
      <rect width="52" height="127" rx="26" fill="url(#mirrorReflect)"/>

      <!-- Graceful Slender Woman Silhouette / Character -->
      <!-- Head -->
      <circle cx="26" cy="30" r="8" fill="#fcd34d"/>
      <!-- Hair flow -->
      <path d="M 18,28 Q 26,18 34,28 Q 36,40 32,45 L 20,45 Q 16,40 18,28 Z" fill="#334155"/>

      <!-- Thon thả (Slender) Torso & Dress -->
      <!-- Elegant curved slender body lines -->
      <path d="M 22,44 C 20,55 21,70 23,85 L 29,85 C 31,70 32,55 30,44 Z" fill="url(#outfitGrad)"/>
      <!-- Slender Arms (posing gracefully) -->
      <path d="M 22,46 Q 14,55 18,65" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
      <path d="M 30,46 Q 38,55 34,65" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>

      <!-- Long Slender Legs -->
      <path d="M 24,85 C 23,100 24,115 23,123" fill="none" stroke="#fcd34d" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 28,85 C 29,100 28,115 29,123" fill="none" stroke="#fcd34d" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Mirror Diagonal Sheen Effect -->
      <path d="M 10,0 L 35,0 L 15,127 L 9,127 Z" fill="#ffffff" opacity="0.1"/>
    </g>
  </g>

  <!-- Foreground Interior Props: Modern Stool & Fashion Bag -->
  <!-- Minimalist Stool (Left-Center) -->
  <g transform="translate(65, 145)" filter="url(#dropShadow)">
    <ellipse cx="20" cy="38" rx="18" ry="4" fill="#0f172a" opacity="0.4"/>
    <!-- Stool Legs -->
    <path d="M 8,8 L 4,35" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 32,8 L 36,35" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <!-- Stool Seat -->
    <ellipse cx="20" cy="8" rx="16" ry="6" fill="#f59e0b"/>
    <ellipse cx="20" cy="6" rx="16" ry="6" fill="#fbbf24"/>
  </g>

  <!-- Chic Handbag resting near stool -->
  <g transform="translate(45, 160)" filter="url(#dropShadow)">
    <path d="M 10,12 Q 10,2 18,2 L 26,2 Q 34,2 34,12 Z" fill="none" stroke="#ec4899" stroke-width="2.5"/>
    <rect x="6" y="12" width="30" height="20" rx="4" fill="#f43f5e"/>
    <path d="M 16,12 L 16,16 Q 21,20 26,16 L 26,12" fill="none" stroke="#fb7185" stroke-width="2"/>
  </g>

  <!-- Ambient Golden Accent Lighting / Sparkles representing elegance -->
  <g fill="#fbbf24">
    <circle cx="110" cy="70" r="1.5" opacity="0.8"/>
    <circle cx="118" cy="62" r="1" opacity="0.6"/>
    <circle cx="112" cy="110" r="2" opacity="0.7"/>
    <!-- Four-point star sparkle -->
    <path d="M 115,40 Q 115,45 120,45 Q 115,45 115,50 Q 115,45 110,45 Q 115,45 115,40 Z" fill="#f59e0b"/>
    <path d="M 50,70 Q 50,73 53,73 Q 50,73 50,76 Q 50,73 47,73 Q 50,73 50,70 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

</svg>