<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Background room glow and environment -->
  <path d="M0 0h240v240H0z" fill="url(#bg-grad)"/>
  
  <!-- Window and background details -->
  <rect x="156" y="24" width="60" height="75" rx="8" fill="#1e293b" opacity="0.6"/>
  <path d="M166 34h40v55h-40z" fill="#334155" opacity="0.3"/>
  <path d="M186 34v55M166 61h40" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Bookshelf on wall -->
  <rect x="24" y="30" width="80" height="10" rx="3" fill="#334155"/>
  <rect x="34" y="15" width="12" height="15" rx="2" fill="#38bdf8" opacity="0.7"/>
  <rect x="50" y="12" width="14" height="18" rx="2" fill="#ec4899" opacity="0.7"/>
  <rect x="68" y="17" width="10" height="13" rx="2" fill="#fbbf24" opacity="0.7"/>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="desk-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lamp-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Warm desk lamp light cone -->
  <polygon points="120,40 60,210 180,210" fill="url(#lamp-glow)"/>

  <!-- Desk Surface -->
  <path d="M12 210h216v6a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8v-6z" fill="url(#desk-grad)"/>
  <rect x="20" y="216" width="200" height="14" fill="#0f172a" opacity="0.4"/>

  <!-- Desk Lamp -->
  <path d="M120 40v30" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M105 38h30l-5-15h-20z" fill="#cbd5e1"/>
  <circle cx="120" cy="40" r="3" fill="#64748b"/>

  <!-- Laptop -->
  <path d="M70 175h100l10 30H60l10-30z" fill="#64748b"/>
  <path d="M75 180h90v22H75z" fill="#1e293b"/>
  <!-- Screen interface showing a document line being crossed out / skipped (illustrating omission/shortcut) -->
  <rect x="85" y="130" width="70" height="48" rx="4" fill="#f8fafc"/>
  <rect x="92" y="138" width="40" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="92" y="148" width="55" height="5" rx="2.5" fill="#cbd5e1"/>
  <!-- Highlighted text line being omitted/crossed out -->
  <rect x="92" y="158" width="50" height="5" rx="2.5" fill="#ef4444" opacity="0.3"/>
  <path d="M90 160h55" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Scissors cutting/skipping symbol indication or pointer -->
  <circle cx="152" cy="160" r="12" fill="#fb923c" opacity="0.2"/>

  <!-- Coffee Mug -->
  <rect x="185" y="185" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M201 190c4 0 4 8 0 8" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Character (Student/Editor sitting at desk, thoughtful expression pointing/editing) -->
  <!-- Chair back -->
  <path d="M100 130h40v80h-40z" fill="#334155" rx="6"/>

  <!-- Character Body & Shoulders -->
  <path d="M90 215c0-25 15-35 30-35s30 10 30 35z" fill="#38bdf8"/>
  <!-- Collar -->
  <path d="M110 180l10 12 10-12" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Character Neck -->
  <rect x="114" y="166" width="12" height="16" fill="#fed7aa"/>

  <!-- Character Head -->
  <circle cx="120" cy="142" r="22" fill="#fed7aa"/>
  
  <!-- Hair (Stylish dark hair cut) -->
  <path d="M98 142c0-14 10-24 22-24s22 10 22 24c0 3-2 3-2 3H100s-2 0-2-3z" fill="#334155"/>
  <path d="M98 142c3 8 10 12 22 12s19-4 22-12" fill="#334155"/>

  <!-- Face details (Thoughtful, making a decision to omit) -->
  <circle cx="112" cy="144" r="2" fill="#1e293b"/>
  <circle cx="128" cy="144" r="2" fill="#1e293b"/>
  <!-- Gentle confident smile -->
  <path d="M116 154q4 4 8 0" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="109" cy="148" r="3" fill="#f43f5e" opacity="0.3"/>
  <circle cx="131" cy="148" r="3" fill="#f43f5e" opacity="0.3"/>

  <!-- Hand pointing at the screen / laptop keyboard -->
  <path d="M135 185c10 2 18-5 22-12l4 8c-4 7-12 10-20 10z" fill="#fed7aa"/>
  
  <!-- Floating energetic decision spark / check badge showing sentence can be skipped -->
  <g transform="translate(155, 105)">
    <circle cx="0" cy="0" r="16" fill="#10b981"/>
    <path d="M-6 -1l4 4 8-9" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M145 118l6 8" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
</svg>