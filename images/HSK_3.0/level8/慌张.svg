<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Desk Light -->
    <radialGradient id="deskLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Shadow -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior & Environment (Desk, Wall, Window) -->
  <g id="environment">
    <!-- Back Wall -->
    <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4" />
    
    <!-- Ambient Light Cone -->
    <rect x="20" y="20" width="200" height="150" fill="url(#deskLight)" />

    <!-- Floor -->
    <path d="M 20 170 L 220 170 L 230 220 L 10 220 Z" fill="url(#floorGrad)" />
    <!-- Floor Planks / Lines -->
    <line x1="20" y1="185" x2="220" y2="185" stroke="#0b0f19" stroke-width="1.5" opacity="0.6" />
    <line x1="15" y1="202" x2="225" y2="202" stroke="#0b0f19" stroke-width="1.5" opacity="0.6" />

    <!-- Window with night city view -->
    <rect x="35" y="35" width="50" height="75" rx="6" fill="#090d16" stroke="#334155" stroke-width="3" />
    <!-- City silhouette in window -->
    <rect x="42" y="70" width="8" height="40" fill="#1e293b" />
    <rect x="53" y="60" width="12" height="50" fill="#1e293b" />
    <rect x="68" y="75" width="10" height="35" fill="#1e293b" />
    <!-- Window pane cross -->
    <line x1="60" y1="35" x2="60" y2="110" stroke="#334155" stroke-width="2" />
    <line x1="35" y1="72" x2="85" y2="72" stroke="#334155" stroke-width="2" />
    <!-- Rain drops outside window -->
    <line x1="45" y1="45" x2="43" y2="52" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <line x1="75" y1="55" x2="73" y2="62" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />

    <!-- Wall Shelf with Prop -->
    <rect x="135" y="55" width="70" height="6" rx="2" fill="#475569" />
    <circle cx="150" cy="45" r="10" fill="#10b981" />
    <path d="M 146 42 Q 150 35 154 42 Z" fill="#ec4899" />
    <rect x="170" y="38" width="12" height="17" rx="2" fill="#f59e0b" />
  </g>

  <!-- Office Desk and Chaotic Flying Props -->
  <g id="desk-and-props">
    <!-- Desk Surface -->
    <path d="M 40 145 L 200 145 L 215 168 L 25 168 Z" fill="#334155" filter="url(#shadow)" />
    <!-- Desk Edge Highlight -->
    <path d="M 38 143 L 202 143 L 200 146 L 40 146 Z" fill="#64748b" />
    <!-- Desk Left Leg -->
    <rect x="48" y="168" width="10" height="52" fill="#1e293b" />
    <!-- Desk Right Leg -->
    <rect x="182" y="168" width="10" height="52" fill="#1e293b" />

    <!-- Flying/Falling Chaotic Items (Representing "Panic") -->
    <!-- Coffee Mug (Tipping Over) -->
    <g transform="translate(165, 120) rotate(-35)">
      <rect x="0" y="0" width="18" height="22" rx="3" fill="#ef4444" />
      <path d="M 18 6 C 24 6 24 16 18 16" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
      <!-- Splashing Coffee Drops -->
      <circle cx="-10" cy="15" r="3" fill="#78350f" />
      <circle cx="-18" cy="8" r="2" fill="#78350f" />
      <path d="M -5 18 Q -10 22 -15 17" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Flying Papers -->
    <path d="M 130 95 L 148 100 L 142 118 L 124 113 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)" />
    <path d="M 133 98 L 145 101 M 135 105 L 143 107" stroke="#94a3b8" stroke-width="1" />

    <path d="M 75 110 L 95 102 L 102 118 L 82 126 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)" transform="rotate(15 88 114)" />
    
    <!-- Laptop (Open, screen glowing) -->
    <g transform="translate(80, 125)">
      <!-- Base -->
      <path d="M -15 15 L 45 15 L 55 25 L -25 25 Z" fill="#64748b" />
      <!-- Screen -->
      <path d="M -12 15 L 42 15 L 37 -15 L -7 -15 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <!-- Screen Glow / Alert UI -->
      <rect x="-2" y="-10" width="34" height="20" rx="2" fill="#ef4444" opacity="0.8" />
      <circle cx="15" cy="0" r="5" fill="#fef08a" />
    </g>

    <!-- Desk Lamp -->
    <path d="M 190 145 L 180 110 L 165 95" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 155 85 L 175 90 L 168 102 Z" fill="#f59e0b" />
    <ellipse cx="166" cy="101" rx="8" ry="3" fill="#fbbf24" opacity="0.8" />
  </g>

  <!-- Main Character: Panicked Young Woman (Huāngzhāng - Luống cuống, hoảng loạn) -->
  <g id="panicked-character" transform="translate(10, 0)">
    <!-- Chair Back -->
    <rect x="95" y="85" width="30" height="65" rx="6" fill="#475569" filter="url(#shadow)" />
    <rect x="101" y="95" width="18" height="45" rx="3" fill="#334155" />

    <!-- Character Body (Leaning forward in panic) -->
    <!-- Torso -->
    <path d="M 95 115 C 95 100 115 100 125 115 L 130 155 C 130 160 100 165 95 155 Z" fill="#38bdf8" filter="url(#shadow)" />
    <!-- Collar -->
    <path d="M 104 115 L 112 125 L 120 115 Z" fill="#f8fafc" />

    <!-- Left Arm (Flailing upward in shock) -->
    <path d="M 98 118 Q 75 100 65 85" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <!-- Left Hand -->
    <circle cx="62" cy="81" r="7" fill="url(#skinGrad)" filter="url(#shadow)" />

    <!-- Right Arm (Clutching head in panic) -->
    <path d="M 122 118 Q 135 100 128 85" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <!-- Right Hand on Head -->
    <circle cx="125" cy="80" r="7" fill="url(#skinGrad)" filter="url(#shadow)" />

    <!-- Neck -->
    <path d="M 105 102 L 115 102 L 113 90 L 107 90 Z" fill="url(#skinGrad)" />

    <!-- Head & Hair (Windswept/Jolted) -->
    <g id="head" transform="translate(110, 75)">
      <!-- Hair Back / Volume -->
      <path d="M -22 -15 C -25 -35 25 -35 28 -15 C 32 5 28 25 18 28 C 8 30 -10 30 -18 25 C -25 20 -20 0 -22 -15 Z" fill="url(#hairGrad)" />

      <!-- Face Base -->
      <path d="M -15 -10 C -15 15 15 15 15 -10 C 15 -20 -15 -20 -15 -10 Z" fill="url(#skinGrad)" />

      <!-- Shocked Expression (Eyes wide, mouth open in gasp) -->
      <!-- Eyebrows raised high -->
      <path d="M -12 -14 Q -7 -18 -3 -14" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M 3 -14 Q 7 -18 12 -14" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

      <!-- Wide Eyes & Sweat Drops -->
      <circle cx="-7" cy="-7" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="-7" cy="-7" r="1.5" fill="#0f172a" />
      <circle cx="7" cy="-7" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="7" cy="-7" r="1.5" fill="#0f172a" />

      <!-- Nervous Sweat Drop on Forehead -->
      <path d="M 12 -18 C 12 -18 16 -12 16 -9 C 16 -7 14 -5 12 -5 C 10 -5 8 -7 8 -9 C 8 -12 12 -18 12 -18 Z" fill="#38bdf8" opacity="0.85" />
      <!-- Second Sweat Drop (Flying off) -->
      <path d="M -18 -22 C -18 -22 -15 -18 -15 -15 C -15 -13 -17 -12 -18 -12 C -19 -12 -21 -13 -21 -15 C -21 -18 -18 -22 -18 -22 Z" fill="#38bdf8" opacity="0.85" />

      <!-- Gasping Mouth (Oval shape, frantic) -->
      <ellipse cx="0" cy="4" rx="4.5" ry="6.5" fill="#0f172a" />
      <path d="M -4.5 2 Q 0 0 4.5 2" stroke="#f43f5e" stroke-width="1.5" fill="none" />

      <!-- Rosy Cheeks (Panic flush) -->
      <ellipse cx="-11" cy="-1" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3" />
      <ellipse cx="11" cy="-1" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3" />

      <!-- Hair Front / Bangs (Jolted upward) -->
      <path d="M -16 -16 C -10 -25 0 -22 8 -24 C 12 -25 15 -18 15 -18 C 15 -18 5 -12 -4 -15 C -10 -17 -16 -16 -16 -16 Z" fill="url(#hairGrad)" />
      <!-- Loose Hair Strand Flying -->
      <path d="M 12 -20 Q 22 -28 25 -22" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Panic / Motion Effect Lines (Around the character to show erratic movement) -->
    <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <path d="M 45 75 Q 40 85 43 95" fill="none" />
      <path d="M 150 70 Q 158 80 152 92" fill="none" />
      <line x1="50" y1="120" x2="40" y2="125" />
      <line x1="150" y1="115" x2="160" y2="110" />
    </g>
  </g>

  <!-- Foreground / Ambient Overlay Dust & Sparks for Energy -->
  <g id="sparks-and-dust" opacity="0.8">
    <circle cx="35" cy="130" r="2" fill="#fbbf24" />
    <circle cx="205" cy="90" r="1.5" fill="#38bdf8" />
    <circle cx="115" cy="50" r="2" fill="#f43f5e" />
    <circle cx="195" cy="195" r="1.5" fill="#f8fafc" />
    <circle cx="65" cy="190" r="2" fill="#38bdf8" />
  </g>
</svg>