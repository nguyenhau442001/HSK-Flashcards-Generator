<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Desk and Clock -->
  <rect x="20" y="140" width="200" height="80" rx="8" fill="#334155"/>
  <circle cx="180" cy="60" r="25" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <line x1="180" y1="60" x2="180" y2="45" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="60" x2="195" y2="60" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Character: Mother -->
  <!-- Body -->
  <path d="M80 180 C80 140, 160 140, 160 180 L160 240 L80 240 Z" fill="#38bdf8"/>
  
  <!-- Arms/Hands (Holding head in worry) -->
  <path d="M90 150 Q70 120, 90 100" fill="none" stroke="#fca5a5" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 150 Q170 120, 150 100" fill="none" stroke="#fca5a5" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="120" cy="100" r="25" fill="#fca5a5"/>
  
  <!-- Facial Expression: Worry -->
  <path d="M105 95 Q110 85, 115 95" fill="none" stroke="#1e293b" stroke-width="2"/>
  <path d="M125 95 Q130 85, 135 95" fill="none" stroke="#1e293b" stroke-width="2"/>
  <path d="M110 115 Q120 122, 130 115" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Props on Desk -->
  <rect x="40" y="160" width="40" height="50" rx="4" fill="#fb923c"/>
  <rect x="170" y="170" width="30" height="40" rx="4" fill="#10b981"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="100" r="40" fill="#fbbf24" opacity="0.05"/>
</svg>