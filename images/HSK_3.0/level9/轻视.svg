<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Architecture / Background Studio Details -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2" opacity="0.5"/>
  
  <!-- Ambient background glow elements -->
  <circle cx="120" cy="90" r="70" fill="#1e293b" opacity="0.6"/>

  <!-- SCENE GRAPHIC: "Coi thường" (Looking down on someone / Dismissive attitude) -->
  <!-- We depict a haughty character leaning back on a modern desk/podium, looking dismissively down at a small, earnest character with an invention/blueprint. -->

  <!-- Desk / Platform Setup -->
  <!-- Large Sleek Desk -->
  <path d="M40 175 L200 175 L180 140 L60 140 Z" fill="#475569" filter="url(#shadow)"/>
  <path d="M50 175 L190 175 L185 145 L55 145 Z" fill="#64748b"/>
  <!-- Desk front panel accent -->
  <path d="M70 175 L170 175 L165 145 L75 145 Z" fill="#334155"/>
  <line x1="60" y1="140" x2="180" y2="140" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Prop on Desk: Blueprint / Dismissed Project -->
  <g transform="translate(85, 130) rotate(-5)">
    <rect x="0" y="0" width="35" height="25" rx="2" fill="#e2e8f0"/>
    <path d="M5 8 L30 8 M5 13 L20 13 M5 18 L25 18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="27" cy="18" r="4" fill="#fb923c"/>
  </g>

  <!-- Character 1: The Arrogant/Dismissive Person (Seated/Leaning high on right) -->
  <g id="arrogant-character">
    <!-- Body/Torso in suit -->
    <path d="M165 145 C160 120 185 105 190 90 C195 75 180 65 170 70 C160 75 155 85 150 95 L135 130 Z" fill="#0284c7" filter="url(#shadow)"/>
    <!-- Collar & Tie -->
    <path d="M165 78 L175 88 L170 95 Z" fill="#f8fafc"/>
    <path d="M170 88 L173 105 L168 105 Z" fill="#ef4444"/>

    <!-- Head & Hair -->
    <circle cx="175" cy="62" r="16" fill="#fcd34d"/>
    <!-- Sleek Hair -->
    <path d="M159 62 C159 50 175 44 188 52 C185 47 175 46 165 50 Z" fill="#1e293b"/>

    <!-- Arrogant Facial Expression: Smirk / Half-closed eye / Looking down -->
    <!-- Eyebrow raised / angled critically -->
    <path d="M166 57 L182 60" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Closed/Dismissive Eye (downward curve) -->
    <path d="M168 64 C172 67 178 67 182 64" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Smirk (one side raised) -->
    <path d="M172 72 C176 75 180 73 182 70" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Arms crossed dismissively -->
    <path d="M150 95 C140 100 130 110 145 125 C155 135 175 120 175 120" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand resting on arm -->
    <circle cx="147" cy="118" r="6" fill="#fcd34d"/>
  </g>


  <!-- Character 2: The Earnest Person Being Dismissed (Standing on left, looking up) -->
  <g id="dismissed-character">
    <!-- Body/Torso -->
    <path d="M75 175 L75 135 C75 125 85 120 90 120 C95 120 105 125 105 135 L105 175 Z" fill="#10b981" filter="url(#shadow)"/>
    
    <!-- Head -->
    <circle cx="90" cy="105" r="14" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M78 102 C78 92 90 90 102 96 C98 92 88 92 82 96 Z" fill="#b45309"/>

    <!-- Expression: Hurt, earnest, looking up -->
    <!-- Wide hopeful/sad eyes looking up-right -->
    <circle cx="95" cy="104" r="2.5" fill="#1e293b"/>
    <circle cx="87" cy="104" r="2.5" fill="#1e293b"/>
    <!-- Worried/pouting mouth -->
    <path d="M89 113 Q91 110 93 113" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Hands holding paperwork / gesture of offering -->
    <path d="M75 145 C65 145 60 135 70 130" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <circle cx="68" cy="128" r="5" fill="#fcd34d"/>
  </g>

  <!-- Visual Metaphor Elements: Dismissal / Wave / Rejection Aura -->
  <!-- Subtle dynamic action lines indicating the cold shoulder/dismissal -->
  <path d="M 130 85 Q 145 90 135 105" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.7"/>
  <path d="M 138 75 Q 155 82 142 98" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.4"/>

  <!-- Foreground Atmospheric Elements / Glows -->
  <!-- Golden warm highlight accentuating the snubbed creative work -->
  <circle cx="100" cy="140" r="18" fill="#fbbf24" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Additional Studio Environment Details -->
  <!-- Floating ambient particles for depth -->
  <circle cx="40" cy="80" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="55" cy="65" r="1.5" fill="#f43f5e" opacity="0.4"/>
  <circle cx="210" cy="110" r="2.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="200" cy="45" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="30" cy="130" r="1.5" fill="#10b981" opacity="0.5"/>

  <!-- Border Frame / Matte Accent -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>