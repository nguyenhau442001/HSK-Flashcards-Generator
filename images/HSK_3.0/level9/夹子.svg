<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="paperHighlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Implied desk surface - subtle, dark -->
  <rect x="0" y="170" width="240" height="70" fill="#1a2434"/>

  <!-- Papers - multiple layers for depth and slight irregularity -->
  <!-- Bottom paper -->
  <rect x="40" y="85" width="160" height="120" rx="8" fill="#334155"/>
  <!-- Middle paper -->
  <rect x="45" y="75" width="155" height="115" rx="7" fill="#475569"/>
  <!-- Top stack of papers -->
  <path d="M55 65 L195 60 L190 160 L50 165 Z" fill="#e2e8f0"/>
  <path d="M57 67 L193 62 L188 158 L52 163 Z" fill="#f1f5f9"/>
  <path d="M59 69 L191 64 L186 156 L54 161 Z" fill="#f8fafc"/>

  <!-- Binder Clip -->
  <!-- Clip body - dark -->
  <path d="M95 75 L145 75 L155 95 L85 95 Z" fill="#1a202c"/>
  <!-- Clip arms - metallic -->
  <path d="M90 90 L70 125 L75 130 L95 95 Z" fill="#94a3b8"/>
  <path d="M150 90 L170 125 L165 130 L145 95 Z" fill="#94a3b8"/>
  
  <!-- Highlights on clip arms -->
  <path d="M91 91 L72 123 L76 127 L95 96 Z" fill="#a7b8c9" opacity="0.7"/>
  <path d="M149 91 L168 123 L164 127 L145 96 Z" fill="#a7b8c9" opacity="0.7"/>

  <!-- Subtle shadow from clip onto papers -->
  <path d="M95 75 L145 75 L155 95 L85 95 Z" fill="#000" opacity="0.2" transform="translate(2,2)"/>

  <!-- Warm glow effect - from top left -->
  <circle cx="50" cy="50" r="100" fill="#f59e0b" opacity="0.08"/>
  <circle cx="60" cy="60" r="80" fill="#fbbf24" opacity="0.06"/>
  
  <!-- Highlight on the top paper from the glow -->
  <path d="M59 69 L191 64 L186 156 L54 161 Z" fill="url(#paperHighlightGradient)"/>
</svg>