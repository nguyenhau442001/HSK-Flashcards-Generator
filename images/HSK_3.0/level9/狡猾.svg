<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Subtle ground/shadows -->
  <path d="M0 200 C60 180, 180 180, 240 200 L240 240 L0 240 Z" fill="#141d2e"/>
  <path d="M0 210 C60 195, 180 195, 240 210 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>

  <!-- Moon/light source glow (subtle) -->
  <circle cx="200" cy="40" r="30" fill="#fbbf24" opacity="0.08"/>
  <circle cx="200" cy="40" r="15" fill="#fbbf24" opacity="0.15"/>

  <!-- Foliage/Bush (midground, to hide behind) -->
  <path d="M-10 240 C30 180, 100 170, 150 190 C180 200, 200 180, 250 190 L250 240 Z" fill="#1a364d"/>
  <path d="M-10 240 C20 190, 80 180, 130 195 C160 205, 180 185, 230 195 L230 240 Z" fill="#10b981" opacity="0.2"/>


  <!-- Fox body - partially hidden, peeking from right -->
  <g transform="translate(60, 50)">
    <!-- Main body -->
    <path d="M100 150 C130 140, 150 100, 140 70 C130 40, 90 30, 60 50 C30 70, 20 110, 50 140 C70 155, 90 155, 100 150 Z" fill="#fb923c"/>
    <!-- Belly/Chest light part -->
    <path d="M55 135 C65 145, 80 145, 90 135 C95 130, 90 115, 80 105 C70 95, 60 100, 55 110 Z" fill="#fbbf24"/>
    <!-- Tail -->
    <path d="M130 130 C150 110, 170 120, 160 140 C150 160, 120 160, 130 130 Z" fill="#fb923c"/>
    <path d="M150 135 C155 140, 150 145, 145 140 C140 135, 145 130, 150 135 Z" fill="#fbbf24"/> <!-- Tail tip -->

    <!-- Head - more prominent side profile -->
    <path d="M60 50 C75 30, 100 30, 110 50 C120 70, 100 80, 80 75 C60 70, 50 60, 60 50 Z" fill="#fb923c"/>
    <!-- Muzzle -->
    <path d="M75 65 C85 60, 95 60, 100 65 C105 70, 95 75, 85 75 C75 75, 70 70, 75 65 Z" fill="#fbbf24"/>
    <!-- Nose -->
    <circle cx="88" cy="65" r="3" fill="#0f172a"/>
    <!-- Ear 1 (closer) -->
    <path d="M65 45 C70 35, 80 35, 85 45 L75 50 Z" fill="#fb923c"/>
    <path d="M75 47 L70 40 L78 40 Z" fill="#0f172a"/> <!-- Inner ear -->
    <!-- Ear 2 (further, slightly obscured) -->
    <path d="M90 47 C95 37, 105 37, 110 47 L100 52 Z" fill="#fb923c"/>
    <path d="M100 49 L95 42 L103 42 Z" fill="#0f172a" opacity="0.7"/> <!-- Inner ear -->

    <!-- Eye - cunning expression -->
    <path d="M85 55 C90 53, 95 55, 93 58 C91 61, 86 60, 85 55 Z" fill="#0f172a"/>
    <circle cx="90" cy="56" r="1.5" fill="#fbbf24"/> <!-- Eye glint -->
    <path d="M85 55 C88 54, 91 54, 93 55" stroke="#0f172a" stroke-width="1" fill="none"/> <!-- Eyelid for slyness -->

    <!-- Mouth (subtle smirk) -->
    <path d="M80 70 C85 72, 90 72, 95 70" stroke="#0f172a" stroke-width="1" fill="none"/>
  </g>

  <!-- More foreground foliage to enhance hiding effect -->
  <path d="M0 240 C50 210, 100 200, 150 210 C200 220, 250 200, 250 240 Z" fill="#1a364d"/>
  <path d="M-10 240 C40 220, 90 210, 140 220 C190 230, 240 210, 240 240 Z" fill="#10b981" opacity="0.15"/>
  <path d="M100 240 C130 220, 180 210, 220 220 C250 230, 260 210, 260 240 Z" fill="#1a364d" opacity="0.8"/>
  <path d="M120 240 C150 225, 190 215, 230 225 C260 235, 270 215, 270 240 Z" fill="#10b981" opacity="0.1"/>

</svg>