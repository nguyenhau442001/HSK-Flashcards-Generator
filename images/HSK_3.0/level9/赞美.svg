<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Stage Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Glow for Applause/Praise -->
    <radialGradient id="goldGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Gradients -->
    <linearGradient id="heroSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <linearGradient id="crowd1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="crowd2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="crowd3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environment & Lighting Background -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />
  <circle cx="120" cy="140" r="90" fill="url(#goldGlow)" />

  <!-- Stage Platform & Interior Details -->
  <path d="M 40 195 L 200 195 L 215 215 L 25 215 Z" fill="#0f172a" opacity="0.9" />
  <path d="M 25 215 L 215 215 L 215 220 L 25 220 Z" fill="#334155" />
  
  <!-- Ambient Sparkles / Praise Symbols (Abstract celebratory confetti) -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="85" cy="55" r="2.5" />
    <circle cx="160" cy="45" r="2" />
    <circle cx="185" cy="85" r="3" />
    <circle cx="55" cy="95" r="2" />
    <!-- Star sparkles -->
    <path d="M 140 35 L 142 41 L 148 43 L 142 45 L 140 51 L 138 45 L 132 43 L 138 41 Z" fill="#fde047" />
    <path d="M 95 75 L 96.5 79.5 L 101 81 L 96.5 82.5 L 95 87 L 93.5 82.5 L 89 81 L 93.5 79.5 Z" fill="#fde047" />
    <path d="M 165 105 L 166 108 L 169 109 L 166 110 L 165 113 L 164 110 L 161 109 L 164 108 Z" fill="#fde047" />
  </g>

  <!-- Crowd Background Layer (Left & Right Audiences clapping/cheering) -->
  <g id="crowd-left">
    <!-- Person 1 (Far Left) -->
    <circle cx="35" cy="170" r="12" fill="#334155" />
    <path d="M 20 200 C 20 185, 50 185, 50 200" fill="url(#crowd1)" />
    <!-- Raised Hands Clapping -->
    <circle cx="28" cy="158" r="4" fill="#f8fafc" />
    <circle cx="38" cy="155" r="4" fill="#f8fafc" />
  </g>

  <g id="crowd-right">
    <!-- Person 2 (Far Right) -->
    <circle cx="205" cy="170" r="12" fill="#334155" />
    <path d="M 190 200 C 190 185, 220 185, 220 200" fill="url(#crowd3)" />
    <!-- Raised Hands Clapping -->
    <circle cx="198" cy="155" r="4" fill="#f8fafc" />
    <circle cx="208" cy="158" r="4" fill="#f8fafc" />
  </g>

  <g id="crowd-mid-left">
    <!-- Person 3 (Mid Left) -->
    <circle cx="65" cy="165" r="14" fill="#475569" />
    <path d="M 47 200 C 47 180, 83 180, 83 200" fill="url(#crowd2)" />
    <circle cx="58" cy="150" r="4.5" fill="#f8fafc" />
    <circle cx="70" cy="148" r="4.5" fill="#f8fafc" />
  </g>

  <g id="crowd-mid-right">
    <!-- Person 4 (Mid Right) -->
    <circle cx="175" cy="165" r="14" fill="#475569" />
    <path d="M 157 200 C 157 180, 193 180, 193 200" fill="url(#crowd1)" />
    <circle cx="170" cy="148" r="4.5" fill="#f8fafc" />
    <circle cx="182" cy="150" r="4.5" fill="#f8fafc" />
  </g>

  <!-- MAIN HERO SUBJECT (Standing tall, confident, modest, representing "courage/勇气" being praised) -->
  <g id="hero-character" transform="translate(0, 5)">
    <!-- Shadow beneath hero -->
    <ellipse cx="120" cy="192" rx="22" ry="6" fill="#090d16" opacity="0.6" />

    <!-- Legs -->
    <rect x="110" y="155" width="8" height="38" rx="4" fill="#1e293b" />
    <rect x="122" y="155" width="8" height="38" rx="4" fill="#1e293b" />
    <ellipse cx="114" cy="193" rx="5" ry="2.5" fill="#0f172a" />
    <ellipse cx="126" cy="193" rx="5" ry="2.5" fill="#0f172a" />

    <!-- Torso (Suit / Hero Outfit) -->
    <path d="M 102 115 L 138 115 L 142 158 L 98 158 Z" fill="url(#heroSuit)" />
    <!-- Shirt collar & Tie -->
    <polygon points="120,115 114,125 126,125" fill="#f8fafc" />
    <polygon points="118,125 122,125 123,142 120,146 117,142" fill="#f43f5e" />

    <!-- Arms (One hand touching chest in humble/grateful gesture for the praise) -->
    <!-- Left Arm (Relaxed at side) -->
    <path d="M 102 118 L 92 145 L 97 147 L 105 125 Z" fill="#2563eb" />
    <circle cx="95" cy="149" r="4" fill="#ffedd5" />

    <!-- Right Arm (Hand gesturing on chest, showing appreciation) -->
    <path d="M 138 118 L 145 138 L 138 142 L 134 125 Z" fill="#2563eb" />
    <circle cx="132" cy="141" r="4" fill="#ffedd5" />

    <!-- Head & Face -->
    <circle cx="120" cy="95" r="16" fill="#ffedd5" />
    
    <!-- Hair (Neat, modern dark hair) -->
    <path d="M 104 95 C 104 80, 110 77, 120 77 C 130 77, 136 80, 136 95 C 134 90, 132 83, 120 83 C 108 83, 106 90, 104 95 Z" fill="#1e293b" />
    
    <!-- Facial expression: Smiling warmly, eyes closed happily -->
    <path d="M 113 93 Q 116 90 119 93" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 121 93 Q 124 90 127 93" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Warm smile -->
    <path d="M 116 100 Q 120 104 124 100" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Cheeks blushing with pride/joy -->
    <circle cx="111" cy="98" r="3" fill="#fda4af" opacity="0.6" />
    <circle cx="129" cy="98" r="3" fill="#fda4af" opacity="0.6" />
  </g>

  <!-- Foreground Atmospheric Elements (Subtle bokeh/light particles) -->
  <circle cx="75" cy="135" r="1.5" fill="#38bdf8" opacity="0.5" />
  <circle cx="165" cy="135" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="105" cy="45" r="1.5" fill="#f43f5e" opacity="0.5" />
</svg>