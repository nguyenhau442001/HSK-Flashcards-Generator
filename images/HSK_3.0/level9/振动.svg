<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Smartphone Screen Glow -->
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Room Elements -->
  <!-- Wallpaper accent line -->
  <line x1="0" y1="110" x2="240" y2="110" stroke="#334155" stroke-width="2" />
  
  <!-- Bookshelf in background -->
  <rect x="25" y="45" width="40" height="65" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="70" x2="65" y2="70" stroke="#334155" stroke-width="2" />
  <rect x="33" y="52" width="8" height="15" rx="2" fill="#ec4899" opacity="0.8" />
  <rect x="43" y="50" width="10" height="17" rx="2" fill="#38bdf8" opacity="0.8" />
  <rect x="33" y="78" width="14" height="14" rx="2" fill="#10b981" opacity="0.8" />

  <!-- Wall Clock showing late hour -->
  <circle cx="200" cy="70" r="18" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <circle cx="200" cy="70" r="2" fill="#94a3b8" />
  <line x1="200" y1="70" x2="200" y2="58" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="200" y1="70" x2="210" y2="74" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Warm Desk Lamp -->
  <circle cx="185" cy="115" r="35" fill="url(#lamp-glow)" />
  <path d="M175 110 L195 110 L205 135 L165 135 Z" fill="#f59e0b" />
  <path d="M185 110 L185 85" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M170 85 L200 85" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

  <!-- Desk Surface -->
  <path d="M10 160 L230 160 L220 200 L20 200 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <rect x="15" y="150" width="210" height="10" rx="3" fill="#334155" />

  <!-- VIBRATION MOTION LINES (Crucial for "振动") -->
  <!-- Left Side Vibration -->
  <path d="M22 145 C18 147 18 153 22 155" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M16 142 C11 146 11 154 16 158" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" fill="none" />
  
  <!-- Right Side Vibration -->
  <path d="M218 145 C222 147 222 153 218 155" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M224 142 C229 146 229 154 224 158" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" fill="none" />

  <!-- Under Desk Wobble Blur/Lines -->
  <path d="M90 160 L95 168" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M150 160 L145 168" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Objects on the Desk -->
  <!-- Coffee Mug -->
  <rect x="175" y="130" width="18" height="22" rx="3" fill="#cbd5e1" />
  <path d="M193 135 C198 135 198 145 193 147" stroke="#cbd5e1" stroke-width="2.5" fill="none" />
  <!-- Coffee Ripples (Showing vibration) -->
  <ellipse cx="184" cy="132" rx="7" ry="2" fill="#38bdf8" opacity="0.5" />
  <path d="M181 132 Q184 130 187 132" stroke="#0f172a" stroke-width="1" fill="none" />

  <!-- Laptop (Closed) -->
  <rect x="110" y="142" width="45" height="10" rx="2" fill="#64748b" />
  <rect x="105" y="152" width="55" height="4" rx="1" fill="#475569" />

  <!-- RUNGING/VIBRATING SMARTPHONE (Center Stage Focus) -->
  <g transform="translate(92, 125)">
    <!-- Phone Screen Glow Backdrop -->
    <circle cx="15" cy="15" r="25" fill="url(#screen-glow)" />
    
    <!-- Phone Body (Tilted slightly to show dynamic movement) -->
    <rect x="0" y="0" width="30" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" transform="rotate(-8 15 18)" />
    
    <!-- Phone Screen Active Display -->
    <rect x="3" y="3" width="24" height="30" rx="4" fill="#1e293b" transform="rotate(-8 15 18)" />
    
    <!-- Incoming Call UI abstract shapes on screen -->
    <circle cx="15" cy="14" r="5" fill="#38bdf8" transform="rotate(-8 15 18)" />
    <rect x="9" y="23" width="12" height="3" rx="1.5" fill="#10b981" transform="rotate(-8 15 18)" />

    <!-- Sound/Vibration Waves Emanating from Phone -->
    <path d="M-6 8 C-10 12 -10 20 -6 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M-11 4 C-17 10 -17 22 -11 28" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" fill="none" />
    
    <path d="M36 8 C40 12 40 20 36 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M41 4 C47 10 47 22 41 28" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Surprised Character Leaning In (Only Hands & Arms visible interacting with desk) -->
  <!-- Character Left Arm -->
  <path d="M10 185 C25 175 40 165 55 160" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Left Hand / Fingers gripping edge -->
  <circle cx="55" cy="158" r="7" fill="#fed7aa" />

  <!-- Character Right Arm -->
  <path d="M230 180 C210 170 190 163 175 160" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Right Hand / Fingers gripping edge -->
  <circle cx="175" cy="158" r="7" fill="#fed7aa" />

  <!-- Action lines on table surface emphasizing the shake -->
  <path d="M 75 150 Q 80 148 85 150" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M 155 150 Q 160 152 165 150" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Floating dust / kinetic particles adding atmosphere -->
  <circle cx="75" cy="115" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="140" cy="100" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="165" cy="125" r="1" fill="#fbbf24" opacity="0.9" />
  <circle cx="85" cy="135" r="1.5" fill="#38bdf8" opacity="0.7" />

</svg>