<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Classroom Desk 1 -->
  <rect x="30" y="140" width="80" height="15" rx="2" fill="#475569"/>
  <rect x="35" y="155" width="5" height="40" fill="#334155"/>
  <rect x="100" y="155" width="5" height="40" fill="#334155"/>
  
  <!-- Classroom Desk 2 -->
  <rect x="130" y="110" width="80" height="15" rx="2" fill="#475569"/>
  <rect x="135" y="125" width="5" height="40" fill="#334155"/>
  <rect x="200" y="125" width="5" height="40" fill="#334155"/>
  
  <!-- Student 1 (Front) -->
  <circle cx="70" cy="120" r="15" fill="#fde68a"/>
  <path d="M55 135 Q70 150 85 135" stroke="#fde68a" stroke-width="4" fill="none"/>
  <rect x="55" y="135" width="30" height="40" rx="5" fill="#38bdf8"/>
  
  <!-- Student 2 (Back) -->
  <circle cx="170" cy="90" r="15" fill="#fde68a"/>
  <path d="M155 105 Q170 120 185 105" stroke="#fde68a" stroke-width="4" fill="none"/>
  <rect x="155" y="105" width="30" height="40" rx="5" fill="#ec4899"/>
  
  <!-- The Book being passed -->
  <rect x="100" y="115" width="30" height="20" rx="2" fill="#fbbf24"/>
  <line x1="105" y1="120" x2="125" y2="120" stroke="#78350f" stroke-width="2"/>
  <line x1="105" y1="125" x2="125" y2="125" stroke="#78350f" stroke-width="2"/>
  
  <!-- Motion Lines -->
  <path d="M85 125 Q95 115 105 120" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  
  <!-- Hand reaching -->
  <path d="M85 130 L100 125" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  <path d="M130 120 L150 110" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Classroom Details -->
  <rect x="20" y="200" width="200" height="5" rx="2" fill="#334155"/>
  <circle cx="210" cy="40" r="10" fill="#10b981" opacity="0.3"/>
</svg>