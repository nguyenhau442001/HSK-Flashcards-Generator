<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Warm Spotlight for Action Center -->
    <radialGradient id="spotlight" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Teapot Gradients -->
    <linearGradient id="teapotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="teapotLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Cup Gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character Outfit -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd9c0" />
      <stop offset="100%" stop-color="#fbc39b" />
    </linearGradient>

    <!-- Shadow Soft Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- SCENE CONTEXT & PROPS (Cozy Desk Environment) -->
  <g id="environment">
    <!-- Back Wall & Shelf Line -->
    <path d="M 0,160 L 240,160" stroke="#334155" stroke-width="2" stroke-dasharray="6,4" opacity="0.5" />
    <!-- Wooden Desk Surface -->
    <path d="M 0,175 Q 120,165 240,175 L 240,240 L 0,240 Z" fill="#1e1b4b" />
    <path d="M 0,175 Q 120,165 240,175 L 240,182 Q 120,172 0,182 Z" fill="#312e81" opacity="0.7" />

    <!-- Background Props (Books & Plant) -->
    <rect x="25" y="130" width="18" height="30" rx="2" fill="#059669" />
    <rect x="45" y="125" width="14" height="35" rx="2" fill="#d97706" />
    <rect x="200" y="135" width="22" height="25" rx="3" fill="#4f46e5" />
    <!-- Small House Plant -->
    <path d="M 195,160 L 205,160 L 203,145 L 197,145 Z" fill="#cbd5e1" />
    <circle cx="200" cy="140" r="8" fill="#10b981" />
    <circle cx="194" cy="144" r="6" fill="#059669" />
    <circle cx="206" cy="143" r="6" fill="#34d399" />
  </g>

  <!-- MAIN CHARACTER & ACTION (Calming the Overreaction) -->
  <g id="main-character" filter="url(#dropShadow)">
    <!-- Character Body / Torso -->
    <path d="M 95,215 C 90,190 100,170 120,170 C 140,170 150,190 145,215 Z" fill="url(#shirtGrad)" />
    <!-- Collar -->
    <path d="M 110,170 L 120,185 L 130,170 Z" fill="#ffffff" opacity="0.9" />

    <!-- Neck -->
    <rect x="113" y="155" width="14" height="20" fill="url(#skinGrad)" />

    <!-- Head -->
    <circle cx="120" cy="135" r="26" fill="url(#skinGrad)" />

    <!-- Hair -->
    <path d="M 95,130 C 93,110 110,105 125,105 C 142,105 148,118 147,135 C 147,135 142,120 125,120 C 108,120 95,130 95,130 Z" fill="#0f172a" />
    <path d="M 98,135 Q 105,122 115,125" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Face Expression: Amused / Gentle Head Shake / Reassurance -->
    <!-- Closed Happy Eyes (Curved up) -->
    <path d="M 108,135 Q 112,130 116,135" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 124,135 Q 128,130 132,135" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheeks -->
    <circle cx="107" cy="140" r="4" fill="#fb7185" opacity="0.6" />
    <circle cx="133" cy="140" r="4" fill="#fb7185" opacity="0.6" />
    <!-- Gentle Smile -->
    <path d="M 116,144 Q 120,149 124,144" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Arms & Gesture: Right hand reassuringly waving / open palm -->
    <!-- Right Arm -->
    <path d="M 143,185 Q 165,175 160,155" stroke="#7c3aed" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Right Hand Open -->
    <circle cx="160" cy="150" r="6" fill="url(#skinGrad)" />
    
    <!-- Left Arm holding resting pose -->
    <path d="M 97,185 Q 80,185 85,165" stroke="#7c3aed" stroke-width="10" stroke-linecap="round" fill="none" />
    <circle cx="85" cy="160" r="6" fill="url(#skinGrad)" />
  </g>

  <!-- THE COMICAL/DRAMATIC INCIDENT OBJECTS (Spilled Tea & Minor Mess) -->
  <g id="incident-objects">
    <!-- Saucer -->
    <ellipse cx="120" cy="195" rx="32" ry="10" fill="#cbd5e1" filter="url(#dropShadow)" />
    <ellipse cx="120" cy="193" rx="28" ry="8" fill="#e2e8f0" />

    <!-- Teacup (Tipped Over / Spilling slightly for comedic effect of "minor issue") -->
    <g transform="translate(138, 178) rotate(25)">
      <path d="M -10,-12 L 10,-12 L 8,12 C 8,15 5,17 0,17 C -5,17 -8,15 -8,12 Z" fill="url(#cupGrad)" filter="url(#dropShadow)" />
      <!-- Cup Rim -->
      <ellipse cx="0" cy="-12" rx="10" ry="3" fill="#7dd3fc" />
      <!-- Handle -->
      <path d="M 8,-6 C 14,-6 14,2 8,6" stroke="#0284c7" stroke-width="3" fill="none" />
    </g>

    <!-- Splashing/Spilled Tea Droplets & Puddle (Representing the "small thing" one shouldn't overreact to) -->
    <ellipse cx="105" cy="202" rx="18" ry="5" fill="#f59e0b" opacity="0.7" />
    <ellipse cx="103" cy="202" rx="12" ry="3" fill="#fbbf24" opacity="0.9" />

    <!-- Flying Tea Drops & Steam -->
    <circle cx="128" cy="168" r="3" fill="#fbbf24" />
    <circle cx="145" cy="162" r="2" fill="#fbbf24" />
    
    <!-- Gentle Steam Wisps from the spilled warmth -->
    <path d="M 98,192 C 95,185 102,175 97,165" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" fill="none" />
    <path d="M 110,195 C 107,188 114,178 109,168" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" fill="none" />
  </g>

  <!-- SECONDARY PROP: Cute Teapot (The culprit of the tiny spill) -->
  <g id="teapot" filter="url(#dropShadow)">
    <ellipse cx="65" cy="175" rx="16" ry="6" fill="#cbd5e1" opacity="0.3" />
    <!-- Pot Body -->
    <circle cx="65" cy="162" r="15" fill="url(#teapotBody)" />
    <!-- Lid -->
    <ellipse cx="65" cy="148" rx="8" ry="3" fill="url(#teapotLid)" />
    <circle cx="65" cy="143" r="2.5" fill="#fbbf24" />
    <!-- Spout -->
    <path d="M 50,158 C 38,155 35,145 32,140" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Handle -->
    <path d="M 80,158 C 88,158 88,168 80,170" stroke="#be123c" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- VIVID ATMOSPHERIC EFFECTS / EMOTIONAL SPARKLES -->
  <g id="fx-sparkles" opacity="0.9">
    <!-- Emitting a sense of "Relax! No big deal!" energy -->
    <!-- Star 1 (Top Right) -->
    <path d="M 175,100 L 178,108 L 186,111 L 178,114 L 175,122 L 172,114 L 164,111 L 172,108 Z" fill="#fbbf24" />
    <!-- Star 2 (Small Upper Left) -->
    <path d="M 75,90 L 77,95 L 82,97 L 77,99 L 75,104 L 73,99 L 68,97 L 73,95 Z" fill="#38bdf8" transform="scale(0.7) translate(30, 20)" />
    <!-- Floating calming bubbles/dots -->
    <circle cx="160" cy="128" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="88" cy="120" r="4" fill="#fbbf24" opacity="0.7" />
    <circle cx="145" cy="95" r="2" fill="#10b981" opacity="0.9" />
  </g>

  <!-- FOREGROUND VIGNETTE FRAME ACCENT -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />
</svg>