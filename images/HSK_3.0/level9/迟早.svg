<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Plant pot representing growth over time -->
  <path d="M80 180 L160 180 L150 220 L90 220 Z" fill="#fb923c"/>
  <path d="M85 180 L155 180 L145 215 L95 215 Z" fill="#ea580c"/>
  
  <!-- Soil -->
  <ellipse cx="120" cy="180" rx="40" ry="10" fill="#475569"/>
  
  <!-- The Seedling (Small) -->
  <path d="M120 180 L120 140" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 150 C 135 140, 135 120, 120 120 C 105 120, 105 140, 120 150" fill="#10b981"/>
  
  <!-- The Mature Plant (Ghosted/Future) -->
  <path d="M180 180 L180 80" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
  <path d="M180 100 C 205 80, 205 50, 180 50 C 155 50, 155 80, 180 100" fill="#38bdf8" opacity="0.4"/>
  
  <!-- Sun/Time indicator -->
  <circle cx="50" cy="50" r="25" fill="#f59e0b"/>
  <path d="M50 15 L50 5 M85 50 L95 50 M50 85 L50 95 M15 50 L5 50" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Hourglass elements -->
  <path d="M190 190 L220 190 L205 210 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M190 170 L220 170 L205 150 Z" fill="#ec4899" opacity="0.8"/>
  <line x1="205" y1="170" x2="205" y2="190" stroke="#ec4899" stroke-width="2" stroke-dasharray="2 4"/>
</svg>