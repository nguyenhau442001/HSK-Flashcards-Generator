<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Mine Shaft/Cave Gradient -->
    <linearGradient id="caveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Coal Lump Gradient -->
    <linearGradient id="coalGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Wagon Metal -->
    <linearGradient id="wagonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Cave Environment / Background -->
  <path d="M0,240 L0,80 Q60,50 120,70 T240,60 L240,240 Z" fill="url(#caveGrad)" />
  
  <!-- Wooden Beams Support Structure (Mining Context) -->
  <path d="M30,240 L30,90 L45,95 L45,240 Z" fill="#78350f" />
  <path d="M210,240 L210,80 L195,85 L195,240 Z" fill="#78350f" />
  <path d="M20,95 L220,75 L220,90 L20,110 Z" fill="#92400e" />

  <!-- Geological Strata Lines (representing "region resources") -->
  <path d="M0,130 Q80,120 160,150 T240,135 L240,165 Q160,180 80,155 T0,175 Z" fill="#1e1b4b" opacity="0.6" />
  <path d="M0,175 Q80,155 160,185 T240,165 L240,195 Q160,210 80,185 T0,205 Z" fill="#090d16" opacity="0.8" />

  <!-- Ambient Light from Miner's Lamp -->
  <circle cx="100" cy="115" r="70" fill="url(#lampGlow)" style="mix-blend-mode: screen;" />

  <!-- Mining Cart (Resource Container) Filled with Coal -->
  <!-- Rails -->
  <rect x="70" y="215" width="130" height="4" rx="2" fill="#64748b" />
  <rect x="75" y="221" width="120" height="3" rx="1.5" fill="#475569" />
  <!-- Wheels -->
  <circle cx="95" cy="213" r="10" fill="#334155" />
  <circle cx="95" cy="213" r="4" fill="#94a3b8" />
  <circle cx="175" cy="213" r="10" fill="#334155" />
  <circle cx="175" cy="213" r="4" fill="#94a3b8" />
  <!-- Wagon Body -->
  <path d="M80,175 L90,210 L180,210 L190,175 Z" fill="url(#wagonGrad)" />
  <path d="M75,170 L195,170 L190,178 L80,178 Z" fill="#38bdf8" />
  
  <!-- Coal Chunks in Wagon (Target: 煤炭 - coal resources) -->
  <path d="M90,170 Q95,150 115,160 Q135,145 150,165 Q175,150 185,170 Z" fill="url(#coalGrad)" stroke="#64748b" stroke-width="1.5" />
  <circle cx="110" cy="160" r="12" fill="url(#coalGrad)" stroke="#475569" stroke-width="1" />
  <circle cx="135" cy="155" r="15" fill="url(#coalGrad)" stroke="#475569" stroke-width="1" />
  <circle cx="160" cy="162" r="13" fill="url(#coalGrad)" stroke="#475569" stroke-width="1" />

  <!-- Character: Geologist / Miner inspecting the resources -->
  <!-- Torso & Safety Vest -->
  <path d="M125,180 L145,130 L165,145 L155,210 L130,210 Z" fill="#f59e0b" />
  <path d="M135,155 L155,140 L160,170 L140,180 Z" fill="#d97706" />
  <!-- Arm pointing at coal -->
  <path d="M140,145 Q115,155 105,145" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
  <!-- Hand -->
  <circle cx="102" cy="144" r="5" fill="#fbcfe8" />

  <!-- Head & Hard Hat -->
  <!-- Face -->
  <circle cx="135" cy="115" r="14" fill="#fbcfe8" />
  <!-- Smile / Expression of discovery -->
  <path d="M138,121 Q143,126 148,121" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round" />
  <!-- Eye -->
  <circle cx="143" cy="113" r="2.5" fill="#881337" />
  <!-- Hard Hat -->
  <path d="M115,108 Q135,90 155,108 Z" fill="#fbbf24" />
  <rect x="112" y="106" width="48" height="5" rx="2.5" fill="#f59e0b" />
  <!-- Headlamp on Hat -->
  <rect x="130" y="100" width="12" height="8" rx="3" fill="#e2e8f0" />
  <circle cx="136" cy="104" r="3" fill="#38bdf8" />

  <!-- Foreground details: Natural Rock Formation & Extra Coal Chunks on Ground -->
  <path d="M0,240 L0,210 Q25,200 50,220 T100,240 Z" fill="#334155" />
  
  <!-- Loose Coal Rocks on the floor symbolizing abundant resources -->
  <path d="M40,225 Q45,215 55,220 Q65,218 60,230 Q45,235 40,225 Z" fill="url(#coalGrad)" stroke="#64748b" stroke-width="1" />
  <path d="M15,230 Q20,220 30,225 Q35,235 20,238 Z" fill="url(#coalGrad)" stroke="#64748b" stroke-width="1" />

  <!-- Sparkles / Resource Richness Indicator (Clean vector UI-like accents without text) -->
  <g transform="translate(155, 95)">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#38bdf8" />
  </g>
  <g transform="translate(115, 135)">
    <path d="M0,-5 L1.5,-1.5 L5,0 L1.5,1.5 L0,5 L-1.5,1.5 L-5,0 L-1.5,-1.5 Z" fill="#38bdf8" />
  </g>

  <!-- Atmospheric Dust / Particle Effects -->
  <circle cx="85" cy="100" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="170" cy="115" r="2" fill="#fbbf24" opacity="0.4" />
  <circle cx="120" cy="85" r="1" fill="#fbbf24" opacity="0.8" />
  <circle cx="190" cy="140" r="1.5" fill="#fbbf24" opacity="0.5" />
</svg>