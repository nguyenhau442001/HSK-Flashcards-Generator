<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Deep Slate Navy Theme -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearSpeech id="speechLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearSpeech>
    <linearSpeech id="speechRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearSpeech>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric background glow representing active discussion -->
  <circle cx="120" cy="120" r="90" fill="url(#stageGlow)"/>

  <!-- Background Stage Elements / Environment -->
  <g opacity="0.3">
    <path d="M40 185 L200 185" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="120" cy="90" r="75" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8"/>
  </g>

  <!-- Floating Dynamic Debate Bubbles (Action-packed visual impact) -->
  <!-- Left Speaker Bubble / Idea Stream -->
  <path d="M 65 75 Q 75 55 95 65 Q 115 75 105 95 Q 95 115 75 105 Z" fill="url(#speechLeft)" opacity="0.25"/>
  <path d="M 50 110 Q 65 95 85 105 Q 105 115 95 130 Q 85 145 65 135 Z" fill="url(#speechLeft)" opacity="0.4"/>
  <path d="M 35 75 C 35 60 55 60 55 75 C 55 90 35 90 35 75 Z" fill="#f43f5e" opacity="0.6"/>

  <!-- Right Speaker Bubble / Idea Stream -->
  <path d="M 175 75 Q 165 55 145 65 Q 125 75 135 95 Q 145 115 165 105 Z" fill="url(#speechRight)" opacity="0.25"/>
  <path d="M 190 110 Q 175 95 155 105 Q 135 115 145 130 Q 155 145 175 135 Z" fill="url(#speechRight)" opacity="0.4"/>
  <path d="M 205 75 C 205 60 185 60 185 75 C 185 90 205 90 205 75 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- Center Energy Flash (Clash of ideas/arguments) -->
  <g transform="translate(120, 105)">
    <polygon points="0,-22 5,-5 22,-3 8,6 12,22 -2,10 -16,20 -10,5 -22,-4 -5,-6" fill="#fbbf24" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- LEFT DEBATER (Passionate, expressive gesture) -->
  <g transform="translate(68, 120)">
    <!-- Body / Suit -->
    <path d="M-25 65 C-25 45 -15 35 0 35 C15 35 25 45 25 65 Z" fill="#1e1b4b"/>
    <path d="M-10 35 L0 50 L10 35 Z" fill="#f8fafc"/> <!-- Shirt collar -->
    <polygon points="0,42 -4,65 4,65" fill="#f43f5e"/> <!-- Red tie -->
    
    <!-- Head & Hair -->
    <circle cx="0" cy="12" r="18" fill="#fbcfe8"/> <!-- Skin tone -->
    <path d="M-19 5 C-19 -5 -5 -8 5 -6 C15 -4 19 5 19 12 C19 15 17 15 15 12 C10 2 0 1 -15 8 Z" fill="#475569"/> <!-- Hair -->
    
    <!-- Expressive Face (Speaking / Passionate) -->
    <path d="M-5 12 Q-2 10 1 12" stroke="#334155" stroke-width="2" stroke-linecap="round"/> <!-- Eyebrow angled -->
    <circle cx="-3" cy="16" r="2" fill="#1e293b"/> <!-- Eye -->
    <path d="M-5 22 Q0 28 5 22" fill="#9f1239"/> <!-- Open mouth -->

    <!-- Gesturing Arm (Pointing/Arguing forward) -->
    <path d="M-20 40 C-30 40 -45 50 -40 60 C-35 70 -25 55 -15 50" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-42" cy="61" r="5" fill="#fbcfe8"/>
  </g>

  <!-- RIGHT DEBATER (Confident counter-argument gesture) -->
  <g transform="translate(172, 120)">
    <!-- Body / Suit -->
    <path d="M-25 65 C-25 45 -15 35 0 35 C15 35 25 45 25 65 Z" fill="#0f172a"/>
    <path d="M-10 35 L0 50 L10 35 Z" fill="#f8fafc"/> <!-- Shirt collar -->
    <polygon points="0,42 -4,65 4,65" fill="#38bdf8"/> <!-- Blue tie -->
    
    <!-- Head & Hair -->
    <circle cx="0" cy="12" r="18" fill="#fed7aa"/> <!-- Skin tone -->
    <path d="M-18 10 C-15 -3 -5 -7 8 -5 C17 -3 20 8 20 12 C15 10 5 2 -18 10 Z" fill="#1e293b"/> <!-- Hair -->
    
    <!-- Expressive Face (Confident / Smiling) -->
    <path d="M-2 11 Q2 10 6 12" stroke="#334155" stroke-width="2" stroke-linecap="round"/> <!-- Eyebrow -->
    <circle cx="3" cy="16" r="2" fill="#1e293b"/> <!-- Eye -->
    <path d="M-2 23 Q2 20 6 23" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/> <!-- Confident smirk -->

    <!-- Gesturing Arm (Palm up / Rebuttal) -->
    <path d="M20 42 C35 45 45 35 40 25 C35 15 25 30 15 40" fill="none" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>
    <circle cx="41" cy="24" r="5" fill="#fed7aa"/>
  </g>

  <!-- PODIUMS / DESKS (Anchoring the real-world scene) -->
  <!-- Left Podium -->
  <g transform="translate(68, 160)">
    <path d="M-22 0 L22 0 L18 65 L-18 65 Z" fill="#334155"/>
    <path d="M-25 0 L25 0 L25 8 L-25 8 Z" fill="#475569"/>
    <!-- Microphone -->
    <path d="M0 0 L0 -25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-28" r="5" fill="#cbd5e1"/>
    <!-- Notes / Papers on podium -->
    <rect x="-10" y="12" width="16" height="20" rx="2" fill="#f1f5f9" transform="rotate(-10 -2 12)"/>
    <rect x="-4" y="10" width="16" height="20" rx="2" fill="#ffffff" transform="rotate(5 4 10)"/>
  </g>

  <!-- Right Podium -->
  <g transform="translate(172, 160)">
    <path d="M-22 0 L22 0 L18 65 L-18 65 Z" fill="#334155"/>
    <path d="M-25 0 L25 0 L25 8 L-25 8 Z" fill="#475569"/>
    <!-- Microphone -->
    <path d="M0 0 L0 -25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-28" r="5" fill="#cbd5e1"/>
    <!-- Notes / Tablet on podium -->
    <rect x="-10" y="12" width="20" height="24" rx="3" fill="#38bdf8" opacity="0.8" transform="rotate(8 0 12)"/>
    <line x1="-5" y1="20" x2="5" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="26" x2="2" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Center Floor Divider / Debate Arena Line -->
  <ellipse cx="120" cy="210" rx="70" ry="12" fill="#0f172a" opacity="0.6"/>
  <path d="M 80 210 L 160 210" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="120" cy="210" r="5" fill="#fbbf24"/>

  <!-- Foreground Atmospheric Elements (Depth cues) -->
  <circle cx="25" cy="45" r="3" fill="#38bdf8" opacity="0.5"/>
  <circle cx="215" cy="55" r="4" fill="#f43f5e" opacity="0.5"/>
  <circle cx="200" cy="190" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="35" cy="170" r="2" fill="#38bdf8" opacity="0.6"/>
</svg>