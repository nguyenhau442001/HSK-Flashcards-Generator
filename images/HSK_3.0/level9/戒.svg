<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Metal Gradient for Bin -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Red Cigarette Gradient -->
    <linearGradient id="cigGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Backlight/Glow -->
  <circle cx="120" cy="130" r="90" fill="url(#glowGrad)"/>

  <!-- Background Environment: Wooden Table/Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.6"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2" opacity="0.5"/>

  <!-- Atmospheric Elements: Tiny floating sparks/smoke particles representing breaking habits -->
  <g opacity="0.6">
    <circle cx="80" cy="90" r="2" fill="#fbbf24"/>
    <circle cx="170" cy="70" r="1.5" fill="#38bdf8"/>
    <circle cx="150" cy="110" r="2.5" fill="#fbbf24"/>
    <circle cx="95" cy="65" r="1.5" fill="#10b981"/>
  </g>

  <!-- Main Action Subject: Trash Can / Disposal Bin (Representing "Giving Up / Quitting") -->
  <g filter="url(#shadow)">
    <!-- Bin Base/Body -->
    <path d="M 85 100 L 95 190 C 95 195, 98 198, 103 198 L 137 198 C 142 198, 145 195, 145 190 L 155 100 Z" fill="url(#metalGrad)"/>
    <!-- Bin Ribs/Texture -->
    <line x1="105" y1="110" x2="108" y2="188" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="110" x2="120" y2="188" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="135" y1="110" x2="132" y2="188" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- Bin Rim -->
    <ellipse cx="120" cy="100" rx="38" ry="8" fill="#64748b"/>
    <ellipse cx="120" cy="98" rx="36" ry="6" fill="#1e293b"/>

    <!-- Bin Lid (Swung open dynamically to show action) -->
    <g transform="translate(120, 92) rotate(-35)">
      <ellipse cx="0" cy="0" rx="38" ry="8" fill="#475569"/>
      <path d="M -15 -6 L 15 -6 L 10 -14 L -10 -14 Z" fill="#334155"/>
      <circle cx="0" cy="-15" r="4" fill="#94a3b8"/>
    </g>
  </g>

  <!-- Discarded Bad Habits: Cigarette & Smoke / Red Glow symbolizing quitting smoking -->
  <!-- Falling/Discarded Cigarette inside the bin -->
  <g transform="translate(120, 115) rotate(25)" filter="url(#shadow)">
    <!-- Smoke puff rising from discarded item -->
    <path d="M 0 -20 C -10 -35, 10 -45, -5 -60 C -12 -67, -2 -75, -10 -85" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Red "Forbidden" Prohibition Slash overlaid dynamically -->
    <circle cx="0" cy="-5" r="28" fill="none" stroke="#ef4444" stroke-width="5" opacity="0.85"/>
    <line x1="-20" y1="-25" x2="20" y2="15" stroke="#ef4444" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- Cigarette Body -->
    <rect x="-16" y="-6" width="32" height="10" rx="3" fill="url(#cigGrad)"/>
    <!-- Filter -->
    <rect x="-16" y="-6" width="10" height="10" rx="2" fill="#fbbf24"/>
    <!-- Glowing/Burning Tip (being extinguished) -->
    <circle cx="16" cy="-1" r="3.5" fill="#f97316"/>
    <circle cx="16" cy="-1" r="1.5" fill="#fef08a"/>
  </g>

  <!-- Sparkle of Success / Positive Reinforcement -->
  <g transform="translate(165, 85)" fill="#fbbf24">
    <path d="M 0 -12 C 1 -4, 4 -1, 12 0 C 4 1, 1 4, 0 12 C -1 4, -4 1, -12 0 C -4 -1, -1 -4, 0 -12 Z"/>
  </g>
  <g transform="translate(75, 115) scale(0.6)" fill="#38bdf8">
    <path d="M 0 -12 C 1 -4, 4 -1, 12 0 C 4 1, 1 4, 0 12 C -1 4, -4 1, -12 0 C -4 -1, -1 -4, 0 -12 Z"/>
  </g>

  <!-- Green Checkmark Badge (Reinforcing successful "quitting" action) -->
  <g transform="translate(185, 155)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#10b981"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#34d399" stroke-width="2"/>
    <path d="M -7 -1 L -2 4 L 8 -6" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>