<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Stall Table -->
  <path d="M40 160 L200 160 L190 210 L50 210 Z" fill="#475569"/>
  <path d="M40 160 L200 160 L205 170 L35 170 Z" fill="#334155"/>
  
  <!-- Goods on table -->
  <circle cx="80" cy="150" r="15" fill="#f59e0b"/>
  <rect x="110" y="135" width="30" height="25" rx="4" fill="#ec4899"/>
  <path d="M160 150 L180 150 L175 130 Z" fill="#10b981"/>
  
  <!-- Customer (Left) -->
  <g transform="translate(60, 90)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M5 40 Q20 80 10 120 L30 120 Q20 80 35 40 Z" fill="#38bdf8"/>
    <path d="M10 50 L0 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Merchant (Right) -->
  <g transform="translate(150, 90)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M20 35 L20 120" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M5 50 L35 50" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <rect x="5" y="80" width="30" height="40" rx="5" fill="#64748b"/>
  </g>
  
  <!-- Action Lines/Gesture -->
  <path d="M95 110 Q115 90 135 110" stroke="#f8fafc" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  <path d="M100 100 L90 110 L100 120" stroke="#f8fafc" stroke-width="3" fill="none"/>
  <path d="M130 100 L140 110 L130 120" stroke="#f8fafc" stroke-width="3" fill="none"/>
</svg>