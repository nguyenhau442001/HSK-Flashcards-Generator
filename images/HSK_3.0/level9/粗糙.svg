<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Wood Surface Gradients -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Magnifying Glass Lens Gradient -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Ambient background elements -->
  <circle cx="200" cy="50" r="2" fill="#38bdf8" opacity="0.3" />
  <circle cx="40" cy="80" r="1.5" fill="#f59e0b" opacity="0.4" />
  <circle cx="210" cy="180" r="2" fill="#fbbf24" opacity="0.2" />

  <!-- SCENE: Wooden Table Environment -->
  <!-- Table Base / Side -->
  <path d="M 30,150 L 210,150 L 190,210 L 50,210 Z" fill="url(#tableGrad)" filter="url(#shadow)" />
  
  <!-- Table Top Surface -->
  <path d="M 20,135 L 220,135 L 200,165 L 40,165 Z" fill="url(#tableTop)" />

  <!-- ROUGH WOODEN PLANK (The Subject of 'Thô ráp' - Rough/Coarse surface) -->
  <g transform="translate(60, 115)">
    <!-- Plank Base -->
    <path d="M 0,20 L 120,20 L 130,55 L 10,55 Z" fill="#7c2d12" stroke="#451a03" stroke-width="1.5" />
    <path d="M 10,25 L 110,25 L 115,45 L 15,45 Z" fill="#9a3412" />

    <!-- Rough Texture Lines & Splinters (Showing 'Thô ráp' / Coarse texture) -->
    <!-- Splinter 1 -->
    <path d="M 30,30 L 45,28 L 32,32 Z" fill="#ea580c" />
    <!-- Splinter 2 -->
    <path d="M 75,38 L 90,35 L 78,41 Z" fill="#b45309" />
    <!-- Coarse Grain Grooves -->
    <path d="M 15,30 Q 30,38 50,28 T 90,36 T 110,32" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 20,40 Q 45,33 70,42 T 105,38" fill="none" stroke="#78350f" stroke-width="1" stroke-linecap="round" opacity="0.7" />
    <path d="M 35,23 Q 60,30 85,25" fill="none" stroke="#451a03" stroke-width="1" opacity="0.5" />
    
    <!-- Rough Bumps and Dots -->
    <circle cx="40" cy="35" r="1.5" fill="#451a03" />
    <circle cx="65" cy="32" r="2" fill="#451a03" />
    <circle cx="95" cy="40" r="1.5" fill="#451a03" />
    <circle cx="25" cy="38" r="1" fill="#ea580c" />

    <!-- Isometric edge thickness showing rough cut -->
    <path d="M 10,55 L 130,55 L 130,62 L 10,62 Z" fill="#451a03" />
    <path d="M 25,55 L 30,62 M 60,55 L 65,62 M 100,55 L 105,62" stroke="#78350f" stroke-width="1" />
  </g>

  <!-- CONTEXT PROP: Small Woodworking / Measurement Tools -->
  <!-- Measuring Caliper (Backdrop prop) -->
  <g transform="translate(35, 95) rotate(-15)">
    <rect x="0" y="0" width="6" height="45" rx="3" fill="#cbd5e1" />
    <circle cx="3" cy="6" r="2.5" fill="#64748b" />
    <path d="M 3,45 L -8,55 L -4,57 L 3,48 Z" fill="#94a3b8" />
  </g>

  <!-- CONTEXT PROP: Warm Desk Lamp on the side -->
  <g transform="translate(185, 75)">
    <!-- Lamp Stand -->
    <path d="M 0,65 Q 10,40 5,10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <!-- Lamp Shade -->
    <path d="M -12,5 L 22,5 L 15,-12 L -5,-12 Z" fill="#f59e0b" filter="url(#shadow)" />
    <!-- Light cone overlay -->
    <polygon points="5,10 -25,120 75,120" fill="#fbbf24" opacity="0.08" pointer-events="none" />
  </g>

  <!-- FOCAL POINT: Magnifying Glass inspecting the rough surface -->
  <g transform="translate(100, 75)" filter="url(#shadow)">
    <!-- Magnifying Glass Handle -->
    <path d="M 15,15 L 45,45" stroke="#334155" stroke-width="10" stroke-linecap="round" />
    <path d="M 15,15 L 45,45" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" opacity="0.3" />
    <circle cx="48" cy="48" r="3" fill="#1e293b" />

    <!-- Glass Rim (Outer) -->
    <circle cx="0" cy="0" r="34" fill="#0f172a" stroke="#fbbf24" stroke-width="4" />
    <!-- Glass Rim (Inner highlight) -->
    <circle cx="0" cy="0" r="30" fill="url(#lensGlass)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Magnified View inside Lens (Enlarged rough texture details) -->
    <g clip-path="url(#lensClip)">
      <clipPath id="lensClip">
        <circle cx="0" cy="0" r="29" />
      </clipPath>
      
      <!-- Inside the lens: exaggerated rough wood grain -->
      <path d="M -20,10 Q 0,-10 20,5 T -10,20" fill="none" stroke="#9a3412" stroke-width="4" opacity="0.8" />
      <path d="M -15,-5 Q 10,-15 15,10" fill="none" stroke="#ea580c" stroke-width="3" />
      
      <!-- Large exaggerated splinters/cracks under magnification -->
      <path d="M -5,-10 L 8,-18 L 2,-5 Z" fill="#fb923c" />
      <path d="M 5,8 L 18,15 L 10,18 Z" fill="#f59e0b" />
      
      <!-- Coarse texture dots magnified -->
      <circle cx="-8" cy="5" r="3" fill="#451a03" />
      <circle cx="10" cy="-5" r="4" fill="#78350f" />
      <circle cx="-2" cy="-12" r="2" fill="#451a03" />

      <!-- Lens Light Glare / Reflection -->
      <path d="M -18,-18 Q -8,-22 2,-15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    </g>
  </g>

  <!-- Sparkles / Action Highlights (Emphasizing tactile discovery) -->
  <g transform="translate(135, 55)">
    <path d="M 0,0 L 0,10 M -5,5 L 5,5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>
  <g transform="translate(75, 45)">
    <path d="M 0,0 L 0,6 M -3,3 L 3,3" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
  </g>

</svg>