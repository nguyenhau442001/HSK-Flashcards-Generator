<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(40, 40)">
    <!-- Background elements: Mirror and vanity light -->
    <rect x="20" y="10" width="120" height="150" rx="10" fill="#334155" stroke="#475569" stroke-width="4"/>
    <circle cx="80" cy="25" r="6" fill="#fbbf24"/>
    <circle cx="50" cy="25" r="6" fill="#fbbf24"/>
    <circle cx="110" cy="25" r="6" fill="#fbbf24"/>
    
    <!-- Subject: The handsome man -->
    <!-- Shoulders -->
    <path d="M20 160 C 20 130, 140 130, 140 160 L 140 200 L 20 200 Z" fill="#1e293b"/>
    <path d="M30 160 L 50 120 L 110 120 L 130 160" fill="none" stroke="#f1f5f9" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Face -->
    <ellipse cx="80" cy="90" rx="35" ry="45" fill="#fde68a"/>
    
    <!-- Hair -->
    <path d="M45 80 C 45 40, 115 40, 115 80 L 115 90 L 80 60 L 45 90 Z" fill="#334155"/>
    
    <!-- Features -->
    <path d="M65 95 Q 70 90 75 95" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M85 95 Q 90 90 95 95" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="70" cy="85" r="3" fill="#0f172a"/>
    <circle cx="90" cy="85" r="3" fill="#0f172a"/>
    <path d="M72 115 Q 80 122 88 115" stroke="#e11d48" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Tie/Collar accent -->
    <path d="M75 140 L 85 140 L 80 160 Z" fill="#ec4899"/>
  </g>
  
  <!-- Decorative Sparkles -->
  <path d="M180 50 L 185 40 L 190 50 L 200 55 L 190 60 L 185 70 L 180 60 L 170 55 Z" fill="#fbbf24"/>
  <path d="M40 180 L 45 170 L 50 180 L 60 185 L 50 190 L 45 200 L 40 190 L 30 185 Z" fill="#38bdf8"/>
