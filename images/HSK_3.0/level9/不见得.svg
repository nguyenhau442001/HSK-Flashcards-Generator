<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lighting -->
  <circle cx="120" cy="80" r="100" fill="url(#lampGlow)"/>

  <!-- Background Environment & Props -->
  <!-- Window / Night Sky view -->
  <path d="M70,30 L170,30 L170,110 L70,110 Z" fill="#0b0f19" stroke="#334155" stroke-width="2" rx="4"/>
  <circle cx="100" cy="50" r="2" fill="#94a3b8" opacity="0.6"/>
  <circle cx="140" cy="70" r="1.5" fill="#94a3b8" opacity="0.4"/>
  <circle cx="155" cy="45" r="2.5" fill="#94a3b8" opacity="0.8"/>
  
  <!-- Room Wall & Floor -->
  <rect x="20" y="110" width="200" height="100" fill="#1e293b" opacity="0.5"/>
  <path d="M20,170 L220,170 L230,220 L10,220 Z" fill="url(#floorGrad)"/>
  <!-- Floor line perspective -->
  <line x1="20" y1="170" x2="220" y2="170" stroke="#475569" stroke-width="2"/>

  <!-- Bookshelf Background Prop -->
  <rect x="30" y="80" width="35" height="90" fill="#0f172a" rx="2"/>
  <line x1="30" y1="110" x2="65" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="30" y1="140" x2="65" y2="140" stroke="#334155" stroke-width="2"/>
  <!-- Books on shelf -->
  <rect x="35" y="90" width="8" height="20" fill="#38bdf8" rx="1"/>
  <rect x="45" y="88" width="6" height="22" fill="#ec4899" rx="1"/>
  <rect x="36" y="120" width="12" height="20" fill="#f59e0b" rx="1"/>
  <rect x="50" y="123" width="7" height="17" fill="#10b981" rx="1"/>

  <!-- Desk Surface -->
  <path d="M60,150 L180,150 L195,175 L45,175 Z" fill="#334155" filter="url(#shadow)"/>
  <path d="M60,150 L180,150 L180,155 L60,155 Z" fill="#475569"/>

  <!-- Main Scene Object: The Dual-Path / Scale Representation of "Chưa chắc" (Uncertainty) -->
  <!-- A classic mechanical balancing scale on the desk, delicately tipped, showing hesitation/maybe -->
  
  <!-- Scale Stand -->
  <rect x="115" y="115" width="10" height="38" fill="#cbd5e1" rx="2" filter="url(#shadow)"/>
  <ellipse cx="120" cy="152" rx="18" ry="5" fill="#94a3b8"/>
  <circle cx="120" cy="115" r="7" fill="#fbbf24"/>

  <!-- Scale Beam (Tilted to represent hesitation/uncertainty) -->
  <g transform="rotate(-12, 120, 115)">
    <!-- Main horizontal bar -->
    <rect x="70" y="112" width="100" height="6" rx="3" fill="#cbd5e1" filter="url(#shadow)"/>
    
    <!-- Left Chain & Pan (Lower, leaning towards "Yes" or one side) -->
    <line x1="75" y1="118" x2="75" y2="138" stroke="#94a3b8" stroke-width="2"/>
    <line x1="85" y1="118" x2="85" y2="138" stroke="#94a3b8" stroke-width="2"/>
    <path d="M65,138 Q80,150 95,138 Z" fill="#fb923c" filter="url(#shadow)"/>
    <!-- Item on Left Pan: Glowing positive check/coin -->
    <circle cx="80" cy="139" r="7" fill="#f59e0b"/>
    <path d="M77,139 L79,141 L84,136" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Chain & Pan (Higher, contrasting) -->
    <line x1="155" y1="118" x2="155" y2="138" stroke="#94a3b8" stroke-width="2"/>
    <line x1="165" y1="118" x2="165" y2="138" stroke="#94a3b8" stroke-width="2"/>
    <path d="M145,138 Q160,150 175,138 Z" fill="#38bdf8" filter="url(#shadow)"/>
    <!-- Item on Right Pan: Question mark / alternative block -->
    <rect x="154" y="131" width="12" height="12" rx="2" fill="#0284c7"/>
    <path d="M158,134 C158,133 160,132 161,133 C162,134 160,136 160,137" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="160" cy="140" r="1" fill="#fff"/>
  </g>

  <!-- Thoughtful Character / Foreground Silhouette Interaction -->
  <!-- A warm glowing desk lamp casting light onto the scene -->
  <path d="M190,70 L170,120 L210,120 Z" fill="#475569" filter="url(#shadow)"/>
  <path d="M175,120 C175,115 185,110 190,110 C195,110 205,115 205,120 Z" fill="#cbd5e1"/>
  <line x1="190" y1="70" x2="190" y2="40" stroke="#94a3b8" stroke-width="4"/>
  <path d="M170,40 C170,30 210,30 210,40" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>

  <!-- Floating "Hmm / Hesitation" Elements (Abstract visual narrative of 'not necessarily') -->
  <g opacity="0.8" filter="url(#shadow)">
    <!-- Floating gentle indicator bubbles -->
    <circle cx="95" cy="80" r="4" fill="#38bdf8"/>
    <circle cx="85" cy="70" r="7" fill="#f59e0b"/>
    <circle cx="105" cy="62" r="3" fill="#10b981"/>
    
    <!-- Gentle wavy uncertainty curve -->
    <path d="M130,55 Q138,45 146,55 T162,55" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Cute desk accessories for depth -->
  <!-- Small potted plant -->
  <path d="M195,150 Q190,165 205,165 Q220,165 215,150 Z" fill="#10b981"/>
  <ellipse cx="205" cy="150" rx="10" ry="3" fill="#047857"/>
  <!-- Plant leaves -->
  <path d="M205,147 Q200,135 195,130 Q205,138 205,147 Z" fill="#34d399"/>
  <path d="M205,147 Q215,133 220,128 Q212,138 205,147 Z" fill="#10b981"/>

  <!-- Coffee mug -->
  <rect x="52" y="142" width="14" height="18" rx="3" fill="#ec4899"/>
  <path d="M66,146 C72,146 72,154 66,156" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  <!-- Steam from mug -->
  <path d="M57,136 Q55,130 59,124" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>