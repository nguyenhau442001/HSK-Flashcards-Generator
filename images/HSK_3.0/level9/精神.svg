<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Energy Aura Gradient -->
    <radialGradient id="energyAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Sparkle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Window Cityscape Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas with Rounded Corners -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Cozy Room Interior -->
  <!-- Back Wall & Window -->
  <g id="environment">
    <!-- Window Frame & Night View -->
    <rect x="135" y="25" width="75" height="90" rx="4" fill="#090d16" stroke="#475569" stroke-width="3" />
    <!-- City lights outside -->
    <rect x="145" y="55" width="10" height="50" fill="#38bdf8" opacity="0.3" />
    <rect x="160" y="45" width="12" height="60" fill="#fbbf24" opacity="0.2" />
    <rect x="180" y="65" width="15" height="40" fill="#f43f5e" opacity="0.3" />
    <!-- Window Grid Lines -->
    <line x1="172" y1="25" x2="172" y2="115" stroke="#475569" stroke-width="2" />
    <line x1="135" y1="70" x2="210" y2="70" stroke="#475569" stroke-width="2" />

    <!-- Room Wall Decor / Shelf -->
    <rect x="25" y="35" width="80" height="6" rx="3" fill="#475569" />
    <!-- Potted Plant on Shelf -->
    <path d="M 45 35 L 50 22 L 60 22 L 65 35 Z" fill="#10b981" />
    <circle cx="55" cy="18" r="8" fill="#34d399" />
    <circle cx="48" cy="20" r="6" fill="#059669" />

    <!-- Wooden Desk Surface -->
    <path d="M 15 175 L 225 175 L 210 215 L 30 215 Z" fill="#334155" />
    <path d="M 10 170 L 230 170 L 230 176 L 10 176 Z" fill="#475569" />
  </g>

  <!-- PROPS ON DESK -->
  <g id="desk-props">
    <!-- Desk Lamp -->
    <path d="M 190 170 L 180 120 L 195 110 L 205 125 Z" fill="#64748b" />
    <path d="M 185 115 C 170 100 175 80 190 70 C 205 60 220 80 210 100 Z" fill="#fbbf24" filter="url(#glow)" opacity="0.8" />
    <ellipse cx="200" cy="170" rx="18" ry="6" fill="#475569" />

    <!-- Books Stack -->
    <rect x="130" y="150" width="40" height="20" rx="2" fill="#3b82f6" />
    <rect x="125" y="138" width="45" height="14" rx="2" fill="#ec4899" />
    <rect x="132" y="126" width="38" height="14" rx="2" fill="#10b981" />

    <!-- Hot Coffee Mug with Steam -->
    <rect x="35" y="145" width="22" height="25" rx="3" fill="#f8fafc" />
    <path d="M 57 150 C 65 150 65 165 57 165" stroke="#f8fafc" stroke-width="3" fill="none" />
    <!-- Steam Swirls -->
    <path d="M 42 135 C 45 130 39 125 42 120" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 50 137 C 53 132 47 127 50 122" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- CENTRAL SUBJECT: Energetic Character Representing 'Tinh Thần' (Vigor/Spiritedness) -->
  <g id="main-character">
    <!-- Vigor / Energy Aura Background -->
    <circle cx="105" cy="115" r="55" fill="url(#energyAura)" />

    <!-- Floating Energy Sparks & Stars -->
    <g filter="url(#glow)">
      <!-- Star 1 -->
      <path d="M 75 75 L 78 82 L 85 85 L 78 88 L 75 95 L 72 88 L 65 85 L 72 82 Z" fill="#fbbf24" />
      <!-- Star 2 -->
      <path d="M 145 90 L 147 94 L 152 96 L 147 98 L 145 103 L 143 98 L 138 96 L 143 94 Z" fill="#38bdf8" />
      <!-- Glowing Orbs -->
      <circle cx="60" cy="110" r="4" fill="#fb923c" />
      <circle cx="140" cy="135" r="5" fill="#34d399" />
      <circle cx="120" cy="65" r="3" fill="#fbbf24" />
    </g>

    <!-- Character Body & Posture (Dynamic, upright, energetic pose) -->
    <!-- Torso (Hoodie / Active Wear) -->
    <path d="M 75 130 C 75 115 135 115 135 130 L 145 175 C 145 175 135 178 105 178 C 75 178 65 175 65 175 Z" fill="#3b82f6" />
    <!-- Hoodie Pocket / Details -->
    <path d="M 85 155 L 125 155 L 120 172 L 90 172 Z" fill="#2563eb" />
    <!-- Hoodie Strings -->
    <path d="M 95 125 L 93 145" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 115 125 L 117 145" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="95" y="105" width="20" height="18" fill="#fcd34d" />

    <!-- Head -->
    <circle cx="105" cy="90" r="24" fill="#fcd34d" />

    <!-- Cheeks (Healthy, high energy flush) -->
    <circle cx="91" cy="95" r="4" fill="#f43f5e" opacity="0.4" />
    <circle cx="119" cy="95" r="4" fill="#f43f5e" opacity="0.4" />

    <!-- Hair (Dynamic, spirited spiky style) -->
    <path d="M 81 85 C 80 65 95 60 105 60 C 115 60 130 65 129 85 C 135 80 140 70 135 60 C 125 45 95 45 80 60 C 73 70 78 82 81 85 Z" fill="#1e293b" />
    <path d="M 100 58 C 105 48 115 50 120 55 C 115 52 105 52 100 58 Z" fill="#334155" />

    <!-- Facial Expression: Big Confident Smile & Sparkling Eyes -->
    <!-- Eyes (Happy Arcs / Determination) -->
    <path d="M 90 85 Q 95 78 100 85" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 110 85 Q 115 78 120 85" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Confident Wide Open Happy Smile -->
    <path d="M 96 97 Q 105 106 114 97 Z" fill="#991b1b" />
    <path d="M 98 97 Q 105 103 112 97 Z" fill="#f43f5e" />

    <!-- Arms Raised in Triumph / High Energy Action -->
    <!-- Left Arm (Bent up) -->
    <path d="M 75 125 C 60 120 50 100 55 90 C 58 85 65 85 68 92 C 73 105 78 115 85 122 Z" fill="#3b82f6" />
    <!-- Left Hand / Fist -->
    <circle cx="55" cy="85" r="8" fill="#fcd34d" />

    <!-- Right Arm (Raised high in victory/energy) -->
    <path d="M 135 125 C 150 120 165 100 160 85 C 157 78 150 80 148 86 C 144 98 138 112 125 122 Z" fill="#3b82f6" />
    <!-- Right Hand / Fist -->
    <circle cx="163" cy="78" r="8" fill="#fcd34d" />
  </g>

  <!-- FOREGROUND VIGOR ELEMENTS / DYNAMIC ACTION EFFECTS -->
  <!-- Swooshing Energy Lines representing vitality and sharp mental focus -->
  <path d="M 30 110 C 45 90 60 130 75 100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" filter="url(#glow)" />
  <path d="M 165 130 C 180 110 195 150 210 120" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#glow)" />

  <!-- Tiny floating upward energy particles -->
  <circle cx="90" cy="45" r="2.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="130" cy="40" r="2" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="155" cy="55" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="80" cy="135" r="2" fill="#34d399" filter="url(#glow)" />
</svg>