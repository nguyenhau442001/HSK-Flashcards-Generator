<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background elements: School/Office setting -->
  <rect x="40" y="120" width="160" height="80" rx="8" fill="#334155"/>
  <circle cx="180" cy="140" r="15" fill="#f59e0b" opacity="0.2"/>
  
  <!-- The Teacher (Sitting) -->
  <g transform="translate(130, 110)">
    <circle cx="20" cy="20" r="18" fill="#cbd5e1"/>
    <rect x="5" y="40" width="30" height="50" rx="5" fill="#38bdf8"/>
    <path d="M10 40 L30 40 L35 80 L5 80 Z" fill="#0ea5e9"/>
  </g>
  
  <!-- The Student (Standing/Bowing slightly) -->
  <g transform="translate(60, 90)">
    <circle cx="20" cy="20" r="20" fill="#fde68a"/>
    <path d="M5 45 Q20 40 35 45 L30 100 L10 100 Z" fill="#ec4899"/>
    <path d="M10 50 L0 80" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 50 L40 80" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Action/Interaction Glow -->
  <circle cx="110" cy="100" r="8" fill="#fbbf24"/>
  <path d="M105 95 L115 105 M115 95 L105 105" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Decorative floor/depth -->
  <ellipse cx="120" cy="210" rx="100" ry="10" fill="#0f172a" opacity="0.5"/>
</svg>