<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Desk Lamp Light Cone -->
    <linearGradient id="lampLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.2"/>
    </linearGradient>
    
    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / ROOM INTERIOR -->
  <!-- Wallpaper / Back Wall -->
  <rect x="15" y="15" width="210" height="175" rx="4" fill="#131c31"/>
  
  <!-- Wooden Floor -->
  <path d="M15 190 L225 190 L235 225 L5 225 Z" fill="#0b111e"/>
  <!-- Floor planks line perspective -->
  <line x1="80" y1="190" x2="40" y2="225" stroke="#162238" stroke-width="1.5"/>
  <line x1="160" y1="190" x2="180" y2="225" stroke="#162238" stroke-width="1.5"/>
  <line x1="120" y1="190" x2="110" y2="225" stroke="#162238" stroke-width="1.5"/>

  <!-- Window showing late night city lights outside -->
  <rect x="28" y="30" width="55" height="75" rx="3" fill="url(#nightSky)" stroke="#334155" stroke-width="2"/>
  <!-- Window frame grid -->
  <line x1="55" y1="30" x2="55" y2="105" stroke="#334155" stroke-width="1.5"/>
  <line x1="28" y1="67" x2="83" y2="67" stroke="#334155" stroke-width="1.5"/>
  <!-- Distant city lights outside window -->
  <circle cx="38" cy="85" r="1" fill="#fde047" opacity="0.8"/>
  <circle cx="45" cy="78" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="65" cy="90" r="1" fill="#f87171" opacity="0.7"/>
  <circle cx="72" cy="82" r="1" fill="#fde047" opacity="0.5"/>

  <!-- Bookshelf on back wall with clutter -->
  <rect x="165" y="45" width="45" height="5" rx="1" fill="#334155"/>
  <path d="M172 25 L178 45 L182 45 L176 25 Z" fill="#f43f5e" opacity="0.8"/> <!-- leaning book -->
  <rect x="180" y="30" width="8" height="15" rx="1" fill="#38bdf8"/>
  <rect x="190" y="27" width="10" height="18" rx="1" fill="#10b981"/>

  <!-- Desk Surface -->
  <rect x="25" y="145" width="190" height="8" rx="2" fill="#334155" filter="url(#softShadow)"/>
  <!-- Desk Legs -->
  <rect x="35" y="153" width="6" height="37" fill="#1e293b"/>
  <rect x="199" y="153" width="6" height="37" fill="#1e293b"/>

  <!-- CONTEXT PROPS (Revealing WHY he is so exhausted) -->
  <!-- Giant stack of heavy documents / workload -->
  <path d="M45 130 L95 130 L93 145 L47 145 Z" fill="#cbd5e1" filter="url(#softShadow)"/>
  <path d="M42 120 L98 120 L96 130 L44 130 Z" fill="#f8fafc" filter="url(#softShadow)"/>
  <path d="M48 112 L92 112 L94 120 L46 120 Z" fill="#94a3b8"/>
  <!-- Red folders / reports on top -->
  <path d="M50 102 L90 102 L88 112 L52 112 Z" fill="#ef4444" filter="url(#softShadow)"/>
  <line x1="58" y1="107" x2="82" y2="107" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sticky notes with task lists -->
  <rect x="98" y="115" width="18" height="18" rx="1" fill="#fef08a" transform="rotate(12 107 124)"/>
  <line x1="101" y1="120" x2="112" y2="120" stroke="#ca8a04" stroke-width="1"/>
  <line x1="101" y1="124" x2="110" y2="124" stroke="#ca8a04" stroke-width="1"/>
  
  <!-- Laptop showing intense coding/data charts -->
  <path d="M125 145 L185 145 L195 130 L115 130 Z" fill="#64748b"/> <!-- Laptop base -->
  <rect x="122" y="90" width="68" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="126" y="94" width="60" height="34" rx="2" fill="url(#screenGlow)"/>
  <!-- Code lines / graph on screen -->
  <line x1="130" y1="100" x2="155" y2="100" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="107" x2="175" y2="107" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="130" y1="114" x2="160" y2="114" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="132,123 142,118 152,121 162,112 178,115" fill="none" stroke="#f43f5e" stroke-width="2"/>

  <!-- Coffee Mug (Empty with spoon) -->
  <rect x="195" y="125" width="14" height="18" rx="3" fill="#e2e8f0"/>
  <path d="M209 130 C214 130 214 138 209 140" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="123" x2="204" y2="135" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Desk Lamp casting warm light -->
  <path d="M165 95 L175 60 L185 95 Z" fill="#fbbf24" filter="url(#softShadow)"/>
  <path d="M150 145 C150 130 165 125 175 125 C185 125 200 130 200 145 Z" fill="#1e293b"/>
  <path d="M175 125 L175 95" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Lamp Light Cone Overlay -->
  <polygon points="120,65 230,65 200,145 150,145" fill="url(#lampLight)" style="mix-blend-mode: screen;"/>

  <!-- MAIN SUBJECT: EXHAUSTED CHARACTER -->
  <!-- Character seated at desk, slumped over in extreme fatigue -->
  <g id="exhaustedCharacter">
    <!-- Chair back -->
    <rect x="95" y="70" width="22" height="70" rx="6" fill="#334155" filter="url(#softShadow)"/>

    <!-- Body Slumped Forward over the desk -->
    <!-- Torso (Blue button-down shirt, wrinkled from long hours) -->
    <path d="M90 110 C85 125 100 145 120 145 L135 120 C120 110 105 105 90 110 Z" fill="#3b82f6" filter="url(#softShadow)"/>
    
    <!-- Shoulders & Back -->
    <path d="M92 105 C80 110 75 125 85 135 C90 140 105 135 115 125 Z" fill="#2563eb"/>

    <!-- Arms resting lifelessly on desk / wrapped around head -->
    <!-- Left arm draped over desk -->
    <path d="M85 130 L110 138 L135 132" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hands relaxed / limp -->
    <circle cx="137" cy="132" r="5" fill="#fbcfe8"/>

    <!-- Head Resting on Arm/Desk (Exhausted pose) -->
    <g transform="translate(105, 102)">
      <!-- Hair (Messy, disheveled from stress) -->
      <path d="M-5 12 C-2 -2 15 -4 25 2 C30 6 32 15 30 20 C20 12 5 15 -5 12 Z" fill="#1e293b"/>
      <path d="M-2 5 C10 -3 22 -1 28 5" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

      <!-- Face (Pale, eyes tightly closed in deep fatigue, slight blush/tired circles) -->
      <circle cx="15" cy="15" r="12" fill="#fed7aa"/>
      
      <!-- Tired Eye (Closed with heavy lashes / exhaustion lines) -->
      <path d="M10 16 Q15 20 20 16" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 19 Q15 22 21 19" fill="none" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M8 22 Q15 25 21 22" fill="none" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round"/> <!-- Eye bags -->
      
      <!-- Rosy tired cheek -->
      <circle cx="21" cy="22" r="3" fill="#f87171" opacity="0.4"/>

      <!-- Slight frown / open mouth breathing in sleep/exhaustion -->
      <path d="M18 27 Q22 28 25 26" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Zzz floating up to clearly show extreme sleepiness/exhaustion -->
    <g fill="#38bdf8" opacity="0.8" font-weight="bold">
      <!-- Small Z -->
      <path d="M72 85 L82 85 L74 95 L84 95" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Medium Z -->
      <path d="M60 65 L73 65 L62 78 L75 78" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Large Z -->
      <path d="M43 40 L60 40 L45 58 L62 58" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Ambient lighting highlights on the edge of desk and floor -->
  <line x1="25" y1="145" x2="215" y2="145" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>

</svg>