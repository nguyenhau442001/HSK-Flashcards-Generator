<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rockGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#34495e"/>
    </linearGradient>
    <linearGradient id="rockGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#4a6078"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Mountain Cliff - Layers for depth and texture -->
  <!-- Main large rock mass, filling most of the left and bottom -->
  <path d="M0 0 L240 0 L240 240 L180 240 C170 200 150 150 120 100 C90 50 60 20 0 0 Z" fill="url(#rockGradient1)"/>
  <!-- Overlapping rock layer for more depth -->
  <path d="M0 0 L100 0 C70 30 50 80 40 130 C30 180 20 220 0 240 Z" fill="url(#rockGradient2)"/>
  <!-- Right side cliff edge -->
  <path d="M240 0 L240 240 L200 240 C210 180 220 120 240 0 Z" fill="url(#rockGradient2)"/>

  <!-- More detailed rock formations/cracks for texture -->
  <path d="M120 100 L140 80 L130 60 L100 70 L120 100 Z" fill="#4a6078"/>
  <path d="M80 120 L90 100 L70 90 L60 110 L80 120 Z" fill="#4a6078"/>
  <path d="M150 140 L160 120 L140 110 L130 130 L150 140 Z" fill="#4a6078"/>
  <path d="M100 160 L110 140 L90 130 L80 150 L100 160 Z" fill="#4a6078"/>
  <path d="M170 180 L180 160 L160 150 L150 170 L170 180 Z" fill="#4a6078"/>
  <path d="M130 110 L145 95 L135 85 L120 95 L130 110 Z" fill="#34495e"/>
  <path d="M90 130 L105 115 L95 105 L80 115 L90 130 Z" fill="#34495e"/>

  <!-- Climber -->
  <!-- Head -->
  <circle cx="114" cy="142" r="4" fill="#f59e0b"/>
  <!-- Torso - angled to show effort -->
  <rect x="110" y="145" width="8" height="18" rx="3" fill="#fb923c" transform="rotate(-5 114 154)"/>
  <!-- Left Arm - reaching up -->
  <rect x="105" y="148" width="10" height="4" rx="2" fill="#fb923c" transform="rotate(-45 105 148)"/>
  <circle cx="100" cy="143" r="2" fill="#f59e0b"/> <!-- Left Hand -->
  <!-- Right Arm - pulling -->
  <rect x="115" y="148" width="10" height="4" rx="2" fill="#fb923c" transform="rotate(20 115 148)"/>
  <circle cx="124" cy="151" r="2" fill="#f59e0b"/> <!-- Right Hand -->
  <!-- Legs - bent and braced -->
  <rect x="108" y="160" width="4" height="15" rx="2" fill="#2c3e50" transform="rotate(15 108 160)"/>
  <rect x="114" y="160" width="4" height="15" rx="2" fill="#2c3e50" transform="rotate(-15 114 160)"/>
  <!-- Feet -->
  <rect x="106" y="173" width="5" height="3" rx="1" fill="#2c3e50" transform="rotate(15 106 173)"/>
  <rect x="115" y="173" width="5" height="3" rx="1" fill="#2c3e50" transform="rotate(-15 115 173)"/>


  <!-- Rope -->
  <!-- Rope going down -->
  <path d="M114 163 L114 180 L110 200 L105 220 L100 240" stroke="#8ba4b8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Rope going up -->
  <path d="M114 145 L118 130 L125 110 L130 90" stroke="#8ba4b8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Small rock holds for climber -->
  <rect x="95" y="138" width="10" height="5" rx="1" fill="#4a6078"/> <!-- Left hand hold -->
  <rect x="120" y="148" width="10" height="5" rx="1" fill="#4a6078"/> <!-- Right hand hold -->
  <rect x="105" y="170" width="10" height="5" rx="1" fill="#4a6078"/> <!-- Left foot hold -->
  <rect x="115" y="170" width="10" height="5" rx="1" fill="#4a6078"/> <!-- Right foot hold -->

  <!-- Subtle glow around the climber to emphasize focus/effort -->
  <circle cx="114" cy="155" r="15" fill="#f59e0b" opacity="0.1"/>
</svg>