<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Desk Light Gradient -->
    <radialGradient id="desk-light" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Chart Line Gradient (Downward decline) -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <!-- Chart Area Gradient -->
    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0" />
    </linearGradient>

    <!-- Clip Path for Card Window -->
    <clipPath id="window-clip">
      <rect x="24" y="24" width="192" height="192" rx="20" />
    </clipPath>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <g clip-path="url(#window-clip)">
    <!-- Ambient Lighting Effect -->
    <circle cx="150" cy="80" r="120" fill="url(#desk-light)" />

    <!-- Background Interior Wall & Bookshelf Details -->
    <!-- Bookshelf structure -->
    <rect x="150" y="50" width="60" height="90" rx="4" fill="#334155" opacity="0.4" />
    <rect x="160" y="70" width="40" height="8" rx="2" fill="#475569" opacity="0.6" />
    <rect x="160" y="95" width="40" height="8" rx="2" fill="#475569" opacity="0.6" />
    <rect x="160" y="120" width="40" height="8" rx="2" fill="#475569" opacity="0.6" />
    <!-- Colorful book spines on shelf -->
    <rect x="165" y="58" width="6" height="12" fill="#38bdf8" rx="1" />
    <rect x="173" y="55" width="8" height="15" fill="#f43f5e" rx="1" />
    <rect x="183" y="57" width="5" height="13" fill="#10b981" rx="1" />

    <rect x="165" y="83" width="7" height="12" fill="#fbbf24" rx="1" />
    <rect x="174" y="81" width="10" height="14" fill="#818cf8" rx="1" />

    <!-- Window with Night City View -->
    <path d="M 35 50 L 95 50 L 95 110 L 35 110 Z" fill="#090d16" stroke="#475569" stroke-width="2" rx="4" />
    <!-- City lights through window -->
    <circle cx="45" cy="70" r="1.5" fill="#fef08a" />
    <circle cx="50" cy="85" r="1" fill="#fef08a" />
    <circle cx="65" cy="65" r="2" fill="#38bdf8" />
    <circle cx="80" cy="90" r="1.5" fill="#fef08a" />
    <rect x="58" y="75" width="6" height="30" fill="#1e293b" opacity="0.7" />
    <rect x="72" y="60" width="8" height="45" fill="#1e293b" opacity="0.7" />
    <!-- Window Frame Crossbar -->
    <line x1="65" y1="50" x2="65" y2="110" stroke="#475569" stroke-width="2" />
    <line x1="35" y1="80" x2="95" y2="80" stroke="#475569" stroke-width="2" />

    <!-- Study Desk Surface -->
    <path d="M 15 165 L 225 165 L 210 210 L 30 210 Z" fill="#1e293b" />
    <path d="M 15 165 L 225 165 L 225 170 L 15 170 Z" fill="#334155" />

    <!-- Desk Lamp -->
    <path d="M 190 165 L 195 115 L 205 115 L 200 165 Z" fill="#64748b" />
    <path d="M 180 115 C 180 100, 215 100, 215 115 Z" fill="#f59e0b" />
    <ellipse cx="197" cy="115" rx="17" ry="4" fill="#d97706" />

    <!-- Exam Paper / Report Card (The Core Context) -->
    <g transform="translate(45, 120) rotate(-6)">
      <!-- Paper Sheet -->
      <rect x="0" y="0" width="80" height="70" rx="3" fill="#f8fafc" />
      <!-- Header lines -->
      <rect x="10" y="10" width="35" height="4" rx="2" fill="#cbd5e1" />
      <rect x="55" y="10" width="15" height="4" rx="2" fill="#ef4444" /> <!-- Low score mark -->
      
      <!-- Graph background grid lines -->
      <line x1="10" y1="25" x2="70" y2="25" stroke="#e2e8f0" stroke-width="1" />
      <line x1="10" y1="40" x2="70" y2="40" stroke="#e2e8f0" stroke-width="1" />
      <line x1="10" y1="55" x2="70" y2="55" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- Performance Trend Chart Area Fill -->
      <polygon points="12,50 30,32 50,45 70,58 70,62 12,62" fill="url(#area-grad)" />
      
      <!-- Performance Trend Line (Going Down sharply at the end -> 退步) -->
      <path d="M 12 50 L 30 32 L 50 45 L 70 58" fill="none" stroke="url(#line-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Data Points -->
      <circle cx="12" cy="50" r="2.5" fill="#3b82f6" />
      <circle cx="30" cy="32" r="2.5" fill="#3b82f6" />
      <circle cx="50" cy="45" r="2.5" fill="#f59e0b" />
      <!-- Final Drop Point (Red warning circle) -->
      <circle cx="70" cy="58" r="4" fill="#ef4444" />
      <circle cx="70" cy="58" r="7" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 1" />
      
      <!-- Red downward arrow stamp beside the chart -->
      <path d="M 60 25 L 65 33 L 55 33 Z" fill="#ef4444" />
    </g>

    <!-- Coffee Mug -->
    <rect x="135" y="145" width="16" height="20" rx="3" fill="#cbd5e1" />
    <path d="M 151 150 C 157 150, 157 160, 151 162" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 139 140 C 141 135, 145 135, 143 140" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Main Character (Disappointed Student / Adult leaning back, hand on head) -->
    <g transform="translate(100, 85)">
      <!-- Body / Torso (Wearing a comfortable hoodie) -->
      <path d="M 25 85 C 25 70, 35 60, 50 60 C 65 60, 75 70, 75 85 L 85 105 L 15 105 Z" fill="#38bdf8" />
      <path d="M 35 60 L 50 72 L 65 60" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /> <!-- Hoodie collar -->

      <!-- Head / Face (Pensive / Disappointed expression looking at the paper) -->
      <g transform="translate(38, 22)">
        <!-- Hair -->
        <path d="M 3 -2 C 8 -10, 20 -12, 28 -8 C 34 -5, 36 2, 35 8 C 30 5, 25 4, 20 5 C 15 4, 10 7, 5 12 C 1 8, 1 3, 3 -2 Z" fill="#1e293b" />
        
        <!-- Face base -->
        <ellipse cx="18" cy="18" rx="13" ry="15" fill="#ffedd5" />
        
        <!-- Ear -->
        <path d="M 5 16 C 3 16, 3 22, 6 23" fill="#ffedd5" />

        <!-- Closed/Sad Eyebrow (Tilted downward inside) -->
        <path d="M 10 13 L 17 16" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" />
        <path d="M 22 16 L 27 13" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" />

        <!-- Closed / Downcast Eyes -->
        <path d="M 11 18 C 13 20, 15 20, 17 18" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
        <path d="M 21 18 C 23 20, 25 20, 27 18" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

        <!-- Frowning Mouth -->
        <path d="M 16 27 C 18 25, 20 25, 22 27" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" />

        <!-- Rosy Sad Cheek -->
        <circle cx="13" cy="22" r="2.5" fill="#fca5a5" opacity="0.6" />
        <circle cx="25" cy="22" r="2.5" fill="#fca5a5" opacity="0.6" />
      </g>

      <!-- Arms / Hands -->
      <!-- Left arm resting on desk -->
      <path d="M 28 75 L 12 90 L 0 95" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="0" cy="95" r="5" fill="#ffedd5" /> <!-- Left Hand -->

      <!-- Right arm bent, hand supporting head (classic pose of setback/worry) -->
      <path d="M 72 75 C 85 70, 80 40, 63 38" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right Hand touching temple/forehead -->
      <circle cx="61" cy="35" r="5.5" fill="#ffedd5" />
      <path d="M 64 33 C 65 30, 62 28, 59 30" fill="#ffedd5" /> <!-- Fingers detail -->
    </g>

    <!-- Subtle atmospheric particles representing a heavy, pensive mood -->
    <circle cx="120" cy="50" r="1.5" fill="#94a3b8" opacity="0.4" />
    <circle cx="135" cy="40" r="1" fill="#94a3b8" opacity="0.3" />
    <circle cx="110" cy="35" r="2" fill="#94a3b8" opacity="0.2" />

    <!-- Vignette / Inner shadow framing -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="6" opacity="0.4" />
  </g>
</svg>