<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="10" fill="#334155" rx="2"/>
  <rect x="40" y="150" width="10" height="90" fill="#475569"/>
  <rect x="190" y="150" width="10" height="90" fill="#475569"/>
  
  <!-- Character (The 'Knowing' gesture: finger to temple) -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 120 Q-40 60 0 60 Q40 60 40 120" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="35" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-35 20 Q-35 -20 0 -25 Q35 -20 35 20 Z" fill="#1e293b"/>
    <!-- Arm -->
    <path d="M20 70 L50 20 L60 30 L30 80" fill="#fde68a"/>
    <!-- Hand pointing to temple -->
    <circle cx="55" cy="15" r="8" fill="#fde68a"/>
    <rect x="52" y="5" width="6" height="12" fill="#fde68a" rx="2"/>
    <!-- Expression -->
    <circle cx="-10" cy="15" r="3" fill="#0f172a"/>
    <circle cx="10" cy="15" r="3" fill="#0f172a"/>
    <path d="M-10 35 Q0 40 10 35" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>

  <!-- Props: Light bulb representing 'idea/knowing' -->
  <circle cx="180" cy="50" r="20" fill="#fbbf24" opacity="0.3"/>
  <path d="M180 40 L180 60 M170 50 L190 50" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="180" cy="50" r="10" fill="#f59e0b"/>
  
  <!-- Ambient glow -->
  <circle cx="180" cy="50" r="30" fill="#fbbf24" opacity="0.1"/>
</svg>