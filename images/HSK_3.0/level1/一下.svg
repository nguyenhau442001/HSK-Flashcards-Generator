<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#334155" opacity="0.4"/>
  
  <!-- Coffee Cup (The "Wait a moment" scene) -->
  <g transform="translate(120, 140)">
    <!-- Steam -->
    <path d="M-10 -40 Q-20 -60 -10 -80 M0 -45 Q15 -65 5 -90" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Cup Body -->
    <path d="M-35 0 L35 0 L25 50 L-25 50 Z" fill="#f8fafc"/>
    <ellipse cx="0" cy="0" rx="35" ry="10" fill="#e2e8f0"/>
    
    <!-- Handle -->
    <path d="M35 15 Q55 15 55 30 Q55 45 35 45" stroke="#f8fafc" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Hand reaching to touch the cup (The "Try/Test" action) -->
  <g transform="translate(160, 120)">
    <path d="M0 0 L20 20 L10 30 L-10 10 Z" fill="#fb923c"/>
    <circle cx="20" cy="20" r="8" fill="#fb923c"/>
    <path d="M-5 5 L-20 20" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Ambient details -->
  <circle cx="40" cy="50" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="200" cy="40" r="6" fill="#10b981" opacity="0.4"/>
  <circle cx="180" cy="190" r="3" fill="#ec4899" opacity="0.6"/>
</svg>