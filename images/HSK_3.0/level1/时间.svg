<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Hourglass Base -->
  <path d="M100 190 L140 190 L135 170 L105 170 Z" fill="#475569"/>
  
  <!-- Hourglass Glass -->
  <path d="M105 70 C105 50, 135 50, 135 70 L135 110 L120 120 L105 110 Z" fill="#38bdf8" fill-opacity="0.2"/>
  <path d="M105 170 C105 190, 135 190, 135 170 L135 130 L120 120 L105 130 Z" fill="#fbbf24" fill-opacity="0.8"/>
  
  <!-- Hourglass Frame -->
  <path d="M100 60 L140 60 L140 180 L100 180 Z" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="60" x2="140" y2="60" stroke="#94a3b8" stroke-width="4"/>
  <line x1="100" y1="180" x2="140" y2="180" stroke="#94a3b8" stroke-width="4"/>
  
  <!-- Falling Sand -->
  <line x1="120" y1="110" x2="120" y2="130" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative Elements -->
  <circle cx="180" cy="100" r="20" fill="#ec4899" fill-opacity="0.3"/>
  <path d="M170 90 L190 110 M190 90 L170 110" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  
  <circle cx="60" cy="140" r="15" fill="#10b981" fill-opacity="0.3"/>
  <path d="M55 135 L65 145 M65 135 L55 145" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Floating Particles -->
  <circle cx="150" cy="80" r="2" fill="#fb923c"/>
  <circle cx="90" cy="150" r="3" fill="#38bdf8"/>
  <circle cx="200" cy="160" r="2" fill="#f59e0b"/>
</svg>