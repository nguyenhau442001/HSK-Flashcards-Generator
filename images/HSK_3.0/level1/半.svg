<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Plate -->
  <ellipse cx="120" cy="185" rx="80" ry="25" fill="#e2e8f0"/>
  
  <!-- The Half Apple (The Subject) -->
  <g transform="translate(120, 140)">
    <!-- Shadow -->
    <ellipse cx="0" cy="20" rx="45" ry="10" fill="#0f172a" opacity="0.3"/>
    
    <!-- Apple Body -->
    <path d="M40 0 C40 -30 20 -50 0 -50 C-20 -50 -40 -30 -40 0 L0 0 Z" fill="#ef4444"/>
    
    <!-- Apple Core/Flesh -->
    <path d="M-40 0 L40 0 C40 10 20 20 0 20 C-20 20 -40 10 -40 0 Z" fill="#fef3c7"/>
    
    <!-- Seeds -->
    <ellipse cx="-10" cy="5" rx="3" ry="4" fill="#451a03"/>
    <ellipse cx="10" cy="8" rx="3" ry="4" fill="#451a03"/>
    
    <!-- Stem -->
    <path d="M-5 -45 L-5 -60 M-5 -60 C-2 -65 5 -65 8 -60" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Clock in background to reinforce 'bàn' context -->
  <circle cx="180" cy="60" r="40" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="180" cy="60" r="3" fill="#f59e0b"/>
  <line x1="180" y1="60" x2="180" y2="30" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="60" x2="210" y2="60" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="50" r="5" fill="#10b981" opacity="0.6"/>
  <circle cx="60" cy="30" r="8" fill="#ec4899" opacity="0.4"/>
</svg>