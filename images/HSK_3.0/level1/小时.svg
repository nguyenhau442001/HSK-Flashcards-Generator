<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#334155" opacity="0.3"/>
  
  <!-- Hourglass -->
  <g transform="translate(120, 120)">
    <!-- Stand -->
    <path d="M-40 80 L40 80 L35 70 L-35 70 Z" fill="#475569"/>
    <path d="M-40 -80 L40 -80 L35 -70 L-35 -70 Z" fill="#475569"/>
    <rect x="-5" y="-70" width="10" height="140" fill="#475569"/>
    
    <!-- Glass Bulbs -->
    <path d="M-35 -65 C-35 -95, 35 -95, 35 -65 L5 -5 C5 -5, 0 -10, -5 -5 Z" fill="#38bdf8" fill-opacity="0.2"/>
    <path d="M-35 65 C-35 95, 35 95, 35 65 L5 5 C5 5, 0 10, -5 5 Z" fill="#f59e0b" fill-opacity="0.8"/>
    
    <!-- Sand Particles -->
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
    <circle cx="-2" cy="15" r="2" fill="#fbbf24"/>
    <circle cx="3" cy="25" r="2" fill="#fbbf24"/>
  </g>
  
  <!-- Context Props -->
  <circle cx="50" cy="190" r="20" fill="#ec4899" opacity="0.6"/>
  <rect x="170" y="180" width="40" height="30" rx="4" fill="#10b981" opacity="0.6"/>
  
  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
</svg>