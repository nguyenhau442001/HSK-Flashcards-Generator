<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Chalkboard -->
  <rect x="30" y="30" width="180" height="120" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  <line x1="40" y1="60" x2="200" y2="60" stroke="#475569" stroke-width="2"/>
  <line x1="40" y1="90" x2="200" y2="90" stroke="#475569" stroke-width="2"/>
  
  <!-- Teacher -->
  <g transform="translate(120, 160)">
    <!-- Body -->
    <path d="M-30 60 L30 60 L25 10 L-25 10 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 -25 C-25 -45 25 -45 25 -25 C25 -10 10 -5 0 -5 C-10 -5 -25 -10 -25 -25" fill="#78350f"/>
    <!-- Glasses -->
    <circle cx="-8" cy="-22" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="8" cy="-22" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="-2" y1="-22" x2="2" y2="-22" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Pointer Stick -->
  <rect x="140" y="120" width="4" height="60" rx="2" fill="#fb923c" transform="rotate(-20 140 120)"/>
  
  <!-- Desk/Table -->
  <rect x="10" y="180" width="220" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="20" y="190" width="40" height="20" rx="2" fill="#10b981"/>
  <circle cx="200" cy="200" r="10" fill="#ec4899"/>
</svg>