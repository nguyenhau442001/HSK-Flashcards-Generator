<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Person 1 (Giving) -->
  <g transform="translate(40, 80)">
    <circle cx="30" cy="30" r="25" fill="#fb923c"/>
    <path d="M30 55 L30 110 M30 70 L10 90 M30 70 L50 90" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 75 L60 85" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 (Receiving) -->
  <g transform="translate(140, 80)">
    <circle cx="30" cy="30" r="25" fill="#38bdf8"/>
    <path d="M30 55 L30 110 M30 70 L10 90 M30 70 L50 90" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 75 L5 85" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- The Book (The Object) -->
  <g transform="translate(95, 120) rotate(15)">
    <rect width="50" height="40" rx="4" fill="#f59e0b"/>
    <path d="M5 10 L45 10 M5 20 L45 20 M5 30 L45 30" stroke="#b45309" stroke-width="2"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="180" cy="40" r="5" fill="#10b981"/>
  <circle cx="200" cy="60" r="3" fill="#ec4899"/>
  <path d="M20 190 Q120 160 220 190" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
</svg>