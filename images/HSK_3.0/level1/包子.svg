<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Bamboo Steamer Wood Gradient -->
    <linearGradient id="woodOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="woodInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Baozi Dough Gradient -->
    <linearGradient id="baoGrad" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Warm Morning Glow Gradient -->
    <radialGradient id="morningGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Filter for Depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-Bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Morning Kitchen Light -->
  <circle cx="120" cy="130" r="90" fill="url(#morningGlow)" />

  <!-- Steam Visuals (Action/Atmosphere) -->
  <g opacity="0.6">
    <path d="M 95 90 C 85 70, 105 50, 95 30" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" />
    <path d="M 120 85 C 130 65, 110 45, 125 25" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />
    <path d="M 145 90 C 155 75, 140 55, 150 35" fill="none" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" filter="url(#softGlow)" />
  </g>

  <!-- Bamboo Steamer Base & Rim -->
  <g filter="url(#dropShadow)">
    <!-- Steamer Outer Rim -->
    <ellipse cx="120" cy="145" rx="92" ry="46" fill="url(#woodOuter)" />
    <ellipse cx="120" cy="142" rx="88" ry="43" fill="url(#woodInner)" />

    <!-- Steamer Inner Cavity -->
    <ellipse cx="120" cy="142" rx="80" ry="38" fill="#451a03" />

    <!-- Bamboo Slats / Bottom texture inside -->
    <g clip-path="url(#innerClip)">
      <ellipse cx="120" cy="142" rx="78" ry="36" fill="#78350f" />
      <path d="M 42 142 H 198" stroke="#451a03" stroke-width="3" opacity="0.6" />
      <path d="M 48 130 H 192" stroke="#451a03" stroke-width="3" opacity="0.6" />
      <path d="M 48 154 H 192" stroke="#451a03" stroke-width="3" opacity="0.6" />
      <path d="M 60 118 H 180" stroke="#451a03" stroke-width="3" opacity="0.6" />
      <path d="M 60 166 H 180" stroke="#451a03" stroke-width="3" opacity="0.6" />
    </g>

    <!-- Steamer Basket Rattan / Wooden Texture Band -->
    <path d="M 28 145 C 28 175, 212 175, 212 145 V 158 C 212 188, 28 188, 28 158 Z" fill="url(#woodOuter)" />
    <!-- Texture bindings on rim -->
    <path d="M 28 145 C 28 175, 212 175, 212 145" fill="none" stroke="#78350f" stroke-width="2" />
    <path d="M 28 151 C 28 181, 212 181, 212 151" fill="none" stroke="#78350f" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Fresh Steaming Bánh Bao (Baozi) Group -->
  <g filter="url(#dropShadow)">
    
    <!-- Background Small Baozi (Left) -->
    <g transform="translate(-40, 15)">
      <ellipse cx="110" cy="130" rx="32" ry="24" fill="#94a3b8" opacity="0.4" />
      <path d="M 78 130 C 78 105, 142 105, 142 130 C 142 138, 135 142, 110 142 C 85 142, 78 138, 78 130 Z" fill="url(#baoGrad)" />
      <!-- Folds -->
      <path d="M 110 108 Q 110 120, 110 138" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M 110 108 Q 95 118, 92 134" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M 110 108 Q 125 118, 128 134" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    </g>

    <!-- Background Small Baozi (Right) -->
    <g transform="translate(45, 20)">
      <ellipse cx="110" cy="130" rx="30" ry="22" fill="#94a3b8" opacity="0.4" />
      <path d="M 82 130 C 82 107, 138 107, 138 130 C 138 137, 130 140, 110 140 C 90 140, 82 137, 82 130 Z" fill="url(#baoGrad)" />
      <!-- Folds -->
      <path d="M 110 107 Q 110 120, 110 137" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M 110 107 Q 98 116, 96 132" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M 110 107 Q 122 116, 124 132" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    </g>

    <!-- MAIN HERO BÁNH BAO (Center) -->
    <g transform="translate(0, -5)">
      <!-- Drop shadow directly under main bao -->
      <ellipse cx="120" cy="126" rx="52" ry="24" fill="#020617" opacity="0.4" />

      <!-- Main Body -->
      <path d="M 68 120 C 68 82, 172 82, 172 120 C 172 134, 155 142, 120 142 C 85 142, 68 134, 68 120 Z" fill="url(#baoGrad)" />

      <!-- Artistic Pleats / Folds (Classic Baozi Top Twist) -->
      <!-- Center Top Knot -->
      <path d="M 106 85 C 112 80, 128 80, 134 85 C 138 90, 132 96, 120 96 C 108 96, 102 90, 106 85 Z" fill="#e2e8f0" />
      <ellipse cx="120" cy="87" rx="9" ry="5" fill="#cbd5e1" />

      <!-- Pleat Lines radiating from top -->
      <path d="M 120 92 Q 120 110, 120 138" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 120 92 Q 100 105, 90 126" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 120 92 Q 140 105, 150 126" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 120 92 Q 85 112, 77 122" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <path d="M 120 92 Q 155 112, 163 122" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

      <!-- Highlight for Soft, Fluffy Volume -->
      <path d="M 90 98 Q 120 88, 150 98" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    </g>

  </g>

  <!-- Ambient Warm Sparks / Steam Particles -->
  <g fill="#fbbf24">
    <circle cx="85" cy="75" r="2.5" opacity="0.8" />
    <circle cx="155" cy="65" r="1.5" opacity="0.6" />
    <circle cx="135" cy="45" r="2" opacity="0.7" />
    <circle cx="100" cy="40" r="1.5" opacity="0.5" />
    <circle cx="70" cy="95" r="2" opacity="0.6" />
    <circle cx="170" cy="90" r="2.5" opacity="0.8" />
  </g>

  <!-- Foreground Atmospheric Glow / Vignette -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15" />
</svg>