<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Morning Glow -->
    <linearGradient id="morningGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Bread Gradient -->
    <linearGradient id="breadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Background / Wall -->
  <rect x="16" y="16" width="208" height="208" rx="16" fill="#1e293b"/>

  <!-- Window with Morning Sun -->
  <path d="M140 36 L204 36 L204 120 L140 120 Z" fill="#0f172a"/>
  <!-- Window Glass & Light -->
  <path d="M144 40 L200 40 L200 116 L144 116 Z" fill="url(#morningGlow)"/>
  <!-- Window Pane Cross -->
  <path d="M170 40 L170 116 M144 78 L200 78" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Sun Rays streaming in -->
  <path d="M144 40 L70 200 L120 200 Z" fill="#fef08a" opacity="0.07"/>
  <path d="M200 40 L150 200 L190 200 Z" fill="#fef08a" opacity="0.05"/>

  <!-- Clock showing Morning Time (e.g. 7:15) -->
  <circle cx="85" cy="55" r="18" fill="#334155" filter="url(#softShadow)"/>
  <circle cx="85" cy="55" r="15" fill="#1e293b"/>
  <polyline points="85,45 85,55 93,55" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

  <!-- Plant Pot on Shelf -->
  <path d="M36 80 L52 80 L48 96 L40 96 Z" fill="#38bdf8"/>
  <path d="M44 80 L44 68 Q48 64 52 68 L52 80" fill="#10b981"/>
  <path d="M44 80 L44 70 Q38 68 36 74 L44 80" fill="#10b981"/>

  <!-- Kitchen Table / Counter -->
  <rect x="20" y="140" width="200" height="70" rx="8" fill="url(#tableGrad)" filter="url(#softShadow)"/>
  <rect x="20" y="140" width="200" height="8" fill="#475569" rx="4"/>

  <!-- CHARACTER: Sitting at table -->
  <!-- Body & Hoodie (Warm Orange/Amber theme for cozy morning) -->
  <path d="M75 160 Q85 125 110 125 Q135 125 145 160 Z" fill="#f97316" filter="url(#softShadow)"/>
  <path d="M95 125 L110 145 L125 125" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Head & Face -->
  <circle cx="110" cy="100" r="18" fill="#fed7aa"/>
  <!-- Hair (Dark modern stylized) -->
  <path d="M93 98 Q95 82 110 82 Q127 82 127 98 Q125 90 110 90 Q95 90 93 98 Z" fill="#334155"/>
  <circle cx="103" cy="101" r="2" fill="#1e293b"/>
  <circle cx="117" cy="101" r="2" fill="#1e293b"/>
  <!-- Happy Morning Smile -->
  <path d="M107 107 Q110 111 113 107" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Blush -->
  <circle cx="100" cy="106" r="3" fill="#fca5a5" opacity="0.6"/>
  <circle cx="120" cy="106" r="3" fill="#fca5a5" opacity="0.6"/>

  <!-- Hands holding bread / mug -->
  <circle cx="95" cy="135" r="5" fill="#fed7aa"/>
  <circle cx="125" cy="135" r="5" fill="#fed7aa"/>

  <!-- PROPS: Breakfast Table Setting -->
  <!-- Plate -->
  <ellipse cx="110" cy="165" rx="35" ry="12" fill="#e2e8f0" filter="url(#softShadow)"/>
  <ellipse cx="110" cy="164" rx="30" ry="9" fill="#f8fafc"/>

  <!-- TARGET WORD OBJECT: 面包 (Bánh mì / Loaf of Bread) -->
  <g filter="url(#softShadow)">
    <!-- Loaf Base -->
    <path d="M90 160 Q95 148 110 148 Q125 148 130 160 Q135 170 110 170 Q85 170 90 160 Z" fill="url(#breadGrad)"/>
    <!-- Bread Score Lines (Classic diagonal cuts) -->
    <path d="M100 151 L103 162" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M110 150 L113 163" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M120 151 L123 162" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Highlight shimmer -->
    <path d="M95 153 Q110 150 125 153" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- Coffee / Milk Mug with steam -->
  <rect x="155" y="145" width="18" height="22" rx="4" fill="#38bdf8" filter="url(#softShadow)"/>
  <path d="M173 150 Q180 150 180 156 Q180 162 173 162" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Steam Wiggles -->
  <path d="M161 138 Q164 134 161 130" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M167 140 Q170 136 167 132" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Action Sparkles / Morning Vibes -->
  <path d="M60 110 L63 113 L60 116 L57 113 Z" fill="#fef08a"/>
  <path d="M185 90 L188 93 L185 96 L182 93 Z" fill="#fef08a"/>
  <circle cx="178" cy="80" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="65" cy="125" r="1.5" fill="#fef08a" opacity="0.8"/>

</svg>