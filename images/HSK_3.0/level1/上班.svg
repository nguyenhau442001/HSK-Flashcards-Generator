<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <rect x="30" y="80" width="180" height="100" rx="8" fill="#334155" opacity="0.4"/>
  <circle cx="190" cy="50" r="25" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Doorway/Office Entry -->
  <path d="M80 60 L160 60 L160 210 L80 210 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Character -->
  <g transform="translate(60, 40)">
    <!-- Briefcase -->
    <rect x="100" y="120" width="30" height="20" rx="2" fill="#fb923c"/>
    <path d="M105 120 L105 115 L125 115 L125 120" fill="none" stroke="#fb923c" stroke-width="3"/>
    
    <!-- Body -->
    <path d="M70 180 L90 180 L95 120 L65 120 Z" fill="#38bdf8"/>
    <circle cx="80" cy="100" r="15" fill="#fde68a"/>
    
    <!-- Arms in motion -->
    <path d="M65 130 L40 150" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M95 130 L110 125" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Legs in stride -->
    <path d="M75 180 L70 210" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M85 180 L95 210" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Desk/Prop -->
  <rect x="10" y="180" width="60" height="60" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="4"/>
  <circle cx="40" cy="200" r="5" fill="#ec4899"/>
  
  <!-- Lighting Accent -->
  <path d="M0 120 L240 120" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
</svg>