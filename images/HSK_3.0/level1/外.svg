<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window Frame -->
  <rect x="40" y="40" width="160" height="160" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="120" y="40" width="4" height="160" fill="#475569"/>
  <rect x="40" y="120" width="160" height="4" fill="#475569"/>
  
  <!-- Interior view (warm) -->
  <rect x="44" y="44" width="74" height="74" fill="#1e293b"/>
  <circle cx="81" cy="81" r="15" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Exterior view (Rainy/Dark) -->
  <rect x="122" y="44" width="74" height="74" fill="#0f172a"/>
  <path d="M130 50 l-5 10 M150 60 l-5 10 M170 50 l-5 10 M140 80 l-5 10 M160 90 l-5 10 M185 70 l-5 10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Exterior view (Lower) -->
  <rect x="44" y="122" width="74" height="74" fill="#0f172a"/>
  <path d="M50 130 l-5 10 M70 140 l-5 10 M90 130 l-5 10 M60 160 l-5 10 M80 170 l-5 10 M105 150 l-5 10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Plant inside -->
  <path d="M160 195 C160 160, 180 160, 180 195" fill="#10b981"/>
  <ellipse cx="170" cy="195" rx="20" ry="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  
  <!-- Warm light spill from inside -->
  <path d="M40 40 L200 40 L200 200 L40 200 Z" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
</svg>