<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="30" y="175" width="10" height="65" fill="#1e293b"/>
  <rect x="200" y="175" width="10" height="65" fill="#1e293b"/>
  
  <!-- Cluttered items -->
  <circle cx="50" cy="150" r="12" fill="#fb923c"/>
  <rect x="180" y="140" width="30" height="20" rx="2" fill="#38bdf8"/>
  
  <!-- Character -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-40 80 Q-40 40 0 40 Q40 40 40 80 L 40 110 L -40 110 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="25" fill="#fde68a"/>
    <!-- Eyes looking down -->
    <ellipse cx="-8" cy="15" rx="3" ry="4" fill="#0f172a"/>
    <ellipse cx="8" cy="15" rx="3" ry="4" fill="#0f172a"/>
    <!-- Hair -->
    <path d="M-25 15 Q-25 -10 0 -10 Q25 -10 25 15" fill="#1e293b"/>
  </g>
  
  <!-- Arm reaching -->
  <path d="M80 150 L120 120 L135 140" stroke="#fde68a" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- Searching Action: Magnifying Glass -->
  <g transform="translate(150, 130)">
    <circle cx="0" cy="0" r="20" stroke="#fbbf24" stroke-width="6" fill="none"/>
    <line x1="14" y1="14" x2="35" y2="35" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <!-- Light beam effect -->
    <circle cx="0" cy="0" r="15" fill="#f59e0b" opacity="0.2"/>
  </g>
  
  <!-- Scattered papers -->
  <rect x="40" y="180" width="40" height="30" rx="2" fill="#e2e8f0" transform="rotate(-10)"/>
  <rect x="150" y="190" width="45" height="35" rx="2" fill="#cbd5e1" transform="rotate(5)"/>
</svg>