<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Book stack (representing 100 pages) -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="120" height="90" rx="4" fill="#fbbf24"/>
    <rect x="5" y="5" width="110" height="80" rx="2" fill="#f59e0b"/>
    <!-- Page edges lines -->
    <line x1="10" y1="15" x2="110" y2="15" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="25" x2="110" y2="25" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="35" x2="110" y2="35" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="45" x2="110" y2="45" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="55" x2="110" y2="55" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="65" x2="110" y2="65" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="10" y1="75" x2="110" y2="75" stroke="#fff" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Bookmark/Accent -->
  <path d="M160 80 L170 60 L180 80 Z" fill="#ec4899"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="50" r="8" fill="#38bdf8"/>
  <circle cx="200" cy="190" r="12" fill="#10b981"/>
  <path d="M190 40 L210 40 L200 20 Z" fill="#fb923c"/>
</svg>