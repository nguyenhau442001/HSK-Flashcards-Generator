<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Shop Counter -->
  <path d="M20 180 L220 180 L210 220 L30 220 Z" fill="#334155"/>
  <path d="M25 180 L215 180 L205 215 L35 215 Z" fill="#475569"/>
  
  <!-- Price Tag Floating Effect -->
  <circle cx="180" cy="80" r="35" fill="#f59e0b" opacity="0.2"/>
  <circle cx="180" cy="80" r="25" fill="#f59e0b" opacity="0.4"/>
  <path d="M175 70 L185 70 L180 90 Z" fill="#fff"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M40 160 C40 130 60 120 80 120 C100 120 120 130 120 160 L120 180 L40 180 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="80" cy="100" r="30" fill="#fcd34d"/>
    <!-- Shocked Face -->
    <path d="M65 95 Q70 90 75 95" stroke="#1e293b" stroke-width="3" fill="none"/>
    <path d="M85 95 Q90 90 95 95" stroke="#1e293b" stroke-width="3" fill="none"/>
    <ellipse cx="80" cy="115" rx="8" ry="12" fill="#1e293b"/>
    <!-- Hands -->
    <path d="M50 130 L30 110" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    <path d="M110 130 L130 110" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Luxury Item (The expensive coat) -->
  <path d="M150 100 L190 100 L200 160 L140 160 Z" fill="#ec4899"/>
  <path d="M155 105 L185 105 L180 155 L160 155 Z" fill="#db2777"/>
  
  <!-- Sparkles -->
  <path d="M190 60 L195 50 L200 60 L210 65 L200 70 L195 80 L190 70 L180 65 Z" fill="#fbbf24"/>
  <path d="M160 90 L163 85 L166 90 L172 93 L166 96 L163 102 L160 96 L154 93 Z" fill="#fbbf24"/>
</svg>