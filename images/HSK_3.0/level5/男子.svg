<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Park Background Elements -->
  <path d="M0 180 Q 120 150 240 180 L 240 240 L 0 240 Z" fill="#064e3b" opacity="0.6"/>
  <circle cx="200" cy="50" r="25" fill="#fbbf24" opacity="0.2"/>
  <path d="M20 200 C 40 150, 60 150, 80 200" stroke="#10b981" stroke-width="4" fill="none"/>
  <path d="M160 210 C 180 160, 200 160, 220 210" stroke="#10b981" stroke-width="4" fill="none"/>
  
  <!-- Running Man -->
  <g transform="translate(80, 110)">
    <!-- Legs -->
    <path d="M20 80 L 35 50 L 45 80" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M0 80 L 10 50 L 20 80" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Body -->
    <path d="M15 20 L 15 60" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M15 30 L 5 50" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M15 35 L 25 55" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="15" cy="15" r="12" fill="#fb923c"/>
    <!-- Headband -->
    <path d="M5 10 L 25 10" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Park Path -->
  <path d="M0 220 L 240 220" stroke="#475569" stroke-width="15" stroke-dasharray="20 10"/>
  
  <!-- Decorative Leaves -->
  <path d="M10 160 Q 20 140 30 160" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M220 170 Q 230 150 240 170" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>