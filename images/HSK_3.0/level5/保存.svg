<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Vault Glow -->
    <radialGradient id="vaultGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Vault Metal Gradients -->
    <linearGradient id="vaultBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="vaultRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glass/Shield Effect -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Ambient Lights & Shelf) -->
  <g opacity="0.6">
    <rect x="30" y="190" width="180" height="6" rx="3" fill="#334155"/>
    <path d="M 60 190 L 80 140 L 160 140 L 180 190 Z" fill="#1e293b" opacity="0.5"/>
  </g>

  <!-- Ambient Golden Glow behind Vault -->
  <circle cx="120" cy="115" r="70" fill="url(#vaultGlow)" filter="url(#glow)"/>

  <!-- Main Vault Structure (Representing Secure Preservation & Storage) -->
  <g filter="url(#shadow)">
    <!-- Vault Outer Frame -->
    <circle cx="120" cy="115" r="72" fill="url(#vaultRim)"/>
    <circle cx="120" cy="115" r="66" fill="url(#vaultBody)"/>
    
    <!-- Vault Inner Ring & Bolts -->
    <circle cx="120" cy="115" r="54" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="8 6"/>
    
    <!-- Vault Dial / Center Mechanism -->
    <circle cx="120" cy="115" r="34" fill="url(#vaultRim)"/>
    <circle cx="120" cy="115" r="26" fill="url(#goldMetal)"/>
    
    <!-- Dial Center Spin Indicator -->
    <circle cx="120" cy="115" r="14" fill="#1e293b"/>
    <polygon points="120,98 123,112 117,112" fill="#fbbf24"/>
    <circle cx="120" cy="115" r="6" fill="#f59e0b"/>
  </g>

  <!-- Precious Preserved Items Inside Vault (Glowing Documents & Gems) -->
  <g>
    <!-- Floating Glowing Document/Scroll (Safely Stored) -->
    <g transform="translate(100, 75) rotate(-15)">
      <rect x="0" y="0" width="22" height="28" rx="3" fill="#ffffff" filter="url(#shadow)"/>
      <rect x="4" y="6" width="14" height="3" rx="1.5" fill="#38bdf8"/>
      <rect x="4" y="12" width="10" height="2" rx="1" fill="#94a3b8"/>
      <rect x="4" y="16" width="12" height="2" rx="1" fill="#94a3b8"/>
    </g>

    <!-- Glowing Gem/Crystal (Preserved Treasure) -->
    <g transform="translate(130, 130) rotate(10)" filter="url(#shadow)">
      <polygon points="12,2 20,10 16,22 8,22 4,10" fill="#10b981"/>
      <polygon points="12,2 20,10 12,22" fill="#34d399"/>
      <polygon points="12,2 4,10 12,22" fill="#059669"/>
    </g>
  </g>

  <!-- Protective Digital Shield Overlay (Denoting 'Preservation / Saving') -->
  <g filter="url(#shadow)">
    <!-- Holographic Shield Path -->
    <path d="M 120 40 
             C 155 40, 180 50, 180 75 
             C 180 125, 150 160, 120 185 
             C 90 160, 60 125, 60 75 
             C 60 50, 85 40, 120 40 Z" 
          fill="url(#shieldGrad)" 
          stroke="#38bdf8" 
          stroke-width="2.5" 
          stroke-dasharray="200" 
          stroke-dashoffset="0"/>

    <!-- Checkmark of Success/Safe Storage -->
    <path d="M 100 115 L 114 128 L 142 98" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)"/>
  </g>

  <!-- Foreground Atmospheric Sparks & Details -->
  <g fill="#fbbf24">
    <circle cx="50" cy="80" r="2.5" opacity="0.8"/>
    <circle cx="190" cy="70" r="3.5" opacity="0.6"/>
    <circle cx="180" cy="150" r="2" opacity="0.9"/>
    <circle cx="65" cy="170" r="3" opacity="0.7"/>
    <!-- Star sparkle top right -->
    <path d="M 195 45 Q 195 52 202 52 Q 195 52 195 59 Q 195 52 188 52 Q 195 52 195 45" fill="#38bdf8" opacity="0.8"/>
    <!-- Star sparkle bottom left -->
    <path d="M 45 125 Q 45 130 50 130 Q 45 130 45 135 Q 45 130 40 130 Q 45 130 45 125" fill="#f59e0b" opacity="0.9"/>
  </g>
</svg>