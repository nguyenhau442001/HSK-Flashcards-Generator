<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Mirror Frame -->
  <rect x="40" y="30" width="160" height="180" rx="10" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="48" y="38" width="144" height="164" rx="5" fill="#e2e8f0"/>
  
  <!-- Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-30 80 Q-30 40 0 40 Q30 40 30 80 L30 100 L-30 100 Z" fill="#fb923c"/>
    <!-- The "Inside Out" detail: A visible seam/tag on the outside -->
    <path d="M-5 45 L5 45 L5 60 L-5 60 Z" fill="#ec4899"/>
    <rect x="-2" y="48" width="4" height="8" fill="#f1f5f9"/>
    
    <!-- Head -->
    <circle cx="0" cy="10" r="25" fill="#fcd34d"/>
    <!-- Eyes -->
    <circle cx="-8" cy="5" r="3" fill="#0f172a"/>
    <circle cx="8" cy="5" r="3" fill="#0f172a"/>
    <!-- Mouth (Surprised/Realizing) -->
    <path d="M-8 15 Q0 22 8 15" stroke="#0f172a" stroke-width="2" fill="none"/>
    
    <!-- Arms -->
    <path d="M-30 50 L-50 70" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 50 L50 70" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Reflection in mirror -->
  <g transform="translate(120, 120)" opacity="0.4">
    <path d="M-30 80 Q-30 40 0 40 Q30 40 30 80 L30 100 L-30 100 Z" fill="#fb923c"/>
    <path d="M-5 45 L5 45 L5 60 L-5 60 Z" fill="#ec4899"/>
    <circle cx="0" cy="10" r="25" fill="#fcd34d"/>
    <circle cx="-8" cy="5" r="3" fill="#0f172a"/>
    <circle cx="8" cy="5" r="3" fill="#0f172a"/>
    <path d="M-8 15 Q0 22 8 15" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>

  <!-- Decorative Room Elements -->
  <circle cx="200" cy="40" r="15" fill="#38bdf8" opacity="0.2"/>
  <rect x="20" y="180" width="30" height="40" rx="5" fill="#10b981" opacity="0.3"/>
</svg>