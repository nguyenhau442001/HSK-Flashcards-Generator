<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subway Tunnel Entrance -->
  <path d="M40 180 L40 100 Q40 60 120 60 Q200 60 200 100 L200 180 Z" fill="#334155" stroke="#475569" stroke-width="4"/>
  <path d="M50 180 L50 105 Q50 70 120 70 Q190 70 190 105 L190 180 Z" fill="#0f172a"/>
  
  <!-- Construction/Opening Signage (Visual context of 'opening') -->
  <rect x="150" y="120" width="40" height="30" rx="4" fill="#f59e0b"/>
  <path d="M160 130 L180 130 M160 140 L180 140 M160 135 L170 135" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Characters: Two people looking at a map/phone -->
  <g transform="translate(60, 150)">
    <circle cx="20" cy="20" r="10" fill="#fbbf24"/>
    <path d="M10 30 Q20 45 30 30" fill="#fb923c"/>
    <path d="M15 40 L25 40 L22 70 L18 70 Z" fill="#38bdf8"/>
    <path d="M25 45 L40 55" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(110, 160)">
    <circle cx="20" cy="20" r="10" fill="#fbbf24"/>
    <path d="M10 30 Q20 45 30 30" fill="#ec4899"/>
    <path d="M15 40 L25 40 L22 70 L18 70 Z" fill="#ec4899"/>
    <path d="M5 50 L20 45" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Calendar/Time indicator (Next month) -->
  <rect x="180" y="30" width="30" height="35" rx="2" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
  <rect x="180" y="30" width="30" height="10" rx="2" fill="#fb923c"/>
  <circle cx="195" cy="55" r="5" fill="#10b981"/>
  
  <!-- Ground -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2"/>
</svg>