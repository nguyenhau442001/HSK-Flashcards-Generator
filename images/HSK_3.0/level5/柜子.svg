<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Wardrobe (柜子) -->
  <rect x="130" y="50" width="70" height="140" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="135" y="55" width="60" height="130" rx="2" fill="#1e293b"/>
  <rect x="164" y="50" width="2" height="140" fill="#475569"/>
  <circle cx="155" cy="120" r="3" fill="#fbbf24"/>
  <circle cx="175" cy="120" r="3" fill="#fbbf24"/>
  
  <!-- Character -->
  <g transform="translate(40, 80)">
    <!-- Body -->
    <path d="M20 120 L60 120 L55 60 L25 60 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="40" cy="45" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M25 40 Q40 20 55 40 Q40 30 25 40" fill="#78350f"/>
    <!-- Arm reaching -->
    <path d="M55 70 L85 90" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Clothes being put in -->
  <path d="M80 85 L110 80 L115 95 L85 100 Z" fill="#ec4899"/>
  <path d="M85 82 L105 78" stroke="#fce7f3" stroke-width="2"/>
  
  <!-- Floor/Room details -->
  <rect x="0" y="190" width="240" height="50" fill="#0f172a"/>
  <circle cx="200" cy="200" r="20" fill="#1e293b" opacity="0.5"/>
  <path d="M10 210 L230 210" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
</svg>