<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="warmSpotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Gallery Interior Background Elements -->
  <!-- Floor -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- Gallery Wall Art 1 (Abstract Landscape Painting) -->
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="60" height="75" rx="3" fill="#334155" />
    <rect x="4" y="4" width="52" height="67" fill="#f8fafc" />
    <!-- Painting content -->
    <path d="M4 45 Q 20 25, 35 40 T 56 30 L 56 71 L 4 71 Z" fill="#a7f3d0" />
    <circle cx="40" cy="22" r="8" fill="#fef08a" />
    <path d="M4 55 Q 30 45, 56 60 L 56 71 L 4 71 Z" fill="#059669" />
  </g>

  <!-- Gallery Wall Art 2 (Modern Geometric Art) -->
  <g transform="translate(155, 35)">
    <rect x="0" y="0" width="55" height="85" rx="3" fill="#334155" />
    <rect x="4" y="4" width="47" height="77" fill="#1e293b" />
    <!-- Painting content -->
    <circle cx="27" cy="42" r="18" fill="#ec4899" />
    <polygon points="12,55 42,55 27,20" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Ceiling Spotlight Beams -->
  <polygon points="55,0 35,190 75,190" fill="url(#warmSpotlight)" />
  <polygon points="180,0 150,190 200,190" fill="url(#spotlight)" />

  <!-- Characters: Two friends walking and viewing the exhibition -->

  <!-- Character 1 (Left: Woman pointing at art) -->
  <g transform="translate(65, 95)">
    <!-- Body / Torso (Teal Jacket) -->
    <path d="M15 45 Q25 40, 35 48 L40 95 L10 95 Z" fill="#0d9488" />
    <!-- Legs (Dark trousers) -->
    <rect x="14" y="95" width="8" height="50" rx="3" fill="#0f172a" />
    <rect x="26" y="95" width="8" height="50" rx="3" fill="#0f172a" />
    <!-- Shoes -->
    <path d="M10 142 L16 142 C20 142, 20 148, 14 148 L10 148 Z" fill="#f8fafc" />
    <path d="M24 142 L32 142 C36 142, 36 148, 30 148 L24 148 Z" fill="#f8fafc" />
    
    <!-- Head & Hair (Ponytail) -->
    <circle cx="25" cy="25" r="13" fill="#fed7aa" />
    <path d="M12 25 Q10 12, 25 12 Q38 12, 38 25 Q35 30, 28 32 L35 40 L20 38 Z" fill="#78350f" />
    <circle cx="37" cy="38" r="4" fill="#78350f" /> <!-- Ponytail bun -->

    <!-- Arm gesturing towards art -->
    <path d="M15 48 Q 0 45, -8 30" fill="none" stroke="#0d9488" stroke-width="7" stroke-linecap="round" />
    <circle cx="-10" cy="27" r="4" fill="#fed7aa" /> <!-- Hand pointing -->
  </g>

  <!-- Character 2 (Right: Man looking at art, arms crossed/relaxed) -->
  <g transform="translate(115, 90)">
    <!-- Body / Torso (Orange/Amber Sweater) -->
    <path d="M12 50 Q25 45, 38 50 L42 100 L8 100 Z" fill="#ea580c" />
    <!-- Legs (Blue jeans) -->
    <rect x="12" y="100" width="9" height="50" rx="3" fill="#1e3a8a" />
    <rect x="25" y="100" width="9" height="50" rx="3" fill="#1e3a8a" />
    <!-- Shoes -->
    <ellipse cx="16" cy="150" rx="6" ry="3" fill="#334155" />
    <ellipse cx="30" cy="150" rx="6" ry="3" fill="#334155" />

    <!-- Head & Hair -->
    <circle cx="25" cy="22" r="13" fill="#fbcfe8" />
    <path d="M12 20 Q25 5, 38 20 Q35 27, 30 25 Z" fill="#1e293b" />

    <!-- Arms -->
    <path d="M12 55 Q 5 65, 20 75" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Gallery Stanchion / Barrier rope in foreground (adds depth) -->
  <g transform="translate(0, 180)">
    <!-- Left Post -->
    <rect x="30" y="-30" width="6" height="40" rx="2" fill="#cbd5e1" />
    <circle cx="33" cy="-33" r="5" fill="#f59e0b" />
    <!-- Right Post -->
    <rect x="200" y="-30" width="6" height="40" rx="2" fill="#cbd5e1" />
    <circle cx="203" cy="-33" r="5" fill="#f59e0b" />
    <!-- Red Velvet Rope sagging -->
    <path d="M33 -30 Q 116 10, 203 -30" fill="none" stroke="#dc2626" stroke-width="4" />
  </g>

  <!-- Ambient lighting/dust particles -->
  <circle cx="70" cy="70" r="1.5" fill="#fef08a" opacity="0.6" />
  <circle cx="95" cy="50" r="1" fill="#fef08a" opacity="0.4" />
  <circle cx="160" cy="80" r="2" fill="#38bdf8" opacity="0.5" />
  <circle cx="140" cy="40" r="1" fill="#38bdf8" opacity="0.7" />
  <circle cx="185" cy="110" r="1.5" fill="#fef08a" opacity="0.5" />
</svg>