<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Restaurant Lighting Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Waiter Uniform Gradient -->
    <linearGradient id="apronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Elegant Dress Gradient -->
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Restaurant Interior Environment -->
  <!-- Ambient light from ceiling lamp -->
  <circle cx="120" cy="0" r="150" fill="url(#lampGlow)" />

  <!-- Background Wall Decor (Window / Arch) -->
  <path d="M70,30 Q120,10 170,30 L170,110 L70,110 Z" fill="#334155" opacity="0.4" />
  <!-- Window City Bokeh Lights -->
  <circle cx="95" cy="55" r="4" fill="#fbbf24" opacity="0.6" />
  <circle cx="120" cy="45" r="6" fill="#38bdf8" opacity="0.5" />
  <circle cx="145" cy="65" r="5" fill="#f43f5e" opacity="0.5" />

  <!-- Restaurant Table Surface -->
  <path d="M20,180 L220,180 L205,220 L35,220 Z" fill="#334155" />
  <path d="M25,176 L215,176 L220,180 L20,180 Z" fill="#64748b" />
  <!-- Tablecloth / Runner -->
  <path d="M80,176 L160,176 L175,220 L65,220 Z" fill="#475569" opacity="0.8" />

  <!-- Table Props: Teapot and Teacup -->
  <!-- Teapot -->
  <path d="M100,165 Q95,150 105,140 L115,140 Q125,150 120,165 Z" fill="#e2e8f0" />
  <path d="M108,136 L112,136 L113,140 L107,140 Z" fill="#cbd5e1" />
  <path d="M96,148 Q90,146 92,154" stroke="#cbd5e1" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Teacup & Saucer -->
  <ellipse cx="145" cy="170" rx="10" ry="4" fill="#cbd5e1" />
  <path d="M138,162 L152,162 L150,170 C150,172 140,172 138,170 Z" fill="#f8fafc" />

  <!-- ================= CHARACTER 1: WAITER (Left) ================= -->
  <g id="waiter">
    <!-- Body & Torso -->
    <path d="M40,195 L65,195 L70,135 L45,135 Z" fill="url(#apronGrad)" />
    <path d="M52,135 L63,135 L60,165 L55,165 Z" fill="#ffffff" /> <!-- Shirt collar V -->
    
    <!-- Waiter Head -->
    <circle cx="58" cy="112" r="14" fill="#fcd34d" /> <!-- Warm skin tone -->
    <path d="M46,110 Q50,98 62,100 Q70,102 68,112 Z" fill="#1e293b" /> <!-- Neat hair -->

    <!-- Bowtie -->
    <path d="M54,132 L61,132 L58,135 Z" fill="#1e293b" />
    <path d="M54,132 L61,132 L58,129 Z" fill="#1e293b" />

    <!-- Waiter Arms & Interaction (Holding Order Pad / Pointing) -->
    <!-- Back Arm -->
    <path d="M45,140 L30,155 L35,170" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Arm (Holding menu/notepad, leaning forward attentively) -->
    <path d="M68,145 L85,160 L80,175" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand -->
    <circle cx="78" cy="178" r="4" fill="#fcd34d" />
    <!-- Menu/Pad -->
    <rect x="72" y="165" width="16" height="22" rx="2" fill="#f8fafc" transform="rotate(-15 80 175)" />
    <line x1="75" y1="172" x2="83" y2="172" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="75" y1="177" x2="81" y2="177" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- ================= CHARACTER 2: TÀITAI / WIFE / LADY (Right) ================= -->
  <g id="taitai">
    <!-- Elegant Torso / Dress -->
    <path d="M140,210 L185,210 L190,140 L135,140 Z" fill="url(#dressGrad)" />
    <!-- Scarf / Collar Accent -->
    <path d="M152,140 Q162,150 172,140 Q167,155 157,155 Z" fill="#fbbf24" />

    <!-- Taitai Head -->
    <circle cx="162" cy="110" r="16" fill="#ffedd5" /> <!-- Soft skin tone -->
    
    <!-- Sophisticated Updo Hairstyle -->
    <path d="M146,112 Q144,94 162,92 Q180,94 178,112 Q182,100 172,90 Q152,85 146,100 Z" fill="#0f172a" />
    <circle cx="162" cy="85" r="9" fill="#0f172a" /> <!-- Hair bun -->

    <!-- Facial Expression (Polite, smiling, attentive) -->
    <!-- Friendly curved eye -->
    <path d="M166,108 Q170,112 174,108" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Gentle Smile -->
    <path d="M166,118 Q170,122 174,118" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" />
    <!-- Rosy Cheek -->
    <circle cx="174" cy="115" r="4" fill="#fda4af" opacity="0.6" />

    <!-- Earrings (Adding elegance suitable for '太太') -->
    <circle cx="152" cy="116" r="2" fill="#fbbf24" />

    <!-- Taitai Arms & Gesture (Resting gracefully, engaging in ordering) -->
    <!-- Back Arm -->
    <path d="M185,150 L195,170 L185,185" fill="none" stroke="#be123c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Arm (Gentle open hand gesture pointing slightly at menu) -->
    <path d="M140,145 L125,165 L115,160" fill="none" stroke="#e11d48" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand -->
    <circle cx="112" cy="158" r="4" fill="#ffedd5" />
  </g>

  <!-- Foreground / Atmospheric Elements -->
  <!-- Subtle warm particle/sparkle highlights for high-end dining mood -->
  <circle cx="105" cy="115" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="135" cy="95" r="1.5" fill="#fbbf24" opacity="0.5" />
  <circle cx="185" cy="135" r="2" fill="#fbbf24" opacity="0.6" />
</svg>