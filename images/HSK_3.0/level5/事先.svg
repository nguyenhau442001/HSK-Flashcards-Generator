<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Calendar/Notice Card Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Notification Pop Gradient -->
    <linearGradient id="notifGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lighting -->
  <circle cx="160" cy="80" r="90" fill="url(#lampGlow)"/>

  <!-- ENVIRONMENT / OFFICE BACKGROUND -->
  <!-- Window grid showing night/evening city -->
  <g opacity="0.4">
    <rect x="25" y="30" width="50" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <line x1="50" y1="30" x2="50" y2="100" stroke="#475569" stroke-width="1.5"/>
    <line x1="25" y1="65" x2="75" y2="65" stroke="#475569" stroke-width="1.5"/>
    <!-- City lights outside -->
    <rect x="32" y="40" width="6" height="8" fill="#fbbf24" opacity="0.6"/>
    <rect x="42" y="50" width="6" height="12" fill="#38bdf8" opacity="0.6"/>
    <rect x="60" y="45" width="8" height="15" fill="#fbbf24" opacity="0.4"/>
  </g>

  <!-- Bookshelf & Plant on shelf -->
  <g transform="translate(180, 25)">
    <rect x="-10" y="45" width="60" height="6" rx="2" fill="#475569"/>
    <!-- Books -->
    <rect x="-2" y="25" width="10" height="20" rx="1" fill="#ec4899"/>
    <rect x="10" y="22" width="12" height="23" rx="1" fill="#38bdf8"/>
    <rect x="24" y="28" width="8" height="17" rx="1" fill="#10b981"/>
    <!-- Small pot plant -->
    <path d="M 40,45 L 44,35 L 52,35 L 56,45 Z" fill="#cbd5e1"/>
    <circle cx="48" cy="30" r="8" fill="#10b981"/>
    <circle cx="44" cy="27" r="6" fill="#34d399"/>
  </g>

  <!-- Desk Surface -->
  <rect x="0" y="175" width="240" height="65" fill="#0f172a"/>
  <rect x="0" y="170" width="240" height="6" fill="#334155" rx="2"/>

  <!-- Desk Props: Laptop & Calendar -->
  <!-- Laptop Base -->
  <path d="M 120,170 L 190,170 L 205,178 L 105,178 Z" fill="#64748b"/>
  <!-- Laptop Screen -->
  <path d="M 125,125 L 185,125 L 190,170 L 120,170 Z" fill="#334155" stroke="#475569" stroke-width="1"/>
  <rect x="132" y="132" width="46" height="30" rx="2" fill="#0f172a"/>
  <!-- Code/UI lines on laptop -->
  <line x1="137" y1="140" x2="160" y2="140" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="137" y1="148" x2="152" y2="148" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="137" y1="156" x2="165" y2="156" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>

  <!-- Wall Calendar (Showing Advance Notice Concept) -->
  <g transform="translate(110, 35)">
    <rect x="0" y="0" width="36" height="42" rx="4" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="36" height="10" rx="4" fill="#ef4444"/>
    <!-- Calendar grid dots/lines -->
    <circle cx="9" cy="18" r="2" fill="#94a3b8"/>
    <circle cx="18" cy="18" r="2" fill="#94a3b8"/>
    <circle cx="27" cy="18" r="2" fill="#94a3b8"/>
    <circle cx="9" cy="26" r="2" fill="#94a3b8"/>
    <!-- Highlighted Advance Date -->
    <circle cx="18" cy="26" r="4" fill="#fbbf24"/>
    <circle cx="27" cy="26" r="2" fill="#94a3b8"/>
    <circle cx="9" cy="34" r="2" fill="#94a3b8"/>
    <circle cx="18" cy="34" r="2" fill="#94a3b8"/>
    <circle cx="27" cy="34" r="2" fill="#94a3b8"/>
  </g>

  <!-- MAIN CHARACTER (EMPLOYEE / COLLEAGUE) -->
  <g transform="translate(30, 75)">
    <!-- Body / Torso (Teal Hoodie) -->
    <path d="M 35,65 C 35,50 45,40 65,40 C 85,40 95,50 95,65 L 105,105 L 25,105 Z" fill="#0d9488"/>
    <path d="M 65,40 L 65,65" stroke="#0f766e" stroke-width="2"/>
    <!-- Collar -->
    <path d="M 52,40 C 52,48 78,48 78,40" fill="none" stroke="#115e59" stroke-width="3"/>

    <!-- Neck -->
    <rect x="57" y="30" width="16" height="14" fill="#fcd34d"/>

    <!-- Head & Hair -->
    <circle cx="65" cy="24" r="18" fill="#fcd34d"/>
    <!-- Hair (Dark modern crop) -->
    <path d="M 47,24 C 47,12 56,8 65,8 C 74,8 83,12 83,24 C 83,28 81,25 79,20 C 77,15 72,12 65,12 C 58,12 53,15 51,20 C 49,25 47,28 47,24 Z" fill="#1e293b"/>

    <!-- Face Expression (Calm, Attentive, Communicating) -->
    <!-- Eyes -->
    <circle cx="59" cy="24" r="2" fill="#1e293b"/>
    <circle cx="71" cy="24" r="2" fill="#1e293b"/>
    <!-- Friendly open mouth speaking/notifying -->
    <path d="M 63,30 C 63,33 67,33 67,30 Z" fill="#991b1b"/>

    <!-- Gesturing Arm (Pointing forward / Giving notice) -->
    <!-- Left Arm resting -->
    <path d="M 35,55 L 20,80 L 30,85" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Arm raised actively gesturing "prior notice" -->
    <path d="M 95,52 C 105,52 115,65 115,75 L 120,85" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="122" cy="88" r="6" fill="#fcd34d"/>
  </g>

  <!-- FLOATING NOTIFICATION DIALOG (Visualizing "Notify in Advance") -->
  <g transform="translate(100, 30)">
    <!-- Speech bubble body -->
    <rect x="0" y="0" width="75" height="42" rx="8" fill="url(#notifGrad)" stroke="#7dd3fc" stroke-width="1.5"/>
    <!-- Bubble tail pointing down-left to character -->
    <path d="M 15,42 L 25,52 L 32,42 Z" fill="#0ea5e9"/>
    
    <!-- Abstract representation of advance notification: Clock + Check/Bell icon graphic -->
    <!-- Clock circle -->
    <circle cx="25" cy="21" r="12" fill="#ffffff" opacity="0.2"/>
    <circle cx="25" cy="21" r="10" fill="#ffffff"/>
    <polyline points="25,15 25,21 29,23" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Notice lines / data representation inside bubble -->
    <line x1="40" y1="16" x2="63" y2="16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="26" x2="55" y2="26" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>

    <!-- Small alert flash indicator -->
    <circle cx="65" cy="10" r="5" fill="#f59e0b"/>
    <path d="M 65,7 L 65,13 M 62,10 L 68,10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground plant pot for depth -->
  <g transform="translate(15, 145)">
    <path d="M 5,35 L 15,60 L 35,60 L 45,35 Z" fill="#475569"/>
    <ellipse cx="25" cy="35" rx="15" ry="4" fill="#64748b"/>
    <path d="M 25,35 Q 20,15 5,10" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <path d="M 25,35 Q 30,10 45,5" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <path d="M 25,35 Q 15,22 20,8" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>