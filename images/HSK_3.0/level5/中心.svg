<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Background Gradient: Deep urban night sky -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#162032" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing effect for city lights and central landmark -->
    <radialGradient id="centralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Cyan Glow -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Warm Light Glow -->
    <filter id="warmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. CANVAS CONTAINER & BACKGROUND -->
  <rect width="240" height="240" rx="24" fill="url(#skyGradient)" />

  <!-- Stars / Ambient night atmosphere -->
  <g fill="#94a3b8" opacity="0.4">
    <circle cx="35" cy="30" r="1" />
    <circle cx="85" cy="20" r="1.5" />
    <circle cx="160" cy="25" r="1" />
    <circle cx="210" cy="40" r="1.2" />
    <circle cx="25" cy="65" r="0.8" />
    <circle cx="215" cy="85" r="1" />
  </g>

  <!-- Distant City Skyline Layers (Background) -->
  <g fill="#1e293b" opacity="0.7">
    <polygon points="10,170 10,130 25,130 25,170" />
    <polygon points="25,170 25,110 45,110 45,170" />
    <polygon points="45,170 45,140 65,140 65,170" />
    <polygon points="175,170 175,120 195,120 195,170" />
    <polygon points="195,170 195,140 215,140 215,170" />
    <polygon points="215,170 215,105 235,105 235,170" />
  </g>

  <!-- Mid-ground Cityscape with Windows -->
  <g fill="#27354f">
    <!-- Left buildings -->
    <rect x="35" y="90" width="30" height="80" />
    <rect x="62" y="105" width="25" height="65" />
    <!-- Right buildings -->
    <rect x="150" y="95" width="28" height="75" />
    <rect x="175" y="80" width="35" height="90" />
  </g>

  <!-- Glowing Windows (Mid-ground) -->
  <g fill="#38bdf8" opacity="0.6">
    <rect x="42" y="100" width="4" height="6" />
    <rect x="52" y="100" width="4" height="6" />
    <rect x="42" y="115" width="4" height="6" />
    <rect x="52" y="115" width="4" height="6" />
    <rect x="42" y="130" width="4" height="6" />
    <rect x="52" y="130" width="4" height="6" />
    
    <rect x="183" y="90" width="5" height="8" />
    <rect x="195" y="90" width="5" height="8" />
    <rect x="183" y="108" width="5" height="8" />
    <rect x="195" y="108" width="5" height="8" />
    <rect x="183" y="126" width="5" height="8" />
    <rect x="195" y="126" width="5" height="8" />
  </g>

  <!-- 2. THE DYNAMIC CENTERPIECE (THE "CENTRAL" LANDMARK / TOWER) -->
  <!-- Ambient Glow centered at the middle of the city -->
  <circle cx="120" cy="110" r="70" fill="url(#centralGlow)" />

  <g id="centralLandmark">
    <!-- Tall Modern Observation Tower / Centerpiece -->
    <!-- Base structure -->
    <polygon points="112,170 128,170 133,60 107,60" fill="#334155" />
    <!-- Center bright spire/column -->
    <polygon points="116,170 124,170 122,40 118,40" fill="#475569" />
    
    <!-- Observation Deck (The Hub/Center) -->
    <path d="M 105,75 Q 120,65 135,75 L 138,90 Q 120,100 102,90 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="120" cy="82" rx="17" ry="6" fill="#38bdf8" opacity="0.8" filter="url(#neonCyan)" />

    <!-- Spire tip with glowing beacon -->
    <rect x="119" y="25" width="2" height="15" fill="#94a3b8" />
    <circle cx="120" cy="23" r="3" fill="#f43f5e" filter="url(#warmGlow)" />
    <circle cx="120" cy="23" r="1.5" fill="#ffffff" />

    <!-- Futuristic architectural rings / lights on the tower -->
    <ellipse cx="120" cy="115" rx="10" ry="3" fill="#fbbf24" filter="url(#warmGlow)" />
    <ellipse cx="120" cy="140" rx="13" ry="3" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Radial Plaza / Center Ground (Concentric rings showing "Center") -->
  <ellipse cx="120" cy="175" rx="75" ry="22" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <ellipse cx="120" cy="175" rx="50" ry="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" />
  <ellipse cx="120" cy="175" rx="25" ry="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
  <!-- Center marker point -->
  <ellipse cx="120" cy="175" rx="8" ry="3" fill="#f59e0b" filter="url(#warmGlow)" />

  <!-- 3. FOREGROUND & CHARACTERS (Real-world context & interaction) -->
  <!-- Street level elements / Low walls / Planters -->
  <path d="M 0 195 Q 60 185 120 185 Q 180 185 240 195 L 240 240 L 0 240 Z" fill="#090d16" />
  <path d="M 0 200 Q 60 190 120 190 Q 180 190 240 200 L 240 240 L 0 240 Z" fill="#1e293b" />

  <!-- Character 1: Tourist / Guide pointing out the center -->
  <g id="characterGuide">
    <!-- Body / Jacket -->
    <path d="M 70,225 L 75,200 L 88,205 L 92,225 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="81" cy="192" r="7" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 74,192 C 74,187 88,187 88,192 C 88,189 74,189 74,192 Z" fill="#1e293b" />
    <!-- Arm pointing up/center -->
    <path d="M 85,203 L 105,188 L 108,192 L 91,208 Z" fill="#ec4899" />
    <circle cx="106" cy="189" r="2.5" fill="#fcd34d" />
    <!-- Legs -->
    <rect x="74" y="225" width="5" height="15" fill="#334155" />
    <rect x="83" y="225" width="5" height="15" fill="#334155" />
  </g>

  <!-- Character 2: Friend looking and taking it in -->
  <g id="characterFriend">
    <!-- Body / Sweater -->
    <path d="M 150,225 L 153,202 L 167,206 L 164,225 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="159" cy="193" r="6.5" fill="#fcd34d" />
    <!-- Hair (Ponytail) -->
    <circle cx="166" cy="192" r="3" fill="#0f172a" />
    <path d="M 153,193 C 153,188 165,188 165,193 Z" fill="#0f172a" />
    <!-- Arm holding camera/phone -->
    <path d="M 153,206 L 145,212 L 149,215 L 157,208 Z" fill="#38bdf8" />
    <rect x="142" y="211" width="5" height="4" rx="1" fill="#f8fafc" />
    <!-- Legs -->
    <rect x="152" y="225" width="4.5" height="15" fill="#1e293b" />
    <rect x="160" y="225" width="4.5" height="15" fill="#1e293b" />
  </g>

  <!-- 4. ATMOSPHERIC DETAILS (Lighting, reflections, depth) -->
  <!-- Warm ground reflection under the central tower -->
  <ellipse cx="120" cy="190" rx="35" ry="6" fill="#f59e0b" opacity="0.25" filter="url(#warmGlow)" />

  <!-- Street lamps casting pools of warm light -->
  <g id="streetLamps">
    <!-- Left Lamp -->
    <path d="M 25,230 L 25,180" stroke="#475569" stroke-width="2" />
    <path d="M 25,180 Q 28,175 32,178" stroke="#475569" stroke-width="1.5" fill="none" />
    <circle cx="33" cy="180" r="3" fill="#fbbf24" filter="url(#warmGlow)" />
    <ellipse cx="33" cy="195" rx="12" ry="4" fill="#fbbf24" opacity="0.2" />

    <!-- Right Lamp -->
    <path d="M 215,230 L 215,180" stroke="#475569" stroke-width="2" />
    <path d="M 215,180 Q 212,175 208,178" stroke="#475569" stroke-width="1.5" fill="none" />
    <circle cx="207" cy="180" r="3" fill="#fbbf24" filter="url(#warmGlow)" />
    <ellipse cx="207" cy="195" rx="12" ry="4" fill="#fbbf24" opacity="0.2" />
  </g>

  <!-- Subtle glowing directional arrow or focus rings pointing to the center ground (Visual HSK grammar helper without text) -->
  <g opacity="0.6">
    <path d="M 120,162 L 116,168 L 124,168 Z" fill="#f59e0b" />
    <path d="M 120,166 L 117,171 L 123,171 Z" fill="#f59e0b" opacity="0.7" />
  </g>

  <!-- Foreground framing vignette (Rounded corners overlay for aesthetic clean layout) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>