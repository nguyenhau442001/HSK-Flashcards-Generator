<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow representing warmth/comfort (慰) -->
  <circle cx="120" cy="130" r="90" fill="url(#warmGlow)"/>

  <!-- Background Environment (Cozy Room details) -->
  <!-- Bookshelf / Wall line -->
  <path d="M 30,50 L 210,50" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Small potted plant on shelf -->
  <path d="M 50,50 L 55,38 L 65,38 L 70,50 Z" fill="#64748b"/>
  <path d="M 60,38 Q 55,25 45,28 Q 55,33 60,38 Z" fill="#10b981"/>
  <path d="M 60,38 Q 68,25 75,30 Q 68,35 60,38 Z" fill="#10b981"/>

  <!-- Warm Hanging Lamp -->
  <path d="M 120,0 L 120,25" stroke="#475569" stroke-width="2"/>
  <path d="M 105,25 L 135,25 L 140,35 L 100,35 Z" fill="#f59e0b"/>
  <path d="M 100,35 Q 120,70 140,35 Z" fill="#fbbf24" opacity="0.3"/>

  <!-- Floor / Couch Base -->
  <rect x="20" y="170" width="200" height="40" rx="12" fill="#334155"/>
  <rect x="30" y="150" width="180" height="30" rx="10" fill="#475569"/>

  <!-- Main Scene: Two Friends Empathizing (Comfort / 安慰) -->
  
  <!-- Person 1: Sitting sadly (leaning down slightly) -->
  <g transform="translate(85, 110)">
    <!-- Body -->
    <path d="M 15,30 Q 25,15 35,30 L 45,60 L 5,60 Z" fill="#6366f1"/>
    <!-- Head -->
    <circle cx="25" cy="12" r="12" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 13,10 Q 25,-2 37,10 Q 35,20 25,18 Q 15,20 13,10 Z" fill="#475569"/>
    <!-- Drooped posture (sad face implied by body language) -->
  </g>

  <!-- Cozy Blanket draped over Person 1 -->
  <path d="M 90,130 Q 110,140 130,130 L 135,160 L 85,160 Z" fill="url(#blanketGrad)"/>

  <!-- Person 2: Comforting (Embracing / Patting shoulder) -->
  <g transform="translate(125, 100)">
    <!-- Body -->
    <path d="M 15,25 Q 5,20 0,45 L 10,70 L 40,70 L 35,40 Z" fill="#14b8a6"/>
    <!-- Head (turned towards friend) -->
    <circle cx="15" cy="10" r="12" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 5,8 Q 15,-2 25,8 Q 20,15 15,13 Q 10,15 5,8 Z" fill="#1e293b"/>
    <!-- Comforting Arm reaching out -->
    <path d="M 5,30 Q -15,35 -25,25" fill="none" stroke="#14b8a6" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand gently patting shoulder -->
    <circle cx="-27" cy="24" r="4" fill="#fed7aa"/>
  </g>

  <!-- Comfort Props on a low wooden side table -->
  <!-- Table -->
  <rect x="175" y="155" width="45" height="8" rx="2" fill="#94a3b8"/>
  <rect x="185" y="163" width="6" height="25" fill="#64748b"/>
  <rect x="205" y="163" width="6" height="25" fill="#64748b"/>

  <!-- Steaming Mug of Warm Tea/Cocoa (Symbol of care and warmth) -->
  <rect x="188" y="138" width="16" height="18" rx="3" fill="url(#cupGrad)"/>
  <path d="M 204,142 Q 210,142 210,147 Q 210,152 204,152" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam lines -->
  <path d="M 193,132 Q 195,127 192,122" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 199,134 Q 201,129 198,124" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Soft Heart / Care Icon floating subtly to reinforce emotion -->
  <path d="M 120,78 Q 125,70 132,75 Q 138,82 120,95 Q 102,82 108,75 Q 115,70 120,78 Z" fill="#f43f5e" opacity="0.85"/>
  <path d="M 120,78 Q 125,70 132,75 Q 138,82 120,95 Q 102,82 108,75 Q 115,70 120,78 Z" fill="none" stroke="#fb7185" stroke-width="1.5"/>

  <!-- Sparkles of emotional warmth -->
  <circle cx="75" cy="85" r="2" fill="#fbbf24"/>
  <circle cx="160" cy="80" r="1.5" fill="#fbbf24"/>
  <circle cx="150" cy="120" r="2" fill="#f43f5e"/>
</svg>