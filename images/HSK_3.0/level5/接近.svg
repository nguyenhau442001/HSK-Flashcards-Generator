<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="target-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="platform" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Starry / Tech Grid Background Details -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="60" x2="240" y2="60"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
    <line x1="0" y1="180" x2="240" y2="180"/>
    <line x1="60" y1="0" x2="60" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="180" y1="0" x2="180" y2="240"/>
  </g>

  <!-- The Target (Goal) in the distance -->
  <g transform="translate(180, 100)">
    <circle cx="0" cy="0" r="35" fill="url(#target-glow)"/>
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
    <circle cx="0" cy="0" r="16" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    <!-- Goal stand / beacon pole -->
    <rect x="-3" y="24" width="6" height="60" fill="#475569"/>
    <path d="M-12,84 L12,84 L16,92 L-16,92 Z" fill="#64748b"/>
  </g>

  <!-- Environment / Ground -->
  <path d="M0,190 L240,190 L240,240 L0,240 Z" fill="url(#platform)"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Ambient light beam showing approaching movement -->
  <polygon points="50,140 180,75 180,125 50,190" fill="url(#beam)"/>

  <!-- Character 1 (Leader - pointing forward) -->
  <g transform="translate(75, 120)">
    <!-- Shadow -->
    <ellipse cx="0" cy="70" rx="14" ry="4" fill="#020617" opacity="0.6"/>
    <!-- Legs -->
    <path d="M-4,40 L-10,68 L-4,70 L2,50" fill="#0f172a"/>
    <path d="M6,40 L12,65 L18,65 L10,48" fill="#1e293b"/>
    <!-- Body / Torso -->
    <path d="M-10,15 L10,15 L8,45 L-8,45 Z" fill="#38bdf8"/>
    <path d="M-8,18 L8,18 L6,42 L-6,42 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="0" cy="2" r="10" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M-10,-2 C-10,-8 10,-8 10,-2 C8,-6 -8,-6 -10,-2 Z" fill="#1e293b"/>
    <!-- Arm pointing -->
    <path d="M8,20 L28,8 L26,14 L12,28 Z" fill="#fbcfe8"/>
    <!-- Backpack -->
    <rect x="-14" y="16" width="6" height="22" rx="3" fill="#fb923c"/>
  </g>

  <!-- Character 2 (Follower walking dynamically closer) -->
  <g transform="translate(35, 130)">
    <!-- Shadow -->
    <ellipse cx="0" cy="60" rx="12" ry="3" fill="#020617" opacity="0.6"/>
    <!-- Legs -->
    <path d="M-6,35 L-14,58 L-8,60 L-2,42" fill="#334155"/>
    <path d="M4,35 L10,55 L16,52 L8,38" fill="#1e293b"/>
    <!-- Body / Torso -->
    <path d="M-9,12 L9,14 L7,40 L-7,38 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="9" fill="#fbcfe8"/>
    <!-- Hair / Cap -->
    <path d="M-9,-3 L9,-3 L8,-8 L-8,-8 Z" fill="#059669"/>
    <!-- Arms moving in motion -->
    <path d="M-7,18 L-18,28 L-15,33 L-4,24" fill="#fbcfe8"/>
    <path d="M7,18 L18,25 L15,30 L5,22" fill="#fbcfe8"/>
    <!-- Small tech gear prop on belt -->
    <rect x="5" y="32" width="6" height="5" rx="1" fill="#fbbf24"/>
  </g>

  <!-- Foreground Atmospheric Details (Motion lines / approach indicators) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="105" x2="140" y2="95"/>
    <line x1="130" y1="125" x2="155" y2="112"/>
    <line x1="100" y1="145" x2="125" y2="132"/>
  </g>

  <g stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="150" y1="85" x2="165" y2="77"/>
  </g>
</svg>