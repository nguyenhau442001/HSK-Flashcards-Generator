<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="10" fill="#334155"/>
  
  <!-- The Subject: A student studying hard -->
  <g transform="translate(120, 140)">
    <!-- Body -->
    <path d="M-40 40 L40 40 L30 -20 L-30 -20 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-45" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 -50 C-25 -70 25 -70 25 -50 L25 -40 L-25 -40 Z" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="-15" y="-50" width="10" height="8" rx="2" fill="#1e293b"/>
    <rect x="5" y="-50" width="10" height="8" rx="2" fill="#1e293b"/>
    <!-- Expression: Focused/Determined -->
    <path d="M-10 -35 Q0 -30 10 -35" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>

  <!-- Props: Evidence of hard work -->
  <rect x="40" y="170" width="60" height="40" rx="4" fill="#f1f5f9"/>
  <line x1="50" y1="180" x2="90" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="190" x2="90" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="200" x2="70" y2="200" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Coffee Mug - Warm Glow -->
  <circle cx="180" cy="190" r="15" fill="#fb923c"/>
  <rect x="195" y="185" width="5" height="10" rx="2" fill="#fb923c"/>
  <circle cx="180" cy="190" r="8" fill="#f59e0b" opacity="0.5"/>
  
  <!-- Floating Checkmark/Star to represent "Indeed/True" -->
  <path d="M190 80 L195 95 L210 95 L198 105 L202 120 L190 110 L178 120 L182 105 L170 95 L185 95 Z" fill="#10b981"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
</svg>