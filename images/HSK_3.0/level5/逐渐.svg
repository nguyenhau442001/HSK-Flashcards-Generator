<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="40" y="35" width="160" height="110" rx="8" />
    </clipPath>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Window Frame -->
  <rect x="40" y="35" width="160" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  
  <!-- Outside View -->
  <g clip-path="url(#windowClip)">
    <!-- Twilight Sky -->
    <rect x="40" y="35" width="160" height="110" fill="#1e293b"/>
    <!-- Distant Tree Branch -->
    <path d="M200,60 Q170,70 150,65 T120,80" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M160,68 Q155,55 145,50" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Falling Leaves (Gradual Change) -->
    <path d="M130,50 Q135,55 130,60 Q125,55 130,50" fill="#fb923c" transform="rotate(15, 130, 55)"/>
    <path d="M170,90 Q175,95 170,100 Q165,95 170,90" fill="#f59e0b" transform="rotate(-20, 170, 95)"/>
    <path d="M70,70 Q75,75 70,80 Q65,75 70,70" fill="#fb923c" transform="rotate(45, 70, 75)"/>
    <!-- Wind Swirls -->
    <path d="M50,100 Q80,90 110,105" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
    <path d="M140,120 Q160,110 180,115" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>

  <!-- Window Panes -->
  <line x1="120" y1="35" x2="120" y2="145" stroke="#334155" stroke-width="2"/>
  <line x1="40" y1="90" x2="200" y2="90" stroke="#334155" stroke-width="2"/>

  <!-- Interior: Table and Mug -->
  <path d="M0,200 L240,200 L240,240 L0,240 Z" fill="#1e293b" opacity="0.5"/>
  <rect x="160" y="185" width="40" height="6" rx="2" fill="#334155"/>
  <!-- Steaming Mug -->
  <path d="M170,165 L190,165 L188,185 L172,185 Z" fill="#ec4899"/>
  <path d="M190,170 Q195,170 195,175 Q195,180 190,180" fill="none" stroke="#ec4899" stroke-width="2"/>
  <path d="M175,158 Q177,150 175,145" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M182,158 Q184,150 182,145" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Character -->
  <!-- Body/Sweater -->
  <path d="M70,240 Q70,180 120,180 Q170,180 170,240" fill="#475569"/>
  <!-- Head -->
  <circle cx="120" cy="155" r="22" fill="#fde68a"/>
  <!-- Hair -->
  <path d="M98,155 Q98,133 120,133 Q142,133 142,155 L142,165 Q120,155 98,165 Z" fill="#334155"/>
  <!-- Eyes (Closed/Content) -->
  <path d="M110,155 Q113,158 116,155" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M124,155 Q127,158 130,155" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- The Scarf (Action of wrapping) -->
  <path d="M100,175 Q120,190 140,175 L145,210 Q120,225 95,210 Z" fill="#f59e0b"/>
  <path d="M100,175 Q120,165 140,175" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <!-- Hands holding the scarf -->
  <circle cx="95" cy="205" r="6" fill="#fde68a"/>
  <circle cx="145" cy="205" r="6" fill="#fde68a"/>
  
  <!-- Foreground Glow -->
  <circle cx="120" cy="240" r="100" fill="url(#glowGrad)" opacity="0.1"/>
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>