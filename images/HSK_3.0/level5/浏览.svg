<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Glow Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Phone Screen Glow / Swipe Trail Gradient -->
    <linearGradient id="swipeTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft Lamp Light -->
    <radialGradient id="lampLight" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & PROPS: Background Layer -->
  <!-- Cozy Room Wall / Backdrops -->
  <rect x="0" y="0" width="240" height="150" fill="#1e293b"/>
  <!-- Ambient Wall Glow from Lamp -->
  <circle cx="180" cy="50" r="90" fill="url(#lampLight)"/>

  <!-- Window Frame & City Silhouette outside -->
  <g transform="translate(16, 25)">
    <rect x="0" y="0" width="50" height="70" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="50" height="70" rx="4" fill="url(#windowGlow)"/>
    <!-- City Skyline Silhouette -->
    <path d="M5 70 L5 45 L12 45 L12 70 L15 70 L15 35 L22 35 L22 70 L28 70 L28 50 L38 50 L38 70 L45 70 L45 55 L48 55 L48 70 Z" fill="#1e293b"/>
    <!-- Window Cross Bars -->
    <line x1="25" y1="0" x2="25" y2="70" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="35" x2="50" y2="35" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Bookshelf with Colorful Books -->
  <g transform="translate(180, 20)">
    <rect x="0" y="0" width="45" height="12" rx="2" fill="#334155"/>
    <!-- Books -->
    <rect x="5" y="-18" width="8" height="18" rx="1" fill="#ec4899"/>
    <rect x="14" y="-22" width="10" height="22" rx="1" fill="#38bdf8"/>
    <rect x="25" y="-15" width="7" height="15" rx="1" fill="#10b981"/>
    <rect x="33" y="-20" width="9" height="20" rx="1" fill="#f59e0b"/>
  </g>

  <!-- Hanging Potted Plant -->
  <g transform="translate(85, 10)">
    <path d="M15 0 C15 15 25 15 25 0" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <path d="M13 12 L27 12 L24 24 L16 24 Z" fill="#fb923c"/>
    <circle cx="20" cy="10" r="12" fill="#10b981" opacity="0.9"/>
    <path d="M10 15 C5 15 2 22 8 26" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 16 C35 18 38 25 32 28" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Desk & Foreground Elements -->
  <!-- Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#0f172a"/>
  <rect x="0" y="152" width="240" height="10" rx="3" fill="#334155"/>
  <rect x="20" y="162" width="200" height="78" fill="#1e293b"/>

  <!-- Desk Lamp -->
  <g transform="translate(200, 115)">
    <path d="M0 45 C0 45 10 45 15 30 C20 15 10 5 0 0" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10 -5 L10 -5 L5 10 L-5 10 Z" fill="#f59e0b"/>
    <ellipse cx="0" cy="45" rx="12" ry="4" fill="#334155"/>
  </g>

  <!-- Coffee Mug & Notes -->
  <g transform="translate(30, 138)">
    <!-- Sticky Notes -->
    <rect x="40" y="5" width="18" height="18" rx="2" fill="#fbbf24" transform="rotate(12 49 14)"/>
    <rect x="28" y="10" width="18" height="18" rx="2" fill="#38bdf8" transform="rotate(-8 37 19)"/>
    <!-- Coffee Mug -->
    <rect x="0" y="4" width="18" height="20" rx="3" fill="#f1f5f9"/>
    <path d="M18 8 C23 8 23 18 18 18" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="9" cy="4" rx="9" ry="3" fill="#cbd5e1"/>
    <!-- Steam -->
    <path d="M6 -2 C6 -6 10 -6 10 -10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- CHARACTER: Upper Body, Head, Arms performing 'Browsing/Glancing' -->
  <!-- Torso & Hoodie -->
  <g transform="translate(60, 90)">
    <!-- Hoodie Body -->
    <path d="M35 85 C35 60 45 50 65 50 C85 50 95 60 95 85 L115 130 C115 135 110 140 105 140 L25 140 C20 140 15 135 15 130 Z" fill="#3b82f6"/>
    <!-- Hoodie Strings & Inner Collar -->
    <path d="M55 50 C55 60 60 65 65 70" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M75 50 C75 60 70 65 65 70" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M50 50 Q65 60 80 50" fill="none" stroke="#1d4ed8" stroke-width="3"/>

    <!-- Neck & Head -->
    <path d="M58 45 L72 45 L72 53 L58 53 Z" fill="#fbcfe8"/>
    <!-- Head/Face Shape -->
    <circle cx="65" cy="30" r="22" fill="#fbcfe8"/>

    <!-- Hair -->
    <path d="M43 30 C43 15 55 10 65 10 C75 10 87 15 87 30 C87 35 85 30 83 24 C80 15 72 13 65 13 C58 13 50 15 47 24 C45 30 43 35 43 30 Z" fill="#1e293b"/>
    <path d="M45 25 C50 18 60 16 68 18" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Facial Expression: Focused, casual, eyes scanning/moving -->
    <!-- Eyebrows (slightly raised/attentive) -->
    <path d="M53 23 Q57 21 61 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M69 24 Q73 21 77 23" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes (Looking sideways/down at phone content) -->
    <circle cx="58" cy="28" r="3" fill="#1e293b"/>
    <circle cx="72" cy="28" r="3" fill="#1e293b"/>
    <circle cx="59" cy="27" r="1" fill="#ffffff"/>
    <circle cx="73" cy="27" r="1" fill="#ffffff"/>
    <!-- Gentle Smile / Content -->
    <path d="M62 36 Q65 39 68 36" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="53" cy="33" r="4" fill="#f43f5e" opacity="0.3"/>
    <circle cx="77" cy="33" r="4" fill="#f43f5e" opacity="0.3"/>

    <!-- ARMS & HANDS HOLDING DEVICE -->
    <!-- Left Arm (supporting/holding phone edge) -->
    <path d="M35 75 C30 85 35 105 45 115 L55 110 C48 102 44 92 45 80 Z" fill="#2563eb"/>
    <circle cx="48" cy="116" r="5" fill="#fbcfe8"/>

    <!-- Right Arm (holding phone / active thumb gesture) -->
    <path d="M95 75 C100 85 95 105 85 115 L75 110 C82 102 86 92 85 80 Z" fill="#2563eb"/>
    <circle cx="82" cy="116" r="5" fill="#fbcfe8"/>

    <!-- Mobile Phone (The target of browsing action) -->
    <g transform="translate(45, 95) rotate(-10)">
      <!-- Phone Body -->
      <rect x="0" y="0" width="40" height="70" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
      <!-- Screen -->
      <rect x="3" y="6" width="34" height="58" rx="3" fill="#1e293b"/>
      
      <!-- ABSTRACT FEED / CONTENT (Representing 'Scrolling/Browsing' with diverse blocks) -->
      <!-- Item 1 -->
      <rect x="6" y="10" width="28" height="12" rx="2" fill="#334155"/>
      <circle cx="11" cy="16" r="3" fill="#38bdf8"/>
      <rect x="17" y="13" width="13" height="3" rx="1" fill="#94a3b8"/>
      <rect x="17" y="18" width="9" height="2" rx="1" fill="#64748b"/>

      <!-- Item 2 (Current focus) -->
      <rect x="6" y="25" width="28" height="20" rx="2" fill="#0284c7"/>
      <rect x="9" y="28" width="22" height="9" rx="1" fill="#38bdf8"/>
      <rect x="9" y="39" width="15" height="3" rx="1" fill="#e0f2fe"/>
      <rect x="9" y="44" width="10" height="2" rx="1" fill="#bae6fd"/>

      <!-- Item 3 (Peeking below) -->
      <rect x="6" y="48" width="28" height="12" rx="2" fill="#334155"/>
      <circle cx="11" cy="54" r="3" fill="#10b981"/>
      <rect x="17" y="51" width="13" height="3" rx="1" fill="#94a3b8"/>
      <rect x="17" y="56" width="9" height="2" rx="1" fill="#64748b"/>

      <!-- Home Indicator bar -->
      <rect x="14" y="65" width="12" height="2" rx="1" fill="#64748b"/>
    </g>

    <!-- Swipe / Motion Visual Cue (Floating dynamic arcs indicating rapid glancing/scrolling) -->
    <path d="M30 85 C20 75 25 60 38 52" fill="none" stroke="url(#swipeTrail)" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 80 C18 72 22 58 32 50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Motion dots -->
    <circle cx="28" cy="62" r="2" fill="#fbbf24"/>
    <circle cx="34" cy="55" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- FOREGROUND LAYER: Additional spatial depth props -->
  <!-- Plant leaf overlapping desk edge -->
  <path d="M0 240 L0 210 C10 210 25 220 30 240 Z" fill="#059669" opacity="0.9"/>
  <path d="M240 230 L240 240 L210 240 C225 240 235 235 240 230 Z" fill="#047857" opacity="0.9"/>
</svg>