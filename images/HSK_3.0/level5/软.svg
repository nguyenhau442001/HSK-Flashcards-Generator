<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting & bedroom interior backdrop -->
  <circle cx="180" cy="70" r="50" fill="#334155" opacity="0.4"/>
  <rect x="20" y="140" width="200" height="80" rx="12" fill="#1e293b"/>
  
  <!-- Wooden Headboard & Wall details -->
  <rect x="35" y="70" width="170" height="80" rx="8" fill="#334155" opacity="0.6"/>
  <path d="M40 90 L200 90" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Cozy Warm Light Glow (Nightstand lamp area) -->
  <path d="M190 140 L210 210 L170 210 Z" fill="#fbbf24" opacity="0.08"/>
  
  <!-- Main Subject: The Soft Pillow (Puffing up, pressed by hands) -->
  <g transform="translate(120, 150)">
    <!-- Pillow Shadow -->
    <ellipse cx="0" cy="24" rx="55" ry="12" fill="#090d16" opacity="0.6"/>
    
    <!-- Pillow Body (Fluffy, pastel mint/teal with cloud-like squish effect) -->
    <path d="M -55 -5 C -65 -25, -35 -40, -15 -32 C 0 -38, 20 -38, 35 -30 C 55 -38, 70 -15, 55 5 C 65 20, 40 38, 15 32 C -5 38, -35 35, -50 20 C -65 10, -45 2, -55 -5 Z" fill="#5eead4"/>
    
    <!-- Pillow Quilted/Soft Stitching Lines -->
    <path d="M -30 -18 Q 0 -22 30 -15" stroke="#2dd4bf" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M -40 2 Q 0 -5 40 5" stroke="#2dd4bf" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Indentation and Pressing Hands (Showing 'softness' action) -->
    <!-- Left Hand -->
    <path d="M -75 -10 C -60 -5, -45 -12, -35 -18 C -30 -22, -26 -15, -32 -8 C -40 -2, -55 5, -70 8 Z" fill="#fbcfe8"/>
    <!-- Right Hand -->
    <path d="M 75 -5 C 60 -2, 48 -10, 38 -15 C 33 -18, 30 -12, 35 -6 C 42 2, 55 8, 70 10 Z" fill="#fbcfe8"/>
  </g>

  <!-- Character (Cozy persona leaning/testing the pillow, happy expression) -->
  <g transform="translate(75, 95)">
    <!-- Body / Hoodie -->
    <path d="M -35 75 C -35 45, -15 35, 10 35 C 35 35, 55 45, 55 75 Z" fill="#38bdf8"/>
    
    <!-- Head & Hair -->
    <circle cx="10" cy="18" r="22" fill="#fbcfe8"/>
    <!-- Hair (Stylish dark bob) -->
    <path d="M -10 12 C -12 -5, 15 -8, 30 5 C 32 15, 30 25, 28 30 C 25 20, 10 22, -5 20 Z" fill="#0f172a"/>
    
    <!-- Happy Closed Eyes (Enjoying the comfort) -->
    <path d="M 2 16 Q 8 22 14 16" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 6 24 Q 10 28 14 24" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Blush -->
    <circle cx="-1" cy="21" r="3.5" fill="#fda4af" opacity="0.8"/>
    <circle cx="19" cy="21" r="3.5" fill="#fda4af" opacity="0.8"/>
  </g>

  <!-- Floating Sparkles / Comfort Indicator (Highlighting 'very soft') -->
  <g fill="#fbbf24">
    <path d="M 45 60 L 48 68 L 56 71 L 48 74 L 45 82 L 42 74 L 34 71 L 42 68 Z" opacity="0.9"/>
    <path d="M 195 90 L 197 95 L 202 97 L 197 99 L 195 104 L 193 99 L 188 97 L 193 95 Z" opacity="0.7"/>
    <path d="M 105 45 L 107 50 L 112 52 L 107 54 L 105 59 L 103 54 L 98 52 L 103 50 Z" opacity="0.8"/>
  </g>
</svg>