<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light / Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Denim Blue Gradients -->
    <linearGradient id="denimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <linearGradient id="denimDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="denimFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Wood Floor / Surface Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Houseplant Gradients -->
    <linearGradient id="plantLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Shadow Filter for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Room Elements & Ambient Props -->
  <!-- Wooden floor line -->
  <path d="M 0 190 L 240 190" stroke="#334155" stroke-width="2" opacity="0.6"/>
  <path d="M 0 193 L 240 193" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Ambient glowing circles (bokeh) -->
  <circle cx="190" cy="70" r="28" fill="#fbbf24" opacity="0.06"/>
  <circle cx="50" cy="110" r="15" fill="#38bdf8" opacity="0.08"/>
  <circle cx="210" cy="150" r="8" fill="#f43f5e" opacity="0.1"/>

  <!-- Houseplant in background corner -->
  <g transform="translate(185, 115)">
    <!-- Pot -->
    <path d="M 8 35 L 22 35 L 25 65 L 5 65 Z" fill="#cbd5e1" filter="url(#softShadow)"/>
    <ellipse cx="15" cy="35" rx="7" ry="2" fill="#e2e8f0"/>
    <!-- Leaves -->
    <path d="M 15 35 C 15 10, -5 5, -15 -5 C -5 5, 5 15, 15 35 Z" fill="url(#plantLeaf)"/>
    <path d="M 15 35 C 20 15, 35 10, 45 0 C 30 15, 20 20, 15 35 Z" fill="url(#plantLeaf)"/>
    <path d="M 15 35 C 10 0, 20 -15, 15 -25 C 12 -10, 10 15, 15 35 Z" fill="url(#plantLeaf)"/>
  </g>

  <!-- Wall Shelf with folded clothes/accents -->
  <g transform="translate(25, 60)">
    <rect x="0" y="0" width="70" height="6" rx="3" fill="#334155" filter="url(#softShadow)"/>
    <!-- Folded colorful sweater on shelf -->
    <path d="M 15 -10 L 55 -10 C 58 -10, 60 -5, 58 0 L 12 0 C 10 -5, 12 -10, 15 -10 Z" fill="#ec4899"/>
    <path d="M 18 -16 L 52 -16 C 54 -16, 56 -12, 55 -10 L 15 -10 C 14 -12, 16 -16, 18 -16 Z" fill="#f472b6"/>
  </g>

  <!-- Clothes Hanger hanging from top -->
  <g transform="translate(45, 15)">
    <path d="M 35 0 C 35 -5, 30 -8, 25 -8 C 20 -8, 18 -5, 18 0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 5 15 L 35 0 L 65 15 C 68 16.5, 67 20, 62 20 L 8 20 C 3 20, 2 16.5, 5 15 Z" fill="#475569" filter="url(#softShadow)"/>
  </g>

  <!-- MAIN SUBJECT: QUẦN JEAN (Denim Jeans) - Beautifully draped and folded in center-stage -->
  <g filter="url(#dropShadow)" transform="translate(65, 55)">
    <!-- Back drop shadow on floor -->
    <ellipse cx="55" cy="140" rx="45" ry="12" fill="#000000" opacity="0.4"/>

    <!-- Left Leg (Background/Angled) -->
    <path d="M 35 40 
             L 55 40 
             L 50 120 
             L 25 135 
             L 15 125 
             L 30 70 Z" 
          fill="url(#denimDark)"/>

    <!-- Right Leg (Foreground/Dynamic Fold) -->
    <path d="M 50 40 
             L 75 40 
             L 95 110 
             L 105 130 
             L 80 135 
             L 65 95 
             L 45 75 Z" 
          fill="url(#denimLight)"/>

    <!-- Waistband & Upper Body Portion -->
    <path d="M 30 25 
             L 80 25 
             L 85 42 
             L 25 42 Z" 
          fill="#1d4ed8"/>

    <!-- Waistband Detail (Double Stitching & Belt Loops) -->
    <path d="M 28 29 L 82 29" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
    <path d="M 28 35 L 82 35" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
    
    <!-- Belt Loops -->
    <rect x="35" y="24" width="5" height="13" rx="1.5" fill="#3b82f6"/>
    <rect x="65" y="24" width="5" height="13" rx="1.5" fill="#3b82f6"/>

    <!-- Metal Button & Zipper Fly Area -->
    <circle cx="55" cy="33" r="2.5" fill="#fbbf24"/>
    <path d="M 55 36 L 55 48" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M 53 48 L 57 48" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Front Pockets -->
    <path d="M 31 42 C 31 42, 33 52, 42 50 C 42 45, 39 42, 35 42 Z" fill="#1e40af" opacity="0.6"/>
    <path d="M 79 42 C 79 42, 77 52, 68 50 C 68 45, 71 42, 75 42 Z" fill="#1e40af" opacity="0.6"/>
    <path d="M 31 42 L 42 50" stroke="#93c5fd" stroke-width="1" fill="none"/>
    <path d="M 79 42 L 68 50" stroke="#93c5fd" stroke-width="1" fill="none"/>

    <!-- Highlights & Folds for 3D realism -->
    <path d="M 55 40 C 55 70, 65 90, 80 120" stroke="url(#denimFold)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 35 45 C 30 70, 20 100, 20 125" stroke="url(#denimFold)" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- Classic Orange/Gold Denim Stitching Lines -->
    <!-- Outer seam right leg -->
    <path d="M 75 40 L 95 110 L 102 128" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,2" fill="none" opacity="0.85"/>
    <!-- Inner seam right leg -->
    <path d="M 50 42 L 65 95 L 75 130" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,2" fill="none" opacity="0.85"/>
    <!-- Hem fold right leg -->
    <path d="M 80 135 L 105 130" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.85"/>
  </g>

  <!-- Foreground Prop: Sneaker / Shoe next to the jeans -->
  <g transform="translate(145, 135)" filter="url(#softShadow)">
    <!-- Shoe body -->
    <path d="M 5 25 C 5 15, 15 10, 25 12 C 35 14, 45 22, 50 25 C 55 28, 55 35, 50 35 L 5 35 Z" fill="#f8fafc"/>
    <!-- Sole -->
    <path d="M 0 35 L 55 35 L 58 39 L 2 39 Z" fill="#cbd5e1"/>
    <!-- Shoe accent color -->
    <path d="M 25 12 C 30 18, 40 22, 50 25 L 45 28 C 38 25, 30 20, 25 12 Z" fill="#f43f5e"/>
    <!-- Laces -->
    <path d="M 20 16 L 26 21 M 23 15 L 29 20" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Action Sparkles / Energy Dots -->
  <circle cx="35" cy="85" r="3" fill="#fbbf24"/>
  <circle cx="170" cy="100" r="2" fill="#38bdf8"/>
  <circle cx="145" cy="50" r="3.5" fill="#f472b6"/>
  <circle cx="95" cy="175" r="2" fill="#34d399"/>
</svg>