<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Empathy Glow -->
    <radialGradient id="empathyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="windowNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Soft Lamp Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Interior -->
  <!-- Cozy Room Wall -->
  <rect x="0" y="0" width="240" height="180" fill="#1e293b"/>
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <!-- Floor line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>

  <!-- Window with Rain/Night view -->
  <g transform="translate(140, 30)">
    <rect x="0" y="0" width="70" height="90" rx="6" fill="url(#windowNight)" stroke="#334155" stroke-width="3"/>
    <line x1="35" y1="0" x2="35" y2="90" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="45" x2="70" y2="45" stroke="#334155" stroke-width="2"/>
    <!-- Raindrops on window -->
    <line x1="15" y1="15" x2="13" y2="22" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="50" y1="30" x2="48" y2="38" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="25" y1="60" x2="23" y2="67" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="55" y1="70" x2="53" y2="76" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Bookshelf / Plant props in background -->
  <rect x="25" y="60" width="45" height="6" rx="3" fill="#334155"/>
  <path d="M30 60 L33 45 L38 45 L41 60 Z" fill="#64748b"/> <!-- Small plant pot & leaves -->
  <path d="M32 45 C30 40 35 35 38 40 C41 35 46 40 44 45 Z" fill="#10b981"/>

  <!-- Ambient Lamp -->
  <path d="M200 40 L220 70 L180 70 Z" fill="#475569"/>
  <circle cx="200" cy="70" r="4" fill="#fbbf24"/>
  <path d="M160 70 L240 160" stroke="url(#lampGlow)" stroke-width="60" stroke-linecap="round" opacity="0.6"/>

  <!-- Central Empathy Aura (Visualizing "feeling their pain/heart") -->
  <circle cx="115" cy="135" r="50" fill="url(#empathyGlow)"/>

  <!-- COUCH / SEATING -->
  <path d="M25 170 C25 145 45 135 115 135 C185 135 205 145 205 170 L210 190 C210 198 202 205 195 205 L35 205 C28 205 20 198 20 190 Z" fill="#334155" filter="url(#softShadow)"/>
  <path d="M30 165 C30 148 48 140 115 140 C182 140 200 148 200 165 L205 190 C205 195 200 200 195 200 L35 200 C30 200 25 195 25 190 Z" fill="#475569"/>
  <!-- Couch Cushions -->
  <rect x="40" y="150" width="70" height="45" rx="8" fill="#64748b"/>
  <rect x="120" y="150" width="75" height="45" rx="8" fill="#64748b"/>

  <!-- CHARACTER 1: The upset/stressed listener or friend expressing feelings (Left) -->
  <g transform="translate(15, 0)">
    <!-- Body & Hoodie -->
    <path d="M60 175 C55 160 65 140 80 140 C95 140 105 160 100 175 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="80" cy="120" r="16" fill="#fbcfe8"/>
    <!-- Hair (Messy/Sad style) -->
    <path d="M65 115 C65 105 75 102 85 104 C95 102 100 110 98 120 C95 116 93 112 85 112 C77 112 70 114 65 115 Z" fill="#475569"/>
    <!-- Sad / Concerned Facial Expression -->
    <path d="M74 121 Q80 117 86 121" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Eyebrows angled up -->
    <circle cx="75" cy="125" r="1.5" fill="#334155"/>
    <circle cx="85" cy="125" r="1.5" fill="#334155"/>
    <path d="M78 132 Q80 130 82 132" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Small sad mouth -->

    <!-- Arm reaching out / resting -->
    <path d="M90 155 Q105 160 112 150" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="112" cy="148" r="4" fill="#fbcfe8"/>
  </g>

  <!-- CHARACTER 2: The empathetic listener (Right - showing active "体会" / resonance) -->
  <g transform="translate(95, 0)">
    <!-- Body & Warm Sweater -->
    <path d="M65 175 C60 155 75 138 95 138 C115 138 130 155 125 175 Z" fill="#f59e0b"/>
    <!-- Head leaning slightly forward/empathetic -->
    <circle cx="95" cy="118" r="16" fill="#ffd1dc"/>
    <!-- Neat Hair -->
    <path d="M80 116 C80 104 92 102 105 106 C112 108 112 116 110 120 C105 114 95 112 87 116 Z" fill="#1e293b"/>
    <!-- Gentle / Understanding Facial Expression -->
    <path d="M89 120 Q95 118 101 120" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="91" cy="124" r="1.5" fill="#334155"/>
    <circle cx="99" cy="124" r="1.5" fill="#334155"/>
    <path d="M93 130 Q95 132 97 130" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Gentle soft smile -->

    <!-- Supportive Hand gently placed on friend's shoulder/arm -->
    <path d="M75 145 Q65 148 50 152" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="48" cy="153" r="4" fill="#ffd1dc"/>
  </g>

  <!-- Floating Empathy / Connection Symbol (Abstract glowing heart/resonance pulses - strictly non-text) -->
  <g transform="translate(107, 95)" filter="url(#softShadow)">
    <path d="M12 5 C12 2 9 0 6 0 C2 0 0 3 0 6 C0 10 5 14 12 20 C19 14 24 10 24 6 C24 3 22 0 18 0 C15 0 12 2 12 5 Z" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Secondary smaller warmth particle -->
  <circle cx="85" cy="85" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="145" cy="100" r="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Foreground props: Coffee mug on small side table -->
  <rect x="195" y="170" width="25" height="35" rx="3" fill="#475569"/>
  <ellipse cx="207" cy="170" rx="12" ry="4" fill="#64748b"/>
  <!-- Mug -->
  <path d="M200 162 L214 162 L212 178 L202 178 Z" fill="#ffffff"/>
  <path d="M214 165 C218 165 218 174 214 174" stroke="#ffffff" stroke-width="2" fill="none"/>
  <!-- Steam from coffee -->
  <path d="M205 155 Q207 150 205 145" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M210 157 Q212 152 210 147" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>