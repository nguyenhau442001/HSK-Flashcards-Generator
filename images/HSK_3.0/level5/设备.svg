<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Factory Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- New Equipment Glow Gradient -->
    <radialGradient id="equipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- UI Tag / Accent Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- INDUSTRIAL FACTORY INTERIOR -->
  <!-- Back Wall Structure -->
  <rect x="20" y="25" width="200" height="155" fill="#1e293b" />
  
  <!-- Factory Steel Beams / Trusses on Wall -->
  <line x1="20" y1="50" x2="220" y2="50" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <line x1="60" y1="50" x2="60" y2="180" stroke="#334155" stroke-width="3" />
  <line x1="120" y1="50" x2="120" y2="180" stroke="#334155" stroke-width="3" />
  <line x1="180" y1="50" x2="180" y2="180" stroke="#334155" stroke-width="3" />

  <!-- Factory Windows (Background) with ambient blue light -->
  <polygon points="65,55 115,55 115,115 65,115" fill="url(#windowLight)" stroke="#475569" stroke-width="2" />
  <line x1="90" y1="55" x2="90" y2="115" stroke="#475569" stroke-width="1.5" />
  <line x1="65" y1="85" x2="115" y2="85" stroke="#475569" stroke-width="1.5" />

  <polygon points="125,55 175,55 175,115 125,115" fill="url(#windowLight)" stroke="#475569" stroke-width="2" />
  <line x1="150" y1="55" x2="150" y2="115" stroke="#475569" stroke-width="1.5" />
  <line x1="125" y1="85" x2="175" y2="85" stroke="#475569" stroke-width="1.5" />

  <!-- Factory Floor -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="url(#floorGrad)" />
  <!-- Floor Grid Lines / Safety Strips -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2" />
  <line x1="20" y1="195" x2="220" y2="195" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,6" opacity="0.6" />

  <!-- BACKGROUND PROPS: Crates & Delivery Box (Showing "New" arrival) -->
  <g transform="translate(25, 140)">
    <!-- Wooden Crate 1 -->
    <rect x="0" y="10" width="30" height="30" fill="#b45309" stroke="#78350f" stroke-width="2" rx="2" />
    <line x1="0" y1="10" x2="30" y2="40" stroke="#78350f" stroke-width="1.5" />
    <line x1="30" y1="10" x2="0" y2="40" stroke="#78350f" stroke-width="1.5" />
    <!-- Wooden Crate 2 (Stacked) -->
    <rect x="8" y="-12" width="26" height="24" fill="#d97706" stroke="#b45309" stroke-width="2" rx="2" />
    <!-- "New / Fresh" ribbon accent on crate -->
    <rect x="14" y="-2" width="14" height="6" fill="#10b981" rx="1" />
  </g>


  <!-- MAIN SUBJECT: THE NEW INDUSTRIAL EQUIPMENT (设备) -->
  <!-- Placed prominently center-right -->
  <g transform="translate(130, 95)">
    <!-- Ambient Glow behind new equipment -->
    <circle cx="45" cy="45" r="45" fill="url(#equipGlow)" />

    <!-- Main Machine Body (High-tech / Modern Industrial) -->
    <rect x="15" y="15" width="60" height="70" rx="8" fill="#475569" stroke="#64748b" stroke-width="2" />
    
    <!-- Machine Base / Heavy Stand -->
    <rect x="10" y="75" width="70" height="10" rx="3" fill="#334155" stroke="#475569" stroke-width="2" />

    <!-- Control Panel & Interface (Modern LED screen) -->
    <rect x="25" y="25" width="40" height="28" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Screen UI Elements (Abstract glowing charts/indicators) -->
    <polyline points="30,45 38,38 45,42 55,32 60,35" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="33" cy="33" r="2" fill="#10b981" />
    <circle cx="58" cy="44" r="2" fill="#f59e0b" />

    <!-- Machine Working Mechanism / Mechanical Arm / Precision Head -->
    <path d="M 35 15 L 55 15 L 50 5 L 40 5 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="42" y="-5" width="6" height="10" fill="#fbbf24" rx="2" />
    <!-- Precision Laser / Output nozzle -->
    <line x1="45" y1="85" x2="45" y2="95" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

    <!-- "NEW" Sparkle / Indicator Element -->
    <g transform="translate(62, 5)">
      <path d="M 0 8 Q 8 8 8 0 Q 8 8 16 8 Q 8 8 8 16 Q 8 8 0 8 Z" fill="#fbbf24" />
    </g>
    <g transform="translate(-5, 45) scale(0.6)">
      <path d="M 0 8 Q 8 8 8 0 Q 8 8 16 8 Q 8 8 8 16 Q 8 8 0 8 Z" fill="#38bdf8" />
    </g>
  </g>


  <!-- CHARACTERS: FACTORY WORKER & MANAGER (Expressive & Action-oriented) -->
  
  <!-- Character 1: Factory Manager / Inspector holding a clipboard, pointing happily -->
  <g transform="translate(70, 110)">
    <!-- Shadow -->
    <ellipse cx="15" cy="73" rx="12" ry="4" fill="#000000" opacity="0.4" />

    <!-- Body / Torso (Blue Uniform + Orange Vest) -->
    <path d="M 8 30 L 22 30 L 26 55 L 4 55 Z" fill="#2563eb" />
    <!-- Safety Vest -->
    <path d="M 6 32 L 14 32 L 14 55 L 4 55 Z" fill="#f59e0b" />
    <path d="M 16 32 L 24 32 L 26 55 L 16 55 Z" fill="#f59e0b" />

    <!-- Head & Face -->
    <circle cx="15" cy="18" r="9" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 6 15 Q 15 8 24 15 L 24 18 L 6 18 Z" fill="#1e293b" />
    <!-- Happy Expression (Smiling eyes & open smile) -->
    <path d="M 11 17 Q 13 15 15 17" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 17 17 Q 19 15 21 17" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 13 21 Q 15 24 17 21" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

    <!-- Safety Helmet (Yellow Hard Hat) -->
    <path d="M 5 13 Q 15 4 25 13 Z" fill="#f59e0b" />
    <rect x="3" y="11" width="24" height="3" rx="1.5" fill="#d97706" />

    <!-- Left Arm pointing at the new equipment -->
    <path d="M 8 35 Q -2 30 -5 22" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="-6" cy="21" r="3" fill="#fcd34d" />

    <!-- Right Arm holding clipboard -->
    <path d="M 22 35 Q 30 42 26 50" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
    <!-- Clipboard Prop -->
    <rect x="22" y="42" width="12" height="15" rx="1" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" transform="rotate(15 22 42)" />
    <line x1="25" y1="46" x2="30" y2="46" stroke="#ef4444" stroke-width="1.5" />
    <line x1="25" y1="50" x2="31" y2="50" stroke="#64748b" stroke-width="1" />
    <line x1="25" y1="53" x2="29" y2="53" stroke="#64748b" stroke-width="1" />

    <!-- Legs & Boots -->
    <rect x="8" y="55" width="6" height="18" fill="#1e293b" rx="2" />
    <rect x="16" y="55" width="6" height="18" fill="#1e293b" rx="2" />
    <!-- Safety Boots -->
    <path d="M 6 70 L 14 70 L 14 73 L 4 73 Z" fill="#b45309" />
    <path d="M 16 70 L 24 70 L 24 73 L 14 73 Z" fill="#b45309" />
  </g>

  <!-- Character 2: Factory Technician admiring / operating the equipment -->
  <g transform="translate(195, 115)">
    <!-- Shadow -->
    <ellipse cx="12" cy="68" rx="10" ry="3.5" fill="#000000" opacity="0.4" />

    <!-- Body / Torso (Green/Teal Uniform matching modern tech vibe) -->
    <path d="M 5 28 L 19 28 L 22 52 L 2 52 Z" fill="#0d9488" />
    
    <!-- Head & Face -->
    <circle cx="12" cy="16" r="8" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 4 13 Q 12 6 20 13 L 20 15 L 4 15 Z" fill="#334155" />
    <!-- Focused & Pleased Expression -->
    <circle cx="15" cy="15" r="1.5" fill="#1e293b" />
    <path d="M 13 19 Q 15 21 17 19" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

    <!-- Safety Cap / Cap with visor -->
    <path d="M 4 12 Q 12 5 20 12 Z" fill="#0f766e" />
    <path d="M 18 11 L 24 13 L 18 14 Z" fill="#0f766e" />

    <!-- Arms interacting with console -->
    <path d="M 5 32 Q -3 38 -2 46" fill="none" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="-3" cy="47" r="2.5" fill="#fcd34d" />

    <!-- Legs & Boots -->
    <rect x="5" y="52" width="5" height="16" fill="#1e293b" rx="2" />
    <rect x="13" y="52" width="5" height="16" fill="#1e293b" rx="2" />
    <path d="M 3 66 L 10 66 L 10 69 L 2 69 Z" fill="#b45309" />
    <path d="M 12 66 L 19 66 L 19 69 L 11 69 Z" fill="#b45309" />
  </g>


  <!-- FOREGROUND / ATMOSPHERIC DETAILS -->
  <!-- Hanging Industrial Lamp (Top Right) -->
  <g transform="translate(180, 0)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#475569" stroke-width="2" />
    <path d="M -15 35 L 15 35 L 10 45 L -10 45 Z" fill="#64748b" />
    <ellipse cx="0" cy="45" rx="10" ry="3" fill="#fbbf24" />
    <!-- Cone of light downward -->
    <polygon points="0,45 -35,115 35,115" fill="#fbbf24" opacity="0.04" />
  </g>

  <!-- Hanging Industrial Lamp (Top Left) -->
  <g transform="translate(80, 0)">
    <line x1="0" y1="0" x2="0" y2="25" stroke="#475569" stroke-width="2" />
    <path d="M -12 25 L 12 25 L 8 32 L -8 32 Z" fill="#64748b" />
    <ellipse cx="0" cy="32" rx="8" ry="2.5" fill="#fbbf24" />
  </g>

  <!-- Subtle floor details / wrench prop on floor -->
  <g transform="translate(100, 195) rotate(-15)">
    <rect x="0" y="0" width="18" height="4" rx="2" fill="#64748b" />
    <circle cx="0" cy="2" r="4" fill="#64748b" />
    <circle cx="18" cy="2" r="3.5" fill="#64748b" />
  </g>

  <!-- UI Frame Overlay (Clean rounded border for app asset aesthetic) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>