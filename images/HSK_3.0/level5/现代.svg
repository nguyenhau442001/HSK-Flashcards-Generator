<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glass Building Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Metallic Frame Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Elements (Urban Night Sky / City Glow) -->
  <circle cx="190" cy="50" r="30" fill="#fbbf24" opacity="0.15" filter="url(#glow)" />
  <path d="M 20 220 L 220 220" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- BACKGROUND ARCHITECTURE (Context: Modern Cityscape) -->
  <g opacity="0.4">
    <!-- Left building -->
    <rect x="25" y="80" width="35" height="140" fill="#1e293b" />
    <rect x="33" y="90" width="6" height="10" fill="#38bdf8" opacity="0.6" />
    <rect x="47" y="90" width="6" height="10" fill="#38bdf8" opacity="0.6" />
    <rect x="33" y="115" width="6" height="10" fill="#38bdf8" opacity="0.3" />
    <rect x="47" y="115" width="6" height="10" fill="#38bdf8" opacity="0.6" />
    <rect x="33" y="140" width="6" height="10" fill="#38bdf8" opacity="0.6" />
    <rect x="47" y="140" width="6" height="10" fill="#38bdf8" opacity="0.3" />

    <!-- Right building -->
    <rect x="180" y="100" width="40" height="120" fill="#1e293b" />
    <line x1="200" y1="100" x2="200" y2="220" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- MAIN SUBJECT: "现代建筑" (The Modern Architectural Masterpiece) -->
  <g filter="url(#shadow)">
    <!-- Innovative Curved / Geometric Structure -->
    <!-- Base podium -->
    <path d="M 65 220 L 80 180 L 160 180 L 175 220 Z" fill="url(#metal-grad)" />
    
    <!-- Main asymmetric twisted/slanting tower -->
    <path d="M 80 180 
             C 75 140, 85 90, 95 60 
             L 135 45 
             C 145 80, 155 130, 160 180 
             Z" fill="url(#glass-grad)" />

    <!-- Architectural Frame and Structural Ribs -->
    <path d="M 95 60 L 95 180" stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.8" />
    <path d="M 135 45 L 135 180" stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.8" />
    
    <!-- Diagonal cross-bracing (Diagrid facade typical of modern high-rises) -->
    <path d="M 80 160 L 135 140 M 90 130 L 160 115 M 95 100 L 135 85" stroke="#e2e8f0" stroke-width="1.5" opacity="0.7" />
    <path d="M 95 160 L 145 180 M 85 130 L 135 110 M 95 90 L 150 70" stroke="#e2e8f0" stroke-width="1.5" opacity="0.7" />

    <!-- Vertical glowing strip (Modern lighting feature) -->
    <path d="M 115 52 L 115 180" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" fill="none" />
  </g>

  <!-- FOREGROUND / CONTEXT: Characters appreciating the modern building -->
  <!-- Character 1 (Architect / Tourist pointing) -->
  <g transform="translate(0, 5)" filter="url(#shadow)">
    <!-- Body & Coat -->
    <path d="M 50 215 C 50 195, 60 190, 68 190 C 76 190, 85 195, 85 215 Z" fill="#0284c7" />
    <!-- Head -->
    <circle cx="68" cy="178" r="9" fill="#fde68a" />
    <!-- Hair -->
    <path d="M 59 176 C 59 170, 65 168, 72 170 C 77 171, 77 178, 77 178 Z" fill="#334155" />
    <!-- Pointing Arm -->
    <path d="M 75 195 L 92 185" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <circle cx="93" cy="184" r="3" fill="#fde68a" />
  </g>

  <!-- Character 2 (Observer holding tablet/camera framing the architecture) -->
  <g transform="translate(15, 10)" filter="url(#shadow)">
    <!-- Body -->
    <path d="M 135 210 C 135 190, 145 185, 153 185 C 161 185, 170 190, 170 210 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="153" cy="173" r="8" fill="#fde68a" />
    <!-- Hair (Bun) -->
    <circle cx="153" cy="162" r="4" fill="#475569" />
    <path d="M 145 172 C 145 167, 161 167, 161 172 Z" fill="#475569" />
    <!-- Holding glowing tablet -->
    <rect x="138" y="185" width="16" height="12" rx="2" transform="rotate(-15 146 191)" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <rect x="141" y="188" width="10" height="7" rx="1" transform="rotate(-15 146 191)" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- ENVIRONMENT DETAILS: Modern landscaped plaza -->
  <g>
    <!-- Minimalist modern bench -->
    <rect x="100" y="210" width="28" height="4" rx="1" fill="#64748b" />
    <rect x="104" y="214" width="3" height="6" fill="#334155" />
    <rect x="121" y="214" width="3" height="6" fill="#334155" />

    <!-- Modern glowing floor lights embedded in plaza -->
    <ellipse cx="85" cy="220" rx="6" ry="2" fill="#38bdf8" filter="url(#glow)" />
    <ellipse cx="155" cy="220" rx="6" ry="2" fill="#38bdf8" filter="url(#glow)" />
    
    <!-- Stylized Modern Tree -->
    <path d="M 25 220 L 25 180" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <circle cx="25" cy="170" r="16" fill="#10b981" opacity="0.8" />
    <circle cx="20" cy="165" r="10" fill="#34d399" opacity="0.6" />
  </g>

  <!-- Architectural Highlight Orbits / Modern Accent Lines (Aesthetic flair for "Hiện đại") -->
  <path d="M 70 85 C 90 70, 120 70, 145 90" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="145" cy="90" r="3" fill="#38bdf8" filter="url(#glow)" />

</svg>