<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table -->
  <rect x="40" y="160" width="160" height="15" rx="2" fill="#475569"/>
  <rect x="50" y="175" width="10" height="40" fill="#334155"/>
  <rect x="180" y="175" width="10" height="40" fill="#334155"/>

  <!-- Mirror Stand -->
  <path d="M120 160 L120 80 M100 160 L140 160" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Mirror Frame -->
  <circle cx="120" cy="80" r="45" fill="#334155" stroke="#fbbf24" stroke-width="4"/>
  
  <!-- Mirror Surface (Front) -->
  <circle cx="120" cy="80" r="38" fill="#bae6fd" opacity="0.8"/>
  <path d="M100 65 Q110 60 120 65" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Character -->
  <g transform="translate(40, 80)">
    <circle cx="20" cy="40" r="15" fill="#fde68a"/>
    <path d="M15 45 Q20 50 25 45" stroke="#fb923c" stroke-width="2" fill="none"/>
    <circle cx="16" cy="38" r="2" fill="#1e293b"/>
    <circle cx="24" cy="38" r="2" fill="#1e293b"/>
    <path d="M10 60 L30 60 L25 100 L15 100 Z" fill="#38bdf8"/>
  </g>

  <!-- Back of Mirror (The "Other Side") -->
  <g transform="translate(160, 100) scale(0.6)">
    <circle cx="120" cy="80" r="45" fill="#ec4899" stroke="#fbbf24" stroke-width="4"/>
    <path d="M90 70 L150 70 M90 90 L150 90" stroke="#fce7f3" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="30" cy="30" r="2" fill="#38bdf8"/>
  <path d="M180 140 L190 130" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
</svg>