<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Classroom Background -->
  <rect x="20" y="160" width="200" height="10" fill="#334155"/>
  <rect x="30" y="170" width="180" height="5" fill="#475569"/>
  <circle cx="210" cy="40" r="15" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Teacher -->
  <g transform="translate(180, 100)">
    <circle cx="0" cy="0" r="12" fill="#f8fafc"/>
    <rect x="-8" y="12" width="16" height="30" rx="4" fill="#38bdf8"/>
    <path d="M-10 20 L-25 35 M10 20 L25 35" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Students (Standing) -->
  <g transform="translate(40, 120)">
    <circle cx="0" cy="0" r="8" fill="#fb923c"/>
    <rect x="-6" y="8" width="12" height="40" rx="2" fill="#ec4899"/>
    <path d="M-5 15 L-15 25 M5 15 L15 25" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(80, 115)">
    <circle cx="0" cy="0" r="8" fill="#10b981"/>
    <rect x="-6" y="8" width="12" height="45" rx="2" fill="#38bdf8"/>
    <path d="M-5 15 L-15 25 M5 15 L15 25" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(120, 125)">
    <circle cx="0" cy="0" r="8" fill="#fbbf24"/>
    <rect x="-6" y="8" width="12" height="35" rx="2" fill="#f8fafc"/>
    <path d="M-5 15 L-15 25 M5 15 L15 25" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Desks -->
  <rect x="30" y="175" width="30" height="20" fill="#475569"/>
  <rect x="70" y="175" width="30" height="20" fill="#475569"/>
  <rect x="110" y="175" width="30" height="20" fill="#475569"/>
  
  <!-- Decorative elements -->
  <circle cx="20" cy="20" r="3" fill="#f59e0b" opacity="0.5"/>
  <circle cx="220" cy="220" r="2" fill="#38bdf8" opacity="0.5"/>
</svg>