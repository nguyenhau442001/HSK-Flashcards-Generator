<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Bowl Outer Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Bland Broth Gradient (Light/Watery) -->
    <radialGradient id="blandBroth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#cbd5e1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.7" />
    </radialGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background lighting / kitchen warmth -->
  <circle cx="120" cy="110" r="90" fill="#38bdf8" opacity="0.04" />
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.06" />

  <!-- Background Kitchen Shelf/Wall Details -->
  <path d="M 20 60 L 220 60" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" opacity="0.5" />
  
  <!-- Wooden/Modern Dining Table Surface -->
  <path d="M 0 160 Q 120 150 240 160 L 240 240 L 0 240 Z" fill="url(#tableGrad)" />
  <path d="M 0 160 Q 120 150 240 160" stroke="#475569" stroke-width="3" fill="none" />

  <!-- Tableware: Saucer/Plate base -->
  <ellipse cx="120" cy="175" rx="75" ry="25" fill="#334155" filter="url(#shadow)" />
  <ellipse cx="120" cy="172" rx="72" ry="23" fill="#cbd5e1" />
  <ellipse cx="120" cy="170" rx="64" ry="20" fill="#f1f5f9" />

  <!-- Main Soup Bowl Outer Rim -->
  <ellipse cx="120" cy="140" rx="65" ry="28" fill="#475569" filter="url(#shadow)" />
  <ellipse cx="120" cy="138" rx="62" ry="26" fill="url(#bowlGrad)" />

  <!-- Soup Broth (The visual representation of 'nhạt' - watery, clear, pale) -->
  <ellipse cx="120" cy="141" rx="55" ry="21" fill="url(#blandBroth)" />

  <!-- Lonely/Sparse Floating Ingredients in the Soup (Showing it's 'nhạt' / plain) -->
  <!-- A single sad scallion ring -->
  <ellipse cx="105" cy="138" rx="4" ry="2" fill="none" stroke="#10b981" stroke-width="1.5" />
  <!-- A single pale tofu cube -->
  <rect x="130" y="142" width="6" height="5" rx="1" fill="#fef08a" opacity="0.8" />
  <!-- Minimal ripple lines indicating watery surface -->
  <path d="M 90 145 Q 100 148 110 145" stroke="#94a3b8" stroke-width="1" fill="none" opacity="0.5" />
  <path d="M 135 136 Q 142 138 150 135" stroke="#94a3b8" stroke-width="1" fill="none" opacity="0.5" />

  <!-- Chopsticks resting on top -->
  <g filter="url(#shadow)">
    <path d="M 40 115 L 200 135" stroke="#b45309" stroke-width="4" stroke-linecap="round" />
    <path d="M 40 123 L 195 145" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Context Props: Seasoning bottles in the background (unused or showing blandness) -->
  <!-- Salt/Pepper shaker 1 -->
  <rect x="35" y="110" width="16" height="28" rx="4" fill="#cbd5e1" />
  <path d="M 39 110 L 47 110 L 45 105 L 41 105 Z" fill="#94a3b8" />
  <circle cx="43" cy="118" r="1.5" fill="#475569" />
  <circle cx="43" cy="124" r="1.5" fill="#475569" />

  <!-- Seasoning bottle 2 (bright accent bottle, untouched) -->
  <rect x="190" y="100" width="18" height="38" rx="5" fill="#f43f5e" />
  <rect x="192" y="112" width="14" height="12" fill="#ffffff" opacity="0.2" />
  <path d="M 194 100 L 204 100 L 202 94 L 196 94 Z" fill="#e2e8f0" />
  
  <!-- Subtle Steam (indicating hot, but watery/bland soup) -->
  <path d="M 105 110 Q 112 95 102 80" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 135 112 Q 128 98 138 82" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Expressive UI/Mascot Elements (Action-packed conceptual cues) -->
  <!-- Question mark / puzzled indicator bubbles (representing "tasteless/bland") -->
  <g transform="translate(150, 60)">
    <circle cx="0" cy="0" r="12" fill="#334155" opacity="0.8" />
    <path d="M -3 -4 C -3 -7 3 -7 3 -3 C 3 1 -3 2 -3 6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="-3" cy="10" r="1.5" fill="#38bdf8" />
  </g>
  <g transform="translate(170, 75) scale(0.7)">
    <circle cx="0" cy="0" r="12" fill="#334155" opacity="0.8" />
    <path d="M -3 -4 C -3 -7 3 -7 3 -3 C 3 1 -3 2 -3 6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="-3" cy="10" r="1.5" fill="#38bdf8" />
  </g>

</svg>