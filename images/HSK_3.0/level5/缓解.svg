<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="90" fill="#475569"/>
  <rect x="190" y="150" width="10" height="90" fill="#475569"/>
  
  <!-- Character -->
  <g transform="translate(0, 10)">
    <!-- Shoulders/Body -->
    <path d="M70 160 Q120 150 170 160 L170 240 L70 240 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="120" cy="130" r="25" fill="#fde68a"/>
    <!-- Eyes (Relaxed) -->
    <ellipse cx="110" cy="125" rx="3" ry="4" fill="#1e293b"/>
    <ellipse cx="130" cy="125" rx="3" ry="4" fill="#1e293b"/>
    <!-- Mouth (Sigh of relief) -->
    <path d="M110 140 Q120 148 130 140" stroke="#1e293b" stroke-width="2" fill="none"/>
    
    <!-- Hands performing the action: Massaging temples -->
    <path d="M90 125 L75 110" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="75" cy="110" r="8" fill="#fde68a"/>
    <path d="M150 125 L165 110" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="165" cy="110" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Props: Stress elements fading away -->
  <path d="M50 80 Q60 60 80 70 T110 60" stroke="#fb923c" stroke-width="3" fill="none" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M190 90 Q180 70 160 80 T130 70" stroke="#fb923c" stroke-width="3" fill="none" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Desk items -->
  <rect x="160" y="135" width="30" height="5" rx="1" fill="#ec4899"/>
  <circle cx="50" cy="135" r="8" fill="#10b981"/>
</svg>