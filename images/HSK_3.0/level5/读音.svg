<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Character: Student -->
  <circle cx="120" cy="100" r="35" fill="#fde68a"/>
  <path d="M95 100 Q120 130 145 100" stroke="#475569" stroke-width="3" fill="none"/>
  <circle cx="108" cy="90" r="3" fill="#1e293b"/>
  <circle cx="132" cy="90" r="3" fill="#1e293b"/>
  
  <!-- Book with the character -->
  <rect x="60" y="140" width="120" height="80" rx="4" fill="#f1f5f9"/>
  <rect x="70" y="150" width="100" height="60" rx="2" fill="#e2e8f0"/>
  
  <!-- The "Two Readings" visual representation -->
  <path d="M100 170 L140 170" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 190 L140 190" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Magnifying glass pointing at the book -->
  <circle cx="160" cy="130" r="20" fill="none" stroke="#fbbf24" stroke-width="4"/>
  <path d="M175 145 L195 165" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Ambient light/decor -->
  <circle cx="40" cy="50" r="5" fill="#fb923c" opacity="0.6"/>
  <circle cx="200" cy="40" r="8" fill="#10b981" opacity="0.4"/>
  <path d="M20 200 L220 200" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
</svg>