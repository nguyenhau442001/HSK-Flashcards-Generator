<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Thought/Idea Glow Gradient -->
    <radialGradient id="thought-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window/Light Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Wall & Architecture -->
  <!-- Bookshelf Background Details -->
  <rect x="25" y="45" width="45" height="110" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="30" y="65" width="35" height="6" fill="#475569" opacity="0.8"/>
  <rect x="30" y="90" width="35" height="6" fill="#475569" opacity="0.8"/>
  <rect x="30" y="115" width="35" height="6" fill="#475569" opacity="0.8"/>
  <rect x="30" y="140" width="35" height="6" fill="#475569" opacity="0.8"/>
  <!-- Books on Shelf -->
  <path d="M35 65 L35 55 L42 55 L42 65 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M45 65 L45 52 L53 52 L53 65 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M34 90 L34 78 L40 78 L40 90 Z" fill="#10b981" opacity="0.8"/>
  <path d="M48 115 L48 102 L56 102 L56 115 Z" fill="#fbbf24" opacity="0.8"/>

  <!-- Window Frame & City View -->
  <rect x="155" y="40" width="60" height="90" rx="6" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <path d="M155 85 L215 85 M185 40 L185 130" stroke="#475569" stroke-width="1.5"/>
  <polygon points="165,130 165,100 175,100 175,130" fill="#1e293b"/>
  <polygon points="190,130 190,90 205,90 205,130" fill="#1e293b"/>

  <!-- Desk & Workspace -->
  <rect x="70" y="155" width="145" height="12" rx="3" fill="#475569"/>
  <rect x="85" y="167" width="12" height="55" fill="#334155"/>
  <rect x="185" y="167" width="12" height="55" fill="#334155"/>

  <!-- Desk Props: Laptop & Plant -->
  <path d="M140 155 L175 155 L180 145 L135 145 Z" fill="#cbd5e1"/>
  <rect x="133" y="142" width="49" height="3" rx="1.5" fill="#94a3b8"/>
  <circle cx="100" cy="145" r="8" fill="#10b981"/>
  <path d="M96 155 L104 155 L102 145 L98 145 Z" fill="#e2e8f0"/>

  <!-- Character: Man sitting at desk, experiencing a mental shift ("Suy nghĩ thay đổi") -->
  <!-- Body/Torso & Chair -->
  <rect x="100" y="130" width="30" height="35" rx="8" fill="#3b82f6"/>
  <!-- Head & Face -->
  <circle cx="115" cy="105" r="16" fill="#fed7aa"/>
  <!-- Hair (Neat styling) -->
  <path d="M99 105 C99 92 110 90 120 92 C128 94 131 101 131 105 L128 105 C128 98 122 93 115 93 C106 93 102 98 102 105 Z" fill="#334155"/>
  <!-- Confident/Enlightened Expression (Relaxed Smile) -->
  <path d="M118 108 Q122 112 126 108" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="119" cy="102" r="1.5" fill="#1e293b"/>
  <circle cx="127" cy="102" r="1.5" fill="#1e293b"/>
  <!-- Eyebrows raised in realization -->
  <path d="M117 98 Q119 96 121 98" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M125 98 Q127 96 129 98" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Arms/Hands gesturing thoughtfully -->
  <path d="M105 135 L95 145 L102 152" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="102" cy="153" r="4" fill="#fed7aa"/>
  <path d="M125 135 L135 145 L128 152" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="153" r="4" fill="#fed7aa"/>

  <!-- THE SHIFT/TRANSFORMATION CONCEPTUAL VISUALIZATION (Lightbulb / Idea Burst above head) -->
  <circle cx="115" cy="70" r="35" fill="url(#thought-glow)"/>

  <!-- Glowing Lightbulb Symbol representing "Idea / Thought" -->
  <g transform="translate(115, 68)">
    <!-- Bulb Rays -->
    <path d="M 0 -18 L 0 -24" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 12 -12 L 17 -17" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 18 0 L 24 0" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -12 -12 L -17 -17" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -18 0 L -24 0" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bulb Body -->
    <path d="M -8 -3 C -8 -10 -3 -14 0 -14 C 3 -14 8 -10 8 -3 C 8 2 5 6 4 9 L -4 9 C -5 6 -8 2 -8 -3 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="-3" y="9" width="6" height="4" fill="#94a3b8"/>
    <path d="M -2 13 L 2 13 L 1 17 L -1 17 Z" fill="#64748b"/>
    
    <!-- Sparkle inside bulb representing the "Change/Shift" -->
    <path d="M 0 -8 L 2 -4 L 6 -3 L 2 -2 L 0 2 L -2 -2 L -6 -3 L -2 -4 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Dynamic Transformation Flow Arrows (Curved smooth transition vector lines) -->
  <path d="M 75 80 Q 95 60 102 65" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <polygon points="104,63 98,60 100,66" fill="#38bdf8"/>

  <path d="M 155 70 Q 135 60 128 65" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <polygon points="126,63 132,60 130,66" fill="#10b981"/>

  <!-- Foreground Floor Line -->
  <rect x="0" y="222" width="240" height="18" fill="#0b0f19"/>
</svg>