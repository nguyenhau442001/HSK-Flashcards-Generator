<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Window City Glow -->
    <linearGradient id="window-night" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Background Wall Details -->
  <rect x="0" y="0" width="240" height="150" fill="#111827" opacity="0.6" />
  
  <!-- Window showing night skyline -->
  <g transform="translate(150, 20)">
    <rect x="0" y="0" width="70" height="90" rx="6" fill="url(#window-night)" stroke="#334155" stroke-width="2" />
    <!-- City Buildings & Lights through window -->
    <rect x="10" y="30" width="12" height="60" fill="#1e293b" />
    <rect x="25" y="20" width="18" height="70" fill="#1e293b" />
    <rect x="46" y="40" width="14" height="50" fill="#1e293b" />
    <!-- Tiny window lights -->
    <rect x="13" y="38" width="2" height="3" fill="#fbbf24" opacity="0.8" />
    <rect x="17" y="48" width="2" height="3" fill="#fbbf24" opacity="0.5" />
    <rect x="29" y="30" width="3" height="4" fill="#fbbf24" opacity="0.9" />
    <rect x="34" y="55" width="3" height="4" fill="#38bdf8" opacity="0.8" />
    <rect x="50" y="50" width="2" height="3" fill="#fbbf24" opacity="0.7" />
    <!-- Window Frame Cross -->
    <line x1="35" y1="0" x2="35" y2="90" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="45" x2="70" y2="45" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Bookshelf on wall -->
  <rect x="20" y="30" width="50" height="6" rx="2" fill="#334155" />
  <!-- Books -->
  <rect x="26" y="14" width="6" height="16" rx="1" fill="#ec4899" />
  <rect x="33" y="12" width="8" height="18" rx="1" fill="#38bdf8" />
  <rect x="42" y="16" width="5" height="14" rx="1" fill="#10b981" />
  <rect x="49" y="10" width="7" height="20" rx="1" fill="#f59e0b" />

  <!-- Ambient Light from Lamp -->
  <circle cx="85" cy="95" r="70" fill="url(#lamp-glow)" />

  <!-- WORKPLACE DESK -->
  <rect x="20" y="145" width="200" height="10" rx="3" fill="#475569" />
  <rect x="35" y="155" width="12" height="60" fill="#334155" />
  <rect x="193" y="155" width="12" height="60" fill="#334155" />

  <!-- DESK PROPS -->
  <!-- Laptop & Screen Glow -->
  <path d="M 115 145 L 165 145 L 175 120 L 105 120 Z" fill="#334155" />
  <path d="M 108 122 L 172 122 L 168 143 L 112 143 Z" fill="#0f172a" />
  <path d="M 111 124 L 169 124 L 165 141 L 115 141 Z" fill="url(#screen-glow)" />
  <!-- Code/Data lines on screen -->
  <rect x="118" y="128" width="25" height="2" rx="1" fill="#38bdf8" opacity="0.8" />
  <rect x="118" y="133" width="35" height="2" rx="1" fill="#94a3b8" opacity="0.6" />
  <rect x="118" y="138" width="15" height="2" rx="1" fill="#10b981" opacity="0.8" />
  <rect x="145" y="138" width="18" height="2" rx="1" fill="#ec4899" opacity="0.8" />
  <!-- Laptop base -->
  <path d="M 95 145 L 185 145 L 190 148 L 90 148 Z" fill="#64748b" />

  <!-- Coffee Mug -->
  <rect x="180" y="130" width="12" height="15" rx="2" fill="#cbd5e1" />
  <path d="M 192 134 C 196 134, 196 141, 192 141" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <path d="M 183 125 Q 186 120, 184 115" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Notebook & Pen -->
  <rect x="55" y="138" width="35" height="10" rx="1" fill="#e2e8f0" transform="rotate(-5 55 138)" />
  <line x1="60" y1="137" x2="85" y2="135" stroke="#cbd5e1" stroke-width="1" />
  <line x1="60" y1="141" x2="80" y2="139" stroke="#cbd5e1" stroke-width="1" />
  <rect x="50" y="134" width="18" height="3" rx="1.5" fill="#f43f5e" transform="rotate(25 50 134)" />

  <!-- Desk Lamp -->
  <path d="M 75 145 L 85 145 L 85 110 L 75 110 Z" fill="#64748b" />
  <path d="M 65 80 Q 80 75, 95 95 L 88 100 Q 80 85, 70 85 Z" fill="#f59e0b" />
  <ellipse cx="80" cy="95" rx="12" ry="6" fill="#fbbf24" />

  <!-- THE CHARACTER: Professional, Focused, Serious (严肃) -->
  <g transform="translate(70, 60)">
    <!-- Body / Shoulders (Dark blue blazer & crisp white shirt) -->
    <path d="M 25 85 L 55 85 L 75 105 L 5 105 Z" fill="#1e293b" />
    <!-- White shirt collar -->
    <polygon points="32,85 48,85 40,98" fill="#f8fafc" />
    <!-- Red/Burgundy Professional Tie -->
    <polygon points="38,85 42,85 44,103 40,108 36,103" fill="#be123c" />

    <!-- Neck -->
    <rect x="34" y="73" width="12" height="15" fill="#fcd34d" />

    <!-- Head & Face Structure -->
    <ellipse cx="40" cy="55" rx="18" ry="21" fill="#fcd34d" />

    <!-- Hair (Clean-cut modern corporate dark hair) -->
    <path d="M 22 50 C 22 35, 30 32, 40 32 C 50 32, 58 35, 58 50 C 58 55, 56 42, 53 38 C 48 30, 32 30, 27 38 C 24 42, 22 47, 22 50 Z" fill="#0f172a" />

    <!-- SERIOUS FACIAL EXPRESSION (Key for "严肃") -->
    <!-- Straight, firm mouth line (no smile) -->
    <line x1="34" y1="65" x2="46" y2="65" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Focused, slightly lowered professional eyebrows (Signifying intense concentration/seriousness) -->
    <line x1="28" y1="46" x2="36" y2="49" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="44" y1="49" x2="52" y2="46" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Focused straight ahead at work) -->
    <circle cx="32" cy="53" r="2.5" fill="#0f172a" />
    <circle cx="48" cy="53" r="2.5" fill="#0f172a" />
    <!-- Eye reflection for life -->
    <circle cx="31" cy="52" r="1" fill="#ffffff" />
    <circle cx="47" cy="52" r="1" fill="#ffffff" />

    <!-- Glasses for professional intelligence (optional style boost, clean minimal wireframe) -->
    <rect x="27" y="48" width="10" height="7" rx="1" fill="none" stroke="#64748b" stroke-width="1.5" />
    <rect x="43" y="48" width="10" height="7" rx="1" fill="none" stroke="#64748b" stroke-width="1.5" />
    <line x1="37" y1="51" x2="43" y2="51" stroke="#64748b" stroke-width="1.5" />

    <!-- ARMS / GESTURE (Actively working) -->
    <!-- Left arm bent supporting posture -->
    <path d="M 15 88 Q 20 70, 32 80" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
    <!-- Right arm reaching forward to type/write -->
    <path d="M 65 90 Q 75 95, 78 85" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
    <!-- Hand on desk -->
    <circle cx="78" cy="82" r="5" fill="#fcd34d" />
  </g>

  <!-- Accent Lighting / Rim Light on Character -->
  <path d="M 125 70 C 130 90, 130 110, 120 130" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.3" />
</svg>