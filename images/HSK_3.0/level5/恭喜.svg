<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Confetti/Atmosphere -->
  <circle cx="40" cy="60" r="2" fill="#fbbf24"/>
  <circle cx="200" cy="50" r="3" fill="#ec4899"/>
  <circle cx="180" cy="120" r="2" fill="#38bdf8"/>
  <rect x="60" y="30" width="4" height="4" transform="rotate(20)" fill="#10b981"/>
  
  <!-- Background Elements (Office/Celebration) -->
  <path d="M30 180h180v40H30z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="160" y="80" width="40" height="100" rx="5" fill="#0f172a" opacity="0.5"/>
  
  <!-- Main Subject: Person 1 (Giving Congratulations) -->
  <g transform="translate(40, 80)">
    <path d="M40 120c0-20 10-35 30-35s30 15 30 35v40H40z" fill="#fb923c"/>
    <circle cx="70" cy="60" r="25" fill="#fde68a"/>
    <path d="M55 55h5m15 0h5M60 75q10 5 20 0" stroke="#78350f" stroke-width="2" fill="none"/>
    <path d="M50 100l-20-20m40 0l20-20" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Main Subject: Person 2 (Receiving Congratulations) -->
  <g transform="translate(120, 80)">
    <path d="M40 120c0-20 10-35 30-35s30 15 30 35v40H40z" fill="#38bdf8"/>
    <circle cx="70" cy="60" r="25" fill="#bae6fd"/>
    <path d="M55 55h5m15 0h5M60 70q10 5 20 0" stroke="#0c4a6e" stroke-width="2" fill="none"/>
    <path d="M50 100l-10-30m40 0l10-30" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Celebration Props -->
  <path d="M110 140l20-20 10 10-20 20z" fill="#f59e0b"/>
  <circle cx="120" cy="130" r="8" fill="#fbbf24"/>
</svg>