<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Rural Landscape Background -->
  <path d="M0 180 Q60 150 120 180 T240 170 L240 240 L0 240 Z" fill="#1e3a8a" opacity="0.4"/>
  <path d="M0 190 Q80 160 160 190 T320 180 L320 240 L0 240 Z" fill="#1e40af" opacity="0.6"/>
  
  <!-- House Structure -->
  <rect x="140" y="100" width="80" height="80" fill="#475569" rx="4"/>
  <path d="M130 100 L180 60 L230 100 Z" fill="#94a3b8"/>
  <rect x="150" y="120" width="20" height="30" fill="#0f172a"/>
  
  <!-- Tree -->
  <path d="M30 240 L30 150 M30 150 L10 130 M30 150 L50 130" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="30" cy="120" r="25" fill="#10b981"/>
  
  <!-- Grandfather (姥爷) -->
  <g transform="translate(160, 140)">
    <circle cx="10" cy="-30" r="12" fill="#fde68a"/>
    <rect x="0" y="-18" width="20" height="35" fill="#fb923c" rx="4"/>
    <path d="M-5 0 L25 0" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 15 L5 40 M15 15 L15 40" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Grandchild -->
  <g transform="translate(90, 140)">
    <circle cx="10" cy="-30" r="12" fill="#fde68a"/>
    <rect x="0" y="-18" width="20" height="35" fill="#38bdf8" rx="4"/>
    <path d="M-5 0 L25 0" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 15 L5 40 M15 15 L15 40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Interaction elements -->
  <circle cx="135" cy="130" r="6" fill="#ec4899"/>
  <path d="M125 120 Q135 110 145 120" stroke="#ec4899" stroke-width="2" fill="none"/>
  
  <!-- Sun/Atmosphere -->
  <circle cx="40" cy="40" r="20" fill="#fbbf24" opacity="0.8"/>
</svg>