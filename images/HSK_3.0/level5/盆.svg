<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm indoor light gradient -->
    <radialGradient id="roomGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Water Stream Gradient -->
    <linearGradient id="waterStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Basin Gradient (Exterior) -->
    <linearGradient id="basinExt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    
    <!-- Basin Interior Gradient -->
    <linearGradient id="basinInt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#roomGlow)" />

  <!-- Background Environment: Cozy room interior -->
  <g id="environment">
    <!-- Window with night sky / city glow -->
    <rect x="155" y="25" width="55" height="75" rx="4" fill="#334155" />
    <rect x="160" y="30" width="45" height="65" rx="2" fill="#1e293b" />
    <!-- Window cross bars -->
    <line x1="182" y1="30" x2="182" y2="95" stroke="#334155" stroke-width="2" />
    <line x1="160" y1="62" x2="205" y2="62" stroke="#334155" stroke-width="2" />
    <!-- City lights outside -->
    <circle cx="170" cy="50" r="1.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="195" cy="75" r="1.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="175" cy="85" r="1" fill="#ec4899" opacity="0.8" />

    <!-- Wall Shelf -->
    <rect x="25" y="45" width="90" height="6" rx="2" fill="#475569" />
    <!-- Shelf props: small plant & book -->
    <rect x="35" y="25" width="16" height="20" rx="2" fill="#10b981" />
    <path d="M30 45 L40 30 L50 45 Z" fill="#059669" />
    <rect x="65" y="30" width="12" height="15" rx="1" fill="#fbbf24" />
    <rect x="79" y="32" width="10" height="13" rx="1" fill="#ec4899" />

    <!-- Wooden Table / Countertop -->
    <rect x="10" y="175" width="220" height="40" rx="4" fill="#334155" />
    <rect x="10" y="175" width="220" height="8" rx="2" fill="#475569" />
    <!-- Counter legs/shadow -->
    <path d="M25 215 L25 230 L35 230 L35 215 Z" fill="#1e293b" />
    <path d="M205 215 L205 230 L215 230 L215 215 Z" fill="#1e293b" />
  </g>

  <!-- Main Subject & Action Group (Basin, Water, Bucket/Pitcher, Character) -->
  <g id="action-scene" filter="url(#shadow)">
    
    <!-- THE BASIN (Cái chậu) - Target Object -->
    <!-- Basin Back Rim / Interior Base -->
    <ellipse cx="130" cy="180" rx="38" ry="12" fill="url(#basinInt)" />
    <!-- Basin Back Wall Inner -->
    <path d="M 92 180 C 92 195 105 205 130 205 C 155 205 168 195 168 180 Z" fill="url(#basinInt)" />
    
    <!-- Water inside the basin -->
    <ellipse cx="130" cy="185" rx="34" ry="9" fill="#38bdf8" opacity="0.7" />

    <!-- Basin Front Rim / Outer Body -->
    <path d="M 85 165 C 85 160 95 155 130 155 C 165 155 175 160 175 165 
             C 175 170 168 205 130 205 C 92 205 85 170 85 165 Z" fill="url(#basinExt)" />
    
    <!-- Basin Rim Lip (Ellipse cutout for 3D depth) -->
    <ellipse cx="130" cy="165" rx="45" ry="12" fill="#f43f5e" />
    <ellipse cx="130" cy="164" rx="43" ry="10" fill="#fff" opacity="0.15" />
    <ellipse cx="130" cy="166" rx="41" ry="8" fill="url(#basinInt)" />

    <!-- WATER STREAM (Pouring action) -->
    <!-- Splashing / Flowing path from pitcher into basin -->
    <path d="M 98 120 Q 110 145 124 165 L 132 165 Q 118 145 106 120 Z" fill="url(#waterStream)" />
    <!-- Water droplets -->
    <circle cx="120" cy="162" r="2.5" fill="#38bdf8" opacity="0.9" />
    <circle cx="126" cy="168" r="1.5" fill="#38bdf8" opacity="0.9" />

    <!-- PITCHER / BOTTLE (Source of water) -->
    <g transform="translate(85, 95) rotate(-25)">
      <!-- Pitcher Body -->
      <rect x="0" y="0" width="22" height="32" rx="4" fill="#e2e8f0" />
      <rect x="3" y="4" width="16" height="25" rx="2" fill="#cbd5e1" />
      <!-- Pitcher Handle -->
      <path d="M 22 8 C 28 8 28 20 22 22" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <!-- Pitcher Spout -->
      <path d="M 0 5 L -6 2 L 0 10 Z" fill="#e2e8f0" />
      <!-- Water level inside pitcher visible -->
      <rect x="4" y="12" width="14" height="16" rx="1" fill="#38bdf8" opacity="0.6" />
    </g>

    <!-- CHARACTER: Upper body, pouring water -->
    <g id="character">
      <!-- Character Body / Torso -->
      <path d="M 35 180 Q 40 140 70 135 L 85 175 Z" fill="#3b82f6" />
      <rect x="45" y="165" width="35" height="50" rx="8" fill="#2563eb" />

      <!-- Character Arm reaching out to pour -->
      <!-- Shoulder/Upper arm -->
      <path d="M 60 140 Q 80 120 92 110" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" />
      <!-- Forearm & hand holding pitcher -->
      <path d="M 85 115 Q 92 105 88 98" fill="none" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round" />
      <circle cx="86" cy="95" r="5" fill="#fbcfe8" />

      <!-- Character Neck -->
      <rect x="52" y="125" width="12" height="18" rx="4" fill="#fbcfe8" />

      <!-- Character Head -->
      <circle cx="58" cy="105" r="20" fill="#fbcfe8" />
      
      <!-- Hair -->
      <path d="M 38 105 Q 40 85 60 83 Q 80 85 78 105 Q 70 93 58 93 Q 46 93 38 105 Z" fill="#1e293b" />
      <path d="M 42 100 Q 50 90 62 92 Z" fill="#334155" />

      <!-- Facial Expression: Focused & Happy -->
      <!-- Eye (Determined/Happy curve) -->
      <path d="M 62 102 Q 66 98 70 102" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <!-- Rosy Cheek -->
      <circle cx="68" cy="110" r="3.5" fill="#f43f5e" opacity="0.4" />
      <!-- Gentle Smile -->
      <path d="M 63 113 Q 67 117 71 113" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

      <!-- Cute Apron Details -->
      <path d="M 48 165 L 45 205 L 75 205 L 72 165 Z" fill="#f8fafc" />
      <circle cx="60" cy="175" r="4" fill="#f43f5e" />
    </g>
  </g>

  <!-- Foreground Atmospheric Highlights -->
  <!-- Ambient warm light reflection on the counter -->
  <path d="M 10 176 L 230 176 L 230 178 L 10 178 Z" fill="#ffffff" opacity="0.2" />

</svg>