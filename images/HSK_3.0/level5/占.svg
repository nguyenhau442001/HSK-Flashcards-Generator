<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Cafe Light Glow -->
    <radialGradient id="cafe-glow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#cafe-glow)"/>

  <!-- Background Environment: Cafe Wall & Window -->
  <g id="environment">
    <!-- Window with Night City Blur -->
    <rect x="140" y="25" width="75" height="95" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <path d="M177.5 25 v95 M140 72.5 h75" stroke="#334155" stroke-width="1.5"/>
    <!-- City lights through window -->
    <circle cx="155" cy="45" r="3" fill="#38bdf8" opacity="0.6"/>
    <circle cx="190" cy="60" r="4" fill="#fb923c" opacity="0.6"/>
    <circle cx="165" cy="90" r="2.5" fill="#f43f5e" opacity="0.5"/>

    <!-- Cafe Wall Decor (Shelf & Plant) -->
    <rect x="25" y="35" width="85" height="6" rx="3" fill="#334155"/>
    <path d="M40 35 C40 25 50 25 50 35" fill="#10b981"/>
    <path d="M35 35 C30 20 45 20 45 35" fill="#059669"/>
    <!-- Cute pot -->
    <path d="M38 35 h14 l-3 10 h-8 z" fill="#cbd5e1"/>
  </g>

  <!-- Cafe Table & Props -->
  <g id="table-and-props">
    <!-- Table Surface -->
    <ellipse cx="105" cy="165" rx="65" ry="25" fill="#334155" filter="url(#shadow)"/>
    <ellipse cx="105" cy="162" rx="63" ry="23" fill="#475569"/>
    <!-- Table Base/Legs -->
    <path d="M85 175 L70 215 M125 175 L140 215" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

    <!-- "Reserved" / Occupied Prop on Table: Jacket & Coffee Cup & Bag -->
    <!-- Coffee Cup -->
    <rect x="75" y="140" width="14" height="18" rx="3" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M89 144 c4 0 4 6 0 6" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <path d="M78 138 c3 -3 8 -3 11 0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Steam -->

    <!-- Cute Red Scarf / Jacket draped over the chair/table to show "Occupied" -->
    <path d="M110 130 c15 -5 25 10 20 25 c-5 10 -15 15 -25 15 c10 -10 10 -25 5 -40 z" fill="#f43f5e" filter="url(#shadow)"/>
    <path d="M120 135 c10 5 15 15 10 25" stroke="#be123c" stroke-width="2" fill="none"/>
  </g>

  <!-- Main Subject: Disappointed Character arriving at the occupied seat -->
  <g id="arriving-character">
    <!-- Character Body & Torso -->
    <path d="M30 210 c0 -30 15 -45 30 -45 c15 0 30 15 30 45 z" fill="#38bdf8"/>
    <!-- Backpack straps -->
    <path d="M45 168 L35 210 M75 168 L85 210" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

    <!-- Character Neck & Head -->
    <path d="M55 160 h10 v10 h-10 z" fill="#fed7aa"/>
    <circle cx="60" cy="135" r="18" fill="#fed7aa" filter="url(#shadow)"/>

    <!-- Hair -->
    <path d="M43 135 c0 -15 10 -20 20 -20 c12 0 20 8 20 20 c0 3 -3 3 -3 0 c0 -8 -5 -14 -17 -14 c-10 0 -17 6 -17 14 c0 3 -3 3 -3 0 z" fill="#1e293b"/>

    <!-- Surprised/Puzzled Face Expression -->
    <!-- Eyebrows raised -->
    <path d="M51 128 q4 -4 8 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M61 128 q4 -4 8 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Eyes -->
    <circle cx="55" cy="134" r="2" fill="#1e293b"/>
    <circle cx="65" cy="134" r="2" fill="#1e293b"/>
    <!-- Open "O" mouth realizing seat is taken -->
    <ellipse cx="60" cy="143" rx="3.5" ry="4.5" fill="#1e293b"/>

    <!-- Raised Hands in "Oh?" gesture -->
    <circle cx="42" cy="155" r="5" fill="#fed7aa"/>
    <circle cx="78" cy="155" r="5" fill="#fed7aa"/>
  </g>

  <!-- Foreground Chair (Empty, but blocked by the jacket/spot taken) -->
  <g id="chair">
    <path d="M90 170 h30 v35 h-30 z" fill="none"/> <!-- spacer anchor -->
    <!-- Chair Backrest behind table/jacket -->
    <rect x="95" y="95" width="30" height="40" rx="6" fill="#64748b" filter="url(#shadow)"/>
    <rect x="100" y="100" width="20" height="30" rx="3" fill="#475569"/>
  </g>

  <!-- Expressive Visual Context: Clear "Occupied" indicator concept (Subtle Red X or Interdiction / No abstract text, just pure visual cues) -->
  <!-- Red accent glow around the jacket/spot to draw the viewer's eye to the core action ("Already taken / 占") -->
  <circle cx="120" cy="145" r="22" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

</svg>