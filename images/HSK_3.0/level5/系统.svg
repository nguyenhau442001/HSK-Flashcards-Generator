<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Main Server Rack Structure -->
  <rect x="70" y="40" width="100" height="160" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
  
  <!-- Server Modules -->
  <rect x="80" y="55" width="80" height="20" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <rect x="80" y="85" width="80" height="20" rx="2" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <rect x="80" y="115" width="80" height="20" rx="2" fill="#1e293b" stroke="#fb923c" stroke-width="1"/>
  
  <!-- Indicator Lights -->
  <circle cx="90" cy="65" r="3" fill="#38bdf8"/>
  <circle cx="90" cy="95" r="3" fill="#10b981"/>
  <circle cx="90" cy="125" r="3" fill="#fb923c"/>
  
  <!-- Cables/Connections -->
  <path d="M 150 75 L 180 75 L 180 150" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <path d="M 150 105 L 170 105 L 170 180" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Floor/Environment details -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <rect x="20" y="205" width="200" height="4" rx="2" fill="#334155"/>
  
  <!-- Floating Data Particles -->
  <circle cx="50" cy="80" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="190" cy="130" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="210" cy="60" r="2" fill="#ec4899" opacity="0.6"/>
  
  <!-- Cooling Fan Detail -->
  <circle cx="120" cy="165" r="20" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="145" x2="120" y2="185" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="165" x2="140" y2="165" stroke="#475569" stroke-width="2"/>
</svg>