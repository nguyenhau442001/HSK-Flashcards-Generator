<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Hologram Grid Gradient -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient lighting/glow effects in background -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>
  <circle cx="120" cy="140" r="40" fill="#fbbf24" opacity="0.04" filter="url(#glow)"/>

  <!-- SCENE LAYER: Floor / Holographic Table Base -->
  <ellipse cx="120" cy="180" rx="75" ry="25" fill="#0b0f19" filter="url(#shadow)"/>
  <ellipse cx="120" cy="180" rx="70" ry="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Holographic Grid Projection area -->
  <g opacity="0.8">
    <ellipse cx="120" cy="155" rx="55" ry="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <ellipse cx="120" cy="130" rx="40" ry="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Vertical light beams -->
    <path d="M 75 180 L 95 110" stroke="url(#gridGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 165 180 L 145 110" stroke="url(#gridGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 120 182 L 120 95" stroke="url(#gridGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CENTRAL SUBJECT: Multi-layered, interconnected dynamic sphere representing "Field / Domain" (领域) -->
  <g transform="translate(0, -5)" filter="url(#shadow)">
    
    <!-- Outer Orbital Rings (Rotating angled rings) -->
    <g transform="rotate(-15 120 115)">
      <ellipse cx="120" cy="115" rx="62" ry="22" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="30 10 10 10" opacity="0.8"/>
      <!-- Node on outer ring -->
      <circle cx="182" cy="115" r="4" fill="#fbbf24" filter="url(#glow)"/>
    </g>
    
    <g transform="rotate(35 120 115)">
      <ellipse cx="120" cy="115" rx="54" ry="18" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="20 15 5 10" opacity="0.8"/>
      <!-- Node on second ring -->
      <circle cx="66" cy="115" r="3.5" fill="#10b981" filter="url(#glow)"/>
    </g>

    <g transform="rotate(-65 120 115)">
      <ellipse cx="120" cy="115" rx="46" ry="15" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Core Floating Elements (The 'Field' Core) -->
    <!-- Back wireframe hemisphere -->
    <path d="M 85 115 A 35 35 0 0 1 155 115" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" stroke-dasharray="3 3"/>
    
    <!-- Floating geometric data islands / miniature structures inside the field -->
    <!-- Structure 1 (Tech/Medical node) -->
    <path d="M 105 100 L 120 85 L 135 100 Z" fill="#38bdf8" opacity="0.3"/>
    <circle cx="120" cy="85" r="3" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Structure 2 (Bio/Science node) -->
    <circle cx="100" cy="130" r="6" fill="#ec4899" opacity="0.7"/>
    <path d="M 100 124 L 100 115" stroke="#ec4899" stroke-width="2"/>

    <!-- Structure 3 (Astronomy/Physics node) -->
    <circle cx="140" cy="125" r="5" fill="#fb923c" opacity="0.8"/>
    <line x1="140" y1="120" x2="140" y2="105" stroke="#fb923c" stroke-width="2"/>

    <!-- Central Glowing Core Sphere -->
    <circle cx="120" cy="115" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="120" cy="115" r="16" fill="url(#bg)" opacity="0.9"/>
    
    <!-- Core Energy Pulse -->
    <circle cx="120" cy="115" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="120" cy="115" r="4" fill="#ffffff"/>

    <!-- Front wireframe hemisphere -->
    <path d="M 85 115 A 35 35 0 0 0 155 115" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <path d="M 90 125 A 30 20 0 0 0 150 125" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>

  </g>

  <!-- INTERACTIVE CONTEXT: Floating professional tools/symbols orbiting the main field (representing diverse professional fields/domains) -->
  <!-- Medical/Research Cross/Atom -->
  <g transform="translate(48, 85)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <!-- Mini cross icon -->
    <rect x="-2" y="-6" width="4" height="12" rx="1" fill="#ec4899"/>
    <rect x="-6" y="-2" width="12" height="4" rx="1" fill="#ec4899"/>
    <!-- Connection beam to center -->
    <path d="M 14 0 C 35 15, 45 20, 58 25" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <!-- Tech/Gear Icon -->
  <g transform="translate(192, 100)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Mini gear shape -->
    <circle cx="0" cy="0" r="5" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 0 -8 L 0 -10 M 0 8 L 0 10 M -8 0 L -10 0 M 8 0 L 10 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Connection beam to center -->
    <path d="M -14 5 C -30 10, -45 10, -52 12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <!-- Star/Achievement Icon (Art/Literature/General Domain) -->
  <g transform="translate(70, 165)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <!-- Mini star -->
    <path d="M 0 -5 L 1.5 -1.5 L 5 -1 L 2.5 1.5 L 3 5 L 0 3 L -3 5 L -2.5 1.5 L -5 -1 L -1.5 -1.5 Z" fill="#fbbf24"/>
    <!-- Connection beam -->
    <path d="M 8 -8 C 20 -15, 30 -25, 42 -35" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <!-- Environmental/Eco Icon -->
  <g transform="translate(175, 155)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <!-- Mini leaf -->
    <path d="M -3 3 C -3 -3, 3 -4, 4 -4 C 4 2, 0 4, -3 3 Z" fill="#10b981"/>
    <path d="M -3 3 L 1 -1" stroke="#1e293b" stroke-width="1"/>
    <!-- Connection beam -->
    <path d="M -8 -6 C -20 -15, -30 -20, -40 -28" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <!-- Ambient light sparkles -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="40" cy="60" r="1.5" filter="url(#glow)"/>
    <circle cx="205" cy="70" r="2" filter="url(#glow)"/>
    <circle cx="110" cy="45" r="1" filter="url(#glow)"/>
    <circle cx="185" cy="200" r="1.5" filter="url(#glow)"/>
    <circle cx="55" cy="210" r="2" filter="url(#glow)"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Frame Integration -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15"/>
</svg>