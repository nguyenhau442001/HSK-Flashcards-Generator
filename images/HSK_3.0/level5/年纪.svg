<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow for Highlights -->
    <radialGradient id="warm-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Texture / Frame Gradients -->
    <linearGradient id="wood-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="wood-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Metallic Accents -->
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <circle cx="120" cy="120" r="100" fill="url(#warm-glow)" pointer-events="none"/>

  <!-- SCENE: Cozy vintage study room context representing 'Age / Years (niánjì)' -->
  
  <!-- Bookshelf Background Elements -->
  <g opacity="0.4" stroke="#334155" stroke-width="2">
    <line x1="30" y1="180" x2="210" y2="180"/>
    <line x1="40" y1="130" x2="200" y2="130"/>
    <!-- Ambient background books -->
    <rect x="45" y="145" width="12" height="35" rx="2" fill="#38bdf8"/>
    <rect x="60" y="150" width="16" height="30" rx="2" fill="#ec4899"/>
    <rect x="175" y="140" width="14" height="40" rx="2" fill="#10b981"/>
  </g>

  <!-- Main Table Surface -->
  <path d="M 20 185 L 220 185 L 205 210 L 35 210 Z" fill="#334155" filter="url(#drop-shadow)"/>
  <path d="M 20 185 L 220 185 L 220 189 L 20 189 Z" fill="#475569"/>

  <!-- Foreground Props: Photo Frames of Different Generations (representing passage of time / age) -->
  
  <!-- Left Small Frame (Childhood / Youth) -->
  <g transform="translate(35, 115) rotate(-8)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="42" height="52" rx="4" fill="url(#wood-dark)"/>
    <rect x="5" y="5" width="32" height="42" rx="2" fill="#f8fafc"/>
    <!-- Simple abstract portrait: Young sprout / star -->
    <circle cx="21" cy="20" r="8" fill="#fb923c"/>
    <path d="M 13 36 Q 21 28 29 36 Z" fill="#38bdf8"/>
  </g>

  <!-- Right Small Frame (Adulthood) -->
  <g transform="translate(160, 120) rotate(10)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="46" height="40" rx="4" fill="url(#wood-dark)"/>
    <rect x="5" y="5" width="36" height="30" rx="2" fill="#f8fafc"/>
    <!-- Simple abstract portrait: Mountains/Journey -->
    <path d="M 5 25 L 18 12 L 27 20 L 35 15 L 41 25 Z" fill="#10b981"/>
    <circle cx="32" cy="12" r="3" fill="#f59e0b"/>
  </g>

  <!-- MAIN SUBJECT: Vintage Grandfather Clock / Timeline Clock (The ultimate symbol of 年纪 - age/years) -->
  <g transform="translate(75, 30)" filter="url(#drop-shadow)">
    <!-- Clock Body / Wooden Cabinet -->
    <path d="M 25 15 L 65 15 C 72 15 75 22 75 30 L 75 145 C 75 152 72 155 65 155 L 25 155 C 18 155 15 152 15 145 L 15 30 C 15 22 18 15 25 15 Z" fill="url(#wood-light)"/>
    
    <!-- Clock Inner Bevel -->
    <rect x="20" y="20" width="50" height="130" rx="6" fill="#451a03"/>
    
    <!-- Clock Face Background -->
    <circle cx="45" cy="55" r="22" fill="#fef08a"/>
    <circle cx="45" cy="55" r="20" fill="#fffbeb"/>

    <!-- Clock Hands (Showing time passing) -->
    <line x1="45" y1="55" x2="45" y2="43" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="45" y1="55" x2="54" y2="58" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="45" cy="55" r="3" fill="#b45309"/>

    <!-- Clock Hour Ticks -->
    <circle cx="45" cy="37" r="1" fill="#78350f"/>
    <circle cx="45" cy="73" r="1" fill="#78350f"/>
    <circle cx="27" cy="55" r="1" fill="#78350f"/>
    <circle cx="63" cy="55" r="1" fill="#78350f"/>

    <!-- Pendulum Window (Glass arch) -->
    <path d="M 33 82 L 57 82 L 57 135 C 57 142 33 142 33 135 Z" fill="#1e293b"/>
    <path d="M 35 84 L 55 84 L 55 133 C 55 138 35 138 35 133 Z" fill="#0f172a"/>

    <!-- Swinging Pendulum -->
    <g transform="rotate(15, 45, 84)">
      <line x1="45" y1="84" x2="45" y2="122" stroke="url(#brass)" stroke-width="2.5"/>
      <circle cx="45" cy="125" r="7" fill="url(#brass)" filter="url(#drop-shadow)"/>
    </g>

    <!-- Clock Decorative Top Crown -->
    <path d="M 30 15 L 45 5 L 60 15 Z" fill="url(#wood-dark)"/>
    <circle cx="45" cy="5" r="3" fill="url(#brass)"/>
  </g>

  <!-- Interactive/Action Accent Elements (Floating glowing age/growth rings) -->
  <g transform="translate(150, 75)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="#ec4899"/>
  </g>

  <g transform="translate(60, 100)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" opacity="0.7"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Additional Atmospheric Details: Warm glowing particles -->
  <circle cx="105" cy="65" r="2" fill="#fde047" opacity="0.9"/>
  <circle cx="140" cy="45" r="1.5" fill="#fde047" opacity="0.7"/>
  <circle cx="30" cy="90" r="2" fill="#fb923c" opacity="0.8"/>
  <circle cx="190" cy="95" r="2.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="115" cy="140" r="1.5" fill="#38bdf8" opacity="0.9"/>

  <!-- Dynamic lighting reflection on the table -->
  <path d="M 75 188 L 145 188 L 140 195 L 70 195 Z" fill="#ffffff" opacity="0.08"/>
</svg>