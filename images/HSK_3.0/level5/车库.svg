<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wall Gradient -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Car Paint Gradient (Teal/Cyan) -->
    <linearGradient id="car-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0" />
    </linearGradient>

    <!-- Roller Shutter Slat Gradient -->
    <linearGradient id="shutter-slat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Shadow Filter for depth -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feOffset dx="0" dy="4" result="offset" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Back Wall of Garage -->
  <rect x="20" y="40" width="200" height="120" fill="url(#wall-grad)" />

  <!-- Exposed Brick / Panel Lines on Back Wall -->
  <path d="M20 70 H220 M20 100 H220 M20 130 H220" stroke="#1e293b" stroke-width="2" opacity="0.5" />
  <path d="M80 40 V160 M160 40 V160" stroke="#1e293b" stroke-width="2" opacity="0.3" />

  <!-- Garage Interior Details: Wall Shelf & Tools -->
  <rect x="35" y="65" width="45" height="6" rx="2" fill="#cbd5e1" />
  <!-- Toolbox on shelf -->
  <rect x="42" y="53" width="16" height="12" rx="2" fill="#ef4444" />
  <path d="M48 53 V50 H54 V53" fill="none" stroke="#b91c1c" stroke-width="2" />
  <!-- Can on shelf -->
  <circle cx="68" cy="59" r="4" fill="#10b981" />

  <!-- Pegboard / Hanging Wrench Outline -->
  <rect x="160" y="55" width="40" height="50" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <circle cx="170" cy="70" r="2" fill="#64748b" />
  <circle cx="190" cy="70" r="2" fill="#64748b" />
  <circle cx="170" cy="90" r="2" fill="#64748b" />
  <circle cx="190" cy="90" r="2" fill="#64748b" />
  <!-- Wrench graphic -->
  <path d="M182 62 L186 78 L184 82 L180 78 Z" fill="#94a3b8" />

  <!-- Open Roller Shutter Door (Pulled up at the top) -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="200" height="20" rx="3" fill="#475569" stroke="#334155" stroke-width="1" />
    <!-- Slats stacked -->
    <rect x="2" y="3" width="196" height="3" fill="url(#shutter-slat)" />
    <rect x="2" y="8" width="196" height="3" fill="url(#shutter-slat)" />
    <rect x="2" y="13" width="196" height="3" fill="url(#shutter-slat)" />
    <!-- Tracks on sides -->
    <rect x="-4" y="0" width="6" height="140" fill="#334155" />
    <rect x="198" y="0" width="6" height="140" fill="#334155" />
  </g>

  <!-- Floor Surface -->
  <path d="M20 160 L220 160 L235 215 L5 215 Z" fill="url(#floor-grad)" />
  <!-- Floor Highlight / Reflection Line -->
  <path d="M40 160 L200 160" stroke="#64748b" stroke-width="2" opacity="0.6" />
  <ellipse cx="120" cy="180" rx="75" ry="15" fill="#0f172a" opacity="0.6" />

  <!-- PARKING SCENE: The Car inside the Garage -->
  <g filter="url(#soft-shadow)">
    <!-- Headlight Beams hitting the floor -->
    <path d="M60 175 L20 205 L60 205 Z" fill="url(#light-beam)" />

    <!-- Car Wheels -->
    <g>
      <!-- Rear Wheel -->
      <circle cx="75" cy="172" r="16" fill="#0f172a" />
      <circle cx="75" cy="172" r="10" fill="#94a3b8" />
      <circle cx="75" cy="172" r="4" fill="#334155" />
      <!-- Front Wheel -->
      <circle cx="165" cy="172" r="16" fill="#0f172a" />
      <circle cx="165" cy="172" r="10" fill="#94a3b8" />
      <circle cx="165" cy="172" r="4" fill="#334155" />
    </g>

    <!-- Car Body Lower Chassis -->
    <path d="M50 165 C50 155 60 150 70 150 L170 150 C180 150 190 155 190 165 L195 178 C195 183 190 185 185 185 L55 185 C50 185 45 183 45 178 Z" fill="url(#car-body)" />

    <!-- Car Body Cabin / Roof -->
    <path d="M75 150 L95 125 C98 122 102 120 106 120 L140 120 C144 120 148 122 151 125 L170 150 Z" fill="url(#car-body)" />

    <!-- Windows (Windshield & Side Windows) -->
    <path d="M80 148 L98 127 C100 125 103 124 106 124 L138 124 C141 124 144 125 146 127 L165 148 Z" fill="#e0f2fe" opacity="0.9" />
    <!-- Window Divider -->
    <line x1="123" y1="124" x2="123" y2="148" stroke="#0284c7" stroke-width="3" />

    <!-- Headlight & Taillight -->
    <!-- Headlight (Front Right) -->
    <path d="M189 158 Q193 158 194 162 Q193 166 189 166 Z" fill="#fef08a" />
    <!-- Taillight (Rear Left) -->
    <path d="M51 158 Q48 158 47 162 Q48 166 51 166 Z" fill="#f43f5e" />

    <!-- Door Seam / Handle -->
    <path d="M123 150 L123 182" stroke="#0284c7" stroke-width="2" opacity="0.7" />
    <rect x="112" y="162" width="6" height="3" rx="1.5" fill="#e0f2fe" />
  </g>

  <!-- Foreground Atmospheric Elements & Garage Frame -->
  <!-- Caution / Hazard Striping on Garage Threshold -->
  <g transform="translate(20, 215)">
    <rect x="0" y="0" width="200" height="8" fill="#334155" />
    <path d="M0 0 L10 8 L15 8 L5 0 Z M20 0 L30 8 L35 8 L25 0 Z M40 0 L50 8 L55 8 L45 0 Z M60 0 L70 8 L75 8 L65 0 Z M80 0 L90 8 L95 8 L85 0 Z M100 0 L110 8 L115 8 L105 0 Z M120 0 L130 8 L135 8 L125 0 Z M140 0 L150 8 L155 8 L145 0 Z M160 0 L170 8 L175 8 L165 0 Z M180 0 L190 8 L195 8 L185 0 Z" fill="#f59e0b" opacity="0.8" />
  </g>

  <!-- Ambient glowing lighting details -->
  <circle cx="120" cy="30" r="6" fill="#fef08a" opacity="0.9" />
  <path d="M120 36 L120 46" stroke="#fef08a" stroke-width="2" />
  <path d="M110 44 L130 44" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <!-- Ceiling Light Cone -->
  <polygon points="120,46 70,160 170,160" fill="#fef08a" opacity="0.07" />

  <!-- Potted Plant in Corner for real-world context -->
  <path d="M200 145 L210 160 L190 160 Z" fill="#f97316" />
  <path d="M200 145 C195 130 190 120 180 110 C195 115 205 125 200 145 Z" fill="#22c55e" />
  <path d="M200 145 C205 130 215 120 225 115 C210 125 205 135 200 145 Z" fill="#16a34a" />
</svg>