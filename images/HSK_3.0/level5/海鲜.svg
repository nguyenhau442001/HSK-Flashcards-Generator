<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Table / Counter Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Lobster/Crab Shell Gradient -->
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Shrimp Gradient -->
    <linearGradient id="shrimpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric background lights/ambience -->
  <circle cx="60" cy="80" r="40" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="180" cy="100" r="50" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>
  
  <!-- Wooden/Modern Dining Counter Surface -->
  <path d="M 0 170 Q 120 155 240 170 L 240 240 L 0 240 Z" fill="url(#tableGrad)"/>
  <path d="M 0 170 Q 120 155 240 170 L 240 175 Q 120 160 0 175 Z" fill="#475569" opacity="0.5"/>

  <!-- Glowing Warm Restaurant Lantern / Overhead Light Effect -->
  <ellipse cx="120" cy="15" rx="70" ry="15" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Main Seafood Platter (Large Oval Plate) -->
  <!-- Plate Shadow -->
  <ellipse cx="120" cy="162" rx="88" ry="28" fill="#020617" opacity="0.6" filter="url(#softGlow)"/>
  <!-- Outer Rim -->
  <ellipse cx="120" cy="156" rx="84" ry="26" fill="#e2e8f0"/>
  <!-- Inner Dish -->
  <ellipse cx="120" cy="155" rx="78" ry="23" fill="url(#plateGrad)"/>

  <!-- SIDE DISH / LEMON / GARNISH (Left side of plate) -->
  <circle cx="70" cy="150" r="8" fill="#facc15" filter="url(#softGlow)"/>
  <circle cx="70" cy="150" r="6" fill="#fde047"/>
  <!-- Lemon segments -->
  <path d="M 70 150 L 74 146 M 70 150 L 66 154" stroke="#ca8a04" stroke-width="1" stroke-linecap="round"/>

  <!-- GREEN BROCCOLI / PARSLEY GARNISH -->
  <circle cx="165" cy="160" r="6" fill="#10b981"/>
  <circle cx="172" cy="157" r="5" fill="#059669"/>
  <circle cx="168" cy="152" r="6" fill="#34d399"/>

  <!-- STEAM EFFECTS (Rising dynamically) -->
  <path d="M 90 130 Q 95 100 85 70" stroke="url(#steamGrad)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M 125 125 Q 115 95 130 65" stroke="url(#steamGrad)" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M 150 135 Q 155 105 145 75" stroke="url(#steamGrad)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- GRILLED FISH (Center-Back) -->
  <g transform="translate(120, 138)">
    <!-- Fish Body Shadow -->
    <ellipse cx="0" cy="5" rx="35" ry="12" fill="#0f172a" opacity="0.3"/>
    <!-- Fish body -->
    <path d="M -35 0 Q 0 -12 35 0 Q 0 12 -35 0 Z" fill="#fb923c"/>
    <!-- Grill marks -->
    <path d="M -15 -6 L -10 6 M -2 -8 L 3 8 M 12 -5 L 17 5" stroke="#9a3412" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Tail -->
    <path d="M 32 -2 L 45 -10 L 42 0 L 45 10 L 32 2 Z" fill="#ea580c"/>
    <!-- Fish eye -->
    <circle cx="-25" cy="-2" r="2" fill="#0f172a"/>
    <!-- Lemon slice garnish on fish -->
    <ellipse cx="0" cy="-2" rx="4" ry="7" fill="#facc15" transform="rotate(20 0 -2)"/>
  </g>

  <!-- JUMBO SHRIMPS / PRAWNS (Crossed in front) -->
  <!-- Shrimp 1 (Left) -->
  <g transform="translate(90, 142) rotate(-15)">
    <!-- Shadow -->
    <path d="M -20 15 Q 0 25 20 15" stroke="#000" stroke-width="4" opacity="0.2" fill="none"/>
    <!-- Body -->
    <path d="M -22 10 C -15 -5 10 -10 22 5 C 10 15 -10 20 -22 10 Z" fill="url(#shrimpGrad)"/>
    <!-- Segments -->
    <path d="M -10 2 C -5 5 0 5 5 2" stroke="#fda4af" stroke-width="1.5" fill="none"/>
    <path d="M -2 7 C 2 9 6 8 10 5" stroke="#fda4af" stroke-width="1.5" fill="none"/>
    <!-- Tail fan -->
    <path d="M 22 5 L 28 0 L 30 8 L 24 10 Z" fill="#e11d48"/>
    <!-- Head -->
    <path d="M -22 10 C -25 15 -28 12 -25 8 Z" fill="#f43f5e"/>
    <!-- Antennae -->
    <path d="M -25 8 Q -35 5 -40 10" stroke="#fda4af" stroke-width="1" fill="none"/>
  </g>

  <!-- Shrimp 2 (Right, mirrored action) -->
  <g transform="translate(145, 142) scale(-1, 1) rotate(-15)">
    <path d="M -22 10 C -15 -5 10 -10 22 5 C 10 15 -10 20 -22 10 Z" fill="url(#shrimpGrad)"/>
    <path d="M -10 2 C -5 5 0 5 5 2" stroke="#fda4af" stroke-width="1.5" fill="none"/>
    <path d="M -2 7 C 2 9 6 8 10 5" stroke="#fda4af" stroke-width="1.5" fill="none"/>
    <path d="M 22 5 L 28 0 L 30 8 L 24 10 Z" fill="#e11d48"/>
    <path d="M -22 10 C -25 15 -28 12 -25 8 Z" fill="#f43f5e"/>
    <path d="M -25 8 Q -35 5 -40 10" stroke="#fda4af" stroke-width="1" fill="none"/>
  </g>

  <!-- CENTRAL LOBSTER / CRAB CLAW ACCENT -->
  <g transform="translate(120, 130)">
    <!-- Glowing Accent Behind Main Subject -->
    <circle cx="0" cy="0" r="25" fill="#f97316" opacity="0.3" filter="url(#glow)"/>
    
    <!-- Large Crab/Lobster Claw Left -->
    <path d="M -15 10 C -30 5 -35 -10 -25 -20 C -15 -30 0 -20 -5 -5 Z" fill="url(#shellGrad)"/>
    <path d="M -25 -20 C -20 -28 -5 -25 -10 -15" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Large Crab/Lobster Claw Right -->
    <path d="M 15 10 C 30 5 35 -10 25 -20 C 15 -30 0 -20 5 -5 Z" fill="url(#shellGrad)"/>
    <path d="M 25 -20 C 20 -28 5 -25 10 -15" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Center Shell Dome -->
    <ellipse cx="0" cy="5" rx="14" ry="10" fill="url(#shellGrad)"/>
    <path d="M -8 2 C -4 7 4 7 8 2" stroke="#ffedd5" stroke-width="1.5" fill="none" opacity="0.8"/>
  </g>

  <!-- CHOPSTICKS (Resting on side/rim for authentic dining context) -->
  <g transform="rotate(15 190 120)">
    <!-- Chopstick 1 -->
    <rect x="160" y="110" width="65" height="3" rx="1.5" fill="#fb923c"/>
    <rect x="160" y="110" width="10" height="3" fill="#fff" opacity="0.6"/>
    <!-- Chopstick 2 -->
    <rect x="160" y="116" width="65" height="3" rx="1.5" fill="#f97316"/>
    <rect x="160" y="116" width="10" height="3" fill="#fff" opacity="0.4"/>
  </g>

  <!-- SAUCE BOWL (Dipping sauce, foreground left) -->
  <g transform="translate(45, 168)">
    <!-- Bowl Shadow -->
    <ellipse cx="0" cy="8" rx="16" ry="6" fill="#020617" opacity="0.5"/>
    <!-- Outer Rim -->
    <ellipse cx="0" cy="4" rx="15" ry="7" fill="#cbd5e1"/>
    <!-- Inner Bowl -->
    <ellipse cx="0" cy="3" rx="13" ry="5" fill="#1e293b"/>
    <!-- Spicy Chili Sauce Inside -->
    <ellipse cx="1" cy="4" rx="10" ry="3.5" fill="#ef4444"/>
    <circle cx="-3" cy="4" r="1.5" fill="#b91c1c"/>
    <circle cx="4" cy="5" r="1" fill="#f87171"/>
  </g>

  <!-- SPARKS / CULINARY MAGIC ACCENTS (Action & Freshness) -->
  <g filter="url(#softGlow)">
    <path d="M 50 85 L 53 91 L 59 94 L 53 97 L 50 103 L 47 97 L 41 94 L 47 91 Z" fill="#fbbf24" transform="scale(0.5) translate(40, 40)"/>
    <path d="M 195 70 L 197 74 L 201 76 L 197 78 L 195 82 L 193 78 L 189 76 L 193 74 Z" fill="#38bdf8" transform="scale(0.6) translate(140, 30)"/>
    <path d="M 110 50 L 112 54 L 116 56 L 112 58 L 110 62 L 108 58 L 104 56 L 108 54 Z" fill="#f43f5e" transform="scale(0.5) translate(110, 20)"/>
  </g>
</svg>