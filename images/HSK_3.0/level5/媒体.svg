<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Studio Light Glow -->
    <radialGradient id="studioLight" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Warm Accent Gradient -->
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#studioLight)" />

  <!-- Studio Background Elements -->
  <!-- Acoustic wall panels -->
  <rect x="20" y="25" width="28" height="90" rx="4" fill="#334155" opacity="0.4" />
  <rect x="54" y="25" width="28" height="90" rx="4" fill="#334155" opacity="0.6" />
  <rect x="192" y="25" width="28" height="90" rx="4" fill="#334155" opacity="0.4" />

  <!-- On-Air / Recording Light Fixture -->
  <rect x="105" y="15" width="30" height="12" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <circle cx="120" cy="21" r="3" fill="#ef4444" />
  <path d="M120 27 L120 40" stroke="#475569" stroke-width="2" />

  <!-- Main Broadcast Desk -->
  <path d="M45 160 L195 160 L210 200 L30 200 Z" fill="#334155" />
  <path d="M35 155 L205 155 L210 162 L30 162 Z" fill="#475569" />
  <rect x="80" y="172" width="80" height="16" rx="4" fill="#1e293b" />
  <!-- Status LED on Desk -->
  <circle cx="95" cy="180" r="3" fill="#10b981" />
  <circle cx="105" cy="180" r="2" fill="#64748b" />
  <circle cx="115" cy="180" r="2" fill="#64748b" />

  <!-- Central Media Report Screen / Tablet (The core "Media Report" object) -->
  <g transform="translate(70, 85)">
    <!-- Stand -->
    <path d="M45 65 L55 65 L60 85 L40 85 Z" fill="#64748b" />
    <ellipse cx="50" cy="85" rx="18" ry="4" fill="#334155" />
    
    <!-- Tablet/Screen Body -->
    <rect x="0" y="0" width="100" height="68" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    <!-- Screen Content (Media broadcast UI representation: waves, video frame) -->
    <rect x="6" y="6" width="88" height="56" rx="4" fill="url(#screenGlow)" />
    
    <!-- Video Play Graphic & Sound Wave inside screen -->
    <circle cx="50" cy="34" r="14" fill="#ffffff" opacity="0.9" />
    <path d="M46 26 L58 34 L46 42 Z" fill="#0f172a" />
    
    <!-- News ticker / wave lines -->
    <rect x="12" y="46" width="30" height="4" rx="2" fill="#ffffff" opacity="0.7" />
    <rect x="12" y="12" width="20" height="4" rx="2" fill="#ef4444" opacity="0.9" />
    
    <!-- Live camera node circle -->
    <circle cx="82" cy="14" r="3" fill="#ef4444" />
  </g>

  <!-- Professional Studio Microphone on Boom Arm -->
  <g transform="translate(160, 105)">
    <!-- Base mount -->
    <circle cx="0" cy="65" r="6" fill="#475569" />
    <!-- Articulated arm -->
    <path d="M0 65 L-15 25 L-40 10" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Mic capsule -->
    <rect x="-48" y="-2" width="16" height="24" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5" />
    <path d="M-40 22 L-40 32" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- News Anchor / Broadcaster Character (Sitting behind desk) -->
  <g transform="translate(10, 0)">
    <!-- Body / Suit Jacket -->
    <path d="M95 150 C95 130 110 120 120 120 C130 120 145 130 145 150 L155 195 L85 195 Z" fill="#2563eb" />
    <!-- White Shirt Collar & Red Tie -->
    <path d="M112 120 L120 138 L128 120 Z" fill="#ffffff" />
    <path d="M117 132 L120 160 L123 132 Z" fill="#ef4444" />
    <!-- Lapels -->
    <path d="M112 120 L102 145 L112 155 Z" fill="#1d4ed8" />
    <path d="M128 120 L138 145 L128 155 Z" fill="#1d4ed8" />

    <!-- Neck -->
    <rect x="113" y="110" width="14" height="15" fill="#fbcfe8" />

    <!-- Head & Face -->
    <circle cx="120" cy="92" r="22" fill="#fbcfe8" />
    
    <!-- Hair (Stylish professional dark hair) -->
    <path d="M98 92 C98 75 110 70 120 70 C132 70 142 75 142 92 C142 96 140 92 138 86 C135 78 128 76 120 76 C112 76 105 78 102 86 C100 92 98 96 98 92 Z" fill="#0f172a" />

    <!-- Friendly Expressive Face Features -->
    <!-- Eyes (happy confident slant) -->
    <path d="M108 90 Q112 86 116 90" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M124 90 Q128 86 132 90" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Glasses (Modern thin frame representing media professional) -->
    <rect x="105" y="84" width="13" height="10" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="122" y="84" width="13" height="10" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="118" y1="89" x2="122" y2="89" stroke="#fbbf24" stroke-width="1.5" />

    <!-- Confident Smile -->
    <path d="M113 100 Q120 106 127 100" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Expressive Hands gesturing towards the media report screen -->
    <!-- Left Hand -->
    <path d="M85 160 C75 155 70 165 78 172 C82 175 88 172 90 168 Z" fill="#fbcfe8" />
  </g>

  <!-- Foreground Atmospheric Elements (Media Broadcast Waves / Pulses) -->
  <path d="M15 60 Q25 50 35 60 T55 60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" stroke-linecap="round" />
  <circle cx="20" cy="45" r="3" fill="#38bdf8" opacity="0.6" />
  <circle cx="215" cy="70" r="4" fill="#f59e0b" opacity="0.6" />
  <path d="M200 110 Q210 100 220 110" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.5" stroke-linecap="round" />
</svg>