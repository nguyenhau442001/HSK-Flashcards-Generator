<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Book -->
  <g transform="translate(40, 60)">
    <!-- Shadow -->
    <ellipse cx="80" cy="140" rx="70" ry="15" fill="#000" opacity="0.3"/>
    <!-- Book Cover -->
    <path d="M20 10 L140 30 L140 130 L20 110 Z" fill="#fb923c"/>
    <!-- Pages -->
    <path d="M25 15 L135 35 L135 125 L25 105 Z" fill="#f1f5f9"/>
    <!-- Turning Page -->
    <path d="M75 22 C100 25 120 40 135 70 C110 60 85 50 75 22 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Book Spine -->
    <path d="M20 10 L20 110 L25 105 L25 15 Z" fill="#ea580c"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="190" cy="50" r="8" fill="#38bdf8"/>
  <circle cx="210" cy="190" r="12" fill="#10b981"/>
  <path d="M180 150 L195 140 L210 150 L195 160 Z" fill="#ec4899"/>
  
  <!-- Motion Lines -->
  <path d="M140 40 Q160 30 180 40" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M145 55 Q170 45 195 55" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>