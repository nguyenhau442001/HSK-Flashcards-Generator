<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- Complex Situation: A messy, high-stakes tactical map setup -->
  <!-- Map Paper -->
  <path d="M40 60 L200 70 L190 190 L30 180 Z" fill="#e2e8f0"/>
  
  <!-- Tactical Markers/Pieces -->
  <circle cx="80" cy="100" r="12" fill="#fb923c"/>
  <circle cx="140" cy="120" r="10" fill="#38bdf8"/>
  <rect x="110" y="80" width="15" height="20" rx="2" fill="#ec4899"/>
  
  <!-- Connecting Lines (The "Situation" Complexity) -->
  <path d="M80 100 L110 90 L140 120" stroke="#f59e0b" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Magnifying Glass -->
  <circle cx="160" cy="150" r="25" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <path d="M178 168 L210 200" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Compass -->
  <circle cx="50" cy="150" r="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <path d="M50 140 L55 150 L50 160 L45 150 Z" fill="#f59e0b"/>
  
  <!-- Ambient Glow/Atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#f59e0b" fill-opacity="0.05"/>
</svg>