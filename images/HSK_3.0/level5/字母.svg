<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Glow Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Desk Lamp Cone Light -->
    <linearGradient id="lampLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Paper Sheet Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall Accent Panel -->
  <rect x="20" y="20" width="200" height="120" rx="12" fill="#1b263b" opacity="0.6"/>

  <!-- Window with Night City Silhouette / Cozy Interior Vibe -->
  <rect x="35" y="32" width="60" height="75" rx="8" fill="url(#windowGlow)" stroke="#475569" stroke-width="2"/>
  <line x1="65" y1="32" x2="65" y2="107" stroke="#475569" stroke-width="1.5"/>
  <line x1="35" y1="70" x2="95" y2="70" stroke="#475569" stroke-width="1.5"/>
  <!-- Tiny warm lights in window (cityscape) -->
  <circle cx="48" cy="50" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="80" cy="58" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="55" cy="88" r="1.5" fill="#f43f5e" opacity="0.8"/>

  <!-- Wall Shelf with Plant Prop -->
  <rect x="135" y="45" width="70" height="6" rx="3" fill="#64748b"/>
  <!-- Potted Plant -->
  <path d="M155,45 L165,30 L175,45 Z" fill="#10b981"/>
  <path d="M165,45 L160,35 L170,35 Z" fill="#34d399"/>
  <rect x="159" y="42" width="12" height="12" rx="2" fill="#cbd5e1"/>

  <!-- Hanging Wall Clock -->
  <circle cx="112" cy="52" r="14" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <circle cx="112" cy="52" r="2" fill="#1e293b"/>
  <line x1="112" y1="52" x2="112" y2="43" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="112" y1="52" x2="120" y2="52" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Desk Lamp Light Cone -->
  <polygon points="190,75 130,195 210,195" fill="url(#lampLight)"/>

  <!-- Wooden/Modern Desk Surface -->
  <path d="M0,185 L240,185 L240,240 L0,240 Z" fill="url(#deskGrad)"/>
  <rect x="0" y="180" width="240" height="6" fill="#475569" opacity="0.8"/>

  <!-- DESK PROPS -->
  <!-- Desk Lamp Base & Arm -->
  <ellipse cx="190" cy="183" rx="14" ry="4" fill="#94a3b8"/>
  <path d="M190,183 L190,120 L165,100" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lamp Shade -->
  <path d="M152,92 L178,92 L185,104 L145,104 Z" fill="#38bdf8"/>
  <ellipse cx="165" cy="104" rx="20" ry="5" fill="#0284c7"/>

  <!-- Pencil Holder with Pens -->
  <rect x="13" y="150" width="22" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="20" y1="150" x2="16" y2="136" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <line x1="27" y1="150" x2="30" y2="134" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="150" x2="24" y2="132" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Notebook / Practice Paper (Centerpiece) -->
  <g filter="url(#softShadow)">
    <polygon points="65,160 145,150 155,205 75,215" fill="#f8fafc"/>
    <!-- Notebook Red Margin -->
    <line x1="82" y1="162" x2="90" y2="210" stroke="#fca5a5" stroke-width="1.5"/>
    <!-- Notebook Blue Lines -->
    <line x1="92" y1="172" x2="140" y2="167" stroke="#bae6fd" stroke-width="1"/>
    <line x1="90" y1="184" x2="138" y2="179" stroke="#bae6fd" stroke-width="1"/>
    <line x1="88" y1="196" x2="136" y2="191" stroke="#bae6fd" stroke-width="1"/>
    <line x1="86" y1="208" x2="134" y2="203" stroke="#bae6fd" stroke-width="1"/>
    <!-- Abstract Stylized Glyph/Shape (Prompt requirement: NO actual readable text, just pure expressive forms representing writing characters/letters) -->
    <path d="M100,177 Q112,168 120,180 Q128,192 110,195" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER: STUDENT / LEARNER -->
  <!-- Body / Torso (Hoodie / Sweater) -->
  <path d="M45,225 C45,195 65,185 90,185 C115,185 135,195 135,225 Z" fill="#818cf8"/>
  <!-- Collar Accent -->
  <path d="M75,185 C75,195 105,195 105,185 Z" fill="#e0e7ff"/>

  <!-- Neck -->
  <rect x="80" y="165" width="20" height="25" fill="#fed7aa"/>

  <!-- Head & Face -->
  <circle cx="90" cy="142" r="26" fill="#fed7aa"/>

  <!-- Hair (Stylish Modern Cut) -->
  <path d="M64,140 C64,120 80,114 96,114 C112,114 118,125 118,142 C118,145 117,148 116,150 C110,135 98,132 82,136 C72,138 66,141 64,140 Z" fill="#1e293b"/>
  <path d="M65,142 C70,126 84,120 98,120 C106,120 114,126 116,134 C104,126 86,130 75,142 Z" fill="#334155"/>

  <!-- Face Features (Focused Expression) -->
  <!-- Eyebrows (Slightly concentrated) -->
  <line x1="78" y1="137" x2="86" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="139" x2="104" y2="137" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes (Determined/Happy focus) -->
  <circle cx="82" cy="144" r="3" fill="#1e293b"/>
  <circle cx="100" cy="144" r="3" fill="#1e293b"/>
  <circle cx="83" cy="143" r="1" fill="#ffffff"/>
  <circle cx="101" cy="143" r="1" fill="#ffffff"/>
  <!-- Gentle Smile -->
  <path d="M89,153 Q91,157 93,153" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cheeks (Warm blush) -->
  <circle cx="77" cy="150" r="4" fill="#fb7185" opacity="0.4"/>
  <circle cx="105" cy="150" r="4" fill="#fb7185" opacity="0.4"/>

  <!-- Left Arm / Hand holding down notebook -->
  <path d="M55,195 Q65,180 75,188" fill="none" stroke="#818cf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="75" cy="190" r="6" fill="#fed7aa"/>

  <!-- Right Arm & Active Writing Hand -->
  <path d="M125,190 C130,180 120,165 110,162" fill="none" stroke="#818cf8" stroke-width="12" stroke-linecap="round"/>
  <!-- Hand gripping pen -->
  <circle cx="110" cy="162" r="6" fill="#fed7aa"/>
  
  <!-- Pen / Stylus actively writing on paper -->
  <line x1="110" y1="162" x2="102" y2="178" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <!-- Pen Tip Sparkle/Glow (indicates writing action) -->
  <circle cx="102" cy="178" r="2" fill="#ffffff"/>
  <path d="M96,174 L98,178 L94,180 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- FOREGROUND ACCENTS (Lighting & Depth) -->
  <!-- Ambient golden rim light on character from lamp -->
  <path d="M114,124 C118,135 118,150 114,165" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
</svg>