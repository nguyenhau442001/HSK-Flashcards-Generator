<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient background glow for travel/sunset memory feeling -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.8"/>
  <circle cx="120" cy="90" r="60" fill="#334155" opacity="0.4"/>
  <circle cx="180" cy="60" r="25" fill="#f59e0b" opacity="0.15"/>

  <!-- TRAVEL MEMORIES SCENE: "这次旅行很有收获" (A rewarding trip/souvenirs and photos) -->
  
  <!-- Wooden Table Surface -->
  <path d="M12 185 L228 185 L220 220 L20 220 Z" fill="#090d16"/>
  <path d="M12 185 L228 185 L228 190 L12 190 Z" fill="#1e293b"/>
  
  <!-- Souvenir Items (The "收获" - Harvest / Gains from travel) -->
  <!-- Vintage Camera -->
  <g transform="translate(35, 155)">
    <rect x="0" y="8" width="36" height="26" rx="4" fill="#38bdf8"/>
    <rect x="8" y="2" width="20" height="8" rx="2" fill="#0284c7"/>
    <circle cx="18" cy="21" r="9" fill="#0f172a"/>
    <circle cx="18" cy="21" r="6" fill="#38bdf8" opacity="0.5"/>
    <circle cx="28" cy="13" r="2" fill="#fbbf24"/>
  </g>

  <!-- Travel Journal / Scrapbook open -->
  <g transform="translate(145, 150)">
    <path d="M0 10 L30 0 L60 10 L60 42 L30 38 L0 42 Z" fill="#f8fafc"/>
    <path d="M30 0 L30 38" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Tiny colorful polaroid inside book -->
    <rect x="8" y="8" width="14" height="16" fill="#fb923c" rx="1"/>
    <rect x="38" y="10" width="14" height="12" fill="#34d399" rx="1"/>
  </g>

  <!-- Souvenir Shell / Special Stone -->
  <g transform="translate(105, 170)">
    <path d="M0 10 Q10 -5 20 10 Q10 18 0 10 Z" fill="#ec4899"/>
    <path d="M5 8 Q10 2 15 8" stroke="#fbcfe8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Main Character: Traveler smiling happily, displaying a photo/postcard -->
  <g transform="translate(65, 75)">
    <!-- Body / Torso -->
    <path d="M25 70 Q55 70 75 110 L-5 110 Q15 70 25 70 Z" fill="#10b981"/>
    <!-- Scarf (Travel style) -->
    <path d="M18 52 Q35 62 52 50 L58 68 Q35 78 12 65 Z" fill="#fbbf24"/>
    <path d="M45 58 L55 85 L42 88 L35 65 Z" fill="#f59e0b"/>

    <!-- Neck -->
    <rect x="23" y="42" width="14" height="14" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="30" cy="28" r="18" fill="#fbcfe8"/>

    <!-- Hair (Stylish adventurer hair) -->
    <path d="M12 25 Q15 8 32 10 Q50 12 48 32 Q45 20 30 18 Q15 16 12 25 Z" fill="#475569"/>

    <!-- Face details: Happy glowing expression -->
    <!-- Eyes (Happy closed arcs) -->
    <path d="M20 25 Q24 22 28 25" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M34 25 Q38 22 42 25" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Cheeks (Blush) -->
    <circle cx="21" cy="29" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="41" cy="29" r="3" fill="#fda4af" opacity="0.6"/>
    <!-- Big Smile -->
    <path d="M25 32 Q31 38 37 32" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Arms holding a souvenir photo/postcard -->
    <!-- Back arm/hand -->
    <path d="M60 75 L75 55 L85 62 L70 85 Z" fill="#fbcfe8"/>
    
    <!-- Polaroid Photo held up proudly -->
    <g transform="translate(70, 35) rotate(12)">
      <rect x="0" y="0" width="32" height="38" rx="2" fill="#ffffff"/>
      <rect x="3" y="4" width="26" height="24" fill="#38bdf8"/>
      <!-- Sun/Mountain drawing on photo representing travel landscape -->
      <circle cx="10" cy="12" r="3" fill="#fde047"/>
      <path d="M3 24 L13 14 L21 22 L25 18 L29 24 Z" fill="#10b981"/>
    </g>

    <!-- Front hand holding photo edge -->
    <path d="M65 65 Q72 58 78 65 Q72 72 65 65 Z" fill="#fbcfe8"/>
  </g>

  <!-- Decorative elements: Floating sparkle stars indicating rich experience / "收获" -->
  <g transform="translate(170, 70)">
    <path d="M0 10 L10 10 L12 0 L14 10 L24 10 L16 16 L19 26 L12 20 L5 26 L8 16 Z" fill="#fbbf24" transform="scale(0.6)"/>
  </g>
  <g transform="translate(30, 90)">
    <path d="M0 10 L10 10 L12 0 L14 10 L24 10 L16 16 L19 26 L12 20 L5 26 L8 16 Z" fill="#38bdf8" transform="scale(0.5)" opacity="0.8"/>
  </g>
  <g transform="translate(125, 45)">
    <path d="M0 10 L10 10 L12 0 L14 10 L24 10 L16 16 L19 26 L12 20 L5 26 L8 16 Z" fill="#34d399" transform="scale(0.4)" opacity="0.9"/>
  </g>

</svg>