<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Alert Gradient -->
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Rope Gradient -->
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Rock/Mountain Gradient -->
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Treasure Chest Gradient -->
    <linearGradient id="chestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Hazard Glow -->
  <circle cx="120" cy="140" r="90" fill="url(#alertGlow)" />

  <!-- Background Abyss & Distant Rocks -->
  <path d="M 0 180 L 80 200 L 160 190 L 240 210 L 240 240 L 0 240 Z" fill="#090d16" />
  
  <!-- Cliff Sides (The Chasm) -->
  <path d="M 0 0 L 70 0 L 50 240 L 0 240 Z" fill="url(#cliffGrad)" />
  <path d="M 240 0 L 170 0 L 190 240 L 240 240 Z" fill="url(#cliffGrad)" />

  <!-- Hanging Bridge Planks & Ropes (Representing calculated risk / crossing danger) -->
  <!-- Left Anchor -->
  <circle cx="50" cy="80" r="6" fill="#475569" />
  <!-- Right Anchor -->
  <circle cx="190" cy="80" r="6" fill="#475569" />

  <!-- Suspension Ropes -->
  <path d="M 50 80 Q 120 150 190 80" stroke="url(#ropeGrad)" stroke-width="3" fill="none" filter="url(#shadow)" />
  <path d="M 50 90 Q 120 160 190 90" stroke="url(#ropeGrad)" stroke-width="2" fill="none" opacity="0.7" />

  <!-- Planks (Wobbling dangerously) -->
  <g filter="url(#shadow)">
    <rect x="70" y="98" width="20" height="8" rx="2" fill="#d97706" transform="rotate(-5, 80, 102)" />
    <rect x="95" y="105" width="20" height="8" rx="2" fill="#f59e0b" transform="rotate(2, 105, 109)" />
    <rect x="120" y="107" width="20" height="8" rx="2" fill="#d97706" transform="rotate(-3, 130, 111)" />
    <rect x="145" y="102" width="20" height="8" rx="2" fill="#f59e0b" transform="rotate(8, 155, 106)" />
  </g>

  <!-- The Main Subject: A Treasure Chest (Investment / Reward) over the Chasm -->
  <g transform="translate(100, 70)" filter="url(#shadow)">
    <!-- Chest Base -->
    <path d="M 5 15 L 35 15 L 38 35 L 2 35 Z" fill="url(#chestGrad)" />
    <!-- Chest Lid -->
    <path d="M 2 15 Q 20 2 38 15 Z" fill="#fbbf24" />
    <!-- Metal Bands -->
    <rect x="12" y="15" width="4" height="20" fill="#78350f" />
    <rect x="24" y="15" width="4" height="20" fill="#78350f" />
    <!-- Lock -->
    <circle cx="20" cy="22" r="3" fill="#1e293b" />
    <!-- Glowing Gem / Reward inside or hovering -->
    <polygon points="20,5 25,12 15,12" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Floating Hazard Elements (Warning indicators, unstable debris) -->
  <!-- Falling Rock Left -->
  <path d="M 40 40 L 48 42 L 45 50 L 37 48 Z" fill="#64748b" filter="url(#shadow)" />
  
  <!-- Falling Rock Right -->
  <path d="M 195 45 L 205 50 L 200 60 L 190 55 Z" fill="#64748b" filter="url(#shadow)" />

  <!-- Danger Sparks / Warning Symbols (Abstract clean geometry substituting symbols) -->
  <g transform="translate(120, 35)" filter="url(#glow)">
    <polygon points="0,-8 3,-2 9,-2 4,2 6,8 0,4 -6,8 -4,2 -9,-2 -3,-2" fill="#fb923c" />
  </g>
  <g transform="translate(85, 45) scale(0.6)" filter="url(#glow)">
    <polygon points="0,-8 3,-2 9,-2 4,2 6,8 0,4 -6,8 -4,2 -9,-2 -3,-2" fill="#ef4444" />
  </g>

  <!-- Atmospheric Particles / Dust Floating -->
  <circle cx="70" cy="140" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="170" cy="150" r="2" fill="#f59e0b" opacity="0.6" />
  <circle cx="105" cy="180" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="135" cy="130" r="1.5" fill="#ffffff" opacity="0.5" />
  <circle cx="150" cy="170" r="2" fill="#38bdf8" opacity="0.4" />

  <!-- Foreground Vignette Framing Frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>