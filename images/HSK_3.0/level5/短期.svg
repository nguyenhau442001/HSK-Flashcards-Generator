<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Classroom Wall/Background -->
  <rect x="30" y="40" width="180" height="100" rx="4" fill="#334155"/>
  <rect x="40" y="50" width="160" height="80" rx="2" fill="#1e293b"/>
  
  <!-- Calendar indicating short duration (few days marked) -->
  <rect x="170" y="55" width="20" height="25" rx="2" fill="#f59e0b"/>
  <rect x="172" y="62" width="16" height="15" fill="#1e293b"/>
  <circle cx="180" cy="58" r="2" fill="#fb923c"/>
  
  <!-- Desk -->
  <rect x="20" y="140" width="200" height="60" rx="8" fill="#475569"/>
  <rect x="30" y="150" width="180" height="10" rx="2" fill="#334155"/>
  
  <!-- Student Character -->
  <g transform="translate(60, 110)">
    <circle cx="40" cy="30" r="15" fill="#fde68a"/>
    <path d="M30 35 Q40 45 50 35" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="35" cy="28" r="2" fill="#1e293b"/>
    <circle cx="45" cy="28" r="2" fill="#1e293b"/>
    <rect x="20" y="50" width="40" height="60" rx="10" fill="#38bdf8"/>
    <rect x="15" y="50" width="10" height="30" rx="3" fill="#38bdf8"/>
    <rect x="55" y="50" width="10" height="30" rx="3" fill="#38bdf8"/>
  </g>
  
  <!-- Book/Learning Material -->
  <rect x="110" y="155" width="60" height="45" rx="4" fill="#ec4899"/>
  <path d="M115 160 h50 M115 170 h50 M115 180 h50" stroke="#fce7f3" stroke-width="2"/>
  
  <!-- Pen/Stylus -->
  <rect x="175" y="160" width="20" height="4" rx="2" fill="#fbbf24" transform="rotate(-20 185 162)"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="200" r="15" fill="#10b981" opacity="0.3"/>
  <circle cx="40" cy="200" r="10" fill="#fb923c" opacity="0.3"/>
</svg>