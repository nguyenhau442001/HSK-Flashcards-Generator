<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Basketball Court Background Elements -->
  <path d="M40 180 L200 180" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="180" r="30" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- Character -->
  <g transform="translate(60, 60)">
    <!-- Body -->
    <path d="M60 140 L40 140 L45 80 L75 80 L80 140 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="60" r="20" fill="#fbbf24"/>
    <!-- Healthy Arm -->
    <path d="M75 90 L100 110" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
    <!-- Injured Arm (Bandaged) -->
    <path d="M45 90 L20 120" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
    <rect x="10" y="110" width="25" height="10" rx="2" fill="#f1f5f9"/>
    <path d="M12 112 L33 118" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M50 140 L45 170" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <path d="M70 140 L75 170" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- Basketball -->
  <circle cx="170" cy="150" r="12" fill="#fb923c"/>
  <path d="M170 138 A12 12 0 0 1 170 162 M158 150 A12 12 0 0 0 182 150" stroke="#0f172a" stroke-width="1" fill="none"/>
  
  <!-- Expression of pain -->
  <path d="M110 115 Q120 125 130 115" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="115" cy="110" r="2" fill="#0f172a"/>
  <circle cx="125" cy="110" r="2" fill="#0f172a"/>
</svg>