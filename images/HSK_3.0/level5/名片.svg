<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Office Background Elements -->
  <circle cx="180" cy="80" r="60" fill="url(#warmGlow)"/>
  <!-- Bookshelf / Wall detail -->
  <rect x="25" y="35" width="45" height="70" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="30" y="45" width="35" height="6" rx="2" fill="#475569" opacity="0.5"/>
  <rect x="30" y="65" width="25" height="6" rx="2" fill="#475569" opacity="0.5"/>
  <rect x="30" y="85" width="30" height="6" rx="2" fill="#475569" opacity="0.5"/>
  
  <!-- Warm Desk Lamp -->
  <path d="M190 20 L210 20 L220 35 L180 35 Z" fill="#64748b" opacity="0.8"/>
  <path d="M200 35 L200 110" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Lamp Beam -->
  <polygon points="175,70 225,70 240,160 140,160" fill="#fbbf24" opacity="0.08"/>

  <!-- Office Desk Surface -->
  <path d="M10 160 L230 160 L230 220 L10 220 Z" fill="url(#deskGrad)" filter="url(#dropShadow)"/>
  <!-- Desk front accent line -->
  <rect x="10" y="160" width="220" height="4" fill="#475569"/>

  <!-- Laptop on Desk (Background context) -->
  <path d="M165 130 L210 130 L215 155 L160 155 Z" fill="#475569"/>
  <path d="M150 155 L225 155 L230 160 L145 160 Z" fill="#64748b"/>

  <!-- Character 1: Business Professional Reaching Out (Right Side) -->
  <!-- Body/Suit -->
  <path d="M140 135 C140 115 160 115 170 135 L185 180 C185 190 170 195 155 195 L125 195 C115 195 105 190 105 180 Z" fill="#1e293b"/>
  <!-- Shirt & Tie -->
  <path d="M145 130 L155 130 L160 155 L140 155 Z" fill="#f8fafc"/>
  <polygon points="148,135 152,135 153,155 147,155" fill="#ef4444"/>
  <!-- Head & Hair -->
  <circle cx="150" cy="95" r="20" fill="#fbcfe8"/>
  <path d="M130 95 C130 75 170 75 170 95 C170 90 165 80 150 80 C135 80 130 90 130 95 Z" fill="#334155"/>
  <!-- Face expressions -->
  <circle cx="144" cy="95" r="2" fill="#334155"/>
  <circle cx="156" cy="95" r="2" fill="#334155"/>
  <path d="M148 102 Q150 105 152 102" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Right Arm handing over business card -->
  <path d="M160 125 C175 125 185 135 195 140" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Hand -->
  <circle cx="198" cy="142" r="6" fill="#fbcfe8"/>

  <!-- Character 2: Client/Partner Receiving (Left Side) -->
  <!-- Body -->
  <path d="M70 140 C70 120 50 120 40 140 L25 195 C40 195 65 195 80 195 L95 180 Z" fill="#0284c7"/>
  <!-- Collar -->
  <path d="M60 130 L75 130 L70 145 L50 145 Z" fill="#f8fafc"/>
  <!-- Head & Hair -->
  <circle cx="60" cy="95" r="20" fill="#fed7aa"/>
  <path d="M40 90 C40 70 80 70 80 90 C80 95 75 82 60 82 C45 82 40 95 40 90 Z" fill="#78350f"/>
  <!-- Face -->
  <circle cx="56" cy="95" r="2" fill="#451a03"/>
  <circle cx="68" cy="95" r="2" fill="#451a03"/>
  <path d="M60 102 Q63 105 66 102" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Left Arm reaching forward to take the card -->
  <path d="M60 130 C75 130 95 138 108 140" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Hand -->
  <circle cx="112" cy="141" r="6" fill="#fed7aa"/>

  <!-- CENTRAL FOCUS: THE BUSINESS CARD (名片) being passed -->
  <g filter="url(#dropShadow)">
    <rect x="135" y="133" width="34" height="20" rx="3" fill="url(#cardGrad)" transform="rotate(-15 152 143)"/>
    <!-- Abstract graphical elements on the card mimicking text/logo lines (NO actual text) -->
    <rect x="140" y="137" width="10" height="4" rx="1.5" fill="#38bdf8" transform="rotate(-15 152 143)"/>
    <rect x="140" y="144" width="20" height="2" rx="1" fill="#cbd5e1" transform="rotate(-15 152 143)"/>
    <rect x="140" y="148" width="14" height="2" rx="1" fill="#cbd5e1" transform="rotate(-15 152 143)"/>
  </g>

  <!-- Action Sparkles / Motion lines -->
  <path d="M178 128 Q182 124 186 128" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="130" cy="125" r="2" fill="#38bdf8"/>
  <circle cx="175" cy="155" r="1.5" fill="#f59e0b"/>

</svg>