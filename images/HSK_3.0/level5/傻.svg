<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Room Interior) -->
  <!-- Wallpaper subtle stripe / accent line -->
  <path d="M0 155 L240 155" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="155" width="240" height="85" fill="url(#floorGrad)"/>

  <!-- Window with Night City View -->
  <g transform="translate(145, 25)">
    <rect x="0" y="0" width="70" height="95" rx="6" fill="#090d16" stroke="#475569" stroke-width="3"/>
    <!-- Window Grid -->
    <line x1="35" y1="0" x2="35" y2="95" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="47" x2="70" y2="47" stroke="#475569" stroke-width="2"/>
    <!-- Tiny City Lights outside -->
    <rect x="10" y="20" width="6" height="10" rx="1" fill="#fbbf24" opacity="0.6"/>
    <rect x="20" y="30" width="8" height="15" rx="1" fill="#38bdf8" opacity="0.5"/>
    <rect x="45" y="15" width="5" height="20" rx="1" fill="#fb923c" opacity="0.7"/>
    <rect x="55" y="55" width="8" height="30" rx="1" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- Bookshelf Background Prop -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="35" height="110" rx="4" fill="#334155" opacity="0.4"/>
    <!-- Books -->
    <rect x="5" y="10" width="25" height="8" rx="2" fill="#ec4899"/>
    <rect x="5" y="20" width="25" height="10" rx="2" fill="#10b981"/>
    <rect x="5" y="35" width="25" height="7" rx="2" fill="#f59e0b"/>
    <rect x="5" y="60" width="25" height="12" rx="2" fill="#38bdf8"/>
    <rect x="5" y="75" width="25" height="9" rx="2" fill="#ef4444"/>
  </g>

  <!-- Desk & Workspace Props -->
  <!-- Desk Base -->
  <path d="M50 160 L210 160 L220 200 L40 200 Z" fill="#475569" filter="url(#shadow)"/>
  <rect x="40" y="155" width="180" height="8" rx="2" fill="#64748b"/>

  <!-- Desk Lamp -->
  <g transform="translate(180, 105)">
    <!-- Glow -->
    <circle cx="-15" cy="35" r="45" fill="url(#lampGlow)"/>
    <!-- Stand -->
    <path d="M-5 50 L-5 20 C-5 5, 10 5, 15 15" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <path d="M-15 50 L5 50" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Shade -->
    <path d="M-25 15 L5 15 L-2 -5 L-18 -5 Z" fill="#fbbf24"/>
    <!-- Bulb Light Point -->
    <circle cx="-10" cy="18" r="3" fill="#fef08a"/>
  </g>

  <!-- Messy Paper / Document Prop (The "foolish" mistake context) -->
  <g transform="translate(70, 145) rotate(-8)">
    <rect x="0" y="0" width="35" height="42" rx="2" fill="#f8fafc" filter="url(#shadow)"/>
    <!-- Scribbles / Red X mark showing error -->
    <line x1="8" y1="10" x2="27" y2="28" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="27" y1="10" x2="8" y2="28" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="33" x2="20" y2="33" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(135, 135)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#e2e8f0"/>
    <path d="M16 10 C22 10, 22 20, 16 20" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M5 -2 C5 -6, 10 -8, 8 -12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- MAIN CHARACTER: Confused/Regretful Man realization moment ("What a silly thing I did") -->
  <g transform="translate(90, 85)" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M-25 75 C-25 55, -10 50, 0 50 C10 50, 25 55, 25 75 L30 115 L-30 115 Z" fill="url(#shirtGrad)"/>
    <!-- Collar -->
    <path d="M-8 50 L0 60 L8 50" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arms & Hands in classic facepalm / head-scratch pose of realization -->
    <!-- Left arm resting on desk -->
    <path d="M-25 65 C-35 75, -45 90, -50 100" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <!-- Right arm raised to head in "facepalm / head slap" (showing realization of foolishness) -->
    <path d="M20 60 C35 50, 25 20, 10 15" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Hand on forehead -->
    <circle cx="5" cy="12" r="7" fill="#fed7aa"/>

    <!-- Neck -->
    <rect x="-6" y="38" width="12" height="16" fill="#fed7aa"/>

    <!-- Head -->
    <circle cx="0" cy="22" r="22" fill="#fed7aa"/>

    <!-- Hair -->
    <path d="M-20 18 C-22 5, -10 -2, 5 -2 C18 -2, 22 8, 22 18 C15 12, 5 10, -5 14 Z" fill="#1e293b"/>
    <path d="M18 12 C23 15, 24 22, 21 26" fill="#1e293b"/>

    <!-- Facial Expression: Regretful, eyes squeezed shut or looking down, mouth wavy/frowning -->
    <!-- Eyebrows tilted upward in dismay -->
    <path d="M-8 16 L-2 20" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M8 16 L2 20" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (Closed tight in realization/regret) -->
    <path d="M-9 24 C-7 26, -5 26, -3 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M3 24 C5 26, 7 26, 9 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Blush / Emotion -->
    <ellipse cx="-11" cy="28" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3"/>
    <ellipse cx="11" cy="28" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3"/>

    <!-- Mouth (Awkward / Embarrassed squiggle) -->
    <path d="M-4 34 Q 0 30, 4 34" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Sweat Drop (Classic anime trope for silly mistake / embarrassment) -->
    <g transform="translate(18, 5)">
      <path d="M0 6 C0 2, 4 -2, 4 -2 C4 -2, 8 2, 8 6 C8 8.5, 6 10, 4 10 C2 10, 0 8.5, 0 6 Z" fill="#38bdf8" opacity="0.85"/>
      <path d="M2.5 5 C2.5 3.8, 3.5 2.5, 3.5 2.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Foreground plant for framing/depth -->
  <g transform="translate(10, 175)">
    <path d="M0 35 C5 20, 15 15, 25 5 C20 20, 10 25, 0 35 Z" fill="#10b981"/>
    <path d="M10 40 C15 25, 30 20, 45 15 C35 30, 20 35, 10 40 Z" fill="#059669"/>
    <path d="M-5 45 C0 30, -5 15, -15 5 C-5 20, 0 35, -5 45 Z" fill="#34d399"/>
    <!-- Pot -->
    <path d="M-5 35 L25 35 L20 65 L0 65 Z" fill="#cbd5e1"/>
    <ellipse cx="10" cy="35" rx="15" ry="4" fill="#94a3b8"/>
  </g>
</svg>