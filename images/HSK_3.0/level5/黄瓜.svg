<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Sun/Heat representation -->
  <circle cx="200" cy="40" r="25" fill="#fbbf24" opacity="0.3"/>
  <path d="M200 10 L200 5 M200 75 L200 70 M230 40 L235 40 M165 40 L170 40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Character -->
  <g transform="translate(40, 80)">
    <!-- Body -->
    <path d="M40 160 Q40 100 80 100 T120 160" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="80" cy="80" r="30" fill="#fde68a"/>
    <!-- Face -->
    <circle cx="70" cy="75" r="3" fill="#1e293b"/>
    <circle cx="90" cy="75" r="3" fill="#1e293b"/>
    <path d="M72 90 Q80 95 88 90" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Hand holding cucumber -->
    <rect x="95" y="105" width="10" height="40" rx="5" fill="#fde68a"/>
  </g>

  <!-- The Cucumber -->
  <g transform="translate(130, 110) rotate(20)">
    <ellipse cx="20" cy="20" rx="15" ry="45" fill="#10b981"/>
    <path d="M10 5 Q15 0 20 5 M25 10 Q30 5 35 10 M15 25 Q20 20 25 25" stroke="#065f46" stroke-width="1" fill="none"/>
  </g>

  <!-- Cooling effect/breeze -->
  <path d="M160 90 Q180 80 200 90 T220 80" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M150 110 Q170 100 190 110 T210 100" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Table/Surface -->
  <rect x="0" y="200" width="240" height="40" fill="#334155"/>
  <rect x="120" y="180" width="80" height="20" fill="#475569" rx="5"/>
</svg>