<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window/Hologram Glow Gradient -->
    <linearGradient id="hologramGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Accent Gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Background Details: Modern Office Interior -->
  <!-- Wallpaper lines / Architectural accents -->
  <path d="M40 0 L40 240 M200 0 L200 240" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <rect x="20" y="30" width="60" height="90" rx="4" fill="#334155" opacity="0.2"/>
  
  <!-- Warm Desk Lamp hanging from top -->
  <path d="M120 0 L120 40" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 40 L140 40 L150 55 L90 55 Z" fill="#64748b"/>
  <circle cx="120" cy="55" r="30" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Wooden Desk Surface -->
  <path d="M10 190 L230 190 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 190 L240 190" stroke="#475569" stroke-width="3"/>
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" opacity="0.4"/>

  <!-- Environment Prop: Traditional book / Old form (representing the old "format/form") -->
  <g transform="translate(35, 155) rotate(-10)" filter="url(#shadow)">
    <rect x="0" y="0" width="45" height="35" rx="3" fill="#cbd5e1"/>
    <path d="M22.5 0 L22.5 35" stroke="#94a3b8" stroke-width="2"/>
    <!-- Abstract old text lines -->
    <line x1="6" y1="10" x2="16" y2="10" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="16" y2="18" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="26" x2="14" y2="26" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Central Focus: The NEW "Form" (形式) - Interactive Holographic 3D UI Element floating -->
  <!-- Holographic projection cone/beams -->
  <polygon points="120,110 90,175 150,175" fill="url(#hologramGrad)"/>
  
  <!-- Floating Holographic UI Tablet/Interface (New Form) -->
  <g transform="translate(90, 80)" filter="url(#shadow)">
    <!-- Glow back -->
    <rect x="-5" y="-5" width="70" height="50" rx="8" fill="#38bdf8" opacity="0.2"/>
    <!-- Main screen -->
    <rect x="0" y="0" width="60" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Dynamic new UI shapes inside hologram -->
    <circle cx="15" cy="20" r="8" fill="#ec4899"/>
    <path d="M30 14 L50 14" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 22 L45 22" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Floating particle sparkles -->
    <circle cx="-10" cy="10" r="2" fill="#fbbf24"/>
    <circle cx="70" cy="30" r="1.5" fill="#38bdf8"/>
    <circle cx="55" cy="-5" r="2" fill="#ec4899"/>
  </g>

  <!-- Character: Designer/Professional excitedly presenting the new form -->
  <g id="character" transform="translate(145, 110)">
    <!-- Body / Torso (Modern teal blazer) -->
    <path d="M-15 80 C-15 55 5 50 25 50 C45 50 65 55 65 80 L75 130 L-25 130 Z" fill="#0d9488" filter="url(#shadow)"/>
    <!-- Inner Shirt / Collar -->
    <path d="M25 50 L15 70 L35 70 Z" fill="#f8fafc"/>
    <path d="M25 70 L25 90" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Neck -->
    <rect x="18" y="38" width="14" height="15" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="25" cy="25" r="18" fill="#fbcfe8"/>

    <!-- Hair (Trendy dark bob style) -->
    <path d="M7 22 C7 10 18 7 26 7 C37 7 45 13 44 26 C43 32 40 40 40 40 C40 40 33 35 25 35 C15 35 7 30 7 22 Z" fill="#334155"/>

    <!-- Expressive Face (Amazed/Delighted looking at the new form) -->
    <!-- Smiling open mouth -->
    <path d="M22 30 Q25 34 28 30" fill="#be185d"/>
    <!-- Rosy cheeks -->
    <circle cx="15" cy="28" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="35" cy="28" r="3" fill="#f43f5e" opacity="0.4"/>
    <!-- Bright energetic eyes -->
    <circle cx="18" cy="22" r="2" fill="#0f172a"/>
    <circle cx="32" cy="22" r="2" fill="#0f172a"/>
    <path d="M16 19 Q18 17 20 19" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M30 19 Q32 17 34 19" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Gesturing Arm pointing towards the Holographic New Form -->
    <!-- Back arm -->
    <path d="M-5 60 L-20 75 L-15 85" fill="none" stroke="#0d9488" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front pointing arm -->
    <path d="M55 65 Q25 65 -15 75" fill="none" stroke="#0d9488" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand pointing -->
    <circle cx="-18" cy="76" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Foreground Props: Coffee cup on desk adding realism -->
  <g transform="translate(190, 170)">
    <rect x="0" y="0" width="18" height="20" rx="3" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M18 4 C23 4 23 14 18 16" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam rising from coffee -->
    <path d="M5 -4 Q8 -10 5 -16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M13 -6 Q10 -12 13 -18" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Accent Decorative Elements (Modern UI Highlights) -->
  <circle cx="215" cy="40" r="6" fill="url(#accentGrad)" opacity="0.8"/>
  <circle cx="25" cy="80" r="4" fill="#38bdf8" opacity="0.6"/>
  
  <!-- Subtle lighting frame border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>