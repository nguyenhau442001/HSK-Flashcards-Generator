<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Correction Ink Gradient -->
    <linearGradient id="ink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Lighting (Desk Lamp Cone) -->
  <path d="M120 10 L190 130 L50 130 Z" fill="#fbbf24" opacity="0.05" />
  <circle cx="120" cy="110" r="70" fill="url(#lamp-glow)" />

  <!-- BACKGROUND ENVIRONMENT -->
  <g id="environment">
    <!-- Bookshelf backdrop -->
    <rect x="25" y="40" width="45" height="70" rx="4" fill="#334155" opacity="0.4" />
    <line x1="25" y1="65" x2="70" y2="65" stroke="#475569" stroke-width="3" opacity="0.4" />
    <line x1="25" y1="90" x2="70" y2="90" stroke="#475569" stroke-width="3" opacity="0.4" />
    <!-- Books on shelf -->
    <path d="M33 65 L33 48 C33 46 35 45 37 45 L41 45 C43 45 45 46 45 48 L45 65 Z" fill="#ec4899" opacity="0.5" />
    <path d="M48 65 L48 52 C48 50 50 49 52 49 L55 49 C57 49 59 50 59 52 L59 65 Z" fill="#38bdf8" opacity="0.5" />

    <!-- Potted Plant on Desk -->
    <path d="M190 125 L210 125 L205 145 L195 145 Z" fill="#64748b" />
    <circle cx="200" cy="115" r="14" fill="#10b981" />
    <circle cx="190" cy="110" r="10" fill="#059669" />
    <circle cx="210" cy="112" r="11" fill="#34d399" />

    <!-- Large Wooden Desk Surface -->
    <path d="M10 145 L230 145 L235 220 L5 220 Z" fill="#0f172a" />
    <path d="M10 145 L230 145 L230 152 L10 152 Z" fill="#334155" />
  </g>

  <!-- FOREGROUND PROPS: Open Notebook & Documents -->
  <g id="desk-props" filter="url(#shadow)">
    <!-- Notebook Base -->
    <path d="M65 135 L175 135 C180 135 185 140 185 145 L180 205 C180 210 175 215 170 215 L70 215 C65 215 60 210 60 205 L55 145 C55 140 60 135 65 135 Z" fill="#f8fafc" />
    <!-- Notebook Center Binding -->
    <line x1="120" y1="135" x2="120" y2="215" stroke="#cbd5e1" stroke-width="2" />
    <path d="M116 140 Q120 143 124 140 M116 160 Q120 163 124 160 M116 180 Q120 183 124 180 M116 200 Q120 203 124 200" fill="none" stroke="#94a3b8" stroke-width="2" />

    <!-- Error Marks (Red X and squiggles) -->
    <path d="M75 155 L90 170 M90 155 L75 170" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="100" y1="162" x2="112" y2="162" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    
    <path d="M75 185 L90 200 M90 185 L75 200" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="100" y1="192" x2="112" y2="192" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Correction Action: Bright Correct Checkmark and Flowing Ink -->
    <path d="M135 160 L144 172 L162 148" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="135" y1="190" x2="168" y2="190" stroke="url(#ink-grad)" stroke-width="4" stroke-linecap="round" />
    <line x1="135" y1="202" x2="155" y2="202" stroke="url(#ink-grad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER: Concentrated Student/Editor correcting mistakes -->
  <g id="character" filter="url(#shadow)">
    <!-- Character Torso & Hoodie -->
    <path d="M85 225 L85 180 C85 165 95 155 110 155 L130 155 C145 155 155 165 155 180 L155 225 Z" fill="#3b82f6" />
    <!-- Hoodie Strings -->
    <path d="M105 155 L108 175" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <path d="M135 155 L132 175" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <!-- Collar -->
    <path d="M100 155 Q120 165 140 155 L135 148 Q120 155 105 148 Z" fill="#1d4ed8" />

    <!-- Neck -->
    <path d="M110 135 L130 135 L130 150 L110 150 Z" fill="#ffedd5" />

    <!-- Head -->
    <circle cx="120" cy="115" r="26" fill="#ffedd5" />

    <!-- Hair (Stylized modern neat hair) -->
    <path d="M94 115 C94 98 108 92 122 92 C138 92 146 102 146 118 C146 122 145 125 145 125 C145 125 140 110 125 108 C110 106 100 120 94 115 Z" fill="#1e293b" />
    <!-- Round Smart Glasses -->
    <circle cx="111" cy="115" r="7" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="129" cy="115" r="7" fill="none" stroke="#1e293b" stroke-width="2" />
    <line x1="118" y1="114" x2="122" y2="114" stroke="#1e293b" stroke-width="2" />
    <!-- Concentrated Eyebrows (slanted for intense focus) -->
    <path d="M104 108 L114 111" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M136 108 L126 111" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Confident/Focused Mouth -->
    <path d="M117 127 Q120 130 123 127" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />

    <!-- Arms & Active Hands -->
    <!-- Left Arm (resting/holding book edge) -->
    <path d="M85 170 L70 185 L85 200" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="70" cy="188" r="7" fill="#ffedd5" />

    <!-- Right Arm (actively writing/correcting with pen) -->
    <path d="M150 170 L165 175 L150 145" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Hand -->
    <circle cx="152" cy="142" r="7" fill="#ffedd5" />

    <!-- Pen / Correction Marker Tool -->
    <g transform="rotate(-35 152 142)">
      <rect x="148" y="105" width="8" height="35" rx="3" fill="#f43f5e" />
      <polygon points="148,140 156,140 152,148" fill="#0f172a" />
      <!-- Glowing pen tip effect -->
      <circle cx="152" cy="148" r="2" fill="#38bdf8" />
    </g>
  </g>

  <!-- FOREGROUND DESK DETAILS: Eraser & Correction Tape Dispenser -->
  <g id="desk-extras" filter="url(#shadow)">
    <!-- Eraser (pink block) -->
    <rect x="35" y="180" width="18" height="12" rx="3" transform="rotate(-15 35 180)" fill="#f472b6" />
    <rect x="35" y="177" width="18" height="4" rx="1" transform="rotate(-15 35 180)" fill="#f8fafc" />

    <!-- Desk Lamp Head (Top-left source hint) -->
    <path d="M30 35 L70 35 L60 55 L40 55 Z" fill="#fbbf24" />
    <path d="M48 20 L52 20 L52 35 L48 35 Z" fill="#64748b" />
  </g>
</svg>