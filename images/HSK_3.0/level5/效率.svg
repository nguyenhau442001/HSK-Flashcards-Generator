<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Office Environment Background Details -->
  <!-- Window Grid -->
  <g opacity="0.15">
    <rect x="25" y="30" width="60" height="70" rx="4" fill="none" stroke="#94a3b8" stroke-width="2" />
    <line x1="55" y1="30" x2="55" y2="100" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="25" y1="65" x2="85" y2="65" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- Bookshelf / Plant background -->
  <rect x="180" y="40" width="35" height="75" rx="2" fill="#334155" opacity="0.4" />
  <rect x="185" y="55" width="25" height="4" rx="1" fill="#64748b" />
  <rect x="185" y="75" width="25" height="4" rx="1" fill="#64748b" />
  <!-- Cute plant pot -->
  <path d="M190 53 L193 45 L202 45 L205 53 Z" fill="#fb923c" />
  <path d="M197 45 Q192 38 188 40 Q193 43 197 45 Z" fill="#10b981" />
  <path d="M197 45 Q202 36 207 39 Q202 43 197 45 Z" fill="#34d399" />

  <!-- Standing Desk & Setup -->
  <rect x="20" y="155" width="200" height="10" rx="3" fill="url(#deskGrad)" />
  <!-- Desk Legs -->
  <rect x="45" y="165" width="8" height="50" fill="#475569" />
  <rect x="187" y="165" width="8" height="50" fill="#475569" />

  <!-- Dual Monitors (Symbolizing High Efficiency / Workflow) -->
  <!-- Left Monitor (Analytics / Charts) -->
  <rect x="40" y="80" width="65" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <rect x="44" y="84" width="57" height="33" rx="2" fill="#1e293b" />
  <!-- Chart inside left monitor -->
  <path d="M50 110 L60 102 L70 105 L85 90 L95 87" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="95" cy="87" r="3" fill="#38bdf8" filter="url(#glow)" />
  <!-- Monitor Stand -->
  <path d="M68 125 L74 125 L76 138 L66 138 Z" fill="#475569" />
  <rect x="58" y="138" width="28" height="3" rx="1" fill="#475569" />

  <!-- Right Monitor (Main Work / Efficiency Boost - Glowing Upward Arrow) -->
  <rect x="115" y="70" width="80" height="55" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <rect x="119" y="74" width="72" height="43" rx="2" fill="url(#screenGrad)" opacity="0.2" />
  <!-- Efficiency Upward Trend Graphic -->
  <path d="M125 105 L140 95 L155 100 L175 80" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="175,76 179,84 171,84" fill="#38bdf8" />
  <path d="M125 105 L140 95 L155 100 L175 80 L175 110 L125 110 Z" fill="url(#chartGrad)" />
  <!-- Monitor Stand -->
  <path d="M150 125 L158 125 L161 140 L147 140 Z" fill="#475569" />
  <rect x="138" y="140" width="34" height="3" rx="1" fill="#475569" />

  <!-- Desk Props -->
  <!-- Coffee Mug -->
  <rect x="195" y="135" width="12" height="15" rx="2" fill="#f43f5e" />
  <path d="M207 139 C212 139 212 147 207 147" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
  <!-- Laptop Base -->
  <path d="M85 150 L125 150 L130 155 L80 155 Z" fill="#64748b" />

  <!-- Main Character: Focused Professional Collaborating / Working Productively -->
  <!-- Body / Torso (Active posture leaning forward) -->
  <path d="M100 155 C100 135 115 125 125 125 C135 125 145 135 145 155 Z" fill="#fbbf24" /> <!-- Yellowish formal shirt/sweater -->
  <!-- Collar -->
  <path d="M120 125 L125 133 L130 125 Z" fill="#ffffff" />

  <!-- Head & Face -->
  <circle cx="125" cy="105" r="16" fill="#fcd34d" /> <!-- Warm skin tone -->
  <!-- Hair -->
  <path d="M109 105 C109 93 115 90 125 90 C137 90 141 96 141 106 C135 102 130 102 125 103 C117 103 113 104 109 105 Z" fill="#334155" />
  <!-- Glasses (Smart/Professional look) -->
  <rect x="117" y="98" width="8" height="6" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="127" y="98" width="8" height="6" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <line x1="125" y1="101" x2="127" y2="101" stroke="#1e293b" stroke-width="1.5" />
  <!-- Determined / Confident Smile -->
  <path d="M122 113 Q125 116 128 113" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

  <!-- Arms / Hands typing or gesturing high efficiency -->
  <!-- Left Arm (Typing/Controlling) -->
  <path d="M105 135 L90 145 L95 152" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="95" cy="152" r="4" fill="#fcd34d" />
  <!-- Right Arm (Raised in confident gesture of success/speed) -->
  <path d="M140 135 L155 120 L150 110" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="150" cy="110" r="4" fill="#fcd34d" />

  <!-- Floating Efficiency Elements / Speed Lines (Abstract contextual icons, NO TEXT) -->
  <g transform="translate(180, 50)" filter="url(#glow)">
    <circle cx="0" cy="0" r="12" fill="#10b981" opacity="0.2" />
    <path d="M-4 2 L-1 -2 L3 4" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g transform="translate(25, 120)" filter="url(#glow)">
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.2" />
    <path d="M-3 -1 L2 -1 L0 -4 M-2 2 L3 2" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Sparkles representing peak performance and optimized workflow -->
  <path d="M190 95 L192 90 L197 88 L192 86 L190 81 L188 86 L183 88 L188 90 Z" fill="#fbbf24" filter="url(#glow)" />
  <path d="M35 60 L36.5 56 L40.5 54.5 L36.5 53 L35 49 L33.5 53 L29.5 54.5 L33.5 56 Z" fill="#38bdf8" opacity="0.8" />
</svg>