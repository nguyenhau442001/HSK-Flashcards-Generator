<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Environment -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <rect x="0" y="175" width="240" height="5" fill="#475569"/>
  
  <!-- Street Lamp -->
  <rect x="200" y="60" width="6" height="120" fill="#64748b"/>
  <circle cx="203" cy="55" r="15" fill="#fbbf24" opacity="0.3"/>
  <circle cx="203" cy="55" r="8" fill="#f59e0b"/>
  
  <!-- The Group of Young People (The 'huǒ') -->
  <!-- Person 1 -->
  <g transform="translate(60, 120)">
    <circle cx="10" cy="20" r="8" fill="#fb923c"/>
    <path d="M2 30 L18 30 L15 60 L5 60 Z" fill="#38bdf8"/>
    <line x1="10" y1="30" x2="10" y2="55" stroke="#38bdf8" stroke-width="4"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(90, 110)">
    <circle cx="10" cy="20" r="8" fill="#ec4899"/>
    <path d="M2 30 L18 30 L15 70 L5 70 Z" fill="#10b981"/>
    <line x1="10" y1="30" x2="10" y2="65" stroke="#10b981" stroke-width="4"/>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(120, 115)">
    <circle cx="10" cy="20" r="8" fill="#fbbf24"/>
    <path d="M2 30 L18 30 L15 65 L5 65 Z" fill="#818cf8"/>
    <line x1="10" y1="30" x2="10" y2="60" stroke="#818cf8" stroke-width="4"/>
  </g>

  <!-- Motion Lines -->
  <path d="M40 130 L20 120" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 150 L20 140" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Perspective Ground Detail -->
  <path d="M0 240 L120 180 L240 240 Z" fill="#1e293b" opacity="0.4"/>
</svg>