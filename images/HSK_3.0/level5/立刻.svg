<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Speed/Action Gradient -->
    <linearGradient id="actionStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Rocket Fire Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Portal/Urgency Glow -->
    <radialGradient id="alarmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Control Room / Launch Pad Context) -->
  <!-- Ambient Red Alert Glow from top corner -->
  <circle cx="200" cy="40" r="100" fill="url(#alarmGlow)" />

  <!-- Control Room Wall Panels & Details -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16" />
  <rect x="20" y="200" width="40" height="25" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <circle. x="30" y="212" r="4" fill="#10b981" />
  <circle. x="45" y="212" r="4" fill="#38bdf8" />
  
  <rect x="70" y="195" width="60" height="30" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M80 215 L90 205 L100 215 L110 203 L120 210" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Speed Motion Lines (Representing "Right Now / Instantly") -->
  <path d="M20 70 L110 70" stroke="url(#actionStreak)" stroke-width="3" stroke-linecap="round" />
  <path d="M10 95 L130 95" stroke="url(#actionStreak)" stroke-width="4" stroke-linecap="round" />
  <path d="M30 120 L90 120" stroke="url(#actionStreak)" stroke-width="2" stroke-linecap="round" />
  <path d="M50 145 L140 145" stroke="url(#actionStreak)" stroke-width="3" stroke-linecap="round" />

  <!-- Action Subject: Dynamic Launching Rocket (Dashing Instantly) -->
  <g transform="translate(110, 85) rotate(-35)">
    <!-- Rocket Exhaust Flame -->
    <path d="M -35 0 L -70 -8 L -45 0 L -70 8 Z" fill="url(#fireGrad)" />
    <circle cx="-40" cy="0" r="6" fill="#fef08a" />

    <!-- Rocket Body -->
    <path d="M-30 -12 C-15 -16 20 -16 35 -6 C42 -2 42 2 35 6 C20 16 -15 16 -30 12 Z" fill="#f8fafc" />
    
    <!-- Rocket Nose Cone -->
    <path d="M 25 -10 C 35 -5 42 -2 42 -2 C 42 -2 35 1 25 4 Z" fill="#ef4444" />

    <!-- Rocket Window -->
    <circle cx="5" cy="0" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="4" cy="-1" r="2" fill="#38bdf8" opacity="0.8" />

    <!-- Rocket Fins -->
    <path d="M -20 -12 L -35 -22 L -25 -10 Z" fill="#ef4444" />
    <path d="M -20 12 L -35 22 L -25 10 Z" fill="#ef4444" />
    <path d="M -25 -10 L -30 0 L -25 10 Z" fill="#cbd5e1" />
  </g>

  <!-- Foreground Immediate Action Prop: Urgent Countdown / Activation Button being slammed -->
  <!-- Base Console -->
  <path d="M 140 190 L 180 150 L 220 190 Z" fill="#334155" stroke="#475569" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Glowing Emergency Button Frame -->
  <ellipse cx="180" cy="170" rx="18" ry="12" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
  
  <!-- Big Action Button (Pressed/Instant Activation) -->
  <ellipse cx="180" cy="166" rx="14" ry="9" fill="#ef4444" />
  <ellipse cx="180" cy="164" rx="10" ry="6" fill="#f87171" />

  <!-- Action Shockwaves / Impact Ripples around Button -->
  <path d="M 155 170 C 155 158 205 158 205 170" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 148 175 C 148 160 212 160 212 175" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- Floating Sparkles / Dynamic Energy Bursts -->
  <g fill="#fbbf24">
    <path d="M 195 130 L 198 138 L 206 141 L 198 144 L 195 152 L 192 144 L 184 141 L 192 138 Z" transform="scale(0.6) translate(110, 40)" />
    <path d="M 195 130 L 198 138 L 206 141 L 198 144 L 195 152 L 192 144 L 184 141 L 192 138 Z" transform="scale(0.4) translate(210, 150)" fill="#38bdf8" />
    <path d="M 195 130 L 198 138 L 206 141 L 198 144 L 195 152 L 192 144 L 184 141 L 192 138 Z" transform="scale(0.5) translate(80, 20)" fill="#10b981" />
  </g>

  <!-- Dynamic Lighting/Vignette Frame Overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>