<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Coffee Splash Gradient -->
    <linearGradient id="splashGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Speed Lines / Action Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Background -->
    <rect width="240" height="240" fill="url(#bgGrad)"/>

    <!-- Room Interior / Environment Elements -->
    <!-- Window with City Glow -->
    <g transform="translate(140, 30)">
      <rect x="0" y="0" width="70" height="90" rx="4" fill="#334155" opacity="0.4"/>
      <rect x="6" y="6" width="26" height="78" rx="2" fill="#38bdf8" opacity="0.1"/>
      <rect x="38" y="6" width="26" height="78" rx="2" fill="#38bdf8" opacity="0.15"/>
      <!-- Window Frame Details -->
      <line x1="34" y1="0" x2="34" y2="90" stroke="#1e293b" stroke-width="3"/>
    </g>

    <!-- Wall Shelf with Books/Props -->
    <rect x="25" y="45" width="80" height="6" rx="2" fill="#475569"/>
    <path d="M 35 45 L 35 25 L 48 25 L 48 45 Z" fill="#ec4899" opacity="0.8"/>
    <path d="M 52 45 L 52 30 L 62 30 L 62 45 Z" fill="#38bdf8" opacity="0.8"/>
    <circle cx="75" cy="35" r="8" fill="#10b981"/>

    <!-- Floor Surface -->
    <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#floorGrad)"/>
    <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2"/>

    <!-- Background Coat Rack / Plant Silhouette -->
    <path d="M 200 170 L 200 80" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M 200 95 L 185 105" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <path d="M 200 115 L 215 125" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Action Speed Lines (Vội vàng - Hurried movement streaks) -->
    <g opacity="0.3" filter="url(#glow)">
      <line x1="20" y1="110" x2="80" y2="110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <line x1="40" y1="95" x2="100" y2="95" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="10" y1="140" x2="70" y2="140" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="50" y1="155" x2="90" y2="155" stroke="#f43f5e" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Main Character: Rushing Office Worker / Person (连忙 - Hurrying action) -->
    <g transform="translate(10, 0)">
      <!-- Motion Blur / Ghost Effect Behind -->
      <g opacity="0.2" transform="translate(-15, 0)">
        <!-- Briefcase (Ghost) -->
        <rect x="135" y="145" width="22" height="15" rx="3" fill="#fb923c"/>
        <!-- Body (Ghost) -->
        <path d="M 125 105 L 145 140 L 130 175 L 110 175 L 115 130 Z" fill="#38bdf8"/>
      </g>

      <!-- Falling Papers / Documents (Sense of chaos/hurry) -->
      <g transform="translate(0, -5)">
        <path d="M 70 85 L 85 80 L 90 95 L 75 100 Z" fill="#f8fafc" transform="rotate(15, 80, 90)"/>
        <path d="M 95 70 L 110 75 L 105 90 L 90 85 Z" fill="#cbd5e1" transform="rotate(-25, 100, 80)"/>
        <line x1="74" y1="88" x2="84" y2="85" stroke="#64748b" stroke-width="1" transform="rotate(15, 80, 90)"/>
        <line x1="97" y1="76" x2="106" y2="79" stroke="#64748b" stroke-width="1" transform="rotate(-25, 100, 80)"/>
      </g>

      <!-- Flying Coffee Cup & Splash (Uh oh, rushing!) -->
      <g transform="translate(110, 85) rotate(-30)">
        <!-- Splash Drops -->
        <circle cx="-15" cy="-10" r="4" fill="url(#splashGrad)"/>
        <circle cx="-25" cy="-2" r="2.5" fill="url(#splashGrad)"/>
        <path d="M -5 -12 Q -10 -25 0 -30 Q 10 -25 5 -12 Z" fill="url(#splashGrad)" opacity="0.9"/>
        <!-- Cup Body -->
        <path d="M 0 0 L 6 22 C 6 24 4 25 2 25 L -10 25 C -12 25 -14 24 -14 22 L -8 0 Z" fill="#f8fafc"/>
        <!-- Cup Lid -->
        <ellipse cx="-4" cy="-1" rx="5" ry="2" fill="#0284c7"/>
        <path d="M -11 2 C -8 4 0 4 3 2" stroke="#64748b" stroke-width="1.5" fill="none"/>
      </g>

      <!-- Character Legs (Action stride) -->
      <!-- Back Leg (stepping forward) -->
      <path d="M 95 130 Q 100 155 110 170 L 125 170" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Back Shoe -->
      <path d="M 115 170 L 132 170 C 135 170 137 173 135 175 L 120 175 Z" fill="#0f172a"/>

      <!-- Front Leg (pushing off) -->
      <path d="M 120 130 Q 135 150 145 168" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Front Shoe -->
      <path d="M 138 168 L 155 170 C 158 171 157 175 154 175 L 140 172 Z" fill="#0f172a"/>

      <!-- Torso (Lean forward for speed) -->
      <path d="M 100 95 L 130 100 L 125 140 L 95 135 Z" fill="#3b82f6" rx="4"/>
      <!-- Jacket / Shirt lapel detail -->
      <path d="M 112 98 L 122 125 L 115 135" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="118" cy="112" r="1.5" fill="#fbbf24"/>
      <circle cx="116" cy="122" r="1.5" fill="#fbbf24"/>

      <!-- Backpack / Straps -->
      <path d="M 100 98 C 90 100 85 115 90 130" stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 92 102 L 105 115" stroke="#1e293b" stroke-width="3"/>

      <!-- Head & Hair (Dynamic wind-blown hair) -->
      <g transform="translate(115, 75)">
        <!-- Face Profile -->
        <circle cx="10" cy="5" r="13" fill="#fed7aa"/>
        <!-- Expressive wide eye / hurried look -->
        <circle cx="16" cy="2" r="2.5" fill="#0f172a"/>
        <path d="M 18 -3 Q 20 -5 22 -3" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/> <!-- Surprised eyebrow -->
        <!-- Mouth (O-shape gasp/hurry) -->
        <ellipse cx="20" cy="9" rx="2" ry="3" fill="#991b1b"/>
        <!-- Hair blown back -->
        <path d="M 3 -8 C 10 -15 22 -10 25 -5 C 20 -4 15 -7 3 -8 Z" fill="#334155"/>
        <path d="M 0 -2 C -5 -6 -2 -10 5 -8 Z" fill="#334155"/>
      </g>

      <!-- Arms (Dynamic swinging action) -->
      <!-- Back Arm reaching back -->
      <path d="M 110 105 L 90 120 L 75 115" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="75" cy="115" r="4" fill="#fed7aa"/> <!-- Hand -->

      <!-- Front Arm swinging forward holding briefcase -->
      <path d="M 125 105 L 145 115 L 155 135" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Hand -->
      <circle cx="155" cy="135" r="4" fill="#fed7aa"/>

      <!-- Briefcase (Swinging vigorously) -->
      <g transform="translate(150, 130) rotate(15)">
        <rect x="0" y="0" width="28" height="20" rx="4" fill="#fb923c"/>
        <rect x="4" y="-5" width="20" height="6" rx="2" fill="none" stroke="#ea580c" stroke-width="2.5"/>
        <!-- Briefcase clasp -->
        <rect x="12" y="8" width="4" height="4" rx="1" fill="#fef08a"/>
        <!-- Motion lines on briefcase -->
        <line x1="-8" y1="5" x2="-2" y2="8" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
        <line x1="-10" y1="12" x2="-4" y2="14" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Foreground Environment Props (Adding depth & narrative) -->
    <!-- Dropped Desk / Tipped Chair to show sudden rush -->
    <g transform="translate(15, 135)">
      <!-- Chair leg pointing up -->
      <path d="M 10 35 L 25 -5" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <path d="M 18 15 L 35 10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
      <!-- Chair seat tilted -->
      <path d="M 0 30 L 20 25 L 25 35 L 5 40 Z" fill="#475569"/>
    </g>

    <!-- Exclamation / Urgency Action Sparkles -->
    <g transform="translate(160, 50)" filter="url(#glow)">
      <path d="M 0 10 L 6 0 L 12 10 L 2 16 Z" fill="#fbbf24"/>
      <circle cx="20" cy="25" r="3" fill="#f43f5e"/>
      <circle cx="-10" cy="5" r="2" fill="#38bdf8"/>
    </g>
  </g>
</svg>