<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient & Vignette -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Golden Glow for Treasure / Artifacts -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Torch Light Gradient -->
    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Jade Green Glow -->
    <radialGradient id="jadeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ancient Tomb / Study Ambient Lighting Effects -->
  <circle cx="120" cy="110" r="90" fill="url(#goldGlow)" />
  <circle cx="180" cy="70" r="60" fill="url(#torchGlow)" />
  <circle cx="70" cy="170" r="50" fill="url(#jadeGlow)" />

  <!-- BACKGROUND: Ancient Stone Wall Architecture -->
  <!-- Stone Blocks & Texture lines -->
  <path d="M 20 40 L 220 40 L 220 220 L 20 220 Z" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Back Wall Structure (Ancient Temple/Tomb Interior) -->
  <path d="M40 200 L40 90 Q120 60 200 90 L200 200 Z" fill="#111827" opacity="0.8" />
  
  <!-- Mysterious Stone Carvings (Abstract Ancient Patterns on Wall) -->
  <path d="M70 110 Q90 90 110 110 Q130 130 150 110" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M90 140 L150 140" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="120" cy="125" r="8" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <!-- Stone Pedestal / Archaeological Table -->
  <path d="M 70 170 L 170 170 L 190 210 L 50 210 Z" fill="#334155" filter="url(#shadow)" />
  <path d="M 60 165 L 180 165 L 170 170 L 70 170 Z" fill="#475569" />
  <path d="M 80 210 L 160 210 L 165 225 L 75 225 Z" fill="#1e293b" />

  <!-- MIDGROUND: Ancient Artifacts (The Core Subject Representation) -->
  
  <!-- 1. Ancient Bronze Ritual Vessel (Ding) on the left -->
  <g transform="translate(75, 135)" filter="url(#shadow)">
    <!-- Vessel Body -->
    <ellipse cx="20" cy="20" rx="16" ry="6" fill="#059669" />
    <path d="M 4 20 C 4 35, 36 35, 36 20 Z" fill="#10b981" />
    <path d="M 6 18 C 6 30, 34 30, 34 18 Z" fill="#047857" />
    <!-- Handles -->
    <path d="M 2 15 C -2 15, -2 22, 2 22" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 38 15 C 42 15, 42 22, 38 22" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M 10 32 L 6 42" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <path d="M 30 32 L 34 42" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 34 L 20 44" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 2. Ancient Scroll (Partially Unrolled, Glowing Amber/Gold) -->
  <g transform="translate(100, 150) rotate(-10)" filter="url(#shadow)">
    <!-- Scroll Handles (Wooden Rollers) -->
    <rect x="-5" y="-5" width="8" height="40" rx="3" fill="#92400e" />
    <rect x="55" y="-5" width="8" height="40" rx="3" fill="#92400e" />
    <!-- Scroll Paper (Parchment) -->
    <rect x="0" y="0" width="60" height="30" fill="#fef3c7" rx="2" />
    <!-- Fictional Ancient Calligraphy / Glyphs (Abstract lines, non-readable) -->
    <path d="M 10 8 L 22 8 M 10 15 L 18 15 M 10 22 L 25 22" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 30 8 L 45 8 M 30 15 L 40 15 M 30 22 L 48 22" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 3. Ancient Jade Bi Disc / Pendant with glowing magical ring -->
  <g transform="translate(160, 130)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#34d399" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#059669" stroke-width="3" />
    <circle cx="0" cy="0" r="7" fill="#1e293b" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#059669" stroke-width="2" />
    <!-- Decorative engraving accents -->
    <circle cx="0" cy="-12" r="1.5" fill="#065f46" />
    <circle cx="12" cy="0" r="1.5" fill="#065f46" />
    <circle cx="0" cy="12" r="1.5" fill="#065f46" />
    <circle cx="-12" cy="0" r="1.5" fill="#065f46" />
  </g>

  <!-- FOREGROUND: Archaeological Explorer / Scholar Character Props -->
  
  <!-- Magnifying Glass hovering over the scroll -->
  <g transform="translate(135, 115) rotate(25)" filter="url(#shadow)">
    <!-- Glass Rim -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="4" />
    <!-- Lens Flare / Reflection -->
    <path d="M -12 -12 Q 0 -18 12 -12" fill="none" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Handle -->
    <path d="M 15 15 L 35 35" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 15 15 L 35 35" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wall-mounted Ancient Torch (Right side) -->
  <g transform="translate(200, 95)" filter="url(#shadow)">
    <!-- Torch Bracket -->
    <path d="M 0 10 L 15 15 L 0 20 Z" fill="#64748b" />
    <rect x="-2" y="12" width="6" height="15" rx="2" fill="#475569" />
    <!-- Flame Animation Elements -->
    <path d="M 1 5 C -5 0, -2 -15, 1 -22 C 4 -15, 7 0, 1 5 Z" fill="#fbbf24" />
    <path d="M 1 0 C -2 -5, -1 -12, 1 -16 C 3 -12, 4 -5, 1 0 Z" fill="#f43f5e" />
    <circle cx="1" cy="-5" r="12" fill="url(#torchGlow)" />
  </g>

  <!-- Floating Magical / Atmospheric Dust Particles & Sparkles -->
  <circle cx="50" cy="80" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="85" cy="65" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="140" cy="50" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="190" cy="150" r="2.5" fill="#34d399" opacity="0.7"/>
  <circle cx="45" cy="140" r="2" fill="#fb923c" opacity="0.8"/>

  <!-- Sparkling Star / Rune Accents -->
  <path d="M 120 75 L 122 82 L 129 84 L 122 86 L 120 93 L 118 86 L 111 84 L 118 82 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M 60 110 L 61 114 L 65 115 L 61 116 L 60 120 L 59 116 L 55 115 L 59 114 Z" fill="#38bdf8" opacity="0.7" />

  <!-- Frame Border Overlay for App UI aesthetics -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>