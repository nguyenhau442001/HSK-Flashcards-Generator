<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Window and Moon -->
  <rect x="140" y="40" width="60" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="185" cy="65" r="8" fill="#fde68a"/>
  <rect x="140" y="80" width="60" height="2" fill="#334155"/>
  <rect x="170" y="40" width="2" height="80" fill="#334155"/>

  <!-- Desk -->
  <path d="M20 190 L220 190 L230 210 L10 210 Z" fill="#334155"/>
  
  <!-- Desk Lamp Glow -->
  <circle cx="50" cy="140" r="60" fill="url(#lampGlow)"/>
  
  <!-- Desk Lamp -->
  <path d="M40 190 L45 190 L45 150 L35 150 Z" fill="#94a3b8"/>
  <path d="M30 155 Q50 130 70 155 Z" fill="#fbbf24"/>

  <!-- Character B (The "Him") - Right side -->
  <!-- Body -->
  <path d="M160 210 Q160 150 190 150 Q220 150 220 210" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="190" cy="130" r="18" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M172 130 Q172 110 195 110 Q210 110 208 130" fill="#78350f"/>
  <!-- Face (Smiling/Friendly) -->
  <path d="M182 132 Q185 136 188 132" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="180" cy="128" r="1.5" fill="#78350f"/>
  <circle cx="192" cy="128" r="1.5" fill="#78350f"/>
  <!-- Arm offering coffee -->
  <path d="M170 175 Q145 175 140 165" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <!-- Coffee Mug -->
  <rect x="125" y="155" width="18" height="15" rx="3" fill="#f59e0b"/>
  <path d="M143 160 Q148 160 148 165 Q148 170 143 170" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <path d="M130 150 Q134 140 138 150" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>

  <!-- Character A (The "I") - Left side -->
  <!-- Body -->
  <path d="M40 210 Q40 150 75 150 Q110 150 110 210" fill="#ec4899"/>
  <!-- Head -->
  <circle cx="75" cy="130" r="18" fill="#fde68a"/>
  <!-- Hair -->
  <path d="M57 135 Q57 105 85 105 Q100 105 95 145" fill="#1e1b4b"/>
  <!-- Face (Annoyed/Skeptical) -->
  <path d="M82 135 Q85 133 88 135" fill="none" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80 128 L84 128" fill="none" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M88 128 L92 128" fill="none" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Crossed Arms -->
  <path d="M60 175 Q75 185 90 175" fill="none" stroke="#db2777" stroke-width="12" stroke-linecap="round"/>
  <path d="M90 175 Q75 185 60 175" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>

  <!-- Desk Props -->
  <rect x="65" y="185" width="40" height="5" rx="2" fill="#94a3b8"/>
  <path d="M70 185 L65 170 L105 170 L100 185" fill="#cbd5e1" opacity="0.3"/>
  
  <!-- Narrative Detail: Distance/Coldness -->
  <path d="M115 130 Q125 130 125 140" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
</svg>