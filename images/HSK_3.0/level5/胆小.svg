<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed -->
  <rect x="60" y="140" width="120" height="60" rx="8" fill="#334155"/>
  <rect x="65" y="130" width="40" height="20" rx="4" fill="#fb923c"/>
  
  <!-- The Little Brother (hiding) -->
  <g transform="translate(85, 125)">
    <circle cx="15" cy="15" r="15" fill="#fde68a"/>
    <path d="M5 15 Q 15 5 25 15" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="10" cy="12" r="2" fill="#1e293b"/>
    <circle cx="20" cy="12" r="2" fill="#1e293b"/>
    <path d="M5 25 Q 15 20 25 25" stroke="#475569" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Blanket covering him -->
  <path d="M60 140 L180 140 L170 170 L70 170 Z" fill="#64748b"/>
  
  <!-- Nightstand with lamp -->
  <rect x="180" y="150" width="40" height="50" rx="4" fill="#334155"/>
  <circle cx="200" cy="130" r="15" fill="#f59e0b" opacity="0.3"/>
  <circle cx="200" cy="130" r="8" fill="#fbbf24"/>
  
  <!-- Window with moon -->
  <rect x="30" y="40" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="60" cy="70" r="15" fill="#e2e8f0"/>
  <circle cx="65" cy="65" r="15" fill="#0f172a"/>
  
  <!-- Shadows/Atmosphere -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Toy on floor -->
  <circle cx="140" cy="210" r="8" fill="#ec4899"/>
  <circle cx="140" cy="210" r="3" fill="#fce7f3"/>
</svg>