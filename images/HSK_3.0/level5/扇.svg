<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="40" rx="8" fill="#334155"/>
  
  <!-- Character -->
  <g transform="translate(60, 60)">
    <!-- Head -->
    <circle cx="60" cy="40" r="25" fill="#fde68a"/>
    <path d="M45 40 Q45 55 60 55 Q75 55 75 40" fill="#fb923c" opacity="0.3"/>
    <!-- Eyes -->
    <circle cx="52" cy="35" r="3" fill="#0f172a"/>
    <circle cx="68" cy="35" r="3" fill="#0f172a"/>
    <!-- Mouth (Sweating/Hot) -->
    <path d="M55 48 Q60 52 65 48" stroke="#0f172a" stroke-width="2" fill="none"/>
    
    <!-- Body -->
    <path d="M30 80 Q60 70 90 80 L85 140 L35 140 Z" fill="#38bdf8"/>
    
    <!-- Arm holding book -->
    <path d="M85 90 L110 70" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    
    <!-- The Book (Fan) -->
    <rect x="105" y="30" width="40" height="50" rx="4" fill="#fbbf24" transform="rotate(20 125 55)"/>
    <line x1="105" y1="55" x2="145" y2="55" stroke="#f59e0b" stroke-width="2" transform="rotate(20 125 55)"/>
  </g>
  
  <!-- Sweat drop -->
  <path d="M140 80 Q145 90 140 95 Q135 90 140 80" fill="#38bdf8"/>
  
  <!-- Motion lines for fanning -->
  <path d="M150 40 Q170 50 150 70" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M160 30 Q180 40 160 60" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Desk items -->
  <rect x="160" y="170" width="30" height="20" rx="2" fill="#ec4899"/>
  <circle cx="40" cy="175" r="8" fill="#10b981"/>
</svg>