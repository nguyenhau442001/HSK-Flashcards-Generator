<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Mountain Path Background -->
  <path d="M0 240 L80 140 L160 180 L240 120 L240 240 Z" fill="#334155"/>
  <path d="M0 240 L60 160 L120 190 L200 150 L240 170 L240 240 Z" fill="#475569"/>
  
  <!-- The Character (The "He" in the sentence) -->
  <!-- Legs -->
  <path d="M105 180 L100 220 M125 180 L135 220" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  <!-- Body -->
  <path d="M115 130 L115 180" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
  <!-- Arms (Reaching up) -->
  <path d="M115 140 L90 120 M115 140 L140 120" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="115" cy="120" r="12" fill="#fb923c"/>
  
  <!-- The "Difficulty" (A large boulder/obstacle) -->
  <path d="M150 150 Q180 120 210 150 T230 190 T180 210 T150 150" fill="#64748b"/>
  <circle cx="170" cy="170" r="5" fill="#475569"/>
  <circle cx="200" cy="180" r="8" fill="#475569"/>
  
  <!-- The "Willpower" (Glowing aura/light) -->
  <circle cx="115" cy="120" r="25" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M115 100 L115 90 M115 140 L115 150 M95 120 L85 120 M135 120 L145 120" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Summit/Goal -->
  <circle cx="210" cy="130" r="10" fill="#10b981"/>
  <path d="M205 130 L208 133 L215 127" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="2" fill="#fbbf24"/>
  <circle cx="50" cy="30" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="50" r="2" fill="#fbbf24"/>
</svg>