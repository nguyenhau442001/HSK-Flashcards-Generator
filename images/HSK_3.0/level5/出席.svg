<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient & Ambient Glow -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="75" y="48" width="90" height="56" rx="4"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <circle cx="120" cy="90" r="100" fill="url(#amberGlow)"/>

  <!-- Background Office Environment / Meeting Room Elements -->
  <!-- Window / Wall backdrop -->
  <path d="M40 30 L200 30 L200 135 L40 135 Z" fill="#1e293b" opacity="0.4"/>
  <line x1="80" y1="30" x2="80" y2="135" stroke="#334155" stroke-width="1.5" opacity="0.3"/>
  <line x1="160" y1="30" x2="160" y2="135" stroke="#334155" stroke-width="1.5" opacity="0.3"/>

  <!-- Conference Table -->
  <ellipse cx="120" cy="140" rx="90" ry="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M30 140 C30 170 210 170 210 140 L210 152 C210 182 30 182 30 152 Z" fill="url(#deskGrad)"/>
  <ellipse cx="120" cy="140" rx="82" ry="18" fill="#1e293b"/>

  <!-- Meeting Props on Table -->
  <!-- Laptop/Monitor showing attendance -->
  <rect x="70" y="44" width="100" height="64" rx="6" fill="#475569"/>
  <rect x="75" y="48" width="90" height="56" rx="4" fill="url(#screenGrad)"/>
  <!-- Video conference participants grid on screen -->
  <g clip-path="url(#screenClip)">
    <rect x="80" y="54" width="24" height="20" rx="3" fill="#38bdf8" opacity="0.5"/>
    <circle cx="92" cy="61" r="5" fill="#bae6fd"/>
    <path d="M85 71 C85 67 99 67 99 71 Z" fill="#bae6fd"/>

    <rect x="108" y="54" width="24" height="20" rx="3" fill="#38bdf8" opacity="0.5"/>
    <circle cx="120" cy="61" r="5" fill="#bae6fd"/>
    <path d="M113 71 C113 67 127 67 127 71 Z" fill="#bae6fd"/>

    <rect x="136" y="54" width="24" height="20" rx="3" fill="#38bdf8" opacity="0.5"/>
    <circle cx="148" cy="61" r="5" fill="#bae6fd"/>
    <path d="M141 71 C141 67 155 67 155 71 Z" fill="#bae6fd"/>

    <!-- Active Speaker / Highlighted Participant -->
    <rect x="80" y="78" width="80" height="20" rx="3" fill="#10b981" opacity="0.3"/>
    <circle cx="95" cy="88" r="5" fill="#a7f3d0"/>
    <path d="M90 96 C90 92 100 92 100 96 Z" fill="#a7f3d0"/>
    <line x1="108" y1="85" x2="148" y2="85" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
    <line x1="108" y1="92" x2="135" y2="92" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Laptop Stand & Base -->
  <path d="M100 108 L140 108 L145 112 L95 112 Z" fill="#64748b"/>
  <ellipse cx="120" cy="112" rx="25" ry="3" fill="#475569"/>

  <!-- Coffee Mug -->
  <rect x="175" y="118" width="16" height="20" rx="3" fill="#f8fafc"/>
  <path d="M191 123 C196 123 196 133 191 133" stroke="#f8fafc" stroke-width="2.5" fill="none"/>
  <!-- Steam from coffee -->
  <path d="M180 112 C182 108 178 104 180 100" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Notepad & Pen -->
  <rect x="45" y="125" width="26" height="20" rx="2" transform="rotate(-10 45 125)" fill="#e2e8f0"/>
  <line x1="48" y1="130" x2="65" y2="127" stroke="#94a3b8" stroke-width="1"/>
  <line x1="47" y1="135" x2="64" y2="132" stroke="#94a3b8" stroke-width="1"/>
  <line x1="47" y1="140" x2="62" y2="137" stroke="#94a3b8" stroke-width="1"/>
  <line x1="38" y1="140" x2="52" y2="120" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Main Subject: Person Attending (Participating actively) -->
  <!-- Office Chair Backrest (Behind person) -->
  <rect x="95" y="115" width="50" height="60" rx="12" fill="url(#chairGrad)" opacity="0.8"/>
  
  <!-- Person's Body & Shoulders -->
  <path d="M85 190 C85 160 155 160 155 190 Z" fill="#3b82f6"/>
  <circle cx="120" cy="125" r="22" fill="#fed7aa"/> <!-- Head -->
  
  <!-- Hair -->
  <path d="M98 122 C98 105 142 105 142 122 C142 127 138 125 135 120 C130 110 110 110 105 120 C102 125 98 127 98 122 Z" fill="#334155"/>

  <!-- Confident Attending Pose: Raised Arm / Hand Gesturing (Active Participation) -->
  <!-- Arm 1 (Resting on desk) -->
  <path d="M90 155 L105 142 L115 150" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="115" cy="150" r="5" fill="#fed7aa"/>

  <!-- Arm 2 (Raised high, participating/answering in meeting) -->
  <path d="M150 160 L165 130 L170 100" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Hand raised -->
  <circle cx="170" cy="95" r="6" fill="#fed7aa"/>

  <!-- Face details: Happy, engaged expression -->
  <circle cx="113" cy="123" r="2" fill="#1e293b"/>
  <circle cx="127" cy="123" r="2" fill="#1e293b"/>
  <!-- Smiling mouth -->
  <path d="M117 132 C120 136 123 136 126 132" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Glowing Attendance / Checkmark Badge Element (Representing 'Attendance' / 'Present') -->
  <g transform="translate(175, 45)">
    <circle cx="16" cy="16" r="18" fill="#10b981" opacity="0.9"/>
    <circle cx="16" cy="16" r="22" fill="#34d399" opacity="0.3"/>
    <!-- Checkmark icon -->
    <path d="M9 16 L14 21 L23 10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Sparkles / Dynamic Feedback Elements -->
  <path d="M55 70 L58 78 L66 81 L58 84 L55 92 L52 84 L44 81 L52 78 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M190 170 L192 175 L197 177 L192 179 L190 184 L188 179 L183 177 L188 175 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="45" cy="55" r="3" fill="#f43f5e" opacity="0.8"/>
</svg>