<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Masks -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="pineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="pineGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <radialGradient id="fireflyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Starry Sky -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="30" cy="35" r="1"/>
    <circle cx="75" cy="20" r="1.5"/>
    <circle cx="120" cy="45" r="1"/>
    <circle cx="165" cy="25" r="1.2"/>
    <circle cx="210" cy="40" r="1.5"/>
    <circle cx="45" cy="70" r="1"/>
    <circle cx="195" cy="75" r="1"/>
  </g>

  <!-- Distant Mountains / Hills -->
  <path d="M-10 160 Q 40 100, 110 130 T 250 120 L 250 240 L -10 240 Z" fill="#0f172a"/>
  <path d="M-10 170 Q 70 120, 150 150 T 250 140 L 250 240 L -10 240 Z" fill="#1e293b" opacity="0.7"/>

  <!-- Dense Forest Background (Pine Trees Layers) -->
  <!-- Back layer dark pines -->
  <polygon points="20,160 35,120 50,160" fill="#064e3b"/>
  <polygon points="45,165 62,115 80,165" fill="#064e3b"/>
  <polygon points="160,170 180,120 200,170" fill="#064e3b"/>
  <polygon points="185,165 202,110 220,165" fill="#064e3b"/>
  
  <!-- Mid layer pines -->
  <polygon points="10,180 30,125 50,180" fill="url(#pineGrad1)"/>
  <polygon points="38,175 60,110 82,175" fill="url(#pineGrad1)"/>
  <polygon points="70,185 95,120 120,185" fill="url(#pineGrad1)"/>
  <polygon points="130,180 155,115 180,180" fill="url(#pineGrad1)"/>
  <polygon points="170,185 195,125 220,185" fill="url(#pineGrad1)"/>
  <polygon points="205,190 225,135 245,190" fill="url(#pineGrad1)"/>

  <!-- Winding Mountain Paths (Creating the maze/lost feeling) -->
  <path d="M 120 240 C 120 200, 160 180, 150 160 C 140 140, 90 150, 80 130 C 70 110, 110 90, 100 70" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <path d="M 120 240 C 120 200, 160 180, 150 160 C 140 140, 90 150, 80 130 C 70 110, 110 90, 100 70" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Fork in the path adding to confusion -->
  <path d="M 150 160 C 160 140, 190 150, 200 130" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M 80 130 C 60 110, 40 130, 25 110" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>

  <!-- Foreground Trees & Foliage -->
  <!-- Left foreground pine -->
  <polygon points="-10,220 25,140 60,220" fill="url(#pineGrad2)"/>
  <!-- Right foreground pine -->
  <polygon points="190,240 220,150 250,240" fill="url(#pineGrad2)"/>

  <!-- Wooden Direction Signpost (Confusing / Blank / Broken) -->
  <g transform="translate(100, 95)">
    <!-- Post -->
    <rect x="-4" y="0" width="8" height="65" fill="#78350f" rx="2"/>
    <rect x="-2" y="0" width="3" height="65" fill="#92400e" rx="1"/>
    
    <!-- Sign 1 (Pointing Left) -->
    <g transform="translate(0, 10) rotate(-12)">
      <polygon points="-35,0 -25,-10 35,-10 35,10 -25,10" fill="#b45309"/>
      <polygon points="-33,-2 -23,-9 33,-9 33,8 -23,8" fill="#d97706"/>
      <!-- Question Mark symbol on sign (abstract confusion, no text) -->
      <path d="M 2 -4 C 2 -7, 6 -7, 6 -4 C 6 -1, 0 0, 0 4" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="7" r="1" fill="#78350f"/>
    </g>

    <!-- Sign 2 (Pointing Right, angled differently) -->
    <g transform="translate(0, 28) rotate(18)">
      <polygon points="-35,0 -25,-10 35,-10 35,10 -25,10" fill="#b45309"/>
      <polygon points="-33,-2 -23,-9 33,-9 33,8 -23,8" fill="#d97706"/>
      <!-- Question mark or crisscross lines -->
      <line x1="-5" y1="-4" x2="5" y2="4" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="-4" x2="-5" y2="4" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Main Character (Lost Traveler with Flashlight & Backpack) -->
  <g transform="translate(135, 145)">
    <!-- Flashlight Beam (Atmospheric lighting cone) -->
    <polygon points="0,5 -55,-40 35,-70" fill="url(#beamGrad)"/>

    <!-- Backpack -->
    <rect x="-14" y="-8" width="10" height="18" rx="4" fill="#ef4444"/>
    <rect x="-16" y="-4" width="4" height="10" rx="2" fill="#b91c1c"/>

    <!-- Traveler Body / Jacket (Blue/Teal) -->
    <path d="M -8 16 L 8 16 L 10 28 L -10 28 Z" fill="#0284c7"/>
    <path d="M -6 0 L 6 0 L 8 16 L -8 16 Z" fill="#0ea5e9"/>

    <!-- Head -->
    <circle cx="0" cy="-12" r="9" fill="#fbcfe8"/>
    <!-- Confused Hair / Hoodie -->
    <path d="M -9 -14 C -10 -22, 10 -22, 9 -14 C 6 -18, -6 -18, -9 -14 Z" fill="#7c2d12"/>

    <!-- Raised Arms holding flashlight -->
    <path d="M -6 -2 L -18 -15 L -22 -12 L -10 4 Z" fill="#0ea5e9"/>
    <path d="M 6 -2 L 15 -18 L 19 -15 L 10 2" fill="#0ea5e9"/>

    <!-- Flashlight Object -->
    <g transform="translate(15, -19) rotate(-40)">
      <rect x="0" y="-3" width="10" height="6" rx="2" fill="#334155"/>
      <rect x="8" y="-4" width="5" height="8" rx="2" fill="#fbbf24"/>
    </g>

    <!-- Legs showing walking/hesitation stance -->
    <rect x="-7" y="28" width="5" height="16" rx="2.5" fill="#334155"/>
    <rect x="2" y="28" width="5" height="12" rx="2.5" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="-5" cy="44" rx="4" ry="2" fill="#1e293b"/>
    <ellipse cx="4" cy="40" rx="4" ry="2" fill="#1e293b"/>

    <!-- Sweat drop / Question mark hovering over head to show being lost -->
    <g transform="translate(4, -30)">
      <path d="M 0 -2 C -4 -7, 4 -7, 0 -2" fill="#38bdf8" opacity="0.8"/>
      <circle cx="0" cy="2" r="1" fill="#38bdf8"/>
    </g>
    <!-- Sweat drop -->
    <path d="M 11 -18 C 11 -18, 14 -14, 14 -11 C 14 -9.3, 12.7 -8, 11 -8 C 9.3 -8, 8 -9.3, 8 -11 C 8 -14, 11 -18, 11 -18 Z" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Atmospheric Fireflies / Magic Spores enhancing mystery -->
  <g>
    <circle cx="55" cy="110" r="2.5" fill="url(#fireflyGlow)"/>
    <circle cx="95" cy="80" r="3" fill="url(#fireflyGlow)"/>
    <circle cx="170" cy="95" r="2" fill="url(#fireflyGlow)"/>
    <circle cx="120" cy="170" r="2.5" fill="url(#fireflyGlow)"/>
    <circle cx="40" cy="160" r="1.5" fill="url(#fireflyGlow)"/>
  </g>

  <!-- Foreground shadow vignettes for depth -->
  <path d="M 0 220 Q 120 200, 240 220 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.6"/>

  <!-- Subtle border frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.3"/>
</svg>