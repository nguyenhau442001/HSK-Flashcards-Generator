<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Bookshelf Background -->
  <rect x="30" y="40" width="180" height="120" rx="4" fill="#334155"/>
  <rect x="40" y="60" width="160" height="10" fill="#475569"/>
  <rect x="40" y="110" width="160" height="10" fill="#475569"/>
  
  <!-- The Famous Book -->
  <rect x="120" y="75" width="40" height="55" rx="2" fill="#fb923c"/>
  <path d="M120 75h40v55h-40z" fill="#f59e0b" opacity="0.2"/>
  <rect x="125" y="85" width="30" height="4" fill="#1e293b"/>
  <rect x="125" y="95" width="30" height="4" fill="#1e293b"/>
  <rect x="125" y="105" width="20" height="4" fill="#1e293b"/>
  
  <!-- Character: Person pointing at the book -->
  <g transform="translate(40, 130)">
    <circle cx="40" cy="30" r="15" fill="#f8fafc"/>
    <path d="M25 45h30v40h-30z" fill="#38bdf8"/>
    <path d="M30 85h5v20h-5z" fill="#38bdf8"/>
    <path d="M45 85h5v20h-5z" fill="#38bdf8"/>
    <path d="M55 55l25-10" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <circle cx="85" cy="40" r="6" fill="#f8fafc"/>
  </g>
  
  <!-- Speech Bubble (Visual representation of "This sentence") -->
  <path d="M110 50l-20-20h-40a10 10 0 0 0-10 10v30a10 10 0 0 0 10 10h30l10 10z" fill="#ec4899"/>
  <circle cx="70" cy="50" r="3" fill="#fff"/>
  <circle cx="80" cy="50" r="3" fill="#fff"/>
  <circle cx="90" cy="50" r="3" fill="#fff"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="180" r="20" fill="#10b981" opacity="0.3"/>
  <circle cx="210" cy="190" r="10" fill="#10b981" opacity="0.5"/>
</svg>