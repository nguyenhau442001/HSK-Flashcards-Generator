<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="glow-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#090d16" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <circle cx="120" cy="120" r="100" fill="url(#glow-grad)" />

  <!-- Stadium / Match Context Elements (Background) -->
  <path d="M40 190 L200 190 L210 210 L30 210 Z" fill="#334155" opacity="0.6" />
  <ellipse cx="120" cy="190" rx="80" ry="15" fill="#1e293b" />
  
  <!-- Goal posts / Pitch lines representing a "match" (Trận đấu) -->
  <path d="M70 190 L85 140 L155 140 L170 190" fill="none" stroke="#64748b" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="90" y1="190" x2="150" y2="190" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Action Elements: Soccer Ball & Referee Whistle representing "Trận đấu" -->
  <circle cx="85" cy="175" r="14" fill="#f8fafc" filter="url(#drop-shadow)" />
  <!-- Soccer ball pattern simplified -->
  <path d="M85 165 L90 172 L85 178 L80 172 Z" fill="#0f172a" />
  <path d="M75 175 L80 172 L85 185 L73 183 Z" fill="#0f172a" opacity="0.8"/>

  <!-- MAIN SUBJECT: The Scale of Justice / Fairness (Cân công bằng) -->
  <g filter="url(#drop-shadow)">
    <!-- Scale Base / Stand -->
    <path d="M100 200 L140 200 L135 185 L105 185 Z" fill="#cbd5e1" />
    <rect x="114" y="95" width="12" height="95" rx="4" fill="#94a3b8" />
    <!-- Center Top Finial / Ring -->
    <circle cx="120" cy="90" r="8" fill="#fbbf24" />
    <path d="M120 75 L120 98" stroke="#cbd5e1" stroke-width="4" />

    <!-- Beam -->
    <path d="M70 95 L170 95 L175 102 L65 102 Z" fill="#fbbf24" rx="2" />
    <circle cx="120" cy="98" r="5" fill="#d97706" />

    <!-- Left Chain & Pan (Balanced perfectly) -->
    <path d="M75 102 L70 135" stroke="#94a3b8" stroke-width="2.5" />
    <path d="M75 102 L95 135" stroke="#94a3b8" stroke-width="2.5" />
    <path d="M75 102 L82 135" stroke="#94a3b8" stroke-width="2" />
    
    <path d="M55 135 C55 150, 105 150, 105 135 Z" fill="#f59e0b" />
    <ellipse cx="80" cy="135" rx="25" ry="6" fill="#fbbf24" />

    <!-- Right Chain & Pan (Balanced perfectly) -->
    <path d="M165 102 L150 135" stroke="#94a3b8" stroke-width="2.5" />
    <path d="M165 102 L170 135" stroke="#94a3b8" stroke-width="2.5" />
    <path d="M165 102 L158 135" stroke="#94a3b8" stroke-width="2" />

    <path d="M135 135 C135 150, 185 150, 185 135 Z" fill="#f59e0b" />
    <ellipse cx="160" cy="135" rx="25" ry="6" fill="#fbbf24" />
  </g>

  <!-- Equal weight objects on the pans representing absolute fairness -->
  <!-- Left item: Star token -->
  <path d="M80 120 L83 126 L90 127 L85 132 L86 138 L80 135 L74 138 L75 132 L70 127 L77 126 Z" fill="#38bdf8" />
  <!-- Right item: Equal star token -->
  <path d="M160 120 L163 126 L170 127 L165 132 L166 138 L160 135 L154 138 L155 132 L150 127 L157 126 Z" fill="#38bdf8" />

  <!-- Atmospheric Lighting & Sparks (Action/Energy accents) -->
  <circle cx="120" cy="65" r="3" fill="#fbbf24" opacity="0.8" />
  <path d="M120 58 L122 63 L127 65 L122 67 L120 72 L118 67 L113 65 L118 63 Z" fill="#fbbf24" />
  
  <circle cx="50" cy="80" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="190" cy="70" r="2.5" fill="#10b981" opacity="0.8" />
  <circle cx="195" cy="160" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="45" cy="150" r="1.5" fill="#38bdf8" opacity="0.7" />

  <!-- Dynamic floating checkmark accent symbolizing correctness/fairness -->
  <g transform="translate(145, 55) scale(0.8)" filter="url(#drop-shadow)">
    <circle cx="15" cy="15" r="15" fill="#10b981" />
    <path d="M9 15 L13 19 L21 10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>