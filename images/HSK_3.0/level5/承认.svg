<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Character (The person admitting) -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M20 120 C20 90, 40 80, 60 80 C80 80, 100 90, 100 120 L100 160 L20 160 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="60" r="30" fill="#fde68a"/>
    <!-- Expression: Looking down, slightly embarrassed/admitting -->
    <path d="M50 55 Q55 50 60 55" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M70 55 Q75 50 80 55" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M55 75 Q60 70 65 75" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- The "Mistake" Object (A broken vase piece/clutter) -->
  <g transform="translate(150, 160)">
    <path d="M0 0 L20 -30 L40 0 Z" fill="#fb923c"/>
    <circle cx="20" cy="-10" r="5" fill="#ec4899"/>
  </g>
  
  <!-- Atmospheric Glow/Emphasis -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
  
  <!-- Hand gesture of admission -->
  <path d="M100 130 L120 110" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="125" cy="105" r="8" fill="#fde68a"/>
</svg>