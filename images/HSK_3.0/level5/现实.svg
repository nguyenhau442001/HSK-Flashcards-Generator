<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Outside Cityscape Gradient -->
    <linearGradient id="cityGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background Walls & Floor -->
  <path d="M0 0 H240 V180 H0 Z" fill="#1e293b" />
  <!-- Floor -->
  <path d="M0 180 H240 V240 H0 Z" fill="#0f172a" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Window Frame looking out at the "Real World" / Cityscape -->
  <g transform="translate(140, 30)">
    <!-- Window Outer Frame -->
    <rect x="0" y="0" width="70" height="110" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <!-- Window Glass & City -->
    <rect x="3" y="3" width="64" height="104" fill="url(#cityGrad)" />
    <!-- City Buildings silhouettes -->
    <path d="M8 70 V107 H20 V85 H28 V107 H40 V60 H50 V107 H62 V75 H65 V107 Z" fill="#1e1b4b" />
    <!-- Distant Lights in City -->
    <rect x="11" y="90" width="3" height="3" fill="#fbbf24" opacity="0.8" />
    <rect x="33" y="70" width="3" height="3" fill="#38bdf8" opacity="0.8" />
    <rect x="44" y="80" width="3" height="4" fill="#fbbf24" opacity="0.6" />
    <!-- Window Crossbars -->
    <line x1="35" y1="3" x2="35" y2="107" stroke="#475569" stroke-width="2" />
    <line x1="3" y1="55" x2="67" y2="55" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Office Desk -->
  <!-- Desk Top -->
  <polygon points="10,185 145,185 160,205 0,205" fill="#334155" />
  <polygon points="10,180 145,180 145,185 10,185" fill="#64748b" />
  <!-- Desk Legs -->
  <rect x="25" y="205" width="8" height="35" fill="#1e293b" />
  <rect x="125" y="205" width="8" height="35" fill="#1e293b" />

  <!-- Props on Desk: Stack of Unpaid Bills / Red Ink Budget Reports (The Reality) -->
  <g transform="translate(85, 160)">
    <!-- Paper stack -->
    <rect x="0" y="15" width="35" height="6" rx="1" fill="#cbd5e1" />
    <rect x="2" y="10" width="33" height="6" rx="1" fill="#e2e8f0" />
    <rect x="1" y="5" width="34" height="6" rx="1" fill="#f8fafc" />
    <!-- Red warning charts / graph lines on paper -->
    <path d="M 6 13 L 12 9 L 18 14 L 28 8" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Coffee Mug -->
    <rect x="45" y="5" width="14" height="16" rx="3" fill="#38bdf8" />
    <path d="M59 8 H62 C64 8 64 15 62 15 H59" fill="none" stroke="#38bdf8" stroke-width="2" />
    <!-- Steam -->
    <path d="M50 0 C50 -3 53 -3 53 -6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Character: Frustrated/Determined Person Facing Reality -->
  <!-- Chair Back -->
  <rect x="35" y="90" width="22" height="95" rx="6" fill="#475569" />
  <rect x="40" y="100" width="12" height="75" rx="4" fill="#334155" />

  <g transform="translate(30, 85)">
    <!-- Body / Torso (leaning slightly forward, confronting) -->
    <path d="M15 45 C15 30 35 25 45 45 L55 95 H15 Z" fill="#0284c7" />
    <!-- Collar / Shirt details -->
    <path d="M30 45 L37 55 L44 45" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />

    <!-- Head & Hair -->
    <!-- Neck -->
    <rect x="32" y="18" width="10" height="15" fill="#fbcfe8" />
    <!-- Head Circle -->
    <circle cx="37" cy="15" r="16" fill="#fbcfe8" />
    <!-- Hair Style (Modern short neat hair) -->
    <path d="M21 15 C21 5 32 2 45 6 C51 8 53 15 53 15 C53 15 50 8 43 7 C33 5 25 9 21 15 Z" fill="#334155" />

    <!-- Face Expression: Serious, determined, eyes wide facing forward -->
    <!-- Eyebrows (tilted down for resolute expression) -->
    <line x1="28" y1="11" x2="35" y2="13" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="39" y1="13" x2="46" y2="11" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="31" cy="16" r="2" fill="#1e293b" />
    <circle cx="43" cy="16" r="2" fill="#1e293b" />
    <!-- Determined Mouth (firm straight line) -->
    <line x1="34" y1="22" x2="40" y2="22" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Arms resting determinedly on desk -->
    <!-- Back Arm / Shoulder -->
    <path d="M18 48 Q 25 70 40 75" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <!-- Front Arm pressing forward -->
    <path d="M45 45 Q 55 65 75 75" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <!-- Hand clenched / flat on desk -->
    <circle cx="77" cy="74" r="5" fill="#fbcfe8" />
  </g>

  <!-- Desk Lamp casting warm light over the scene -->
  <g transform="translate(15, 60)">
    <!-- Lamp Base -->
    <ellipse cx="15" cy="120" rx="12" ry="4" fill="#64748b" />
    <!-- Lamp Stand/Arm -->
    <path d="M15 120 V50 L35 40" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp Shade -->
    <path d="M25 33 L45 33 L40 45 L30 45 Z" fill="#fbbf24" />
    <!-- Light Cone / Glow over the desk & documents -->
    <path d="M35 45 L-20 185 H100 Z" fill="url(#lampGlow)" />
  </g>

  <!-- Wall Decor: Simple modern clock ticking away time -->
  <g transform="translate(70, 40)">
    <circle cx="0" cy="0" r="12" fill="#334155" stroke="#64748b" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="5" y2="2" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
    <!-- Clock ticks -->
    <circle cx="0" cy="-9" r="1" fill="#94a3b8" />
    <circle cx="9" cy="0" r="1" fill="#94a3b8" />
    <circle cx="0" cy="9" r="1" fill="#94a3b8" />
    <circle cx="-9" cy="0" r="1" fill="#94a3b8" />
  </g>
</svg>