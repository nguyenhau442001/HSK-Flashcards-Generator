<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm Golden Light / Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Character & Prop Gradients -->
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="speakerSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>
  
  <!-- Atmospheric Spotlight -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Layer: Vast Crowd Layers (Đông đảo / 广大) -->
  <g opacity="0.6">
    <!-- Back row of people (minimal silhouettes & warm glowing dots) -->
    <circle cx="50" cy="115" r="5" fill="#475569"/>
    <circle cx="70" cy="112" r="6" fill="#64748b"/>
    <circle cx="90" cy="116" r="5" fill="#475569"/>
    <circle cx="110" cy="110" r="7" fill="#94a3b8"/>
    <circle cx="130" cy="113" r="6" fill="#64748b"/>
    <circle cx="150" cy="111" r="5" fill="#475569"/>
    <circle cx="170" cy="115" r="6" fill="#64748b"/>
    <circle cx="190" cy="112" r="5" fill="#475569"/>
    
    <path d="M 40 135 Q 50 120 60 135 Z" fill="#334155"/>
    <path d="M 65 135 Q 75 118 85 135 Z" fill="#475569"/>
    <path d="M 95 135 Q 105 116 115 135 Z" fill="#64748b"/>
    <path d="M 125 135 Q 135 118 145 135 Z" fill="#475569"/>
    <path d="M 155 135 Q 165 120 175 135 Z" fill="#334155"/>
    <path d="M 180 135 Q 190 119 200 135 Z" fill="#475569"/>
  </g>

  <!-- Mid-ground Crowd (Dense, vibrant, diverse colors) -->
  <g filter="url(#softShadow)">
    <!-- Row 2 -->
    <circle cx="35" cy="138" r="8" fill="#fb923c"/>
    <rect x="27" y="146" width="16" height="20" rx="4" fill="#c2410c"/>

    <circle cx="60" cy="135" r="9" fill="#38bdf8"/>
    <rect x="50" y="144" width="20" height="22" rx="4" fill="#0369a1"/>

    <circle cx="85" cy="133" r="10" fill="#ec4899"/>
    <rect x="73" y="143" width="24" height="24" rx="5" fill="#be185d"/>

    <circle cx="115" cy="132" r="10" fill="#10b981"/>
    <rect x="103" y="142" width="24" height="25" rx="5" fill="#047857"/>

    <circle cx="145" cy="134" r="9" fill="#fbbf24"/>
    <rect x="135" y="143" width="20" height="22" rx="4" fill="#b45309"/>

    <circle cx="175" cy="136" r="9" fill="#38bdf8"/>
    <rect x="165" y="145" width="20" height="22" rx="4" fill="#0284c7"/>

    <circle cx="205" cy="139" r="8" fill="#a855f7"/>
    <rect x="197" y="147" width="16" height="20" rx="4" fill="#7e22ce"/>
  </g>

  <!-- Foreground Crowd & Atmospheric Glows (Rộng lớn, đông đảo feeling) -->
  <g>
    <!-- Row 1 (Closest, rich detail) -->
    <g>
      <circle cx="20" cy="165" r="11" fill="#f43f5e"/>
      <path d="M 8 190 C 8 178 14 176 20 176 C 26 176 32 178 32 190 Z" fill="#9f1239"/>
      <!-- Uplifted arm cheering -->
      <path d="M 28 178 L 36 166" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g>
      <circle cx="55" cy="160" r="12" fill="#fbbf24"/>
      <path d="M 41 188 C 41 174 48 172 55 172 C 62 172 69 174 69 188 Z" fill="#b45309"/>
      <path d="M 46 173 L 40 162" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
      <path d="M 64 173 L 70 162" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g>
      <circle cx="95" cy="158" r="13" fill="#38bdf8"/>
      <path d="M 80 186 C 80 172 87 170 95 170 C 103 170 110 172 110 186 Z" fill="#0369a1"/>
      <path d="M 88 172 L 84 158" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g>
      <circle cx="145" cy="158" r="13" fill="#10b981"/>
      <path d="M 130 186 C 130 172 137 170 145 170 C 153 170 160 172 160 186 Z" fill="#047857"/>
      <path d="M 152 172 L 158 158" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g>
      <circle cx="185" cy="160" r="12" fill="#ec4899"/>
      <path d="M 171 188 C 171 174 178 172 185 172 C 192 172 199 174 199 188 Z" fill="#be185d"/>
      <path d="M 194 173 L 202 162" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g>
      <circle cx="220" cy="165" r="11" fill="#818cf8"/>
      <path d="M 208 190 C 208 178 214 176 220 176 C 226 176 232 178 232 190 Z" fill="#4338ca"/>
    </g>
  </g>

  <!-- Stage Platform & Main Speaker / Focal Point -->
  <g>
    <!-- Stage Base -->
    <path d="M 70 190 L 170 190 L 190 220 L 50 220 Z" fill="url(#stageGrad)" filter="url(#softShadow)"/>
    <path d="M 50 220 L 190 220 L 190 226 L 50 226 Z" fill="#0f172a"/>
    <!-- Glowing Stage Strip Accent -->
    <path d="M 73 194 L 167 194" stroke="url(#accentGlow)" stroke-width="3" stroke-linecap="round"/>

    <!-- Central Speaker / Leader (Representing the focal point addressing the '广大' audience) -->
    <g transform="translate(120, 168)">
      <!-- Body / Suit -->
      <path d="M -12 22 L 12 22 L 15 0 L -15 0 Z" fill="url(#speakerSuit)"/>
      <!-- Head -->
      <circle cx="0" cy="-10" r="11" fill="#fde047"/>
      <!-- Hair -->
      <path d="M -11 -12 Q 0 -22 11 -12 Q 0 -17 -11 -12 Z" fill="#ca8a04"/>
      <!-- Energetic Gesture: Arms raised holding a presentation pointer/mic or waving -->
      <path d="M -10 5 L -22 -5" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <path d="M 10 5 L 22 -2" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <!-- Spark / Energy icon above speaker -->
      <path d="M 0 -28 L 3 -35 L 10 -38 L 3 -41 L 0 -48 L -3 -41 L -10 -38 L -3 -35 Z" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Ambient Floating Celebration Particles (Amplifying scale and vibrancy) -->
  <g opacity="0.8">
    <circle cx="45" cy="70" r="3" fill="#38bdf8"/>
    <circle cx="30" cy="95" r="2" fill="#fbbf24"/>
    <circle cx="75" cy="55" r="2.5" fill="#ec4899"/>
    <circle cx="105" cy="45" r="3.5" fill="#10b981"/>
    <circle cx="140" cy="50" r="2" fill="#fb923c"/>
    <circle cx="170" cy="75" r="3" fill="#38bdf8"/>
    <circle cx="195" cy="60" r="2.5" fill="#f43f5e"/>
    <circle cx="210" cy="95" r="3" fill="#fbbf24"/>
    
    <!-- Tiny sparkle stars -->
    <path d="M 60 85 L 62 90 L 67 92 L 62 94 L 60 99 L 58 94 L 53 92 L 58 90 Z" fill="#ffffff" opacity="0.6"/>
    <path d="M 180 90 L 181.5 94 L 185 95.5 L 181.5 97 L 180 101 L 178.5 97 L 175 95.5 L 178.5 94 Z" fill="#ffffff" opacity="0.7"/>
    <path d="M 120 70 L 121 73 L 124 74 L 121 75 L 120 78 L 119 75 L 116 74 L 119 73 Z" fill="#fde047" opacity="0.8"/>
  </g>

  <!-- Outer Border Frame matching HSK app aesthetic -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>