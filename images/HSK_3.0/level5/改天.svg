<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Office Desk -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="30" y="150" width="10" height="80" rx="2" fill="#475569"/>
  <rect x="200" y="150" width="10" height="80" rx="2" fill="#475569"/>
  
  <!-- Laptop -->
  <path d="M70 140 L170 140 L160 100 L80 100 Z" fill="#64748b"/>
  <rect x="85" y="105" width="70" height="30" fill="#0f172a"/>
  <rect x="105" y="137" width="30" height="3" fill="#94a3b8"/>
  
  <!-- Character 1 (Busy) -->
  <circle cx="60" cy="90" r="15" fill="#fde68a"/>
  <path d="M50 95 Q60 105 70 95" stroke="#475569" stroke-width="2" fill="none"/>
  <rect x="45" y="110" width="30" height="50" rx="5" fill="#fb923c"/>
  <rect x="35" y="110" width="15" height="10" rx="2" fill="#fb923c"/>
  <rect x="75" y="110" width="15" height="10" rx="2" fill="#fb923c"/>
  
  <!-- Character 2 (Leaving/Waving) -->
  <circle cx="180" cy="90" r="15" fill="#fde68a"/>
  <path d="M170 95 Q180 105 190 95" stroke="#475569" stroke-width="2" fill="none"/>
  <rect x="165" y="110" width="30" height="50" rx="5" fill="#38bdf8"/>
  <path d="M195 120 L210 100" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Clock on wall -->
  <circle cx="200" cy="40" r="15" fill="#334155"/>
  <line x1="200" y1="40" x2="200" y2="30" stroke="#fbbf24" stroke-width="2"/>
  <line x1="200" y1="40" x2="210" y2="40" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Papers/Clutter -->
  <rect x="140" y="125" width="20" height="10" rx="1" fill="#e2e8f0"/>
  <rect x="145" y="120" width="20" height="10" rx="1" fill="#e2e8f0"/>
  
  <!-- Ambient light -->
  <circle cx="120" cy="60" r="60" fill="#f59e0b" opacity="0.05"/>
</svg>