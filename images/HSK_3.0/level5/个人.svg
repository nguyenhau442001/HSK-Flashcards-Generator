<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Desk / Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" fill="url(#spotlight)" />

  <!-- Ambient Background Details: Cozy Creative Workspace -->
  <!-- Floating architectural/design notes in background -->
  <g opacity="0.25">
    <circle cx="50" cy="60" r="12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M 180,40 L 200,60 M 200,40 L 180,60" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <rect x="35" y="110" width="18" height="18" rx="4" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 190,110 Q 205,100 215,120" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bookshelf / Wall Line -->
  <line x1="30" y1="45" x2="210" y2="45" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Mini decorative plant on shelf -->
  <path d="M 185,45 Q 185,32 195,32 Q 205,32 205,45 Z" fill="#10b981" />
  <path d="M 195,32 Q 192,20 185,15" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M 195,32 Q 200,22 210,18" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M 195,32 L 195,25" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <rect x="190" y="45" width="10" height="8" rx="2" fill="#cbd5e1" />

  <!-- Coffee Mug -->
  <g transform="translate(165, 132)">
    <rect x="0" y="5" width="14" height="16" rx="3" fill="#ec4899" />
    <path d="M 14,8 C 19,8 19,16 14,16" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 4,0 Q 6,-4 4,-8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 10,-2 Q 8,-6 10,-10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 15,160 L 225,160 L 235,210 L 5,210 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <line x1="15" y1="160" x2="225" y2="160" stroke="#475569" stroke-width="2" />

  <!-- MAIN SUBJECT: The Personal Workspace & Creative Identity (Representing 'Cá nhân') -->
  <!-- Laptop Base -->
  <path d="M 70,160 L 170,160 L 185,172 L 55,172 Z" fill="#94a3b8" />
  <path d="M 50,172 L 190,172 L 190,175 L 50,175 Z" fill="#64748b" rx="2"/>
  <rect x="105" y="165" width="30" height="4" rx="2" fill="#cbd5e1" />

  <!-- Laptop Screen Frame -->
  <rect x="75" y="90" width="90" height="72" rx="6" fill="#334155" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <!-- Screen Interior -->
  <rect x="80" y="95" width="80" height="62" rx="3" fill="#0f172a" />
  <circle cx="120" cy="98" r="1.5" fill="#64748b" />

  <!-- UI on Screen: Personal Profile & Unique Customization (Visualizing 'Personal/Individual') -->
  <rect x="80" y="95" width="80" height="62" fill="url(#screenGlow)" opacity="0.5"/>
  
  <!-- Avatar / User Profile Icon inside Screen -->
  <circle cx="120" cy="116" r="10" fill="#f59e0b" />
  <path d="M 108,137 C 108,128 113,128 120,128 C 127,128 132,128 132,137 Z" fill="#f59e0b" />
  
  <!-- UI elements representing personal dashboard/ideas -->
  <rect x="90" y="142" width="20" height="4" rx="2" fill="#38bdf8" />
  <rect x="115" y="142" width="35" height="4" rx="2" fill="#334155" />
  
  <!-- Floating Idea Lightbulb Burst (Highlighting individual perspective/opinion) -->
  <g transform="translate(120, 62)" filter="url(#shadow)">
    <!-- Glow behind bulb -->
    <circle cx="0" cy="0" r="16" fill="#fbbf24" opacity="0.3" />
    <!-- Light Rays -->
    <path d="M 0,-16 L 0,-21" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -11,-11 L -15,-15" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 11,-11 L 15,-15" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -16,0 L -21,0" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 16,0 L 21,0" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Bulb Body -->
    <path d="M -7, -2 C -10, -7 -5, -12 0, -12 C 5, -12 10, -7 7, -2 C 6, 2 4, 4 4, 7 L -4, 7 C -4, 4 -6, 2 -7, -2 Z" fill="#fbbf24" />
    <rect x="-3" y="7" width="6" height="4" rx="1" fill="#94a3b8" />
    <path d="M -2, 11 L 2, 11 L 1, 14 L -1, 14 Z" fill="#64748b" />
  </g>

  <!-- Foreground Props: Personal Journal / Diary (Physical tangible context) -->
  <g transform="translate(30, 145) rotate(-8)" filter="url(#shadow)">
    <!-- Notebook Cover -->
    <rect x="0" y="0" width="38" height="45" rx="4" fill="#38bdf8" />
    <!-- Pages side -->
    <rect x="3" y="3" width="35" height="41" rx="2" fill="#f8fafc" />
    <!-- Bookmark ribbon hanging out -->
    <path d="M 10,44 L 10,52 L 14,48 L 18,52 L 18,44 Z" fill="#ec4899" />
    <!-- Sketch lines on book -->
    <line x1="8" y1="10" x2="30" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="25" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="26" x2="28" y2="26" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Pencil -->
    <g transform="translate(26, -10) rotate(45)">
      <polygon points="0,0 6,0 3,-8" fill="#fbbf24" />
      <rect x="0" y="0" width="6" height="20" fill="#f97316" />
      <rect x="0" y="20" width="6" height="4" fill="#cbd5e1" />
      <rect x="0" y="24" width="6" height="3" fill="#ec4899" />
      <polygon points="3,-8 1,-2 5,-2" fill="#334155" />
    </g>
  </g>

  <!-- Small Personalized Sticky Notes / Inspiration Cards on Desk -->
  <g transform="translate(175, 140) rotate(12)" filter="url(#shadow)">
    <rect x="0" y="0" width="24" height="24" rx="2" fill="#fef08a" />
    <!-- Tiny heart doodle representing personal passion/voice -->
    <path d="M 12,8 C 10,5 6,6 6,9 C 6,13 12,17 12,17 C 12,17 18,13 18,9 C 18,6 14,5 12,8 Z" fill="#ec4899" opacity="0.8"/>
  </g>

  <!-- Ambient Floating Sparkles / Particles for Energy -->
  <circle cx="35" cy="85" r="2.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="205" cy="105" r="2" fill="#ec4899" opacity="0.8" />
  <circle cx="135" cy="35" r="2" fill="#fbbf24" opacity="0.7" />
  <circle cx="25" cy="130" r="1.5" fill="#10b981" opacity="0.5" />
</svg>