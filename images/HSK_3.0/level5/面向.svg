<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="40" y="150" width="160" height="15" rx="4" fill="#334155"/>
  <rect x="50" y="165" width="10" height="40" fill="#475569"/>
  <rect x="180" y="165" width="10" height="40" fill="#475569"/>
  
  <!-- Laptop Screen -->
  <rect x="70" y="80" width="100" height="70" rx="6" fill="#f1f5f9"/>
  <rect x="75" y="85" width="90" height="50" rx="2" fill="#0f172a"/>
  
  <!-- Screen Content (Abstract shapes representing beginner learning) -->
  <circle cx="95" cy="100" r="8" fill="#fbbf24"/>
  <rect x="115" y="95" width="30" height="10" rx="2" fill="#38bdf8"/>
  <rect x="115" y="110" width="40" height="10" rx="2" fill="#ec4899"/>
  
  <!-- Character: Teacher/Presenter -->
  <g transform="translate(160, 110)">
    <circle cx="0" cy="0" r="18" fill="#fb923c"/>
    <path d="M-8 -5 a 8 8 0 0 1 16 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="-5" cy="-5" r="2" fill="#0f172a"/>
    <circle cx="5" cy="-5" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Character: Student (Beginner) -->
  <g transform="translate(80, 160)">
    <circle cx="0" cy="0" r="22" fill="#10b981"/>
    <path d="M-10 5 a 10 10 0 0 0 20 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="-6" cy="-5" r="3" fill="#0f172a"/>
    <circle cx="6" cy="-5" r="3" fill="#0f172a"/>
    <rect x="-15" y="20" width="30" height="40" rx="5" fill="#10b981"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="50" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="30" cy="60" r="6" fill="#38bdf8" opacity="0.4"/>
  <path d="M190 180 L210 180 L200 160 Z" fill="#fb923c" opacity="0.3"/>
</svg>