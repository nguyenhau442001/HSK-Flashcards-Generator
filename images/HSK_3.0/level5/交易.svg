<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: City Alley -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#1e293b" opacity="0.5"/>
  <path d="M40 80 L100 80 L100 240 L40 240 Z" fill="#334155"/>
  <path d="M140 100 L200 100 L200 240 L140 240 Z" fill="#334155"/>
  
  <!-- The Raid Scene -->
  <!-- Police Officer -->
  <g transform="translate(140, 120)">
    <circle cx="15" cy="15" r="12" fill="#38bdf8"/>
    <path d="M5 30 L25 30 L20 70 L10 70 Z" fill="#38bdf8"/>
    <path d="M20 35 L40 45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="4" fill="#0f172a"/>
  </g>
  
  <!-- Suspects -->
  <g transform="translate(60, 140)">
    <circle cx="15" cy="15" r="10" fill="#ec4899"/>
    <path d="M5 25 L25 25 L22 60 L8 60 Z" fill="#ec4899"/>
    <path d="M10 20 L20 20" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <g transform="translate(90, 145)">
    <circle cx="15" cy="15" r="10" fill="#fb923c"/>
    <path d="M5 25 L25 25 L22 60 L8 60 Z" fill="#fb923c"/>
    <path d="M10 20 L20 20" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- The Evidence (The 'Transaction' object) -->
  <rect x="75" y="150" width="20" height="15" rx="2" fill="#f59e0b"/>
  <path d="M75 155 L95 155" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Spotlight Effect -->
  <ellipse cx="140" cy="130" rx="40" ry="80" fill="#fbbf24" opacity="0.15" transform="rotate(-20 140 130)"/>
  
  <!-- Warning Light -->
  <circle cx="20" cy="20" r="8" fill="#ef4444">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="20" r="4" fill="#fee2e2"/>
</svg>