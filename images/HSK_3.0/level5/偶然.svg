<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ground/Sidewalk -->
  <path d="M0 190 Q 120 185 240 190 L 240 240 L 0 240 Z" fill="#1e293b"/>
  
  <!-- Distant Cityscape Silhouettes -->
  <rect x="20" y="140" width="30" height="50" fill="#1e293b" opacity="0.5"/>
  <rect x="60" y="120" width="25" height="70" fill="#1e293b" opacity="0.5"/>
  <rect x="190" y="130" width="35" height="60" fill="#1e293b" opacity="0.5"/>

  <!-- Street Lamp -->
  <rect x="175" y="60" width="4" height="130" fill="#334155"/>
  <path d="M170 60 L 184 60 L 177 50 Z" fill="#475569"/>
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="177" cy="65" r="45" fill="url(#lampGlow)"/>
  <circle cx="177" cy="62" r="6" fill="#fbbf24"/>

  <!-- Rain Streaks -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.3">
    <line x1="40" y1="20" x2="35" y2="40"/>
    <line x1="100" y1="10" x2="95" y2="30"/>
    <line x1="160" y1="30" x2="155" y2="50"/>
    <line x1="220" y1="15" x2="215" y2="35"/>
    <line x1="20" y1="80" x2="15" y2="100"/>
    <line x1="80" y1="90" x2="75" y2="110"/>
    <line x1="140" y1="70" x2="135" y2="90"/>
    <line x1="200" y1="100" x2="195" y2="120"/>
  </g>

  <!-- Puddles -->
  <ellipse cx="120" cy="215" rx="30" ry="5" fill="#38bdf8" opacity="0.1"/>
  <ellipse cx="50" cy="225" rx="15" ry="3" fill="#38bdf8" opacity="0.1"/>

  <!-- Character 1 (Left - Male) -->
  <g transform="translate(75, 145)">
    <!-- Body -->
    <path d="M0 45 L 15 45 L 12 15 L 3 15 Z" fill="#38bdf8"/>
    <!-- Legs -->
    <path d="M3 45 L 2 55 L -2 55" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 45 L 13 55 L 17 55" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="7.5" cy="8" r="7" fill="#fde68a"/>
    <path d="M2 5 Q 7.5 0 13 5" fill="#334155"/> <!-- Hair -->
    <!-- Umbrella -->
    <path d="M15 25 L 15 -5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M-10 5 Q 15 -20 40 5" fill="#f59e0b"/>
    <!-- Surprise Expression (Eyes) -->
    <circle cx="5" cy="8" r="0.8" fill="#0f172a"/>
    <circle cx="10" cy="8" r="0.8" fill="#0f172a"/>
  </g>

  <!-- Character 2 (Right - Female) -->
  <g transform="translate(135, 145)">
    <!-- Body -->
    <path d="M0 45 L 15 45 L 12 15 L 3 15 Z" fill="#10b981"/>
    <!-- Legs -->
    <path d="M3 45 L 2 55 L -2 55" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 45 L 13 55 L 17 55" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="7.5" cy="8" r="7" fill="#fde68a"/>
    <path d="M1 8 Q 1 0 14 8" fill="#475569"/> <!-- Hair -->
    <!-- Hand raised in surprise -->
    <path d="M3 25 L -5 15" fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round"/>
    <!-- Bag being held -->
    <rect x="12" y="30" width="8" height="10" rx="1" fill="#ec4899"/>
    <path d="M13 30 Q 16 25 19 30" fill="none" stroke="#ec4899" stroke-width="1"/>
    <!-- Surprise Expression (Eyes) -->
    <circle cx="5" cy="8" r="0.8" fill="#0f172a"/>
    <circle cx="10" cy="8" r="0.8" fill="#0f172a"/>
  </g>

  <!-- Interaction Detail -->
  <!-- Small "spark" of recognition/surprise between them -->
  <g opacity="0.8">
    <line x1="115" y1="150" x2="125" y2="150" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="120" y1="145" x2="120" y2="155" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>