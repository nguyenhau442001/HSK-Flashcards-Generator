  <rect x="220" y="105" width="3" height="10" rx="1" fill="#ffffff" opacity="0.6"/>
  
  <!-- Main Subject: The Tooth -->
  <path d="M80 80 C80 50, 160 50, 160 80 L155 140 C155 160, 140 170, 120 170 C100 170, 85 160, 85 140 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>
  
