      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bathroom Counter Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Toothbrush -->
  <rect x="140" y="120" width="80" height="12" rx="6" fill="#fb923c" transform="rotate(-20 180 126)"/>
  <rect x="210" y="112" width="15" height="20" rx="3" fill="#38bdf8"/>
  <rect x="212" y="105" width="3" height="10" rx="1" fill="#ffffff" opacity="0.6"/>
