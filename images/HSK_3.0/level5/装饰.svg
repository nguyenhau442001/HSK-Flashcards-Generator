<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed container with rounded corners -->
  <rect width="240" height="240" rx="24" fill="#1e293b"/>

  <!-- Floor - a lighter muted blue-grey -->
  <rect x="0" y="140" width="240" height="100" fill="#334155"/>

  <!-- Back Wall - same muted blue-grey -->
  <rect x="0" y="0" width="240" height="140" fill="#334155"/>

  <!-- Sofa - a darker blue-grey -->
  <rect x="40" y="90" width="160" height="60" rx="8" fill="#475569"/>
  <!-- Sofa cushions -->
  <rect x="45" y="95" width="70" height="40" rx="4" fill="#64748b"/>
  <rect x="125" y="95" width="70" height="40" rx="4" fill="#64748b"/>
  <!-- Decorative cushions -->
  <circle cx="65" cy="95" r="12" fill="#fb923c"/>
  <circle cx="175" cy="95" r="12" fill="#ec4899"/>

  <!-- Coffee Table - a warm wood-like tone -->
  <rect x="80" y="145" width="80" height="10" rx="4" fill="#f59e0b"/>
  <rect x="85" y="155" width="70" height="5" rx="2" fill="#fbbf24"/> <!-- Table top highlight -->
  <rect x="90" y="155" width="5" height="20" fill="#f59e0b"/> <!-- Table leg 1 -->
  <rect x="145" y="155" width="5" height="20" fill="#f59e0b"/> <!-- Table leg 2 -->

  <!-- Potted Plant on table -->
  <path d="M115 130 L125 130 L120 145 L110 145 Z" fill="#78350f"/> <!-- Pot -->
  <circle cx="120" cy="125" r="8" fill="#10b981"/> <!-- Leaves 1 -->
  <circle cx="115" cy="120" r="7" fill="#10b981"/> <!-- Leaves 2 -->
  <circle cx="125" cy="120" r="7" fill="#10b981"/> <!-- Leaves 3 -->

  <!-- Wall Art - framed picture -->
  <rect x="70" y="30" width="100" height="50" rx="6" fill="#f59e0b"/> <!-- Frame -->
  <rect x="75" y="35" width="90" height="40" rx="4" fill="#64748b"/> <!-- Inner art background -->
  <!-- Abstract art elements -->
  <circle cx="95" cy="55" r="10" fill="#38bdf8"/>
  <rect x="120" y="45" width="30" height="20" rx="4" fill="#fb923c"/>

  <!-- Floor Lamp in corner -->
  <rect x="200" y="40" width="8" height="80" fill="#f59e0b"/> <!-- Lamp stand -->
  <path d="M195 35 L213 35 L209 40 L199 40 Z" fill="#fbbf24"/> <!-- Lamp shade top -->
  <path d="M199 40 L209 40 L213 60 L195 60 Z" fill="#fbbf24"/> <!-- Lamp shade body -->
  <!-- Lamp glow -->
  <circle cx="204" cy="50" r="20" fill="#fbbf24" opacity="0.3"/>

  <!-- Character - admiring the room -->
  <!-- Body -->
  <rect x="100" y="120" width="40" height="70" rx="10" fill="#38bdf8"/> <!-- Shirt/Tunic -->
  <!-- Legs -->
  <rect x="105" y="180" width="15" height="30" rx="5" fill="#64748b"/>
  <rect x="120" y="180" width="15" height="30" rx="5" fill="#64748b"/>
  <!-- Head -->
  <circle cx="120" cy="105" r="18" fill="#fcd34d"/> <!-- Skin tone -->
  <!-- Hair -->
  <path d="M100 90 C95 80, 120 75, 145 90 C145 105, 135 115, 120 115 C105 115, 95 105, 100 90 Z" fill="#78350f"/>
  <!-- Eyes -->
  <circle cx="112" cy="100" r="2" fill="#1e293b"/>
  <circle cx="128" cy="100" r="2" fill="#1e293b"/>
  <!-- Mouth (slight smile) -->
  <path d="M115 110 Q120 113, 125 110" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  <!-- Arms -->
  <rect x="90" y="130" width="15" height="40" rx="5" fill="#38bdf8"/>
  <rect x="135" y="130" width="15" height="40" rx="5" fill="#38bdf8"/>
  <!-- Hands (clasped in front, showing appreciation) -->
  <circle cx="110" cy="165" r="8" fill="#fcd34d"/>
  <circle cx="130" cy="165" r="8" fill="#fcd34d"/>
</svg>