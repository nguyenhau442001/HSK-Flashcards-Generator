<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </radialGradient>

    <!-- Warm Accent Gradient -->
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior & Architectural Details -->
  <!-- Wallpaper accent lines / shelving -->
  <line x1="0" y1="140" x2="240" y2="140" stroke="#334155" stroke-width="1.5" opacity="0.5" />
  
  <!-- Bookshelf on background wall -->
  <rect x="25" y="45" width="45" height="6" rx="2" fill="#475569" />
  <rect x="33" y="27" width="8" height="18" rx="1" fill="#38bdf8" opacity="0.8" />
  <rect x="43" y="22" width="10" height="23" rx="1" fill="#f43f5e" opacity="0.85" />
  <rect x="55" y="30" width="7" height="15" rx="1" fill="#10b981" opacity="0.9" />

  <!-- Framed Artwork on Wall (Representing Talent/Creativity) -->
  <g transform="translate(185, 30)">
    <rect x="0" y="0" width="35" height="45" rx="2" fill="#334155" />
    <rect x="4" y="4" width="27" height="37" fill="#1e293b" />
    <!-- Abstract art inside frame: mountains and sun -->
    <circle cx="17" cy="18" r="6" fill="#fbbf24" />
    <polygon points="4,35 15,18 26,35" fill="#38bdf8" opacity="0.7" />
    <polygon points="12,35 21,23 31,35" fill="#f43f5e" opacity="0.6" />
  </g>

  <!-- Window with Night Cityscape / Ambient Light -->
  <path d="M 125,25 L 165,25 L 165,85 L 125,85 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M 127,27 L 163,27 L 163,83 L 127,83 Z" fill="url(#windowLight)" />
  <!-- Tiny distant city lights -->
  <rect x="132" y="65" width="3" height="5" fill="#fbbf24" opacity="0.7" />
  <rect x="138" y="55" width="2" height="8" fill="#38bdf8" opacity="0.8" />
  <rect x="147" y="60" width="4" height="12" fill="#f43f5e" opacity="0.6" />
  <rect x="155" y="50" width="3" height="18" fill="#fbbf24" opacity="0.5" />
  <!-- Window Frame Divider -->
  <line x1="145" y1="25" x2="145" y2="85" stroke="#334155" stroke-width="2" />

  <!-- Houseplant for warm, lived-in feel -->
  <g transform="translate(195, 100)">
    <path d="M 10,40 L 20,40 L 17,20 L 13,20 Z" fill="#64748b" />
    <!-- Leaves -->
    <path d="M 15,20 C 15,5 2,5 5,-5 C 10,-2 15,10 15,20" fill="#10b981" />
    <path d="M 15,20 C 20,2 32,5 30,-2 C 25,2 20,12 15,20" fill="#059669" />
    <path d="M 15,20 C 15,8 22,2 22,-8 C 18,0 15,10 15,20" fill="#34d399" />
  </g>

  <!-- Studio Desk Surface -->
  <path d="M 0,165 L 240,165 L 240,240 L 0,240 Z" fill="#0f172a" />
  <rect x="0" y="160" width="240" height="8" rx="2" fill="#334155" />
  <rect x="0" y="168" width="240" height="72" fill="#1e293b" />
  <!-- Desk Edge Highlight -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#64748b" stroke-width="1.5" />

  <!-- Desk Props: Laptop, Creative Sketches, Coffee Mug -->
  <!-- Laptop -->
  <path d="M 130,155 L 180,155 L 188,162 L 122,162 Z" fill="#64748b" />
  <rect x="133" y="130" width="44" height="26" rx="2" fill="#334155" />
  <rect x="136" y="133" width="38" height="20" fill="#0f172a" />
  <!-- Code/Design lines on laptop screen -->
  <line x1="139" y1="137" x2="155" y2="137" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="139" y1="142" x2="165" y2="142" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <line x1="139" y1="147" x2="148" y2="147" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />

  <!-- Coffee Mug with Steam -->
  <path d="M 195,145 C 195,142 203,142 203,145 L 202,160 C 202,162 196,162 196,160 Z" fill="#f8fafc" filter="url(#softShadow)" />
  <path d="M 203,148 C 207,148 207,155 203,155" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
  <!-- Steam wisp -->
  <path d="M 197,136 C 195,133 201,131 199,128" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Desk Lamp -->
  <path d="M 85,160 L 95,160 L 92,110 L 88,110 Z" fill="#475569" />
  <path d="M 80,105 L 100,105 L 105,115 L 75,115 Z" fill="#38bdf8" />
  <circle cx="90" cy="110" r="45" fill="url(#lampGlow)" />

  <!-- CHARACTER 2: The Creator / Artist (Sitting on the right, presenting work) -->
  <g transform="translate(130, 85)" filter="url(#softShadow)">
    <!-- Body & Torso -->
    <path d="M 30,55 C 20,55 10,65 5,85 L 55,85 C 50,65 40,55 30,55 Z" fill="#3b82f6" />
    <!-- Arm gesturing toward artwork / notebook -->
    <path d="M 15,60 C 5,68 -5,60 -10,50" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <circle cx="-12" cy="48" r="4" fill="#fcd34d" />
    
    <!-- Head & Hair -->
    <circle cx="30" cy="30" r="16" fill="#fcd34d" />
    <!-- Stylish Hair -->
    <path d="M 14,30 C 14,16 22,12 32,14 C 42,16 46,24 46,32 C 42,26 38,20 30,20 C 22,20 16,24 14,30 Z" fill="#1e293b" />
    <!-- Smiling confident expression -->
    <circle cx="26" cy="28" r="1.5" fill="#1e293b" />
    <circle cx="35" cy="28" r="1.5" fill="#1e293b" />
    <path d="M 28,35 C 30,37 33,37 35,35" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- THE CREATIVE WORK / SKETCHBOOK (Centerpiece of "Talent") -->
  <g transform="translate(95, 135)" filter="url(#softShadow)">
    <polygon points="0,10 50,0 60,25 10,35" fill="#f8fafc" />
    <polygon points="50,0 90,10 100,35 60,25" fill="#e2e8f0" />
    <!-- Colorful vector graphic drawn inside the sketchbook (representing talent) -->
    <path d="M 20,22 Q 30,5 40,22 T 60,22" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <circle cx="75" cy="18" r="5" fill="#38bdf8" />
    <!-- Glowing aura around the artwork -->
    <ellipse cx="50" cy="18" rx="35" ry="15" fill="url(#warmLight)" style="mix-blend-mode: screen;" />
  </g>

  <!-- CHARACTER 1: The Observer / Appreciator (Left, leaning in with admiration) -->
  <g transform="translate(25, 75)" filter="url(#softShadow)">
    <!-- Torso -->
    <path d="M 35,65 C 25,65 10,75 5,95 L 65,95 C 60,75 45,65 35,65 Z" fill="#ec4899" />
    
    <!-- Arm supporting chin in admiration/appreciation -->
    <path d="M 45,70 C 55,75 60,60 55,50" fill="none" stroke="#ec4899" stroke-width="9" stroke-linecap="round" />
    <!-- Hand on chin -->
    <circle cx="53" cy="45" r="5" fill="#fcd34d" />

    <!-- Head & Hair -->
    <circle cx="38" cy="35" r="17" fill="#fcd34d" />
    <!-- Modern Styled Hair -->
    <path d="M 20,35 C 20,18 30,14 42,16 C 54,18 56,28 55,40 C 50,30 44,24 36,24 C 28,24 22,28 20,35 Z" fill="#475569" />
    
    <!-- Facial Features: Warm, admiring expression with sparkling eyes -->
    <circle cx="34" cy="33" r="2" fill="#0f172a" />
    <circle cx="43" cy="33" r="2" fill="#0f172a" />
    <circle cx="35" cy="32" r="0.8" fill="#ffffff" />
    <circle cx="44" cy="32" r="0.8" fill="#ffffff" />
    <!-- Gentle appreciative smile -->
    <path d="M 36,40 C 39,43 41,43 43,40" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <!-- Rosy cheeks of joy -->
    <circle cx="31" cy="37" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="47" cy="37" r="3" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- Floating Sparkles / Aesthetic Appreciation Indicators -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 75,60 L 77,66 L 83,68 L 77,70 L 75,76 L 73,70 L 67,68 L 73,66 Z" opacity="0.9" />
    <!-- Star 2 -->
    <path d="M 115,35 L 116.5,39 L 120.5,40.5 L 116.5,42 L 115,46 L 113.5,42 L 109.5,40.5 L 113.5,39 Z" opacity="0.7" transform="scale(0.8) translate(30, 10)" />
    <!-- Star 3 (Pink Accent) -->
    <path d="M 50,110 L 51,114 L 55,115 L 51,116 L 50,120 L 49,116 L 45,115 L 49,114 Z" fill="#f43f5e" opacity="0.8" />
  </g>

  <!-- Foreground Vignette / Soft Lighting Overlay for Depth -->
  <circle cx="120" cy="120" r="130" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.1" />
</svg>