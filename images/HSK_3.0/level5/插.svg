<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Paper Sheet Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Marker/Insert Gradient -->
    <linearGradient id="markerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background lighting -->
  <circle cx="120" cy="80" r="70" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />
  <circle cx="150" cy="140" r="50" fill="#f59e0b" opacity="0.08" filter="url(#glow)" />

  <!-- Wooden/Modern Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" />

  <!-- Scene Elements: Laptop/Notebook background context -->
  <g transform="translate(40, 130) rotate(-10)">
    <rect x="0" y="0" width="80" height="60" rx="4" fill="#475569" opacity="0.4" />
  </g>

  <!-- Main Document (Bài văn) lying on desk -->
  <g filter="url(#shadow)">
    <path d="M 60,60 L 170,50 L 180,180 L 70,190 Z" fill="url(#paperGrad)" />
    <!-- Paper lines simulating text paragraphs -->
    <line x1="80" y1="80" x2="150" y2="74" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="83" y1="100" x2="155" y2="94" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="86" y1="120" x2="140" y2="114" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="89" y1="160" x2="160" y2="154" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- The Insertion Gap / Highlight Area -->
  <g transform="translate(10, 5)">
    <!-- Cutout/Insertion visual indicator -->
    <path d="M 95,130 L 130,126" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,3" fill="none" opacity="0.7" />
    <polygon points="128,122 136,126 127,131" fill="#ef4444" opacity="0.7" />
  </g>

  <!-- Action Sparkles / Motion -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="115" cy="110" r="3" />
    <circle cx="150" cy="100" r="2" />
    <circle cx="130" cy="85" r="2.5" />
  </g>
  <g fill="#fbbf24">
    <circle cx="105" cy="135" r="2" />
    <circle cx="140" cy="120" r="3" />
  </g>

  <!-- The Inserted Object (Colorful bookmark/sentence strip being 'cắm, chèn vào') -->
  <g filter="url(#shadow)" transform="translate(15, -10) rotate(15 120 120)">
    <!-- Shadow for insertion depth -->
    <rect x="105" y="70" width="35" height="75" rx="6" fill="#0f172a" opacity="0.2" />
    
    <!-- Main Strip Body -->
    <rect x="100" y="65" width="35" height="75" rx="6" fill="url(#markerGrad)" stroke="#fef3c7" stroke-width="2" />
    
    <!-- Content lines on the strip -->
    <line x1="108" y1="85" x2="127" y2="85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="108" y1="100" x2="125" y2="100" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="108" y1="115" x2="120" y2="115" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Pointed tip indicating insertion action -->
    <path d="M 100,140 L 117.5,155 L 135,140 Z" fill="#d97706" />
  </g>

  <!-- Floating Hand/Stylus guiding the insertion (Stylized vector hand) -->
  <g transform="translate(20, -5)" filter="url(#shadow)">
    <!-- Stylus/Pen body -->
    <path d="M 140,40 L 165,65 L 155,75 L 130,50 Z" fill="#38bdf8" />
    <path d="M 125,55 L 130,50 L 155,75 L 150,80 Z" fill="#0284c7" />
    <!-- Stylus tip -->
    <path d="M 125,55 L 130,50 L 120,45 Z" fill="#0f172a" />
    
    <!-- Friendly rounded fingers pressing down -->
    <path d="M 115,55 C 115,50 125,45 130,50 C 135,55 130,65 125,65 C 120,65 115,60 115,55 Z" fill="#fcd34d" />
  </g>

  <!-- Foreground decorative elements for depth (Coffee cup on desk) -->
  <g transform="translate(190, 150)" filter="url(#shadow)">
    <ellipse cx="15" cy="5" rx="12" ry="4" fill="#cbd5e1" />
    <path d="M 3,5 L 7,25 C 7,27 9,28 15,28 C 21,28 23,27 23,25 L 27,5 Z" fill="#10b981" />
    <path d="M 24,10 C 29,10 31,12 31,15 C 31,18 29,20 24,20" stroke="#10b981" stroke-width="3" fill="none" />
    <!-- Steam -->
    <path d="M 10, -2 Q 13, -8 10, -14" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 18, -4 Q 15, -10 18, -16" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

</svg>