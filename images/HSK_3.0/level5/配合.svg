<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Gear Metal Gradients -->
    <linearGradient id="goldGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="silverGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="tealGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Character 1 (Left) Skin/Clothes -->
    <linearGradient id="char1Skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="char1Shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Right) Skin/Clothes -->
    <linearGradient id="char2Skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="char2Shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Atmospheric Background Elements: Interlocking Machinery / Cogs -->
  <g opacity="0.15">
    <!-- Large background gear top right -->
    <path d="M190,40 L195,35 L200,40 L205,37 L208,44 L214,44 L215,50 L221,53 L220,60 L226,65 L222,72 L227,78 L221,83 L224,90 L218,94 L219,101 L212,103 L211,110 L204,110 L201,116 L194,114 L190,120 L183,116 L178,121 L172,115 L166,118 L162,111 L156,112 L150,105 L146,105 L142,98 L138,97 L135,90 L132,88 L131,80 L129,77 L130,69 L129,65 L133,59 L133,53 L138,48 L140,43 L146,40 L150,37 L157,37 L163,33 L170,35 L176,32 L183,36 Z" fill="#94a3b8" />
    <circle cx="178" cy="76" r="22" fill="#0f172a" />
    
    <!-- Background gear bottom left -->
    <path d="M40,160 L45,155 L50,160 L55,157 L58,164 L64,164 L65,170 L71,173 L70,180 L76,185 L72,192 L77,198 L71,203 L74,210 L68,214 L69,221 L62,223 L61,230 L54,230 L51,236 L44,234 L40,240 Z" fill="#38bdf8" />
    <circle cx="57" cy="197" r="15" fill="#0f172a" />
  </g>

  <!-- Central Mechanism Platform (Dynamic Base) -->
  <g filter="url(#shadow)">
    <!-- Platform Base -->
    <ellipse cx="120" cy="200" rx="80" ry="16" fill="#334155" />
    <ellipse cx="120" cy="196" rx="72" ry="12" fill="#475569" />
  </g>

  <!-- Giant Central Cooperating Cogs (The Core Concept of 'Cooperation/配合') -->
  <g filter="url(#shadow)">
    <!-- Left Gear (Cyan/Teal - Character 1 side) -->
    <g transform="translate(90, 115)">
      <path d="M0,-35 L8,-33 L14,-28 L20,-20 L24,-10 L25,0 L24,10 L20,20 L14,28 L8,33 L0,35 L-8,33 L-14,28 L-20,20 L-24,10 L-25,0 L-24,-10 L-20,-20 L-14,-28 L-8,-33 Z" fill="url(#tealGear)" transform="rotate(15)" />
      <!-- Star-like gear teeth overlay for stylized cartoon look -->
      <circle cx="0" cy="0" r="22" fill="#065f46" />
      <circle cx="0" cy="0" r="16" fill="url(#tealGear)" />
      <!-- Inner hole -->
      <circle cx="0" cy="0" r="7" fill="#0f172a" />
      <!-- Direction arrow orbiting gear -->
      <path d="M-15,-15 A 22 22 0 0 1 15,-15" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />
    </g>

    <!-- Right Gear (Gold - Character 2 side) - Interlocking perfectly -->
    <g transform="translate(150, 115)">
      <path d="M0,-35 L8,-33 L14,-28 L20,-20 L24,-10 L25,0 L24,10 L20,20 L14,28 L8,33 L0,35 L-8,33 L-14,28 L-20,20 L-24,10 L-25,0 L-24,-10 L-20,-20 L-14,-28 L-8,-33 Z" fill="url(#goldGear)" transform="rotate(-5)" />
      <circle cx="0" cy="0" r="22" fill="#b45309" />
      <circle cx="0" cy="0" r="16" fill="url(#goldGear)" />
      <!-- Inner hole -->
      <circle cx="0" cy="0" r="7" fill="#0f172a" />
      <!-- Direction arrow orbiting gear (opposite way) -->
      <path d="M15,15 A 22 22 0 0 1 -15,15" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />
    </g>

    <!-- Top Connecting Link Gear (Smaller, bridging them together) -->
    <g transform="translate(120, 80)">
      <circle cx="0" cy="0" r="14" fill="url(#silverGear)" />
      <circle cx="0" cy="0" r="5" fill="#0f172a" />
      <!-- Glowing connection beam -->
      <path d="M-30,35 L0,-15 L30,35" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    </g>
  </g>

  <!-- Energetic Action Sparks / Connection Nodes -->
  <g>
    <circle cx="120" cy="115" r="4" fill="#fbbf24" filter="url(#shadow)" />
    <path d="M112,115 L128,115 M120,107 L120,123" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    
    <!-- Sparkles -->
    <path d="M80,70 L83,75 L88,78 L83,81 L80,86 L77,81 L72,78 L77,75 Z" fill="#38bdf8" />
    <path d="M160,70 L163,75 L168,78 L163,81 L160,86 L157,81 L152,78 L157,75 Z" fill="#ec4899" />
  </g>

  <!-- Character Left (Pushing / Working together) -->
  <g transform="translate(55, 135)" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M -15,35 Q -25,10 -10,-5 L 10,-5 Q 25,10 15,35 Z" fill="url(#char1Shirt)" />
    <!-- Head -->
    <circle cx="0" cy="-22" r="14" fill="url(#char1Skin)" />
    <!-- Hair -->
    <path d="M -14,-24 Q 0,-38 14,-24 Q 10,-20 5,-26 Q 0,-28 -5,-26 Q -10,-20 -14,-24 Z" fill="#0f172a" />
    <!-- Determined Face -->
    <circle cx="-4" cy="-22" r="1.5" fill="#0f172a" />
    <circle cx="4" cy="-22" r="1.5" fill="#0f172a" />
    <path d="M -2,-16 Q 0,-13 2,-16" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <!-- Arms reaching out to the gear (cooperating) -->
    <path d="M 10,-2 Q 25,0 35,15" fill="none" stroke="url(#char1Skin)" stroke-width="6" stroke-linecap="round" />
    <!-- Legs braced -->
    <path d="M -10,35 L -20,55 M 10,35 L 5,55" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Character Right (Pushing / Working together) -->
  <g transform="translate(185, 135)" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M -15,35 Q -25,10 -10,-5 L 10,-5 Q 25,10 15,35 Z" fill="url(#char2Shirt)" />
    <!-- Head -->
    <circle cx="0" cy="-22" r="14" fill="url(#char2Skin)" />
    <!-- Hair (Pigtail style) -->
    <path d="M -14,-24 Q 0,-38 14,-24 Q 16,-10 20,-12 Q 15,-28 -5,-30 Q -14,-24 -14,-24 Z" fill="#0f172a" />
    <!-- Determined Face -->
    <circle cx="-4" cy="-22" r="1.5" fill="#0f172a" />
    <circle cx="4" cy="-22" r="1.5" fill="#0f172a" />
    <path d="M -2,-16 Q 0,-13 2,-16" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <!-- Arms reaching out to the gear -->
    <path d="M -10,-2 Q -25,0 -35,15" fill="none" stroke="url(#char2Skin)" stroke-width="6" stroke-linecap="round" />
    <!-- Legs braced -->
    <path d="M -10,35 L -5,55 M 10,35 L 20,55" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Floating Success / Synergy Elements (Golden starburst & upward energy) -->
  <g>
    <!-- Glowing pulse aura around top center -->
    <circle cx="120" cy="70" r="30" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 6" />
    
    <!-- Floating checkmark/success icon stylized as vector shapes -->
    <g transform="translate(120, 32)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="14" fill="#10b981" />
      <path d="M-5,-1 L-2,3 L6,-5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <!-- Floating synergy particles -->
    <circle cx="95" cy="55" r="3" fill="#fbbf24" opacity="0.9" />
    <circle cx="145" cy="55" r="2" fill="#38bdf8" opacity="0.9" />
    <circle cx="120" cy="18" r="2.5" fill="#ec4899" opacity="0.9" />
  </g>

  <!-- Foreground Frame / Accent Border (Clean Vector Polish) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>