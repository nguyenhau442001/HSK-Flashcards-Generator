<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Central Table -->
  <ellipse cx="120" cy="160" rx="70" ry="25" fill="#334155"/>
  <ellipse cx="120" cy="160" rx="65" ry="22" fill="#1e293b"/>
  
  <!-- Characters around the table -->
  <!-- Character 1 (Top) -->
  <circle cx="120" cy="100" r="15" fill="#fbbf24"/>
  <path d="M110 105h20v10a10 10 0 0 1-20 0z" fill="#38bdf8"/>
  
  <!-- Character 2 (Left) -->
  <circle cx="60" cy="130" r="15" fill="#fb923c"/>
  <path d="M50 135h20v10a10 10 0 0 1-20 0z" fill="#ec4899"/>
  
  <!-- Character 3 (Right) -->
  <circle cx="180" cy="130" r="15" fill="#10b981"/>
  <path d="M170 135h20v10a10 10 0 0 1-20 0z" fill="#f59e0b"/>

  <!-- Orbiting elements (The concept of 'around') -->
  <path d="M120 80 A 60 40 0 1 0 120 200 A 60 40 0 1 0 120 80" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Props on table -->
  <circle cx="110" cy="155" r="5" fill="#f59e0b"/>
  <rect x="125" y="152" width="8" height="6" rx="1" fill="#10b981"/>
  
  <!-- Decorative atmosphere -->
  <circle cx="40" cy="50" r="3" fill="#38bdf8" opacity="0.5"/>
  <circle cx="200" cy="60" r="2" fill="#ec4899" opacity="0.5"/>
  <circle cx="180" cy="200" r="4" fill="#fbbf24" opacity="0.3"/>
</svg>