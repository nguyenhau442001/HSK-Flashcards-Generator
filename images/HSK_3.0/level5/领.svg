  <line x1="30" y1="45" x2="70" y2="45" stroke="#334155" stroke-width="2"/>
  <line x1="30" y1="55" x2="60" y2="55" stroke="#334155" stroke-width="2"/>
  
  <circle cx="200" cy="40" r="20" fill="#1e293b" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
