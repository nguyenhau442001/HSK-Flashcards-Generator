<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Person's Lower Back/Waist Area -->
  <g transform="translate(120, 120)">
    <!-- Shirt fabric -->
    <path d="M-50 -20 Q0 -30 50 -20 L 40 40 Q0 50 -40 40 Z" fill="#38bdf8"/>
    
    <!-- Hands holding waist -->
    <path d="M-65 -5 C-80 -5 -85 10 -70 15 L-50 10 Z" fill="#fbbf24"/>
    <path d="M65 -5 C80 -5 85 10 70 15 L50 10 Z" fill="#fbbf24"/>
    
    <!-- Pain indicator (spark/star) -->
    <path d="M0 -40 L5 -30 L15 -35 L10 -25 L20 -20 L10 -15 L15 -5 L5 -10 L0 0 L-5 -10 L-15 -5 L-10 -15 L-20 -20 L-10 -25 L-15 -35 L-5 -30 Z" fill="#ec4899"/>
  </g>
  
  <!-- Background props for context -->
  <circle cx="180" cy="60" r="15" fill="#10b981" opacity="0.3"/>
  <rect x="30" y="190" width="40" height="10" rx="2" fill="#fb923c" opacity="0.4"/>
  <rect x="170" y="200" width="30" height="8" rx="2" fill="#fb923c" opacity="0.4"/>
  
  <!-- Depth lines -->
  <path d="M0 180 L240 180" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
</svg>