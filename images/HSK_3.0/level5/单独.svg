<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Distant Mountains -->
  <path d="M0 180 L60 120 L120 160 L180 110 L240 170 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The Solo Traveler -->
  <g transform="translate(120, 140)">
    <!-- Backpack -->
    <rect x="-15" y="-30" width="30" height="40" rx="5" fill="#fb923c"/>
    <!-- Body -->
    <path d="M-10 10 L-10 50 L10 50 L10 10 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-35" r="15" fill="#fde68a"/>
    <!-- Legs -->
    <rect x="-8" y="50" width="6" height="20" fill="#38bdf8"/>
    <rect x="2" y="50" width="6" height="20" fill="#38bdf8"/>
  </g>
  
  <!-- Campfire -->
  <path d="M80 210 L100 210 L90 180 Z" fill="#f59e0b"/>
  <path d="M85 205 L95 205 L90 170 Z" fill="#fbbf24"/>
  
  <!-- Stars/Atmosphere -->
  <circle cx="40" cy="40" r="2" fill="#e2e8f0"/>
  <circle cx="180" cy="60" r="1.5" fill="#e2e8f0"/>
  <circle cx="210" cy="30" r="2" fill="#e2e8f0"/>
  <circle cx="30" cy="110" r="1" fill="#e2e8f0"/>
  
  <!-- Moon -->
  <circle cx="200" cy="50" r="20" fill="#f1f5f9"/>
  <circle cx="208" cy="42" r="20" fill="#1e293b"/>
  
  <!-- Ground Detail -->
  <path d="M0 210 Q 120 200 240 210 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
</svg>