<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- The "Bad Habit" (Junk food/Late night gaming elements) -->
  <path d="M60 160 L70 120 L90 120 L100 160 Z" fill="#ec4899" opacity="0.6"/>
  <circle cx="80" cy="115" r="8" fill="#fb923c"/>
  
  <!-- The Character (Determined to change) -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-40" r="25" fill="#fde68a"/>
    <path d="M-10 -35 Q-5 -30 0 -35 T10 -35" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="-8" cy="-45" r="3" fill="#475569"/>
    <circle cx="8" cy="-45" r="3" fill="#475569"/>
    <path d="M-20 0 L-30 40 M20 0 L30 40" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M-5 0 L-10 30 L5 30 L10 0" fill="#38bdf8"/>
  </g>
  
  <!-- The "New Habit" (Healthy/Productive elements) -->
  <rect x="150" y="130" width="30" height="30" rx="4" fill="#10b981"/>
  <path d="M155 145 L165 155 L175 135" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Action Lines/Emphasis -->
  <path d="M100 100 Q120 80 140 100" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <circle cx="145" cy="95" r="3" fill="#fbbf24"/>
  
  <!-- Background Decor -->
  <rect x="40" y="60" width="40" height="60" rx="4" fill="#334155"/>
  <rect x="180" y="80" width="30" height="50" rx="4" fill="#334155"/>
  <circle cx="200" cy="50" r="15" fill="#f59e0b" opacity="0.2"/>
</svg>