<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100% " stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Gateway Warm Light -->
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Surface Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Leaf/Nature Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Decorative Elements (World Map / Connection Lines) -->
  <g opacity="0.15">
    <circle cx="120" cy="110" r="85" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="120" cy="110" r="65" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <path d="M 50 110 L 190 110 M 120 40 L 120 180" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- 2. Environment: Floor and Architecture Base -->
  <rect x="0" y="180" width="240" height="60" fill="url(#floorGrad)" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2" />
  
  <!-- Perspective Floor Grid Lines -->
  <g opacity="0.3">
    <line x1="120" y1="180" x2="30" y2="240" stroke="#94a3b8" stroke-width="1"/>
    <line x1="120" y1="180" x2="80" y2="240" stroke="#94a3b8" stroke-width="1"/>
    <line x1="120" y1="180" x2="160" y2="240" stroke="#94a3b8" stroke-width="1"/>
    <line x1="120" y1="180" x2="210" y2="240" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- 3. Ambient Portal Glow Behind Open Doors -->
  <circle cx="120" cy="115" r="55" fill="url(#portalGlow)" filter="url(#glowEffect)" />

  <!-- Rising Energy Particles / Connections -->
  <g fill="#fbbf24">
    <circle cx="95" cy="120" r="2" opacity="0.8"/>
    <circle cx="150" cy="100" r="3" opacity="0.6"/>
    <circle cx="130" cy="75" r="1.5" opacity="0.9"/>
    <circle cx="105" cy="85" r="2.5" opacity="0.7"/>
    <circle cx="145" cy="140" r="2" opacity="0.5"/>
  </g>

  <!-- 4. Main Subject: Grand Open Architectural Gateway / Doors (Representing "Mở cửa", "KhaI phóng") -->
  <!-- Outer Archway Frame -->
  <path d="M 70 180 L 70 75 C 70 45, 95 30, 120 30 C 145 30, 170 45, 170 75 L 170 180" 
        fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" filter="url(#softShadow)" />

  <path d="M 70 180 L 70 75 C 70 45, 95 30, 120 30 C 145 30, 170 45, 170 75 L 170 180" 
        fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

  <!-- Left Open Door Panel (Swung outward to the left) -->
  <g filter="url(#softShadow)">
    <path d="M 66 78 L 42 90 L 42 178 L 66 180 Z" fill="#334155" stroke="#475569" stroke-width="2" />
    <!-- Door Detailing - Inner Panels -->
    <rect x="48" y="98" width="12" height="30" rx="3" fill="#1e293b" />
    <rect x="48" y="138" width="12" height="30" rx="3" fill="#1e293b" />
    <circle cx="60" cy="135" r="2" fill="#fbbf24" />
  </g>

  <!-- Right Open Door Panel (Swung outward to the right) -->
  <g filter="url(#softShadow)">
    <path d="M 174 78 L 198 90 L 198 178 L 174 180 Z" fill="#334155" stroke="#475569" stroke-width="2" />
    <!-- Door Detailing - Inner Panels -->
    <rect x="180" y="98" width="12" height="30" rx="3" fill="#1e293b" />
    <rect x="180" y="138" width="12" height="30" rx="3" fill="#1e293b" />
    <circle cx="180" cy="135" r="2" fill="#fbbf24" />
  </g>

  <!-- 5. Tangential Context & Props (Prosperity, Exchange, Global Connection) -->
  <!-- Stepping Stones Leading Through the Gateway -->
  <ellipse cx="120" cy="195" rx="18" ry="6" fill="#475569" filter="url(#softShadow)" />
  <ellipse cx="120" cy="170" rx="14" ry="5" fill="#64748b" />
  <ellipse cx="120" cy="145" rx="10" ry="4" fill="#94a3b8" />

  <!-- Lush Greenery / Plants flanking the gateway (Symbolizing growth and opening up) -->
  <!-- Left Plant Cluster -->
  <g transform="translate(45, 160)" filter="url(#softShadow)">
    <path d="M 10 20 Q 5 -5, -10 -10 Q 0 10, 10 20 Z" fill="url(#leafGrad)" />
    <path d="M 15 20 Q 20 -2, 5 -15 Q 12 5, 15 20 Z" fill="#10b981" />
    <path d="M 5 20 Q -5 5, -15 2 Q -2 12, 5 20 Z" fill="#059669" />
    <!-- Small Pot -->
    <path d="M 2 20 L 18 20 L 15 30 L 5 30 Z" fill="#cbd5e1" />
  </g>

  <!-- Right Plant Cluster -->
  <g transform="translate(175, 160)" filter="url(#softShadow)">
    <path d="M 10 20 Q 25 -5, 30 -10 Q 15 10, 10 20 Z" fill="url(#leafGrad)" />
    <path d="M 5 20 Q 0 -2, 15 -15 Q 8 5, 5 20 Z" fill="#10b981" />
    <path d="M 15 20 Q 25 5, 35 2 Q 22 12, 15 20 Z" fill="#059669" />
    <!-- Small Pot -->
    <path d="M 5 20 L 21 20 L 18 30 L 8 30 Z" fill="#cbd5e1" />
  </g>

  <!-- Floating Global / Exchange Icons (Birds/Paper planes flying out into the world) -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softShadow)">
    <!-- Paper Plane 1 (Left, flying out) -->
    <path d="M 75 90 L 95 80 L 85 105 L 80 95 L 75 90 Z" fill="#e0f2fe" />
    <path d="M 80 95 L 95 80" />

    <!-- Paper Plane 2 (Right, soaring high) -->
    <path d="M 160 70 L 145 55 L 170 50 L 160 70 Z" fill="#bae6fd" />
    <path d="M 160 70 L 170 50" />
  </g>

  <!-- 6. Foreground Framing & Polish (Warm accent light from bottom center) -->
  <ellipse cx="120" cy="183" rx="40" ry="8" fill="#f59e0b" opacity="0.3" filter="url(#glowEffect)" />

  <!-- Outer App Border Frame Accent -->
  <rect x="4" y="4" width="232" height="232" rx="20" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>