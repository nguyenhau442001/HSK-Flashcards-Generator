<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Urgent Warning Glow (from behind the overlooked notice) -->
    <radialGradient id="warningGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Hoodie Gradient -->
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lamp Light Cone -->
  <circle cx="70" cy="40" r="110" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT: Background Room Details -->
  <!-- Bookshelf / Wall Line -->
  <line x1="0" y1="175" x2="240" y2="175" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" opacity="0.5" />
  
  <!-- Desk Surface -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#0f172a" />
  <path d="M 0 185 L 240 185 L 240 190 L 0 190 Z" fill="#475569" />

  <!-- Background Props: Stack of books -->
  <rect x="25" y="160" width="30" height="8" rx="2" fill="#64748b" />
  <rect x="22" y="168" width="35" height="9" rx="2" fill="#0ea5e9" />
  <rect x="20" y="177" width="38" height="8" rx="2" fill="#f43f5e" />

  <!-- Desk Lamp on Left -->
  <path d="M 50 185 L 55 185 L 55 120 L 70 80 L 55 70 L 40 85 L 45 185 Z" fill="#334155" />
  <path d="M 38 65 Q 55 45 72 75 Z" fill="#fbbf24" />
  <!-- Lamp Base -->
  <ellipse cx="52" cy="185" rx="14" ry="4" fill="#475569" />

  <!-- THE FOCAL POINT: The Overlooked/Ignored Important Notice -->
  <!-- Warning Glow Behind Document -->
  <circle cx="160" cy="155" r="35" fill="url(#warningGlow)" />
  
  <!-- The Document (Tilted, pushed aside, showing neglect) -->
  <g transform="translate(140, 130) rotate(15)">
    <!-- Paper base -->
    <rect x="-25" y="-30" width="55" height="65" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <!-- Urgent Red Accent Stripe -->
    <rect x="-25" y="-30" width="55" height="10" fill="#ef4444" />
    <!-- Abstract warning lines representing important text -->
    <line x1="-18" y1="-12" x2="18" y2="-12" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="-18" y1="2" x2="10" y2="2" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-18" y1="14" x2="15" y2="14" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-18" y1="26" x2="5" y2="26" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Exclamation mark badge on document -->
    <circle cx="15" cy="-12" r="5" fill="#fef08a" />
    <path d="M 15 -15 L 15 -11 M 15 -8 L 15 -7" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Props: Coffee Mug (Steam rising, casual atmosphere) -->
  <path d="M 195 160 Q 205 140 195 120" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />
  <rect x="180" y="160" width="22" height="25" rx="4" fill="#cbd5e1" />
  <path d="M 202 165 C 215 165 215 180 202 180" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
  <ellipse cx="191" cy="160" rx="11" ry="3" fill="#94a3b8" />
  <ellipse cx="191" cy="161" rx="9" ry="2" fill="#78350f" />

  <!-- MAIN CHARACTER: Dismissive / Casual Student/Worker -->
  <g id="character">
    <!-- Torso (Leaning back in chair) -->
    <path d="M 85 130 C 80 115 95 105 110 115 L 125 160 C 125 175 105 185 90 185 Z" fill="url(#hoodie)" />
    <!-- Hoodie Pocket -->
    <path d="M 98 160 L 118 160 L 115 178 L 101 178 Z" fill="#0284c7" />

    <!-- Left Arm: Reaching back/up casually, dismissing the problem -->
    <path d="M 88 120 C 70 110 50 120 40 140" fill="none" stroke="url(#hoodie)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Hand waving dismissively -->
    <circle cx="36" cy="144" r="7" fill="url(#skin)" />
    <path d="M 31 142 Q 33 138 37 139" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right Arm: Resting comfortably on desk or lap -->
    <path d="M 115 130 L 140 150 L 160 170" fill="none" stroke="url(#hoodie)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="163" cy="173" r="7" fill="url(#skin)" />

    <!-- Neck -->
    <path d="M 95 105 L 105 105 L 105 115 L 95 115 Z" fill="url(#skin)" />

    <!-- Head (Tilted back, looking away with a smug/indifferent expression) -->
    <g transform="translate(95, 85)">
      <!-- Hair Base (Dark, stylized modern haircut) -->
      <path d="M -12 -5 C -15 -25 15 -28 22 -10 C 27 -2 30 10 25 12 C 18 14 15 5 15 5 C 10 -2 0 -5 -12 -5 Z" fill="#0f172a" />
      
      <!-- Face Shape -->
      <path d="M -12 -5 C -15 15 5 22 18 10 C 22 5 24 -2 20 -8 C 15 -5 0 -2 -12 -5 Z" fill="url(#skin)" />
      
      <!-- Ear -->
      <path d="M 16 2 C 20 2 20 8 16 9" fill="url(#skin)" stroke="#f97316" stroke-width="1" />

      <!-- Facial Expression: Eyes closed in total disregard/dismissal, eyebrow raised -->
      <!-- Closed Happy/Dismissive Eyes (Arcs) -->
      <path d="M 8 1 Q 12 -1 16 2" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
      <path d="M 16 -3 Q 19 -5 21 -2" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" /> <!-- Raised eyebrow -->

      <!-- Smug / Unbothered Smile -->
      <path d="M 12 10 Q 17 14 21 11" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
      
      <!-- Casual Blush of indifference -->
      <circle cx="15" cy="7" r="3" fill="#fb7185" opacity="0.4" />

      <!-- Front Hair Bangs -->
      <path d="M -14 -6 C -5 -8 5 -5 10 -3 C 5 -1 -5 -3 -14 -6 Z" fill="#0f172a" />
    </g>
  </g>

  <!-- ACTION & EMPHASIS FX: Dismissive dust/motion lines floating away from the ignored document -->
  <path d="M 125 115 Q 115 105 105 110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 132 108 Q 125 98 118 102" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  
  <!-- Subtle sparkles of careless attitude -->
  <path d="M 45 100 L 48 105 L 53 108 L 48 111 L 45 116 L 42 111 L 37 108 L 42 105 Z" fill="#fbbf24" opacity="0.7" />
  <path d="M 180 95 L 182 98 L 185 100 L 182 102 L 180 105 L 178 102 L 175 100 L 178 98 Z" fill="#38bdf8" opacity="0.6" />
</svg>