<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Detective/Investigator magnifying glass -->
  <g transform="translate(120, 120) rotate(-15)">
    <circle cx="0" cy="0" r="45" fill="#334155" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="0" cy="0" r="38" fill="#1e293b"/>
    <path d="M32 32 L70 70" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="75" cy="75" r="8" fill="#38bdf8"/>
  </g>

  <!-- Clue/Paperwork -->
  <rect x="40" y="150" width="80" height="60" rx="4" fill="#f1f5f9" transform="rotate(-10 80 180)"/>
  <line x1="50" y1="165" x2="110" y2="165" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="50" y1="180" x2="110" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="50" y1="195" x2="90" y2="195" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Glowing particles of thought/doubt -->
  <circle cx="180" cy="60" r="6" fill="#f59e0b"/>
  <circle cx="195" cy="80" r="4" fill="#fbbf24"/>
  <circle cx="170" cy="90" r="3" fill="#fb923c"/>
  
  <!-- The 'Doubt' shape: A stylized, organic, slightly tilted organic form representing a puzzle piece or complex knot -->
  <path d="M150 120 C 150 90, 180 90, 180 120 C 180 140, 160 140, 160 155" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="170" r="5" fill="#ec4899"/>
</svg>