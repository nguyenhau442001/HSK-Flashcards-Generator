<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Area -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="80" rx="2" fill="#475569"/>
  <rect x="190" y="150" width="10" height="80" rx="2" fill="#475569"/>
  
  <!-- Work items -->
  <rect x="30" y="110" width="60" height="30" rx="4" fill="#64748b"/>
  <circle cx="100" cy="125" r="8" fill="#fb923c"/>
  
  <!-- Character: The person taking a break -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-30 120 Q 0 100 30 120 L 20 50 L -20 50 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 30 Q -25 5 0 5 Q 25 5 25 30 Z" fill="#475569"/>
    <!-- Eyes (Closed, relaxed) -->
    <path d="M-12 25 Q -8 20 -4 25 M 4 25 Q 8 20 12 25" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M-8 40 Q 0 48 8 40" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arms reaching for tea -->
    <path d="M-30 70 L -50 90" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Tea Cup (The 'Adjustment') -->
  <g transform="translate(170, 160)">
    <rect x="-15" y="0" width="30" height="25" rx="4" fill="#ec4899"/>
    <path d="M15 5 Q 25 5 25 15 Q 25 20 20 20" stroke="#ec4899" stroke-width="4" fill="none"/>
    <circle cx="0" cy="-5" r="3" fill="#fbbf24" opacity="0.6"/>
    <circle cx="-5" cy="-12" r="2" fill="#fbbf24" opacity="0.4"/>
  </g>
  
  <!-- Window/Plant for atmosphere -->
  <rect x="180" y="20" width="40" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M200 80 L 200 50 M 180 65 L 220 65" stroke="#334155" stroke-width="2"/>
  <circle cx="200" cy="40" r="10" fill="#10b981"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="4" fill="#fb923c"/>
  <circle cx="50" cy="20" r="2" fill="#38bdf8"/>
</svg>