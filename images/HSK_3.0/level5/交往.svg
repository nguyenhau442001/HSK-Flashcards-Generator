<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradients -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Character 2 Gradients -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Table Gradient -->
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Coffee Mug -->
    <linearGradient id="mug" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Speech/Connection Pulse -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Window/Environment Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Elements (Cafe/Lounge Interior) -->
  <!-- Background Wall Details / Window -->
  <path d="M70 30 H170 V110 H70 Z" fill="url(#windowGlow)" rx="8"/>
  <!-- City skyline in window -->
  <path d="M80 90 V70 H90 V90 H100 V60 H110 V90 H120 V75 H135 V90 H145 V65 H155 V90 H165 V80 H170 V110 H80 Z" fill="#4338ca" opacity="0.4"/>
  
  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="120" r="110" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Hanging Lamp -->
  <path d="M120 0 V35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 35 H140 L150 48 H90 Z" fill="#fbbf24"/>
  <ellipse cx="120" cy="48" rx="30" ry="10" fill="#f59e0b" opacity="0.3"/>

  <!-- Bookshelf / Prop in background -->
  <rect x="25" y="55" width="30" height="70" fill="#1e293b" rx="2"/>
  <line x1="25" y1="75" x2="55" y2="75" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="95" x2="55" y2="95" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="62" width="6" height="13" fill="#f43f5e" rx="1"/>
  <rect x="36" y="60" width="8" height="15" fill="#0ea5e9" rx="1"/>
  <rect x="30" y="80" width="12" height="15" fill="#10b981" rx="1"/>

  <!-- Plant Prop -->
  <path d="M195 110 Q 190 90 205 80 Q 215 95 205 110 Z" fill="#10b981"/>
  <path d="M205 110 Q 215 90 225 95 Q 225 110 205 110 Z" fill="#059669"/>
  <path d="M198 115 Q 185 105 180 115 Q 190 125 198 115 Z" fill="#34d399"/>
  <path d="M195 110 H215 V125 H195 Z" fill="#64748b" rx="2"/>

  <!-- Coffee Table (Surface for Interaction) -->
  <path d="M40 160 H200 L210 190 H30 Z" fill="#475569" filter="url(#shadow)"/>
  <path d="M40 156 H200 V162 H40 Z" fill="url(#tableTop)"/>

  <!-- Table Props: Coffee Mugs & Notebook -->
  <rect x="105" y="152" width="22" height="12" fill="#cbd5e1" rx="1"/>
  <path d="M100 150 H128 V153 H100 Z" fill="#e2e8f0" rx="1"/>
  <!-- Mug Left -->
  <path d="M65 146 H77 V156 C77 158 75 160 71 160 C67 160 65 158 65 156 Z" fill="url(#mug)"/>
  <path d="M77 149 H80 C82 149 82 153 80 153 H77" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <!-- Mug Right -->
  <path d="M155 146 H167 V156 C167 158 165 160 161 160 C157 160 155 158 155 156 Z" fill="#38bdf8"/>

  <!-- Dynamic Interaction Waves / Communication Element ("Giao tiếp, qua lại") -->
  <g opacity="0.8">
    <path d="M 90 120 Q 120 90 150 120" fill="none" stroke="url(#pulseGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 98 130 Q 120 105 142 130" fill="none" stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Floating Social/Communication Nodes -->
    <circle cx="105" cy="112" r="4" fill="#38bdf8" filter="url(#shadow)"/>
    <circle cx="120" cy="100" r="6" fill="#a855f7" filter="url(#shadow)"/>
    <circle cx="135" cy="112" r="4" fill="#ec4899" filter="url(#shadow)"/>
  </g>

  <!-- CHARACTER 1 (Left - Friendly, Expressive, Communicating) -->
  <g id="character-left" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M50 195 C50 170 70 160 85 160 C100 160 115 170 115 195 Z" fill="url(#shirt1)"/>
    <!-- Collar / Details -->
    <path d="M70 160 L85 175 L100 160" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left Arm gesturing dynamically -->
    <path d="M55 170 Q 65 135 85 130" fill="none" stroke="url(#shirt1)" stroke-width="14" stroke-linecap="round"/>
    <!-- Left Hand -->
    <circle cx="88" cy="128" r="7" fill="#fde68a"/>

    <!-- Head & Hair -->
    <circle cx="80" cy="115" r="22" fill="#fde68a"/>
    <!-- Hair Dark Modern Style -->
    <path d="M 60 115 C 60 95 100 95 102 112 C 95 105 70 105 60 115 Z" fill="#334155"/>
    <path d="M 62 110 C 65 100 85 98 95 105 C 80 100 70 105 62 110 Z" fill="#1e293b"/>

    <!-- Facial Expressions (Engaged & Smiling) -->
    <!-- Eye (Happy arc) -->
    <path d="M72 113 Q 76 109 80 113" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rosy Cheek -->
    <circle cx="75" cy="118" r="4" fill="#f43f5e" opacity="0.4"/>
    <!-- Open Happy Mouth speaking -->
    <path d="M78 123 C 78 123 82 127 85 123 Z" fill="#be123c"/>
  </g>

  <!-- CHARACTER 2 (Right - Active Listener, Nodding, Engaging) -->
  <g id="character-right" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M125 195 C125 170 140 160 155 160 C170 160 190 170 190 195 Z" fill="url(#shirt2)"/>
    <!-- Collar / Details -->
    <path d="M140 160 L155 173 L170 160" fill="none" stroke="#fce7f3" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Arm leaning on table -->
    <path d="M185 175 Q 165 145 150 145" fill="none" stroke="url(#shirt2)" stroke-width="14" stroke-linecap="round"/>
    <!-- Right Hand -->
    <circle cx="145" cy="144" r="7" fill="#fde68a"/>

    <!-- Head & Hair -->
    <path d="M160 93 C 145 93 140 105 140 115 C 140 128 152 135 162 135 C 172 135 182 125 182 115 C 182 105 175 93 160 93 Z" fill="#fde68a"/>
    <!-- Hair (Stylish Ponytail / Bun) -->
    <path d="M 140 112 C 138 95 175 90 182 105 C 190 100 195 110 185 115 C 185 100 150 100 140 112 Z" fill="#0f172a"/>
    <circle cx="190" cy="105" r="6" fill="#0f172a"/>

    <!-- Facial Expressions (Listening, Warm Eyes) -->
    <!-- Eye -->
    <circle cx="162" cy="113" r="2.5" fill="#1e293b"/>
    <!-- Rosy Cheek -->
    <circle cx="166" cy="118" r="4" fill="#f43f5e" opacity="0.4"/>
    <!-- Smile -->
    <path d="M159 122 Q 163 126 167 122" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Depth / Frame Accents -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>