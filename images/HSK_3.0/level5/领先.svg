<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Track -->
  <path d="M0 180 C 80 160, 160 160, 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#475569" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Leading Runner (The Team) -->
  <g transform="translate(140, 110)">
    <circle cx="10" cy="10" r="8" fill="#fbbf24"/>
    <path d="M10 18 L 10 40 M10 25 L 25 35 M10 25 L -5 35 M10 40 L 20 60 M10 40 L 0 60" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 5 L 7 5 M13 5 L 15 5" stroke="#0f172a" stroke-width="2"/>
    <path d="M7 15 Q 10 17 13 15" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Trailing Runners -->
  <g transform="translate(70, 130)" opacity="0.6">
    <circle cx="10" cy="10" r="8" fill="#38bdf8"/>
    <path d="M10 18 L 10 40 M10 25 L 25 35 M10 25 L -5 35 M10 40 L 20 60 M10 40 L 0 60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(30, 140)" opacity="0.4">
    <circle cx="10" cy="10" r="8" fill="#ec4899"/>
    <path d="M10 18 L 10 40 M10 25 L 25 35 M10 25 L -5 35 M10 40 L 20 60 M10 40 L 0 60" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Finish Line Ribbon -->
  <path d="M180 120 L 180 180" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="180" cy="120" r="6" fill="#10b981"/>
  
  <!-- Speed Lines -->
  <path d="M160 120 L 180 120" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  <path d="M155 130 L 170 130" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
</svg>