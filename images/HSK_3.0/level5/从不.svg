    <!-- Tie -->
    <path d="M-5 40 L5 40 L0 60 Z" fill="#ec4899"/>
  </g>
  
  <!-- Props on desk -->
  <rect x="50" y="145" width="30" height="15" rx="2" fill="#fb923c"/>
  <circle cx="180" cy="150" r="8" fill="#10b981"/>
  
  <!-- Action indicator: Early arrival -->
  <path d="M150 50 L165 35 L180 50" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="165" cy="42" r="3" fill="#fbbf24"/>
</svg>