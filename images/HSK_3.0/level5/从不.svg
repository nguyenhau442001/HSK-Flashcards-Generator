<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Wall & Clock -->
  <rect x="40" y="40" width="160" height="120" rx="4" fill="#334155"/>
  <circle cx="120" cy="70" r="22" fill="#f8fafc"/>
  <circle cx="120" cy="70" r="18" fill="#1e293b"/>
  <line x1="120" y1="70" x2="120" y2="56" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="70" x2="132" y2="70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" fill="#475569"/>
  <rect x="40" y="175" width="10" height="65" fill="#334155"/>
  <rect x="190" y="175" width="10" height="65" fill="#334155"/>
  
  <!-- Character -->
  <g transform="translate(120, 140)">
    <!-- Body -->
    <path d="M-30 80 Q-30 40 0 40 Q30 40 30 80 L30 100 L-30 100 Z" fill="#38bdf8"/>
    <!-- Head -->
