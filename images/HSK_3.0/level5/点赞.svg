<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Main Subject: The Photographer/Subject -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-40" r="25" fill="#fbbf24"/>
    <path d="M-15 -35 Q0 -25 15 -35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="-30" y="-15" width="60" height="40" rx="10" fill="#38bdf8"/>
    <rect x="-35" y="-15" width="10" height="20" rx="3" fill="#38bdf8"/>
    <rect x="25" y="-15" width="10" height="20" rx="3" fill="#38bdf8"/>
  </g>

  <!-- The Photo Frame -->
  <rect x="70" y="40" width="100" height="70" rx="5" fill="#f8fafc" stroke="#fb923c" stroke-width="3"/>
  <circle cx="120" cy="75" r="15" fill="#fb923c" opacity="0.3"/>
  <path d="M115 75 L120 80 L128 70" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Floating Like Indicators (The "Many People" aspect) -->
  <g fill="#ec4899">
    <path d="M180 60 l5 5 l-5 5 l-5 -5 z" transform="rotate(45 180 60)"/>
    <path d="M195 90 l5 5 l-5 5 l-5 -5 z" transform="rotate(-20 195 90)"/>
    <path d="M170 30 l5 5 l-5 5 l-5 -5 z" transform="rotate(10 170 30)"/>
    <path d="M50 50 l5 5 l-5 5 l-5 -5 z" transform="rotate(-15 50 50)"/>
    <path d="M40 90 l5 5 l-5 5 l-5 -5 z" transform="rotate(30 40 90)"/>
    <path d="M65 20 l5 5 l-5 5 l-5 -5 z" transform="rotate(5 65 20)"/>
  </g>

  <!-- Background Elements: Phone screens/notifications -->
  <rect x="20" y="160" width="40" height="60" rx="5" fill="#334155"/>
  <rect x="180" y="160" width="40" height="60" rx="5" fill="#334155"/>
  <circle cx="40" cy="190" r="8" fill="#10b981"/>
  <circle cx="200" cy="190" r="8" fill="#10b981"/>
  
  <!-- Decorative ambient light -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
</svg>