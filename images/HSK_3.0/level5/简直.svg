<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <linearGradient id="book-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="page-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <radialGradient id="magic-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="dragon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="fire-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient magical glow background representing the "Mind-blowing/Incredible" feeling -->
  <circle cx="120" cy="110" r="80" fill="url(#magic-glow)" />

  <!-- Background room/environment details -->
  <!-- Cozy bookshelf or window silhouette -->
  <path d="M 20 180 L 220 180 L 220 190 L 20 190 Z" fill="#0f172a" opacity="0.6" />
  <rect x="35" y="140" width="20" height="40" rx="3" fill="#334155" opacity="0.4" />
  <rect x="60" y="130" width="15" height="50" rx="3" fill="#475569" opacity="0.4" />

  <!-- Floating magical sparks / excitement elements -->
  <g filter="url(#glow)">
    <path d="M 60 70 L 63 78 L 71 81 L 63 84 L 60 92 L 57 84 L 49 81 L 57 78 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M 180 60 L 182 65 L 187 67 L 182 69 L 180 74 L 178 69 L 173 67 L 178 65 Z" fill="#38bdf8" opacity="0.9" />
    <path d="M 195 120 L 196 123 L 199 124 L 196 125 L 195 128 L 194 125 L 191 124 L 194 123 Z" fill="#f43f5e" opacity="0.7" />
    <path d="M 45 125 L 46 128 L 49 129 L 46 130 L 45 133 L 44 130 L 41 129 L 44 128 Z" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Main Action Subject: An open story book bursting with imagination -->
  <g filter="url(#soft-shadow)">
    <!-- Book Shadow -->
    <ellipse cx="120" cy="175" rx="75" ry="12" fill="#020617" opacity="0.7" />

    <!-- Open Book Base / Pages -->
    <path d="M 50 150 Q 120 170 190 150 L 195 120 Q 120 140 45 120 Z" fill="#cbd5e1" />
    <path d="M 45 120 Q 120 140 195 120 L 190 150 Q 120 170 50 150 Z" fill="url(#page-grad)" />
    
    <!-- Book Cover (Red) -->
    <path d="M 40 125 Q 120 145 200 125 L 195 155 Q 120 175 45 155 Z" fill="url(#book-grad)" />
    <path d="M 45 155 Q 120 175 195 155 L 195 160 Q 120 180 45 160 Z" fill="#9f1239" />
    <line x1="120" y1="133" x2="120" y2="167" stroke="#9f1239" stroke-width="3" stroke-linecap="round" />

    <!-- Abstract magical story lines on pages (no actual text) -->
    <path d="M 60 132 Q 80 137 95 132" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 60 140 Q 85 145 100 140" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 140 132 Q 160 137 180 132" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 145 140 Q 165 145 175 140" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- The "Mind-Blowing" 3D Pop-Out Fantasy Element: A dramatic dragon bursting out of the book -->
  <g filter="url(#soft-shadow)">
    <!-- Energy swirl coming out of the center crease -->
    <path d="M 110 130 C 100 90, 80 70, 95 50 C 110 30, 140 40, 130 60 C 120 80, 140 100, 125 130 Z" fill="url(#fire-grad)" opacity="0.9" />

    <!-- Friendly, dynamic cartoon Dragon soaring upward -->
    <!-- Dragon Body/Tail wrapped around magic -->
    <path d="M 120 130 C 110 110, 105 90, 115 75 C 125 60, 145 65, 140 85 C 135 105, 150 115, 160 105" fill="none" stroke="url(#dragon-grad)" stroke-width="14" stroke-linecap="round" />

    <!-- Dragon Wings -->
    <path d="M 125 80 L 95 50 L 115 65 Z" fill="#bae6fd" />
    <path d="M 135 75 L 165 45 L 145 65 Z" fill="#bae6fd" />

    <!-- Dragon Head -->
    <g transform="translate(115, 45)">
      <!-- Head Base -->
      <path d="M -5 10 C -15 10, -20 0, -10 -10 C 0 -20, 15 -10, 10 5 C 5 15, -2 15, -5 10 Z" fill="url(#dragon-grad)" />
      <!-- Snout -->
      <path d="M 5 -2 C 12 -5, 18 0, 15 5 C 12 10, 5 8, 5 -2 Z" fill="#0284c7" />
      <!-- Nostril smoke / fire -->
      <circle cx="18" cy="2" r="3" fill="#f59e0b" />
      <!-- Excited Eye -->
      <circle cx="2" cy="-3" r="3.5" fill="#ffffff" />
      <circle cx="3" cy="-3" r="1.5" fill="#0f172a" />
      <!-- Eyebrow (expressing extreme amazement) -->
      <path d="M -2 -9 C 2 -12, 6 -9, 8 -7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Cute horns -->
      <path d="M -8 -12 L -12 -20 L -4 -15 Z" fill="#fbbf24" />
      <path d="M 2 -14 L 6 -22 L 10 -15 Z" fill="#fbbf24" />
      <!-- Cheerful Open Mouth -->
      <path d="M 8 5 C 10 8, 14 7, 15 4" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Little glowing stars around the dragon -->
    <circle cx="85" cy="45" r="4" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="160" cy="70" r="3" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="100" cy="95" r="3.5" fill="#f43f5e" filter="url(#glow)" />
  </g>

  <!-- Action lines / Impact rings representing "Simply amazing!" -->
  <g fill="none" stroke-linecap="round" opacity="0.6">
    <!-- Left burst lines -->
    <path d="M 35 95 L 20 90" stroke="#38bdf8" stroke-width="3" />
    <path d="M 40 75 L 25 65" stroke="#fbbf24" stroke-width="2.5" />
    <!-- Right burst lines -->
    <path d="M 205 95 L 220 90" stroke="#f43f5e" stroke-width="3" />
    <path d="M 200 75 L 215 65" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Top arc -->
    <path d="M 95 25 Q 120 15 145 25" stroke="#fbbf24" stroke-width="3" />
  </g>

  <!-- Floating exclamation/sparkle cluster on top right -->
  <g transform="translate(170, 35)" filter="url(#glow)">
    <path d="M 0 10 Q 10 0 20 10 Q 10 20 0 10 Z" fill="#fbbf24" opacity="0.4" />
    <circle cx="10" cy="10" r="6" fill="#fef08a" />
  </g>
</svg>