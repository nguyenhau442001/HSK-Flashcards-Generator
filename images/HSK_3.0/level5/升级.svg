<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="170" width="160" height="60" fill="#1e293b"/>
  
  <!-- Computer Monitor -->
  <rect x="70" y="70" width="100" height="70" rx="6" fill="#334155"/>
  <rect x="75" y="75" width="90" height="60" rx="3" fill="#0f172a"/>
  
  <!-- Screen Content (The "Need Upgrade" visual) -->
  <circle cx="120" cy="105" r="15" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="6 4"/>
  <path d="M120 95 L120 110 L128 110" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Character -->
  <g transform="translate(180, 140)">
    <circle cx="0" cy="-20" r="15" fill="#fde68a"/>
    <path d="M-5 -25 Q0 -30 5 -25" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="-20" y="-5" width="40" height="30" rx="8" fill="#38bdf8"/>
    <rect x="-25" y="0" width="50" height="10" rx="2" fill="#0284c7"/>
  </g>
  
  <!-- Warning Light/Indicator -->
  <circle cx="160" cy="85" r="4" fill="#ec4899"/>
  
  <!-- Desk Props -->
  <rect x="30" y="145" width="20" height="15" rx="2" fill="#10b981"/>
  <circle cx="40" cy="135" r="5" fill="#fbbf24"/>
  
  <!-- Ambient Glow -->
  <ellipse cx="120" cy="105" rx="40" ry="30" fill="#fb923c" opacity="0.1"/>
</svg>