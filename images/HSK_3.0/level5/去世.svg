<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Background Atmosphere -->
  <rect x="60" y="40" width="120" height="80" rx="8" fill="#334155"/>
  <path d="M60 80 L180 80" stroke="#1e293b" stroke-width="4"/>
  <circle cx="120" cy="80" r="25" fill="#f59e0b" opacity="0.3"/>
  
  <!-- The Scene: A bedside table with a framed portrait and a candle -->
  <!-- Table Surface -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#475569"/>
  
  <!-- Framed Portrait -->
  <rect x="130" y="90" width="50" height="70" rx="4" fill="#94a3b8"/>
  <rect x="135" y="95" width="40" height="50" fill="#1e293b"/>
  <circle cx="155" cy="115" r="12" fill="#64748b"/>
  <path d="M143 145 C143 135, 167 135, 167 145" fill="#64748b"/>
  
  <!-- Candle -->
  <rect x="60" y="130" width="20" height="30" rx="2" fill="#fb923c"/>
  <path d="M70 120 C75 110, 75 105, 70 100 C65 105, 65 110, 70 120" fill="#f59e0b"/>
  
  <!-- Fallen Flower -->
  <path d="M90 155 C100 145, 120 145, 130 155" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="130" cy="155" r="4" fill="#ec4899"/>
  
  <!-- Soft Ambient Glow -->
  <ellipse cx="120" cy="160" rx="80" ry="20" fill="#f59e0b" opacity="0.05"/>
</svg>