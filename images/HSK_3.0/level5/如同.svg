<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Window Frame -->
  <rect x="60" y="40" width="120" height="160" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  <line x1="120" y1="40" x2="120" y2="200" stroke="#475569" stroke-width="4"/>
  <line x1="60" y1="120" x2="180" y2="120" stroke="#475569" stroke-width="4"/>
  
  <!-- The "White Colt" (Symbolic blur/motion) -->
  <path d="M180 80 C 150 80, 130 100, 100 100 C 70 100, 60 90, 60 90" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M175 85 C 145 85, 125 105, 95 105" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Elderly person silhouette observing -->
  <path d="M40 180 C 40 160, 50 150, 60 150 L 70 150 C 80 150, 90 160, 90 180 Z" fill="#94a3b8"/>
  <circle cx="65" cy="145" r="10" fill="#94a3b8"/>
  
  <!-- Desk and hourglass/clock elements -->
  <rect x="20" y="200" width="200" height="40" fill="#1e293b"/>
  <path d="M180 180 L 200 180 L 190 210 Z" fill="#38bdf8"/>
  <circle cx="190" cy="175" r="8" fill="#fb923c"/>
  
  <!-- Decorative light particles -->
  <circle cx="150" cy="60" r="2" fill="#fbbf24"/>
  <circle cx="130" cy="70" r="1.5" fill="#fbbf24"/>
  <circle cx="170" cy="90" r="2" fill="#fbbf24"/>
</svg>