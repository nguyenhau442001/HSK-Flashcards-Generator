<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- First Aid Box Gradient -->
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Floor / Surface Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Spotlight/Glow Effect -->
    <radialGradient id="spotlight" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Glow Filter for Priority/Essential Item -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="110" r="100" fill="url(#spotlight)" />

  <!-- Back Wall & Floor Separation -->
  <path d="M 0,160 L 240,160" stroke="#475569" stroke-width="1.5" opacity="0.4" />
  <path d="M 0,161 L 240,210 L 240,240 L 0,240 Z" fill="url(#floorGrad)" opacity="0.6" />

  <!-- SCENE ENVIRONMENT: Emergency Kit / Essential Gear Setup -->
  
  <!-- Secondary Prop: Rolled Blanket/Sleeping Bag (Preparedness Theme) -->
  <g transform="translate(35, 140) rotate(-15)">
    <rect x="0" y="0" width="55" height="30" rx="15" fill="#0ea5e9" filter="url(#dropShadow)" />
    <rect x="5" y="5" width="45" height="20" rx="10" fill="#38bdf8" />
    <rect x="20" y="0" width="10" height="30" fill="#0284c7" />
  </g>

  <!-- Secondary Prop: Flashlight (Essential Tool) -->
  <g transform="translate(155, 130) rotate(35)" filter="url(#dropShadow)">
    <path d="M 10,0 L 40,10 L 38,22 L 8,12 Z" fill="#64748b" />
    <!-- Flashlight Head -->
    <path d="M 0,-4 L 12,-2 L 12,24 L 0,26 Z" fill="#cbd5e1" />
    <ellipse cx="0" cy="11" rx="3" ry="13" fill="#facc15" />
    <!-- Light Beam -->
    <path d="M -5,11 L -45,-10 L -45,32 Z" fill="#facc15" opacity="0.15" />
  </g>

  <!-- MAIN SUBJECT: The Essential First Aid / Emergency Kit (Representing '必要' - Necessary/Essential) -->
  <g transform="translate(75, 95)" filter="url(#dropShadow)">
    
    <!-- Base Shadow underneath box -->
    <ellipse cx="45" cy="80" rx="40" ry="10" fill="#0f172a" opacity="0.6" />

    <!-- Main Box Body -->
    <rect x="10" y="25" width="70" height="55" rx="10" fill="url(#boxGrad)" />
    <!-- Box Lid / Depth Highlight -->
    <rect x="10" y="25" width="70" height="12" rx="6" fill="#fb7185" />

    <!-- Metallic Latches -->
    <rect x="25" y="32" width="8" height="6" rx="2" fill="#e2e8f0" />
    <rect x="57" y="32" width="8" height="6" rx="2" fill="#e2e8f0" />

    <!-- Handle -->
    <path d="M 32,25 C 32,15 58,15 58,25" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

    <!-- Essential Medical Cross Symbol (The universal symbol of necessity/help) -->
    <g transform="translate(45, 52)">
      <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#ffffff" />
      <rect x="-5" y="-14" width="10" height="28" rx="3" fill="#ffffff" />
    </g>
  </g>

  <!-- Floating Action Sparkles / Energy Highlights (Emphasizing Importance & Urgency) -->
  <g fill="#f59e0b">
    <!-- Top Right Sparkle -->
    <path d="M 185,55 Q 185,65 195,65 Q 185,65 185,75 Q 185,65 175,65 Q 185,65 185,55" filter="url(#glow)" />
    <!-- Left Small Sparkle -->
    <path d="M 50,75 Q 50,81 56,81 Q 50,81 50,87 Q 50,81 44,81 Q 50,81 50,75" opacity="0.8" />
  </g>
  
  <g fill="#38bdf8">
    <!-- Upper Left Accent Sparkle -->
    <path d="M 85,35 Q 85,41 91,41 Q 85,41 85,47 Q 85,41 79,41 Q 85,41 85,35" />
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="115" cy="45" r="2" fill="#ffffff" opacity="0.6" />
  <circle cx="170" cy="100" r="1.5" fill="#facc15" opacity="0.7" />
  <circle cx="60" cy="150" r="2" fill="#38bdf8" opacity="0.5" />
  <circle cx="140" cy="175" r="1.5" fill="#ffffff" opacity="0.4" />

</svg>