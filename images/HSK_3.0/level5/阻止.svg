<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <clipPath id="roundedCorners">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>
  
  <g clip-path="url(#roundedCorners)">
    <!-- Background -->
    <rect width="240" height="240" fill="url(#bgGrad)" />
    
    <!-- Ground -->
    <path d="M0 200 Q120 190 240 200 V240 H0 Z" fill="#064e3b" />
    
    <!-- The Tree (What is being protected) -->
    <path d="M45 205 L55 205 L52 140 L48 140 Z" fill="#451a03" />
    <circle cx="50" cy="130" r="25" fill="#065f46" />
    <circle cx="35" cy="145" r="20" fill="#059669" />
    <circle cx="65" cy="145" r="20" fill="#10b981" />
    <circle cx="50" cy="115" r="18" fill="#34d399" />

    <!-- The Threat: Stylized Bulldozer/Excavator -->
    <g transform="translate(150, 145)">
      <!-- Body -->
      <rect x="10" y="20" width="60" height="35" rx="4" fill="#f59e0b" />
      <rect x="15" y="5" width="35" height="20" rx="2" fill="#fbbf24" />
      <!-- Window -->
      <rect x="20" y="8" width="20" height="12" rx="1" fill="#38bdf8" fill-opacity="0.6" />
      <!-- Tracks -->
      <rect x="5" y="50" width="70" height="12" rx="6" fill="#334155" />
      <!-- Arm and Scoop -->
      <path d="M10 30 L-30 30 L-45 55" stroke="#94a3b8" stroke-width="8" fill="none" stroke-linecap="round" />
      <path d="M-55 45 Q-65 55 -55 70 L-35 70 Q-25 55 -35 45 Z" fill="#64748b" />
      <!-- Headlight Glow -->
      <circle cx="10" cy="35" r="15" fill="#fbbf24" fill-opacity="0.2" />
    </g>

    <!-- The Characters (The ones stopping the action) -->
    <!-- Character 1: Determined stance, arms out -->
    <g transform="translate(95, 165)">
      <!-- Legs -->
      <path d="M-5 35 L-8 50 M5 35 L8 50" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <!-- Body -->
      <path d="M-10 15 Q0 10 10 15 L8 35 L-8 35 Z" fill="#ec4899" />
      <!-- Head -->
      <circle cx="0" cy="5" r="8" fill="#ffedd5" />
      <!-- Arms outstretched in "STOP" gesture -->
      <path d="M-10 18 L-22 15" stroke="#ffedd5" stroke-width="3.5" stroke-linecap="round" />
      <path d="M10 18 L25 18" stroke="#ffedd5" stroke-width="3.5" stroke-linecap="round" />
      <!-- Hand palm facing bulldozer -->
      <rect x="25" y="12" width="4" height="12" rx="1" fill="#ffedd5" />
    </g>

    <!-- Character 2: Supporting, looking forward -->
    <g transform="translate(75, 170)">
      <path d="M-4 30 L-6 45 M4 30 L6 45" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <path d="M-8 12 Q0 8 8 12 L7 30 L-7 30 Z" fill="#38bdf8" />
      <circle cx="0" cy="3" r="7" fill="#fde68a" />
      <path d="M8 15 L18 12" stroke="#fde68a" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Environmental Details -->
    <!-- Small plants -->
    <path d="M120 200 Q122 190 125 200" stroke="#10b981" fill="none" stroke-width="2" />
    <path d="M135 202 Q137 195 140 202" stroke="#10b981" fill="none" stroke-width="2" />
    
    <!-- Stars/Night Sky details -->
    <circle cx="200" cy="40" r="1" fill="#fef3c7" />
    <circle cx="220" cy="60" r="1.5" fill="#fef3c7" />
    <circle cx="180" cy="25" r="0.8" fill="#fef3c7" />
    <circle cx="30" cy="30" r="1.2" fill="#fef3c7" />
    
    <!-- Light reflection on ground -->
    <ellipse cx="110" cy="210" rx="40" ry="5" fill="#fbbf24" fill-opacity="0.1" />
  </g>
</svg>