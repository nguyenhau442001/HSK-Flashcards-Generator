<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: A weather-tracking station or window view -->
  <path d="M40 60h160v120H40z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M40 60h160v20H40z" fill="#334155"/>
  
  <!-- The Window/Observation -->
  <circle cx="120" cy="120" r="40" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <path d="M90 120l20 20 40-40" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Character 1 (The Speaker - Pointing) -->
  <g transform="translate(40, 140)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M20 35v30M10 50l10-10 10 10" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M35 30l20-10" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (The Listener - Realization) -->
  <g transform="translate(160, 140)">
    <circle cx="20" cy="20" r="15" fill="#f59e0b"/>
    <path d="M20 35v30M10 50l10-10 10 10" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="2" fill="#0f172a"/>
    <circle cx="25" cy="15" r="2" fill="#0f172a"/>
    <path d="M12 25h16" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements to show confirmation -->
  <circle cx="180" cy="60" r="8" fill="#ec4899" opacity="0.6"/>
  <circle cx="195" cy="75" r="5" fill="#fb923c" opacity="0.6"/>
  
  <!-- Ground line -->
  <path d="M20 200h200" stroke="#334155" stroke-width="2"/>
</svg>