<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="8"/>
  
  <!-- Smartphone (The subject) -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="40" height="70" rx="6" fill="#475569"/>
    <rect x="4" y="8" width="32" height="54" rx="2" fill="#0f172a"/>
    <!-- Low battery icon representation -->
    <rect x="14" y="15" width="12" height="20" rx="2" fill="none" stroke="#ec4899" stroke-width="2"/>
    <rect x="16" y="17" width="8" height="4" fill="#ec4899"/>
  </g>
  
  <!-- Charging Cable -->
  <path d="M120 210 L120 180 C120 170 130 170 130 160" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="130" cy="160" r="4" fill="#fb923c"/>
  
  <!-- Wall Outlet -->
  <rect x="180" y="120" width="30" height="40" rx="4" fill="#64748b"/>
  <rect x="185" y="130" width="20" height="20" rx="2" fill="#0f172a"/>
  <rect x="190" y="135" width="10" height="10" rx="1" fill="#38bdf8"/>
  
  <!-- Character (Head and shoulders) -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="25" fill="#fde68a"/>
    <path d="M10 25 Q20 35 30 25" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="15" r="3" fill="#78350f"/>
    <circle cx="28" cy="15" r="3" fill="#78350f"/>
    <!-- Hand reaching for phone -->
    <path d="M35 40 L55 60" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="58" cy="65" r="6" fill="#fde68a"/>
  </g>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="160" r="20" fill="#fb923c" opacity="0.2"/>
</svg>