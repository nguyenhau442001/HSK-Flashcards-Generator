<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Bridge structure -->
  <path d="M20 180 L220 180 L200 200 L40 200 Z" fill="#475569"/>
  <path d="M30 180 L30 140 M60 180 L60 130 M90 180 L90 120 M120 180 L120 115 M150 180 L150 120 M180 180 L180 130 M210 180 L210 140" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Character standing at the edge -->
  <g transform="translate(100, 80)">
    <circle cx="20" cy="30" r="15" fill="#fbbf24"/>
    <path d="M10 50 L15 90 M30 50 L25 90" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M5 60 L35 60" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 90 L10 110 M25 90 L30 110" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- The 'Point of No Return' visual cue: A glowing edge -->
  <path d="M100 190 L140 190" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <!-- Atmospheric elements -->
  <circle cx="180" cy="50" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="40" cy="70" r="2" fill="#10b981" opacity="0.6"/>
  <circle cx="200" cy="120" r="4" fill="#ec4899" opacity="0.4"/>
  
  <!-- Distant horizon/depth -->
  <path d="M0 210 Q120 230 240 210 L240 240 L0 240 Z" fill="#0f172a" opacity="0.8"/>
</svg>