<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Confetti/Atmosphere -->
  <circle cx="40" cy="60" r="2" fill="#fb923c"/>
  <circle cx="200" cy="50" r="3" fill="#38bdf8"/>
  <circle cx="180" cy="180" r="2" fill="#ec4899"/>
  <circle cx="60" cy="190" r="3" fill="#10b981"/>

  <!-- Room Interior Details -->
  <path d="M20 180 L220 180 L210 220 L30 220 Z" fill="#334155"/>
  <rect x="80" y="40" width="80" height="120" rx="10" fill="#334155" opacity="0.5"/>
  
  <!-- Friends (The Preparers) -->
  <g transform="translate(40, 90)">
    <circle cx="0" cy="0" r="15" fill="#fbbf24"/>
    <path d="M-5 -5 h10 M-5 5 q5 5 10 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="-20" y="15" width="40" height="60" rx="5" fill="#38bdf8"/>
  </g>
  
  <g transform="translate(200, 100)">
    <circle cx="0" cy="0" r="15" fill="#fbbf24"/>
    <path d="M-5 -5 h10 M-5 5 q5 5 10 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="-20" y="15" width="40" height="60" rx="5" fill="#ec4899"/>
  </g>

  <!-- The Subject (The one surprised) -->
  <g transform="translate(120, 130)">
    <circle cx="0" cy="-20" r="20" fill="#f59e0b"/>
    <circle cx="-7" cy="-25" r="3" fill="#0f172a"/>
    <circle cx="7" cy="-25" r="3" fill="#0f172a"/>
    <ellipse cx="0" cy="-15" rx="5" ry="3" fill="#0f172a"/>
    <rect x="-25" y="0" width="50" height="80" rx="10" fill="#fb923c"/>
    <path d="M-25 20 L-40 40 M25 20 L40 40" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- The Big Surprise (Gift Box) -->
  <rect x="95" y="150" width="50" height="50" rx="5" fill="#10b981"/>
  <rect x="117" y="150" width="6" height="50" fill="#fef3c7"/>
  <rect x="95" y="172" width="50" height="6" fill="#fef3c7"/>
  <path d="M105 150 Q120 130 135 150" fill="none" stroke="#fef3c7" stroke-width="4"/>
</svg>