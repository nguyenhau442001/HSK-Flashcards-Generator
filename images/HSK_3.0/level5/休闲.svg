<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Warm Ambient Lighting / Window Glow -->
  <defs>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="plantPot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Interior Wall -->
  <rect x="15" y="15" width="210" height="155" rx="8" fill="#1e293b"/>
  
  <!-- Wooden Floor -->
  <path d="M15 170 L225 170 L235 220 L5 220 Z" fill="#334155"/>
  <path d="M15 185 L225 185" stroke="#1e293b" stroke-width="2"/>
  <path d="M10 202 L230 202" stroke="#1e293b" stroke-width="2"/>

  <!-- Large Window showing sunset/weekend vibe -->
  <rect x="35" y="30" width="60" height="90" rx="4" fill="#090d16" stroke="#475569" stroke-width="3"/>
  <!-- Sunset Gradient inside window -->
  <path d="M37 32 H93 V118 H37 Z" fill="url(#windowGlow)"/>
  <!-- Window Crossbars -->
  <line x1="65" y1="30" x2="65" y2="120" stroke="#475569" stroke-width="2"/>
  <line x1="35" y1="75" x2="95" y2="75" stroke="#475569" stroke-width="2"/>
  <!-- City silhouette outside window -->
  <path d="M40 120 L40 100 L45 95 L50 100 L50 120 L60 120 L60 85 L68 80 L75 85 L75 120 L88 120 L88 105 L92 105 L92 120 Z" fill="#1e293b"/>

  <!-- Cozy Hanging Wall Art -->
  <rect x="180" y="40" width="30" height="38" rx="2" fill="#475569"/>
  <rect x="183" y="43" width="24" height="32" rx="1" fill="#f8fafc"/>
  <circle cx="195" cy="55" r="7" fill="#fb923c"/>
  <path d="M185 70 Q195 62 205 70 Z" fill="#10b981"/>

  <!-- Potted Monstera Plant in corner -->
  <path d="M195 140 L210 170 L180 170 Z" fill="url(#plantPot)"/>
  <path d="M195 140 C190 120 170 110 165 100 C175 115 195 125 195 140 Z" fill="#10b981"/>
  <path d="M195 140 C210 120 225 115 230 105 C215 118 200 125 195 140 Z" fill="#34d399"/>
  <path d="M195 140 C195 115 180 95 180 85 C190 100 195 120 195 140 Z" fill="#059669"/>

  <!-- Floor Lamp -->
  <line x1="140" y1="170" x2="140" y2="55" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <path d="M130 55 L150 55 L155 70 L125 70 Z" fill="#fbbf24"/>
  <circle cx="140" cy="110" r="45" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Comfortable Sofa -->
  <!-- Sofa Back -->
  <rect x="75" y="85" width="100" height="50" rx="12" fill="#0284c7"/>
  <!-- Sofa Base -->
  <rect x="70" y="125" width="110" height="35" rx="8" fill="url(#sofaGrad)"/>
  <!-- Sofa Cushions -->
  <rect x="75" y="125" width="48" height="28" rx="6" fill="#38bdf8"/>
  <rect x="127" y="125" width="48" height="28" rx="6" fill="#38bdf8"/>
  <!-- Sofa Armrests -->
  <rect x="65" y="105" width="15" height="55" rx="7" fill="#0284c7"/>
  <rect x="170" y="105" width="15" height="55" rx="7" fill="#0284c7"/>

  <!-- Relaxed Character (Sitting, Cozy, Reading/Resting posture) -->
  <!-- Legs lounging on sofa -->
  <path d="M100 150 Q130 160 155 140" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Slippers -->
  <path d="M152 135 C162 135 165 145 158 148 C152 150 148 142 152 135 Z" fill="#fb923c"/>

  <!-- Torso & Hoodie -->
  <path d="M90 110 C90 95 105 90 115 100 L120 135 C110 140 95 130 90 110 Z" fill="#f43f5e"/>
  <!-- Hood behind head -->
  <path d="M95 92 C90 80 115 75 122 92 Z" fill="#e11d48"/>

  <!-- Relaxed Head & Face -->
  <circle cx="108" cy="85" r="14" fill="#ffd7ba"/>
  <!-- Closed happy eyes (relaxing/smiling) -->
  <path d="M103 84 Q106 87 109 84" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Gentle Smile -->
  <path d="M105 91 Q108 94 111 91" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Hair -->
  <path d="M94 85 C94 72 118 72 122 83 C118 78 98 78 94 85 Z" fill="#334155"/>

  <!-- Arms holding a book or relaxing -->
  <path d="M100 105 Q115 115 125 105" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="127" cy="103" r="5" fill="#ffd7ba"/>

  <!-- Cozy Coffee Table -->
  <ellipse cx="115" cy="175" rx="45" ry="14" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="90" y="179" width="6" height="15" rx="3" fill="#1e293b"/>
  <rect x="134" y="179" width="6" height="15" rx="3" fill="#1e293b"/>

  <!-- Teacup / Coffee Mug with Steam -->
  <path d="M100 168 L103 178 L111 178 L114 168 Z" fill="#f8fafc"/>
  <path d="M112 170 C116 170 116 176 112 176" stroke="#f8fafc" stroke-width="1.5" fill="none"/>
  <!-- Steam curls -->
  <path d="M104 162 Q107 158 104 154" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M109 163 Q112 159 109 155" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Open Book on Table -->
  <path d="M125 170 Q135 165 145 170 L145 178 Q135 174 125 178 Z" fill="#f8fafc"/>
  <path d="M125 170 Q115 165 105 170 L105 178 Q115 174 125 178 Z" fill="#f8fafc"/>
  <line x1="125" y1="170" x2="125" y2="178" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Cat sleeping peacefully on the floor next to sofa -->
  <ellipse cx="60" cy="180" rx="16" ry="11" fill="#fb923c"/>
  <circle cx="48" cy="178" r="9" fill="#fb923c"/>
  <!-- Cat Ears -->
  <path d="M43 172 L45 166 L49 171 Z" fill="#ea580c"/>
  <path d="M50 171 L53 166 L55 173 Z" fill="#ea580c"/>
  <!-- Cat Tail curled -->
  <path d="M72 182 Q80 185 75 175" stroke="#fb923c" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>