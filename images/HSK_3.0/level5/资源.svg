<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sky Gradient (Night/Dusk nature scene) -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Glowing Tree/Nature Energy Gradient -->
    <radialGradient id="natureGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd1a9"/>
      <stop offset="100%" stop-color="#fbc091"/>
    </linearGradient>

    <!-- Shield/Protection Forcefield Gradient -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- SCENE BACKGROUND & ENVIRONMENT -->
  <!-- Nature Landscape Clip Area inside rounded card look -->
  <g clip-path="url(#cardClip)">
    <rect x="12" y="12" width="216" height="216" rx="16" fill="url(#skyGrad)"/>

    <!-- Stars & Moon in the sky -->
    <circle cx="40" cy="45" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="85" cy="30" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="160" cy="40" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="205" cy="55" r="1" fill="#ffffff" opacity="0.7"/>
    <circle cx="195" cy="25" r="10" fill="#fef08a" opacity="0.9"/>

    <!-- Distant Mountains -->
    <polygon points="12,140 60,95 110,135 170,85 228,130 228,216 12,216" fill="#064e3b" opacity="0.5"/>
    <polygon points="12,150 75,110 130,150 190,105 228,140 228,216 12,216" fill="#047857" opacity="0.7"/>

    <!-- Flowing River (Water Resource) -->
    <path d="M 110 150 Q 130 180 120 228 L 150 228 Q 165 175 130 150 Z" fill="#0ea5e9" opacity="0.8"/>
    <path d="M 125 170 Q 135 190 128 215" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Lush Hills / Ground -->
    <path d="M 12 170 Q 70 140 130 165 Q 190 190 228 160 L 228 228 L 12 228 Z" fill="#065f46"/>
    <path d="M 12 185 Q 90 165 150 190 Q 200 210 228 190 L 228 228 L 12 228 Z" fill="#047857"/>

    <!-- Glowing Nature Energy Aura (Center) -->
    <circle cx="120" cy="140" r="60" fill="url(#natureGlow)"/>

    <!-- Central Majestic Tree (Natural Resource) -->
    <!-- Tree Trunk -->
    <path d="M 112 175 L 115 135 L 125 135 L 128 175 Z" fill="#78350f" filter="url(#softShadow)"/>
    <!-- Roots -->
    <path d="M 115 165 Q 100 175 95 180" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 125 165 Q 140 175 145 180" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Foliage Layers -->
    <circle cx="120" cy="115" r="32" fill="#10b981" filter="url(#softShadow)"/>
    <circle cx="100" cy="125" r="24" fill="#059669"/>
    <circle cx="140" cy="125" r="24" fill="#34d399"/>
    <circle cx="120" cy="95" r="22" fill="#34d399"/>

    <!-- Floating eco leaves / sparkles -->
    <path d="M 85 110 Q 90 100 95 110 Q 90 120 85 110 Z" fill="#6ee7b7" transform="rotate(15 90 110)"/>
    <path d="M 155 130 Q 160 120 165 130 Q 160 140 155 130 Z" fill="#6ee7b7" transform="rotate(-30 160 130)"/>
    <circle cx="105" cy="85" r="2" fill="#fef08a"/>
    <circle cx="145" cy="95" r="3" fill="#fef08a"/>
  </g>

  <!-- PROTECTIVE SHIELD (Concept of Protection/Conservation) -->
  <g filter="url(#softShadow)">
    <circle cx="120" cy="130" r="75" fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-dasharray="10 5"/>
    <circle cx="120" cy="130" r="72" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- FOREGROUND CHARACTERS (Active Protection / Care Scenario) -->
  <!-- Character 1: Young Woman kneeling and cupping hands toward the tree/nature -->
  <g id="characterFemale" filter="url(#softShadow)">
    <!-- Legs/Body base -->
    <path d="M 75 195 Q 85 185 95 195 L 90 215 L 70 215 Z" fill="#047857"/>
    <!-- Torso -->
    <path d="M 70 165 Q 90 155 95 195 L 65 195 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="78" cy="142" r="14" fill="url(#skinGrad)"/>
    <!-- Hair -->
    <path d="M 64 140 Q 68 125 80 125 Q 94 128 92 145 Q 92 155 88 150 Z" fill="#1e293b"/>
    <circle cx="90" cy="145" r="5" fill="#1e293b"/>
    <!-- Arm reaching forward -->
    <path d="M 85 170 Q 100 175 105 165" stroke="url(#skinGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="105" cy="164" r="4" fill="url(#skinGrad)"/>
    <!-- Friendly happy expression -->
    <path d="M 82 144 Q 85 147 88 144" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="85" cy="141" r="1.5" fill="#1e293b"/>
  </g>

  <!-- Character 2: Young Man standing with open arms, guarding/protecting the scene -->
  <g id="characterMale" filter="url(#softShadow)">
    <!-- Legs -->
    <path d="M 155 170 L 155 215 L 145 215 L 145 170 Z" fill="#1e3a8a"/>
    <path d="M 170 170 L 175 215 L 165 215 L 160 170 Z" fill="#1e3a8a"/>
    <!-- Torso / Hoodie -->
    <path d="M 145 140 Q 165 130 175 170 L 145 170 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="160" cy="118" r="13" fill="url(#skinGrad)"/>
    <!-- Hair (Cap/Spiky) -->
    <path d="M 148 114 Q 160 102 172 112 Q 170 120 165 120 Z" fill="#0f172a"/>
    <!-- Arms out in protective stance -->
    <path d="M 150 145 Q 130 150 125 140" stroke="url(#skinGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 170 145 Q 190 150 195 140" stroke="url(#skinGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Face expression -->
    <path d="M 163 119 Q 166 122 169 119" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="166" cy="116" r="1.5" fill="#1e293b"/>
  </g>

  <!-- Small details: Watering can near the female character (symbol of nurturing resources) -->
  <g transform="translate(50, 185) scale(0.7)" filter="url(#softShadow)">
    <path d="M 15 20 Q 10 10 25 10 L 35 10 Q 50 10 45 20 Z" fill="#f43f5e"/>
    <path d="M 30 10 L 30 5" stroke="#f43f5e" stroke-width="3"/>
    <path d="M 20 15 L 5 5" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <path d="M 40 15 Q 50 20 45 30" stroke="#f43f5e" stroke-width="2" fill="none"/>
  </g>

  <!-- Ambient Light / Glow highlights on frame edges -->
  <rect x="12" y="12" width="216" height="216" rx="16" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
</svg>