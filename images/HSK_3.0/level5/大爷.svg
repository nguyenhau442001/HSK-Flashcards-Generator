<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <path d="M20 180 L220 180 L220 200 L20 200 Z" fill="#334155"/>
  <circle cx="180" cy="60" r="25" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Street Sign Post -->
  <rect x="160" y="80" width="6" height="100" fill="#64748b"/>
  <rect x="150" y="70" width="26" height="15" rx="2" fill="#fb923c"/>
  
  <!-- The "Daye" (Older Man) -->
  <g transform="translate(130, 100)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 25 Q20 35 30 25" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="10" y="40" width="20" height="60" rx="5" fill="#38bdf8"/>
    <rect x="5" y="45" width="10" height="40" rx="3" fill="#38bdf8" transform="rotate(-10 10 45)"/>
    <rect x="25" y="45" width="10" height="40" rx="3" fill="#38bdf8" transform="rotate(10 35 45)"/>
    <rect x="12" y="100" width="8" height="30" rx="2" fill="#475569"/>
    <rect x="20" y="100" width="8" height="30" rx="2" fill="#475569"/>
  </g>
  
  <!-- The Traveler -->
  <g transform="translate(60, 110)">
    <circle cx="20" cy="20" r="15" fill="#fecaca"/>
    <path d="M15 15 L17 17 M23 15 L25 17" stroke="#450a0a" stroke-width="2"/>
    <rect x="5" y="40" width="30" height="70" rx="8" fill="#ec4899"/>
    <rect x="2" y="45" width="10" height="40" rx="3" fill="#ec4899" transform="rotate(20 10 45)"/>
    <rect x="28" y="45" width="10" height="40" rx="3" fill="#ec4899" transform="rotate(-20 30 45)"/>
    <rect x="10" y="110" width="8" height="20" rx="2" fill="#475569"/>
    <rect x="22" y="110" width="8" height="20" rx="2" fill="#475569"/>
    <!-- Backpack -->
    <rect x="-10" y="45" width="15" height="25" rx="4" fill="#10b981"/>
  </g>

  <!-- Speech Bubble Indicator -->
  <path d="M95 90 Q110 70 130 80" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="135" cy="80" r="4" fill="#fbbf24"/>
</svg>