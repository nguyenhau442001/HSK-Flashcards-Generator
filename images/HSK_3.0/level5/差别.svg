<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Left Object: A healthy, vibrant green potted plant -->
  <g transform="translate(60, 160)">
    <path d="M-15 0 L15 0 L10 -30 L-10 -30 Z" fill="#475569"/>
    <circle cx="0" cy="-35" r="25" fill="#10b981"/>
    <circle cx="-15" cy="-45" r="15" fill="#10b981"/>
    <circle cx="15" cy="-45" r="15" fill="#10b981"/>
  </g>
  
  <!-- Right Object: A withered, brown potted plant -->
  <g transform="translate(180, 160)">
    <path d="M-15 0 L15 0 L10 -30 L-10 -30 Z" fill="#475569"/>
    <path d="M-10 -10 L-20 -40 M0 -10 L0 -45 M10 -10 L20 -40" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-20" cy="-40" r="5" fill="#fb923c"/>
    <circle cx="20" cy="-40" r="5" fill="#fb923c"/>
  </g>
  
  <!-- Characters -->
  <!-- Character 1 (Left) -->
  <g transform="translate(70, 120)">
    <circle cx="0" cy="0" r="15" fill="#f8fafc"/>
    <rect x="-12" y="15" width="24" height="40" rx="5" fill="#38bdf8"/>
    <circle cx="-5" cy="-5" r="2" fill="#0f172a"/>
    <circle cx="5" cy="-5" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Character 2 (Right) -->
  <g transform="translate(170, 120)">
    <circle cx="0" cy="0" r="15" fill="#f8fafc"/>
    <rect x="-12" y="15" width="24" height="40" rx="5" fill="#ec4899"/>
    <path d="M-5 -5 Q0 -2 5 -5" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Magnifying glass highlighting the difference -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="20" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <line x1="14" y1="14" x2="30" y2="30" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative background elements -->
  <circle cx="40" cy="40" r="3" fill="#334155"/>
  <circle cx="200" cy="30" r="2" fill="#334155"/>
  <circle cx="150" cy="60" r="4" fill="#334155"/>
</svg>