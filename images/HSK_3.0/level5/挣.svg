<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window City Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Gold/Money Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Window Frame & Night Cityscape -->
  <g opacity="0.8">
    <rect x="140" y="25" width="75" height="110" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="144" y="29" width="32" height="102" fill="url(#window-glow)"/>
    <rect x="179" y="29" width="32" height="102" fill="url(#window-glow)"/>
    <!-- City lights/buildings outside -->
    <rect x="148" y="70" width="8" height="60" fill="#f59e0b" opacity="0.4"/>
    <rect x="160" y="50" width="6" height="80" fill="#38bdf8" opacity="0.3"/>
    <rect x="185" y="65" width="10" height="65" fill="#f59e0b" opacity="0.3"/>
    <rect x="200" y="85" width="7" height="45" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- Wall Shelf with Plant & Books -->
  <g>
    <rect x="25" y="45" width="60" height="4" rx="2" fill="#475569"/>
    <!-- Plant pot -->
    <path d="M35 45 L38 35 L46 35 L49 45 Z" fill="#cbd5e1"/>
    <path d="M42 35 Q38 28 34 30 Q39 35 42 35 Z" fill="#10b981"/>
    <path d="M42 35 Q46 25 50 28 Q45 33 42 35 Z" fill="#10b981"/>
    <path d="M42 35 Q42 24 45 25 Q43 32 42 35 Z" fill="#34d399"/>
    <!-- Small books -->
    <rect x="56" y="31" width="7" height="14" rx="1" fill="#ec4899"/>
    <rect x="63" y="28" width="8" height="17" rx="1" fill="#38bdf8"/>
    <rect x="71" y="33" width="6" height="12" rx="1" fill="#fbbf24"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 10 180 L 230 180 L 220 210 L 20 210 Z" fill="url(#desk-grad)" filter="url(#shadow)"/>
  <rect x="15" y="175" width="210" height="6" rx="3" fill="#64748b"/>

  <!-- OFFICE PROPS (DESK ITEMS) -->
  <!-- Laptop -->
  <g transform="translate(145, 140)">
    <path d="M-5 40 L55 40 L50 20 L0 20 Z" fill="#64748b"/>
    <rect x="2" y="22" width="44" height="16" rx="2" fill="url(#screen-glow)"/>
    <!-- Code/Chart lines on screen -->
    <line x1="6" y1="26" x2="20" y2="26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="31" x2="30" y2="31" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="35" x2="15" y2="35" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-10" y="40" width="70" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(195, 155)">
    <rect x="0" y="0" width="14" height="16" rx="2" fill="#f8fafc"/>
    <path d="M14 3 C18 3 18 11 14 11" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <path d="M4 -3 Q6 -6 8 -3" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- MAIN CHARACTER (HAPPILY WORKING / EARNING) -->
  <g id="character" transform="translate(75, 80)">
    <!-- Body / Torso -->
    <path d="M 25 65 C 25 50, 45 45, 60 45 C 75 45, 95 50, 95 65 L 105 100 L 15 100 Z" fill="#0284c7" filter="url(#shadow)"/>
    <!-- Collar / Shirt details -->
    <path d="M 50 45 L 60 58 L 70 45 Z" fill="#f8fafc"/>
    <line x1="60" y1="58" x2="60" y2="90" stroke="#0369a1" stroke-width="2"/>

    <!-- Left Arm (Typing/Working) -->
    <path d="M 25 60 Q 5 70, 15 90" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="15" cy="92" r="5" fill="#fcd34d"/>

    <!-- Right Arm (Raised in Joy / Success gesture) -->
    <path d="M 95 60 Q 115 50, 105 25" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="103" cy="20" r="5" fill="#fcd34d"/>

    <!-- Head & Hair -->
    <!-- Neck -->
    <rect x="53" y="38" width="14" height="10" fill="#fcd34d"/>
    <!-- Head shape -->
    <circle cx="60" cy="30" r="22" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 39 30 C 39 12, 81 12, 81 30 C 81 33, 79 26, 75 22 C 65 15, 55 15, 45 22 C 41 26, 39 33, 39 30 Z" fill="#1e293b"/>
    <!-- Glasses -->
    <circle cx="52" cy="29" r="6" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="68" cy="29" r="6" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="58" y1="29" x2="62" y2="29" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Happy Expression (Smiling mouth & eyes) -->
    <path d="M 56 37 Q 60 41 64 37" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks (Blush) -->
    <circle cx="48" cy="35" r="3" fill="#f87171" opacity="0.5"/>
    <circle cx="72" cy="35" r="3" fill="#f87171" opacity="0.5"/>
  </g>

  <!-- WEALTH / MONEY PROPS (Visualizing "Earns a lot of money") -->
  <!-- Floating Gold Coins and Cash Stack -->
  <g id="wealth-visuals">
    <!-- Coin Stack on Desk -->
    <g transform="translate(100, 160)">
      <ellipse cx="15" cy="20" rx="12" ry="5" fill="#b45309"/>
      <ellipse cx="15" cy="16" rx="12" ry="5" fill="#fbbf24"/>
      <ellipse cx="15" cy="12" rx="12" ry="5" fill="#fbbf24"/>
      <ellipse cx="15" cy="8" rx="12" ry="5" fill="#fbbf24"/>
      <ellipse cx="15" cy="4" rx="12" ry="5" fill="#fde047"/>
    </g>

    <!-- Cash Bundle / Bills -->
    <g transform="translate(30, 165) rotate(-15)">
      <rect x="0" y="0" width="30" height="18" rx="2" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
      <rect x="10" y="4" width="10" height="10" rx="1" fill="#d1fae5" opacity="0.8"/>
      <circle cx="15" cy="9" r="2.5" fill="#047857"/>
    </g>
    <g transform="translate(60, 172) rotate(10)">
      <rect x="0" y="0" width="32" height="20" rx="2" fill="#34d399" stroke="#059669" stroke-width="1.5"/>
      <rect x="11" y="5" width="10" height="10" rx="1" fill="#ecfdf5" opacity="0.8"/>
      <circle cx="16" cy="10" r="2.5" fill="#059669"/>
    </g>

    <!-- Floating / Rising Gold Coins (Action of earning) -->
    <g filter="url(#shadow)">
      <!-- Coin 1 -->
      <circle cx="115" cy="95" r="9" fill="url(#gold-grad)" stroke="#fde047" stroke-width="1.5"/>
      <text x="115" y="99" font-family="sans-serif" font-weight="bold" font-size="11" fill="#78350f" text-anchor="middle">$</text>

      <!-- Coin 2 -->
      <circle cx="135" cy="65" r="11" fill="url(#gold-grad)" stroke="#fde047" stroke-width="1.5"/>
      <text x="135" y="69" font-family="sans-serif" font-weight="bold" font-size="14" fill="#78350f" text-anchor="middle">$</text>

      <!-- Coin 3 -->
      <circle cx="95" cy="45" r="7" fill="url(#gold-grad)" stroke="#fde047" stroke-width="1.5"/>
      <text x="95" y="49" font-family="sans-serif" font-weight="bold" font-size="9" fill="#78350f" text-anchor="middle">$</text>

      <!-- Sparkles / Success indicators -->
      <path d="M 125 45 L 128 52 L 135 55 L 128 58 L 125 65 L 122 58 L 115 55 L 122 52 Z" fill="#fde047" opacity="0.9"/>
      <path d="M 85 85 L 87 90 L 92 92 L 87 94 L 85 99 L 83 94 L 78 92 L 83 90 Z" fill="#fde047" opacity="0.8"/>
    </g>
  </g>
</svg>