<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Definitions -->
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mic-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-glow)"/>

  <!-- Stage Atmosphere & Lights -->
  <path d="M 60 0 L 120 240 L 0 240 Z" fill="url(#spotlight)"/>
  <path d="M 180 0 L 240 240 L 120 240 Z" fill="url(#spotlight)"/>
  
  <ellipse cx="120" cy="185" rx="75" ry="25" fill="#0f172a" opacity="0.6"/>

  <!-- VIP Red Carpet & Base Elements -->
  <path d="M 90 240 L 150 240 L 175 185 L 65 185 Z" fill="#991b1b"/>
  <path d="M 95 240 L 145 240 L 165 185 L 75 185 Z" fill="#dc2626"/>
  
  <!-- Golden Velvet Ropes & Stanchions -->
  <circle cx="45" cy="190" r="6" fill="url(#gold-grad)"/>
  <rect x="43" y="196" width="4" height="35" fill="url(#gold-grad)"/>
  <circle cx="195" cy="190" r="6" fill="url(#gold-grad)"/>
  <rect x="193" y="196" width="4" height="35" fill="url(#gold-grad)"/>
  <path d="M 45 195 Q 120 220 195 195" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Stage Podium -->
  <path d="M 90 170 L 150 170 L 160 195 L 80 195 Z" fill="#475569"/>
  <path d="M 85 165 L 155 165 L 150 170 L 90 170 Z" fill="#64748b"/>
  <!-- Golden VIP Star Emblem on Podium -->
  <polygon points="120,174 122,179 127,180 123,183 125,188 120,185 115,188 117,183 113,180 118,179" fill="url(#gold-grad)"/>

  <!-- Main Subject: The VIP Guest (Khách quý - Writer / Distinguished Speaker) -->
  <g id="vip-guest">
    <!-- Shadow -->
    <ellipse cx="120" cy="168" rx="30" ry="10" fill="#090d16"/>

    <!-- Body / Suit -->
    <path d="M 95 125 L 145 125 L 155 170 L 85 170 Z" fill="url(#suit-grad)"/>
    <!-- Shirt -->
    <polygon points="110,125 130,125 125,150 115,150" fill="#f8fafc"/>
    <!-- Red Tie -->
    <polygon points="118,125 122,125 124,155 120,165 116,155" fill="#ef4444"/>
    <!-- Suit Lapels -->
    <path d="M 110 125 L 95 165 L 105 165 Z" fill="#334155"/>
    <path d="M 130 125 L 145 165 L 135 165 Z" fill="#334155"/>

    <!-- VIP Golden Badge on Lapel -->
    <circle cx="102" cy="140" r="4" fill="url(#gold-grad)"/>
    <circle cx="102" cy="140" r="2.5" fill="#b45309"/>

    <!-- Neck & Head -->
    <rect x="113" y="112" width="14" height="15" fill="#fbcfe8" rx="4"/>
    <circle cx="120" cy="98" r="18" fill="#fbcfe8"/>

    <!-- Hair (Stylish, Distinguished) -->
    <path d="M 102 98 C 102 85, 110 80, 120 80 C 132 80, 138 86, 138 98 C 138 92, 135 84, 120 83 C 105 83, 102 92, 102 98 Z" fill="#1e293b"/>
    <path d="M 104 94 C 108 88, 115 85, 122 86 C 114 86, 107 90, 104 94 Z" fill="#334155"/>

    <!-- Friendly, Confident Facial Expression -->
    <!-- Smiling Eyes -->
    <path d="M 111 96 Q 114 93 117 96" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 123 96 Q 126 93 129 96" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Glasses (Intellectual Look for a Writer) -->
    <rect x="108" y="92" width="10" height="7" rx="2" fill="none" stroke="url(#gold-grad)" stroke-width="1.5"/>
    <rect x="122" y="92" width="10" height="7" rx="2" fill="none" stroke="url(#gold-grad)" stroke-width="1.5"/>
    <line x1="118" y1="95" x2="122" y2="95" stroke="url(#gold-grad)" stroke-width="1.5"/>
    <!-- Warm Smile -->
    <path d="M 116 104 Q 120 108 124 104" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks (Warm Glow) -->
    <circle cx="110" cy="101" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="130" cy="101" r="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Gesturing Hands (Welcoming / Presenting) -->
    <!-- Left Arm & Hand (Waving / Greeting) -->
    <path d="M 95 130 C 80 130, 75 115, 70 110" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <circle cx="68" cy="108" r="5" fill="#fbcfe8"/>

    <!-- Right Arm (Holding Microphone Stand) -->
    <path d="M 145 130 C 155 140, 155 155, 155 170" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <circle cx="155" cy="155" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Professional Microphone & Stand Setup -->
  <g id="microphone-setup">
    <!-- Stand Base -->
    <ellipse cx="140" cy="195" rx="12" ry="4" fill="#64748b"/>
    <!-- Pole -->
    <line x1="140" y1="195" x2="140" y2="120" stroke="url(#mic-metal)" stroke-width="3" stroke-linecap="round"/>
    <!-- Boom Arm -->
    <path d="M 140 125 L 130 110" fill="none" stroke="url(#mic-metal)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Mic Head -->
    <ellipse cx="127" cy="107" rx="5" ry="7" fill="url(#mic-metal)"/>
    <path d="M 124 104 Q 127 102 130 104" fill="none" stroke="#334155" stroke-width="1"/>
    <path d="M 124 107 Q 127 105 130 107" fill="none" stroke="#334155" stroke-width="1"/>
    <!-- Sound Wave Pulses (Action/Activity vibe) -->
    <path d="M 118 102 C 114 104, 114 110, 118 112" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 115 99 C 109 103, 109 111, 115 115" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Floating VIP / Literary Elements (Contextual props) -->
  <!-- Floating Book (Representing 'Nhà văn' / Writer guest) -->
  <g transform="translate(35, 90) rotate(-15)">
    <polygon points="10,10 25,5 40,10 40,30 25,25 10,30" fill="#f8fafc"/>
    <polygon points="25,5 40,10 40,30 25,25" fill="#cbd5e1"/>
    <!-- Book Pages Lines -->
    <line x1="14" y1="15" x2="21" y2="13" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="19" x2="21" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="29" y1="15" x2="36" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="29" y1="19" x2="36" y2="21" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 25 5 L 25 25" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Floating Golden Spotlight Sparkles -->
  <g filter="url(#glow)">
    <circle cx="170" cy="70" r="3" fill="#fbbf24"/>
    <polygon points="185,110 187,115 192,117 187,119 185,124 183,119 178,117 183,115" fill="url(#gold-grad)"/>
    <polygon points="65,70 66,73 69,74 66,75 65,78 64,75 61,74 64,73" fill="url(#gold-grad)"/>
    <circle cx="95" cy="55" r="2" fill="#f43f5e"/>
    <circle cx="145" cy="65" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Confetti / Gala Atmosphere Floating Elements -->
  <rect x="175" y="130" width="6" height="4" rx="1" fill="#ec4899" transform="rotate(25 178 132)"/>
  <rect x="55" y="145" width="5" height="7" rx="1" fill="#38bdf8" transform="rotate(-15 57 148)"/>
  <circle cx="80" cy="80" r="3" fill="#10b981" opacity="0.8"/>
  <circle cx="165" cy="95" r="2.5" fill="#f59e0b" opacity="0.9"/>
</svg>