<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sign Post Gradient -->
    <linearGradient id="metal-pole" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sign Plate Gradient -->
    <linearGradient id="sign-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Aura -->
    <radialGradient id="sign-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Foliage Gradient 1 -->
    <linearGradient id="bush-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Foliage Gradient 2 -->
    <linearGradient id="bush-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Path Gradient -->
    <linearGradient id="path-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric background details (soft glowing stars/lights) -->
  <circle cx="40" cy="50" r="1.5" fill="#fef08a" opacity="0.6" />
  <circle cx="200" cy="40" r="2" fill="#38bdf8" opacity="0.4" />
  <circle cx="210" cy="110" r="1" fill="#fef08a" opacity="0.8" />
  <circle cx="30" cy="130" r="1.5" fill="#38bdf8" opacity="0.5" />

  <!-- Distant Hills / Environment -->
  <path d="M 0 180 Q 60 140 120 170 T 240 160 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.8" />

  <!-- Winding Path / Trail -->
  <path d="M 120 240 Q 130 180 170 140 T 220 90 L 240 95 L 240 240 Z" fill="url(#path-grad)" opacity="0.5" />
  <path d="M 125 240 Q 133 185 172 143 T 220 95" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Bushes and Foliage (Foreground Left & Right) -->
  <circle cx="45" cy="205" r="35" fill="url(#bush-grad-1)" />
  <circle cx="25" cy="215" r="25" fill="url(#bush-grad-2)" />
  <circle cx="75" cy="210" r="25" fill="url(#bush-grad-2)" />

  <circle cx="205" cy="215" r="30" fill="url(#bush-grad-1)" />
  <circle cx="225" cy="220" r="20" fill="url(#bush-grad-2)" />

  <!-- Detailed Sign Post (The 'Biāozhì' / Landmark / Sign) -->
  <!-- Post Shadow -->
  <ellipse cx="120" cy="215" rx="10" ry="4" fill="#020617" opacity="0.6" />

  <!-- Glowing Aura behind Sign -->
  <circle cx="120" cy="100" r="60" fill="url(#sign-glow)" />

  <!-- Metal Pole -->
  <rect x="116" y="110" width="8" height="105" rx="2" fill="url(#metal-pole)" />
  <!-- Pole Highlight -->
  <rect x="118" y="110" width="2" height="105" fill="#cbd5e1" opacity="0.5" />

  <!-- Sign Plate Mount / Bracket -->
  <rect x="113" y="105" width="14" height="8" rx="2" fill="#334155" />
  <rect x="110" y="70" width="20" height="40" rx="3" fill="#475569" />

  <!-- Main Signboard (Diamond/Compass Rose Style Landmark Sign) -->
  <g transform="translate(120, 85)">
    <!-- Outer Glow Rim -->
    <path d="M 0 -45 L 45 0 L 0 45 L -45 0 Z" fill="#bae6fd" opacity="0.3" />
    
    <!-- Sign Body -->
    <path d="M 0 -40 L 40 0 L 0 40 L -40 0 Z" fill="url(#sign-plate)" stroke="#f8fafc" stroke-width="3" stroke-linejoin="round" />

    <!-- Inner Border Line -->
    <path d="M 0 -31 L 31 0 L 0 31 L -31 0 Z" fill="none" stroke="#e0f2fe" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8" />

    <!-- Directional Icon Inside the Sign (Stylized Compass / Arrow guiding the way) -->
    <circle cx="0" cy="0" r="6" fill="#fef08a" />
    <!-- North Arrow -->
    <polygon points="0,-24 5,-6 -5,-6" fill="#fef08a" />
    <!-- South Arrow -->
    <polygon points="0,24 5,6 -5,6" fill="#ffffff" opacity="0.7" />
    <!-- East Arrow -->
    <polygon points="24,0 6,5 6,-5" fill="#ffffff" opacity="0.9" />
    <!-- West Arrow -->
    <polygon points="-24,0 -6,5 -6,-5" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Secondary Smaller Sign (Pointing left) -->
  <g transform="translate(75, 135)">
    <rect x="-22" y="-10" width="44" height="20" rx="4" fill="#fbbf24" stroke="#fef3c7" stroke-width="2" />
    <!-- Arrow pointer path inside small sign -->
    <path d="M -12 0 L -6 -5 L -6 5 Z" fill="#78350f" />
    <rect x="-2" y="-2" width="12" height="4" rx="2" fill="#78350f" opacity="0.8" />
  </g>
  <!-- Small sign pole -->
  <rect x="73" y="145" width="4" height="60" rx="1" fill="url(#metal-pole)" />
  <!-- Small sign shadow -->
  <ellipse cx="75" cy="205" rx="5" ry="2" fill="#020617" opacity="0.5" />

  <!-- Glowing Fireflies / Magical Particles floating near the sign -->
  <circle cx="95" cy="80" r="2.5" fill="#fbbf24" filter="drop-shadow(0px 0px 4px #fbbf24)" />
  <circle cx="150" cy="105" r="2" fill="#38bdf8" filter="drop-shadow(0px 0px 4px #38bdf8)" />
  <circle cx="135" cy="60" r="1.5" fill="#34d399" />
  <circle cx="90" cy="115" r="2" fill="#fbbf24" />

  <!-- Cute interactive elements: Tiny glowing mushrooms at the base -->
  <path d="M 100 205 Q 100 200 105 200 Q 110 200 110 205 Z" fill="#f8fafc" />
  <circle cx="105" cy="198" r="5" fill="#f43f5e" />
  <circle cx="103" cy="197" r="1" fill="#ffffff" />
  <circle cx="107" cy="199" r="0.8" fill="#ffffff" />

  <path d="M 130 208 Q 130 203 134 203 Q 138 203 138 208 Z" fill="#f8fafc" />
  <circle cx="134" cy="201" r="4" fill="#38bdf8" />
  <circle cx="133" cy="200" r="0.8" fill="#ffffff" />

  <!-- Foreground Lighting/Vignette Overlay (Frame effect) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>