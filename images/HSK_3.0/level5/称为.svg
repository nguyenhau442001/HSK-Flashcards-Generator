<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Beijing Landmark (Temple of Heaven silhouette) -->
  <path d="M120 60 L150 90 L90 90 Z" fill="#fbbf24" opacity="0.3"/>
  <path d="M100 90 L140 90 L135 120 L105 120 Z" fill="#fb923c"/>
  <path d="M105 120 L135 120 L130 140 L110 140 Z" fill="#f59e0b"/>
  
  <!-- Teacher Character -->
  <g transform="translate(40, 120)">
    <circle cx="20" cy="20" r="15" fill="#e2e8f0"/>
    <path d="M10 40 Q20 60 30 40 L30 80 L10 80 Z" fill="#38bdf8"/>
    <path d="M20 70 L20 110" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 80 L35 80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Student Character -->
  <g transform="translate(160, 130)">
    <circle cx="20" cy="20" r="12" fill="#e2e8f0"/>
    <path d="M10 35 Q20 50 30 35 L25 70 L15 70 Z" fill="#ec4899"/>
    <path d="M20 65 L15 90" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 65 L25 90" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Pointer/Gesture -->
  <path d="M75 140 L100 120" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="120" r="4" fill="#fbbf24"/>
  
  <!-- Map/Globe element -->
  <circle cx="120" cy="180" r="30" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M100 180 Q120 160 140 180 Q120 200 100 180" fill="#10b981" opacity="0.2"/>
  
  <!-- Decorative stars -->
  <circle cx="30" cy="40" r="2" fill="#f59e0b"/>
  <circle cx="200" cy="50" r="3" fill="#38bdf8"/>
  <circle cx="210" cy="190" r="2" fill="#ec4899"/>
</svg>