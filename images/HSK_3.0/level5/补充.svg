<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Energy/Idea Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Mug Gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Liquid/Supplement Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Document Paper Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Ambient Glow representing "adding/supplementing" -->
  <circle cx="150" cy="110" r="50" fill="#fbbf24" opacity="0.07" filter="url(#glow)" />
  <circle cx="80" cy="140" r="40" fill="#38bdf8" opacity="0.07" filter="url(#glow)" />

  <!-- Workspace / Table Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#tableGrad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" />

  <!-- Base Document / Notebook (The main context) -->
  <g transform="rotate(-6 95 135)" filter="url(#shadow)">
    <!-- Paper background -->
    <rect x="45" y="75" width="100" height="120" rx="4" fill="#f8fafc" />
    <!-- Notebook binding stripe -->
    <rect x="45" y="75" width="12" height="120" fill="#cbd5e1" />
    <!-- Notebook lines -->
    <line x1="67" y1="95" x2="130" y2="95" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="67" y1="110" x2="120" y2="110" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="67" y1="125" x2="135" y2="125" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="67" y1="140" x2="110" y2="140" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Overlay Sticky Note / Added Idea (Representing the 'Bổ sung' action) -->
  <g transform="rotate(12 145 110)" filter="url(#shadow)">
    <!-- Sticky note base (Amber/Gold for energy/ideas) -->
    <rect x="105" y="70" width="80" height="80" rx="2" fill="#fbbf24" />
    <!-- Sticky note fold/shadow detail -->
    <polygon points="175,140 185,150 185,140" fill="#d97706" opacity="0.4" />
    <!-- Graphic representation of written thoughts (lines/checkmarks) -->
    <path d="M 115 90 L 130 105 L 165 85" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="115" y1="120" x2="160" y2="120" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="115" y1="135" x2="145" y2="135" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Action Pen / Marker actively writing the supplement -->
  <g transform="rotate(-35 150 140)" filter="url(#shadow)">
    <!-- Pen Body -->
    <rect x="142" y="80" width="16" height="70" rx="3" fill="#ec4899" />
    <!-- Pen Grip -->
    <rect x="142" y="130" width="16" height="15" fill="#be185d" />
    <!-- Pen Tip -->
    <polygon points="142,150 158,150 150,170" fill="#0f172a" />
    <!-- Metal accent ring -->
    <rect x="142" y="148" width="16" height="3" fill="#cbd5e1" />
  </g>

  <!-- Sparkling / Floating "Addition" Elements (Bursting out of the sticky note) -->
  <g filter="url(#glow)">
    <!-- Glowing Star/Spark 1 -->
    <path d="M 175 55 Q 175 65 185 65 Q 175 65 175 75 Q 175 65 165 65 Q 175 65 175 55 Z" fill="#fef08a" />
    <!-- Glowing Star/Spark 2 -->
    <path d="M 120 45 Q 120 52 127 52 Q 120 52 120 59 Q 120 52 113 52 Q 120 52 120 45 Z" fill="#38bdf8" />
    <!-- Small energetic dots -->
    <circle cx="195" cy="85" r="3" fill="#fbbf24" />
    <circle cx="100" cy="55" r="2" fill="#34d399" />
  </g>

  <!-- Supplementary Coffee Mug on the side (Adding extra context of a working environment) -->
  <g filter="url(#shadow)">
    <!-- Mug Body -->
    <path d="M 25 155 L 55 155 L 52 200 C 52 203 49 205 45 205 L 35 205 C 31 205 28 203 28 200 Z" fill="url(#mugGrad)" />
    <!-- Mug Rim -->
    <ellipse cx="40" cy="155" rx="15" ry="3" fill="#7dd3fc" />
    <!-- Liquid inside -->
    <ellipse cx="40" cy="156" rx="13" ry="2" fill="url(#liquidGrad)" />
    <!-- Mug Handle -->
    <path d="M 53 165 C 65 165 65 190 50 195" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <!-- Steam / Supplement Vapors -->
    <path d="M 35 142 C 35 135 45 135 45 128 C 45 121 35 121 35 114" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Foreground Dynamic Accent Arrow curving into the note (Visualizing 'Bổ sung' / addition) -->
  <path d="M 180 160 C 200 140 190 100 165 85" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6" filter="url(#glow)" />
  <polygon points="163,79 160,92 172,88" fill="#34d399" />

</svg>