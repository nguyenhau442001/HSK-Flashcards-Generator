  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Building Exterior/Window Frame -->
  <rect x="20" y="20" width="200" height="200" rx="10" fill="#334155" stroke="#475569" stroke-width="4"/>
