<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Warehouse Lights -->
    <linearGradient id="lightGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <!-- Box Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Warehouse Interior -->
  <!-- Back Wall -->
  <rect x="20" y="40" width="200" height="130" fill="#1e293b" />
  
  <!-- Industrial Ceiling Beams & Light -->
  <path d="M20 40 L120 20 L220 40" stroke="#334155" stroke-width="4" fill="none" />
  <rect x="100" y="24" width="40" height="8" rx="2" fill="#475569" />
  <polygon points="110,32 130,32 140,80 100,80" fill="url(#lightGlow)" />
  <circle cx="120" cy="32" r="4" stop-color="#fef3c7" fill="#fef3c7" />

  <!-- Metal Racking / Shelves in Background -->
  <g stroke="#334155" stroke-width="3" fill="none">
    <!-- Left Rack -->
    <line x1="20" y1="60" x2="20" y2="170" />
    <line x1="20" y1="90" x2="65" y2="90" />
    <line x1="20" y1="130" x2="65" y2="130" />
    <!-- Right Rack -->
    <line x1="220" y1="60" x2="220" y2="170" />
    <line x1="175" y1="90" x2="220" y2="90" />
    <line x1="175" y1="130" x2="220" y2="130" />
  </g>

  <!-- Background Cargo Boxes on Racks -->
  <rect x="26" y="100" width="16" height="30" rx="2" fill="#d97706" opacity="0.7"/>
  <rect x="44" y="105" width="18" height="25" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="182" y="98" width="22" height="32" rx="2" fill="#10b981" opacity="0.6"/>

  <!-- Warehouse Floor -->
  <polygon points="20,170 220,170 240,210 0,210" fill="#0f172a" />
  <!-- Safety Lines on Floor -->
  <path d="M40 190 L200 190" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />

  <!-- PROP: Transport Pallet with Stack of Cargo (Những hàng hóa này) -->
  <g id="cargo-pallet">
    <!-- Wooden Pallet Base -->
    <rect x="75" y="155" width="90" height="15" rx="2" fill="#92400e" />
    <rect x="80" y="163" width="80" height="5" fill="#78350f" />
    <rect x="85" y="148" width="12" height="10" fill="#78350f" />
    <rect x="143" y="148" width="12" height="10" fill="#78350f" />

    <!-- Box 1 (Bottom Left) -->
    <path d="M 85 148 L 115 138 L 115 115 L 85 125 Z" fill="url(#boxSide)" />
    <path d="M 115 138 L 145 148 L 145 125 L 115 115 Z" fill="url(#boxFront)" />
    <path d="M 85 125 L 115 115 L 145 125 L 115 135 Z" fill="url(#boxTop)" />

    <!-- Box 2 (Bottom Right) -->
    <path d="M 145 148 L 170 138 L 170 118 L 145 128 Z" fill="url(#boxSide)" />
    <path d="M 170 138 L 195 148 L 195 128 L 170 118 Z" fill="url(#boxFront)" />
    <path d="M 145 128 L 170 118 L 195 128 L 170 138 Z" fill="url(#boxTop)" />

    <!-- Box 3 (Top Center - Main focal cargo item needing transport) -->
    <path d="M 105 115 L 135 105 L 135 80 L 105 90 Z" fill="url(#boxSide)" />
    <path d="M 135 105 L 165 115 L 165 90 L 135 80 Z" fill="url(#boxFront)" />
    <path d="M 105 90 L 135 80 L 165 90 L 135 100 Z" fill="url(#boxTop)" />
    
    <!-- Fragile / Handling Tape Details on Top Box -->
    <line x1="140" y1="92" x2="160" y2="99" stroke="#ef4444" stroke-width="3" />
    <line x1="115" y1="99" x2="130" y2="93" stroke="#ef4444" stroke-width="3" />
  </g>

  <!-- CHARACTER: Logistics Worker / Courier (Ready to transport) -->
  <g id="worker">
    <!-- Legs & Boots -->
    <path d="M 85 175 L 85 210 L 97 210 L 97 185 Z" fill="#334155" />
    <path d="M 108 175 L 108 210 L 120 210 L 120 185 Z" fill="#334155" />
    <rect x="80" y="206" width="20" height="6" rx="2" fill="#0f172a" />
    <rect x="106" y="206" width="20" height="6" rx="2" fill="#0f172a" />

    <!-- Body / Torso (High-visibility vest and uniform) -->
    <path d="M 78 120 L 128 120 L 135 180 L 70 180 Z" fill="#1e293b" />
    <!-- Safety Vest -->
    <path d="M 76 120 L 130 120 L 133 178 L 73 178 Z" fill="#f59e0b" />
    <!-- Vest Reflective Stripes -->
    <path d="M 88 120 L 93 178 M 118 120 L 113 178" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <path d="M 74 140 L 131 140" stroke="#fef3c7" stroke-width="4" />

    <!-- Head & Face -->
    <circle cx="103" cy="98" r="16" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 88 95 Q 103 80 118 95 L 116 88 Q 103 78 90 88 Z" fill="#334155" />
    <!-- Cap (Delivery / Logistics Cap) -->
    <path d="M 87 90 Q 103 82 119 90 L 125 93 L 83 93 Z" fill="#0284c7" />
    <path d="M 115 92 L 135 96 L 133 99 L 115 95 Z" fill="#0284c7" />

    <!-- Facial Expression (Determined, ready for action) -->
    <circle cx="98" cy="98" r="1.5" fill="#1e293b" />
    <circle cx="108" cy="98" r="1.5" fill="#1e293b" />
    <path d="M 101 106 Q 103 108 105 106" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Arms & Clipboard (Checking manifests/shipment) -->
    <!-- Left Arm holding clipboard -->
    <path d="M 78 125 L 60 145 L 70 155 L 85 135 Z" fill="#0284c7" />
    <!-- Clipboard Prop -->
    <rect x="52" y="135" width="22" height="28" rx="2" fill="#cbd5e1" transform="rotate(-15 52 135)" />
    <rect x="58" y="138" width="10" height="14" fill="#ffffff" transform="rotate(-15 52 135)" />
    <line x1="60" y1="143" x2="66" y2="143" stroke="#64748b" stroke-width="1.5" transform="rotate(-15 52 135)" />
    <line x1="60" y1="147" x2="65" y2="147" stroke="#64748b" stroke-width="1.5" transform="rotate(-15 52 135)" />

    <!-- Right Arm pointing / gesturing to cargo (Ready to transport) -->
    <path d="M 125 125 L 145 135 L 138 148 L 120 135 Z" fill="#0284c7" />
    <circle cx="147" cy="138" r="5" fill="#fbcfe8" />
  </g>

  <!-- CONTEXT ACCENTS: Transport Truck Icon Silhouette through Open Warehouse Door / Window -->
  <g id="outdoor-transport" transform="translate(160, 45)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="55" height="65" rx="4" fill="#0284c7" opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="32" x2="55" y2="32" stroke="#38bdf8" stroke-width="2" />
    <line x1="27" y1="0" x2="27" y2="65" stroke="#38bdf8" stroke-width="2" />

    <!-- Truck Silhouette inside window -->
    <g transform="translate(8, 20) scale(0.6)">
      <!-- Truck Trailer -->
      <rect x="0" y="10" width="45" height="30" rx="2" fill="#38bdf8" />
      <!-- Truck Cab -->
      <path d="M 45 20 L 58 20 L 68 32 L 68 40 L 45 40 Z" fill="#bae6fd" />
      <!-- Wheels -->
      <circle cx="15" cy="42" r="6" fill="#0f172a" />
      <circle cx="15" cy="42" r="2" fill="#94a3b8" />
      <circle cx="55" cy="42" r="6" fill="#0f172a" />
      <circle cx="55" cy="42" r="2" fill="#94a3b8" />
      <!-- Motion lines -->
      <line x1="-8" y1="20" x2="-3" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="-12" y1="28" x2="-5" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- FOREGROUND ACCENTS: Barcode Scanner / Logistics Tool on Floor -->
  <g transform="translate(45, 175)">
    <path d="M 5 0 L 15 0 L 18 12 L 2 12 Z" fill="#0f172a" />
    <path d="M 8 12 L 12 12 L 10 22 Z" fill="#334155" />
    <path d="M 12 3 L 16 6" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Glowing Accent Sparkle for action emphasis -->
  <path d="M 135 70 L 138 78 L 146 81 L 138 84 L 135 92 L 132 84 L 124 81 L 132 78 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M 68 105 L 70 109 L 74 111 L 70 113 L 68 117 L 66 113 L 62 111 L 66 109 Z" fill="#fbbf24" opacity="0.9" />

</svg>