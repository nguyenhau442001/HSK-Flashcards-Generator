<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Bowl 1 Gradient (Spicy/Red) -->
    <linearGradient id="bowl1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Bowl 2 Gradient (Sweet/Green) -->
    <linearGradient id="bowl2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Behind Bowls representing diverse tastes -->
  <circle cx="85" cy="130" r="45" fill="#ef4444" opacity="0.15" filter="url(#glow)"/>
  <circle cx="155" cy="130" r="45" fill="#10b981" opacity="0.15" filter="url(#glow)"/>

  <!-- Restaurant Table Surface -->
  <path d="M 0 160 Q 120 150 240 160 L 240 220 Q 120 230 0 220 Z" fill="url(#tableGrad)" filter="url(#shadow)"/>
  <!-- Table Wood Highlight Line -->
  <path d="M 0 163 Q 120 153 240 163" stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- ==================== LEFT BOWL (Spicy / Bold Taste) ==================== -->
  <g id="spicyBowl" filter="url(#shadow)">
    <!-- Chopsticks Left -->
    <line x1="55" y1="75" x2="115" y2="125" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="65" y1="70" x2="120" y2="120" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bowl Base/Shadow -->
    <ellipse cx="85" cy="155" rx="35" ry="10" fill="#000000" opacity="0.3"/>
    
    <!-- Bowl Body -->
    <path d="M 50 135 C 50 165, 120 165, 120 135 Z" fill="url(#bowl1Grad)"/>
    <!-- Bowl Rim -->
    <ellipse cx="85" cy="135" rx="35" ry="9" fill="#ef4444"/>
    <ellipse cx="85" cy="135" rx="31" ry="7" fill="#450a0a"/>

    <!-- Broth (Spicy Chili Oil - Red/Orange) -->
    <ellipse cx="85" cy="137" rx="30" ry="6" fill="#7f1d1d"/>
    <ellipse cx="85" cy="137" rx="27" ry="5" fill="#b91c1c"/>

    <!-- Food Contents: Noodles & Chili Peppers -->
    <path d="M 70 137 Q 78 132, 85 137 Q 92 142, 100 137" stroke="#fde047" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 73 139 Q 80 134, 88 139 Q 95 144, 102 139" stroke="#fde047" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Floating Chili Peppers -->
    <path d="M 75 134 Q 78 130, 82 135 Z" fill="#ef4444"/>
    <path d="M 92 138 Q 96 135, 98 140 Z" fill="#dc2626"/>
    <circle cx="80" cy="139" r="1.5" fill="#fb923c"/>
    <circle cx="90" cy="135" r="1.5" fill="#fb923c"/>

    <!-- Rising Steam 1 -->
    <path d="M 75 125 Q 70 110, 80 95 Q 90 80, 85 65" stroke="url(#steamGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>


  <!-- ==================== RIGHT BOWL (Fresh / Sweet Taste) ==================== -->
  <g id="freshBowl" filter="url(#shadow)">
    <!-- Chopsticks Right -->
    <line x1="185" y1="75" x2="125" y2="125" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="175" y1="70" x2="120" y2="120" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bowl Base/Shadow -->
    <ellipse cx="155" cy="155" rx="35" ry="10" fill="#000000" opacity="0.3"/>
    
    <!-- Bowl Body -->
    <path d="M 120 135 C 120 165, 190 165, 190 135 Z" fill="url(#bowl2Grad)"/>
    <!-- Bowl Rim -->
    <ellipse cx="155" cy="135" rx="35" ry="9" fill="#10b981"/>
    <ellipse cx="155" cy="135" rx="31" ry="7" fill="#064e3b"/>

    <!-- Soup/Broth (Clear/Greenish) -->
    <ellipse cx="155" cy="137" rx="30" ry="6" fill="#047857"/>
    <ellipse cx="155" cy="137" rx="27" ry="5" fill="#059669"/>

    <!-- Food Contents: Leafy Greens & Dumpling/Ingredient -->
    <path d="M 140 137 Q 148 133, 155 138 Q 162 143, 170 137" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Green Veggie Leaves -->
    <path d="M 145 135 C 148 131, 153 131, 155 136 Z" fill="#84cc16"/>
    <path d="M 160 138 C 163 134, 168 135, 167 140 Z" fill="#84cc16"/>
    <!-- Garnish Dot -->
    <circle cx="150" cy="138" r="2" fill="#fde047"/>

    <!-- Rising Steam 2 -->
    <path d="M 165 125 Q 170 110, 160 95 Q 150 80, 155 65" stroke="url(#steamGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ==================== CONDIMENT / EXTRA PROPS ==================== -->
  <!-- Small condiment dish in the middle -->
  <ellipse cx="120" cy="165" rx="14" ry="6" fill="#000000" opacity="0.3"/>
  <path d="M 108 153 C 108 165, 132 165, 132 153 Z" fill="#cbd5e1"/>
  <ellipse cx="120" cy="153" rx="12" ry="4" fill="#94a3b8"/>
  <ellipse cx="120" cy="154" rx="9" ry="3" fill="#ea580c"/> <!-- Sauce inside -->

  <!-- Small spoon resting -->
  <path d="M 98 160 Q 104 163, 112 158" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="97" cy="160" r="3" fill="#94a3b8"/>

  <!-- ==================== ATMOSPHERIC SPARKLES / FLARES ==================== -->
  <g fill="#fbbf24" opacity="0.8">
    <!-- Star sparkle left -->
    <path d="M 45 90 Q 45 95, 40 95 Q 45 95, 45 100 Q 45 95, 50 95 Q 45 95, 45 90" />
    <!-- Star sparkle right -->
    <path d="M 195 90 Q 195 95, 190 95 Q 195 95, 195 100 Q 195 95, 200 95 Q 195 95, 195 90" />
    <!-- Tiny dots -->
    <circle cx="35" cy="120" r="1.5" opacity="0.5"/>
    <circle cx="205" cy="125" r="2" opacity="0.6"/>
    <circle cx="120" cy="50" r="1.5" opacity="0.4"/>
  </g>

</svg>