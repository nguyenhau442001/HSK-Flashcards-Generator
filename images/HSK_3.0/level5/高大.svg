<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Context: Doorframe and Wall -->
  <rect x="80" y="30" width="80" height="180" rx="4" fill="#334155"/>
  <rect x="85" y="35" width="70" height="170" rx="2" fill="#1e293b"/>
  
  <!-- Subject: Tall Man -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-15 10 L15 10 L10 80 L-10 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="18" fill="#fbbf24"/>
    <!-- Arms -->
    <path d="M-15 20 L-35 50 M15 20 L35 50" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M-8 80 L-12 115 M8 80 L12 115" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Comparison Context: Short Friend -->
  <g transform="translate(60, 160)">
    <path d="M-10 10 L10 10 L8 60 L-8 60 Z" fill="#ec4899"/>
    <circle cx="0" cy="-10" r="14" fill="#fbbf24"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="50" r="3" fill="#fb923c"/>
  <circle cx="40" cy="180" r="2" fill="#10b981"/>
  <path d="M180 150 L195 150 M187.5 142.5 L187.5 157.5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
</svg>