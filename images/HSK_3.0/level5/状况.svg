<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Medical/Health Status Context: A doctor's clipboard and diagnostic monitor -->
  <!-- Monitor screen -->
  <rect x="50" y="60" width="140" height="90" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
  <path d="M60 105 L85 105 L95 80 L110 130 L125 105 L150 105" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Clipboard -->
  <rect x="70" y="120" width="100" height="100" rx="6" fill="#f8fafc"/>
  <rect x="90" y="110" width="60" height="15" rx="2" fill="#94a3b8"/>
  <line x1="90" y1="145" x2="150" y2="145" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="90" y1="165" x2="150" y2="165" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="90" y1="185" x2="130" y2="185" stroke="#e2e8f0" stroke-width="4"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="50" r="15" fill="#f59e0b" opacity="0.3"/>
  <circle cx="40" cy="190" r="20" fill="#38bdf8" opacity="0.2"/>
  
  <!-- Stethoscope head -->
  <circle cx="180" cy="180" r="18" fill="#fb923c"/>
