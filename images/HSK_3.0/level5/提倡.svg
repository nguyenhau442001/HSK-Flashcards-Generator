<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 200 C 80 180, 160 180, 240 200 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Tree Trunk -->
  <rect x="110" y="120" width="20" height="90" rx="4" fill="#94a3b8"/>
  
  <!-- Tree Canopy (The act of encouraging growth/environment) -->
  <circle cx="120" cy="100" r="50" fill="#10b981"/>
  <circle cx="85" cy="110" r="35" fill="#059669"/>
  <circle cx="155" cy="110" r="35" fill="#059669"/>
  
  <!-- Character: Enthusiastic person pointing to the tree -->
  <g transform="translate(40, 130)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M20 35 L 20 70 M 20 45 L 5 60 M 20 45 L 35 60" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 30 L 60 20" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Floating Eco-icons (Representing the 'advocacy' aspect) -->
  <path d="M180 60 L 190 40 L 200 60 Z" fill="#38bdf8"/>
  <circle cx="210" cy="80" r="8" fill="#ec4899"/>
  <rect x="170" y="90" width="12" height="12" rx="2" fill="#fb923c"/>
  
  <!-- Sunlight/Glow -->
  <circle cx="200" cy="40" r="20" fill="#f59e0b" opacity="0.3"/>
  <circle cx="200" cy="40" r="10" fill="#f59e0b"/>
</svg>