<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="windowGradient" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="deskGradient" x1="0" y1="0" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="120" cy="80" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Rounded window clip -->
    <clipPath id="windowClip">
      <rect x="24" y="24" width="80" height="90" rx="12"/>
    </clipPath>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Ambient background glow from desk lamp -->
  <circle cx="150" cy="110" r="80" fill="url(#lampGlow)"/>

  <!-- WINDOW SCENERY (Night time, cozy city vibe) -->
  <rect x="24" y="24" width="80" height="90" rx="12" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <g clip-path="url(#windowClip)">
    <!-- Night sky gradient -->
    <rect x="24" y="24" width="80" height="90" fill="url(#windowGradient)"/>
    <!-- Distant Cityscape -->
    <path d="M30 114 L30 80 L38 80 L38 114 Z" fill="#1e1b4b"/>
    <path d="M42 114 L42 65 L55 65 L55 114 Z" fill="#17153b"/>
    <path d="M58 114 L58 75 L68 75 L68 114 Z" fill="#1e1b4b"/>
    <path d="M72 114 L72 55 L88 55 L88 114 Z" fill="#1e1b4b"/>
    <path d="M90 114 L90 85 L100 85 L100 114 Z" fill="#17153b"/>
    <!-- Glowing Windows in City -->
    <rect x="46" y="70" width="3" height="4" rx="1" fill="#fbbf24" opacity="0.8"/>
    <rect x="50" y="76" width="3" height="4" rx="1" fill="#fbbf24" opacity="0.5"/>
    <rect x="76" y="62" width="4" height="6" rx="1" fill="#38bdf8" opacity="0.9"/>
    <rect x="82" y="72" width="4" height="6" rx="1" fill="#fbbf24" opacity="0.7"/>
    <!-- Moon -->
    <circle cx="85" cy="40" r="8" fill="#fef3c7" opacity="0.9"/>
    <!-- Window Frame Cross -->
    <line x1="64" y1="24" x2="64" y2="114" stroke="#334155" stroke-width="3"/>
    <line x1="24" y1="69" x2="104" y2="69" stroke="#334155" stroke-width="3"/>
  </g>
  <!-- Indoor Windowsill plant -->
  <path d="M32 108 Q35 100 42 104 Q46 114 32 108" fill="#10b981"/>
  <rect x="30" y="108" width="8" height="6" rx="1" fill="#cbd5e1"/>

  <!-- INTERIOR PROPS (Bookshelf / Wall art) -->
  <rect x="180" y="30" width="36" height="6" rx="2" fill="#475569"/>
  <rect x="186" y="20" width="8" height="10" rx="1" fill="#f43f5e"/>
  <rect x="196" y="22" width="6" height="8" rx="1" fill="#38bdf8"/>
  <rect x="204" y="18" width="10" height="12" rx="1" fill="#fbbf24"/>

  <!-- DESK & WORKING ENVIRONMENT -->
  <rect x="10" y="195" width="220" height="35" rx="4" fill="url(#deskGradient)" stroke="#475569" stroke-width="1"/>
  <!-- Desk edge highlight -->
  <line x1="10" y1="195" x2="230" y2="195" stroke="#64748b" stroke-width="1.5"/>

  <!-- LAPTOP (Open, showing active glowing screen) -->
  <!-- Laptop Base -->
  <path d="M100 195 L120 175 L170 175 L190 195 Z" fill="#64748b"/>
  <!-- Laptop Screen -->
  <path d="M115 135 L175 135 L165 175 L125 175 Z" fill="#334155"/>
  <path d="M118 138 L172 138 L163 172 L127 172 Z" fill="#0f172a"/>
  <!-- Screen Glow / UI abstraction representing availability / readiness -->
  <path d="M118 138 L172 138 L163 172 L127 172 Z" fill="url(#screenGlow)"/>
  <!-- Abstract chat interface lines on screen -->
  <rect x="133" y="145" width="16" height="3" rx="1.5" fill="#38bdf8" opacity="0.8"/>
  <rect x="133" y="152" width="24" height="3" rx="1.5" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="150" cy="163" r="5" fill="#10b981"/> <!-- Green online dot -->

  <!-- DESK LAMP -->
  <!-- Lamp Base -->
  <ellipse cx="195" cy="192" rx="10" ry="4" fill="#475569"/>
  <!-- Lamp Arm -->
  <path d="M195 190 Q205 160 185 130" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Lamp Shade -->
  <path d="M172 122 L198 122 L205 135 L165 135 Z" fill="#fbbf24"/>
  <!-- Light Beam Pool on Desk -->
  <ellipse cx="170" cy="195" rx="35" ry="8" fill="#fbbf24" opacity="0.15"/>

  <!-- COFFEE MUG -->
  <rect x="85" y="178" width="12" height="15" rx="3" fill="#f8fafc"/>
  <path d="M97 182 C102 182 102 190 97 190" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <!-- Steam from mug -->
  <path d="M89 174 Q91 168 88 162" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- MAIN CHARACTER (Friendly, welcoming professional/friend at desk) -->
  <!-- Torso & Shoulders -->
  <path d="M110 230 C110 205 125 195 145 195 C165 195 180 205 180 230 Z" fill="#3b82f6"/> <!-- Blue hoodie/sweater -->
  <!-- Collar -->
  <path d="M135 195 L145 205 L155 195 Z" fill="#f8fafc"/>

  <!-- Neck -->
  <rect x="137" y="180" width="16" height="18" fill="#fed7aa"/>

  <!-- Head -->
  <ellipse cx="145" cy="165" rx="18" ry="21" fill="#fed7aa"/>

  <!-- Hair (Stylish modern dark hair) -->
  <path d="M127 165 C127 150 135 143 145 143 C155 143 163 150 163 165 C163 168 164 160 160 152 C155 145 145 145 138 147 C130 150 127 160 127 165 Z" fill="#1e293b"/>
  <!-- Bangs -->
  <path d="M130 155 Q140 162 152 154 Q158 158 162 152 Q150 144 130 155 Z" fill="#1e293b"/>

  <!-- Face Features (Expressive, smiling warmly, approachable) -->
  <!-- Eyebrows (friendly tilt) -->
  <path d="M134 161 Q138 158 142 161" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M148 161 Q152 158 156 161" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Eyes (Happy curved dots/lines) -->
  <circle cx="138" cy="166" r="2" fill="#1e293b"/>
  <circle cx="152" cy="166" r="2" fill="#1e293b"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="135" cy="172" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3"/>
  <ellipse cx="155" cy="172" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3"/>
  <!-- Warm Open Smile -->
  <path d="M140 173 Q145 178 150 173" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arms / Gestures (Welcoming open gesture, indicating "anytime") -->
  <!-- Left arm leaning on desk / open palm -->
  <path d="M115 205 C105 205 95 215 100 222 C103 225 110 220 115 212" fill="#3b82f6"/>
  <circle cx="100" cy="223" r="4" fill="#fed7aa"/> <!-- Hand -->

  <!-- Right arm raised slightly in a reassuring, friendly welcoming gesture -->
  <path d="M175 205 C185 200 188 185 180 175 C176 170 170 172 173 180" fill="#3b82f6"/>
  <circle cx="180" cy="172" r="4.5" fill="#fed7aa"/> <!-- Hand waving / open -->

  <!-- ACCENT FLOATING ELEMENTS (Representing constant availability, connection, 24/7 readiness) -->
  <!-- Clock / Time symbol subtle glowing vector element -->
  <g transform="translate(145, 105)">
    <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Clock Hands indicating round-the-clock availability -->
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="2" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke-width="1" fill="#fbbf24"/>
  </g>

  <!-- Sparkling readiness indicator stars -->
  <path d="M125 115 L127 121 L133 123 L127 125 L125 131 L123 125 L117 123 L123 121 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M170 125 L171 129 L175 130 L171 131 L170 135 L169 131 L165 130 L169 129 Z" fill="#38bdf8" opacity="0.9"/>
  
  <!-- Subtle connection wave emanating from character -->
  <path d="M145 90 C155 90 162 97 165 105" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M145 85 C160 85 170 95 174 105" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

</svg>