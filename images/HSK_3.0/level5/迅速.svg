<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Effects -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Chart Lines Gradient -->
    <linearGradient id="chart-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment & Window showing rapid city dynamics -->
  <g opacity="0.4">
    <!-- Window Frame -->
    <rect x="150" y="25" width="65" height="90" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <line x1="182" y1="25" x2="182" y2="115" stroke="#475569" stroke-width="1.5"/>
    <line x1="150" y1="70" x2="215" y2="70" stroke="#475569" stroke-width="1.5"/>
    <!-- City lights streaks (speed lines outside) -->
    <path d="M158 90 L172 45 M170 100 L188 50 M195 85 L205 40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M162 60 L170 35 M180 80 L192 45" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="110" cy="110" r="80" fill="url(#amber-glow)"/>
  <circle cx="160" cy="80" r="50" fill="url(#cyan-glow)"/>

  <!-- Office Interior Props -->
  <!-- Bookshelf / Architecture background -->
  <rect x="25" y="45" width="40" height="85" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="75" x2="65" y2="75" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="105" x2="65" y2="105" stroke="#334155" stroke-width="1.5"/>
  <!-- Books on shelf -->
  <rect x="30" y="55" width="8" height="20" fill="#38bdf8" rx="1"/>
  <rect x="40" y="52" width="6" height="23" fill="#f59e0b" rx="1"/>
  <rect x="48" y="58" width="12" height="17" fill="#ec4899" rx="1"/>

  <!-- Standing Desk -->
  <path d="M75 165 L155 165 L160 172 L70 172 Z" fill="#475569"/>
  <rect x="85" y="172" width="8" height="43" fill="#334155"/>
  <rect x="137" y="172" width="8" height="43" fill="#334155"/>

  <!-- Floating Holographic/Digital Analytics Display (Showing rapid upward growth) -->
  <g transform="translate(90, 48)">
    <!-- Screen Panel -->
    <rect x="-10" y="-12" width="85" height="65" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <!-- Grid lines -->
    <line x1="0" y1="35" x2="65" y2="35" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="20" x2="65" y2="20" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="5" x2="65" y2="5" stroke="#334155" stroke-width="1"/>
    
    <!-- Area Chart fill -->
    <path d="M 0 35 L 0 28 L 15 25 L 30 18 L 48 8 L 65 2 L 65 35 Z" fill="url(#chart-grad)"/>
    <!-- Rapid Upward Trend Line -->
    <path d="M 0 28 L 15 25 L 30 18 L 48 8 L 65 2" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Glowing Data Points -->
    <circle cx="15" cy="25" r="2" fill="#38bdf8"/>
    <circle cx="30" cy="18" r="2" fill="#38bdf8"/>
    <circle cx="48" cy="8" r="2.5" fill="#f59e0b"/>
    <circle cx="65" cy="2" r="3" fill="#10b981"/>

    <!-- Speed / Rocket / Upward Arrow Symbol representing '迅速' (Rapid Development) -->
    <path d="M 52 16 L 65 2 L 51 5 Z" fill="#10b981"/>
  </g>

  <!-- Laptop on Desk -->
  <path d="M92 162 L128 162 L133 165 L87 165 Z" fill="#cbd5e1"/>
  <path d="M96 140 L124 140 C125 140 126 141 126 142 L124 162 L96 162 L94 142 C94 141 95 140 96 140 Z" fill="#64748b"/>
  <!-- Laptop screen glow -->
  <rect x="97" y="142" width="26" height="18" fill="#38bdf8" opacity="0.6" rx="1"/>

  <!-- Coffee Mug -->
  <rect x="135" y="152" width="10" height="13" rx="2" fill="#f8fafc"/>
  <path d="M145 155 C148 155 148 160 145 162" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Character (Surprised & Engaged Analyst/Manager reacting to rapid development) -->
  <g transform="translate(45, 105)">
    <!-- Body / Torso (leaning forward in excitement) -->
    <path d="M35 35 C35 25 45 20 55 25 L68 55 C70 60 65 65 60 62 L42 50 Z" fill="#fbbf24"/>
    
    <!-- Head -->
    <circle cx="30" cy="20" r="14" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M18 18 C18 10 26 6 34 8 C38 9 42 12 43 16 C40 14 36 13 32 14 C25 15 21 18 18 18 Z" fill="#334155"/>

    <!-- Face (Wide eyes and open mouth in awe of rapid progress) -->
    <circle cx="33" cy="18" r="1.5" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="29" y="15" width="7" height="5" rx="1" fill="none" stroke="#1e293b" stroke-width="1"/>
    <!-- Surprised open mouth -->
    <ellipse cx="34" cy="24" rx="2" ry="2.5" fill="#b91c1c"/>

    <!-- Arms gesturing dynamically towards the screen -->
    <!-- Back Arm -->
    <path d="M50 30 L60 40 L52 48" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Arm pointing / reacting -->
    <path d="M42 42 L65 35 L75 32" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="76" cy="32" r="3" fill="#fed7aa"/>

    <!-- Legs sitting/leaning on high stool -->
    <path d="M48 60 L45 85 L35 85" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55 60 L62 80 L70 80" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Speed Action Lines / Sparks emphasizing "迅速" (Rapid/Fast) -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="168" y1="35" x2="182" y2="30"/>
    <line x1="175" y1="50" x2="195" y2="45"/>
    <line x1="160" y1="20" x2="170" y2="12"/>
  </g>

  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="72" y1="85" x2="82" y2="80"/>
    <line x1="78" y1="95" x2="90" y2="88"/>
  </g>

  <!-- Foreground plant for depth -->
  <path d="M15 210 C15 190 25 185 25 170 C25 185 35 190 35 210 Z" fill="#10b981" opacity="0.8"/>
  <path d="M8 215 C8 195 18 190 18 175 C18 190 28 195 28 215 Z" fill="#059669" opacity="0.8"/>
  <rect x="12" y="210" width="16" height="30" rx="3" fill="#475569"/>

</svg>