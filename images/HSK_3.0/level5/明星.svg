<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Background Glow & Film Studio Elements -->
  <path d="M0 0h240v240H0z" fill="url(#bg-gradient)"/>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    
    <linearGradient id="spotlight-cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="dress-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <radialGradient id="camera-lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Ambient Light Beams from Studio Setup -->
  <polygon points="120,0 20,240 70,240" fill="url(#spotlight-cone)"/>
  <polygon points="120,0 170,240 220,240" fill="url(#spotlight-cone)"/>

  <!-- Bokeh / Film Dust Particles -->
  <circle cx="45" cy="50" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="195" cy="80" r="2.5" fill="#fef08a" opacity="0.4"/>
  <circle cx="210" cy="180" r="1.5" fill="#93c5fd" opacity="0.5"/>
  <circle cx="30" cy="190" r="2" fill="#93c5fd" opacity="0.6"/>
  <circle cx="80" cy="130" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="160" cy="40" r="2" fill="#ffffff" opacity="0.5"/>

  <!-- Hanging Studio Light / Microphone Boom (Top left) -->
  <path d="M0 20 h45 l15 25" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="60" cy="45" r="6" fill="#475569"/>
  <path d="M57 51 l6 12 l-3 0 l-3 -12 z" fill="#334155"/>

  <!-- Red Carpet Stage Floor -->
  <path d="M0 195 L240 195 L240 240 L0 240 Z" fill="#881337"/>
  <path d="M0 195 L240 195" fill="none" opacity="0.3" stroke="#fda4af" stroke-width="2"/>
  <ellipse cx="120" cy="195" rx="120" ry="15" fill="#9f1239" opacity="0.8"/>

  <!-- Stanchions / Velvet Ropes in Background -->
  <path d="M20 185 L20 220" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
  <circle cx="20" cy="183" r="4" fill="url(#gold-grad)"/>
  <path d="M220 185 L220 220" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
  <circle cx="220" cy="183" r="4" fill="url(#gold-grad)"/>
  <path d="M20 195 Q 120 215 220 195" fill="none" stroke="#e11d48" stroke-width="4"/>

  <!-- Film Camera on Tripod (Left Foreground) -->
  <g transform="translate(15, 140)">
    <!-- Tripod Legs -->
    <path d="M35 55 L10 95 M35 55 L30 95 M35 55 L55 90" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <!-- Camera Body -->
    <rect x="20" y="35" width="30" height="20" rx="4" fill="#334155"/>
    <rect x="25" y="27" width="10" height="8" rx="2" fill="#64748b"/>
    <!-- Lens pointing toward movie star -->
    <circle cx="53" cy="45" r="10" fill="#1e293b"/>
    <circle cx="53" cy="45" r="7" fill="url(#camera-lens)"/>
    <circle cx="55" cy="43" r="2" fill="#ffffff" opacity="0.8"/>
    <!-- Film Reel Detail -->
    <circle cx="28" cy="27" r="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- MAIN CHARACTER: Movie Star (Mingxing) -->
  <g transform="translate(85, 45)">
    <!-- Shadow beneath actress -->
    <ellipse cx="35" cy="150" rx="28" ry="8" fill="#020617" opacity="0.6"/>

    <!-- Flowing Evening Dress (Red Carpet Style) -->
    <path d="M21 75 C10 110, 5 130, 10 152 C20 155, 50 155, 60 152 C65 130, 60 110, 49 75 Z" fill="url(#dress-grad)"/>
    
    <!-- Sparkle accents on dress -->
    <path d="M30 100 l3 3 l-3 3 l-3 -3 z" fill="#fef08a" opacity="0.8"/>
    <path d="M42 120 l2 2 l-2 2 l-2 -2 z" fill="#fef08a" opacity="0.9"/>
    <path d="M23 135 l2 2 l-2 2 l-2 -2 z" fill="#fef08a" opacity="0.7"/>
    <path d="M48 90 l2.5 2.5 l-2.5 2.5 l-2.5 -2.5 z" fill="#fef08a" opacity="0.8"/>

    <!-- Elegant Pose & Body -->
    <!-- Right Arm (Waving / Posing gracefully) -->
    <path d="M44 68 Q 62 60 65 78" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="66" cy="80" r="4" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Left Arm (Holding Clapperboard or Hand on hip) -->
    <path d="M26 68 Q 12 85 20 100" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="21" cy="103" r="4" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Torso / Shoulders -->
    <path d="M21 75 Q 35 65 49 75 L45 78 Q 35 70 25 78 Z" fill="#e11d48"/>
    <!-- Glamorous Neckline -->
    <path d="M28 65 Q 35 72 42 65 Z" fill="#fbcfe8"/>

    <!-- Head & Hair -->
    <!-- Voluminous Glamorous Hair -->
    <path d="M20 38 C 15 15, 55 10, 52 38 C 58 42, 58 58, 50 62 C 35 68, 20 62, 18 52 C 12 48, 15 40, 20 38 Z" fill="#271c19"/>
    
    <!-- Face Shape & Skin -->
    <circle cx="35" cy="42" r="14" fill="#fbcfe8"/>

    <!-- Facial Features (Expressive, Smiling Movie Star) -->
    <!-- Eyes - happy crescent curves -->
    <path d="M28 41 Q 31 38 34 41" stroke="#4a154b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M37 41 Q 40 38 43 41" stroke="#4a154b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Gentle Eyelashes -->
    <path d="M27 40 L26 38" stroke="#4a154b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M44 40 L45 38" stroke="#4a154b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="28" cy="45" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="42" cy="45" r="3" fill="#fda4af" opacity="0.6"/>

    <!-- Confident, Radiant Smile -->
    <path d="M31 48 Q 35 52 39 48" stroke="#be123c" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Stylish Hair Details & Highlights -->
    <path d="M22 30 C 25 22, 45 20, 48 30" stroke="#451a03" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M48 36 C 55 45, 50 55, 46 58" stroke="#3d1402" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Diamond Necklace / Celebrity Bling -->
    <path d="M30 63 Q 35 68 40 63" stroke="url(#gold-grad)" stroke-width="2.5" fill="none"/>
    <circle cx="35" cy="66" r="2.5" fill="#e0f2fe"/>
  </g>

  <!-- Film Clapperboard Prop (Held or resting nearby in scene) -->
  <g transform="translate(155, 145) rotate(15)">
    <!-- Board Body -->
    <rect x="0" y="15" width="45" height="35" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Clapper Top -->
    <path d="M0 12 L45 2 L45 12 L0 15 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <!-- Black Stripes on Clapper -->
    <path d="M6 11 L12 9.5 L12 12.5 L6 14 Z" fill="#0f172a"/>
    <path d="M18 9 L24 7.5 L24 10.5 L18 12 Z" fill="#0f172a"/>
    <path d="M30 7 L36 5.5 L36 8.5 L30 10 Z" fill="#0f172a"/>
    <!-- Scene text lines representation (abstract visual markers, NO letters) -->
    <rect x="7" y="22" width="20" height="3" rx="1.5" fill="#64748b"/>
    <rect x="7" y="29" width="31" height="3" rx="1.5" fill="#38bdf8"/>
    <rect x="7" y="36" width="15" height="3" rx="1.5" fill="#64748b"/>
  </g>

  <!-- Golden Trophy / Award Statuette (Symbolizing Movie Star / Film Industry) -->
  <g transform="translate(180, 85)">
    <!-- Wooden Base -->
    <rect x="5" y="45" width="20" height="8" rx="2" fill="#78350f"/>
    <rect x="7" y="42" width="16" height="4" rx="1" fill="#b45309"/>
    <!-- Statuette Body (Abstract golden figure) -->
    <path d="M12 42 L13 22 C 10 20, 10 16, 15 15 C 20 16, 20 20, 17 22 L18 42 Z" fill="url(#gold-grad)"/>
    <!-- Head / Star representation -->
    <circle cx="15" cy="11" r="5" fill="url(#gold-grad)"/>
    <!-- Glowing Aura behind trophy -->
    <circle cx="15" cy="22" r="15" fill="#fde047" opacity="0.15" filter="blur(4px)"/>
  </g>

  <!-- Flashing Camera Bulb Effect (Paparazzi / Premier Vibe) -->
  <g transform="translate(195, 30)">
    <circle cx="0" cy="0" r="12" fill="#ffffff" opacity="0.9" filter="blur(2px)"/>
    <polygon points="0,-25 6,-6 25,0 6,6 0,25 -6,6 -25,0 -6,-6" fill="#fef08a"/>
    <polygon points="0,-15 3,-3 15,0 3,3 0,15 -3,3 -15,0 -3,-3" fill="#ffffff"/>
  </g>
  <g transform="translate(50, 25)">
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.8" filter="blur(2px)"/>
    <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="#fef08a" opacity="0.7"/>
  </g>
</svg>