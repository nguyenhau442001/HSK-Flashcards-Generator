<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal Glow Gradient -->
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Scale Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glows -->
  <circle cx="60" cy="100" r="80" fill="url(#tealGlow)"/>
  <circle cx="180" cy="120" r="90" fill="url(#amberGlow)"/>

  <!-- Background Environment & Architecture -->
  <g opacity="0.4">
    <!-- Architectural lines representing an analytical studio/laboratory -->
    <path d="M 0 190 L 240 190" stroke="#334155" stroke-width="2"/>
    <path d="M 40 190 L 40 140" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>
    <path d="M 200 190 L 200 130" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>
    <!-- Abstract architectural grid backdrop -->
    <line x1="120" y1="30" x2="120" y2="190" stroke="#334155" stroke-dasharray="2 6" stroke-width="1"/>
    <line x1="30" y1="70" x2="210" y2="70" stroke="#334155" stroke-dasharray="2 6" stroke-width="1"/>
  </g>

  <!-- Giant Retro-Modern Balance Scale (Representing Ratio / Proportion) -->
  <g filter="url(#shadow)">
    <!-- Scale Base / Stand -->
    <!-- Heavy Circular Base -->
    <ellipse cx="120" cy="190" rx="45" ry="12" fill="#334155"/>
    <ellipse cx="120" cy="188" rx="35" ry="8" fill="#475569"/>
    
    <!-- Vertical Pillar -->
    <rect x="115" y="70" width="10" height="120" rx="3" fill="url(#beamGrad)"/>
    
    <!-- Central Pivot Cap (Gold) -->
    <circle cx="120" cy="75" r="9" fill="url(#goldGrad)"/>
    <circle cx="120" cy="75" r="4" fill="#78350f"/>

    <!-- Decorative Top Finial -->
    <path d="M 113 70 L 127 70 L 124 58 L 116 58 Z" fill="url(#goldGrad)"/>
    <circle cx="120" cy="55" r="4" fill="url(#goldGrad)"/>

    <!-- Tilted Beam (Showing Imbalance / Proportion Skew) -->
    <!-- Center of rotation at (120, 75). Rotated counter-clockwise ~12 degrees to show unequal ratio -->
    <g transform="translate(120, 75) rotate(-14)">
      <!-- The Main Horizontal Beam -->
      <rect x="-85" y="-6" width="170" height="12" rx="4" fill="url(#beamGrad)"/>
      
      <!-- Beam End Caps -->
      <circle cx="-85" cy="0" r="5" fill="url(#goldGrad)"/>
      <circle cx="85" cy="0" r="5" fill="url(#goldGrad)"/>

      <!-- Left Chain (Longer / Weighted Down) -->
      <path d="M -80 0 L -80 75" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 3"/>
      <!-- Right Chain (Shorter / Up) -->
      <path d="M 80 0 L 80 45" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 3"/>
    </g>

    <!-- LEFT PAN (Heavily Loaded - Bottom Left) -->
    <!-- Positioned matching the tilted left end of beam: approx center X=40, Y=140 -->
    <g transform="translate(42, 140)">
      <!-- Suspension Strings -->
      <path d="M 0 -22 L -25 5" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M 0 -22 L 25 5" stroke="#cbd5e1" stroke-width="1.5"/>
      
      <!-- Curved Bowl/Pan -->
      <path d="M -30 5 C -30 25, 30 25, 30 5 Z" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
      <ellipse cx="0" cy="5" rx="30" ry="6" fill="#475569" stroke="#94a3b8" stroke-width="2"/>

      <!-- Diverse Weight Elements in Left Pan (Representing Majority in Proportion) -->
      <!-- Large Teal Cylinder Block -->
      <rect x="-16" y="-18" width="12" height="23" rx="2" fill="#38bdf8"/>
      <ellipse cx="-10" cy="-18" rx="6" ry="2.5" fill="#7dd3fc"/>

      <!-- Amber Cube Stacked -->
      <rect x="-2" y="-15" width="14" height="20" rx="2" fill="#fbbf24"/>
      <ellipse cx="5" cy="-15" rx="7" ry="2.5" fill="#fde68a"/>

      <!-- Magenta Sphere/Ball nestled -->
      <circle cx="12" cy="-4" r="8" fill="#ec4899"/>
      <circle cx="10" cy="-6" r="2" fill="#fbcfe8" opacity="0.8"/>
    </g>

    <!-- RIGHT PAN (Lightly Loaded - Top Right) -->
    <!-- Positioned matching the tilted right end of beam: approx center X=198, Y=98 -->
    <g transform="translate(198, 98)">
      <!-- Suspension Strings -->
      <path d="M 0 -22 L -25 5" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M 0 -22 L 25 5" stroke="#cbd5e1" stroke-width="1.5"/>
      
      <!-- Curved Bowl/Pan -->
      <path d="M -30 5 C -30 25, 30 25, 30 5 Z" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
      <ellipse cx="0" cy="5" rx="30" ry="6" fill="#475569" stroke="#94a3b8" stroke-width="2"/>

      <!-- Single Small Weight Element (Representing Minority in Proportion) -->
      <rect x="-6" y="-12" width="12" height="15" rx="2" fill="#10b981"/>
      <ellipse cx="0" cy="-12" rx="6" ry="2.5" fill="#6ee7b7"/>
    </g>
  </g>

  <!-- Foreground Dynamic Data / Proportional Visualization Graphics -->
  <!-- Floating Analytical Ring & Proportion Bars -->
  <g transform="translate(0, 0)">
    <!-- Proportional Data Bars (Top Right Floating UI Card Element) -->
    <g transform="translate(160, 25)" filter="url(#shadow)">
      <rect x="0" y="0" width="55" height="35" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
      <!-- Proportion Bar Segments -->
      <rect x="8" y="10" width="30" height="6" rx="3" fill="#38bdf8"/>
      <rect x="40" y="10" width="8" height="6" rx="3" fill="#ec4899"/>
      
      <rect x="8" y="21" width="22" height="6" rx="3" fill="#fbbf24"/>
      <rect x="32" y="21" width="16" height="6" rx="3" fill="#10b981"/>
    </g>

    <!-- Secondary Data Floating Pill (Left) -->
    <g transform="translate(25, 35)" filter="url(#shadow)">
      <rect x="0" y="0" width="45" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
      <!-- Mini Pie/Ring Chart visual -->
      <circle cx="22" cy="14" r="8" fill="none" stroke="#334155" stroke-width="3"/>
      <circle cx="22" cy="14" r="8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="35 15" stroke-dashoffset="5"/>
    </g>
  </g>

  <!-- Glowing Accent Particles & Sparkles -->
  <g>
    <!-- Sparkle near right pan -->
    <path d="M 215 65 L 217 72 L 224 74 L 217 76 L 215 83 L 213 76 L 206 74 L 213 72 Z" fill="#fbbf24" opacity="0.8"/>
    <!-- Sparkle near left side -->
    <path d="M 30 110 L 31.5 115 L 36.5 116.5 L 31.5 118 L 30 123 L 28.5 118 L 23.5 116.5 L 28.5 115 Z" fill="#38bdf8" opacity="0.6"/>
    <!-- Small ambient dots -->
    <circle cx="95" cy="50" r="2" fill="#fbbf24" opacity="0.7"/>
    <circle cx="145" cy="45" r="1.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="185" cy="170" r="2" fill="#ec4899" opacity="0.5"/>
  </g>
</svg>