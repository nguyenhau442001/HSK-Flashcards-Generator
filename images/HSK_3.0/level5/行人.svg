<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Street Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Building Window Glows -->
    <linearGradient id="windowGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="windowGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Pavement Gradient -->
    <linearGradient id="pavementGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Skyscrapers & Urban Skyline -->
  <g id="skyline">
    <!-- Far buildings -->
    <rect x="20" y="70" width="35" height="90" fill="#1e293b" opacity="0.6"/>
    <rect x="65" y="50" width="45" height="110" fill="#1e293b" opacity="0.5"/>
    <rect x="125" y="60" width="40" height="100" fill="#1e293b" opacity="0.6"/>
    <rect x="180" y="40" width="45" height="120" fill="#1e293b" opacity="0.5"/>

    <!-- Building windows (far) -->
    <rect x="28" y="80" width="6" height="8" fill="#38bdf8" opacity="0.2"/>
    <rect x="40" y="80" width="6" height="8" fill="#fb923c" opacity="0.2"/>
    <rect x="75" y="65" width="8" height="10" fill="url(#windowGlow1)"/>
    <rect x="90" y="65" width="8" height="10" fill="url(#windowGlow2)"/>
    <rect x="75" y="85" width="8" height="10" fill="#334155"/>
    <rect x="90" y="85" width="8" height="10" fill="url(#windowGlow1)"/>
    <rect x="135" y="75" width="8" height="12" fill="url(#windowGlow2)"/>
    <rect x="190" y="60" width="10" height="14" fill="url(#windowGlow1)"/>
    <rect x="190" y="85" width="10" height="14" fill="#334155"/>
  </g>

  <!-- Atmospheric Lighting (Moonlight & Ambient) -->
  <circle cx="200" cy="30" r="25" fill="#f8fafc" opacity="0.08"/>

  <!-- Street Lamp Pole & Fixture (Left) -->
  <g id="street-lamp">
    <rect x="45" y="45" width="4" height="115" fill="#475569" rx="2"/>
    <path d="M 47 45 L 30 35 L 30 30 L 47 38 Z" fill="#475569"/>
    <!-- Lamp Light Cone -->
    <ellipse cx="32" cy="120" rx="40" ry="15" fill="url(#lampGlow)"/>
    <circle cx="30" cy="35" r="5" fill="#fbbf24"/>
  </g>

  <!-- City Street / Road (Bottom Section) -->
  <g id="road">
    <!-- Sidewalk -->
    <path d="M 0 130 Q 120 125 240 130 L 240 170 L 0 170 Z" fill="url(#pavementGrad)"/>
    <!-- Curb -->
    <path d="M 0 130 Q 120 125 240 130" stroke="#64748b" stroke-width="2" fill="none"/>
    <!-- Road Surface -->
    <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#0f172a"/>
    <!-- Road Markings (Dashed Line) -->
    <line x1="0" y1="205" x2="40" y2="205" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,6" opacity="0.8"/>
    <line x1="60" y1="205" x2="100" y2="205" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,6" opacity="0.8"/>
    <line x1="120" y1="205" x2="160" y2="205" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,6" opacity="0.8"/>
    <line x1="180" y1="205" x2="220" y2="205" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,6" opacity="0.8"/>
  </g>

  <!-- PEDESTRIANS (行人 - Multiple people walking on the street/sidewalk) -->

  <!-- Pedestrian 1: Woman with Umbrella/Bag (Walking Left to Right, Foreground-Mid) -->
  <g id="pedestrian-1" transform="translate(140, 115)">
    <!-- Shadow -->
    <ellipse cx="10" cy="45" rx="12" ry="4" fill="#000000" opacity="0.4"/>
    <!-- Body / Coat -->
    <path d="M 4 18 L 16 18 L 20 38 L 0 38 Z" fill="#ec4899"/>
    <!-- Legs (Walking pose) -->
    <line x1="5" y1="38" x2="2" y2="52" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="38" x2="20" y2="50" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="1" cy="53" rx="3" ry="1.5" fill="#0f172a"/>
    <ellipse cx="21" cy="51" rx="3" ry="1.5" fill="#0f172a"/>
    <!-- Head & Hair -->
    <circle cx="10" cy="11" r="5" fill="#fcd34d"/>
    <path d="M 5 9 Q 10 5 15 11 Q 13 14 8 13 Z" fill="#92400e"/>
    <!-- Arms -->
    <path d="M 4 20 L -2 26" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M 16 20 L 22 25" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <!-- Prop: Shopping Bag -->
    <rect x="21" y="24" width="5" height="7" rx="1" fill="#38bdf8"/>
  </g>

  <!-- Pedestrian 2: Man with Backpack (Walking Right to Left, Midground) -->
  <g id="pedestrian-2" transform="translate(85, 120)">
    <!-- Shadow -->
    <ellipse cx="10" cy="42" rx="10" ry="3" fill="#000000" opacity="0.4"/>
    <!-- Backpack -->
    <rect x="12" y="18" width="6" height="12" rx="2" fill="#fbbf24"/>
    <!-- Jacket / Body -->
    <path d="M 5 16 L 15 16 L 18 36 L 2 36 Z" fill="#3b82f6"/>
    <!-- Legs -->
    <line x1="6" y1="36" x2="3" y2="48" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="36" x2="17" y2="47" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="2" cy="49" rx="3" ry="1.5" fill="#0f172a"/>
    <ellipse cx="18" cy="48" rx="3" ry="1.5" fill="#0f172a"/>
    <!-- Head & Cap -->
    <circle cx="10" cy="10" r="4.5" fill="#fcd34d"/>
    <path d="M 5 8 L 14 8 L 12 6 L 7 6 Z" fill="#1e293b"/>
    <!-- Arms -->
    <path d="M 5 18 L 1 27" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15 18 L 19 26" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Pedestrian 3: Person with Scarf (Walking Left to Right, Further back) -->
  <g id="pedestrian-3" transform="translate(195, 125)">
    <!-- Shadow -->
    <ellipse cx="6" cy="35" rx="7" ry="2" fill="#000000" opacity="0.3"/>
    <!-- Coat -->
    <path d="M 3 14 L 11 14 L 13 30 L 1 30 Z" fill="#10b981"/>
    <!-- Legs -->
    <line x1="4" y1="30" x2="3" y2="39" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="9" y1="30" x2="10" y2="38" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="7" cy="9" r="4" fill="#fcd34d"/>
    <!-- Scarf -->
    <path d="M 4 12 L 10 12 L 9 16 L 12 20" stroke="#f43f5e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Pedestrian 4: Child holding parent's hand or walking beside (Silhouette/Mid-distance) -->
  <g id="pedestrian-4" transform="translate(60, 125)">
    <ellipse cx="5" cy="32" rx="6" ry="2" fill="#000000" opacity="0.3"/>
    <path d="M 2 13 L 9 13 L 10 28 L 1 28 Z" fill="#a855f7"/>
    <line x1="4" y1="28" x2="3" y2="36" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="7" y1="28" x2="8" y2="35" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="5" cy="8" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- Atmospheric details: Soft Glowing Street Lights / Bokeh dots -->
  <g id="bokeh" opacity="0.6">
    <circle cx="110" cy="95" r="2" fill="#fbbf24"/>
    <circle cx="160" cy="85" r="1.5" fill="#38bdf8"/>
    <circle cx="210" cy="100" r="2" fill="#fb923c"/>
    <circle cx="70" cy="105" r="1.5" fill="#f43f5e"/>
    <circle cx="130" cy="110" r="2" fill="#fbbf24"/>
  </g>
</svg>