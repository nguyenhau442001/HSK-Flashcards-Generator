<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 140 L80 140 L75 80 L45 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="60" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M40 50 C 40 30, 80 30, 80 50 L 75 60 L 45 60 Z" fill="#475569"/>
    <!-- Expression: Focused/Determined -->
    <rect x="50" y="55" width="5" height="2" rx="1" fill="#1e293b"/>
    <rect x="65" y="55" width="5" height="2" rx="1" fill="#1e293b"/>
    <path d="M52 65 Q 60 72 68 65" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>

  <!-- The "Failure" (Broken Robot/Project) -->
  <g transform="translate(140, 120)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#ec4899" opacity="0.6"/>
    <path d="M10 10 L30 30 M30 10 L10 30" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- The "Opportunity" (Glowing Book/Lightbulb) -->
  <g transform="translate(150, 60)">
    <circle cx="20" cy="20" r="25" fill="#fbbf24" opacity="0.2"/>
    <path d="M10 30 L30 30 L25 15 L15 15 Z" fill="#fbbf24"/>
    <rect x="18" y="10" width="4" height="5" fill="#fbbf24"/>
    <path d="M12 35 L28 35" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- Connection Line (Visualizing the mental shift) -->
  <path d="M140 120 Q 140 80 160 80" stroke="#10b981" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
  
  <!-- Desk Items -->
  <rect x="30" y="145" width="30" height="15" rx="2" fill="#fb923c"/>
  <circle cx="190" cy="150" r="8" fill="#38bdf8"/>
</svg>