<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glass Dome Glow -->
    <radialGradient id="glassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Magic Tree Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Crystal Shard Gradient -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="crystalGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.8" />
    </linearGradient>

    <!-- Floating Sparkle Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Ambient Magic Particles / Dust -->
  <g opacity="0.6">
    <circle cx="40" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="70" r="1" fill="#fbbf24" />
    <circle cx="180" cy="190" r="2" fill="#ec4899" filter="url(#softGlow)" />
    <circle cx="60" cy="180" r="1.5" fill="#38bdf8" />
    <circle cx="210" cy="130" r="1" fill="#34d399" />
    <circle cx="30" cy="110" r="1.5" fill="#fbbf24" />
  </g>

  <!-- Wooden Table / Surface with Perspective -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#0b0f19" />
  <path d="M 0 190 L 240 190 L 240 196 L 0 196 Z" fill="#1f2937" />
  <ellipse cx="120" cy="190" rx="90" ry="12" fill="#030712" opacity="0.8" />

  <!-- Magic Terrarium Base (Golden Stand) -->
  <path d="M 90 190 L 150 190 L 140 178 L 100 178 Z" fill="#d97706" />
  <path d="M 85 190 L 155 190 L 160 194 L 80 194 Z" fill="#b45309" rx="2" />
  <ellipse cx="120" cy="178" rx="20" ry="4" fill="#fbbf24" />

  <!-- Glass Dome (Terrarium) Back Outline & Interior Glow -->
  <ellipse cx="120" cy="115" rx="55" ry="70" fill="url(#glassGlow)" />
  <path d="M 65 120 A 55 65 0 0 1 175 120 L 175 178 L 65 178 Z" fill="#38bdf8" opacity="0.03" />

  <!-- Terrarium Soil / Moss Layer inside -->
  <ellipse cx="120" cy="176" rx="48" ry="8" fill="#065f46" />
  <ellipse cx="120" cy="174" rx="42" ry="6" fill="#047857" />
  <circle cx="105" cy="175" r="3" fill="#10b981" />
  <circle cx="135" cy="174" r="2.5" fill="#059669" />

  <!-- The "Miracle" Centerpiece: Floating Crystalline Tree & Magic Flower -->
  <!-- Swirling Magic Energy Ring at Base -->
  <ellipse cx="120" cy="165" rx="25" ry="7" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 2" />
  <ellipse cx="120" cy="155" rx="18" ry="5" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.5" />

  <!-- Twisted Tree Trunk/Stem -->
  <path d="M 120 174 C 120 150, 112 135, 120 120 C 122 116, 126 112, 124 105" fill="none" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 118 145 C 112 140, 105 135, 108 128" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 122 135 C 128 130, 134 125, 130 118" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />

  <!-- Floating Crystal Blossoms (Miracle Effect) -->
  <!-- Center Main Crystal (The Miracle Bud) -->
  <g filter="url(#intenseGlow)">
    <polygon points="120,85 128,102 120,110 112,102" fill="url(#crystalGrad)" />
    <polygon points="120,85 128,102 120,110" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Orbiting Crystals / Petals -->
  <g filter="url(#softGlow)">
    <!-- Crystal 1 (Top Left) -->
    <path d="M 98 95 C 95 90, 102 85, 108 92 C 112 98, 104 104, 98 95 Z" fill="#38bdf8" />
    <path d="M 98 95 C 96 92, 100 88, 104 92 Z" fill="#e0f2fe" />

    <!-- Crystal 2 (Top Right) -->
    <path d="M 142 90 C 146 84, 152 92, 146 98 C 140 102, 138 95, 142 90 Z" fill="#c084fc" />
    <path d="M 142 90 C 144 86, 148 92, 142 95 Z" fill="#f3e8ff" />

    <!-- Crystal 3 (Floating lower left) -->
    <path d="M 102 125 C 98 120, 108 116, 110 122 C 112 128, 106 130, 102 125 Z" fill="#34d399" />

    <!-- Crystal 4 (Floating lower right) -->
    <path d="M 138 120 C 144 116, 145 126, 138 130 C 132 134, 134 124, 138 120 Z" fill="#fbbf24" />
  </g>

  <!-- Glowing Magic Trail / Swirls around the tree -->
  <path d="M 100 150 C 90 130, 110 100, 120 90 C 130 80, 150 110, 135 130" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" filter="url(#softGlow)" />
  <path d="M 130 160 C 145 140, 130 110, 120 95 C 110 80, 90 105, 105 125" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.7" filter="url(#softGlow)" />

  <!-- Magical Sparkles and Stars (Bursting out) -->
  <!-- Star 1 -->
  <path d="M 120 68 L 122 75 L 129 77 L 122 79 L 120 86 L 118 79 L 111 77 L 118 75 Z" fill="#fbbf24" filter="url(#softGlow)" />
  <!-- Star 2 (Small) -->
  <path d="M 90 75 L 91 79 L 95 80 L 91 81 L 90 85 L 89 81 L 85 80 L 89 79 Z" fill="#38bdf8" />
  <!-- Star 3 (Small) -->
  <path d="M 155 105 L 156 109 L 160 110 L 156 111 L 155 115 L 154 111 L 150 110 L 154 109 Z" fill="#f43f5e" />

  <!-- Floating Orbs of Light -->
  <circle cx="85" cy="115" r="3" fill="#38bdf8" filter="url(#softGlow)" opacity="0.8" />
  <circle cx="150" cy="140" r="2.5" fill="#fbbf24" filter="url(#softGlow)" opacity="0.9" />
  <circle cx="100" cy="145" r="2" fill="#ec4899" filter="url(#softGlow)" opacity="0.7" />
  <circle cx="130" cy="75" r="2" fill="#34d399" filter="url(#softGlow)" opacity="0.8" />

  <!-- Glass Dome Front Specular Highlights & Outline -->
  <path d="M 65 120 A 55 65 0 0 0 175 120" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path d="M 65 120 A 55 65 0 0 1 175 120 A 55 65 0 0 1 65 120 Z" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.6" />
  
  <!-- Glass Reflection Curve -->
  <path d="M 78 95 C 85 80, 105 72, 120 72" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" filter="url(#softGlow)" />
  <path d="M 74 110 C 78 102, 85 96, 90 92" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

  <!-- Foreground Atmospheric Elements (Outside Dome) -->
  <!-- Magical dust floating near the base outside -->
  <circle cx="75" cy="180" r="2" fill="#fbbf24" filter="url(#softGlow)" />
  <circle cx="165" cy="175" r="1.5" fill="#38bdf8" filter="url(#softGlow)" />
  <path d="M 160 165 Q 168 160 170 150" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" stroke-dasharray="2 2" />

  <!-- Tiny magnifying glass or compass prop on the table (Contextualizing exploration/discovery) -->
  <g transform="translate(45, 185) rotate(-15)">
    <!-- Handle -->
    <rect x="-15" y="-3" width="18" height="6" rx="3" fill="#b45309" />
    <rect x="-14" y="-2" width="16" height="2" rx="1" fill="#d97706" />
    <!-- Rim -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#fbbf24" stroke-width="3" />
    <!-- Glass -->
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.2" />
    <path d="M -5 -5 C -2 -8, 2 -8, 5 -5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Open Magic Book (Tome of Wonders) on the right -->
  <g transform="translate(180, 188) rotate(10)">
    <!-- Book Cover -->
    <path d="M -22 -8 L 22 -8 L 20 8 L -20 8 Z" fill="#7c2d12" />
    <!-- Pages -->
    <path d="M -20 -7 L 0 -10 L 0 7 L -20 6 Z" fill="#fef3c7" />
    <path d="M 0 -10 L 20 -7 L 20 6 L 0 7 Z" fill="#fef3c7" />
    <!-- Center Spine Binding -->
    <line x1="0" y1="-10" x2="0" y2="7" stroke="#451a03" stroke-width="1.5" />
    <!-- Magical glowing rune lines on pages (abstract/symbolic, no letters) -->
    <path d="M -15 -3 L -5 -3 M -15 1 L -8 1" stroke="#dc2626" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <path d="M 5 -3 L 15 -3 M 8 1 L 15 1" stroke="#2563eb" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <!-- Tiny glowing star on book -->
    <circle cx="10" cy="-1" r="1.5" fill="#fbbf24" filter="url(#softGlow)" />
  </g>
</svg>