<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Mountain/Challenge Background -->
  <path d="M40 240 L120 120 L200 240 Z" fill="#334155"/>
  <path d="M80 240 L150 150 L220 240 Z" fill="#475569"/>
  
  <!-- The Young Person (Climber) -->
  <g transform="translate(120, 160)">
    <!-- Body -->
    <path d="M-10 -20 L10 -20 L5 20 L-5 20 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-30" r="12" fill="#fde68a"/>
    <!-- Arms reaching up -->
    <path d="M-10 -20 L-25 -5" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 -20 L25 -5" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M-5 20 L-10 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 20 L10 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Challenge Props: Floating Platforms/Steps -->
  <rect x="60" y="180" width="30" height="8" rx="4" fill="#fb923c"/>
  <rect x="150" y="140" width="30" height="8" rx="4" fill="#fb923c"/>
  
  <!-- Glowing Summit/Goal -->
  <circle cx="180" cy="100" r="15" fill="#f59e0b" opacity="0.3"/>
  <circle cx="180" cy="100" r="8" fill="#fbbf24"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="2" fill="#94a3b8"/>
  <circle cx="210" cy="40" r="3" fill="#94a3b8"/>
  <circle cx="190" cy="70" r="2" fill="#94a3b8"/>
  
  <!-- Ground/Base -->
  <rect x="0" y="230" width="240" height="10" fill="#0f172a"/>
</svg>