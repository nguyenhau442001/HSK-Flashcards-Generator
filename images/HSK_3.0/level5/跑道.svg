<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Running Track -->
  <path d="M0 160 C 40 140, 200 140, 240 160 L 240 200 C 200 180, 40 180, 0 200 Z" fill="#334155"/>
  <path d="M0 170 L 240 170" stroke="#fb923c" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M0 190 L 240 190" stroke="#fb923c" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Grass/Field -->
  <path d="M0 160 C 40 140, 200 140, 240 160 L 240 0 L 0 0 Z" fill="#064e3b" opacity="0.4"/>
  
  <!-- Athlete 1 -->
  <g transform="translate(60, 150)">
    <ellipse cx="0" cy="-20" rx="6" ry="6" fill="#fbbf24"/>
    <path d="M-5 -15 L 0 -5 L 5 -15" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10 5 L 0 0 L 10 5" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M-5 15 L 0 5 L 5 15" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M-15 0 L -5 5 L 5 0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Athlete 2 -->
  <g transform="translate(140, 175)">
    <ellipse cx="0" cy="-20" rx="6" ry="6" fill="#38bdf8"/>
    <path d="M-5 -15 L 0 -5 L 5 -15" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10 5 L 0 0 L 10 5" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M-5 15 L 0 5 L 5 15" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M-15 0 L -5 5 L 5 0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Speed Lines -->
  <path d="M20 150 L 50 150" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
  <path d="M100 170 L 130 170" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
  <path d="M110 180 L 140 180" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
  
  <!-- Stadium Lights -->
  <circle cx="20" cy="40" r="15" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="20" cy="40" r="4" fill="#fbbf24"/>
  <circle cx="220" cy="40" r="15" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="220" cy="40" r="4" fill="#fbbf24"/>
</svg>