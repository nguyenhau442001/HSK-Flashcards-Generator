<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric background details: map grid and alliance nodes -->
  <g opacity="0.2">
    <circle cx="120" cy="130" r="80" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="120" cy="130" r="60" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <line x1="40" y1="130" x2="200" y2="130" stroke="#38bdf8" stroke-width="1"/>
    <line x1="120" y1="50" x2="120" y2="210" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Holographic Table Base (Environment) -->
  <ellipse cx="120" cy="190" rx="70" ry="20" fill="#0f172a" stroke="#334155" stroke-width="3" filter="url(#shadow)"/>
  <path d="M 50 190 L 70 215 L 170 215 L 190 190" fill="none" stroke="#334155" stroke-width="3"/>
  <ellipse cx="120" cy="190" rx="60" ry="14" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>

  <!-- Central Alliance Core / Holographic Globe Connecting -->
  <g filter="url(#shadow)">
    <!-- Connection Energy Beams / Triangular alliance structure -->
    <polygon points="120,85 75,160 165,160" fill="url(#cyanBeam)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,3"/>

    <!-- Three pillars/figures joining forces (Abstracted representing 'liánhé' - united/alliance) -->
    <!-- Node 1: Left Partner -->
    <g transform="translate(75, 160)">
      <circle cx="0" cy="-15" r="14" fill="url(#orangeGrad)"/>
      <path d="M -12 15 C -12 2, 12 2, 12 15 Z" fill="url(#orangeGrad)"/>
      <circle cx="0" cy="-35" r="4" fill="#fbbf24"/>
      <line x1="0" y1="-31" x2="45" y2="-20" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Node 2: Right Partner -->
    <g transform="translate(165, 160)">
      <circle cx="0" cy="-15" r="14" fill="url(#emeraldGrad)"/>
      <path d="M -12 15 C -12 2, 12 2, 12 15 Z" fill="url(#emeraldGrad)"/>
      <circle cx="0" cy="-35" r="4" fill="#38bdf8"/>
      <line x1="0" y1="-31" x2="-45" y2="-20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Node 3: Top Anchor / Central Alliance Emblem -->
    <g transform="translate(120, 85)">
      <!-- Golden Crest / Shield symbolizing union -->
      <path d="M 0 -22 L 18 -10 L 18 10 C 18 22, 0 32, 0 32 C 0 32, -18 22, -18 10 L -18 -10 Z" fill="url(#goldGlow)" stroke="#fef08a" stroke-width="2" filter="url(#shadow)"/>
      <!-- Interlocking rings inside crest -->
      <circle cx="-5" cy="2" r="7" fill="none" stroke="#1e293b" stroke-width="2.5"/>
      <circle cx="5" cy="2" r="7" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Sparkling Connection Sparks (Action & Dynamic feel) -->
  <g fill="#fef08a">
    <circle cx="120" cy="130" r="4" filter="url(#shadow)"/>
    <path d="M 120 115 L 123 125 L 133 128 L 123 131 L 120 141 L 117 131 L 107 128 L 117 125 Z" fill="#38bdf8"/>
    <circle cx="95" cy="135" r="2.5" opacity="0.8"/>
    <circle cx="145" cy="135" r="2.5" opacity="0.8"/>
    <circle cx="120" cy="165" r="3" opacity="0.9"/>
  </g>

  <!-- Foreground Atmospheric Elements & Lighting -->
  <path d="M 20 120 Q 120 90 220 120" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.3"/>
  <path d="M 30 150 Q 120 120 210 150" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.2"/>

  <!-- Ambient glowing particles -->
  <circle cx="50" cy="70" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="65" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="210" cy="180" r="1.5" fill="#10b981" opacity="0.6"/>
  <circle cx="35" cy="195" r="2" fill="#fb923c" opacity="0.6"/>
</svg>