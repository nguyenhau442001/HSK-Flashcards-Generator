<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Speed Lines / Stars) -->
  <g opacity="0.3">
    <line x1="30" y1="40" x2="60" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="70" x2="210" y2="70" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="180" x2="50" y2="180" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="190" y1="190" x2="210" y2="190" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <circle cx="80" cy="30" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="160" cy="40" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="210" cy="130" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="40" cy="110" r="1" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Dynamic Motion Trails -->
  <path d="M 60,190 Q 120,120 155,75" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 6" opacity="0.4" stroke-linecap="round"/>
  <path d="M 75,205 Q 135,135 170,90" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Rocket Exhaust / Speed Flames -->
  <g transform="translate(145, 65) rotate(45)">
    <path d="M -12,0 L 0,45 L 12,0 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
    <path d="M -6,0 L 0,25 L 6,0 Z" fill="#fef08a"/>
  </g>

  <!-- Main Rocket Body (Representing Speed / Urgent Action) -->
  <g transform="translate(145, 65) rotate(45)">
    <!-- Fins -->
    <path d="M -12,15 L -22,25 L -10,25 Z" fill="#ef4444"/>
    <path d="M 12,15 L 22,25 L 10,25 Z" fill="#ef4444"/>

    <!-- Body cylinder -->
    <path d="M -12,-15 C -12,-25 12,-25 12,-15 L 12,20 C 12,25 -12,25 -12,20 Z" fill="url(#rocketGrad)"/>
    
    <!-- Nose cone -->
    <path d="M -12,-15 C -12,-25 12,-25 12,-15 Z" fill="#ef4444"/>

    <!-- Window Porthole -->
    <circle cx="0" cy="-5" r="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="-1" cy="-6" r="1.5" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Mailbox / Desk Base (Contextual Environment) -->
  <g transform="translate(45, 135)">
    <!-- Desk / Surface -->
    <path d="M -20,70 L 110,70 L 130,95 L -40,95 Z" fill="#334155"/>
    <path d="M -20,70 L 110,70 L 110,74 L -20,74 Z" fill="#475569"/>

    <!-- Clock / Timer showing urgency (Speed / As fast as possible) -->
    <g transform="translate(45, 15)">
      <!-- Clock Shadow -->
      <circle cx="0" cy="2" r="32" fill="#000000" opacity="0.3"/>
      <!-- Clock Outer Rim -->
      <circle cx="0" cy="0" r="32" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
      <circle cx="0" cy="0" r="30" fill="#ffffff"/>
      
      <!-- Clock Ticks -->
      <line x1="0" y1="-26" x2="0" y2="-22" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="0" x2="22" y2="0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="26" x2="0" y2="22" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="-26" y1="0" x2="-22" y2="0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

      <!-- Clock Hands pointing to fast/action -->
      <line x1="0" y1="0" x2="0" y2="-16" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="14" y2="8" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#ef4444"/>

      <!-- Speed lines radiating from clock -->
      <path d="M -36,-15 L -42,-18" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 36,-15 L 42,-18" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Urgent Message / Flying Envelope -->
    <g transform="translate(85, -15) rotate(-15)" filter="url(#glow)">
      <!-- Envelope Shadow -->
      <rect x="-22" y="-14" width="44" height="30" rx="4" fill="#000000" opacity="0.3"/>
      <!-- Envelope Base -->
      <rect x="-24" y="-16" width="48" height="32" rx="4" fill="url(#envelopeGrad)"/>
      <!-- Envelope Flap / Details -->
      <path d="M -24,-16 L 0,2 L 24,-16" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M -24,16 L -8,2" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
      <path d="M 24,16 L 8,2" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Exclamation mark badge for urgency -->
      <circle cx="0" cy="-2" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M 0,-6 L 0,0 M 0,3 L 0,4" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Secondary stationery prop: Coffee cup to show working hard/fast -->
    <g transform="translate(-10, 40)">
      <rect x="-10" y="-15" width="20" height="25" rx="3" fill="#cbd5e1"/>
      <path d="M 10,-10 C 16,-10 16,0 10,2" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Steam lines representing hot/fast workflow -->
      <path d="M -4,-22 Q -2,-27 -6,-32" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <path d="M 4,-20 Q 6,-25 2,-30" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- Glowing Aura / Highlight overlay for high visual appeal -->
  <circle cx="150" cy="70" r="40" fill="#38bdf8" opacity="0.1" filter="url(#softGlow)"/>
</svg>