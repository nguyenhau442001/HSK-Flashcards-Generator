<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wooden Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33241b" />
      <stop offset="100%" stop-color="#1f140e" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Glass/Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Lamp Light Spill -->
  <circle cx="120" cy="120" r="110" fill="url(#lamp-glow)" pointer-events="none" />

  <!-- Background Environment: Office Bookshelf / Wall details -->
  <g opacity="0.15">
    <rect x="20" y="30" width="40" height="60" rx="4" fill="#ffffff" />
    <rect x="68" y="45" width="25" height="45" rx="4" fill="#ffffff" />
    <line x1="15" y1="95" x2="225" y2="95" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 0 165 L 240 165 L 240 240 L 0 240 Z" fill="url(#desk-grad)" />
  <path d="M 0 165 L 240 165" stroke="#453124" stroke-width="3" />

  <!-- Context Prop: Coffee Mug with Steam -->
  <g transform="translate(185, 135)" filter="url(#shadow)">
    <!-- Steam -->
    <path d="M 8 -8 Q 12 -16 8 -24" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 16 -10 Q 12 -20 18 -28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3" />
    <!-- Mug Body -->
    <rect x="2" y="-2" width="20" height="24" rx="4" fill="#ec4899" />
    <path d="M 22 4 C 28 4, 28 16, 22 16" stroke="#ec4899" stroke-width="3" fill="none" />
    <ellipse cx="12" cy="-2" rx="10" ry="3" fill="#f472b6" />
    <ellipse cx="12" cy="0" rx="8" ry="2" fill="#522b11" />
  </g>

  <!-- Context Prop: Laptop Screen & Base (Left background) -->
  <g transform="translate(25, 110)">
    <!-- Base -->
    <polygon points="-15 35, 75 35, 65 42, -5 42" fill="#64748b" />
    <!-- Screen Frame -->
    <rect x="0" y="-10" width="50" height="45" rx="4" fill="#334155" filter="url(#shadow)" />
    <!-- Screen Display -->
    <rect x="4" y="-6" width="42" height="37" rx="2" fill="url(#screen-glow)" />
    <!-- Code/Chart Lines on Screen -->
    <line x1="8" y1="2" x2="25" y2="2" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="8" x2="35" y2="8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="14" x2="20" y2="14" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <polyline points="8,30 15,22 23,26 38,18" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- MAIN SUBJECT: HETONG (THE CONTRACT / OFFICIAL DOCUMENT) -->
  <g transform="translate(65, 70)" filter="url(#shadow)">
    <!-- Folder / Leather Portfolio Base (slightly ajar underneath) -->
    <rect x="-10" y="-5" width="130" height="110" rx="8" fill="#0f172a" transform="rotate(-3 55 50)" />
    <rect x="-6" y="0" width="122" height="100" rx="6" fill="#1e293b" transform="rotate(-3 55 50)" />

    <!-- Main Contract Paper -->
    <g transform="rotate(2 55 50)">
      <!-- Paper Sheet Background -->
      <rect x="0" y="-10" width="110" height="125" rx="4" fill="#f8fafc" />
      
      <!-- Header Red Ribbon/Stamp Accent -->
      <rect x="15" y="0" width="80" height="8" rx="2" fill="#e2e8f0" />
      <rect x="15" y="0" width="20" height="8" rx="2" fill="#ef4444" />

      <!-- Document Mock Text Lines -->
      <line x1="15" y1="20" x2="95" y2="20" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <line x1="15" y1="30" x2="75" y2="30" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      
      <line x1="15" y1="45" x2="95" y2="45" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
      <line x1="15" y1="53" x2="95" y2="53" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
      <line x1="15" y1="61" x2="60" y2="61" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />

      <!-- Signature Area Lines -->
      <line x1="15" y1="85" x2="50" y2="85" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2" />
      <line x1="60" y1="85" x2="95" y2="85" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2" />

      <!-- Red Wax Seal / Official Stamp (Hấp dẫn/Chính thức) -->
      <g transform="translate(72, 65)">
        <circle cx="12" cy="12" r="14" fill="#dc2626" opacity="0.9" />
        <circle cx="12" cy="12" r="11" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 1" />
        <path d="M 7 12 L 11 16 L 17 9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>

  <!-- ACTION PROP: Fountain Pen / Signing Pen (Floating/Dynamic with Golden Glow) -->
  <g transform="translate(130, 45) rotate(-35)" filter="url(#glow-shadow)">
    <!-- Pen Cap / Back -->
    <rect x="0" y="0" width="12" height="40" rx="3" fill="#3b82f6" />
    <!-- Pen Clip -->
    <rect x="5" y="-5" width="2" height="15" rx="1" fill="#fbbf24" />
    <!-- Pen Body / Grip -->
    <rect x="0" y="40" width="12" height="60" rx="1" fill="#1d4ed8" />
    <!-- Gold Band -->
    <rect x="0" y="37" width="12" height="3" fill="#fbbf24" />
    <!-- Pen Nib Assembly -->
    <path d="M 0 100 L 6 120 L 12 100 Z" fill="#94a3b8" />
    <path d="M 3 100 L 6 116 L 9 100 Z" fill="#fbbf24" />
    <circle cx="6" cy="107" r="1" fill="#0f172a" />
    <line x1="6" y1="108" x2="6" y2="116" stroke="#0f172a" stroke-width="1" />
  </g>

  <!-- Action Sparkles / Success Indicators -->
  <g transform="translate(135, 30)" filter="url(#glow-shadow)">
    <path d="M 0 0 L 0 10 M -5 5 L 5 5" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <g transform="translate(165, 65)" filter="url(#glow-shadow)">
    <path d="M 0 0 L 0 6 M -3 3 L 3 3" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>
  <g transform="translate(110, 155)">
    <circle cx="0" cy="0" r="3" fill="#10b981" />
  </g>
  <g transform="translate(75, 40)">
    <circle cx="0" cy="0" r="2" fill="#fbbf24" />
  </g>

  <!-- Foreground Atmospheric Lighting Overlay -->
  <radialGradient id="corner-glow" cx="100%" cy="0%" r="70%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#corner-glow)" pointer-events="none" />
</svg>