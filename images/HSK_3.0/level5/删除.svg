<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Desk Environment -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#1e293b"/>
  <!-- Desk surface line -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>
  
  <!-- Office Plant in Background -->
  <path d="M25 170 L35 130 L45 170 Z" fill="#334155"/>
  <circle cx="35" cy="125" r="15" fill="#059669"/>
  <circle cx="25" cy="135" r="12" fill="#10b981"/>
  <circle cx="45" cy="138" r="12" fill="#047857"/>

  <!-- Coffee Mug -->
  <rect x="200" y="140" width="18" height="25" rx="3" fill="#cbd5e1"/>
  <path d="M218 145 C225 145 225 160 218 160" stroke="#cbd5e1" stroke-width="3" fill="none"/>

  <!-- Laptop Body & Screen -->
  <!-- Laptop Base / Keyboard deck -->
  <path d="M50 170 L70 140 H170 L190 170 Z" fill="#64748b"/>
  <path d="M60 170 L75 145 H165 L180 170 Z" fill="#475569"/>
  <rect x="95" y="152" width="50" height="12" rx="2" fill="#334155"/> <!-- Trackpad area -->

  <!-- Laptop Screen Lid (Angled slightly) -->
  <rect x="65" y="55" width="110" height="88" rx="8" fill="#334155"/>
  <rect x="71" y="61" width="98" height="76" rx="4" fill="#0f172a"/>

  <!-- UI Elements on Laptop Screen: Document & Trash Can Concept -->
  <!-- The Document being deleted -->
  <g id="document-icon">
    <rect x="85" y="75" width="36" height="48" rx="3" fill="#f8fafc"/>
    <rect x="91" y="83" width="24" height="4" rx="1" fill="#cbd5e1"/>
    <rect x="91" y="91" width="18" height="3" rx="1" fill="#cbd5e1"/>
    <rect x="91" y="98" width="20" height="3" rx="1" fill="#cbd5e1"/>
  </g>

  <!-- Glowing Action / Deletion effect (Red/Orange accent) -->
  <circle cx="140" cy="99" r="22" fill="#ef4444" opacity="0.15"/>
  <circle cx="140" cy="99" r="16" fill="#ef4444" opacity="0.3"/>

  <!-- Trash Can / Delete Bin on Screen -->
  <g id="trash-bin" transform="translate(126, 85)">
    <!-- Lid -->
    <rect x="-2" y="0" width="32" height="4" rx="2" fill="#f43f5e"/>
    <rect x="8" y="-3" width="12" height="3" rx="1" fill="#f43f5e"/>
    <!-- Can Body -->
    <path d="M1 5 L4 25 H24 L27 5 Z" fill="#fb7185"/>
    <!-- Vertical Slats -->
    <line x1="8" y1="8" x2="8" y2="22" stroke="#0f172a" stroke-width="1.5" opacity="0.4"/>
    <line x1="14" y1="8" x2="14" y2="22" stroke="#0f172a" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="8" x2="20" y2="22" stroke="#0f172a" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Deletion Motion Particles / Crosses -->
  <g stroke="#f43f5e" stroke-width="2" stroke-linecap="round">
    <line x1="110" y1="78" x2="116" y2="84"/>
    <line x1="116" y1="78" x2="110" y2="84"/>
  </g>

  <!-- Character: Hands and Arms interacting with the laptop -->
  <!-- Left Arm & Hand (Pressing key/trackpad) -->
  <path d="M50 200 C50 175 70 160 90 160" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
  <circle cx="95" cy="162" r="7" fill="#fbbf24"/> <!-- Hand/Finger -->

  <!-- Right Arm & Hand (Swiping/Confirming deletion gesture) -->
  <path d="M190 200 C190 175 160 155 140 150" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
  <circle cx="134" cy="148" r="7" fill="#fbbf24"/> <!-- Hand/Finger pointing to delete -->

  <!-- Character Back/Shoulders (Foreground bottom corners) -->
  <path d="M20 240 C20 205 35 190 60 190 L180 190 C205 190 220 205 220 240 Z" fill="#3b82f6"/>
  <!-- Collar -->
  <path d="M90 190 L120 215 L150 190 Z" fill="#f8fafc"/>
  
  <!-- Back of Head / Hair -->
  <path d="M95 145 C95 120 145 120 145 145 Z" fill="#0f172a"/>
  
  <!-- Dramatic Accent Lighting (Top Warm Rim Light) -->
  <path d="M0 0 H240 V10 H0 Z" fill="#fbbf24" opacity="0.3"/>
</svg>