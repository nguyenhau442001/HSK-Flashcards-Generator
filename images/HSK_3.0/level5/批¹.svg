<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Warehouse Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2"/>

  <!-- Delivery Boxes (The "Batch") -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="50" height="50" rx="4" fill="#fbbf24"/>
    <rect x="5" y="5" width="40" height="40" fill="#f59e0b" opacity="0.5"/>
    <rect x="55" y="10" width="40" height="40" rx="4" fill="#fb923c"/>
    <rect x="60" y="15" width="30" height="30" fill="#f59e0b" opacity="0.5"/>
    <rect x="100" y="20" width="30" height="30" rx="4" fill="#fbbf24"/>
  </g>

  <!-- Character: Warehouse Worker -->
  <g transform="translate(160, 100)">
    <!-- Body -->
    <path d="M20 120 L50 120 L45 70 L25 70 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="35" cy="55" r="15" fill="#fde68a"/>
    <!-- Cap -->
    <path d="M20 45 L50 45 L45 40 L25 40 Z" fill="#10b981"/>
    <!-- Arm pointing -->
    <path d="M45 80 L70 90" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="25" y="120" width="8" height="20" fill="#475569"/>
    <rect x="37" y="120" width="8" height="20" fill="#475569"/>
  </g>

  <!-- Clipboard/Manifest -->
  <rect x="130" y="110" width="20" height="25" rx="2" fill="#e2e8f0"/>
  <line x1="133" y1="115" x2="147" y2="115" stroke="#1e293b" stroke-width="2"/>
  <line x1="133" y1="122" x2="147" y2="122" stroke="#1e293b" stroke-width="2"/>

  <!-- Decorative light beams -->
  <path d="M180 0 L220 60" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
  <path d="M190 0 L230 70" stroke="#fbbf24" stroke-width="2" opacity="0.2"/>
</svg>