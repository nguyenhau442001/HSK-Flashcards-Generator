<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mountain Gradient (Overcoming difficulties) -->
    <linearGradient id="mountain-far" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="mountain-near" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Peak/Summit Glow -->
    <radialGradient id="summit-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="backpack-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment & Atmosphere -->
  <!-- Moon / Summit Light Source -->
  <circle cx="180" cy="50" r="35" fill="url(#summit-glow)" />
  <circle cx="180" cy="50" r="16" fill="#fef3c7" opacity="0.9" />

  <!-- Distant Mountain Ranges (The "Difficulties" Overcome) -->
  <polygon points="10,210 70,120 130,210" fill="url(#mountain-far)" />
  <polygon points="90,210 150,90 220,210" fill="url(#mountain-far)" opacity="0.7" />

  <!-- Closer Steep Mountain & Trail -->
  <path d="M 40,240 L 110,130 L 140,160 L 200,240 Z" fill="url(#mountain-near)" />
  
  <!-- Hiking Trail Path winding up -->
  <path d="M 190,240 Q 160,200 130,210 T 115,150 T 130,110 T 175,65" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.6" />

  <!-- Summit Flag (Victory/Success Goal) -->
  <g transform="translate(175, 45)">
    <line x1="0" y1="25" x2="0" y2="-5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <polygon points="0,-5 14,2 0,9" fill="#10b981" />
    <circle cx="0" cy="-5" r="1.5" fill="#f59e0b" />
  </g>

  <!-- Character (Hiker/Climber achieving the goal - "He") -->
  <!-- Positioned triumphantly near the upper ridge, leaning into the final slope with determination -->
  <g transform="translate(150, 75)">
    <!-- Backpack -->
    <path d="M -6,12 L -14,16 L -12,30 L -4,28 Z" fill="url(#backpack-grad)" />
    <path d="M -9,14 L -6,15" stroke="#fed7aa" stroke-width="1.5" />

    <!-- Right Arm (Reach/Climb motion) -->
    <path d="M 2,12 Q 14,10 20,4" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="20" cy="4" r="2.5" fill="#fde047" /> <!-- Hand gripping rock -->

    <!-- Torso (Leaning forward, dynamic climb) -->
    <path d="M -4,8 C -2,12 2,16 6,24 L -2,27 C -6,20 -8,14 -8,10 Z" fill="url(#jacket-grad)" />

    <!-- Legs (Solid stance on steep slope) -->
    <path d="M -2,27 L 4,38 L 12,35" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 4,26 L 12,30 L 18,25" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Head & Helmet -->
    <circle cx="4" cy="1" r="7" fill="#fde047" />
    <!-- Climbing Helmet -->
    <path d="M -2,-4 C 2,-7 8,-4 10,1 C 8,2 -1,2 -2,-4 Z" fill="#ef4444" />
    <!-- Determination Expression (Brow line) -->
    <line x1="4" y1="0" x2="8" y2="1" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />

    <!-- Left Arm (Lower, balancing) -->
    <path d="M -2,10 L -10,18" fill="none" stroke="#0369a1" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Rock Details & Contrast Elements -->
  <!-- Boulder right foreground -->
  <path d="M 190,240 L 220,200 L 240,240 Z" fill="#1e293b" />
  <path d="M 0,240 L 35,210 L 70,240 Z" fill="#0f172a" />

  <!-- Environmental Sparkles / Stars (Clear night sky overcoming darkness) -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="40" cy="40" r="1" />
    <circle cx="95" cy="30" r="1.5" />
    <circle cx="130" cy="60" r="1" />
    <circle cx="210" cy="90" r="1.2" />
    <circle cx="20" cy="95" r="0.8" />
  </g>

  <!-- Accent glow lighting on climber's shoulder -->
  <path d="M 152,80 Q 155,84 158,88" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Decorative App Frame Inner Border / Vignette -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4" />
</svg>