<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Birthday Cake/Celebration element -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="40" height="30" rx="4" fill="#ec4899"/>
    <rect x="15" y="-15" width="10" height="15" fill="#fb923c"/>
    <circle cx="20" cy="-20" r="3" fill="#f59e0b"/>
  </g>

  <!-- Character: 18-year-old youth -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 80 L20 80 L15 30 L-15 30 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 -5 C-25 -25 25 -25 25 -5 L20 0 L0 -20 L-20 0 Z" fill="#475569"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-5" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-5" r="3" fill="#0f172a"/>
    <!-- Happy Smile -->
    <path d="M-8 10 Q0 18 8 10" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>

  <!-- Driving School/Test Center Context -->
  <g transform="translate(160, 140)">
    <!-- Steering wheel icon stylized as a prop -->
    <circle cx="0" cy="0" r="20" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#fbbf24" stroke-width="4"/>
    <line x1="14" y1="-14" x2="-14" y2="14" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="#fbbf24"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="4" fill="#10b981"/>
  <circle cx="200" cy="60" r="6" fill="#fb923c"/>
  <path d="M180 180 L210 180 L195 210 Z" fill="#10b981" opacity="0.6"/>
</svg>