<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Exhaustion/Sigh concept -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweater-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  
  <!-- Ambient Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" pointer-events="none"/>

  <!-- SCENE: OFFICE / STUDY DESK ENVIRONMENT -->
  <g id="environment">
    <!-- Window with night city silhouette -->
    <g opacity="0.4">
      <rect x="160" y="25" width="55" height="70" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
      <!-- City buildings outside -->
      <rect x="165" y="55" width="10" height="40" fill="#1e293b"/>
      <rect x="178" y="45" width="12" height="50" fill="#1e293b"/>
      <rect x="193" y="65" width="15" height="30" fill="#1e293b"/>
      <!-- Tiny window lights -->
      <rect x="168" y="60" width="2" height="2" fill="#fbbf24"/>
      <rect x="182" y="52" width="2" height="3" fill="#fbbf24"/>
      <rect x="182" y="60" width="2" height="2" fill="#fbbf24"/>
      <rect x="198" y="70" width="3" height="2" fill="#fbbf24"/>
    </g>

    <!-- Wall Shelf with books -->
    <g>
      <rect x="25" y="45" width="90" height="6" rx="3" fill="#334155"/>
      <!-- Stacked books -->
      <path d="M 35 45 L 35 28 L 50 28 L 50 45 Z" fill="#f59e0b" />
      <path d="M 51 45 L 51 32 L 68 32 L 68 45 Z" fill="#10b981" />
      <path d="M 72 45 L 75 30 L 92 34 L 89 45 Z" fill="#ec4899" />
    </g>

    <!-- Desk Surface -->
    <path d="M 15 185 L 225 185 L 235 220 L 5 220 Z" fill="url(#desk-grad)" filter="url(#shadow)"/>
    <rect x="15" y="180" width="210" height="6" rx="2" fill="#475569"/>

    <!-- Desk Props: Laptop, Papers, Mug -->
    <!-- Open Laptop -->
    <g transform="translate(130, 140)">
      <!-- Laptop Base -->
      <path d="M -25 40 L 45 40 L 55 52 L -35 52 Z" fill="#64748b"/>
      <path d="M -20 44 L 40 44" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <!-- Laptop Screen -->
      <path d="M -28 -5 L 42 -5 L 45 40 L -25 40 Z" fill="#475569"/>
      <rect x="-23" y="0" width="62" height="37" fill="#0f172a"/>
      <!-- Code / Document lines on screen -->
      <rect x="-18" y="5" width="35" height="3" rx="1" fill="#38bdf8" opacity="0.8"/>
      <rect x="-18" y="11" width="25" height="3" rx="1" fill="#fb923c" opacity="0.8"/>
      <rect x="-18" y="17" width="40" height="3" rx="1" fill="#cbd5e1" opacity="0.6"/>
      <rect x="-18" y="23" width="20" height="3" rx="1" fill="#10b981" opacity="0.8"/>
    </g>

    <!-- Messy Paper Stack -->
    <g transform="translate(35, 175) rotate(-8)">
      <rect x="0" y="0" width="35" height="25" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="5" y1="6" x2="25" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="12" x2="30" y2="12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="18" x2="18" y2="18" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Coffee Mug with Steam (Representing fatigue/late night work) -->
    <g transform="translate(80, 160)">
      <path d="M 0 5 C 0 2 3 0 6 0 L 16 0 C 19 0 22 2 22 5 L 20 22 C 20 25 17 27 14 27 L 8 27 C 5 27 2 25 0 22 Z" fill="url(#mug-grad)" filter="url(#shadow)"/>
      <!-- Mug handle -->
      <path d="M 20 8 C 26 8 27 18 20 20" fill="none" stroke="#be185d" stroke-width="3" stroke-linecap="round"/>
      <!-- Steam Wisps -->
      <path d="M 7 -5 C 7 -9 13 -9 13 -13 C 13 -17 7 -17 7 -21" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <path d="M 15 -3 C 15 -7 19 -7 19 -11 C 19 -15 15 -15 15 -19" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </g>
  </g>

  <!-- MAIN CHARACTER: Exhaling deeply, expressing '唉' (Oi/Chà - Sigh of fatigue) -->
  <g id="character" transform="translate(25, 15)">
    <!-- Body / Shoulders slumped forward -->
    <g transform="translate(65, 125)">
      <!-- Torso -->
      <path d="M -30 45 C -30 25 10 20 45 45 L 50 75 C 50 75 10 80 -35 75 Z" fill="url(#sweater-grad)" filter="url(#shadow)"/>
      
      <!-- Slumped Arms / Hands on Head -->
      <!-- Left arm (supporting head) -->
      <path d="M -25 35 C -35 10 -15 -10 -5 -15" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
      <!-- Right arm resting -->
      <path d="M 35 35 C 50 45 55 60 55 70" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- Neck & Head (Leaned forward, brow furrowed) -->
    <g transform="translate(60, 105)">
      <!-- Neck -->
      <rect x="-4" y="0" width="12" height="18" rx="4" fill="#fcd34d"/>

      <!-- Head Base -->
      <circle cx="2" cy="-18" r="28" fill="#fcd34d" filter="url(#shadow)"/>
      
      <!-- Hair (Messy, tired hair tufts) -->
      <path d="M -24 -25 C -25 -40 5 -45 22 -32 C 28 -40 35 -30 28 -20 C 32 -10 25 -5 25 -5 C 10 -12 -15 -10 -24 -25 Z" fill="#334155"/>
      <path d="M -5 -43 C 2 -48 12 -44 15 -42" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

      <!-- Face Expressions (Tired, heavy eyelids, sighing mouth) -->
      <!-- Closed / Stressed Eyes (Downward diagonal lines showing exhaustion) -->
      <path d="M -8 -20 L -2 -16" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 10 -20 L 16 -16" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Worried Eyebrows -->
      <path d="M -10 -26 L -2 -22" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
      <path d="M 12 -26 L 18 -22" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

      <!-- Exhausted/Sighing Open Mouth ('唉' breath shape - rounded exhale) -->
      <ellipse cx="6" cy="-4" rx="5" ry="7" fill="#991b1b"/>
      <path d="M 2 -11 C 7 -11 9 -7 9 -4 C 9 -1 7 1 6 3" fill="none" stroke="#7f1d1d" stroke-width="1.5"/>

      <!-- Sweating / Exhale Puff details -->
      <!-- Sweat drop on temple -->
      <path d="M 23 -18 C 23 -18 27 -12 27 -9 C 27 -7 25 -5 23 -5 C 21 -5 19 -7 19 -9 C 19 -12 23 -18 23 -18 Z" fill="#38bdf8" opacity="0.8"/>
    </g>
  </g>

  <!-- VISUALIZING THE SIGH / '唉' (Floating Exhale Air / Action Lines) -->
  <g id="sigh-effect" transform="translate(100, 85)">
    <!-- Swirling exhaust / sigh wind lines representing the sound/concept of '唉' -->
    <path d="M 0 0 C -10 -5 -15 -15 -25 -10 C -30 -8 -32 0 -38 -2" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 5 8 C -5 2 -10 -5 -18 -2" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Floating sleepy zzz or sigh particles (abstract stylized breeze) -->
    <circle cx="-15" cy="-12" r="3" fill="#cbd5e1" opacity="0.5"/>
    <circle cx="-28" cy="-5" r="5" fill="#cbd5e1" opacity="0.3"/>
    <circle cx="-38" cy="-15" r="2" fill="#cbd5e1" opacity="0.4"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Border Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>