<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="50" fill="#475569"/>
  <rect x="190" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Laptop -->
  <path d="M70 160 L170 160 L185 120 L55 120 Z" fill="#64748b"/>
  <path d="M75 125 L165 125 L165 155 L75 155 Z" fill="#0f172a"/>
  
  <!-- Screen Content (Abstract digital document) -->
  <rect x="85" y="130" width="70" height="20" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="85" y="152" width="40" height="2" rx="1" fill="#fb923c"/>
  
  <!-- Character -->
  <circle cx="120" cy="80" r="25" fill="#fde68a"/>
  <path d="M105 85 Q120 95 135 85" stroke="#78350f" stroke-width="2" fill="none"/>
  <circle cx="112" cy="75" r="3" fill="#78350f"/>
  <circle cx="128" cy="75" r="3" fill="#78350f"/>
  
  <!-- Arm reaching to laptop -->
  <path d="M145 95 L160 120" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Email Icon (Floating) -->
  <g transform="translate(180, 60)">
    <path d="M0 0 L20 0 L20 15 L0 15 Z" fill="#fbbf24"/>
    <path d="M0 0 L10 8 L20 0" stroke="#f59e0b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Ambient light -->
  <circle cx="120" cy="120" r="80" fill="#38bdf8" opacity="0.05"/>
</svg>