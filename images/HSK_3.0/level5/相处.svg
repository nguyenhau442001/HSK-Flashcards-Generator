<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Cozy Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Lamp Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Heart Symbol Gradient (Warm Orange-Pink) -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Room Elements -->
  <!-- Wallpaper / Back Wall -->
  <rect x="16" y="16" width="208" height="150" rx="12" fill="#334155" opacity="0.4" />
  
  <!-- Window Frame & Night Sky -->
  <g transform="translate(150, 24)">
    <rect x="0" y="0" width="56" height="70" rx="6" fill="#090d16" />
    <!-- Windowpane cross -->
    <line x1="28" y1="0" x2="28" y2="70" stroke="#1e293b" stroke-width="3" />
    <line x1="0" y1="35" x2="56" y2="35" stroke="#1e293b" stroke-width="3" />
    <!-- Cute crescent moon & stars outside -->
    <path d="M40 15 A 8 8 0 1 1 30 25 A 9 9 0 0 0 40 15 Z" fill="#fbbf24" opacity="0.8" />
    <circle cx="12" cy="20" r="1.5" fill="#f8fafc" opacity="0.9" />
    <circle cx="18" cy="50" r="1" fill="#f8fafc" opacity="0.7" />
  </g>

  <!-- Warm Light Spill from Window -->
  <polygon points="150,24 206,24 220,180 80,180" fill="url(#windowLight)" pointer-events="none" />

  <!-- Shelving with Books and Plant -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="70" height="6" rx="3" fill="#475569" />
    <!-- Books -->
    <rect x="8" y="-18" width="8" height="18" rx="1.5" fill="#38bdf8" />
    <rect x="18" y="-22" width="10" height="22" rx="1.5" fill="#f43f5e" />
    <rect x="30" y="-16" width="7" height="16" rx="1.5" fill="#10b981" />
    <!-- Pot Plant on Shelf -->
    <path d="M52 -12 L64 -12 L62 0 L54 0 Z" fill="#94a3b8" />
    <path d="M58 -12 C 54 -22, 48 -18, 52 -26 C 58 -24, 62 -22, 58 -12 Z" fill="url(#leafGrad)" />
    <path d="M58 -12 C 64 -24, 70 -20, 64 -28 C 60 -24, 56 -20, 58 -12 Z" fill="url(#leafGrad)" />
  </g>

  <!-- Hanging Pendant Lamp -->
  <g transform="translate(120, 0)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#475569" stroke-width="2" />
    <path d="M-16 35 L16 35 L12 45 L-12 45 Z" fill="#f8fafc" filter="url(#softShadow)" />
    <!-- Bulb Glow -->
    <circle cx="0" cy="45" r="28" fill="url(#lampGlow)" />
  </g>

  <!-- Wooden Floor / Base -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2" />

  <!-- Cozy Living Room Sofa -->
  <g transform="translate(30, 105)" filter="url(#softShadow)">
    <!-- Sofa Back & Cushions -->
    <rect x="0" y="15" width="180" height="55" rx="16" fill="#64748b" />
    <rect x="12" y="20" width="76" height="48" rx="12" fill="#475569" />
    <rect x="92" y="20" width="76" height="48" rx="12" fill="#475569" />
    <!-- Sofa Base/Seat -->
    <rect x="-6" y="55" width="192" height="30" rx="12" fill="#475569" />
    <!-- Sofa Pillows -->
    <rect x="16" y="45" width="30" height="32" rx="10" fill="#fb923c" />
    <rect x="134" y="45" width="30" height="32" rx="10" fill="#38bdf8" />
  </g>

  <!-- Cozy Round Coffee Table & Mug -->
  <g transform="translate(120, 160)" filter="url(#softShadow)">
    <!-- Table Legs -->
    <line x1="-30" y1="20" x2="-40" y2="45" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="20" x2="40" y2="45" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <!-- Table Top (Ellipse) -->
    <ellipse cx="0" cy="20" rx="46" ry="14" fill="#cbd5e1" />
    <!-- Coffee Mug -->
    <rect x="-8" y="5" width="10" height="12" rx="2" fill="#f8fafc" />
    <path d="M2 7 C 6 7, 6 13, 2 13" stroke="#f8fafc" stroke-width="2" fill="none" />
    <!-- Tiny steam lines -->
    <path d="M-3 1 C -4 -2, -1 -4, -3 -6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- Floor Plant (Bottom Left) -->
  <g transform="translate(24, 150)">
    <path d="M 0 20 L 16 20 L 12 36 L 4 36 Z" fill="#cbd5e1" />
    <path d="M 8 20 C 0 5, -10 10, -15 0 C -5 -5, 2 5, 8 20 Z" fill="url(#leafGrad)" />
    <path d="M 8 20 C 15 2, 25 8, 28 -2 C 20 -5, 14 3, 8 20 Z" fill="url(#leafGrad)" />
    <path d="M 8 20 C 8 -2, 4 -12, 12 -18 C 10 -5, 10 5, 8 20 Z" fill="url(#leafGrad)" />
  </g>

  <!-- CHARACTERS: Two roommates/friends living together harmoniously -->
  
  <!-- Character 1: Left (Relaxed, smiling, holding a book or tablet) -->
  <g transform="translate(72, 110)">
    <!-- Legs seated -->
    <rect x="-18" y="45" width="22" height="15" rx="6" fill="#3b82f6" />
    <rect x="4" y="45" width="22" height="15" rx="6" fill="#3b82f6" />
    <ellipse cx="-18" cy="62" rx="6" ry="4" fill="#1e293b" />
    <ellipse cx="14" cy="62" rx="6" ry="4" fill="#1e293b" />

    <!-- Torso (Yellow Sweater) -->
    <path d="M-22 10 C-22 0, 22 0, 22 10 L 20 48 L -20 48 Z" fill="#fbbf24" filter="url(#softShadow)" />
    <!-- Sweater collar -->
    <path d="M-8 10 C-8 16, 8 16, 8 10 Z" fill="#f59e0b" />

    <!-- Head & Hair -->
    <circle cx="0" cy="-10" r="16" fill="#fbcfe8" />
    <!-- Dark neat hair -->
    <path d="M-16 -12 C-18 -25, 18 -25, 16 -12 C18 -6, 12 -2, 12 -2 C12 -2, 6 -6, 0 -6 C-6 -6, -12 -2, -12 -2 C-12 -2, -16 -6, -16 -12 Z" fill="#334155" />
    
    <!-- Face expression: Happy closed smiling eyes -->
    <path d="M-6 -10 C-4 -7, -2 -7, 0 -10" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M4 -10 C6 -7, 8 -7, 10 -10" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="2" cy="-4" r="1.5" fill="#f43f5e" opacity="0.6" />

    <!-- Arms gesturing happily -->
    <path d="M-22 15 C-32 20, -28 35, -20 32" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="-20" cy="32" r="4" fill="#fbcfe8" />
    
    <!-- Right arm holding a book -->
    <path d="M22 15 C30 20, 26 30, 16 35" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Open Book Prop -->
    <g transform="translate(12, 32) rotate(15)">
      <rect x="-10" y="-8" width="20" height="14" rx="2" fill="#f8fafc" />
      <line x1="0" y1="-7" x2="0" y2="5" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="-7" y1="-4" x2="-3" y2="-4" stroke="#94a3b8" stroke-width="1" />
      <line x1="-7" y1="-1" x2="-3" y2="-1" stroke="#94a3b8" stroke-width="1" />
      <line x1="3" y1="-4" x2="7" y2="-4" stroke="#94a3b8" stroke-width="1" />
      <line x1="3" y1="-1" x2="7" y2="-1" stroke="#94a3b8" stroke-width="1" />
    </g>
  </g>

  <!-- Character 2: Right (Laughing, leaning in warmly towards Character 1) -->
  <g transform="translate(156, 108)">
    <!-- Legs seated -->
    <rect x="-16" y="47" width="20" height="15" rx="6" fill="#0ea5e9" />
    <rect x="8" y="47" width="20" height="15" rx="6" fill="#0ea5e9" />
    <ellipse cx="-16" cy="64" rx="6" ry="4" fill="#1e293b" />
    <ellipse cx="12" cy="64" rx="6" ry="4" fill="#1e293b" />

    <!-- Torso (Teal/Mint Hoodie) -->
    <path d="M-18 12 C-18 2, 22 4, 22 14 L 18 50 L -22 50 Z" fill="#2dd4bf" filter="url(#softShadow)" />
    <!-- Hoodie pocket -->
    <path d="M-10 36 L 10 36 L 8 46 L -8 46 Z" fill="#14b8a6" opacity="0.6" />
    <path d="M-2 12 C-2 18, 2 18, 2 12 Z" fill="#14b8a6" />

    <!-- Head & Hair -->
    <circle cx="2" cy="-12" r="16" fill="#fbcfe8" />
    <!-- Fluffy curly hair (Orange/Brown) -->
    <path d="M-12 -22 C-20 -22, -18 -8, -12 -4 C-16 0, -4 4, 4 -2 C12 2, 20 -6, 14 -16 C20 -24, 6 -28, -2 -22 C-8 -26, -10 -24, -12 -22 Z" fill="#ea580c" />

    <!-- Face expression: Joyful open smile, looking towards left character -->
    <circle cx="-2" cy="-13" r="1.5" fill="#1e293b" />
    <circle cx="6" cy="-13" r="1.5" fill="#1e293b" />
    <path d="M0 -7 C2 -4, 6 -4, 8 -7" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="-6" cy="-7" r="2" fill="#f43f5e" opacity="0.6" />

    <!-- Arms -->
    <!-- Left arm resting towards center -->
    <path d="M-18 16 C-26 22, -22 35, -12 36" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Right arm resting happily on knee -->
    <path d="M18 18 C26 25, 20 40, 10 42" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Floating Warm Heart Symbol representing "相处得很好" (getting along very well) -->
  <g transform="translate(114, 80)" filter="url(#softShadow)">
    <path d="M0 6 C-8 -2, -16 -8, -16 -16 C-16 -24, -6 -24, 0 -16 C6 -24, 16 -24, 16 -16 C16 -8, 8 -2, 0 6 Z" fill="url(#heartGrad)">
      <!-- Gentle pulsing animation feel via transform scale in static vector -->
      <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="2s" repeatCount="indefinite" additive="sum" />
    </path>
  </g>

  <!-- Sparkles / Ambient Warmth -->
  <g opacity="0.8">
    <path d="M 96 64 L 98 70 L 104 72 L 98 74 L 96 80 L 94 74 L 88 72 L 94 70 Z" fill="#fde047" transform="scale(0.6) translate(60, 20)" />
    <path d="M 140 50 L 141 54 L 145 55 L 141 56 L 140 60 L 139 56 L 135 55 L 139 54 Z" fill="#fde047" transform="scale(0.5) translate(140, -10)" />
    <circle cx="120" cy="115" r="1.5" fill="#fde047" />
    <circle cx="95" cy="100" r="1" fill="#fde047" />
    <circle cx="138" cy="98" r="1" fill="#fde047" />
  </g>
</svg>