<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="desk-glow" cx="0.5" cy="0.7" r="0.4">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Skin & Hair -->
    <linearGradient id="skin-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    
    <!-- Character 2 Skin & Hair -->
    <linearGradient id="skin-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>
  <rect width="240" height="240" rx="24" fill="url(#desk-glow)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall Details / Shelves -->
  <g opacity="0.4">
    <!-- Window with City Silhouette -->
    <rect x="85" y="30" width="70" height="60" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <path d="M95 55 h20 v30 h-20 z M125 45 h20 v40 h-20 z" fill="#1e293b"/>
    <!-- Bookshelf left -->
    <rect x="25" y="45" width="35" height="50" rx="4" fill="#334155"/>
    <line x1="25" y1="65" x2="60" y2="65" stroke="#475569" stroke-width="2"/>
    <line x1="25" y1="80" x2="60" y2="80" stroke="#475569" stroke-width="2"/>
    <!-- Shelf items -->
    <rect x="30" y="52" width="6" height="13" rx="1" fill="#f43f5e"/>
    <rect x="38" y="50" width="5" height="15" rx="1" fill="#38bdf8"/>
    <rect x="45" y="54" width="8" height="11" rx="1" fill="#10b981"/>
    
    <!-- Hanging Lamp -->
    <path d="M120 15 v25" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <path d="M105 40 h30 l-8 -10 h-14 z" fill="#fbbf24"/>
    <circle cx="120" cy="41" r="3" fill="#fef08a"/>
  </g>

  <!-- Ambient Light Cone from Lamp -->
  <polygon points="120,40 60,140 180,140" fill="#fbbf24" opacity="0.04"/>

  <!-- Large Wooden Desk -->
  <g filter="url(#shadow)">
    <!-- Desk Top -->
    <path d="M 40 145 L 200 145 L 210 160 L 30 160 Z" fill="#b45309"/>
    <!-- Desk Surface Highlight -->
    <path d="M 42 147 L 198 147 L 205 153 L 35 153 Z" fill="#d97706"/>
    <!-- Desk Front Panel -->
    <path d="M 30 160 L 210 160 L 210 185 L 30 185 Z" fill="#92400e"/>
    <!-- Desk Legs -->
    <rect x="45" y="185" width="12" height="40" rx="4" fill="#78350f"/>
    <rect x="183" y="185" width="12" height="40" rx="4" fill="#78350f"/>
  </g>

  <!-- Desk Props (Green Plant, Coffee Cup, Laptop) -->
  <!-- Plant -->
  <path d="M 55 145 c 0 -8 10 -8 10 0 z" fill="#10b981"/>
  <circle cx="60" cy="138" r="4" fill="#34d399"/>
  <circle cx="68" cy="140" r="3" fill="#059669"/>
  <path d="M 57 145 h 6 l -1 8 h -4 z" fill="#cbd5e1"/>
  
  <!-- Laptop -->
  <path d="M 160 138 l 25 5 l -5 12 l -25 -5 z" fill="#94a3b8"/>
  <path d="M 140 143 l 22 4 l -4 10 l -22 -4 z" fill="#cbd5e1"/>
  <path d="M 137 157 l 30 6 l 3 3 l -30 -6 z" fill="#64748b"/>

  <!-- CHARACTER 1 (Left - Giving/Exchanging Blue Document) -->
  <g class="character-left" filter="url(#shadow)">
    <!-- Body / Torso (Teal Hoodie) -->
    <path d="M 55 155 q 10 -25 25 -25 t 25 25 l 5 45 h -60 z" fill="#0ea5e9"/>
    <!-- Hoodie Pocket & Details -->
    <path d="M 68 180 h 24 v 15 h -24 z" fill="#0284c7"/>
    <circle cx="80" cy="135" r="4" fill="#ffffff"/>
    
    <!-- Left Arm reaching forward to exchange -->
    <path d="M 60 145 c -10 5 -20 15 -25 25 c -3 5 0 8 4 6 c 10 -5 18 -15 24 -22 z" fill="#0284c7"/>
    <!-- Left Hand -->
    <circle cx="37" cy="172" r="5" fill="url(#skin-1)"/>

    <!-- Head & Neck -->
    <path d="M 72 110 h 16 v 15 h -16 z" fill="url(#skin-1)"/>
    <circle cx="80" cy="98" r="18" fill="url(#skin-1)"/>
    <!-- Hair (Dark stylish bob) -->
    <path d="M 62 95 c 0 -12 10 -20 20 -20 c 12 0 20 8 20 20 c 0 4 -2 10 -3 14 c -2 -2 -5 -5 -8 -5 c -4 0 -7 3 -10 3 c -3 0 -7 -3 -10 -3 c -3 0 -6 3 -8 5 c -1 -4 -1 -10 -1 -14 z" fill="#1e1b4b"/>
    <!-- Face Expressions (Friendly, focused) -->
    <circle cx="74" cy="95" r="2" fill="#0f172a"/>
    <circle cx="86" cy="95" r="2" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M 78 104 q 2 3 5 0" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="72" cy="100" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="88" cy="100" r="3" fill="#fda4af" opacity="0.6"/>
  </g>


  <!-- CHARACTER 2 (Right - Receiving/Exchanging Orange Folder) -->
  <g class="character-right" filter="url(#shadow)">
    <!-- Body / Torso (Warm Coral/Orange Sweater) -->
    <path d="M 130 155 q 10 -25 25 -25 t 25 25 l 5 45 h -60 z" fill="#f43f5e"/>
    <!-- Sweater collar -->
    <path d="M 145 130 q 10 5 20 0 v 6 q -10 5 -20 0 z" fill="#be123c"/>

    <!-- Right Arm reaching forward to exchange -->
    <path d="M 180 145 c 10 5 20 15 25 25 c 3 5 0 8 -4 6 c -10 -5 -18 -15 -24 -22 z" fill="#e11d48"/>
    <!-- Right Hand -->
    <circle cx="203" cy="172" r="5" fill="url(#skin-2)"/>

    <!-- Head & Neck -->
    <path d="M 152 110 h 16 v 15 h -16 z" fill="url(#skin-2)"/>
    <circle cx="160" cy="98" r="18" fill="url(#skin-2)"/>
    <!-- Hair (Curly/Messy amber) -->
    <path d="M 142 95 c 0 -14 8 -22 20 -22 c 14 0 20 10 20 22 c 0 3 -1 6 -2 8 c -3 -2 -5 -4 -8 -2 c -3 2 -5 6 -9 6 c -4 0 -6 -4 -9 -6 c -3 -2 -5 0 -8 2 c -1 -2 -2 -5 -2 -8 z" fill="#78350f"/>
    <!-- Face Expressions -->
    <circle cx="154" cy="95" r="2" fill="#0f172a"/>
    <circle cx="166" cy="95" r="2" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M 157 103 q 3 3 6 0" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="152" cy="100" r="3" fill="#fbcfe8" opacity="0.6"/>
    <circle cx="168" cy="100" r="3" fill="#fbcfe8" opacity="0.6"/>
  </g>


  <!-- CENTRAL ACTION OBJECTS (The "Exchange" / Items passing hands) -->
  <g class="exchange-items" filter="url(#shadow)">
    <!-- Item 1: Blue File / Document passing from Left to Center -->
    <g transform="translate(85, 150) rotate(-15)">
      <rect x="0" y="0" width="30" height="22" rx="2" fill="#38bdf8"/>
      <rect x="3" y="3" width="24" height="3" rx="1" fill="#bae6fd"/>
      <line x1="5" y1="10" x2="20" y2="10" stroke="#f0fdf4" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="15" x2="15" y2="15" stroke="#f0fdf4" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Item 2: Orange Folder / Gift box passing from Right to Center -->
    <g transform="translate(125, 142) rotate(15)">
      <rect x="0" y="0" width="32" height="24" rx="3" fill="#fb923c"/>
      <rect x="0" y="0" width="32" height="7" rx="3" fill="#ea580c"/>
      <!-- Ribbon bow -->
      <circle cx="16" cy="4" r="3" fill="#fff7ed"/>
      <path d="M 12 1 h 8 v 3 h -8 z" fill="#c2410c"/>
    </g>
  </g>

  <!-- Dynamic Motion / Action Lines representing the swap -->
  <g opacity="0.8">
    <!-- Curved motion path overlay indicating mutual exchange -->
    <path d="M 95 138 Q 120 120 145 138" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>
    <path d="M 145 155 Q 120 172 95 155" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>
    
    <!-- Sparkles / Success indicators -->
    <path d="M 120 115 l 2 4 l 4 2 l -4 2 l -2 4 l -2 -4 l -4 -2 l 4 -2 z" fill="#fde047"/>
    <path d="M 105 175 l 1 3 l 3 1 l -3 1 l -1 3 l -1 -3 l -3 -1 l 3 -1 z" fill="#38bdf8"/>
    <path d="M 135 170 l 1.5 3 l 3 1.5 l -3 1.5 l -1.5 3 l -1.5 -3 l -3 -1.5 l 3 -1.5 z" fill="#f43f5e"/>
  </g>

</svg>