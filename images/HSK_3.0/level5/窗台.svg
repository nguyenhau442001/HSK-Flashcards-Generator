<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window Frame -->
  <rect x="40" y="40" width="160" height="120" rx="4" fill="none" stroke="#334155" stroke-width="8"/>
  <line x1="120" y1="40" x2="120" y2="160" stroke="#334155" stroke-width="6"/>
  
  <!-- Window Sill (The Target: 窗台) -->
  <rect x="30" y="160" width="180" height="12" rx="2" fill="#475569"/>
  
  <!-- Potted Plants on the Sill -->
  <!-- Pot 1 -->
  <path d="M55 160h30l-3 15h-24z" fill="#fb923c"/>
  <circle cx="70" cy="145" r="12" fill="#10b981"/>
  <circle cx="60" cy="140" r="10" fill="#10b981"/>
  <circle cx="80" cy="140" r="8" fill="#10b981"/>
  
  <!-- Pot 2 -->
  <path d="M105 160h30l-3 15h-24z" fill="#ec4899"/>
  <ellipse cx="120" cy="145" rx="15" ry="10" fill="#f59e0b"/>
  
  <!-- Pot 3 -->
  <path d="M155 160h30l-3 15h-24z" fill="#38bdf8"/>
  <circle cx="170" cy="148" r="12" fill="#fbbf24"/>
  <path d="M170 136l-5-10M170 136l5-10M170 136l0-12" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Interior Context: A person looking out -->
  <path d="M160 180c0-20 20-30 40-30s40 10 40 30v60h-80z" fill="#334155"/>
  <circle cx="200" cy="190" r="15" fill="#cbd5e1"/>
  <path d="M190 205h20v10h-20z" fill="#1e293b"/>
  
  <!-- Warm light glow from outside -->
  <circle cx="120" cy="100" r="30" fill="#fbbf24" opacity="0.1"/>
</svg>