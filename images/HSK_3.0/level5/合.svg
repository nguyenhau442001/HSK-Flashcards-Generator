<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Classroom Desk -->
  <rect x="40" y="150" width="160" height="20" rx="4" fill="#475569"/>
  <rect x="50" y="170" width="10" height="50" fill="#334155"/>
  <rect x="180" y="170" width="10" height="50" fill="#334155"/>
  
  <!-- Book being closed (The Action) -->
  <g transform="translate(120, 140)">
    <path d="M-40 -10 L40 -10 L30 10 L-50 10 Z" fill="#fbbf24"/>
    <path d="M-40 -10 L-50 10 L-30 20 L-20 0 Z" fill="#f59e0b"/>
    <path d="M-40 -10 L-30 0 L50 0 L40 -20 Z" fill="#fcd34d"/>
    <path d="M-35 -5 L35 -5" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Teacher Character (Upper body) -->
  <g transform="translate(120, 80)">
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <path d="M-8 -5 Q-4 -10 0 -10 Q4 -10 8 -5" stroke="#1e293b" stroke-width="2" fill="none"/>
    <circle cx="-8" cy="-5" r="2" fill="#1e293b"/>
    <circle cx="8" cy="-5" r="2" fill="#1e293b"/>
    <path d="M-10 10 Q0 15 10 10" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Arm gesture -->
    <path d="M25 0 L45 -20" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M-25 0 L-45 -20" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Background elements -->
  <rect x="60" y="40" width="120" height="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="200" cy="50" r="15" fill="#10b981" opacity="0.2"/>
  <path d="M30 100 L50 80" stroke="#ec4899" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M210 120 L190 140" stroke="#fb923c" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
</svg>