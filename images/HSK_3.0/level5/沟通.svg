<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients, glows, and clipping paths -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm ambient glow between characters -->
    <radialGradient id="connectionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Speech bubble gradient (Left) -->
    <linearGradient id="bubbleGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Speech bubble gradient (Right) -->
    <linearGradient id="bubbleGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Character 1 Skin & Hair -->
    <linearGradient id="hairLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Character 2 Hair -->
    <linearGradient id="hairRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environmental Details (Ambient room & desk) -->
  <g id="environment">
    <!-- Back wall shelf line -->
    <path d="M 30 70 L 210 70" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Small decorative plants/books on shelf -->
    <rect x="40" y="52" width="12" height="18" rx="2" fill="#10b981" opacity="0.4"/>
    <rect x="55" y="48" width="16" height="22" rx="2" fill="#38bdf8" opacity="0.4"/>
    <circle cx="185" cy="62" r="8" fill="#fb923c" opacity="0.4"/>
    <path d="M 185 70 L 185 58" stroke="#334155" stroke-width="2"/>

    <!-- Ambient Glow in the center (representing connection/communication) -->
    <circle cx="120" cy="120" r="80" fill="url(#connectionGlow)"/>

    <!-- Desk / Surface -->
    <path d="M 20 190 L 220 190 L 230 220 L 10 220 Z" fill="#0f172a" opacity="0.8"/>
    <path d="M 20 190 L 220 190" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Coffee cup on desk -->
    <path d="M 110 185 L 130 185 L 127 165 L 113 165 Z" fill="#f8fafc" opacity="0.8"/>
    <path d="M 130 170 C 135 170 135 180 130 182" stroke="#f8fafc" stroke-width="2" fill="none" opacity="0.8"/>
    <!-- Steam -->
    <path d="M 116 158 C 114 153 118 150 116 145" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M 124 158 C 126 153 122 150 124 145" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- INTERACTING DIALOGUE GRAPHICS (The core 'giao tiếp, trao đổi' metaphor) -->
  <g id="communication-flow">
    <!-- Floating exchange elements / dynamic connecting waves -->
    <path d="M 85 110 C 95 95, 110 95, 120 110 C 130 125, 145 125, 155 110" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 4" fill="none" opacity="0.8"/>
    <path d="M 85 130 C 95 145, 110 145, 120 130 C 130 115, 145 115, 155 130" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.6"/>

    <!-- Intertwining Thought/Speech Bubbles -->
    <!-- Left Bubble (Cyan/Blue) -->
    <g transform="translate(65, 80)">
      <path d="M 0 15 C 0 7, 7 0, 15 0 L 35 0 C 43 0, 50 7, 50 15 L 50 30 C 50 38, 43 45, 35 45 L 20 45 L 10 55 L 15 45 C 7 45, 0 38, 0 30 Z" fill="url(#bubbleGradLeft)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.3))"/>
      <!-- Icon inside left bubble: Musical note / ideas -->
      <circle cx="25" cy="22" r="6" fill="#ffffff" opacity="0.9"/>
      <path d="M 28 19 L 28 12 L 33 10 L 33 17" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Right Bubble (Pink/Magenta) -->
    <g transform="translate(125, 75)">
      <path d="M 15 0 L 35 0 C 43 0, 50 7, 50 15 L 50 30 C 50 38, 43 45, 35 45 L 30 45 L 25 55 L 25 45 L 15 45 C 7 45, 0 38, 0 30 L 0 15 C 0 7, 7 0, 15 0 Z" fill="url(#bubbleGradRight)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.3))"/>
      <!-- Icon inside right bubble: Heart / connection -->
      <path d="M 25 25 C 25 25, 18 19, 18 15 C 18 12.5, 20 11, 22 11 C 23.5 11, 25 12, 25 13 C 25 12, 26.5 11, 28 11 C 30 11, 32 12.5, 32 15 C 32 19, 25 25, 25 25 Z" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Sparkles / Connection particles -->
    <circle cx="100" cy="100" r="3" fill="#fbbf24"/>
    <circle cx="140" cy="105" r="2" fill="#38bdf8"/>
    <circle cx="120" cy="90" r="2.5" fill="#ec4899"/>
  </g>

  <!-- CHARACTER LEFT (Engaged Speaker) -->
  <g id="character-left">
    <!-- Body / Torso -->
    <path d="M 35 200 C 35 170, 50 160, 70 160 C 90 160, 105 170, 105 200 Z" fill="#38bdf8"/>
    <!-- Collar / Details -->
    <path d="M 55 160 L 70 175 L 85 160" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="62" y="145" width="16" height="20" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="70" cy="125" r="22" fill="#fbcfe8"/>

    <!-- Hair Left -->
    <path d="M 50 120 C 48 105, 58 95, 75 95 C 92 95, 94 110, 92 125 C 88 120, 80 105, 70 105 C 58 105, 52 115, 50 120 Z" fill="url(#hairLeft)"/>

    <!-- Expressive Face (Facing Right) -->
    <!-- Eye (Happy arc) -->
    <path d="M 72 122 C 75 125, 78 125, 81 122" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Open enthusiastic smile -->
    <path d="M 73 133 C 75 137, 80 137, 83 133" fill="#0f172a"/>

    <!-- Gesturing Arm (Talking pose) -->
    <path d="M 90 175 C 105 175, 110 155, 105 145" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="105" cy="143" r="5" fill="#fbcfe8"/>
  </g>

  <!-- CHARACTER RIGHT (Active Listener) -->
  <g id="character-right">
    <!-- Body / Torso -->
    <path d="M 135 200 C 135 170, 150 160, 170 160 C 190 160, 205 170, 205 200 Z" fill="#ec4899"/>
    <!-- Collar / Details -->
    <path d="M 155 160 L 170 175 L 185 160" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="162" y="145" width="16" height="20" fill="#fed7aa"/>

    <!-- Head -->
    <circle cx="170" cy="125" r="22" fill="#fed7aa"/>

    <!-- Hair Right -->
    <path d="M 150 120 C 148 105, 160 92, 175 92 C 192 92, 194 105, 192 125 C 190 115, 182 102, 170 102 C 158 102, 152 112, 150 120 Z" fill="url(#hairRight)"/>

    <!-- Expressive Face (Facing Left) -->
    <!-- Eye (Happy wink/arc) -->
    <path d="M 159 122 C 162 125, 165 125, 168 122" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Smiling mouth -->
    <path d="M 157 133 C 159 137, 164 137, 167 133" fill="#0f172a"/>

    <!-- Resting / Nodding Hand on chin (Thoughtful listening pose) -->
    <path d="M 150 175 C 140 175, 135 155, 148 140" stroke="#ec4899" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="150" cy="138" r="4.5" fill="#fed7aa"/>
  </g>

  <!-- Dynamic foreground action lines & energy bursts -->
  <g id="fx-accents">
    <!-- Action sparks top center -->
    <path d="M 115 50 L 120 40 L 125 50 L 135 55 L 125 60 L 120 70 L 115 60 L 105 55 Z" fill="#fbbf24" opacity="0.8"/>
    
    <!-- Floating energy dots -->
    <circle cx="45" cy="100" r="3" fill="#38bdf8" opacity="0.7"/>
    <circle cx="195" cy="95" r="3.5" fill="#ec4899" opacity="0.7"/>
    <circle cx="35" cy="150" r="2" fill="#fbbf24" opacity="0.6"/>
    <circle cx="205" cy="140" r="2.5" fill="#38bdf8" opacity="0.6"/>
  </g>
</svg>