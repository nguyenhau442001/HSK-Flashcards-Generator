<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Window with winter night scene -->
  <rect x="30" y="30" width="180" height="100" rx="8" fill="#334155"/>
  <path d="M120 30v100M30 80h180" stroke="#1e293b" stroke-width="4"/>
  <circle cx="180" cy="60" r="15" fill="#f8fafc"/>
  <path d="M40 110l5-10 5 10M60 110l5-10 5 10M80 110l5-10 5 10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Character: Person wrapped in scarf and blanket -->
  <g transform="translate(120, 180)">
    <!-- Blanket -->
    <path d="M-50 0h100v30a10 10 0 0 1-10 10h-80a10 10 0 0 1-10-10z" fill="#fb923c"/>
    <!-- Body/Sweater -->
    <rect x="-25" y="-40" width="50" height="40" rx="10" fill="#38bdf8"/>
    <!-- Scarf -->
    <path d="M-20 -35h40v10h-40z" fill="#ec4899"/>
    <path d="M-10 -25l-5 20" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-60" r="20" fill="#fde68a"/>
    <!-- Eyes (tired/sick) -->
    <ellipse cx="-8" cy="-65" rx="2" ry="3" fill="#1e293b"/>
    <ellipse cx="8" cy="-65" rx="2" ry="3" fill="#1e293b"/>
    <!-- Thermometer -->
    <path d="M20 -50l15 -15" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="35" cy="-65" r="4" fill="#ef4444"/>
  </g>

  <!-- Hot drink cup -->
  <g transform="translate(50, 200)">
    <rect x="-10" y="-20" width="20" height="20" rx="4" fill="#fbbf24"/>
    <path d="M-12 -15h-5a3 3 0 0 0 0 6h5" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <path d="M-5 -25l2 -5M0 -28l2 -5" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>