      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Sun/Heat Iconography -->
  <circle cx="190" cy="50" r="25" fill="#fbbf24" opacity="0.8"/>
  <path d="M190 15v10M190 75v10M155 50h10M215 50h10" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Character -->
  <g transform="translate(60, 100)">
    <!-- Body -->
    <path d="M40 120h40v-40c0-20-20-20-20-20s-20 0-20 20z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="50" r="25" fill="#fde68a"/>
    <!-- Sweat drops -->
    <path d="M50 35c0-5 5-10 5-10s5 5 5 10-5 5-5 5-5-5-5-5z" fill="#38bdf8"/>
    <path d="M75 40c0-5 5-10 5-10s5 5 5 10-5 5-5 5-5-5-5-5z" fill="#38bdf8"/>
    <!-- Eyes -->
    <ellipse cx="50" cy="45" rx="3" ry="4" fill="#1e293b"/>
    <ellipse cx="70" cy="45" rx="3" ry="4" fill="#1e293b"/>
    <!-- Mouth -->
    <path d="M55 60c5 5 15 5 20 0" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Hand Fan -->
  <path d="M110 120l30-30c5-5 10-5 15 0l10 10" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Heat Waves -->
  <path d="M30 150c10-10 20 10 30 0" stroke="#fb923c" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M150 160c10-10 20 10 30 0" stroke="#fb923c" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Ground -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
