<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Bowl of Nutrient-rich food (Steaming) -->
  <path d="M60 140 C60 175, 180 175, 180 140 Z" fill="#fb923c"/>
  <path d="M70 140 C70 165, 170 165, 170 140 Z" fill="#f59e0b"/>
  
  <!-- Broccoli florets -->
  <circle cx="90" cy="130" r="15" fill="#10b981"/>
  <circle cx="110" cy="120" r="18" fill="#10b981"/>
  <circle cx="130" cy="130" r="15" fill="#10b981"/>
  
  <!-- Carrot slices -->
  <ellipse cx="150" cy="145" rx="8" ry="5" fill="#ec4899"/>
  <ellipse cx="80" cy="150" rx="8" ry="5" fill="#ec4899"/>
  
  <!-- Steam/Vapor -->
  <path d="M100 110 Q105 90 100 70" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M140 110 Q145 90 140 70" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Utensil -->
  <rect x="190" y="100" width="10" height="80" rx="2" fill="#94a3b8"/>
  <path d="M185 100 L205 100 L200 80 L195 80 Z" fill="#94a3b8"/>
  
