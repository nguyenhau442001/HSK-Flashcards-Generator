<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Desk Lamp -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Ruler Gradient -->
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="80" r="90" fill="url(#lampGlow)" />

  <!-- Background Environment: Drafting Table & Studio Setup -->
  <g id="environment">
    <!-- Wooden Drafting Desk Top -->
    <path d="M 10 160 L 230 160 L 220 220 L 20 220 Z" fill="#334155" opacity="0.8" />
    <path d="M 0 165 L 240 165 L 240 168 L 0 168 Z" fill="#475569" />

    <!-- Architectural Blueprints on desk (background detail) -->
    <rect x="30" y="170" width="60" height="40" rx="2" fill="#1d4ed8" opacity="0.4" />
    <path d="M 40 180 L 70 180 M 40 190 L 60 190" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Potted Plant on desk -->
    <path d="M 195 160 L 215 160 L 210 140 L 200 140 Z" fill="#059669" />
    <circle cx="205" cy="132" r="14" fill="#10b981" />
    <circle cx="195" cy="125" r="10" fill="#34d399" />
  </g>

  <!-- Main Scene: The Narrow Road / Pathway Model -->
  <g id="road-model">
    <!-- Ground Base / Terrain Platform -->
    <ellipse cx="120" cy="155" rx="90" ry="30" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <ellipse cx="120" cy="150" rx="85" ry="26" fill="#1e293b" />

    <!-- The Road/Path curving through the model -->
    <path d="M 50 165 C 80 135, 160 135, 190 165 C 160 147, 80 147, 50 165 Z" fill="#475569" />
    
    <!-- Road Surface Texture & Center Dashes -->
    <path d="M 70 159 C 95 144, 145 144, 170 159" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.8" />

    <!-- Miniature Trees / Architecture alongside the road for scale -->
    <!-- Left Tree -->
    <circle cx="75" cy="130" r="8" fill="#10b981" />
    <rect x="73" y="136" width="4" height="8" fill="#78350f" />
    <!-- Right Tree -->
    <circle cx="155" cy="133" r="7" fill="#059669" />
    <rect x="153" y="139" width="4" height="7" fill="#78350f" />
    <!-- Tiny House -->
    <polygon points="110,128 120,120 130,128 130,136 110,136" fill="#f43f5e" />
    <polygon points="108,128 120,118 132,128" fill="#fb7185" />
  </g>

  <!-- Precision Measurement Tool: The Transparent Yellow Ruler -->
  <g id="ruler">
    <!-- Ruler Shadow -->
    <rect x="35" y="112" width="160" height="24" rx="2" fill="#000000" opacity="0.3" transform="rotate(-6 120 124)" />
    
    <!-- Ruler Body -->
    <rect x="35" y="110" width="160" height="24" rx="2" fill="url(#rulerGrad)" opacity="0.85" stroke="#fde047" stroke-width="1" transform="rotate(-6 120 124)" />

    <!-- Ruler Tick Marks & Numbers (Abstracted clean notches representing centimeters) -->
    <!-- We draw tick marks across the ruler representing exactly 10 visual units -->
    <g stroke="#854d0e" stroke-width="1.5" stroke-linecap="round" transform="rotate(-6 120 124)" opacity="0.8">
      <!-- 0 mark -->
      <line x1="45" y1="110" x2="45" y2="116" />
      <!-- 1 to 9 marks -->
      <line x1="56" y1="110" x2="56" y2="114" />
      <line x1="67" y1="110" x2="67" y2="114" />
      <line x1="78" y1="110" x2="78" y2="114" />
      <line x1="89" y1="110" x2="89" y2="114" />
      <line x1="100" y1="110" x2="100" y2="116" /> <!-- Mid 5cm -->
      <line x1="111" y1="110" x2="111" y2="114" />
      <line x1="122" y1="110" x2="122" y2="114" />
      <line x1="133" y1="110" x2="133" y2="114" />
      <line x1="144" y1="110" x2="144" y2="114" />
      <!-- 10 mark (Highlighting the target 10 centimeters span) -->
      <line x1="155" y1="110" x2="155" y2="118" stroke-width="2" stroke="#dc2626" />
      
      <line x1="166" y1="110" x2="166" y2="114" />
      <line x1="177" y1="110" x2="177" y2="114" />
      <line x1="188" y1="110" x2="188" y2="114" />
    </g>

    <!-- Highlight span indicator (Subtle bracket highlighting width) -->
    <path d="M 46 128 L 46 131 L 155 131 L 155 128" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-6 120 124)" />
    <circle cx="100.5" cy="120" r="3" fill="#dc2626" transform="rotate(-6 120 124)" />
  </g>

  <!-- Character: Designer / Engineer examining the width -->
  <g id="character">
    <!-- Character Head & Hair -->
    <path d="M 90 70 C 85 55, 105 45, 115 55 C 125 45, 145 55, 140 70 Z" fill="#334155" />
    <circle cx="115" cy="62" r="15" fill="#fbcfe8" /> <!-- Face skin tone -->
    <path d="M 102 58 C 110 50, 120 50, 128 58 C 122 55, 108 55, 102 58 Z" fill="#0f172a" /> <!-- Hair fringe -->

    <!-- Round Glasses (Focused look) -->
    <circle cx="110" cy="63" r="4" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="120" cy="63" r="4" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <line x1="114" y1="63" x2="116" y2="63" stroke="#0f172a" stroke-width="1.5" />

    <!-- Torso & Hoodie -->
    <path d="M 95 105 C 95 85, 135 85, 135 105 L 145 140 L 85 140 Z" fill="#38bdf8" />
    <!-- Hoodie Strings & Collar -->
    <path d="M 110 88 L 112 100" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
    <path d="M 120 88 L 118 100" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
    <path d="M 105 85 C 110 90, 120 90, 125 85" fill="none" stroke="#0284c7" stroke-width="2" />

    <!-- Arms & Hands pointing / holding ruler -->
    <!-- Left Arm reaching out to ruler -->
    <path d="M 95 95 L 65 110 L 55 115" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="53" cy="116" r="4" fill="#fbcfe8" />

    <!-- Right Arm leaning -->
    <path d="M 135 95 L 155 110 L 165 120" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="167" cy="122" r="4" fill="#fbcfe8" />
  </g>

  <!-- Desk Lamp hanging from top -->
  <g id="desk-lamp">
    <!-- Cord -->
    <line x1="200" y1="0" x2="200" y2="45" stroke="#64748b" stroke-width="3" />
    <!-- Lampshade -->
    <path d="M 180 45 L 220 45 L 230 65 L 170 65 Z" fill="#f59e0b" />
    <!-- Light Bulb Inner Glow -->
    <ellipse cx="200" cy="65" rx="12" ry="6" fill="#fef08a" />
  </g>

  <!-- Foreground Atmospheric Elements (Depth of Field) -->
  <circle cx="20" cy="210" r="2" fill="#64748b" opacity="0.4" />
  <circle cx="225" cy="190" r="3" fill="#64748b" opacity="0.3" />
</svg>