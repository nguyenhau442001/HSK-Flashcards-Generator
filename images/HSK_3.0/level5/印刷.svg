<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Dark Mode Slate Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environment / Print Shop Background Elements -->
  <!-- Shelf with books and ink rolls -->
  <rect x="25" y="45" width="85" height="6" rx="3" fill="#334155" />
  <!-- Book props on shelf -->
  <rect x="35" y="25" width="10" height="20" rx="2" fill="#ec4899" />
  <rect x="47" y="22" width="12" height="23" rx="2" fill="#38bdf8" />
  <rect x="61" y="27" width="9" height="18" rx="2" fill="#10b981" />
  <!-- Ink roller tool hanging -->
  <circle cx="85" cy="35" r="4" fill="#64748b" />
  <path d="M85 39v6" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Window showing subtle warm atmospheric glow (representing past time/year) -->
  <path d="M175 35h35v45h-35z" fill="#334155" rx="4" />
  <path d="M178 38h29v39h-29z" fill="#0f172a" />
  <circle cx="192" cy="50" r="6" fill="#fbbf24" opacity="0.6" />

  <!-- Main Work Table / Printing Press Base -->
  <rect x="20" y="170" width="200" height="14" rx="4" fill="#334155" />
  <rect x="35" y="184" width="16" height="42" rx="2" fill="#1e293b" />
  <rect x="189" y="184" width="16" height="42" rx="2" fill="#1e293b" />

  <!-- Printing Press Machine Structure -->
  <path d="M70 110h100v62H70z" fill="url(#pressGrad)" rx="8" />
  <circle cx="120" cy="140" r="18" fill="#1e293b" />
  <circle cx="120" cy="140" r="10" fill="#64748b" />
  <!-- Mechanical arm / handle -->
  <path d="M120 122v-22h25" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="145" cy="100" r="5" fill="#fb923c" />

  <!-- Printed Book / Sheets coming out of press -->
  <g transform="translate(85, 155)">
    <!-- Freshly printed stack of books representing "这本书" -->
    <path d="M0 10l50-8v12l-50 8z" fill="#f1f5f9" />
    <path d="M0 6l50-8v12l-50 8z" fill="#e2e8f0" />
    <path d="M0 2l50-8v12l-50 8z" fill="url(#paperGrad)" />
    <!-- Book spine side -->
    <path d="M50 2l12 4v12l-12-4z" fill="#0284c7" />
    <!-- Subtle content lines on cover (abstract illustration of print) -->
    <path d="M15 -2l15-2.5M15 1l15-2.5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Expressive Artisan Character inspecting the printed book -->
  <!-- Body/Torso -->
  <path d="M140 210c0-20 15-30 30-30s30 10 30 30v16h-60z" fill="#10b981" />
  <!-- Head & Hair -->
  <circle cx="170" cy="155" r="16" fill="#fbcfe8" />
  <path d="M156 150c2-10 12-14 24-12 10 2 14 10 14 10s-5-6-16-6c-10 0-18 4-22 8z" fill="#334155" />
  <!-- Protective Work Glasses -->
  <path d="M160 151h20v6h-20z" fill="#38bdf8" opacity="0.8" rx="2" />
  <path d="M158 154h24" stroke="#0f172a" stroke-width="1.5" />

  <!-- Character hands holding a sample printed book -->
  <g transform="translate(145, 175)">
    <rect x="0" y="0" width="22" height="16" rx="3" fill="#fb923c" transform="rotate(-15 11 8)" />
    <path d="M-2 10c4 4 12 4 16 0" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Floating Sparkles / Quality Assurance / Success Accents -->
  <path d="M50 80l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="url(#amberGlow)" />
  <path d="M205 95l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#38bdf8" />
  <circle cx="65" cy="120" r="2.5" fill="#10b981" />
  <circle cx="130" cy="75" r="2" fill="#fbbf24" />

</svg>