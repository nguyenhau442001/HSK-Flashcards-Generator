<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Cityscape Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Screen Glow -->
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ================= BACKGROUND & ENVIRONMENT ================= -->
  <!-- Floor line -->
  <line x1="0" y1="210" x2="240" y2="210" stroke="#0f172a" stroke-width="3"/>

  <!-- Modern Office Window / Cityscape Backdrop -->
  <path d="M140 30 L210 30 L210 160 L140 160 Z" fill="url(#window-glow)" />
  <!-- Window Grid Lines -->
  <line x1="175" y1="30" x2="175" y2="160" stroke="#1e293b" stroke-width="2"/>
  <line x1="140" y1="95" x2="210" y2="95" stroke="#1e293b" stroke-width="2"/>

  <!-- City Skyline Silhouette outside window -->
  <path d="M145 160 L145 120 L155 120 L155 160 
           L162 160 L162 90 L170 90 L170 160 
           L182 160 L182 105 L192 105 L192 160 
           L200 160 L200 130 L205 130 L205 160 Z" fill="#0f172a" opacity="0.7"/>

  <!-- Indoor Plant (Success/Growth symbol) -->
  <path d="M30 210 L30 170 C30 165 35 160 40 160 C45 160 50 165 50 170 L50 210 Z" fill="#64748b"/>
  <!-- Plant Leaves -->
  <path d="M40 160 Q 20 130 35 110 Q 50 140 40 160 Z" fill="#10b981"/>
  <path d="M40 160 Q 60 120 55 100 Q 35 130 40 160 Z" fill="#059669"/>
  <path d="M40 160 Q 40 110 25 105 Q 35 140 40 160 Z" fill="#34d399"/>

  <!-- Bookshelf / Architecture line on back wall -->
  <rect x="70" y="45" width="50" height="4" rx="2" fill="#334155"/>
  <rect x="80" y="32" width="12" height="13" rx="2" fill="#f43f5e"/>
  <rect x="94" y="35" width="10" height="10" rx="2" fill="#38bdf8"/>

  <!-- ================= FURNITURE ================= -->
  <!-- Executive Desk -->
  <path d="M60 175 L220 175 L210 210 L50 210 Z" fill="url(#desk-grad)"/>
  <!-- Desk front bevel/trim -->
  <path d="M58 175 L222 175 L226 182 L54 182 Z" fill="#64748b"/>

  <!-- Laptop & Graphs Setup -->
  <!-- Laptop Base -->
  <path d="M95 165 L135 165 L145 175 L85 175 Z" fill="#94a3b8"/>
  <!-- Laptop Screen -->
  <path d="M97 130 L133 130 L135 165 L95 165 Z" fill="#0f172a"/>
  <!-- Screen Chart (Success metrics) -->
  <path d="M102 155 L108 148 L116 152 L126 138" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glow Behind Laptop -->
  <circle cx="115" cy="150" r="25" fill="url(#screen-glow)"/>

  <!-- Golden Trophy (Symbolizing Success in Business) -->
  <g transform="translate(165, 135)">
    <!-- Trophy Base -->
    <rect x="3" y="25" width="14" height="5" rx="1" fill="#475569"/>
    <path d="M6 20 L14 20 L17 25 L3 25 Z" fill="#64748b"/>
    <!-- Cup Body -->
    <path d="M5 5 C5 15 15 15 15 15 C15 15 25 15 25 5 C25 2 22 2 20 2 L10 2 C8 2 5 2 5 5 Z" fill="url(#gold-grad)"/>
    <!-- Handles -->
    <path d="M5 7 C1 7 1 14 5 13" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M25 7 C29 7 29 14 25 13" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <!-- Star on Trophy -->
    <path d="M15 7 L16.5 10 L20 10.5 L17.5 13 L18 16 L15 14.5 L12 16 L12.5 13 L10 10.5 L13.5 10 Z" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="70" y="155" width="12" height="15" rx="3" fill="#f8fafc"/>
  <path d="M82 158 C86 158 86 167 82 167" fill="none" stroke="#f8fafc" stroke-width="2"/>


  <!-- ================= MAIN CHARACTER ================= -->
  <!-- Confident Business Professional (Successful Entrepreneur) -->
  <g transform="translate(85, 80)">
    <!-- Chair Back -->
    <path d="M-10 15 L25 15 L20 100 L-5 100 Z" fill="#334155" rx="5"/>
    
    <!-- Torso (Suit Jacket & Tie) -->
    <!-- Shoulders / Suit -->
    <path d="M-25 90 C-25 60 -15 50 7 50 C29 50 39 60 39 90 L35 120 L-20 120 Z" fill="#1e293b"/>
    <!-- Inner Shirt (White) -->
    <path d="M-5 50 L7 75 L19 50 Z" fill="#f8fafc"/>
    <!-- Red/Gold Power Tie -->
    <path d="M5 52 L9 52 L11 85 L7 90 L3 85 Z" fill="#ef4444"/>

    <!-- Head & Face -->
    <!-- Neck -->
    <path d="M1 42 L13 42 L13 52 L1 52 Z" fill="#fcd34d"/>
    <!-- Head Shape -->
    <circle cx="7" cy="28" r="16" fill="#fcd34d"/>
    <!-- Hair (Stylish modern dark hair) -->
    <path d="M-9 24 C-10 12 0 10 10 11 C20 12 23 18 23 28 C23 28 22 20 15 16 C8 12 -2 15 -9 24 Z" fill="#0f172a"/>
    <!-- Confident Expression / Smile -->
    <path d="M11 34 Q 14 37 17 34" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <!-- Eye (Happy/Confident crescent) -->
    <path d="M12 26 Q 15 28 18 26" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Gesturing Arm (Raised in success/confidence) -->
    <!-- Upper Arm & Forearm -->
    <path d="M-20 65 C-35 60 -40 40 -30 30" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand pointing/celebrating -->
    <circle cx="-30" cy="27" r="5" fill="#fcd34d"/>

    <!-- Other Arm (resting on desk) -->
    <path d="M35 75 C45 80 50 95 45 105" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- ================= FOREGROUND DETAILS / LIGHTING ================= -->
  <!-- Ambient Warm Lighting Flare top-left -->
  <circle cx="30" cy="20" r="60" fill="#fbbf24" opacity="0.08" filter="blur(20px)"/>

  <!-- Floating Success Sparkles / Confetti (Subtle) -->
  <path d="M 60 50 L 63 56 L 69 59 L 63 62 L 60 68 L 57 62 L 51 59 L 57 56 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 190 70 L 192 74 L 196 76 L 192 78 L 190 82 L 188 78 L 184 76 L 188 74 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="175" cy="55" r="2.5" fill="#10b981" opacity="0.9"/>
  <circle cx="50" cy="90" r="2" fill="#fbbf24" opacity="0.7"/>

</svg>