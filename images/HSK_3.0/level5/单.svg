  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <path d="M40 180 L200 180 L190 210 L50 210 Z" fill="#475569"/>
  <path d="M60 210 L70 230 M180 210 L170 230" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Customer -->
