<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.4"/>
  
  <!-- Toy Robot (Main Subject) -->
  <g transform="translate(120, 140)">
    <rect x="-30" y="-60" width="60" height="50" rx="8" fill="#38bdf8"/>
    <circle cx="-12" cy="-40" r="6" fill="#0f172a"/>
    <circle cx="12" cy="-40" r="6" fill="#0f172a"/>
    <rect x="-10" y="-25" width="20" height="5" fill="#fb923c"/>
    <rect x="-40" y="-50" width="10" height="30" rx="4" fill="#fbbf24"/>
    <rect x="30" y="-50" width="10" height="30" rx="4" fill="#fbbf24"/>
    <rect x="-20" y="-10" width="15" height="20" rx="4" fill="#10b981"/>
    <rect x="5" y="-10" width="15" height="20" rx="4" fill="#10b981"/>
  </g>

  <!-- Toy Blocks -->
  <rect x="40" y="190" width="30" height="30" rx="4" fill="#ec4899"/>
  <rect x="50" y="160" width="30" height="30" rx="4" fill="#f59e0b"/>
  <rect x="160" y="185" width="35" height="35" rx="4" fill="#38bdf8"/>
  
  <!-- Toy Ball -->
  <circle cx="180" cy="150" r="20" fill="#fb923c"/>
  <path d="M160 150 A20 20 0 0 1 200 150" fill="none" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Decorative Sparks/Action -->
  <circle cx="160" cy="100" r="3" fill="#fbbf24"/>
  <circle cx="80" cy="90" r="2" fill="#38bdf8"/>
  <circle cx="200" cy="80" r="4" fill="#10b981"/>
</svg>