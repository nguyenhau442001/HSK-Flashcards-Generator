<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Store Front Architecture -->
  <path d="M40 200 L200 200 L190 80 L50 80 Z" fill="#334155"/>
  <rect x="70" y="100" width="100" height="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Welcoming Doorway -->
  <path d="M100 120 L140 120 L140 200 L100 200 Z" fill="#1e293b" stroke="#fb923c" stroke-width="3"/>
  <circle cx="130" cy="160" r="4" fill="#fbbf24"/>
  
  <!-- Decorative Elements: Welcome Mat and Lanterns -->
  <rect x="90" y="200" width="60" height="10" rx="2" fill="#ec4899"/>
  <circle cx="60" cy="100" r="15" fill="#f59e0b" opacity="0.8"/>
  <circle cx="180" cy="100" r="15" fill="#f59e0b" opacity="0.8"/>
  
  <!-- Atmospheric Details: Glowing light beams -->
  <path d="M120 120 L110 80 L130 80 Z" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Stylized Character Silhouette entering -->
  <g transform="translate(105, 130)">
    <circle cx="15" cy="15" r="10" fill="#f8fafc"/>
    <path d="M5 30 L25 30 L20 60 L10 60 Z" fill="#f8fafc"/>
    <path d="M5 35 L0 50" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 35 L30 50" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Ground/Floor Detail -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
  <path d="M0 210 L240 210" stroke="#334155" stroke-width="2"/>
</svg>