<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Motion lines -->
    <path d="M-10 80 L-30 70 M-15 100 L-35 90 M-5 120 L-25 110" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Character Body -->
    <path d="M80 140 L100 140 L95 80 L85 80 Z" fill="#fb923c"/>
    <ellipse cx="90" cy="70" rx="15" ry="18" fill="#fde68a"/>
    
    <!-- Arms in motion -->
    <path d="M85 90 L60 110" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M95 90 L120 70" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Legs in stride -->
    <path d="M90 140 L70 170" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M90 140 L110 160" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Dropped items (context) -->
    <circle cx="50" cy="160" r="8" fill="#ec4899"/>
    <rect x="130" y="150" width="15" height="10" rx="2" fill="#10b981"/>
  </g>
  
  <!-- Environment details -->
  <path d="M0 200 L240 200" stroke="#334155" stroke-width="2"/>
  <circle cx="200" cy="50" r="30" fill="#fbbf24" opacity="0.1"/>
  <circle cx="200" cy="50" r="15" fill="#fbbf24" opacity="0.2"/>
</svg>