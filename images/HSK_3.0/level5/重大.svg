<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light Glow for "Important Decision" atmosphere -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window City Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- Background Environment: Office / Study Room -->
  <!-- Bookshelf on the back wall -->
  <rect x="25" y="45" width="60" height="90" rx="4" fill="#334155" opacity="0.6" />
  <rect x="30" y="65" width="50" height="4" fill="#475569" />
  <rect x="30" y="95" width="50" height="4" fill="#475569" />
  <rect x="30" y="125" width="50" height="4" fill="#475569" />
  <!-- Books on shelf -->
  <path d="M35 55 h8 v10 h-8 z" fill="#f43f5e" />
  <path d="M45 53 h12 v12 h-12 z" fill="#38bdf8" />
  <path d="M60 57 h6 v8 h-6 z" fill="#10b981" />
  <path d="M35 83 h10 v12 h-10 z" fill="#fbbf24" />
  <path d="M48 85 h7 v10 h-7 z" fill="#a855f7" />

  <!-- Large Window with city night view -->
  <path d="M160 35 h50 v95 h-50 z" fill="url(#window-glow)" stroke="#475569" stroke-width="2" rx="4" />
  <!-- Window Panes -->
  <line x1="185" y1="35" x2="185" y2="130" stroke="#475569" stroke-width="2" />
  <line x1="160" y1="82" x2="210" y2="82" stroke="#475569" stroke-width="2" />
  <!-- City skyline silhouettes through window -->
  <path d="M165 130 V105 h8 v25 h6 V95 h10 v35 h8 V110 h8 v20 z" fill="#0f172a" opacity="0.8" />
  <circle cx="200" cy="50" r="2" fill="#fbbf24" opacity="0.8" />

  <!-- Hanging Pendant Lamp -->
  <path d="M120 0 V35" stroke="#64748b" stroke-width="2" />
  <path d="M100 35 h40 l10 15 h-60 z" fill="#fbbf24" filter="url(#shadow)" />
  <ellipse cx="120" cy="50" rx="20" ry="8" fill="#f59e0b" opacity="0.6" />

  <!-- Large Wooden Desk -->
  <path d="M15 155 h210 v12 h-210 z" fill="#475569" filter="url(#shadow)" />
  <path d="M25 167 h190 v50 h-190 z" fill="#334155" />
  <!-- Desk legs -->
  <rect x="35" y="217" width="10" height="23" fill="#1e293b" />
  <rect x="195" y="217" width="10" height="23" fill="#1e293b" />

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M145 147 h35 v8 h-35 z" fill="#94a3b8" rx="2" />
  <path d="M138 155 h49 l6 4 h-61 z" fill="#cbd5e1" />
  <path d="M150 125 h25 v22 h-25 z" fill="#1e293b" rx="2" />
  <path d="M153 128 h19 v14 h-19 z" fill="#38bdf8" opacity="0.8" />

  <!-- Coffee Mug -->
  <path d="M195 138 h12 v17 h-12 z" fill="#f8fafc" rx="2" />
  <path d="M207 142 c4 0 4 8 0 8" fill="none" stroke="#f8fafc" stroke-width="2" />

  <!-- THE CENTRAL SCENARIO: The "Important Decision" Document / Contract -->
  <g filter="url(#shadow)">
    <!-- Document Base (Large, prominent on desk) -->
    <path d="M85 130 h70 v38 h-70 z" fill="#f8fafc" rx="3" transform="rotate(-4 120 148)" />
    <!-- Text lines mockup on document -->
    <line x1="93" y1="139" x2="125" y2="137" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="92" y1="148" x2="140" y2="146" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="91" y1="157" x2="115" y2="155" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    
    <!-- Red Official Seal / Signature Area highlighting the 'Major Decision' -->
    <circle cx="138" cy="153" r="8" fill="#ef4444" opacity="0.85" />
    <circle cx="138" cy="153" r="6" fill="none" stroke="#fee2e2" stroke-width="1.5" />
  </g>

  <!-- Fountain Pen hovering / signing -->
  <g transform="translate(100, 115) rotate(-25)">
    <path d="M0 0 l4 20 l-2 3 l-2 -3 z" fill="#0f172a" />
    <path d="M-1 23 l3 3 l-2 10 l-2 -10 z" fill="#fbbf24" />
    <!-- Pen cap -->
    <path d="M-1 -10 h6 v10 h-6 z" fill="#38bdf8" rx="1" />
  </g>

  <!-- CHARACTER: Thoughtful, focused professional making a major decision -->
  <!-- Character Body / Torso -->
  <path d="M70 217 c0 -35 15 -45 35 -45 c20 0 35 10 35 45 z" fill="#3b82f6" />
  <!-- Collar / Shirt -->
  <path d="M92 172 l13 12 l13 -12 z" fill="#f8fafc" />
  <path d="M98 178 l7 15 l7 -15 z" fill="#ef4444" /> <!-- Tie -->

  <!-- Character Neck -->
  <rect x="98" y="160" width="14" height="15" fill="#fbcfe8" />

  <!-- Character Head -->
  <path d="M88 125 c0 -18 14 -28 24 -28 c10 0 24 10 24 28 c0 16 -10 25 -24 25 c-14 0 -24 -9 -24 -25 z" fill="#fbcfe8" />

  <!-- Hair -->
  <path d="M87 122 c-2 -15 6 -28 24 -30 c18 -2 27 10 26 22 c-4 -5 -10 -8 -18 -8 c-12 0 -22 6 -32 16 z" fill="#1e293b" />

  <!-- Expressive Face (Deep concentration, realizing the weight of the moment) -->
  <!-- Eyebrows (slightly furrowed for serious/major decision vibe) -->
  <path d="M95 118 l10 -3" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M117 115 l10 3" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes (Focused downward at the document) -->
  <circle cx="101" cy="125" r="2.5" fill="#1e293b" />
  <circle cx="123" cy="125" r="2.5" fill="#1e293b" />

  <!-- Glasses to enhance professional/serious look -->
  <rect x="94" y="120" width="14" height="10" rx="2" fill="none" stroke="#475569" stroke-width="2" />
  <rect x="116" y="118" width="14" height="10" rx="2" fill="none" stroke="#475569" stroke-width="2" />
  <line x1="108" y1="123" x2="116" y2="122" stroke="#475569" stroke-width="2" />

  <!-- Thoughtful / Concentrated Mouth -->
  <path d="M108 140 q4 -2 8 0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- Hand interacting with pen/document -->
  <path d="M95 142 c-5 3 -8 8 -5 12 c2 3 6 4 9 2 z" fill="#fbcfe8" />

</svg>