  <path d="M175 135a5 5 0 0 0 0 10" fill="none" stroke="#10b981" stroke-width="3"/>
  
  <!-- Calendar/Time indicator -->
  <rect x="30" y="40" width="40" height="40" rx="4" fill="#334155"/>
  <rect x="30" y="40" width="40" height="10" rx="4" fill="#ec4899"/>
  <circle cx="40" cy="65" r="3" fill="#94a3b8"/>
  <circle cx="50" cy="65" r="3" fill="#94a3b8"/>
