<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Factory Background -->
  <path d="M20 180h200v40H20z" fill="#334155"/>
  <rect x="40" y="120" width="40" height="60" fill="#475569"/>
  <rect x="100" y="100" width="40" height="80" fill="#475569"/>
  <rect x="160" y="130" width="40" height="50" fill="#475569"/>
  
  <!-- Machinery/Conveyor -->
  <rect x="20" y="170" width="200" height="10" fill="#64748b"/>
  <circle cx="50" cy="180" r="8" fill="#94a3b8"/>
  <circle cx="190" cy="180" r="8" fill="#94a3b8"/>
  
  <!-- Characters -->
  <!-- Person 1: Pointing/Explaining -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M20 32v30M10 50l20-10M30 50l20-10" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 40l-10 20" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2: Holding Clipboard -->
  <g transform="translate(130, 100)">
    <circle cx="20" cy="20" r="12" fill="#38bdf8"/>
    <path d="M20 32v30M10 50l20-10M30 50l20-10" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <rect x="35" y="40" width="20" height="25" rx="2" fill="#f1f5f9"/>
    <path d="M38 45h14M38 50h14M38 55h8" stroke="#1e293b" stroke-width="1"/>
  </g>
  
  <!-- Accent Light -->
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.1"/>
  <path d="M180 40v40M160 60h40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>