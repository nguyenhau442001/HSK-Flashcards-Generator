<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mirror Reflection Gradient -->
    <linearGradient id="mirrorReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Vanity Glow -->
    <radialGradient id="vanityGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="120" cy="110" r="100" fill="url(#vanityGlow)"/>

  <!-- Wallpaper details (Background wall) -->
  <path d="M 0 60 L 240 60" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M 0 120 L 240 120" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Dressing Table / Vanity Surface -->
  <rect x="20" y="185" width="200" height="35" rx="6" fill="#334155" filter="url(#shadow)"/>
  <rect x="15" y="180" width="210" height="10" rx="3" fill="#475569"/>
  <!-- Table Wood Grain / Highlight -->
  <rect x="25" y="183" width="190" height="2" fill="#64748b" opacity="0.6"/>

  <!-- Vanity Mirror Frame -->
  <circle cx="120" cy="95" r="55" fill="#1e293b" stroke="#f59e0b" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="120" cy="95" r="50" fill="#0f172a"/>
  <!-- Mirror Glass & Reflection -->
  <circle cx="120" cy="95" r="48" fill="url(#mirrorReflect)"/>
  <!-- Mirror Highlight Arc -->
  <path d="M 82 70 A 48 48 0 0 1 158 70" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Character Reflection in Mirror (Dressing up / Applying makeup) -->
  <!-- Character Head Base -->
  <circle cx="120" cy="98" r="26" fill="#fbcfe8"/>
  <!-- Hair Back -->
  <path d="M 94 90 C 92 65, 148 65, 146 90 C 146 105, 150 115, 144 122 C 140 126, 100 126, 96 122 C 90 115, 94 105, 94 90 Z" fill="#0f172a"/>
  <!-- Hair Bangs & Styling -->
  <path d="M 98 86 C 105 72, 135 72, 142 86 C 135 80, 105 80, 98 86 Z" fill="#334155"/>
  <!-- Cheeks (Blush applied) -->
  <circle cx="107" cy="103" r="5" fill="#f43f5e" opacity="0.6"/>
  <circle cx="133" cy="103" r="5" fill="#f43f5e" opacity="0.6"/>
  <!-- Eyes -->
  <circle cx="111" cy="96" r="2" fill="#0f172a"/>
  <circle cx="129" cy="96" r="2" fill="#0f172a"/>
  <!-- Smiling Lips -->
  <path d="M 116 107 Q 120 112 124 107" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Makeup Hand holding Lipstick applying -->
  <path d="M 140 120 Q 135 110 126 106" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Lipstick Tube -->
  <rect x="123" y="102" width="6" height="12" rx="1" transform="rotate(-30 126 108)" fill="#f43f5e"/>
  <rect x="121" y="110" width="8" height="8" rx="1" transform="rotate(-30 125 114)" fill="#fbbf24"/>

  <!-- Vanity Light Bulbs (Hollywood Style Mirror) -->
  <circle cx="72" cy="62" r="5" fill="#fef08a" filter="url(#shadow)"/>
  <circle cx="92" cy="48" r="5" fill="#fef08a" filter="url(#shadow)"/>
  <circle cx="120" cy="43" r="5" fill="#fef08a" filter="url(#shadow)"/>
  <circle cx="148" cy="48" r="5" fill="#fef08a" filter="url(#shadow)"/>
  <circle cx="168" cy="62" r="5" fill="#fef08a" filter="url(#shadow)"/>
  
  <!-- Mirror Stand Base -->
  <path d="M 105 150 L 135 150 L 145 180 L 95 180 Z" fill="#475569" filter="url(#shadow)"/>
  <ellipse cx="120" cy="180" rx="30" ry="6" fill="#64748b"/>

  <!-- Prop 1: Perfume Bottle (Left) -->
  <g filter="url(#shadow)">
    <!-- Bottle Body -->
    <rect x="45" y="150" width="22" height="30" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="49" y="145" width="14" height="6" fill="#fbbf24"/>
    <rect x="52" y="140" width="8" height="5" fill="#e2e8f0"/>
    <!-- Liquid inside -->
    <rect x="47" y="158" width="18" height="20" rx="2" fill="#ec4899" opacity="0.6"/>
    <!-- Shine -->
    <path d="M 48 153 L 50 175" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Prop 2: Cosmetic Brush & Tray (Right) -->
  <g filter="url(#shadow)">
    <!-- Tray -->
    <ellipse cx="175" cy="182" rx="28" ry="7" fill="#64748b"/>
    <ellipse cx="175" cy="180" rx="26" ry="6" fill="#cbd5e1"/>
    
    <!-- Palette -->
    <rect x="160" y="155" width="28" height="20" rx="3" transform="rotate(15 174 165)" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Eyeshadow pans -->
    <circle cx="167" cy="163" r="3" fill="#f43f5e"/>
    <circle cx="178" cy="161" r="3" fill="#fbbf24"/>
    <circle cx="172" cy="170" r="3" fill="#38bdf8"/>
    <circle cx="183" cy="168" r="3" fill="#10b981"/>

    <!-- Makeup Brush -->
    <path d="M 195 140 L 210 175" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Ferrule -->
    <path d="M 192 134 L 196 143" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <!-- Bristles -->
    <path d="M 188 125 C 190 132, 195 134, 198 134 C 193 130, 190 127, 188 125 Z" fill="#f43f5e"/>
  </g>

  <!-- Prop 3: Open Lipstick / Makeup Case (Front Left) -->
  <g filter="url(#shadow)">
    <rect x="75" y="168" width="14" height="14" rx="2" transform="rotate(-15 82 175)" fill="#fb923c"/>
    <path d="M 72 165 L 75 152 L 80 154 L 77 167 Z" fill="#ec4899" transform="rotate(-15 82 175)"/>
  </g>

  <!-- Sparkling / Glamour Magic Elements (Action/Vibe details) -->
  <g fill="#fef08a">
    <!-- Sparkle 1 -->
    <path d="M 40 90 Q 40 100 30 100 Q 40 100 40 110 Q 40 100 50 100 Q 40 100 40 90 Z"/>
    <!-- Sparkle 2 -->
    <path d="M 200 80 Q 200 87 193 87 Q 200 87 200 94 Q 200 87 207 87 Q 200 87 200 80 Z" transform="scale(0.8) translate(50, 10)"/>
    <!-- Sparkle 3 -->
    <path d="M 120 20 Q 120 28 112 28 Q 120 28 120 36 Q 120 28 128 28 Q 120 28 120 20 Z" fill="#38bdf8"/>
  </g>

  <!-- Small floating bubbles/stars for festive 'dressing up' atmosphere -->
  <circle cx="70" cy="130" r="2" fill="#ec4899" opacity="0.8"/>
  <circle cx="170" cy="115" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="100" cy="145" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="150" cy="140" r="2" fill="#f43f5e" opacity="0.7"/>

  <!-- Border Frame Accent -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>