<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Bookstore Exterior -->
  <path d="M40 200 L200 200 L200 80 L120 40 L40 80 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="60" y="100" width="40" height="80" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="140" y="100" width="40" height="80" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Books visible inside -->
  <rect x="65" y="110" width="10" height="60" fill="#fb923c"/>
  <rect x="80" y="120" width="10" height="50" fill="#ec4899"/>
  <rect x="145" y="110" width="10" height="60" fill="#10b981"/>
  <rect x="160" y="120" width="10" height="50" fill="#f59e0b"/>
  
  <!-- Ribbon/Decor for Grand Opening -->
  <path d="M40 80 Q120 60 200 80" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="8 4"/>
  <circle cx="120" cy="70" r="8" fill="#ec4899"/>
  
  <!-- Character: Shop owner hanging a sign/decor -->
  <g transform="translate(100, 140)">
    <circle cx="20" cy="20" r="10" fill="#fde68a"/>
    <path d="M10 40 L15 60 M30 40 L25 60 M15 35 L25 35" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
    <rect x="15" y="30" width="10" height="20" fill="#38bdf8"/>
  </g>
  
  <!-- Calendar/Clock element implying "Tomorrow" -->
  <rect x="180" y="20" width="30" height="30" rx="4" fill="#334155"/>
  <rect x="185" y="35" width="20" height="10" fill="#fb923c"/>
  <circle cx="195" cy="25" r="3" fill="#f59e0b"/>
  
  <!-- Ground -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
</svg>