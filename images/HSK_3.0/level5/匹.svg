<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background gradient container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient lighting -->
  <circle cx="180" cy="80" r="70" fill="url(#lampGlow)" />

  <!-- Environment/Store Interior Backdrop -->
  <g id="environment">
    <!-- Walls & Wooden Beam -->
    <path d="M 0 0 L 240 0 L 240 180 L 0 180 Z" fill="#1e293b" />
    <rect x="0" y="170" width="240" height="70" fill="url(#groundGrad)" />
    <!-- Wooden fence/partition in background -->
    <rect x="20" y="90" width="12" height="90" rx="3" fill="#475569" />
    <rect x="50" y="90" width="12" height="90" rx="3" fill="#475569" />
    <rect x="80" y="90" width="12" height="90" rx="3" fill="#475569" />
    <rect x="10" y="110" width="100" height="6" rx="3" fill="#64748b" />
    <rect x="10" y="145" width="100" height="6" rx="3" fill="#64748b" />

    <!-- Hanging Lantern / Shop light -->
    <path d="M 200 0 L 200 35" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <circle cx="200" cy="45" r="14" fill="#fbbf24" />
    <path d="M 188 45 L 212 45 L 208 58 L 192 58 Z" fill="#d97706" />
  </g>

  <!-- THE HORSE (Con ngựa - 1 匹马) -->
  <g id="horse" transform="translate(100, 75)">
    <!-- Horse Shadow -->
    <ellipse cx="45" cy="98" rx="42" ry="10" fill="#090d16" opacity="0.6" />

    <!-- Legs (Back) -->
    <rect x="20" y="65" width="8" height="32" rx="4" fill="#9a3412" />
    <rect x="65" y="65" width="8" height="32" rx="4" fill="#9a3412" />

    <!-- Body & Torso -->
    <path d="M 15 45 C 15 30, 45 25, 75 35 C 90 40, 95 65, 80 80 C 60 90, 25 85, 15 65 Z" fill="#c2410c" />

    <!-- Legs (Front) -->
    <rect x="26" y="70" width="9" height="28" rx="4.5" fill="#c2410c" />
    <rect x="70" y="70" width="9" height="28" rx="4.5" fill="#c2410c" />
    <!-- Hooves -->
    <rect x="25" y="94" width="10" height="5" rx="2" fill="#451a03" />
    <rect x="69" y="94" width="10" height="5" rx="2" fill="#451a03" />
    <rect x="19" y="92" width="10" height="5" rx="2" fill="#451a03" />
    <rect x="64" y="92" width="10" height="5" rx="2" fill="#451a03" />

    <!-- Neck & Head -->
    <path d="M 65 38 C 75 25, 88 12, 98 8 C 102 6, 107 10, 104 15 C 98 25, 88 42, 82 48 Z" fill="#c2410c" />
    <!-- Muzzle / Nose -->
    <ellipse cx="102" cy="11" rx="6" ry="5" fill="#ea580c" />
    <circle cx="104" cy="10" r="1.5" fill="#451a03" />

    <!-- Mane (Bờm ngựa) -->
    <path d="M 66 32 C 72 20, 78 15, 82 12 C 80 18, 75 28, 70 38 Z" fill="#451a03" />
    <path d="M 73 38 C 79 28, 85 22, 88 19 C 86 26, 81 35, 76 43 Z" fill="#451a03" />

    <!-- Tail (Đuôi ngựa) -->
    <path d="M 16 50 C 5 55, -2 70, 2 85 C 5 80, 10 65, 18 58 Z" fill="#451a03" />

    <!-- Cute friendly decorative saddle / ribbon indicating "purchased" item -->
    <path d="M 38 35 L 58 37 L 55 58 L 35 55 Z" fill="#38bdf8" />
    <circle cx="46" cy="46" r="4" fill="#fbcfe8" />
  </g>

  <!-- HUMAN CHARACTER (Anh ấy - Mua hàng) -->
  <g id="character" transform="translate(18, 90)">
    <!-- Character Shadow -->
    <ellipse cx="32" cy="83" rx="22" ry="7" fill="#090d16" opacity="0.6" />

    <!-- Legs & Shoes -->
    <rect x="20" y="55" width="10" height="30" rx="5" fill="#1e293b" />
    <rect x="36" y="55" width="10" height="30" rx="5" fill="#1e293b" />
    <ellipse cx="24" cy="84" rx="7" ry="4" fill="#0f172a" />
    <ellipse cx="42" cy="84" rx="7" ry="4" fill="#0f172a" />

    <!-- Torso / Jacket -->
    <path d="M 18 20 C 18 15, 50 15, 52 20 L 56 55 C 56 58, 14 58, 14 55 Z" fill="#0ea5e9" />
    <!-- Shirt collar -->
    <path d="M 28 20 L 35 30 L 42 20 Z" fill="#f8fafc" />
    <line x1="35" y1="30" x2="35" y2="55" stroke="#0284c7" stroke-width="2" />

    <!-- Head & Face -->
    <circle cx="35" cy="8" r="14" fill="#ffedd5" />
    <!-- Hair -->
    <path d="M 21 8 C 21 -2, 49 -2, 49 8 C 45 4, 25 4, 21 8 Z" fill="#334155" />
    <!-- Happy Expression -->
    <circle cx="30" cy="7" r="1.5" fill="#1e293b" />
    <circle cx="40" cy="7" r="1.5" fill="#1e293b" />
    <path d="M 32 12 Q 35 15 38 12" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Rosy cheeks -->
    <circle cx="28" cy="11" r="2.5" fill="#fca5a5" opacity="0.6" />
    <circle cx="42" cy="11" r="2.5" fill="#fca5a5" opacity="0.6" />

    <!-- Arms & Interaction: Leading the horse with a rope/rein -->
    <!-- Left arm holding rope -->
    <path d="M 20 25 Q 10 35, 18 48" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Right arm pointing or holding receipt -->
    <path d="M 50 25 Q 62 32, 58 42" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" fill="none" />
    <circle cx="58" cy="43" r="4" fill="#ffedd5" />

    <!-- Hand holding receipt/contract -->
    <rect x="54" y="42" width="12" height="15" rx="1" fill="#f8fafc" transform="rotate(15 60 50)" />
    <line x1="57" y1="46" x2="63" y2="46" stroke="#94a3b8" stroke-width="1" />
    <line x1="57" y1="50" x2="61" y2="50" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Reins / Rope connecting man to horse -->
  <path d="M 76 132 C 85 130, 95 125, 120 102" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Foreground props: receipt / shop counter edge -->
  <path d="M 0 210 L 240 210 L 240 240 L 0 240 Z" fill="#0f172a" />
  <rect x="0" y="204" width="240" height="6" fill="#334155" />

  <!-- Golden star/sparkle accents to denote successful purchase/achievement -->
  <g transform="translate(180, 50)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(40, 60)">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#38bdf8" />
  </g>
</svg>