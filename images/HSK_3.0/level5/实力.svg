<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Window/Background -->
  <rect x="30" y="40" width="180" height="100" rx="8" fill="#334155" opacity="0.5"/>
  <path d="M30 80h180M120 40v100" stroke="#475569" stroke-width="2"/>
  
  <!-- The "Strong Company" Scene: A high-tech presentation -->
  <!-- Screen/Graph -->
  <rect x="50" y="55" width="60" height="40" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M55 85 L70 70 L85 75 L100 60" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Character: Professional Presenter -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M10 40h20l-5 40h-10z" fill="#38bdf8"/>
    <path d="M5 45h30" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="15" r="8" fill="#fef3c7"/>
  </g>
  
  <!-- Character: Impressed Client -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="12" fill="#ec4899"/>
    <path d="M10 35h20l-2 30h-16z" fill="#94a3b8"/>
    <circle cx="20" cy="15" r="6" fill="#fef3c7"/>
  </g>
  
  <!-- Desk/Table -->
  <rect x="20" y="180" width="200" height="20" rx="4" fill="#334155"/>
  
  <!-- Props: Laptop and Trophy -->
  <rect x="160" y="165" width="30" height="20" rx="2" fill="#94a3b8"/>
  <path d="M165 170h20m-15 5h10" stroke="#1e293b" stroke-width="2"/>
  
  <path d="M70 180v-20h10v-10h-20v10h10v20" fill="#fbbf24"/>
  <circle cx="70" cy="150" r="5" fill="#f59e0b"/>
  
  <!-- Decorative Accents -->
  <circle cx="200" cy="50" r="3" fill="#fb923c"/>
  <circle cx="40" cy="160" r="2" fill="#10b981"/>
</svg>