<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Doorway frame -->
  <rect x="80" y="40" width="80" height="180" rx="8" fill="#334155"/>
  <rect x="85" y="45" width="70" height="170" rx="4" fill="#0f172a"/>
  
  <!-- Light spilling from under the door -->
  <rect x="85" y="205" width="70" height="10" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Silhouette of person approaching -->
  <g transform="translate(120, 160)">
    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#f59e0b" opacity="0.8"/>
    <circle cx="0" cy="-35" r="12" fill="#f59e0b" opacity="0.8"/>
    <!-- Motion lines for footsteps -->
    <path d="M-20 20 L-35 35 M20 20 L35 35" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Interior room context -->
  <rect x="0" y="0" width="240" height="240" fill="none" stroke="#334155" stroke-width="2" rx="24"/>
  
  <!-- Desk and lamp inside the room -->
  <rect x="10" y="150" width="60" height="80" rx="4" fill="#1e293b"/>
  <path d="M20 150 L20 120 L50 120 L50 150" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="35" cy="115" r="8" fill="#38bdf8"/>
  
  <!-- Floor texture -->
  <line x1="0" y1="230" x2="240" y2="230" stroke="#475569" stroke-width="2"/>
  
  <!-- Sound waves/vibration effect -->
  <path d="M100 180 Q120 170 140 180" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.5"/>
  <path d="M95 190 Q120 180 145 190" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
</svg>