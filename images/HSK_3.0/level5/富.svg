<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Chest Gradients -->
    <linearGradient id="wood-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="wood-lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Gem Gradients -->
    <linearGradient id="gem-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gem-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Atmospheric Glow behind chest -->
  <circle cx="120" cy="130" r="70" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Scene Elements: Room Interior / Wall Decor -->
  <path d="M40 70 L200 70" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Decorative framed art background (abstract wealth symbol minimal lines) -->
  <rect x="95" y="30" width="50" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="120" cy="47" r="10" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>

  <!-- Plant/Nature accent (Jade plant / Money plant symbol of wealth) -->
  <path d="M 45 185 Q 40 160 55 140" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="55" cy="135" r="8" fill="#14b8a6"/>
  <circle cx="40" cy="148" r="6" fill="#14b8a6"/>
  <circle cx="65" cy="150" r="7" fill="#0d9488"/>
  <path d="M 35 185 L 65 185 L 60 205 L 40 205 Z" fill="#334155"/>

  <!-- TREASURE CHEST BASE -->
  <g id="treasure-chest">
    <!-- Back shadow -->
    <ellipse cx="120" cy="195" rx="75" ry="12" fill="#020617" opacity="0.6"/>

    <!-- Chest Back/Interior -->
    <rect x="55" y="125" width="130" height="55" rx="6" fill="#291104"/>

    <!-- Overflowing Coins & Treasures (Back layer) -->
    <circle cx="95" cy="120" r="8" fill="url(#gold-dark)"/>
    <circle cx="115" cy="116" r="10" fill="url(#gold-bright)"/>
    <circle cx="140" cy="118" r="9" fill="url(#gold-dark)"/>
    <circle cx="155" cy="122" r="7" fill="url(#gold-bright)"/>

    <!-- Gems spilling -->
    <polygon points="125,110 132,118 125,126 118,118" fill="url(#gem-blue)"/>
    <polygon points="80,122 86,128 80,134 74,128" fill="url(#gem-pink)"/>

    <!-- Main Chest Body -->
    <path d="M 50 140 L 190 140 L 185 190 L 55 190 Z" fill="url(#wood-base)" stroke="#291104" stroke-width="2"/>
    
    <!-- Wood Planks horizontal lines -->
    <line x1="52" y1="157" x2="188" y2="157" stroke="#451a03" stroke-width="2"/>
    <line x1="53" y1="174" x2="187" y2="174" stroke="#451a03" stroke-width="2"/>

    <!-- Metal Reinforcements (Body) -->
    <rect x="65" y="140" width="8" height="50" fill="#475569"/>
    <rect x="167" y="140" width="8" height="50" fill="#475569"/>
    <circle cx="69" cy="150" r="1.5" fill="#94a3b8"/>
    <circle cx="69" cy="180" r="1.5" fill="#94a3b8"/>
    <circle cx="171" cy="150" r="1.5" fill="#94a3b8"/>
    <circle cx="171" cy="180" r="1.5" fill="#94a3b8"/>

    <!-- Chest Lid (Open, tilted back) -->
    <g transform="translate(120, 140) rotate(-35) translate(-120, -140)">
      <path d="M 48 135 C 48 105, 192 105, 192 135 L 190 140 L 50 140 Z" fill="url(#wood-lid)" stroke="#291104" stroke-width="2"/>
      <!-- Lid Metal Ribs -->
      <path d="M 65 135 L 65 140" stroke="#475569" stroke-width="8"/>
      <path d="M 175 135 L 175 140" stroke="#475569" stroke-width="8"/>
      <!-- Rim highlight -->
      <path d="M 52 137 C 70 120, 170 120, 188 137" fill="none" stroke="url(#gold-rim)" stroke-width="2"/>
    </g>

    <!-- Chest Lock Plate -->
    <path d="M 112 135 L 128 135 L 132 155 L 108 155 Z" fill="#64748b"/>
    <circle cx="120" cy="146" r="4" fill="#0f172a"/>
    <path d="M 118 146 L 122 146 L 123 152 L 117 152 Z" fill="#0f172a"/>

    <!-- OVERFLOWING WEALTH (Foreground Layer) -->
    <!-- Large Gold Bars (Ingots / Yuanbao) -->
    <!-- Ingot 1 (Center Front) -->
    <g transform="translate(100, 165)">
      <path d="M 10 0 C 25 -5, 35 -5, 50 0 C 55 8, 45 18, 30 18 C 15 18, 5 8, 10 0 Z" fill="url(#gold-bright)" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="30" cy="8" rx="12" ry="4" fill="#fef08a" opacity="0.6"/>
    </g>

    <!-- Ingot 2 (Right Stacked) -->
    <g transform="translate(135, 172) rotate(15)">
      <path d="M 5 0 C 15 -3, 25 -3, 35 0 C 38 5, 30 12, 20 12 C 10 12, 2 5, 5 0 Z" fill="url(#gold-bright)" stroke="#b45309" stroke-width="1"/>
    </g>

    <!-- Ingot 3 (Left) -->
    <g transform="translate(68, 170) rotate(-10)">
      <path d="M 5 0 C 15 -3, 25 -3, 35 0 C 38 5, 30 12, 20 12 C 10 12, 2 5, 5 0 Z" fill="url(#gold-dark)" stroke="#78350f" stroke-width="1"/>
    </g>

    <!-- Spill of Gold Coins -->
    <g fill="url(#gold-bright)" stroke="#b45309" stroke-width="1">
      <circle cx="85" cy="188" r="7"/>
      <circle cx="105" cy="192" r="8"/>
      <circle cx="128" cy="188" r="7"/>
      <circle cx="148" cy="185" r="6"/>
      <circle cx="162" cy="178" r="7"/>
      <circle cx="175" cy="186" r="5"/>
      <circle cx="95" cy="180" r="6"/>
    </g>
    <!-- Coin inner holes/details -->
    <circle cx="85" cy="188" r="2.5" fill="#78350f"/>
    <circle cx="105" cy="192" r="3" fill="#78350f"/>
    <circle cx="128" cy="188" r="2.5" fill="#78350f"/>
    <circle cx="162" cy="178" r="2.5" fill="#78350f"/>

    <!-- Sparkling Magic / Wealth AURA (Action lines & sparkles) -->
    <g fill="#fde047">
      <!-- Star Sparkle 1 -->
      <path d="M 90 95 Q 90 105 80 105 Q 90 105 90 115 Q 90 105 100 105 Q 90 105 90 95" filter="url(#glow)"/>
      <!-- Star Sparkle 2 -->
      <path d="M 160 85 Q 160 93 152 93 Q 160 93 160 101 Q 160 93 168 93 Q 160 93 160 85" filter="url(#glow)"/>
      <!-- Tiny Sparkles -->
      <circle cx="115" cy="85" r="3" fill="#fff" filter="url(#glow)"/>
      <circle cx="70" cy="115" r="2" fill="#fbbf24"/>
      <circle cx="150" cy="105" r="2.5" fill="#fbbf24"/>
      <circle cx="130" cy="95" r="2" fill="#fff"/>
    </g>
  </g>

  <!-- Foreground prop: Luxurious Velvet Bag / Coin pouch spilling coins -->
  <path d="M 30 210 Q 25 190 40 185 Q 55 180 60 200 Z" fill="#9333ea" stroke="#581c87" stroke-width="2"/>
  <path d="M 35 187 Q 47 183 55 187" fill="none" stroke="#c084fc" stroke-width="3"/>
  <!-- Coins near pouch -->
  <circle cx="25" cy="205" r="5" fill="url(#gold-bright)" stroke="#b45309" stroke-width="1"/>
  <circle cx="50" cy="212" r="6" fill="url(#gold-bright)" stroke="#b45309" stroke-width="1"/>

  <!-- Additional floating ambient sparkles for richness -->
  <circle cx="190" cy="130" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="50" cy="135" r="2" fill="#fef08a" opacity="0.6"/>
  <circle cx="120" cy="75" r="2.5" fill="#fef08a" opacity="0.7" filter="url(#glow)"/>
</svg>