<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Warm Light Glow -->
  <circle cx="120" cy="60" r="80" fill="url(#lampGlow)"/>

  <!-- Bar Counter -->
  <path d="M0 180 Q120 175 240 180 L240 240 L0 240 Z" fill="#451a03"/>
  <rect x="0" y="180" width="240" height="8" fill="#78350f"/>

  <!-- Character: The Drunk Man -->
  <!-- Body/Torso -->
  <path d="M80 240 C80 200 100 170 140 170 C180 170 200 200 200 240" fill="#334155"/>
  
  <!-- Arms slumped on table -->
  <path d="M100 185 C110 175 160 175 175 185" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M95 188 C105 178 155 178 170 188" stroke="#334155" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Head (resting/slumped) -->
  <g transform="translate(135, 155) rotate(15)">
    <path d="M-20 -25 Q0 -45 20 -25 Q25 0 0 15 Q-25 0 -20 -25" fill="#fde047"/>
    <!-- Hair -->
    <path d="M-22 -22 Q-10 -48 22 -22 Q15 -30 0 -30 Q-15 -30 -22 -22" fill="#1e293b"/>
    <!-- Eyes (closed/dizzy) -->
    <path d="M-10 -12 Q-5 -15 0 -12" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M8 -12 Q13 -15 18 -12" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Flush/Blush -->
    <circle cx="-12" cy="-2" r="5" fill="#f87171" opacity="0.4"/>
    <circle cx="15" cy="-2" r="5" fill="#f87171" opacity="0.4"/>
    <!-- Smile (goofy/relaxed) -->
    <path d="M-2 5 Q4 10 10 5" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Props -->
  <!-- Bottle -->
  <g transform="translate(60, 135)">
    <rect x="0" y="10" width="18" height="35" rx="2" fill="#065f46"/>
    <rect x="5" y="0" width="8" height="12" rx="1" fill="#065f46"/>
    <rect x="5" y="15" width="8" height="12" fill="#fef3c7" opacity="0.2"/>
  </g>

  <!-- Glass -->
  <g transform="translate(185, 160)">
    <path d="M0 0 L15 0 L12 18 L3 18 Z" fill="#94a3b8" opacity="0.3"/>
    <path d="M3 10 L12 10 L11 16 L4 16 Z" fill="#f59e0b"/>
  </g>

  <!-- Visual Cues (Dizzy Swirls/Bubbles) -->
  <g stroke="#94a3b8" stroke-width="1" fill="none" opacity="0.6">
    <path d="M155 110 Q160 100 170 105 Q180 110 175 120" />
    <circle cx="140" cy="105" r="2" fill="#94a3b8"/>
    <circle cx="185" cy="125" r="1.5" fill="#94a3b8"/>
  </g>

  <!-- Stool -->
  <rect x="110" y="230" width="60" height="10" rx="2" fill="#1e293b"/>
</svg>