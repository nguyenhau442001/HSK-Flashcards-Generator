<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Water -->
  <path d="M0 180 Q 60 170 120 180 T 240 180 L 240 240 L 0 240 Z" fill="#0ea5e9" opacity="0.3"/>
  
  <!-- Ship Hull -->
  <path d="M40 160 L 200 160 L 190 200 L 50 200 Z" fill="#fb923c"/>
  <path d="M50 200 L 190 200 L 180 215 L 60 215 Z" fill="#ea580c"/>
  
  <!-- Cargo Crates -->
  <rect x="60" y="130" width="30" height="30" fill="#f59e0b" rx="2"/>
  <rect x="95" y="130" width="30" height="30" fill="#fbbf24" rx="2"/>
  <rect x="130" y="130" width="30" height="30" fill="#f59e0b" rx="2"/>
  <rect x="75" y="100" width="30" height="30" fill="#fbbf24" rx="2"/>
  <rect x="110" y="100" width="30" height="30" fill="#f59e0b" rx="2"/>
  
  <!-- Crane Hook -->
  <path d="M160 40 L 160 100" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 100 Q 160 110 170 100" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Character (Dock Worker) -->
  <circle cx="200" cy="120" r="12" fill="#fde68a"/>
  <path d="M190 132 L 210 132 L 205 160 L 195 160 Z" fill="#38bdf8"/>
  <path d="M192 135 L 185 150" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  <path d="M208 135 L 215 150" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Clouds/Atmosphere -->
  <circle cx="30" cy="40" r="10" fill="#334155" opacity="0.5"/>
  <circle cx="50" cy="35" r="15" fill="#334155" opacity="0.5"/>
  <circle cx="70" cy="40" r="10" fill="#334155" opacity="0.5"/>
  
  <!-- Stars/Glow -->
  <circle cx="210" cy="30" r="1" fill="#fbbf24"/>
  <circle cx="220" cy="50" r="1.5" fill="#fbbf24"/>
  <circle cx="190" cy="20" r="1" fill="#fbbf24"/>
</svg>