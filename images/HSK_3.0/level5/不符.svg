<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="140" width="200" height="15" rx="4" fill="#475569"/>
  <rect x="30" y="155" width="10" height="60" rx="2" fill="#334155"/>
  <rect x="200" y="155" width="10" height="60" rx="2" fill="#334155"/>

  <!-- Character (The Speaker) -->
  <circle cx="180" cy="110" r="25" fill="#fbbf24"/>
  <path d="M165 125 Q180 140 195 125" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="172" cy="105" r="3" fill="#0f172a"/>
  <circle cx="188" cy="105" r="3" fill="#0f172a"/>
  <rect x="155" y="135" width="50" height="60" rx="10" fill="#fb923c"/>

  <!-- Character (The Listener/Investigator) -->
  <circle cx="60" cy="110" r="25" fill="#38bdf8"/>
  <path d="M45 120 L75 120" stroke="#0f172a" stroke-width="3" fill="none"/>
  <circle cx="52" cy="105" r="3" fill="#0f172a"/>
  <circle cx="68" cy="105" r="3" fill="#0f172a"/>
  <rect x="35" y="135" width="50" height="60" rx="10" fill="#64748b"/>

  <!-- The Evidence (The Mismatch) -->
  <rect x="100" y="80" width="60" height="50" rx="4" fill="#f1f5f9"/>
  <line x1="110" y1="95" x2="140" y2="95" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="110" x2="150" y2="110" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Cross mark indicating mismatch -->
  <g stroke="#ef4444" stroke-width="6" stroke-linecap="round">
    <line x1="115" y1="50" x2="135" y2="70"/>
    <line x1="135" y1="50" x2="115" y2="70"/>
  </g>

  <!-- Speech bubble indicator -->
  <path d="M150 90 L170 70 L190 90" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>
</svg>