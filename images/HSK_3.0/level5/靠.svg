<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm hallway/tunnel lighting -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing accent for right side path -->
    <linearGradient id="pathGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENTAL CONTEXT: Modern Urban Pedestrian Corridor / Station Tunnel -->
  <!-- Left Wall & Ceiling Perspective -->
  <path d="M0,0 L90,60 L90,190 L0,220 Z" fill="#334155" opacity="0.6"/>
  <path d="M90,60 L240,60 L240,190 L90,190 Z" fill="#1e293b"/>
  <!-- Floor Perspective Grid & Details -->
  <path d="M0,220 L90,190 L240,190 L240,240 L0,240 Z" fill="#0f172a"/>

  <!-- Wall Panels & Architectural Details on Left -->
  <line x1="20" y1="10" x2="20" y2="205" stroke="#475569" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="30" x2="50" y2="210" stroke="#475569" stroke-width="2" opacity="0.4"/>
  
  <!-- Right Wall (The "Right Side" to hug) -->
  <path d="M210,60 L240,40 L240,210 L210,190 Z" fill="#475569" opacity="0.4"/>
  <!-- Glowing subtle directional strip on the right floor/wall boundary -->
  <path d="M190,190 L240,190 L240,210 L190,205 Z" fill="url(#pathGlow)"/>
  <line x1="190" y1="190" x2="240" y2="190" stroke="#fbbf24" stroke-width="2" opacity="0.8" stroke-dasharray="6,4"/>

  <!-- Overhead Modern Lighting Fixtures -->
  <rect x="100" y="55" width="40" height="6" rx="3" fill="#cbd5e1" filter="url(#shadow)"/>
  <polygon points="110,61 130,61 150,135 90,135" fill="url(#lightBeam)"/>

  <!-- Ambient background elements: directional arrow marker on floor (geometric, non-text) -->
  <g transform="translate(210, 198) scale(0.6)">
    <polygon points="10,0 20,15 15,15 15,25 5,25 5,15 0,15" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- CHARACTER 1: Walking actively on the RIGHT side ("靠右边") -->
  <g id="character-right" filter="url(#shadow)">
    <!-- Shadow under feet -->
    <ellipse cx="180" cy="192" rx="14" ry="5" fill="#000" opacity="0.5"/>

    <!-- Body / Torso (Teal Jacket, modern vector style) -->
    <path d="M172,130 C172,120 188,120 188,130 L192,165 C192,170 188,175 180,175 C172,175 168,170 168,165 Z" fill="#0d9488"/>
    
    <!-- Backpack -->
    <rect x="164" y="128" width="10" height="24" rx="4" fill="#0f766e"/>

    <!-- Head & Hair -->
    <circle cx="180" cy="106" rx="13" ry="14" fill="#fbcfe8"/>
    <path d="M168,102 C168,93 192,93 192,102 C192,106 189,112 180,112 C171,112 168,106 168,102 Z" fill="#1e293b"/>

    <!-- Limbs - Walking Motion -->
    <!-- Back Leg -->
    <path d="M174,170 L164,190 L172,192" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front Leg -->
    <path d="M184,170 L194,188 L188,191" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Back Arm -->
    <path d="M172,135 L160,150" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Front Arm -->
    <path d="M188,135 L200,150" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- CHARACTER 2: A friendly companion walking slightly behind/beside, keeping right -->
  <g id="character-second" filter="url(#shadow)" opacity="0.95">
    <!-- Shadow -->
    <ellipse cx="140" cy="188" rx="12" ry="4" fill="#000" opacity="0.4"/>

    <!-- Torso (Warm Orange Hoodie) -->
    <path d="M132,135 C132,126 148,126 148,135 L151,168 C151,173 147,177 140,177 C133,177 129,173 129,168 Z" fill="#f97316"/>
    
    <!-- Hood -->
    <path d="M132,130 C132,122 148,122 148,130 Z" fill="#c2410c"/>

    <!-- Head & Face -->
    <circle cx="140" cy="112" rx="11" ry="12" fill="#fed7aa"/>
    <path d="M129,108 C129,100 151,100 151,108 C151,112 148,116 140,116 C132,116 129,112 129,108 Z" fill="#78350f"/>

    <!-- Limbs -->
    <path d="M136,172 L130,186 L138,187" stroke="#1e293b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M144,172 L150,184 L146,186" stroke="#1e293b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M134,140 L122,152" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M146,140 L156,152" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Foreground prop: Handrail along the right wall to reinforce context -->
  <path d="M225,50 L225,200" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" filter="url(#shadow)"/>
  <ellipse cx="225" cy="50" rx="3" ry="2" fill="#cbd5e1"/>
  <ellipse cx="225" cy="200" rx="3" ry="2" fill="#cbd5e1"/>

  <!-- Additional ambient lighting highlights -->
  <circle cx="120" cy="70" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="160" cy="80" r="1" fill="#38bdf8" opacity="0.4"/>
  <circle cx="80" cy="90" r="2" fill="#38bdf8" opacity="0.3"/>
</svg>