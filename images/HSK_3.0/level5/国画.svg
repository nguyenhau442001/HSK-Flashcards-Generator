<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="30" y="150" width="180" height="15" rx="2" fill="#475569"/>
  <rect x="40" y="165" width="10" height="60" fill="#334155"/>
  <rect x="190" y="165" width="10" height="60" fill="#334155"/>
  
  <!-- Paper on table -->
  <rect x="60" y="80" width="120" height="80" rx="2" fill="#f8fafc"/>
  
  <!-- Painting details (Abstract ink strokes) -->
  <path d="M80 100 Q 100 90 120 110 T 160 100" stroke="#0f172a" stroke-width="3" fill="none"/>
  <path d="M90 130 Q 110 120 130 140" stroke="#0f172a" stroke-width="2" fill="none"/>
  <circle cx="150" cy="120" r="4" fill="#ec4899"/>
  
  <!-- Grandfather character -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-40 120 C-40 80, 40 80, 40 120" fill="#334155"/>
    <!-- Head -->
    <circle cx="0" cy="60" r="25" fill="#fde68a"/>
    <!-- Hair/Beard -->
    <path d="M-20 60 Q 0 40 20 60" stroke="#e2e8f0" stroke-width="4" fill="none"/>
    <path d="M-10 80 Q 0 95 10 80" stroke="#e2e8f0" stroke-width="3" fill="none"/>
    <!-- Glasses -->
    <circle cx="-8" cy="60" r="5" stroke="#1e293b" stroke-width="2" fill="none"/>
    <circle cx="8" cy="60" r="5" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Arm holding brush -->
    <path d="M-30 90 L-50 110" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M-50 110 L-60 100" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <path d="M-60 100 L-65 70" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Ink pot -->
  <circle cx="180" cy="140" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M172 135 L188 135" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Ambient light -->
  <circle cx="200" cy="40" r="60" fill="#fbbf24" opacity="0.05"/>
</svg>