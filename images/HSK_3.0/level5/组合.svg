<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Stage Floor -->
  <path d="M0 200 Q120 180 240 200 V240 H0 Z" fill="#334155"/>
  
  <!-- Spotlight Beams -->
  <path d="M120 0 L40 210 L200 210 Z" fill="url(#spotlight)"/>
  
  <!-- Character 1: The Guitarist (Right) -->
  <g transform="translate(135, 110)">
    <!-- Stool -->
    <rect x="15" y="65" width="30" height="4" rx="2" fill="#475569"/>
    <path d="M20 69 L15 90 M40 69 L45 90" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Body -->
    <path d="M20 30 Q30 25 40 30 L45 70 H15 Z" fill="#38bdf8"/>
    <circle cx="30" cy="15" r="12" fill="#fde047"/> <!-- Head -->
    
    <!-- Guitar -->
    <path d="M5 45 Q-5 40 -5 55 Q-5 70 10 70 Q25 70 25 55 Q25 40 15 45 Z" fill="#fb923c"/>
    <rect x="20" y="48" width="35" height="4" rx="1" fill="#451a03" transform="rotate(-20, 20, 48)"/>
    
    <!-- Arms -->
    <path d="M18 35 Q5 40 10 55" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
    <path d="M42 35 Q55 45 45 55" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Character 2: The Singer (Left) -->
  <g transform="translate(55, 105)">
    <!-- Body -->
    <path d="M15 35 Q25 30 35 35 L40 95 H10 Z" fill="#ec4899"/>
    <circle cx="25" cy="18" r="12" fill="#fbbf24"/> <!-- Head -->
    
    <!-- Microphone Stand -->
    <line x1="45" y1="40" x2="45" y2="100" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="45" cy="40" r="4" fill="#64748b"/>
    
    <!-- Arms -->
    <path d="M15 40 Q5 50 10 65" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M35 40 Q45 40 45 45" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Visual Elements of Harmony/Combination -->
  <g opacity="0.6">
    <path d="M110 60 Q120 50 130 60" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" from="0,50" to="50,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="120" cy="50" r="2" fill="#10b981"/>
    <path d="M100 80 Q110 75 120 80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M130 40 Q140 35 150 40" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Decorative Sparkles -->
  <circle cx="40" cy="40" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="200" cy="60" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="180" cy="30" r="1" fill="#ec4899" opacity="0.7"/>
  <circle cx="60" cy="20" r="1.5" fill="#10b981" opacity="0.5"/>
</svg>