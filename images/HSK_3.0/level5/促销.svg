<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Supermarket Shelves -->
  <rect x="20" y="60" width="80" height="120" rx="4" fill="#334155"/>
  <rect x="140" y="60" width="80" height="120" rx="4" fill="#334155"/>
  <rect x="25" y="80" width="70" height="8" fill="#475569"/>
  <rect x="25" y="110" width="70" height="8" fill="#475569"/>
  <rect x="145" y="80" width="70" height="8" fill="#475569"/>
  <rect x="145" y="110" width="70" height="8" fill="#475569"/>
  
  <!-- Promotional Signage (Visual cues only) -->
  <path d="M105 50 L135 50 L125 70 L115 70 Z" fill="#fb923c"/>
  <circle cx="120" cy="50" r="15" fill="#f59e0b"/>
  
  <!-- Character: Shopper -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M15 40 L25 40 L22 80 L18 80 Z" fill="#38bdf8"/>
