  </g>
  
  <!-- Character: Staff pointing to product -->
  <g transform="translate(150, 140)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M15 40 L25 40 L22 80 L18 80 Z" fill="#ec4899"/>
    <rect x="10" y="40" width="20" height="5" fill="#ec4899"/>
    <path d="M20 80 L10 100 M20 80 L30 100" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M25 50 L45 40" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Products -->
  <circle cx="40" cy="70" r="6" fill="#10b981"/>
  <circle cx="60" cy="70" r="6" fill="#fbbf24"/>
  <rect x="160" y="70" width="12" height="12" fill="#fb923c"/>
  <rect x="180" y="70" width="12" height="12" fill="#38bdf8"/>
  
