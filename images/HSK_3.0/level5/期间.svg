<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Character Outfit & Skin Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Cozy Room Interior -->
  <!-- Wallpaper / Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4" />
  
  <!-- Window showing passing time (night sky with stars & crescent moon) -->
  <g id="window" transform="translate(145, 30)">
    <rect x="0" y="0" width="60" height="75" rx="4" fill="url(#nightSky)" stroke="#475569" stroke-width="2"/>
    <!-- Window pane grid -->
    <line x1="30" y1="0" x2="30" y2="75" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="37" x2="60" y2="37" stroke="#475569" stroke-width="1.5"/>
    <!-- Stars & Moon -->
    <circle cx="12" cy="15" r="1" fill="#cbd5e1" />
    <circle cx="45" cy="25" r="1.5" fill="#f8fafc" />
    <circle cx="20" cy="55" r="1" fill="#94a3b8" />
    <path d="M 48 10 Q 52 14 48 18 Q 54 16 52 10 Q 48 8 48 10 Z" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Bookshelf Background Props -->
  <g id="bookshelf" transform="translate(25, 35)">
    <rect x="0" y="0" width="45" height="60" fill="none" />
    <!-- Books stacked & upright -->
    <rect x="5" y="15" width="8" height="25" rx="1" fill="#f43f5e" />
    <rect x="14" y="12" width="7" height="28" rx="1" fill="#10b981" />
    <rect x="22" y="17" width="10" height="23" rx="1" fill="#8b5cf6" />
    <rect x="5" y="42" width="30" height="4" rx="1" fill="#475569" />
  </g>

  <!-- Desk Lamp & Warm Glow -->
  <circle cx="185" cy="115" r="50" fill="url(#lampGlow)" />
  <g id="lamp" transform="translate(170, 85)">
    <path d="M 15 40 L 25 40 L 20 15 Z" fill="#fbbf24" />
    <path d="M 10 40 L 30 40 L 20 42 Z" fill="#d97706" />
    <line x1="20" y1="42" x2="20" y2="60" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 60 Q 20 56 30 60" fill="#64748b" />
  </g>

  <!-- Wall Clock indicating "Duration/Period" (Time passing) -->
  <g id="clock" transform="translate(95, 35)">
    <circle cx="15" cy="15" r="12" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="1" fill="#f8fafc"/>
    <line x1="15" y1="15" x2="15" y2="9" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="15" x2="20" y2="15" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Clock ticks -->
    <line x1="15" y1="5" x2="15" y2="6" stroke="#94a3b8" stroke-width="1"/>
    <line x1="15" y1="24" x2="15" y2="25" stroke="#94a3b8" stroke-width="1"/>
    <line x1="5" y1="15" x2="6" y2="15" stroke="#94a3b8" stroke-width="1"/>
    <line x1="24" y1="15" x2="25" y2="15" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- MAIN DESK & STUDY PROPS -->
  <rect x="25" y="145" width="190" height="12" rx="3" fill="url(#deskGrad)" />
  <rect x="40" y="157" width="12" height="50" rx="2" fill="#1e293b" />
  <rect x="188" y="157" width="12" height="50" rx="2" fill="#1e293b" />

  <!-- Open Textbook & Notebook on Desk -->
  <g id="open-book" transform="translate(85, 125)">
    <path d="M 0 20 Q 25 10 50 20 L 50 38 Q 25 28 0 38 Z" fill="#f8fafc" />
    <path d="M 50 20 Q 75 10 100 20 L 100 38 Q 75 28 50 38 Z" fill="#f1f5f9" />
    <!-- Book lines (mimicking active studying) -->
    <line x1="10" y1="24" x2="40" y2="20" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="10" y1="28" x2="35" y2="24" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="60" y1="20" x2="90" y2="24" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="60" y1="24" x2="85" y2="28" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Center binding shadow -->
    <line x1="50" y1="20" x2="50" y2="38" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Laptop with glowing screen -->
  <g id="laptop" transform="translate(45, 130)">
    <path d="M 0 15 L 8 0 L 32 0 L 40 15 Z" fill="#64748b" />
    <path d="M 3 13 L 9 2 L 31 2 L 37 13 Z" fill="#38bdf8" />
    <!-- Laptop Base -->
    <path d="M -5 15 L 45 15 L 42 18 L -2 18 Z" fill="#94a3b8" />
  </g>

  <!-- Coffee Mug for staying awake during the long period of study -->
  <g id="mug" transform="translate(155, 130)">
    <rect x="0" y="5" width="12" height="15" rx="2" fill="#ec4899" />
    <path d="M 12 8 C 16 8 16 17 12 17" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 4 2 Q 6 0 4 -3" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- THE SUBJECT: Character Actively Studying -->
  <g id="studying-character" transform="translate(90, 85)">
    <!-- Body / Torso leaning forward -->
    <path d="M 25 45 Q 40 40 50 75 L 15 75 Q 15 55 25 45 Z" fill="url(#shirtGrad)" />
    
    <!-- Head & Hair (Dedicated learner, expressive concentration) -->
    <circle cx="35" cy="22" r="14" fill="#fbcfe8" /> <!-- Skin tone -->
    <!-- Hair style -->
    <path d="M 21 20 Q 32 5 49 18 Q 45 27 45 27 Q 38 12 26 23 Z" fill="#334155" />
    <circle cx="38" cy="23" r="1.5" fill="#1e293b" /> <!-- Focused eye/brow line -->
    <line x1="36" y1="21" x2="41" y2="21" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms bent intently writing/working -->
    <!-- Left Arm -->
    <path d="M 22 48 Q 12 55 25 65" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <!-- Right Arm holding pen -->
    <path d="M 45 52 Q 55 58 48 65" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <!-- Hand & Pen -->
    <circle cx="47" cy="66" r="3" fill="#fbcfe8" />
    <line x1="47" y1="66" x2="52" y2="72" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground Atmospheric Particles (Subtle floating dust/focus nodes representing continuous time flow) -->
  <circle cx="70" cy="80" r="1.5" fill="#fef08a" opacity="0.5"/>
  <circle cx="130" cy="70" r="1" fill="#fef08a" opacity="0.4"/>
  <circle cx="110" cy="100" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="160" cy="95" r="1" fill="#38bdf8" opacity="0.6"/>
</svg>