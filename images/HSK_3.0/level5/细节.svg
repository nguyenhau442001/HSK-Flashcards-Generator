<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lampCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(251, 191, 36, 0.4)" />
      <stop offset="100%" stop-color="rgba(251, 191, 36, 0.0)" />
    </linearGradient>
    <radialGradient id="magnifierGlass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="80%" stop-color="rgba(56, 189, 248, 0.3)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.6)" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Architecture -->
  <!-- Bookshelf / Architecture Lines -->
  <path d="M 20 120 L 80 100 L 80 140 L 20 150 Z" fill="#1b263b" opacity="0.5" />
  <rect x="180" y="40" width="40" height="120" rx="4" fill="#1b263b" opacity="0.4" />
  <rect x="190" y="60" width="20" height="8" rx="2" fill="#334155" />
  <rect x="190" y="90" width="20" height="8" rx="2" fill="#334155" />
  <rect x="190" y="120" width="20" height="8" rx="2" fill="#334155" />

  <!-- Warm Desk Lamp Light Beam -->
  <polygon points="170,10 210,10 240,160 130,160" fill="url(#lampCone)" />

  <!-- Desk Surface -->
  <path d="M 0 160 L 240 160 L 240 230 C 240 235 235 240 230 240 L 10 240 C 5 240 0 235 0 230 Z" fill="url(#deskGrad)" />
  <!-- Desk Edge Highlight -->
  <rect x="0" y="160" width="240" height="4" fill="#475569" />

  <!-- Props on Desk: Architectural Model / Blueprint -->
  <!-- Blueprint Paper -->
  <g transform="translate(30, 175) rotate(-5)">
    <rect width="90" height="60" rx="2" fill="#0284c7" opacity="0.85" />
    <!-- Blueprint Lines -->
    <path d="M 10 15 L 80 15 M 10 30 L 50 30 M 15 45 L 75 45" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="3,3" fill="none" opacity="0.8" />
    <circle cx="65" cy="30" r="8" stroke="#f43f5e" stroke-width="2" fill="none" />
    <path d="M 65 22 L 65 38 M 57 30 L 73 30" stroke="#f43f5e" stroke-width="1.5" />
  </g>

  <!-- Coffee Mug -->
  <rect x="195" y="170" width="22" height="26" rx="4" fill="#cbd5e1" />
  <path d="M 217 176 C 224 176 224 190 217 190" stroke="#cbd5e1" stroke-width="3" fill="none" />
  <!-- Steam -->
  <path d="M 203 162 Q 206 156 203 150" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Character: Designer/Inspector -->
  <!-- Torso & Shoulders -->
  <path d="M 85 220 C 85 190 110 180 130 180 C 150 180 175 190 175 220 Z" fill="#3b82f6" />
  <!-- Collar / Shirt Detail -->
  <polygon points="120,180 140,180 130,195" fill="#f8fafc" />
  <path d="M 125 180 L 130 215 L 135 180" stroke="#1d4ed8" stroke-width="2" fill="none" />

  <!-- Neck -->
  <rect x="122" y="155" width="16" height="30" rx="8" fill="#fdba74" />

  <!-- Head -->
  <circle cx="130" cy="135" r="24" fill="#fdba74" />
  <!-- Hair -->
  <path d="M 106 135 C 106 115 115 105 130 105 C 145 105 154 115 154 135 C 154 140 150 135 150 125 C 150 115 142 110 130 110 C 118 110 110 115 110 125 C 110 135 106 140 106 135 Z" fill="#334155" />

  <!-- Concentrated Facial Expression -->
  <!-- Eyebrows (slanted for concentration) -->
  <line x1="116" y1="126" x2="126" y2="129" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <line x1="134" y1="129" x2="144" y2="126" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes -->
  <circle cx="121" cy="133" r="2" fill="#1e293b" />
  <circle cx="139" cy="133" r="2" fill="#1e293b" />
  <!-- Focused Mouth -->
  <path d="M 127 146 Q 130 144 133 146" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Cute Blush -->
  <circle cx="116" cy="139" r="3" fill="#f43f5e" opacity="0.3" />
  <circle cx="144" cy="139" r="3" fill="#f43f5e" opacity="0.3" />

  <!-- Arms & Hands -->
  <!-- Right Arm (Holding magnifying glass over blueprint) -->
  <path d="M 155 200 C 140 180 125 170 105 175" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" fill="none" />
  <!-- Hand -->
  <circle cx="102" cy="177" r="7" fill="#fdba74" />

  <!-- Left Arm (Resting on desk) -->
  <path d="M 105 210 C 115 195 125 190 135 195" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- Magnifier Instrument (Highlighting the "Details") -->
  <!-- Magnifier Glass Circle -->
  <circle cx="85" cy="155" r="22" fill="url(#magnifierGlass)" stroke="#f59e0b" stroke-width="4" filter="url(#glow)" />
  <!-- Lens reflection glare -->
  <path d="M 72 143 C 76 139 84 139 88 143" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <!-- Magnifier Handle -->
  <path d="M 70 170 L 52 188" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <path d="M 70 170 L 52 188" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Detailed magnified elements seen through glass (Extra tiny crisp components) -->
  <g transform="translate(75, 145) scale(0.6)">
    <rect x="-5" y="-5" width="10" height="10" fill="#f43f5e" rx="1" />
    <circle cx="0" cy="0" r="3" fill="#fbbf24" />
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Ambient Light Highlights / Particles -->
  <circle cx="180" cy="80" r="2" fill="#fbbf24" opacity="0.8" filter="url(#glow)" />
  <circle cx="150" cy="50" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="210" cy="110" r="2.5" fill="#fbbf24" opacity="0.5" filter="url(#glow)" />
  <circle cx="130" cy="70" r="1" fill="#fbbf24" opacity="0.7" />
</svg>