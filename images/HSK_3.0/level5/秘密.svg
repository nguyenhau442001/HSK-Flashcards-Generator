<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wood Floor/Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Light Cone from Opened Box -->
    <radialGradient id="magic-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Envelope Paper Gradient -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Treasure Box Wood Gradient -->
    <linearGradient id="box-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="box-lid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Magnifying Glass Lens -->
    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed background with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background elements / Room context -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#desk-grad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" opacity="0.6" />

  <!-- Background props: Bookshelf / Ambient lighting -->
  <rect x="30" y="80" width="40" height="90" rx="4" fill="#334155" opacity="0.3" />
  <rect x="40" y="70" width="35" height="15" rx="2" fill="#475569" opacity="0.3" />
  <circle cx="120" cy="50" r="80" fill="url(#magic-glow)" />

  <!-- Mysterious floating sparkles and question marks / icons -->
  <g opacity="0.8">
    <!-- Star sparkle 1 -->
    <path d="M70 65 L73 73 L81 76 L73 79 L70 87 L67 79 L59 76 L67 73 Z" fill="#fbbf24" filter="url(#shadow)" />
    <!-- Star sparkle 2 -->
    <path d="M180 85 L182 90 L187 92 L182 94 L180 99 L178 94 L173 92 L178 90 Z" fill="#38bdf8" />
    <!-- Glowing orb 1 -->
    <circle cx="95" cy="55" r="4" fill="#ec4899" />
    <!-- Glowing orb 2 -->
    <circle cx="150" cy="70" r="3" fill="#fbbf24" />
  </g>

  <!-- MAIN SUBJECT: The Secret Box & Confidental Documents -->
  <g filter="url(#shadow)">
    <!-- Box Back Rim / Interior Shadow -->
    <ellipse cx="120" cy="135" rx="55" ry="15" fill="#78350f" />

    <!-- Opened Box Lid (Angled Upward Backwards) -->
    <path d="M 65 130 C 65 90, 175 90, 175 130 C 150 115, 90 115, 65 130 Z" fill="url(#box-lid)" stroke="#451a03" stroke-width="2" />
    <!-- Lid Golden Trim -->
    <path d="M 70 128 C 90 115, 150 115, 170 128" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

    <!-- Glowing Secrets Emerging from Box -->
    <g>
      <!-- Confidential Paper / Secret Document 1 (Center) -->
      <g transform="translate(100, 85) rotate(-10)">
        <rect width="45" height="55" rx="3" fill="url(#paper-grad)" stroke="#94a3b8" stroke-width="1.5" />
        <!-- Red "Confidential" / Secret Stamp shape -->
        <rect x="8" y="10" width="29" height="10" rx="2" fill="#ef4444" opacity="0.8" />
        <!-- Fake abstract text lines representing secret data -->
        <line x1="8" y1="26" x2="35" y2="26" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
        <line x1="8" y1="33" x2="30" y2="33" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
        <line x1="8" y1="40" x2="37" y2="40" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Secret Document 2 (Tilted Right) -->
      <g transform="translate(130, 95) rotate(15)">
        <rect width="40" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
        <circle cx="20" cy="20" r="8" fill="#38bdf8" opacity="0.6" />
        <line x1="10" y1="35" x2="30" y2="35" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
        <line x1="10" y1="41" x2="25" y2="41" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Secret Envelope with Wax Seal -->
      <g transform="translate(75, 105) rotate(-5)">
        <rect width="50" height="35" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
        <!-- Envelope Flap -->
        <path d="M 0 0 L 25 20 L 50 0" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <!-- Red Wax Seal -->
        <circle cx="25" cy="18" r="6" fill="#dc2626" />
        <circle cx="25" cy="18" r="4" fill="#b91c1c" />
      </g>
    </g>

    <!-- Box Base Front -->
    <path d="M 65 135 C 65 155, 65 165, 65 175 C 65 190, 175 190, 175 175 C 175 165, 175 155, 175 135 C 150 150, 90 150, 65 135 Z" fill="url(#box-base)" stroke="#451a03" stroke-width="2" />
    
    <!-- Box Metallic Clasp / Lock -->
    <rect x="112" y="142" width="16" height="20" rx="3" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />
    <circle cx="120" cy="150" r="3" fill="#78350f" />
    <rect x="115" y="158" width="10" height="3" fill="#d97706" />

    <!-- Golden Corner Brackets on Box -->
    <path d="M 66 138 L 75 138 L 75 145" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 174 138 L 165 138 L 165 145" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND PROPS: Magnifying Glass investigating the secret -->
  <g filter="url(#shadow)" transform="translate(30, 110) rotate(-25)">
    <!-- Glass Handle -->
    <rect x="70" y="50" width="45" height="14" rx="7" fill="#b45309" stroke="#78350f" stroke-width="2" />
    <!-- Handle Grip Lines -->
    <line x1="80" y1="50" x2="80" y2="64" stroke="#92400e" stroke-width="2" />
    <line x1="90" y1="50" x2="90" y2="64" stroke="#92400e" stroke-width="2" />
    <line x1="100" y1="50" x2="100" y2="64" stroke="#92400e" stroke-width="2" />

    <!-- Metal Ferrule connecting handle to rim -->
    <rect x="62" y="47" width="10" height="20" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />

    <!-- Magnifying Glass Rim & Lens -->
    <circle cx="35" cy="57" r="32" fill="url(#lens-grad)" stroke="#f8fafc" stroke-width="5" />
    <circle cx="35" cy="57" r="32" fill="none" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Lens Reflection Highlight -->
    <path d="M 18 42 C 22 35, 30 33, 38 35" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Additional mysterious key prop resting on the desk -->
  <g filter="url(#shadow)" transform="translate(160, 175) rotate(35)">
    <!-- Old-fashioned Skeleton Key -->
    <circle cx="15" cy="15" r="7" fill="none" stroke="#fbbf24" stroke-width="3" />
    <circle cx="15" cy="15" r="3" fill="#b45309" />
    <line x1="21" y1="15" x2="45" y2="15" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <!-- Key Teeth -->
    <line x1="38" y1="15" x2="38" y2="21" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <line x1="43" y1="15" x2="43" y2="19" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Dynamic floating light particles -->
  <circle cx="65" cy="100" r="2" fill="#fbbf24" opacity="0.9" />
  <circle cx="175" cy="115" r="2.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="120" cy="75" r="1.5" fill="#ec4899" opacity="0.8" />
  <circle cx="105" cy="65" r="2" fill="#10b981" opacity="0.7" />
</svg>