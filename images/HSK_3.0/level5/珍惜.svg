<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Hourglass (The Symbol of Time) -->
  <g transform="translate(120, 120)">
    <!-- Glass Frame -->
    <path d="M-25 -60 L25 -60 L25 -50 L10 -50 L10 50 L25 50 L25 60 L-25 60 L-25 50 L-10 50 L-10 -50 L-25 -50 Z" fill="#94a3b8" opacity="0.3"/>
    
    <!-- Top Sand (Amber) -->
    <path d="M-18 -45 L18 -45 L8 -5 L-8 -5 Z" fill="#f59e0b"/>
    
    <!-- Bottom Sand -->
    <path d="M-8 5 L8 5 L18 45 L-18 45 Z" fill="#fbbf24"/>
    
    <!-- Falling Sand Particle -->
    <circle cx="0" cy="0" r="2" fill="#fb923c"/>
  </g>
  
  <!-- Hands holding the hourglass -->
  <path d="M60 160 C50 120 70 110 90 120 L100 130 Z" fill="#fcd34d"/>
  <path d="M180 160 C190 120 170 110 150 120 L140 130 Z" fill="#fcd34d"/>
  
  <!-- Decorative elements (Falling petals/stars to signify preciousness) -->
  <circle cx="50" cy="50" r="4" fill="#ec4899"/>
  <circle cx="190" cy="70" r="3" fill="#38bdf8"/>
  <circle cx="40" cy="190" r="5" fill="#10b981"/>
  
  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
</svg>