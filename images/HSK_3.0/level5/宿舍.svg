<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bedWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Environment / Dorm Interior -->
  <!-- Back wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4"/>
  
  <!-- Window showing night sky outside -->
  <rect x="145" y="35" width="55" height="75" rx="4" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <!-- Window panes -->
  <line x1="172" y1="35" x2="172" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="145" y1="72" x2="200" y2="72" stroke="#334155" stroke-width="2"/>
  <!-- Moon outside -->
  <circle cx="185" cy="52" r="8" fill="#fde047" opacity="0.9"/>

  <!-- Warm ambient light from study lamp / room -->
  <path d="M0,0 L240,0 L240,240 L0,240 Z" fill="url(#warmLight)"/>

  <!-- Bunk Bed Structure (Left Side) -->
  <!-- Upper bunk frame -->
  <rect x="25" y="45" width="85" height="10" rx="2" fill="url(#bedWood)"/>
  <!-- Lower bunk frame -->
  <rect x="25" y="130" width="85" height="12" rx="2" fill="url(#bedWood)"/>
  <!-- Bed posts vertical -->
  <rect x="25" y="40" width="6" height="120" rx="2" fill="#92400e"/>
  <rect x="104" y="40" width="6" height="120" rx="2" fill="#92400e"/>
  <!-- Ladder -->
  <rect x="115" y="55" width="4" height="105" fill="#cbd5e1" rx="1"/>
  <rect x="125" y="55" width="4" height="105" fill="#cbd5e1" rx="1"/>
  <rect x="115" y="70" width="14" height="3" fill="#cbd5e1"/>
  <rect x="115" y="95" width="14" height="3" fill="#cbd5e1"/>
  <rect x="115" y="120" width="14" height="3" fill="#cbd5e1"/>
  <rect x="115" y="145" width="14" height="3" fill="#cbd5e1"/>

  <!-- Lower Bunk Bedding & Student 1 (Studying in bed / relaxed) -->
  <rect x="31" y="135" width="73" height="20" rx="4" fill="#38bdf8"/> <!-- Mattress -->
  <path d="M31,145 Q65,130 80,145 Z" fill="#f8fafc"/> <!-- Pillow & Blanket -->
  <!-- Student 1 upper body sitting in lower bunk -->
  <circle cx="55" cy="115" r="10" fill="#fed7aa"/> <!-- Head -->
  <path d="M45,135 Q55,105 65,135 Z" fill="#ec4899"/> <!-- Hoodie/Body -->
  <!-- Laptop on lap -->
  <rect x="45" y="125" width="22" height="12" rx="1" fill="#94a3b8"/>
  <path d="M43,137 L69,137 L71,140 L41,140 Z" fill="#cbd5e1"/>
  <rect x="50" y="128" width="12" height="7" rx="1" fill="#38bdf8"/> <!-- glowing screen -->

  <!-- Upper Bunk Bedding & Student 2 (Resting / Reading) -->
  <rect x="31" y="55" width="73" height="12" rx="3" fill="#f43f5e"/>
  <circle cx="45" cy="50" r="8" fill="#ffedd5"/> <!-- Head -->
  <path d="M38,62 Q45,45 52,62 Z" fill="#10b981"/> <!-- Body -->

  <!-- Study Desk & Chair (Right Foreground) -->
  <!-- Desk surface -->
  <rect x="135" y="125" width="80" height="8" rx="2" fill="#64748b"/>
  <!-- Desk legs -->
  <rect x="145" y="133" width="4" height="50" fill="#475569"/>
  <rect x="205" y="133" width="4" height="50" fill="#475569"/>

  <!-- Desk Props: Lamp, Books, Plant -->
  <!-- Lamp -->
  <path d="M190,125 L195,105 L205,105 L210,125 Z" fill="#fbbf24"/>
  <line x1="200" y1="125" x2="200" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <!-- Stack of books -->
  <rect x="145" y="112" width="20" height="4" rx="1" fill="#3b82f6"/>
  <rect x="143" y="116" width="24" height="4" rx="1" fill="#ef4444"/>
  <rect x="144" y="120" width="22" height="5" rx="1" fill="#10b981"/>
  <!-- Small potted plant -->
  <path d="M175,125 L178,115 L184,115 L187,125 Z" fill="#cbd5e1"/>
  <circle cx="181" cy="112" r="5" fill="#22c55e"/>

  <!-- Student 3 (Sitting at desk, writing/typing) -->
  <circle cx="165" cy="95" r="11" fill="#fbcfe8"/> <!-- Head -->
  <path d="M155,130 Q165,100 178,130 Z" fill="#8b5cf6"/> <!-- Torso -->
  <!-- Hair -->
  <path d="M154,92 Q165,80 176,92 Q174,102 165,96 Z" fill="#334155"/>
  <!-- Arm working -->
  <path d="M165,110 L175,120" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>

  <!-- Chair -->
  <rect x="157" y="130" width="18" height="20" rx="3" fill="#334155"/>
  <rect x="157" y="150" width="3" height="25" fill="#475569"/>
  <rect x="172" y="150" width="3" height="25" fill="#475569"/>

  <!-- Floor -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <!-- Floorboard lines -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#1e293b" stroke-width="3"/>
  <line x1="0" y1="195" x2="240" y2="195" stroke="#1e293b" stroke-width="2"/>
  <line x1="0" y1="220" x2="240" y2="220" stroke="#1e293b" stroke-width="2"/>

  <!-- Foreground Dorm Details (Cozy elements) -->
  <!-- Slippers on floor -->
  <ellipse cx="130" cy="180" rx="6" ry="3" fill="#f43f5e"/>
  <ellipse cx="138" cy="183" rx="6" ry="3" fill="#f43f5e"/>

  <!-- Backpack on floor near desk -->
  <path d="M210,155 C210,145 225,145 225,155 L227,175 C227,178 208,178 208,175 Z" fill="#ea580c"/>
  <path d="M213,155 L222,155 L222,165 L213,165 Z" fill="#c2410c"/>
  <path d="M214,155 C214,150 221,150 221,155" fill="none" stroke="#fed7aa" stroke-width="2"/>

  <!-- Warm interior lighting accent ray -->
  <polygon points="195,105 240,170 200,170" fill="#fbbf24" opacity="0.05"/>
</svg>