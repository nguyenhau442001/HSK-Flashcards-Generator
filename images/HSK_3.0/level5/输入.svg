  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#0f172a" opacity="0.5"/>
  
  <!-- Laptop Body -->
  <path d="M40 180h160v10a10 10 0 0 1-10 10H50a10 10 0 0 1-10-10z" fill="#334155"/>
  <path d="M50 60h140v120H50z" fill="#475569"/>
  <path d="M60 70h120v90H60z" fill="#0f172a"/>
  
  <!-- Screen Content: Input Field Representation -->
