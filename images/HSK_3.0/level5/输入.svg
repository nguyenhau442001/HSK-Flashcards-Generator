  <rect x="85" y="105" width="4" height="5" fill="#fbbf24"/>
  
  <!-- Keyboard Keys -->
  <g fill="#94a3b8">
    <rect x="65" y="165" width="10" height="10" rx="1"/>
    <rect x="80" y="165" width="10" height="10" rx="1"/>
    <rect x="95" y="165" width="10" height="10" rx="1"/>
    <rect x="110" y="165" width="10" height="10" rx="1"/>
    <rect x="125" y="165" width="10" height="10" rx="1"/>
    <rect x="140" y="165" width="10" height="10" rx="1"/>
    <rect x="155" y="165" width="10" height="10" rx="1"/>
    <rect x="170" y="165" width="5" height="10" rx="1"/>
  </g>

  <!-- Floating Action Elements -->
  <circle cx="190" cy="130" r="12" fill="#10b981" opacity="0.8"/>
  <path d="M185 130l3 3 7-7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Decorative Light Glows -->
  <circle cx="200" cy="40" r="30" fill="#f59e0b" opacity="0.05"/>
  <circle cx="40" cy="200" r="40" fill="#38bdf8" opacity="0.03"/>
  
  <!-- Hand interacting -->
  <path d="M170 140c0-10 10-15 20-15s20 5 20 15v20h-40z" fill="#fb923c"/>
  <path d="M175 145h30v5h-30z" fill="#ec4899"/>
