<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Moon and Night Sky -->
  <circle cx="190" cy="50" r="20" fill="#fef3c7" opacity="0.8"/>
  <circle cx="200" cy="45" r="20" fill="#1e293b"/>
  
  <!-- Window Frame -->
  <rect x="40" y="60" width="160" height="140" rx="8" fill="none" stroke="#334155" stroke-width="4"/>
  <line x1="120" y1="60" x2="120" y2="200" stroke="#334155" stroke-width="4"/>
  
  <!-- Interior: Desk and Lamp -->
  <rect x="50" y="160" width="140" height="10" rx="2" fill="#334155"/>
  <path d="M150 160 L160 110 L170 110 L180 160 Z" fill="#fbbf24" opacity="0.4"/>
  <circle cx="165" cy="110" r="8" fill="#f59e0b"/>
  
  <!-- Character: Sleeping/Quiet Person -->
  <path d="M80 180 Q100 140 120 160" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="180" r="12" fill="#cbd5e1"/>
  <path d="M75 178 L78 182 M82 178 L85 182" stroke="#475569" stroke-width="2"/>
  
  <!-- Book on Desk -->
  <rect x="90" y="150" width="30" height="10" rx="1" fill="#64748b"/>
  
  <!-- Outside Elements: Trees -->
  <path d="M20 240 Q20 180 30 150 T60 180" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>
  <path d="M220 240 Q220 180 210 150 T180 180" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Stars -->
