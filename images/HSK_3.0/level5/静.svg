  <circle cx="60" cy="50" r="1" fill="#f8fafc"/>
  <circle cx="100" cy="20" r="1.5" fill="#f8fafc"/>
  <circle cx="140" cy="40" r="1" fill="#f8fafc"/>
  <circle cx="20" cy="90" r="1.5" fill="#f8fafc"/>
