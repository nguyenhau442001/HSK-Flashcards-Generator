<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Mirror Frame -->
  <rect x="60" y="30" width="120" height="180" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="68" y="38" width="104" height="164" rx="4" fill="#e2e8f0"/>
  
  <!-- Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 20 L20 20 L15 80 L-15 80 Z" fill="#fbbf24"/>
    <!-- Shirt -->
    <path d="M-18 22 L18 22 L15 50 L-15 50 Z" fill="#38bdf8"/>
    <path d="M-18 22 L-10 40 L10 40 L18 22 Z" fill="#0ea5e9"/>
    <!-- Pants -->
    <path d="M-15 50 L15 50 L12 90 L-12 90 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 -15 C-25 -40 25 -40 25 -15 C25 -25 10 -35 0 -35 C-10 -35 -25 -25 -25 -15" fill="#78350f"/>
  </g>
  
  <!-- Reflection in mirror -->
  <g transform="translate(120, 120)" opacity="0.6">
    <path d="M-20 20 L20 20 L15 80 L-15 80 Z" fill="#fbbf24"/>
    <path d="M-18 22 L18 22 L15 50 L-15 50 Z" fill="#38bdf8"/>
    <path d="M-15 50 L15 50 L12 90 L-12 90 Z" fill="#ec4899"/>
    <circle cx="0" cy="-10" r="25" fill="#fde68a"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="6" fill="#fb923c"/>
  <circle cx="210" cy="180" r="8" fill="#10b981"/>
  <path d="M190 40 L205 55 M205 40 L190 55" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
