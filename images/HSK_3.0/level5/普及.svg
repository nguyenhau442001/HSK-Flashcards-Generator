<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Room Interior -->
  <path d="M20 180 L220 180 L200 220 L40 220 Z" fill="#334155"/>
  <rect x="20" y="180" width="200" height="40" fill="#1e293b" opacity="0.5"/>
  
  <!-- Window/Frame -->
  <rect x="40" y="30" width="160" height="150" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Family Group -->
  <!-- Father -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M5 40 Q20 35 35 40 L30 80 L10 80 Z" fill="#38bdf8"/>
    <rect x="15" y="80" width="4" height="20" fill="#38bdf8"/>
    <rect x="21" y="80" width="4" height="20" fill="#38bdf8"/>
  </g>
  
  <!-- Mother -->
  <g transform="translate(100, 110)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M5 40 Q20 35 35 40 L35 80 L5 80 Z" fill="#ec4899"/>
  </g>
  
  <!-- Child -->
  <g transform="translate(140, 120)">
    <circle cx="15" cy="15" r="12" fill="#fbbf24"/>
    <path d="M5 30 Q15 25 25 30 L25 60 L5 60 Z" fill="#10b981"/>
  </g>
  
  <!-- Digital Connectivity Elements -->
  <path d="M80 60 L160 60 L150 100 L90 100 Z" fill="#334155"/>
  <rect x="85" y="65" width="70" height="30" fill="#1e293b"/>
  <circle cx="120" cy="80" r="8" fill="#38bdf8"/>
  
  <!-- Connection Lines -->
  <path d="M120 88 L120 120" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M120 88 L80 120" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M120 88 L160 130" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Ambient Glows -->
  <circle cx="180" cy="50" r="20" fill="#fbbf24" opacity="0.1"/>
  <circle cx="40" cy="150" r="15" fill="#38bdf8" opacity="0.1"/>
</svg>