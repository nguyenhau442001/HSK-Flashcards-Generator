<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Golden Highlight Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Accent Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- UI Panel Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background elements representing complex system operations -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#38bdf8" stroke-dasharray="4,8" stroke-width="2"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="#10b981" stroke-dasharray="2,6" stroke-width="1.5"/>
    <path d="M 40 120 L 200 120" stroke="#64748b" stroke-width="1"/>
    <path d="M 120 40 L 120 200" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Main Multi-Function Device (Futuristic Tablet/Control Center) -->
  <g filter="url(#dropShadow)">
    <!-- Outer Shell -->
    <rect x="42" y="32" width="156" height="156" rx="16" fill="#334155" stroke="#475569" stroke-width="2"/>
    
    <!-- Inner Screen Area -->
    <rect x="52" y="42" width="136" height="136" rx="10" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="2"/>

    <!-- Screen Grid Lines -->
    <path d="M 52 86 L 188 86 M 52 130 L 188 130 M 96 42 L 96 178 M 144 42 L 144 178" stroke="#1e293b" stroke-width="1" opacity="0.5"/>

    <!-- FUNCTION MODULE 1: Data Analytics (Top-Left) -->
    <g transform="translate(60, 50)">
      <rect width="32" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Mini Bar Chart -->
      <rect x="7" y="18" width="4" height="8" rx="1" fill="#38bdf8"/>
      <rect x="14" y="12" width="4" height="14" rx="1" fill="#38bdf8"/>
      <rect x="21" y="8" width="4" height="18" rx="1" fill="#10b981"/>
    </g>

    <!-- FUNCTION MODULE 2: Media/Audio Waveform (Top-Right) -->
    <g transform="translate(148, 50)">
      <rect width="32" height="32" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
      <!-- Waveform lines -->
      <path d="M 8 16 L 11 10 L 14 22 L 17 13 L 20 19 L 23 16" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- FUNCTION MODULE 3: Security/Shield (Bottom-Left) -->
    <g transform="translate(60, 138)">
      <rect width="32" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <!-- Shield icon -->
      <path d="M 16 8 L 22 10 L 22 17 C 22 21 19 23 16 25 C 13 23 10 21 10 17 L 10 10 Z" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- FUNCTION MODULE 4: Connectivity/Sync (Bottom-Right) -->
    <g transform="translate(148, 138)">
      <rect width="32" height="32" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Cog/Settings wheel -->
      <circle cx="16" cy="16" r="5" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 16 8 L 16 10 M 16 22 L 16 24 M 8 16 L 10 16 M 22 16 L 24 16" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- CENTRAL CORE: Active Multi-Function Engine -->
    <g transform="translate(96, 86)">
      <!-- Outer Pulsing Ring -->
      <circle cx="24" cy="24" r="22" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
      <!-- Inner Core -->
      <circle cx="24" cy="24" r="14" fill="url(#goldGrad)"/>
      <!-- Dynamic Function Star/Sparkle -->
      <path d="M 24 14 L 26.5 21.5 L 34 24 L 26.5 26.5 L 24 34 L 21.5 26.5 L 14 24 L 21.5 21.5 Z" fill="#0f172a"/>
    </g>
  </g>

  <!-- Dynamic Floating Interactive Elements (Representing active functions operating) -->
  <g>
    <!-- Floating Success Node -->
    <g transform="translate(26, 95)" filter="url(#dropShadow)">
      <rect width="44" height="24" rx="12" fill="#10b981"/>
      <polyline points="15,12 20,17 30,7" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Floating Connection Node -->
    <g transform="translate(170, 95)" filter="url(#dropShadow)">
      <rect width="44" height="24" rx="12" fill="#38bdf8"/>
      <circle cx="22" cy="12" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M 15 12 L 29 12" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- Device Stand / Base -->
  <path d="M 90 188 L 150 188 L 160 198 L 80 198 Z" fill="#475569"/>
  <ellipse cx="120" cy="198" rx="60" ry="4" fill="#0f172a" opacity="0.8"/>

  <!-- Foreground Atmospheric Highlights -->
  <circle cx="50" cy="40" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="190" cy="35" r="1.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="205" cy="140" r="2" fill="#10b981" opacity="0.6"/>
  <circle cx="30" cy="160" r="1.5" fill="#ec4899" opacity="0.7"/>
</svg>