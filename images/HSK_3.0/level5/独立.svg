<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 190 C 80 170, 160 170, 240 190 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Flag Pole -->
  <rect x="115" y="60" width="6" height="140" rx="2" fill="#94a3b8"/>
  <circle cx="118" cy="60" r="8" fill="#f59e0b"/>
  
  <!-- Flag -->
  <path d="M121 65 L 180 85 L 121 105 Z" fill="#f59e0b"/>
  
  <!-- Character: A young explorer standing proudly -->
  <g transform="translate(60, 120)">
    <!-- Body -->
    <path d="M20 80 Q 20 40, 40 40 T 60 80 L 60 110 L 20 110 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="40" cy="35" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M25 30 Q 40 10, 55 30 Q 40 20, 25 30" fill="#78350f"/>
    <!-- Legs -->
    <rect x="25" y="110" width="10" height="10" fill="#1e293b"/>
    <rect x="45" y="110" width="10" height="10" fill="#1e293b"/>
  </g>
  
  <!-- Decorative elements: Distant mountains -->
  <path d="M0 180 L 40 130 L 80 180 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M160 180 L 200 120 L 240 180 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Stars -->
  <circle cx="30" cy="40" r="2" fill="#fbbf24"/>
  <circle cx="200" cy="50" r="3" fill="#fbbf24"/>
  <circle cx="180" cy="30" r="1.5" fill="#fbbf24"/>
  
  <!-- Accent glow -->
  <circle cx="150" cy="80" r="40" fill="#fb923c" opacity="0.05"/>
</svg>