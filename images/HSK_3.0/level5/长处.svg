<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Scene: A collaborative workshop setting -->
  <!-- Person 1: The Artist -->
  <g transform="translate(40, 120)">
    <circle cx="30" cy="20" r="15" fill="#fde68a"/>
    <path d="M15 40 Q30 35 45 40 L40 90 L20 90 Z" fill="#ec4899"/>
    <rect x="25" y="90" width="10" height="30" fill="#fb923c"/>
    <path d="M30 45 L50 60 L35 70" stroke="#f59e0b" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Person 2: The Engineer/Builder -->
  <g transform="translate(140, 120)">
    <circle cx="30" cy="20" r="15" fill="#fde68a"/>
    <path d="M15 40 Q30 35 45 40 L40 90 L20 90 Z" fill="#38bdf8"/>
    <rect x="25" y="90" width="10" height="30" fill="#fb923c"/>
    <rect x="40" y="50" width="20" height="20" fill="#10b981" rx="2"/>
  </g>

  <!-- Props: Showing their respective strengths -->
  <!-- Artist's Easel -->
  <path d="M20 180 L50 120 L80 180 M30 170 L70 170" stroke="#94a3b8" stroke-width="4" fill="none"/>
  <rect x="35" y="130" width="30" height="35" fill="#ec4899" rx="2"/>
  
  <!-- Engineer's Blueprint/Tools -->
  <rect x="150" y="140" width="40" height="30" fill="#38bdf8" rx="2"/>
  <line x1="155" y1="150" x2="185" y2="150" stroke="#0f172a" stroke-width="2"/>
  <line x1="155" y1="160" x2="175" y2="160" stroke="#0f172a" stroke-width="2"/>

  <!-- Decorative elements -->
  <circle cx="120" cy="80" r="3" fill="#fbbf24"/>
  <circle cx="180" cy="50" r="2" fill="#fbbf24"/>
  <circle cx="60" cy="60" r="2" fill="#fbbf24"/>
  
  <!-- Ground line -->
  <path d="M0 210 L240 210" stroke="#334155" stroke-width="2"/>
</svg>