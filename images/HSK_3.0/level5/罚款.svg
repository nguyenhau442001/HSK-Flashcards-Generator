<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    
    <!-- Stamp Red Gradient -->
    <linearGradient id="stamp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric background details / City window light -->
  <path d="M160 30 L210 50 L210 180 L160 180 Z" fill="#38bdf8" opacity="0.03" />
  <circle cx="190" cy="70" r="15" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

  <!-- Back Wall and Floor Line -->
  <rect x="0" y="160" width="240" height="80" fill="url(#floor-grad)" opacity="0.7"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2" opacity="0.5"/>

  <!-- Secondary props in background (Parking Meter / Desk edge) -->
  <rect x="30" y="90" width="35" height="70" rx="6" fill="#475569" filter="url(#shadow)"/>
  <rect x="37" y="100" width="21" height="15" rx="3" fill="#1e293b"/>
  <circle cx="47" cy="107" r="4" fill="#ef4444" filter="url(#glow)"/>
  <rect x="42" y="125" width="11" height="25" fill="#334155" rx="2"/>

  <!-- MAIN SCENE: The Penalty Ticket / Fine Document -->
  <!-- Tilted Document base -->
  <g transform="translate(60, 45) rotate(-8)" filter="url(#shadow)">
    <!-- Document shadow offset -->
    <rect x="10" y="10" width="110" height="135" rx="8" fill="#000000" opacity="0.3"/>
    
    <!-- Main Paper -->
    <rect x="0" y="0" width="110" height="135" rx="8" fill="url(#paper-grad)"/>
    
    <!-- Header banner -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 102 0 A 8 8 0 0 1 110 8 L 110 25 L 0 25 Z" fill="#334155"/>
    <circle cx="15" cy="12" r="3" fill="#ef4444"/>
    <circle cx="25" cy="12" r="3" fill="#f59e0b"/>
    <circle cx="35" cy="12" r="3" fill="#10b981"/>

    <!-- Document fake lines / content -->
    <rect x="15" y="38" width="50" height="6" rx="3" fill="#94a3b8"/>
    <rect x="15" y="52" width="80" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="15" y="62" width="65" height="4" rx="2" fill="#cbd5e1"/>
    
    <!-- Price breakdown section -->
    <rect x="15" y="78" width="80" height="25" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="27" cy="90" r="5" fill="#f59e0b"/>
    <rect x="38" y="87" width="45" height="5" rx="2.5" fill="#64748b"/>

    <!-- Barcode at bottom -->
    <g transform="translate(15, 112)">
      <rect x="0" y="0" width="4" height="12" fill="#475569"/>
      <rect x="6" y="0" width="2" height="12" fill="#475569"/>
      <rect x="10" y="0" width="6" height="12" fill="#475569"/>
      <rect x="18" y="0" width="2" height="12" fill="#475569"/>
      <rect x="22" y="0" width="5" height="12" fill="#475569"/>
      <rect x="29" y="0" width="3" height="12" fill="#475569"/>
      <rect x="35" y="0" width="7" height="12" fill="#475569"/>
      <rect x="44" y="0" width="2" height="12" fill="#475569"/>
      <rect x="48" y="0" width="5" height="12" fill="#475569"/>
      <rect x="56" y="0" width="4" height="12" fill="#475569"/>
    </g>

    <!-- OFFICIAL RED STAMP (Violation / Fine mark) -->
    <g transform="translate(55, 60) rotate(14)">
      <circle cx="25" cy="25" r="22" fill="none" stroke="url(#stamp-grad)" stroke-width="3" stroke-dasharray="6 2" opacity="0.85"/>
      <circle cx="25" cy="25" r="17" fill="none" stroke="url(#stamp-grad)" stroke-width="1.5" opacity="0.85"/>
      <!-- Stylized exclamation/cross inside stamp -->
      <path d="M25 13 L25 27 M25 33 L25 35" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>

  <!-- FOREGROUND: Golden Coins (The Penalty money being paid/fined) -->
  <!-- Coin Stack 1 (Tall) -->
  <g transform="translate(160, 140)" filter="url(#shadow)">
    <ellipse cx="20" cy="40" rx="20" ry="8" fill="#b45309"/>
    <ellipse cx="20" cy="35" rx="20" ry="8" fill="url(#coin-grad)"/>
    <ellipse cx="20" cy="30" rx="20" ry="8" fill="#b45309"/>
    <ellipse cx="20" cy="25" rx="20" ry="8" fill="url(#coin-grad)"/>
    <ellipse cx="20" cy="20" rx="20" ry="8" fill="#b45309"/>
    <ellipse cx="20" cy="15" rx="20" ry="8" fill="url(#coin-grad)"/>
    <ellipse cx="20" cy="10" rx="20" ry="8" fill="#b45309"/>
    <ellipse cx="20" cy="5" rx="20" ry="8" fill="url(#coin-grad)"/>
    <!-- Top coin detail -->
    <ellipse cx="20" cy="5" rx="12" ry="4" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
  </g>

  <!-- Coin Stack 2 (Short, overlapping) -->
  <g transform="translate(130, 155)" filter="url(#shadow)">
    <ellipse cx="15" cy="25" rx="15" ry="6" fill="#b45309"/>
    <ellipse cx="15" cy="20" rx="15" ry="6" fill="url(#coin-grad)"/>
    <ellipse cx="15" cy="15" rx="15" ry="6" fill="#b45309"/>
    <ellipse cx="15" cy="10" rx="15" ry="6" fill="url(#coin-grad)"/>
    <ellipse cx="15" cy="5" rx="15" ry="6" fill="url(#coin-grad)"/>
    <ellipse cx="15" cy="5" rx="9" ry="3" fill="none" stroke="#fcd34d" stroke-width="1"/>
  </g>

  <!-- Loose dynamic coin tumbling -->
  <g transform="translate(95, 130) rotate(25)" filter="url(#shadow)">
    <ellipse cx="12" cy="6" rx="12" ry="5" fill="url(#coin-grad)"/>
    <ellipse cx="12" cy="6" rx="7" ry="2.5" fill="none" stroke="#fcd34d" stroke-width="1"/>
  </g>

  <!-- Sparkles & Action Elements for vividness -->
  <g fill="#fbbf24">
    <path d="M 185 100 L 188 108 L 196 111 L 188 114 L 185 122 L 182 114 L 174 111 L 182 108 Z" filter="url(#glow)" opacity="0.9"/>
    <path d="M 115 50 L 117 55 L 122 57 L 117 59 L 115 64 L 113 59 L 108 57 L 113 55 Z" opacity="0.6"/>
  </g>
  <circle cx="75" cy="140" r="3" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="150" cy="115" r="2" fill="#38bdf8" opacity="0.7"/>

  <!-- Pen resting beside the ticket (Completing the real-world scene) -->
  <g transform="translate(35, 150) rotate(-35)" filter="url(#shadow)">
    <rect x="0" y="0" width="8" height="55" rx="4" fill="#0284c7"/>
    <path d="M 0 45 L 4 55 L 8 45 Z" fill="#0f172a"/>
    <rect x="2" y="5" width="4" height="40" fill="#38bdf8" opacity="0.5"/>
    <rect x="1" y="2" width="6" height="4" rx="1" fill="#e2e8f0"/>
  </g>
</svg>