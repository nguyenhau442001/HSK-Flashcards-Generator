<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Stage Backdrop -->
  <path d="M40 180 L200 180 L210 220 L30 220 Z" fill="#334155"/>
  <circle cx="120" cy="80" r="50" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <path d="M90 100 Q120 120 150 100" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Speaker/Host -->
  <g transform="translate(160, 120)">
    <circle cx="0" cy="-30" r="12" fill="#fbbf24"/>
    <path d="M-15 0 L15 0 L10 50 L-10 50 Z" fill="#fb923c"/>
    <path d="M-20 10 L-30 40" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 10 L30 30" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Guests Arriving -->
  <g transform="translate(60, 140)">
    <circle cx="0" cy="-30" r="10" fill="#38bdf8"/>
    <path d="M-12 0 L12 0 L8 40 L-8 40 Z" fill="#38bdf8"/>
    <path d="M-5 5 L-15 30" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(100, 145)">
    <circle cx="0" cy="-30" r="10" fill="#10b981"/>
    <path d="M-12 0 L12 0 L8 40 L-8 40 Z" fill="#10b981"/>
    <path d="M5 5 L15 30" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Decorative Lighting -->
  <circle cx="40" cy="50" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="200" cy="60" r="4" fill="#f59e0b" opacity="0.6"/>
  <path d="M120 180 L120 220" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Podium -->
  <rect x="140" y="150" width="40" height="70" rx="4" fill="#475569"/>
  <rect x="145" y="155" width="30" height="10" rx="2" fill="#f59e0b"/>
</svg>