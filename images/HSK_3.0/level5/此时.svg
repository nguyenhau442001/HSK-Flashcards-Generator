<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Classroom/Meeting Room Setting -->
  <rect x="20" y="180" width="200" height="10" fill="#334155" rx="2"/>
  <rect x="40" y="190" width="160" height="5" fill="#475569" rx="2"/>
  
  <!-- Characters -->
  <!-- Person 1 (Left) -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 35 Q20 50 30 35" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <rect x="5" y="50" width="30" height="80" rx="5" fill="#38bdf8"/>
    <circle cx="15" cy="22" r="2" fill="#0f172a"/>
    <circle cx="25" cy="22" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Person 2 (Center) -->
  <g transform="translate(100, 90)">
    <circle cx="20" cy="20" r="18" fill="#fbbf24"/>
    <path d="M10 38 Q20 55 30 38" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <rect x="5" y="55" width="30" height="90" rx="5" fill="#ec4899"/>
    <circle cx="15" cy="20" r="2" fill="#0f172a"/>
    <circle cx="25" cy="20" r="2" fill="#0f172a"/>
    <path d="M15 30 Q20 33 25 30" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Person 3 (Right) -->
  <g transform="translate(160, 105)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 35 Q20 50 30 35" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <rect x="5" y="45" width="30" height="75" rx="5" fill="#10b981"/>
    <circle cx="15" cy="22" r="2" fill="#0f172a"/>
    <circle cx="25" cy="22" r="2" fill="#0f172a"/>
  </g>

  <!-- Silence/Focus Effect -->
  <circle cx="120" cy="120" r="90" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.5"/>
  <path d="M115 60 L125 60 M120 55 L120 65" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  <path d="M180 120 L190 120 M185 115 L185 125" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
</svg>