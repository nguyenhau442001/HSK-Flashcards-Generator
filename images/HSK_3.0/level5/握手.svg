<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Architectural Background & Atmosphere -->
  <!-- Warm office/meeting room ambient glow -->
  <radialGradient id="roomGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
    <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
  </radialGradient>
  <rect x="0" y="0" width="240" height="240" fill="url(#roomGlow)"/>

  <!-- Background Environment: Window and Plants -->
  <!-- Large modern window -->
  <rect x="40" y="40" width="160" height="90" rx="4" fill="#1e293b" opacity="0.6"/>
  <path d="M40 75 L200 75" stroke="#0f172a" stroke-width="2"/>
  <path d="M120 40 L120 130" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Warm outdoor light hint -->
  <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
  </linearGradient>
  <rect x="42" y="42" width="156" height="86" fill="url(#windowLight)"/>

  <!-- Indoor Plants / Bookshelf silhouettes for depth -->
  <path d="M15 150 C15 130 25 120 30 110 C35 120 45 130 45 150 Z" fill="#065f46" opacity="0.7"/>
  <path d="M25 140 C25 125 32 115 35 105 C38 115 45 125 45 140 Z" fill="#10b981" opacity="0.8"/>
  <rect x="20" y="150" width="20" height="30" rx="4" fill="#334155"/>

  <!-- Office Meeting Table -->
  <path d="M20 170 L220 170 L200 210 L40 210 Z" fill="#1e293b"/>
  <path d="M25 170 L215 170" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Table props -->
  <rect x="105" y="178" width="12" height="8" rx="2" fill="#64748b"/>
  <circle cx="135" cy="182" r="5" fill="#f43f5e" opacity="0.8"/>

  <!-- Characters: Two professionals shaking hands -->
  <!-- Character Left (Person A) -->
  <g id="character-left">
    <!-- Torso & Suit -->
    <path d="M60 170 L85 135 L100 145 L95 195 L60 195 Z" fill="#1e40af"/>
    <path d="M75 135 L88 155 L100 145" fill="#ffffff"/> <!-- Shirt collar -->
    <path d="M85 145 L88 175 L91 145 Z" fill="#ef4444"/> <!-- Tie -->
    <!-- Head & Hair -->
    <circle cx="85" cy="115" r="16" fill="#fbcfe8"/>
    <path d="M70 115 C70 100 85 95 95 105 C98 108 98 115 95 118 C90 115 80 115 70 115 Z" fill="#1e293b"/> <!-- Hair -->
    <!-- Left Arm / Back -->
    <path d="M65 145 L50 165 L60 175" fill="#1e40af"/>
    <!-- Right Arm reaching out for handshake -->
    <path d="M95 140 C105 145 115 148 123 150" stroke="#1e40af" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character Right (Person B) -->
  <g id="character-right">
    <!-- Torso & Suit -->
    <path d="M180 170 L155 135 L140 145 L145 195 L180 195 Z" fill="#334155"/>
    <path d="M165 135 L152 155 L140 145" fill="#f8fafc"/> <!-- Shirt collar -->
    <path d="M155 145 L152 175 L149 145 Z" fill="#38bdf8"/> <!-- Tie -->
    <!-- Head & Hair -->
    <circle cx="155" cy="115" r="16" fill="#fed7aa"/>
    <path d="M140 112 C142 98 158 98 168 108 C160 105 148 108 140 112 Z" fill="#78350f"/> <!-- Hair -->
    <!-- Right Arm / Back -->
    <path d="M175 145 L190 165 L180 175" fill="#334155"/>
    <!-- Left Arm reaching out for handshake -->
    <path d="M145 140 C135 145 127 148 120 150" stroke="#334155" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Central Handshake Intersection (Focal Point) -->
  <g id="handshake">
    <!-- Interlocking Hands -->
    <circle cx="121" cy="150" r="8" fill="#fbcfe8"/>
    <circle cx="123" cy="151" r="7" fill="#fed7aa"/>
    <!-- Cufflinks / Sleeves meeting -->
    <rect x="117" y="146" width="4" height="10" rx="1" fill="#ffffff" transform="rotate(15 119 151)"/>
  </g>

  <!-- Expressions / Smiles (Friendly & Professional) -->
  <!-- Left smile -->
  <path d="M88 120 Q92 124 95 120" stroke="#9f1239" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Right smile -->
  <path d="M152 120 Q148 124 145 120" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Success / Agreement Sparkles (Warm golden accents) -->
  <g id="sparkles">
    <path d="M121 115 L123 123 L131 125 L123 127 L121 135 L119 127 L111 125 L119 123 Z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="102" cy="105" r="2" fill="#fbbf24"/>
    <circle cx="140" cy="102" r="3" fill="#f59e0b"/>
    <path d="M96 92 L97 96 L101 97 L97 98 L96 102 L95 98 L91 97 L95 96 Z" fill="#f8fafc" opacity="0.6"/>
  </g>

  <!-- Foreground Vignette / Soft Lighting Overlay -->
  <linearGradient id="floorGlow" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#0f172a" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.0"/>
  </linearGradient>
  <rect x="0" y="190" width="240" height="50" fill="url(#floorGlow)"/>
</svg>