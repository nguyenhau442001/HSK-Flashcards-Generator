<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="150" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="160" width="10" height="80" fill="#475569"/>
  <rect x="190" y="160" width="10" height="80" fill="#475569"/>
  
  <!-- Books and Props -->
  <rect x="50" y="130" width="40" height="20" rx="2" fill="#ec4899"/>
  <rect x="150" y="120" width="30" height="30" rx="4" fill="#38bdf8"/>
  
  <!-- Teacher Figure (Silhouette/Stylized) -->
  <g transform="translate(160, 60)">
    <circle cx="10" cy="10" r="10" fill="#fbbf24"/>
    <path d="M0 30 Q10 20 20 30 L15 60 L5 60 Z" fill="#fbbf24"/>
    <path d="M-10 40 L0 35 M30 40 L20 35" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Student Figure -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="15" fill="#f8fafc"/>
    <path d="M5 40 L35 40 L30 100 L10 100 Z" fill="#fb923c"/>
    <path d="M5 40 L-10 70 M35 40 L50 70" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 100 L5 140 M30 100 L35 140" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Motion/Inspiration Effect -->
  <path d="M140 70 Q100 60 80 90" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <circle cx="140" cy="70" r="3" fill="#fbbf24"/>
  
  <!-- Forward Motion Lines -->
  <path d="M100 100 L130 90 M100 110 L140 100 M100 120 L130 110" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>