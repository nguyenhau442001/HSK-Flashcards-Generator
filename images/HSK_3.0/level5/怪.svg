<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Office Desk -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="180" y="150" width="10" height="80" rx="2" fill="#475569"/>
  
  <!-- Spilled Coffee Scene -->
  <path d="M70 140 Q 80 160 110 155 Q 130 150 120 140 Z" fill="#fb923c" opacity="0.8"/>
  <circle cx="60" cy="120" r="15" fill="#f1f5f9"/>
  <path d="M55 115 L65 125 M65 115 L55 125" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Character 1: The Accuser (Pointing) -->
  <g transform="translate(160, 80)">
    <circle cx="20" cy="20" r="15" fill="#fcd34d"/>
    <path d="M20 35 L20 80 M20 50 L40 60" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 60 L55 50" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2: The Innocent (Defensive gesture) -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="15" fill="#38bdf8"/>
    <path d="M20 35 L20 80 M20 50 L5 70 M20 50 L35 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Hands up in "not my fault" gesture -->
    <circle cx="5" cy="70" r="4" fill="#38bdf8"/>
    <circle cx="35" cy="70" r="4" fill="#38bdf8"/>
  </g>
  
  <!-- Context Props: Laptop -->
  <rect x="130" y="120" width="60" height="20" rx="2" fill="#94a3b8"/>
  <rect x="135" y="100" width="50" height="20" rx="2" fill="#cbd5e1"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="30" cy="50" r="2" fill="#ec4899"/>
</svg>