    <path d="M10 90 L5 120 M30 90 L35 120" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Household Props -->
  <path d="M180 180 L200 180 L195 210 L185 210 Z" fill="#10b981"/>
  <rect x="188" y="160" width="4" height="20" fill="#94a3b8"/>
  
  <!-- Floating sparkles -->
  <circle cx="100" cy="80" r="2" fill="#fbbf24"/>
  <circle cx="120" cy="70" r="3" fill="#fbbf24"/>
  <circle cx="110" cy="90" r="2" fill="#fbbf24"/>
</svg>