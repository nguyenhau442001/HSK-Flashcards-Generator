<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Room Interior -->
  <rect x="20" y="150" width="200" height="60" fill="#334155" rx="4"/>
  <circle cx="180" cy="170" r="15" fill="#1e293b"/>
  
  <!-- Robot -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="40" height="60" rx="8" fill="#38bdf8"/>
    <circle cx="20" cy="20" r="10" fill="#f1f5f9"/>
    <rect x="10" y="15" width="20" height="10" fill="#0f172a"/>
    <rect x="5" y="40" width="30" height="5" fill="#fb923c"/>
    <path d="M5 60 L0 80 M35 60 L40 80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Human Character -->
  <g transform="translate(140, 110)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
