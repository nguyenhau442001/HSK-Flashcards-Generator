<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="toolGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Workshop Background Elements -->
  <path d="M40 40 H200 V160 H40 Z" fill="#1e293b" opacity="0.5"/>
  <!-- Pegboard Wall -->
  <g fill="#475569" opacity="0.4">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="80" cy="60" r="2"/>
    <circle cx="100" cy="60" r="2"/>
    <circle cx="120" cy="60" r="2"/>
    <circle cx="140" cy="60" r="2"/>
    <circle cx="160" cy="60" r="2"/>
    <circle cx="180" cy="60" r="2"/>
    
    <circle cx="60" cy="80" r="2"/>
    <circle cx="80" cy="80" r="2"/>
    <circle cx="100" cy="80" r="2"/>
    <circle cx="120" cy="80" r="2"/>
    <circle cx="140" cy="80" r="2"/>
    <circle cx="160" cy="80" r="2"/>
    <circle cx="180" cy="80" r="2"/>

    <circle cx="60" cy="100" r="2"/>
    <circle cx="80" cy="100" r="2"/>
    <circle cx="100" cy="100" r="2"/>
    <circle cx="120" cy="100" r="2"/>
    <circle cx="140" cy="100" r="2"/>
    <circle cx="160" cy="100" r="2"/>
    <circle cx="180" cy="100" r="2"/>
  </g>

  <!-- Hanging tool silhouettes on pegboard -->
  <path d="M165 65 L175 85 H155 Z" fill="#64748b" opacity="0.6"/>
  <rect x="70" y="65" width="6" height="25" rx="3" fill="#64748b" opacity="0.6"/>

  <!-- Warm ambient light from lamp -->
  <path d="M110 20 L130 20 L140 50 L100 50 Z" fill="#fbbf24" opacity="0.3"/>
  <circle cx="120" cy="35" r="50" fill="#fbbf24" opacity="0.08"/>

  <!-- Workbench Surface -->
  <rect x="20" y="155" width="200" height="55" rx="6" fill="url(#deskGrad)"/>
  <rect x="20" y="150" width="200" height="8" rx="2" fill="#475569"/>

  <!-- Props on Desk: Blueprints & Spare parts -->
  <rect x="35" y="145" width="45" height="15" rx="2" fill="#3b82f6" opacity="0.8"/>
  <path d="M40 148 H70 M40 152 H60" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="185" cy="148" r="8" fill="#10b981"/>
  <path d="M181 148 L184 151 L189 145" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Character 1 (Curious Learner/Apprentice - Left) -->
  <g transform="translate(35, 95)">
    <!-- Body/Shoulders -->
    <path d="M15 65 C15 50 35 45 45 45 C55 45 75 50 75 65 L80 65 L80 80 L10 80 L10 65 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="45" cy="28" r="16" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M30 22 C30 15 40 12 47 14 C55 12 62 16 61 25 C58 24 55 20 47 20 C38 20 33 22 30 22 Z" fill="#475569"/>
    <!-- Face expression: Curious/Questioning -->
    <circle cx="51" cy="27" r="1.5" fill="#1e293b"/>
    <path d="M47 34 Q51 32 55 34" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Raised eyebrow -->
    <path d="M49 23 Q51 21 53 23" stroke="#475569" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Arm pointing/holding -->
    <path d="M60 55 L75 45" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Expert/Instructor - Right) -->
  <g transform="translate(130, 90)">
    <!-- Body/Shoulders -->
    <path d="M15 70 C15 55 30 50 40 50 C50 50 65 55 65 70 L75 70 L75 85 L5 85 L5 70 Z" fill="#f43f5e"/>
    <!-- Head -->
    <circle cx="40" cy="26" r="16" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M25 20 C28 12 38 12 45 13 C52 12 55 16 55 24 C50 22 35 22 25 20 Z" fill="#1e293b"/>
    <!-- Face expression: Explaining/Smiling -->
    <circle cx="33" cy="25" r="1.5" fill="#1e293b"/>
    <path d="M34 32 Q37 35 40 32" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Arm gesturing -->
    <path d="M20 60 L5 48" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Central Mysterious/Innovative Tool (The focus of "What is its use?") -->
  <g transform="translate(100, 115)">
    <!-- Spotlight/Glow effect on the tool -->
    <circle cx="20" cy="20" r="30" fill="url(#toolGlow)"/>
    
    <!-- Multi-function futuristic/complex hand tool -->
    <!-- Handle -->
    <rect x="14" y="20" width="12" height="25" rx="4" fill="#64748b" transform="rotate(15 20 20)"/>
    <!-- Grip rings -->
    <rect x="15" y="26" width="10" height="2" fill="#334155" transform="rotate(15 20 20)"/>
    <rect x="14" y="32" width="10" height="2" fill="#334155" transform="rotate(15 20 20)"/>
    
    <!-- Main Body casing -->
    <path d="M10 5 L30 5 C35 5 38 10 35 15 L25 30 C22 35 15 35 12 30 L5 15 C2 10 5 5 10 5 Z" fill="#fb923c"/>
    
    <!-- Emitting energetic pulses (representing versatility / multiple uses) -->
    <circle cx="20" cy="12" r="4" fill="#38bdf8"/>
    <path d="M15 -2 L25 -2 M10 2 L30 2" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Adjustable head attachments -->
    <path d="M12 2 L28 2 L25 -5 L15 -5 Z" fill="#e2e8f0"/>
  </g>

  <!-- Question mark aura floating delicately above the tool -->
  <g transform="translate(108, 65)" opacity="0.9">
    <circle cx="12" cy="12" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M7 9 C7 5 17 5 17 10 C17 13 12 13 12 16" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="12" cy="20" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Ambient lighting highlights on foreground -->
  <path d="M0 220 L240 220" stroke="#334155" stroke-width="4" opacity="0.5"/>
</svg>