<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="stomach-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment: Cozy Dining Room at Night -->
  <g id="environment">
    <!-- Window with night city glow -->
    <rect x="25" y="35" width="55" height="70" rx="8" fill="#334155" />
    <rect x="30" y="40" width="45" height="60" rx="4" fill="#0f172a" />
    <!-- City lights outside -->
    <circle cx="40" cy="60" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="55" cy="85" r="1.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="65" cy="50" r="2" fill="#ec4899" opacity="0.5"/>
    <path d="M 30 75 L 45 65 L 70 85 L 70 100 L 30 100 Z" fill="#1e293b" opacity="0.5"/>

    <!-- Warm Pendant Lamp -->
    <path d="M 140 15 L 150 15 L 147 45 L 133 45 Z" fill="#475569" />
    <path d="M 120 45 L 160 45 L 167 60 L 113 60 Z" fill="#334155" />
    <path d="M 110 60 L 170 60 L 180 75 L 100 75 Z" fill="#f59e0b" />
    <!-- Light Cone -->
    <polygon points="140,75 70,220 210,220" fill="url(#glow-grad)" />

    <!-- Dining Table -->
    <path d="M 40 185 L 200 185 L 210 220 L 30 220 Z" fill="#334155" />
    <rect x="35" y="175" width="170" height="12" rx="4" fill="#475569" />

    <!-- Excess Food Props (Piles of empty plates & bowls showing "eating too much") -->
    <!-- Large Bowl (Empty, messy) -->
    <ellipse cx="70" cy="175" rx="22" ry="7" fill="#cbd5e1" />
    <path d="M 48 175 C 48 190 92 190 92 175 Z" fill="#94a3b8" />
    <ellipse cx="70" cy="177" rx="18" ry="5" fill="#64748b" />
    <!-- Steam/food crumbs -->
    <circle cx="65" cy="168" r="1.5" fill="#f8fafc" opacity="0.7"/>
    <circle cx="75" cy="166" r="2" fill="#f8fafc" opacity="0.5"/>

    <!-- Stack of plates -->
    <ellipse cx="170" cy="180" rx="18" ry="6" fill="#e2e8f0" />
    <ellipse cx="170" cy="177" rx="17" ry="5" fill="#cbd5e1" />
    <ellipse cx="170" cy="174" rx="16" ry="5" fill="#f8fafc" />
    
    <!-- Teapot / Extra prop -->
    <path d="M 130 165 Q 130 150 140 150 Q 150 150 150 165 Z" fill="#ef4444" />
    <path d="M 137 150 L 143 150 L 143 145 L 137 145 Z" fill="#f8fafc" />
    <path d="M 125 158 Q 120 155 125 152" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Main Character: Over-eaten, feeling uncomfortable/heavy digestion -->
  <g id="main-character" filter="url(#soft-shadow)">
    <!-- Chair Back -->
    <path d="M 100 100 L 140 100 L 145 180 L 95 180 Z" fill="#1e293b" opacity="0.7"/>
    <rect x="105" y="110" width="30" height="60" rx="6" fill="#475569" />

    <!-- Body Slouched Back -->
    <!-- Torso (Yellow Hoodie/Shirt) -->
    <path d="M 95 130 Q 120 120 145 135 L 155 190 L 85 190 Z" fill="#fbbf24" />
    <!-- Round protruding tummy indicating overeating -->
    <path d="M 100 150 Q 120 185 140 155 Z" fill="#f59e0b" />
    <!-- Tummy discomfort aura/glow -->
    <circle cx="120" cy="160" r="22" fill="url(#stomach-glow)" />

    <!-- Hands holding/rubbing stomach -->
    <!-- Left Arm & Hand -->
    <path d="M 100 135 Q 90 150 110 165" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="112" cy="166" r="6" fill="#fde047" /> <!-- Hand -->

    <!-- Right Arm & Hand -->
    <path d="M 140 140 Q 145 155 125 168" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="123" cy="169" r="6" fill="#fde047" /> <!-- Hand -->

    <!-- Head & Neck -->
    <rect x="113" y="110" width="14" height="25" fill="#fde047" />
    <circle cx="120" cy="105" r="22" fill="#fde047" />

    <!-- Hair (Messy, stylized dark brown/black) -->
    <path d="M 98 100 Q 105 85 120 87 Q 135 85 142 100 Q 145 110 138 112 Q 120 102 102 112 Z" fill="#334155" />

    <!-- Face Expression: Heavy, bloated, dizzy/uncomfortable -->
    <!-- Closed/Squinted Upset Eyes -->
    <path d="M 110 103 Q 114 107 118 103" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 122 103 Q 126 107 130 103" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Sweaty brow drop -->
    <path d="M 134 98 Q 136 102 134 104 Q 132 104 132 102 Z" fill="#38bdf8" />

    <!-- Wavy Upset Mouth (groaning) -->
    <path d="M 114 115 Q 120 110 126 115" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Rosy/Greenish sick cheeks -->
    <circle cx="108" cy="111" r="3" fill="#10b981" opacity="0.3" />
    <circle cx="132" cy="111" r="3" fill="#10b981" opacity="0.3" />
  </g>

  <!-- Visual Metaphor / Action Indicator (Swirling digestion arrows floating near tummy) -->
  <g opacity="0.8">
    <path d="M 135 145 C 145 140 145 160 135 155" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 3" fill="none" stroke-linecap="round" />
    <polygon points="135,152 131,157 137,159" fill="#38bdf8" />
    
    <path d="M 105 165 C 95 165 95 145 105 150" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 3" fill="none" stroke-linecap="round" />
    <polygon points="105,148 109,143 103,141" fill="#38bdf8" />
  </g>

  <!-- Foreground details to create depth -->
  <rect x="0" y="234" width="240" height="6" fill="#0f172a" />
</svg>