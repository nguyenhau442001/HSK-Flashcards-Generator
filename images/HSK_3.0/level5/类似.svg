<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="150" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Left Project (Project A) -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="60" height="70" rx="4" fill="#fb923c"/>
    <rect x="10" y="15" width="40" height="5" rx="2" fill="#fff"/>
    <rect x="10" y="30" width="40" height="5" rx="2" fill="#fff"/>
    <rect x="10" y="45" width="25" height="5" rx="2" fill="#fff"/>
  </g>
  
  <!-- Right Project (Project B) -->
  <g transform="translate(130, 80)">
    <rect x="0" y="0" width="60" height="70" rx="4" fill="#fbbf24"/>
    <rect x="10" y="15" width="40" height="5" rx="2" fill="#fff"/>
    <rect x="10" y="30" width="40" height="5" rx="2" fill="#fff"/>
    <rect x="10" y="45" width="25" height="5" rx="2" fill="#fff"/>
  </g>
  
  <!-- Character -->
  <g transform="translate(100, 160)">
    <circle cx="20" cy="-10" r="15" fill="#fef3c7"/>
    <path d="M10 -15 L15 -10 M25 -15 L30 -10" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M15 -5 Q20 -2 25 -5" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="5" y="5" width="30" height="40" rx="5" fill="#38bdf8"/>
    <rect x="0" y="45" width="10" height="20" rx="2" fill="#38bdf8"/>
    <rect x="30" y="45" width="10" height="20" rx="2" fill="#38bdf8"/>
  </g>
  
  <!-- Comparison Indicator -->
  <path d="M110 115 L130 115" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="115" r="6" fill="none" stroke="#ec4899" stroke-width="3"/>
  
  <!-- Ambient Decor -->
  <circle cx="200" cy="40" r="3" fill="#10b981"/>
  <circle cx="30" cy="30" r="2" fill="#38bdf8"/>
</svg>