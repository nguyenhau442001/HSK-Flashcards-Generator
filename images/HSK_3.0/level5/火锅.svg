<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window with snow -->
  <rect x="20" y="20" width="200" height="80" rx="4" fill="#334155"/>
  <circle cx="50" cy="40" r="3" fill="#f8fafc"/>
  <circle cx="120" cy="60" r="2" fill="#f8fafc"/>
  <circle cx="190" cy="35" r="3" fill="#f8fafc"/>
  <circle cx="80" cy="80" r="2" fill="#f8fafc"/>
  <circle cx="160" cy="75" r="3" fill="#f8fafc"/>
  
  <!-- Table -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#78350f"/>
  <rect x="60" y="150" width="10" height="80" fill="#451a03"/>
  <rect x="170" y="150" width="10" height="80" fill="#451a03"/>
  
  <!-- Hotpot Pot -->
  <ellipse cx="120" cy="140" rx="45" ry="25" fill="#991b1b"/>
  <ellipse cx="120" cy="125" rx="45" ry="10" fill="#dc2626"/>
  <path d="M90 135 Q120 160 150 135" fill="#f59e0b" opacity="0.6"/>
  
  <!-- Steam -->
  <path d="M100 120 Q90 100 105 80" stroke="#f1f5f9" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M120 120 Q120 90 130 70" stroke="#f1f5f9" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M140 120 Q150 100 145 80" stroke="#f1f5f9" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Characters -->
  <!-- Left Person -->
  <circle cx="70" cy="130" r="15" fill="#fde68a"/>
  <rect x="55" y="145" width="30" height="50" rx="5" fill="#38bdf8"/>
  <rect x="50" y="145" width="10" height="30" rx="2" fill="#fde68a"/>
  <rect x="80" y="145" width="10" height="30" rx="2" fill="#fde68a"/>
  
  <!-- Right Person -->
  <circle cx="170" cy="130" r="15" fill="#fde68a"/>
  <rect x="155" y="145" width="30" height="50" rx="5" fill="#ec4899"/>
  <rect x="150" y="145" width="10" height="30" rx="2" fill="#fde68a"/>
  <rect x="180" y="145" width="10" height="30" rx="2" fill="#fde68a"/>
  
  <!-- Chopsticks -->
  <rect x="95" y="120" width="2" height="30" fill="#fbbf24" transform="rotate(-20 95 120)"/>
  <rect x="145" y="120" width="2" height="30" fill="#fbbf24" transform="rotate(20 145 120)"/>
</svg>