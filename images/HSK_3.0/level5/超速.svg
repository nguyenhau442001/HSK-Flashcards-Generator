<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Road -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#475569" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- Speeding Car -->
  <g transform="translate(40, 140)">
    <path d="M10 40 L110 40 L100 15 L70 15 L55 0 L25 0 L10 40 Z" fill="#ec4899"/>
    <circle cx="30" cy="45" r="10" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="90" cy="45" r="10" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <rect x="40" y="5" width="35" height="15" rx="2" fill="#38bdf8" opacity="0.6"/>
  </g>
  
  <!-- Motion Lines -->
  <path d="M160 150 L200 140 M170 170 L220 160 M180 190 L230 185" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Warning Sign -->
  <g transform="translate(180, 50)">
    <path d="M20 0 L40 40 L0 40 Z" fill="#fbbf24"/>
    <path d="M20 10 L20 25 M20 32 L20 35" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Danger/Alert Glow -->
  <circle cx="200" cy="70" r="30" fill="#ec4899" opacity="0.15"/>
  
  <!-- Background Elements -->
  <rect x="20" y="80" width="10" height="60" fill="#475569"/>
  <rect x="100" y="90" width="10" height="50" fill="#475569"/>
  <rect x="180" y="100" width="10" height="40" fill="#475569"/>
</svg>