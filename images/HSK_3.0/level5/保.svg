<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="4"/>
  
  <!-- Character 1 (The Assurer) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24"/>
    <path d="M10 35 Q20 45 30 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="0" y="50" width="40" height="70" fill="#38bdf8" rx="5"/>
    <path d="M40 60 L60 80 L50 90 L30 70" fill="#fb923c"/>
  </g>
  
  <!-- Character 2 (The Receiver) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="20" fill="#e2e8f0"/>
    <path d="M10 35 Q20 30 30 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="0" y="50" width="40" height="70" fill="#ec4899" rx="5"/>
  </g>
  
  <!-- The Object (The Package) -->
  <rect x="100" y="170" width="40" height="30" fill="#10b981" rx="2"/>
  <path d="M100 175 L140 175" stroke="#064e3b" stroke-width="2"/>
  <path d="M120 170 L120 200" stroke="#064e3b" stroke-width="2"/>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="180" cy="30" r="2" fill="#fbbf24" opacity="0.4"/>
  <path d="M30 180 L50 180 M30 190 L45 190" stroke="#64748b" stroke-width="2"/>
  
  <!-- Gesture of Assurance -->
  <path d="M140 100 L120 120" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
</svg>