<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed container with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Room Wall (behind the character) -->
  <rect x="0" y="0" width="240" height="160" fill="#2d3a4b"/>

  <!-- Window with soft light -->
  <rect x="160" y="40" width="60" height="80" rx="8" fill="#4a5b70"/>
  <rect x="165" y="45" width="50" height="70" rx="6" fill="#60748b"/>
  <rect x="170" y="50" width="40" height="60" rx="4" fill="#fbbf24" opacity="0.3"/> <!-- Soft glow -->
  <path d="M190 45 L190 115 M165 80 L215 80" stroke="#4a5b70" stroke-width="2" stroke-linecap="round"/> <!-- Window frame details -->

  <!-- Desk -->
  <rect x="0" y="140" width="240" height="100" fill="#36475c"/>
  <rect x="20" y="130" width="200" height="20" rx="8" fill="#4a5b70"/> <!-- Desk surface -->

  <!-- Character (seated) -->
  <!-- Legs (partially hidden by desk) -->
  <rect x="80" y="160" width="20" height="40" rx="8" fill="#4a5b70"/>
  <rect x="140" y="160" width="20" height="40" rx="8" fill="#4a5b70"/>

  <!-- Body -->
  <rect x="70" y="90" width="100" height="60" rx="12" fill="#10b981"/> <!-- Shirt/Sweater -->

  <!-- Head -->
  <circle cx="120" cy="70" r="25" fill="#fbd38d"/> <!-- Skin tone -->
  <!-- Hair -->
  <path d="M100 50 C90 40 110 30 130 50 C140 60 145 70 140 80 C130 90 110 90 100 80 Z" fill="#2d3a4b"/>
  <!-- Eyes -->
  <circle cx="110" cy="65" r="3" fill="#0f172a"/>
  <circle cx="130" cy="65" r="3" fill="#0f172a"/>
  <!-- Smile -->
  <path d="M110 78 Q120 85 130 78" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Arms -->
  <rect x="60" y="100" width="20" height="40" rx="8" fill="#fbd38d"/> <!-- Left arm -->
  <rect x="160" y="100" width="20" height="40" rx="8" fill="#fbd38d"/> <!-- Right arm -->

  <!-- Laptop on desk -->
  <rect x="80" y="105" width="80" height="50" rx="6" fill="#2d3a4b"/> <!-- Laptop base -->
  <rect x="85" y="80" width="70" height="45" rx="4" fill="#38bdf8"/> <!-- Laptop screen (glowing blue) -->
  <rect x="85" y="80" width="70" height="45" rx="4" fill="#38bdf8" opacity="0.2"/> <!-- Screen glow effect -->

  <!-- Small plant on desk -->
  <rect x="30" y="120" width="15" height="15" rx="4" fill="#fb923c"/> <!-- Pot -->
  <path d="M37 120 L35 110 C36 105 40 105 41 110 L39 120 Z" fill="#10b981"/> <!-- Left leaf -->
  <path d="M43 120 L41 110 C42 105 46 105 47 110 L45 120 Z" fill="#10b981"/> <!-- Right leaf -->

  <!-- Coffee mug -->
  <rect x="190" y="105" width="15" height="15" rx="4" fill="#f59e0b"/> <!-- Mug body -->
  <path d="M205 110 A5 5 0 0 1 205 120" stroke="#f59e0b" stroke-width="2" fill="none"/> <!-- Handle -->
  <circle cx="197.5" cy="105" r="7.5" fill="#f59e0b" opacity="0.5"/> <!-- Steam/warmth indicator -->

  <!-- Subtle glow around the character/work area to emphasize "good mental state" -->
  <circle cx="120" cy="120" r="70" fill="#fbbf24" opacity="0.05"/>
</svg>