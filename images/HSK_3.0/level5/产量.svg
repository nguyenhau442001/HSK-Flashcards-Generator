<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Sun/Sky -->
  <circle cx="190" cy="50" r="20" fill="#fbbf24"/>
  
  <!-- Field Background -->
  <path d="M0 160 Q 120 140 240 160 L 240 240 L 0 240 Z" fill="#10b981" opacity="0.6"/>
  <path d="M0 180 Q 120 160 240 180 L 240 240 L 0 240 Z" fill="#059669"/>
  
  <!-- Wheat Stalks (High Yield) -->
  <g fill="#f59e0b">
    <rect x="20" y="150" width="4" height="60" rx="2"/>
    <ellipse cx="22" cy="145" rx="8" ry="12"/>
    <rect x="50" y="140" width="4" height="70" rx="2"/>
    <ellipse cx="52" cy="135" rx="10" ry="15"/>
    <rect x="90" y="130" width="5" height="80" rx="2"/>
    <ellipse cx="92" cy="125" rx="12" ry="18"/>
    <rect x="140" y="140" width="4" height="70" rx="2"/>
    <ellipse cx="142" cy="135" rx="10" ry="15"/>
    <rect x="180" y="150" width="4" height="60" rx="2"/>
    <ellipse cx="182" cy="145" rx="8" ry="12"/>
  </g>
  
  <!-- Farmer Character -->
  <g transform="translate(160, 150)">
    <!-- Body -->
    <path d="M-10 80 L 10 80 L 15 40 L -15 40 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="25" r="15" fill="#fb923c"/>
    <!-- Hat -->
    <path d="M-25 20 L 25 20 L 0 -5 Z" fill="#ec4899"/>
    <!-- Arm -->
    <path d="M15 45 L 35 60" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand holding wheat -->
    <circle cx="35" cy="60" r="6" fill="#f59e0b"/>
  </g>
  
  <!-- Basket of Harvest -->
  <path d="M10 200 L 50 200 L 45 230 L 15 230 Z" fill="#92400e"/>
  <ellipse cx="30" cy="200" rx="20" ry="6" fill="#b45309"/>
  
  <!-- Decorative highlights -->
  <circle cx="200" cy="190" r="3" fill="#fbbf24"/>
  <circle cx="210" cy="180" r="2" fill="#fbbf24"/>
</svg>