<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Office Desk -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="50" y="150" width="10" height="80" fill="#334155"/>
  <rect x="180" y="150" width="10" height="80" fill="#334155"/>
  
  <!-- Character (The Agent) -->
  <circle cx="120" cy="90" r="25" fill="#fde68a"/>
  <path d="M95 115 Q120 140 145 115" fill="#fde68a"/>
  <rect x="90" y="130" width="60" height="60" rx="10" fill="#38bdf8"/>
  
  <!-- Product Samples (The Brand) -->
  <rect x="60" y="110" width="20" height="30" rx="2" fill="#ec4899"/>
  <rect x="160" y="110" width="20" height="30" rx="2" fill="#ec4899"/>
  <circle cx="170" cy="125" r="5" fill="#ffffff"/>
  <circle cx="70" cy="125" r="5" fill="#ffffff"/>
  
  <!-- Hand gesturing towards products -->
  <path d="M145 140 L165 130" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  <path d="M95 140 L75 130" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="30" cy="50" r="2" fill="#10b981"/>
  <path d="M200 180 L220 160" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Laptop/Display -->
  <rect x="100" y="145" width="40" height="25" rx="2" fill="#f1f5f9"/>
  <rect x="105" y="148" width="30" height="15" fill="#0f172a"/>
</svg>