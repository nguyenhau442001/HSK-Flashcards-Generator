<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Stadium/Track Lighting Gradients -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Trophy Gradients -->
    <linearGradient id="cupGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <linearGradient id="cupShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Track Gradients -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Stadium Lighting & Atmosphere -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>
  
  <!-- Speed Lines / Action Dashes Background -->
  <g opacity="0.3">
    <line x1="20" y1="180" x2="80" y2="180" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 15"/>
    <line x1="160" y1="195" x2="220" y2="195" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 12"/>
    <line x1="10" y1="205" x2="70" y2="205" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 10"/>
    <line x1="150" y1="170" x2="210" y2="170" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-dasharray="15 8"/>
  </g>

  <!-- Running Track Curve (Context) -->
  <path d="M -20,220 C 40,160 200,160 260,220" fill="none" stroke="#1e293b" stroke-width="40"/>
  <path d="M -20,210 C 50,155 190,155 260,210" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 8"/>
  <path d="M -20,225 C 50,170 190,170 260,225" fill="none" stroke="#0284c7" stroke-width="3" opacity="0.6"/>

  <!-- Confetti / Victory Particles -->
  <g>
    <circle cx="50" cy="70" r="3" fill="#fbbf24"/>
    <rect x="180" y="60" width="6" height="4" rx="1" fill="#f43f5e" transform="rotate(25 180 60)"/>
    <circle cx="195" cy="110" r="2.5" fill="#38bdf8"/>
    <rect x="40" y="110" width="5" height="5" rx="1" fill="#10b981" transform="rotate(45 40 110)"/>
    <polygon points="110,35 113,42 120,43 115,48 116,55 110,51 104,55 105,48 100,43 107,42" fill="#fbbf24" transform="scale(0.6) translate(60, 20)"/>
    <circle cx="140" cy="40" r="2" fill="#ec4899"/>
  </g>

  <!-- Giant Glowing Record Trophy (The Core Concept of "Kỷ Lục" / Record) -->
  <!-- Golden Base and Pedestal -->
  <g transform="translate(120, 135)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="70" rx="35" ry="12" fill="#020617" opacity="0.6"/>
    
    <!-- Base -->
    <path d="M -22,60 L 22,60 L 16,72 L -16,72 Z" fill="#475569"/>
    <path d="M -26,54 L 26,54 L 22,60 L -22,60 Z" fill="#64748b"/>
    <rect x="-14" y="44" width="28" height="10" fill="#334155" rx="2"/>

    <!-- Trophy Stem -->
    <rect x="-6" y="28" width="12" height="18" fill="url(#cupGold)" rx="2"/>
    <circle cx="0" cy="37" r="8" fill="#d97706" opacity="0.3"/>

    <!-- Trophy Cup Body (Vivid 3D Effect) -->
    <path d="M -32,-20 
             C -32,25 32,25 32,-20 
             C 32,-35 -32,-35 -32,-20 Z" 
          fill="url(#cupGold)"/>

    <!-- Cup Rim -->
    <ellipse cx="0" cy="-20" rx="32" ry="7" fill="#fef08a"/>
    <ellipse cx="0" cy="-20" rx="28" ry="5" fill="#d97706"/>

    <!-- Cup Inner Depth -->
    <ellipse cx="0" cy="-21" rx="26" ry="4" fill="#b45309"/>

    <!-- Cup Handles -->
    <path d="M -28,-15 C -45,-15 -45,10 -28,8" fill="none" stroke="url(#cupGold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 28,-15 C 45,-15 45,10 28,8" fill="none" stroke="url(#cupGold)" stroke-width="6" stroke-linecap="round"/>

    <!-- Cup Surface Shine Overlay -->
    <path d="M -15,-28 C -5,-28 -2,-10 -5,15 C -15,15 -22,-5 -15,-28 Z" fill="url(#cupShine)"/>

    <!-- Star Emblem on Trophy (Signifying Top Record) -->
    <polygon points="0,-3 3,4 10,4 5,8 7,15 0,11 -7,15 -5,8 -10,4 -3,4" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Action Runner / Athlete Breaking Through the Finish Line (Context of Breaking a Record) -->
  <g transform="translate(120, 115)">
    <!-- Finish Line Tape Being Broken -->
    <!-- Left Tape fragment -->
    <path d="M -120,-10 L -45,-25 L -42,-15 L -115,0 Z" fill="#f43f5e" opacity="0.9"/>
    <path d="M -120,-10 L -45,-25 L -42,-15 L -115,0 Z" fill="url(#goldGlow)" opacity="0.3"/>
    <!-- Right Tape fragment -->
    <path d="M 45,-35 L 120,-20 L 115,-10 L 42,-25 Z" fill="#f43f5e" opacity="0.9"/>

    <!-- Speed Lines behind Runner -->
    <path d="M -35,-20 L -65,-25" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M -25,0 L -55,-5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Dynamic Runner Silhouette/Character Bursting Through -->
    <g transform="translate(-10, -10) scale(0.9)">
      <!-- Head and Motion Lines -->
      <circle cx="-5" cy="-22" r="8" fill="#f8fafc"/>
      <path d="M -14,-26 C -20,-28 -22,-22 -20,-18" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Torso (Lean Forward Action) -->
      <path d="M 0,-15 L -12,-5 L -2,15 L 8,5 Z" fill="#38bdf8"/>
      <path d="M -4,-12 L -10,-8 L -2,10 L 4,6 Z" fill="#0284c7"/>

      <!-- Arms pumping -->
      <!-- Back Arm -->
      <path d="M -12,-10 L -25,-20 L -30,-12" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Front Arm (Punching Forward to break tape) -->
      <path d="M 0,-10 L 22,-25 L 35,-22" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Legs in mid-stride -->
      <path d="M -2,15 L -18,28 L -28,25" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 4,10 L 18,22 L 28,15" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Ribbon Break Explosion FX -->
    <circle cx="-43" cy="-20" r="4" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="43" cy="-30" r="4" fill="#ffffff" filter="url(#glow)"/>
    <path d="M -45,-30 L -55,-40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M -43,-18 L -55,-12" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <path d="M 45,-30 L 58,-42" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 43,-22 L 55,-15" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Stopwatch / Timing Element (Representing time record/stats) -->
  <g transform="translate(42, 65)">
    <!-- Watch Body -->
    <circle cx="0" cy="0" r="18" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a"/>
    <!-- Watch top knob -->
    <rect x="-3" y="-21" width="6" height="5" fill="#64748b" rx="1"/>
    <rect x="-6" y="-24" width="12" height="3" fill="#94a3b8" rx="1"/>
    <!-- Watch hands -->
    <line x1="0" y1="0" x2="6" y2="-6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4" y2="5" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#fbbf24"/>
    <!-- Glow pulse -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" filter="url(#glow)"/>
  </g>

  <!-- Glowing Digital Record Display / Achievement Star on the Right -->
  <g transform="translate(198, 75)">
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="0,-9 2,-3 8,-3 3,1 5,7 0,4 -5,7 -3,1 -8,-3 -2,-3" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <!-- Sparkles and Ambient Lighting -->
  <g fill="#ffffff">
    <path d="M 75,45 Q 75,55 65,55 Q 75,55 75,65 Q 75,55 85,55 Q 75,55 75,45 Z" opacity="0.8"/>
    <path d="M 165,115 Q 165,122 158,122 Q 165,122 165,129 Q 165,122 172,122 Q 165,122 165,115 Z" opacity="0.9" fill="#fbbf24"/>
    <path d="M 90,195 Q 90,200 85,200 Q 90,200 90,205 Q 90,200 95,200 Q 90,200 90,195 Z" opacity="0.6"/>
  </g>

  <!-- Foreground Vignette Frame (Smooth rounded app card border) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>