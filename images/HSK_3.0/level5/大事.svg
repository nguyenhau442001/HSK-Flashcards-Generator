<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Elements -->
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.1"/>
  <path d="M40 180 L200 180" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Groom -->
  <g transform="translate(70, 100)">
    <path d="M20 100 L20 140 M40 100 L40 140" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="10" y="50" width="40" height="50" rx="5" fill="#38bdf8"/>
    <circle cx="30" cy="30" r="20" fill="#fde68a"/>
    <path d="M20 25 L25 30 M35 25 L30 30" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Bride -->
  <g transform="translate(130, 90)">
    <path d="M10 110 L0 150 M40 110 L50 150" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 110 Q25 140 45 110" fill="#ec4899"/>
    <circle cx="25" cy="30" r="20" fill="#fde68a"/>
    <path d="M15 25 L20 30 M35 25 L30 30" stroke="#1e293b" stroke-width="2"/>
    <path d="M10 15 Q25 0 40 15" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Symbolic "Big Event" Ring -->
  <g transform="translate(120, 180)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#fb923c" stroke-width="6"/>
    <circle cx="0" cy="0" r="5" fill="#fb923c"/>
  </g>
  
  <!-- Confetti/Celebration -->
  <circle cx="50" cy="70" r="3" fill="#10b981"/>
  <circle cx="190" cy="90" r="3" fill="#38bdf8"/>
  <circle cx="160" cy="50" r="3" fill="#ec4899"/>
</svg>