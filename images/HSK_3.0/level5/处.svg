<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Office/Shared Space -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="4"/>
  <circle cx="180" cy="80" r="30" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Main Character (The "easy to get along with" guy) -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="-30" r="15" fill="#fb923c"/>
    <path d="M-10 -20 Q0 -10 10 -20" stroke="#fff" stroke-width="2" fill="none"/>
    <rect x="-25" y="-15" width="50" height="40" rx="10" fill="#38bdf8"/>
    <rect x="-30" y="-15" width="10" height="30" rx="3" fill="#38bdf8"/>
    <rect x="20" y="-15" width="10" height="30" rx="3" fill="#38bdf8"/>
    <rect x="-15" y="25" width="10" height="30" rx="3" fill="#fb923c"/>
    <rect x="5" y="25" width="10" height="30" rx="3" fill="#fb923c"/>
  </g>

  <!-- Surrounding people (The group liking him) -->
  <g transform="translate(60, 140)">
    <circle cx="0" cy="-20" r="10" fill="#10b981"/>
    <rect x="-12" y="-10" width="24" height="30" rx="5" fill="#ec4899"/>
  </g>

  <g transform="translate(180, 140)">
    <circle cx="0" cy="-20" r="10" fill="#10b981"/>
    <rect x="-12" y="-10" width="24" height="30" rx="5" fill="#ec4899"/>
  </g>
  
  <!-- Interaction Props -->
  <path d="M90 110 Q105 100 120 110" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="105" cy="100" r="3" fill="#fbbf24"/>
  <circle cx="135" cy="100" r="3" fill="#fbbf24"/>
  
  <!-- Coffee Mugs on table -->
  <rect x="40" y="170" width="15" height="20" rx="2" fill="#f59e0b"/>
  <rect x="185" y="170" width="15" height="20" rx="2" fill="#f59e0b"/>
</svg>