<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Tailor Shop / Boutique -->
  <rect x="40" y="50" width="160" height="150" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="60" y="70" width="120" height="120" rx="2" fill="#0f172a"/>
  
  <!-- Subject: The Observer -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="12" fill="#fb923c"/>
    <path d="M10 40 Q20 35 30 40 L25 80 L15 80 Z" fill="#38bdf8"/>
    <path d="M15 80 L10 120 M35 80 L40 120" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 45 L20 75" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2"/>
  </g>

  <!-- Subject: The Person being looked at -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="12" fill="#ec4899"/>
    <path d="M5 35 L35 35 L30 100 L10 100 Z" fill="#f59e0b"/>
    <path d="M10 100 L5 130 M30 100 L35 130" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Visual indicator of "scanning" (上下) -->
  <path d="M95 90 L115 90 M95 180 L115 180" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M105 90 L105 180" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="220" cy="60" r="2" fill="#fbbf24"/>
  <circle cx="30" cy="200" r="4" fill="#38bdf8"/>
</svg>