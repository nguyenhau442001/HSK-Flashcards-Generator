<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Hologram / Energy Glow Gradient -->
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Amber Accent Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light Effect -->
  <circle cx="120" cy="110" r="90" fill="url(#amberGlow)"/>

  <!-- SCENE: Modern Tech-Enabled Office / Command Center (Representing 'áp dụng, tiến hành' - putting a new method/measure into action) -->
  
  <!-- Desk Base / Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2"/>

  <!-- Environmental Props: Coffee Cup -->
  <g transform="translate(190, 160)" filter="url(#shadow)">
    <!-- Saucer -->
    <ellipse cx="15" cy="15" rx="14" ry="5" fill="#475569"/>
    <!-- Cup Body -->
    <path d="M 7 5 L 23 5 L 21 17 C 21 19 19 20 17 20 L 13 20 C 11 20 9 19 9 17 Z" fill="#f8fafc"/>
    <!-- Handle -->
    <path d="M 21 8 C 24 8 25 11 23 14" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 12 1 C 13 -1 11 -3 12 -5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Environmental Props: Plant -->
  <g transform="translate(25, 140)" filter="url(#shadow)">
    <!-- Pot -->
    <path d="M 6 15 L 18 15 L 20 30 L 4 30 Z" fill="#64748b"/>
    <ellipse cx="12" cy="15" rx="6" ry="2" fill="#475569"/>
    <!-- Leaves -->
    <path d="M 12 15 Q 12 5 2 2 Q 10 10 12 15 Z" fill="#10b981"/>
    <path d="M 12 15 Q 18 2 22 -2 Q 16 8 12 15 Z" fill="#059669"/>
    <path d="M 12 15 Q 8 2 12 -6 Q 14 6 12 15 Z" fill="#34d399"/>
  </g>

  <!-- Main Object: Holographic Strategy / Action Board (Projecting "new measures") -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Hologram Base Projector -->
    <path d="M 25 115 L 95 115 L 105 125 L 15 125 Z" fill="#334155"/>
    <ellipse cx="60" cy="115" rx="35" ry="5" fill="#1e293b"/>
    <!-- Projector Glowing Core -->
    <ellipse cx="60" cy="115" rx="20" ry="2.5" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Holographic Beam Cone -->
    <polygon points="60,115 5,45 115,45" fill="url(#holoGrad)" opacity="0.4"/>

    <!-- Floating UI Dashboard / Action Plan Screen -->
    <g transform="translate(10, 20)">
      <!-- Main Screen Frame -->
      <rect x="0" y="0" width="100" height="90" rx="8" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      
      <!-- UI Header -->
      <rect x="10" y="10" width="80" height="12" rx="4" fill="#0f172a" opacity="0.6"/>
      <circle cx="16" cy="16" r="3" fill="#ef4444"/>
      <circle cx="26" cy="16" r="3" fill="#f59e0b"/>
      <circle cx="36" cy="16" r="3" fill="#10b981"/>

      <!-- Action Graph / Metrics (Representing 'implementation/execution') -->
      <polyline points="15,70 35,55 55,62 85,30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="85" cy="30" r="4" fill="#fb923c" filter="url(#glow)"/>

      <!-- Process Steps / Checkmarks -->
      <rect x="15" y="30" width="12" height="12" rx="3" fill="#10b981" opacity="0.8"/>
      <path d="M 17 36 L 20 39 L 25 33" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="36" x2="65" y2="36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

      <rect x="15" y="46" width="12" height="12" rx="3" fill="#10b981" opacity="0.8"/>
      <path d="M 17 52 L 20 55 L 25 49" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="52" x2="55" y2="52" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Action Hand / Pointer tapping/executing the plan -->
    <g transform="translate(80, 80)" filter="url(#shadow)">
      <!-- Arm / Cuff -->
      <path d="M 20 40 L 40 20" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>
      <!-- Hand / Finger -->
      <circle cx="15" cy="15" r="10" fill="#fcd34d"/>
      <path d="M 12 10 L 4 5" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating Success / Execution Sparkles -->
  <g transform="translate(170, 60)" filter="url(#glow)">
    <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(45, 90)" filter="url(#glow)">
    <path d="M 0 6 L 12 6 M 6 0 L 6 12" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(140, 30)" filter="url(#glow)">
    <circle cx="5" cy="5" r="3" fill="#10b981"/>
  </g>

</svg>