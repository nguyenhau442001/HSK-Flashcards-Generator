<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Soil Gradient (土地) -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Background Scenery (Mountains, Sun, Clouds) -->
  <g id="background_scenery">
    <!-- Warm Sun -->
    <circle cx="180" cy="85" r="45" fill="url(#sunGlow)"/>
    <circle cx="180" cy="85" r="20" fill="#fbbf24"/>

    <!-- Distant Mountains -->
    <polygon points="0,140 60,95 130,135 200,100 240,125 240,150 0,150" fill="#334155" opacity="0.6"/>
    <polygon points="40,150 110,105 170,140 240,110 240,150 0,150" fill="#475569" opacity="0.8"/>

    <!-- Soft Cloud -->
    <path d="M40,60 Q45,52 55,55 Q65,48 78,55 Q88,52 92,62 Q100,62 100,70 Q100,78 92,78 L40,78 Q32,78 32,70 Q32,62 40,60 Z" fill="#64748b" opacity="0.4"/>
  </g>

  <!-- Rich Foreground Environment (土地 - Soil, Crops, Farming) -->
  <g id="earth_and_crops">
    <!-- Sloping Agricultural Field / Rich Soil -->
    <path d="M0,140 Q120,130 240,145 L240,240 L0,240 Z" fill="url(#soilGrad)"/>

    <!-- Furrows / Tilled Rows (Contour lines on 土地) -->
    <path d="M-10,165 Q70,155 250,175" stroke="#78350f" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M-10,190 Q80,180 250,205" stroke="#451a03" stroke-width="5" fill="none" opacity="0.7"/>
    <path d="M-10,215 Q90,205 250,235" stroke="#451a03" stroke-width="6" fill="none" opacity="0.8"/>

    <!-- Sprouting Crops (象征土地生命力 - Living off the land) -->
    <!-- Left Sprouts -->
    <path d="M30,155 Q35,140 30,130 M30,155 Q25,142 20,138" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="128" r="3" fill="#34d399"/>
    
    <path d="M60,162 Q65,148 62,138 M60,162 Q55,150 50,145" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="62" cy="136" r="3.5" fill="#34d399"/>

    <path d="M95,170 Q100,155 95,145" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="95" cy="142" r="4" fill="#34d399"/>

    <!-- Right Sprouts near Farmer -->
    <path d="M175,185 Q180,170 176,160" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="176" cy="158" r="3" fill="#34d399"/>

    <path d="M210,195 Q215,182 210,172" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="210" cy="170" r="3" fill="#34d399"/>
  </g>

  <!-- Expressive Farmer Character (农民) -->
  <g id="farmer_character" transform="translate(0, 5)">
    <!-- Shadow beneath character -->
    <ellipse cx="140" cy="192" rx="25" ry="6" fill="#0f172a" opacity="0.5"/>

    <!-- Traditional Straw Hat (斗笠) -->
    <ellipse cx="138" cy="118" rx="32" ry="11" fill="#d97706"/>
    <ellipse cx="138" cy="116" rx="30" ry="9" fill="#fbbf24"/>
    <path d="M115,116 Q138,98 161,116 Z" fill="#d97706"/>

    <!-- Head & Face (Smiling, hardworking expression) -->
    <circle cx="138" cy="125" rx="13" ry="14" fill="#fcd34d"/>
    <!-- Rosy cheeks -->
    <circle cx="131" cy="130" r="2.5" fill="#f43f5e" opacity="0.6"/>
    <circle cx="145" cy="130" r="2.5" fill="#f43f5e" opacity="0.6"/>
    <!-- Eyes (Happy curved lines) -->
    <path d="M133,123 Q136,126 138,123" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M141,123 Q144,126 146,123" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Gentle Smile -->
    <path d="M136,132 Q139,135 142,132" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Torso (Blue tunic typical of farmers) -->
    <path d="M122,140 L154,140 C160,155 158,180 155,190 L121,190 C118,180 116,155 122,140 Z" fill="#0284c7"/>
    <!-- Collar -->
    <path d="M132,140 L138,147 L144,140 Z" fill="#e0f2fe"/>
    <!-- Red Scarf / Towel around neck -->
    <path d="M126,143 Q138,150 150,143 Q152,148 145,152 Q138,154 131,152 Q124,148 126,143 Z" fill="#ef4444"/>

    <!-- Arms & Farming Tool (Hoe / 锄头) -->
    <!-- Left arm holding hoe handle -->
    <path d="M122,145 Q105,155 100,165" stroke="#0284c7" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Right arm guiding hoe -->
    <path d="M154,145 Q168,155 160,168" stroke="#0284c7" stroke-width="7" stroke-linecap="round" fill="none"/>
    
    <!-- Hands -->
    <circle cx="98" cy="167" r="4" fill="#fcd34d"/>
    <circle cx="158" cy="170" r="4" fill="#fcd34d"/>

    <!-- Hoe Tool (农具) -->
    <!-- Wooden Handle -->
    <line x1="80" y1="130" x2="115" y2="195" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <!-- Metal Blade -->
    <path d="M72,123 L85,127 L80,137 L67,133 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Legs (Pants) -->
    <path d="M126,188 L122,212 C122,215 126,216 128,212 L134,188 Z" fill="#0369a1"/>
    <path d="M150,188 L156,212 C156,215 152,216 150,212 L144,188 Z" fill="#0369a1"/>
    <!-- Shoes / Boots -->
    <path d="M118,213 L130,213 C132,213 133,217 130,218 L116,218 C114,218 116,213 118,213 Z" fill="#334155"/>
    <path d="M148,213 L160,213 C162,213 164,218 160,218 L146,218 C144,218 146,213 148,213 Z" fill="#334155"/>
  </g>

  <!-- Foreground Basket with Harvest (Showing reward of working the land) -->
  <g id="harvest_basket" transform="translate(60, 165)">
    <!-- Basket Body -->
    <path d="M10,15 L25,45 L55,45 L70,15 Z" fill="#b45309" stroke="#78350f" stroke-width="2" stroke-linejoin="round"/>
    <!-- Basket Rim -->
    <ellipse cx="40" cy="15" rx="30" ry="6" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <!-- Vegetables / Pumpkins inside basket -->
    <circle cx="30" cy="14" r="9" fill="#f97316"/>
    <circle cx="48" cy="12" r="11" fill="#fbbf24"/>
    <circle cx="40" cy="8" r="8" fill="#10b981"/>
  </g>

  <!-- Ambient lighting / warmth overlay for app illustration quality -->
  <circle cx="180" cy="40" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="210" cy="65" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="30" cy="90" r="2.5" fill="#ffffff" opacity="0.5"/>
</svg>