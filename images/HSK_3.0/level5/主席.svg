<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#1e293b" />
    </linearGradient>
    <radialGradient id="spotlight" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed container with gradient background -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)" />

  <!-- Subtle background elements to suggest a room/hall -->
  <rect x="20" y="40" width="200" height="100" fill="#2d3a4b" rx="10" /> <!-- Wall panel / screen -->
  <rect x="30" y="50" width="180" height="80" fill="#3a4b5d" rx="8" /> <!-- Inner screen / detail -->

  <!-- Stage / Platform -->
  <rect x="0" y="160" width="240" height="80" fill="#334155" />
  <path d="M0 160 L240 160 L240 170 L0 170 Z" fill="#475569" /> <!-- Stage edge highlight -->

  <!-- Podium -->
  <rect x="95" y="100" width="50" height="70" fill="#475569" rx="8" />
  <rect x="90" y="90" width="60" height="15" fill="#64748b" rx="4" />
  <rect x="98" y="105" width="44" height="58" fill="#525f75" rx="4" />

  <!-- Microphone -->
  <circle cx="120" cy="85" r="4" fill="#94a3b8" />
  <rect x="118" y="85" width="4" height="10" fill="#94a3b8" rx="2" />

  <!-- Main Character (Chairman) -->
  <!-- Body -->
  <rect x="105" y="115" width="30" height="45" fill="#38bdf8" rx="8" />
  <!-- Head -->
  <circle cx="120" cy="95" r="15" fill="#fbbf24" />
  <!-- Hair -->
  <path d="M108 85 C105 80 110 75 120 75 C130 75 135 80 132 85 Z" fill="#475569" />
  <!-- Arms (raised slightly, confident pose) -->
  <rect x="95" y="120" width="10" height="30" fill="#38bdf8" rx="5" />
  <rect x="135" y="120" width="10" height="30" fill="#38bdf8" rx="5" />
  <!-- Hands -->
  <circle cx="100" cy="145" r="5" fill="#fbbf24" />
  <circle cx="140" cy="145" r="5" fill="#fbbf24" />

  <!-- Audience / Applauding Figures (simplified) -->
  <!-- Left figure -->
  <rect x="30" y="160" width="20" height="30" fill="#10b981" rx="5" />
  <circle cx="40" cy="150" r="10" fill="#fb923c" />
  <path d="M35 175 L45 175 C48 170 48 165 45 160 L35 160 C32 165 32 170 35 175 Z" fill="#fb923c" /> <!-- Applauding hands -->

  <!-- Right figure -->
  <rect x="190" y="160" width="20" height="30" fill="#ec4899" rx="5" />
  <circle cx="200" cy="150" r="10" fill="#f59e0b" />
  <path d="M195 175 L205 175 C208 170 208 165 205 160 L195 160 C192 165 192 170 195 175 Z" fill="#f59e0b" /> <!-- Applauding hands -->

  <!-- Spotlight effect on the chairman -->
  <circle cx="120" cy="110" r="60" fill="url(#spotlight)" />
</svg>