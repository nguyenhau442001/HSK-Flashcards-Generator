<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Elements -->
  <rect x="30" y="60" width="180" height="120" rx="10" fill="#334155" opacity="0.5"/>
  <circle cx="180" cy="90" r="15" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Character A (The Sender) -->
  <g transform="translate(40, 100)">
    <path d="M20 120 L20 80 Q20 60 40 60 L60 60 Q80 60 80 80 L80 120" fill="#38bdf8"/>
    <circle cx="50" cy="45" r="20" fill="#fde68a"/>
    <path d="M40 40 L45 45 M55 40 L50 45" stroke="#1e293b" stroke-width="2"/>
    <path d="M42 52 Q50 55 58 52" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Character B (The Messenger) -->
  <g transform="translate(120, 100)">
    <path d="M20 120 L20 80 Q20 60 40 60 L60 60 Q80 60 80 80 L80 120" fill="#fb923c"/>
    <circle cx="50" cy="45" r="20" fill="#fde68a"/>
    <path d="M40 40 L45 45 M55 40 L50 45" stroke="#1e293b" stroke-width="2"/>
    <path d="M42 52 Q50 55 58 52" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Hand gesture towards the other -->
    <path d="M15 70 L-10 60" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Symbolic representation of the message (Gift/Greeting) -->
  <rect x="100" y="70" width="20" height="20" rx="4" fill="#ec4899"/>
  <path d="M110 70 L110 90 M100 80 L120 80" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Decorative accents -->
  <circle cx="190" cy="180" r="5" fill="#10b981"/>
  <circle cx="20" cy="190" r="8" fill="#fbbf24"/>
</svg>