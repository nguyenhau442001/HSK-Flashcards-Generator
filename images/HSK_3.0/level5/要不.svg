<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Subtle background glow from cafe/restaurant window -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  
  <!-- Window / Cafe Exterior context background -->
  <path d="M40 40 H200 V180 H40 Z" fill="#1a2234" rx="8"/>
  <rect x="55" y="55" width="55" height="75" rx="4" fill="#253248" opacity="0.5"/>
  <rect x="130" y="55" width="55" height="75" rx="4" fill="#253248" opacity="0.5"/>
  <path d="M90 70 L95 85 H85 Z" fill="#3b82f6" opacity="0.3"/> <!-- outside neon sign hint -->

  <!-- Hanging warm cafe pendant lights -->
  <path d="M90 20 V50" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M75 50 H105 L100 65 H80 Z" fill="#f59e0b" opacity="0.9"/>
  <path d="M150 20 V40" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M138 40 H162 L158 50 H142 Z" fill="#f59e0b" opacity="0.9"/>

  <!-- Table and Props -->
  <!-- Table surface (wooden oval) -->
  <ellipse cx="120" cy="175" rx="85" ry="25" fill="#334155"/>
  <ellipse cx="120" cy="172" rx="80" ry="22" fill="#475569"/>
  
  <!-- Closed menu / Crossed arms prop -> Indicating 'full' or 'waiting too long' -->
  <rect x="100" y="160" width="40" height="8" rx="2" fill="#64748b"/>
  <!-- Empty/Unsatisfied coffee mugs -->
  <rect x="75" y="155" width="12" height="15" rx="2" fill="#f8fafc"/>
  <path d="M87 159 C91 159 91 167 87 167" stroke="#f8fafc" stroke-width="2" fill="none"/>
  
  <rect x="150" y="158" width="12" height="15" rx="2" fill="#f8fafc"/>
  <path d="M162 162 C166 162 166 170 162 170" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <!-- Steam rising from cups (indicating long wait) -->
  <path d="M79 148 C81 144 79 140 81 136" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M154 150 C156 146 154 142 156 138" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Character 1 (Left): Proposing to change place (hand gesturing outwards) -->
  <!-- Body/Torso -->
  <path d="M60 180 C60 140 75 130 95 130 C105 130 110 145 110 180 Z" fill="#3b82f6"/>
  <!-- Head -->
  <circle cx="85" cy="112" r="16" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M69 110 C70 98 90 95 101 104 C100 110 102 115 102 115 C95 110 80 110 73 118 Z" fill="#1e293b"/>
  <!-- Face expression (active talking/suggesting) -->
  <circle cx="91" cy="112" r="1.5" fill="#1e293b"/>
  <path d="M92 118 C94 120 96 118 97 117" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- slight smile -->
  <!-- Arm gesturing "Hay là đi chỗ khác" (pointing sideways/outwards) -->
  <path d="M70 140 L45 130 L40 120" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hand -->
  <circle cx="38" cy="117" r="4" fill="#fbcfe8"/>

  <!-- Character 2 (Right): Agreeing / Looking around -->
  <!-- Body/Torso -->
  <path d="M180 180 C180 140 165 130 145 130 C135 130 130 145 130 180 Z" fill="#10b981"/>
  <!-- Head -->
  <circle cx="155" cy="112" r="16" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M140 110 C140 98 160 95 171 104 C170 110 172 115 172 115 C165 110 150 110 143 118 Z" fill="#b45309"/>
  <!-- Face expression (thoughtful/nodding) -->
  <circle cx="151" cy="112" r="1.5" fill="#1e293b"/>
  <path d="M149 118 C151 119 153 119 155 117" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Arm resting on chin/pondering gesture -->
  <path d="M165 145 L155 130 L152 118" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hand near chin -->
  <circle cx="151" cy="116" r="3.5" fill="#fbcfe8"/>

  <!-- Action lines / subtle context elements: direction indicators (change of venue concept) -->
  <path d="M108 95 C115 88 125 88 132 95" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="3 3"/>
  <polygon points="132,93 136,96 130,98" fill="#fbbf24"/>

  <!-- Vignette overlay for depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>