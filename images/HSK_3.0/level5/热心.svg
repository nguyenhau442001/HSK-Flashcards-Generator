<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for "Rèxīn" (Heartfelt Warmth/Enthusiasm) -->
    <radialGradient id="warm-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweater-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="apron-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Heart/Passion Symbol Glow -->
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <filter id="glow-effect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Enthusiasm Light -->
  <circle cx="120" cy="110" r="100" fill="url(#warm-glow)"/>

  <!-- SCENE ENVIRONMENT: Community Café / Helping Hub Background Details -->
  <!-- Wooden Back Shelf & Props -->
  <rect x="35" y="45" width="170" height="6" rx="3" fill="#334155"/>
  <rect x="50" y="25" width="20" height="20" rx="4" fill="#059669" opacity="0.6"/>
  <rect x="75" y="18" width="16" height="27" rx="3" fill="#d97706" opacity="0.6"/>
  <circle cx="170" cy="30" r="10" fill="#e11d48" opacity="0.5"/>
  <rect x="155" y="40" width="30" height="5" fill="#64748b" opacity="0.5"/>

  <!-- Hanging Warm Lights -->
  <path d="M 80 0 L 80 25" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <circle cx="80" cy="27" r="6" fill="#fbbf24" filter="url(#glow-effect)"/>
  <path d="M 160 0 L 160 20" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <circle cx="160" cy="22" r="5" fill="#fbbf24" filter="url(#glow-effect)"/>

  <!-- Counter Surface -->
  <path d="M 20 195 L 220 195 L 235 235 L 5 235 Z" fill="#0f172a"/>
  <rect x="15" y="185" width="210" height="12" rx="4" fill="#334155" filter="url(#soft-shadow)"/>
  <rect x="25" y="197" width="190" height="38" fill="#1e293b"/>

  <!-- Counter Props: Plant & Helping Mug -->
  <path d="M 190 175 L 210 175 L 205 190 L 195 190 Z" fill="#64748b"/>
  <circle cx="200" cy="170" r="12" fill="#10b981"/>
  <circle cx="192" cy="165" r="8" fill="#34d399"/>
  
  <rect x="35" y="172" width="20" height="16" rx="4" fill="#f8fafc"/>
  <path d="M 55 176 C 60 176 60 184 55 184" stroke="#f8fafc" stroke-width="3" fill="none"/>
  <!-- Steam from mug -->
  <path d="M 40 162 Q 43 156 40 150" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- MAIN CHARACTER: Eager, Helpful, Enthusiastic Young Woman ("Nhiệt tâm") -->
  <g id="enthusiastic-character" filter="url(#soft-shadow)">
    <!-- Body / Torso -->
    <path d="M 90 190 C 90 155 150 155 150 190 Z" fill="url(#sweater-grad)"/>
    
    <!-- Blue Apron (Signifying Service & Helpful Attitude) -->
    <path d="M 100 160 L 140 160 L 145 195 L 95 195 Z" fill="url(#apron-grad)"/>
    <!-- Apron Pocket -->
    <rect x="108" y="172" width="24" height="16" rx="4" fill="#0284c7" opacity="0.7"/>
    <!-- Cute spatula icon on pocket -->
    <line x1="120" y1="176" x2="120" y2="184" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="175" r="3" fill="#e0f2fe"/>

    <!-- Neck -->
    <rect x="112" y="138" width="16" height="15" fill="#fbcfe8" rx="6"/>

    <!-- Head & Hair Base -->
    <circle cx="120" cy="115" r="28" fill="#fbcfe8"/>
    <!-- Hair Back -->
    <circle cx="120" cy="112" r="29" fill="#1e293b" style="z-index:-1;"/>
    <!-- Ponytail bouncing with energy -->
    <path d="M 140 100 Q 165 95 160 120 Q 155 110 142 112" fill="#1e293b"/>
    <circle cx="160" cy="120" r="4" fill="#fb923c"/>

    <!-- Face Profile / Expression (Wide happy smile, bright sparkling eyes) -->
    <!-- Eyes (Happy crescents/dots with sparkle) -->
    <circle cx="111" cy="113" r="3.5" fill="#0f172a"/>
    <circle cx="129" cy="113" r="3.5" fill="#0f172a"/>
    <!-- Sparkles in eyes -->
    <circle cx="112.5" cy="111.5" r="1.2" fill="#ffffff"/>
    <circle cx="130.5" cy="111.5" r="1.2" fill="#ffffff"/>

    <!-- Cheeks (Blushing with enthusiasm) -->
    <circle cx="107" cy="120" r="5" fill="#fda4af" opacity="0.6"/>
    <circle cx="133" cy="120" r="5" fill="#fda4af" opacity="0.6"/>

    <!-- Big Enthusiastic Open Smile -->
    <path d="M 113 123 Q 120 131 127 123" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="#e11d48"/>

    <!-- Hair Front/Bangs -->
    <path d="M 96 105 Q 120 95 144 105 Q 135 120 120 112 Q 105 120 96 105 Z" fill="#1e293b"/>

    <!-- Dynamic Welcoming Arms (Action-packed "Nhiệt tâm" gesture) -->
    <!-- Left Arm waving/welcoming -->
    <path d="M 92 165 C 75 155 65 130 60 125" stroke="#fb923c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="58" cy="122" r="6" fill="#fbcfe8"/>

    <!-- Right Arm holding out a glowing gift/helpful offer -->
    <path d="M 148 165 C 165 155 175 135 185 125" stroke="#fb923c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="188" cy="122" r="6" fill="#fbcfe8"/>
  </g>

  <!-- ACTION PROP: Glowing Heart / Symbol of Warmth & Passion ("Rèxīn" concept) floating above outstretched hand -->
  <g transform="translate(185, 95)" filter="url(#glow-effect)">
    <path d="M 0 5 C -10 -8 -20 2 -10 12 C -2 20 0 22 0 22 C 0 22 2 20 10 12 C 20 2 10 -8 0 5 Z" fill="url(#heart-grad)"/>
  </g>
  <circle cx="185" cy="103" r="14" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="10;22;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Secondary Floating Sparkles/Hearts Emphasizing Energy and Warmth -->
  <g fill="#fbbf24" opacity="0.9">
    <!-- Star sparkles -->
    <path d="M 55 85 L 58 92 L 65 95 L 58 98 L 55 105 L 52 98 L 45 95 L 52 92 Z" transform="scale(0.6) translate(30, 20)"/>
    <path d="M 185 55 L 187 60 L 192 62 L 187 64 L 185 69 L 183 64 L 178 62 L 183 60 Z" transform="scale(0.8) translate(40, -10)"/>
    <!-- Small glowing circles -->
    <circle cx="75" cy="70" r="3" fill="#38bdf8" filter="url(#glow-effect)"/>
    <circle cx="160" cy="75" r="2.5" fill="#f43f5e" filter="url(#glow-effect)"/>
    <circle cx="105" cy="55" r="2" fill="#fbbf24"/>
  </g>
</svg>