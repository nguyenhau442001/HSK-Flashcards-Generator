<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Water -->
  <path d="M0 160 Q 60 150, 120 160 T 240 160 L 240 240 L 0 240 Z" fill="#1e3a8a" opacity="0.6"/>
  <path d="M0 175 Q 60 165, 120 175 T 240 175 L 240 240 L 0 240 Z" fill="#1e40af"/>

  <!-- Shoreline -->
  <path d="M0 190 C 40 180, 80 200, 140 195 L 240 205 L 240 240 L 0 240 Z" fill="#78350f"/>
  <circle cx="210" cy="210" r="15" fill="#d97706" opacity="0.3"/>
  <circle cx="180" cy="220" r="10" fill="#d97706" opacity="0.2"/>

  <!-- Boat -->
  <g transform="translate(80, 145)">
    <path d="M10 40 L 90 40 L 80 60 L 20 60 Z" fill="#fb923c"/>
    <path d="M20 60 L 80 60 L 70 75 L 30 75 Z" fill="#ea580c"/>
    <rect x="45" y="15" width="5" height="25" fill="#f59e0b"/>
    <path d="M50 15 L 75 30 L 50 35 Z" fill="#fbbf24"/>
    <circle cx="35" cy="45" r="5" fill="#0f172a"/>
    <circle cx="65" cy="45" r="5" fill="#0f172a"/>
  </g>

  <!-- Motion lines -->
  <path d="M70 160 Q 60 155, 50 160" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M60 165 Q 50 160, 40 165" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Moon/Light -->
  <circle cx="190" cy="50" r="25" fill="#fef3c7" opacity="0.1"/>
  <circle cx="190" cy="50" r="15" fill="#f59e0b"/>
</svg>