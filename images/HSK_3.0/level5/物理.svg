<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Lab Room -->
  <!-- Bookshelf & Equipment in Background -->
  <rect x="25" y="45" width="40" height="85" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="75" x2="65" y2="75" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="105" x2="65" y2="105" stroke="#334155" stroke-width="1.5"/>
  <!-- Books on shelf -->
  <rect x="30" y="55" width="8" height="20" rx="1" fill="#475569" />
  <rect x="40" y="52" width="6" height="23" rx="1" fill="#0ea5e9" />
  <rect x="48" y="58" width="12" height="17" rx="1" fill="#10b981" />
  
  <rect x="32" y="85" width="10" height="20" rx="1" fill="#ec4899" />
  <rect x="44" y="88" width="14" height="17" rx="1" fill="#f59e0b" />

  <!-- Chalkboard / Diagram Wall with Physics formulas/drawings -->
  <rect x="80" y="35" width="130" height="75" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <!-- Abstract physics sketches on board (Vector paths, atom orbits, pendulums) -->
  <!-- Atom orbit -->
  <ellipse cx="115" cy="72" rx="18" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-30 115 72)" opacity="0.8"/>
  <ellipse cx="115" cy="72" rx="18" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(30 115 72)" opacity="0.8"/>
  <circle cx="115" cy="72" r="3" fill="#38bdf8" />
  <!-- Wave / Sine wave graph -->
  <path d="M 145 72 Q 155 55 165 72 T 185 72" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.9"/>
  <!-- Pendulum sketch -->
  <line x1="195" y1="45" x2="205" y2="75" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="205" cy="75" r="5" fill="#f43f5e" opacity="0.9"/>

  <!-- Hanging Lamp / Desk Light -->
  <path d="M 120 0 L 120 25" stroke="#64748b" stroke-width="2" />
  <path d="M 105 25 L 135 25 L 140 38 L 100 38 Z" fill="#475569" />
  <!-- Light beam down to desk -->
  <polygon points="105,38 135,38 180,150 60,150" fill="url(#beam)" />

  <!-- Desk Surface -->
  <rect x="15" y="150" width="210" height="75" rx="4" fill="url(#deskGrad)" stroke="#475569" stroke-width="1.5" />
  <rect x="15" y="150" width="210" height="6" fill="#475569" opacity="0.6"/>

  <!-- Character (Researcher / Student analyzing physics) -->
  <!-- Chair back -->
  <rect x="75" y="115" width="25" height="45" rx="6" fill="#334155" />

  <!-- Character Torso & Arms -->
  <path d="M 85 155 L 110 155 L 115 200 L 75 200 Z" fill="#2563eb" /> <!-- Blue shirt/hoodie -->
  <path d="M 78 158 L 60 185 L 72 192 L 85 170 Z" fill="#1d4ed8" /> <!-- Left arm reaching -->
  <path d="M 112 158 L 135 180 L 125 190 L 108 172 Z" fill="#1d4ed8" /> <!-- Right arm -->

  <!-- Hands -->
  <circle cx="68" cy="195" r="5" fill="#fbcfe8" />
  <circle cx="130" cy="193" r="5" fill="#fbcfe8" />

  <!-- Character Head & Hair -->
  <circle cx="95" cy="130" r="18" fill="#fbcfe8" /> <!-- Face -->
  <!-- Hair -->
  <path d="M 77 130 C 77 115, 90 110, 110 120 C 113 122, 114 125, 113 128 C 110 122, 100 115, 85 120 C 80 122, 78 126, 77 130 Z" fill="#1e293b" />
  <path d="M 80 125 C 80 112, 95 108, 108 112 C 105 110, 90 108, 82 118 Z" fill="#1e293b" />
  
  <!-- Glasses (Smart/Studious look) -->
  <rect x="85" y="123" width="9" height="7" rx="1.5" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <rect x="96" y="123" width="9" height="7" rx="1.5" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <line x1="94" y1="126" x2="96" y2="126" stroke="#0f172a" stroke-width="1.5" />
  <path d="M 85 125 L 81 123" stroke="#0f172a" stroke-width="1.2" />
  <path d="M 105 125 L 109 123" stroke="#0f172a" stroke-width="1.2" />

  <!-- Focused Expression -->
  <path d="M 88 137 Q 90 135 92 137" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 98 137 Q 100 135 102 137" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 94 142 Q 96 144 98 142" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-linecap="round" />

  <!-- Props on Desk: Physics Apparatus & Laptop/Notebook -->
  <!-- Notebook / Textbook open -->
  <path d="M 115 170 L 155 160 L 175 185 L 135 198 Z" fill="#f8fafc" />
  <path d="M 135 164 L 155 160 L 175 185 L 155 189 Z" fill="#e2e8f0" />
  <!-- Notebook lines -->
  <line x1="122" y1="178" x2="140" y2="173" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="125" y1="184" x2="143" y2="179" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="148" y1="173" x2="167" y2="169" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="150" y1="179" x2="169" y2="175" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="130" cy="175" r="1.5" fill="#ef4444" /> <!-- tiny drawn diagram -->

  <!-- Newton's Cradle (Classic Physics Demonstration Prop) -->
  <g transform="translate(160, 115)">
    <!-- Wooden base -->
    <rect x="-10" y="42" width="55" height="8" rx="2" fill="#78350f" />
    <rect x="-5" y="40" width="45" height="3" fill="#92400e" />
    <!-- Metal frame -->
    <path d="M -2 40 L -2 10 L 42 10 L 42 40" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Strings and spheres (Newton's Cradle active action) -->
    <!-- Ball 1 (moving up/out) -->
    <line x1="5" y1="10" x2="-2" y2="30" stroke="#94a3b8" stroke-width="1" />
    <circle cx="-2" cy="30" r="4.5" fill="#38bdf8" />
    
    <!-- Ball 2 (stationary) -->
    <line x1="12" y1="10" x2="12" y2="34" stroke="#94a3b8" stroke-width="1" />
    <circle cx="12" cy="34" r="4.5" fill="#38bdf8" />
    
    <!-- Ball 3 (stationary) -->
    <line x1="19" y1="10" x2="19" y2="34" stroke="#94a3b8" stroke-width="1" />
    <circle cx="19" cy="34" r="4.5" fill="#38bdf8" />
    
    <!-- Ball 4 (stationary) -->
    <line x1="26" y1="10" x2="26" y2="34" stroke="#94a3b8" stroke-width="1" />
    <circle cx="26" cy="34" r="4.5" fill="#38bdf8" />
    
    <!-- Ball 5 (moving out on collision) -->
    <line x1="33" y1="10" x2="42" y2="28" stroke="#94a3b8" stroke-width="1" />
    <circle cx="42" cy="28" r="4.5" fill="#38bdf8" />
    <!-- Impact motion spark -->
    <circle cx="39" cy="32" r="2" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Magnifying Glass hovering over notes / experiment -->
  <g transform="translate(65, 155)">
    <circle cx="0" cy="0" r="16" fill="url(#glow)" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />
    <!-- Handle -->
    <line x1="11" y1="11" x2="26" y2="26" stroke="#475569" stroke-width="5" stroke-linecap="round" />
    <line x1="11" y1="11" x2="26" y2="26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Coffee Cup (Real-world student/researcher prop) -->
  <path d="M 40 170 L 58 170 L 55 195 L 43 195 Z" fill="#f1f5f9" />
  <ellipse cx="49" cy="170" rx="9" ry="2.5" fill="#cbd5e1" />
  <ellipse cx="49" cy="171" rx="7" ry="1.5" fill="#78350f" /> <!-- Coffee surface -->
  <path d="M 58 174 C 64 174, 64 188, 57 188" fill="none" stroke="#f1f5f9" stroke-width="2" />
  <!-- Steam from coffee -->
  <path d="M 46 163 Q 48 158 46 153" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 52 165 Q 50 160 53 155" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Floating decorative physics sparkles / energy elements -->
  <circle cx="150" cy="95" r="2" fill="#38bdf8" opacity="0.8" />
  <path d="M 148 95 L 152 95 M 150 93 L 150 97" stroke="#38bdf8" stroke-width="1" opacity="0.8" />

  <circle cx="85" cy="85" r="1.5" fill="#fbbf24" opacity="0.9" />
  <circle cx="185" cy="115" r="2" fill="#10b981" opacity="0.8" />
</svg>