<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Wall surface -->
  <path d="M0 0h240v240H0z" fill="#1e293b"/>
  
  <!-- Calendar structure -->
  <g transform="translate(70, 40)">
    <!-- Calendar backboard -->
    <rect x="0" y="0" width="100" height="140" rx="8" fill="#334155"/>
    <!-- Calendar sheets -->
    <rect x="10" y="20" width="80" height="100" rx="4" fill="#f8fafc"/>
    <rect x="12" y="22" width="76" height="96" rx="2" fill="#e2e8f0"/>
    <!-- Binding/Spiral -->
    <circle cx="25" cy="15" r="4" fill="#94a3b8"/>
    <circle cx="50" cy="15" r="4" fill="#94a3b8"/>
    <circle cx="75" cy="15" r="4" fill="#94a3b8"/>
    <!-- Grid lines/abstract date markers -->
    <rect x="20" y="40" width="60" height="2" fill="#cbd5e1"/>
    <rect x="20" y="55" width="60" height="2" fill="#cbd5e1"/>
    <rect x="20" y="70" width="60" height="2" fill="#cbd5e1"/>
    <rect x="20" y="85" width="60" height="2" fill="#cbd5e1"/>
    <!-- Highlighted date -->
    <circle cx="40" cy="70" r="8" fill="#f59e0b"/>
  </g>

  <!-- Desk/Context props -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <path d="M0 180h240v10H0z" fill="#334155"/>
  
  <!-- Potted plant -->
  <path d="M180 180l15-40 15 40z" fill="#10b981"/>
  <ellipse cx="195" cy="180" rx="20" ry="10" fill="#475569"/>
  
  <!-- Pen -->
  <rect x="40" y="195" width="40" height="6" rx="3" fill="#ec4899"/>
  <path d="M80 195l10 3-10 3z" fill="#fb923c"/>
  
  <!-- Ambient light glow -->
  <circle cx="120" cy="120" r="150" fill="url(#grad)" opacity="0.05"/>
  <defs>
    <radialGradient id="grad">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>