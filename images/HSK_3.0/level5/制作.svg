<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Base background -->
    <rect width="240" height="240" fill="url(#bgGrad)"/>

    <!-- Factory interior lighting effect -->
    <path d="M0 0 L240 0 L240 180 L0 180 Z" fill="url(#amberGlow)"/>

    <!-- Factory Architecture & Background Props -->
    <!-- Back wall grid / panels -->
    <path d="M0 130 H240 M0 90 H240" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
    <rect x="25" y="40" width="40" height="60" rx="4" fill="#334155" opacity="0.3"/>
    <rect x="175" y="40" width="40" height="60" rx="4" fill="#334155" opacity="0.3"/>

    <!-- Ceiling lamps -->
    <path d="M70 0 V35 M170 0 V35" stroke="#64748b" stroke-width="2"/>
    <polygon points="55,35 85,35 90,50 50,50" fill="#475569"/>
    <polygon points="155,35 185,35 190,50 150,50" fill="#475569"/>
    <ellipse cx="70" cy="50" rx="20" ry="6" fill="#fbbf24" opacity="0.8"/>
    <ellipse cx="170" cy="50" rx="20" ry="6" fill="#fbbf24" opacity="0.8"/>

    <!-- Light cones -->
    <polygon points="70,50 20,190 120,190" fill="#fbbf24" opacity="0.04"/>
    <polygon points="170,50 120,190 220,190" fill="#fbbf24" opacity="0.04"/>

    <!-- Shelves with tools and materials in the back -->
    <rect x="190" y="90" width="35" height="90" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="190" y1="120" x2="225" y2="120" stroke="#334155" stroke-width="2"/>
    <line x1="190" y1="150" x2="225" y2="150" stroke="#334155" stroke-width="2"/>
    <rect x="198" y="102" width="10" height="18" fill="#f97316" rx="2"/>
    <circle cx="210" cy="138" r="8" fill="#38bdf8"/>

    <!-- Floor -->
    <rect x="0" y="180" width="240" height="60" fill="#090d16"/>
    <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>

    <!-- Main Workbench -->
    <g id="workbench">
      <!-- Legs -->
      <rect x="35" y="145" width="12" height="45" fill="#334155"/>
      <rect x="155" y="145" width="12" height="45" fill="#334155"/>
      <!-- Table top -->
      <rect x="20" y="135" width="160" height="14" rx="3" fill="#b45309"/>
      <rect x="15" y="130" width="170" height="7" rx="2" fill="#d97706"/>
    </g>

    <!-- Furniture Being Made (Wooden Chair on Workbench) -->
    <g id="wooden-chair">
      <!-- Chair legs & seat -->
      <rect x="80" y="115" width="45" height="6" rx="1" fill="#b45309"/>
      <polygon points="85,121 88,133 91,133 89,121" fill="#92400e"/>
      <polygon points="120,121 117,133 114,133 116,121" fill="#92400e"/>
      <!-- Chair backrest -->
      <path d="M82 115 L80 90 C80 88 82 87 85 87 L88 87 C90 87 91 88 91 90 L93 115 Z" fill="#b45309"/>
      <path d="M112 115 L114 90 C114 88 112 87 110 87 L107 87 C105 87 104 88 104 90 L102 115 Z" fill="#b45309"/>
      <rect x="84" y="94" width="30" height="4" rx="1" fill="#d97706"/>
      <rect x="84" y="103" width="30" height="4" rx="1" fill="#d97706"/>
    </g>

    <!-- Character: Carpenter / Factory Worker -->
    <g id="worker">
      <!-- Body & Apron -->
      <path d="M130 145 C130 130 145 125 155 125 C165 125 180 130 180 145 L175 185 L135 185 Z" fill="#2563eb"/>
      <!-- Blue shirt sleeves -->
      <path d="M125 130 Q115 135 110 145 L125 155 Z" fill="#1d4ed8"/>
      <path d="M185 130 Q195 135 200 145 L185 155 Z" fill="#1d4ed8"/>
      
      <!-- Apron -->
      <path d="M138 135 L172 135 L177 185 L133 185 Z" fill="#f59e0b"/>
      <circle cx="155" cy="143" r="5" fill="#d97706"/>
      <line x1="138" y1="135" x2="130" y2="125" stroke="#d97706" stroke-width="2"/>
      <line x1="172" y1="135" x2="180" y2="125" stroke="#d97706" stroke-width="2"/>

      <!-- Head & Face -->
      <circle cx="155" cy="110" r="16" fill="#fbcfe8"/>
      <!-- Hair -->
      <path d="M139 110 C139 98 150 94 155 94 C160 94 171 98 171 110 C171 112 169 111 167 106 C163 98 158 97 155 97 C152 97 147 98 143 106 C141 111 139 112 139 110 Z" fill="#1e293b"/>
      <!-- Focused Eyes & Expression -->
      <circle cx="150" cy="110" r="1.5" fill="#0f172a"/>
      <circle cx="160" cy="110" r="1.5" fill="#0f172a"/>
      <!-- Confident/Focused Mouth -->
      <path d="M152 117 Q155 119 158 117" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- Arms and Action (Crafting with a tool) -->
      <!-- Left arm resting -->
      <path d="M135 135 Q125 145 130 160" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" fill="none"/>
      
      <!-- Right arm holding sanding block / tool active over the chair -->
      <path d="M175 135 Q185 130 170 120" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="155" cy="118" r="3" fill="#fbcfe8"/> <!-- Hand -->

      <!-- Action Tool: Sanding block / Hand planer -->
      <g transform="translate(112, 106) rotate(-15)">
        <rect x="0" y="0" width="22" height="10" rx="2" fill="#ef4444"/>
        <rect x="4" y="-5" width="14" height="6" rx="2" fill="#b91c1c"/>
        <path d="M-2 10 L24 10 L22 13 L0 13 Z" fill="#fbbf24"/> <!-- Sawdust / active effect -->
      </g>
    </g>

    <!-- Additional Foreground Context / Props -->
    <!-- Wood planks leaning against workbench -->
    <polygon points="25,185 30,135 36,135 32,185" fill="#b45309"/>
    <polygon points="33,185 39,120 46,120 40,185" fill="#d97706"/>
    <polygon points="42,185 47,140 52,140 47,185" fill="#92400e"/>

    <!-- Tool box on floor -->
    <g transform="translate(185, 165)">
      <rect x="0" y="0" width="30" height="20" rx="3" fill="#0284c7"/>
      <rect x="3" y="-4" width="24" height="5" rx="2" fill="#0369a1"/>
      <rect x="12" y="5" width="6" height="10" rx="1" fill="#e2e8f0"/>
      <path d="M9 -4 C9 -8 21 -8 21 -4" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    </g>

    <!-- Floating Wood Shavings / Crafting particles -->
    <path d="M95 135 Q100 130 105 138" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M125 125 Q132 120 130 130" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <circle cx="140" cy="122" r="1.5" fill="#fbbf24"/>
    <circle cx="115" cy="128" r="2" fill="#f59e0b"/>
    <circle cx="102" cy="142" r="1" fill="#fbbf24"/>

  </g>
</svg>