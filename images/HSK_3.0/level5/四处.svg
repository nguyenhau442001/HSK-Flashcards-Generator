<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Forest Background Elements -->
  <path d="M20 240 Q 60 150 100 240 Z" fill="#064e3b" opacity="0.6"/>
  <path d="M140 240 Q 180 160 220 240 Z" fill="#065f46" opacity="0.8"/>
  <circle cx="180" cy="60" r="25" fill="#f59e0b" opacity="0.2"/>
  <circle cx="180" cy="60" r="15" fill="#fbbf24"/>
  
  <!-- Tree Branches -->
  <path d="M0 180 C 40 170 80 190 120 160 C 160 130 200 150 240 140" stroke="#374151" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M20 240 C 50 200 60 180 50 150" stroke="#374151" stroke-width="6" fill="none"/>
  
  <!-- Birds (representing '四处' - flying in different directions) -->
  <!-- Bird 1 -->
  <g transform="translate(60, 120) rotate(-10)">
    <path d="M0 0 C 5 -5 10 -5 15 0 C 10 5 5 5 0 0 Z" fill="#38bdf8"/>
    <path d="M-5 -2 L 0 0 L -5 2" stroke="#38bdf8" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Bird 2 -->
  <g transform="translate(140, 90) rotate(20)">
    <path d="M0 0 C 5 -5 10 -5 15 0 C 10 5 5 5 0 0 Z" fill="#10b981"/>
    <path d="M-5 -2 L 0 0 L -5 2" stroke="#10b981" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Bird 3 -->
  <g transform="translate(100, 180) rotate(-30)">
    <path d="M0 0 C 5 -5 10 -5 15 0 C 10 5 5 5 0 0 Z" fill="#fb923c"/>
    <path d="M-5 -2 L 0 0 L -5 2" stroke="#fb923c" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Bird 4 -->
  <g transform="translate(190, 150) rotate(10)">
    <path d="M0 0 C 5 -5 10 -5 15 0 C 10 5 5 5 0 0 Z" fill="#ec4899"/>
    <path d="M-5 -2 L 0 0 L -5 2" stroke="#ec4899" stroke-width="2" fill="none"/>
  </g>

  <!-- Spring Leaves/Petals -->
  <circle cx="40" cy="160" r="3" fill="#ec4899"/>
  <circle cx="110" cy="140" r="2" fill="#38bdf8"/>
  <circle cx="170" cy="180" r="3" fill="#fb923c"/>
  <circle cx="210" cy="120" r="2" fill="#10b981"/>
</svg>