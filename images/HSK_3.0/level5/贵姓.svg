<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Hotel Lobby/Reception -->
  <rect x="20" y="140" width="200" height="100" rx="10" fill="#334155" opacity="0.3"/>
  <path d="M40 140 L200 140 L210 160 L30 160 Z" fill="#475569"/>
  <circle cx="180" cy="100" r="30" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Receptionist Character -->
  <g transform="translate(140, 100)">
    <circle cx="0" cy="0" r="25" fill="#f8fafc"/>
    <path d="M-10 -5 h20 v10 h-20 Z" fill="#cbd5e1"/>
    <circle cx="-8" cy="-5" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-5" r="3" fill="#0f172a"/>
    <path d="M-5 10 q5 5 10 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="-30" y="25" width="60" height="80" rx="10" fill="#38bdf8"/>
  </g>
  
  <!-- Guest Character (Asking) -->
  <g transform="translate(70, 100)">
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <path d="M-12 -8 h24 v15 h-24 Z" fill="#fb923c"/>
    <circle cx="-8" cy="-5" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-5" r="3" fill="#0f172a"/>
    <path d="M-10 10 q10 8 20 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="-30" y="25" width="60" height="80" rx="10" fill="#ec4899"/>
    <!-- Gesture: Hand raised slightly in polite inquiry -->
    <path d="M30 10 L45 5" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Props: Guestbook/Counter -->
  <rect x="30" y="150" width="180" height="15" rx="2" fill="#fbbf24"/>
  <rect x="150" y="155" width="30" height="5" rx="1" fill="#f59e0b"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="4" fill="#10b981"/>
  <circle cx="40" cy="60" r="3" fill="#38bdf8"/>
</svg>