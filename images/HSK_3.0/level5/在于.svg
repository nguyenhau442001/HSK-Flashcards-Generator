<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Office Details -->
  <!-- Window / Night City Glow -->
  <path d="M165 40 L210 40 L210 110 L165 110 Z" fill="#1e293b" stroke="#334155" stroke-width="2" rx="4" />
  <path d="M175 50 L195 50 L195 95 L175 95 Z" fill="#0f172a" />
  <circle cx="185" cy="70" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="200" cy="60" r="1" fill="#fbbf24" opacity="0.8" />
  <circle cx="170" cy="85" r="1.2" fill="#38bdf8" opacity="0.5" />

  <!-- Bookshelf Background -->
  <rect x="25" y="45" width="50" height="70" rx="2" fill="#1e293b" opacity="0.6" />
  <line x1="25" y1="65" x2="75" y2="65" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="90" x2="75" y2="90" stroke="#334155" stroke-width="2" />
  <!-- Books -->
  <rect x="30" y="52" width="6" height="13" rx="1" fill="#3b82f6" />
  <rect x="38" y="50" width="8" height="15" rx="1" fill="#ec4899" />
  <rect x="48" y="53" width="5" height="12" rx="1" fill="#10b981" />
  <rect x="30" y="75" width="7" height="15" rx="1" fill="#f59e0b" />
  <rect x="39" y="77" width="10" height="13" rx="1" fill="#6366f1" />

  <!-- Desk Surface -->
  <path d="M15 175 L225 175 L215 210 L25 210 Z" fill="url(#deskGrad)" />
  <path d="M15 175 L225 175" stroke="#475569" stroke-width="2" />

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M125 155 L175 155 L185 176 L115 176 Z" fill="#64748b" />
  <path d="M110 176 L190 176 L195 180 L105 180 Z" fill="#475569" rx="1" />
  <path d="M130 130 L170 130 L175 155 L125 155 Z" fill="#334155" rx="2" />
  <path d="M133 133 L167 133 L171 152 L129 152 Z" fill="#0ea5e9" opacity="0.2" />
  <!-- Coffee Mug -->
  <rect x="185" y="150" width="14" height="18" rx="3" fill="#f8fafc" />
  <path d="M199 154 C204 154 204 164 199 164" fill="none" stroke="#f8fafc" stroke-width="2.5" />
  <path d="M188 145 C190 142 195 142 197 145" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Clock & Time Motif (Central Meaning Accent) -->
  <g transform="translate(95, 80)">
    <!-- Glowing Halo representing time slipping away -->
    <circle cx="25" cy="25" r="30" fill="url(#glowGrad)" filter="url(#amberGlow)" />
    <!-- Clock Body -->
    <circle cx="25" cy="25" r="22" fill="#1e293b" stroke="#fbbf24" stroke-width="3" />
    <circle cx="25" cy="25" r="19" fill="#0f172a" />
    <!-- Clock Hands (Showing urgent late hour, e.g., 11:55) -->
    <line x1="25" y1="25" x2="25" y2="13" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <line x1="25" y1="25" x2="35" y2="28" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <circle cx="25" cy="25" r="2.5" stroke="#fbbf24" stroke-width="1" fill="#f8fafc" />
    <!-- Clock stand -->
    <path d="M21 47 L29 47 L27 52 L23 52 Z" fill="#fbbf24" />
  </g>

  <!-- Main Character (Overwhelmed Office Worker) -->
  <!-- Chair Back -->
  <path d="M60 100 L95 100 L90 175 L65 175 Z" fill="#334155" rx="6" />
  
  <!-- Character Torso & Arms -->
  <path d="M62 140 L98 140 L105 185 L55 185 Z" fill="#0ea5e9" rx="6" /> <!-- Blue shirt -->
  <path d="M72 135 L88 135 L90 145 L70 145 Z" fill="#cbd5e1" /> <!-- Collar -->
  
  <!-- Arms holding head in stress/worry -->
  <path d="M62 145 C45 150 40 130 50 115 C55 108 65 110 70 120" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M98 145 C115 150 120 130 110 115 C105 108 95 110 90 120" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Character Head & Face -->
  <circle cx="80" cy="115" r="18" fill="#fcd34d" /> <!-- Face -->
  
  <!-- Hair -->
  <path d="M63 115 C62 95 98 95 97 115 C95 102 65 102 63 115 Z" fill="#334155" />

  <!-- Expression: Stressed, Eyes Closed tight, Sweat Drop -->
  <!-- Eyebrows angled in stress -->
  <path d="M70 110 L76 113" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M84 113 L90 110" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes (X or stressed lines) -->
  <path d="M71 116 L76 118" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M71 118 L76 116" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M84 118 L89 116" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M84 116 L89 118" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Worried Mouth -->
  <path d="M77 127 Q80 123 83 127" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Sweat Drop -->
  <path d="M96 112 C96 112 101 118 101 121 C101 123 99 125 96 125 C93 125 91 123 91 121 C91 118 96 112 96 112 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Foreground Documents / Unfinished Work Papers scattered -->
  <path d="M35 180 L65 170 L70 195 L40 205 Z" fill="#f8fafc" opacity="0.9" />
  <line x1="42" y1="182" x2="58" y2="177" stroke="#cbd5e1" stroke-width="2" />
  <line x1="44" y1="189" x2="60" y2="184" stroke="#cbd5e1" stroke-width="2" />
  <line x1="46" y1="196" x2="55" y2="193" stroke="#cbd5e1" stroke-width="2" />

  <path d="M170 185 L205 178 L210 198 L175 205 Z" fill="#f1f5f9" opacity="0.9" />
  <line x1="178" y1="189" x2="198" y2="185" stroke="#ef4444" stroke-width="2" />
  <line x1="180" y1="195" x2="195" y2="192" stroke="#cbd5e1" stroke-width="2" />

  <!-- Ambient highlights for rich vector lighting -->
  <circle cx="120" cy="50" r="1.5" fill="#f8fafc" opacity="0.3" />
  <circle cx="45" cy="30" r="1" fill="#f8fafc" opacity="0.2" />
</svg>