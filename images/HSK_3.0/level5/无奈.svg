<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Background -->
    <rect width="240" height="240" fill="url(#bg)"/>

    <!-- Ambient warm interior light -->
    <path d="M120 120 L0 240 H240 Z" fill="url(#warm-glow)" />

    <!-- Environment: Cozy study/office background with props -->
    <g opacity="0.4">
      <!-- Bookshelf in background -->
      <rect x="25" y="40" width="40" height="90" fill="#334155" rx="2"/>
      <line x1="25" y1="70" x2="65" y2="70" stroke="#1e293b" stroke-width="3"/>
      <line x1="25" y1="100" x2="65" y2="100" stroke="#1e293b" stroke-width="3"/>
      <!-- Books -->
      <path d="M30 50 H38 V70 H30 Z" fill="#38bdf8"/>
      <path d="M41 48 H48 V70 H41 Z" fill="#f43f5e"/>
      <path d="M30 80 H42 V100 H30 Z" fill="#10b981"/>

      <!-- Window with night city lights -->
      <rect x="155" y="30" width="55" height="75" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
      <line x1="182" y1="30" x2="182" y2="105" stroke="#475569" stroke-width="2"/>
      <line x1="155" y1="67" x2="210" y2="67" stroke="#475569" stroke-width="2"/>
      <!-- City lights outside -->
      <circle cx="168" cy="50" r="2" fill="#fbbf24" opacity="0.8"/>
      <circle cx="195" cy="85" r="1.5" fill="#38bdf8" opacity="0.8"/>
      <circle cx="175" cy="92" r="2" fill="#f43f5e" opacity="0.8"/>
    </g>

    <!-- Desk / Table Surface -->
    <path d="M 0 185 L 240 185 L 240 240 L 0 240 Z" fill="url(#table-grad)"/>
    <line x1="0" y1="185" x2="240" y2="185" stroke="#475569" stroke-width="2"/>

    <!-- Desk Props: Messy paperwork and spilled coffee cup (causes of helplessness) -->
    <!-- Papers stack -->
    <g transform="rotate(-8 90 180)">
      <rect x="75" y="155" width="45" height="30" fill="#f8fafc" rx="1"/>
      <line x1="82" y1="163" x2="110" y2="163" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="82" y1="171" x2="105" y2="171" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="82" y1="179" x2="98" y2="179" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <g transform="rotate(5 110 180)">
      <rect x="95" y="160" width="45" height="30" fill="#f1f5f9" rx="1"/>
      <line x1="102" y1="168" x2="130" y2="168" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="102" y1="176" x2="120" y2="176" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <!-- Laptop (open, showing error/blank) -->
    <path d="M 135 155 L 185 155 L 195 185 L 125 185 Z" fill="#64748b"/>
    <path d="M 140 120 H 180 V 155 H 140 Z" fill="#334155" rx="2"/>
    <path d="M 144 125 H 176 V 148 H 144 Z" fill="#0f172a"/>
    <!-- Sad screen icon (exclamation mark) -->
    <circle cx="160" cy="133" r="4" fill="#f43f5e"/>
    <rect x="159" y="139" width="2" height="6" fill="#f43f5e" rx="1"/>
    <!-- Laptop base shadow -->
    <ellipse cx="160" cy="185" rx="40" ry="4" fill="#0f172a" opacity="0.6"/>

    <!-- Spilled Coffee Mug -->
    <g transform="translate(50, 165)">
      <!-- Coffee puddle -->
      <ellipse cx="15" cy="20" rx="12" ry="5" fill="#78350f" opacity="0.8"/>
      <!-- Mug body -->
      <path d="M 5 5 L 10 20 H 20 L 25 5 Z" fill="#f8fafc"/>
      <!-- Handle -->
      <path d="M 3 8 C -2 8 -2 17 5 18" stroke="#f8fafc" stroke-width="2.5" fill="none"/>
      <!-- Steam lines indicating recent spill -->
      <path d="M 10 0 Q 12 -4 10 -8" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- MAIN CHARACTER: Man showing "无奈" (helpless smile/shrug) -->
    <g transform="translate(100, 75)">
      <!-- Body/Torso (Sitting posture, wearing a casual orange-brown sweater) -->
      <path d="M -25 80 Q 0 65 25 80 L 35 110 H -35 Z" fill="#d97706"/>
      <!-- Collar -->
      <path d="M -12 68 Q 0 75 12 68 L 10 73 Q 0 80 -10 73 Z" fill="#fbbf24"/>

      <!-- Neck -->
      <rect x="-6" y="55" width="12" height="16" fill="#fcd34d"/>

      <!-- Raised Arms / Shrugging Shoulders indicating "wunai" (helplessness) -->
      <!-- Left arm bent up -->
      <path d="M -25 75 Q -45 75 -40 50 L -35 48" stroke="#d97706" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Left hand (open palm, slightly up) -->
      <circle cx="-35" cy="45" r="5" fill="#fcd34d"/>

      <!-- Right arm bent up -->
      <path d="M 25 75 Q 45 75 40 50 L 35 48" stroke="#d97706" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Right hand -->
      <circle cx="35" cy="45" r="5" fill="#fcd34d"/>

      <!-- Head -->
      <circle cx="0" cy="32" r="22" fill="#fcd34d"/>

      <!-- Hair (Stylized neat dark hair) -->
      <path d="M -20 28 C -22 10 -5 10 5 10 C 18 10 21 18 21 32 C 21 32 15 22 5 22 C -5 22 -18 26 -20 28 Z" fill="#1e293b"/>

      <!-- FACE EXPRESSION: "无奈地笑了笑" (Helpless smile, wry expression) -->
      <!-- Eyebrows raised asymmetrically with slight concern -->
      <path d="M -10 23 Q -5 20 0 23" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 5 23 Q 10 20 15 23" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Closed/half-moon smiling eyes (conveying awkward/helpless smile, not pure joy) -->
      <path d="M -10 28 Q -7 32 -4 28" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 4 28 Q 7 32 10 28" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Rosy embarrassed/helpless cheeks -->
      <circle cx="-13" cy="33" r="4" fill="#fb7185" opacity="0.5"/>
      <circle cx="13" cy="33" r="4" fill="#fb7185" opacity="0.5"/>

      <!-- Wry, crooked smile (characteristic of "无奈地笑" - awkward, wry, slightly forced smile) -->
      <path d="M -7 40 Q 0 45 8 38" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Corner dimple mark -->
      <circle cx="8" cy="38" r="1" fill="#1e293b"/>

      <!-- Sweat drop on temple (classic visual cue for helplessness/awkwardness) -->
      <path d="M 18 25 C 22 28 20 33 18 33 C 16 33 14 28 18 25 Z" fill="#38bdf8" opacity="0.8"/>
    </g>

    <!-- Foreground lighting vignette -->
    <rect width="240" height="240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.1" rx="24"/>
  </g>
</svg>