<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Globe Glow -->
    <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container / Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment (Study Room) -->
  <g id="environment">
    <!-- Bookshelf in background -->
    <rect x="25" y="40" width="45" height="90" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="70" x2="70" y2="70" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="100" x2="70" y2="100" stroke="#334155" stroke-width="1.5" />
    <!-- Books on shelf -->
    <rect x="30" y="50" width="8" height="20" fill="#f43f5e" rx="1" />
    <rect x="40" y="47" width="10" height="23" fill="#38bdf8" rx="1" />
    <rect x="52" y="53" width="7" height="17" fill="#10b981" rx="1" />
    <rect x="30" y="80" width="12" height="20" fill="#fbbf24" rx="1" />
    <rect x="45" y="82" width="9" height="18" fill="#a855f7" rx="1" />

    <!-- Window showing night sky / stars -->
    <rect x="155" y="35" width="55" height="75" rx="4" fill="#090d16" stroke="#475569" stroke-width="2" />
    <line x1="182" y1="35" x2="182" y2="110" stroke="#475569" stroke-width="1.5" />
    <line x1="155" y1="72" x2="210" y2="72" stroke="#475569" stroke-width="1.5" />
    <!-- Stars outside -->
    <circle cx="167" cy="48" r="1" fill="#fff" />
    <circle cx="195" cy="55" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="95" r="1" fill="#fff" />
    <circle cx="165" cy="90" r="1.2" fill="#fbbf24" />

    <!-- Window Light Beam casting across the room -->
    <polygon points="155,35 210,35 240,180 120,180" fill="url(#lightBeam)" />
  </g>

  <!-- Desk & Props -->
  <g id="desk-and-props">
    <!-- Desk Surface -->
    <rect x="10" y="165" width="220" height="12" rx="3" fill="url(#deskGrad)" />
    <rect x="25" y="177" width="15" height="50" fill="#1e293b" />
    <rect x="200" y="177" width="15" height="50" fill="#1e293b" />

    <!-- Desk Lamp -->
    <path d="M195,165 L200,130 L208,130 L213,165 Z" fill="#64748b" />
    <path d="M193,125 C193,115 203,112 212,125 Z" fill="#cbd5e1" />
    <!-- Lamp Glow -->
    <ellipse cx="202" cy="166" rx="18" ry="4" fill="#fbbf24" opacity="0.3" />

    <!-- Vintage Globe (Representing 'destiny / world / path') -->
    <circle cx="85" cy="138" r="18" fill="#0284c7" />
    <!-- Globe Stand -->
    <path d="M85,120 A18,18 0 0 1 103,138" fill="none" stroke="#94a3b8" stroke-width="2" />
    <line x1="85" y1="120" x2="85" y2="126" stroke="#94a3b8" stroke-width="2" />
    <path d="M78,156 L92,156 L85,146 Z" fill="#94a3b8" />
    <!-- Globe continents abstract -->
    <path d="M75,133 Q80,128 88,132 T95,142 Q90,148 82,145 Z" fill="#10b981" opacity="0.8" />
    <!-- Globe Aura -->
    <circle cx="85" cy="138" r="22" fill="url(#globeGlow)" />

    <!-- Open Book on Desk -->
    <path d="M120,152 Q135,147 150,152 L150,167 Q135,162 120,167 Z" fill="#f8fafc" />
    <path d="M150,152 Q165,147 180,152 L180,167 Q165,162 150,167 Z" fill="#f1f5f9" />
    <line x1="150" y1="152" x2="150" y2="167" stroke="#cbd5e1" stroke-width="1" />
    <!-- Tiny page lines -->
    <line x1="125" y1="156" x2="145" y2="158" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="125" y1="161" x2="142" y2="163" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="155" y1="158" x2="175" y2="156" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="155" y1="163" x2="172" y2="161" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Main Character (Thoughtful Young Man reflecting on destiny) -->
  <g id="main-character">
    <!-- Character Body & Torso -->
    <path d="M100,170 C100,150 110,135 130,135 C150,135 160,150 160,170 Z" fill="#3b82f6" />
    <!-- Collar -->
    <path d="M120,135 L130,145 L140,135" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Character Neck -->
    <rect x="123" y="123" width="14" height="15" fill="#fbcfe8" rx="4" />

    <!-- Character Head -->
    <circle cx="130" cy="108" r="20" fill="#fbcfe8" />

    <!-- Hair (Stylized modern neat cut) -->
    <path d="M110,108 C110,93 120,88 132,88 C148,88 150,98 150,110 C150,110 148,97 133,96 C119,95 113,103 110,108 Z" fill="#1e293b" />
    <path d="M110,108 L113,115 L117,108 Z" fill="#1e293b" />

    <!-- Facial Expression: Thoughtful / Contemplative, looking gently towards the globe/destiny -->
    <!-- Closed / Soft contemplative eyes -->
    <path d="M121,108 Q125,111 129,108" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
    <path d="M133,108 Q137,111 141,108" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
    <!-- Gentle thoughtful mouth -->
    <path d="M129,118 Q132,120 135,118" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms & Hands in contemplative pose (hand supporting chin) -->
    <!-- Back arm -->
    <path d="M110,145 L100,165 L115,165" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front arm resting on desk, hand near chin -->
    <path d="M145,145 C150,155 140,165 138,165" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
    <!-- Hand supporting chin -->
    <circle cx="137" cy="122" r="5" fill="#fbcfe8" />
  </g>

  <!-- Accent Glowing Sparkles / Destiny Atmosphere (Abstract conceptual floating dots, NO text) -->
  <g id="destiny-sparkles">
    <circle cx="105" cy="85" r="2" fill="#fbbf24" opacity="0.8" />
    <circle cx="95" cy="72" r="3" fill="#38bdf8" opacity="0.9" />
    <circle cx="120" cy="65" r="1.5" fill="#fbbf24" opacity="0.7" />
    <path d="M95,72 L98,69 M95,72 L92,75 M95,72 L98,75 M95,72 L92,69" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />
    
    <circle cx="75" cy="98" r="1" fill="#f43f5e" opacity="0.8" />
    <circle cx="60" cy="115" r="2" fill="#fbbf24" opacity="0.5" />
  </g>

  <!-- Foreground plant silhouette for framing depth -->
  <g id="foreground-frame" opacity="0.9">
    <path d="M0,240 Q15,200 10,180 Q8,170 0,165" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <path d="M5,210 Q25,205 30,190" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
    <path d="M10,180 C20,175 25,160 18,150 C12,145 2,160 10,180 Z" fill="#334155" />
    <path d="M25,195 C38,195 45,185 40,175 C35,168 22,175 25,195 Z" fill="#1e293b" />
  </g>
</svg>