<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Envelope Inner Gradient -->
    <linearGradient id="env-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Envelope Flap Gradient -->
    <linearGradient id="env-flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Acceptance Letter Gradient -->
    <linearGradient id="letter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light / Environment Details -->
  <!-- Subtle Desk / Surface -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.6"/>
  <ellipse cx="120" cy="200" rx="90" ry="15" fill="#020617" opacity="0.8"/>

  <!-- Confetti / Celebration Particles -->
  <circle cx="50" cy="70" r="3" fill="#38bdf8"/>
  <circle cx="190" cy="65" r="4" fill="#ec4899"/>
  <rect x="35" y="110" width="6" height="4" rx="1" fill="#fbbf24" transform="rotate(25 35 110)"/>
  <rect x="200" y="120" width="6" height="5" rx="1" fill="#10b981" transform="rotate(-15 200 120)"/>
  <circle cx="75" cy="150" r="2.5" fill="#a78bfa"/>
  <circle cx="170" cy="140" r="3" fill="#38bdf8"/>
  <path d="M 100 45 L 104 52 L 96 52 Z" fill="#fbbf24" transform="rotate(12 100 48)"/>
  <path d="M 145" y="55" d="M 145 55 L 149 62 L 141 62 Z" fill="#ec4899" transform="rotate(-30 145 58)"/>

  <!-- Background Glow behind the Letter -->
  <circle cx="120" cy="115" r="50" fill="#f59e0b" opacity="0.15" filter="url(#gold-glow)"/>

  <!-- --- ACCEPTANCE LETTER & ENVELOPE SCENE --- -->

  <!-- Envelope Back Flap / Pocket -->
  <path d="M 60 100 L 120 145 L 180 100 L 180 165 Q 180 170 175 170 L 65 170 Q 60 170 60 165 Z" fill="#d97706"/>

  <!-- Acceptance Letter (Sliding Out) -->
  <g transform="translate(0, -15)">
    <!-- Letter Base -->
    <rect x="75" y="60" width="90" height="95" rx="6" fill="url(#letter-grad)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Gold Wax Seal Badge (Success / Official Admission) -->
    <circle cx="120" cy="130" r="14" fill="#f59e0b" filter="url(#gold-glow)"/>
    <circle cx="120" cy="130" r="11" fill="#d97706"/>
    <!-- Star/Check Icon Inside Seal -->
    <path d="M 113 130 L 117 134 L 127 124" fill="none" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Letter Content Lines (Abstracted text/paragraphs) -->
    <rect x="90" y="75" width="60" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="90" y="90" width="45" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="90" y="100" width="52" height="4" rx="2" fill="#e2e8f0"/>
    
    <!-- Decorative Checkmark graphic on top of letter -->
    <circle cx="120" cy="55" r="16" fill="#10b981"/>
    <path d="M 113 55 L 118 60 L 128 49" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Envelope Front Pocket / Body -->
  <path d="M 60 100 L 120 145 L 180 100 L 180 168 Q 180 175 173 175 L 67 175 Q 60 175 60 168 Z" fill="url(#env-body)"/>

  <!-- Envelope Open Top Flap (Dynamic tilt upwards) -->
  <path d="M 60 100 L 120 60 L 180 100 Z" fill="url(#env-flap)" filter="url(#gold-glow)"/>
  <!-- Flap Inner Shadow Line -->
  <path d="M 62 100 L 120 63 L 178 100" fill="none" stroke="#e0a100" stroke-width="2"/>

  <!-- --- CONTEXT PROPS (Desk Environment) --- -->

  <!-- Graduation Cap (Mortarboard) on the side -->
  <g transform="translate(35, 155) scale(0.75)">
    <!-- Cap Top Diamond -->
    <polygon points="40,20 70,5 40,-10 10,5" fill="#334155"/>
    <polygon points="40,20 70,5 40,-10 10,5" fill="#1e293b" opacity="0.3"/>
    <!-- Cap Skull Cap Base -->
    <path d="M 25 13 L 25 28 Q 40 38 55 28 L 55 13 Z" fill="#0f172a"/>
    <!-- Tassel Button & String -->
    <circle cx="40" cy="5" r="3" fill="#fbbf24"/>
    <path d="M 40 5 Q 30 15 22 26" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="21" cy="27" r="2" fill="#f59e0b"/>
  </g>

  <!-- Acceptance / Success Trophy or Ribbon icon -->
  <g transform="translate(165, 145) scale(0.7)">
    <!-- Ribbon Tails -->
    <path d="M 25 35 L 15 55 L 25 50 L 35 55 Z" fill="#ec4899"/>
    <path d="M 35 35 L 45 55 L 35 50 L 25 55 Z" fill="#be185d"/>
    <!-- Rosette Base -->
    <circle cx="30" cy="25" r="16" fill="#f43f5e"/>
    <circle cx="30" cy="25" r="11" fill="#fb7185"/>
    <circle cx="30" cy="25" r="6" fill="#ffe4e6"/>
  </g>

  <!-- Sparkles / Success Highlights -->
  <g fill="#fbbf24">
    <!-- Star Top Right -->
    <path d="M 195 40 Q 195 48 203 48 Q 195 48 195 56 Q 195 48 187 48 Q 195 48 195 40 Z"/>
    <!-- Star Left -->
    <path d="M 45 75 Q 45 81 51 81 Q 45 81 45 87 Q 45 81 39 81 Q 45 81 45 75 Z"/>
    <!-- Star Bottom Center-Right -->
    <path d="M 145 185 Q 145 190 150 190 Q 145 190 145 195 Q 145 190 140 190 Q 145 190 145 185 Z" fill="#38bdf8"/>
  </g>

</svg>