<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Water/Sea Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Sky/Port Atmosphere -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Cargo Container Gold/Orange -->
    <linearGradient id="containerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cargo Container Teal -->
    <linearGradient id="containerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Cargo Container Coral -->
    <linearGradient id="containerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Crane Gradient -->
    <linearGradient id="craneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Scene Background: Port Sky & Warehouse Silhouettes -->
  <rect x="0" y="40" width="240" height="80" fill="url(#skyGrad)"/>
  
  <!-- Distant Cranes / Skyline -->
  <path d="M20 120 L20 70 L25 70 L25 120 Z" fill="#475569" opacity="0.5"/>
  <path d="M15 75 L45 65 L45 68 L15 78 Z" fill="#475569" opacity="0.5"/>
  <path d="M200 120 L200 60 L204 60 L204 120 Z" fill="#475569" opacity="0.5"/>
  <path d="M180 70 L210 60 L210 63 L180 73 Z" fill="#475569" opacity="0.5"/>

  <!-- Water Surface -->
  <rect x="0" y="165" width="240" height="75" fill="url(#waterGrad)"/>
  <!-- Water Waves / Reflections -->
  <path d="M0 175 Q 30 170, 60 175 T 120 175 T 180 175 T 240 175" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <path d="M0 185 Q 40 190, 80 185 T 160 185 T 240 185" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

  <!-- Large Cargo Ship Hull -->
  <g filter="url(#shadow)">
    <!-- Hull Base -->
    <path d="M 20 175 L 50 210 L 195 210 L 225 175 Z" fill="#0f172a"/>
    <!-- Hull Red Accent Line -->
    <path d="M 23 178 L 48 206 L 197 206 L 222 178 Z" fill="#dc2626"/>
    <!-- Deck -->
    <rect x="35" y="165" width="170" height="10" fill="#64748b"/>
    <!-- Ship Cabin / Bridge -->
    <rect x="160" y="125" width="45" height="40" fill="#cbd5e1" rx="2"/>
    <rect x="165" y="130" width="10" height="8" fill="#38bdf8" rx="1"/>
    <rect x="180" y="130" width="10" height="8" fill="#38bdf8" rx="1"/>
    <rect x="165" y="142" width="10" height="8" fill="#38bdf8" rx="1"/>
    <rect x="180" y="142" width="10" height="8" fill="#38bdf8" rx="1"/>
    <!-- Funnel -->
    <path d="M175 125 L175 112 L190 112 L190 125 Z" fill="#f43f5e"/>
    <rect x="173" y="110" width="19" height="4" fill="#0f172a" rx="1"/>
  </g>

  <!-- Giant Port Crane (Left side, looming over) -->
  <g filter="url(#shadow)">
    <!-- Crane Tower Vertical -->
    <path d="M 10 200 L 25 40 L 35 40 L 25 200 Z" fill="url(#craneGrad)"/>
    <!-- Crane Diagonal Struts (lattice pattern approximation) -->
    <path d="M15 160 L28 150 M17 140 L29 130 M19 120 L31 110 M21 100 L32 90 M23 80 L34 70" stroke="#b45309" stroke-width="2"/>
    <!-- Crane Boom Horizontal -->
    <path d="M 5 45 L 145 20 L 145 32 L 5 40 Z" fill="url(#craneGrad)"/>
    <!-- Crane Cab -->
    <rect x="22" y="38" width="16" height="16" fill="#334155" rx="2"/>
    <rect x="25" y="42" width="8" height="6" fill="#38bdf8"/>
    <!-- Counterweight -->
    <rect x="2" y="40" width="10" height="18" fill="#64748b" rx="2"/>
  </g>

  <!-- Heavy Cargo Containers stacked on Ship (Representing massive weight/tons) -->
  <g filter="url(#shadow)">
    <!-- Bottom Layer Containers -->
    <rect x="50" y="145" width="55" height="20" fill="url(#containerGrad1)" rx="1"/>
    <!-- Container Ribs/Details -->
    <line x1="60" y1="145" x2="60" y2="165" stroke="#b45309" stroke-width="2"/>
    <line x1="75" y1="145" x2="75" y2="165" stroke="#b45309" stroke-width="2"/>
    <line x1="90" y1="145" x2="90" y2="165" stroke="#b45309" stroke-width="2"/>

    <rect x="107" y="145" width="50" height="20" fill="url(#containerGrad2)" rx="1"/>
    <line x1="120" y1="145" x2="120" y2="165" stroke="#0e7490" stroke-width="2"/>
    <line x1="135" y1="145" x2="135" y2="165" stroke="#0e7490" stroke-width="2"/>
    <line x1="150" y1="145" x2="150" y2="165" stroke="#0e7490" stroke-width="2"/>

    <!-- Top Layer Container (Being hoisted / placed) -->
    <rect x="75" y="115" width="55" height="20" fill="url(#containerGrad3)" rx="1" transform="rotate(-2 75 115)"/>
    <line x1="88" y1="115" x2="87" y2="135" stroke="#be123c" stroke-width="2"/>
    <line x1="103" y1="115" x2="102" y2="135" stroke="#be123c" stroke-width="2"/>
    <line x1="118" y1="115" x2="117" y2="135" stroke="#be123c" stroke-width="2"/>
  </g>

  <!-- Crane Cable and Spreader Hook -->
  <g>
    <!-- Main Hoisting Cable -->
    <line x1="110" y1="30" x2="110" y2="110" stroke="#0f172a" stroke-width="3"/>
    <!-- Secondary Sling Cables -->
    <line x1="110" y1="110" x2="85" y2="115" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="110" y1="110" x2="115" y2="115" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Spreader Beam -->
    <rect x="80" y="110" width="40" height="4" fill="#334155" rx="1"/>
  </g>

  <!-- Foreground Pier Edge & Bollard (Anchoring context) -->
  <rect x="0" y="210" width="240" height="30" fill="#334155"/>
  <rect x="0" y="205" width="240" height="5" fill="#475569"/>
  
  <!-- Yellow Hazard Stripes on Pier -->
  <g opacity="0.8">
    <path d="M 20 205 L 30 210 L 25 210 L 15 205 Z" fill="#fbbf24"/>
    <path d="M 60 205 L 70 210 L 65 210 L 55 205 Z" fill="#fbbf24"/>
    <path d="M 100 205 L 110 210 L 105 210 L 95 205 Z" fill="#fbbf24"/>
    <path d="M 140 205 L 150 210 L 145 210 L 135 205 Z" fill="#fbbf24"/>
    <path d="M 180 205 L 190 210 L 185 210 L 175 205 Z" fill="#fbbf24"/>
    <path d="M 220 205 L 230 210 L 225 210 L 215 205 Z" fill="#fbbf24"/>
  </g>

  <!-- Pier Bollard with Mooring Rope -->
  <path d="M 220 210 C 220 195, 235 195, 235 210 Z" fill="#64748b" filter="url(#shadow)"/>
  <rect x="223" y="200" width="9" height="15" fill="#94a3b8" rx="2"/>
  <!-- Rope to Ship -->
  <path d="M 223 205 Q 180 190, 150 185" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Atmospheric Lighting Glow (Golden hour / industrious warm light) -->
  <circle cx="100" cy="50" r="40" fill="#fbbf24" opacity="0.1" filter="blur(20px)"/>
  <circle cx="190" cy="120" r="30" fill="#38bdf8" opacity="0.15" filter="blur(15px)"/>

  <!-- Dynamic Accent Particle/Spark (Action feel) -->
  <circle cx="68" cy="112" r="2" fill="#fbbf24"/>
  <circle cx="130" cy="118" r="1.5" fill="#fbbf24"/>
  <path d="M 65 130 L 70 128" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
</svg>