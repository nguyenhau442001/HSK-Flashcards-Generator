<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ground -->
  <path d="M0 200 Q120 180 240 200 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The "Accident" Scene: A spilled coffee mug and shattered ceramic -->
  <g transform="translate(120, 140)">
    <!-- Spilled Liquid -->
    <path d="M-60 40 C-40 20, 0 20, 20 40 C40 60, 80 50, 90 60 L100 80 L-80 80 Z" fill="#fb923c" opacity="0.8"/>
    
    <!-- Shattered Mug -->
    <path d="M-20 40 L-10 10 L10 10 L20 40 Z" fill="#f8fafc"/>
    <path d="M-25 35 L-35 25 L-25 15 Z" fill="#e2e8f0"/>
    <path d="M25 35 L35 25 L25 15 Z" fill="#e2e8f0"/>
    
    <!-- Broken Handle -->
    <path d="M20 20 C35 20, 35 35, 20 35" stroke="#f8fafc" stroke-width="4" fill="none"/>
  </g>
  
  <!-- The "Consequence": A laptop with a screen glitch/crack effect -->
  <g transform="translate(120, 100)">
    <rect x="-70" y="-60" width="140" height="90" rx="4" fill="#64748b"/>
    <rect x="-65" y="-55" width="130" height="80" rx="2" fill="#0f172a"/>
    <!-- Crack lines -->
    <path d="M-40 -30 L-10 0 L20 -20 L50 10" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 0 L0 20" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Floating debris/sparks for action -->
  <circle cx="50" cy="80" r="3" fill="#fbbf24"/>
  <circle cx="190" cy="70" r="4" fill="#38bdf8"/>
  <circle cx="180" cy="150" r="2" fill="#10b981"/>
</svg>