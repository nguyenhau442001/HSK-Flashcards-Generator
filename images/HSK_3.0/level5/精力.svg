<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>

    <!-- Energy Aura Gradient -->
    <linearGradient id="energy-glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5" />
    </linearGradient>

    <!-- Window City Glow -->
    <linearGradient id="window-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment & Window -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="140" y="25" width="75" height="95" rx="6" fill="url(#window-grad)" stroke="#475569" stroke-width="2" />
    <!-- City lights outside -->
    <rect x="150" y="45" width="12" height="15" rx="1" fill="#fde047" opacity="0.6" />
    <rect x="170" y="60" width="10" height="25" rx="1" fill="#38bdf8" opacity="0.4" />
    <rect x="190" y="40" width="14" height="40" rx="1" fill="#f472b6" opacity="0.5" />
    <rect x="150" y="75" width="15" height="30" rx="1" fill="#4ade80" opacity="0.3" />
    <!-- Window Grid Lines -->
    <line x1="140" y1="72" x2="215" y2="72" stroke="#475569" stroke-width="2" />
    <line x1="177" y1="25" x2="177" y2="120" stroke="#475569" stroke-width="2" />

    <!-- Bookshelf / Wall Decor -->
    <rect x="25" y="30" width="90" height="8" rx="2" fill="#334155" />
    <!-- Books on shelf -->
    <path d="M35 15h8v15h-8z" fill="#f43f5e" />
    <path d="M45 18h6v12h-6z" fill="#0ea5e9" />
    <path d="M53 12h10v18h-10z" fill="#10b981" />
    <path d="M70 16h7v14h-7z" fill="#f59e0b" />

    <!-- Large Office Plant -->
    <path d="M22 180 c0-20 15-30 15-50 c0 20 15 30 15 50 z" fill="#059669" />
    <path d="M15 165 c-10-15 -5-25 -15-40 c15 10 20 20 25 35 z" fill="#10b981" />
    <path d="M37 150 c10-20 25-15 35-30 c-10 15-20 20-30 30 z" fill="#34d399" />
    <ellipse cx="37" cy="180" rx="18" ry="10" fill="#475569" />
  </g>

  <!-- Work Desk & Equipment -->
  <g id="desk-and-props">
    <!-- Desk Surface -->
    <rect x="15" y="180" width="210" height="12" fill="#334155" rx="3" />
    <rect x="20" y="192" width="200" height="35" fill="#1e293b" />
    <!-- Desk Legs -->
    <rect x="35" y="192" width="10" height="35" fill="#0f172a" />
    <rect x="195" y="192" width="10" height="35" fill="#0f172a" />

    <!-- Laptop -->
    <path d="M70 165 h60 l8 15 h-76 z" fill="#64748b" />
    <rect x="80" y="130" width="40" height="35" rx="3" fill="#cbd5e1" />
    <!-- Laptop Screen Graphics (Charts/Code) -->
    <rect x="83" y="133" width="34" height="25" fill="#0f172a" />
    <polyline points="87,150 93,142 99,147 109,137" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="100" cy="165" r="1.5" fill="#94a3b8" />

    <!-- Coffee Mug with Steam -->
    <rect x="145" y="160" width="14" height="20" rx="2" fill="#f8fafc" />
    <path d="M159 164 c4 0 4 6 0 8" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
    <!-- Steam Lines -->
    <path d="M149 152 c-2-3 2-5 0-8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M155 150 c2-3 -2-5 0-8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Desk Lamp -->
    <path d="M190 180 l-15 -45 l10 -5" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M173 125 l14 -8 l5 12 l-14 8 z" fill="#f59e0b" />
    <ellipse cx="185" cy="120" rx="15" ry="5" fill="url(#lamp-glow)" />
  </g>

  <!-- Energetic Character (Male Worker Full of Vitality) -->
  <g id="energetic-character">
    <!-- Dynamic Energy Aura surrounding character -->
    <path d="M 85 190 Q 75 130 110 100 Q 145 130 135 190 Z" fill="url(#energy-glow)" />
    
    <!-- Floating Sparkles / Energy Particles -->
    <path d="M 70 120 L 73 125 L 78 128 L 73 131 L 70 136 L 67 131 L 62 128 L 67 125 Z" fill="#fef08a" />
    <path d="M 140 105 L 142 108 L 145 110 L 142 112 L 140 115 L 138 112 L 135 110 L 138 108 Z" fill="#38bdf8" />
    <circle cx="130" cy="135" r="2.5" fill="#f59e0b" />
    <circle cx="75" cy="155" r="2" fill="#38bdf8" />

    <!-- Chair Back -->
    <rect x="90" y="105" width="30" height="75" rx="8" fill="#334155" />
    <rect x="95" y="112" width="20" height="60" rx="4" fill="#475569" />

    <!-- Body / Torso (Leaning forward enthusiastically) -->
    <path d="M 85 145 Q 105 135 125 150 L 120 185 L 90 185 Z" fill="#2563eb" /> <!-- Blue Shirt -->
    <!-- Collar & Tie -->
    <path d="M 100 138 L 105 148 L 110 138 Z" fill="#ffffff" />
    <path d="M 105 148 L 104 168 L 106 168 Z" fill="#ef4444" />

    <!-- Arms in an energetic, confident gesture -->
    <!-- Left Arm (Flexing / Pumped) -->
    <path d="M 85 145 Q 65 130 75 110 Q 80 105 85 115 L 90 140 Z" fill="#2563eb" />
    <!-- Left Hand / Fist -->
    <circle cx="78" cy="107" r="8" fill="#fbcfe8" />
    
    <!-- Right Arm (Reaching out actively over laptop) -->
    <path d="M 122 152 Q 135 140 145 155" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
    <!-- Right Hand -->
    <circle cx="149" cy="159" r="7" fill="#fbcfe8" />

    <!-- Neck -->
    <rect x="99" y="130" width="12" height="15" fill="#fbcfe8" />

    <!-- Head (Dynamic tilt, smiling expression) -->
    <circle cx="105" cy="115" r="18" fill="#fbcfe8" />

    <!-- Hair (Stylized modern neat hair) -->
    <path d="M 88 115 C 88 100 100 95 112 100 C 120 103 123 112 123 112 C 123 112 118 98 105 97 C 92 96 88 108 88 115 Z" fill="#1e293b" />

    <!-- Facial Features (Expressive & Focused, Sparkly Eyes) -->
    <!-- Eyebrows (Determined / Enthusiastic angle) -->
    <line x1="96" y1="110" x2="103" y2="108" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="109" y1="108" x2="116" y2="110" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Eyes (Bright & Open) -->
    <circle cx="99" cy="114" r="2.5" fill="#0f172a" />
    <circle cx="113" cy="114" r="2.5" fill="#0f172a" />
    <!-- Eye Highlights -->
    <circle cx="100" cy="113" r="1" fill="#ffffff" />
    <circle cx="114" cy="113" r="1" fill="#ffffff" />

    <!-- Cheeks (Energetic flush) -->
    <ellipse cx="96" cy="119" rx="3" ry="1.5" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="116" cy="119" rx="3" ry="1.5" fill="#f43f5e" opacity="0.4" />

    <!-- Big Confident Smile -->
    <path d="M 100 121 Q 106 127 112 121" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground Ambient Lighting Layer -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="url(#lamp-glow)" style="mix-blend-mode: overlay; pointer-events: none;" />
</svg>