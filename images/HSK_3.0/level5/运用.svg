<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Workbench Surface -->
  <path d="M20 180 L220 180 L210 220 L30 220 Z" fill="#334155"/>
  
  <!-- The "Application" - A mechanical arm assembling a complex structure -->
  <!-- Base of the arm -->
  <circle cx="120" cy="180" r="15" fill="#475569"/>
  <rect x="112" y="120" width="16" height="60" rx="4" fill="#64748b"/>
  
  <!-- Mechanical Arm Joint -->
  <circle cx="120" cy="120" r="10" fill="#94a3b8"/>
  <path d="M120 120 L160 90" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  
  <!-- The "Knowledge" - Glowing geometric blocks being placed -->
  <rect x="150" y="70" width="20" height="20" rx="2" fill="#f59e0b"/>
  <rect x="155" y="75" width="10" height="10" rx="1" fill="#fbbf24"/>
  
  <!-- Target Construction -->
  <rect x="60" y="140" width="40" height="40" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="70" y="100" width="40" height="40" rx="4" fill="#10b981" opacity="0.8"/>
  <rect x="80" y="60" width="40" height="40" rx="4" fill="#ec4899" opacity="0.8"/>
  
  <!-- Sparks/Action effects -->
  <circle cx="160" cy="90" r="3" fill="#fb923c"/>
  <circle cx="165" cy="85" r="2" fill="#fb923c"/>
  
  <!-- Tools on table -->
  <rect x="30" y="190" width="30" height="10" rx="2" fill="#475569"/>
  <circle cx="200" cy="200" r="8" fill="#fb923c"/>
  <path d="M195 200 L205 200 M200 195 L200 205" stroke="#0f172a" stroke-width="2"/>
</svg>