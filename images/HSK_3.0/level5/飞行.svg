<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Stars -->
  <circle cx="30" cy="40" r="1" fill="#f8fafc" opacity="0.6"/>
  <circle cx="200" cy="30" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="150" cy="80" r="1" fill="#f8fafc" opacity="0.5"/>
  <circle cx="50" cy="180" r="1.2" fill="#f8fafc" opacity="0.7"/>
  
  <!-- Moon -->
  <circle cx="200" cy="60" r="15" fill="#fbbf24"/>
  <circle cx="208" cy="52" r="15" fill="#1e293b"/>
  
  <!-- Airplane -->
  <g transform="translate(120, 120) rotate(-15)">
    <path d="M-60 0 C-60 -10 -40 -15 -20 -15 L40 -5 L60 -5 L70 -15 L75 -15 L70 0 L75 15 L70 15 L60 5 L40 5 L-20 15 C-40 15 -60 10 -60 0 Z" fill="#38bdf8"/>
    <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#0f172a" opacity="0.3"/>
    <circle cx="-30" cy="0" r="4" fill="#fb923c"/>
  </g>
  
  <!-- Clock/Time representation -->
  <g transform="translate(40, 180)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#f59e0b"/>
  </g>
  
  <!-- Clouds -->
  <path d="M0 140 Q20 120 40 140 T80 140 T120 140 T160 140 T200 140 T240 140 L240 160 L0 160 Z" fill="#334155" opacity="0.4"/>
  <path d="M-20 160 Q10 140 40 160 T80 160 T120 160 T160 160 T200 160 T240 160 L240 180 L-20 180 Z" fill="#1e293b" opacity="0.6"/>
</svg>