<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Streetlight Glow -->
    <radialGradient id="lightGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Warm Light -->
    <linearGradient id="char1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Warm Light -->
    <linearGradient id="char2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Character 3 Warm Light -->
    <linearGradient id="char3Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Night Sky & Environment Elements -->
  <!-- Distant Windows / Cityscape background -->
  <g fill="#334155" opacity="0.4">
    <rect x="20" y="40" width="18" height="60" rx="2"/>
    <rect x="45" y="30" width="22" height="70" rx="2"/>
    <rect x="175" y="50" width="20" height="50" rx="2"/>
    <rect x="200" y="35" width="25" height="65" rx="2"/>
  </g>

  <!-- Glowing Windows -->
  <g fill="#fbbf24" opacity="0.3">
    <rect x="24" y="46" width="4" height="6" rx="1"/>
    <rect x="30" y="46" width="4" height="6" rx="1"/>
    <rect x="50" y="38" width="5" height="8" rx="1"/>
    <rect x="58" y="38" width="5" height="8" rx="1"/>
    <rect x="180" y="58" width="4" height="6" rx="1"/>
    <rect x="206" y="45" width="5" height="7" rx="1"/>
  </g>

  <!-- Streetlight & Cone of Light -->
  <path d="M120 15 L120 110" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 15 L128 15 L132 20 L108 20 Z" fill="#64748b"/>
  <polygon points="120,20 60,180 180,180" fill="url(#lightGlow)"/>
  <circle cx="120" cy="20" r="4" fill="#fbbf24" filter="url(#shadow)"/>

  <!-- Ground / Pavement -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <!-- Pavement stone lines -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="170" x2="40" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <line x1="180" y1="170" x2="200" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="170" x2="120" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>

  <!-- SCENE OBJECTS: Distinct pathway markers / directional divergence -->
  <!-- Dashed path lines showing people going separate ways -->
  <path d="M120 185 Q120 200 80 215" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M120 185 Q120 200 160 215" stroke="#fb923c" stroke-dasharray="4,4" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M120 185 L120 220" stroke="#34d399" stroke-dasharray="4,4" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- ==================== CHARACTER 1 (Moving Left towards home) ==================== -->
  <g transform="translate(45, 130)" filter="url(#shadow)">
    <!-- Shadow -->
    <ellipse cx="10" cy="55" rx="12" ry="4" fill="#000" opacity="0.4"/>
    <!-- Body / Jacket -->
    <path d="M3 25 L17 25 L21 45 L-1 45 Z" fill="url(#char1Grad)"/>
    <!-- Head & Hair -->
    <circle cx="10" cy="14" r="8" fill="#fcd34d"/>
    <path d="M2 12 Q10 4 18 12 Q16 7 10 7 Q4 7 2 12 Z" fill="#334155"/>
    <!-- Limbs (Walking pose: striding left) -->
    <!-- Back Leg -->
    <line x1="4" y1="45" x2="-2" y2="54" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <!-- Front Leg -->
    <line x1="14" y1="45" x2="20" y2="54" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <!-- Back Arm -->
    <line x1="3" y1="28" x2="-3" y2="36" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Front Arm holding bag -->
    <line x1="17" y1="28" x2="23" y2="35" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Prop: Small shopping bag -->
    <rect x="21" y="33" width="6" height="7" rx="1" fill="#ec4899"/>
    <path d="M22 33 Q24 30 26 33" stroke="#ec4899" stroke-width="1.5" fill="none"/>
  </g>

  <!-- ==================== CHARACTER 2 (Moving Right towards home) ==================== -->
  <g transform="translate(165, 125)" filter="url(#shadow)">
    <!-- Shadow -->
    <ellipse cx="10" cy="60" rx="12" ry="4" fill="#000" opacity="0.4"/>
    <!-- Body / Jacket -->
    <path d="M4 25 L16 25 L20 48 L0 48 Z" fill="url(#char2Grad)"/>
    <!-- Head & Hair / Cap -->
    <circle cx="10" cy="14" r="8" fill="#fcd34d"/>
    <path d="M3 11 L17 11 L19 14 L1 14 Z" fill="#ea580c"/>
    <!-- Limbs (Walking pose: striding right) -->
    <!-- Back Leg -->
    <line x1="6" y1="48" x2="12" y2="59" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
    <!-- Front Leg -->
    <line x1="14" y1="48" x2="21" y2="58" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
    <!-- Back Arm -->
    <line x1="5" y1="28" x2="1" y2="37" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Front Arm -->
    <line x1="15" y1="28" x2="21" y2="38" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Prop: Umbrella over shoulder -->
    <line x1="10" y1="35" x2="28" y2="15" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 18 Q25 15 28 15" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==================== CHARACTER 3 (Moving Forward/Center towards home) ==================== -->
  <g transform="translate(107, 138)" filter="url(#shadow)">
    <!-- Shadow -->
    <ellipse cx="13" cy="50" rx="10" ry="3.5" fill="#000" opacity="0.4"/>
    <!-- Body / Coat -->
    <path d="M5 22 L18 22 L21 42 L2 42 Z" fill="url(#char3Grad)"/>
    <!-- Head -->
    <circle cx="11" cy="12" r="7.5" fill="#fcd34d"/>
    <path d="M5 10 Q11 3 17 10 Z" fill="#065f46"/>
    <!-- Limbs (Walking straight towards viewer/background context) -->
    <!-- Left Leg -->
    <line x1="8" y1="42" x2="7" y2="50" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Right Leg -->
    <line x1="15" y1="42" x2="17" y2="49" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="5" y1="25" x2="1" y2="33" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="25" x2="22" y2="33" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <!-- Prop: Backpack -->
    <rect x="8" y="24" width="6" height="10" rx="2" fill="#0284c7"/>
  </g>

  <!-- Foreground Atmospheric Elements (Flashes of light / warm cozy vibe) -->
  <circle cx="30" cy="190" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="210" cy="200" r="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="95" cy="225" r="1" fill="#34d399" opacity="0.6"/>
  <circle cx="150" cy="210" r="1.5" fill="#fb923c" opacity="0.5"/>
</svg>