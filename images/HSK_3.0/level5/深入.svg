<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="150" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Magnifying Glass (The "Deep Research" tool) -->
  <g transform="translate(140, 100) rotate(-15)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#f59e0b" stroke-width="6"/>
    <circle cx="0" cy="0" r="28" fill="#1e293b" fill-opacity="0.5"/>
    <rect x="-6" y="30" width="12" height="40" fill="#475569"/>
    <circle cx="0" cy="70" r="8" fill="#475569"/>
  </g>

  <!-- Documents/Data -->
  <rect x="40" y="160" width="100" height="60" rx="4" fill="#cbd5e1"/>
  <line x1="50" y1="175" x2="120" y2="175" stroke="#94a3b8" stroke-width="4"/>
  <line x1="50" y1="190" x2="100" y2="190" stroke="#94a3b8" stroke-width="4"/>
  <line x1="50" y1="205" x2="130" y2="205" stroke="#94a3b8" stroke-width="4"/>

  <!-- Character (Researcher) -->
  <g transform="translate(70, 120)">
    <!-- Body -->
    <path d="M-20 80 Q0 40 20 80 L-20 80" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="25" fill="#fde68a"/>
    <!-- Glasses -->
    <rect x="-15" y="10" width="12" height="8" rx="2" fill="#1e293b"/>
    <rect x="3" y="10" width="12" height="8" rx="2" fill="#1e293b"/>
    <!-- Hair -->
    <path d="M-25 15 Q0 -10 25 15" fill="#fb923c"/>
  </g>

  <!-- Floating Data Points (The "Research" aspect) -->
  <circle cx="180" cy="40" r="6" fill="#10b981"/>
  <circle cx="200" cy="60" r="4" fill="#ec4899"/>
  <circle cx="170" cy="70" r="5" fill="#38bdf8"/>
  <path d="M180 40 L170 70" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M170 70 L200 60" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
</svg>