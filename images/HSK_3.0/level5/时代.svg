<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Cityscape silhouette -->
  <path d="M20 180 L60 140 L100 180 L140 130 L180 170 L220 150 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- Main Subject: A transition from analog to digital (The 'Era' concept) -->
  <!-- Old Era: A classic desk lamp and book -->
  <path d="M40 200 L80 200 L75 160 L45 160 Z" fill="#fb923c"/>
  <path d="M60 160 L60 130" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 130 C 60 110, 80 110, 80 130" fill="#f59e0b"/>
  
  <!-- New Era: Holographic digital interface -->
  <g transform="translate(120, 80)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M-40 -40 L-20 -20 M40 40 L20 20 M-40 40 L-20 20 M40 -40 L20 -20" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#fbbf24"/>
  </g>
  
  <!-- Floating particles representing progress -->
  <circle cx="180" cy="50" r="3" fill="#fbbf24"/>
  <circle cx="190" cy="70" r="2" fill="#38bdf8"/>
  <circle cx="210" cy="40" r="4" fill="#10b981"/>
  <circle cx="30" cy="60" r="2" fill="#ec4899"/>
</svg>