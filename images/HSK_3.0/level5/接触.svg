<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="objectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment / Studio Room -->
  <!-- Floor -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="#090d16"/>
  
  <!-- Back Wall Details & Window Frame -->
  <rect x="140" y="30" width="70" height="110" rx="4" fill="#334155" opacity="0.3"/>
  <rect x="145" y="35" width="60" height="100" rx="2" fill="#0f172a"/>
  <!-- Window Panes -->
  <line x1="175" y1="35" x2="175" y2="135" stroke="#334155" stroke-width="2"/>
  <line x1="145" y1="85" x2="205" y2="85" stroke="#334155" stroke-width="2"/>

  <!-- Light Beam streaming in from the window -->
  <polygon points="145,35 205,35 240,180 100,180" fill="url(#lightBeam)"/>

  <!-- Shelves with New/Interesting Objects (representing "new things" / 新事物) -->
  <rect x="25" y="50" width="80" height="6" rx="3" fill="#475569"/>
  <!-- Globe on Shelf -->
  <circle cx="45" cy="38" r="12" fill="#38bdf8" opacity="0.8"/>
  <path d="M 39 35 Q 45 42 51 37" stroke="#0f172a" stroke-width="1.5" fill="none"/>
  <path d="M 45 26 L 45 50" stroke="#64748b" stroke-width="2"/>
  <rect x="41" y="50" width="8" height="2" fill="#64748b"/>
  <!-- Pottery/Vase on Shelf -->
  <path d="M 75 50 C 70 45, 80 40, 78 35 C 76 33, 80 30, 82 35 C 84 40, 90 45, 85 50 Z" fill="#fb923c"/>

  <!-- Desk Surface -->
  <rect x="50" y="150" width="150" height="8" rx="2" fill="#475569"/>
  <rect x="70" y="158" width="10" height="35" fill="#334155"/>
  <rect x="170" y="158" width="10" height="35" fill="#334155"/>

  <!-- Potted Plant (Nature/New Life context) -->
  <path d="M 190 150 C 190 140, 205 140, 205 150 Z" fill="#cbd5e1"/>
  <path d="M 197 140 Q 185 125 180 115" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 198 140 Q 210 120 215 110" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 197 140 Q 197 120 197 105" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="180" cy="115" r="5" fill="#34d399"/>
  <circle cx="215" cy="110" r="6" fill="#34d399"/>
  <circle cx="197" cy="103" r="7" fill="#34d399"/>

  <!-- MAIN CHARACTER INTERACTING WITH A "NEW THING" (接触新事物) -->
  <g filter="url(#softShadow)">
    <!-- Character Body & Torso -->
    <path d="M 100 170 C 100 150, 120 145, 135 155 L 140 180 L 95 180 Z" fill="url(#sweaterGrad)"/>
    
    <!-- Character Neck & Head -->
    <rect x="113" y="132" width="12" height="16" rx="6" fill="#fcd34d"/>
    <!-- Head Circle -->
    <circle cx="119" cy="116" r="18" fill="#fcd34d"/>
    
    <!-- Hair Style -->
    <path d="M 101 115 C 101 100, 137 100, 137 115 C 137 120, 135 125, 135 125 L 103 125 C 103 125, 101 120, 101 115 Z" fill="#1e293b"/>
    <path d="M 101 114 Q 110 102 125 104 Q 137 106 137 115" fill="#1e293b"/>

    <!-- Facial Expression (Curious, engaged, smiling) -->
    <!-- Eyes -->
    <circle cx="113" cy="116" r="2" fill="#0f172a"/>
    <circle cx="125" cy="116" r="2" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M 117 122 Q 119 125 121 122" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="110" cy="120" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="128" cy="120" r="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Arms reaching forward to touch/explore -->
    <!-- Left arm (supporting/gesture) -->
    <path d="M 100 155 Q 85 160, 90 170" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Right arm reaching out to touch the new object -->
    <path d="M 130 155 Q 145 150, 155 140" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="158" cy="138" r="4" fill="#fcd34d"/>
  </g>

  <!-- THE "NEW THING" BEING DISCOVERED / TOUCHED (Glowing abstract geometric sculpture / futuristic mechanism) -->
  <g transform="translate(165, 115)" filter="url(#glow)">
    <!-- Floating mystical/tech artifact representing 'new things' -->
    <circle cx="0" cy="0" r="18" fill="url(#objectGrad)" opacity="0.2"/>
    
    <!-- Inner Rotating-style rings -->
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="none" stroke="#fbbf24" stroke-width="2.5" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="none" stroke="#38bdf8" stroke-width="2.5" transform="rotate(-30)"/>
    
    <!-- Central Glowing Core -->
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Sparkles / Wonder Effects around the new object -->
  <g fill="#fbbf24">
    <path d="M 150 90 L 152 95 L 157 97 L 152 99 L 150 104 L 148 99 L 143 97 L 148 95 Z" transform="scale(0.6) translate(100, 30)"/>
    <path d="M 195 105 L 196.5 108 L 200 109.5 L 196.5 111 L 195 114 L 193.5 111 L 190 109.5 L 193.5 108 Z" fill="#38bdf8"/>
    <circle cx="140" cy="130" r="1.5" fill="#38bdf8"/>
    <circle cx="178" cy="95" r="2" fill="#fb923c"/>
  </g>

  <!-- Ground shadow for character -->
  <ellipse cx="120" cy="180" rx="35" ry="5" fill="#020617" opacity="0.6"/>

</svg>