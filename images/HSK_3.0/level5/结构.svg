<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Blueprint Glow / Ambient Lighting -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Light for Scaffold/Model -->
    <linearGradient id="scaffoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Structural Element Gradients -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#ambientGlow)"/>

  <!-- Subtle Architectural Blueprint Grid in Background -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="3 3">
    <line x1="30" y1="20" x2="30" y2="220"/>
    <line x1="80" y1="20" x2="80" y2="220"/>
    <line x1="130" y1="20" x2="130" y2="220"/>
    <line x1="180" y1="20" x2="180" y2="220"/>
    <line x1="210" y1="20" x2="210" y2="220"/>

    <line x1="20" y1="40" x2="220" y2="40"/>
    <line x1="20" y1="90" x2="220" y2="90"/>
    <line x1="20" y1="140" x2="220" y2="140"/>
    <line x1="20" y1="190" x2="220" y2="190"/>
  </g>

  <!-- Architectural Desk Surface -->
  <path d="M 10 195 L 230 195 L 220 220 L 20 220 Z" fill="#090d16" opacity="0.8"/>
  <rect x="20" y="195" width="200" height="4" rx="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Props on Desk: Drafting Tools, Paper -->
  <!-- Rolled blueprints / papers -->
  <g transform="translate(170, 175) rotate(-15)">
    <rect x="0" y="0" width="35" height="20" rx="4" fill="#cbd5e1" filter="url(#dropShadow)"/>
    <rect x="0" y="0" width="35" height="5" fill="#f8fafc" rx="2"/>
    <path d="M 10 0 L 10 20" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <!-- Compass / Divider Tool -->
  <g transform="translate(45, 170)">
    <line x1="10" y1="0" x2="0" y2="25" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="20" y2="25" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="10" cy="0" r="3" fill="#fbbf24"/>
  </g>

  <!-- MAIN SCENE SUBJECT: The 3D Architectural / Logical Structure Model -->
  <g filter="url(#dropShadow)" transform="translate(0, 5)">
    
    <!-- Base Platform of the Model -->
    <path d="M 120 155 L 175 130 L 120 105 L 65 130 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <path d="M 65 130 L 120 155 L 120 175 L 65 150 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 120 155 L 175 130 L 175 150 L 120 175 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Structural Pillar Connections (Wireframe & Beams) -->
    <!-- Vertical Core Pillars -->
    <line x1="95" y1="120" x2="95" y2="70" stroke="url(#beamGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="145" y1="120" x2="145" y2="70" stroke="url(#beamGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="135" x2="120" y2="85" stroke="url(#beamGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Diagonal Brace Struts (Showing 'Cấu trúc' / Framework) -->
    <line x1="95" y1="110" x2="120" y2="125" stroke="#fbbf24" stroke-width="3"/>
    <line x1="145" y1="110" x2="120" y2="125" stroke="#fbbf24" stroke-width="3"/>
    <line x1="95" y1="90" x2="120" y2="105" stroke="#fbbf24" stroke-width="3"/>
    <line x1="145" y1="90" x2="120" y2="105" stroke="#fbbf24" stroke-width="3"/>

    <line x1="95" y1="75" x2="120" y2="60" stroke="#fbbf24" stroke-width="3"/>
    <line x1="145" y1="75" x2="120" y2="60" stroke="#fbbf24" stroke-width="3"/>

    <!-- Floating Top Crown / Roof Elements -->
    <g transform="translate(0, -10)">
      <path d="M 120 55 L 165 75 L 120 95 L 75 75 Z" fill="#10b981" stroke="#34d399" stroke-width="2" opacity="0.9"/>
      <!-- Inner geometric cut-out in roof plate -->
      <path d="M 120 65 L 145 75 L 120 85 L 95 75 Z" fill="#065f46"/>
    </g>

    <!-- Floating Floating Interactive Nodes (Golden Orbs & Pink Connectors) -->
    <!-- Node 1 (Left) -->
    <circle cx="75" cy="95" r="7" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <circle cx="75" cy="95" r="3" fill="#ffffff"/>
    
    <!-- Node 2 (Right) -->
    <circle cx="165" cy="95" r="7" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <circle cx="165" cy="95" r="3" fill="#ffffff"/>

    <!-- Node 3 (Top Peak) -->
    <circle cx="120" cy="40" r="9" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="120" cy="40" r="4" fill="#ffffff"/>

    <!-- Connecting Energy Arcs / Blueprint Lines -->
    <path d="M 75 95 Q 120 70 120 40" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
    <path d="M 165 95 Q 120 70 120 40" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>

    <!-- Central Glowing Core Object -->
    <polygon points="120,78 132,85 132,100 120,107 108,100 108,85" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>
    <polygon points="120,82 128,87 128,98 120,103 112,98 112,87" fill="#bae6fd"/>

  </g>

  <!-- Foreground Atmospheric Elements / Sparkles for Action & Polish -->
  <g fill="#38bdf8">
    <circle cx="50" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="190" cy="65" r="2" opacity="0.8"/>
    <circle cx="185" cy="140" r="1" opacity="0.5"/>
    <circle cx="55" cy="145" r="2" opacity="0.7"/>
  </g>
  <g fill="#fbbf24">
    <polygon points="100,30 102,35 107,37 102,39 100,44 98,39 93,37 98,35" opacity="0.9"/>
    <polygon points="150,110 151,113 154,114 151,115 150,118 149,115 146,114 149,113" opacity="0.7"/>
  </g>

</svg>