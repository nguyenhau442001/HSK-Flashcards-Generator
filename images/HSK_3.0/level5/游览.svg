<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Sky/Atmosphere Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>

    <!-- Great Wall Brick Gradient -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Mountains Gradient -->
    <linearGradient id="mountain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="mountain-far" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Sky & Sun -->
  <rect width="240" height="240" rx="24" fill="url(#sky-grad)"/>
  <circle cx="190" cy="55" r="22" fill="#fbbf24" opacity="0.2" filter="url(#glow)"/>
  <circle cx="190" cy="55" r="14" fill="#fbbf24" opacity="0.9"/>

  <!-- Distant Mountains / Rolling Hills -->
  <path d="M-10 160 Q 40 100, 100 130 T 250 110 L 250 240 L -10 240 Z" fill="url(#mountain-far)" opacity="0.7"/>
  <path d="M-10 180 Q 70 120, 140 160 T 250 140 L 250 240 L -10 240 Z" fill="url(#mountain-grad)"/>

  <!-- The Great Wall (Winding structure representing tourism/游览) -->
  <!-- Segment 1: Background winding path -->
  <path d="M 20 180 Q 90 150, 150 120 L 165 135 Q 110 160, 35 195 Z" fill="#b45309"/>
  
  <!-- Segment 2: Main foreground wall structure -->
  <path d="M 0 210 Q 70 170, 130 140 L 145 155 Q 85 185, 15 225 Z" fill="url(#wall-grad)"/>
  
  <!-- Wall top platform -->
  <path d="M 0 203 Q 70 163, 130 133 L 135 137 Q 75 167, 5 207 Z" fill="#fde68a" opacity="0.3"/>

  <!-- Watchtower on the Great Wall -->
  <g transform="translate(115, 95)">
    <!-- Tower Base -->
    <rect x="0" y="20" width="35" height="35" fill="#d97706"/>
    <!-- Tower Roof -->
    <path d="M -4 20 L 17.5 5 L 39 20 Z" fill="#b91c1c"/>
    <!-- Crenellations on Tower -->
    <rect x="3" y="14" width="5" height="6" fill="#b45309"/>
    <rect x="15" y="14" width="5" height="6" fill="#b45309"/>
    <rect x="27" y="14" width="5" height="6" fill="#b45309"/>
    <!-- Window/Gate -->
    <path d="M 12 35 Q 17.5 28, 23 35 L 23 55 L 12 55 Z" fill="#0f172a"/>
  </g>

  <!-- Farther Watchtower silhouette -->
  <g transform="translate(40, 135) scale(0.6)">
    <rect x="0" y="20" width="35" height="35" fill="#b45309"/>
    <path d="M -4 20 L 17.5 5 L 39 20 Z" fill="#991b1b"/>
  </g>

  <!-- Decorative Bricks pattern lines -->
  <path d="M 15 212 Q 75 178, 135 145" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 3" fill="none"/>
  <path d="M 8 217 Q 68 183, 128 150" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 3" fill="none"/>

  <!-- Foreground Characters (Tourists actively sightseeing/游览) -->
  <!-- Character 1: Person taking photo / pointing -->
  <g transform="translate(75, 150)">
    <!-- Backpack -->
    <rect x="2" y="12" width="10" height="14" rx="3" fill="#ec4899"/>
    <!-- Body -->
    <path d="M 5 10 Q 12 10, 15 28 L 5 30 Z" fill="#38bdf8"/>
    <!-- Head & Hat -->
    <circle cx="10" cy="4" r="6" fill="#fde047"/>
    <path d="M 3 2 Q 10 -1, 18 2 L 15 5 L 5 5 Z" fill="#f97316"/> <!-- Sun hat -->
    <!-- Arm pointing/holding camera -->
    <path d="M 12 14 L 22 18" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="7" y1="30" x2="5" y2="45" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="13" y1="30" x2="16" y2="44" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Character 2: Companion looking with binoculars / cheerful -->
  <g transform="translate(50, 162)">
    <!-- Backpack -->
    <rect x="14" y="10" width="9" height="13" rx="3" fill="#10b981"/>
    <!-- Body -->
    <path d="M 5 10 Q 12 8, 12 28 L 2 27 Z" fill="#a855f7"/>
    <!-- Head -->
    <circle cx="8" cy="4" r="5.5" fill="#fde047"/>
    <!-- Ponytail -->
    <path d="M 13 3 Q 17 5, 14 8" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Arms raised excitedly -->
    <path d="M 3 14 L -3 10" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <path d="M 11 14 L 18 10" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="5" y1="27" x2="3" y2="40" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="27" x2="11" y2="39" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Environment Props: Flying swallows/birds in the sky -->
  <path d="M 120 40 Q 126 34, 132 40 Q 138 34, 144 40 Q 138 37, 132 42 Q 126 37, 120 40 Z" fill="#94a3b8" opacity="0.8"/>
  <path d="M 95 60 Q 99 55, 103 60 Q 107 55, 111 60 Q 107 57, 103 62 Q 99 57, 95 60 Z" fill="#94a3b8" opacity="0.6"/>

  <!-- Foreground decorative pine branch framing the top corner -->
  <path d="M 0 0 Q 30 10, 45 35 Q 20 25, 0 15 Z" fill="#065f46"/>
  <circle cx="35" cy="25" r="4" fill="#047857"/>
  <circle cx="25" cy="15" r="5" fill="#047857"/>
  <circle cx="42" cy="12" r="3.5" fill="#047857"/>
</svg>