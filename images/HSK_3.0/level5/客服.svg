<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="30" y="140" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="155" width="10" height="60" fill="#475569"/>
  <rect x="190" y="155" width="10" height="60" fill="#475569"/>
  
  <!-- User Character -->
  <g transform="translate(50, 80)">
    <circle cx="30" cy="30" r="25" fill="#fde68a"/>
    <path d="M15 35 Q30 45 45 35" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="20" cy="25" r="3" fill="#1e293b"/>
    <circle cx="40" cy="25" r="3" fill="#1e293b"/>
    <rect x="0" y="60" width="60" height="80" rx="10" fill="#60a5fa"/>
  </g>
  
  <!-- Laptop Screen -->
  <rect x="110" y="70" width="90" height="65" rx="5" fill="#e2e8f0"/>
  <rect x="115" y="75" width="80" height="55" rx="2" fill="#0f172a"/>
  <!-- Chat bubbles on screen -->
  <rect x="125" y="85" width="30" height="8" rx="2" fill="#38bdf8"/>
  <rect x="155" y="100" width="30" height="8" rx="2" fill="#10b981"/>
  
  <!-- Support Agent Character (Headset) -->
  <g transform="translate(160, 130)">
    <circle cx="20" cy="20" r="18" fill="#fbbf24"/>
    <rect x="5" y="15" width="30" height="20" rx="5" fill="#f59e0b"/>
    <path d="M10 20 A10 10 0 0 1 30 20" stroke="#1e293b" stroke-width="3" fill="none"/>
    <circle cx="10" cy="20" r="4" fill="#1e293b"/>
    <circle cx="30" cy="20" r="4" fill="#1e293b"/>
    <path d="M35 25 L45 35" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="6" fill="#ec4899" opacity="0.6"/>
  <rect x="30" y="40" width="10" height="10" rx="2" fill="#fb923c" opacity="0.5" transform="rotate(20)"/>
</svg>