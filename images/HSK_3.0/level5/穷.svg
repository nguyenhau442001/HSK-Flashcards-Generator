<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Atmosphere -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Wood Texture / Surface Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Cardboard/Patch Gradients -->
    <linearGradient id="cardboard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cardboardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  
  <!-- Atmospheric Glow -->
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- Background Room Details -->
  <!-- Wallpaper cracks & old wall texture -->
  <path d="M70 20 L65 50 L68 80" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M170 40 L178 70 L172 100" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <circle cx="168" cy="85" r="12" fill="#1e293b" opacity="0.5" /> <!-- Stain on wall -->

  <!-- Simple Hanging Bulb on a Wire -->
  <path d="M120 0 L120 45" stroke="#475569" stroke-width="2" />
  <circle cx="120" cy="48" r="6" fill="#fbbf24" filter="url(#shadow)" />
  <path d="M113 42 L127 42 L124 48 L116 48 Z" fill="#94a3b8" />

  <!-- Wooden Floor Surface -->
  <rect x="0" y="190" width="240" height="50" fill="url(#floorGrad)" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- SCENE: Dilapidated Humble Room (Representing Scarcity/Poverty) -->
  
  <!-- 1. Makeshift Table (Wooden Crate & Wobbly Leg) -->
  <g transform="translate(45, 120)">
    <!-- Table shadow -->
    <ellipse cx="45" cy="72" rx="42" ry="8" fill="#000000" opacity="0.4" />
    
    <!-- Crate Body (Main rustic box) -->
    <rect x="15" y="30" width="60" height="40" rx="3" fill="url(#cardboard)" filter="url(#shadow)" />
    <!-- Wooden Planks Detail -->
    <line x1="15" y1="43" x2="75" y2="43" stroke="#92400e" stroke-width="2" />
    <line x1="15" y1="57" x2="75" y2="57" stroke="#92400e" stroke-width="2" />
    <line x1="45" y1="30" x2="45" y2="70" stroke="#92400e" stroke-width="2" />
    <!-- Nail heads -->
    <circle cx="20" cy="36" r="1.5" fill="#78350f" />
    <circle cx="70" cy="36" r="1.5" fill="#78350f" />
    <circle cx="20" cy="64" r="1.5" fill="#78350f" />
    <circle cx="70" cy="64" r="1.5" fill="#78350f" />

    <!-- Wobbly Uneven Table Legs -->
    <rect x="18" y="70" width="5" height="15" fill="#78350f" />
    <rect x="67" y="70" width="5" height="12" fill="#78350f" /> <!-- Shorter leg showing wear -->
    <path d="M64 82 L75 82 L72 85 L64 85 Z" fill="#475569" /> <!-- Makeshift wedge under leg -->
  </g>

  <!-- 2. Minimalist/Sparse Meal on Table -->
  <g transform="translate(65, 115)">
    <!-- Simple Bowl -->
    <path d="M15 35 C15 45, 35 45, 35 35 Z" fill="#cbd5e1" filter="url(#shadow)" />
    <ellipse cx="25" cy="35" rx="10" ry="3" fill="#e2e8f0" />
    <!-- Plain Rice/Gruel inside -->
    <ellipse cx="25" cy="35" rx="8" ry="2" fill="#f8fafc" />

    <!-- Pair of worn wooden chopsticks -->
    <line x1="32" y1="20" x2="18" y2="38" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
    <line x1="35" y1="22" x2="21" y2="40" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />

    <!-- Empty/Cracked Plate with single small bun (mantou) -->
    <ellipse cx="55" cy="38" rx="14" ry="5" fill="#cbd5e1" />
    <path d="M48 35 C48 30, 62 30, 62 35 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1" />
    <path d="M53 32 C55 33, 55 35, 53 36" stroke="#ca8a04" stroke-width="0.75" fill="none" /> <!-- Crack on bun -->
  </g>

  <!-- 3. Patched / Tattered Stool -->
  <g transform="translate(150, 145)">
    <!-- Stool shadow -->
    <ellipse cx="20" cy="47" rx="20" ry="6" fill="#000000" opacity="0.4" />
    <!-- Legs -->
    <line x1="8" y1="25" x2="2" y2="45" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
    <line x1="32" y1="25" x2="38" y2="45" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="25" x2="20" y2="45" stroke="#92400e" stroke-width="3" stroke-linecap="round" />
    
    <!-- Seat -->
    <ellipse cx="20" cy="23" rx="22" ry="7" fill="url(#cardboard)" filter="url(#shadow)" />
    <!-- Patch on seat (showing poverty/repair) -->
    <path d="M12 20 Q18 17 24 21 Q20 26 12 20 Z" fill="#64748b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="21" r="0.5" fill="#1e293b" />
    <circle cx="21" cy="22" r="0.5" fill="#1e293b" />
  </g>

  <!-- 4. Stack of Cardboard Boxes / Storage in Background (Humble living) -->
  <g transform="translate(150, 90)">
    <!-- Box 1 (Bottom) -->
    <rect x="0" y="30" width="45" height="40" fill="url(#cardboard)" filter="url(#shadow)" />
    <path d="M0 30 L10 20 L55 20 L45 30 Z" fill="url(#cardboardLight)" />
    <!-- Tape/Seal across box -->
    <rect x="20" y="20" width="8" height="50" fill="#a16207" opacity="0.7" />

    <!-- Box 2 (Top, smaller, tilted slightly) -->
    <g transform="translate(5, -15) rotate(-5)">
      <rect x="0" y="10" width="35" height="30" fill="url(#cardboard)" filter="url(#shadow)" />
      <path d="M0 10 L8 0 L43 0 L35 10 Z" fill="url(#cardboardLight)" />
      <!-- Torn flap -->
      <path d="M8 0 L15 -8 L22 0 Z" fill="#b45309" />
    </g>
  </g>

  <!-- 5. Hanging Old Coat on Wall Hook -->
  <g transform="translate(25, 60)">
    <!-- Wall Hook -->
    <circle cx="10" cy="5" r="3" fill="#64748b" />
    <path d="M7 5 C7 10, 15 10, 15 5" stroke="#475569" stroke-width="2" fill="none" />
    
    <!-- Worn, patched jacket -->
    <path d="M2 10 Q10 8 18 10 L25 45 L15 50 L10 45 L5 50 L-1 45 Z" fill="#334155" filter="url(#shadow)" />
    <!-- Collar -->
    <path d="M7 10 L10 16 L13 10" stroke="#64748b" stroke-width="2" fill="none" />
    <!-- Patch on elbow/body -->
    <rect x="12" y="25" width="8" height="10" rx="2" fill="#475569" transform="rotate(10 16 30)" />
    <path d="M12 25 L20 27 L18 35 L12 33 Z" fill="#64748b" opacity="0.8" />
  </g>

  <!-- 6. Floor Details: Cardboard Scrap & Old Tin Can -->
  <!-- Tin Can -->
  <g transform="translate(95, 175)">
    <ellipse cx="8" cy="15" rx="7" ry="3" fill="#334155" />
    <rect x="1" y="5" width="14" height="12" fill="#64748b" />
    <ellipse cx="8" cy="5" rx="7" ry="3" fill="#94a3b8" />
    <!-- Dents in can -->
    <path d="M3 8 C5 10, 5 12, 3 14" stroke="#334155" stroke-width="1.5" fill="none" />
  </g>

  <!-- Ambient Dust/Particulate specks in the warm light -->
  <circle cx="90" cy="80" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="110" cy="100" r="1" fill="#fbbf24" opacity="0.4" />
  <circle cx="135" cy="75" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="100" cy="130" r="1" fill="#fbbf24" opacity="0.3" />

  <!-- Outer Rounded Border for Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>