<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Café Glow Gradient -->
    <radialGradient id="cafeGlow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172033" />
    </linearGradient>

    <!-- Character 1 Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Character 2 Skin Gradient -->
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Café Interior Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#cafeGlow)" />

  <!-- Background Environment: Cozy Café Interior -->
  <g id="environment">
    <!-- Wooden Wall Panelling / Back Wall -->
    <rect x="15" y="15" width="210" height="150" rx="8" fill="#131c31" />
    
    <!-- Warm Accent Light Strip on Wall -->
    <rect x="25" y="25" width="190" height="3" rx="1.5" fill="#334155" opacity="0.5" />

    <!-- Window showing night outside with soft bokeh lights -->
    <g id="window">
      <rect x="145" y="35" width="65" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
      <!-- Window Panes -->
      <line x1="177.5" y1="35" x2="177.5" y2="120" stroke="#334155" stroke-width="1.5" />
      <line x1="145" y1="77.5" x2="210" y2="77.5" stroke="#334155" stroke-width="1.5" />
      <!-- Bokeh City Lights outside -->
      <circle cx="160" cy="50" r="3" fill="#38bdf8" opacity="0.6" />
      <circle cx="195" cy="65" r="4" fill="#f59e0b" opacity="0.5" />
      <circle cx="155" cy="95" r="2.5" fill="#ec4899" opacity="0.4" />
      <circle cx="190" cy="105" r="3.5" fill="#10b981" opacity="0.5" />
    </g>

    <!-- Hanging Pendant Lamp -->
    <path d="M 85 15 L 85 45" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <path d="M 70 45 L 100 45 L 105 55 L 65 55 Z" fill="#38bdf8" opacity="0.8" />
    <ellipse cx="85" cy="55" rx="20" ry="8" fill="#fbbf24" opacity="0.4" />
    <!-- Cone of light from lamp -->
    <polygon points="85,55 25,165 145,165" fill="#fbbf24" opacity="0.04" />

    <!-- Wooden Café Table -->
    <path d="M 15 160 Q 120 150 225 160 L 230 195 Q 120 205 10 195 Z" fill="#2d1b14" />
    <path d="M 20 163 Q 120 153 220 163 L 223 169 Q 120 159 17 169 Z" fill="#45261c" />
    <!-- Table Legs -->
    <rect x="40" y="195" width="10" height="35" rx="3" fill="#1a0f0b" />
    <rect x="190" y="195" width="10" height="35" rx="3" fill="#1a0f0b" />

    <!-- Table Props -->
    <!-- Coffee Cup 1 -->
    <rect x="45" y="148" width="16" height="18" rx="2" fill="#f8fafc" />
    <path d="M 61 152 C 66 152 66 162 61 162" stroke="#f8fafc" stroke-width="2" fill="none" />
    <!-- Coffee Saucer -->
    <ellipse cx="53" cy="167" rx="12" ry="3" fill="#cbd5e1" />
    <!-- Small Plant in Pot -->
    <path d="M 195 145 L 205 145 L 208 160 L 192 160 Z" fill="#0284c7" />
    <circle cx="198" cy="140" r="8" fill="#10b981" />
    <circle cx="204" cy="136" r="6" fill="#34d399" />
  </g>

  <!-- Foreground Characters (The "She" and "I") -->
  <g id="characters">
    <!-- Character 1 (Me / POV character seated on the left) -->
    <g id="character-me">
      <!-- Body & Hoodie -->
      <path d="M 35 210 C 35 175 55 165 75 165 C 95 165 115 175 115 210 Z" fill="#0284c7" />
      <!-- Hoodie Collar -->
      <path d="M 55 165 L 75 180 L 95 165" fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round" />
      <!-- Neck -->
      <rect x="67" y="148" width="16" height="20" rx="6" fill="url(#skinGrad)" />
      <!-- Head -->
      <circle cx="75" cy="130" r="22" fill="url(#skinGrad)" />
      <!-- Hair (Dark, stylized) -->
      <path d="M 54 130 C 53 110 60 106 75 106 C 90 106 97 110 96 135 C 92 130 88 116 75 116 C 62 116 57 125 54 130 Z" fill="#1e293b" />
      <!-- Gentle Attentive Eyes (Looking right towards Her) -->
      <circle cx="82" cy="128" r="2" fill="#1e293b" />
      <!-- Friendly Open Expression -->
      <path d="M 80 137 Q 85 141 89 137" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
      <!-- Hand resting on table -->
      <circle cx="95" cy="162" r="8" fill="url(#skinGrad)" />
    </g>

    <!-- Character 2 ("Cô ấy" / She - smiling softly, seated across) -->
    <g id="character-she">
      <!-- Torso & Warm Knit Sweater -->
      <path d="M 130 210 C 130 170 148 160 168 160 C 188 160 206 170 206 210 Z" fill="#ec4899" />
      <!-- Sweater Neckline -->
      <path d="M 153 160 Q 168 172 183 160" fill="none" stroke="#db2777" stroke-width="3" stroke-linecap="round" />
      <!-- Neck -->
      <rect x="160" y="142" width="16" height="20" rx="6" fill="url(#skinGrad2)" />
      <!-- Head -->
      <circle cx="168" cy="122" r="23" fill="url(#skinGrad2)" />
      
      <!-- Flowing Dark Hair -->
      <path d="M 144 120 C 143 100 152 94 168 94 C 184 94 193 100 192 135 C 192 145 187 158 182 170 C 178 160 180 140 185 125 C 185 110 175 106 168 106 C 160 106 150 110 150 125 C 150 140 152 160 148 170 C 144 158 144 135 144 120 Z" fill="#0f172a" />
      
      <!-- Facial Features - The 'Mỉm cười' (Gentle Smile) Focus -->
      <!-- Soft Closed / Crinkled Happy Eyes -->
      <path d="M 158 118 Q 163 114 168 118" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      <path d="M 172 118 Q 177 114 182 118" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      
      <!-- Rosy Cheeks Accent -->
      <circle cx="156" cy="126" r="4" fill="#fb7185" opacity="0.5" />
      <circle cx="184" cy="126" r="4" fill="#fb7185" opacity="0.5" />

      <!-- THE SMILE: Warm, natural, expressive curve (微笑) -->
      <path d="M 161 127 Q 168 135 175 127" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" />

      <!-- Raised Hand gesturing lightly ("một chút" / a little bit / friendly gesture) -->
      <path d="M 185 155 C 190 150 196 155 193 162 C 191 166 186 165 183 162 Z" fill="url(#skinGrad2)" />
      <path d="M 187 152 L 191 146" stroke="url(#skinGrad2)" stroke-width="3" stroke-linecap="round" />
      <path d="M 190 153 L 195 149" stroke="url(#skinGrad2)" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Sparkles / Subtle magical warmth indicating the pleasant interaction -->
  <g id="sparkles" opacity="0.8">
    <path d="M 125 110 L 127 115 L 132 117 L 127 119 L 125 124 L 123 119 L 118 117 L 123 115 Z" fill="#fbbf24" transform="scale(0.8) translate(35, 15)" />
    <path d="M 115 135 L 116 138 L 119 139 L 116 140 L 115 143 L 114 140 L 111 139 L 114 138 Z" fill="#f43f5e" transform="scale(0.6) translate(80, 20)" />
  </g>

  <!-- Foreground Vignette / Frame border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />
</svg>