<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sunrise" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Interior / Room context -->
  <g id="room-interior">
    <!-- Wall details -->
    <path d="M 0,0 L 240,0 L 240,165 L 0,165 Z" fill="#1e293b"/>
    
    <!-- Big Window looking out to the horizon / future -->
    <rect x="110" y="30" width="100" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <rect x="114" y="34" width="92" height="102" rx="4" fill="url(#windowGlow)"/>
    
    <!-- Sunrise outside symbolizing "Future" (未来) -->
    <circle cx="160" cy="115" r="22" fill="#fbbf24" opacity="0.9"/>
    <path d="M 114,120 Q 160,90 206,120 L 206,136 L 114,136 Z" fill="url(#sunrise)"/>
    <!-- Distant skyline/mountains outside -->
    <path d="M 114,125 L 130,110 L 145,122 L 165,105 L 185,120 L 206,108 L 206,136 L 114,136 Z" fill="#0f172a" opacity="0.6"/>

    <!-- Window frame crossbars -->
    <line x1="160" y1="34" x2="160" y2="136" stroke="#334155" stroke-width="3"/>
    <line x1="114" y1="85" x2="206" y2="85" stroke="#334155" stroke-width="3"/>

    <!-- Bookshelf or plant on the wall -->
    <rect x="25" y="45" width="60" height="8" rx="2" fill="#475569"/>
    <!-- Small plant on shelf -->
    <path d="M 45,45 Q 45,30 55,25 Q 50,38 45,45 Z" fill="#10b981"/>
    <path d="M 55,45 Q 55,28 42,22 Q 48,36 55,45 Z" fill="#34d399"/>
    <path d="M 40,45 L 60,45 L 57,53 L 43,53 Z" fill="#94a3b8"/>
  </g>

  <!-- Foreground / Desk Setup -->
  <g id="desk-and-props">
    <!-- Desk surface -->
    <path d="M 0,165 L 240,165 L 240,240 L 0,240 Z" fill="url(#deskGrad)"/>
    <line x1="0" y1="165" x2="240" y2="165" stroke="#475569" stroke-width="3"/>

    <!-- Laptop showing upward growth chart (Optimism towards future) -->
    <path d="M 65,165 L 115,165 L 125,145 L 55,145 Z" fill="#64748b"/>
    <rect x="68" y="105" width="44" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Chart lines on screen -->
    <path d="M 74,135 L 85,128 L 95,132 L 105,114" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="105" cy="114" r="3" fill="#38bdf8"/>

    <!-- Coffee mug with steam -->
    <rect x="145" y="140" width="16" height="20" rx="3" fill="#ec4899"/>
    <path d="M 161,144 C 167,144 167,154 161,154" fill="none" stroke="#ec4899" stroke-width="2"/>
    <path d="M 150,132 Q 153,126 150,120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 156,134 Q 159,128 156,122" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Main Character: Confident, smiling young man looking towards the bright window -->
  <g id="character">
    <!-- Chair back -->
    <path d="M 30,110 L 50,110 L 45,170 L 25,170 Z" fill="#334155" rx="4"/>

    <!-- Body / Torso (leaning back comfortably, arms crossed or open, let's do arms behind head / confident pose) -->
    <path d="M 35,140 Q 45,115 65,115 L 85,130 L 75,170 L 40,170 Z" fill="#3b82f6"/> <!-- Blue hoodie/shirt -->

    <!-- Neck -->
    <rect x="58" y="102" width="12" height="16" fill="#fed7aa"/>

    <!-- Head -->
    <circle cx="64" cy="90" r="18" fill="#fed7aa"/>

    <!-- Hair (stylish dark hair) -->
    <path d="M 46,90 C 46,72 82,72 82,90 C 82,90 78,82 74,80 C 70,78 60,76 54,80 C 48,84 46,90 46,90 Z" fill="#0f172a"/>

    <!-- Facial Expression: Smiling, optimistic eyes looking right toward the sunrise -->
    <!-- Eyebrows (relaxed, positive angle) -->
    <path d="M 54,84 Q 59,81 64,84" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 68,84 Q 73,81 78,84" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Eyes (closed happy arcs or bright open dots - let's make them bright curved happy eyes) -->
    <path d="M 56,88 Q 59,91 62,88" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 70,88 Q 73,91 76,88" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Warm confident smile -->
    <path d="M 60,97 Q 66,103 72,97" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Rosy cheek for warmth -->
    <circle cx="56" cy="95" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="76" cy="95" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Arms & Hands -->
    <!-- Arm supporting head / dynamic relaxed pose -->
    <path d="M 40,120 Q 25,130 35,150" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 75,125 Q 95,120 85,145" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Hand touching chin thoughtfully/optimistically -->
    <circle cx="85" cy="145" r="5" fill="#fed7aa"/>
  </g>

  <!-- Ambient lighting/sparkles representing positive energy/optimism -->
  <g id="sparkles" fill="#fbbf24">
    <circle cx="100" cy="60" r="2" opacity="0.8"/>
    <path d="M 130,50 L 132,55 L 137,57 L 132,59 L 130,64 L 128,59 L 123,57 L 128,55 Z" opacity="0.7" transform="scale(0.6) translate(110, 20)"/>
    <path d="M 210,80 L 211,83 L 214,84 L 211,85 L 210,88 L 209,85 L 206,84 L 209,83 Z" opacity="0.9" transform="scale(0.8) translate(70, 0)"/>
  </g>
</svg>