<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Cashier Counter Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Accent Light -->
    <radialGradient id="lightGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Banknote Gradient -->
    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lighting Layer -->
  <circle cx="160" cy="80" r="120" fill="url(#lightGlow)"/>

  <!-- SHOP ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall Shelving & Display -->
  <rect x="25" y="40" width="110" height="75" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Shelves -->
  <line x1="25" y1="65" x2="135" y2="65" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="90" x2="135" y2="90" stroke="#334155" stroke-width="2"/>
  <!-- Display Items (Colorful minimalist objects) -->
  <circle cx="45" cy="53" r="8" fill="#ec4899"/>
  <rect x="65" y="47" width="12" height="18" rx="2" fill="#38bdf8"/>
  <path d="M95 55 L105 45 L115 55 Z" fill="#fbbf24"/>
  <rect x="40" y="75" width="16" height="15" rx="2" fill="#a78bfa"/>
  <circle cx="80" cy="80" r="7" fill="#34d399"/>

  <!-- Warm Hanging Lamp -->
  <path d="M185 20 L185 50" stroke="#64748b" stroke-width="2"/>
  <path d="M165 50 L205 50 L210 65 L160 65 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M185 65 L185 100" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- CASHIER COUNTER -->
  <path d="M0 150 L240 150 L240 240 L0 240 Z" fill="url(#counterGrad)"/>
  <path d="M0 150 L240 150" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>

  <!-- POS Terminal / Card Reader on Counter -->
  <rect x="195" y="130" width="25" height="25" rx="4" fill="#475569"/>
  <rect x="200" y="133" width="15" height="10" rx="1" fill="#1e293b"/>
  <path d="M205 147 L215 147" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- CHARACTERS -->

  <!-- 1. Cashier (Right side, behind counter) -->
  <g transform="translate(160, 95)">
    <!-- Body/Apron -->
    <path d="M10 55 C10 45 25 45 35 45 C45 45 60 45 60 55 L70 105 L0 105 Z" fill="#334155"/>
    <path d="M20 55 L50 55 L45 105 L25 105 Z" fill="#ec4899"/> <!-- Apron -->
    
    <!-- Head & Hair -->
    <circle cx="35" cy="25" r="16" fill="#fcd34d"/>
    <path d="M19 25 C19 12 51 12 51 25 C51 30 45 32 45 25 C45 20 25 20 25 25 C25 32 19 30 19 25 Z" fill="#1e293b"/> <!-- Hair -->
    
    <!-- Friendly Face & Gesture -->
    <circle cx="30" cy="24" r="1.5" fill="#1e293b"/>
    <circle cx="40" cy="24" r="1.5" fill="#1e293b"/>
    <path d="M33 29 Q35 32 37 29" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Open welcoming hands pointing toward counter -->
    <circle cx="2" cy="65" r="5" fill="#fcd34d"/>
  </g>

  <!-- 2. Customer (Left side, facing counter) -->
  <g transform="translate(40, 85)">
    <!-- Body & Jacket -->
    <path d="M10 65 C10 50 30 50 40 50 C50 50 70 50 70 65 L80 130 L0 130 Z" fill="#38bdf8"/>
    <path d="M25 50 L40 70 L55 50" fill="none" stroke="#0284c7" stroke-width="3"/> <!-- Collar -->

    <!-- Head & Hair -->
    <circle cx="40" cy="28" r="17" fill="#fcd34d"/>
    <path d="M23 25 C23 10 57 10 57 25 C57 32 50 30 45 25 C40 20 35 20 30 25 C25 30 23 32 23 25 Z" fill="#0f172a"/> <!-- Stylish Dark Hair -->

    <!-- Face Profile -->
    <circle cx="47" cy="27" r="1.5" fill="#0f172a"/>
    <path d="M44 32 Q47 35 50 32" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Active Arm Reaching Forward to Pay -->
    <path d="M55 70 C70 70 85 85 95 95" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="98" cy="97" r="6" fill="#fcd34d"/>
  </g>

  <!-- THE FOCAL PROP: RMB BANKNOTE (人民币) -->
  <!-- Crisp, beautifully detailed stylized banknote being handed over -->
  <g transform="translate(110, 130) rotate(-12)">
    <!-- Bill Shadow -->
    <rect x="2" y="4" width="60" height="34" rx="4" fill="#000000" opacity="0.3"/>
    <!-- Main Bill Body -->
    <rect x="0" y="0" width="60" height="34" rx="4" fill="url(#billGrad)" stroke="#10b981" stroke-width="1.5"/>
    
    <!-- Inner Border Pattern -->
    <rect x="4" y="4" width="52" height="26" rx="2" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="4 2" opacity="0.7"/>
    
    <!-- Central Portrait Emblem (Stylized abstract portrait silhouette) -->
    <circle cx="30" cy="17" r="8" fill="#047857" opacity="0.4"/>
    <circle cx="30" cy="15" r="4" fill="#ecfdf5"/>
    <path d="M23 23 C23 20 37 20 37 23 Z" fill="#ecfdf5"/>

    <!-- Decorative Corner Accents -->
    <circle cx="10" cy="10" r="2" fill="#ecfdf5"/>
    <circle cx="50" cy="24" r="2" fill="#ecfdf5"/>

    <!-- Numeric value indicator lines (abstract currency feel) -->
    <line x1="12" y1="22" x2="18" y2="22" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="12" x2="48" y2="12" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles / Emphasis on the transaction -->
  <path d="M125 105 L128 112 L135 115 L128 118 L125 125 L122 118 L115 115 L122 112 Z" fill="#fbbf24"/>
  <path d="M95 145 L97 150 L102 152 L97 154 L95 159 L93 154 L88 152 L93 150 Z" fill="#38bdf8" transform="scale(0.7) translate(50, 20)"/>
</svg>