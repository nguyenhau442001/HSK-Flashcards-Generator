<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Window Warm Light Glow -->
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Heart Soft Glow -->
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Path for Window View -->
    <clipPath id="windowClip">
      <path d="M 85 55 L 155 55 L 155 135 L 85 135 Z" />
    </clipPath>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light from Window -->
  <circle cx="120" cy="95" r="70" fill="url(#warmGlow)" />

  <!-- BACKGROUND ENVIRONMENT: Cozy Warm Room Interior -->
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" />
  <!-- Wooden floor planks lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="1.5" />
  <line x1="20" y1="210" x2="240" y2="210" stroke="#1e293b" stroke-width="1" />

  <!-- Back Wall & Window Frame -->
  <rect x="80" y="50" width="80" height="90" fill="#475569" rx="4" />
  <rect x="83" y="53" width="74" height="84" fill="#0f172a" rx="2" />

  <!-- Window Scene: Night Snowfall & Warm Streetlamp Light -->
  <g clip-path="url(#windowClip)">
    <!-- Outside Night Sky -->
    <rect x="85" y="55" width="70" height="80" fill="#1e1b4b" />
    <!-- Distant buildings / silhouette -->
    <polygon points="85,135 85,110 95,100 105,115 115,105 130,120 145,100 155,110 155,135" fill="#090d16" />
    <!-- Streetlamp Glow outside -->
    <circle cx="120" cy="90" r="25" fill="#fbbf24" opacity="0.3" />
    <!-- Snowflakes falling outside -->
    <circle cx="95" cy="70" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="135" cy="65" r="1" fill="#ffffff" opacity="0.9" />
    <circle cx="110" cy="85" r="2" fill="#ffffff" opacity="0.7" />
    <circle cx="140" cy="105" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="90" cy="120" r="2" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Window Pane Crossbars -->
  <line x1="120" y1="53" x2="120" y2="137" stroke="#475569" stroke-width="3" />
  <line x1="83" y1="95" x2="157" y2="95" stroke="#475569" stroke-width="3" />

  <!-- Bookshelf / Plant on the wall -->
  <rect x="35" y="75" width="30" height="6" fill="#64748b" rx="2" />
  <!-- Small potted plant -->
  <path d="M 45 75 L 55 75 L 53 65 L 47 65 Z" fill="#cbd5e1" />
  <circle cx="50" cy="62" r="6" fill="#10b981" />
  <circle cx="46" cy="64" r="4" fill="#059669" />
  <circle cx="54" cy="63" r="4" fill="#059669" />

  <!-- Cozy Floor Lamp on Left -->
  <line x1="25" y1="180" x2="25" y2="110" stroke="#64748b" stroke-width="2" />
  <path d="M 15 110 L 35 110 L 30 95 L 20 95 Z" fill="#f59e0b" opacity="0.9" />

  <!-- FOREGROUND: MAIN CHARACTERS EXPERIENCING A TOUCHING SCENE -->
  <!-- Character 1: Older Grandfather sitting, touched/emotional -->
  <g id="grandfather">
    <!-- Body / Chair -->
    <rect x="55" y="130" width="45" height="60" fill="#3b82f6" rx="10" />
    <path d="M 50 140 L 60 140 L 60 190 L 50 190 Z" fill="#1d4ed8" /> <!-- Armrest -->

    <!-- Head & Hair -->
    <circle cx="75" cy="115" r="14" fill="#fed7aa" />
    <!-- Gray Hair -->
    <path d="M 61 115 C 61 105, 89 105, 89 115 C 89 118, 87 115, 85 112 C 80 108, 70 108, 65 112 C 63 115, 61 118, 61 115 Z" fill="#94a3b8" />

    <!-- Face details: eyes closed softly with emotion, gentle smile -->
    <path d="M 70 114 Q 73 117 76 114" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 78 114 Q 81 117 84 114" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 75 120 Q 77 122 79 120" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Tear of emotion -->
    <circle cx="85" cy="118" r="1.5" fill="#38bdf8" />

    <!-- Arm reaching out / holding hand -->
    <path d="M 85 145 C 95 145, 105 150, 115 150" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Character 2: Young Woman / Granddaughter kneeling beside, presenting a gift/photo album -->
  <g id="granddaughter">
    <!-- Body / Torso -->
    <path d="M 140 140 C 145 130, 155 125, 160 140 L 165 190 L 135 190 Z" fill="#ec4899" />

    <!-- Head & Hair -->
    <circle cx="150" cy="115" r="13" fill="#fed7aa" />
    <!-- Dark Hair tied up -->
    <path d="M 137 115 C 137 104, 163 104, 163 115 C 163 118, 160 125, 155 125 C 150 125, 140 125, 137 115 Z" fill="#0f172a" />
    <circle cx="158" cy="110" r="4" fill="#0f172a" /> <!-- Hair bun -->

    <!-- Face profile looking tenderly -->
    <circle cx="145" cy="115" r="1" fill="#451a03" />
    <path d="M 143 120 Q 146 123 148 120" stroke="#be123c" stroke-width="1.2" fill="none" stroke-linecap="round" />

    <!-- Arms holding out a photo frame / warm gift -->
    <path d="M 145 145 C 135 150, 125 150, 120 145" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- The Object: A glowing photo frame / warm memory depiction -->
    <rect x="105" y="130" width="22" height="26" fill="#f8fafc" rx="2" transform="rotate(-10 116 143)" stroke="#d97706" stroke-width="2" />
    <rect x="108" y="133" width="16" height="20" fill="#fbbf24" rx="1" transform="rotate(-10 116 143)" opacity="0.8" />
    <!-- Little heart inside frame -->
    <path d="M 116 141 C 114 138, 111 140, 113 144 L 116 147 L 119 144 C 121 140, 118 138, 116 141 Z" fill="#ef4444" transform="rotate(-10 116 143)" />
  </g>

  <!-- EMOTIONAL CONTEXT: Floating Glowing Hearts & Sparkles (Representing "Gan Dong" / Deeply Moved) -->
  <g id="emotional-effects">
    <!-- Heart 1 (Large, near center top) -->
    <circle cx="120" cy="85" r="18" fill="url(#heartGlow)" />
    <path d="M 120 80 C 115 72, 105 76, 108 84 C 111 92, 120 98, 120 98 C 120 98, 129 92, 132 84 C 135 76, 125 72, 120 80 Z" fill="#f43f5e" opacity="0.9" />

    <!-- Heart 2 (Small, floating up) -->
    <path d="M 95 100 C 92 95, 86 98, 88 103 C 90 108, 95 112, 95 112 C 95 112, 100 108, 102 103 C 104 98, 98 95, 95 100 Z" fill="#fb7185" opacity="0.8" />

    <!-- Heart 3 -->
    <path d="M 145 95 C 143 91, 138 93, 140 97 C 141 101, 145 104, 145 104 C 145 104, 149 101, 150 97 C 152 93, 147 91, 145 95 Z" fill="#fda4af" opacity="0.7" />

    <!-- Magic Sparkles / Warm Glow Dots -->
    <circle cx="102" cy="70" r="2" fill="#fde047" opacity="0.9" />
    <circle cx="138" cy="72" r="1.5" fill="#fde047" opacity="0.8" />
    <circle cx="130" cy="62" r="2.5" fill="#fde047" opacity="0.9" />
    <circle cx="110" cy="115" r="1.5" fill="#fde047" opacity="0.7" />
  </g>

  <!-- Warm Wooden Coffee Table with Tea Cup (Setting details) -->
  <rect x="90" y="175" width="60" height="8" fill="#b45309" rx="2" />
  <rect x="100" y="183" width="6" height="15" fill="#78350f" />
  <rect x="134" y="183" width="6" height="15" fill="#78350f" />

  <!-- Teacup on table -->
  <path d="M 110 175 L 120 175 L 119 168 L 111 168 Z" fill="#f1f5f9" />
  <path d="M 113 165 Q 115 162 117 165" stroke="#94a3b8" stroke-width="1" fill="none" /> <!-- Steam -->
</svg>