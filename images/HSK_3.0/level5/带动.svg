<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Mountain and Local Shop -->
  <path d="M0 160 L80 100 L160 160 Z" fill="#334155"/>
  <path d="M120 180 L240 100 L240 240 L120 240 Z" fill="#1e293b"/>
  <rect x="140" y="150" width="40" height="50" fill="#475569" rx="2"/>
  <rect x="150" y="160" width="20" height="20" fill="#fef3c7"/>
  
  <!-- The "Tourism" element: A traveler with a camera -->
  <g transform="translate(40, 140)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <rect x="10" y="35" width="20" height="40" fill="#38bdf8" rx="5"/>
    <rect x="15" y="40" width="10" height="10" fill="#ffffff"/>
    <path d="M25 45 L40 40 L40 50 Z" fill="#fbbf24"/>
  </g>
  
  <!-- The "Economy/Growth" element: A local merchant receiving coins/growth -->
  <g transform="translate(180, 160)">
    <circle cx="20" cy="20" r="15" fill="#10b981"/>
    <rect x="10" y="35" width="20" height="40" fill="#ec4899" rx="5"/>
    <circle cx="20" cy="55" r="8" fill="#f59e0b"/>
  </g>
  
  <!-- Growth indicator: Upward arrow/sparkles -->
  <path d="M100 120 L130 90 L160 120" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="130" cy="80" r="4" fill="#fbbf24"/>
  <circle cx="145" cy="95" r="3" fill="#fbbf24"/>
  <circle cx="115" cy="95" r="3" fill="#fbbf24"/>
  
  <!-- Ground line -->
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
</svg>