<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#1e293b" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgba(251,191,36,0.8)" />
      <stop offset="100%" style="stop-color:rgba(251,191,36,0)" />
    </radialGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgba(56,189,248,0.8)" />
      <stop offset="100%" style="stop-color:rgba(56,189,248,0)" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#darkGradient)"/>

  <!-- Room wall (darker blue-grey) -->
  <rect x="0" y="0" width="240" height="240" fill="#334155" />

  <!-- Window in the background -->
  <rect x="150" y="40" width="70" height="100" rx="8" fill="#1e293b" />
  <!-- Cityscape outside window -->
  <rect x="155" y="45" width="60" height="90" fill="#0f172a" />
  <rect x="160" y="55" width="10" height="15" fill="#fbbf24" />
  <rect x="175" y="65" width="8" height="12" fill="#38bdf8" />
  <rect x="165" y="80" width="12" height="10" fill="#fbbf24" />
  <rect x="185" y="90" width="10" height="18" fill="#38bdf8" />
  <rect x="170" y="105" width="8" height="10" fill="#fbbf24" />
  <rect x="190" y="115" width="10" height="15" fill="#38bdf8" />

  <!-- Desk -->
  <rect x="20" y="140" width="180" height="60" rx="8" fill="#475569" />
  <rect x="25" y="135" width="170" height="10" rx="4" fill="#64748b" /> <!-- Desk top edge -->

  <!-- Character (He) -->
  <!-- Legs (hidden by desk mostly) -->
  <rect x="70" y="180" width="20" height="30" fill="#334155" rx="4" />
  <rect x="100" y="180" width="20" height="30" fill="#334155" rx="4" />

  <!-- Body -->
  <rect x="60" y="100" width="80" height="80" rx="10" fill="#38bdf8" />
  <!-- Arms -->
  <rect x="50" y="120" width="20" height="40" rx="8" fill="#38bdf8" transform="rotate(-15 60 140)" />
  <rect x="130" y="120" width="20" height="40" rx="8" fill="#38bdf8" transform="rotate(15 140 140)" />
  <!-- Hands -->
  <circle cx="65" cy="155" r="8" fill="#fcd34d" />
  <circle cx="135" cy="155" r="8" fill="#fcd34d" />

  <!-- Head -->
  <circle cx="100" cy="80" r="30" fill="#fcd34d" />
  <!-- Hair -->
  <path d="M75 60 C70 40, 130 40, 125 60 L125 80 C125 90, 75 90, 75 80 Z" fill="#1e293b" />
  <!-- Eyes -->
  <circle cx="90" cy="75" r="3" fill="#0f172a" />
  <circle cx="110" cy="75" r="3" fill="#0f172a" />
  <!-- Mouth (focused expression) -->
  <path d="M95 90 Q100 95, 105 90" stroke="#0f172a" stroke-width="2" fill="none" />

  <!-- Laptop on desk -->
  <rect x="70" y="145" width="60" height="4" fill="#64748b" rx="2" /> <!-- Base -->
  <rect x="70" y="110" width="60" height="35" fill="#334155" rx="4" /> <!-- Screen casing -->
  <rect x="75" y="115" width="50" height="25" fill="#38bdf8" rx="2" /> <!-- Screen content -->
  <!-- Screen glow effect -->
  <circle cx="100" cy="127.5" r="30" fill="url(#screenGlow)" opacity="0.4" />

  <!-- Desk lamp -->
  <rect x="35" y="130" width="5" height="20" fill="#64748b" rx="2" /> <!-- Lamp stand -->
  <path d="M37.5 130 L30 100 L50 100 L42.5 130 Z" fill="#fbbf24" /> <!-- Lamp shade -->
  <!-- Lamp glow -->
  <circle cx="40" cy="100" r="60" fill="url(#lampGlow)" opacity="0.6" />

  <!-- Coffee mug -->
  <rect x="145" y="130" width="15" height="20" rx="4" fill="#e2e8f0" />
  <path d="M160 135 A5 5 0 0 1 160 145 A5 5 0 0 0 165 140 A5 5 0 0 1 160 135 Z" fill="#e2e8f0" />

  <!-- Papers on desk -->
  <rect x="40" y="150" width="25" height="15" rx="2" fill="#f8fafc" transform="rotate(5 52.5 157.5)" />
  <rect x="120" y="155" width="30" height="20" rx="2" fill="#f8fafc" transform="rotate(-10 135 165)" />
</svg>