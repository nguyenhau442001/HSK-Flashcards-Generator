<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Curiosity -->
    <radialGradient id="curiosityGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Magnifying Glass Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Spotlight Beam -->
    <linearGradient id="spotlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Magical Forest / Curious Exploration Vibe) -->
  <g opacity="0.3">
    <!-- Distant glowing flora/stars -->
    <circle cx="40" cy="50" r="2" fill="#38bdf8"/>
    <circle cx="200" cy="40" r="1.5" fill="#fbbf24"/>
    <circle cx="215" cy="110" r="2" fill="#38bdf8"/>
    <circle cx="30" cy="160" r="1.5" fill="#ec4899"/>
    <path d="M10,210 Q40,190 70,210 T130,210" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M150,220 Q180,200 210,220 T240,220" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Central Ambient Curiosity Glow -->
  <circle cx="120" cy="120" r="90" fill="url(#curiosityGlow)"/>

  <!-- ENVIRONMENT: Mysterious Object of Interest (A magical, glowing terrarium/crystal with tiny intricate world inside) -->
  <g transform="translate(120, 130)">
    <!-- Surface Ground Shadow -->
    <ellipse cx="0" cy="55" rx="45" ry="14" fill="#090d16" opacity="0.6"/>

    <!-- Terrarium Wooden Base -->
    <path d="M-30,45 L30,45 L25,58 L-25,58 Z" fill="#b45309"/>
    <ellipse cx="0" cy="45" rx="30" ry="6" fill="#d97706"/>
    <ellipse cx="0" cy="58" rx="25" ry="5" fill="#92400e"/>

    <!-- Glass Dome -->
    <path d="M-35,45 C-35,10 -25,-10 0,-15 C25,-10 35,10 35,45 Z" fill="url(#lensGrad)" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Miniature World Inside (Plants & Glowing Mushrooms representing wonder) -->
    <!-- Tiny Hills -->
    <path d="M-25,45 Q-10,35 5,45 Z" fill="#047857"/>
    <path d="M-5,45 Q15,25 30,45 Z" fill="#065f46"/>

    <!-- Glowing Mushrooms & Crystals -->
    <circle cx="-12" cy="35" r="4" fill="#ec4899"/>
    <path d="M-12,35 L-12,45" stroke="#fbcfe8" stroke-width="1.5"/>
    <circle cx="-10" cy="33" r="1.5" fill="#ffffff" opacity="0.8"/>

    <circle cx="12" cy="30" r="6" fill="#38bdf8"/>
    <path d="M12,30 L12,45" stroke="#bae6fd" stroke-width="2"/>
    <circle cx="14" cy="28" r="2" fill="#ffffff" opacity="0.8"/>

    <polygon points="2,38 5,30 8,38" fill="#fbbf24"/>

    <!-- Glass Reflection Highlights -->
    <path d="M-22,10 C-25,20 -25,30 -22,40" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M18,5 C20,12 20,20 15,28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- CHARACTER / VIEWER: Curious Character peeking/inspecting closely -->
  <!-- We showcase an expressive, curious eye/face element peeking from the top-left, or hands holding a giant magnifying glass focusing on the object -->
  <g>
    <!-- Giant Magnifying Glass (Active Exploration Tool) -->
    <!-- Handle -->
    <g transform="rotate(-35 85 105)">
      <rect x="75" y="105" width="20" height="70" rx="10" fill="#f59e0b"/>
      <rect x="80" y="110" width="10" height="60" rx="5" fill="#fbbf24"/>
      <!-- Metallic Connector Ring -->
      <rect x="73" y="95" width="24" height="14" rx="4" fill="#cbd5e1"/>
      <rect x="75" y="97" width="20" height="10" rx="2" fill="#e2e8f0"/>
    </g>

    <!-- Lens Rim & Glass Circle centered over the terrarium -->
    <circle cx="105" cy="95" r="45" fill="none" stroke="#cbd5e1" stroke-width="8"/>
    <circle cx="105" cy="95" r="45" fill="none" stroke="#f8fafc" stroke-width="3"/>
    
    <!-- Magnified view distortion/highlight inside lens -->
    <circle cx="105" cy="95" r="41" fill="#38bdf8" fill-opacity="0.12"/>
    <!-- Lens Light Sweep -->
    <path d="M75,65 Q95,55 125,65" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Curiously Expressive Elements: Glowing Question/Wonder Sparks -->
  <g transform="translate(160, 60)">
    <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.2"/>
    <path d="M-4,-2 C-4,-7 4,-7 4,-2 C4,2 0,4 0,8" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="13" r="2" fill="#fbbf24"/>
  </g>

  <g transform="translate(60, 45)">
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.2"/>
    <path d="M-3,-1 C-3,-5 3,-5 3,-1 C3,1 0,3 0,6" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="1.5" fill="#38bdf8"/>
  </g>

  <g transform="translate(185, 140)">
    <circle cx="0" cy="0" r="8" fill="#ec4899" opacity="0.2"/>
    <path d="M-2,-1 C-2,-4 2,-4 2,-1 C2,1 0,2 0,4" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="7" r="1.2" fill="#ec4899"/>
  </g>

  <!-- Floating Sparkles / Wonder Dust -->
  <g fill="#fbbf24">
    <path d="M140,40 L142,45 L147,47 L142,49 L140,54 L138,49 L133,47 L138,45 Z" opacity="0.9"/>
    <path d="M75,150 L76.5,153 L79.5,154.5 L76.5,156 L75,159 L73.5,156 L70.5,154.5 L73.5,153 Z" opacity="0.7" transform="scale(0.7) translate(40, 30)"/>
    <circle cx="170" cy="180" r="2.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="50" cy="100" r="2" fill="#ec4899" opacity="0.7"/>
  </g>

  <!-- Foreground Vignette / Frame border soft shadow -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15"/>
</svg>