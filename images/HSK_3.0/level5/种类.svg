<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background & Atmosphere -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="storeGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#storeGlow)" />

  <!-- Ambient Lighting from Shop Ceiling -->
  <path d="M 60 0 L 180 0 L 210 90 L 30 90 Z" fill="url(#warmLight)" />

  <!-- SHOP ENVIRONMENT: Shelving Units showing "种类" (Variety of Goods) -->
  <!-- Back Wall Structure -->
  <rect x="25" y="70" width="190" height="135" fill="#1e293b" rx="4" />
  <rect x="30" y="75" width="180" height="125" fill="#090d16" rx="2" />

  <!-- Shelf Level 1 (Top): Electronics & Gadgets -->
  <rect x="35" y="95" width="170" height="6" fill="url(#shelfGrad)" rx="1" />
  <!-- Item group A: Small boxes/devices (Cyan/Blue) -->
  <rect x="45" y="75" width="16" height="20" rx="2" fill="#38bdf8" />
  <rect x="48" y="79" width="10" height="8" rx="1" fill="#0f172a" />
  <rect x="65" y="80" width="12" height="15" rx="2" fill="#818cf8" />
  <circle cx="95" cy="85" r="8" fill="#f43f5e" />
  <rect x="110" y="78" width="22" height="17" rx="3" fill="#10b981" />
  <rect x="138" y="82" width="14" height="13" rx="2" fill="#fb923c" />
  <path d="M 162 95 L 170 80 L 178 95 Z" fill="#ec4899" />
  <rect x="185" y="76" width="12" height="19" rx="2" fill="#38bdf8" />

  <!-- Shelf Level 2 (Middle): Household goods, Bottles, Jars -->
  <rect x="35" y="130" width="170" height="6" fill="url(#shelfGrad)" rx="1" />
  <!-- Item group B: Bottles & Containers (Diverse shapes/colors) -->
  <path d="M 43 130 L 43 115 C 43 112 47 112 47 115 L 47 130 Z" fill="#fbbf24" />
  <path d="M 55 130 L 55 110 C 55 108 59 108 59 110 L 59 130 Z" fill="#38bdf8" />
  <rect x="70" y="112" width="14" height="18" rx="7" fill="#10b981" />
  <rect x="90" y="110" width="18" height="20" rx="2" fill="#ec4899" />
  <circle cx="123" cy="120" r="9" fill="#818cf8" />
  <path d="M 142 130 L 145 108 C 145 106 149 106 149 108 L 152 130 Z" fill="#fb923c" />
  <rect x="162" y="114" width="15" height="16" rx="2" fill="#fbbf24" />
  <rect x="183" y="111" width="14" height="19" rx="3" fill="#38bdf8" />

  <!-- Shelf Level 3 (Lower): Fresh Goods / Packages -->
  <rect x="35" y="165" width="170" height="6" fill="url(#shelfGrad)" rx="1" />
  <!-- Item group C: Soft goods, boxes, gift items -->
  <rect x="40" y="145" width="22" height="20" rx="3" fill="#f43f5e" />
  <line x1="40" y1="155" x2="62" y2="155" stroke="#ffe4e6" stroke-width="2" />
  <rect x="68" y="148" width="18" height="17" rx="2" fill="#fb923c" />
  <rect x="92" y="143" width="24" height="22" rx="4" fill="#a855f7" />
  <circle cx="129" cy="155" r="8" fill="#38bdf8" />
  <rect x="144" y="146" width="16" height="19" rx="2" fill="#10b981" />
  <rect x="168" y="144" width="26" height="21" rx="3" fill="#fbbf24" />

  <!-- Counter / Check-out Desk Base -->
  <path d="M 15 205 L 225 205 L 215 240 L 25 240 Z" fill="#334155" />
  <path d="M 15 205 L 225 205 L 225 210 L 15 210 Z" fill="#475569" />
  <!-- Cash Register / POS Screen on Counter -->
  <rect x="175" y="185" width="22" height="20" rx="2" fill="#0f172a" />
  <rect x="177" y="187" width="18" height="12" rx="1" fill="#38bdf8" />
  <path d="M 183 205 L 193 205 L 195 208 L 181 208 Z" fill="#64748b" />

  <!-- Store Signage / Interior Accent Strip -->
  <rect x="0" y="55" width="240" height="4" fill="#3b82f6" opacity="0.4" />

  <!-- FOREGROUND CHARACTERS: Shop Assistant & Customer -->
  <!-- Customer Character (Left/Center interacting) -->
  <g transform="translate(75, 140)">
    <!-- Body & Jacket -->
    <path d="M 15 45 C 15 35 25 30 35 30 C 45 30 55 35 55 45 L 60 75 L 10 75 Z" fill="#3b82f6" />
    <path d="M 25 30 L 35 48 L 45 30 Z" fill="#e2e8f0" />
    <!-- Head & Hair -->
    <circle cx="35" cy="18" r="13" fill="#fbcfe8" />
    <path d="M 22 15 C 22 8 28 4 35 4 C 42 4 48 8 48 15 C 48 18 47 22 47 22 L 23 22 C 23 22 22 18 22 15 Z" fill="#b45309" />
    <!-- Friendly pointing arm showing the variety -->
    <path d="M 48 35 C 58 35 68 45 68 45" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Shopping Basket held by other hand -->
    <rect x="-5" y="50" width="24" height="15" rx="3" fill="#fb923c" />
    <path d="M -2 50 C -2 40 21 40 21 50" stroke="#f97316" stroke-width="2" fill="none" />
  </g>

  <!-- Shop Assistant (Right side behind counter) -->
  <g transform="translate(135, 135)">
    <!-- Apron & Shirt -->
    <rect x="15" y="32" width="35" height="40" rx="4" fill="#ffffff" />
    <path d="M 22 32 L 22 68 L 43 68 L 43 32 Z" fill="#10b981" />
    <!-- Head & Friendly Expression -->
    <circle cx="32" cy="18" r="12" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M 20 18 C 20 10 26 6 32 6 C 38 6 44 10 44 18 C 42 16 38 15 32 15 C 26 15 22 16 20 18 Z" fill="#334155" />
    <!-- Welcoming Gesturing Arms -->
    <path d="M 15 40 C 5 45 0 35 0 35" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 50 40 C 60 45 65 35 65 35" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Ambient lighting sparkles (Highlighting rich choices) -->
  <g fill="#fbbf24">
    <circle cx="68" cy="105" r="2" opacity="0.8" />
    <circle cx="115" cy="100" r="1.5" opacity="0.9" />
    <circle cx="155" cy="98" r="2" opacity="0.7" />
    <circle cx="85" cy="138" r="1.5" opacity="0.9" />
    <circle cx="132" cy="135" r="2" opacity="0.8" />
    <circle cx="105" cy="175" r="2" opacity="0.9" />
  </g>

  <!-- Vignette overlay for depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.6" />
</svg>