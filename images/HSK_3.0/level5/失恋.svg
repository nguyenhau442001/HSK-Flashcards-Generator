<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Background element -->
  <rect x="40" y="30" width="160" height="80" rx="8" fill="#334155" opacity="0.5"/>
  <path d="M40 70 L200 70" stroke="#1e293b" stroke-width="4"/>
  <path d="M120 30 L120 110" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Desk -->
  <rect x="20" y="160" width="200" height="15" fill="#475569" rx="2"/>
  <rect x="30" y="175" width="10" height="65" fill="#334155"/>
  <rect x="200" y="175" width="10" height="65" fill="#334155"/>
  
  <!-- Character slumped over -->
  <g transform="translate(120, 150)">
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#fbbf24"/>
    <!-- Sad eyes -->
    <ellipse cx="-10" cy="-5" rx="3" ry="5" fill="#0f172a"/>
    <ellipse cx="10" cy="-5" rx="3" ry="5" fill="#0f172a"/>
    <!-- Frown -->
    <path d="M-8 10 Q0 5 8 10" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Body slumped -->
    <path d="M-30 20 L30 20 L20 60 L-20 60 Z" fill="#64748b"/>
    <!-- Arms on desk -->
    <path d="M-35 30 L-60 50" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
    <path d="M35 30 L60 50" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Props: Photo frame turned over -->
  <rect x="40" y="130" width="30" height="40" rx="2" fill="#94a3b8" transform="rotate(-15 55 150)"/>
  <rect x="42" y="132" width="26" height="36" rx="1" fill="#1e293b"/>
  <circle cx="55" cy="150" r="8" fill="#ec4899" opacity="0.6"/>
  
  <!-- Props: Tissue box -->
  <rect x="160" y="135" width="30" height="25" fill="#e2e8f0" rx="2"/>
  <path d="M165 135 L170 120 L180 120 L185 135" fill="#f8fafc"/>
  
  <!-- Mood atmosphere -->
  <circle cx="180" cy="50" r="15" fill="#38bdf8" opacity="0.1"/>
  <circle cx="190" cy="60" r="8" fill="#38bdf8" opacity="0.2"/>
</svg>