<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Sun/Heat Icon -->
  <circle cx="190" cy="50" r="25" fill="#fbbf24"/>
  <path d="M190 15 L190 5 M190 85 L190 95 M225 50 L235 50 M155 50 L145 50" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Thermometer -->
  <rect x="30" y="60" width="20" height="140" rx="10" fill="#334155"/>
  <rect x="35" y="70" width="10" height="120" rx="5" fill="#1e293b"/>
  <rect x="35" y="80" width="10" height="110" rx="5" fill="#ec4899"/>
  <circle cx="40" cy="190" r="12" fill="#ec4899"/>
  
  <!-- Character -->
  <g transform="translate(100, 100)">
    <!-- Body -->
    <path d="M40 140 C40 110, 80 110, 80 140 L80 140 L40 140" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="90" r="25" fill="#fde68a"/>
    <!-- Face -->
    <circle cx="52" cy="85" r="3" fill="#1e293b"/>
    <circle cx="68" cy="85" r="3" fill="#1e293b"/>
    <path d="M55 100 Q60 105 65 100" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Sweat Drop -->
    <path d="M85 75 Q90 85 85 90 Q80 85 85 75" fill="#38bdf8"/>
    <!-- Arm -->
    <path d="M35 110 L20 130" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M85 110 L100 130" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Heat waves -->
  <path d="M160 150 Q170 140 180 150 T200 150" stroke="#fb923c" stroke-width="2" fill="none"/>
  <path d="M160 170 Q170 160 180 170 T200 170" stroke="#fb923c" stroke-width="2" fill="none"/>
</svg>