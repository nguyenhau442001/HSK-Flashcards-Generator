<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Apartment Building Background -->
  <rect x="140" y="60" width="80" height="150" rx="4" fill="#334155"/>
  <rect x="150" y="80" width="20" height="20" fill="#475569"/>
  <rect x="190" y="80" width="20" height="20" fill="#475569"/>
  <rect x="150" y="120" width="20" height="20" fill="#475569"/>
  <rect x="190" y="120" width="20" height="20" fill="#475569"/>
  
  <!-- Security Booth -->
  <rect x="20" y="140" width="80" height="70" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="30" y="150" width="60" height="50" fill="#0f172a"/>
  
  <!-- Security Guard -->
  <circle cx="60" cy="165" r="12" fill="#fbbf24"/>
  <path d="M50 180h20l-2 20h-16z" fill="#fb923c"/>
  <path d="M45 180h30v5h-30z" fill="#f59e0b"/>
  <rect x="55" y="177" width="10" height="5" fill="#f59e0b"/>
  
  <!-- Action: Checking Clipboard -->
  <rect x="70" y="160" width="15" height="20" fill="#e2e8f0"/>
  <line x1="72" y1="165" x2="82" y2="165" stroke="#1e293b" stroke-width="1"/>
  <line x1="72" y1="170" x2="82" y2="170" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Resident Character -->
  <circle cx="130" cy="190" r="10" fill="#fbbf24"/>
  <path d="M120 200h20v30h-20z" fill="#38bdf8"/>
  <path d="M125 200l-5 30m20 0l-5-30" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="40" r="20" fill="#fbbf24" opacity="0.2"/>
  <path d="M20 210h200" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="100" cy="140" r="5" fill="#10b981"/>
</svg>