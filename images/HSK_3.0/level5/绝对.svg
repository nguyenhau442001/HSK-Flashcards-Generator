<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Target Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Bullseye Rings Gradients -->
    <linearGradient id="ring-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Dart Tail Gradient -->
    <linearGradient id="dart-tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Sparkle Flare Gradient -->
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient lighting / spotlight behind the target -->
  <circle cx="120" cy="115" r="90" fill="url(#glow)"/>

  <!-- Background Scientific/Precision Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="120" y1="20" x2="120" y2="210" stroke-dasharray="3,3"/>
    <line x1="30" y1="115" x2="210" y2="115" stroke-dasharray="3,3"/>
    <circle cx="120" cy="115" r="75" fill="none"/>
    <circle cx="120" cy="115" r="45" fill="none"/>
  </g>

  <!-- Giant Precision Target (Bullseye) representing absolute accuracy / 'tuyệt đối' -->
  <g transform="translate(120, 115)">
    <!-- Outer Shield Shadow -->
    <circle cx="0" cy="4" r="56" fill="#0f172a" opacity="0.6"/>

    <!-- Ring 4 (Outer Dark Slate) -->
    <circle cx="0" cy="0" r="56" fill="url(#ring-outer)" stroke="#475569" stroke-width="3"/>

    <!-- Ring 3 (Deep Teal/Slate) -->
    <circle cx="0" cy="0" r="42" fill="#0f766e" stroke="#14b8a6" stroke-width="2"/>

    <!-- Ring 2 (Vibrant Emerald) -->
    <circle cx="0" cy="0" r="28" fill="#047857" stroke="#10b981" stroke-width="2"/>

    <!-- Ring 1 (Inner Warm Amber) -->
    <circle cx="0" cy="0" r="14" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>

    <!-- Absolute Bullseye Center -->
    <circle cx="0" cy="0" r="6" fill="#ef4444"/>
    <circle cx="-1" cy="-1" r="2" fill="#fca5a5"/>
  </g>

  <!-- Action-packed Flying Dart hitting Dead Center (Absolute Precision) -->
  <g transform="translate(120, 115)">
    <!-- Dynamic motion trails / energy ripples -->
    <path d="M -45 -45 L -15 -15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 45 45 L 15 15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Dart Body (Perspective angled from top-left) -->
    <!-- Metallic Shaft -->
    <path d="M -60 -60 L 0 0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M -60 -60 L 0 0" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Sharp Needle Tip deeply embedded in the bullseye -->
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>

    <!-- Dart Flights (Stabilizer Wings - Styled in Modern Cyan & Orange) -->
    <!-- Left Wing -->
    <path d="M -45 -45 L -65 -35 L -55 -55 Z" fill="url(#dart-tail)"/>
    <!-- Right Wing -->
    <path d="M -45 -45 L -35 -65 L -55 -55 Z" fill="#f97316"/>
    <!-- Top/Back Stabilizer -->
    <path d="M -60 -60 L -72 -60 L -60 -72 Z" fill="#a855f7"/>

    <!-- Impact Sparkles / Absolute Success Flash -->
    <circle cx="0" cy="0" r="18" fill="url(#sparkle)"/>
    
    <!-- 4-point Star Flares -->
    <path d="M 0 -22 C 0 -10 0 -10 10 0 C 0 0 0 0 0 22 C 0 10 0 10 -10 0 C 0 0 0 0 0 -22 Z" fill="#fbbf24"/>
    <path d="M 12 -12 C 5 -5 5 -5 0 0 C 5 5 5 5 12 12 C 19 5 19 5 24 0 C 19 -5 19 -5 12 -12 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Atmospheric Floating Dust / Precision Particles -->
  <g opacity="0.6">
    <circle cx="45" cy="65" r="2" fill="#38bdf8"/>
    <circle cx="195" cy="75" r="1.5" fill="#fbbf24"/>
    <circle cx="180" cy="180" r="2.5" fill="#10b981"/>
    <circle cx="65" cy="175" r="1.5" fill="#f43f5e"/>
    <circle cx="120" cy="35" r="2" fill="#fbbf24"/>
  </g>

  <!-- Contextual tabletop / surface perspective line at bottom -->
  <path d="M 20 205 Q 120 215 220 205" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="120" cy="207" rx="90" ry="6" fill="#0f172a" opacity="0.5"/>
</svg>