<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Running Track/Stadium Atmosphere -->
  <path d="M0 180 L240 180" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="180" r="40" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- The Victor (Left) -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="15" fill="#f59e0b"/>
    <path d="M10 40 L15 80 M30 40 L35 80" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 55 L20 65 L35 55" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 10 L25 15 L20 20" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Raised arms -->
    <path d="M5 30 L-10 10 M35 30 L50 10" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- The Opponent (Right) - Exhausted -->
  <g transform="translate(160, 100)">
    <circle cx="20" cy="20" r="15" fill="#64748b"/>
    <path d="M10 40 L15 80 M30 40 L35 80" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 55 L20 70 L35 55" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <!-- Slumped posture -->
    <path d="M20 35 L10 50" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Sweat/Effort Particles -->
  <circle cx="75" cy="70" r="2" fill="#38bdf8"/>
  <circle cx="85" cy="75" r="2" fill="#38bdf8"/>
  <circle cx="170" cy="90" r="2" fill="#ec4899"/>
  
  <!-- Trophy/Goal Marker -->
  <path d="M120 120 L135 100 L120 80 L105 100 Z" fill="#fbbf24"/>
  <path d="M115 120 L125 120" stroke="#fbbf24" stroke-width="4"/>
  <path d="M120 120 L120 140" stroke="#fbbf24" stroke-width="4"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="190" rx="100" ry="10" fill="#000" opacity="0.2"/>
</svg>