<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Trust/Reliability -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment (Cozy Office / Workshop Setting) -->
  <g id="environment">
    <!-- Back wall -->
    <rect x="20" y="20" width="200" height="150" rx="4" fill="#1b263b" />
    
    <!-- Wooden Bookshelf / Props on Wall -->
    <rect x="35" y="45" width="60" height="6" rx="2" fill="#334155" />
    <path d="M45 45 L45 30 M55 45 L55 25 M65 45 L65 32" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    
    <!-- Window with Night City Silhouette outside -->
    <rect x="155" y="35" width="50" height="70" rx="4" fill="#090d16" />
    <!-- City lights through window -->
    <rect x="163" y="70" width="6" height="35" fill="#f59e0b" opacity="0.3" />
    <rect x="175" y="60" width="8" height="45" fill="#38bdf8" opacity="0.2" />
    <rect x="189" y="75" width="7" height="30" fill="#f59e0b" opacity="0.4" />
    <!-- Window Frame -->
    <rect x="155" y="35" width="50" height="70" rx="4" fill="none" stroke="#334155" stroke-width="3" />
    <line x1="180" y1="35" x2="180" y2="105" stroke="#334155" stroke-width="2" />
    <line x1="155" y1="70" x2="205" y2="70" stroke="#334155" stroke-width="2" />

    <!-- Light beam from window -->
    <polygon points="155,35 205,35 230,170 120,170" fill="url(#lightBeam)" />

    <!-- Ambient Glow behind reliable character -->
    <circle cx="100" cy="115" r="70" fill="url(#amberGlow)" />

    <!-- Sturdy Wooden Desk -->
    <rect x="30" y="160" width="180" height="12" rx="3" fill="#475569" />
    <rect x="45" y="172" width="12" height="40" rx="2" fill="#334155" />
    <rect x="183" y="172" width="12" height="40" rx="2" fill="#334155" />

    <!-- Desk Props (Blueprints, Coffee Mug, Architect Compass) -->
    <rect x="50" y="145" width="35" height="15" rx="1" fill="#e2e8f0" />
    <path d="M55 148 L75 148 M55 153 L70 153" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <!-- Coffee mug -->
    <rect x="160" y="142" width="14" height="18" rx="3" fill="#ec4899" />
    <path d="M174 146 C179 146 179 156 174 156" fill="none" stroke="#ec4899" stroke-width="2" />
  </g>

  <!-- Main Characters: "He" (Reliable Architect/Leader) and Colleague -->
  <g id="characters">
    <!-- SECONDARY CHARACTER (Colleague looking relieved / supported) -->
    <g id="colleague" transform="translate(145, 105)">
      <!-- Body -->
      <path d="M 30 67 C 30 52 45 45 45 45 C 45 45 55 52 55 67 L 55 75 L 30 75 Z" fill="#3b82f6" />
      <!-- Head -->
      <circle cx="42" cy="32" r="13" fill="#fbcfe8" />
      <!-- Hair -->
      <path d="M 29 32 C 29 20 45 18 53 26 C 50 22 38 22 31 28 Z" fill="#475569" />
      <!-- Relaxed/Happy Face expression -->
      <path d="M 38 33 Q 41 36 44 33" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <circle cx="37" cy="30" r="1.5" fill="#1e293b" />
      <circle cx="45" cy="30" r="1.5" fill="#1e293b" />
    </g>

    <!-- PRIMARY CHARACTER: "他" (Reliable, Confident, Supportive Man) -->
    <g id="reliable-man" transform="translate(60, 90)">
      <!-- Torso & Posture (Solid, upright stance, reassuring gesture) -->
      <path d="M 25 85 C 25 65 45 55 60 55 C 75 55 95 65 95 85 L 90 120 L 30 120 Z" fill="#0f766e" /> <!-- Teal professional shirt -->
      <!-- Arm gesturing support / handshake or steady hand on blueprint -->
      <path d="M 25 70 Q 10 80 18 95" fill="none" stroke="#0f766e" stroke-width="14" stroke-linecap="round" />
      <circle cx="16" cy="98" r="7" fill="#fcd34d" /> <!-- Hand -->

      <!-- Right arm reassuring/steady -->
      <path d="M 90 75 Q 105 85 95 100" fill="none" stroke="#0f766e" stroke-width="14" stroke-linecap="round" />
      <circle cx="95" cy="103" r="7" fill="#fcd34d" />

      <!-- Neck -->
      <rect x="52" y="46" width="16" height="12" rx="4" fill="#fcd34d" />

      <!-- Head & Confident, Warm Expression -->
      <circle cx="60" cy="34" r="18" fill="#fcd34d" />
      
      <!-- Hair: Neat, modern styling -->
      <path d="M 42 34 C 42 16 78 16 78 34 C 74 24 46 24 42 34 Z" fill="#1e293b" />

      <!-- Confident/Reliable Facial Features -->
      <!-- Warm, steady eyes -->
      <path d="M 50 33 Q 53 31 56 33" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M 64 33 Q 67 31 70 33" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Reassuring, warm smile -->
      <path d="M 54 41 Q 60 46 66 41" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

      <!-- Trust/Reliability Symbol Accent: Subtle glowing check/shield aura near chest -->
      <circle cx="60" cy="85" r="12" fill="#10b981" opacity="0.2" />
      <path d="M 54 85 L 58 89 L 67 80" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Foreground details to create depth -->
  <g id="foreground" opacity="0.8">
    <circle cx="35" cy="190" r="2" fill="#64748b" />
    <circle cx="215" cy="180" r="3" fill="#64748b" />
  </g>
</svg>