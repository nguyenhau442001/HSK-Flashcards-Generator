<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window Frame -->
  <rect x="40" y="30" width="160" height="180" rx="10" fill="#334155" stroke="#475569" stroke-width="4"/>
  <line x1="120" y1="30" x2="120" y2="210" stroke="#475569" stroke-width="4"/>
  
  <!-- Distant Hometown Landscape (Inside Window) -->
  <path d="M40 150 Q 80 120 120 150 T 200 150 L 200 210 L 40 210 Z" fill="#1e3a8a"/>
  <circle cx="170" cy="70" r="20" fill="#fbbf24"/>
  <path d="M60 160 L 70 130 L 80 160 Z" fill="#334155"/>
  <path d="M150 170 L 165 140 L 180 170 Z" fill="#334155"/>
  
  <!-- Character -->
  <g transform="translate(0, 10)">
    <!-- Desk -->
    <rect x="20" y="180" width="200" height="60" fill="#1e293b"/>
    
    <!-- Person sitting -->
    <path d="M120 160 C 140 160 150 180 150 210 L 90 210 C 90 180 100 160 120 160" fill="#64748b"/>
    <circle cx="120" cy="140" r="25" fill="#fde68a"/>
    
    <!-- Expression of longing -->
    <path d="M110 135 A 5 5 0 1 0 110 145 A 5 5 0 1 0 110 135" fill="#0f172a"/>
    <path d="M130 135 A 5 5 0 1 0 130 145 A 5 5 0 1 0 130 135" fill="#0f172a"/>
    <path d="M115 155 Q 120 160 125 155" stroke="#0f172a" stroke-width="2" fill="none"/>
    
    <!-- Hand on chin -->
    <circle cx="105" cy="165" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Warm glow on desk -->
  <ellipse cx="120" cy="220" rx="60" ry="15" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Decorative element: Nostalgic photo frame on desk -->
  <rect x="45" y="190" width="30" height="40" rx="2" fill="#fb923c"/>
  <rect x="50" y="195" width="20" height="20" fill="#38bdf8"/>
</svg>