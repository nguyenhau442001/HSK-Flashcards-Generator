<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Classroom Background Elements -->
  <rect x="20" y="40" width="200" height="120" rx="4" fill="#334155" opacity="0.5"/>
  <rect x="30" y="50" width="180" height="100" rx="2" fill="#1e293b"/>
  <rect x="40" y="60" width="160" height="80" fill="#2d3748"/>
  
  <!-- Desk Row 1 -->
  <rect x="30" y="160" width="180" height="15" fill="#475569" rx="2"/>
  
  <!-- Students (Female - Majority) -->
  <circle cx="60" cy="130" r="12" fill="#ec4899"/>
  <circle cx="100" cy="125" r="12" fill="#ec4899"/>
  <circle cx="140" cy="130" r="12" fill="#ec4899"/>
  <circle cx="180" cy="125" r="12" fill="#ec4899"/>
  
  <!-- Student (Male - Minority) -->
  <circle cx="120" cy="150" r="12" fill="#38bdf8"/>
  
  <!-- Details: Books/Pencils on desks -->
  <rect x="55" y="145" width="10" height="3" fill="#fbbf24"/>
  <rect x="95" y="140" width="10" height="3" fill="#fbbf24"/>
  <rect x="135" y="145" width="10" height="3" fill="#fbbf24"/>
  <rect x="175" y="140" width="10" height="3" fill="#fbbf24"/>
  <rect x="115" y="165" width="10" height="3" fill="#fbbf24"/>
  
  <!-- Lighting/Atmosphere -->
  <circle cx="200" cy="30" r="30" fill="#f59e0b" opacity="0.1"/>
  <circle cx="200" cy="30" r="15" fill="#f59e0b" opacity="0.2"/>
</svg>