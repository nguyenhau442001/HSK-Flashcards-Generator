<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Table Surface -->
    <rect x="0" y="120" width="160" height="10" rx="2" fill="#334155"/>
    
    <!-- Thick Book (Comparison) -->
    <rect x="10" y="50" width="40" height="70" rx="4" fill="#fb923c"/>
    <rect x="10" y="50" width="40" height="10" rx="4" fill="#f59e0b"/>
    <rect x="12" y="65" width="36" height="5" rx="1" fill="#1e293b" opacity="0.2"/>
    <rect x="12" y="75" width="36" height="5" rx="1" fill="#1e293b" opacity="0.2"/>
    <rect x="12" y="85" width="36" height="5" rx="1" fill="#1e293b" opacity="0.2"/>
    
    <!-- Thin Book (Subject) -->
    <rect x="70" y="105" width="80" height="15" rx="2" fill="#38bdf8"/>
    <rect x="70" y="105" width="80" height="3" rx="1" fill="#0ea5e9"/>
    <path d="M70 105 L75 100 L155 100 L150 105 Z" fill="#0ea5e9"/>
    <path d="M150 105 L155 100 L155 115 L150 120 Z" fill="#0284c7"/>
    
