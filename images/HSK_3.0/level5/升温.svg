<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Sun/Heat source -->
  <circle cx="190" cy="50" r="25" fill="#fbbf24" opacity="0.8"/>
  <path d="M190 15 L190 5 M215 40 L225 30 M225 60 L235 60 M215 80 L225 90 M190 85 L190 95" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Background elements - Park/City transition -->
  <path d="M0 240 L0 180 Q60 150 120 180 T240 170 L240 240 Z" fill="#1e3a8a" opacity="0.4"/>
  <path d="M0 240 L0 190 Q80 160 160 190 T240 180 L240 240 Z" fill="#0f172a"/>
  
  <!-- Character 1: Person taking off jacket -->
  <g transform="translate(60, 120)">
    <path d="M20 100 L20 60 Q20 40 40 40 T60 60 L60 100" fill="#ec4899"/>
    <circle cx="40" cy="35" r="15" fill="#fde68a"/>
    <path d="M30 60 L10 80 M50 60 L70 80" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <path d="M25 40 L15 20" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2: Person holding ice cream -->
  <g transform="translate(140, 130)">
