    <path d="M35 30 L45 30" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 25 L40 15" fill="#fb923c"/>
    <path d="M35 15 L45 15 L40 5 Z" fill="#f43f5e"/>
  </g>
  
  <!-- Heat waves -->
  <path d="M100 80 Q110 70 120 80 T140 80" stroke="#fb923c" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M110 90 Q120 80 130 90 T150 90" stroke="#fb923c" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Calendar hint (May) -->
  <rect x="20" y="20" width="30" height="35" rx="4" fill="#334155"/>
  <rect x="22" y="22" width="26" height="8" fill="#f43f5e"/>
