<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Shelf Structure -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="20" y="150" width="200" height="90" fill="#0f172a" opacity="0.3"/>
  
  <!-- Milk Cartons -->
  <rect x="40" y="80" width="40" height="60" rx="4" fill="#f1f5f9"/>
  <rect x="40" y="80" width="40" height="15" rx="4" fill="#38bdf8"/>
  <rect x="100" y="80" width="40" height="60" rx="4" fill="#f1f5f9"/>
  <rect x="100" y="80" width="40" height="15" rx="4" fill="#38bdf8"/>
  <rect x="160" y="80" width="40" height="60" rx="4" fill="#f1f5f9"/>
  <rect x="160" y="80" width="40" height="15" rx="4" fill="#38bdf8"/>
  
  <!-- Character -->
  <g transform="translate(130, 100)">
    <!-- Arm -->
    <path d="M -20 40 L 10 20" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand holding carton -->
    <rect x="5" y="10" width="30" height="40" rx="4" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
    <rect x="5" y="10" width="30" height="10" fill="#fbbf24"/>
    <!-- Body -->
    <circle cx="-30" cy="60" r="25" fill="#fb923c"/>
    <path d="M -55 60 Q -30 100 -5 60" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="-30" cy="20" r="20" fill="#fde68a"/>
    <!-- Eye focusing -->
    <ellipse cx="-22" cy="15" rx="3" ry="4" fill="#0f172a"/>
    <ellipse cx="-38" cy="15" rx="3" ry="4" fill="#0f172a"/>
  </g>
  
  <!-- Magnifying Glass Effect -->
  <circle cx="25" cy="30" r="15" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M 35 40 L 50 55" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative highlights -->
  <circle cx="200" cy="40" r="3" fill="#10b981"/>
  <circle cx="215" cy="50" r="2" fill="#ec4899"/>
</svg>