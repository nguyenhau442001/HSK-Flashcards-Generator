<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Kitchen Counter -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <rect x="0" y="175" width="240" height="5" fill="#475569"/>
  
  <!-- Microwave -->
  <rect x="60" y="80" width="120" height="90" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <rect x="70" y="90" width="70" height="70" rx="4" fill="#0f172a"/>
  <rect x="150" y="90" width="20" height="70" rx="4" fill="#334155"/>
  <circle cx="160" cy="110" r="3" fill="#fb923c"/>
  <circle cx="160" cy="130" r="3" fill="#38bdf8"/>
  
  <!-- Milk Mug Inside -->
  <rect x="85" y="115" width="20" height="30" rx="2" fill="#f1f5f9"/>
  <path d="M105 125 h5 v10 h-5" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Warm Glow Effect -->
  <circle cx="105" cy="125" r="25" fill="#fbbf24" opacity="0.15"/>
  
  <!-- Character (Upper Body) -->
  <g transform="translate(170, 110)">
    <path d="M20 120 c0 -20 10 -30 30 -30 s30 10 30 30 v10 h-60 z" fill="#ec4899"/>
    <circle cx="50" cy="70" r="15" fill="#fde68a"/>
    <path d="M40 65 q5 -5 10 0 M60 65 q5 -5 10 0" stroke="#78350f" stroke-width="2" fill="none"/>
    <path d="M45 75 q5 2 10 0" stroke="#78350f" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Steam -->
  <path d="M95 110 q-5 -10 0 -20 M105 110 q5 -10 0 -20" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Timer Indicator -->
  <rect x="75" y="95" width="10" height="5" fill="#10b981"/>
