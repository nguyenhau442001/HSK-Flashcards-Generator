<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Room Interior Background Elements -->
  <!-- Wall / Door frame lines -->
  <path d="M160 20 L160 240" stroke="#334155" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="175" y="40" width="45" height="180" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="185" cy="130" r="3" fill="#64748b"/>

  <!-- Bookshelf / Home Decor Props in background -->
  <rect x="20" y="45" width="50" height="8" rx="2" fill="#334155"/>
  <path d="M28 45 L28 30 L38 30 L38 45 Z" fill="#38bdf8" opacity="0.6"/>
  <path d="M40 45 L40 25 L52 25 L52 45 Z" fill="#ec4899" opacity="0.6"/>

  <!-- Light Switch on the Wall (Target interaction point) -->
  <rect x="152" y="110" width="16" height="24" rx="3" fill="#cbd5e1" filter="url(#softShadow)"/>
  <!-- Switch toggle (in 'OFF' position - bottom tilted) -->
  <rect x="156" y="121" width="8" height="10" rx="1.5" fill="#64748b"/>

  <!-- Character (Man stepping out / passing by, casually turning off the light) -->
  <g filter="url(#softShadow)">
    <!-- Body / Torso (Casual hoodie/shirt in dark slate/teal) -->
    <path d="M90 140 C90 125 110 120 125 130 L135 180 L95 180 Z" fill="#0ea5e9"/>
    
    <!-- Head & Face (Profile view facing right towards the switch) -->
    <circle cx="115" cy="95" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M98 92 C98 80 115 78 128 88 C132 91 130 96 125 93 C118 87 105 88 102 96 Z" fill="#334155"/>
    
    <!-- Arm and Hand performing the 'Suíshǒu' (casual/convenient) action -->
    <!-- Upper arm -->
    <path d="M110 135 L145 125" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round"/>
    <!-- Forearm & Hand reaching lightly to the switch -->
    <path d="M140 125 L154 122" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Legs in motion -->
    <path d="M100 180 L90 230" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <path d="M125 180 L135 225" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Ceiling Light Fixture (Dim/Turning Off Effect) -->
  <path d="M100 0 L140 0 L130 15 L110 15 Z" fill="#475569"/>
  <line x1="120" y1="15" x2="120" y2="30" stroke="#64748b" stroke-width="2"/>
  <circle cx="120" cy="32" r="10" fill="#fef08a" filter="url(#lampGlow)"/>

  <!-- Cone of fading warm light illuminating the room -->
  <polygon points="120,35 40,240 200,240" fill="url(#lightBeam)"/>

  <!-- Additional cozy room props to reinforce concrete real-world setting -->
  <!-- Houseplant in corner -->
  <path d="M20 200 Q20 170 40 170 Q60 170 60 200 Z" fill="#334155"/>
  <path d="M40 170 L40 140" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 155 Q20 145 25 130 Q45 145 40 155 Z" fill="#10b981"/>
  <path d="M40 145 Q60 135 55 120 Q35 135 40 145 Z" fill="#34d399"/>
  <path d="M40 160 Q55 150 50 135 Q35 145 40 160 Z" fill="#059669"/>

  <!-- Subtle motion/action lines near the hand indicating the swift, casual motion -->
  <path d="M148 112 Q152 108 158 110" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M145 116 Q150 112 155 114" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

</svg>