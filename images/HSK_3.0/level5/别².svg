<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Character 1 (The Worrier) -->
  <g transform="translate(40, 60)">
    <circle cx="40" cy="40" r="30" fill="#fde68a"/>
    <path d="M25 35 Q30 30 35 35 M45 35 Q50 30 55 35" stroke="#475569" stroke-width="3" fill="none"/>
    <path d="M30 55 Q40 45 50 55" stroke="#475569" stroke-width="3" fill="none"/>
    <rect x="10" y="80" width="60" height="90" rx="15" fill="#fb923c"/>
  </g>
  
  <!-- Character 2 (The Comforter) -->
  <g transform="translate(130, 60)">
    <circle cx="40" cy="40" r="30" fill="#fde68a"/>
    <path d="M25 35 Q30 30 35 35 M45 35 Q50 30 55 35" stroke="#475569" stroke-width="3" fill="none"/>
    <path d="M30 50 Q40 60 50 50" stroke="#475569" stroke-width="3" fill="none"/>
    <rect x="10" y="80" width="60" height="90" rx="15" fill="#38bdf8"/>
    <!-- Reassuring Hand -->
    <ellipse cx="0" cy="100" rx="15" ry="8" fill="#fde68a"/>
  </g>
  
  <!-- Props -->
  <rect x="50" y="170" width="40" height="30" rx="5" fill="#10b981"/>
  <circle cx="160" cy="185" r="15" fill="#ec4899"/>
  
  <!-- Ambient Light Glow -->
  <circle cx="120" cy="120" r="150" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>