<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Left side: Urban Cityscape (城区) -->
  <g transform="translate(125, 60)">
    <rect x="0" y="40" width="90" height="120" rx="4" fill="#334155"/>
    <rect x="15" y="55" width="20" height="20" fill="#f59e0b" opacity="0.8"/>
    <rect x="55" y="55" width="20" height="20" fill="#f59e0b" opacity="0.8"/>
    <rect x="15" y="90" width="20" height="20" fill="#f59e0b" opacity="0.8"/>
    <rect x="55" y="90" width="20" height="20" fill="#f59e0b" opacity="0.8"/>
    <circle cx="45" cy="20" r="15" fill="#fb923c"/>
  </g>

  <!-- Right side: Suburban Landscape (郊区) -->
  <g transform="translate(25, 120)">
    <path d="M0 60 L40 20 L80 60 Z" fill="#10b981"/>
    <rect x="20" y="50" width="40" height="40" fill="#64748b"/>
    <circle cx="60" cy="10" r="8" fill="#fbbf24"/>
  </g>

  <!-- Characters: Couple looking at a price tag -->
  <g transform="translate(60, 140)">
    <!-- Person 1 -->
    <circle cx="20" cy="20" r="10" fill="#e2e8f0"/>
    <path d="M10 30 Q20 50 30 30" stroke="#e2e8f0" stroke-width="4" fill="none"/>
    <!-- Person 2 -->
    <circle cx="50" cy="20" r="10" fill="#e2e8f0"/>
    <path d="M40 30 Q50 50 60 30" stroke="#e2e8f0" stroke-width="4" fill="none"/>
    
    <!-- Price Tag floating between them -->
    <rect x="25" y="-10" width="30" height="15" rx="2" fill="#ec4899"/>
    <path d="M40 5 L45 10 L35 10 Z" fill="#ec4899"/>
    <line x1="30" y1="-2" x2="50" y2="-2" stroke="white" stroke-width="2"/>
  </g>

  <!-- Ground Line -->
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
</svg>