<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Home Office / Room) -->
  <g id="environment">
    <!-- Window with night city view -->
    <rect x="150" y="30" width="60" height="70" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <line x1="180" y1="30" x2="180" y2="100" stroke="#475569" stroke-width="1.5"/>
    <line x1="150" y1="65" x2="210" y2="65" stroke="#475569" stroke-width="1.5"/>
    <!-- City lights outside -->
    <rect x="156" y="40" width="6" height="8" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="168" y="50" width="5" height="12" rx="1" fill="#38bdf8" opacity="0.5"/>
    <rect x="190" y="45" width="8" height="15" rx="1" fill="#fbbf24" opacity="0.7"/>
    <rect x="160" y="80" width="7" height="10" rx="1" fill="#ec4899" opacity="0.4"/>
    <rect x="195" y="75" width="6" height="14" rx="1" fill="#38bdf8" opacity="0.6"/>

    <!-- Bookshelf / Prop in background -->
    <rect x="30" y="40" width="40" height="60" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="30" y1="60" x2="70" y2="60" stroke="#334155" stroke-width="2"/>
    <line x1="30" y1="80" x2="70" y2="80" stroke="#334155" stroke-width="2"/>
    <!-- Books -->
    <rect x="35" y="45" width="6" height="15" fill="#475569" rx="1"/>
    <rect x="43" y="47" width="8" height="13" fill="#3b82f6" rx="1"/>
    <rect x="36" y="68" width="10" height="12" fill="#10b981" rx="1"/>

    <!-- Desk Surface -->
    <path d="M 20 160 L 220 160 L 230 200 L 10 200 Z" fill="url(#deskGrad)"/>
    <rect x="10" y="156" width="220" height="6" rx="2" fill="#475569"/>

    <!-- Desk Props -->
    <!-- Cardboard box of belongings (moving out / fired context) -->
    <path d="M 40 130 L 75 130 L 80 160 L 35 160 Z" fill="#b45309"/>
    <path d="M 40 130 L 57 115 L 75 130 Z" fill="#d97706"/>
    <path d="M 57 115 L 57 145" stroke="#92400e" stroke-width="1.5"/>
    <!-- Rolled up papers / documents inside box -->
    <circle cx="50" cy="125" r="4" fill="#f1f5f9"/>
    <circle cx="58" cy="122" r="3" fill="#cbd5e1"/>

    <!-- Coffee Mug -->
    <rect x="175" y="135" width="14" height="18" rx="2" fill="#e2e8f0"/>
    <path d="M 189 139 C 195 139, 195 149, 189 149" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    <path d="M 179 130 C 180 126, 184 126, 185 130" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Laptop showing termination / notification screen -->
    <path d="M 95 135 L 145 135 L 152 158 L 88 158 Z" fill="#64748b"/>
    <rect x="98" y="105" width="44" height="32" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- Screen content: Abstract notification/red cross or downward chart symbolizing job loss -->
    <rect x="104" y="112" width="32" height="18" rx="1" fill="url(#screenGrad)"/>
    <path d="M 112 126 L 120 118 L 128 123 L 134 115" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="134" cy="115" r="2.5" fill="#ef4444"/>
    <!-- Laptop base -->
    <path d="M 80 158 L 160 158 L 166 162 L 74 162 Z" fill="#94a3b8"/>
  </g>

  <!-- Main Character (Expressive, slumped posture, concerned/sad expression) -->
  <g id="character">
    <!-- Chair back -->
    <rect x="100" y="85" width="28" height="75" rx="6" fill="#334155"/>
    <rect x="106" y="95" width="16" height="55" rx="4" fill="#1e293b"/>

    <!-- Body / Torso (Slumped forward) -->
    <path d="M 95 125 C 95 110, 110 105, 125 115 C 135 122, 140 140, 140 160 L 95 160 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt details -->
    <path d="M 112 112 L 118 122 L 126 114" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <path d="M 110 70 C 98 70, 95 85, 102 92 C 108 98, 122 98, 128 92 C 135 85, 132 70, 120 70 Z" fill="#1e293b"/> <!-- Hair -->
    <circle cx="115" cy="84" r="12" fill="#fbcfe8"/> <!-- Face skin -->
    
    <!-- Facial Features: Worried / Stressed expression -->
    <!-- Eyebrows (slanted downward in worry) -->
    <line x1="108" y1="80" x2="114" y2="83" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="83" x2="126" y2="80" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Closed / Sad eyes -->
    <path d="M 109 87 Q 112 90 115 87" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 119 87 Q 122 90 125 87" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Worried mouth / Frown -->
    <path d="M 113 96 Q 117 93 121 96" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms resting on desk / head in hands -->
    <!-- Left Arm -->
    <path d="M 102 120 C 90 125, 85 140, 92 145 C 98 150, 105 140, 108 135" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm / Hand supporting head -->
    <path d="M 125 120 C 135 125, 138 138, 130 145 C 122 152, 115 145, 115 138" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="123" cy="94" r="4" fill="#fbcfe8"/> <!-- Hand touching chin/cheek -->
  </g>

  <!-- Ambient lighting / Mood overlay -->
  <circle cx="120" cy="120" r="100" fill="#38bdf8" opacity="0.03" filter="url(#glow)"/>
</svg>