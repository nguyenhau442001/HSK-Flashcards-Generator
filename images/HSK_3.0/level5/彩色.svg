<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="30" y="175" width="10" height="50" fill="#475569"/>
  <rect x="200" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Printer -->
  <rect x="130" y="110" width="80" height="50" rx="6" fill="#64748b"/>
  <rect x="140" y="100" width="60" height="10" rx="2" fill="#475569"/>
  <rect x="135" y="150" width="70" height="10" rx="2" fill="#334155"/>
  
  <!-- The Photo emerging from printer -->
  <rect x="140" y="155" width="60" height="40" fill="#f8fafc"/>
  <rect x="145" y="160" width="50" height="30" fill="#fb923c"/>
  <circle cx="160" cy="170" r="5" fill="#38bdf8"/>
  <path d="M170 180 L185 170 L190 185 Z" fill="#10b981"/>
  
  <!-- Character -->
  <g transform="translate(40, 80)">
    <!-- Body -->
    <path d="M20 120 C20 90, 80 90, 80 120 L80 150 L20 150 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="50" cy="70" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M30 65 C30 40, 70 40, 70 65 C70 55, 60 50, 50 50 C40 50, 30 55, 30 65" fill="#fbbf24"/>
    <!-- Eyes -->
    <circle cx="42" cy="65" r="3" fill="#0f172a"/>
    <circle cx="58" cy="65" r="3" fill="#0f172a"/>
    <!-- Arm reaching -->
    <path d="M75 110 L110 130" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Ambient Light -->
  <circle cx="180" cy="50" r="40" fill="#fbbf24" opacity="0.05"/>
</svg>