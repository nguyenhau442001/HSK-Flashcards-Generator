<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Construction Site Elements -->
  <rect x="30" y="140" width="180" height="60" rx="4" fill="#475569"/>
  <rect x="40" y="150" width="160" height="40" fill="#64748b"/>
  
  <!-- Architect/Planner -->
  <g transform="translate(60, 110)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <rect x="15" y="35" width="10" height="40" fill="#38bdf8"/>
    <rect x="5" y="45" width="30" height="8" fill="#38bdf8"/>
    <path d="M10 75 L15 100 M30 75 L25 100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Blueprint/Plan -->
  <rect x="110" y="120" width="60" height="45" fill="#f1f5f9" rx="2"/>
  <path d="M115 130 L165 130 M115 140 L165 140 M115 150 L140 150" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Future Library Outline (Ghosted) -->
  <path d="M140 60 L200 60 L200 140 L140 140 Z" fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M140 60 L170 30 L200 60" fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="6 4"/>
  
  <!-- Crane/Construction Tool -->
  <path d="M200 140 L220 140 L210 50 Z" fill="#ec4899"/>
  <circle cx="210" cy="50" r="5" fill="#ec4899"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="60" r="3" fill="#10b981"/>
  <circle cx="50" cy="50" r="2" fill="#10b981"/>
  <circle cx="220" cy="30" r="4" fill="#fbbf24"/>
