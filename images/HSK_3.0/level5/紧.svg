<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Clock on wall -->
  <circle cx="180" cy="60" r="25" fill="#334155"/>
  <circle cx="180" cy="60" r="22" fill="#f8fafc"/>
  <line x1="180" y1="60" x2="180" y2="45" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="60" x2="195" y2="60" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="180" cy="60" r="3" fill="#ef4444"/>

  <!-- Character 1 (Running/Ready) -->
  <g transform="translate(60, 120)">
    <path d="M20 100 L40 100 L35 60 L25 60 Z" fill="#38bdf8"/>
    <ellipse cx="30" cy="50" rx="15" ry="18" fill="#fde68a"/>
    <circle cx="30" cy="30" r="12" fill="#fde68a"/>
    <path d="M22 28 L26 32 M34 28 L38 32" stroke="#1e293b" stroke-width="2"/>
    <path d="M25 38 Q30 42 35 38" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M10 80 L25 70 L20 100" fill="#38bdf8"/>
    <path d="M40 80 L55 70 L50 100" fill="#38bdf8"/>
  </g>

  <!-- Character 2 (Checking watch) -->
  <g transform="translate(130, 130)">
    <path d="M20 90 L40 90 L35 50 L25 50 Z" fill="#fb923c"/>
    <ellipse cx="30" cy="40" rx="15" ry="18" fill="#fde68a"/>
    <circle cx="30" cy="20" r="12" fill="#fde68a"/>
    <rect x="40" y="45" width="10" height="5" fill="#fbbf24" rx="1"/>
    <path d="M22 18 L26 22 M34 18 L38 22" stroke="#1e293b" stroke-width="2"/>
    <path d="M25 28 Q30 32 35 28" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>

  <!-- Suitcase/Bag -->
  <rect x="100" y="160" width="30" height="25" rx="4" fill="#ec4899"/>
  <rect x="105" y="155" width="20" height="5" rx="2" fill="#ec4899"/>

  <!-- Doorway/Exit -->
  <rect x="190" y="80" width="40" height="120" rx="5" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <circle cx="215" cy="140" r="4" fill="#fbbf24"/>
  
  <!-- Motion lines -->
  <path d="M40 130 L20 120 M50 140 L30 130" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
</svg>