<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    
    <!-- Lens Glow Gradient -->
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Concentrated Focal Point Gradient -->
    <radialGradient id="focalPoint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Laser Beam / Ray Gradient -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Subtle Background Grid/Details for Environment -->
  <g opacity="0.15">
    <line x1="30" y1="60" x2="210" y2="60" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="30" y1="120" x2="210" y2="120" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="30" y1="180" x2="210" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="120" cy="120" r="80" stroke="#64748b" stroke-width="1" fill="none"/>
    <circle cx="120" cy="120" r="50" stroke="#64748b" stroke-width="1" fill="none"/>
  </g>

  <!-- Converging Focus Light Rays (Action lines of concentration) -->
  <g opacity="0.4" filter="url(#glowEffect)">
    <polygon points="120,120 10,20 20,40" fill="url(#laserBeam)"/>
    <polygon points="120,120 220,30 210,50" fill="url(#laserBeam)"/>
    <polygon points="120,120 230,190 210,195" fill="url(#laserBeam)"/>
    <polygon points="120,120 20,210 35,195" fill="url(#laserBeam)"/>
  </g>

  <!-- Target Center / Focal Point (The bullseye of concentration) -->
  <g transform="translate(120, 120)" filter="url(#softShadow)">
    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="36" fill="url(#focalPoint)" opacity="0.6"/>
    
    <!-- Target Rings -->
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#ef4444"/>
    
    <!-- Sparkles/Energy at the focal center -->
    <path d="M 0,-14 L 3,-3 L 14,0 L 3,3 L 0,14 L -3,3 L -14,0 L -3,-3 Z" fill="#ffffff" filter="url(#glowEffect)"/>
  </g>

  <!-- Magnifying Glass / Scientific Apparatus Representing Focus (Tập trung) -->
  <!-- Angled Handle -->
  <g filter="url(#softShadow)">
    <rect x="45" y="155" width="40" height="14" rx="7" transform="rotate(45 45 155)" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="50" y="157" width="30" height="5" rx="2.5" transform="rotate(45 50 157)" fill="#475569"/>
  </g>

  <!-- Main Glass Rim and Lens Body -->
  <g filter="url(#softShadow)" transform="translate(120, 120)">
    <!-- Outer Rim Frame (Rotated to point towards the center) -->
    <circle cx="-35" cy="-35" r="48" fill="#0f172a" stroke="#0284c7" stroke-width="6"/>
    <circle cx="-35" cy="-35" r="48" fill="none" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Glass Inner Surface -->
    <circle cx="-35" cy="-35" r="42" fill="url(#lensGlow)"/>
    
    <!-- Lens Reflection Highlights -->
    <path d="M -62 -55 A 42 42 0 0 1 -15 -72" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M -58 -65 A 42 42 0 0 1 -35 -77" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Dynamic Flying Particles/Idea fragments being pulled into the center -->
  <g filter="url(#glowEffect)">
    <!-- Particle 1 (Teal) -->
    <circle cx="50" cy="70" r="5" fill="#2dd4bf"/>
    <path d="M 50 70 Q 85 95 115 118" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-dasharray="3 3" opacity="0.8"/>

    <!-- Particle 2 (Amber) -->
    <circle cx="190" cy="80" r="4" fill="#fbbf24"/>
    <path d="M 190 80 Q 155 100 125 118" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="3 3" opacity="0.8"/>

    <!-- Particle 3 (Pink) -->
    <circle cx="170" cy="180" r="6" fill="#f43f5e"/>
    <path d="M 170 180 Q 145 150 122 122" stroke="#f43f5e" stroke-width="2" fill="none" stroke-dasharray="3 3" opacity="0.8"/>

    <!-- Particle 4 (Blue) -->
    <circle cx="70" cy="170" r="4" fill="#38bdf8"/>
    <path d="M 70 170 Q 95 145 118 122" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="3 3" opacity="0.8"/>
  </g>

  <!-- Foreground Atmospheric Sparkles -->
  <circle cx="105" cy="95" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="135" cy="100" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="125" cy="140" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="95" cy="130" r="1.5" fill="#ffffff" opacity="0.6"/>

</svg>