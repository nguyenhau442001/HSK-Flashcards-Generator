<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wood/Beam Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <!-- Floating dust particles / sparks -->
  <circle cx="45" cy="50" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="190" cy="40" r="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="210" cy="110" r="1" fill="#fbbf24" opacity="0.8"/>
  <circle cx="30" cy="140" r="2.5" fill="#fb923c" opacity="0.5"/>
  <circle cx="160" cy="25" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- Ambient Construction Glow -->
  <circle cx="120" cy="140" r="70" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- SCENE: Dilapidated Old Wooden House Wall Being Demolished/Unassembled -->
  <!-- Background Wall Structure -->
  <g id="background-structure" filter="url(#dropShadow)">
    <!-- Back dark interior -->
    <rect x="50" y="55" width="140" height="135" rx="4" fill="#090d16"/>
    
    <!-- Old Brick Wall Texture / Backing -->
    <path d="M50 55 H190 V190 H50 Z" fill="#1e293b" opacity="0.7"/>
    <!-- Horizontal brick lines -->
    <line x1="50" y1="80" x2="190" y2="80" stroke="#0f172a" stroke-width="2"/>
    <line x1="50" y1="105" x2="190" y2="105" stroke="#0f172a" stroke-width="2"/>
    <line x1="50" y1="130" x2="190" y2="130" stroke="#0f172a" stroke-width="2"/>
    <line x1="50" y1="155" x2="190" y2="155" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Wooden Beams & Planks (Some falling/being pulled apart to represent 'dỡ/tháo ra') -->
  <!-- Intact top beam -->
  <rect x="45" y="50" width="150" height="12" rx="2" fill="url(#woodGrad)" filter="url(#dropShadow)"/>
  <line x1="45" y1="53" x2="195" y2="53" stroke="#92400e" stroke-width="1"/>

  <!-- Vertical structural studs -->
  <rect x="55" y="62" width="12" height="120" rx="2" fill="#9a3412" filter="url(#dropShadow)"/>
  <rect x="173" y="62" width="12" height="120" rx="2" fill="#9a3412" filter="url(#dropShadow)"/>

  <!-- Unassembling/Falling Planks (Dynamic action lines & floating pieces) -->
  <!-- Plank 1: Being pried loose diagonally -->
  <g transform="translate(90, 80) rotate(-15)">
    <rect x="-35" y="-8" width="110" height="16" rx="2" fill="url(#woodGrad)" filter="url(#dropShadow)"/>
    <!-- Wood grain details -->
    <path d="M-20 -4 Q 0 4, 30 -2" stroke="#92400e" stroke-width="1.5" fill="none"/>
    <circle cx="-25" cy="0" r="1.5" fill="#451a03"/>
    <circle cx="40" cy="0" r="1.5" fill="#451a03"/>
  </g>

  <!-- Plank 2: Falling down -->
  <g transform="translate(130, 130) rotate(25)" filter="url(#dropShadow)">
    <rect x="-40" y="-8" width="90" height="16" rx="2" fill="#b45309"/>
    <path d="M-10 2 Q 10 -3, 30 2" stroke="#92400e" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Plank 3: Detached piece floating on the left -->
  <g transform="translate(65, 125) rotate(-35)" filter="url(#dropShadow)">
    <rect x="-25" y="-6" width="60" height="12" rx="2" fill="#d97706"/>
  </g>

  <!-- ACTION & TOOLS: Crowbar actively prying a plank -->
  <g id="demolition-tools" filter="url(#dropShadow)">
    <!-- Crowbar (angled, dynamic, red/metal) -->
    <g transform="translate(110, 105) rotate(-45)">
      <!-- Main bar -->
      <path d="M-5 -45 L5 -45 L8 35 L-2 35 Z" fill="#ef4444"/>
      <path d="M-2 -45 L2 -45 L4 35 L-1 35 Z" fill="#f87171"/>
      <!-- Curved prying end -->
      <path d="M-5 -45 C-5 -55, 5 -55, 5 -45 Z" fill="#b91c1c"/>
      <!-- Hook end -->
      <path d="M-2 35 C-2 42, 8 40, 6 45 C4 42, -5 42, -5 35 Z" fill="#b91c1c"/>
    </g>
  </g>

  <!-- Dynamic Debris, Dust Clouds & Sparks -->
  <!-- Dust puffs around the active prying point -->
  <circle cx="95" cy="95" r="18" fill="#64748b" opacity="0.4" filter="url(#glow)"/>
  <circle cx="85" cy="110" r="12" fill="#94a3b8" opacity="0.3" filter="url(#glow)"/>
  <circle cx="125" cy="80" r="14" fill="#64748b" opacity="0.3" filter="url(#glow)"/>

  <!-- Flying wood splinters / debris -->
  <path d="M 75 85 L 65 75" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 135 110 L 145 100" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 115 150 L 105 160" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <path d="M 90 130 L 80 135" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparks from pulling old rusty nails -->
  <circle cx="102" cy="98" r="2.5" fill="#fbbf24"/>
  <path d="M 102 98 L 112 92" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 102 98 L 96 88" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 102 98 L 110 106" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Foreground Floor / Rubble Base -->
  <rect x="30" y="190" width="180" height="6" rx="3" fill="#0f172a"/>
  <!-- Fallen bricks & debris on the ground -->
  <rect x="70" y="182" width="16" height="10" rx="1" fill="#64748b" transform="rotate(10 78 187)" filter="url(#dropShadow)"/>
  <rect x="140" y="180" width="14" height="12" rx="1" fill="#475569" transform="rotate(-15 147 186)" filter="url(#dropShadow)"/>
  <rect x="100" y="185" width="20" height="7" rx="1" fill="#b45309" transform="rotate(5 110 188)" filter="url(#dropShadow)"/>
  <circle cx="92" cy="188" r="3" fill="#cbd5e1"/>
  <circle cx="132" cy="186" r="2" fill="#94a3b8"/>

  <!-- Ambient lighting highlights (Top-left rim light) -->
  <path d="M 30 30 L 210 30" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>
</svg>