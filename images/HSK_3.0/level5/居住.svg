<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window Frame -->
  <rect x="30" y="30" width="180" height="140" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  <line x1="120" y1="30" x2="120" y2="170" stroke="#475569" stroke-width="4"/>
  
  <!-- Outside View (Night/Years passed) -->
  <circle cx="180" cy="60" r="15" fill="#fbbf24"/>
  <path d="M40 140 Q 60 120 80 140 T 120 140" fill="#10b981" opacity="0.6"/>
  
  <!-- Family Characters -->
  <!-- Father -->
  <g transform="translate(60, 150)">
    <circle cx="0" cy="-30" r="12" fill="#fb923c"/>
    <rect x="-10" y="-18" width="20" height="30" rx="4" fill="#38bdf8"/>
  </g>
  
  <!-- Mother -->
  <g transform="translate(100, 150)">
    <circle cx="0" cy="-30" r="12" fill="#ec4899"/>
    <rect x="-10" y="-18" width="20" height="30" rx="4" fill="#fbbf24"/>
  </g>
  
  <!-- Child -->
  <g transform="translate(140, 160)">
    <circle cx="0" cy="-20" r="8" fill="#10b981"/>
    <rect x="-6" y="-12" width="12" height="20" rx="3" fill="#fb923c"/>
  </g>
  
  <!-- Interior Details -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  
  <!-- Floor Props (Years of living) -->
  <rect x="20" y="190" width="40" height="10" rx="2" fill="#475569"/>
  <rect x="180" y="200" width="30" height="20" rx="2" fill="#475569"/>
  <circle cx="195" cy="190" r="5" fill="#fbbf24"/>
  
  <!-- Cozy Lamp -->
  <path d="M200 130 L 220 130 L 215 170 L 205 170 Z" fill="#fbbf24"/>
  <rect x="208" y="170" width="4" height="10" fill="#334155"/>
  
  <!-- Sentiment -->
  <path d="M10 220 Q 120 200 230 220" stroke="#334155" stroke-width="2" fill="none"/>
</svg>