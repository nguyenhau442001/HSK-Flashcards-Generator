<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Fan Gradient -->
    <linearGradient id="fanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    
    <!-- Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Dark Mode Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Indoor Lighting -->
  <circle cx="120" cy="80" r="110" fill="url(#lampGlow)"/>

  <!-- ENVIRONMENTAL CONTEXT (Room Interior) -->
  <!-- Background Wall & Window Frame -->
  <g opacity="0.6">
    <!-- Window with Night City/Plant view suggestion -->
    <rect x="150" y="30" width="60" height="80" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <line x1="180" y1="30" x2="180" y2="110" stroke="#475569" stroke-width="1.5"/>
    <line x1="150" y1="70" x2="210" y2="70" stroke="#475569" stroke-width="1.5"/>
    <!-- House plant silhouette on windowsill -->
    <path d="M165 110 Q170 95 180 100 Q190 95 195 110 Z" fill="#10b981" opacity="0.8"/>
    <path d="M172 100 Q168 85 160 88" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M188 100 Q192 82 200 86" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Bookshelf / Decorative Shelf in background -->
  <rect x="30" y="45" width="70" height="6" rx="3" fill="#64748b"/>
  <rect x="40" y="25" width="12" height="20" rx="2" fill="#f59e0b"/>
  <rect x="54" y="28" width="10" height="17" rx="2" fill="#10b981"/>
  <rect x="66" y="22" width="14" height="23" rx="2" fill="#ef4444"/>

  <!-- Hanging Lantern or Warm Light Fixture -->
  <path d="M120 0 L120 25" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="120" cy="27" r="6" fill="#fbbf24" filter="url(#softShadow)"/>

  <!-- MAIN SUBJECT: CHARACTER ("她" - She) -->
  <g id="character" filter="url(#softShadow)">
    
    <!-- Chair Backrest -->
    <path d="M70 190 L75 110 Q77 100 87 100 L113 100 Q123 100 125 110 L130 190 Z" fill="#334155"/>
    <rect x="85" y="115" width="30" height="60" rx="4" fill="#1e293b" opacity="0.5"/>

    <!-- Body & Shoulders (Seated Pose) -->
    <path d="M80 145 C80 125 100 120 120 120 C140 120 160 125 160 145 L165 195 L75 195 Z" fill="url(#shirtGrad)"/>
    
    <!-- Collar details -->
    <path d="M105 120 L120 135 L135 120" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <path d="M110 110 L110 124 C110 124 120 126 130 124 L130 110 Z" fill="#fdba74"/>

    <!-- Head & Face Profile/Angle -->
    <circle cx="120" cy="85" r="24" fill="#fdba74"/>

    <!-- Hair Style (Stylish Modern Bob with bangs) -->
    <!-- Back hair / volume -->
    <path d="M96 85 C96 68 106 60 120 60 C134 60 144 68 144 85 L142 105 C142 110 138 112 135 105 C130 95 110 95 105 105 C102 112 98 110 96 105 Z" fill="#0f172a"/>
    <!-- Bangs and front strands -->
    <path d="M98 78 Q120 62 142 78 Q135 95 120 90 Q105 95 98 78 Z" fill="#1e293b"/>

    <!-- Facial Expression (Relaxed, Content Smile) -->
    <!-- Eyes (closed happily or gentle glance) -->
    <path d="M110 82 Q114 86 118 82" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M126 82 Q130 86 134 82" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Gentle Blush -->
    <circle cx="111" cy="88" r="4" fill="#f43f5e" opacity="0.3"/>
    <circle cx="133" cy="88" r="4" fill="#f43f5e" opacity="0.3"/>
    <!-- Smile -->
    <path d="M118 92 Q122 96 126 92" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Arm (Resting) -->
    <path d="M85 135 Q70 155 75 175" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <circle cx="75" cy="177" r="6" fill="#fdba74"/>

  </g> <!-- End Character Body -->

  <!-- RIGHT ARM & THE FAN (CRUCIAL ACTION: "拿着一把扇子" - Holding a fan) -->
  <g id="holding-fan" filter="url(#softShadow)">
    <!-- Right Arm reaching outward/upward dynamically -->
    <path d="M155 130 Q175 135 180 155" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Hand holding the fan handle -->
    <circle cx="182" cy="158" r="6" fill="#fdba74"/>

    <!-- THE FAN ("扇子" - Shànzi) -->
    <!-- Grouped and rotated slightly for natural gesture -->
    <g transform="translate(182, 158) rotate(-25)">
      
      <!-- Fan Handle (Sticks out bottom) -->
      <path d="M-2 0 L-2 22 Q-2 25 0 25 Q2 25 2 22 L2 0 Z" fill="#d97706"/>
      <!-- Handle accent ring -->
      <rect x="-2.5" y="15" width="5" height="3" fill="#b45309"/>

      <!-- Fan Ribs / Framework (Inner lines radiating) -->
      <path d="M0 0 L-22 -35" stroke="#fbcfe8" stroke-width="1.5" opacity="0.6"/>
      <path d="M0 0 L-11 -38" stroke="#fbcfe8" stroke-width="1.5" opacity="0.6"/>
      <path d="M0 0 L0 -40" stroke="#fbcfe8" stroke-width="1.5" opacity="0.6"/>
      <path d="M0 0 L11 -38" stroke="#fbcfe8" stroke-width="1.5" opacity="0.6"/>
      <path d="M0 0 L22 -35" stroke="#fbcfe8" stroke-width="1.5" opacity="0.6"/>

      <!-- Traditional Folded Folding Fan Body (Semicircular/Sector shape) -->
      <path d="M-30 -22 C-30 -38 30 -38 30 -22 L 22 -35 C11 -42 -11 -42 -22 -35 Z" fill="url(#fanGrad)"/>
      
      <!-- Fan Scallop / Fold Details for Rich Vector Texture -->
      <path d="M-28 -25 Q-22 -35 -16 -27 Q-11 -38 0 -28 Q11 -38 16 -27 Q22 -35 28 -25" fill="none" stroke="#fda4af" stroke-width="1.5"/>

      <!-- Decorative Blossom Icon on Fan (Stylized graphic element, NO TEXT) -->
      <circle cx="0" cy="-28" r="5" fill="#fef08a"/>
      <circle cx="-2" cy="-28" r="2.5" fill="#f43f5e"/>
      
      <!-- Soft breeze / airflow visual cues (breeze lines indicating cooling motion) -->
      <path d="M35 -40 Q45 -35 52 -45" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
      <path d="M42 -25 Q55 -22 62 -30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>

  <!-- FOREGROUND PROPS & DETAILS -->
  <!-- Low wooden table / desk surface -->
  <path d="M30 200 L210 200 L200 220 L40 220 Z" fill="#475569"/>
  <rect x="25" y="195" width="190" height="7" rx="3.5" fill="#64748b"/>

  <!-- Teacup on Table -->
  <g transform="translate(65, 185)">
    <!-- Saucer -->
    <ellipse cx="12" cy="12" rx="14" ry="4" fill="#94a3b8"/>
    <!-- Cup Body -->
    <path d="M4 4 L8 14 C8 15 16 15 16 14 L20 4 Z" fill="#f8fafc"/>
    <!-- Steam -->
    <path d="M10 0 Q8 -5 12 -8 Q15 -11 12 -16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Open Book or Notebook on Table -->
  <g transform="translate(130, 192)">
    <path d="M0 8 Q15 2 30 5 L30 18 Q15 15 0 18 Z" fill="#e2e8f0"/>
    <path d="M30 5 Q45 2 60 8 L60 18 Q45 15 30 18 Z" fill="#f1f5f9"/>
    <!-- Book spine / center line -->
    <line x1="30" y1="5" x2="30" y2="18" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Abstract lines simulating text (NO REAL WORDS) -->
    <line x1="8" y1="9" x2="22" y2="7" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="12" x2="20" y2="10" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="38" y1="8" x2="52" y2="10" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  </g>

</svg>