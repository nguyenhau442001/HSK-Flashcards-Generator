<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Kitchen Glow Gradient -->
    <radialGradient id="kitchenGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Steaming Basket Gradient -->
    <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Window/Background Night Grid Effect -->
    <pattern id="tilePattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Kitchen Wall Tiles -->
  <rect width="240" height="170" fill="url(#tilePattern)" opacity="0.5"/>
  
  <!-- Warm Ambient Light from Food/Kitchen -->
  <rect width="240" height="240" rx="24" fill="url(#kitchenGlow)"/>

  <!-- Wooden Countertop Surface -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <rect x="0" y="165" width="240" height="8" fill="#334155"/>
  <rect x="0" y="170" width="240" height="3" fill="#64748b" opacity="0.3"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#090d16" stroke-width="2" opacity="0.6"/>

  <!-- SCENE: 姥姥 (Grandmother) preparing delicious traditional food -->
  <g id="grandmother-scene">
    
    <!-- Background Elements: Kitchen Shelf with Spice Jars -->
    <g opacity="0.7">
      <rect x="30" y="45" width="60" height="4" rx="2" fill="#475569"/>
      <path d="M 40 45 L 45 30 L 55 30 L 60 45 Z" fill="#38bdf8" opacity="0.6"/>
      <path d="M 65 45 L 68 33 L 78 33 L 81 45 Z" fill="#10b981" opacity="0.6"/>
    </g>

    <!-- Hanging ladle and strainer -->
    <g opacity="0.5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M 190 30 Q 185 50 190 60"/>
      <circle cx="190" cy="63" r="6" fill="#475569"/>
      <path d="M 210 30 Q 205 55 210 65"/>
      <ellipse cx="210" cy="68" rx="8" ry="5" fill="#475569"/>
    </g>

    <!-- Grandmother Character (Friendly, Warm Art Style) -->
    <!-- Body / Apron -->
    <path d="M 85 175 Q 85 135 120 135 Q 155 135 155 175 Z" fill="#0284c7"/> <!-- Blue Vest -->
    <path d="M 95 145 L 145 145 L 150 175 L 90 175 Z" fill="#f8fafc"/> <!-- White Apron -->
    
    <!-- Apron Pocket -->
    <rect x="110" y="155" width="20" height="15" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Neck & Head -->
    <rect x="112" y="125" width="16" height="16" fill="#fbcfe8"/> <!-- Neck -->
    <circle cx="120" cy="105" r="22" fill="#fbcfe8"/> <!-- Head -->

    <!-- Gray Hair in Traditional Bun -->
    <path d="M 98 105 Q 96 85 120 85 Q 144 85 142 105 Q 148 115 138 120 Q 120 115 102 120 Q 92 115 98 105 Z" fill="#94a3b8"/>
    <!-- Hair Bun -->
    <circle cx="120" cy="74" r="9" fill="#64748b"/>
    <circle cx="120" cy="74" r="6" fill="#94a3b8"/>

    <!-- Gentle Facial Features -->
    <!-- Warm Smiling Eyes (Crescent shapes) -->
    <path d="M 110 102 Q 114 98 118 102" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 122 102 Q 126 98 130 102" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="108" cy="109" r="4" fill="#fda4af" opacity="0.6"/>
    <circle cx="132" cy="109" r="4" fill="#fda4af" opacity="0.6"/>
    <!-- Warm Smile -->
    <path d="M 115 113 Q 120 117 125 113" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Friendly Glasses (Thin round rims) -->
    <circle cx="114" cy="102" r="7" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <circle cx="126" cy="102" r="7" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <line x1="121" y1="102" x2="119" y2="102" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Arms & Expressive Hands -->
    <!-- Left Arm holding bowl/steamer -->
    <path d="M 88 140 Q 75 155 90 170" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="90" cy="172" r="6" fill="#fbcfe8"/>

    <!-- Right Arm holding cooking utensil / gesturing warmly -->
    <path d="M 152 140 Q 165 155 150 165" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="148" cy="167" r="6" fill="#fbcfe8"/>

    <!-- PROPS: Bamboo Steamer & Delicious Dumplings (Representing traditional cooking/food) -->
    <!-- Bamboo Steamer Base / Bottom tier -->
    <ellipse cx="120" cy="180" rx="45" ry="14" fill="url(#bambooGrad)" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="120" cy="178" rx="42" ry="11" fill="#fef3c7"/>
    
    <!-- Delicious Steamed Dumplings (Jiaozi/Baozi) inside steamer -->
    <!-- Dumpling 1 -->
    <path d="M 100 176 Q 105 165 115 174 Q 125 165 130 176 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 115 167 Q 115 174 115 174" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Dumpling 2 -->
    <path d="M 120 183 Q 125 173 133 181 Q 141 173 145 183 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Dumpling 3 -->
    <path d="M 95 182 Q 100 174 107 181 Q 114 174 118 182 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Steamer Lid (Placed sideways or behind to show food) -->
    <ellipse cx="65" cy="165" rx="16" ry="22" fill="url(#bambooGrad)" stroke="#78350f" stroke-width="2" transform="rotate(-15 65 165)"/>
    <!-- Lid handle ring -->
    <circle cx="65" cy="160" r="4" fill="none" stroke="#78350f" stroke-width="2"/>

    <!-- Dynamic Rising Steam Waves -->
    <path d="M 110 160 Q 100 140 120 125 Q 140 110 125 90" stroke="url(#steamGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 130 163 Q 140 145 125 130 Q 110 115 120 95" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Secondary Prop: Small ceramic bowl of dipping sauce with chopsticks -->
    <!-- Bowl -->
    <ellipse cx="175" cy="185" rx="18" ry="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <ellipse cx="175" cy="183" rx="15" ry="6" fill="#dc2626"/> <!-- Chili oil / sauce -->
    <!-- Chopsticks -->
    <line x1="160" y1="170" x2="195" y2="195" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <line x1="165" y1="167" x2="200" y2="192" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

  </g>

  <!-- Atmospheric Lighting & Highlights -->
  <!-- Top-left rim light for vector depth -->
  <path d="M 24 24 L 216 24" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" stroke-linecap="round"/>
</svg>