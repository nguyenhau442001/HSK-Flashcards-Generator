<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- Wooden Table Top Gradient (Flat & Even) -->
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Table Edge/Side Gradient -->
    <linearGradient id="tableSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Bubble Level Body Gradient -->
    <linearGradient id="levelBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glass Vial Gradient -->
    <linearGradient id="vialGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Plant Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Warm Ambient Light -->
  <circle cx="120" cy="110" r="90" fill="url(#amberGlow)" filter="url(#softGlow)" />

  <!-- SCENE: WORKSPACE / ROOM ENVIRONMENT -->
  <!-- Back Wall Line -->
  <line x1="20" y1="90" x2="220" y2="90" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Decorative Wall Elements (Framed Poster Abstract) -->
  <rect x="170" y="40" width="35" height="45" rx="4" fill="#334155" opacity="0.5" />
  <rect x="175" y="45" width="25" height="35" rx="2" fill="#1e293b" opacity="0.6" />
  <circle cx="187" cy="62" r="8" fill="#38bdf8" opacity="0.6" />

  <!-- Background Plant on Wall Shelf -->
  <path d="M 45 90 L 75 90 L 70 80 L 50 80 Z" fill="#64748b" />
  <path d="M 50 80 Q 60 65 55 50 Q 65 55 60 80" fill="#10b981" />
  <path d="M 62 80 Q 72 60 70 45 Q 78 55 67 80" fill="#34d399" />
  <path d="M 55 80 Q 40 70 42 60 Q 50 68 58 80" fill="#059669" />

  <!-- MAIN SUBJECT: MẶT BÀN RẤT BẰNG (FLAT TABLE SURFACE) -->
  <g filter="url(#shadow)">
    <!-- Table Side (Depth) -->
    <path d="M 20 160 L 220 160 L 210 185 L 30 185 Z" fill="url(#tableSide)" />
    <!-- Table Top (The perfectly flat surface representing 平) -->
    <path d="M 15 145 L 225 145 L 220 160 L 20 160 Z" fill="url(#tableTop)" />
    <!-- Table Highlight Edge -->
    <path d="M 16 146 L 224 146" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- TABLE LEGS -->
  <rect x="35" y="185" width="12" height="35" rx="3" fill="#78350f" />
  <rect x="193" y="185" width="12" height="35" rx="3" fill="#78350f" />

  <!-- CONTEXT PROPS ON THE TABLE -->

  <!-- 1. Modern Coffee Mug -->
  <g filter="url(#shadow)">
    <!-- Mug Handle -->
    <path d="M 185 115 C 200 115, 200 135, 185 135" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <!-- Mug Body -->
    <path d="M 160 105 L 185 105 C 190 105, 190 140, 185 140 L 160 140 C 155 140, 155 105, 160 105 Z" fill="#e2e8f0" />
    <!-- Mug Rim Top Ellipse -->
    <ellipse cx="172.5" cy="105" rx="12.5" ry="4" fill="#cbd5e1" />
    <!-- Coffee Surface -->
    <ellipse cx="172.5" cy="106" rx="10" ry="2.5" fill="#78350f" />
  </g>

  <!-- 2. Small Desk Succulent Pot -->
  <g filter="url(#shadow)">
    <!-- Pot -->
    <path d="M 70 120 L 90 120 L 87 140 L 73 140 Z" fill="url(#potGrad)" />
    <ellipse cx="80" cy="120" rx="10" ry="3" fill="#fda4af" />
    <!-- Soil -->
    <ellipse cx="80" cy="121" rx="8" ry="2" fill="#78350f" />
    <!-- Succulent Leaves -->
    <circle cx="80" cy="113" r="6" fill="#10b981" />
    <circle cx="75" cy="116" r="5" fill="#34d399" />
    <circle cx="85" cy="116" r="5" fill="#059669" />
    <circle cx="80" cy="107" r="4" fill="#6ee7b7" />
  </g>

  <!-- 3. ACTION HERO ELEMENT: THE SPIRIT LEVEL (THƯỚC NIVO / BUBBLE LEVEL) -->
  <!-- Represents perfectly 'bằng' (level, flat) with the bubble centered! -->
  <g filter="url(#shadow)" transform="rotate(-2, 120, 133)">
    <!-- Level Main Body -->
    <rect x="75" y="122" width="90" height="22" rx="11" fill="url(#levelBody)" />
    
    <!-- Metallic/Bright Sheen on Level -->
    <path d="M 80 125 L 160 125" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Rubber End Cap Left -->
    <path d="M 75 122 C 70 122, 70 144, 75 144 Z" fill="#0f172a" />
    <!-- Rubber End Cap Right -->
    <path d="M 165 122 C 170 122, 170 144, 165 144 Z" fill="#0f172a" />

    <!-- Center Vial Window Frame -->
    <rect x="110" y="125" width="20" height="16" rx="3" fill="#0284c7" />
    
    <!-- Glass Vial -->
    <rect x="112" y="127" width="16" height="12" rx="6" fill="url(#vialGlass)" />
    
    <!-- Vial Gauge Lines (Tick marks) -->
    <line x1="117" y1="127" x2="117" y2="139" stroke="#0369a1" stroke-width="1.5" opacity="0.8" />
    <line x1="123" y1="127" x2="123" y2="139" stroke="#0369a1" stroke-width="1.5" opacity="0.8" />

    <!-- THE BUBBLE (PERFECTLY CENTERED -> MEANS 'BẰNG'!) -->
    <circle cx="120" cy="133" r="4" fill="#facc15" filter="url(#shadow)" />
    <circle cx="119" cy="132" r="1.5" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- SPARKLES / DYNAMIC POLISH (Emphasizing accuracy and perfection of flatness) -->
  <g transform="translate(0, 0)">
    <!-- Sparkle Top Right -->
    <path d="M 145 105 Q 150 105 150 100 Q 150 105 155 105 Q 150 105 150 110 Q 150 105 145 105 Z" fill="#fbbf24" />
    <!-- Sparkle Left -->
    <path d="M 65 130 Q 68 130 68 127 Q 68 130 71 130 Q 68 130 68 133 Q 68 130 65 130 Z" fill="#38bdf8" />
    <!-- Small Dot Accents -->
    <circle cx="135" cy="110" r="1.5" fill="#fde68a" />
    <circle cx="105" cy="140" r="1.5" fill="#fde68a" />
  </g>

</svg>