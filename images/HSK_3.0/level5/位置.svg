<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="20%" r="60%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Holographic Target Glow -->
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT: Modern Airport/Transit Station Hall -->
  <!-- Floor Grid & Perspective Lines -->
  <path d="M 0 190 L 240 190" stroke="#334155" stroke-width="2" />
  <path d="M 0 215 L 240 215" stroke="#1e293b" stroke-width="2" />
  <line x1="120" y1="190" x2="60" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="190" x2="180" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Background Information Kiosk / Wall Panel -->
  <rect x="40" y="40" width="160" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Abstract Graphic Map on Kiosk -->
  <circle cx="85" cy="80" r="18" fill="#334155" opacity="0.7"/>
  <path d="M 115 70 L 165 70 M 115 85 L 150 85 M 115 100 L 140 100" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <!-- Glowing Interactive Status Light on Kiosk -->
  <circle cx="175" cy="55" r="5" fill="#10b981" filter="url(#softShadow)" />

  <!-- THE TARGET LOCATION MARKER ON FLOOR (The "Position") -->
  <g transform="translate(140, 205)">
    <!-- Ground Glow -->
    <ellipse cx="0" cy="15" rx="35" ry="12" fill="url(#targetGlow)" />
    <!-- Target Footprints / Marker Ring -->
    <ellipse cx="0" cy="10" rx="26" ry="9" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 3" />
    <!-- Pin / Indicator dropping from above -->
    <path d="M 0 -12 C -8 -12 -12 -6 -12 0 C -12 8 0 20 0 20 C 0 20 12 8 12 0 C 12 -6 8 -12 0 -12 Z" fill="#10b981" filter="url(#softShadow)" />
    <circle cx="0" cy="-1" r="4" fill="#ffffff" />
  </g>

  <!-- SECONDARY CONTEXT PROP: Travel Luggage / Suitcase -->
  <g transform="translate(65, 155)">
    <rect x="0" y="0" width="30" height="42" rx="6" fill="#fb923c" filter="url(#softShadow)" />
    <rect x="8" y="-6" width="14" height="6" rx="2" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <line x1="0" y1="14" x2="30" y2="14" stroke="#ea580c" stroke-width="2" />
    <!-- Wheels -->
    <circle cx="7" cy="44" r="3" fill="#0f172a" />
    <circle cx="23" cy="44" r="3" fill="#0f172a" />
  </g>

  <!-- MAIN CHARACTER: Traveler holding ticket/map, looking for position -->
  <g transform="translate(100, 115)" filter="url(#softShadow)">
    <!-- Character Shadow -->
    <ellipse cx="15" cy="85" rx="22" ry="7" fill="#020617" opacity="0.5" />

    <!-- Legs & Shoes -->
    <path d="M 8 60 L 8 82 L 13 82 L 13 60 Z" fill="#38bdf8" />
    <path d="M 22 58 L 26 80 L 31 80 L 26 58 Z" fill="#38bdf8" />
    <ellipse cx="11" cy="82" rx="5" ry="3" fill="#1e293b" />
    <ellipse cx="28" cy="80" rx="5" ry="3" fill="#1e293b" />

    <!-- Torso (Jacket) -->
    <path d="M 5 25 Q 5 15 18 15 Q 31 15 31 25 L 34 58 L 2 58 Z" fill="#0284c7" />
    <!-- Collar / Inner Shirt -->
    <path d="M 12 15 L 18 24 L 24 15 Z" fill="#f8fafc" />

    <!-- Head & Face -->
    <circle cx="18" cy="-2" r="14" fill="#fed7aa" />
    <!-- Hair (Stylish Neat Cut) -->
    <path d="M 5 -6 Q 8 -16 18 -16 Q 28 -16 31 -8 Q 28 -10 18 -10 Q 8 -10 5 -6 Z" fill="#1e293b" />
    <!-- Eye (Looking down/forward inquisitively) -->
    <circle cx="23" cy="-3" r="1.5" fill="#1e293b" />
    <!-- Gentle Smile -->
    <path d="M 21 3 Q 23 5 25 3" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms & Holding Ticket / Map -->
    <!-- Left arm (bent holding item) -->
    <path d="M 6 25 Q -2 35 10 42" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <!-- Right arm (gesturing/pointing down towards the target position) -->
    <path d="M 30 25 Q 42 38 38 48" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <!-- Hand pointing -->
    <circle cx="38" cy="50" r="3.5" fill="#fed7aa" />

    <!-- Ticket / Boarding Pass Prop in hands -->
    <g transform="translate(-2, 36) rotate(-15)">
      <rect x="0" y="0" width="22" height="14" rx="2" fill="#ffffff" filter="url(#softShadow)" />
      <line x1="3" y1="4" x2="15" y2="4" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="3" y1="8" x2="10" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <circle cx="17" cy="9" r="2" fill="#10b981" />
    </g>
  </g>

  <!-- Atmospheric Details: Subtle floating ambient particles -->
  <circle cx="45" cy="90" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="195" cy="110" r="1.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="110" cy="45" r="2.5" fill="#fbbf24" opacity="0.5" />
  <circle cx="30" cy="160" r="1.5" fill="#10b981" opacity="0.5" />
</svg>