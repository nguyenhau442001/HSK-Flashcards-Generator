<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Sky/Atmosphere Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Building 1 (Modern Glass Skyscraper) Gradients -->
    <linearGradient id="glassTower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Building 2 (Classic/Modern Asian Fusion Pavilion Roof) -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="warmStructure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Glowing Accent -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Atmospheric Sky & Stars -->
  <rect x="0" y="0" width="240" height="180" rx="24" fill="url(#skyGrad)"/>
  <circle cx="40" cy="30" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="95" cy="20" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="160" cy="45" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="205" cy="25" r="1.2" fill="#fbbf24" opacity="0.7"/>

  <!-- Distant Background Skyline silhouette -->
  <path d="M0,150 L0,130 L15,130 L15,145 L35,145 L35,120 L55,120 L55,155 L75,155 L75,110 L95,110 L95,160 L120,160 L120,125 L145,125 L145,165 L170,165 L170,135 L195,135 L195,160 L240,160 L240,180 L0,180 Z" fill="#0f172a" opacity="0.5"/>

  <!-- Glowing Moon / Environment Light -->
  <circle cx="185" cy="65" r="22" fill="#fbbf24" opacity="0.15" filter="url(#glow)"/>
  <circle cx="185" cy="65" r="14" fill="#fef08a" opacity="0.9"/>

  <!-- ================= MAIN ARCHITECTURAL STRUCTURES ================= -->

  <!-- Left Structure: Modern Glass Skyscraper (建筑) -->
  <!-- Main Tower Body -->
  <path d="M45,70 L95,55 L95,190 L45,190 Z" fill="url(#glassTower)"/>
  <!-- Front Facade for 3D extrusion -->
  <path d="M95,55 L135,75 L135,210 L95,190 Z" fill="#0369a1"/>

  <!-- Glass Window Grid Lines - Left Wall -->
  <g stroke="#bae6fd" stroke-width="0.8" opacity="0.6">
    <line x1="57" y1="75" x2="57" y2="185"/>
    <line x1="69" y1="72" x2="69" y2="188"/>
    <line x1="81" y1="68" x2="81" y2="190"/>
    <!-- Horizontal floors -->
    <line x1="50" y1="90" x2="92" y2="82"/>
    <line x1="49" y1="110" x2="93" y2="100"/>
    <line x1="48" y1="130" x2="94" y2="118"/>
    <line x1="47" y1="150" x2="94" y2="136"/>
    <line x1="46" y1="170" x2="94" y2="154"/>
  </g>

  <!-- Glass Window Grid Lines - Front Wall -->
  <g stroke="#7dd3fc" stroke-width="0.8" opacity="0.5">
    <line x1="105" y1="85" x2="105" y2="200"/>
    <line x1="115" y1="90" x2="115" y2="205"/>
    <line x1="125" y1="95" x2="125" y2="207"/>
    <line x1="97" y1="100" x2="133" y2="118"/>
    <line x1="97" y1="120" x2="133" y2="138"/>
    <line x1="97" y1="140" x2="133" y2="158"/>
    <line x1="97" y1="160" x2="133" y2="178"/>
    <line x1="97" y1="180" x2="133" y2="198"/>
  </g>

  <!-- Highlight Reflection across Skyscraper -->
  <polygon points="65,70 85,64 120,80 100,88" fill="url(#glassReflection)"/>
  <polygon points="55,110 75,104 115,124 95,130" fill="url(#glassReflection)"/>

  <!-- Right Structure: Contemporary Iconic Pavilion / Landmark Architecture -->
  <!-- Base structure curve -->
  <path d="M125,215 C135,170 145,130 165,105 C185,130 195,170 205,215 Z" fill="url(#warmStructure)"/>
  
  <!-- Overlapping curved dynamic swoops (parametric architectural style) -->
  <path d="M130,215 C142,175 152,140 165,115 C178,140 188,175 200,215 Z" fill="#f97316" opacity="0.9"/>
  <path d="M138,215 C147,180 155,150 165,125 C175,150 183,180 192,215 Z" fill="#fbbf24" opacity="0.95"/>

  <!-- Curved roof golden crown accent -->
  <path d="M152,122 C160,118 170,118 178,122 C170,114 160,114 152,122 Z" fill="#fef08a" filter="url(#softGlow)"/>

  <!-- Warm interior structural ribbing/panes -->
  <g stroke="#b45309" stroke-width="1.2" opacity="0.5" fill="none">
    <path d="M138,215 C147,180 155,150 165,125"/>
    <path d="M200,215 C188,175 178,140 165,115"/>
    <line x1="165" y1="115" x2="165" y2="215" stroke-width="1.5"/>
    <line x1="145" y1="190" x2="185" y2="190"/>
    <line x1="140" y1="160" x2="190" y2="160"/>
    <line x1="148" y1="135" x2="182" y2="135"/>
  </g>

  <!-- Ground Plaza & Landscaping Context -->
  <path d="M0,210 C80,195 160,195 240,210 L240,240 L0,240 Z" fill="#090d16"/>
  <path d="M0,213 C70,200 170,200 240,213" stroke="#10b981" stroke-width="2" fill="none" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Planters & Greenery / Street props -->
  <!-- Low modern shrubbery -->
  <circle cx="35" cy="210" r="8" fill="#10b981" opacity="0.8"/>
  <circle cx="45" cy="208" r="10" fill="#059669" opacity="0.9"/>
  <circle cx="25" cy="212" r="7" fill="#34d399" opacity="0.7"/>

  <circle cx="210" cy="212" r="9" fill="#059669" opacity="0.9"/>
  <circle cx="220" cy="210" r="7" fill="#34d399" opacity="0.8"/>

  <!-- Modern Street Lamp emitting warm glow -->
  <path d="M75,215 L75,175" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M72,175 L78,175 L80,172 L70,172 Z" fill="#94a3b8"/>
  <circle cx="75" cy="172" r="5" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="75" cy="172" r="2.5" fill="#ffffff"/>
  <!-- Lamp light pool -->
  <ellipse cx="75" cy="215" rx="18" ry="4" fill="#fbbf24" opacity="0.25" filter="url(#softGlow)"/>

  <!-- Architectural Blueprint / Laser accent lines in foreground (Design & Engineering Vibe) -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.4" stroke-dasharray="3 3">
    <line x1="15" y1="190" x2="225" y2="190"/>
    <circle cx="165" cy="115" r="18" fill="none"/>
  </g>
  <circle cx="165" cy="115" r="3" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>

  <!-- Dynamic floating design particles / sparkle nodes -->
  <g fill="#38bdf8">
    <circle cx="130" cy="95" r="1.5" opacity="0.8"/>
    <circle cx="110" cy="65" r="2" opacity="0.9" filter="url(#softGlow)"/>
    <circle cx="195" cy="100" r="1.5" opacity="0.7"/>
    <circle cx="145" cy="80" r="1" opacity="0.5"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="180" cy="140" r="2" opacity="0.8" filter="url(#softGlow)"/>
    <circle cx="150" cy="160" r="1.5" opacity="0.7"/>
  </g>

  <!-- Foreground Framing Elements (Depth of field blur effect via opacity & size) -->
  <path d="M-10,240 L20,225 L35,240 Z" fill="#090d16" opacity="0.9"/>
  <path d="M220,240 L240,230 L250,240 Z" fill="#090d16" opacity="0.9"/>
</svg>