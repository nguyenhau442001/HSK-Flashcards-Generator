<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: A park bench at dusk -->
  <rect x="40" y="150" width="160" height="20" rx="4" fill="#475569"/>
  <rect x="50" y="170" width="10" height="50" fill="#334155"/>
  <rect x="180" y="170" width="10" height="50" fill="#334155"/>
  
  <!-- Character 1: Person sitting, looking sad (slumped shoulders) -->
  <circle cx="80" cy="110" r="15" fill="#fde68a"/>
  <path d="M70 125 Q80 140 90 125" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M70 135 L90 135" stroke="#f87171" stroke-width="2" fill="none"/>
  <rect x="65" y="125" width="30" height="30" rx="5" fill="#38bdf8"/>
  
  <!-- Character 2: Person leaning in, hand on shoulder (The act of empathy) -->
  <circle cx="140" cy="100" r="15" fill="#fde68a"/>
  <path d="M135 100 L137 102" stroke="#475569" stroke-width="2"/>
  <path d="M143 100 L145 102" stroke="#475569" stroke-width="2"/>
  <path d="M130 115 Q140 125 150 115" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="125" y="115" width="30" height="40" rx="5" fill="#fb923c"/>
  
  <!-- The Empathy Gesture: Hand on shoulder -->
  <ellipse cx="110" cy="130" rx="8" ry="4" fill="#fde68a" transform="rotate(-20 110 130)"/>
  
  <!-- Atmospheric details: Soft glow of a street lamp -->
  <circle cx="200" cy="50" r="30" fill="#f59e0b" opacity="0.15"/>
  <circle cx="200" cy="50" r="15" fill="#fbbf24"/>
  
  <!-- Ground detail -->
  <path d="M0 220 L240 220" stroke="#334155" stroke-width="4"/>
</svg>