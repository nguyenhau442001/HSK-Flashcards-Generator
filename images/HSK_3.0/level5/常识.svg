<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="globe-grad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background glow / lighting -->
  <circle cx="120" cy="90" r="80" fill="url(#lamp-glow)" />

  <!-- Atmospheric background elements (bookshelf / room depth) -->
  <g opacity="0.4">
    <!-- Bookshelf top -->
    <rect x="25" y="30" width="190" height="8" rx="2" fill="#475569" />
    <!-- Books on shelf -->
    <rect x="35" y="10" width="12" height="20" rx="2" fill="#f43f5e" />
    <rect x="49" y="12" width="16" height="18" rx="2" fill="#10b981" />
    <rect x="67" y="8" width="10" height="22" rx="2" fill="#fbbf24" />
    <rect x="85" y="14" width="22" height="16" rx="2" fill="#8b5cf6" />
    <rect x="175" y="10" width="14" height="20" rx="2" fill="#38bdf8" />
    <rect x="191" y="12" width="15" height="18" rx="2" fill="#f97316" />
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M 10 180 L 230 180 L 220 220 L 20 220 Z" fill="#0f172a" />
  <rect x="15" y="175" width="210" height="8" rx="3" fill="#475569" />
  <rect x="20" y="183" width="200" height="40" fill="url(#wood-desk)" opacity="0.8" />

  <!-- MAIN SCENE OBJECT 1: An open encyclopedic book (Foundation of general knowledge) -->
  <g transform="translate(45, 125)">
    <!-- Book Shadow -->
    <ellipse cx="75" cy="45" rx="70" ry="15" fill="#020617" opacity="0.6" />
    <!-- Left Page -->
    <path d="M 75 40 C 50 35 15 45 5 50 L 5 25 C 15 20 50 10 75 15 Z" fill="#f8fafc" />
    <path d="M 75 40 C 50 35 15 45 5 50 L 5 25 C 15 20 50 10 75 15 Z" fill="#e2e8f0" opacity="0.5" />
    <!-- Right Page -->
    <path d="M 75 40 C 100 35 135 45 145 50 L 145 25 C 135 20 100 10 75 15 Z" fill="#f8fafc" />
    <!-- Book Spine -->
    <path d="M 75 15 L 75 40 L 75 40 L 75 15 Z" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Abstract Page Lines (Simulating text/knowledge) -->
    <line x1="15" y1="26" x2="45" y2="23" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="32" x2="50" y2="29" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="38" x2="35" y2="35" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

    <line x1="105" y1="26" x2="135" y2="23" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="100" y1="32" x2="135" y2="29" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="115" y1="38" x2="135" y2="35" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- MAIN SCENE OBJECT 2: Globe (Worldly common sense, facts) resting on the book/desk -->
  <g transform="translate(120, 100)">
    <!-- Globe Stand Base -->
    <ellipse cx="0" cy="65" rx="22" ry="7" fill="#64748b" />
    <path d="M -5 65 L -3 35 L 3 35 L 5 65 Z" fill="#64748b" />
    
    <!-- Meridian Ring -->
    <circle cx="0" cy="15" r="42" fill="none" stroke="#94a3b8" stroke-width="4" />
    
    <!-- The Globe Sphere -->
    <circle cx="0" cy="15" r="38" fill="url(#globe-grad)" />
    
    <!-- Continents / Landmasses (Stylized vector shapes) -->
    <path d="M -20 -5 C -10 -15 10 -10 15 5 C 20 20 5 35 -10 25 C -25 15 -30 5 -20 -5 Z" fill="#10b981" opacity="0.85" />
    <path d="M 15 -10 C 25 -5 30 15 20 25 C 10 25 5 10 15 -10 Z" fill="#10b981" opacity="0.85" />
    <path d="M -25 25 C -15 30 -5 20 -15 35 Z" fill="#10b981" opacity="0.85" />

    <!-- Globe Highlight / Gloss -->
    <path d="M -18 -5 C -10 -20 10 -15 5 0 C 0 10 -15 5 -18 -5 Z" fill="#ffffff" opacity="0.25" />
  </g>

  <!-- POP-OUT / ACTION ELEMENT: Lightbulb of realization bursting out from the open book/globe center -->
  <g transform="translate(120, 50)">
    <!-- Glow aura -->
    <circle cx="0" cy="0" r="32" fill="#fbbf24" opacity="0.2" />
    <circle cx="0" cy="0" r="22" fill="#fbbf24" opacity="0.4" />

    <!-- Lightbulb Body -->
    <path d="M -12 -4 C -12 -16 -4 -22 0 -22 C 4 -22 12 -16 12 -4 C 12 4 8 8 6 12 L -6 12 C -8 8 -12 4 -12 -4 Z" fill="#fbbf24" />
    <path d="M -12 -4 C -12 -16 -4 -22 0 -22 L 0 12 L -6 12 C -8 8 -12 4 -12 -4 Z" fill="#f59e0b" /> <!-- Shading -->

    <!-- Bulb Screw Base -->
    <rect x="-5" y="12" width="10" height="4" rx="1" fill="#94a3b8" />
    <rect x="-4" y="16" width="8" height="4" rx="1" fill="#64748b" />
    <path d="M -3 20 L 3 20 L 2 24 L -2 24 Z" fill="#475569" />

    <!-- Filament -->
    <path d="M -3 2 C -3 -4 3 -4 3 2" fill="none" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" />

    <!-- Sparkles / Action Bursts -->
    <!-- Top Spark -->
    <path d="M 0 -32 L 2 -26 L 8 -28 L 4 -24 L 8 -20 L 2 -22 L 0 -16 L -2 -22 L -8 -20 L -4 -24 L -8 -28 L -2 -26 Z" fill="#fef08a" />
    <!-- Side Spark Right -->
    <path d="M 24 -6 L 20 -4 L 23 -1 L 18 -2 L 18 2 L 22 2 L 20 6 L 24 3 L 26 6 L 25 1 L 29 -2 L 23 -4 Z" fill="#fef08a" transform="scale(0.7) translate(25, -20)" />
    <!-- Side Spark Left -->
    <path d="M -24 -6 L -20 -4 L -23 -1 L -18 -2 L -18 2 L -22 2 L -20 6 L -24 3 L -26 6 L -25 1 L -29 -2 L -23 -4 Z" fill="#fef08a" transform="scale(0.7) translate(-45, -20)" />
  </g>

  <!-- ACCENT PROPS: Magnifying glass (Searching for facts / everyday logic) -->
  <g transform="translate(65, 155) rotate(-15)">
    <!-- Handle -->
    <rect x="-4" y="15" width="8" height="25" rx="4" fill="#334155" />
    <rect x="-2" y="15" width="4" height="25" rx="2" fill="#475569" />
    <!-- Glass Rim -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="5" />
    <!-- Glass Lens Reflection -->
    <circle cx="0" cy="0" r="15" fill="#bae6fd" opacity="0.25" />
    <path d="M -8 -8 C -4 -12 4 -12 8 -8 C 4 -10 -4 -10 -8 -8 Z" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- ACCENT PROPS: Compass (Navigation / Practical direction) -->
  <g transform="translate(180, 140)">
    <circle cx="0" cy="0" r="14" fill="#334155" />
    <circle cx="0" cy="0" r="12" fill="#f8fafc" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Compass Needle -->
    <polygon points="0,-8 3,0 0,8 -3,0" fill="#f43f5e" />
    <polygon points="0,8 3,0 0,-8 -3,0" fill="#94a3b8" />
    <circle cx="0" cy="0" r="2" fill="#1e293b" />
  </g>

  <!-- Floating particles / Knowledge sparkles -->
  <g fill="#38bdf8">
    <circle cx="35" cy="80" r="3" opacity="0.8" />
    <circle cx="205" cy="70" r="2" opacity="0.6" />
    <circle cx="165" cy="45" r="2.5" opacity="0.7" />
    <circle cx="95" cy="115" r="1.5" opacity="0.5" />
  </g>
  <g fill="#fbbf24">
    <circle cx="15" cy="120" r="2" opacity="0.7" />
    <circle cx="215" cy="125" r="3" opacity="0.9" />
    <circle cx="95" cy="25" r="2" opacity="0.6" />
  </g>

</svg>