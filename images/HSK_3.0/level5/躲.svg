<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Bed Frame -->
  <path d="M20 180 L220 180 L210 210 L30 210 Z" fill="#475569"/>
  <rect x="10" y="150" width="220" height="30" rx="4" fill="#64748b"/>
  
  <!-- Bedding/Pillow -->
  <path d="M30 150 L210 150 L200 130 L40 130 Z" fill="#94a3b8"/>
  <circle cx="180" cy="140" r="15" fill="#cbd5e1"/>
  
  <!-- Shadow under the bed -->
  <rect x="30" y="180" width="180" height="30" fill="#0f172a" opacity="0.6"/>
  
  <!-- The Cat (The subject hiding) -->
  <g transform="translate(80, 185)">
    <path d="M10 20 C10 10, 20 5, 30 5 C40 5, 50 10, 50 20 L50 35 L10 35 Z" fill="#fbbf24"/>
    <circle cx="20" cy="15" r="3" fill="#0f172a"/>
    <circle cx="40" cy="15" r="3" fill="#0f172a"/>
    <path d="M15 5 L10 -5 M45 5 L50 -5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M30 25 L30 30 M35 25 L35 30" stroke="#fcd34d" stroke-width="1"/>
  </g>
  
  <!-- Room details -->
  <circle cx="200" cy="50" r="30" fill="#fb923c" opacity="0.1"/>
  <path d="M190 40 L210 60 M210 40 L190 60" stroke="#fb923c" stroke-width="2" opacity="0.3"/>
  
  <!-- Floor rug edge -->
  <rect x="0" y="210" width="240" height="30" fill="#334155"/>
  
  <!-- Toy ball outside -->
  <circle cx="180" cy="220" r="8" fill="#ec4899"/>
  <circle cx="180" cy="220" r="3" fill="#fbcfe8"/>
</svg>