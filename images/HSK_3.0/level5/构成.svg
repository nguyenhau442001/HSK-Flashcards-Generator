<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="10"/>
  
  <!-- The Subject: A complex mechanical toy robot being assembled from parts -->
  <!-- Base/Torso -->
  <rect x="95" y="120" width="50" height="50" fill="#fbbf24" rx="8"/>
  <!-- Head -->
  <circle cx="120" cy="95" r="20" fill="#38bdf8"/>
  <circle cx="113" cy="90" r="3" fill="#0f172a"/>
  <circle cx="127" cy="90" r="3" fill="#0f172a"/>
  
  <!-- Floating/Assembling Parts -->
  <!-- Left Arm -->
  <rect x="65" y="125" width="25" height="10" fill="#ec4899" rx="4" transform="rotate(-20 77 130)"/>
  <!-- Right Arm -->
  <rect x="150" y="125" width="25" height="10" fill="#ec4899" rx="4" transform="rotate(20 162 130)"/>
  <!-- Legs -->
  <rect x="100" y="175" width="15" height="30" fill="#10b981" rx="4"/>
  <rect x="125" y="175" width="15" height="30" fill="#10b981" rx="4"/>
  
  <!-- Contextual Props: Tools -->
  <path d="M40 180 L60 180 L55 200 L45 200 Z" fill="#94a3b8"/>
  <rect x="48" y="170" width="4" height="10" fill="#94a3b8"/>
  
  <!-- Decorative Sparks/Assembly Glow -->
  <circle cx="120" cy="145" r="2" fill="#fb923c"/>
  <circle cx="100" cy="110" r="2" fill="#fb923c"/>
  <circle cx="140" cy="110" r="2" fill="#fb923c"/>
  
  <!-- Background elements for depth -->
  <circle cx="200" cy="50" r="15" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="180" y="30" width="40" height="40" fill="none" stroke="#334155" stroke-width="2" rx="5"/>
</svg>