<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="120" cy="120" r="100" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Outer Atmospheric Glow -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Scene Group with Clip for Clean Rounded Composition -->
  <g clip-path="url(#circleClip)">
    <!-- Night Sky Background -->
    <rect x="0" y="0" width="240" height="240" fill="#090d16" />

    <!-- Stars / City Sparkles -->
    <circle cx="45" cy="40" r="1" fill="#94a3b8" opacity="0.6" />
    <circle cx="75" cy="25" r="1.5" fill="#f8fafc" opacity="0.8" />
    <circle cx="195" cy="55" r="1" fill="#94a3b8" opacity="0.5" />
    <circle cx="210" cy="30" r="2" fill="#f8fafc" opacity="0.9" />
    <circle cx="25" cy="95" r="1.5" fill="#f8fafc" opacity="0.7" />

    <!-- Distant Background Towers -->
    <rect x="30" y="90" width="35" height="150" fill="#1e293b" opacity="0.6" />
    <rect x="175" y="70" width="45" height="170" fill="#1e293b" opacity="0.6" />

    <!-- Main Apartment Building (Modern Exterior Cutaway) -->
    <!-- Building Structure -->
    <rect x="55" y="35" width="130" height="205" rx="8" fill="url(#buildingGrad)" stroke="#475569" stroke-width="2" />

    <!-- Rooftop Details -->
    <path d="M 50 35 L 190 35 L 185 20 L 55 20 Z" fill="#475569" />
    <line x1="120" y1="20" x2="120" y2="8" stroke="#94a3b8" stroke-width="2" />
    <circle cx="120" cy="7" r="3" fill="#ef4444" />

    <!-- Apartment Windows / Balconies Grid -->
    <!-- Row 1 -->
    <rect x="70" y="50" width="30" height="35" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <rect x="73" y="53" width="24" height="29" rx="2" fill="url(#windowGlow)" opacity="0.85" />
    <rect x="140" y="50" width="30" height="35" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <rect x="143" y="53" width="24" height="29" rx="2" fill="#1e293b" /> <!-- Dark window -->

    <!-- Row 2 (Featured Apartment - Warm and Cozy Interior) -->
    <rect x="70" y="95" width="100" height="45" rx="4" fill="#334155" stroke="#fbbf24" stroke-width="2" />
    <!-- Interior Room Background -->
    <rect x="73" y="98" width="94" height="39" fill="#1e1b4b" />
    <!-- Cozy Interior Elements: Bookshelf & Plant -->
    <rect x="78" y="108" width="12" height="25" fill="#475569" />
    <circle cx="84" cy="106" r="5" fill="#10b981" />
    <!-- Floor Lamp Warm Glow -->
    <path d="M 150 137 L 158 108 L 162 108 L 166 137 Z" fill="#f59e0b" opacity="0.4" />
    <path d="M 153 108 L 163 108 L 158 100 Z" fill="#fbbf24" />
    <line x1="158" y1="108" x2="158" y2="137" stroke="#fcd34d" stroke-width="1.5" />
    <!-- Cozy Sofa / Interior Silhouette -->
    <rect x="95" y="115" width="35" height="18" rx="4" fill="#ec4899" />
    <rect x="92" y="125" width="41" height="8" rx="2" fill="#db2777" />
    <!-- Balcony Railing for Row 2 -->
    <rect x="67" y="132" width="106" height="5" rx="2" fill="#64748b" />
    <line x1="77" y1="132" x2="77" y2="140" stroke="#64748b" stroke-width="1.5" />
    <line x1="97" y1="132" x2="97" y2="140" stroke="#64748b" stroke-width="1.5" />
    <line x1="117" y1="132" x2="117" y2="140" stroke="#64748b" stroke-width="1.5" />
    <line x1="137" y1="132" x2="137" y2="140" stroke="#64748b" stroke-width="1.5" />
    <line x1="157" y1="132" x2="157" y2="140" stroke="#64748b" stroke-width="1.5" />

    <!-- Row 3 -->
    <rect x="70" y="150" width="30" height="35" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <rect x="73" y="153" width="24" height="29" rx="2" fill="url(#windowGlow)" opacity="0.9" />
    <rect x="140" y="150" width="30" height="35" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <rect x="143" y="153" width="24" height="29" rx="2" fill="url(#windowGlow)" opacity="0.5" />

    <!-- Entrance Canopy / Ground Floor Lobby -->
    <path d="M 50 200 L 190 200 L 200 240 L 40 240 Z" fill="#0f172a" />
    <rect x="95" y="205" width="50" height="35" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Glass Double Doors -->
    <rect x="100" y="210" width="18" height="30" fill="#38bdf8" opacity="0.3" />
    <rect x="122" y="210" width="18" height="30" fill="#38bdf8" opacity="0.3" />
    <!-- Canopy over door -->
    <path d="M 85 205 L 155 205 L 160 197 L 80 197 Z" fill="#0284c7" />

    <!-- Action/Context Props: Street Trees & Modern Vibe -->
    <!-- Left Tree -->
    <circle cx="32" cy="210" r="14" fill="#10b981" />
    <circle cx="24" cy="220" r="10" fill="#059669" />
    <rect x="30" y="220" width="4" height="20" fill="#78350f" />

    <!-- Right Modern Street Lamp -->
    <rect x="202" y="195" width="3" height="45" fill="#64748b" />
    <path d="M 197 195 L 210 195 L 206 190 L 201 190 Z" fill="#94a3b8" />
    <circle cx="203" cy="196" r="4" fill="#fbbf24" />
    <!-- Lamp Light Cone -->
    <path d="M 203 200 L 185 240 L 225 240 Z" fill="#fbbf24" opacity="0.15" />

    <!-- Floating Location Pin / App Indicator Accent -->
    <g transform="translate(165, 25) scale(0.9)">
      <path d="M 12 2 C 7 2 3 6 3 11 C 3 17 12 24 12 24 C 12 24 21 17 21 11 C 21 6 17 2 12 2 Z" fill="#ec4899" stroke="#fbcfe8" stroke-width="1.5" />
      <circle cx="12" cy="10" r="3.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Frame Border Overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
</svg>