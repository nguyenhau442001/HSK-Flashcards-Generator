<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The "Talent" (Person at work) -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 120 L80 120 L75 160 L45 160 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="90" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M40 85 C40 60 80 60 80 85 C80 75 70 70 60 70 C50 70 40 75 40 85" fill="#475569"/>
    <!-- Glasses -->
    <rect x="45" y="85" width="12" height="8" rx="2" fill="#1e293b"/>
    <rect x="63" y="85" width="12" height="8" rx="2" fill="#1e293b"/>
  </g>

  <!-- Laptop/Workspace -->
  <rect x="90" y="140" width="80" height="50" rx="4" fill="#64748b"/>
  <rect x="95" y="145" width="70" height="40" rx="2" fill="#0f172a"/>
  <!-- Screen Glow -->
  <rect x="100" y="150" width="60" height="30" rx="1" fill="#10b981" opacity="0.3"/>

  <!-- Floating "Talent" Indicators (Glows) -->
  <circle cx="180" cy="60" r="12" fill="#fbbf24"/>
  <circle cx="190" cy="40" r="8" fill="#fb923c"/>
  <circle cx="210" cy="70" r="6" fill="#ec4899"/>
  
  <!-- Decorative elements -->
  <path d="M20 160 L40 160 M25 150 L35 150" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="190" r="20" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="4 8"/>
</svg>