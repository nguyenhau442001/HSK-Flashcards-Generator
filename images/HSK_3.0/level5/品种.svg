<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Market Stall Counter -->
  <path d="M20 180h200v30c0 5.5-4.5 10-10 10H30c-5.5 0-10-4.5-10-10v-30z" fill="#334155"/>
  <path d="M20 180h200v10H20z" fill="#475569"/>
  
  <!-- Fruit Display: Variety of Apples -->
  <!-- Red Apple -->
  <circle cx="60" cy="170" r="18" fill="#ef4444"/>
  <path d="M60 152l2-6m-2 6l-2-6" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Green Apple -->
  <circle cx="100" cy="175" r="16" fill="#22c55e"/>
  <path d="M100 159l2-5m-2 5l-2-5" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Yellow Apple -->
  <circle cx="140" cy="170" r="19" fill="#fbbf24"/>
  <path d="M140 151l2-7m-2 7l-2-7" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pink/Gala Apple -->
  <circle cx="180" cy="175" r="17" fill="#ec4899"/>
  <path d="M180 158l2-6m-2 6l-2-6" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Character: Customer pointing -->
  <g transform="translate(40, 60)">
    <circle cx="40" cy="30" r="15" fill="#fde68a"/>
    <path d="M30 35h20v20c0 10-10 10-10 10s-10 0-10-10V35z" fill="#38bdf8"/>
    <path d="M55 45l20-10" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="75" cy="35" r="4" fill="#fde68a"/>
  </g>

  <!-- Character: Shopkeeper -->
  <g transform="translate(130, 60)">
    <circle cx="40" cy="30" r="15" fill="#fde68a"/>
    <path d="M30 35h20v20c0 10-10 10-10 10s-10 0-10-10V35z" fill="#fb923c"/>
    <path d="M35 45l-15-5" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Decorative background elements -->
  <circle cx="210" cy="40" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="30" cy="80" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="200" cy="120" r="2" fill="#ec4899" opacity="0.3"/>
</svg>