<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Door Surface -->
  <rect x="40" y="20" width="160" height="200" rx="10" fill="#334155"/>
  <rect x="50" y="30" width="140" height="180" rx="5" fill="#1e293b" opacity="0.5"/>
  
  <!-- Door Frame Detail -->
  <rect x="40" y="20" width="160" height="200" rx="10" stroke="#475569" stroke-width="4" fill="none"/>
  
  <!-- The Lock (Subject) -->
  <g transform="translate(120, 120)">
    <!-- Shackle -->
    <path d="M-25,-20 C-25,-50 25,-50 25,-20" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-35" y="-20" width="70" height="60" rx="8" fill="#f59e0b"/>
    <rect x="-35" y="-20" width="70" height="60" rx="8" fill="#fbbf24" fill-opacity="0.3"/>
    <!-- Keyhole -->
    <path d="M0,5 L-5,15 L5,15 Z" fill="#0f172a"/>
    <circle cx="0" cy="5" r="4" fill="#0f172a"/>
  </g>
  
  <!-- Decorative accents/Atmosphere -->
  <circle cx="180" cy="60" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="60" cy="180" r="3" fill="#10b981" opacity="0.6"/>
  <path d="M190 190 L210 170" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 50 L50 70" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
</svg>