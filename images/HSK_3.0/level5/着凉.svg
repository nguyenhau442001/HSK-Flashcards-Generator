<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Glow Gradient for Interior -->
    <radialGradient id="warm-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Blanket Gradient -->
    <linearGradient id="blanket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Mug Gradient -->
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="night-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#warm-glow)" />

  <!-- Background Environment: Bedroom Setting -->
  <!-- Wallpaper / Wall -->
  <path d="M0 0 H240 V180 H0 Z" fill="#1e293b" />
  <!-- Floor -->
  <path d="M0 180 H240 V240 H0 Z" fill="#0f172a" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Window showing night/cold outside -->
  <rect x="25" y="30" width="60" height="90" rx="4" fill="#090d16" stroke="#475569" stroke-width="3" />
  <rect x="30" y="35" width="50" height="80" fill="url(#night-sky)" />
  <!-- Window pane cross -->
  <line x1="55" y1="35" x2="55" y2="115" stroke="#475569" stroke-width="2" />
  <line x1="30" y1="75" x2="80" y2="75" stroke="#475569" stroke-width="2" />
  <!-- Cold wind/snow outside graphic hint -->
  <path d="M35 45 Q 45 50 40 60" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M65 85 Q 75 90 70 100" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
  <circle cx="70" cy="50" r="1" fill="#cbd5e1" opacity="0.6" />
  <circle cx="45" cy="95" r="1.5" fill="#cbd5e1" opacity="0.6" />

  <!-- Bedside Table -->
  <rect x="175" y="110" width="45" height="70" rx="3" fill="#334155" />
  <rect x="180" y="125" width="35" height="15" rx="2" fill="#1e293b" />
  <circle cx="197" cy="132" r="2" fill="#94a3b8" />

  <!-- Warm Tea / Medicine Mug on Table -->
  <rect x="188" y="92" width="18" height="20" rx="2" fill="url(#mug-grad)" />
  <path d="M206 96 C 212 96, 212 106, 206 108" stroke="#e11d48" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Steam from mug -->
  <path d="M193 86 Q 197 80 193 74" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M201 88 Q 197 82 201 76" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Pill bottle on bedside table -->
  <rect x="160" y="100" width="11" height="18" rx="2" fill="#f8fafc" />
  <rect x="160" y="100" width="11" height="6" fill="#fbbf24" />

  <!-- Floor Lamp in Background -->
  <line x1="210" y1="180" x2="210" y2="50" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M195 50 L 225 50 L 215 30 L 205 30 Z" fill="#fbbf24" opacity="0.9" />
  <!-- Lamp light cone projection -->
  <polygon points="210,50 160,180 230,180" fill="#fbbf24" opacity="0.05" />

  <!-- Bed & Character (Main Subject: Catching a cold / 着凉) -->
  <!-- Pillow -->
  <rect x="85" y="125" width="45" height="30" rx="8" fill="#cbd5e1" />

  <!-- Character Body under Blanket -->
  <!-- Blanket -->
  <path d="M70 145 Q 110 135 155 145 L 160 190 Q 110 195 65 190 Z" fill="url(#blanket-grad)" />
  <path d="M70 145 Q 110 135 155 145" stroke="#bae6fd" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Character Head & Face (Unwell expression) -->
  <circle cx="105" cy="130" r="20" fill="#fed7aa" />
  
  <!-- Messy Hair -->
  <path d="M86 125 C 88 115, 96 112, 105 112 C 115 112, 122 116, 124 124 C 122 122, 118 120, 112 121 C 106 120, 98 122, 92 125 Z" fill="#334155" />

  <!-- Closed / Tired Eyes (Sick look) -->
  <path d="M96 130 Q 100 133 104 130" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M108 130 Q 112 133 116 130" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Red Cheeks / Fever Flush -->
  <circle cx="97" cy="136" r="4" fill="#f43f5e" opacity="0.5" />
  <circle cx="115" cy="136" r="4" fill="#f43f5e" opacity="0.5" />

  <!-- Thermometer in mouth -->
  <rect x="106" y="135" width="22" height="4" rx="2" transform="rotate(-15 106 135)" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5" />
  <circle cx="126" cy="129" r="2.5" fill="#ef4444" />

  <!-- Sad / Frowning Mouth -->
  <path d="M104 143 Q 106 141 109 143" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Cozy Scarf around neck (showing he bundled up because he's cold) -->
  <path d="M92 142 C 95 152, 115 152, 118 142 C 115 148, 95 148, 92 142 Z" fill="#ef4444" />
  <path d="M112 147 L 118 162 L 124 160 L 117 145 Z" fill="#ef4444" />

  <!-- Sweat drop (representing fever / feeling unwell) -->
  <path d="M122 120 C 122 120, 125 125, 125 127 C 125 129, 123 130, 121 130 C 119 130, 117 129, 117 127 C 117 125, 122 120, 122 120 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Shivering lines / Cold effect indicators floating near head -->
  <path d="M135 115 Q 138 118 135 121" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M141 118 Q 144 121 141 124" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Additional cozy room element: Small rug on floor -->
  <ellipse cx="110" cy="205" rx="55" ry="12" fill="#334155" opacity="0.6" />
</svg>