<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Computer Screen Glitch/Error Glow -->
    <radialGradient id="errorGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Shadow for Desk/Items -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Props -->
  <g id="room-background">
    <!-- Window with night city vibe -->
    <rect x="25" y="25" width="45" height="65" rx="4" fill="#334155" opacity="0.6" />
    <rect x="30" y="30" width="35" height="55" rx="2" fill="#1e293b" />
    <path d="M35 45 L50 45 L50 60 L35 60 Z" fill="#38bdf8" opacity="0.15" />
    
    <!-- Bookshelf / Wall detail -->
    <rect x="170" y="30" width="45" height="8" rx="2" fill="#475569" />
    <path d="M180 15 L185 30 L175 30 Z" fill="#10b981" />
    <rect x="190" y="18" width="12" height="12" rx="2" fill="#f59e0b" />

    <!-- Desk Surface -->
    <path d="M10 170 L230 170 L220 215 L20 215 Z" fill="#334155" filter="url(#dropShadow)" />
    <rect x="0" y="210" width="240" height="30" fill="#1e293b" />

    <!-- Desk Lamp -->
    <path d="M195 170 L205 170 L200 120 Z" fill="#64748b" />
    <path d="M185 95 C185 85 205 85 205 95 L215 110 L175 110 Z" fill="#cbd5e1" />
    <!-- Lamp Light Cone -->
    <polygon points="195,110 130,170 170,170" fill="url(#lampGlow)" />
  </g>

  <!-- The Computer (Subject: 电脑 with 毛病/glitch) -->
  <g id="computer-setup" filter="url(#dropShadow)">
    <!-- Computer Stand -->
    <path d="M95 145 L125 145 L130 165 L90 165 Z" fill="#64748b" />
    <ellipse cx="110" cy="165" rx="25" ry="5" fill="#475569" />

    <!-- Monitor Outer Frame -->
    <rect x="65" y="70" width="90" height="78" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3" />
    
    <!-- Monitor Screen Background -->
    <rect x="71" y="76" width="78" height="66" rx="4" fill="#0f172a" />
    <rect x="71" y="76" width="78" height="66" rx="4" fill="url(#errorGlow)" />

    <!-- Glitch / Error Visuals on Screen (Representing '毛病' / breakdown) -->
    <!-- Distorted UI Windows -->
    <rect x="78" y="85" width="40" height="25" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <line x1="83" y1="92" x2="105" y2="92" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <line x1="83" y1="100" x2="95" y2="100" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Glitch Bars / Static Lines -->
    <rect x="85" y="115" width="50" height="4" fill="#ef4444" opacity="0.8" />
    <rect x="75" y="123" width="30" height="3" fill="#38bdf8" opacity="0.7" />
    <path d="M120 82 L138 100 M138 82 L120 100" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />

    <!-- Warning Icon floating near screen -->
    <circle cx="138" cy="120" r="10" fill="#ef4444" />
    <path d="M138 114 L138 121 M138 124 L138 125" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Character: Concerned/Perplexed Person looking at the glitching computer -->
  <g id="character" filter="url(#dropShadow)">
    <!-- Character Body / Hoodie -->
    <path d="M25 210 C25 180 45 165 60 165 C75 165 95 180 95 210 Z" fill="#3b82f6" />
    <!-- Hoodie Hood/Collar details -->
    <path d="M45 165 C45 150 75 150 75 165" fill="none" stroke="#2563eb" stroke-width="4" />

    <!-- Character Neck -->
    <rect x="52" y="148" width="16" height="18" fill="#fcd34d" />

    <!-- Character Head -->
    <circle cx="60" cy="135" r="20" fill="#fcd34d" />

    <!-- Hair -->
    <path d="M40 135 C40 115 80 115 80 135 C80 125 75 118 60 118 C45 118 40 125 40 135 Z" fill="#1e293b" />

    <!-- Confused / Concerned Facial Expression -->
    <!-- Furrowed Eyebrows -->
    <path d="M50 129 L58 132" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M62 132 L70 129" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    
    <!-- Eyes (worried dot/arc) -->
    <circle cx="53" cy="137" r="2" fill="#1e293b" />
    <circle cx="67" cy="137" r="2" fill="#1e293b" />

    <!-- Worried Open Mouth (slight 'oh' or frown) -->
    <ellipse cx="60" cy="146" rx="3.5" ry="2.5" fill="#b45309" />

    <!-- Hand Scratching Head / Puzzled Pose -->
    <!-- Arm raised -->
    <path d="M40 180 C30 160 45 135 55 132" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="54" cy="128" r="5" fill="#fcd34d" />
  </g>

  <!-- Foreground Desk Props -->
  <g id="desk-props">
    <!-- Coffee Mug -->
    <rect x="155" y="175" width="16" height="20" rx="3" fill="#ffffff" filter="url(#dropShadow)" />
    <path d="M171 180 C176 180 176 190 171 192" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <path d="M158 172 C160 168 165 168 167 172" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- Keyboard -->
    <rect x="85" y="175" width="50" height="15" rx="3" fill="#cbd5e1" filter="url(#dropShadow)" />
    <!-- Key lines -->
    <line x1="90" y1="180" x2="130" y2="180" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="90" y1="185" x2="130" y2="185" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Mouse -->
    <ellipse cx="145" cy="182" rx="4" ry="6" fill="#cbd5e1" filter="url(#dropShadow)" />
  </g>

  <!-- Atmospheric Question Mark / Problem Indicator (Clean, Stylized Graphic, No text) -->
  <g id="problem-indicator" transform="translate(135, 45)">
    <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" filter="url(#dropShadow)" />
    <!-- Stylized "?" path -->
    <path d="M-4 -5 C-4 -9 4 -9 4 -4 C4 1 -4 3 -4 8" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-4" cy="12" r="1.5" fill="#f59e0b" />
  </g>
</svg>