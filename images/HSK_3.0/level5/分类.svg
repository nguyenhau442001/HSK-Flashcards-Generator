<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Trash Bins -->
  <rect x="40" y="130" width="40" height="60" rx="4" fill="#10b981"/>
  <rect x="100" y="130" width="40" height="60" rx="4" fill="#38bdf8"/>
  <rect x="160" y="130" width="40" height="60" rx="4" fill="#fb923c"/>
  
  <!-- Character -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="-20" r="15" fill="#fde68a"/>
    <path d="M-10 -15 Q0 -5 10 -15" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="-15" y="-5" width="30" height="30" rx="5" fill="#ec4899"/>
    <rect x="-20" y="25" width="10" height="40" rx="2" fill="#ec4899"/>
    <rect x="10" y="25" width="10" height="40" rx="2" fill="#ec4899"/>
    <!-- Arm holding item -->
    <path d="M-15 10 L-30 30" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-35" cy="35" r="8" fill="#f59e0b"/>
  </g>
  
  <!-- Floating items -->
  <circle cx="180" cy="110" r="6" fill="#fb923c"/>
  <circle cx="60" cy="110" r="6" fill="#10b981"/>
  <circle cx="120" cy="80" r="6" fill="#38bdf8"/>
  
  <!-- Decorative elements -->
  <path d="M20 190 L220 190" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
</svg>