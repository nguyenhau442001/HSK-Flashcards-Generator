<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="deskLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Clip Art Style Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#090d16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & BACKGROUND DETAILS -->
  <!-- Ambient Desk Glow -->
  <circle cx="120" cy="140" r="100" fill="url(#deskLight)"/>

  <!-- Wallpaper / Back Wall -->
  <path d="M0 0h240v140H0z" fill="#1e293b"/>
  <!-- Wall Panelling Detail -->
  <line x1="0" y1="139" x2="240" y2="139" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="25" width="45" height="70" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="25" y="30" width="35" height="50" rx="2" fill="#1e293b" opacity="0.6"/>

  <!-- Hotel/Reception Back Arch / Signage Board (Abstract graphic shapes, NO text) -->
  <path d="M140 30h50a8 8 0 0 1 8 8v42h-66V38a8 8 0 0 1 8-8z" fill="#334155" opacity="0.5"/>
  <circle cx="165" cy="50" r="10" fill="#f59e0b" opacity="0.8"/>
  <path d="M158 65h14" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Hanging Potted Plant (Adds life & richness) -->
  <path d="M210 0v25" stroke="#475569" stroke-width="2"/>
  <path d="M195 25h30l-5 20h-20z" fill="#64748b"/>
  <path d="M210 20 c-10 -15 -25 -5 -15 5 z" fill="#10b981"/>
  <path d="M210 20 c12 -15 22 -2 12 8 z" fill="#059669"/>
  <path d="M210 25 c0 -20 20 -20 10 0 z" fill="#34d399"/>

  <!-- Counter / Reception Desk (Foreground anchor) -->
  <path d="M-10 140h260v85H-10z" fill="#0f172a" filter="url(#dropShadow)"/>
  <!-- Wooden Counter Top -->
  <path d="M-10 140h260v12H-10z" fill="#b45309"/>
  <path d="M-10 140h260v4H-10z" fill="#d97706"/>
  <!-- Front Desk Panel Accent -->
  <rect x="20" y="160" width="200" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Stylized Front Desk Wood Slat Detail -->
  <line x1="40" y1="160" x2="40" y2="210" stroke="#334155" stroke-width="2"/>
  <line x1="200" y1="160" x2="200" y2="210" stroke="#334155" stroke-width="2"/>

  <!-- PROPS ON THE DESK -->
  <!-- Desk Lamp -->
  <path d="M210 140l-8-25h-6l-8 25z" fill="#64748b"/>
  <path d="M180 110c0-10 10-18 20-18s20 8 20 18z" fill="#fbbf24"/>
  <path d="M188 110h14l6 8h-26z" fill="#f59e0b"/>
  <ellipse cx="195" cy="140" rx="25" ry="8" fill="#fbbf24" opacity="0.3"/>

  <!-- Registration Guestbook / Clipboard & Pen (Crucial context for '登记') -->
  <g transform="translate(70, 130) rotate(-5)">
    <!-- Clipboard Shadow -->
    <rect x="0" y="0" width="45" height="35" rx="3" fill="#0f172a" opacity="0.5"/>
    <!-- Clipboard Base -->
    <rect x="-2" y="-2" width="45" height="35" rx="3" fill="#cbd5e1"/>
    <!-- Paper -->
    <rect x="2" y="2" width="37" height="27" fill="#f8fafc"/>
    <!-- Simulated handwritten lines (No real text) -->
    <line x1="6" y1="8" x2="25" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="32" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="20" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Metal Clip -->
    <rect x="13" y="-5" width="15" height="6" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Visitor's Tag / Badge Stand on Desk -->
  <path d="M45 140l5-15h10l5 15z" fill="#475569"/>
  <rect x="42" y="120" width="26" height="15" rx="2" fill="#e2e8f0"/>
  <circle cx="55" cy="127" r="4" fill="#3b82f6"/>

  <!-- CHARACTER: GUEST / CUSTOMER ACTIVELY REGISTERING -->
  <g id="guestCharacter">
    <!-- Body / Torso (Leaning forward into the action) -->
    <path d="M75 185c-2-20 8-35 25-45l15 45z" fill="#3b82f6" filter="url(#dropShadow)"/>
    <!-- Collar / Shirt Detail -->
    <path d="M95 140l5 10 6-10z" fill="#ffffff"/>
    <path d="M92 140l8 6 8-6z" fill="#e2e8f0"/>

    <!-- Head & Neck -->
    <path d="M98 120h8v15h-8z" fill="url(#skin)"/>
    <path d="M85 95c0-15 12-22 25-22s25 7 25 22c0 12-5 25-25 27s-25-15-25-27z" fill="url(#skin)" filter="url(#dropShadow)"/>

    <!-- Hair (Stylish modern cut) -->
    <path d="M85 90c2-15 15-22 28-22 14 0 23 8 24 20-3-2-8-3-12-3-8 0-12 4-18 4-8 0-14-3-22 1z" fill="#1e293b"/>
    <path d="M85 90c-3 8-2 16 2 22-2-5-2-12 2-22z" fill="#1e293b"/>

    <!-- Facial Features (Friendly, focused expression) -->
    <!-- Eyebrow (Slightly tilted down in concentration) -->
    <path d="M107 92l10 2" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Eye (Focused, looking down at clipboard) -->
    <circle cx="112" cy="98" r="2.5" fill="#1e293b"/>
    <!-- Nose -->
    <path d="M117 101c2 2 1 5 0 6" stroke="#d4b48c" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile (Confident/Satisfied) -->
    <path d="M110 112c3 3 7 2 9 0" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheek -->
    <circle cx="120" cy="107" r="4" fill="#fb7185" opacity="0.4"/>

    <!-- Left Arm & Hand (Reaching forward, holding pen to sign/register) -->
    <!-- Upper arm -->
    <path d="M80 145c10-5 22-2 30 10l-12 12c-8-8-14-12-18-22z" fill="#2563eb"/>
    <!-- Forearm & Hand writing -->
    <path d="M98 167l25-12 4 8-25 14z" fill="url(#skin)"/>
    <!-- Pen -->
    <path d="M123 159l12-6 2 3-12 6z" fill="#0f172a"/>
    <path d="M135 153l3-1.5-1.5 3z" fill="#fbbf24"/> <!-- Gold nib -->
    <!-- Action Motion Lines for writing/registering -->
    <path d="M130 168c3 2 6 1 8 -1" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M134 173c4 1 7-1 9-3" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Right Arm (Supporting / resting on desk) -->
    <path d="M115 150c12 5 18 15 22 25l-10 5c-3-8-8-15-15-18z" fill="#2563eb"/>
  </g>

  <!-- FOREGROUND / POLISH DETAILS -->
  <!-- Floating Sparkles / Success Indicator (Highlights the successful action of '登记') -->
  <g transform="translate(145, 95)" opacity="0.9">
    <path d="M0-8L2-2L8 0L2 2L0 8L-2 2L-8 0L-2-2Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(60, 80) scale(0.6)" opacity="0.7">
    <path d="M0-8L2-2L8 0L2 2L0 8L-2 2L-8 0L-2-2Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(155, 60) scale(0.8)" opacity="0.8">
    <path d="M0-8L2-2L8 0L2 2L0 8L-2 2L-8 0L-2-2Z" fill="#34d399"/>
  </g>

  <!-- Vignette / Frame border soft shadow inside rounded rect -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.15"/>
</svg>