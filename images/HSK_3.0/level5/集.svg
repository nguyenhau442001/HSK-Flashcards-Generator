<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- TV Screen -->
  <rect x="40" y="50" width="160" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="44" y="54" width="152" height="82" rx="4" fill="#334155"/>
  <circle cx="120" cy="95" r="15" fill="#fbbf24" opacity="0.3"/>
  <path d="M110 95 L130 95 L120 110 Z" fill="#fbbf24"/>
  
  <!-- Character -->
  <g transform="translate(120, 160)">
    <circle cx="0" cy="-20" r="15" fill="#fde68a"/>
    <path d="M-10 -15 Q0 -10 10 -15" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="-25" y="-5" width="50" height="40" rx="10" fill="#38bdf8"/>
    <rect x="-10" y="35" width="8" height="30" fill="#475569"/>
    <rect x="2" y="35" width="8" height="30" fill="#475569"/>
  </g>

  <!-- Episode Counter UI Element -->
  <g transform="translate(160, 60)">
    <rect x="0" y="0" width="30" height="15" rx="3" fill="#ec4899"/>
    <circle cx="5" cy="7.5" r="2" fill="white"/>
    <circle cx="15" cy="7.5" r="2" fill="white"/>
    <circle cx="25" cy="7.5" r="2" fill="white"/>
  </g>

  <!-- Sofa/Couch -->
  <path d="M20 180 L220 180 L210 220 L30 220 Z" fill="#10b981"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="3" fill="#fb923c"/>
  <circle cx="210" cy="150" r="4" fill="#fb923c"/>
  <path d="M180 190 L190 180" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
</svg>