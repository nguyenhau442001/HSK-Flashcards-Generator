<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="tableGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="sceneClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <g clip-path="url(#sceneClip)">
    <!-- Ambient Background Elements (Office / Meeting Room) -->
    <!-- Window backdrop showing city night lights -->
    <path d="M70 30 H170 V110 H70 Z" fill="#0b1329" />
    <path d="M75 35 H115 V105 H75 Z" fill="#172554" opacity="0.6" />
    <path d="M125 35 H165 V105 H125 Z" fill="#172554" opacity="0.6" />
    <!-- City lights through window -->
    <circle cx="85" cy="50" r="2" fill="#38bdf8" opacity="0.8" />
    <circle cx="95" cy="70" r="1.5" fill="#f59e0b" opacity="0.7" />
    <circle cx="105" cy="45" r="2" fill="#fb923c" opacity="0.9" />
    <circle cx="140" cy="80" r="2" fill="#38bdf8" opacity="0.5" />
    <circle cx="155" cy="60" r="1.5" fill="#10b981" opacity="0.8" />

    <!-- Ambient lighting from a modern ceiling lamp -->
    <path d="M120 0 L60 140 H180 Z" fill="url(#warmLight)" />

    <!-- Wall shelf with decorative props (plant, books) -->
    <rect x="25" y="45" width="35" height="4" rx="2" fill="#475569" />
    <path d="M32 45 L34 33 H42 L44 45 Z" fill="#10b981" /> <!-- potted plant -->
    <circle cx="38" cy="30" r="6" fill="#059669" />
    <rect x="48" y="38" width="8" height="7" rx="1" fill="#ec4899" />
    <rect x="57" y="36" width="6" height="9" rx="1" fill="#38bdf8" />

    <!-- Large Circular Collaborative Board / Screen on Wall (Representing shared goals/interests) -->
    <circle cx="120" cy="75" r="28" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle cx="120" cy="75" r="22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
    <!-- Abstract success chart lines inside circle -->
    <path d="M106 83 L114 74 L122 79 L134 63" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="134" cy="63" r="3" fill="#10b981" />

    <!-- Conference Table -->
    <path d="M30 155 H210 L195 210 H45 Z" fill="url(#tableGradient)" />
    <path d="M30 155 H210 V162 H30 Z" fill="#475569" opacity="0.8" /> <!-- Table rim highlight -->
    <!-- Table props: Laptops, coffee cups, documents -->
    <rect x="85" y="165" width="22" height="14" rx="2" fill="#cbd5e1" transform="skewX(-15)" />
    <rect x="83" y="177" width="26" height="2" fill="#94a3b8" transform="skewX(-15)" />
    <circle cx="135" cy="170" r="5" fill="#f8fafc" /> <!-- Coffee mug -->
    <path d="M60 170 H75 V182 H60 Z" fill="#f8fafc" opacity="0.9" transform="skewX(10)" /> <!-- Folder/Docs -->

    <!-- CHARACTER 1 (Left): Person smiling, gesturing agreement -->
    <g transform="translate(45, 110)">
      <!-- Body/Torso -->
      <path d="M15 50 C15 35 25 30 35 30 C45 30 55 35 55 50 V75 H15 Z" fill="#38bdf8" />
      <path d="M25 30 L35 45 L45 30" fill="none" stroke="#f8fafc" stroke-width="3" /> <!-- Collar -->
      <!-- Head & Hair -->
      <circle cx="35" cy="18" r="14" fill="#fbcfe8" />
      <path d="M21 18 C21 8 28 5 35 5 C42 5 49 8 49 18 C49 20 48 21 48 21 C45 15 39 12 35 12 C31 12 25 15 22 21 C21 21 21 20 21 18 Z" fill="#0f172a" />
      <!-- Face -->
      <circle cx="31" cy="17" r="1.5" fill="#0f172a" />
      <circle cx="39" cy="17" r="1.5" fill="#0f172a" />
      <path d="M33 22 Q35 25 37 22" fill="none" fill-opacity="0" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
      <!-- Arm gesturing thumb up / open palm towards center -->
      <path d="M15 40 Q5 45 10 55" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
      <circle cx="8" cy="56" r="4" fill="#fbcfe8" />
    </g>

    <!-- CHARACTER 2 (Center/Right-ish): Main speaker nodding in alignment -->
    <g transform="translate(100, 100)">
      <!-- Body/Torso -->
      <path d="M15 60 C15 45 25 40 35 40 C45 40 55 45 55 85 H15 Z" fill="#10b981" />
      <path d="M25 40 L35 55 L45 40" fill="none" stroke="#f8fafc" stroke-width="3" />
      <!-- Head & Hair -->
      <circle cx="35" cy="24" r="15" fill="#fbcfe8" />
      <path d="M20 24 C20 12 27 10 35 10 C43 10 50 12 50 24 C50 26 48 25 48 22 C46 16 41 14 35 14 C29 14 24 16 22 22 C20 25 20 24 20 24 Z" fill="#78350f" />
      <!-- Face (Happy, eyes closed in agreement / smiling wide) -->
      <path d="M30 23 Q32 21 34 23" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
      <path d="M36 23 Q38 21 40 23" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
      <path d="M33 28 Q35 31 37 28" fill="#e11d48" />
      <!-- Arms raised expressing mutual benefit/agreement -->
      <path d="M18 50 Q5 45 2 35" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
      <circle cx="1" cy="33" r="4" fill="#fbcfe8" />
      <path d="M52 50 Q65 45 68 35" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
      <circle cx="69" cy="33" r="4" fill="#fbcfe8" />
    </g>

    <!-- CHARACTER 3 (Right): Smiling colleague nodding along -->
    <g transform="translate(155, 110)">
      <!-- Body/Torso -->
      <path d="M15 50 C15 35 25 30 35 30 C45 30 55 35 55 75 H15 Z" fill="#f59e0b" />
      <path d="M25 30 L35 45 L45 30" fill="none" stroke="#f8fafc" stroke-width="3" />
      <!-- Head & Hair -->
      <circle cx="35" cy="18" r="14" fill="#fbcfe8" />
      <path d="M21 16 C23 7 30 5 35 5 C42 5 48 8 49 16 C49 18 47 15 45 12 C40 9 30 9 25 12 C22 15 21 16 21 16 Z" fill="#334155" />
      <!-- Face -->
      <circle cx="31" cy="17" r="1.5" fill="#0f172a" />
      <circle cx="39" cy="17" r="1.5" fill="#0f172a" />
      <path d="M33 22 Q35 25 37 22" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
      <!-- Arm gesturing forward -->
      <path d="M55 45 Q65 48 60 58" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
      <circle cx="59" cy="60" r="4" fill="#fbcfe8" />
    </g>

    <!-- FOREGROUND VIBE / ACCENTS (Shared Benefit Sparkles & Connection) -->
    <g filter="url(#glow)">
      <!-- Central floating glowing nodes representing shared interest / win-win agreement -->
      <circle cx="120" cy="130" r="6" fill="#38bdf8" />
      <circle cx="95" cy="140" r="4" fill="#10b981" />
      <circle cx="145" cy="140" r="4" fill="#fbbf24" />
      <!-- Connecting lines symbolizing harmony and mutual benefit -->
      <path d="M95 140 Q107 125 120 130 Q133 125 145 140" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
      
      <!-- Star sparkles -->
      <path d="M120 112 L122 118 L128 120 L122 122 L120 128 L118 122 L112 120 L118 118 Z" fill="#fbbf24" />
      <path d="M75 125 L76 128 L79 129 L76 130 L75 133 L74 130 L71 129 L74 128 Z" fill="#38bdf8" />
      <path d="M165 125 L166 128 L169 129 L166 130 L165 133 L164 130 L161 129 L164 128 Z" fill="#10b981" />
    </g>

    <!-- Bottom Vignette overlay for cinematic framing -->
    <rect x="0" y="210" width="240" height="30" fill="#090d16" opacity="0.5" />
  </g>
</svg>