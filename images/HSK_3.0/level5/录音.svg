<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Phone Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Waveform Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / SCENERY: Detective/Office Room at Night -->
  <!-- Window frame and blinds background context -->
  <g opacity="0.6">
    <rect x="170" y="20" width="50" height="90" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <path d="M170 45 L220 45 M170 70 L220 70 M170 95 L220 95" stroke="#334155" stroke-width="1.5"/>
    <!-- Moonlight beam -->
    <polygon points="170,20 120,240 240,240" fill="url(#windowLight)"/>
  </g>

  <!-- Bookshelf / Evidence folder in background -->
  <rect x="20" y="40" width="35" height="50" rx="2" fill="#334155"/>
  <rect x="25" y="45" width="25" height="8" rx="1" fill="#475569"/>
  <rect x="25" y="58" width="25" height="8" rx="1" fill="#64748b"/>
  <path d="M22 90 L50 75 L50 90 Z" fill="#f59e0b" opacity="0.8"/> <!-- Folder bookmark tag -->

  <!-- Wooden Desk Surface -->
  <path d="M 0 170 Q 120 160 240 170 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <path d="M 0 170 Q 120 160 240 170 L 240 174 Q 120 164 0 174 Z" fill="#334155"/>

  <!-- Evidence / Documents on Desk (Context for "chứng cứ") -->
  <g transform="translate(30, 165) rotate(-8)">
    <rect width="50" height="65" rx="3" fill="#f8fafc"/>
    <rect x="8" y="10" width="25" height="4" rx="1" fill="#cbd5e1"/>
    <rect x="8" y="20" width="34" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="8" y="28" width="28" height="3" rx="1" fill="#e2e8f0"/>
    <!-- Stamp/Seal for Evidence -->
    <circle cx="35" cy="48" r="10" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M30 48 L33 51 L41 43" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Magnifying Glass (Evidence prop) -->
  <g transform="translate(180, 180) rotate(25)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="0" cy="0" r="16" fill="#38bdf8" fill-opacity="0.1"/>
    <rect x="-3" y="16" width="6" height="25" rx="3" fill="#64748b"/>
  </g>

  <!-- CHARACTER: Determined Investigator/Witness recording evidence -->
  <g id="character">
    <!-- Body / Torso (Wearing a neat jacket/shirt) -->
    <path d="M 85 190 C 85 155 110 145 120 145 C 130 145 155 155 155 190 Z" fill="#1e293b"/>
    <!-- Inner Shirt & Collar -->
    <path d="M 105 145 L 120 165 L 135 145 Z" fill="#f8fafc"/>
    <path d="M 115 155 L 120 170 L 125 155 Z" fill="#ef4444"/> <!-- Tie -->

    <!-- Neck -->
    <rect x="110" y="130" width="20" height="20" rx="8" fill="#fca5a5"/>

    <!-- Head -->
    <circle cx="120" cy="115" r="24" fill="#fca5a5"/>
    
    <!-- Hair -->
    <path d="M 96 115 C 96 95 144 95 144 115 C 144 105 135 90 120 90 C 105 90 96 105 96 115 Z" fill="#334155"/>

    <!-- Serious, focused facial expression -->
    <!-- Eyes (Focused down towards phone) -->
    <circle cx="111" cy="116" r="2.5" fill="#0f172a"/>
    <circle cx="129" cy="116" r="2.5" fill="#0f172a"/>
    <!-- Eyebrows (Determined) -->
    <path d="M 107 111 L 115 113" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 133 111 L 125 113" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Mouth (Intentional set line) -->
    <path d="M 116 127 Q 120 129 124 127" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Arms & Smartphone Recording Gesture -->
    <!-- Right Arm holding phone up near mouth/evidence -->
    <path d="M 145 160 C 150 140 140 120 130 115" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <circle cx="130" cy="112" r="6" fill="#fca5a5"/> <!-- Hand holding phone -->

    <!-- Smartphone with Recording UI -->
    <g transform="translate(105, 95) rotate(-15)">
      <!-- Phone Body -->
      <rect x="0" y="0" width="30" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
      <!-- Screen -->
      <rect x="3" y="5" width="24" height="40" rx="2" fill="url(#screenGrad)"/>
      <!-- Live Recording Indicator (Red blinking dot) -->
      <circle cx="15" cy="13" r="4" fill="#ef4444" filter="url(#glow)"/>
      <!-- Audio Waveform Visualization on Screen -->
      <path d="M 7 28 L 10 24 L 13 33 L 16 20 L 19 30 L 23 26" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Left Arm resting on table -->
    <path d="M 95 165 C 80 175 75 190 70 200" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="68" cy="202" r="6" fill="#fca5a5"/>
  </g>

  <!-- DYNAMIC AUDIO EFFECTS ("Recording" visual cues) -->
  <!-- Sound waves emitting from phone -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 148 95 Q 160 105 155 120" filter="url(#glow)"/>
    <path d="M 155 88 Q 172 105 165 130" opacity="0.5"/>
  </g>

  <!-- Floating Audio Bars / Voice Activity visualization -->
  <g transform="translate(145, 60)" filter="url(#glow)">
    <rect x="0" y="5" width="4" height="15" rx="2" fill="#10b981"/>
    <rect x="7" y="0" width="4" height="25" rx="2" fill="#38bdf8"/>
    <rect x="14" y="8" width="4" height="12" rx="2" fill="#f59e0b"/>
    <rect x="21" y="3" width="4" height="22" rx="2" fill="#ec4899"/>
    <rect x="28" y="10" width="4" height="10" rx="2" fill="#38bdf8"/>
  </g>

  <!-- Additional atmospheric sparkles / focus highlights -->
  <circle cx="50" cy="110" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="80" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="210" cy="140" r="1.5" fill="#38bdf8" opacity="0.4"/>
</svg>