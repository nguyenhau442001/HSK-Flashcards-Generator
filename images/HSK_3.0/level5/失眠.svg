<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed frame -->
  <path d="M40 180 L200 180 L210 210 L30 210 Z" fill="#334155"/>
  <path d="M40 180 L40 140 L200 140 L200 180 Z" fill="#475569"/>
  
  <!-- Pillow -->
  <path d="M50 130 Q50 110 80 110 L160 110 Q190 110 190 130 L190 140 Q120 145 50 140 Z" fill="#94a3b8"/>
  
  <!-- Character head (tossing and turning) -->
  <circle cx="120" cy="120" r="35" fill="#fde68a"/>
  <path d="M105 110 A5 5 0 1 0 105 120 A5 5 0 1 0 105 110" fill="#1e293b"/>
  <path d="M135 110 A5 5 0 1 0 135 120 A5 5 0 1 0 135 110" fill="#1e293b"/>
  <path d="M110 135 Q120 142 130 135" stroke="#1e293b" stroke-width="2" fill="none"/>
  
  <!-- Eyes open/wide awake -->
  <circle cx="108" cy="115" r="3" fill="#0f172a"/>
  <circle cx="132" cy="115" r="3" fill="#0f172a"/>
  
  <!-- Clock on nightstand -->
  <rect x="180" y="150" width="40" height="50" rx="5" fill="#334155"/>
  <circle cx="200" cy="165" r="12" fill="#f59e0b"/>
  <line x1="200" y1="165" x2="200" y2="155" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="165" x2="208" y2="165" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Floating "awake" energy lines -->
  <path d="M90 90 Q100 80 110 90" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M130 90 Q140 80 150 90" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="160" cy="70" r="3" fill="#fb923c"/>
  <circle cx="80" cy="75" r="2" fill="#fb923c"/>
  
  <!-- Blanket -->
  <path d="M30 140 L210 140 L220 200 L20 200 Z" fill="#64748b"/>
  <path d="M30 140 L210 140 L200 160 L40 160 Z" fill="#475569"/>
</svg>