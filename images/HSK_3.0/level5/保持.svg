<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor/Surface -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- The Balancing Act: A stack of smooth stones -->
  <!-- Base stone -->
  <ellipse cx="120" cy="185" rx="45" ry="20" fill="#475569"/>
  <ellipse cx="120" cy="180" rx="40" ry="18" fill="#64748b"/>
  
  <!-- Middle stone -->
  <ellipse cx="120" cy="150" rx="35" ry="25" fill="#94a3b8"/>
  <ellipse cx="120" cy="145" rx="30" ry="22" fill="#cbd5e1"/>
  
  <!-- Top stone -->
  <ellipse cx="120" cy="110" rx="25" ry="20" fill="#f1f5f9"/>
  
  <!-- Balancing Prop: A thin golden rod extending from the side to show stability -->
  <rect x="155" y="140" width="40" height="4" rx="2" fill="#f59e0b"/>
  <circle cx="195" cy="142" r="6" fill="#fbbf24"/>
  
  <!-- Atmospheric elements: Floating particles to show focus/calm -->
  <circle cx="50" cy="60" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="50" r="3" fill="#10b981" opacity="0.6"/>
  <circle cx="70" cy="120" r="2" fill="#ec4899" opacity="0.6"/>
  <circle cx="170" cy="180" r="2" fill="#fb923c" opacity="0.6"/>
  
  <!-- Decorative arc to imply balance -->
  <path d="M80 160 A60 60 0 0 1 160 160" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 4" opacity="0.4"/>
</svg>