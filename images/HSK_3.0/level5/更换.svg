<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Workbench -->
  <rect x="20" y="160" width="200" height="15" rx="2" fill="#475569"/>
  <rect x="30" y="175" width="10" height="50" fill="#334155"/>
  <rect x="200" y="175" width="10" height="50" fill="#334155"/>
  
  <!-- The Machine (Open) -->
  <path d="M60 100 h100 v60 h-100 z" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="70" y="110" width="80" height="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="90" cy="130" r="8" fill="#fb923c"/>
  <rect x="110" y="125" width="30" height="10" rx="2" fill="#10b981"/>
  
  <!-- The Part being replaced -->
  <rect x="120" y="115" width="15" height="25" fill="#ec4899" stroke="#fbcfe8" stroke-width="1"/>
  
  <!-- Character (Technician) -->
  <g transform="translate(150, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 25 q10 5 20 0" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="5" y="35" width="30" height="40" rx="5" fill="#38bdf8"/>
    <rect x="0" y="40" width="10" height="30" rx="2" fill="#38bdf8"/>
    <rect x="30" y="40" width="10" height="30" rx="2" fill="#38bdf8"/>
  </g>
  
  <!-- Tools -->
  <path d="M40 140 l20 -20 l5 5 l-20 20 z" fill="#94a3b8"/>
  <circle cx="45" cy="135" r="3" fill="#fbbf24"/>
  
  <!-- Floating Sparks/Action -->
  <circle cx="130" cy="110" r="2" fill="#fbbf24"/>
  <circle cx="135" cy="105" r="1.5" fill="#fbbf24"/>
  
  <!-- Ambient light -->
  <ellipse cx="120" cy="130" rx="40" ry="20" fill="#38bdf8" opacity="0.1"/>
</svg>