<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Conveyor belt structure -->
  <rect x="20" y="140" width="200" height="20" rx="4" fill="#334155"/>
  <circle cx="40" cy="150" r="12" fill="#475569"/>
  <circle cx="200" cy="150" r="12" fill="#475569"/>
  
  <!-- Items on the belt -->
  <rect x="60" y="110" width="30" height="30" rx="4" fill="#64748b"/>
  <rect x="150" y="110" width="30" height="30" rx="4" fill="#64748b"/>
  
  <!-- The Key Link (The "环节" - highlighted in gold) -->
  <rect x="105" y="100" width="40" height="40" rx="6" fill="#f59e0b" stroke="#fbbf24" stroke-width="3"/>
  <path d="M115 115 L135 125 M115 125 L135 115" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Character -->
  <g transform="translate(160, 60)">
    <circle cx="20" cy="20" r="15" fill="#cbd5e1"/>
    <path d="M5 40 Q20 60 35 40" fill="#cbd5e1"/>
    <rect x="10" y="40" width="20" height="40" rx="5" fill="#38bdf8"/>
    <path d="M10 50 L0 70 M30 50 L40 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Spotlight/Focus effect -->
  <ellipse cx="125" cy="120" rx="30" ry="50" fill="#f59e0b" fill-opacity="0.15"/>
  
  <!-- Background details -->
  <rect x="20" y="160" width="200" height="5" fill="#1e293b"/>
  <circle cx="180" cy="40" r="8" fill="#ec4899" fill-opacity="0.6"/>
  <circle cx="50" cy="50" r="5" fill="#10b981" fill-opacity="0.6"/>
</svg>