<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Meeting Room Table -->
  <rect x="40" y="160" width="160" height="20" rx="4" fill="#334155"/>
  <rect x="50" y="180" width="10" height="40" fill="#475569"/>
  <rect x="180" y="180" width="10" height="40" fill="#475569"/>

  <!-- Speaker Character -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="-20" r="15" fill="#fde68a"/>
    <path d="M-5 -15 Q0 -10 5 -15" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="-5" cy="-22" r="2" fill="#1e293b"/>
    <circle cx="5" cy="-22" r="2" fill="#1e293b"/>
    <path d="M-15 0 L15 0 L10 50 L-10 50 Z" fill="#38bdf8"/>
    <path d="M-20 10 L-40 30" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 10 L40 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Listener Character -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="-20" r="12" fill="#fcd34d"/>
    <path d="M-10 0 L10 0 L5 40 L-5 40 Z" fill="#ec4899"/>
  </g>

  <!-- Speech Bubble / Sound Waves -->
  <path d="M140 80 Q160 60 180 80 M145 70 Q170 40 195 70" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Presentation Board -->
  <rect x="160" y="30" width="60" height="40" rx="4" fill="#10b981" opacity="0.8"/>
  <line x1="170" y1="45" x2="210" y2="45" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="55" x2="190" y2="55" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Ambient light -->
  <circle cx="200" cy="40" r="30" fill="#fb923c" opacity="0.05"/>
</svg>