<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Mountain Background -->
  <path d="M0 240 L0 120 L60 60 L120 100 L180 40 L240 100 L240 240 Z" fill="#334155"/>
  
  <!-- Campfire -->
  <circle cx="120" cy="200" r="15" fill="#fb923c" opacity="0.3"/>
  <path d="M115 200 L125 200 L120 180 Z" fill="#f59e0b"/>
  <path d="M118 185 L122 185 L120 170 Z" fill="#fbbf24"/>
  
  <!-- Character 1 (Left) -->
  <g transform="translate(70, 150)">
    <circle cx="0" cy="0" r="15" fill="#38bdf8"/>
    <path d="M-10 20 Q0 30 10 20" stroke="#fb923c" stroke-width="4" fill="none"/>
    <rect x="-20" y="25" width="40" height="50" rx="5" fill="#38bdf8"/>
  </g>
  
  <!-- Character 2 (Right) -->
  <g transform="translate(170, 150)">
    <circle cx="0" cy="0" r="15" fill="#ec4899"/>
    <path d="M-10 20 Q0 30 10 20" stroke="#fb923c" stroke-width="4" fill="none"/>
    <rect x="-20" y="25" width="40" height="50" rx="5" fill="#ec4899"/>
  </g>

  <!-- Heart Symbolizing Friendship -->
  <path d="M120 130 C110 120, 100 130, 120 145 C140 130, 130 120, 120 130" fill="#10b981"/>
  
  <!-- Stars -->
  <circle cx="40" cy="40" r="2" fill="#f8fafc"/>
  <circle cx="200" cy="30" r="1.5" fill="#f8fafc"/>
  <circle cx="150" cy="60" r="2" fill="#f8fafc"/>
  <circle cx="30" cy="100" r="1" fill="#f8fafc"/>
</svg>