<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Environment / Desk Background elements -->
  <path d="M20 180 L220 180" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Scientific Desk Objects (Backdrop) -->
  <!-- Flask with glowing liquid -->
  <path d="M45 150 L55 130 L65 130 L75 150 Z" fill="#334155"/>
  <rect x="52" y="123" width="16" height="7" rx="1" fill="#475569"/>
  <path d="M48 142 Q60 138 72 142 L74 150 Q60 152 46 150 Z" fill="#10b981" opacity="0.8"/>
  <circle cx="60" cy="146" r="1.5" fill="#a7f3d0"/>

  <!-- Stack of Books -->
  <path d="M175 165 L215 155 L218 168 L178 178 Z" fill="#475569"/>
  <path d="M173 154 L213 144 L216 156 L176 166 Z" fill="#38bdf8"/>
  <path d="M170 143 L210 133 L213 145 L173 155 Z" fill="#ec4899"/>

  <!-- Starry / Cosmic / Observation Beam Atmosphere -->
  <path d="M90 70 L140 10 L190 70 Z" fill="#38bdf8" opacity="0.04"/>
  <circle cx="140" cy="35" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="160" cy="55" r="1" fill="#fef08a" opacity="0.4"/>
  <circle cx="110" cy="45" r="2" fill="#38bdf8" opacity="0.5"/>

  <!-- Main Subject: Detailed Scientific Microscope & Observation Scene -->
  <!-- Microscope Base -->
  <path d="M80 175 C80 165 95 160 115 160 C135 160 150 165 150 175 Z" fill="#64748b"/>
  <!-- Vertical Pillar -->
  <rect x="105" y="80" width="20" height="85" rx="4" fill="#475569"/>
  
  <!-- Adjustment Knobs -->
  <circle cx="100" cy="100" r="6" fill="#fb923c"/>
  <circle cx="100" cy="100" r="2" fill="#9a3412"/>
  <circle cx="100" cy="120" r="4" fill="#fb923c"/>

  <!-- Microscope Stage/Platform -->
  <path d="M90 120 L145 120 L140 135 L95 135 Z" fill="#64748b"/>
  <!-- Slide on stage -->
  <rect x="102" y="125" width="36" height="6" rx="1" fill="#94a3b8" opacity="0.8"/>
  <circle cx="120" cy="128" r="4" fill="#10b981" filter="url(#glow)"/>

  <!-- Microscope Body & Head (Angled) -->
  <path d="M115 80 L145 50 L165 55 L130 95 Z" fill="#475569"/>
  <!-- Eyepiece Tube -->
  <path d="M145 50 L160 35 L175 42 L160 57 Z" fill="#334155"/>
  <rect x="163" y="36" width="16" height="8" rx="2" transform="rotate(25 163 36)" fill="url(#goldGrad)"/>

  <!-- Objective Lenses (Turret) -->
  <path d="M125 95 L135 105 L115 110 Z" fill="#334155"/>
  <rect x="123" y="105" width="8" height="15" rx="1" fill="url(#goldGrad)"/>
  <rect x="132" y="103" width="7" height="12" rx="1" fill="#38bdf8"/>

  <!-- Light beam from objective to slide -->
  <polygon points="125,115 133,115 124,127 116,127" fill="#38bdf8" opacity="0.5"/>

  <!-- Large Magnifying Glass (Active Observation Element held by hand/arm context) -->
  <g transform="translate(75, 75)">
    <!-- Glass Rim (Shadow) -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#0f172a" stroke-width="6" opacity="0.3"/>
    <!-- Glass Rim -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>
    <!-- Lens Surface -->
    <circle cx="0" cy="0" r="36" fill="url(#lensGrad)"/>
    <!-- Lens Specular Highlight -->
    <path d="M-22 -22 Q -5 -30 15 -22 Q 0 -15 -22 -22 Z" fill="#ffffff" opacity="0.4"/>
    
    <!-- Magnified Bug / Subject under Glass (Cute Vector Ladybug for discovery context) -->
    <g transform="translate(-2, 2) scale(0.9)">
      <!-- Leaf Surface -->
      <path d="M -30 15 Q -10 35 25 20 Q 35 -5 15 -25 Q -15 -20 -30 15 Z" fill="#15803d"/>
      <path d="M -20 5 Q 0 15 15 0" stroke="#166534" stroke-width="2" fill="none"/>
      
      <!-- Ladybug Body -->
      <ellipse cx="0" cy="0" rx="14" ry="12" fill="#ef4444"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#7f1d1d" stroke-width="2"/>
      <!-- Head -->
      <circle cx="11" cy="0" r="5" fill="#1e293b"/>
      <!-- Spots -->
      <circle cx="-5" cy="-5" r="2.5" fill="#1e293b"/>
      <circle cx="-5" cy="5" r="2.5" fill="#1e293b"/>
      <circle cx="5" cy="-6" r="2" fill="#1e293b"/>
      <circle cx="5" cy="6" r="2" fill="#1e293b"/>
    </g>

    <!-- Handle -->
    <path d="M28 28 L55 55" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <path d="M28 28 L55 55" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="55" cy="55" r="5" fill="#b45309"/>
  </g>

  <!-- Floating Sparkles / Discovery Elements -->
  <path d="M35 80 L38 88 L46 91 L38 94 L35 102 L32 94 L24 91 L32 88 Z" fill="#fbbf24" opacity="0.9" transform="scale(0.6) translate(20, 20)"/>
  <path d="M190 100 L192 105 L197 107 L192 109 L190 114 L188 109 L183 107 L188 105 Z" fill="#38bdf8" opacity="0.9"/>
  <path d="M150 170 L152 174 L156 176 L152 178 L150 182 L148 178 L144 176 L148 174 Z" fill="#ec4899" opacity="0.8"/>

  <!-- Vibrant Focus Ring / Indicator (Subtle UI framing for learning context) -->
  <circle cx="75" cy="75" r="48" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>

</svg>