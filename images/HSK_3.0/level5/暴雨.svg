<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="25" y="45" width="90" height="130" rx="4" />
    </clipPath>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Floor -->
  <path d="M0 200 Q120 190 240 200 L240 240 L0 240 Z" fill="#334155" opacity="0.5"/>

  <!-- Window Frame -->
  <rect x="20" y="40" width="100" height="140" rx="6" fill="#475569"/>
  <rect x="25" y="45" width="90" height="130" rx="4" fill="#0c4a6e"/>

  <!-- Storm Outside (Clipped) -->
  <g clip-path="url(#windowClip)">
    <!-- Dark Clouds -->
    <circle cx="40" cy="55" r="20" fill="#1e293b"/>
    <circle cx="75" cy="50" r="25" fill="#1e293b"/>
    <circle cx="105" cy="60" r="20" fill="#1e293b"/>
    
    <!-- Lightning -->
    <path d="M80 55 L70 85 L85 85 L75 115" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Heavy Rain Streaks -->
    <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
      <line x1="40" y1="70" x2="30" y2="100" />
      <line x1="60" y1="80" x2="50" y2="110" />
      <line x1="90" y1="75" x2="80" y2="105" />
      <line x1="35" y1="120" x2="25" y2="150" />
      <line x1="65" y1="130" x2="55" y2="160" />
      <line x1="100" y1="125" x2="90" y2="155" />
      <line x1="50" y1="40" x2="40" y2="70" />
      <line x1="85" y1="150" x2="75" y2="180" />
    </g>
    
    <!-- Wind-blown Tree Silhouette -->
    <path d="M115 175 Q100 150 105 120" stroke="#0f172a" stroke-width="4" fill="none"/>
    <path d="M105 120 Q80 110 90 90 M105 120 Q120 100 110 80" stroke="#0f172a" stroke-width="3" fill="none"/>
  </g>

  <!-- Interior Details -->
  <!-- Warm Lamp Glow -->
  <circle cx="200" cy="80" r="40" fill="#f59e0b" opacity="0.1"/>
  <rect x="195" y="100" width="10" height="100" fill="#475569"/>
  <path d="M180 100 L220 100 L230 70 L170 70 Z" fill="#fbbf24" opacity="0.8"/>

  <!-- Character 1: The Advisor (Pointing to window) -->
  <g transform="translate(140, 110)">
    <!-- Body -->
    <path d="M10 80 Q15 30 30 30 Q45 30 50 80" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="30" cy="15" r="12" fill="#ffedd5"/>
    <!-- Arm pointing to window -->
    <path d="M15 45 L-20 45" stroke="#ffedd5" stroke-width="6" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M18 10 Q30 -5 42 10 L42 20 Q30 25 18 20 Z" fill="#475569"/>
  </g>

  <!-- Character 2: The Person staying in (Holding umbrella/coat) -->
  <g transform="translate(185, 115)">
    <!-- Body -->
    <path d="M5 75 Q15 35 30 35 Q45 35 55 75" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="30" cy="20" r="12" fill="#ffedd5"/>
    <!-- Arm holding umbrella -->
    <path d="M45 55 L55 70" stroke="#ffedd5" stroke-width="6" stroke-linecap="round"/>
    <!-- Closed Umbrella -->
    <path d="M55 70 L65 40" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
    <path d="M65 40 L68 35" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M18 15 Q30 5 42 15 L42 22 Q30 28 18 22 Z" fill="#1e293b"/>
  </g>

  <!-- Coat Rack -->
  <rect x="225" y="90" width="4" height="110" rx="2" fill="#475569"/>
  <path d="M225 110 L215 105" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M215 105 Q210 120 220 130" fill="#fb923c" opacity="0.9"/> <!-- Hanging raincoat -->

  <!-- Foreground Raindrops on Glass effect -->
  <circle cx="45" cy="80" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="85" cy="140" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="60" cy="110" r="2" fill="#ffffff" opacity="0.2"/>
</svg>