<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall/Office Interior Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Document Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Character 1 (Manager/Colleague pointing at the rulebook) Skin & Hair -->
    <linearGradient id="skin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    
    <!-- Character 2 Skin -->
    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>

    <!-- Ambient Glow for Corporate Vibe -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- BACKGROUND & ENVIRONMENT -->
  <!-- Office Back Wall -->
  <rect x="0" y="0" width="240" height="150" fill="url(#wallGrad)"/>
  
  <!-- Window showing modern city skyline at night -->
  <g transform="translate(150, 20)">
    <rect x="0" y="0" width="70" height="85" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- City Buildings Silhouette -->
    <rect x="8" y="35" width="12" height="50" fill="#1e293b"/>
    <rect x="22" y="20" width="16" height="65" fill="#1e293b"/>
    <rect x="40" y="45" width="10" height="40" fill="#1e293b"/>
    <rect x="52" y="30" width="12" height="55" fill="#1e293b"/>
    <!-- Tiny glowing windows -->
    <rect x="26" y="26" width="3" height="4" fill="#fbbf24" opacity="0.6"/>
    <rect x="31" y="32" width="3" height="4" fill="#fbbf24" opacity="0.6"/>
    <rect x="26" y="44" width="3" height="4" fill="#fbbf24" opacity="0.6"/>
    <rect x="55" y="40" width="3" height="4" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Wall Decor: Corporate Mission / Clock -->
  <circle cx="50" cy="45" r="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <line x1="50" y1="35" x2="50" y2="45" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="45" x2="58" y2="45" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="45" r="2" fill="#38bdf8"/>

  <!-- Indoor Plant for rich context -->
  <path d="M 18,125 Q 15,100 25,85 Q 35,100 32,125 Z" fill="#10b981"/>
  <path d="M 25,125 Q 5,105 12,90 Q 22,105 25,125 Z" fill="#059669"/>
  <path d="M 25,125 Q 45,105 38,90 Q 28,105 25,125 Z" fill="#34d399"/>
  <ellipse cx="25" cy="125" rx="10" ry="6" fill="#64748b"/>

  <!-- Hanging Desk Lamp providing warm accent -->
  <path d="M 110,0 L 110,35" stroke="#64748b" stroke-width="3"/>
  <path d="M 90,35 L 130,35 L 140,50 L 80,50 Z" fill="#cbd5e1"/>
  <ellipse cx="110" cy="50" rx="30" ry="15" fill="url(#lampGlow)"/>

  <!-- OFFICE DESK SURFACE -->
  <path d="M 0,140 L 240,140 L 240,240 L 0,240 Z" fill="url(#deskGrad)"/>
  <!-- Desk front edge highlight -->
  <rect x="0" y="140" width="240" height="4" fill="#64748b"/>

  <!-- PROPS ON DESK -->
  <!-- Laptop -->
  <path d="M 170,135 L 210,135 L 225,160 L 155,160 Z" fill="#64748b"/>
  <rect x="160" y="105" width="55" height="32" rx="3" fill="#cbd5e1"/>
  <rect x="163" y="108" width="49" height="24" rx="1" fill="#0f172a"/>
  <!-- Code/Chart on laptop screen -->
  <line x1="168" y1="114" x2="185" y2="114" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="168" y1="120" x2="195" y2="120" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="168" y1="126" x2="178" y2="126" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Mug -->
  <rect x="132" y="125" rx="3" ry="3" width="16" height="20" fill="#f8fafc"/>
  <path d="M 148,130 C 155,130 155,140 148,142" stroke="#f8fafc" stroke-width="2" fill="none"/>

  <!-- THE CENTRAL FOCUS: "制度" (Company Regulations / Rulebook) -->
  <g transform="translate(90, 115)">
    <!-- Open Rulebook / Manual -->
    <path d="M 0,10 C 20,2 40,2 60,10 L 60,40 C 40,32 20,32 0,40 Z" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 60,10 C 80,2 100,2 120,10 L 120,40 C 100,32 80,32 60,40 Z" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Book Spine center fold shadow -->
    <line x1="60" y1="10" x2="60" y2="40" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Rulebook Cover (Blue corporate binder theme) -->
    <path d="M -3,8 C 20,0 40,0 60,8 L 60,42 C 40,34 20,34 -3,42 Z" fill="#2563eb" opacity="0.15"/>
    <path d="M 60,8 C 80,0 100,0 123,8 L 123,42 C 100,34 80,34 60,42 Z" fill="#2563eb" opacity="0.15"/>

    <!-- Text lines representing strict corporate policies/guidelines -->
    <line x1="10" y1="18" x2="30" y2="17" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="24" x2="45" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="30" x2="35" y2="29" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <line x1="75" y1="18" x2="105" y2="17" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="75" y1="24" x2="100" y2="23" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/> <!-- highlighted rule line -->
    <line x1="75" y1="30" x2="110" y2="29" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Checkmark Badge on Policy (indicating official compliance/system) -->
    <circle cx="105" cy="30" r="7" fill="#10b981"/>
    <path d="M 101,30 L 104,33 L 110,27" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>


  <!-- CHARACTERS -->

  <!-- Character 1 (Left: Manager explaining the company policy/system) -->
  <g transform="translate(15, 65)">
    <!-- Body / Suit -->
    <path d="M 25,60 C 25,45 35,40 50,40 C 65,40 75,45 75,60 L 80,95 L 20,95 Z" fill="#1e293b"/>
    <!-- Shirt collar & Tie -->
    <polygon points="50,45 42,55 58,55" fill="#f8fafc"/>
    <polygon points="48,55 52,55 53,75 47,75" fill="#ef4444"/>

    <!-- Neck -->
    <rect x="43" y="32" width="14" height="12" fill="url(#skin1)"/>

    <!-- Head -->
    <circle cx="50" cy="22" r="16" fill="url(#skin1)"/>
    <!-- Hair (Modern neat corporate style) -->
    <path d="M 34,22 C 34,10 42,8 50,8 C 58,8 66,10 66,22 C 66,24 64,25 64,22 C 64,14 58,11 50,11 C 42,11 36,14 36,22 C 36,25 34,24 34,22 Z" fill="#334155"/>

    <!-- Facial Expression: Smiling confidently, pointing -->
    <path d="M 44,22 Q 50,27 56,22" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="43" cy="18" r="1.5" fill="#334155"/>
    <circle cx="57" cy="18" r="1.5" fill="#334155"/>

    <!-- Arm pointing at the rulebook -->
    <path d="M 68,48 L 95,62 L 92,66 L 70,55 Z" fill="#1e293b"/>
    <circle cx="95" cy="64" r="5" fill="url(#skin1)"/>
  </g>


  <!-- Character 2 (Right: Employee listening/learning the company system) -->
  <g transform="translate(140, 75)">
    <!-- Body / Casual Smart Blazer -->
    <path d="M 25,50 C 25,38 35,33 50,33 C 65,33 75,38 75,50 L 85,85 L 15,85 Z" fill="#3b82f6"/>
    <!-- Inner Shirt -->
    <polygon points="50,38 42,48 58,48" fill="#f8fafc"/>

    <!-- Neck -->
    <rect x="43" y="25" width="14" height="12" fill="url(#skin2)"/>

    <!-- Head (Attentive angle) -->
    <circle cx="50" cy="15" r="16" fill="url(#skin2)"/>
    <!-- Hair (Wavy / Stylized) -->
    <path d="M 34,15 C 34,5 44,2 52,4 C 62,6 66,12 66,18 C 66,20 64,19 64,16 C 64,10 58,7 50,7 C 42,7 36,10 36,16 C 36,19 34,20 34,15 Z" fill="#0f172a"/>

    <!-- Facial Expression: Understanding / Nodding -->
    <path d="M 45,16 Q 50,20 55,16" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="44" cy="12" r="1.5" fill="#334155"/>
    <circle cx="56" cy="12" r="1.5" fill="#334155"/>

    <!-- Arm resting on desk, supporting gesture -->
    <path d="M 30,48 L 10,65 L 5,60 L 25,42 Z" fill="#3b82f6"/>
    <circle cx="7" cy="62" r="5" fill="url(#skin2)"/>
  </g>

</svg>