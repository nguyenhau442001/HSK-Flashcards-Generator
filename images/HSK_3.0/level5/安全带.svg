  <!-- Seatbelt Action -->
  <path d="M125 140 L160 140 L170 200" stroke="#fb923c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="155" y="135" width="10" height="10" rx="2" fill="#fbbf24"/>
  
  <!-- Dashboard Details -->
