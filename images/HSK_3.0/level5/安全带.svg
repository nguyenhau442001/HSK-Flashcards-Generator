  <!-- Character -->
  <g transform="translate(140, 130)">
    <circle cx="0" cy="0" r="20" fill="#fde68a"/>
    <path d="M-8 -5 Q0 -10 8 -5" stroke="#475569" stroke-width="2" fill="none"/>
