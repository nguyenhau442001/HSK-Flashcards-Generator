<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="catGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24" fill="#000"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="240" height="240" fill="url(#bgGrad)"/>
    
    <!-- Warm background lighting emphasizing the "goodness/kindness" theme -->
    <circle cx="120" cy="110" r="90" fill="url(#warmLight)"/>

    <!-- ENVIRONMENT / CONTEXT: Cozy street corner / Alleyway with warm lantern -->
    <!-- Brick wall texture suggestion / background details -->
    <path d="M160 40h60v200h-60z" fill="#1e293b" opacity="0.5"/>
    <path d="M170 70h40M170 90h40M170 110h40M170 130h40" stroke="#334155" stroke-width="2"/>

    <!-- Street lamp / Warm light source -->
    <path d="M200 0v50h10" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <path d="M190 50h30l-5 15h-20z" fill="#475569"/>
    <!-- Lantern Glow -->
    <circle cx="205" cy="75" r="35" fill="#f59e0b" opacity="0.15"/>
    <circle cx="205" cy="68" r="8" fill="#fef08a"/>

    <!-- Potted plant on ground for realistic detail -->
    <ellipse cx="40" cy="195" rx="15" ry="6" fill="#334155"/>
    <path d="M30 195l5-25h10l5 25z" fill="#64748b"/>
    <path d="M35 170c-10-15-5-25 0-30 5 5 10 15 0 30z" fill="#10b981"/>
    <path d="M45 172c10-12 8-22 3-26-4 4-8 12-3 26z" fill="#34d399"/>

    <!-- MAIN SUBJECT: A kind man feeding a stray cat -->
    <!-- Man's Body & Torso (Friendly blue jacket, warm yellow scarf) -->
    <path d="M95 140c-5 10-15 20-25 30l-10 30h40l5-35 25 35h35l-15-40c-10-15-20-25-25-30h-30z" fill="#38bdf8"/>
    <!-- Jacket collar / detail -->
    <path d="M100 135l15 15 15-15z" fill="#0284c7"/>

    <!-- Warm Scarf representing warmth and kindness -->
    <path d="M100 120c10-5 20-5 30 0l5 15c-10 5-20 5-30 0z" fill="#ef4444"/>
    <path d="M115 130v35l-10 10v-40z" fill="#dc2626"/>

    <!-- Man's Head & Face (Expressive, gentle smile, closed happy eyes) -->
    <circle cx="115" cy="95" r="22" fill="#ffd59e"/>
    <!-- Hair -->
    <path d="M95 95c0-15 10-25 25-25 12 0 22 8 24 20-5-5-12-8-20-8-10 0-18 5-29 13z" fill="#334155"/>
    
    <!-- Gentle expression (Closed happy eyes, smiling mouth, rosy cheeks) -->
    <path d="M104 92c2-2 5-2 7 0" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M119 92c2-2 5-2 7 0" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="107" cy="97" r="4" fill="#fda4af" opacity="0.6"/>
    <circle cx="123" cy="97" r="4" fill="#fda4af" opacity="0.6"/>
    <path d="M112 103c2 2 4 2 6 0" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>

    <!-- Man's Arms reaching down kindly -->
    <!-- Left arm holding saucer -->
    <path d="M95 140l-25 15 5 10 20-10z" fill="#0284c7"/>
    <!-- Right arm bent gently -->
    <path d="M135 140l15 15-10 15-10-10z" fill="#38bdf8"/>

    <!-- Hand holding small food bowl / saucer on the ground level -->
    <ellipse cx="65" cy="170" rx="12" ry="5" fill="#cbd5e1"/>
    <ellipse cx="65" cy="168" rx="10" ry="4" fill="#f8fafc"/>
    <circle cx="63" cy="167" r="4" fill="#b45309"/> <!-- Food pellets -->
    <circle cx="67" cy="168" r="3" fill="#b45309"/>

    <!-- The Stray Cat (Grateful, eating happily) -->
    <!-- Cat Body -->
    <ellipse cx="90" cy="180" rx="16" ry="12" fill="url(#catGrad)"/>
    <!-- Cat Head -->
    <circle cx="78" cy="172" r="12" fill="url(#catGrad)"/>
    <!-- Cat Ears -->
    <path d="M70 162l-4-9 8 3z" fill="#ea580c"/>
    <path d="M84 160l4-9-8 3z" fill="#ea580c"/>
    <!-- Cat Tail curving up happily -->
    <path d="M106 182c10 0 15-10 10-20" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
    <!-- Cat Face (Happy eating eyes) -->
    <path d="M73 172c1-1.5 2.5-1.5 3.5 0" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
    <path d="M81 172c1-1.5 2.5-1.5 3.5 0" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
    <!-- Cat Whiskers & Little Nose -->
    <path d="M72 176h-6M72 179h-5" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M85 176h6M85 179h5" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="78,175 76,173 80,173" fill="#7c2d12"/>

    <!-- Floating subtle hearts/sparkles representing warmth and kindness -->
    <path d="M125 75c-3-3-8 0-4 4 4 4 4 4 4 4s0 0 4-4c4-4-1-7-4-4z" fill="#f43f5e" opacity="0.8"/>
    <path d="M140 60c-2-2-5 0-2 2 2 2 2 2 2 2s0 0 2-2c2-2-0.5-3.5-2-2z" fill="#fb7185" opacity="0.6"/>
    <circle cx="100" cy="65" r="2" fill="#fef08a" opacity="0.9"/>
    <circle cx="135" cy="88" r="1.5" fill="#fef08a" opacity="0.7"/>

    <!-- Foreground floor line -->
    <path d="M0 200h240" stroke="#334155" stroke-width="3"/>
    <rect x="0" y="203" width="240" height="37" fill="#0f172a"/>
  </g>
</svg>