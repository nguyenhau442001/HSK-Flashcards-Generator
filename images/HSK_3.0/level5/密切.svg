<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </linearGradient>
    <clipPath id="sceneClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <!-- Full-bleed container background -->
  <g clip-path="url(#sceneClip)">
    <rect width="240" height="240" fill="url(#bgGrad)" />

    <!-- Ambient background glows & window light -->
    <polygon points="110,0 200,0 240,160 50,160" fill="url(#glowGrad)" />
    <circle cx="120" cy="90" r="70" fill="url(#warmLight)" />

    <!-- Office / Study Background Interior -->
    <!-- Window with vertical and horizontal frames -->
    <rect x="75" y="25" width="90" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <line x1="120" y1="25" x2="120" y2="100" stroke="#334155" stroke-width="2" />
    <line x1="75" y1="62" x2="165" y2="62" stroke="#334155" stroke-width="2" />
    
    <!-- Bookshelf in background -->
    <rect x="25" y="30" width="35" height="90" fill="#1e293b" />
    <line x1="25" y1="55" x2="60" y2="55" stroke="#334155" stroke-width="2" />
    <line x1="25" y1="80" x2="60" y2="80" stroke="#334155" stroke-width="2" />
    <line x1="25" y1="105" x2="60" y2="105" stroke="#334155" stroke-width="2" />
    <!-- Mini books -->
    <rect x="30" y="42" width="6" height="13" fill="#38bdf8" rx="1" />
    <rect x="38" y="40" width="8" height="15" fill="#fb923c" rx="1" />
    <rect x="48" y="44" width="5" height="11" fill="#10b981" rx="1" />
    <rect x="30" y="67" width="7" height="13" fill="#ec4899" rx="1" />
    <rect x="39" y="65" width="5" height="15" fill="#fbbf24" rx="1" />

    <!-- Potted plant on shelf -->
    <path d="M190,95 Q185,85 195,80 Q205,85 200,95 Z" fill="#10b981" />
    <path d="M192,88 Q198,75 208,82" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M198,90 Q193,73 186,78" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M192,95 h16 l-3,10 h-10 z" fill="#fb923c" />

    <!-- Desk Surface -->
    <path d="M10,170 L230,170 L220,220 L20,220 Z" fill="url(#deskGrad)" />
    <!-- Desk front edge highlight -->
    <rect x="10" y="170" width="220" height="4" fill="#64748b" />

    <!-- Desk Props: Laptop, blueprints/documents, mug -->
    <!-- Laptop Base -->
    <polygon points="85,160 155,160 165,172 75,172" fill="#cbd5e1" />
    <!-- Laptop Screen -->
    <polygon points="90,125 150,125 155,160 85,160" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <!-- Screen code/ui lines -->
    <line x1="98" y1="135" x2="120" y2="135" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="98" y1="143" x2="135" y2="143" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="98" y1="151" x2="112" y2="151" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

    <!-- Coffee Mug -->
    <rect x="165" y="152" width="14" height="18" rx="2" fill="#f43f5e" />
    <path d="M179,156 c4,0 4,6 0,6" fill="none" stroke="#f43f5e" stroke-width="2" />

    <!-- Documents / Blueprint overlapping -->
    <polygon points="50,165 85,158 90,175 55,182" fill="#f8fafc" />
    <line x1="58" y1="168" x2="75" y2="165" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="60" y1="173" x2="80" y2="170" stroke="#94a3b8" stroke-width="1.5" />

    <!-- MAIN CHARACTERS: Depicting close relationship/teamwork ("我们的关系很密切") -->
    
    <!-- Character 1 (Left - Woman pointing closely/collaborating) -->
    <g id="character-left">
      <!-- Body/Torso -->
      <path d="M70,185 L95,145 L115,160 L105,210 L70,210 Z" fill="#38bdf8" />
      <!-- Arm resting/pointing -->
      <path d="M90,150 Q110,155 125,145" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
      <!-- Hand -->
      <circle cx="127" cy="144" r="5" fill="#fbcfe8" />
      
      <!-- Neck & Head -->
      <rect x="92" y="130" width="8" height="18" fill="#fbcfe8" />
      <!-- Hair -->
      <path d="M88,132 Q96,118 108,125 Q118,130 112,145 Z" fill="#1e293b" />
      <circle cx="96" cy="135" r="10" fill="#1e293b" />
      <!-- Face profile -->
      <circle cx="98" cy="137" r="5" fill="#fbcfe8" />
      <!-- Ear -->
      <circle cx="104" cy="137" r="2" fill="#fbcfe8" />
    </g>

    <!-- Character 2 (Right - Man leaning in closely, smiling, hand on chin/collaborating) -->
    <g id="character-right">
      <!-- Body/Torso -->
      <path d="M170,185 L145,145 L125,160 L135,210 L175,210 Z" fill="#ec4899" />
      <!-- Arm leaning on desk -->
      <path d="M140,155 Q125,165 110,165" fill="none" stroke="#ec4899" stroke-width="12" stroke-linecap="round" />
      <!-- Hand -->
      <circle cx="108" cy="166" r="5" fill="#fbcfe8" />

      <!-- Neck & Head (Leaning forward toward Character 1) -->
      <rect x="138" y="128" width="8" height="18" fill="#fbcfe8" />
      <!-- Hair -->
      <path d="M132,122 Q144,115 152,128 Q156,138 145,140 Z" fill="#0f172a" />
      <circle cx="142" cy="132" r="10" fill="#0f172a" />
      <!-- Face profile -->
      <circle cx="140" cy="134" r="5" fill="#fbcfe8" />
      <!-- Ear -->
      <circle cx="134" cy="135" r="2" fill="#fbcfe8" />
    </g>

    <!-- Foreground Atmosphere / Heart / Bond Spark (Subtle indicator of close connection without text) -->
    <g transform="translate(120, 105)">
      <!-- Glowing connection aura between them -->
      <circle cx="0" cy="0" r="18" fill="#ec4899" opacity="0.15" />
      <!-- Floating friendly connection elements -->
      <path d="M0,-6 C-5,-13 -14,-7 -4,2 C0,6 0,6 0,6 C0,6 0,6 4,2 C14,-7 5,-13 0,-6 Z" fill="#fb7185" transform="scale(0.8)" />
    </g>

    <!-- Additional Ambient Lighting / Vignette overlay -->
    <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
  </g>
</svg>