<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Museum Pedestal Gradient -->
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glass Case Glow -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Golden Artifact Gradient -->
    <linearGradient id="artifactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Red Warning Sign Glow / Gradient -->
    <linearGradient id="signGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Hand Gradient (Warm Skin Tone) -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    
    <!-- Spotlight Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Museum Interior Elements -->
  <path d="M 0 180 L 240 180" stroke="#334155" stroke-width="2" opacity="0.5"/>
  <rect x="30" y="40" width="40" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="170" y="40" width="40" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="50" cy="75" r="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="190" cy="75" r="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Museum Spotlight Cone -->
  <polygon points="120,0 60,180 180,180" fill="#38bdf8" opacity="0.04"/>

  <!-- Museum Pedestal Base -->
  <path d="M 70 190 L 170 190 L 160 215 L 80 215 Z" fill="url(#pedestalGrad)"/>
  <rect x="70" y="185" width="100" height="8" rx="2" fill="#64748b"/>

  <!-- Glass Display Case (Bottom & Pillars) -->
  <rect x="90" y="110" width="60" height="75" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="90" y1="110" x2="90" y2="185" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="150" y1="110" x2="150" y2="185" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Ancient Artifact (Golden Cat/Statue) inside the case -->
  <g transform="translate(120, 135)">
    <!-- Artifact Glow -->
    <circle cx="0" cy="15" r="18" fill="#fbbf24" opacity="0.3" filter="url(#glow)"/>
    <!-- Artifact Body -->
    <ellipse cx="0" cy="20" rx="12" ry="15" fill="url(#artifactGrad)"/>
    <!-- Artifact Head -->
    <circle cx="0" cy="2" r="10" fill="url(#artifactGrad)"/>
    <!-- Artifact Ears -->
    <polygon points="-8,-4 -12,-12 -4,-7" fill="url(#artifactGrad)"/>
    <polygon points="8,-4 12,-12 4,-7" fill="url(#artifactGrad)"/>
    <!-- Artifact Details -->
    <path d="M -3 10 Q 0 14 3 10" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="-3" cy="2" r="1.5" fill="#78350f"/>
    <circle cx="3" cy="2" r="1.5" fill="#78350f"/>
  </g>

  <!-- Glass Case Top -->
  <polygon points="90,110 100,100 140,100 150,110" fill="#38bdf8" opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Glass Reflection Highlights -->
  <path d="M 98 120 L 110 155" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 104 116 L 108 128" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Barrier Rope / Stand representing "Do Not Touch" context -->
  <path d="M 25 210 L 45 170" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <circle cx="25" cy="210" r="5" fill="#fbbf24"/>
  <path d="M 215 210 L 195 170" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <circle cx="215" cy="210" r="5" fill="#fbbf24"/>
  <path d="M 45 170 Q 120 190 195 170" stroke="#ef4444" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Warning Sign (Prohibition / Do Not Touch Rule) -->
  <g transform="translate(120, 195)">
    <!-- Sign Board -->
    <rect x="-14" y="-9" width="28" height="18" rx="3" fill="url(#signGrad)" stroke="#fee2e2" stroke-width="1"/>
    <!-- Hand icon crossed out inside the sign (Abstract forbidden touch symbol) -->
    <circle cx="0" cy="0" r="6" fill="#fee2e2"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="#dc2626" stroke-width="2"/>
  </g>

  <!-- ACTION ELEMENT: The Hand "Touching" / Violating the Rule -->
  <!-- Action Motion Lines radiating from glass -->
  <path d="M 145 125 Q 155 120 162 115" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <path d="M 148 135 Q 160 132 168 130" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>

  <!-- Reaching Human Hand breaking into the space -->
  <g transform="translate(185, 115) rotate(-25)">
    <!-- Arm / Sleeve -->
    <path d="M 30 40 L 70 20 L 80 40 L 40 60 Z" fill="#6366f1"/>
    <!-- Palm -->
    <path d="M 10 20 C 10 10, 25 10, 30 25 C 35 15, 45 20, 45 30 C 45 40, 30 50, 15 40 Z" fill="url(#handGrad)"/>
    <!-- Extended Index Finger pointing/touching the glass -->
    <path d="M 5 18 C 0 16, -10 18, -12 21 C -14 24, -10 27, -2 26 Z" fill="url(#handGrad)"/>
    <!-- Other curled fingers -->
    <path d="M 15 38 C 10 42, 15 48, 22 46 C 28 44, 30 40, 25 35 Z" fill="url(#handGrad)" opacity="0.9"/>
    <path d="M 25 42 C 22 48, 28 52, 35 48 C 40 45, 40 40, 35 36 Z" fill="url(#handGrad)" opacity="0.8"/>
  </g>

  <!-- Ripple/Contact Effect on Glass (Indicates 'Mō' / Touch action point) -->
  <ellipse cx="148" cy="130" rx="4" ry="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <ellipse cx="148" cy="130" rx="8" ry="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
</svg>