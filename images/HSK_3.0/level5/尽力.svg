<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Background Environment & Interior Details -->
  <!-- Warm ambient light from study lamp casting glow on wall -->
  <circle cx="160" cy="110" r="70" fill="#38bdf8" opacity="0.08"/>
  <circle cx="90" cy="130" r="60" fill="#f59e0b" opacity="0.06"/>

  <!-- Bookshelf & Books in Background -->
  <rect x="25" y="80" width="50" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Shelves -->
  <line x1="25" y1="110" x2="75" y2="110" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="145" x2="75" y2="145" stroke="#334155" stroke-width="1.5"/>
  <!-- Books -->
  <rect x="30" y="90" width="8" height="20" rx="1" fill="#ec4899" opacity="0.7"/>
  <rect x="40" y="87" width="12" height="23" rx="1" fill="#38bdf8" opacity="0.7"/>
  <rect x="54" y="92" width="7" height="18" rx="1" fill="#f59e0b" opacity="0.7"/>
  <rect x="30" y="122" width="10" height="23" rx="1" fill="#10b981" opacity="0.7"/>
  <rect x="43" y="125" width="14" height="20" rx="1" fill="#8b5cf6" opacity="0.7"/>

  <!-- Study Desk -->
  <path d="M15 185 L225 185 L215 165 L25 165 Z" fill="#334155"/>
  <rect x="15" y="185" width="210" height="8" rx="2" fill="#475569"/>

  <!-- Desk Props (Laptop, Lamp, Notes) -->
  <!-- Laptop base -->
  <path d="M140 165 L200 165 L210 178 L130 178 Z" fill="#64748b"/>
  <!-- Laptop screen -->
  <path d="M145 130 L195 130 L200 165 L140 165 Z" fill="#475569"/>
  <path d="M148 133 L192 133 L196 162 L144 162 Z" fill="#0f172a"/>
  <!-- Screen glow graphic -->
  <rect x="152" y="138" width="25" height="4" rx="1" fill="#38bdf8" opacity="0.8"/>
  <rect x="152" y="146" width="35" height="3" rx="1" fill="#94a3b8" opacity="0.5"/>
  <rect x="152" y="152" width="20" height="3" rx="1" fill="#94a3b8" opacity="0.5"/>

  <!-- Desk Lamp -->
  <path d="M190 165 L196 165 L193 115 Z" fill="#64748b"/>
  <path d="M185 115 C185 105, 201 105, 201 115 Z" fill="#f59e0b"/>
  <path d="M180 112 L206 112 L201 103 L185 103 Z" fill="#fbbf24"/>
  <!-- Lamp light beam cone -->
  <path d="M183 115 L120 185 L210 185 Z" fill="#fbbf24" opacity="0.1"/>

  <!-- Stack of notes/papers needing help with -->
  <rect x="100" y="160" width="30" height="8" rx="1" fill="#f8fafc" transform="rotate(-5 100 160)"/>
  <rect x="102" y="154" width="28" height="8" rx="1" fill="#e2e8f0"/>

  <!-- Character 1: Person receiving help (Stressed / Overwhelmed student or colleague) -->
  <!-- Body/Torso -->
  <path d="M70 170 C70 150, 95 150, 95 170 L105 210 L60 210 Z" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="82" cy="128" r="16" fill="#fde047"/>
  <!-- Hair (Messy, stressed style) -->
  <path d="M66 126 C66 114, 76 110, 84 110 C93 110, 99 118, 98 128 C96 122, 90 116, 82 116 C74 116, 68 122, 66 126 Z" fill="#334155"/>
  <!-- Worried facial expression -->
  <circle cx="77" cy="127" r="1.5" fill="#1e293b"/>
  <circle cx="87" cy="127" r="1.5" fill="#1e293b"/>
  <!-- Worried angled eyebrows -->
  <line x1="74" y1="123" x2="80" y2="125" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="84" y1="125" x2="90" y2="123" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nervous mouth -->
  <path d="M80 135 Q82 133, 84 135" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sweat drop indicating stress -->
  <path d="M93 120 C93 120, 96 125, 96 127 C96 129, 94 130, 93 130 C91 130, 90 129, 90 127 C90 125, 93 120, 93 120 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Hands of Character 1 holding head in worry -->
  <circle cx="70" cy="133" r="4" fill="#fde047"/>
  <circle cx="94" cy="133" r="4" fill="#fde047"/>


  <!-- Character 2: The helper ("Hết sức giúp đỡ" / I will do my best to help you) -->
  <!-- Confident, warm, supportive posture leaning in -->
  <!-- Body/Torso -->
  <path d="M125 170 C125 145, 155 145, 155 170 L165 215 L115 215 Z" fill="#10b981"/>
  <!-- Head -->
  <circle cx="140" cy="122" r="17" fill="#fde047"/>
  <!-- Hair (Neat, friendly) -->
  <path d="M123 120 C123 108, 133 104, 142 104 C153 104, 158 112, 157 122 C155 116, 148 110, 140 110 C132 110, 126 114, 123 120 Z" fill="#1e293b"/>
  <!-- Encouraging facial expression -->
  <!-- Smiling eyes -->
  <path d="M133 121 Q136 118, 139 121" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M143 121 Q146 118, 149 121" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Confident warm smile -->
  <path d="M136 129 Q140 134, 144 129" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arm reaching out energetically to point at or support the task ("盡力" - putting heart into helping) -->
  <path d="M145 155 C120 155, 105 150, 90 145" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
  <!-- Supportive Hand pointing/resting helpfully on the desk/paper -->
  <circle cx="88" cy="145" r="5" fill="#fde047"/>

  <!-- Floating supportive elements representing "doing one's best / full effort" -->
  <!-- Glowing stars/sparkles representing sincere commitment -->
  <g fill="#fbbf24" transform="translate(110, 90)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"/>
  </g>
  <g fill="#38bdf8" transform="translate(130, 80) scale(0.7)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"/>
  </g>
  <g fill="#10b981" transform="translate(95, 95) scale(0.5)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"/>
  </g>

  <!-- Heart icon subtly integrated to symbolize genuine care and utmost effort in helping -->
  <path d="M140 85 C140 80, 147 80, 147 87 C147 93, 140 97, 140 97 C140 97, 133 93, 133 87 C133 80, 140 80, 140 85 Z" fill="#ec4899" opacity="0.9" transform="translate(10, 0) scale(0.8)"/>
</svg>