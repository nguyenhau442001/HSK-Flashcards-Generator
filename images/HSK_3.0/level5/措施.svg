<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tool Gradients -->
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="clipboardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#grid)" />

  <!-- Ambient Light Effect behind central action -->
  <circle cx="120" cy="120" r="80" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="120" cy="120" r="40" fill="#fbbf24" opacity="0.1" filter="url(#glow)" />

  <!-- Scene Elements: Environment / Desk Surface -->
  <path d="M 30 195 L 210 195 L 225 220 L 15 220 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <ellipse cx="120" cy="195" rx="90" ry="8" fill="#1e293b" />

  <!-- Context Prop 1: Strategy Blueprint / Clipboard (Background) -->
  <g transform="translate(60, 45) rotate(-12)">
    <!-- Clipboard Body -->
    <rect x="0" y="0" width="70" height="90" rx="6" fill="url(#clipboardGrad)" stroke="#64748b" stroke-width="1.5" />
    <!-- Clip -->
    <rect x="22" y="-5" width="26" height="10" rx="3" fill="#475569" />
    <!-- Checklist lines (action steps representation) -->
    <rect x="12" y="18" width="10" height="10" rx="2" fill="#10b981" />
    <path d="M 15 23 L 18 26 L 25 19" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="28" y="20" width="30" height="6" rx="3" fill="#94a3b8" />
    
    <rect x="12" y="38" width="10" height="10" rx="2" fill="#10b981" />
    <path d="M 15 43 L 18 46 L 25 39" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="28" y="40" width="25" height="6" rx="3" fill="#94a3b8" />

    <rect x="12" y="58" width="10" height="10" rx="2" fill="#38bdf8" />
    <rect x="28" y="60" width="20" height="6" rx="3" fill="#cbd5e1" />
  </g>

  <!-- Context Prop 2: Complex System Gears (Action & Mechanism) -->
  <g transform="translate(165, 80)">
    <!-- Large Gear -->
    <circle cx="0" cy="0" r="22" fill="url(#gearGrad)" filter="url(#subtleGlow)" />
    <!-- Gear teeth representation -->
    <path d="M -6 -24 L 6 -24 L 5 -20 L -5 -20 Z M 20 -6 L 24 6 L 20 5 L 20 -5 Z M -20 -6 L -24 6 L -20 5 L -20 -5 Z M -6 24 L 6 24 L 5 20 L -5 20 Z" fill="#f43f5e" />
    <circle cx="0" cy="0" r="10" fill="#0f172a" />
  </g>
  
  <g transform="translate(45, 150) scale(0.7)">
    <!-- Secondary Gear -->
    <circle cx="0" cy="0" r="20" fill="#475569" />
    <circle cx="0" cy="0" r="8" fill="#1e293b" />
  </g>

  <!-- MAIN SUBJECT: The Action/Solution Concept (Precision Wrench tightening a glowing Shield/System) -->
  
  <!-- Central Shield (Represents Protection / Successful Measure Applied) -->
  <g transform="translate(120, 115)" filter="url(#glow)">
    <path d="M 0 -38 L 28 -20 L 28 10 C 28 28 15 38 0 46 C -15 38 -28 28 -28 10 L -28 -20 Z" 
          fill="url(#shieldGrad)" stroke="#e0f2fe" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Inner Checkmark symbol embedded in shield -->
    <path d="M -9 2 L -3 8 L 11 -6" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Action Wrench (Dynamic 'Measure' implementation tool) crossing the scene -->
  <g transform="translate(120, 115) rotate(-35)">
    <!-- Wrench Tool Graphic -->
    <path d="M -45 -12 
             C -55 -22 -70 -7 -60 3 
             L -35 28 
             C -30 33 -20 33 -15 28 
             L -10 23 
             L 25 58 C 30 63 38 63 43 58 L 52 49 C 57 44 57 36 52 31 L 17 -4 L 12 -9 
             C 7 -14 7 -22 12 -27 
             L 32 -47 C 42 -57 27 -72 17 -62 
             L -3 -42 
             Z" 
          fill="url(#wrenchGrad)" stroke="#b45309" stroke-width="2" stroke-linejoin="round" filter="url(#subtleGlow)" />
          
    <!-- Wrench Detail Highlights -->
    <line x1="-42" y1="-5" x2="-22" y2="15" stroke="#fff" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" />
    <circle cx="-52" cy="-5" r="4" fill="#fef3c7" opacity="0.6" />
  </g>

  <!-- Dynamic Sparks / Success Particles (Action effects) -->
  <g>
    <!-- Spark 1 -->
    <path d="M 120 60 L 123 68 L 131 71 L 123 74 L 120 82 L 117 74 L 109 71 L 117 68 Z" fill="#fbbf24" filter="url(#subtleGlow)" />
    <!-- Spark 2 -->
    <path d="M 75 105 L 77 110 L 82 112 L 77 114 L 75 119 L 73 114 L 68 112 L 73 110 Z" fill="#38bdf8" transform="scale(0.8) translate(20, 20)" />
    <!-- Spark 3 -->
    <circle cx="165" cy="140" r="3" fill="#10b981" filter="url(#subtleGlow)" />
    <circle cx="75" cy="85" r="2.5" fill="#f43f5e" />
    <circle cx="150" cy="55" r="2" fill="#fbbf24" />
  </g>

  <!-- Foreground Atmospheric Elements / Depth Vignette -->
  <path d="M 0 0 L 240 0 L 240 240 L 0 240 Z" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.15" />
</svg>