<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="180" width="200" height="60" fill="#334155" rx="4"/>
  
  <!-- Tea Kettle -->
  <path d="M120 180 C 100 180, 90 160, 90 140 C 90 120, 110 100, 140 100 C 170 100, 190 120, 190 140 C 190 160, 180 180, 160 180" fill="#fb923c"/>
  <path d="M140 100 L 140 85 L 160 85" stroke="#fb923c" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M180 130 L 210 110 L 200 140 Z" fill="#fb923c"/>
  
  <!-- Steam (The "Boiling" indicator) -->
  <path d="M140 90 Q 150 70, 140 50" stroke="#f1f5f9" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M150 90 Q 160 70, 155 50" stroke="#f1f5f9" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Tea Set -->
  <circle cx="60" cy="190" r="25" fill="#ec4899"/>
  <rect x="50" y="165" width="20" height="10" fill="#ec4899" rx="2"/>
  <path d="M85 190 L 100 190" stroke="#ec4899" stroke-width="4" fill="none"/>
  
  <!-- Character Hand -->
  <path d="M40 140 Q 30 120, 50 110 L 70 130" fill="#fcd34d"/>
  <circle cx="75" cy="125" r="8" fill="#fcd34d"/>
  
  <!-- Background Window/Atmosphere -->
