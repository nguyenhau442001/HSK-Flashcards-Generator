<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="warmGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- UI Tag Background Gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <circle cx="120" cy="110" r="100" fill="url(#warmGlow)" />

  <!-- Shop Window / Interior Scene Background Elements -->
  <!-- Ambient light rays/shelves -->
  <rect x="25" y="40" width="190" height="12" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="35" y="90" width="170" height="10" rx="3" fill="#334155" opacity="0.4"/>
  <rect x="25" y="150" width="190" height="10" rx="3" fill="#334155" opacity="0.4"/>

  <!-- Decorative Shop Items (Background) -->
  <circle cx="60" cy="70" r="12" fill="#fb923c" opacity="0.8"/>
  <rect x="90" y="58" width="20" height="24" rx="4" fill="#ec4899" opacity="0.8"/>
  <path d="M 160 72 L 175 52 L 190 72 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- COUNTER / DESK -->
  <path d="M 20 185 L 220 185 L 210 215 L 30 215 Z" fill="#0f172a" filter="url(#shadow)"/>
  <rect x="20" y="175" width="200" height="14" rx="3" fill="#334155"/>
  <rect x="30" y="189" width="180" height="26" fill="#1e293b"/>

  <!-- CASH REGISTER / STORE SETUP -->
  <path d="M 180 145 L 205 145 L 210 175 L 175 175 Z" fill="#475569" />
  <rect x="183" y="150" width="20" height="12" rx="2" fill="#38bdf8" opacity="0.7"/>
  <rect x="180" y="175" width="30" height="4" rx="1" fill="#64748b"/>

  <!-- PRODUCT A: THE EXPENSIVE ITEM (Left, tall modern gadget/lamp) -->
  <g transform="translate(55, 110)">
    <!-- Base -->
    <ellipse cx="20" cy="65" rx="18" ry="6" fill="#475569" />
    <rect x="17" y="30" width="6" height="35" fill="#64748b" />
    <!-- Lamp head/Shade -->
    <path d="M 5 28 L 35 28 L 28 8 L 12 8 Z" fill="#ec4899" />
    <circle cx="20" cy="18" r="4" fill="#fef08a" />
    <!-- Price Tag (Expensive) -->
    <g transform="translate(-15, 35) rotate(-15)">
      <rect x="0" y="0" width="32" height="18" rx="4" fill="#ef4444" filter="url(#shadow)"/>
      <circle cx="6" cy="9" r="2" fill="#ffffff"/>
      <!-- Abstract high price lines -->
      <rect x="11" y="6" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>
      <rect x="11" y="11" width="12" height="2" rx="1" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- PRODUCT B: THE RELATIVELY CHEAPER ITEM (Center-Right, cute modern plant/lamp) -->
  <g transform="translate(110, 115)" filter="url(#shadow)">
    <!-- Pot -->
    <path d="M 8 45 L 28 45 L 24 68 L 12 68 Z" fill="#38bdf8" />
    <ellipse cx="18" cy="45" rx="10" ry="3" fill="#bae6fd" />
    <!-- Plant foliage / Glowing bulb -->
    <circle cx="18" cy="28" r="16" fill="url(#accentGrad)" />
    <circle cx="14" cy="24" r="5" fill="#ffffff" opacity="0.3" />
    
    <!-- Price Tag (Relatively Cheaper, Green / Highlighted) -->
    <g transform="translate(18, 25) rotate(10)">
      <rect x="0" y="0" width="30" height="18" rx="4" fill="#10b981" filter="url(#shadow)"/>
      <circle cx="5" cy="9" r="2" fill="#ffffff"/>
      <!-- Lower price lines -->
      <rect x="10" y="7" width="14" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- SHOPPER / CUSTOMER CHARACTER (Right side, gesturing towards the cheaper item) -->
  <g transform="translate(145, 75)">
    <!-- Body / Torso -->
    <path d="M 30 75 Q 30 55 42 50 L 58 50 Q 70 55 70 75 L 75 110 L 25 110 Z" fill="#f59e0b" />
    <!-- Collar / Details -->
    <path d="M 42 50 L 50 62 L 58 50 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Head -->
    <circle cx="50" cy="30" r="18" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 32 30 Q 32 12 50 12 Q 68 12 68 30 Q 64 22 50 20 Q 36 22 32 30 Z" fill="#451a03" />
    
    <!-- Facial Features (Friendly, satisfied expression) -->
    <circle cx="44" cy="28" r="2" fill="#1e293b"/>
    <circle cx="56" cy="28" r="2" fill="#1e293b"/>
    <!-- Smiling mouth -->
    <path d="M 47 35 Q 50 39 53 35" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Pointing / Gesturing Arm (Highlighting the cheaper option) -->
    <path d="M 30 60 Q 15 65 5 55" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="3" cy="53" r="5" fill="#fcd34d" />

    <!-- Resting Arm -->
    <path d="M 66 65 Q 75 75 70 90" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <circle cx="70" cy="92" r="4" fill="#fcd34d" />
  </g>

  <!-- STORE CLERK CHARACTER (Left side, behind counter, welcoming) -->
  <g transform="translate(15, 80)">
    <!-- Torso -->
    <path d="M 15 70 L 35 70 L 40 110 L 10 110 Z" fill="#334155" />
    <rect x="20" y="70" width="10" height="40" fill="#ffffff" opacity="0.9"/> <!-- Apron -->

    <!-- Head -->
    <circle cx="25" cy="35" r="16" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 11 35 Q 11 18 25 18 Q 39 18 39 35 Q 34 26 25 25 Q 16 26 11 35 Z" fill="#1e293b" />
    
    <!-- Eyes & Smile -->
    <circle cx="21" cy="33" r="1.5" fill="#1e293b"/>
    <circle cx="29" cy="33" r="1.5" fill="#1e293b"/>
    <path d="M 23 39 Q 25 42 27 39" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Clerk Arm gesturing to items -->
    <path d="M 32 65 Q 42 60 48 70" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <circle cx="49" cy="72" r="4" fill="#fcd34d" />
  </g>

  <!-- UI FLOATING COMPARISON BADGE (Visualizing "Relatively Cheaper / Better Value") -->
  <g transform="translate(100, 32)" filter="url(#shadow)">
    <rect x="0" y="0" width="40" height="24" rx="12" fill="url(#tagGrad)" />
    <!-- Up/Down or Value Arrow Graphic -->
    <path d="M 14 16 L 20 8 L 26 16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="8" r="2" fill="#ffffff"/>
  </g>

</svg>