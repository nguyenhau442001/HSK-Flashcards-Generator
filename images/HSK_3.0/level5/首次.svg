<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Stadium Background Elements -->
  <path d="M0 160 Q120 120 240 160 L240 240 L0 240 Z" fill="#1e293b" opacity="0.5"/>
  <circle cx="120" cy="180" r="100" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Spotlight Glow -->
  <ellipse cx="120" cy="120" rx="80" ry="40" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Athlete Character -->
  <g transform="translate(120, 140)">
    <!-- Legs -->
    <rect x="-15" y="0" width="8" height="40" rx="4" fill="#38bdf8"/>
    <rect x="7" y="0" width="8" height="40" rx="4" fill="#38bdf8"/>
    <!-- Jersey -->
    <path d="M-20 -40 L20 -40 L15 0 L-15 0 Z" fill="#fb923c"/>
    <!-- Arms -->
    <path d="M-20 -35 L-35 -10" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 -35 L35 -10" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-55" r="15" fill="#fde68a"/>
    <!-- National Emblem Detail -->
    <circle cx="0" cy="-20" r="5" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Stadium Lights -->
  <rect x="20" y="20" width="10" height="40" fill="#475569"/>
  <circle cx="25" cy="20" r="12" fill="#fef3c7" opacity="0.6"/>
  <rect x="210" y="20" width="10" height="40" fill="#475569"/>
  <circle cx="215" cy="20" r="12" fill="#fef3c7" opacity="0.6"/>
  
  <!-- Decorative Sparkles/Atmosphere -->
  <circle cx="180" cy="80" r="2" fill="#10b981"/>
  <circle cx="60" cy="90" r="3" fill="#ec4899"/>
  <circle cx="150" cy="50" r="2" fill="#38bdf8"/>
</svg>