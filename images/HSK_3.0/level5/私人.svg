<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Amber Light for Item -->
    <radialGradient id="itemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment (Office/Study Desk setting) -->
  <g id="environment">
    <!-- Back wall shelf/lines -->
    <path d="M40 70 L200 70" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <rect x="50" y="50" width="24" height="20" rx="2" fill="#475569" opacity="0.6"/>
    <rect x="78" y="45" width="16" height="25" rx="2" fill="#0ea5e9" opacity="0.6"/>
    <rect x="160" y="55" width="30" height="15" rx="2" fill="#10b981" opacity="0.5"/>

    <!-- Desk Surface -->
    <path d="M20 185 L220 185 L210 215 L30 215 Z" fill="#090d16" filter="url(#shadow)"/>
    <path d="M20 185 L220 185" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Desk Lamp on Side -->
    <path d="M190 185 L190 130 L205 120" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M195 115 L215 128 L205 138 Z" fill="#fbbf24"/>
    <ellipse cx="205" cy="140" rx="8" ry="3" fill="#f59e0b" opacity="0.5"/>
  </g>

  <!-- Character (Man presenting/pointing at the private item) -->
  <g id="character" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M50 185 C50 155 70 145 95 145 C120 145 140 155 140 185 Z" fill="#3b82f6"/>
    <path d="M80 145 L85 185 L110 185 L110 145 Z" fill="#2563eb"/> <!-- Shirt Placket -->
    <path d="M85 145 L95 160 L105 145 Z" fill="#e2e8f0"/> <!-- Collar -->

    <!-- Head & Neck -->
    <path d="M90 135 L100 135 L100 148 L90 148 Z" fill="#fbcfe8"/>
    <circle cx="95" cy="115" r="18" fill="#fbcfe8"/>
    
    <!-- Hair -->
    <path d="M77 115 C77 100 90 95 105 102 C113 105 113 115 113 115 C113 115 105 107 97 107 C89 107 80 112 77 115 Z" fill="#1e293b"/>

    <!-- Facial Expression (Friendly, pointing out) -->
    <circle cx="102" cy="113" r="2" fill="#1e293b"/> <!-- Eye -->
    <path d="M98 123 Q103 127 108 123" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Smile -->

    <!-- Gesturing Arm (Pointing at the box) -->
    <path d="M125 155 L155 140" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="158" cy="138" r="4" fill="#fbcfe8"/> <!-- Hand pointing -->

    <!-- Back Arm -->
    <path d="M65 155 L55 175" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Central Focus: The "Private Item" (Unlocked Wooden/Leather Box with personal artifacts) -->
  <g id="private-item" filter="url(#shadow)" transform="translate(110, 140)">
    <!-- Golden Glow beneath the item -->
    <circle cx="25" cy="30" r="30" fill="url(#itemGlow)"/>

    <!-- Box Base -->
    <rect x="0" y="15" width="50" height="30" rx="4" fill="#b45309"/>
    <!-- Box Front Panel Shadow -->
    <rect x="0" y="30" width="50" height="15" rx="2" fill="#92400e"/>
    <!-- Metal Clasp -->
    <rect x="22" y="20" width="6" height="8" rx="1" fill="#fbbf24"/>

    <!-- Open Lid -->
    <path d="M0 15 L10 -5 L40 -5 L50 15 Z" fill="#d97706"/>
    <path d="M2 -2 L48 -2" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

    <!-- Contents: Personal items inside (Pocket watch, folded keepsake photo/letter) -->
    <!-- Pocket Watch -->
    <circle cx="18" cy="12" r="7" fill="#fbbf24"/>
    <circle cx="18" cy="12" r="5" fill="#fef3c7"/>
    <path d="M18 5 L18 3" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="18" y1="10" x2="21" y2="12" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Keepsake Photo / Card -->
    <rect x="26" y="5" width="16" height="12" rx="1" fill="#f8fafc" transform="rotate(15 34 11)"/>
    <circle cx="32" cy="9" r="2.5" fill="#38bdf8" transform="rotate(15 34 11)"/>
    <path d="M28 14 Q34 11 39 14" stroke="#64748b" stroke-width="1" fill="none" transform="rotate(15 34 11)"/>

    <!-- Privacy Shield Subtle Motif (Indicating 'Private/Personal') -->
    <g transform="translate(18, -22) scale(0.6)">
      <path d="M12 0 L24 4 C24 14 18 20 12 24 C6 20 0 14 0 4 Z" fill="#10b981" opacity="0.9" filter="url(#shadow)"/>
      <!-- Small keyhole inside shield -->
      <circle cx="12" cy="9" r="2.5" fill="#f0fdf4"/>
      <rect x="11" y="11" width="2" height="6" fill="#f0fdf4"/>
    </g>
  </g>

  <!-- Foreground decorative elements for depth -->
  <circle cx="35" cy="110" r="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="170" cy="80" r="1.5" fill="#f43f5e" opacity="0.5"/>
  <circle cx="215" cy="160" r="2.5" fill="#fbbf24" opacity="0.3"/>
</svg>