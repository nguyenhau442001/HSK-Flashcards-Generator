<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Shop Interior Gradient -->
    <linearGradient id="shopInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Awning Stripe Pattern / Gradient -->
    <linearGradient id="awningRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Warm Glow for Open Sign -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Window Glass Sheen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- SCENE: Shop Exterior / Interior Context -->
  
  <!-- Night Sky & Urban Street Ambient Background -->
  <g id="environment">
    <!-- Sidewalk & Street Base -->
    <rect x="0" y="200" width="240" height="40" fill="#090d16"/>
    <rect x="0" y="194" width="240" height="6" fill="#334155"/>
    
    <!-- Shop Structure Backwall / Interior -->
    <rect x="25" y="70" width="190" height="130" fill="url(#shopInterior)" rx="6"/>

    <!-- Large Display Window (Left) -->
    <rect x="35" y="95" width="75" height="105" fill="#1e293b" stroke="#475569" stroke-width="2" rx="4"/>
    <rect x="40" y="100" width="65" height="95" fill="url(#glassSheen)"/>
    <!-- Inside Display Props (Pastries/Breads on shelves) -->
    <rect x="48" y="130" width="49" height="4" fill="#64748b" rx="2"/>
    <circle cx="60" cy="122" r="8" fill="#fb923c"/>
    <circle cx="85" cy="123" r="7" fill="#d97706"/>
    <rect x="48" y="165" width="49" height="4" fill="#64748b" rx="2"/>
    <ellipse cx="65" cy="158" rx="10" ry="6" fill="#f59e0b"/>
    <ellipse cx="82" cy="159" rx="8" ry="5" fill="#fbbf24"/>

    <!-- Shop Door with Glass (Right) -->
    <rect x="130" y="90" width="75" height="110" fill="#0f172a" stroke="#64748b" stroke-width="2" rx="4"/>
    <rect x="136" y="96" width="63" height="98" fill="url(#glassSheen)"/>
    <!-- Door Handle -->
    <circle cx="188" cy="145" r="3" fill="#cbd5e1"/>

    <!-- OPEN Sign hanging inside the door window -->
    <g transform="translate(148, 110)">
      <rect x="0" y="0" width="27" height="16" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <!-- Glowing dot representing active status -->
      <circle cx="13.5" cy="8" r="5" fill="#34d399" filter="url(#glow)"/>
      <circle cx="13.5" cy="8" r="3.5" fill="#a7f3d0"/>
    </g>
  </g>

  <!-- STOREFRONT AWNING (Visual anchor for "Shop" concept) -->
  <g id="awning">
    <path d="M 15 70 L 225 70 L 210 40 L 30 40 Z" fill="#334155"/>
    <!-- Alternating awning stripes -->
    <path d="M 30 40 L 45 70 L 60 70 L 50 40 Z" fill="url(#awningRed)"/>
    <path d="M 75 40 L 85 70 L 100 70 L 105 40 Z" fill="url(#awningRed)"/>
    <path d="M 120 40 L 125 70 L 140 70 L 150 40 Z" fill="url(#awningRed)"/>
    <path d="M 165 40 L 165 70 L 180 70 L 195 40 Z" fill="url(#awningRed)"/>
    <!-- Awning Scallop Edge -->
    <path d="M 15 70 Q 22.5 78 30 70 Q 37.5 78 45 70 Q 52.5 78 60 70 Q 67.5 78 75 70 Q 82.5 78 90 70 Q 97.5 78 105 70 Q 112.5 78 120 70 Q 127.5 78 135 70 Q 142.5 78 150 70 Q 157.5 78 165 70 Q 172.5 78 180 70 Q 187.5 78 195 70 Q 202.5 78 210 70 L 225 70 L 15 70 Z" fill="#e11d48"/>
  </g>

  <!-- CHARACTERS & ACTION (Daily business / Service interaction) -->
  
  <!-- Friendly Shopkeeper inside, behind counter -->
  <g id="shopkeeper">
    <!-- Body/Apron -->
    <path d="M 108 160 Q 115 140 128 140 L 142 140 Q 155 140 162 160 Z" fill="#ffffff"/>
    <rect x="115" y="145" width="24" height="35" rx="4" fill="#3b82f6"/>
    <!-- Head & Hat -->
    <circle cx="135" cy="120" r="13" fill="#fed7aa"/>
    <!-- Chef / Baker Cap -->
    <ellipse cx="135" cy="110" rx="12" ry="7" fill="#ffffff"/>
    <rect x="123" y="112" width="24" height="6" fill="#e2e8f0" rx="2"/>
    <!-- Smile & Eyes -->
    <path d="M 131 122 Q 135 125 139 122" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="131" cy="118" r="1.5" fill="#1e293b"/>
    <circle cx="139" cy="118" r="1.5" fill="#1e293b"/>
    <!-- Waving Arm -->
    <path d="M 120 145 C 110 140 105 130 110 125" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Customer approaching the store daily -->
  <g id="customer">
    <!-- Torso & Coat -->
    <path d="M 75 200 C 75 175 85 165 95 165 C 105 165 115 175 115 200 Z" fill="#10b981"/>
    <!-- Scarf for friendly everyday lifestyle feel -->
    <path d="M 87 165 Q 95 172 103 165 Q 100 178 95 178 Q 90 178 87 165 Z" fill="#f43f5e"/>
    <!-- Head & Hair -->
    <circle cx="95" cy="148" r="12" fill="#ffd6a5"/>
    <path d="M 83 148 C 83 138 107 138 107 148 C 107 142 83 142 83 148 Z" fill="#475569"/>
    <!-- Happy Expression -->
    <circle cx="91" cy="146" r="1.5" fill="#1e293b"/>
    <circle cx="99" cy="146" r="1.5" fill="#1e293b"/>
    <path d="M 93 151 Q 95 153 97 151" stroke="#1e293b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Walking Legs -->
    <line x1="85" y1="200" x2="82" y2="225" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <line x1="105" y1="200" x2="108" y2="225" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ENVIRONMENT DETAILS / LIGHTING (Emphasizing routine/daily consistency) -->
  
  <!-- Warm Street Lamp casting cozy amber light downwards -->
  <g id="street-lamp">
    <!-- Pole -->
    <rect x="215" y="80" width="6" height="120" fill="#334155" rx="3"/>
    <!-- Lamp Fixture -->
    <path d="M 203 75 L 227 75 L 233 85 L 197 85 Z" fill="#1e293b"/>
    <!-- Glowing bulb / light cone -->
    <polygon points="218,87 185,170 251,170" fill="#fef08a" opacity="0.15"/>
    <circle cx="218" cy="87" r="5" fill="#fde047" filter="url(#glow)"/>
  </g>

  <!-- Decorative Plant pot near entrance -->
  <g id="potted-plant">
    <rect x="22" y="175" width="14" height="18" fill="#cbd5e1" rx="2"/>
    <path d="M 29 175 C 20 160 38 150 29 135 C 20 150 38 160 29 175 Z" fill="#22c55e"/>
  </g>
</svg>