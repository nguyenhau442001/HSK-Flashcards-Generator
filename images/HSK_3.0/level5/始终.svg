<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Mountain Path -->
  <path d="M0 240 L80 160 L160 180 L240 140 L240 240 Z" fill="#334155"/>
  
  <!-- The Climber (Representing '始终' - persistence) -->
  <g transform="translate(100, 100)">
    <!-- Rope -->
    <path d="M-20 100 C 20 80, 40 40, 60 0" stroke="#fb923c" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <circle cx="0" cy="0" r="15" fill="#f59e0b"/>
    <path d="M-10 15 L-20 50 M10 15 L20 50 M-5 25 L5 25" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <path d="M-15 45 L-25 70 M15 45 L25 70" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Summit Flag/Goal -->
  <path d="M180 140 L180 80 M180 80 L210 100 L180 120" stroke="#10b981" stroke-width="6" fill="#10b981" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Atmospheric Elements -->
  <circle cx="200" cy="40" r="20" fill="#fbbf24" opacity="0.3"/>
  <path d="M30 180 Q50 170 70 180 T110 180" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M140 190 Q160 180 180 190 T220 190" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Stars/Sparkles -->
  <circle cx="40" cy="50" r="2" fill="#e2e8f0"/>
  <circle cx="200" cy="20" r="3" fill="#e2e8f0"/>
  <circle cx="150" cy="60" r="2" fill="#e2e8f0"/>
</svg>