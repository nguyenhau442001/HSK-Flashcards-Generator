<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Light -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lamp Glow -->
  <circle cx="120" cy="80" r="110" fill="url(#lampGlow)" />

  <!-- BACKGROUND ARCHITECTURE (University Department Context) -->
  <!-- Wall panels & bookshelf backdrop -->
  <rect x="24" y="24" width="192" height="150" fill="#1e293b" />
  
  <!-- Window showing campus view (Stylized green tree & building) -->
  <path d="M165,40 h35 v70 h-35 z" fill="#090d16" />
  <path d="M168,43 h29 v64 h-29 z" fill="url(#windowLight)" />
  <!-- Tree silhouette outside -->
  <circle cx="182" cy="75" r="12" fill="#10b981" opacity="0.4" />
  <rect x="180" y="85" width="4" height="20" fill="#334155" />

  <!-- Bookshelf on left -->
  <rect x="30" y="35" width="30" height="90" fill="#111827" rx="2" />
  <rect x="35" y="45" width="20" height="4" fill="#374151" />
  <rect x="35" y="65" width="20" height="4" fill="#374151" />
  <rect x="35" y="85" width="20" height="4" fill="#374151" />
  <!-- Colorful books -->
  <rect x="36" y="49" width="4" height="16" fill="#f59e0b" />
  <rect x="42" y="51" width="5" height="14" fill="#ec4899" />
  <rect x="49" y="48" width="4" height="17" fill="#38bdf8" />
  <rect x="36" y="69" width="6" height="16" fill="#10b981" />
  <rect x="44" y="71" width="8" height="14" fill="#fb923c" />

  <!-- Department Doorway hint / Wall banner anchor -->
  <path d="M80,30 h80 v10 h-80 z" fill="#334155" opacity="0.5" />
  <!-- Decorative Cultural Scroll/Scroll-art representing Chinese Department (Abstract brush stroke art) -->
  <rect x="105" y="40" width="30" height="45" fill="#f8fafc" rx="2" filter="url(#shadow)" />
  <path d="M115,50 q5,10 0,20" stroke="#ef4444" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M125,48 q-3,12 3,22" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <rect x="112" y="37" width="16" height="4" fill="#b45309" rx="1" />
  <rect x="112" y="83" width="16" height="4" fill="#b45309" rx="1" />

  <!-- FOREGROUND / DESK SETUP -->
  <!-- Large Wooden Study Desk -->
  <rect x="20" y="165" width="200" height="12" fill="#d97706" rx="3" filter="url(#shadow)" />
  <rect x="20" y="177" width="200" height="40" fill="#b45309" />
  <!-- Desk support legs -->
  <rect x="35" y="217" width="12" height="23" fill="#78350f" />
  <rect x="193" y="217" width="12" height="23" fill="#78350f" />

  <!-- Props on Desk: Laptop, Books, Pen holder -->
  <!-- Open Laptop -->
  <path d="M130,155 l20,-10 h35 l-15,10 z" fill="#94a3b8" />
  <rect x="145" y="125" width="35" height="22" rx="2" fill="#cbd5e1" />
  <rect x="148" y="128" width="29" height="16" fill="#0284c7" />
  <!-- Code/Text lines on screen -->
  <line x1="152" y1="133" x2="165" y2="133" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />
  <line x1="152" y1="138" x2="172" y2="138" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />
  <line x1="152" y1="143" x2="160" y2="143" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />

  <!-- Stack of Study Books -->
  <rect x="75" y="152" width="38" height="13" fill="#ef4444" rx="1" />
  <rect x="73" y="143" width="40" height="11" fill="#3b82f6" rx="1" />
  <rect x="77" y="135" width="34" height="9" fill="#10b981" rx="1" />

  <!-- Modern Desk Lamp -->
  <path d="M200,165 c0,-20 -20,-30 -30,-45" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M165,115 l12,-8 l6,10 z" fill="#fbbf24" />
  <ellipse cx="174" cy="117" rx="8" ry="4" fill="#f59e0b" />

  <!-- MAIN CHARACTER (Student in Chinese Department - Focused, Active Learning) -->
  <!-- Torso & Hoodie (Teal/Cyan modern student style) -->
  <path d="M85,175 c0,-15 12,-25 28,-25 c16,0 28,10 28,25 v20 h-56 z" fill="#0284c7" filter="url(#shadow)" />
  <!-- Hoodie details/strings -->
  <path d="M103,150 q2,10 4,20" stroke="#f0fdf4" stroke-width="2" fill="none" />
  <path d="M117,150 q-2,10 -4,20" stroke="#f0fdf4" stroke-width="2" fill="none" />
  <circle cx="107" cy="170" r="2" fill="#f0fdf4" />
  <circle cx="113" cy="170" r="2" fill="#f0fdf4" />

  <!-- Neck -->
  <rect x="104" y="122" width="12" height="12" fill="#fcd34d" />

  <!-- Head & Face (Expressive, smiling/concentrated) -->
  <circle cx="110" cy="108" r="18" fill="#fcd34d" filter="url(#shadow)" />
  
  <!-- Hair (Stylish dark slate modern cut) -->
  <path d="M93,108 c0,-12 8,-20 17,-20 c10,0 19,8 19,20 c0,3 -2,2 -3,0 c-2,-6 -7,-10 -16,-10 c-9,0 -14,4 -16,10 c-1,2 -3,3 -3,0 z" fill="#1e293b" />
  <path d="M94,102 c3,-5 9,-8 16,-8 c7,0 13,3 16,8 c-3,-2 -8,-4 -16,-4 c-8,0 -13,2 -16,4 z" fill="#334155" />

  <!-- Face features (Studious and engaged expression) -->
  <!-- Glasses -->
  <rect x="99" y="100" width="10" height="7" rx="1" fill="none" stroke="#334155" stroke-width="1.5" />
  <rect x="111" y="100" width="10" height="7" rx="1" fill="none" stroke="#334155" stroke-width="1.5" />
  <line x1="109" y1="103" x2="111" y2="103" stroke="#334155" stroke-width="1.5" />
  <!-- Eyes (Happy focused arcs) -->
  <path d="M102,103 q2,2 4,0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M114,103 q2,2 4,0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Smile -->
  <path d="M106,114 q4,3 8,0" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Rosy cheeks -->
  <circle cx="100" cy="111" r="3" fill="#f87171" opacity="0.4" />
  <circle cx="120" cy="111" r="3" fill="#f87171" opacity="0.4" />

  <!-- Arms and Hands (Writing/Interacting) -->
  <!-- Right Arm & Hand holding a pen -->
  <path d="M135,160 c10,5 15,12 18,22" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" />
  <circle cx="152" cy="182" r="5" fill="#fcd34d" />
  <!-- Pen -->
  <line x1="154" y1="184" x2="164" y2="194" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />

  <!-- Left Arm resting on desk -->
  <path d="M85,165 c-8,8 -12,15 -16,22" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" />
  <circle cx="68" cy="188" r="5" fill="#fcd34d" />

  <!-- Notebook in front of student -->
  <path d="M95,158 h30 l6,20 h-30 z" fill="#f8fafc" />
  <line x1="102" y1="165" x2="118" y2="165" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="100" y1="171" x2="120" y2="171" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="104" y1="177" x2="115" y2="177" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Floating accent elements representing academic study / language learning symbols (abstract strokes, no text) -->
  <path d="M45,95 q6,-10 12,0 t12,0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <circle cx="57" cy="85" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="145" cy="70" r="2" fill="#10b981" opacity="0.8" />
</svg>