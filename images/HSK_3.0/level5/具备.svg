<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing effect for ready tools -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Table wood gradient -->
    <linearGradient id="table-top" x1="20" y1="160" x2="220" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155" />
      <stop offset="0.5" stop-color="#475569" />
      <stop offset="1" stop-color="#334155" />
    </linearGradient>

    <!-- Backpack gradient -->
    <linearGradient id="backpack-grad" x1="120" y1="60" x2="190" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>

    <!-- Compass Gold Gradient -->
    <linearGradient id="gold-grad" x1="50" y1="110" x2="90" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric background highlights -->
  <circle cx="120" cy="100" r="90" fill="#38bdf8" opacity="0.05" />
  <circle cx="180" cy="80" r="40" fill="#10b981" opacity="0.07" />

  <!-- Back Wall / Environment Details -->
  <path d="M0 160 L240 160" stroke="#475569" stroke-width="2" opacity="0.4" />
  <!-- Small ambient shelf in background -->
  <rect x="30" y="50" width="80" height="6" rx="3" fill="#334155" opacity="0.6" />
  <circle cx="50" cy="42" r="8" fill="#10b981" opacity="0.4" />
  <rect x="70" y="34" width="12" height="16" rx="2" fill="#f43f5e" opacity="0.4" />

  <!-- WORKBENCH / SURFACE -->
  <path d="M15 165 C15 161 18 158 22 158 L218 158 C222 158 225 161 225 165 L225 175 C225 179 222 182 218 182 L22 182 C18 182 15 179 15 175 Z" fill="url(#table-top)" />
  <path d="M25 182 L35 220 L50 220 L40 182 Z" fill="#1e293b" opacity="0.8" />
  <path d="M215 182 L205 220 L190 220 L200 182 Z" fill="#1e293b" opacity="0.8" />

  <!-- MAIN SCENE OBJECT 1: THE WELL-EQUIPPED EXPEDITION BACKPACK (Ready / 'Có sẵn') -->
  <g id="equipped-backpack">
    <!-- Backpack Main Body -->
    <path d="M115 75 C115 65 125 55 140 55 L175 55 C190 55 200 65 200 75 L195 155 C195 163 188 170 180 170 L135 170 C127 170 120 163 120 155 Z" fill="url(#backpack-grad)" />
    <!-- Straps & Details -->
    <path d="M130 55 C130 45 180 45 180 55" fill="none" stroke="#0369a1" stroke-width="6" stroke-linecap="round" />
    <!-- Front Pocket Fully Packed -->
    <path d="M128 100 L187 100 C191 100 194 103 194 107 L194 150 C194 154 191 157 187 157 L128 157 C124 157 121 154 121 150 L121 107 C121 103 124 100 128 100 Z" fill="#0284c7" />
    <path d="M135 128 L179 128" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Side pocket water bottle -->
    <rect x="195" y="115" width="12" height="30" rx="4" fill="#10b981" />
    <path d="M197 115 L205 115 L205 110 L197 110 Z" fill="#cbd5e1" />
    <!-- Rolled sleeping mat on top -->
    <rect x="125" y="42" width="60" height="16" rx="8" fill="#fb923c" />
    <path d="M135 42 L135 58 M175 42 L175 58" stroke="#ea580c" stroke-width="2" />
  </g>

  <!-- MAIN SCENE OBJECT 2: ESSENTIAL PREPARATION TOOLS (COMPASS & GEAR) -->
  <g id="survival-gear">
    <!-- Floating Sparkles / Readiness indicators -->
    <g filter="url(#glow)">
      <path d="M100 70 L103 76 L109 79 L103 82 L100 88 L97 82 L91 79 L97 76 Z" fill="#fbbf24" />
      <path d="M60 55 L61.5 58.5 L65 60 L61.5 61.5 L60 65 L58.5 61.5 L55 60 L58.5 58.5 Z" fill="#38bdf8" />
      <path d="M160 30 L161 32 L163 33 L161 34 L160 36 L159 34 L157 33 L159 32 Z" fill="#10b981" />
    </g>

    <!-- Compass (Symbolizing readiness and having the right tools) -->
    <circle cx="75" cy="130" r="32" fill="#334155" stroke="url(#gold-grad)" stroke-width="6" />
    <circle cx="75" cy="130" r="26" fill="#0f172a" />
    <!-- Compass Rose / Needle -->
    <polygon points="75,110 79,130 75,150 71,130" fill="#f43f5e" />
    <polygon points="75,150 79,130 75,110 71,130" fill="#cbd5e1" opacity="0.5" />
    <circle cx="75" cy="130" r="4" fill="#fbbf24" />
    <!-- Compass Loop -->
    <path d="M72 98 L78 98 L78 94 L72 94 Z" fill="#d97706" />

    <!-- Magnifying Glass overlapping -->
    <circle cx="45" cy="155" r="20" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.9" />
    <circle cx="45" cy="155" r="17" fill="#0284c7" opacity="0.2" />
    <path d="M30 170 L16 184" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <path d="M30 170 L16 184" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- DYNAMIC ACTION / CHECKMARK ACCENT (Subtle, professional badge representing 'có đủ') -->
  <g transform="translate(145, 95)">
    <circle cx="16" cy="16" r="18" fill="#10b981" opacity="0.9" />
    <circle cx="16" cy="16" r="18" fill="none" stroke="#34d399" stroke-width="2" />
    <!-- Checkmark -->
    <path d="M9 16 L13 20 L23 11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Additional supportive props to enhance 'fully equipped' context -->
  <!-- Map partially rolled out on the table -->
  <g transform="translate(85, 145)">
    <path d="M0 10 C15 5 35 15 50 8 L55 22 C40 29 20 19 5 24 Z" fill="#fde68a" />
    <path d="M12 12 L20 16 M28 9 L35 14" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Foreground lighting / vignette -->
  <radialGradient id="vignette" cx="120" cy="120" r="130" gradientUnits="userSpaceOnUse">
    <stop offset="0.7" stop-color="#000000" stop-opacity="0" />
    <stop offset="1" stop-color="#020617" stop-opacity="0.6" />
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none" />
</svg>