<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Keyboard Body Gradient -->
    <linearGradient id="kbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Ambient Glow (Screen Light Reflection) -->
  <ellipse cx="120" cy="80" rx="80" ry="35" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <ellipse cx="120" cy="140" rx="90" ry="40" fill="#fb923c" opacity="0.05" filter="url(#glow)"/>

  <!-- Desk Surface & Environment props -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)" opacity="0.7"/>

  <!-- Coffee Mug (Context Prop) -->
  <g transform="translate(180, 115)" filter="url(#shadow)">
    <!-- Mug Body -->
    <path d="M 5 0 L 25 0 C 27 0, 28 2, 27 5 L 24 32 C 23 35, 20 37, 17 37 L 13 37 C 10 37, 7 35, 6 32 L 3 5 C 2 2, 3 0, 5 0 Z" fill="#f8fafc"/>
    <!-- Mug Handle -->
    <path d="M 25 8 C 33 8, 33 26, 25 28" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <!-- Coffee Surface -->
    <ellipse cx="15" cy="4" rx="10" ry="3" fill="#78350f"/>
    <!-- Steam -->
    <path d="M 12 -3 C 12 -7, 18 -9, 15 -14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 18 -5 C 18 -9, 24 -11, 21 -16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Small House Plant (Context Prop) -->
  <g transform="translate(20, 125)" filter="url(#shadow)">
    <!-- Pot -->
    <path d="M 6 15 L 20 15 C 22 15, 23 17, 22 19 L 18 33 C 17 35, 15 36, 13 36 L 13 36 C 11 36, 9 35, 8 33 L 4 19 C 3 17, 4 15, 6 15 Z" fill="#f43f5e"/>
    <!-- Leaves -->
    <path d="M 13 15 C 13 5, 2 0, -2 5 C -2 10, 8 13, 13 15 Z" fill="#10b981"/>
    <path d="M 13 15 C 20 4, 30 8, 28 14 C 25 18, 16 16, 13 15 Z" fill="#34d399"/>
    <path d="M 13 15 C 13 -2, 13 -8, 13 -12 C 16 -8, 16 -2, 13 15 Z" fill="#059669"/>
  </g>

  <!-- MAIN SUBJECT: Keyboard (键盘 - Jiànpán) -->
  <!-- Angled ISO-like 2D Vector Keyboard -->
  <g transform="translate(32, 110)" filter="url(#shadow)">
    
    <!-- Keyboard Shadow/Base Angle -->
    <rect x="0" y="8" width="176" height="66" rx="12" fill="#0f172a" opacity="0.8"/>
    
    <!-- Main Keyboard Chassis -->
    <rect x="0" y="0" width="176" height="64" rx="12" fill="url(#kbGrad)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Underglow Light Bar -->
    <rect x="12" y="60" width="152" height="3" rx="1.5" fill="url(#glowGrad)" filter="url(#glow)"/>

    <!-- Function Row / Top Accent line -->
    <rect x="12" y="8" width="152" height="6" rx="3" fill="#334155"/>

    <!-- KEY CAPS GRID -->
    <!-- Row 1 (Number/Symbol keys) -->
    <g fill="#cbd5e1" opacity="0.9">
      <rect x="12" y="18" width="10" height="9" rx="2"/>
      <rect x="25" y="18" width="10" height="9" rx="2"/>
      <rect x="38" y="18" width="10" height="9" rx="2"/>
      <rect x="51" y="18" width="10" height="9" rx="2"/>
      <rect x="64" y="18" width="10" height="9" rx="2"/>
      <rect x="77" y="18" width="10" height="9" rx="2"/>
      <rect x="90" y="18" width="10" height="9" rx="2"/>
      <rect x="103" y="18" width="10" height="9" rx="2"/>
      <rect x="116" y="18" width="10" height="9" rx="2"/>
      <rect x="129" y="18" width="10" height="9" rx="2"/>
      <rect x="142" y="18" width="10" height="9" rx="2"/>
      <!-- Backspace -->
      <rect x="155" y="18" width="9" height="9" rx="2" fill="#f43f5e" opacity="0.85"/>
    </g>

    <!-- Row 2 (QWERTY top letters) -->
    <g fill="#e2e8f0" opacity="0.95">
      <!-- Tab -->
      <rect x="12" y="29" width="12" height="9" rx="2"/>
      <rect x="27" y="29" width="10" height="9" rx="2"/>
      <rect x="40" y="29" width="10" height="9" rx="2"/>
      <rect x="53" y="29" width="10" height="9" rx="2"/>
      <rect x="66" y="29" width="10" height="9" rx="2"/>
      <rect x="79" y="29" width="10" height="9" rx="2"/>
      <rect x="92" y="29" width="10" height="9" rx="2"/>
      <rect x="105" y="29" width="10" height="9" rx="2"/>
      <rect x="118" y="29" width="10" height="9" rx="2"/>
      <rect x="131" y="29" width="10" height="9" rx="2"/>
      <rect x="144" y="29" width="20" height="9" rx="2"/>
    </g>

    <!-- Row 3 (Home row - colorful active accent keys) -->
    <g fill="#e2e8f0" opacity="0.95">
      <!-- Caps Lock -->
      <rect x="12" y="40" width="14" height="9" rx="2"/>
      <rect x="29" y="40" width="10" height="9" rx="2"/>
      <!-- Highlighted typing keys representing 'typing action' -->
      <rect x="42" y="40" width="10" height="9" rx="2" fill="#38bdf8"/>
      <rect x="55" y="40" width="10" height="9" rx="2" fill="#38bdf8"/>
      <rect x="68" y="40" width="10" height="9" rx="2"/>
      <rect x="81" y="40" width="10" height="9" rx="2"/>
      <rect x="94" y="40" width="10" height="9" rx="2" fill="#fbbf24"/>
      <rect x="107" y="40" width="10" height="9" rx="2" fill="#fbbf24"/>
      <rect x="120" y="40" width="10" height="9" rx="2"/>
      <!-- Enter Key -->
      <rect x="133" y="40" width="31" height="9" rx="2" fill="#10b981" opacity="0.9"/>
    </g>

    <!-- Row 4 (Bottom row & Spacebar) -->
    <g fill="#cbd5e1" opacity="0.9">
      <!-- Shift -->
      <rect x="12" y="51" width="18" height="9" rx="2"/>
      <rect x="33" y="51" width="10" height="9" rx="2"/>
      <rect x="46" y="51" width="10" height="9" rx="2"/>
      <rect x="59" y="51" width="38" height="9" rx="2" fill="#f8fafc"/> <!-- SPACEBAR -->
      <rect x="100" y="51" width="10" height="9" rx="2"/>
      <rect x="113" y="51" width="10" height="9" rx="2"/>
      <rect x="126" y="51" width="12" height="9" rx="2"/>
      <!-- Right Shift -->
      <rect x="141" y="51" width="23" height="9" rx="2"/>
    </g>

  </g>

  <!-- Interactive Action Elements (Flying Magical Input Glyphs / Pixels) -->
  <g filter="url(#glow)">
    <!-- Cute geometric blocks flying out of keyboard symbolizing typing/inputting -->
    <rect x="85" y="75" width="12" height="12" rx="3" fill="#38bdf8" transform="rotate(15 91 81)" opacity="0.9"/>
    <circle cx="135" cy="65" r="6" fill="#fbbf24" opacity="0.9"/>
    <rect x="150" y="85" width="10" height="10" rx="2" fill="#ec4899" transform="rotate(-20 155 90)" opacity="0.8"/>
    <circle cx="95" cy="55" r="4" fill="#10b981" opacity="0.9"/>
    
    <!-- Sparkle paths -->
    <path d="M 80 95 Q 90 70 110 65" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6"/>
    <path d="M 130 90 Q 140 70 155 60" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6"/>
  </g>

</svg>