<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed container background -->
  <rect width="240" height="240" rx="24" fill="#1e293b"/>

  <!-- Desk surface - angled perspective -->
  <path d="M0 120 L240 100 L240 240 L0 240 Z" fill="#334155"/>

  <!-- Calculator body -->
  <rect x="70" y="60" width="100" height="120" rx="8" fill="#475569"/>

  <!-- Calculator screen -->
  <rect x="80" y="70" width="80" height="35" rx="4" fill="#0f172a"/>
  <!-- Abstract glowing elements on screen (representing calculation without numbers) -->
  <rect x="85" y="77" width="20" height="4" rx="1" fill="#fbbf24"/>
  <rect x="110" y="77" width="15" height="4" rx="1" fill="#fbbf24"/>
  <rect x="85" y="85" width="30" height="4" rx="1" fill="#fbbf24"/>
  <rect x="120" y="85" width="10" height="4" rx="1" fill="#fbbf24"/>

  <!-- Calculator buttons -->
  <!-- Row 1 -->
  <rect x="80" y="115" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="103" y="115" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="126" y="115" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="149" y="115" width="18" height="12" rx="3" fill="#fb923c"/> <!-- Operator button -->
  <!-- Row 2 -->
  <rect x="80" y="132" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="103" y="132" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="126" y="132" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="149" y="132" width="18" height="12" rx="3" fill="#fb923c"/> <!-- Operator button -->
  <!-- Row 3 -->
  <rect x="80" y="149" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="103" y="149" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="126" y="149" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="149" y="149" width="18" height="12" rx="3" fill="#fb923c"/> <!-- Operator button -->
  <!-- Row 4 -->
  <rect x="80" y="166" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="103" y="166" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="126" y="166" width="18" height="12" rx="3" fill="#64748b"/>
  <rect x="149" y="166" width="18" height="12" rx="3" fill="#10b981"/> <!-- Equals button -->

  <!-- Subtle shadow for calculator -->
  <ellipse cx="120" cy="185" rx="50" ry="8" fill="rgba(0,0,0,0.2)"/>

  <!-- Stack of papers -->
  <rect x="40" y="140" width="40" height="30" rx="3" fill="#e2e8f0"/>
  <rect x="42" y="138" width="40" height="30" rx="3" fill="#cbd5e1"/>
  <rect x="44" y="136" width="40" height="30" rx="3" fill="#e2e8f0"/>

  <!-- Subtle shadow for papers -->
  <ellipse cx="60" cy="175" rx="25" ry="5" fill="rgba(0,0,0,0.2)"/>

  <!-- Pen -->
  <rect x="175" y="145" width="45" height="8" rx="4" fill="#64748b" transform="rotate(20 175 145)"/>
  <circle cx="178" cy="148" r="3" fill="#94a3b8" transform="rotate(20 178 148)"/> <!-- Pen tip -->
  <rect x="205" y="140" width="10" height="5" rx="2" fill="#94a3b8" transform="rotate(20 205 140)"/> <!-- Pen clip -->

  <!-- Subtle shadow for pen -->
  <ellipse cx="195" cy="155" rx="20" ry="4" fill="rgba(0,0,0,0.2)" transform="rotate(20 195 155)"/>
</svg>