<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Distant Mountain Peaks -->
  <path d="M0 240 L60 120 L120 240 Z" fill="#334155"/>
  <path d="M80 240 L160 80 L240 240 Z" fill="#475569"/>
  <path d="M180 240 L220 160 L260 240 Z" fill="#334155"/>
  
  <!-- Snow caps -->
  <path d="M45 150 L60 120 L75 150 Z" fill="#f1f5f9"/>
  <path d="M140 120 L160 80 L180 120 Z" fill="#f1f5f9"/>
  
  <!-- Character: Hiker struggling with a bag of chips -->
  <g transform="translate(100, 140)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 40 L15 80 M30 40 L35 80" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 50 L20 60 L35 50" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    
    <!-- The bag of chips expanding -->
    <rect x="45" y="20" width="30" height="40" rx="4" fill="#ec4899"/>
    <path d="M45 20 Q60 10 75 20" fill="#ec4899"/>
    <path d="M45 60 Q60 70 75 60" fill="#ec4899"/>
    <circle cx="60" cy="40" r="3" fill="#fef3c7"/>
  </g>
  
  <!-- Atmospheric pressure visualization (subtle bubbles) -->
  <circle cx="180" cy="100" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="110" r="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="200" cy="90" r="3" fill="#38bdf8" opacity="0.5"/>
  
  <!-- Ground -->
  <path d="M0 220 Q120 200 240 220 L240 240 L0 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
</svg>