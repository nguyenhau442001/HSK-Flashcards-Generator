<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="15" rx="2" fill="#334155"/>
  <rect x="30" y="155" width="10" height="80" rx="2" fill="#475569"/>
  <rect x="200" y="155" width="10" height="80" rx="2" fill="#475569"/>
  
  <!-- Props: Books and Laptop -->
  <rect x="40" y="125" width="50" height="15" rx="2" fill="#fb923c"/>
  <rect x="45" y="115" width="45" height="10" rx="2" fill="#f59e0b"/>
  <rect x="110" y="100" width="80" height="40" rx="4" fill="#38bdf8"/>
  <rect x="115" y="105" width="70" height="30" rx="2" fill="#0f172a"/>
  
  <!-- Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 100 Q-40 60 0 60 T40 100 L40 120 L-40 120 Z" fill="#ec4899"/>
    <!-- Arms -->
    <path d="M-40 70 L-60 100" stroke="#ec4899" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 70 L60 100" stroke="#ec4899" stroke-width="12" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="40" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 40 Q-25 10 0 10 T25 40" fill="#78350f"/>
    <!-- Glasses -->
    <circle cx="-10" cy="40" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="10" cy="40" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="-4" y1="40" x2="4" y2="40" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Ambient Light/Sparkles -->
  <circle cx="180" cy="60" r="3" fill="#fbbf24"/>
  <circle cx="190" cy="50" r="2" fill="#fbbf24"/>
  <circle cx="200" cy="70" r="2" fill="#fbbf24"/>
  <path d="M150 50 L155 45 M155 55 L160 50" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>