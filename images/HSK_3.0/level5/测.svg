<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Interior -->
  <path d="M20 180 L220 180 L200 220 L40 220 Z" fill="#334155"/>
  <path d="M20 180 L20 40 L220 40 L220 180 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Tape Measure Line -->
  <line x1="60" y1="180" x2="180" y2="180" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 4"/>
  
  <!-- Character 1 (Holding tape) -->
  <g transform="translate(50, 120)">
    <circle cx="15" cy="20" r="12" fill="#fde68a"/>
    <path d="M5 40 L10 70 L20 70 L25 40" fill="#38bdf8"/>
    <rect x="5" y="35" width="20" height="10" rx="2" fill="#38bdf8"/>
    <circle cx="15" cy="75" r="5" fill="#fb923c"/>
  </g>
  
  <!-- Character 2 (Pointing/Directing) -->
  <g transform="translate(160, 120)">
    <circle cx="15" cy="20" r="12" fill="#fde68a"/>
    <path d="M5 40 L10 70 L20 70 L25 40" fill="#ec4899"/>
    <rect x="5" y="35" width="20" height="10" rx="2" fill="#ec4899"/>
    <path d="M25 45 L40 35" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <circle cx="15" cy="75" r="5" fill="#fb923c"/>
  </g>
  
  <!-- Tape Measure Tool -->
  <rect x="40" y="170" width="20" height="20" rx="4" fill="#fbbf24"/>
  <circle cx="50" cy="180" r="4" fill="#1e293b"/>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="60" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="40" cy="70" r="2" fill="#10b981" opacity="0.6"/>
  <rect x="180" y="190" width="30" height="5" rx="2" fill="#475569"/>
</svg>