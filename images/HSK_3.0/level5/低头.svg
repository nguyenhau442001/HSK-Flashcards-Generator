<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Street/Urban vibe -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <circle cx="200" cy="60" r="25" fill="#f59e0b" opacity="0.1"/>
  
  <!-- The "He" (Subject) -->
  <g transform="translate(100, 100)">
    <!-- Body -->
    <path d="M-20 40 L20 40 L25 100 L-25 100 Z" fill="#38bdf8"/>
    <!-- Head (Bent down) -->
    <ellipse cx="0" cy="30" rx="18" ry="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-18 25 C-18 10, 18 10, 18 25" fill="#1e293b"/>
    <!-- Phone -->
    <rect x="-10" y="50" width="20" height="35" rx="3" fill="#fb923c"/>
    <rect x="-8" y="55" width="16" height="25" rx="1" fill="#0f172a"/>
    <!-- Arms -->
    <path d="M-20 45 L-35 65" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 45 L35 65" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- The "Me" (Observer) -->
  <g transform="translate(40, 120)">
    <!-- Body -->
    <path d="M-15 40 L15 40 L20 100 L-20 100 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="18" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-18 30 Q0 10 18 30" fill="#10b981"/>
    <!-- Eyes looking -->
    <circle cx="-6" cy="28" r="2" fill="#0f172a"/>
    <circle cx="6" cy="28" r="2" fill="#0f172a"/>
    <!-- Arm reaching out -->
    <path d="M15 50 L40 40" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative light accents -->
  <circle cx="180" cy="150" r="3" fill="#fbbf24"/>
  <circle cx="20" cy="190" r="2" fill="#fbbf24"/>
</svg>