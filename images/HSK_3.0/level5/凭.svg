<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Glow Effect for Entrance -->
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Golden Glow for Ticket -->
    <radialGradient id="ticketGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Ticket Gradient -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background lighting for event entrance -->
  <circle cx="170" cy="120" r="90" fill="url(#lightGlow)" />
  <rect x="150" y="40" width="60" height="170" fill="#38bdf8" opacity="0.05" />

  <!-- ENVIRONMENT: Venue Entrance / Gate -->
  <!-- Wall structure -->
  <path d="M0 240 L0 30 L110 30 L110 240 Z" fill="#334155" opacity="0.4" />
  <path d="M140 30 L240 30 L240 240 L140 240 Z" fill="#334155" opacity="0.6" />
  
  <!-- Automatic Glass Gate / Turnstile Structure -->
  <rect x="110" y="45" width="30" height="185" fill="#475569" rx="4" />
  <rect x="115" y="60" width="20" height="40" rx="2" fill="#0f172a" />
  <circle cx="125" cy="80" r="5" fill="#10b981" /> <!-- Access Granted Green Light -->

  <!-- Glass Door / Barrier -->
  <path d="M125 100 L125 210" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M125 130 L135 150 L125 170" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Queue Line / Floor Details -->
  <path d="M20 210 L110 210" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" />
  <path d="M30 190 Q 70 190 90 210" fill="none" stroke="#64748b" stroke-width="2" opacity="0.3" />

  <!-- CHARACTER 1: Staff / Gate Attendant (Right side, inside) -->
  <g transform="translate(160, 90)">
    <!-- Body -->
    <path d="M10 50 Q 25 50 40 120 L -10 120 Q 5 50 10 50 Z" fill="#0284c7" />
    <!-- Head -->
    <circle cx="15" cy="25" r="14" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M2 20 Q 15 5 28 20 Q 25 12 15 12 Q 5 12 2 20 Z" fill="#334155" />
    <!-- Friendly smiling expression pointing/welcoming -->
    <path d="M10 30 Q 15 35 20 30" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" />
    <!-- Arm gesturing towards entrance -->
    <path d="M5 50 L -15 65" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- CHARACTER 2: Visitor holding up the ticket (Left side, approaching) -->
  <g transform="translate(40, 75)">
    <!-- Visitor Shadow -->
    <ellipse cx="35" cy="147" rx="25" ry="6" fill="#020617" opacity="0.5" />

    <!-- Back Arm -->
    <path d="M20 50 L 5 80" stroke="#f97316" stroke-width="8" stroke-linecap="round" />

    <!-- Torso (Jacket/Sweater) -->
    <path d="M15 45 Q 35 45 45 110 L 10 110 Q 15 70 15 45 Z" fill="#f97316" />
    <path d="M25 45 L 25 110" stroke="#c2410c" stroke-width="3" />

    <!-- Head -->
    <circle cx="28" cy="20" r="15" fill="#fde68a" />
    <!-- Hair stylish -->
    <path d="M13 18 Q 28 -2 43 15 Q 35 8 28 8 Q 18 8 13 18 Z" fill="#451a03" />

    <!-- Face profile looking right -->
    <circle cx="34" cy="22" r="1.5" fill="#451a03" />
    <path d="M35 27 Q 38 29 34 30" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />

    <!-- Legs -->
    <path d="M18 110 L 15 145" stroke="#1e293b" stroke-width="9" stroke-linecap="round" />
    <path d="M35 110 L 38 145" stroke="#1e293b" stroke-width="9" stroke-linecap="round" />
    <!-- Shoes -->
    <ellipse cx="12" cy="147" rx="7" ry="3" fill="#0f172a" />
    <ellipse cx="42" cy="147" rx="7" ry="3" fill="#0f172a" />

    <!-- Front Arm reaching forward to present the ticket -->
    <path d="M35 55 Q 55 60 70 75" fill="none" stroke="#f97316" stroke-width="9" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="73" cy="77" r="5" fill="#fde68a" />
  </g>

  <!-- PROP: The Ticket (The core element of "凭" - relying on this ticket) -->
  <g transform="translate(100, 130) rotate(-15)">
    <!-- Ticket Glow Effect -->
    <circle cx="15" cy="10" r="30" fill="url(#ticketGlow)" />
    
    <!-- Ticket Body -->
    <rect x="0" y="0" width="50" height="28" rx="4" fill="url(#ticketGrad)" stroke="#ca8a04" stroke-width="1.5" />
    
    <!-- Ticket Notches (Cutouts on sides) -->
    <circle cx="0" cy="14" r="4" fill="#0f172a" />
    <circle cx="50" cy="14" r="4" fill="#0f172a" />

    <!-- Ticket Details (Abstract graphic lines representing text/barcode) -->
    <line x1="12" y1="8" x2="28" y2="8" stroke="#854d0e" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="14" x2="22" y2="14" stroke="#854d0e" stroke-width="2" stroke-linecap="round" />
    
    <!-- Mini star/icon graphic on ticket -->
    <circle cx="38" cy="14" r="4" fill="#ea580c" />
    
    <!-- Dashed stub line -->
    <line x1="30" y1="4" x2="30" y2="24" stroke="#ca8a04" stroke-width="1" stroke-dasharray="2,2" />
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles (Focus on the valid ticket exchange action) -->
  <circle cx="95" cy="120" r="2" fill="#fef08a" opacity="0.8" />
  <circle cx="115" cy="105" r="1.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="85" cy="145" r="1" fill="#fef08a" opacity="0.6" />
</svg>