<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 180 L240 180 L220 160 L20 160 Z" fill="#475569"/>

  <!-- Bamboo Steamer Base -->
  <ellipse cx="120" cy="170" rx="80" ry="25" fill="#92400e"/>
  <ellipse cx="120" cy="170" rx="75" ry="22" fill="#b45309"/>

  <!-- Tofu Blocks -->
  <rect x="80" y="110" width="40" height="40" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <rect x="125" y="120" width="45" height="35" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <rect x="70" y="135" width="35" height="30" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>

  <!-- Steam/Atmosphere -->
  <circle cx="100" cy="90" r="6" fill="#38bdf8" opacity="0.6"/>
  <circle cx="130" cy="80" r="8" fill="#38bdf8" opacity="0.4"/>
  <circle cx="150" cy="95" r="5" fill="#38bdf8" opacity="0.5"/>

  <!-- Chopsticks -->
  <rect x="180" y="140" width="60" height="4" rx="2" fill="#fb923c" transform="rotate(-20 210 142)"/>
  <rect x="185" y="150" width="60" height="4" rx="2" fill="#fb923c" transform="rotate(-15 215 152)"/>

  <!-- Garnish/Green Onion -->
  <path d="M110 120 C115 110 125 110 130 120" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 130 C145 120 155 120 160 130" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- Decorative Accent -->
  <circle cx="30" cy="40" r="15" fill="#ec4899" opacity="0.2"/>
</svg>