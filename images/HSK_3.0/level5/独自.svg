<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Mountain and Sun -->
  <path d="M0 180 L80 100 L160 180 Z" fill="#334155"/>
  <path d="M100 200 L180 120 L240 200 Z" fill="#475569"/>
  <circle cx="190" cy="60" r="25" fill="#f59e0b" opacity="0.8"/>
  
  <!-- The Traveler -->
  <g transform="translate(80, 110)">
    <!-- Backpack -->
    <rect x="15" y="30" width="25" height="35" rx="4" fill="#fb923c"/>
    <!-- Body -->
    <path d="M20 30 Q20 80 20 100" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="20" cy="25" r="12" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M10 20 Q20 10 30 20 Q30 30 20 30 Z" fill="#78350f"/>
    <!-- Legs -->
    <path d="M15 100 L10 130 M25 100 L30 130" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M15 50 L5 70 M25 50 L35 70" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Travel Props -->
  <g transform="translate(140, 160)">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="#ec4899"/>
    <rect x="5" y="5" width="30" height="15" rx="2" fill="#fef3c7"/>
    <rect x="15" y="45" width="10" height="5" fill="#94a3b8"/>
  </g>
  
  <!-- Path -->
  <path d="M0 220 Q120 180 240 220" stroke="#10b981" stroke-width="4" stroke-dasharray="10 10" opacity="0.5"/>
</svg>