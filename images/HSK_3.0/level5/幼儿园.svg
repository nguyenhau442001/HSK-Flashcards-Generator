<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm interior glow -->
    <radialGradient id="roomGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window light gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Slide gradient -->
    <linearGradient id="slideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Child shirt gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Backpack gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Soft shadow -->
    <ellipse id="shadow" cx="0" cy="0" rx="12" ry="4" fill="#000000" opacity="0.3" />
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#roomGlow)" />

  <!-- ENVIRONMENT / KINDERGARTEN INTERIOR -->
  <!-- Colorful wall panels / Wallpaper decor -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#1e1b4b" opacity="0.5" />
  <path d="M0 156 L240 156 L240 160 L0 160 Z" fill="#fbbf24" opacity="0.8" />
  
  <!-- Window to the outside world -->
  <rect x="25" y="30" width="55" height="70" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <rect x="28" y="33" width="49" height="64" rx="4" fill="url(#windowLight)" />
  <!-- Window frame cross -->
  <line x1="52" y1="33" x2="52" y2="97" stroke="#475569" stroke-width="2" />
  <line x1="28" y1="65" x2="77" y2="65" stroke="#475569" stroke-width="2" />
  <!-- Cute cloud outside window -->
  <path d="M38 50 Q42 45 48 48 Q54 44 58 50 Q63 50 62 56 Q36 56 38 50 Z" fill="#94a3b8" opacity="0.4" />

  <!-- Wall Decals (Sun & Stars in Kindergarten) -->
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="205" cy="45" r="12" />
    <path d="M205 25 L205 20 M205 65 L205 70 M185 45 L180 45 M225 45 L230 45 M191 31 L187 27 M219 59 L223 63 M191 59 L187 63 M219 31 L223 27" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>
  <!-- Cloud wall sticker -->
  <path d="M165 75 q6-8 15-5 q8-6 15 2 q7 0 7 8 q-19 0-37 -5 z" fill="#38bdf8" opacity="0.3" />

  <!-- Toy Shelf / Storage in Background -->
  <g transform="translate(160, 95)">
    <rect x="0" y="0" width="65" height="65" rx="4" fill="#334155" />
    <rect x="5" y="5" width="55" height="27" fill="#1e293b" opacity="0.7" />
    <rect x="5" y="37" width="55" height="23" fill="#1e293b" opacity="0.7" />
    <!-- Colorful toy blocks inside shelf -->
    <rect x="10" y="12" width="12" height="15" rx="2" fill="#ef4444" />
    <rect x="26" y="10" width="14" height="17" rx="2" fill="#10b981" />
    <circle cx="50" cy="18" r="8" fill="#fbbf24" />
    <triangle points="12,55 18,42 24,55" fill="#a855f7" />
  </g>

  <!-- PLAYGROUND EQUIPMENT: Miniature Indoor Slide -->
  <g transform="translate(15, 115)">
    <!-- Slide ladder -->
    <line x1="25" y1="10" x2="10" y2="45" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="33" y1="10" x2="22" y2="45" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="20" x2="27" y2="20" stroke="#cbd5e1" stroke-width="2" />
    <line x1="13" y1="32" x2="24" y2="32" stroke="#cbd5e1" stroke-width="2" />
    <!-- Slide chute -->
    <path d="M30 10 Q35 10 40 15 L75 38 Q82 43 78 48 Q74 53 68 47 L35 23 Z" fill="url(#slideGrad)" />
    <!-- Slide support base -->
    <rect x="70" y="42" width="8" height="3" rx="1" fill="#be185d" />
  </g>

  <!-- Flooring (Playmat style) -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#0f172a" />
  <!-- Colorful interlocking playmat tiles pattern -->
  <path d="M0 160 Q60 155 120 160 Q180 165 240 160 L240 240 L0 240 Z" fill="#1e293b" />
  <line x1="0" y1="185" x2="240" y2="185" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.6" />
  <line x1="80" y1="160" x2="70" y2="240" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.6" />
  <line x1="160" y1="160" x2="175" y2="240" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.6" />

  <!-- MAIN SUBJECT: A HAPPY CHILD GOING TO KINDERGARTEN -->
  <!-- Context shadow under child -->
  <use href="#shadow" x="115" y="212" rx="18" ry="6" />

  <!-- Child Character Group -->
  <g transform="translate(95, 130)">
    
    <!-- Big Kindergarten Backpack (straps & body visible behind/side) -->
    <rect x="-12" y="15" width="14" height="22" rx="5" fill="url(#bagGrad)" />
    <!-- Cute star badge on backpack -->
    <path d="M-5 23 L-3 27 L1 27 L-2 30 L-1 34 L-5 31 L-9 34 L-8 30 L-11 27 L-7 27 Z" fill="#fef08a" transform="scale(0.6) translate(-5, 5)" />

    <!-- Left Leg (stepping forward) -->
    <path d="M-2 36 Q-6 48 -10 54" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Cute Red Shoe -->
    <ellipse cx="-11" cy="55" rx="5" ry="3" fill="#ef4444" />

    <!-- Right Leg (standing firm) -->
    <path d="M8 36 Q11 47 13 53" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Cute Red Shoe -->
    <ellipse cx="14" cy="54" rx="5" ry="3" fill="#ef4444" />

    <!-- Torso / Shirt -->
    <path d="M-10 12 C-10 10 10 10 10 12 L12 38 C12 40 -12 40 -12 38 Z" fill="url(#shirtGrad)" />
    <!-- Collar -->
    <path d="M-4 12 L0 16 L4 12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Happy graphic on shirt (little smile) -->
    <circle cx="0" cy="24" r="2" fill="#fef08a" />
    <path d="M-2 27 Q0 29 2 27" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Left Arm (Waving happily) -->
    <path d="M-10 16 Q-22 12 -26 2" stroke="#fbcfe8" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <!-- Left Hand -->
    <circle cx="-27" cy="0" r="3.5" fill="#fbcfe8" />

    <!-- Right Arm (Holding little lunch bag or pointing forward) -->
    <path d="M10 16 Q20 22 24 30" stroke="#fbcfe8" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <!-- Right Hand holding small yellow toy/bag -->
    <circle cx="25" cy="31" r="3.5" fill="#fbcfe8" />
    <circle cx="27" cy="35" r="4" fill="#fbbf24" />

    <!-- Neck -->
    <rect x="-3" y="8" width="6" height="6" fill="#fbcfe8" rx="2" />

    <!-- Head -->
    <circle cx="0" cy="0" r="16" fill="#fbcfe8" />

    <!-- Cute Hair (Stylized toddler bob) -->
    <path d="M-16 -3 Q-17 -16 0 -17 Q17 -16 16 -3 Q13 -8 0 -9 Q-13 -8 -16 -3 Z" fill="#1e293b" />
    <path d="M12 -8 Q18 -5 15 2 Q13 -2 12 -8 Z" fill="#1e293b" /> <!-- Side tuft -->
    <path d="M-12 -9 Q-8 -18 2 -15" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" /> <!-- Cute little cowlick curl -->

    <!-- Facial Expression (Radiant Joy) -->
    <!-- Eyes (Happy Arcs) -->
    <path d="M-7 -2 Q-5 -5 -3 -2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M3 -2 Q5 -5 7 -2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="-8" cy="2" r="3.5" fill="#f43f5e" opacity="0.3" />
    <circle cx="8" cy="2" r="3.5" fill="#f43f5e" opacity="0.3" />

    <!-- Big Happy Open Smile -->
    <path d="M-5 4 Q0 9 5 4" fill="#e11d48" />
    <path d="M-4 5 Q0 8 4 5" fill="#ffffff" /> <!-- tiny teeth -->
  </g>

  <!-- FOREGROUND PROPS (Adds depth and framing) -->
  <!-- Building blocks scattered on the play mat (realistic context) -->
  <g transform="translate(45, 195)">
    <!-- Blue cube -->
    <rect x="0" y="5" width="14" height="14" rx="2" fill="#0ea5e9" transform="rotate(-10 7 12)" />
    <rect x="2" y="3" width="14" height="14" rx="2" fill="#38bdf8" transform="rotate(-10 7 12)" />
    <!-- Yellow triangle block -->
    <path d="M30 18 L42 5 L45 18 Z" fill="#f59e0b" />
    <path d="M28 20 L40 7 L43 20 Z" fill="#fbbf24" />
  </g>

  <g transform="translate(180, 185)">
    <!-- Green cylinder block -->
    <rect x="0" y="10" width="12" height="16" rx="3" fill="#059669" />
    <ellipse cx="6" cy="10" rx="6" ry="3" fill="#34d399" />
    <!-- Red ball -->
    <circle cx="25" cy="20" r="7" fill="#ef4444" />
    <circle cx="23" cy="18" r="2" fill="#fca5a5" opacity="0.8" />
  </g>

  <!-- Soft vignette lighting overlay for polished art direction -->
  <circle cx="120" cy="120" r="130" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.05" />
</svg>