<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <circle cx="180" cy="60" r="30" fill="#334155" opacity="0.5"/>
  <path d="M20 180 L220 180" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <path d="M40 120 C40 100 60 90 80 90 C100 90 120 100 120 120 L120 160 L40 160 Z" fill="#38bdf8"/>
    <circle cx="80" cy="60" r="25" fill="#fde68a"/>
    <path d="M70 55 L75 60 L70 65 M90 55 L85 60 L90 65" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M72 75 C75 78 85 78 88 75" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Phone and Interaction -->
  <g transform="translate(130, 110)">
    <rect x="0" y="0" width="40" height="70" rx="4" fill="#64748b"/>
    <rect x="4" y="8" width="32" height="50" fill="#0f172a"/>
    <circle cx="20" cy="62" r="3" fill="#cbd5e1"/>
    
    <!-- Floating "Money" Effect -->
    <g fill="#fbbf24">
      <rect x="45" y="-20" width="15" height="10" rx="2"/>
      <path d="M52 5 L52 15" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="52" cy="-15" r="2" fill="#f59e0b"/>
    </g>
  </g>
  
  <!-- Decorative Accents -->
  <circle cx="40" cy="40" r="5" fill="#ec4899"/>
  <circle cx="200" cy="200" r="8" fill="#10b981"/>
  <path d="M180 150 L190 140 L200 150" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>