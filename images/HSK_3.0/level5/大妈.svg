<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Park Environment -->
  <path d="M0 180 C80 160, 160 160, 240 180 L240 240 L0 240 Z" fill="#064e3b" opacity="0.6"/>
  <circle cx="200" cy="50" r="20" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Dancing Figures (Dama) -->
  <g transform="translate(40, 120)">
    <!-- Figure 1 -->
    <g transform="translate(0, 0)">
      <circle cx="10" cy="20" r="8" fill="#fca5a5"/>
      <path d="M10 28 L10 50 M10 35 L0 45 M10 35 L20 45 M5 65 L8 80 M12 65 L15 80" stroke="#fca5a5" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 50 Q10 40 20 50" stroke="#ec4899" stroke-width="6" fill="none"/>
    </g>
    <!-- Figure 2 -->
    <g transform="translate(60, -10)">
      <circle cx="10" cy="20" r="8" fill="#fb923c"/>
      <path d="M10 28 L10 50 M10 35 L0 45 M10 35 L20 45 M5 65 L8 80 M12 65 L15 80" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 50 Q10 40 20 50" stroke="#38bdf8" stroke-width="6" fill="none"/>
    </g>
    <!-- Figure 3 -->
    <g transform="translate(120, 5)">
      <circle cx="10" cy="20" r="8" fill="#c084fc"/>
      <path d="M10 28 L10 50 M10 35 L0 45 M10 35 L20 45 M5 65 L8 80 M12 65 L15 80" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 50 Q10 40 20 50" stroke="#10b981" stroke-width="6" fill="none"/>
    </g>
  </g>
  
  <!-- Park Props -->
  <rect x="20" y="190" width="200" height="5" fill="#334155"/>
  <circle cx="180" cy="170" r="3" fill="#fbbf24"/>
  <circle cx="190" cy="175" r="2" fill="#fbbf24"/>
  <circle cx="170" cy="175" r="2" fill="#fbbf24"/>
</svg>