<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg_grad)"/>

  <!-- Environment: Countertop -->
  <path d="M20 190 L220 190 L220 200 C220 205 215 210 210 210 L30 210 C25 210 20 205 20 200 Z" fill="#334155"/>
  
  <!-- The Machine (Sleek Modern Coffee/Drink Station) -->
  <rect x="110" y="80" width="80" height="110" rx="8" fill="#475569"/>
  <rect x="115" y="85" width="70" height="40" rx="4" fill="#1e293b"/> <!-- Screen area -->
  
  <!-- Interface: Simple Glowing Button -->
  <circle cx="150" cy="105" r="12" fill="#10b981" filter="url(#glow)"/>
  <circle cx="150" cy="105" r="6" fill="#34d399"/>
  
  <!-- Machine Details -->
  <rect x="135" y="150" width="30" height="5" rx="2" fill="#94a3b8"/> <!-- Nozzle -->
  <rect x="120" y="180" width="60" height="4" rx="2" fill="#1e293b"/> <!-- Drip tray -->

  <!-- The Cup -->
  <path d="M140 170 L160 170 L158 185 L142 185 Z" fill="#f8fafc"/>
  <path d="M160 173 C165 173 165 180 160 180" fill="none" stroke="#f8fafc" stroke-width="2"/>
  
  <!-- Steam -->
  <path d="M145 165 Q147 158 145 155" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M152 163 Q154 156 152 153" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Character: Expressing Ease -->
  <!-- Body -->
  <path d="M40 240 Q40 160 75 160 Q110 160 110 240" fill="#fb923c"/>
  <!-- Arm reaching out -->
  <path d="M85 185 Q110 170 140 110" fill="none" stroke="#ffedd5" stroke-width="8" stroke-linecap="round"/>
  <!-- Hand/Finger pressing button -->
  <circle cx="140" cy="108" r="5" fill="#ffedd5"/>
  
  <!-- Head -->
  <circle cx="75" cy="130" r="22" fill="#ffedd5"/>
  <!-- Hair -->
  <path d="M53 130 Q53 105 75 105 Q97 105 97 130 L97 135 Q75 125 53 135 Z" fill="#475569"/>
  <!-- Face: Happy/Easy expression -->
  <path d="M78 132 A2 2 0 1 1 77.9 132" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M88 132 A2 2 0 1 1 87.9 132" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M78 142 Q83 147 88 142" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Decorative Context: Potted Plant -->
  <rect x="35" y="175" width="20" height="15" rx="2" fill="#92400e"/>
  <path d="M45 175 Q35 155 45 145 Q55 155 45 175" fill="#10b981"/>
  <path d="M45 175 Q55 160 65 155 Q55 170 45 175" fill="#059669"/>

  <!-- Light rays from button to emphasize "Easy/Operation" -->
  <line x1="150" y1="85" x2="150" y2="75" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="170" y1="105" x2="180" y2="105" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="165" y1="90" x2="172" y2="83" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>