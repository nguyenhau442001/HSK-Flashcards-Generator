      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bookshelf Background -->
  <rect x="30" y="40" width="180" height="100" rx="4" fill="#334155"/>
  <rect x="40" y="50" width="160" height="30" fill="#475569"/>
  <rect x="40" y="95" width="160" height="30" fill="#475569"/>
  
  <!-- Desk -->
  <rect x="20" y="160" width="200" height="15" fill="#fb923c"/>
