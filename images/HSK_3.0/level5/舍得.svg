  <!-- Father Figure -->
  <path d="M70 160 L70 100 Q70 80 90 80 L110 80 Q130 80 130 100 L130 160" fill="#38bdf8"/>
  <circle cx="100" cy="75" r="15" fill="#fde68a"/>
  
