<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Exam Paper -->
  <rect x="60" y="80" width="120" height="140" rx="4" fill="#f8fafc"/>
  <rect x="75" y="100" width="90" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="75" y="120" width="70" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="75" y="140" width="80" height="8" rx="2" fill="#cbd5e1"/>
  
  <!-- The 'Lucky' Four-Leaf Clover Pen -->
  <path d="M140 180 L160 160 L180 180" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="150" r="12" fill="#10b981"/>
  <path d="M160 150 L175 135 M160 150 L145 135 M160 150 L175 165 M160 150 L145 165" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Golden Glow/Sparkles -->
  <circle cx="180" cy="70" r="4" fill="#fbbf24"/>
  <circle cx="50" cy="90" r="3" fill="#fbbf24"/>
  <path d="M190 100 L195 110 L200 100 L195 90 Z" fill="#fb923c"/>
  
  <!-- Pencil -->
  <rect x="40" y="150" width="10" height="60" rx="2" fill="#ec4899"/>
  <polygon points="40,150 45,140 50,150" fill="#fbbf24"/>
  
  <!-- Atmospheric Depth -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
</svg>