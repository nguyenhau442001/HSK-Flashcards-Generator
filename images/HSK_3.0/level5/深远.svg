<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Futuristic Cityscape Silhouette -->
  <path d="M20 200 L60 160 L100 190 L140 150 L180 180 L220 140 L220 240 L20 240 Z" fill="#334155" opacity="0.6"/>
  
  <!-- Central Concept: The Invention (Holographic Globe/Tech) -->
  <circle cx="120" cy="110" r="45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="120" cy="110" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <path d="M100 110 A20 20 0 1 0 140 110 A20 20 0 1 0 100 110" fill="#fb923c" opacity="0.8"/>
  <path d="M120 90 L120 130 M100 110 L140 110" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Character: Scientist/Observer -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="12" fill="#e2e8f0"/>
    <path d="M12 35 L28 35 L30 70 L10 70 Z" fill="#64748b"/>
    <path d="M15 40 L5 60" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M25 40 L35 60" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Character: Future Generation/Child -->
  <g transform="translate(160, 150)">
    <circle cx="20" cy="20" r="10" fill="#e2e8f0"/>
    <path d="M12 30 L28 30 L25 65 L15 65 Z" fill="#10b981"/>
    <path d="M18 35 L12 55" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M22 35 L28 55" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Ripples of Influence (The "Deep/Far" concept) -->
  <path d="M120 110 C 160 80, 200 140, 220 120" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M120 110 C 80 80, 40 140, 20 120" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Decorative Data Nodes -->
  <circle cx="180" cy="80" r="3" fill="#38bdf8"/>
  <circle cx="50" cy="90" r="3" fill="#fb923c"/>
  <circle cx="150" cy="50" r="4" fill="#10b981"/>
