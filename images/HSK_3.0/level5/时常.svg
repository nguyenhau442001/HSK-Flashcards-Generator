<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(20, 40)">
    <!-- Bookshelves -->
    <rect x="0" y="0" width="40" height="160" rx="4" fill="#334155"/>
    <rect x="160" y="0" width="40" height="160" rx="4" fill="#334155"/>
    <rect x="10" y="20" width="30" height="10" fill="#fbbf24"/>
    <rect x="10" y="60" width="30" height="10" fill="#38bdf8"/>
    <rect x="170" y="40" width="30" height="10" fill="#ec4899"/>
    <rect x="170" y="100" width="30" height="10" fill="#10b981"/>
    
    <!-- Table -->
    <rect x="40" y="120" width="120" height="10" rx="2" fill="#fb923c"/>
    <rect x="50" y="130" width="10" height="30" fill="#fb923c"/>
    <rect x="140" y="130" width="10" height="30" fill="#fb923c"/>
    
    <!-- Character -->
    <circle cx="100" cy="80" r="20" fill="#fde68a"/>
    <path d="M85 100 Q100 120 115 100" stroke="#fde68a" stroke-width="6" fill="none"/>
    <rect x="80" y="100" width="40" height="20" rx="4" fill="#38bdf8"/>
    
    <!-- Book -->
    <path d="M70 110 L130 110 L125 125 L75 125 Z" fill="#f59e0b"/>
    <path d="M100 110 L100 125" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Ambient Light/Atmosphere -->
    <circle cx="120" cy="40" r="30" fill="#f59e0b" opacity="0.1"/>
    <circle cx="120" cy="40" r="15" fill="#f59e0b" opacity="0.2"/>
  </g>
</svg>