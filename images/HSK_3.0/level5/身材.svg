<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="mirrorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="outfitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Details / Environment Context -->
  <!-- Wallpaper accent lines -->
  <path d="M 0 50 L 240 50" stroke="#334155" stroke-width="1.5" opacity="0.4" />
  <path d="M 0 190 L 240 190" stroke="#334155" stroke-width="2" opacity="0.6" />
  <rect x="0" y="190" width="240" height="50" fill="url(#floorGrad)" />

  <!-- Window with night city glow -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="45" height="90" rx="4" fill="#090d16" stroke="#475569" stroke-width="2" />
    <rect x="5" y="5" width="15" height="38" rx="2" fill="#38bdf8" opacity="0.2" />
    <rect x="25" y="5" width="15" height="38" rx="2" fill="#fbbf24" opacity="0.2" />
    <rect x="5" y="47" width="15" height="38" rx="2" fill="#ec4899" opacity="0.2" />
    <rect x="25" y="47" width="15" height="38" rx="2" fill="#38bdf8" opacity="0.3" />
    <!-- Curtain Left -->
    <path d="M 0 0 C 10 20, 5 70, 0 90 Z" fill="#64748b" opacity="0.5" />
    <!-- Curtain Right -->
    <path d="M 45 0 C 35 20, 40 70, 45 90 Z" fill="#64748b" opacity="0.5" />
  </g>

  <!-- Potted Plant (Adds natural lively environment) -->
  <g transform="translate(195, 130)">
    <!-- Pot -->
    <path d="M 10 35 L 20 60 L 35 60 L 45 35 Z" fill="#cbd5e1" />
    <ellipse cx="27.5" cy="35" rx="17.5" ry="4" fill="#94a3b8" />
    <!-- Leaves -->
    <path d="M 27.5 35 C 20 20, 5 15, 0 5 C 10 10, 20 20, 27.5 35 Z" fill="url(#plantGrad)" />
    <path d="M 27.5 35 C 35 15, 50 10, 55 0 C 45 10, 35 20, 27.5 35 Z" fill="url(#plantGrad)" />
    <path d="M 27.5 35 C 25 10, 27.5 -5, 30 -10 C 32.5 -5, 30 10, 27.5 35 Z" fill="#34d399" />
  </g>

  <!-- Floor Lamp -->
  <g transform="translate(170, 40)">
    <circle cx="15" cy="15" r="30" fill="url(#lampGlow)" />
    <path d="M 15 45 L 15 150" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M 5 15 L 25 15 L 30 45 L 0 45 Z" fill="#fde047" opacity="0.9" />
    <ellipse cx="15" cy="150" rx="12" ry="4" fill="#475569" />
  </g>

  <!-- Large Standing Mirror (Center-Left Focal Element) -->
  <g transform="translate(65, 25)" filter="url(#softShadow)">
    <!-- Mirror Outer Frame -->
    <rect x="0" y="0" width="75" height="175" rx="37.5" fill="#334155" stroke="#64748b" stroke-width="3" />
    <!-- Mirror Glass & Reflection Base -->
    <rect x="5" y="5" width="65" height="165" rx="32.5" fill="#0f172a" />
    <rect x="5" y="5" width="65" height="165" rx="32.5" fill="url(#mirrorGlow)" />
    <!-- Mirror Highlight sheen -->
    <path d="M 12 15 Q 25 50, 15 100" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25" />
    <!-- Mirror Stand Back Leg -->
    <path d="M 37.5 175 L 37.5 195 M 20 185 L 55 185" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Main Character: Stylish, Confident Woman admiring her well-proportioned figure (身材) -->
  <g transform="translate(95, 45)">
    <!-- Shadow beneath character -->
    <ellipse cx="25" cy="153" rx="22" ry="5" fill="#000000" opacity="0.4" />

    <!-- Body / Posture: S-curve indicating healthy, athletic, elegant vóc dáng (身材) -->
    <!-- Legs -->
    <g stroke="#1e293b" stroke-linecap="round" stroke-linejoin="round">
      <!-- Back Leg -->
      <path d="M 20 110 L 15 140 L 10 150" fill="none" stroke-width="8" />
      <!-- Front Leg (slight pose) -->
      <path d="M 30 110 L 35 140 L 40 150" fill="none" stroke-width="8" />
    </g>
    
    <!-- Shoes -->
    <path d="M 6 150 L 14 150 L 14 153 L 6 153 Z" fill="#38bdf8" rx="1" />
    <path d="M 38 150 L 46 150 L 46 153 L 38 153 Z" fill="#38bdf8" rx="1" />

    <!-- Torso & Fitted Outfit (highlights silhouette/vóc dáng) -->
    <path d="M 17 75 Q 33 70, 36 95 L 34 115 L 18 115 L 16 95 Z" fill="url(#outfitGrad)" />

    <!-- Waist definition (emphasizing good shape) -->
    <path d="M 21 87 Q 26 90, 31 87" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" />

    <!-- Arms: Relaxed and confident pose, one hand on hip -->
    <!-- Back Arm -->
    <path d="M 18 78 Q 8 95, 14 105" fill="none" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" />
    <!-- Front Arm (Hand on hip) -->
    <path d="M 34 78 Q 45 90, 36 102" fill="none" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M 23 66 L 23 75" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" />

    <!-- Head & Hair -->
    <!-- Long flowing dark brown hair -->
    <path d="M 13 45 C 10 65, 12 85, 20 95 C 15 80, 15 60, 18 45 Z" fill="#1e1b4b" />
    <path d="M 33 45 C 38 65, 36 85, 30 95 C 34 80, 34 60, 31 45 Z" fill="#1e1b4b" />
    
    <!-- Face Profile / 3/4 View -->
    <circle cx="26" cy="48" r="13" fill="#fbcfe8" />
    
    <!-- Hair Front/Bangs -->
    <path d="M 15 42 C 20 35, 32 37, 37 46 C 33 41, 20 40, 15 42 Z" fill="#1e1b4b" />
    
    <!-- Facial Features (Happy, confident smile) -->
    <path d="M 32 48 Q 34 50, 32 52" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="29" cy="47" r="1.5" fill="#1e1b4b" />
    <!-- Blush -->
    <circle cx="31" cy="51" r="2.5" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- Sparkles / Aesthetic Appreciation Accents (Visualizing "很" - very good/beautiful) -->
  <g transform="translate(45, 75)" fill="#fbbf24">
    <path d="M 0 5 C 3 5, 5 3, 5 0 C 5 3, 7 5, 10 5 C 7 5, 5 7, 5 10 C 5 7, 3 5, 0 5 Z" />
  </g>
  <g transform="translate(135, 110)" fill="#38bdf8">
    <path d="M 0 4 C 2 4, 4 2, 4 0 C 4 2, 6 4, 8 4 C 6 4, 4 6, 4 8 C 4 6, 2 4, 0 4 Z" />
  </g>
  <g transform="translate(115, 35)" fill="#ec4899">
    <path d="M 0 6 C 4 6, 6 4, 6 0 C 6 4, 8 6, 12 6 C 8 6, 6 8, 6 12 C 6 8, 4 6, 0 6 Z" />
  </g>
  <circle cx="55" cy="145" r="3" fill="#34d399" opacity="0.8" />
  <circle cx="155" cy="70" r="2" fill="#fbbf24" opacity="0.9" />

  <!-- Foreground decorative elements for depth (Rug) -->
  <ellipse cx="120" cy="195" rx="60" ry="12" fill="#334155" opacity="0.4" />
</svg>