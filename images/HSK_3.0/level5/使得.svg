<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="30" y="170" width="180" height="60" fill="#1e293b"/>
  
  <!-- Laptop -->
  <path d="M60 160 L180 160 L190 130 L50 130 Z" fill="#475569"/>
  <path d="M65 135 L175 135 L170 155 L70 155 Z" fill="#38bdf8"/>
  <circle cx="120" cy="145" r="3" fill="#0f172a" opacity="0.3"/>
  
  <!-- Character: Relaxed person sitting -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <path d="M-10 -5 A 10 10 0 0 1 10 -5" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="-8" cy="-8" r="2" fill="#475569"/>
    <circle cx="8" cy="-8" r="2" fill="#475569"/>
    <path d="M-5 5 Q 0 10 5 5" stroke="#ec4899" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Floating elements representing internet convenience -->
  <g fill="#fbbf24">
    <path d="M200 50 L210 40 L220 50 L210 60 Z" opacity="0.8"/>
    <path d="M30 60 L35 55 L40 60 L35 65 Z" opacity="0.6"/>
    <circle cx="190" cy="90" r="4" opacity="0.7"/>
    <circle cx="50" cy="100" r="3" opacity="0.5"/>
  </g>
  
  <!-- Coffee Cup -->
  <rect x="190" y="140" width="20" height="20" rx="2" fill="#fb923c"/>
  <path d="M210 145 h5 a3 3 0 0 1 0 6 h-5" stroke="#fb923c" stroke-width="3" fill="none"/>
  
  <!-- Connection lines -->
  <path d="M120 130 L120 100" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M170 130 Q 190 100 200 80" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M70 130 Q 50 100 40 80" stroke="#38bdf8" stroke-width="2" fill="none"/>
</svg>