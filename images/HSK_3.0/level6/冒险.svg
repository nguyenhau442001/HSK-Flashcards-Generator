<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Canyon Rock Gradient -->
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="rockGradRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Golden Light / Sunset Glow -->
    <linearGradient id="skyGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Rope Bridge Plank Texture -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Backpack Gradient -->
    <linearGradient id="backpackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    
    <!-- Waterfall / River Mist -->
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Distant Mountains & Sky Glow -->
  <path d="M0 160 L60 110 L120 140 L180 100 L240 150 L240 240 L0 240 Z" fill="#0f172a" opacity="0.7"/>
  <rect x="0" y="0" width="240" height="240" rx="24" fill="url(#skyGlow)" pointer-events="none"/>

  <!-- Atmospheric Light Beams -->
  <polygon points="120,40 40,240 80,240" fill="#fbbf24" opacity="0.05" />
  <polygon points="120,40 160,240 200,240" fill="#38bdf8" opacity="0.05" />

  <!-- Left Canyon Cliff -->
  <path d="M0 0 L70 0 L50 80 L80 160 L30 240 L0 240 Z" fill="url(#rockGrad)" />
  <path d="M0 0 L45 0 L30 90 L50 170 L0 220 Z" fill="#1e293b" opacity="0.5" /> <!-- Cliff details -->

  <!-- Right Canyon Cliff -->
  <path d="M240 0 L180 0 L200 90 L170 170 L220 240 L240 240 Z" fill="url(#rockGradRight)" />
  <path d="M240 0 L195 0 L215 85 L190 165 L240 210 Z" fill="#0f172a" opacity="0.6" />

  <!-- Deep Abyss & Mist at bottom -->
  <rect x="0" y="200" width="240" height="40" fill="url(#mistGrad)" />

  <!-- 3D Suspended Rope Bridge (The Adventure Element) -->
  <!-- Bridge Support Ropes -->
  <path d="M 40 120 Q 120 180 200 130" fill="none" stroke="#78350f" stroke-width="3" filter="url(#shadow)" />
  <path d="M 40 135 Q 120 195 200 145" fill="none" stroke="#92400e" stroke-width="2" />
  
  <!-- Vertical Ropes / Posts -->
  <line x1="60" y1="123" x2="60" y2="137" stroke="#78350f" stroke-width="2" />
  <line x1="90" y1="132" x2="90" y2="148" stroke="#78350f" stroke-width="2" />
  <line x1="120" y1="137" x2="120" y2="155" stroke="#78350f" stroke-width="2" />
  <line x1="150" y1="136" x2="150" y2="152" stroke="#78350f" stroke-width="2" />
  <line x1="180" y1="130" x2="180" y2="145" stroke="#78350f" stroke-width="2" />

  <!-- Wooden Planks -->
  <g filter="url(#shadow)">
    <rect x="55" y="137" width="12" height="6" rx="1" fill="url(#woodGrad)" />
    <rect x="75" y="143" width="12" height="6" rx="1" fill="url(#woodGrad)" />
    <rect x="95" y="148" width="12" height="6" rx="1" fill="url(#woodGrad)" />
    <rect x="115" y="152" width="12" height="6" rx="1" fill="url(#woodGrad)" />
    <rect x="135" y="150" width="12" height="6" rx="1" fill="url(#woodGrad)" />
    <rect x="155" y="146" width="12" height="6" rx="1" fill="url(#woodGrad)" />
    <rect x="175" y="141" width="12" height="6" rx="1" fill="url(#woodGrad)" />
  </g>

  <!-- ACTION CHARACTER (Adventurer traversing the bridge) -->
  <g id="adventurer" transform="translate(105, 105)" filter="url(#shadow)">
    <!-- Motion lines / wind effect -->
    <path d="M -15 15 L -25 12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M -10 25 L -22 23" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Backpack -->
    <rect x="-12" y="8" width="10" height="14" rx="3" fill="url(#backpackGrad)" />
    <path d="M -15 12 L -12 12" stroke="#991b1b" stroke-width="2" />
    <sleeping-bag /> <!-- rolled mat on top of backpack -->
    <rect x="-13" y="6" width="12" height="4" rx="2" fill="#fb923c" />

    <!-- Body / Jacket (Explorer Orange/Yellow) -->
    <path d="M -5 10 L 8 12 L 5 25 L -8 24 Z" fill="#fbbf24" />

    <!-- Head & Explorer Hat -->
    <circle cx="2" cy="1" r="7" fill="#fcd34d" /> <!-- Face -->
    <!-- Hat Brim -->
    <ellipse cx="2" cy="-4" rx="9" ry="3" fill="#d97706" />
    <!-- Hat Top -->
    <path d="M -4 -4 C -4 -9 8 -9 8 -4 Z" fill="#b45309" />
    <!-- Hat Band -->
    <rect x="-4" y="-5" width="12" height="2" fill="#1e293b" />

    <!-- Limbs in motion (Dynamic Walking Pose) -->
    <!-- Back Leg -->
    <path d="M -5 22 L -12 33 L -8 36" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Leg -->
    <path d="M 3 24 L 10 32 L 15 30" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hiking Boots -->
    <circle cx="-8" cy="36" r="2.5" fill="#78350f" />
    <circle cx="15" cy="30" r="2.5" fill="#78350f" />

    <!-- Back Arm (Holding balance pole or reaching back) -->
    <path d="M -7 13 L -18 18" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
    <!-- Front Arm (Reaching forward for balance) -->
    <path d="M 6 14 L 18 10" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />

    <!-- Long Balancing Stick -->
    <line x1="-24" y1="21" x2="26" y2="5" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Vegetation / Detail (Cliff edge flora) -->
  <path d="M 50 155 Q 55 145 60 155" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <circle cx="58" cy="148" r="3" fill="#34d399" />
  <circle cx="63" cy="151" r="2.5" fill="#34d399" />

  <path d="M 180 140 Q 185 130 190 142" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <circle cx="188" cy="135" r="3.5" fill="#34d399" />

  <!-- Floating Adventure Particles / Dust in the canyon -->
  <circle cx="90" cy="100" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="150" cy="80" r="2" fill="#f59e0b" opacity="0.8" />
  <circle cx="130" cy="115" r="1" fill="#38bdf8" opacity="0.7" />
  <circle cx="70" cy="180" r="2" fill="#fbbf24" opacity="0.4" />
  <circle cx="170" cy="190" r="1.5" fill="#38bdf8" opacity="0.5" />

  <!-- Compass / Adventure Accent Icon subtle floating top-right (No text, pure graphical element) -->
  <g transform="translate(205, 35)" filter="url(#shadow)" opacity="0.85">
    <circle cx="0" cy="0" r="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <polygon points="0,-8 3,2 0,6 -3,2" fill="#ef4444" />
    <polygon points="0,8 3,-2 0,-6 -3,-2" fill="#cbd5e1" />
    <circle cx="0" cy="0" r="2" fill="#fbbf24" />
  </g>
</svg>