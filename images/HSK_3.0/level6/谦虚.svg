<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>
  
  <!-- Ambient background decorative particles -->
  <circle cx="45" cy="50" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="195" cy="40" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="210" cy="90" r="1" fill="#38bdf8" opacity="0.5"/>
  <circle cx="30" cy="110" r="1.5" fill="#fbbf24" opacity="0.5"/>

  <!-- Stage / Podium Environment (Contextual Scene) -->
  <ellipse cx="120" cy="200" rx="75" ry="18" fill="#0f172a" opacity="0.8"/>
  <path d="M 60,185 L 180,185 L 170,210 L 70,210 Z" fill="url(#podiumGrad)"/>
  <ellipse cx="120" cy="185" rx="60" ry="12" fill="#475569"/>

  <!-- Floating Trophies & Awards (Achievements) in Background -->
  <!-- Silver Trophy Background Left -->
  <g transform="translate(65, 105) scale(0.6)">
    <path d="M 20,10 L 30,10 L 28,35 C 28,45 22,48 15,48 C 8,48 2,45 2,35 L 0,10 Z" fill="#94a3b8"/>
    <path d="M 15,48 L 15,65" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <rect x="5" y="65" width="20" height="8" rx="2" fill="#475569"/>
    <path d="M 6,14 C 2,14 -2,18 -2,24 C -2,28 3,32 8,32" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 24,14 C 28,14 32,18 32,24 C 32,28 27,32 22,32" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Gold Trophy Background Right -->
  <g transform="translate(150, 95) scale(0.75)">
    <path d="M 20,8 L 30,8 L 27,33 C 27,43 21,46 15,46 C 9,46 3,43 3,33 L 0,8 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <path d="M 15,46 L 15,62" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
    <rect x="7" y="62" width="16" height="8" rx="2" fill="#b45309"/>
    <!-- Trophy handles -->
    <path d="M 5,12 C 0,12 -3,16 -3,21 C -3,26 2,29 7,29" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 25,12 C 30,12 33,16 33,21 C 33,26 28,29 23,29" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- MAIN CHARACTER: Modest Achiever (謙虚 - bowing slightly, holding award with a gentle, humble smile) -->
  <g transform="translate(0, 10)">
    <!-- Character Shadow -->
    <ellipse cx="120" cy="180" rx="35" ry="8" fill="#090d16" opacity="0.6"/>

    <!-- Body / Suit (Professional yet approachable) -->
    <!-- Torso tilted slightly forward -->
    <g transform="translate(120, 145) rotate(12)">
      <!-- Suit Jacket -->
      <path d="M -22,-20 L 22,-20 C 26,0 24,30 20,40 L -20,40 C -24,30 -26,0 -22,-20 Z" fill="#1e293b"/>
      <!-- Shirt Inner -->
      <path d="M -8,-20 L 8,-20 L 5,10 L -5,10 Z" fill="#f8fafc"/>
      <!-- Tie -->
      <polygon points="0,-15 4,-5 2,15 0,18 -2,15 -4,-5" fill="#ef4444"/>
      
      <!-- Arms -->
      <!-- Left Arm (Holding the award carefully near chest) -->
      <path d="M -20,-15 C -30,-5 -25,15 -10,18" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
      <!-- Right Arm (Gently waving/gesturing modestly, elbow bent) -->
      <path d="M 20,-15 C 32,-10 32,15 20,22" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
      <!-- Hands -->
      <circle cx="-10" cy="18" r="5" fill="#fbcfe8"/>
      <circle cx="20" cy="22" r="5" fill="#fbcfe8"/>
    </g>

    <!-- Head & Face (Bowing head slightly downward, eyes closed happily/modestly, smiling softly) -->
    <g transform="translate(125, 110) rotate(15)">
      <!-- Neck -->
      <rect x="-5" y="8" width="10" height="10" fill="#fbcfe8"/>
      
      <!-- Hair (Neat modern dark hair) -->
      <path d="M -16,-2 C -18,-16 -5,-22 8,-20 C 18,-18 22,-8 20,2 C 18,4 16,-2 10,-6 C 2,-10 -8,-6 -16,-2 Z" fill="#0f172a"/>

      <!-- Face Base -->
      <circle cx="2" cy="0" r="15" fill="#fed7aa"/>

      <!-- Blush (Modesty cue) -->
      <ellipse cx="-4" cy="5" rx="3" ry="1.5" fill="#f43f5e" opacity="0.4"/>
      <ellipse cx="10" cy="5" rx="3" ry="1.5" fill="#f43f5e" opacity="0.4"/>

      <!-- Eyes (Happy closed curves ^ ^) -->
      <path d="M -6,0 C -4,-3 -1,-3 1,0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <path d="M 6,-1 C 8,-4 11,-4 13,-1" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

      <!-- Gentle Humble Smile -->
      <path d="M 1,6 C 3,8 7,8 9,6" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Small Award Plaque / Medal held close to chest -->
    <g transform="translate(108, 148) rotate(12)">
      <circle cx="0" cy="0" r="10" fill="url(#goldGrad)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="7" fill="#f59e0b"/>
      <!-- Star on medal -->
      <polygon points="0,-4 1,-1 4,-1 2,1 3,4 0,2 -3,4 -2,1 -4,-1 -1,-1" fill="#fffbeb"/>
      <!-- Ribbon -->
      <path d="M -4,-10 L -8,-18 L -2,-16 Z" fill="#ef4444"/>
      <path d="M 4,-10 L 8,-18 L 2,-16 Z" fill="#3b82f6"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Elements / Floating Sparkles (Success / Achievement Context) -->
  <g transform="translate(160, 110)">
    <path d="M 0,0 L 2,6 L 8,8 L 2,10 L 0,16 L -2,10 L -8,8 L -2,6 Z" fill="#fbbf24" opacity="0.9" transform="scale(0.6)" filter="url(#glow)"/>
  </g>
  <g transform="translate(75, 80)">
    <path d="M 0,0 L 1.5,4.5 L 6,6 L 1.5,7.5 L 0,12 L -1.5,7.5 L -6,6 L -1.5,4.5 Z" fill="#38bdf8" opacity="0.8" transform="scale(0.8)"/>
  </g>
  <g transform="translate(90, 65)">
    <path d="M 0,0 L 2,6 L 8,8 L 2,10 L 0,16 L -2,10 L -8,8 L -2,6 Z" fill="#fbbf24" opacity="0.7" transform="scale(0.5)"/>
  </g>

  <!-- Additional Narrative Props: Acknowledgment notes or subtle celebratory confetti -->
  <rect x="50" y="160" width="12" height="8" rx="1.5" fill="#38bdf8" transform="rotate(-15 56 164)" opacity="0.8"/>
  <rect x="180" y="150" width="10" height="6" rx="1" fill="#ec4899" transform="rotate(25 185 153)" opacity="0.8"/>
  <rect x="165" y="180" width="14" height="9" rx="1.5" fill="#fbbf24" transform="rotate(10 172 184)" opacity="0.7"/>

  <!-- Border Frame Accent (Clean UI integration) -->
  <rect x="4" y="4" width="232" height="232" rx="20" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>