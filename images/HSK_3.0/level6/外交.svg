<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window City Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Office Interior -->
  <!-- Window overlooking city skyline at night -->
  <g transform="translate(140, 25)">
    <rect x="0" y="0" width="70" height="95" rx="4" fill="#0b1329" stroke="#334155" stroke-width="2" />
    <!-- Window pane inner glow -->
    <rect x="4" y="4" width="62" height="87" fill="url(#windowGlow)" />
    <!-- Window grid -->
    <line x1="35" y1="4" x2="35" y2="91" stroke="#334155" stroke-width="2" />
    <line x1="4" y1="50" x2="66" y2="50" stroke="#334155" stroke-width="2" />
    <!-- Distant city lights -->
    <rect x="10" y="30" width="6" height="15" fill="#f59e0b" opacity="0.6" rx="1" />
    <rect x="20" y="20" width="8" height="25" fill="#38bdf8" opacity="0.4" rx="1" />
    <rect x="42" y="35" width="7" height="15" fill="#fb923c" opacity="0.5" rx="1" />
    <rect x="54" y="25" width="5" height="25" fill="#38bdf8" opacity="0.5" rx="1" />
  </g>

  <!-- Bookshelf / Diplomatic Reference Books -->
  <g transform="translate(20, 35)">
    <rect x="0" y="0" width="45" height="12" rx="2" fill="#334155" />
    <rect x="5" y="-22" width="7" height="22" fill="#ef4444" rx="1" />
    <rect x="13" y="-28" width="8" height="28" fill="#3b82f6" rx="1" />
    <rect x="22" y="-18" width="6" height="18" fill="#10b981" rx="1" />
    <rect x="29" y="-25" width="9" height="25" fill="#f59e0b" rx="1" />
  </g>

  <!-- Wooden Office Desk Surface -->
  <path d="M10 180 L230 180 L210 215 L30 215 Z" fill="#334155" />
  <path d="M10 174 L230 174 L230 180 L10 180 Z" fill="#475569" />

  <!-- Desk Props: Globe (representing international/diplomacy) -->
  <g transform="translate(45, 135)">
    <!-- Stand -->
    <path d="M12 35 L20 35 L16 20 Z" fill="#94a3b8" />
    <path d="M6 35 C6 15 26 15 26 35" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Sphere -->
    <circle cx="16" cy="18" r="14" fill="#38bdf8" />
    <!-- Continents silhouette stylized -->
    <path d="M10 12 Q14 8 20 12 T18 24 Q12 26 10 12 Z" fill="#0ea5e9" opacity="0.7" />
    <circle cx="16" cy="38" r="10" fill="#64748b" />
  </g>

  <!-- Desk Props: Laptop & Documents -->
  <g transform="translate(160, 150)">
    <!-- Laptop Base -->
    <polygon points="0,20 40,20 48,32 -8,32" fill="#cbd5e1" />
    <polygon points="6,22 34,22 36,30 4,30" fill="#475569" />
    <!-- Laptop Screen -->
    <polygon points="3,20 37,20 33,-8 7,-8" fill="#94a3b8" />
    <polygon points="6,17 34,17 31,-5 9,-5" fill="#0f172a" />
    <!-- Screen UI lines representing video conference / treaty text -->
    <line x1="12" y1="0" x2="22" y2="0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="5" x2="28" y2="5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="10" x2="18" y2="10" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Flag stand (Diplomatic element) -->
  <g transform="translate(15, 100)">
    <line x1="5" y1="0" x2="5" y2="80" stroke="#94a3b8" stroke-width="2.5" />
    <!-- Flag waving -->
    <path d="M5 5 C15 2 25 8 32 5 C32 18 25 22 15 20 C10 19 8 16 5 15 Z" fill="#ef4444" />
    <!-- Gold base -->
    <ellipse cx="5" cy="80" rx="8" ry="3" fill="#f59e0b" />
  </g>

  <!-- Desk Lamp & Ambient Light -->
  <circle cx="110" cy="110" r="45" fill="url(#lampGlow)" />
  <g transform="translate(95, 135)">
    <!-- Lamp base -->
    <ellipse cx="15" cy="32" rx="10" ry="4" fill="#f59e0b" />
    <path d="M12 32 L15 15 L18 32 Z" fill="#d97706" />
    <!-- Lamp shade -->
    <path d="M3 15 L27 15 L20 3 L10 3 Z" fill="#fbbf24" />
  </g>

  <!-- Main Character (Diplomat / Foreign Affairs Official) -->
  <g transform="translate(90, 85)">
    <!-- Suit Body / Torso -->
    <path d="M20 50 C10 50 2 60 0 90 L60 90 C58 60 50 50 40 50 Z" fill="#1e293b" />
    
    <!-- Crisp White Shirt Collar -->
    <polygon points="20,50 30,62 40,50 35,45 25,45" fill="#f8fafc" />
    
    <!-- Diplomatic Tie (Red/Gold accent) -->
    <polygon points="28,52 32,52 34,72 30,76 26,72" fill="#ef4444" />
    <polygon points="29,52 31,52 32,58 30,58" fill="#fbbf24" />

    <!-- Head and Neck -->
    <rect x="25" y="36" width="10" height="14" fill="#fed7aa" />
    <circle cx="30" cy="25" r="16" fill="#fed7aa" />

    <!-- Neat Professional Hair (Dark, styled back) -->
    <path d="M14 24 C14 12 22 10 30 10 C40 10 46 16 46 26 C46 26 44 20 40 16 C34 10 24 12 16 18 Z" fill="#0f172a" />

    <!-- Friendly, Focused Facial Expression -->
    <!-- Glasses (Professional look) -->
    <rect x="20" y="20" width="9" height="7" rx="1.5" fill="none" stroke="#334155" stroke-width="1.5" />
    <rect x="31" y="20" width="9" height="7" rx="1.5" fill="none" stroke="#334155" stroke-width="1.5" />
    <line x1="29" y1="23" x2="31" y2="23" stroke="#334155" stroke-width="1.5" />
    <!-- Eyes (Confident & friendly dots/curves) -->
    <circle cx="24.5" cy="23.5" r="1" fill="#0f172a" />
    <circle cx="35.5" cy="23.5" r="1" fill="#0f172a" />
    <!-- Smile -->
    <path d="M27 30 Q30 33 33 30" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

    <!-- Active Gesture: Writing / Reviewing Diplomatic Documents -->
    <!-- Right Arm & Hand holding fountain pen -->
    <path d="M45 55 Q55 65 50 78" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="49" cy="80" r="4" fill="#fed7aa" />
    <!-- Golden Fountain Pen -->
    <line x1="48" y1="78" x2="55" y2="85" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Left Arm resting naturally -->
    <path d="M15 55 Q8 68 15 80" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <circle cx="16" cy="82" r="4" fill="#fed7aa" />
  </g>

  <!-- Documents on Desk in front of character -->
  <g transform="translate(95, 160)">
    <!-- Document 1 -->
    <polygon points="10,5 50,0 55,25 15,30" fill="#ffffff" />
    <line x1="18" y1="8" x2="35" y2="6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="16" y1="14" x2="42" y2="11" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="15" y1="20" x2="30" y2="18" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <!-- Red Official Seal / Stamp (Common in official/diplomatic docs) -->
    <circle cx="43" cy="20" r="5" fill="#ef4444" opacity="0.8" />
  </g>
</svg>