<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bikeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="windshield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Night Elements / City Glow -->
  <circle cx="190" cy="50" r="30" fill="#f59e0b" opacity="0.1" />
  <circle cx="50" cy="80" r="40" fill="#38bdf8" opacity="0.08" />

  <!-- City Skyline Silhouette -->
  <path d="M10 150 L10 110 L25 110 L25 150 L40 150 L40 90 L60 90 L60 150 L80 150 L80 120 L95 120 L95 150 L120 150 L120 100 L140 100 L140 150 L170 150 L170 85 L195 85 L195 150 L220 150 L220 105 L235 105 L235 150 Z" fill="#1e293b" opacity="0.6" />

  <!-- Street / Road -->
  <path d="M0 150 L240 150 L240 220 L0 220 Z" fill="url(#roadGrad)" />
  <!-- Speed lines / Road dashes -->
  <line x1="20" y1="185" x2="60" y2="185" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.7" />
  <line x1="90" y1="185" x2="150" y2="185" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.7" />
  <line x1="180" y1="185" x2="220" y2="185" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.7" />

  <!-- Motion lines behind motorcycle -->
  <path d="M20 135 Q 60 130 90 135" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M30 145 Q 70 140 100 145" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M10 160 Q 50 155 80 160" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- ================= MOTORCYCLE (摩托车) ================= -->
  <g transform="translate(45, 75)">
    
    <!-- Headlight Beam -->
    <path d="M 125 45 L 180 20 L 180 85 Z" fill="#fef08a" opacity="0.25" />
    
    <!-- Rear Wheel -->
    <circle cx="35" cy="65" r="24" fill="#0f172a" stroke="#334155" stroke-width="5" />
    <circle cx="35" cy="65" r="14" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6 4" />
    <circle cx="35" cy="65" r="4" fill="#94a3b8" />

    <!-- Front Wheel -->
    <circle cx="125" cy="65" r="24" fill="#0f172a" stroke="#334155" stroke-width="5" />
    <circle cx="125" cy="65" r="14" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6 4" />
    <circle cx="125" cy="65" r="4" fill="#94a3b8" />

    <!-- Suspension / Underbody -->
    <line x1="35" y1="65" x2="75" y2="55" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="125" y1="65" x2="105" y2="50" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <circle cx="75" cy="50" r="10" fill="#334155" />

    <!-- Main Body / Fairing -->
    <path d="M 40 45 Q 70 20 115 35 L 120 55 L 80 60 L 45 60 Z" fill="url(#bikeBody)" />
    <!-- Accent Stripe on Body -->
    <path d="M 55 42 Q 75 28 105 38" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Seat -->
    <path d="M 35 32 Q 55 25 75 32 L 80 40 L 35 40 Z" fill="#0f172a" />

    <!-- Handlebars & Front Fork -->
    <path d="M 105 35 L 120 15" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <path d="M 112 25 L 128 27" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" /> <!-- Handlebar grip -->
    <path d="M 105 35 L 125 65" stroke="#64748b" stroke-width="5" stroke-linecap="round" /> <!-- Fork -->

    <!-- Windshield -->
    <path d="M 110 32 L 122 12 L 128 25 L 115 36 Z" fill="url(#windshield)" />

    <!-- Headlight -->
    <path d="M 122 35 C 128 35 130 42 126 48 C 123 48 120 45 120 40 Z" fill="#fef08a" filter="url(#glow)" />

    <!-- Tail Light -->
    <path d="M 35 35 C 32 35 30 38 32 42 C 34 42 36 40 35 35 Z" fill="#f43f5e" filter="url(#glow)" />

    <!-- Exhaust Pipe -->
    <path d="M 45 60 L 25 65 L 15 55" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- ================= RIDER ================= -->
    <!-- Helmet -->
    <g transform="translate(68, -2)">
      <!-- Head/Helmet Base -->
      <path d="M 0 12 C -2 -2 15 -10 26 -2 C 34 4 35 18 28 24 C 22 28 8 28 0 12 Z" fill="#38bdf8" />
      <!-- Visor -->
      <path d="M 16 2 C 24 2 28 8 26 14 C 22 14 18 10 16 2 Z" fill="#0f172a" />
      <!-- Helmet Accent -->
      <path d="M 5 2 C 12 -4 20 -2 24 2" stroke="#bae6fd" stroke-width="2" fill="none" stroke-linecap="round" />
      <!-- Backpack peek -->
      <path d="M -8 18 C -14 20 -16 30 -12 38 L -2 35 Z" fill="#10b981" />
    </g>

    <!-- Torso (Leaning forward dynamically) -->
    <path d="M 52 35 Q 75 15 88 32 L 78 52 Q 62 48 48 45 Z" fill="#10b981" />
    
    <!-- Rider Arms -->
    <path d="M 72 32 Q 95 30 115 27" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Hands on handlebars -->
    <circle cx="116" cy="27" r="4" fill="#fb923c" />

    <!-- Rider Legs -->
    <path d="M 52 42 Q 40 50 45 62 L 62 60" stroke="#334155" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Shoe -->
    <ellipse cx="43" cy="64" rx="6" ry="3" fill="#f59e0b" />

  </g>

  <!-- Foreground Atmospheric Particles / Stars / Lights -->
  <circle cx="30" cy="40" r="1.5" fill="#fef08a" opacity="0.8" />
  <circle cx="90" cy="30" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="150" cy="50" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="210" cy="35" r="1.5" fill="#f43f5e" opacity="0.8" />
  
  <!-- Floating Speed / Action Sparkles -->
  <g transform="translate(180, 100)" opacity="0.8">
    <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(200, 125)" opacity="0.6">
    <path d="M 0 0 L 6 3 L 0 6 L 2 3 Z" fill="#38bdf8" />
  </g>
</svg>