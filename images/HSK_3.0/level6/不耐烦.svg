<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Accent Gradient for Urgency -->
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- UI Accent Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow for impatience atmosphere -->
  <circle cx="120" cy="120" r="90" fill="url(#warmGlow)" />

  <!-- SCENE: Modern Cafe Counter / Waiting Area -->
  <!-- Counter surface -->
  <path d="M 20 180 L 220 180 L 220 220 L 20 220 Z" fill="#334155" />
  <!-- Counter top edge -->
  <path d="M 15 174 L 225 174 L 220 180 L 20 180 Z" fill="#475569" />
  
  <!-- Coffee Machine in Background -->
  <rect x="35" y="110" width="45" height="64" rx="6" fill="#475569" />
  <rect x="42" y="120" width="31" height="22" rx="3" fill="#1e293b" />
  <circle cx="50" cy="131" r="3" fill="#38bdf8" />
  <!-- Coffee steam -->
  <path d="M 52 110 Q 55 100 50 90 T 52 75" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
  <path d="M 64 110 Q 67 98 62 88 T 65 72" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.3" />

  <!-- Waiting Token Stand / Ticket Holder on Counter -->
  <rect x="175" y="140" width="22" height="34" rx="3" fill="#64748b" />
  <polygon points="186,120 178,140 194,140" fill="#f59e0b" />
  
  <!-- Empty Coffee Cup -->
  <rect x="145" y="150" width="16" height="24" rx="2" fill="#f8fafc" />
  <path d="M 161 156 C 166 156 166 168 161 168" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />

  <!-- MAIN CHARACTER: Impatient Man Sitting at Counter -->
  <!-- Chair Back / Base support -->
  <rect x="90" y="130" width="60" height="50" rx="8" fill="transparent" />

  <!-- Body / Torso (leaning forward aggressively) -->
  <path d="M 95 180 L 115 130 L 145 135 L 135 180 Z" fill="#0284c7" />
  <!-- Shirt collar -->
  <path d="M 115 130 L 125 142 L 135 135" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Head (tilted forward, looking down/right at watch/counter) -->
  <circle cx="118" cy="105" r="22" fill="#ffedd5" />
  <!-- Hair (neat modern cut) -->
  <path d="M 97 100 Q 100 83 120 85 Q 138 87 140 102 Q 135 95 120 93 Q 105 92 97 100 Z" fill="#334155" />

  <!-- Facial Expression: Impatient, frowned eyebrows, tight mouth -->
  <!-- Frowning Eyebrows -->
  <path d="M 106 99 L 116 103" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 124 103 L 133 99" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Eyes (annoyed downward slant) -->
  <circle cx="111" cy="107" r="2" fill="#1e293b" />
  <circle cx="127" cy="107" r="2" fill="#1e293b" />
  <!-- Tight closed/straight annoyed mouth -->
  <path d="M 115 118 L 125 118" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Impatience Sweat Drop -->
  <path d="M 134 95 Q 137 102 134 105 Q 131 102 134 95 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Arms / Hands interacting (Tapping / Checking watch gesture) -->
  <!-- Back Arm -->
  <path d="M 100 140 L 80 160 L 95 170" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Front Arm tapping counter / checking wrist -->
  <path d="M 130 138 L 145 155 L 135 168" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hand on wrist / watch area -->
  <circle cx="135" cy="168" r="6" fill="#ffedd5" />
  <!-- Watch face detail -->
  <rect x="131" y="164" width="8" height="8" rx="2" fill="#f59e0b" />

  <!-- ACTION VIBES & MOTION LINES (Impatience indicators) -->
  <!-- Tapping finger motion lines near the counter -->
  <path d="M 130 178 Q 135 184 140 178" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 138 181 Q 143 187 148 181" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Angry/Impatient pulsing veins near head -->
  <path d="M 98 108 Q 94 105 97 102" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <path d="M 95 106 Q 92 103 95 100" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Floating abstract clock / time pressure element (minimalist style, no text) -->
  <g transform="translate(170, 75)">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
    <polyline points="0,-8 0,0 6,4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="2" fill="#f59e0b" />
    <!-- Pulse ring around clock -->
    <circle cx="0" cy="0" r="23" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  </g>

  <!-- Dynamic Accent Sparks (urgency) -->
  <path d="M 155 60 L 158 68 L 166 71 L 158 74 L 155 82 L 152 74 L 144 71 L 152 68 Z" fill="#fbbf24" transform="scale(0.5) translate(130, 40)" />
  <path d="M 75 80 L 77 85 L 82 87 L 77 89 L 75 94 L 73 89 L 68 87 L 73 85 Z" fill="#38bdf8" transform="scale(0.4) translate(90, 70)" opacity="0.8" />
</svg>