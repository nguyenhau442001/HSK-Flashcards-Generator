<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Window Light Cone -->
    <linearGradient id="lightCone" x1="120" y1="35" x2="120" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Window Moonlight/Night Glow -->
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- BACKGROUND ROOM INTERIOR -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="185" fill="#1e293b"/>
  <!-- Floor Surface -->
  <polygon points="20,205 220,205 240,230 0,230" fill="#0f172a"/>
  <!-- Baseboard line -->
  <line x1="20" y1="205" x2="220" y2="205" stroke="#334155" stroke-width="2"/>

  <!-- Bookshelf on the left (Context Prop) -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="30" height="135" fill="#334155" rx="2"/>
    <rect x="4" y="10" width="22" height="6" fill="#475569" rx="1"/>
    <rect x="4" y="40" width="22" height="6" fill="#475569" rx="1"/>
    <rect x="4" y="70" width="22" height="6" fill="#475569" rx="1"/>
    <rect x="4" y="100" width="22" height="6" fill="#475569" rx="1"/>
    <!-- Colorful book spines -->
    <rect x="6" y="18" width="5" height="20" fill="#f43f5e" rx="1"/>
    <rect x="13" y="16" width="7" height="22" fill="#38bdf8" rx="1"/>
    <rect x="6" y="48" width="6" height="20" fill="#fbbf24" rx="1"/>
    <rect x="14" y="50" width="5" height="18" fill="#a855f7" rx="1"/>
    <rect x="6" y="78" width="12" height="19" fill="#10b981" rx="1"/>
  </g>

  <!-- Large Arch Window in Center/Back (Peaceful Atmosphere) -->
  <g transform="translate(90, 20)">
    <!-- Window Frame Outer -->
    <path d="M 0,60 A 30,30 0 0,1 60,60 L 60,140 L 0,140 Z" fill="#0f172a"/>
    <!-- Window Glass with Gradient -->
    <path d="M 3,60 A 27,27 0 0,1 57,60 L 57,137 L 3,137 Z" fill="url(#windowGlow)"/>
    <!-- Window Panes (Crossbars) -->
    <line x1="30" y1="33" x2="30" y2="137" stroke="#0f172a" stroke-width="3"/>
    <line x1="3" y1="95" x2="57" y2="95" stroke="#0f172a" stroke-width="3"/>
    <!-- Cute Crescent Moon outside -->
    <path d="M 40,38 A 8,8 0 1,1 30,28 A 9,9 0 0,0 40,38 Z" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Light Cone Illuminating the Floor & Chair -->
  <polygon points="90,50 150,50 190,205 50,205" fill="url(#lightCone)" style="mix-blend-mode: screen;"/>

  <!-- Potted Plant on the Right (Cozy Interior Prop) -->
  <g transform="translate(180, 150)">
    <!-- Pot -->
    <path d="M 5,25 L 15,50 L 35,50 L 45,25 Z" fill="#cbd5e1"/>
    <ellipse cx="25" cy="25" rx="20" ry="4" fill="#94a3b8"/>
    <!-- Leaves -->
    <path d="M 25,21 Q 10,10 5,-5 Q 20,5 25,21" fill="url(#leafGrad)"/>
    <path d="M 25,21 Q 35,5 45,-10 Q 38,10 25,21" fill="url(#leafGrad)"/>
    <path d="M 25,21 Q 20,-5 25,-25 Q 30,0 25,21" fill="#10b981"/>
  </g>

  <!-- Cozy Armchair -->
  <g transform="translate(115, 130)">
    <!-- Chair Back -->
    <path d="M 10,10 Q 10,-10 35,-10 Q 60,-10 60,10 L 65,65 L 5,65 Z" fill="#475569" rx="10"/>
    <!-- Chair Cushion / Seat -->
    <rect x="0" y="50" width="70" height="25" fill="#64748b" rx="8"/>
    <!-- Chair Legs -->
    <rect x="8" y="75" width="6" height="15" fill="#334155" rx="2"/>
    <rect x="56" y="75" width="6" height="15" fill="#334155" rx="2"/>
  </g>

  <!-- MAIN CHARACTER: Relaxed Person Reading/Relaxing in the Quiet Room -->
  <g transform="translate(125, 110)">
    <!-- Body / Torso (Sitting, slightly leaning back) -->
    <path d="M 22,22 Q 35,25 40,48 L 12,50 Q 8,35 15,22 Z" fill="#f43f5e"/>
    
    <!-- Head & Hair -->
    <circle cx="28" cy="8" r="11" fill="#fed7aa"/>
    <!-- Hair Style -->
    <path d="M 17,8 Q 18,-3 28,-3 Q 39,-3 39,8 Q 39,12 36,10 Q 30,3 22,5 Z" fill="#334155"/>

    <!-- Arms holding an open book -->
    <!-- Left arm -->
    <path d="M 22,26 Q 10,32 15,40" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
    <!-- Right arm -->
    <path d="M 38,28 Q 48,32 40,42" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>

    <!-- Open Book -->
    <g transform="translate(14, 38)">
      <polygon points="0,5 12,0 24,5 24,18 12,14 0,18" fill="#ffffff"/>
      <!-- Book spine center line -->
      <line x1="12" y1="0" x2="12" y2="14" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Tiny lines simulating text -->
      <line x1="3" y1="4" x2="9" y2="6" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
      <line x1="3" y1="8" x2="8" y2="10" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
      <line x1="15" y1="4" x2="21" y2="6" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
      <line x1="15" y1="8" x2="20" y2="10" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Legs (Relaxed, outstretched) -->
    <path d="M 12,65 L -10,72 L -8,78 L 14,70" fill="#3b82f6" rx="3"/>
    <!-- Slippers -->
    <ellipse cx="-12" cy="77" rx="5" ry="3" fill="#f59e0b"/>
  </g>

  <!-- SLEEPY CAT (Enhances the "Quiet/Peaceful Place" vibe) -->
  <g transform="translate(75, 195)">
    <!-- Cat Body curled up -->
    <ellipse cx="15" cy="12" rx="14" ry="9" fill="#fb923c"/>
    <!-- Cat Head -->
    <circle cx="5" cy="10" r="7" fill="#fb923c"/>
    <!-- Cat Ears -->
    <polygon points="1,5 -1,0 4,4" fill="#fb923c"/>
    <polygon points="7,4 10,-1 11,5" fill="#fb923c"/>
    <!-- Sleeping Eye (Closed arc) -->
    <path d="M 3,9 Q 5,11 7,9" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cat Tail -->
    <path d="M 26,10 Q 32,5 30,15" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Peaceful Zzz's / Ambient Serenity Notes -->
  <g transform="translate(138, 85)" opacity="0.8">
    <path d="M 0,10 L 8,10 L 2,2 L 10,2" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(148, 70)" opacity="0.6">
    <path d="M 0,6 L 5,6 L 1,1 L 6,1" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Ambient floating soft dust motes in the light beam -->
  <circle cx="110" cy="90" r="1.5" fill="#fef08a" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="130" cy="130" r="2" fill="#fef08a" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="95" cy="160" r="1" fill="#fef08a" opacity="0.7"/>
  <circle cx="155" cy="170" r="1.5" fill="#fef08a" opacity="0.4"/>
  <circle cx="120" cy="65" r="1" fill="#fef08a" opacity="0.8"/>
</svg>