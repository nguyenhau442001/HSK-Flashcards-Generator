<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(20, 40)">
    <!-- Ground -->
    <path d="M0 160 L200 160 L210 180 L-10 180 Z" fill="#334155"/>
    
    <!-- Cracked Earth -->
    <path d="M20 160 L40 140 L60 160 L80 130 L100 160" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M120 160 L140 145 L160 160" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Building -->
    <rect x="40" y="60" width="120" height="100" fill="#475569" rx="4"/>
    <rect x="60" y="80" width="30" height="30" fill="#f59e0b"/>
    <rect x="110" y="80" width="30" height="30" fill="#f59e0b"/>
    <rect x="75" y="120" width="50" height="40" fill="#1e293b"/>
    
    <!-- Debris/Falling elements -->
    <path d="M160 50 L180 30 L190 50 Z" fill="#94a3b8"/>
    <path d="M20 40 L40 20 L50 40 Z" fill="#94a3b8"/>
    
    <!-- Dust/Atmosphere -->
    <circle cx="100" cy="120" r="40" fill="#fb923c" opacity="0.15"/>
    <circle cx="100" cy="120" r="20" fill="#fb923c" opacity="0.2"/>
    
    <!-- Shaking lines -->
    <path d="M10 50 L30 70 M180 50 L160 70" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>