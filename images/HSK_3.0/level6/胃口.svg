<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Environment -->
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    
    <!-- Plate Shadow -->
    <radialGradient id="plateShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Clip for Window/Light -->
    <clipPath id="roomClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <!-- Canvas Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- SCENE ENVIRONMENT (Indoor Dining Room, Evening) -->
  <g clip-path="url(#roomClip)">
    <!-- Ambient Wall & Warm Interior Lighting -->
    <rect x="0" y="0" width="240" height="150" fill="#1e293b" />
    <!-- Wall shadow/texture accent -->
    <path d="M0 150 L240 130 L240 0 L0 0 Z" fill="#2563eb" fill-opacity="0.04" />

    <!-- Window showing night city vibe / soft moon glow -->
    <path d="M170 30 L210 30 C214 30 215 34 215 38 L215 100 L170 100 Z" fill="#334155" />
    <path d="M173 33 L207 33 C211 33 212 36 212 40 L212 97 L173 97 Z" fill="#0f172a" />
    <!-- City lights outside window -->
    <circle cx="182" cy="50" r="1.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="195" cy="45" r="1" fill="#38bdf8" opacity="0.8" />
    <circle cx="202" cy="70" r="1.5" fill="#f43f5e" opacity="0.7" />
    <circle cx="185" cy="85" r="1" fill="#f59e0b" opacity="0.6" />

    <!-- Pendant Light hanging from top -->
    <line x1="100" y1="0" x2="100" y2="35" stroke="#475569" stroke-width="2" />
    <path d="M85 35 L115 35 L120 45 L80 45 Z" fill="#475569" />
    <!-- Light Cone -->
    <polygon points="100,45 25,180 175,180" fill="#fbbf24" fill-opacity="0.05" />

    <!-- Wooden Table Surface -->
    <rect x="0" y="150" width="240" height="90" fill="#334155" />
    <rect x="0" y="145" width="240" height="5" fill="#475569" />
    <ellipse cx="120" cy="180" rx="100" ry="25" fill="url(#tableGlow)" />
  </g>

  <!-- TABLE PROPS (Full Bowl of Rice / Untouched Meal) -->
  <!-- Bowl Shadow -->
  <ellipse cx="100" cy="190" rx="28" ry="8" fill="url(#plateShadow)" />
  
  <!-- Ceramic Bowl -->
  <path d="M74 175 C74 195, 126 195, 126 175 Z" fill="#e2e8f0" />
  <ellipse cx="100" cy="175" rx="26" ry="7" fill="#cbd5e1" />
  <!-- Rice mound (untouched, full) -->
  <ellipse cx="100" cy="173" rx="23" ry="6" fill="#f8fafc" />
  <!-- Steam wisp 1 (subtle, calm) -->
  <path d="M92 160 Q95 152 90 145" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <!-- Steam wisp 2 -->
  <path d="M106 160 Q103 150 108 142" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

  <!-- Chopsticks resting neatly across bowl -->
  <line x1="65" y1="170" x2="135" y2="182" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />

  <!-- CHARACTER (Resting chin on hand, looking unenthused at food) -->
  <g id="character">
    <!-- Body & Torso -->
    <path d="M130 240 L130 210 C130 195, 145 185, 160 185 L185 185 C200 185, 215 195, 215 210 L215 240 Z" fill="#3b82f6" />
    <!-- Collar / Shirt detail -->
    <path d="M150 185 L165 200 L180 185" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Back Arm -->
    <path d="M190 190 Q205 210, 195 230" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="157" y="165" width="16" height="25" fill="#fbcfe8" rx="4" />

    <!-- Head & Hair Group -->
    <g transform="translate(145, 115)">
      <!-- Hair Back -->
      <path d="M0 30 C0 5, 50 0, 55 25 C58 40, 52 50, 52 50 L10 50 Z" fill="#0f172a" />

      <!-- Face Base -->
      <path d="M10 20 C10 50, 45 55, 45 35 C45 25, 45 20, 45 20 Z" fill="#fbcfe8" />

      <!-- Ear -->
      <path d="M38 32 C43 32, 43 42, 37 42" fill="#fbcfe8" stroke="#e2e8f0" stroke-width="1.5" />

      <!-- Facial Expression: Unhappy / Uninterested ("No Appetite") -->
      <!-- Heavy Droopy Eyelids / Closed-ish Eyes -->
      <path d="M22 30 Q27 34 32 30" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M35 30 Q40 34 45 30" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

      <!-- Slight frown / straight unimpressed mouth -->
      <path d="M30 45 Q36 43 42 45" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

      <!-- Rosy low-energy cheek -->
      <circle cx="37" cy="38" r="4" fill="#f43f5e" opacity="0.25" />

      <!-- Hair Front / Bangs -->
      <path d="M10 18 C15 10, 35 12, 46 22 C40 22, 25 15, 10 18 Z" fill="#1e293b" />
      <path d="M10 18 C18 25, 25 32, 25 32 L15 28 Z" fill="#1e293b" />
    </g>

    <!-- Front Arm / Hand Resting Chin on Fist -->
    <!-- Upper Arm -->
    <path d="M150 180 Q130 190, 125 205" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" />
    <!-- Lower Arm leaning on table -->
    <path d="M125 205 L150 215" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
    <!-- Hand supporting chin (Fist/Palm under chin area) -->
    <circle cx="152" cy="155" r="9" fill="#fbcfe8" />
    <!-- Fingers curled gently -->
    <path d="M145 150 C148 145, 155 145, 158 152" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- MOOD ACCENTS (Subtle, clean visual cues of disinterest/low energy) -->
  <!-- Dropping sweat drop (classic cartoon sign of lack of energy/mood) -->
  <path d="M185 115 C185 115, 189 122, 189 125 C189 127.5, 187 129, 185 129 C183 129, 181 127.5, 181 125 C181 122, 185 115, 185 115 Z" fill="#38bdf8" opacity="0.7" />

  <!-- Small cross/sigh lines near head -->
  <path d="M135 110 L143 118" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M143 110 L135 118" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.5" />
</svg>