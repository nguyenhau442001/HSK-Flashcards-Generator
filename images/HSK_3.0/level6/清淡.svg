<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Table Gradient -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>

    <!-- Bowl Shadow -->
    <radialGradient id="bowlShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Interior Elements -->
  <!-- Window / Warm Ambient Light Frame -->
  <path d="M 40 30 L 200 30 L 200 130 L 40 130 Z" fill="#1e293b" opacity="0.5"/>
  <rect x="50" y="40" width="60" height="80" rx="4" fill="#334155" opacity="0.3"/>
  <rect x="130" y="40" width="60" height="80" rx="4" fill="#334155" opacity="0.3"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M 120 0 L 120 40" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 40 L 140 40 L 145 50 L 95 50 Z" fill="#fbbf24"/>
  <circle cx="120" cy="45" r="50" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Restaurant / Dining Wall Shelf with Plants -->
  <rect x="40" y="70" width="50" height="4" rx="2" fill="#475569"/>
  <path d="M 50 70 Q 55 55 60 70 Z" fill="#10b981"/>
  <path d="M 70 70 Q 75 50 80 70 Z" fill="#059669"/>
  <ellipse cx="65" cy="70" rx="15" ry="3" fill="#334155"/>

  <!-- Wooden Table Surface -->
  <path d="M 10 160 L 230 160 L 240 220 L 0 220 Z" fill="url(#tableGrad)"/>
  <!-- Table Edge highlight -->
  <path d="M 10 160 L 230 160" stroke="#475569" stroke-width="2"/>

  <!-- CHARACTER: Man enjoying light, healthy food ("他喜欢吃清淡的菜") -->
  <!-- Chair Backrest -->
  <path d="M 100 110 L 110 165 L 130 165 L 120 110 Z" fill="#475569" opacity="0.8"/>
  
  <!-- Character Body / Shoulders -->
  <path d="M 85 165 Q 105 130 120 130 Q 135 130 155 165 Z" fill="url(#shirtGrad)"/>
  
  <!-- Character Neck & Head -->
  <rect x="108" y="115" width="24" height="20" rx="8" fill="#fbcfe8"/>
  <!-- Head Base -->
  <circle cx="120" cy="100" r="22" fill="#fbcfe8"/>
  
  <!-- Hair (Stylized modern short hair) -->
  <path d="M 98 100 Q 100 80 120 78 Q 140 80 142 100 Q 135 88 120 88 Q 105 88 98 100 Z" fill="#334155"/>
  
  <!-- Content/Happy Expression -->
  <!-- Closed happy eyes (smiling arcs) -->
  <path d="M 110 96 Q 114 100 118 96" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 122 96 Q 126 100 130 96" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Gentle Smile -->
  <path d="M 116 106 Q 120 110 124 106" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Blushing Cheeks -->
  <circle cx="108" cy="104" r="3" fill="#f43f5e" opacity="0.4"/>
  <circle cx="132" cy="104" r="3" fill="#f43f5e" opacity="0.4"/>

  <!-- Arms / Hands -->
  <!-- Right Arm holding chopsticks -->
  <path d="M 145 145 Q 155 155 140 170" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="137" cy="172" r="5" fill="#fbcfe8"/>

  <!-- Left Arm resting -->
  <path d="M 95 145 Q 85 160 95 175" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  <circle cx="95" cy="177" r="5" fill="#fbcfe8"/>


  <!-- PROPS: "清淡的菜" (Light, healthy vegetable & clear soup dishes) -->
  
  <!-- Bowl Shadow 1 -->
  <ellipse cx="120" cy="195" rx="35" ry="10" fill="url(#bowlShadow)"/>
  
  <!-- Main Bowl (Steaming Light Vegetable Soup / Clear Broth) -->
  <path d="M 90 180 L 150 180 Q 155 205 120 205 Q 85 205 90 180 Z" fill="#e2e8f0"/>
  <ellipse cx="120" cy="180" rx="30" ry="8" fill="#cbd5e1"/>
  <!-- Soup liquid (Clear, healthy broth with green veggies and tofu cubes) -->
  <ellipse cx="120" cy="181" rx="27" ry="6" fill="#6ee7b7" opacity="0.4"/>
  <!-- Tofu cubes & greens floating -->
  <rect x="110" y="178" width="5" height="4" fill="#f8fafc" rx="1"/>
  <rect x="125" y="182" width="6" height="4" fill="#f8fafc" rx="1"/>
  <circle cx="118" cy="181" r="2.5" fill="#059669"/>
  <circle cx="135" cy="179" r="2" fill="#059669"/>
  <circle cx="105" cy="181" r="2" fill="#059669"/>

  <!-- Steam wisps rising from light food -->
  <path d="M 115 168 Q 110 155 120 145 Q 130 135 125 125" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 125 165 Q 130 150 120 140 Q 110 130 115 118" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Secondary Dish (Side plate of fresh green leafy steamed greens / Qingcai) -->
  <!-- Plate Shadow -->
  <ellipse cx="65" cy="190" rx="22" ry="7" fill="url(#bowlShadow)"/>
  <!-- Plate -->
  <ellipse cx="65" cy="187" rx="20" ry="6" fill="#f1f5f9"/>
  <ellipse cx="65" cy="185" rx="17" ry="4" fill="#e2e8f0"/>
  <!-- Green Veggies (Bok Choy / Leafy greens) -->
  <path d="M 55 185 Q 60 180 70 182 Q 75 185 65 188 Z" fill="#10b981"/>
  <path d="M 60 187 Q 65 182 75 186 Q 70 190 58 189 Z" fill="#34d399"/>

  <!-- Small Tea Cup (Clean living / healthy lifestyle context) -->
  <ellipse cx="180" cy="185" rx="12" ry="5" fill="url(#bowlShadow)"/>
  <path d="M 170 170 L 190 170 Q 193 185 180 185 Q 167 185 170 170 Z" fill="#f8fafc"/>
  <ellipse cx="180" cy="170" rx="10" ry="3" fill="#e2e8f0"/>
  <!-- Tea Liquid (Light green tea) -->
  <ellipse cx="180" cy="171" rx="8" ry="2" fill="#a7f3d0"/>

  <!-- Chopsticks resting across the scene -->
  <path d="M 130 162 L 155 178" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 132 165 L 157 181" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ambient Sparkles / Healthy Vibe Details -->
  <circle cx="155" cy="100" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="85" cy="120" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="170" cy="130" r="2" fill="#34d399" opacity="0.8"/>
</svg>