<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Environment: Cozy interior -->
  <!-- Floor/Table surface -->
  <path d="M0 160 C 60 140, 180 140, 240 160 L 240 240 L 0 240 Z" fill="#2d3a4b"/>
  
  <!-- Window with soft light -->
  <rect x="160" y="40" width="60" height="80" rx="8" fill="#3d4e61"/>
  <rect x="165" y="45" width="50" height="70" rx="6" fill="#0f172a"/> <!-- Darker window pane -->
  <circle cx="190" cy="80" r="30" fill="#f59e0b" opacity="0.2" filter="url(#glow)"/> <!-- Soft light glow -->
  <path d="M165 80 H215" stroke="#3d4e61" stroke-width="2"/>
  <path d="M190 45 V115" stroke="#3d4e61" stroke-width="2"/>

  <!-- Potted plant -->
  <path d="M170 130 C175 120, 185 120, 190 130 L190 145 C185 150, 175 150, 170 145 Z" fill="#6d4c41"/>
  <path d="M175 125 C170 115, 175 110, 180 115 C185 110, 190 115, 185 125 Z" fill="#10b981"/>
  <path d="M185 125 C180 115, 185 110, 190 115 C195 110, 200 115, 195 125 Z" fill="#10b981"/>

  <!-- Character 1 (wishing happiness) -->
  <g transform="translate(45, 20)">
    <!-- Body -->
    <path d="M50 120 C40 100, 40 70, 50 60 L60 60 C70 70, 70 100, 60 120 Z" fill="#38bdf8"/> <!-- Torso -->
    <rect x="45" y="110" width="20" height="20" rx="8" fill="#38bdf8"/> <!-- Lap/legs -->
    <!-- Head -->
    <circle cx="55" cy="50" r="20" fill="#fbbf24"/>
    <!-- Hair -->
    <path d="M40 40 C30 30, 30 20, 45 20 C60 20, 70 30, 70 40 C70 50, 60 60, 55 60 C50 60, 40 50, 40 40 Z" fill="#f59e0b"/>
    <!-- Face details -->
    <circle cx="48" cy="45" r="2" fill="#0f172a"/>
    <circle cx="62" cy="45" r="2" fill="#0f172a"/>
    <path d="M50 55 Q55 60, 60 55" stroke="#0f172a" stroke-width="1.5" fill="none"/> <!-- Gentle smile -->
    <!-- Arm reaching out to touch -->
    <path d="M65 80 C75 70, 85 70, 90 85 C95 100, 85 110, 75 100 Z" fill="#fbbf24"/> <!-- Arm -->
    <circle cx="85" cy="100" r="8" fill="#fbbf24"/> <!-- Hand -->
  </g>

  <!-- Character 2 (receiving happiness) -->
  <g transform="translate(105, 20)">
    <!-- Body -->
    <path d="M50 120 C40 100, 40 70, 50 60 L60 60 C70 70, 70 100, 60 120 Z" fill="#ec4899"/> <!-- Torso -->
    <rect x="45" y="110" width="20" height="20" rx="8" fill="#ec4899"/> <!-- Lap/legs -->
    <!-- Head -->
    <circle cx="55" cy="50" r="20" fill="#fbbf24"/>
    <!-- Hair -->
    <path d="M40 40 C30 30, 30 20, 45 20 C60 20, 70 30, 70 40 C70 50, 60 60, 55 60 C50 60, 40 50, 40 40 Z" fill="#fb923c"/>
    <!-- Face details -->
    <circle cx="48" cy="45" r="2" fill="#0f172a"/>
    <circle cx="62" cy="45" r="2" fill="#0f172a"/>
    <path d="M50 55 Q55 60, 60 55" stroke="#0f172a" stroke-width="1.5" fill="none"/> <!-- Gentle smile -->
    <!-- Arm receiving, slightly open hand -->
    <path d="M35 80 C25 70, 15 70, 10 85 C5 100, 15 110, 25 100 Z" fill="#fbbf24"/> <!-- Arm -->
    <path d="M15 95 C10 90, 10 100, 15 105 C20 110, 25 100, 20 95 Z" fill="#fbbf24"/> <!-- Hand, slightly open -->
  </g>

  <!-- Interaction / Blessing element -->
  <!-- Subtle glow/sparkle from the giver's hand to the receiver's arm/hand area -->
  <circle cx="125" cy="120" r="15" fill="#f59e0b" opacity="0.3" filter="url(#glow)"/>
  <path d="M120 110 Q125 105, 130 110 Q135 115, 130 120 Q125 125, 120 120 Q115 115, 120 110 Z" fill="#fbbf24" opacity="0.6"/>
  <path d="M125 115 Q127.5 112.5, 130 115 Q132.5 117.5, 130 120 Q127.5 122.5, 125 120 Q122.5 117.5, 125 115 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M127.5 117.5 Q128.75 116.25, 130 117.5 Q131.25 118.75, 130 120 Q128.75 121.25, 127.5 120 Q126.25 118.75, 127.5 117.5 Z" fill="#fbbf24" opacity="1"/>

</svg>