<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="fluidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment Ambient Glow -->
  <circle cx="120" cy="120" r="100" fill="url(#glow)"/>

  <!-- Bathroom/Washroom Environment -->
  <!-- Wall tiles pattern -->
  <path d="M0 40 H240 M0 80 H240 M0 120 H240 M0 160 H240" stroke="#334155" stroke-width="0.5" stroke-dasharray="20 5"/>
  <path d="M60 0 V160 M120 0 V160 M180 0 V160" stroke="#334155" stroke-width="0.5"/>

  <!-- Mirror on wall -->
  <rect x="70" y="20" width="100" height="90" rx="10" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <path d="M75 25 A 45 40 0 0 1 165 25" fill="#38bdf8" fill-opacity="0.08"/>
  <path d="M85 30 L95 45 M155 35 L145 50" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Washbasin / Sink Counter -->
  <path d="M40 150 L200 150 L210 210 L30 210 Z" fill="url(#sinkGrad)"/>
  <path d="M40 150 H200 V160 H40 Z" fill="#64748b"/>
  
  <!-- Basin Bowl Inside -->
  <ellipse cx="120" cy="170" rx="55" ry="25" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="120" cy="175" rx="45" ry="18" fill="#1e293b"/>

  <!-- Faucet -->
  <path d="M115 125 V145 H125 V125 C125 115 115 115 115 125 Z" fill="#cbd5e1"/>
  <circle cx="120" cy="120" r="4" fill="#94a3b8"/>
  <path d="M120 145 Q120 155 122 162" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Character (Young Man leaning over sink, actively vomiting) -->
  <!-- Torso & Shoulders -->
  <path d="M85 240 C85 200 95 180 120 175 C145 180 155 200 155 240 Z" fill="#38bdf8"/>
  <path d="M90 190 Q120 170 150 190 L160 240 H80 Z" fill="#0284c7"/> <!-- Jacket/Shirt -->

  <!-- Neck -->
  <path d="M105 135 L110 155 H130 L135 135 Z" fill="#fcd34d"/>

  <!-- Head (Tilted downward towards basin, strained expression) -->
  <g transform="translate(120, 125) rotate(25)">
    <!-- Hair -->
    <path d="M-20 -25 C-20 -40 20 -40 20 -25 C25 -15 20 -5 15 -5 C10 -5 0 -10 -15 -5 C-20 -5 -25 -15 -20 -25 Z" fill="#1e293b"/>
    <!-- Face base -->
    <circle cx="0" cy="-10" r="18" fill="#fcd34d"/>
    <!-- Ear -->
    <circle cx="-16" cy="-8" r="4" fill="#f59e0b"/>
    <!-- Closed strained eyes (Arcs) -->
    <path d="M-8 -12 L-2 -10" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M2 -10 L8 -12" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Open mouth (vomiting state) -->
    <ellipse cx="0" cy="0" rx="5" ry="7" fill="#78350f"/>
    <!-- Sweat drop showing distress -->
    <path d="M12 -18 C12 -18 16 -12 16 -9 C16 -7 14 -5 12 -5 C10 -5 8 -7 8 -9 C8 -12 12 -18 12 -18 Z" fill="#38bdf8"/>
  </g>

  <!-- Arms gripping sink edges -->
  <path d="M85 190 C70 185 60 170 55 160" stroke="#fcd34d" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="53" cy="158" r="6" fill="#fcd34d"/>
  
  <path d="M155 190 C170 185 180 170 185 160" stroke="#fcd34d" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="187" cy="158" r="6" fill="#fcd34d"/>

  <!-- Action: Vomit stream / particles falling into the sink -->
  <g>
    <!-- Main fluid stream from mouth to basin -->
    <path d="M130 145 Q135 155 125 170" stroke="url(#fluidGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M132 148 Q138 158 128 172" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    
    <!-- Splashes & Droplets inside the sink basin -->
    <circle cx="123" cy="172" r="5" fill="#38bdf8" opacity="0.9"/>
    <circle cx="115" cy="177" r="3" fill="#10b981" opacity="0.8"/>
    <circle cx="132" cy="175" r="4" fill="#38bdf8" opacity="0.8"/>
    
    <!-- Splash ripple rings -->
    <ellipse cx="124" cy="174" rx="8" ry="3" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="124" cy="174" rx="14" ry="5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Context Props: Cup and Toothbrush holder on counter for realism -->
  <rect x="175" y="130" width="14" height="20" rx="3" fill="#e2e8f0"/>
  <path d="M172 130 H192 V134 H172 Z" fill="#cbd5e1"/>
  <!-- Toothbrush sticking out -->
  <line x1="180" y1="130" x2="175" y2="115" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Soap dispenser -->
  <rect x="50" y="132" width="12" height="18" rx="2" fill="#38bdf8"/>
  <path d="M56 132 V126 H62" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Floor line & shadow -->
  <ellipse cx="120" cy="230" rx="70" ry="8" fill="#020617" opacity="0.6"/>
</svg>