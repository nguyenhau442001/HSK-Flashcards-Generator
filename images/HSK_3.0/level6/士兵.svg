<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="obstacleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="uniformGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="uniformGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Details: Training Camp Background -->
  <!-- Sunset glow in sky -->
  <circle cx="190" cy="70" r="30" fill="#f59e0b" opacity="0.15" />
  <path d="M0 130 Q60 120 120 125 T240 120 L240 240 L0 240 Z" fill="#111827" opacity="0.4" />
  
  <!-- Training Ground Terrain -->
  <rect x="0" y="160" width="240" height="80" fill="url(#groundGrad)" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2" />

  <!-- Obstacle Course Elements (Training Context) -->
  <!-- Low Wall / Barrier -->
  <rect x="140" y="145" width="45" height="30" rx="4" fill="url(#obstacleGrad)" stroke="#78350f" stroke-width="1.5" />
  <!-- Stripes on barrier -->
  <path d="M150 145 L155 175 M165 145 L170 175" stroke="#fef3c7" stroke-width="3" opacity="0.6" />

  <!-- Tire stack for agility training -->
  <ellipse cx="45" cy="175" rx="14" ry="7" fill="#334155" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="45" cy="170" rx="14" ry="7" fill="#475569" stroke="#1e293b" stroke-width="2" />
  <ellipse cx="45" cy="165" rx="14" ry="7" fill="#334155" stroke="#0f172a" stroke-width="2" />

  <!-- SOLDIER 1: Leaping over the obstacle (Action Pose) -->
  <g id="soldier1" transform="translate(10, 0)">
    <!-- Motion lines -->
    <path d="M100 135 Q115 130 130 135" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M95 145 Q110 140 125 145" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- Helmet & Head -->
    <path d="M107 114 C107 108 113 105 120 105 C127 105 133 108 133 114 Z" fill="#065f46" stroke="#022c22" stroke-width="1.5" />
    <circle cx="118" cy="116" r="4" fill="#fb923c" /> <!-- Face accent -->

    <!-- Torso (Leaping forward) -->
    <path d="M110 120 L132 125 L124 140 L104 133 Z" fill="url(#uniformGrad1)" stroke="#022c22" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Belt -->
    <rect x="110" y="133" width="18" height="3" fill="#1e293b" />

    <!-- Arms (Dynamic running/balancing pose) -->
    <path d="M115 122 L98 115" stroke="#065f46" stroke-width="5" stroke-linecap="round" />
    <path d="M128 126 L142 135" stroke="#065f46" stroke-width="5" stroke-linecap="round" />

    <!-- Legs (Tuck jump over obstacle) -->
    <path d="M110 138 L96 150 L106 158" stroke="#047857" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M120 140 L132 153 L144 148" stroke="#065f46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- SOLDIER 2: Sprinting/Low crawling or running dynamically in background -->
  <g id="soldier2" transform="translate(60, 15)">
    <!-- Helmet & Head -->
    <path d="M47 119 C47 113 53 110 60 110 C67 110 73 113 73 119 Z" fill="#047857" stroke="#022c22" stroke-width="1.5" />
    <circle cx="62" cy="121" r="4" fill="#fb923c" />

    <!-- Torso (Lean forward running) -->
    <path d="M50 125 L72 128 L68 143 L48 138 Z" fill="url(#uniformGrad2)" stroke="#022c22" stroke-width="1.5" stroke-linejoin="round" />
    <rect x="52" y="137" width="16" height="3" fill="#1e293b" />

    <!-- Arms -->
    <path d="M55 128 L40 138" stroke="#059669" stroke-width="5" stroke-linecap="round" />
    <path d="M68 130 L80 120" stroke="#059669" stroke-width="5" stroke-linecap="round" />

    <!-- Legs (Action running stride) -->
    <path d="M56 141 L46 160 L54 165" stroke="#047857" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M62 142 L74 158 L66 163" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- SOLDIER 3: Saluting / Direct stance instructor or fellow soldier on the side -->
  <g id="soldier3" transform="translate(-15, 20)">
    <!-- Base / Ground shadow -->
    <ellipse cx="45" cy="196" rx="16" ry="5" fill="#0f172a" opacity="0.6" />

    <!-- Helmet & Head -->
    <path d="M37 124 C37 118 43 115 50 115 C57 115 63 118 63 124 Z" fill="#047857" stroke="#022c22" stroke-width="1.5" />
    <circle cx="51" cy="126" r="4" fill="#fb923c" />

    <!-- Torso (Upright, attentive posture) -->
    <path d="M38 130 L62 130 L60 172 L40 172 Z" fill="url(#uniformGrad1)" stroke="#022c22" stroke-width="1.5" stroke-linejoin="round" />
    <rect x="40" y="150" width="20" height="4" fill="#1e293b" />

    <!-- Arm (Saluting) -->
    <path d="M40 135 L30 148 L38 152" stroke="#047857" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Arm (Resting on hip) -->
    <path d="M60 135 L70 148 L62 158" stroke="#047857" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Legs (At attention / stance) -->
    <path d="M45 172 L43 195 L37 195" stroke="#065f46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M55 172 L57 195 L63 195" stroke="#065f46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Foreground Atmospheric Details (Dust particles / energy glow) -->
  <circle cx="110" cy="165" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="130" cy="175" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="95" cy="180" r="2" fill="#fbbf24" opacity="0.7" />
  <circle cx="150" cy="135" r="1" fill="#38bdf8" opacity="0.9" />

  <!-- Frame Border Overlay (Clean UI Card aesthetic) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>