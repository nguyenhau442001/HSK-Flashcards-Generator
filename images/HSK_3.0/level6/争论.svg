<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Warm accent light from table lamp -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Speech bubble gradient (Left - energetic blue) -->
    <linearGradient id="bubbleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Speech bubble gradient (Right - passionate coral/orange) -->
    <linearGradient id="bubbleOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Drop Shadow for UI/Props -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lamp Glow -->
  <circle cx="120" cy="80" r="140" fill="url(#lampGlow)"/>

  <!-- Background Office / Discussion Room Environment -->
  <!-- Window Grid showing night city -->
  <g opacity="0.4">
    <rect x="75" y="25" width="90" height="60" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <line x1="120" y1="25" x2="120" y2="85" stroke="#475569" stroke-width="2"/>
    <line x1="75" y1="55" x2="165" y2="55" stroke="#475569" stroke-width="2"/>
    <!-- City lights outside -->
    <rect x="85" y="35" width="8" height="12" fill="#fbbf24" opacity="0.6"/>
    <rect x="98" y="40" width="6" height="8" fill="#38bdf8" opacity="0.6"/>
    <rect x="135" y="33" width="10" height="15" fill="#fbbf24" opacity="0.5"/>
    <rect x="150" y="65" width="8" height="12" fill="#f43f5e" opacity="0.6"/>
  </g>

  <!-- Bookshelf in background -->
  <g opacity="0.5">
    <rect x="20" y="40" width="35" height="70" fill="#334155"/>
    <rect x="20" y="65" width="35" height="4" fill="#475569"/>
    <rect x="20" y="90" width="35" height="4" fill="#475569"/>
    <!-- Books -->
    <rect x="24" y="48" width="6" height="17" fill="#f43f5e"/>
    <rect x="32" y="45" width="8" height="20" fill="#38bdf8"/>
    <rect x="42" y="50" width="5" height="15" fill="#fbbf24"/>
    <rect x="25" y="72" width="7" height="18" fill="#10b981"/>
    <rect x="34" y="70" width="10" height="20" fill="#a855f7"/>
  </g>

  <!-- Hanging Pendant Lamp -->
  <path d="M120 0 L120 35" stroke="#64748b" stroke-width="2"/>
  <path d="M100 35 L140 35 L145 42 L95 42 Z" fill="#475569"/>
  <path d="M105 42 L135 42 L125 50 L115 50 Z" fill="#fbbf24" filter="url(#softShadow)"/>

  <!-- Meeting Table -->
  <path d="M40 185 L200 185 L215 210 L25 210 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="40" y="185" width="160" height="8" fill="#334155" rx="2"/>

  <!-- Central Focus: The "Problem" Object on Table (Document / Chart with data graph) -->
  <g transform="translate(100, 160)" filter="url(#softShadow)">
    <rect x="-15" y="5" width="30" height="25" rx="2" fill="#f8fafc" transform="rotate(-5)" />
    <!-- Graph lines on document representing 'the issue' -->
    <path d="M-10 20 L-5 12 L0 16 L8 8" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-5)" />
    <circle cx="8" cy="8" r="3" fill="#ef4444" transform="rotate(-5)" />
  </g>

  <!-- Coffee Cup / Office Props -->
  <rect x="135" y="172" width="12" height="15" rx="3" fill="#cbd5e1" filter="url(#softShadow)"/>
  <path d="M147 176 C151 176 151 183 147 183" stroke="#cbd5e1" stroke-width="2" fill="none"/>

  <!-- CHARACTER 1: Left Character (Expressive, arguing/explaining actively) -->
  <g id="character-left">
    <!-- Body & Torso -->
    <path d="M60 210 C55 185 70 150 90 145 L105 210 Z" fill="#2563eb" filter="url(#softShadow)"/>
    <!-- Collar/Shirt details -->
    <path d="M75 147 L85 158 L95 147" fill="#f8fafc"/>
    
    <!-- Left Arm gesturing emphatically forward -->
    <path d="M70 160 C55 165 45 155 40 140" stroke="#2563eb" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Hand pointing/gesturing -->
    <circle cx="37" cy="136" r="6" fill="#fbcfe8"/>

    <!-- Head & Hair -->
    <circle cx="85" cy="118" r="18" fill="#fbcfe8" filter="url(#softShadow)"/>
    <!-- Stylish Dark Hair -->
    <path d="M67 120 C67 100 85 98 102 110 C100 102 90 98 80 98 C70 98 67 105 67 120 Z" fill="#1e1b4b"/>
    
    <!-- Facial Features (Intense discussion expression: angled brow, open mouth) -->
    <path d="M75 114 L83 117" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <path d="M88 114 L95 117" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="80" cy="121" r="1.5" fill="#1e1b4b"/>
    <circle cx="91" cy="121" r="1.5" fill="#1e1b4b"/>
    <!-- Open mouth speaking/arguing -->
    <path d="M83 129 C85 133 89 133 91 129 Z" fill="#991b1b"/>
  </g>

  <!-- CHARACTER 2: Right Character (Counter-arguing, leans forward passionately) -->
  <g id="character-right">
    <!-- Body & Torso -->
    <path d="M180 210 C185 185 170 150 150 145 L135 210 Z" fill="#0d9488" filter="url(#softShadow)"/>
    <!-- Collar/Shirt details -->
    <path d="M165 147 L155 158 L145 147" fill="#f8fafc"/>

    <!-- Right Arm leaning on table / active gesture -->
    <path d="M170 160 C185 165 195 175 205 160" stroke="#0d9488" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="208" cy="155" r="6" fill="#fbcfe8"/>

    <!-- Head & Hair -->
    <circle cx="155" cy="118" r="18" fill="#fbcfe8" filter="url(#softShadow)"/>
    <!-- Stylish Blonde/Light Brown Hair -->
    <path d="M137 120 C137 102 155 98 173 108 C168 100 158 98 150 98 C140 98 137 105 137 120 Z" fill="#b45309"/>

    <!-- Facial Features (Passionate debate expression: furrowed brow, determined mouth) -->
    <path d="M145 116 L152 113" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <path d="M158 113 L165 116" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="149" cy="121" r="1.5" fill="#1e1b4b"/>
    <circle cx="160" cy="121" r="1.5" fill="#1e1b4b"/>
    <!-- Determined open mouth -->
    <path d="M152 129 C154 133 158 133 160 129 Z" fill="#991b1b"/>
  </g>

  <!-- DYNAMIC ARGUMENT ELEMENTS (Abstract Debate / Clashing Ideas Visualized via Graphics) -->
  <!-- Left Speech/Thought Bubble (Blue, pointing up-left) -->
  <g transform="translate(45, 75)" filter="url(#softShadow)">
    <path d="M0 15 C0 7 7 0 15 0 L55 0 C63 0 70 7 70 15 L70 35 C70 43 63 50 55 50 L25 50 L10 65 L15 50 L15 50 C7 50 0 43 0 35 Z" fill="url(#bubbleBlue)"/>
    <!-- Abstract debate icon inside bubble: exclamation & question marks -->
    <text x="35" y="33" font-family="sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">?!</text>
  </g>

  <!-- Right Speech/Thought Bubble (Orange, pointing up-right) -->
  <g transform="translate(125, 65)" filter="url(#softShadow)">
    <path d="M0 15 C0 7 7 0 15 0 L55 0 C63 0 70 7 70 15 L70 35 C70 43 63 50 55 50 L55 65 L45 50 L15 50 C7 50 0 43 0 35 Z" fill="url(#bubbleOrange)"/>
    <!-- Abstract debate icon inside bubble: opposing graph/arrows -->
    <path d="M22 25 L35 15 L48 25" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M22 32 L35 22 L48 32" stroke="#ffedd5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Floating sparks/clash accents between them above table -->
  <g transform="translate(120, 110)">
    <circle cx="-15" cy="-10" r="3" fill="#38bdf8" filter="url(#softShadow)"/>
    <circle cx="20" cy="-5" r="4" fill="#fb923c" filter="url(#softShadow)"/>
    <path d="M-5 -25 L2 -15 L10 -22" stroke="#facc15" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>