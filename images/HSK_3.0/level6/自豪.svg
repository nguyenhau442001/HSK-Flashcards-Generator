<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Distant Cityscape -->
  <path d="M0 180 L30 160 L50 175 L80 140 L110 170 L140 130 L170 165 L200 150 L240 180 V240 H0 Z" fill="#0f172a" opacity="0.5"/>
  <path d="M0 190 L40 175 L70 185 L100 160 L130 180 L160 155 L190 185 L240 170 V240 H0 Z" fill="#1e293b"/>
  
  <!-- Distant Glowing Landmark/Sun -->
  <circle cx="120" cy="140" r="40" fill="url(#sunGlow)"/>
  <path d="M115 150 L120 120 L125 150 Z" fill="#fbbf24" opacity="0.8"/>

  <!-- Balcony Railing -->
  <rect x="0" y="210" width="240" height="30" fill="#334155"/>
  <rect x="0" y="210" width="240" height="4" fill="#475569"/>
  <rect x="20" y="214" width="6" height="26" fill="#475569"/>
  <rect x="60" y="214" width="6" height="26" fill="#475569"/>
  <rect x="100" y="214" width="6" height="26" fill="#475569"/>
  <rect x="140" y="214" width="6" height="26" fill="#475569"/>
  <rect x="180" y="214" width="6" height="26" fill="#475569"/>
  <rect x="220" y="214" width="6" height="26" fill="#475569"/>

  <!-- Character: The Proud Citizen -->
  <!-- Body/Torso -->
  <path d="M130 240 C130 210 150 180 180 180 C210 180 230 210 230 240" fill="#38bdf8"/>
  <path d="M180 180 C170 180 160 185 155 195" fill="none" stroke="#0f172a" stroke-width="1" opacity="0.2"/>
  
  <!-- Head -->
  <path d="M180 175 C192 175 202 165 202 152 C202 139 192 129 180 129 C168 129 158 139 158 152 C158 165 168 175 180 175Z" fill="#ffdbac"/>
  
  <!-- Hair -->
  <path d="M158 150 C158 135 170 125 185 125 C200 125 205 135 202 150 C195 145 185 145 180 148 C175 145 165 145 158 150Z" fill="#1e293b"/>
  
  <!-- Facial Expression (Eyes closed in pride, gentle smile) -->
  <path d="M170 152 Q174 150 178 152" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M188 152 Q192 150 196 152" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M178 165 Q183 168 188 165" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hand on Heart -->
  <path d="M175 205 C170 205 165 200 165 195 C165 190 170 188 175 188 C180 188 185 192 185 197" fill="#ffdbac"/>
  
  <!-- Arm holding Flag -->
  <path d="M130 240 C120 230 110 210 115 195" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <path d="M115 195 C115 190 118 188 122 188" fill="none" stroke="#ffdbac" stroke-width="8" stroke-linecap="round"/>

  <!-- Flagpole and Flag -->
  <rect x="118" y="140" width="3" height="60" rx="1.5" fill="#94a3b8"/>
  <path d="M70 145 C80 140 90 150 118 145 V170 C90 175 80 165 70 170 Z" fill="#ef4444"/>
  <circle cx="85" cy="157" r="5" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Accent Lighting -->
  <path d="M158 152 Q155 152 155 160" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
  <circle cx="40" cy="60" r="1" fill="#f1f5f9" opacity="0.8"/>
  <circle cx="200" cy="40" r="1" fill="#f1f5f9" opacity="0.6"/>
  <circle cx="100" cy="30" r="1.5" fill="#f1f5f9" opacity="0.4"/>
  <circle cx="220" cy="80" r="1" fill="#f1f5f9" opacity="0.7"/>
</svg>