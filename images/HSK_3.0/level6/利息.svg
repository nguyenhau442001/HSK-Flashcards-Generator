<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Piggy Bank Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="snoutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Gold Coin Gradients -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="coinEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Plant Pot & Foliage Gradients -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background shapes -->
  <circle cx="190" cy="50" r="40" fill="#38bdf8" opacity="0.05" />
  <circle cx="50" cy="180" r="60" fill="#facc15" opacity="0.05" />

  <!-- Wooden Desk Surface -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="#090d16" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="3" />
  <!-- Desk highlight line -->
  <line x1="0" y1="183" x2="240" y2="183" stroke="#1e293b" stroke-width="1" />

  <!-- SCENE OBJECT 1: The Plant Pot (Symbolizing Growth/Interest) -->
  <g transform="translate(45, 125)" filter="url(#softShadow)">
    <!-- Plant Leaves (Money Tree theme with coin shapes) -->
    <path d="M 15 25 C 10 -10 -20 -15 -35 5 C -25 5 -10 10 15 25 Z" fill="url(#leafGrad)" />
    <path d="M 15 25 C 25 -10 55 -5 60 20 C 45 20 30 20 15 25 Z" fill="url(#leafGrad)" />
    <path d="M 15 30 C 25 0 10 -30 -10 -40 C -5 -20 -5 0 15 30 Z" fill="url(#leafGrad)" />
    
    <!-- Leaves (Coin-like circular pads) -->
    <circle cx="-30" cy="0" r="10" fill="url(#coinGrad)" />
    <circle cx="-30" cy="0" r="7" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.6" />
    
    <circle cx="50" cy="15" r="12" fill="url(#coinGrad)" />
    <circle cx="50" cy="15" r="9" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.6" />

    <circle cx="-5" cy="-35" r="11" fill="url(#coinGrad)" />
    <circle cx="-5" cy="-35" r="8" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.6" />

    <!-- Pot Base -->
    <path d="M 0 20 L 30 20 L 25 55 C 25 58 22 60 18 60 L 12 60 C 8 60 5 58 5 55 Z" fill="url(#potGrad)" />
    <ellipse cx="15" cy="20" rx="15" ry="4" fill="#0284c7" />
    <ellipse cx="15" cy="20" rx="12" ry="3" fill="#065f46" /> <!-- Soil -->
  </g>

  <!-- SCENE OBJECT 2: The Piggy Bank (Main Subject - Savings) -->
  <g transform="translate(115, 95)" filter="url(#softShadow)">
    <!-- Back Leg -->
    <rect x="25" y="55" width="12" height="18" rx="6" fill="#9f1239" />
    <rect x="65" y="55" width="12" height="18" rx="6" fill="#9f1239" />

    <!-- Piggy Body -->
    <ellipse cx="50" cy="38" rx="42" ry="32" fill="url(#bodyGrad)" />

    <!-- Front Legs -->
    <rect x="15" y="60" width="12" height="18" rx="6" fill="url(#bodyGrad)" />
    <rect x="55" y="60" width="12" height="18" rx="6" fill="url(#bodyGrad)" />

    <!-- Cute Curly Tail -->
    <path d="M 90 28 C 100 25 100 38 92 35 C 97 32 97 28 92 28" fill="none" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />

    <!-- Snout -->
    <g transform="translate(75, 28)">
      <ellipse cx="12" cy="10" rx="14" ry="10" fill="url(#snoutGrad)" />
      <!-- Nostrils -->
      <circle cx="8" cy="9" r="2" fill="#881337" />
      <circle cx="16" cy="9" r="2" fill="#881337" />
    </g>

    <!-- Eye -->
    <circle cx="65" cy="22" r="3.5" fill="#881337" />
    <circle cx="66.5" cy="21" r="1" fill="#ffffff" /> <!-- Catchlight -->

    <!-- Ear -->
    <path d="M 45 10 C 40 -2 55 -2 52 10 Z" fill="#e11d48" />
    <path d="M 47 7 C 44 2 52 2 50 7 Z" fill="#fda4af" />

    <!-- Coin Slot on top -->
    <rect x="42" y="4" width="18" height="4" rx="2" fill="#881337" />
  </g>

  <!-- SCENE OBJECT 3: Floating / Falling Gold Coins (The 利息 / Interest payout) -->
  <g filter="url(#glow)">
    <!-- Coin falling into slot -->
    <g transform="translate(150, 65) rotate(15)">
      <ellipse cx="0" cy="0" rx="10" ry="12" fill="url(#coinGrad)" stroke="url(#coinEdge)" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="6" ry="8" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.8" />
    </g>

    <!-- Sparkle near slot -->
    <path d="M 140 45 L 143 52 L 150 55 L 143 58 L 140 65 L 137 58 L 130 55 L 137 52 Z" fill="#fef08a" opacity="0.8" />

    <!-- Stack of Interest Coins (Right foreground) -->
    <g transform="translate(185, 140)" filter="url(#softShadow)">
      <!-- Coin 5 (Top) -->
      <ellipse cx="0" cy="-30" rx="18" ry="8" fill="url(#coinGrad)" stroke="url(#coinEdge)" stroke-width="2" />
      <ellipse cx="0" cy="-30" rx="12" ry="5" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.7" />
      <!-- Coin 4 -->
      <path d="M -18 -30 L -18 -22 C -18 -17 18 -17 18 -22 L 18 -30 Z" fill="url(#coinEdge)" />
      <ellipse cx="0" cy="-22" rx="18" ry="8" fill="url(#coinGrad)" />
      <ellipse cx="0" cy="-22" rx="12" ry="5" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.7" />
      <!-- Coin 3 -->
      <path d="M -18 -22 L -18 -14 C -18 -9 18 -9 18 -14 L 18 -22 Z" fill="url(#coinEdge)" />
      <ellipse cx="0" cy="-14" rx="18" ry="8" fill="url(#coinGrad)" />
      <!-- Coin 2 -->
      <path d="M -18 -14 L -18 -6 C -18 -1 18 -1 18 -6 L 18 -14 Z" fill="url(#coinEdge)" />
      <ellipse cx="0" cy="-6" rx="18" ry="8" fill="url(#coinGrad)" />
      <!-- Coin 1 (Base) -->
      <path d="M -18 -6 L -18 2 C -18 7 18 7 18 2 L 18 -6 Z" fill="url(#coinEdge)" />
      <ellipse cx="0" cy="2" rx="18" ry="8" fill="url(#coinGrad)" />
      <ellipse cx="0" cy="2" rx="12" ry="5" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Single loose shiny coin -->
    <g transform="translate(130, 165) rotate(-25)" filter="url(#softShadow)">
      <ellipse cx="0" cy="0" rx="14" ry="14" fill="url(#coinGrad)" stroke="url(#coinEdge)" stroke-width="2.5" />
      <circle cx="0" cy="0" r="9" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.7" />
      <!-- Star specular highlight -->
      <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#ffffff" opacity="0.9" />
    </g>
  </g>

  <!-- Sparkles & Atmosphere -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="95" cy="55" r="2" />
    <circle cx="115" cy="45" r="1.5" />
    <circle cx="130" cy="30" r="2" />
  </g>
  <g fill="#fbbf24">
    <circle cx="170" cy="110" r="2.5" opacity="0.8" />
    <circle cx="155" cy="130" r="1.5" opacity="0.8" />
    <circle cx="205" cy="95" r="2" opacity="0.8" />
  </g>

</svg>