<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient Indoor Lighting -->
  <circle cx="120" cy="80" r="110" fill="url(#lampGlow)"/>

  <!-- Background Wall & Window Frame -->
  <path d="M40 30 h160 v140 h-160 z" fill="#334155" opacity="0.3"/>
  <path d="M90 40 h60 v70 h-60 z" fill="#1e293b" opacity="0.7"/>
  <!-- Window city lights outside -->
  <circle cx="105" cy="65" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="135" cy="85" r="2" fill="#38bdf8" opacity="0.4"/>

  <!-- Hanging Modern Lamp -->
  <path d="M120 0 v35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 35 h40 l15 15 h-70 z" fill="#f59e0b"/>
  <!-- Lamp beam -->
  <polygon points="110,50 130,50 170,180 70,180" fill="#fbbf24" opacity="0.08"/>

  <!-- Dining Table -->
  <rect x="30" y="150" width="180" height="60" rx="6" fill="url(#tableWood)"/>
  <rect x="30" y="150" width="180" height="10" rx="4" fill="#d97706" opacity="0.6"/>
  <!-- Table Legs -->
  <path d="M48 210 l-8 30 h10 l6 -30 z" fill="#451a03"/>
  <path d="M192 210 l8 30 h-10 l-6 -30 z" fill="#451a03"/>

  <!-- Tableware & Feast Props -->
  <!-- Hot Pot / Main Dish in Center -->
  <ellipse cx="120" cy="165" rx="22" ry="10" fill="#cbd5e1"/>
  <ellipse cx="120" cy="163" rx="19" ry="7" fill="#ef4444"/>
  <path d="M115 152 q5 -10 10 0" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Plates and Bowls -->
  <!-- Host Plate (Left) -->
  <ellipse cx="75" cy="170" rx="14" ry="7" fill="#f1f5f9"/>
  <ellipse cx="75" cy="169" rx="10" ry="4" fill="#e2e8f0"/>

  <!-- Guest Plate (Right) -->
  <ellipse cx="165" cy="170" rx="14" ry="7" fill="#f1f5f9"/>
  <ellipse cx="165" cy="169" rx="10" ry="4" fill="#e2e8f0"/>
  <!-- Small tea cups -->
  <ellipse cx="98" cy="175" rx="6" ry="3" fill="#f1f5f9"/>
  <ellipse cx="142" cy="175" rx="6" ry="3" fill="#f1f5f9"/>

  <!-- CHARACTER 1: HOST (Left side, welcoming posture, serving food) -->
  <g id="host-character">
    <!-- Torso & Apron -->
    <path d="M55 160 c0 -20 15 -35 25 -35 c10 0 20 15 20 35 z" fill="#3b82f6"/>
    <path d="M63 135 h18 v35 h-18 z" fill="#ffffff" opacity="0.9"/> <!-- Apron -->
    <!-- Head & Hair -->
    <circle cx="75" cy="98" r="14" fill="#fcd34d"/>
    <path d="M61 95 c0 -10 10 -16 22 -12 c6 2 10 8 10 14 z" fill="#1e293b"/> <!-- Dark friendly hair -->
    <!-- Face expression: Warm welcoming smile -->
    <circle cx="71" cy="97" r="1.5" fill="#1e293b"/>
    <circle cx="79" cy="97" r="1.5" fill="#1e293b"/>
    <path d="M73 103 q2 2 4 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Cheeks (Hospitality blush) -->
    <circle cx="69" cy="100" r="2" fill="#ef4444" opacity="0.4"/>
    <circle cx="81" cy="100" r="2" fill="#ef4444" opacity="0.4"/>

    <!-- Host Arms (Serving gesture holding a plate/bowl toward guest) -->
    <path d="M60 140 c-10 0 -15 -10 -5 -15 c8 -4 15 5 20 10" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <path d="M85 135 c10 -5 18 5 15 15" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <!-- Serving Hand holding platter -->
    <circle cx="98" cy="148" r="4" fill="#fcd34d"/>
  </g>

  <!-- CHARACTER 2: GUEST (Right side, delighted, appreciating the hospitality) -->
  <g id="guest-character">
    <!-- Torso -->
    <path d="M145 165 c0 -22 12 -38 22 -38 c12 0 23 16 23 38 z" fill="#10b981"/>
    <!-- Head & Hair -->
    <circle cx="165" cy="98" r="14" fill="#fcd34d"/>
    <path d="M151 98 c2 -12 12 -16 25 -10 c4 2 8 8 7 14 z" fill="#b45309"/> <!-- Stylish hair -->
    <!-- Face expression: Delighted / Smiling with eyes closed happily -->
    <path d="M160 97 q3 -3 6 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M168 97 q3 -3 6 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M163 103 q2 2 4 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="159" cy="100" r="2" fill="#ef4444" opacity="0.4"/>
    <circle cx="171" cy="100" r="2" fill="#ef4444" opacity="0.4"/>

    <!-- Guest Arms (Joyful, hands raised slightly in appreciation) -->
    <path d="M148 138 c-8 -2 -12 8 -8 15" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <path d="M182 138 c8 -2 12 8 8 15" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <circle cx="140" cy="153" r="3.5" fill="#fcd34d"/>
    <circle cx="190" cy="153" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- Warm Decorative Floating Hearts / Sparkles (Hospitality / Good Vibes) -->
  <g fill="#ec4899">
    <!-- Heart 1 -->
    <path d="M110 95 c-2 -3 -6 -3 -8 0 c-2 3 2 6 8 10 c6 -4 10 -7 8 -10 c-2 -3 -6 -3 -8 0 z" transform="scale(0.6) translate(110, 40)" opacity="0.8"/>
    <!-- Heart 2 -->
    <path d="M110 95 c-2 -3 -6 -3 -8 0 c-2 3 2 6 8 10 c6 -4 10 -7 8 -10 c-2 -3 -6 -3 -8 0 z" transform="scale(0.4) translate(280, 110)" opacity="0.7" fill="#fbbf24"/>
  </g>
</svg>