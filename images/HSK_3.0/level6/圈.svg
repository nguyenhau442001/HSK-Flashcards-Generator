<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Desk / Surface Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>

    <!-- Chalkboard Texture Gradient -->
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a3a"/>
      <stop offset="100%" stop-color="#0f2222"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment (Studio / Creative Room) -->
  <!-- Back Wall Accessories: Shelves & Props -->
  <g opacity="0.6">
    <rect x="25" y="40" width="60" height="4" rx="2" fill="#475569"/>
    <!-- Small Plant on Shelf -->
    <path d="M 45 40 L 45 30 C 45 26 55 26 55 30 L 55 40 Z" fill="#10b981"/>
    <circle cx="50" cy="24" r="8" fill="#34d399"/>
    <!-- Books on Shelf -->
    <rect x="65" y="24" width="8" height="16" rx="1" fill="#f43f5e"/>
    <rect x="73" y="22" width="6" height="18" rx="1" fill="#38bdf8"/>
  </g>

  <!-- Large Creative Blackboard on Wall -->
  <rect x="110" y="25" width="105" height="85" rx="6" fill="url(#board-grad)" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
  <!-- Educational Diagrams / Doodles on Blackboard -->
  <g opacity="0.4" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 125 45 Q 135 35 145 45 T 165 45"/>
    <circle cx="185" cy="45" r="10"/>
    <path d="M 125 70 L 140 85 L 155 70"/>
    <rect x="170" y="65" width="25" height="20" rx="2"/>
  </g>

  <!-- Hanging Desk Lamp -->
  <path d="M 160 0 L 160 35" stroke="#64748b" stroke-width="2"/>
  <path d="M 145 35 L 175 35 L 185 50 L 135 50 Z" fill="#cbd5e1"/>
  <ellipse cx="160" cy="50" rx="25" ry="25" fill="url(#lamp-glow)"/>

  <!-- Studio Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#desk-grad)" filter="url(#shadow)"/>
  <rect x="0" y="170" width="240" height="4" fill="#475569"/>

  <!-- Desk Props (Pencil holder, sketchbooks, color swatches) -->
  <!-- Pencil Holder -->
  <rect x="25" y="145" width="20" height="30" rx="3" fill="#64748b"/>
  <line x1="30" y1="145" x2="28" y2="135" stroke="#f59e0b" stroke-width="3"/>
  <line x1="35" y1="145" x2="37" y2="132" stroke="#38bdf8" stroke-width="3"/>
  <line x1="40" y1="145" x2="42" y2="136" stroke="#ec4899" stroke-width="3"/>

  <!-- Stack of Papers / Sketchbook -->
  <g transform="rotate(-5 70 170)">
    <rect x="55" y="150" width="45" height="25" rx="2" fill="#e2e8f0"/>
    <rect x="57" y="152" width="41" height="21" fill="#ffffff"/>
    <path d="M 62 160 L 80 160 M 62 165 L 75 165" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- MAIN CHARACTER (Creative Designer / Student Teaching Concept) -->
  <g id="character">
    <!-- Torso & Clothing (Friendly Teal Hoodie) -->
    <path d="M 75 200 C 75 175 105 175 105 200 L 115 240 L 65 240 Z" fill="#0d9488" filter="url(#shadow)"/>
    <!-- Collar Details -->
    <path d="M 82 178 C 85 185 95 185 98 178" fill="none" stroke="#0f766e" stroke-width="2"/>
    <path d="M 85 183 L 95 183" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck & Head -->
    <path d="M 83 175 L 97 175 L 97 160 L 83 160 Z" fill="#ffd1a9"/>
    <!-- Head Circle -->
    <circle cx="90" cy="135" r="26" fill="#ffd1a9" filter="url(#shadow)"/>

    <!-- Hair (Stylish Dark Bob/Short Hair) -->
    <path d="M 64 135 C 64 115 116 115 116 135 C 116 145 110 160 105 160 L 98 145 L 82 145 L 75 160 C 70 160 64 145 64 135 Z" fill="#1e293b"/>

    <!-- Expressive Face (Smiling, Focused, Teaching) -->
    <circle cx="82" cy="135" r="2" fill="#1e293b"/>
    <circle cx="98" cy="135" r="2" fill="#1e293b"/>
    <!-- Happy Smile -->
    <path d="M 87 142 Q 90 146 93 142" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Warm Blush -->
    <circle cx="78" cy="139" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="102" cy="139" r="3" fill="#fda4af" opacity="0.6"/>

    <!-- Left Arm & Hand (Resting naturally on desk) -->
    <path d="M 75 190 C 65 200 60 215 65 225" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round"/>
    <circle cx="65" cy="225" r="5" fill="#ffd1a9"/>

    <!-- Right Arm & Hand (Actively Drawing/Pointing to the Circle) -->
    <!-- Shoulder to elbow -->
    <path d="M 105 190 C 120 195 130 185 135 175" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round"/>
    <!-- Forearm reaching forward to canvas -->
    <path d="M 135 175 L 160 150" fill="none" stroke="#0d9488" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand with Marker/Pen -->
    <circle cx="163" cy="147" r="5" fill="#ffd1a9"/>
    <!-- Red Marker pen in hand -->
    <path d="M 160 150 L 172 138" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M 170 140 L 175 135" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- CENTERPIECE: The Target Action (Drawing a "圈" - Circle) -->
  <!-- Large Easel / Drawing Tablet Surface in Front of Character -->
  <g transform="translate(30, 10)">
    <!-- Sketchpad / Paper Sheet on Desk -->
    <rect x="70" y="80" width="110" height="85" rx="4" fill="#f8fafc" filter="url(#shadow)"/>
    <rect x="70" y="80" width="110" height="12" fill="#e2e8f0" rx="4"/>
    <circle cx="78" cy="86" r="2.5" fill="#94a3b8"/>
    <circle cx="86" cy="86" r="2.5" fill="#94a3b8"/>
    <circle cx="94" cy="86" r="2.5" fill="#94a3b8"/>

    <!-- THE TARGET VOCABULARY SCENARIO: A clear, vibrant red circle being drawn ("圈") -->
    <!-- Dotted guideline circle to emphasize the action of drawing a vòng tròn -->
    <circle cx="125" cy="130" r="32" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- The main vibrant red circle (圈) being drawn -->
    <path d="M 125 98 C 145 98 157 110 157 130 C 157 150 143 162 125 162 C 105 162 93 150 93 130 C 93 112 107 98 125 98 Z" 
          fill="none" 
          stroke="#ef4444" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#shadow)"/>

    <!-- Sparkles / Action effect highlighting the drawn circle -->
    <path d="M 162 110 L 168 104" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 90 150 L 84 156" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="158" cy="148" r="3" fill="#38bdf8"/>
    <circle cx="100" cy="108" r="2" fill="#ec4899"/>
  </g>

  <!-- Foreground Atmospheric Elements / Depth of Field Blur Bubbles -->
  <circle cx="25" cy="95" r="4" fill="#38bdf8" opacity="0.3"/>
  <circle cx="215" cy="180" r="6" fill="#f59e0b" opacity="0.2"/>
  <circle cx="210" cy="70" r="3" fill="#10b981" opacity="0.4"/>
</svg>