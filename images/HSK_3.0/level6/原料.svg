<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Behind Table -->
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Flour Bag Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Bread Dough Gradient -->
    <linearGradient id="doughGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Finished Bread Gradient -->
    <linearGradient id="breadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Glass Jar Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>

    <!-- Character Skin -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Soft Shadow -->
    <ellipse id="shadow" cx="0" cy="0" rx="1" ry="1" fill="#020617" opacity="0.4"/>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Kitchen Interior -->
  <!-- Wall / Shelf Accent -->
  <rect x="0" y="0" width="240" height="150" fill="#1e293b" />
  <rect x="0" y="148" width="240" height="4" fill="#334155" />
  
  <!-- Kitchen Shelf -->
  <rect x="30" y="45" width="180" height="6" rx="3" fill="#475569" />
  <path d="M 50 45 L 60 25 L 80 25 L 70 45 Z" fill="#334155" opacity="0.5"/>
  
  <!-- Jar on shelf -->
  <rect x="55" y="20" width="20" height="25" rx="4" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="60" y="17" width="10" height="3" rx="1" fill="#f59e0b" />
  <path d="M 57 28 L 73 28 L 72 38 L 58 38 Z" fill="#fbbf24" opacity="0.8" /> <!-- contents inside jar -->

  <!-- Hanging Kitchen Utensil/Plant -->
  <path d="M 180 45 L 180 65" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="180" cy="70" r="12" fill="#10b981" />
  <path d="M 175 65 Q 180 75 185 70" fill="#047857" />

  <!-- Ambient Glow behind ingredients -->
  <circle cx="120" cy="150" r="70" fill="url(#tableGlow)" />

  <!-- Wooden Tabletop -->
  <path d="M 10 180 L 230 180 L 220 220 L 20 220 Z" fill="#334155" />
  <path d="M 0 174 L 240 174 L 240 180 L 0 180 Z" fill="#64748b" /> <!-- Table Edge -->
  <rect x="15" y="180" width="210" height="40" fill="#1e293b" opacity="0.3"/> <!-- Surface shading -->

  <!-- Table Shadows -->
  <use href="#shadow" x="70" y="195" rx="35" ry="12" />
  <use href="#shadow" x="140" y="190" rx="25" ry="8" />
  <use href="#shadow" x="195" y="193" rx="15" ry="6" />

  <!-- ================= PROPS: THE RAW INGREDIENTS (原料) ================= -->

  <!-- 1. Bag of Flour (原料 - 1) -->
  <g transform="translate(50, 150)">
    <!-- Main Bag Body -->
    <path d="M 15 10 C 15 5 25 0 35 0 C 45 0 55 5 55 10 L 60 40 C 60 45 55 48 48 48 L 22 48 C 15 48 10 45 10 40 Z" fill="url(#bagGrad)" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Folded Top -->
    <path d="M 15 10 C 25 15 45 15 55 10" stroke="#94a3b8" stroke-width="1.5" fill="none" />
    <path d="M 22 5 C 35 8 40 3 48 6" stroke="#cbd5e1" stroke-width="2" fill="none" />
    <!-- Wheat graphic badge on flour bag -->
    <circle cx="35" cy="27" r="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 35 33 L 35 21 M 33 24 L 37 28 M 37 24 L 33 28" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Spilled Flour -->
    <path d="M 5 44 Q 15 48 25 45 Q 35 48 45 46" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 2. Mixing Bowl with Dough (原料 - 2) -->
  <g transform="translate(120, 155)">
    <!-- Bowl Back Rim -->
    <ellipse cx="0" cy="-5" rx="28" ry="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Bowl Body -->
    <path d="M -28 -5 C -28 18 -18 24 0 24 C 18 24 28 18 28 -5 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Bowl Inner Shadow -->
    <ellipse cx="0" cy="-3" rx="25" ry="6" fill="#cbd5e1" />
    <!-- Rising Bread Dough inside bowl -->
    <path d="M -20 -3 C -18 -18 18 -18 20 -3 C 18 5 -18 5 -20 -3 Z" fill="url(#doughGrad)" />
    <!-- Flour dusting on dough -->
    <path d="M -8 -8 C -4 -10 4 -10 8 -8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- 3. Small Ceramic Dish with Yeast/Eggs/Butter -->
  <g transform="translate(190, 165)">
    <ellipse cx="0" cy="5" rx="18" ry="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <ellipse cx="0" cy="3" rx="15" ry="5" fill="#e2e8f0" />
    <!-- Little butter cubes -->
    <rect x="-6" y="-2" width="7" height="6" rx="1" fill="#fde047" stroke="#eab308" stroke-width="1" />
    <rect x="2" y="1" width="6" height="5" rx="1" fill="#fde047" stroke="#eab308" stroke-width="1" />
  </g>

  <!-- 4. Finished Bread Loaf (Context contrast: "buat roti") -->
  <g transform="translate(200, 130)">
    <use href="#shadow" x="0" y="15" rx="18" ry="6" />
    <path d="M -15 10 C -18 -5 0 -12 12 -5 C 20 0 20 12 15 14 C -5 16 -12 15 -15 10 Z" fill="url(#breadGrad)" stroke="#451a03" stroke-width="1.5" />
    <!-- Score lines on bread -->
    <path d="M -3 0 Q 2 4 7 1" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- ================= CHARACTER: BAKER / CHEF ================= -->
  <!-- Presenting the raw ingredients with a proud, happy expression -->
  <g transform="translate(100, 65)">
    <!-- Body / Apron -->
    <!-- Torso & Chef Uniform -->
    <path d="M -25 75 C -25 50 -15 45 0 45 C 15 45 25 50 25 75 Z" fill="#0284c7" />
    <!-- White Chef Apron -->
    <path d="M -18 50 L -12 110 L 12 110 L 18 50 Z" fill="#ffffff" />
    <path d="M -12 50 C -6 55 6 55 12 50" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <path d="M -15 65 L 15 65" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Neck -->
    <rect x="-6" y="38" width="12" height="12" fill="url(#skin)" />

    <!-- Head -->
    <circle cx="0" cy="25" r="18" fill="url(#skin)" />
    
    <!-- Cheeks (Happy blush) -->
    <circle cx="-10" cy="28" r="4" fill="#fb7185" opacity="0.4" />
    <circle cx="10" cy="28" r="4" fill="#fb7185" opacity="0.4" />

    <!-- Eyes (Happy closed curves) -->
    <path d="M -11 22 C -9 19 -7 22 -5 22" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 5 22 C 7 19 9 22 11 22" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Big Happy Smile -->
    <path d="M -5 28 C 0 34 5 34 5 28" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Hair (Peeking out from under hat) -->
    <path d="M -16 18 Q -10 12 -4 16" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 8 16 Q 13 12 16 18" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Chef Hat (Toque) -->
    <path d="M -14 14 C -16 5 -10 -2 0 -2 C 10 -2 16 5 14 14 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <ellipse cx="0" cy="14" rx="15" ry="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M -10 3 C -5 -2 5 -2 10 3" stroke="#f1f5f9" stroke-width="2" fill="none" />

    <!-- Left Arm & Hand pointing to ingredients -->
    <path d="M -22 55 C -35 60 -45 70 -40 80" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <circle cx="-42" cy="82" r="5" fill="url(#skin)" />

    <!-- Right Arm & Hand gesturing open palm toward table -->
    <path d="M 22 55 C 35 60 42 75 35 85" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <circle cx="33" cy="87" r="5" fill="url(#skin)" />
  </g>

  <!-- ================= SPARKLES / ACCENTS ================= -->
  <!-- Highlighting the key learning subject area -->
  <g transform="translate(120, 110)">
    <!-- Sparkle 1 -->
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(60, 120)">
    <!-- Sparkle 2 -->
    <path d="M 0 -5 L 1.5 -1.5 L 5 0 L 1.5 1.5 L 0 5 L -1.5 1.5 L -5 0 L -1.5 -1.5 Z" fill="#f43f5e" />
  </g>
  <g transform="translate(180, 115)">
    <!-- Sparkle 3 -->
    <path d="M 0 -6 L 2 -2 L 6 0 L 2 2 L 0 6 L -2 2 L -6 0 L -2 -2 Z" fill="#38bdf8" />
  </g>

</svg>