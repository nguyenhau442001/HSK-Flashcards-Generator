<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(120, 120)">
    <!-- Wall Background -->
    <rect x="-80" y="-80" width="160" height="120" fill="#334155" rx="4"/>
    
    <!-- The Crooked Picture Frame -->
    <g transform="rotate(15)">
      <rect x="-45" y="-35" width="90" height="70" fill="#fbbf24" stroke="#1e293b" stroke-width="4"/>
      <rect x="-35" y="-25" width="70" height="50" fill="#e2e8f0"/>
      <!-- Abstract landscape inside -->
      <path d="M-35 0 Q 0 -20 35 0 L 35 25 L -35 25 Z" fill="#38bdf8"/>
      <circle cx="20" cy="-10" r="8" fill="#fef3c7"/>
    </g>
    
    <!-- Nail and String -->
    <path d="M0 -45 L 0 -35" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 -35 L -30 -15" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 -35 L 30 -15" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-45" r="3" fill="#fb923c"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="180" r="6" fill="#10b981" opacity="0.6"/>
  <circle cx="200" cy="60" r="4" fill="#ec4899" opacity="0.6"/>
  <path d="M180 190 L 210 190 M 195 175 L 195 205" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>