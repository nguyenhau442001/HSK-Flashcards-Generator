<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed container with gradient background -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Room Wall -->
  <rect x="0" y="0" width="240" height="180" fill="#334155"/>

  <!-- Window with warm glow -->
  <rect x="150" y="30" width="60" height="100" rx="8" fill="#fbbf24" opacity="0.6"/>
  <rect x="155" y="35" width="50" height="90" rx="6" fill="#f59e0b" opacity="0.8"/>
  <rect x="160" y="40" width="40" height="80" rx="4" fill="#fbbf24" opacity="1"/>
  <!-- Subtle window panes -->
  <rect x="160" y="79" width="40" height="2" fill="#d97706"/>
  <rect x="179" y="40" width="2" height="80" fill="#d97706"/>

  <!-- Meeting Table -->
  <ellipse cx="120" cy="180" rx="100" ry="40" fill="#475569"/>
  <rect x="20" y="160" width="200" height="40" fill="#475569"/>
  <ellipse cx="120" cy="200" rx="100" ry="40" fill="#334155"/> <!-- Shadow/depth for table -->

  <!-- Character 1 (Advocate) - Left side of table -->
  <!-- Body -->
  <rect x="50" y="100" width="60" height="80" rx="10" fill="#38bdf8"/> <!-- Blue shirt -->
  <!-- Head -->
  <circle cx="80" cy="90" r="25" fill="#fde047"/>
  <!-- Hair -->
  <path d="M60 70 C60 55 80 50 100 70 L100 90 C100 105 80 110 60 90 Z" fill="#475569"/>
  <!-- Face features -->
  <circle cx="70" cy="85" r="2" fill="#1e293b"/> <!-- Eye 1 -->
  <circle cx="90" cy="85" r="2" fill="#1e293b"/> <!-- Eye 2 -->
  <path d="M75 95 Q80 100 85 95" stroke="#1e293b" stroke-width="2" fill="none"/> <!-- Gentle smile -->
  <!-- Arm and Hand (advocating gesture) -->
  <rect x="80" y="130" width="40" height="15" rx="5" fill="#38bdf8"/> <!-- Sleeve -->
  <path d="M115 135 C125 125 135 130 130 145 C125 160 110 155 115 135 Z" fill="#fde047"/> <!-- Hand, open palm -->

  <!-- Character 2 (Listener) - Right side of table -->
  <!-- Body -->
  <rect x="130" y="100" width="60" height="80" rx="10" fill="#10b981"/> <!-- Green shirt -->
  <!-- Head -->
  <circle cx="160" cy="90" r="25" fill="#fde047"/>
  <!-- Hair -->
  <path d="M140 70 C140 55 160 50 180 70 L180 90 C180 105 160 110 140 90 Z" fill="#475569"/>
  <!-- Face features -->
  <circle cx="150" cy="85" r="2" fill="#1e293b"/> <!-- Eye 1 -->
  <circle cx="170" cy="85" r="2" fill="#1e293b"/> <!-- Eye 2 -->
  <path d="M155 95 Q160 98 165 95" stroke="#1e293b" stroke-width="2" fill="none"/> <!-- Neutral/listening expression -->
  <!-- Arm and Hand (resting on table) -->
  <rect x="120" y="130" width="40" height="15" rx="5" fill="#10b981"/> <!-- Sleeve -->
  <rect x="150" y="140" width="30" height="15" rx="5" fill="#fde047"/> <!-- Hand resting on table -->

  <!-- Document/Tablet on table - focus of discussion -->
  <rect x="105" y="165" width="30" height="20" rx="4" fill="#d1d5db"/> <!-- Paper/Tablet body -->
  <rect x="108" y="168" width="24" height="14" rx="2" fill="#38bdf8" opacity="0.5"/> <!-- Screen/content glow -->
  <rect x="110" y="171" width="20" height="8" fill="#60a5fa"/> <!-- Simplified content lines -->
</svg>