<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155" opacity="0.5"/>
  
  <!-- Notebook -->
  <rect x="50" y="100" width="100" height="120" rx="4" fill="#f8fafc"/>
  <rect x="50" y="100" width="10" height="120" rx="2" fill="#e2e8f0"/>
  <circle cx="55" cy="115" r="2" fill="#94a3b8"/>
  <circle cx="55" cy="145" r="2" fill="#94a3b8"/>
  <circle cx="55" cy="175" r="2" fill="#94a3b8"/>
  <circle cx="55" cy="205" r="2" fill="#94a3b8"/>
  
  <!-- Pencil -->
  <path d="M160 180 L210 130 L220 140 L170 190 Z" fill="#fbbf24"/>
  <path d="M160 180 L170 190 L175 185 L165 175 Z" fill="#f59e0b"/>
  <path d="M210 130 L215 135 L225 125 Z" fill="#1e293b"/>
  
  <!-- Scissors -->
  <path d="M180 80 L200 100 L190 110 L170 90 Z" fill="#38bdf8"/>
  <circle cx="170" cy="110" r="12" fill="none" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="190" cy="130" r="12" fill="none" stroke="#38bdf8" stroke-width="6"/>
  
  <!-- Eraser -->
  <rect x="120" y="150" width="30" height="20" rx="2" fill="#ec4899"/>
  
  <!-- Paperclip -->
  <path d="M70 80 C70 70 90 70 90 80 L90 120 C90 130 70 130 70 120 Z" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Ambient glow -->
  <circle cx="200" cy="50" r="40" fill="#fb923c" opacity="0.1" filter="blur(20px)"/>
</svg>