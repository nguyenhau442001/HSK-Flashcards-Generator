<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Character: Hesitant person -->
    <path d="M80 120c0-20 15-35 35-35s35 15 35 35v40H80z" fill="#38bdf8"/>
    <circle cx="115" cy="75" r="20" fill="#fde68a"/>
    <path d="M105 70h5m10 0h5m-15 10s5 5 10 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    
    <!-- Action: Repeatedly checking a watch/phone -->
    <rect x="130" y="100" width="30" height="20" rx="4" fill="#fb923c"/>
    <path d="M145 105v10" stroke="#0f172a" stroke-width="2"/>
    
    <!-- Visualizing "Repeatedly" (Zàisān) with motion arcs -->
    <path d="M165 90c10-10 25-10 35 0" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
    <path d="M165 80c15-15 40-15 55 0" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
    <path d="M165 70c20-20 55-20 75 0" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
    
    <!-- Context: Doorway/Threshold -->
    <path d="M20 40h40v120H20z" fill="#10b981" opacity="0.3"/>
    <rect x="25" y="45" width="30" height="110" fill="#0f172a"/>
    <circle cx="50" cy="100" r="4" fill="#ec4899"/>
  </g>
  
  <!-- Floor shadow -->
  <ellipse cx="120" cy="210" rx="80" ry="10" fill="#0f172a" opacity="0.5"/>
</svg>