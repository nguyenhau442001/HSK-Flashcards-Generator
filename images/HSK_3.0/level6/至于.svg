<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="warm-lamp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="window-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment: Office / Living Room Interior -->
  <g id="environment">
    <!-- Window with night city view -->
    <rect x="145" y="30" width="65" height="85" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="150" y="35" width="55" height="75" fill="url(#window-sky)" />
    <!-- City lights outside window -->
    <rect x="158" y="75" width="6" height="30" fill="#f59e0b" opacity="0.6"/>
    <rect x="170" y="60" width="8" height="45" fill="#38bdf8" opacity="0.4"/>
    <rect x="185" y="85" width="5" height="20" fill="#f43f5e" opacity="0.5"/>
    <!-- Window frame grid -->
    <line x1="177" y1="35" x2="177" y2="110" stroke="#475569" stroke-width="2"/>
    <line x1="150" y1="72" x2="205" y2="72" stroke="#475569" stroke-width="2"/>

    <!-- Bookshelf / Plants in background -->
    <rect x="25" y="45" width="40" height="70" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="70" x2="65" y2="70" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="95" x2="65" y2="95" stroke="#334155" stroke-width="2"/>
    <!-- Books on shelf -->
    <rect x="30" y="55" width="8" height="15" rx="1" fill="#ec4899" />
    <rect x="40" y="52" width="6" height="18" rx="1" fill="#38bdf8" />
    <rect x="48" y="57" width="12" height="13" rx="1" fill="#10b981" />
    <!-- Plant pot on shelf -->
    <path d="M33 90 L37 95 L31 95 Z" fill="#94a3b8"/>
    <path d="M34 90 Q34 82 39 80 Q44 82 44 90 Z" fill="#10b981"/>

    <!-- Wall clock showing "later time" -->
    <circle cx="105" cy="45" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <line x1="105" y1="45" x2="112" y2="40" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="105" y1="45" x2="105" y2="35" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="105" cy="45" r="1" fill="#f8fafc"/>

    <!-- Warm hanging lamp casting downward light -->
    <path d="M95 15 L115 15 L120 22 L90 22 Z" fill="#475569"/>
    <polygon points="80,140 130,140 150,22 60,22" fill="url(#warm-lamp)" style="mix-blend-mode: screen;" />

    <!-- Foreground Desk -->
    <path d="M15 165 L225 165 L235 210 L5 210 Z" fill="url(#desk-grad)" stroke="#475569" stroke-width="2"/>
    <rect x="15" y="160" width="210" height="8" rx="2" fill="#475569" />

    <!-- Desk Props (Documents, Laptop, Coffee Cup) -->
    <!-- Laptop -->
    <path d="M155 155 L210 155 L215 162 L150 162 Z" fill="#64748b" />
    <path d="M158 125 L207 125 L210 155 L155 155 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <rect x="163" y="132" width="37" height="18" rx="1" fill="#0f172a" />
    <line x1="170" y1="138" x2="190" y2="138" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="170" y1="144" x2="182" y2="144" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Coffee Mug -->
    <rect x="130" y="145" width="14" height="18" rx="3" fill="#f8fafc" />
    <path d="M144 149 C148 149 148 159 144 159" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <path d="M134 140 Q137 133 134 130" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Folded Paper / Complex Document (representing "the tricky issue/question") -->
    <path d="M75 145 L115 142 L118 162 L78 165 Z" fill="#f8fafc" />
    <line x1="82" y1="150" x2="108" y2="148" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="82" y1="155" x2="102" y2="153" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Red marked question area on paper -->
    <circle cx="108" cy="157" r="4" fill="#f43f5e" />
  </g>

  <!-- Characters -->
  <g id="characters">
    <!-- Character 1: Person A (Pointing to the paper/issue, gesturing "we'll talk about this later") -->
    <g id="character-left">
      <!-- Body / Torso -->
      <path d="M40 190 C40 165 60 160 75 160 C90 160 110 165 110 190 Z" fill="#3b82f6" />
      <!-- Collar -->
      <path d="M63 160 L75 175 L87 160 Z" fill="#f8fafc" />

      <!-- Head & Hair -->
      <circle cx="75" cy="120" r="18" fill="#fde047" /> <!-- Skin tone -->
      <!-- Hair (Dark stylish cut) -->
      <path d="M57 120 C57 105 65 100 75 100 C85 100 93 105 93 120 C93 124 92 120 90 112 C88 104 80 103 75 103 C70 103 62 104 60 112 C58 120 57 124 57 120 Z" fill="#0f172a" />

      <!-- Facial Expression (Relaxed, forward-looking, pragmatic) -->
      <circle cx="69" cy="118" r="1.5" fill="#0f172a" />
      <circle cx="81" cy="118" r="1.5" fill="#0f172a" />
      <!-- Calm, confident smile -->
      <path d="M72 125 Q75 128 78 125" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <!-- Left Arm resting -->
      <path d="M45 170 Q35 185 45 195" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" fill="none" />
      
      <!-- Right Arm gesturing forward / pushing aside for later -->
      <path d="M105 165 Q115 150 95 142" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" fill="none" />
      <!-- Hand pointing / deflecting gently -->
      <circle cx="93" cy="140" r="4" fill="#fde047" />
    </g>

    <!-- Character 2: Person B (Listening, nodding, understanding the postponement) -->
    <g id="character-right">
      <!-- Body / Torso -->
      <path d="M140 195 C140 170 155 165 170 165 C185 165 200 170 200 195 Z" fill="#10b981" />
      <!-- Collar -->
      <path d="M160 165 L170 178 L180 165 Z" fill="#f8fafc" />

      <!-- Head & Hair -->
      <circle cx="170" cy="125" r="17" fill="#fde047" />
      <!-- Hair (Brown bob) -->
      <path d="M153 125 C153 110 160 105 170 105 C180 105 187 110 187 125 C187 132 185 140 180 135 C175 130 173 135 170 135 C167 135 165 130 160 135 C155 140 153 132 153 125 Z" fill="#78350f" />

      <!-- Facial Expression (Nodding / Understanding) -->
      <circle cx="165" cy="123" r="1.5" fill="#0f172a" />
      <circle cx="175" cy="123" r="1.5" fill="#0f172a" />
      <!-- Gentle agreeing smile -->
      <path d="M167 130 Q170 133 173 130" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <!-- Arms crossed or resting naturally -->
      <path d="M145 180 Q160 170 175 185" stroke="#10b981" stroke-width="10" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Narrative Action Accent: A subtle futuristic time/flow indicator representing "later" (future action) -->
  <g id="future-indicator" transform="translate(110, 85)" opacity="0.8">
    <path d="M0 15 C10 5, 20 25, 30 15" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="4 4" filter="url(#glow)"/>
    <polygon points="30,15 24,11 26,17" fill="#38bdf8"/>
  </g>
</svg>