<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Mirror Frame Gradient -->
    <linearGradient id="mirrorFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Wood Vanity Gradient -->
    <linearGradient id="vanityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Eyebrow Hair Texture Pattern (Simulated via dots/lines) -->
    <linearGradient id="browGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38281d"/>
      <stop offset="50%" stop-color="#4e3524"/>
      <stop offset="100%" stop-color="#2d2017"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Background Accents -->
  <circle cx="190" cy="50" r="30" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>
  <circle cx="50" cy="180" r="40" fill="#fbbf24" opacity="0.05" filter="url(#glow)"/>

  <!-- Vanity Table Surface -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="url(#vanityGrad)"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#475569" stroke-width="2"/>

  <!-- Vanity Props: Cosmetic Bottle Left -->
  <rect x="25" y="160" width="16" height="30" rx="4" fill="#ec4899" filter="url(#shadow)"/>
  <rect x="29" y="154" width="8" height="6" rx="2" fill="#f472b6"/>
  
  <!-- Vanity Props: Makeup Brush Right -->
  <path d="M 210 150 L 216 190 L 212 190 L 206 150 Z" fill="#64748b"/>
  <circle cx="208" cy="146" r="5" fill="#f8fafc"/>
  <path d="M 203 140 C 203 135 213 135 213 140 Z" fill="#38bdf8"/>

  <!-- Vanity Mirror Stand & Base -->
  <ellipse cx="120" cy="190" rx="35" ry="8" fill="#d97706" filter="url(#shadow)"/>
  <rect x="117" y="145" width="6" height="47" fill="url(#mirrorFrame)"/>

  <!-- Vanity Mirror Frame (Oval/Arch) -->
  <g filter="url(#shadow)">
    <!-- Outer Frame -->
    <ellipse cx="120" cy="95" rx="55" ry="65" fill="url(#mirrorFrame)"/>
    <!-- Inner Glass -->
    <ellipse cx="120" cy="95" rx="48" ry="58" fill="#0f172a"/>
    <!-- Mirror Reflection Gradient -->
    <ellipse cx="120" cy="95" rx="48" ry="58" fill="url(#bgGrad)" opacity="0.7"/>
    <path d="M 90 60 Q 120 40 150 70 Q 100 80 90 60 Z" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- Character Reflection in Mirror (Focus on Eyes and Eyebrows - 眉毛) -->
  <g transform="translate(120, 95)">
    <!-- Face Base Shape -->
    <clipPath id="mirrorClip">
      <ellipse cx="0" cy="0" rx="46" ry="56"/>
    </clipPath>
    
    <g clip-path="url(#mirrorClip)">
      <!-- Skin Tone -->
      <rect x="-60" y="-60" width="120" height="120" fill="#fed7aa"/>
      
      <!-- Gentle Blush -->
      <circle cx="-22" cy="12" r="10" fill="#f43f5e" opacity="0.2" filter="url(#glow)"/>
      <circle cx="22" cy="12" r="10" fill="#f43f5e" opacity="0.2" filter="url(#glow)"/>

      <!-- Nose -->
      <path d="M 0 5 Q 3 12 0 16" stroke="#fdba74" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Left Eye -->
      <g transform="translate(-18, -2)">
        <!-- Eye White -->
        <ellipse cx="0" cy="0" rx="9" ry="7" fill="#ffffff"/>
        <!-- Iris -->
        <circle cx="0" cy="0" rx="5" ry="5" fill="#1e293b"/>
        <!-- Pupil & Highlight -->
        <circle cx="1" cy="-1" r="2" fill="#0f172a"/>
        <circle cx="-2" cy="-2" r="1.5" fill="#ffffff"/>
        <!-- Eyelashes & Lid -->
        <path d="M -9 -4 Q 0 -9 9 -4" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M -7 5 Q 0 8 7 5" stroke="#fdba74" stroke-width="1" fill="none"/>
      </g>

      <!-- Right Eye -->
      <g transform="translate(18, -2)">
        <!-- Eye White -->
        <ellipse cx="0" cy="0" rx="9" ry="7" fill="#ffffff"/>
        <!-- Iris -->
        <circle cx="0" cy="0" rx="5" ry="5" fill="#1e293b"/>
        <!-- Pupil & Highlight -->
        <circle cx="1" cy="-1" r="2" fill="#0f172a"/>
        <circle cx="-2" cy="-2" r="1.5" fill="#ffffff"/>
        <!-- Eyelashes & Lid -->
        <path d="M -9 -4 Q 0 -9 9 -4" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M -7 5 Q 0 8 7 5" stroke="#fdba74" stroke-width="1" fill="none"/>
      </g>

      <!-- ========================================== -->
      <!-- MAIN TARGET FOCUS: LÔNG MÀY (EYEBROWS)    -->
      <!-- ========================================== -->

      <!-- Left Eyebrow (眉毛 - méimao) -->
      <g transform="translate(-18, -19) rotate(-8)">
        <path d="M -12 2 C -5 -6 5 -6 14 0 C 8 3 0 3 -12 2 Z" fill="url(#browGrad)" filter="url(#shadow)"/>
        <!-- Individual hair strokes for vector texture -->
        <path d="M -10 1 L -8 -2 M -6 1 L -4 -3 M -2 1 L 0 -4 M 2 1 L 4 -3 M 6 2 L 9 -1" stroke="#2d2017" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
      </g>

      <!-- Right Eyebrow (眉毛 - méimao) - Expressively arched -->
      <g transform="translate(18, -21) rotate(6)">
        <path d="M -14 0 C -5 -7 5 -5 12 3 C 4 3 -4 2 -14 0 Z" fill="url(#browGrad)" filter="url(#shadow)"/>
        <!-- Individual hair strokes for vector texture -->
        <path d="M -9 -1 L -7 -4 M -5 -1 L -3 -5 M -1 0 L 1 -5 M 3 1 L 6 -2 M 8 2 L 10 0" stroke="#2d2017" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
      </g>

    </g>
  </g>

  <!-- Interactive/App Polish: Floating Cosmetic Sparkles & Action Elements -->
  <!-- Eyebrow Pencil floating near the mirror -->
  <g transform="translate(170, 110) rotate(-35)" filter="url(#shadow)">
    <!-- Pencil Body -->
    <path d="M -25 -4 L 15 -4 L 20 0 L 15 4 L -25 4 Z" fill="#fb923c"/>
    <!-- Pencil Tip -->
    <path d="M 15 -4 L 25 0 L 15 4 Z" fill="#1e293b"/>
    <!-- Wooden Grip lines -->
    <line x1="-15" y1="-4" x2="-15" y2="4" stroke="#ea580c" stroke-width="1.5"/>
    <line x1="-5" y1="-4" x2="-5" y2="4" stroke="#ea580c" stroke-width="1.5"/>
    <line x1="5" y1="-4" x2="5" y2="4" stroke="#ea580c" stroke-width="1.5"/>
  </g>

  <!-- Golden Sparkles Highlighting the Eyebrow Care Context -->
  <g fill="#fbbf24" filter="url(#glow)">
    <path d="M 150 75 Q 155 75 155 70 Q 155 75 160 75 Q 155 75 155 80 Q 155 75 150 75 Z"/>
    <path d="M 85 85 Q 88 85 88 82 Q 88 85 91 85 Q 88 85 88 88 Q 88 85 85 85 Z"/>
  </g>

  <circle cx="165" cy="65" r="2" fill="#38bdf8"/>
  <circle cx="75" cy="95" r="1.5" fill="#38bdf8"/>

</svg>