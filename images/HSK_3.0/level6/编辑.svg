<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Laptop -->
  <path d="M60 160 L180 160 L195 120 L45 120 Z" fill="#64748b"/>
  <path d="M55 160 L185 160 L190 165 L50 165 Z" fill="#475569"/>
  <rect x="65" y="125" width="110" height="30" rx="2" fill="#0f172a"/>
  
  <!-- Screen Content: Editing marks -->
  <path d="M80 135 L100 135 M80 142 L110 142 M80 149 L95 149" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M120 135 L160 135 M120 142 L150 142" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Coffee Mug -->
  <circle cx="190" cy="145" r="15" fill="#ec4899"/>
  <rect x="200" y="140" width="8" height="10" rx="2" fill="none" stroke="#ec4899" stroke-width="3"/>
  
  <!-- Red Pen/Stylus -->
  <rect x="40" y="145" width="25" height="4" rx="2" fill="#fb923c" transform="rotate(-25 40 145)"/>
  <rect x="35" y="143" width="8" height="6" rx="1" fill="#ef4444"/>
  
  <!-- Stack of Papers -->
  <rect x="30" y="170" width="40" height="50" rx="2" fill="#f1f5f9"/>
  <rect x="35" y="175" width="35" height="45" rx="2" fill="#e2e8f0"/>
  <path d="M35 185 L65 185 M35 195 L65 195 M35 205 L60 205" stroke="#94a3b8" stroke-width="1"/>
  
  <!-- Ambient Light/Glow -->
  <circle cx="120" cy="120" r="80" fill="#38bdf8" opacity="0.05"/>
  <circle cx="180" cy="180" r="40" fill="#f59e0b" opacity="0.05"/>
</svg>