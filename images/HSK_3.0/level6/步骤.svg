<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Workbench Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Step 1: Component -->
  <circle cx="60" cy="130" r="15" fill="#38bdf8"/>
  <path d="M60 145 L60 160" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Step 2: Component -->
  <rect x="105" y="115" width="30" height="30" rx="4" fill="#fb923c"/>
  <path d="M120 145 L120 160" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Step 3: Component -->
  <polygon points="180,115 195,145 165,145" fill="#10b981"/>
  <path d="M180 145 L180 160" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Assembly Line / Sequence Flow -->
  <path d="M40 180 L200 180" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Human Hand interacting with the sequence -->
  <path d="M140 100 C140 80, 160 80, 160 100 L160 120 L150 120 L140 100" fill="#fde68a"/>
  <path d="M150 120 L150 150" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Decorative Sparks/Action -->
  <circle cx="190" cy="90" r="3" fill="#f59e0b"/>
  <circle cx="200" cy="100" r="2" fill="#f59e0b"/>
  <circle cx="185" cy="80" r="2" fill="#f59e0b"/>
</svg>