<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Document Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Glow Effect for Checkmarks -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- ENVIRONMENT: Modern Office/Reception Wall -->
  <!-- Subtle architectural lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>
  <rect x="25" y="40" width="30" height="140" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="185" y="40" width="30" height="140" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- CENTRAL PROP: The Official Regulation Board / Master Document ("这个规定") -->
  <g filter="url(#shadow)">
    <!-- Document Base -->
    <rect x="65" y="30" width="110" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Top Clip / Header -->
    <path d="M 95 30 L 145 30 L 140 42 L 100 42 Z" fill="#64748b"/>
    <circle cx="120" cy="36" r="3" fill="#cbd5e1"/>

    <!-- Document Header Icon (Scales of justice / Uniform rule symbol) -->
    <circle cx="120" cy="62" r="12" fill="#e0f2fe"/>
    <path d="M 113 62 L 127 62 M 120 55 L 120 69" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Abstract Content Lines (Simulating text/rules) -->
    <rect x="80" y="82" width="60" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="80" y="94" width="80" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="80" y="103" width="70" height="4" rx="2" fill="#cbd5e1"/>

    <!-- Divider -->
    <line x1="80" y1="117" x2="160" y2="117" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- UNIFORMITY ACTION: Three synchronized cascading approval stamps ("一律适用") -->
  <!-- Stamp 1 (Left / Person A's file) -->
  <g transform="translate(35, 115) rotate(-12)" filter="url(#shadow)">
    <rect x="0" y="0" width="48" height="32" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="24" cy="16" r="10" fill="#d1fae5"/>
    <path d="M 19 16 L 22 19 L 29 12" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stamp 2 (Right / Person B's file) -->
  <g transform="translate(155, 105) rotate(10)" filter="url(#shadow)">
    <rect x="0" y="0" width="48" height="32" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="24" cy="16" r="10" fill="#d1fae5"/>
    <path d="M 19 16 L 22 19 L 29 12" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stamp 3 (Center Bottom / Master Rule Application) -->
  <g transform="translate(96, 122)" filter="url(#shadow)">
    <rect x="0" y="0" width="48" height="32" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="24" cy="16" r="10" fill="#d1fae5"/>
    <path d="M 19 16 L 22 19 L 29 12" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND CHARACTERS / HANDS APPLYING THE RULE (Conveying inclusive application) -->
  <!-- Left Character Hand & Cuff -->
  <path d="M 0 190 Q 25 160 50 165" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="48" cy="165" r="9" fill="#fbcfe8"/> <!-- Skin tone -->
  <!-- Right Character Hand & Cuff -->
  <path d="M 240 190 Q 215 160 190 165" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
  <circle cx="192" cy="165" r="9" fill="#fbcfe8"/>

  <!-- DESK SURFACE -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  <rect x="0" y="180" width="240" height="6" fill="#475569"/>

  <!-- PROPS ON DESK -->
  <!-- Pen / Stylus -->
  <g transform="translate(170, 185) rotate(-45)">
    <rect x="0" y="0" width="28" height="5" rx="2.5" fill="#f59e0b"/>
    <polygon points="28,0 35,2.5 28,5" fill="#94a3b8"/>
  </g>

  <!-- Small Plant / Context Prop for life -->
  <path d="M 20 180 C 20 165 30 165 30 180 Z" fill="#64748b"/>
  <circle cx="25" cy="160" r="6" fill="#10b981"/>
  <circle cx="18" cy="166" r="5" fill="#34d399"/>
  <circle cx="32" cy="165" r="5" fill="#059669"/>

  <!-- EQUALITY / UNIVERSAL APPLICATION VISUAL ACCENTS (Subtle glowing connects) -->
  <path d="M 50 130 Q 80 110 96 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M 190 120 Q 160 100 144 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
</svg>