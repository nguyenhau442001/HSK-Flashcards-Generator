<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Glow Gradient for Rescue/Success -->
    <radialGradient id="rescue-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Ladder Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Glow representing "Thanks to..." / Breakthrough moment -->
  <circle cx="120" cy="110" r="100" fill="url(#rescue-glow)"/>

  <!-- BACKGROUND ENVIRONMENT: Potted Plant on a Shelf (Indoor Home/Office Context) -->
  <g opacity="0.6">
    <!-- Wall Shelf -->
    <rect x="20" y="45" width="200" height="6" rx="3" fill="#334155"/>
    <rect x="50" y="51" width="16" height="12" rx="2" fill="#475569"/>
    <rect x="174" y="51" width="16" height="12" rx="2" fill="#475569"/>

    <!-- Small Potted Plant -->
    <path d="M 85,45 L 95,25 L 105,45 Z" fill="#475569"/>
    <circle cx="95" cy="22" r="12" fill="#10b981"/>
    <circle cx="88" cy="25" r="8" fill="#059669"/>
    <circle cx="102" cy="25" r="9" fill="#059669"/>
  </g>

  <!-- MAIN SCENE: A dramatic rescue moment symbolizing "May mà / Nhờ có" -->
  <!-- Falling Coffee Mug (Disaster averted / narrowly saved) -->
  <g transform="translate(145, 105) rotate(25)" filter="url(#shadow)">
    <!-- Motion lines -->
    <path d="M -15,-25 L -25,-40" stroke="#f8fafc" stroke-width="2" stroke-dasharray="3,3" opacity="0.4"/>
    <path d="M -5,-30 L -12,-48" stroke="#f8fafc" stroke-width="2" stroke-dasharray="3,3" opacity="0.4"/>
    
    <!-- Mug Body -->
    <rect x="-14" y="-12" width="28" height="32" rx="4" fill="#38bdf8"/>
    <!-- Coffee Splash Inside -->
    <ellipse cx="0" cy="-12" rx="12" ry="4" fill="#78350f"/>
    <!-- Mug Handle -->
    <path d="M 14,-6 C 22,-6 22,10 14,10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Dramatic Rescue Hand (The "Nhờ có" / Savior element) -->
  <g filter="url(#shadow)">
    <!-- Arm reaching in from bottom-left -->
    <path d="M -20,240 C 20,200 60,165 85,150 L 95,165 C 70,180 35,210 0,250 Z" fill="#fb923c"/>
    <!-- Sleeve cuff -->
    <path d="M 15,220 L 45,200 L 55,212 L 25,232 Z" fill="#4f46e5"/>

    <!-- Hand catching the mug just in time -->
    <path d="M 85,150 C 90,140 100,135 110,140 C 115,142 118,147 117,152 C 122,150 128,154 128,160 C 128,165 123,170 118,172 L 95,165 Z" fill="#fbcfe8"/>
    <!-- Fingers wrapped securely -->
    <path d="M 105,138 C 112,136 118,140 116,146" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 113,144 C 120,144 124,148 122,154" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- STABLE PROP: The sturdy wooden desk anchoring the scene -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <rect x="0" y="196" width="240" height="8" fill="#334155" rx="2"/>
  <rect x="15" y="204" width="12" height="36" fill="#1e293b"/>
  <rect x="213" y="204" width="12" height="36" fill="#1e293b"/>

  <!-- Secondary Prop on Desk: A stack of books/notebooks for deep environment -->
  <g transform="translate(45, 175)" filter="url(#shadow)">
    <rect x="0" y="15" width="55" height="10" rx="2" fill="#ef4444"/>
    <rect x="-5" y="8" width="60" height="9" rx="2" fill="#3b82f6"/>
    <rect x="2" y="0" width="50" height="10" rx="2" fill="#10b981"/>
    <!-- Bookmark hanging -->
    <path d="M 15,10 L 15,22 L 20,19 L 25,22 L 25,10 Z" fill="#f59e0b"/>
  </g>

  <!-- FOREGROUND & ACCENT: Sparks/Sparkles of Relief and Success -->
  <g fill="#fbbf24">
    <!-- Star sparkle 1 -->
    <path d="M 135,90 Q 135,100 145,100 Q 135,100 135,110 Q 135,100 125,100 Q 135,100 135,90 Z" />
    <!-- Star sparkle 2 -->
    <path d="M 100,75 Q 100,81 106,81 Q 100,81 100,87 Q 100,81 94,81 Q 100,81 100,75 Z" />
    <!-- Small glowing dots -->
    <circle cx="160" cy="80" r="2.5" opacity="0.8"/>
    <circle cx="120" cy="70" r="1.5" opacity="0.6"/>
    <circle cx="150" cy="130" r="2" opacity="0.7"/>
    <circle cx="85" cy="115" r="3" opacity="0.5"/>
  </g>

  <!-- Action Highlight / Focus ring -->
  <circle cx="130" cy="115" r="32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>

</svg>