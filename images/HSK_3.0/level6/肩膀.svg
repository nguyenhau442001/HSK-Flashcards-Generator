<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="20%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Shoulder Highlight -->
    <linearGradient id="shoulderHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Elements: Distant Mountains & Pine Trees -->
  <g opacity="0.25">
    <path d="M 0 210 L 60 160 L 130 200 L 200 150 L 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
    <path d="M 30 240 L 50 190 L 70 240 Z" fill="#1e293b"/>
    <path d="M 170 240 L 190 180 L 210 240 Z" fill="#1e293b"/>
  </g>

  <!-- Magical Night Sky Elements -->
  <!-- Soft Background Glow -->
  <circle cx="180" cy="60" r="70" fill="url(#starGlow)" opacity="0.6"/>
  
  <!-- Tiny Stars -->
  <circle cx="40" cy="50" r="1" fill="#fef08a" opacity="0.8"/>
  <circle cx="80" cy="30" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="210" cy="110" r="1" fill="#fef08a" opacity="0.7"/>
  <circle cx="130" cy="70" r="1.2" fill="#fef08a" opacity="0.5"/>
  
  <!-- Main Glowing Star (The Target of the Child's Reach) -->
  <g transform="translate(180, 60)">
    <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="#fef08a"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- MAIN SUBJECT: FATHER'S BROAD SHOULDERS & CHILD -->
  <g id="characters">
    <!-- Father's Torso & Broad Shoulders (Back View) -->
    <!-- Base Jacket Shape (Broad & Strong) -->
    <path d="M 40 240 
             C 40 195, 55 145, 100 138 
             L 140 138 
             C 185 145, 200 195, 200 240 
             Z" 
          fill="#115e59"/>

    <!-- Shoulder Definition & Highlights (Emphasizing Width) -->
    <!-- Left Shoulder Curve -->
    <path d="M 42 240 C 42 198, 56 150, 95 140" fill="none" stroke="url(#shoulderHighlight)" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Shoulder Curve -->
    <path d="M 198 240 C 198 198, 184 150, 145 140" fill="none" stroke="url(#shoulderHighlight)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Shadow under the neck/collar area -->
    <path d="M 95 140 C 105 145, 135 145, 145 140 C 135 152, 105 152, 95 140 Z" fill="#0f172a" opacity="0.4"/>

    <!-- Father's Head (Back View, nestled between child's legs) -->
    <path d="M 105 135 C 105 112, 135 112, 135 135 Z" fill="#1e293b"/> <!-- Hair -->
    <path d="M 102 138 C 102 145, 138 145, 138 138 Z" fill="#115e59"/> <!-- Collar -->

    <!-- Child's Legs (Draped over the shoulders) -->
    <!-- Left Leg -->
    <path d="M 88 132 
             C 82 145, 80 165, 82 175 
             C 83 182, 93 182, 94 175 
             C 92 165, 94 145, 102 132 
             Z" 
          fill="#f43f5e"/> <!-- Coral Pants -->
    <!-- Left Shoe -->
    <path d="M 78 174 C 76 182, 88 186, 94 180 C 94 176, 84 170, 78 174 Z" fill="#f8fafc"/>
    <path d="M 78 178 L 90 182" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right Leg -->
    <path d="M 152 132 
             C 158 145, 160 165, 158 175 
             C 157 182, 147 182, 146 175 
             C 148 165, 146 145, 138 132 
             Z" 
          fill="#f43f5e"/> <!-- Coral Pants -->
    <!-- Right Shoe -->
    <path d="M 162 174 C 164 182, 152 186, 146 180 C 146 176, 156 170, 162 174 Z" fill="#f8fafc"/>
    <path d="M 162 178 L 150 182" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Father's Hands (Holding the child's legs securely) -->
    <!-- Left Hand -->
    <path d="M 78 168 C 76 160, 90 155, 92 165 C 93 170, 84 174, 78 168 Z" fill="#fbcfe8"/>
    <!-- Right Hand -->
    <path d="M 162 168 C 164 160, 150 155, 148 165 C 147 170, 156 174, 162 168 Z" fill="#fbcfe8"/>

    <!-- Child's Torso -->
    <path d="M 105 95 C 105 85, 135 85, 135 95 L 132 135 L 108 135 Z" fill="#fb923c"/> <!-- Orange Sweater -->
    <!-- Yellow Scarf blowing slightly -->
    <path d="M 108 95 C 95 92, 85 100, 75 95 C 85 105, 100 102, 112 98 Z" fill="#facc15"/>

    <!-- Child's Head -->
    <circle cx="120" cy="75" r="14" fill="#fbcfe8"/> <!-- Skin -->
    <!-- Child's Hair (Cute tuft) -->
    <path d="M 108 70 C 108 60, 132 60, 132 70 C 126 64, 114 64, 108 70 Z" fill="#78350f"/>
    <path d="M 120 62 Q 124 55 130 58 Q 124 62 120 62 Z" fill="#78350f"/> <!-- Hair strand -->

    <!-- Child's Face Details (Profile looking up-right) -->
    <circle cx="126" cy="73" r="1.5" fill="#1e293b"/> <!-- Eye -->
    <path d="M 128 78 Q 125 82 122 80" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/> <!-- Smile -->

    <!-- Child's Arms -->
    <!-- Left Arm (Holding Father's Head for balance) -->
    <path d="M 108 98 C 98 102, 98 118, 106 118" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="106" cy="118" r="3" fill="#fbcfe8"/>

    <!-- Right Arm (Reaching up and out towards the star) -->
    <path d="M 132 95 C 145 85, 160 70, 168 62" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <!-- Reaching Hand -->
    <circle cx="168" cy="62" r="3" fill="#fbcfe8"/>
  </g>

  <!-- Foreground Magic Dust / Sparkles -->
  <g opacity="0.7">
    <circle cx="160" cy="90" r="1.5" fill="#fef08a"/>
    <circle cx="145" cy="110" r="1" fill="#fef08a"/>
    <circle cx="185" cy="105" r="2" fill="#fef08a"/>
    <path d="M 195,95 Q 195,100 200,100 Q 195,100 195,105 Q 195,100 190,100 Q 195,100 195,95 Z" fill="#fef08a"/>
  </g>
</svg>