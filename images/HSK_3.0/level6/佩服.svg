<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="windowClip">
      <path d="M 60,30 L 180,30 L 180,110 L 60,110 Z"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Spotlight representing admiration/courage -->
  <circle cx="120" cy="120" r="120" fill="url(#spotlight)"/>

  <!-- Interior Wall & Window Scene (Rock climbing gym / High altitude context for "courage") -->
  <!-- Large Window looking out to dramatic peaks/sky -->
  <path d="M 55,25 L 185,25 L 185,115 L 55,115 Z" fill="#0f172a" stroke="#334155" stroke-width="2" rx="4"/>
  <rect x="60" y="30" width="120" height="80" fill="url(#windowGlow)"/>
  
  <!-- Mountain silhouette outside window -->
  <polygon points="60,110 90,70 115,95 150,55 180,110" fill="#1e293b"/>
  <!-- Climbing holds on the interior wall -->
  <circle cx="40" cy="80" r="4" fill="#fb923c"/>
  <circle cx="45" cy="140" r="5" fill="#38bdf8"/>
  <circle cx="200" cy="100" r="4" fill="#10b981"/>
  <circle cx="195" cy="160" r="5" fill="#ec4899"/>
  <path d="M 50,115 L 190,115 L 190,240 L 50,240 Z" fill="#1e293b" opacity="0.3"/>

  <!-- Character 1 (The Brave Climber - on the left, looking confident, gear on) -->
  <g transform="translate(15, 0)">
    <!-- Climbing harness / ropes -->
    <path d="M 65,140 L 80,170 L 95,140" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Body & Torso (Bright orange/energetic climbing jacket) -->
    <path d="M 62,130 C 60,120 70,110 80,110 C 90,110 100,120 98,130 L 95,170 L 65,170 Z" fill="#f97316"/>
    <path d="M 75,110 L 75,170" fill="none" stroke="#c2410c" stroke-width="2"/> <!-- zipper -->

    <!-- Head & Face (Smiling, confident expression) -->
    <circle cx="80" cy="92" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 66,90 C 66,78 94,78 94,90 C 90,84 70,84 66,90 Z" fill="#334155"/>
    <!-- Confident Eyes & Smile -->
    <path d="M 74,92 Q 77,88 80,92" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 84,92 Q 87,88 90,92" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 77,98 Q 82,103 87,98" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms (One raised in victory/courage thumbs up) -->
    <path d="M 62,120 L 48,105 L 55,98" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="53" cy="96" r="4" fill="#fbcfe8"/>
    <path d="M 98,120 L 112,130" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Legs -->
    <path d="M 70,170 L 70,215 L 65,220" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 90,170 L 95,210 L 102,215" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (The Observer - filled with admiration, hands clasped, sparkling eyes) -->
  <g transform="translate(95, 0)">
    <!-- Body (Teal/Cool tone hoodie contrasting with climber) -->
    <path d="M 62,135 C 60,125 70,115 80,115 C 90,115 100,125 98,135 L 92,185 L 68,185 Z" fill="#0ea5e9"/>
    <circle cx="80" cy="135" r="8" fill="#38bdf8"/> <!-- pocket / detail -->

    <!-- Head & Face (Looking up in awe, wide expressive eyes, gentle smile) -->
    <circle cx="80" cy="95" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 66,95 C 66,78 94,78 94,95 C 90,86 70,86 66,95 Z" fill="#475569"/>
    
    <!-- Expressive Adoring Eyes (larger pupils) -->
    <circle cx="75" cy="95" r="2.5" fill="#0f172a"/>
    <circle cx="85" cy="95" r="2.5" fill="#0f172a"/>
    <circle cx="76.5" cy="94" r="1" fill="#ffffff"/>
    <circle cx="86.5" cy="94" r="1" fill="#ffffff"/>
    <!-- Soft Smile -->
    <path d="M 77,101 Q 80,105 83,101" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Blushing cheeks of admiration -->
    <circle cx="72" cy="99" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="88" cy="99" r="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Arms (Clasped together near chest in gesture of deep respect/admiration) -->
    <path d="M 64,130 C 70,130 75,135 78,140" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round"/>
    <path d="M 96,130 C 90,130 85,135 82,140" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round"/>
    <!-- Clasped hands -->
    <circle cx="80" cy="142" r="5" fill="#fbcfe8"/>

    <!-- Legs -->
    <path d="M 72,185 L 70,225" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M 88,185 L 90,225" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Sparkles / Floating visual metaphors for respect, brilliance, and positive emotion -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 105,70 Q 105,78 97,78 Q 105,78 105,86 Q 105,78 113,78 Q 105,78 105,70 Z"/>
    <!-- Star 2 -->
    <path d="M 155,95 Q 155,100 150,100 Q 155,100 155,105 Q 155,100 160,100 Q 155,100 155,95 Z" transform="scale(0.8) translate(40, 10)"/>
    <!-- Star 3 (small) -->
    <circle cx="115" cy="62" r="2" opacity="0.8"/>
    <circle cx="145" cy="75" r="1.5" opacity="0.6"/>
  </g>

  <!-- Foreground Floor / Ground Line -->
  <path d="M 20,225 L 220,225" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="120" cy="225" rx="90" ry="4" fill="#0f172a" opacity="0.5"/>
</svg>