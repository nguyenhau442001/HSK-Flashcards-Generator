<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Goal / Pursuit -->
    <radialGradient id="amber-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Lighting Effects -->
  <circle cx="120" cy="90" r="100" fill="url(#amber-glow)" />
  <polygon points="120,30 60,200 180,200" fill="url(#light-beam)" />

  <!-- Room Interior / Environment Props -->
  <!-- Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16" />
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2" />

  <!-- Back Wall Architecture (Windows / Pillars hinting at public space/office) -->
  <rect x="80" y="30" width="80" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="90" y="40" width="28" height="90" rx="2" fill="#0f172a" />
  <rect x="122" y="40" width="28" height="90" rx="2" fill="#0f172a" />

  <!-- Central Symbol of "Pursuit/Goal" (Elevated Stage / Platform with glowing emblem of connection) -->
  <path d="M70,200 L170,200 L160,180 L80,180 Z" fill="#334155" />
  <path d="M85,180 L155,180 L150,175 L90,175 Z" fill="#475569" />
  
  <!-- Glowing balance / connection rings hovering above platform (metaphor for equality) -->
  <ellipse cx="120" cy="155" rx="35" ry="10" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8" />
  <ellipse cx="120" cy="155" rx="20" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
  <circle cx="120" cy="155" r="4" fill="#fbbf24" />

  <!-- Character 1 (Left - Reaching upward with determination) -->
  <g transform="translate(60, 115)">
    <!-- Shadow -->
    <ellipse cx="15" cy="85" rx="12" ry="4" fill="#000000" opacity="0.4" />
    <!-- Body / Torso (leaning forward) -->
    <path d="M10,40 Q25,35 22,65 L18,85 L8,85 L12,50 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="15" cy="22" r="10" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M5,20 Q12,10 23,20 L22,25 Q12,15 8,25 Z" fill="#0f172a" />
    <!-- Legs -->
    <path d="M12,83 L8,115 L14,115 L18,85 Z" fill="#1e293b" />
    <path d="M18,83 L25,112 L30,110 L22,83 Z" fill="#334155" />
    <!-- Back Arm -->
    <path d="M15,42 L5,55 L2,52 L13,38 Z" fill="#0284c7" />
    <!-- Front Arm Reaching Up -->
    <path d="M20,40 Q35,25 45,18 L48,22 Q38,30 24,48 Z" fill="#38bdf8" />
    <!-- Hand -->
    <circle cx="46" cy="18" r="4" fill="#fbcfe8" />
  </g>

  <!-- Character 2 (Right - Standing firm, arm raised together in solidarity/pursuit) -->
  <g transform="translate(145, 115)">
    <!-- Shadow -->
    <ellipse cx="15" cy="85" rx="12" ry="4" fill="#000000" opacity="0.4" />
    <!-- Body / Torso -->
    <path d="M20,40 Q5,35 8,65 L12,85 L22,85 L18,50 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="15" cy="22" r="10" fill="#fde68a" />
    <!-- Hair -->
    <path d="M7,18 Q15,8 23,18 L20,22 Q15,14 10,22 Z" fill="#334155" />
    <!-- Legs -->
    <path d="M18,83 L22,115 L16,115 L12,85 Z" fill="#0f172a" />
    <path d="M12,83 L5,112 L0,110 L8,83 Z" fill="#1e293b" />
    <!-- Back Arm -->
    <path d="M15,42 L25,55 L28,52 L17,38 Z" fill="#059669" />
    <!-- Front Arm Reaching Up -->
    <path d="M10,40 Q-5,25 -15,18 L-18,22 Q-8,30 6,48 Z" fill="#10b981" />
    <!-- Hand -->
    <circle cx="-16" cy="18" r="4" fill="#fde68a" />
  </g>

  <!-- Foreground Props for Real-World Context (e.g. plant pots framing the scene) -->
  <g transform="translate(15, 140)">
    <!-- Pot -->
    <path d="M5,40 L15,65 L35,65 L45,40 Z" fill="#475569" />
    <ellipse cx="25" cy="40" rx="20" ry="4" fill="#64748b" />
    <!-- Plant Leaves -->
    <path d="M25,40 Q10,20 5,5 Q20,20 25,40 Z" fill="#10b981" />
    <path d="M25,40 Q30,15 40,0 Q35,20 25,40 Z" fill="#059669" />
    <path d="M25,40 Q20,25 22,10 Q26,25 25,40 Z" fill="#34d399" />
  </g>

  <g transform="translate(185, 135)">
    <!-- Pot -->
    <path d="M5,45 L12,70 L38,70 L45,45 Z" fill="#475569" />
    <ellipse cx="25" cy="45" rx="20" ry="4" fill="#64748b" />
    <!-- Plant Leaves (Tall Sanssevieria / Modern office plant) -->
    <path d="M20,45 Q15,15 10,-5 Q18,15 22,45 Z" fill="#34d399" />
    <path d="M28,45 Q35,20 42,2 Q36,22 30,45 Z" fill="#10b981" />
    <path d="M25,45 Q25,10 25,-10 Q27,10 26,45 Z" fill="#059669" />
  </g>

  <!-- Dynamic floating light motes representing aspiration and progress -->
  <circle cx="95" cy="95" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="145" cy="85" r="3" fill="#38bdf8" opacity="0.7" />
  <circle cx="110" cy="65" r="1.5" fill="#fbcfe8" opacity="0.9" />
  <circle cx="130" cy="110" r="2" fill="#34d399" opacity="0.8" />
</svg>