<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="deskGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#deskGlow)" />

  <!-- ENVIRONMENT / PROPS -->
  <!-- Wooden Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 220 C 240 231 231 240 220 240 L 20 240 C 9 240 0 231 0 220 Z" fill="#334155" />
  <path d="M 0 170 L 240 170 L 240 176 L 0 176 Z" fill="#475569" />

  <!-- Background Wall Shelf & Accessories -->
  <rect x="30" y="50" width="90" height="8" rx="4" fill="#475569" />
  <!-- Messy Paint Brushes in a Jar -->
  <path d="M 45 35 L 55 35 L 57 50 L 43 50 Z" fill="#64748b" />
  <path d="M 40 20 L 48 35" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  <path d="M 50 15 L 52 35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <path d="M 60 22 L 54 35" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Tilted/Sloppy Clock (Symbol of carelessness) -->
  <g transform="translate(180, 55) rotate(18)">
    <circle cx="0" cy="0" r="18" fill="#cbd5e1" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="15" fill="#f8fafc" />
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="7" y2="3" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <!-- Crooked nail holding it -->
    <circle cx="0" cy="-18" r="3" fill="#94a3b8" />
  </g>

  <!-- MAIN SUBJECT: The Sloppy/Careless Work Scene -->
  <!-- Architectural/Painting Blueprint (Carelessly drawn, messy) -->
  <g transform="translate(45, 80) rotate(-6)" filter="url(#shadow)">
    <!-- Paper Sheet -->
    <polygon points="0,0 120,15 110,105 -5,95" fill="#fef08a" />
    
    <!-- Messy, sloppy drawing lines (Representing 'mǎhu' - qua loa, cẩu thả) -->
    <!-- A crooked, badly drawn house -->
    <path d="M 20 70 L 50 40 L 85 65" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="30" y="65" width="25" height="30" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2" />
    <path d="M 65 50 L 75 50 L 75 60" stroke="#3b82f6" stroke-width="2" fill="none" /> <!-- Bad alignment -->
    
    <!-- Big red careless scribble / correction mark (sloppy check/cross) -->
    <path d="M 70 25 L 95 50 M 95 25 L 70 50" stroke="#dc2626" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    
    <!-- Coffee Spill on Paper (Ultimate sign of carelessness) -->
    <path d="M 95 75 C 90 70, 100 65, 105 72 C 110 80, 98 85, 95 75 Z" fill="#78350f" opacity="0.8" />
    <circle cx="88" cy="82" r="2" fill="#78350f" opacity="0.7" />
    <circle cx="102" cy="65" r="1.5" fill="#78350f" opacity="0.6" />
  </g>

  <!-- Overturned Coffee Mug (Causing the mess) -->
  <g transform="translate(145, 130)" filter="url(#shadow)">
    <!-- Mug Body (Tilted over) -->
    <rect x="0" y="0" width="30" height="26" rx="4" fill="#38bdf8" transform="rotate(-35 15 13)" />
    <!-- Mug Handle -->
    <path d="M 18 -6 C 28 -8, 28 6, 18 4" stroke="#0284c7" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Spilling Coffee Stream -->
    <path d="M -5 15 C -15 20, -25 35, -40 40" stroke="#78350f" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Foreground Props: Rushed/Random Items -->
  <!-- Dropped/Rushed Pencil -->
  <g transform="translate(110, 175) rotate(42)" filter="url(#shadow)">
    <polygon points="0,0 35,-3 35,3" fill="#facc15" />
    <polygon points="35,-3 42,0 35,3" fill="#fca5a5" />
    <polygon points="0,0 5,-2 5,2" fill="#475569" />
  </g>

  <!-- Crumpled Paper Balls (Discarded sloppy work) -->
  <g transform="translate(170, 155)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="12" fill="#e2e8f0" />
    <path d="M -6 -4 C -2 -8, 6 -4, 4 4 C 2 8, -6 6, -6 -4 Z" fill="#cbd5e1" />
    <path d="M -3 3 C 2 5, 5 -2, 2 -6" stroke="#94a3b8" stroke-width="1.5" fill="none" />
  </g>
  <g transform="translate(30, 160) scale(0.7)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="12" fill="#cbd5e1" />
    <path d="M -5 -5 C 0 -9, 7 -3, 3 5 C -1 7, -7 4, -5 -5 Z" fill="#94a3b8" />
  </g>

  <!-- Action/Emotion Elements: Sweat drops floating (frustration/rushed vibe) -->
  <path d="M 125 65 C 125 65, 122 70, 122 73 C 122 75, 123.5 76, 125 76 C 126.5 76, 128 75, 128 73 C 128 70, 125 65, 125 65 Z" fill="#38bdf8" opacity="0.7" />
  <path d="M 135 75 C 135 75, 133 78, 133 80 C 133 81.5, 134 82.5, 135 82.5 C 136 82.5, 137 81.5, 137 80 C 137 78, 135 75, 135 75 Z" fill="#38bdf8" opacity="0.6" />

  <!-- Highlight overlay for glossy finish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
</svg>