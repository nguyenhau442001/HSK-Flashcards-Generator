<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for "Biased/Illuminated" side -->
    <radialGradient id="amber-glow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool Blue Shadow for "Hidden/Ignored" side -->
    <radialGradient id="blue-shadow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Objects -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Spotlight Beam Gradient -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Glows -->
  <circle cx="160" cy="120" r="90" fill="url(#amber-glow)"/>
  <circle cx="80" cy="120" r="90" fill="url(#blue-shadow)"/>

  <!-- Floor/Desk Surface -->
  <path d="M 20,185 L 220,185 L 230,220 L 10,220 Z" fill="#090d16" opacity="0.8"/>
  <line x1="20" y1="185" x2="220" y2="185" stroke="#334155" stroke-width="2"/>

  <!-- SCENE: Art Exhibition / Museum Gallery context representing "One-sided / Biased View" -->
  <!-- Background Gallery Wall & Frame -->
  <g filter="url(#shadow)">
    <!-- The Monolith Artwork / Sculpture on Display -->
    <!-- Base Pedestal -->
    <path d="M 85,185 L 155,185 L 145,165 L 95,165 Z" fill="#475569"/>
    <path d="M 95,165 L 145,165 L 145,160 L 95,160 Z" fill="#64748b"/>

    <!-- Central Rotating Pillar / Sculpture -->
    <!-- Left Side: Dark, Shadowy, Ignored (The unseen side) -->
    <path d="M 105,70 L 120,70 L 120,160 L 105,160 Z" fill="#1e293b"/>
    <path d="M 90,80 L 105,70 L 105,160 L 90,150 Z" fill="#334155"/>

    <!-- Right Side: Brightly lit, Oversaturated, Hyper-focused (The one-sided view) -->
    <path d="M 120,70 L 135,70 L 135,160 L 120,160 Z" fill="#f59e0b"/>
    <path d="M 135,70 L 150,80 L 150,150 L 135,160 Z" fill="#fbbf24"/>
    
    <!-- Top Cap of Sculpture -->
    <polygon points="120,55 90,80 105,70 135,70 150,80" fill="#cbd5e1"/>
    <polygon points="120,55 135,70 150,80 120,70" fill="#fcd34d"/>
  </g>

  <!-- Dramatic Spotlight from Top Right shining ONLY on the right side -->
  <polygon points="180,10 135,70 160,70" fill="url(#spotlight)"/>
  <circle cx="180" cy="10" r="8" fill="#fbbf24" filter="url(#shadow)"/>
  <path d="M 175,15 L 205,45 L 200,50 L 170,20 Z" fill="#475569" opacity="0.5"/> <!-- Spotlight arm -->

  <!-- Foreground Observer / Critic character leaning in, showing biased focus -->
  <g filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M 175,220 C 175,195 195,180 215,185 L 235,220 Z" fill="#0284c7"/>
    
    <!-- Head -->
    <circle cx="195" cy="155" r="18" fill="#f8fafc"/>
    <!-- Hair -->
    <path d="M 177,152 C 178,140 190,135 205,142 C 210,145 213,150 213,155 L 213,158 C 205,153 185,155 177,152 Z" fill="#334155"/>
    
    <!-- Hand pointing eagerly at the illuminated side -->
    <path d="M 180,175 C 160,170 145,155 138,150 L 142,145 C 150,150 165,162 182,168 Z" fill="#f8fafc"/>
    
    <!-- Magnifying glass emphasizing hyper-focus on one small section -->
    <g transform="translate(130, 135)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.9"/>
      <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.2"/>
      <!-- Magnifier Handle -->
      <line x1="11" y1="11" x2="24" y2="24" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <line x1="11" y1="11" x2="24" y2="24" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Environmental props: Unseen details in the dark left zone (symbolizing ignored facts) -->
  <g opacity="0.4">
    <!-- A small framed picture hanging in shadow, barely visible -->
    <rect x="35" y="90" width="25" height="35" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="40" y1="100" x2="55" y2="100" stroke="#94a3b8" stroke-width="1"/>
    <line x1="40" y1="107" x2="50" y2="107" stroke="#94a3b8" stroke-width="1"/>
    <!-- Question mark subtle hint in shadow -->
    <path d="M 43,140 C 43,130 55,130 50,142 C 47,150 45,152 45,157" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="45" cy="165" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Glowing accent markers to emphasize the stark contrast (One-sided balance beam effect floating) -->
  <g transform="translate(120, 35)" filter="url(#shadow)">
    <!-- Balance beam (tilted completely to one side) -->
    <line x1="-40" y1="15" x2="40" y2="-15" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <!-- Fulcrum -->
    <polygon points="0,20 -6,28 6,28" fill="#64748b"/>
    <!-- Heavy biased side (down) -->
    <circle cx="-35" cy="13" r="10" fill="#f59e0b"/>
    <!-- Light neglected side (up) -->
    <circle cx="35" cy="-13" r="6" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Sparkles / Focus effects on the bright side -->
  <path d="M 155,95 L 158,102 L 165,105 L 158,108 L 155,115 L 152,108 L 145,105 L 152,102 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M 130,50 L 132,54 L 136,56 L 132,58 L 130,62 L 128,58 L 124,56 L 128,54 Z" fill="#fbbf24" opacity="0.9"/>
</svg>