<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Streetlamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Motion Blur Streak Gradient -->
    <linearGradient id="motion-streak" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements (City Environment) -->
  <!-- Distant Buildings / Silhouette -->
  <path d="M0 160 L30 140 L50 140 L80 170 L110 130 L140 150 L170 120 L200 140 L240 110 L240 240 L0 240 Z" fill="#1e293b" opacity="0.6" />
  <path d="M20 180 L60 150 L90 190 L130 160 L180 180 L220 150 L240 170 L240 240 L0 240 Z" fill="#0f172a" opacity="0.8" />

  <!-- Streetlamp Post & Light Cone -->
  <path d="M190 20 L195 20 L195 180 L190 180 Z" fill="#475569" />
  <circle cx="192" cy="20" r="12" fill="#f59e0b" />
  <circle cx="192" cy="20" r="40" fill="url(#lamp-glow)" />
  <polygon points="192,20 120,240 220,240" fill="#fbbf24" opacity="0.08" />

  <!-- Ground / Pavement -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Speed / Motion Lines (Indicating 'Cōngmáng' / Rush) -->
  <rect x="20" y="95" width="90" height="4" rx="2" fill="url(#motion-streak)" />
  <rect x="40" y="110" width="110" height="6" rx="3" fill="url(#motion-streak)" />
  <rect x="10" y="130" width="80" height="3" rx="1.5" fill="url(#motion-streak)" />
  <rect x="55" y="80" width="60" height="3" rx="1.5" fill="url(#motion-streak)" />

  <!-- Flying / Dropped Props (Signifying Hurriedness) -->
  <!-- Flying Papers / Documents -->
  <path d="M 85 85 L 105 80 L 110 95 L 90 100 Z" fill="#f8fafc" opacity="0.9" transform="rotate(-15 95 90)" />
  <path d="M 120 70 L 135 75 L 130 90 L 115 85 Z" fill="#cbd5e1" opacity="0.8" transform="rotate(30 125 80)" />
  <!-- Dropped Coffee Cup in mid-air -->
  <g transform="translate(145, 95) rotate(-25)">
    <path d="M0 0 L14 0 L12 22 L2 22 Z" fill="#ec4899" />
    <ellipse cx="7" cy="0" rx="7" ry="2" fill="#f472b6" />
    <!-- Splash drops -->
    <circle cx="-8" cy="-5" r="2" fill="#38bdf8" />
    <circle cx="-14" cy="2" r="3" fill="#38bdf8" />
    <path d="M -4 -8 Q -10 -15 -6 -20" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER (Action-packed, leaning forward rapidly) -->
  <g transform="translate(85, 90)">
    <!-- Back Leg (Stretching / Running) -->
    <path d="M 15 70 Q -5 90 -25 85" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Back Shoe -->
    <ellipse cx="-27" cy="86" rx="8" ry="5" fill="#f59e0b" transform="rotate(-10 -27 86)" />

    <!-- Briefcase / Bag trailing behind -->
    <g transform="translate(-15, 55) rotate(-35)">
      <rect x="-16" y="-12" width="24" height="18" rx="4" fill="#d97706" />
      <path d="M -6 -12 L -6 -16 C -6 -18 2 -18 2 -16 L 2 -12" stroke="#b45309" stroke-width="2.5" fill="none" />
      <line x1="-16" y1="-2" x2="8" y2="-2" stroke="#b45309" stroke-width="2" />
    </g>
    <!-- Motion lines for briefcase -->
    <path d="M -25 45 L -40 40" stroke="#fb923c" stroke-width="2" stroke-linecap="round" />

    <!-- Body / Torso (Leaning heavily forward for dynamic momentum) -->
    <path d="M 20 60 C 5 50 -5 20 -15 0 C -20 -10 -5 -15 2 5 C 10 25 25 45 25 45 Z" fill="#3b82f6" />

    <!-- Backpack / Straps -->
    <path d="M -10 -2 C -15 10 -5 25 -5 25" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Front Leg (Pounding the pavement) -->
    <path d="M 25 45 Q 45 70 55 90" stroke="#1e293b" stroke-width="13" stroke-linecap="round" fill="none" />
    <!-- Front Shoe -->
    <ellipse cx="58" cy="94" rx="10" ry="6" fill="#f59e0b" transform="rotate(20 58 94)" />

    <!-- Head & Hair (Wind-swept backward) -->
    <!-- Head position -->
    <circle cx="-18" cy="-12" r="14" fill="#fbcfe8" />
    <!-- Hair blowing back -->
    <path d="M -30 -22 C -20 -28 -5 -25 0 -15 C -10 -15 -20 -10 -30 -22 Z" fill="#1e293b" />
    <!-- Scarf / Tie blowing wildly in the wind -->
    <path d="M -10 -2 C 0 -5 15 -10 30 -5 C 20 2 10 5 -5 2" fill="#ef4444" />

    <!-- Back Arm (Swinging backward) -->
    <path d="M -5 10 L -25 35" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <circle cx="-27" cy="38" r="5" fill="#fbcfe8" />

    <!-- Front Arm (Reaching forward urgently) -->
    <path d="M -5 5 L 20 -5 L 35 5" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="37" cy="7" r="5" fill="#fbcfe8" />
  </g>

  <!-- Speed lines around the runner's feet -->
  <path d="M 120 195 L 150 195" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <path d="M 50 185 L 80 185" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Foreground Atmospheric Dust / Sparkles for Energy -->
  <circle cx="50" cy="150" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="110" cy="170" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="170" cy="130" r="1" fill="#fbbf24" opacity="0.9" />
  <circle cx="30" cy="70" r="2" fill="#ec4899" opacity="0.6" />
</svg>