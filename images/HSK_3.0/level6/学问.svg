<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Light Gradient -->
    <radialGradient id="studyLight" cx="65%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk Lamp Cone Gradient -->
    <linearGradient id="lampCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Character Skin Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Glow Filter for Knowledge Aura -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric lighting -->
  <rect width="240" height="240" rx="24" fill="url(#studyLight)"/>

  <!-- Background Environment: Bookshelves & Architecture -->
  <g id="environment">
    <!-- Back wall architectural panels -->
    <rect x="20" y="30" width="200" height="150" fill="#172033" rx="4"/>
    
    <!-- Large Bookshelf Structure -->
    <rect x="135" y="45" width="75" height="135" fill="#111827" rx="2"/>
    <!-- Shelf Dividers -->
    <line x1="135" y1="75" x2="210" y2="75" stroke="#1f2937" stroke-width="2"/>
    <line x1="135" y1="110" x2="210" y2="110" stroke="#1f2937" stroke-width="2"/>
    <line x1="135" y1="145" x2="210" y2="145" stroke="#1f2937" stroke-width="2"/>

    <!-- Colorful Books on Shelf -->
    <!-- Top Shelf -->
    <rect x="142" y="55" width="8" height="20" fill="#38bdf8" rx="1"/>
    <rect x="151" y="52" width="10" height="23" fill="#ec4899" rx="1"/>
    <rect x="163" y="58" width="6" height="17" fill="#10b981" rx="1"/>
    <rect x="171" y="50" width="12" height="25" fill="#fb923c" rx="1"/>
    <rect x="185" y="56" width="7" height="19" fill="#a78bfa" rx="1"/>
    
    <!-- Second Shelf -->
    <rect x="142" y="85" width="14" height="25" fill="#f43f5e" rx="1"/>
    <rect x="158" y="88" width="8" height="22" fill="#38bdf8" rx="1"/>
    <rect x="180" y="82" width="10" height="28" fill="#fbbf24" rx="1"/>
    <rect x="192" y="90" width="12" height="20" fill="#34d399" rx="1"/>

    <!-- Third Shelf (Tilted Books) -->
    <rect x="142" y="122" width="10" height="23" fill="#a78bfa" rx="1"/>
    <rect x="154" y="120" width="9" height="25" fill="#f97316" rx="1"/>
    <g transform="translate(175, 145) rotate(15)">
      <rect x="-10" y="-20" width="8" height="20" fill="#06b6d4" rx="1"/>
    </g>
    <g transform="translate(185, 145) rotate(25)">
      <rect x="-10" y="-22" width="9" height="22" fill="#ec4899" rx="1"/>
    </g>

    <!-- Large Traditional Globe on Pedestal (Symbol of extensive knowledge/learning) -->
    <circle cx="105" cy="95" r="18" fill="#0284c7" opacity="0.8"/>
    <!-- Globe continents abstract styling -->
    <path d="M 95 88 Q 100 82 108 86 T 115 98 Q 105 105 98 96 Z" fill="#10b981" opacity="0.7"/>
    <path d="M 98 103 Q 105 108 112 102 Z" fill="#10b981" opacity="0.7"/>
    <!-- Globe Ring and Stand -->
    <ellipse cx="105" cy="95" rx="19" ry="19" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 105 74 L 105 76 M 105 114 L 105 118 M 98 118 L 112 118" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Large Window showing soft night cityscape -->
    <rect x="25" y="45" width="55" height="90" fill="#0b0f19" rx="2" stroke="#334155" stroke-width="2"/>
    <!-- Window pane grid -->
    <line x1="52" y1="45" x2="52" y2="135" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="90" x2="80" y2="90" stroke="#334155" stroke-width="2"/>
    <!-- City lights outside -->
    <rect x="32" y="105" width="5" height="20" fill="#fbbf24" opacity="0.6"/>
    <rect x="40" y="100" width="4" height="25" fill="#38bdf8" opacity="0.5"/>
    <rect x="60" y="98" width="6" height="27" fill="#fbbf24" opacity="0.4"/>
    <rect x="68" y="110" width="4" height="15" fill="#f43f5e" opacity="0.6"/>
  </g>

  <!-- Ambient Study Light Cone from Desk Lamp -->
  <polygon points="175,90 100,210 230,210" fill="url(#lampCone)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Foreground / Midground: Desk & Scholar (The "Xue Wen" - Learned Man context) -->
  <g id="scholar_and_desk" filter="url(#softShadow)">
    
    <!-- Wooden Desk Surface -->
    <rect x="15" y="180" width="210" height="12" fill="#334155" rx="3"/>
    <rect x="25" y="192" width="190" height="35" fill="#1e293b"/>
    <!-- Desk Front Edge Highlight -->
    <rect x="15" y="180" width="210" height="3" fill="#475569" rx="1"/>

    <!-- Desk Props: Stack of thick ancient/scholarly books & scrolls -->
    <!-- Book stack 1 -->
    <rect x="35" y="170" width="35" height="10" fill="#8b5cf6" rx="1"/>
    <path d="M 35 173 L 70 173 L 68 175 L 33 175 Z" fill="#6d28d9"/>
    
    <rect x="32" y="161" width="40" height="10" fill="#3b82f6" rx="1"/>
    <path d="M 32 164 L 72 164 L 70 166 L 30 166 Z" fill="#1d4ed8"/>

    <rect x="37" y="152" width="32" height="10" fill="#10b981" rx="1"/>
    
    <!-- Open scholarly scroll -->
    <path d="M 80 177 C 82 173 88 171 95 173 C 102 175 108 173 112 177 L 110 181 C 106 177 100 179 93 177 C 86 175 82 177 80 181 Z" fill="#fef3c7"/>

    <!-- Desk Lamp Body (Modern sleek arched lamp) -->
    <path d="M 185,180 C 185,140 175,100 160,90" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <!-- Lamp Shade -->
    <path d="M 148,82 L 172,82 L 165,95 L 155,95 Z" fill="#cbd5e1"/>
    <!-- Lamp Bulb Glow -->
    <circle cx="160" cy="94" r="5" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Scholar Character: Wise, approachable, confident posture -->
    <!-- Torso / Shirt & Vest / Jacket -->
    <!-- Shirt inner collar -->
    <path d="M 115,135 L 125,145 L 135,135" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Cardigan / Vest (Smart casual intellectual look) -->
    <path d="M 100,210 L 100,165 C 100,150 110,140 125,140 C 140,140 150,150 150,165 L 150,210 Z" fill="#3b82f6"/>
    <!-- Inner sweater/shirt -->
    <path d="M 115,145 L 125,155 L 135,145 L 135,210 L 115,210 Z" fill="#f8fafc"/>
    <!-- Vest V-Neck Cut -->
    <path d="M 115,145 L 125,165 L 135,145" fill="#3b82f6"/>
    
    <!-- Neck -->
    <rect x="117" y="130" width="16" height="15" fill="#fbcfe8" rx="4"/>

    <!-- Head & Face -->
    <!-- Head Base -->
    <circle cx="125" cy="115" r="22" fill="#fbcfe8"/>

    <!-- Stylish Modern Hair (Dark neat hair with professional sweep) -->
    <path d="M 103,115 C 103,100 112,93 125,93 C 138,93 147,100 147,118 C 147,118 145,103 135,97 C 125,91 112,96 106,105 Z" fill="#1e293b"/>
    <path d="M 105,112 C 108,102 118,97 127,97 C 132,97 139,100 144,106 C 138,100 130,99 122,100 C 114,101 108,105 105,112 Z" fill="#334155"/>

    <!-- Friendly, Intelligent Facial Expression -->
    <!-- Eyebrows (Expressive, thoughtful arch) -->
    <path d="M 112,108 Q 117,105 122,108" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 128,108 Q 133,105 138,108" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Smart Round Glasses (Classic intellectual trope) -->
    <circle cx="117" cy="116" r="7" fill="none" stroke="#d97706" stroke-width="2"/>
    <circle cx="133" cy="116" r="7" fill="none" stroke="#d97706" stroke-width="2"/>
    <line x1="124" y1="116" x2="126" y2="116" stroke="#d97706" stroke-width="2"/>

    <!-- Eyes (Friendly knowing wink/smile or bright focus) -->
    <circle cx="117" cy="116" r="2" fill="#1e293b"/>
    <circle cx="133" cy="116" r="2" fill="#1e293b"/>

    <!-- Gentle Confident Smile -->
    <path d="M 120,125 Q 125,129 130,125" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="112" cy="122" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="138" cy="122" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Expressive Hands & Gestures (Explaining/Presenting Knowledge) -->
    <!-- Right Arm / Hand gesturing upwards with wisdom/explanation -->
    <path d="M 150,165 C 165,160 172,145 168,135" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="166" cy="130" r="6" fill="#fbcfe8"/>
    <!-- Pointing Index Finger indicating insightful concept -->
    <path d="M 169,124 L 176,118" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Arm resting casually on desk -->
    <path d="M 100,170 C 85,175 80,185 75,190" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
    <circle cx="72" cy="192" r="6" fill="#fbcfe8"/>

  </g>

  <!-- Floating Sparkles / Knowledge Auras (Subtle magical touch for high intellect/expertise) -->
  <g id="knowledge_sparks" filter="url(#glow)">
    <!-- Spark 1 -->
    <path d="M 185,100 L 187,108 L 195,110 L 187,112 L 185,120 L 183,112 L 175,110 L 183,108 Z" fill="#fbbf24" transform="scale(0.6) translate(140, 30)"/>
    <!-- Spark 2 -->
    <path d="M 185,100 L 187,108 L 195,110 L 187,112 L 185,120 L 183,112 L 175,110 L 183,108 Z" fill="#38bdf8" transform="scale(0.4) translate(220, 150)"/>
    <!-- Spark 3 -->
    <path d="M 185,100 L 187,108 L 195,110 L 187,112 L 185,120 L 183,112 L 175,110 L 183,108 Z" fill="#10b981" transform="scale(0.5) translate(90, 80)"/>
  </g>
</svg>