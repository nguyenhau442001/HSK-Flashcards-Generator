<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wooden Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#332211" />
      <stop offset="100%" stop-color="#1c120a" />
    </linearGradient>

    <!-- Bone Gradient (Cream/Ivory) -->
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="70%" stop-color="#f3ede2" />
      <stop offset="100%" stop-color="#e2d8c5" />
    </linearGradient>

    <!-- Golden Glow for Action -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Bowl Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light/Glow centered around the subject -->
  <circle cx="120" cy="140" r="80" fill="url(#glowGrad)" />

  <!-- Wooden Floor / Surface -->
  <path d="M 0,165 L 240,165 L 240,240 L 0,240 Z" fill="url(#floorGrad)" />
  <!-- Floor Plank Lines -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#26180d" stroke-width="2" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#26180d" stroke-width="2" />
  <line x1="90" y1="165" x2="60" y2="240" stroke="#26180d" stroke-width="1.5" />
  <line x1="180" y1="165" x2="210" y2="240" stroke="#26180d" stroke-width="1.5" />

  <!-- Dog Bowl in Background -->
  <g transform="translate(120, 160)">
    <!-- Bowl Shadow -->
    <ellipse cx="0" cy="12" rx="42" ry="8" fill="#090d16" opacity="0.6" />
    <!-- Bowl Outer Rim -->
    <ellipse cx="0" cy="0" rx="45" ry="14" fill="#0369a1" />
    <!-- Bowl Body -->
    <path d="M -45,0 C -45,22 -25,28 0,28 C 25,28 45,22 45,0 Z" fill="url(#bowlGrad)" />
    <!-- Bowl Inner Rim -->
    <ellipse cx="0" cy="-2" rx="38" ry="10" fill="#0ea5e9" />
    <!-- Bowl Inside Depth -->
    <ellipse cx="0" cy="1" rx="35" ry="8" fill="#0284c7" />
  </g>

  <!-- Sparkles / Action Elements -->
  <g fill="#fbbf24">
    <path d="M 65,95 Q 70,95 70,90 Q 70,95 75,95 Q 70,95 70,100 Q 70,95 65,95 Z" />
    <path d="M 175,85 Q 179,85 179,81 Q 179,85 183,85 Q 179,85 179,89 Q 179,85 175,85 Z" />
    <circle cx="150" cy="70" r="2.5" opacity="0.8" />
    <circle cx="85" cy="110" r="2" opacity="0.8" />
  </g>

  <!-- MAIN SUBJECT: The Bone (gǔtou) -->
  <g transform="rotate(-15, 120, 130)">
    <!-- Drop Shadow on Floor -->
    <g transform="translate(0, 18)">
      <path d="M 55,125 C 80,115 160,115 185,125 C 200,131 200,147 185,153 C 160,163 80,163 55,153 C 40,147 40,131 55,125 Z" fill="#000000" opacity="0.4" filter="blur(4px)" />
    </g>

    <!-- Back Knuckles (Depth shading) -->
    <circle cx="58" cy="120" r="15" fill="#d1c5b0" />
    <circle cx="53" cy="140" r="15" fill="#d1c5b0" />
    <circle cx="182" cy="120" r="15" fill="#d1c5b0" />
    <circle cx="187" cy="140" r="15" fill="#d1c5b0" />

    <!-- Main Bone Body & Knuckles (Vector Illustration) -->
    <path d="M 58,105 
             C 75,105 85,112 120,112 
             C 155,112 165,105 182,105 
             C 202,105 202,155 182,155 
             C 165,155 155,148 120,148 
             C 85,148 75,155 58,155 
             C 38,155 38,105 58,105 Z" 
          fill="url(#boneGrad)" 
          stroke="#c9bcac" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Left Knuckles Detailed Outlines -->
    <circle cx="55" cy="118" r="13" fill="url(#boneGrad)" stroke="#c9bcac" stroke-width="2.5" />
    <circle cx="55" cy="142" r="13" fill="url(#boneGrad)" stroke="#c9bcac" stroke-width="2.5" />
    <!-- Center cutout for left knuckle indentation -->
    <path d="M 50,123 Q 65,130 50,137 Z" fill="#e2d8c5" opacity="0.7" />

    <!-- Right Knuckles Detailed Outlines -->
    <circle cx="185" cy="118" r="13" fill="url(#boneGrad)" stroke="#c9bcac" stroke-width="2.5" />
    <circle cx="185" cy="142" r="13" fill="url(#boneGrad)" stroke="#c9bcac" stroke-width="2.5" />
    <!-- Center cutout for right knuckle indentation -->
    <path d="M 190,123 Q 175,130 190,137 Z" fill="#e2d8c5" opacity="0.7" />

    <!-- Bone Highlights & Texture for 2D illustration pop -->
    <!-- Top curved highlight -->
    <path d="M 75,115 C 100,113 140,113 165,115" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8" />
    
    <!-- Bottom soft shadow line -->
    <path d="M 75,145 C 100,147 140,147 165,145" stroke="#d4c9b6" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="45" cy="80" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="195" cy="110" r="2" fill="#38bdf8" opacity="0.5" />
  <circle cx="110" cy="55" r="1.5" fill="#fbbf24" opacity="0.7" />
</svg>