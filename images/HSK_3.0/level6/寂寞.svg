<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background gradient for the overall canvas -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Interior Room Wall (slightly lighter than deepest background, to create depth) -->
  <rect x="0" y="0" width="240" height="240" fill="#1e293b"/>

  <!-- Night Sky (visible through the window) -->
  <rect x="40" y="40" width="160" height="160" fill="#0f172a"/> <!-- Darkest blue for deep night sky -->

  <!-- Distant city lights / hills (outside the window) -->
  <path d="M40 160 C70 140, 170 140, 200 160 L200 200 L40 200 Z" fill="#17253b"/> <!-- Slightly lighter dark blue for distant land -->
  <circle cx="170" cy="60" r="8" fill="#fbbf24"/> <!-- Moon -->
  <circle cx="150" cy="75" r="2" fill="#fbbf24"/> <!-- Star -->
  <circle cx="180" cy="90" r="1.5" fill="#fbbf24"/> <!-- Star -->
  <circle cx="160" cy="105" r="1" fill="#fbbf24"/> <!-- Star -->

  <!-- Window Frame -->
  <rect x="30" y="30" width="180" height="180" fill="#2d3a4b" rx="8"/> <!-- Outer frame -->
  <rect x="35" y="35" width="170" height="170" fill="#1e293b" rx="6"/> <!-- Inner frame edge, same as room wall for seamless look -->
  <!-- The actual window opening is defined by the night sky rect (x=40, y=40, w=160, h=160) -->

  <!-- Window sill (part of the interior, slightly lighter than the wall) -->
  <rect x="30" y="190" width="180" height="20" fill="#3a475b" rx="4"/>

  <!-- Person sitting on the window sill -->
  <!-- Body (simplified, hunched over, facing away/out) -->
  <path d="M100 190 C90 160, 120 150, 130 155 C140 160, 150 170, 140 190 Z" fill="#4a5568"/>
  <!-- Head -->
  <circle cx="115" cy="145" r="12" fill="#6b7280"/>
  <!-- Arm (holding mug) -->
  <path d="M105 160 C100 155, 95 165, 98 175 C101 185, 110 180, 105 160 Z" fill="#4a5568"/>
  <!-- Hand -->
  <circle cx="95" cy="175" r="5" fill="#6b7280"/>
  <!-- Mug -->
  <path d="M95 170 A5 5 0 0 1 100 175 L100 180 A5 5 0 0 1 95 185 Z" fill="#3a475b"/>

  <!-- Subtle warm glow from the mug/person (representing introspection/solitude) -->
  <circle cx="95" cy="175" r="18" fill="#fbbf24" opacity="0.1"/>
  <circle cx="115" cy="145" r="25" fill="#fbbf24" opacity="0.05"/>

  <!-- Interior elements for context -->
  <!-- Plant on the sill -->
  <rect x="50" y="175" width="15" height="15" fill="#3a475b" rx="3"/> <!-- Pot -->
  <path d="M57 175 C55 165, 65 160, 70 165 C75 170, 65 175, 57 175 Z" fill="#10b981"/> <!-- Leaf 1 -->
  <path d="M55 175 C53 168, 60 163, 65 168 C70 173, 63 175, 55 175 Z" fill="#10b981"/> <!-- Leaf 2 -->

</svg>