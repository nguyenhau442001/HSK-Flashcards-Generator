<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bedding/Pillow -->
  <path d="M40 180 Q120 160 200 180 L210 220 L30 220 Z" fill="#334155"/>
  <path d="M60 190 Q120 170 180 190 L175 210 L65 210 Z" fill="#475569"/>
  
  <!-- Face -->
  <circle cx="120" cy="120" r="60" fill="#fde68a"/>
  
  <!-- Eyes - The Act of Opening -->
  <g id="eyes">
    <!-- Left Eye -->
    <path d="M90 110 Q105 95 120 110 Q105 125 90 110 Z" fill="#0f172a"/>
    <circle cx="105" cy="110" r="8" fill="#fff"/>
    <circle cx="107" cy="110" r="3" fill="#0f172a"/>
    
    <!-- Right Eye -->
    <path d="M150 110 Q165 95 180 110 Q165 125 150 110 Z" fill="#0f172a"/>
    <circle cx="165" cy="110" r="8" fill="#fff"/>
    <circle cx="167" cy="110" r="3" fill="#0f172a"/>
  </g>
  
  <!-- Mouth (Surprised/Awake) -->
  <path d="M110 150 Q120 160 130 150" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Morning Sun/Light Rays -->
  <path d="M20 20 L35 35" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <path d="M220 20 L205 35" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="20" cy="20" r="8" fill="#f59e0b"/>
  <circle cx="220" cy="20" r="8" fill="#f59e0b"/>
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="80" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="70" r="4" fill="#ec4899" opacity="0.6"/>
  <circle cx="120" cy="40" r="2" fill="#10b981" opacity="0.6"/>
</svg>