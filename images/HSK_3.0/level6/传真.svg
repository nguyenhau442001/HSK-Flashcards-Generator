<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Fax Machine Body Gradient -->
    <linearGradient id="faxBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Fax Machine Accent -->
    <linearGradient id="faxAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient Light / Window reflection -->
  <path d="M0 0 L140 0 L0 140 Z" fill="#ffffff" opacity="0.03"/>

  <!-- Background Office Elements -->
  <g opacity="0.4">
    <!-- Plant pot on shelf -->
    <rect x="195" y="45" width="20" height="18" rx="4" fill="#64748b"/>
    <path d="M205 45 C 195 30, 200 20, 215 25 C 220 35, 215 45, 205 45 Z" fill="#10b981"/>
    <path d="M205 45 C 215 30, 210 18, 198 22 C 190 32, 195 45, 205 45 Z" fill="#059669"/>
    <!-- Hanging light wire and lamp -->
    <line x1="60" y1="0" x2="60" y2="25" stroke="#475569" stroke-width="2"/>
    <path d="M45 25 L75 25 L70 35 L50 35 Z" fill="#fbbf24"/>
    <path d="M50 35 L70 35 L60 42 Z" fill="#f59e0b"/>
  </g>

  <!-- Desk Surface -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#desk)" filter="url(#shadow)"/>
  <!-- Desk edge highlight -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#64748b" stroke-width="2" opacity="0.6"/>

  <!-- Background Wall Shelf/Details -->
  <rect x="30" y="80" width="80" height="6" rx="3" fill="#475569" opacity="0.5"/>
  <rect x="40" y="65" width="12" height="15" rx="2" fill="#ec4899" opacity="0.6"/>
  <rect x="55" y="60" width="10" height="20" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="68" y="68" width="14" height="12" rx="2" fill="#fbbf24" opacity="0.6"/>

  <!-- Coffee Mug -->
  <g transform="translate(185, 135)" filter="url(#shadow)">
    <!-- Mug Body -->
    <rect x="0" y="5" width="22" height="28" rx="4" fill="#f1f5f9"/>
    <!-- Mug Handle -->
    <path d="M22 10 C 30 10, 30 25, 22 28" fill="none" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
    <!-- Coffee Surface -->
    <ellipse cx="11" cy="5" rx="11" ry="3" fill="#78350f"/>
    <!-- Steam -->
    <path d="M7 -2 C 9 -6, 5 -10, 7 -14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M15 -4 C 17 -8, 13 -12, 15 -16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- MAIN SUBJECT: Fax Machine (传真) -->
  <g transform="translate(45, 100)" filter="url(#shadow)">
    <!-- Fax Machine Base/Body -->
    <rect x="0" y="20" width="150" height="65" rx="12" fill="url(#faxBody)"/>
    
    <!-- Paper Input Tray (Back) -->
    <path d="M25 20 L40 -15 L120 -15 L135 20 Z" fill="#94a3b8" opacity="0.7"/>
    
    <!-- Incoming/Outgoing Document on Tray -->
    <g transform="translate(45, -22)">
      <!-- Animated Paper Motion -->
      <rect x="0" y="0" width="60" height="70" rx="2" fill="url(#paper)"/>
      <!-- Simulated document lines -->
      <line x1="10" y1="12" x2="35" y2="12" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="24" x2="50" y2="24" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="36" x2="40" y2="36" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="48" x2="45" y2="48" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <!-- Small photo placeholder -->
      <rect x="35" y="10" width="15" height="12" rx="1" fill="#e2e8f0"/>
    </g>

    <!-- Main Control Panel Console -->
    <rect x="15" y="32" width="65" height="42" rx="6" fill="#e2e8f0"/>
    
    <!-- LCD Screen with Glow -->
    <rect x="23" y="40" width="30" height="16" rx="3" fill="#0f172a"/>
    <rect x="25" y="42" width="26" height="12" rx="2" fill="url(#screenGlow)" filter="url(#glow)"/>
    <!-- Waveform / status graph on screen -->
    <path d="M28 48 L32 44 L36 50 L40 46 L46 48" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Keypad Buttons Grid -->
    <g fill="#64748b">
      <rect x="57" y="40" width="6" height="4" rx="1"/>
      <rect x="66" y="40" width="6" height="4" rx="1"/>
      <rect x="75" y="40" width="6" height="4" rx="1"/>
      
      <rect x="57" y="47" width="6" height="4" rx="1"/>
      <rect x="66" y="47" width="6" height="4" rx="1"/>
      <rect x="75" y="47" width="6" height="4" rx="1"/>

      <rect x="57" y="54" width="6" height="4" rx="1"/>
      <rect x="66" y="54" width="6" height="4" rx="1"/>
      <rect x="75" y="54" width="6" height="4" rx="1"/>

      <!-- Action Button (Green/Orange) -->
      <rect x="57" y="62" width="24" height="8" rx="2" fill="#10b981"/>
    </g>

    <!-- Branding Accent Strip -->
    <rect x="15" y="24" width="120" height="4" rx="2" fill="url(#faxAccent)"/>

    <!-- Integrated Telephone Handset -->
    <g transform="translate(95, 30)">
      <!-- Handset Cradle Recess -->
      <rect x="0" y="2" width="40" height="15" rx="4" fill="#cbd5e1"/>
      
      <!-- Handset Rested -->
      <g filter="url(#shadow)">
        <path d="M -5 0 C -5 -6, 5 -10, 20 -10 C 35 -10, 45 -6, 45 0 C 45 6, 35 10, 20 10 C 5 10, -5 6, -5 0 Z" fill="#334155"/>
        <ellipse cx="2" cy="0" rx="4" ry="6" fill="#1e293b"/>
        <ellipse cx="38" cy="0" rx="4" ry="6" fill="#1e293b"/>
        <!-- Curly Cord connecting handset -->
        <path d="M -5 0 C -15 0, -20 15, -10 25 C -5 30, -15 35, -22 45" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Paper Output Slot -->
    <rect x="25" y="72" width="100" height="5" rx="2" fill="#334155"/>
    
    <!-- OUTGOING FAX PAPER (Action / Dynamic Element) -->
    <g transform="translate(30, 75)" filter="url(#shadow)">
      <path d="M 0 0 L 100 0 L 90 70 L 10 70 Z" fill="url(#paper)"/>
      <!-- Document Header Graphic / Graph -->
      <rect x="25" y="10" width="50" height="20" rx="2" fill="#e0f2fe"/>
      <circle cx="35" cy="20" r="5" fill="#38bdf8"/>
      <rect x="45" y="17" width="25" height="4" rx="1" fill="#bae6fd"/>
      <!-- Text lines simulation -->
      <line x1="20" y1="38" x2="80" y2="38" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="50" x2="60" y2="50" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Action Stamp / Checkmark Emblem -->
      <circle cx="70" cy="55" r="12" fill="#10b981"/>
      <path d="M 64 55 L 68 59 L 77 49" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Floating Data/Transmission Energy Particles -->
  <g>
    <circle cx="160" cy="75" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="178" cy="62" r="2.5" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="190" cy="85" r="3" fill="#10b981" filter="url(#glow)"/>
    <path d="M 140 90 Q 155 70, 175 65" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
    <path d="M 145 105 Q 165 95, 185 80" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
  </g>
</svg>