<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Floor -->
  <rect x="16" y="16" width="208" height="150" fill="#1e293b" rx="8"/>
  <!-- Wooden floor base -->
  <path d="M16 166 L224 166 L224 224 L16 224 Z" fill="#0f172a"/>
  <path d="M16 175 L224 175" stroke="#1e293b" stroke-width="2"/>
  <path d="M16 190 L224 190" stroke="#1e293b" stroke-width="2"/>
  <path d="M16 208 L224 208" stroke="#1e293b" stroke-width="2"/>

  <!-- Large Window showing sunny relaxed day -->
  <rect x="28" y="32" width="70" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <rect x="33" y="37" width="60" height="85" fill="url(#windowGlow)"/>
  <!-- Window Panes -->
  <line x1="63" y1="37" x2="63" y2="122" stroke="#334155" stroke-width="2"/>
  <line x1="33" y1="79" x2="93" y2="79" stroke="#334155" stroke-width="2"/>
  <!-- Sun outside window -->
  <circle cx="63" cy="58" r="12" fill="url(#sunGlow)"/>
  <!-- Cute stylized cloud outside -->
  <path d="M75 95 C75 92 78 90 81 92 C83 90 87 91 88 94 C90 94 92 96 91 99 C91 99 75 99 75 95 Z" fill="#94a3b8" opacity="0.6"/>

  <!-- Cozy Bookshelf Background Prop -->
  <g transform="translate(180, 45)">
    <rect x="0" y="0" width="32" height="110" fill="#0f172a" rx="2" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="35" x2="32" y2="35" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="70" x2="32" y2="70" stroke="#334155" stroke-width="2"/>
    <!-- Books -->
    <rect x="4" y="15" width="8" height="20" fill="#ef4444" rx="1"/>
    <rect x="13" y="18" width="6" height="17" fill="#38bdf8" rx="1"/>
    <rect x="5" y="50" width="14" height="20" fill="#10b981" rx="1"/>
    <rect x="21" y="53" width="7" height="17" fill="#f59e0b" rx="1"/>
    <rect x="4" y="85" width="10" height="25" fill="#a855f7" rx="1"/>
  </g>

  <!-- Potted Plant for cozy atmosphere -->
  <g transform="translate(150, 135)">
    <path d="M4 22 L16 22 L13 36 L7 36 Z" fill="#cbd5e1"/>
    <ellipse cx="10" cy="22" rx="6" ry="2" fill="#94a3b8"/>
    <path d="M10 22 Q5 12 2 5" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="2" cy="5" r="4" fill="#34d399"/>
    <path d="M10 22 Q15 10 20 2" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="2" r="5" fill="#34d399"/>
    <path d="M10 22 Q10 8 10 0" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="10" cy="0" r="4" fill="#10b981"/>
  </g>

  <!-- Rug on Floor -->
  <ellipse cx="115" cy="195" rx="55" ry="14" fill="#334155" opacity="0.7"/>
  <ellipse cx="115" cy="195" rx="45" ry="10" fill="#475569" opacity="0.7"/>

  <!-- Coffee Table / Side Table with Teapot & Mug -->
  <g transform="translate(160, 165)" filter="url(#softShadow)">
    <ellipse cx="20" cy="10" rx="22" ry="8" fill="#334155"/>
    <rect x="8" y="10" width="4" height="18" fill="#1e293b"/>
    <rect x="28" y="10" width="4" height="18" fill="#1e293b"/>
    <!-- Teapot -->
    <circle cx="15" cy="2" r="6" fill="#f8fafc"/>
    <path d="M9 2 Q6 2 5 0" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <path d="M21 2 Q24 1 25 4" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Mug -->
    <rect x="26" y="2" width="6" height="8" rx="1" fill="#38bdf8"/>
    <path d="M32 4 C34 4 34 8 32 8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- MAIN CHARACTER: Relaxed Man sitting on a cozy armchair -->
  <g id="relaxed-character" filter="url(#softShadow)">
    <!-- Armchair Back & Sides -->
    <path d="M75 105 C70 95 85 80 100 85 C115 80 130 95 125 105 L130 170 L70 170 Z" fill="#334155" rx="10"/>
    <ellipse cx="100" cy="95" rx="25" ry="12" fill="#475569"/>

    <!-- Character Legs (Leisurely crossed/extended) -->
    <!-- Left Leg -->
    <path d="M95 155 L75 175 L95 180" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Leg crossed over or extended -->
    <path d="M105 155 L125 170 L145 165" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slippers / Feet -->
    <ellipse cx="98" cy="182" rx="6" ry="4" fill="#f59e0b"/>
    <ellipse cx="148" cy="164" rx="6" ry="4" fill="#f59e0b"/>

    <!-- Torso (Wearing a cozy casual hoodie/sweater) -->
    <path d="M80 115 Q100 110 120 115 L125 155 Q100 160 75 155 Z" fill="#6366f1" rx="8"/>
    <path d="M95 118 L100 128 L105 118" fill="none" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Arm (Relaxed, resting on armrest) -->
    <path d="M82 120 Q65 130 70 150" fill="none" stroke="#6366f1" stroke-width="11" stroke-linecap="round"/>
    <!-- Left Hand holding a book or just relaxed -->
    <circle cx="70" cy="153" rx="4" ry="4" fill="#fbcfe8"/>

    <!-- Right Arm (Behind head or holding open book / phone) -->
    <!-- Let's have him holding an open book relaxed on his lap -->
    <path d="M118 120 Q135 130 125 150" fill="none" stroke="#6366f1" stroke-width="11" stroke-linecap="round"/>
    <circle cx="125" cy="153" rx="4" ry="4" fill="#fbcfe8"/>

    <!-- Open Book on Lap -->
    <g transform="translate(90, 140)">
      <polygon points="10,12 25,5 40,12 40,25 25,22 10,25" fill="#f8fafc"/>
      <line x1="25" y1="5" x2="25" y2="22" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="13" y1="14" x2="21" y2="14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="13" y1="17" x2="19" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="29" y1="14" x2="37" y2="14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="29" y1="17" x2="35" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Head & Face -->
    <circle cx="100" cy="82" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M85 82 C85 68 115 68 115 82 C115 76 110 72 100 72 C90 72 85 76 85 82 Z" fill="#334155"/>
    <path d="M85 82 L88 87 L92 82" fill="#334155"/>

    <!-- Relaxed Facial Expression (Eyes closed peacefully / smiling) -->
    <path d="M93 82 Q96 85 99 82" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M101 82 Q104 85 107 82" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M98 88 Q100 90 102 88" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Gentle Blush -->
    <circle cx="92" cy="85" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="108" cy="85" r="3" fill="#fda4af" opacity="0.6"/>

    <!-- Armchair Seat Cushion Base -->
    <path d="M68 150 C68 145 132 145 132 150 L135 165 C135 170 65 170 65 165 Z" fill="#475569"/>
  </g>

  <!-- Ambient peaceful lighting effects (Sunbeams / Warm Atmosphere) -->
  <path d="M0 0 L90 0 L40 240 L0 240 Z" fill="url(#warmLight)" pointer-events="none" style="mix-blend-mode: overlay;"/>

  <!-- Floating tranquil music notes / peaceful vibes (No text!) -->
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="45" cy="140" r="2"/>
    <path d="M47 140 L47 132 L52 130 L52 138" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="185" cy="100" r="2.5"/>
    <path d="M187.5 100 L187.5 90 L194 87 L194 97" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
</svg>