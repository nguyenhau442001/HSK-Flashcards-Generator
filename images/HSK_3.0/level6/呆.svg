<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Room Environment -->
  <rect x="20" y="140" width="200" height="100" fill="#334155" rx="10"/>
  <rect x="40" y="160" width="160" height="20" fill="#475569" rx="5"/>
  
  <!-- Character (The '呆' - dazed/staying) -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-30 80 Q0 60 30 80 L30 100 Q0 110 -30 100 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="40" r="35" fill="#fbbf24"/>
    <!-- Dazed Eyes -->
    <ellipse cx="-12" cy="35" rx="4" ry="6" fill="#0f172a"/>
    <ellipse cx="12" cy="35" rx="4" ry="6" fill="#0f172a"/>
    <!-- Dazed Mouth -->
    <path d="M-8 55 Q0 50 8 55" stroke="#0f172a" stroke-width="3" fill="none"/>
    <!-- Hair -->
    <path d="M-25 20 Q-35 -10 0 -15 Q35 -10 25 20" fill="#1e293b"/>
  </g>
  
  <!-- Props: Clock indicating time passed -->
  <circle cx="180" cy="50" r="30" fill="#1e293b" stroke="#fb923c" stroke-width="4"/>
  <line x1="180" y1="50" x2="180" y2="30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="50" x2="200" y2="50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Window/Light -->
  <rect x="30" y="30" width="60" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="60" cy="60" r="15" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="180" r="5" fill="#10b981"/>
  <circle cx="30" cy="200" r="8" fill="#ec4899"/>
</svg>