<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window City Glow Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Table Lamp Light -->
    <radialGradient id="lampLight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Character 1 (Speaker) Skin & Hair -->
    <linearGradient id="char1Skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd1b3"/>
      <stop offset="100%" stop-color="#f4b183"/>
    </linearGradient>

    <!-- Dialogue Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & INTERIOR -->
  <!-- Back Wall Panel -->
  <rect x="20" y="20" width="200" height="155" rx="4" fill="#1e293b"/>
  <rect x="20" y="20" width="200" height="155" rx="4" fill="url(#lampLight)"/>

  <!-- Large Office/Cafe Window -->
  <rect x="135" y="35" width="70" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="135" y="35" width="70" height="80" fill="url(#windowGlow)"/>
  <!-- City Skyline Silhouette through Window -->
  <path d="M140 115 L140 90 L148 90 L148 115 L155 115 L155 75 L165 75 L165 115 L175 115 L175 60 L185 60 L185 115 L195 115 L195 85 L200 85 L200 115 Z" fill="#1e293b" opacity="0.8"/>
  <!-- Window Grid lines -->
  <line x1="170" y1="35" x2="170" y2="115" stroke="#334155" stroke-width="1.5"/>
  <line x1="135" y1="75" x2="205" y2="75" stroke="#334155" stroke-width="1.5"/>

  <!-- Wall Plant Shelf -->
  <rect x="35" y="55" width="55" height="6" rx="2" fill="#475569"/>
  <!-- Potted Plant -->
  <path d="M52 55 L50 43 L64 43 L62 55 Z" fill="#cbd5e1"/>
  <path d="M57 43 C57 33 45 35 50 25 C58 33 65 33 57 43 Z" fill="#10b981"/>
  <path d="M57 43 C62 33 72 35 68 25 C62 33 52 33 57 43 Z" fill="#34d399"/>

  <!-- Floor / Surface Base -->
  <rect x="0" y="175" width="240" height="65" fill="#0f172a"/>
  <!-- Wooden Table Desk Surface -->
  <path d="M10 175 L230 175 L220 205 L20 205 Z" fill="#334155"/>
  <path d="M10 175 L230 175 L230 181 L10 181 Z" fill="#475569"/> <!-- Table edge highlight -->

  <!-- Desk Props (Books, Coffee Cup) -->
  <rect x="30" y="180" width="22" height="12" rx="2" fill="#ec4899" transform="rotate(-5 30 180)"/>
  <rect x="32" y="177" width="20" height="10" rx="2" fill="#f43f5e" transform="rotate(-5 32 177)"/>
  <!-- Coffee Cup -->
  <rect x="185" y="176" width="14" height="16" rx="2" fill="#e2e8f0"/>
  <path d="M199 180 C204 180 204 188 199 190" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <path d="M188 174 C189 171 194 171 196 174" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6"/> <!-- Steam -->

  <!-- INTERACTIVE SOCIALIZATION / COMMUNICATION VISUALS -->
  <!-- Floating Connection / Dialogue / Socialization Network Nodes -->
  <circle cx="120" cy="70" r="3" fill="#38bdf8"/>
  <circle cx="95" cy="95" r="4" fill="#fbbf24"/>
  <circle cx="145" cy="100" r="3.5" fill="#10b981"/>
  <path d="M120 70 L95 95 M120 70 L145 100 M95 95 L145 100" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.5"/>

  <!-- Big Central Speech / Interaction Bubble representing "Communication" -->
  <path d="M85 38 C85 28 155 28 155 38 C155 48 85 48 85 38 Z" fill="url(#bubbleGrad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  <circle cx="105" cy="38" r="3" fill="#38bdf8"/>
  <circle cx="120" cy="38" r="4.5" fill="#fbbf24"/>
  <circle cx="135" cy="38" r="3" fill="#10b981"/>

  <!-- CHARACTER 1: Left Person (Active Speaker / Expressive Gestures) -->
  <g transform="translate(50, 95)">
    <!-- Body / Torso -->
    <path d="M15 50 C15 35 28 30 40 30 C52 30 65 35 65 50 L65 85 L15 85 Z" fill="#38bdf8"/>
    <path d="M30 30 L40 50 L50 30 Z" fill="#0284c7"/> <!-- Collar/Shirt accent -->

    <!-- Head & Neck -->
    <rect x="33" y="18" width="14" height="15" fill="url(#char1Skin)"/>
    <circle cx="40" cy="14" r="14" fill="url(#char1Skin)"/>
    <!-- Hair -->
    <path d="M26 12 C26 2 54 2 54 12 C54 16 52 18 50 14 C46 6 34 6 30 14 C28 18 26 16 26 12 Z" fill="#0f172a"/>
    <!-- Face details (smiling, engaged) -->
    <path d="M42 16 Q45 18 47 16" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Eye -->
    <path d="M33 16 Q35 18 37 16" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Eye -->
    <path d="M38 21 Q40 24 42 21" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Smile -->

    <!-- Left Arm (Gesturing upward dynamically to show improving communication skill) -->
    <path d="M18 40 C5 35 0 20 5 15" stroke="#f4b183" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M18 40 C5 35 0 20 5 15" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none" stroke-dasharray="1, 15"/> <!-- Sleeve -->
    <circle cx="4" cy="14" r="4" fill="url(#char1Skin)"/> <!-- Hand -->
  </g>

  <!-- CHARACTER 2: Right Person (Attentive Listener / Conversational Partner) -->
  <g transform="translate(130, 95)">
    <!-- Body / Torso -->
    <path d="M15 50 C15 35 28 30 40 30 C52 30 65 35 65 50 L65 85 L15 85 Z" fill="#10b981"/>
    <path d="M25 30 L40 45 L55 30 Z" fill="#059669"/> <!-- Collar accent -->

    <!-- Head & Neck -->
    <rect x="33" y="18" width="14" height="15" fill="url(#char1Skin)"/>
    <circle cx="40" cy="14" r="14" fill="url(#char1Skin)"/>
    <!-- Hair (Styled bob) -->
    <path d="M25 10 C25 -2 55 -2 55 10 C55 22 52 24 48 20 C40 14 40 14 32 20 C28 24 25 22 25 10 Z" fill="#334155"/>
    <!-- Face details (nodding, listening) -->
    <path d="M33 16 Q35 14 37 16" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Eye -->
    <path d="M43 16 Q45 14 47 16" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Eye -->
    <path d="M38 21 Q40 23 42 21" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Smile -->

    <!-- Right Arm (Resting on table, leaning in) -->
    <path d="M55 45 L70 65 L80 65" stroke="#f4b183" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M55 45 L70 65 L80 65" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="1, 20"/>
    <circle cx="81" cy="65" r="3.5" fill="url(#char1Skin)"/>
  </g>

  <!-- FOREGROUND ACCENTS & POLISH -->
  <!-- Sparkles / Rising success indicators for "Improving Capability" -->
  <g transform="translate(110, 80)" fill="#fbbf24">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"/>
  </g>
  <g transform="translate(130, 60)" fill="#38bdf8" opacity="0.8">
    <path d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
  </g>
  <g transform="translate(90, 65)" fill="#10b981" opacity="0.9">
    <path d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
  </g>

</svg>