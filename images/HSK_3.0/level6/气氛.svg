<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#31103f" />
    </linearGradient>

    <!-- Stage Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Spotlight Beam Gradient -->
    <linearGradient id="spotLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Vibrant Atmosphere Gradient -->
    <linearGradient id="atmosGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.4" />
    </linearGradient>

    <!-- Confetti / Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Stage Elements & Curtains -->
  <!-- Left Curtain -->
  <path d="M0,0 L40,0 C30,60 50,120 20,180 L0,200 Z" fill="#4c1d95" opacity="0.6" />
  <path d="M0,0 L25,0 C15,70 30,130 10,190 L0,210 Z" fill="#6d28d9" opacity="0.5" />

  <!-- Right Curtain -->
  <path d="M240,0 L200,0 C210,60 190,120 220,180 L240,200 Z" fill="#4c1d95" opacity="0.6" />
  <path d="M240,0 L215,0 C225,70 210,130 230,190 L240,210 Z" fill="#6d28d9" opacity="0.5" />

  <!-- Background Glowing Atmosphere Waves (Representing 'Bầu không khí' / Vibe) -->
  <ellipse cx="120" cy="130" rx="90" ry="60" fill="url(#atmosGrad)" filter="url(#softGlow)" />
  
  <!-- Dynamic Spotlight Beams -->
  <polygon points="120,0 60,200 100,200" fill="url(#spotLight)" />
  <polygon points="120,0 140,200 180,200" fill="url(#spotLight)" />
  <polygon points="120,0 80,200 160,200" fill="url(#spotLight)" />

  <!-- Hanging Stage Lights / Truss -->
  <rect x="50" y="10" width="140" height="4" rx="2" fill="#475569" />
  <circle cx="80" cy="12" r="6" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="120" cy="12" r="8" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="160" cy="12" r="6" fill="#ec4899" filter="url(#glow)" />

  <!-- Stage Floor -->
  <ellipse cx="120" cy="200" rx="100" ry="25" fill="url(#floorGrad)" />
  <ellipse cx="120" cy="200" rx="94" ry="21" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.5" />

  <!-- Centerpiece Object / Event Prop (Microphone & Stand with Sound/Energy Waves) -->
  <!-- Stand base -->
  <ellipse cx="120" cy="205" rx="14" ry="6" fill="#64748b" />
  <rect x="118" y="130" width="4" height="75" rx="2" fill="#94a3b8" />
  
  <!-- Microphone Head -->
  <circle cx="120" cy="125" r="10" fill="#cbd5e1" />
  <path d="M112,120 C112,132 128,132 128,120" fill="none" stroke="#64748b" stroke-width="2" />
  <rect x="117" y="134" width="6" height="6" rx="1" fill="#64748b" />

  <!-- Sound Waves / Energy radiating from the Mic (Atmosphere Expression) -->
  <path d="M 102 115 A 22 22 0 0 1 102 135" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 94 110 A 30 30 0 0 1 94 140" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <path d="M 138 115 A 22 22 0 0 0 138 135" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 146 110 A 30 30 0 0 0 146 140" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Energetic Crowd / Silhouette figures in foreground cheering -->
  <!-- Left person cheering -->
  <path d="M15,220 C15,195 35,195 40,220 Z" fill="#334155" />
  <circle cx="28" cy="180" r="10" fill="#334155" />
  <!-- Raised arm holding lightstick -->
  <path d="M35,185 L50,155" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  <circle cx="52" cy="150" r="5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Right person cheering -->
  <path d="M225,220 C225,195 205,195 200,220 Z" fill="#334155" />
  <circle cx="212" cy="180" r="10" fill="#334155" />
  <!-- Raised arm holding lightstick -->
  <path d="M205,185 L190,150" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  <circle cx="188" cy="145" r="5" fill="#ec4899" filter="url(#glow)" />

  <!-- Center-left enthusiastic spectator -->
  <path d="M60,225 C60,205 75,205 80,225 Z" fill="#1e293b" />
  <circle cx="70" cy="192" r="8" fill="#1e293b" />
  <path d="M75,195 L85,170" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <circle cx="87" cy="166" r="4" fill="#fbbf24" filter="url(#glow)" />

  <!-- Center-right enthusiastic spectator -->
  <path d="M180,225 C180,205 165,205 160,225 Z" fill="#1e293b" />
  <circle cx="170" cy="192" r="8" fill="#1e293b" />
  <path d="M165,195 L155,168" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <circle cx="153" cy="164" r="4" fill="#10b981" filter="url(#glow)" />

  <!-- Floating Atmosphere Particles, Confetti & Musical Notes (Lively Vibe) -->
  <!-- Golden Stars & Confetti -->
  <g filter="url(#glow)">
    <polygon points="55,90 58,97 65,98 60,103 61,110 55,106 49,110 50,103 45,98 52,97" fill="#fbbf24" transform="scale(0.6) translate(30, 40)" />
    <polygon points="185,80 188,87 195,88 190,93 191,100 185,96 179,100 180,93 175,88 182,87" fill="#38bdf8" transform="scale(0.5) translate(180, 50)" />
    <polygon points="120,60 122,65 128,66 123,70 125,76 120,72 115,76 117,70 112,66 118,65" fill="#ec4899" transform="scale(0.7) translate(50, 10)" />
    
    <!-- Floating circles / bubbles representing high energy -->
    <circle cx="75" cy="70" r="3" fill="#38bdf8" />
    <circle cx="165" cy="65" r="4" fill="#fbbf24" />
    <circle cx="95" cy="95" r="2.5" fill="#ec4899" />
    <circle cx="145" cy="85" r="3" fill="#10b981" />
    <circle cx="60" cy="130" r="2" fill="#fbbf24" />
    <circle cx="180" cy="120" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Musical Notes Floating -->
  <!-- Note 1 -->
  <g fill="#38bdf8" filter="url(#glow)" transform="translate(40, 50) rotate(-15)">
    <ellipse cx="6" cy="12" rx="3" ry="2" />
    <path d="M8,12 L8,2" stroke="#38bdf8" stroke-width="2" />
    <path d="M8,2 C12,2 14,5 15,8" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Note 2 -->
  <g fill="#ec4899" filter="url(#glow)" transform="translate(190, 95) rotate(20)">
    <ellipse cx="6" cy="12" rx="3" ry="2" />
    <path d="M8,12 L8,2" stroke="#ec4899" stroke-width="2" />
    <path d="M8,2 C12,2 14,5 15,8" fill="none" stroke="#ec4899" stroke-width="2" />
  </g>

  <!-- Frame Border / Clean Edge -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
</svg>