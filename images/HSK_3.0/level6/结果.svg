<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Clipboard Surface Gradient -->
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Paper Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Stamp Glow/Shadow -->
    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Desk/Environment Context) -->
  <!-- Desk surface line -->
  <path d="M 0 190 L 240 190" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Ambient background props (Study gear: pen holder/pencil) -->
  <g transform="translate(35, 140) rotate(-15)">
    <rect x="0" y="0" width="12" height="45" rx="3" fill="#38bdf8"/>
    <polygon points="0,0 6,-12 12,0" fill="#0f172a"/>
  </g>
  <g transform="translate(25, 155) rotate(10)">
    <rect x="0" y="0" width="10" height="40" rx="3" fill="#ec4899"/>
    <polygon points="0,0 5,-10 10,0" fill="#0f172a"/>
  </g>

  <!-- Coffee Mug Context Prop -->
  <g transform="translate(185, 145)">
    <rect x="0" y="10" width="30" height="35" rx="6" fill="#64748b"/>
    <path d="M 30 18 C 42 18, 42 35, 30 35" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="15" cy="10" rx="15" ry="5" fill="#94a3b8"/>
    <!-- Steam -->
    <path d="M 10 0 Q 15 -6 10 -12" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 20 -2 Q 23 -8 18 -14" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- MAIN SUBJECT: Exam Result Clipboard & Test Paper -->
  <g filter="url(#shadow)" transform="translate(62, 28)">
    
    <!-- Clipboard Wooden/Plastic Board -->
    <rect x="0" y="0" width="116" height="152" rx="12" fill="url(#boardGrad)"/>

    <!-- Metallic Clip at Top -->
    <path d="M 38 0 L 78 0 L 78 14 C 78 18 72 20 58 20 C 44 20 38 18 38 14 Z" fill="#94a3b8"/>
    <rect x="44" y="6" width="28" height="6" rx="3" fill="#cbd5e1"/>
    <circle cx="58" cy="9" r="2.5" fill="#475569"/>

    <!-- White Test Paper Sheet -->
    <rect x="10" y="22" width="96" height="124" rx="6" fill="#f8fafc"/>

    <!-- Decorative Score/Badge Header on Paper -->
    <circle cx="58" cy="50" r="18" fill="#dbeafe"/>
    <path d="M 48 50 L 55 57 L 69 41" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mock Answer Lines & Graphs on Paper -->
    <!-- Line 1 -->
    <rect x="22" y="78" width="50" height="4" rx="2" fill="#cbd5e1"/>
    <circle.dummy/> <circle cx="82" cy="80" r="4" fill="#10b981"/>

    <!-- Line 2 -->
    <rect x="22" y="94" width="60" height="4" rx="2" fill="#cbd5e1"/>
    <circle cx="89" cy="96" r="4" fill="#10b981"/>

    <!-- Line 3 -->
    <rect x="22" y="110" width="40" height="4" rx="2" fill="#cbd5e1"/>
    <circle cx="73" cy="112" r="4" fill="#10b981"/>

    <!-- Little Star rating stickers -->
    <g transform="translate(22, 124)">
      <polygon points="6,0 8,4 12,5 9,8 10,12 6,10 2,12 3,8 0,5 4,4" fill="#fbbf24"/>
      <polygon points="18,0 20,4 24,5 21,8 22,12 18,10 14,12 15,8 12,5 16,4" fill="#fbbf24"/>
      <polygon points="30,0 32,4 36,5 33,8 34,12 30,10 26,12 27,8 24,5 28,4" fill="#fbbf24"/>
    </g>

    <!-- ACTION-PACKED PASS / TOP RESULT STAMP -->
    <g transform="translate(48, 70) rotate(-12)" filter="url(#stampShadow)">
      <rect x="-8" y="-4" width="68" height="34" rx="6" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="72,3" opacity="0.9"/>
      <rect x="-4" y="0" width="60" height="26" rx="4" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.9"/>
      
      <!-- Checkmark Icon inside Stamp -->
      <path d="M 12 13 L 22 21 L 46 7" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  </g>

  <!-- Dynamic Foreground Sparkles / Celebration Accents -->
  <g transform="translate(30, 60)">
    <path d="M 0 6 L 12 6 M 6 0 L 6 12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(205, 75)">
    <path d="M 0 8 L 16 8 M 8 0 L 8 16" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(45, 130)">
    <circle cx="0" cy="0" r="4" fill="#ec4899"/>
  </g>
  <g transform="translate(195, 35)">
    <circle cx="0" cy="0" r="3" fill="#10b981"/>
  </g>
  <g transform="translate(170, 115)">
    <path d="M 0 5 L 10 5 M 5 0 L 5 10" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
  </g>

</svg>