<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- The 'Rule' - A neatly organized document folder and pen -->
  <path d="M70 160 L170 160 L165 100 L75 100 Z" fill="#f8fafc"/>
  <path d="M75 105 L165 105" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M75 115 L165 115" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M75 125 L165 125" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M75 135 L165 135" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Folder Tab -->
  <path d="M90 100 L90 90 L120 90 L120 100" fill="#f59e0b"/>
  
  <!-- Pen -->
  <rect x="180" y="120" width="8" height="40" rx="2" fill="#38bdf8"/>
  <rect x="182" y="115" width="4" height="10" fill="#10b981"/>
  
  <!-- Coffee Mug for context -->
  <circle cx="45" cy="140" r="20" fill="#fb923c"/>
  <path d="M65 135 A 10 10 0 0 1 65 155" stroke="#fb923c" stroke-width="4" fill="none"/>
  
  <!-- Clock on wall representing strictness/time -->
  <circle cx="190" cy="50" r="25" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
  <line x1="190" y1="50" x2="190" y2="35" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="50" x2="205" y2="50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="4" fill="#ec4899"/>
  <circle cx="210" cy="180" r="3" fill="#10b981"/>
</svg>