<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warning Red Glow -->
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Dramatic Atmosphere / Alert Red Glow in background -->
  <circle cx="120" cy="100" r="90" fill="url(#alertGlow)"/>

  <!-- Office Window showing dark city skyline -->
  <g opacity="0.4">
    <rect x="140" y="30" width="70" height="90" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <line x1="175" y1="30" x2="175" y2="120" stroke="#334155" stroke-width="2"/>
    <line x1="140" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="2"/>
    <!-- City Skyscrapers -->
    <rect x="148" y="60" width="12" height="60" fill="#1e293b"/>
    <rect x="165" y="45" width="16" height="75" fill="#1e293b"/>
    <rect x="188" y="70" width="14" height="50" fill="#1e293b"/>
    <!-- Tiny glowing window lights -->
    <rect x="151" y="65" width="2" height="3" fill="#fbbf24" opacity="0.6"/>
    <rect x="156" y="75" width="2" height="3" fill="#fbbf24" opacity="0.8"/>
    <rect x="170" y="55" width="3" height="3" fill="#fbbf24" opacity="0.5"/>
    <rect x="170" y="70" width="3" height="3" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Bookshelf / Office Clutter background -->
  <rect x="30" y="40" width="45" height="80" fill="#111827" rx="2"/>
  <line x1="30" y1="65" x2="75" y2="65" stroke="#374151" stroke-width="2"/>
  <line x1="30" y1="95" x2="75" y2="95" stroke="#374151" stroke-width="2"/>
  <!-- Folders on shelf -->
  <rect x="35" y="48" width="8" height="17" fill="#ef4444" rx="1"/>
  <rect x="44" y="45" width="10" height="20" fill="#3b82f6" rx="1"/>
  <rect x="56" y="50" width="7" height="15" fill="#10b981" rx="1"/>
  <rect x="36" y="75" width="12" height="20" fill="#f59e0b" rx="1"/>
  <rect x="50" y="78" width="9" height="17" fill="#6366f1" rx="1"/>

  <!-- Office Desk Surface -->
  <path d="M 20 180 L 220 180 L 210 210 L 30 210 Z" fill="url(#deskGrad)"/>
  <path d="M 20 180 L 220 180 L 220 184 L 20 184 Z" fill="#475569"/>

  <!-- Bankruptcy Notice / Financial Chart Prop on Desk -->
  <g transform="translate(130, 140)">
    <!-- Paper Document -->
    <rect x="0" y="0" width="55" height="45" rx="3" fill="#f8fafc" transform="rotate(-8 27 22)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Red Downward Trend Line on Document -->
    <path d="M 8 30 L 22 25 L 36 35 L 47 15" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8 27 22)"/>
    <!-- Red Stamp Outline (Bankrupt/Cross) -->
    <circle cx="38" cy="18" r="10" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.85" transform="rotate(-8 27 22)"/>
    <line x1="31" y1="11" x2="45" y2="25" stroke="#ef4444" stroke-width="2.5" opacity="0.85" transform="rotate(-8 27 22)"/>
  </g>

  <!-- Laptop on Desk (Screen glowing red/orange warning) -->
  <g transform="translate(45, 135)">
    <!-- Laptop Base -->
    <path d="M -10 35 L 55 35 L 65 42 L -20 42 Z" fill="#64748b"/>
    <rect x="15" y="37" width="18" height="3" rx="1" fill="#475569"/>
    <!-- Laptop Screen Back -->
    <rect x="-5" y="-5" width="50" height="42" rx="4" fill="#334155"/>
    <!-- Screen Display (Red Chart) -->
    <rect x="0" y="0" width="40" height="32" rx="2" fill="#0f172a"/>
    <path d="M 5 25 L 15 20 L 25 27 L 35 10" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="35" cy="10" r="3" fill="#ef4444"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="105" y="155" width="14" height="18" rx="2" fill="#e2e8f0"/>
  <path d="M 119 159 C 124 159, 124 169, 119 169" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Main Character: Stressed CEO / Office Worker -->
  <g transform="translate(75, 75)">
    <!-- Body / Suit Torso -->
    <path d="M 25 55 L 65 55 L 75 110 L 15 110 Z" fill="#1e293b"/>
    
    <!-- Shirt Collar & Red Tie -->
    <polygon points="45,55 35,70 55,70" fill="#f8fafc"/>
    <polygon points="43,65 47,65 49,95 45,102 41,95" fill="#ef4444"/>

    <!-- Shoulders / Arms in despair (holding head) -->
    <!-- Left Arm -->
    <path d="M 25 60 C 10 70, 5 90, 18 95 C 25 98, 32 85, 35 75" fill="#1e293b"/>
    <!-- Right Arm -->
    <path d="M 65 60 C 80 70, 85 90, 72 95 C 65 98, 58 85, 55 75" fill="#1e293b"/>

    <!-- Head & Hair -->
    <!-- Hair -->
    <path d="M 30 30 C 30 15, 60 15, 65 30 C 68 35, 67 40, 65 40 L 30 40 C 28 40, 28 35, 30 30 Z" fill="#334155"/>
    
    <!-- Face Skin -->
    <rect x="30" y="28" width="30" height="32" rx="12" fill="#fed7aa"/>

    <!-- Hands clutching head / hair in stress -->
    <!-- Left Hand -->
    <circle cx="23" cy="35" r="7" fill="#fed7aa"/>
    <!-- Right Hand -->
    <circle cx="67" cy="35" r="7" fill="#fed7aa"/>

    <!-- Facial Expression: Eyes closed tightly in despair, furrowed brows, sweat drop -->
    <!-- Eyebrows angled down in distress -->
    <line x1="36" y1="38" x2="43" y2="42" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="54" y1="42" x2="61" y2="38" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Closed Eyes (Arcs curving down) -->
    <path d="M 36 46 C 38 48, 41 48, 43 46" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <path d="M 54 46 C 56 48, 59 48, 61 46" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>

    <!-- Worried / O-shaped distressed mouth -->
    <ellipse cx="48" cy="53" rx="4" ry="5" fill="#7c2d12"/>

    <!-- Sweat drop of anxiety -->
    <path d="M 62 25 C 62 25, 66 30, 66 33 C 66 35, 64 36, 62 36 C 60 36, 58 35, 58 33 C 58 30, 62 25, 62 25 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground plant silhouette for framing/depth -->
  <path d="M 0 240 C 0 200, 20 190, 20 180 C 20 190, 40 210, 40 240 Z" fill="#090d16"/>
  <path d="M 210 240 C 210 195, 240 190, 240 180 C 240 200, 240 220, 210 240 Z" fill="#090d16"/>
</svg>