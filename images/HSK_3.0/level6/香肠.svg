  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 Q 120 170 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Plate -->
  <ellipse cx="120" cy="190" rx="80" ry="25" fill="#e2e8f0"/>
  <ellipse cx="120" cy="185" rx="75" ry="20" fill="#f8fafc"/>
  
  <!-- Sausages -->
