<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- House Left (My House) Gradients -->
    <linearGradient id="house-left-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="house-left-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- House Right (Next door / gébì) Gradients -->
    <linearGradient id="house-right-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="house-right-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Warm Window Glow -->
    <radialGradient id="window-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Night Sky & Stars -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="30" cy="40" r="1.5" />
    <circle cx="120" cy="25" r="1" />
    <circle cx="210" cy="50" r="2" />
    <circle cx="70" cy="65" r="1" />
    <circle cx="170" cy="35" r="1.5" />
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16" />
  <path d="M 0 190 Q 120 185 240 190" stroke="#334155" stroke-width="2" fill="none" />

  <!-- Scene Elements: Two houses side by side representing "gébì" (next door) -->

  <!-- HOUSE 1: Left House (My house) -->
  <g filter="url(#shadow)">
    <!-- Roof -->
    <path d="M 15 110 L 75 75 L 135 110 Z" fill="url(#house-left-roof)" />
    <path d="M 75 75 L 135 110 L 125 110 L 75 81 Z" fill="#ffffff" opacity="0.15" />
    
    <!-- Walls -->
    <rect x="30" y="110" width="90" height="85" fill="url(#house-left-wall)" rx="4" />
    
    <!-- Door -->
    <rect x="65" y="145" width="20" height="50" rx="3" fill="#0369a1" />
    <circle cx="80" cy="172" r="1.5" fill="#facc15" />

    <!-- Window -->
    <rect x="45" y="125" width="20" height="20" rx="3" fill="url(#window-glow)" />
    <path d="M 55 125 V 145 M 45 135 H 65" stroke="#0284c7" stroke-width="2" />
  </g>

  <!-- HOUSE 2: Right House (The Next Door / Gébì House - highlighted context) -->
  <g filter="url(#shadow)">
    <!-- Roof -->
    <path d="M 105 105 L 165 65 L 225 105 Z" fill="url(#house-right-roof)" />
    <path d="M 165 65 L 225 105 L 215 105 L 165 71 Z" fill="#ffffff" opacity="0.15" />

    <!-- Walls -->
    <rect x="120" y="105" width="90" height="90" fill="url(#house-right-wall)" rx="4" />

    <!-- Balcony / Windows with warm neighborly vibe -->
    <rect x="135" y="120" width="22" height="25" rx="3" fill="url(#window-glow)" />
    <path d="M 146 120 V 145 M 135 132.5 H 157" stroke="#9a3412" stroke-width="2" />

    <rect x="173" y="120" width="22" height="25" rx="3" fill="url(#window-glow)" />
    <path d="M 184 120 V 145 M 173 132.5 H 195" stroke="#9a3412" stroke-width="2" />

    <!-- Neighbor's Door -->
    <rect x="155" y="155" width="20" height="40" rx="3" fill="#9a3412" />
    <circle cx="170" cy="177" r="1.5" fill="#facc15" />

    <!-- Cute Neighbor Cat on the Roof / Wall -->
    <path d="M 130 108 Q 134 100 138 108" fill="#fbbf24" />
    <circle cx="134" cy="103" r="4" fill="#fbbf24" />
    <polygon points="131,101 132,97 135,100" fill="#fbbf24" />
    <polygon points="137,101 138,97 135,100" fill="#fbbf24" />
  </g>

  <!-- Dividing fence / bush between houses to emphasize "next door" separation -->
  <g transform="translate(105, 175)">
    <rect x="0" y="0" width="30" height="15" rx="7.5" fill="#10b981" />
    <rect x="5" y="-5" width="20" height="15" rx="7.5" fill="#34d399" />
  </g>

  <!-- Environmental props: Potted plant near the adjoining walls -->
  <rect x="105" y="180" width="10" height="12" rx="2" fill="#f43f5e" />
  <circle cx="110" cy="176" r="6" fill="#10b981" />
  <circle cx="107" cy="173" r="4" fill="#34d399" />
  <circle cx="113" cy="173" r="4" fill="#34d399" />

  <!-- Action/Spatial Arrow indicator emphasizing the "Next Door" relationship (Side-by-side connection) -->
  <g transform="translate(0, -10)">
    <!-- Connecting dashed arc between houses -->
    <path d="M 85 95 Q 110 75 135 95" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4" fill="none" opacity="0.8" />
    <!-- Glowing pointer dots -->
    <circle cx="85" cy="95" r="3" fill="#38bdf8" />
    <circle cx="135" cy="95" r="3" fill="#fb923c" />
  </g>

  <!-- Warm ambient lighting cast on ground -->
  <ellipse cx="75" cy="190" rx="45" ry="5" fill="#f59e0b" opacity="0.15" />
  <ellipse cx="165" cy="190" rx="45" ry="5" fill="#f59e0b" opacity="0.2" />

</svg>