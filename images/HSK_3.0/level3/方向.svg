<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100% " stop-color="#090d16" />
    </linearGradient>

    <!-- Compass Gold Glow -->
    <radialGradient id="compass-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Pine Tree Gradients -->
    <linearGradient id="pine-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pine-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Path Gradient -->
    <linearGradient id="path-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Needle Gradient Red -->
    <linearGradient id="needle-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Needle Gradient Silver -->
    <linearGradient id="needle-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Decorative Stars/Sparkles -->
  <g fill="#94a3b8" opacity="0.3">
    <circle cx="35" cy="40" r="1.5" />
    <circle cx="205" cy="30" r="2" />
    <circle cx="215" cy="115" r="1" />
    <circle cx="25" cy="140" r="1.5" />
    <circle cx="110" cy="25" r="1" />
  </g>
  <!-- Glowing Stars -->
  <path d="M190,60 Q190,65 185,65 Q190,65 190,70 Q190,65 195,65 Q190,65 190,60 Z" fill="#38bdf8" opacity="0.6"/>
  <path d="M50,85 Q50,89 46,89 Q50,89 50,93 Q50,89 54,89 Q50,89 50,85 Z" fill="#fbbf24" opacity="0.7"/>

  <!-- Distant Hills / Forest Silhouette -->
  <path d="M0,160 Q60,135 120,150 T240,140 L240,240 L0,240 Z" fill="#0b1324" />
  <path d="M0,175 Q80,155 160,170 T240,165 L240,240 L0,240 Z" fill="#111c33" opacity="0.8" />

  <!-- Winding Path representing "Wrong/Right Direction" -->
  <path d="M120,240 C110,200 90,170 140,140 C170,120 160,90 200,60" fill="none" stroke="url(#path-grad)" stroke-width="18" stroke-linecap="round" />
  <path d="M120,240 C110,200 90,170 140,140 C170,120 160,90 200,60" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,6" opacity="0.5" />

  <!-- Surrounding Environment Props: Pine Trees -->
  <!-- Tree Left -->
  <g transform="translate(25, 120)">
    <polygon points="20,0 35,25 25,25 40,50 30,50 45,75 5,75 20,50 10,50 25,25 15,25" fill="url(#pine-dark)" />
    <rect x="18" y="75" width="4" height="15" fill="#475569" />
  </g>
  <!-- Tree Right -->
  <g transform="translate(175, 95)">
    <polygon points="20,0 35,22 25,22 40,45 30,45 48,75 2,75 18,45 10,45 25,22 15,22" fill="url(#pine-light)" opacity="0.85" />
    <rect x="18" y="75" width="4" height="15" fill="#475569" />
  </g>
  <g transform="translate(200, 130) scale(0.7)">
    <polygon points="20,0 35,25 25,25 40,50 30,50 45,75 5,75 20,50 10,50 25,25 15,25" fill="url(#pine-dark)" />
    <rect x="18" y="75" width="4" height="15" fill="#475569" />
  </g>

  <!-- Ambient Glow behind Compass -->
  <circle cx="120" cy="120" r="70" fill="url(#compass-glow)" />

  <!-- MAIN SUBJECT: Vintage Real-World Compass -->
  <g transform="translate(120, 120)">
    <!-- Outer Shadow / Depth Ring -->
    <circle cx="0" cy="2" r="62" fill="#090d16" opacity="0.6" />

    <!-- Outer Brass/Gold Case -->
    <circle cx="0" cy="0" r="62" fill="#b45309" />
    <circle cx="0" cy="0" r="59" fill="#d97706" />
    <circle cx="0" cy="0" r="56" fill="#fbbf24" />

    <!-- Compass Loop/Attachment on Top -->
    <path d="M-12,-56 C-12,-68 12,-68 12,-56" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
    <path d="M-10,-56 C-10,-65 10,-65 10,-56" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

    <!-- Inner Dark Dial Face -->
    <circle cx="0" cy="0" r="48" fill="#0f172a" />
    <circle cx="0" cy="0" r="48" fill="url(#bg-grad)" opacity="0.5" />

    <!-- Dial Tick Marks & Degree Graduations -->
    <g stroke="#64748b" stroke-width="1.5" opacity="0.6">
      <line x1="0" y1="-46" x2="0" y2="-42" />
      <line x1="0" y1="46" x2="0" y2="42" />
      <line x1="-46" y1="0" x2="-42" y2="0" />
      <line x1="46" y1="0" x2="42" y2="0" />
      
      <!-- Diagonals -->
      <line x1="-32.5" y1="-32.5" x2="-29.5" y2="-29.5" />
      <line x1="32.5" y1="-32.5" x2="29.5" y2="-29.5" />
      <line x1="-32.5" y1="32.5" x2="-29.5" y2="29.5" />
      <line x1="32.5" y1="32.5" x2="29.5" y2="29.5" />
    </g>

    <!-- Directional Crosshairs / Points -->
    <g stroke="#38bdf8" stroke-width="1" opacity="0.4">
      <line x1="0" y1="-42" x2="0" y2="42" />
      <line x1="-42" y1="0" x2="42" y2="0" />
    </g>

    <!-- Cardinal Direction Markers (Abstract/Geometric to strictly avoid any text rules) -->
    <!-- North Arrow indicator -->
    <polygon points="0,-44 -4,-34 4,-34" fill="#f43f5e" />
    <!-- South dot -->
    <circle cx="0" cy="38" r="2.5" fill="#94a3b8" />
    <!-- East dot -->
    <circle cx="38" cy="0" r="2" fill="#94a3b8" />
    <!-- West dot -->
    <circle cx="-38" cy="0" r="2" fill="#94a3b8" />

    <!-- ACTION-PACKED COMPASS NEEDLE (Tilted dynamically to signify choosing a direction / going off-course) -->
    <g transform="rotate(38)">
      <!-- Drop Shadow for Needle -->
      <polygon points="0,0 -7,-3 0,-48 7,-3" fill="#000000" opacity="0.3" transform="translate(2, 4)" />
      <!-- North half (Red / Energetic Accent) -->
      <polygon points="0,0 -6,-4 0,-44 6,-4" fill="url(#needle-red)" />
      <!-- North highlight facet -->
      <polygon points="0,0 0,-44 6,-4" fill="#fb7185" opacity="0.4" />

      <!-- South half (Silver / Slate) -->
      <polygon points="0,0 -6,4 0,40 6,4" fill="url(#needle-silver)" />
      <!-- South shade facet -->
      <polygon points="0,0 0,40 6,4" fill="#475569" opacity="0.3" />

      <!-- Center Pivot Pin -->
      <circle cx="0" cy="0" r="7" fill="#b45309" />
      <circle cx="0" cy="0" r="5" fill="#fbbf24" />
      <circle cx="-1.5" cy="-1.5" r="1.5" fill="#fef3c7" opacity="0.8" />
    </g>

    <!-- Glass Lens Reflection Overlay -->
    <path d="M-34,-34 C-15,-46 15,-46 34,-34 C46,-15 46,15 34,34 C15,46 -15,46 -34,34 C-46,15 -46,-15 -34,-34 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" />
    <path d="M-28,-28 C-12,-38 12,-38 28,-28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Foreground Dynamic Elements: Floating glowing waypoint indicators/sparkles -->
  <g transform="translate(180, 75)">
    <circle cx="0" cy="0" r="8" fill="#38bdf8" opacity="0.2" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <path d="M-8,0 L8,0 M0,-8 L0,8" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
  </g>

  <g transform="translate(65, 175)">
    <circle cx="0" cy="0" r="6" fill="#f43f5e" opacity="0.2" />
    <circle cx="0" cy="0" r="3" fill="#f43f5e" />
  </g>

  <!-- Vignette / Frame border to complete polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>