<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Mirror Frame Gradient -->
    <linearGradient id="mirrorFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Mirror Reflection Gradient -->
    <linearGradient id="mirrorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Room Elements -->
  <!-- Floor line -->
  <path d="M 0 200 L 240 200" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <rect x="0" y="200" width="240" height="40" fill="#090d16" opacity="0.6"/>

  <!-- Background Wallpaper Stripes / Detail -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="2">
    <line x1="40" y1="0" x2="40" y2="200" />
    <line x1="200" y1="0" x2="200" y2="200" />
  </g>

  <!-- Hanging Potted Plant (Adds natural, cozy room context) -->
  <path d="M 195 0 L 195 45" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 180 45 C 180 35, 210 35, 210 45 Z" fill="#cbd5e1" />
  <path d="M 195 45 Q 180 70, 170 60" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 195 45 Q 215 80, 225 70" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="170" cy="58" r="6" fill="#10b981"/>
  <circle cx="225" cy="68" r="7" fill="#059669"/>

  <!-- FULL-LENGTH MIRROR (Context Prop for 'Gầy' / 'Slim') -->
  <g filter="url(#shadow)">
    <!-- Mirror Stand Base -->
    <ellipse cx="120" cy="203" rx="35" ry="6" fill="#0f172a" />
    <path d="M 105 200 L 120 185 L 135 200 Z" fill="#334155" />
    
    <!-- Mirror Outer Frame -->
    <rect x="85" y="25" width="70" height="165" rx="35" fill="url(#mirrorFrame)" />
    <!-- Mirror Inner Glass -->
    <rect x="91" y="31" width="58" height="153" rx="29" fill="#0f172a" />
    <rect x="91" y="31" width="58" height="153" rx="29" fill="url(#mirrorGlass)" />
    
    <!-- Mirror Reflection Glare Highlight -->
    <path d="M 98 40 Q 115 40, 105 90" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25"/>
  </g>

  <!-- CHARACTER: SLIM/GẦY MAN -->
  <g filter="url(#shadow)">
    <!-- Shadow under character -->
    <ellipse cx="120" cy="198" rx="22" ry="4" fill="#000000" opacity="0.5"/>

    <!-- Shoes -->
    <path d="M 105 194 C 105 190, 112 190, 116 194 Z" fill="#334155" />
    <path d="M 124 194 C 124 190, 131 190, 135 194 Z" fill="#334155" />

    <!-- Extremely Slim Legs (Emphasizing 'Gầy') -->
    <path d="M 110 140 L 110 192" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" />
    <path d="M 130 140 L 130 192" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" />

    <!-- Pants (Loose-fitting on slim frame) -->
    <path d="M 106 135 L 134 135 L 130 175 L 110 175 Z" fill="#3b82f6" />
    <line x1="120" y1="135" x2="120" y2="173" stroke="#1d4ed8" stroke-width="2" />

    <!-- Narrow Torso in T-Shirt (Emphasizes thin body) -->
    <path d="M 103 85 L 137 85 L 132 140 L 108 140 Z" fill="url(#shirtGrad)" />
    
    <!-- Rib/Slim indication lines subtle on shirt (Optional stylistic cue) -->
    <path d="M 115 105 L 125 105 M 115 115 L 125 115" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Very Thin Arms (Hands on hips accentuating narrow waist) -->
    <!-- Left Arm -->
    <path d="M 103 88 Q 90 105, 102 120" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M 137 88 Q 150 105, 138 120" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="114" y="70" width="12" height="15" rx="6" fill="#fbcfe8" />

    <!-- Head & Face -->
    <circle cx="120" cy="55" r="18" fill="#fbcfe8" />
    
    <!-- Casual Hair (Dark, neat) -->
    <path d="M 103 55 C 103 38, 137 38, 137 55 C 137 55, 132 44, 120 44 C 108 44, 103 55, 103 55 Z" fill="#334155" />
    <path d="M 110 45 L 115 48" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Facial Expression: Surprised/Realizing ("Gần đây anh ấy gầy đi rất nhiều") -->
    <!-- Eyes (Wide, expressive) -->
    <circle cx="114" cy="55" r="2.5" fill="#1e293b" />
    <circle cx="126" cy="55" r="2.5" fill="#1e293b" />
    <!-- Eyebrows (Raised high in realization) -->
    <path d="M 111 49 Q 114 47, 117 49" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M 123 49 Q 126 47, 129 49" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <!-- Cheeks (Slightly hollow/slim accent) -->
    <ellipse cx="112" cy="60" rx="2" ry="1" fill="#f43f5e" opacity="0.3" />
    <ellipse cx="128" cy="60" rx="2" ry="1" fill="#f43f5e" opacity="0.3" />
    <!-- Open Mouth (Surprised 'O' shape) -->
    <circle cx="120" cy="64" r="3" fill="#9f1239" />
  </g>

  <!-- INTERACTIVE SCENE PROPS -->
  <!-- Measuring Tape wrapped loosely around waist (Visual metaphor for weight loss/slimness) -->
  <g filter="url(#shadow)">
    <!-- Tape hanging down -->
    <path d="M 138 120 Q 155 125, 150 145 Q 145 160, 135 155" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <!-- Tape markings -->
    <path d="M 144 123 L 146 127 M 148 132 L 150 136" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <!-- End metallic tip of tape -->
    <rect x="133" y="152" width="6" height="5" rx="1" fill="#94a3b8" />
  </g>

  <!-- Bathroom Scale on floor with glowing indicator -->
  <g filter="url(#shadow)">
    <rect x="100" y="180" width="40" height="16" rx="4" fill="#cbd5e1" />
    <rect x="105" y="183" width="30" height="10" rx="2" fill="#1e293b" />
    <!-- Glowing digital numbers simulation -->
    <circle cx="114" cy="188" r="1.5" fill="#38bdf8" />
    <circle cx="120" cy="188" r="1.5" fill="#38bdf8" />
    <circle cx="126" cy="188" r="1.5" fill="#38bdf8" />
    <!-- Scale brand accent -->
    <circle cx="120" cy="183.5" r="1" fill="#64748b" />
  </g>

  <!-- Atmospheric Warm Accent Light (Top Left) -->
  <circle cx="40" cy="30" r="60" fill="url(#warmGlow)" style="mix-blend-mode: screen;" />

</svg>