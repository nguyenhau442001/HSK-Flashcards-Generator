<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light / Spot Light -->
    <radialGradient id="lightGlow" cx="70%" cy="30%" r="70%" fx="70%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lightGlow)" />

  <!-- ENVIRONMENT: School Principal's Office -->
  <!-- Wallpaper / Wall -->
  <path d="M0 0 H240 V170 H0 Z" fill="#1e293b" />
  
  <!-- Wooden Wainscoting (Wall paneling) -->
  <path d="M0 140 H240 V170 H0 Z" fill="#334155" />
  <path d="M0 137 H240 V140 H0 Z" fill="#475569" />

  <!-- Bookshelf in Background with Colorful Books -->
  <g transform="translate(160, 45)">
    <rect x="0" y="0" width="60" height="95" rx="2" fill="#0f172a" opacity="0.6"/>
    <!-- Shelves -->
    <rect x="-2" y="30" width="64" height="4" fill="#475569" />
    <rect x="-2" y="65" width="64" height="4" fill="#475569" />
    <!-- Books Shelf 1 -->
    <rect x="6" y="8" width="8" height="22" rx="1" fill="#ec4899" />
    <rect x="16" y="10" width="6" height="20" rx="1" fill="#38bdf8" />
    <rect x="24" y="6" width="10" height="24" rx="1" fill="#10b981" />
    <rect x="36" y="12" width="7" height="18" rx="1" fill="#fbbf24" />
    <!-- Books Shelf 2 -->
    <path d="M5 45 L15 34 L21 45 Z" fill="#fb923c" /> <!-- folder/binder -->
    <rect x="24" y="38" width="12" height="27" rx="1" fill="#8b5cf6" />
    <rect x="38" y="42" width="8" height="23" rx="1" fill="#f43f5e" />
  </g>

  <!-- Window with Night Cityscape / Campus View -->
  <g transform="translate(25, 30)">
    <rect x="0" y="0" width="50" height="75" rx="4" fill="#0b0f19" />
    <!-- Window frame -->
    <rect x="-3" y="-3" width="56" height="81" rx="6" fill="none" stroke="#475569" stroke-width="3" />
    <line x1="25" y1="0" x2="25" y2="75" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="37" x2="50" y2="37" stroke="#475569" stroke-width="2" />
    <!-- Outside Light beam angle -->
    <polygon points="0,0 50,0 50,75 0,35" fill="url(#windowLight)" />
    <!-- Distant tree silhouette -->
    <path d="M10 75 Q15 60 20 75 Z" fill="#1e293b" />
    <path d="M15 75 Q22 55 30 75 Z" fill="#1e293b" />
  </g>

  <!-- Hanging Diplomas / Awards on Wall -->
  <g transform="translate(95, 40)" filter="url(#shadow)">
    <rect x="0" y="0" width="22" height="16" rx="1" fill="#fbbf24" />
    <rect x="2" y="2" width="18" height="12" fill="#fff" opacity="0.9" />
    <line x1="5" y1="5" x2="17" y2="5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="5" y1="8" x2="13" y2="8" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="11" cy="11" r="1.5" fill="#ef4444" />
  </g>

  <!-- Floor (Rug and Floorboards) -->
  <path d="M0 170 H240 V240 H0 Z" fill="#0f172a" />
  <!-- Large Office Rug -->
  <ellipse cx="120" cy="205" rx="85" ry="25" fill="#334155" opacity="0.8" />
  <ellipse cx="120" cy="205" rx="75" ry="20" fill="#1e293b" opacity="0.9" />

  <!-- Office Desk -->
  <g transform="translate(60, 145)" filter="url(#shadow)">
    <!-- Desk Top -->
    <polygon points="0,15 120,15 135,35 -15,35" fill="#64748b" />
    <polygon points="-12,33 132,33 135,39 -15,39" fill="#475569" />
    <!-- Desk Legs -->
    <rect x="10" y="39" width="8" height="40" fill="#334155" />
    <rect x="102" y="39" width="8" height="40" fill="#334155" />
  </g>

  <!-- Desk Props: Laptop, Lamp, Globe, Student Artwork -->
  <g transform="translate(60, 145)">
    <!-- Laptop -->
    <path d="M15 22 L35 22 L38 27 L12 27 Z" fill="#cbd5e1" />
    <rect x="18" y="10" width="17" height="13" rx="1" fill="#94a3b8" />
    <rect x="19" y="11" width="15" height="10" fill="#38bdf8" opacity="0.6" />

    <!-- Cute Globe (representing school/world) -->
    <circle cx="85" cy="15" r="9" fill="#38bdf8" />
    <!-- Continents on globe -->
    <path d="M82 10 Q85 8 88 12 Q84 15 82 10 Z" fill="#10b981" />
    <path d="M79 18 Q82 16 83 20 Q80 22 79 18 Z" fill="#10b981" />
    <path d="M84.5 6 A9 9 0 0 1 84.5 24 A11 11 0 0 1 84.5 6 Z" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="83.5" y="24" width="2" height="4" fill="#cbd5e1" />

    <!-- Student's Drawing / Paper Stack with Star -->
    <rect x="45" y="20" width="16" height="12" rx="1" fill="#f8fafc" transform="rotate(-5 53 26)" />
    <path d="M53 23 L54 25 L56 25 L54.5 26.5 L55 28.5 L53 27.5 L51 28.5 L51.5 26.5 L50 25 L52 25 Z" fill="#fbbf24" transform="rotate(-5 53 26)" />
  </g>

  <!-- Office Chair -->
  <g transform="translate(100, 155)">
    <!-- Chair Backrest -->
    <rect x="10" y="-15" width="22" height="35" rx="8" fill="#1e293b" filter="url(#shadow)" />
    <rect x="13" y="-12" width="16" height="29" rx="5" fill="#334155" />
    <!-- Chair Seat -->
    <ellipse cx="21" cy="18" rx="16" ry="7" fill="#475569" filter="url(#shadow)" />
  </g>

  <!-- MAIN CHARACTER: Principal (校长 - xiàozhǎng) -->
  <g transform="translate(90, 85)" filter="url(#shadow)">
    
    <!-- Body / Suit Jacket -->
    <!-- Shoulders & Torso -->
    <path d="M10 65 Q21 45 42 45 Q63 45 74 65 L80 115 H4 L10 65 Z" fill="#0f172a" />
    
    <!-- White Shirt Collar & Red Tie -->
    <polygon points="35,45 42,62 49,45" fill="#f8fafc" />
    <!-- Red Tie with Golden Pin (Authority/Excellence) -->
    <polygon points="40,50 44,50 45,75 42,80 39,75" fill="#ef4444" />
    <circle cx="42" cy="54" r="1.5" fill="#fbbf24" />

    <!-- Suit Lapels -->
    <path d="M35,45 L25,75 L32,77 Z" fill="#1e293b" />
    <path d="M49,45 L59,75 L52,77 Z" fill="#1e293b" />

    <!-- Friendly, Warm Face Expression -->
    <!-- Head/Skin -->
    <ellipse cx="42" cy="28" rx="16" ry="18" fill="#ffedd5" />

    <!-- Ears -->
    <circle cx="25" cy="30" r="3" fill="#ffedd5" />
    <circle cx="59" cy="30" r="3" fill="#ffedd5" />

    <!-- Distinguished Hair (Sides, neat, slight gray at temples for wisdom) -->
    <path d="M26 24 C26 14 33 10 42 10 C51 10 58 14 58 24 C58 24 58 16 52 13 C46 10 38 10 32 13 C26 16 26 24 26 24 Z" fill="#64748b" />
    <path d="M26 28 C25 32 27 34 29 32 Z" fill="#64748b" />
    <path d="M58 28 C59 32 57 34 55 32 Z" fill="#64748b" />

    <!-- Friendly Eyes (Warm happy crescent/curved lines with glasses) -->
    <!-- Glasses Frame (Round smart intellectual look) -->
    <circle cx="34" cy="27" r="6" fill="none" fill-opacity="0.1" stroke="#334155" stroke-width="1.5" />
    <circle cx="50" cy="27" r="6" fill="none" fill-opacity="0.1" stroke="#334155" stroke-width="1.5" />
    <line x1="40" y1="27" x2="44" y2="27" stroke="#334155" stroke-width="1.5" />
    
    <!-- Eyes closed happily/smiling -->
    <path d="M30 27 Q34 30 38 27" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M46 27 Q50 30 54 27" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Gentle Warm Smile & Rosy Cheeks -->
    <circle cx="31" cy="32" r="3" fill="#fca5a5" opacity="0.5" />
    <circle cx="53" cy="32" r="3" fill="#fca5a5" opacity="0.5" />
    <path d="M37 35 Q42 40 47 35" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />

    <!-- Gesture: Welcoming open hand pointing forward/encouraging -->
    <!-- Right Arm & Hand (Waving / Welcoming) -->
    <path d="M74 55 Q90 50 95 38 Q98 32 92 32 Q88 32 82 42" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="95" cy="36" r="4.5" fill="#ffedd5" />

    <!-- Left Arm (Holding a friendly clipboard or welcoming gesture) -->
    <path d="M10 55 Q2 70 12 90" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Student Interaction: Holding up a glowing golden star / paper test showing "A+" or high achievement (represented graphically) -->
  <g transform="translate(35, 155)" filter="url(#shadow)">
    <!-- Small student character hand holding up paper to Principal -->
    <rect x="0" y="5" width="22" height="28" rx="2" fill="#ffffff" transform="rotate(-15 11 19)" />
    <line x1="5" y1="12" x2="15" y2="9" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" transform="rotate(-15 11 19)" />
    <line x1="5" y1="17" x2="12" y2="14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" transform="rotate(-15 11 19)" />
    <!-- Big glowing star stamp on paper -->
    <path d="M12 21 L13.5 24 L17 24.5 L14.5 27 L15 30.5 L12 29 L9 30.5 L9.5 27 L7 24.5 L10.5 24 Z" fill="#fbbf24" transform="rotate(-15 12 26) scale(0.6)" />
    <!-- Student sleeve -->
    <path d="M-10 35 Q-5 25 5 20" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <circle cx="-10" cy="35" r="3.5" fill="#ffedd5" />
  </g>

  <!-- Foreground Atmospheric Elements / Sparkles of Encouragement -->
  <g transform="translate(135, 90)">
    <path d="M0 0 L2 5 L7 7 L2 9 L0 14 L-2 9 L-7 7 L-2 5 Z" fill="#fbbf24" opacity="0.9" />
  </g>
  <g transform="translate(65, 70)">
    <path d="M0 0 L1.5 3.5 L5 5 L1.5 6.5 L0 10 L-1.5 6.5 L-5 5 L-1.5 3.5 Z" fill="#38bdf8" opacity="0.8" />
  </g>
  <g transform="translate(155, 130)">
    <path d="M0 0 L1 3 L4 4 L1 5 L0 8 L-1 5 L-4 4 L-1 3 Z" fill="#10b981" opacity="0.7" />
  </g>

  <!-- Ambient rim light on top border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />
</svg>