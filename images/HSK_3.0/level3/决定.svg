<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Cityscape Glow Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <linearGradient id="deskLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ==================== ENVIRONMENT / BACKGROUND ==================== -->
  
  <!-- Wall shelf with books and globe -->
  <rect x="25" y="45" width="70" height="4" rx="2" fill="#475569"/>
  <!-- Globe -->
  <circle cx="45" cy="33" r="10" fill="#38bdf8" opacity="0.8"/>
  <path d="M 38 30 Q 45 25 52 30 Q 48 40 40 38 Z" fill="#10b981" opacity="0.7"/>
  <path d="M 40 23 L 40 43 M 35 43 L 45 43" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Books on shelf -->
  <rect x="62" y="27" width="6" height="18" rx="1" fill="#ec4899"/>
  <rect x="69" y="25" width="8" height="20" rx="1" fill="#f59e0b"/>
  <rect x="78" y="28" width="5" height="17" rx="1" fill="#38bdf8"/>

  <!-- Window to the world (Symbolizing China/Travel horizon) -->
  <g transform="translate(145, 20)">
    <rect x="0" y="0" width="75" height="95" rx="8" fill="url(#windowGlow)" stroke="#475569" stroke-width="3"/>
    <!-- Window pane grid -->
    <line x1="37.5" y1="0" x2="37.5" y2="95" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="47.5" x2="75" y2="47.5" stroke="#475569" stroke-width="2"/>
    <!-- Stylized landmark silhouette (Traditional pagoda roof line) inside window -->
    <path d="M 20 75 L 37.5 60 L 55 75 L 50 85 L 25 85 Z" fill="#1e1b4b" opacity="0.6"/>
    <path d="M 27 65 L 37.5 55 L 48 65 Z" fill="#1e1b4b" opacity="0.8"/>
    <!-- Distant glowing moon/sun -->
    <circle cx="55" cy="25" r="8" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Potted Plant on Desk -->
  <g transform="translate(25, 115)">
    <path d="M 8 20 L 17 35 L 3 35 Z" fill="#cbd5e1"/>
    <ellipse cx="10" cy="35" rx="7" ry="2" fill="#94a3b8"/>
    <!-- Leaves -->
    <path d="M 10 20 Q 2 10 5 2 Q 12 10 10 20 Z" fill="#10b981"/>
    <path d="M 10 20 Q 18 8 22 2 Q 15 12 10 20 Z" fill="#34d399"/>
    <path d="M 10 20 Q 5 15 0 10 Q 7 15 10 20 Z" fill="#059669"/>
  </g>

  <!-- ==================== DESK & PROPS ==================== -->
  
  <!-- Wooden Desk Surface -->
  <rect x="15" y="150" width="210" height="75" rx="4" fill="#334155" filter="url(#shadow)"/>
  <rect x="15" y="150" width="210" height="8" rx="2" fill="#475569"/>

  <!-- Laptop / Planning Device -->
  <g transform="translate(75, 115)">
    <!-- Laptop Base -->
    <path d="M -10 37 L 60 37 L 50 45 L -20 45 Z" fill="#94a3b8"/>
    <rect x="-18" y="43" width="84" height="3" rx="1.5" fill="#cbd5e1"/>
    <!-- Laptop Screen -->
    <rect x="-15" y="2" width="60" height="36" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <!-- Screen Content: Flight/Acceptance Map interface -->
    <rect x="-10" y="6" width="50" height="28" rx="2" fill="url(#screenGlow)"/>
    <!-- Abstract map path & destination pin -->
    <path d="M -2 25 Q 10 10 25 12" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="3,3" fill="none" stroke-linecap="round"/>
    <circle cx="-2" cy="25" r="3" fill="#f43f5e"/>
    <circle cx="25" cy="12" r="4" fill="#fbbf24"/>
    <path d="M 25 8 C 23 8 22 10 25 14 C 28 10 27 8 25 8 Z" fill="#ef4444"/>
  </g>

  <!-- Passport & Admission / Visa Document with Stamp (Crucial Context for Studying Abroad) -->
  <g transform="translate(135, 130) rotate(-12)" filter="url(#shadow)">
    <!-- Passport / Folder cover -->
    <rect x="0" y="0" width="36" height="48" rx="3" fill="#1e3a8a"/>
    <rect x="4" y="6" width="28" height="36" rx="2" fill="#1d4ed8"/>
    <!-- Gold crest on passport -->
    <circle cx="18" cy="20" r="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="18" cy="20" r="2" fill="#fbbf24"/>

    <!-- Overlay Document (Letter of Acceptance / Visa) -->
    <g transform="translate(12, 10)">
      <rect x="0" y="0" width="34" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Text lines placeholder -->
      <rect x="4" y="6" width="20" height="3" rx="1" fill="#64748b"/>
      <rect x="4" y="12" width="26" height="2" rx="1" fill="#94a3b8"/>
      <rect x="4" y="17" width="18" height="2" rx="1" fill="#94a3b8"/>
      <!-- Official RED VISA / ACCEPTANCE STAMP (Decisive element) -->
      <circle cx="22" cy="28" r="9" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.85"/>
      <circle cx="22" cy="28" r="6" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.6"/>
      <path d="M 18 28 L 21 31 L 27 25" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(45, 135)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#f1f5f9"/>
    <path d="M 16 10 C 22 10 22 20 16 20" stroke="#f1f5f9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="8" cy="5" rx="8" ry="3" fill="#cbd5e1"/>
    <ellipse cx="8" cy="5" rx="6" ry="2" fill="#78350f"/>
    <!-- Steam -->
    <path d="M 5 -2 Q 8 -6 5 -10" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 11 -4 Q 8 -8 11 -12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- ==================== MAIN CHARACTER ==================== -->
  
  <g transform="translate(90, 75)">
    <!-- Body / Torso (Leaning forward, determined posture) -->
    <path d="M 15 45 C 5 45 -5 55 -10 75 L 45 75 C 42 60 30 45 15 45 Z" fill="url(#accentOrange)"/>
    
    <!-- Collar / Shirt Detail -->
    <path d="M 10 45 L 18 53 L 26 45 Z" fill="#ffffff"/>
    <path d="M 15 49 L 18 56 L 21 49 Z" fill="#e2e8f0"/>

    <!-- Arms resting on desk, hands clasped/decisive gesture -->
    <path d="M -5 55 C -15 60 -25 70 -30 75" stroke="url(#accentOrange)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 35 55 C 45 60 55 70 60 75" stroke="url(#accentOrange)" stroke-width="10" stroke-linecap="round" fill="none"/>
    
    <!-- Hands -->
    <circle cx="-32" cy="76" r="5" fill="#fbcfe8"/>
    <circle cx="62" cy="76" r="5" fill="#fbcfe8"/>

    <!-- Neck -->
    <rect x="12" y="32" width="12" height="15" rx="4" fill="#fbcfe8"/>

    <!-- Head & Hair (Expressive, confident young student) -->
    <g transform="translate(0, -5)">
      <!-- Hair Back -->
      <circle cx="18" cy="22" r="18" fill="#1e293b"/>

      <!-- Face Base -->
      <ellipse cx="18" cy="24" rx="15" ry="17" fill="#fbcfe8"/>

      <!-- Ears -->
      <circle cx="2.5" cy="25" r="3" fill="#fbcfe8"/>
      <circle cx="33.5" cy="25" r="3" fill="#fbcfe8"/>

      <!-- Hair Front / Bangs with dynamic sweep -->
      <path d="M 3 17 C 8 8 28 8 33 18 C 30 14 24 12 18 13 C 10 14 5 16 3 17 Z" fill="#1e293b"/>
      <path d="M 28 15 C 32 20 35 25 35 25 C 35 25 31 18 28 15 Z" fill="#1e293b"/>

      <!-- Facial Expression: Determined, focused, bright eyes -->
      <!-- Eyebrows sloped slightly upward/inward for resolute focus -->
      <path d="M 10 20 L 15 21.5" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 22 21.5 L 27 20" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Eyes (Wide, shining, expressive) -->
      <circle cx="12" cy="25" r="2.5" fill="#0f172a"/>
      <circle cx="24" cy="25" r="2.5" fill="#0f172a"/>
      <!-- Eye highlights -->
      <circle cx="11" cy="24" r="1" fill="#ffffff"/>
      <circle cx="23" cy="24" r="1" fill="#ffffff"/>

      <!-- Confident Smile / Smirk -->
      <path d="M 15 32 Q 18 35 21 32" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Rosy Cheeks -->
      <circle cx="9" cy="29" r="3" fill="#f43f5e" opacity="0.3"/>
      <circle cx="27" cy="29" r="3" fill="#f43f5e" opacity="0.3"/>
    </g>
  </g>

  <!-- ==================== FOREGROUND LIGHTING / VIGNETTE ==================== -->
  
  <!-- Desk lamp cone light illuminating the student and passport/laptop -->
  <path d="M 120 0 L 0 240 L 240 240 Z" fill="url(#deskLight)" style="mix-blend-mode: overlay; pointer-events: none;"/>
</svg>