<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Bus/Street Glow -->
    <linearGradient id="bus-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.4"/>
    </linearGradient>
    
    <!-- Path/Sidewalk Gradient -->
    <linearGradient id="sidewalk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- SCENE ENVIRONMENT: City Street & Bus Stop Background -->
  <!-- Distant buildings & night sky elements -->
  <g id="background-city" opacity="0.4">
    <rect x="20" y="60" width="30" height="90" fill="#334155" rx="2"/>
    <rect x="60" y="40" width="45" height="110" fill="#475569" rx="2"/>
    <rect x="180" y="50" width="40" height="100" fill="#334155" rx="2"/>
    <!-- Glowing windows -->
    <rect x="28" y="70" width="6" height="8" fill="#fbbf24" opacity="0.6"/>
    <rect x="38" y="70" width="6" height="8" fill="#fbbf24" opacity="0.6"/>
    <rect x="70" y="55" width="8" height="10" fill="#38bdf8" opacity="0.6"/>
    <rect x="85" y="75" width="8" height="10" fill="#fbbf24" opacity="0.6"/>
    <rect x="192" y="65" width="6" height="8" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Street Lamp -->
  <g id="street-lamp">
    <rect x="205" y="90" width="3" height="100" fill="#64748b"/>
    <path d="M 206 90 L 195 75 L 210 75 Z" fill="#64748b"/>
    <circle cx="197" cy="77" r="4" fill="#fbbf24" filter="url(#soft-shadow)"/>
    <path d="M 180 140 L 220 190 L 160 190 Z" fill="#fbbf24" opacity="0.08"/>
  </g>

  <!-- Sidewalk and Bus Stop Shelter -->
  <rect x="0" y="150" width="240" height="90" fill="url(#sidewalk-grad)"/>
  <line x1="0" y1="150" x2="240" y2="150" stroke="#475569" stroke-width="2"/>
  
  <!-- Bus Stop Sign -->
  <g id="bus-sign" transform="translate(18, 105)">
    <rect x="4" y="0" width="2" height="45" fill="#94a3b8"/>
    <rect x="0" y="-10" width="10" height="12" rx="2" fill="#3b82f6"/>
    <circle cx="5" cy="-4" r="3" fill="#ffffff"/>
  </g>

  <!-- OPTION A: BUS (Car/Vehicle context) on the road -->
  <g id="bus-illustration" transform="translate(20, 105)" filter="url(#soft-shadow)">
    <!-- Bus Body -->
    <rect x="0" y="10" width="75" height="35" rx="8" fill="#f59e0b"/>
    <!-- Bus Roof Accent -->
    <rect x="8" y="6" width="60" height="6" rx="3" fill="#d97706"/>
    <!-- Windows -->
    <rect x="8" y="14" width="14" height="14" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="26" y="14" width="14" height="14" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="44" y="14" width="14" height="14" rx="2" fill="#38bdf8" opacity="0.8"/>
    <!-- Door -->
    <path d="M 63 14 L 70 14 L 70 42 L 63 42 Z" fill="#d97706"/>
    <!-- Wheels -->
    <circle cx="18" cy="45" r="7" fill="#0f172a"/>
    <circle cx="18" cy="45" r="3" fill="#cbd5e1"/>
    <circle cx="58" cy="45" r="7" fill="#0f172a"/>
    <circle cx="58" cy="45" r="3" fill="#cbd5e1"/>
    <!-- Headlights & Glow -->
    <rect x="0" y="32" width="3" height="6" fill="#fef08a"/>
    <path d="M -15 30 L 0 32 L 0 40 L -15 45 Z" fill="url(#bus-glow)"/>
  </g>

  <!-- Divider / "OR" conceptual space (Visual breathing room) -->
  
  <!-- MAIN SUBJECT: Traveler making a choice (Walking / Pedestrian context) -->
  <g id="pedestrian-character" transform="translate(130, 100)" filter="url(#soft-shadow)">
    <!-- Shadow beneath character -->
    <ellipse cx="25" cy="93" rx="18" ry="5" fill="#0f172a" opacity="0.6"/>

    <!-- Walking Legs -->
    <!-- Back Leg -->
    <path d="M 18 55 L 10 75 L 5 78" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 5 78 L 2 80" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Front Leg -->
    <path d="M 32 55 L 42 74 L 46 80" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 46 80 L 52 82" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

    <!-- Torso / Jacket -->
    <path d="M 16 25 Q 16 20 25 20 Q 34 20 34 25 L 38 58 L 12 58 Z" fill="#10b981"/>
    <path d="M 25 20 L 25 58" stroke="#047857" stroke-width="2"/> <!-- Jacket zipper -->

    <!-- Backpack -->
    <path d="M 32 24 C 40 24 42 32 42 42 C 42 50 38 52 32 52 Z" fill="#ec4899"/>
    <path d="M 39 33 L 44 38" stroke="#be185d" stroke-width="3" stroke-linecap="round"/>

    <!-- Arms swinging (Walking motion) -->
    <!-- Back Arm -->
    <path d="M 18 30 L 8 42" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <circle cx="7" cy="44" r="3" fill="#f8fafc"/>
    
    <!-- Front Arm holding phone/map route -->
    <path d="M 32 30 L 45 40" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <circle cx="47" cy="41" r="3" fill="#f8fafc"/>
    <!-- Small directional map in hand -->
    <rect x="46" y="37" width="10" height="8" rx="1" fill="#f8fafc" transform="rotate(15 46 37)"/>
    <path d="M 48 40 L 51 39 L 53 42" stroke="#3b82f6" stroke-width="1.5" fill="none"/>

    <!-- Neck -->
    <rect x="22" y="15" width="6" height="6" fill="#f8fafc"/>

    <!-- Head & Face -->
    <circle cx="25" cy="8" r="11" fill="#f8fafc"/>
    <!-- Hair -->
    <path d="M 14 8 C 14 1 36 1 36 8 C 36 10 32 8 30 5 C 28 2 20 2 17 5 C 15 8 14 8 14 8 Z" fill="#334155"/>
    <!-- Face Profile / Expression (Happy / Deciding) -->
    <circle cx="29" cy="8" r="1.5" fill="#1e293b"/>
    <path d="M 28 12 Q 30 14 32 12" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Scarf for cozy outdoor look -->
    <path d="M 18 14 Q 25 18 32 14 L 33 19 Q 25 22 17 19 Z" fill="#f43f5e"/>
    <path d="M 28 18 L 30 28" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Environmental Accents: Pedestrian Crossing Lines on Road -->
  <g transform="translate(0, 165)" opacity="0.6">
    <rect x="80" y="0" width="8" height="60" fill="#ffffff" transform="skewX(-30)" />
    <rect x="95" y="0" width="8" height="60" fill="#ffffff" transform="skewX(-30)" />
    <rect x="110" y="0" width="8" height="60" fill="#ffffff" transform="skewX(-30)" />
  </g>

  <!-- Decorative Context Elements: City Foliage / Modern Planter -->
  <g id="street-planter" transform="translate(90, 140)">
    <rect x="0" y="0" width="22" height="25" rx="3" fill="#64748b"/>
    <ellipse cx="11" cy="-2" rx="14" ry="10" fill="#059669"/>
    <ellipse cx="6" cy="-8" rx="8" ry="7" fill="#10b981"/>
    <ellipse cx="16" cy="-8" rx="8" ry="7" fill="#34d399"/>
  </g>

  <!-- Subtle Directional Indicator (Choice concept) -->
  <g opacity="0.7">
    <path d="M 105 75 Q 112 65 120 75" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
    <polygon points="120,73 125,76 119,79" fill="#94a3b8"/>
  </g>
</svg>