<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="bananaBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="sliceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="120" cy="120" r="90" fill="url(#glowGrad)"/>

  <!-- Wooden Table Surface / Counter -->
  <path d="M 20 180 L 220 180 L 235 220 L 5 220 Z" fill="#334155" opacity="0.6"/>
  <path d="M 15 180 L 225 180 L 220 174 L 20 174 Z" fill="#475569"/>
  <rect x="20" y="180" width="200" height="35" fill="#1e293b" opacity="0.4"/>

  <!-- Action / Dynamic Speed Lines or Ambient Sparks -->
  <circle cx="60" cy="70" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="190" cy="90" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="170" cy="150" r="4" fill="#34d399" opacity="0.5"/>
  <path d="M 175 60 Q 185 55 190 45" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 50 140 Q 40 145 35 155" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- BACK BANANA (Bunch element) -->
  <path d="M 75 130 C 65 95, 90 70, 130 65 C 135 64, 138 70, 135 75 C 105 80, 85 105, 90 135 C 91 140, 77 138, 75 130 Z" fill="url(#bananaBackGrad)" filter="url(#softShadow)"/>

  <!-- MAIN BANANA (Curved, Action-Oriented) -->
  <g filter="url(#softShadow)">
    <!-- Main Body -->
    <path d="M 50 145 C 35 105, 70 65, 130 55 C 175 48, 200 70, 205 75 C 208 78, 205 85, 200 83 C 160 68, 120 72, 85 100 C 65 116, 58 135, 55 147 C 54 151, 48 150, 50 145 Z" fill="url(#bananaGrad)"/>
    
    <!-- Banana Ridges / Texture Lines -->
    <path d="M 72 110 C 95 90, 135 80, 175 75" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
    <path d="M 65 125 C 90 100, 135 90, 185 82" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.25"/>

    <!-- Stem (Top) -->
    <path d="M 205 75 C 212 77, 218 75, 222 70 C 220 66, 213 67, 205 72 Z" fill="#3f6212"/>
    <path d="M 202 77 C 205 79, 210 79, 213 75" stroke="#365314" stroke-width="1.5" fill="none"/>

    <!-- Blossom End (Bottom tip) -->
    <path d="M 50 145 C 49 148, 51 151, 54 150 C 53 148, 51 146, 50 145 Z" fill="#713f12"/>
  </g>

  <!-- PEEL STRIPS (Dynamic peeling effect) -->
  <!-- Peel Strip 1 (Drooping down) -->
  <path d="M 60 130 C 40 140, 30 170, 45 185 C 55 195, 75 185, 70 160 C 68 148, 65 138, 60 130 Z" fill="#facc15" filter="url(#softShadow)"/>
  <path d="M 60 130 C 40 140, 30 170, 45 185" stroke="#ca8a04" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Peel Strip 2 (Curling outward right) -->
  <path d="M 190 75 C 210 85, 225 110, 215 125 C 205 135, 190 120, 185 100 C 183 90, 186 82, 190 75 Z" fill="#fef08a" filter="url(#softShadow)"/>

  <!-- SLICED BANANA ROUNDS (Foreground action elements) -->
  <!-- Slice 1 -->
  <g transform="translate(60, 155) rotate(-15)" filter="url(#softShadow)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="url(#sliceGrad)" stroke="#ca8a04" stroke-width="1"/>
    <!-- Inner star/core -->
    <circle cx="0" cy="0" r="3.5" fill="#854d0e" opacity="0.7"/>
    <path d="M -2 0 L 2 0 M 0 -2 L 0 2" stroke="#fefce8" stroke-width="1.5"/>
  </g>

  <!-- Slice 2 -->
  <g transform="translate(100, 165) rotate(25)" filter="url(#softShadow)">
    <ellipse cx="0" cy="0" rx="15" ry="11" fill="url(#sliceGrad)" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#854d0e" opacity="0.7"/>
  </g>

  <!-- Cute Leaf Accent on Counter -->
  <path d="M 150 175 C 145 160, 160 150, 170 155 C 180 160, 175 175, 165 180 C 160 182, 153 180, 150 175 Z" fill="#10b981" filter="url(#softShadow)"/>
  <path d="M 152 173 C 158 168, 164 162, 168 158" stroke="#065f46" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Highlight Sparkles -->
  <g fill="#ffffff">
    <path d="M 120 45 Q 120 52 113 52 Q 120 52 120 59 Q 120 52 127 52 Q 120 52 120 45 Z" opacity="0.8"/>
    <path d="M 170 65 Q 170 69 166 69 Q 170 69 170 73 Q 170 69 174 69 Q 170 69 170 65 Z" opacity="0.6"/>
  </g>
</svg>