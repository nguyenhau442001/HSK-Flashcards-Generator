<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental context: Living room / Desk setting -->
  <!-- Wallpaper accent lines -->
  <path d="M0 60 L240 60" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />
  <path d="M0 120 L240 120" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />

  <!-- Window / Night cityscape in background -->
  <rect x="150" y="20" width="70" height="90" rx="8" fill="#090d16" stroke="#334155" stroke-width="2" />
  <rect x="158" y="30" width="22" height="35" rx="3" fill="#1e293b" opacity="0.6" />
  <rect x="190" y="30" width="22" height="35" rx="3" fill="#38bdf8" opacity="0.2" />
  <rect x="158" y="72" width="22" height="30" rx="3" fill="#f59e0b" opacity="0.3" />
  <rect x="190" y="72" width="22" height="30" rx="3" fill="#1e293b" opacity="0.6" />

  <!-- House plant -->
  <path d="M25 180 Q25 150 35 130 Q45 150 45 180 Z" fill="#10b981" />
  <path d="M15 165 Q25 145 20 125 Q35 145 35 165 Z" fill="#059669" />
  <path d="M35 170 Q45 145 55 135 Q50 160 45 170 Z" fill="#34d399" />
  <path d="M20 180 L50 180 L45 200 L25 200 Z" fill="#64748b" rx="4" />

  <!-- Desk Surface -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a" />
  <rect x="0" y="196" width="240" height="6" fill="#334155" />

  <!-- Warm ambient glow around character (feeling hot/thirsty) -->
  <circle cx="90" cy="110" r="80" fill="url(#glow)" />

  <!-- Character: Sitting at desk, showing thirst -->
  <!-- Chair back -->
  <rect x="55" y="100" width="12" height="100" rx="6" fill="#475569" />

  <!-- Character Body / Clothes (Orange/Amber accent for warmth/urgency) -->
  <path d="M65 150 Q90 140 115 150 L125 200 L55 200 Z" fill="#fb923c" />
  <path d="M90 145 L90 200" stroke="#ea580c" stroke-width="2" opacity="0.4" />

  <!-- Character Neck & Head -->
  <path d="M80 135 L100 135 L105 150 L75 150 Z" fill="#fed7aa" />
  <circle cx="90" cy="110" r="26" fill="#fed7aa" />

  <!-- Hair (Messy/Tired stylish cut) -->
  <path d="M64 110 C64 90 85 84 105 95 C112 99 116 106 116 112 C116 112 110 102 98 100 C86 98 72 104 64 110 Z" fill="#334155" />

  <!-- Face Expression: Thirsty, panting, exhausted -->
  <!-- Closed/Tired arched eyes -->
  <path d="M78 110 Q83 105 88 110" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M92 110 Q97 105 102 110" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Rosy flushed cheeks (heated from thirst) -->
  <circle cx="77" cy="118" r="4" fill="#f43f5e" opacity="0.4" />
  <circle cx="103" cy="118" r="4" fill="#f43f5e" opacity="0.4" />

  <!-- Open panting mouth -->
  <path d="M86 122 Q90 130 94 122 Z" fill="#991b1b" />

  <!-- Sweat drops (Classic thirst/exhaustion trope) -->
  <path d="M116 105 C116 105 120 112 120 115 C120 117 118 119 116 119 C114 119 112 117 112 115 C112 112 116 105 116 105 Z" fill="#38bdf8" opacity="0.9" />
  <path d="M70 95 C70 95 72 99 72 101 C72 102 71 103 70 103 C69 103 68 102 68 101 C68 99 70 95 70 95 Z" fill="#38bdf8" opacity="0.7" />

  <!-- Arms reaching eagerly towards water -->
  <path d="M75 155 Q100 155 120 170" stroke="#fed7aa" stroke-width="9" stroke-linecap="round" fill="none" />
  <path d="M105 152 Q120 162 132 173" stroke="#fb923c" stroke-width="10" stroke-linecap="round" fill="none" />

  <!-- HANDS & OBJECT: Desired Water Glass / Pitcher -->
  <!-- Glass of water on desk, glowing as the object of desire -->
  <g transform="translate(135, 150)">
    <!-- Glass drop shadow -->
    <ellipse cx="18" cy="50" rx="14" ry="4" fill="#000000" opacity="0.4" />
    
    <!-- Glass body -->
    <path d="M6 10 L10 50 C10 52 12 53 15 53 L21 53 C24 53 26 52 26 50 L30 10 Z" fill="#ffffff" opacity="0.15" stroke="#bae6fd" stroke-width="2" />
    
    <!-- Water inside -->
    <path d="M8 22 L11 49 C11 51 13 52 15 52 L21 52 C23 52 25 51 25 49 L28 22 Z" fill="url(#waterGrad)" />
    
    <!-- Water surface ellipse -->
    <ellipse cx="18" cy="22" rx="10" ry="3" fill="#38bdf8" />
    
    <!-- Ice cubes floating -->
    <rect x="13" y="24" width="6" height="6" rx="1" fill="#ffffff" opacity="0.7" transform="rotate(15 16 27)" />
    <rect x="19" y="28" width="5" height="5" rx="1" fill="#ffffff" opacity="0.6" transform="rotate(-10 21 30)" />

    <!-- Sparkle / Desire indicator around the glass -->
    <path d="M18 0 L18 6 M15 3 L21 3" stroke="#ffb703" stroke-width="2" stroke-linecap="round" />
    <path d="M32 15 L37 12" stroke="#ffb703" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Laptop / Desk clutter for context -->
  <path d="M150 195 L200 195 L205 199 L145 199 Z" fill="#64748b" rx="2" />
  <rect x="160" y="170" width="30" height="25" rx="2" fill="#334155" />
  <path d="M165 178 L185 178 M165 184 L180 184" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
</svg>