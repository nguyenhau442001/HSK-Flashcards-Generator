<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Warm Spotlight Gradient for Trust/Support Theme -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow for Catching Hand -->
    <radialGradient id="handGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light / Spotlight -->
  <circle cx="120" cy="110" r="100" fill="url(#spotlight)"/>

  <!-- ENVIRONMENT DETAILS: Room & Studio Props -->
  <!-- Window / Backdrop -->
  <g opacity="0.3">
    <rect x="30" y="40" width="60" height="70" rx="6" fill="#334155"/>
    <path d="M30 65 H90 M60 40 V110" stroke="#1e293b" stroke-width="2"/>
    <circle cx="200" cy="50" r="15" fill="#f59e0b" opacity="0.2"/>
    <!-- House Plants for warm context -->
    <path d="M25 190 Q25 170 35 150 Q45 170 45 190 Z" fill="#10b981" opacity="0.7"/>
    <path d="M35 190 Q30 160 20 145 Q35 155 35 190 Z" fill="#059669" opacity="0.6"/>
  </g>

  <!-- Stage / Floor -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#090d16"/>
  <ellipse cx="120" cy="200" rx="100" ry="12" fill="#1e293b" opacity="0.5"/>

  <!-- SCENE & SUBJECT: Acrobatic trust-fall / leaning catch representing 'tin tưởng' -->
  
  <!-- Back Character (The Supporter / Believer): Firm, steady stance -->
  <g id="supporter" filter="url(#softShadow)">
    <!-- Legs -->
    <path d="M100 200 L95 160 L105 145" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M130 200 L135 160 L125 145" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Torso -->
    <path d="M105 150 C105 130 135 130 135 150 L130 190 L105 190 Z" fill="#3b82f6"/>
    
    <!-- Head -->
    <circle cx="120" cy="115" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M106 112 C106 100 134 100 134 112 C134 118 127 114 120 114 C113 114 106 118 106 112 Z" fill="#1e293b"/>

    <!-- Arms reaching forward securely to catch -->
    <!-- Left Arm -->
    <path d="M115 135 C100 140 85 140 75 145" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
    <!-- Right Arm -->
    <path d="M125 135 C110 140 95 140 85 148" fill="none" stroke="#60a5fa" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Hands ready and open -->
    <circle cx="76" cy="146" r="6" fill="#fbcfe8"/>
    <circle cx="86" cy="149" r="6" fill="#fbcfe8"/>
  </g>

  <!-- ACTION GLOW BETWEEN THEM -->
  <circle cx="95" cy="135" r="30" fill="url(#handGlow)"/>

  <!-- Front Character (The Faller / The One Being Trusted): Leaning back with absolute confidence -->
  <g id="faller" filter="url(#softShadow)">
    <!-- Dynamic diagonal body pose representing total reliance -->
    
    <!-- Legs trailing back relaxed -->
    <path d="M150 120 L185 105 L210 95" fill="none" stroke="#ec4899" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Feet -->
    <path d="M210 95 L218 90" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>

    <!-- Torso leaning dramatically back -->
    <path d="M135 135 C150 120 170 110 185 100" fill="none" stroke="#f43f5e" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Head tilted back, smiling with eyes closed in complete trust -->
    <g transform="translate(130, 132)">
      <!-- Head Circle -->
      <circle cx="0" cy="0" r="13" fill="#fed7aa"/>
      <!-- Hair -->
      <path d="M-13 -4 C-10 -15 10 -15 13 -4 C8 -8 -8 -8 -13 -4 Z" fill="#78350f"/>
      <!-- Happy/Trusting Face Expressions (Arcs for closed happy eyes) -->
      <path d="M-6 -2 Q-3 -5 0 -2" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <path d="M3 -2 Q6 -5 9 -2" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 4 Q2 7 4 4" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Arms outstretched wide, expressing freedom and total reliance -->
    <!-- Back Arm -->
    <path d="M155 115 C175 100 195 90 205 80" fill="none" stroke="#fb7185" stroke-width="8" stroke-linecap="round"/>
    <!-- Front Arm -->
    <path d="M145 125 C165 110 185 100 195 90" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="206" cy="79" r="5" fill="#fed7aa"/>
    <circle cx="196" cy="89" r="5" fill="#fed7aa"/>
  </g>

  <!-- FOREGROUND PROPS & DETAILS: Enhancing Depth -->
  <!-- Small floating sparkles / energy of trust and connection -->
  <g fill="#fbbf24">
    <circle cx="95" cy="110" r="2" opacity="0.8"/>
    <circle cx="115" cy="90" r="3" opacity="0.9"/>
    <circle cx="140" cy="80" r="1.5" opacity="0.7"/>
    <path d="M125 100 L127 105 L132 107 L127 109 L125 114 L123 109 L118 107 L123 105 Z" fill="#38bdf8" opacity="0.6" transform="scale(0.6) translate(80, 50)"/>
    <path d="M75 125 L76 128 L79 129 L76 130 L75 133 L74 130 L71 129 L74 128 Z" fill="#fbbf24" opacity="0.8" transform="scale(0.8) translate(10, 10)"/>
  </g>

  <!-- Foreground plant silhouette for framing the scene -->
  <path d="M0 240 Q10 210 5 190 Q15 210 25 240 Z" fill="#0f172a" opacity="0.9"/>
  <path d="M225 240 Q230 215 240 200 Q235 220 220 240 Z" fill="#0f172a" opacity="0.9"/>
</svg>