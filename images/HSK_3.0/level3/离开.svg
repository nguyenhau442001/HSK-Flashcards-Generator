<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and lighting effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm interior light gradient -->
    <linearGradient id="room-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Doorway/Exit light glow -->
    <linearGradient id="exit-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Character coat gradient -->
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Office desk glow -->
    <linearGradient id="desk-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ==================== OFFICE ENVIRONMENT ==================== -->
  <!-- Back wall -->
  <rect x="20" y="20" width="200" height="155" fill="url(#room-light)" rx="4"/>
  
  <!-- Office window with night cityscape outside -->
  <g id="window">
    <rect x="135" y="35" width="70" height="75" rx="2" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <!-- City lights outside -->
    <rect x="145" y="65" width="8" height="12" fill="#fbbf24" opacity="0.6"/>
    <rect x="157" y="55" width="6" height="22" fill="#38bdf8" opacity="0.5"/>
    <rect x="175" y="75" width="10" height="15" fill="#f43f5e" opacity="0.4"/>
    <rect x="190" y="50" width="7" height="30" fill="#fbbf24" opacity="0.7"/>
    <!-- Window frame inner grid -->
    <line x1="170" y1="35" x2="170" y2="110" stroke="#475569" stroke-width="2"/>
    <line x1="135" y1="72" x2="205" y2="72" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Office door frame (Right side exit) -->
  <path d="M 205 30 L 225 35 L 225 185 L 205 180 Z" fill="#0f172a" opacity="0.6"/>
  <rect x="195" y="30" width="30" height="155" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Exit light beam coming through open door -->
  <polygon points="195,40 240,25 240,175 195,170" fill="url(#exit-glow)"/>

  <!-- Office Desk (Left foreground) -->
  <g id="desk">
    <!-- Desk legs -->
    <rect x="35" y="130" width="6" height="45" fill="#334155"/>
    <rect x="95" y="130" width="6" height="45" fill="#334155"/>
    <!-- Desk surface -->
    <path d="M 25 120 L 115 120 L 120 132 L 20 132 Z" fill="#64748b"/>
    <!-- Desk props -->
    <!-- Computer monitor facing away/sideways -->
    <rect x="80" y="85" width="25" height="30" rx="2" fill="#334155"/>
    <path d="M 90 115 L 100 115 L 102 120 L 88 120 Z" fill="#475569"/>
    <!-- Desk lamp casting light -->
    <path d="M 35 120 L 40 95 L 45 95 L 50 120 Z" fill="#94a3b8"/>
    <path d="M 30 92 C 30 85 50 85 50 92 Z" fill="#fbbf24"/>
    <ellipse cx="40" cy="120" rx="15" ry="8" fill="url(#desk-glow)"/>
    <!-- Coffee mug and papers -->
    <rect x="60" y="110" width="8" height="10" rx="1" fill="#f8fafc"/>
    <rect x="68" y="113" width="3" height="5" rx="1" fill="#cbd5e1"/>
    <rect x="35" y="112" width="16" height="8" rx="1" fill="#cbd5e1" transform="rotate(-10 35 112)"/>
  </g>

  <!-- Office Chair pushed back (Empty - showing departure) -->
  <g id="empty-chair" transform="translate(65, 125)">
    <!-- Chair wheels -->
    <circle cx="5" cy="40" r="3" fill="#334155"/>
    <circle cx="25" cy="40" r="3" fill="#334155"/>
    <!-- Chair stem -->
    <rect x="13" y="25" width="4" height="15" fill="#475569"/>
    <!-- Seat angled out -->
    <rect x="2" y="20" width="26" height="6" rx="2" fill="#334155" transform="rotate(-15 15 23)"/>
    <!-- Backrest -->
    <rect x="2" y="-2" width="22" height="24" rx="3" fill="#475569" transform="rotate(-25 13 10)"/>
  </g>

  <!-- Plant in the corner for environmental richness -->
  <g id="plant" transform="translate(165, 125)">
    <path d="M 5 25 L 15 25 L 18 45 L 2 45 Z" fill="#cbd5e1"/>
    <path d="M 10 25 C 10 5 -5 0 -5 -10 C 5 -5 10 25 10 25 Z" fill="#10b981"/>
    <path d="M 10 25 C 15 -2 30 -5 32 -15 C 22 -2 10 25 10 25 Z" fill="#059669"/>
    <path d="M 10 25 C 5 10 15 0 20 -10 C 12 5 10 25 10 25 Z" fill="#34d399"/>
  </g>

  <!-- Floor -->
  <polygon points="0,175 240,175 240,240 0,240" fill="#0f172a"/>
  <!-- Floor perspective lines -->
  <line x1="0" y1="175" x2="0" y2="240" stroke="#1e293b" stroke-width="2"/>
  <line x1="240" y1="175" x2="240" y2="240" stroke="#1e293b" stroke-width="2"/>

  <!-- ==================== MAIN SUBJECT (LEAVING) ==================== -->
  <!-- Character walking towards the exit door (Right side) -->
  <g id="leaving-character" transform="translate(130, 95)">
    <!-- Shadow on floor -->
    <ellipse cx="25" cy="82" rx="18" ry="6" fill="#020617" opacity="0.6"/>

    <!-- Briefcase in hand (swinging back) -->
    <g transform="translate(-8, 45)">
      <rect x="-12" y="0" width="14" height="10" rx="2" fill="#7c2d12" transform="rotate(-20)"/>
      <path d="M -7 -3 C -7 -6 -3 -6 -3 -3" fill="none" stroke="#b45309" stroke-width="1.5"/>
    </g>

    <!-- Back leg (stepping forward/away) -->
    <g id="leg-back">
      <path d="M 15 45 L 28 68 L 35 72" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Shoe -->
      <ellipse cx="36" cy="73" rx="5" ry="3" fill="#0f172a"/>
    </g>

    <!-- Front leg (pushing off) -->
    <g id="leg-front">
      <path d="M 22 45 L 12 65 L 8 74" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Shoe -->
      <ellipse cx="7" cy="75" rx="5" ry="3" fill="#0f172a"/>
    </g>

    <!-- Torso (wearing professional jacket/coat, walking away towards right) -->
    <g id="torso">
      <path d="M 10 15 L 32 18 L 28 48 L 12 48 Z" fill="url(#coat-grad)" rx="4"/>
      <!-- Suit collar / shirt detail -->
      <path d="M 18 15 L 22 25 L 26 15" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    </g>

    <!-- Back Arm (swinging forward slightly) -->
    <g id="arm-back">
      <path d="M 14 20 L 5 35 L -2 42" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Hand -->
      <circle cx="-3" cy="44" r="3" fill="#fcd34d"/>
    </g>

    <!-- Front Arm (swinging back, holding briefcase strap or loose) -->
    <g id="arm-front">
      <path d="M 28 20 L 35 35 L 38 43" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Hand -->
      <circle cx="39" cy="45" r="3" fill="#fcd34d"/>
    </g>

    <!-- Head (turned slightly back or profile looking forward to exit) -->
    <g id="head" transform="translate(22, -2)">
      <!-- Hair -->
      <path d="M -5 5 C -5 -5 15 -5 16 5 C 16 8 10 10 5 10 Z" fill="#1e293b"/>
      <!-- Face profile -->
      <circle cx="6" cy="10" r="9" fill="#fcd34d"/>
      <!-- Ear -->
      <circle cx="-1" cy="10" r="2" fill="#f59e0b"/>
      <!-- Backpack strap over shoulder -->
      <path d="M 12 3 L 24 18" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== ATMOSPHERIC EFFECTS ==================== -->
  <!-- Motion / Action lines indicating departure motion -->
  <path d="M 175 110 L 190 110" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 180 125 L 200 125" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 170 140 L 185 140" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Warm rim light from exit hitting the character's back -->
  <path d="M 160 98 C 160 98 165 125 162 143" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7" filter="blur(1px)"/>
</svg>