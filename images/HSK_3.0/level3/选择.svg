<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Path Left (Option A) -->
    <linearGradient id="pathLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Path Right (Option B - Correct/Golden) -->
    <linearGradient id="pathRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Portal/Goal Glow -->
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit -->
    <linearGradient id="charSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric background details -->
  <circle cx="120" cy="70" r="90" fill="url(#portalGlow)"/>
  
  <!-- Distant ambient floating stars/sparkles -->
  <circle cx="60" cy="50" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="180" cy="40" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="200" cy="90" r="2.5" fill="#ec4899" opacity="0.5"/>
  <circle cx="40" cy="95" r="1.5" fill="#10b981" opacity="0.7"/>

  <!-- ENVIRONMENT: Crossroads Platform -->
  <g id="environment">
    <!-- Back wall/horizon -->
    <path d="M 20 150 L 120 110 L 220 150 L 220 220 L 20 220 Z" fill="url(#floorGrad)" opacity="0.5"/>

    <!-- Left Path (Secondary Choice) -->
    <path d="M 120 135 L 30 190 L 70 215 L 120 160 Z" fill="url(#pathLeft)" filter="url(#shadow)" opacity="0.85"/>
    <path d="M 50 201 L 45 204" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 80 188 L 75 191" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Path (Correct Choice - Glowing Golden) -->
    <path d="M 120 135 L 210 190 L 170 215 L 120 160 Z" fill="url(#pathRight)" filter="url(#shadow)"/>
    <path d="M 160 201 L 165 204" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 135 186 L 140 189" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Central Decision Pillar / Milestone Marker -->
    <path d="M 116 115 L 124 115 L 122 145 L 118 145 Z" fill="#64748b"/>
    <circle cx="120" cy="110" r="8" fill="#fbbf24" filter="url(#shadow)"/>
    
    <!-- Directional Floating Signs (Abstract shapes denoting direction, NO TEXT) -->
    <!-- Left sign (Blue arrow pointing left) -->
    <g transform="translate(65, 140) rotate(-15)" filter="url(#shadow)">
      <rect x="-16" y="-8" width="32" height="16" rx="4" fill="#0284c7"/>
      <path d="M -6 -3 L -12 0 L -6 3 Z" fill="#e0f2fe"/>
    </g>
    
    <!-- Right sign (Golden star/trophy pointing right - representing correct choice) -->
    <g transform="translate(175, 140) rotate(15)" filter="url(#shadow)">
      <rect x="-16" y="-8" width="32" height="16" rx="4" fill="#d97706"/>
      <path d="M 6 -3 L 12 0 L 6 3 Z" fill="#fef3c7"/>
      <!-- Glowing gem on sign -->
      <circle cx="0" cy="0" r="3" fill="#fef3c7"/>
    </g>
  </g>

  <!-- MAIN SUBJECT: Adventurous Character making a confident choice -->
  <g id="character" filter="url(#shadow)">
    <!-- Character Shadow on Ground -->
    <ellipse cx="120" cy="162" rx="14" ry="6" fill="#0f172a" opacity="0.6"/>

    <!-- Backpack -->
    <rect x="111" y="130" width="18" height="22" rx="6" fill="#f97316"/>
    <path d="M 115 130 Q 120 126 125 130" stroke="#c2410c" stroke-width="2" fill="none"/>

    <!-- Body/Torso -->
    <path d="M 110 135 L 130 135 L 134 158 L 106 158 Z" fill="url(#charSuit)"/>
    
    <!-- Belt -->
    <rect x="106" y="153" width="28" height="4" fill="#0f172a"/>
    <rect x="118" y="153" width="4" height="4" fill="#fbbf24"/>

    <!-- Legs (Stepping forward towards the right choice) -->
    <!-- Left leg (back) -->
    <line x1="113" y1="156" x2="108" y2="172" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
    <!-- Right leg (front, striding) -->
    <line x1="127" y1="156" x2="135" y2="171" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="106" cy="173" rx="5" ry="3" fill="#0f172a"/>
    <ellipse cx="137" cy="172" rx="5" ry="3" fill="#0f172a"/>

    <!-- Arms (Dynamic pose: pointing/reaching towards the right path) -->
    <!-- Left arm (back) -->
    <path d="M 110 138 L 98 146" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <!-- Right arm (reaching forward/deciding) -->
    <path d="M 130 138 L 145 132" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <circle cx="146" cy="131" r="3" fill="#fcd34d"/> <!-- Hand -->

    <!-- Head and Face -->
    <circle cx="120" cy="120" r="13" fill="#fde68a"/>
    
    <!-- Hair -->
    <path d="M 107 120 C 107 110, 115 106, 122 106 C 130 106, 133 112, 133 120 C 130 117, 125 115, 120 115 C 113 115, 110 117, 107 120 Z" fill="#b45309"/>
    
    <!-- Adventurer Hat / Cap -->
    <path d="M 105 114 Q 120 102 135 114 C 130 117, 110 117, 105 114 Z" fill="#38bdf8"/>
    <path d="M 115 110 L 125 110 L 123 107 L 117 107 Z" fill="#0284c7"/>

    <!-- Confident facial expression -->
    <!-- Eye (Happy/Determined arc) -->
    <path d="M 123 119 Q 126 117 128 119" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Smile -->
    <path d="M 123 124 Q 126 127 129 124" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheek -->
    <circle cx="130" cy="122" r="2" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- FOREGROUND ACCENTS & SPARKLES (Representing success of the "correct choice") -->
  <g id="sparkles">
    <!-- Golden correct choice indicator floating over the right path -->
    <g transform="translate(165, 160)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="12" fill="#fbbf24" opacity="0.9"/>
      <path d="M -4 0 L -1 3 L 5 -3" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Radiant light particles rising from the golden path -->
    <circle cx="150" cy="180" r="3" fill="#fef08a" opacity="0.9"/>
    <circle cx="180" cy="175" r="2" fill="#fde047" opacity="0.8"/>
    <circle cx="165" cy="195" r="1.5" fill="#fef08a" opacity="0.7"/>

    <!-- Small decorative crystal/gem on the ground representing the prize of making the right choice -->
    <polygon points="190,195 195,190 200,195 195,202" fill="#38bdf8" filter="url(#shadow)"/>
    <polygon points="195,190 197,195 195,202" fill="#7dd3fc"/>
  </g>

  <!-- Frame border subtle inner glow for polish -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>
</svg>