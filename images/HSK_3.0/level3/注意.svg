<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Headlight Beam Gradient -->
    <linearGradient id="headlight-beam" x1="0%" y1="50%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Streetlamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Danger/Caution Element Gradient -->
    <linearGradient id="caution-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Character Skin Shadow -->
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT: Night City Background -->
  <!-- Distant buildings & windows -->
  <rect x="15" y="60" width="35" height="180" fill="#1e293b" opacity="0.6"/>
  <rect x="22" y="70" width="6" height="8" fill="#334155"/>
  <rect x="34" y="70" width="6" height="8" fill="#38bdf8" opacity="0.4"/>
  <rect x="22" y="90" width="6" height="8" fill="#38bdf8" opacity="0.6"/>
  <rect x="34" y="90" width="6" height="8" fill="#334155"/>

  <rect x="190" y="45" width="45" height="195" fill="#1e293b" opacity="0.7"/>
  <rect x="200" y="60" width="8" height="10" fill="#fbbf24" opacity="0.5"/>
  <rect x="215" y="60" width="8" height="10" fill="#334155"/>
  <rect x="200" y="85" width="8" height="10" fill="#334155"/>
  <rect x="215" y="85" width="8" height="10" fill="#fbbf24" opacity="0.3"/>

  <!-- Streetlamp Pole & Light Source -->
  <rect x="195" y="20" width="4" height="200" fill="#334155"/>
  <path d="M 197 20 L 215 35 L 215 42 L 197 32 Z" fill="#475569"/>
  <circle cx="215" cy="38" r="4" fill="#fef08a"/>
  <!-- Ambient Street Light Glow -->
  <circle cx="215" cy="50" r="50" fill="url(#lamp-glow)" style="mix-blend-mode: screen;"/>

  <!-- Road Surface -->
  <path d="M 0 170 Q 120 160 240 175 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <!-- Road Markings (Dashed Line) -->
  <path d="M 0 205 Q 120 190 240 208" stroke="#334155" stroke-width="3" stroke-dasharray="10,8" fill="none"/>

  <!-- PROPS: Road Construction Barrier (Context for "Pay Attention!") -->
  <g transform="translate(165, 175)">
    <!-- Barrier Legs -->
    <path d="M 5 25 L 12 5 L 18 25 Z" fill="#64748b"/>
    <path d="M 32 25 L 38 5 L 44 25 Z" fill="#64748b"/>
    <!-- Striped Board -->
    <rect x="0" y="0" width="50" height="14" rx="3" fill="#cbd5e1"/>
    <!-- Stripes -->
    <path d="M 8 0 L 14 0 L 6 14 L 0 14 Z" fill="#ef4444"/>
    <path d="M 23 0 L 29 0 L 21 14 L 15 14 Z" fill="#ef4444"/>
    <path d="M 38 0 L 44 0 L 36 14 L 30 14 Z" fill="#ef4444"/>
  </g>

  <!-- MAIN SUBJECT: Scooter & Alert Driver -->
  <!-- Headlight Cone (Shining forward) -->
  <path d="M 85 155 L 200 120 L 200 190 Z" fill="url(#headlight-beam)" style="mix-blend-mode: screen;"/>

  <!-- Scooter Body -->
  <!-- Back Wheel -->
  <circle cx="75" cy="180" r="14" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <!-- Front Wheel -->
  <circle cx="135" cy="175" r="14" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  
  <!-- Scooter Chassis / Cowling -->
  <path d="M 65 170 Q 80 145 105 145 L 125 165 L 140 175 L 90 185 Z" fill="#38bdf8"/>
  <path d="M 105 145 L 125 165 L 115 170 L 95 155 Z" fill="#0284c7"/> <!-- Shadow panel -->
  <!-- Headlight on scooter -->
  <ellipse cx="132" cy="160" rx="4" ry="6" fill="#fef08a"/>

  <!-- Handlebars & Front Fork -->
  <path d="M 125 165 L 115 125" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 108 123 L 122 125" stroke="#334155" stroke-width="5" stroke-linecap="round"/>

  <!-- Character: Rider showing intense "Attention/Zhùyì" Action -->
  <!-- Body/Torso leaning forward alertly -->
  <path d="M 75 160 Q 85 130 100 120" stroke="#f43f5e" stroke-width="16" stroke-linecap="round" fill="none"/>
  
  <!-- Backpack -->
  <path d="M 65 130 Q 60 145 70 155 L 78 145 Z" fill="#fb923c" stroke="#c2410c" stroke-width="2" stroke-linejoin="round"/>

  <!-- Head with Wide-eyed Surprised/Alert Expression -->
  <g transform="translate(98, 105)">
    <!-- Helmet -->
    <path d="M -12 -5 Q 0 -18 14 -2 Q 15 8 8 10 L -10 10 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <!-- Helmet Strap -->
    <path d="M -10 6 Q 0 14 10 8" stroke="#b45309" stroke-width="2" fill="none"/>
    
    <!-- Face/Skin -->
    <circle cx="0" cy="4" r="10" fill="url(#skin-grad)"/>

    <!-- Wide Open Alert Eyes (Crucial for "Zhùyì" expression) -->
    <circle cx="3" cy="2" r="3" fill="#ffffff"/>
    <circle cx="4" cy="2" r="1.5" fill="#0f172a"/>
    <!-- Surprised Eyebrow raised high -->
    <path d="M -1 -3 Q 3 -7 7 -4" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Small determined/open mouth -->
    <ellipse cx="5" cy="9" rx="2" ry="1.5" fill="#991b1b"/>
  </g>

  <!-- Arms holding handlebars firmly -->
  <path d="M 90 125 L 110 123" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
  <circle cx="112" cy="123" r="4" fill="url(#skin-grad)"/>

  <!-- Legs in driving posture -->
  <path d="M 78 150 Q 85 165 75 175" stroke="#1e293b" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- FOREGROUND: Dynamic depth elements (floating hazard/exclamation dust particles, subtle glow) -->
  <circle cx="150" cy="140" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="160" cy="130" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="140" cy="135" r="1" fill="#ffffff" opacity="0.9"/>
  
  <!-- Speed lines / Motion blur accents behind scooter -->
  <path d="M 45 165 L 60 165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 40 175 L 55 175" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M 48 185 L 58 185" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Vignette / Border frame matching style guidelines -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>