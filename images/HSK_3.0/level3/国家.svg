<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Classroom / Study Room Environment (Rich Context) -->
  <!-- Back wall & Floor perspective -->
  <rect x="15" y="15" width="210" height="155" fill="url(#wallGrad)" rx="8"/>
  <!-- Floor -->
  <path d="M15 170 L225 170 L240 225 L0 225 Z" fill="#090d16"/>
  <line x1="15" y1="170" x2="225" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- Window with night city view -->
  <g opacity="0.6">
    <rect x="25" y="30" width="45" height="75" rx="4" fill="#0284c7" opacity="0.2"/>
    <rect x="28" y="33" width="18" height="34" fill="#38bdf8" opacity="0.15"/>
    <rect x="49" y="33" width="18" height="34" fill="#38bdf8" opacity="0.15"/>
    <rect x="28" y="70" width="18" height="32" fill="#38bdf8" opacity="0.15"/>
    <rect x="49" y="70" width="18" height="32" fill="#38bdf8" opacity="0.15"/>
    <!-- Window frame -->
    <rect x="23" y="28" width="49" height="79" rx="5" fill="none" stroke="#475569" stroke-width="3"/>
    <line x1="47" y1="28" x2="47" y2="107" stroke="#475569" stroke-width="2"/>
    <line x1="23" y1="68" x2="72" y2="68" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Bookshelf in background -->
  <g opacity="0.7">
    <rect x="175" y="35" width="35" height="120" fill="#334155" rx="3"/>
    <rect x="180" y="55" width="25" height="6" fill="#f59e0b"/>
    <rect x="182" y="75" width="20" height="6" fill="#10b981"/>
    <rect x="180" y="95" width="26" height="6" fill="#ec4899"/>
    <rect x="181" y="125" width="22" height="6" fill="#38bdf8"/>
    <line x1="175" y1="68" x2="210" y2="68" stroke="#1e293b" stroke-width="3"/>
    <line x1="175" y1="108" x2="210" y2="108" stroke="#1e293b" stroke-width="3"/>
  </g>

  <!-- Large World Map Poster on Wall (Depicting a large country/China shape concept) -->
  <g transform="translate(85, 25)">
    <!-- Map Frame -->
    <rect x="0" y="0" width="80" height="65" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="5" y="5" width="70" height="55" fill="#0f172a" rx="2"/>
    
    <!-- World Continents (Stylized background) -->
    <path d="M12 15 Q20 10 30 18 T45 15 T60 25 T70 20 L70 50 L12 50 Z" fill="#334155" opacity="0.5"/>
    
    <!-- Highlighted Large Country (China map silhouette simplified & enlarged) -->
    <path d="M28 22 Q38 18 52 24 Q65 28 62 42 Q48 48 35 42 Q25 38 28 22 Z" fill="url(#mapGrad)" filter="url(#glow)"/>
    <!-- Decorative star on the capital/map -->
    <polygon points="45,30 47,35 52,35 48,38 50,43 45,40 40,43 42,38 38,35 43,35" fill="#facc15"/>
    
    <!-- Magnifying glass overlay indicating "Large Country" focus -->
    <circle cx="45" cy="35" r="18" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
    <line x1="58" y1="48" x2="68" y2="58" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Teacher / Presenter Character -->
  <g transform="translate(110, 85)">
    <!-- Body / Torso -->
    <path d="M20 70 L40 70 L48 115 L12 115 Z" fill="#2563eb"/>
    <path d="M22 70 L38 70 L35 90 L25 90 Z" fill="#ffffff"/> <!-- Collar -->
    <polygon points="30,76 27,92 33,92" fill="#ef4444"/> <!-- Tie -->

    <!-- Head & Face -->
    <circle cx="30" cy="45" r="18" fill="#fde047"/>
    <!-- Friendly happy expression -->
    <path d="M22 42 Q30 48 38 42" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Smile -->
    <!-- Eyes -->
    <circle cx="24" cy="40" r="2" fill="#1e293b"/>
    <circle cx="36" cy="40" r="2" fill="#1e293b"/>
    <!-- Hair -->
    <path d="M14 42 Q15 25 30 25 Q45 25 46 42 Q40 32 30 32 Q20 32 14 42 Z" fill="#475569"/>

    <!-- Pointer arm pointing at the map -->
    <path d="M38 75 Q60 55 75 42" fill="none" stroke="#fde047" stroke-width="6" stroke-linecap="round"/>
    <!-- Pointer stick -->
    <path d="M72 45 L95 28" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Pointer tip -->
    <circle cx="95" cy="28" r="3" fill="#ef4444"/>

    <!-- Other arm resting on hip -->
    <path d="M20 75 Q8 85 15 100" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>

    <!-- Legs -->
    <rect x="18" y="112" width="7" height="30" fill="#0f172a"/>
    <rect x="35" y="112" width="7" height="30" fill="#0f172a"/>
    <!-- Shoes -->
    <ellipse cx="21" cy="143" rx="6" ry="3" fill="#334155"/>
    <ellipse cx="38" cy="143" rx="6" ry="3" fill="#334155"/>
  </g>

  <!-- Student Character (Listening/Learning attentively) -->
  <g transform="translate(35, 100)">
    <!-- Body -->
    <path d="M15 60 L35 60 L42 100 L8 100 Z" fill="#10b981"/>
    <circle cx="25" cy="38" r="15" fill="#fde047"/> <!-- Head -->
    <!-- Hair -->
    <path d="M13 36 Q15 22 25 22 Q35 22 37 36 Q32 28 25 28 Q18 28 13 36 Z" fill="#78350f"/>
    <!-- Face profile/eyes -->
    <circle cx="30" cy="36" r="1.5" fill="#1e293b"/>
    <path d="M26 44 Q30 48 33 44" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Arm holding a notebook -->
    <path d="M35 65 Q45 75 35 85" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <!-- Notebook props -->
    <rect x="30" y="75" width="22" height="16" rx="2" fill="#f8fafc" transform="rotate(15 30 75)"/>
    <line x1="34" y1="79" x2="46" y2="82" stroke="#94a3b8" stroke-width="1" transform="rotate(15 30 75)"/>
    <line x1="34" y1="83" x2="44" y2="86" stroke="#94a3b8" stroke-width="1" transform="rotate(15 30 75)"/>

    <!-- Legs -->
    <rect x="12" y="98" width="6" height="32" fill="#1e293b"/>
    <rect x="28" y="98" width="6" height="32" fill="#1e293b"/>
    <!-- Shoes -->
    <ellipse cx="15" cy="131" rx="5" ry="2.5" fill="#475569"/>
    <ellipse cx="31" cy="131" rx="5" ry="2.5" fill="#475569"/>
  </g>

  <!-- Foreground teacher's desk with globe and books -->
  <g transform="translate(60, 160)">
    <!-- Desk Surface -->
    <path d="M0 15 L140 15 L150 35 L-10 35 Z" fill="#3b82f6"/>
    <path d="M-10 35 L150 35 L150 42 L-10 42 Z" fill="#1d4ed8"/>
    <!-- Desk Legs -->
    <rect x="10" y="42" width="8" height="33" fill="#1e293b"/>
    <rect x="122" y="42" width="8" height="33" fill="#1e293b"/>

    <!-- Globe Prop (reinforcing "Country / World" theme) -->
    <g transform="translate(100, -18)">
      <!-- Stand -->
      <path d="M12 28 L20 28 L18 33 L14 33 Z" fill="#64748b"/>
      <path d="M16 12 L16 28" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
      <path d="M8 8 C8 22 24 22 24 8" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
      <!-- Sphere -->
      <circle cx="16" cy="12" r="14" fill="#0284c7"/>
      <!-- Continents on globe -->
      <path d="M10 8 Q14 5 18 10 Q20 15 15 18 Q10 16 10 8 Z" fill="#10b981" opacity="0.8"/>
      <path d="M18 12 Q22 14 20 20 Q16 22 18 12 Z" fill="#10b981" opacity="0.8"/>
      <!-- Gloss reflection -->
      <path d="M10 6 Q14 4 16 8 Q12 10 10 6 Z" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- Stack of books on desk -->
    <g transform="translate(20, -5)">
      <rect x="0" y="5" width="28" height="8" rx="2" fill="#ef4444"/>
      <rect x="-2" y="12" width="32" height="8" rx="2" fill="#f59e0b"/>
      <rect x="2" y="19" width="26" height="8" rx="2" fill="#8b5cf6"/>
    </g>
  </g>

  <!-- Ambient light warmth & polish -->
  <circle cx="130" cy="55" r="35" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>
</svg>