<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Stage Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Glow for Gift/Reception -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Confetti / Star Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Stage Elements & Ambient Confetti/Stars -->
  <g opacity="0.6">
    <circle cx="45" cy="50" r="1.5" fill="#38bdf8"/>
    <circle cx="195" cy="40" r="2" fill="#fbbf24"/>
    <circle cx="210" cy="110" r="1" fill="#f43f5e"/>
    <circle cx="30" cy="130" r="1.5" fill="#10b981"/>
    <!-- Floating Sparkles representing "reception/recognition" (受到) -->
    <path d="M 60,80 Q 65,70 75,75 Q 65,80 60,90 Q 55,80 45,75 Q 55,70 60,80" fill="#fbbf24" opacity="0.8"/>
    <path d="M 180,65 Q 183,58 190,61 Q 183,64 180,71 Q 177,64 170,61 Q 177,58 180,65" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Spotlight Cone -->
  <polygon points="120,-10 40,240 200,240" fill="#ffffff" opacity="0.03"/>

  <!-- SCENE ENVIRONMENT: Wooden Stage / Floor -->
  <path d="M 0,205 L 240,205 L 240,240 L 0,240 Z" fill="#090d16"/>
  <path d="M 0,205 L 240,205" stroke="#334155" stroke-width="2"/>
  <ellipse cx="120" cy="205" rx="90" ry="12" fill="#0284c7" opacity="0.15"/>

  <!-- MAIN CHARACTER: Joyful Receiver (representing 受到 - receiving applause/gifts/warmth) -->
  <g transform="translate(0, 10)">
    <!-- Character Shadow -->
    <ellipse cx="120" cy="197" rx="25" ry="6" fill="#000000" opacity="0.4"/>

    <!-- Body / Suit -->
    <path d="M 105,150 L 135,150 L 140,195 L 100,195 Z" fill="#0ea5e9"/>
    <!-- Collar / Shirt -->
    <polygon points="120,150 110,165 130,165" fill="#f8fafc"/>
    <!-- Red Bowtie (representing honor/celebration) -->
    <path d="M 115,162 L 125,162 L 120,168 Z" fill="#ef4444"/>
    <circle cx="120" cy="165" r="2" fill="#b91c1c"/>

    <!-- Left Arm (Waving / Receiving) -->
    <path d="M 106,155 Q 85,140 75,120" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
    <circle cx="73" cy="116" r="6" fill="#fcd34d"/>

    <!-- Right Arm (Raised joyfully) -->
    <path d="M 134,155 Q 155,140 165,125" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
    <circle cx="168" cy="121" r="6" fill="#fcd34d"/>

    <!-- Neck -->
    <rect x="114" y="140" width="12" height="15" fill="#fcd34d"/>

    <!-- Head & Hair -->
    <circle cx="120" cy="125" r="22" fill="#fcd34d"/>
    <!-- Hair style -->
    <path d="M 98,122 Q 102,100 120,102 Q 138,100 142,122 Q 135,110 120,110 Q 105,110 98,122 Z" fill="#334155"/>

    <!-- Face Expression: Eyes closed in pure joy/delight -->
    <path d="M 110,124 Q 114,120 118,124" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 122,124 Q 126,120 130,124" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="109" cy="130" r="4" fill="#f43f5e" opacity="0.4"/>
    <circle cx="131" cy="130" r="4" fill="#f43f5e" opacity="0.4"/>
    <!-- Big Happy Open Smile -->
    <path d="M 113,132 Q 120,140 127,132" fill="#1e293b"/>
    <path d="M 116,134 Q 120,138 124,134" fill="#f43f5e"/>
  </g>

  <!-- OBJECT RECEIVED: Glowing Award Trophy / Gift Package (Centerpiece of "receiving") -->
  <g transform="translate(0, -5)">
    <!-- Golden Aura Behind Trophy -->
    <circle cx="120" cy="90" r="35" fill="url(#goldGlow)"/>

    <!-- Floating Gift / Trophy Group -->
    <g transform="translate(0, -10)">
      <!-- Motion/Reception lines rising up -->
      <path d="M 100,120 Q 120,105 105,85" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path d="M 140,120 Q 120,105 135,85" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

      <!-- Trophy Base -->
      <path d="M 110,115 L 130,115 L 126,105 L 114,105 Z" fill="#d97706"/>
      <rect x="117" y="100" width="6" height="6" fill="#f59e0b"/>

      <!-- Trophy Cup -->
      <path d="M 108,70 Q 108,100 120,100 Q 132,100 132,70 Z" fill="#fbbf24"/>
      <!-- Trophy Rim -->
      <ellipse cx="120" cy="70" rx="12" ry="3" fill="#fde047"/>
      <ellipse cx="120" cy="70" rx="10" ry="2" fill="#fbbf24"/>

      <!-- Trophy Handles -->
      <path d="M 108,73 C 98,73 98,87 108,87" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <path d="M 132,73 C 142,73 142,87 132,87" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

      <!-- Star Emblem on Trophy -->
      <path d="M 120,77 L 122,82 L 127,82 L 123,85 L 125,90 L 120,87 L 115,90 L 117,85 L 113,82 L 118,82 Z" fill="#fef08a" filter="url(#glow)"/>
    </g>
  </g>

  <!-- FOREGROUND & ACCENT ELEMENTS: Confetti, Streamers, Applause symbols -->
  <!-- Falling Confetti Pieces -->
  <g transform="translate(0, 0)">
    <!-- Confetti 1 -->
    <rect x="50" y="90" width="6" height="4" rx="1" fill="#ec4899" transform="rotate(25, 53, 92)"/>
    <!-- Confetti 2 -->
    <rect x="185" y="105" width="8" height="4" rx="1" fill="#38bdf8" transform="rotate(-30, 189, 107)"/>
    <!-- Confetti 3 -->
    <rect x="70" y="160" width="5" height="5" rx="1" fill="#a855f7" transform="rotate(45, 72, 162)"/>
    <!-- Confetti 4 -->
    <rect x="165" y="150" width="6" height="6" rx="1" fill="#10b981" transform="rotate(15, 168, 153)"/>
    <!-- Confetti Ribbon Streamer Left -->
    <path d="M 35,50 Q 45,60 30,75 Q 15,90 25,105" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Confetti Ribbon Streamer Right -->
    <path d="M 205,60 Q 195,75 210,90 Q 225,105 215,120" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Sparkling Stars representing positive reception/warmth -->
  <g filter="url(#glow)">
    <path d="M 85,55 L 88,62 L 95,65 L 88,68 L 85,75 L 82,68 L 75,65 L 82,62 Z" fill="#fde047" transform="scale(0.7) translate(40, -10)"/>
    <path d="M 155,45 L 157,50 L 162,52 L 157,54 L 155,59 L 153,54 L 148,52 L 153,50 Z" fill="#67e8f9" transform="scale(0.8) translate(30, -5)"/>
  </g>
</svg>