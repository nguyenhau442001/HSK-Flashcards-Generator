<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm indoor glow -->
    <radialGradient id="indoor-glow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 (Waiting friend) shirt gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Arriving friend) jacket gradient -->
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Window night sky gradient -->
    <linearGradient id="night-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Lighting Effect -->
  <circle cx="160" cy="100" r="100" fill="url(#indoor-glow)" />

  <!-- === BACKGROUND & INTERIOR === -->
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#090d16" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />
  
  <!-- Back Wall Details / Wallpaper stripes -->
  <rect x="0" y="0" width="240" height="180" fill="#1e293b" />
  <path d="M0 0 L240 180 M240 0 L0 180" stroke="#1f2937" stroke-width="1" opacity="0.1" />

  <!-- Window Frame looking out to night city -->
  <g transform="translate(140, 30)">
    <rect x="0" y="0" width="70" height="110" rx="4" fill="url(#night-sky)" stroke="#334155" stroke-width="3" />
    <!-- City lights outside -->
    <circle cx="20" cy="70" r="2" fill="#fbbf24" opacity="0.8" />
    <circle cx="35" cy="85" r="1.5" fill="#38bdf8" opacity="0.7" />
    <circle cx="50" cy="65" r="2" fill="#f43f5e" opacity="0.8" />
    <path d="M10 110 L10 95 L30 90 L30 110 Z" fill="#0f172a" />
    <path d="M40 110 L40 85 L60 80 L60 110 Z" fill="#0f172a" />
    <!-- Window pane cross bars -->
    <line x1="35" y1="0" x2="35" y2="110" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="55" x2="70" y2="55" stroke="#334155" stroke-width="2" />
    <!-- Warm light spill on windowsill -->
    <path d="M -10 115 L 80 115 L 75 110 L -5 110 Z" fill="#f59e0b" opacity="0.2" />
  </g>

  <!-- Cozy Bookshelf on Left -->
  <g transform="translate(15, 45)">
    <rect x="0" y="0" width="40" height="135" fill="#0f172a" rx="2" stroke="#334155" stroke-width="1.5" />
    <!-- Shelves -->
    <line x1="0" y1="45" x2="40" y2="45" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="90" x2="40" y2="90" stroke="#334155" stroke-width="2" />
    
    <!-- Books -->
    <rect x="6" y="20" width="6" height="25" fill="#f43f5e" rx="1" />
    <rect x="13" y="17" width="8" height="28" fill="#38bdf8" rx="1" />
    <rect x="22" y="22" width="5" height="23" fill="#10b981" rx="1" />
    
    <rect x="5" y="60" width="7" height="30" fill="#fbbf24" rx="1" />
    <rect x="14" y="65" width="6" height="25" fill="#a855f7" rx="1" />

    <rect x="8" y="110" width="24" height="6" fill="#64748b" rx="1" />
    <circle cx="20" cy="100" r="8" fill="#10b981" />
  </g>

  <!-- Plant on Table / Side Desk -->
  <g transform="translate(65, 130)">
    <rect x="0" y="20" width="25" height="30" fill="#334155" rx="3" />
    <ellipse cx="12" cy="20" rx="13" ry="4" fill="#475569" />
    <!-- Leaves -->
    <path d="M 12 20 Q 5 0 -10 5" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 20 Q 20 -5 32 5" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 20 Q 12 -10 12 -15" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  </g>


  <!-- === CHARACTERS === -->

  <!-- CHARACTER 1: Sitting Person (Confident, smiling, pointing/gesturing naturally) -->
  <g transform="translate(90, 85)">
    <!-- Chair -->
    <rect x="10" y="55" width="35" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <line x1="15" y1="95" x2="15" y2="115" stroke="#334155" stroke-width="3" />
    <line x1="40" y1="95" x2="40" y2="115" stroke="#334155" stroke-width="3" />
    <path d="M 5 50 L 50 50 L 45 30 L 10 30 Z" fill="#1e293b" />

    <!-- Legs sitting -->
    <path d="M 15 85 L 0 95 L -5 110" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Body / Torso -->
    <path d="M 10 40 Q 25 35 40 40 L 45 85 L 10 85 Z" fill="url(#shirt-grad)" />

    <!-- Head & Hair -->
    <circle cx="26" cy="15" r="14" fill="#fde047" /> <!-- Skin tone base -->
    <path d="M 12 15 Q 12 -2 26 -2 Q 40 -2 40 15 Q 38 10 26 8 Q 14 10 12 15 Z" fill="#334155" /> <!-- Hair -->

    <!-- Facial Expression (Relaxed, confident smile) -->
    <circle cx="21" cy="14" r="1.5" fill="#0f172a" />
    <circle cx="31" cy="14" r="1.5" fill="#0f172a" />
    <!-- Confident curved smile -->
    <path d="M 23 19 Q 26 23 29 19" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <!-- Cheeks (Warm friendly tone) -->
    <circle cx="19" cy="17" r="2" fill="#f43f5e" opacity="0.4" />
    <circle cx="33" cy="17" r="2" fill="#f43f5e" opacity="0.4" />

    <!-- Arms: One resting, one gesturing confidently towards the door -->
    <!-- Back Arm -->
    <path d="M 15 45 L 5 65 L 15 70" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Arm gesturing ("Of course he'll come!") -->
    <path d="M 38 45 L 55 55 L 70 50" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="70" cy="50" r="3.5" fill="#fde047" />
  </g>


  <!-- CHARACTER 2: Arriving Person (Stepping in through the door / entering the scene) -->
  <g transform="translate(170, 75)">
    <!-- Motion lines suggesting he just arrived energetically -->
    <path d="M -15 30 L -5 30" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M -20 50 L -8 50" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M -12 70 L -2 70" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.4" />

    <!-- Dynamic Legs Walking In -->
    <!-- Back Leg (stepping forward) -->
    <path d="M 15 80 L 25 105 L 35 105" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Leg -->
    <path d="M 10 80 L -5 95 L -10 105" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Body / Torso in Jacket -->
    <path d="M 0 35 Q 15 30 25 35 L 20 80 L 0 80 Z" fill="url(#jacket-grad)" />
    <!-- Inner Shirt -->
    <path d="M 8 38 L 12 38 L 12 75 L 8 75 Z" fill="#f8fafc" />

    <!-- Head & Hair (Friendly, dynamic arrival) -->
    <circle cx="12" cy="15" r="13" fill="#fde047" />
    <path d="M -1 15 Q 2 -2 12 -2 Q 24 -2 25 10 Q 20 5 12 6 Q 2 8 -1 15 Z" fill="#0f172a" /> <!-- Dynamic messy hair -->

    <!-- Facial Expression (Happy, energetic, arriving right on time) -->
    <circle cx="16" cy="14" r="1.5" fill="#0f172a" />
    <!-- Happy open smile -->
    <path d="M 16 19 Q 19 22 22 18" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="20" cy="16" r="2" fill="#f43f5e" opacity="0.5" />

    <!-- Arms (Holding a bag / greeting gesture) -->
    <!-- Back Arm waving -->
    <path d="M 5 40 L -8 30 L -15 35" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-15" cy="35" r="3" fill="#fde047" />
    <!-- Front Arm holding a gift box / shopping bag -->
    <path d="M 20 40 L 32 55 L 25 65" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Small prop: Gift / Item brought along -->
    <rect x="22" y="60" width="14" height="15" rx="2" fill="#10b981" />
    <line x1="22" y1="65" x2="36" y2="65" stroke="#fde047" stroke-width="2" />
    <line x1="29" y1="60" x2="29" y2="75" stroke="#fde047" stroke-width="2" />
  </g>

  <!-- Foreground Coffee Table with mugs -->
  <g transform="translate(85, 155)">
    <ellipse cx="35" cy="15" rx="45" ry="12" fill="#334155" />
    <rect x="-10" y="20" width="10" height="25" fill="#1e293b" rx="2" />
    <rect x="70" y="20" width="10" height="25" fill="#1e293b" rx="2" />
    <ellipse cx="35" cy="15" rx="42" ry="10" fill="#475569" />

    <!-- Coffee Mug 1 -->
    <rect x="15" y="8" width="10" height="12" rx="2" fill="#f8fafc" />
    <path d="M 25 10 C 28 10 28 16 25 16" fill="none" stroke="#f8fafc" stroke-width="1.5" />

    <!-- Coffee Mug 2 -->
    <rect x="45" y="6" width="10" height="12" rx="2" fill="#38bdf8" />
    <!-- Steam wisps -->
    <path d="M 50 3 Q 48 -2 52 -5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

</svg>