<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Party / Indoor Light -->
    <radialGradient id="partyGlow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Gradient (Standing out - sad/left out) -->
    <linearGradient id="lonelyGuy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Group Gradient (Happy crowd inside) -->
    <linearGradient id="groupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Window Light -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#partyGlow)" />

  <!-- ENVIRONMENT: Cozy Living Room / Party Interior -->
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#090d16" />
  <!-- Back Wall -->
  <rect x="0" y="30" width="240" height="150" fill="#1e293b" />
  
  <!-- Warm Wall Wallpaper Pattern / Accents -->
  <line x1="0" y1="30" x2="240" y2="30" stroke="#334155" stroke-width="4" />

  <!-- Cozy Window Showing Night/Outside (Where the lonely guy is) -->
  <rect x="25" y="55" width="60" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="4" />
  <rect x="31" y="61" width="48" height="83" rx="4" fill="url(#windowLight)" />
  <!-- Window Panes -->
  <line x1="55" y1="61" x2="55" y2="144" stroke="#334155" stroke-width="2" />
  <line x1="31" y1="102" x2="79" y2="102" stroke="#334155" stroke-width="2" />

  <!-- Hanging Party Lights / Bunting -->
  <path d="M90 35 Q135 60 180 35" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="110" cy="45" r="4" fill="#ec4899" />
  <circle cx="135" cy="50" r="4" fill="#38bdf8" />
  <circle cx="160" cy="45" r="4" fill="#10b981" />

  <!-- Indoor Furniture: Sofa / Party Table background -->
  <rect x="100" y="110" width="120" height="70" rx="12" fill="#334155" />
  <!-- Table Top -->
  <ellipse cx="160" cy="115" rx="55" ry="12" fill="#475569" />
  <!-- Cake / Treats on Table -->
  <path d="M145 105 L155 90 L165 105 Z" fill="#ec4899" />
  <circle cx="155" cy="88" r="2" fill="#fbbf24" />
  <rect x="175" y="100" width="12" height="15" rx="3" fill="#38bdf8" />
  <rect x="135" y="102" width="10" height="13" rx="3" fill="#fbbf24" />

  <!-- GROUP OF HAPPY PEOPLE (Inside, having fun, arms raised, chatting) -->
  <!-- Person A (Left inside) -->
  <g transform="translate(115, 95)" filter="url(#shadow)">
    <!-- Body -->
    <path d="M10 35 C10 25 25 25 25 35 L25 70 L5 70 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="17.5" cy="16" r="10" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M10 12 C10 7 25 7 25 12 Z" fill="#b45309" />
    <!-- Raised Arm cheering -->
    <path d="M5 30 L-2 15" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />
    <!-- Happy Smile -->
    <path d="M15 18 Q17.5 21 20 18" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Person B (Center inside) -->
  <g transform="translate(145, 90)" filter="url(#shadow)">
    <!-- Body -->
    <path d="M10 35 C10 25 30 25 30 35 L35 75 L5 75 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="20" cy="15" r="11" fill="#fbcfe8" />
    <!-- Hair -->
    <circle cx="20" cy="10" r="11" fill="#451a03" />
    <!-- Both arms up -->
    <path d="M10 30 L2 20" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round" />
    <path d="M30 30 L38 20" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round" />
    <!-- Happy Face -->
    <path d="M17 17 Q20 20 23 17" fill="none" stroke="#831843" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Person C (Right inside) -->
  <g transform="translate(180, 98)" filter="url(#shadow)">
    <!-- Body -->
    <path d="M10 35 C10 25 25 25 25 35 L25 70 L0 70 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="15" cy="15" r="10" fill="#fde047" />
    <!-- Hair -->
    <path d="M8 12 Q15 2 22 12 Z" fill="#713f12" />
    <!-- Arm waving -->
    <path d="M20 30 L28 20" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND & MAIN CHARACTER (外 - Except him / Outside looking in) -->
  <!-- Floor Shadow for Main Character -->
  <ellipse cx="65" cy="195" rx="22" ry="7" fill="#020617" opacity="0.6" />

  <g transform="translate(45, 115)" filter="url(#shadow)">
    <!-- Main Character Body (Slouched, isolated, holding a gift or hands in pockets) -->
    <path d="M12 35 C8 25 28 25 24 35 L32 80 C32 83 28 85 24 85 L16 85 C12 85 8 83 8 80 Z" fill="url(#lonelyGuy)" />
    
    <!-- Backpack -->
    <rect x="25" y="42" width="10" height="25" rx="3" fill="#ea580c" />

    <!-- Head (Slightly tilted down in disappointment) -->
    <circle cx="18" cy="18" r="12" fill="#fde68a" />
    
    <!-- Hair (Messy/Thoughtful) -->
    <path d="M8 14 C8 6 28 6 28 14 C28 16 26 13 24 12 C22 11 14 11 12 12 C10 13 8 16 8 14 Z" fill="#78350f" />

    <!-- Sad / Pensive Face Expressions -->
    <!-- Droopy Eyebrows -->
    <line x1="13" y1="16" x2="16" y2="18" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <line x1="20" y1="18" x2="23" y2="16" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <!-- Neutral / Sad Mouth -->
    <path d="M15 24 Q18 22 21 24" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms (Hands tucked or holding an invitation letter) -->
    <path d="M10 40 L4 55" stroke="#f97316" stroke-width="5" stroke-linecap="round" />
    <path d="M26 40 L32 55" stroke="#f97316" stroke-width="5" stroke-linecap="round" />
    <!-- Holding a small yellow envelope/ticket (wrong day/wrong time) -->
    <rect x="28" y="52" width="10" height="8" rx="1" fill="#fef08a" transform="rotate(15 33 56)" />

    <!-- Legs -->
    <path d="M14 85 L12 115" stroke="#c2410c" stroke-width="6" stroke-linecap="round" />
    <path d="M22 85 L24 115" stroke="#c2410c" stroke-width="6" stroke-linecap="round" />
    <!-- Shoes -->
    <ellipse cx="10" cy="116" rx="5" ry="3" fill="#0f172a" />
    <ellipse cx="26" cy="116" rx="5" ry="3" fill="#0f172a" />
  </g>

  <!-- Architectural Frame / Wall Divider (Foreground framing) -->
  <path d="M0 0 L0 240 L240 240 L240 0 Z" fill="none" stroke="#0f172a" stroke-width="8" />
</svg>