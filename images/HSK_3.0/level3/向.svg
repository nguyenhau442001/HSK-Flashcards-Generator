<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Street/Path Gradient -->
    <linearGradient id="street-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter for Lights & Directional Arrow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements (City Buildings) -->
  <g opacity="0.3">
    <rect x="20" y="60" width="35" height="120" rx="4" fill="#475569" />
    <rect x="65" y="40" width="45" height="140" rx="4" fill="#64748b" />
    <rect x="180" y="80" width="40" height="100" rx="4" fill="#475569" />
    <!-- Building Windows -->
    <rect x="28" y="70" width="8" height="10" rx="2" fill="#94a3b8" />
    <rect x="41" y="70" width="8" height="10" rx="2" fill="#94a3b8" />
    <rect x="28" y="90" width="8" height="10" rx="2" fill="#94a3b8" />
    <rect x="41" y="90" width="8" height="10" rx="2" fill="#94a3b8" />
    
    <rect x="75" y="55" width="10" height="14" rx="2" fill="#fde047" />
    <rect x="91" y="55" width="10" height="14" rx="2" fill="#94a3b8" />
    <rect x="75" y="80" width="10" height="14" rx="2" fill="#94a3b8" />
    <rect x="91" y="80" width="10" height="14" rx="2" fill="#fde047" />
  </g>

  <!-- Ground / Street Intersection (Perspective) -->
  <path d="M 0 180 L 240 180 L 220 240 L 20 240 Z" fill="url(#street-grad)" />
  
  <!-- Street Markings / Crosswalk (Leading Left) -->
  <g fill="#94a3b8" opacity="0.8">
    <polygon points="115,185 125,185 120,235 110,235" />
    <polygon points="90,185 100,185 92,235 82,235" />
    <polygon points="140,185 150,185 148,235 138,235" />
  </g>

  <!-- Directional Ground Projector / Dynamic Beam (Representing '向' / 'Toward') -->
  <path d="M 120 130 L 40 190 L 110 190 Z" fill="#38bdf8" opacity="0.15" filter="url(#soft-glow)" />

  <!-- Directional Signpost and Street Light Pole -->
  <!-- Pole -->
  <rect x="114" y="70" width="12" height="115" rx="3" fill="#cbd5e1" />
  <rect x="111" y="175" width="18" height="10" rx="2" fill="#64748b" />

  <!-- Street Lamp Fixture (Top) -->
  <path d="M 104 70 L 126 70 L 132 58 L 108 58 Z" fill="#475569" />
  <circle cx="120" cy="64" r="6" fill="#fde047" filter="url(#glow)" />

  <!-- Signpost Arms (Pointing Left & Forward, emphasizing '向 - Facing/Toward') -->
  <!-- Left-pointing vibrant sign arm -->
  <g transform="translate(120, 95)">
    <!-- Main Sign Board -->
    <path d="M 0 -12 L -75 -12 C -80 -12 -80 -2 -75 -2 L 0 -2 Z" fill="#fbbf24" />
    <!-- Sign Board Border / Depth -->
    <path d="M 0 -2 L -75 -2 C -80 -2 -80 8 -75 8 L 0 8 Z" fill="#f59e0b" />
    <!-- Arrow Icon on Sign -->
    <path d="M -55 3 L -65 3 L -60 -2 M -65 3 L -60 8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Right-pointing secondary subtle sign arm -->
    <path d="M 0 16 L 45 16 C 50 16 50 26 45 26 L 0 26 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M 0 26 L 45 26 C 50 26 50 36 45 36 L 0 36 Z" fill="#0284c7" opacity="0.8" />
    <path d="M 25 31 L 33 31 L 29 27 M 33 31 L 29 35" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Main Animated Character / Guide turning/facing Left (Action: 'Xin hãy quay sang trái' / 'Turn Left') -->
  <g transform="translate(120, 140)">
    <!-- Character Shadow -->
    <ellipse cx="-5" cy="42" rx="18" ry="6" fill="#0f172a" opacity="0.6" />

    <!-- Body / Torso (Angled towards the left direction) -->
    <path d="M -15 15 C -22 15 -25 25 -22 38 L 12 38 C 15 25 12 15 5 15 Z" fill="#ec4899" />
    <path d="M -15 15 L 5 15 C 8 25 5 38 -2 38 C -10 38 -18 25 -15 15 Z" fill="#db2777" /> <!-- Jacket lapel/shade -->

    <!-- Backpack -->
    <rect x="6" y="16" width="10" height="20" rx="4" fill="#38bdf8" />

    <!-- Head (Turning Left with determination and focus) -->
    <g transform="translate(-5, -2)">
      <!-- Neck -->
      <rect x="-3" y="10" width="6" height="6" fill="#fbcfe8" />
      
      <!-- Head Base -->
      <circle cx="0" cy="0" r="14" fill="#fcd34d" />
      <circle cx="0" cy="0" r="14" fill="#fbbf24" clip-path="polygon(0 0, 14 0, 14 14, 0 14)" /> <!-- Head shade -->

      <!-- Hair Style (Stylized modern flat design) -->
      <path d="M -14 0 C -14 -10 -4 -16 6 -10 C 10 -8 13 -2 14 4 C 10 -4 2 -8 -8 -6 C -12 -5 -14 -2 -14 0 Z" fill="#1e293b" />

      <!-- Expressive Face (Looking Left) -->
      <!-- Eye -->
      <circle cx="-5" cy="-1" r="2" fill="#0f172a" />
      <!-- Eyebrow (focused) -->
      <path d="M -8 -6 L -3 -5" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
      <!-- Cheeks (Friendly blush) -->
      <circle cx="-6" cy="5" r="3" fill="#fb7185" opacity="0.6" />
      <!-- Confident Smile -->
      <path d="M -6 7 C -4 9 -2 9 0 7" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Arms (Gesturing / Pointing Left to emphasize direction) -->
    <!-- Left Arm reaching/pointing decisively toward the left -->
    <path d="M -18 18 C -26 22 -38 24 -42 22 C -45 20 -43 16 -38 17 C -32 18 -24 16 -20 14 Z" fill="#fcd34d" />
    <circle cx="-43" cy="21" r="3.5" fill="#fcd34d" /> <!-- Hand -->

    <!-- Right Arm -->
    <path d="M 8 18 C 12 22 16 26 14 30" stroke="#db2777" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="14" cy="30" r="3" fill="#fcd34d" />

    <!-- Legs (Walking / Stiding stance facing left) -->
    <!-- Back Leg -->
    <path d="M 2 36 L 8 50 C 9 52 7 54 5 54 C 3 54 1 52 0 50 L -4 40 Z" fill="#334155" />
    <!-- Front Leg (Stepping forward) -->
    <path d="M -12 36 L -20 48 C -22 50 -20 53 -18 54 C -16 54 -13 52 -11 49 L -5 38 Z" fill="#475569" />
    <!-- Shoes -->
    <ellipse cx="-21" cy="54" rx="5" ry="2.5" fill="#f8fafc" />
    <ellipse cx="6" cy="54" rx="5" ry="2.5" fill="#f8fafc" />
  </g>

  <!-- Floating Direction Indicator Highlights (Reinforcing the '向' / 'Toward' concept dynamically) -->
  <g filter="url(#glow)">
    <!-- Glowing directional chevron floating left -->
    <path d="M 65 110 L 50 120 L 65 130" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
    <path d="M 80 110 L 65 120 L 80 130" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5" />
    
    <!-- Sparkles / Atmosphere -->
    <circle cx="35" cy="95" r="2.5" fill="#fde047" />
    <circle cx="95" cy="145" r="2" fill="#38bdf8" />
    <circle cx="200" cy="120" r="3" fill="#ec4899" opacity="0.8" />
    <circle cx="160" cy="70" r="2" fill="#fde047" />
  </g>

  <!-- Foreground Atmospheric Plant/Bush (Adding depth and real-world framing) -->
  <g fill="#10b981" opacity="0.8">
    <circle cx="215" cy="225" r="25" fill="#047857" />
    <circle cx="195" cy="230" r="20" fill="#059669" />
    <circle cx="230" cy="235" r="15" fill="#34d399" />
  </g>
  <g fill="#065f46" opacity="0.9">
    <circle cx="10" cy="230" r="22" />
    <circle cx="25" cy="240" r="18" />
  </g>
</svg>