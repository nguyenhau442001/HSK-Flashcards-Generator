<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed container with gradient background -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Scene elements: High counter -->
  <rect x="0" y="140" width="240" height="100" fill="#334155"/> <!-- Counter surface -->
  <rect x="0" y="135" width="240" height="10" fill="#475569"/> <!-- Counter edge highlight -->

  <!-- Object on counter: Cookie jar with glow -->
  <g filter="url(#glow)">
    <circle cx="150" cy="105" r="25" fill="#fbbf24"/> <!-- Jar body -->
    <rect x="130" y="75" width="40" height="20" rx="8" fill="#f59e0b"/> <!-- Jar lid -->
    <path d="M150 75 C160 65, 165 70, 150 70 C135 70, 140 65, 150 75Z" fill="#f59e0b"/> <!-- Jar handle/knob -->
  </g>
  <path d="M135 105 A25 25 0 0 1 165 105" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.7"/> <!-- Jar highlight -->


  <!-- Character: Short person reaching -->
  <!-- Body - dynamic pose, showing tiptoes -->
  <rect x="75" y="160" width="40" height="40" rx="15" fill="#38bdf8"/> <!-- Torso -->
  <!-- Legs/Feet on tiptoes -->
  <path d="M80 200 Q85 215, 85 220 L90 220 Q85 215, 80 200 Z" fill="#38bdf8"/> <!-- Left leg/foot -->
  <path d="M100 200 Q105 215, 105 220 L110 220 Q105 215, 100 200 Z" fill="#38bdf8"/> <!-- Right leg/foot -->

  <circle cx="95" cy="145" r="22" fill="#fbcfe8"/> <!-- Head (skin tone) -->

  <!-- Face - looking up, effort -->
  <circle cx="85" cy="140" r="3" fill="#1e293b"/> <!-- Left eye -->
  <circle cx="105" cy="140" r="3" fill="#1e293b"/> <!-- Right eye -->
  <path d="M90 150 Q95 153, 100 150" stroke="#1e293b" stroke-width="2" fill="none"/> <!-- Mouth (pursed lips in effort) -->
  <path d="M85 130 C80 125, 75 130, 80 135" fill="#1e293b"/> <!-- Left eyebrow (raised) -->
  <path d="M105 130 C110 125, 115 130, 110 135" fill="#1e293b"/> <!-- Right eyebrow (raised) -->

  <!-- Arms - one fully stretched, one bent for balance -->
  <path d="M95 160 Q115 105, 140 80" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round" fill="none"/> <!-- Right arm reaching up -->
  <circle cx="140" cy="80" r="10" fill="#fbcfe8"/> <!-- Right hand -->
  <path d="M95 160 Q85 170, 80 180" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round" fill="none"/> <!-- Left arm (bent, slightly down) -->
  <circle cx="80" cy="180" r="10" fill="#fbcfe8"/> <!-- Left hand -->

  <!-- Hair -->
  <path d="M75 120 C65 110, 70 100, 95 100 C120 100, 125 110, 115 120 Z" fill="#475569"/> <!-- Hair top -->

  <!-- Shadow under character -->
  <ellipse cx="95" cy="227" rx="25" ry="5" fill="#0f172a" opacity="0.5"/>

  <!-- Floor line for depth -->
  <rect x="0" y="227" width="240" height="13" fill="#0f172a"/>

</svg>