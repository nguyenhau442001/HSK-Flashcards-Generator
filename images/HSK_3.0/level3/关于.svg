<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Light Gradient -->
    <radialGradient id="lampLight" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Book Glow -->
    <radialGradient id="bookGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Layer -->
  <rect width="240" height="240" rx="24" fill="url(#lampLight)" />

  <!-- Background Environment: Cozy Study Room -->
  <g id="environment">
    <!-- Bookshelf & Books Background Elements -->
    <rect x="25" y="40" width="190" height="6" rx="3" fill="#334155" />
    <!-- Books on Shelf -->
    <path d="M35 25 h12 v15 h-12 z" fill="#ef4444" rx="1" />
    <path d="M50 22 h15 v18 h-15 z" fill="#3b82f6" rx="1" />
    <path d="M68 28 h10 v12 h-10 z" fill="#10b981" rx="1" />
    <path d="M175 24 h14 v16 h-14 z" fill="#8b5cf6" rx="1" />
    <path d="M192 20 h12 v20 h-12 z" fill="#f59e0b" rx="1" />

    <!-- Wall Art / History Scroll Silhouette -->
    <rect x="95" y="25" width="50" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Ancient Pyramid / Mountain Silhouette inside Art -->
    <path d="M105 50 L120 35 L140 50 Z" fill="#475569" />
    <circle cx="130" cy="38" r="4" fill="#fbbf24" />

    <!-- Window with Night Sky -->
    <path d="M185 70 h30 v60 h-30 z" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <circle cx="205" cy="85" r="3" fill="#e2e8f0" opacity="0.8" />
    <path d="M195 110 q5 -3 10 0" stroke="#64748b" stroke-width="2" fill="none" />
  </g>

  <!-- Desk Surface -->
  <path d="M10 180 L230 180 L240 220 L0 220 Z" fill="#0f172a" />
  <path d="M10 176 L230 176 L230 180 L10 180 Z" fill="#475569" />

  <!-- Desk Lamp -->
  <g id="desk-lamp">
    <path d="M195 180 L205 180 L202 120 L198 120 Z" fill="#64748b" />
    <path d="M185 110 C185 95 215 95 215 110 Z" fill="#f59e0b" />
    <path d="M190 110 L210 110 L205 125 L195 125 Z" fill="#d97706" />
  </g>

  <!-- Historical Artifacts/Props on Desk (Globe & Scroll) -->
  <g id="props">
    <!-- Globe -->
    <circle cx="45" cy="155" r="16" fill="#38bdf8" opacity="0.3" />
    <circle cx="45" cy="155" r="16" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M35 155 Q45 145 55 155 Q45 165 35 155" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <path d="M41 142 L49 168" stroke="#64748b" stroke-width="2" />
    <path d="M37 170 L53 170" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Ancient Scroll (History Theme) -->
    <path d="M75 165 C73 163 77 158 83 162 C89 165 91 170 89 172 Z" fill="#fbbf24" />
    <rect x="80" y="163" width="20" height="12" rx="2" fill="#fef3c7" transform="rotate(-10 90 170)" />
    <line x1="84" y1="167" x2="96" y2="165" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
    <line x1="83" y1="170" x2="94" y2="168" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Main Character (Student/Reader) -->
  <g id="character">
    <!-- Body / Torso -->
    <path d="M110 220 C110 190 120 175 140 175 C160 175 170 190 170 220 Z" fill="#3b82f6" />
    <path d="M125 175 L155 175 L160 195 L120 195 Z" fill="#1e40af" /> <!-- Collar/Shirt Accent -->

    <!-- Neck -->
    <rect x="133" y="155" width="14" height="25" fill="#f8fafc" />

    <!-- Head -->
    <circle cx="140" cy="135" r="24" fill="#fed7aa" />

    <!-- Hair -->
    <path d="M116 135 C116 115 130 110 145 112 C162 114 166 125 166 138 C166 138 155 120 135 122 C120 123 116 135 116 135 Z" fill="#334155" />

    <!-- Facial Expressions (Focused, Interested) -->
    <!-- Glasses -->
    <circle cx="132" cy="136" r="6" stroke="#475569" stroke-width="1.5" fill="none" />
    <circle cx="148" cy="136" r="6" stroke="#475569" stroke-width="1.5" fill="none" />
    <line x1="138" y1="136" x2="142" y2="136" stroke="#475569" stroke-width="1.5" />
    
    <!-- Eyes (Looking Down at Book) -->
    <circle cx="132" cy="138" r="1.5" fill="#0f172a" />
    <circle cx="148" cy="138" r="1.5" fill="#0f172a" />
    <!-- Gentle Smile -->
    <path d="M137 146 Q140 149 143 146" stroke="#9a3412" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Arms & Hands -->
    <!-- Left Arm holding book -->
    <path d="M120 185 C105 185 100 165 110 155 L125 165 Z" fill="#2563eb" />
    <circle cx="112" cy="155" r="6" fill="#fed7aa" />

    <!-- Right Arm holding book -->
    <path d="M160 185 C175 185 180 165 170 155 L155 165 Z" fill="#2563eb" />
    <circle cx="168" cy="155" r="6" fill="#fed7aa" />
  </g>

  <!-- Central Focus: The Open Book About History (Connecting to "关于历史的书") -->
  <g id="central-book">
    <!-- Book Glow Effect -->
    <circle cx="140" cy="165" r="45" fill="url(#bookGlow)" />

    <!-- Open Book Base -->
    <path d="M95 150 Q140 130 185 150 L185 185 Q140 165 95 185 Z" fill="#f8fafc" />
    
    <!-- Book Pages / Center Spine Shadow -->
    <path d="M140 133 L140 178" stroke="#cbd5e1" stroke-width="3" fill="none" />
    <path d="M95 150 Q140 165 185 150 L185 185 Q140 165 95 185 Z" fill="#f1f5f9" opacity="0.6" />

    <!-- Content / Illustrations inside the Book (History motifs: Pyramid & Crown/Shield) -->
    <!-- Left Page Content -->
    <line x1="105" y1="155" x2="128" y2="155" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="105" y1="163" x2="125" y2="163" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="105" y1="171" x2="120" y2="171" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Ancient Temple/Pyramid Miniature Graphic on Page -->
    <path d="M110 150 L115 142 L120 150 Z" fill="#f59e0b" />

    <!-- Right Page Content -->
    <line x1="152" y1="155" x2="175" y2="155" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="152" y1="163" x2="170" y2="163" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="152" y1="171" x2="172" y2="171" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Crown/Helmet Miniature Graphic on Page -->
    <path d="M160 148 L162 143 L164 148 L166 143 L168 148 Z" fill="#ef4444" />

    <!-- Book Cover Edge (Thickness) -->
    <path d="M95 185 Q140 165 185 185 L185 190 Q140 170 95 190 Z" fill="#b91c1c" />
  </g>

  <!-- Interactive/Magical Floating History Elements (Narrative Depth) -->
  <g id="floating-history-symbols" opacity="0.8">
    <!-- Star / Sparkle -->
    <path d="M75 115 Q75 105 85 105 Q75 105 75 95 Q75 105 65 105 Q75 105 75 115 Z" fill="#fbbf24" />
    <path d="M170 100 Q170 93 177 93 Q170 93 170 86 Q170 93 163 93 Q170 93 170 100 Z" fill="#38bdf8" />
    <!-- Small floating time gear / compass hint -->
    <circle cx="100" cy="110" r="8" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="3 2" />
    <circle cx="100" cy="110" r="2" fill="#38bdf8" />
  </g>
</svg>