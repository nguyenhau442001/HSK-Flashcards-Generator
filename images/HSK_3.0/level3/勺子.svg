<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Bowl Inner Shadow/Gradient -->
    <radialGradient id="bowlInterior" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Soup/Liquid Gradient -->
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Spoon Metal Gradient -->
    <linearGradient id="spoonMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Spoon Reflection -->
    <linearGradient id="spoonHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Ambient background glow elements -->
  <circle cx="120" cy="120" r="90" fill="url(#amberGlow)" />
  <circle cx="60" cy="70" r="30" fill="#38bdf8" opacity="0.05" />
  <circle cx="180" cy="160" r="40" fill="#ec4899" opacity="0.05" />

  <!-- Wooden Table Surface Line / Subtle Perspective -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.6" />

  <!-- SCENE: Dining Bowl containing food -->
  <g filter="url(#shadow)">
    <!-- Outer Rim of the Bowl -->
    <ellipse cx="120" cy="135" rx="85" ry="45" fill="#475569" />
    
    <!-- Bowl Body / Outer Surface -->
    <path d="M 35 135 C 35 175, 205 175, 205 135 C 205 155, 35 155, 35 135 Z" fill="#334155" />

    <!-- Bowl Interior -->
    <ellipse cx="120" cy="130" rx="77" ry="38" fill="url(#bowlInterior)" />

    <!-- Delicious Hot Soup / Broth inside the bowl -->
    <ellipse cx="120" cy="133" rx="70" ry="33" fill="url(#soupGrad)" />

    <!-- Soup highlights/texture -->
    <ellipse cx="100" cy="125" rx="40" ry="15" fill="#fcd34d" opacity="0.4" />
    
    <!-- Floating Delicacies (Carrot slices / garnish in soup) -->
    <circle cx="95" cy="140" r="6" fill="#fb923c" opacity="0.9" />
    <circle cx="140" cy="130" r="5" fill="#fb923c" opacity="0.9" />
    <path d="M 120 120 Q 123 123 120 126 Q 117 123 120 120 Z" fill="#10b981" />
    <path d="M 80 130 Q 82 132 80 134 Q 78 132 80 130 Z" fill="#10b981" />
  </g>

  <!-- Steam rising from the hot soup -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3">
    <path d="M 100 100 Q 95 80 105 60 Q 115 40 105 25" />
    <path d="M 130 105 Q 135 85 125 65 Q 115 45 125 30" />
  </g>

  <!-- ACTION-PACKED HERO SUBJECT: 勺子 (sháozi - The Spoon) -->
  <!-- The spoon is dynamically diving into the bowl, creating ripples -->
  <g filter="url(#shadow)">
    <!-- Ripple Effect under spoon -->
    <ellipse cx="120" cy="125" rx="25" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
    <ellipse cx="120" cy="125" rx="12" ry="5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" />

    <!-- Spoon Handle & Bowl Group (Rotated dynamically) -->
    <g transform="translate(120, 105) rotate(-35)">
      
      <!-- Spoon Handle -->
      <path d="M -6 10 L -3 75 C -3 82, 3 82, 3 75 L 6 10 Z" fill="url(#spoonMetal)" />
      <!-- Handle highlight -->
      <path d="M -1 15 L -1 70" stroke="url(#spoonHighlight)" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <!-- Spoon Bowl (The scoop part) -->
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="url(#spoonMetal)" />
      <!-- Spoon Interior Hollow -->
      <ellipse cx="0" cy="2" rx="12" ry="17" fill="#cbd5e1" />
      <ellipse cx="0" cy="3" rx="10" ry="15" fill="#94a3b8" opacity="0.5" />
      
      <!-- Spoon Gloss/Reflection -->
      <path d="M -6 -5 C -8 -2, -8 4, -4 8 C -6 2, -4 -2, -6 -5 Z" fill="#ffffff" opacity="0.7" />
    </g>
  </g>

  <!-- Action Sparkles / Flavor Notes -->
  <g>
    <!-- Top-left sparkle -->
    <path d="M 60 70 Q 60 80 50 80 Q 60 80 60 90 Q 60 80 70 80 Q 60 80 60 70 Z" fill="#38bdf8" filter="url(#glow)" opacity="0.8" />
    
    <!-- Top-right energetic star -->
    <path d="M 180 60 Q 180 72 168 72 Q 180 72 180 84 Q 180 72 192 72 Q 180 72 180 60 Z" fill="#fbbf24" filter="url(#glow)" opacity="0.9" />
    
    <!-- Small accent dots -->
    <circle cx="160" cy="95" r="3" fill="#ec4899" opacity="0.8" />
    <circle cx="75" cy="115" r="2.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="145" cy="65" r="2" fill="#10b981" opacity="0.8" />
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="45" cy="160" r="1.5" fill="#ffffff" opacity="0.4" />
  <circle cx="195" cy="130" r="2" fill="#ffffff" opacity="0.3" />
  <circle cx="110" cy="180" r="1" fill="#ffffff" opacity="0.5" />

</svg>