<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The "Idea" - A glowing lightbulb on a stand -->
  <g transform="translate(120, 120)">
    <!-- Stand -->
    <path d="M-10 60 L10 60 L5 20 L-5 20 Z" fill="#64748b"/>
    <circle cx="0" cy="20" r="5" fill="#475569"/>
    
    <!-- Bulb Glass -->
    <circle cx="0" cy="-20" r="35" fill="#1e293b" stroke="#fbbf24" stroke-width="4"/>
    
    <!-- Glowing Filament/Idea Spark -->
    <path d="M-10 -10 L10 -10 L0 -35 Z" fill="#fbbf24"/>
    <circle cx="0" cy="-20" r="10" fill="#f59e0b" opacity="0.6"/>
    
    <!-- Glow Effect -->
    <circle cx="0" cy="-20" r="45" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 8" opacity="0.4"/>
  </g>
  
  <!-- Supporting props: Notebook and Pen -->
  <rect x="40" y="190" width="60" height="40" rx="4" fill="#cbd5e1"/>
  <path d="M45 195 L95 195 M45 205 L95 205 M45 215 L95 215" stroke="#94a3b8" stroke-width="2"/>
  
  <rect x="160" y="195" width="40" height="8" rx="2" fill="#ec4899"/>
  <rect x="198" y="195" width="4" height="8" fill="#fb923c"/>
  
  <!-- "Very Good" indicator: Stars floating -->
  <path d="M180 60 L184 72 L196 72 L186 80 L190 92 L180 85 L170 92 L174 80 L164 72 L176 72 Z" fill="#10b981"/>
  <path d="M150 40 L152 46 L158 46 L153 50 L155 56 L150 53 L145 56 L147 50 L142 46 L148 46 Z" fill="#38bdf8"/>
</svg>