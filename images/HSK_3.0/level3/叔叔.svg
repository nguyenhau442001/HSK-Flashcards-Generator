<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Shanghai Skyline / Background Window Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>

    <!-- Uncle's Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Pearl Tower Accent -->
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- SCENE CONTEXT: Shanghai Apartment Interior with View -->
  <!-- Window Frame & View of Shanghai Skyline -->
  <g id="window-view">
    <!-- Outer Window Area -->
    <rect x="25" y="20" width="125" height="135" rx="4" fill="url(#nightSky)" stroke="#334155" stroke-width="3"/>
    
    <!-- Distant City Skyline Silhouettes -->
    <!-- Pudong Buildings -->
    <rect x="35" y="75" width="12" height="80" fill="#1e1b4b" opacity="0.8"/>
    <rect x="52" y="60" width="16" height="95" fill="#1e1b4b" opacity="0.9"/>
    <!-- Oriental Pearl Tower Silhouette stylized -->
    <circle cx="85" cy="70" r="5" fill="#f43f5e" opacity="0.6"/>
    <path d="M83,75 L87,75 L89,155 L81,155 Z" fill="#1e1b4b" opacity="0.9"/>
    <circle cx="85" cy="95" r="7" fill="#f43f5e" opacity="0.6"/>
    <circle cx="85" cy="120" r="4" fill="#f43f5e" opacity="0.6"/>
    
    <rect x="98" y="50" width="22" height="105" fill="#1e1b4b"/>
    <!-- Window Grid -->
    <line x1="87" y1="20" x2="87" y2="155" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="87" x2="150" y2="87" stroke="#334155" stroke-width="2"/>

    <!-- Warm Indoor Glow overlay -->
    <rect x="25" y="20" width="125" height="135" fill="url(#warmGlow)" pointer-events="none"/>
  </g>

  <!-- Interior Wall & Surface -->
  <!-- Bookshelf / Plant Prop on Left -->
  <path d="M15,100 L25,100 L25,155 L15,155 Z" fill="#334155"/>
  <circle cx="20" cy="93" r="8" fill="#10b981"/>
  <path d="M17,95 C17,91 23,91 23,95 Z" fill="#047857"/>

  <!-- Foreground Table / Desk -->
  <rect x="0" y="155" width="240" height="85" fill="#0f172a"/>
  <path d="M0,155 L240,155 L240,162 L0,162 Z" fill="#334155"/>
  
  <!-- Desk Props: Smartphone showing modern messaging / map, Coffee Cup -->
  <!-- Smartphone -->
  <rect x="160" y="170" width="30" height="48" rx="4" fill="#475569" filter="url(#dropShadow)"/>
  <rect x="163" y="174" width="24" height="36" rx="2" fill="#0f172a"/>
  <circle cx="175" cy="214" r="1.5" fill="#94a3b8"/>
  <path d="M167,184 L175,180 L183,184" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="175" cy="195" r="4" fill="#f59e0b"/>

  <!-- Ceramic Tea/Coffee Mug -->
  <path d="M198,178 C198,174 204,174 204,178 L204,202 C204,206 198,206 198,202 Z" fill="#f8fafc" filter="url(#dropShadow)"/>
  <path d="M204,182 C210,182 210,196 204,196" stroke="#f8fafc" stroke-width="3" fill="none"/>
  <path d="M200,182 L202,182" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round"/>

  <!-- MAIN SUBJECT: The Uncle (叔叔 - Shūshu) -->
  <!-- Friendly, energetic younger brother of dad, stylish middle-aged urbanite with friendly smile -->
  <g id="uncle-character" transform="translate(65, 55)" filter="url(#dropShadow)">
    
    <!-- Body & Shoulders -->
    <!-- Jacket / Outer layer -->
    <path d="M15,95 C15,75 35,65 55,65 C75,65 95,75 95,95 L105,125 L5,125 Z" fill="url(#jacketGrad)"/>
    
    <!-- Inner Shirt & Collar -->
    <path d="M35,65 L55,85 L75,65 L80,75 L55,95 L30,75 Z" fill="url(#shirtGrad)"/>
    <path d="M52,82 L58,82 L62,105 L48,105 Z" fill="#e0f2fe"/> <!-- Tie hint / accent -->

    <!-- Jacket lapels -->
    <path d="M35,65 L50,95 L30,125" fill="#0284c7" opacity="0.3"/>
    <path d="M75,65 L60,95 L80,125" fill="#0284c7" opacity="0.3"/>

    <!-- Neck -->
    <rect x="45" y="52" width="20" height="18" rx="6" fill="#fbcfe8"/>

    <!-- Head & Face Structure -->
    <path d="M32,30 C32,15 78,15 78,30 C78,50 72,60 55,60 C38,60 32,50 32,30 Z" fill="#fbcfe8"/>

    <!-- Ears -->
    <circle cx="30" cy="40" r="5" fill="#f472b6"/>
    <circle cx="80" cy="40" r="5" fill="#f472b6"/>

    <!-- Hair (Modern styled, neat, youthful uncle look with subtle warm dark brown) -->
    <path d="M32,32 C30,15 40,8 55,8 C72,8 80,16 80,32 C78,22 70,14 55,14 C40,14 34,22 32,32 Z" fill="#332924"/>
    <!-- Hair tuft/slick -->
    <path d="M50,10 C58,6 68,10 72,16 C65,13 55,13 50,10 Z" fill="#332924"/>

    <!-- Friendly Eyes & Expression -->
    <!-- Eyebrows (expressive, friendly) -->
    <path d="M38,32 C42,29 48,30 50,32" stroke="#332924" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M60,32 C62,30 68,29 72,32" stroke="#332924" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Friendly curved closed/happy or open bright) -->
    <circle cx="44" cy="38" r="3" fill="#1e293b"/>
    <circle cx="66" cy="38" r="3" fill="#1e293b"/>
    <!-- Eye highlights -->
    <circle cx="45" cy="37" r="1" fill="#ffffff"/>
    <circle cx="67" cy="37" r="1" fill="#ffffff"/>

    <!-- Warm Cheeks -->
    <circle cx="41" cy="44" r="5" fill="#f43f5e" opacity="0.25"/>
    <circle cx="69" cy="44" r="5" fill="#f43f5e" opacity="0.25"/>

    <!-- Friendly Smile -->
    <path d="M48,47 C52,52 58,52 62,47" stroke="#9f1239" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Gesturing Hands / Arms (Welcoming pose) -->
    <!-- Left arm raised waving -->
    <path d="M15,85 C5,70 10,50 20,45 C25,42 30,50 25,60 C20,70 18,80 25,95 Z" fill="url(#jacketGrad)"/>
    <!-- Left Hand -->
    <circle cx="20" cy="42" r="5" fill="#fbcfe8"/>

    <!-- Right arm relaxed -->
    <path d="M95,85 C105,95 100,115 90,120" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <circle cx="88" cy="122" r="5" fill="#fbcfe8"/>

  </g>

  <!-- Atmospheric Lighting & Polish -->
  <!-- Ambient rim light from window -->
  <path d="M140,20 L155,20 L155,155 L140,155 Z" fill="#38bdf8" opacity="0.15" pointer-events="none"/>
  
  <!-- Subtle App Vignette border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>