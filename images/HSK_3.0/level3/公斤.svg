<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background Elements -->
  <!-- Back Wall Accent / Window -->
  <rect x="140" y="30" width="70" height="90" rx="8" fill="#334155" opacity="0.4"/>
  <rect x="150" y="40" width="50" height="70" rx="4" fill="#1e293b" opacity="0.6"/>
  <!-- Shelf with items -->
  <rect x="20" y="50" width="90" height="6" rx="3" fill="#475569"/>
  <circle cx="40" cy="38" r="10" fill="#ec4899" opacity="0.8"/>
  <path d="M60 50 L60 30 L75 30 L75 50 Z" fill="#10b981" opacity="0.8"/>

  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="url(#floorGrad)" />
  <!-- Floor line perspective -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2"/>

  <!-- Character Shadow -->
  <ellipse cx="100" cy="185" rx="45" ry="10" fill="#000000" opacity="0.5"/>

  <!-- DIGITAL SCALE -->
  <g filter="url(#shadow)">
    <!-- Scale Platform -->
    <rect x="70" y="170" width="100" height="15" rx="4" fill="url(#scaleGrad)"/>
    <!-- Scale Display Screen (Showing "10.0" and unit symbol) -->
    <rect x="105" y="157" width="30" height="15" rx="3" fill="#0f172a"/>
    <rect x="109" y="161" width="8" height="7" rx="1" fill="#10b981"/>
    <rect x="119" y="161" width="8" height="7" rx="1" fill="#10b981"/>
    <!-- Screen decimal glowing dot -->
    <circle cx="129" cy="167" r="1" fill="#10b981"/>
  </g>

  <!-- HEAVY BOX (THE OBJECT = 10 KG) -->
  <g filter="url(#shadow)">
    <!-- Box Shadow on scale -->
    <ellipse cx="120" cy="158" rx="30" ry="6" fill="#000000" opacity="0.3"/>
    
    <!-- Box Front Face -->
    <polygon points="90,110 150,110 150,155 90,155" fill="url(#boxGrad)"/>
    <!-- Box Side Face (Right) -->
    <polygon points="150,110 170,100 170,145 150,155" fill="#b45309"/>
    <!-- Box Top Face -->
    <polygon points="90,110 110,100 170,100 150,110" fill="url(#boxTop)"/>
    
    <!-- Box Tape & Details -->
    <polygon points="117,100 123,100 123,155 117,155" fill="#fef3c7" opacity="0.3"/>
    <polygon points="150,125 170,115 170,122 150,132" fill="#fef3c7" opacity="0.3"/>
    <polygon points="90,125 110,115 110,122 90,132" fill="#fef3c7" opacity="0.3"/>
    
    <!-- Heavy Weight Icon/Badge on Box (Stylized abstract mass indicator, strictly no text) -->
    <circle cx="120" cy="132" r="10" fill="#fef3c7" opacity="0.2"/>
    <path d="M115 132 L125 132 M120 127 L120 137" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- CHARACTER: CURIOUS / SURPRISED MAN LIFTING OR WEIGHING THE BOX -->
  <g filter="url(#shadow)">
    <!-- Character Torso -->
    <path d="M 65 140 Q 65 110 85 105 L 105 105 Q 125 110 125 140 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt Detail -->
    <path d="M 85 105 L 95 115 L 105 105 Z" fill="#e2e8f0"/>

    <!-- Character Head & Face -->
    <circle cx="95" cy="80" r="18" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 77 80 Q 80 60 95 62 Q 112 60 113 80 Z" fill="#1e293b"/>
    <!-- Facial Expression (Surprised/Straining, brows furrowed, mouth open in "O") -->
    <circle cx="89" cy="78" r="1.5" fill="#1e293b"/>
    <circle cx="101" cy="78" r="1.5" fill="#1e293b"/>
    <path d="M 87 72 Q 89 70 91 72" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 99 72 Q 101 70 103 72" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="95" cy="85" rx="3" ry="4" fill="#1e293b"/>

    <!-- Sweat Drop (Indicating effort/heavy weight) -->
    <path d="M 116 75 C 116 75 119 80 119 82 A 1.5 1.5 0 0 1 113 82 C 113 80 116 75 116 75 Z" fill="#38bdf8"/>

    <!-- Arms Reaching Out to the Box -->
    <!-- Left Arm -->
    <path d="M 70 120 Q 80 135 95 130" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="95" cy="130" r="4" fill="#fed7aa"/>
    <!-- Right Arm -->
    <path d="M 120 120 Q 125 135 110 140" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="110" cy="140" r="4" fill="#fed7aa"/>

    <!-- Legs -->
    <path d="M 75 175 L 75 195" fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round"/>
    <path d="M 100 175 L 105 195" fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="73" cy="195" rx="6" ry="3" fill="#cbd5e1"/>
    <ellipse cx="107" cy="195" rx="6" ry="3" fill="#cbd5e1"/>
  </g>

  <!-- Visual Accent Particles / Highlights -->
  <circle cx="185" cy="80" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="50" cy="100" r="3" fill="#38bdf8" opacity="0.4"/>
  <circle cx="190" cy="150" r="1.5" fill="#10b981" opacity="0.5"/>
</svg>