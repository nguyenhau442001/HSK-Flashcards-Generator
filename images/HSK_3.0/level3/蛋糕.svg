<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" opacity="0.8"/>
  
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Environment: Cafe Table and Window -->
  <rect x="0" y="180" width="240" height="60" fill="#1e293b"/>
  <path d="M0 180 L240 180 L240 185 L0 185 Z" fill="#334155"/>
  
  <!-- Warm Lamp Light -->
  <circle cx="120" cy="40" r="80" fill="url(#lampGlow)"/>
  <path d="M110 0 L130 0 L125 30 L115 30 Z" fill="#475569"/>
  <path d="M100 30 Q120 25 140 30 L145 45 Q120 50 95 45 Z" fill="#f59e0b"/>

  <!-- Character: Expressing "Delicious" -->
  <g transform="translate(40, 100)">
    <!-- Body -->
    <path d="M10 140 Q10 80 50 80 Q90 80 90 140" fill="#0d9488"/>
    <!-- Head -->
    <circle cx="50" cy="55" r="28" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M22 55 Q22 25 50 25 Q78 25 78 55 L78 65 Q50 55 22 65 Z" fill="#334155"/>
    <!-- Face: Closed eyes and happy smile -->
    <path d="M38 55 Q42 52 46 55" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M54 55 Q58 52 62 55" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M45 68 Q50 74 55 68" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Blushed Cheeks -->
    <circle cx="35" cy="65" r="3" fill="#ec4899" opacity="0.4"/>
    <circle cx="65" cy="65" r="3" fill="#ec4899" opacity="0.4"/>
    <!-- Arm and Fork -->
    <path d="M85 110 Q105 100 110 85" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    <rect x="108" y="75" width="2" height="12" rx="1" fill="#94a3b8" transform="rotate(15, 110, 80)"/>
    <path d="M106 75 L112 75 M107 72 L107 76 M109 72 L109 76 M111 72 L111 76" stroke="#94a3b8" stroke-width="1" fill="none"/>
  </g>

  <!-- The Cake (蛋糕) -->
  <g transform="translate(145, 155)">
    <!-- Plate -->
    <ellipse cx="35" cy="35" rx="45" ry="12" fill="#cbd5e1"/>
    <ellipse cx="35" cy="32" rx="40" ry="10" fill="#f8fafc"/>
    
    <!-- Cake Slice -->
    <path d="M15 30 L55 30 L60 10 L25 5 Z" fill="#fdf2f8"/> <!-- Top surface -->
    <path d="M15 30 L15 50 Q35 55 55 50 L55 30 Z" fill="#f472b6"/> <!-- Front side -->
    <path d="M55 30 L55 50 L60 30 L60 10 Z" fill="#db2777"/> <!-- Right side -->
    
    <!-- Cream Layers -->
    <path d="M15 38 Q35 42 55 38" fill="none" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Strawberry Topping -->
    <path d="M35 15 Q40 5 45 15 Q40 20 35 15" fill="#ef4444"/>
    <circle cx="38" cy="12" r="0.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="42" cy="14" r="0.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Visual Cues for "Delicious" (Sparkles/Aroma) -->
  <g>
    <circle cx="185" cy="140" r="2" fill="#fbbf24">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="205" cy="155" r="1.5" fill="#fbbf24">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <path d="M170 130 Q175 120 170 110" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
    <path d="M180 125 Q185 115 180 105" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  </g>
</svg>