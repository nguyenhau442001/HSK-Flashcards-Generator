<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Airport/Travel Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Passport Cover Gradient -->
    <linearGradient id="passportCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Boarding Pass Gradient -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Airport Window / Arch showing stylized travel atmosphere -->
  <path d="M40 180 V90 C40 60, 60 40, 90 40 H150 C180 40, 200 60, 200 90 V180" fill="#1e293b" stroke="#334155" stroke-width="4" />
  
  <!-- Outside Travel Vibe (Night City/Lights) -->
  <g clip-path="url(#windowClip)">
    <circle cx="120" cy="70" r="12" fill="#fbbf24" opacity="0.8" /> <!-- Stylized Moon/Sun -->
    <path d="M70 180 L90 120 L110 180 Z" fill="#334155" opacity="0.5" />
    <path d="M120 180 L145 100 L170 180 Z" fill="#334155" opacity="0.7" />
    <!-- Airplane icon in sky -->
    <path d="M150 65 L160 62 L155 60 L156 55 L153 57 L147 60 Z" fill="#94a3b8" opacity="0.6" />
  </g>

  <!-- Counter Desk Surface -->
  <path d="M10 180 H230 V220 C230 231, 221 240, 210 240 H30 C18 240, 10 231, 10 220 Z" fill="#0f172a" />
  <path d="M10 180 H230 V188 H10 Z" fill="#38bdf8" opacity="0.3" /> <!-- Accent desk light strip -->

  <!-- TRAVELER CHARACTER -->
  <!-- Body/Shoulders -->
  <path d="M60 215 C60 190, 80 180, 105 180 C130 180, 150 190, 150 215" fill="#0ea5e9" />
  <!-- Scarf/Collar for travel look -->
  <path d="M80 185 C95 195, 115 195, 130 185 C125 200, 85 200, 80 185 Z" fill="#f43f5e" />

  <!-- Neck -->
  <rect x="92" y="160" width="26" height="25" fill="#fbcfe8" rx="6" />

  <!-- Head -->
  <circle cx="105" cy="135" r="28" fill="#fbcfe8" />

  <!-- Hair (Stylized modern traveler) -->
  <path d="M78 130 C76 110, 90 100, 110 102 C130 104, 135 120, 134 138 C125 130, 115 125, 100 128 C90 130, 82 132, 78 130 Z" fill="#334155" />

  <!-- Face features (Happy, excited for trip) -->
  <circle cx="97" cy="135" r="2.5" fill="#334155" />
  <circle cx="113" cy="135" r="2.5" fill="#334155" />
  <!-- Smile -->
  <path d="M102 143 Q105 147 108 143" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <!-- Cheeks -->
  <circle cx="94" cy="139" r="3" fill="#fda4af" opacity="0.6" />
  <circle cx="116" cy="139" r="3" fill="#fda4af" opacity="0.6" />

  <!-- ARMS & PASSPORT FOCUS (The Core Action) -->
  <!-- Left Arm holding passport -->
  <path d="M70 195 L95 165 L110 175 L85 210 Z" fill="#0284c7" />
  
  <!-- Hand supporting passport -->
  <circle cx="105" cy="168" r="8" fill="#fbcfe8" />

  <!-- PASSPORT (Hero Prop - Centrality) -->
  <g transform="translate(105, 130) rotate(-15)">
    <!-- Passport Book Shadow -->
    <rect x="-22" y="-30" width="44" height="60" rx="4" fill="#0f172a" opacity="0.4" />
    <!-- Passport Cover -->
    <rect x="-25" y="-33" width="44" height="60" rx="4" fill="url(#passportCover)" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Gold Emblem on Passport (Abstract globe/crest) -->
    <circle cx="-3" cy="-12" r="8" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="-3" cy="-12" r="3" fill="#fbbf24" />
    <!-- Passport decor lines -->
    <line x1="-15" y1="5" x2="9" y2="5" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-15" y1="12" x2="3" y2="12" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" />
    <!-- Ticket sticking out slightly -->
    <rect x="-8" y="-45" width="30" height="25" rx="2" fill="url(#ticketGrad)" />
    <circle cx="7" cy="-32" r="3" fill="#e2e8f0" />
    <line x1="-3" y1="-40" x2="3" y2="-40" stroke="#64748b" stroke-width="1" />
    <line x1="-3" y1="-36" x2="1" y2="-36" stroke="#64748b" stroke-width="1" />
  </g>

  <!-- Right Arm (pointing or holding luggage handle) -->
  <path d="M140 190 L160 160 L175 170 L155 210 Z" fill="#0ea5e9" />
  <circle cx="165" cy="155" r="7" fill="#fbcfe8" />

  <!-- FOREGROUND PROPS (Context: Travel Readiness) -->
  <!-- Suitcase edge visible on the right -->
  <g transform="translate(185, 150)">
    <rect x="0" y="0" width="35" height="60" rx="6" fill="#f97316" stroke="#ea580c" stroke-width="2" />
    <!-- Suitcase zipper line -->
    <line x1="0" y1="15" x2="35" y2="15" stroke="#c2410c" stroke-width="2" stroke-dasharray="3,3" />
    <!-- Handle attachment -->
    <rect x="12" y="-6" width="11" height="6" rx="2" fill="#334155" />
  </g>

  <!-- Travel coffee cup on counter (adds realism) -->
  <g transform="translate(35, 185)">
    <path d="M0 5 L5 35 H25 L30 5 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <ellipse cx="15" cy="5" rx="12.5" ry="3" fill="#cbd5e1" />
    <!-- Coffee liquid -->
    <ellipse cx="15" cy="6" rx="10" ry="2" fill="#78350f" />
    <!-- Sleeve -->
    <path d="M2 15 H28 V27 H2 Z" fill="#f43f5e" />
  </g>

  <!-- Floating Travel / Checkmark Sparkles (Success/Ready concept) -->
  <g transform="translate(160, 80)">
    <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.2" />
    <path d="M-5 -1 L-2 3 L6 -5" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g transform="translate(50, 95)">
    <circle cx="0" cy="0" r="10" fill="#fbbf24" opacity="0.2" />
    <path d="M-3 -1 L-1 2 L4 -3" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

</svg>