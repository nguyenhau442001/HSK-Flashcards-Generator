  <line x1="215" y1="115" x2="235" y2="105" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="177" y1="90" x2="177" y2="70" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
