  <rect x="57" y="45" width="18" height="28" rx="1" fill="#1e293b" opacity="0.5"/>
  <rect x="35" y="77" width="18" height="28" rx="1" fill="#1e293b" opacity="0.5"/>
  <rect x="57" y="77" width="18" height="28" rx="1" fill="#1e293b" opacity="0.5"/>
  <circle cx="45" cy="55" r="2" fill="#94a3b8" opacity="0.8"/>

  <!-- Floor -->
  <path d="M 0 200 Q 120 190 240 200 L 240 240 L 0 240 Z" fill="#0f172a"/>

  <!-- Furniture: Simple Sofa -->
  <path d="M 140 160 L 220 160 Q 230 160 230 170 L 230 200 L 130 200 L 130 170 Q 130 160 140 160" fill="#334155"/>
  <rect x="145" y="175" width="70" height="15" rx="4" fill="#475569"/>

