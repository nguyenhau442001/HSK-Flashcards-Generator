  <!-- Arm reaching for the switch -->
  <path d="M 95 155 L 125 145" stroke="#fdba74" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Wall Switch -->
  <rect x="128" y="138" width="12" height="18" rx="2" fill="#f8fafc"/>
  <rect x="132" y="142" width="4" height="6" rx="1" fill="#94a3b8"/>

