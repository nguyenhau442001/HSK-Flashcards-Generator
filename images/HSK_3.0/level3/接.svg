<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Airport Interior Light -->
    <linearGradient id="indoorLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Sign Glow Gradient -->
    <linearGradient id="signGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Airport Terminal Interior -->
  <!-- Large Airport Window Backdrop -->
  <path d="M20 30 L220 30 L220 180 L20 180 Z" fill="#1e293b"/>
  <!-- Window Glass Glow -->
  <path d="M25 35 L115 35 L115 175 L25 175 Z" fill="url(#indoorLight)"/>
  <path d="M125 35 L215 35 L215 175 L125 175 Z" fill="url(#indoorLight)"/>
  
  <!-- Window Frames & Supports -->
  <rect x="115" y="30" width="10" height="150" fill="#0f172a"/>
  <rect x="20" y="100" width="200" height="6" fill="#0f172a"/>
  
  <!-- Airplane outside in the night sky -->
  <g transform="translate(60, 65) scale(0.6)">
    <path d="M0 10 C15 5 35 2 50 0 C45 15 40 25 30 25 C20 25 10 20 0 10 Z" fill="#64748b"/>
    <circle cx="25" cy="12" r="2" fill="#38bdf8"/>
    <circle cx="33" cy="14" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Terminal Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0b0f19"/>
  <!-- Floor reflection lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2"/>
  <line x1="40" y1="240" x2="100" y2="180" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 8"/>
  <line x1="200" y1="240" x2="160" y2="180" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- Hanging Airport Departure/Arrival Signage -->
  <rect x="85" y="15" width="70" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <!-- Plane icon graphic inside sign -->
  <path d="M112 25 L120 21 L128 25 L124 25 L128 28 L122 28 L120 31 L118 28 L112 28 L116 25 Z" fill="#38bdf8" transform="scale(0.8) translate(35, 3)"/>
  <line x1="105" y1="5" x2="105" y2="15" stroke="#475569" stroke-width="1.5"/>
  <line x1="135" y1="5" x2="135" y2="15" stroke="#475569" stroke-width="1.5"/>

  <!-- CHARACTER 1: The Greeter (Waiting/Welcoming) -->
  <g id="greeter">
    <!-- Legs -->
    <rect x="75" y="145" width="8" height="40" rx="3" fill="#334155"/>
    <rect x="89" y="145" width="8" height="40" rx="3" fill="#334155"/>
    <!-- Shoes -->
    <path d="M70 183 C70 180 75 178 81 178 C85 178 85 183 85 185 Z" fill="#0f172a"/>
    <path d="M88 183 C88 180 94 178 100 178 C104 178 104 183 104 185 Z" fill="#0f172a"/>

    <!-- Torso (Jacket/Sweater) -->
    <path d="M72 105 L106 105 L110 148 L68 148 Z" fill="#10b981"/>
    <!-- Jacket collar -->
    <path d="M83 105 L89 120 L95 105 Z" fill="#065f46"/>

    <!-- Head & Hair -->
    <circle cx="89" cy="88" r="14" fill="#fbcfe8"/>
    <!-- Friendly Face Expression -->
    <circle cx="85" cy="87" r="1.5" fill="#1e293b"/>
    <circle cx="93" cy="87" r="1.5" fill="#1e293b"/>
    <path d="M86 92 Q89 95 92 92" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M75 85 C75 75 83 73 91 74 C99 75 103 82 103 88 C97 82 83 82 75 85 Z" fill="#334155"/>

    <!-- Left Arm holding Welcome Sign -->
    <path d="M72 110 L55 130 L65 140 L78 120 Z" fill="#059669"/>
    <!-- Right Arm waving/holding -->
    <path d="M106 110 L120 120 L115 130 L102 120 Z" fill="#059669"/>

    <!-- WELCOME SIGN (Crucial Prop for "接 - To meet/pick up") -->
    <g transform="translate(45, 115)">
      <!-- Stick -->
      <rect x="25" y="10" width="4" height="65" fill="#64748b" rx="2"/>
      <!-- Board -->
      <rect x="-5" y="-15" width="64" height="35" rx="4" fill="url(#signGrad)" stroke="#d97706" stroke-width="1.5"/>
      <!-- Decorative heart/smile icon on sign representing friendly greeting -->
      <path d="M27 0 C27 -6 20 -8 17 -3 C14 -8 7 -6 7 0 C7 6 17 11 17 11 C17 11 27 6 27 0 Z" fill="#ef4444" transform="scale(0.6) translate(18, -3)"/>
      <!-- Abstract welcoming text lines (non-readable stylized strokes) -->
      <line x1="5" y1="-5" x2="20" y2="-5" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="2" x2="35" y2="2" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- CHARACTER 2: The Friend Arriving (Traveler with luggage) -->
  <g id="friend">
    <!-- Legs -->
    <rect x="145" y="142" width="8" height="43" rx="3" fill="#1e293b"/>
    <rect x="159" y="142" width="8" height="43" rx="3" fill="#1e293b"/>
    <!-- Shoes -->
    <path d="M140 185 C140 182 145 180 151 180 C155 180 155 185 155 187 Z" fill="#0f172a"/>
    <path d="M158 185 C158 182 164 180 170 180 C174 180 174 185 174 187 Z" fill="#0f172a"/>

    <!-- Torso (Traveler Hoodie/Outfit) -->
    <path d="M140 102 L176 102 L172 145 L138 145 Z" fill="#38bdf8"/>
    <path d="M157 102 L157 125" stroke="#0284c7" stroke-width="2"/>

    <!-- Head & Hair -->
    <circle cx="157" cy="85" r="13" fill="#fbcfe8"/>
    <!-- Smiling Face -->
    <circle cx="161" cy="84" r="1.5" fill="#1e293b"/>
    <circle cx="153" cy="84" r="1.5" fill="#1e293b"/>
    <path d="M154 90 Q157 93 160 90" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Hair Cap / Stylized Hair -->
    <path d="M144 83 C144 72 152 70 162 72 C170 74 170 82 170 86 C165 82 150 80 144 83 Z" fill="#b45309"/>

    <!-- Left Arm pulling luggage -->
    <path d="M142 110 L125 125 L132 135 L148 120 Z" fill="#0284c7"/>

    <!-- LUGGAGE / SUITCASE (Prop establishing airport/travel context) -->
    <g transform="translate(110, 135)">
      <!-- Trolley Handle -->
      <line x1="12" y1="0" x2="12" y2="15" stroke="#94a3b8" stroke-width="2.5"/>
      <!-- Suitcase Body -->
      <rect x="0" y="15" width="28" height="35" rx="5" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/>
      <!-- Suitcase Details (Straps & Lines) -->
      <line x1="0" y1="27" x2="28" y2="27" stroke="#db2777" stroke-width="2"/>
      <rect x="10" y="10" width="8" height="6" rx="2" fill="#94a3b8"/>
      <!-- Wheels -->
      <circle cx="7" cy="52" r="3" fill="#0f172a"/>
      <circle cx="21" cy="52" r="3" fill="#0f172a"/>
    </g>

    <!-- Backpack on Friend -->
    <path d="M132 105 C128 105 126 112 126 120 C126 128 130 132 134 130 Z" fill="#f59e0b"/>
  </g>

  <!-- Foreground Atmospheric Elements / Depth Lighting -->
  <circle cx="35" cy="50" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="180" cy="40" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="210" cy="70" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="20" cy="120" r="1.5" fill="#fbbf24" opacity="0.4"/>

  <!-- Soft Vignette Lighting over the Scene -->
  <path d="M0 0 L240 0 L240 240 L0 240 Z" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" rx="24"/>
</svg>