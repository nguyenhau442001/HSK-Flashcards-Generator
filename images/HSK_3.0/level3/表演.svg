<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and lighting effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Stage Floor Gradient -->
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Curtain Gradient -->
    <linearGradient id="curtainLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="curtainRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Star Shape -->
    <g id="star">
      <path d="M0,-5 L1.5,-1.5 L5,-1.5 L2,0.5 L3,4 L0,2 L-3,4 L-2,0.5 L-5,-1.5 L-1.5,-1.5 Z" fill="#fbbf24"/>
    </g>
  </defs>

  <!-- Canvas Background with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Backstage Atmosphere & Ambient Lighting -->
  <circle cx="120" cy="80" r="110" fill="url(#spotlight)" />

  <!-- Confetti / Floating Sparkles -->
  <use href="#star" x="50" y="70" transform="scale(0.8)" opacity="0.8"/>
  <use href="#star" x="190" y="60" transform="scale(1.2)" opacity="0.9"/>
  <use href="#star" x="210" y="110" transform="scale(0.6)" opacity="0.7"/>
  <use href="#star" x="35" y="120" transform="scale(0.7)" opacity="0.6"/>
  <circle cx="80" cy="50" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="165" cy="45" r="3" fill="#ec4899" opacity="0.8"/>
  <circle cx="110" cy="35" r="1.5" fill="#fbbf24" opacity="0.9"/>

  <!-- Stage Curtains (Left and Right) -->
  <path d="M0,0 L45,0 C35,70 55,140 25,240 L0,240 Z" fill="url(#curtainLeft)"/>
  <path d="M240,0 L195,0 C205,70 185,140 215,240 L240,240 Z" fill="url(#curtainRight)"/>
  <path d="M0,0 L45,0 C30,40 35,90 20,130 L0,110 Z" fill="#500724" opacity="0.6"/>
  <path d="M240,0 L195,0 C210,40 205,90 220,130 L240,110 Z" fill="#500724" opacity="0.6"/>

  <!-- Hanging Stage Lights / Truss Top Elements -->
  <rect x="0" y="0" width="240" height="12" fill="#090d16"/>
  <line x1="60" y1="12" x2="60" y2="25" stroke="#475569" stroke-width="2"/>
  <circle cx="60" cy="27" r="5" fill="#f59e0b" filter="url(#glow)"/>
  <line x1="180" y1="12" x2="180" y2="25" stroke="#475569" stroke-width="2"/>
  <circle cx="180" cy="27" r="5" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Stage Floor and Platform -->
  <path d="M25,215 L215,215 L235,240 L5,240 Z" fill="url(#stageGrad)"/>
  <line x1="25" y1="215" x2="215" y2="215" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <ellipse cx="120" cy="215" rx="95" ry="12" fill="#0f172a" opacity="0.5"/>

  <!-- Secondary Character (Background Dancer / Musician adding scene depth) -->
  <g opacity="0.75" transform="translate(45, 30)">
    <!-- Body -->
    <path d="M40,120 C35,110 35,95 42,85 L52,110 Z" fill="#0ea5e9"/>
    <!-- Head -->
    <circle cx="44" cy="74" r="7" fill="#fbcfe8"/>
    <!-- Arm holding prop (e.g., ribbon or drumstick) -->
    <path d="M46,88 L60,95" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M43,120 L35,145" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M48,120 L55,145" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- MAIN PERFORMING CHARACTER (Dynamic action pose: Dancing / Singing with expressive energy) -->
  <g transform="translate(0, 10)">
    <!-- Drop Shadow on Stage -->
    <ellipse cx="125" cy="207" rx="35" ry="7" fill="#020617" opacity="0.7"/>

    <!-- Left Leg (Dynamic bend) -->
    <path d="M112,165 C105,180 95,190 85,195" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
    <path d="M85,195 L78,202" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/> <!-- Shoe -->

    <!-- Right Leg (Stepping back / dynamic leap) -->
    <path d="M135,165 C145,180 155,192 165,190" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
    <path d="M165,190 L175,194" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/> <!-- Shoe -->

    <!-- Colorful Stage Costume (Jacket/Outfit base) -->
    <path d="M107,110 C107,110 115,140 120,165 C125,140 133,110 133,110 Z" fill="#0284c7"/>
    <path d="M110,110 L130,110 L135,145 L105,145 Z" fill="#38bdf8"/>
    <!-- Belt / Sash -->
    <path d="M106,145 L134,145 L135,152 L105,152 Z" fill="#fbbf24"/>

    <!-- Dynamic Flowing Costume Tails / Ribbons -->
    <path d="M115,165 C105,180 90,195 75,185 C95,180 105,170 115,165 Z" fill="#ec4899" filter="url(#glow)"/>
    <path d="M125,165 C135,185 150,200 165,195 C145,190 135,175 125,165 Z" fill="#ec4899" filter="url(#glow)"/>

    <!-- Left Arm (Raised high, holding glowing magic wand / performance prop) -->
    <path d="M110,115 C90,105 75,90 70,75" stroke="#fbcfe8" stroke-width="9" stroke-linecap="round"/>
    <circle cx="68" cy="71" r="5" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Right Arm (Outstretched dynamically to the side) -->
    <path d="M130,115 C150,110 165,120 175,115" stroke="#fbcfe8" stroke-width="9" stroke-linecap="round"/>
    <circle cx="177" cy="114" r="4" fill="#38bdf8"/>

    <!-- Torso / Shirt -->
    <path d="M110,100 C110,90 130,90 130,100 L133,115 L107,115 Z" fill="#ffffff"/>
    <path d="M120,100 L120,115" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Head & Face (Expressive, joyful singing/performing expression) -->
    <circle cx="120" cy="78" r="16" fill="#fbcfe8"/>
    
    <!-- Hair (Stylized dynamic anime/cartoon tufts) -->
    <path d="M104,78 C102,60 115,58 120,58 C125,58 138,62 136,80 C136,80 130,66 120,66 C110,66 104,78 104,78 Z" fill="#1e293b"/>
    <path d="M132,68 C138,65 142,72 140,78 C138,75 136,72 132,68 Z" fill="#1e293b"/>
    <path d="M108,68 C102,65 98,72 100,78 C102,75 104,72 108,68 Z" fill="#1e293b"/>

    <!-- Eyes (Happy curved lines indicating performance joy) -->
    <path d="M112,74 C114,77 117,77 119,74" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M122,74 C124,77 127,77 129,74" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Cheeks (Blush) -->
    <circle cx="111" cy="79" r="3" fill="#f43f5e" opacity="0.5"/>
    <circle cx="130" cy="79" r="3" fill="#f43f5e" opacity="0.5"/>

    <!-- Open Happy Mouth (Singing / Performing line) -->
    <path d="M116,83 C116,87 124,87 124,83 Z" fill="#9f1239"/>

    <!-- Sparkling Performance Star burst right near character hand -->
    <use href="#star" x="55" y="60" transform="scale(1.5)" filter="url(#glow)"/>
    <circle cx="55" cy="60" r="12" fill="#fbbf24" opacity="0.3" filter="url(#glow)"/>
  </g>

  <!-- Foreground Stage Props (Microphone Stand & Speakers for Rich Environment) -->
  <!-- Microphone Stand on the left -->
  <path d="M45,215 L45,150" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="45" cy="148" r="5" fill="#94a3b8"/>
  <path d="M35,215 L55,215" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- Speaker box on the right -->
  <rect x="190" y="165" width="25" height="50" rx="3" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="202" cy="180" r="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="202" cy="200" r="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="202" cy="180" r="3" fill="#38bdf8" opacity="0.8"/>

  <!-- Glowing Floor Notes / Musical atmosphere accents -->
  <path d="M70,225 C70,222 73,220 76,220 L76,215 C79,215 81,217 81,220 L81,225 Z" fill="#38bdf8" opacity="0.7"/>
  <circle cx="68" cy="225" r="3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="79" cy="223" r="3" fill="#38bdf8" opacity="0.7"/>
</svg>