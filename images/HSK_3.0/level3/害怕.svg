<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <radialGradient id="nightGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="pillowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="nightstandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#eab308" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Environment (Dark bedroom context representing 'darkness') -->
  <!-- Window showing dark blue night sky with faint stars -->
  <rect x="25" y="30" width="55" height="75" rx="4" fill="#020617" stroke="#334155" stroke-width="2" />
  <!-- Window panes -->
  <line x1="52" y1="30" x2="52" y2="105" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="67" x2="80" y2="67" stroke="#334155" stroke-width="2" />
  <!-- Tiny stars in window -->
  <circle cx="35" cy="42" r="1" fill="#94a3b8" opacity="0.6" />
  <circle cx="68" cy="50" r="1.2" fill="#f8fafc" opacity="0.8" />
  <circle cx="45" cy="85" r="0.8" fill="#94a3b8" opacity="0.5" />
  <circle cx="62" cy="92" r="1" fill="#f8fafc" opacity="0.7" />

  <!-- Moon outside -->
  <circle cx="65" cy="45" r="7" fill="#cbd5e1" opacity="0.4" />

  <!-- Nightstand with broken/turned-off or dim small lamp -->
  <rect x="165" y="115" width="45" height="55" rx="3" fill="url(#nightstandGrad)" />
  <!-- Lamp stand -->
  <path d="M187 115 L187 95" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <!-- Lamp shade -->
  <path d="M175 95 L199 95 L194 80 L180 80 Z" fill="#64748b" />
  <!-- Unlit / very dim bulb icon -->
  <circle cx="187" cy="89" r="3" fill="#cbd5e1" />

  <!-- Bed Structure -->
  <!-- Headboard -->
  <rect x="75" y="105" width="95" height="65" rx="6" fill="#1e293b" />
  <!-- Pillows -->
  <rect x="85" y="112" width="40" height="22" rx="8" fill="url(#pillowGrad)" />
  <rect x="123" y="115" width="38" height="20" rx="8" fill="url(#pillowGrad)" opacity="0.9" />

  <!-- Blanket covering part of the bed -->
  <path d="M75 130 C90 128, 120 135, 170 128 L170 185 C170 188, 167 190, 164 190 L81 190 C78 190, 75 188, 75 185 Z" fill="url(#blanketGrad)" />
  
  <!-- Blanket folds & texture details -->
  <path d="M90 145 C110 142, 130 152, 155 145" stroke="#0284c7" stroke-width="2" fill="none" opacity="0.5" />
  <path d="M85 165 C110 160, 135 170, 160 162" stroke="#0284c7" stroke-width="2" fill="none" opacity="0.4" />

  <!-- CHARACTER: Terrified girl hiding under blankets in the dark -->
  <!-- Hair peeking out -->
  <path d="M102 110 C96 115, 94 125, 96 135 C98 128, 103 120, 110 118 Z" fill="#0f172a" />
  
  <!-- Head / Face (peeking nervously over blanket edge) -->
  <circle cx="112" cy="123" r="14" fill="#fde68a" />
  
  <!-- Hair strands -->
  <path d="M98 118 C102 112, 112 110, 120 114 C115 112, 105 114, 100 120 Z" fill="#0f172a" />

  <!-- Scared Expression Details -->
  <!-- Wide startled eyes -->
  <circle cx="108" cy="122" r="2.5" fill="#ffffff" />
  <circle cx="116" cy="122" r="2.5" fill="#ffffff" />
  <circle cx="108" cy="122" r="1.2" fill="#0f172a" />
  <circle cx="116" cy="122" r="1.2" fill="#0f172a" />
  
  <!-- Worried eyebrows (angled up inward) -->
  <line x1="105" y1="118" x2="111" y2="119" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />
  <line x1="113" y1="119" x2="119" y2="118" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />

  <!-- Nervous small open mouth (gasping/fearful) -->
  <ellipse cx="112" cy="129" rx="1.5" ry="2" fill="#b91c1c" />

  <!-- Sweat drop (classic manga/vector fear trope) -->
  <path d="M123 118 C124 116, 126 117, 125 119 C124 121, 123 120, 123 118 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Hands clutching blanket tightly in fear -->
  <circle cx="102" cy="133" r="3" fill="#fde68a" />
  <circle cx="122" cy="133" r="3" fill="#fde68a" />
  <path d="M99 135 L105 131" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M119 131 L125 135" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- The Blanket pulled right up under her chin -->
  <path d="M75 136 C90 130, 120 134, 140 136 C130 132, 100 130, 85 135 Z" fill="#38bdf8" />

  <!-- Floor and Room Details -->
  <!-- Floor line -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#090d16" stroke-width="4" />
  
  <!-- Slippers neatly placed on floor (adds cozy room context) -->
  <ellipse cx="100" cy="203" rx="8" ry="4" fill="#ec4899" opacity="0.8" />
  <ellipse cx="115" cy="205" rx="8" ry="4" fill="#ec4899" opacity="0.8" />

  <!-- A small rug near bed -->
  <ellipse cx="130" cy="205" rx="45" ry="10" fill="#334155" opacity="0.5" />

  <!-- Subtle shadow effects enhancing the spooky/dark mood -->
  <path d="M0 0 L240 0 L240 240 L0 240 Z" fill="url(#nightGlow)" style="mix-blend-mode: multiply;" pointer-events="none" />

</svg>