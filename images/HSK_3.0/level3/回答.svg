<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background glow for focus -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />

  <!-- Classroom / Study Environment Background -->
  <!-- Large Display Board representing the "Question" -->
  <rect x="40" y="25" width="160" height="95" rx="12" fill="url(#board-grad)" stroke="#475569" stroke-width="2" />
  <!-- Inner screen glow -->
  <rect x="48" y="33" width="144" height="79" rx="8" fill="#0f172a" />

  <!-- Abstract Question Graphic on Board (Large stylized Q symbol/shapes, no letters) -->
  <circle cx="120" cy="63" r="22" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
  <path d="M132 75 L144 87" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
  <!-- Accent dots on board -->
  <circle cx="64" cy="48" r="4" fill="#38bdf8" opacity="0.6" />
  <circle cx="176" cy="48" r="4" fill="#10b981" opacity="0.6" />
  <line x1="64" y1="88" x2="96" y2="88" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

  <!-- Teacher/Question Pointer or Spotlight indicator -->
  <path d="M120 120 L120 135" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4" />

  <!-- Desk Surface -->
  <path d="M20 195 L220 195 L210 215 L30 215 Z" fill="url(#desk-grad)" />
  <rect x="20" y="190" width="200" height="6" rx="3" fill="#64748b" />

  <!-- Props on Desk -->
  <!-- Open Notebook / Textbook -->
  <path d="M60 185 L95 175 L95 195 L60 200 Z" fill="#f8fafc" />
  <path d="M95 175 L130 185 L130 200 L95 195 Z" fill="#e2e8f0" />
  <line x1="95" y1="175" x2="95" y2="195" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Pencil -->
  <path d="M135 180 L160 172 L162 176 L137 184 Z" fill="#fbbf24" />
  <polygon points="160,172 165,174 162,176" fill="#f43f5e" />

  <!-- Student Character (Actively Raising Hand / Responding) -->
  <!-- Body / Torso -->
  <path d="M95 180 C95 160 110 150 120 150 C130 150 145 160 145 180 Z" fill="url(#shirt-grad)" />
  <!-- Collar -->
  <path d="M110 150 L120 160 L130 150" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Neck -->
  <rect x="113" y="136" width="14" height="18" rx="4" fill="#fbcfe8" />

  <!-- Head -->
  <circle cx="120" cy="116" r="22" fill="#ffedd5" />

  <!-- Hair Style -->
  <path d="M98 116 C98 100 110 94 120 94 C130 94 142 100 142 116 C142 122 138 120 138 110 C138 102 130 98 120 98 C110 98 102 102 102 110 C102 120 98 122 98 116 Z" fill="#334155" />

  <!-- Face features (Engaged, eager expression) -->
  <!-- Eyes - happy arcs -->
  <path d="M110 114 Q114 110 118 114" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M122 114 Q126 110 130 114" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Cheeks -->
  <circle cx="109" cy="119" r="3" fill="#fda4af" opacity="0.6" />
  <circle cx="131" cy="119" r="3" fill="#fda4af" opacity="0.6" />
  <!-- Smile (Confident answering smile) -->
  <path d="M115 124 Q120 129 125 124" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- Arms and Hand (Action: Raising hand high to answer) -->
  <!-- Back Arm (resting) -->
  <path d="M98 160 Q85 175 90 190" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
  <circle cx="90" cy="190" r="6" fill="#ffedd5" />

  <!-- Front Arm (Raised high eagerly to respond/answer) -->
  <path d="M142 165 C160 140 155 100 155 85" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
  <!-- Hand pointing / upraised -->
  <circle cx="155" cy="78" r="7" fill="#ffedd5" />

  <!-- Visual Action Accent / Sound of Answering (Glowing energy spark near hand) -->
  <path d="M168 75 L178 70" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <path d="M165 88 L175 93" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <circle cx="168" cy="82" r="2.5" fill="#38bdf8" />
  <circle cx="150" cy="62" r="3" fill="#f59e0b" filter="url(#glow)" />
</svg>