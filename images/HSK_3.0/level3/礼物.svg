<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting & Room Interior -->
  <path d="M0 0h240v240H0z" fill="url(#bgGrad)"/>
  <circle cx="180" cy="70" r="90" fill="#38bdf8" opacity="0.05"/>
  <circle cx="60" cy="180" r="70" fill="#ec4899" opacity="0.04"/>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cloth1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cloth2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background Environment (Room details) -->
  <!-- Bookshelf / Plant hints -->
  <path d="M210 120h20v100h-20z" fill="#334155" opacity="0.4"/>
  <path d="M215 130h10v80h-10z" fill="#475569" opacity="0.3"/>
  <!-- Warm hanging lamp -->
  <path d="M120 0v45" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="48" r="16" fill="#f59e0b" opacity="0.15"/>
  <path d="M112 40h16l4 8h-24z" fill="#64748b"/>

  <!-- Character 1 (Giver - Left) -->
  <g id="giver" transform="translate(-10, 0)">
    <!-- Body & Torso -->
    <path d="M60 170c0-15 10-25 25-25s25 10 25 25v70H60z" fill="url(#cloth1)"/>
    <!-- Head & Hair -->
    <circle cx="85" cy="115" r="18" fill="#ffd1dc"/>
    <path d="M67 115c0-12 10-20 18-20s18 8 18 20c0 4-2 8-5 10-3-4-7-6-13-6s-10 2-13 6c-3-2-5-6-5-10z" fill="#0f172a"/>
    <!-- Face expression (friendly smile looking right) -->
    <circle cx="91" cy="114" r="1.5" fill="#1e293b"/>
    <path d="M92 120q3 2 6 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Arm reaching out holding gift -->
    <path d="M85 145c10 0 25 5 35 12l-2 8c-8-6-20-10-30-10z" fill="#0284c7"/>
    <circle cx="120" cy="157" r="5" fill="#ffd1dc"/>
  </g>

  <!-- Character 2 (Receiver - Right) -->
  <g id="receiver" transform="translate(10, 0)">
    <!-- Body & Torso -->
    <path d="M130 170c0-15 10-25 25-25s25 10 25 25v70h-50z" fill="url(#cloth2)"/>
    <!-- Head & Hair -->
    <circle cx="155" cy="112" r="18" fill="#fbcfe8"/>
    <path d="M137 110c2-14 12-22 22-22 12 0 18 10 18 24 0 2-1 4-2 4-4-5-10-8-16-8s-12 3-16 8c-4-2-6-4-6-6z" fill="#4c1d95"/>
    <!-- Face expression (delighted/surprised looking left) -->
    <circle cx="149" cy="111" r="1.5" fill="#1e293b"/>
    <ellipse cx="149" cy="117" rx="2" ry="2.5" fill="#f43f5e"/>
    <!-- Arms reaching out to receive -->
    <path d="M155 145c-8 0-22 5-30 12l2 8c6-6 18-10 26-10z" fill="#7c3aed"/>
    <circle cx="125" cy="157" r="5" fill="#fbcfe8"/>
  </g>

  <!-- THE GIFT BOX (Central Focus - 礼物) -->
  <g id="gift-box" transform="translate(105, 132)">
    <!-- Shadow beneath box -->
    <ellipse cx="15" cy="38" rx="22" ry="6" fill="#000000" opacity="0.4"/>
    
    <!-- Box Base -->
    <path d="M0 15h30v20H0z" fill="url(#boxGrad)"/>
    <!-- Box Side shadow for 3D depth -->
    <path d="M30 15h8v20h-8z" fill="#9f1239"/>
    <!-- Box Top Lid -->
    <path d="M-3 10h36v7H-3z" fill="#e11d48"/>
    <path d="M31 10h8v7h-8z" fill="#be123c"/>
    
    <!-- Vertical Ribbon -->
    <path d="M12 10h6v25h-6z" fill="url(#ribbonGrad)"/>
    <!-- Horizontal Ribbon -->
    <path d="M-3 21h36v4H-3z" fill="url(#ribbonGrad)"/>
    
    <!-- Bow / Ribbon Loops on Top -->
    <path d="M15 10c-6-8-12-6-10-2s8 2 10 2z" fill="url(#ribbonGrad)"/>
    <path d="M15 10c6-8 12-6 10-2s-8 2-10 2z" fill="url(#ribbonGrad)"/>
    <circle cx="15" cy="9" r="3" fill="#b45309"/>
    
    <!-- Sparkles / Magic atmosphere around gift -->
    <path d="M-10 5l2 2-2 2-2-2z" fill="#fbbf24" opacity="0.8"/>
    <path d="M40 2l1.5 1.5-1.5 1.5-1.5-1.5z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="36" cy="18" r="1.5" fill="#f43f5e"/>
    <circle cx="-6" cy="24" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Foreground details / floor -->
  <path d="M0 230h240v10H0z" fill="#090d16"/>
  <ellipse cx="120" cy="230" rx="90" ry="2" fill="#334155" opacity="0.5"/>

</svg>