<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Restaurant Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Restaurant Interior Ambience / Warm Light Cone -->
  <circle cx="120" cy="80" r="120" fill="url(#lampGlow)"/>

  <!-- Background Wall Details (Wooden Paneling / Shelf) -->
  <rect x="0" y="0" width="240" height="110" fill="#111827" opacity="0.4"/>
  <rect x="30" y="35" width="60" height="4" rx="2" fill="#334155"/>
  <circle cx="50" cy="30" r="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="70" cy="30" r="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <!-- Waiter Character (Back/Side, offering chopsticks) -->
  <g id="waiter" filter="url(#shadow)">
    <!-- Waiter Body/Apron -->
    <path d="M 180 130 C 180 110, 195 100, 205 100 L 225 100 C 235 100, 240 110, 240 130 L 240 190 L 180 190 Z" fill="#0f172a"/>
    <path d="M 192 115 L 228 115 L 235 185 L 185 185 Z" fill="#f8fafc"/>
    <!-- Waiter Head -->
    <circle cx="210" cy="82" r="14" fill="#fb923c"/>
    <path d="M 198 78 C 198 70, 215 68, 222 76 Z" fill="#334155"/>
    <!-- Waiter Arm reaching out -->
    <path d="M 195 120 C 170 125, 140 130, 125 132" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <circle cx="123" cy="132" r="5" fill="#fb923c"/>
  </g>

  <!-- Dining Table -->
  <path d="M 10 160 L 230 160 L 210 230 L 30 230 Z" fill="url(#tableGrad)" filter="url(#shadow)"/>
  <path d="M 10 160 L 230 160 L 230 166 L 10 166 Z" fill="#92400e"/>

  <!-- Customer Character (Seated, welcoming gesture) -->
  <g id="customer" filter="url(#shadow)">
    <!-- Customer Body/Shirt -->
    <path d="M 40 190 C 40 150, 70 140, 90 140 L 110 140 C 130 140, 160 150, 160 190 Z" fill="#38bdf8"/>
    <!-- Customer Head -->
    <circle cx="100" cy="115" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 83 115 C 83 95, 117 95, 117 115 C 117 115, 110 102, 100 102 C 90 102, 83 115, 83 115 Z" fill="#475569"/>
    <!-- Customer Face Expression (Smiling, polite) -->
    <path d="M 95 118 Q 100 123 105 118" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="94" cy="113" r="2" fill="#1e293b"/>
    <circle cx="106" cy="113" r="2" fill="#1e293b"/>
    <!-- Hand gesturing politely towards bowl -->
    <path d="M 115 150 C 120 140, 128 145, 125 155" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Dining Props on Table -->
  <g id="tableware" filter="url(#shadow)">
    <!-- Bamboo Steamer / Dim Sum Basket -->
    <g transform="translate(60, 140)">
      <!-- Steamer Base -->
      <ellipse cx="25" cy="35" rx="25" ry="12" fill="#d97706"/>
      <rect x="0" y="25" width="50" height="15" fill="#b45309"/>
      <ellipse cx="25" cy="25" rx="25" ry="12" fill="#f59e0b"/>
      <!-- Steamer Lid (slightly open) -->
      <ellipse cx="30" cy="12" rx="24" ry="11" fill="#d97706"/>
      <circle cx="30" cy="5" r="3" fill="#92400e"/>
      <!-- Steaming Food Inside -->
      <circle cx="18" cy="22" r="5" fill="#f8fafc"/>
      <circle cx="32" cy="24" r="6" fill="#f8fafc"/>
    </g>

    <!-- Ceramic Bowl of Noodles/Rice -->
    <g transform="translate(115, 150)">
      <!-- Bowl Shadow/Base -->
      <ellipse cx="25" cy="35" rx="18" ry="8" fill="#1e293b" opacity="0.5"/>
      <!-- Bowl Outer -->
      <path d="M 5 25 C 5 40, 45 40, 45 25 Z" fill="#e2e8f0"/>
      <!-- Bowl Rim -->
      <ellipse cx="25" cy="25" rx="20" ry="8" fill="#f8fafc"/>
      <!-- Bowl Inner / Food (Steaming Broth & Noodles) -->
      <ellipse cx="25" cy="26" rx="17" ry="6" fill="#f59e0b"/>
      <path d="M 15 26 Q 20 22 25 26 T 35 26" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
      <path d="M 18 28 Q 23 24 28 28" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- THE HERO ELEMENT: 筷子 (Chopsticks) being handed over -->
  <g id="chopsticks" filter="url(#shadow)">
    <!-- Two stylized wooden chopsticks held diagonally in mid-air between waiter and customer -->
    <g transform="rotate(-15 130 135)">
      <!-- Chopstick 1 -->
      <path d="M 105 133 L 165 130 C 167 130, 167 131, 165 131.5 L 105 134.5 Z" fill="#f59e0b"/>
      <circle cx="163" cy="130.7" r="1.5" fill="#b45309"/>
      
      <!-- Chopstick 2 -->
      <path d="M 105 137 L 165 134 C 167 134, 167 135, 165 135.5 L 105 138.5 Z" fill="#fbbf24"/>
      <circle cx="163" cy="134.7" r="1.5" fill="#d97706"/>
    </g>
  </g>

  <!-- Ambient Steam/Action FX -->
  <path d="M 80 120 Q 75 105 85 95 T 80 80" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M 90 125 Q 95 110 88 100 T 92 85" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

</svg>