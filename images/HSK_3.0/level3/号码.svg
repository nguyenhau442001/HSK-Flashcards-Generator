<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Phone Body Gradient -->
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Call Button Gradient -->
    <linearGradient id="callGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Note Pad Gradient -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient lighting / background shapes -->
  <circle cx="190" cy="50" r="40" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="60" cy="180" r="50" fill="#f59e0b" opacity="0.06" filter="url(#glow)" />

  <!-- SCENE PROPS: Sticky Note / Notepad (Representing written down numbers/contact info) -->
  <g transform="translate(15, 45) rotate(-8)">
    <rect width="90" height="110" rx="6" fill="url(#noteGrad)" filter="url(#shadow)" />
    <!-- Tape -->
    <rect x="30" y="-8" width="30" height="14" rx="2" fill="#cbd5e1" opacity="0.8" />
    <!-- Notepad Header Line -->
    <line x1="12" y1="20" x2="78" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Number simulation lines (abstract graphical ticks instead of text) -->
    <circle cx="20" cy="38" r="4" fill="#38bdf8" />
    <line x1="32" y1="36" x2="72" y2="36" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    
    <circle cx="20" cy="58" r="4" fill="#f59e0b" />
    <line x1="32" y1="56" x2="65" y2="56" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <circle cx="20" cy="78" r="4" fill="#ec4899" />
    <line x1="32" y1="76" x2="75" y2="76" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- SECONDARY PROP: Stylus Pen -->
  <g transform="translate(85, 130) rotate(45)">
    <path d="M0,0 L10,-4 L50,35 L45,40 Z" fill="#64748b" />
    <path d="M45,40 L50,35 L55,40 L50,45 Z" fill="#f59e0b" />
    <path d="M0,0 L10,-4 L8,-8 L-2,-4 Z" fill="#334155" />
  </g>

  <!-- MAIN SUBJECT: Modern Smartphone displaying a calling interface / number input -->
  <g transform="translate(100, 25)" filter="url(#shadow)">
    <!-- Phone Outer Case -->
    <rect x="0" y="0" width="115" height="195" rx="20" fill="url(#phoneGrad)" stroke="#475569" stroke-width="2" />
    
    <!-- Phone Inner Screen -->
    <rect x="8" y="12" width="99" height="171" rx="12" fill="url(#screenGrad)" />

    <!-- Speaker / Camera Notch -->
    <rect x="42" y="18" width="31" height="4" rx="2" fill="#334155" />
    <circle cx="78" cy="20" r="2" fill="#1e293b" />

    <!-- Contact Avatar on Screen -->
    <circle cx="57" cy="52" r="16" fill="#38bdf8" opacity="0.2" />
    <circle cx="57" cy="48" r="7" fill="#38bdf8" />
    <path d="M43,64 C43,58 49,56 57,56 C65,56 71,58 71,64 Z" fill="#38bdf8" />

    <!-- Displaying Numbers (Abstract glowing dots & dashes for UI) -->
    <g transform="translate(18, 78)">
      <!-- Number Row 1 -->
      <circle cx="12" cy="10" r="6" fill="#1e293b" />
      <circle cx="41" cy="10" r="6" fill="#1e293b" />
      <circle cx="70" cy="10" r="6" fill="#1e293b" />

      <!-- Number Row 2 -->
      <circle cx="12" cy="30" r="6" fill="#1e293b" />
      <circle cx="41" cy="30" r="6" fill="#38bdf8" opacity="0.8" />
      <circle cx="70" cy="30" r="6" fill="#1e293b" />

      <!-- Number Row 3 -->
      <circle cx="12" cy="50" r="6" fill="#1e293b" />
      <circle cx="41" cy="50" r="6" fill="#1e293b" />
      <circle cx="70" cy="50" r="6" fill="#1e293b" />
    </g>

    <!-- Active Call / Send Button -->
    <rect x="23" y="152" width="69" height="22" rx="11" fill="url(#callGrad)" />
    <!-- Phone Icon inside button -->
    <path d="M50,161 C50,160 51,159 52,159 L54,159 C54.5,159 55,159.5 55.2,160 L56,161.5 C56.2,161.8 56,162.2 55.6,162.4 L54.4,163 C55,164.5 56.5,166 58,166.6 L58.6,165.4 C58.8,165 59.2,164.8 59.5,165 L61,165.8 C61.5,166 62,166.5 62,167 L62,169 C62,169.5 61.5,170 61,170 C55,170 50,165 50,161 Z" fill="#ffffff" transform="translate(4, -4) scale(0.9)" />
  </g>

  <!-- FOREGROUND / ACCENT ELEMENTS: Floating dynamic UI elements / connection sparks -->
  <!-- Signal Wave 1 -->
  <path d="M 215,85 C 223,93 223,107 215,115" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  <!-- Signal Wave 2 -->
  <path d="M 221,77 C 233,89 233,111 221,123" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Glowing interactive sparks -->
  <circle cx="165" cy="22" r="3" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="35" cy="180" r="4" fill="#34d399" filter="url(#glow)" />
  <circle cx="195" cy="185" r="3" fill="#ec4899" filter="url(#glow)" />

  <!-- Small geometric grid dots in background for depth -->
  <circle cx="30" cy="25" r="1.5" fill="#64748b" opacity="0.4" />
  <circle cx="45" cy="25" r="1.5" fill="#64748b" opacity="0.4" />
  <circle cx="30" cy="40" r="1.5" fill="#64748b" opacity="0.4" />
  <circle cx="45" cy="40" r="1.5" fill="#64748b" opacity="0.4" />
</svg>