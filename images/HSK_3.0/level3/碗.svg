<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#332211" />
      <stop offset="100%" stop-color="#1c1109" />
    </linearGradient>

    <!-- Warm Broth Gradient -->
    <linearGradient id="brothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Bowl Exterior Gradient -->
    <linearGradient id="bowlExt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Bowl Interior Gradient -->
    <linearGradient id="bowlInt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow in background -->
  <circle cx="120" cy="110" r="70" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

  <!-- Wooden Table Surface -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#tableGrad)"/>
  <!-- Table surface rim line -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#452a14" stroke-width="3" />

  <!-- Chopsticks resting on side -->
  <g transform="rotate(-15 170 180)" filter="url(#shadow)">
    <rect x="130" y="175" width="80" height="3" rx="1.5" fill="#fb923c"/>
    <rect x="130" y="181" width="80" height="3" rx="1.5" fill="#ea580c"/>
  </g>

  <!-- Steam rising (Action/Vivid detail) -->
  <g fill="none" stroke-linecap="round" stroke-width="2.5" opacity="0.6">
    <path d="M 100 85 Q 90 65 110 45 Q 120 35 110 20" stroke="#cbd5e1" filter="url(#glow)" />
    <path d="M 125 90 Q 135 70 120 50 Q 110 35 125 15" stroke="#cbd5e1" filter="url(#glow)" />
    <path d="M 150 85 Q 165 65 145 45 Q 130 30 140 15" stroke="#cbd5e1" filter="url(#glow)" />
  </g>

  <!-- Main Subject: The Bowl (wǎn) -->
  <g filter="url(#shadow)">
    <!-- Bowl Base/Foot -->
    <path d="M 95 160 L 145 160 L 140 172 L 100 172 Z" fill="#0284c7"/>

    <!-- Bowl Outer Body -->
    <path d="M 60 100 C 60 160, 180 160, 180 100 Z" fill="url(#bowlExt)"/>

    <!-- Decorative Rim Pattern on Bowl (Blue & White porcelain style accents) -->
    <path d="M 65 107 C 65 148, 175 148, 175 107 C 140 115, 100 115, 65 107 Z" fill="#e0f2fe" opacity="0.25"/>

    <!-- Bowl Rim (Ellipse Top) -->
    <ellipse cx="120" cy="100" rx="60" ry="16" fill="#0284c7"/>

    <!-- Bowl Interior -->
    <ellipse cx="120" cy="98" rx="53" ry="13" fill="url(#bowlInt)"/>

    <!-- Delicious Broth/Soup inside -->
    <ellipse cx="120" cy="100" rx="48" ry="10" fill="url(#brothGrad)"/>
  </g>

  <!-- Food Ingredients inside the Bowl (Noodles, Egg, Green Veggies) -->
  <g>
    <!-- Noodles swirls -->
    <path d="M 95 100 Q 110 106 130 98 Q 140 94 125 103" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <path d="M 100 96 Q 115 102 135 96" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>

    <!-- Half Boiled Egg -->
    <ellipse cx="105" cy="99" rx="10" ry="7" fill="#ffffff" />
    <ellipse cx="106" cy="99" rx="5" ry="3.5" fill="#f59e0b" />

    <!-- Green Vegetables (Bok Choy) -->
    <path d="M 135 95 Q 142 98 138 104 Q 133 106 130 101 Z" fill="#10b981"/>
    <path d="M 125 103 Q 132 108 128 112 Q 122 110 120 105 Z" fill="#34d399"/>

    <!-- Red Chilli Slices for vibrancy -->
    <ellipse cx="118" cy="96" rx="3" ry="1.5" fill="#ef4444" transform="rotate(30 118 96)"/>
    <ellipse cx="132" cy="102" rx="2.5" ry="1.2" fill="#ef4444" transform="rotate(-45 132 102)"/>
  </g>

  <!-- Epicurean Highlight / Rim reflection -->
  <ellipse cx="120" cy="95" rx="53" ry="13" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

  <!-- Floating particles / Seasoning speckles -->
  <circle cx="95" cy="115" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="150" cy="125" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="160" cy="110" r="1" fill="#fbbf24" opacity="0.9"/>
  <circle cx="80" cy="120" r="1.5" fill="#fbbf24" opacity="0.9"/>
</svg>