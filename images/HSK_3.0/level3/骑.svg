<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Deep Slate Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sun-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="road-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements -->
  <circle cx="180" cy="70" r="50" fill="url(#sun-glow)"/>
  
  <!-- Distant Hills & Scenery -->
  <path d="M0 160 Q 60 120, 130 150 T 240 140 L 240 190 L 0 190 Z" fill="#1e293b" opacity="0.7"/>
  <path d="M0 170 Q 90 140, 170 160 T 240 155 L 240 190 L 0 190 Z" fill="#334155" opacity="0.5"/>

  <!-- Road / Ground Context -->
  <path d="M-10 190 L250 190 L250 240 L-10 240 Z" fill="url(#road-grad)"/>
  <line x1="-10" y1="215" x2="250" y2="215" stroke="#fbbf24" stroke-width="3" stroke-dasharray="12, 12" opacity="0.8"/>

  <!-- Motion lines / Speed trails -->
  <path d="M20 180 Q 50 180, 80 180" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M40 185 Q 70 185, 100 185" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Bicycle & Rider (Main Subject) -->
  <!-- Back Wheel -->
  <g>
    <circle cx="75" cy="180" r="28" fill="none" stroke="#64748b" stroke-width="6"/>
    <circle cx="75" cy="180" r="25" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="4, 4"/>
    <circle cx="75" cy="180" r="4" fill="#94a3b8"/>
  </g>

  <!-- Front Wheel -->
  <g>
    <circle cx="175" cy="180" r="28" fill="none" stroke="#64748b" stroke-width="6"/>
    <circle cx="175" cy="180" r="25" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="4, 4"/>
    <circle cx="175" cy="180" r="4" fill="#94a3b8"/>
  </g>

  <!-- Bicycle Frame -->
  <polyline points="75,180 115,150 165,150" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="115,150 175,180" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="115,150 100,120" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebars -->
  <path d="M 165,150 Q 170,140 165,130" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat -->
  <path d="M 105,120 L 125,117" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>

  <!-- Pedals & Crank -->
  <circle cx="115" cy="150" r="8" fill="#cbd5e1"/>
  <line x1="115" y1="150" x2="105" y2="165" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="105" cy="165" r="5" fill="#f59e0b"/>

  <!-- Rider Body -->
  <!-- Legs (Pedaling action) -->
  <path d="M 115,150 L 105,165 L 85,160" fill="none" stroke="#ec4899" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 115,150 L 125,165 L 140,175" fill="none" stroke="#ec4899" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Torso -->
  <path d="M 115,130 Q 125,105 105,90" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>

  <!-- Backpack -->
  <rect x="95" y="90" width="16" height="22" rx="4" fill="#fb923c"/>

  <!-- Head & Helmet -->
  <circle cx="140" cy="85" r="11" fill="#fbcfe8"/>
  <path d="M 128,82 Q 142,72 152,82 Z" fill="#38bdf8"/> <!-- Helmet -->
  <circle cx="145" cy="85" r="3" fill="#f43f5e"/> <!-- Visor/Details -->

  <!-- Arms -->
  <path d="M 115,100 L 140,125 L 165,130" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Foreground Atmospheric Particles / Nature -->
  <path d="M20 160 Q 25 150, 30 160" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M210 165 Q 215 155, 220 165" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="225" cy="140" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="15" cy="130" r="1.5" fill="#fbbf24" opacity="0.6"/>

  <!-- Lighting Vignette / Frame enhancement -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>