<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Masks -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Outdoor Sunset Gradient -->
    <linearGradient id="outdoorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Room Wall Gradient -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="pantsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Interior Room Wall & Floor -->
  <!-- Back Wall -->
  <rect x="15" y="15" width="210" height="175" rx="4" fill="url(#wallGrad)" />
  <!-- Floor -->
  <path d="M15 190 L225 190 L235 225 L5 225 Z" fill="#0f172a" />
  <path d="M15 190 L225 190" stroke="#334155" stroke-width="2" />

  <!-- Wall Decor / Bookshelf / Plant Context Props -->
  <!-- Hanging Picture Frame -->
  <rect x="32" y="35" width="30" height="24" rx="2" fill="#475569" />
  <rect x="35" y="38" width="24" height="18" fill="#1e293b" />
  <path d="M42 43 L48 50 L54 43" stroke="#f43f5e" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Picture wire -->
  <path d="M47 35 L47 30" stroke="#94a3b8" stroke-width="1" />

  <!-- Cozy Bookshelf on Wall -->
  <rect x="175" y="45" width="35" height="6" rx="1" fill="#64748b" />
  <rect x="180" y="35" width="6" height="10" rx="1" fill="#ec4899" />
  <rect x="188" y="33" width="7" height="12" rx="1" fill="#38bdf8" />
  <rect x="197" y="37" width="5" height="8" rx="1" fill="#fbbf24" />

  <!-- WINDOW SCENERY (Outdoor View) -->
  <!-- Window Frame Outer Rim -->
  <rect x="90" y="30" width="85" height="120" rx="4" fill="#64748b" />
  <!-- Window Glass / Sky Background (Outdoor) -->
  <rect x="94" y="34" width="77" height="112" fill="url(#outdoorGrad)" />
  
  <!-- Outdoor elements: Sun & Cloud -->
  <circle cx="150" cy="65" r="12" fill="#fef08a" opacity="0.9" />
  <path d="M105 105 Q115 95 125 105 Q135 100 142 110 Z" fill="#ffffff" opacity="0.6" />

  <!-- Light Beam coming through window -->
  <polygon points="94,34 171,34 220,190 70,190" fill="url(#lightBeam)" />

  <!-- WINDOW PANES (Open/Moving Sashes for the 'Closing' action) -->
  <!-- Left Window Pane (Fixed or partially open) -->
  <rect x="96" y="36" width="35" height="108" fill="#f8fafc" fill-opacity="0.25" stroke="#475569" stroke-width="2" />
  <!-- Right Window Pane (Actively being swung shut by character) -->
  <g transform="translate(133, 36) rotate(-22) translate(-133, -36)">
    <rect x="133" y="36" width="35" height="108" fill="#f8fafc" fill-opacity="0.35" stroke="#cbd5e1" stroke-width="2" />
    <!-- Window Pane Crossbars -->
    <line x1="133" y1="90" x2="168" y2="90" stroke="#64748b" stroke-width="1.5" />
    <line x1="150" y1="36" x2="150" y2="144" stroke="#64748b" stroke-width="1.5" />
    <!-- Window Handle -->
    <rect x="137" y="85" width="4" height="12" rx="2" fill="#fbbf24" />
  </g>
  
  <!-- Left Window Crossbars -->
  <line x1="96" y1="90" x2="131" y2="90" stroke="#64748b" stroke-width="1.5" />
  <line x1="113" y1="36" x2="113" y2="144" stroke="#64748b" stroke-width="1.5" />
  <!-- Window Sill -->
  <rect x="86" y="146" width="93" height="8" rx="2" fill="#475569" />

  <!-- Indoor Prop on Sill: Small Potted Plant -->
  <path d="M100 146 L104 136 L114 136 L118 146 Z" fill="#f43f5e" />
  <circle cx="109" cy="132" r="8" fill="#10b981" />
  <circle cx="105" cy="128" r="5" fill="#34d399" />
  <circle cx="113" cy="129" r="6" fill="#059669" />

  <!-- FOREGROUND & CHARACTER (Person closing the window) -->
  <!-- Character Body / Torso -->
  <path d="M95 190 C95 165 110 155 125 155 C140 155 155 165 155 190 Z" fill="url(#shirtGrad)" />
  <!-- Collar -->
  <path d="M115 155 L125 163 L135 155" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Character Neck & Head -->
  <rect x="117" y="138" width="16" height="20" rx="6" fill="#fbcfe8" />
  <!-- Head Base -->
  <circle cx="125" cy="125" r="18" fill="#fbcfe8" />
  
  <!-- Hair Styling (Friendly, expressive modern look) -->
  <path d="M108 120 C108 105 142 105 142 120 C142 125 138 120 135 115 C130 110 120 110 115 115 C110 120 108 125 108 120 Z" fill="#334155" />
  <!-- Cute Hair Tuft -->
  <path d="M123 108 C125 102 130 102 132 106" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Facial Expression (Focused, gentle, attentive) -->
  <!-- Eyes (Happy curved lines or focused dots) -->
  <circle cx="119" cy="124" r="2" fill="#1e293b" />
  <circle cx="131" cy="124" r="2" fill="#1e293b" />
  <!-- Gentle Smile -->
  <path d="M122 132 Q125 135 128 132" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Rosy Cheeks -->
  <circle cx="116" cy="128" r="3" fill="#f43f5e" opacity="0.3" />
  <circle cx="134" cy="128" r="3" fill="#f43f5e" opacity="0.3" />

  <!-- ARMS & HANDS (Reaching up and actively pulling the window shut) -->
  <!-- Back Arm (Relaxed or resting) -->
  <path d="M100 160 L85 180 L90 185" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Active Reaching/Pushing Arm -->
  <!-- Shoulder to elbow to hand gripping window frame -->
  <path d="M145 160 L160 140 L152 125" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Hand gripping the window sash -->
  <circle cx="150" cy="122" r="6" fill="#fbcfe8" />

  <!-- Motion lines indicating the action of closing/shutting -->
  <path d="M175 100 C180 105 180 115 173 122" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M182 108 C186 112 186 120 180 127" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  
  <!-- Wind breeze lines swirling outside/near window (showing why it needs closing) -->
  <path d="M75 60 Q85 55 90 65" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M70 85 Q80 80 85 90" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Interior Floor Prop: Cozy Rug -->
  <ellipse cx="125" cy="205" rx="45" ry="12" fill="#334155" opacity="0.8" />
  <ellipse cx="125" cy="205" rx="38" ry="9" fill="#475569" opacity="0.8" />
</svg>