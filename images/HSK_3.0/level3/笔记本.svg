<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <defs>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#deskGrad)"/>
  
  <!-- Atmospheric Lamp Glow -->
  <circle cx="200" cy="60" r="100" fill="url(#lampGlow)"/>

  <!-- Laptop (Bǐjìběn - Meaning 1) -->
  <!-- Screen Back -->
  <path d="M40 155 L130 155 L125 75 L45 75 Z" fill="#334155"/>
  <!-- Screen Display -->
  <path d="M45 150 L125 150 L121 80 L49 80 Z" fill="#38bdf8" opacity="0.9"/>
  <!-- Screen Content (Abstract UI blocks) -->
  <rect x="55" y="90" width="30" height="4" rx="1" fill="#ffffff" opacity="0.6"/>
  <rect x="55" y="100" width="55" height="4" rx="1" fill="#ffffff" opacity="0.4"/>
  <rect x="55" y="110" width="45" height="4" rx="1" fill="#ffffff" opacity="0.4"/>
  <rect x="95" y="125" width="20" height="15" rx="2" fill="#fb923c" opacity="0.8"/>
  <!-- Keyboard Base -->
  <path d="M30 175 L140 175 L130 155 L40 155 Z" fill="#475569"/>
  <!-- Trackpad area -->
  <rect x="75" y="165" width="20" height="6" rx="1" fill="#1e293b" opacity="0.5"/>

  <!-- Paper Notebook (Bǐjìběn - Meaning 2) -->
  <g transform="rotate(-12 180 185)">
    <!-- Cover -->
    <rect x="145" y="155" width="65" height="50" rx="3" fill="#fb923c"/>
    <!-- Pages -->
    <rect x="148" y="158" width="59" height="44" rx="1" fill="#f8fafc"/>
    <!-- Spiral Binding -->
    <circle cx="148" cy="162" r="1.5" fill="#94a3b8"/>
    <circle cx="148" cy="168" r="1.5" fill="#94a3b8"/>
    <circle cx="148" cy="174" r="1.5" fill="#94a3b8"/>
    <circle cx="148" cy="180" r="1.5" fill="#94a3b8"/>
    <circle cx="148" cy="186" r="1.5" fill="#94a3b8"/>
    <circle cx="148" cy="192" r="1.5" fill="#94a3b8"/>
    <circle cx="148" cy="198" r="1.5" fill="#94a3b8"/>
    <!-- Lines on paper -->
    <line x1="155" y1="168" x2="195" y2="168" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="155" y1="176" x2="195" y2="176" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="155" y1="184" x2="195" y2="184" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="155" y1="192" x2="185" y2="192" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Accessories -->
  <!-- Pencil -->
  <rect x="150" y="215" width="40" height="3" rx="1.5" fill="#f59e0b" transform="rotate(5 150 215)"/>
  <path d="M190 218.5 L196 219.5 L190 220.5 Z" fill="#fdba74" transform="rotate(5 150 215)"/>
  
  <!-- Coffee Mug -->
  <path d="M185 135 L205 135 L203 155 L187 155 Z" fill="#ec4899"/>
  <path d="M205 140 C212 140 212 150 205 150" fill="none" stroke="#ec4899" stroke-width="3"/>
  <ellipse cx="195" cy="135" rx="10" ry="3" fill="#be185d"/>
  <!-- Steam -->
  <path d="M192 125 Q195 120 192 115" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <path d="M198 128 Q201 123 198 118" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  <!-- Potted Plant -->
  <rect x="15" y="135" width="18" height="20" rx="2" fill="#10b981"/>
  <path d="M15 135 Q5 115 20 110" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <path d="M33 135 Q43 115 28 110" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
</svg>