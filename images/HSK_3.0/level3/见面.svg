<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient Background Lighting -->
  <circle cx="120" cy="120" r="100" fill="url(#warm-glow)"/>

  <!-- Background Environment: Cozy Cafe Interior -->
  <g id="environment">
    <!-- Window with City Night View / Stars -->
    <path d="M 40 40 L 90 40 L 90 120 L 40 120 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <!-- Window Frame Grid -->
    <line x1="65" y1="40" x2="65" y2="120" stroke="#334155" stroke-width="1.5"/>
    <line x1="40" y1="80" x2="90" y2="80" stroke="#334155" stroke-width="1.5"/>
    <!-- City lights outside window -->
    <circle cx="50" cy="60" r="1.5" fill="#fde047"/>
    <circle cx="75" cy="55" r="1" fill="#38bdf8"/>
    <circle cx="80" cy="95" r="1.5" fill="#f43f5e"/>
    <circle cx="55" cy="105" r="1" fill="#fde047"/>

    <!-- Hanging Pendant Warm Lights -->
    <path d="M 120 0 L 120 40" stroke="#475569" stroke-width="2"/>
    <circle cx="120" cy="45" r="12" fill="#fbbf24" opacity="0.9"/>
    <path d="M 108 45 L 132 45 L 128 35 L 112 35 Z" fill="#334155"/>
    <!-- Light Cone -->
    <polygon points="120,45 80,180 160,180" fill="#fbbf24" opacity="0.07"/>

    <!-- Cafe Wall Shelf with Plants -->
    <rect x="140" y="60" width="70" height="6" rx="3" fill="#475569"/>
    <!-- Small Plant Pot on Shelf -->
    <path d="M 155 60 L 165 60 L 163 50 L 157 50 Z" fill="#cbd5e1"/>
    <path d="M 160 50 Q 150 40 153 35 Q 160 45 160 50 Z" fill="#10b981"/>
    <path d="M 160 50 Q 170 38 167 33 Q 160 45 160 50 Z" fill="#059669"/>

    <!-- Calendar on wall hinting at 'tomorrow' / planning -->
    <rect x="180" y="75" width="22" height="26" rx="2" fill="#f8fafc"/>
    <rect x="180" y="75" width="22" height="8" fill="#ef4444"/>
    <line x1="185" y1="90" x2="197" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="185" y1="95" x2="193" y2="95" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Circle highlighting a date -->
    <circle cx="195" cy="92" r="3" fill="none" stroke="#ef4444" stroke-width="1"/>
  </g>

  <!-- Cafe Table -->
  <path d="M 70 170 L 170 170 L 185 205 L 55 205 Z" fill="url(#desk-grad)"/>
  <ellipse cx="120" cy="170" rx="50" ry="12" fill="#475569"/>

  <!-- Table Props: Coffee Cups & Calendar/Planner -->
  <g id="table-props">
    <!-- Coffee Cup Left -->
    <rect x="85" y="158" width="12" height="15" rx="3" fill="#f8fafc"/>
    <path d="M 97 162 C 101 162 101 169 97 169" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <ellipse cx="91" cy="158" rx="6" ry="2" fill="#e2e8f0"/>
    <path d="M 88 158 Q 91 156 94 158" fill="#78350f"/>

    <!-- Coffee Cup Right -->
    <rect x="140" y="158" width="12" height="15" rx="3" fill="#38bdf8"/>
    <path d="M 137 162 C 133 162 133 169 137 169" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="146" cy="158" rx="6" ry="2" fill="#7dd3fc"/>
    <path d="M 143 158 Q 146 156 149 158" fill="#78350f"/>

    <!-- Small Planner / Notebook open on table -->
    <path d="M 105 167 L 125 165 L 130 177 L 110 179 Z" fill="#facc15"/>
    <line x1="112" y1="171" x2="122" y2="170" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="113" y1="174" x2="120" y2="173" stroke="#ca8a04" stroke-width="1.5"/>
  </g>

  <!-- Character 1 (Left - Woman pointing forward cheerfully, setting the appointment) -->
  <g id="character-left">
    <!-- Torso & Shoulders -->
    <path d="M 65 170 C 65 140 85 140 90 140 C 95 140 115 140 115 170 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="85" cy="115" r="16" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 68 115 C 68 95 102 95 102 115 C 102 125 98 135 95 135 C 92 135 90 120 85 120 C 80 120 78 135 75 135 C 72 135 68 125 68 115 Z" fill="#334155"/>
    <!-- Expressive Face (Smiling eyes, open happy mouth) -->
    <circle cx="80" cy="113" r="1.5" fill="#1e293b"/>
    <circle cx="90" cy="113" r="1.5" fill="#1e293b"/>
    <path d="M 83 118 Q 85 121 87 118" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Raised Arm pointing / gesturing 'tomorrow' -->
    <path d="M 90 145 C 95 130 110 125 115 130 C 118 133 115 137 110 135 C 105 133 100 140 95 148 Z" fill="#fcd34d"/>
    <!-- Hand / Finger pointing -->
    <circle cx="117" cy="130" r="3" fill="#fcd34d"/>
  </g>

  <!-- Character 2 (Right - Man nodding/listening eagerly, agreeing to meet) -->
  <g id="character-right">
    <!-- Torso & Shoulders -->
    <path d="M 125 170 C 125 140 145 140 150 140 C 155 140 175 140 175 170 Z" fill="#3b82f6"/>
    <!-- Head (slightly tilted indicating agreement) -->
    <circle cx="155" cy="113" r="16" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 139 113 C 139 98 171 98 171 113 C 171 118 168 120 165 120 C 155 115 145 115 141 120 C 139 120 139 116 139 113 Z" fill="#1e293b"/>
    <!-- Face -->
    <circle cx="150" cy="111" r="1.5" fill="#1e293b"/>
    <circle cx="160" cy="111" r="1.5" fill="#1e293b"/>
    <!-- Happy smile -->
    <path d="M 153 116 Q 155 119 157 116" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm gesturing back or holding cup -->
    <path d="M 145 145 C 140 155 135 155 132 150" fill="none" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Subtle Action/Dialogue visual cue: sparkling interaction dots representing a plan being made -->
  <g opacity="0.8">
    <path d="M 115 95 Q 120 85 125 95" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="2,3"/>
    <polygon points="120,80 122,85 125,82 122,84" fill="#fbbf24"/>
    <polygon points="135,100 137,103 140,101 137,102" fill="#38bdf8"/>
    <polygon points="105,105 107,107 109,105 107,106" fill="#ec4899"/>
  </g>
</svg>