<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window City Glow Gradient -->
    <linearGradient id="cityGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Desk & Interior Shadows -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Filter for soft glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & BACKGROUND -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b"/>

  <!-- Large Studio Window with Cityscape Silhouette -->
  <g id="window">
    <rect x="110" y="35" width="95" height="100" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- City Buildings Silhouette inside window -->
    <path d="M120 135 L120 85 L135 70 L135 135 Z" fill="#1e293b"/>
    <path d="M140 135 L140 60 L160 50 L160 135 Z" fill="#1e293b"/>
    <path d="M165 135 L165 95 L180 80 L195 90 L195 135 Z" fill="#1e293b"/>
    <!-- Glowing city windows dots -->
    <circle cx="127" cy="95" r="1" fill="#38bdf8"/>
    <circle cx="127" cy="105" r="1" fill="#38bdf8"/>
    <circle cx="150" cy="70" r="1" fill="#f59e0b"/>
    <circle cx="150" cy="85" r="1" fill="#f59e0b"/>
    <circle cx="155" cy="75" r="1" fill="#38bdf8"/>
    <circle cx="180" cy="100" r="1" fill="#f59e0b"/>
    <!-- Window Light Wash -->
    <rect x="110" y="35" width="95" height="100" fill="url(#cityGlow)" pointer-events="none"/>
  </g>

  <!-- Hanging Diplomas / Achievement Certificates on Wall -->
  <g id="certificates" transform="translate(35, 45)">
    <!-- Frame 1 -->
    <rect x="0" y="0" width="28" height="36" rx="2" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <rect x="3" y="3" width="22" height="30" fill="#f8fafc"/>
    <line x1="6" y1="8" x2="22" y2="8" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="6" y1="14" x2="18" y2="14" stroke="#94a3b8" stroke-width="1"/>
    <line x1="6" y1="18" x2="15" y2="18" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="14" cy="26" r="4" fill="#f59e0b"/>

    <!-- Frame 2 (Slightly overlapping) -->
    <g transform="translate(32, 8)">
      <rect x="0" y="0" width="32" height="26" rx="2" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
      <rect x="3" y="3" width="26" height="20" fill="#f8fafc"/>
      <line x1="6" y1="8" x2="26" y2="8" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="6" y1="13" x2="20" y2="13" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="22" cy="17" r="3" fill="#10b981"/>
    </g>
  </g>

  <!-- Spotlight Cone shining down on the successful character -->
  <polygon points="120,0 20,200 220,200" fill="url(#spotlight)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Bookshelf Background Props -->
  <g id="bookshelf" transform="translate(20, 95)">
    <rect x="0" y="0" width="75" height="8" fill="#334155" rx="1"/>
    <!-- Stack of Books -->
    <path d="M10 0 L10 -18 L32 -18 L32 0 Z" fill="#ef4444"/>
    <path d="M12 -4 L30 -4" stroke="#991b1b" stroke-width="2"/>
    <path d="M8 -18 L8 -32 L30 -32 L30 -18 Z" fill="#3b82f6"/>
    <path d="M10 -22 L28 -22" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Small Plant on Shelf -->
    <path d="M50 0 L50 -12 C50 -18 62 -18 62 -12 L62 0 Z" fill="#10b981"/>
    <circle cx="53" cy="-16" r="5" fill="#34d399"/>
    <circle cx="59" cy="-18" r="6" fill="#059669"/>
    <circle cx="56" cy="-22" r="5" fill="#34d399"/>
  </g>

  <!-- DESK & FOREGROUND PROPS -->
  <rect x="0" y="165" width="240" height="75" fill="url(#deskGrad)"/>
  <!-- Desk Top Edge Highlight -->
  <rect x="0" y="165" width="240" height="4" fill="#475569"/>

  <!-- Desk Props: Laptop, Modern Lamp, Successful Project Papers -->
  <!-- Open Laptop -->
  <g transform="translate(135, 135)">
    <!-- Screen Base / Back -->
    <path d="M0 30 L5 0 L35 0 L40 30 Z" fill="#64748b"/>
    <!-- Screen Display -->
    <path d="M3 27 L7 3 L33 3 L37 27 Z" fill="#0f172a"/>
    <!-- UI graphics on screen (Success chart going up) -->
    <polyline points="9,22 15,18 22,20 31,8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="31" cy="8" r="2" fill="#10b981"/>
    <!-- Keyboard Base -->
    <path d="M-10 32 L50 32 L45 39 L-5 39 Z" fill="#94a3b8"/>
  </g>

  <!-- Sleek Modern Desk Lamp -->
  <g transform="translate(45, 165)">
    <ellipse cx="0" cy="0" rx="12" ry="4" fill="#475569"/>
    <path d="M0 0 L-2 -35 L12 -55" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 -58 L20 -53 L15 -48 Z" fill="#f59e0b" filter="url(#glow)"/>
    <!-- Light beam from lamp -->
    <polygon points="12,-53 -10,165 40,165" fill="#f59e0b" opacity="0.12" pointer-events="none"/>
  </g>

  <!-- Glowing Trophy of Success -->
  <g id="trophy" transform="translate(90, 125)">
    <!-- Base -->
    <rect x="-8" y="35" width="16" height="5" rx="1" fill="#334155"/>
    <rect x="-5" y="32" width="10" height="3" fill="#64748b"/>
    <!-- Stem -->
    <rect x="-2" y="24" width="4" height="8" fill="url(#goldGrad)"/>
    <!-- Cup Body -->
    <path d="M-12 5 C-12 20 12 20 12 5 L10 2 C10 -2 -10 -2 -10 2 Z" fill="url(#goldGrad)"/>
    <!-- Handles -->
    <path d="M-10 6 C-18 6 -18 16 -10 16" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 6 C18 6 18 16 10 16" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <!-- Star Emblem on Trophy -->
    <polygon points="0,7 2,11 6,11 3,13 4,17 0,15 -4,17 -3,13 -6,11 -2,11" fill="#fef08a"/>
    <!-- Glow effect behind trophy -->
    <circle cx="0" cy="10" r="18" fill="#f59e0b" opacity="0.25" filter="url(#glow)"/>
  </g>

  <!-- MAIN CHARACTER (Successful, confident professional/entrepreneur) -->
  <g id="character" transform="translate(85, 55)">
    <!-- Body / Torso (Confident leaning back / triumphant posture) -->
    <!-- Chair Back -->
    <path d="M-25 15 C-25 -5 -15 -10 -5 -10 L15 -10 C25 -10 35 -5 35 15 L30 90 L-20 90 Z" fill="#334155"/>
    <path d="M-20 20 L30 20 L27 85 L-17 85 Z" fill="#1e293b"/>

    <!-- Character Outfit (Smart Casual Blazer & Shirt) -->
    <!-- Arms (Stretched out happily / triumphantly) -->
    <!-- Left Arm (bent up) -->
    <path d="M-15 45 C-30 40 -40 25 -35 15" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
    <!-- Left Hand -->
    <circle cx="-35" cy="13" r="5" fill="#fbcfe8"/>

    <!-- Right Arm (relaxed or raised) -->
    <path d="M25 45 C40 45 45 30 50 20" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Hand -->
    <circle cx="52" cy="17" r="5" fill="#fbcfe8"/>

    <!-- Torso (Blazer) -->
    <path d="M-18 35 C-18 30 -10 25 0 25 C10 25 18 30 18 35 L22 90 L-22 90 Z" fill="#2563eb"/>
    <!-- Inner Shirt & Tie -->
    <polygon points="-6,25 6,25 4,50 -4,50" fill="#f8fafc"/>
    <polygon points="-2,30 2,30 3,45 0,48 -3,45" fill="#ef4444"/>

    <!-- Neck -->
    <rect x="-4" y="18" width="8" height="10" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <circle cx="0" cy="3" r="18" fill="#fbcfe8"/>

    <!-- Hair (Stylish modern hairstyle) -->
    <path d="M-18 0 C-18 -12 -5 -16 5 -15 C16 -14 19 -5 18 3 C15 -2 10 -6 2 -6 C-7 -6 -14 -1 -18 0 Z" fill="#1e293b"/>

    <!-- Facial Expression: Big Happy Smile, Confident Eyes -->
    <!-- Happy curved eyes -->
    <path d="M-7 -1 C-5 -3 -3 -3 -1 -1" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M3 -1 C5 -3 7 -3 9 -1" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyebrows (Confident upturn) -->
    <path d="M-8 -5 C-5 -7 -2 -6 -1 -5" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M3 -5 C4 -6 7 -7 10 -5" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Warm Confident Smile -->
    <path d="M-5 6 C-3 10 3 10 5 6" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="-10" cy="4" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="10" cy="4" r="3" fill="#f43f5e" opacity="0.3"/>
  </g>

  <!-- CELEBRATORY SPARKLES / DUST PARTICLES -->
  <g id="sparkles" fill="#fef08a">
    <path d="M70 45 L72 50 L77 52 L72 54 L70 59 L68 54 L63 52 L68 50 Z" transform="scale(0.6) translate(50, 10)" opacity="0.9"/>
    <path d="M70 45 L72 50 L77 52 L72 54 L70 59 L68 54 L63 52 L68 50 Z" transform="scale(0.8) translate(150, 20)" opacity="0.8"/>
    <path d="M70 45 L72 50 L77 52 L72 54 L70 59 L68 54 L63 52 L68 50 Z" transform="scale(0.5) translate(220, 90)" opacity="0.7"/>
    <circle cx="55" cy="40" r="1.5" fill="#38bdf8"/>
    <circle cx="185" cy="65" r="2" fill="#f59e0b"/>
    <circle cx="170" cy="35" r="1" fill="#34d399"/>
    <circle cx="95" cy="30" r="1.5" fill="#f43f5e"/>
  </g>
</svg>