<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container & Environment -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="cabinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Stars & Sky Context -->
  <circle cx="35" cy="40" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="70" cy="25" r="1.5" fill="#f1f5f9" opacity="0.8"/>
  <circle cx="110" cy="50" r="1" fill="#94a3b8" opacity="0.5"/>
  <circle cx="180" cy="30" r="1.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="210" cy="65" r="1" fill="#94a3b8" opacity="0.7"/>

  <!-- Distant Island with Palm Trees -->
  <path d="M165,115 Q185,95 215,100 Q235,105 240,115 Z" fill="#0f766e" opacity="0.7"/>
  <path d="M195,102 Q198,85 200,75 Q203,85 207,100 Z" fill="#115e59" />
  <path d="M185,105 Q180,95 173,90 Q182,97 186,106 Z" fill="#115e59" />

  <!-- Sea Layer -->
  <path d="M0,115 C60,105 120,125 240,115 L240,240 L0,240 Z" fill="url(#seaGrad)" />

  <!-- Gentle Waves in background -->
  <path d="M10,130 Q30,125 50,130 T90,130 T130,130 T170,130 T210,130 T230,130" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  <path d="M0,145 Q25,140 50,145 T100,145 T150,145 T200,145 T240,145" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />

  <!-- THE BOAT / SHIP (船) -->
  <!-- Wake behind boat -->
  <path d="M40,175 Q60,170 90,175" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M30,185 Q55,178 85,185" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Hull -->
  <path d="M35,160 L205,160 Q225,160 215,190 Q200,210 120,210 Q40,210 25,190 Q15,160 35,160 Z" fill="url(#hullGrad)" />
  <!-- Hull Stripe / Accent -->
  <path d="M28,175 L212,175 Q218,175 214,185 Q200,198 120,198 Q40,198 26,185 Q22,175 28,175 Z" fill="#fbbf24" />

  <!-- Cabin / Deck Structure -->
  <rect x="75" y="125" width="90" height="35" rx="6" fill="url(#cabinGrad)" stroke="#cbd5e1" stroke-width="2" />
  <!-- Cabin Windows -->
  <rect x="87" y="133" width="16" height="16" rx="3" fill="#0ea5e9" />
  <rect x="112" y="133" width="16" height="16" rx="3" fill="#0ea5e9" />
  <rect x="137" y="133" width="16" height="16" rx="3" fill="#0ea5e9" />

  <!-- Roof & Mast / Flag -->
  <path d="M70,125 L170,125 L160,110 L80,110 Z" fill="#0284c7" />
  <line x1="120" y1="110" x2="120" y2="85" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <polygon points="120,87 145,95 120,103" fill="#f43f5e" />

  <!-- Passengers on Deck (Real Human Situation: Traveling to the island) -->
  <!-- Character 1 (Left - pointing at island) -->
  <circle cx="55" cy="148" r="8" fill="#ffedd5" /> <!-- Head -->
  <path d="M47,144 Q55,138 61,145 Z" fill="#334155" /> <!-- Hair -->
  <path d="M48,156 L62,156 L65,178 L45,178 Z" fill="#10b981" /> <!-- Shirt -->
  <!-- Arm pointing -->
  <path d="M58,160 Q75,150 85,155" fill="none" stroke="#ffedd5" stroke-width="4" stroke-linecap="round" />

  <!-- Character 2 (Right - smiling with backpack) -->
  <circle cx="185" cy="145" r="8" fill="#ffedd5" /> <!-- Head -->
  <path d="M178,141 Q185,135 192,143 Z" fill="#b45309" /> <!-- Hair -->
  <path d="M178,153 L192,153 L195,178 L175,178 Z" fill="#3b82f6" /> <!-- Shirt -->
  <!-- Backpack strap visible -->
  <path d="M180,155 L175,170" stroke="#78350f" stroke-width="3" />

  <!-- Foreground Waves (Dynamic movement) -->
  <path d="M0,205 Q40,195 80,205 T160,205 T240,205 L240,240 L0,240 Z" fill="#0284c7" opacity="0.6"/>
  <path d="M0,215 Q60,205 120,215 T240,215 L240,240 L0,240 Z" fill="#0369a1" />

  <!-- Foam splashes near boat -->
  <circle cx="25" cy="195" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="18" cy="190" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="215" cy="195" r="3.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="223" cy="190" r="2" fill="#ffffff" opacity="0.7"/>
  <path d="M15,198 Q20,193 25,198" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <path d="M213,198 Q218,193 223,198" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Seagulls in the sky -->
  <path d="M85,65 Q92,58 100,65 Q108,58 115,65" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M135,50 Q140,45 146,50 Q152,45 158,50" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

</svg>