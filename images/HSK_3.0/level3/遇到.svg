<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Streetlamp Glow Effect -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Clothing Gradients -->
    <linearGradient id="jacket1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Clothing Gradients -->
    <linearGradient id="jacket2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Surprise Action Effect Lines -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & PROPS: Urban Street Corner Context -->
  <g id="environment">
    <!-- Distant City Skyline Silhouette -->
    <path d="M 0 160 L 0 240 L 240 240 L 240 140 L 220 140 L 220 120 L 205 120 L 205 140 L 175 140 L 175 100 L 155 100 L 155 140 L 130 140 L 130 160 L 100 160 L 100 110 L 70 110 L 70 160 L 45 160 L 45 130 L 25 130 L 25 160 Z" fill="#162032"/>
    
    <!-- Brick Wall / Building Facade (Left) -->
    <path d="M 0 60 L 65 80 L 65 240 L 0 240 Z" fill="#1b263b"/>
    <!-- Window with warm light -->
    <rect x="15" y="90" width="35" height="45" rx="4" fill="#334155"/>
    <rect x="20" y="95" width="11" height="18" rx="2" fill="#f59e0b" opacity="0.8"/>
    <rect x="34" y="95" width="11" height="18" rx="2" fill="#f59e0b" opacity="0.8"/>
    <rect x="20" y="117" width="11" height="18" rx="2" fill="#38bdf8" opacity="0.4"/>
    <rect x="34" y="117" width="11" height="18" rx="2" fill="#f59e0b" opacity="0.8"/>
    
    <!-- Potted Plant Prop -->
    <path d="M 50 200 L 60 200 L 65 240 L 45 240 Z" fill="#cbd5e1"/>
    <ellipse cx="55" cy="200" rx="7" ry="3" fill="#94a3b8"/>
    <path d="M 55 197 Q 40 185 35 170 Q 55 185 55 197 Z" fill="#10b981"/>
    <path d="M 55 197 Q 70 180 75 165 Q 55 185 55 197 Z" fill="#059669"/>
    <path d="M 55 197 Q 55 170 52 160 Q 58 175 55 197 Z" fill="#34d399"/>

    <!-- Streetlamp Pole and Light Source -->
    <rect x="195" y="40" width="8" height="200" fill="#334155"/>
    <path d="M 199 40 L 199 15 L 180 15 L 180 25 L 195 25" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lamp Glow Circle -->
    <circle cx="180" cy="35" r="50" fill="url(#lampGlow)"/>
    <ellipse cx="180" cy="25" rx="8" ry="5" fill="#fbbf24"/>

    <!-- Ground / Sidewalk -->
    <rect x="0" y="210" width="240" height="30" fill="#0b1329"/>
    <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2"/>
    <!-- Pavement blocks perspective lines -->
    <line x1="120" y1="210" x2="100" y2="240" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="120" y1="210" x2="160" y2="240" stroke="#1e293b" stroke-width="1.5"/>
  </g>

  <!-- ACTION & CHARACTERS: "Yùdào" (Sudden Unexpected Meet-up) -->
  <g id="characters" filter="url(#softShadow)">
    
    <!-- Character 1 (Left - Male holding coffee/bag, halting in surprise) -->
    <g id="character-male">
      <!-- Shadow -->
      <ellipse cx="85" cy="214" rx="18" ry="5" fill="#020617" opacity="0.6"/>
      
      <!-- Legs & Shoes -->
      <path d="M 75 160 L 72 212 L 82 212 L 84 175 Z" fill="#1e293b"/>
      <path d="M 92 160 L 98 212 L 108 210 L 98 175 Z" fill="#1e293b"/>
      <ellipse cx="78" cy="213" rx="7" ry="3" fill="#0f172a"/>
      <ellipse cx="104" cy="211" rx="7" ry="3" fill="#0f172a"/>

      <!-- Torso / Jacket -->
      <path d="M 70 125 L 105 125 L 100 165 L 75 165 Z" fill="url(#jacket1)"/>
      <!-- Inner Shirt & Zipper Detail -->
      <path d="M 85 125 L 90 125 L 89 165 L 86 165 Z" fill="#bae6fd"/>
      <path d="M 78 135 L 84 135" stroke="#0284c7" stroke-width="2"/>
      <path d="M 78 145 L 84 145" stroke="#0284c7" stroke-width="2"/>

      <!-- Back Arm (Holding prop) -->
      <path d="M 72 130 L 55 145 L 60 155" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Prop: Shopping Bag / Briefcase -->
      <rect x="45" y="150" width="18" height="22" rx="3" fill="#f59e0b"/>
      <path d="M 50 150 C 50 145 58 145 58 150" fill="none" stroke="#b45309" stroke-width="2"/>

      <!-- Front Arm (Gesture of surprise - raised hand) -->
      <path d="M 100 130 C 115 120 120 135 115 140" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="116" cy="141" r="5" fill="#fcd34d"/>

      <!-- Head & Face -->
      <path d="M 80 112 C 80 98 100 98 100 112 Z" fill="#fb923c"/> <!-- Hair -->
      <circle cx="90" cy="112" r="11" fill="#fcd34d"/> <!-- Face Skin -->
      
      <!-- Expressive Eyes (Wide open in surprise) -->
      <circle cx="94" cy="110" r="2" fill="#1e293b"/>
      <!-- Open Surprised Mouth "O" -->
      <ellipse cx="94" cy="117" rx="2.5" ry="3.5" fill="#991b1b"/>
      <!-- Cute Rosy Cheek -->
      <circle cx="97" cy="114" r="2" fill="#f43f5e" opacity="0.6"/>
    </g>

    <!-- Character 2 (Right - Female stopping abruptly, leaning forward with joy) -->
    <g id="character-female">
      <!-- Shadow -->
      <ellipse cx="145" cy="214" rx="16" ry="5" fill="#020617" opacity="0.6"/>

      <!-- Legs & Boots -->
      <path d="M 137 160 L 135 212 L 145 212 L 144 175 Z" fill="#334155"/>
      <path d="M 150 160 L 158 210 L 168 208 L 155 175 Z" fill="#334155"/>
      <ellipse cx="140" cy="213" rx="6" ry="3" fill="#0f172a"/>
      <ellipse cx="163" cy="209" rx="6" ry="3" fill="#0f172a"/>

      <!-- Torso / Jacket -->
      <path d="M 130 122 L 160 125 L 155 165 L 135 165 Z" fill="url(#jacket2)"/>
      <path d="M 142 123 L 148 123 L 146 165 L 143 165 Z" fill="#fbcfe8"/>

      <!-- Back Arm / Hand on Hip or waving -->
      <path d="M 133 130 C 120 135 118 150 125 155" fill="none" stroke="#be185d" stroke-width="7" stroke-linecap="round"/>
      <circle cx="126" cy="156" r="4.5" fill="#fcd34d"/>

      <!-- Front Arm (Pointing/Waving in joyous recognition) -->
      <path d="M 158 130 C 172 125 178 138 172 142" fill="none" stroke="#ec4899" stroke-width="7" stroke-linecap="round"/>
      <circle cx="173" cy="143" r="4.5" fill="#fcd34d"/>

      <!-- Head & Hair (Dynamic bob cut flying forward) -->
      <!-- Hair Back -->
      <path d="M 138 105 C 130 100 135 125 145 125 Z" fill="#475569"/>
      <!-- Face Skin -->
      <circle cx="146" cy="110" r="11" fill="#fcd34d"/>
      <!-- Hair Front & Bangs -->
      <path d="M 136 106 C 140 95 155 98 156 110 C 150 105 142 105 136 106 Z" fill="#475569"/>
      
      <!-- Happy Smiling Eyes (Crescent shapes) -->
      <path d="M 147 108 Q 150 111 153 108" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Big Joyful Open Smile -->
      <path d="M 146 114 Q 150 119 154 114" fill="#991b1b"/>
      <path d="M 146 114 Q 150 119 154 114 Z" fill="#f87171"/>
      <!-- Cute Rosy Cheek -->
      <circle cx="152" cy="113" r="2" fill="#f43f5e" opacity="0.6"/>
    </g>

  </g>

  <!-- DYNAMIC ACTION EFFECTS (Emphasizing the surprise meeting/encounter) -->
  <g id="action-effects">
    <!-- Sparkles / Exclamation of Surprise between them -->
    <path d="M 115 90 L 118 98 L 126 101 L 118 104 L 115 112 L 112 104 L 104 101 L 112 98 Z" fill="url(#sparkleGrad)"/>
    <path d="M 130 80 L 132 85 L 137 87 L 132 89 L 130 94 L 128 89 L 123 87 L 128 85 Z" fill="#38bdf8" opacity="0.8"/>
    <circle cx="102" cy="90" r="3" fill="#fbbf24"/>
    <circle cx="138" cy="105" r="2" fill="#ec4899"/>

    <!-- Motion lines behind Character 2 showing sudden stop -->
    <path d="M 170 115 L 182 113" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 175 122 L 188 120" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 172 130 L 180 129" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Motion lines behind Character 1 -->
    <path d="M 68 115 L 58 113" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 65 123 L 52 121" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- FOREGROUND FRAME TOUCHES (Adds depth) -->
  <g id="foreground-elements" opacity="0.3">
    <!-- Out-of-focus leaf hanging from top corner -->
    <path d="M 0 0 Q 30 10 20 30 Q 10 20 0 0 Z" fill="#10b981"/>
    <!-- Soft ambient lighting overlay -->
    <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.05"/>
  </g>
</svg>