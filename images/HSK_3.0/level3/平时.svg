<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Morning Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="60" cy="50" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Desk Lamp Light -->
    <radialGradient id="lampLight" cx="120" cy="110" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>

    <!-- Window Frame Shadow -->
    <linearGradient id="windowShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="60" cy="40" r="120" fill="url(#sunGlow)"/>

  <!-- WINDOW & MORNING SCENERY (Background Context) -->
  <g transform="translate(14, 25)">
    <!-- Window Outer Frame -->
    <rect x="0" y="0" width="70" height="100" rx="6" fill="#334155" filter="url(#shadow)"/>
    <rect x="4" y="4" width="62" height="92" rx="4" fill="url(#windowShadow)"/>
    
    <!-- Morning Sky in Window -->
    <rect x="6" y="6" width="58" height="88" fill="#1e1b4b"/>
    <path d="M6 50 Q35 30 64 45 L64 94 L6 94 Z" fill="#312e81"/>
    <!-- Rising Sun -->
    <circle cx="35" cy="55" r="14" fill="#fbbf24" filter="url(#glow)"/>
    
    <!-- Window Panes Cross -->
    <rect x="33" y="6" width="4" height="88" fill="#334155"/>
    <rect x="6" y="48" width="58" height="4" fill="#334155"/>
    
    <!-- Window Sill -->
    <rect x="-3" y="96" width="76" height="8" rx="2" fill="#475569"/>
  </g>

  <!-- ROOM INTERIOR & DESK SETUP -->
  <!-- Back Wall Line / Baseboard -->
  <rect x="0" y="165" width="240" height="75" fill="#0f172a"/>
  <line x1="0" y1="165" x2="240" y2="165" stroke="#334155" stroke-width="2"/>

  <!-- Wooden Desk Surface -->
  <g filter="url(#shadow)">
    <path d="M10 170 L230 170 L220 225 L20 225 Z" fill="#b45309"/>
    <path d="M10 170 L230 170 L230 176 L10 176 Z" fill="#d97706"/> <!-- Desk Edge Highlight -->
    <path d="M15 176 L225 176 L216 220 L24 220 Z" fill="#92400e"/> <!-- Desk Top Inner -->
  </g>

  <!-- POTTED PLANT (Daily Routine Element - Life/Growth) -->
  <g transform="translate(25, 115)">
    <!-- Pot -->
    <path d="M6 35 L18 52 C19 54 22 54 23 52 L35 35 Z" fill="#e2e8f0" filter="url(#shadow)"/>
    <ellipse cx="20" cy="35" rx="14" ry="3" fill="#cbd5e1"/>
    <!-- Leaves -->
    <path d="M20 35 Q10 20 2 25 Q10 32 20 35 Z" fill="url(#leafGrad)"/>
    <path d="M20 35 Q30 15 42 22 Q30 30 20 35 Z" fill="url(#leafGrad)"/>
    <path d="M20 35 Q20 5 20 2 Q22 15 20 35 Z" fill="#10b981"/>
  </g>

  <!-- DESK LAMP (Warm Daily Atmosphere) -->
  <g transform="translate(180, 85)">
    <!-- Lamp Light Cone Effect -->
    <path d="M0 25 L-50 100 L50 100 Z" fill="url(#lampLight)" style="mix-blend-mode: screen;"/>
    
    <!-- Lamp Stand & Base -->
    <ellipse cx="0" cy="50" rx="16" ry="6" fill="#64748b"/>
    <path d="M-4 50 L-10 10 C-10 5 -5 0 0 0 C5 0 10 5 10 10 L4 50 Z" fill="#475569"/>
    <!-- Lamp Shade -->
    <path d="M-22 5 L22 5 L14 -12 L-14 -12 Z" fill="#38bdf8" filter="url(#shadow)"/>
    <ellipse cx="0" cy="5" rx="14" ry="4" fill="#0ea5e9"/>
  </g>

  <!-- CENTRAL PROP: THE DAILY PLANNER & ALARM CLOCK (Symbolizing 'Routine/Everyday') -->
  <!-- Open Planner/Journal on Desk -->
  <g transform="translate(75, 135)" filter="url(#shadow)">
    <!-- Book Shadow Base -->
    <path d="M0 20 C25 10 65 10 90 20 L85 65 C60 55 25 55 5 65 Z" fill="#0f172a" opacity="0.4"/>
    
    <!-- Left Page -->
    <path d="M5 15 C25 8 50 8 75 18 L70 58 C45 48 25 48 5 55 Z" fill="#f8fafc"/>
    <!-- Right Page -->
    <path d="M75 18 C100 8 125 8 145 15 L145 55 C125 48 100 48 75 58 Z" fill="#f8fafc"/>
    <!-- Center Spine Binding -->
    <path d="M73 17 L77 17 L72 58 L76 58 Z" fill="#cbd5e1"/>

    <!-- Content Lines & Checkboxes on Planner (Visualizing Habit/Routine) -->
    <!-- Left Page Marks -->
    <rect x="15" y="24" width="6" height="6" rx="1" fill="#38bdf8"/>
    <line x1="26" y1="27" x2="55" y2="27" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    
    <rect x="15" y="36" width="6" height="6" rx="1" fill="#38bdf8"/>
    <line x1="26" y1="39" x2="48" y2="39" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Page Marks & Tiny Coffee Cup Doodle -->
    <rect x="85" y="24" width="6" height="6" rx="1" fill="#10b981"/>
    <line x1="96" y1="27" x2="125" y2="27" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <circle cx="115" cy="42" r="6" fill="#f59e0b"/>
  </g>

  <!-- STYLISH ALARM CLOCK (Routine Time Marker) -->
  <g transform="translate(130, 95)" filter="url(#shadow)">
    <!-- Bells & Feet -->
    <circle cx="12" cy="5" r="5" fill="#94a3b8"/>
    <circle cx="38" cy="5" r="5" fill="#94a3b8"/>
    <rect x="14" y="40" width="6" height="5" rx="2" fill="#64748b"/>
    <rect x="30" y="40" width="6" height="5" rx="2" fill="#64748b"/>
    
    <!-- Clock Body -->
    <circle cx="25" cy="22" r="18" fill="#f43f5e"/>
    <circle cx="25" cy="22" r="15" fill="#ffffff"/>
    
    <!-- Clock Hands (Pointing at 7:00 - Morning Routine) -->
    <circle cx="25" cy="22" r="1.5" fill="#1e293b"/>
    <line x1="25" y1="22" x2="25" y2="12" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Hour hand -->
    <line x1="25" y1="22" x2="33" y2="22" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/> <!-- Minute hand -->
    
    <!-- Clock Details -->
    <line x1="25" y1="9" x2="25" y2="11" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="25" y1="33" x2="25" y2="35" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="12" y1="22" x2="14" y2="22" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="36" y1="22" x2="38" y2="22" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- STEAMING COFFEE MUG (Warm Morning Habit) -->
  <g transform="translate(45, 118)" filter="url(#shadow)">
    <!-- Mug Handle -->
    <path d="M28 10 C38 10 38 28 28 28" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <!-- Mug Body -->
    <path d="M6 4 C6 2 24 2 24 4 L22 32 C22 35 8 35 8 32 Z" fill="#fb923c"/>
    <ellipse cx="15" cy="4" rx="9" ry="3" fill="#fdba74"/>
    <ellipse cx="15" cy="6" rx="7" ry="2" fill="#78350f"/> <!-- Coffee liquid -->
    
    <!-- Steam Rising -->
    <path d="M12 -2 Q15 -8 10 -14 Q5 -20 12 -26" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M20 0 Q23 -6 18 -12 Q13 -18 20 -24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- FOREGROUND ACCENTS / DEPTH -->
  <!-- Floating Morning Sparkles / Dust motes -->
  <circle cx="100" cy="80" r="2" fill="#fef08a" opacity="0.8" filter="url(#glow)"/>
  <circle cx="160" cy="60" r="1.5" fill="#fef08a" opacity="0.6" filter="url(#glow)"/>
  <circle cx="65" cy="100" r="2.5" fill="#fef08a" opacity="0.5" filter="url(#glow)"/>

  <!-- Outer Rounded Border Frame for polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>