<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Counter Glow -->
    <radialGradient id="counter-glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Cup Gradient -->
    <linearGradient id="cup-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Coin Gold Gradient -->
    <linearGradient id="coin-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Shelf & Interior Accents -->
    <linearGradient id="wood-shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting / Glow -->
  <circle cx="120" cy="140" r="100" fill="url(#counter-glow)" />

  <!-- BACKGROUND ENVIRONMENT: Cozy Shop Interior -->
  <g id="background-shop">
    <!-- Back wall shelf line -->
    <rect x="20" y="60" width="200" height="4" rx="2" fill="#334155" />
    
    <!-- Background mugs on shelf -->
    <rect x="35" y="38" width="16" height="22" rx="3" fill="#64748b" />
    <path d="M51 43 H55 C57 43 57 49 55 49 H51" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" />
    
    <rect x="65" y="34" width="18" height="26" rx="3" fill="#f43f5e" />
    <path d="M83 40 H86 C89 40 89 46 86 46 H83" stroke="#f43f5e" stroke-width="2" fill="none" stroke-linecap="round" />

    <rect x="180" y="36" width="20" height="24" rx="3" fill="#10b981" />
    <path d="M175 42 H172 C169 42 169 48 172 48 H175" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Warm soft hanging lamp -->
    <path d="M120 0 V25" stroke="#475569" stroke-width="2" />
    <path d="M100 25 H140 L145 35 H95 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M120 35 L120 45" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND & MIDGROUND: Store Counter -->
  <g id="counter">
    <rect x="0" y="170" width="240" height="70" fill="#0f172a" />
    <rect x="0" y="165" width="240" height="8" rx="2" fill="#475569" />
    <!-- Cash register indicator stripe -->
    <rect x="20" y="180" width="40" height="6" rx="3" fill="#334155" />
    <circle cx="28" cy="183" r="2" fill="#10b981" />
  </g>

  <!-- MAIN SUBJECT: The Ceramic Cup (这个杯子 - "This cup") -->
  <g id="ceramic-cup" transform="translate(60, 110)">
    <!-- Cup Body shadow -->
    <ellipse cx="25" cy="58" rx="20" ry="6" fill="#000000" opacity="0.3" />
    
    <!-- Cup Main Body -->
    <path d="M10 5 L40 5 L37 50 C37 55 33 58 25 58 C17 58 13 55 13 50 Z" fill="url(#cup-grad)" />
    
    <!-- Cup Rim -->
    <ellipse cx="25" cy="5" rx="15" ry="4" fill="#7dd3fc" />
    <ellipse cx="25" cy="5" rx="12" ry="2.5" fill="#0ea5e9" />

    <!-- Cute subtle face on cup for friendly vector app style -->
    <circle cx="21" cy="28" r="1.5" fill="#0369a1" />
    <circle cx="29" cy="28" r="1.5" fill="#0369a1" />
    <path d="M24 33 Q25 35 26 33" stroke="#0369a1" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Cup Handle -->
    <path d="M37 15 C45 15 45 38 37 42" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- SHOPKEEPER / CHARACTER HAND & TRANSACTION (Three yuan and two jiao) -->
  <g id="transaction-scene">
    <!-- Customer/Cashier hand placing coins representing "two jiao / decimal change" -->
    <path d="M140 180 C140 160 155 150 170 150 C185 150 190 160 190 180" fill="#fbcfe8" opacity="0.2" />

    <!-- Coins representing money / exact amount -->
    <!-- Larger Coin (Yuan) -->
    <g transform="translate(130, 145)">
      <circle cx="12" cy="12" r="12" fill="url(#coin-grad)" stroke="#ca8a04" stroke-width="1.5" />
      <circle cx="12" cy="12" r="8" fill="none" stroke="#ca8a04" stroke-width="0.75" stroke-dasharray="2 2" />
      <rect x="10" y="7" width="4" height="10" rx="1" fill="#ca8a04" opacity="0.6" />
    </g>

    <!-- Medium Coin (Yuan) -->
    <g transform="translate(150, 138)">
      <circle cx="12" cy="12" r="12" fill="url(#coin-grad)" stroke="#ca8a04" stroke-width="1.5" />
      <circle cx="12" cy="12" r="8" fill="none" stroke="#ca8a04" stroke-width="0.75" stroke-dasharray="2 2" />
      <path d="M8 12 H16" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Another Medium Coin (Yuan) -->
    <g transform="translate(172, 142)">
      <circle cx="12" cy="12" r="12" fill="url(#coin-grad)" stroke="#ca8a04" stroke-width="1.5" />
      <circle cx="12" cy="12" r="8" fill="none" stroke="#ca8a04" stroke-width="0.75" stroke-dasharray="2 2" />
      <circle cx="12" cy="12" r="3" fill="#ca8a04" opacity="0.6" />
    </g>

    <!-- Small Coins representing the "Jiao" (角) component of the price -->
    <!-- Jiao Coin 1 -->
    <g transform="translate(138, 168)">
      <circle cx="9" cy="9" r="9" fill="url(#coin-grad)" stroke="#ca8a04" stroke-width="1" />
      <circle cx="9" cy="9" r="6" fill="none" stroke="#ca8a04" stroke-width="0.5" />
    </g>

    <!-- Jiao Coin 2 -->
    <g transform="translate(156, 172)">
      <circle cx="9" cy="9" r="9" fill="url(#coin-grad)" stroke="#ca8a04" stroke-width="1" />
      <circle cx="9" cy="9" r="6" fill="none" stroke="#ca8a04" stroke-width="0.5" />
    </g>

    <!-- Pointing / Giving Hand overlaying counter -->
    <path d="M200 180 C200 165 190 155 175 155 C165 155 160 160 155 170 L140 185 L210 200 Z" fill="#f8fafc" />
    <path d="M175 155 L160 135 C158 132 161 129 164 131 L182 150" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  </g>

  <!-- Atmospheric vector sparkle/highlights -->
  <g fill="#fbbf24" opacity="0.8">
    <path d="M145 125 L147 130 L152 132 L147 134 L145 139 L143 134 L138 132 L143 130 Z" />
    <path d="M185 120 L186 123 L189 124 L186 125 L185 128 L184 125 L181 124 L184 123 Z" transform="scale(0.7) translate(80, 40)" />
  </g>

</svg>