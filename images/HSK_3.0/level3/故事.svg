<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="window-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Character Gradients -->
    <linearGradient id="mom-shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="child-pajamas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <linearGradient id="blanket-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Canvas Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior - Wallpaper/Wall detail -->
  <path d="M0 0 H240 V190 H0 Z" fill="#1e293b" />
  
  <!-- Window with Night Sky & Moon -->
  <g transform="translate(160, 25)">
    <rect width="55" height="75" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="3" />
    <rect x="4" y="4" width="47" height="67" fill="url(#window-sky)" />
    <!-- Moon & Stars -->
    <circle cx="38" cy="20" r="8" fill="#fef08a" opacity="0.9" />
    <circle cx="15" cy="35" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="25" cy="55" r="1" fill="#ffffff" opacity="0.6" />
    <!-- Window Frame Cross -->
    <line x1="27" y1="4" x2="27" y2="71" stroke="#334155" stroke-width="2" />
    <line x1="4" y1="37" x2="51" y2="37" stroke="#334155" stroke-width="2" />
    <!-- Curtains -->
    <path d="M4 4 C10 30, 2 50, 4 71" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <path d="M51 4 C45 30, 53 50, 51 71" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Bookshelf in background -->
  <g transform="translate(20, 20)">
    <rect width="40" height="70" rx="2" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="35" x2="40" y2="35" stroke="#334155" stroke-width="2" />
    <!-- Colorful books -->
    <rect x="6" y="15" width="6" height="20" rx="1" fill="#ef4444" />
    <rect x="13" y="12" width="5" height="23" rx="1" fill="#3b82f6" />
    <rect x="19" y="16" width="8" height="19" rx="1" fill="#10b981" />
    <rect x="29" y="14" width="5" height="21" rx="1" fill="#f59e0b" />
    <rect x="6" y="48" width="7" height="22" rx="1" fill="#ec4899" />
    <rect x="14" y="50" width="10" height="20" rx="1" fill="#8b5cf6" />
  </g>

  <!-- Wooden Floor -->
  <path d="M0 190 H240 V240 H0 Z" fill="#0f172a" />
  <path d="M0 190 L240 190" stroke="#334155" stroke-width="3" />
  <!-- Floor planks perspective lines -->
  <line x1="0" y1="210" x2="240" y2="210" stroke="#172033" stroke-width="1.5" />
  <line x1="0" y1="230" x2="240" y2="230" stroke="#172033" stroke-width="1.5" />

  <!-- Warm Reading Lamp illuminating the bed scene -->
  <circle cx="130" cy="110" r="70" fill="url(#lamp-glow)" />

  <!-- Bed / Child's Mattress -->
  <g transform="translate(35, 140)">
    <!-- Bed Frame/Base -->
    <rect x="0" y="30" width="135" height="25" rx="6" fill="#334155" />
    <!-- Mattress -->
    <rect x="-5" y="15" width="145" height="25" rx="8" fill="#f8fafc" />
    
    <!-- Blanket (Folded over child) -->
    <path d="M 25 40 Q 60 10, 115 40 Z" fill="url(#blanket-grad)" filter="url(#shadow)" />
    <path d="M 20 25 Q 60 -5, 120 25 L 125 45 Q 60 20, 15 45 Z" fill="#6366f1" />

    <!-- Sleeping Child (Head & Expression) -->
    <g transform="translate(80, 2)">
      <!-- Pillow -->
      <ellipse cx="15" cy="15" rx="20" ry="12" fill="#cbd5e1" />
      <!-- Head -->
      <circle cx="15" cy="12" r="11" fill="#fbcfe8" />
      <!-- Hair -->
      <path d="M 5 10 C 5 2, 25 2, 25 10 C 22 8, 8 8, 5 10 Z" fill="#451a03" />
      <!-- Closed Happy Eyes (Arcs) -->
      <path d="M 10 13 Q 13 16, 16 13" fill="none" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 16 13 Q 19 16, 22 13" fill="none" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round" />
      <!-- Peaceful smile -->
      <path d="M 14 17 Q 16 19, 18 17" fill="none" stroke="#9d174d" stroke-width="1.2" stroke-linecap="round" />
      <!-- Cute Rosy Cheek -->
      <circle cx="11" cy="16" r="2.5" fill="#f43f5e" opacity="0.4" />
    </g>
  </g>

  <!-- Mother Character (Sitting on edge of bed, telling story) -->
  <g transform="translate(10, 105)">
    <!-- Mother's Body / Torso -->
    <path d="M 55 35 C 55 25, 75 25, 75 35 L 80 75 C 80 80, 50 80, 50 75 Z" fill="url(#mom-shirt)" filter="url(#shadow)" />
    
    <!-- Mother's Legs seated -->
    <rect x="70" y="70" width="35" height="15" rx="7" fill="#475569" />
    <path d="M 100 78 C 110 78, 115 85, 110 90 L 80 90 Z" fill="#334155" />

    <!-- Mother's Left Arm (Holding open storybook) -->
    <path d="M 60 40 C 45 50, 45 65, 55 70 C 65 75, 75 60, 70 50 Z" fill="#0284c7" />
    <!-- Hand -->
    <circle cx="53" cy="72" r="5" fill="#fbcfe8" />

    <!-- Mother's Head & Hair -->
    <g transform="translate(60, 0)">
      <!-- Hair Back/Body -->
      <path d="M -5 15 C -15 35, 25 35, 20 15 Z" fill="#1e1b4b" />
      <!-- Face -->
      <circle cx="5" cy="18" r="12" fill="#fbcfe8" />
      <!-- Hair Style / Bun / Front -->
      <path d="M -7 12 C -5 -2, 18 -2, 16 10 C 10 6, 0 6, -7 12 Z" fill="#1e1b4b" />
      <circle cx="15" cy="-2" r="5" fill="#1e1b4b" /> <!-- Cute hair bun -->
      
      <!-- Gentle Loving Eye (Looking down at child) -->
      <path d="M 8 16 Q 11 19, 14 16" fill="none" stroke="#831843" stroke-width="1.5" stroke-linecap="round" />
      <!-- Gentle Smile -->
      <path d="M 10 22 Q 13 25, 16 22" fill="none" stroke="#831843" stroke-width="1.5" stroke-linecap="round" />
      <!-- Rosy Cheek -->
      <circle cx="13" cy="20" r="3" fill="#fb7185" opacity="0.5" />
    </g>

    <!-- Mother's Right Arm (Expressive storytelling gesture) -->
    <path d="M 70 38 C 85 40, 95 30, 90 20" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <!-- Right Hand gesturing magic/story -->
    <circle cx="91" cy="17" r="5" fill="#fbcfe8" />

    <!-- Open Storybook held in lap -->
    <g transform="translate(42, 60)">
      <!-- Book Cover (Dark Blue) -->
      <path d="M 5 5 L 25 0 L 45 5 L 45 25 L 25 30 L 5 25 Z" fill="#1e3a8a" />
      <!-- White Pages -->
      <path d="M 8 7 L 24 3 L 40 7 L 40 23 L 24 27 L 8 23 Z" fill="#f8fafc" />
      <!-- Center Spine -->
      <line x1="24" y1="3" x2="24" y2="27" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Abstract colorful story illustrations & text lines on pages -->
      <line x1="11" y1="10" x2="19" y2="10" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
      <line x1="11" y1="15" x2="17" y2="15" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" />
      <line x1="29" y1="10" x2="37" y2="10" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
      <line x1="29" y1="15" x2="35" y2="15" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
      
      <!-- Magical glowing particles floating out of the book representing "The Story" -->
      <circle cx="35" cy="-2" r="2.5" fill="#fbbf24" opacity="0.9" />
      <circle cx="45" cy="-10" r="3.5" fill="#f43f5e" opacity="0.8" />
      <circle cx="55" cy="-5" r="2" fill="#38bdf8" opacity="0.9" />
      <!-- Sparkle star shape -->
      <path d="M 45 -18 L 47 -14 L 51 -12 L 47 -10 L 45 -6 L 43 -10 L 39 -12 L 43 -14 Z" fill="#fef08a" />
    </g>
  </g>

  <!-- Side Table with Nightlight Lamp -->
  <g transform="translate(190, 130)">
    <!-- Table Leg -->
    <rect x="15" y="25" width="6" height="35" fill="#334155" rx="2" />
    <!-- Table Top -->
    <ellipse cx="18" cy="25" rx="20" ry="6" fill="#475569" />
    
    <!-- Cute Bedside Lamp -->
    <path d="M 15 25 L 18 10 L 21 25 Z" fill="#94a3b8" /> <!-- Stand -->
    <!-- Lampshade -->
    <path d="M 9 10 L 27 10 L 23 0 L 13 0 Z" fill="#fbbf24" filter="url(#shadow)" />
    <!-- Lamp Glow Core -->
    <circle cx="18" cy="12" r="4" fill="#fffbeb" />
  </g>

  <!-- Small Rug on Floor -->
  <ellipse cx="120" cy="210" rx="55" ry="12" fill="#334155" opacity="0.5" />
  <ellipse cx="120" cy="210" rx="50" ry="10" fill="#475569" opacity="0.4" />

</svg>