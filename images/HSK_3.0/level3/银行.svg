<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="counter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Architecture / Interior -->
  <path d="M40 40 H200 V160 H40 Z" fill="#1e293b" opacity="0.5"/>
  <!-- Security Camera -->
  <path d="M50 40 L60 60 H70 L60 40 Z" fill="#475569"/>
  <circle cx="65" cy="50" r="4" fill="#38bdf8"/>

  <!-- Bank Vault Door in Background -->
  <circle cx="120" cy="90" r="32" fill="#334155" stroke="#475569" stroke-width="4"/>
  <circle cx="120" cy="90" r="24" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <rect x="117" y="66" width="6" height="12" rx="3" fill="#fbbf24"/>
  <circle cx="120" cy="90" r="6" fill="#fbbf24"/>

  <!-- Ambient Light Effect -->
  <circle cx="120" cy="110" r="90" fill="#38bdf8" opacity="0.03"/>

  <!-- Teller Counter / Desk Surface -->
  <path d="M20 150 H220 L210 210 H30 Z" fill="url(#counter-grad)" stroke="#475569" stroke-width="2"/>
  <path d="M25 150 H215 V158 H25 Z" fill="#475569"/>

  <!-- Props on Counter: Cash Drawer / Receipt Printer -->
  <rect x="45" y="135" width="30" height="20" rx="4" fill="#64748b"/>
  <path d="M52 135 V130 H68 V135" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- ATM / Interactive Terminal on Counter -->
  <rect x="155" y="105" width="45" height="48" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <!-- Terminal Screen -->
  <rect x="162" y="112" width="31" height="22" rx="3" fill="url(#screen-glow)"/>
  <!-- Screen interface details (abstract bars, no text) -->
  <rect x="167" y="117" width="12" height="3" rx="1.5" fill="#f8fafc"/>
  <rect x="167" y="123" width="20" height="2" rx="1" fill="#bae6fd"/>
  <rect x="167" y="127" width="15" height="2" rx="1" fill="#bae6fd"/>
  <!-- Terminal Slot -->
  <rect x="170" y="138" width="15" height="3" rx="1.5" fill="#1e293b"/>

  <!-- Action Element: Flying Money / Deposit in Motion -->
  <g transform="rotate(-15 110 120)">
    <rect x="90" y="110" width="40" height="24" rx="3" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <circle cx="110" cy="122" r="6" fill="#34d399"/>
    <!-- Decorative border on bill -->
    <rect x="93" y="113" width="34" height="18" rx="2" fill="none" stroke="#065f46" stroke-width="1" stroke-dasharray="2 2"/>
  </g>
  <g transform="rotate(25 80 100)">
    <rect x="65" y="90" width="35" height="20" rx="3" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <circle cx="82" cy="100" r="5" fill="#34d399"/>
  </g>

  <!-- Gold Coins Stacks -->
  <g transform="translate(130, 145)">
    <!-- Coin 1 -->
    <ellipse cx="10" cy="15" rx="12" ry="6" fill="url(#gold-grad)" stroke="#b45309" stroke-width="1"/>
    <path d="M-2 15 V19 C-2 22, 22 22, 22 19 V15" fill="url(#gold-grad)" stroke="#b45309" stroke-width="1"/>
    <ellipse cx="10" cy="19" rx="12" ry="6" fill="url(#gold-grad)" stroke="#b45309" stroke-width="1"/>
    <!-- Coin 2 -->
    <ellipse cx="-8" cy="12" rx="10" ry="5" fill="url(#gold-grad)" stroke="#b45309" stroke-width="1"/>
    <path d="M-18 12 V15 C-18 18, 2 18, 2 15 V12" fill="url(#gold-grad)" stroke="#b45309" stroke-width="1"/>
    <ellipse cx="-8" cy="15" rx="10" ry="5" fill="url(#gold-grad)" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- Customer Character (Lower Left, interacting with bank) -->
  <g transform="translate(30, 130)">
    <!-- Body / Torso -->
    <path d="M15 50 C15 35, 35 30, 50 30 C65 30, 85 35, 85 50 V70 H15 Z" fill="#ec4899"/>
    <!-- Collar / Scarf -->
    <path d="M35 30 L50 45 L65 30 Z" fill="#f43f5e"/>
    <!-- Head -->
    <circle cx="50" cy="15" r="14" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M36 15 C36 5, 45 2, 50 2 C58 2, 64 8, 64 16 C64 16, 56 12, 50 12 C44 12, 36 15, 36 15 Z" fill="#1e293b"/>
    <!-- Hand pushing money -->
    <circle cx="75" cy="40" r="5" fill="#fed7aa"/>
  </g>

  <!-- Bank Teller Character (Behind Counter, Right Side) -->
  <g transform="translate(140, 115)">
    <!-- Uniform Torso -->
    <path d="M20 50 C20 35, 35 30, 45 30 C55 30, 70 35, 70 50 V75 H20 Z" fill="#0284c7"/>
    <!-- Vest / Tie -->
    <path d="M40 30 L45 50 L50 30 Z" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="45" cy="15" r="13" fill="#ffedd5"/>
    <!-- Professional Hair -->
    <path d="M33 12 C33 4, 40 2, 45 2 C52 2, 57 6, 57 15 C52 12, 38 12, 33 12 Z" fill="#334155"/>
    <!-- Friendly Smile (implied via cheek/pose) -->
    <circle cx="42" cy="16" r="1" fill="#475569"/>
    <circle cx="48" cy="16" r="1" fill="#475569"/>
  </g>

  <!-- Foreground Atmospheric Elements (Floating sparkle/security glow) -->
  <g fill="#fbbf24">
    <circle cx="105" cy="85" r="2" opacity="0.8"/>
    <path d="M115 65 L117 71 L123 73 L117 75 L115 81 L113 75 L107 73 L113 71 Z" opacity="0.6"/>
    <circle cx="145" cy="95" r="1.5" opacity="0.5"/>
  </g>
</svg>