<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Golden Magic Glow -->
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Chest Interior Gradient -->
    <linearGradient id="chestInside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#180b01" />
    </linearGradient>

    <!-- Wood Texture / Chest Base -->
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    
    <linearGradient id="chestWoodDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Crystal Ball Gradient -->
    <radialGradient id="crystalBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- Soft Vignette Shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Magic Sparkles & Ancient Ruins silhouette) -->
  <g opacity="0.3">
    <path d="M20 180 Q60 140 100 180 T180 170 T240 190 L240 240 L0 240 Z" fill="#090d16" />
    <circle cx="40" cy="60" r="1" fill="#fff" />
    <circle cx="80" cy="40" r="1.5" fill="#fde047" />
    <circle cx="190" cy="50" r="1" fill="#fff" />
    <circle cx="210" cy="90" r="2" fill="#38bdf8" />
    <circle cx="30" cy="110" r="1" fill="#f472b6" />
  </g>

  <!-- Floor Shadow -->
  <ellipse cx="120" cy="205" rx="75" ry="15" fill="url(#floorShadow)" />

  <!-- Magic Aura / Special Glow behind the chest -->
  <circle cx="120" cy="120" r="70" fill="url(#magicGlow)" />
  
  <!-- Floating Magic Particles -->
  <g>
    <!-- Star 1 -->
    <path d="M75,90 L78,97 L85,100 L78,103 L75,110 L72,103 L65,100 L72,97 Z" fill="#fef08a" opacity="0.9" transform="scale(0.6) translate(60, 40)" />
    <!-- Star 2 -->
    <path d="M165,80 L167,85 L172,87 L167,89 L165,94 L163,89 L158,87 L163,85 Z" fill="#38bdf8" opacity="0.8" transform="scale(0.8) translate(50, 10)" />
    <!-- Sparkles -->
    <circle cx="95" cy="85" r="3" fill="#f472b6" />
    <circle cx="150" cy="95" r="2.5" fill="#fde047" />
    <circle cx="130" cy="65" r="2" fill="#34d399" />
  </g>

  <!-- THE SPECIAL TREASURE CHEST (Main Subject representing "特别" / Extraordinary) -->
  <!-- Back/Interior of Chest Open -->
  <g transform="translate(0, 10)">
    <!-- Inside shadow -->
    <path d="M 70 120 L 170 120 L 160 145 L 80 145 Z" fill="#180b01" />

    <!-- Open Lid -->
    <g transform="rotate(-35 120 120)">
      <rect x="70" y="70" width="100" height="50" rx="15" fill="url(#chestWoodDark)" stroke="#451a03" stroke-width="2" />
      <!-- Lid Metal Rim -->
      <path d="M 72 95 Q 120 105 168 95" fill="none" stroke="url(#goldMetal)" stroke-width="6" stroke-linecap="round" />
      <!-- Lid Wood Planks -->
      <line x1="103" y1="70" x2="103" y2="120" stroke="#57230b" stroke-width="3" />
      <line x1="137" y1="70" x2="137" y2="120" stroke="#57230b" stroke-width="3" />
      <!-- Corner Brackets Lid -->
      <path d="M 73 75 L 85 75 L 85 85" fill="none" stroke="url(#goldMetal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 167 75 L 155 75 L 155 85" fill="none" stroke="url(#goldMetal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Chest Base -->
    <rect x="65" y="115" width="110" height="65" rx="8" fill="url(#chestWood)" stroke="#78350f" stroke-width="3" />
    
    <!-- Wood Planks Vertical lines -->
    <line x1="101" y1="115" x2="101" y2="180" stroke="#78350f" stroke-width="3" />
    <line x1="139" y1="115" x2="139" y2="180" stroke="#78350f" stroke-width="3" />

    <!-- Chest Horizontal Gold Bands -->
    <rect x="65" y="125" width="110" height="8" fill="url(#goldMetal)" />
    <rect x="65" y="165" width="110" height="8" fill="url(#goldMetal)" />

    <!-- Metal Rivets -->
    <circle cx="83" cy="129" r="2" fill="#78350f" />
    <circle cx="120" cy="129" r="2" fill="#78350f" />
    <circle cx="157" cy="129" r="2" fill="#78350f" />
    <circle cx="83" cy="169" r="2" fill="#78350f" />
    <circle cx="120" cy="169" r="2" fill="#78350f" />
    <circle cx="157" cy="169" r="2" fill="#78350f" />

    <!-- Ornate Central Lock / Clasp -->
    <path d="M 110 135 L 130 135 L 135 155 L 125 162 L 115 162 L 105 155 Z" fill="url(#goldMetal)" stroke="#78350f" stroke-width="2" />
    <circle cx="120" cy="148" r="4" fill="#451a03" />

    <!-- THE EXTRAORDINARY OBJECT: Floating Magical Crystal Orb inside Chest -->
    <g transform="translate(0, -10)">
      <!-- Orb Glow -->
      <circle cx="120" cy="105" r="22" fill="#38bdf8" opacity="0.4" />
      
      <!-- Crystal Ball Base / Ring Holder -->
      <path d="M 110 120 Q 120 125 130 120 L 134 126 L 106 126 Z" fill="url(#goldMetal)" stroke="#78350f" stroke-width="1.5" />

      <!-- Crystal Orb Body -->
      <circle cx="120" cy="100" r="18" fill="url(#crystalBall)" />
      
      <!-- Crystal Internal Swirls (Extraordinary details) -->
      <path d="M 110 108 Q 120 90 130 100" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <path d="M 113 92 Q 120 105 127 92" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

      <!-- Crystal Highlight Reflection -->
      <path d="M 111 91 A 10 10 0 0 1 125 89 A 12 12 0 0 0 111 91 Z" fill="#ffffff" opacity="0.7" />
      <circle cx="114" cy="93" r="2" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Extra Treasure Coins spilling out to enhance richness -->
    <g transform="translate(0, 5)">
      <!-- Coin 1 -->
      <ellipse cx="90" cy="175" rx="8" ry="5" fill="url(#goldMetal)" stroke="#ca8a04" stroke-width="1.5" />
      <!-- Coin 2 -->
      <ellipse cx="150" cy="173" rx="7" ry="4" fill="url(#goldMetal)" stroke="#ca8a04" stroke-width="1.5" transform="rotate(15 150 173)" />
      <!-- Coin 3 (stacked) -->
      <ellipse cx="158" cy="170" rx="7" ry="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" transform="rotate(-10 158 170)" />
      <!-- Gemstone spilling -->
      <polygon points="102,170 107,166 112,170 107,176" fill="#f43f5e" stroke="#ffe4e6" stroke-width="1" />
      <polygon points="130,172 134,168 138,172 134,177" fill="#10b981" stroke="#d1fae5" stroke-width="1" />
    </g>
  </g>

  <!-- Foreground Atmospheric Highlights (Bokeh dots for visual depth) -->
  <circle cx="45" cy="140" r="3" fill="#fde047" opacity="0.6" />
  <circle cx="205" cy="130" r="4" fill="#38bdf8" opacity="0.5" />
  <circle cx="180" cy="210" r="2" fill="#f472b6" opacity="0.8" />
  <circle cx="60" cy="200" r="2.5" fill="#34d399" opacity="0.7" />
</svg>