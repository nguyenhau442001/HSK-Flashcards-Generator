<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Desk Light Gradient -->
    <radialGradient id="deskLampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment / Room Context -->
  <!-- Wall -->
  <rect x="0" y="0" width="240" height="150" fill="#131c31"/>
  <!-- Floor -->
  <rect x="0" y="150" width="240" height="90" fill="#0b1120"/>

  <!-- Window with Night Sky & Moon -->
  <g transform="translate(160, 20)">
    <rect width="55" height="75" rx="4" fill="#070a12" stroke="#25354e" stroke-width="2"/>
    <rect x="4" y="4" width="47" height="67" fill="url(#nightSky)"/>
    <!-- Moon & Star -->
    <circle cx="38" cy="20" r="8" fill="#fbbf24" opacity="0.8"/>
    <circle cx="15" cy="45" r="1.5" fill="#ffffff" opacity="0.6"/>
    <!-- Window Frame Grid -->
    <line x1="27" y1="4" x2="27" y2="71" stroke="#25354e" stroke-width="2"/>
    <line x1="4" y1="37" x2="51" y2="37" stroke="#25354e" stroke-width="2"/>
    <!-- Curtains -->
    <path d="M0,0 Q10,35 2,75 L0,75 Z" fill="#334155" opacity="0.7"/>
    <path d="M55,0 Q45,35 53,75 L55,75 Z" fill="#334155" opacity="0.7"/>
  </g>

  <!-- Bookshelf Background Prop -->
  <g transform="translate(20, 30)">
    <rect width="35" height="85" fill="#1b263b" rx="2"/>
    <line x1="0" y1="30" x2="35" y2="30" stroke="#0f172a" stroke-width="2"/>
    <line x1="0" y1="60" x2="35" y2="60" stroke="#0f172a" stroke-width="2"/>
    <!-- Mini Books -->
    <rect x="6" y="12" width="5" height="18" fill="#ef4444" rx="1"/>
    <rect x="13" y="10" width="6" height="20" fill="#38bdf8" rx="1"/>
    <rect x="21" y="15" width="4" height="15" fill="#10b981" rx="1"/>
    <rect x="5" y="42" width="7" height="18" fill="#f59e0b" rx="1"/>
    <rect x="14" y="45" width="5" height="15" fill="#ec4899" rx="1"/>
  </g>

  <!-- Ambient Lamp Light Cone -->
  <path d="M75,25 L35,145 L135,145 Z" fill="url(#deskLampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Study Desk -->
  <path d="M25,145 L215,145 L225,185 L15,185 Z" fill="#334155"/>
  <rect x="15" y="140" width="210" height="8" rx="3" fill="#475569"/>

  <!-- Desktop Items / Props -->
  <!-- Laptop / Tablet Displaying Interactive Exercise -->
  <g transform="translate(125, 105)">
    <!-- Laptop Base -->
    <path d="M-25,35 L45,35 L55,40 L-35,40 Z" fill="#64748b"/>
    <rect x="-10" y="37" width="20" height="2" rx="1" fill="#475569"/>
    <!-- Laptop Screen Frame -->
    <rect x="-30" y="-15" width="70" height="52" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Screen Content (Exercise UI Lines & Checkmarks) -->
    <rect x="-24" y="-9" width="58" height="40" fill="#0f172a"/>
    <rect x="-24" y="-9" width="58" height="40" fill="url(#screenGlow)"/>
    <!-- Mock Exercise Lines -->
    <rect x="-18" y="-3" width="30" height="4" rx="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="21" cy="-1" r="3" fill="#10b981"/>
    
    <rect x="-18" y="7" width="22" height="4" rx="2" fill="#94a3b8" opacity="0.8"/>
    <circle cx="21" cy="9" r="3" fill="#f59e0b"/>

    <rect x="-18" y="17" width="26" height="4" rx="2" fill="#94a3b8" opacity="0.8"/>
    <circle cx="21" cy="19" r="3" fill="#334155" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Open Workbook / Exercise Sheet with Pen -->
  <g transform="translate(55, 125)">
    <!-- Notebook shadow -->
    <ellipse cx="25" cy="30" rx="30" ry="10" fill="#000000" opacity="0.4"/>
    <!-- Notebook Pages -->
    <path d="M0,8 Q25,0 50,8 L48,32 Q25,24 2,32 Z" fill="#f8fafc"/>
    <path d="M50,8 Q75,0 100,8 L98,32 Q75,24 50,32 Z" fill="#f1f5f9"/>
    <!-- Notebook Spine -->
    <line x1="50" y1="8" x2="50" y2="32" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Exercise lines on paper -->
    <line x1="10" y1="14" x2="35" y2="12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="20" x2="30" y2="18" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="14" x2="85" y2="14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="80" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Red Correction Checkmark (Indicating doing/checking exercises) -->
    <path d="M65,16 L70,21 L82,10" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pen / Pencil -->
    <path d="M78,-5 L86,3 L48,35 L42,32 Z" fill="#fb923c"/>
    <polygon points="42,32 48,35 45,38" fill="#1e293b"/>
    <polygon points="78,-5 86,3 81,-1" fill="#ec4899"/>
  </g>

  <!-- Desk Lamp Object -->
  <g transform="translate(75, 25)">
    <path d="M0,120 L20,120 L15,60 L5,60 Z" fill="#475569"/>
    <path d="M10,60 L-10,35" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M-10,35 L-25,10" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Lamp Shade -->
    <path d="M-40,-5 L-10,-5 L-2,15 L-48,15 Z" fill="#fbbf24"/>
    <ellipse cx="-25" cy="15" rx="23" ry="5" fill="#f59e0b"/>
  </g>

  <!-- Main Character (Student actively focusing on exercise) -->
  <g transform="translate(85, 75)">
    <!-- Character Body / Torso (leaning forward) -->
    <path d="M25,80 Q45,65 65,80 L75,115 L15,115 Z" fill="#38bdf8"/>
    <!-- Hoodie Pocket / Details -->
    <path d="M35,95 L55,95 L50,110 L40,110 Z" fill="#0284c7" opacity="0.4"/>
    
    <!-- Neck -->
    <path d="M38,55 L48,55 L48,68 L38,68 Z" fill="#fcd34d"/>

    <!-- Head & Hair (Expressive focused student) -->
    <!-- Hair Base -->
    <circle cx="43" cy="35" r="22" fill="#0f172a"/>
    <!-- Face Skin -->
    <path d="M25,35 Q25,58 45,58 Q65,58 60,35 Z" fill="#fcd34d"/>
    <!-- Hair Top Styling -->
    <path d="M22,30 Q30,12 50,16 Q62,20 62,35 Q50,28 35,28 Z" fill="#1e293b"/>

    <!-- Concentrated Face Features -->
    <!-- Glasses -->
    <rect x="29" y="33" rx="3" ry="3" width="12" height="9" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="45" y="33" rx="3" ry="3" width="12" height="9" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="41" y1="36" x2="45" y2="36" stroke="#0f172a" stroke-width="2"/>
    <!-- Focused Eyes (Closed in concentration or sharp focus) -->
    <path d="M33,37 Q35,39 37,37" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M49,37 Q51,39 53,37" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Focused Mouth (Determined / slight smile) -->
    <path d="M42,48 Q46,51 49,48" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="30" cy="43" r="3" fill="#f87171" opacity="0.5"/>
    <circle cx="56" cy="43" r="3" fill="#f87171" opacity="0.5"/>

    <!-- Arms & Hands Writing / Working on Exercise -->
    <!-- Left Arm -->
    <path d="M25,80 Q10,85 15,100 L30,105" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm (Reaching forward to write/interact) -->
    <path d="M60,78 Q75,85 65,105 L50,110" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand Holding Pen/Interacting -->
    <circle cx="48" cy="110" r="5" fill="#fcd34d"/>
  </g>

  <!-- Coffee Mug Prop (Extra Real-World Context) -->
  <g transform="translate(185, 120)">
    <!-- Mug Body -->
    <path d="M0,10 L15,10 L13,32 L2,32 Z" fill="#f8fafc"/>
    <!-- Mug Handle -->
    <path d="M13,14 Q22,14 22,21 Q22,28 13,28" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam / Warmth -->
    <path d="M5,2 Q8,-2 5,-6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M10,4 Q13,0 10,-4" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>