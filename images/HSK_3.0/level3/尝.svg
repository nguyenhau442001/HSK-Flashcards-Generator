<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="soupGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="spoonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <clipPath id="bowlClip">
      <ellipse cx="120" cy="140" rx="65" ry="35"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light / Counter Top -->
  <ellipse cx="120" cy="180" rx="90" ry="25" fill="#090d16" opacity="0.6"/>
  <rect x="20" y="165" width="200" height="4" rx="2" fill="#334155" opacity="0.5"/>

  <!-- Atmospheric Steam / Glow behind bowl -->
  <circle cx="120" cy="120" r="70" fill="url(#soupGlow)"/>

  <!-- Steam wisps -->
  <path d="M 95 105 Q 90 85 105 70 Q 120 55 110 40" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  <path d="M 145 105 Q 155 85 140 70 Q 125 55 135 35" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  <path d="M 120 100 Q 115 80 125 65 Q 135 50 130 30" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Back rim of the bowl -->
  <ellipse cx="120" cy="130" rx="68" ry="38" fill="#0284c7"/>

  <!-- Bowl Body Outer -->
  <path d="M 52 130 C 52 175, 188 175, 188 130 C 188 160, 52 160, 52 130 Z" fill="#0369a1"/>
  
  <!-- Bowl Base -->
  <ellipse cx="120" cy="168" rx="35" ry="12" fill="#0284c7"/>

  <!-- Bowl Interior / Soup -->
  <ellipse cx="120" cy="132" rx="65" ry="35" fill="url(#bowlGrad)"/>
  <ellipse cx="120" cy="135" rx="60" ry="31" fill="url(#soupGrad)"/>

  <!-- Soup Details / Ingredients / Highlights -->
  <!-- Floating herbs/carrots in soup -->
  <circle cx="100" cy="125" r="5" fill="#10b981" opacity="0.8"/>
  <circle cx="135" cy="140" r="6" fill="#10b981" opacity="0.8"/>
  <path d="M 145 125 Q 150 128 147 132 Q 143 130 145 125 Z" fill="#fb923c"/>
  <path d="M 90 142 Q 95 145 92 149 Q 88 147 90 142 Z" fill="#fb923c"/>
  <ellipse cx="120" cy="130" rx="15" ry="8" fill="#fde68a" opacity="0.3"/>

  <!-- Front rim of the bowl (for depth) -->
  <path d="M 52 130 C 52 150, 188 150, 188 130 C 188 155, 52 155, 52 130 Z" fill="#0284c7" opacity="0.4"/>

  <!-- Action Element: The Tasting Spoon -->
  <!-- Spoon shadow -->
  <ellipse cx="122" cy="97" rx="16" ry="10" fill="#000000" opacity="0.3"/>

  <!-- Spoon Handle (slanted downwards into soup) -->
  <path d="M 120 70 L 165 40" stroke="url(#spoonGrad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 120 70 L 165 40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" stroke-dasharray="2 15"/>

  <!-- Spoon Bowl -->
  <ellipse cx="118" cy="95" rx="16" ry="11" fill="url(#spoonGrad)" transform="rotate(-15 118 95)"/>
  
  <!-- Spoon Contents (Soup liquid being tasted) -->
  <ellipse cx="118" cy="94" rx="13" ry="8" fill="#f59e0b" transform="rotate(-15 118 94)"/>
  <!-- Highlight on spoon soup -->
  <ellipse cx="115" cy="92" rx="6" ry="3" fill="#fde68a" opacity="0.6" transform="rotate(-15 115 92)"/>

  <!-- Flavor Sparkles / Tasting Magic Accent -->
  <g transform="translate(115, 65)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(145, 90) scale(0.6)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(90, 80) scale(0.75)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#10b981"/>
  </g>

  <!-- Side Context Props: Small plate with herbs/chili -->
  <ellipse cx="45" cy="190" rx="22" ry="10" fill="#334155"/>
  <ellipse cx="45" cy="188" rx="18" ry="8" fill="#f1f5f9"/>
  <!-- Garnishes on plate -->
  <circle cx="40" cy="187" r="3" fill="#ef4444"/>
  <circle cx="50" cy="189" r="2.5" fill="#10b981"/>
  <circle cx="45" cy="186" r="2" fill="#10b981"/>

  <!-- Side Context Props: Chopsticks rest & chopsticks -->
  <rect x="160" y="195" width="35" height="6" rx="3" fill="#64748b" transform="rotate(-10 160 195)"/>
  <line x1="155" y1="185" x2="200" y2="175" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="155" y1="190" x2="198" y2="180" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

</svg>