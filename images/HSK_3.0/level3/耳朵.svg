<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <!-- Orange Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Glow Effect for Big Ears -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Background Environment (Cozy Room Interior) -->
  <!-- Bookshelf / Window Frame Context -->
  <g opacity="0.4">
    <!-- Window backdrop -->
    <rect x="170" y="40" width="40" height="60" rx="6" fill="#334155" />
    <path d="M190 40 V100 M170 70 H210" stroke="#1e293b" stroke-width="2" />
    
    <!-- Plant silhouette on shelf -->
    <path d="M30 110 Q35 90 45 85 Q55 90 60 110 Z" fill="#334155" />
    <path d="M45 85 C40 60 30 50 20 40 C35 45 42 60 45 85 Z" fill="#475569" />
    <path d="M45 85 C50 60 60 50 70 40 C55 45 48 60 45 85 Z" fill="#475569" />
    <rect x="25" y="110" width="40" height="10" rx="3" fill="#64748b" />
  </g>

  <!-- Ground / Floor -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#090d16" opacity="0.6" />
  <ellipse cx="120" cy="205" rx="70" ry="12" fill="#000000" opacity="0.4" />

  <!-- MAIN CHARACTER GROUP -->
  <g transform="translate(0, 15)" filter="url(#softShadow)">
    
    <!-- Torso & Clothing (Blue Hoodie) -->
    <path d="M75 160 C75 135 95 125 120 125 C145 125 165 135 165 160 L185 200 C185 205 180 210 175 210 L65 210 C60 210 55 205 55 200 Z" fill="#3b82f6" />
    <!-- Hoodie Pocket & Details -->
    <path d="M95 175 H145 V200 H95 Z" fill="#2563eb" rx="5" />
    <path d="M120 125 L120 145" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" />
    <circle cx="120" cy="150" r="3" fill="#93c5fd" />

    <!-- Neck -->
    <path d="M105 110 H135 V130 H105 Z" fill="url(#skinGrad)" />

    <!-- HUGE EARS (Focal Point of the Example Sentence: "他的耳朵很大") -->
    <!-- Left Big Ear -->
    <g class="left-ear">
      <!-- Outer Ear Contour -->
      <path d="M 85 85 C 45 75 35 115 55 135 C 65 145 75 135 85 115 Z" fill="url(#skinGrad)" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" />
      <!-- Inner Ear Folds -->
      <path d="M 75 95 C 55 90 50 115 65 125" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <path d="M 68 105 C 58 105 58 115 63 118" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <!-- Cute Earring/Highlight detail to draw focus -->
      <circle cx="60" cy="122" r="3.5" fill="#f59e0b" />
    </g>

    <!-- Right Big Ear -->
    <g class="right-ear">
      <!-- Outer Ear Contour -->
      <path d="M 155 85 C 195 75 205 115 185 135 C 175 145 165 135 155 115 Z" fill="url(#skinGrad)" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" />
      <!-- Inner Ear Folds -->
      <path d="M 165 95 C 185 90 190 115 175 125" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <path d="M 172 105 C 182 105 182 115 177 118" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <circle cx="180" cy="122" r="3.5" fill="#f59e0b" />
    </g>

    <!-- Head / Face Base -->
    <rect x="75" y="60" width="90" height="85" rx="42" fill="url(#skinGrad)" stroke="#c2410c" stroke-width="3" />

    <!-- Hair Style (Stylish Modern Dark Hair) -->
    <path d="M 77 85 C 70 55 90 40 120 40 C 150 40 170 55 163 85 C 163 85 155 55 120 52 C 85 55 77 85 77 85 Z" fill="#0f172a" />
    <!-- Hair Spikes/Tufts -->
    <path d="M 100 44 C 110 30 125 32 135 45 C 125 38 110 38 100 44 Z" fill="#334155" />
    <path d="M 120 42 C 130 30 145 35 150 48 C 140 40 130 40 120 42 Z" fill="#334155" />

    <!-- Facial Features: Cheeks (blushing to emphasize friendly expression) -->
    <ellipse cx="95" cy="110" rx="8" ry="5" fill="#f43f5e" opacity="0.3" />
    <ellipse cx="145" cy="110" rx="8" ry="5" fill="#f43f5e" opacity="0.3" />

    <!-- Eyes (Happy, Winking / Expressive) -->
    <!-- Left Eye (Open & Cheerful) -->
    <circle cx="100" cy="95" r="7" fill="#0f172a" />
    <circle cx="98" cy="93" r="2.5" fill="#ffffff" />

    <!-- Right Eye (Happy Curved Arc) -->
    <path d="M 135 92 Q 140 86 145 92" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />

    <!-- Friendly Nose -->
    <path d="M 120 98 Q 123 104 118 106" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />

    <!-- Big Happy Smile -->
    <path d="M 105 112 Q 120 126 135 112" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 110 115 Q 120 123 130 115" fill="#f43f5e" />

    <!-- Eyebrows -->
    <path d="M 92 82 Q 100 78 108 84" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 132 84 Q 140 78 148 82" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

  </g>

  <!-- FOREGROUND / INTERACTION PROPS (Amplifying the "Big Ears" Context) -->
  <!-- Floating Sound Waves / Listening indicators near the ears to emphasize function -->
  <g opacity="0.8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Left ear sound waves -->
    <path d="M 30 95 C 20 100 20 110 30 115" />
    <path d="M 22 85 C 10 95 10 115 22 125" />
    
    <!-- Right ear sound waves -->
    <path d="M 210 95 C 220 100 220 110 210 115" />
    <path d="M 218 85 C 230 95 230 115 218 125" />
  </g>

  <!-- Sparkles / Accent highlights around ears to draw visual attention -->
  <g fill="#fbbf24">
    <path d="M 38 75 L 40 82 L 47 84 L 40 86 L 38 93 L 36 86 L 29 84 L 36 82 Z" opacity="0.8" />
    <path d="M 202 75 L 204 82 L 211 84 L 204 86 L 202 93 L 200 86 L 193 84 L 200 82 Z" opacity="0.8" />
    <circle cx="50" cy="140" r="3" fill="#38bdf8" opacity="0.7" />
    <circle cx="190" cy="140" r="3" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- Musical Note or Sound Icon floating softly -->
  <g transform="translate(112, 12)" opacity="0.8">
    <circle cx="5" cy="15" r="3" fill="#f43f5e" />
    <path d="M 8 15 V 5 L 18 2 V 12" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="15" cy="12" r="3" fill="#f43f5e" />
  </g>

</svg>