<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Reading Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Background Environment: Cozy Wooden Bookshelf & Wall -->
  <g id="environment">
    <!-- Wall paneling line -->
    <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>
    
    <!-- Bookshelf background structure -->
    <rect x="20" y="30" width="200" height="145" fill="none" stroke="#334155" stroke-width="3" rx="4"/>
    <!-- Shelf Dividers -->
    <line x1="20" y1="90" x2="220" y2="90" stroke="#334155" stroke-width="2"/>
    <line x1="20" y1="140" x2="220" y2="140" stroke="#334155" stroke-width="2"/>

    <!-- Background Books & Props -->
    <!-- Top Shelf Books -->
    <rect x="30" y="60" width="14" height="30" fill="#38bdf8" rx="2"/>
    <rect x="46" y="55" width="18" height="35" fill="#f43f5e" rx="2"/>
    <rect x="66" y="65" width="12" height="25" fill="#10b981" rx="2"/>
    <path d="M 180 90 L 195 65 L 210 90 Z" fill="#64748b"/> <!-- Plant pot triangle style -->
    <circle cx="195" cy="58" r="8" fill="#10b981"/> <!-- Plant leaves -->

    <!-- Middle Shelf Background Books -->
    <rect x="160" y="105" width="16" height="35" fill="#8b5cf6" rx="2"/>
    <rect x="178" y="100" width="14" height="40" fill="#38bdf8" rx="2"/>
  </g>

  <!-- Wooden Table Surface -->
  <path d="M 10 185 L 230 185 L 220 220 L 20 220 Z" fill="#334155"/>
  <path d="M 0 175 L 240 175 L 240 185 L 0 185 Z" fill="#475569"/>

  <!-- THE MAIN SUBJECT: "An Old Book" (旧书) prominently held and displayed -->
  <g id="main-book-object" filter="url(#softShadow)" transform="translate(100, 115)">
    <!-- Book Shadow -->
    <ellipse cx="20" cy="80" rx="35" ry="8" fill="#0f172a" opacity="0.6"/>

    <!-- Old Book Base (Open / Slightly Tilted to show worn pages) -->
    <!-- Back Cover (Faded Leather/Cardboard Brown) -->
    <path d="M -25 55 L 45 45 L 60 70 L -10 80 Z" fill="#78350f" rx="3"/>
    
    <!-- Worn Yellowed Pages Block -->
    <path d="M -20 48 L 40 40 L 55 63 L -5 71 Z" fill="#fef3c7"/>
    <path d="M -18 45 L 38 37 L 53 60 L -3 68 Z" fill="#fef3c7"/>
    <path d="M -15 42 L 35 34 L 50 57 L 0 65 Z" fill="#fffbeb"/>

    <!-- Cover Pages & Binding (Showing wear: dog-eared corner, faded color) -->
    <g transform="translate(0, 0)">
      <!-- Main Front Cover (Dusty Olive/Brown tone indicating age) -->
      <path d="M -30 50 L 35 40 L 50 68 L -15 78 Z" fill="#b45309" rx="2"/>
      <!-- Cover inner border detail (worn) -->
      <path d="M -23 54 L 30 45 L 42 63 L -11 72 Z" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2"/>
      
      <!-- Dog-eared corner (classic sign of an old, used book) -->
      <path d="M 35 40 L 42 43 L 38 48 Z" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>

      <!-- Faded Spine (worn edges) -->
      <path d="M -30 50 L -15 78 L -18 80 L -33 52 Z" fill="#92400e"/>

      <!-- Vintage bookmark ribbon hanging out -->
      <path d="M 15 43 Q 22 55 18 70 L 23 72 Q 28 55 20 42 Z" fill="#e11d48"/>
    </g>

    <!-- Subtle worn marks/stains on the cover (abstract vectors representing 'old') -->
    <circle cx="5" cy="55" r="4" fill="#78350f" opacity="0.4"/>
    <path d="M 15 60 Q 20 58 25 63" stroke="#78350f" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>

  <!-- Expressive Character: Person holding and presenting the old book -->
  <g id="character" filter="url(#softShadow)" transform="translate(15, 45)">
    <!-- Body / Torso (Cozy Sweater) -->
    <path d="M 35 110 Q 55 100 75 110 L 85 150 L 25 150 Z" fill="#38bdf8" rx="10"/>

    <!-- Neck & Head -->
    <path d="M 50 85 L 50 100" stroke="#fbcfe8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="50" cy="72" r="18" fill="#fbcfe8"/>

    <!-- Friendly Face Profile/Expression -->
    <!-- Hair (Styled neat, dark) -->
    <path d="M 34 70 Q 50 50 66 70 Q 68 85 62 82 Q 50 75 38 82 Z" fill="#0f172a"/>
    <!-- Gentle Smiling Eye -->
    <path d="M 52 70 Q 56 73 60 70" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheek -->
    <circle cx="57" cy="76" r="4" fill="#fda4af" opacity="0.6"/>

    <!-- Arms reaching out to present the book -->
    <!-- Back Arm -->
    <path d="M 40 105 Q 60 110 75 95" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <!-- Front Arm & Hand holding the book -->
    <path d="M 65 110 Q 80 120 95 105" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="97" cy="103" r="6" fill="#fbcfe8"/> <!-- Hand -->
  </g>

  <!-- Foreground Atmospheric Elements (Reading Lamp hanging or desk lamp) -->
  <g id="desk-lamp">
    <!-- Lamp base on table -->
    <ellipse cx="200" cy="180" rx="14" ry="5" fill="#64748b"/>
    <!-- Lamp arm -->
    <path d="M 200 180 L 200 130 L 175 110" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lamp Shade -->
    <path d="M 160 95 L 190 95 L 200 115 L 150 115 Z" fill="#f59e0b"/>
    <!-- Light Beam overlaying the book scene -->
    <polygon points="175,115 100,185 220,185" fill="#fbbf24" opacity="0.08" style="mix-blend-mode: screen;"/>
  </g>

  <!-- Additional Small Room Details (mug, glasses on desk to add realism) -->
  <g id="desk-props">
    <!-- Coffee Mug -->
    <rect x="40" y="170" width="16" height="20" fill="#f43f5e" rx="3"/>
    <path d="M 56 174 Q 62 174 62 180 Q 62 186 56 186" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam from Mug -->
    <path d="M 45 162 Q 48 155 45 150" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 51 164 Q 48 158 51 152" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>