<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%?" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg)" />

  <!-- Ambient light circles -->
  <circle cx="120" cy="120" r="90" fill="#38bdf8" opacity="0.03" />
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.04" />

  <!-- Table surface -->
  <path d="M20 185 L220 185 L205 220 L35 220 Z" fill="#0f172a" opacity="0.8" />
  <path d="M20 185 L220 185" stroke="#334155" stroke-width="2" />

  <!-- Laptop / Desk Setup (Context: Wanting to go out, but busy/stuck) -->
  <g transform="translate(30, 90)">
    <!-- Laptop Base -->
    <path d="M10 75 L170 75 L180 85 L0 85 Z" fill="#64748b" />
    <path d="M60 75 L120 75 L125 81 L55 81 Z" fill="#475569" />
    <!-- Screen -->
    <rect x="15" y="10" width="150" height="67" rx="6" fill="#334155" />
    <rect x="20" y="15" width="140" height="57" rx="3" fill="#0f172a" />
    <!-- Screen UI lines / graphs (busy work) -->
    <rect x="28" y="23" width="50" height="6" rx="2" fill="#38bdf8" opacity="0.6" />
    <path d="M28 45 L50 33 L70 40 L95 28 L115 38" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="95" cy="28" r="4" fill="#fb923c" />
    <!-- Screen glow overlay -->
    <rect x="20" y="15" width="140" height="57" rx="3" fill="url(#screen-glow)" />
  </g>

  <!-- Coffee Mug (Prop for working late/busy) -->
  <g transform="translate(180, 140)">
    <rect x="0" y="10" width="20" height="25" rx="3" fill="#cbd5e1" />
    <path d="M20 15 C26 15 26 27 20 27" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M6 3 C6 -1 12 -1 12 -5" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Plant (Cozy room details) -->
  <g transform="translate(15, 125)">
    <path d="M10 40 L20 40 L18 60 L12 60 Z" fill="#475569" />
    <path d="M15 40 C15 25 5 15 5 10 C5 15 15 25 15 40 Z" fill="#10b981" />
    <path d="M15 40 C20 20 30 15 35 12 C30 20 20 28 15 40 Z" fill="#059669" />
  </g>

  <!-- Central Action Object: The "CONTRADICTION" / "DESIRE VS REALITY" -->
  <!-- A glowing travel ticket/map (Desire to go) being blocked or contrasted -->
  
  <!-- Travel Ticket (Floating at an angle) -->
  <g transform="translate(100, 45) rotate(-12)">
    <!-- Ticket Shadow -->
    <rect x="2" y="5" width="85" height="45" rx="8" fill="#000000" opacity="0.4" />
    <!-- Ticket Body -->
    <rect x="0" y="0" width="85" height="45" rx="8" fill="url(#ticket-grad)" />
    <!-- Ticket Notches -->
    <circle cx="65" cy="-4" r="5" fill="#0f172a" />
    <circle cx="65" cy="49" r="5" fill="#0f172a" />
    <!-- Ticket Details -->
    <circle cx="20" cy="22" r="8" fill="#ffffff" opacity="0.3" />
    <rect x="35" y="15" width="35" height="6" rx="2" fill="#ffffff" opacity="0.9" />
    <rect x="35" y="26" width="22" height="4" rx="2" fill="#ffffff" opacity="0.7" />
    <!-- Airplane icon on ticket -->
    <path d="M17 22 L22 19 L23 21 L20 23 L23 25 L22 27 Z" fill="#78350f" />
  </g>

  <!-- Clock / Time barrier (Representing 'No Time') intersecting the ticket -->
  <g transform="translate(125, 80)">
    <!-- Clock Drop Shadow -->
    <circle cx="2" cy="4" r="28" fill="#000" opacity="0.5" />
    
    <!-- Clock Outer Ring -->
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#fb923c" stroke-width="4" />
    <circle cx="0" cy="0" r="24" fill="#0f172a" />
    
    <!-- Clock Face Ticks -->
    <line x1="0" y1="-21" x2="0" y2="-17" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="17" x2="0" y2="21" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="-21" y1="0" x2="-17" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="17" y1="0" x2="21" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

    <!-- Clock Hands (Stuck / Dynamic angle) -->
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="0" x2="14" y2="8" stroke="#fb923c" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#fb923c" />

    <!-- Visual "Block/Cross" element representing "However / But" (可是) -->
    <!-- Red/Orange barrier slash -->
    <g transform="translate(0, 0) rotate(45)">
      <rect x="-32" y="-5" width="64" height="10" rx="5" fill="#ef4444" opacity="0.9" filter="url(#glow)" />
      <rect x="-30" y="-3" width="60" height="6" rx="3" fill="#f87171" />
    </g>
  </g>

  <!-- Expressive atmospheric sparks / visual tension -->
  <circle cx="75" cy="50" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="175" cy="115" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="95" cy="135" r="2.5" fill="#fb923c" opacity="0.9" />
  
  <!-- Floating cross-out dust particles -->
  <path d="M155 55 L165 65 M165 55 L155 65" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M75 95 L81 101 M81 95 L75 101" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.5" />

</svg>