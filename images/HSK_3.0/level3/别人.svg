<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ground/Sidewalk -->
  <path d="M0 180 Q120 175 240 180 V240 H0 Z" fill="#1e293b"/>
  <path d="M0 185 Q120 180 240 185 V190 H0 Z" fill="#334155" opacity="0.5"/>
  
  <!-- Atmosphere: Distant City Lights -->
  <circle cx="40" cy="80" r="1" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="60" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="120" cy="40" r="1" fill="#f59e0b" opacity="0.5"/>
  
  <!-- Street Lamp Casting Glow -->
  <path d="M180 180 L175 40 Q175 35 185 35 L190 35" stroke="#334155" stroke-width="3" fill="none"/>
  <path d="M185 35 L205 45" stroke="#334155" stroke-width="4" fill="none"/>
  <circle cx="205" cy="48" r="6" fill="#fbbf24"/>
  <circle cx="205" cy="48" r="15" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Light Pool on Ground -->
  <ellipse cx="180" cy="190" rx="50" ry="15" fill="#fbbf24" opacity="0.1"/>

  <!-- "Others" (Biérén) - Group 1: People at a distance -->
  <!-- Person sitting on a bench -->
  <rect x="30" y="155" width="50" height="4" rx="2" fill="#334155"/>
  <path d="M35 155 L35 180 M75 155 L75 180" stroke="#334155" stroke-width="2"/>
  <path d="M45 135 Q50 130 55 135 L55 155 L45 155 Z" fill="#38bdf8" opacity="0.8"/> <!-- Sitting person body -->
  <circle cx="50" cy="128" r="4" fill="#38bdf8" opacity="0.8"/> <!-- Sitting person head -->

  <!-- "Others" - Group 2: Person walking a dog -->
  <g transform="translate(110, 140)">
    <path d="M5 15 Q10 10 15 15 L15 40 L5 40 Z" fill="#94a3b8"/> <!-- Person body -->
    <circle cx="10" cy="8" r="4" fill="#94a3b8"/> <!-- Person head -->
    <path d="M15 30 L25 35" stroke="#64748b" stroke-width="1" fill="none"/> <!-- Leash -->
    <path d="M25 35 Q30 32 35 35 L35 40 L25 40 Z" fill="#64748b"/> <!-- Dog -->
  </g>

  <!-- "Others" - Group 3: Distant silhouettes -->
  <path d="M210 145 Q215 140 220 145 L220 180 L210 180 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="215" cy="138" r="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Main Subject: The "Self" walking through the "Others" -->
  <!-- This highlights the contrast between the individual and 'biérén' -->
  <g transform="translate(85, 120)">
    <!-- Legs in motion -->
    <path d="M10 55 L2 75" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
    <path d="M15 55 L22 75" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
    <!-- Body/Jacket -->
    <path d="M0 25 Q12 15 25 25 L28 55 Q12 60 0 55 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="14" cy="12" r="8" fill="#fde68a"/>
    <!-- Arm swinging -->
    <path d="M22 30 L30 45" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <!-- Backpack -->
    <path d="M2 28 Q-5 35 2 50" stroke="#f59e0b" stroke-width="3" fill="none"/>
  </g>

  <!-- Foreground Details for Depth -->
  <path d="M-10 220 Q40 210 80 230" stroke="#334155" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M160 235 Q200 225 250 240" stroke="#334155" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Subtle light particles in the air -->
  <circle cx="190" cy="100" r="0.8" fill="#fbbf24" opacity="0.3"/>
  <circle cx="160" cy="120" r="0.5" fill="#fbbf24" opacity="0.2"/>
</svg>