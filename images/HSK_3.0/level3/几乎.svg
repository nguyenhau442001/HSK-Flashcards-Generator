<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Warm Light Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Coffee Shop Warm Light -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT BACKGROUND -->
  <!-- Cozy Cafe Interior Wall -->
  <rect x="15" y="15" width="210" height="155" rx="8" fill="#334155" opacity="0.6" />
  
  <!-- Wooden Wall Panelling Accent Lines -->
  <line x1="15" y1="60" x2="225" y2="60" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" />
  <line x1="15" y1="120" x2="225" y2="120" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Large Background Window with Night City Silhouette outside -->
  <path d="M 145 35 L 205 35 L 205 130 L 145 130 Z" fill="#090d16" />
  <path d="M 148 38 L 202 38 L 202 127 L 148 127 Z" fill="#1e293b" />
  <!-- Cityscape outside window -->
  <rect x="153" y="85" width="10" height="42" fill="#0f172a" />
  <rect x="165" y="65" width="14" height="62" fill="#0f172a" />
  <rect x="182" y="95" width="12" height="32" fill="#0f172a" />
  <!-- Window Grid Frame -->
  <line x1="175" y1="38" x2="175" y2="127" stroke="#334155" stroke-width="2" />
  <line x1="148" y1="82" x2="202" y2="82" stroke="#334155" stroke-width="2" />
  <!-- Window Light spill -->
  <path d="M 145 35 L 205 35 L 225 155 L 125 155 Z" fill="url(#window-glow)" />

  <!-- Hanging Pendant Lamp -->
  <circle cx="90" cy="20" r="4" fill="#64748b" />
  <line x1="90" y1="20" x2="90" y2="45" stroke="#64748b" stroke-width="2" />
  <path d="M 75 45 L 105 45 L 112 55 L 68 55 Z" fill="#fbbf24" filter="url(#soft-shadow)" />
  <circle cx="90" cy="50" r="45" fill="url(#lamp-glow)" />

  <!-- Cafe Counter / Wooden Table Surface -->
  <path d="M 20 165 L 220 165 L 210 215 L 30 215 Z" fill="#78350f" filter="url(#soft-shadow)" />
  <!-- Table Front Edge -->
  <rect x="25" y="160" width="190" height="8" rx="3" fill="#92400e" />
  <!-- Table Highlight -->
  <line x1="35" y1="163" x2="215" y2="163" stroke="#b45309" stroke-width="1.5" />

  <!-- PROPS ON TABLE -->
  <!-- Coffee Cup & Saucer -->
  <ellipse cx="60" cy="165" rx="14" ry="5" fill="#cbd5e1" />
  <path d="M 49 152 L 71 152 L 68 165 L 52 165 Z" fill="#f8fafc" />
  <path d="M 68 155 C 74 155 74 162 68 162" fill="none" stroke="#f8fafc" stroke-width="2.5" />
  <!-- Coffee steam -->
  <path d="M 58 144 C 55 140 61 137 58 133" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M 63 145 C 61 142 65 139 63 135" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- Calendar / Notebook (Showing daily routine) -->
  <rect x="170" y="148" width="30" height="24" rx="3" fill="#e2e8f0" transform="rotate(-8 185 160)" />
  <rect x="173" y="152" width="24" height="16" rx="1" fill="#38bdf8" transform="rotate(-8 185 160)" opacity="0.8" />
  <!-- Calendar Ring Spirals -->
  <circle cx="178" cy="147" r="1.5" fill="#64748b" />
  <circle cx="185" cy="146" r="1.5" fill="#64748b" />
  <circle cx="192" cy="145" r="1.5" fill="#64748b" />

  <!-- MAIN CHARACTER: Regular Customer (Arriving every day) -->
  <g transform="translate(10, 10)">
    <!-- Character Shadow -->
    <ellipse cx="110" cy="205" rx="32" ry="10" fill="#020617" opacity="0.4" />

    <!-- Chair Back -->
    <rect x="92" y="130" width="36" height="50" rx="6" fill="#451a03" />
    <rect x="97" y="138" width="26" height="34" rx="4" fill="#78350f" opacity="0.6" />

    <!-- Character Body / Torso (Warm Jacket / Sweater) -->
    <path d="M 85 130 C 85 110 135 110 135 130 L 142 175 L 78 175 Z" fill="#0284c7" filter="url(#soft-shadow)" />
    <!-- Sweater collar -->
    <path d="M 98 123 C 110 132 122 123 122 123 L 118 130 C 118 130 102 130 98 130 Z" fill="#e0f2fe" />
    <path d="M 100 125 L 120 125" stroke="#bae6fd" stroke-width="2" />

    <!-- Left Arm reaching forward (holding mug or waving) -->
    <path d="M 85 130 L 65 145 L 75 155 L 92 140 Z" fill="#0284c7" />
    <!-- Left Hand -->
    <circle cx="63" cy="157" r="7" fill="#fcd34d" />

    <!-- Right Arm -->
    <path d="M 135 130 L 148 150 L 138 160 L 125 145 Z" fill="#0369a1" />
    <circle cx="149" cy="153" r="6" fill="#fcd34d" />

    <!-- Character Neck -->
    <rect x="102" y="112" width="16" height="16" fill="#fcd34d" />

    <!-- Character Head -->
    <circle cx="110" cy="92" r="22" fill="#fcd34d" filter="url(#soft-shadow)" />

    <!-- Hair (Trendy Short Dark Hair) -->
    <path d="M 88 92 C 88 70 132 70 132 92 C 132 95 130 85 124 80 C 118 75 102 75 96 80 C 90 85 88 92 88 92 Z" fill="#1e293b" />

    <!-- Friendly Expressive Face -->
    <!-- Smiling Eyes (Happy routine visitor) -->
    <path d="M 98 90 Q 103 84 108 90" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 112 90 Q 117 84 122 90" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Cheeks (Warm greeting flush) -->
    <circle cx="96" cy="95" r="4" fill="#fb7185" opacity="0.6" />
    <circle cx="124" cy="95" r="4" fill="#fb7185" opacity="0.6" />

    <!-- Warm Friendly Smile -->
    <path d="M 103 100 Q 110 108 117 100" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND VIBE: Subtle decorative plants/bokeh for depth -->
  <circle cx="25" cy="200" r="18" fill="#10b981" opacity="0.2" filter="url(#soft-shadow)" />
  <path d="M 20 215 C 20 190 35 190 35 215" fill="#059669" />
  <path d="M 12 218 C 15 195 30 200 25 218" fill="#34d399" />

  <!-- Small floating sparkle/frequency indicators to subtly reinforce "almost everyday / constant habit" without symbols -->
  <g fill="#fbbf24" opacity="0.7">
    <circle cx="195" cy="95" r="3" />
    <circle cx="210" cy="110" r="2" />
    <circle cx="185" cy="80" r="2" />
    <!-- Small star sparkle -->
    <path d="M 202 70 L 204 75 L 209 77 L 204 79 L 202 84 L 200 79 L 195 77 L 200 75 Z" fill="#f59e0b" opacity="0.8" />
  </g>
</svg>