<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow behind characters -->
    <radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradients (Artisan/Mechanic giving reassurance) -->
    <linearGradient id="shirt1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Character 2 Gradients (Customer smiling, relieved) -->
    <linearGradient id="shirt2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Environmental Workshop Background Details -->
  <!-- Workshop Back Wall & Shelving -->
  <rect x="20" y="30" width="200" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Shelf -->
  <rect x="30" y="65" width="90" height="6" rx="3" fill="#475569"/>
  <rect x="135" y="65" width="75" height="6" rx="3" fill="#475569"/>
  
  <!-- Workshop Props on shelves -->
  <circle cx="50" cy="53" r="10" fill="#f59e0b" opacity="0.8"/>
  <rect x="70" y="45" width="16" height="20" rx="2" fill="#10b981"/>
  <rect x="150" y="47" width="12" height="18" rx="2" fill="#ec4899"/>
  <path d="M 175 65 L 185 45 L 195 65 Z" fill="#38bdf8"/>

  <!-- Ambient Glow centered around interaction -->
  <circle cx="120" cy="140" r="90" fill="url(#warmGlow)"/>

  <!-- Workbench Surface -->
  <rect x="10" y="185" width="220" height="35" rx="4" fill="#334155"/>
  <rect x="10" y="180" width="220" height="8" rx="2" fill="#475569"/>

  <!-- Workbench Props -->
  <!-- Laptop/Device being repaired -->
  <path d="M 110 180 L 130 180 L 134 165 L 106 165 Z" fill="#64748b"/>
  <rect x="95" y="178" width="50" height="4" rx="2" fill="#94a3b8"/>
  <rect x="100" y="160" width="40" height="26" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <!-- Glowing screen checkmark (visual cue for "no problem") -->
  <path d="M 112 173 L 117 178 L 128 167" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Toolbox & Wrenches -->
  <rect x="25" y="162" width="30" height="20" rx="3" fill="#ef4444"/>
  <rect x="32" y="158" width="16" height="5" rx="2" fill="#b91c1c"/>
  <circle cx="185" cy="175" r="8" fill="#cbd5e1"/>
  <rect x="180" y="165" width="10" height="6" rx="1" fill="#64748b"/>

  <!-- Characters Group with Soft Shadow -->
  <g filter="url(#softShadow)">
    
    <!-- CHARACTER 1: Artisan / Expert (Left, reassuring gesture) -->
    <g id="artisan">
      <!-- Body / Torso -->
      <path d="M 50 190 L 50 135 C 50 120 70 120 75 135 L 75 190 Z" fill="url(#shirt1Grad)"/>
      <path d="M 50 145 L 75 145" stroke="#0284c7" stroke-width="3"/> <!-- collar accent -->
      <circle cx="62" cy="155" r="2" fill="#e0f2fe"/>
      <circle cx="62" cy="170" r="2" fill="#e0f2fe"/>

      <!-- Head & Neck -->
      <rect x="56" y="112" width="12" height="15" fill="#fcd34d"/>
      <circle cx="62" cy="102" r="16" fill="#fcd34d"/>
      
      <!-- Hair -->
      <path d="M 46 102 C 46 90, 78 90, 78 102 C 78 105, 76 102, 72 98 C 66 94, 58 94, 52 98 C 48 102, 46 105, 46 102 Z" fill="#334155"/>

      <!-- Facial expression (Confident, reassuring smile) -->
      <circle cx="68" cy="100" r="1.5" fill="#1e293b"/> <!-- eye -->
      <path d="M 65 106 Q 68 110 71 106" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/> <!-- smile -->
      <!-- Friendly eyebrow -->
      <path d="M 66 96 Q 68 94 70 96" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Arms & Reassuring Thumbs-Up / Open Palm Gesture -->
      <!-- Back arm -->
      <path d="M 50 140 C 40 145, 40 160, 50 165" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
      <!-- Front arm gesturing forward/comforting -->
      <path d="M 70 138 C 90 140, 95 155, 95 155" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
      <circle cx="97" cy="155" r="5" fill="#fcd34d"/> <!-- hand -->
    </g>

    <!-- CHARACTER 2: Customer / Client (Right, relieved posture) -->
    <g id="customer">
      <!-- Body / Torso -->
      <path d="M 165 190 L 165 140 C 165 125 185 125 190 140 L 190 190 Z" fill="url(#shirt2Grad)"/>
      <path d="M 165 148 L 190 148" stroke="#c2410c" stroke-width="3"/> <!-- collar accent -->

      <!-- Head & Neck -->
      <rect x="172" y="115" width="12" height="15" fill="#fcd34d"/>
      <circle cx="178" cy="105" r="16" fill="#fcd34d"/>
      
      <!-- Hair (Pony-tail or stylish bob) -->
      <path d="M 162 102 C 162 90, 194 90, 194 102 C 194 115, 188 115, 196 122 C 198 124, 192 126, 188 120 C 185 116, 175 116, 162 102 Z" fill="#1e293b"/>

      <!-- Facial expression (Happy, relieved, eyes closed in joy/relief) -->
      <path d="M 172 105 Q 175 108 178 105" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/> <!-- happy curved eye -->
      <path d="M 174 111 Q 178 116 182 111" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- big smile -->
      
      <!-- Relaxed / Relieved hand near chest -->
      <path d="M 170 145 C 160 150, 165 165, 172 160" fill="none" stroke="#fb923c" stroke-width="9" stroke-linecap="round"/>
      <circle cx="173" cy="161" r="4.5" fill="#fcd34d"/>
    </g>

  </g>

  <!-- Foreground Atmospheric Highlight Particles / Sparkles of "Peace of Mind" -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="110" cy="95" r="3"/>
    <circle cx="130" cy="80" r="2"/>
    <circle cx="90" cy="110" r="1.5"/>
  </g>
  <g fill="#f59e0b" opacity="0.9">
    <circle cx="125" cy="105" r="2.5"/>
    <circle cx="100" cy="85" r="2"/>
  </g>

</svg>