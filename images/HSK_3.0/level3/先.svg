<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Path / Trail Gradient (denoting "going first") -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Character A (Lead / "Xiân" - Going first) Colors -->
    <linearGradient id="leadSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="leadShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="leadPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character B (Following) Colors -->
    <linearGradient id="followSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="followShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="followPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Park / Street Scene) -->
  <g opacity="0.4">
    <!-- Trees / Foliage silhouettes -->
    <path d="M 20 160 Q 30 110 50 130 Q 70 100 90 140 Q 110 120 130 150 L 130 180 L 20 180 Z" fill="#334155" />
    <path d="M 140 170 Q 160 120 180 145 Q 200 110 220 150 L 220 180 L 140 180 Z" fill="#1e293b" />
    
    <!-- Streetlamp glowing in distance -->
    <rect x="200" y="80" width="3" height="100" fill="#475569" />
    <circle cx="201.5" cy="80" r="8" fill="#fbbf24" />
    <circle cx="201.5" cy="80" r="25" fill="url(#lanternGlow)" />
  </g>

  <!-- Ground / Walkway -->
  <path d="M 0 170 C 60 160, 150 165, 240 180 L 240 240 L 0 240 Z" fill="url(#floorGrad)" />
  <path d="M 0 175 C 70 167, 160 172, 240 185" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" fill="none" />

  <!-- Motion / Directional "First" indicator trails -->
  <path d="M 40 140 Q 80 125 140 145" stroke="url(#pathGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 60 155 Q 95 142 155 160" stroke="url(#pathGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- ================= CHARACTER B (Following / Behind) ================= -->
  <g transform="translate(15, 10) scale(0.9)">
    <!-- Shadow -->
    <ellipse cx="65" cy="175" rx="14" ry="4" fill="#020617" opacity="0.6" />

    <!-- Back Leg -->
    <path d="M 58 145 L 50 170 L 62 172" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Leg -->
    <path d="M 72 145 L 78 168 L 70 171" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Torso / Backpack -->
    <rect x="52" y="115" width="28" height="35" rx="8" fill="url(#followShirt)" />
    <!-- Small backpack to show traveler context -->
    <rect x="47" y="118" width="9" height="22" rx="4" fill="#059669" />

    <!-- Back Arm (Holding nothing, swinging) -->
    <path d="M 60 120 L 48 135" stroke="#34d399" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Head & Hair -->
    <circle cx="66" cy="98" r="14" fill="url(#followSkin)" />
    <!-- Hair (Dark Bob) -->
    <path d="M 52 98 C 52 86, 80 86, 80 98 C 80 102, 78 106, 78 106 L 54 106 Z" fill="#1e293b" />
    
    <!-- Face Profile (Looking slightly forward/right) -->
    <circle cx="73" cy="97" r="1.5" fill="#0f172a" />
    <!-- Friendly waving hand (Front Arm) -->
    <path d="M 72 120 L 86 112" stroke="#34d399" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="88" cy="111" r="4" fill="url(#followSkin)" />
  </g>


  <!-- ================= CHARACTER A (Leading / "Xiân" - Going First) ================= -->
  <g transform="translate(85, -2)">
    <!-- Dynamic Shadow -->
    <ellipse cx="65" cy="178" rx="18" ry="5" fill="#020617" opacity="0.6" />

    <!-- Action Action Lines / Speed indicator -->
    <line x1="15" y1="140" x2="25" y2="140" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="10" y1="150" x2="22" y2="150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Back Leg (Stepping Forward) -->
    <path d="M 55 145 C 50 160, 42 168, 35 172" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Front Leg (Planted ahead) -->
    <path d="M 72 145 C 80 160, 92 168, 100 172" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Shoes -->
    <ellipse cx="32" cy="174" rx="7" ry="4" fill="#0f172a" />
    <ellipse cx="103" cy="174" rx="8" ry="4" fill="#0f172a" />

    <!-- Torso / Jacket -->
    <path d="M 53 115 L 77 115 C 81 115, 83 130, 80 148 L 50 148 C 47 130, 49 115, 53 115 Z" fill="url(#leadShirt)" />
    <!-- Scarf or collar detail -->
    <path d="M 56 113 C 65 120, 70 120, 78 113" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Back Arm (Swinging back) -->
    <path d="M 55 122 L 40 138" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Front Arm (Pointing forward, inviting "You go first") -->
    <path d="M 75 122 L 105 118" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Hand Pointing/Gesturing Forward -->
    <circle cx="108" cy="118" r="4.5" fill="url(#leadSkin)" />

    <!-- Head & Expressive Hair -->
    <circle cx="66" cy="95" r="15" fill="url(#leadSkin)" />
    <!-- Stylish Hair (Spiky / Active) -->
    <path d="M 50 95 C 50 78, 82 78, 82 95 C 82 95, 85 88, 80 84 C 75 80, 65 75, 58 84 C 52 89, 50 95, 50 95 Z" fill="#0f172a" />

    <!-- Face (Confident, smiling, turning back slightly to gesture) -->
    <!-- Eye -->
    <path d="M 70 93 Q 73 90 76 93" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Smile -->
    <path d="M 71 100 Q 75 104 79 100" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheek -->
    <circle cx="74" cy="97" r="2.5" fill="#fb923c" opacity="0.6" />
  </g>

  <!-- Foreground Atmospheric Particles (Floating glowing lights/dust) -->
  <circle cx="40" cy="80" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="120" cy="60" r="1.5" fill="#fbbf24" opacity="0.7" />
  <circle cx="190" cy="110" r="2.5" fill="#38bdf8" opacity="0.5" />
  <circle cx="80" cy="50" r="1" fill="#ffffff" opacity="0.9" />
  <circle cx="210" cy="190" r="2" fill="#34d399" opacity="0.6" />

  <!-- Subtle directional glowing arrow floating overhead (reinforcing 'xiān' / first concept cleanly) -->
  <g transform="translate(135, 45)" opacity="0.8">
    <path d="M 0 10 L 25 10 L 18 4 M 25 10 L 18 16" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>