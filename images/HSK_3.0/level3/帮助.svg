<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Character 1 (Helping) -->
  <g transform="translate(130, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M5 40 Q20 35 35 40 L30 90 L10 90 Z" fill="#38bdf8"/>
    <path d="M10 50 L0 80 M30 50 L40 80" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (Being helped) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M5 40 Q20 35 35 40 L30 90 L10 90 Z" fill="#ec4899"/>
    <rect x="15" y="60" width="10" height="40" fill="#1e293b"/>
  </g>

  <!-- Props: Books and Lamp -->
  <rect x="30" y="140" width="40" height="20" rx="2" fill="#10b981"/>
  <rect x="35" y="130" width="35" height="10" rx="2" fill="#fbbf24"/>
  
  <path d="M180 160 L180 100 L200 100 L200 160" fill="#475569"/>
  <circle cx="190" cy="90" r="20" fill="#f59e0b" opacity="0.6"/>
  <circle cx="190" cy="90" r="10" fill="#fef3c7"/>

  <!-- Action lines -->
  <path d="M110 110 L130 110" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M120 100 L120 120" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
</svg>