<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Night/Evening Atmosphere -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="door-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Room Context -->
  <!-- Floor -->
  <polygon points="0,180 240,180 240,240 0,240" fill="#090d16"/>
  <!-- Baseboard -->
  <rect x="0" y="174" width="240" height="6" fill="#1b2536"/>

  <!-- Wall Background Elements -->
  <!-- Window showing night/evening -->
  <rect x="15" y="45" width="60" height="90" rx="4" fill="#0b1320" stroke="#334155" stroke-width="3"/>
  <rect x="18" y="48" width="54" height="84" fill="url(#window-glow)"/>
  <!-- Window crossbars -->
  <line x1="45" y1="48" x2="45" y2="132" stroke="#334155" stroke-width="2"/>
  <line x1="18" y1="90" x2="72" y2="90" stroke="#334155" stroke-width="2"/>
  <!-- Moon outside -->
  <circle cx="55" cy="65" r="8" fill="#fbbf24" opacity="0.8"/>

  <!-- Wall Clock indicating passage of time (showing late hours) -->
  <circle cx="120" cy="55" r="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="55" r="2" fill="#94a3b8"/>
  <line x1="120" y1="55" x2="120" y2="45" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="55" x2="128" y2="58" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bookshelf with dusty/unused vibe -->
  <rect x="185" y="60" width="40" height="114" fill="#162032" stroke="#283548" stroke-width="2"/>
  <line x1="185" y1="95" x2="225" y2="95" stroke="#283548" stroke-width="2"/>
  <line x1="185" y1="130" x2="225" y2="130" stroke="#283548" stroke-width="2"/>
  <!-- Books -->
  <rect x="190" y="75" width="8" height="20" fill="#38bdf8" rx="1"/>
  <rect x="200" y="73" width="6" height="22" fill="#ec4899" rx="1"/>
  <rect x="208" y="78" width="10" height="17" fill="#10b981" rx="1"/>
  <rect x="192" y="110" width="14" height="20" fill="#f59e0b" rx="1"/>

  <!-- Open Doorway on the left/center depicting someone leaving -->
  <path d="M 85,180 L 85,60 C 85,55 90,50 95,50 L 125,50 C 130,50 135,55 135,60 L 135,180 Z" fill="#060910" stroke="#334155" stroke-width="3"/>
  <!-- Threshold light -->
  <polygon points="90,180 130,180 145,210 75,210" fill="url(#door-light)"/>

  <!-- Dust motes / atmospheric particles showing time elapsed -->
  <circle cx="100" cy="90" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="110" cy="110" r="1" fill="#fbbf24" opacity="0.4"/>
  <circle cx="95" cy="130" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="125" cy="100" r="1" fill="#fbbf24" opacity="0.3"/>

  <!-- Plant on a small stand (drooping slightly, indicating neglect/time) -->
  <rect x="155" y="140" width="18" height="40" fill="#1e293b" rx="2"/>
  <path d="M 152,140 C 152,135 176,135 176,140 Z" fill="#334155"/>
  <!-- Pot -->
  <path d="M 158,140 L 160,158 C 160,160 170,160 172,158 L 174,140 Z" fill="#fb923c"/>
  <!-- Vines hanging down -->
  <path d="M 163,158 Q 155,175 152,190" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 169,158 Q 175,170 178,185" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <circle cx="152" cy="190" r="2.5" fill="#10b981"/>
  <circle cx="178" cy="185" r="2" fill="#059669"/>

  <!-- MAIN CHARACTER: Someone waiting/looking towards the door with a wistful/patient expression -->
  <g transform="translate(155, 95)" filter="url(#soft-shadow)">
    <!-- Shadow beneath character -->
    <ellipse cx="10" cy="85" rx="16" ry="5" fill="#000" opacity="0.6"/>

    <!-- Body / Torso (Sitting or standing leaning slightly) -->
    <path d="M -2,40 C -2,30 8,25 18,25 C 28,25 38,30 38,40 L 34,75 C 34,78 30,80 26,80 L 10,80 C 6,80 2,78 2,75 Z" fill="#38bdf8"/>
    <!-- Collar / Shirt detail -->
    <polygon points="12,25 24,25 18,35" fill="#f8fafc"/>

    <!-- Legs -->
    <rect x="4" y="75" width="8" height="25" fill="#1e293b" rx="3"/>
    <rect x="18" y="75" width="8" height="25" fill="#1e293b" rx="3"/>
    <!-- Shoes -->
    <path d="M 1,98 C 1,96 5,95 8,95 L 13,95 C 15,95 15,99 13,100 L 1,100 Z" fill="#0f172a"/>
    <path d="M 15,98 C 15,96 19,95 22,95 L 27,95 C 29,95 29,99 27,100 L 15,100 Z" fill="#0f172a"/>

    <!-- Arms (One resting on chin/cheek in contemplation) -->
    <path d="M -2,40 Q -10,50 0,60" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <path d="M 38,40 Q 48,50 35,65" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <!-- Hand on cheek -->
    <circle cx="33" cy="63" r="4" fill="#fcd34d"/>

    <!-- Head & Neck -->
    <rect x="14" y="18" width="8" height="10" fill="#fcd34d"/>
    <circle cx="18" cy="12" r="12" fill="#fcd34d"/>

    <!-- Hair (Stylized neat neat hair) -->
    <path d="M 6,12 C 6,4 12,2 18,2 C 24,2 30,4 30,12 C 30,16 28,14 26,10 C 24,6 20,5 18,5 C 16,5 12,6 10,10 C 8,14 6,12 6,12 Z" fill="#1e293b"/>

    <!-- Facial Expression (Thoughtful, slightly melancholic/patient) -->
    <!-- Closed / Gentle calm eye -->
    <path d="M 21,11 Q 23,13 25,11" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Slight neutral/gentle mouth -->
    <path d="M 21,17 Q 23,18 25,17" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Rosy cheek -->
    <circle cx="25" cy="15" r="2.5" fill="#f87171" opacity="0.4"/>
  </g>

  <!-- FADING FOOTPRINTS / TRAIL LEADING OUT THE DOOR (Symbolizing "long time since left") -->
  <g opacity="0.35">
    <ellipse cx="110" cy="190" rx="3" ry="1.5" fill="#fbbf24"/>
    <ellipse cx="105" cy="170" rx="3" ry="1.5" fill="#fbbf24"/>
    <ellipse cx="112" cy="150" rx="3" ry="1.5" fill="#fbbf24"/>
    <ellipse cx="106" cy="130" rx="3" ry="1.5" fill="#fbbf24"/>
    <ellipse cx="110" cy="110" rx="3" ry="1.5" fill="#fbbf24"/>
  </g>

  <!-- Foreground details to create depth (Coffee mug on a small side table) -->
  <rect x="135" y="160" width="25" height="20" fill="#162032" rx="2" stroke="#283548" stroke-width="1.5"/>
  <path d="M 142,160 L 142,150 C 142,148 145,147 148,147 L 150,147 C 153,147 155,148 155,150 L 155,160 Z" fill="#e2e8f0"/>
  <!-- Mug handle -->
  <path d="M 155,151 C 159,151 159,157 155,158" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Cold wisp of steam (barely visible, implying it's been sitting out for a long time) -->
  <path d="M 148,144 Q 151,140 146,136 Q 142,132 147,128" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>