<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Atmospheric Background Elements -->
  <circle cx="40" cy="50" r="1.5" fill="#64748b" opacity="0.4" />
  <circle cx="200" cy="40" r="2" fill="#64748b" opacity="0.3" />
  <circle cx="210" cy="120" r="1" fill="#64748b" opacity="0.5" />
  <circle cx="30" cy="140" r="1.5" fill="#64748b" opacity="0.3" />

  <!-- Back Wall / Desk Setup -->
  <path d="M 0 160 L 240 160" stroke="#475569" stroke-width="2" opacity="0.4" />

  <!-- WORKSPACE / TABLE -->
  <path d="M -10 160 L 250 160 L 260 210 L -20 210 Z" fill="url(#tableGrad)" />
  <path d="M 0 160 L 240 160 L 250 166 L -10 166 Z" fill="#475569" opacity="0.5" />

  <!-- OBJECT GROUP: "The Other Choice / Options" (Representing "其他" - Other items/choices) -->

  <!-- Item 1: Main Selected/Current Object (A sleek futuristic tablet/clipboard in use) -->
  <g transform="translate(45, 105)">
    <!-- Shadow -->
    <ellipse cx="35" cy="55" rx="30" ry="10" fill="#020617" opacity="0.6" />
    
    <!-- Tablet Body (Angled) -->
    <g transform="rotate(-12 35 35)">
      <!-- Base casing -->
      <rect x="5" y="5" width="60" height="75" rx="8" fill="#475569" />
      <rect x="8" y="8" width="54" height="69" rx="5" fill="#0f172a" />
      <!-- Screen content (Active) -->
      <rect x="13" y="15" width="44" height="35" rx="3" fill="url(#screenGlow)" />
      <!-- UI lines on screen -->
      <rect x="18" y="21" width="22" height="4" rx="2" fill="#ffffff" opacity="0.9" />
      <rect x="18" y="29" width="30" height="3" rx="1.5" fill="#bae6fd" opacity="0.7" />
      <rect x="18" y="35" width="16" height="3" rx="1.5" fill="#bae6fd" opacity="0.7" />
      <!-- Home button dot -->
      <circle cx="35" cy="59" r="3" fill="#64748b" />
    </g>
  </g>

  <!-- Item 2 & 3: "其他" (The Other options neatly stacked/beside) -->
  <g transform="translate(130, 95)">
    <!-- Shadow for background items -->
    <ellipse cx="45" cy="65" rx="40" ry="12" fill="#020617" opacity="0.7" />

    <!-- Secondary Tablet/Folder (Slightly behind, angled differently) -->
    <g transform="rotate(15 40 40)">
      <rect x="15" y="10" width="55" height="70" rx="8" fill="#334155" />
      <rect x="18" y="13" width="49" height="64" rx="5" fill="#1e293b" />
      <!-- Screen content (Alternative - Warm Amber Theme) -->
      <rect x="23" y="20" width="39" height="32" rx="3" fill="#f59e0b" opacity="0.9" />
      <circle cx="42" cy="36" r="8" fill="#fff" opacity="0.3" />
      <path d="M 36 36 L 40 40 L 48 32" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <rect x="42" y="70" r="2" />
    </g>

    <!-- Third Item: A sleek modern data card / alternative folder ("其他" - the rest of the options) -->
    <g transform="translate(-15, 25) rotate(-5 30 30)">
      <rect x="10" y="10" width="50" height="60" rx="6" fill="#0ea5e9" />
      <rect x="12" y="12" width="46" height="56" rx="4" fill="#0f172a" />
      <!-- Mini UI elements representing alternative data -->
      <circle cx="25" cy="27" r="6" fill="#38bdf8" opacity="0.8" />
      <rect x="36" y="23" width="16" height="4" rx="2" fill="#38bdf8" opacity="0.8" />
      <rect x="36" y="30" width="10" height="3" rx="1.5" fill="#64748b" />
      
      <circle cx="25" cy="45" r="6" fill="#10b981" opacity="0.8" />
      <rect x="36" y="41" width="14" height="4" rx="2" fill="#10b981" opacity="0.8" />
      <rect x="36" y="48" width="8" height="3" rx="1.5" fill="#64748b" />
    </g>
  </g>

  <!-- Foreground Atmospheric Props: Coffee cup / marker adding realistic context -->
  <g transform="translate(25, 130)">
    <ellipse cx="15" cy="30" rx="12" ry="5" fill="#020617" opacity="0.8" />
    <!-- Cup Body -->
    <path d="M 5 10 L 9 32 C 9 34 11 35 13 35 L 17 35 C 19 35 21 34 21 32 L 25 10 Z" fill="#ec4899" />
    <!-- Cup Rim -->
    <ellipse cx="15" cy="10" rx="10" ry="3" fill="#f472b6" />
    <!-- Steam wisps representing "active environment" -->
    <path d="M 12 4 Q 15 0 12 -4" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 18 3 Q 21 -1 18 -6" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>

  <!-- Interaction / Focus Sparkles (Highlighting the concept of choices/alternatives) -->
  <g transform="translate(170, 70)">
    <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <circle cx="10" cy="10" r="3" fill="#f59e0b" />
  </g>

  <g transform="translate(25, 80)">
    <path d="M 0 6 L 12 6 M 6 0 L 6 12" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <g transform="translate(115, 65)">
    <circle cx="4" cy="4" r="2" fill="#ec4899" opacity="0.7" />
  </g>

  <!-- Subtle dynamic action lines indicating arrangement / sorting of the "others" -->
  <path d="M 100 135 Q 120 120 145 125" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.4" />
</svg>