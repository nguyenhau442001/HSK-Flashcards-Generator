<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Track/Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Basketball Jersey Gradient -->
    <linearGradient id="jerseyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Basketball Gradient -->
    <radialGradient id="ballGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>

    <!-- Glow Filter for Ambient Energy -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Stadium / Gym Background Elements (Depth & Atmosphere) -->
  <!-- Ambient lighting circles -->
  <circle cx="120" cy="50" r="90" fill="#38bdf8" opacity="0.04" filter="url(#glow)"/>
  <circle cx="180" cy="140" r="60" fill="#f59e0b" opacity="0.06" filter="url(#glow)"/>

  <!-- Basketball Hoop / Backboard Structure in Background -->
  <g opacity="0.4">
    <!-- Backboard -->
    <rect x="85" y="25" width="70" height="45" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="105" y="45" width="30" height="20" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <!-- Rim & Net -->
    <ellipse cx="120" cy="65" rx="14" ry="4" fill="none" stroke="#ef4444" stroke-width="3"/>
    <path d="M 108 67 L 114 85 L 126 85 L 132 67" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Gym Floor / Surface -->
  <path d="M 0 170 Q 120 160 240 170 L 240 240 L 0 240 Z" fill="url(#floorGrad)"/>
  <!-- Floor line perspective -->
  <path d="M 0 185 Q 120 175 240 185" fill="none" stroke="#475569" stroke-width="2" opacity="0.6"/>

  <!-- Dynamic Motion swooshes -->
  <path d="M 30 130 Q 80 100 130 110" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.3" filter="url(#glow)"/>
  <path d="M 150 90 Q 190 70 210 100" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Character / Athlete (Action Pose - Mid Dunk/Leap) -->
  <g filter="url(#softShadow)">
    <!-- Shadow on floor -->
    <ellipse cx="120" cy="178" rx="28" ry="7" fill="#020617" opacity="0.6"/>

    <!-- Dynamic Legs (Bent in mid-air action) -->
    <!-- Back Leg -->
    <path d="M 105 135 Q 90 155 95 168" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
    <circle cx="95" cy="168" r="5" fill="#38bdf8"/>
    
    <!-- Front Leg -->
    <path d="M 125 135 Q 140 150 145 165" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
    <path d="M 142 165 L 150 170" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>

    <!-- Torso with Sports Jersey -->
    <path d="M 100 100 L 140 100 L 135 140 L 105 140 Z" fill="url(#jerseyGrad)" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Jersey detail stripes -->
    <path d="M 108 100 L 112 125" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    <path d="M 132 100 L 128 125" stroke="#ffffff" stroke-width="3" opacity="0.4"/>

    <!-- Head & Cap/Hair -->
    <circle cx="120" cy="78" r="14" fill="#fbbf24"/>
    <!-- Sweat band -->
    <rect x="107" y="72" width="26" height="5" rx="2" fill="#ef4444"/>
    <!-- Energetic Hair -->
    <path d="M 106 75 C 102 68 110 64 115 66" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Arms in Action -->
    <!-- Back Arm (Holding/Reaching) -->
    <path d="M 105 105 Q 85 100 80 85" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>

    <!-- Front Arm (Reaching up to slam dunk) -->
    <path d="M 135 105 Q 160 90 168 75" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- The Basketball (Main Focus Object) -->
  <g filter="url(#softShadow)">
    <circle cx="178" cy="65" r="18" fill="url(#ballGrad)"/>
    <!-- Basketball Seams -->
    <path d="M 160 65 Q 178 50 196 65" fill="none" stroke="#7c2d12" stroke-width="1.5" opacity="0.8"/>
    <path d="M 160 65 Q 178 80 196 65" fill="none" stroke="#7c2d12" stroke-width="1.5" opacity="0.8"/>
    <path d="M 178 47 Q 163 65 178 83" fill="none" stroke="#7c2d12" stroke-width="1.5" opacity="0.8"/>
    <!-- Ball Highlight -->
    <circle cx="171" cy="58" r="3" fill="#fed7aa" opacity="0.6"/>
  </g>

  <!-- Secondary Sports Equipment Props (Contextual depth) -->
  <!-- Dumbbell on the floor (left) -->
  <g transform="translate(40, 160) rotate(-15)" filter="url(#softShadow)">
    <rect x="0" y="6" width="28" height="6" rx="3" fill="#64748b"/>
    <circle cx="2" cy="9" r="8" fill="#334155"/>
    <circle cx="26" cy="9" r="8" fill="#334155"/>
    <rect x="-1" y="4" width="6" height="10" rx="2" fill="#1e293b"/>
    <rect x="23" y="4" width="6" height="10" rx="2" fill="#1e293b"/>
  </g>

  <!-- Water Bottle on the floor (right) -->
  <g transform="translate(190, 150)" filter="url(#softShadow)">
    <rect x="0" y="8" width="12" height="22" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="3" y="2" width="6" height="6" rx="1" fill="#0f172a"/>
    <rect x="2" y="14" width="8" height="6" fill="#f8fafc" opacity="0.5"/>
  </g>

  <!-- Action Sparkles / Energy Dots -->
  <circle cx="70" cy="95" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="150" cy="50" r="2" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="95" cy="120" r="2" fill="#10b981"/>
  <circle cx="140" cy="150" r="2.5" fill="#f43f5e"/>

  <!-- Foreground Atmospheric Vignette for polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15"/>
</svg>