<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Gradient for "Thinking / Opinion" Concept -->
    <radialGradient id="thinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- UI/Thought Bubble Gradient -->
    <linearGradient id="thoughtBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Room -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4" />
  
  <!-- Bookshelf / Prop in Background -->
  <rect x="35" y="45" width="40" height="8" rx="2" fill="#334155" />
  <rect x="42" y="25" width="8" height="20" rx="1" fill="#10b981" />
  <rect x="52" y="28" width="7" height="17" rx="1" fill="#38bdf8" />
  <rect x="61" y="22" width="9" height="23" rx="1" fill="#ec4899" />

  <!-- Window with atmospheric light -->
  <path d="M165,35 L200,35 L200,85 L165,85 Z" fill="url(#windowLight)" stroke="#334155" stroke-width="2" />
  <line x1="182" y1="35" x2="182" y2="85" stroke="#334155" stroke-width="2" />
  <line x1="165" y1="60" x2="200" y2="60" stroke="#334155" stroke-width="2" />

  <!-- Desk Surface -->
  <path d="M10,170 L230,170 L220,210 L20,210 Z" fill="#0f172a" />
  <rect x="15" y="165" width="210" height="8" rx="2" fill="#475569" />

  <!-- Desk Props: Plant & Lamp -->
  <!-- Plant Pot -->
  <path d="M32,150 L48,150 L45,165 L35,165 Z" fill="#cbd5e1" />
  <circle cx="40" cy="143" r="10" fill="#10b981" />
  <circle cx="33" cy="148" r="8" fill="#059669" />
  <circle cx="46" cy="146" r="9" fill="#34d399" />

  <!-- Desk Lamp -->
  <path d="M195,165 L205,165 L202,130 L198,130 Z" fill="#64748b" />
  <path d="M188,115 L215,115 L207,130 L196,130 Z" fill="#f59e0b" />
  <circle cx="201" cy="122" r="25" fill="url(#lampGlow)" />

  <!-- MAIN CHARACTER (Thoughtful student/analyst at desk) -->
  <g transform="translate(0, 5)">
    <!-- Body & Hoodie -->
    <path d="M90,170 C90,145 150,145 150,170 Z" fill="#3b82f6" />
    <path d="M105,145 L135,145 L130,130 L110,130 Z" fill="#1d4ed8" /> <!-- Collar -->

    <!-- Neck -->
    <rect x="112" y="120" width="16" height="15" fill="#fcd34d" />

    <!-- Head -->
    <circle cx="120" cy="105" r="22" fill="#fcd34d" />

    <!-- Hair -->
    <path d="M98,105 C98,90 108,83 120,83 C132,83 142,90 142,105 C142,110 140,103 140,96 C140,87 132,85 120,85 C108,85 100,87 100,96 C100,103 98,110 98,105 Z" fill="#1e293b" />

    <!-- Face Profile / Expression (Engaged in forming an opinion/idea) -->
    <!-- Eyes closed thoughtfully or focused -->
    <path d="M112,103 Q116,106 120,103" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M124,103 Q128,106 132,103" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Confident/Determined Mouth -->
    <path d="M117,115 Q120,118 123,115" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Hand on chin (Classic "Thinking / Having an opinion" pose) -->
    <path d="M110,125 C110,120 115,112 120,115 C125,118 120,128 115,130 Z" fill="#fcd34d" filter="url(#shadow)" />
    <!-- Arm supporting pose -->
    <path d="M110,125 L95,150 L110,155 Z" fill="#3b82f6" />
  </g>

  <!-- LAPTOP & DOCUMENTS (Tangible Context) -->
  <!-- Laptop Base -->
  <path d="M75,160 L145,160 L155,172 L65,172 Z" fill="#94a3b8" />
  <!-- Laptop Screen -->
  <path d="M78,125 L142,125 L145,160 L75,160 Z" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <!-- Screen Graphic (Data visualization bars representing 'ideas/thoughts') -->
  <rect x="85" y="133" width="10" height="18" rx="2" fill="#38bdf8" />
  <rect x="99" y="138" width="10" height="13" rx="2" fill="#fbbf24" />
  <rect x="113" y="130" width="10" height="21" rx="2" fill="#10b981" />
  <path d="M85,155 L135,155" stroke="#334155" stroke-width="2" />

  <!-- THOUGHT & OPINION BUBBLES (Representing "认为" - to think, to consider, to have the opinion that) -->
  <circle cx="120" cy="55" r="38" fill="url(#thinkGlow)" />

  <!-- Main Thought Bubble -->
  <g filter="url(#shadow)">
    <path d="M100,65 
             C75,65 65,50 65,38 
             C65,25 78,15 98,15 
             L142,15 
             C162,15 175,25 175,38 
             C175,50 162,65 142,65 
             L130,65 
             L115,80 
             L115,65 Z" 
          fill="url(#thoughtBubbleGrad)" 
          stroke="#475569" 
          stroke-width="2.5" />

    <!-- Small floating thought circles -->
    <circle cx="95" cy="74" r="5" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <circle cx="85" cy="85" r="3" fill="#334155" stroke="#475569" stroke-width="1.5" />

    <!-- INSIDE THE THOUGHT BUBBLE: Visualizing "An Opinion / Conclusion" -->
    <!-- Lightbulb moment combined with a checkmark (representing "I think this is correct / My opinion") -->
    <!-- Glowing lightbulb icon inside bubble -->
    <path d="M113,28 C113,23 117,19 122,19 C127,19 131,23 131,28 C131,32 128,35 126,37 L126,41 C126,42 125,43 124,43 L120,43 C119,43 118,42 118,41 L118,37 C116,35 113,32 113,28 Z" fill="#fbbf24" />
    <rect x="119" y="44" width="6" height="3" fill="#64748b" rx="0.5" />
    <path d="M118,49 L126,49" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Sparkles / Opinion tokens floating around -->
    <path d="M85,32 L88,35 L85,38 L82,35 Z" fill="#38bdf8" />
    <path d="M152,30 L154,32 L152,34 L150,32 Z" fill="#10b981" />
    <circle cx="146" cy="48" r="3" fill="#ec4899" />
    <circle cx="94" cy="45" r="2.5" fill="#fb923c" />

    <!-- Checkmark symbol inside thought (Core semantic: "Belief / Conclusion formed") -->
    <path d="M136,35 L143,42 L155,26" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Dynamic foreground accent light dots -->
  <circle cx="30" cy="100" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="210" cy="90" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="190" cy="180" r="1.5" fill="#10b981" opacity="0.7" />
  <circle cx="50" cy="190" r="2" fill="#ec4899" opacity="0.5" />
</svg>