<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Paper Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient lighting / Windows in background -->
  <g opacity="0.15">
    <polygon points="170,20 220,50 220,130 170,100" fill="#38bdf8"/>
    <polygon points="110,35 150,55 150,115 110,95" fill="#38bdf8"/>
  </g>

  <!-- Bookshelf / Background Props -->
  <rect x="25" y="60" width="45" height="70" rx="4" fill="#334155"/>
  <rect x="30" y="70" width="35" height="8" rx="2" fill="#475569"/>
  <rect x="30" y="85" width="35" height="12" rx="2" fill="#f59e0b" opacity="0.8"/>
  <rect x="30" y="103" width="35" height="10" rx="2" fill="#10b981" opacity="0.8"/>

  <!-- House Plant -->
  <path d="M195,140 Q200,120 185,100 Q205,110 210,135 Z" fill="#10b981" opacity="0.9"/>
  <path d="M195,140 Q180,125 165,115 Q180,130 190,142 Z" fill="#34d399" opacity="0.9"/>
  <path d="M195,140 Q215,120 225,105 Q215,130 200,143 Z" fill="#059669" opacity="0.9"/>
  <path d="M185,140 C185,132 205,132 205,140 L202,155 C202,158 188,158 188,155 Z" fill="#cbd5e1"/>

  <!-- Desk Surface -->
  <path d="M10,165 L230,165 L220,210 L20,210 Z" fill="url(#deskGrad)" />
  <rect x="15" y="160" width="210" height="8" rx="3" fill="#475569"/>

  <!-- Laptop / Modern Setup -->
  <path d="M145,135 L205,135 L215,165 L135,165 Z" fill="#64748b"/>
  <path d="M148,138 L202,138 L210,162 L140,162 Z" fill="#0f172a"/>
  <!-- Screen Glow -->
  <path d="M155,143 L195,143 L198,157 L152,157 Z" fill="#38bdf8" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Coffee Mug -->
  <rect x="25" y="145" width="16" height="20" rx="3" fill="#ec4899"/>
  <path d="M41,150 C46,150 46,160 41,162" stroke="#ec4899" stroke-width="2.5" fill="none"/>
  <ellipse cx="33" cy="145" rx="8" ry="3" fill="#fbcfe8"/>

  <!-- MAIN PROP: Notebook with Sentences (The core of "句子") -->
  <g filter="url(#shadow)" transform="rotate(-5, 105, 155)">
    <!-- Notebook Cover -->
    <rect x="70" y="115" width="75" height="60" rx="4" fill="#fb923c"/>
    <!-- Notebook Pages -->
    <rect x="75" y="110" width="75" height="60" rx="4" fill="#f8fafc"/>
    <!-- Spiral Binding -->
    <path d="M73,113 L73,167" stroke="#334155" stroke-width="3" stroke-dasharray="4,4"/>
    
    <!-- Abstract Sentence Lines (Representing written phrases/sentences) -->
    <!-- Line 1 -->
    <line x1="88" y1="125" x2="120" y2="125" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <circle cx="128" cy="125" r="1.5" fill="#ef4444"/>
    
    <!-- Line 2 (Highlighted/Active sentence being written) -->
    <line x1="88" y1="138" x2="135" y2="138" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="88" y1="147" x2="115" y2="147" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="123" cy="147" r="1.5" fill="#10b981"/>

    <!-- Line 3 -->
    <line x1="88" y1="160" x2="110" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Character: Upper body, arms, hands writing -->
  <!-- Character Torso & Hoodie -->
  <path d="M60,220 C60,185 85,175 105,175 C125,175 150,185 150,220 Z" fill="#6366f1"/>
  <!-- Hoodie Pocket/Details -->
  <path d="M90,200 L120,200 L115,215 L95,215 Z" fill="#4f46e5" opacity="0.6"/>

  <!-- Character Neck & Head -->
  <rect x="92" y="150" width="24" height="30" rx="8" fill="#ffd166"/>
  <!-- Head Shape -->
  <circle cx="104" cy="130" r="24" fill="#ffcc00"/>
  
  <!-- Hair Style -->
  <path d="M80,125 C80,105 100,102 120,110 C128,113 128,125 128,135 L120,135 C120,120 100,112 90,120 Z" fill="#1e293b"/>
  <circle cx="83" cy="127" r="5" fill="#1e293b"/>

  <!-- Face Profile / Expression (Concentrated, happy learning) -->
  <circle cx="112" cy="128" r="2" fill="#1e293b"/>
  <!-- Smiling / Focused mouth -->
  <path d="M108,138 Q113,142 118,138" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Character Arms & Hands interacting with the notebook -->
  <!-- Left Arm (Supporting/Resting) -->
  <path d="M70,195 Q75,175 90,165" stroke="#6366f1" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="92" cy="162" r="8" fill="#ffd166"/>

  <!-- Right Arm (Holding Pen & Writing) -->
  <path d="M140,195 Q130,165 115,152" stroke="#6366f1" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Right Hand -->
  <circle cx="110" cy="148" r="8" fill="#ffd166"/>

  <!-- Pen / Stylus Tool -->
  <path d="M105,142 L125,122" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
  <path d="M123,124 L128,119" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

  <!-- Action Sparkles / Writing Flourish (Indicates the creation of a "sentence") -->
  <g fill="#fbbf24">
    <path d="M135,115 Q140,115 140,110 Q140,115 145,115 Q140,115 140,120 Q140,115 135,115 Z" />
    <path d="M65,100 Q70,100 70,95 Q70,100 75,100 Q70,100 70,105 Q70,100 65,100 Z" opacity="0.7"/>
  </g>
</svg>