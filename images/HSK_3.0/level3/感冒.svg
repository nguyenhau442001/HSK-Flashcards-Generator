<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warm-lamp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="blanket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <clipPath id="room-clip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <!-- Full bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" clip-path="url(#room-clip)" />

  <!-- Background Environment: Cozy bedroom at home (since he didn't go to work) -->
  <g id="environment">
    <!-- Wall & Floor partition -->
    <rect x="0" y="0" width="240" height="150" fill="#1e293b" />
    <rect x="0" y="150" width="240" height="90" fill="#0f172a" />
    <!-- Wooden floor planks perspective lines -->
    <line x1="0" y1="180" x2="240" y2="180" stroke="#1e293b" stroke-width="1.5" opacity="0.5" />
    <line x1="0" y1="210" x2="240" y2="210" stroke="#1e293b" stroke-width="1.5" opacity="0.5" />

    <!-- Window showing a daylight/morning outside (he's missing work) -->
    <rect x="25" y="30" width="55" height="75" rx="4" fill="#334155" />
    <rect x="29" y="34" width="22" height="67" rx="2" fill="#64748b" opacity="0.3" />
    <rect x="55" y="34" width="22" height="67" rx="2" fill="#64748b" opacity="0.3" />
    <!-- Window frame -->
    <rect x="25" y="30" width="55" height="75" rx="4" fill="none" stroke="#475569" stroke-width="3" />
    <line x1="52" y1="30" x2="52" y2="105" stroke="#475569" stroke-width="2" />
    <line x1="25" y1="67" x2="80" y2="67" stroke="#475569" stroke-width="2" />

    <!-- Nightstand -->
    <rect x="175" y="115" width="45" height="65" rx="3" fill="#334155" />
    <rect x="183" y="130" width="29" height="8" rx="2" fill="#475569" />
    <rect x="183" y="150" width="29" height="8" rx="2" fill="#475569" />

    <!-- Desk lamp on nightstand casting warm glow -->
    <path d="M190 115 L197 95 L203 95 L210 115 Z" fill="#94a3b8" />
    <ellipse cx="200" cy="95" rx="10" ry="4" fill="#cbd5e1" />
    <!-- Lamp glow conical gradient representation -->
    <polygon points="200,95 160,180 240,180" fill="url(#warm-lamp)" opacity="0.15" style="mix-blend-mode: screen;" />

    <!-- Medicine items on nightstand: bottle and tissue box -->
    <rect x="182" y="98" width="10" height="17" rx="2" fill="#ef4444" />
    <rect x="184" y="94" width="6" height="4" fill="#ffffff" />
    
    <!-- Tissues container with a tissue sticking out -->
    <rect x="208" y="98" width="14" height="17" rx="2" fill="#f8fafc" />
    <path d="M213 98 Q 215 90, 218 85 Q 220 92, 222 98" fill="#e2e8f0" />
  </g>

  <!-- Foreground Props: Abandoned Work Laptop (Showing he's NOT at work) -->
  <g id="workplace-prop-abandoned">
    <!-- Small low table or closed laptop near bed -->
    <path d="M55 180 L85 170 L95 190 L65 200 Z" fill="#334155" />
    <!-- Closed Laptop -->
    <rect x="68" y="177" width="22" height="15" rx="1" fill="#64748b" transform="rotate(-10 68 177)" />
    <rect x="66" y="190" width="26" height="3" rx="1" fill="#475569" transform="rotate(-10 66 190)" />
    <!-- Coffee mug with a cold drink/abandoned -->
    <rect x="95" y="175" width="10" height="12" rx="2" fill="#f1f5f9" />
    <path d="M105 178 C 109 178, 109 184, 105 184" fill="none" stroke="#f1f5f9" stroke-width="2" />
  </g>

  <!-- Main Subject: Sick Character in Bed (Ganmao - Colds/Flu) -->
  <g id="sick-character">
    <!-- Bed frame / mattress base -->
    <rect x="90" y="130" width="125" height="90" rx="12" fill="#475569" opacity="0.3" />

    <!-- Pillow -->
    <g transform="rotate(-5 125 130)">
      <rect x="105" y="115" width="45" height="28" rx="8" fill="#cbd5e1" />
      <rect x="107" y="117" width="41" height="24" rx="6" fill="#f1f5f9" />
    </g>

    <!-- Character Head & Face (Sick expression) -->
    <!-- Neck -->
    <rect x="125" y="125" width="16" height="20" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="133" cy="115" r="22" fill="#fbcfe8" />

    <!-- Messy hair -->
    <path d="M112 115 C 112 98, 130 95, 145 102 C 150 98, 158 105, 155 115 C 158 112, 160 118, 153 122 C 145 110, 120 112, 112 115 Z" fill="#334155" />

    <!-- Sick Face Details -->
    <!-- Red flush cheeks (fever) -->
    <circle cx="120" cy="122" r="5" fill="#f43f5e" opacity="0.4" />
    <circle cx="145" cy="122" r="5" fill="#f43f5e" opacity="0.4" />

    <!-- Closed tired/sick eyes (horizontal curved lines) -->
    <path d="M118 114 Q 122 117, 126 114" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M139 114 Q 143 117, 147 114" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Eyebrows worried/uncomfortable -->
    <path d="M117 110 Q 122 108, 127 111" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M138 111 Q 143 108, 148 110" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Mouth slight frown / breathing through mouth -->
    <path d="M130 126 Q 133 124, 136 126" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Thermometer in mouth -->
    <rect x="131" y="122" width="18" height="4" rx="2" fill="#94a3b8" transform="rotate(-15 131 122)" />
    <circle cx="147" cy="118" r="3" fill="#ef4444" />

    <!-- Cozy Blanket / Duvet covering body up to chest -->
    <path d="M95 150 Q 120 135, 150 145 Q 180 155, 215 150 L 215 210 Q 150 220, 95 210 Z" fill="url(#blanket-grad)" />
    <!-- Blanket fold/rim -->
    <path d="M95 150 Q 120 135, 150 145 Q 180 155, 215 150" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" />

    <!-- Arm wrapped over blanket holding a tissue -->
    <path d="M130 148 C 140 145, 155 155, 160 165" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" />
    <!-- Hand holding tissue -->
    <circle cx="163" cy="167" r="7" fill="#fbcfe8" />
    <path d="M158 162 Q 165 155, 172 160 Q 168 172, 163 170 Z" fill="#f8fafc" />

    <!-- Sick indicators: Floating sweat drop / thermometer vibe / feeling cold -->
    <path d="M152 102 C 152 97, 156 95, 156 95 C 156 95, 160 97, 160 102 C 160 104, 158 106, 156 106 C 154 106, 152 104, 152 102 Z" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Additional Narrative Context Props -->
  <!-- Hot water bag / mug of ginger tea with steam -->
  <g id="hot-tea">
    <!-- Ceramic Mug on bed edge / nightstand overlap -->
    <rect x="155" y="180" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M171 185 C 176 185, 176 195, 171 195" fill="none" stroke="#f8fafc" stroke-width="3" />
    <ellipse cx="163" cy="180" rx="8" ry="3" fill="#fb923c" /> <!-- Tea liquid -->
    <!-- Steam swirls (showing warmth/medicine) -->
    <path d="M160 170 Q 157 163, 163 158 Q 169 153, 165 146" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M167 172 Q 164 167, 168 163" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Subtle Rim Lighting / Highlights for 2D Vector Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" clip-path="url(#room-clip)" />
</svg>