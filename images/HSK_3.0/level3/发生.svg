<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="popGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Atmospheric Light Beams / Background details -->
  <path d="M40 0 L100 240 L140 240 L80 0 Z" fill="#38bdf8" opacity="0.03"/>
  <path d="M140 0 L200 240 L230 240 L170 0 Z" fill="#fbbf24" opacity="0.03"/>

  <!-- Desk Surface -->
  <path d="M 12 180 Q 120 160 228 180 L 230 220 Q 120 235 10 220 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <path d="M 12 180 Q 120 160 228 180 L 228 186 Q 120 166 12 186 Z" fill="#475569" opacity="0.6"/>

  <!-- Background Props: Shelves & Plant -->
  <rect x="25" y="70" width="70" height="6" rx="3" fill="#334155"/>
  <!-- Mini potted plant -->
  <path d="M 45 70 L 50 55 L 60 55 L 65 70 Z" fill="#ec4899" opacity="0.8"/>
  <circle cx="55" cy="50" r="12" fill="#10b981"/>
  <circle cx="48" cy="45" r="8" fill="#34d399"/>
  <circle cx="62" cy="46" r="9" fill="#059669"/>

  <!-- Books stacked -->
  <rect x="155" y="145" width="45" height="10" rx="2" fill="#6366f1"/>
  <rect x="150" y="155" width="50" height="10" rx="2" fill="#f43f5e"/>
  <rect x="153" y="165" width="47" height="9" rx="2" fill="#14b8a6"/>

  <!-- Action Burst Glow (The "Happening" effect) -->
  <circle cx="120" cy="115" r="60" fill="url(#popGlow)"/>

  <!-- Dynamic Action Lines / Sparkles representing 'Happening / Phạt sinh' -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="50" x2="120" y2="35" opacity="0.9"/>
    <line x1="170" y1="80" x2="182" y2="70" opacity="0.8"/>
    <line x1="70" y1="80" x2="58" y2="70" opacity="0.8"/>
    <line x1="185" y1="125" x2="200" y2="120" opacity="0.9"/>
    <line x1="55" y1="125" x2="40" y2="120" opacity="0.9"/>
  </g>

  <g fill="#f59e0b">
    <circle cx="85" cy="75" r="3" />
    <circle cx="155" cy="75" r="4" />
    <circle cx="180" cy="100" r="2.5" />
    <circle cx="65" cy="110" r="3" />
    <circle cx="140" cy="55" r="2" />
  </g>

  <!-- MAIN SUBJECT: The Surprising Event / Popping out Coffee Mug Incident -->
  <!-- Falling/Spilling Coffee Mug Scene -->
  <g filter="url(#shadow)">
    <!-- Splashing Liquid Droplets -->
    <path d="M 95 100 Q 85 90 90 80 Q 95 70 105 85 Z" fill="#38bdf8"/>
    <path d="M 145 95 Q 155 85 150 75 Q 145 65 135 80 Z" fill="#38bdf8"/>
    <circle cx="110" cy="65" r="5" fill="#38bdf8"/>
    <circle cx="130" cy="60" r="3.5" fill="#38bdf8"/>
    <circle cx="155" cy="110" r="4" fill="#38bdf8"/>
    <circle cx="85" cy="115" r="3" fill="#38bdf8"/>

    <!-- Dynamic Central Splash Wave -->
    <path d="M 90 125 C 90 100, 150 100, 150 125 C 150 135, 90 135, 90 125 Z" fill="url(#coffeeGrad)" opacity="0.85"/>

    <!-- Tilted / Falling Ceramic Mug -->
    <g transform="translate(120, 125) rotate(35) translate(-120, -125)">
      <!-- Mug Body -->
      <path d="M 102 100 L 138 100 L 144 140 C 144 148, 136 152, 120 152 C 104 152, 96 148, 96 140 Z" fill="#f8fafc"/>
      <!-- Mug Rim -->
      <ellipse cx="120" cy="100" rx="18" ry="5" fill="#e2e8f0"/>
      <!-- Mug Inner / Liquid -->
      <ellipse cx="120" cy="101" rx="15" ry="3.5" fill="#0284c7"/>
      <!-- Mug Handle -->
      <path d="M 138 110 C 152 110, 152 138, 138 142" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
      <!-- Cute Face on Mug (surprised expression reacting to the 'incident') -->
      <circle cx="114" cy="122" r="2" fill="#1e293b"/>
      <circle cx="126" cy="122" r="2" fill="#1e293b"/>
      <ellipse cx="120" cy="130" rx="3" ry="4" fill="#1e293b"/>
    </g>
  </g>

  <!-- Impact / Ripple rings on desk -->
  <ellipse cx="120" cy="155" rx="25" ry="8" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <ellipse cx="120" cy="155" rx="45" ry="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="35" cy="190" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="205" cy="180" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="215" cy="205" r="2.5" fill="#ec4899" opacity="0.4"/>
</svg>