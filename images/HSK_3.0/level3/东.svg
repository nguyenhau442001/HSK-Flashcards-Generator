<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Sun / East Glow Gradient -->
    <radialGradient id="eastGlow" cx="85%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- School Building Gradient -->
    <linearGradient id="schoolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- City Skyline Gradients -->
    <linearGradient id="buildingFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="buildingMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Compass / Direction Indicator Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Morning Sun Rising in the East (Right side) -->
  <circle cx="200" cy="95" r="75" fill="url(#eastGlow)"/>
  <circle cx="200" cy="95" r="24" fill="#fef08a"/>

  <!-- Background City Skyline (West/Center parts of the city) -->
  <g id="city-skyline" opacity="0.7">
    <!-- Far buildings -->
    <rect x="15" y="110" width="22" height="90" fill="url(#buildingFar)"/>
    <rect x="42" y="95" width="28" height="105" fill="url(#buildingFar)"/>
    <rect x="75" y="125" width="18" height="75" fill="url(#buildingFar)"/>
    <rect x="98" y="85" width="32" height="115" fill="url(#buildingFar)"/>
    <rect x="135" y="105" width="25" height="95" fill="url(#buildingFar)"/>
    
    <!-- Mid buildings -->
    <rect x="25" y="120" width="35" height="80" fill="url(#buildingMid)"/>
    <rect x="65" y="100" width="30" height="100" fill="url(#buildingMid)"/>
    <rect x="120" y="115" width="40" height="85" fill="url(#buildingMid)"/>

    <!-- City Windows (Tiny glowing dots) -->
    <g fill="#cbd5e1" opacity="0.6">
      <rect x="32" y="130" width="4" height="6" rx="1"/><rect x="42" y="130" width="4" height="6" rx="1"/>
      <rect x="32" y="145" width="4" height="6" rx="1"/><rect x="42" y="145" width="4" height="6" rx="1"/>
      <rect x="72" y="110" width="5" height="7" rx="1"/><rect x="83" y="110" width="5" height="7" rx="1"/>
      <rect x="72" y="125" width="5" height="7" rx="1"/><rect x="83" y="125" width="5" height="7" rx="1"/>
      <rect x="130" y="130" width="5" height="8" rx="1"/><rect x="142" y="130" width="5" height="8" rx="1"/>
    </g>
  </g>

  <!-- Ground / Street Level -->
  <rect x="0" y="195" width="240" height="45" fill="#0f172a"/>
  <!-- Street Path -->
  <path d="M 0 215 Q 110 205 240 220 L 240 240 L 0 240 Z" fill="#1e293b"/>
  <!-- Street dashes -->
  <path d="M 30 227 L 70 225 M 100 223 L 150 221 M 180 220 L 220 219" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>

  <!-- SCHOOL BUILDING IN THE EAST (Highlighted, prominent, right-leaning composition) -->
  <g id="school-building">
    <!-- School Main Structure -->
    <rect x="160" y="100" width="65" height="95" fill="url(#schoolGrad)" rx="3"/>
    <!-- School Side Wing -->
    <path d="M 135 125 L 160 110 L 160 195 L 135 195 Z" fill="#0284c7"/>
    
    <!-- Roof / Architecture Feature -->
    <polygon points="192,75 155,100 230,100" fill="#f43f5e"/>
    <rect x="187" y="65" width="10" height="15" fill="#cbd5e1" rx="2"/>
    <circle cx="192" cy="70" r="3" fill="#fbbf24"/>

    <!-- School Gate / Entrance -->
    <path d="M 180 165 C 180 152 204 152 204 165 L 204 195 L 180 195 Z" fill="#0f172a"/>
    <path d="M 183 166 C 183 155 201 155 201 166 Z" fill="#38bdf8"/>

    <!-- School Windows -->
    <!-- Front face windows -->
    <g fill="#fef08a" stroke="#0284c7" stroke-width="1.5">
      <rect x="170" y="115" width="10" height="14" rx="2"/>
      <rect x="198" y="115" width="10" height="14" rx="2"/>
      <rect x="170" y="138" width="10" height="14" rx="2"/>
      <rect x="198" y="138" width="10" height="14" rx="2"/>
    </g>
    <!-- Side wing windows -->
    <g fill="#e0f2fe" opacity="0.8">
      <rect x="143" y="135" width="9" height="12" rx="1"/>
      <rect x="143" y="155" width="9" height="12" rx="1"/>
    </g>

    <!-- Friendly decorative tree near school -->
    <circle cx="145" cy="180" r="14" fill="#10b981"/>
    <circle cx="137" cy="188" r="10" fill="#059669"/>
    <rect x="143" y="188" width="4" height="10" fill="#78350f"/>
  </g>

  <!-- Foreground Context: Student / Character walking towards the school -->
  <g id="student-character">
    <!-- Character Shadow -->
    <ellipse cx="85" cy="205" rx="12" ry="4" fill="#020617" opacity="0.6"/>

    <!-- Backpack -->
    <path d="M 75 160 C 70 160 67 165 68 175 L 75 180 Z" fill="#ec4899"/>
    
    <!-- Legs (Walking pose) -->
    <path d="M 80 183 L 73 203" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <path d="M 88 183 L 95 201" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="71" cy="204" rx="4" ry="2" fill="#0f172a"/>
    <ellipse cx="97" cy="202" rx="4" ry="2" fill="#0f172a"/>

    <!-- Body / Jacket -->
    <path d="M 77 155 L 95 155 L 93 185 L 77 185 Z" fill="#6366f1" rx="3"/>
    <!-- Scarf -->
    <path d="M 78 153 C 85 150 90 153 94 153 L 90 163 L 80 163 Z" fill="#f43f5e"/>

    <!-- Head & Hair -->
    <circle cx="86" cy="138" rx="11" ry="12" fill="#fbcfe8"/>
    <!-- Hair style -->
    <path d="M 75 135 C 75 125 97 125 97 135 C 97 140 92 142 92 142 L 80 142 Z" fill="#475569"/>
    <!-- Friendly Face Profile -->
    <circle cx="93" cy="139" r="1.5" fill="#1e293b"/>
    <path d="M 94 143 Q 96 145 98 143" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Pointing Arm (Pointing towards the East / School) -->
    <path d="M 88 162 L 115 150" stroke="#fbcfe8" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="117" cy="149" r="3" fill="#fbcfe8"/>
  </g>

  <!-- Secondary Context: Cute Delivery Scooter or Bicycle parked near sidewalk -->
  <g id="bicycle">
    <circle cx="35" cy="195" r="8" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="55" cy="195" r="8" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M 35 195 L 45 180 L 55 195 M 45 180 L 48 172" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Little basket with flower -->
    <rect x="44" y="172" width="8" height="7" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="48" cy="169" r="3" fill="#f43f5e"/>
  </g>

  <!-- Ambient Nature / Morning Atmosphere Details -->
  <!-- Floating light particles / dust in the morning sun rays -->
  <circle cx="150" cy="130" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="130" cy="145" r="1" fill="#fef08a" opacity="0.6"/>
  <circle cx="165" cy="120" r="2" fill="#fef08a" opacity="0.9"/>
  <circle cx="120" cy="115" r="1.5" fill="#fef08a" opacity="0.5"/>
  <circle cx="105" cy="135" r="1" fill="#fef08a" opacity="0.7"/>

  <!-- Compass / Directional Accent (Subtle, modern geographic cue, NO TEXT) -->
  <g transform="translate(210, 35)" opacity="0.85" filter="url(#glow)">
    <!-- Compass Ring -->
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- East Pointer (Highlighted glowing amber/gold) -->
    <polygon points="0,0 12,-3 4,4" fill="#fbbf24"/>
    <polygon points="0,0 -10,2 -3,-3" fill="#64748b"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>

  <!-- Decorative Border Frame -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
</svg>