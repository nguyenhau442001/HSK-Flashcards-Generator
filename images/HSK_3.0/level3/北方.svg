<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <clipPath id="roundCorners">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>
  
  <g clip-path="url(#roundCorners)">
    <!-- Background -->
    <rect width="240" height="240" fill="url(#skyGrad)" />
    
    <!-- Distant Snowy Mountains -->
    <path d="M-20 180 L60 80 L120 140 L180 60 L260 180 Z" fill="#334155" opacity="0.5" />
    <path d="M60 80 L80 105 L45 105 Z" fill="#94a3b8" opacity="0.3" />
    <path d="M180 60 L205 95 L160 95 Z" fill="#94a3b8" opacity="0.3" />

    <!-- Traditional Northern Architecture (Gatehouse) -->
    <rect x="130" y="120" width="70" height="60" fill="#7f1d1d" />
    <rect x="145" y="145" width="15" height="35" fill="#450a0a" />
    <rect x="170" y="145" width="15" height="35" fill="#450a0a" />
    <!-- Roof with Snow -->
    <path d="M120 125 L210 125 L225 145 L105 145 Z" fill="#b91c1c" />
    <path d="M125 120 L205 120 L215 130 L115 130 Z" fill="#f8fafc" />
    
    <!-- Snowy Ground Layers -->
    <path d="M0 170 Q80 150 160 180 T240 160 V240 H0 Z" fill="#475569" />
    <path d="M0 190 Q100 175 200 200 T240 190 V240 H0 Z" fill="#94a3b8" />
    <path d="M0 215 Q120 200 240 220 V240 H0 Z" fill="#cbd5e1" />

    <!-- Bare Winter Trees -->
    <g stroke="#1e293b" stroke-width="3" stroke-linecap="round">
      <line x1="40" y1="180" x2="40" y2="140" />
      <line x1="40" y1="160" x2="25" y2="150" />
      <line x1="40" y1="155" x2="55" y2="145" />
      
      <line x1="210" y1="200" x2="210" y2="170" />
      <line x1="210" y1="185" x2="220" y2="175" />
    </g>

    <!-- Character Trekking in the North -->
    <g transform="translate(70, 165)">
      <!-- Legs -->
      <path d="M5 35 L0 50 M15 35 L20 50" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
      <!-- Heavy Parka -->
      <path d="M-5 10 Q10 -5 25 10 L28 40 Q10 45 -8 40 Z" fill="#fb923c" />
      <!-- Hood and Face -->
      <circle cx="10" cy="5" r="14" fill="#fb923c" />
      <circle cx="10" cy="5" r="9" fill="#fde68a" />
      <!-- Scarf blowing in wind -->
      <path d="M0 15 Q15 20 35 12" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round" />
      <!-- Arms leaning into wind -->
      <path d="M-2 20 L-10 35" stroke="#fb923c" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Atmospheric Effects: Wind and Snow -->
    <g fill="white" opacity="0.8">
      <circle cx="30" cy="40" r="1.5" />
      <circle cx="110" cy="70" r="2" />
      <circle cx="190" cy="30" r="1.5" />
      <circle cx="220" cy="100" r="1.2" />
      <circle cx="50" cy="120" r="1.8" />
      <circle cx="150" cy="50" r="1.5" />
      <circle cx="80" cy="20" r="1.2" />
      <circle cx="20" cy="200" r="2" />
      <circle cx="230" cy="220" r="1.5" />
    </g>
    
    <!-- Wind Swirls -->
    <g fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
      <path d="M20 60 Q50 40 80 60" />
      <path d="M140 80 Q170 100 200 80" />
      <path d="M40 140 Q70 130 100 150" />
    </g>

    <!-- Warm Glow from the Gate -->
    <circle cx="152" cy="162" r="3" fill="#f59e0b" opacity="0.6" />
    <circle cx="177" cy="162" r="3" fill="#f59e0b" opacity="0.6" />
  </g>
</svg>