<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for Happiness/Laughter -->
    <radialGradient id="happyGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Floor Separation -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <rect x="0" y="180" width="240" height="60" fill="#090d16" opacity="0.6"/>

  <!-- Background Environment & Props -->
  <!-- Window frame and cozy room details -->
  <g id="room-props">
    <!-- Window cutout -->
    <rect x="140" y="45" width="65" height="95" rx="6" fill="#0b1329" stroke="#334155" stroke-width="2"/>
    <path d="M140 45 L205 45 L205 140 L140 140 Z" fill="url(#lightBeam)"/>
    <line x1="172" y1="45" x2="172" y2="140" stroke="#334155" stroke-width="1.5"/>
    <line x1="140" y1="92" x2="205" y2="92" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Warm Happiness Glow centered around laughing person -->
    <circle cx="110" cy="115" r="85" fill="url(#happyGlow)"/>

    <!-- Bookshelf / Wall Art -->
    <rect x="25" y="55" width="45" height="6" rx="3" fill="#475569"/>
    <rect x="35" y="40" width="8" height="15" rx="2" fill="#ec4899"/>
    <rect x="45" y="37" width="10" height="18" rx="2" fill="#fbbf24"/>
    <rect x="57" y="43" width="7" height="12" rx="2" fill="#38bdf8"/>

    <!-- Potted Plant on Floor -->
    <path d="M 200 160 L 216 160 L 212 180 L 204 180 Z" fill="#64748b"/>
    <ellipse cx="210" cy="160" rx="8" ry="3" fill="#475569"/>
    <!-- Plant Leaves -->
    <path d="M 210 157 Q 195 140 190 130 Q 205 145 210 157" fill="url(#leafGrad)"/>
    <path d="M 210 157 Q 225 135 232 125 Q 215 142 210 157" fill="url(#leafGrad)"/>
    <path d="M 210 157 Q 210 130 212 118 Q 210 138 210 157" fill="#34d399"/>
  </g>

  <!-- Sofa / Chair where the character sits -->
  <g id="furniture">
    <!-- Sofa Backrest -->
    <rect x="65" y="95" width="90" height="65" rx="12" fill="#334155"/>
    <!-- Sofa Cushion -->
    <rect x="55" y="145" width="110" height="35" rx="10" fill="#475569"/>
    <!-- Sofa Armrest -->
    <rect x="50" y="120" width="20" height="60" rx="8" fill="#64748b"/>
  </g>

  <!-- Main Subject: A Happy Character Actively Laughing & Expressing Joy ("高兴地笑了") -->
  <g id="main-character">
    <!-- Character Body / Torso -->
    <path d="M 85 155 L 125 155 Q 130 135 125 115 L 85 115 Q 80 135 85 155 Z" fill="url(#shirtGrad)"/>
    <!-- Collar -->
    <path d="M 98 115 Q 105 124 112 115 Z" fill="#e0f2fe"/>

    <!-- Arms in joyful gesture (holding sides or slightly raised) -->
    <!-- Left arm -->
    <path d="M 87 120 Q 70 130 75 145" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <!-- Right arm -->
    <path d="M 123 120 Q 140 130 135 145" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Hands -->
    <circle cx="75" cy="147" r="6" fill="#fcd34d"/>
    <circle cx="135" cy="147" r="6" fill="#fcd34d"/>

    <!-- Neck -->
    <rect x="98" y="102" width="14" height="16" rx="4" fill="#fcd34d"/>

    <!-- Head (Slightly tilted back in laughter) -->
    <circle cx="105" cy="85" r="24" fill="#fcd34d"/>

    <!-- Hair (Stylish dark hair) -->
    <path d="M 82 85 Q 85 62 105 60 Q 128 62 127 82 Q 120 72 105 70 Q 90 72 82 85 Z" fill="#1e293b"/>
    <path d="M 81 84 Q 79 92 84 96 Q 83 88 81 84 Z" fill="#1e293b"/>

    <!-- Expressive Face showing "高兴地笑了" (Laughing Happily) -->
    <!-- Closed Happy Crescent Eyes (Curved upwards like 'uu' or happy arches) -->
    <path d="M 92 82 Q 96 77 100 82" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 110 82 Q 114 77 118 82" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="91" cy="90" r="5" fill="#fb7185" opacity="0.6"/>
    <circle cx="119" cy="90" r="5" fill="#fb7185" opacity="0.6"/>

    <!-- Big Open Joyful Smile / Laughing Mouth -->
    <path d="M 96 92 Q 105 106 114 92 Z" fill="#991b1b"/>
    <!-- Happy Tongue -->
    <path d="M 100 97 Q 105 103 110 97 Z" fill="#f43f5e"/>

    <!-- Dynamic Joy/Laughter Action Sparks (Representing lively manner/action "地") -->
    <!-- Floating Joy Sparkles & Notes around the character -->
    <g id="sparkles" stroke="#fbbf24" stroke-width="2" stroke-linecap="round">
      <!-- Sparkle Left -->
      <line x1="62" y1="75" x2="72" y2="75"/>
      <line x1="67" y1="70" x2="67" y2="80"/>
      <!-- Sparkle Right Top -->
      <line x1="142" y1="65" x2="152" y2="65"/>
      <line x1="147" y1="60" x2="147" y2="70"/>
      <!-- Small Star -->
      <path d="M 135 90 Q 138 93 141 90 Q 138 87 135 90 Z" fill="#fbbf24"/>
      <path d="M 72 105 Q 74 107 76 105 Q 74 103 72 105 Z" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Foreground Floor Props (Enhancing real-world context) -->
  <g id="foreground-props">
    <!-- Small coffee table / side table -->
    <rect x="155" y="165" width="50" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="165" y="173" width="6" height="15" fill="#94a3b8"/>
    <rect x="190" y="173" width="6" height="15" fill="#94a3b8"/>
    
    <!-- Teacup on Table -->
    <path d="M 172 155 L 184 155 L 182 165 L 174 165 Z" fill="#f8fafc"/>
    <path d="M 184 158 Q 189 158 189 161 Q 189 164 184 164" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Steam from cup -->
    <path d="M 176 150 Q 178 145 176 140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>