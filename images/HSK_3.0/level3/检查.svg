<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Clinic Wall Soft Glow -->
    <radialGradient id="wallGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Doctor Uniform Gradient -->
    <linearGradient id="labCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Medical Equipment Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. FULL BLEED BACKGROUND -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#wallGlow)"/>

  <!-- 2. ENVIRONMENT & MEDICAL CLINIC PROPS -->
  <!-- Window with night city lights / soft blue ambient -->
  <path d="M175 30 L215 30 L215 95 L175 95 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <path d="M185 40 L205 40 L205 60 L185 60 Z" fill="#1e293b"/>
  <path d="M185 68 L205 68 L205 85 L185 85 Z" fill="#1e293b"/>

  <!-- Medical Monitor / ECG Screen in Background -->
  <g transform="translate(14, 32)">
    <rect x="0" y="0" width="55" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="5" y="5" width="45" height="25" rx="3" fill="#020617"/>
    <!-- ECG waveform line -->
    <path d="M8 18 L16 18 L20 10 L24 24 L28 15 L32 18 L44 18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Monitor Stand -->
    <path d="M22 42 L33 42 L27 35 Z" fill="#475569"/>
  </g>

  <!-- Medical Chart Clipboard hanging on wall -->
  <g transform="translate(85, 28)">
    <rect x="0" y="0" width="22" height="30" rx="3" fill="#cbd5e1"/>
    <rect x="6" y="-3" width="10" height="4" rx="1" fill="#f59e0b"/>
    <line x1="4" y1="8" x2="14" y2="8" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="13" x2="18" y2="13" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="18" x2="12" y2="18" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Exam Table / Bed Base -->
  <path d="M20 185 L145 165 L145 205 L20 225 Z" fill="#334155"/>
  <path d="M20 160 L145 140 L145 165 L20 185 Z" fill="#64748b"/>
  <!-- Mattress (Teal/Cyan medical theme) -->
  <path d="M25 150 L150 130 L150 143 L25 163 Z" fill="#0ea5e9"/>
  <path d="M25 150 L150 130 L148 127 L23 147 Z" fill="#38bdf8"/>

  <!-- 3. CHARACTERS -->

  <!-- Patient (Lying on exam table, undergoing checkup) -->
  <g transform="translate(45, 95)">
    <!-- Body under blanket -->
    <path d="M10 50 L65 38 L85 58 L30 70 Z" fill="#e2e8f0"/>
    <!-- Patient Head & Hair -->
    <circle cx="15" cy="40" r="12" fill="#fbcfe8"/>
    <path d="M5 38 C5 30 18 28 23 35 C20 33 12 33 8 42 Z" fill="#451a03"/>
    <!-- Peaceful closed eye expression during checkup -->
    <path d="M12 40 Q15 43 18 40" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Doctor (Standing, actively examining the patient with stethoscope) -->
  <g transform="translate(100, 75)">
    <!-- Doctor Legs & Shoes -->
    <path d="M45 105 L45 140 L55 140 L55 105 Z" fill="#334155"/>
    <path d="M68 105 L68 140 L78 140 L78 105 Z" fill="#334155"/>
    <ellipse cx="50" cy="141" rx="7" ry="3" fill="#0f172a"/>
    <ellipse cx="73" cy="141" rx="7" ry="3" fill="#0f172a"/>

    <!-- Doctor Torso with Lab Coat -->
    <path d="M35 50 L85 50 L95 110 L25 110 Z" fill="url(#labCoat)"/>
    <!-- Blue Scrub Shirt visible inside coat -->
    <path d="M48 50 L72 50 L68 85 L52 85 Z" fill="#0284c7"/>
    <!-- Coat lapels -->
    <path d="M60 50 L52 75 L60 85 Z" fill="#cbd5e1"/>
    <path d="M60 50 L68 75 L60 85 Z" fill="#cbd5e1"/>
    <!-- Buttons -->
    <circle cx="60" cy="93" r="2" fill="#94a3b8"/>
    <circle cx="60" cy="103" r="2" fill="#94a3b8"/>

    <!-- Head & Friendly Face -->
    <circle cx="60" cy="28" r="15" fill="#fde68a"/>
    <!-- Hair (Professional dark bob/styled) -->
    <path d="M45 28 C45 15 75 15 75 28 C75 32 72 26 70 22 C65 18 55 18 50 22 C48 26 45 30 45 28 Z" fill="#1e293b"/>
    <!-- Friendly Eyes & Smile -->
    <circle cx="55" cy="28" r="1.5" fill="#1e293b"/>
    <circle cx="65" cy="28" r="1.5" fill="#1e293b"/>
    <path d="M58 33 Q60 36 62 33" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Stethoscope around neck and chest -->
    <path d="M52 25 Q60 20 68 25" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M53 27 C45 35 48 55 58 68" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Stethoscope Chestpiece (Actively touching patient's body for 'jiǎnchá') -->
    <circle cx="10" cy="65" r="7" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="10" cy="65" r="5" fill="#fbbf24"/>
    <!-- Stethoscope tubing leading to doctor's hand -->
    <path d="M58 68 C40 70 25 70 10 65" fill="none" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Doctor Arms & Hands -->
    <!-- Back Arm -->
    <path d="M38 55 L22 62 L15 65" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Arm holding stethoscope -->
    <path d="M80 58 L68 70 L15 65" fill="none" stroke="url(#labCoat)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="15" cy="65" r="5" fill="#fde68a"/>
  </g>

  <!-- 4. FOREGROUND PROPS & LIGHTING ACCENTS -->
  <!-- Rolling Medical Tray with Instruments -->
  <g transform="translate(170, 130)">
    <!-- Tray Pole -->
    <rect x="22" y="20" width="6" height="70" fill="#64748b"/>
    <ellipse cx="25" cy="90" rx="18" ry="6" fill="#475569"/>
    <!-- Tray Surface -->
    <path d="M5 20 L45 20 L50 28 L0 28 Z" fill="#cbd5e1"/>
    <ellipse cx="25" cy="24" rx="22" ry="4" fill="#94a3b8"/>
    <!-- Syringe / Tools on tray -->
    <rect x="15" y="21" width="12" height="3" rx="1" fill="#38bdf8"/>
    <circle cx="33" cy="23" r="3" fill="#10b981"/>
  </g>

  <!-- Warm ambient light overlay for app-friendly feel -->
  <circle cx="120" cy="90" r="70" fill="#38bdf8" opacity="0.06" filter="url(#glow)"/>
</svg>