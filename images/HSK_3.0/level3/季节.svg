<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Autumn Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Maple Leaf Gradient Orange -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Maple Leaf Gradient Red -->
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Maple Leaf Gradient Yellow -->
    <linearGradient id="leafGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Character Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Scarf Gradient -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Park Bench Gradient -->
    <linearGradient id="benchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container & Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Scene Window / Card Container with rounded frame -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="15" y="15" width="210" height="210" rx="18" />
    </clipPath>
    
    <!-- Sky Background -->
    <rect x="15" y="15" width="210" height="140" fill="url(#skyGrad)" />
    
    <!-- Warm Sun / Golden Hour Glow -->
    <circle cx="180" cy="70" r="28" fill="#fde047" opacity="0.8" />
    <circle cx="180" cy="70" r="45" fill="#f59e0b" opacity="0.3" />

    <!-- Distant Mountains / Hills -->
    <path d="M 15 135 L 70 100 L 130 120 L 225 90 L 225 155 L 15 155 Z" fill="#451a03" opacity="0.5" />
    <path d="M 15 145 L 90 115 L 170 130 L 225 110 L 225 155 L 15 155 Z" fill="#78350f" opacity="0.8" />

    <!-- Ground / Park Lawn (Autumn tinted) -->
    <rect x="15" y="145" width="210" height="80" fill="#78350f" />
    <path d="M 15 150 Q 80 140 140 155 T 225 148 L 225 225 L 15 225 Z" fill="#92400e" />

    <!-- Autumn Trees in Background -->
    <!-- Tree 1 (Left) -->
    <path d="M 35 155 L 35 105" stroke="#451a03" stroke-width="6" stroke-linecap="round" />
    <circle cx="35" cy="95" r="22" fill="#c2410c" />
    <circle cx="23" cy="100" r="16" fill="#ea580c" />
    <circle cx="47" cy="92" r="18" fill="#eab308" />

    <!-- Tree 2 (Mid-Left) -->
    <path d="M 75 155 L 75 95" stroke="#451a03" stroke-width="8" stroke-linecap="round" />
    <circle cx="75" cy="80" r="28" fill="#eab308" />
    <circle cx="60" cy="88" r="20" fill="#f97316" />
    <circle cx="90" cy="85" r="22" fill="#dc2626" />
    <circle cx="75" cy="65" r="18" fill="#fde047" />

    <!-- Tree 3 (Right - Foreground framing) -->
    <path d="M 205 160 L 200 90" stroke="#451a03" stroke-width="10" stroke-linecap="round" />
    <circle cx="195" cy="75" r="32" fill="#b91c1c" />
    <circle cx="180" cy="85" r="22" fill="#ea580c" />
    <circle cx="215" cy="80" r="24" fill="#f59e0b" />
    <circle cx="195" cy="55" r="20" fill="#fde047" />

    <!-- Park Bench -->
    <g transform="translate(100, 135)">
      <!-- Bench Legs -->
      <rect x="10" y="20" width="4" height="15" fill="#331800" />
      <rect x="40" y="20" width="4" height="15" fill="#331800" />
      <!-- Bench Seat -->
      <rect x="5" y="15" width="44" height="5" rx="2" fill="url(#benchGrad)" />
      <!-- Bench Backrest -->
      <rect x="5" y="2" width="44" height="4" rx="1.5" fill="url(#benchGrad)" />
      <rect x="5" y="8" width="44" height="4" rx="1.5" fill="url(#benchGrad)" />
      <!-- Support Brackets -->
      <rect x="12" y="5" width="3" height="13" fill="#451a03" />
      <rect x="39" y="5" width="3" height="13" fill="#451a03" />
    </g>

    <!-- Sitting Character (Relaxing, enjoying the favorite season) -->
    <g transform="translate(110, 123)">
      <!-- Legs -->
      <rect x="12" y="22" width="7" height="10" rx="3.5" fill="#1e293b" />
      <rect x="22" y="22" width="7" height="10" rx="3.5" fill="#1e293b" />
      <!-- Shoes -->
      <ellipse cx="14" cy="33" rx="5" ry="3" fill="#475569" />
      <ellipse cx="25" cy="33" rx="5" ry="3" fill="#475569" />

      <!-- Torso (Jacket) -->
      <path d="M 10 7 L 31 7 L 34 24 L 7 24 Z" fill="url(#jacketGrad)" />
      
      <!-- Scarf trailing -->
      <path d="M 18 8 Q 28 12 35 8" stroke="url(#scarfGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M 33 9 Q 38 18 36 26" stroke="url(#scarfGrad)" stroke-width="5" stroke-linecap="round" fill="none" />

      <!-- Head & Hair -->
      <circle cx="20.5" cy="-2" r="10" fill="#fcd34d" /> <!-- Face -->
      <!-- Stylish Hair -->
      <path d="M 10.5 -4 C 10.5 -10, 15 -13, 22 -12 C 28 -11, 30.5 -6, 30.5 -2 L 29 -2 C 29 -7, 26 -10, 21 -10 C 15 -10, 12 -6, 12 -2 Z" fill="#292524" />

      <!-- Relaxed Expression / Face profile hint -->
      <circle cx="24" cy="-3" r="1" fill="#78350f" /> <!-- Eye closed in bliss -->
      <path d="M 23 1 Q 25 3 27 1.5" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- Smile -->
      
      <!-- Arms relaxed -->
      <path d="M 10 9 L 4 16 L 9 18" stroke="#0284c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 31 9 L 36 15 L 32 18" stroke="#0284c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Foreground Falling Maple Leaves (Dynamic details) -->
    <!-- Leaf 1 (Top Left) -->
    <path d="M 50 45 Q 55 40 60 48 Q 50 55 50 45 Z" fill="url(#leafGrad1)" transform="rotate(25 55 48)" />
    <!-- Leaf 2 (Mid Air Left) -->
    <path d="M 30 90 Q 38 85 42 95 Q 32 102 30 90 Z" fill="url(#leafGrad2)" transform="rotate(-40 36 93)" />
    <!-- Leaf 3 (Near Character) -->
    <path d="M 95 80 Q 103 75 107 85 Q 97 92 95 80 Z" fill="url(#leafGrad3)" transform="rotate(15 101 83)" />
    <!-- Leaf 4 (Right Floating) -->
    <path d="M 160 110 Q 168 105 172 115 Q 162 122 160 110 Z" fill="url(#leafGrad1)" transform="rotate(60 166 113)" />
    <!-- Leaf 5 (Bottom Right Corner) -->
    <path d="M 190 170 Q 198 165 202 175 Q 192 182 190 170 Z" fill="url(#leafGrad2)" transform="rotate(-15 196 173)" />
    <!-- Leaf 6 (Bottom Left Ground) -->
    <path d="M 45 195 Q 53 190 57 200 Q 47 207 45 195 Z" fill="url(#leafGrad3)" transform="rotate(45 51 198)" />

    <!-- Soft Vignette / Rim Light overlay for depth -->
    <rect x="15" y="15" width="210" height="210" rx="18" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4" />
  </g>
</svg>