<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for Sweetness -->
    <radialGradient id="sweetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Watermelon Pink Gradient -->
    <linearGradient id="melonPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Watermelon Rind Gradient -->
    <linearGradient id="melonRind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Sparkle filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <!-- Ambient Sweet Glow circle behind character -->
  <circle cx="120" cy="110" r="90" fill="url(#sweetGlow)"/>

  <!-- Floating Sparkles / Joy Particles -->
  <g filter="url(#glow)">
    <!-- Sparkle 1 -->
    <path d="M 45 75 Q 45 65 55 65 Q 45 65 45 55 Q 45 65 35 65 Q 45 65 45 75 Z" fill="#fbbf24" opacity="0.9"/>
    <!-- Sparkle 2 -->
    <path d="M 195 95 Q 195 85 205 85 Q 195 85 195 75 Q 195 85 185 85 Q 195 85 195 95 Z" fill="#f43f5e" opacity="0.8"/>
    <!-- Sparkle 3 -->
    <path d="M 60 170 Q 60 162 68 162 Q 60 162 60 154 Q 60 162 52 162 Q 60 162 60 170 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- Small floating dots -->
    <circle cx="170" cy="50" r="3" fill="#fbbf24"/>
    <circle cx="70" cy="110" r="2" fill="#f43f5e"/>
    <circle cx="190" cy="160" r="2.5" fill="#34d399"/>
  </g>

  <!-- SCENE: Character holding and tasting a giant, juicy slice of sweet watermelon -->
  <!-- Character Group -->
  <g filter="url(#dropShadow)">
    
    <!-- Torso / Hoodie -->
    <path d="M 80 205 C 80 170 100 160 120 160 C 140 160 160 170 160 205 Z" fill="#38bdf8"/>
    <!-- Hoodie Pocket / Details -->
    <path d="M 105 185 L 135 185 L 130 205 L 110 205 Z" fill="#0284c7" opacity="0.4"/>
    <circle cx="120" cy="172" r="2" fill="#bae6fd"/>

    <!-- Neck -->
    <rect x="108" y="142" width="24" height="25" fill="url(#skinGrad)" rx="6"/>

    <!-- Head -->
    <g>
      <!-- Hair Back / Base -->
      <path d="M 85 100 C 85 70 155 70 155 100 C 155 125 155 145 155 145 L 85 145 Z" fill="#1e1b4b"/>

      <!-- Ears -->
      <circle cx="85" cy="122" r="6" fill="url(#skinGrad)"/>
      <circle cx="155" cy="122" r="6" fill="url(#skinGrad)"/>

      <!-- Face Base -->
      <path d="M 88 110 C 88 145 152 145 152 110 Z" fill="url(#skinGrad)"/>
      <rect x="88" y="105" width="64" height="25" fill="url(#skinGrad)"/>

      <!-- Rosy Cheeks (Blush of pure delight) -->
      <circle cx="100" cy="128" r="9" fill="#f43f5e" opacity="0.4"/>
      <circle cx="140" cy="128" r="9" fill="#f43f5e" opacity="0.4"/>

      <!-- Expressive Eyes (Blissful, happy arcs >v< style) -->
      <!-- Left Eye -->
      <path d="M 96 118 Q 104 110 112 118" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Right Eye -->
      <path d="M 128 118 Q 136 110 144 118" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Happy Open Mouth (Tasting sweetness) -->
      <path d="M 112 130 Q 120 140 128 130 Z" fill="#e11d48"/>
      <!-- Tiny tongue -->
      <path d="M 116 135 Q 120 132 124 135 Z" fill="#fda4af"/>

      <!-- Hair Front / Bangs -->
      <path d="M 87 103 Q 100 115 115 103 Q 130 115 153 103 C 153 90 87 90 87 103 Z" fill="#1e1b4b"/>
      <path d="M 105 102 Q 115 112 125 102 Z" fill="#1e1b4b"/>
    </g>

    <!-- Hands holding the watermelon slice -->
    <!-- Left Hand -->
    <circle cx="92" cy="155" r="9" fill="url(#skinGrad)"/>
    <!-- Right Hand -->
    <circle cx="148" cy="155" r="9" fill="url(#skinGrad)"/>

  </g>

  <!-- The Prop: Giant, Juicy, Sweet Watermelon Slice -->
  <g filter="url(#dropShadow)" transform="translate(0, 15)">
    
    <!-- Outer Green Rind -->
    <path d="M 60 130 L 180 130 C 180 130 145 175 120 175 C 95 175 60 130 60 130 Z" fill="url(#melonRind)"/>
    
    <!-- Inner Light Green / White Rind Layer -->
    <path d="M 65 130 L 175 130 C 175 130 143 169 120 169 C 97 169 65 130 65 130 Z" fill="#6ee7b7"/>

    <!-- Juicy Red/Pink Flesh -->
    <path d="M 70 130 L 170 130 C 170 130 142 163 120 163 C 98 163 70 130 70 130 Z" fill="url(#melonPink)"/>

    <!-- Watermelon Seeds (Dark, glossy) -->
    <g fill="#1e293b">
      <ellipse cx="100" cy="142" rx="2" ry="3.5" transform="rotate(15 100 142)"/>
      <ellipse cx="120" cy="150" rx="2" ry="3.5" transform="rotate(-10 120 150)"/>
      <ellipse cx="140" cy="142" rx="2" ry="3.5" transform="rotate(-25 140 142)"/>
      <ellipse cx="110" cy="136" rx="1.5" ry="2.5"/>
      <ellipse cx="130" cy="136" rx="1.5" ry="2.5"/>
    </g>

    <!-- Fresh juice highlight on the slice -->
    <path d="M 80 133 C 95 135 110 133 120 133" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none"/>
    <circle cx="150" cy="135" r="2" fill="#ffffff" opacity="0.7"/>

  </g>

  <!-- Little droplet of sweetness splashing -->
  <g filter="url(#glow)">
    <circle cx="155" cy="155" r="3.5" fill="#f43f5e"/>
    <path d="M 155 148 Q 158 152 155 156 Q 152 152 155 148 Z" fill="#f43f5e"/>
  </g>

</svg>