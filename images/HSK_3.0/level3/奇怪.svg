<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Effect for Magic/Strange Elements -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Plant Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow behind the strange plant -->
  <circle cx="120" cy="120" r="80" fill="url(#glowGrad)"/>

  <!-- Background Room Details: Shelf and Wall Lines -->
  <path d="M40 70 L200 70" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Books on shelf -->
  <rect x="55" y="45" width="12" height="25" rx="2" fill="#64748b"/>
  <rect x="69" y="40" width="10" height="30" rx="2" fill="#0ea5e9"/>
  <rect x="81" y="48" width="15" height="22" rx="2" fill="#f43f5e"/>

  <!-- Wall Art (a tilted frame showing strange abstract swirls) -->
  <rect x="160" y="30" width="35" height="35" rx="4" fill="#334155" transform="rotate(10 177 47)"/>
  <rect x="163" y="33" width="29" height="29" rx="2" fill="#1e293b" transform="rotate(10 177 47)"/>
  <path d="M170 50 Q177 38 185 50" stroke="#a855f7" stroke-width="2" fill="none" transform="rotate(10 177 47)"/>

  <!-- Floor Surface -->
  <rect x="0" y="190" width="240" height="50" fill="url(#floorGrad)"/>
  <ellipse cx="120" cy="195" rx="80" ry="15" fill="#020617" opacity="0.6"/>

  <!-- Context Prop: Wooden Table -->
  <path d="M60 180 L180 180 L170 195 L70 195 Z" fill="#475569"/>
  <rect x="75" y="195" width="10" height="25" fill="#334155"/>
  <rect x="155" y="195" width="10" height="25" fill="#334155"/>

  <!-- MAIN SUBJECT: The 'Kỳ Lạ' (Strange) Plant in a Pot -->
  <!-- Floating Sparkles / Strange Energy around the plant -->
  <circle cx="85" cy="95" r="3" fill="#fbbf24"/>
  <path d="M85 91 L85 99 M81 95 L89 95" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="160" cy="110" r="2.5" fill="#ec4899"/>
  <circle cx="140" cy="75" r="4" fill="#38bdf8"/>

  <!-- Plant Pot -->
  <path d="M95 150 L145 150 L140 180 L100 180 Z" fill="url(#potGrad)"/>
  <ellipse cx="120" cy="150" rx="25" ry="5" fill="#fdba74"/>
  <!-- Soil -->
  <ellipse cx="120" cy="151" rx="21" ry="3" fill="#334155"/>

  <!-- Strange Stems curving oddly -->
  <path d="M120 148 Q100 120 85 105" stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M120 148 Q145 110 155 90" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M120 148 Q125 100 120 70" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Strange Leaf 1 (Left - Glowing blue-ish star/flower shape) -->
  <g transform="translate(85, 105)">
    <circle cx="0" cy="0" r="14" fill="#0ea5e9"/>
    <path d="M-14 0 Q0 -14 14 0 Q0 14 -14 0 Z" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="5" fill="#fef08a"/>
    <!-- Little eyes making it look alive and quirky -->
    <circle cx="-3" cy="-1" r="1.5" fill="#0f172a"/>
    <circle cx="3" cy="-1" r="1.5" fill="#0f172a"/>
  </g>

  <!-- Strange Leaf 2 (Right - Pink swirl spiral leaf) -->
  <g transform="translate(155, 90)">
    <circle cx="0" cy="0" r="12" fill="#f43f5e"/>
    <path d="M0 0 C 10 -10, 15 5, 0 12 C -10 15, -12 -5, 0 0" fill="#fb7185"/>
    <circle cx="0" cy="0" r="4" fill="#fef08a"/>
  </g>

  <!-- Strange Leaf 3 (Top - Glowing Orb Flower that opens weirdly) -->
  <g transform="translate(120, 70)">
    <!-- Glowing petals -->
    <ellipse cx="0" cy="-10" rx="5" ry="10" fill="#a855f7" transform="rotate(0)"/>
    <ellipse cx="9" cy="-5" rx="5" ry="10" fill="#a855f7" transform="rotate(60)"/>
    <ellipse cx="9" cy="5" rx="5" ry="10" fill="#a855f7" transform="rotate(120)"/>
    <ellipse cx="0" cy="10" rx="5" ry="10" fill="#a855f7" transform="rotate(180)"/>
    <ellipse cx="-9" cy="5" rx="5" ry="10" fill="#a855f7" transform="rotate(240)"/>
    <ellipse cx="-9" cy="-5" rx="5" ry="10" fill="#a855f7" transform="rotate(300)"/>
    <!-- Center core -->
    <circle cx="0" cy="0" r="7" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
  </g>

  <!-- Additional quirky detail: A small tentacle sprout poking out of the soil -->
  <path d="M112 150 Q108 140 102 142" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="101" cy="141" r="2.5" fill="#f43f5e"/>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="50" cy="130" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="190" cy="150" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="110" cy="40" r="1.5" fill="#a855f7" opacity="0.8"/>
</svg>