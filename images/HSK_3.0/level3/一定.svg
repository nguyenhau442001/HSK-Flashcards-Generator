<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Calendar Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Star Glow / Accent -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Window / Stars) -->
  <circle cx="195" cy="55" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="45" cy="40" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="65" cy="80" r="2.5" fill="#38bdf8" opacity="0.5"/>

  <!-- Back Wall & Desk Horizon -->
  <rect x="0" y="160" width="240" height="80" fill="url(#deskGrad)"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2"/>

  <!-- Ambient Light / Window Glow on Desk -->
  <path d="M 120 160 L 190 240 L 50 240 Z" fill="#38bdf8" opacity="0.05"/>

  <!-- Background Props: Potted Succulent for real-world context -->
  <g transform="translate(185, 125)" filter="url(#shadow)">
    <!-- Pot -->
    <path d="M 6 15 L 18 15 L 21 32 L 3 32 Z" fill="#cbd5e1"/>
    <!-- Plant Leaves -->
    <path d="M 12 15 Q 12 5 2 2 Q 10 10 12 15 Z" fill="#10b981"/>
    <path d="M 12 15 Q 15 2 22 5 Q 15 10 12 15 Z" fill="#059669"/>
    <path d="M 12 15 Q 8 2 12 -2 Q 14 8 12 15 Z" fill="#34d399"/>
  </g>

  <!-- Background Prop: Warm Desk Lamp -->
  <g transform="translate(25, 90)">
    <path d="M 15 70 L 25 70 L 25 35 L 35 20 L 15 20 Z" fill="#64748b"/>
    <path d="M 5 15 C 5 5, 35 5, 35 15 Z" fill="#f59e0b"/>
    <path d="M 10 70 L 30 70 L 33 75 L 7 75 Z" fill="#475569"/>
    <!-- Lamp Glow Cone -->
    <path d="M 20 15 L 0 70 L 40 70 Z" fill="#fbbf24" opacity="0.15"/>
  </g>

  <!-- MAIN SCENE SUBJECT: The Commitment Calendar / Planner (Representing 'Nhất định' - absolute promise/certainty for tomorrow) -->
  <g transform="translate(65, 55)" filter="url(#shadow)">
    
    <!-- Calendar Stand (Back support) -->
    <path d="M 20 110 L 55 125 L 90 110" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Calendar Base / Backboard -->
    <rect x="5" y="10" width="100" height="105" rx="10" fill="#cbd5e1"/>

    <!-- Spiral Rings -->
    <rect x="22" y="5" width="8" height="12" rx="4" fill="#94a3b8"/>
    <rect x="47" y="5" width="8" height="12" rx="4" fill="#94a3b8"/>
    <rect x="72" y="5" width="8" height="12" rx="4" fill="#94a3b8"/>

    <!-- Calendar Main Page -->
    <rect x="0" y="15" width="110" height="95" rx="8" fill="url(#pageGrad)"/>

    <!-- Header Banner on Page -->
    <path d="M 0 23 C 0 18, 5 15, 10 15 L 100 15 C 105 15, 110 18, 110 23 L 110 40 L 0 40 Z" fill="#ef4444"/>
    <circle cx="15" cy="28" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="25" cy="28" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Grid / Days representation -->
    <rect x="15" y="52" width="16" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="37" y="52" width="16" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="59" y="52" width="16" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="81" y="52" width="16" height="12" rx="3" fill="#e2e8f0"/>

    <rect x="15" y="68" width="16" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="37" y="68" width="16" height="12" rx="3" fill="#fee2e2"/> <!-- Highlighted target day -->
    <rect x="59" y="68" width="16" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="81" y="68" width="16" height="12" rx="3" fill="#e2e8f0"/>

    <!-- Action Focal Point: The Red Wax Seal / Stamp of Absolute Certainty (一定) -->
    <g transform="translate(65, 75)" filter="url(#shadow)">
      <circle cx="18" cy="15" r="20" fill="#dc2626"/>
      <circle cx="18" cy="15" r="17" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- Checkmark symbolizing absolute determination/guarantee -->
      <path d="M 9 15 L 15 21 L 27 9" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  </g>

  <!-- Foreground Prop: Action Fountain Pen (Signifying the commitment/promise) -->
  <g transform="translate(30, 150) rotate(-25)" filter="url(#shadow)">
    <!-- Pen Body -->
    <rect x="0" y="0" width="70" height="14" rx="7" fill="#38bdf8"/>
    <!-- Pen Cap -->
    <rect x="45" y="0" width="25" height="14" rx="7" fill="#0284c7"/>
    <!-- Clip -->
    <rect x="52" y="-4" width="3" height="8" rx="1.5" fill="#fbbf24"/>
    <!-- Gold Band -->
    <rect x="43" y="0" width="3" height="14" fill="#fbbf24"/>
    <!-- Nib -->
    <path d="M 0 0 L -12 7 L 0 14 Z" fill="#e2e8f0"/>
    <circle cx="-5" cy="7" r="1.5" fill="#0f172a"/>
    <path d="M -12 7 L -4 7" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Floating Sparkles / Golden Energy of Certainty -->
  <g transform="translate(150, 45)">
    <circle cx="0" cy="0" r="15" fill="url(#starGlow)"/>
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24"/>
  </g>

  <g transform="translate(45, 60)">
    <circle cx="0" cy="0" r="10" fill="url(#starGlow)"/>
    <path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" fill="#f59e0b"/>
  </g>

  <g transform="translate(175, 115)">
    <circle cx="0" cy="0" r="12" fill="url(#starGlow)"/>
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#38bdf8"/>
  </g>

</svg>