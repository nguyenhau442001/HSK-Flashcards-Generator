<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Room Light Gradient -->
    <radialGradient id="room-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Mirror Reflection Gradient -->
    <linearGradient id="mirror-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.25" />
    </linearGradient>

    <!-- UI/Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#room-glow)" />

  <!-- Room Interior & Background Props -->
  <!-- Wooden Floor -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#1e1b4b" opacity="0.6" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />
  
  <!-- Wallpaper Pattern Lines -->
  <line x1="60" y1="0" x2="60" y2="190" stroke="#334155" stroke-width="0.75" opacity="0.3" />
  <line x1="180" y1="0" x2="180" y2="190" stroke="#334155" stroke-width="0.75" opacity="0.3" />

  <!-- Wall Shelf with Plant & Decor -->
  <rect x="25" y="45" width="60" height="5" rx="2" fill="#475569" />
  <path d="M 40 45 Q 45 30 55 35 Q 50 45 40 45 Z" fill="#10b981" />
  <path d="M 50 45 Q 60 25 70 32 Q 62 45 50 45 Z" fill="#34d399" />
  <rect x="42" y="38" width="16" height="7" rx="2" fill="#cbd5e1" />

  <!-- Full-Length Standing Mirror (Left Side) -->
  <g transform="translate(15, 25)">
    <!-- Stand -->
    <line x1="20" y1="165" x2="5" y2="180" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="165" x2="45" y2="180" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <!-- Frame -->
    <rect x="5" y="0" width="40" height="165" rx="20" fill="#334155" filter="url(#soft-shadow)" />
    <!-- Glass -->
    <rect x="9" y="4" width="32" height="157" rx="16" fill="url(#mirror-grad)" />
    <!-- Mirror Glint -->
    <path d="M 15 15 L 25 15 L 15 65 L 12 65 Z" fill="#ffffff" opacity="0.2" />
  </g>

  <!-- Wardrobe / Open Closet on Right with Clothes Hanged -->
  <g transform="translate(175, 30)">
    <rect x="0" y="0" width="50" height="170" rx="4" fill="#334155" opacity="0.8" />
    <line x1="5" y1="20" x2="45" y2="20" stroke="#64748b" stroke-width="2" />
    <!-- Hanger 1 (Empty) -->
    <path d="M 15 20 L 25 12 L 35 20 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Hanger 2 with Dress -->
    <path d="M 15 35 L 25 27 L 35 35 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 18 35 L 32 35 L 35 55 L 15 55 Z" fill="#ec4899" opacity="0.8" />
    <!-- Stack of folded clothes -->
    <rect x="8" y="120" width="34" height="8" rx="2" fill="#38bdf8" />
    <rect x="10" y="130" width="30" height="8" rx="2" fill="#fb923c" />
    <rect x="8" y="140" width="34" height="8" rx="2" fill="#a855f7" />
  </g>

  <!-- Character Changing Clothes (Center-Right) -->
  <g transform="translate(95, 45)">
    <!-- Shadow beneath feet -->
    <ellipse cx="32" cy="148" rx="22" ry="6" fill="#000000" opacity="0.4" />

    <!-- Legs & Shoes -->
    <rect x="22" y="115" width="8" height="35" rx="4" fill="#fde047" />
    <rect x="34" y="115" width="8" height="35" rx="4" fill="#fde047" />
    <ellipse cx="25" cy="150" rx="6" ry="3" fill="#cbd5e1" />
    <ellipse cx="39" cy="150" rx="6" ry="3" fill="#cbd5e1" />

    <!-- Torso (Wearing an outfit, holding another over head/body) -->
    <rect x="18" y="65" width="28" height="52" rx="8" fill="#38bdf8" />

    <!-- Arms in dynamic motion (trying to put on a new orange shirt) -->
    <!-- Left Arm reaching up -->
    <path d="M 18 70 Q 5 60 8 45" fill="none" stroke="#ffedd5" stroke-width="8" stroke-linecap="round" />
    <!-- Right Arm reaching up -->
    <path d="M 46 70 Q 58 60 52 45" fill="none" stroke="#ffedd5" stroke-width="8" stroke-linecap="round" />

    <!-- Head & Hair -->
    <circle cx="32" cy="42" r="14" fill="#ffedd5" />
    <path d="M 18 38 Q 32 20 46 38 Q 44 50 40 45 Q 32 30 24 45 Z" fill="#1e293b" />
    
    <!-- Face Expression (Focused, playful tongue or determined smile) -->
    <circle cx="27" cy="41" r="1.5" fill="#1e293b" />
    <circle cx="37" cy="41" r="1.5" fill="#1e293b" />
    <path d="M 30 48 Q 32 50 34 48" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- The "New Shirt" being tried on / held up (Visualizing the 'Changing Clothes' action) -->
    <g transform="translate(10, 25)" filter="url(#soft-shadow)">
      <path d="M 12 10 L 22 5 L 32 10 L 44 25 L 36 30 L 33 20 L 33 55 L 11 55 L 11 20 L 8 30 L 0 25 Z" fill="#fb923c" />
      <!-- Collar detail -->
      <path d="M 18 10 Q 22 16 26 10" fill="none" stroke="#ea580c" stroke-width="2" />
    </g>
  </g>

  <!-- Foreground Props: Laundry Basket with Clothes -->
  <g transform="translate(65, 145)">
    <!-- Basket Body -->
    <path d="M 10 10 L 35 10 L 40 40 L 5 40 Z" fill="#64748b" opacity="0.9" />
    <!-- Weave Pattern lines -->
    <line x1="12" y1="18" x2="33" y2="18" stroke="#475569" stroke-width="2" />
    <line x1="9" y1="26" x2="36" y2="26" stroke="#475569" stroke-width="2" />
    <line x1="7" y1="34" x2="38" y2="34" stroke="#475569" stroke-width="2" />
    <!-- Overflowing garment (blue shirt draped out) -->
    <path d="M 15 10 Q 20 -5 30 5 Q 35 10 30 15 Z" fill="#3b82f6" />
  </g>

</svg>