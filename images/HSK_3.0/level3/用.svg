<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Tool / Hammer Metallic Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Handle Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Wrench Gradient -->
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Sparkle Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Toolbox -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient lighting / Vignette highlights -->
  <circle cx="120" cy="120" r="90" fill="#334155" opacity="0.15" filter="url(#glow)"/>

  <!-- Environment / Workbench surface -->
  <path d="M 20 180 L 220 180 L 230 220 L 10 220 Z" fill="#090d16" opacity="0.6"/>
  <rect x="20" y="176" width="200" height="6" rx="3" fill="#334155"/>

  <!-- Toolbox Base -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="140" height="70" rx="8" fill="#ef4444"/>
    <!-- Toolbox Lid/Top Rim -->
    <rect x="46" y="104" width="148" height="12" rx="4" fill="#dc2626"/>
    <!-- Toolbox Latches -->
    <rect x="85" y="112" width="14" height="8" rx="2" fill="#fbbf24"/>
    <rect x="141" y="112" width="14" height="8" rx="2" fill="#fbbf24"/>
    <!-- Toolbox Handle -->
    <path d="M 90 104 C 90 86 150 86 150 104" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Toolbox Detail Stripe -->
    <rect x="50" y="135" width="140" height="8" fill="#b91c1c" opacity="0.6"/>
  </g>

  <!-- ACTION TOOLS & PROPS (Representing 'Using' / Utility) -->
  <!-- Gear / Mechanism background accent -->
  <g transform="translate(195, 75) scale(0.65)" opacity="0.8">
    <circle cx="0" cy="0" r="24" fill="#334155"/>
    <circle cx="0" cy="0" r="12" fill="#0f172a"/>
    <rect x="-4" y="-30" width="8" height="60" rx="2" fill="#334155"/>
    <rect x="-30" y="-4" width="60" height="8" rx="2" fill="#334155"/>
    <rect x="-22" y="-22" width="44" height="44" rx="2" transform="rotate(45)" fill="#334155"/>
  </g>

  <!-- Wrench (Dynamic Angle) -->
  <g filter="url(#shadow)" transform="rotate(-25, 80, 130)">
    <path d="M 60 70 L 110 130 L 100 140 L 50 80 Z" fill="url(#wrenchGrad)"/>
    <!-- Wrench Head -->
    <circle cx="52" cy="72" r="14" fill="url(#wrenchGrad)"/>
    <circle cx="52" cy="72" r="8" fill="#0f172a"/>
    <path d="M 40 60 L 52 72 L 44 80 Z" fill="#0f172a"/>
  </g>

  <!-- Hammer (Action pose intersecting) -->
  <g filter="url(#shadow)" transform="rotate(35, 140, 100)">
    <!-- Wooden Handle -->
    <rect x="135" y="75" width="12" height="85" rx="6" fill="url(#woodGrad)"/>
    <!-- Hammer Head -->
    <path d="M 115 65 L 165 65 C 172 65 172 75 165 75 L 150 75 L 150 85 L 132 85 L 132 75 L 115 75 C 108 75 108 65 115 65 Z" fill="url(#metalGrad)"/>
  </g>

  <!-- Floating Energy / Action Sparks (Representing active usage) -->
  <g filter="url(#glow)">
    <!-- Golden Spark 1 -->
    <path d="M 160 45 L 163 55 L 173 58 L 163 61 L 160 71 L 157 61 L 147 58 L 157 55 Z" fill="#fbbf24"/>
    <!-- Golden Spark 2 -->
    <path d="M 75 40 L 77 46 L 83 48 L 77 50 L 75 56 L 73 50 L 67 48 L 73 46 Z" fill="#f59e0b" transform="scale(0.8) translate(20, -10)"/>
    <!-- Cyan Magic Particle -->
    <circle cx="110" cy="45" r="4" fill="#38bdf8"/>
    <circle cx="130" cy="35" r="3" fill="#34d399"/>
    <!-- Small star accent -->
    <path d="M 190 120 L 192 125 L 197 127 L 192 129 L 190 134 L 188 129 L 183 127 L 188 125 Z" fill="#38bdf8"/>
  </g>

  <!-- Dynamic Motion Trail / Energy Arc -->
  <path d="M 60 40 Q 120 10 180 50" stroke="url(#wrenchGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" stroke-dasharray="6 6"/>

</svg>