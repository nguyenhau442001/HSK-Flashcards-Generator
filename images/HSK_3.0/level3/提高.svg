<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with dark mode slate gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="platformGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Atmosphere -->
  <!-- Ambient stars / grid elements -->
  <g fill="#334155" opacity="0.4">
    <circle cx="40" cy="50" r="1.5"/>
    <circle cx="190" cy="40" r="2"/>
    <circle cx="210" cy="120" r="1"/>
    <circle cx="30" cy="140" r="1.5"/>
    <circle cx="90" cy="30" r="1"/>
  </g>

  <!-- Glowing upward beam representing elevation / 'tígāo' (raising/improving) -->
  <polygon points="90,210 150,210 170,70 70,70" fill="url(#beamGrad)"/>

  <!-- Motion upward arrows in background -->
  <g fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
    <path d="M120,130 L120,90 M110,100 L120,90 L130,100"/>
    <path d="M80,160 L80,130 M72,138 L80,130 L88,138"/>
    <path d="M160,170 L160,140 M152,148 L160,140 L168,148"/>
  </g>

  <!-- Launch Platform / Desk Surface -->
  <path d="M40,210 L200,210 L180,225 L60,225 Z" fill="url(#platformGrad)" stroke="#475569" stroke-width="2"/>
  <ellipse cx="120" cy="210" rx="60" ry="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Launch Pad Details -->
  <rect x="105" y="213" width="30" height="9" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <line x1="70" y1="217" x2="100" y2="217" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="217" x2="170" y2="217" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic Rocket (Main Subject of Elevation / Raising) -->
  <g transform="translate(0, -10)">
    <!-- Rocket Flame & Exhaust Glow -->
    <ellipse cx="120" cy="205" rx="14" ry="22" fill="url(#flameGrad)" filter="url(#glow)"/>
    <ellipse cx="120" cy="200" rx="8" ry="14" fill="#fef08a"/>

    <!-- Rocket Fins -->
    <path d="M100,160 L85,185 L105,180 Z" fill="#ec4899"/>
    <path d="M140,160 L155,185 L135,180 Z" fill="#ec4899"/>

    <!-- Rocket Main Body -->
    <path d="M120,90 C135,120 138,150 138,175 L102,175 C102,150 105,120 120,90 Z" fill="url(#rocketBody)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Rocket Nose Cone -->
    <path d="M120,90 C135,120 138,150 138,175 L102,175 C102,150 105,120 120,90 Z" fill="url(#rocketBody)"/>
    <path d="M120,70 C128,82 135,95 138,110 L102,110 C105,95 112,82 120,70 Z" fill="#ef4444"/>

    <!-- Rocket Window / Porthole -->
    <circle cx="120" cy="130" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="120" cy="130" r="7" fill="#38bdf8"/>
    <circle cx="118" cy="128" r="2" fill="#f8fafc" opacity="0.8"/>

    <!-- Rocket Stripes/Accents -->
    <path d="M104,155 L136,155" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Foreground Atmospheric Particles / Floating Achievement Sparks -->
  <g filter="url(#glow)">
    <circle cx="85" cy="100" r="3" fill="#fbbf24"/>
    <circle cx="160" cy="85" r="4" fill="#38bdf8"/>
    <circle cx="145" cy="135" r="2" fill="#10b981"/>
    <circle cx="95" cy="170" r="2.5" fill="#fb923c"/>
  </g>

  <!-- Star sparkles -->
  <path d="M165,50 L167,56 L173,58 L167,60 L165,66 L163,60 L157,58 L163,56 Z" fill="#fef08a" opacity="0.9"/>
  <path d="M75,75 L76,79 L80,80 L76,81 L75,85 L74,81 L70,80 L74,79 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M130,45 L131,48 L134,49 L131,50 L130,53 L129,50 L126,49 L129,48 Z" fill="#f43f5e" opacity="0.8"/>

</svg>