<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Shop Lighting Gradient -->
    <radialGradient id="shopGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Counter Top Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Shelf Wood Gradient -->
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Window Light -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Interior Glow -->
  <rect width="240" height="240" rx="24" fill="url(#shopGlow)"/>

  <!-- 2. Environment & Background Elements (Shop Interior) -->
  <!-- Background Wall Details -->
  <rect x="20" y="25" width="200" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Window Panel showing night city/lights outside -->
  <path d="M 160 35 L 205 35 L 205 95 L 160 95 Z" fill="url(#windowLight)" stroke="#475569" stroke-width="2" rx="4"/>
  <circle cx="175" cy="50" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="190" cy="70" r="2" fill="#38bdf8" opacity="0.8"/>
  <path d="M 160 65 L 205 65" stroke="#475569" stroke-width="1.5"/>

  <!-- Shelves with Products (Context) -->
  <rect x="30" y="45" width="110" height="6" rx="2" fill="url(#shelfGrad)" filter="url(#shadow)"/>
  <rect x="30" y="85" width="110" height="6" rx="2" fill="url(#shelfGrad)" filter="url(#shadow)"/>

  <!-- Shelf Items (Colorful cute products) -->
  <rect x="40" y="27" width="14" height="18" rx="3" fill="#ec4899"/>
  <rect x="58" y="23" width="16" height="22" rx="3" fill="#10b981"/>
  <rect x="78" y="29" width="12" height="16" rx="3" fill="#f59e0b"/>
  <circle cx="107" cy="35" r="9" fill="#38bdf8"/>

  <rect x="40" y="67" width="18" height="18" rx="3" fill="#fb923c"/>
  <rect x="62" y="63" width="12" height="22" rx="3" fill="#a855f7"/>
  <rect x="78" y="65" width="15" height="20" rx="3" fill="#38bdf8"/>

  <!-- Warm Pendant Light -->
  <path d="M 115 10 L 125 10 L 128 25 L 112 25 Z" fill="#64748b"/>
  <path d="M 100 25 C 100 20, 140 20, 140 25 Z" fill="#f59e0b"/>
  <path d="M 105 25 L 135 25 L 145 45 L 95 45 Z" fill="#fbbf24" opacity="0.2"/>
  <circle cx="120" cy="27" r="4" fill="#fef08a"/>

  <!-- 3. Store Counter -->
  <rect x="10" y="150" width="220" height="80" rx="6" fill="url(#counterGrad)" filter="url(#shadow)"/>
  <rect x="10" y="150" width="220" height="8" fill="#475569" rx="2"/>
  <!-- Register/Terminal on Counter -->
  <rect x="175" y="125" width="30" height="25" rx="4" fill="#64748b"/>
  <polygon points="170,150 210,150 215,135 175,135" fill="#475569"/>
  <rect x="182" y="130" width="16" height="10" rx="2" fill="#38bdf8" opacity="0.8"/>

  <!-- Shopping Basket with items -->
  <path d="M 25 155 L 45 155 L 50 175 L 20 175 Z" fill="#f59e0b" filter="url(#shadow)"/>
  <path d="M 20 155 C 20 148, 50 148, 50 155" fill="none" stroke="#d97706" stroke-width="2"/>
  <circle cx="30" cy="150" r="8" fill="#10b981"/>
  <circle cx="40" cy="148" r="7" fill="#ec4899"/>

  <!-- 4. Main Subject: The Customer (顾客) -->
  <!-- Customer Body & Torso (Leaning slightly forward over counter with shopping bag) -->
  <g transform="translate(0, 5)">
    <!-- Shopping Bag in hand -->
    <path d="M 60 145 L 85 145 L 80 185 L 65 185 Z" fill="#ec4899" filter="url(#shadow)"/>
    <path d="M 68 145 C 68 138, 77 138, 77 145" fill="none" stroke="#fbcfe8" stroke-width="2"/>
    
    <!-- Arm (Back) -->
    <path d="M 95 110 L 75 140 L 68 135 L 85 105 Z" fill="#2563eb"/>

    <!-- Torso -->
    <path d="M 85 90 C 85 90, 95 130, 95 155 L 125 155 C 125 130, 115 90, 115 90 Z" fill="#3b82f6" filter="url(#shadow)"/>
    <!-- Jacket detail/collar -->
    <path d="M 97 90 L 105 115 L 112 90 Z" fill="#1d4ed8"/>

    <!-- Neck -->
    <rect x="99" y="78" width="12" height="15" rx="4" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="105" cy="65" r="18" fill="#fbcfe8" filter="url(#shadow)"/>

    <!-- Hair (Stylish modern hairstyle) -->
    <path d="M 87 65 C 87 50, 100 45, 115 48 C 125 50, 126 62, 124 70 C 122 60, 115 53, 105 53 C 95 53, 90 60, 87 65 Z" fill="#334155"/>
    <path d="M 90 62 C 88 55, 95 50, 105 48 L 105 55 Z" fill="#1e293b"/>

    <!-- Friendly facial expression -->
    <!-- Eyes (Happy/Curious curve) -->
    <path d="M 97 63 Q 101 59 105 63" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 111 63 Q 115 59 119 63" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Smile -->
    <path d="M 104 70 Q 108 75 112 70" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="98" cy="67" r="3" fill="#fb7185" opacity="0.6"/>
    <circle cx="118" cy="67" r="3" fill="#fb7185" opacity="0.6"/>

    <!-- Arm (Front, resting on counter) -->
    <path d="M 110 100 L 135 125 L 145 120 L 120 90 Z" fill="#2563eb"/>
    <!-- Hand -->
    <circle cx="140" cy="123" r="6" fill="#fbcfe8"/>
  </g>

  <!-- 5. Dynamic Accent Particles / Action Elements -->
  <!-- Sparkles denoting positive shopping experience / quality service -->
  <g fill="#fbbf24">
    <path d="M 155 75 L 158 82 L 165 85 L 158 88 L 155 95 L 152 88 L 145 85 L 152 82 Z" opacity="0.9"/>
    <path d="M 75 35 L 77 40 L 82 42 L 77 44 L 75 49 L 73 44 L 68 42 L 73 40 Z" opacity="0.7" transform="scale(0.8) translate(20, 10)"/>
  </g>

  <!-- Floating price tag / icon accent -->
  <g transform="translate(180, 75) rotate(15)" filter="url(#shadow)">
    <rect x="0" y="0" width="22" height="14" rx="3" fill="#10b981"/>
    <circle cx="4" cy="7" r="2" fill="#065f46"/>
    <line x1="8" y1="5" x2="18" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="9" x2="14" y2="9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>