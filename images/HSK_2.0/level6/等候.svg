<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Waiting Area Marker -->
  <path d="M80 200 L160 200 L150 220 L90 220 Z" fill="#334155"/>
  <circle cx="120" cy="210" r="4" fill="#fbbf24"/>
  
  <!-- Character: Person waiting -->
  <g transform="translate(120, 160)">
    <!-- Shadow -->
    <ellipse cx="0" cy="20" rx="20" ry="5" fill="#000" opacity="0.3"/>
    <!-- Body -->
    <path d="M-15 20 Q-15 0 0 0 Q15 0 15 20 L15 60 L-15 60 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-15" r="15" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-15 -15 Q-15 -30 0 -30 Q15 -30 15 -15 Z" fill="#78350f"/>
    <!-- Arm -->
    <path d="M15 10 L30 30" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Counter/Desk -->
  <rect x="160" y="80" width="80" height="100" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="160" y="80" width="80" height="20" fill="#334155"/>
  
  <!-- Receptionist -->
  <g transform="translate(200, 120)">
    <circle cx="0" cy="-10" r="12" fill="#fde68a"/>
    <rect x="-15" y="2" width="30" height="40" fill="#ec4899" rx="5"/>
    <path d="M-5 -5 L5 -5" stroke="#78350f" stroke-width="2"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="3" fill="#fb923c" opacity="0.6"/>
  <circle cx="50" cy="30" r="2" fill="#10b981" opacity="0.6"/>
  <rect x="20" y="100" width="40" height="60" rx="5" fill="#334155"/>
  <path d="M25 110 L55 110 M25 125 L55 125 M25 140 L45 140" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
</svg>