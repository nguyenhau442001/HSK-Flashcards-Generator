<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Screen Glow & Projection Gradients -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="beam-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Character & Prop Gradients -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="tv-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="magic-portal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Shadows & Filters -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Star Symbol for Magic -->
    <g id="sparkle">
      <path d="M0,-6 C1,-2 2,-1 6,0 C2,1 1,2 0,6 C-1,2 -2,1 -6,0 C-2,-1 -1,-2 0,-6 Z" fill="#fbbf24"/>
    </g>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Room Details (Cozy Living Room) -->
  <!-- Wallpaper subtle stripe / pattern -->
  <path d="M0 0h240v170H0z" fill="#1e293b" opacity="0.3"/>
  <line x1="60" y1="0" x2="60" y2="170" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="120" y1="0" x2="120" y2="170" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="180" y1="0" x2="180" y2="170" stroke="#334155" stroke-width="1" opacity="0.3"/>

  <!-- Bookshelf / Plant in Background -->
  <rect x="20" y="40" width="30" height="80" rx="4" fill="#334155" opacity="0.5"/>
  <rect x="25" y="60" width="20" height="6" rx="2" fill="#64748b" opacity="0.6"/>
  <rect x="25" y="80" width="20" height="6" rx="2" fill="#64748b" opacity="0.6"/>
  <!-- Plant leaves -->
  <path d="M35 40 Q25 25 20 30 Q15 35 30 40" fill="#10b981" opacity="0.7"/>
  <path d="M35 40 Q45 20 50 25 Q55 30 40 40" fill="#10b981" opacity="0.7"/>

  <!-- Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#0f172a"/>
  <!-- Floor Accent Line -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="3"/>

  <!-- Rug -->
  <ellipse cx="120" cy="195" rx="70" ry="22" fill="#334155" opacity="0.6"/>
  <ellipse cx="120" cy="195" rx="55" ry="16" fill="#1e293b"/>

  <!-- TV Stand / Media Console -->
  <rect x="55" y="140" width="130" height="35" rx="6" fill="#475569" filter="url(#soft-shadow)"/>
  <rect x="65" y="148" width="40" height="20" rx="3" fill="#1e293b"/>
  <rect x="135" y="148" width="40" height="20" rx="3" fill="#1e293b"/>

  <!-- THE TELEVISION SET (Retro-Modern Cute TV) -->
  <rect x="70" y="55" width="100" height="90" rx="16" fill="url(#tv-body)" filter="url(#soft-shadow)" stroke="#64748b" stroke-width="2"/>
  <!-- TV Antennae -->
  <path d="M100 55 L75 25" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 55 L165 25" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="75" cy="25" r="3" fill="#f59e0b"/>
  <circle cx="165" cy="25" r="3" fill="#f59e0b"/>

  <!-- TV Screen Outer Bezel -->
  <rect x="80" y="65" width="80" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>

  <!-- TV SCREEN CONTENT: ACTION-PACKED CARTOON ANIMATION -->
  <g clip-path="url(#screen-clip)">
    <clipPath id="screen-clip">
      <rect x="80" y="65" width="80" height="65" rx="8"/>
    </clipPath>

    <!-- Dynamic Animated Sky inside TV -->
    <rect x="80" y="65" width="80" height="65" fill="url(#magic-portal)"/>

    <!-- Action Speed Lines / Effects inside screen -->
    <path d="M80 75 L160 95" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <path d="M80 110 L160 90" stroke="#fff" stroke-width="1" opacity="0.3"/>

    <!-- Cute Flying Cartoon Rocket / Character on Screen -->
    <g transform="translate(115, 95) rotate(-15)">
      <!-- Rocket body -->
      <ellipse cx="0" cy="0" rx="16" ry="9" fill="#ffffff" filter="url(#glow)"/>
      <path d="M-12 0 L-20 -6 L-16 0 L-20 6 Z" fill="#ef4444"/>
      <!-- Window -->
      <circle cx="2" cy="0" r="4" fill="#38bdf8" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Fire trail -->
      <path d="M-16 -4 Q-26 0 -16 4 Q-22 0 -16 -4" fill="#fbbf24"/>
    </g>

    <!-- Floating Cartoon Stars & Magic Sparkles inside TV -->
    <use href="#sparkle" x="95" y="78" transform="scale(0.8)"/>
    <use href="#sparkle" x="145" y="112" transform="scale(1.2)"/>
    <use href="#sparkle" x="135" y="75" transform="scale(0.6)"/>
  </g>

  <!-- TV Knob & Speaker Details -->
  <circle cx="180" cy="120" r="4" fill="#64748b"/>
  <circle cx="180" cy="105" r="4" fill="#64748b"/>
  
  <!-- Magical Light Projection Beam coming out of TV towards viewer -->
  <polygon points="90,130 150,130 190,210 50,210" fill="url(#beam-grad)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- ENTHUSIASTIC VIEWER (Cute Child sitting on the rug, watching eagerly) -->
  <g transform="translate(120, 160)" filter="url(#soft-shadow)">
    <!-- Body / Hoodie -->
    <path d="M-18 20 C-18 8 -8 2 0 2 C8 2 18 8 18 20 L22 42 C22 45 19 48 16 48 L-16 48 C-19 48 -22 45 -22 42 Z" fill="url(#body-grad)"/>
    
    <!-- Arms raised in excitement -->
    <path d="M-15 15 C-25 10 -28 0 -32 -5" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-33" cy="-7" r="5" fill="#fcd34d"/> <!-- Hand -->

    <path d="M15 15 C25 10 28 0 32 -5" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <circle cx="33" cy="-7" r="5" fill="#fcd34d"/> <!-- Hand -->

    <!-- Head & Hair -->
    <circle cx="0" cy="-10" r="14" fill="#fcd34d"/> <!-- Face -->
    <!-- Cute messy hair -->
    <path d="M-14 -14 C-10 -24 10 -24 14 -14 C16 -18 8 -22 0 -22 C-8 -22 -16 -18 -14 -14 Z" fill="#334155"/>

    <!-- Sparkly Eyes looking up -->
    <circle cx="-4" cy="-11" r="2" fill="#0f172a"/>
    <circle cx="4" cy="-11" r="2" fill="#0f172a"/>
    <circle cx="-3" cy="-12" r="0.7" fill="#ffffff"/>
    <circle cx="5" cy="-12" r="0.7" fill="#ffffff"/>

    <!-- Happy Open Smile -->
    <path d="M-3 -6 Q0 -2 3 -6" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M-2 -5 Q0 -3 2 -5" fill="#ef4444"/> <!-- Tongue peek -->

    <!-- Cute Rosy Cheeks -->
    <circle cx="-7" cy="-7" r="2.5" fill="#ec4899" opacity="0.5"/>
    <circle cx="7" cy="-7" r="2.5" fill="#ec4899" opacity="0.5"/>
  </g>

  <!-- Foreground Cozy Elements (Popcorn Bowl on Floor) -->
  <g transform="translate(75, 185)" filter="url(#soft-shadow)">
    <!-- Bowl -->
    <path d="M-12 0 L-8 14 C-8 16 -6 18 -4 18 L12 18 C14 18 16 16 16 14 L20 0 Z" fill="#f43f5e"/>
    <path d="M-13 0 L21 0 L18 -4 L-10 -4 Z" fill="#ffe4e6"/> <!-- Rim -->
    <!-- Popcorn pieces spilling out -->
    <circle cx="-3" cy="-6" r="5" fill="#fef08a"/>
    <circle cx="3" cy="-8" r="6" fill="#fef08a"/>
    <circle cx="9" cy="-5" r="5" fill="#fef08a"/>
    <circle cx="0" cy="-12" r="5" fill="#fef08a"/>
    <circle cx="6" cy="-13" r="4" fill="#fef08a"/>
  </g>

  <!-- Ambient Floating Magic Particles in Room -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="45" cy="110" r="3" filter="url(#glow)"/>
    <circle cx="195" cy="140" r="2" filter="url(#glow)"/>
    <circle cx="165" cy="180" r="2.5" filter="url(#glow)"/>
    <circle cx="55" cy="150" r="1.5" fill="#ec4899" filter="url(#glow)"/>
  </g>
</svg>