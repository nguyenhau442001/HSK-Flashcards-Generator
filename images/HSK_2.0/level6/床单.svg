<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed Frame -->
  <rect x="40" y="140" width="160" height="40" rx="4" fill="#334155"/>
  <rect x="45" y="180" width="150" height="10" rx="2" fill="#1e293b"/>
  
  <!-- Mattress -->
  <rect x="40" y="110" width="160" height="30" rx="4" fill="#64748b"/>
  
  <!-- The New Bed Sheet (The focus) -->
  <path d="M30 115 L210 115 L205 150 L35 150 Z" fill="#f8fafc"/>
  <path d="M30 115 L35 150 L45 150 L40 115 Z" fill="#e2e8f0"/>
  <path d="M210 115 L205 150 L195 150 L200 115 Z" fill="#e2e8f0"/>
  
  <!-- Pattern on sheet -->
  <circle cx="80" cy="130" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="140" cy="125" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="180" cy="135" r="3" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Character -->
  <g transform="translate(100, 70)">
    <!-- Body -->
    <path d="M20 80 C20 60, 60 60, 60 80 L60 120 L20 120 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="40" cy="50" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M25 45 C25 30, 55 30, 55 45 L50 40 L30 40 Z" fill="#78350f"/>
    <!-- Arms -->
    <path d="M20 85 L10 100" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M60 85 L70 100" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Pillow -->
  <rect x="50" y="90" width="50" height="25" rx="5" fill="#ec4899"/>
  
  <!-- Window/Background Detail -->
  <rect x="180" y="20" width="40" height="40" rx="4" fill="#334155"/>
  <circle cx="200" cy="40" r="10" fill="#fbbf24"/>
</svg>