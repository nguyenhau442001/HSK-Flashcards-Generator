<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(120, 140)">
    <!-- Branch -->
    <path d="M-80 0 C-40 -20 40 -20 80 0" fill="none" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Leaves -->
    <path d="M-60 -10 Q-80 -40 -50 -50 Q-30 -30 -40 -10 Z" fill="#10b981"/>
    <path d="M50 -10 Q70 -40 40 -50 Q20 -30 30 -10 Z" fill="#059669"/>
    
    <!-- Main Subject: Ripe Fruit -->
    <circle cx="0" cy="0" r="45" fill="#f59e0b"/>
    <circle cx="15" cy="-15" r="15" fill="#fbbf24" opacity="0.6"/>
    <path d="M-5 -45 L0 -60 L5 -45 Z" fill="#78350f"/>
    
    <!-- Highlights -->
    <ellipse cx="-15" cy="-15" rx="8" ry="12" fill="#ffffff" opacity="0.2" transform="rotate(-20)"/>
  </g>

  <!-- Atmospheric Details -->
  <circle cx="180" cy="50" r="3" fill="#fb923c" opacity="0.4"/>
  <circle cx="40" cy="80" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="200" cy="180" r="4" fill="#ec4899" opacity="0.2"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="210" rx="70" ry="10" fill="#000000" opacity="0.3"/>
</svg>