<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Atmospheric Glow & Street Elements -->
  <circle cx="120" cy="120" r="100" fill="#1e293b" opacity="0.6"/>
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#1e293b"/>
  
  <!-- Road Details -->
  <path d="M0 175 L240 175" stroke="#334155" stroke-width="4"/>
  <line x1="30" y1="205" x2="80" y2="205" stroke="#f1f5f9" stroke-width="3" stroke-dasharray="10, 8" opacity="0.4"/>
  <line x1="120" y1="205" x2="170" y2="205" stroke="#f1f5f9" stroke-width="3" stroke-dasharray="10, 8" opacity="0.4"/>

  <!-- City Background Silhouettes -->
  <rect x="20" y="90" width="35" height="70" fill="#1e293b" opacity="0.8"/>
  <rect x="65" y="70" width="40" height="90" fill="#1e293b" opacity="0.7"/>
  <rect x="180" y="80" width="45" height="80" fill="#1e293b" opacity="0.75"/>
  
  <!-- Street Light / Ambience -->
  <path d="M210 160 L210 50 L195 50" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="195" cy="50" r="4" fill="#f59e0b"/>
  <path d="M175 160 L220 220" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>

  <!-- The Car (Being stopped) -->
  <g transform="translate(30, 115)">
    <!-- Car Body -->
    <path d="M 15 25 L 35 12 L 85 12 L 105 25 L 115 42 L 15 42 Z" fill="#38bdf8"/>
    <!-- Roof/Windows -->
    <path d="M 40 12 L 52 2 L 78 2 L 92 12 Z" fill="#0ea5e9"/>
    <path d="M 43 11 L 53 4 L 75 4 L 84 11 Z" fill="#cbd5e1" opacity="0.4"/>
    <!-- Headlight Beam -->
    <path d="M 15 27 L -20 18 L -20 42 Z" fill="#fef08a" opacity="0.2"/>
    <!-- Headlight -->
    <circle cx="17" cy="27" r="3" fill="#fef08a"/>
    <!-- Wheels -->
    <circle cx="35" cy="42" r="9" fill="#0f172a"/>
    <circle cx="35" cy="42" r="4" fill="#64748b"/>
    <circle cx="95" cy="42" r="9" fill="#0f172a"/>
    <circle cx="95" cy="42" r="4" fill="#64748b"/>
    <!-- Motion Lines -->
    <line x1="120" y1="20" x2="135" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="125" y1="30" x2="140" y2="30" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- The Pedestrian / Guard Character (Actively Stopping the Car) -->
  <g transform="translate(130, 95)">
    <!-- Body & Torso -->
    <path d="M 25 35 Q 25 22 37 20 Q 48 22 48 35 L 50 65 L 23 65 Z" fill="#fb923c"/>
    <!-- Jacket Details / Vest -->
    <path d="M 25 35 L 36 20 L 48 35 L 48 65 L 25 65 Z" fill="#ea580c"/>
    <!-- Head & Hair -->
    <circle cx="36.5" cy="11" r="9" fill="#fbcfe8"/>
    <path d="M 27 10 Q 36 -1 46 10 Q 42 5 36.5 5 Q 31 5 27 10 Z" fill="#334155"/>
    
    <!-- Left Arm (Reaching out/stopping gesture) -->
    <path d="M 27 30 L 2 30" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1" cy="30" r="4" fill="#fbcfe8"/> <!-- Hand palm facing out -->
    
    <!-- Right Arm (Balanced stance) -->
    <path d="M 46 30 L 56 45" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Legs -->
    <path d="M 29 65 L 27 92" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <path d="M 43 65 L 45 92" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <!-- Shoes -->
    <rect x="22" y="90" width="8" height="4" rx="2" fill="#0f172a"/>
    <rect x="42" y="90" width="8" height="4" rx="2" fill="#0f172a"/>
  </g>

  <!-- Stopping Effect Indicator (Action Lines / Alert) -->
  <path d="M 125 105 L 115 100" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 127 118 L 113 118" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 125 130 L 115 135" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

</svg>