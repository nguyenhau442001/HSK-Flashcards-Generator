<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Scale Metallic Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Warm Golden Glow for Weight -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Counterweight Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background shapes for depth -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />
  <circle cx="120" cy="120" r="70" fill="#1e293b" opacity="0.5" />

  <!-- Wooden/Modern Table Surface -->
  <path d="M 20 195 L 220 195 L 235 220 L 5 220 Z" fill="#0f172a" opacity="0.8" />
  <line x1="20" y1="195" x2="220" y2="195" stroke="#334155" stroke-width="2" />

  <!-- Balance Scale Stand -->
  <!-- Base -->
  <ellipse cx="120" cy="195" rx="35" ry="8" fill="#475569" />
  <path d="M 105 195 L 112 140 L 128 140 L 135 195 Z" fill="#64748b" />
  <!-- Vertical Pillar -->
  <rect x="115" y="70" width="10" height="75" rx="3" fill="url(#metalGrad)" />
  <!-- Top Finial -->
  <circle cx="120" cy="70" r="6" fill="#f43f5e" />

  <!-- Balance Beam (Level/Balanced state) -->
  <g id="balance-beam">
    <!-- Main Beam Bar -->
    <rect x="50" y="66" width="140" height="8" rx="4" fill="url(#metalGrad)" />
    <circle cx="120" cy="70" r="4" fill="#0f172a" />

    <!-- Left Chain & Pan Connection -->
    <line x1="60" y1="74" x2="60" y2="120" stroke="#94a3b8" stroke-width="2" />
    <line x1="60" y1="74" x2="75" y2="120" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="60" y1="74" x2="45" y2="120" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Right Chain & Pan Connection -->
    <line x1="180" y1="74" x2="180" y2="120" stroke="#94a3b8" stroke-width="2" />
    <line x1="180" y1="74" x2="195" y2="120" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="180" y1="74" x2="165" y2="120" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Left Scale Pan -->
    <path d="M 35 120 Q 60 135 85 120 Z" fill="#cbd5e1" />
    <ellipse cx="60" cy="120" rx="25" ry="6" fill="#94a3b8" />

    <!-- Right Scale Pan -->
    <path d="M 155 120 Q 180 135 205 120 Z" fill="#cbd5e1" />
    <ellipse cx="180" cy="120" rx="25" ry="6" fill="#94a3b8" />
  </g>

  <!-- Objects on Scales representing "Equal / Equivalent" -->
  
  <!-- Left Side: Golden Cube/Weight (1000g) -->
  <g transform="translate(48, 96)">
    <!-- Shadow -->
    <ellipse cx="12" cy="27" rx="16" ry="5" fill="#000000" opacity="0.4" />
    <!-- Cube Body -->
    <path d="M 0 10 L 12 0 L 24 10 L 24 24 L 12 34 L 0 24 Z" fill="url(#goldGrad)" />
    <!-- Cube Top/Side Facets for 3D look -->
    <path d="M 12 0 L 24 10 L 12 20 L 0 10 Z" fill="#fde047" />
    <path d="M 12 20 L 24 10 L 24 24 L 12 34 Z" fill="#b45309" opacity="0.4" />
    <!-- Star/Emblem detail on weight -->
    <path d="M 12 7 L 14 11 L 18 11 L 15 13 L 16 17 L 12 15 L 8 17 L 9 13 L 6 11 L 10 11 Z" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Right Side: Glowing Equivalent Bundles (1kg / 1000g units) -->
  <g transform="translate(162, 98)">
    <!-- Shadow -->
    <ellipse cx="18" cy="25" rx="18" ry="5" fill="#000000" opacity="0.4" />
    <!-- Sphere/Orb 1 -->
    <circle cx="10" cy="12" r="10" fill="url(#cyanGrad)" />
    <circle cx="7" cy="9" r="3" fill="#99f6e4" opacity="0.7" />
    
    <!-- Sphere/Orb 2 -->
    <circle cx="26" cy="14" r="10" fill="url(#cyanGrad)" />
    <circle cx="23" cy="11" r="3" fill="#99f6e4" opacity="0.7" />
    
    <!-- Sphere/Orb 3 stacked -->
    <circle cx="18" cy="2" r="9" fill="url(#cyanGrad)" />
    <circle cx="15" cy="0" r="2.5" fill="#99f6e4" opacity="0.7" />
  </g>

  <!-- Central Visual "Equivalence" Indicator (Glowing "=" floating abstractly yet integrated) -->
  <g filter="url(#glow)" opacity="0.9">
    <!-- Top Bar -->
    <rect x="104" y="32" width="32" height="6" rx="3" fill="#38bdf8" />
    <!-- Bottom Bar -->
    <rect x="104" y="44" width="32" height="6" rx="3" fill="#38bdf8" />
  </g>

  <!-- Sparkles & Action Elements for lively app feel -->
  <path d="M 85 40 L 88 45 L 93 48 L 88 51 L 85 56 L 82 51 L 77 48 L 82 45 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M 155 35 L 157 39 L 161 41 L 157 43 L 155 47 L 153 43 L 149 41 L 153 39 Z" fill="#38bdf8" opacity="0.9" />
  <circle cx="120" cy="15" r="2" fill="#f43f5e" />
  <circle cx="105" cy="18" r="1.5" fill="#38bdf8" />
  <circle cx="135" cy="18" r="1.5" fill="#38bdf8" />

  <!-- Dynamic Energy Waves / Balance Indicator Glow -->
  <path d="M 116 68 L 120 64 L 124 68" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>