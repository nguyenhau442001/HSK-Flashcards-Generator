<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="desk" x1="120" y1="180" x2="120" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="board" x1="40" y1="50" x2="200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Background Studio Details / Workshop Atmosphere -->
  <circle cx="120" cy="110" r="85" fill="#1e293b" opacity="0.6"/>
  
  <!-- Floating energetic multi-capability sparks (representing "not only this, but also that") -->
  <g filter="url(#glow)">
    <circle cx="50" cy="60" r="4" fill="#fbbf24"/>
    <circle cx="190" cy="70" r="5" fill="#38bdf8"/>
    <circle cx="45" cy="140" r="3" fill="#f472b6"/>
    <circle cx="195" cy="130" r="4" fill="#10b981"/>
  </g>

  <!-- Giant Multi-Tasking Idea Board (representing comprehensive capability) -->
  <rect x="35" y="45" width="170" height="115" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="43" y="53" width="154" height="99" rx="8" fill="url(#board)"/>

  <!-- Interior UI/Art Elements on Board: Dynamic multi-layer creative workflow -->
  <!-- Left Column: Brain/Talent element -->
  <circle cx="85" cy="90" r="22" fill="#1e293b" opacity="0.5"/>
  <path d="M75 90 C75 80, 95 80, 95 90 C95 100, 75 100, 75 90 Z" fill="url(#gold)"/>
  <path d="M80 85 L90 95 M90 85 L80 95" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Column: Diligence/Action element -->
  <circle cx="155" cy="90" r="22" fill="#1e293b" opacity="0.5"/>
  <path d="M145 95 L152 102 L165 85" fill="none" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connecting 'Plus' / Expansion Elements showing "not only... but also" -->
  <rect x="112" y="80" width="16" height="20" rx="4" fill="#ffffff" opacity="0.2"/>
  <path d="M120 75 L120 105 M105 90 L135 90" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom graph lines representing growth and high performance -->
  <path d="M60 128 L85 115 L110 122 L150 105 L180 112" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="105" r="4" fill="#fbbf24"/>
  <circle cx="180" cy="112" r="4" fill="#f472b6"/>

  <!-- Desk Surface -->
  <rect x="0" y="175" width="240" height="65" fill="url(#desk)"/>
  <path d="M0 175 L240 175" stroke="#64748b" stroke-width="2"/>

  <!-- Foreground Props: Rich Tangible Context (Workspace items showing intellect & hard work) -->
  <!-- Laptop base -->
  <path d="M70 195 L170 195 L185 215 L55 215 Z" fill="#64748b"/>
  <!-- Laptop screen hint reflecting glow -->
  <rect x="85" y="160" width="70" height="35" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <path d="M95 170 L135 170 M95 180 L120 180" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Mug (Hard work fuel) -->
  <rect x="35" y="180" width="18" height="22" rx="3" fill="url(#pink)"/>
  <path d="M53 186 C58 186, 58 196, 53 196" fill="none" stroke="url(#pink)" stroke-width="3" stroke-linecap="round"/>
  <path d="M38 177 C39 174, 41 174, 42 171" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Stack of Books (Intelligence / Study) -->
  <g transform="translate(170, 180)">
    <rect x="0" y="18" width="35" height="7" rx="2" fill="#3b82f6"/>
    <rect x="-2" y="11" width="38" height="7" rx="2" fill="#10b981"/>
    <rect x="2" y="4" width="32" height="7" rx="2" fill="#f59e0b"/>
  </g>

  <!-- Floating Achievement Stars / Sparkles (Action-packed rich atmosphere) -->
  <path d="M25 80 Q30 80 30 75 Q30 80 35 80 Q30 80 30 85 Q30 80 25 80 Z" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M210 150 Q215 150 215 145 Q215 150 220 150 Q215 150 215 155 Q215 150 210 150 Z" fill="url(#pink)" filter="url(#glow)"/>
  <path d="M25 35 Q28 35 28 32 Q28 35 31 35 Q28 35 28 38 Q28 35 25 35 Z" fill="url(#cyan)" filter="url(#glow)"/>

</svg>