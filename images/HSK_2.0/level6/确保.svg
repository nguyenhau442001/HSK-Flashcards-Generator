<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Workbench -->
  <rect x="20" y="160" width="200" height="15" rx="2" fill="#334155"/>
  <rect x="30" y="175" width="10" height="50" fill="#475569"/>
  <rect x="200" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Product (A high-quality lamp being inspected) -->
  <circle cx="120" cy="120" r="35" fill="#f59e0b" fill-opacity="0.2"/>
  <path d="M105 160 L135 160 L130 120 L110 120 Z" fill="#fbbf24"/>
  <circle cx="120" cy="110" r="15" fill="#fb923c"/>
  
  <!-- Inspector Character -->
  <g transform="translate(40, 80)">
    <path d="M20 100 Q40 60 60 100" fill="#38bdf8"/>
    <circle cx="40" cy="50" r="20" fill="#fde68a"/>
    <rect x="35" y="70" width="10" height="30" fill="#38bdf8"/>
    <!-- Magnifying Glass -->
    <circle cx="70" cy="40" r="12" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="78" y1="48" x2="95" y2="65" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Clipboard/Checklist -->
  <rect x="150" y="70" width="50" height="70" rx="4" fill="#f1f5f9"/>
  <rect x="155" y="80" width="40" height="5" rx="1" fill="#cbd5e1"/>
  <rect x="155" y="95" width="30" height="5" rx="1" fill="#cbd5e1"/>
  <rect x="155" y="110" width="40" height="5" rx="1" fill="#cbd5e1"/>
  <circle cx="185" cy="112" r="4" fill="#10b981"/>
  
  <!-- Ambient Light/Sparkles -->
  <circle cx="180" cy="50" r="2" fill="#fbbf24"/>
  <circle cx="200" cy="150" r="3" fill="#fbbf24"/>
  <circle cx="30" cy="140" r="2" fill="#fbbf24"/>
</svg>