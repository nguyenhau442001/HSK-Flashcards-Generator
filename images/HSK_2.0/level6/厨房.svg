<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall Tile Pattern Gradient -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Stove Light Gradient -->
    <radialGradient id="stoveGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Cabinet Wood/Tone Gradient -->
    <linearGradient id="cabinetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="counterTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ================= BACKGROUND & WALL ================= -->
  <!-- Kitchen Back Wall -->
  <rect x="15" y="15" width="210" height="155" rx="12" fill="url(#wallGrad)"/>

  <!-- Wall Tiles Grid Lines -->
  <g stroke="#475569" stroke-width="0.75" opacity="0.6">
    <!-- Horizontal lines -->
    <line x1="15" y1="45" x2="225" y2="45"/>
    <line x1="15" y1="75" x2="225" y2="75"/>
    <line x1="15" y1="105" x2="225" y2="105"/>
    <line x1="15" y1="135" x2="225" y2="135"/>
    
    <!-- Vertical lines (staggered look) -->
    <line x1="50" y1="15" x2="50" y2="105"/>
    <line x1="85" y1="15" x2="85" y2="105"/>
    <line x1="120" y1="15" x2="120" y2="105"/>
    <line x1="155" y1="15" x2="155" y2="105"/>
    <line x1="190" y1="15" x2="190" y2="105"/>

    <line x1="32" y1="105" x2="32" y2="170"/>
    <line x1="67" y1="105" x2="67" y2="170"/>
    <line x1="102" y1="105" x2="102" y2="170"/>
    <line x1="137" y1="105" x2="137" y2="170"/>
    <line x1="172" y1="105" x2="172" y2="170"/>
    <line x1="207" y1="105" x2="207" y2="170"/>
  </g>

  <!-- Small Kitchen Window with Night/Evening Sky -->
  <rect x="25" y="25" width="55" height="55" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <rect x="28" y="28" width="49" height="49" fill="#1e293b"/>
  <!-- Moon / Stars outside -->
  <circle cx="58" cy="42" r="8" fill="#fbbf24" opacity="0.9"/>
  <circle cx="38" cy="60" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="48" cy="52" r="1" fill="#ffffff" opacity="0.6"/>
  <!-- Window Glass Glow -->
  <rect x="28" y="28" width="49" height="49" fill="url(#windowLight)"/>
  <!-- Window Frame Cross -->
  <line x1="52" y1="28" x2="52" y2="77" stroke="#64748b" stroke-width="2"/>
  <line x1="28" y1="52" x2="77" y2="52" stroke="#64748b" stroke-width="2"/>

  <!-- Hanging Utensil Rail -->
  <line x1="95" y1="35" x2="155" y2="35" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Hooks & Utensils -->
  <path d="M105 35 v10 M125 35 v14 M145 35 v8" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Spatula -->
  <path d="M102 45 h6 l-1 12 h-4 z" fill="#f59e0b"/>
  <!-- Ladle -->
  <circle cx="125" cy="52" r="4" fill="#10b981"/>
  <!-- Whisk -->
  <ellipse cx="145" cy="46" rx="3" ry="5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Upper Wall Cabinet -->
  <rect x="165" y="22" width="55" height="45" rx="4" fill="url(#cabinetGrad)" stroke="#60a5fa" stroke-width="1"/>
  <line x1="165" y1="44" x2="220" y2="44" stroke="#1e40af" stroke-width="1.5"/>
  <circle cx="210" cy="44" r="1.5" fill="#fbbf24"/>
  <circle cx="210" cy="55" r="1.5" fill="#fbbf24"/>

  <!-- ================= PROPS ON COUNTER ================= -->
  <!-- Spice Jars on Left -->
  <rect x="30" y="142" width="16" height="25" rx="3" fill="#ec4899" opacity="0.9"/>
  <rect x="32" y="139" width="12" height="3" rx="1" fill="#fbcfe8"/>
  <rect x="50" y="145" width="14" height="22" rx="3" fill="#10b981" opacity="0.9"/>
  <rect x="52" y="142" width="10" height="3" rx="1" fill="#a7f3d0"/>

  <!-- Plant Pot -->
  <path d="M185 147 l4 20 h-16 l4 -20 z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <ellipse cx="181" cy="147" rx="8" ry="2" fill="#e2e8f0"/>
  <!-- Plant Leaves (Greenery) -->
  <path d="M181 147 q-8 -12 -12 -8 q4 10 12 8" fill="#10b981"/>
  <path d="M181 147 q2 -15 9 -12 q-4 10 -9 12" fill="#34d399"/>
  <path d="M181 147 q8 -10 14 -5 q-7 8 -14 5" fill="#059669"/>

  <!-- ================= MAIN COUNTER & STOVE ================= -->
  <!-- Counter Base Structure -->
  <rect x="15" y="167" width="210" height="58" fill="#0f172a"/>
  <!-- Countertop Surface (Depth Effect) -->
  <rect x="15" y="167" width="210" height="8" rx="2" fill="url(#counterTop)"/>
  <rect x="15" y="172" width="210" height="4" fill="#64748b"/>

  <!-- Cabinet Doors Below Counter -->
  <rect x="25" y="181" width="58" height="38" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="73" cy="200" r="2" fill="#94a3b8"/>

  <rect x="91" y="181" width="58" height="38" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="139" cy="200" r="2" fill="#94a3b8"/>

  <rect x="157" y="181" width="58" height="38" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="203" cy="200" r="2" fill="#94a3b8"/>

  <!-- ================= COOKING SCENE / ACTION ================= -->
  <!-- Stove Top Area -->
  <rect x="95" y="162" width="50" height="5" rx="2.5" fill="#334155"/>
  <!-- Stove Glow Effect -->
  <circle cx="120" cy="167" r="22" fill="url(#stoveGlow)"/>

  <!-- Cooking Pot / Wok -->
  <path d="M98 152 q22 18 44 0 z" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="120" cy="152" rx="22" ry="6" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Pot Handles -->
  <path d="M96 154 q-6 0 -8 -4 q-2 -4 2 -4" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M144 154 q6 0 8 -4 q2 -4 -2 -4" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Pot Lid (Lifted slightly to the side) -->
  <ellipse cx="132" cy="138" rx="16" ry="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="132" cy="132" r="3" fill="#f59e0b"/>

  <!-- Steam Rising (Dynamic & Expressive) -->
  <path d="M110 142 q-4 -8 2 -14 t-2 -14" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M125 140 q6 -10 -2 -16 t4 -16" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M118 144 q-2 -6 4 -10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Food Elements / Bubbles inside Pot -->
  <circle cx="112" cy="152" r="3" fill="#fb923c"/>
  <circle cx="124" cy="153" r="2.5" fill="#38bdf8"/>
  <circle cx="118" cy="150" r="2" fill="#10b981"/>

  <!-- Foreground Floor Shadow / Base -->
  <path d="M0 225 q120 15 240 0 v15 h-240 z" fill="#090d16"/>
</svg>