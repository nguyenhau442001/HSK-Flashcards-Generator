<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- River Water Gradient -->
    <linearGradient id="river-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Riverbank/Earth Gradient -->
    <linearGradient id="bank-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="40%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Sunset Sky Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Sky & Sun -->
  <circle cx="180" cy="70" r="35" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>
  <circle cx="180" cy="70" r="20" fill="#fbbf24" opacity="0.8"/>
  <rect x="0" y="0" width="240" height="120" fill="url(#sky-grad)"/>

  <!-- Distant Far Bank (Hills) -->
  <path d="M0 95 Q 60 85, 120 90 T 240 85 L 240 115 L 0 115 Z" fill="#065f46" opacity="0.6"/>

  <!-- River (Water Surface) -->
  <path d="M0 110 Q 70 100, 140 115 T 240 105 L 240 190 Q 140 210, 0 180 Z" fill="url(#river-grad)"/>

  <!-- Water Ripples / Flow Lines -->
  <path d="M40 135 Q 70 130, 100 138" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M130 155 Q 160 150, 190 158" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M70 170 Q 100 165, 130 173" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- THE MAIN FOCUS: Bờ Sông (The Riverbank) -->
  <!-- Lush grassy and earthy foreground bank -->
  <path d="M-10 130 C 60 115, 110 140, 250 120 L 250 250 L -10 250 Z" fill="url(#bank-grad)"/>

  <!-- Bank Edge Highlight (Shoreline transition) -->
  <path d="M-10 130 C 60 115, 110 140, 250 120" stroke="#4ade80" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Rich Details on the Bank: Reeds, Grass Tufts, Rocks, and Tree -->
  
  <!-- Reeds & Cattails on the bank -->
  <g fill="#15803d">
    <line x1="30" y1="135" x2="25" y2="90" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="25" cy="92" rx="3" ry="8" fill="#b45309"/>
    
    <line x1="38" y1="138" x2="36" y2="95" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="36" cy="98" rx="2.5" ry="7" fill="#b45309"/>

    <line x1="210" y1="125" x2="215" y2="85" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="215" cy="87" rx="3" ry="9" fill="#b45309"/>
    
    <line x1="200" y1="128" x2="202" y2="92" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Grass Tufts (Foreground vector styling) -->
  <path d="M15 138 Q 18 125, 22 135" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M20 140 Q 25 128, 28 138" stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M185 123 Q 190 110, 195 122" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M192 125 Q 197 115, 201 126" stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Rocks on the bank -->
  <path d="M70 145 Q 80 135, 95 142 Q 100 148, 85 152 Q 70 152, 70 145 Z" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <path d="M60 150 Q 65 142, 75 146 Q 78 152, 68 155 Q 58 155, 60 150 Z" fill="#64748b" stroke="#475569" stroke-width="1"/>

  <!-- Tree trunk framing the upper corner -->
  <path d="M 0 0 L 0 55 Q 15 50, 35 60 Q 20 30, 0 0 Z" fill="#78350f"/>
  <path d="M 0 20 Q 15 35, 30 25" stroke="#92400e" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Hanging foliage -->
  <circle cx="25" cy="45" r="18" fill="#15803d" opacity="0.9"/>
  <circle cx="10" cy="55" r="15" fill="#16a34a" opacity="0.9"/>
  <circle cx="45" cy="40" r="14" fill="#22c55e" opacity="0.8"/>

  <!-- Wooden Bench (Tangible contextual human element on the riverbank) -->
  <g transform="translate(110, 122)">
    <!-- Bench Legs -->
    <rect x="10" y="15" width="4" height="15" rx="2" fill="#334155"/>
    <rect x="35" y="15" width="4" height="15" rx="2" fill="#334155"/>
    <!-- Bench Seat -->
    <rect x="5" y="10" width="40" height="5" rx="1.5" fill="#b45309" stroke="#78350f" stroke-width="1"/>
    <!-- Bench Backrest -->
    <rect x="5" y="0" width="40" height="8" rx="1.5" fill="#d97706" stroke="#b45309" stroke-width="1"/>
    <rect x="12" y="8" width="4" height="8" fill="#78350f"/>
    <rect x="33" y="8" width="4" height="8" fill="#78350f"/>
  </g>

  <!-- Cute Small Wooden Pier / Dock extending into the river -->
  <g transform="translate(130, 138)">
    <rect x="0" y="0" width="35" height="12" rx="2" fill="#92400e" stroke="#78350f" stroke-width="1.5"/>
    <line x1="8" y1="0" x2="8" y2="12" stroke="#78350f" stroke-width="1"/>
    <line x1="18" y1="0" x2="18" y2="12" stroke="#78350f" stroke-width="1"/>
    <line x1="26" y1="0" x2="26" y2="12" stroke="#78350f" stroke-width="1"/>
    <!-- Support poles underneath -->
    <rect x="4" y="10" width="3" height="15" fill="#78350f"/>
    <rect x="28" y="10" width="3" height="15" fill="#78350f"/>
  </g>

  <!-- Floating Paper Boat near the shore for narrative depth -->
  <g transform="translate(95, 155) scale(0.7)">
    <polygon points="0,15 25,22 35,15 15,10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <polygon points="15,10 35,15 20,0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Ambient lighting sparks / fireflies -->
  <circle cx="70" cy="120" r="2" fill="#fde047" opacity="0.8" filter="url(#glow)"/>
  <circle cx="105" cy="115" r="1.5" fill="#fde047" opacity="0.6" filter="url(#glow)"/>
  <circle cx="160" cy="130" r="2" fill="#fde047" opacity="0.7" filter="url(#glow)"/>

  <!-- Soft vignette border / frame overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>
</svg>