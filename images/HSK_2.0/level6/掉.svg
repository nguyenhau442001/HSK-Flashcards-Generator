<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment (Dark Mode Atmospheric) -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Ambient Background Details (Subtle Floor & Wall) -->
  <path d="M0 180 L240 160 L240 240 L0 240 Z" fill="#090d16" opacity="0.6" />
  <line x1="0" y1="180" x2="240" y2="160" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Motion Trails for Falling -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M120 40 L120 70" stroke-dasharray="4 8" />
    <path d="M95 45 L90 80" stroke-dasharray="3 6" />
    <path d="M145 35 L150 75" stroke-dasharray="5 5" />
  </g>

  <!-- Falling Gold Coins (Flying out of the bag) -->
  <g filter="url(#glow)">
    <!-- Coin 1 (Tumbling) -->
    <ellipse cx="85" cy="85" rx="8" ry="4" fill="url(#coin-grad)" transform="rotate(-30 85 85)" />
    <!-- Coin 2 (Spilling) -->
    <circle cx="155" cy="70" r="6" fill="url(#coin-grad)" />
    <!-- Coin 3 (Mid-air) -->
    <ellipse cx="140" cy="105" rx="9" ry="5" fill="url(#coin-grad)" transform="rotate(45 140 105)" />
  </g>

  <!-- Sparkles / Action lines -->
  <path d="M165 55 L172 48" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <path d="M70 100 L62 105" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

  <!-- Main Subject: The Money Pouch (Cái túi tiền) -->
  <g transform="translate(0, 15)">
    <!-- Pouch Straps / Drawstring (Untied & Flying up) -->
    <path d="M100 70 C80 50 70 30 55 40" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
    <path d="M140 70 C160 50 170 30 185 45" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />

    <!-- Pouch Body (Tumbling upside down, open mouth) -->
    <g transform="rotate(-15 120 115)">
      <!-- Pouch Neck / Opening -->
      <ellipse cx="120" cy="72" rx="22" ry="9" fill="#7c2d12" />
      <ellipse cx="120" cy="70" rx="20" ry="7" fill="#451a03" />

      <!-- Main Bag Container -->
      <path d="M98 72 C90 100 95 130 115 138 C135 138 150 130 142 72 Z" fill="url(#bag-grad)" stroke="#9a3412" stroke-width="3" stroke-linejoin="round" />

      <!-- Decorative Dollar/Gold Symbol or Patch on Bag -->
      <circle cx="120" cy="105" r="10" fill="#f59e0b" opacity="0.8" />
      <path d="M116 100 L124 100 M120 96 L120 114 M116 110 L124 110" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />

      <!-- Highlight for 3D glossy vector look -->
      <path d="M104 80 C100 100 105 120 112 130" fill="none" stroke="#fdba74" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    </g>
  </g>

  <!-- Objects on the Ground (Rơi xuống đất) -->
  <!-- Impact dust/shockwave ring -->
  <ellipse cx="120" cy="185" rx="45" ry="12" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <ellipse cx="120" cy="187" rx="25" ry="7" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

  <!-- Spilled Coins on Ground -->
  <g>
    <!-- Coin Flat -->
    <circle cx="95" cy="180" r="8" fill="url(#coin-grad)" />
    <circle cx="95" cy="180" r="5" fill="#f59e0b" opacity="0.5" />

    <!-- Coin Standing/Rolling -->
    <ellipse cx="150" cy="175" rx="4" ry="8" fill="url(#coin-grad)" transform="rotate(15 150 175)" />

    <!-- Coin Tilted -->
    <ellipse cx="125" cy="192" rx="8" ry="4" fill="url(#coin-grad)" transform="rotate(-10 125 192)" />
    
    <!-- Gold sparkles near ground -->
    <circle cx="80" cy="170" r="2" fill="#fef08a" />
    <circle cx="165" cy="165" r="2.5" fill="#fef08a" />
    <path d="M135 160 L138 155 L141 160 L146 163 L141 166 L138 171 L135 166 L130 163 Z" fill="#fbbf24" opacity="0.8" transform="scale(0.5) translate(140, 150)" />
  </g>

  <!-- Dynamic Foreground Motion Blur Elements -->
  <path d="M40 120 L55 128" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <path d="M190 90 L200 95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Frame Border / Vignette Accent -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>