<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient (representing realization/remembrance) -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Moonlight Gradient -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>

    <!-- Thought Bubble Gradient -->
    <linearGradient id="thought-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Room Interior & Atmosphere -->
  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="170" fill="#172033"/>
  <!-- Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#0f172a"/>
  <!-- Floor Wood Line -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#1e293b" stroke-width="2"/>
  <line x1="0" y1="215" x2="240" y2="215" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ambient Light from Lamp -->
  <circle cx="180" cy="80" r="120" fill="url(#lamp-glow)"/>

  <!-- Window on Back Wall with Night Scene -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="45" height="65" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <rect x="4" y="4" width="37" height="57" fill="url(#moonlight)"/>
    <!-- Window Frame Cross -->
    <line x1="22.5" y1="0" x2="22.5" y2="65" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="32.5" x2="45" y2="32.5" stroke="#334155" stroke-width="2"/>
    <!-- Tiny distant stars/moon outside -->
    <circle cx="12" cy="15" r="1.5" fill="#e2e8f0" opacity="0.6"/>
    <circle cx="32" cy="22" r="1" fill="#e2e8f0" opacity="0.4"/>
  </g>

  <!-- Desk & Props -->
  <!-- Desk Surface -->
  <path d="M120 155 L225 155 L215 175 L110 175 Z" fill="#475569" filter="url(#shadow)"/>
  <!-- Desk Front Edge -->
  <rect x="110" y="175" width="115" height="8" rx="2" fill="#334155"/>
  <!-- Desk Legs -->
  <rect x="125" y="183" width="6" height="40" fill="#1e293b"/>
  <rect x="205" y="183" width="6" height="40" fill="#1e293b"/>

  <!-- Desk Lamp -->
  <g transform="translate(190, 115)">
    <ellipse cx="0" cy="40" rx="12" ry="4" fill="#64748b"/>
    <path d="M-2 40 L-1 15 L1 15 L2 40 Z" fill="#94a3b8"/>
    <!-- Lamp Shade & Light Cone -->
    <path d="M-12 15 L12 15 L18 5 L-18 5 Z" fill="#f59e0b"/>
    <path d="M-25 120 L-12 15 L12 15 L25 120 Z" fill="#f59e0b" opacity="0.1"/>
  </g>

  <!-- Unfinished Task / Open Notebook & Pen on Desk -->
  <g transform="translate(130, 150)">
    <polygon points="0,15 35,5 45,20 10,30" fill="#f8fafc"/>
    <polygon points="2,16 35,6 43,19 10,29" fill="#e2e8f0"/>
    <!-- Notebook lines -->
    <line x1="10" y1="18" x2="25" y2="13" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="15" y1="23" x2="30" y2="18" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Fallen pen -->
    <line x1="38" y1="24" x2="52" y2="35" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Thought Bubble / Memory Projection (Visualizing Regret/Missed Opportunity) -->
  <g opacity="0.95">
    <!-- Bubble Trail -->
    <circle cx="85" cy="85" r="5" fill="#334155" filter="url(#shadow)"/>
    <circle cx="72" cy="72" r="8" fill="#334155" filter="url(#shadow)"/>
    
    <!-- Main Thought Cloud -->
    <path d="M 60 55 
             C 40 55, 30 40, 45 25 
             C 40 10, 60 5, 75 15 
             C 90 2, 115 10, 115 30 
             C 130 35, 130 60, 110 70 
             C 95 80, 70 75, 60 55 Z" 
          fill="url(#thought-grad)" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>

    <!-- Content inside Thought Cloud: A warm memory/advice icon (Mom's warm guidance symbol represented abstractly as a loving heart/figure) -->
    <g transform="translate(62, 22)">
      <!-- Mini abstract friendly profile representing the ignored advice/person -->
      <circle cx="16" cy="18" r="8" fill="#fb923c" opacity="0.8"/>
      <path d="M6 36 C6 28, 12 26, 16 26 C20 26, 26 28, 26 36 Z" fill="#fb923c" opacity="0.8"/>
      <!-- Soft warning/care pulse lines -->
      <path d="M35 15 C40 18, 40 28, 35 31" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M41 11 C48 16, 48 30, 41 35" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

  <!-- Main Character: Regretful / Remorseful Person Sitting at Desk -->
  <g transform="translate(50, 95)" filter="url(#shadow)">
    <!-- Chair Back -->
    <rect x="-10" y="-15" width="22" height="75" rx="6" fill="#334155"/>
    <rect x="-6" y="-10" width="14" height="65" rx="4" fill="#1e293b"/>

    <!-- Body / Torso (Slumped forward in remorse) -->
    <path d="M -5 30 C -5 15, 15 5, 35 15 C 50 22, 55 45, 55 60 L -5 60 Z" fill="#3b82f6"/>
    <!-- Collar -->
    <path d="M 12 12 L 22 22 L 32 15" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Slumped Head / Face in Hand Posture -->
    <g transform="translate(30, 0)">
      <!-- Head Shape -->
      <circle cx="0" cy="0" r="16" fill="#fde047"/>
      <!-- Hair (Messy, worried style) -->
      <path d="M -16 -4 C -18 -15, -5 -20, 5 -18 C 15 -16, 18 -8, 16 -2 C 12 -6, 5 -12, -4 -10 C -12 -8, -15 -6, -16 -4 Z" fill="#1e293b"/>

      <!-- Facial Expression: Eyes Closed tightly in regret, downward frown -->
      <!-- Eyebrows angled sharply down in distress -->
      <line x1="-7" y1="-3" x2="-2" y2="-1" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <line x1="2" y1="-1" x2="7" y2="-3" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Tightly Closed Eyes (Arcs) -->
      <path d="M -7 3 C -5 5, -3 5, -2 3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 2 3 C 3 5, 5 5, 7 3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Sad Frown / Mouth -->
      <path d="M -3 10 C -1 8, 1 8, 3 10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Single Tear (Classic emotional regret detail) -->
      <path d="M -2 7 C -4 10, -4 13, -2 13 C 0 13, 0 10, -2 7 Z" fill="#38bdf8"/>

      <!-- Hand Propping Up the Head (Classic pose of deep reflection/regret) -->
      <path d="M -5 18 C -12 15, -15 25, -8 28 C -3 30, 2 25, -2 18 Z" fill="#fde047" filter="url(#shadow)"/>
      <!-- Fingers supporting chin -->
      <circle cx="-6" cy="19" r="3" fill="#facc15"/>
    </g>

    <!-- Arms -->
    <!-- Supporting Arm (Bent elbow on desk) -->
    <path d="M 25 20 C 15 25, -5 35, -15 50" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Other arm resting low -->
    <path d="M 40 30 C 50 45, 50 60, 45 70" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  </g>

</svg>