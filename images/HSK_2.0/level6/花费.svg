<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Structure -->
  <path d="M40 180 L200 180 L200 60 L40 60 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <path d="M40 180 L20 200 L180 200 L200 180 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Renovation Props -->
  <rect x="50" y="140" width="40" height="40" fill="#64748b" rx="2"/>
  <path d="M60 140 L60 120 L80 120 L80 140" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <rect x="150" y="150" width="30" height="30" fill="#94a3b8" rx="2"/>
  <path d="M165 150 L165 130" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Characters -->
  <g transform="translate(100, 100)">
    <!-- Person 1 -->
    <circle cx="-30" cy="20" r="15" fill="#fcd34d"/>
    <path d="M-45 35 L-15 35 L-10 80 L-50 80 Z" fill="#38bdf8"/>
    <path d="M-30 80 L-30 110" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Person 2 -->
    <circle cx="30" cy="20" r="15" fill="#fcd34d"/>
    <path d="M15 35 L45 35 L50 80 L10 80 Z" fill="#ec4899"/>
    <path d="M30 80 L30 110" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Money/Expense Visual -->
  <circle cx="120" cy="50" r="25" fill="#1e293b" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M110 40 L130 60 M130 40 L110 60" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Floating Coins -->
  <circle cx="160" cy="80" r="8" fill="#fbbf24"/>
  <circle cx="175" cy="95" r="6" fill="#fbbf24"/>
  <circle cx="150" cy="105" r="5" fill="#fbbf24"/>
  
  <!-- Paint Bucket -->
  <path d="M180 160 L200 160 L195 190 L185 190 Z" fill="#10b981"/>
  <path d="M182 160 L182 150 L198 150 L198 160" fill="none" stroke="#94a3b8" stroke-width="2"/>
</svg>