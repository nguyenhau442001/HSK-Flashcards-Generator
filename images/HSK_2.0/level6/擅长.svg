<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Background Detail -->
  <rect x="30" y="30" width="180" height="100" rx="10" fill="#334155" opacity="0.5"/>
  <circle cx="180" cy="60" r="15" fill="#fbbf24"/>
  
  <!-- Easel -->
  <path d="M70 200 L90 120 L110 200 M60 190 L120 190" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <rect x="65" y="110" width="60" height="80" rx="4" fill="#f8fafc"/>
  
  <!-- The Painting (Abstract landscape) -->
  <path d="M75 130 Q95 120 115 130 L115 170 Q95 180 75 170 Z" fill="#38bdf8"/>
  <path d="M75 170 Q95 160 115 170" fill="#10b981"/>
  
  <!-- Character -->
