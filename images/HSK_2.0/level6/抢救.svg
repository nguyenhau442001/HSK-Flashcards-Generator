<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Hospital Bed -->
  <rect x="40" y="140" width="160" height="20" rx="4" fill="#64748b"/>
  <rect x="50" y="160" width="10" height="30" fill="#475569"/>
  <rect x="180" y="160" width="10" height="30" fill="#475569"/>
  
  <!-- Patient -->
  <ellipse cx="120" cy="130" rx="30" ry="15" fill="#f1f5f9"/>
  <rect x="90" y="130" width="60" height="10" fill="#f1f5f9"/>
  
  <!-- Doctor -->
  <g transform="translate(150, 80)">
    <circle cx="10" cy="10" r="12" fill="#fbbf24"/>
    <rect x="0" y="22" width="20" height="40" rx="4" fill="#38bdf8"/>
    <path d="M 5 30 L -10 50 M 25 30 L 40 50" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Medical Equipment (Monitor) -->
  <rect x="40" y="60" width="50" height="40" rx="4" fill="#334155" stroke="#10b981" stroke-width="2"/>
  <path d="M 45 80 L 55 70 L 65 90 L 75 65 L 85 80" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- IV Stand -->
  <line x1="190" y1="140" x2="190" y2="60" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="190" cy="60" r="4" fill="#ec4899"/>
  <path d="M 190 60 L 160 80" stroke="#ec4899" stroke-width="2"/>
  
  <!-- Action Glows -->
  <circle cx="160" cy="90" r="20" fill="#fb923c" opacity="0.2"/>
  <circle cx="160" cy="90" r="10" fill="#fb923c" opacity="0.4"/>
</svg>