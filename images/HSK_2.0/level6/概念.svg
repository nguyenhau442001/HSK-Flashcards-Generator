<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155" opacity="0.4"/>
  
  <!-- The "Concept" - A glowing lightbulb idea emerging from an open book -->
  <g transform="translate(120, 130)">
    <!-- Book -->
    <path d="M-60 0 L60 0 L50 40 L-50 40 Z" fill="#64748b"/>
    <path d="M-50 40 L50 40 L40 60 L-40 60 Z" fill="#475569"/>
    <path d="M-55 5 L55 5 L45 35 L-45 35 Z" fill="#cbd5e1"/>
    
    <!-- Lightbulb Base -->
    <path d="M-10 -10 L10 -10 L8 0 L-8 0 Z" fill="#94a3b8"/>
    
    <!-- Glowing Bulb -->
    <circle cx="0" cy="-45" r="35" fill="#f59e0b" opacity="0.2"/>
    <circle cx="0" cy="-45" r="25" fill="#fbbf24"/>
    
    <!-- Inner Filament/Spark -->
    <path d="M-5 -40 L5 -40 L0 -55 Z" fill="#fff"/>
    
    <!-- Floating particles representing abstract thoughts -->
    <circle cx="-40" cy="-80" r="4" fill="#38bdf8"/>
    <circle cx="45" cy="-70" r="3" fill="#10b981"/>
    <circle cx="30" cy="-100" r="5" fill="#ec4899"/>
    <circle cx="-35" cy="-110" r="3" fill="#fb923c"/>
  </g>
  
  <!-- Ambient lighting/depth -->
  <ellipse cx="120" cy="190" rx="70" ry="15" fill="#000" opacity="0.3"/>
</svg>