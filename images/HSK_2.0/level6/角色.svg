<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="woodFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="scriptGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Stage Backdrops & Interior Elements -->
  <g id="environment">
    <!-- Back wall details / Sound baffles or curtains -->
    <rect x="20" y="30" width="30" height="120" rx="4" fill="#1b253b" opacity="0.6"/>
    <rect x="190" y="30" width="30" height="120" rx="4" fill="#1b253b" opacity="0.6"/>
    <path d="M 50 40 L 190 40" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 50 80 L 190 80" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Spotlight Cone from Ceiling -->
    <polygon points="120,0 60,190 180,190" fill="url(#spotlight)" style="mix-blend-mode: screen;"/>
    <ellipse cx="120" cy="185" rx="60" ry="15" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

    <!-- Wooden Stage Floor -->
    <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#woodFloor)"/>
    <line x1="0" y1="185" x2="240" y2="185" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="205" x2="240" y2="205" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="0" y1="225" x2="240" y2="225" stroke="#1e293b" stroke-width="1.5"/>
  </g>

  <!-- Context Props: Director Chair & Script with complex notes -->
  <g id="props" transform="translate(15, 135)">
    <!-- Director's Chair -->
    <path d="M15 15 L25 55 M35 15 L25 55" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <rect x="10" y="10" width="30" height="18" rx="3" fill="#334155"/>
    <rect x="5" y="30" width="40" height="12" rx="3" fill="#334155"/>
    <line x1="12" y1="52" x2="6" y2="75" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="52" x2="44" y2="75" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="52" x2="28" y2="75" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="52" x2="22" y2="75" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

    <!-- Coffee Mug on Floor -->
    <rect x="52" y="62" width="10" height="12" rx="2" fill="#cbd5e1"/>
    <path d="M 62 65 C 65 65, 65 70, 62 71" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Main Character: Actor grappling with a difficult role -->
  <g id="actor" transform="translate(90, 65)">
    <!-- Drop Shadow on Floor -->
    <ellipse cx="30" cy="115" rx="28" ry="8" fill="#020617" opacity="0.6"/>

    <!-- Body & Costume (Dramatic/Theatrical Outfit) -->
    <!-- Legs in dynamic, tense pose -->
    <path d="M 22 80 L 15 110 L 8 112" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 38 80 L 45 105 L 52 107" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoes -->
    <path d="M 4 115 L 12 112" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <path d="M 48 109 L 55 107" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

    <!-- Torso (Leaning forward slightly, stressed posture) -->
    <path d="M 18 45 L 42 45 L 38 82 L 22 82 Z" fill="#334155" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Costume detail (Collar / scarf) -->
    <path d="M 22 45 L 30 58 L 38 45" fill="#f59e0b"/>

    <!-- Left Arm holding head (Showing difficulty/frustration) -->
    <path d="M 20 48 L 5 40 L 22 30" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm holding script -->
    <path d="M 38 50 L 52 65 L 65 58" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- The Difficult Script / Prop in Hand -->
    <g transform="translate(58, 48) rotate(15)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="4" y1="6" x2="14" y2="6" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="11" x2="18" y2="11" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="16" x2="12" y2="16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="21" x2="16" y2="21" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Red correction marks (showing 'hard/difficult' nature of the role) -->
      <path d="M 14 23 L 18 26 M 18 23 L 14 26" stroke="#ef4444" stroke-width="1.5"/>
    </g>

    <!-- Head and Expressive Face (Tense, furrowed brow, deep thought) -->
    <g transform="translate(25, 22)">
      <!-- Neck -->
      <rect x="4" y="16" width="10" height="8" fill="#fbcfe8" rx="2"/>

      <!-- Head Base -->
      <circle cx="9" cy="8" r="14" fill="#fbcfe8"/>
      <path d="M -2 4 C -2 -4, 2 -8, 9 -8 C 16 -8, 20 -4, 20 4 C 20 8, 18 12, 18 12 L 0 12 C 0 12, -2 8, -2 4 Z" fill="#1e293b"/> <!-- Stylish dark hair -->

      <!-- Furrowed Brow & Concentrated Eyes (Expressing 'Hard/Difficult' emotion) -->
      <line x1="3" y1="4" x2="9" y2="7" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      <line x1="9" y1="7" x2="15" y2="4" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      <circle cx="5" cy="9" r="1.5" fill="#0f172a"/>
      <circle cx="13" cy="9" r="1.5" fill="#0f172a"/>

      <!-- Worried Mouth / Biting lip -->
      <path d="M 7 14 Q 9 12 11 14" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- Sweat Drop (Symbolizing intense mental effort/difficulty) -->
      <path d="M 18 2 C 18 2, 21 6, 21 8 C 21 9.6, 19.6 11, 18 11 C 16.4 11, 15 9.6, 15 8 C 15 6, 18 2, 18 2 Z" fill="#38bdf8" opacity="0.9"/>
    </g>
  </g>

  <!-- Dramatic Atmosphere Particles (Golden ambient lights & floating dust) -->
  <g id="atmosphere" fill="#fbbf24">
    <circle cx="50" cy="90" r="1.5" opacity="0.6"/>
    <circle cx="70" cy="50" r="1" opacity="0.4"/>
    <circle cx="180" cy="70" r="2" opacity="0.5"/>
    <circle cx="195" cy="130" r="1" opacity="0.7"/>
    <circle cx="40" cy="140" r="1.5" opacity="0.5"/>
    <circle cx="110" cy="40" r="2" opacity="0.3"/>
  </g>

  <!-- Framing / Vignette Overlay for App Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
</svg>