<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Workbench Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Blue Beam Gradient -->
    <linearGradient id="holoBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Robot Body Gradient -->
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Accent Orange Gradient -->
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Drafting Grid & Particles) -->
  <g opacity="0.15">
    <path d="M 0,60 H 240 M 0,120 H 240 M 0,180 H 240" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 4" />
    <path d="M 60,0 V 240 M 120,0 V 240 M 180,0 V 240" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 4" />
  </g>
  
  <!-- Glowing Background Orbs representing Innovation -->
  <circle cx="120" cy="90" r="50" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="160" cy="110" r="30" fill="#fbbf24" opacity="0.08" filter="url(#glow)" />

  <!-- Workbench / Desk Surface -->
  <path d="M 20,185 L 220,185 L 235,220 L 5,220 Z" fill="url(#deskGrad)" filter="url(#softShadow)" />
  <!-- Desk Edge Highlight -->
  <path d="M 20,185 L 220,185" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <path d="M 35,195 L 205,195" stroke="#0f172a" stroke-width="1.5" opacity="0.6" />

  <!-- Environmental Props on Workbench -->
  <!-- Blueprint scroll -->
  <g transform="translate(35, 175) rotate(-10)">
    <rect x="0" y="0" width="35" height="15" rx="3" fill="#e2e8f0" />
    <path d="M 5,3 H 30 M 5,7 H 25" stroke="#64748b" stroke-width="1" stroke-linecap="round" />
  </g>
  <!-- Coffee Mug -->
  <g transform="translate(185, 168)">
    <rect x="0" y="0" width="16" height="18" rx="3" fill="#cbd5e1" />
    <path d="M 16,4 C 20,4 20,12 16,12" stroke="#cbd5e1" stroke-width="2.5" fill="none" />
    <path d="M 4,4 H 12" stroke="#94a3b8" stroke-width="1" />
    <!-- Steam -->
    <path d="M 6,-2 C 8,-5 6,-7 8,-10" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Holographic Upgrade Display Beam -->
  <path d="M 90,140 L 80,75 L 160,75 L 150,140 Z" fill="url(#holoBeam)" />
  <ellipse cx="120" cy="75" rx="40" ry="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />

  <!-- Main Subject: The Evolving Mechanical Device / Smart Gadget (Improvement / 改进 in action) -->
  <!-- Floating Hologram Version (Improved Model) -->
  <g transform="translate(0, -15)" filter="url(#softShadow)">
    <!-- Base Platform -->
    <ellipse cx="120" cy="142" rx="32" ry="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Central Floating Core -->
    <g transform="translate(120, 115)">
      <!-- Outer Rotating Rings -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 4" opacity="0.8" />
      <circle cx="0" cy="0" r="27" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.5" />
      
      <!-- Core Crystal / Device Body -->
      <polygon points="0,-16 14,8 -14,8" fill="url(#accentOrange)" filter="url(#glow)" />
      <polygon points="0,-12 10,6 -10,6" fill="#fef08a" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
      
      <!-- Floating Upgrade Data Nodes / Sparkles -->
      <circle cx="-25" cy="-10" r="3" fill="#38bdf8" />
      <circle cx="28" cy="-5" r="2" fill="#10b981" />
      <circle cx="18" cy="20" r="2.5" fill="#fb923c" />
      
      <!-- Energy connection lines -->
      <path d="M -15,-5 L -25,-10 M 15,0 L 28,-5 M 10,12 L 18,20" stroke="#38bdf8" stroke-width="1" opacity="0.7" />
    </g>
  </g>

  <!-- The Robot Engineer / Character improving the device -->
  <g transform="translate(0, 5)">
    <!-- Robot Torso -->
    <rect x="95" y="145" width="50" height="42" rx="12" fill="url(#robotBody)" filter="url(#softShadow)" />
    <!-- Chest Screen / Gauge (Green positive indicator for improvement) -->
    <rect x="105" y="155" width="30" height="20" rx="6" fill="#0f172a" />
    <!-- Upward Trend Graph on Screen -->
    <path d="M 111,168 L 117,163 L 123,165 L 131,158" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="131" cy="158" r="2" fill="#10b981" />

    <!-- Robot Arms interacting / building -->
    <!-- Left Arm holding a glowing tool -->
    <path d="M 95,155 C 80,155 70,140 75,130" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="75" cy="128" r="5" fill="url(#accentOrange)" filter="url(#glow)" />
    <path d="M 75,128 L 75,115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Right Arm pointing / adjusting -->
    <path d="M 145,155 C 160,155 165,140 160,130" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="160" cy="128" r="4" fill="#38bdf8" />

    <!-- Robot Neck -->
    <rect x="114" y="136" width="12" height="11" rx="3" fill="#64748b" />

    <!-- Robot Head -->
    <g transform="translate(120, 115)">
      <rect x="-22" y="-18" width="44" height="32" rx="12" fill="url(#robotBody)" filter="url(#softShadow)" />
      
      <!-- Visor Screen -->
      <rect x="-17" y="-12" width="34" height="18" rx="8" fill="#0f172a" />
      
      <!-- Expressive Digital Eyes (Happy / Focused) -->
      <circle cx="-7" cy="-3" r="3.5" fill="#38bdf8" />
      <circle cx="7" cy="-3" r="3.5" fill="#38bdf8" />
      <path d="M -9,-8 C -7,-10 -5,-8 -5,-8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 5,-8 C 7,-10 9,-8 9,-8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

      <!-- Antenna -->
      <line x1="0" y1="-18" x2="0" y2="-26" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="-28" r="4" fill="#fbbf24" filter="url(#glow)" />
    </g>
  </g>

  <!-- Foreground Dynamic Elements (Upgrade Sparks & Action Effects) -->
  <g transform="translate(120, 105)">
    <!-- Upward Sparkles / Progress Indicators -->
    <path d="M -40,-20 L -30,-35 L -20,-20" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <path d="M 20,-20 L 30,-35 L 40,-20" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    
    <!-- Floating Plus / Upgrade Indicators -->
    <g transform="translate(-50, 10)" fill="#10b981">
      <rect x="-4" y="-1" width="8" height="2" rx="1" />
      <rect x="-1" y="-4" width="2" height="8" rx="1" />
    </g>
    <g transform="translate(52, 5)" fill="#38bdf8">
      <rect x="-4" y="-1" width="8" height="2" rx="1" />
      <rect x="-1" y="-4" width="2" height="8" rx="1" />
    </g>
  </g>

  <!-- Framing / Vignette Overlay for Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>