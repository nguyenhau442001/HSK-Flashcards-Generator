<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Friendship/Sincerity -->
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradients (Friendly gesture) -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Character 2 Gradients (Receiving sincere care) -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Table & Prop Gradients -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <!-- Heart Glow Gradient -->
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting & Ambient Elements -->
  <circle cx="120" cy="110" r="90" fill="url(#warmGlow)"/>
  
  <!-- Cozy Cafe/Home Interior Background Details -->
  <!-- Window/Light frame -->
  <path d="M40 50 L100 35 L100 130 L40 145 Z" fill="#1e293b" opacity="0.3"/>
  <circle cx="180" cy="50" r="16" fill="#fbbf24" opacity="0.15"/>
  <path d="M170 80 Q180 70 190 80 T210 80" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.2" fill="none"/>

  <!-- Floating Sincerity Emblems (Warm golden sparkles & gentle hearts) -->
  <circle cx="120" cy="65" r="3" fill="#fbbf24" opacity="0.8"/>
  <path d="M118 63 C118 61, 122 61, 122 63 C122 65, 118 67, 118 67 C118 67, 114 65, 114 63 C114 61, 118 61, 118 63 Z" fill="#fbbf24" transform="translate(2, -2) scale(0.6)" opacity="0.6"/>
  
  <circle cx="75" cy="85" r="2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="155" cy="95" r="2.5" fill="#f43f5e" opacity="0.8"/>

  <!-- Central Heart Emitting Sincerity -->
  <circle cx="120" cy="100" r="35" fill="url(#heartGlow)"/>
  <path d="M120 90 C120 86, 114 80, 107 80 C101 80, 96 85, 96 92 C96 101, 108 110, 120 118 C132 110, 144 101, 144 92 C144 85, 139 80, 133 80 C126 80, 120 86, 120 90 Z" fill="#f43f5e" opacity="0.9"/>
  <!-- Sparkle on heart -->
  <path d="M120 85 L121.5 88 L124.5 89.5 L121.5 91 L120 94 L118.5 91 L115.5 89.5 L118.5 88 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Table Surface -->
  <path d="M20 175 L220 175 L205 210 L35 210 Z" fill="url(#tableGrad)"/>
  <path d="M20 175 L220 175 L220 179 L20 179 Z" fill="#475569" opacity="0.6"/>

  <!-- Foreground Tableware / Props -->
  <!-- Teapot -->
  <path d="M108 160 C108 153, 112 150, 120 150 C128 150, 132 153, 132 160 L134 180 L106 180 Z" fill="#cbd5e1"/>
  <path d="M120 146 L120 150" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M106 165 Q98 162 100 157" stroke="#cbd5e1" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M132 165 Q140 162 138 157" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Teacup 1 -->
  <ellipse cx="80" cy="170" rx="9" ry="4" fill="#94a3b8"/>
  <path d="M71 170 L73 182 C73 184, 87 184, 89 182 L91 170 Z" fill="#e2e8f0"/>
  <ellipse cx="80" cy="171" rx="7" ry="2.5" fill="url(#teaGrad)"/>
  <!-- Teacup 2 -->
  <ellipse cx="155" cy="170" rx="9" ry="4" fill="#94a3b8"/>
  <path d="M146 170 L148 182 C148 184, 162 184, 164 182 L166 170 Z" fill="#e2e8f0"/>
  <ellipse cx="155" cy="171" rx="7" ry="2.5" fill="url(#teaGrad)"/>


  <!-- Character Left (Giving Sincere Treatment / Care) -->
  <g id="character-left">
    <!-- Body & Torso -->
    <path d="M45 185 C45 155, 65 145, 80 145 C95 145, 115 155, 115 185 Z" fill="url(#shirt1)"/>
    <!-- Collar -->
    <path d="M68 145 L80 156 L92 145 Z" fill="#e0f2fe"/>
    
    <!-- Head & Hair -->
    <circle cx="80" cy="115" r="18" fill="url(#skin1)"/>
    <!-- Hair Dark Navy/Brown -->
    <path d="M63 115 C63 100, 72 96, 80 96 C88 96, 97 100, 97 115 C97 120, 95 110, 90 106 C85 102, 75 102, 70 106 C65 110, 63 120, 63 115 Z" fill="#334155"/>
    
    <!-- Expressive Face (Warm, sincere smile) -->
    <!-- Eyes (Happy arcs) -->
    <path d="M73 114 Q76 111 79 114" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M83 114 Q86 111 89 114" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Cheeks (Blush) -->
    <circle cx="74" cy="118" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="88" cy="118" r="3" fill="#f43f5e" opacity="0.3"/>
    <!-- Smile -->
    <path d="M77 121 Q80 124 83 121" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Hand Reaching Out in Warm Gesture -->
    <path d="M95 155 Q110 150 115 140 Q118 135 114 133 Q110 131 107 137 Q100 145 92 148 Z" fill="url(#skin1)"/>
  </g>


  <!-- Character Right (Receiving and Appreciating the Sincere Treatment) -->
  <g id="character-right">
    <!-- Body & Torso -->
    <path d="M125 185 C125 155, 145 145, 160 145 C175 145, 195 155, 195 185 Z" fill="url(#shirt2)"/>
    <!-- Collar -->
    <path d="M148 145 L160 156 L172 145 Z" fill="#d1fae5"/>

    <!-- Head & Hair -->
    <circle cx="160" cy="115" r="18" fill="url(#skin1)"/>
    <!-- Hair Warm Brown -->
    <path d="M143 115 C143 98, 152 95, 160 95 C168 95, 177 98, 177 115 C177 122, 173 110, 168 106 C163 102, 157 102, 152 106 C147 110, 143 122, 143 115 Z" fill="#475569"/>

    <!-- Expressive Face (Touched, joyful expression) -->
    <!-- Eyes (Sparkling curved joy) -->
    <path d="M153 114 Q156 111 159 114" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M163 114 Q166 111 169 114" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Cheeks (Blush) -->
    <circle cx="154" cy="118" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="168" cy="118" r="3" fill="#f43f5e" opacity="0.4"/>
    <!-- Open Happy Smile -->
    <path d="M157 121 Q160 125 163 121" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Hands Together in Mutual Respect / Appreciation -->
    <path d="M145 155 Q135 150 130 140 Q127 135 131 133 Q135 131 138 137 Q142 143 148 148 Z" fill="url(#skin1)"/>
  </g>

  <!-- Dynamic Action/Connection Lines (Showing interaction and positive treatment) -->
  <path d="M105 130 Q120 115 135 130" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.8"/>
  <path d="M110 123 Q120 110 130 123" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.8"/>

</svg>