<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stage Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drama Mask Gradient -->
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Stage Background / Curtain Environment -->
  <g id="stage-bg">
    <!-- Back wall shading -->
    <rect x="20" y="20" width="200" height="180" rx="16" fill="#111827" />
    
    <!-- Curtains Left -->
    <path d="M20 20 L50 20 L35 220 L20 220 Z" fill="#331824" opacity="0.8"/>
    <path d="M50 20 L75 20 L55 220 L35 220 Z" fill="#4c1d33" opacity="0.9"/>
    
    <!-- Curtains Right -->
    <path d="M220 20 L190 20 L205 220 L220 220 Z" fill="#331824" opacity="0.8"/>
    <path d="M190 20 L165 20 L185 220 L205 220 Z" fill="#4c1d33" opacity="0.9"/>

    <!-- Wooden Stage Floor -->
    <rect x="20" y="195" width="200" height="25" fill="#090d16" />
    <path d="M20 195 L220 195" stroke="#1e293b" stroke-width="2"/>
    <line x1="60" y1="195" x2="40" y2="220" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="195" x2="100" y2="220" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
    <line x1="180" y1="195" x2="160" y2="220" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Atmospheric Spotlight Cone -->
  <polygon points="120,20 10,210 230,210" fill="url(#spotlight)" style="mix-blend-mode: screen;" />

  <!-- Stage Props & Context -->
  <g id="props">
    <!-- Vintage Floor Spotlight (Right) -->
    <circle cx="185" cy="190" r="10" fill="#475569"/>
    <circle cx="185" cy="190" r="7" fill="#fbbf24"/>
    <path d="M180 200 L190 200 L195 210 L175 210 Z" fill="#334155"/>

    <!-- Floating Theatrical Mask Props (representing exaggerated acting) -->
    <!-- Comedy Mask (Left floating) -->
    <g transform="translate(65, 75) rotate(-15)">
      <ellipse cx="0" cy="0" rx="12" ry="16" fill="url(#maskGrad)" />
      <!-- Exaggerated open smile -->
      <path d="M-6 4 Q0 12 6 4 Q0 8 -6 4" fill="#78350f" />
      <circle cx="-4" cy="-3" r="2" fill="#78350f" />
      <circle cx="4" cy="-3" r="2" fill="#78350f" />
    </g>

    <!-- Tragedy Mask (Right floating) -->
    <g transform="translate(175, 80) rotate(15)">
      <ellipse cx="0" cy="0" rx="12" ry="16" fill="url(#maskGrad)" />
      <!-- Exaggerated sad mouth -->
      <path d="M-5 8 Q0 2 5 8" fill="none" stroke="#78350f" stroke-width="2" />
      <circle cx="-4" cy="-3" r="2" fill="#78350f" />
      <circle cx="4" cy="-3" r="2" fill="#78350f" />
    </g>
  </g>

  <!-- Main Character: Exaggerated Actor -->
  <g id="actor">
    <!-- Dynamic Shadow on stage -->
    <ellipse cx="120" cy="205" rx="35" ry="6" fill="#000000" opacity="0.5"/>

    <!-- Left Leg (Kicked back dramatically for exaggerated pose) -->
    <path d="M105 160 L80 185 L70 180" fill="none" stroke="url(#pantsGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Leg (Planted firmly) -->
    <path d="M130 160 L140 195 L150 195" fill="none" stroke="url(#pantsGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoes -->
    <path d="M62 178 Q72 178 75 183 L70 185 Z" fill="#0f172a"/>
    <ellipse cx="150" cy="196" rx="8" ry="4" fill="#0f172a"/>

    <!-- Dramatic Torso (Twisted/Dynamic) -->
    <path d="M100 110 L140 115 L135 165 L105 160 Z" fill="url(#suitGrad)" />
    <!-- Fancy Actor's Collar / Lapels -->
    <path d="M110 110 L120 130 L130 110" fill="#f8fafc" />
    <polygon points="120,112 117,125 123,125" fill="#38bdf8"/>

    <!-- Left Arm (Flung wide & high for dramatic gesture) -->
    <path d="M105 115 L75 95 L55 80" fill="none" stroke="url(#suitGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Hand with flair -->
    <circle cx="51" cy="77" r="4" fill="#fb923c"/>

    <!-- Right Arm (Extended forward dramatically) -->
    <path d="M135 120 L165 130 L185 125" fill="none" stroke="url(#suitGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Hand pointing/expressing -->
    <circle cx="189" cy="124" r="4" fill="#fb923c"/>

    <!-- Neck -->
    <rect x="113" y="98" width="14" height="15" fill="#fcd34d" rx="4"/>

    <!-- Head & Expressive Face (Exaggerated pose: Head tilted way back, mouth wide open in theatrical delivery) -->
    <g transform="translate(120, 85)">
      <!-- Hair (Stylized actor hair) -->
      <path d="M-13 -8 Q0 -22 14 -8 Q18 2 12 10 Q0 6 -12 10 Q-18 2 -13 -8 Z" fill="#1e293b"/>
      
      <!-- Face Base -->
      <ellipse cx="0" cy="2" rx="12" ry="14" fill="#fcd34d"/>

      <!-- Exaggerated Open Mouth (Singing/Shouting dramatically) -->
      <path d="M-4 6 Q0 14 4 6 Q0 4 -4 6" fill="#78350f"/>
      <ellipse cx="0" cy="8" rx="2.5" ry="1.5" fill="#f8fafc"/> <!-- teeth -->

      <!-- Dramatic Expressive Eyes (Wide, arched brows) -->
      <path d="M-8 -3 Q-4 -7 0 -3" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M2 -3 Q6 -7 10 -3" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-4" cy="-1" r="1.5" fill="#1e293b"/>
      <circle cx="6" cy="-1" r="1.5" fill="#1e293b"/>

      <!-- Rosy Cheeks for performance energy -->
      <circle cx="-8" cy="3" r="2.5" fill="#ec4899" opacity="0.5"/>
      <circle cx="10" cy="3" r="2.5" fill="#ec4899" opacity="0.5"/>
    </g>
  </g>

  <!-- Musical / Theatrical Sparkles / Energy Waves (Accentuate the "over-the-top" performance) -->
  <g id="sparkles">
    <path d="M 40 50 Q 45 40 55 45 Q 45 50 40 60 Q 35 50 25 45 Q 35 40 40 50 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M 200 65 Q 203 58 210 61 Q 203 64 200 71 Q 197 64 190 61 Q 197 58 200 65 Z" fill="#38bdf8" opacity="0.8"/>
    <circle cx="165" cy="55" r="3" fill="#ec4899" opacity="0.9"/>
    <circle cx="75" cy="115" r="2" fill="#fbbf24" opacity="0.7"/>
    <circle cx="150" cy="90" r="2.5" fill="#38bdf8" opacity="0.7"/>
  </g>
</svg>