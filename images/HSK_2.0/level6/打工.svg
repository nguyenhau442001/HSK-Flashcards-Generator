<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Cafe Window/Interior Glow -->
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.0" />
    </linearGradient>

    <!-- Coffee Counter Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Espresso Machine Metal -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment: Cafe Wall & Shelves -->
  <path d="M0 0 H240 V150 H0 Z" fill="#1e293b" />
  <!-- Ambient Wall Lighting -->
  <ellipse cx="120" cy="40" rx="80" ry="30" fill="url(#warmGlow)" />

  <!-- Shelf 1 -->
  <rect x="25" y="45" width="70" height="4" rx="2" fill="#334155" />
  <!-- Coffee Bean Jar on Shelf -->
  <rect x="35" y="25" width="20" height="20" rx="4" fill="#475569" />
  <rect x="38" y="20" width="14" height="5" rx="2" fill="#64748b" />
  <path d="M40 32 H50 M40 37 H48" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  
  <!-- Syrup Bottles -->
  <path d="M68 27 h8 v18 h-8 z" fill="#fb923c" rx="2" />
  <path d="M70 23 h4 v4 h-4 z" fill="#cbd5e1" />
  <path d="M80 30 h7 v15 h-7 z" fill="#ec4899" rx="2" />
  <path d="M82 27 h3 v3 h-3 z" fill="#cbd5e1" />

  <!-- Hanging Menu Board -->
  <rect x="130" y="20" width="80" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <line x1="140" y1="30" x2="180" y2="30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <line x1="140" y1="40" x2="200" y2="40" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="140" y1="50" x2="175" y2="50" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Professional Espresso Machine (Background Prop) -->
  <rect x="145" y="85" width="65" height="65" rx="6" fill="url(#metalGrad)" />
  <rect x="155" y="95" width="45" height="25" rx="3" fill="#0f172a" />
  <!-- Glowing machine panel lights -->
  <circle cx="165" cy="103" r="2" fill="#38bdf8" />
  <circle cx="173" cy="103" r="2" fill="#10b981" />
  <!-- Steam Wand -->
  <path d="M210 100 C220 100, 220 130, 205 135" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
  <!-- Portafilter -->
  <path d="M165 120 H185 L190 135 H160 Z" fill="#334155" />
  <line x1="190" y1="127" x2="202" y2="127" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

  <!-- Foreground/Midground: Wooden Counter -->
  <path d="M0 150 H240 V240 H0 Z" fill="url(#woodGrad)" />
  <!-- Counter Top Highlight -->
  <rect x="0" y="150" width="240" height="6" fill="#f59e0b" opacity="0.4" />

  <!-- Character: Part-time Worker / Barista (Actively Pouring/Working) -->
  <g id="worker-character" filter="url(#shadow)">
    <!-- Apron Straps (Back/Shoulders) -->
    <path d="M85 95 L105 125 M115 95 L95 125" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />

    <!-- Torso (Green Uniform Tee) -->
    <path d="M75 90 C75 90 85 80 100 80 C115 80 125 90 125 90 L120 145 H80 Z" fill="#059669" />

    <!-- Blue Apron Main Body -->
    <path d="M82 105 H118 V200 H82 Z" fill="#0284c7" rx="6" />
    <!-- Apron Pocket -->
    <rect x="91" y="140" width="18" height="16" rx="3" fill="#0369a1" />
    <line x1="95" y1="146" x2="105" y2="146" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Head and Face -->
    <!-- Neck -->
    <rect x="91" y="72" width="18" height="15" fill="#fbcfe8" />

    <!-- Head Base -->
    <circle cx="100" cy="60" r="18" fill="#fbcfe8" />

    <!-- Hair (Stylized Anime/Modern Casual Cut - Dark Brown) -->
    <path d="M82 55 C82 45, 95 40, 108 42 C118 44, 120 55, 120 60 C120 60, 115 48, 100 48 C85 48, 82 55, 82 55 Z" fill="#292524" />
    <path d="M84 55 L80 65 L88 62 Z" fill="#292524" />
    <path d="M116 55 L121 63 L113 61 Z" fill="#292524" />

    <!-- Friendly Concentrated Face Expression -->
    <!-- Eyebrows (Focused/Determined) -->
    <path d="M89 56 L95 58" stroke="#1c1917" stroke-width="2" stroke-linecap="round" />
    <path d="M105 58 L111 56" stroke="#1c1917" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes (Happy / Focused) -->
    <circle cx="92" cy="62" r="2" fill="#1c1917" />
    <circle cx="108" cy="62" r="2" fill="#1c1917" />
    <!-- Cheeks (Blush) -->
    <circle cx="90" cy="66" r="3" fill="#fda4af" opacity="0.6" />
    <circle cx="110" cy="66" r="3" fill="#fda4af" opacity="0.6" />
    <!-- Smile -->
    <path d="M96 68 Q100 72 104 68" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" />

    <!-- Left Arm (Reaching/Working) -->
    <path d="M78 95 C60 100, 50 120, 55 135" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" />
    <!-- Left Hand -->
    <circle cx="55" cy="138" r="6" fill="#fbcfe8" />

    <!-- Right Arm (Active Pouring Motion) -->
    <path d="M122 95 C135 100, 145 115, 135 130" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" />
    <!-- Right Hand -->
    <circle cx="132" cy="133" r="6" fill="#fbcfe8" />
  </g>

  <!-- Foreground Props on Counter (Action Context) -->
  <!-- Coffee Pitcher being held / poured -->
  <g id="pitcher-and-cup">
    <!-- Ceramic Coffee Mug on Saucer -->
    <circle cx="70" cy="175" r="16" fill="#94a3b8" />
    <circle cx="70" cy="175" r="13" fill="#f8fafc" />
    <!-- Coffee Inside (Latte Art Base) -->
    <ellipse cx="70" cy="175" rx="10" ry="8" fill="#78350f" />
    <path d="M66 175 Q70 170 74 175 Q70 180 66 175 Z" fill="#fef3c7" />
    <!-- Mug Handle -->
    <path d="M83 170 C88 170, 88 180, 83 182" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

    <!-- Stainless Steel Milk Pitcher / Pourer -->
    <path d="M120 125 L145 130 L140 160 C140 165, 125 165, 125 160 Z" fill="url(#metalGrad)" />
    <!-- Pitcher Handle -->
    <path d="M119 133 C110 133, 110 150, 123 152" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Pouring Stream (Action Line: Milk/Coffee flowing into cup) -->
    <path d="M130 130 Q105 145 75 168" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <path d="M128 128 Q103 143 73 166" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Additional Action / Atmosphere Elements -->
  <!-- Steam wisps rising from the cup -->
  <path d="M66 158 Q63 150 68 142 Q73 134 67 126" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M74 160 Q77 152 73 144 Q69 136 75 128" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Cash Register / POS Terminal on the right -->
  <g id="pos-terminal" transform="translate(165, 140)">
    <!-- Base -->
    <rect x="0" y="15" width="45" height="25" rx="4" fill="#334155" />
    <!-- Screen Angle -->
    <path d="M5 15 L12 0 H40 L35 15 Z" fill="#475569" />
    <!-- Screen Display -->
    <rect x="12" y="3" width="23" height="10" rx="1" fill="#38bdf8" />
    <!-- Receipt Printer Slot & Paper -->
    <rect x="8" y="18" width="12" height="4" rx="1" fill="#1e293b" />
    <path d="M25 18 L28 10 L33 10 L30 18 Z" fill="#f8fafc" />
    <!-- Buttons -->
    <circle cx="10" cy="27" r="2" fill="#64748b" />
    <circle cx="17" cy="27" r="2" fill="#64748b" />
    <circle cx="24" cy="27" r="2" fill="#64748b" />
    <circle cx="10" cy="33" r="2" fill="#64748b" />
    <circle cx="17" cy="33" r="2" fill="#64748b" />
    <circle cx="24" cy="33" r="2" fill="#10b981" />
  </g>

  <!-- Small Plant for warm cozy shop vibe (Left foreground) -->
  <g id="small-plant" transform="translate(15, 185)">
    <!-- Pot -->
    <path d="M5 15 H25 L22 35 H8 Z" fill="#cbd5e1" />
    <!-- Soil -->
    <ellipse cx="15" cy="15" rx="10" ry="3" fill="#78350f" />
    <!-- Leaves -->
    <path d="M15 15 Q10 5 2 2 Q10 10 15 15 Z" fill="#10b981" />
    <path d="M15 15 Q20 2 28 0 Q22 8 15 15 Z" fill="#059669" />
    <path d="M15 15 Q15 0 15 -5 Q15 5 15 15 Z" fill="#34d399" />
  </g>

  <!-- Dynamic lighting highlight overlays -->
  <circle cx="100" cy="90" r="50" fill="#ffffff" opacity="0.03" pointer-events="none" />
</svg>