<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Projector Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Auditorium Architecture / Ambient Details -->
  <!-- Subtle back wall paneling -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="30" y="20" width="180" height="150" rx="12" fill="#1e293b" fill-opacity="0.4" filter="url(#shadow)"/>

  <!-- PROJECTOR & BEAM -->
  <g id="projector-system">
    <!-- Ceiling Mount -->
    <rect x="115" y="10" width="10" height="12" fill="#475569" rx="2"/>
    <!-- Projector Body -->
    <rect x="100" y="22" width="40" height="18" rx="4" fill="#64748b" filter="url(#shadow)"/>
    <circle cx="130" cy="31" r="5" fill="#0f172a"/>
    <circle cx="130" cy="31" r="3" fill="#38bdf8"/>
    <!-- Light Beam -->
    <polygon points="128,40 25,145 215,145" fill="url(#beamGrad)"/>
  </g>

  <!-- PRESENTATION SCREEN -->
  <g id="screen" filter="url(#shadow)">
    <!-- Screen Frame -->
    <rect x="22" y="48" width="196" height="99" rx="4" fill="#334155"/>
    <!-- Screen Surface -->
    <rect x="25" y="51" width="190" height="93" fill="url(#screenGrad)"/>
    
    <!-- Abstract Slide Content (Charts, Diagrams) -->
    <!-- Bar Chart -->
    <rect x="42" y="105" width="12" height="25" rx="2" fill="#38bdf8"/>
    <rect x="60" y="90" width="12" height="40" rx="2" fill="#10b981"/>
    <rect x="78" y="75" width="12" height="55" rx="2" fill="#f59e0b"/>
    <line x1="38" y1="130" x2="100" y2="130" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="70" x2="38" y2="130" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Pie Chart / Graphic -->
    <circle cx="165" cy="95" r="22" fill="#334155"/>
    <path d="M165,95 L165,73 A22,22 0 0,1 185,105 Z" fill="#ec4899"/>
    <path d="M165,95 L185,105 A22,22 0 1,1 165,73 Z" fill="#38bdf8"/>

    <!-- Slide Header line -->
    <rect x="42" y="60" width="60" height="6" rx="3" fill="#64748b" fill-opacity="0.6"/>
  </g>

  <!-- LECTURER / SPEAKER -->
  <g id="speaker" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M 125,185 Q 125,160 145,150 L 175,150 Q 195,160 195,185 Z" fill="#4f46e5"/>
    <!-- Head -->
    <circle cx="160" cy="128" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 146,125 Q 160,110 174,125 Q 170,118 160,117 Q 150,118 146,125 Z" fill="#1e293b"/>
    <!-- Gesture Arm pointing to screen -->
    <path d="M 175,155 L 205,135 L 200,128 L 168,148 Z" fill="#fbcfe8"/>
    <!-- Glasses / Smart look -->
    <circle cx="156" cy="127" r="3" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="164" cy="127" r="3" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="159" y1="127" x2="161" y2="127" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- LECTURE PODIUM / DESK -->
  <g id="podium" filter="url(#shadow)">
    <!-- Main Podium Stand -->
    <path d="M 125,180 L 140,150 L 180,150 L 195,180 Z" fill="#3b82f6"/>
    <rect x="120" y="180" width="80" height="12" rx="3" fill="#1d4ed8"/>
    <!-- Laptop / Notes on Podium -->
    <rect x="142" y="142" width="26" height="10" rx="1" fill="#94a3b8"/>
    <polygon points="140,152 170,152 175,160 135,160" fill="#cbd5e1"/>
    <!-- Microphone -->
    <path d="M 160,150 L 160,135 Q 160,130 165,130 L 168,130" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="168" cy="128" r="3" fill="#cbd5e1"/>
  </g>

  <!-- AUDIENCE SEATING / FOREGROUND ELEMENTS -->
  <g id="audience">
    <!-- Row 1 (Silhouettes in foreground depth) -->
    <!-- Seat 1 Left -->
    <path d="M 15,220 Q 15,195 35,195 L 65,195 Q 85,195 85,220 Z" fill="#0f172a"/>
    <circle cx="50" cy="180" r="12" fill="#334155"/>
    <path d="M 38,195 Q 50,185 62,195 Z" fill="#334155"/>

    <!-- Seat 2 Center-Left -->
    <path d="M 65,230 Q 65,205 85,205 L 115,205 Q 135,205 135,230 Z" fill="#0f172a"/>
    <circle cx="100" cy="190" r="13" fill="#475569"/>
    <path d="M 87,205 Q 100,195 113,205 Z" fill="#475569"/>

    <!-- Small Note-taking Hand / Prop -->
    <rect x="75" y="210" width="30" height="15" rx="2" fill="#fb923c" transform="rotate(-10 75 210)" opacity="0.9"/>
  </g>

  <!-- ATMOSPHERIC ACCENTS -->
  <!-- Floating Knowledge Sparkles / Particles -->
  <g id="particles">
    <circle cx="190" cy="90" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="205" cy="75" r="2" fill="#38bdf8" opacity="0.9"/>
    <circle cx="180" cy="65" r="2.5" fill="#ec4899" opacity="0.7"/>
    <circle cx="215" cy="115" r="1.5" fill="#fbbf24" opacity="0.9"/>
    <!-- Star sparkle shape -->
    <path d="M 198,60 L 200,65 L 205,67 L 200,69 L 198,74 L 196,69 L 191,67 L 196,65 Z" fill="#fbbf24" opacity="0.6"/>
    <path d="M 70,50 L 71,53 L 74,54 L 71,55 L 70,58 L 69,55 L 66,54 L 69,53 Z" fill="#38bdf8" opacity="0.5"/>
  </g>

  <!-- Vignette Border (Inner Shadow for depth) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#000000" stroke-width="4" opacity="0.15"/>
</svg>