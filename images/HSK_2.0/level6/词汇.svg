<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Open Book -->
  <path d="M40 120 L120 100 L200 120 L120 150 Z" fill="#334155"/>
  <path d="M40 120 L120 100 L120 200 L40 180 Z" fill="#f8fafc"/>
  <path d="M200 120 L120 100 L120 200 L200 180 Z" fill="#e2e8f0"/>
  
  <!-- Floating Vocabulary Elements (Representing 'Word Bank') -->
  <circle cx="180" cy="70" r="12" fill="#f59e0b"/>
  <rect x="195" y="60" width="20" height="8" rx="2" fill="#38bdf8"/>
  
  <rect x="30" y="80" width="25" height="10" rx="2" fill="#10b981"/>
  <circle cx="65" cy="85" r="8" fill="#fb923c"/>
  
  <rect x="150" y="160" width="30" height="12" rx="3" fill="#ec4899"/>
  <circle cx="190" cy="166" r="6" fill="#fbbf24"/>
  
  <!-- Decorative Lines on Pages -->
  <line x1="50" y1="120" x2="110" y2="135" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="140" x2="110" y2="155" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="120" x2="190" y2="135" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="140" x2="190" y2="155" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.1"/>
</svg>