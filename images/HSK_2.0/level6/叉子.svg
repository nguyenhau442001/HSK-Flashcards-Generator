<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Background Elements (Tabletop & Restaurant Vibe) -->
  <path d="M0 140 L240 140 L240 240 L0 240 Z" fill="#1e293b"/>
  <!-- Wooden Table Texture Lines / Accents -->
  <path d="M0 170 C80 165, 160 175, 240 168" stroke="#2a3950" stroke-width="2" fill="none"/>
  <path d="M0 205 C70 210, 150 200, 240 208" stroke="#2a3950" stroke-width="1.5" fill="none"/>

  <!-- Background Warm Ambient Glow (Restaurant lighting) -->
  <circle cx="120" cy="80" r="90" fill="#38bdf8" opacity="0.06"/>
  
  <!-- Dining Plate (Context Prop) -->
  <ellipse cx="120" cy="165" rx="85" ry="38" fill="#334155" opacity="0.4"/>
  <ellipse cx="120" cy="160" rx="80" ry="35" fill="#f8fafc"/>
  <ellipse cx="120" cy="163" rx="65" ry="27" fill="#e2e8f0"/>

  <!-- Delicious Food Item (Spaghetti/Pasta swirl to give action context to the fork) -->
  <path d="M100 160 C95 150, 110 145, 120 155 C130 165, 145 150, 140 165 C135 175, 105 170, 100 160 Z" fill="#fbbf24"/>
  <path d="M105 158 C108 152, 118 150, 122 157" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M115 162 C122 168, 135 158, 132 165" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Meatball / Garnishing -->
  <circle cx="135" cy="155" r="10" fill="#b45309"/>
  <circle cx="133" cy="153" r="3" fill="#f59e0b" opacity="0.6"/>

  <!-- MAIN SUBJECT: The Fork (叉子 - chāzi) -->
  <!-- Action-packed angle resting across the plate -->
  <g transform="rotate(-35 120 120)">
    <!-- Fork Shadow -->
    <path d="M60 117 L185 117 C188 117, 190 120, 188 123 L185 125 C183 127, 60 127, 60 127 Z" fill="#000000" opacity="0.3" filter="blur(2px)"/>
    
    <!-- Fork Handle -->
    <path d="M65 113 L150 113 C155 113, 158 116, 158 120 C158 124, 155 127, 150 127 L65 127 C60 127, 58 124, 58 120 C58 116, 60 113, 65 113 Z" fill="url(#handleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Handle Ergonomic Detail / Indentation -->
    <path d="M75 117 L135 117" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M75 123 L135 123" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Fork Neck (Ferrule/Transition) -->
    <path d="M150 113 L168 110 L168 130 L150 127 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Fork Head (Tines Base) -->
    <path d="M168 110 L188 106 C192 105, 195 108, 195 112 L195 128 C195 132, 192 135, 188 134 L168 130 Z" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Fork Tines (4 Prongs) -->
    <!-- Tine 1 (Top) -->
    <path d="M192 108 L218 107 C221 107, 222 109, 222 111 C222 113, 221 114, 218 114 L192 113 Z" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Tine 2 -->
    <path d="M192 114 L222 114 C224 114, 224 116, 222 117 L192 117 Z" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Tine 3 -->
    <path d="M192 123 L222 123 C224 124, 224 125, 222 126 L192 126 Z" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Tine 4 (Bottom) -->
    <path d="M192 127 L218 126 C221 126, 222 128, 222 130 C222 132, 221 133, 218 133 L192 129 Z" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="1"/>

    <!-- Highlights on Fork for metallic sheen -->
    <path d="M68 115 L180 115" stroke="#ffffff" stroke-width="1" opacity="0.8" fill="none"/>
  </g>

  <!-- Sparkles / Action Accents (Vivid Learning Vibe) -->
  <g transform="translate(180, 55)">
    <path d="M0 10 C0 4, 4 0, 10 0 C4 0, 0 -4, 0 -10 C0 -4, -4 0, -10 0 C-4 0, 0 4, 0 10 Z" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(60, 95) scale(0.6)">
    <path d="M0 10 C0 4, 4 0, 10 0 C4 0, 0 -4, 0 -10 C0 -4, -4 0, -10 0 C-4 0, 0 4, 0 10 Z" fill="#38bdf8"/>
  </g>

  <!-- Gradients Definition -->
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
</svg>