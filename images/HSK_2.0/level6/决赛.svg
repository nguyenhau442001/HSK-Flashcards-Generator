<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient & Atmosphere -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Stadium Atmosphere / Lights -->
  <circle cx="120" cy="30" r="120" fill="url(#spotlight)" />
  <path d="M 0 60 L 240 60 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.3" />

  <!-- Confetti / Championship Sparks -->
  <g opacity="0.8">
    <circle cx="45" cy="50" r="3" fill="#38bdf8" />
    <circle cx="195" cy="70" r="2" fill="#ec4899" />
    <rect x="70" y="35" width="4" height="6" rx="1" fill="#fbbf24" transform="rotate(25 72 38)" />
    <rect x="165" y="45" width="5" height="4" rx="1" fill="#10b981" transform="rotate(-15 167 47)" />
    <circle cx="30" cy="100" r="2.5" fill="#f43f5e" />
    <circle cx="210" cy="120" r="3" fill="#38bdf8" />
    <rect x="55" y="140" width="4" height="4" rx="0.5" fill="#fbbf24" transform="rotate(45 57 142)" />
    <rect x="185" y="140" width="3" height="6" rx="1" fill="#a855f7" transform="rotate(-30 186 143)" />
  </g>

  <!-- Stadium Floor / Pitch -->
  <ellipse cx="120" cy="190" rx="100" ry="35" fill="url(#pitchGrad)" filter="url(#shadow)" />
  
  <!-- Field Markings -->
  <ellipse cx="120" cy="190" rx="80" ry="26" fill="none" stroke="#047857" stroke-width="2" opacity="0.6" />
  <path d="M 120 164 L 120 216" stroke="#047857" stroke-width="2" opacity="0.6" />
  <circle cx="120" cy="190" r="16" fill="none" stroke="#047857" stroke-width="2" opacity="0.6" />

  <!-- Championship Podium / Dais -->
  <g filter="url(#shadow)">
    <!-- 2nd Place Step (Left) -->
    <path d="M 60 170 L 90 160 L 90 200 L 60 210 Z" fill="#334155" />
    <path d="M 90 160 L 120 170 L 120 210 L 90 200 Z" fill="#475569" />
    <path d="M 60 155 L 90 145 L 120 155 L 90 165 Z" fill="#64748b" />

    <!-- 1st Place Step (Center - Taller) -->
    <path d="M 95 150 L 120 140 L 120 195 L 95 205 Z" fill="#1e293b" />
    <path d="M 120 140 L 145 150 L 145 205 L 120 195 Z" fill="#334155" />
    <path d="M 95 135 L 120 125 L 145 135 L 120 145 Z" fill="#475569" />

    <!-- 3rd Place Step (Right) -->
    <path d="M 145 175 L 170 165 L 170 205 L 145 215 Z" fill="#334155" />
    <path d="M 170 165 L 200 175 L 200 210 L 170 205 Z" fill="#1e293b" />
    <path d="M 145 160 L 170 150 L 200 160 L 175 170 Z" fill="#475569" />
  </g>

  <!-- Giant Golden Championship Trophy (Centerpiece) -->
  <g filter="url(#shadow)">
    <!-- Glow behind trophy -->
    <circle cx="120" cy="95" r="40" fill="url(#goldGlow)" />

    <!-- Trophy Base -->
    <path d="M 105 132 L 135 132 L 138 140 L 102 140 Z" fill="#b45309" />
    <rect x="110" y="125" width="20" height="8" rx="1" fill="#d97706" />

    <!-- Trophy Stem -->
    <rect x="115" y="110" width="10" height="16" fill="url(#goldGrad)" />

    <!-- Trophy Cup Body -->
    <path d="M 95 65 C 95 65 92 105 120 105 C 148 105 145 65 145 65 Z" fill="url(#goldGrad)" />
    <!-- Cup Rim -->
    <ellipse cx="120" cy="65" rx="25" ry="6" fill="#fef08a" />
    <ellipse cx="120" cy="65" rx="21" ry="4" fill="#b45309" />

    <!-- Cup Handles -->
    <path d="M 97 70 C 85 70 82 85 96 95" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
    <path d="M 143 70 C 155 70 158 85 144 95" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

    <!-- Trophy Inner Shine -->
    <path d="M 112 73 C 112 73 110 90 118 97" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Winner Star on Trophy -->
    <path d="M 120 76 L 122.5 83 L 130 83.5 L 124 88 L 126.5 95 L 120 91 L 113.5 95 L 116 88 L 110 83.5 L 117.5 83 Z" fill="#fef08a" />
  </g>

  <!-- Silver Medal (Podium 2nd Place - Left) -->
  <g transform="translate(4, -5)" filter="url(#shadow)">
    <!-- Ribbon -->
    <path d="M 82 140 L 92 140 L 87 165 Z" fill="#38bdf8" />
    <path d="M 90 140 L 100 140 L 93 165 Z" fill="#0284c7" />
    <!-- Medal Circle -->
    <circle cx="91" cy="165" r="11" fill="url(#silverGrad)" />
    <circle cx="91" cy="165" r="8" fill="#e2e8f0" />
    <!-- Number 2 -->
    <text x="91" y="170" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#475569" text-anchor="middle">2</text>
  </g>

  <!-- Bronze Medal (Podium 3rd Place - Right) -->
  <g transform="translate(-4, -2)" filter="url(#shadow)">
    <!-- Ribbon -->
    <path d="M 152 145 L 162 145 L 155 170 Z" fill="#f43f5e" />
    <path d="M 160 145 L 170 145 L 163 170 Z" fill="#e11d48" />
    <!-- Medal Circle -->
    <circle cx="161" cy="170" r="10" fill="#b45309" />
    <circle cx="161" cy="170" r="7" fill="#d97706" />
    <!-- Number 3 -->
    <text x="161" y="175" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#fef3c7" text-anchor="middle">3</text>
  </g>

  <!-- Soccer Ball & Athletic Equipment Foreground Elements -->
  <!-- Soccer Ball -->
  <g transform="translate(75, 185) scale(0.9)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <!-- Ball Patches -->
    <path d="M 0 -5 L 4 -2 L 3 4 L -3 4 L -4 -2 Z" fill="#1e293b" />
    <path d="M -9 -7 L -4 -2 L -8 4 Z" fill="#1e293b" />
    <path d="M 9 -7 L 4 -2 L 8 4 Z" fill="#1e293b" />
    <path d="M 0 14 L -3 4 L 3 4 Z" fill="#1e293b" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#1e293b" stroke-width="1.5" />
  </g>

  <!-- Championship Banner / Ribbon Floating at top -->
  <g filter="url(#shadow)">
    <path d="M 40 45 Q 120 65 200 45 L 195 25 Q 120 45 45 25 Z" fill="#ec4899" />
    <path d="M 45 25 L 30 35 L 45 45 Z" fill="#be185d" />
    <path d="M 195 25 L 210 35 L 195 45 Z" fill="#be185d" />
    <path d="M 42 35 Q 120 55 198 35" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-dasharray="6 4" />
  </g>

  <!-- Shimmer Highlights -->
  <path d="M 115 50 Q 120 45 125 50" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="180" cy="80" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle cx="60" cy="90" r="2" fill="#ffffff" opacity="0.7" />
</svg>