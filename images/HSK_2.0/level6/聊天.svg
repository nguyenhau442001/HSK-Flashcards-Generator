<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Chat Bubble Gradient Left -->
    <linearGradient id="bubbleLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Chat Bubble Gradient Right -->
    <linearGradient id="bubbleRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="windowNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Interior -->
  <!-- Wall & Floor Divider -->
  <rect x="0" y="0" width="240" height="170" fill="#1e293b" opacity="0.4" />
  <rect x="0" y="170" width="240" height="70" fill="#0f172a" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2" />

  <!-- Cozy Window with Cityscape Silhouette -->
  <g transform="translate(145, 25)">
    <rect x="0" y="0" width="65" height="95" rx="4" fill="url(#windowNight)" stroke="#475569" stroke-width="3" />
    <!-- Window Panes -->
    <line x1="32.5" y1="0" x2="32.5" y2="95" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="47.5" x2="65" y2="47.5" stroke="#475569" stroke-width="2" />
    <!-- City Buildings Outside -->
    <rect x="8" y="55" width="12" height="40" fill="#1e1b4b" />
    <rect x="23" y="40" width="16" height="55" fill="#1e1b4b" />
    <rect x="42" y="60" width="15" height="35" fill="#1e1b4b" />
    <!-- Tiny Window Lights -->
    <rect x="11" y="65" width="2" height="3" fill="#fbbf24" opacity="0.8" />
    <rect x="27" y="50" width="3" height="3" fill="#fbbf24" opacity="0.8" />
    <rect x="27" y="60" width="3" height="3" fill="#fbbf24" opacity="0.8" />
    <rect x="46" y="70" width="2" height="2" fill="#fbbf24" opacity="0.8" />
    <!-- Moon -->
    <circle cx="50" cy="18" r="6" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- Bookshelf / Plants on Wall -->
  <g transform="translate(25, 30)">
    <!-- Small Shelf -->
    <rect x="0" y="25" width="45" height="4" rx="2" fill="#475569" />
    <!-- Pot -->
    <path d="M12 25 L15 15 L25 15 L28 25 Z" fill="#cbd5e1" />
    <!-- Plant Leaves -->
    <path d="M20 15 Q12 5 10 10 Q15 15 20 15 Z" fill="#10b981" />
    <path d="M20 15 Q25 2 30 7 Q25 12 20 15 Z" fill="#34d399" />
    <path d="M20 15 Q20 3 20 3 Q20 10 20 15 Z" fill="#059669" />
    <!-- Book Stack -->
    <rect x="32" y="16" width="10" height="9" rx="1" fill="#f43f5e" />
    <rect x="31" y="13" width="12" height="3" rx="1" fill="#3b82f6" />
  </g>

  <!-- Ambient Lamp Glow & Hanging Lamp -->
  <rect x="0" y="0" width="240" height="240" fill="url(#lampGlow)" pointer-events="none" />
  <line x1="85" y1="0" x2="85" y2="40" stroke="#475569" stroke-width="2" />
  <path d="M70 40 L100 40 L105 50 L65 50 Z" fill="#fbbf24" />
  <circle cx="85" cy="52" r="5" fill="#fef08a" />

  <!-- Living Room Sofa -->
  <g transform="translate(25, 120)" filter="url(#softShadow)">
    <!-- Sofa Base & Cushion -->
    <rect x="0" y="20" width="190" height="50" rx="12" fill="#334155" />
    <rect x="10" y="10" width="170" height="35" rx="8" fill="#475569" />
    <!-- Sofa Backrest -->
    <rect x="10" y="-15" width="170" height="35" rx="12" fill="#334155" />
    <!-- Cozy Pillows -->
    <rect x="18" y="-5" width="22" height="25" rx="8" fill="#fb923c" transform="rotate(-10 18 -5)" />
    <rect x="150" y="-5" width="22" height="25" rx="8" fill="#38bdf8" transform="rotate(10 150 -5)" />
    <!-- Coffee Table in Foreground -->
    <rect x="70" y="60" width="70" height="22" rx="4" fill="#64748b" />
    <!-- Tea Cups & Snacks on Table -->
    <circle cx="88" cy="67" r="4" fill="#f8fafc" />
    <ellipse cx="120" cy="67" rx="6" ry="3" fill="#cbd5e1" />
  </g>

  <!-- Floating Active Chat Bubbles (Representing '聊天' / Chatting) -->
  <g filter="url(#softShadow)">
    <!-- Left Chat Bubble -->
    <g transform="translate(55, 65)">
      <path d="M 0 12 A 12 12 0 0 1 12 0 L 38 0 A 12 12 0 0 1 50 12 L 50 28 A 12 12 0 0 1 38 40 L 20 40 L 10 50 L 14 40 L 12 40 A 12 12 0 0 1 0 28 Z" fill="url(#bubbleLeft)" />
      <!-- Animated dots inside bubble -->
      <circle cx="15" cy="20" r="3.5" fill="#ffffff" />
      <circle cx="25" cy="20" r="3.5" fill="#ffffff" />
      <circle cx="35" cy="20" r="3.5" fill="#ffffff" />
    </g>

    <!-- Right Chat Bubble -->
    <g transform="translate(135, 75)">
      <path d="M 0 12 A 12 12 0 0 1 12 0 L 38 0 A 12 12 0 0 1 50 12 L 50 28 A 12 12 0 0 1 38 40 L 36 40 L 40 50 L 30 40 L 12 40 A 12 12 0 0 1 0 28 Z" fill="url(#bubbleRight)" />
      <!-- Tiny heart icon inside right bubble -->
      <path d="M25 13 C22 9, 17 12, 19 16 C21 20, 25 24, 25 24 C25 24, 29 20, 31 16 C33 12, 28 9, 25 13 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- Characters (Person Left & Person Right actively chatting) -->
  <g id="characters">
    <!-- CHARACTER LEFT (Female, Smiling, Gesturing) -->
    <g transform="translate(65, 110)">
      <!-- Body & Torso -->
      <path d="M15 35 C15 25, 25 20, 35 20 C45 20, 55 25, 55 35 L55 75 L15 75 Z" fill="#10b981" />
      <!-- Neck -->
      <rect x="30" y="12" width="10" height="12" fill="#fbcfe8" />
      <!-- Head -->
      <circle cx="35" cy="10" r="14" fill="#fbcfe8" />
      <!-- Hair (Stylish Bob) -->
      <path d="M21 8 C21 -1, 49 -1, 49 8 C49 16, 45 22, 45 22 L41 14 L29 14 L25 22 C25 22, 21 16, 21 8 Z" fill="#334155" />
      <!-- Face Expression (Happy eyes, open smile) -->
      <path d="M29 9 Q31 7 33 9" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M37 9 Q39 7 41 9" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M32 13 Q35 17 38 13" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Active Gesturing Arm -->
      <path d="M18 35 Q5 40, 10 50" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none" />
      <circle cx="10" cy="51" r="3.5" fill="#fbcfe8" />
    </g>

    <!-- CHARACTER RIGHT (Male, Relaxed, Holding Smartphone) -->
    <g transform="translate(125, 105)">
      <!-- Body & Torso -->
      <path d="M15 40 C15 30, 25 25, 35 25 C45 25, 55 30, 55 40 L60 80 L10 80 Z" fill="#6366f1" />
      <!-- Neck -->
      <rect x="30" y="15" width="10" height="12" fill="#fed7aa" />
      <!-- Head -->
      <circle cx="35" cy="12" r="14" fill="#fed7aa" />
      <!-- Hair (Short Spiky) -->
      <path d="M21 12 C21 2, 25 1, 32 3 C36 1, 41 1, 47 4 C49 7, 49 12, 49 12 C49 12, 43 14, 35 14 C27 14, 21 12, 21 12 Z" fill="#1e293b" />
      <!-- Face Expression (Friendly smile looking left) -->
      <circle cx="31" cy="11" r="1.5" fill="#1e293b" />
      <circle cx="39" cy="11" r="1.5" fill="#1e293b" />
      <path d="M33 16 Q35 19 37 16" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Arm holding phone -->
      <path d="M50 45 L40 55 L35 52" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Smartphone -->
      <rect x="28" y="45" width="12" height="18" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-15 34 54)" />
    </g>
  </g>

  <!-- Foreground decorative elements for depth (Houseplants) -->
  <g transform="translate(15, 175)">
    <path d="M0 45 C0 30, 15 30, 15 45 Z" fill="#0284c7" />
    <path d="M7 30 Q-5 10, 5 0 Q15 15, 7 30 Z" fill="#10b981" />
    <path d="M7 30 Q15 5, 25 12 Q20 25, 7 30 Z" fill="#059669" />
  </g>

  <!-- Subtle floor lighting/shadow under table & sofa -->
  <ellipse cx="120" cy="210" rx="70" ry="8" fill="#000000" opacity="0.3" />

</svg>