<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting -->
  <circle cx="120" cy="80" r="120" fill="url(#lampGlow)" />

  <!-- Background Room Elements -->
  <!-- Window -->
  <g transform="translate(85, 25)">
    <rect x="0" y="0" width="70" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <rect x="6" y="6" width="58" height="73" rx="2" fill="url(#nightGrad)"/>
    <!-- City lights / stars in window -->
    <circle cx="20" cy="30" r="1.5" fill="#fef08a" opacity="0.8"/>
    <circle cx="50" cy="50" r="1" fill="#38bdf8" opacity="0.6"/>
    <circle cx="35" cy="65" r="1.5" fill="#fef08a" opacity="0.7"/>
    <!-- Window Frame Cross -->
    <line x1="35" y1="6" x2="35" y2="79" stroke="#334155" stroke-width="3"/>
    <line x1="6" y1="42" x2="64" y2="42" stroke="#334155" stroke-width="3"/>
  </g>

  <!-- Wall Hanging / Painting -->
  <rect x="35" y="35" width="30" height="40" rx="2" fill="#334155" />
  <rect x="39" y="39" width="22" height="32" rx="1" fill="#475569" />
  <circle cx="50" cy="50" r="6" fill="#f43f5e" opacity="0.6"/>

  <!-- Floor -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#floorGrad)" />
  <!-- Baseboard line -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#090d16" stroke-width="3" />

  <!-- Center Table / Bench -->
  <path d="M 70 170 L 170 170 L 160 195 L 80 195 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="65" y="165" width="110" height="8" rx="2" fill="#475569" />

  <!-- Left Character (Person A) -->
  <g id="character-left" transform="translate(45, 105)">
    <!-- Shadow -->
    <ellipse cx="25" cy="70" rx="18" ry="6" fill="#000" opacity="0.5"/>
    
    <!-- Body / Torso -->
    <path d="M 12 35 C 12 25, 38 25, 38 35 L 45 70 L 5 70 Z" fill="#3b82f6" />
    
    <!-- Head -->
    <circle cx="25" cy="16" r="13" fill="#fed7aa" />
    <!-- Hair (Neat short style) -->
    <path d="M 13 15 C 13 8, 20 4, 27 5 C 34 6, 37 12, 38 18 C 30 14, 20 14, 13 15 Z" fill="#1e293b"/>
    
    <!-- Slumped Posture / Turned away slightly -->
    <!-- Arms -->
    <path d="M 12 40 L 0 55" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Sad facial contour (implied downcast eyes) -->
    <path d="M 28 16 Q 31 18 30 20" stroke="#9a3412" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right Character (Person B) -->
  <g id="character-right" transform="translate(150, 105)">
    <!-- Shadow -->
    <ellipse cx="25" cy="70" rx="18" ry="6" fill="#000" opacity="0.5"/>
    
    <!-- Body / Torso -->
    <path d="M 12 35 C 12 25, 38 25, 38 35 L 45 70 L 5 70 Z" fill="#ec4899" />
    
    <!-- Head -->
    <circle cx="25" cy="16" r="13" fill="#fed7aa" />
    <!-- Hair (Longer style pointing away) -->
    <path d="M 12 14 C 15 5, 28 4, 37 10 C 40 18, 38 24, 38 24 C 38 24, 30 18, 25 18 C 18 18, 14 15, 12 14 Z" fill="#0f172a"/>
    
    <!-- Turned away posture -->
    <path d="M 38 40 L 50 55" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Central Visual Metaphor: The Parting / Breaking Gap -->
  <!-- Dashed glowing energy line splitting the middle symbolically -->
  <line x1="120" y1="80" x2="120" y2="160" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.7"/>

  <!-- The Broken Heart Prop (Floating gently in the center gap) -->
  <g id="broken-heart" transform="translate(120, 125) scale(0.9)" filter="url(#shadow)">
    <!-- Left half of heart shifting left -->
    <g transform="translate(-10, -4) rotate(-12)">
      <path d="M 0 0 C -15 -15, -25 5, 0 25 C 0 25, 0 15, 0 0 Z" fill="#f43f5e"/>
      <path d="M -2 -2 C -12 -12, -18 2, -2 18 Z" fill="#fb7185" opacity="0.6"/>
    </g>
    
    <!-- Right half of heart shifting right -->
    <g transform="translate(10, 2) rotate(18)">
      <path d="M 0 0 C 15 -15, 25 5, 0 25 C 0 25, 0 15, 0 0 Z" fill="#e11d48"/>
    </g>
    
    <!-- Tiny floating separation sparkles/tears -->
    <circle cx="0" cy="-12" r="2" fill="#38bdf8" opacity="0.9"/>
    <circle cx="-3" cy="28" r="1.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="5" cy="32" r="2" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground Atmospheric Elements (Luggage / Packed Bag hinting at leaving) -->
  <g id="luggage" transform="translate(180, 140)" filter="url(#shadow)">
    <!-- Suitcase body -->
    <rect x="0" y="10" width="28" height="35" rx="4" fill="#d97706"/>
    <rect x="3" y="14" width="22" height="27" rx="2" fill="none" stroke="#b45309" stroke-width="2"/>
    <!-- Handle -->
    <path d="M 8 10 L 8 5 C 8 3, 10 2, 14 2 C 18 2, 20 3, 20 5 L 20 10" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Wheels -->
    <rect x="4" y="45" width="5" height="3" rx="1.5" fill="#1e293b"/>
    <rect x="19" y="45" width="5" height="3" rx="1.5" fill="#1e293b"/>
  </g>

  <!-- Coffee mugs on table (Distance between them) -->
  <g id="mugs">
    <!-- Left Mug -->
    <rect x="75" y="155" width="10" height="12" rx="2" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M 73 158 C 70 158, 70 164, 73 164" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    
    <!-- Right Mug -->
    <rect x="155" y="155" width="10" height="12" rx="2" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M 167 158 C 170 158, 170 164, 167 164" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
  </g>

</svg>