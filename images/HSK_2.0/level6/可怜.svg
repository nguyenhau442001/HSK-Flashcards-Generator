<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Streetlamp Glow -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Puddle Reflection Gradient -->
    <linearGradient id="puddle-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Box Gradient -->
    <linearGradient id="box-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a6c4c"/>
      <stop offset="100%" stop-color="#784f33"/>
    </linearGradient>

    <!-- Box Inside Shadow -->
    <linearGradient id="box-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2312"/>
      <stop offset="100%" stop-color="#59341c"/>
    </linearGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements (Alleyway Context) -->
  <!-- Brick Wall Left -->
  <path d="M 0 0 L 60 0 L 60 240 L 0 240 Z" fill="#1b263b" opacity="0.5"/>
  <path d="M 60 0 L 70 0 L 70 240 L 60 240 Z" fill="#0f172a" opacity="0.8"/>
  <!-- Brick lines -->
  <path d="M 0 40 L 60 40 M 0 80 L 60 80 M 0 120 L 60 120 M 0 160 L 60 160 M 0 200 L 60 200" stroke="#0f172a" stroke-width="1.5" opacity="0.6"/>
  <path d="M 20 20 L 20 40 M 45 60 L 45 80 M 15 100 L 15 120 M 40 140 L 40 160 M 25 180 L 25 200 M 50 220 L 50 240" stroke="#0f172a" stroke-width="1.5" opacity="0.6"/>

  <!-- Distant Wall Right -->
  <path d="M 200 60 L 240 50 L 240 240 L 200 240 Z" fill="#1b263b" opacity="0.3"/>

  <!-- Streetlamp Source & Beam -->
  <circle cx="180" cy="40" r="70" fill="url(#lamp-glow)"/>
  <path d="M 175 0 L 185 0 L 195 240 L 165 240 Z" fill="#fbbf24" opacity="0.04"/>

  <!-- Raindrops -->
  <g opacity="0.35" stroke="#38bdf8" stroke-linecap="round" stroke-width="1.5">
    <line x1="40" y1="30" x2="34" y2="48" />
    <line x1="85" y1="15" x2="79" y2="33" />
    <line x1="130" y1="50" x2="124" y2="68" />
    <line x1="210" y1="20" x2="204" y2="38" />
    
    <line x1="25" y1="90" x2="19" y2="108" />
    <line x1="70" y1="110" x2="64" y2="128" />
    <line x1="115" y1="85" x2="109" y2="103" />
    <line x1="225" y1="95" x2="219" y2="113" />

    <line x1="50" y1="150" x2="44" y2="168" />
    <line x1="90" y1="160" x2="84" y2="178" />
    <line x1="140" y1="140" x2="134" y2="158" />
    <line x1="200" y1="155" x2="194" y2="173" />
  </g>

  <!-- Wet Ground / Puddle -->
  <ellipse cx="120" cy="205" rx="75" ry="18" fill="url(#puddle-grad)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Cardboard Box (Shelter) -->
  <g transform="translate(85, 130)">
    <!-- Box Back Shadow -->
    <ellipse cx="35" cy="72" rx="40" ry="8" fill="#090d16" opacity="0.6"/>

    <!-- Box Flaps Open Upwards/Back -->
    <path d="M 0 15 L 20 -10 L 45 -5 L 15 15 Z" fill="#654228"/>
    <path d="M 50 12 L 75 -5 L 95 10 L 70 20 Z" fill="#59341c"/>

    <!-- Box Main Body (Open side facing front/left slightly) -->
    <rect x="10" y="15" width="60" height="55" rx="3" fill="url(#box-grad)" stroke="#4e311c" stroke-width="1.5"/>
    
    <!-- Inside Darkness -->
    <rect x="15" y="20" width="50" height="45" fill="url(#box-inner)"/>

    <!-- Box Front Flap Folded Down -->
    <path d="M 10 70 L 70 70 L 65 82 L 15 82 Z" fill="#8c5e3c" stroke="#59341c" stroke-width="1"/>
    <line x1="40" y1="70" x2="40" y2="82" stroke="#654228" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Box Details (Stickers / Tape) -->
    <rect x="35" y="15" width="10" height="55" fill="#a47551" opacity="0.4"/>
    <path d="M 22 25 L 32 30" stroke="#b8865e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- THE PITYFUL LITTLE CAT (Main Subject) -->
  <g transform="translate(100, 142)">
    <!-- Cat Shadow -->
    <ellipse cx="20" cy="54" rx="22" ry="5" fill="#000000" opacity="0.3"/>

    <!-- Drooping Tail -->
    <path d="M -2 46 C -12 48 -18 42 -22 34 C -24 30 -21 26 -18 28 C -15 30 -16 36 -10 40 C -6 42 0 42 2 44" fill="none" stroke="#f1a265" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Hunched Body -->
    <path d="M 5 48 C 0 48 -5 40 -2 30 C 1 20 12 18 22 22 C 32 26 38 35 34 44 C 32 48 20 50 14 50 Z" fill="#f97316"/>
    <!-- Cat Stripers (Orange Tabby) -->
    <path d="M 10 22 C 12 26 14 30 13 35" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 17 21 C 20 26 21 31 19 37" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 24 23 C 27 27 27 32 25 38" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Shivering / Tremble lines -->
    <path d="M -8 26 C -10 24 -10 20 -8 18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 42 32 C 44 30 44 26 42 24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Sad Head (Crouched down low) -->
    <g transform="translate(24, 18)">
      <!-- Head Base -->
      <path d="M -12 6 C -14 -2 -6 -10 2 -8 C 10 -10 18 -2 16 6 C 14 14 2 16 -12 6 Z" fill="#f97316"/>

      <!-- Drooping Ears (Sad/Pained angle) -->
      <!-- Left Ear -->
      <path d="M -10 -5 C -15 -10 -18 -4 -15 2 C -13 4 -11 2 -10 -1 Z" fill="#f97316"/>
      <path d="M -11 -4 C -14 -7 -15 -3 -13 1" fill="none" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Right Ear -->
      <path d="M 10 -3 C 15 -7 16 -1 13 4 C 11 5 10 3 9 1 Z" fill="#f97316"/>
      <path d="M 10 -2 C 13 -5 13 -1 11 2" fill="none" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Big Teary/Sad Eyes (Looking up imploringly) -->
      <!-- Left Eye -->
      <ellipse cx="-5" cy="2" rx="3.5" ry="4.5" fill="#1e293b"/>
      <circle cx="-6" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="-3" cy="4" r="0.8" fill="#ffffff"/>
      <!-- Right Eye -->
      <ellipse cx="5" cy="3" rx="3.5" ry="4.5" fill="#1e293b"/>
      <circle cx="4" cy="1" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="5" r="0.8" fill="#ffffff"/>

      <!-- Glossy Tears / Crying Eyes -->
      <path d="M -9 4 C -9 8 -7 10 -6 11" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-6" cy="12" r="1" fill="#38bdf8"/>
      <path d="M 1 5 C 1 9 3 11 4 12" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="4" cy="13.5" r="1.2" fill="#38bdf8"/>

      <!-- Tiny Nose & Trembling Sad Mouth -->
      <polygon points="0,5 2,7 -2,7" fill="#f43f5e"/>
      <path d="M -3 9 C -1 11 1 11 3 9" fill="none" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Rosy/Cold Cheeks -->
      <ellipse cx="-9" cy="8" rx="2" ry="1" fill="#f43f5e" opacity="0.4"/>
      <ellipse cx="9" cy="9" rx="2" ry="1" fill="#f43f5e" opacity="0.4"/>
    </g>

    <!-- Little Paws tucked in -->
    <ellipse cx="10" cy="48" rx="3.5" ry="2" fill="#fdba74"/>
    <ellipse cx="22" cy="49" rx="3.5" ry="2" fill="#fdba74"/>
  </g>

  <!-- Additional Atmospheric Details (Foreground Leaves / Rain Splash) -->
  <path d="M 30 220 Q 35 210 45 215 Q 40 225 30 220 Z" fill="#10b981" opacity="0.5"/>
  <path d="M 210 215 Q 215 205 225 210 Q 220 220 210 215 Z" fill="#059669" opacity="0.4"/>

  <!-- Tiny Ripple in Puddle near box -->
  <ellipse cx="105" cy="212" rx="8" ry="3" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  <ellipse cx="150" cy="200" rx="12" ry="4" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
</svg>