<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Glow -->
    <radialGradient id="deskGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Wood Surface Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#deskGlow)"/>

  <!-- Background Environment: Bookshelf & Research Notes -->
  <g opacity="0.4">
    <!-- Bookshelf -->
    <rect x="25" y="40" width="190" height="8" rx="4" fill="#475569"/>
    <!-- Books -->
    <path d="M40 20 h12 v20 h-12 z" fill="#ef4444" rx="2"/>
    <path d="M54 18 h14 v22 h-14 z" fill="#3b82f6" rx="2"/>
    <path d="M70 22 h10 v18 h-10 z" fill="#10b981" rx="2"/>
    <path d="M82 15 h16 v25 h-16 z" fill="#f59e0b" rx="2"/>
    <path d="M100 24 h12 v16 h-12 z" fill="#8b5cf6" rx="2"/>
    
    <path d="M160 20 h15 v20 h-15 z" fill="#ec4899" rx="2"/>
    <path d="M177 17 h12 v23 h-12 z" fill="#06b6d4" rx="2"/>
    <path d="M191 22 h14 v18 h-14 z" fill="#84cc16" rx="2"/>
    
    <!-- Pinned Research Notes on Wall -->
    <rect x="160" y="55" width="22" height="26" rx="2" fill="#f8fafc" transform="rotate(8 160 55)"/>
    <line x1="164" y1="62" x2="176" y2="62" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="164" y1="68" x2="173" y2="68" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="171" cy="57" r="1.5" fill="#ef4444"/>

    <rect x="45" y="60" width="24" height="20" rx="2" fill="#fef08a" transform="rotate(-6 45 60)"/>
    <line x1="49" y1="66" x2="65" y2="66" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
    <line x1="49" y1="72" x2="60" y2="72" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
    <circle cx="57" cy="62" r="1.5" fill="#3b82f6"/>
  </g>

  <!-- Work Desk Surface -->
  <path d="M0 195 L240 195 L240 240 L0 240 Z" fill="url(#woodGrad)" filter="url(#shadow)"/>
  <line x1="0" y1="195" x2="240" y2="195" stroke="#64748b" stroke-width="2"/>

  <!-- Laptop & Setup (Research Environment) -->
  <g transform="translate(115, 130)">
    <!-- Laptop Base -->
    <path d="M-35 35 L35 35 L45 45 L-45 45 Z" fill="#64748b" filter="url(#shadow)"/>
    <path d="M-30 35 L30 35 L35 43 L-35 43 Z" fill="#94a3b8"/>
    <rect x="-8" y="38" width="16" height="3" rx="1.5" fill="#475569"/>

    <!-- Laptop Screen Back -->
    <path d="M-32 -10 L32 -10 L35 35 L-35 35 Z" fill="#475569" filter="url(#shadow)"/>
    <!-- Laptop Screen Display -->
    <path d="M-28 -6 L28 -6 L31 31 L-31 31 Z" fill="#0f172a"/>
    <!-- Screen Glow & Data Viz -->
    <path d="M-28 -6 L28 -6 L31 31 L-31 31 Z" fill="url(#screenGlow)"/>
    <!-- Code / Graph lines on screen -->
    <polyline points="-22,2 -10,12 2,5 18,18" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="18" r="3" fill="#ec4899"/>
    <line x1="-22" y1="22" x2="-5" y2="22" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="26" x2="-10" y2="26" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug with Steam -->
  <g transform="translate(185, 175)">
    <!-- Steam -->
    <path d="M0 -15 C -4 -22, 4 -28, 0 -35" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Mug Body -->
    <path d="M-10 -10 L-8 15 C -8 18, -6 20, -3 20 L11 20 C 14 20, 16 18, 16 15 L18 -10 Z" fill="#f8fafc" filter="url(#shadow)"/>
    <!-- Mug Handle -->
    <path d="M16 -5 C 23 -5, 23 10, 16 10" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <!-- Coffee Surface -->
    <ellipse cx="4" cy="-10" rx="6" ry="2" fill="#78350f"/>
  </g>

  <!-- Stack of Heavy Academic Books & Dissertation -->
  <g transform="translate(55, 175)">
    <!-- Book 3 (Bottom) -->
    <path d="M-35 15 L25 5 L45 15 L-15 25 Z" fill="#1e3a8a"/>
    <path d="M-35 15 L-35 20 L-15 30 L-15 25 Z" fill="#1e293b"/>
    <path d="M25 5 L45 15 L45 20 L25 10 Z" fill="#3b82f6"/>
    
    <!-- Book 2 (Middle) -->
    <path d="M-30 0 L30 -10 L45 0 L-15 10 Z" fill="#065f46"/>
    <path d="M-30 0 L-30 5 L-15 15 L-15 10 Z" fill="#022c22"/>
    <path d="M30 -10 L45 0 L45 5 L30 -5 Z" fill="#10b981"/>

    <!-- Book 1 (Top - Dissertation) -->
    <path d="M-25 -15 L25 -22 L35 -12 L-15 -5 Z" fill="#b91c1c"/>
    <path d="M-25 -15 L-25 -10 L-15 -3 L-15 -5 Z" fill="#7f1d1d"/>
    <path d="M25 -22 L35 -12 L35 -9 L25 -19 Z" fill="#ef4444"/>
    <!-- Gold Foil Details on Dissertation -->
    <line x1="-5" y1="-14" x2="10" y2="-16" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- MAIN CHARACTER: The Doctoral Candidate (PhD Scholar) -->
  <g transform="translate(120, 105)" filter="url(#shadow)">
    <!-- Chair Backrest -->
    <path d="M-32 -25 C -32 -60, 32 -60, 32 -25 L 26 50 L -26 50 Z" fill="#334155"/>
    <path d="M-26 -20 C -26 -48, 26 -48, 26 -20 L 22 45 L -22 45 Z" fill="#1e293b"/>

    <!-- Torso (Smart Casual / Academic Attire: Blazer over Sweater) -->
    <!-- Blazer -->
    <path d="M-28 35 L-35 90 L35 90 L28 35 L12 35 L0 52 L-12 35 Z" fill="#2563eb"/>
    <!-- Inner Shirt / Collar -->
    <path d="M-12 35 L0 52 L12 35 L8 32 L0 42 L-8 32 Z" fill="#f8fafc"/>
    <!-- Tie / Academic Scarf Accent -->
    <polygon points="0,42 -3,65 0,72 3,65" fill="#f59e0b"/>

    <!-- Neck -->
    <rect x="-6" y="22" width="12" height="16" fill="#fed7aa"/>

    <!-- Head & Face -->
    <circle cx="0" cy="5" r="22" fill="#fed7aa"/>
    <!-- Friendly Enthusiastic Expression -->
    <!-- Glasses (Smart Scholar Aesthetic) -->
    <circle cx="-8" cy="2" r="7" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="8" cy="2" r="7" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="-1" y1="2" x2="1" y2="2" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Eyes (Happy / Focused) -->
    <path d="M-11 1 C -10 -1, -7 -1, -6 1" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6 1 C 7 -1, 10 -1, 11 1" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M-5 11 C -2 15, 2 15, 5 11" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="-13" cy="8" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="13" cy="8" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Hair (Stylish Neat Dark Hair) -->
    <path d="M-22 5 C -22 -10, -15 -20, 0 -20 C 15 -20, 22 -10, 22 5 C 22 10, 18 8, 18 3 C 18 -6, 10 -12, 0 -12 C -10 -12, -18 -6, -18 3 C -18 8, -22 10, -22 5 Z" fill="#0f172a"/>

    <!-- Academic Regalia: Doctoral Tam (Cap) with Tassel -->
    <!-- Soft Velvet Round Cap Base -->
    <ellipse cx="0" cy="-18" rx="24" ry="9" fill="#1e1b4b"/>
    <path d="M-24 -18 C -24 -28, 24 -28, 24 -18 C 24 -12, -24 -12, -24 -18 Z" fill="#312e81"/>
    <!-- Top Square Mortarboard Part -->
    <polygon points="0,-27 30,-21 0,-15 -30,-21" fill="#1e1b4b"/>
    <polygon points="0,-26 27,-21 0,-16 -27,-21" fill="#3730a3"/>
    <!-- Gold Button & Tassel hanging down proudly -->
    <circle cx="0" cy="-21" r="2.5" fill="url(#goldGrad)"/>
    <path d="M0 -21 C 12 -20, 18 -5, 15 8" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="10" r="2" fill="url(#goldGrad)"/>

    <!-- Arms / Hands Gesturing Confidently -->
    <!-- Left Arm (Holding up a glowing lightbulb/idea spark) -->
    <path d="M-26 40 C -45 45, -40 20, -32 5" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-32" cy="0" r="6" fill="#fed7aa"/>

    <!-- Right Arm (Resting on desk/laptop area) -->
    <path d="M26 40 C 42 55, 30 75, 20 75" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <circle cx="18" cy="76" r="6" fill="#fed7aa"/>
  </g>

  <!-- Spark of Genius / Breakthrough Idea (Floating above hand) -->
  <g transform="translate(80, 85)">
    <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.2">
      <animate attributeName="r" values="10;18;10" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Lightbulb Icon Graphic -->
    <path d="M0 -8 C -6 -8, -8 -3, -5 2 C -3 5, -4 7, -2 9 L2 9 C 4 7, 3 5, 5 2 C 8 -3, 6 -8, 0 -8 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <rect x="-2" y="10" width="4" height="3" fill="#94a3b8" rx="0.5"/>
    <!-- Glow rays -->
    <line x1="0" y1="-14" x2="0" y2="-17" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="-10" x2="-12" y2="-12" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="12" y2="-12" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>