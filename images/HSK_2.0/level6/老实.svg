<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Plant Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lamp Glow Background Effect -->
  <circle cx="120" cy="80" r="100" fill="url(#lampGlow)" />

  <!-- Background Environment & Props -->
  <g id="environment">
    <!-- Window with Night Scene & Stars -->
    <rect x="150" y="25" width="60" height="75" rx="8" fill="#090d16" stroke="#475569" stroke-width="2" />
    <line x1="180" y1="25" x2="180" y2="100" stroke="#475569" stroke-width="2" />
    <line x1="150" y1="62" x2="210" y2="62" stroke="#475569" stroke-width="2" />
    <!-- Cute Stars Outside -->
    <circle cx="165" cy="40" r="1.5" fill="#f8fafc" opacity="0.8" />
    <circle cx="195" cy="45" r="1" fill="#f8fafc" opacity="0.6" />
    <circle cx="170" cy="80" r="1" fill="#f8fafc" opacity="0.9" />

    <!-- Wall Shelf -->
    <rect x="25" y="45" width="85" height="6" rx="3" fill="#64748b" filter="url(#softShadow)" />

    <!-- Books on Shelf -->
    <path d="M35 45L35 28C35 26.8954 35.8954 26 37 26L43 26C44.1046 26 45 26.8954 45 28L45 45Z" fill="#10b981" />
    <path d="M47 45L47 31C47 29.8954 47.8954 29 48 29L55 29C56.1046 29 57 29.8954 57 31L57 45Z" fill="#f59e0b" />
    <path d="M59 45L59 25C59 23.8954 59.8954 23 61 23L68 23C69.1046 23 70 23.8954 70 25L70 45Z" fill="#ec4899" />

    <!-- Potted Plant on Shelf -->
    <path d="M85 45L88 35H98L101 45Z" fill="url(#potGrad)" />
    <!-- Plant Leaves -->
    <path d="M93 35C93 28 88 24 85 22C88 27 91 32 93 35Z" fill="#34d399" />
    <path d="M93 35C95 27 101 24 105 23C101 28 96 32 93 35Z" fill="#10b981" />
    <path d="M93 35C93 26 93 21 93 18C93 23 93 29 93 35Z" fill="#6ee7b7" />

    <!-- Hanging Warm Pendant Lamp -->
    <path d="M120 0L120 30" stroke="#94a3b8" stroke-width="2" />
    <path d="M105 30H135L140 40H100Z" fill="#cbd5e1" />
    <path d="M110 40C110 45 130 45 130 40Z" fill="#fbbf24" />

    <!-- Room Floor & Desk Surface -->
    <rect x="0" y="165" width="240" height="75" fill="#0f172a" />
    <!-- Wooden Desk -->
    <rect x="15" y="155" width="210" height="15" rx="4" fill="#3b2f2f" filter="url(#softShadow)" />
    <rect x="25" y="170" width="12" height="60" rx="3" fill="#2d2323" />
    <rect x="203" y="170" width="12" height="60" rx="3" fill="#2d2323" />
  </g>

  <!-- Desk Props (Showing Honesty/Care/Hardwork context) -->
  <g id="desk-props">
    <!-- Open Journal/Ledger -->
    <path d="M135 155C135 150 145 147 165 147C185 147 195 150 195 155V155C195 155 185 153 165 153C145 153 135 155 135 155Z" fill="#f8fafc" />
    <path d="M136 151H163V155H136Z" fill="#cbd5e1" />
    <path d="M167 151H194V155H167Z" fill="#cbd5e1" />
    <!-- Mug with Hot Steam -->
    <rect x="60" y="138" width="18" height="18" rx="4" fill="#f8fafc" />
    <path d="M78 143C82 143 82 151 78 151" stroke="#f8fafc" stroke-width="2" fill="none" />
    <path d="M66 132C66 128 69 127 67 124" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Warm Golden Badge/Heart Symbol representing "Lǎoshi" (Honest, Good-hearted) -->
    <g transform="translate(165, 115) scale(0.9)" filter="url(#softShadow)">
      <path d="M0 -6C-6 -14 -18 -6 -12 3C-6 10 0 16 0 16C0 16 6 10 12 3C18 -6 6 -14 0 -6Z" fill="#f59e0b" />
      <circle cx="0" cy="1" r="10" fill="none" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="3, 2" />
    </g>
  </g>

  <!-- Main Character: The "Lǎoshi Rén" (Kind, Honest, Trustworthy Person) -->
  <g id="character" filter="url(#softShadow)">
    <!-- Character Body / Torso -->
    <path d="M95 160C95 135 105 130 120 130C135 130 145 135 145 160V160H95Z" fill="url(#shirtGrad)" />
    <!-- Collar -->
    <path d="M110 130L120 142L130 130H110Z" fill="#f8fafc" />

    <!-- Friendly, Expressive Face & Head -->
    <!-- Neck -->
    <rect x="113" y="120" width="14" height="13" fill="#ffedd5" />

    <!-- Head Base -->
    <circle cx="120" cy="98" r="24" fill="#ffedd5" />

    <!-- Neat, Simple Hair Style -->
    <path d="M97 100C96 82 108 74 120 74C132 74 144 82 143 100C141 94 135 91 120 91C105 91 99 94 97 100Z" fill="#334155" />

    <!-- Warm, Sincere Expression (Gentle curved eyes, open friendly smile, rosy cheeks) -->
    <!-- Rosy Cheeks -->
    <circle cx="106" cy="103" r="3.5" fill="#fca5a5" opacity="0.6" />
    <circle cx="134" cy="103" r="3.5" fill="#fca5a5" opacity="0.6" />

    <!-- Eyes (Friendly crescents looking forward with honest warmth) -->
    <path d="M109 95C111 93 115 93 117 95" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M123 95C125 93 129 93 131 95" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Gentle Smile -->
    <path d="M116 104C118 107 122 107 124 104" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Open Hands Gesturing Warm Openness / Honesty -->
    <!-- Left Hand (Open palm facing inward/upward) -->
    <circle cx="88" cy="148" r="6" fill="#ffedd5" />
    <!-- Right Hand -->
    <circle cx="152" cy="148" r="6" fill="#ffedd5" />
  </g>

  <!-- Foreground Atmospheric Details -->
  <!-- Subtle glowing particles floating gently -->
  <circle cx="50" cy="90" r="1" fill="#fde047" opacity="0.5" />
  <circle cx="70" cy="70" r="1.5" fill="#fde047" opacity="0.7" />
  <circle cx="190" cy="120" r="1.5" fill="#fde047" opacity="0.6" />
  <circle cx="175" cy="170" r="1" fill="#fde047" opacity="0.4" />
</svg>