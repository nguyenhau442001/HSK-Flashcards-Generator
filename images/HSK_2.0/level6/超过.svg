<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Thermometer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sun Ray Gradient -->
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Heat Wave Gradient -->
    <linearGradient id="heat-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background elements -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.1" />
  <circle cx="60" cy="180" r="60" fill="#38bdf8" opacity="0.05" />

  <!-- Context Scene: Outdoor Patio / Wall -->
  <rect x="30" y="30" width="180" height="180" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- Heat Waves Background Effect -->
  <path d="M70 140 Q80 120 70 100 T70 60" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  <path d="M170 150 Q180 130 170 110 T170 70" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.3" />

  <!-- Sun Graphic in Background (Hot day) -->
  <circle cx="185" cy="55" r="18" fill="url(#sun-grad)" />
  <path d="M185 30 L185 22 M185 80 L185 88 M160 55 L152 55 M210 55 L218 55 M167 37 L161 31 M203 73 L209 79 M167 73 L161 79 M203 37 L209 31" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Plant Wilting from Heat (Context) -->
  <path d="M55 180 Q65 160 60 140" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M63 155 Q50 150 52 140 Q62 142 63 155" fill="#059669" />
  <path d="M58 168 Q75 165 72 155 Q60 160 58 168" fill="#059669" />
  <!-- Small pot -->
  <path d="M45 180 L65 180 L62 200 L48 200 Z" fill="#64748b" />
  <ellipse cx="55" cy="180" rx="10" ry="3" fill="#94a3b8" />

  <!-- MAIN SUBJECT: Thermometer -->
  <!-- Thermometer Backplate / Mounting Wall Strip -->
  <rect x="110" y="45" width="20" height="150" rx="10" fill="#334155" />
  <rect x="114" y="49" width="12" height="142" rx="6" fill="#0f172a" />

  <!-- Temperature Scale Marks -->
  <!-- 40 Marks -->
  <line x1="114" y1="70" x2="120" y2="70" stroke="#94a3b8" stroke-width="1.5" />
  <!-- 30 Marks (Threshold) -->
  <line x1="114" y1="100" x2="122" y2="100" stroke="#ef4444" stroke-width="2" />
  <line x1="114" y1="130" x2="120" y2="130" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="114" y1="160" x2="120" y2="160" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Thermometer Mercury Tube -->
  <rect x="118" y="55" width="4" height="125" rx="2" fill="#1e293b" />

  <!-- Rising Mercury (Surpassing 30) -->
  <!-- Base bulb -->
  <circle cx="120" cy="175" r="10" fill="#ef4444" filter="url(#glow)" />
  <!-- Liquid Column -->
  <rect x="118" y="65" width="4" height="110" rx="2" fill="url(#heat-grad)" filter="url(#glow)" />

  <!-- Glass Highlight Overlay -->
  <path d="M116 57 A 4 4 0 0 1 120 55 A 4 4 0 0 1 124 57 L 124 170 A 2 2 0 0 1 122 172 L 118 172 A 2 2 0 0 1 116 170 Z" fill="#ffffff" opacity="0.15" />

  <!-- DYNAMIC ACTION: "Vượt qua" (Exceeding / Bursting top indicator) -->
  <!-- Warning pulse rings around the top -->
  <circle cx="120" cy="62" r="16" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4" stroke-dasharray="4 2">
    <animate attributeName="r" values="12;22;12" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Glowing Alert Arrow pointing UP and OUT (Exceeding concept) -->
  <g transform="translate(145, 55)">
    <!-- Arrow background pill -->
    <rect x="-6" y="-14" width="45" height="28" rx="14" fill="#ef4444" filter="url(#glow)" />
    <!-- Arrow icon -->
    <path d="M5 6 L14 -3 L23 6 M14 -3 L14 15" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkles / Energy bursts for exceeding limit -->
  <path d="M100 85 L104 89 L100 93 L96 89 Z" fill="#fbbf24" />
  <path d="M142 105 L145 108 L142 111 L139 108 Z" fill="#fbbf24" />
  <circle cx="103" cy="65" r="2.5" fill="#f87171" />

  <!-- Cute Fan in foreground to show extreme heat context -->
  <g transform="translate(85, 175)">
    <!-- Fan Base -->
    <ellipse cx="0" cy="20" rx="12" ry="5" fill="#475569" />
    <path d="M-3 20 L-1 5 L1 5 L3 20 Z" fill="#64748b" />
    <!-- Fan Head -->
    <circle cx="0" cy="0" r="14" fill="#38bdf8" />
    <!-- Blades -->
    <path d="M0 0 Q-10 -15 -5 -18 Q3 -10 0 0" fill="#bae6fd" opacity="0.9" />
    <path d="M0 0 Q10 15 5 18 Q-3 10 0 0" fill="#bae6fd" opacity="0.9" />
    <path d="M0 0 Q15 -10 18 -5 Q10 3 0 0" fill="#bae6fd" opacity="0.9" />
    <path d="M0 0 Q-15 10 -18 5 Q-10 -3 0 0" fill="#bae6fd" opacity="0.9" />
    <circle cx="0" cy="0" r="3" fill="#0284c7" />
    <!-- Wind lines coming off fan -->
    <path d="M-20 -5 L-27 -7" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M-22 3 L-30 5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>