<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Moonlight Gradient -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Filter for soft shadows -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior & Background Props -->
  <!-- Window showing late night / moon -->
  <g transform="translate(160, 20)">
    <rect width="55" height="75" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <rect x="4" y="4" width="47" height="67" fill="url(#moonlight)"/>
    <!-- Window pane grid -->
    <line x1="27" y1="4" x2="27" y2="71" stroke="#334155" stroke-width="2"/>
    <line x1="4" y1="37" x2="51" y2="37" stroke="#334155" stroke-width="2"/>
    <!-- Crescent Moon outside -->
    <path d="M 38 18 A 10 10 0 0 1 25 28 A 12 12 0 0 0 38 18 Z" fill="#cbd5e1" opacity="0.8"/>
  </g>

  <!-- Bookshelf in background with stacked books -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="45" height="8" rx="2" fill="#334155" />
    <path d="M 5 0 L 5 -18 L 14 -18 L 14 0 Z" fill="#ef4444" />
    <path d="M 16 0 L 16 -14 L 25 -14 L 25 0 Z" fill="#10b981" />
    <path d="M 27 0 L 27 -20 L 38 -20 L 38 0 Z" fill="#f59e0b" />
    
    <rect x="0" y="40" width="45" height="8" rx="2" fill="#334155" />
    <path d="M 5 40 L 5 25 L 40 25 L 40 40 Z" fill="#475569" opacity="0.5"/>
    <circle cx="22" cy="32" r="3" fill="#cbd5e1" />
  </g>

  <!-- Desk Surface -->
  <rect x="25" y="165" width="190" height="12" rx="4" fill="url(#desk-grad)" filter="url(#soft-shadow)" />
  <rect x="35" y="177" width="15" height="40" fill="#1e293b" />
  <rect x="190" y="177" width="15" height="40" fill="#1e293b" />

  <!-- Study Lamp casting light -->
  <path d="M 175 165 L 180 110 L 195 110 L 200 165 Z" fill="#334155" />
  <path d="M 165 95 Q 187 80 205 105 Z" fill="#fbbf24" filter="url(#soft-shadow)" />
  <circle cx="185" cy="100" r="85" fill="url(#lamp-glow)" pointer-events="none" />

  <!-- Study Materials on Desk (Hard work context) -->
  <!-- Stack of notebooks and reference books -->
  <g transform="translate(45, 145)">
    <rect x="0" y="12" width="45" height="8" rx="2" fill="#64748b" />
    <rect x="-2" y="6" width="48" height="8" rx="2" fill="#38bdf8" />
    <rect x="2" y="0" width="42" height="8" rx="2" fill="#f43f5e" />
    <!-- Open book with notes -->
    <path d="M 55 20 Q 75 10 95 20 L 95 5 L 75 -2 L 55 5 Z" fill="#f8fafc" />
    <path d="M 75 -2 L 75 15" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Scribble lines representing intense study/notes -->
    <line x1="60" y1="8" x2="70" y2="7" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="60" y1="12" x2="68" y2="11" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="80" y1="8" x2="90" y2="9" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="80" y1="13" x2="88" y2="14" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Coffee Mug (Late night studying) -->
  <g transform="translate(145, 142)">
    <rect x="0" y="5" width="14" height="18" rx="3" fill="#e2e8f0" />
    <path d="M 14 9 C 19 9 19 19 14 19" fill="none" stroke="#e2e8f0" stroke-width="2.5" />
    <!-- Steam lines -->
    <path d="M 4 0 Q 7 -5 4 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 10 2 Q 13 -3 10 -8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Main Character (Diligent Student - 刻苦) -->
  <g transform="translate(85, 80)">
    <!-- Chair Back -->
    <rect x="-15" y="10" width="22" height="80" rx="6" fill="#334155" />

    <!-- Character Body / Torso leaning forward intently -->
    <path d="M -5 45 Q 15 35 35 65 L 55 95 L -10 95 Z" fill="url(#shirt-grad)" filter="url(#soft-shadow)" />
    
    <!-- Arms leaning on desk, focused -->
    <!-- Left arm holding pen / writing -->
    <path d="M 10 50 Q 30 55 45 70" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <circle cx="46" cy="72" r="6" fill="#fcd34d" /> <!-- Hand -->
    <!-- Pen -->
    <line x1="46" y1="72" x2="56" y2="82" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Right arm supporting head/thoughtful posture -->
    <path d="M 5 45 Q 25 30 15 55" fill="none" stroke="#38bdf8" stroke-width="11" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M 5 28 L 15 38" stroke="#fcd34d" stroke-width="10" stroke-linecap="round" />

    <!-- Head focused downward (hard at work) -->
    <g transform="translate(18, 22) rotate(15)">
      <!-- Hair -->
      <path d="M -12 -5 C -12 -22 10 -25 18 -10 C 24 -2 22 12 10 15 C 0 16 -10 10 -12 -5 Z" fill="#1e293b" />
      <!-- Face -->
      <path d="M -8 -2 C -8 12 12 12 15 -2 C 16 -10 0 -12 -8 -2 Z" fill="#fcd34d" />
      <!-- Concentrated Eyebrow & Eyes (Focused expression) -->
      <line x1="-2" y1="2" x2="6" y2="4" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="4" cy="7" r="2" fill="#1e293b" />
      <!-- Focused mouth line -->
      <path d="M 6 13 Q 10 14 13 12" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
      
      <!-- Glasses for studious look -->
      <rect x="0" y="3" width="8" height="6" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5" />
    </g>
  </g>

  <!-- Sparkles / Sweat drop of intense effort (Subtle and classy) -->
  <g transform="translate(125, 82)">
    <path d="M 0 0 C 3 4 3 8 0 10 C -3 8 -3 4 0 0 Z" fill="#38bdf8" opacity="0.8" />
  </g>
  <g transform="translate(60, 40)">
    <!-- Sparkle indicating hard work / breakthrough -->
    <path d="M 0 8 Q 8 8 8 0 Q 8 -8 0 -8 Q -8 -8 -8 0 Q -8 8 0 8 Z" fill="#fbbf24" opacity="0.6" transform="scale(0.5)" />
  </g>

</svg>