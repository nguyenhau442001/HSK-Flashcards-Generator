<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Ring Glow Gradient -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Fighter Gradients -->
    <linearGradient id="blueSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="blueGlove" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Right Fighter Gradients -->
    <linearGradient id="orangeSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="orangeGlove" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Impact Flash Gradient -->
    <radialGradient id="impactFlash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Grid Pattern -->
    <clipPath id="floorClip">
      <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z"/>
    </clipPath>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient lighting & spotlight -->
  <circle cx="120" cy="120" r="110" fill="url(#ringGlow)" pointer-events="none"/>

  <!-- Stadium Ropes & Background Elements -->
  <g opacity="0.25">
    <line x1="20" y1="80" x2="220" y2="80" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
    <line x1="10" y1="110" x2="230" y2="110" stroke="#fb923c" stroke-width="2" stroke-dasharray="8 4"/>
    <line x1="20" y1="140" x2="220" y2="140" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
  </g>

  <!-- Canvas Floor (Perspective Arena) -->
  <g clip-path="url(#floorClip)">
    <polygon points="0,160 240,160 260,240 -20,240" fill="#090d16"/>
    <!-- Floor perspective grid lines -->
    <line x1="120" y1="160" x2="120" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="160" x2="20" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="160" x2="220" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="160" x2="-40" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.3"/>
    <line x1="120" y1="160" x2="280" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.3"/>
    <!-- Center ring marker -->
    <ellipse cx="120" cy="180" rx="50" ry="12" fill="none" stroke="#475569" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Shadow under fighters -->
  <ellipse cx="90" cy="175" rx="35" ry="10" fill="#020617" opacity="0.6"/>
  <ellipse cx="150" cy="175" rx="35" ry="10" fill="#020617" opacity="0.6"/>

  <!-- ==================== LEFT FIGHTER (Blue - Duìshǒu) ==================== -->
  <g id="blueFighter">
    <!-- Back Foot/Leg -->
    <path d="M 70 170 L 60 145 L 75 145 L 85 170 Z" fill="#0369a1"/>
    <ellipse cx="65" cy="172" rx="10" ry="5" fill="#0284c7"/>

    <!-- Torso (Dynamic lean) -->
    <path d="M 75 110 L 105 115 L 95 155 L 65 145 Z" fill="url(#blueSuit)"/>

    <!-- Head & Hair -->
    <circle cx="85" cy="92" r="14" fill="#fbcfe8"/>
    <!-- Skin tone/face profile -->
    <path d="M 90 85 Q 98 92 92 100 Q 85 102 80 98 Z" fill="#f43f5e" opacity="0.15"/>
    <!-- Hair Spikes -->
    <path d="M 72 90 L 68 80 L 80 84 L 84 75 L 92 82 L 98 88 Z" fill="#0f172a"/>

    <!-- Front Arm & Punching Glove (Action Pose) -->
    <path d="M 95 115 L 125 110 L 130 120 L 100 130 Z" fill="url(#blueSuit)"/>
    <!-- Huge Action Glove -->
    <circle cx="138" cy="116" r="16" fill="url(#blueGlove)"/>
    <!-- Glove highlight -->
    <path d="M 132 108 Q 140 106 145 112" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Back Arm (Guarding) -->
    <path d="M 75 115 L 65 130 L 75 135 Z" fill="#0284c7"/>
    <circle cx="70" cy="138" r="10" fill="url(#blueGlove)"/>

    <!-- Front Leg (Planted/Dashing) -->
    <path d="M 90 145 L 105 175 L 90 178 L 80 150 Z" fill="#38bdf8"/>
    <ellipse cx="102" cy="178" rx="12" ry="6" fill="#0284c7"/>
  </g>

  <!-- ==================== RIGHT FIGHTER (Orange - Duìshǒu) ==================== -->
  <g id="orangeFighter">
    <!-- Back Foot/Leg -->
    <path d="M 170 170 L 180 145 L 165 145 L 155 170 Z" fill="#c2410c"/>
    <ellipse cx="175" cy="172" rx="10" ry="5" fill="#ea580c"/>

    <!-- Torso (Dynamic lean) -->
    <path d="M 165 110 L 135 115 L 145 155 L 175 145 Z" fill="url(#orangeSuit)"/>

    <!-- Head & Hair -->
    <circle cx="155" cy="92" r="14" fill="#fed7aa"/>
    <!-- Hair Spikes -->
    <path d="M 168 90 L 172 80 L 160 84 L 156 75 L 148 82 L 142 88 Z" fill="#0f172a"/>

    <!-- Front Arm & Punching Glove (Action Punch) -->
    <path d="M 145 115 L 115 110 L 110 120 L 140 130 Z" fill="url(#orangeSuit)"/>
    <!-- Huge Action Glove -->
    <circle cx="102" cy="116" r="16" fill="url(#orangeGlove)"/>
    <!-- Glove highlight -->
    <path d="M 108 108 Q 100 106 95 112" stroke="#ffedd5" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Back Arm (Guarding) -->
    <path d="M 165 115 L 175 130 L 165 135 Z" fill="#ea580c"/>
    <circle cx="170" cy="138" r="10" fill="url(#orangeGlove)"/>

    <!-- Front Leg (Planted/Dashing) -->
    <path d="M 150 145 L 135 175 L 150 178 L 160 150 Z" fill="#fb923c"/>
    <ellipse cx="138" cy="178" rx="12" ry="6" fill="#ea580c"/>
  </g>

  <!-- ==================== IMPACT & ACTION EFFECTS ==================== -->
  <!-- Center Collision Flash where gloves meet -->
  <circle cx="120" cy="116" r="24" fill="url(#impactFlash)"/>

  <!-- Dynamic Starburst/Impact Lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="120" y1="92" x2="120" y2="80"/>
    <line x1="120" y1="140" x2="120" y2="152"/>
    <line x1="96" y1="116" x2="84" y2="116"/>
    <line x1="144" y1="116" x2="156" y2="116"/>
    <line x1="103" y1="99" x2="94" y2="90"/>
    <line x1="137" y1="133" x2="146" y2="142"/>
    <line x1="137" y1="99" x2="146" y2="90"/>
    <line x1="103" y1="133" x2="94" y2="142"/>
  </g>

  <!-- Floating Speed Lines / Action Marks -->
  <path d="M 35 70 L 65 70" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 25 85 L 50 85" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 175 70 L 205 70" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 190 85 L 215 85" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Energy particles (dots) -->
  <circle cx="75" cy="55" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="165" cy="60" r="2" fill="#fb923c" opacity="0.8"/>
  <circle cx="105" cy="75" r="2" fill="#fef08a" opacity="0.9"/>
  <circle cx="135" cy="70" r="3.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="50" cy="130" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="190" cy="125" r="2.5" fill="#fb923c" opacity="0.5"/>

  <!-- Dramatic top rim light -->
  <path d="M 24 24 L 216 24" stroke="url(#blueSuit)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>