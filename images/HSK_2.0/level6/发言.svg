<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Podium Gradient -->
    <linearGradient id="podium-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="podium-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Speech Waveform Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100% " stop-color="#059669"/>
    </linearGradient>
    
    <!-- Screen/Board Gradient -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Scene Background Details (Conference Room Ambient) -->
  <g opacity="0.3">
    <!-- Ambient Wall Panel Lines -->
    <line x1="0" y1="50" x2="240" y2="50" stroke="#475569" stroke-width="1"/>
    <line x1="0" y1="120" x2="240" y2="120" stroke="#475569" stroke-width="0.5"/>
    
    <!-- Large Presentation Screen -->
    <rect x="50" y="25" width="140" height="75" rx="4" fill="url(#screen-grad)" stroke="#475569" stroke-width="2"/>
    <!-- Abstract Presentation Charts on Screen -->
    <polyline points="70,80 90,65 110,72 130,45 150,55 170,40" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="130" cy="45" r="3" fill="#fbbf24"/>
    <circle cx="170" cy="40" r="3" fill="#10b981"/>
  </g>

  <!-- Atmospheric Spotlight Effect -->
  <path d="M 120,0 L 40,210 L 200,210 Z" fill="#ffffff" opacity="0.03"/>

  <!-- Sound Waves / Speech Projection (Action-packed 'phát biểu' element) -->
  <g filter="url(#glow)">
    <!-- Expanding Arcs representing speech -->
    <path d="M 102,100 C 90,90 90,70 102,60" fill="none" stroke="url(#wave-grad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 94,108 C 76,90 76,60 94,42" fill="none" stroke="url(#wave-grad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 86,116 C 62,90 62,50 86,24" fill="none" stroke="url(#wave-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <path d="M 138,100 C 150,90 150,70 138,60" fill="none" stroke="url(#wave-grad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 146,108 C 164,90 164,60 146,42" fill="none" stroke="url(#wave-grad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 154,116 C 178,90 178,50 154,24" fill="none" stroke="url(#wave-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Floating Energy Particles / Sparkles -->
    <circle cx="70" cy="70" r="2.5" fill="#fbbf24"/>
    <circle cx="170" cy="65" r="2" fill="#38bdf8"/>
    <circle cx="95" cy="35" r="1.5" fill="#ec4899"/>
    <circle cx="145" cy="40" r="2" fill="#10b981"/>
  </g>

  <!-- Speaker Character (Upper Body & Gesturing) -->
  <g id="speaker-character">
    <!-- Torso & Shirt -->
    <path d="M 95,175 L 145,175 L 155,225 L 85,225 Z" fill="url(#shirt-grad)"/>
    <!-- Collar & Tie -->
    <polygon points="120,175 125,195 120,205 115,195" fill="#ef4444"/>
    <path d="M 105,175 L 120,188 L 135,175" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- Neck -->
    <rect x="112" y="158" width="16" height="22" fill="#fcd34d" rx="4"/>

    <!-- Head -->
    <circle cx="120" cy="138" r="22" fill="#f59e0b"/>
    <!-- Friendly Face / Expression (Confident, Speaking) -->
    <!-- Hair (Stylish Modern Cut) -->
    <path d="M 98,135 C 98,120 110,112 120,112 C 132,112 142,120 142,135 C 142,135 142,140 140,140 C 138,140 137,132 135,130 C 128,125 112,125 105,130 C 102,133 98,135 98,135 Z" fill="#0f172a"/>
    
    <!-- Eyes (Focused and energetic) -->
    <circle cx="112" cy="136" r="2.5" fill="#0f172a"/>
    <circle cx="128" cy="136" r="2.5" fill="#0f172a"/>
    <!-- Eyebrows (Dynamic tilt) -->
    <line x1="108" y1="131" x2="116" y2="132" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="124" y1="132" x2="132" y2="131" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Open Enthusiastic Mouth (Speaking/Phát biểu) -->
    <path d="M 115,145 Q 120,154 125,145 Z" fill="#b91c1c"/>

    <!-- Gesturing Arm (Raising hand emphatically) -->
    <!-- Left Arm (Resting on podium) -->
    <path d="M 95,180 Q 80,195 90,210" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Arm (Raised in energetic expression) -->
    <path d="M 145,180 Q 165,160 160,135" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Hand -->
    <circle cx="160" cy="130" r="6" fill="#f59e0b"/>
  </g>

  <!-- Podium & Mic Setup (Foreground Context) -->
  <g id="podium-and-props">
    <!-- Microphone Stand & Gooseneck -->
    <path d="M 120,165 L 120,145 Q 120,130 112,125" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Microphone Head -->
    <ellipse cx="110" cy="122" rx="4" ry="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <path d="M 108,120 L 112,124" stroke="#475569" stroke-width="1"/>

    <!-- Podium Body -->
    <path d="M 95,165 L 145,165 L 155,230 L 85,230 Z" fill="url(#podium-front)"/>
    <!-- Podium Top (3D perspective cap) -->
    <polygon points="85,165 155,165 147,157 93,157" fill="url(#podium-grad)" stroke="#60a5fa" stroke-width="1"/>

    <!-- Glowing Accent Strip on Podium -->
    <polygon points="112,175 128,175 126,220 114,220" fill="#38bdf8" opacity="0.6" filter="url(#glow)"/>
  </g>

  <!-- Conference Table / Base Surface Line -->
  <rect x="0" y="226" width="240" height="14" fill="#0f172a"/>
  <line x1="0" y1="226" x2="240" y2="226" stroke="#334155" stroke-width="2"/>
</svg>