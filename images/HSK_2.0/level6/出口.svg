<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Exit Light Glow -->
    <radialGradient id="exitGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Door Light Stream -->
    <linearGradient id="lightStream" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Exit Glow -->
  <rect width="240" height="240" rx="24" fill="url(#exitGlow)" />

  <!-- Back Wall & Tunnel Structure -->
  <!-- Inner Corridor/Doorway depth -->
  <polygon points="75,45 165,45 155,195 85,195" fill="#090d16" />

  <!-- Bright Exterior Light (The "Outside" world) -->
  <path d="M 85,45 L 155,45 L 155,195 L 85,195 Z" fill="#475569" />
  <path d="M 90,45 L 150,45 L 150,195 L 90,195" fill="url(#lightStream)" />

  <!-- Sunbeams / Outside Atmosphere -->
  <path d="M 120,45 L 70,195 L 85,195 Z" fill="#fef08a" opacity="0.15" />
  <path d="M 120,45 L 170,195 L 155,195 Z" fill="#fef08a" opacity="0.15" />

  <!-- Door Frame Arch / Structure -->
  <path d="M 60,30 L 180,30 L 170,205 L 70,205 Z" fill="none" stroke="#334155" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)" />
  <rect x="68" y="38" width="104" height="167" fill="none" stroke="#475569" stroke-width="2" />

  <!-- Architectural Walls (Sides) -->
  <!-- Left Wall -->
  <polygon points="0,0 75,45 75,195 0,240" fill="#1e293b" />
  <!-- Left Wall Details (Panels/Bricks) -->
  <line x1="0" y1="30" x2="75" y2="75" stroke="#334155" stroke-width="2" opacity="0.5" />
  <line x1="0" y1="100" x2="75" y2="135" stroke="#334155" stroke-width="2" opacity="0.5" />
  <line x1="0" y1="180" x2="75" y2="200" stroke="#334155" stroke-width="2" opacity="0.5" />

  <!-- Right Wall -->
  <polygon points="240,0 165,45 165,195 240,240" fill="#0f172a" />
  <!-- Right Wall Details -->
  <line x1="240" y1="30" x2="165" y2="75" stroke="#1e293b" stroke-width="2" opacity="0.8" />
  <line x1="240" y1="100" x2="165" y2="135" stroke="#1e293b" stroke-width="2" opacity="0.8" />
  <line x1="240" y1="180" x2="165" y2="200" stroke="#1e293b" stroke-width="2" opacity="0.8" />

  <!-- Floor -->
  <polygon points="0,240 75,195 165,195 240,240" fill="url(#floorGrad)" />
  <!-- Floor Tile Lines -->
  <line x1="120" y1="195" x2="120" y2="240" stroke="#475569" stroke-width="1.5" opacity="0.6" />
  <line x1="95" y1="210" x2="165" y2="210" stroke="#475569" stroke-width="1" opacity="0.4" />
  <line x1="80" y1="225" x2="185" y2="225" stroke="#475569" stroke-width="1" opacity="0.4" />

  <!-- OVERHEAD EXIT SIGN (Universal symbol of 'Exit' without text) -->
  <g filter="url(#shadow)">
    <!-- Sign Bracket -->
    <rect x="115" y="10" width="10" height="15" fill="#64748b" rx="2" />
    
    <!-- Sign Box (Glowing Green) -->
    <rect x="90" y="20" width="60" height="26" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2" />
    
    <!-- Running Figure Icon inside Sign -->
    <g transform="translate(100, 24) scale(0.6)">
      <!-- Head -->
      <circle cx="12" cy="7" r="3.5" fill="#34d399" />
      <!-- Body/Torso in motion -->
      <path d="M 10,13 L 15,18 L 12,24" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Arms -->
      <path d="M 8,15 L 14,13 L 17,16" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Legs -->
      <path d="M 12,24 L 8,28 M 12,24 L 16,27" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Directional Arrow inside Sign -->
    <g transform="translate(132, 26) scale(0.7)">
      <path d="M 2,8 L 12,8 M 8,4 L 13,8 L 8,12" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Environment Props: Emergency Light on Wall -->
  <g transform="translate(45, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="16" height="12" rx="3" fill="#475569" />
    <circle cx="5" cy="6" r="3" fill="#f87171" />
    <circle cx="11" cy="6" r="3" fill="#f87171" />
    <!-- Emergency Light Glow -->
    <circle cx="5" cy="6" r="6" fill="#f87171" opacity="0.3" />
    <circle cx="11" cy="6" r="6" fill="#f87171" opacity="0.3" />
  </g>

  <!-- Safety Railing near the Exit -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" filter="url(#shadow)">
    <!-- Left Railing -->
    <line x1="75" y1="195" x2="60" y2="215" />
    <line x1="60" y1="215" x2="55" y2="240" />
    <path d="M 68,205 L 53,230" fill="none" stroke-width="2" />
    
    <!-- Right Railing -->
    <line x1="165" y1="195" x2="180" y2="215" />
    <line x1="180" y1="215" x2="185" y2="240" />
    <path d="M 172,205 L 187,230" fill="none" stroke-width="2" />
  </g>

  <!-- Action Element: Energetic Character walking towards the exit -->
  <g transform="translate(125, 140)" filter="url(#shadow)">
    <!-- Backpack -->
    <rect x="-10" y="5" width="8" height="14" rx="3" fill="#ea580c" />
    
    <!-- Body / Torso (leaning forward into movement) -->
    <path d="M -6,4 L 4,14 L 0,26 L -8,22 Z" fill="#38bdf8" />
    
    <!-- Head -->
    <circle cx="2" cy="-3" r="6" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M -4,-6 C 2,-9 7,-4 6,-2 C 5,-2 4,-5 1,-5 Z" fill="#1e293b" />
    
    <!-- Arms (Dynamic swing) -->
    <!-- Back Arm -->
    <path d="M -4,8 L -12,14" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <!-- Front Arm -->
    <path d="M 2,9 L 9,15" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Legs (Walking stride) -->
    <!-- Back Leg -->
    <path d="M -4,24 L -10,35 L -14,37" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Leg -->
    <path d="M -2,24 L 5,34 L 10,33" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Atmospheric Floor Reflection of the Exit Light -->
  <ellipse cx="120" cy="205" rx="35" ry="8" fill="#fbbf24" opacity="0.3" filter="url(#shadow)" />

  <!-- Foreground Vignette / Frame border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.4" />
</svg>