<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Red Carpet -->
  <path d="M0 190 L240 190 L220 240 L-20 240 Z" fill="#9f1239"/>
  <path d="M0 190 L240 190 L230 215 L10 215 Z" fill="#e11d48"/>
  
  <!-- Background Architecture (State Building) -->
  <rect x="40" y="80" width="160" height="110" rx="4" fill="#334155"/>
  <rect x="60" y="100" width="30" height="40" rx="2" fill="#475569"/>
  <rect x="150" y="100" width="30" height="40" rx="2" fill="#475569"/>
  <rect x="100" y="150" width="40" height="40" rx="2" fill="#1e293b"/>
  
  <!-- President Figure -->
  <g transform="translate(100, 120)">
    <ellipse cx="20" cy="20" rx="12" ry="12" fill="#fde68a"/>
    <rect x="12" y="32" width="16" height="40" rx="4" fill="#1e3a8a"/>
    <rect x="14" y="32" width="12" height="35" rx="2" fill="#2563eb"/>
    <path d="M12 40 L5 50 L12 45 Z" fill="#1e3a8a"/>
    <path d="M28 40 L35 50 L28 45 Z" fill="#1e3a8a"/>
    <rect x="16" y="72" width="4" height="25" rx="2" fill="#1e3a8a"/>
    <rect x="20" y="72" width="4" height="25" rx="2" fill="#1e3a8a"/>
  </g>
  
  <!-- Diplomat/Greeter -->
  <g transform="translate(160, 130)">
    <ellipse cx="15" cy="15" rx="10" ry="10" fill="#fde68a"/>
    <rect x="8" y="25" width="14" height="45" rx="4" fill="#065f46"/>
    <rect x="10" y="25" width="10" height="40" rx="2" fill="#059669"/>
  </g>
  
  <!-- Spotlight Glow -->
  <circle cx="120" cy="150" r="60" fill="url(#glow)" opacity="0.2"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  
  <!-- Flags -->
  <rect x="30" y="60" width="4" height="80" fill="#94a3b8"/>
  <rect x="34" y="60" width="20" height="15" fill="#fb923c"/>
  <rect x="190" y="60" width="4" height="80" fill="#94a3b8"/>
  <rect x="170" y="60" width="20" height="15" fill="#38bdf8"/>
</svg>