<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="desk-glow" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Storm Cloud Gradient -->
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="cloud-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#desk-glow)" />

  <!-- ENVIRONMENT / BACKGROUND PROPS -->
  <!-- Wooden Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#090d16" />
  <path d="M 0 170 L 240 170 L 240 176 L 0 176 Z" fill="#334155" opacity="0.3" />

  <!-- Cozy Desk Lamp (Warm backdrop prop) -->
  <path d="M 200 170 L 210 110 L 225 110 L 215 170 Z" fill="#475569" />
  <path d="M 195 170 L 230 170 L 225 176 L 200 176 Z" fill="#64748b" rx="2" />
  <path d="M 210 110 C 190 90, 190 60, 210 40 C 230 60, 230 90, 210 110 Z" fill="#f59e0b" opacity="0.8" filter="url(#shadow)" />
  <ellipse cx="210" cy="75" rx="12" ry="18" fill="#fbbf24" />

  <!-- Coffee Mug of Stress (Warm accent, steaming) -->
  <path d="M 45 145 C 45 138 52 135 60 135 C 68 135 75 138 75 145 L 72 170 C 72 173 68 175 60 175 C 52 175 48 173 48 170 Z" fill="#38bdf8" filter="url(#shadow)" />
  <path d="M 75 142 C 84 142, 84 162, 75 162" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <!-- Steam lines -->
  <path d="M 54 125 C 50 118, 60 112, 56 105" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 66 122 C 70 116, 62 110, 66 102" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Scattered Papers / Documents (Work pressure context) -->
  <g transform="rotate(-12 80 155)">
    <rect x="70" y="140" width="35" height="45" rx="2" fill="#f8fafc" opacity="0.9" />
    <line x1="76" y1="150" x2="98" y2="150" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="76" y1="160" x2="94" y2="160" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="76" y1="170" x2="88" y2="170" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <g transform="rotate(8 165 145)">
    <rect x="150" y="130" width="30" height="40" rx="2" fill="#e2e8f0" opacity="0.9" />
    <line x1="156" y1="140" x2="172" y2="140" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="156" y1="148" x2="168" y2="148" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- MAIN SUBJECT: PERSON OVERWHELMED ("Phiền muộn") -->
  <g id="stressed-character" filter="url(#shadow)">
    <!-- Body / Shoulders slumped forward -->
    <path d="M 85 170 C 85 140, 95 125, 120 125 C 145 125, 155 140, 155 170 Z" fill="#3b82f6" />
    
    <!-- Folded Arms resting on desk -->
    <path d="M 85 155 C 95 145, 145 145, 155 155 C 150 170, 90 170, 85 155 Z" fill="#2563eb" />
    
    <!-- Neck -->
    <path d="M 108 115 C 108 105, 132 105, 132 115 Z" fill="#fca5a5" />

    <!-- Head (Buried in arms, tilted downward) -->
    <circle cx="120" cy="115" r="28" fill="#f87171" />
    <circle cx="120" cy="115" r="28" fill="#fca5a5" />

    <!-- Messy Hair showing frustration -->
    <path d="M 94 110 C 90 95, 105 85, 120 90 C 135 85, 150 95, 146 110 C 152 100, 145 80, 125 82 C 105 80, 90 100, 94 110 Z" fill="#1e293b" />
    <!-- Spiky hair tufts -->
    <path d="M 115 85 C 112 72, 122 75, 120 84 Z" fill="#1e293b" />
    <path d="M 130 87 C 135 74, 145 80, 138 90 Z" fill="#1e293b" />
    <path d="M 102 90 C 95 78, 105 82, 108 94 Z" fill="#1e293b" />

    <!-- Hands clutching head / hair in anxiety -->
    <circle cx="102" cy="112" r="7" fill="#fca5a5" />
    <circle cx="138" cy="112" r="7" fill="#fca5a5" />
    <path d="M 98 115 C 95 105, 105 100, 108 110" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 142 115 C 145 105, 135 100, 132 110" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ATMOSPHERIC "PHIỀN MUỘN" (STORMY CLOUD & RAIN OVERHEAD) -->
  <g id="mental-storm" filter="url(#shadow)">
    <!-- Ambient Cloud Glow -->
    <ellipse cx="120" cy="55" rx="55" ry="25" fill="url(#cloud-glow)" />

    <!-- Dark Storm Cloud -->
    <path d="M 85 65 
             C 70 65, 65 50, 75 40 
             C 75 30, 90 25, 102 32 
             C 112 20, 132 20, 140 32 
             C 155 28, 168 40, 165 52 
             C 175 60, 170 75, 155 75 
             L 85 75 Z" fill="url(#cloud-grad)" />

    <!-- Lightning Bolt inside cloud (flash of anxiety) -->
    <polygon points="122,35 112,50 120,50 114,65 130,46 122,46" fill="#fbbf24" />

    <!-- Gloomy Raindrops / Tear-like falling elements representing inner turmoil -->
    <!-- Drop 1 -->
    <path d="M 95 85 C 95 85, 93 90, 93 93 C 93 95, 95 96, 97 96 C 99 96, 101 95, 101 93 C 101 90, 95 85, 95 85 Z" fill="#38bdf8" opacity="0.8" />
    <line x1="97" y1="98" x2="97" y2="102" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- Drop 2 -->
    <path d="M 145 82 C 145 82, 143 87, 143 90 C 143 92, 145 93, 147 93 C 149 93, 151 92, 151 90 C 151 87, 145 82, 145 82 Z" fill="#38bdf8" opacity="0.8" />
    <line x1="147" y1="95" x2="147" y2="99" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- Drop 3 (Center close to head) -->
    <path d="M 120 88 C 120 88, 118 93, 118 96 C 118 98, 120 99, 122 99 C 124 99, 126 98, 126 96 C 126 93, 120 88, 120 88 Z" fill="#38bdf8" opacity="0.9" />
    <line x1="122" y1="101" x2="122" y2="107" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Floating worry/stress sparkles (abstract visual indicators of mental weight) -->
  <path d="M 70 95 L 73 100 L 78 100 L 74 103 L 76 108 L 72 105 L 68 108 L 70 103 L 66 100 L 71 100 Z" fill="#cbd5e1" opacity="0.4" />
  <path d="M 175 105 L 177 109 L 181 109 L 178 111 L 179 115 L 175 113 L 171 115 L 172 111 L 169 109 L 173 109 Z" fill="#cbd5e1" opacity="0.3" transform="scale(0.8) translate(50, 20)" />

</svg>