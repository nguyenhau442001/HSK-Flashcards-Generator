<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="warmLamp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background Elements -->
  <!-- Floor -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- Window with tomorrow's sunset / sunrise vibe -->
  <rect x="140" y="30" width="70" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <rect x="145" y="35" width="60" height="100" fill="url(#windowGlow)" />
  <!-- Window panes grid -->
  <line x1="175" y1="35" x2="175" y2="135" stroke="#334155" stroke-width="2" />
  <line x1="145" y1="85" x2="205" y2="85" stroke="#334155" stroke-width="2" />
  <!-- Calendar on the wall showing 'Tomorrow' concept indirectly with a highlighted date box -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="36" height="42" rx="4" fill="#334155" />
    <rect x="0" y="0" width="36" height="12" fill="#ef4444" rx="4" />
    <circle cx="10" cy="6" r="2" fill="#cbd5e1" />
    <circle cx="26" cy="6" r="2" fill="#cbd5e1" />
    <!-- Grid dots representing days -->
    <circle cx="10" cy="22" r="2" fill="#64748b" />
    <circle cx="18" cy="22" r="2" fill="#64748b" />
    <circle cx="26" cy="22" r="2" fill="#64748b" />
    <circle cx="10" cy="32" r="3" fill="#38bdf8" />
    <circle cx="18" cy="32" r="2" fill="#ffffff" />
    <circle cx="26" cy="32" r="2" fill="#ffffff" />
  </g>

  <!-- Bookshelf / Prop in background -->
  <rect x="20" y="95" width="40" height="95" fill="#151c2c" />
  <line x1="20" y1="130" x2="60" y2="130" stroke="#334155" stroke-width="2" />
  <line x1="20" y1="160" x2="60" y2="160" stroke="#334155" stroke-width="2" />
  <rect x="26" y="110" width="8" height="20" fill="#f43f5e" rx="1" />
  <rect x="36" y="107" width="6" height="23" fill="#38bdf8" rx="1" />
  <rect x="44" y="113" width="10" height="17" fill="#10b981" rx="1" />

  <!-- Desk and items -->
  <path d="M75 160 L210 160 L200 190 L85 190 Z" fill="#334155" />
  <rect x="70" y="155" width="145" height="8" rx="2" fill="#475569" />
  
  <!-- Desk Lamp -->
  <path d="M185 155 L180 120 L190 120 Z" fill="#64748b" />
  <path d="M175 115 C175 105 195 105 195 115 Z" fill="#fbbf24" filter="url(#glow)" />
  <polygon points="170,115 200,115 190,125 180,125" fill="#f59e0b" />
  <path d="M160 155 C160 130 200 130 200 155" fill="url(#warmLamp)" />

  <!-- Coffee Mug on desk -->
  <rect x="95" y="142" width="12" height="15" rx="2" fill="#cbd5e1" />
  <path d="M107 145 C111 145 111 153 107 153" stroke="#cbd5e1" stroke-width="2" fill="none" />

  <!-- Character 1 (The speaker/informant - leaning in, whispering/gossiping "据说") -->
  <g transform="translate(60, 90)">
    <!-- Body -->
    <path d="M 30 70 Q 30 50 45 45 L 60 70 Z" fill="#3b82f6" />
    <!-- Head -->
    <circle cx="45" cy="30" r="16" fill="#fde047" />
    <!-- Hair -->
    <path d="M 29 28 C 29 15 45 12 55 22 C 60 16 63 25 61 32 C 55 25 40 25 35 32 Z" fill="#1e293b" />
    <!-- Facial expression: excited/talking, eyes curved, smiling open mouth -->
    <circle cx="40" cy="28" r="1.5" fill="#1e293b" />
    <circle cx="50" cy="28" r="1.5" fill="#1e293b" />
    <path d="M 43 34 Q 46 38 49 34" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Hand near mouth gesture (whispering/rumor action) -->
    <path d="M 40 45 C 45 43 48 40 47 36" stroke="#fde047" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Character 2 (The listener - surprised/attentive reaction) -->
  <g transform="translate(135, 95)">
    <!-- Body -->
    <path d="M 30 65 Q 30 45 45 45 L 60 65 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="45" cy="28" r="16" fill="#fde047" />
    <!-- Hair -->
    <path d="M 30 25 C 32 12 58 12 60 25 C 55 20 35 20 30 25 Z" fill="#475569" />
    <!-- Surprised facial expression: wide eyes, open 'O' mouth -->
    <circle cx="39" cy="26" r="2" fill="#1e293b" />
    <circle cx="51" cy="26" r="2" fill="#1e293b" />
    <circle cx="45" cy="33" r="3" fill="#1e293b" />
    <!-- Eyebrows raised high -->
    <line x1="37" y1="21" x2="42" y2="20" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="48" y1="20" x2="53" y2="21" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Posture leaning forward with hands on desk -->
    <path d="M 35 50 L 15 65" stroke="#fde047" stroke-width="5" stroke-linecap="round" />
    <path d="M 55 50 L 70 65" stroke="#fde047" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Visual Metaphor: Floating "Rumor / Whispered Information" Speech Bubble & Incoming Arrival Concept -->
  <!-- Floating speech bubble cluster representing "According to report / 据说" -->
  <g transform="translate(90, 45)">
    <path d="M 15 15 C 15 5 45 5 45 15 C 45 25 15 25 15 15 Z" fill="#ffffff" filter="url(#glow)" opacity="0.9" />
    <circle cx="12" cy="20" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="7" cy="25" r="1.5" fill="#ffffff" opacity="0.7" />
    
    <!-- Abstract icons inside speech bubble: representing incoming person/travel -->
    <path d="M 23 15 L 29 12 L 37 15" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="30" cy="11" r="2.5" fill="#3b82f6" />
    <polyline points="33,18 37,15 33,12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Subtle ambient lighting sparkles -->
  <circle cx="110" cy="35" r="1" fill="#fbbf24" opacity="0.6" />
  <circle cx="125" cy="25" r="1.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="75" cy="55" r="1" fill="#ffffff" opacity="0.5" />
</svg>