<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="wood-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33211d"/>
      <stop offset="100%" stop-color="#1f1412"/>
    </linearGradient>
    
    <linearGradient id="photo-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="polaroid-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <radialGradient id="warm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric background lights/bokeh -->
  <circle cx="180" cy="60" r="40" fill="url(#warm-glow)"/>
  <circle cx="60" cy="180" r="50" fill="url(#warm-glow)"/>
  
  <g transform="translate(0, 15)">
    <!-- Wooden Table Surface -->
    <path d="M 0 160 L 240 160 L 240 220 C 240 231 231 240 220 240 L 20 240 C 9 240 0 231 0 220 Z" fill="url(#wood-surface)"/>
    <path d="M 0 160 L 240 160 L 240 164 L 0 164 Z" fill="#452a25" opacity="0.8"/>

    <!-- SCENE PROPS: MEMORABILIA COLLECTION -->

    <!-- Prop 1: Vintage Travel Ticket / Pass (Background left) -->
    <g transform="translate(30, 135) rotate(-12) filter="url(#drop-shadow)">
      <rect x="0" y="0" width="80" height="45" rx="6" fill="url(#ticket-grad)"/>
      <!-- Ticket notches -->
      <circle cx="0" cy="22.5" r="5" fill="#0f172a"/>
      <circle cx="80" cy="22.5" r="5" fill="#0f172a"/>
      <!-- Ticket details (abstract shapes) -->
      <rect x="15" y="12" width="35" height="4" rx="2" fill="#78350f" opacity="0.6"/>
      <rect x="15" y="22" width="25" height="3" rx="1.5" fill="#78350f" opacity="0.5"/>
      <circle cx="62" cy="22" r="8" fill="#fff" opacity="0.4"/>
    </g>

    <!-- Prop 2: Dried Flower / Pressed Botanical in Paper (Background right) -->
    <g transform="translate(145, 125) rotate(18) filter="url(#drop-shadow)">
      <rect x="0" y="0" width="65" height="55" rx="4" fill="#f8fafc" opacity="0.9"/>
      <!-- Stem and leaves -->
      <path d="M 32 50 Q 30 30 35 15" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 31 35 L 22 28 M 33 25 L 42 18" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Flower petals -->
      <circle cx="35" cy="14" r="7" fill="#ec4899"/>
      <circle cx="28" cy="17" r="6" fill="#f472b6"/>
      <circle cx="42" cy="17" r="6" fill="#f472b6"/>
      <circle cx="35" cy="21" r="6" fill="#f472b6"/>
      <circle cx="35" cy="14" r="3" fill="#fde047"/>
    </g>

    <!-- Prop 3: Vintage Compass / Pocket Watch (Middle Left) -->
    <g transform="translate(25, 80) filter="url(#drop-shadow)">
      <circle cx="25" cy="25" r="22" fill="#d97706"/>
      <circle cx="25" cy="25" r="19" fill="#1e293b"/>
      <!-- Compass details -->
      <polygon points="25,12 28,25 25,38 22,25" fill="#ef4444"/>
      <polygon points="25,38 28,25 25,12 22,25" fill="#f8fafc" opacity="0.7"/>
      <circle cx="25" cy="25" r="3" fill="#fbbf24"/>
      <!-- Watch ring loop on top -->
      <circle cx="25" cy="2" r="4" fill="none" stroke="#d97706" stroke-width="2.5"/>
    </g>

    <!-- Prop 4: Stacked Polaroid Photo 1 (Behind main frame) -->
    <g transform="translate(120, 50) rotate(8) filter="url(#drop-shadow)">
      <rect x="0" y="0" width="70" height="85" rx="3" fill="url(#polaroid-bg)"/>
      <rect x="8" y="8" width="54" height="54" fill="#38bdf8"/>
      <!-- Abstract landscape in photo -->
      <path d="M 8 45 Q 25 30 40 40 T 62 35 L 62 62 L 8 62 Z" fill="#0284c7"/>
      <circle cx="48" cy="22" r="7" fill="#fde047"/>
    </g>

    <!-- CENTRAL FOCAL POINT: The Main Keepsake Photo Frame -->
    <g transform="translate(65, 35) rotate(-5) filter="url(#soft-shadow)">
      <!-- Shadow/Back of frame -->
      <rect x="-4" y="-4" width="118" height="138" rx="10" fill="#0f172a" opacity="0.3"/>
      
      <!-- Outer Wooden/Metallic Frame -->
      <rect x="0" y="0" width="110" height="130" rx="8" fill="url(#photo-frame)"/>
      <rect x="8" y="8" width="94" height="114" rx="4" fill="#ffffff"/>

      <!-- Photo Content: A scenic happy memory (Vivid flat illustration) -->
      <!-- Sky -->
      <rect x="10" y="10" width="90" height="75" fill="#7dd3fc"/>
      <!-- Sun -->
      <circle cx="75" cy="35" r="12" fill="#fef08a"/>
      <!-- Mountains -->
      <path d="M 10 75 L 35 45 L 65 75 L 85 55 L 100 75 Z" fill="#059669"/>
      <path d="M 30 75 L 55 38 L 85 75 Z" fill="#047857"/>
      <!-- Little stylized figures (representing friends/family creating memories) -->
      <!-- Figure 1 -->
      <circle cx="45" cy="65" r="4" fill="#1e293b"/>
      <path d="M 45 69 L 45 76 M 42 72 L 48 72" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Figure 2 -->
      <circle cx="58" cy="63" r="4" fill="#1e293b"/>
      <path d="M 58 67 L 58 76 M 55 70 L 61 70" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Holding hands curve -->
      <path d="M 47 67 Q 51 64 56 65" stroke="#1e293b" stroke-width="1.5" fill="none"/>

      <!-- Polaroid/Photo bottom border with decorative heart icon representing 'sentiment/memory' -->
      <rect x="10" y="85" width="90" height="37" fill="#ffffff"/>
      <!-- Small cute embossed heart on frame bottom -->
      <path d="M 55 100 C 55 97 51 95 48 98 C 45 95 41 97 41 100 C 41 104 48 108 48 108 C 48 108 55 104 55 100 Z" fill="#ef4444"/>
    </g>

    <!-- Prop 5: Decorative Ribbon/Bow wrapping the scene -->
    <g transform="translate(145, 95) filter="url(#drop-shadow)">
      <path d="M -20 20 Q -5 0 15 15 T 45 10" stroke="url(#ribbon-grad)" stroke-width="8" fill="none" stroke-linecap="round"/>
      <!-- Bow loops -->
      <path d="M -15 12 C -25 5 -30 20 -15 25 C -5 20 -15 12 -15 12 Z" fill="#ec4899"/>
      <path d="M 2 12 C 12 2 20 18 5 23 C -2 18 2 12 2 12 Z" fill="#f472b6"/>
      <circle cx="-5" cy="18" r="3" fill="#be185d"/>
    </g>

    <!-- Prop 6: Sparkling magic dust/memory twinkles -->
    <g fill="#fde047">
      <path d="M 35 35 L 37 40 L 42 42 L 37 44 L 35 49 L 33 44 L 28 42 L 33 40 Z" opacity="0.9"/>
      <path d="M 185 85 L 186.5 88.5 L 190 90 L 186.5 91.5 L 185 95 L 183.5 91.5 L 180 90 L 183.5 88.5 Z" opacity="0.8"/>
      <circle cx="115" cy="25" r="2.5" opacity="0.7"/>
      <circle cx="75" cy="155" r="2" opacity="0.6"/>
      <circle cx="205" cy="150" r="3" opacity="0.5"/>
    </g>
  </g>
</svg>