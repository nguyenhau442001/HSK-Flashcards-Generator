<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="4"/>
  
  <!-- Plate with food -->
  <circle cx="80" cy="170" r="25" fill="#f1f5f9"/>
  <path d="M65 170 C 65 160, 95 160, 95 170" fill="#fb923c"/>
  <path d="M70 175 C 70 170, 90 170, 90 175" fill="#ec4899"/>
  
  <!-- Takeout Box (The Action) -->
  <path d="M140 130 L 180 130 L 175 170 L 145 170 Z" fill="#f59e0b"/>
  <path d="M140 130 L 145 120 L 175 120 L 180 130" fill="#fbbf24"/>
  
  <!-- Waiter Character -->
  <g transform="translate(130, 80)">
    <circle cx="30" cy="20" r="12" fill="#fde68a"/>
    <path d="M20 35 L 40 35 L 38 70 L 22 70 Z" fill="#38bdf8"/>
    <path d="M22 40 L 10 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M38 40 L 50 55" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Customer Character -->
  <g transform="translate(30, 90)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M10 35 L 30 35 L 28 70 L 12 70 Z" fill="#10b981"/>
    <path d="M12 40 L 5 55" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Ambient Decor -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="210" cy="30" r="2" fill="#fbbf24" opacity="0.3"/>
  <circle cx="190" cy="50" r="4" fill="#fbbf24" opacity="0.2"/>
</svg>