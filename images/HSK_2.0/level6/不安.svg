<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- The Subject: A person's hands fidgeting with a pen -->
  <g transform="translate(40, 140)">
    <!-- Sleeves -->
    <path d="M0 60 L40 30 L60 50 L20 80 Z" fill="#64748b"/>
    <path d="M160 60 L200 30 L220 50 L180 80 Z" fill="#64748b"/>
    
    <!-- Hands -->
    <path d="M30 40 Q50 20 70 40 T100 40" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    <circle cx="60" cy="35" r="12" fill="#fcd34d"/>
    <circle cx="140" cy="35" r="12" fill="#fcd34d"/>
    
    <!-- Pen being clicked/fidgeted -->
    <rect x="85" y="20" width="40" height="8" rx="4" fill="#fb923c" transform="rotate(-15 105 24)"/>
    <rect x="115" y="15" width="10" height="15" rx="2" fill="#ec4899"/>
  </g>
  
  <!-- Atmospheric details: Ticking clock shadow/lines -->
  <g stroke="#475569" stroke-width="2" stroke-dasharray="4 4">
    <line x1="120" y1="20" x2="120" y2="60"/>
    <line x1="120" y1="40" x2="160" y2="40"/>
  </g>
  
  <!-- Subtle "anxiety" motion lines -->
  <path d="M180 100 Q200 80 220 100" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M190 110 Q210 90 230 110" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  
  <!-- A cup of coffee with steam -->
  <circle cx="180" cy="180" r="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <path d="M175 160 Q180 150 175 140" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M185 160 Q190 150 185 140" fill="none" stroke="#94a3b8" stroke-width="2"/>
</svg>