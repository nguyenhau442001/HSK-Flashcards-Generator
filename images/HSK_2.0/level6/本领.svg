<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Beam / Spotlight Gradient -->
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Anvil Metal Gradient -->
    <linearGradient id="anvilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sword Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Hammer Head Gradient -->
    <linearGradient id="hammerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting / Spotlight -->
  <polygon points="120,0 200,240 40,240" fill="url(#beamGrad)" />

  <!-- Background Environment / Workshop Details -->
  <!-- Back Wall Gears & Tools Silhouettes -->
  <g fill="#334155" opacity="0.5">
    <!-- Gear Left -->
    <circle cx="65" cy="70" r="18" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8 4" />
    <circle cx="65" cy="70" r="8" />
    <!-- Gear Right -->
    <circle cx="175" cy="85" r="14" fill="none" stroke="#334155" stroke-width="5" stroke-dasharray="6 3" />
    <!-- Wrench silhouette -->
    <path d="M185 130 l15 -15 a4 4 0 0 0 -6 -6 l-15 15 z" />
  </g>

  <!-- Ambient Floating Sparks / Energy Particles -->
  <g fill="#fbbf24">
    <circle cx="95" cy="110" r="2.5" opacity="0.9" filter="url(#glow)" />
    <circle cx="150" cy="125" r="2" opacity="0.7" />
    <circle cx="110" cy="85" r="3" opacity="0.8" filter="url(#glow)" />
    <circle cx="135" cy="70" r="1.5" opacity="0.6" />
    <circle cx="75" cy="150" r="2" opacity="0.5" />
    <circle cx="165" cy="155" r="2.5" opacity="0.8" />
  </g>

  <!-- Wooden Workbench / Surface -->
  <g filter="url(#shadow)">
    <!-- Bench Top -->
    <path d="M 30,190 L 210,190 L 220,215 L 20,215 Z" fill="#b45309" />
    <!-- Bench Front Face -->
    <rect x="20" y="215" width="200" height="15" fill="#92400e" rx="2" />
    <!-- Wood grain accent -->
    <path d="M 40,200 Q 120,205 200,200" stroke="#78350f" stroke-width="2" fill="none" opacity="0.6" />
  </g>

  <!-- Central Heavy Anvil -->
  <g transform="translate(120, 185)" filter="url(#shadow)">
    <!-- Anvil Base -->
    <path d="M-25,5 L25,5 L20,-10 L-20,-10 Z" fill="url(#anvilGrad)" />
    <!-- Anvil Waist -->
    <rect x="-12" y="-22" width="24" height="12" fill="url(#anvilGrad)" />
    <!-- Anvil Body / Horn -->
    <path d="M-30,-32 C-30,-32 30,-32 30,-32 L20,-22 L-20,-22 Z" fill="#475569" />
    <path d="M-30,-32 C-30,-22 -15,-22 -15,-22 L-20,-22 Z" fill="#64748b" /> <!-- Horn highlight -->
    <!-- Flat Top Face of Anvil -->
    <rect x="-20" y="-35" width="40" height="3" fill="#94a3b8" />
  </g>

  <!-- The Masterpiece: Glowing Forged Sword (Symbolizing 'Skill / Mastery / Bản lĩnh') -->
  <g transform="translate(120, 130) rotate(-25)" filter="url(#shadow)">
    <!-- Sword Blade -->
    <path d="M-4,-40 L4,-40 L6,30 L0,50 L-6,30 Z" fill="url(#bladeGrad)" />
    <!-- Blade Fuller (Center Groove) -->
    <path d="M0,-35 L0,25" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" />
    <!-- Crossguard -->
    <path d="M-18,-38 L18,-38 L16,-43 L-16,-43 Z" fill="#f59e0b" />
    <circle cx="0" cy="-40" r="3" fill="#fbbf24" />
    <!-- Hilt / Handle -->
    <rect x="-3" y="-58" width="6" height="20" rx="2" fill="#1e293b" />
    <!-- Handle Wrapping Details -->
    <line x1="-3" y1="-53" x2="3" y2="-53" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="-3" y1="-49" x2="3" y2="-49" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="-3" y1="-45" x2="3" y2="-45" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Pommel -->
    <circle cx="0" cy="-59" r="4" fill="#f59e0b" />
    <!-- Magic Energy Aura around Sword -->
    <path d="M-8,-45 C-15,-10 -5,20 0,55 C5,20 15,-10 8,-45" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" filter="url(#glow)" />
  </g>

  <!-- Action Crafting Hammer (Striking Down) -->
  <g transform="translate(155, 95) rotate(15)" filter="url(#shadow)">
    <!-- Wooden Handle -->
    <path d="M-3,5 L3,5 L6,65 C6,68 3,70 0,70 C-3,70 -6,68 -6,65 Z" fill="#92400e" />
    <!-- Hammer Head -->
    <path d="M-22,-4 L22,-4 C25,-4 26,-10 22,-14 L-22,-14 C-26,-10 -25,-4 -22,-4 Z" fill="url(#hammerGrad)" />
    <!-- Hammer Head Face (Impact side) -->
    <rect x="-24" y="-13" width="4" height="8" fill="#fef3c7" rx="1" />
  </g>

  <!-- Dynamic Impact Sparks & Energy Burst (Center of action) -->
  <g transform="translate(110, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="6" fill="#fef08a" />
    <!-- Spark lines -->
    <path d="M-15,-10 L-25,-18 M15,-15 L28,-25 M5,-20 L12,-35 M-10,-20 L-18,-32" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M-18,5 L-30,10 M18,0 L32,-5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Ambient Glow Elements for Visual Depth -->
  <circle cx="190" cy="50" r="2" fill="#38bdf8" opacity="0.4" filter="url(#glow)" />
  <circle cx="45" cy="80" r="1.5" fill="#fb923c" opacity="0.5" />
</svg>