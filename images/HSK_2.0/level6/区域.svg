<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Cityscape Background -->
  <path d="M20 180 L80 120 L140 160 L200 100 L220 240 Z" fill="#334155"/>
  <rect x="40" y="140" width="20" height="100" fill="#475569"/>
  <rect x="80" y="110" width="30" height="130" fill="#475569"/>
  <rect x="150" y="90" width="40" height="150" fill="#475569"/>
  
  <!-- Glowing Windows -->
  <rect x="45" y="150" width="10" height="10" fill="#fbbf24"/>
  <rect x="85" y="120" width="10" height="10" fill="#fbbf24"/>
  <rect x="160" y="100" width="10" height="10" fill="#fbbf24"/>
  
  <!-- Foreground: Professional Character -->
  <g transform="translate(40, 100)">
    <circle cx="60" cy="60" r="30" fill="#38bdf8" opacity="0.2"/>
    <!-- Suit/Professional -->
    <path d="M50 90 L70 90 L75 130 L45 130 Z" fill="#94a3b8"/>
    <path d="M55 80 C55 70 65 70 65 80 L65 90 L55 90 Z" fill="#cbd5e1"/>
    <!-- Head -->
    <circle cx="60" cy="75" r="12" fill="#fde68a"/>
    <!-- Glasses -->
    <rect x="53" y="72" width="14" height="6" rx="2" fill="#0f172a"/>
  </g>
  
  <!-- Data/Graph Element -->
  <g transform="translate(140, 140)">
    <rect x="0" y="0" width="70" height="60" rx="4" fill="#334155"/>
    <path d="M10 50 L25 30 L40 40 L60 10" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="10" r="4" fill="#10b981"/>
  </g>
  
  <!-- Decorative Accents -->
  <circle cx="200" cy="40" r="3" fill="#ec4899"/>
  <circle cx="30" cy="50" r="2" fill="#fb923c"/>
  <path d="M180 60 L190 50 L200 60" stroke="#fbbf24" stroke-width="2" fill="none"/>
</svg>