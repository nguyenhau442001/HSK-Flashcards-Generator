<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="plantPot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Interior Wall & Window Setting (Modern Chinese residential context) -->
  <!-- Warm Ambient Window Light -->
  <path d="M140 20 L210 20 L210 150 L140 150 Z" fill="url(#windowGlow)" />
  <rect x="145" y="25" width="60" height="120" rx="4" fill="none" stroke="#334155" stroke-width="3" />
  <line x1="175" y1="25" x2="175" y2="145" stroke="#334155" stroke-width="2" />
  <line x1="145" y1="85" x2="205" y2="85" stroke="#334155" stroke-width="2" />

  <!-- Houseplants (Symbol of prosperity and better life) -->
  <path d="M25 155 Q20 130 35 115 Q45 130 40 155 Z" fill="#10b981" />
  <path d="M35 155 Q45 125 60 120 Q65 140 50 155 Z" fill="#34d399" />
  <path d="M15 155 Q25 135 30 120 Q35 140 25 155 Z" fill="#059669" />
  <path d="M20 155 L50 155 L45 185 L25 185 Z" fill="url(#plantPot)" />

  <!-- Cozy Interior Elements / Furniture -->
  <rect x="75" y="140" width="110" height="8" rx="4" fill="#475569" />
  <rect x="90" y="148" width="80" height="32" fill="#334155" />

  <!-- Modern Lifestyle Props on Shelf (Smart Home/Tech & Comfort) -->
  <!-- Smart TV / Screen showing upward trend -->
  <rect x="95" y="105" width="40" height="30" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <rect x="98" y="108" width="34" height="24" rx="2" fill="url(#screenGrad)" />
  <polyline points="102,125 110,118 118,122 128,110" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Tea Pot / Cultural comfort -->
  <circle cx="155" cy="130" r="8" fill="#fb923c" />
  <path d="M151 120 L159 120 L157 122 L153 122 Z" fill="#ea580c" />

  <!-- Characters: Everyday common people (老百姓) - Couple enjoying a better, happy modern life -->
  <!-- Female Character -->
  <g transform="translate(65, 85)">
    <!-- Body & Clothes -->
    <path d="M20 50 Q10 75 15 95 L45 95 Q50 75 40 50 Z" fill="#ec4899" />
    <!-- Head & Hair -->
    <circle cx="30" cy="30" rx="14" fill="#fcd34d" />
    <circle cx="30" cy="28" r="14" fill="#fbbf24" />
    <path d="M16 28 C16 15 44 15 44 28 C40 38 20 38 16 28 Z" fill="#1e293b" />
    <!-- Happy Face Expression -->
    <path d="M25 30 Q30 35 35 30" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle cx="24" cy="26" r="1.5" fill="#1e293b" />
    <circle cx="36" cy="26" r="1.5" fill="#1e293b" />
    <!-- Arms gesturing happiness/cheer -->
    <path d="M15 55 Q5 45 0 35" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
    <path d="M45 55 Q55 50 62 42" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Male Character -->
  <g transform="translate(115, 80)">
    <!-- Body & Clothes -->
    <path d="M20 55 Q10 80 18 100 L48 100 Q56 80 46 55 Z" fill="#38bdf8" />
    <!-- Head & Hair -->
    <circle cx="33" cy="28" r="13" fill="#fcd34d" />
    <path d="M20 25 C20 15 46 15 46 25 C42 20 24 20 20 25 Z" fill="#334155" />
    <!-- Happy Face Expression -->
    <path d="M28 28 Q33 33 38 28" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle cx="27" cy="24" r="1.5" fill="#1e293b" />
    <circle cx="39" cy="24" r="1.5" fill="#1e293b" />
    <!-- Raised Arm cheering -->
    <path d="M46 55 Q58 40 55 25" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
    <path d="M18 55 Q5 65 2 80" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Foreground Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="3" />

  <!-- Prosperity Elements on Floor (Shopping bags / fruit basket representing abundance) -->
  <path d="M180 165 L210 165 L215 195 L175 195 Z" fill="#f43f5e" />
  <path d="M195 165 C195 158 190 155 195 152 C200 155 195 158 195 165" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <!-- Apple/Fruit in basket -->
  <circle cx="190" cy="172" r="6" fill="#fbbf24" />
  <circle cx="200" cy="175" r="7" fill="#f87171" />
  
  <!-- Additional glowing accent particles for uplifting atmosphere -->
  <circle cx="70" cy="40" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="115" cy="25" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="50" cy="65" r="2" fill="#10b981" opacity="0.7" />
</svg>