<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Glow & Bathroom Wall Tiles -->
  <circle cx="120" cy="120" r="100" fill="#1e293b" opacity="0.6"/>
  <path d="M0 60 H240 M0 120 H240 M0 180 H240" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M60 0 V240 M120 0 V240 M180 0 V240" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Warm spotlight from above-left -->
  <circle cx="80" cy="40" r="90" fill="#38bdf8" opacity="0.08" filter="blur(20px)"/>

  <!-- Sink / Wall Mount Base -->
  <path d="M50 160 C50 150 70 145 120 145 C170 145 190 150 190 160 C190 170 170 185 120 185 C70 185 50 170 50 160 Z" fill="#334155" opacity="0.8"/>
  <ellipse cx="120" cy="163" r="62" fill="#0f172a"/>
  <ellipse cx="120" cy="165" r="55" fill="#1e293b"/>

  <!-- Soap Dish (Ceramic white/teal accent) -->
  <ellipse cx="120" cy="158" r="42" fill="#475569"/>
  <ellipse cx="120" cy="155" r="38" fill="#cbd5e1"/>
  <ellipse cx="120" cy="153" r="34" fill="#f1f5f9"/>

  <!-- Shadow under soap -->
  <ellipse cx="123" cy="143" r="26" fill="#0f172a" opacity="0.25"/>

  <!-- MAIN SUBJECT: Soap Bar (肥皂) - Vibrant Turquoise/Aqua chunk with rounded organic shape -->
  <g transform="translate(120, 140)">
    <!-- Soap Body Base -->
    <path d="M -30 -10 
             C -32 -22, -15 -28, 0 -28 
             C 15 -28, 32 -22, 30 -10 
             C 33 5, 28 20, 0 20 
             C -28 20, -33 5, -30 -10 Z" 
          fill="#0d9488"/>
          
    <!-- Soap Front Face (Layered lighter tone for 3D depth) -->
    <path d="M -26 -8 
             C -28 -18, -13 -23, 0 -23 
             C 13 -23, 28 -18, 26 -8 
             C 28 4, 24 16, 0 16 
             C -24 16, -28 4, -26 -8 Z" 
          fill="#14b8a6"/>

    <!-- Soap Top Highlight Curve -->
    <path d="M -20 -15 C -10 -20, 10 -20, 20 -15 C 15 -18, -15 -18, -20 -15 Z" fill="#5eead4" opacity="0.7"/>

    <!-- Glossy reflection streak -->
    <path d="M -14 -12 C -6 -16, 4 -14, 8 -6 C 7 -8, -2 -11, -14 -12 Z" fill="#ffffff" opacity="0.5"/>
    
    <!-- Imprinted organic swirl icon on soap -->
    <path d="M -4 -2 C -8 -6, 2 -8, 4 -4 C 6 0, -2 4, 2 8" stroke="#0f766e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Action Elements: Water splashes and dynamic soap bubbles -->
  <!-- Splash drop left -->
  <path d="M 68 120 C 66 112, 72 106, 75 110 C 78 114, 72 125, 68 120 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="63" cy="115" r="3" fill="#bae6fd"/>

  <!-- Splash drop right -->
  <path d="M 172 110 C 176 102, 170 96, 166 100 C 162 104, 168 115, 172 110 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="178" cy="105" r="2.5" fill="#bae6fd"/>

  <!-- Rich Suds and Bubbles surrounding the soap -->
  <!-- Bubble cluster bottom-left -->
  <circle cx="85" cy="148" r="8" fill="#e2e8f0" opacity="0.85"/>
  <circle cx="83" cy="146" r="2" fill="#ffffff" opacity="0.9"/>
  
  <circle cx="75" cy="138" r="11" fill="#f8fafc" opacity="0.9"/>
  <circle cx="72" cy="135" r="3" fill="#ffffff"/>
  
  <circle cx="88" cy="130" r="6" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="87" cy="129" r="1.5" fill="#ffffff"/>

  <!-- Bubble cluster top-right -->
  <circle cx="155" cy="125" r="10" fill="#f8fafc" opacity="0.9"/>
  <circle cx="153" cy="122" r="3" fill="#ffffff"/>

  <circle cx="162" cy="138" r="7" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="160" cy="136" r="2" fill="#ffffff"/>

  <circle cx="145" cy="115" r="8" fill="#cbd5e1" opacity="0.7"/>
  <circle cx="143" cy="113" r="2" fill="#ffffff"/>

  <!-- Floating magical action bubbles with highlights -->
  <g>
    <!-- Bubble 1 -->
    <circle cx="105" cy="85" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <circle cx="100" cy="80" r="3" fill="#ffffff" opacity="0.9"/>
    <path d="M 103 74 A 5 5 0 0 1 111 81" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Bubble 2 -->
    <circle cx="148" cy="75" r="10" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>
    <circle cx="145" cy="72" r="2" fill="#ffffff" opacity="0.9"/>

    <!-- Bubble 3 -->
    <circle cx="70" cy="95" r="7" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    <circle cx="68" cy="93" r="1.5" fill="#ffffff"/>

    <!-- Bubble 4 -->
    <circle cx="130" cy="55" r="6" fill="#38bdf8" opacity="0.2"/>
    <circle cx="130" cy="55" r="6" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.8"/>
    <circle cx="128" cy="53" r="1" fill="#ffffff"/>

    <!-- Tiny sparkle star -->
    <path d="M 165 95 L 167 100 L 172 102 L 167 104 L 165 109 L 163 104 L 158 102 L 163 100 Z" fill="#fbbf24" opacity="0.9"/>
    <path d="M 95 60 L 96 63 L 99 64 L 96 65 L 95 68 L 94 65 L 91 64 L 94 63 Z" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Water stream flowing gently in background -->
  <path d="M 120 40 Q 123 70 120 100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 122 55 Q 124 75 121 90" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Atmospheric framing details (Vignette & Borders) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>