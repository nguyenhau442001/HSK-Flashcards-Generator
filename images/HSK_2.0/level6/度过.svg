<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Hour Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Campfire Fire Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Tent Material -->
    <linearGradient id="tentMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="tentSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Background Scenery: Rolling Hills & Trees -->
  <path d="M 0 160 Q 60 130 120 155 T 240 145 L 240 240 L 0 240 Z" fill="#090d16" />
  <path d="M 0 180 Q 90 160 160 185 T 240 170 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.8" />

  <!-- Pine Trees Silhouette -->
  <g fill="#090d16">
    <polygon points="25,160 15,185 35,185" />
    <polygon points="25,150 18,170 32,170" />
    
    <polygon points="210,175 200,200 220,200" />
    <polygon points="210,165 203,183 217,183" />
    <polygon points="190,180 182,205 198,205" />
  </g>

  <!-- Stars in the Night Sky -->
  <g fill="#f8fafc" opacity="0.7">
    <circle cx="30" cy="40" r="1.5" />
    <circle cx="70" cy="25" r="1" />
    <circle cx="120" cy="35" r="1.2" />
    <circle cx="170" cy="20" r="1.5" />
    <circle cx="210" cy="50" r="1" />
    <circle cx="225" cy="30" r="1.2" />
  </g>

  <!-- Crescent Moon -->
  <path d="M 195 55 A 18 18 0 1 1 175 35 A 14 14 0 1 0 195 55 Z" fill="#fef08a" opacity="0.9" filter="url(#shadow)" />

  <!-- Ground Plane (Campsite) -->
  <ellipse cx="120" cy="195" rx="100" ry="35" fill="#1e293b" />
  <ellipse cx="120" cy="198" rx="85" ry="28" fill="#0f172a" />

  <!-- STRING LIGHTS (Hanging across the top) -->
  <path d="M 0 45 Q 60 70 120 50 T 240 55" fill="none" stroke="#334155" stroke-width="1.5" />
  <!-- Light Bulbs -->
  <g>
    <!-- Bulb 1 -->
    <circle cx="35" cy="52" r="3" fill="#fef08a" filter="url(#shadow)" />
    <path d="M 33 49 L 37 49 L 35 52 Z" fill="#94a3b8" />
    <!-- Bulb 2 -->
    <circle cx="75" cy="62" r="3" fill="#fef08a" filter="url(#shadow)" />
    <path d="M 73 59 L 77 59 L 75 62 Z" fill="#94a3b8" />
    <!-- Bulb 3 -->
    <center>
      <circle cx="115" cy="53" r="3" fill="#fef08a" filter="url(#shadow)" />
      <path d="M 113 50 L 117 50 L 115 53 Z" fill="#94a3b8" />
    </center>
    <!-- Bulb 4 -->
    <circle cx="160" cy="55" r="3" fill="#fef08a" filter="url(#shadow)" />
    <path d="M 158 52 L 162 52 L 160 55 Z" fill="#94a3b8" />
    <!-- Bulb 5 -->
    <circle cx="205" cy="54" r="3" fill="#fef08a" filter="url(#shadow)" />
    <path d="M 203 51 L 207 51 L 205 54 Z" fill="#94a3b8" />
  </g>

  <!-- CAMPFIRE -->
  <g transform="translate(120, 185)" filter="url(#shadow)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="35" fill="url(#lanternGlow)" />
    <!-- Logs -->
    <rect x="-14" y="2" width="28" height="6" rx="3" transform="rotate(-15)" fill="#78350f" />
    <rect x="-14" y="2" width="28" height="6" rx="3" transform="rotate(25)" fill="#92400e" />
    <!-- Fire Flames -->
    <path d="M 0 -18 Q -8 -5 -5 6 Q 0 12 5 6 Q 8 -5 0 -18 Z" fill="url(#fireGrad)" />
    <path d="M -3 -10 Q -10 0 -4 4 Q 0 8 4 4 Q 10 0 -3 -10 Z" fill="#fef08a" opacity="0.8" />
    <!-- Embers / Sparks -->
    <circle cx="-6" cy="-15" r="1.5" fill="#f59e0b" />
    <circle cx="8" cy="-12" r="1" fill="#ef4444" />
    <circle cx="2" cy="-22" r="1.2" fill="#fef08a" />
  </g>

  <!-- THE TENT (Main Feature representing "Spending Time / Journey") -->
  <g transform="translate(65, 125)" filter="url(#shadow)">
    <!-- Tent Back/Shadow Base -->
    <polygon points="35,5 75,65 0,65" fill="#0369a1" />
    <!-- Tent Left Side -->
    <polygon points="35,5 0,65 35,65" fill="url(#tentMain)" />
    <!-- Tent Right Side -->
    <polygon points="35,5 35,65 70,65" fill="url(#tentSide)" />
    <!-- Tent Entrance Cutout (Dark Interior) -->
    <path d="M 35,25 L 20,65 L 50,65 Z" fill="#0c4a6e" />
    <!-- Tent Flaps Open -->
    <path d="M 35,25 L 20,65 L 28,65 Z" fill="#0284c7" />
    <path d="M 35,25 L 50,65 L 42,65 Z" fill="#0369a1" />
    <!-- Tent Accent Stripe -->
    <path d="M 35,5 L 10,48 L 16,50 L 35,20 Z" fill="#38bdf8" opacity="0.6" />
    <!-- Tent Pegs / Guylines -->
    <line x1="35" y1="5" x2="-8" y2="35" stroke="#94a3b8" stroke-width="1" />
    <line x1="35" y1="5" x2="78" y2="35" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- CAMPING GEAR & PROPS (Evoking a rich, shared experience of time) -->
  <!-- Backpack -->
  <g transform="translate(30, 165)" filter="url(#shadow)">
    <rect x="0" y="5" width="18" height="22" rx="6" fill="#10b981" />
    <rect x="3" y="0" width="12" height="7" rx="3" fill="#059669" />
    <!-- Pocket -->
    <rect x="3" y="14" width="12" height="9" rx="3" fill="#047857" />
    <!-- Straps -->
    <path d="M 4 5 L 4 0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <path d="M 14 5 L 14 0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Thermos Flask / Mug -->
  <g transform="translate(155, 185)" filter="url(#shadow)">
    <rect x="0" y="0" width="10" height="15" rx="2" fill="#ec4899" />
    <rect x="-1" y="-3" width="12" height="3" rx="1" fill="#f472b6" />
    <!-- Star decal on mug -->
    <circle cx="5" cy="7" r="2" fill="#fef08a" />
  </g>

  <!-- Guitar (Classic symbol of spending quality time together) -->
  <g transform="translate(175, 140) rotate(25)" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="12" cy="30" rx="11" ry="14" fill="#d97706" />
    <ellipse cx="12" cy="10" rx="8" ry="10" fill="#d97706" />
    <!-- Waist connect -->
    <rect x="6" y="10" width="12" height="12" fill="#d97706" />
    <!-- Soundhole -->
    <circle cx="12" cy="22" r="3.5" fill="#1e293b" />
    <!-- Neck -->
    <rect x="10" y="-18" width="4" height="22" fill="#78350f" />
    <!-- Headstock -->
    <rect x="8" y="-25" width="8" height="8" rx="1" fill="#451a03" />
    <!-- Strings -->
    <line x1="11.5" y1="-18" x2="11.5" y2="38" stroke="#cbd5e1" stroke-width="0.5" />
    <line x1="12.5" y1="-18" x2="12.5" y2="38" stroke="#cbd5e1" stroke-width="0.5" />
  </g>

  <!-- Log Seat Left -->
  <g transform="translate(95, 175)" filter="url(#shadow)">
    <rect x="0" y="0" width="16" height="12" rx="3" fill="#78350f" />
    <ellipse cx="8" cy="0" rx="8" ry="3" fill="#92400e" />
    <ellipse cx="8" cy="0" rx="5" ry="1.5" fill="#b45309" />
  </g>

  <!-- ENERGETIC ATMOSPHERE / NATURE SPARKLES -->
  <g>
    <!-- Fireflies / Glowing Particles -->
    <circle cx="100" cy="140" r="1.5" fill="#fef08a" filter="url(#shadow)" />
    <circle cx="145" cy="125" r="2" fill="#38bdf8" filter="url(#shadow)" />
    <circle cx="130" cy="105" r="1.5" fill="#fef08a" filter="url(#shadow)" />
    <circle cx="85" cy="115" r="2" fill="#10b981" filter="url(#shadow)" />
    <circle cx="155" cy="165" r="1.2" fill="#fb923c" filter="url(#shadow)" />
    <circle cx="75" cy="180" r="1.5" fill="#fef08a" filter="url(#shadow)" />
  </g>
</svg>