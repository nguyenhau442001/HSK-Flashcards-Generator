<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <rect x="20" y="160" width="200" height="40" fill="#334155" rx="4"/>
  <circle cx="120" cy="80" r="60" fill="#1e293b" opacity="0.5"/>
  
  <!-- Character 1 (The Aggressor) -->
  <g transform="translate(140, 80)">
    <circle cx="0" cy="0" r="25" fill="#fb923c"/>
    <path d="M-10 -5 L-5 -5 M5 -5 L10 -5" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5 10 Q0 15 5 10" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M15 -10 L40 5" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (The Peacemaker/Victim) -->
  <g transform="translate(80, 100)">
    <circle cx="0" cy="0" r="25" fill="#38bdf8"/>
    <path d="M-10 -5 L-5 -5 M5 -5 L10 -5" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8 10 Q0 5 8 10" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="-10" y="-15" width="20" height="5" fill="#0f172a" rx="2"/>
  </g>
  
  <!-- Stop Gesture (The "Don't" Action) -->
  <g transform="translate(110, 70)">
    <circle cx="0" cy="0" r="15" fill="#ec4899"/>
    <rect x="-8" y="-2" width="16" height="4" fill="#ffffff" rx="2"/>
  </g>

  <!-- Environment Details -->
  <path d="M30 180 L210 180" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="180" cy="140" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="140" r="5" fill="#f59e0b"/>
</svg>