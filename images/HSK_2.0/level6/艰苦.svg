<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mountain Gradient (Hardship / Rugged Terrain) -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Cliff Gradient -->
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light / Perseverance Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Rope Texture -->
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <!-- Distant Harsh Peaks -->
  <polygon points="10,180 60,110 110,180" fill="#1e293b" opacity="0.6"/>
  <polygon points="80,190 140,90 200,190" fill="#1e293b" opacity="0.8"/>
  <polygon points="150,200 200,130 250,200" fill="#1e293b" opacity="0.5"/>

  <!-- Dramatic Sun / Dawn Light representing hope amidst hardship -->
  <circle cx="180" cy="70" r="40" fill="url(#sunGlow)"/>
  <circle cx="180" cy="70" r="16" fill="#f59e0b" opacity="0.8"/>

  <!-- Floating Dust / Embers / Sparks of Effort -->
  <circle cx="70" cy="90" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="110" cy="60" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="150" cy="110" r="1" fill="#38bdf8" opacity="0.7"/>
  <circle cx="95" cy="140" r="1.5" fill="#38bdf8" opacity="0.5"/>

  <!-- Main Foreground: Rugged Cliff Face (The 'Gian Khổ' Environment) -->
  <path d="M0 240 L0 160 Q 30 150, 45 180 Q 70 170, 90 210 L240 240 Z" fill="url(#cliffGrad)"/>
  
  <!-- Rocky Outcroppings & Crevices -->
  <path d="M20 240 L25 195 L50 205 L65 240 Z" fill="#334155"/>
  <path d="M110 240 L130 185 L165 200 L180 240 Z" fill="#334155"/>
  <path d="M45 180 L60 165 L75 190 Z" fill="#475569" opacity="0.5"/>
  <path d="M130 185 L145 160 L165 180 Z" fill="#475569" opacity="0.5"/>

  <!-- The Climber / Overcomer (Action-Packed Subject) -->
  <g filter="url(#shadow)">
    <!-- Anchor Pitons & Ropes (Intense physical struggle) -->
    <!-- Piton 1 -->
    <path d="M135 125 L145 135 M145 130 L138 137" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Rope connecting to climber -->
    <path d="M145 133 Q 130 155, 115 160" fill="none" stroke="url(#ropeGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Climber Body (Dynamic angled pose showing effort) -->
    <!-- Backpack (Symbolizing heavy burden/long journey) -->
    <rect x="98" y="152" width="22" height="28" rx="6" fill="#fb923c" transform="rotate(-15 108 166)"/>
    <path d="M102 165 L118 160" stroke="#c2410c" stroke-width="2"/>
    <path d="M104 172 L120 167" stroke="#c2410c" stroke-width="2"/>

    <!-- Torso (Active climbing jacket - blue) -->
    <path d="M105 155 L125 162 L118 182 L98 175 Z" fill="#0284c7"/>
    <path d="M110 157 L118 178" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

    <!-- Helmet (Safety & Determination) -->
    <path d="M120 142 C 120 135, 132 135, 137 142 L132 148 L118 148 Z" fill="#fbbf24"/>
    <path d="M122 145 L135 145" stroke="#d97706" stroke-width="1.5"/>

    <!-- Arms reaching upward (Struggle / Grasping) -->
    <!-- Back Arm -->
    <path d="M112 165 L125 152" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <circle cx="127" cy="150" r="3.5" fill="#cbd5e1"/>
    <!-- Front Arm gripping rock -->
    <path d="M120 168 L138 160" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <circle cx="140" cy="159" r="3.5" fill="#cbd5e1"/>

    <!-- Legs straining against cliff face -->
    <!-- Leg 1 (Bent, pushing) -->
    <path d="M105 178 L90 192 L102 198" fill="none" stroke="#0369a1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Boot 1 -->
    <path d="M98 195 L108 202 L103 207 L93 200 Z" fill="#334155"/>

    <!-- Leg 2 (Extended for reach) -->
    <path d="M112 180 L125 198" fill="none" stroke="#0369a1" stroke-width="7" stroke-linecap="round"/>
    <!-- Boot 2 -->
    <path d="M122 194 L132 205 L127 210 L117 199 Z" fill="#334155"/>
  </g>

  <!-- Secondary Context Props: Hiking Gear / Survival Elements on Rock -->
  <!-- Ice axe / Climbing pole wedged in rock -->
  <g transform="rotate(25 60 170)">
    <line x1="60" y1="140" x2="60" y2="200" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M52 143 L60 140 L68 143" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <rect x="58" y="195" width="4" height="10" fill="#ef4444" rx="2"/>
  </g>

  <!-- Weather / Wind / Motion Lines (Emphasizing Harsh Environment) -->
  <path d="M20 70 Q 50 65, 80 75" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M10 95 Q 40 90, 60 98" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
  <path d="M70 50 Q 90 47, 110 55" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Foreground Atmospheric Vignette (Dark borders for depth) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.3"/>
</svg>