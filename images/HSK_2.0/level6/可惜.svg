<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Ticket Golden Glow -->
    <radialGradient id="ticketGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Ticket Gradient -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glass/Window Reflection -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- CINEMA / BOX OFFICE ENVIRONMENT -->
  <!-- Wall Architecture -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="#090d16" />
  <!-- Wall panelling lines -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#1e293b" stroke-width="2" />
  
  <!-- Movie Poster on Wall (Background Context) -->
  <g transform="translate(165, 50) rotate(4)">
    <rect width="45" height="60" rx="4" fill="#334155" filter="url(#shadow)" />
    <rect x="4" y="4" width="37" height="35" rx="2" fill="#1e293b" />
    <!-- Abstract poster art inside -->
    <circle cx="22" cy="20" r="10" fill="#f43f5e" opacity="0.8" />
    <path d="M 10 32 L 34 32 L 28 22 L 16 22 Z" fill="#38bdf8" opacity="0.8" />
    <!-- Poster text placeholder lines -->
    <rect x="6" y="45" width="25" height="4" rx="2" fill="#64748b" />
    <rect x="6" y="52" width="18" height="3" rx="1.5" fill="#475569" />
  </g>

  <!-- Ticket Counter / Desk Surface -->
  <path d="M -10 185 L 250 185 L 240 240 L 0 240 Z" fill="#1e293b" filter="url(#shadow)" />
  <path d="M 0 185 L 240 185 L 240 190 L 0 190 Z" fill="#334155" /> <!-- Counter rim top -->
  <path d="M 0 190 L 240 190 L 240 193 L 0 193 Z" fill="#0f172a" /> <!-- Counter rim shadow -->

  <!-- Box Office Glass Barrier -->
  <g opacity="0.6">
    <path d="M 40 185 L 40 85 Q 40 75 50 75 L 190 75 Q 200 75 200 85 L 200 185 Z" fill="url(#glassReflect)" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Ticket Window Cutout (Bottom center of glass) -->
    <path d="M 100 185 L 100 155 Q 100 145 110 145 L 130 145 Q 140 145 140 155 L 140 185 Z" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  </g>

  <!-- "SOLD OUT" Sign (Hanging behind the glass) -->
  <g transform="translate(120, 105)" filter="url(#shadow)">
    <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#ef4444" />
    <rect x="-33" y="-10" width="66" height="20" rx="3" fill="#dc2626" />
    <!-- Abstract warning stripes/icon instead of text -->
    <path d="M -20 -4 L -15 4 L -10 -4 Z M -5 -4 L 0 4 L 5 -4 Z M 10 -4 L 15 4 L 20 -4 Z" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- THE UNATTAINABLE GOLDEN TICKET (Main Subject of 'Regret/可惜') -->
  <g transform="translate(120, 140)" filter="url(#shadow)">
    <!-- Soft golden glow behind the ticket -->
    <circle cx="0" cy="0" r="35" fill="url(#ticketGlow)" filter="url(#glow)" />
    
    <!-- Floating Ticket with slight tilt -->
    <g transform="rotate(-12)">
      <!-- Ticket Shadow Base -->
      <rect x="-26" y="-14" width="52" height="28" rx="4" fill="#d97706" />
      <!-- Main Golden Ticket Body -->
      <rect x="-28" y="-16" width="56" height="32" rx="4" fill="url(#ticketGrad)" />
      <!-- Ticket Notch Left -->
      <circle cx="-28" cy="0" r="5" fill="#0f172a" />
      <!-- Ticket Notch Right -->
      <circle cx="28" cy="0" r="5" fill="#0f172a" />
      <!-- Perforation line -->
      <line x1="14" y1="-16" x2="14" y2="16" stroke="#b45309" stroke-width="1.5" stroke-dasharray="2,2" />
      <!-- Abstract Ticket Details (No text) -->
      <rect x="-20" y="-8" width="24" height="4" rx="2" fill="#ffffff" opacity="0.6" />
      <rect x="-20" y="0" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.4" />
      <circle cx="21" cy="0" r="3" fill="#ffffff" opacity="0.7" />
    </g>
  </g>

  <!-- DISAPPOINTED CHARACTER (Foreground hands/shoulders expressing '可惜') -->
  <!-- Person's shoulders leaning on counter -->
  <g transform="translate(120, 200)">
    <!-- Body/Coat -->
    <path d="M -70 40 L -40 5 L 40 5 L 70 40 Z" fill="#3b82f6" />
    <!-- Collar / Scarf -->
    <path d="M -30 8 L 0 25 L 30 8 L 20 0 L 0 15 L -20 0 Z" fill="#f8fafc" />

    <!-- Disappointed Hands resting on the counter edge -->
    <!-- Left Hand -->
    <g transform="translate(-35, -5) rotate(15)">
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="#fcd34d" />
      <!-- Fingers curled in defeat -->
      <circle cx="-6" cy="-6" r="3" fill="#fcd34d" />
      <circle cx="-1" cy="-8" r="3" fill="#fcd34d" />
      <circle cx="4" cy="-7" r="3" fill="#fcd34d" />
    </g>
    
    <!-- Right Hand -->
    <g transform="translate(35, -5) rotate(-15)">
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="#fcd34d" />
      <circle cx="6" cy="-6" r="3" fill="#fcd34d" />
      <circle cx="1" cy="-8" r="3" fill="#fcd34d" />
      <circle cx="-4" cy="-7" r="3" fill="#fcd34d" />
    </g>
  </g>

  <!-- ATMOSPHERIC ELEMENTS (Regret / Sigh effect: subtle blue floating bubbles/particles) -->
  <g opacity="0.6">
    <circle cx="95" cy="115" r="3" fill="#38bdf8" />
    <circle cx="105" cy="100" r="1.5" fill="#38bdf8" />
    <circle cx="145" cy="110" r="2" fill="#38bdf8" />
    <path d="M 90 130 Q 95 125 100 130" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 135 125 Q 140 120 145 125" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Foreground Frame/Border Stroke for Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>