<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Elephant Skin Gradient -->
    <linearGradient id="elephantSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Elephant Underbelly/Highlight -->
    <linearGradient id="elephantHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient for Jungle Canopy -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Jungle Depth) -->
  <g opacity="0.4">
    <!-- Far background trees -->
    <path d="M 20 180 L 40 120 L 60 180 Z" fill="#047857"/>
    <path d="M 50 180 L 80 100 L 110 180 Z" fill="#059669"/>
    <path d="M 160 180 L 195 110 L 230 180 Z" fill="#047857"/>
    <circle cx="210" cy="80" r="25" fill="#f59e0b" opacity="0.15"/>
  </g>

  <!-- Light Beams shining through -->
  <polygon points="120,0 200,0 160,200 80,200" fill="url(#lightBeam)"/>

  <!-- Ground / Environment -->
  <rect x="0" y="170" width="240" height="70" fill="url(#groundGrad)"/>
  <path d="M 0 170 Q 60 160 120 170 T 240 165 L 240 240 L 0 240 Z" fill="#064e3b"/>

  <!-- Foreground Jungle Plants / Props -->
  <!-- Giant tropical leaf left -->
  <path d="M 0 200 Q 20 160 50 180 Q 30 210 0 240 Z" fill="#10b981"/>
  <path d="M 15 190 Q 25 175 40 182" stroke="#065f46" stroke-width="2" fill="none"/>
  
  <!-- Colorful jungle flowers (Action/Vivid detail) -->
  <g transform="translate(15, 185)">
    <circle cx="0" cy="0" r="6" fill="#ec4899"/>
    <circle cx="6" cy="4" r="5" fill="#fb923c"/>
    <circle cx="3" cy="2" r="2" fill="#fef08a"/>
  </g>
  <g transform="translate(215, 195)">
    <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
    <circle cx="-5" cy="5" r="5" fill="#ec4899"/>
    <circle cx="-2" cy="2" r="2" fill="#fef08a"/>
  </g>

  <!-- MAIN SUBJECT: DÀXIÀNG (The Elephant) -->
  <g id="daxiang-elephant">
    <!-- Back legs -->
    <rect x="75" y="140" width="18" height="45" rx="9" fill="#475569"/>
    <rect x="145" y="140" width="18" height="45" rx="9" fill="#475569"/>

    <!-- Elephant Body (Robust & Friendly Cartoon proportion) -->
    <ellipse cx="120" cy="130" rx="45" ry="35" fill="url(#elephantSkin)"/>
    
    <!-- Belly highlight for roundness -->
    <path d="M 85 130 Q 120 165 155 130 Q 120 145 85 130 Z" fill="url(#elephantHighlight)" opacity="0.3"/>

    <!-- Front legs (Dynamic stance) -->
    <rect x="90" y="145" width="20" height="40" rx="10" fill="url(#elephantSkin)"/>
    <rect x="135" y="145" width="20" height="40" rx="10" fill="url(#elephantSkin)"/>
    <!-- Toenails -->
    <path d="M 92 180 L 98 180 L 96 183 L 94 183 Z" fill="#cbd5e1"/>
    <path d="M 102 180 L 108 180 L 106 183 L 104 183 Z" fill="#cbd5e1"/>
    <path d="M 137 180 L 143 180 L 141 183 L 139 183 Z" fill="#cbd5e1"/>
    <path d="M 147 180 L 153 180 L 151 183 L 149 183 Z" fill="#cbd5e1"/>

    <!-- Head -->
    <circle cx="120" cy="95" r="32" fill="url(#elephantSkin)"/>

    <!-- Big Floppy Ears -->
    <!-- Left Ear -->
    <path d="M 95 85 C 70 80 60 110 80 125 C 90 132 100 115 102 105 Z" fill="#64748b"/>
    <path d="M 92 90 C 78 87 72 105 85 115" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Right Ear -->
    <path d="M 145 85 C 170 80 180 110 160 125 C 150 132 140 115 138 105 Z" fill="#94a3b8"/>
    <path d="M 148 90 C 162 87 168 105 155 115" stroke="#64748b" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Expressive, friendly) -->
    <circle cx="107" cy="92" r="4" fill="#0f172a"/>
    <circle cx="106" cy="90" r="1.5" fill="#ffffff"/>
    <circle cx="133" cy="92" r="4" fill="#0f172a"/>
    <circle cx="132" cy="90" r="1.5" fill="#ffffff"/>

    <!-- Cheeks (Cute blush) -->
    <circle cx="101" cy="98" r="4" fill="#f43f5e" opacity="0.4"/>
    <circle cx="139" cy="98" r="4" fill="#f43f5e" opacity="0.4"/>

    <!-- Tusk left & right -->
    <path d="M 106 112 L 96 118 L 104 116 Z" fill="#f8fafc"/>
    <path d="M 134 112 L 144 118 L 136 116 Z" fill="#f8fafc"/>

    <!-- CRITICAL FEATURE: Mũi của con voi rất dài (The Long Trunk in dynamic playful curve) -->
    <!-- Drawing a smooth, segmented, highly expressive long trunk wrapping around with action lines/butterflies -->
    <path d="M 114 110 C 114 130 110 150 90 155 C 70 160 60 140 70 125 C 75 118 85 125 80 135 C 75 145 85 150 95 145 C 105 140 106 125 106 112" 
          fill="url(#elephantSkin)" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Trunk crease lines for texture -->
    <path d="M 112 120 C 108 122 104 121 100 118" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 108 132 C 102 135 98 134 94 130" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 98 143 C 90 148 85 145 80 138" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Little Cute Tail with tuft -->
    <path d="M 162 120 Q 180 120 185 135" stroke="#64748b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 183 133 L 188 140 L 180 138 Z" fill="#475569"/>
  </g>

  <!-- Interactive Action Prop: Friendly Yellow Butterfly interacting with the trunk tip -->
  <g id="butterfly" transform="translate(60, 110)">
    <circle cx="0" cy="0" r="2" fill="#0f172a"/>
    <!-- Wings -->
    <path d="M 0 0 Q -10 -10 -5 -15 Q 0 -10 0 0 Z" fill="#fbbf24"/>
    <path d="M 0 0 Q 10 -10 5 -15 Q 0 -10 0 0 Z" fill="#f59e0b"/>
    <path d="M 0 0 Q -10 5 -4 10 Q 0 5 0 0 Z" fill="#fbbf24"/>
    <path d="M 0 0 Q 10 5 4 10 Q 0 5 0 0 Z" fill="#f59e0b"/>
    <!-- Motion sparkle -->
    <path d="M -12 -5 L -8 -3 L -12 -1 L -10 -5 Z" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Floating nature sparkles/fireflies for rich atmosphere -->
  <g fill="#fef08a" opacity="0.6">
    <circle cx="45" cy="90" r="2"/>
    <circle cx="195" cy="100" r="1.5"/>
    <circle cx="180" cy="65" r="2.5"/>
    <circle cx="70" cy="60" r="1.5"/>
  </g>

  <!-- Soft Vignette / Inner shadow framing -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>
</svg>