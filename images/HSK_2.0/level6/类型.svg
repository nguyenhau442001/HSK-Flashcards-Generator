<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- UI Hologram Gradient -->
    <linearGradient id="holo-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Device Screen Gradient -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient lighting / Studio glow -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.05" filter="blur(20px)" />
  <circle cx="170" cy="80" r="40" fill="#f59e0b" opacity="0.08" filter="blur(15px)" />

  <!-- Background Environment (Design Studio / Innovation Lab) -->
  <g id="environment" opacity="0.6">
    <!-- Window / Skyline hints -->
    <path d="M20 50 L50 30 L80 50 V150 H20 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="30" y="60" width="12" height="20" rx="2" fill="#38bdf8" opacity="0.2" />
    <rect x="50" y="60" width="12" height="20" rx="2" fill="#38bdf8" opacity="0.2" />
    <rect x="30" y="90" width="12" height="20" rx="2" fill="#38bdf8" opacity="0.2" />
    <rect x="50" y="90" width="12" height="20" rx="2" fill="#38bdf8" opacity="0.2" />

    <!-- Shelving / Props -->
    <line x1="160" y1="45" x2="220" y2="45" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <rect x="175" y="25" width="12" height="20" rx="3" fill="#ec4899" opacity="0.7" />
    <rect x="192" y="30" width="15" height="15" rx="2" fill="#10b981" opacity="0.7" />
  </g>

  <!-- Studio Desk Surface -->
  <path d="M10 185 L230 185 L220 215 L20 215 Z" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <ellipse cx="120" cy="185" rx="110" ry="8" fill="#1e293b" />

  <!-- Props on Desk: Coffee Mug & Sketchpad -->
  <g id="desk-props">
    <!-- Sketchpad -->
    <path d="M35 180 L70 170 L85 195 L50 205 Z" fill="#475569" />
    <path d="M38 182 L68 174 L80 194 L50 202 Z" fill="#f8fafc" />
    <path d="M45 185 L65 178 M48 191 L62 185" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Mug -->
    <rect x="195" y="165" width="16" height="20" rx="3" fill="#ec4899" />
    <path d="M211 170 C216 170 218 173 218 175 C218 177 216 180 211 180" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Main Holographic Display (Showing "New Type / Category" concept) -->
  <g id="hologram-display">
    <!-- Hologram Projection Cone -->
    <polygon points="120,185 85,120 155,120" fill="url(#holo-grad)" />
    <ellipse cx="120" cy="120" rx="35" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    
    <!-- Floating 'New Type' UI Node / Categorization Matrix -->
    <g transform="translate(0, -10)">
      <!-- Central Glowing Node -->
      <circle cx="120" cy="95" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <path d="M114 95 L126 95 M120 89 L120 101" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- Branching New Category Elements (Visualizing 'New Type') -->
      <line x1="105" y1="85" x2="75" y2="65" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" />
      <circle cx="72" cy="63" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
      <path d="M68 63 L76 63" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

      <line x1="135" y1="85" x2="165" y2="65" stroke="#10b981" stroke-width="2" />
      <circle cx="168" cy="63" r="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
      <path d="M165 60 L171 66 M171 60 L165 66" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

      <line x1="120" y1="77" x2="120" y2="45" stroke="#ec4899" stroke-width="2" />
      <rect x="110" y="30" width="20" height="15" rx="3" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
      <circle cx="120" cy="37" r="3" fill="#ec4899" />

      <!-- Sparkles for 'New' -->
      <path d="M145 80 L148 85 L153 88 L148 91 L145 96 L142 91 L137 88 L142 85 Z" fill="#fbbf24" opacity="0.9" />
      <path d="M90 105 L92 108 L95 110 L92 112 L90 115 L88 112 L85 110 L88 108 Z" fill="#38bdf8" opacity="0.9" />
    </g>
  </g>

  <!-- Expressive Character (Designer/Innovator pointing enthusiastically at the new type) -->
  <g id="character">
    <!-- Body / Torso -->
    <path d="M95 190 C95 160 105 150 125 150 C145 150 155 160 155 190 Z" fill="#3b82f6" />
    <!-- Collar / Shirt Detail -->
    <path d="M112 150 L125 162 L138 150" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Neck -->
    <rect x="117" y="138" width="16" height="15" fill="#fcd34d" />

    <!-- Head -->
    <circle cx="125" cy="118" r="22" fill="#fcd34d" />

    <!-- Hair -->
    <path d="M103 115 C103 98 115 94 128 94 C143 94 148 104 148 120 C148 120 142 116 138 112 C132 106 120 106 112 112 C107 116 103 115 103 115 Z" fill="#334155" />

    <!-- Face Expression (Awestruck, proud discovery smile) -->
    <!-- Eyes (happy curves) -->
    <path d="M115 118 Q118 114 121 118" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M129 118 Q132 114 135 118" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Cheeks -->
    <circle cx="114" cy="123" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="136" cy="123" r="3" fill="#f43f5e" opacity="0.4" />
    <!-- Smile -->
    <path d="M119 126 Q125 131 131 126" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Arms & Hands -->
    <!-- Left Arm (Holding Hip) -->
    <path d="M98 165 C85 170 80 185 85 195" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
    
    <!-- Right Arm (Pointing / Presenting excitedly at the hologram) -->
    <path d="M152 162 C168 155 178 135 178 135" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
    <!-- Right Hand -->
    <circle cx="179" cy="133" r="5" fill="#fcd34d" />
  </g>

  <!-- Foreground Atmospheric Elements / Depth Layers -->
  <g id="foreground-accents" opacity="0.8">
    <!-- Glowing particles floating -->
    <circle cx="65" cy="110" r="2" fill="#38bdf8" />
    <circle cx="175" cy="100" r="3" fill="#f59e0b" />
    <circle cx="100" cy="50" r="1.5" fill="#ec4899" />
    <circle cx="155" cy="40" r="2" fill="#38bdf8" />
  </g>

  <!-- Outer Vignette Frame Framing (Subtle Clean Border) -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#334155" stroke-width="1" opacity="0.5" />
</svg>