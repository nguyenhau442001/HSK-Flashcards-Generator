<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Coffee Liquid Gradient -->
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light Glow (Warm task light) -->
  <circle cx="120" cy="80" r="90" fill="#38bdf8" opacity="0.05"/>
  <circle cx="160" cy="140" r="60" fill="#f59e0b" opacity="0.08"/>

  <!-- Background Environment / Elements -->
  <!-- Bookshelf edge -->
  <rect x="180" y="20" width="40" height="120" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="190" y="40" width="20" height="8" rx="2" fill="#64748b" opacity="0.5"/>
  <rect x="185" y="80" width="30" height="8" rx="2" fill="#64748b" opacity="0.5"/>

  <!-- Wooden Desk Surface -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="2"/>
  <line x1="0" y1="164" x2="240" y2="164" stroke="#64748b" stroke-width="1" opacity="0.3"/>

  <!-- SCENE ELEMENTS: Careless / Cluttered Office Desk -->
  
  <!-- Stack of Messy Papers / Reports -->
  <g filter="url(#shadow)">
    <!-- Bottom paper -->
    <polygon points="40,175 110,165 115,210 45,220" fill="#f8fafc"/>
    <line x1="55" y1="185" x2="95" y2="180" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="53" y1="195" x2="85" y2="190" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Top paper (skewed, careless) -->
    <polygon points="60,150 135,170 120,215 45,195" fill="#ffffff"/>
    <line x1="75" y1="168" x2="115" y2="178" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="182" x2="105" y2="190" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Big red correction marks (errors made due to carelessness) -->
    <path d="M 85,165 L 95,175 M 95,165 L 85,175" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80,180 L 90,190 M 90,180 L 80,190" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <!-- Ink blot / stain -->
    <circle cx="105" cy="195" r="4" fill="#ef4444" opacity="0.8"/>
  </g>

  <!-- Laptop (Half-open, pushed aside awkwardly) -->
  <g transform="translate(110, 105)" filter="url(#shadow)">
    <!-- Laptop Base -->
    <path d="M -20 50 L 70 40 L 90 70 L -40 80 Z" fill="#64748b"/>
    <path d="M -15 52 L 65 42 L 83 67 L -33 77 Z" fill="#475569"/>
    <!-- Trackpad -->
    <polygon points="20,58 45,55 48,68 23,71" fill="#334155"/>

    <!-- Laptop Screen (Tilted back haphazardly) -->
    <polygon points="-25,50 -10,-20 80,-10 65,42" fill="#334155"/>
    <polygon points="-20,42 -7,-15 72,-6 58,35" fill="#0f172a"/>
    <!-- Screen content: Error warning or chaotic code lines -->
    <line x1="0" y1="2" x2="35" y2="6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-2" y1="12" x2="45" y2="16" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="22" x2="25" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Tipped-over Coffee Mug (The quintessential careless accident) -->
  <g filter="url(#shadow)">
    <!-- Spilled Coffee Puddle on Desk -->
    <path d="M 60 195 Q 90 180 120 195 Q 140 205 125 220 Q 90 230 65 215 Q 50 205 60 195 Z" fill="url(#coffeeGrad)" opacity="0.85"/>
    <!-- Coffee Splatter Drops -->
    <circle cx="135" cy="210" r="3" fill="#78350f"/>
    <circle cx="145" cy="202" r="1.5" fill="#78350f"/>
    <circle cx="50" cy="188" r="2" fill="#78350f"/>

    <!-- Mug Body (Rolled on its side) -->
    <g transform="translate(75, 185) rotate(-65)">
      <!-- Mug Cylinder -->
      <rect x="-12" y="-15" width="24" height="30" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Mug Bottom -->
      <ellipse cx="-12" cy="0" rx="3" ry="15" fill="#e2e8f0"/>
      <!-- Mug Opening (Showing spilled interior) -->
      <ellipse cx="12" cy="0" rx="3" ry="15" fill="#78350f"/>
      <ellipse cx="12" cy="0" rx="2" ry="11" fill="#451a03"/>
      <!-- Mug Handle -->
      <path d="M -6 -15 C -15 -22 5 -22 -2 -15" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Rolling / Fallen Pen -->
  <g transform="translate(130, 160) rotate(25)" filter="url(#shadow)">
    <rect x="0" y="0" width="35" height="4" rx="2" fill="#fb923c"/>
    <polygon points="35,0 40,2 35,4" fill="#0f172a"/>
    <rect x="5" y="0" width="8" height="4" fill="#f8fafc"/>
  </g>

  <!-- Rushed, Frantic Character Hand / Arm Reaching in to Grab/Fix (Adding dynamic action) -->
  <g filter="url(#shadow)">
    <!-- Sleeve (Yellow/Orange energetic accent) -->
    <path d="M 240 110 L 195 135 L 210 160 L 250 140 Z" fill="#fbbf24"/>
    <path d="M 240 110 L 195 135 L 205 145 L 250 120 Z" fill="#f59e0b"/>
    
    <!-- Hand Palm & Fingers grabbing anxiously -->
    <path d="M 195 135 C 180 142 165 140 155 130 C 150 125 152 118 160 120 C 170 122 178 125 185 120 Z" fill="#fcd34d"/>
    <!-- Fingers spread in panic -->
    <path d="M 155 130 C 148 132 145 128 148 124" fill="none" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
    <path d="M 160 135 C 155 140 152 136 156 131" fill="none" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Exclamation / Confusion Marks (Reinforcing the chaos & mistakes) -->
  <g transform="translate(90, 50)">
    <circle cx="0" cy="0" r="14" fill="#ef4444" opacity="0.2"/>
    <path d="M 0 -7 L 0 3 M 0 8 L 0 10" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(45, 95) scale(0.7)">
    <circle cx="0" cy="0" r="14" fill="#f59e0b" opacity="0.2"/>
    <path d="M 0 -7 L 0 3 M 0 8 L 0 10" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Lighting / Dust motes -->
  <circle cx="80" cy="110" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="150" cy="85" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="110" cy="130" r="2.5" fill="#38bdf8" opacity="0.4"/>
</svg>