<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Rollercoaster Track -->
  <path d="M20 180 C 80 180, 100 50, 140 50 C 180 50, 200 180, 260 180" stroke="#38bdf8" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Rollercoaster Car -->
  <g transform="translate(110, 45) rotate(20)">
    <rect x="-15" y="-10" width="30" height="20" rx="4" fill="#fb923c"/>
    <circle cx="-8" cy="12" r="5" fill="#f8fafc"/>
    <circle cx="8" cy="12" r="5" fill="#f8fafc"/>
    <rect x="-12" y="-5" width="8" height="6" rx="1" fill="#0f172a"/>
    <rect x="4" y="-5" width="8" height="6" rx="1" fill="#0f172a"/>
  </g>

  <!-- Speed Lines / Excitement Effect -->
  <path d="M160 40 L180 30 M170 60 L195 55 M165 20 L190 10" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Background Elements -->
  <circle cx="200" cy="60" r="20" fill="#ec4899" opacity="0.3"/>
  <circle cx="40" cy="100" r="15" fill="#10b981" opacity="0.3"/>
  
  <!-- Ground/Platform -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <path d="M0 200 L240 200" stroke="#334155" stroke-width="2"/>
</svg>