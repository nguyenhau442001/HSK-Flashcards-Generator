<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background shapes/props for depth -->
  <circle cx="120" cy="120" r="90" fill="#334155" opacity="0.15" />
  <circle cx="120" cy="120" r="60" fill="#334155" opacity="0.2" />

  <!-- Studio Desk / Base Surface -->
  <path d="M 20,200 L 220,200 L 205,216 L 35,216 Z" fill="#0f172a" opacity="0.8" />
  <rect x="35" y="210" width="170" height="4" rx="2" fill="#334155" />

  <!-- Retro-Futuristic Cassette Tape Player / Looper Device (Main Subject) -->
  <!-- Device Body -->
  <rect x="52" y="85" width="136" height="95" rx="14" fill="#0f172a" stroke="#475569" stroke-width="3" />
  
  <!-- Metallic Side Accents -->
  <path d="M 52,99 L 52,167 C 52,171 55,174 59,174 L 62,174 C 65,174 68,171 68,167 L 68,99 C 68,95 65,92 62,92 L 59,92 C 55,92 52,95 52,99 Z" fill="#64748b" />
  <path d="M 172,99 L 172,167 C 172,171 175,174 179,174 L 182,174 C 185,174 188,171 188,167 L 188,99 C 188,95 185,92 182,92 L 179,92 C 175,92 172,95 172,99 Z" fill="#64748b" />

  <!-- Screen / Window Recess -->
  <rect x="74" y="98" width="92" height="46" rx="8" fill="url(#screen-grad)" stroke="#334155" stroke-width="2" />

  <!-- Audio Wave / Repetition Echo Waves inside screen -->
  <path d="M 85,121 Q 93,105 101,121 T 117,121 T 133,121 T 149,121 T 165,121" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.3" />
  <path d="M 85,121 Q 93,111 101,121 T 117,121 T 133,121 T 149,121 T 165,121" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M 85,121 Q 93,135 101,121 T 117,121 T 133,121 T 149,121 T 165,121" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Dual Spools representing tape loop / repetition mechanism -->
  <g transform="translate(93, 153)">
    <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="0" cy="0" r="3" fill="#fbbf24" />
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#f59e0b" stroke-width="2" />
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#f59e0b" stroke-width="2" />
  </g>
  <g transform="translate(147, 153)">
    <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="0" cy="0" r="3" fill="#fbbf24" />
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#f59e0b" stroke-width="2" />
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#f59e0b" stroke-width="2" />
  </g>

  <!-- Magnetic Tape Ribbon looping underneath -->
  <path d="M 93,163 Q 120,175 147,163" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8" />

  <!-- Action / UI Indicator Lights -->
  <circle cx="68" cy="80" r="3" fill="#ef4444" />
  <circle cx="172" cy="80" r="3" fill="#10b981" filter="url(#glow)" />

  <!-- Dynamic "Repeat" Loop Arrows floating around the device -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Right Circular Loop Arrow (Amber) -->
    <path d="M 170,55 A 24,24 0 0,1 202,78 L 210,70" stroke="#f59e0b" stroke-width="4" filter="url(#glow)" />
    <path d="M 202,78 L 194,86" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <circle cx="186" cy="53" r="3" fill="#f59e0b" />

    <!-- Bottom Left Circular Loop Arrow (Cyan/Blue) -->
    <path d="M 70,190 A 24,24 0 0,1 38,167 L 30,175" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />
    <path d="M 38,167 L 46,159" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="54" cy="192" r="3" fill="#38bdf8" />
  </g>

  <!-- Sound Waves / Echo Ripples emanating outwards (Action/Iteration concept) -->
  <path d="M 27,105 Q 18,120 27,135" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 18,95 Q 6,120 18,145" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
  
  <path d="M 213,105 Q 222,120 213,135" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" opacity="0.7" filter="url(#glow)" />
  <path d="M 222,95 Q 234,120 222,145" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

  <!-- Interactive Control Knobs & Buttons on the Device -->
  <circle cx="68" cy="130" r="5" fill="#334155" stroke="#64748b" stroke-width="2" />
  <circle cx="172" cy="130" r="5" fill="#334155" stroke="#64748b" stroke-width="2" />
  
  <rect x="95" y="77" width="12" height="6" rx="3" fill="#fb923c" />
  <rect x="114" y="77" width="12" height="6" rx="3" fill="#38bdf8" />
  <rect x="133" y="77" width="12" height="6" rx="3" fill="#10b981" />

  <!-- Ambient Highlight Sparkles / Atmosphere -->
  <path d="M 42,48 L 44,54 L 50,56 L 44,58 L 42,64 L 40,58 L 34,56 L 40,54 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M 198,38 L 199,42 L 203,43 L 199,44 L 198,48 L 197,44 L 193,43 L 197,42 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M 205,188 L 206,191 L 209,192 L 206,193 L 205,196 L 204,193 L 201,192 L 204,191 Z" fill="#ec4899" opacity="0.8" />
</svg>