<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Club Interior -->
    <radialGradient id="clubGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#clubGlow)" />

  <!-- Environmental Context / Club Interior Background Elements -->
  <g opacity="0.4">
    <!-- Club Logo Silhouette / Wall Decor (Abstract shape, NO text) -->
    <circle cx="120" cy="45" r="20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M110 45 L125 35 L125 55 Z" fill="#38bdf8" />
    
    <!-- Ambient Wall Shelves with Props -->
    <rect x="25" y="75" width="50" height="4" rx="2" fill="#334155" />
    <circle cx="40" cy="68" r="7" fill="#f59e0b" />
    <rect x="55" y="62" width="10" height="13" rx="2" fill="#10b981" />

    <rect x="165" y="75" width="50" height="4" rx="2" fill="#334155" />
    <path d="M185 75 L185 62 C185 60 195 60 195 62 L195 75" fill="none" stroke="#ec4899" stroke-width="3" />
    <circle cx="202" cy="70" r="5" fill="#38bdf8" />
  </g>

  <!-- Foreground Table / Counter -->
  <path d="M 20 190 L 220 190 L 205 220 L 35 220 Z" fill="#334155" />
  <path d="M 20 190 L 220 190 L 220 194 L 20 194 Z" fill="#475569" />

  <!-- Props on Table (Showing active club engagement) -->
  <g filter="url(#softShadow)">
    <!-- Laptop / Registration device -->
    <rect x="95" y="178" width="50" height="15" rx="2" fill="#94a3b8" />
    <polygon points="85,193 155,193 160,198 80,198" fill="#64748b" />
    <!-- Screen glow -->
    <rect x="100" y="168" width="40" height="12" rx="1" fill="#38bdf8" opacity="0.8" />
    
    <!-- Coffee Mug -->
    <rect x="158" y="178" width="12" height="14" rx="2" fill="#fb923c" />
    <path d="M 170 182 C 174 182 174 188 170 188" fill="none" stroke="#fb923c" stroke-width="2" />

    <!-- Notebook & Pen -->
    <rect x="62" y="182" width="22" height="14" rx="1" transform="rotate(-10 73 189)" fill="#f8fafc" />
    <line x1="66" y1="185" x2="78" y2="183" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="66" y1="188" x2="78" y2="186" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Characters (Representing "Many Members" in a club) -->

  <!-- Character 1: Left (Greeting / Welcoming) -->
  <g transform="translate(15, 85)" filter="url(#softShadow)">
    <!-- Body / Torso -->
    <path d="M 20 80 Q 20 50 35 50 Q 50 50 50 80 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="35" cy="35" r="14" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 21 35 C 21 23 49 23 49 35 C 49 28 45 22 35 22 C 25 22 21 28 21 35 Z" fill="#475569" />
    <!-- Arm waving -->
    <path d="M 20 55 C 10 50 5 35 5 35" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <circle cx="5" cy="33" r="4" fill="#fbcfe8" />
    <!-- Face details -->
    <circle cx="39" cy="34" r="1.5" fill="#1e293b" />
    <path d="M 37 40 Q 39 42 41 40" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Character 2: Center (Main Active Member / Presenter) -->
  <g transform="translate(92, 70)" filter="url(#softShadow)">
    <!-- Body / Torso -->
    <path d="M 15 90 Q 15 55 28 55 Q 41 55 41 90 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="28" cy="38" r="16" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M 12 38 C 12 20 44 20 44 38 C 42 27 38 25 28 25 C 18 25 14 27 12 38 Z" fill="#1e293b" />
    <!-- Gesture: Arms holding tablet/clipboard enthusiastically -->
    <path d="M 18 65 L 8 78 L 22 83" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 38 65 L 48 78 L 34 83" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Face details (Happy, engaged expression) -->
    <circle cx="23" cy="37" r="1.5" fill="#1e293b" />
    <circle cx="33" cy="37" r="1.5" fill="#1e293b" />
    <path d="M 25 43 Q 28 47 31 43" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Cheeks -->
    <circle cx="21" cy="40" r="2" fill="#f43f5e" opacity="0.4" />
    <circle cx="35" cy="40" r="2" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- Character 3: Right (Engaged Member listening/interacting) -->
  <g transform="translate(170, 80)" filter="url(#softShadow)">
    <!-- Body / Torso -->
    <path d="M 20 85 Q 20 50 35 50 Q 50 50 50 85 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="35" cy="35" r="14" fill="#fbcfe8" />
    <!-- Hair (Ponytail) -->
    <circle cx="35" cy="33" r="14" fill="#9333ea" />
    <path d="M 21 35 C 21 21 49 21 49 35 Z" fill="#9333ea" />
    <circle cx="50" cy="38" r="6" fill="#9333ea" />
    <!-- Arm leaning -->
    <path d="M 20 60 C 15 70 25 80 25 80" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />
    <!-- Face details -->
    <circle cx="31" cy="34" r="1.5" fill="#1e293b" />
    <path d="M 33 39 Q 35 41 37 39" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Character 4: Back background member (Adding depth and crowd feel) -->
  <g transform="translate(140, 95)" opacity="0.8">
    <path d="M 15 70 Q 15 45 25 45 Q 35 45 35 70 Z" fill="#f59e0b" />
    <circle cx="25" cy="32" r="11" fill="#fed7aa" />
    <path d="M 16 32 C 16 18 34 18 34 32 Z" fill="#78350f" />
  </g>

  <!-- Floating Ambient Elements (Indicating lively club atmosphere & activity) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Star sparkles -->
    <path d="M 45 110 L 45 120 M 40 115 L 50 115" stroke="#fbbf24" stroke-width="2" />
    <path d="M 195 100 L 195 108 M 191 104 L 199 104" stroke="#38bdf8" stroke-width="2" />
    <path d="M 130 65 L 130 71 M 127 68 L 133 68" stroke="#10b981" stroke-width="2" />
    
    <!-- Musical notes / Social vibe indicators -->
    <path d="M 70 70 C 70 65 75 63 78 66 L 78 72" stroke="#ec4899" stroke-width="2" />
    <circle cx="68" cy="72" r="2" fill="#ec4899" />
    <circle cx="76" cy="70" r="2" fill="#ec4899" />
  </g>

  <!-- Vignette / Framing Border (Subtle) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>