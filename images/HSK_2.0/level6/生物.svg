<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ocean Depth -->
  <path d="M0 120 Q 60 100, 120 120 T 240 120 V 240 H 0 Z" fill="#1e3a8a" opacity="0.4"/>
  
  <!-- Characters: Two divers looking at creatures -->
  <g transform="translate(40, 140)">
    <circle cx="10" cy="-5" r="8" fill="#fbbf24"/>
    <path d="M2 5 l16 0 l-2 15 l-12 0 z" fill="#38bdf8"/>
    <path d="M5 20 l4 10 M15 20 l-4 10" stroke="#38bdf8" stroke-width="2"/>
  </g>
  
  <g transform="translate(80, 150)">
    <circle cx="10" cy="-5" r="8" fill="#fbbf24"/>
    <path d="M2 5 l16 0 l-2 15 l-12 0 z" fill="#ec4899"/>
    <path d="M5 20 l4 10 M15 20 l-4 10" stroke="#ec4899" stroke-width="2"/>
  </g>

  <!-- Strange Creatures -->
  <!-- Jellyfish -->
  <g transform="translate(180, 80)">
    <path d="M-15 0 A 15 15 0 0 1 15 0 L 10 20 L 0 15 L -10 20 Z" fill="#10b981"/>
    <path d="M-10 15 l-5 15 M0 15 l0 20 M10 15 l5 15" stroke="#10b981" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Glowing fish -->
  <g transform="translate(140, 180)">
    <ellipse cx="0" cy="0" rx="15" ry="8" fill="#fb923c"/>
    <path d="M-15 0 l-10 -5 l0 10 z" fill="#fb923c"/>
    <circle cx="8" cy="-2" r="2" fill="#0f172a"/>
  </g>

  <!-- Bubbles -->
  <circle cx="60" cy="130" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="70" cy="120" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="65" cy="110" r="4" fill="#ffffff" opacity="0.2"/>
  
  <!-- Coral/Seaweed -->
  <path d="M200 240 Q 210 200, 200 160 Q 190 200, 200 240" fill="#ec4899" opacity="0.6"/>
  <path d="M220 240 Q 230 200, 220 150 Q 210 200, 220 240" fill="#10b981" opacity="0.6"/>
</svg>