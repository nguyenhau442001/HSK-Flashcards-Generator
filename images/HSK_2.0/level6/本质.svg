<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155" opacity="0.4"/>
  
  <!-- The Core Object (An apple being sliced to reveal its core/essence) -->
  <!-- Apple Body -->
  <path d="M120 70 C150 70 170 90 170 120 C170 150 150 170 120 170 C90 170 70 150 70 120 C70 90 90 70 120 70 Z" fill="#ec4899"/>
  
  <!-- The Cut Reveal -->
  <path d="M120 70 L120 170" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The Core (Essence) -->
  <path d="M110 110 C110 100 130 100 130 110 C130 130 110 130 110 110 Z" fill="#f59e0b"/>
  <circle cx="115" cy="115" r="3" fill="#0f172a"/>
  <circle cx="125" cy="115" r="3" fill="#0f172a"/>
  
  <!-- Magnifying Glass focusing on the core -->
  <circle cx="140" cy="110" r="35" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="10 5"/>
  <path d="M165 135 L190 160" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Atmospheric details -->
  <circle cx="50" cy="60" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="200" cy="80" r="3" fill="#10b981" opacity="0.6"/>
  <path d="M180 40 L190 30" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Desk props -->
  <rect x="30" y="190" width="40" height="10" rx="2" fill="#475569"/>
  <circle cx="200" cy="200" r="15" fill="#334155"/>
  <path d="M195 195 L205 205" stroke="#94a3b8" stroke-width="2"/>
</svg>