<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Lake Water Gradient -->
    <linearGradient id="lake-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Lily Pad Gradient -->
    <linearGradient id="lily-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Stone Gradient -->
    <linearGradient id="stone-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Reflection Gradient -->
    <linearGradient id="reflection-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Scenery (Night/Twilight Garden) -->
  <g id="scenery">
    <!-- Distant hills / bank -->
    <path d="M-10 110 Q 50 95, 120 105 T 250 95 L 250 140 L -10 140 Z" fill="#0f172a" />
    
    <!-- Reeds and Bamboo Silhouettes in background -->
    <path d="M20 110 L 15 65 M25 110 L 30 70 M15 110 L 10 75" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    <path d="M210 105 L 215 60 M205 105 L 200 65 M218 105 L 222 70" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Distant warm lantern / glow -->
    <circle cx="190" cy="85" r="12" fill="#fbbf24" opacity="0.15" />
    <circle cx="190" cy="85" r="4" fill="#fbbf24" opacity="0.8" />
  </g>

  <!-- MAIN SUBJECT: The Lake Surface (Mặt hồ tĩnh lặng) -->
  <g id="lake-surface" filter="url(#shadow)">
    <!-- Lake Water Body -->
    <path d="M 15 125 C 60 115, 180 115, 225 125 C 235 127, 235 210, 225 212 C 180 222, 60 222, 15 212 C 5 210, 5 127, 15 125 Z" fill="url(#lake-grad)" />
    
    <!-- Surface Horizon Line Highlight (Sharp edge defining the 'biǎomiàn' / surface plane) -->
    <path d="M 15 125 C 60 115, 180 115, 225 125" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" />
    <path d="M 17 127 C 60 118, 180 118, 223 127" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.5" />

    <!-- Calm Surface Ripples (Horizontal, undisturbed gentle lines) -->
    <path d="M 60 145 Q 90 143, 120 145" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 130 165 Q 160 163, 190 165" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 40 185 Q 70 183, 100 185" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Surface Details & Floating Objects -->
  <g id="surface-elements">
    <!-- Lily Pad 1 (Left foreground) -->
    <path d="M 50 165 C 35 160, 30 175, 45 185 C 55 190, 70 180, 65 170 Z" fill="url(#lily-grad)" />
    <!-- Lily Pad Cutout & Veins -->
    <path d="M 45 185 L 52 175" stroke="#065f46" stroke-width="1" />
    <path d="M 47 178 L 60 172" stroke="#065f46" stroke-width="0.8" opacity="0.6" />

    <!-- Lotus Flower resting on the surface -->
    <g transform="translate(160, 140)">
      <!-- Reflection of lotus -->
      <ellipse cx="0" cy="18" rx="10" ry="4" fill="url(#reflection-grad)" />
      <!-- Petals -->
      <path d="M 0 10 Q -8 0, 0 -10 Q 8 0, 0 10 Z" fill="#f472b6" />
      <path d="M -4 12 Q -12 4, -4 -4 Q 2 4, -4 12 Z" fill="#db2777" />
      <path d="M 4 12 Q 12 4, 4 -4 Q -2 4, 4 12 Z" fill="#f472b6" />
      <path d="M 0 14 Q -15 8, -8 -2 Q 0 6, 0 14 Z" fill="#fbcfe8" />
      <path d="M 0 14 Q 15 8, 8 -2 Q 0 6, 0 14 Z" fill="#f472b6" />
      <!-- Center -->
      <circle cx="0" cy="4" r="3" fill="#fbbf24" />
    </g>

    <!-- Lily Pad 2 (Right) -->
    <path d="M 170 190 C 155 185, 150 200, 165 208 C 175 215, 195 205, 190 195 Z" fill="url(#lily-grad)" />
    <path d="M 165 208 L 175 198" stroke="#065f46" stroke-width="1" />
  </g>

  <!-- Foreground Bank / Stone Pier (Frames the 'surface' context) -->
  <g id="foreground-bank">
    <!-- Mossy Rock on Left Edge -->
    <path d="M -5 240 L -5 180 Q 20 175, 35 190 T 50 240 Z" fill="url(#stone-grad)" />
    <!-- Moss patch -->
    <path d="M 10 185 Q 20 180, 30 188 Q 20 195, 10 185 Z" fill="#10b981" />

    <!-- Traditional Stone Lantern (Tōrō style) on the right bank -->
    <g transform="translate(195, 130)">
      <!-- Base -->
      <path d="M 10 80 L 30 80 L 35 95 L 5 95 Z" fill="#64748b" />
      <!-- Pillar -->
      <rect x="15" y="55" width="10" height="25" fill="#475569" />
      <!-- Light Box (Fireplace) -->
      <path d="M 10 40 L 30 40 L 32 55 L 8 55 Z" fill="#64748b" />
      <rect x="13" y="44" width="14" height="8" rx="2" fill="#fbbf24" opacity="0.9" />
      <!-- Roof -->
      <path d="M 5 40 L 35 40 L 20 20 Z" fill="#334155" />
      <circle cx="20" cy="18" r="3" fill="#64748b" />
      
      <!-- Reflection of Lantern in the water surface -->
      <ellipse cx="-15" cy="45" rx="8" ry="3" fill="#fbbf24" opacity="0.3" />
    </g>
  </g>

  <!-- Atmospheric Lighting & Magic Sparks (Enhancing the 'tĩnh lặng' / serene mood) -->
  <g id="atmosphere">
    <!-- Glowing Firefly / Light particle near surface -->
    <circle cx="95" cy="135" r="3" fill="#fde047" filter="url(#shadow)" />
    <circle cx="95" cy="135" r="7" fill="#fde047" opacity="0.3" />

    <circle cx="130" cy="155" r="2" fill="#fde047" />
    <circle cx="130" cy="155" r="5" fill="#fde047" opacity="0.2" />

    <circle cx="65" cy="160" r="2.5" fill="#fde047" />
    <circle cx="65" cy="160" r="6" fill="#fde047" opacity="0.25" />
  </g>

  <!-- Frame Border / Vignette overlay for clean app icon look -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>