<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Sun/Weather Glow -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Battery/Energy Flow Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- UI/Pill Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Stars/Sparks) -->
  <g fill="#334155" opacity="0.6">
    <circle cx="30" cy="40" r="1.5"/>
    <circle cx="210" cy="50" r="2"/>
    <circle cx="190" cy="180" r="1"/>
    <circle cx="45" cy="160" r="1.5"/>
  </g>

  <!-- SCENE LAYER: Scenic Landscape representing continuous good weather/time passing -->
  <!-- Rolling Hills in the distance -->
  <path d="M-10 170 Q 60 140, 130 160 T 250 150 L 250 240 L -10 240 Z" fill="#1e1b4b" opacity="0.5"/>
  <path d="M-10 185 Q 90 155, 170 175 T 250 165 L 250 240 L -10 240 Z" fill="#312e81" opacity="0.6"/>

  <!-- Foreground Ground Terrain -->
  <path d="M-10 200 Q 70 180, 150 195 T 250 185 L 250 240 L -10 240 Z" fill="#0f172a"/>
  
  <!-- Stylized Evergreen Trees / Environment Props -->
  <polygon points="30,200 42,175 54,200" fill="#1e293b"/>
  <polygon points="42,200 50,185 58,200" fill="#334155"/>
  <polygon points="195,195 208,170 221,195" fill="#1e293b"/>

  <!-- Continuous Weather Representation: Radiant Sun with Dynamic Continuous Rays -->
  <g transform="translate(120, 95)">
    <!-- Outer Glow Rings -->
    <circle cx="0" cy="0" r="42" fill="#fbbf24" opacity="0.15" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="34" fill="#fbbf24" opacity="0.25"/>
    
    <!-- Sun Body -->
    <circle cx="0" cy="0" r="26" fill="url(#sunGrad)"/>
    
    <!-- Continuous Action Loop Orbit (Representing duration/continuity) -->
    <path d="M -38 0 A 38 38 0 1 1 38 0" stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M 45 0 A 45 45 0 1 1 -45 0" stroke="#fb923c" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Flowing Clouds (Moving Continuously) -->
  <g fill="#38bdf8" opacity="0.2">
    <path d="M 40 70 q 10 -10, 20 0 q 10 -5, 15 10 q 15 0, 10 15 q -25 5 -45 -5 z"/>
    <path d="M 160 90 q 8 -8, 16 0 q 8 -4, 12 8 q 12 0, 8 12 q -20 4 -36 -4 z"/>
  </g>

  <!-- CENTRAL ACTION OBJECT: The "Duration/Continuity" Device -->
  <!-- A sleek, tangible futuristic/modern hourglass & energy core module anchored in the scene -->
  <g transform="translate(120, 140)">
    <!-- Base Platform / Pedestal -->
    <ellipse cx="0" cy="38" rx="35" ry="10" fill="#090d16"/>
    <ellipse cx="0" cy="36" rx="28" ry="7" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M -22 36 L -18 24 L 18 24 L 22 36 Z" fill="#334155"/>

    <!-- Glass Capsule / Chamber for "Continuing" Flow -->
    <rect x="-24" y="-36" width="48" height="64" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
    
    <!-- Inner Energy Fill (Liquid/Sand rising or falling continuously) -->
    <clipPath id="capsuleClip">
      <rect x="-22" y="-34" width="44" height="60" rx="22"/>
    </clipPath>
    
    <g clip-path="url(#capsuleClip)">
      <!-- Background of capsule -->
      <rect x="-22" y="-34" width="44" height="60" fill="#1e293b" opacity="0.5"/>
      
      <!-- Continuous wave/energy level -->
      <path d="M -30 10 Q -10 5, 10 10 T 50 10 L 50 50 L -30 50 Z" fill="url(#energyGrad)" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,0; -20,0; 0,0" dur="4s" repeatCount="indefinite"/>
      </path>
      
      <!-- Floating Energy Particles / Time tokens -->
      <circle cx="-5" cy="5" r="3" fill="#ffffff" opacity="0.8"/>
      <circle cx="8" cy="-10" r="2" fill="#38bdf8" opacity="0.9"/>
      <circle cx="-10" cy="-20" r="2.5" fill="#c084fc" opacity="0.7"/>
      <circle cx="4" cy="18" r="1.5" fill="#fef08a" opacity="0.9"/>
    </g>

    <!-- Glass Reflection Highlights -->
    <path d="M -16 -26 Q -18 0, -16 26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Dynamic Infinity/Continuity Loop Ring wrapping around the device -->
    <ellipse cx="0" cy="0" rx="38" ry="14" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 5" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Glowing Accent Nodes -->
    <circle cx="-38" cy="0" r="4" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="38" cy="0" r="4" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <!-- Foreground Dynamic Elements: Floating Progress Sparks & Leaf (representing enduring nature) -->
  <g transform="translate(70, 165)">
    <path d="M 0 10 Q 8 0, 15 10 Q 5 20, 0 10 Z" fill="#10b981"/>
    <path d="M 0 10 L 10 5" stroke="#065f46" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(165, 150)">
    <path d="M 0 8 Q 6 -2, 12 8 Q 4 16, 0 8 Z" fill="#34d399"/>
    <path d="M 0 8 L 8 4" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Highlights indicating ongoing vitality -->
  <g fill="#38bdf8">
    <path d="M 95 75 L 98 82 L 105 85 L 98 88 L 95 95 L 92 88 L 85 85 L 92 82 Z" opacity="0.8"/>
    <path d="M 148 115 L 150 119 L 154 121 L 150 123 L 148 127 L 146 123 L 142 121 L 146 119 Z" opacity="0.6"/>
  </g>

</svg>