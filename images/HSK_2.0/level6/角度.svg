<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing effect for camera beam -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm ambient light -->
    <radialGradient id="warm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient background lighting -->
  <circle cx="160" cy="80" r="80" fill="url(#warm-glow)"/>

  <!-- Floor/Desk surface -->
  <path d="M 20 190 L 220 190 L 240 220 L 0 220 Z" fill="#090d16" opacity="0.8"/>
  <line x1="20" y1="190" x2="220" y2="190" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Secondary Background Object: Potted Plant for depth -->
  <g transform="translate(190, 140)">
    <!-- Pot -->
    <path d="M 5 20 L 15 45 L -5 45 L 5 20 Z" fill="#475569"/>
    <ellipse cx="5" cy="20" rx="5" ry="2" fill="#64748b"/>
    <!-- Stem & Leaves -->
    <path d="M 5 20 Q 0 5 -10 0" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <path d="M 5 20 Q 15 0 20 -5" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-10" cy="0" r="4" fill="#34d399"/>
    <circle cx="20" cy="-5" r="5" fill="#34d399"/>
  </g>

  <!-- Main Object: Artistic Sculpture/Model on a pedestal (representing the subject viewed from different angles) -->
  <g transform="translate(120, 140)">
    <!-- Pedestal -->
    <ellipse cx="0" cy="40" rx="35" ry="10" fill="#334155"/>
    <path d="M -30 20 L -35 40 L 35 40 L 30 20 Z" fill="#475569"/>
    <ellipse cx="0" cy="20" rx="30" ry="8" fill="#64748b"/>

    <!-- Geometric Sculpture (The core object being observed) -->
    <!-- Shadow inside pedestal -->
    <ellipse cx="0" cy="20" rx="18" ry="4" fill="#1e293b"/>
    
    <!-- 3D Abstract Sculpture pieces -->
    <path d="M 0 -15 L 15 15 L -15 10 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 -15 L -15 10 L -5 -5 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 -15 L 15 15 L 5 -5 Z" fill="#fb923c" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-15" r="3" fill="#ffffff"/>
  </g>

  <!-- Angular perspective grid / Dimension lines on floor -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.3" stroke-dasharray="3,3">
    <line x1="120" y1="180" x2="60" y2="120"/>
    <line x1="120" y1="180" x2="190" y2="130"/>
    <line x1="60" y1="120" x2="190" y2="130"/>
  </g>

  <!-- Camera / Viewfinder Rig 1 (Low Angle / Side) -->
  <g transform="translate(60, 120) rotate(-15)">
    <!-- Beam projection towards the object -->
    <polygon points="0,0 75,35 75,15" fill="url(#beam-grad)"/>
    <!-- Camera Body -->
    <rect x="-22" y="-14" width="28" height="20" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Lens -->
    <circle cx="6" cy="-4" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="6" cy="-4" r="3" fill="#38bdf8" opacity="0.8"/>
    <!-- Viewfinder bump -->
    <rect x="-14" y="-20" width="12" height="6" rx="2" fill="#0284c7"/>
    <!-- Stand / Tripod leg -->
    <path d="M -10 6 L -20 40" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -2 6 L 5 42" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Camera / Viewfinder Rig 2 (High Angle / Dynamic Main) -->
  <g transform="translate(165, 55) rotate(25)">
    <!-- Camera Beam pointing down-left at the sculpture -->
    <polygon points="0,0 -55,75 -35,75" fill="url(#beam-grad)"/>
    <!-- Stand / Arm holding camera -->
    <path d="M 25 -10 Q 10 -5 0 0" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Camera Body -->
    <rect x="-18" y="-12" width="26" height="18" rx="4" fill="#ec4899" stroke="#f472b6" stroke-width="1.5"/>
    <!-- Lens pointing down-left -->
    <circle cx="-10" cy="-3" r="6" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="-10" cy="-3" r="2.5" fill="#f472b6" opacity="0.9"/>
    <!-- Flash/Light indicator -->
    <circle cx="2" cy="-7" r="1.5" fill="#fbbf24"/>
  </g>

  <!-- Angle Arc Indicators (Visualizing "Angles" / 角度) -->
  <!-- Arc 1 near sculpture -->
  <path d="M 100 170 A 25 15 0 0 0 120 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2"/>
  <circle cx="100" cy="170" r="2" fill="#38bdf8"/>

  <!-- Arc 2 near high camera line -->
  <path d="M 130 95 A 30 30 0 0 1 150 120" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  <circle cx="150" cy="120" r="2" fill="#ec4899"/>

  <!-- Floating UI / Viewfinder HUD elements (Abstract framing brackets, no text) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top-left framing corner -->
    <path d="M 30 40 L 30 30 L 40 30"/>
    <!-- Top-right framing corner -->
    <path d="M 210 40 L 210 30 L 200 30"/>
    <!-- Bottom-left framing corner -->
    <path d="M 30 200 L 30 210 L 40 210"/>
    <!-- Bottom-right framing corner -->
    <path d="M 210 200 L 210 210 L 200 210"/>
    <!-- Center crosshair target -->
    <path d="M 120 125 L 120 135"/>
    <path d="M 115 130 L 125 130"/>
  </g>

  <!-- Sparkles / Atmosphere -->
  <circle cx="85" cy="75" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="170" cy="165" r="1" fill="#38bdf8" opacity="0.6"/>
  <circle cx="50" cy="155" r="2" fill="#34d399" opacity="0.5"/>
</svg>