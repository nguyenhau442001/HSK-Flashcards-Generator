  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Counter Desk -->
  <rect x="20" y="140" width="200" height="60" rx="8" fill="#334155"/>
  <rect x="20" y="140" width="200" height="15" rx="4" fill="#475569"/>
  
