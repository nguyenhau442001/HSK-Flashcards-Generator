<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Hourglass (The Subject) -->
  <g transform="translate(120, 120)">
    <!-- Base -->
    <rect x="-30" y="40" width="60" height="10" rx="2" fill="#94a3b8"/>
    <rect x="-35" y="50" width="70" height="8" rx="2" fill="#64748b"/>
    
    <!-- Top -->
    <rect x="-30" y="-50" width="60" height="10" rx="2" fill="#94a3b8"/>
    <rect x="-35" y="-58" width="70" height="8" rx="2" fill="#64748b"/>
    
    <!-- Glass Frame -->
    <path d="M-20 -40 L20 -40 L5 0 L20 40 L-20 40 L-5 0 Z" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Sand (Golden Glow) -->
    <path d="M-15 -35 L15 -35 L3 -5 Z" fill="#f59e0b"/>
    <path d="M-3 5 L3 5 L15 35 L-15 35 Z" fill="#fbbf24"/>
    
    <!-- Falling Sand Particles -->
    <circle cx="0" cy="0" r="2" fill="#f59e0b"/>
    <circle cx="1" cy="15" r="1.5" fill="#f59e0b"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="200" r="15" fill="#10b981" opacity="0.3"/>
  <path d="M200 50 L215 65 L200 80 L185 65 Z" fill="#ec4899" opacity="0.4"/>
  <circle cx="210" cy="190" r="8" fill="#38bdf8" opacity="0.5"/>
  
  <!-- Light Rays -->
  <path d="M120 120 L160 80" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M120 120 L80 160" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
</svg>