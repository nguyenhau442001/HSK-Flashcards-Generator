<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wood Surface Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33180c" />
      <stop offset="100%" stop-color="#1a0c06" />
    </linearGradient>

    <!-- Glowing Amber Light Effect -->
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Treasure/Preservation Box Gradients -->
    <linearGradient id="boxOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="boxInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Jade Seal/Object Gradients -->
    <linearGradient id="jadeBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Glow -->
  <circle cx="120" cy="110" r="100" fill="url(#amberGlow)" />

  <!-- Ambient Light Beams -->
  <path d="M120 20 L70 200 L170 200 Z" fill="#ffffff" opacity="0.03" />
  <path d="M120 20 L40 180 L80 180 Z" fill="#ffffff" opacity="0.02" />
  <path d="M120 20 L160 180 L200 180 Z" fill="#ffffff" opacity="0.02" />

  <!-- Background Environment: Wooden Shelf & Artifacts -->
  <g opacity="0.8">
    <!-- Back Wall Panel Lines -->
    <line x1="60" y1="20" x2="60" y2="150" stroke="#334155" stroke-width="1" opacity="0.3"/>
    <line x1="120" y1="20" x2="120" y2="150" stroke="#334155" stroke-width="1" opacity="0.3"/>
    <line x1="180" y1="20" x2="180" y2="150" stroke="#334155" stroke-width="1" opacity="0.3"/>
    
    <!-- Shelf Plank -->
    <rect x="30" y="145" width="180" height="8" rx="2" fill="#475569" filter="url(#shadow)"/>
    <rect x="30" y="153" width="180" height="3" fill="#334155"/>

    <!-- Background Scrolls / Relics -->
    <rect x="50" y="105" width="20" height="40" rx="4" fill="#64748b" />
    <circle cx="60" cy="105" r="12" fill="#475569" />
    
    <rect x="175" y="115" width="16" height="30" rx="3" fill="#0284c7" />
    <circle cx="183" cy="115" r="10" fill="#38bdf8" />
  </g>

  <!-- Surface Table/Desk -->
  <rect x="10" y="185" width="220" height="35" rx="6" fill="url(#woodGrad)" filter="url(#shadow)"/>
  <rect x="10" y="185" width="220" height="6" fill="#451a03" rx="2"/>

  <!-- Main Subject: The Open Heritage/Time Chest (Representing "Giữ lại / Bảo lưu") -->
  <g transform="translate(120, 160)" filter="url(#shadow)">
    <!-- Chest Back/Interior -->
    <path d="M-65 -40 L65 -40 L55 -75 L-55 -75 Z" fill="url(#boxInner)"/>
    
    <!-- Chest Open Lid -->
    <path d="M-65 -40 C-65 -90 65 -90 65 -40 Z" fill="url(#boxOuter)" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M-55 -45 C-55 -75 55 -75 55 -45 Z" fill="#451a03" opacity="0.4"/>
    
    <!-- Magical/Precious Glow Emerging from Box -->
    <ellipse cx="0" cy="-45" rx="45" ry="12" fill="#fbbf24" opacity="0.6" filter="url(#softGlow)"/>

    <!-- Preserved Historical Artifacts inside the box -->
    <!-- Glowing Ancient Jade Seal/Scroll -->
    <g transform="translate(0, -55)">
      <rect x="-16" y="-12" width="32" height="20" rx="3" fill="url(#jadeBase)" stroke="#6ee7b7" stroke-width="1.5"/>
      <path d="M-8 -12 L-8 -18 C-8 -21 8 -21 8 -18 L8 -12" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Glowing符文 / Detail (Abstract clean lines, NO text) -->
      <circle cx="0" cy="-2" r="3" fill="#fef08a" />
      <line x1="-8" y1="-2" x2="-3" y2="-2" stroke="#fef08a" stroke-width="1.5"/>
      <line x1="3" y1="-2" x2="8" y2="-2" stroke="#fef08a" stroke-width="1.5"/>
    </g>

    <!-- Side Relic: Glowing Amber Gem / Fossil -->
    <circle cx="-25" cy="-45" r="8" fill="#f97316" stroke="#fdba74" stroke-width="1.5" />
    <circle cx="-27" cy="-47" r="3" fill="#fed7aa" opacity="0.8"/>

    <!-- Side Relic: Golden Coin / Token -->
    <circle cx="28" cy="-48" r="9" fill="#eab308" stroke="#fef08a" stroke-width="1.5" />
    <circle cx="28" cy="-48" r="4" fill="#a16207" />

    <!-- Chest Front Base -->
    <path d="M-70 -35 L70 -35 L65 5 L-65 5 Z" fill="url(#boxOuter)" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M-65 5 L65 5 L60 12 L-60 12 Z" fill="#78350f"/>

    <!-- Metal Reinforcements & Lock on Chest -->
    <rect x="-10" y="-20" width="20" height="22" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <circle cx="0" cy="-9" r="3.5" fill="#78350f"/>
    <!-- Metal Band Left -->
    <path d="M-50 -35 L-42 -35 L-40 5 L-48 5 Z" fill="#fbbf24" opacity="0.8"/>
    <!-- Metal Band Right -->
    <path d="M42 -35 L50 -35 L48 5 L40 5 Z" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Floating Sparkles / Particles representing "Preservation / Legacy" -->
  <g fill="#fbbf24">
    <circle cx="85" cy="85" r="2.5" opacity="0.9" filter="url(#softGlow)"/>
    <circle cx="160" cy="75" r="3.5" opacity="0.8" filter="url(#softGlow)"/>
    <circle cx="100" cy="55" r="2" opacity="0.7"/>
    <circle cx="145" cy="50" r="3" opacity="0.9" filter="url(#softGlow)"/>
    <circle cx="70" cy="120" r="1.5" opacity="0.6"/>
    <circle cx="180" cy="95" r="2" opacity="0.8"/>
  </g>

  <!-- Glowing Star/Sparkle shapes (Action-packed / Vibrant touch) -->
  <g fill="#38bdf8" opacity="0.8">
    <path d="M 60 70 Q 60 75 55 75 Q 60 75 60 80 Q 60 75 65 75 Q 60 75 60 70 Z" />
    <path d="M 185 60 Q 185 66 179 66 Q 185 66 185 72 Q 185 66 191 66 Q 185 66 185 60 Z" />
  </g>
  <g fill="#fbbf24" opacity="0.9">
    <path d="M 120 40 Q 120 47 113 47 Q 120 47 120 54 Q 120 47 127 47 Q 120 47 120 40 Z" />
  </g>

  <!-- Foreground Atmospheric Leaf / Botanical Prop (Framing the scene) -->
  <g transform="translate(15, 175) rotate(-15)">
    <path d="M0 25 C 10 10, 25 0, 45 -10 C 30 5, 20 15, 0 25 Z" fill="#10b981" opacity="0.9"/>
    <path d="M0 25 C 15 20, 25 10, 45 -10" fill="none" stroke="#059669" stroke-width="1.5"/>
  </g>
  <g transform="translate(225, 180) scale(-1, 1) rotate(-20)">
    <path d="M0 25 C 10 10, 25 0, 45 -10 C 30 5, 20 15, 0 25 Z" fill="#059669" opacity="0.8"/>
  </g>
</svg>