<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Track & Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Speed Lines / Glow Gradient -->
    <linearGradient id="speedGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Character 1 (Cyan/Blue Runner) Gradients -->
    <linearGradient id="suit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 (Orange/Amber Runner) Gradients -->
    <linearGradient id="suit2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Trophy / Goal Gradients -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Market/City skyline abstract silhouettes) -->
  <g opacity="0.25">
    <rect x="20" y="70" width="30" height="90" fill="#64748b" rx="2"/>
    <rect x="55" y="50" width="40" height="110" fill="#475569" rx="2"/>
    <rect x="100" y="85" width="25" height="75" fill="#64748b" rx="2"/>
    <rect x="130" y="40" width="45" height="120" fill="#334155" rx="2"/>
    <rect x="180" y="65" width="35" height="95" fill="#475569" rx="2"/>
    <!-- City glowing windows -->
    <rect x="28" y="80" width="5" height="8" fill="#fbbf24"/>
    <rect x="38" y="80" width="5" height="8" fill="#fbbf24"/>
    <rect x="65" y="70" width="8" height="10" fill="#38bdf8"/>
    <rect x="65" y="90" width="8" height="10" fill="#38bdf8"/>
    <rect x="140" y="60" width="8" height="12" fill="#38bdf8"/>
    <rect x="155" y="60" width="8" height="12" fill="#fbbf24"/>
    <rect x="140" y="85" width="8" height="12" fill="#fbbf24"/>
  </g>

  <!-- Action Speed Lines (Horizontal) -->
  <path d="M10 100 L90 100" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M30 140 L130 140" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M5 180 L110 180" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <path d="M120 90 L210 90" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Isometric/Perspective Ground / Track Surface -->
  <path d="M0 165 L240 145 L240 225 L0 225 Z" fill="url(#floorGrad)"/>
  <!-- Track Glowing Lanes -->
  <path d="M-10 175 L250 153" stroke="#334155" stroke-width="2"/>
  <path d="M-10 192 L250 170" stroke="#334155" stroke-width="2"/>
  <path d="M-10 210 L250 188" stroke="#334155" stroke-width="2"/>
  
  <!-- Finish Line Banner / Pillars in Background -->
  <g opacity="0.8">
    <rect x="195" y="70" width="6" height="95" fill="#475569" rx="3"/>
    <path d="M170 80 L220 75 L220 85 L170 90 Z" fill="#ec4899"/>
  </g>

  <!-- --- TARGET OBJECT / SCENE: COMPETITION (Two dynamic runners neck-and-neck) --- -->

  <!-- Character 2: Amber/Orange Runner (Slightly behind, straining to win) -->
  <g transform="translate(65, 105)" filter="url(#shadow)">
    <!-- Motion lines behind runner 2 -->
    <path d="M-15 30 L5 30" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M-25 45 L0 45" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Back Leg (extended back) -->
    <path d="M15 45 L-5 70" stroke="#c2410c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Back Shoe -->
    <path d="M-5 70 L-15 75" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>

    <!-- Body / Torso (Leaning forward aggressively) -->
    <path d="M10 20 L25 50 L5 45 Z" fill="url(#suit2)"/>

    <!-- Back Arm (pumping back) -->
    <path d="M15 25 L-5 40" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>

    <!-- Front Leg (striding forward) -->
    <path d="M20 45 L40 70" stroke="#ea580c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Shoe -->
    <path d="M40 70 L52 72" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>

    <!-- Front Arm (pumping forward) -->
    <path d="M20 25 L40 35" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand / Fist -->
    <circle cx="43" cy="35" r="4" fill="#fbbf24"/>

    <!-- Head & Helmet/Hair (determined expression, leaning forward) -->
    <circle cx="22" cy="12" r="10" fill="#fbbf24"/>
    <!-- Sweat / Action drop -->
    <path d="M30 8 C 32 10, 32 14, 30 14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Visor/Headband -->
    <path d="M14 10 L30 13" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Character 1: Cyan/Blue Runner (Neck-and-neck, intense competition) -->
  <g transform="translate(130, 95)" filter="url(#shadow)">
    <!-- Intense Speed Glow Behind -->
    <ellipse cx="-10" cy="45" rx="25" ry="30" fill="url(#speedGlow)" filter="url(#glow)"/>

    <!-- Motion lines -->
    <path d="M-20 20 L0 20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M-30 40 L5 40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M-15 60 L10 60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Back Leg (mid stride) -->
    <path d="M15 45 L0 75" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Back Shoe -->
    <path d="M0 75 L-10 82" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>

    <!-- Torso (Dynamic forward lean, competitive drive) -->
    <path d="M8 15 L25 45 L2 40 Z" fill="url(#suit1)"/>
    <!-- Chest Emblem (Abstract lightning bolt of energy) -->
    <path d="M15 25 L10 33 L18 33 L12 42" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Back Arm (swinging back) -->
    <path d="M12 20 L-5 35" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>

    <!-- Front Leg (powerful forward push) -->
    <path d="M22 42 L48 65" stroke="#0369a1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Shoe -->
    <path d="M48 65 L60 62" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>

    <!-- Front Arm (reaching forward eagerly) -->
    <path d="M18 22 L42 28" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand / Fist -->
    <circle cx="45" cy="28" r="4.5" fill="#fef08a"/>

    <!-- Head & Aero Visor -->
    <circle cx="20" cy="8" r="10.5" fill="#fef08a"/>
    <!-- Aerodynamic Helmet / Hair -->
    <path d="M10 2 C 25 -2, 32 6, 32 10 L 15 12 Z" fill="#0284c7"/>
    <!-- Visor -->
    <path d="M15 6 L 28 8" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- --- GOAL / PRIZE (Represents the "Market Prize" / Victory in Competition) --- -->
  <g transform="translate(195, 115)" filter="url(#shadow)">
    <!-- Floating Gold Trophy -->
    <path d="M-8 -15 L8 -15 L6 5 C 6 12, -6 12, -6 5 Z" fill="url(#gold)"/>
    <!-- Trophy Handles -->
    <path d="M-8 -12 C -14 -12, -14 -2, -6 0" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M8 -12 C 14 -12, 14 -2, 6 0" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Trophy Base -->
    <rect x="-4" y="13" width="8" height="4" fill="#b45309" rx="1"/>
    <rect x="-8" y="17" width="16" height="4" fill="#78350f" rx="1"/>
    <!-- Glowing Aura around Trophy -->
    <circle cx="0" cy="0" r="18" fill="#fbbf24" opacity="0.2" filter="url(#glow)"/>
    <!-- Sparkles -->
    <path d="M-15 -18 L-15 -12 M-18 -15 L-12 -15" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    <path d="M15 -5 L15 0 M12 -2.5 L18 -2.5" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Ambient Sparkles & Energy Dots (Enhancing action & competition vibe) -->
  <circle cx="110" cy="70" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="160" cy="110" r="1.5" fill="#fb923c" opacity="0.9"/>
  <circle cx="85" cy="150" r="2" fill="#fef08a" opacity="0.7"/>
  <circle cx="45" cy="85" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="140" cy="165" r="2.5" fill="#ec4899" opacity="0.8"/>
  <circle cx="180" cy="60" r="2" fill="#fbbf24" opacity="0.9"/>

  <!-- Foreground Vignette / Frame Enhancement -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>