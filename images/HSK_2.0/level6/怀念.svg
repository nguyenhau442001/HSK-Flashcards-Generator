<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Amber Glow for Nostalgia/Memory -->
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Photo Card Gradient -->
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Wooden Table Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Polaroid Shadow & Style -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  
  <!-- Atmospheric Glow representing warm memories -->
  <circle cx="120" cy="110" r="100" fill="url(#amberGlow)" />

  <!-- Background Ambient Elements (Floating Memory Sparkles / Dust) -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="45" cy="65" r="3" />
    <circle cx="195" cy="50" r="2" />
    <circle cx="205" cy="120" r="3.5" />
    <circle cx="35" cy="150" r="2.5" />
    <circle cx="85" cy="40" r="1.5" />
  </g>

  <!-- Wooden Surface / Desk -->
  <path d="M0 185 Q120 175 240 185 L240 240 L0 240 Z" fill="url(#tableGrad)" />
  <line x1="0" y1="185" x2="240" y2="185" stroke="#312e81" stroke-width="2" opacity="0.5" />

  <!-- Prop 1: Vintage Camera in Background (Left) -->
  <g transform="translate(35, 145) scale(0.65)" opacity="0.85">
    <!-- Camera Body -->
    <rect x="0" y="15" width="60" height="40" rx="6" fill="#475569" />
    <rect x="5" y="10" width="18" height="8" rx="2" fill="#334155" />
    <circle cx="30" cy="35" r="14" fill="#1e293b" />
    <circle cx="30" cy="35" r="10" fill="#38bdf8" opacity="0.3" />
    <circle cx="30" cy="35" r="6" fill="#0f172a" />
    <circle cx="48" cy="23" r="3" fill="#fb923c" />
  </g>

  <!-- Prop 2: Small potted succulent (Right) for living atmosphere -->
  <g transform="translate(170, 135) scale(0.7)">
    <path d="M12 35 L18 55 L32 55 L38 35 Z" fill="#cbd5e1" />
    <ellipse cx="25" cy="35" rx="10" ry="3" fill="#94a3b8" />
    <!-- Leaves -->
    <path d="M25 35 Q15 20 20 10 Q25 20 25 35" fill="#10b981" />
    <path d="M25 35 Q30 18 38 15 Q33 25 25 35" fill="#059669" />
    <path d="M25 35 Q10 28 12 18 Q18 28 25 35" fill="#34d399" />
  </g>

  <!-- MAIN SUBJECT: The Nostalgic Memory Scene (Polaroid Stack & Glowing Holographic Image) -->
  
  <!-- Back/Underneath Polaroid Card -->
  <g transform="translate(75, 45) rotate(-12)" filter="url(#dropShadow)">
    <rect width="90" height="110" rx="4" fill="#f1f5f9" />
    <rect x="9" y="9" width="72" height="72" fill="#cbd5e1" />
  </g>

  <!-- Main Central Polaroid Card representing "Huáiniàn" (Nostalgia) -->
  <g transform="translate(85, 38) rotate(6)" filter="url(#dropShadow)">
    <!-- Polaroid White Frame -->
    <rect width="100" height="120" rx="4" fill="url(#photoGrad)" />
    
    <!-- Inner Photo Area (Dark Retro Cinematic Tone) -->
    <rect x="10" y="10" width="80" height="82" rx="2" fill="#1e293b" />
    
    <!-- Nostalgic Scene Inside Photo: Sunset / Hills / Little House & Tree (Childhood/Past Memories) -->
    <g clip-path="url(#photoClip)">
      <clipPath id="photoClip">
        <rect x="10" y="10" width="80" height="82" rx="2" />
      </clipPath>
      
      <!-- Sky Gradient -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f43f5e" />
        <stop offset="50%" stop-color="#fb923c" />
        <stop offset="100%" stop-color="#fde047" />
      </linearGradient>
      <rect x="10" y="10" width="80" height="82" fill="url(#skyGrad)" />
      
      <!-- Sun -->
      <circle cx="50" cy="50" r="18" fill="#fef08a" opacity="0.9" />

      <!-- Rolling Hills (Layers of Distance) -->
      <path d="M10 75 Q35 55 60 70 T110 65 L110 95 L10 95 Z" fill="#0f172a" opacity="0.6" />
      <path d="M10 82 Q45 68 80 78 L110 95 L10 95 Z" fill="#0f172a" />

      <!-- Silhouette of a Tree and Childhood Memory Elements -->
      <path d="M30 80 L30 55 Q26 50 22 46 Q30 43 38 46 Q34 50 30 55 Z" fill="#0f172a" />
      <path d="M70 82 L70 62 Q67 58 64 54 Q70 51 76 54 Q73 58 70 62 Z" fill="#0f172a" />

      <!-- Little Vintage House Silhouette -->
      <polygon points="50,62 60,68 60,78 40,78 40,68" fill="#0f172a" />
      <polygon points="38,62 50,52 62,62" fill="#312e81" />
    </g>

    <!-- Warm Light Shimmer across photo -->
    <path d="M10 10 L50 10 L30 92 L10 92 Z" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- Glowing Magical Memory Trail (Golden Hearts/Stars swirling from the photo) -->
  <g transform="translate(0, 0)">
    <!-- Trail Path Line -->
    <path d="M135 70 Q160 40 145 20 T110 10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
    
    <!-- Floating Glowing Heart 1 -->
    <path d="M150 45 C150 40 156 38 159 42 C162 38 168 40 168 45 C168 51 159 56 159 56 C159 56 150 51 150 45 Z" fill="#f43f5e" filter="url(#dropShadow)" transform="scale(0.8) translate(40, 5)" />
    
    <!-- Floating Glowing Heart 2 (Smaller) -->
    <path d="M120 25 C120 22 124 20 126 23 C128 20 132 22 132 25 C132 29 126 32 126 32 C126 32 120 29 120 25 Z" fill="#fb923c" filter="url(#dropShadow)" />
    
    <!-- Sparkles -->
    <path d="M95 25 L98 30 L103 33 L98 36 L95 41 L92 36 L87 33 L92 30 Z" fill="#fef08a" opacity="0.9" />
    <path d="M175 90 L177 93 L180 95 L177 97 L175 100 L173 97 L170 95 L173 93 Z" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Foreground Prop: Vintage Pocket Watch / Compass symbolizing time passing (Nostalgia) -->
  <g transform="translate(145, 145) scale(0.8)" filter="url(#dropShadow)">
    <!-- Watch Ring -->
    <circle cx="25" cy="5" r="7" fill="none" stroke="#fbbf24" stroke-width="3" />
    <!-- Watch Body -->
    <circle cx="25" cy="30" r="22" fill="#1e293b" stroke="#fbbf24" stroke-width="4" />
    <!-- Watch Face -->
    <circle cx="25" cy="30" r="18" fill="#f8fafc" />
    <!-- Watch Hands pointing back -->
    <line x1="25" y1="30" x2="16" y2="22" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="25" y1="30" x2="35" y2="24" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="25" cy="30" r="2" fill="#0f172a" />
  </g>

  <!-- Additional Atmospheric Lighting (Soft Vignette Overlay) -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15" />
</svg>