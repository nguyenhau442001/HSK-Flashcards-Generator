<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Background Elements -->
  <rect x="30" y="60" width="180" height="110" rx="8" fill="#334155"/>
  <rect x="40" y="70" width="160" height="90" rx="4" fill="#0f172a"/>
  
  <!-- Digital Transformation Visuals (The "New Model") -->
  <path d="M60 100 L100 80 L140 100 L100 120 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M100 120 L140 100 L180 120 L140 140 Z" fill="#10b981" opacity="0.8"/>
  <circle cx="140" cy="100" r="8" fill="#fb923c"/>
  
  <!-- Characters -->
  <!-- Person 1 (Presenting) -->
  <g transform="translate(40, 130)">
    <circle cx="20" cy="20" r="12" fill="#f59e0b"/>
    <path d="M10 40 Q20 60 30 40" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <rect x="15" y="32" width="10" height="30" fill="#f59e0b"/>
  </g>
  
  <!-- Person 2 (Listening/Observing) -->
  <g transform="translate(170, 130)">
    <circle cx="20" cy="20" r="12" fill="#ec4899"/>
    <path d="M10 40 Q20 60 30 40" stroke="#ec4899" stroke-width="4" fill="none"/>
    <rect x="15" y="32" width="10" height="30" fill="#ec4899"/>
  </g>

  <!-- Table/Desk -->
  <rect x="20" y="170" width="200" height="15" rx="2" fill="#475569"/>
  
  <!-- Decorative Accents -->
  <circle cx="200" cy="40" r="4" fill="#fbbf24"/>
  <circle cx="215" cy="30" r="2" fill="#fbbf24"/>
  <path d="M20 200 L220 200" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Connection Lines -->
  <path d="M80 170 L120 130" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M160 170 L120 130" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>