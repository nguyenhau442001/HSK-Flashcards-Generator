<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="counterSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bottleGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="40%" stop-color="#b45309" />
      <stop offset="70%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Atmospheric Ambient Light -->
  <circle cx="120" cy="110" r="90" fill="#f59e0b" opacity="0.05" filter="url(#glow)" />
  <circle cx="180" cy="160" r="40" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />

  <!-- Kitchen Counter Surface -->
  <path d="M 0 175 L 240 175 L 240 240 L 0 240 Z" fill="url(#counterSurface)" />
  <line x1="0" y1="175" x2="240" y2="175" stroke="#475569" stroke-width="2" opacity="0.5" />

  <!-- Background Elements (Kitchen Ambiance) -->
  <!-- Bamboo steamer basket stacked in background -->
  <ellipse cx="65" cy="140" rx="35" ry="12" fill="#334155" />
  <path d="M 30 110 L 30 140 C 30 146, 100 146, 100 140 L 100 110 Z" fill="#475569" />
  <ellipse cx="65" cy="110" rx="35" ry="12" fill="#64748b" />
  <!-- Steam rising from steamer -->
  <path d="M 55 95 Q 50 80 60 65 T 55 45" fill="none" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 75 98 Q 80 85 70 70 T 78 50" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Garlic cloves and ginger slices (Context props) -->
  <circle cx="45" cy="165" r="10" fill="#f1f5f9" filter="url(#dropShadow)" />
  <path d="M 40 162 Q 45 155 50 162 Z" fill="#cbd5e1" />
  <ellipse cx="25" cy="170" rx="12" ry="7" fill="#fbbf24" opacity="0.8" transform="rotate(-15 25 170)" />
  <ellipse cx="32" cy="174" rx="10" ry="6" fill="#f59e0b" opacity="0.7" transform="rotate(20 32 174)" />

  <!-- MAIN SUBJECT: Vinegar Bottle (醋) -->
  <g filter="url(#dropShadow)">
    <!-- Bottle Base Shadow -->
    <ellipse cx="145" cy="180" rx="22" ry="7" fill="#020617" opacity="0.4" />

    <!-- Bottle Body -->
    <path d="M 130 90 
             C 125 90, 125 105, 127 120 
             L 125 170 
             C 125 178, 165 178, 165 170 
             L 163 120 
             C 165 105, 165 90, 160 90 Z" fill="url(#bottleGlass)" />

    <!-- Liquid Inside Bottle -->
    <path d="M 127 125 
             L 126 170 
             C 126 177, 164 177, 164 170 
             L 163 125 Z" fill="url(#liquid)" />
    <!-- Liquid Surface Line -->
    <ellipse cx="145" cy="125" rx="18.5" ry="4" fill="#7f1d1d" opacity="0.8" />

    <!-- Glass Reflection Highlight -->
    <path d="M 133 98 L 131 165" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" opacity="0.3" />
    <path d="M 138 95 L 137 130" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

    <!-- Bottle Neck & Cork/Cap -->
    <rect x="137" y="72" width="16" height="18" rx="2" fill="#b45309" />
    <path d="M 136 72 L 154 72 L 156 68 L 134 68 Z" fill="#d97706" />
    <rect x="139" y="62" width="12" height="6" rx="3" fill="#f59e0b" />
    <!-- Cap Highlight -->
    <line x1="141" y1="74" x2="141" y2="88" stroke="#fcd34d" stroke-width="1.5" opacity="0.6" />

    <!-- Classic Red & Gold Vintage Label on Bottle -->
    <rect x="131" y="130" width="28" height="32" rx="4" fill="#dc2626" />
    <rect x="133" y="132" width="24" height="28" rx="2" fill="none" stroke="#fcd34d" stroke-width="1.5" />
    <!-- Decorative graphics on label (Abstract motifs representing authentic Chinese dark vinegar label style) -->
    <circle cx="145" cy="142" r="5" fill="#fcd34d" />
    <path d="M 137 152 Q 145 148 153 152" fill="none" stroke="#fcd34d" stroke-width="1.5" />
  </g>

  <!-- POURING ACTION: Stream of Vinegar -->
  <path d="M 140 65 Q 115 80 102 125" fill="none" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 140 65 Q 115 80 102 125" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- SPLASH & RIPPLE EFFECT (Action Dynamic) -->
  <ellipse cx="100" cy="132" rx="6" ry="2" fill="#f8fafc" opacity="0.6" />
  <path d="M 94 133 Q 90 128 93 125" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 106 133 Q 110 128 107 125" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- DIPPING BOWL (Ceramic Sauce Dish with Dark Vinegar) -->
  <g filter="url(#dropShadow)">
    <!-- Bowl Drop Shadow -->
    <ellipse cx="100" cy="142" rx="34" ry="12" fill="#020617" opacity="0.5" />

    <!-- Outer Rim of Bowl -->
    <ellipse cx="100" cy="130" rx="32" ry="11" fill="#e2e8f0" />
    
    <!-- Inner Bowl Cavity -->
    <ellipse cx="100" cy="132" rx="27" ry="9" fill="url(#bowlGrad)" />

    <!-- Vinegar pool inside bowl -->
    <ellipse cx="100" cy="133" rx="24" ry="7.5" fill="url(#sauceGrad)" />
    <!-- Surface Reflection in Bowl -->
    <ellipse cx="94" cy="131" rx="10" ry="2.5" fill="#f8fafc" opacity="0.2" />
    
    <!-- Rim Highlight -->
    <path d="M 68 130 C 68 136, 132 136, 132 130" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- FOREGROUND PROPS: Dumpling (Jiaozi) freshly dipped or ready to dip -->
  <g filter="url(#dropShadow)">
    <!-- Dumpling Shadow -->
    <ellipse cx="170" cy="165" rx="18" ry="6" fill="#020617" opacity="0.4" />

    <!-- Plump Pleated Dumpling -->
    <path d="M 150 160 
             C 150 145, 170 140, 185 150 
             C 195 156, 195 168, 180 172 
             C 165 176, 150 170, 150 160 Z" fill="#fef08a" />
    
    <!-- Dumpling Pleats (Fold details) -->
    <path d="M 150 160 Q 158 152 165 159" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 158 163 Q 166 155 173 162" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 166 166 Q 174 158 181 165" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />

    <!-- Warm golden-brown cooked gradient overlay on dumpling -->
    <path d="M 150 160 
             C 150 145, 170 140, 185 150 
             C 195 156, 195 168, 180 172 
             C 165 176, 150 170, 150 160 Z" fill="#eab308" opacity="0.25" />
  </g>

  <!-- Second small dumpling partially submerged / resting near bowl -->
  <g filter="url(#dropShadow)">
    <path d="M 75 145 C 75 138, 90 135, 98 142 C 104 147, 100 155, 90 157 C 80 158, 75 152, 75 145 Z" fill="#fef08a" />
    <path d="M 75 145 Q 82 140 88 146" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round" />
    <!-- Wet glossy vinegar sheen on the submerged part -->
    <path d="M 80 148 C 80 145, 90 145, 95 150 C 95 150, 85 155, 80 148 Z" fill="#7f1d1d" opacity="0.4" />
  </g>

  <!-- Chopsticks resting above -->
  <g filter="url(#dropShadow)">
    <!-- Chopstick 1 -->
    <path d="M 80 50 L 190 110" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
    <path d="M 80 50 L 190 110" fill="none" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <!-- Chopstick Tip Accents (Red lacquer tips) -->
    <path d="M 80 50 L 95 58" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />

    <!-- Chopstick 2 (Parallel & slightly offset) -->
    <path d="M 85 43 L 195 103" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" />
    <path d="M 85 43 L 98 50" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Sparkles and Highlights (Visual Polish) -->
  <circle cx="115" cy="115" r="2" fill="#38bdf8" opacity="0.8" filter="url(#glow)" />
  <circle cx="155" cy="110" r="1.5" fill="#f59e0b" opacity="0.9" />
  <circle cx="65" cy="160" r="1" fill="#f8fafc" opacity="0.7" />
  <circle cx="130" cy="180" r="2" fill="#38bdf8" opacity="0.6" />

</svg>