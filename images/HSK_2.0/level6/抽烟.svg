<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for Cigarette/Ambient -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Smoke Gradient -->
    <linearGradient id="smokeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Ashtray Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting / Glow behind the scene -->
  <circle cx="120" cy="130" r="80" fill="url(#glowGrad)" />

  <!-- Background Environment: Wooden Table and Wall Seam -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" />
  <path d="M0 161 L240 161" stroke="#0f172a" stroke-width="1" />

  <!-- Table Surface with slight perspective -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#1e293b" opacity="0.9"/>
  <!-- Table Wood Texture / Highlight -->
  <ellipse cx="120" cy="185" rx="100" ry="25" fill="#334155" opacity="0.4" />

  <!-- Back Context Prop: Matchbox / Lighter -->
  <g transform="translate(60, 135) rotate(-15)" filter="url(#shadow)">
    <!-- Lighter Body -->
    <rect x="0" y="10" width="22" height="32" rx="4" fill="#ef4444" />
    <!-- Lighter Metal Top -->
    <rect x="2" y="2" width="18" height="10" rx="2" fill="#cbd5e1" />
    <path d="M7 2 L7 12 M15 2 L15 12" stroke="#64748b" stroke-width="1.5" />
    <!-- Flame Spark Accent -->
    <path d="M11 -2 C13 -5, 11 -8, 11 -10 C14 -7, 14 -3, 11 -2" fill="#fbbf24" />
  </g>

  <!-- Main Subject Group: Ashtray and Burning Cigarette -->
  <g filter="url(#shadow)">
    
    <!-- Stylized Glass/Ceramic Ashtray Base -->
    <ellipse cx="120" cy="180" rx="55" ry="22" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Ashtray Inner Bowl -->
    <ellipse cx="120" cy="177" rx="45" ry="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <!-- Ashtray Rim Highlight -->
    <path d="M 65 180 Q 120 198 175 180" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Resting Cigarette in Ashtray (Partial) -->
    <rect x="95" y="172" width="40" height="7" rx="3" transform="rotate(10 120 175)" fill="#f8fafc" />
    <rect x="120" y="172" width="12" height="7" rx="1" transform="rotate(10 120 175)" fill="#fb923c" /> <!-- Filter -->

  </g>

  <!-- Active Dynamic Cigarette (Hovering / Front and Center) -->
  <g filter="url(#shadow)" transform="rotate(-25 120 115)">
    <!-- Cigarette Body -->
    <rect x="70" y="110" width="80" height="10" rx="4" fill="#f8fafc" />
    <!-- Filter Section (Golden/Orange) -->
    <rect x="70" y="110" width="24" height="10" rx="3" fill="#fb923c" />
    <!-- Filter Ring Lines -->
    <line x1="94" y1="110" x2="94" y2="120" stroke="#ea580c" stroke-width="1.5" />
    <line x1="82" y1="110" x2="82" y2="120" stroke="#fed7aa" stroke-width="1" opacity="0.6" />
    <!-- White Paper Texture Highlights -->
    <line x1="105" y1="112" x2="140" y2="112" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Glowing Burning Tip -->
    <rect x="146" y="110" width="4" height="10" rx="2" fill="#ef4444" />
    <rect x="148" y="111" width="2" height="8" rx="1" fill="#fbbf24" />
    <circle cx="149" cy="115" r="3" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Flowing Stylized Smoke (Action/Vivid Element) -->
  <g filter="url(#shadow)">
    <!-- Swirling Smoke Path -->
    <path d="M 175 95 
             C 170 70, 190 50, 175 30 
             C 160 10, 130 20, 135 0" 
          fill="none" stroke="url(#smokeGrad)" stroke-width="8" stroke-linecap="round" />

    <path d="M 180 85 
             C 195 70, 185 55, 195 40" 
          fill="none" stroke="url(#smokeGrad)" stroke-width="5" stroke-linecap="round" opacity="0.7" />

    <!-- Smoke Wisps / Circles -->
    <circle cx="175" cy="25" r="8" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.3" />
    <circle cx="150" cy="10" r="12" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.2" />
    <circle cx="130" cy="-5" r="16" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.1" />
  </g>

  <!-- Foreground Atmospheric Sparks / Ember Particles -->
  <g fill="#fbbf24">
    <circle cx="165" cy="80" r="2.5" opacity="0.9" />
    <circle cx="178" cy="65" r="1.5" opacity="0.7" />
    <circle cx="155" cy="45" r="2" opacity="0.8" />
    <circle cx="185" cy="35" r="1" opacity="0.5" />
  </g>

</svg>