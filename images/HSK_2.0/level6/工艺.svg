<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="170" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- The Porcelain Vase -->
  <path d="M120 80 C 100 80, 90 100, 90 120 C 90 150, 110 160, 120 160 C 130 160, 150 150, 150 120 C 150 100, 140 80, 120 80 Z" fill="#f8fafc"/>
  <path d="M105 95 C 110 90, 130 90, 135 95" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M100 110 C 110 105, 130 105, 140 110" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M100 130 C 110 125, 130 125, 140 130" stroke="#38bdf8" stroke-width="2" fill="none"/>
  
  <!-- Character: Artisan (Upper body) -->
  <g transform="translate(40, 100)">
    <circle cx="30" cy="30" r="25" fill="#fbbf24"/>
    <path d="M15 30 Q 30 45 45 30" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="20" cy="25" r="3" fill="#0f172a"/>
    <circle cx="40" cy="25" r="3" fill="#0f172a"/>
    <rect x="0" y="60" width="60" height="80" rx="10" fill="#fb923c"/>
  </g>
  
  <!-- Magnifying Glass -->
  <g transform="translate(140, 90)">
    <circle cx="20" cy="20" r="15" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <rect x="30" y="20" width="20" height="6" rx="2" fill="#fbbf24" transform="rotate(45 30 20)"/>
    <circle cx="20" cy="20" r="10" fill="#38bdf8" fill-opacity="0.2"/>
  </g>
  
  <!-- Ambient Light/Sparkles -->
  <circle cx="120" cy="70" r="2" fill="#fbbf24"/>
  <circle cx="150" cy="100" r="1.5" fill="#fbbf24"/>
  <circle cx="90" cy="140" r="2" fill="#fbbf24"/>
  
  <!-- Tools on table -->
  <rect x="170" y="160" width="20" height="5" rx="1" fill="#94a3b8"/>
  <circle cx="195" cy="162" r="3" fill="#ec4899"/>
</svg>