<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient (Wood/Room Floor) -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Ball Gradient (Action Glow) -->
    <linearGradient id="ballGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="tableLeg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Motion Blur / Speed Line Filter/Style -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Room Interior / Wall & Floor division -->
  <path d="M 0,140 L 240,140 L 240,240 L 0,240 Z" fill="url(#floorGrad)"/>
  <!-- Baseboard detail -->
  <rect x="0" y="132" width="240" height="8" fill="#475569" opacity="0.6"/>

  <!-- Background Props: Cozy shelf & plant to give depth -->
  <g opacity="0.4">
    <rect x="180" y="50" width="45" height="6" rx="2" fill="#64748b"/>
    <!-- Tiny potted plant on shelf -->
    <path d="M 195,50 L 205,50 L 208,40 L 192,40 Z" fill="#cbd5e1"/>
    <circle cx="200" cy="35" r="8" fill="#10b981"/>
    <circle cx="195" cy="32" r="6" fill="#34d399"/>
  </g>

  <!-- TABLE UNDERNEATH WHICH THE BALL ROLLS -->
  <!-- Table Legs (Back) -->
  <rect x="35" y="70" width="10" height="75" fill="url(#tableLeg)"/>
  <rect x="195" y="70" width="10" height="75" fill="url(#tableLeg)"/>

  <!-- Table Top (Perspective block) -->
  <path d="M 15,70 L 225,70 L 235,90 L 5,90 Z" fill="url(#tableTop)"/>
  <rect x="10" y="90" width="220" height="12" rx="3" fill="#475569"/>

  <!-- Table Legs (Front) -->
  <rect x="25" y="102" width="12" height="60" fill="url(#tableLeg)"/>
  <rect x="203" y="102" width="12" height="60" fill="url(#tableLeg)"/>

  <!-- Table clutter to make it authentic (Books & Cup) -->
  <g transform="translate(30, 52)">
    <!-- Stack of books -->
    <rect x="0" y="10" width="30" height="8" rx="1" fill="#ec4899"/>
    <rect x="-2" y="14" width="34" height="8" rx="1" fill="#38bdf8"/>
    <rect x="2" y="18" width="28" height="8" rx="1" fill="#10b981"/>
    <!-- Coffee mug -->
    <path d="M 160,12 L 175,12 L 173,26 L 162,26 Z" fill="#f8fafc"/>
    <path d="M 175,15 C 180,15 180,22 173,23" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- SHADOW OF THE TABLE ON THE FLOOR -->
  <ellipse cx="120" cy="150" rx="95" ry="10" fill="#020617" opacity="0.4"/>

  <!-- ACTION: THE ROLLING BALL & MOTION EFFECTS -->
  <!-- Motion Blur Trails / Speed Lines -->
  <path d="M 80,175 Q 110,165 140,170" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.4" filter="url(#glow)"/>
  <path d="M 70,185 Q 105,175 135,180" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

  <!-- Ball Drop / Rolling Shadow on Floor -->
  <ellipse cx="115" cy="193" rx="22" ry="6" fill="#0f172a" opacity="0.7"/>

  <!-- The Main Subject: Vibrant Rolling Ball (Quả bóng) -->
  <g transform="translate(115, 175)">
    <!-- Ball Body -->
    <circle cx="0" cy="0" r="22" fill="url(#ballGrad)"/>
    
    <!-- Dynamic Soccer/Playful Star Pattern on Ball to show rotation -->
    <path d="M 0,-12 L 4,-4 L 12,-4 L 6,1 L 9,9 L 0,4 L -9,9 L -6,1 L -12,-4 L -4,-4 Z" fill="#1e293b" transform="rotate(35)" opacity="0.85"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>

    <!-- Specular Highlight for 3D Glossy Finish -->
    <path d="M -10,-10 C -5,-16 5,-16 10,-10 C 5,-13 -5,-13 -10,-10 Z" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles (Action Vibe) -->
  <circle cx="85" cy="160" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="150" cy="185" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="60" cy="190" r="2.5" fill="#ec4899" opacity="0.7"/>

  <!-- Additional Depth Element: Foreground Floor Edge / Vignette Overlay -->
  <path d="M 0,220 Q 120,230 240,220 L 240,240 L 0,240 Z" fill="#020617" opacity="0.3"/>
</svg>