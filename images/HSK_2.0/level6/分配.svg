<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="10" fill="#334155"/>
  
  <!-- Manager Character (Upper Body) -->
  <circle cx="120" cy="100" r="30" fill="#fbbf24"/>
  <path d="M90 130 C90 160, 150 160, 150 130 L140 100 L100 100 Z" fill="#38bdf8"/>
  
  <!-- Task Papers being distributed -->
  <rect x="40" y="80" width="30" height="40" rx="2" fill="#f1f5f9" transform="rotate(-15 55 100)"/>
  <rect x="170" y="80" width="30" height="40" rx="2" fill="#f1f5f9" transform="rotate(15 185 100)"/>
  
  <!-- Desk Props: Files and Folders -->
  <rect x="30" y="170" width="40" height="50" rx="4" fill="#ec4899"/>
  <rect x="80" y="180" width="40" height="40" rx="4" fill="#10b981"/>
  <rect x="130" y="175" width="40" height="45" rx="4" fill="#fb923c"/>
  
  <!-- Motion Lines -->
  <path d="M75 90 L95 90" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M145 90 L165 90" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Decorative ambient dots -->
  <circle cx="200" cy="40" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="40" cy="50" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="210" cy="190" r="4" fill="#ec4899" opacity="0.4"/>
</svg>