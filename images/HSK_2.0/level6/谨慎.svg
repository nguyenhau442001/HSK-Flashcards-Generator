<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="lensClip">
      <circle cx="120" cy="115" r="50" />
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Workshop environment) -->
  <g opacity="0.3">
    <!-- Blueprint grid lines -->
    <path d="M 0,60 H 240 M 0,120 H 240 M 0,180 H 240 M 60,0 V 240 M 120,0 V 240 M 180,0 V 240" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="2 4"/>
  </g>

  <!-- Ambient Golden Light Spill (Focus on caution/care) -->
  <circle cx="120" cy="115" r="70" fill="#fbbf24" opacity="0.1" filter="url(#glow)"/>

  <!-- Worktable Surface -->
  <path d="M 20,190 L 220,190 L 200,220 L 40,220 Z" fill="#090d16" opacity="0.8"/>
  <path d="M 20,190 H 220" stroke="#334155" stroke-width="2"/>

  <!-- Contextual Props on Table: Blueprint & Precision Gears -->
  <g transform="translate(0, 5)">
    <!-- Blueprint paper -->
    <polygon points="45,175 95,160 115,185 65,200" fill="#1e3a8a" opacity="0.7"/>
    <path d="M 55,172 L 85,163 M 65,185 L 90,177" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Tiny precision gear -->
    <circle cx="185" cy="175" r="12" fill="#64748b"/>
    <circle cx="185" cy="175" r="6" fill="#0f172a"/>
    <path d="M 185,160 V 190 M 170,175 H 200" stroke="#64748b" stroke-width="4" stroke-linecap="square"/>
  </g>

  <!-- MAIN ACTION SUBJECT: The Magnifying Glass inspecting a delicate mechanism (representing 'cẩn trọng' - careful/meticulous work) -->
  
  <!-- Mechanical Object Being Inspected (A delicate glowing mechanism / core) -->
  <g transform="translate(120, 115)">
    <!-- Glowing core sparks -->
    <circle cx="-5" cy="10" r="18" fill="#10b981" opacity="0.3" filter="url(#glow)"/>
    
    <!-- Base plate -->
    <circle cx="0" cy="0" r="22" fill="#334155" stroke="#475569" stroke-width="2"/>
    
    <!-- Intricate gear teeth & inner cogs -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 3"/>
    <circle cx="0" cy="0" r="8" fill="#f59e0b"/>
    
    <!-- Fine-adjustment needle/pointer -->
    <path d="M 0,0 L 12,-12" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="12" cy="-12" r="2.5" fill="#ef4444"/>
  </g>

  <!-- Magnifying Glass Tool (The Instrument of Care & Precision) -->
  <g transform="rotate(-15, 120, 115)">
    <!-- Light Beam shining from lens -->
    <path d="M 85,80 L 30,10 L 210,10 L 155,80 Z" fill="url(#beamGrad)" />

    <!-- Magnifier Handle -->
    <defs>
      <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb923c"/>
        <stop offset="100%" stop-color="#c2410c"/>
      </linearGradient>
    </defs>
    <path d="M 135,130 L 185,185 C 190,190 195,190 200,185 C 205,180 205,175 200,170 L 150,120 Z" fill="url(#handleGrad)" stroke="#7c2d12" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Handle Metallic Collar -->
    <rect x="130" y="122" width="12" height="10" rx="2" transform="rotate(45, 136, 127)" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>

    <!-- Magnifier Outer Rim -->
    <circle cx="120" cy="115" r="54" fill="#0f172a" opacity="0.3"/>
    <circle cx="120" cy="115" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)"/>
    <circle cx="120" cy="115" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Glass Surface & Distortion Reflection -->
    <circle cx="120" cy="115" r="46" fill="url(#glassGrad)"/>
    <!-- Glass Highlight arc -->
    <path d="M 85,90 A 42,42 0 0,1 145,85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Floating Sparkles / Precision Indicators (Action & Focus) -->
  <g fill="#38bdf8">
    <circle cx="75" cy="70" r="2.5" opacity="0.8"/>
    <path d="M 160,85 L 163,92 L 170,95 L 163,98 L 160,105 L 157,98 L 150,95 L 157,92 Z" transform="scale(0.5) translate(150, 70)" fill="#fbbf24"/>
    <path d="M 90,145 L 92,149 L 96,151 L 92,153 L 90,157 L 88,153 L 84,151 L 88,149 Z" transform="scale(0.6) translate(60, 110)" fill="#38bdf8"/>
  </g>

  <!-- Dynamic Accent Border/Frame -->
  <rect x="8" y="8" width="224" height="224" rx="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>
</svg>