<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.8" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Mirror Reflection Gradient -->
    <linearGradient id="mirrorGlass" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- White Shirt Shading Gradients -->
    <linearGradient id="shirtBody" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shirtShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment: Warm Light & Room Interior -->
  <rect width="240" height="240" fill="url(#lampGlow)"/>

  <!-- Modern Full-Length Mirror Frame in Background -->
  <rect x="22" y="32" width="70" height="150" rx="35" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="25" y="35" width="64" height="144" rx="32" fill="url(#mirrorGlass)"/>
  <!-- Mirror Glint / Reflection Lines -->
  <path d="M48 42 L35 70" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M72 45 L40 120" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Dresser Shelf on Right -->
  <path d="M175 145 L240 145 L240 152 L175 152 Z" fill="#334155"/>
  <path d="M182 145 L182 240" stroke="#1e293b" stroke-width="3"/>
  
  <!-- Indoor Plant on Shelf -->
  <path d="M202 145 L218 145 L215 133 L205 133 Z" fill="#b45309"/>
  <!-- Leaves -->
  <path d="M210 133 Q200 120 192 124 Q204 128 210 133 Z" fill="#10b981"/>
  <path d="M210 133 Q215 115 224 118 Q218 126 210 133 Z" fill="#059669"/>
  <path d="M210 133 Q208 112 210 110 Q214 122 210 133 Z" fill="#34d399"/>

  <!-- Pendant Lamp on Top Right -->
  <line x1="200" y1="0" x2="200" y2="35" stroke="#64748b" stroke-width="1.5"/>
  <path d="M190 35 L210 35 L216 48 L184 48 Z" fill="#f59e0b"/>
  <circle cx="200" cy="51" r="5" fill="#fef08a"/>

  <!-- Character: Lower Body (Navy Tailored Trousers) -->
  <path d="M82 205 L158 205 L162 240 L78 240 Z" fill="#0f172a"/>
  <!-- Leather Belt -->
  <rect x="80" y="202" width="80" height="8" rx="2" fill="#78350f"/>
  <rect x="114" y="200" width="12" height="12" rx="2" fill="#fbbf24"/>
  <rect x="116" y="202" width="8" height="8" rx="1" fill="#78350f"/>

  <!-- Character Arms & Shirt Sleeves (White Dress Shirt) -->
  <!-- Left Arm (Drawn bending up to adjust collar) -->
  <path d="M78 120 Q65 145 68 180 Q80 185 88 175 Q85 145 94 128 Z" fill="#e2e8f0"/>
  <path d="M72 178 L68 180 L75 190 L85 186 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Right Arm (Hand reaching up adjusting tie/collar area) -->
  <path d="M162 120 Q176 150 170 178 Q158 182 152 170 Q155 145 146 128 Z" fill="#f1f5f9"/>
  <!-- Right Sleeve Cuff -->
  <path d="M167 175 L171 177 L164 187 L154 183 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Cuff button -->
  <circle cx="163" cy="182" r="1.5" fill="#94a3b8"/>

  <!-- Left Forearm & Hand adjusting button -->
  <path d="M85 186 Q95 192 108 182 Q105 174 96 177 Z" fill="#fcd34d"/>
  
  <!-- Character: Main Shirt Torso (Crisp White Shirt) -->
  <path d="M85 106 Q68 125 76 205 L164 205 Q172 125 155 106 Q135 116 120 116 Q105 116 85 106 Z" fill="url(#shirtBody)"/>
  
  <!-- Tailoring & Wrinkle Lines for White Shirt -->
  <path d="M84 150 Q96 165 92 195" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M156 152 Q144 168 146 198" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M120 112 L120 205" stroke="#e2e8f0" stroke-width="2.5"/> <!-- Center Placket -->
  
  <!-- Shirt Placket Fold & Seam -->
  <rect x="117.5" y="112" width="5" height="92" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  
  <!-- Shirt Buttons -->
  <circle cx="120" cy="128" r="1.8" fill="#94a3b8"/>
  <circle cx="120" cy="128" r="1" fill="#ffffff"/>
  <circle cx="120" cy="148" r="1.8" fill="#94a3b8"/>
  <circle cx="120" cy="148" r="1" fill="#ffffff"/>
  <circle cx="120" cy="168" r="1.8" fill="#94a3b8"/>
  <circle cx="120" cy="168" r="1" fill="#ffffff"/>
  <circle cx="120" cy="188" r="1.8" fill="#94a3b8"/>
  <circle cx="120" cy="188" r="1" fill="#ffffff"/>

  <!-- Shirt Breast Pocket -->
  <path d="M96 138 L110 138 L110 154 L103 158 L96 154 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  
  <!-- Neck -->
  <path d="M110 88 L130 88 L133 115 L107 115 Z" fill="#fcd34d"/>
  <path d="M110 98 Q120 106 130 98 L131 106 Q120 114 109 106 Z" fill="#f59e0b" opacity="0.3"/>

  <!-- Crisp White Shirt Collar (Distinctive feature) -->
  <!-- Left Collar Flap -->
  <path d="M107 106 L120 120 L118 102 L104 98 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <path d="M106 102 L121 122 L98 126 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <!-- Right Collar Flap -->
  <path d="M133 106 L120 120 L122 102 L136 98 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <path d="M134 102 L119 122 L142 126 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  
  <!-- Right Hand Adjusting Collar / Upper Button (Action Gesture) -->
  <path d="M138 116 Q146 112 142 126 Q132 130 128 123 Z" fill="#fed7aa"/>
  <!-- Thumb & Fingers details -->
  <path d="M127 122 Q125 117 131 116" stroke="#ea580c" stroke-width="1" fill="none"/>

  <!-- Character Head & Face -->
  <!-- Ears -->
  <circle cx="95" cy="74" r="6" fill="#fcd34d"/>
  <circle cx="145" cy="74" r="6" fill="#fcd34d"/>

  <!-- Head Base -->
  <path d="M97 68 C97 45 143 45 143 68 C143 90 133 98 120 98 C107 98 97 90 97 68 Z" fill="url(#skinGrad)"/>

  <!-- Neat Haircut (Stylized Young Professional) -->
  <path d="M95 64 C94 42 110 32 125 32 C142 32 148 42 146 54 C143 54 139 50 134 50 C125 50 118 56 104 56 C98 56 96 60 95 64 Z" fill="#1e1b4b"/>
  <!-- Sideburns -->
  <path d="M96 60 L96 72 L99 68 Z" fill="#1e1b4b"/>
  <path d="M144 60 L144 72 L141 68 Z" fill="#1e1b4b"/>

  <!-- Eyebrows -->
  <path d="M105 63 Q112 60 116 63" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M124 63 Q128 60 135 63" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Happy / Confident Eyes -->
  <circle cx="111" cy="70" r="2.5" fill="#0f172a"/>
  <circle cx="129" cy="70" r="2.5" fill="#0f172a"/>
  <!-- Eye Highlights -->
  <circle cx="112" cy="69" r="0.8" fill="#ffffff"/>
  <circle cx="130" cy="69" r="0.8" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M120 68 L118 76 L122 76" stroke="#f59e0b" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Proud, Satisfied Smile -->
  <path d="M114 83 Q120 88 126 83" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Cheeks Blush -->
  <circle cx="104" cy="76" r="3.5" fill="#f43f5e" opacity="0.3"/>
  <circle cx="136" cy="76" r="3.5" fill="#f43f5e" opacity="0.3"/>

  <!-- Clean Contrast Highlights / Sparkles on Crisp Shirt -->
  <path d="M80 138 L83 143 L88 144 L83 147 L80 152 L78 147 L73 144 L78 143 Z" fill="#38bdf8" opacity="0.85"/>
  <path d="M162 135 L163.5 138.5 L167 139 L163.5 141 L162 144.5 L160.5 141 L157 139 L160.5 138.5 Z" fill="#fbbf24" opacity="0.9"/>
</svg>