<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- Book -->
  <g transform="translate(60, 100)">
    <path d="M10 10 L110 0 L120 80 L20 90 Z" fill="#ec4899"/>
    <path d="M15 15 L105 5 L115 75 L25 85 Z" fill="#fbcfe8"/>
    <path d="M65 5 L65 85" stroke="#ec4899" stroke-width="4"/>
  </g>
  
  <!-- Character (Expressing "Very") -->
  <g transform="translate(140, 60)">
    <circle cx="40" cy="40" r="35" fill="#fbbf24"/>
    <path d="M25 30 Q30 25 35 30 M45 30 Q50 25 55 30" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M25 55 Q40 65 55 55" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Heart eyes for "very" -->
    <path d="M28 35 L32 30 L36 35 L32 40 Z" fill="#e11d48"/>
    <path d="M48 35 L52 30 L56 35 L52 40 Z" fill="#e11d48"/>
  </g>
  
  <!-- Floating Hearts/Stars indicating intensity -->
  <path d="M180 50 L185 40 L190 50 L185 60 Z" fill="#10b981"/>
  <path d="M200 70 L205 60 L210 70 L205 80 Z" fill="#38bdf8"/>
  <path d="M170 90 L175 80 L180 90 L175 100 Z" fill="#fb923c"/>
  
  <!-- Ambient glow -->
  <circle cx="180" cy="95" r="40" fill="#f59e0b" opacity="0.05"/>
</svg>