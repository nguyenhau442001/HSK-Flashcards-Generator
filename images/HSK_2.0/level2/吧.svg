<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Two Coffee Mugs suggesting a shared suggestion -->
  <g transform="translate(60, 120)">
    <path d="M10 60 L50 60 L45 20 L15 20 Z" fill="#fbbf24"/>
    <path d="M45 30 L55 30 A 10 10 0 0 1 55 50 L45 50" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(130, 110)">
    <path d="M10 70 L50 70 L45 30 L15 30 Z" fill="#38bdf8"/>
    <path d="M45 40 L55 40 A 10 10 0 0 1 55 60 L45 60" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Two hands gesturing towards the cups, inviting action -->
  <g transform="translate(40, 50)">
    <path d="M20 80 Q 20 60 40 60 L 60 60 Q 80 60 80 80 L 80 120 Z" fill="#fcd34d"/>
    <circle cx="50" cy="60" r="15" fill="#fcd34d"/>
  </g>

  <g transform="translate(120, 40) rotate(15)">
    <path d="M20 80 Q 20 60 40 60 L 60 60 Q 80 60 80 80 L 80 120 Z" fill="#fcd34d"/>
    <circle cx="50" cy="60" r="15" fill="#fcd34d"/>
  </g>

  <!-- Decorative elements suggesting movement/agreement -->
  <circle cx="180" cy="70" r="8" fill="#10b981" opacity="0.6"/>
  <circle cx="200" cy="90" r="5" fill="#ec4899" opacity="0.6"/>
  <path d="M190 130 Q 200 120 210 130" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>