<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed frame -->
  <rect x="40" y="150" width="160" height="40" rx="8" fill="#334155"/>
  <rect x="50" y="190" width="20" height="20" fill="#334155"/>
  <rect x="170" y="190" width="20" height="20" fill="#334155"/>
  
  <!-- Mattress and Pillow -->
  <rect x="45" y="130" width="150" height="30" rx="4" fill="#64748b"/>
  <path d="M60 130 C 60 110, 100 110, 100 130 Z" fill="#cbd5e1"/>
  
  <!-- Character torso and arms stretching -->
  <circle cx="120" cy="110" r="25" fill="#fde68a"/>
  <path d="M100 110 L 80 80 M 140 110 L 160 80" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Eyes and Mouth -->
  <circle cx="110" cy="105" r="3" fill="#0f172a"/>
  <circle cx="130" cy="105" r="3" fill="#0f172a"/>
  <path d="M115 115 Q 120 120 125 115" stroke="#0f172a" stroke-width="2" fill="none"/>
  
  <!-- Sunlight rays -->
  <path d="M200 40 L 220 20 M 220 50 L 240 50 M 200 70 L 220 90" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="220" cy="50" r="15" fill="#f59e0b"/>
  
  <!-- Alarm clock on nightstand -->
  <rect x="170" y="100" width="30" height="30" rx="4" fill="#ec4899"/>
  <circle cx="185" cy="115" r="8" fill="#ffffff"/>
  <line x1="185" y1="115" x2="185" y2="108" stroke="#0f172a" stroke-width="2"/>
  <line x1="185" y1="115" x2="190" y2="115" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Blanket -->
  <path d="M45 140 L 195 140 L 185 180 L 55 180 Z" fill="#38bdf8"/>
</svg>