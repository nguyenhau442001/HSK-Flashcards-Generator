<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Grass Field Elements -->
  <path d="M0 180 Q 120 160 240 180 L 240 240 L 0 240 Z" fill="#10b981" opacity="0.3"/>
  <circle cx="120" cy="220" r="40" fill="#10b981" opacity="0.1"/>
  
  <!-- Goal Post -->
  <path d="M180 180 L 180 100 L 220 100 L 220 180" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M180 120 L 220 120 M180 140 L 220 140 M180 160 L 220 160" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>

  <!-- Character -->
  <g transform="translate(60, 100)">
    <!-- Leg kicking -->
    <path d="M40 80 L 70 50" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="75" cy="45" r="12" fill="#ffffff"/>
    
    <!-- Body -->
    <path d="M20 80 L 40 40 L 60 80" fill="#ec4899"/>
    <circle cx="40" cy="30" r="15" fill="#fb923c"/>
    
    <!-- Arms -->
    <path d="M25 50 L 10 70" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M55 50 L 70 70" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Standing Leg -->
    <path d="M30 80 L 25 120" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Motion Lines -->
  <path d="M80 50 L 100 30" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M85 60 L 110 40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
</svg>