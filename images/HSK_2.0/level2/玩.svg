<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor/Rug -->
  <rect x="20" y="140" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Toy Blocks -->
  <rect x="40" y="180" width="30" height="30" rx="4" fill="#fbbf24"/>
  <rect x="75" y="190" width="25" height="20" rx="4" fill="#ec4899"/>
  <rect x="180" y="170" width="35" height="40" rx="4" fill="#38bdf8"/>
  
  <!-- Child Character -->
  <g transform="translate(110, 150)">
    <!-- Body -->
    <path d="M-20 60 Q-20 20 0 20 T20 60" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 -5 Q-30 -30 0 -30 T25 -5" fill="#78350f"/>
    <!-- Arms -->
    <path d="M-20 30 L-40 50" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 30 L40 50" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="-15" y="55" width="10" height="20" rx="3" fill="#10b981"/>
    <rect x="5" y="55" width="10" height="20" rx="3" fill="#10b981"/>
    <!-- Face -->
    <circle cx="-8" cy="-5" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-5" r="3" fill="#0f172a"/>
    <path d="M-8 8 Q0 12 8 8" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Toy Car -->
  <rect x="130" y="195" width="40" height="20" rx="4" fill="#fb923c"/>
  <circle cx="140" cy="215" r="6" fill="#f1f5f9"/>
  <circle cx="160" cy="215" r="6" fill="#f1f5f9"/>
  
  <!-- Background Decor -->
  <circle cx="200" cy="50" r="15" fill="#334155" opacity="0.5"/>
  <rect x="30" y="40" width="40" height="10" rx="5" fill="#334155" opacity="0.5"/>
</svg>