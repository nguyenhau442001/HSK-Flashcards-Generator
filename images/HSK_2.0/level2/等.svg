<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bus Stop Structure -->
  <rect x="40" y="80" width="160" height="120" rx="4" fill="#334155"/>
  <rect x="45" y="85" width="150" height="110" rx="2" fill="#1e293b"/>
  <path d="M40 80 L60 60 L200 60 L220 80 Z" fill="#475569"/>
  
  <!-- Street Lamp -->
  <rect x="200" y="40" width="6" height="160" fill="#64748b"/>
  <circle cx="203" cy="40" r="12" fill="#fbbf24" opacity="0.3"/>
  <circle cx="203" cy="40" r="6" fill="#f59e0b"/>
  
  <!-- Character -->
  <g transform="translate(100, 110)">
    <!-- Body -->
    <path d="M10 40 C10 20, 30 20, 30 40 L30 80 L10 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <!-- Arm waiting -->
    <path d="M30 45 L50 55" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 55 L55 50" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Leg -->
    <rect x="12" y="80" width="6" height="10" fill="#64748b"/>
    <rect x="22" y="80" width="6" height="10" fill="#64748b"/>
    <!-- Watch check gesture -->
    <circle cx="50" cy="55" r="4" fill="#ec4899"/>
  </g>
  
  <!-- Bench -->
  <rect x="50" y="170" width="60" height="10" rx="2" fill="#fb923c"/>
  <rect x="55" y="180" width="5" height="10" fill="#fb923c"/>
  <rect x="100" y="180" width="5" height="10" fill="#fb923c"/>
  
  <!-- Rain/Atmosphere -->
  <line x1="30" y1="60" x2="20" y2="90" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  <line x1="70" y1="60" x2="60" y2="90" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  <line x1="150" y1="60" x2="140" y2="90" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  <line x1="190" y1="60" x2="180" y2="90" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
</svg>