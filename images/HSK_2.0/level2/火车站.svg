  <rect x="30" y="95" width="40" height="50" rx="4" fill="#0f172a" opacity="0.3"/>
  <rect x="80" y="95" width="40" height="50" rx="4" fill="#0f172a" opacity="0.3"/>
  <rect x="130" y="95" width="40" height="50" rx="4" fill="#0f172a" opacity="0.3"/>
  <rect x="180" y="95" width="40" height="50" rx="4" fill="#0f172a" opacity="0.3"/>
  
