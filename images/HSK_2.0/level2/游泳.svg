<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Pool Water Surface & Depth -->
  <path d="M0 120 Q 120 100 240 120 L 240 240 L 0 240 Z" fill="#0ea5e9" opacity="0.3"/>
  <path d="M0 130 Q 60 110 120 130 T 240 130 L 240 240 L 0 240 Z" fill="#0284c7" opacity="0.4"/>
  
  <!-- Lane Marker -->
  <rect x="115" y="120" width="10" height="120" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Swimmer Body -->
  <g transform="translate(120, 140) rotate(15)">
    <!-- Arms -->
    <path d="M-40 -20 C -20 -40 20 -40 40 -20" stroke="#fde68a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Torso -->
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="#fde68a"/>
    <!-- Head -->
    <circle cx="0" cy="-25" r="12" fill="#fde68a"/>
    <!-- Swim Cap -->
    <path d="M-12 -25 A 12 12 0 0 1 12 -25" fill="#ec4899"/>
    <!-- Legs -->
    <path d="M-10 15 C -20 40 -10 60 0 60" stroke="#fde68a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M10 15 C 20 40 10 60 0 60" stroke="#fde68a" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Water Splashes -->
  <circle cx="80" cy="110" r="4" fill="#38bdf8"/>
  <circle cx="160" cy="115" r="6" fill="#38bdf8"/>
  <circle cx="100" cy="105" r="3" fill="#ffffff" opacity="0.5"/>
  
  <!-- Pool Edge/Tiles -->
  <rect x="0" y="0" width="240" height="40" fill="#1e293b"/>
  <line x1="0" y1="40" x2="240" y2="40" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="10" width="40" height="20" rx="2" fill="#334155"/>
  <rect x="80" y="10" width="40" height="20" rx="2" fill="#334155"/>
  <rect x="140" y="10" width="40" height="20" rx="2" fill="#334155"/>
  <rect x="200" y="10" width="40" height="20" rx="2" fill="#334155"/>
  
  <!-- Ambient Light Reflection -->
  <ellipse cx="120" cy="180" rx="80" ry="20" fill="#38bdf8" opacity="0.1" filter="blur(10px)"/>
</svg>