<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- Waiter Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 120 L-30 40 Q0 20 30 40 L40 120 Z" fill="#f1f5f9"/>
    <!-- Apron -->
    <path d="M-25 50 L25 50 L20 110 L-20 110 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-20 5 A20 20 0 0 1 20 5 L20 0 L-20 0 Z" fill="#475569"/>
    <!-- Eyes -->
    <circle cx="-8" cy="5" r="3" fill="#0f172a"/>
    <circle cx="8" cy="5" r="3" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M-8 15 Q0 20 8 15" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Tray -->
  <rect x="70" y="100" width="100" height="10" rx="2" fill="#94a3b8"/>
  
  <!-- Glass of Water -->
  <rect x="105" y="70" width="30" height="30" rx="4" fill="#38bdf8" opacity="0.8"/>
  <path d="M105 75 L135 75" stroke="#e0f2fe" stroke-width="2"/>
  
  <!-- Decorative Atmosphere -->
  <circle cx="40" cy="40" r="4" fill="#fbbf24"/>
  <circle cx="200" cy="60" r="6" fill="#10b981"/>
  <circle cx="180" cy="190" r="5" fill="#ec4899"/>
</svg>