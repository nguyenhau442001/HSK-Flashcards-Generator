<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Environment -->
  <rect x="30" y="180" width="180" height="60" fill="#0f172a" opacity="0.3"/>
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Character Body -->
  <path d="M120 100 C150 100 160 130 160 160 L80 160 C80 130 90 100 120 100" fill="#38bdf8"/>
  <circle cx="120" cy="70" r="25" fill="#fde68a"/>
  
  <!-- The Action: Putting on a jacket -->
  <!-- Left arm -->
  <path d="M95 110 L70 140 L85 150 L110 120" fill="#ec4899"/>
  <!-- Right arm (lifting up) -->
  <path d="M145 110 L170 80 L185 90 L160 120" fill="#ec4899"/>
  
  <!-- Jacket detail -->
  <path d="M100 115 L140 115 L145 180 L95 180 Z" fill="#ec4899"/>
  <path d="M120 115 L120 180" stroke="#be185d" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Props: Mirror reflection/frame -->
  <rect x="20" y="40" width="40" height="160" rx="5" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.5"/>
  <circle cx="40" cy="180" r="5" fill="#10b981"/>
  
  <!-- Floor shadow -->
  <ellipse cx="120" cy="210" rx="60" ry="10" fill="#000" opacity="0.2"/>
</svg>