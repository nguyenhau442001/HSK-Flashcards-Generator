<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Couch -->
  <path d="M30 160h180v40c0 10-10 20-20 20H50c-10 0-20-10-20-20v-40z" fill="#334155"/>
  <path d="M40 160h160v20c0 10-10 20-20 20H60c-10 0-20-10-20-20v-20z" fill="#475569"/>
  
  <!-- Fan Character -->
  <g transform="translate(120, 140)">
    <!-- Body -->
    <path d="M-30 0h60v50c0 15-25 15-25 15s-35 0-35-15V0z" fill="#38bdf8"/>
    <!-- Scarf -->
    <path d="M-25 -5h50v10c0 5-5 10-10 10h-30c-5 0-10-5-10-10V-5z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="30" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-45" r="4" fill="#0f172a"/>
    <circle cx="10" cy="-45" r="4" fill="#0f172a"/>
    <!-- Mouth -->
    <path d="M-10 -30 Q0 -22 10 -30" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Hair -->
    <path d="M-25 -60 Q0 -85 25 -60" fill="#fb923c"/>
  </g>
  
  <!-- TV Screen -->
  <rect x="60" y="30" width="120" height="80" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="4"/>
  <!-- Soccer Ball on TV -->
  <circle cx="120" cy="70" r="25" fill="#f1f5f9"/>
  <path d="M120 45v50M95 70h50M100 50l40 40M140 50l-40 40" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Energy/Action Sparks -->
  <circle cx="180" cy="50" r="5" fill="#fbbf24"/>
  <circle cx="60" cy="50" r="3" fill="#10b981"/>
  <circle cx="190" cy="150" r="4" fill="#38bdf8"/>
  
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="225" rx="80" ry="10" fill="#0f172a" opacity="0.3"/>
</svg>