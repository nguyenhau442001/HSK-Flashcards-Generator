<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Factory Interior -->
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Conveyor Belt Metal Gradient -->
    <linearGradient id="metal-belt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-gradient)" />

  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#amber-glow)" />

  <!-- Factory Architecture Background Elements -->
  <!-- Overhead Industrial Lights -->
  <path d="M70 0 L90 0 L85 30 L75 30 Z" fill="#334155" />
  <circle cx="80" cy="30" r="12" fill="#fbbf24" opacity="0.9" />
  <path d="M150 0 L170 0 L165 30 L155 30 Z" fill="#334155" />
  <circle cx="160" cy="30" r="12" fill="#fbbf24" opacity="0.9" />

  <!-- Light Cones -->
  <polygon points="80,30 40,140 120,140" fill="#fbbf24" opacity="0.06" />
  <polygon points="160,30 120,140 200,140" fill="#fbbf24" opacity="0.06" />

  <!-- Industrial Steel Beams & Wall Structure -->
  <rect x="20" y="40" width="12" height="130" fill="#1e293b" />
  <rect x="208" y="40" width="12" height="130" fill="#1e293b" />
  <line x1="20" y1="70" x2="32" y2="90" stroke="#334155" stroke-width="4" />
  <line x1="20" y1="130" x2="32" y2="150" stroke="#334155" stroke-width="4" />
  <line x1="208" y1="70" x2="220" y2="90" stroke="#334155" stroke-width="4" />
  <line x1="208" y1="130" x2="220" y2="150" stroke="#334155" stroke-width="4" />

  <!-- Central Conveyor System (Production Line) -->
  <rect x="15" y="145" width="210" height="24" rx="4" fill="url(#metal-belt)" />
  <!-- Conveyor Rollers -->
  <g fill="#94a3b8">
    <ellipse cx="35" cy="157" rx="4" ry="9" />
    <ellipse cx="65" cy="157" rx="4" ry="9" />
    <ellipse cx="95" cy="157" rx="4" ry="9" />
    <ellipse cx="125" cy="157" rx="4" ry="9" />
    <ellipse cx="155" cy="157" rx="4" ry="9" />
    <ellipse cx="185" cy="157" rx="4" ry="9" />
    <ellipse cx="215" cy="157" rx="4" ry="9" />
  </g>

  <!-- Products on Conveyor: Smart Phones Being Manufactured -->
  <!-- Phone 1 (Finished/Testing) -->
  <g transform="translate(150, 130)">
    <rect width="14" height="22" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="2" y="3" width="10" height="14" rx="1" fill="#0f172a" />
    <!-- Screen Glow -->
    <circle cx="7" cy="10" r="2" fill="#38bdf8" />
  </g>

  <!-- Phone 2 (Passing Assembly Point) -->
  <g transform="translate(90, 130)">
    <rect width="14" height="22" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="2" y="3" width="10" height="14" rx="1" fill="#0f172a" />
  </g>

  <!-- Phone 3 (Raw casing entering) -->
  <g transform="translate(35, 130)">
    <rect width="14" height="22" rx="2" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- Robotic Manufacturing Arm (Left side) -->
  <g transform="translate(60, 90)">
    <path d="M0 0 L15 15 L25 45 L15 55 L5 25 Z" fill="#475569" />
    <circle cx="15" cy="15" r="6" fill="#fbbf24" />
    <!-- Articulated segment -->
    <path d="M15 15 L40 -5 L55 -10" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" />
    <!-- Laser Welding Tool / Precision Nozzle -->
    <polygon points="50,-15 60,-5 55,10" fill="#334155" />
    <path d="M57 5 L57 38" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,2" />
    <circle cx="57" cy="40" r="3" fill="#38bdf8" />
  </g>

  <!-- Factory Worker Character (Right side, Quality Control/Operator) -->
  <g transform="translate(155, 75)">
    <!-- Worker Body / Torso (Teal Uniform) -->
    <path d="M15 55 C15 42 25 35 40 35 C55 35 65 42 65 55 L70 95 C70 98 67 100 64 100 L16 100 C13 100 10 98 10 95 Z" fill="#0d9488" />
    <path d="M40 35 L40 60" stroke="#0f766e" stroke-width="2" />
    
    <!-- Worker Head -->
    <circle cx="40" cy="22" r="14" fill="#ffedd5" />
    
    <!-- Hair -->
    <path d="M26 20 C26 12 33 9 40 9 C47 9 54 12 54 20 C54 24 50 20 40 18 C30 20 26 24 26 20 Z" fill="#334155" />

    <!-- Safety Helmet (Yellow Hard Hat) -->
    <path d="M22 16 C22 6 30 4 40 4 C50 4 58 6 58 16 C58 18 56 18 40 18 C24 18 22 18 22 16 Z" fill="#f59e0b" />
    <rect x="20" y="15" width="40" height="3" rx="1.5" fill="#d97706" />

    <!-- Face Profile / Expression (Focused/Smiling) -->
    <circle cx="46" cy="22" r="1.5" fill="#1e293b" />
    <path d="M46 27 Q49 30 52 27" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms & Hands interacting with the production line -->
    <!-- Left Arm -->
    <path d="M15 45 C5 50 -5 70 5 75" fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round" />
    <!-- Right Arm reaching forward to check phone -->
    <path d="M65 45 C75 50 80 65 72 72" fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round" />
    <circle cx="72" cy="74" r="4" fill="#ffedd5" />

    <!-- Clipboard in Hand -->
    <rect x="75" y="65" width="16" height="20" rx="2" fill="#f8fafc" transform="rotate(15 75 65)" />
    <line x1="79" y1="70" x2="87" y2="70" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="79" y1="75" x2="85" y2="75" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="79" y1="80" x2="83" y2="80" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Foreground Floor Base -->
  <rect x="0" y="169" width="240" height="71" fill="#0f172a" />
  <!-- Hazard Stripe Floor Accent -->
  <g opacity="0.3">
    <polygon points="0,169 20,169 10,179 0,179" fill="#f59e0b" />
    <polygon points="30,169 50,169 40,179 30,179" fill="#f59e0b" />
    <polygon points="60,169 80,169 70,179 60,179" fill="#f59e0b" />
    <polygon points="90,169 110,169 100,179 90,179" fill="#f59e0b" />
    <polygon points="120,169 140,169 130,179 120,179" fill="#f59e0b" />
    <polygon points="150,169 170,169 160,179 150,179" fill="#f59e0b" />
    <polygon points="180,169 200,169 190,179 180,179" fill="#f59e0b" />
    <polygon points="210,169 230,169 220,179 210,179" fill="#f59e0b" />
  </g>

  <!-- Dynamic Sparks / Industrial Vibe Elements -->
  <circle cx="108" cy="115" r="1.5" fill="#fbbf24" />
  <path d="M112 110 L116 106" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
  <path d="M104 112 L98 108" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
  <path d="M110 120 L114 125" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
</svg>