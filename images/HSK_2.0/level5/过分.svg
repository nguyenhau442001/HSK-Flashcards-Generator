<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk surface -->
  <rect x="20" y="160" width="200" height="60" rx="10" fill="#334155"/>
  
  <!-- Stack of papers (The "too much" element) -->
  <rect x="60" y="80" width="120" height="90" rx="4" fill="#e2e8f0"/>
  <rect x="55" y="75" width="120" height="90" rx="4" fill="#cbd5e1"/>
  <rect x="50" y="70" width="120" height="90" rx="4" fill="#94a3b8"/>
  
  <!-- Overflowing papers spilling over -->
  <path d="M50 160 L40 190 L160 190 L170 160 Z" fill="#cbd5e1"/>
  
  <!-- Angry/Overwhelmed character head (partial) -->
  <circle cx="120" cy="50" r="25" fill="#fbbf24"/>
  <path d="M105 45 Q110 40 115 45 M125 45 Q130 40 135 45" stroke="#0f172a" stroke-width="3" fill="none"/>
  <path d="M110 60 Q120 55 130 60" stroke="#0f172a" stroke-width="3" fill="none"/>
  
  <!-- Red "X" stamp or marker showing excess -->
  <path d="M140 90 L160 110 M160 90 L140 110" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Coffee cup spilling -->
  <rect x="180" y="140" width="30" height="40" rx="5" fill="#fb923c"/>
  <path d="M210 150 L220 150 L215 170 Z" fill="#fb923c"/>
  <path d="M195 180 Q205 195 215 180" stroke="#fb923c" stroke-width="4" fill="none"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.1"/>
</svg>