<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Painting Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background -->
  <!-- Wall -->
  <rect x="15" y="15" width="210" height="170" rx="4" fill="url(#wallGrad)" />
  
  <!-- Subtle Wall Paneling/Lines -->
  <line x1="15" y1="140" x2="225" y2="140" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.4" />

  <!-- Floor -->
  <path d="M 15 185 L 225 185 L 235 225 L 5 225 Z" fill="url(#floorGrad)" />
  <line x1="15" y1="185" x2="225" y2="185" stroke="#475569" stroke-width="2" />

  <!-- TARGET ELEMENT: 墙上的画 (Painting hanging on the wall) -->
  <g filter="url(#shadow)">
    <!-- Hanging String/Hook -->
    <path d="M 120 40 L 120 65" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="120" cy="40" r="2.5" fill="#cbd5e1" />

    <!-- Painting Frame -->
    <rect x="85" y="65" width="70" height="55" rx="3" fill="url(#frameGrad)" />
    <!-- Painting Canvas Inner -->
    <rect x="90" y="70" width="60" height="45" rx="1" fill="#f8fafc" />

    <!-- Artwork Scene Inside Painting (Mini Landscape) -->
    <g clip-path="url(#paintClip)">
      <clipPath id="paintClip">
        <rect x="90" y="70" width="60" height="45" rx="1" />
      </clipPath>
      <!-- Sky inside painting -->
      <rect x="90" y="70" width="60" height="45" fill="#e0f2fe" />
      <!-- Sun -->
      <circle cx="135" cy="85" r="7" fill="#fb923c" />
      <!-- Mountains -->
      <path d="M 90 105 L 115 85 L 140 105 L 150 115 L 90 115 Z" fill="#38bdf8" opacity="0.7" />
      <path d="M 110 115 L 135 90 L 160 115 Z" fill="#0284c7" opacity="0.8" />
      <!-- Hills/Ground -->
      <path d="M 90 108 Q 120 100 150 108 L 150 115 L 90 115 Z" fill="#10b981" />
    </g>
  </g>

  <!-- Environmental Context Props (Living Room / Cozy Interior) -->
  <!-- Houseplant in pot on the floor -->
  <g transform="translate(180, 145)">
    <!-- Shadow -->
    <ellipse cx="15" cy="40" rx="12" ry="4" fill="#020617" opacity="0.6" />
    <!-- Pot -->
    <path d="M 5 20 L 25 20 L 22 40 L 8 40 Z" fill="#cbd5e1" />
    <ellipse cx="15" cy="20" rx="10" ry="2" fill="#94a3b8" />
    <!-- Plant Stems & Leaves -->
    <path d="M 15 20 Q 15 5 25 2" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 15 20 Q 5 8 -2 5" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 15 20 Q 20 10 32 12" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 15 20 Q 10 12 8 0" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Cozy Sofa / Armchair edge on the left -->
  <g transform="translate(15, 135)">
    <rect x="0" y="15" width="45" height="40" rx="10" fill="#6366f1" filter="url(#shadow)" />
    <rect x="5" y="5" width="35" height="20" rx="8" fill="#818cf8" />
  </g>

  <!-- Floor Lamp casting warm light upward/around -->
  <g transform="translate(30, 45)">
    <path d="M 10 140 L 10 40" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <!-- Lamp Shade -->
    <path d="M 0 40 L 20 40 L 25 25 L -5 25 Z" fill="#fbbf24" filter="url(#glow)" />
    <!-- Light Glow Overlay -->
    <circle cx="10" cy="30" r="18" fill="#fef08a" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Foreground Character (Admiring the painting on the wall) -->
  <g transform="translate(95, 115)">
    <!-- Character Body & Posture (Standing, looking up) -->
    <!-- Shadow -->
    <ellipse cx="25" cy="73" rx="16" ry="5" fill="#020617" opacity="0.5" />

    <!-- Legs -->
    <rect x="17" y="50" width="6" height="25" rx="3" fill="#334155" />
    <rect x="27" y="50" width="6" height="25" rx="3" fill="#1e293b" />
    <!-- Shoes -->
    <path d="M 14 73 L 23 73 A 3 3 0 0 1 26 76 L 14 76 Z" fill="#f43f5e" />
    <path d="M 24 73 L 33 73 A 3 3 0 0 1 36 76 L 24 76 Z" fill="#f43f5e" />

    <!-- Torso (leaning slightly back) -->
    <path d="M 13 25 C 13 20, 37 20, 37 25 L 35 52 C 35 53, 15 53, 15 52 Z" fill="#38bdf8" />

    <!-- Arms (One hand pointing/gesturing toward the wall/painting) -->
    <path d="M 13 28 L 3 42 C 2 44, 4 46, 7 45 L 16 34 Z" fill="#0284c7" />
    <!-- Pointing hand -->
    <circle cx="2" cy="44" r="3.5" fill="#fed7aa" />

    <path d="M 37 28 L 47 38" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <circle cx="48" cy="39" r="3.5" fill="#fed7aa" />

    <!-- Head (Tilted upward) -->
    <circle cx="25" cy="14" r="11" fill="#fed7aa" />

    <!-- Hair (Stylized modern neat cut) -->
    <path d="M 14 14 C 14 7, 20 3, 27 4 C 34 5, 36 10, 36 14 C 34 11, 16 11, 14 14 Z" fill="#0f172a" />

    <!-- Facial expression hint (Happy/amazed profile) -->
    <path d="M 33 15 Q 35 17 33 19" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Atmospheric lighting highlights -->
  <circle cx="120" cy="65" r="30" fill="#ffffff" opacity="0.04" filter="url(#glow)" />
</svg>