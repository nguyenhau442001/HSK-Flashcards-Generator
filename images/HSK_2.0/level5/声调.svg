<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="teacherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Background Environment / Classroom Setup -->
  <g id="environment">
    <!-- Bookshelf in background -->
    <rect x="25" y="40" width="40" height="70" rx="4" fill="#334155" opacity="0.4"/>
    <line x1="25" y1="65" x2="65" y2="65" stroke="#1e293b" stroke-width="2"/>
    <line x1="25" y1="90" x2="65" y2="90" stroke="#1e293b" stroke-width="2"/>
    <!-- Books on shelf -->
    <rect x="30" y="48" width="8" height="17" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="40" y="50" width="6" height="15" rx="1" fill="#ec4899" opacity="0.6"/>
    <rect x="48" y="45" width="10" height="20" rx="1" fill="#38bdf8" opacity="0.6"/>

    <!-- Window with night city vibe -->
    <rect x="175" y="35" width="40" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="195" y1="35" x2="195" y2="90" stroke="#334155" stroke-width="2"/>
    <circle cx="185" cy="50" r="1.5" fill="#fef08a"/>
    <circle cx="205" cy="70" r="1.5" fill="#fef08a"/>
    
    <!-- Desk Surface -->
    <path d="M 10 175 L 230 175 L 220 210 L 20 210 Z" fill="#334155"/>
    <path d="M 10 175 L 230 175 L 230 180 L 10 180 Z" fill="#475569"/>

    <!-- Laptop / Computer Stand -->
    <rect x="130" y="130" width="75" height="48" rx="4" fill="#475569"/>
    <rect x="134" y="134" width="67" height="40" rx="2" fill="url(#screenGrad)"/>
    <!-- Laptop Base -->
    <path d="M 115 178 L 215 178 L 222 183 L 108 183 Z" fill="#64748b"/>

    <!-- Sound Wave Graph on Computer Screen (Representing Tones/声调) -->
    <path d="M 144 164 Q 153 140 162 164 T 180 148 T 194 154" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Pitch dots on wave -->
    <circle cx="144" cy="164" r="2.5" fill="#38bdf8"/>
    <circle cx="162" cy="164" r="2.5" fill="#ec4899"/>
    <circle cx="180" cy="148" r="2.5" fill="#10b981"/>
    <circle cx="194" cy="154" r="2.5" fill="#f59e0b"/>
  </g>

  <!-- Teacher / Tutor Character (Left Side) -->
  <g id="teacher-character">
    <!-- Body / Torso -->
    <path d="M 50 175 C 50 150 75 150 75 175 Z" fill="url(#teacherGrad)"/>
    <!-- Head -->
    <circle cx="62" cy="115" r="18" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 45 115 C 45 98 79 98 79 115 C 79 118 76 112 70 108 C 60 102 54 108 45 115 Z" fill="#334155"/>
    <!-- Glasses -->
    <circle cx="56" cy="115" r="5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="68" cy="115" r="5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="61" y1="115" x2="63" y2="115" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Smiling Mouth -->
    <path d="M 59 123 Q 62 126 65 123" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Arm pointing/explaining towards sound waves -->
    <path d="M 68 155 Q 85 150 98 140" fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="101" cy="138" r="4" fill="#fcd34d"/>
  </g>

  <!-- Student / Main Character (Center-Right Foreground) -->
  <g id="student-character">
    <!-- Headphones / Headset -->
    <path d="M 108 95 C 108 75 132 75 132 95" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <rect x="104" y="92" width="6" height="12" rx="3" fill="#0ea5e9"/>
    <rect x="130" y="92" width="6" height="12" rx="3" fill="#0ea5e9"/>
    <!-- Microphone boom -->
    <path d="M 132 104 Q 135 120 125 125" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="123" cy="126" r="3" fill="#f43f5e"/>

    <!-- Body / Hoodie -->
    <path d="M 95 190 C 95 155 145 155 145 190 Z" fill="#f43f5e"/>
    <path d="M 120 162 L 120 185" fill="none" stroke="#ffe4e6" stroke-width="2" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="120" cy="112" r="19" fill="#fecdd3"/>
    <!-- Hair -->
    <path d="M 102 112 C 102 92 138 92 138 112 C 138 115 135 105 128 100 C 118 95 110 100 102 112 Z" fill="#1e293b"/>
    
    <!-- Face / Expression: Attentive / Listening closely -->
    <circle cx="113" cy="112" r="2" fill="#1e293b"/>
    <circle cx="127" cy="112" r="2" fill="#1e293b"/>
    <!-- Eyebrows raised thoughtfully -->
    <path d="M 110 107 Q 113 105 116 107" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 124 107 Q 127 105 130 107" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Mouth open slightly repeating sound -->
    <ellipse cx="120" cy="122" rx="3" ry="4" fill="#1e293b"/>

    <!-- Hand near chin (Thoughtful / Paying attention gesture) -->
    <path d="M 110 160 Q 115 140 120 135" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="120" cy="132" r="4.5" fill="#fecdd3"/>
  </g>

  <!-- Dynamic Tone Flow Graphic Elements (Floating above computer) -->
  <g id="tone-flow-visuals">
    <!-- Glowing path showing rising/falling pitch trajectory -->
    <path d="M 95 85 Q 110 60 125 75 T 155 65 T 175 50" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" opacity="0.8"/>
    
    <!-- Stylized Tone Accent Icons floating -->
    <g transform="translate(110, 45)">
      <path d="M 0 10 L 10 0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="5" cy="5" r="8" fill="#f59e0b" opacity="0.2"/>
    </g>
    <g transform="translate(138, 40)">
      <path d="M 0 5 Q 5 -5 10 5" stroke="#ec4899" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="5" cy="2" r="8" fill="#ec4899" opacity="0.2"/>
    </g>
    <g transform="translate(165, 35)">
      <path d="M 0 0 L 10 10" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <circle cx="5" cy="5" r="8" fill="#10b981" opacity="0.2"/>
    </g>
  </g>

  <!-- Foreground Desk Details (Coffee cup, notebook) -->
  <g id="desk-props">
    <!-- Coffee Mug -->
    <rect x="75" y="165" width="16" height="20" rx="3" fill="#fbbf24"/>
    <path d="M 91 170 C 96 170 96 180 91 182" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 80 158 Q 83 152 80 146" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 86 160 Q 89 154 86 148" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Notebook / Textbook -->
    <polygon points="190,185 225,180 230,200 195,205" fill="#f8fafc"/>
    <polygon points="192,186 223,181 228,199 197,204" fill="#e2e8f0"/>
    <line x1="200" y1="190" x2="218" y2="187" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="199" y1="195" x2="216" y2="192" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

</svg>