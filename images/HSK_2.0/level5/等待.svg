<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Bus Stop Bench -->
  <rect x="30" y="150" width="180" height="15" rx="4" fill="#475569"/>
  <rect x="40" y="165" width="10" height="75" rx="2" fill="#334155"/>
  <rect x="190" y="165" width="10" height="75" rx="2" fill="#334155"/>
  
  <!-- Character: Waiting Person -->
  <g transform="translate(120, 140)">
    <!-- Legs -->
    <rect x="-25" y="0" width="12" height="60" rx="4" fill="#38bdf8"/>
    <rect x="13" y="0" width="12" height="60" rx="4" fill="#38bdf8"/>
    <!-- Torso -->
    <path d="M-30 -50 Q 0 -60 30 -50 L 25 0 L -25 0 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="0" cy="-85" r="25" fill="#fde68a"/>
    <!-- Eye (Looking at watch) -->
    <circle cx="-8" cy="-90" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-90" r="3" fill="#0f172a"/>
    <!-- Arm reaching to watch -->
    <path d="M20 -30 L 45 -45 L 55 -35" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Watch -->
    <circle cx="55" cy="-35" r="8" fill="#fbbf24"/>
    <line x1="55" y1="-35" x2="55" y2="-40" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Context: Street Lamp/Light -->
  <circle cx="200" cy="40" r="30" fill="#fbbf24" opacity="0.2"/>
  <circle cx="200" cy="40" r="10" fill="#fb923c"/>
  
  <!-- Foreground Details: Luggage -->
  <rect x="150" y="170" width="40" height="50" rx="6" fill="#10b981"/>
  <rect x="160" y="160" width="20" height="10" rx="2" fill="#f1f5f9"/>
</svg>