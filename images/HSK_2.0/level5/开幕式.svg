<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Stage Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="20%" r="60%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Confetti Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmosphere & Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Background Stage Architecture -->
  <!-- Curtains Left -->
  <path d="M0,0 L35,0 L20,240 L0,240 Z" fill="#0f172a" opacity="0.9" />
  <path d="M0,0 L25,0 L12,240 L0,240 Z" fill="#1e293b" opacity="0.8" />
  
  <!-- Curtains Right -->
  <path d="M240,0 L205,0 L220,240 L240,240 Z" fill="#0f172a" opacity="0.9" />
  <path d="M240,0 L215,0 L228,240 L240,240 Z" fill="#1e293b" opacity="0.8" />

  <!-- Stage Floor & Backdrop -->
  <rect x="35" y="195" width="170" height="45" fill="#090d16" />
  <line x1="35" y1="195" x2="205" y2="195" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

  <!-- Dynamic Stage Lights (Beams) -->
  <polygon points="120,0 20,240 50,240" fill="#38bdf8" opacity="0.06" />
  <polygon points="120,0 190,240 220,240" fill="#ec4899" opacity="0.06" />
  <polygon points="120,0 80,240 160,240" fill="#fbbf24" opacity="0.08" />

  <!-- Ribbon / Banner across top (Opening Ceremony Vibe) -->
  <path d="M 40,35 Q 120,55 200,35 L 195,55 Q 120,75 45,55 Z" fill="url(#gold-grad)" opacity="0.9" />
  <path d="M 55,42 Q 120,60 185,42" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.5" />

  <!-- Sparkling Stars / Magic Dust -->
  <g fill="#fbbf24">
    <circle cx="65" cy="80" r="1.5" />
    <circle cx="175" cy="75" r="2" />
    <circle cx="95" cy="110" r="1" />
    <circle cx="150" cy="100" r="1.5" />
  </g>

  <!-- Performers / Dancers (Stylized, Expressive Silhouettes & Shapes) -->
  <!-- Performer 1 (Left - Dynamic Pose) -->
  <g transform="translate(75, 140)">
    <!-- Body/Dress -->
    <path d="M-10,15 L10,15 L15,55 L-15,55 Z" fill="url(#pink-grad)" />
    <!-- Head -->
    <circle cx="0" cy="-5" r="8" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M-8,-8 C-5,-15 5,-15 8,-8 C5,-3 -5,-3 -8,-8" fill="#831843" />
    <!-- Raised Arms -->
    <path d="M-8,5 C-20,-10 -25,-5 -28,-12" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M8,5 C18,-5 22,2 26,-4" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Legs -->
    <line x1="-5" y1="55" x2="-10" y2="80" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" />
    <line x1="5" y1="55" x2="12" y2="80" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Performer 2 (Center-Right - Elegant Pose with Ribbon/Prop) -->
  <g transform="translate(145, 130)">
    <!-- Body/Suit -->
    <path d="M-8,15 L8,15 L12,65 L-12,65 Z" fill="url(#cyan-grad)" />
    <!-- Head -->
    <circle cx="0" cy="-5" r="8" fill="#bae6fd" />
    <!-- Hair -->
    <path d="M-8,-10 C0,-16 8,-10 8,-5 C0,-8 -8,-5 -8,-10" fill="#0369a1" />
    <!-- Arms -->
    <path d="M-8,5 C-18,15 -10,30 -22,35" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M8,5 C18,0 25,-15 32,-10" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Legs -->
    <line x1="-4" y1="65" x2="-8" y2="90" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" />
    <line x1="4" y1="65" x2="8" y2="90" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Flowing Ribbon Swirl (Grand Ceremony Effect) -->
  <path d="M 50,180 Q 90,110 130,160 T 210,120" stroke="url(#gold-grad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85" />
  <path d="M 60,195 Q 110,130 160,170 T 200,140" stroke="url(#pink-grad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />

  <!-- Confetti Pieces (Bursting from sides/top) -->
  <!-- Gold Confetti -->
  <rect x="50" y="90" width="6" height="4" rx="1" fill="#fbbf24" transform="rotate(25 53 92)" />
  <rect x="180" y="100" width="8" height="4" rx="1" fill="#f59e0b" transform="rotate(-40 184 102)" />
  <rect x="90" y="65" width="5" height="5" rx="1" fill="#fbbf24" transform="rotate(15 92 67)" />
  
  <!-- Pink Confetti -->
  <circle cx="70" cy="130" r="3" fill="#ec4899" />
  <circle cx="165" cy="85" r="2.5" fill="#f43f5e" />
  <rect x="125" y="75" width="7" height="3" rx="1" fill="#ec4899" transform="rotate(60 128 76)" />

  <!-- Cyan/Blue Confetti -->
  <circle cx="115" cy="95" r="2" fill="#38bdf8" />
  <rect x="155" y="135" width="6" height="3" rx="1" fill="#06b6d4" transform="rotate(-15 158 136)" />
  <circle cx="45" cy="115" r="2.5" fill="#38bdf8" />

  <!-- Foreground Atmosphere / Stage Edge Details -->
  <ellipse cx="120" cy="235" rx="90" ry="8" fill="#020617" opacity="0.6" />
</svg>