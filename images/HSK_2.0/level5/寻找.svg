<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="desk-glow" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Question Mark Glow/Aura -->
    <radialGradient id="q-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Papers/Books -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Desk Light Effect -->
  <rect width="240" height="240" rx="24" fill="url(#desk-glow)"/>

  <!-- BACKGROUND ENVIRONMENT: Bookshelf & Window -->
  <!-- Bookshelf Background Elements -->
  <rect x="25" y="35" width="70" height="45" rx="4" fill="#334155" opacity="0.6"/>
  <!-- Books on shelf -->
  <rect x="32" y="45" width="8" height="30" rx="1" fill="#ec4899"/>
  <rect x="42" y="42" width="12" height="33" rx="1" fill="#38bdf8"/>
  <rect x="56" y="48" width="6" height="27" rx="1" fill="#f59e0b"/>
  <rect x="64" y="40" width="14" height="35" rx="1" fill="#10b981"/>
  <rect x="80" y="47" width="9" height="28" rx="1" fill="#a855f7"/>

  <!-- Window with Night City Silhouette / Moonlight -->
  <path d="M165 30 L210 30 C213 30, 215 32, 215 35 L215 95 L165 95 Z" fill="#090d16"/>
  <path d="M175 42 L200 42 L200 85 L175 85 Z" fill="#38bdf8" opacity="0.12"/>
  <circle cx="195" cy="50" r="4" fill="#fbbf24" opacity="0.8"/>
  <path d="M175 75 Q188 70 200 78 L200 85 L175 85 Z" fill="#1e293b" opacity="0.8"/> <!-- distant roof -->

  <!-- Hanging Desk Lamp -->
  <path d="M130 0 L130 35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 35 L150 35 L160 50 L100 50 Z" fill="#475569"/>
  <!-- Lamp Beam Cone -->
  <path d="M130 50 L70 200 L190 200 Z" fill="#fbbf24" opacity="0.06"/>

  <!-- STUDY DESK SURFACE -->
  <path d="M15 195 L225 195 L235 225 L5 225 Z" fill="#0f172a"/>
  <path d="M15 195 L225 195 L225 200 L15 200 Z" fill="#334155"/>

  <!-- PROPS ON DESK: Messy Papers, Open Notebook, Magnifying Glass -->
  <!-- Scattered paper 1 -->
  <g filter="url(#shadow)">
    <path d="M30 205 L65 198 L75 220 L40 225 Z" fill="#f8fafc"/>
    <path d="M38 210 L58 206" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <path d="M36 216 L52 212" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Open Notebook / Dossier -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M70 170 L125 165 L125 210 L70 215 Z" fill="#f1f5f9"/>
    <!-- Right Page -->
    <path d="M125 165 L180 170 L180 215 L125 210 Z" fill="#f8fafc"/>
    <!-- Center Binding -->
    <line x1="125" y1="165" x2="125" y2="210" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Scribbles/Text lines -->
    <line x1="82" y1="180" x2="110" y2="177" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="190" x2="105" y2="187" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="82" y1="200" x2="100" y2="197" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="180" x2="168" y2="183" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="138" y1="192" x2="165" y2="195" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="185" y="178" width="18" height="24" rx="3" fill="#cbd5e1" filter="url(#shadow)"/>
  <path d="M203 184 C210 184, 210 196, 203 196" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- THE QUESTION MARK "ANSWER" FLOATING IN THE AIR -->
  <g transform="translate(145, 75)">
    <!-- Glow aura -->
    <circle cx="0" cy="0" r="24" fill="url(#q-glow)"/>
    <!-- Vector Question Mark -->
    <path d="M-5 -10 C-5 -18, 10 -18, 10 -8 C10 0, -2 2, -2 12" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" filter="url(#shadow)"/>
    <circle cx="-2" cy="21" r="4" fill="#38bdf8" filter="url(#shadow)"/>
    <!-- Sparkles around the answer -->
    <path d="M-22 -8 L-18 -8 L-20 -12 Z" fill="#fbbf24"/>
    <path d="M18 -2 L22 -4 L19 -7 Z" fill="#fbbf24"/>
    <circle cx="-16" cy="14" r="1.5" fill="#38bdf8"/>
    <circle cx="16" cy="12" r="2" fill="#fbbf24"/>
  </g>

  <!-- MAIN CHARACTER: Inquisitive Student / Seeker -->
  <g id="character">
    <!-- Body / Torso (leaning forward intently) -->
    <path d="M75 185 C75 145, 95 130, 115 130 C135 130, 145 155, 140 185 Z" fill="#38bdf8" filter="url(#shadow)"/>
    <!-- Collar/Shirt detail -->
    <path d="M100 130 L115 145 L130 130 Z" fill="#f8fafc"/>
    <path d="M107 137 L115 145 L123 137" fill="none" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Head & Neck -->
    <path d="M108 115 L122 115 L122 135 L108 135 Z" fill="#fed7aa"/>
    <circle cx="115" cy="98" r="22" fill="#fed7aa" filter="url(#shadow)"/>

    <!-- Hair (Curious, slightly messy style) -->
    <path d="M94 92 C92 72, 110 70, 124 74 C136 78, 138 92, 138 98 C138 98, 130 84, 116 82 C102 80, 96 90, 94 92 Z" fill="#1e293b"/>
    <path d="M125 76 C132 80, 138 90, 142 98 C140 92, 134 82, 125 76 Z" fill="#334155"/>

    <!-- Facial Expression: Focused, intense eyes looking up at the question mark -->
    <!-- Eyebrows (slanted in deep thought/searching) -->
    <path d="M102 91 L112 94" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M122 92 L131 89" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Glasses (Intlectual look, tilted up) -->
    <circle cx="107" cy="98" r="8" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="123" cy="97" r="8" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="115" y1="97" x2="115" y2="95" stroke="#0f172a" stroke-width="2"/>

    <!-- Eyes (looking up-right towards answer) -->
    <circle cx="109" cy="98" r="2.5" fill="#0f172a"/>
    <circle cx="125" cy="97" r="2.5" fill="#0f172a"/>

    <!-- Determined / thoughtful mouth -->
    <path d="M113 110 Q116 113 120 109" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

    <!-- RIGHT ARM & HAND: Holding Magnifying Glass actively searching -->
    <!-- Upper Arm / Shoulder -->
    <path d="M135 140 C145 145, 160 155, 168 175" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <!-- Forearm reaching up-forward -->
    <path d="M168 175 L155 135" fill="none" stroke="#38bdf8" stroke-width="11" stroke-linecap="round"/>
    <!-- Hand / Wrist -->
    <circle cx="152" cy="128" r="6" fill="#fed7aa"/>

    <!-- Magnifying Glass Tool (The iconic "Searching" prop) -->
    <g transform="translate(152, 128) rotate(-25)">
      <!-- Glass Handle -->
      <path d="M0 12 L0 32" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
      <path d="M0 12 L0 32" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <!-- Lens Rim -->
      <circle cx="0" cy="-12" r="22" fill="#0f172a" opacity="0.4" filter="url(#shadow)"/>
      <circle cx="0" cy="-12" r="20" fill="none" stroke="#e2e8f0" stroke-width="5"/>
      <circle cx="0" cy="-12" r="20" fill="#38bdf8" opacity="0.2"/>
      <!-- Lens Reflection Highlight -->
      <path d="M-10 -20 A 18 18 0 0 1 10 -20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- LEFT ARM: Resting on desk, gripping edge -->
    <path d="M85 150 C75 160, 65 175, 55 185" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="52" cy="187" r="6" fill="#fed7aa"/>
  </g>

  <!-- FOREGROUND ACCENTS & DYNAMIC VECTORS -->
  <!-- Floating Search Particle / Dust Motes catching desk light -->
  <circle cx="110" cy="120" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="130" cy="110" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="160" cy="100" r="1" fill="#fbbf24" opacity="0.9"/>
  <circle cx="95" cy="135" r="1.5" fill="#38bdf8" opacity="0.7"/>

  <!-- Subtle Rim Light on Character's Back -->
  <path d="M75 145 C75 165, 80 180, 85 185" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>