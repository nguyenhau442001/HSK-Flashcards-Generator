<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Desk Lamp Cone Light -->
    <linearGradient id="lightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glowing Energy/Focus Gradient -->
    <radialGradient id="focusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="woodDesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Atmospheric Background Elements (Bookshelf / Ambient Glow) -->
  <g opacity="0.3">
    <!-- Bookshelf background line -->
    <rect x="20" y="40" width="200" height="6" rx="3" fill="#475569" />
    <!-- Muted background books -->
    <rect x="30" y="15" width="12" height="25" rx="2" fill="#64748b" />
    <rect x="44" y="18" width="10" height="22" rx="2" fill="#0ea5e9" />
    <rect x="56" y="12" width="16" height="28" rx="2" fill="#f43f5e" />
    <rect x="170" y="14" width="14" height="26" rx="2" fill="#10b981" />
    <rect x="186" y="20" width="12" height="20" rx="2" fill="#f59e0b" />
  </g>

  <!-- Window with Night Cityscape / Stars -->
  <g opacity="0.4">
    <rect x="160" y="60" width="55" height="70" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <line x1="187" y1="60" x2="187" y2="130" stroke="#334155" stroke-width="2"/>
    <!-- Tiny Stars -->
    <circle cx="170" cy="75" r="1" fill="#fef08a"/>
    <circle cx="200" cy="85" r="1.5" fill="#fef08a"/>
    <circle cx="175" cy="110" r="1" fill="#fef08a"/>
  </g>

  <!-- Light Cone from Desk Lamp -->
  <polygon points="120,25 60,180 180,180" fill="url(#lightCone)" style="mix-blend-mode: screen;" />

  <!-- Main Wooden Desk Surface -->
  <path d="M 15 180 L 225 180 L 210 220 L 30 220 Z" fill="url(#woodDesk)" filter="url(#shadow)" />
  <rect x="15" y="180" width="210" height="5" rx="2" fill="#475569" />

  <!-- Study Environment & Props -->
  <!-- Stack of Reference Books (Left) -->
  <g transform="translate(35, 155)">
    <rect x="0" y="10" width="45" height="12" rx="3" fill="#e2e8f0" />
    <rect x="2" y="13" width="41" height="6" fill="#cbd5e1" />
    
    <rect x="-3" y="0" width="48" height="12" rx="3" fill="#3b82f6" />
    <rect x="0" y="3" width="42" height="6" fill="#60a5fa" />

    <rect x="2" y="-12" width="40" height="14" rx="3" fill="#f43f5e" />
    <rect x="5" y="-9" width="34" height="6" fill="#fb7185" />
    
    <!-- Bookmark hanging out -->
    <path d="M 30 2 L 35 15 L 32 16 L 28 3 Z" fill="#fbbf24" />
  </g>

  <!-- Coffee Mug / Warm Drink -->
  <g transform="translate(180, 160)">
    <rect x="0" y="4" width="16" height="16" rx="3" fill="#f8fafc" />
    <path d="M 16 7 C 20 7, 20 15, 16 15" stroke="#f8fafc" stroke-width="2.5" fill="none" />
    <!-- Steam -->
    <path d="M 5 0 C 3 -3, 8 -5, 6 -8" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 11 -2 C 9 -5, 14 -7, 12 -10" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Desk Lamp (Top Right) -->
  <g transform="translate(170, 65)">
    <path d="M 20 95 C 10 95, 0 70, -10 40" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="-10" cy="40" r="4" fill="#475569" />
    <!-- Lamp Head -->
    <path d="M -25 25 L 5 25 L -2 45 L -18 45 Z" fill="#fbbf24" />
    <ellipse cx="-10" cy="45" rx="8" ry="3" fill="#f59e0b" />
    <!-- Base -->
    <ellipse cx="22" cy="95" rx="14" ry="5" fill="#475569" />
  </g>

  <!-- Open Laptop / Study Notebook with Focus Glow -->
  <g transform="translate(70, 135)">
    <!-- Laptop Base -->
    <path d="M -20 30 L 70 30 L 85 48 L -35 48 Z" fill="#cbd5e1" />
    <rect x="-10" y="37" width="70" height="3" rx="1.5" fill="#94a3b8" />
    
    <!-- Laptop Screen (Open) -->
    <path d="M -25 -20 L 65 -20 L 70 32 L -20 32 Z" fill="#475569" />
    <rect x="-21" y="-16" width="87" height="44" rx="2" fill="#0f172a" />
    
    <!-- Code / Notes on Screen -->
    <g transform="translate(-15, -10)">
      <rect x="0" y="0" width="30" height="4" rx="2" fill="#38bdf8" />
      <rect x="0" y="8" width="55" height="3" rx="1.5" fill="#34d399" />
      <rect x="0" y="14" width="40" height="3" rx="1.5" fill="#f43f5e" />
      <rect x="0" y="20" width="48" height="3" rx="1.5" fill="#fbbf24" />
    </g>

    <!-- Glow radiating from screen -->
    <circle cx="22" cy="6" r="40" fill="url(#focusGlow)" style="mix-blend-mode: screen;" />
  </g>

  <!-- CHARACTER: Hard-working Student (Focused, leaning in, energetic) -->
  <g id="student" transform="translate(100, 95)">
    
    <!-- Body / Hoodie / Torso leaning forward -->
    <g transform="translate(0, 35)">
      <!-- Torso -->
      <path d="M -35 45 C -35 20, -10 10, 15 15 C 35 20, 45 35, 55 55 L -45 55 Z" fill="#6366f1" />
      <!-- Hoodie Hood / Collars -->
      <path d="M -15 12 C -5 5, 10 5, 20 12 C 10 18, -5 18, -15 12 Z" fill="#4f46e5" />
    </g>

    <!-- Arms & Hands working intensely -->
    <!-- Left Arm & Hand (typing/writing) -->
    <path d="M -25 50 C -35 55, -25 75, -5 70" stroke="#6366f1" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="-3" cy="72" r="6" fill="#fcd34d" /> <!-- Hand -->

    <!-- Right Arm & Hand (supportive / active) -->
    <path d="M 25 50 C 35 60, 20 78, 10 75" stroke="#6366f1" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="10" cy="75" r="6" fill="#fcd34d" /> <!-- Hand -->

    <!-- Neck -->
    <rect x="-5" y="22" width="10" height="18" fill="#fcd34d" />

    <!-- Head & Face (Leaned forward, extremely determined) -->
    <g transform="translate(0, -5)">
      <!-- Hair Base -->
      <path d="M -22 15 C -25 -5, -5 -15, 15 -10 C 28 -7, 28 10, 26 22 C 15 25, -10 25, -22 15 Z" fill="#1e293b" />
      
      <!-- Face Base -->
      <path d="M -18 8 C -18 22, 12 22, 16 8 C 16 0, -18 0, -18 8 Z" fill="#fef08a" />
      
      <!-- Determined Eyebrows (Slanted down inwards for intense focus) -->
      <line x1="-12" y1="5" x2="-3" y2="9" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
      <line x1="2" y1="9" x2="11" y2="5" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

      <!-- Focused / Confident Eyes (Arcs looking down at work) -->
      <path d="M -11 11 C -9 14, -6 14, -4 11" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M 3 11 C 5 14, 8 14, 10 11" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

      <!-- Rosy Cheeks of Effort -->
      <circle cx="-13" cy="14" r="3" fill="#f43f5e" opacity="0.4" />
      <circle cx="13" cy="14" r="3" fill="#f43f5e" opacity="0.4" />

      <!-- Determined Smile / Mouth -->
      <path d="M -2 18 C 0 20, 3 20, 5 18" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

      <!-- Stylish Hair Spikes / Top -->
      <path d="M -15 -8 C -5 -22, 10 -15, 20 -5 C 10 -12, -2 -12, -15 -8 Z" fill="#1e293b" />
    </g>

    <!-- Floating Sparkles / Inspiration Elements (Representing '用功' - hard work & brilliance) -->
    <g transform="translate(0, -35)">
      <!-- Golden Star 1 -->
      <path d="M -40 -10 L -37 -2 L -29 1 L -37 4 L -40 12 L -43 4 L -51 1 L -43 -2 Z" fill="#fbbf24" />
      <!-- Golden Star 2 -->
      <path d="M 45 -20 L 47 -14 L 53 -12 L 47 -10 L 45 -4 L 43 -10 L 37 -12 L 43 -14 Z" fill="#38bdf8" />
      <!-- Sparkle Dot -->
      <circle cx="30" cy="-30" r="2.5" fill="#34d399" />
      <circle cx="-25" cy="-25" r="2" fill="#f43f5e" />
    </g>
  </g>

  <!-- Dynamic Energy Lines / Action Focus -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="120" x2="35" y2="125" />
    <line x1="15" y1="140" x2="30" y2="140" />
    <line x1="210" y1="110" x2="195" y2="115" />
    <line x1="215" y1="130" x2="200" y2="128" />
  </g>
</svg>