<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background elements / room decor -->
  <circle cx="190" cy="60" r="30" fill="#38bdf8" opacity="0.08" />
  <circle cx="50" cy="180" r="40" fill="#f59e0b" opacity="0.05" />

  <!-- Wooden/Modern Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" />

  <!-- Desk Props: Pencil holder / Craft supplies in background -->
  <rect x="195" y="125" width="22" height="45" rx="4" fill="#64748b" />
  <rect x="198" y="120" width="16" height="10" rx="2" fill="#94a3b8" />
  <line x1="202" y1="115" x2="200" y2="125" stroke="#f59e0b" stroke-width="3" />
  <line x1="210" y1="113" x2="212" y2="125" stroke="#ec4899" stroke-width="3" />

  <!-- Main Character (Creative Crafter/Student) -->
  <g id="character">
    <!-- Torso / Hoodie -->
    <path d="M 80 200 C 80 165 95 150 120 150 C 145 150 160 165 160 200 Z" fill="#3b82f6" />
    <path d="M 105 150 L 135 150 L 140 175 L 100 175 Z" fill="#60a5fa" />
    <!-- Neck -->
    <rect x="110" y="132" width="20" height="22" rx="6" fill="#fbcfe8" />
    <!-- Head -->
    <circle cx="120" cy="116" r="26" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 94 116 C 94 95 106 90 120 90 C 134 90 146 95 146 116 C 146 122 144 126 142 126 C 138 120 132 108 120 106 C 108 108 102 120 98 126 C 96 126 94 122 94 116 Z" fill="#0f172a" />
    <!-- Face Expression (Focused, gentle smile) -->
    <circle cx="112" cy="116" r="2.5" fill="#1e293b" />
    <circle cx="128" cy="116" r="2.5" fill="#1e293b" />
    <path d="M 117 124 Q 120 127 123 124" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheeks -->
    <circle cx="109" cy="120" r="3" fill="#f43f5e" opacity="0.3" />
    <circle cx="131" cy="120" r="3" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- Craft Paper Being Cut -->
  <g id="paper-and-action" filter="url(#shadow)">
    <!-- Paper base (folded star/snowflake pattern style) -->
    <path d="M 85 155 L 145 135 L 155 165 L 95 185 Z" fill="url(#paperGrad)" />
    <!-- Decorative cuts already made on paper -->
    <polygon points="120,145 125,155 115,155" fill="#cbd5e1" />
    <polygon points="100,165 108,160 105,170" fill="#cbd5e1" />
  </g>

  <!-- SCISSORS (The Target Word Focus - 剪刀) -->
  <g id="scissors" filter="url(#shadow)" transform="translate(10, 15)">
    <!-- Lower Blade & Handle -->
    <g transform="rotate(-15, 120, 125)">
      <!-- Blade -->
      <path d="M 120 125 L 85 140 L 87 142 L 120 127 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5" />
      <path d="M 85 140 L 87 142 L 120 127 Z" fill="#cbd5e1" />
      <!-- Handle (Red/Orange ergonomic grip) -->
      <path d="M 120 125 C 115 120 105 125 105 133 C 105 142 118 142 120 125 Z" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
      <ellipse cx="112" cy="133" rx="4" ry="6" fill="#fef2f2" opacity="0.4" />
    </g>

    <!-- Upper Blade & Handle -->
    <g transform="rotate(25, 120, 125)">
      <!-- Blade -->
      <path d="M 120 125 L 82 105 L 84 103 L 120 123 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.5" />
      <path d="M 82 105 L 84 103 L 120 123 Z" fill="#e2e8f0" />
      <!-- Handle -->
      <path d="M 120 125 C 115 130 105 125 105 117 C 105 108 118 108 120 125 Z" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
      <ellipse cx="112" cy="117" rx="4" ry="6" fill="#fef2f2" opacity="0.4" />
    </g>

    <!-- Center Pivot Screw -->
    <circle cx="120" cy="125" r="3.5" fill="#64748b" />
    <circle cx="120" cy="125" r="1.5" fill="#cbd5e1" />
  </g>

  <!-- Hands Holding Scissors & Guiding Paper -->
  <g id="hands">
    <!-- Right Hand (Holding Scissors) -->
    <path d="M 125 140 C 130 135 138 138 142 145 C 146 152 140 160 135 155 Z" fill="#fbcfe8" />
    <!-- Left Hand (Holding Paper) -->
    <path d="M 75 160 C 70 165 75 175 82 172 C 89 168 85 158 75 160 Z" fill="#fbcfe8" />
  </g>

  <!-- Motion / Action Sparkles (Highlighting the "cutting" action) -->
  <g id="sparkles">
    <path d="M 78 120 L 80 126 L 86 128 L 80 130 L 78 136 L 76 130 L 70 128 L 76 126 Z" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="95" cy="148" r="2" fill="#38bdf8" />
    <circle cx="70" cy="150" r="1.5" fill="#38bdf8" />
    <!-- Cutting Dotted Line Guidance -->
    <path d="M 65 145 Q 75 140 85 140" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.8" />
  </g>

  <!-- Foreground Atmospheric Lighting -->
  <path d="M 0 0 L 240 0 L 240 240 L 0 240 Z" fill="url(#bgGrad)" style="mix-blend-mode: overlay;" opacity="0.2" />
</svg>