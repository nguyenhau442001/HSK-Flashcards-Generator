<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="strongGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Ground -->
  <rect x="0" y="190" width="240" height="50" fill="#2d3b50"/>

  <!-- Building structure (base) -->
  <rect x="40" y="160" width="160" height="30" fill="#64748b"/>

  <!-- Building frame - vertical beams -->
  <rect x="50" y="80" width="10" height="80" fill="#64748b"/>
  <rect x="115" y="80" width="10" height="80" fill="#64748b"/>
  <rect x="180" y="80" width="10" height="80" fill="#64748b"/>

  <!-- Building frame - horizontal beams -->
  <rect x="50" y="70" width="140" height="10" fill="#64748b"/>
  <rect x="40" y="150" width="160" height="10" fill="#64748b"/>

  <!-- Scaffolding -->
  <rect x="100" y="100" width="5" height="60" fill="#94a3b8"/>
  <rect x="135" y="100" width="5" height="60" fill="#94a3b8"/>
  <rect x="95" y="100" width="50" height="5" fill="#94a3b8"/>
  <rect x="95" y="130" width="50" height="5" fill="#94a3b8"/>

  <!-- Worker on scaffolding -->
  <circle cx="120" cy="95" r="8" fill="#fbbf24"/> <!-- Hard hat -->
  <rect x="115" y="100" width="10" height="25" fill="#38bdf8"/> <!-- Body -->
  <rect x="110" y="115" width="20" height="5" fill="#38bdf8"/> <!-- Arms -->
  <rect x="115" y="125" width="5" height="10" fill="#38bdf8"/> <!-- Leg 1 -->
  <rect x="120" y="125" width="5" height="10" fill="#38bdf8"/> <!-- Leg 2 -->

  <!-- Construction materials (wood planks) -->
  <rect x="20" y="170" width="30" height="15" fill="#f59e0b" rx="2"/>
  <rect x="25" y="175" width="30" height="15" fill="#fbbf24" rx="2"/>
  <rect x="180" y="170" width="30" height="15" fill="#f59e0b" rx="2"/>
  <rect x="185" y="175" width="30" height="15" fill="#fbbf24" rx="2"/>

  <!-- Subtle light glow -->
  <circle cx="120" cy="60" r="80" fill="url(#softGlow)"/>
  <circle cx="120" cy="60" r="40" fill="url(#strongGlow)"/>
</svg>