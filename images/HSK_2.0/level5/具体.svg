<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Glow -->
    <radialGradient id="deskGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- UI/Blueprint Floating Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#deskGlow)" />

  <!-- Background Environment (Office / Studio Wall) -->
  <g id="environment">
    <!-- Window Silhouette with city lights -->
    <path d="M170 30 L210 35 L210 95 L170 90 Z" fill="#090d16" opacity="0.6" />
    <rect x="178" y="42" width="10" height="18" rx="2" fill="#f59e0b" opacity="0.4" />
    <rect x="194" y="50" width="10" height="25" rx="2" fill="#38bdf8" opacity="0.4" />

    <!-- Wall Shelf with Objects -->
    <path d="M30 65 L90 70 L90 73 L30 68 Z" fill="#475569" />
    <circle cx="45" cy="55" r="8" fill="#10b981" />
    <rect x="60" y="48" width="12" height="22" rx="2" fill="#f43f5e" />

    <!-- Desk Surface -->
    <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="#0f172a" />
    <path d="M0 175 L240 175 L240 181 L0 181 Z" fill="#334155" />
  </g>

  <!-- Character 1: Manager / Listener (Left, pointing to details) -->
  <g id="manager" transform="translate(15, 75)">
    <!-- Body / Torso -->
    <path d="M25 65 C25 50 40 45 55 50 L75 90 L5 90 Z" fill="#3b82f6" />
    <!-- Collar / Shirt -->
    <path d="M45 50 L55 62 L35 62 Z" fill="#f8fafc" />
    <!-- Head -->
    <circle cx="45" cy="32" r="16" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M29 32 C29 20 61 20 61 32 C61 35 55 26 45 26 C35 26 29 35 29 32 Z" fill="#334155" />
    <!-- Face Profile / Expression -->
    <circle cx="51" cy="32" r="1.5" fill="#1e293b" />
    <!-- Arm gesturing 'Detailed' (Pointing forward) -->
    <path d="M60 60 L85 68 L65 78 Z" fill="#3b82f6" />
    <circle cx="87" cy="69" r="5" fill="#fbcfe8" />
  </g>

  <!-- Character 2: Presenter / Explainer (Right, speaking & presenting) -->
  <g id="presenter" transform="translate(130, 70)">
    <!-- Body / Torso -->
    <path d="M25 60 C25 45 40 40 55 45 L70 105 L10 105 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="40" cy="27" r="15" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M25 27 C25 15 55 15 55 27 C55 25 48 18 40 18 C32 18 25 25 25 27 Z" fill="#78350f" />
    <!-- Face Expression (Engaged/Explaining) -->
    <path d="M30 29 Q35 34 40 29" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Hand holding/presenting -->
    <path d="M20 65 L5 75 L15 85 Z" fill="#10b981" />
    <circle cx="3" cy="77" r="4" fill="#fcd34d" />
  </g>

  <!-- Central Focus: The "Detailed Concept" (Floating Graphic / Blueprint / Magnified Data) -->
  <g id="detailed-concept" transform="translate(75, 85)" filter="url(#dropShadow)">
    <!-- Floating Main Card -->
    <rect x="0" y="0" width="90" height="75" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Header bar inside card -->
    <rect x="10" y="10" width="40" height="8" rx="4" fill="#38bdf8" />
    <circle cx="75" cy="14" r="4" fill="#f59e0b" />

    <!-- Specific Structured Elements (Representing '具体' - concrete details instead of vague shapes) -->
    <!-- Bar chart details -->
    <rect x="12" y="28" width="10" height="32" rx="2" fill="#10b981" />
    <rect x="26" y="22" width="10" height="38" rx="2" fill="#38bdf8" />
    <rect x="40" y="35" width="10" height="25" rx="2" fill="#f43f5e" />
    <rect x="54" y="18" width="10" height="42" rx="2" fill="#fbbf24" />

    <!-- Connecting precise alignment lines -->
    <line x1="12" y1="64" x2="78" y2="64" stroke="#64748b" stroke-width="2" stroke-dasharray="2 2" />

    <!-- Magnifying Glass accent zooming in on the specifics -->
    <g transform="translate(48, 22)" filter="url(#glow)">
      <circle cx="12" cy="12" r="14" fill="none" stroke="#fbbf24" stroke-width="3" />
      <circle cx="12" cy="12" r="12" fill="#38bdf8" fill-opacity="0.2" />
      <line x1="22" y1="22" x2="32" y2="32" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
      <!-- Tiny checkmark inside lens representing accuracy/specificity -->
      <path d="M7 12 L11 16 L17 8" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Foreground Props on Desk -->
  <g id="desk-props">
    <!-- Coffee Mug -->
    <rect x="35" y="155" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M51 160 C56 160 56 170 51 170" stroke="#f8fafc" stroke-width="2.5" fill="none" />
    <ellipse cx="43" cy="155" rx="8" ry="2" fill="#38bdf8" />

    <!-- Laptop Base -->
    <path d="M150 170 L210 170 L220 178 L140 178 Z" fill="#64748b" />
    <!-- Laptop Screen angled back -->
    <path d="M145 170 L155 125 L205 125 L215 170 Z" fill="#334155" />
    <rect x="153" y="131" width="45" height="34" rx="2" fill="#0f172a" />
    <!-- Screen UI code/details lines -->
    <line x1="158" y1="138" x2="185" y2="138" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="158" y1="146" x2="192" y2="146" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="158" y1="154" x2="175" y2="154" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Speech/Communication visual indicators (Pointers / Focus lines) -->
  <g id="speech-indicators" opacity="0.8">
    <path d="M95 95 Q105 85 115 95" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#glow)" />
    <polygon points="113,91 120,96 112,100" fill="#38bdf8" />
  </g>
</svg>