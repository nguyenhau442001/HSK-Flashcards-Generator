<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Deep Forest Night Gradient -->
  <defs>
    <radialGradient id="moonlight" cx="0.7" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" fill="url(#moonlight)"/>

  <!-- Background Forest Layer (Silhouettes) -->
  <path d="M10 240 L10 120 L25 100 L40 130 L55 90 L75 140 L90 110 L110 240 Z" fill="#131c2e"/>
  <path d="M130 240 L130 100 L150 70 L170 110 L190 85 L210 120 L230 95 L240 110 L240 240 Z" fill="#162032"/>

  <!-- Midground Trees & Foliage -->
  <!-- Tree Trunk Left -->
  <rect x="15" y="40" width="22" height="200" fill="url(#trunk-grad)" rx="4"/>
  <!-- Tree Trunk Right -->
  <path d="M205 30 C205 30 195 100 200 240 L235 240 C235 150 225 30 225 30 Z" fill="url(#trunk-grad)"/>

  <!-- Hanging Vines & Leaves -->
  <path d="M37 70 Q45 100 35 130 T45 170" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 50 Q190 90 205 120" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <!-- Glowing Forest Mushrooms (Context Props) -->
  <g transform="translate(25, 205)">
    <path d="M0 15 Q10 0 20 15 Z" fill="#ec4899"/>
    <rect x="8" y="15" width="4" height="10" fill="#cbd5e1"/>
    <circle cx="7" cy="8" r="1.5" fill="#fbcfe8"/>
    <circle cx="14" cy="10" r="1" fill="#fbcfe8"/>
  </g>
  <g transform="translate(15, 215)">
    <path d="M0 10 Q7 -2 14 10 Z" fill="#38bdf8"/>
    <rect x="5" y="10" width="4" height="8" fill="#cbd5e1"/>
  </g>

  <!-- Giant Log / Branch running through the scene -->
  <path d="M -10 170 Q 120 150 250 185 L 250 215 Q 120 180 -10 210 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Wood texture details on log -->
  <path d="M70 171 Q120 162 160 175" fill="none" stroke="#0f172a" stroke-width="3"/>
  <path d="M40 185 Q90 172 130 188" fill="none" stroke="#0f172a" stroke-width="2"/>

  <!-- THE SNAKE (Main Subject - 蛇) -->
  <g id="snake">
    <!-- Snake Body winding over and around the log -->
    <!-- Tail winding under -->
    <path d="M 60 176 Q 50 182 65 190 Q 80 197 75 204" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <!-- Body coils -->
    <path d="M 75 204 Q 95 212 110 195 Q 130 175 120 162 Q 110 150 135 155 Q 160 160 165 178" fill="none" stroke="#059669" stroke-width="11" stroke-linecap="round"/>
    <!-- Snake Belly Highlight -->
    <path d="M 122 161 Q 110 150 135 155 Q 158 160 163 175" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>

    <!-- Snake Neck & Head Raised Alertly -->
    <path d="M 165 178 Q 175 155 168 135 Q 162 120 175 115" fill="none" stroke="#059669" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Snake Head Detail -->
    <g transform="translate(168, 107)">
      <!-- Head shape -->
      <ellipse cx="6" cy="6" rx="9" ry="6" fill="#047857" transform="rotate(-20 6 6)"/>
      <!-- Glowing Eye -->
      <circle cx="9" cy="4" r="2" fill="#fbbf24"/>
      <circle cx="9.5" cy="4" r="0.8" fill="#0f172a"/>
      <!-- Flicking Tongue -->
      <path d="M 14 6 L 21 4 M 21 4 L 24 2 M 21 4 L 24 7" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Fireflies / Magic forest dust) -->
  <circle cx="100" cy="130" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="145" cy="110" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="70" cy="100" r="2.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="185" cy="140" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="45" cy="150" r="2" fill="#fbbf24" opacity="0.9"/>

  <!-- Additional Foreground Flora (Leaves overlapping bottom corners) -->
  <path d="M-5 240 Q 30 200 60 240 Z" fill="#064e3b"/>
  <path d="M245 240 Q 210 195 180 240 Z" fill="#064e3b"/>
  <path d="M190 240 Q 215 210 240 225 Z" fill="#047857"/>
  <path d="M0 220 Q 25 195 45 240 Z" fill="#047857"/>

  <!-- Vignette / Frame Border overlay for polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>