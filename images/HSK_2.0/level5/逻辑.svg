<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="desk-glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Board Glow -->
    <radialGradient id="board-glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Room Elements / Ambient Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#desk-glow)"/>

  <!-- Wall Elements: Detective / Analyst Corkboard & Bookshelf -->
  <g transform="translate(0, 0)">
    <!-- Corkboard background on the wall -->
    <rect x="25" y="24" width="95" height="75" rx="6" fill="#334155" opacity="0.6"/>
    <rect x="28" y="27" width="89" height="69" rx="4" fill="#1e293b" opacity="0.8"/>
    
    <!-- Connected logic nodes on board (abstract visual representation of deduction) -->
    <circle cx="45" cy="45" r="5" fill="#38bdf8"/>
    <circle cx="85" cy="40" r="5" fill="#10b981"/>
    <circle cx="65" cy="75" r="6" fill="#f59e0b"/>
    <line x1="45" y1="45" x2="65" y2="75" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,2"/>
    <line x1="85" y1="40" x2="65" y2="75" stroke="#10b981" stroke-width="2"/>
    <!-- Push pins -->
    <circle cx="45" cy="45" r="2" fill="#ef4444"/>
    <circle cx="85" cy="40" r="2" fill="#ef4444"/>
    <circle cx="65" cy="75" r="2" fill="#ef4444"/>

    <!-- Small Bookshelf / Files on the right wall -->
    <rect x="195" y="45" width="20" height="50" rx="2" fill="#334155" opacity="0.5"/>
    <rect x="197" y="55" width="16" height="4" rx="1" fill="#64748b"/>
    <rect x="197" y="65" width="16" height="4" rx="1" fill="#38bdf8"/>
    <rect x="197" y="75" width="16" height="4" rx="1" fill="#f59e0b"/>
  </g>

  <!-- Large Illuminated Concept Board / Holo screen in background (Center-Right) -->
  <g>
    <rect x="130" y="30" width="85" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="130" y="30" width="85" height="85" rx="8" fill="url(#board-glow)"/>
    
    <!-- Flowchart / Logical sequence structure inside screen -->
    <rect x="142" y="45" width="22" height="14" rx="3" fill="#38bdf8" opacity="0.8"/>
    <path d="M164 52 H176" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
    <polygon points="176,50 181,52 176,54" fill="#fb923c"/>
    <rect x="181" y="45" width="22" height="14" rx="3" fill="#10b981" opacity="0.8"/>

    <path d="M192 59 V70" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
    <polygon points="190,70 192,75 194,70" fill="#fb923c"/>

    <rect x="165" y="75" width="40" height="16" rx="3" fill="#f59e0b" opacity="0.9"/>
    <circle cx="173" cy="83" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="185" cy="83" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="197" cy="83" r="3" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Wooden Desk Surface -->
  <g>
    <path d="M15 170 H225 L215 150 H25 Z" fill="#334155"/>
    <rect x="10" y="170" width="220" height="12" rx="3" fill="#475569"/>
    <!-- Desk front dark rim -->
    <rect x="10" y="182" width="220" height="4" rx="1" fill="#1e293b"/>
  </g>

  <!-- Desk Props -->
  <g>
    <!-- Laptop -->
    <path d="M140 150 L175 150 L180 170 L135 170 Z" fill="#64748b"/>
    <path d="M143 128 H172 A2 2 0 0 1 174 130 V150 H141 V130 A2 2 0 0 1 143 128 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <path d="M148 135 H167" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M148 142 H160" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

    <!-- Coffee Mug -->
    <rect x="190" y="150" width="14" height="18" rx="2" fill="#f8fafc"/>
    <path d="M204 154 H207 A3 3 0 0 1 207 162 H204" stroke="#f8fafc" stroke-width="2" fill="none"/>

    <!-- Notebook / Files -->
    <rect x="40" y="156" width="35" height="14" rx="1" fill="#cbd5e1" transform="rotate(-5 40 156)"/>
    <rect x="42" y="158" width="31" height="10" fill="#ffffff" transform="rotate(-5 40 156)"/>
    <line x1="48" y1="160" x2="65" y2="158" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="163" x2="60" y2="161" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Magnifying glass (symbolizing deductive reasoning / logic) -->
    <path d="M75 145 A10 10 0 1 0 75 125 A10 10 0 1 0 75 145 Z" fill="none" stroke="#fb923c" stroke-width="3"/>
    <circle cx="75" cy="135" r="8" fill="#38bdf8" opacity="0.3"/>
    <line x1="82" y1="142" x2="94" y2="154" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Main Character: Analyst / Professional Deduplicating / Concluding -->
  <g transform="translate(0, 5)">
    <!-- Character Body / Torso -->
    <path d="M75 175 C75 155 85 145 105 145 C125 145 135 155 135 175 Z" fill="#38bdf8"/>
    <!-- Collar / Tie -->
    <polygon points="105,145 100,158 110,158" fill="#ffffff"/>
    <polygon points="103,158 107,158 108,172 105,176 102,172" fill="#ef4444"/>

    <!-- Character Neck -->
    <rect x="98" y="132" width="14" height="16" fill="#fbcfe8" rx="4"/>

    <!-- Character Head -->
    <circle cx="105" cy="115" r="22" fill="#fbcfe8"/>

    <!-- Hair (Stylish modern professional cut) -->
    <path d="M84 112 C84 96 95 93 105 93 C116 93 127 96 126 112 C127 104 122 98 112 97 C105 96 97 98 84 112 Z" fill="#334155"/>
    <path d="M84 110 C86 102 92 97 100 95 C98 100 95 106 90 114 Z" fill="#334155"/>

    <!-- Face details -->
    <!-- Glasses (smart look) -->
    <rect x="91" y="106" width="11" height="8" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="108" y="106" width="11" height="8" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="102" y1="110" x2="108" y2="110" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Confident / Smelling-Success Smile -->
    <path d="M100 123 Q105 128 110 123" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Gesturing Arms -->
    <!-- Left Arm (bent holding chin or thinking) -->
    <path d="M80 152 C75 140 85 130 95 130" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="95" cy="128" r="5" fill="#fbcfe8"/>

    <!-- Right Arm (pointing enthusiastically at the logic chart/screen) -->
    <path d="M130 152 C145 145 155 135 165 125" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="168" cy="122" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Foreground floating success / logical conclusion spark elements -->
  <g>
    <!-- Glowing light bulb moment above head -->
    <path d="M105 68 C100 68 96 72 96 77 C96 81 99 84 101 87 L101 92 H109 L109 87 C111 84 114 81 114 77 C114 72 110 68 105 68 Z" fill="#f59e0b"/>
    <rect x="101" y="93" width="8" height="3" rx="1" fill="#94a3b8"/>
    <!-- Spark rays -->
    <line x1="105" y1="58" x2="105" y2="63" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="91" y1="68" x2="95" y2="71" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="119" y1="68" x2="115" y2="71" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="105" cy="77" r="3" fill="#fef3c7" opacity="0.6"/>
  </g>

</svg>