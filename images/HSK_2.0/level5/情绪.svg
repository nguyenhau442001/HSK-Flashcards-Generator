<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool Window Moon Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Lighting Overlays -->
  <circle cx="160" cy="80" r="100" fill="url(#lampGlow)"/>
  <rect x="20" y="20" width="80" height="110" rx="4" fill="url(#windowGlow)"/>

  <!-- ENVIRONMENT / BACKGROUND PROPS -->

  <!-- Window Frame & Night View -->
  <g transform="translate(20, 20)">
    <!-- Window Outer Frame -->
    <rect width="80" height="110" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="6" y="6" width="68" height="98" rx="2" fill="#1e293b"/>
    <!-- Window Panes Grid -->
    <line x1="40" y1="6" x2="40" y2="104" stroke="#334155" stroke-width="2"/>
    <line x1="6" y1="55" x2="74" y2="55" stroke="#334155" stroke-width="2"/>
    <!-- City Silhouette Outside -->
    <path d="M10 90 L10 75 L18 75 L18 90 L26 90 L26 65 L34 65 L34 90 L46 90 L46 50 L56 50 L56 90 L68 90 L68 70 L70 70 L70 90 Z" fill="#090d16" opacity="0.6"/>
    <!-- Subtle Stars/Moon -->
    <circle cx="20" cy="25" r="1.5" fill="#e2e8f0" opacity="0.8"/>
    <circle cx="60" cy="35" r="1" fill="#e2e8f0" opacity="0.5"/>
    <circle cx="68" cy="18" r="2" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Bookshelf / Storage in Background -->
  <g transform="translate(140, 30)">
    <rect x="0" y="0" width="70" height="85" fill="#111827" rx="3" opacity="0.5"/>
    <!-- Shelves -->
    <line x1="0" y1="28" x2="70" y2="28" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="56" x2="70" y2="56" stroke="#334155" stroke-width="2"/>
    <!-- Books on Shelf -->
    <rect x="8" y="10" width="8" height="18" fill="#475569" rx="1"/>
    <rect x="18" y="8" width="12" height="20" fill="#0284c7" rx="1"/>
    <rect x="32" y="12" width="6" height="16" fill="#0d9488" rx="1"/>
    <rect x="45" y="38" width="10" height="18" fill="#e11d48" rx="1" transform="rotate(10 45 38)"/>
    <rect x="57" y="38" width="8" height="18" fill="#d97706" rx="1"/>
  </g>

  <!-- Desk Surface -->
  <path d="M10 180 L230 180 L220 210 L20 210 Z" fill="#0f172a" filter="url(#softShadow)"/>
  <rect x="10" y="175" width="220" height="6" fill="#334155" rx="2"/>

  <!-- Desk Props -->
  <!-- Laptop (Closed / Off) -->
  <g transform="translate(130, 155)">
    <rect x="0" y="18" width="45" height="4" fill="#64748b" rx="1"/>
    <path d="M3 0 L42 0 C43.5 0 44 1 44 2 L44 18 L1 18 L1 2 C1 1 1.5 0 3 0 Z" fill="#475569"/>
    <!-- Apple-like subtle logo or light -->
    <circle cx="22" cy="9" r="2" fill="#94a3b8" opacity="0.5"/>
  </g>

  <!-- Mug with Steam -->
  <g transform="translate(190, 145)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#cbd5e1"/>
    <path d="M16 10 C20 10 20 18 16 18" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
    <!-- Cold/Still Mug (no steam rising, emphasizing somber mood) -->
    <ellipse cx="8" cy="5" rx="8" ry="2" fill="#94a3b8"/>
  </g>

  <!-- Desk Lamp -->
  <g transform="translate(170, 105)">
    <path d="M15 70 L25 70 L22 40 L18 40 Z" fill="#334155"/>
    <path d="M12 40 L28 40 L33 22 L7 22 Z" fill="#f59e0b"/>
    <!-- Lamp base -->
    <ellipse cx="20" cy="71" rx="12" ry="3" fill="#475569"/>
    <!-- Arm -->
    <path d="M20 40 L20 15 L35 10" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- MAIN CHARACTER: Depressed/Low Mood Male -->
  <g transform="translate(60, 85)" filter="url(#softShadow)">
    <!-- Chair Backrest -->
    <path d="M-15 15 C-15 -10 5 -15 25 -15 C45 -15 65 -10 65 15 L65 95 L-15 95 Z" fill="#334155" rx="8"/>
    <path d="M-5 25 L55 25 L55 85 L-5 85 Z" fill="#1e293b" opacity="0.5"/>

    <!-- Slumped Body / Torso -->
    <g transform="translate(10, 30)">
      <!-- Hoodie / Sweater (Somber dark blue-grey tone) -->
      <path d="M-15 35 C-15 15 5 10 25 10 C45 10 65 15 65 35 L75 75 C75 80 70 85 65 85 L-15 85 C-20 85 -25 80 -25 75 Z" fill="#3b82f6"/>
      <!-- Hoodie collar / hood bunched behind neck -->
      <path d="M-5 12 C10 2 35 2 50 12 C40 -2 5 -2 -5 12 Z" fill="#2563eb"/>
    </g>

    <!-- Slumped Head & Face (Resting on hand, looking down) -->
    <g transform="translate(25, -2)">
      <!-- Neck -->
      <path d="M10 20 L22 20 L20 38 L12 38 Z" fill="#fbcfe8"/>

      <!-- Head Base -->
      <circle cx="16" cy="4" r="18" fill="#fbcfe8"/>

      <!-- Messy Hair (Dark brown/black) -->
      <path d="M-2 4 C-2 -10 10 -16 22 -14 C34 -12 36 -2 36 6 C36 10 34 12 34 12 C34 12 28 0 16 0 C4 0 -2 4 -2 4 Z" fill="#0f172a"/>
      <path d="M-2 4 L2 -4 L8 2 L14 -6 L22 0 L30 -4 L34 6 Z" fill="#0f172a"/>

      <!-- Closed/Downcast Eyes (Showing low mood/sadness) -->
      <!-- Eyebrow tilted in melancholy/frustration angle -->
      <path d="M12 2 C16 -1 22 1 24 3" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Closed curved eye lash line -->
      <path d="M13 7 C16 9 20 9 23 7" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Slight frown / neutral-sad mouth -->
      <path d="M14 16 C17 14 20 14 22 15" stroke="#9f1239" stroke-width="1.5" stroke-linecap="round" fill="none"/>

      <!-- Supporting Hand on Chin/Cheek -->
      <g transform="translate(18, 12)">
        <!-- Forearm & Hand propping the head -->
        <path d="M0 10 C-10 15 -25 35 -35 50 L-25 55 C-15 40 0 22 10 18 Z" fill="#fbcfe8"/>
        <!-- Fingers curved near cheek/chin -->
        <circle cx="2" cy="7" r="4" fill="#fbcfe8"/>
        <path d="M-2 3 C-4 5 -2 8 1 7" stroke="#db2777" stroke-width="1" fill="none"/>
      </g>
    </g>

    <!-- Arms & Shoulders Drooping -->
    <!-- Other arm resting on lap/table edge -->
    <g transform="translate(5, 55)">
      <path d="M0 0 C15 5 35 15 45 30 L55 25 C40 10 20 -2 0 -5 Z" fill="#3b82f6"/>
    </g>
  </g>

  <!-- Subtle visual metaphor elements for "tâm trạng không tốt" (low energy, heavy atmosphere) -->
  <!-- Soft downward motion lines near character to emphasize slumped, heavy mood without any text/symbols -->
  <g stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.3" transform="translate(0, 5)">
    <line x1="125" y1="90" x2="125" y2="105"/>
    <line x1="133" y1="95" x2="133" y2="112"/>
  </g>

</svg>