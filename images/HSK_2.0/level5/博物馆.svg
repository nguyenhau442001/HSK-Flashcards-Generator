<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Museum Interior / Exhibits -->
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Pillar Gradient -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Exhibit Glass Shimmer -->
    <linearGradient id="glassShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <circle cx="120" cy="110" r="110" fill="url(#amberGlow)"/>

  <!-- FLOOR & PERSPECTIVE -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#0f172a"/>
  <!-- Floor tiles grid lines for depth -->
  <path d="M0 200 L40 240 M60 200 L100 240 M120 200 L160 240 M180 200 L220 240" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="0" y1="215" x2="240" y2="215" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="0" y1="230" x2="240" y2="230" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>

  <!-- BACKGROUND ARCHITECTURAL ELEMENTS (Classical Museum Facade/Interior) -->
  <!-- Left Pillar -->
  <rect x="15" y="60" width="22" height="145" fill="url(#pillarGrad)" rx="2"/>
  <rect x="12" y="55" width="28" height="8" fill="#475569" rx="1"/>
  <rect x="12" y="197" width="28" height="8" fill="#475569" rx="1"/>

  <!-- Right Pillar -->
  <rect x="203" y="60" width="22" height="145" fill="url(#pillarGrad)" rx="2"/>
  <rect x="200" y="55" width="28" height="8" fill="#475569" rx="1"/>
  <rect x="200" y="197" width="28" height="8" fill="#475569" rx="1"/>

  <!-- Pediment / Arch Top Center -->
  <path d="M37 60 L120 25 L203 60 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="45" r="10" fill="#f59e0b" opacity="0.8"/>

  <!-- CENTRAL EXHIBIT: Ancient Relic on Pedestal -->
  <!-- Spotlight Beam -->
  <path d="M120 0 L85 170 L155 170 Z" fill="#fbbf24" opacity="0.08"/>

  <!-- Pedestal Base -->
  <path d="M85 185 L155 185 L165 205 L75 205 Z" fill="#475569"/>
  <path d="M90 170 L150 170 L155 185 L85 185 Z" fill="#64748b"/>
  <rect x="95" y="155" width="50" height="15" fill="#334155" rx="1"/>

  <!-- Glass Display Case -->
  <rect x="100" y="105" width="40" height="50" fill="url(#glassShimmer)" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <path d="M100 105 L108 97 L148 97 L140 105 Z" fill="#475569" opacity="0.8"/>

  <!-- Precious Artifact inside Case (Golden Ancient Chinese Ritual Bronze Vessel / Ding) -->
  <g transform="translate(120, 130)">
    <!-- Vessel Body -->
    <path d="M-12 -10 C-12 5 -10 15 0 15 C10 15 12 5 12 -10 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <!-- Rim -->
    <ellipse cx="0" cy="-10" rx="13" ry="3" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <!-- Legs (3 visible/stylized) -->
    <path d="M-8 12 L-10 20 M0 15 L0 21 M8 12 L10 20" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <!-- Handles -->
    <path d="M-13 -6 C-17 -6 -17 -14 -12 -14" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M13 -6 C17 -6 17 -14 12 -14" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <!-- Decorative swirl on artifact -->
    <path d="M-5 0 Q0 -5 5 0" fill="none" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- SECONDARY EXHIBIT: Dinosaur Fossil / Skeleton (Right Background) -->
  <g transform="translate(170, 115) scale(0.7)">
    <!-- Stand -->
    <line x1="20" y1="20" x2="20" y2="80" stroke="#64748b" stroke-width="3"/>
    <line x1="10" y1="80" x2="30" y2="80" stroke="#64748b" stroke-width="3"/>
    <!-- Dino Bones (Stylized minimalist T-Rex skull & spine) -->
    <path d="M-10 30 Q 10 10 35 25" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-12" cy="28" r="6" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M-18 25 L-8 22" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Ribs -->
    <path d="M5 24 L2 45 M15 28 L15 50 M25 29 L28 48" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- SECONDARY EXHIBIT: Fine Art Painting on Easel (Left Background) -->
  <g transform="translate(55, 110) scale(0.8)">
    <!-- Easel -->
    <line x1="20" y1="10" x2="5" y2="80" stroke="#64748b" stroke-width="2"/>
    <line x1="20" y1="10" x2="35" y2="80" stroke="#64748b" stroke-width="2"/>
    <line x1="20" y1="10" x2="20" y2="85" stroke="#64748b" stroke-width="2"/>
    <horizontal-bar>
      <line x1="5" y1="50" x2="35" y2="50" stroke="#64748b" stroke-width="3"/>
    </horizontal-bar>
    <!-- Framed Canvas -->
    <rect x="-2" y="20" width="44" height="34" fill="#334155" rx="1"/>
    <rect x="1" y="23" width="38" height="28" fill="#1e293b"/>
    <!-- Abstract landscape art inside -->
    <path d="M1 40 Q 10 25 20 35 T 39 30 L 39 51 L 1 51 Z" fill="#10b981" opacity="0.6"/>
    <circle cx="30" cy="28" r="4" fill="#fb923c"/>
  </g>

  <!-- FOREGROUND VISITORS (Two curious museum-goers silhouettes/characters) -->
  <!-- Character 1 (Adult pointing at artifact) -->
  <g transform="translate(85, 150)">
    <!-- Body / Jacket -->
    <path d="M10 25 L22 55 L5 55 Z" fill="#38bdf8"/>
    <path d="M8 22 L20 22 L24 40 L4 40 Z" fill="#0284c7" rx="2"/>
    <!-- Head -->
    <circle cx="14" cy="12" r="7" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M7 10 C8 5 20 5 21 10 C18 7 10 7 7 10 Z" fill="#334155"/>
    <!-- Arm pointing -->
    <path d="M20 25 L32 20" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="10" y1="55" x2="8" y2="85" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="55" x2="20" y2="85" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Child looking up with wonder, holding a small guidebook) -->
  <g transform="translate(145, 160)">
    <!-- Body -->
    <path d="M12 20 L22 50 L4 50 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="13" cy="10" r="6" fill="#fde68a"/>
    <!-- Hair / Pigtails -->
    <circle cx="7" cy="8" r="3" fill="#334155"/>
    <circle cx="19" cy="8" r="3" fill="#334155"/>
    <!-- Guidebook prop -->
    <rect x="18" y="30" width="8" height="10" fill="#ffffff" rx="1" transform="rotate(15 18 30)"/>
    <line x1="20" y1="32" x2="24" y2="32" stroke="#ec4899" stroke-width="1"/>
    <line x1="20" y1="35" x2="24" y2="35" stroke="#38bdf8" stroke-width="1"/>
    <!-- Legs -->
    <line x1="9" y1="50" x2="7" y2="75" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="17" y1="50" x2="19" y2="75" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ATMOSPHERIC LIGHTING / HIGHLIGHTS -->
  <!-- Ceiling lights / track lighting fixture -->
  <rect x="110" y="0" width="20" height="8" fill="#475569" rx="2"/>
  <circle cx="120" cy="10" r="4" fill="#fbbf24"/>

  <!-- Left wall sconce light -->
  <path d="M0 100 L15 95 L15 105 Z" fill="#fbbf24" opacity="0.3"/>
  <!-- Right wall sconce light -->
  <path d="M240 100 L225 95 L225 105 Z" fill="#fbbf24" opacity="0.3"/>

  <!-- Museum Information / Direction Signage (Abstract Minimalist Shapes on Wall, NO TEXT) -->
  <g transform="translate(185, 35)">
    <rect x="0" y="0" width="30" height="14" fill="#334155" rx="2" stroke="#64748b" stroke-width="1"/>
    <!-- Arrow icon -->
    <path d="M10 7 L20 7 M17 4 L20 7 L17 10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkles / Magic Learning Atmosphere -->
  <circle cx="95" cy="95" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="145" cy="85" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="130" cy="65" r="2.5" fill="#fde68a" opacity="0.7"/>
  <circle cx="80" cy="120" r="1.5" fill="#10b981" opacity="0.8"/>
</svg>