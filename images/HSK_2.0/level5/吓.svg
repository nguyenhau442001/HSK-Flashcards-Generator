<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Room Environment -->
  <rect x="20" y="140" width="200" height="100" fill="#0f172a" opacity="0.5"/>
  <circle cx="180" cy="60" r="30" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Victim (The one being scared) -->
  <g transform="translate(130, 100)">
    <path d="M20 100 L60 100 L50 60 L30 60 Z" fill="#38bdf8"/>
    <circle cx="40" cy="40" r="20" fill="#fde68a"/>
    <path d="M30 35 Q35 30 40 35 Q45 30 50 35" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M35 45 Q40 50 45 45" stroke="#1e293b" stroke-width="2" fill="none"/>
    <rect x="25" y="60" width="30" height="10" rx="2" fill="#38bdf8"/>
  </g>

  <!-- The Scaring Action (The prankster) -->
  <g transform="translate(40, 80)">
    <path d="M40 120 L80 120 L70 70 L50 70 Z" fill="#ec4899"/>
    <circle cx="60" cy="50" r="25" fill="#fde68a"/>
    <!-- Hands up in "Boo" gesture -->
    <path d="M30 40 L10 20 M90 40 L110 20" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="45" r="3" fill="#1e293b"/>
    <circle cx="70" cy="45" r="3" fill="#1e293b"/>
    <path d="M50 60 Q60 65 70 60" stroke="#1e293b" stroke-width="3" fill="none"/>
  </g>

  <!-- Props: Dropped popcorn/items -->
  <circle cx="140" cy="180" r="5" fill="#fbbf24"/>
  <circle cx="155" cy="190" r="4" fill="#fbbf24"/>
  <circle cx="130" cy="195" r="6" fill="#fbbf24"/>
  
  <!-- Action lines -->
  <path d="M110 70 Q120 60 130 70" stroke="#fb923c" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  <path d="M100 90 Q110 80 120 90" stroke="#fb923c" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
</svg>