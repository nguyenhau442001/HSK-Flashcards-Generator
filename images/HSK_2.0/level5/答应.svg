<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- Character A (The one asking) -->
  <g transform="translate(40, 60)">
    <circle cx="40" cy="40" r="25" fill="#fb923c"/>
    <path d="M25 70 Q40 90 55 70" stroke="#fb923c" stroke-width="6" fill="none"/>
    <rect x="25" y="65" width="30" height="80" rx="5" fill="#fb923c"/>
    <circle cx="32" cy="35" r="3" fill="#0f172a"/>
    <circle cx="48" cy="35" r="3" fill="#0f172a"/>
  </g>
  
  <!-- Character B (The one agreeing) -->
  <g transform="translate(140, 60)">
    <circle cx="40" cy="40" r="25" fill="#10b981"/>
    <path d="M25 70 Q40 90 55 70" stroke="#10b981" stroke-width="6" fill="none"/>
    <rect x="25" y="65" width="30" height="80" rx="5" fill="#10b981"/>
    <circle cx="32" cy="35" r="3" fill="#0f172a"/>
    <circle cx="48" cy="35" r="3" fill="#0f172a"/>
    <!-- The "Agreement" Gesture: Raised hand -->
    <path d="M60 50 L85 20" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <circle cx="85" cy="20" r="8" fill="#10b981"/>
  </g>

  <!-- Interaction Element: Golden Glow of Agreement -->
  <circle cx="120" cy="120" r="15" fill="#f59e0b" opacity="0.6">
    <animate attributeName="r" values="15;25;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Props: Clipboard on table -->
  <rect x="90" y="190" width="60" height="40" rx="2" fill="#e2e8f0"/>
  <line x1="100" y1="200" x2="140" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="100" y1="210" x2="140" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="120" cy="220" r="4" fill="#38bdf8"/>
</svg>