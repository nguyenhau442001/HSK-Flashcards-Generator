<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="blurSmoke" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Stars -->
  <circle cx="180" cy="40" r="1.5" fill="#fbbf24"/>
  <circle cx="210" cy="70" r="1" fill="#fbbf24"/>
  <circle cx="30" cy="100" r="1.2" fill="#fbbf24"/>
  <circle cx="60" cy="20" r="1.5" fill="#fbbf24"/>
  <circle cx="100" cy="80" r="1" fill="#fbbf24"/>
  <circle cx="200" cy="10" r="1.2" fill="#fbbf24"/>
  <circle cx="15" cy="50" r="1" fill="#fbbf24"/>
  <circle cx="120" cy="30" r="1.5" fill="#fbbf24"/>
  <circle cx="220" cy="120" r="1" fill="#fbbf24"/>
  <circle cx="40" cy="15" r="1.2" fill="#fbbf24"/>

  <!-- Rocket Body -->
  <path d="M120 5 L135 25 L135 160 L145 175 L145 185 L95 185 L95 175 L105 160 L105 25 Z" fill="#6a8eab"/>
  <!-- Rocket Nose Cone -->
  <path d="M120 5 L135 25 L105 25 Z" fill="#364f6b"/>
  <!-- Rocket Fins -->
  <path d="M105 160 L75 180 L95 185 L95 175 Z" fill="#364f6b"/>
  <path d="M135 160 L165 180 L145 185 L145 175 Z" fill="#364f6b"/>
  <!-- Rocket Window/Detail -->
  <circle cx="120" cy="50" r="6" fill="#38bdf8"/>
  <circle cx="120" cy="80" r="4" fill="#38bdf8"/>
  <rect x="115" y="110" width="10" height="20" fill="#364f6b" rx="2"/>

  <!-- Exhaust Flames (layered for intensity) -->
  <path d="M120 235 C105 210 95 190 100 185 L140 185 C145 190 135 210 120 235 Z" fill="#fbbf24"/> <!-- Brightest core -->
  <path d="M120 240 C95 225 75 195 100 180 L140 180 C165 195 145 225 120 240 Z" fill="#f59e0b"/> <!-- Mid layer -->
  <path d="M120 240 C75 230 55 200 85 175 L155 175 C185 200 165 230 120 240 Z" fill="#fb923c"/> <!-- Outer layer -->

  <!-- Smoke trails (blurred, more organic) -->
  <path d="M120 185 C80 190 60 210 50 230 C40 240 60 240 80 240 C100 240 110 230 120 220 C130 230 140 240 160 240 C180 240 200 230 190 230 C180 210 160 190 120 185 Z" fill="#a0aec0" opacity="0.2" filter="url(#blurSmoke)"/>
  
  <!-- Smaller smoke wisps -->
  <path d="M80 175 C70 165 60 150 55 140 C50 130 60 120 70 120 C80 120 90 130 95 140 C100 150 90 165 80 175 Z" fill="#a0aec0" opacity="0.15" filter="url(#blurSmoke)"/>
  <path d="M160 175 C170 165 180 150 185 140 C190 130 180 120 170 120 C160 120 150 130 145 140 C140 150 150 165 160 175 Z" fill="#a0aec0" opacity="0.15" filter="url(#blurSmoke)"/>
</svg>