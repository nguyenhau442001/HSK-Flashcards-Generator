<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Office Light Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>

    <!-- Confidential File Envelope Gradient -->
    <linearGradient id="fileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Background Lighting -->
  <circle cx="120" cy="100" r="90" fill="url(#amberGlow)" />

  <!-- Office Interior Background Elements -->
  <!-- Window Grid (Night City Vibe outside) -->
  <g opacity="0.4">
    <rect x="150" y="25" width="65" height="85" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <line x1="182" y1="25" x2="182" y2="110" stroke="#475569" stroke-width="1.5" />
    <line x1="150" y1="67" x2="215" y2="67" stroke="#475569" stroke-width="1.5" />
    <!-- City lights through window -->
    <rect x="158" y="35" width="8" height="12" fill="#fbbf24" opacity="0.8" rx="1" />
    <rect x="170" y="45" width="6" height="15" fill="#38bdf8" opacity="0.6" rx="1" />
    <rect x="195" y="33" width="12" height="10" fill="#f43f5e" opacity="0.7" rx="1" />
    <rect x="160" y="75" width="10" height="14" fill="#38bdf8" opacity="0.5" rx="1" />
    <rect x="190" y="80" width="8" height="18" fill="#fbbf24" opacity="0.9" rx="1" />
  </g>

  <!-- Bookshelf / Plant props -->
  <rect x="25" y="40" width="40" height="70" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="65" x2="65" y2="65" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="90" x2="65" y2="90" stroke="#334155" stroke-width="2" />
  <!-- Books -->
  <rect x="30" y="48" width="6" height="17" fill="#f43f5e" rx="1" />
  <rect x="38" y="45" width="8" height="20" fill="#38bdf8" rx="1" />
  <rect x="48" y="50" width="12" height="15" fill="#10b981" rx="1" />

  <!-- Office Desk -->
  <path d="M 20 185 L 220 185 L 205 155 L 35 155 Z" fill="#334155" filter="url(#shadow)" />
  <rect x="30" y="155" width="180" height="8" rx="2" fill="#475569" />

  <!-- Computer Monitor (Background) -->
  <rect x="110" y="75" width="75" height="55" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <rect x="115" y="80" width="65" height="40" rx="3" fill="url(#screenGrad)" />
  <!-- Abstract chart on screen -->
  <polyline points="122,110 135,98 148,105 165,88 173,92" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="165" cy="88" r="3" fill="#38bdf8" />
  <!-- Monitor Stand -->
  <path d="M 140 130 L 150 130 L 155 155 L 135 155 Z" fill="#475569" />
  <ellipse cx="145" cy="155" rx="18" ry="3" fill="#64748b" />

  <!-- Character 1: Leaning in, sharing secret (Left) -->
  <g id="character-speaker" filter="url(#shadow)">
    <!-- Body & Torso -->
    <path d="M 50 190 C 50 165 75 160 85 155 L 95 185 L 60 195 Z" fill="#0284c7" />
    <!-- Arm reaching across desk -->
    <path d="M 75 165 C 85 162 105 168 115 163" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="118" cy="162" r="6" fill="#fbcfe8" />

    <!-- Head & Hair -->
    <circle cx="70" cy="130" r="18" fill="#fbcfe8" />
    <!-- Hair Style (Dark, sleek) -->
    <path d="M 54 130 C 54 116 65 110 78 112 C 86 113 88 122 88 130 C 85 124 75 120 65 124 Z" fill="#0f172a" />
    
    <!-- Expressive Face (whispering/smiling conspiratorially) -->
    <!-- Eye winking / looking -->
    <path d="M 72 128 C 74 130 78 130 80 128" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Playful smile -->
    <path d="M 74 137 C 77 139 81 137 83 134" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
    <!-- Rosy Cheek -->
    <circle cx="82" cy="133" r="3" fill="#fda4af" opacity="0.6" />
  </g>

  <!-- Character 2: Shocked/Intrigued Listener (Right/Center) -->
  <g id="character-listener" filter="url(#shadow)">
    <!-- Body & Torso -->
    <path d="M 155 195 C 155 170 135 160 120 155 L 110 195 Z" fill="#10b981" />
    
    <!-- Hands holding face in surprise -->
    <circle cx="128" cy="142" r="5" fill="#fbcfe8" />
    <circle cx="148" cy="144" r="5" fill="#fbcfe8" />

    <!-- Head & Hair -->
    <circle cx="140" cy="135" r="19" fill="#fbcfe8" />
    <!-- Hair (Amber/Brown bob) -->
    <path d="M 124 135 C 122 118 135 112 152 116 C 160 118 160 132 158 145 C 155 135 150 125 140 125 C 130 125 126 130 124 135 Z" fill="#b45309" />

    <!-- Expressive Face (Wide eyes, open mouth 'O' of surprise) -->
    <!-- Eyes wide open -->
    <circle cx="135" cy="133" r="3" fill="#0f172a" />
    <circle cx="147" cy="134" r="3" fill="#0f172a" />
    <!-- Eyebrows raised high -->
    <path d="M 131 126 C 134 124 138 125 140 127" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 143 127 C 146 125 150 124 153 126" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <!-- Surprised open mouth -->
    <ellipse cx="141" cy="143" rx="4" ry="5" fill="#7f1d1d" />
  </g>

  <!-- CENTRAL PROP: The Confidential Internal Document ("内部消息") -->
  <g id="confidential-file" filter="url(#shadow)" transform="translate(100, 140) rotate(-12)">
    <!-- File Folder -->
    <rect x="0" y="0" width="44" height="32" rx="3" fill="url(#fileGrad)" stroke="#b45309" stroke-width="1.5" />
    <path d="M 0 6 L 14 6 L 18 10 L 44 10" fill="none" stroke="#b45309" stroke-width="1.5" />
    
    <!-- Confidential Stamp / Seal Graphic (Abstract visual cues for 'Internal/Secret') -->
    <rect x="8" y="12" width="14" height="4" rx="1" fill="#ef4444" opacity="0.8" />
    <rect x="8" y="18" width="22" height="3" rx="1" fill="#334155" opacity="0.6" />
    <rect x="8" y="23" width="16" height="3" rx="1" fill="#334155" opacity="0.6" />

    <!-- Glowing Alert Badge / Indicator (Vector style, no letters) -->
    <circle cx="34" cy="20" r="6" fill="#ef4444" />
    <path d="M 34 17 L 34 21 M 34 23.5 L 34 24.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Floating Sparkles / Hush / Secret atmosphere accents -->
  <g opacity="0.8">
    <path d="M 95 115 Q 98 105 105 108 Q 98 111 95 115 Z" fill="#fbbf24" />
    <path d="M 115 95 Q 118 88 124 91 Q 118 94 115 95 Z" fill="#38bdf8" />
    <circle cx="120" cy="115" r="1.5" fill="#f43f5e" />
    <circle cx="90" cy="135" r="2" fill="#fbbf24" />
  </g>
</svg>