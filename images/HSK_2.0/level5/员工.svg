<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Desk Surface -->
    <rect x="0" y="100" width="160" height="15" rx="4" fill="#334155"/>
    <rect x="10" y="115" width="5" height="40" fill="#475569"/>
    <rect x="145" y="115" width="5" height="40" fill="#475569"/>
    
    <!-- Laptop -->
    <rect x="30" y="60" width="100" height="60" rx="4" fill="#64748b"/>
    <rect x="35" y="65" width="90" height="45" rx="2" fill="#bae6fd"/>
    <rect x="25" y="120" width="110" height="10" rx="2" fill="#475569"/>
    
    <!-- Employee Character -->
    <circle cx="80" cy="30" r="25" fill="#fde68a"/>
    <path d="M65 30 Q 80 45 95 30" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="25" r="3" fill="#1e293b"/>
    <circle cx="90" cy="25" r="3" fill="#1e293b"/>
    
    <!-- Torso/Shirt -->
    <path d="M55 55 L 105 55 L 115 110 L 45 110 Z" fill="#38bdf8"/>
    
    <!-- Coffee Mug -->
    <circle cx="130" cy="100" r="12" fill="#fb923c"/>
    <rect x="140" y="95" width="8" height="10" rx="2" fill="#fb923c"/>
    
    <!-- Floating Data/Work Elements -->
    <rect x="150" y="30" width="20" height="20" rx="4" fill="#10b981"/>
    <rect x="160" y="10" width="20" height="20" rx="4" fill="#ec4899"/>
    <circle cx="20" cy="20" r="8" fill="#fbbf24"/>
