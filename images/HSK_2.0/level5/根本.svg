<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Amber Core Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Lens Glass Gradient -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Drafting Grid / Ambient Depth) -->
  <g opacity="0.15">
    <line x1="0" y1="60" x2="240" y2="60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="120" x2="240" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="60" y1="0" x2="60" y2="240" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="180" y1="0" x2="180" y2="240" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Workbench / Surface Base -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#tableGrad)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="3"/>

  <!-- Context Prop: Blueprint / Underlying Schematic Layout -->
  <g transform="translate(45, 105) rotate(-12)" filter="url(#softShadow)" opacity="0.85">
    <rect x="0" y="0" width="85" height="65" rx="4" fill="#0284c7"/>
    <rect x="6" y="6" width="73" height="53" rx="2" fill="#0369a1"/>
    <!-- Schematic lines representing foundation/structure -->
    <line x1="15" y1="20" x2="40" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="32" x2="65" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="44" x2="50" y2="44" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="20" r="4" fill="#38bdf8"/>
  </g>

  <!-- Context Prop: Structural Wooden Blocks (The Foundation) -->
  <g transform="translate(25, 130)" filter="url(#softShadow)">
    <!-- Base block side -->
    <path d="M 0 25 L 45 10 L 45 35 L 0 50 Z" fill="#b45309"/>
    <!-- Base block front -->
    <path d="M 45 10 L 90 25 L 90 50 L 45 35 Z" fill="#d97706"/>
    <!-- Base block top -->
    <path d="M 0 25 L 45 10 L 90 25 L 45 40 Z" fill="#fbbf24"/>
  </g>

  <!-- MAIN SUBJECT: The Root / Deep Foundation Mechanism (Representing '根本' - root, fundamental basis) -->
  <g transform="translate(120, 115)" filter="url(#softShadow)">
    
    <!-- Ambient Energy Glow behind the root -->
    <circle cx="0" cy="15" r="45" fill="url(#coreGlow)"/>

    <!-- Interlocking Root-System / Core Foundation Nodes -->
    <!-- Deep Root Tendrils (Glowing Amber & Emerald accents) -->
    <path d="M -15 25 C -45 35, -55 60, -75 75" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 15 25 C 45 35, 60 55, 75 70" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <path d="M 0 30 C 0 55, -20 70, -35 85" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <path d="M 5 30 C 20 60, 35 75, 50 82" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

    <!-- Central Core Node (The "Root Cause / Fundamental" Anchor) -->
    <circle cx="0" cy="10" r="28" fill="#1e293b" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="0" cy="10" r="18" fill="#b45309"/>
    <circle cx="0" cy="10" r="8" fill="#fbbf24"/>

    <!-- Radiating Energy Sparks / Vital Nodes -->
    <circle cx="-50" cy="65" r="4" fill="#38bdf8"/>
    <circle cx="55" cy="60" r="5" fill="#ec4899"/>
    <circle cx="-25" cy="75" r="3" fill="#fbbf24"/>
    <circle cx="35" cy="78" r="4" fill="#10b981"/>

  </g>

  <!-- Action Element / Magnifying Glass Inspecting the Deep Core (Focus on 'Căn bản' / Fundamental) -->
  <g transform="translate(145, 65) rotate(15)" filter="url(#softShadow)">
    <!-- Glass Lens Reflection & Area -->
    <circle cx="0" cy="0" r="32" fill="url(#lensGlass)" stroke="#f8fafc" stroke-width="5"/>
    <!-- Highlight on lens -->
    <path d="M -18 -12 C -10 -22, 10 -22, 18 -12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Magnifying Glass Handle -->
    <rect x="-8" y="28" width="16" height="45" rx="8" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
    <rect x="-4" y="32" width="4" height="37" rx="2" fill="#fdba74" opacity="0.6"/>
  </g>

  <!-- Additional Contextual Science/Design Props on the Table -->
  <!-- Small Gear / Mechanism representing structural interconnection -->
  <g transform="translate(200, 150)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="14" fill="#64748b" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#1e293b"/>
  </g>

  <!-- Dynamic Sparkle/Action Accents for vibrancy -->
  <path d="M 30 75 L 34 65 L 44 61 L 34 57 L 30 47 L 26 57 L 16 61 L 26 65 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 195 45 L 198 38 L 205 35 L 198 32 L 195 25 L 192 32 L 185 35 L 192 38 Z" fill="#38bdf8" opacity="0.9"/>
  <path d="M 95 35 L 97 30 L 102 28 L 97 26 L 95 21 L 93 26 L 88 28 L 93 30 Z" fill="#ec4899" opacity="0.8"/>

</svg>