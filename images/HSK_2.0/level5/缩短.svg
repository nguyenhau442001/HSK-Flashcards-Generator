<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Glow -->
    <radialGradient id="deskLight" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Clock Glow (Highlighting reduction of time) -->
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Path for Window -->
    <clipPath id="windowClip">
      <path d="M 170 30 L 210 30 L 210 90 L 170 90 Z" />
    </clipPath>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#deskLight)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall & Interior -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2" />
  
  <!-- Window showing sunset / time passing -->
  <rect x="170" y="30" width="40" height="60" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <path d="M 190 30 L 190 90 M 170 60 L 210 60" stroke="#475569" stroke-width="2" />
  <!-- Sunset orb -->
  <circle cx="190" cy="75" r="12" fill="#fb923c" opacity="0.8" />

  <!-- Office Shelf with books/props -->
  <rect x="25" y="45" width="60" height="6" rx="2" fill="#475569" />
  <rect x="35" y="27" width="10" height="18" rx="2" fill="#38bdf8" />
  <rect x="47" y="22" width="12" height="23" rx="2" fill="#ec4899" />
  <rect x="61" y="30" width="8" height="15" rx="2" fill="#10b981" />

  <!-- BIG WALL CLOCK (Focus: Rushing / Shortening Time) -->
  <circle cx="120" cy="55" r="26" fill="#0f172a" stroke="#f59e0b" stroke-width="4" />
  <circle cx="120" cy="55" r="24" fill="url(#clockGlow)" />
  <!-- Clock hands showing quick movement/deadline -->
  <line x1="120" y1="55" x2="132" y2="45" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <line x1="120" y1="55" x2="110" y2="40" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <!-- Speed lines around clock -->
  <path d="M 88 40 Q 92 36 96 38" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 152 40 Q 148 36 144 38" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- DESK & FURNITURE -->
  <rect x="20" y="160" width="200" height="12" rx="4" fill="#334155" />
  <rect x="40" y="172" width="14" height="48" fill="#1e293b" />
  <rect x="186" y="172" width="14" height="48" fill="#1e293b" />

  <!-- DESK PROPS -->
  <!-- Laptop -->
  <path d="M 75 160 L 115 160 L 122 142 L 68 142 Z" fill="#64748b" />
  <rect x="65" y="159" width="60" height="3" rx="1.5" fill="#94a3b8" />
  <!-- Laptop screen glow -->
  <path d="M 72 144 L 118 144 L 115 110 L 75 110 Z" fill="#1e293b" />
  <path d="M 77 138 L 113 138 L 111 114 L 79 114 Z" fill="#38bdf8" opacity="0.8" />
  <!-- Chart lines on screen representing time/deadline -->
  <path d="M 83 130 L 91 124 L 99 128 L 107 118" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Coffee Mug -->
  <rect x="135" y="142" width="14" height="18" rx="3" fill="#cbd5e1" />
  <path d="M 149 146 C 154 146 154 156 149 156" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <!-- Steam lines -->
  <path d="M 139 133 Q 142 128 139 123" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M 143 135 Q 146 130 143 125" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- MAIN CHARACTER: Stressed/Focused Professional trying to shorten time -->
  <!-- Torso & Shoulders -->
  <path d="M 70 220 C 70 190 90 180 110 180 C 130 180 150 190 150 220 Z" fill="#3b82f6" />
  <!-- Collar / Shirt details -->
  <path d="M 95 180 L 110 198 L 125 180" fill="#ffffff" />
  <path d="M 103 186 L 110 205 L 117 186" fill="#ef4444" /> <!-- Tie -->

  <!-- Neck -->
  <rect x="102" y="165" width="16" height="20" fill="#fbcfe8" />

  <!-- Head -->
  <circle cx="110" cy="148" r="22" fill="#fbcfe8" />
  <!-- Hair (Neat modern style) -->
  <path d="M 89 145 C 88 130 100 125 112 125 C 128 125 133 138 132 152 C 130 152 131 140 120 135 C 110 130 95 135 89 145 Z" fill="#1e293b" />

  <!-- Face Features (Determined / Action expression) -->
  <!-- Eyebrows angled down for focus/urgency -->
  <path d="M 97 143 L 105 146" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 115 146 L 123 143" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Eyes -->
  <circle cx="101" cy="150" r="2" fill="#1e293b" />
  <circle cx="119" cy="150" r="2" fill="#1e293b" />
  <!-- Determined Mouth -->
  <path d="M 107 160 Q 110 158 113 160" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Sweat drop (representing pressure to shorten time) -->
  <path d="M 128 142 C 132 142 132 148 128 148 C 124 148 124 142 128 142 Z" fill="#38bdf8" />

  <!-- ARMS & GESTURE (Directing/Cutting down time) -->
  <!-- Left arm resting -->
  <path d="M 75 190 L 65 210 L 80 215" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Right arm gesturing command/action (cutting time short) -->
  <path d="M 145 190 L 165 170 L 180 180" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="180" cy="180" r="6" fill="#fbcfe8" /> <!-- Right Hand -->

  <!-- VISUAL METAPHOR FOR "SHORTENING TIME" (缩短) -->
  <!-- Dynamic sliding/reducing arrow cutting across the scene -->
  <g transform="translate(140, 95)">
    <!-- Long faded bar representing original long time -->
    <rect x="-60" y="0" width="80" height="6" rx="3" fill="#64748b" opacity="0.4" />
    <line x1="-60" y1="3" x2="20" y2="3" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="2" />
    
    <!-- Compressed short active bar -->
    <rect x="-20" y="14" width="40" height="8" rx="4" fill="#10b981" />
    <path d="M 22 18 L 30 18 M 27 14 L 31 18 L 27 22" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Scissor/Cut indicator slashing from long to short -->
    <path d="M 5 -5 L -5 25" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <circle cx="5" cy="-7" r="3" fill="#f59e0b" />
    <circle cx="-5" cy="27" r="3" fill="#f59e0b" />
  </g>

</svg>