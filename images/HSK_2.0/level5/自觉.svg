<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Night Window (Context: Working late/independently) -->
  <rect x="160" y="40" width="50" height="70" rx="4" fill="#1e293b"/>
  <circle cx="175" cy="55" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="195" cy="65" r="1" fill="#94a3b8" opacity="0.4"/>
  <circle cx="185" cy="85" r="1.2" fill="#94a3b8" opacity="0.5"/>

  <!-- Desk -->
  <rect x="20" y="185" width="200" height="8" rx="2" fill="#334155"/>
  
  <!-- The Character (Conscientious Worker) -->
  <!-- Chair -->
  <path d="M60 185 L55 140 Q55 130 65 130 L85 130" stroke="#1e293b" stroke-width="6" fill="none"/>
  
  <!-- Body -->
  <path d="M85 185 Q80 140 95 125 Q110 110 125 125" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="115" cy="100" r="12" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M103 100 Q103 88 115 88 Q127 88 127 100 L127 95 Q127 85 115 85 Q103 85 103 95 Z" fill="#475569"/>
  <!-- Focused Eye -->
  <line x1="118" y1="100" x2="123" y2="100" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Arms and Hands (Typing) -->
  <path d="M100 135 Q125 135 140 155" stroke="#38bdf8" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M140 155 L150 155" stroke="#fcd34d" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Laptop -->
  <path d="M155 160 L195 160 L205 185 L145 185 Z" fill="#94a3b8"/>
  <rect x="155" y="135" width="40" height="25" rx="2" fill="#cbd5e1"/>
  <rect x="160" y="140" width="30" height="15" fill="#38bdf8" opacity="0.3"/>

  <!-- Desk Lamp (Source of Focus) -->
  <path d="M200 185 L200 140 L180 130" stroke="#475569" stroke-width="3" fill="none"/>
  <path d="M170 120 L195 140 L185 150 L160 130 Z" fill="#475569"/>
  
  <!-- Light Beam (Visualizing the "Bubble" of self-initiative) -->
  <path d="M172 138 L130 185 L210 185 L188 148 Z" fill="url(#lampGlow)" opacity="0.4"/>
  
  <!-- Props: Coffee and Checklist -->
  <!-- Steaming Coffee -->
  <rect x="40" y="175" width="12" height="10" rx="2" fill="#ec4899"/>
  <path d="M42 170 Q44 165 46 170" stroke="#94a3b8" stroke-width="1" fill="none"/>
  <path d="M47 168 Q49 163 51 168" stroke="#94a3b8" stroke-width="1" fill="none"/>
  
  <!-- Checklist (Self-management) -->
  <rect x="70" y="170" width="15" height="15" fill="#f8fafc"/>
  <path d="M73 174 L75 176 L78 172" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <path d="M73 180 L75 182 L78 178" stroke="#10b981" stroke-width="1.5" fill="none"/>

  <!-- Wall Clock (Context: Working late/early by choice) -->
  <circle cx="40" cy="60" r="15" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="40" y1="60" x2="40" y2="52" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="60" x2="48" y2="60" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>