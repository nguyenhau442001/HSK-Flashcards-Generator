<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Teapot Body Gradient (Ceramic Teal/Jade) -->
    <linearGradient id="pot-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- Teapot Lid & Accents (Warm Gold/Copper) -->
    <linearGradient id="gold-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steam-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Cup Gradient -->
    <linearGradient id="cup-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    
    <!-- Tea Liquid Gradient -->
    <linearGradient id="tea-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements (Warm ambient lighting) -->
  <circle cx="120" cy="110" r="80" fill="#0284c7" opacity="0.08" filter="blur(20px)" />
  <circle cx="160" cy="90" r="50" fill="#f59e0b" opacity="0.06" filter="blur(15px)" />

  <!-- Wooden/Slate Table Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#table-grad)" />
  <!-- Table Edge highlight -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" />

  <!-- Bamboo Mat / Coaster -->
  <ellipse cx="120" cy="180" rx="75" ry="16" fill="#0f172a" opacity="0.5" />
  <ellipse cx="120" cy="176" rx="72" ry="14" fill="#334155" />
  <ellipse cx="120" cy="175" rx="68" ry="12" fill="#475569" />

  <!-- Teacup 1 (Left background) -->
  <g transform="translate(60, 150)">
    <!-- Cup Shadow -->
    <ellipse cx="0" cy="12" rx="12" ry="4" fill="#0f172a" opacity="0.6" />
    <!-- Cup Handle -->
    <path d="M -10 -2 C -18 -2 -18 8 -10 8" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <!-- Cup Body -->
    <path d="M -10 -6 L 10 -6 L 8 10 C 8 10 -8 10 -10 -6 Z" fill="url(#cup-grad)" filter="url(#shadow)" />
    <!-- Tea Inside -->
    <ellipse cx="0" cy="-6" rx="9" ry="3" fill="url(#tea-liquid)" />
  </g>

  <!-- Teacup 2 (Right foreground with pouring steam/action) -->
  <g transform="translate(180, 155)">
    <!-- Cup Shadow -->
    <ellipse cx="0" cy="12" rx="14" ry="4" fill="#0f172a" opacity="0.6" />
    <!-- Cup Handle -->
    <path d="M 10 -2 C 18 -2 18 8 10 8" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" />
    <!-- Cup Body -->
    <path d="M -11 -6 L 11 -6 L 9 11 C 9 11 -9 11 -11 -6 Z" fill="url(#cup-grad)" filter="url(#shadow)" />
    <!-- Tea Inside -->
    <ellipse cx="-1" cy="-6" rx="9.5" ry="3.5" fill="url(#tea-liquid)" />
  </g>

  <!-- MAIN SUBJECT: The Teapot (Cái bình, ấm) -->
  <g id="teapot" filter="url(#shadow)">
    <!-- Teapot Base Shadow -->
    <ellipse cx="120" cy="174" rx="35" ry="8" fill="#0f172a" opacity="0.7" />

    <!-- Back Handle (Isometric depth) -->
    <path d="M 60 115 C 35 115 30 145 55 160" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round" />

    <!-- Teapot Body (Round Ceramic Pot) -->
    <circle cx="120" cy="135" r="38" fill="url(#pot-body)" />
    
    <!-- Body Highlight for 3D glossy effect -->
    <path d="M 100 110 C 110 102 130 102 140 110 C 135 118 105 118 100 110 Z" fill="#ffffff" opacity="0.25" />
    <path d="M 98 125 C 95 135 98 150 105 158 C 101 148 101 135 105 125 Z" fill="#ffffff" opacity="0.15" />

    <!-- Teapot Spout (Curved, elegant) -->
    <path d="M 150 125 C 175 120 185 105 195 95" fill="none" stroke="url(#pot-body)" stroke-width="10" stroke-linecap="round" />
    <!-- Spout Opening & Highlight -->
    <path d="M 191 92 C 193 90 197 93 195 96" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" />

    <!-- Teapot Main Handle -->
    <path d="M 65 118 C 42 118 38 142 60 158" fill="none" stroke="url(#gold-accent)" stroke-width="8" stroke-linecap="round" />
    <path d="M 64 120 C 45 120 41 140 60 155" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Teapot Lid Base -->
    <path d="M 100 104 L 140 104 L 135 97 L 105 97 Z" fill="url(#pot-body)" />
    
    <!-- Teapot Lid Dome -->
    <ellipse cx="120" cy="97" rx="18" ry="7" fill="url(#pot-body)" />
    <ellipse cx="120" cy="95" rx="16" ry="5" fill="#2dd4bf" opacity="0.5" />

    <!-- Teapot Lid Knob (Golden Finial) -->
    <circle cx="120" cy="87" r="5" fill="url(#gold-accent)" />
    <circle cx="119" cy="86" r="2" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Action Elements: Steam rising from the teapot and cup -->
  <g id="steam">
    <!-- Steam from Teapot Spout -->
    <path d="M 195 90 Q 198 75 192 60 Q 186 45 194 30" fill="none" stroke="url(#steam-grad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Steam from Teapot Lid (tiny vent) -->
    <path d="M 120 80 Q 125 70 118 60 Q 112 50 120 40" fill="none" stroke="url(#steam-grad)" stroke-width="3" stroke-linecap="round" />

    <!-- Steam swirls over foreground cup -->
    <path d="M 180 140 Q 185 125 178 115 Q 172 105 180 95" fill="none" stroke="url(#steam-grad)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Ambient Sparkles / Magic Learning App Polish -->
  <g fill="#fde047">
    <!-- Sparkle 1 -->
    <path d="M 155 75 L 157 82 L 164 84 L 157 86 L 155 93 L 153 86 L 146 84 L 153 82 Z" opacity="0.8" transform="scale(0.7) translate(80, 20)" />
    <!-- Sparkle 2 -->
    <path d="M 85 95 L 86.5 100 L 91.5 101.5 L 86.5 103 L 85 108 L 83.5 103 L 78.5 101.5 L 83.5 100 Z" opacity="0.6" transform="scale(0.5) translate(40, -10)" />
    <!-- Tiny glowing dots -->
    <circle cx="138" cy="65" r="2" fill="#38bdf8" opacity="0.8" />
    <circle cx="170" cy="115" r="1.5" fill="#f43f5e" opacity="0.7" />
    <circle cx="75" cy="135" r="2" fill="#fbbf24" opacity="0.9" />
  </g>

</svg>