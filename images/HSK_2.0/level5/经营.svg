<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Shop Lighting Gradient -->
    <radialGradient id="shop-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Window/Glass Glare -->
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Shop Lighting Overlay -->
  <circle cx="120" cy="110" r="110" fill="url(#shop-glow)" />

  <!-- SHOP INTERIOR & STRUCTURE -->
  <!-- Back Wall -->
  <rect x="25" y="40" width="190" height="125" rx="4" fill="#334155" />
  
  <!-- Shelving Unit (Left) -->
  <rect x="35" y="55" width="40" height="95" fill="#1e293b" rx="2" />
  <rect x="35" y="75" width="40" height="4" fill="#475569" />
  <rect x="35" y="95" width="40" height="4" fill="#475569" />
  <rect x="35" y="115" width="40" height="4" fill="#475569" />
  
  <!-- Products on Left Shelves -->
  <circle cx="48" cy="67" r="6" fill="#ec4899" />
  <rect x="58" y="62" width="10" height="13" rx="2" fill="#38bdf8" />
  <rect x="42" y="83" width="12" height="12" rx="2" fill="#10b981" />
  <circle cx="63" cy="89" r="5" fill="#fb923c" />
  <rect x="42" y="103" width="26" height="12" rx="2" fill="#fbbf24" />

  <!-- Shelving Unit (Right) -->
  <rect x="165" y="55" width="40" height="95" fill="#1e293b" rx="2" />
  <rect x="165" y="75" width="40" height="4" fill="#475569" />
  <rect x="165" y="95" width="40" height="4" fill="#475569" />
  <rect x="165" y="115" width="40" height="4" fill="#475569" />

  <!-- Products on Right Shelves -->
  <rect x="172" y="61" width="10" height="14" rx="2" fill="#f43f5e" />
  <circle cx="190" cy="68" r="6" fill="#a855f7" />
  <circle cx="177" cy="89" r="6" fill="#38bdf8" />
  <rect x="187" y="82" width="12" height="13" rx="2" fill="#10b981" />
  <rect x="172" y="102" width="26" height="13" rx="2" fill="#fb923c" />

  <!-- Ceiling Hanging Lamp -->
  <line x1="120" y1="40" x2="120" y2="70" stroke="#1e293b" stroke-width="3" />
  <path d="M 105 70 L 135 70 L 140 82 L 100 82 Z" fill="#64748b" />
  <ellipse cx="120" cy="82" rx="20" ry="8" fill="#fbbf24" filter="url(#soft-shadow)" />

  <!-- Counter / Desk (Foreground) -->
  <path d="M 30 140 L 210 140 L 220 200 L 20 200 Z" fill="#475569" filter="url(#soft-shadow)" />
  <rect x="25" y="133" width="190" height="12" rx="3" fill="#64748b" />
  <rect x="45" y="145" width="150" height="55" fill="#334155" />

  <!-- Store Owner Character (Managing/Smiling) -->
  <!-- Body / Apron -->
  <path d="M 95 140 C 95 125 145 125 145 140 L 155 190 C 155 195 85 195 85 190 Z" fill="#0284c7" />
  <!-- White Apron -->
  <path d="M 105 145 L 135 145 L 142 195 L 98 195 Z" fill="#f8fafc" />
  <path d="M 115 145 L 115 175 L 125 175 L 125 145 Z" fill="#e2e8f0" />

  <!-- Head & Neck -->
  <rect x="112" y="112" width="16" height="16" rx="6" fill="#fcd34d" />
  <circle cx="120" cy="110" r="18" fill="#fcd34d" />
  
  <!-- Hair -->
  <path d="M 102 105 C 102 95 138 95 138 105 C 138 112 135 110 130 108 C 125 106 115 106 110 108 C 105 110 102 112 102 105 Z" fill="#1e293b" />

  <!-- Face Details (Friendly expression) -->
  <circle cx="114" cy="110" r="2" fill="#1e293b" />
  <circle cx="126" cy="110" r="2" fill="#1e293b" />
  <path d="M 118 115 Q 120 118 122 115" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="110" cy="113" r="3" fill="#f43f5e" opacity="0.4" />
  <circle cx="130" cy="113" r="3" fill="#f43f5e" opacity="0.4" />

  <!-- Arms / Gestures (Welcoming/Working) -->
  <!-- Left arm leaning on counter -->
  <path d="M 98 135 L 75 145 L 85 150" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="83" cy="151" r="5" fill="#fcd34d" />
  <!-- Right arm holding a cute clipboard/tablet -->
  <path d="M 142 135 L 160 150 L 150 160" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="148" cy="161" r="5" fill="#fcd34d" />

  <!-- Counter Props -->
  <!-- Cash Register / POS -->
  <rect x="60" y="125" width="24" height="18" rx="3" fill="#e2e8f0" />
  <rect x="63" y="127" width="18" height="8" rx="1" fill="#0f172a" />
  <rect x="63" y="137" width="18" height="4" rx="1" fill="#cbd5e1" />
  <!-- Cute Plant on Counter -->
  <path d="M 185 130 C 185 124 195 124 195 130 Z" fill="#f43f5e" />
  <circle cx="190" cy="120" r="6" fill="#10b981" />
  <circle cx="185" cy="124" r="5" fill="#34d399" />
  <circle cx="195" cy="124" r="5" fill="#34d399" />

  <!-- Clipboard / Managing Device on Counter -->
  <rect x="135" y="132" width="16" height="12" rx="2" fill="#cbd5e1" transform="rotate(-15 143 138)" />
  <rect x="139" y="130" width="8" height="3" rx="1" fill="#475569" transform="rotate(-15 143 138)" />
  <line x1="138" y1="137" x2="146" y2="137" stroke="#334155" stroke-width="1.5" stroke-linecap="round" transform="rotate(-15 143 138)" />
  <line x1="138" y1="140" x2="144" y2="140" stroke="#334155" stroke-width="1.5" stroke-linecap="round" transform="rotate(-15 143 138)" />

  <!-- Storefront Glass Frame & Door Elements -->
  <!-- Top Glass Beam / Window Frame -->
  <rect x="15" y="25" width="210" height="190" rx="10" fill="none" stroke="#475569" stroke-width="6" />
  <!-- Glass Glare Effects -->
  <path d="M 25 25 L 110 25 L 25 110 Z" fill="url(#glass-glare)" />
  <path d="M 215 130 L 215 215 L 130 215 Z" fill="url(#glass-glare)" />

</svg>