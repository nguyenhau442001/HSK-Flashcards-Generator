<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Stamp Red Gradient -->
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient lighting from top-right -->
  <circle cx="200" cy="40" r="80" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />
  <!-- Accent warm light on certification/stamp area -->
  <circle cx="120" cy="120" r="70" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Background Environment / Office Elements -->
  <!-- Bookshelf / Wall grid lines -->
  <path d="M40 30 H200" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  
  <!-- Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <path d="M 0 170 L 240 170" stroke="#475569" stroke-width="2" />

  <!-- Background potted plant for authentic environment -->
  <path d="M195 170 L205 130 H215 L225 170 Z" fill="#64748b" opacity="0.8" />
  <circle cx="210" cy="120" r="16" fill="#10b981" opacity="0.8" />
  <circle cx="202" cy="112" r="10" fill="#34d399" opacity="0.7" />
  <circle cx="218" cy="115" r="12" fill="#059669" opacity="0.8" />

  <!-- Coffee Mug -->
  <rect x="30" y="140" width="22" height="28" rx="4" fill="#cbd5e1" />
  <path d="M52 146 C 60 146, 60 160, 52 160" stroke="#cbd5e1" stroke-width="3" fill="none" />
  <!-- Steam from mug -->
  <path d="M38 132 Q 42 124, 38 116" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M46 130 Q 50 122, 46 114" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4" />

  <!-- Main Subject: Official Legal Document / Contract on Desk (Angled) -->
  <g transform="rotate(-6 120 140)">
    <!-- Shadow for document -->
    <polygon points="72,82 172,62 192,162 92,182" fill="#020617" opacity="0.5" filter="url(#glow)" />
    
    <!-- Document Base -->
    <polygon points="70,80 170,60 190,160 90,180" fill="#f8fafc" />
    
    <!-- Document Header Accent -->
    <polygon points="70,80 170,60 170,75 70,95" fill="#38bdf8" opacity="0.2" />

    <!-- Mock text lines on document -->
    <rect x="85" y="95" width="50" height="6" rx="3" fill="#cbd5e1" />
    <rect x="83" y="110" width="80" height="4" rx="2" fill="#e2e8f0" />
    <rect x="81" y="120" width="70" height="4" rx="2" fill="#e2e8f0" />
    <rect x="79" y="130" width="85" height="4" rx="2" fill="#e2e8f0" />
    <rect x="77" y="140" width="60" height="4" rx="2" fill="#e2e8f0" />

    <!-- Ribbon / Gold Seal (Notary ribbon) -->
    <path d="M155 145 L 170 175 L 162 180 L 150 150 Z" fill="#f59e0b" />
    <path d="M145 150 L 155 185 L 148 190 L 138 155 Z" fill="#d97706" />
    <circle cx="150" cy="148" r="12" fill="#fbbf24" />
    <circle cx="150" cy="148" r="8" fill="#f59e0b" />
  </g>

  <!-- Action Element: Official Approval Stamp (Hovering / Impacting) -->
  <g transform="translate(140, 75) rotate(-12)">
    <!-- Stamp Handle/Body -->
    <!-- Metallic/Wooden handle gradient -->
    <ellipse cx="0" cy="-35" rx="14" ry="6" fill="#f59e0b" />
    <path d="M-14 -35 C-14 -20 -6 -15 -4 -5 L4 -5 C6 -15 14 -20 14 -35 Z" fill="#d97706" />
    <ellipse cx="0" cy="-5" rx="4" ry="2" fill="#b45309" />
    
    <!-- Wooden/Metal upper grip -->
    <path d="M-10 -45 C-10 -55 10 -55 10 -45 C10 -35 -10 -35 -10 -45 Z" fill="#fbbf24" />

    <!-- Stamp Base Metal Collar -->
    <rect x="-18" y="-5" width="36" height="8" rx="2" fill="#94a3b8" />
    <rect x="-20" y="3" width="40" height="6" rx="2" fill="#64748b" />

    <!-- Glowing impact aura around stamp base -->
    <ellipse cx="0" cy="12" rx="26" ry="14" fill="#ef4444" opacity="0.3" filter="url(#subtleGlow)" />
  </g>

  <!-- The Official Seal Stamp Imprint (On the document) -->
  <g transform="translate(132, 125) rotate(-6)">
    <ellipse cx="0" cy="0" rx="28" ry="16" fill="none" stroke="url(#stampGrad)" stroke-width="3.5" opacity="0.9" />
    <ellipse cx="0" cy="0" rx="23" ry="12" fill="none" stroke="url(#stampGrad)" stroke-width="1.5" opacity="0.7" />
    
    <!-- Star icon inside stamp (Representing official/approved status) -->
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#ef4444" opacity="0.9" />
    
    <!-- Curved graphic flourish inside stamp -->
    <path d="M-14 4 Q 0 8 14 4" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Sparkles / Legal validity indicators (Green success glowing accents) -->
  <g filter="url(#subtleGlow)">
    <!-- Sparkle 1 (Top Left) -->
    <path d="M 65 65 Q 65 75 55 75 Q 65 75 65 85 Q 65 75 75 75 Q 65 75 65 65 Z" fill="#34d399" />
    <!-- Sparkle 2 (Top Right) -->
    <path d="M 180 50 Q 180 58 172 58 Q 180 58 180 66 Q 180 58 188 58 Q 180 58 180 50 Z" fill="#38bdf8" />
    <!-- Sparkle 3 (Bottom Right) -->
    <path d="M 175 140 Q 175 148 167 148 Q 175 148 175 156 Q 175 148 183 148 Q 175 148 175 140 Z" fill="#34d399" />
  </g>

  <!-- Magnifying Glass Examining the Document (Adds investigative, verification theme) -->
  <g transform="translate(85, 115) rotate(25)">
    <!-- Glass shadow -->
    <circle cx="0" cy="0" r="22" fill="#020617" opacity="0.4" filter="url(#glow)" />
    
    <!-- Handle -->
    <rect x="-6" y="20" width="12" height="36" rx="6" fill="#334155" />
    <rect x="-4" y="20" width="8" height="36" rx="4" fill="#475569" />

    <!-- Rim -->
    <circle cx="0" cy="0" r="22" fill="#334155" />
    <circle cx="0" cy="0" r="18" fill="#1e293b" />
    
    <!-- Lens reflection -->
    <path d="M -10 -10 A 14 14 0 0 1 10 -10 A 14 14 0 0 0 -10 -10 Z" fill="#38bdf8" opacity="0.25" />
  </g>

</svg>