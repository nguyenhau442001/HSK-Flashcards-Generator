<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm indoor light glow -->
    <radialGradient id="doorLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Interior Restaurant / Party Room -->
  <!-- Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#090d16"/>
  <!-- Floor wood plank lines -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#131b2e" stroke-width="2"/>
  <line x1="0" y1="215" x2="240" y2="215" stroke="#131b2e" stroke-width="2"/>

  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="170" fill="#172033"/>

  <!-- Wall Decor: Warm welcoming glowing lights -->
  <circle cx="60" cy="50" r="15" fill="#f59e0b" opacity="0.15"/>
  <circle cx="180" cy="50" r="15" fill="#f59e0b" opacity="0.15"/>
  <path d="M40 30 Q60 50 80 30" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M160 30 Q180 50 200 30" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="60" cy="40" r="4" fill="#fbbf24"/>
  <circle cx="180" cy="40" r="4" fill="#fbbf24"/>

  <!-- DINING TABLE & PROPS -->
  <!-- Table shadow -->
  <ellipse cx="120" cy="175" rx="70" ry="12" fill="#05080f" opacity="0.6"/>
  <!-- Table Base -->
  <rect x="100" y="155" width="40" height="20" fill="#2d3748"/>
  <ellipse cx="120" cy="155" rx="75" ry="14" fill="#cbd5e1" filter="url(#shadow)"/>
  <ellipse cx="120" cy="153" rx="72" ry="12" fill="#e2e8f0"/>
  <!-- Tablecloth / Runner -->
  <path d="M70 153 Q120 163 170 153 L165 178 Q120 188 75 178 Z" fill="#38bdf8" opacity="0.2"/>

  <!-- Tableware -->
  <circle cx="100" cy="153" r="8" fill="#ffffff"/>
  <circle cx="140" cy="153" r="8" fill="#ffffff"/>
  <circle cx="120" cy="149" r="6" fill="#f43f5e"/> <!-- Center dish/bowl -->
  <rect x="85" y="148" width="8" height="4" rx="2" fill="#94a3b8" transform="rotate(15 89 150)"/>
  <rect x="145" y="148" width="8" height="4" rx="2" fill="#94a3b8" transform="rotate(-15 149 150)"/>

  <!-- ENTRANCE / DOORWAY (Left side) -->
  <rect x="15" y="60" width="55" height="115" fill="#0b111e"/>
  <rect x="10" y="55" width="65" height="120" fill="none" stroke="#334155" stroke-width="3" rx="4"/>
  <!-- Open Door -->
  <path d="M20 65 L60 70 L60 170 L20 170 Z" fill="#1e293b" filter="url(#shadow)"/>
  <!-- Welcome light spill from outside -->
  <circle cx="25" cy="115" r="45" fill="url(#doorLight)"/>

  <!-- CHARACTER 1: Already seated at the table (Waiting host/guest) -->
  <g transform="translate(180, 110)" filter="url(#shadow)">
    <!-- Chair -->
    <rect x="-12" y="25" width="24" height="35" rx="4" fill="#475569"/>
    <!-- Body -->
    <circle cx="0" cy="5" r="14" fill="#10b981"/> <!-- Head -->
    <path d="M-14 20 Q0 12 14 20 L16 45 L-16 45 Z" fill="#059669"/> <!-- Torso -->
    <!-- Arms resting on table -->
    <path d="M-14 25 L-25 35" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 25 L22 35" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
    <!-- Face -->
    <circle cx="-4" cy="4" r="1.5" fill="#064e3b"/>
    <circle cx="4" cy="4" r="1.5" fill="#064e3b"/>
    <path d="M-2 10 Q0 13 3 10" fill="none" stroke="#064e3b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M-13 2 Q0 -6 13 2 Q10 -3 0 -4 Q-10 -3 -13 2 Z" fill="#334155"/>
  </g>

  <!-- CHARACTER 2: Just arrived (Standing near door, taking off coat / stepping in) -->
  <g transform="translate(55, 105)" filter="url(#shadow)">
    <!-- Motion lines suggesting recent movement/arrival -->
    <path d="M -25 20 Q -15 20 -5 25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
    <path d="M -20 35 Q -12 35 -2 38" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>

    <!-- Person -->
    <circle cx="0" cy="0" r="13" fill="#fb923c"/> <!-- Head -->
    <path d="M-12 15 Q0 10 12 15 L15 50 L-15 50 Z" fill="#ea580c"/> <!-- Torso (Orange jacket) -->
    <!-- Arms -->
    <path d="M-12 18 L-22 30" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
    <path d="M12 18 L22 25" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-7" y1="50" x2="-9" y2="70" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <line x1="7" y1="50" x2="9" y2="70" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Face -->
    <circle cx="-3" cy="-1" r="1.5" fill="#7c2d12"/>
    <circle cx="3" cy="-1" r="1.5" fill="#7c2d12"/>
    <path d="M-2 5 Q0 8 3 5" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hair / Hat -->
    <path d="M-12 -5 Q0 -14 12 -5 Q8 -9 0 -10 Q-8 -9 -12 -5 Z" fill="#1e293b"/>
  </g>

  <!-- CHARACTER 3: The next one arriving sequentially (Just outside the open door, stepping in) -->
  <g transform="translate(25, 125)" filter="url(#shadow)">
    <!-- Slight transparency/smaller to show sequence depth ("陆续" - one after another) -->
    <circle cx="0" cy="0" r="11" fill="#38bdf8" opacity="0.9"/>
    <path d="M-10 13 Q0 9 10 13 L12 42 L-12 42 Z" fill="#0284c7" opacity="0.9"/>
    <line x1="-6" y1="42" x2="-7" y2="58" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <line x1="6" y1="42" x2="7" y2="58" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <!-- Face details -->
    <circle cx="-2" cy="-1" r="1" fill="#0369a1"/>
    <circle cx="2" cy="-1" r="1" fill="#0369a1"/>
    <path d="M-1 4 Q0 6 2 4" fill="none" stroke="#0369a1" stroke-width="1" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M-11 -3 Q0 -10 11 -3 Z" fill="#475569"/>
  </g>

  <!-- Subtle visual indicator of "陆续" (Sequence trail: step-by-step arrivals) -->
  <path d="M 32 160 Q 45 150 55 140" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <path d="M 65 140 Q 90 145 110 140" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>

</svg>