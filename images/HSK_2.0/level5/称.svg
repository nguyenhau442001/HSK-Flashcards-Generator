<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Stage Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Crown/Aura Gradient -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Speech Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Podium Gradient -->
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Stage Light -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Background Stage Details / Confetti / Sparks -->
  <g opacity="0.6">
    <circle cx="50" cy="60" r="2" fill="#fbbf24" />
    <circle cx="190" cy="50" r="3" fill="#38bdf8" />
    <circle cx="210" cy="110" r="1.5" fill="#ec4899" />
    <circle cx="30" cy="130" r="2.5" fill="#34d399" />
    <circle cx="110" cy="40" r="2" fill="#fbbf24" />
  </g>

  <!-- Spotlight Cone Background Rays -->
  <path d="M120 15 L60 210 L180 210 Z" fill="#38bdf8" opacity="0.04" />
  <path d="M120 15 L90 210 L150 210 Z" fill="#fbbf24" opacity="0.06" />

  <!-- MAIN SCENE: Podium -->
  <g id="podium">
    <!-- Podium Top Ellipse / Surface -->
    <ellipse cx="120" cy="180" rx="45" ry="12" fill="#64748b" />
    <!-- Podium Body -->
    <path d="M75 180 L85 220 L155 220 L165 180 Z" fill="url(#podiumGrad)" />
    <!-- Podium Accent Glow Line -->
    <path d="M80 200 L160 200" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <!-- Podium Base Shadow -->
    <ellipse cx="120" cy="220" rx="40" ry="8" fill="#0f172a" opacity="0.5" />
  </g>

  <!-- MAIN SUBJECT: The Celebrated Character (Genius / 'Called a genius') -->
  <g id="character">
    <!-- Character Body / Jacket -->
    <path d="M95 180 C95 155 105 145 120 145 C135 145 145 155 145 180 Z" fill="url(#jacketGrad)" />
    <!-- Collar / Shirt -->
    <path d="M110 145 L120 155 L130 145 L125 140 L115 140 Z" fill="#f8fafc" />
    <path d="M120 155 L120 170" stroke="#312e81" stroke-width="2" />

    <!-- Head & Neck -->
    <rect x="113" y="128" width="14" height="20" fill="#fcd34d" rx="4" />
    <circle cx="120" cy="122" r="18" fill="#fcd34d" />

    <!-- Hair (Stylish, Confident) -->
    <path d="M102 118 C102 104 110 102 120 102 C132 102 138 108 138 120 L138 125 C130 122 126 122 120 124 C112 122 106 122 102 125 Z" fill="#1e293b" />
    <path d="M115 104 C118 100 124 100 128 103 C124 101 118 101 115 104 Z" fill="#334155" />

    <!-- Facial Expression (Confident Smile, Closed happy eyes) -->
    <path d="M112 120 Q115 116 118 120" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M122 120 Q125 116 128 120" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Cheeks (Blush) -->
    <circle cx="111" cy="124" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="129" cy="124" r="3" fill="#f43f5e" opacity="0.4" />
    <!-- Big Confident Smile -->
    <path d="M115 125 Q120 131 125 125" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Raised Hand / Waving or Presenting -->
    <path d="M142 160 C155 155 162 140 158 132 C155 126 148 128 145 135 C142 142 140 150 142 160 Z" fill="#fcd34d" />
    <path d="M98 160 C85 155 78 140 82 132 C85 126 92 128 95 135 C98 142 100 150 98 160 Z" fill="#fcd34d" />
  </g>

  <!-- SYMBOLIC CROWN ("The title / designation" of Genius) -->
  <g id="crown" transform="translate(120, 92)">
    <!-- Floating Crown Animation Effect (Static Vector) -->
    <path d="M-14 -4 L-18 -18 L-8 -10 L0 -22 L8 -10 L18 -18 L14 -4 Z" fill="url(#goldGlow)" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" />
    <rect x="-16" y="-3" width="32" height="5" rx="2" fill="#d97706" />
    <circle cx="-18" r="2.5" fill="#f59e0b" />
    <circle cx="0" cy="-22" r="2.5" fill="#f59e0b" />
    <circle cx="18" r="2.5" fill="#f59e0b" />
    <!-- Gems on Crown -->
    <circle cx="-8" cy="-1" r="1.5" fill="#38bdf8" />
    <circle cx="0" cy="-1" r="1.5" fill="#ec4899" />
    <circle cx="8" cy="-1" r="1.5" fill="#38bdf8" />
  </g>

  <!-- CONTEXTUAL PROPS: "Calling/Naming" Concept - Speech Bubble / Label Banner -->
  <g id="naming-banner">
    <!-- Speech Bubble Main Body floating top-left -->
    <path d="M 35 55 
             Q 35 45 45 45 
             L 115 45 
             Q 125 45 125 55 
             L 125 85 
             Q 125 95 115 95 
             L 80 95 
             L 65 110 
             L 70 95 
             L 45 95 
             Q 35 95 35 85 Z" 
          fill="url(#bubbleGrad)" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.3))" />

    <!-- Graphic representation inside bubble: Glowing Star / Genius Emblem (instead of text) -->
    <g transform="translate(80, 70) scale(0.9)">
      <!-- Star Background Glow -->
      <circle cx="0" cy="0" r="16" fill="#fef3c7" />
      <!-- Star Icon representing 'Genius / Title' -->
      <path d="M 0 -12 L 3.5 -3.5 L 12 -3.5 L 5 2 L 7.5 10.5 L 0 5.5 L -7.5 10.5 L -5 2 L -12 -3.5 L -3.5 -3.5 Z" fill="#f59e0b" stroke="#d97706" stroke-linejoin="round" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>

    <!-- Quotation Marks Graphic in Bubble (Visualizing "Calling / Xưng là") -->
    <path d="M 46 58 C 46 53 50 50 55 50 C 53 55 51 58 48 62 C 51 62 53 60 53 57 C 53 54 50 54 48 56 Z" fill="#94a3b8" />
    <path d="M 107 58 C 107 53 111 50 116 50 C 114 55 112 58 109 62 C 112 62 114 60 114 57 C 114 54 111 54 109 56 Z" fill="#94a3b8" />
  </g>

  <!-- Additional Decorative Elements (Sparkles & Applause Iconography) -->
  <!-- Left Sparkle -->
  <g transform="translate(30, 140)">
    <path d="M0 -8 C0 -2 2 0 8 0 C2 0 0 2 0 8 C0 2 -2 0 -8 0 C-2 0 0 -2 0 -8 Z" fill="#38bdf8" />
  </g>

  <!-- Right Sparkle -->
  <g transform="translate(200, 85)">
    <path d="M0 -10 C0 -3 3 0 10 0 C3 0 0 3 0 10 C0 3 -3 0 -10 0 C-3 0 0 -3 0 -10 Z" fill="#fbbf24" />
  </g>

  <!-- Bottom Right Confetti Ribbon -->
  <path d="M 195 170 Q 205 160 215 175 T 225 190" stroke="#ec4899" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 20 180 Q 25 170 15 160" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Outer Vignette / Border Effect -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>