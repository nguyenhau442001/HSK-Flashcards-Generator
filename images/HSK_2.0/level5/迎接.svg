<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Terminal Window / Light Glow -->
    <linearGradient id="window-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Accent Gradient -->
    <linearGradient id="warm-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Drop Shadows for depth -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT: Airport Arrival Hall Context -->
  <!-- Giant curved glass windows showing night sky outside -->
  <path d="M20,20 L220,20 L220,160 L20,160 Z" fill="url(#window-glow)"/>
  
  <!-- Window Panes & Structural Pillars -->
  <g stroke="#334155" stroke-width="2" opacity="0.6">
    <line x1="80" y1="20" x2="80" y2="160"/>
    <line x1="160" y1="20" x2="160" y2="160"/>
    <line x1="20" y1="90" x2="220" y2="90"/>
  </g>

  <!-- City skyline / Lights in the distance outside -->
  <g fill="#475569" opacity="0.4">
    <rect x="35" y="110" width="15" height="50"/>
    <rect x="55" y="95" width="20" height="65"/>
    <rect x="175" y="100" width="25" height="60"/>
    <rect x="205" y="120" width="12" height="40"/>
  </g>
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="42" cy="115" r="1.5"/>
    <circle cx="65" cy="105" r="1.5"/>
    <circle cx="185" cy="110" r="1.5"/>
    <circle cx="195" cy="130" r="1.5"/>
  </g>

  <!-- Arrival Hall Floor -->
  <rect x="0" y="160" width="240" height="80" fill="#0f172a"/>
  <!-- Floor reflection lines -->
  <path d="M0,160 L240,160" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  <ellipse cx="120" cy="170" rx="90" ry="8" fill="#334155" opacity="0.4"/>

  <!-- PROP: Welcome Banner / Sign being held -->
  <g filter="url(#soft-shadow)">
    <!-- Sign stick -->
    <rect x="100" y="115" width="4" height="65" fill="#64748b" rx="2"/>
    <!-- Sign board (blank/stylized shapes to represent greeting text without actual text) -->
    <rect x="70" y="90" width="64" height="32" rx="4" fill="#f8fafc"/>
    <rect x="74" y="94" width="56" height="24" rx="2" fill="#ef4444" opacity="0.1"/>
    <!-- Decorative abstract welcoming shapes on the sign -->
    <circle cx="86" cy="106" r="5" fill="#f59e0b"/>
    <rect x="96" y="102" width="26" height="4" rx="2" fill="#334155"/>
    <rect x="96" y="110" width="18" height="3" rx="1.5" fill="#64748b"/>
  </g>

  <!-- CHARACTERS (Two friends greeting/welcoming at the airport) -->

  <!-- Character 1 (Left - Waving cheerfully) -->
  <g class="character-left" filter="url(#soft-shadow)">
    <!-- Legs -->
    <rect x="52" y="180" width="8" height="30" rx="4" fill="#1e293b"/>
    <rect x="66" y="180" width="8" height="30" rx="4" fill="#1e293b"/>
    <!-- Shoes -->
    <ellipse cx="55" cy="210" rx="6" ry="3" fill="#0f172a"/>
    <ellipse cx="70" cy="210" rx="6" ry="3" fill="#0f172a"/>
    
    <!-- Torso (Jacket) -->
    <path d="M50,135 L76,135 L80,185 L46,185 Z" fill="#38bdf8"/>
    <!-- Collar / Shirt -->
    <path d="M58,135 L63,148 L68,135 Z" fill="#f8fafc"/>
    
    <!-- Left Arm (Waving up) -->
    <path d="M50,140 C40,135 32,120 35,110 C38,105 45,108 43,115 C41,122 48,135 52,142 Z" fill="#38bdf8"/>
    <!-- Hand waving -->
    <circle cx="33" cy="108" r="5" fill="#fed7aa"/>

    <!-- Head & Hair -->
    <circle cx="63" cy="115" r="14" fill="#fed7aa"/>
    <!-- Hair style -->
    <path d="M49,115 C49,103 55,98 63,98 C72,98 77,104 77,115 C74,111 69,110 63,110 C57,110 52,111 49,115 Z" fill="#334155"/>
    
    <!-- Expressive Happy Face -->
    <!-- Smiling Eyes -->
    <path d="M58,114 Q60,111 62,114" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M64,114 Q66,111 68,114" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Big Smile -->
    <path d="M59,120 Q63,125 67,120" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="57" cy="118" r="2" fill="#fb7185" opacity="0.6"/>
    <circle cx="69" cy="118" r="2" fill="#fb7185" opacity="0.6"/>
  </g>

  <!-- Character 2 (Right - Holding the welcome sign) -->
  <g class="character-right" filter="url(#soft-shadow)">
    <!-- Legs -->
    <rect x="156" y="180" width="8" height="30" rx="4" fill="#334155"/>
    <rect x="170" y="180" width="8" height="30" rx="4" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="159" cy="210" rx="6" ry="3" fill="#0f172a"/>
    <ellipse cx="174" cy="210" rx="6" ry="3" fill="#0f172a"/>
    
    <!-- Torso (Orange/Amber Sweater matching warm welcoming mood) -->
    <path d="M150,135 L180,135 L184,185 L146,185 Z" fill="url(#warm-glow)"/>
    
    <!-- Right Arm (Holding sign stick) -->
    <path d="M174,140 C182,145 186,155 130,155" fill="none" stroke="url(#warm-glow)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="120" cy="155" r="5" fill="#fed7aa"/>

    <!-- Left Arm (Happy gesture) -->
    <path d="M150,145 C140,140 135,130 140,122" fill="none" stroke="url(#warm-glow)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="140" cy="120" r="4.5" fill="#fed7aa"/>

    <!-- Head & Hair -->
    <circle cx="165" cy="115" r="14" fill="#fed7aa"/>
    <!-- Hair style -->
    <path d="M151,115 C151,102 158,97 166,97 C175,97 179,103 179,115 C174,111 170,110 165,110 C160,110 156,111 151,115 Z" fill="#0f172a"/>
    
    <!-- Expressive Face -->
    <!-- Smiling Eyes -->
    <path d="M160,114 Q162,111 164,114" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M166,114 Q168,111 170,114" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Big Open Smile -->
    <path d="M161,120 Q165,125 169,120" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="159" cy="118" r="2" fill="#fb7185" opacity="0.6"/>
    <circle cx="171" cy="118" r="2" fill="#fb7185" opacity="0.6"/>
  </g>

  <!-- CONTEXTUAL PROPS: Travel Luggage to emphasize airport arrival scene -->
  <g filter="url(#soft-shadow)">
    <!-- Suitcase 1 -->
    <rect x="190" y="170" width="24" height="32" rx="4" fill="#10b981"/>
    <path d="M196,170 L196,166 C196,164 200,164 202,164 L202,170" fill="none" stroke="#047857" stroke-width="2"/>
    <line x1="190" y1="182" x2="214" y2="182" stroke="#047857" stroke-width="2"/>
    <circle cx="202" cy="182" r="2" fill="#0f172a"/>
    
    <!-- Suitcase 2 (smaller on top) -->
    <rect x="194" y="148" width="18" height="18" rx="3" fill="#6366f1"/>
    <path d="M199,148 L199,145 C199,144 203,144 207,145 L207,148" fill="none" stroke="#4338ca" stroke-width="2"/>
  </g>

  <!-- Atmospheric Lighting / Sparkles (festive greeting mood) -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="30" cy="60" r="2"/>
    <circle cx="210" cy="50" r="1.5"/>
    <circle cx="110" cy="40" r="2.5"/>
  </g>
  <g fill="#fbbf24" opacity="0.9">
    <circle cx="180" cy="70" r="2"/>
    <circle cx="50" cy="80" r="1.5"/>
  </g>
</svg>