<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="tableTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Props -->
  <!-- Cozy wooden shelf on the wall -->
  <rect x="25" y="55" width="70" height="6" rx="3" fill="#334155"/>
  <rect x="35" y="25" width="50" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Window showing night/evening city vibe -->
  <path d="M150,30 L205,30 L205,80 L150,80 Z" fill="#0284c7" opacity="0.3"/>
  <path d="M177,30 L177,80 M150,55 L205,55" stroke="#334155" stroke-width="2"/>
  <path d="M150,30 L205,30 L205,80 L150,80 Z" fill="none" stroke="#475569" stroke-width="2" rx="4"/>
  
  <!-- Pendant Hanging Lamp -->
  <path d="M120,0 L120,35" stroke="#64748b" stroke-width="2"/>
  <path d="M100,35 L140,35 L145,45 L95,45 Z" fill="#cbd5e1"/>
  <circle cx="120" cy="45" r="8" fill="#fef08a" filter="url(#dropShadow)"/>
  
  <!-- Light Cone -->
  <polygon points="120,45 40,210 200,210" fill="url(#warmLight)"/>

  <!-- Character 1 (Left - Active Player, Male smiling) -->
  <g transform="translate(15, 80)">
    <!-- Body & Chair -->
    <path d="M30,110 L50,110 L55,130 L25,130 Z" fill="#334155"/>
    <path d="M20,65 Q20,50 35,50 Q50,50 50,65 L50,110 L20,110 Z" fill="#3b82f6"/> <!-- Blue shirt -->
    <!-- Head & Face -->
    <circle cx="35" cy="35" r="14" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M21,32 Q35,18 49,32 L47,26 Q35,16 23,26 Z" fill="#1e293b"/>
    <!-- Eye (Focused, happy expression) -->
    <path d="M38,33 Q41,35 44,33" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="41" cy="32" r="1.5" fill="#1e293b"/>
    <path d="M37,38 Q41,41 45,38" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Arm reaching forward to move piece -->
    <path d="M45,70 Q60,75 75,85" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="77" cy="86" r="4" fill="#fcd34d"/>
  </g>

  <!-- Character 2 (Right - Opponent, Female thinking/watching) -->
  <g transform="translate(155, 80)">
    <!-- Body & Chair -->
    <path d="M20,110 L40,110 L45,130 L15,130 Z" fill="#334155"/>
    <path d="M15,65 Q15,50 30,50 Q45,50 45,65 L45,110 L15,110 Z" fill="#ec4899"/> <!-- Pink shirt -->
    <!-- Head & Face -->
    <circle cx="25" cy="35" r="14" fill="#fcd34d"/>
    <!-- Hair (Ponytail style) -->
    <path d="M12,32 Q25,18 38,32 L35,24 Q25,16 15,24 Z" fill="#1e293b"/>
    <circle cx="37" cy="28" r="4" fill="#1e293b"/>
    <!-- Eye (Thoughtful) -->
    <path d="M16,33 Q19,32 22,33" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Hand on chin -->
    <path d="M20,70 Q10,75 15,85" stroke="#ec4899" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="16" cy="83" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- Game Table -->
  <g filter="url(#dropShadow)">
    <!-- Table Legs -->
    <rect x="65" y="170" width="12" height="50" fill="url(#woodTable)"/>
    <rect x="163" y="170" width="12" height="50" fill="url(#woodTable)"/>
    <!-- Table Top Base -->
    <path d="M40,150 L200,150 L210,170 L30,170 Z" fill="url(#woodTable)"/>
    <!-- Table Surface -->
    <path d="M35,145 L205,145 L200,155 L40,155 Z" fill="url(#tableTop)"/>
  </g>

  <!-- Xiangqi Board (Perspective) on Table -->
  <g transform="translate(75, 125)">
    <!-- Board Base -->
    <polygon points="15,20 75,20 85,45 5,45" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    
    <!-- Grid lines on board -->
    <line x1="22" y1="20" x2="22" y2="45" stroke="#d97706" stroke-width="1"/>
    <line x1="39" y1="20" x2="39" y2="45" stroke="#d97706" stroke-width="1"/>
    <line x1="56" y1="20" x2="56" y2="45" stroke="#d97706" stroke-width="1"/>
    
    <line x1="15" y1="28" x2="75" y2="28" stroke="#d97706" stroke-width="1"/>
    <line x1="10" y1="36" x2="80" y2="36" stroke="#d97706" stroke-width="1"/>

    <!-- River span text placeholder lines (Abstract decorative strokes) -->
    <line x1="42" y1="30" x2="48" y2="34" stroke="#d97706" stroke-width="0.8"/>
    <line x1="48" y1="30" x2="42" y2="34" stroke="#d97706" stroke-width="0.8"/>

    <!-- Xiangqi Pieces (Circular tokens with red/black distinction) -->
    <!-- Red Piece -->
    <circle cx="28" cy="24" r="4.5" fill="#fef3c7" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="3" fill="none" stroke="#dc2626" stroke-width="0.75"/>
    
    <!-- Black Piece -->
    <circle cx="62" cy="40" r="4.5" fill="#fef3c7" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="62" cy="40" r="3" fill="none" stroke="#1e293b" stroke-width="0.75"/>

    <!-- Moving Piece (hovering near left player's hand) -->
    <circle cx="48" cy="26" r="4.5" fill="#fef3c7" stroke="#dc2626" stroke-width="1.5" filter="url(#dropShadow)"/>
    <circle cx="48" cy="26" r="3" fill="none" stroke="#dc2626" stroke-width="0.75"/>
  </g>

  <!-- Foreground Atmospheric Elements (Tea cups on table) -->
  <g transform="translate(50, 140)">
    <ellipse cx="10" cy="5" rx="5" ry="2" fill="#cbd5e1"/>
    <path d="M5,5 L7,12 L13,12 L15,5 Z" fill="#e2e8f0"/>
  </g>
  <g transform="translate(170, 138)">
    <ellipse cx="10" cy="5" rx="5" ry="2" fill="#cbd5e1"/>
    <path d="M5,5 L7,12 L13,12 L15,5 Z" fill="#e2e8f0"/>
    <!-- Steam -->
    <path d="M9,2 Q11,0 9,-3" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

</svg>