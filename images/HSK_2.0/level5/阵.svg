<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 200 C 80 190, 160 190, 240 200 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Character -->
  <g transform="translate(120, 180)">
    <circle cx="0" cy="-20" r="12" fill="#fde68a"/>
    <path d="M-15 0 L 15 0 L 10 40 L -10 40 Z" fill="#38bdf8"/>
    <path d="M-15 0 L -25 20 M 15 0 L 25 20" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- The "Zhen" (Rain Shower) -->
  <g fill="#38bdf8" opacity="0.8">
    <line x1="40" y1="0" x2="60" y2="200" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="0" x2="100" y2="200" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="0" x2="140" y2="200" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="0" x2="180" y2="200" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="0" x2="220" y2="200" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="40" y2="220" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="40" x2="120" y2="240" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="20" x2="200" y2="220" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Umbrella -->
  <path d="M80 140 Q 120 110 160 140 Q 120 130 80 140" fill="#fb923c"/>
  <path d="M120 140 L 120 170" stroke="#fb923c" stroke-width="3"/>
  
  <!-- Rain Splashes -->
  <circle cx="60" cy="200" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="140" cy="205" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="200" r="2" fill="#ffffff" opacity="0.6"/>
</svg>