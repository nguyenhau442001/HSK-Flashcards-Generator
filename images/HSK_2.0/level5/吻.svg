<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character 1 (Male) Hair & Clothes Palette -->
    <linearGradient id="manShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Female) Hair & Clothes Palette -->
    <linearGradient id="womanShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="tinyGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Environment & Props -->
  <!-- Wallpaper subtle pattern lines -->
  <g stroke="#475569" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="60" x2="240" y2="60" />
    <line x1="0" y1="120" x2="240" y2="120" />
    <line x1="0" y1="180" x2="240" y2="180" />
    <line x1="60" y1="0" x2="60" y2="240" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="180" y1="0" x2="180" y2="240" />
  </g>

  <!-- Bookshelf Background Prop (Left) -->
  <g opacity="0.7">
    <rect x="15" y="40" width="35" height="110" rx="3" fill="#0f172a" />
    <rect x="18" y="75" width="29" height="4" fill="#334155" />
    <rect x="18" y="110" width="29" height="4" fill="#334155" />
    <!-- Books -->
    <rect x="20" y="50" width="6" height="23" rx="1" fill="#f43f5e" />
    <rect x="28" y="52" width="5" height="21" rx="1" fill="#38bdf8" />
    <rect x="35" y="48" width="8" height="25" rx="1" fill="#f59e0b" />
    <rect x="20" y="85" width="7" height="23" rx="1" fill="#10b981" />
    <rect x="29" y="88" width="6" height="20" rx="1" fill="#a855f7" />
  </g>

  <!-- House Plant Prop (Right) -->
  <g transform="translate(195, 120)">
    <!-- Pot -->
    <path d="M5 50 L10 75 L30 75 L35 50 Z" fill="#64748b" />
    <ellipse cx="20" cy="50" rx="15" ry="3" fill="#475569" />
    <!-- Leaves -->
    <path d="M20 50 Q10 25 -5 20 Q5 35 20 50 Z" fill="#10b981" />
    <path d="M20 50 Q30 20 45 15 Q35 32 20 50 Z" fill="#059669" />
    <path d="M20 50 Q20 10 25 5 Q22 28 20 50 Z" fill="#34d399" />
    <path d="M20 50 Q5 38 -8 45 Q5 46 20 50 Z" fill="#047857" />
  </g>

  <!-- Floor and Sofa/Bench Base -->
  <rect x="0" y="195" width="240" height="45" fill="#090d16" />
  <!-- Warm Wooden Floor Line -->
  <line x1="0" y1="195" x2="240" y2="195" stroke="#f59e0b" stroke-width="2" opacity="0.3" />

  <!-- Window with Moonlight/Warm Light (Center-Back) -->
  <g transform="translate(90, 20)">
    <rect x="0" y="0" width="60" height="90" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Window Panes & Glow -->
    <rect x="4" y="4" width="52" height="82" fill="url(#windowGlow)" />
    <line x1="30" y1="0" x2="30" y2="90" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="45" x2="60" y2="45" stroke="#475569" stroke-width="2" />
    <!-- Little star/bokeh outside -->
    <circle cx="15" cy="20" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="45" cy="65" r="1" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Hanging Warm Lamp Prop -->
  <g transform="translate(150, 0)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#64748b" stroke-width="1.5" />
    <path d="M-15 40 L15 40 L10 50 L-10 50 Z" fill="#f59e0b" />
    <circle cx="0" cy="52" r="6" fill="#fef08a" filter="url(#tinyGlow)" />
  </g>

  <!-- MAIN CHARACTERS: The Scene of "他给了她一个吻" (He gave her a kiss) -->
  
  <!-- Shadow under characters -->
  <ellipse cx="120" cy="198" rx="45" ry="6" fill="#020617" opacity="0.6" />

  <!-- Character 1: Male (Left) -->
  <g id="maleCharacter">
    <!-- Left Leg & Shoe -->
    <path d="M95 150 L90 196 L102 196 L105 160 Z" fill="#334155" />
    <ellipse cx="96" cy="197" rx="8" ry="3" fill="#0f172a" />

    <!-- Torso (leaning slightly forward) -->
    <path d="M90 110 C90 105 105 100 112 110 L115 155 L95 155 Z" fill="url(#manShirt)" />
    <!-- Jacket / Cardigan details -->
    <path d="M100 110 L102 155" stroke="#0284c7" stroke-width="2" fill="none" />

    <!-- Right Arm (holding her hand or resting on her waist/shoulder) -->
    <path d="M105 115 Q115 125 122 135" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="123" cy="137" r="4" fill="#fcd34d" /> <!-- hand -->

    <!-- Left Arm (bent holding back or gently behind) -->
    <path d="M92 115 Q82 125 85 140" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Neck & Head -->
    <path d="M102 105 L106 112" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" />
    <!-- Head tilted forward -->
    <g transform="translate(112, 92)">
      <!-- Hair -->
      <path d="M -8 -12 C -8 -20 8 -20 12 -12 C 16 -4 10 2 4 4 C -2 6 -8 0 -8 -12 Z" fill="#334155" />
      <!-- Face profile facing right -->
      <circle cx="4" cy="-3" r="10" fill="#fde047" />
      <!-- Nose tip pressing gently toward hers -->
      <path d="M12 -3 C14 -3 15 -2 14 -1" stroke="#eab308" stroke-width="2" fill="none" stroke-linecap="round" />
      <!-- Closed affectionate eye -->
      <path d="M4 -5 Q6 -3 8 -5" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <!-- Hair strands front -->
      <path d="M -4 -12 C -2 -8 2 -10 6 -12" stroke="#1e293b" stroke-width="2" fill="none" />
    </g>
  </g>

  <!-- Character 2: Female (Right) -->
  <g id="femaleCharacter">
    <!-- Right Leg & Shoe -->
    <path d="M140 150 L148 196 L136 196 L132 160 Z" fill="#9f1239" />
    <ellipse cx="142" cy="197" rx="8" ry="3" fill="#0f172a" />

    <!-- Torso (slight lean back/up) -->
    <path d="M130 110 C130 105 145 100 138 110 L135 155 L150 155 Z" fill="url(#womanShirt)" />
    <!-- Skirt / Dress flare -->
    <path d="M132 155 L155 196 L125 196 Z" fill="#e11d48" />

    <!-- Left Arm (raised gently, holding a small gift box or resting on his chest) -->
    <path d="M132 118 Q125 125 118 130" stroke="#be123c" stroke-width="7" stroke-linecap="round" fill="none" />
    <circle cx="116" cy="131" r="3.5" fill="#fcd34d" /> <!-- hand -->

    <!-- Neck & Head -->
    <path d="M135 105 L131 112" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" />
    <!-- Head -->
    <g transform="translate(124, 91)">
      <!-- Hair bun & long hair flow -->
      <circle cx="-2" cy="-10" r="9" fill="#1e293b" />
      <path d="M -8 -8 C -14 -4 -12 8 -6 14 C -2 18 4 12 2 8" fill="#1e293b" />
      <!-- Face profile facing left -->
      <circle cx="-2" cy="-3" r="10" fill="#fde047" />
      <!-- Closed happy eye -->
      <path d="M-6 -5 Q-4 -3 -2 -5" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <!-- Rosy cheek -->
      <circle cx="-5" cy="0" r="3.5" fill="#fb7185" opacity="0.6" />
    </g>
  </g>

  <!-- The "Kiss" Focal Point (Meeting point of faces) -->
  <g transform="translate(118, 88)" filter="url(#softGlow)">
    <!-- Romantic Sparkle / Hearts floating subtly around the kiss -->
    <path d="M0 -5 C -3 -10 -8 -5 -3 0 C 0 3 0 3 0 3 C 0 3 0 3 3 0 C 8 -5 3 -10 0 -5 Z" fill="#ec4899" transform="scale(0.6) translate(-5, -15)" />
    <path d="M0 -5 C -3 -10 -8 -5 -3 0 C 0 3 0 3 0 3 C 0 3 0 3 3 0 C 8 -5 3 -10 0 -5 Z" fill="#f43f5e" transform="scale(0.4) translate(15, -5)" />
    <!-- Small glowing light particles -->
    <circle cx="2" cy="-8" r="1.5" fill="#fef08a" />
    <circle cx="-6" cy="-2" r="1" fill="#fef08a" />
  </g>

  <!-- Foreground Atmospheric Details (Warm lighting vignette) -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#020617" stop-opacity="0.6" />
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none" />

</svg>