<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M20 180 L220 180 L230 210 L10 210 Z" fill="#334155"/>
  
  <!-- Potted Plant (The Achievement/Result) -->
  <g transform="translate(120, 160)">
    <!-- Pot -->
    <path d="M-30 0 L30 0 L20 40 L-20 40 Z" fill="#fb923c"/>
    <path d="M-35 -5 L35 -5 L30 0 L-30 0 Z" fill="#f59e0b"/>
    
    <!-- Stem -->
    <path d="M-5 0 L-5 -80 C-5 -100 5 -100 5 -80 L5 0" fill="#10b981"/>
    
    <!-- Leaves (The Growth/Result) -->
    <ellipse cx="-20" cy="-60" rx="15" ry="25" fill="#38bdf8" transform="rotate(-30 -20 -60)"/>
    <ellipse cx="20" cy="-40" rx="15" ry="25" fill="#38bdf8" transform="rotate(30 20 -40)"/>
    
    <!-- Golden Fruit/Bloom -->
    <circle cx="0" cy="-90" r="12" fill="#fbbf24"/>
    <circle cx="0" cy="-90" r="6" fill="#fef3c7"/>
  </g>
  
  <!-- Floating Sparkles/Atmosphere -->
  <circle cx="180" cy="80" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="60" cy="100" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="150" cy="50" r="4" fill="#ec4899" opacity="0.4"/>
  
  <!-- Trophy/Award Base (Secondary Context) -->
  <path d="M40 200 L80 200 L75 220 L45 220 Z" fill="#475569"/>
  <rect x="55" y="190" width="10" height="10" fill="#fbbf24"/>
</svg>