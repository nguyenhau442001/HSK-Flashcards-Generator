<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Storybook base -->
    <path d="M20 20 L140 0 L140 100 L20 120 Z" fill="#334155"/>
    <path d="M20 20 L140 0 L140 100 L20 120 Z" fill="none" stroke="#64748b" stroke-width="2"/>
    
    <!-- Pop-up elements (The 'vivid' story) -->
    <path d="M60 80 C 80 40, 120 20, 150 50 S 180 100, 160 120 Z" fill="#f59e0b" opacity="0.8"/>
    
    <!-- Dragon/Creature tail emerging -->
    <path d="M130 60 C 150 20, 190 10, 210 40" stroke="#fb923c" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="210" cy="40" r="8" fill="#fb923c"/>
    
    <!-- Magical sparkles/action lines -->
    <circle cx="160" cy="30" r="3" fill="#38bdf8"/>
    <circle cx="180" cy="50" r="4" fill="#10b981"/>
    <circle cx="140" cy="70" r="2" fill="#ec4899"/>
    
    <!-- Open book pages -->
    <path d="M20 20 L80 10 L80 110 L20 120 Z" fill="#f1f5f9"/>
    <path d="M80 10 L140 0 L140 100 L80 110 Z" fill="#e2e8f0"/>
    
    <!-- Decorative depth -->
    <rect x="10" y="125" width="140" height="4" rx="2" fill="#0f172a" opacity="0.3"/>
  </g>
</svg>