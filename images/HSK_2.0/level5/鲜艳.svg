<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmosphere / Soft Garden Glow -->
  <circle cx="120" cy="120" r="100" fill="#1e293b" opacity="0.6"/>
  
  <!-- Garden Background Elements (Moonlit night / evening garden) -->
  <!-- Distant bushes -->
  <path d="M20 180 Q40 150 70 170 T130 165 T190 175 T220 180 L220 220 L20 220 Z" fill="#1e293b"/>
  <path d="M40 190 Q70 160 110 185 T180 180 L220 190 L220 220 L20 220 Z" fill="#090d16"/>
  
  <!-- Garden Fence -->
  <g fill="#334155" opacity="0.4">
    <rect x="25" y="140" width="8" height="60" rx="2"/>
    <rect x="65" y="140" width="8" height="60" rx="2"/>
    <rect x="105" y="140" width="8" height="60" rx="2"/>
    <rect x="145" y="140" width="8" height="60" rx="2"/>
    <rect x="185" y="140" width="8" height="60" rx="2"/>
    <rect x="20" y="155" width="200" height="4"/>
    <rect x="20" y="180" width="200" height="4"/>
  </g>

  <!-- CENTRAL FOCUS: "鲜艳" (Vibrant, bright flowers in the garden) -->
  <!-- Flowerbed mound -->
  <ellipse cx="120" cy="195" rx="90" ry="25" fill="#166534" opacity="0.7"/>
  <ellipse cx="120" cy="190" rx="80" ry="20" fill="#15803d"/>

  <!-- VIBRANT FLOWERS (鮮艷的花朵) -->
  <!-- Flower Group Left (Magenta/Pink Vibrant) -->
  <g transform="translate(60, 160)">
    <!-- Stems -->
    <path d="M15 40 Q10 20 0 0" stroke="#84cc16" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-10 45 Q-5 25 -15 5" stroke="#84cc16" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Vibrant Flower 1 -->
    <circle cx="0" cy="0" r="10" fill="#f43f5e"/>
    <circle cx="0" cy="0" r="4" fill="#fde047"/>
    <path d="M-5 -8 Q0 -16 5 -8 Q10 -3 5 3 Q0 8 -5 3 Q-10 -3 -5 -8" fill="#fb7185" opacity="0.8"/>
    <!-- Vibrant Flower 2 -->
    <circle cx="-15" cy="5" r="9" fill="#ec4899"/>
    <circle cx="-15" cy="5" r="3.5" fill="#fef08a"/>
  </g>

  <!-- Flower Group Center-Left (Orange/Yellow Vibrant) -->
  <g transform="translate(95, 150)">
    <!-- Stem -->
    <path d="M0 50 Q5 25 0 0" stroke="#65a30d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M5 30 Q15 20 25 25" stroke="#65a30d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Vibrant Sun Flower / Marigold -->
    <circle cx="0" cy="0" r="13" fill="#ea580c"/>
    <circle cx="0" cy="0" r="10" fill="#f97316"/>
    <circle cx="0" cy="0" r="5" fill="#facc15"/>
    <circle cx="25" cy="25" r="8" fill="#facc15"/>
    <circle cx="25" cy="25" r="3" fill="#ea580c"/>
  </g>

  <!-- Flower Group Center-Right (Cyan/Blue Vibrant accent) -->
  <g transform="translate(145, 155)">
    <!-- Stem -->
    <path d="M0 45 Q-5 20 5 -5" stroke="#65a30d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Vibrant Blossom -->
    <circle cx="5" cy="-5" r="11" fill="#06b6d4"/>
    <circle cx="5" cy="-5" r="4" fill="#ffffff"/>
    <path d="M-2 -12 Q5 -18 12 -12 Q18 -5 12 2 Q5 8 -2 2 Q-8 -5 -2 -12" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Flower Group Right (Deep Violet/Red Vibrant) -->
  <g transform="translate(180, 165)">
    <!-- Stem -->
    <path d="M-10 40 Q0 20 5 0" stroke="#84cc16" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="5" cy="0" r="12" fill="#8b5cf6"/>
    <circle cx="5" cy="0" r="5" fill="#fbbf24"/>
  </g>

  <!-- CHARACTERS: Admiring the vibrant flowers -->
  <!-- Character 1 (Child / Girl pointing happily) -->
  <g transform="translate(85, 95)">
    <!-- Hair & Head -->
    <circle cx="25" cy="25" r="14" fill="#334155"/>
    <path d="M12 25 Q15 10 28 12 Q40 10 38 28 Z" fill="#1e293b"/>
    <circle cx="25" cy="27" r="11" fill="#fed7aa"/>
    <!-- Body / Hoodie (Teal) -->
    <path d="M13 38 Q25 35 37 38 L43 65 Q25 70 7 65 Z" fill="#0ea5e9"/>
    <!-- Pointing Arm -->
    <path d="M33 45 Q50 35 55 30" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Happy Face -->
    <circle cx="21" cy="25" r="1.5" fill="#1e293b"/>
    <circle cx="29" cy="25" r="1.5" fill="#1e293b"/>
    <path d="M23 30 Q25 33 27 30" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="19" cy="28" r="2" fill="#f43f5e" opacity="0.5"/>
    <circle cx="31" cy="28" r="2" fill="#f43f5e" opacity="0.5"/>
  </g>

  <!-- Character 2 (Parent / Woman smiling) -->
  <g transform="translate(120, 80)">
    <!-- Hair bun & Head -->
    <circle cx="35" cy="20" r="7" fill="#1e293b"/>
    <circle cx="35" cy="30" r="16" fill="#1e293b"/>
    <circle cx="35" cy="32" r="14" fill="#fbcfe8"/>
    <!-- Body / Cardigan (Warm Amber/Coral) -->
    <path d="M18 50 Q35 45 52 50 L60 90 Q35 95 10 90 Z" fill="#f43f5e"/>
    <path d="M28 50 L35 90 L42 50 Z" fill="#ffe4e6"/>
    <!-- Arm holding basket/gesture -->
    <path d="M22 55 Q10 65 15 75" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Face -->
    <circle cx="30" cy="30" r="1.5" fill="#1e293b"/>
    <circle cx="40" cy="30" r="1.5" fill="#1e293b"/>
    <path d="M33 36 Q35 39 37 36" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="27" cy="33" r="2.5" fill="#fb7185" opacity="0.5"/>
    <circle cx="43" cy="33" r="2.5" fill="#fb7185" opacity="0.5"/>
  </g>

  <!-- Garden Prop: Watering Can -->
  <g transform="translate(170, 140)">
    <path d="M0 15 Q5 0 20 5 L25 25 Q0 30 0 15 Z" fill="#fbbf24"/>
    <path d="M20 12 L35 5" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M-5 12 Q-12 15 -8 22" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Lighting & Sparkles Emphasizing "鲜艳" (Vibrant / Brightness) -->
  <g fill="#fef08a">
    <circle cx="105" cy="135" r="2" opacity="0.9"/>
    <path d="M105 130 L105 140 M100 135 L110 135" stroke="#fef08a" stroke-width="1" opacity="0.8"/>

    <circle cx="140" cy="130" r="2.5" opacity="0.9"/>
    <path d="M140 124 L140 136 M134 130 L146 130" stroke="#fef08a" stroke-width="1" opacity="0.8"/>

    <circle cx="70" cy="145" r="1.5" opacity="0.8"/>
    <circle cx="165" cy="150" r="2" opacity="0.9"/>
    <path d="M165 145 L165 155 M160 150 L170 150" stroke="#fef08a" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Soft vignette framing -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>
</svg>