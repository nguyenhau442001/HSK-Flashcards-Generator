<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Amber Glow (Noise/Disturbance) -->
    <radialGradient id="soundGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Bedding Gradient -->
    <linearGradient id="bedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pillow Gradient -->
    <linearGradient id="pillowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    
    <!-- Heavy Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Room Elements -->
  <!-- Window with Night City Glow -->
  <g opacity="0.3">
    <rect x="170" y="25" width="45" height="70" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <line x1="192" y1="25" x2="192" y2="95" stroke="#475569" stroke-width="2"/>
    <line x1="170" y1="60" x2="215" y2="60" stroke="#475569" stroke-width="2"/>
    <!-- City Lights outside -->
    <rect x="175" y="35" width="6" height="10" fill="#f59e0b" />
    <rect x="185" y="50" width="8" height="15" fill="#38bdf8" />
    <rect x="200" y="40" width="10" height="25" fill="#f43f5e" />
  </g>

  <!-- Sound Waves/Noise Source (The Obstruction) -->
  <circle cx="45" cy="65" r="50" fill="url(#soundGlow)" />
  
  <!-- Megaphone/Noise Icon representing disturbance -->
  <g transform="translate(25, 45) scale(0.8)" filter="url(#shadow)">
    <!-- Sound Waves -->
    <path d="M-10,15 C-20,10 -20,-5 -10,-10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M-4,22 C-18,15 -18,-10 -4,-17" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Speaker Body -->
    <path d="M0,5 L10,0 L10,30 L0,25 Z" fill="#fb923c" />
    <path d="M10,0 L30,-10 L30,40 L10,30 Z" fill="#f59e0b" />
    <path d="M30,-10 C35,-10 38,-5 38,15 C38,35 35,40 30,40 Z" fill="#d97706" />
    <!-- Handle -->
    <rect x="5" y="27" width="6" height="15" rx="3" fill="#b45309" />
  </g>

  <!-- Bed & Sleeping Character (The Context) -->
  <!-- Bed Frame/Base -->
  <rect x="65" y="140" width="150" height="65" rx="8" fill="#1e293b" filter="url(#shadow)" />
  <rect x="70" y="130" width="140" height="20" rx="6" fill="#334155" />

  <!-- Mattress -->
  <rect x="65" y="105" width="155" height="40" rx="8" fill="#f8fafc" />

  <!-- Pillow -->
  <rect x="75" y="110" width="45" height="30" rx="8" fill="url(#pillowGrad)" filter="url(#shadow)" />

  <!-- Character Under Covers (Resting/Frustrated) -->
  <g id="sleeping-character">
    <!-- Blanket/Comforter -->
    <path d="M 90 145 Q 120 120 160 145 T 220 140 L 220 150 L 90 150 Z" fill="url(#bedGrad)" filter="url(#shadow)" />
    <path d="M 90 145 Q 120 120 160 145 T 220 140" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Character Head poking out, disturbed -->
    <circle cx="95" cy="125" r="14" fill="#ffedd5" />
    <!-- Closed Frustrated Eyes (Diagonal lines) -->
    <line x1="91" y1="123" x2="95" y2="126" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <line x1="96" y1="126" x2="100" y2="123" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <!-- Frowning Mouth -->
    <path d="M 93 133 Q 95 131 97 133" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M 83 123 C 83 115 90 112 97 114 C 104 112 110 116 107 124 Z" fill="#78350f" />
    
    <!-- Hands holding pillow over ears -->
    <circle cx="102" cy="118" r="5" fill="#ffedd5" />
  </g>

  <!-- Visualizing the Obstruction (Sound Waves disrupting sleep) -->
  <!-- Jagged ZZZs turned into chaotic red/amber warning pulses near the ear -->
  <g transform="translate(115, 95)" filter="url(#glow)">
    <path d="M0,15 L10,5 L5,5 L15,-5" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12,25 L24,12 L18,12 L30,0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- Foreground Props: Nightstand & Alarm Clock (Going off, causing hindrance to rest) -->
  <g transform="translate(20, 115)">
    <!-- Nightstand -->
    <rect x="0" y="25" width="40" height="50" rx="4" fill="#475569" filter="url(#shadow)" />
    <rect x="5" y="32" width="30" height="15" rx="2" fill="#334155" />
    <circle cx="20" cy="40" r="2" fill="#94a3b8" />

    <!-- Clock -->
    <path d="M 13 12 A 9 9 0 1 1 27 12 A 9 9 0 1 1 13 12" fill="#f1f5f9" stroke="#0f172a" stroke-width="2" />
    <!-- Clock hands -->
    <line x1="20" y1="12" x2="23" y2="8" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <line x1="20" y1="12" x2="16" y2="10" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <!-- Bells on top -->
    <path d="M 14 5 L 26 5" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <circle cx="20" cy="4" r="2" fill="#ef4444" />
    
    <!-- Vibration / Sound lines from clock -->
    <path d="M 8 10 C 5 12 5 15 8 17" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <path d="M 32 10 C 35 12 35 15 32 17" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Ambient lighting/atmosphere particles -->
  <circle cx="140" cy="60" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="160" cy="80" r="1.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="70" cy="50" r="2.5" fill="#f43f5e" opacity="0.5" />
</svg>