<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="desk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="alert-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Office Environment / Wallpaper details -->
  <g opacity="0.3">
    <line x1="0" y1="60" x2="240" y2="60" stroke="#475569" stroke-width="1"/>
    <line x1="0" y1="120" x2="240" y2="120" stroke="#475569" stroke-width="0.5"/>
    <rect x="180" y="30" width="30" height="40" rx="4" fill="#334155"/>
    <circle cx="195" cy="50" r="8" fill="#64748b"/>
  </g>

  <!-- Window showing night/city context -->
  <path d="M20 25 L80 25 L80 95 L20 95 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <path d="M35 35 L50 35 L50 60 L35 60 Z" fill="#38bdf8" opacity="0.2"/>
  <path d="M55 45 L70 45 L70 80 L55 80 Z" fill="#f59e0b" opacity="0.15"/>
  <line x1="50" y1="25" x2="50" y2="95" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="60" x2="80" y2="60" stroke="#334155" stroke-width="2"/>

  <!-- Desk Surface -->
  <path d="M10 180 L230 180 L240 215 L0 215 Z" fill="url(#desk)"/>
  <path d="M0 180 L240 180" stroke="#64748b" stroke-width="2"/>

  <!-- Computer Monitor (The "Situation" dashboard) -->
  <rect x="90" y="75" width="90" height="60" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <rect x="94" y="79" width="82" height="52" fill="url(#screen-glow)"/>
  <!-- UI elements on screen showing unusual data -->
  <rect x="100" y="87" width="35" height="6" rx="2" fill="#38bdf8"/>
  <rect x="100" y="97" width="70" height="4" rx="2" fill="#64748b"/>
  <rect x="100" y="105" width="50" height="4" rx="2" fill="#64748b"/>
  <!-- Unusual spike graph in red/amber -->
  <polyline points="100,123 115,120 130,125 145,100 160,115 170,95" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="170" cy="95" r="3" fill="#ef4444" filter="url(#glow)"/>
  
  <!-- Monitor Stand -->
  <path d="M125 135 L135 135 L140 155 L120 155 Z" fill="#475569"/>
  <rect x="110" y="155" width="40" height="5" rx="2" fill="#64748b"/>

  <!-- Ambient Alarm Glow from screen -->
  <ellipse cx="135" cy="115" rx="45" ry="30" fill="url(#alert-glow)" style="mix-blend-mode: screen;"/>

  <!-- Props on desk -->
  <!-- Coffee mug -->
  <rect x="195" y="155" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M211 160 C216 160 216 170 211 172" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <path d="M197 150 Q203 145 209 150" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Folded papers / File -->
  <path d="M40 175 L75 168 L80 185 L45 192 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M45 168 L70 163 L75 175 L50 180 Z" fill="#e2e8f0"/>

  <!-- Main Character (Specialist / Professional dealing with the situation) -->
  <!-- Chair Back -->
  <path d="M140 100 L170 100 L165 175 L145 175 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Character Body / Torso -->
  <path d="M120 130 C120 115 145 115 150 130 L160 175 L110 175 Z" fill="#2563eb"/>
  <!-- Collar / Shirt -->
  <path d="M130 130 L135 142 L140 130 Z" fill="#f8fafc"/>

  <!-- Character Arms / Hands in a gesture of surprise/analysis -->
  <!-- Left arm holding chin/cheek -->
  <path d="M120 135 C110 140 100 135 105 125 C108 120 115 125 118 132 Z" fill="#fb923c"/>
  <path d="M110 138 L125 155 L135 145" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head & Face -->
  <circle cx="135" cy="110" r="18" fill="#fed7aa"/>
  
  <!-- Hair -->
  <path d="M118 110 C118 95 152 95 152 110 C152 115 148 105 135 102 C122 105 118 115 118 110 Z" fill="#334155"/>

  <!-- Expression: Focused, slightly surprised/concerned eyes and eyebrows -->
  <circle cx="129" cy="108" r="1.5" fill="#1e293b"/>
  <circle cx="141" cy="108" r="1.5" fill="#1e293b"/>
  <!-- Eyebrows raised for "special/unexpected" situation -->
  <path d="M126 103 Q129 101 132 104" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M138 104 Q141 101 144 103" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mouth slightly open in realization -->
  <path d="M133 117 Q135 120 137 117" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Magnifying glass highlighting the "special" alert on screen -->
  <g transform="translate(145, 75)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#f59e0b" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="16" fill="#38bdf8" fill-opacity="0.1"/>
    <line x1="11" y1="11" x2="24" y2="24" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Floating accent particles indicating importance / special nature -->
  <g fill="#f59e0b" opacity="0.8">
    <circle cx="185" cy="65" r="3" filter="url(#glow)"/>
    <circle cx="195" cy="95" r="2"/>
    <circle cx="175" cy="45" r="1.5"/>
  </g>
</svg>