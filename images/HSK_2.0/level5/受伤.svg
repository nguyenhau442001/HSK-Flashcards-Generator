<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Track/Ground -->
    <path d="M0 140 L160 140 L170 170 L-10 170 Z" fill="#334155"/>
    
    <!-- Fallen Runner -->
    <g transform="translate(80, 130)">
      <!-- Leg with bandage -->
      <path d="M-10 -20 L10 -20 L15 20 L-15 20 Z" fill="#f8fafc"/>
      <rect x="-18" y="-5" width="40" height="12" rx="4" fill="#ec4899"/>
      <circle cx="-5" cy="0" r="3" fill="#fb923c"/>
      
      <!-- Body -->
      <path d="M-20 -60 Q0 -80 20 -60 L10 -20 L-30 -20 Z" fill="#38bdf8"/>
      <circle cx="0" cy="-70" r="15" fill="#fde68a"/>
      <path d="M-5 -75 L5 -75 M-5 -68 L5 -68" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Sports context props -->
    <circle cx="20" cy="150" r="8" fill="#fbbf24"/>
    <path d="M120 120 L140 100 L160 120" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Speed lines/Atmosphere -->
    <path d="M10 40 L40 40" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M130 50 L150 50" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
</svg>