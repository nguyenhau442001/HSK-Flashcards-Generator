<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <path d="M0 180 Q120 170 240 180 L240 240 L0 240 Z" fill="#1e293b"/>
  
  <!-- Classroom Background Elements -->
  <rect x="40" y="40" width="160" height="80" rx="4" fill="#064e3b" stroke="#334155" stroke-width="2"/>
  <rect x="50" y="105" width="20" height="4" rx="1" fill="#f8fafc" opacity="0.3"/>
  <rect x="170" y="50" width="20" height="25" rx="2" fill="#10b981" opacity="0.2"/>
  
  <!-- Desk -->
  <path d="M140 160 L220 160 L210 190 L130 190 Z" fill="#334155"/>
  <rect x="180" y="145" width="25" height="15" rx="2" fill="#fb923c" opacity="0.8"/>
  
  <!-- Teacher Character -->
  <g transform="translate(165, 95)">
    <!-- Body -->
    <path d="M0 35 Q0 85 15 85 Q30 85 30 35 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="15" cy="15" r="12" fill="#fdba74"/>
    <!-- Hair -->
    <path d="M3 12 Q3 0 15 0 Q27 0 27 12 L27 15 L3 15 Z" fill="#475569"/>
    <!-- Glasses -->
    <path d="M7 16 H23" stroke="#1e293b" stroke-width="0.5"/>
    <circle cx="10" cy="17" r="2.5" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    <circle cx="20" cy="17" r="2.5" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    <!-- Arms -->
    <path d="M0 40 Q-10 55 -5 70" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Student Character (Bowing slightly) -->
  <g transform="translate(50, 105)">
    <!-- Body (Angled) -->
    <path d="M25 35 L45 45 L35 85 L15 75 Z" fill="#fbbf24"/>
    <!-- Head -->
    <circle cx="28" cy="18" r="11" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M18 15 Q18 5 28 5 Q38 5 38 15 L38 18 L18 18 Z" fill="#1e293b"/>
    <!-- Arms (Extended with respect) -->
    <path d="M40 45 L75 45" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M40 52 L75 52" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- The Object of Respect (A Book/Assignment) -->
  <g transform="translate(120, 142)">
    <rect x="0" y="0" width="25" height="18" rx="2" fill="#f8fafc" transform="rotate(-5)"/>
    <path d="M5 5 H20 M5 9 H20 M5 13 H15" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Warm Glow/Atmosphere -->
  <circle cx="140" cy="140" r="60" fill="url(#glowGradient)" opacity="0.15"/>
  
  <defs>
    <radialGradient id="glowGradient">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Small Details -->
  <circle cx="210" cy="150" r="3" fill="#10b981" opacity="0.6"/> <!-- Small plant leaf -->
  <path d="M210 150 Q215 140 220 150" stroke="#10b981" stroke-width="1" fill="none"/>
</svg>