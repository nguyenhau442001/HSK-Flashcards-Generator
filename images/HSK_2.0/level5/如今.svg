<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Hologram/Screen Glow Gradient -->
    <linearGradient id="holo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Warm Window Glow -->
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior Background Environment -->
  <!-- Left Wall & Window (Past / Traditional hint) -->
  <path d="M0 0 H90 V180 H0 Z" fill="#1e293b" />
  <rect x="20" y="20" width="50" height="80" rx="6" fill="#334155" />
  <rect x="24" y="24" width="42" height="72" rx="4" fill="url(#window-grad)" />
  <path d="M45 24 V96 M24 60 H66" stroke="#1e293b" stroke-width="3" />
  
  <!-- Modern Smart Home Interior (Present / "如今") -->
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" />
  <path d="M0 180 L240 180" stroke="#334155" stroke-width="2" />

  <!-- Background Wall Details (Smart Panels & Lighting) -->
  <rect x="110" y="30" width="100" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Futuristic/Modern UI Hologram Display inside wall screen -->
  <circle cx="160" cy="85" r="35" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="160" cy="85" r="25" fill="none" stroke="#10b981" stroke-width="3" opacity="0.4" />
  <path d="M145 95 L155 75 L165 90 L175 65" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Smart Plant Pot & Plant (Nature integrated with tech) -->
  <path d="M95 155 L105 180 H75 L85 155 Z" fill="#475569" />
  <ellipse cx="90" cy="155" rx="15" ry="4" fill="#64748b" />
  <!-- Plant stems & leaves -->
  <path d="M90 151 Q80 120 70 110" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M90 151 Q100 115 115 105" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M90 151 Q90 110 90 95" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <circle cx="70" cy="110" r="8" fill="#10b981" />
  <circle cx="115" cy="105" r="10" fill="#34d399" />
  <circle cx="90" cy="95" r="9" fill="#10b981" />

  <!-- Modern Desk / Surface -->
  <path d="M120 160 H230 V180 H120 Z" fill="#334155" filter="url(#shadow)" />
  <path d="M120 160 H230 V164 H120 Z" fill="#475569" />
  <rect x="135" y="145" width="20" height="15" rx="3" fill="#64748b" /> <!-- Coffee mug -->
  <path d="M175 140 H215 V160 H175 Z" fill="#64748b" rx="2" /> <!-- Laptop base -->
  <path d="M170 100 H220 V140 H170 Z" fill="#1e293b" rx="4" stroke="#38bdf8" stroke-width="1.5" /> <!-- Laptop screen -->
  <path d="M180 115 L195 125 L210 110" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /> <!-- Screen graphic -->

  <!-- MAIN CHARACTER (Expressive, modern young person experiencing life's changes) -->
  <!-- Character Body / Hoodie -->
  <path d="M55 180 C55 155 70 145 90 145 C110 145 125 155 125 180 Z" fill="#fb923c" filter="url(#shadow)" />
  <path d="M90 145 L80 170 H100 Z" fill="#ea580c" /> <!-- Hoodie pocket/accent -->
  
  <!-- Neck -->
  <rect x="82" y="132" width="16" height="18" fill="#fbcfe8" />

  <!-- Head & Face -->
  <circle cx="90" cy="115" r="22" fill="#fbcfe8" filter="url(#shadow)" />
  
  <!-- Modern Hair Style -->
  <path d="M68 115 C68 95 112 95 112 115 C112 120 110 110 105 105 C95 95 85 95 75 102 C70 106 68 110 68 115 Z" fill="#1e293b" />
  <path d="M72 108 Q85 92 105 105" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

  <!-- Facial Expressions (Amazed / Delighted by modern changes) -->
  <!-- Eyes (Happy crescents/dots) -->
  <circle cx="82" cy="115" r="2.5" fill="#1e293b" />
  <circle cx="98" cy="115" r="2.5" fill="#1e293b" />
  <!-- Cheeks -->
  <circle cx="78" cy="120" r="4" fill="#fda4af" opacity="0.6" />
  <circle cx="102" cy="120" r="4" fill="#fda4af" opacity="0.6" />
  <!-- Open joyful smile -->
  <path d="M86 123 Q90 128 94 123" fill="#1e293b" />

  <!-- Arms / Gesturing (Showing change and advancement) -->
  <!-- Left Arm (Holding phone/device) -->
  <path d="M60 155 Q50 165 65 175" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round" />
  <!-- Smartphone in hand -->
  <rect x="52" y="165" width="14" height="22" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-15 59 176)" />
  <path d="M55 172 H63 M55 177 H60" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" transform="rotate(-15 59 176)" />

  <!-- Right Arm (Raised in wonder/expression of "so much change!") -->
  <path d="M120 150 Q135 135 125 120" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round" />
  <circle cx="125" cy="116" r="6" fill="#fbcfe8" /> <!-- Right hand -->

  <!-- Floating UI / Progress Elements representing "Big Changes" (如今生活变化很大) -->
  <!-- Upward Trend Chart Icon (Floating Hologram) -->
  <g transform="translate(145, 35)">
    <rect x="0" y="0" width="30" height="30" rx="8" fill="#38bdf8" opacity="0.2" />
    <path d="M7 22 L13 14 L18 17 L23 8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="23" cy="8" r="3" fill="#38bdf8" />
  </g>

  <!-- Sparkles / Modernity Effects -->
  <path d="M130 90 L133 97 L140 100 L133 103 L130 110 L127 103 L120 100 L127 97 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M40 70 L42 75 L47 77 L42 79 L40 84 L38 79 L33 77 L38 75 Z" fill="#38bdf8" opacity="0.8" />
  <circle cx="110" cy="65" r="3" fill="#ec4899" opacity="0.7" />

</svg>