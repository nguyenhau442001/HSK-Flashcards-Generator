<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Warm Glow Background Effect -->
  <circle cx="120" cy="110" r="80" fill="#f59e0b" opacity="0.12" filter="blur(16px)"/>
  <circle cx="120" cy="95" r="45" fill="#fbbf24" opacity="0.2" filter="blur(8px)"/>

  <!-- Interior Café / Cozy Room Context Props -->
  <!-- Background wall and window -->
  <rect x="30" y="30" width="180" height="130" rx="12" fill="#1e293b"/>
  <path d="M 30 130 L 210 130" stroke="#334155" stroke-width="2"/>
  
  <!-- Cozy wall shelf with props -->
  <rect x="50" y="55" width="60" height="4" rx="2" fill="#475569"/>
  <circle cx="65" cy="45" r="8" fill="#38bdf8" opacity="0.7"/>
  <path d="M 85 55 L 85 40 C 85 37 90 37 90 40 L 90 55" fill="#f43f5e" opacity="0.8"/>

  <!-- Hanging warm lamp casting light -->
  <path d="M 170 30 L 170 60" stroke="#64748b" stroke-width="2"/>
  <path d="M 155 60 L 185 60 L 195 75 L 145 75 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M 145 75 L 195 75 L 220 130 L 120 130 Z" fill="#fbbf24" opacity="0.08"/>

  <!-- Wooden Table in foreground -->
  <rect x="20" y="160" width="200" height="50" rx="8" fill="#334155"/>
  <rect x="35" y="150" width="170" height="12" rx="4" fill="#475569"/>
  <rect x="40" y="210" width="12" height="20" fill="#1e293b"/>
  <rect x="188" y="210" width="12" height="20" fill="#1e293b"/>

  <!-- Coffee Cups & Saucers on Table -->
  <ellipse cx="60" cy="155" rx="12" ry="4" fill="#64748b"/>
  <path d="M 50 145 Q 60 135 70 145 Z" fill="#e2e8f0"/>
  <path d="M 180 150 Q 185 140 190 150 Z" fill="#38bdf8"/>
  <ellipse cx="185" cy="152" rx="10" ry="3" fill="#64748b"/>

  <!-- Main Subject: The Smiling Woman (Upper Body / Bust View leaning forward) -->
  <!-- Torso & Sweater -->
  <path d="M 85 210 C 85 180 95 160 120 160 C 145 160 155 180 155 210 Z" fill="#ec4899"/>
  <!-- Collar / Scarf details representing warmth -->
  <path d="M 100 160 C 120 170 140 160 140 160 C 140 160 145 175 120 175 C 95 175 100 160 100 160 Z" fill="#f43f5e"/>
  <circle cx="120" cy="180" r="6" fill="#fb923c"/>

  <!-- Neck -->
  <rect x="110" y="130" width="20" height="35" rx="8" fill="#fdba74"/>

  <!-- Head & Face Structure -->
  <circle cx="120" cy="105" r="32" fill="#fed7aa"/>

  <!-- Hair (Stylized layered dark hair framing face) -->
  <path d="M 88 100 C 85 75 100 65 120 65 C 140 65 155 75 152 100 C 155 120 145 130 145 130 L 155 140 L 135 125 C 135 125 128 130 120 130 C 105 130 95 120 92 110 Z" fill="#334155"/>
  <path d="M 90 95 C 88 115 95 135 105 142 L 95 130 C 90 120 88 105 90 95 Z" fill="#1e293b"/>

  <!-- Facial Expression: Warm, Radiant Smile -->
  <!-- Soft rosy cheeks highlighting the smile and warmth -->
  <circle cx="103" cy="112" r="7" fill="#fb7185" opacity="0.6" filter="blur(2px)"/>
  <circle cx="137" cy="112" r="7" fill="#fb7185" opacity="0.6" filter="blur(2px)"/>

  <!-- Gentle closed happy smiling eyes (arc lines) -->
  <path d="M 102 100 Q 108 94 114 100" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 126 100 Q 132 94 138 100" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eyebrows (relaxed, friendly) -->
  <path d="M 100 92 Q 107 88 114 93" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 126 93 Q 133 88 140 92" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Cute Button Nose -->
  <path d="M 118 107 Q 120 110 122 107" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Radiantly Warm Open Smile showing kindness -->
  <path d="M 108 114 Q 120 128 132 114 C 132 114 126 122 120 122 C 114 122 108 114 108 114 Z" fill="#e11d48"/>
  <!-- Smile highlight / teeth -->
  <path d="M 112 116 Q 120 122 128 116 C 128 116 124 119 120 119 C 116 119 112 116 112 116 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Expressive Warmth Sparkles / Radiance context elements near the face -->
  <path d="M 80 85 L 83 90 L 88 93 L 83 96 L 80 101 L 77 96 L 72 93 L 77 90 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 160 75 L 162 79 L 166 81 L 162 83 L 160 87 L 158 83 L 154 81 L 158 79 Z" fill="#fbbf24" opacity="0.9"/>
  <circle cx="150" cy="100" r="3" fill="#fb923c" opacity="0.7"/>
  <circle cx="92" cy="75" r="2" fill="#fb923c" opacity="0.6"/>

</svg>