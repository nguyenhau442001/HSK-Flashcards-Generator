<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="desk_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Background room details -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#090d16" opacity="0.6"/>
  <!-- Window with city night view -->
  <path d="M175 35h35v50h-35z" fill="#334155" opacity="0.3"/>
  <path d="M185 45h5v15h-5z M195 50h5v20h-5z" fill="#64748b" opacity="0.4"/>

  <!-- Desk Surface -->
  <path d="M10 170h220v15H10z" fill="#334155"/>
  <path d="M10 185h220v35H10z" fill="#1e293b"/>
  <ellipse cx="120" cy="180" rx="90" ry="20" fill="url(#desk_glow)"/>

  <!-- Computer Monitor (Broken Hardware concept) -->
  <!-- Monitor Stand -->
  <path d="M110 145h20v25h-20z" fill="#64748b"/>
  <path d="M95 170h50v6H95z" fill="#475569"/>
  
  <!-- Monitor Frame -->
  <rect x="70" y="65" width="100" height="82" rx="6" fill="#334155"/>
  <rect x="74" y="69" width="92" height="70" rx="4" fill="#0f172a"/>
  
  <!-- Broken Screen Effect (Glitch/Error pattern) -->
  <rect x="74" y="69" width="92" height="70" fill="url(#screen_glow)"/>
  <path d="M74 90l35 15-20 20 40-10 25 15" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M110 75l-15 30 25 10" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Error pixel artifacts -->
  <rect x="90" y="110" width="12" height="6" fill="#ef4444" opacity="0.8"/>
  <rect x="135" y="85" width="18" height="8" fill="#38bdf8" opacity="0.6"/>
  <rect x="115" y="125" width="8" height="8" fill="#ef4444" opacity="0.7"/>

  <!-- Peripherals -->
  <!-- Keyboard -->
  <rect x="85" y="178" width="70" height="14" rx="3" fill="#475569"/>
  <path d="M90 182h60v2H90z M90 187h50v2H90z" fill="#1e293b"/>

  <!-- Coffee Mug -->
  <rect x="165" y="162" width="14" height="18" rx="2" fill="#cbd5e1"/>
  <path d="M179 167c3 0 5 1 5 4s-2 4-5 4" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <!-- Steam from coffee -->
  <path d="M170 154c0-3 3-4 3-7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Concerned Character (Leaning in, hands on head in frustration) -->
  <!-- Body/Torso -->
  <path d="M30 180c0-20 15-30 30-30s30 10 30 30z" fill="#3b82f6"/>
  <!-- Head -->
  <circle cx="60" cy="115" r="18" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M43 112c2-12 12-16 22-16 12 0 17 6 18 14-3-2-7-3-11-3-8 0-14 3-17 7-4-1-8-2-12-2z" fill="#451a03"/>
  
  <!-- Frustrated Expression (Eyebrows angled down, mouth open in dismay) -->
  <path d="M52 108l6 3 M62 111l6-3" stroke="#451a03" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="54" cy="113" r="1.5" fill="#1e293b"/>
  <circle cx="66" cy="113" r="1.5" fill="#1e293b"/>
  <path d="M57 124c2 2 4 2 6 0" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Hands on head / face of dismay -->
  <circle cx="45" cy="118" r="5" fill="#fbcfe8"/>
  <circle cx="75" cy="118" r="5" fill="#fbcfe8"/>

  <!-- Warning / Alert Sparks (Hardware failure indicator) -->
  <g transform="translate(145, 50)">
    <path d="M0 8l10-14 10 14z" fill="#f59e0b"/>
    <text x="10" y="10" font-family="sans-serif" font-weight="bold" font-size="10" fill="#0f172a" text-anchor="middle">!</text>
  </g>
  <g transform="translate(55, 45) scale(0.7)">
    <path d="M0 8l10-14 10 14z" fill="#ef4444"/>
    <text x="10" y="10" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">!</text>
  </g>

</svg>