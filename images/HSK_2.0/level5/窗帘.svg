  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window Frame -->
  <rect x="40" y="30" width="160" height="180" rx="4" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="44" y="34" width="152" height="172" fill="#0f172a"/>
  
  <!-- Night Sky View -->
  <circle cx="180" cy="60" r="12" fill="#fef3c7"/>
  <circle cx="60" cy="80" r="2" fill="#f8fafc"/>
  <circle cx="120" cy="50" r="1.5" fill="#f8fafc"/>
