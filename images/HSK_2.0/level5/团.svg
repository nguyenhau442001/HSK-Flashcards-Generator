<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character 1 (Left) Colors -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Center) Colors -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Character 3 (Right) Colors -->
    <linearGradient id="shirt3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Character 4 (Back) Colors -->
    <linearGradient id="shirt4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Glowing Effect for 'Group' Unity -->
    <radialGradient id="unityGlow" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full Canvas Base -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Atmosphere: Warm Glowing Background Elements -->
  <circle cx="120" cy="110" r="90" fill="url(#unityGlow)" />
  
  <!-- Subtle Architectural Context (Travel/Tour Agency or Scenic viewpoint window) -->
  <path d="M40,55 L200,55 L200,195 L40,195 Z" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" rx="8" />
  <!-- Window frames / Scenery lines -->
  <path d="M70,55 L70,195 M170,55 L170,195" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
  <path d="M40,95 L200,95" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />

  <!-- Ground Plane / Floor -->
  <ellipse cx="120" cy="195" rx="90" ry="15" fill="url(#groundGrad)" />
  
  <!-- Tour Flag Pole & Guide Props (Contextualizing '团' as an organized group/tour group) -->
  <g transform="translate(180, 85)">
    <!-- Flag Pole -->
    <line x1="0" y1="0" x2="0" y2="110" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Tour Flag -->
    <path d="M0,5 C12,0 24,10 36,5 L36,35 C24,40 12,30 0,35 Z" fill="#fbbf24" />
    <!-- Star/Icon on flag (Abstract shape, no text) -->
    <polygon points="18,12 21,20 29,20 22,25 25,33 18,28 11,33 14,25 7,20 15,20" fill="#ffffff" transform="scale(0.5) translate(14, 12)" />
  </g>

  <!-- CHARACTER GROUP (Showing '他们组成了一个团' - Coming together to form a cohesive group) -->
  
  <!-- Character 1: Left (Blue shirt, welcoming posture) -->
  <g transform="translate(75, 120)">
    <!-- Shadow -->
    <ellipse cx="0" cy="73" rx="14" ry="4" fill="#090d16" opacity="0.6" />
    <!-- Body / Torso -->
    <path d="M-12,35 C-12,20 -5,15 0,15 C5,15 12,20 12,35 L16,68 L-16,68 Z" fill="url(#shirt1)" />
    <!-- Head -->
    <circle cx="0" cy="2" r="12" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M-12,2 C-12,-5 -5,-11 0,-11 C5,-11 12,-5 12,2 C8,0 4,-2 0,-2 C-4,-2 -8,0 -12,2 Z" fill="#1e293b" />
    <!-- Arm gesturing inward -->
    <path d="M-12,28 C-18,32 -22,40 -16,46 C-12,48 -8,40 -6,35" fill="#fed7aa" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <!-- Legs -->
    <rect x="-8" y="65" width="5" height="15" rx="2.5" fill="#334155" />
    <rect x="3" y="65" width="5" height="15" rx="2.5" fill="#334155" />
  </g>

  <!-- Character 2: Center-Left (Orange shirt, smiling, central focus) -->
  <g transform="translate(103, 112)">
    <!-- Shadow -->
    <ellipse cx="0" cy="81" rx="15" ry="4" fill="#090d16" opacity="0.6" />
    <!-- Body -->
    <path d="M-13,38 C-13,22 -6,17 0,17 C6,17 13,22 13,38 L17,76 L-17,76 Z" fill="url(#shirt2)" />
    <!-- Head -->
    <circle cx="0" cy="2" r="13" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M-13,0 C-10,-8 -4,-10 2,-9 C10,-8 13,-2 13,3 C10,1 5,-2 0,-2 C-5,-2 -10,0 -13,0 Z" fill="#78350f" />
    <!-- Arms linked/together -->
    <path d="M-13,32 C-20,35 -24,42 -19,48" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
    <path d="M13,32 C18,35 22,42 19,48" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
    <!-- Legs -->
    <rect x="-8" y="73" width="5" height="15" rx="2.5" fill="#1e293b" />
    <rect x="3" y="73" width="5" height="15" rx="2.5" fill="#1e293b" />
  </g>

  <!-- Character 3: Center-Right (Green shirt, dynamic pose) -->
  <g transform="translate(138, 115)">
    <!-- Shadow -->
    <ellipse cx="0" cy="78" rx="15" ry="4" fill="#090d16" opacity="0.6" />
    <!-- Body -->
    <path d="M-13,36 C-13,20 -6,15 0,15 C6,15 13,20 13,36 L17,73 L-17,73 Z" fill="url(#shirt3)" />
    <!-- Head -->
    <circle cx="0" cy="1" r="12" fill="#ffedd5" />
    <!-- Hair -->
    <path d="M-12,1 C-8,-7 -2,-8 4,-7 C10,-6 12,-1 12,4 C8,1 3,0 0,0 C-4,0 -8,0 -12,1 Z" fill="#0f172a" />
    <!-- Raised Arm showing unity/team spirit -->
    <path d="M13,30 C20,25 24,15 20,10" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" />
    <!-- Legs -->
    <rect x="-8" y="70" width="5" height="15" rx="2.5" fill="#334155" />
    <rect x="3" y="70" width="5" height="15" rx="2.5" fill="#334155" />
  </g>

  <!-- Character 4: Right/Back (Pink shirt, completing the group circle) -->
  <g transform="translate(163, 122)">
    <!-- Shadow -->
    <ellipse cx="0" cy="71" rx="13" ry="3" fill="#090d16" opacity="0.6" />
    <!-- Body -->
    <path d="M-11,32 C-11,18 -5,13 0,13 C5,13 11,18 11,32 L14,66 L-14,66 Z" fill="url(#shirt4)" />
    <!-- Head -->
    <circle cx="0" cy="1" r="11" fill="#fed7aa" />
    <!-- Hair (Ponytail) -->
    <path d="M-11,0 C-8,-6 -3,-8 3,-7 C9,-6 11,0 11,4 C15,6 18,10 18,14 C14,12 11,8 11,4 C5,2 -3,1 -11,0 Z" fill="#475569" />
    <!-- Legs -->
    <rect x="-7" y="63" width="4.5" height="15" rx="2" fill="#1e293b" />
    <rect x="2.5" y="63" width="4.5" height="15" rx="2" fill="#1e293b" />
  </g>

  <!-- Connecting visual arc/badge subtle indicator of group formation -->
  <path d="M75,150 Q120,130 163,150" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Foreground Atmospheric Highlights (Warm ambient lighting) -->
  <circle cx="75" cy="80" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="160" cy="70" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="105" cy="65" r="1" fill="#34d399" opacity="0.8" />
  <circle cx="130" cy="85" r="1.5" fill="#f472b6" opacity="0.8" />
</svg>