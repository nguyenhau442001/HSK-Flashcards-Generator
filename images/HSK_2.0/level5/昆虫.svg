<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Grass Gradient -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Warm Glow for Lantern -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Insect Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Glow/Lighting -->
  <circle cx="160" cy="130" r="80" fill="url(#lanternGlow)" />

  <!-- Background Hills & Trees -->
  <path d="M0 150 Q60 120 120 150 T240 140 L240 200 L0 200 Z" fill="#0f766e" opacity="0.4"/>
  <path d="M0 160 Q80 135 160 165 T240 155 L240 200 L0 200 Z" fill="#047857" opacity="0.6"/>

  <!-- Main Grassland Floor -->
  <path d="M0 170 Q70 150 140 165 T240 160 L240 240 L0 240 Z" fill="url(#grassGrad)"/>

  <!-- Detailed Grass Blades in Foreground -->
  <path d="M10 240 L12 190 L16 240" fill="#059669" />
  <path d="M25 240 L20 195 L30 240" fill="#34d399" opacity="0.8"/>
  <path d="M210 240 L215 185 L220 240" fill="#059669" />
  <path d="M225 240 L230 190 L235 240" fill="#34d399" opacity="0.8"/>

  <!-- Nature Props: Flowers -->
  <circle cx="45" cy="180" r="4" fill="#ec4899"/>
  <circle cx="45" cy="180" r="1.5" fill="#fde047"/>
  <path d="M45 184 L45 200" stroke="#047857" stroke-width="2"/>

  <circle cx="195" cy="190" r="5" fill="#fb923c"/>
  <circle cx="195" cy="190" r="2" fill="#fef08a"/>
  <path d="M195 195 L195 215" stroke="#047857" stroke-width="2"/>

  <!-- Characters (Child and Companion exploring insects) -->
  <!-- Sitting Child Character -->
  <!-- Legs -->
  <path d="M90 205 L65 210 L55 225 L85 225 Z" fill="#1e1b4b"/>
  <!-- Torso & Hoodie -->
  <path d="M75 175 Q90 170 100 190 L95 215 L70 215 L75 175 Z" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="85" cy="155" r="14" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M71 155 Q85 138 99 155 Q95 145 85 143 Q75 145 71 155 Z" fill="#451a03"/>
  <!-- Arm pointing at insects -->
  <path d="M85 185 L110 175 L120 178" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="178" r="4" fill="#fbcfe8"/> <!-- Hand -->

  <!-- Companion Character (Crouching Friend) -->
  <!-- Torso -->
  <path d="M135 180 Q145 170 155 195 L150 220 L130 220 Z" fill="#f43f5e"/>
  <!-- Head -->
  <circle cx="145" cy="160" r="13" fill="#ffedd5"/>
  <!-- Hair -->
  <path d="M132 160 Q145 142 158 160 Q150 150 145 150 Q138 150 132 160 Z" fill="#78350f"/>
  <!-- Magnifying Glass held by Companion -->
  <line x1="145" y1="190" x2="130" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="123" cy="212" r="10" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="123" cy="212" r="9" fill="#38bdf8" fill-opacity="0.2"/>

  <!-- INSECTS (昆虫) - Plural, scattered across the grass and air -->
  
  <!-- 1. Ladybug (Main focus near characters) -->
  <g transform="translate(105, 195)">
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="#ef4444"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="0" cy="-4" r="3" fill="#1e293b"/> <!-- Head -->
    <circle cx="-3" cy="1" r="1.5" fill="#1e293b"/>
    <circle cx="3" cy="5" r="1.5" fill="#1e293b"/>
    <path d="M-6 -8 L-10 -12" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
    <path d="M6 -8 L10 -12" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 2. Cute Bumblebee (Flying near pointer) -->
  <g transform="translate(100, 140) rotate(-15)">
    <!-- Wings -->
    <ellipse cx="-2" cy="-6" rx="5" ry="3" fill="url(#wingGrad)" transform="rotate(-30 -2 -6)"/>
    <ellipse cx="4" cy="-6" rx="5" ry="3" fill="url(#wingGrad)" transform="rotate(30 4 -6)"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="9" ry="7" fill="#fbbf24"/>
    <path d="M-3 -7 L-3 7" stroke="#1e293b" stroke-width="2.5"/>
    <path d="M3 -7 L3 7" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="7" cy="-2" r="2" fill="#1e293b"/> <!-- Head -->
    <path d="M8 -5 L11 -8" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 3. Dragonfly (Hovering upper right) -->
  <g transform="translate(180, 100) rotate(25)">
    <!-- Wings -->
    <ellipse cx="-4" cy="-10" rx="3" ry="12" fill="url(#wingGrad)" transform="rotate(-40 -4 -10)"/>
    <ellipse cx="4" cy="-10" rx="3" ry="12" fill="url(#wingGrad)" transform="rotate(40 4 -10)"/>
    <ellipse cx="-4" cy="2" rx="2" ry="9" fill="url(#wingGrad)" transform="rotate(-20 -4 2)"/>
    <ellipse cx="4" cy="2" rx="2" ry="9" fill="url(#wingGrad)" transform="rotate(20 4 2)"/>
    <!-- Long Body -->
    <path d="M0 -15 L0 18" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-16" r="3.5" fill="#047857"/>
  </g>

  <!-- 4. Butterfly (Floating gracefully) -->
  <g transform="translate(55, 110) rotate(-10)">
    <!-- Wings -->
    <path d="M0 0 C-15 -15 -20 5 0 10 C20 5 15 -15 0 0 Z" fill="#ec4899"/>
    <path d="M0 2 C-10 10 -15 22 0 18 C15 22 10 10 0 2 Z" fill="#f43f5e"/>
    <!-- Body & Antennae -->
    <ellipse cx="0" cy="10" rx="1.5" ry="8" fill="#1e293b"/>
    <path d="M0 2 L-4 -4" stroke="#1e293b" stroke-width="1"/>
    <path d="M0 2 L4 -4" stroke="#1e293b" stroke-width="1"/>
    <!-- Sparkles on wings -->
    <circle cx="-7" cy="-2" r="1" fill="#fef08a"/>
    <circle cx="7" cy="-2" r="1" fill="#fef08a"/>
  </g>

  <!-- 5. Another small Beetle in foreground -->
  <g transform="translate(160, 210)">
    <ellipse cx="0" cy="0" rx="6" ry="8" fill="#3b82f6"/>
    <circle cx="0" cy="-6" r="2.5" fill="#1e293b"/>
    <path d="M-5 -2 L-8 -5" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
    <path d="M5 -2 L8 -5" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric Glow Particles / Fireflies -->
  <circle cx="130" cy="130" r="2.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="150" cy="115" r="1.5" fill="#fef08a" opacity="0.7"/>
  <circle cx="170" cy="140" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="85" cy="120" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="35" cy="145" r="2" fill="#fef08a" opacity="0.8"/>

  <!-- Ground Details: Small pebbles/rocks -->
  <ellipse cx="75" cy="215" rx="5" ry="2" fill="#475569"/>
  <ellipse cx="175" cy="220" rx="7" ry="2.5" fill="#475569"/>
  <ellipse cx="120" cy="225" rx="4" ry="1.5" fill="#475569"/>
</svg>