<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="flashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Environmental Context: Room Interior -->
  <rect x="20" y="30" width="200" height="150" rx="8" fill="#334155" opacity="0.4" />
  <!-- Window Grid -->
  <line x1="120" y1="30" x2="120" y2="180" stroke="#475569" stroke-width="2" />
  <line x1="20" y1="105" x2="220" y2="105" stroke="#475569" stroke-width="2" />
  <!-- Interior Desk / Surface -->
  <path d="M20 180 L220 180 L230 210 L10 210 Z" fill="#475569" opacity="0.6" />

  <!-- Dramatic "Reaction" Lighting Effects (强烈 - Strong Reaction) -->
  <circle cx="120" cy="100" r="90" fill="url(#flashGlow)" />
  <polygon points="120,40 140,80 180,70 150,100 170,140 130,120 100,150 110,110 70,100 100,70" fill="url(#beamGrad)" opacity="0.8" />

  <!-- Character: Male reacting strongly (shocked, jumping back, dramatic expression) -->
  <g id="character">
    <!-- Body / Torso (leaning back dynamically) -->
    <path d="M100 150 L125 125 L145 160 L130 185 Z" fill="#38bdf8" />
    
    <!-- Head -->
    <circle cx="115" cy="105" r="18" fill="#fbcfe8" />
    
    <!-- Spiky/Blown-back hair due to strong reaction -->
    <path d="M98 100 C95 85 110 80 120 85 C130 75 145 90 135 105 C140 110 135 115 130 110 Z" fill="#0f172a" />

    <!-- Shocked face features -->
    <circle cx="110" cy="103" r="2" fill="#0f172a" />
    <circle cx="122" cy="103" r="2" fill="#0f172a" />
    <ellipse cx="116" cy="113" rx="3" ry="5" fill="#0f172a" /> <!-- Open mouth -->

    <!-- Arms acting out strong surprise / defense -->
    <!-- Left arm raised up -->
    <path d="M105 125 L80 100 L70 110 L95 135 Z" fill="#fbcfe8" />
    <!-- Right arm thrust back -->
    <path d="M135 135 L165 120 L170 132 L145 145 Z" fill="#fbcfe8" />

    <!-- Legs planted and shifting back -->
    <path d="M115 180 L95 210 L110 215 L125 185 Z" fill="#1e293b" />
    <path d="M135 180 L155 210 L140 215 L130 185 Z" fill="#1e293b" />
  </g>

  <!-- Props emphasizing the sudden dramatic trigger / news / event -->
  <!-- Falling / Dropped Coffee Mug on Desk -->
  <ellipse cx="65" cy="180" rx="12" ry="6" fill="#fb923c" />
  <path d="M53 175 L57 190 C57 193 73 193 77 190 L81 175 Z" fill="#f97316" />
  <path d="M79 179 C85 179 87 185 81 187" stroke="#f97316" stroke-width="2" fill="none" />
  <!-- Splashing liquid from mug -->
  <path d="M45 170 Q50 160 60 168 Q55 175 45 170 Z" fill="#38bdf8" opacity="0.8" />
  <circle cx="40" cy="165" r="2" fill="#38bdf8" />
  <circle cx="35" cy="172" r="1.5" fill="#38bdf8" />

  <!-- Action lines / Impact lines indicating intensity (强烈) -->
  <path d="M180 80 L200 70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M190 110 L215 110" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M180 140 L200 150" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M50 80 L35 70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M40 110 L20 110" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />

</svg>