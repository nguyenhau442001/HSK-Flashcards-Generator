<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Glow / Exterior light -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Screen Glow (New Business Dashboard) -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Warm Desk Lamp Light -->
    <radialGradient id="lampLight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Context: Office Interior -->
  <!-- Back Wall / Window Frame -->
  <rect x="25" y="20" width="95" height="110" rx="4" fill="url(#windowGlow)" stroke="#334155" stroke-width="2" />
  <!-- Window Panes -->
  <line x1="72" y1="20" x2="72" y2="130" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="75" x2="120" y2="75" stroke="#334155" stroke-width="2" />
  
  <!-- Cityscape silhouette outside window -->
  <path d="M35 130 L35 105 L42 105 L42 130 L55 130 L55 90 L63 90 L63 130 L80 130 L80 80 L92 80 L92 130 L110 130 L110 100 L115 100 L115 130 Z" fill="#334155" opacity="0.5" />

  <!-- Bookshelf / Plant props in background -->
  <rect x="190" y="30" width="30" height="90" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="190" y1="60" x2="220" y2="60" stroke="#334155" stroke-width="1.5" />
  <line x1="190" y1="90" x2="220" y2="90" stroke="#334155" stroke-width="1.5" />
  <!-- Plant Pot -->
  <path d="M198 52 L212 52 L210 59 L200 59 Z" fill="#64748b" />
  <path d="M205 52 Q202 42 196 38 Q205 45 205 52 Z" fill="#10b981" />
  <path d="M205 52 Q208 43 214 40 Q205 46 205 52 Z" fill="#34d399" />

  <!-- Warm Light Cone from Desk Lamp -->
  <path d="M150 15 L115 145 L185 145 Z" fill="url(#lampLight)" />

  <!-- Desk Surface -->
  <path d="M15 145 L225 145 L215 210 L25 210 Z" fill="#334155" />
  <rect x="15" y="140" width="210" height="8" rx="2" fill="#475569" />

  <!-- Desk Props: Coffee Mug -->
  <rect x="35" y="132" width="14" height="16" rx="3" fill="#cbd5e1" />
  <path d="M49 136 C53 136 53 144 49 144" stroke="#cbd5e1" stroke-width="2" fill="none" />

  <!-- Secondary Tablet/Notebook for New Strategy (Expanding Business) -->
  <g transform="translate(165, 138) rotate(-10)">
    <rect width="32" height="22" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <path d="M5 6 L18 6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M5 11 L25 11" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M5 16 L12 16" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Main Laptop (Centerpiece showing data expansion) -->
  <g transform="translate(90, 115)">
    <!-- Laptop Base -->
    <path d="M-22 30 L52 30 L40 38 L-10 38 Z" fill="#64748b" />
    <rect x="-8" y="38" width="46" height="3" rx="1.5" fill="#94a3b8" />
    <!-- Laptop Screen -->
    <rect x="-18" y="-12" width="64" height="43" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <!-- Screen Display: Growth Chart & Network Nodes (Expanding Business) -->
    <rect x="-12" y="-7" width="52" height="33" rx="2" fill="url(#screenGlow)" />
    <!-- Rising Graph Line -->
    <path d="M-6 18 L6 12 L16 15 L32 4" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="32" cy="4" r="3" fill="#10b981" />
    <!-- Expansion Nodes / Icons -->
    <circle cx="6" cy="12" r="2" fill="#fbbf24" />
    <circle cx="16" cy="15" r="2" fill="#fbbf24" />
    <path d="M6 12 L16 15 L32 4" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 2" fill="none" />
  </g>

  <!-- Desk Lamp -->
  <path d="M150 50 L150 85" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M140 40 L160 40 L165 50 L135 50 Z" fill="#fbbf24" />
  <ellipse cx="150" cy="85" rx="10" ry="4" fill="#64748b" />

  <!-- MAIN CHARACTER (Professional analyzing/expanding business) -->
  <!-- Torso & Shoulders -->
  <path d="M90 195 C90 170 105 160 120 160 C135 160 150 170 150 195 Z" fill="#3b82f6" />
  <!-- Shirt Collar & Tie -->
  <path d="M112 160 L120 174 L128 160 Z" fill="#f8fafc" />
  <path d="M118 174 L120 195 L122 174 Z" fill="#ef4444" />

  <!-- Head & Face -->
  <circle cx="120" cy="132" r="20" fill="#fbcfe8" />
  <!-- Hair (Modern stylish cut) -->
  <path d="M100 130 C100 115 110 110 120 110 C132 110 140 118 140 132 C135 125 125 120 120 120 C110 120 105 125 100 130 Z" fill="#334155" />
  <path d="M102 127 C105 120 115 118 123 119" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none" />
  
  <!-- Friendly, Confident Expression -->
  <circle cx="113" cy="132" r="2" fill="#1e293b" />
  <circle cx="127" cy="132" r="2" fill="#1e293b" />
  <path d="M117 141 Q120 145 123 141" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Rosy cheeks -->
  <circle cx="110" cy="136" r="3" fill="#f43f5e" opacity="0.3" />
  <circle cx="130" cy="136" r="3" fill="#f43f5e" opacity="0.3" />

  <!-- Arms actively pointing/interacting with the business plan/laptop -->
  <!-- Left arm (resting on desk) -->
  <path d="M98 175 L80 185 L90 195" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="90" cy="195" r="4" fill="#fbcfe8" />

  <!-- Right arm (gesture pointing at screen/strategy) -->
  <path d="M142 170 L158 150 L148 138" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="148" cy="138" r="4" fill="#fbcfe8" />

  <!-- Floating Strategic Growth Visual Elements (Symbolizing "Expanding New Business" cleanly without text) -->
  <!-- Floating Arrow Up-Right (Growth) -->
  <g transform="translate(180, 75)">
    <circle cx="12" cy="12" r="14" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <path d="M6 16 L18 8 M12 8 L18 8 L18 14" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Floating Global/Network Icon (Expanding markets) -->
  <g transform="translate(30, 45)">
    <circle cx="12" cy="12" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <ellipse cx="12" cy="12" rx="5" ry="10" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <path d="M2 12 L22 12" stroke="#38bdf8" stroke-width="1.5" />
  </g>

</svg>