<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Glows (Industrial lighting) -->
  <circle cx="180" cy="80" r="50" fill="#f59e0b" opacity="0.15" filter="blur(15px)"/>
  <circle cx="70" cy="120" r="40" fill="#38bdf8" opacity="0.1" filter="blur(10px)"/>

  <!-- Background Factory Silhouettes -->
  <g opacity="0.4">
    <!-- Factory Building 1 -->
    <polygon points="30,160 30,100 55,80 80,100 80,160" fill="#334155"/>
    <rect x="40" y="110" width="12" height="15" fill="#f59e0b" opacity="0.6"/>
    <rect x="58" y="110" width="12" height="15" fill="#f59e0b" opacity="0.6"/>
    
    <!-- Factory Building 2 (Tall smokestacks) -->
    <rect x="95" y="90" width="45" height="70" fill="#475569"/>
    <rect x="105" y="55" width="8" height="35" fill="#334155"/>
    <rect x="122" y="45" width="6" height="45" fill="#334155"/>
    <!-- Smoke from stacks -->
    <path d="M109,55 Q105,40 115,30 Q125,20 120,10" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <path d="M125,45 Q130,30 122,20 Q115,10 120,2" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- Midground Industrial Structure (Gantry Crane / Framework) -->
  <g>
    <!-- Cross beams -->
    <rect x="20" y="60" width="200" height="8" rx="2" fill="url(#beamGrad)" filter="url(#shadow)"/>
    <rect x="20" y="72" width="200" height="4" rx="1" fill="#b45309"/>
    
    <!-- Support columns -->
    <rect x="25" y="68" width="12" height="110" fill="#475569"/>
    <line x1="25" y1="90" x2="37" y2="105" stroke="#1e293b" stroke-width="3"/>
    <line x1="37" y1="120" x2="25" y2="135" stroke="#1e293b" stroke-width="3"/>
    <line x1="25" y1="150" x2="37" y2="165" stroke="#1e293b" stroke-width="3"/>

    <rect x="203" y="68" width="12" height="110" fill="#475569"/>
    <line x1="215" y1="90" x2="203" y2="105" stroke="#1e293b" stroke-width="3"/>
    <line x1="203" y1="120" x2="215" y2="135" stroke="#1e293b" stroke-width="3"/>
    <line x1="215" y1="150" x2="203" y2="165" stroke="#1e293b" stroke-width="3"/>
  </g>

  <!-- Overhead Pipes & Valve System -->
  <g>
    <path d="M 0 95 L 85 95 Q 95 95 95 105 L 95 130" fill="none" stroke="url(#pipeGrad)" stroke-width="10" stroke-linecap="round" filter="url(#shadow)"/>
    <!-- Pipe joints -->
    <rect x="85" y="90" width="20" height="12" rx="3" fill="#334155"/>
    <!-- Pressure gauge -->
    <circle cx="95" cy="78" r="8" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="95" y1="78" x2="98" y2="75" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Ground Platform / Floor -->
  <rect x="0" y="175" width="240" height="65" fill="url(#groundGrad)"/>
  <!-- Floor Hazard Stripes -->
  <g opacity="0.8">
    <polygon points="40,175 60,175 50,185 30,185" fill="#f59e0b"/>
    <polygon points="80,175 100,175 90,185 70,185" fill="#f59e0b"/>
    <polygon points="120,175 140,175 130,185 110,185" fill="#f59e0b"/>
    <polygon points="160,175 180,175 170,185 150,185" fill="#f59e0b"/>
    <polygon points="200,175 220,175 210,185 190,185" fill="#f59e0b"/>
  </g>
  <line x1="0" y1="175" x2="240" y2="175" stroke="#475569" stroke-width="3"/>

  <!-- MAIN ACTION SUBJECT: High-Tech Robotic Manufacturing Arm & Gear Production -->
  <g transform="translate(100, 110)" filter="url(#shadow)">
    <!-- Robotic Arm Base -->
    <path d="M -25 65 L 25 65 L 20 40 L -20 40 Z" fill="#475569"/>
    <rect x="-30" y="60" width="60" height="8" rx="3" fill="#1e293b"/>
    
    <!-- Rotating Turret -->
    <circle cx="0" cy="35" r="18" fill="#cbd5e1"/>
    <circle cx="0" cy="35" r="10" fill="#38bdf8"/>

    <!-- Lower Arm Segment -->
    <g transform="rotate(-15, 0, 35)">
      <rect x="-10" y="-30" width="20" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#475569"/>
      
      <!-- Upper Arm Segment (Angled towards center) -->
      <g transform="translate(0, -30) rotate(50, 0, 0)">
        <rect x="-8" y="-50" width="16" height="60" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
        <circle cx="0" cy="-50" r="7" fill="#475569"/>
        
        <!-- Articulated Laser / Welding Head -->
        <g transform="translate(0, -55)">
          <path d="M -10 -15 L 10 -15 L 6 5 L -6 5 Z" fill="#0ea5e9"/>
          <!-- Glowing Laser Beam Pointing Down -->
          <polygon points="-3,5 3,5 1,45 -1,45" fill="url(#laserGrad)"/>
          <circle cx="0" cy="5" r="3" fill="#ffffff"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Workpiece: Mechanical Gear & Assembly Platform -->
  <g transform="translate(145, 175)" filter="url(#shadow)">
    <!-- Metallic Table/Workbench -->
    <rect x="-35" y="0" width="70" height="8" rx="2" fill="#64748b"/>
    <rect x="-25" y="8" width="8" height="25" fill="#334155"/>
    <rect x="17" y="8" width="8" height="25" fill="#334155"/>

    <!-- Large Industrial Gear being worked on -->
    <g transform="translate(0, -12)">
      <!-- Gear Body -->
      <circle cx="0" cy="0" r="18" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
      <!-- Gear Teeth representation -->
      <circle cx="0" cy="0" r="12" fill="#1e293b"/>
      <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
      <!-- Sparks / Action Details -->
      <path d="M 5 -15 L 12 -25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M -5 -12 L -15 -20" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
      <path d="M 12 -5 L 22 -10" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Secondary Industrial Element: Control Panel / Monitor Display -->
  <g transform="translate(45, 145)" filter="url(#shadow)">
    <!-- Stand -->
    <rect x="12" y="15" width="6" height="15" fill="#64748b"/>
    <rect x="5" y="28" width="20" height="4" rx="2" fill="#334155"/>
    
    <!-- Screen Box -->
    <rect x="-5" y="-5" width="40" height="25" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    
    <!-- UI Graph Lines (Abstract UI, no text) -->
    <polyline points="2,12 10,6 18,14 26,4 34,10" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="4" r="2" fill="#38bdf8"/>
    
    <!-- Status Indicator LED -->
    <circle cx="2" cy="2" r="1.5" fill="#ef4444"/>
  </g>

  <!-- Floating Sparkles / Dynamic Energy Particles -->
  <g>
    <circle cx="130" cy="140" r="2.5" fill="#facc15"/>
    <circle cx="155" cy="130" r="1.5" fill="#38bdf8"/>
    <circle cx="120" cy="160" r="2" fill="#f43f5e"/>
    <circle cx="165" cy="155" r="1" fill="#facc15"/>
  </g>
</svg>