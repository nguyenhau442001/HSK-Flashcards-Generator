<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Toolbox Red Gradient -->
    <linearGradient id="boxBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="boxLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Metallic Gradient -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Wood Handle Gradient -->
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="amberGlow" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>
  
  <!-- Ambient Lighting Layer -->
  <circle cx="120" cy="120" r="100" fill="url(#amberGlow)"/>

  <!-- Workbench Surface -->
  <path d="M 20 185 L 220 185 L 220 220 L 20 220 Z" fill="#334155"/>
  <path d="M 20 185 L 220 185 L 220 190 L 20 190 Z" fill="#475569"/>
  <rect x="35" y="195" width="25" height="15" rx="3" fill="#1e293b" opacity="0.6"/>
  <rect x="180" y="195" width="25" height="15" rx="3" fill="#1e293b" opacity="0.6"/>

  <!-- SCENE: CONTEXTUAL PROPS (Wood plank & Gears) -->
  <!-- Wooden Plank being worked on -->
  <g filter="url(#softShadow)" transform="rotate(-8 120 160)">
    <rect x="50" y="145" width="140" height="30" rx="4" fill="#92400e"/>
    <rect x="50" y="145" width="140" height="6" rx="2" fill="#b45309"/>
    <!-- Screw in plank -->
    <circle cx="70" cy="160" r="3" fill="#cbd5e1"/>
    <path d="M 68 160 L 72 160 M 70 158 L 70 162" stroke="#475569" stroke-width="1.2"/>
  </g>

  <!-- Brass Gear in background -->
  <g transform="translate(165, 95) scale(0.8)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="18" fill="#d97706"/>
    <path d="M -6 -18 L 6 -18 L 4 -10 L -4 -10 Z M -6 18 L 6 18 L 4 10 L -4 10 Z M 18 -6 L 18 6 L 10 4 L 10 -4 Z M -18 -6 L -18 6 L -10 4 L -10 -4 Z" fill="#d97706"/>
    <circle cx="0" cy="0" r="8" fill="#1e293b"/>
  </g>

  <!-- MAIN SUBJECT: TOOLBOX (工具 - Gōngjù) -->
  <g filter="url(#shadow)" transform="translate(0, 5)">
    <!-- Toolbox Base Body -->
    <path d="M 55 125 L 185 125 C 190 125, 193 128, 193 133 L 193 165 C 193 170, 190 173, 185 173 L 55 173 C 50 173, 47 170, 47 165 L 47 133 C 47 128, 50 125, 55 125 Z" fill="url(#boxBody)"/>
    
    <!-- Toolbox Body Highlight/Detail Lines -->
    <path d="M 47 135 L 193 135" stroke="#fda4af" stroke-width="2" opacity="0.4"/>
    <rect x="105" y="142" width="30" height="16" rx="4" fill="#e11d48"/>
    <rect x="112" y="146" width="16" height="8" rx="2" fill="#9f1239"/>
    
    <!-- Metal Latches -->
    <rect x="75" y="130" width="10" height="8" rx="2" fill="url(#metal)"/>
    <rect x="155" y="130" width="10" height="8" rx="2" fill="url(#metal)"/>

    <!-- Toolbox Lid (Open/Angled) -->
    <g transform="rotate(-22 120 125)">
      <path d="M 52 115 L 188 115 C 192 115, 195 118, 195 122 L 195 127 C 195 130, 192 133, 188 133 L 52 133 C 48 133, 45 130, 45 127 L 45 122 C 45 118, 48 115, 52 115 Z" fill="url(#boxLid)"/>
      <rect x="110" y="119" width="20" height="4" rx="2" fill="#fda4af" opacity="0.6"/>
    </g>

    <!-- Handle -->
    <path d="M 95 95 L 145 95 C 148 95, 150 97, 150 100 L 150 112 C 150 115, 148 117, 145 117 L 95 117 C 92 117, 90 115, 90 112 L 90 100 C 90 97, 92 95, 95 95 Z" fill="url(#metal)"/>
    <!-- Handle mounts -->
    <circle cx="95" cy="112" r="5" fill="#475569"/>
    <circle cx="145" cy="112" r="5" fill="#475569"/>
  </g>

  <!-- TOOLS EMERGING FROM THE TOOLBOX (Action & Variety) -->
  <!-- 1. Hammer (Scattering dynamic energy) -->
  <g filter="url(#shadow)" transform="translate(10, -10) rotate(25 80 100)">
    <!-- Handle -->
    <path d="M 75 80 L 85 80 L 92 130 L 80 132 Z" fill="url(#wood)"/>
    <!-- Rubber grip accent -->
    <path d="M 83 115 L 89 116 L 86 131 L 81 132 Z" fill="#1e293b"/>
    <!-- Hammer Head -->
    <path d="M 60 70 L 105 70 C 108 70, 110 72, 110 75 L 110 85 C 110 88, 108 90, 105 90 L 60 90 C 58 90, 56 88, 56 85 L 56 75 C 56 72, 58 70, 60 70 Z" fill="url(#metal)"/>
    <!-- Claw / Back of head -->
    <path d="M 60 73 L 45 78 L 45 82 L 60 85 Z" fill="url(#metal)"/>
    <!-- Head bolt detail -->
    <circle cx="85" cy="80" r="3" fill="#64748b"/>
  </g>

  <!-- 2. Wrench / Spanner -->
  <g filter="url(#shadow)" transform="translate(110, -5) rotate(-35 120 110)">
    <path d="M 115 70 L 125 70 L 122 135 L 118 135 Z" fill="url(#metal)"/>
    <!-- Wrench Head -->
    <path d="M 110 60 C 110 55, 130 55, 130 60 L 128 72 L 112 72 Z" fill="url(#metal)"/>
    <!-- Open slot in wrench head -->
    <ellipse cx="120" cy="59" rx="3" ry="5" fill="#1e293b"/>
    <!-- Grip hole -->
    <rect x="119" y="120" width="3" height="10" rx="1.5" fill="#64748b"/>
  </g>

  <!-- 3. Screwdriver (Accent Color - Cyan/Blue) -->
  <g filter="url(#shadow)" transform="translate(50, 10) rotate(15 100 110)">
    <!-- Handle -->
    <path d="M 95 105 L 105 105 L 103 135 L 97 135 Z" fill="#0ea5e9"/>
    <path d="M 97 110 L 103 110 L 102 125 L 98 125 Z" fill="#38bdf8"/>
    <!-- Shaft -->
    <path d="M 98 75 L 102 75 L 103 105 L 97 105 Z" fill="url(#metal)"/>
    <!-- Tip -->
    <path d="M 98 75 L 102 75 L 100 70 Z" fill="#64748b"/>
  </g>

  <!-- FLOATING SPARKLES & DUST (Adding "Action-Packed" App Vibe) -->
  <g fill="#fbbf24">
    <circle cx="45" cy="85" r="3" opacity="0.8"/>
    <path d="M 195 70 L 197 76 L 203 78 L 197 80 L 195 86 L 193 80 L 187 78 L 193 76 Z" opacity="0.9"/>
    <path d="M 140 45 L 141.5 49 L 145.5 50.5 L 141.5 52 L 140 56 L 138.5 52 L 134.5 50.5 L 138.5 49 Z" opacity="0.7"/>
    <circle cx="75" cy="40" r="2" opacity="0.6"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="170" cy="140" r="2.5" opacity="0.7"/>
    <circle cx="55" cy="135" r="2" opacity="0.5"/>
  </g>
</svg>