<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient representing a modern indoor transit or corridor space -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="doorGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Soft shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Architectural Background Elements (Subway / Corridor / Modern Hallway) -->
  <!-- Wall panels & warm accent lights -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b"/>
  
  <!-- Warm glow panels on wall -->
  <rect x="40" y="35" width="40" height="70" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="160" y="35" width="40" height="70" rx="4" fill="#334155" opacity="0.6"/>
  <path d="M60 35 L60 105" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M180 35 L180 105" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Automatic Doors / Entrance in background -->
  <rect x="90" y="30" width="60" height="130" fill="url(#doorGradient)" opacity="0.3"/>
  <rect x="95" y="35" width="23" height="120" fill="#38bdf8" opacity="0.1"/>
  <rect x="122" y="35" width="23" height="120" fill="#38bdf8" opacity="0.1"/>

  <!-- Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#floorGradient)"/>
  <!-- Floor tile perspective lines -->
  <path d="M0 190 L240 190 M0 215 L240 215" stroke="#475569" stroke-width="1" opacity="0.4"/>
  <path d="M80 170 L30 240 M160 170 L210 240" stroke="#475569" stroke-width="1" opacity="0.3"/>

  <!-- Character 1: Person being asked to make space (Standing slightly aside/turning back) -->
  <g filter="url(#shadow)">
    <!-- Shadow on floor -->
    <ellipse cx="155" cy="185" rx="18" ry="6" fill="#0f172a" opacity="0.7"/>

    <!-- Left Leg -->
    <path d="M145 145 L142 182" stroke="#3b82f6" stroke-width="9" stroke-linecap="round"/>
    <!-- Right Leg -->
    <path d="M165 145 L170 180" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"/>
    <!-- Shoes -->
    <path d="M136 182 L146 182" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <path d="M166 180 L176 182" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

    <!-- Torso (Green hoodie/jacket) -->
    <path d="M140 105 L170 105 L175 148 L135 148 Z" fill="#10b981" rx="6"/>
    <!-- Backpack -->
    <path d="M168 110 L182 118 L178 142 L168 138 Z" fill="#f59e0b" rx="4"/>

    <!-- Head & Neck -->
    <path d="M155 98 L155 106" stroke="#fbcfe8" stroke-width="8"/>
    <circle cx="155" cy="85" r="16" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M139 85 C139 70, 171 70, 171 85 C171 88, 168 85, 165 80 C155 72, 145 78, 139 85 Z" fill="#451a03"/>

    <!-- Body turning head back with surprise/polite expression -->
    <!-- Arms: one holding phone, turning around -->
    <path d="M142 110 L125 125 L135 130" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Phone prop -->
    <rect x="120" y="120" width="10" height="16" rx="2" fill="#38bdf8" transform="rotate(15 125 125)"/>
  </g>

  <!-- Character 2: Polite commuter/traveler asking "劳驾，请让一下" (Stepping through, polite gesture) -->
  <g filter="url(#shadow)">
    <!-- Shadow on floor -->
    <ellipse cx="80" cy="188" rx="20" ry="7" fill="#0f172a" opacity="0.7"/>

    <!-- Legs in motion (stepping forward) -->
    <path d="M68 145 L55 185" stroke="#ef4444" stroke-width="9" stroke-linecap="round"/>
    <path d="M92 145 L102 182" stroke="#b91c1c" stroke-width="9" stroke-linecap="round"/>
    <!-- Shoes -->
    <path d="M49 186 L59 184" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <path d="M98 182 L108 184" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

    <!-- Torso (Stylish orange/amber jacket over white shirt) -->
    <path d="M68 102 L98 105 L94 150 L68 150 Z" fill="#fb923c" rx="6"/>
    <!-- Jacket zipper line -->
    <path d="M83 104 L81 150" stroke="#ea580c" stroke-width="2"/>

    <!-- Head & Neck -->
    <path d="M82 95 L82 105" stroke="#fbcfe8" stroke-width="8"/>
    <circle cx="82" cy="82" r="15" fill="#fcd34d"/>
    <!-- Hair (neat dark hair) -->
    <path d="M68 82 C68 68, 96 68, 96 82 C96 85, 92 82, 88 77 C82 72, 74 74, 68 82 Z" fill="#1e293b"/>

    <!-- Polite waving / asking gesture arm -->
    <!-- Arm reaching forward slightly, open palm gesture -->
    <path d="M92 110 C105 115, 115 120, 112 125" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="113" cy="126" r="5" fill="#fcd34d"/>

    <!-- Other arm holding handle or bag -->
    <path d="M70 110 L58 130" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
    <!-- Briefcase / Messenger Bag -->
    <rect x="42" y="125" width="22" height="16" rx="3" fill="#854d0e"/>
    <path d="M48 125 L48 121 C48 119, 56 119, 56 121 L56 125" fill="none" stroke="#a16207" stroke-width="2"/>
  </g>

  <!-- Context Props: Luggage / Travel bag near Character 2 -->
  <g filter="url(#shadow)">
    <rect x="18" y="150" width="22" height="32" rx="4" fill="#0ea5e9"/>
    <!-- Trolley handle -->
    <path d="M24 150 L24 142 C24 140, 34 140, 34 142 L34 150" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="162" x2="42" y2="162" stroke="#0284c7" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="23" cy="183" r="3" fill="#334155"/>
    <circle cx="37" cy="183" r="3" fill="#334155"/>
  </g>

  <!-- Overhead Modern Airport/Transit Signage -->
  <g>
    <rect x="75" y="10" width="90" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Stylized directional arrow icon inside sign (NO text) -->
    <path d="M100 20 L115 20 M110 15 L115 20 L110 25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M130 20 L145 20 M140 15 L145 20 L140 25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Atmospheric Lighting / Warm Accent Glow for human interaction -->
  <circle cx="115" cy="120" r="45" fill="#fbbf24" opacity="0.06" style="mix-blend-mode: screen;"/>
</svg>