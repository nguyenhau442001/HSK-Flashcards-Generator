<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Government Official Character -->
  <g transform="translate(60, 40)">
    <!-- Suit -->
    <path d="M40 60 L80 60 L90 160 L30 160 Z" fill="#334155"/>
    <path d="M50 60 L50 80 L70 80 L70 60 Z" fill="#1e293b"/>
    <!-- Tie -->
    <path d="M55 60 L65 60 L60 100 Z" fill="#ec4899"/>
    <!-- Face -->
    <circle cx="60" cy="45" r="25" fill="#fde68a"/>
    <!-- Glasses -->
    <circle cx="50" cy="45" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="70" cy="45" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M56 45 L64 45" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Desk Props: Document and Pen -->
  <rect x="130" y="150" width="70" height="50" rx="4" fill="#f1f5f9"/>
  <path d="M140 160 L190 160 M140 175 L190 175 M140 190 L170 190" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M185 140 L195 160 L205 155 Z" fill="#fbbf24"/>
  
  <!-- Background Accents -->
  <circle cx="200" cy="50" r="15" fill="#38bdf8" opacity="0.2"/>
  <circle cx="30" cy="180" r="10" fill="#10b981" opacity="0.2"/>
  <path d="M10 20 L30 20 M20 10 L20 30" stroke="#fb923c" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
</svg>