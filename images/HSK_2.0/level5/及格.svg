<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Paper Warm Glow Gradient -->
    <radialGradient id="paperGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>

    <!-- Stamp Red Gradient -->
    <linearGradient id="stampGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Coffee Mug Gradient -->
    <linearGradient id="mugGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Pen Body Gradient -->
    <linearGradient id="penGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <circle cx="190" cy="50" r="30" fill="#38bdf8" opacity="0.05"/>
  <circle cx="40" cy="90" r="50" fill="#f59e0b" opacity="0.03"/>

  <!-- Back Wall / Environment Horizon -->
  <rect x="0" y="0" width="240" height="150" fill="#0f172a" opacity="0.5"/>
  <line x1="0" y1="150" x2="240" y2="150" stroke="#475569" stroke-width="2" opacity="0.4"/>

  <!-- Desk Surface -->
  <path d="M 0,150 L 240,150 L 240,240 L 0,240 Z" fill="url(#tableGrad)"/>
  <!-- Wooden/Desk Plank Accent Line -->
  <path d="M 0,154 L 240,154" stroke="#475569" stroke-width="1" opacity="0.5"/>

  <!-- BACKGROUND PROPS: Coffee Mug -->
  <g transform="translate(180, 115)" filter="url(#shadow)">
    <!-- Mug Handle -->
    <path d="M 16,6 C 26,6 26,22 16,24" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <!-- Mug Body -->
    <rect x="0" y="0" width="18" height="26" rx="3" fill="url(#mugGrad)"/>
    <!-- Coffee Surface -->
    <ellipse cx="9" cy="4" rx="7" ry="2" fill="#78350f"/>
    <!-- Steam -->
    <path d="M 6,-3 C 4,-7 10,-9 8,-13" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 12,-4 C 14,-8 10,-10 12,-14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- BACKGROUND PROPS: Small Notebook / Reference Book -->
  <g transform="translate(35, 130) rotate(-10)" filter="url(#shadow)">
    <rect x="0" y="0" width="45" height="35" rx="2" fill="#475569"/>
    <rect x="3" y="2" width="40" height="31" rx="1" fill="#f8fafc"/>
    <line x1="10" y1="10" x2="35" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="18" x2="30" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="26" x2="25" y2="26" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: The Exam Paper (Angled for 3D dynamic feel) -->
  <g filter="url(#shadow)" transform="translate(55, 60)">
    <!-- Paper Shadow Base -->
    <polygon points="10,10 120,0 135,115 25,125" fill="#0f172a" opacity="0.3"/>
    
    <!-- Main Paper Sheet -->
    <polygon points="15,10 125,0 130,110 20,120" fill="url(#paperGlow)"/>
    
    <!-- Paper Grid Lines / Score areas -->
    <line x1="30" y1="25" x2="75" y2="21" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="38" x2="65" y2="35" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <line x1="35" y1="55" x2="110" y2="48" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="67" x2="95" y2="61" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="79" x2="105" y2="73" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <line x1="39" y1="91" x2="80" y2="86" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

    <!-- Checkmarks on paper (Correct answers) -->
    <path d="M 105,32 L 110,38 L 122,25" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 90,46 L 95,52 L 107,39" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- High Score / Grade Box on the Paper -->
    <g transform="translate(85, 65) rotate(5)">
      <rect x="0" y="0" width="36" height="26" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <!-- Stylized score "85" inside test -->
      <path d="M 11,8 C 9,8 8,9 8,11 C 8,13 10,14 12,15 C 14,16 16,17 16,19 C 16,21 14,22 11,22 C 8,22 7,20 7,19" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <path d="M 11,15 C 9,15 8,14 8,12 C 8,10 10,9 11,9 C 13,9 14,10 14,12 C 14,14 13,15 11,15 Z" fill="none" stroke="#ef4444" stroke-width="2"/>
      <path d="M 23,8 L 20,8 L 20,13 L 24,13 C 25,13 26,14 26,16 C 26,18 25,19 24,19 L 20,19" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- FOREGROUND HERO OBJECT: The Official Pass Stamp / Seal ("Passed" concept) -->
  <g filter="url(#shadow)" transform="translate(130, 95)">
    <!-- Stamp Glow Aura -->
    <circle cx="28" cy="28" r="30" fill="#f43f5e" opacity="0.2" filter="url(#softGlow)"/>

    <!-- Stamp Wooden Handle (Angled in background) -->
    <path d="M 24, -22 L 32, -22 L 30, 4 L 26, 4 Z" fill="#b45309"/>
    <ellipse cx="28" cy="-22" rx="4" ry="2" fill="#d97706"/>
    <path d="M 22, -10 L 34, -10" stroke="#92400e" stroke-width="2"/>

    <!-- Stamp Rubber Base (Rounded rectangle/oval seal stamp) -->
    <g transform="rotate(-12, 28, 28)">
      <!-- Outer thick border of the stamp -->
      <rect x="0" y="10" width="56" height="36" rx="18" fill="url(#stampGrad)" stroke="#ffffff" stroke-width="2" stroke-dasharray="none"/>
      
      <!-- Inner dashed/accent border -->
      <rect x="4" y="14" width="48" height="28" rx="14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

      <!-- Stylized Star in Center of Stamp -->
      <path d="M 28,18 L 29.5,22 L 34,22 L 30.5,24.5 L 32,29 L 28,26.5 L 24,29 L 25.5,24.5 L 22,22 L 26.5,22 Z" fill="#ffffff"/>
      
      <!-- Checkmark graphic inside stamp representing "Approved / Passing Criteria Met" -->
      <path d="M 21,30 L 26,34 L 35,23" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- FOREGROUND PROPS: Writing Pen resting dynamically across the scene -->
  <g filter="url(#shadow)" transform="translate(20, 160) rotate(-25)">
    <!-- Pen Cap / Back -->
    <rect x="0" y="0" width="30" height="8" rx="4" fill="#0f172a"/>
    <!-- Pen Body -->
    <rect x="30" y="0" width="80" height="8" rx="2" fill="url(#penGrad)"/>
    <!-- Pen Grip/Tip -->
    <path d="M 110,0 L 125,4 L 110,8 Z" fill="#334155"/>
    <!-- Metal Clip -->
    <rect x="20" y="2" width="25" height="2" rx="1" fill="#cbd5e1"/>
  </g>

  <!-- ACCENT DECORATIONS: Floating celebration/success particles -->
  <g>
    <!-- Glowing Star 1 -->
    <path d="M 45,45 L 47,51 L 53,53 L 47,55 L 45,61 L 43,55 L 37,53 L 43,51 Z" fill="#fbbf24" opacity="0.9" filter="url(#softGlow)"/>
    <!-- Glowing Star 2 -->
    <path d="M 195,85 L 196.5,89 L 200.5,90.5 L 196.5,92 L 195,96 L 193.5,92 L 189.5,90.5 L 193.5,89 Z" fill="#38bdf8" opacity="0.8" filter="url(#softGlow)"/>
    <!-- Tiny Sparkles -->
    <circle cx="155" cy="50" r="2.5" fill="#f43f5e" opacity="0.8"/>
    <circle cx="30" cy="115" r="2" fill="#10b981" opacity="0.7"/>
    <circle cx="120" cy="35" r="1.5" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>