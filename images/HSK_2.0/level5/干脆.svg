<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- The "Decision" Scene: A hand firmly placing a stamp on a document -->
  <!-- Document -->
  <rect x="60" y="100" width="120" height="150" rx="4" fill="#f8fafc" transform="rotate(-5 120 175)"/>
  
  <!-- The Hand -->
  <path d="M130 130 C130 100, 150 90, 170 100 L180 140 L160 150 Z" fill="#fcd34d"/>
  <path d="M165 145 L175 180 L155 185 L145 150 Z" fill="#fb923c"/>
  
  <!-- The Stamp -->
  <rect x="140" y="150" width="30" height="40" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="155" cy="140" r="10" fill="#ec4899"/>
  
  <!-- Action Lines/Impact -->
  <path d="M130 170 L110 160 M180 180 L200 190" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Background Details -->
  <circle cx="200" cy="50" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M40 60 L70 60 M40 80 L60 80" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative Accent -->
  <circle cx="40" cy="180" r="8" fill="#10b981"/>
</svg>