<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Light Gradient -->
    <radialGradient id="studyLight" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Clock Glow Gradient -->
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <circle cx="80" cy="80" r="120" fill="url(#studyLight)"/>
  <circle cx="180" cy="90" r="60" fill="url(#clockGlow)"/>

  <!-- ENVIRONMENT: Room Background & Details -->
  <!-- Wallpaper Lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>
  <line x1="130" y1="0" x2="130" y2="180" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Bookshelf Background -->
  <rect x="15" y="40" width="45" height="120" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="15" y1="80" x2="60" y2="80" stroke="#334155" stroke-width="2"/>
  <line x1="15" y1="120" x2="60" y2="120" stroke="#334155" stroke-width="2"/>
  <!-- Books on Shelf -->
  <rect x="20" y="55" width="8" height="25" rx="1" fill="#ec4899"/>
  <rect x="30" y="50" width="10" height="30" rx="1" fill="#10b981"/>
  <rect x="42" y="60" width="12" height="20" rx="1" fill="#f59e0b"/>
  <rect x="22" y="95" width="14" height="25" rx="1" fill="#38bdf8"/>
  <rect x="38" y="100" width="8" height="20" rx="1" fill="#a855f7"/>

  <!-- Window with Night Scene -->
  <path d="M 160,25 L 210,25 C 215,25 215,25 215,30 L 215,110 L 160,110 Z" fill="#0b0f19" stroke="#334155" stroke-width="3"/>
  <!-- City Skyline through Window -->
  <rect x="165" y="70" width="8" height="40" fill="#1e293b"/>
  <rect x="175" y="55" width="10" height="55" fill="#1e293b"/>
  <rect x="188" y="80" width="12" height="30" fill="#1e293b"/>
  <rect x="202" y="65" width="7" height="45" fill="#1e293b"/>
  <circle cx="205" cy="40" r="4" fill="#fbbf24"/> <!-- Moon -->

  <!-- Hanging Wall Clock (Emphasizing "Delay / Late") -->
  <g transform="translate(180, 75)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
    <circle cx="0" cy="0" r="2" fill="#0f172a"/>
    <!-- Clock Hands pointing to late hour -->
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="4" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <!-- Clock ticks -->
    <line x1="0" y1="-18" x2="0" y2="-15" stroke="#64748b" stroke-width="2"/>
    <line x1="18" y1="0" x2="15" y2="0" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="18" x2="0" y2="15" stroke="#64748b" stroke-width="2"/>
    <line x1="-18" y1="0" x2="-15" y2="0" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Desk and Props -->
  <g filter="url(#shadow)">
    <!-- Desk Surface -->
    <path d="M 60,150 L 230,150 L 220,185 L 50,185 Z" fill="#334155"/>
    <rect x="50" y="145" width="180" height="10" rx="3" fill="#475569"/>
    <!-- Desk Legs -->
    <rect x="70" y="185" width="10" height="45" fill="#1e293b"/>
    <rect x="200" y="185" width="10" height="45" fill="#1e293b"/>

    <!-- Desk Props: Laptop Open -->
    <path d="M 150,140 L 195,140 L 205,152 L 140,152 Z" fill="#94a3b8"/>
    <path d="M 148,115 L 197,115 C 199,115 200,116 200,118 L 197,141 C 197,142 196,143 195,143 L 150,143 C 149,143 148,142 148,141 L 145,118 C 145,116 146,115 148,115 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <!-- Screen content (distraction / game / video) -->
    <rect x="150" y="120" width="44" height="20" rx="2" fill="#0f172a"/>
    <circle cx="172" cy="130" r="5" fill="#ef4444"/>
    <polygon points="170,127 170,133 176,130" fill="#ffffff"/>

    <!-- Scattered Books and Papers -->
    <rect x="70" y="135" width="30" height="15" rx="2" fill="#ec4899" transform="rotate(-10 85 142)"/>
    <rect x="95" y="140" width="35" height="12" rx="1" fill="#f8fafc" transform="rotate(5 112 146)"/>
    
    <!-- Coffee Mug -->
    <path d="M 120,132 L 135,132 L 133,148 L 122,148 Z" fill="#f43f5e"/>
    <path d="M 135,136 C 140,136 140,144 133,144" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 125,124 C 127,120 123,116 125,112" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- MAIN SUBJECT: CHARACTER (Rushed, distracted, panicking about time) -->
  <g class="character" filter="url(#shadow)">
    <!-- Character Chair -->
    <path d="M 90,120 L 120,120 L 125,190 L 85,190 Z" fill="#1e293b"/>
    <rect x="85" y="110" width="40" height="15" rx="4" fill="#334155"/>
    <rect x="100" y="130" width="10" height="60" fill="#475569"/>

    <!-- Torso (Leaning forward anxiously, wearing blue sweater) -->
    <path d="M 85,130 C 85,115 115,115 120,130 L 125,165 C 125,170 95,175 85,165 Z" fill="url(#sweaterGrad)"/>
    <!-- Collar -->
    <path d="M 97,128 C 102,132 108,132 113,128 C 110,135 100,135 97,128 Z" fill="#e0f2fe"/>

    <!-- Left Arm & Hand (Clutching head in realization of delay) -->
    <path d="M 90,132 C 75,135 70,115 82,105 C 88,100 95,112 90,120" fill="url(#sweaterGrad)" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left Hand on Head -->
    <circle cx="82" cy="103" r="8" fill="#fbcfe8"/>

    <!-- Right Arm & Hand (Frozen/panicking over the desk, reaching toward laptop/clock) -->
    <path d="M 118,138 C 135,145 145,150 160,145" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <circle cx="163" cy="144" r="7" fill="#fbcfe8"/>

    <!-- Head & Face (Wide eyes, open mouth - expression of panic/losing time) -->
    <g transform="translate(95, 88)">
      <!-- Hair Back -->
      <circle cx="10" cy="12" r="16" fill="#1e293b"/>
      
      <!-- Face Base -->
      <ellipse cx="12" cy="15" rx="14" ry="16" fill="#fbcfe8"/>
      
      <!-- Hair Top/Front -->
      <path d="M -2,10 C 2,2 18,2 24,10 C 22,4 12,2 2,6 Z" fill="#1e293b"/>
      <path d="M 18,6 C 22,8 26,14 28,18 C 24,14 20,10 18,6 Z" fill="#1e293b"/>

      <!-- Wide Panicked Eyes -->
      <circle cx="6" cy="13" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="6" cy="13" r="2" fill="#0f172a"/>
      <circle cx="17" cy="13" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="17" cy="13" r="2" fill="#0f172a"/>

      <!-- Worried Eyebrows (Angled sharply) -->
      <line x1="2" y1="7" x2="9" y2="9" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="9" x2="21" y2="7" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Sweat Drop (Classic sign of stress/delay) -->
      <path d="M 23,12 C 23,12 27,17 27,20 C 27,22.2 25.2,24 23,24 C 20.8,24 19,22.2 19,20 C 19,17 23,12 23,12 Z" fill="#38bdf8"/>

      <!-- Open Panicked Mouth -->
      <ellipse cx="11.5" cy="22" rx="3.5" ry="4.5" fill="#0f172a"/>
      <!-- Tongue -->
      <path d="M 9,23 C 9,21 14,21 14,23 Z" fill="#ef4444"/>
    </g>
  </g>

  <!-- ACTION & MOTION EFFECTS: "Wasted Time / Delay" Visual Cues -->
  <!-- Motion blur / trailing lines near clock representing ticking time flying away -->
  <path d="M 155,65 C 145,60 140,50 130,55" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 158,85 C 145,85 135,75 125,80" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.8"/>

  <!-- Glowing Alarm / Warning indicators floating gently -->
  <g transform="translate(145, 60)" opacity="0.9">
    <circle cx="0" cy="0" r="10" fill="#ef4444" opacity="0.2"/>
    <path d="M -4,-3 L 4,-3 L 2,2 L -2,2 Z" fill="#ef4444"/>
    <rect x="-3" y="3" width="6" height="2" fill="#ef4444" rx="1"/>
    <circle cx="0" cy="-6" r="1.5" fill="#ef4444"/>
  </g>

  <!-- Foreground framing elements for visual depth -->
  <path d="M 0,220 C 50,230 80,240 120,240 C 180,240 210,225 240,215 L 240,240 L 0,240 Z" fill="#090d16" opacity="0.6"/>
</svg>