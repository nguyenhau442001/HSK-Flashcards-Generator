<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Purse Gradient (Gold/Amber) -->
    <linearGradient id="purse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Motion Blur Effect -->
    <filter id="motion-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Street Alley Environment Context -->
  <!-- Distant wall / bricks -->
  <rect x="20" y="20" width="200" height="130" rx="12" fill="#1e293b" opacity="0.6"/>
  <!-- Decorative window in alley -->
  <rect x="160" y="40" width="40" height="60" rx="4" fill="#0f172a" opacity="0.8"/>
  <rect x="170" y="50" width="20" height="40" rx="2" fill="#334155" opacity="0.4"/>
  
  <!-- Ground / Pavement -->
  <path d="M0 150 L240 150 L240 240 L0 240 Z" fill="url(#floor-grad)"/>
  <!-- Pavement lines / perspective -->
  <path d="M120 150 L200 240" stroke="#475569" stroke-width="2" stroke-dasharray="6,6" opacity="0.5"/>
  <path d="M100 150 L20 240" stroke="#475569" stroke-width="2" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Dynamic Speed Lines / Action Trails -->
  <path d="M20 120 L80 120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" filter="url(#motion-glow)"/>
  <path d="M10 140 L90 140" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.5" filter="url(#motion-glow)"/>
  <path d="M40 160 L110 160" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Thief Figure (Right Side, Leaning Forward, Pulling) -->
  <g id="thief">
    <!-- Thief Body / Hoodie -->
    <path d="M160 110 L190 140 L180 200 L145 200 L135 150 Z" fill="#0f172a"/>
    <!-- Thief Head / Mask -->
    <circle cx="165" cy="90" r="16" fill="#334155"/>
    <path d="M150 85 C160 75 175 75 180 85 L180 95 L150 95 Z" fill="#0f172a"/> <!-- Hood -->
    <rect x="157" y="87" width="16" height="6" rx="3" fill="#ef4444" opacity="0.8"/> <!-- Visor/Eye band -->

    <!-- Thief Arms Reaching Back to Grab -->
    <path d="M150 115 L125 125" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <path d="M155 125 L120 135" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
    <!-- Thief Hand -->
    <circle cx="118" cy="136" r="6" fill="#cbd5e1"/>
  </g>

  <!-- Victim Figure (Left Side, Pulled/Struggling) -->
  <g id="victim">
    <!-- Victim Body -->
    <path d="M60 120 L80 145 L70 200 L40 200 L50 140 Z" fill="#ec4899"/>
    <!-- Victim Head & Hair -->
    <circle cx="55" cy="95" r="15" fill="#fbcfe8"/>
    <path d="M40 90 C40 70 70 70 70 90 C70 100 65 110 65 110 L45 110 Z" fill="#be185d"/> <!-- Hair -->
    
    <!-- Victim Arm Reaching Forward (Struggling to Keep Bag) -->
    <path d="M70 125 L105 130" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
    <!-- Victim Hand -->
    <circle cx="108" cy="131" r="5" fill="#fbcfe8"/>
  </g>

  <!-- The Object Being Snatched: Leather Handbag / Purse -->
  <g id="purse" filter="url(#motion-glow)">
    <!-- Purse Strap flying in tension -->
    <path d="M108 131 C115 120 120 115 118 136" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <!-- Purse Main Body -->
    <rect x="112" y="125" width="18" height="15" rx="3" fill="url(#purse-grad)" transform="rotate(-15 121 132)"/>
    <!-- Purse Clasp -->
    <circle cx="121" cy="130" r="2" fill="#fef08a"/>
  </g>

  <!-- Impact / Action FX (Tension Lines between Hands) -->
  <path d="M112 122 L116 118" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M114 140 L118 144" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="114" cy="131" r="12" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>

  <!-- Atmospheric Lighting / Accent Glows -->
  <circle cx="120" cy="130" r="30" fill="#fbbf24" opacity="0.1" filter="url(#motion-glow)"/>

</svg>