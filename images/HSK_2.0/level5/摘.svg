<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Glow Behind Flower Bush -->
    <radialGradient id="sunGlow" cx="70%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33180d" />
      <stop offset="100%" stop-color="#1c0d06" />
    </linearGradient>

    <!-- Flower Gradient -->
    <linearGradient id="flowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <circle cx="120" cy="120" r="120" fill="url(#sunGlow)" />

  <!-- Background Environment (Garden / Park) -->
  <!-- Distant Hills -->
  <path d="M-10 170 Q 50 140, 110 165 T 250 155 L 250 250 L -10 250 Z" fill="#1b3a4b" opacity="0.6" />
  <path d="M-10 185 Q 70 160, 140 180 T 250 170 L 250 250 L -10 250 Z" fill="#1e463f" opacity="0.8" />

  <!-- Soft Bush / Foliage Background -->
  <circle cx="190" cy="190" r="45" fill="#065f46" opacity="0.7" />
  <circle cx="215" cy="205" r="30" fill="#047857" opacity="0.9" />

  <!-- Ground Plane -->
  <path d="M-10 195 Q 80 180, 250 195 L 250 250 L -10 250 Z" fill="#064e3b" />
  <path d="M-10 205 Q 100 190, 250 205 L 250 250 L -10 250 Z" fill="#022c22" />

  <!-- Decorative Garden Elements -->
  <!-- Small background flowers -->
  <circle cx="195" cy="180" r="3" fill="#fde047" />
  <circle cx="210" cy="188" r="2.5" fill="#f472b6" />
  <circle cx="175" cy="195" r="3" fill="#38bdf8" />
  
  <!-- Garden Bush in Foreground (Right) -->
  <path d="M 140 220 C 135 190, 160 170, 190 175 C 210 160, 240 180, 235 210 C 250 220, 250 250, 250 250 L 140 250 Z" fill="#047857" />
  <path d="M 160 230 C 160 205, 185 195, 205 205 C 220 195, 245 210, 240 235 Z" fill="#059669" />

  <!-- The Main Flower Being Picked (Stalk and Leaves) -->
  <path d="M 148 215 Q 143 190, 138 165" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 143 200 Q 153 195, 147 190" fill="#059669" />
  <path d="M 141 180 Q 131 178, 136 173" fill="#059669" />

  <!-- Character: Young Woman Picking a Flower -->
  <!-- Body / Torso (Facing Left/Downward towards flower) -->
  <path d="M 85 150 C 75 160, 70 180, 75 210 L 115 210 C 120 180, 110 160, 100 150 Z" fill="#38bdf8" />
  
  <!-- Jacket / Sleeves -->
  <path d="M 85 150 L 65 175 L 75 185 L 90 165 Z" fill="#0284c7" /> <!-- Left arm back -->
  <path d="M 100 150 L 132 178 C 135 180, 138 175, 136 172 L 110 150 Z" fill="#0284c7" /> <!-- Right arm reaching out -->

  <!-- Neck -->
  <path d="M 90 135 L 90 150 L 100 150 L 100 135 Z" fill="#fcd34d" />

  <!-- Head -->
  <circle cx="95" cy="115" r="22" fill="#fde68a" />

  <!-- Hair Back -->
  <path d="M 75 110 C 70 95, 85 85, 98 85 C 115 85, 120 100, 118 125 C 116 140, 110 150, 105 150 C 100 150, 95 135, 95 135 Z" fill="url(#hairGrad)" />

  <!-- Face Profile / Features -->
  <!-- Gentle closed happy eye -->
  <path d="M 102 112 Q 107 116, 112 112" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Cute smile -->
  <path d="M 106 122 Q 110 126, 114 121" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Rosy cheek -->
  <circle cx="108" cy="118" r="4" fill="#fb7185" opacity="0.6" />

  <!-- Hair Front / Bangs -->
  <path d="M 78 110 Q 90 95, 112 105 Q 116 118, 118 125 C 110 115, 90 110, 78 110 Z" fill="url(#hairGrad)" />
  <circle cx="90" cy="148" r="8" fill="url(#hairGrad)" /> <!-- Hair tie/bun hint or loose lock -->

  <!-- Reaching Hand holding the Flower Stem -->
  <!-- Hand -->
  <circle cx="136" cy="173" r="5" fill="#fde68a" />
  <path d="M 134 171 Q 138 170, 139 174" stroke="#d97706" stroke-width="1.5" fill="none" />

  <!-- The Picked Flower Head (held delicately in hand) -->
  <g transform="translate(138, 165) rotate(15)">
    <!-- Flower Petals -->
    <circle cx="0" cy="-7" r="6" fill="url(#flowerGrad)" />
    <circle cx="7" cy="-2" r="6" fill="url(#flowerGrad)" />
    <circle cx="5" cy="6" r="6" fill="url(#flowerGrad)" />
    <circle cx="-5" cy="6" r="6" fill="url(#flowerGrad)" />
    <circle cx="-7" cy="-2" r="6" fill="url(#flowerGrad)" />
    <!-- Flower Center -->
    <circle cx="0" cy="0" r="4" fill="#fde047" />
  </g>

  <!-- Other flowers standing proudly in the bush -->
  <!-- Flower 1 -->
  <g transform="translate(180, 175)">
    <path d="M 0 25 Q -5 10, 0 0" stroke="#059669" stroke-width="2.5" fill="none" />
    <circle cx="0" cy="-7" r="5" fill="#fb923c" />
    <circle cx="6" cy="-3" r="5" fill="#fb923c" />
    <circle cx="4" cy="4" r="5" fill="#fb923c" />
    <circle cx="-4" cy="4" r="5" fill="#fb923c" />
    <circle cx="-6" cy="-3" r="5" fill="#fb923c" />
    <circle cx="0" cy="0" r="3.5" fill="#fef08a" />
  </g>

  <!-- Flower 2 (Larger, bright pink/magenta) -->
  <g transform="translate(210, 195)">
    <path d="M 0 30 Q 5 15, 0 0" stroke="#059669" stroke-width="3" fill="none" />
    <circle cx="0" cy="-9" r="7" fill="#f472b6" />
    <circle cx="8" cy="-4" r="7" fill="#f472b6" />
    <circle cx="6" cy="6" r="7" fill="#f472b6" />
    <circle cx="-6" cy="6" r="7" fill="#f472b6" />
    <circle cx="-8" cy="-4" r="7" fill="#f472b6" />
    <circle cx="0" cy="0" r="4" fill="#fbbf24" />
  </g>

  <!-- Floating Petals for magical interactive atmosphere -->
  <path d="M 125 150 Q 128 145, 133 148 Q 130 153, 125 150 Z" fill="#f472b6" opacity="0.8" transform="rotate(20 125 150)" />
  <path d="M 155 140 Q 158 135, 163 138 Q 160 143, 155 140 Z" fill="#f472b6" opacity="0.9" transform="rotate(-40 155 140)" />
  <path d="M 110 130 Q 112 126, 116 128 Q 114 132, 110 130 Z" fill="#fde047" opacity="0.9" transform="rotate(10 110 130)" />

  <!-- Foreground Grass Tufts (Left Side) -->
  <path d="M 20 220 Q 25 200, 30 225" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 26 222 Q 32 205, 38 227" stroke="#059669" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 10 225 Q 15 210, 22 228" stroke="#047857" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Lighting Highlights (Warm rim light on character) -->
  <path d="M 114 102 C 117 110, 117 120, 115 130" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 100 150 L 132 178" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8" />
</svg>