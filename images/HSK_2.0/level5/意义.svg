<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <radialGradient id="bg-gradient" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="window-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="tree-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <linearGradient id="soil-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-gradient)" />

  <!-- Background Environment: Cozy Room Interior -->
  <!-- Window showing night/evening sky & planting outside -->
  <g transform="translate(145, 20)">
    <rect x="0" y="0" width="70" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <rect x="5" y="5" width="28" height="75" rx="3" fill="url(#window-sky)" />
    <rect x="37" y="5" width="28" height="75" rx="3" fill="url(#window-sky)" />
    <!-- Distant moon/stars -->
    <circle cx="20" cy="20" r="4" fill="#fef08a" opacity="0.8" />
    <circle cx="50" cy="40" r="2" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Wall shelf with books and warm decor -->
  <rect x="130" y="115" width="85" height="6" rx="2" fill="#475569" />
  <!-- Books on shelf -->
  <rect x="140" y="95" width="10" height="20" rx="1" fill="#ec4899" />
  <rect x="152" y="91" width="12" height="24" rx="1" fill="#3b82f6" />
  <rect x="166" y="98" width="8" height="17" rx="1" fill="#10b981" />
  <rect x="176" y="93" width="14" height="22" rx="1" fill="#f59e0b" />

  <!-- Hanging warm pendant light -->
  <path d="M 85 0 L 85 35" stroke="#475569" stroke-width="2" />
  <circle cx="85" cy="40" r="25" fill="url(#lamp-glow)" />
  <path d="M 70 30 L 100 30 L 105 40 L 65 40 Z" fill="#64748b" />

  <!-- Room Floor & Large Plant (representing the meaningful act of planting/gardening together) -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" />

  <!-- Wooden Floor Planks Perspective lines -->
  <path d="M 0 210 L -40 240" stroke="#1e293b" stroke-width="1" />
  <path d="M 60 210 L 40 240" stroke="#1e293b" stroke-width="1" />
  <path d="M 120 210 L 140 240" stroke="#1e293b" stroke-width="1" />
  <path d="M 180 210 L 220 240" stroke="#1e293b" stroke-width="1" />

  <!-- Large Ceramic Pot with Growing Tree (Symbol of meaningful action: nurturing life, building value) -->
  <g transform="translate(35, 145)" filter="url(#soft-shadow)">
    <!-- Pot -->
    <path d="M 8 15 L 32 15 L 38 60 L 2 60 Z" fill="#cbd5e1" />
    <ellipse cx="20" cy="15" rx="12" ry="4" fill="#94a3b8" />
    <!-- Soil -->
    <ellipse cx="20" cy="17" rx="10" ry="3" fill="url(#soil-grad)" />
    
    <!-- Tree Trunk -->
    <path d="M 18 17 Q 20 0 15 -20" stroke="#92400e" stroke-width="5" fill="none" stroke-linecap="round" />
    <!-- Tree Branches & Lush Leaves (Meaningful growth) -->
    <circle cx="12" cy="-22" r="18" fill="url(#tree-grad)" />
    <circle cx="28" cy="-15" r="14" fill="#34d399" />
    <circle cx="20" cy="-35" r="16" fill="#059669" />
  </g>

  <!-- Central Action: Two people planting/working together over a table -->
  <!-- Wooden Table -->
  <g filter="url(#soft-shadow)">
    <!-- Table Top -->
    <path d="M 70 170 L 190 170 L 205 190 L 55 190 Z" fill="#b45309" />
    <path d="M 65 165 L 195 165 L 190 170 L 70 170 Z" fill="#d97706" />
    <!-- Table Legs -->
    <rect x="75" y="190" width="8" height="35" fill="#78350f" />
    <rect x="177" y="190" width="8" height="35" fill="#78350f" />
  </g>

  <!-- Small seedling pot on table being cared for -->
  <g transform="translate(115, 145)">
    <path d="M 4 15 L 16 15 L 19 28 L 1 28 Z" fill="#e2e8f0" />
    <ellipse cx="10" cy="15" rx="6" ry="2" fill="#cbd5e1" />
    <!-- Tiny sprout -->
    <path d="M 10 15 Q 10 5 5 2" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="4" cy="2" r="3" fill="#34d399" />
    <circle cx="13" cy="7" r="2.5" fill="#34d399" />
  </g>

  <!-- Character Left (Person A - Giving care/meaningful gesture) -->
  <g transform="translate(75, 110)" filter="url(#soft-shadow)">
    <!-- Body / Torso -->
    <path d="M 15 40 Q 25 35 35 45 L 45 80 L 5 80 L 15 40 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="25" cy="20" rx="14" ry="14" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 11 18 Q 15 5 28 8 Q 38 12 39 20 L 38 15 Q 30 2 18 10 Z" fill="#1e293b" />
    <!-- Arm reaching forward to the plant -->
    <path d="M 30 45 Q 45 55 58 48" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="60" cy="46" r="4.5" fill="#fcd34d" />
    <!-- Face Expression (Focused, caring, joyful) -->
    <circle cx="21" cy="20" r="1.5" fill="#1e293b" />
    <circle cx="29" cy="20" r="1.5" fill="#1e293b" />
    <path d="M 23 26 Q 25 29 27 26" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Character Right (Person B - Smiling, sharing the meaningful moment) -->
  <g transform="translate(150, 105)" filter="url(#soft-shadow)">
    <!-- Body / Torso -->
    <path d="M 25 45 Q 20 35 10 45 L 0 85 L 40 85 L 25 45 Z" fill="#f43f5e" />
    <!-- Head -->
    <circle cx="20" cy="18" rx="13" ry="13" fill="#fcd34d" />
    <!-- Hair (Ponytail) -->
    <path d="M 10 15 Q 10 2 20 5 Q 32 8 31 18 Q 38 20 40 15 Q 35 0 20 2 Q 8 2 5 15 Z" fill="#451a03" />
    <!-- Arm leaning on table -->
    <path d="M 15 50 L -2 55" stroke="#f43f5e" stroke-width="9" stroke-linecap="round" fill="none" />
    <circle cx="-5" cy="56" r="4" fill="#fcd34d" />
    <!-- Face Expression (Warm, appreciative smile) -->
    <circle cx="16" cy="18" r="1.5" fill="#1e293b" />
    <circle cx="23" cy="18" r="1.5" fill="#1e293b" />
    <path d="M 17 23 Q 20 26 23 23" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Rosy cheeks -->
    <circle cx="14" cy="21" r="2" fill="#fda4af" opacity="0.6" />
    <circle cx="25" cy="21" r="2" fill="#fda4af" opacity="0.6" />
  </g>

  <!-- Floating Sparkles / Warm Glow indicators representing "Meaning / Value" (No text/symbols, just pure visual narrative cues) -->
  <g transform="translate(105, 75)">
    <!-- Glowing star 1 -->
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24" filter="url(#soft-shadow)" />
  </g>
  <g transform="translate(135, 60)">
    <!-- Glowing star 2 (smaller) -->
    <path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" fill="#fef08a" />
  </g>
  <g transform="translate(90, 95)">
    <!-- Glowing star 3 -->
    <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="#f59e0b" />
  </g>

</svg>