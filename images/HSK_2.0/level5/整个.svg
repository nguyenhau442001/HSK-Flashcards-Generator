<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(0, 40)">
    <!-- Cityscape Silhouette -->
    <path d="M20 200 L20 120 L40 100 L60 130 L80 90 L100 110 L120 70 L140 100 L160 80 L180 120 L200 100 L220 140 L220 200 Z" fill="#334155"/>
    
    <!-- Windows -->
    <rect x="30" y="130" width="10" height="15" fill="#fbbf24" opacity="0.6"/>
    <rect x="50" y="110" width="10" height="15" fill="#fbbf24" opacity="0.8"/>
    <rect x="90" y="120" width="10" height="15" fill="#fbbf24" opacity="0.5"/>
    <rect x="130" y="90" width="10" height="15" fill="#fbbf24" opacity="0.7"/>
    <rect x="170" y="100" width="10" height="15" fill="#fbbf24" opacity="0.9"/>
    <rect x="200" y="120" width="10" height="15" fill="#fbbf24" opacity="0.4"/>
    
    <!-- Moon/Atmosphere -->
    <circle cx="180" cy="40" r="25" fill="#fef3c7"/>
    <circle cx="185" cy="35" r="25" fill="#1e293b"/>
    
    <!-- Street/Ground -->
    <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
    <path d="M0 180 L240 180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 10"/>
    
    <!-- Park Bench -->
    <rect x="40" y="160" width="50" height="20" rx="2" fill="#fb923c"/>
    <rect x="45" y="180" width="5" height="10" fill="#fb923c"/>
    <rect x="80" y="180" width="5" height="10" fill="#fb923c"/>
    
    <!-- Park Lamp -->
    <rect x="190" y="120" width="4" height="60" fill="#94a3b8"/>
    <circle cx="192" cy="115" r="8" fill="#fbbf24"/>
    <circle cx="192" cy="115" r="12" fill="#fbbf24" opacity="0.2"/>
  </g>
</svg>