<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Emergency Red Glow Gradient -->
    <radialGradient id="emergencyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2234" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gurney Chrome/Steel Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Emergency Light Cone / Background Glow -->
  <circle cx="120" cy="110" r="110" fill="url(#emergencyGlow)" />

  <!-- Architectural Background Elements: Hospital Room Interior -->
  <!-- Back Wall -->
  <rect x="20" y="25" width="200" height="135" fill="#131c2e" rx="4" />
  
  <!-- Wall stripe/accent -->
  <rect x="20" y="90" width="200" height="4" fill="#1f293d" />

  <!-- Medical Monitor / ECG Machine Mounted on Wall -->
  <g transform="translate(150, 42)" filter="url(#softShadow)">
    <rect x="0" y="0" width="44" height="32" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Screen -->
    <rect x="4" y="4" width="36" height="24" rx="2" fill="#020617" />
    <!-- Heartbeat ECG line -->
    <path d="M7 16 h8 l3 -6 l4 12 l4 -8 l3 2 h5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Status LED -->
    <circle cx="37" cy="28" r="1.5" fill="#ef4444" />
  </g>
  <!-- Connecting cord for monitor -->
  <path d="M150 58 C 135 58, 125 45, 120 40" fill="none" stroke="#334155" stroke-width="2" />

  <!-- IV Pole & Bag in Background -->
  <g transform="translate(45, 30)">
    <!-- Pole -->
    <line x1="10" y1="0" x2="10" y2="120" stroke="#94a3b8" stroke-width="2" />
    <!-- Hook -->
    <path d="M6 5 c0 -3, 4 -5, 4 -5" fill="none" stroke="#94a3b8" stroke-width="2" />
    <!-- IV Bag -->
    <rect x="5" y="8" width="10" height="15" rx="3" fill="#e2e8f0" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1" />
    <path d="M8 23 v8" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Drip tube -->
    <path d="M8 31 Q 8 60, 25 75" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>

  <!-- Dynamic Emergency Flashing Light on Ceiling -->
  <g transform="translate(120, 15)">
    <!-- Light fixture base -->
    <ellipse cx="0" cy="0" rx="16" ry="6" fill="#334155" />
    <!-- Dome light -->
    <path d="M-12 0 C-12 -12, 12 -12, 12 0 Z" fill="#ef4444" filter="url(#glowFilter)" />
    <!-- Specular highlight on dome -->
    <ellipse cx="-4" cy="-5" rx="3" ry="1.5" fill="#fca5a5" />
    <!-- Light beams casting down -->
    <polygon points="0,0 -55,145 55,145" fill="#ef4444" opacity="0.08" />
  </g>

  <!-- Floor Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#floorGrad)" />
  <!-- Floor highlight/shadow line -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2" />

  <!-- MAIN ACTION SUBJECT: Emergency Gurney / Hospital Trolley with Patient -->
  <g transform="translate(24, 115)" filter="url(#softShadow)">
    
    <!-- Gurney Wheels (Back) -->
    <circle cx="28" cy="48" r="8" fill="#334155" />
    <circle cx="28" cy="48" r="4" fill="#64748b" />
    <circle cx="164" cy="48" r="8" fill="#334155" />
    <circle cx="164" cy="48" r="4" fill="#64748b" />

    <!-- Lower Chassis & Frame -->
    <path d="M35 38 L155 38 L160 46 L30 46 Z" fill="url(#metalGrad)" />
    <!-- Hydraulic central column -->
    <rect x="90" y="24" width="16" height="18" fill="#475569" rx="2" />
    <rect x="85" y="40" width="26" height="4" fill="#334155" rx="1" />

    <!-- Upper stretcher frame -->
    <rect x="15" y="20" width="162" height="8" rx="3" fill="url(#metalGrad)" />

    <!-- Mattress -->
    <rect x="18" y="8" width="156" height="14" rx="4" fill="#f1f5f9" />
    <rect x="18" y="8" width="156" height="5" fill="#e2e8f0" rx="2" />

    <!-- Patient Body (Simplified dynamic form under blanket) -->
    <!-- Pillow -->
    <rect x="22" y="10" width="28" height="10" rx="3" fill="#cbd5e1" />
    <!-- Patient Head & Face Profile -->
    <circle cx="36" cy="15" r="7" fill="#fbcfe8" />
    <path d="M30 15 c0 -3, 3 -6, 7 -6 c2 0, 4 1, 5 3" fill="#334155" /> <!-- Hair -->
    
    <!-- Main Medical Blanket (Teal/Cyan themed emergency look) -->
    <path d="M 45 7 C 70 2, 120 4, 165 14 L 168 24 C 120 22, 70 20, 45 22 Z" fill="#0ea5e9" />
    <!-- Blanket fold details -->
    <path d="M80 8 Q 95 18 110 8" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    <path d="M125 10 Q 135 19 145 11" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />

    <!-- Patient Arm resting outside blanket with IV wristband/lines -->
    <path d="M95 15 C 105 12, 115 16, 122 18" fill="none" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round" />
    <!-- Medical ID bracelet -->
    <rect x="108" y="14" width="4" height="3" rx="1" fill="#ef4444" />
    <!-- IV Tube connection to arm -->
    <path d="M110 15 L 110 5" fill="none" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Gurney Push Handles (Left & Right) -->
    <!-- Left handle -->
    <path d="M15 24 L 5 24 C 2 24, 0 22, 0 19 L 0 17" fill="none" stroke="url(#metalGrad)" stroke-width="3" stroke-linecap="round" />
    <!-- Right handle (Action grab bar) -->
    <path d="M177 24 L 187 24 C 190 24, 192 22, 192 19 L 192 15" fill="none" stroke="url(#metalGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Gurney Wheels (Front - overlapping chassis) -->
    <circle cx="32" cy="50" r="9" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <circle cx="32" cy="50" r="3" fill="#cbd5e1" />
    
    <circle cx="160" cy="50" r="9" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <circle cx="160" cy="50" r="3" fill="#cbd5e1" />

    <!-- Motion/Speed lines to emphasize urgent movement -->
    <g opacity="0.6">
      <line x1="-15" y1="30" x2="-2" y2="30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-10" y1="38" x2="-5" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-20" y1="46" x2="-8" y2="46" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- FOREGROUND / ACCENT ELEMENTS -->

  <!-- Medical Cross Symbol (Subtle wall badge, clean vector) -->
  <g transform="translate(195, 30)" filter="url(#softShadow)">
    <rect x="0" y="0" width="22" height="22" rx="6" fill="#ef4444" />
    <rect x="9" y="5" width="4" height="12" rx="1.5" fill="#ffffff" />
    <rect x="5" y="9" width="12" height="4" rx="1.5" fill="#ffffff" />
  </g>

  <!-- Emergency Medical Bag / First Responder Kit on Floor -->
  <g transform="translate(180, 175)" filter="url(#softShadow)">
    <!-- Bag Body -->
    <rect x="0" y="8" width="28" height="18" rx="4" fill="#dc2626" />
    <!-- Bag Lid / Flap -->
    <path d="M0 12 L 14 4 L 28 12 Z" fill="#b91c1c" />
    <!-- Handle -->
    <path d="M8 8 C 8 4, 20 4, 20 8" fill="none" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" />
    <!-- White Cross on Kit -->
    <rect x="12" y="14" width="4" height="8" rx="1" fill="#ffffff" />
    <rect x="10" y="16" width="8" height="4" rx="1" fill="#ffffff" />
    <!-- Gold clasp -->
    <rect x="13" y="12" width="2" height="2" rx="0.5" fill="#fbbf24" />
  </g>

  <!-- Urgent Speed / Action Blur Particles -->
  <circle cx="70" cy="190" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="50" cy="205" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="110" cy="180" r="2.5" fill="#38bdf8" opacity="0.4" />
  <line x1="80" y1="195" x2="95" y2="195" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Foreground Vignette Frame Overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />
</svg>