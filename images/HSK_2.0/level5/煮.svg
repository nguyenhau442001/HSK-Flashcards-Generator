<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Kitchen Background Elements -->
  <rect x="0" y="100" width="240" height="140" fill="#334155"/> <!-- Wall -->
  <rect x="0" y="150" width="240" height="90" fill="#475569"/> <!-- Countertop -->

  <!-- Window -->
  <rect x="160" y="40" width="60" height="60" rx="8" fill="#64748b"/>
  <rect x="165" y="45" width="50" height="50" rx="6" fill="#94a3b8"/>
  <circle cx="190" cy="70" r="15" fill="#a78bfa" opacity="0.3"/> <!-- Light through window -->

  <!-- Mother Character -->
  <!-- Body -->
  <path d="M120 120 C110 100, 100 100, 100 120 L100 180 C100 190, 110 190, 120 190 C130 190, 140 190, 140 180 L140 120 C140 100, 130 100, 120 120 Z" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="120" cy="90" r="25" fill="#fbbf24"/>
  <!-- Hair -->
  <path d="M120 65 C100 50, 90 70, 95 90 C90 100, 100 110, 120 110 C140 110, 150 100, 145 90 C150 70, 140 50, 120 65 Z" fill="#64748b"/>
  <!-- Eyes -->
  <circle cx="110" cy="85" r="3" fill="#1e293b"/>
  <circle cx="130" cy="85" r="3" fill="#1e293b"/>
  <!-- Mouth (gentle smile) -->
  <path d="M115 95 Q120 100, 125 95" stroke="#1e293b" stroke-width="2" fill="none"/>
  <!-- Arms -->
  <path d="M105 130 Q95 140, 90 155 Q85 170, 95 175 C95 175, 100 170, 105 165 C105 165, 110 160, 110 150 Z" fill="#fbbf24"/> <!-- Left arm -->
  <path d="M135 130 Q145 140, 150 155 Q155 170, 145 175 C145 175, 140 170, 135 165 C135 165, 130 160, 130 150 Z" fill="#fbbf24"/> <!-- Right arm -->

  <!-- Stove and Pot -->
  <rect x="80" y="160" width="80" height="60" rx="8" fill="#64748b"/> <!-- Stove base -->
  <rect x="85" y="165" width="70" height="40" rx="4" fill="#475569"/> <!-- Stove top -->
  <circle cx="120" cy="175" r="20" fill="#334155"/> <!-- Burner -->
  <circle cx="120" cy="175" r="15" fill="#1e293b"/> <!-- Burner inner -->
  <circle cx="120" cy="175" r="8" fill="#f59e0b" opacity="0.8"/> <!-- Heat glow -->

  <!-- Pot -->
  <path d="M100 150 Q105 140, 110 135 H130 Q135 140, 140 150 L145 170 H95 Z" fill="#94a3b8"/>
  <rect x="105" y="130" width="30" height="8" rx="4" fill="#64748b"/> <!-- Pot lid -->
  <path d="M115 125 Q120 120, 125 125" stroke="#64748b" stroke-width="3" stroke-linecap="round" fill="none"/> <!-- Lid handle -->

  <!-- Steam from pot -->
  <path d="M115 125 Q110 110, 105 100 Q100 90, 105 80 Q110 70, 120 70 Q130 70, 135 80 Q140 90, 135 100 Q130 110, 125 125 Z" fill="#e0f2fe" opacity="0.7"/>
  <path d="M108 120 Q105 105, 100 95 Q95 85, 100 75 Q105 65, 115 65 Q125 65, 130 75 Q135 85, 130 95 Q125 105, 122 120 Z" fill="#e0f2fe" opacity="0.5"/>

  <!-- Rice cooker spoon in hand -->
  <path d="M135 160 Q140 155, 145 150 L150 155 Q145 160, 140 165 Z" fill="#f59e0b"/> <!-- Spoon handle -->
  <circle cx="150" cy="155" r="5" fill="#f59e0b"/> <!-- Spoon head -->

</svg>