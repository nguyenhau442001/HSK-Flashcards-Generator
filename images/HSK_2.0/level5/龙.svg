<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Lantern Glow Gradient -->
    <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Dragon Body Gradient -->
    <linearGradient id="dragon-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Dragon Gold Accent Gradient -->
    <linearGradient id="dragon-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Fire/Ember Gradient -->
    <linearGradient id="fire-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Roof Tile Gradient -->
    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-glow)"/>

  <!-- Atmospheric Background Elements (Traditional Roof & Night Sky) -->
  <g opacity="0.4">
    <!-- Distant Stars / Sparks -->
    <circle cx="30" cy="40" r="1" fill="#fde047" opacity="0.6"/>
    <circle cx="70" cy="25" r="1.5" fill="#fde047" opacity="0.8"/>
    <circle cx="200" cy="35" r="1" fill="#fde047" opacity="0.5"/>
    <circle cx="215" cy="75" r="1.5" fill="#fde047" opacity="0.7"/>
    <circle cx="45" cy="90" r="1" fill="#fde047" opacity="0.4"/>
  </g>

  <!-- Traditional Architecture Silhouette (Roof Eaves & Pillars) -->
  <g filter="url(#soft-shadow)">
    <!-- Pillars -->
    <rect x="25" y="140" width="12" height="100" fill="#7f1d1d" rx="2"/>
    <rect x="203" y="140" width="12" height="100" fill="#7f1d1d" rx="2"/>
    
    <!-- Roof Structure Backdrop -->
    <path d="M 10 145 L 120 115 L 230 145 L 220 155 L 120 128 L 20 155 Z" fill="#1e3a8a"/>
    <path d="M 15 148 L 120 120 L 225 148 L 220 152 L 120 125 L 20 152 Z" fill="url(#roof-grad)"/>

    <!-- Lanterns hanging from roof -->
    <g>
      <!-- Left Lantern -->
      <line x1="50" y1="145" x2="50" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="50" cy="185" r="35" fill="url(#lantern-glow)"/>
      <path d="M 45 165 C 38 165 38 200 45 200 L 55 200 C 62 200 62 165 55 165 Z" fill="#dc2626"/>
      <ellipse cx="50" cy="165" rx="5" ry="2" fill="#b91c1c"/>
      <ellipse cx="50" cy="200" rx="5" ry="2" fill="#b91c1c"/>
      <line x1="50" y1="200" x2="50" y2="212" stroke="#f59e0b" stroke-width="1.5"/>

      <!-- Right Lantern -->
      <line x1="190" y1="145" x2="190" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="190" cy="185" r="35" fill="url(#lantern-glow)"/>
      <path d="M 185 165 C 178 165 178 200 185 200 L 195 200 C 202 200 202 165 195 165 Z" fill="#dc2626"/>
      <ellipse cx="190" cy="165" rx="5" ry="2" fill="#b91c1c"/>
      <ellipse cx="190" cy="200" rx="5" ry="2" fill="#b91c1c"/>
      <line x1="190" y1="200" x2="190" y2="212" stroke="#f59e0b" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Ambient Glow Behind Dragon -->
  <circle cx="120" cy="110" r="60" fill="#f59e0b" opacity="0.15" filter="url(#soft-shadow)"/>

  <!-- MAIN SUBJECT: FESTIVE CHINESE DRAGON (Lóng) -->
  <g filter="url(#soft-shadow)">
    <!-- Dragon Body Coils (Dynamic S-Curve) -->
    <!-- Tail part -->
    <path d="M 60 170 C 45 170 35 150 45 135 C 55 120 75 130 75 145" fill="none" stroke="url(#dragon-body)" stroke-width="16" stroke-linecap="round"/>
    <!-- Tail decorative fins -->
    <path d="M 40 145 Q 30 140 35 130 Q 42 138 48 140" fill="url(#dragon-gold)"/>

    <!-- Mid body -->
    <path d="M 75 145 C 75 165 95 180 115 175 C 135 170 145 145 130 130 C 115 115 90 120 85 105" fill="none" stroke="url(#dragon-body)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Dragon Scales Texture (Abstract highlights along body) -->
    <path d="M 70 152 Q 80 168 100 165" fill="none" stroke="url(#dragon-gold)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 120 155 Q 130 140 122 130" fill="none" stroke="url(#dragon-gold)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Dragon Mane / Spines (Yellow/Gold fluff along back) -->
    <path d="M 45 130 Q 52 115 65 125" fill="none" stroke="url(#dragon-gold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 82 105 Q 92 90 105 102" fill="none" stroke="url(#dragon-gold)" stroke-width="7" stroke-linecap="round"/>

    <!-- Dragon Neck & Head -->
    <path d="M 85 105 C 80 90 90 75 105 70 C 120 65 140 75 145 90 C 150 105 135 120 120 115" fill="url(#dragon-body)"/>

    <!-- Dragon Head Group -->
    <g transform="translate(115, 60)">
      <!-- Snout / Jaw -->
      <path d="M 0 20 C 15 20 30 25 35 35 C 40 45 25 55 10 50 C 0 45 -5 30 0 20 Z" fill="url(#dragon-body)"/>
      <path d="M 10 40 C 20 42 28 40 32 35 C 28 46 15 48 5 45 Z" fill="#9f1239"/>

      <!-- Nostril & Smoke/Fire -->
      <circle cx="30" cy="32" r="3" fill="#fef08a"/>
      <path d="M 33 32 Q 45 30 50 25 Q 40 35 33 38 Z" fill="url(#fire-grad)" opacity="0.9"/>

      <!-- Eyes (Expressive, friendly, vibrant) -->
      <ellipse cx="12" cy="22" rx="7" ry="9" fill="#fef08a" stroke="#b91c1c" stroke-width="1.5"/>
      <circle cx="14" cy="22" r="4" fill="#0f172a"/>
      <circle cx="15.5" cy="20" r="1.5" fill="#ffffff"/>

      <!-- Eyebrow / Horn Gold Accent -->
      <path d="M 2 12 C 10 5 22 10 25 18 C 22 15 10 10 2 12 Z" fill="url(#dragon-gold)"/>

      <!-- Antlers / Horns -->
      <path d="M 5 12 C -2 0 -10 5 -12 10 C -8 8 -5 12 2 15 Z" fill="url(#dragon-gold)"/>
      <path d="M -7 5 C -12 -2 -18 0 -20 3" fill="none" stroke="url(#dragon-gold)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Fluffy Cheeks / Whiskers (Golden) -->
      <path d="M 20 40 Q 32 45 38 40 Q 30 50 18 45 Z" fill="url(#dragon-gold)"/>
      <path d="M -5 35 Q -15 38 -20 32 Q -12 42 -2 40 Z" fill="url(#dragon-gold)"/>
      <path d="M 15 50 Q 20 62 12 65 Q 18 58 10 52 Z" fill="url(#dragon-gold)"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Sparks / Confetti / Fireballs -->
  <g>
    <!-- Floating festive sparks -->
    <circle cx="85" cy="50" r="3" fill="#fbbf24" opacity="0.8" filter="url(#soft-shadow)"/>
    <circle cx="160" cy="40" r="2" fill="#f43f5e" opacity="0.8"/>
    <circle cx="175" cy="95" r="2.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="55" cy="115" r="2" fill="#fde047" opacity="0.9"/>
    
    <!-- Small glowing orb / pearl being chased by dragon -->
    <g transform="translate(165, 85)" filter="url(#soft-shadow)">
      <circle cx="0" cy="0" r="10" fill="url(#lantern-glow)"/>
      <circle cx="0" cy="0" r="6" fill="#fef08a"/>
      <circle cx="-2" cy="-2" r="2" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>

  <!-- Ground / Surface Floor line with subtle warm lighting -->
  <rect x="0" y="225" width="240" height="15" fill="#090d16"/>
  <path d="M 0 225 Q 120 218 240 225" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
</svg>