<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing magical effect for contents bursting out -->
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Chest Gradients -->
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="chestRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow representing 'containing / bursting with contents' -->
  <circle cx="120" cy="110" r="80" fill="url(#magicGlow)" />

  <!-- Background Environment/Props: A magical desk/surface -->
  <path d="M 20 190 L 220 190 L 240 220 L 0 220 Z" fill="#090d16" opacity="0.8" />
  <ellipse cx="120" cy="190" rx="100" ry="8" fill="#334155" opacity="0.4" />

  <!-- Floating magical elements emerging from the book/chest (Representing "Bao Han" / Containing rich contents) -->
  <g filter="url(#dropShadow)">
    <!-- Star 1 -->
    <path d="M 60 70 L 63 78 L 71 81 L 63 84 L 60 92 L 57 84 L 49 81 L 57 78 Z" fill="#fbbf24" />
    <!-- Star 2 -->
    <path d="M 180 60 L 182 65 L 187 67 L 182 69 L 180 74 L 178 69 L 173 67 L 178 65 Z" fill="#38bdf8" />
    <!-- Glowing Orb / Gem -->
    <circle cx="145" cy="55" r="10" fill="#10b981" />
    <circle cx="142" cy="52" r="3" fill="#6ee7b7" />
    <!-- Floating Gear (Knowledge/Ideas) -->
    <path d="M 85 45 L 88 44 L 90 47 L 93 46 L 95 49 L 92 51 L 94 54 L 91 56 L 89 53 L 86 54 L 84 51 L 87 49 Z" fill="#fb923c" />
    <!-- Light particles -->
    <circle cx="100" cy="65" r="4" fill="#f472b6" />
    <circle cx="150" cy="85" r="3" fill="#fbbf24" />
    <circle cx="75" cy="115" r="2.5" fill="#38bdf8" />
  </g>

  <!-- MAIN SUBJECT: An open treasure chest & magical tome brimming with contents -->
  <g filter="url(#dropShadow)">
    
    <!-- Open Book Base (Laying flat/tilted beneath or behind) -->
    <path d="M 60 145 Q 120 165 180 145 L 180 175 Q 120 195 60 175 Z" fill="#e2e8f0" />
    <path d="M 60 145 Q 120 165 120 175 L 120 195 Q 60 175 60 145 Z" fill="#cbd5e1" />
    <path d="M 120 175 Q 120 165 180 145 L 180 175 Q 120 195 120 195 Z" fill="#f1f5f9" />

    <!-- Treasure Chest Back/Interior -->
    <path d="M 70 110 L 170 110 L 175 145 L 65 145 Z" fill="#78350f" />

    <!-- Contents spilling out of the chest (Glowing potions, scrolls, gems) -->
    <!-- Magic Scroll -->
    <path d="M 95 110 Q 110 90 135 105 L 130 115 Q 110 100 95 115 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <!-- Potion Bottle -->
    <path d="M 140 100 L 146 100 L 148 95 L 152 95 L 154 100 L 160 100 L 158 120 L 142 120 Z" fill="#ec4899" />
    <rect x="146" y="93" width="6" height="3" fill="#cbd5e1" rx="1" />
    <circle cx="150" cy="110" r="3" fill="#fce7f3" opacity="0.6" />

    <!-- Chest Front Body -->
    <path d="M 65 115 L 175 115 L 170 155 L 70 155 Z" fill="url(#chestWood)" />
    <!-- Wooden Planks Texture lines -->
    <line x1="67" y1="135" x2="173" y2="135" stroke="#78350f" stroke-width="2" opacity="0.6" />
    
    <!-- Chest Metal Reinforcements (Straps & Rivets) -->
    <rect x="85" y="115" width="10" height="40" fill="#d97706" />
    <circle cx="90" cy="123" fill="#78350f" r="1.5" />
    <circle cx="90" cy="147" fill="#78350f" r="1.5" />

    <rect x="145" y="115" width="10" height="40" fill="#d97706" />
    <circle cx="150" cy="123" fill="#78350f" r="1.5" />
    <circle cx="150" cy="147" fill="#78350f" r="1.5" />

    <!-- Chest Rim Bottom -->
    <path d="M 65 112 L 175 112 L 175 117 L 65 117 Z" fill="url(#chestRim)" />

    <!-- Chest Lid (Open upward and backward) -->
    <path d="M 65 112 Q 120 70 175 112 L 170 95 Q 120 55 70 95 Z" fill="url(#chestWood)" />
    <!-- Lid Metal Framing -->
    <path d="M 65 112 Q 120 70 175 112 L 173 107 Q 120 67 67 107 Z" fill="url(#chestRim)" />
    <rect x="85" y="80" width="10" height="30" fill="#d97706" transform="rotate(-15 90 95)" />
    <rect x="145" y="80" width="10" height="30" fill="#d97706" transform="rotate(15 150 95)" />

    <!-- Center Lock / Latch -->
    <rect x="115" y="110" width="10" height="14" rx="2" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />
    <circle cx="120" cy="116" r="2" fill="#78350f" />

  </g>

  <!-- Foreground decorative elements for atmospheric depth -->
  <g opacity="0.7">
    <!-- Small floating sparkles near the base -->
    <circle cx="50" cy="165" r="2" fill="#fbbf24" />
    <circle cx="195" cy="155" r="3" fill="#38bdf8" />
    <circle cx="110" cy="180" r="1.5" fill="#f472b6" />
  </g>

</svg>