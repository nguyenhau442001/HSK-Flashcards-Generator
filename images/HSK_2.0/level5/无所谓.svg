<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="rugGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Room Interior Background -->
  <rect x="20" y="25" width="200" height="135" fill="url(#wallGradient)" rx="4"/>
  
  <!-- Floor -->
  <path d="M20 160 L220 160 L230 205 L10 205 Z" fill="#0f172a"/>
  <!-- Cozy Rug -->
  <ellipse cx="120" cy="185" rx="65" ry="15" fill="url(#rugGradient)" opacity="0.8"/>

  <!-- Window with rainy/night urban view -->
  <rect x="35" y="35" width="50" height="65" fill="#090d16" stroke="#475569" stroke-width="3" rx="2"/>
  <line x1="60" y1="35" x2="60" y2="100" stroke="#475569" stroke-width="2"/>
  <line x1="35" y1="67" x2="85" y2="67" stroke="#475569" stroke-width="2"/>
  <!-- Raindrops outside window -->
  <line x1="45" y1="45" x2="42" y2="55" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
  <line x1="55" y1="75" x2="52" y2="85" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
  <line x1="72" y1="50" x2="69" y2="60" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>

  <!-- Wall Shelf & Plant -->
  <rect x="150" y="45" width="55" height="4" fill="#64748b" rx="1"/>
  <!-- Pot -->
  <path d="M167 45 L173 35 L183 35 L189 45 Z" fill="#f43f5e"/>
  <!-- Plant Leaves -->
  <path d="M178 35 Q170 20 160 25 Q170 30 178 35 Z" fill="#10b981"/>
  <path d="M178 35 Q185 18 195 22 Q188 28 178 35 Z" fill="#34d399"/>
  <path d="M178 35 Q178 15 178 20 Q178 28 178 35 Z" fill="#059669"/>

  <!-- Floor Lamp in Corner -->
  <circle cx="200" cy="90" r="30" fill="url(#lampGlow)"/>
  <line x1="200" y1="50" x2="200" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <path d="M190 50 L210 50 L215 65 L185 65 Z" fill="#f59e0b"/>
  <ellipse cx="200" cy="160" rx="12" ry="4" fill="#64748b"/>

  <!-- Side Table with Tea Cup -->
  <rect x="145" y="130" width="30" height="30" fill="#334155" rx="2"/>
  <path d="M155 124 Q155 120 160 120 Q165 120 165 124 Z" fill="#e2e8f0"/>
  <path d="M165 122 C168 122 168 126 165 126" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>

  <!-- MAIN CHARACTER: Relaxed on the Sofa -->
  <!-- Sofa Body -->
  <path d="M55 120 L135 120 C145 120 150 125 150 135 L150 165 C150 170 145 175 140 175 L50 175 C45 175 40 170 40 165 L40 135 C40 125 45 120 55 120 Z" fill="#3b82f6"/>
  <!-- Sofa Cushions & Backrest -->
  <path d="M45 110 L145 110 C150 110 155 115 155 120 L155 145 C155 150 150 155 145 155 L45 155 C40 155 35 150 35 145 L35 120 C35 115 40 110 45 110 Z" fill="#2563eb"/>
  <rect x="50" y="125" width="42" height="30" fill="#1d4ed8" rx="4"/>
  <rect x="98" y="125" width="42" height="30" fill="#1d4ed8" rx="4"/>

  <!-- Character Seated / Reclining, Shrugging Shoulders (Expressing "Doesn't Matter / Whatever") -->
  <!-- Legs lounging -->
  <path d="M135 155 L165 160 L160 172 L125 165 Z" fill="#0f172a"/>
  
  <!-- Torso & Hoodie -->
  <path d="M75 105 L115 105 L120 150 L70 150 Z" fill="#fb923c"/>
  
  <!-- Head & Face -->
  <circle cx="95" cy="82" r="16" fill="#fbcfe8"/>
  <!-- Casual Hair -->
  <path d="M79 80 Q85 65 100 68 Q112 70 111 82 Q105 78 95 78 Q85 78 79 80 Z" fill="#334155"/>
  
  <!-- Facial Expression: Calm, eyes closed or chill indifference ("无所谓" vibe) -->
  <!-- Closed happy/chill eyes (arcs) -->
  <path d="M88 81 Q91 84 94 81" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M98 81 Q101 84 104 81" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Neutral/Slight Smile Mouth -->
  <path d="M93 90 Q96 92 99 90" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Blushing cheeks for friendly illustrative tone -->
  <circle cx="87" cy="86" r="3" fill="#f43f5e" opacity="0.3"/>
  <circle cx="105" cy="86" r="3" fill="#f43f5e" opacity="0.3"/>

  <!-- Arms in a relaxed "shrugging/whatever" gesture -->
  <!-- Left arm -->
  <path d="M75 110 L60 125 L70 130" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm -->
  <path d="M115 110 L130 122 L122 130" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Hands -->
  <circle cx="68" cy="132" r="4" fill="#fbcfe8"/>
  <circle cx="120" cy="132" r="4" fill="#fbcfe8"/>

  <!-- Phone floating nearby showing ignored/missed notification -->
  <rect x="135" y="85" width="22" height="38" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="4" transform="rotate(15 135 85)"/>
  <rect x="139" y="90" width="14" height="24" fill="#334155" rx="1" transform="rotate(15 135 85)"/>
  <!-- Notification dismissed icon (X mark on screen) -->
  <path d="M144 98 L148 106 M148 98 L144 106" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating shrug motion marks / aesthetic accents -->
  <path d="M60 70 Q65 65 60 60" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M125 72 Q120 67 125 62" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Foreground Floor Shadow -->
  <ellipse cx="120" cy="205" rx="100" ry="5" fill="#000000" opacity="0.3"/>
</svg>