<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow Gradient -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Projector Beam Gradient -->
    <linearGradient id="beam-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03" />
    </linearGradient>

    <!-- Retro Wood Gradient -->
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Metallic/Brass Gradient -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light Effects -->
  <circle cx="120" cy="80" r="110" fill="url(#lamp-glow)" />

  <!-- Background Environment & Props -->
  <!-- Brick Wall Texture Lines / Background Elements -->
  <g fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4">
    <line x1="20" y1="50" x2="220" y2="50" />
    <line x1="20" y1="90" x2="220" y2="90" />
    <line x1="20" y1="130" x2="220" y2="130" />
    <line x1="70" y1="50" x2="70" y2="90" />
    <line x1="150" y1="90" x2="150" y2="130" />
    <line x1="100" y1="130" x2="100" y2="170" />
  </g>

  <!-- Hanging Retro Lamp -->
  <path d="M120 0 L120 35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M95 35 L145 35 L135 48 L105 48 Z" fill="#475569" filter="url(#drop-shadow)"/>
  <circle cx="120" cy="48" r="6" fill="#fbbf24" />

  <!-- Wooden Desk/Surface for the Artifacts -->
  <path d="M20 185 L220 185 L230 220 L10 220 Z" fill="url(#wood-grad)" filter="url(#drop-shadow)"/>
  <path d="M20 185 L220 185 L220 190 L20 190 Z" fill="#b45309" opacity="0.6"/>

  <!-- TIME-BRIDGING ARTIFACTS: PAST & PRESENT -->
  
  <!-- LEFT: The Vintage Era (Old Rotary Phone & Clock/Gramophone elements) -->
  <g transform="translate(45, 125)" filter="url(#drop-shadow)">
    <!-- Old Rotary Phone Body -->
    <path d="M10 40 Q10 20 30 20 L55 20 Q75 20 75 40 L70 60 L15 60 Z" fill="#0284c7" />
    <path d="M15 60 L70 60 L75 65 L10 65 Z" fill="#0369a1" />
    
    <!-- Rotary Dial -->
    <circle cx="42" cy="40" r="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <circle cx="42" cy="40" r="3" fill="#1e293b"/>
    <!-- Dial holes pattern -->
    <circle cx="38" cy="35" r="1.5" fill="#334155"/>
    <circle cx="46" cy="35" r="1.5" fill="#334155"/>
    <circle cx="48" cy="42" r="1.5" fill="#334155"/>

    <!-- Handset resting on top -->
    <path d="M2 15 Q42 5 82 15" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="8" cy="14" r="6" fill="#0369a1"/>
    <circle cx="76" cy="14" r="6" fill="#0369a1"/>
  </g>

  <!-- Old Framed Sepia Photo (Representing bygone decades) -->
  <g transform="translate(25, 80) rotate(-8)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="38" height="48" fill="#f1f5f9" rx="2"/>
    <rect x="4" y="4" width="30" height="34" fill="#d97706" opacity="0.3"/>
    <!-- Simple retro landscape in photo -->
    <circle cx="12" cy="16" r="4" fill="#b45309"/>
    <path d="M4 30 Q15 18 24 26 L34 38 L4 38 Z" fill="#78350f" opacity="0.5"/>
  </g>

  <!-- RIGHT: The Modern Era (Holographic Projection / Smart Device Beam) -->
  <!-- Projector Device on Desk -->
  <g transform="translate(160, 165)" filter="url(#drop-shadow)">
    <path d="M0 10 L40 10 L35 20 L5 20 Z" fill="url(#brass-grad)"/>
    <ellipse cx="20" cy="10" rx="20" ry="6" fill="#facc15"/>
    <circle cx="20" cy="10" r="10" fill="#38bdf8"/>
  </g>

  <!-- Light Beam shooting upwards -->
  <polygon points="175,175 205,175 220,70 160,70" fill="url(#beam-grad)" />

  <!-- Floating Futuristic/Modern Elements inside the Beam (Representing current era) -->
  <g transform="translate(165, 80)">
    <!-- Floating Smart Screen / Data UI -->
    <rect x="0" y="0" width="45" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#drop-shadow)"/>
    <!-- UI Graphic Bars -->
    <rect x="6" y="8" width="20" height="4" rx="2" fill="#38bdf8"/>
    <rect x="6" y="16" width="30" height="3" rx="1.5" fill="#10b981"/>
    <circle cx="36" cy="10" r="3" fill="#ec4899"/>
  </g>

  <!-- Floating Glowing Digital Nodes / Time Particles -->
  <circle cx="100" cy="110" r="4" fill="#38bdf8" filter="url(#drop-shadow)" />
  <circle cx="130" cy="70" r="3" fill="#fbbf24" filter="url(#drop-shadow)" />
  <circle cx="85" cy="60" r="2" fill="#10b981" filter="url(#drop-shadow)" />
  <circle cx="145" cy="135" r="3.5" fill="#ec4899" filter="url(#drop-shadow)" />

  <!-- Central Connecting Dynamic Arrow / Timeline Flow -->
  <path d="M 85 145 Q 120 120 155 145" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round" opacity="0.8"/>
  <polygon points="152,140 162,147 150,150" fill="#fbbf24"/>

  <!-- Foreground Atmospheric Sparks / Glows -->
  <circle cx="50" cy="190" r="1.5" fill="#f8fafc" opacity="0.6"/>
  <circle cx="190" cy="200" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="110" cy="210" r="1" fill="#fbbf24" opacity="0.8"/>
</svg>