<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Presentation Screen Glow -->
    <linearGradient id="screen-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="light-beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment / Office Interior -->
  <!-- Wall panels & Accent lines -->
  <path d="M0 150 L240 150" stroke="#334155" stroke-width="2"/>
  <rect x="25" y="30" width="120" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="28" y="33" width="114" height="84" rx="6" fill="url(#screen-glow)"/>

  <!-- Presentation Graphics on Screen (Abstract charts, no text) -->
  <polyline points="45,95 65,75 85,85 105,55 125,65" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="105" cy="55" r="4" fill="#38bdf8"/>
  <rect x="45" y="100" width="15" height="10" rx="2" fill="#10b981"/>
  <rect x="70" y="95" width="15" height="15" rx="2" fill="#f59e0b"/>
  <rect x="95" y="90" width="15" height="20" rx="2" fill="#ec4899"/>

  <!-- Large Window with City Silhouette & Light Beam -->
  <path d="M170 30 L215 30 L215 150 L170 150 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M180 50 L190 50 L190 150 L180 150 Z" fill="#1e293b"/>
  <path d="M198 70 L208 70 L208 150 L198 150 Z" fill="#1e293b"/>
  <!-- Light Beam from Window -->
  <polygon points="170,30 215,30 240,200 120,200" fill="url(#light-beam)"/>

  <!-- Office Plants for richness -->
  <path d="M210 135 C210 120 225 120 225 135 C225 145 210 150 210 150 Z" fill="#10b981"/>
  <path d="M200 140 C195 130 205 120 215 130 Z" fill="#059669"/>
  <rect x="205" y="150" width="16" height="20" rx="4" fill="#64748b"/>

  <!-- Main Conference Table -->
  <path d="M20 180 L220 180 L205 215 L35 215 Z" fill="#334155" filter="url(#shadow)"/>
  <path d="M20 180 L220 180 L225 186 L15 186 Z" fill="#475569"/>

  <!-- Table Props: Laptops, Notebooks, Coffee Cups -->
  <!-- Laptop 1 -->
  <path d="M50 175 L75 175 L80 183 L45 183 Z" fill="#94a3b8"/>
  <path d="M52 155 L73 155 C74 155 75 156 75 157 L73 175 L52 175 L50 157 C50 156 51 155 52 155 Z" fill="#cbd5e1"/>
  <!-- Notebook & Pen -->
  <rect x="95" y="168" width="22" height="15" rx="2" fill="#f8fafc" transform="rotate(-10 95 168)"/>
  <line x1="98" y1="172" x2="112" y2="172" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="98" y1="176" x2="110" y2="176" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Coffee Cup -->
  <rect x="135" y="165" width="10" height="14" rx="3" fill="#f43f5e"/>
  <path d="M145 168 C148 168 149 171 147 174" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Character 1: Trainer / Speaker (Standing left, pointing at screen) -->
  <!-- Body/Torso -->
  <path d="M85 110 C85 95 105 95 105 110 L110 155 L80 155 Z" fill="#3b82f6"/>
  <!-- Head & Hair -->
  <circle cx="95" cy="80" rx="14" ry="14" fill="#fcd34d"/>
  <path d="M81 78 C81 68 109 68 109 78 C109 82 105 84 95 82 C85 84 81 82 81 78 Z" fill="#1e293b"/>
  <!-- Face expression (Confident smile) -->
  <path d="M91 82 Q95 86 99 82" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <circle cx="91" cy="78" r="1.5" fill="#b45309"/>
  <circle cx="99" cy="78" r="1.5" fill="#b45309"/>
  <!-- Arms & Pointing Gesture -->
  <path d="M85 105 L65 125 L75 130" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M105 105 L125 90" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M90 155 L90 195" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <path d="M100 155 L100 195" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>

  <!-- Character 2: Employee / Trainee (Sitting front-right, taking notes) -->
  <!-- Head & Hair -->
  <circle cx="165" cy="135" rx="13" ry="13" fill="#ffedd5"/>
  <path d="M152 130 C152 118 178 118 178 130 C178 134 175 132 165 130 C155 132 152 134 152 130 Z" fill="#ea580c"/>
  <!-- Torso & Arms (Leaning forward engaged) -->
  <path d="M150 150 C150 140 180 140 180 150 L185 185 L145 185 Z" fill="#10b981"/>
  <!-- Arm writing -->
  <path d="M155 155 L140 170 L130 168" fill="none" stroke="#ffedd5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Character 3: Employee / Trainee (Sitting mid-right, listening attentively) -->
  <!-- Head & Hair -->
  <circle cx="195" cy="145" rx="12" ry="12" fill="#fbcfe8"/>
  <path d="M183 142 C183 132 207 132 207 142 C207 146 203 144 195 143 C187 144 183 146 183 142 Z" fill="#831843"/>
  <!-- Torso -->
  <path d="M182 160 C182 150 208 150 208 160 L210 195 L180 195 Z" fill="#a855f7"/>
  <!-- Arm crossed / resting -->
  <path d="M188 170 C195 165 202 170 205 175" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>

  <!-- Foreground ambient lighting / Vignette effect -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
</svg>