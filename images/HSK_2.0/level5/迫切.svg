<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Urgent Desk Lamp Cone -->
    <linearGradient id="lampCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>

    <!-- Urgent Red Pulse Glow -->
    <radialGradient id="urgentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Art Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Interior Details -->
  <!-- Office Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="8" />
  
  <!-- Window showing night city / urgency atmosphere -->
  <path d="M160 35 L205 35 L205 105 L160 105 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <path d="M160 35 L205 35 L205 105 L160 105 Z" fill="url(#windowLight)" />
  <!-- City building silhouettes outside window -->
  <rect x="168" y="70" width="8" height="35" fill="#1e293b" />
  <rect x="180" y="55" width="10" height="50" fill="#1e293b" />
  <rect x="194" y="65" width="7" height="40" fill="#1e293b" />
  <!-- Window Frame Cross -->
  <line x1="182" y1="35" x2="182" y2="105" stroke="#334155" stroke-width="2" />
  <line x1="160" y1="70" x2="205" y2="70" stroke="#334155" stroke-width="2" />

  <!-- Wall Clock showing late/urgent time -->
  <circle cx="120" cy="55" r="18" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <line x1="120" y1="55" x2="120" y2="44" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <line x1="120" y1="55" x2="130" y2="58" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <circle cx="120" cy="55" r="2" fill="#ef4444" />

  <!-- Bookshelf on wall -->
  <rect x="35" y="45" width="40" height="6" rx="2" fill="#475569" />
  <path d="M42 45 L42 32 L49 32 L49 45 Z" fill="#f43f5e" />
  <path d="M51 45 L51 28 L58 28 L58 45 Z" fill="#38bdf8" />
  <path d="M60 45 L60 35 L67 35 L67 45 Z" fill="#fbbf24" />

  <!-- Desk Surface -->
  <rect x="10" y="165" width="220" height="12" fill="#334155" rx="3" filter="url(#shadow)" />
  <rect x="10" y="177" width="220" height="45" fill="#1e293b" />
  <!-- Desk support legs -->
  <rect x="25" y="180" width="8" height="45" fill="#0f172a" />
  <rect x="207" y="180" width="8" height="45" fill="#0f172a" />

  <!-- Urgent Alarm/Alert Flash Background Aura behind desk -->
  <circle cx="85" cy="140" r="55" fill="url(#urgentGlow)" />

  <!-- Desk Lamp -->
  <path d="M50 165 L55 125 L65 125 L70 165 Z" fill="#64748b" />
  <path d="M42 125 L73 125 C73 112 63 105 57 105 C51 105 42 112 42 125 Z" fill="#f59e0b" filter="url(#shadow)" />
  <!-- Lamp light cone projecting down -->
  <polygon points="57,125 25,175 110,175" fill="url(#lampCone)" />

  <!-- Important Document Folder / Urgent Project File with Red Stamp & Exclamation -->
  <g transform="translate(60, 140)">
    <!-- Folder shadow -->
    <rect x="0" y="0" width="50" height="35" rx="4" fill="#cbd5e1" filter="url(#shadow)" />
    <!-- Folder cover -->
    <rect x="2" y="4" width="46" height="30" rx="3" fill="#f8fafc" />
    <path d="M2 10 L18 10 L22 15 L48 15" stroke="#cbd5e1" stroke-width="2" fill="none" />
    <!-- Urgent Red Warning Stamp / Papers spilling out -->
    <line x1="10" y1="20" x2="30" y2="20" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="27" x2="22" y2="27" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Red Exclamation Alert Icon on Folder -->
    <circle cx="38" cy="22" r="7" fill="#ef4444" />
    <path d="M38 18 L38 22 M38 24.5 L38 25.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Laptop showing intense deadline/chart -->
  <g transform="translate(135, 130)">
    <!-- Laptop Base -->
    <path d="M -10 35 L 50 35 L 45 42 L -5 42 Z" fill="#64748b" filter="url(#shadow)" />
    <!-- Laptop Screen -->
    <rect x="0" y="0" width="40" height="35" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Screen UI: Urgent downward trending or high-alert graph -->
    <polyline points="6,25 14,18 22,22 34,10" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="34" cy="10" r="3" fill="#ef4444" />
  </g>

  <!-- Coffee Mug -->
  <rect x="185" y="145" width="16" height="20" rx="3" fill="#e2e8f0" filter="url(#shadow)" />
  <path d="M 201 150 C 206 150 206 160 201 162" stroke="#e2e8f0" stroke-width="2.5" fill="none" />
  <!-- Steam indicating heat / intense work session -->
  <path d="M 190 138 C 190 134 195 132 193 128" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Character: Stressed/Urgent Office Worker leaning forward -->
  <g transform="translate(95, 80)">
    <!-- Body / Torso leaning forward in urgency -->
    <path d="M 15 45 C 5 60 -5 75 -15 95 L 45 95 C 35 75 25 60 25 45 Z" fill="#3b82f6" filter="url(#shadow)" />
    
    <!-- Collar and Tie -->
    <polygon points="12,42 23,42 17,52" fill="#ffffff" />
    <polygon points="16,52 18,52 20,70 14,70" fill="#ef4444" />

    <!-- Arms reaching forward frantically towards the urgent document/laptop -->
    <!-- Left Arm -->
    <path d="M 2 52 C -5 55 -15 65 -25 72" stroke="#3b82f6" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Left Hand grabbing/pointing at documents -->
    <circle cx="-27" cy="73" r="5" fill="#fcd34d" />

    <!-- Right Arm -->
    <path d="M 28 52 C 38 56 45 68 50 78" stroke="#3b82f6" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Right Hand on head in anxiety/urgency -->
    
    <!-- Neck -->
    <rect x="12" y="32" width="10" height="15" fill="#fcd34d" />

    <!-- Head showing anxious, tense expression -->
    <g transform="translate(17, 18)">
      <!-- Hair -->
      <path d="M -10 12 C -10 -5 10 -8 22 2 C 26 5 28 12 28 12 C 28 12 20 6 10 7 C 0 8 -8 12 -10 12 Z" fill="#1e293b" />
      
      <!-- Face Base -->
      <circle cx="8" cy="12" r="13" fill="#fcd34d" />

      <!-- Tense Eyebrows (slanted sharply down towards center for urgency) -->
      <line x1="1" y1="8" x2="6" y2="10" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <line x1="11" y1="10" x2="16" y2="8" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

      <!-- Wide Anxious Eyes -->
      <circle cx="3" cy="13" r="2.5" fill="#1e293b" />
      <circle cx="13" cy="13" r="2.5" fill="#1e293b" />

      <!-- Open Mouth (gasping/breathless under pressure) -->
      <ellipse cx="8" cy="20" rx="3" ry="2" fill="#1e293b" />

      <!-- Sweat Drop (Classic sign of pressure/urgency) -->
      <path d="M 22 10 C 22 10 25 15 25 17 C 25 18.6 23.6 20 22 20 C 20.4 20 19 18.6 19 17 C 19 15 22 10 22 10 Z" fill="#38bdf8" />
    </g>

    <!-- Right hand clutching head in urgent realization -->
    <path d="M 28 35 C 38 30 42 22 38 18" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#shadow)" />
  </g>

  <!-- Floating Urgent Action Symbol / Exclamation Burst (Stylized context accent) -->
  <g transform="translate(115, 30)">
    <circle cx="0" cy="0" r="10" fill="#ef4444" opacity="0.9" filter="url(#shadow)" />
    <path d="M 0 -5 L 0 1 M 0 3 L 0 5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>