      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Cracked Earth Ground -->
    <path d="M0 140 L160 140 L150 160 L10 160 Z" fill="#94a3b8" opacity="0.3"/>
    <path d="M20 145 L40 155 M60 142 L70 158 M100 148 L120 152" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Plant Pot -->
    <path d="M40 100 L120 100 L110 140 L50 140 Z" fill="#fb923c"/>
    <path d="M35 100 L125 100 L120 90 L40 90 Z" fill="#f59e0b"/>
    
    <!-- Dried Plant -->
