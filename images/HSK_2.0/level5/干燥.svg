    <path d="M80 70 L60 50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M80 60 L100 40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M80 85 L65 75" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Sun/Heat Iconography -->
    <circle cx="180" cy="30" r="20" fill="#f59e0b"/>
    <path d="M180 5 L180 0 M180 60 L180 55 M205 30 L210 30 M155 30 L150 30" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Heat Waves -->
    <path d="M160 80 Q170 70 180 80 T200 80" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
    <path d="M160 90 Q170 80 180 90 T200 90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
  </g>
