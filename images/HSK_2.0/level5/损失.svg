<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Cracked Floor Surface -->
    <path d="M0 120 L160 120 L150 140 L-10 140 Z" fill="#334155"/>
    <path d="M40 120 L50 140 M80 120 L70 140 M120 120 L130 140" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Toppled Vase (The Loss) -->
    <path d="M50 120 C50 80 70 60 90 60 C110 60 130 80 130 120" fill="#fb923c"/>
    <ellipse cx="90" cy="60" rx="40" ry="10" fill="#f59e0b"/>
    
    <!-- Shattered Pieces -->
    <path d="M40 125 L30 135 L50 130 Z" fill="#fbbf24"/>
    <path d="M140 125 L150 135 L135 130 Z" fill="#fbbf24"/>
    <path d="M90 120 L100 135 L80 130 Z" fill="#fbbf24"/>
    
    <!-- Spilled Liquid/Effect -->
    <path d="M60 120 Q90 140 120 120" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="70" cy="125" r="3" fill="#38bdf8"/>
    <circle cx="110" cy="125" r="3" fill="#38bdf8"/>
    
    <!-- Atmospheric Debris -->
    <circle cx="30" cy="80" r="2" fill="#94a3b8"/>
    <circle cx="140" cy="70" r="3" fill="#94a3b8"/>
    <path d="M130 90 L135 95" stroke="#94a3b8" stroke-width="2"/>
  </g>
</svg>