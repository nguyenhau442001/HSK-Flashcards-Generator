<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  
  <!-- Distant City Skyline & Glowing Windows (Representing High Population / Dense Urban Area) -->
  <g opacity="0.4">
    <rect x="20" y="100" width="18" height="90" fill="#475569"/>
    <rect x="42" y="80" width="22" height="110" fill="#334155"/>
    <rect x="68" y="110" width="16" height="80" fill="#475569"/>
    <rect x="88" y="70" width="26" height="120" fill="#475569"/>
    <rect x="118" y="90" width="20" height="100" fill="#334155"/>
    <rect x="142" y="65" width="28" height="125" fill="#475569"/>
    <rect x="174" y="95" width="20" height="95" fill="#334155"/>
    <rect x="198" y="85" width="22" height="105" fill="#475569"/>
    
    <!-- Window Lights Grid -->
    <fill color="#fef08a"/>
    <rect x="25" y="110" width="3" height="4" fill="#fbbf24"/>
    <rect x="31" y="110" width="3" height="4" fill="#fbbf24"/>
    <rect x="25" y="125" width="3" height="4" fill="#fbbf24"/>
    <rect x="31" y="125" width="3" height="4" fill="#fbbf24"/>
    
    <rect x="48" y="90" width="4" height="5" fill="#fbbf24"/>
    <rect x="56" y="90" width="4" height="5" fill="#fbbf24"/>
    <rect x="48" y="105" width="4" height="5" fill="#fbbf24"/>
    <rect x="56" y="120" width="4" height="5" fill="#fbbf24"/>
    <rect x="48" y="135" width="4" height="5" fill="#fbbf24"/>

    <rect x="94" y="80" width="4" height="6" fill="#fbbf24"/>
    <rect x="102" y="80" width="4" height="6" fill="#fbbf24"/>
    <rect x="94" y="95" width="4" height="6" fill="#fbbf24"/>
    <rect x="102" y="110" width="4" height="6" fill="#fbbf24"/>
    <rect x="94" y="125" width="4" height="6" fill="#fbbf24"/>
    
    <rect x="150" y="75" width="4" height="5" fill="#fbbf24"/>
    <rect x="158" y="90" width="4" height="5" fill="#fbbf24"/>
    <rect x="150" y="105" width="4" height="5" fill="#fbbf24"/>
    <rect x="158" y="120" width="4" height="5" fill="#fbbf24"/>
  </g>

  <!-- Atmospheric Glow from City -->
  <rect x="0" y="100" width="240" height="90" fill="url(#glowGrad)"/>

  <!-- Foreground Elevated Walkway/Overpass Deck -->
  <path d="M 0 170 Q 120 160 240 175 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <path d="M 0 168 Q 120 158 240 173 L 240 177 Q 120 162 0 172 Z" fill="#334155"/>

  <!-- Crowd of Diverse Stylized People (Representing "많은 인구" / High Population) -->
  <!-- Back row of silhouettes / simplified figures -->
  <circle cx="35" cy="155" r="7" fill="#64748b"/>
  <rect x="30" y="162" width="10" height="15" rx="3" fill="#64748b"/>

  <circle cx="55" cy="152" r="8" fill="#475569"/>
  <rect x="49" y="160" width="12" height="18" rx="3" fill="#475569"/>

  <circle cx="185" cy="153" r="8" fill="#64748b"/>
  <rect x="179" y="161" width="12" height="18" rx="3" fill="#64748b"/>

  <circle cx="210" cy="156" r="7" fill="#475569"/>
  <rect x="205" y="163" width="10" height="15" rx="3" fill="#475569"/>

  <!-- Mid row figures with color -->
  <circle cx="75" cy="150" r="9" fill="#fbcfe8"/>
  <path d="M 64 180 Q 75 158 86 180 Z" fill="#ec4899"/>

  <circle cx="100" cy="147" r="9" fill="#fed7aa"/>
  <path d="M 89 178 Q 100 155 111 178 Z" fill="#f97316"/>

  <circle cx="145" cy="148" r="9" fill="#bae6fd"/>
  <path d="M 134 179 Q 145 156 156 179 Z" fill="#0284c7"/>

  <circle cx="165" cy="151" r="8" fill="#bbf7d0"/>
  <path d="M 156 180 Q 165 158 174 180 Z" fill="#10b981"/>

  <!-- Foreground Main Expressive Characters -->
  <!-- Character Left (Pointing and talking about the dense crowd/city) -->
  <g transform="translate(15, 130)">
    <!-- Body -->
    <path d="M 15 35 Q 25 25 35 35 L 42 65 L 8 65 Z" fill="#6366f1"/>
    <!-- Head & Hair -->
    <circle cx="25" cy="15" r="10" fill="#fed7aa"/>
    <path d="M 15 12 Q 25 2 35 12 Q 30 5 25 5 Q 20 5 15 12 Z" fill="#1e293b"/>
    <!-- Arm pointing forward -->
    <path d="M 30 30 L 50 25 L 50 30 L 32 36 Z" fill="#fed7aa"/>
  </g>

  <!-- Character Center (Looking impressed, holding a coffee cup or bag) -->
  <g transform="translate(105, 122)">
    <!-- Body -->
    <path d="M 12 35 Q 22 25 32 35 L 40 70 L 4 70 Z" fill="#f43f5e"/>
    <!-- Head & Hair -->
    <circle cx="22" cy="13" r="10" fill="#fde68a"/>
    <path d="M 12 10 Q 22 0 32 10 Z" fill="#451a03"/>
    <!-- Arms -->
    <path d="M 12 38 L 5 50 L 12 53 Z" fill="#fde68a"/>
    <path d="M 32 38 L 38 48 L 32 50 Z" fill="#fde68a"/>
    <!-- Shopping bag / prop -->
    <rect x="2" y="50" width="10" height="14" rx="2" fill="#fbbf24"/>
  </g>

  <!-- Urban Traffic / Movement hints (Streaks of light for bustling city) -->
  <path d="M 0 195 Q 60 190 120 198 T 240 192" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 8" fill="none" opacity="0.6"/>
  <path d="M 0 210 Q 80 205 160 212 T 240 208" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="8 12" fill="none" opacity="0.6"/>

  <!-- Decorative Modern Frame / Accent -->
  <rect x="12" y="12" width="216" height="216" rx="16" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>