<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Chart Upward Trend Gradient -->
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background Elements -->
  <!-- Ambient Wall Decor / Bookshelf -->
  <rect x="25" y="40" width="45" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="75" x2="70" y2="75" stroke="#334155" stroke-width="1.5" />
  <rect x="33" y="50" width="10" height="20" rx="2" fill="#f59e0b" opacity="0.8" />
  <rect x="46" y="55" width="8" height="15" rx="2" fill="#38bdf8" opacity="0.8" />
  <rect x="33" y="85" width="12" height="15" rx="2" fill="#ec4899" opacity="0.8" />

  <!-- Window with Night City View -->
  <path d="M165,35 L215,35 L215,95 L165,95 Z" fill="#090d16" stroke="#334155" stroke-width="2" />
  <line x1="190" y1="35" x2="190" y2="95" stroke="#334155" stroke-width="1.5" />
  <line x1="165" y1="65" x2="215" y2="65" stroke="#334155" stroke-width="1.5" />
  <!-- City Lights outside -->
  <rect x="172" y="72" width="5" height="15" fill="#f59e0b" opacity="0.6" />
  <rect x="180" y="50" width="4" height="10" fill="#38bdf8" opacity="0.5" />
  <rect x="200" y="58" width="6" height="22" fill="#f59e0b" opacity="0.4" />
  <rect x="205" y="45" width="4" height="10" fill="#ec4899" opacity="0.6" />

  <!-- Desk Surface -->
  <path d="M15,175 L225,175 L210,210 L30,210 Z" fill="#334155" />
  <rect x="20" y="170" width="200" height="8" rx="2" fill="#475569" />

  <!-- Laptop on Desk -->
  <!-- Laptop Base -->
  <path d="M75,170 L165,170 L180,175 L60,175 Z" fill="#94a3b8" />
  <rect x="110" y="171" width="20" height="3" rx="1" fill="#64748b" />
  <!-- Laptop Screen -->
  <path d="M80,120 L160,120 L165,170 L75,170 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <!-- Screen Content: Financial Graph showing Increase (消费 📈) -->
  <rect x="88" y="128" width="64" height="34" rx="2" fill="#0f172a" />
  <rect x="88" y="128" width="64" height="34" rx="2" fill="url(#screenGlow)" />
  <!-- Trend Chart Area & Line -->
  <path d="M96,152 L110,146 L124,150 L144,134 L144,156 L96,156 Z" fill="url(#chartGrad)" />
  <path d="M96,152 L110,146 L124,150 L144,134" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="144" cy="134" r="3" fill="#10b981" />

  <!-- Shopping Bags (Context props for Consumption/Spending) -->
  <!-- Bag 1 (Pink/Fashion) -->
  <path d="M175,145 L205,145 L210,185 L170,185 Z" fill="#ec4899" filter="url(#dropShadow)" />
  <path d="M182,145 C182,137 198,137 198,145" fill="none" stroke="#fbcfe8" stroke-width="2" />
  <circle cx="190" cy="165" r="5" fill="#fdf2f8" opacity="0.6" />

  <!-- Bag 2 (Orange/Gadget/Retail) -->
  <path d="M152,155 L180,155 L185,190 L147,190 Z" fill="#fb923c" filter="url(#dropShadow)" />
  <path d="M158,155 C158,148 174,148 174,155" fill="none" stroke="#ffedd5" stroke-width="2" />
  <rect x="160" y="168" width="6" height="8" rx="1" fill="#fff" opacity="0.7" />

  <!-- Coffee Mug (Desk Prop) -->
  <rect x="52" y="155" width="14" height="18" rx="3" fill="#f8fafc" />
  <path d="M66,159 C72,159 72,169 66,169" fill="none" stroke="#f8fafc" stroke-width="2.5" />
  <path d="M56,152 C57,148 55,145 56,142" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Main Character (Shopper / Consumer reviewing expenses) -->
  <!-- Body / Torso (leaning forward happily/actively) -->
  <path d="M90,135 C90,120 115,120 120,135 L125,180 L85,180 Z" fill="#38bdf8" filter="url(#dropShadow)" />
  <!-- Collar -->
  <path d="M100,132 L110,132 L115,142 L95,142 Z" fill="#f8fafc" />

  <!-- Neck -->
  <rect x="101" y="112" width="16" height="15" fill="#fcd34d" />

  <!-- Head -->
  <circle cx="109" cy="100" r="18" fill="#fcd34d" filter="url(#dropShadow)" />

  <!-- Hair (Stylized modern dark hair) -->
  <path d="M91,96 C91,83 100,80 112,81 C124,82 127,92 127,100 L127,106 L120,102 C120,102 119,90 109,90 C99,90 94,96 94,96 Z" fill="#0f172a" />

  <!-- Facial Expression (Excited/Engaged) -->
  <!-- Eyes -->
  <circle cx="102" cy="98" r="2" fill="#0f172a" />
  <circle cx="116" cy="98" r="2" fill="#0f172a" />
  <!-- Smile -->
  <path d="M106,105 C108,109 112,109 114,105" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <!-- Cheeks (Blush) -->
  <circle cx="98" cy="103" r="3" fill="#f43f5e" opacity="0.4" />
  <circle cx="120" cy="103" r="3" fill="#f43f5e" opacity="0.4" />

  <!-- Arms / Hands interacting -->
  <!-- Left arm (pointing at screen/chart) -->
  <path d="M85,138 C75,138 68,145 74,152 C77,156 82,152 86,146" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hand -->
  <circle cx="74" cy="153" r="4" fill="#fcd34d" />

  <!-- Right arm (holding card / touching chin thoughtfully or excitedly) -->
  <path d="M125,138 C135,140 138,150 132,158" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <circle cx="131" cy="160" r="4" fill="#fcd34d" />

  <!-- Floating Upward Growth Sparkles / Dynamic Accents representing "Increasing Consumption" -->
  <g transform="translate(140, 75)">
    <circle cx="0" cy="0" r="3" fill="#fbbf24" />
    <path d="M0,-8 L0,8 M-8,0 L8,0" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>
  <g transform="translate(170, 110) scale(0.7)">
    <circle cx="0" cy="0" r="3" fill="#10b981" />
    <path d="M0,-8 L0,8 M-8,0 L8,0" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Credit Card Floating / Being Used (Symbolizing Spending Power) -->
  <g transform="translate(115, 140) rotate(-15)">
    <rect width="28" height="18" rx="3" fill="#f59e0b" filter="url(#dropShadow)" />
    <rect x="3" y="3" width="22" height="3" fill="#1e293b" opacity="0.8" />
    <rect x="3" y="9" width="8" height="5" rx="1" fill="#fef3c7" />
  </g>
</svg>