<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Window Glow / Moonlight Gradient -->
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Tea Liquid Gradient -->
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Character Robe Gradient -->
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Architectural Elements: Round Window (Moon Window) symbolizing peace -->
  <circle cx="120" cy="115" r="75" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <circle cx="120" cy="115" r="71" fill="url(#moonGlow)"/>

  <!-- Outside Scenery (Minimalist calm night bamboo & moon) -->
  <g clip-path="url(#windowClip)">
    <!-- Soft Moon -->
    <circle cx="150" cy="85" r="16" fill="#fef08a" opacity="0.8" filter="url(#glow)"/>
    <!-- Bamboo silhouettes -->
    <path d="M90 190 L90 70 M93 190 L93 70" stroke="#064e3b" stroke-width="3" opacity="0.6"/>
    <path d="M100 190 L105 60 M103 190 L108 60" stroke="#064e3b" stroke-width="2.5" opacity="0.6"/>
    <!-- Bamboo leaves -->
    <path d="M90 90 Q80 85 85 95 Q90 95 90 90" fill="#064e3b" opacity="0.6"/>
    <path d="M105 100 Q115 95 110 105 Q105 105 105 100" fill="#064e3b" opacity="0.6"/>
  </g>

  <!-- Interior Wall & Surface (Desk) -->
  <!-- Wooden Shelf / Desk Surface -->
  <path d="M30 185 L210 185 L220 210 L20 210 Z" fill="#334155"/>
  <rect x="20" y="180" width="200" height="8" rx="2" fill="#475569" filter="url(#softShadow)"/>

  <!-- Indoor Environment Props -->
  <!-- Left Side: Potted Plant (Peaceful greenery) -->
  <g transform="translate(45, 145)">
    <!-- Pot -->
    <path d="M5 25 L15 38 C15 38 20 40 25 38 L35 25 Z" fill="#cbd5e1"/>
    <ellipse cx="20" cy="25" rx="15" ry="3" fill="#94a3b8"/>
    <!-- Stems & Leaves -->
    <path d="M20 22 Q10 10 5 0" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M20 22 Q25 5 32 -2" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M20 22 Q20 2 20 -8" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Leaf shapes -->
    <path d="M5 0 Q-2 -5 2 -12 C10 -5 5 0 5 0" fill="url(#leafGrad)"/>
    <path d="M32 -2 Q40 -5 36 -14 C28 -10 32 -2 32 -2" fill="url(#leafGrad)"/>
    <path d="M20 -8 Q20 -18 26 -20 C28 -10 20 -8 20 -8" fill="url(#leafGrad)"/>
  </g>

  <!-- Right Side: Incense Burner / Warm Ambient Light with Calm Steam -->
  <g transform="translate(180, 155)">
    <!-- Small ceramic cup/burner -->
    <path d="M5 15 C5 25 25 25 25 15 Z" fill="#cbd5e1"/>
    <ellipse cx="15" cy="15" rx="10" ry="2" fill="#94a3b8"/>
    <!-- Gentle wavy steam lines representing calm atmosphere -->
    <path d="M15 12 Q10 5 15 -2 Q20 -9 15 -16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Central Character: Person meditating / sitting calmly -->
  <g transform="translate(100, 110)" filter="url(#softShadow)">
    <!-- Body / Shoulders in crossed-leg posture -->
    <!-- Crossed legs base -->
    <ellipse cx="20" cy="68" rx="28" ry="10" fill="#0284c7"/>
    
    <!-- Torso (Robe) -->
    <path d="M0 45 Q-12 25 0 10 C10 3 30 3 40 10 Q52 25 40 45 Z" fill="url(#robeGrad)"/>

    <!-- Collar detail -->
    <path d="M15 10 L20 22 L25 10" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>

    <!-- Head and Face (Serene expression, closed eyes) -->
    <circle cx="20" cy="-6" r="14" fill="#fed7aa"/>

    <!-- Hair -->
    <path d="M6 -10 Q20 -22 34 -10 C34 -16 6 -16 6 -10" fill="#334155"/>
    <circle cx="20" cy="-22" r="5" fill="#334155"/>

    <!-- Peaceful Closed Eyes (Arcs curving upward) -->
    <path d="M13 -6 Q15 -3 17 -6" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M23 -6 Q25 -3 27 -6" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Gentle Calm Smile -->
    <path d="M18 1 Q20 3 22 1" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="11" cy="-2" r="2.5" fill="#fca5a5" opacity="0.6"/>
    <circle cx="29" cy="-2" r="2.5" fill="#fca5a5" opacity="0.6"/>

    <!-- Folded Hands in lap -->
    <ellipse cx="20" cy="36" rx="10" ry="5" fill="#fed7aa"/>
  </g>

  <!-- Foreground Foreground Elements (Teacup on desk for cozy context) -->
  <g transform="translate(75, 170)">
    <!-- Teacup Saucer -->
    <ellipse cx="12" cy="12" rx="10" ry="4" fill="#cbd5e1"/>
    <!-- Teacup Body -->
    <path d="M5 2 L19 2 C19 10 5 10 5 2 Z" fill="#f8fafc"/>
    <!-- Tea Liquid -->
    <ellipse cx="12" cy="3" rx="6" ry="1.5" fill="url(#teaGrad)"/>
    <!-- Tiny steam curl -->
    <path d="M12 0 Q10 -4 12 -8" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Ambient glowing fireflies / peaceful floating particles -->
  <circle cx="60" cy="110" r="2" fill="#fde047" opacity="0.8" filter="url(#glow)"/>
  <circle cx="170" cy="95" r="1.5" fill="#fde047" opacity="0.6" filter="url(#glow)"/>
  <circle cx="150" cy="140" r="2.5" fill="#fde047" opacity="0.7" filter="url(#glow)"/>
  <circle cx="85" cy="80" r="1.5" fill="#fde047" opacity="0.9" filter="url(#glow)"/>

  <!-- Decorative Frame / Border Accent (Subtle rounded inner glow) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15"/>
</svg>