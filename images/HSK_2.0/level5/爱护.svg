<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 190 C 80 170, 160 170, 240 190 L 240 240 L 0 240 Z" fill="#1e293b" opacity="0.5"/>
  <ellipse cx="120" cy="210" rx="100" ry="20" fill="#0f172a" opacity="0.3"/>

  <!-- Tree -->
  <path d="M180 190 L 180 120 C 180 100, 200 100, 200 120 L 200 190" fill="#fb923c"/>
  <circle cx="190" cy="100" r="35" fill="#10b981"/>
  <circle cx="170" cy="110" r="25" fill="#059669"/>
  <circle cx="210" cy="110" r="25" fill="#059669"/>

  <!-- Character -->
  <g transform="translate(60, 100)">
    <!-- Body -->
    <path d="M40 90 L 60 90 L 55 50 L 45 50 Z" fill="#38bdf8"/>
    <!-- Arms hugging tree -->
    <path d="M45 60 C 20 60, 20 100, 60 100" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="50" cy="40" r="20" fill="#f59e0b"/>
    <!-- Eyes -->
    <circle cx="43" cy="35" r="2" fill="#0f172a"/>
    <circle cx="57" cy="35" r="2" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M45 45 Q 50 48, 55 45" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>

  <!-- Nature details -->
  <circle cx="30" cy="200" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="210" r="4" fill="#ec4899"/>
  <path d="M150 180 L 155 170 L 160 180" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M140 185 L 145 175 L 150 185" stroke="#10b981" stroke-width="2" fill="none"/>
  
  <!-- Lighting glow -->
  <circle cx="190" cy="100" r="50" fill="#fbbf24" opacity="0.05"/>
</svg>