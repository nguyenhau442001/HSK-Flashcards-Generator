<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Tones & Clothes Gradients -->
    <linearGradient id="doctorCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="patientShirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="deskWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Interior Wall & Window Background Details -->
  <g fill="none" stroke="#334155" stroke-width="1.5">
    <!-- Window Frame in Background -->
    <rect x="130" y="25" width="80" height="70" rx="4" fill="#1e293b" opacity="0.6"/>
    <path d="M170 25 v70 M130 60 h80" opacity="0.5"/>
    <!-- Medical Cabinet/Shelves -->
    <rect x="25" y="30" width="60" height="50" rx="2" fill="#1e293b" opacity="0.4"/>
    <path d="M25 55 h60" opacity="0.4"/>
  </g>
  <!-- Window City/Night Glow -->
  <circle cx="160" cy="50" r="15" fill="#38bdf8" opacity="0.1"/>

  <!-- Ambient Light from Desk Lamp -->
  <circle cx="120" cy="110" r="80" fill="url(#lampGlow)"/>

  <!-- Back Wall / Floor divider -->
  <path d="M0 160 h240" stroke="#334155" stroke-width="2"/>

  <!-- Hospital Consultation Desk -->
  <!-- Desk Body -->
  <path d="M30 150 h180 l10 65 h-200 z" fill="url(#deskWood)" filter="url(#shadow)"/>
  <!-- Desk Top Surface -->
  <path d="M20 150 h200 l-10 -12 h-180 z" fill="#cbd5e1"/>

  <!-- Props on Desk -->
  <!-- Laptop / Medical Monitor -->
  <rect x="145" y="118" width="40" height="22" rx="2" fill="#475569"/>
  <rect x="148" y="121" width="34" height="15" rx="1" fill="#0ea5e9" opacity="0.8"/>
  <path d="M140 140 h50" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Medical Chart / Clipboard -->
  <rect x="90" y="130" width="22" height="28" rx="2" fill="#f1f5f9" transform="rotate(-10 90 130)"/>
  <path d="M95 135 h12 M95 141 h10 M95 147 h8" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" transform="rotate(-10 90 130)"/>

  <!-- Desk Lamp -->
  <path d="M60 150 v-25 l15 -10" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="75" cy="115" r="8" fill="#fbbf24"/>

  <!-- CHARACTER 1: DOCTOR (Right Side) -->
  <g transform="translate(150, 75)">
    <!-- Body & Doctor Coat -->
    <path d="M15 45 c-5 10 -15 15 -25 15 h-15 c-10 0 -20 -5 -25 -15 l-5 35 h60 z" fill="url(#doctorCoat)"/>
    <path d="M-10 45 l15 35 h20 l-15 -35" fill="#38bdf8" opacity="0.2"/> <!-- Scrub shirt inner -->
    <!-- Head & Hair -->
    <circle cx="-5" cy="20" r="14" fill="#fcd34d"/> <!-- Skin -->
    <path d="M-18 16 c0-10 10-14 20-12 c8 2 10 10 8 16 c-3 2 -15 2 -28 -4 z" fill="#334155"/> <!-- Hair -->
    <!-- Stethoscope -->
    <path d="M-15 25 c-5 5 -5 15 0 22" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="-15" cy="47" r="3" fill="#94a3b8"/>
    <!-- Smiling Face -->
    <circle cx="-1" cy="18" r="1.5" fill="#334155"/>
    <circle cx="-9" cy="18" r="1.5" fill="#334155"/>
    <path d="M-7 24 q3 3 6 0" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 2: PATIENT / PERSON SEEKING ADVICE (Left Side) -->
  <g transform="translate(60, 70)">
    <!-- Body & Shirt -->
    <path d="M-20 50 c-5 10 -10 20 -15 35 h65 l-10 -35 c-10 -5 -25 -5 -40 0 z" fill="url(#patientShirt)" filter="url(#shadow)"/>
    <!-- Head & Hair -->
    <circle cx="5" cy="22" r="15" fill="#ffedd5"/> <!-- Skin -->
    <path d="M-8 12 c2-8 15-8 20 0 c4 6 2 16 -5 16 c-8 0 -15 -4 -15 -16 z" fill="#1e293b"/> <!-- Hair -->
    <!-- Expressive Face (Engaged, listening intently) -->
    <circle cx="10" cy="20" r="1.5" fill="#1e293b"/>
    <circle cx="2" cy="20" r="1.5" fill="#1e293b"/>
    <path d="M4 27 q3 2 6 -1" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Arm gesturing thoughtfully towards the doctor -->
    <path d="M-10 50 c10 5 20 -5 30 -15" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="20" cy="35" r="5" fill="#ffedd5"/>
  </g>

  <!-- Foreground Plant / Element for Depth -->
  <g transform="translate(10, 160)">
    <path d="M10 50 c-5 -20 10 -40 20 -50 c-10 20 5 40 10 50 z" fill="#10b981"/>
    <path d="M0 50 c10 -30 30 -40 45 -45 c-15 15 -25 30 -35 45 z" fill="#059669"/>
    <path d="M15 50 c10 -15 25 -20 35 -25 c-10 10 -20 18 -25 25 z" fill="#34d399"/>
    <!-- Pot -->
    <path d="M5 50 h30 l-5 25 h-20 z" fill="#64748b"/>
  </g>

  <!-- Accent Speech / Thought Bubble (Subtle, professional connection concept without text) -->
  <g transform="translate(100, 45)" opacity="0.9">
    <path d="M0 15 c0 -10 10 -15 25 -15 h20 c15 0 25 5 25 15 c0 8 -10 15 -25 15 h-8 l-10 8 l2 -8 h-9 c-15 0 -25 -7 -25 -15 z" fill="#ffffff" filter="url(#shadow)"/>
    <!-- Abstract medical cross or consultation symbol inside bubble -->
    <path d="M30 10 v10 M25 15 h10" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>