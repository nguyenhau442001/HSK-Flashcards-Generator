<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow for Action/Mission Table -->
    <radialGradient id="table-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Hologram / Blueprint Effect -->
    <linearGradient id="hologram-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment (Strategic Planning Room) -->
  <g id="environment">
    <!-- Window with city night lights -->
    <path d="M 160 30 L 210 35 L 210 110 L 160 100 Z" fill="#1e293b" opacity="0.6"/>
    <rect x="165" y="40" width="18" height="25" rx="2" fill="#334155" opacity="0.4"/>
    <rect x="187" y="45" width="18" height="30" rx="2" fill="#334155" opacity="0.4"/>
    <circle cx="170" cy="80" r="1.5" fill="#fbbf24"/>
    <circle cx="195" cy="85" r="1.5" fill="#38bdf8"/>

    <!-- Ambient Wall Shelves & Props -->
    <path d="M 30 60 L 80 50" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <rect x="40" y="42" width="8" height="18" rx="1" fill="#ec4899"/>
    <rect x="50" y="38" width="10" height="22" rx="1" fill="#38bdf8"/>

    <!-- Corkboard / Pinboard with sticky notes -->
    <rect x="25" y="80" width="45" height="35" rx="3" fill="#334155" opacity="0.5"/>
    <rect x="30" y="86" width="12" height="10" rx="1" fill="#fbbf24" transform="rotate(-5 36 91)"/>
    <rect x="47" y="90" width="14" height="12" rx="1" fill="#10b981" transform="rotate(8 54 96)"/>
    
    <!-- Floor and Room Shadow -->
    <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#0b0f19"/>
    <ellipse cx="120" cy="195" rx="100" ry="25" fill="url(#table-glow)"/>
  </g>

  <!-- Central Command Table / Desk -->
  <g id="desk" filter="url(#shadow)">
    <!-- Table Legs -->
    <path d="M 65 190 L 50 220" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M 175 190 L 190 220" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Table Top -->
    <path d="M 40 170 L 200 170 L 210 190 L 30 190 Z" fill="#475569"/>
    <path d="M 30 190 L 210 190 L 210 194 L 30 194 Z" fill="#334155"/>
  </g>

  <!-- Holographic Mission Map / Action Plan on Desk -->
  <g id="hologram-display">
    <ellipse cx="120" cy="175" rx="45" ry="12" fill="url(#hologram-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- Holographic Target / Arrow elements -->
    <circle cx="120" cy="170" r="18" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <circle cx="120" cy="170" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="120" cy="170" r="2.5" fill="#f59e0b"/>
    <!-- Connecting Action Lines -->
    <path d="M 95 180 L 110 172" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 145 180 L 130 172" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Characters (Team committing to Action) -->
  <!-- Character 1: Leader pointing firmly forward/down at the plan -->
  <g id="leader" filter="url(#shadow)">
    <!-- Legs -->
    <path d="M 95 185 L 90 225" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <path d="M 110 185 L 115 225" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="87" cy="227" rx="6" ry="3" fill="#0f172a"/>
    <ellipse cx="118" cy="227" rx="6" ry="3" fill="#0f172a"/>

    <!-- Torso (Action pose: leaning forward) -->
    <path d="M 85 135 L 120 130 L 115 185 L 90 185 Z" fill="#3b82f6" rx="4"/>
    <!-- Collar / Tie accent -->
    <polygon points="100,132 105,145 95,145" fill="#f8fafc"/>

    <!-- Head & Hair -->
    <circle cx="102" cy="115" r="15" fill="#fde047"/>
    <!-- Determined Face Profile -->
    <path d="M 108 112 Q 112 115 108 118" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 96 110 Q 100 107 104 110" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Hair style -->
    <path d="M 88 115 C 88 100 110 100 116 112 C 112 107 95 105 88 115 Z" fill="#1e293b"/>

    <!-- Back Arm -->
    <path d="M 90 140 L 75 160 L 85 165" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Arm (Reaching out/pointing to take action) -->
    <path d="M 115 135 L 135 150 L 148 145" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand pointing -->
    <circle cx="151" cy="143" r="4" fill="#fde047"/>
  </g>

  <!-- Character 2: Teammate firmly nodding / fists ready -->
  <g id="teammate" filter="url(#shadow)">
    <!-- Legs -->
    <path d="M 140 185 L 135 225" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 158 185 L 163 225" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="132" cy="227" rx="6" ry="3" fill="#1e293b"/>
    <ellipse cx="166" cy="227" rx="6" ry="3" fill="#1e293b"/>

    <!-- Torso -->
    <path d="M 130 140 L 165 140 L 160 185 L 135 185 Z" fill="#10b981"/>

    <!-- Head -->
    <circle cx="148" cy="120" r="14" fill="#fde047"/>
    <!-- Hair -->
    <path d="M 136 120 C 136 108 160 108 162 118 C 158 112 140 112 136 120 Z" fill="#0f172a"/>

    <!-- Confident Expression -->
    <path d="M 152 118 Q 155 122 158 118" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Arms folded or fists clenched in determination -->
    <path d="M 135 145 L 142 165 L 155 160" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="155" cy="160" r="4" fill="#fde047"/>
  </g>

  <!-- Foreground Props & Dynamic Impact Elements (Signaling "Action!") -->
  <g id="action-elements">
    <!-- Glowing Accent Spark / Energy Star symbolizing breakthrough or immediate execution -->
    <path d="M 120 95 L 123 105 L 133 108 L 123 111 L 120 121 L 117 111 L 107 108 L 117 105 Z" fill="#fbbf24" filter="url(#shadow)"/>
    <path d="M 180 110 L 181.5 115 L 186.5 116.5 L 181.5 118 L 180 123 L 178.5 118 L 173.5 116.5 L 178.5 115 Z" fill="#38bdf8"/>
    <path d="M 60 130 L 61 134 L 65 135 L 61 136 L 60 140 L 59 136 L 55 135 L 59 134 Z" fill="#fb923c"/>

    <!-- Coffee Mug on Desk (Real-world office context) -->
    <rect x="65" y="158" width="12" height="15" rx="2" fill="#f8fafc"/>
    <path d="M 77 162 C 82 162 82 170 77 170" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam indicating active work -->
    <path d="M 69 152 C 67 148 73 146 71 142" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

</svg>