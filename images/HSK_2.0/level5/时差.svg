<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Night-Mode Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="windowGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="windowGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- WALL & ROOM DECOR -->
  <path d="M0 160 H240 V240 H0 Z" fill="#0f172a" opacity="0.5"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2"/>

  <!-- SPLIT WORLD SCENE (Representing Time Difference / 时差 between two countries) -->

  <!-- LEFT SIDE: Country A (Daytime / Sunny / Working) -->
  <g id="country-a">
    <!-- Window Frame A -->
    <rect x="25" y="30" width="85" height="115" rx="4" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="28" y="33" width="79" height="109" rx="2" fill="url(#windowGradA)"/>
    <!-- Sun outside window A -->
    <circle cx="50" cy="55" r="10" fill="#fef08a" opacity="0.9"/>
    <!-- Cloud outside window A -->
    <path d="M75 70 Q80 65 88 70 Q95 68 97 75 H73 Q71 72 75 70 Z" fill="#f8fafc" opacity="0.7"/>
    <!-- Window pane dividers -->
    <line x1="67" y1="33" x2="67" y2="142" stroke="#334155" stroke-width="2"/>
    <line x1="28" y1="87.5" x2="107" y2="87.5" stroke="#334155" stroke-width="2"/>

    <!-- Desk & Laptop A -->
    <rect x="20" y="155" width="95" height="10" rx="2" fill="#475569"/>
    <path d="M45 155 L50 125 H85 L90 155 Z" fill="#334155"/>
    <!-- Laptop screen showing day/sun -->
    <rect x="52" y="128" width="32" height="22" rx="2" fill="#38bdf8"/>
    <circle cx="68" cy="139" r="5" fill="#fef08a"/>
    <!-- Character A (Waving cheerfully in daytime) -->
    <circle cx="70" cy="112" r="12" fill="#cbd5e1"/>
    <path d="M58 127 C58 120 82 120 82 127 Z" fill="#ec4899"/>
    <!-- Arm waving -->
    <path d="M80 115 Q95 105 92 98" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- RIGHT SIDE: Country B (Nighttime / Starry / Sleeping or Late) -->
  <g id="country-b">
    <!-- Window Frame B -->
    <rect x="130" y="30" width="85" height="115" rx="4" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="133" y="33" width="79" height="109" rx="2" fill="url(#windowGradB)"/>
    <!-- Moon and Stars outside window B -->
    <circle cx="155" cy="55" r="9" fill="#fde047"/>
    <!-- Crescent cutout effect -->
    <circle cx="158" cy="52" r="7" fill="url(#windowGradB)"/>
    <circle cx="185" cy="45" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="195" cy="75" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="170" cy="80" r="1.5" fill="#ffffff" opacity="0.7"/>
    <!-- Window pane dividers -->
    <line x1="172" y1="33" x2="172" y2="142" stroke="#334155" stroke-width="2"/>
    <line x1="133" y1="87.5" x2="212" y2="87.5" stroke="#334155" stroke-width="2"/>

    <!-- Desk & Bedside Lamp B -->
    <rect x="125" y="155" width="95" height="10" rx="2" fill="#475569"/>
    <!-- Bedside Lamp emitting warm glow -->
    <path d="M165 155 L168 135 H182 L185 155 Z" fill="#b45309"/>
    <path d="M162 135 Q175 120 188 135 Z" fill="#fbbf24"/>
    <path d="M155 125 Q175 105 195 125" fill="#fbbf24" opacity="0.2"/>

    <!-- Character B (Sleepy, holding mug or resting head) -->
    <circle cx="175" cy="112" r="12" fill="#94a3b8"/>
    <path d="M163 127 C163 120 187 120 187 127 Z" fill="#3b82f6"/>
    <!-- Sleep Zzz or tired expression -->
    <path d="M190 100 Q195 95 190 90 Q195 85 190 80" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- CENTRAL DIVIDER & TIME ZONE METAPHOR (Connecting Line / Bridge) -->
  <g id="time-difference-connection">
    <!-- Glowing separation beam or clock arc showing shift -->
    <path d="M 120 30 C 130 90 110 150 120 210" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.8"/>
    
    <!-- Floating Dual Clock Icons in the center bridging the two countries -->
    <circle cx="120" cy="85" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="120" cy="85" r="2" fill="#f59e0b"/>
    <!-- Clock hands pointing to different times -->
    <line x1="120" y1="85" x2="128" y2="80" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="85" x2="120" y2="75" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Sun/Moon transition indicator badge -->
    <circle cx="120" cy="135" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M115 135 A 5 5 0 0 1 125 135 A 6 6 0 0 0 115 135 Z" fill="#38bdf8"/>
  </g>

  <!-- FOREGROUND PROPS (Enhancing Real-World Context) -->
  <!-- Coffee mug on left desk -->
  <rect x="95" y="145" width="8" height="10" rx="2" fill="#e2e8f0"/>
  <path d="M103 147 C107 147 107 153 103 153" stroke="#e2e8f0" stroke-width="2" fill="none"/>

  <!-- Small succulent plant on right desk -->
  <path d="M135 155 L138 145 H148 L151 155 Z" fill="#cbd5e1"/>
  <circle cx="143" cy="143" r="5" fill="#10b981"/>
  <circle cx="140" cy="141" r="3" fill="#34d399"/>
  <circle cx="146" cy="141" r="3" fill="#059669"/>
</svg>