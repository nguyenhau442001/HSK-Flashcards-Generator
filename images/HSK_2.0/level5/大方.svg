<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Character: The Generous Person -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 100 C-40 60, -20 40, 0 40 C20 40, 40 60, 40 100" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="25" fill="#fde68a"/>
    <!-- Arm reaching out -->
    <path d="M25 60 L60 40" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand holding a gift -->
    <rect x="60" y="25" width="30" height="30" rx="4" fill="#fb923c"/>
    <path d="M75 25 L75 55" stroke="#ec4899" stroke-width="4"/>
    <path d="M60 40 L90 40" stroke="#ec4899" stroke-width="4"/>
  </g>

  <!-- Recipient Character -->
  <g transform="translate(180, 140)">
    <circle cx="0" cy="0" r="15" fill="#a78bfa"/>
    <path d="M-15 15 L15 15 L10 60 L-10 60 Z" fill="#a78bfa"/>
  </g>

  <!-- Atmospheric Details: Golden coins/stars -->
  <circle cx="100" cy="80" r="6" fill="#fbbf24"/>
  <circle cx="140" cy="90" r="4" fill="#fbbf24"/>
  <circle cx="120" cy="60" r="5" fill="#fbbf24"/>
  
  <!-- Table detail -->
  <rect x="0" y="180" width="240" height="10" fill="#475569"/>
</svg>