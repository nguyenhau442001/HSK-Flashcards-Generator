<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm bedside light gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window city light gradient -->
    <linearGradient id="cityGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT: Bedroom Interior -->
  <!-- Wallpaper/Wall -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#334155" opacity="0.4" />
  
  <!-- Window showing noisy outside (city/horns/waves) -->
  <g transform="translate(140, 35)">
    <rect width="70" height="85" rx="4" fill="#090d16" stroke="#475569" stroke-width="3" />
    <rect width="70" height="85" rx="4" fill="url(#cityGlow)" />
    <!-- City silhouette -->
    <path d="M5 85 L5 60 L12 60 L12 50 L18 50 L18 85 Z M25 85 L25 40 L35 40 L35 85 Z M42 85 L42 55 L52 55 L52 85 Z M58 85 L58 45 L65 45 L65 85 Z" fill="#1e293b" />
    <!-- Window pane grid -->
    <line x1="35" y1="0" x2="35" y2="85" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="42" x2="70" y2="42" stroke="#475569" stroke-width="2" />
  </g>

  <!-- NOISE / SOUND WAVES (representing 吵 - noisy/disturbance) -->
  <g transform="translate(125, 60)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sound wave 1 -->
    <path d="M 0 15 Q 8 5, 15 15 T 30 15" fill="none" stroke="#fb923c" stroke-width="3" opacity="0.9" />
    <!-- Sound wave 2 (larger) -->
    <path d="M -5 25 Q 7 10, 18 25 T 40 25" fill="none" stroke="#f43f5e" stroke-width="3.5" opacity="0.9" />
    <!-- Sound wave 3 (outer) -->
    <path d="M -12 35 Q 8 15, 25 35 T 50 35" fill="none" stroke="#fb923c" stroke-width="2.5" opacity="0.6" />
    
    <!-- Exclamation / Disturbance sparks -->
    <path d="M 12 -5 L 16 -12" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
    <path d="M 28 5 L 35 2" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Nightstand with lamp -->
  <!-- Nightstand body -->
  <rect x="25" y="90" width="45" height="75" rx="4" fill="#475569" />
  <rect x="30" y="105" width="35" height="22" rx="2" fill="#334155" />
  <circle cx="47" cy="116" r="3" fill="#94a3b8" />
  
  <!-- Bedside Lamp -->
  <path d="M 40 90 L 52 90 L 48 70 L 44 70 Z" fill="#94a3b8" />
  <path d="M 32 70 L 60 70 L 53 45 L 39 45 Z" fill="#fbbf24" />

  <!-- BED & SLEEPING CHARACTER -->
  <!-- Bed frame / Mattress -->
  <rect x="35" y="130" width="180" height="75" rx="12" fill="#cbd5e1" />
  <!-- Blanket (Blue/Teal cozy bedding) -->
  <path d="M 55 145 C 55 145, 120 135, 215 145 L 215 195 C 215 203, 208 210, 200 210 L 65 210 C 57 210, 55 203, 55 195 Z" fill="#0ea5e9" />
  <!-- Blanket fold accent -->
  <path d="M 55 155 C 90 150, 160 150, 215 155" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Pillow -->
  <rect x="65" y="125" width="55" height="30" rx="8" fill="#f8fafc" />
  <rect x="65" y="125" width="55" height="30" rx="8" fill="#e2e8f0" opacity="0.5" />

  <!-- Character Head (Frustrated/Awake in bed) -->
  <g transform="translate(75, 122)">
    <!-- Face base -->
    <circle cx="20" cy="15" r="16" fill="#ffedd5" />
    
    <!-- Hair -->
    <path d="M 4 15 C 4 4, 12 2, 20 2 C 28 2, 36 4, 36 15 C 36 18, 32 16, 28 12 C 24 8, 16 8, 12 12 C 8 16, 4 18, 4 15 Z" fill="#334155" />

    <!-- Closed / Frustrated Eyes (Diagonal lines showing stress) -->
    <path d="M 11 14 L 17 17" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 23 17 L 29 14" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Frowned Eyebrows -->
    <path d="M 10 11 L 16 13" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 24 13 L 30 11" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Open mouth (frustrated sigh/groan) -->
    <ellipse cx="20" cy="22" rx="3.5" ry="4.5" fill="#1e293b" />

    <!-- Hands clutching pillows over ears -->
    <circle cx="2" cy="18" r="6" fill="#ffedd5" />
    <circle cx="38" cy="18" r="6" fill="#ffedd5" />
  </g>

  <!-- Extra decorative ambient glow dots -->
  <circle cx="110" cy="35" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="25" cy="55" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="195" cy="115" r="2" fill="#f43f5e" opacity="0.5" />
</svg>