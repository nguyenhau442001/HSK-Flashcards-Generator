<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wooden Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332115"/>
      <stop offset="100%" stop-color="#1c120a"/>
    </linearGradient>

    <!-- Warm Atmospheric Glow -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Tangerine Peel (Base) Gradient -->
    <linearGradient id="tangerine-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Tangerine Segment Gradient -->
    <linearGradient id="segment-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Ceramic Plate Gradient -->
    <linearGradient id="plate-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Light Cone -->
  <rect width="240" height="240" fill="url(#lamp-glow)"/>

  <!-- Background Kitchen Wall Details / Shelf Line -->
  <path d="M 0 130 L 240 130" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  
  <!-- Wooden Table Surface -->
  <path d="M 0 160 Q 120 152 240 160 L 240 240 L 0 240 Z" fill="url(#table-grad)" />
  <path d="M 0 160 Q 120 152 240 160" stroke="#78350f" stroke-width="2" fill="none"/>

  <!-- Table Ambient Shadow for Plate -->
  <ellipse cx="120" cy="180" rx="70" ry="18" fill="#000000" opacity="0.55"/>

  <!-- Ceramic Plate -->
  <g filter="url(#drop-shadow)">
    <!-- Outer Rim -->
    <ellipse cx="120" cy="175" rx="80" ry="26" fill="url(#plate-grad)"/>
    <!-- Inner Bowl -->
    <ellipse cx="120" cy="172" rx="66" ry="20" fill="#e2e8f0"/>
    <ellipse cx="120" cy="174" rx="62" ry="17" fill="#f1f5f9"/>
  </g>

  <!-- MAIN SUBJECT: 桔子 (Tangerines/Quýt) -->
  <g id="tangerines-scene">

    <!-- Back Whole Tangerine (Unpeeled) -->
    <g transform="translate(148, 150)" filter="url(#soft-shadow)">
      <circle cx="0" cy="0" r="26" fill="url(#tangerine-base)"/>
      <!-- Subtle texture dots -->
      <circle cx="-8" cy="-5" r="1.5" fill="#c2410c" opacity="0.4"/>
      <circle cx="10" cy="8" r="1.5" fill="#c2410c" opacity="0.4"/>
      <circle cx="4" cy="-10" r="1" fill="#c2410c" opacity="0.4"/>
      <!-- Top Stem & Leaf -->
      <path d="M 0 -26 Q 2 -32 6 -34 Q 0 -31 -2 -26 Z" fill="#15803d"/>
      <path d="M 2 -30 Q 10 -36 15 -32 Q 10 -26 2 -30 Z" fill="#22c55e"/>
      <path d="M 2 -30 Q 8 -34 15 -32" stroke="#15803d" stroke-width="0.75" fill="none"/>
      <!-- Highlight -->
      <path d="M -12 -12 Q -5 -20 2 -18" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>

    <!-- Main Front Tangerine (Peeling / Open) -->
    <g transform="translate(92, 160)" filter="url(#drop-shadow)">
      
      <!-- Hanging Peel Flaps (Back layers) -->
      <path d="M -22 0 Q -38 10 -30 22 Q -22 28 -12 24" fill="#ea580c" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 18 10 Q 35 18 28 30 Q 20 36 10 30" fill="#ea580c" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M -5 18 Q 5 35 18 28 Q 24 22 15 15" fill="#ea580c" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- Inner Segments Cluster (Quả quýt bóc vỏ) -->
      <g>
        <!-- Center core/pith -->
        <circle cx="0" cy="0" r="8" fill="#fef08a"/>

        <!-- Segment 1 (Top) -->
        <path d="M -1 -7 Q -12 -24 0 -28 Q 12 -24 1 -7 Z" fill="url(#segment-grad)" stroke="#ca8a04" stroke-width="1"/>
        <path d="M 0 -12 Q 0 -22 0 -26" stroke="#fef08a" stroke-width="0.75" stroke-dasharray="1 2" opacity="0.6" fill="none"/>

        <!-- Segment 2 (Top Right) -->
        <path d="M 5 -4 Q 20 -15 26 -5 Q 22 8 8 2 Z" fill="url(#segment-grad)" stroke="#ca8a04" stroke-width="1"/>
        <path d="M 8 -2 Q 18 -10 22 -4" stroke="#fef08a" stroke-width="0.75" stroke-dasharray="1 2" opacity="0.6" fill="none"/>

        <!-- Segment 3 (Bottom Right) -->
        <path d="M 6 4 Q 22 12 18 24 Q 6 24 2 8 Z" fill="url(#segment-grad)" stroke="#ca8a04" stroke-width="1"/>
        
        <!-- Segment 4 (Bottom) -->
        <path d="M 2 8 Q 8 26 -2 28 Q -12 26 -4 8 Z" fill="url(#segment-grad)" stroke="#ca8a04" stroke-width="1"/>

        <!-- Segment 5 (Bottom Left) -->
        <path d="M -4 6 Q -20 18 -16 26 Q -22 12 -6 2 Z" fill="url(#segment-grad)" stroke="#ca8a04" stroke-width="1"/>

        <!-- Segment 6 (Top Left) -->
        <path d="M -6 -2 Q -22 -8 -18 -20 Q -8 -18 -2 -4 Z" fill="url(#segment-grad)" stroke="#ca8a04" stroke-width="1"/>

        <!-- Juicy Glisten Highlights -->
        <circle cx="-5" cy="-12" r="1.5" fill="#ffffff" opacity="0.7"/>
        <circle cx="10" cy="-6" r="1.5" fill="#ffffff" opacity="0.7"/>
        <circle cx="8" cy="12" r="1.5" fill="#ffffff" opacity="0.7"/>
        <circle cx="-10" cy="12" r="1.5" fill="#ffffff" opacity="0.7"/>
      </g>

      <!-- Front Main Peel Flaps (Creating depth) -->
      <path d="M -26 -12 Q -42 -2 -35 15 Q -28 22 -18 12 Q -24 0 -26 -12 Z" fill="url(#tangerine-base)" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Inner white pith of peel -->
      <path d="M -26 -12 Q -38 -5 -32 12 C -28 16 -24 10 -20 6 C -23 -2 -25 -8 -26 -12 Z" fill="#f8fafc" opacity="0.85"/>

      <path d="M 18 -16 Q 38 -5 32 15 Q 26 22 16 14 Q 22 2 18 -16 Z" fill="url(#tangerine-base)" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 18 -16 Q 32 -6 28 12 C 24 16 20 10 16 6 C 18 -2 18 -10 18 -16 Z" fill="#f8fafc" opacity="0.85"/>

      <!-- Stem and Leaf on Peeling Base -->
      <path d="M -2 -28 Q 0 -36 5 -40 Q 2 -32 -2 -28 Z" fill="#15803d"/>
      <path d="M 0 -34 Q 8 -42 16 -38 Q 10 -30 2 -34 Z" fill="#22c55e"/>
      <path d="M 2 -34 Q 9 -39 16 -38" stroke="#15803d" stroke-width="0.75" fill="none"/>
    </g>

  </g>

  <!-- Foreground Atmospheric Elements & UI Accents -->
  <!-- Ambient Sparkles / Energy Dots -->
  <circle cx="45" cy="100" r="2" fill="#fde047" opacity="0.8"/>
  <circle cx="195" cy="115" r="1.5" fill="#fde047" opacity="0.6"/>
  <circle cx="180" cy="80" r="2.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="60" cy="70" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="120" cy="95" r="1" fill="#ffffff" opacity="0.9"/>

  <!-- Soft vignette border / frame wrapper -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.5"/>
</svg>