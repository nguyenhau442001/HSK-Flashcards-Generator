<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="blueprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Walls & Windows -->
  <!-- Ambient Wall Lighting -->
  <circle cx="120" cy="110" r="90" fill="url(#lampGlow)" />

  <!-- Window Frame showing night city skyline (business planning at night) -->
  <g transform="translate(145, 25)">
    <rect x="0" y="0" width="70" height="85" rx="6" fill="#090d16" stroke="#334155" stroke-width="2" />
    <!-- City Buildings Silhouette & Lights -->
    <rect x="8" y="30" width="12" height="55" fill="#1e293b" />
    <rect x="11" y="38" width="2" height="3" fill="#fbbf24" />
    <rect x="11" y="46" width="2" height="3" fill="#fbbf24" />
    
    <rect x="23" y="15" width="18" height="70" fill="#1e293b" />
    <rect x="27" y="22" width="3" height="4" fill="#fbbf24" />
    <rect x="33" y="35" width="3" height="4" fill="#38bdf8" />
    <rect x="27" y="50" width="3" height="4" fill="#fbbf24" />
    
    <rect x="44" y="25" width="16" height="60" fill="#1e293b" />
    <rect x="48" y="32" width="2" height="3" fill="#38bdf8" />
    <rect x="52" y="45" width="2" height="3" fill="#fbbf24" />
    
    <!-- Window Crossbars -->
    <line x1="35" y1="0" x2="35" y2="85" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="42" x2="70" y2="42" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Bookshelf / Office Plant background elements -->
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="25" height="70" rx="3" fill="#334155" opacity="0.4" />
    <rect x="4" y="15" width="17" height="4" fill="#64748b" />
    <rect x="4" y="35" width="17" height="4" fill="#64748b" />
    <rect x="4" y="55" width="17" height="4" fill="#64748b" />
    <!-- Small Plant -->
    <path d="M8,15 Q8,5 12,2 Q16,5 16,15 Z" fill="#10b981" />
  </g>

  <!-- Hanging Desk Lamp -->
  <g transform="translate(110, 0)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#64748b" stroke-width="2" />
    <path d="M-15,45 L15,45 L22,58 L-22,58 Z" fill="#fbbf24" />
    <ellipse cx="0" cy="58" rx="22" ry="5" fill="#d97706" />
  </g>

  <!-- The Wooden Desk -->
  <rect x="20" y="160" width="200" height="12" rx="3" fill="url(#deskGrad)" />
  <rect x="35" y="172" width="15" height="50" fill="#78350f" />
  <rect x="190" y="172" width="15" height="50" fill="#78350f" />
  <!-- Desk front trim -->
  <rect x="20" y="160" width="200" height="4" fill="#d97706" opacity="0.6" />

  <!-- Business Planning Props on Desk -->
  <!-- Laptop showing financial upward growth chart -->
  <g transform="translate(135, 120)">
    <!-- Laptop Base -->
    <path d="M-22,40 L38,40 L45,44 L-28,44 Z" fill="#94a3b8" />
    <rect x="-26" y="38" width="68" height="3" rx="1.5" fill="#cbd5e1" />
    <!-- Laptop Screen -->
    <path d="M-20,5 L32,5 L28,40 L-24,40 Z" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <!-- Chart lines on screen -->
    <polyline points="-15,30 -5,22 8,26 22,12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="22" cy="12" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Blueprint / Financial Map with Strategic Nodes -->
  <g transform="translate(65, 132) rotate(-6)">
    <rect x="0" y="0" width="50" height="32" rx="2" fill="url(#blueprintGrad)" />
    <!-- Flowchart / Business Plan graphics -->
    <circle cx="10" cy="10" r="3" fill="#2563eb" />
    <circle cx="25" cy="10" r="3" fill="#2563eb" />
    <circle cx="40" cy="22" r="3" fill="#10b981" />
    <line x1="13" y1="10" x2="22" y2="10" stroke="#64748b" stroke-width="1.5" />
    <line x1="25" y1="13" x2="35" y2="20" stroke="#64748b" stroke-width="1.5" />
    <rect x="6" y="18" width="12" height="8" rx="1" fill="#cbd5e1" />
    <line x1="8" y1="20" x2="16" y2="20" stroke="#94a3b8" stroke-width="1" />
    <line x1="8" y1="23" x2="14" y2="23" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(38, 138)">
    <rect x="0" y="0" width="14" height="18" rx="3" fill="#f8fafc" />
    <path d="M14,4 C19,4 19,14 14,14" fill="none" stroke="#f8fafc" stroke-width="2.5" />
    <!-- Steam -->
    <path d="M4,-4 Q7,-8 4,-12" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M10,-6 Q13,-10 10,-14" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Main Character (Enterprising Professional planning a business venture) -->
  <g transform="translate(90, 85)">
    <!-- Body / Torso leaning slightly forward in deep thought -->
    <path d="M-15,45 C-15,30 5,25 25,40 L30,75 L-20,75 Z" fill="url(#shirtGrad)" />
    
    <!-- Collar & Tie -->
    <path d="M2,28 L10,28 L8,42 L4,42 Z" fill="#ffffff" />
    <polygon points="5,33 9,33 7,50" fill="#ec4899" />

    <!-- Head & Face -->
    <g transform="translate(5, -12)">
      <!-- Neck -->
      <rect x="-2" y="15" width="10" height="15" fill="#fcd34d" />
      
      <!-- Head Base -->
      <ellipse cx="3" cy="2" rx="17" ry="20" fill="#fde047" />
      
      <!-- Neat Modern Hair -->
      <path d="M-14,-2 C-14,-14 0,-18 16,-10 C18,-6 20,2 20,5 C15,0 5,-5 -10,3 C-13,5 -15,2 -14,-2 Z" fill="#334155" />

      <!-- Face Profile / Expression (Thoughtful, determined, planning) -->
      <!-- Eyebrow angled with focus/determination -->
      <path d="M-3,-2 Q3,-5 9,-2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      
      <!-- Eye looking intently forward/down at the business plan -->
      <circle cx="3" cy="4" r="2.5" fill="#1e293b" />
      <circle cx="4" cy="3" r="0.8" fill="#ffffff" />
      
      <!-- Confident, visionary smile / smirk -->
      <path d="M1,12 Q6,16 11,12" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
      
      <!-- Round modern glasses -->
      <circle cx="3" cy="4" r="7" fill="none" stroke="#0f172a" stroke-width="1.5" />
    </g>

    <!-- Arms & Hands (Active gesture: one hand pointing at plan, one hand on chin or table) -->
    <!-- Right Arm (pointing/touching the blueprint) -->
    <path d="M22,42 Q40,48 45,55" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <circle cx="45" cy="56" r="5" fill="#fde047" /> <!-- Hand -->

    <!-- Left Arm (resting on desk near laptop) -->
    <path d="M-12,42 Q-25,50 -20,75" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <circle cx="-20" cy="75" r="5" fill="#fde047" /> <!-- Hand -->
  </g>

  <!-- Floating Strategic Idea / Lightbulb Concept (Subtle, symbolizing "business plan / ambition") -->
  <g transform="translate(115, 38)">
    <path d="M0,-8 C6,-8 10,-4 10,2 C10,6 7,9 5,11 L-5,11 C-7,9 -10,6 -10,2 C-10,-4 -6,-8 0,-8 Z" fill="#fbbf24" opacity="0.9" />
    <rect x="-3" y="11" width="6" height="4" fill="#94a3b8" />
    <!-- Glow rays -->
    <line x1="0" y1="-14" x2="0" y2="-17" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="11" y1="-9" x2="14" y2="-12" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="-11" y1="-9" x2="-14" y2="-12" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>