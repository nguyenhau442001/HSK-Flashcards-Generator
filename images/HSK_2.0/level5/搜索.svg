<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- UI Accent Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    
    <!-- Soft Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Room Details -->
  <!-- Cozy Room Interior Elements -->
  <g id="environment">
    <!-- Window with Night City Glow -->
    <path d="M 180,30 L 215,35 L 215,100 L 180,95 Z" fill="#334155" opacity="0.4" />
    <path d="M 185,38 L 210,42 L 210,92 L 185,88 Z" fill="#0284c7" opacity="0.15" />
    <circle cx="198" cy="50" r="2" fill="#f59e0b" opacity="0.8" />
    <circle cx="205" cy="70" r="1.5" fill="#38bdf8" opacity="0.8" />

    <!-- Wall Shelf with Books -->
    <rect x="15" y="45" width="70" height="4" rx="2" fill="#475569" />
    <rect x="25" y="27" width="10" height="18" rx="2" fill="#ec4899" opacity="0.8" />
    <rect x="37" y="22" width="12" height="23" rx="2" fill="#38bdf8" opacity="0.8" />
    <rect x="51" y="30" width="8" height="15" rx="2" fill="#10b981" opacity="0.8" />

    <!-- Desk / Table Surface -->
    <path d="M 10,190 L 230,190 L 230,225 L 10,225 Z" fill="#0f172a" />
    <rect x="10" y="185" width="220" height="8" rx="3" fill="#334155" />
    
    <!-- Plant in Pot -->
    <path d="M 25,185 L 35,160 L 55,160 L 65,185 Z" fill="#64748b" />
    <ellipse cx="45" cy="160" rx="10" ry="3" fill="#475569" />
    <!-- Leaves -->
    <path d="M 45,157 Q 35,140 25,145 Q 35,155 45,157 Z" fill="#10b981" />
    <path d="M 45,157 Q 55,135 68,142 Q 58,152 45,157 Z" fill="#34d399" />
    <path d="M 45,157 Q 45,130 50,130 Q 48,145 45,157 Z" fill="#059669" />
  </g>

  <!-- Laptop Setup & Interactive Search Visual -->
  <g id="laptop-and-search" filter="url(#softShadow)">
    <!-- Laptop Base -->
    <path d="M 70,185 L 170,185 L 185,195 L 55,195 Z" fill="#64748b" />
    <path d="M 110,185 L 130,185 L 131,192 L 109,192 Z" fill="#475569" />

    <!-- Laptop Screen Bezel -->
    <rect x="65" y="85" width="110" height="102" rx="8" fill="#334155" />
    <!-- Laptop Screen Interior -->
    <rect x="70" y="90" width="100" height="90" rx="4" fill="#0f172a" />
    <rect x="70" y="90" width="100" height="90" rx="4" fill="url(#screenGlow)" />

    <!-- UI Window Inside Laptop Screen -->
    <rect x="78" y="100" width="84" height="72" rx="4" fill="#1e293b" opacity="0.9" />
    <!-- Browser Header Dots -->
    <circle cx="85" cy="106" r="2" fill="#ef4444" />
    <circle cx="91" cy="106" r="2" fill="#f59e0b" />
    <circle cx="97" cy="106" r="2" fill="#10b981" />

    <!-- Search Bar UI -->
    <rect x="85" y="114" width="70" height="12" rx="6" fill="#334155" />
    <circle cx="93" cy="120" r="3" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="95" y1="122" x2="99" y2="126" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <!-- Blinking Cursor inside search bar -->
    <line x1="103" y1="117" x2="103" y2="123" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />

    <!-- Search Results / Answer Cards (Representing "搜索答案" - Searching for Answers) -->
    <!-- Result Card 1 -->
    <rect x="85" y="132" width="70" height="14" rx="3" fill="#334155" opacity="0.6" />
    <circle cx="91" cy="139" r="2" fill="#38bdf8" />
    <rect x="97" y="137" width="40" height="4" rx="2" fill="#94a3b8" />
    <rect x="97" y="143" width="25" height="3" rx="1.5" fill="#64748b" />

    <!-- Result Card 2 (Highlighted with Golden Answer Glow - '答案') -->
    <rect x="85" y="150" width="70" height="18" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <circle cx="92" cy="159" r="3" fill="#f59e0b" />
    <!-- Checkmark inside result icon -->
    <path d="M 90.5,159 L 91.5,160.5 L 94,157" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="99" y="155" width="45" height="5" rx="2" fill="#fbbf24" />
    <rect x="99" y="163" width="30" height="3" rx="1.5" fill="#94a3b8" />
  </g>

  <!-- Floating Digital Magnifying Glass & Search FX (Amplifying the action of '搜索') -->
  <g id="search-fx" filter="url(#glow)">
    <!-- Big Glowing Magnifying Glass Element Floating near screen -->
    <circle cx="145" cy="85" r="18" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.8" />
    <line x1="158" y1="98" x2="173" y2="113" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    
    <!-- Sparkles/Data Bits -->
    <path d="M 130,65 L 133,70 L 138,73 L 133,76 L 130,81 L 127,76 L 122,73 L 127,70 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M 168,55 L 169.5,58 L 172.5,59.5 L 169.5,61 L 168,64 L 166.5,61 L 163.5,59.5 L 166.5,58 Z" fill="#38bdf8" opacity="0.9" />
    <circle cx="120" cy="95" r="2" fill="#10b981" />
  </g>

  <!-- Character (Curious/Engaged Student/Worker) -->
  <g id="character">
    <!-- Body / Torso & Hoodie -->
    <path d="M 35,210 C 35,185 55,175 75,175 C 95,175 115,185 115,210 Z" fill="#38bdf8" />
    <!-- Hoodie Pocket / Details -->
    <path d="M 55,195 L 95,195 L 90,210 L 60,210 Z" fill="#0284c7" opacity="0.5" />

    <!-- Neck -->
    <rect x="68" y="160" width="14" height="18" rx="6" fill="#fbcfe8" />

    <!-- Head & Face -->
    <circle cx="75" cy="140" r="22" fill="#fbcfe8" />

    <!-- Hair (Trendy Styled Hair) -->
    <path d="M 54,135 C 53,120 62,118 75,117 C 88,118 97,122 96,138 C 96,140 94,137 92,132 C 88,123 75,123 62,126 C 58,127 55,130 54,135 Z" fill="#1e293b" />
    <path d="M 70,117 Q 78,112 88,120 Q 82,116 70,117 Z" fill="#334155" />

    <!-- Expressive Face Details -->
    <!-- Eyes (Focused, looking intently at screen) -->
    <circle cx="68" cy="140" r="2.5" fill="#1e293b" />
    <circle cx="82" cy="140" r="2.5" fill="#1e293b" />
    <!-- Eyebrows (Slightly raised with curiosity) -->
    <path d="M 65,134 Q 68,132 71,135" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 79,135 Q 82,132 85,134" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Gentle Smile -->
    <path d="M 72,148 Q 75,151 78,148" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="63" cy="145" r="3" fill="#fda4af" opacity="0.6" />
    <circle cx="87" cy="145" r="3" fill="#fda4af" opacity="0.6" />

    <!-- Arms & Hands interacting with laptop / typing -->
    <!-- Left Arm -->
    <path d="M 45,185 C 50,175 60,170 70,175" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    <!-- Left Hand on keyboard -->
    <circle cx="68" cy="178" r="4" fill="#fbcfe8" />

    <!-- Right Arm (Reaching forward to mouse or typing) -->
    <path d="M 105,185 C 105,175 95,170 85,175" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    <!-- Right Hand -->
    <circle cx="87" cy="178" r="4" fill="#fbcfe8" />
  </g>

  <!-- Foreground Atmospheric Elements / Lighting -->
  <circle cx="120" cy="120" r="80" fill="url(#screenGlow)" pointer-events="none" />
</svg>