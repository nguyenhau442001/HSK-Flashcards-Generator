<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Moonlight Gradient -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Room Interior Background -->
  <!-- Wallpaper Paneling -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="30" width="60" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="100" y="30" width="60" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Window with Moonlight & Rain/Atmosphere -->
  <g transform="translate(160, 25)">
    <rect x="0" y="0" width="60" height="90" rx="6" fill="#0b1329" stroke="#475569" stroke-width="2"/>
    <rect x="4" y="4" width="52" height="82" fill="url(#moonlight)"/>
    <!-- Window Panes -->
    <line x1="30" y1="0" x2="30" y2="90" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="60" y2="45" stroke="#475569" stroke-width="1.5"/>
    <!-- Curtains -->
    <path d="M 0 0 Q 15 45 0 90 Z" fill="#334155" opacity="0.7"/>
    <path d="M 60 0 Q 45 45 60 90 Z" fill="#334155" opacity="0.7"/>
  </g>

  <!-- Floor Surface -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#floor-grad)"/>

  <!-- Bookshelf / Prop in Background -->
  <g transform="translate(25, 70)">
    <rect x="0" y="0" width="30" height="90" fill="#151c2c" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="30" x2="30" y2="30" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="60" x2="30" y2="60" stroke="#334155" stroke-width="1"/>
    <!-- Books -->
    <rect x="4" y="10" width="6" height="18" fill="#ef4444" rx="1"/>
    <rect x="12" y="12" width="5" height="16" fill="#38bdf8" rx="1"/>
    <rect x="5" y="40" width="18" height="6" fill="#10b981" rx="1"/>
  </g>

  <!-- Desk & Lamp (Crime Scene Office/Study setting) -->
  <g transform="translate(15, 115)">
    <!-- Desk Legs -->
    <rect x="10" y="25" width="4" height="45" fill="#334155"/>
    <rect x="75" y="25" width="4" height="45" fill="#334155"/>
    <!-- Desk Top -->
    <rect x="0" y="15" width="90" height="12" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/>
    <!-- Turned over chair -->
    <g transform="translate(75, 30) rotate(-45)">
      <rect x="0" y="0" width="14" height="14" rx="2" fill="#64748b"/>
      <line x1="7" y1="14" x2="7" y2="30" stroke="#475569" stroke-width="2"/>
    </g>
    <!-- Desk Lamp -->
    <circle cx="20" cy="15" r="4" fill="#fbbf24"/>
    <path d="M 12 15 L 20 2 L 28 15 Z" fill="#94a3b8"/>
    <!-- Lamp Light Beam Area -->
    <path d="M 5 15 L 35 15 L 60 70 L -15 70 Z" fill="url(#lamp-glow)" style="mix-blend-mode: screen;"/>
    <!-- Papers scattered on desk -->
    <rect x="40" y="18" width="12" height="8" rx="1" fill="#f8fafc" transform="rotate(12 46 22)"/>
    <rect x="55" y="20" width="10" height="7" rx="1" fill="#cbd5e1" transform="rotate(-15 60 23)"/>
  </g>

  <!-- MAIN CHARACTER SCENE: Fallen Figure (Narrative depiction of "被杀害了") -->
  <g filter="url(#shadow)" transform="translate(65, 130)">
    <!-- Dramatic lighting circle on floor -->
    <ellipse cx="65" cy="55" rx="55" ry="25" fill="#38bdf8" opacity="0.08"/>

    <!-- Fallen Character (Subject) -->
    <!-- Head -->
    <circle cx="35" cy="40" r="12" fill="#fcd34d"/>
    <!-- Dark/Messy Hair -->
    <path d="M 23 40 Q 30 25 45 32 Q 42 42 35 44 Z" fill="#1e293b"/>
    
    <!-- Torso (lying on side/back) -->
    <path d="M 43 45 L 85 50 L 90 68 L 48 70 Z" fill="#2563eb"/> <!-- Blue jacket/shirt -->
    
    <!-- Arms -->
    <!-- Outstretched Arm -->
    <path d="M 50 50 L 70 30 L 75 35 L 58 55 Z" fill="#3b82f6"/>
    <!-- Hand -->
    <circle cx="73" cy="28" r="4" fill="#fcd34d"/>

    <!-- Legs -->
    <path d="M 85 62 L 120 58 L 123 68 L 88 72 Z" fill="#334155"/> <!-- Dark trousers -->
    <!-- Shoes -->
    <path d="M 120 56 L 132 58 L 132 66 L 120 66 Z" fill="#0f172a" rx="2"/>

    <!-- Secondary details for dramatic storytelling -->
    <!-- Fallen item (e.g., dropped phone or notebook nearby) -->
    <g transform="translate(90, 75) rotate(25)">
      <rect x="0" y="0" width="14" height="8" rx="1.5" fill="#475569" stroke="#94a3b8" stroke-width="0.75"/>
      <rect x="2" y="2" width="10" height="4" fill="#0f172a"/>
    </g>

    <!-- Caution / Crime Scene Tape element stylized as warning accent (Amber/Red glowing boundary line across foreground) -->
    <path d="M -30 85 L 170 65" stroke="#ef4444" stroke-width="4" stroke-dasharray="12 6" opacity="0.85" filter="url(#glow)"/>
    <path d="M -30 85 L 170 65" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 12" opacity="0.9"/>
  </g>

  <!-- Atmospheric Dust / Suspended particles in light -->
  <circle cx="110" cy="90" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="140" cy="110" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="95" cy="75" r="1" fill="#fbbf24" opacity="0.7"/>
  <circle cx="160" cy="80" r="1.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="70" cy="100" r="2" fill="#fbbf24" opacity="0.5"/>

  <!-- Foreground Vignette Frame for depth -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.6"/>
</svg>