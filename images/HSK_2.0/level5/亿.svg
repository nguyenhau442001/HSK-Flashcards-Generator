<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing effect for city lights -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Hologram/Screen Gradient -->
    <linearGradient id="holoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Distant City Skyline Layers (Back) -->
  <path d="M0 160 L0 240 L240 240 L240 150 L220 150 L220 130 L205 130 L205 160 L185 160 L185 120 L170 120 L170 160 L150 160 L150 100 L135 100 L135 160 L110 160 L110 140 L90 140 L90 160 L70 160 L70 110 L50 110 L50 160 L30 160 L30 135 L15 135 L15 160 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Closer Skyline Layers (Front) -->
  <path d="M0 170 L0 240 L240 240 L240 160 L230 160 L230 120 L215 120 L215 160 L195 160 L195 90 L175 90 L175 160 L160 160 L160 110 L140 110 L140 160 L125 160 L125 80 L100 80 L100 160 L80 160 L80 130 L60 130 L60 160 L40 160 L40 100 L20 100 L20 160 Z" fill="#0f172a"/>

  <!-- Glowing City Windows / Lights (Dense Population Concept) -->
  <!-- Random small rects representing millions of apartment lights -->
  <g fill="#fbbf24" opacity="0.8" filter="url(#glow)">
    <!-- Tower 1 -->
    <rect x="25" y="110" width="3" height="4" />
    <rect x="32" y="110" width="3" height="4" />
    <rect x="25" y="120" width="3" height="4" />
    <rect x="32" y="120" width="3" height="4" />
    <rect x="25" y="130" width="3" height="4" />
    <rect x="32" y="130" width="3" height="4" />
    
    <!-- Tower 2 -->
    <rect x="68" y="140" width="2" height="3" fill="#38bdf8"/>
    <rect x="73" y="140" width="2" height="3" fill="#38bdf8"/>
    <rect x="68" y="148" width="2" height="3"/>
    <rect x="73" y="148" width="2" height="3"/>
    <rect x="68" y="156" width="2" height="3"/>
    <rect x="73" y="156" width="2" height="3"/>

    <!-- Tower 3 (Tall Central) -->
    <rect x="105" y="90" width="3" height="5" fill="#f43f5e"/>
    <rect x="112" y="90" width="3" height="5"/>
    <rect x="119" y="90" width="3" height="5" fill="#38bdf8"/>
    <rect x="105" y="100" width="3" height="5"/>
    <rect x="112" y="100" width="3" height="5" fill="#f43f5e"/>
    <rect x="119" y="100" width="3" height="5"/>
    <rect x="105" y="110" width="3" height="5" fill="#38bdf8"/>
    <rect x="112" y="110" width="3" height="5"/>
    <rect x="119" y="110" width="3" height="5"/>
    <rect x="105" y="120" width="3" height="5"/>
    <rect x="112" y="120" width="3" height="5" fill="#38bdf8"/>
    <rect x="119" y="120" width="3" height="5" fill="#f43f5e"/>

    <!-- Tower 4 -->
    <rect x="145" y="120" width="4" height="4"/>
    <rect x="152" y="120" width="4" height="4" fill="#38bdf8"/>
    <rect x="145" y="130" width="4" height="4" fill="#fb923c"/>
    <rect x="152" y="130" width="4" height="4"/>
    
    <!-- Tower 5 -->
    <rect x="182" y="100" width="3" height="3"/>
    <rect x="188" y="100" width="3" height="3" fill="#38bdf8"/>
    <rect x="182" y="108" width="3" height="3" fill="#fbbf24"/>
    <rect x="188" y="108" width="3" height="3"/>
    <rect x="182" y="116" width="3" height="3"/>
    <rect x="188" y="116" width="3" height="3" fill="#f43f5e"/>
  </g>

  <!-- More dense tiny ambient window dots -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="95" cy="145" r="0.8"/>
    <circle cx="98" cy="145" r="0.8"/>
    <circle cx="95" cy="149" r="0.8"/>
    <circle cx="98" cy="149" r="0.8"/>
    <circle cx="165" cy="125" r="0.8"/>
    <circle cx="169" cy="125" r="0.8"/>
    <circle cx="165" cy="132" r="0.8"/>
    <circle cx="169" cy="132" r="0.8"/>
    <circle cx="205" cy="135" r="0.8"/>
    <circle cx="209" cy="135" r="0.8"/>
    <circle cx="205" cy="142" r="0.8"/>
    <circle cx="209" cy="142" r="0.8"/>
  </g>

  <!-- Balcony / Observation Deck Floor -->
  <path d="M-10 210 L250 210 L250 240 L-10 240 Z" fill="#0f172a"/>
  <!-- Balcony Railing -->
  <path d="M0 200 L240 200" stroke="#334155" stroke-width="4"/>
  <line x1="30" y1="200" x2="30" y2="210" stroke="#334155" stroke-width="3"/>
  <line x1="80" y1="200" x2="80" y2="210" stroke="#334155" stroke-width="3"/>
  <line x1="130" y1="200" x2="130" y2="210" stroke="#334155" stroke-width="3"/>
  <line x1="180" y1="200" x2="180" y2="210" stroke="#334155" stroke-width="3"/>
  <line x1="220" y1="200" x2="220" y2="210" stroke="#334155" stroke-width="3"/>

  <!-- Foreground Character: Urban Planner / Analyst pointing proudly at the city -->
  <!-- Character Body / Coat -->
  <path d="M165 160 C165 150 175 140 185 140 C195 140 205 150 205 160 L210 210 L160 210 Z" fill="#0284c7"/>
  <path d="M185 140 L185 210" stroke="#0284c7" stroke-width="3"/>
  
  <!-- Character Head & Hair -->
  <circle cx="185" cy="124" r="13" fill="#fcd34d"/>
  <path d="M173 122 C173 114 180 110 187 110 C195 110 198 116 198 123 C193 120 185 118 178 123 Z" fill="#334155"/>

  <!-- Arm pointing forward towards the skyline -->
  <path d="M190 148 L220 135" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="221" cy="134" r="4" fill="#fcd34d"/>

  <!-- Other arm resting on hip -->
  <path d="M172 148 L162 170 L172 175" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Futuristic Holographic Data Display (Representing Population Metrics / "100 Million") -->
  <g transform="translate(65, 80)">
    <!-- Hologram Screen Background -->
    <path d="M 0 10 L 15 0 L 85 0 L 100 10 L 100 65 L 85 75 L 15 75 L 0 65 Z" fill="url(#holoGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Hologram Corner Accents -->
    <path d="M 0 20 L 0 10 L 10 10" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 100 20 L 100 10 L 90 10" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 0 55 L 0 65 L 10 65" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 100 55 L 100 65 L 90 65" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Mini Chart / Population Graph Bars -->
    <rect x="15" y="45" width="8" height="20" rx="1" fill="#38bdf8" opacity="0.6"/>
    <rect x="27" y="35" width="8" height="30" rx="1" fill="#38bdf8" opacity="0.7"/>
    <rect x="39" y="25" width="8" height="40" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="51" y="15" width="8" height="50" rx="1" fill="#10b981" filter="url(#glow)"/>

    <!-- Abstract Population Icon (Stylized human figures node network) -->
    <circle cx="78" cy="28" r="4" fill="#fbbf24"/>
    <path d="M72 40 C72 35 84 35 84 40" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    
    <circle cx="68" cy="45" r="3" fill="#38bdf8"/>
    <circle cx="88" cy="45" r="3" fill="#38bdf8"/>
    
    <line x1="75" y1="30" x2="68" y2="42" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="81" y1="30" x2="88" y2="42" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Pulsing Signal Waves -->
    <path d="M 45 80 Q 50 88 55 80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <path d="M 40 85 Q 50 95 60 85" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Connecting Beam from Hologram to City -->
  <path d="M115 155 L115 170" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- Atmospheric Lighting / Glows on Top -->
  <circle cx="50" cy="40" r="30" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="190" cy="50" r="40" fill="#fbbf24" opacity="0.06" filter="url(#glow)"/>

</svg>