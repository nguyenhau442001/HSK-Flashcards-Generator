<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="beadGrad" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="30%" stop-color="#f472b6"/>
      <stop offset="80%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Warm ambient lighting from a desk lamp -->
  <circle cx="180" cy="80" r="90" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Background room details: Wall shelf and potted plant silhouette -->
  <g opacity="0.6">
    <rect x="30" y="55" width="70" height="6" rx="3" fill="#334155"/>
    <!-- Cute tiny plant on shelf -->
    <path d="M50 55 L55 42 L65 42 L70 55 Z" fill="#64748b"/>
    <circle cx="60" cy="37" r="10" fill="#10b981"/>
    <circle cx="53" cy="33" r="7" fill="#34d399"/>
    <!-- Window with night view -->
    <rect x="145" y="30" width="50" height="60" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <line x1="170" y1="30" x2="170" y2="90" stroke="#334155" stroke-width="2"/>
    <line x1="145" y1="60" x2="195" y2="60" stroke="#334155" stroke-width="2"/>
    <circle cx="158" cy="45" r="1.5" fill="#f8fafc"/>
    <circle cx="185" cy="50" r="1" fill="#f8fafc"/>
  </g>

  <!-- The Wooden Table Top (Perspective) -->
  <path d="M 10 145 L 230 145 L 210 220 L 30 220 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <!-- Table surface highlight / border -->
  <path d="M 15 145 L 225 145" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 30 220 L 210 220" stroke="#5b21b6" stroke-width="4"/>

  <!-- Desk Props for rich context -->
  <!-- Open Notebook -->
  <g transform="translate(35, 155) rotate(-5)">
    <rect x="0" y="0" width="55" height="40" rx="2" fill="#f8fafc"/>
    <path d="M 27.5 0 L 27.5 40" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="6" y1="10" x2="22" y2="10" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="20" y2="18" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="33" y1="10" x2="49" y2="10" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="33" y1="18" x2="47" y2="18" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- A stylish ceramic mug / cup -->
  <g transform="translate(160, 160)">
    <ellipse cx="14" cy="8" rx="10" ry="4" fill="#38bdf8"/>
    <path d="M4 8 L6 26 C6 28 8 30 11 30 L17 30 C20 30 22 28 22 26 L24 8 Z" fill="#0ea5e9"/>
    <path d="M22 12 C27 12 28 18 24 22" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M10 2 C10 -2 14 -4 12 -8" fill="none" stroke="#f0fdf4" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- THE HERO OBJECT: "颗" (A single pearl bead on the table) -->
  <g transform="translate(115, 175)" filter="url(#shadow)">
    <!-- Shadow directly under the bead -->
    <ellipse cx="6" cy="14" rx="7" ry="3" fill="#090d16" opacity="0.5"/>
    
    <!-- The spherical bead (representing "一颗珠子") -->
    <circle cx="6" cy="6" r="8" fill="url(#beadGrad)"/>
    
    <!-- Glossy reflection highlights for 3D vector pop -->
    <circle cx="4" cy="3" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="8" cy="8" r="1" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Expressive Character hand pointing/curious near the table, adding human presence and scale -->
  <g transform="translate(85, 110)">
    <!-- Sleeve & Arm -->
    <path d="M 0 50 C 10 35, 25 20, 35 0 L 55 15 C 45 35, 25 55, 15 70 Z" fill="#ec4899"/>
    <!-- Cuff -->
    <path d="M 28 8 L 47 22" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <!-- Hand / Finger pointing at the bead -->
    <circle cx="38" cy="18" r="7" fill="#fde68a"/>
    <path d="M 32 15 L 26 22 L 34 25 Z" fill="#fde68a"/> <!-- Pointing index finger -->
  </g>

  <!-- Playful floating particle/sparkles to enhance vector finish -->
  <g fill="#fbbf24">
    <circle cx="100" cy="160" r="1.5" opacity="0.8"/>
    <circle cx="135" cy="168" r="2" opacity="0.9"/>
    <path d="M125 145 L127 150 L132 152 L127 154 L125 159 L123 154 L118 152 L123 150 Z" opacity="0.7" transform="scale(0.5) translate(130, 90)"/>
  </g>
</svg>