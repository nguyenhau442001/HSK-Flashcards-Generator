<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Distant Cityscape Silhouette -->
  <path d="M0 160 L40 130 L80 150 L120 110 L160 140 L200 120 L240 150 L240 240 L0 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- The Sun Setting (Golden Hour Glow) -->
  <circle cx="180" cy="80" r="35" fill="#fbbf24" opacity="0.9"/>
  <circle cx="180" cy="80" r="45" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Park Bench and Lamp Post -->
  <rect x="30" y="170" width="80" height="15" rx="4" fill="#fb923c"/>
  <rect x="40" y="185" width="10" height="30" fill="#475569"/>
  <rect x="90" y="185" width="10" height="30" fill="#475569"/>
  
  <rect x="180" y="100" width="6" height="140" fill="#334155"/>
  <circle cx="183" cy="100" r="12" fill="#fef3c7"/>
  <circle cx="183" cy="100" r="18" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Atmospheric Details: Clouds -->
  <path d="M20 60 Q40 40 60 60 T100 60" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M10 90 Q30 70 50 90 T90 90" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
  
  <!-- A person walking (silhouette) -->
  <g transform="translate(120, 160)">
    <circle cx="0" cy="0" r="8" fill="#e2e8f0"/>
    <rect x="-3" y="8" width="6" height="25" rx="2" fill="#e2e8f0"/>
    <path d="M-5 33 L-5 45 M5 33 L5 45" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Park Path -->
  <path d="M0 240 Q120 180 240 240" fill="#10b981" opacity="0.15"/>
</svg>