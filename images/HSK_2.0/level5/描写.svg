<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="paperGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Environment & Window depicting the "Scene" (风景) -->
  <!-- Window frame -->
  <rect x="25" y="25" width="85" height="95" rx="8" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <rect x="33" y="33" width="69" height="79" rx="4" fill="url(#windowGlow)"/>
  <!-- Scene outside window (mountains, sun, tree - representing the 'scene' being described) -->
  <path d="M33 80 L55 55 L75 75 L95 50 L102 112 L33 112 Z" fill="#0369a1" opacity="0.4"/>
  <path d="M55 112 L75 70 L95 90 L102 112 Z" fill="#0284c7" opacity="0.6"/>
  <circle cx="85" cy="45" r="8" fill="#fbbf24" opacity="0.8" filter="url(#glow)"/>
  <!-- Window crossbars -->
  <line x1="67" y1="33" x2="67" y2="112" stroke="#475569" stroke-width="2"/>
  <line x1="33" y1="72.5" x2="102" y2="72.5" stroke="#475569" stroke-width="2"/>

  <!-- Bookshelf / Prop Background -->
  <rect x="180" y="40" width="35" height="80" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="180" y1="70" x2="215" y2="70" stroke="#334155" stroke-width="1.5"/>
  <line x1="180" y1="100" x2="215" y2="100" stroke="#334155" stroke-width="1.5"/>
  <rect x="185" y="50" width="8" height="20" fill="#f43f5e" rx="1"/>
  <rect x="195" y="55" width="6" height="15" fill="#38bdf8" rx="1"/>
  <rect x="185" y="80" width="12" height="20" fill="#10b981" rx="1"/>

  <!-- Study Desk Surface -->
  <path d="M10 185 C10 180, 15 175, 20 175 L220 175 C225 175, 230 180, 230 185 L230 220 C230 225, 225 230, 220 230 L20 230 C15 230, 10 225, 10 220 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="1.5"/>
  <rect x="10" y="175" width="220" height="6" fill="#475569" rx="2"/>

  <!-- Writing Paper / Canvas on Desk showing abstract strokes (miáoxiě / describing) -->
  <g transform="translate(100, 150) rotate(-6)">
    <rect x="0" y="0" width="60" height="45" rx="3" fill="url(#paperGlow)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Sketch lines representing the description of the scene -->
    <path d="M10 12 Q 25 5, 40 15 T 50 30" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M15 25 L 35 25" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M15 33 L 45 33" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="42" cy="18" r="4" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Desk Lamp providing warm focus light -->
  <path d="M195 175 L205 130 L215 130 L225 175 Z" fill="#334155"/>
  <ellipse cx="210" cy="130" rx="15" ry="5" fill="#64748b"/>
  <path d="M190 115 C190 100, 220 100, 220 115 Z" fill="#fbbf24"/>
  <!-- Lamp Light Cone -->
  <polygon points="210,118 140,185 235,185" fill="#fef08a" opacity="0.12"/>

  <!-- Main Character (Writer / Observer actively describing the scene) -->
  <g transform="translate(115, 95)">
    <!-- Body & Torso -->
    <path d="M35 50 C25 50, 15 65, 10 85 L75 85 C70 65, 60 50, 50 50 Z" fill="#38bdf8"/>
    <rect x="35" y="42" width="22" height="15" rx="6" fill="#e2e8f0"/>
    
    <!-- Head & Face -->
    <circle cx="45" cy="28" r="16" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M29 28 C29 15, 40 12, 50 14 C60 16, 61 28, 61 28 C61 28, 55 20, 45 20 C35 20, 29 28, 29 28 Z" fill="#1e293b"/>
    <!-- Facial expression: focused and engaged -->
    <circle cx="40" cy="27" r="1.5" fill="#1e293b"/>
    <circle cx="50" cy="27" r="1.5" fill="#1e293b"/>
    <path d="M43 33 Q45 35 47 33" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Arms & Pen / Action of Describing/Writing -->
    <!-- Left arm resting -->
    <path d="M20 65 C15 75, 15 85, 20 85" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <!-- Right arm holding pen actively writing/describing -->
    <path d="M60 65 C68 70, 75 75, 68 85" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="68" cy="86" r="4" fill="#fed7aa"/>
    <!-- Pen -->
    <line x1="68" y1="86" x2="45" y2="92" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Extra atmospheric detail: Floating glowing creative particles (representing detail/description) -->
  <circle cx="105" cy="115" r="2.5" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="140" cy="100" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="125" cy="135" r="2" fill="#f43f5e" opacity="0.7"/>
</svg>