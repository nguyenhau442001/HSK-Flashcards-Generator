<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Background Environment & Atmosphere -->
  <!-- Majestic arched window showing a dusk skyline -->
  <path d="M70,45 L170,45 L170,140 Q170,170 120,170 Q70,170 70,140 Z" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <path d="M78,53 L162,53 L162,138 Q162,164 120,164 Q78,164 78,138 Z" fill="#1e293b"/>
  <!-- City silhouette through window -->
  <rect x="85" y="110" width="12" height="54" fill="#334155" opacity="0.5"/>
  <rect x="100" y="90" width="18" height="74" fill="#334155" opacity="0.6"/>
  <rect x="121" y="120" width="15" height="44" fill="#334155" opacity="0.4"/>
  <rect x="139" y="98" width="16" height="66" fill="#334155" opacity="0.5"/>

  <!-- Warm background light beam -->
  <path d="M120,53 L60,210 L180,210 Z" fill="#fbbf24" opacity="0.05"/>

  <!-- Heavy curtains on the sides -->
  <path d="M20,20 Q50,100 35,220 L15,220 L15,20 Z" fill="#831843" opacity="0.9"/>
  <path d="M220,20 Q190,100 205,220 L225,220 L225,20 Z" fill="#831843" opacity="0.9"/>

  <!-- Massive Executive Desk Surface -->
  <path d="M10,200 L230,200 L240,240 L0,240 Z" fill="url(#wood)" filter="url(#shadow)"/>
  <!-- Desk edge highlight -->
  <path d="M10,200 L230,200 L232,206 L8,206 Z" fill="#b45309"/>

  <!-- SCENE OBJECT 1: The Presidential Seal / Stamp (玉玺) -->
  <g transform="translate(65, 170)" filter="url(#shadow)">
    <!-- Base block of the stamp -->
    <rect x="-18" y="-24" width="36" height="30" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="-16" y="-22" width="32" height="26" rx="2" fill="url(#gold)"/>
    <!-- Intricate dragon handle top -->
    <path d="M-10,-22 C-10,-34 10,-34 10,-22 C10,-26 6,-28 0,-28 C-6,-28 -10,-26 -10,-22 Z" fill="#b45309"/>
    <circle cx="0" cy="-24" r="3" fill="#fde047"/>
    <!-- Stamp Glow -->
    <ellipse cx="0" cy="10" rx="20" ry="6" fill="#ef4444" opacity="0.6"/>
  </g>

  <!-- SCENE OBJECT 2: The Grand Presidential Throne / Chair (Power Symbol) -->
  <g transform="translate(120, 145)" filter="url(#shadow)">
    <!-- High Backrest -->
    <path d="M-36,-70 L36,-70 L42,30 L-42,30 Z" fill="#450a0a" stroke="#7f1d1d" stroke-width="3"/>
    <!-- Gold Trim on Backrest -->
    <path d="M-32,-66 L32,-66 L37,26 L-37,26 Z" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <!-- Velvet Upholstery Center -->
    <path d="M-26,-62 L26,-62 L31,22 L-31,22 Z" fill="#991b1b"/>
    <!-- Diamond tufting pattern -->
    <path d="M0,-50 L10,-40 L0,-30 L-10,-40 Z" fill="#b91c1c" opacity="0.6"/>
    <path d="M-20,-50 L-15,-40 L-20,-30 Z" fill="#b91c1c" opacity="0.6"/>
    <path d="M20,-50 L15,-40 L20,-30 Z" fill="#b91c1c" opacity="0.6"/>
    <path d="M0,-20 L10,-10 L0,0 L-10,-10 Z" fill="#b91c1c" opacity="0.6"/>

    <!-- Regal Crest at Top of Throne -->
    <path d="M0,-85 L14,-70 L-14,-70 Z" fill="url(#gold)"/>
    <circle cx="0" cy="-77" r="4" fill="#ef4444"/>

    <!-- Throne Seat -->
    <path d="M-48,30 L48,30 L56,42 L-56,42 Z" fill="url(#gold)"/>
    <path d="M-42,33 L42,33 L46,39 L-46,39 Z" fill="#78350f"/>

    <!-- Armrests -->
    <path d="M-52,-10 L-42,-10 L-48,40 L-58,40 Z" fill="url(#gold)"/>
    <path d="M52,-10 L42,-10 L48,40 L58,40 Z" fill="url(#gold)"/>
  </g>

  <!-- SCENE OBJECT 3: Official Gavel of Authority -->
  <g transform="translate(175, 185) rotate(-25)" filter="url(#shadow)">
    <!-- Wooden Base / Sound Block -->
    <ellipse cx="0" cy="15" rx="22" ry="8" fill="#d97706"/>
    <ellipse cx="0" cy="12" rx="20" ry="7" fill="#b45309"/>
    
    <!-- Gavel Handle -->
    <rect x="-4" y="-25" width="8" height="35" rx="2" fill="#78350f"/>
    <!-- Gavel Head -->
    <rect x="-22" y="-35" width="44" height="16" rx="4" fill="url(#wood)" stroke="#b45309" stroke-width="1.5"/>
    <!-- Gold accent rings on gavel -->
    <rect x="-16" y="-35" width="4" height="16" fill="url(#gold)"/>
    <rect x="12" y="-35" width="4" height="16" fill="url(#gold)"/>
  </g>

  <!-- SCENE OBJECT 4: Important State Document with Ribbons (Decree / Mandate) -->
  <g transform="translate(120, 195)" filter="url(#shadow)">
    <!-- Scroll Base (Rolled edges) -->
    <rect x="-35" y="-6" width="70" height="14" rx="7" fill="#fef08a"/>
    <rect x="-30" y="-8" width="60" height="18" fill="#fef9c3"/>
    <!-- Red Wax Seal Ribbon -->
    <rect x="-6" y="-9" width="12" height="20" fill="#dc2626"/>
    <circle cx="0" cy="1" r="7" fill="#b91c1c"/>
    <circle cx="0" cy="1" r="5" fill="#ef4444"/>
    <!-- Hanging Ribbon Tails -->
    <path d="M-4,10 L-8,22 L0,18 L8,22 L4,10 Z" fill="#dc2626"/>
  </g>

  <!-- Magical / Energetic Atmosphere representing 'Power/Authority' -->
  <g opacity="0.7">
    <!-- Floating Gold Particles / Sparks -->
    <circle cx="95" cy="100" r="2.5" fill="#fde047" filter="url(#shadow)"/>
    <circle cx="150" cy="80" r="3.5" fill="#fde047" filter="url(#shadow)"/>
    <circle cx="130" cy="115" r="2" fill="#fef08a"/>
    <circle cx="80" cy="130" r="1.5" fill="#fde047"/>
    <circle cx="165" cy="135" r="2.5" fill="#fde047"/>

    <!-- Subtle Aura glow behind throne -->
    <circle cx="120" cy="100" r="45" fill="url(#glow)" opacity="0.3" style="mix-blend-mode: screen;"/>
  </g>

  <!-- Foreground Lighting and Vignette (Completing app-icon polish) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
</svg>