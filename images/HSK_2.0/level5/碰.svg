<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm street lamp glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground gradient -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Character A clothing gradient -->
    <linearGradient id="jacketA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character B clothing gradient -->
    <linearGradient id="jacketB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Motion/Impact Effect Lines -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGradient)"/>

  <!-- BACKGROUND URBAN ENVIRONMENT -->
  <!-- Distant City Buildings Silhouette -->
  <path d="M0 160 L0 115 L20 115 L20 130 L45 130 L45 105 L70 105 L70 160 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M60 160 L60 95 L95 95 L95 160 Z" fill="#1e293b" opacity="0.8"/>
  <path d="M90 160 L90 80 L125 80 L125 160 Z" fill="#334155" opacity="0.5"/>
  <path d="M120 160 L120 100 L155 100 L155 160 Z" fill="#1e293b" opacity="0.7"/>
  <path d="M150 160 L150 88 L185 88 L185 160 Z" fill="#334155" opacity="0.4"/>
  <path d="M180 160 L180 110 L210 110 L210 160 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M205 160 L205 95 L240 95 L240 160 Z" fill="#1e293b" opacity="0.8"/>

  <!-- Building Windows (lit yellow windows) -->
  <g fill="#fde047" opacity="0.4">
    <rect x="28" y="115" width="4" height="6" />
    <rect x="36" y="115" width="4" height="6" />
    <rect x="28" y="125" width="4" height="6" />
    <rect x="68" y="105" width="5" height="8" />
    <rect x="78" y="105" width="5" height="8" />
    <rect x="68" y="120" width="5" height="8" />
    <rect x="100" y="90" width="6" height="10" />
    <rect x="112" y="90" width="6" height="10" />
    <rect x="100" y="108" width="6" height="10" />
    <rect x="160" y="100" width="5" height="7" />
    <rect x="170" y="100" width="5" height="7" />
    <rect x="215" y="105" width="6" height="9" />
  </g>

  <!-- Distant Trees / Foliage layer -->
  <circle cx="20" cy="155" r="15" fill="#0f766e" opacity="0.6"/>
  <circle cx="35" cy="152" r="18" fill="#0f766e" opacity="0.8"/>
  <circle cx="215" cy="155" r="20" fill="#0f766e" opacity="0.7"/>
  <circle cx="230" cy="150" r="15" fill="#0f766e" opacity="0.5"/>

  <!-- Street Lamp Pole & Fixture -->
  <path d="M190 160 L192 60 L195 55 L205 50" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M190 160 L192 60 L195 55 L205 50" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Lamp Head -->
  <path d="M198 48 L212 48 L216 54 L194 54 Z" fill="#334155"/>
  <!-- Lamp Glow Circle -->
  <circle cx="205" cy="70" r="60" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>
  <circle cx="205" cy="56" r="4" fill="#fef08a"/>

  <!-- Sidewalk and Street Ground -->
  <rect x="0" y="160" width="240" height="80" fill="url(#groundGrad)"/>
  <!-- Sidewalk curb -->
  <rect x="0" y="160" width="240" height="6" fill="#334155"/>
  <line x1="0" y1="166" x2="240" y2="166" stroke="#475569" stroke-width="1"/>
  <!-- Road markings -->
  <line x1="0" y1="205" x2="240" y2="205" stroke="#f1f5f9" stroke-dasharray="12,12" stroke-width="2" opacity="0.3"/>

  <!-- SCENE PROPS (Contextual: Urban Street elements) -->
  <!-- Bicycle parked against a small post -->
  <g transform="translate(15, 155)" opacity="0.7">
    <circle cx="10" cy="5" r="8" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="30" cy="5" r="8" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M10 5 L20 -8 L30 5 L20 5 Z" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M20 -8 L18 -12" fill="none" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- MAIN CHARACTERS: "碰" (Encounter / Bump into each other on the road) -->
  <!-- Action lines / surprise indicators floating near them -->
  <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M105 105 L98 98"/>
    <path d="M135 105 L142 98"/>
    <path d="M120 95 L120 87"/>
  </g>

  <!-- CHARACTER A (Left side - Walking right, surprised expression) -->
  <g id="characterA">
    <!-- Shadow -->
    <ellipse cx="88" cy="218" rx="14" ry="4" fill="#020617" opacity="0.5"/>

    <!-- Backpack -->
    <path d="M72 175 C68 175 66 182 68 192 C70 198 75 200 78 198 L78 178 Z" fill="#475569"/>

    <!-- Legs & Shoes (Walking stance) -->
    <path d="M82 195 L74 215 L80 217 L87 198 Z" fill="#1e293b"/> <!-- Left leg -->
    <path d="M92 195 L100 213 L106 211 L96 195 Z" fill="#0f172a"/> <!-- Right leg -->
    <ellipse cx="78" cy="217" rx="5" ry="2" fill="#cbd5e1"/>
    <ellipse cx="104" cy="213" rx="5" ry="2" fill="#cbd5e1"/>

    <!-- Torso / Jacket A -->
    <path d="M75 165 L100 165 L102 198 L78 198 Z" fill="url(#jacketA)"/>
    <path d="M88 165 L88 198" stroke="#0284c7" stroke-width="2"/>

    <!-- Head & Face (Leaning back slightly in surprise) -->
    <circle cx="88" cy="148" r="14" fill="#fcd34d"/>
    <!-- Hair (Stylish dark hair) -->
    <path d="M75 145 C75 138 82 134 92 136 C98 137 102 142 102 148 L100 148 C100 142 96 138 90 137 C83 136 78 140 78 146 Z" fill="#1e293b"/>

    <!-- Facial Expression: Surprised open eyes, open mouth -->
    <circle cx="92" cy="147" r="1.5" fill="#1e293b"/>
    <circle cx="96" cy="147" r="1.5" fill="#1e293b"/>
    <ellipse cx="94" cy="154" rx="2" ry="2.5" fill="#b91c1c"/>

    <!-- Arms (Gesturing in surprise / holding items) -->
    <!-- Left arm holding a coffee cup that's tilting -->
    <path d="M75 170 L62 178 L68 186" fill="none" stroke="url(#jacketA)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="68" cy="186" r="4" fill="#fcd34d"/>
    <!-- Coffee Cup flying slightly -->
    <rect x="58" y="172" width="6" height="8" rx="1" fill="#f8fafc"/>
    <path d="M57 172 L65 172" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Splash drops -->
    <circle cx="52" cy="170" r="1.5" fill="#38bdf8"/>
    <circle cx="48" cy="176" r="1" fill="#38bdf8"/>

    <!-- Right arm (reaching forward/out) -->
    <path d="M98 170 L112 172" fill="none" stroke="url(#jacketA)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="112" cy="172" r="4" fill="#fcd34d"/>
  </g>


  <!-- CHARACTER B (Right side - Walking left, bumped into A) -->
  <g id="characterB">
    <!-- Shadow -->
    <ellipse cx="148" cy="218" rx="14" ry="4" fill="#020617" opacity="0.5"/>

    <!-- Legs & Shoes (Stepping back from impact) -->
    <path d="M138 195 L130 214 L138 216 L143 198 Z" fill="#334155"/> <!-- Left leg -->
    <path d="M152 195 L160 213 L153 216 L147 195 Z" fill="#1e293b"/> <!-- Right leg -->
    <ellipse cx="134" cy="215" rx="5" ry="2" fill="#94a3b8"/>
    <ellipse cx="156" cy="216" rx="5" ry="2" fill="#94a3b8"/>

    <!-- Torso / Jacket B -->
    <path d="M135 165 L160 165 L156 198 L132 198 Z" fill="url(#jacketB)"/>
    <path d="M145 165 L145 198" stroke="#9a3412" stroke-width="2"/>

    <!-- Head & Face (Slightly tilted forward/surprised) -->
    <circle cx="148" cy="148" r="14" fill="#fcd34d"/>
    <!-- Hair (Short neat brown hair) -->
    <path d="M136 148 C136 140 142 134 152 134 C160 134 162 142 162 148 L158 148 C158 142 156 138 150 137 C142 137 139 142 139 148 Z" fill="#78350f"/>

    <!-- Facial Expression: Eyes wide, blinking in surprise -->
    <circle cx="142" cy="147" r="1.5" fill="#1e293b"/>
    <circle cx="146" cy="147" r="1.5" fill="#1e293b"/>
    <circle cx="144" cy="154" r="2" fill="#78350f"/>

    <!-- Arms (Gesturing / reacting to bump) -->
    <!-- Left arm reaching out -->
    <path d="M138 170 L126 174" fill="none" stroke="url(#jacketB)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="126" cy="174" r="4" fill="#fcd34d"/>

    <!-- Right arm holding a smartphone that slips / flies out -->
    <path d="M155 170 L168 178" fill="none" stroke="url(#jacketB)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="168" cy="178" r="4" fill="#fcd34d"/>
    <!-- Flying Phone -->
    <g transform="translate(175, 168) rotate(35)">
      <rect x="0" y="0" width="8" height="13" rx="1.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <rect x="1.5" y="2" width="5" height="9" fill="#38bdf8" opacity="0.8"/>
    </g>
  </g>

  <!-- FOREGROUND ATMOSPHERE / DEPTH ELEMENTS -->
  <!-- Soft bokeh lights in foreground (out of focus) -->
  <circle cx="45" cy="190" r="3" fill="#38bdf8" opacity="0.3" filter="url(#softGlow)"/>
  <circle cx="195" cy="220" r="4" fill="#fbbf24" opacity="0.2" filter="url(#softGlow)"/>
  <circle cx="110" cy="230" r="5" fill="#ec4899" opacity="0.2" filter="url(#softGlow)"/>
  <circle cx="25" cy="210" r="2" fill="#fef08a" opacity="0.4"/>

  <!-- Subtle vignette border for app container feel -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>