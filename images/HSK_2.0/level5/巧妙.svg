<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Effect for the Mechanism -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Wood/Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Metallic/Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="120" cy="110" r="90" fill="url(#glow)" />

  <!-- Environment / Desk Structure -->
  <path d="M 20 185 L 220 185 L 230 220 L 10 220 Z" fill="url(#deskGrad)" opacity="0.8" />
  <line x1="20" y1="185" x2="220" y2="185" stroke="#475569" stroke-width="2" />

  <!-- Background Props: Blueprint and Tools -->
  <g opacity="0.3" transform="translate(15, 20)">
    <!-- Mini blueprints -->
    <rect x="0" y="0" width="50" height="35" rx="3" fill="none" stroke="#38bdf8" stroke-dasharray="2,2" stroke-width="1.5" />
    <circle cx="25" cy="17" r="10" fill="none" stroke="#38bdf8" stroke-width="1" />
    <!-- Compass/Ruler -->
    <line x1="160" y1="10" x2="190" y2="40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <circle cx="175" cy="25" r="3" fill="#fbbf24" />
  </g>

  <!-- MAIN SUBJECT: Ingenious Mechanical Puzzle Box / Clever Contraption -->
  <g transform="translate(120, 115)">
    
    <!-- Shadow beneath mechanism -->
    <ellipse cx="0" cy="65" rx="55" ry="12" fill="#020617" opacity="0.6" />

    <!-- Outer Base Platform -->
    <path d="M -50 40 L 0 60 L 50 40 L 50 50 L 0 70 L -50 50 Z" fill="#334155" />
    <path d="M -50 25 L 0 45 L 50 25 L 50 40 L 0 60 L -50 40 Z" fill="#1e293b" />

    <!-- Rotating Interlocking Gears (Taitinh / Khéo léo detail) -->
    <!-- Large Gear Left -->
    <g transform="translate(-25, 5)">
      <circle cx="0" cy="0" r="22" fill="#475569" stroke="#64748b" stroke-width="2" />
      <!-- Gear Teeth representation -->
      <path d="M 0 -25 L 3 -22 L 3 -19 L -3 -19 L -3 -22 Z" fill="#64748b" />
      <path d="M 0 25 L 3 22 L 3 19 L -3 19 L -3 22 Z" fill="#64748b" />
      <path d="M -25 0 L -22 3 L -19 3 L -19 -3 L -22 -3 Z" fill="#64748b" />
      <path d="M 25 0 L 22 3 L 19 3 L 19 -3 L 22 -3 Z" fill="#64748b" />
      <circle cx="0" cy="0" r="8" fill="#0f172a" />
      <circle cx="0" cy="0" r="4" fill="url(#cyanGrad)" />
    </g>

    <!-- Medium Gear Right -->
    <g transform="translate(22, -10)">
      <circle cx="0" cy="0" r="16" fill="#475569" stroke="#64748b" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#0f172a" />
      <circle cx="0" cy="0" r="3" fill="url(#goldGrad)" />
    </g>

    <!-- Central Clever Mechanism Core -->
    <rect x="-18" y="-35" width="36" height="42" rx="6" fill="#334155" stroke="#64748b" stroke-width="2" />
    
    <!-- Sliding compartments/panels demonstrating "khéo léo" precision -->
    <rect x="-14" y="-30" width="12" height="18" rx="3" fill="url(#cyanGrad)" />
    <rect x="2" y="-30" width="12" height="12" rx="3" fill="url(#goldGrad)" />
    <rect x="2" y="-14" width="12" height="16" rx="3" fill="#64748b" />

    <!-- Pop-up Clever Element (Glowing magical/ingenious core) -->
    <path d="M 0 -65 L 12 -45 L -12 -45 Z" fill="url(#emeraldGrad)" />
    <circle cx="0" cy="-52" r="5" fill="#ffffff" />

    <!-- Floating Sparkles & Precision Accents (Action/Ingenuity) -->
    <g transform="translate(0, -15)">
      <!-- Left Sparkle -->
      <path d="M -35 -20 L -31 -28 L -23 -32 L -31 -36 L -35 -44 L -39 -36 L -47 -32 L -39 -28 Z" fill="#fbbf24" opacity="0.9" />
      <!-- Right Sparkle -->
      <path d="M 40 10 L 43 4 L 49 1 L 43 -2 L 40 -8 L 37 -2 L 31 1 L 37 4 Z" fill="#38bdf8" opacity="0.9" />
      <!-- Tiny accent dot -->
      <circle cx="-20" cy="35" r="2.5" fill="#34d399" />
      <circle cx="30" cy="30" r="2" fill="#fbbf24" />
    </g>

    <!-- Mechanical linkages / levers extending outward -->
    <path d="M -18 -10 L -42 5" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <circle cx="-42" cy="5" r="4" fill="url(#goldGrad)" />
    
    <path d="M 18 -5 L 38 15" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <circle cx="38" cy="15" r="4" fill="url(#emeraldGrad)" />
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="50" cy="80" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="190" cy="70" r="2" fill="#fbbf24" opacity="0.7" />
  <circle cx="70" cy="150" r="1" fill="#34d399" opacity="0.8" />
  <circle cx="175" cy="140" r="1.5" fill="#38bdf8" opacity="0.5" />

</svg>