<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="stealthTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Room -->
  <g id="room">
    <!-- Window with moonlight -->
    <circle cx="180" cy="80" r="60" fill="url(#moonGlow)" />
    <path d="M 140 40 L 210 50 L 210 120 L 140 110 Z" fill="#334155" opacity="0.4" />
    <rect x="145" y="45" width="60" height="65" rx="4" fill="url(#windowGlow)" stroke="#475569" stroke-width="2" />
    <line x1="175" y1="45" x2="175" y2="110" stroke="#475569" stroke-width="2" />
    <line x1="145" y1="77" x2="205" y2="77" stroke="#475569" stroke-width="2" />

    <!-- House Plants (Silhouette props) -->
    <path d="M 215 170 Q 225 150 215 130 Q 210 140 215 170 Z" fill="#0f766e" opacity="0.6" />
    <path d="M 220 170 Q 240 155 235 135 Q 225 145 220 170 Z" fill="#14b8a6" opacity="0.5" />
    <!-- Plant pot -->
    <path d="M 205 170 L 225 170 L 220 195 L 210 195 Z" fill="#64748b" />

    <!-- Bookshelf in background -->
    <rect x="20" y="40" width="70" height="110" fill="#1e293b" opacity="0.5" />
    <line x1="20" y1="70" x2="90" y2="70" stroke="#334155" stroke-width="3" />
    <line x1="20" y1="105" x2="90" y2="105" stroke="#334155" stroke-width="3" />
    <!-- Books -->
    <rect x="28" y="50" width="10" height="20" rx="2" fill="#ef4444" opacity="0.6"/>
    <rect x="40" y="48" width="12" height="22" rx="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="54" y="53" width="8" height="17" rx="2" fill="#10b981" opacity="0.6"/>

    <!-- Wooden Floor / Rug -->
    <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#090d16" />
    <ellipse cx="120" cy="205" rx="90" ry="15" fill="#334155" opacity="0.3" />
  </g>

  <!-- Action Elements: "Quietly / Lặng lẽ" Motion Lines & Soft Notes -->
  <g id="stealth-fx">
    <!-- Soundless ripple waves (quiet bubbles) -->
    <path d="M 65 135 Q 75 130 85 135" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 55 145 Q 70 138 85 145" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 45 155 Q 65 145 85 155" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Stealth glowing motion trail -->
    <path d="M 75 165 C 100 160, 130 165, 150 160" fill="none" stroke="url(#stealthTrail)" stroke-width="6" stroke-linecap="round"/>

    <!-- Floating Zzz (softly sleeping / moving like a shadow) -->
    <text x="110" y="125" font-family="sans-serif" font-weight="bold" font-size="14" fill="#38bdf8" opacity="0.6">z</text>
    <text x="122" y="112" font-family="sans-serif" font-weight="bold" font-size="18" fill="#38bdf8" opacity="0.8">Z</text>
    <text x="138" y="98" font-family="sans-serif" font-weight="bold" font-size="22" fill="#38bdf8" opacity="0.4">z</text>
  </g>

  <!-- Main Subject: A cute ginger cat creeping/walking silently ("lặng lẽ") -->
  <g id="sneaking-cat" filter="url(#shadow)">
    <!-- Shadow under cat -->
    <ellipse cx="135" cy="182" rx="45" ry="8" fill="#020617" opacity="0.6" />

    <!-- Cat Body (Low, stealthy posture) -->
    <!-- Tail (curved up softly) -->
    <path d="M 85 170 C 70 160, 75 135, 90 130" fill="none" stroke="url(#catBody)" stroke-width="8" stroke-linecap="round" />
    <path d="M 89 131 C 93 129, 96 133, 93 137" fill="#fb923c" />

    <!-- Back leg (stepping forward) -->
    <path d="M 115 165 L 125 180 L 135 178" fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="136" cy="178" r="4" fill="#ea580c" />

    <!-- Front leg (creeping low) -->
    <path d="M 160 165 L 172 178 L 180 176" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="181" cy="176" r="4" fill="#c2410c" />

    <!-- Main Torso (stretched horizontally for stealth) -->
    <ellipse cx="140" cy="162" rx="32" ry="16" fill="url(#catBody)" />

    <!-- Back paws on ground -->
    <path d="M 105 165 L 110 180 L 118 178" fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stripes on body -->
    <path d="M 130 150 L 135 168" stroke="#c2410c" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M 145 148 L 148 166" stroke="#c2410c" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Head (pushed forward, focused eyes) -->
    <g transform="translate(168, 145)">
      <!-- Head base -->
      <circle cx="0" cy="0" r="17" fill="url(#catBody)" />

      <!-- Ears -->
      <polygon points="-12,-10 -17,-22 -3,-14" fill="#ea580c" />
      <polygon points="-11,-12 -15,-20 -5,-14" fill="#fdba74" />

      <polygon points="6,-10 14,-22 2,-15" fill="#ea580c" />
      <polygon points="7,-12 12,-20 3,-15" fill="#fdba74" />

      <!-- Cheeks/Fluff -->
      <circle cx="-8" cy="5" r="8" fill="#fb923c" />
      <circle cx="8" cy="5" r="8" fill="#fb923c" />

      <!-- Confident/Sneaky Closed/Slitted Eyes (Happy/Calm stealth) -->
      <path d="M 1 1 Q 5 6 9 1" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -9 1 Q -5 6 -1 1" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

      <!-- Tiny Nose & Mouth -->
      <polygon points="0,7 3,9 -3,9" fill="#f43f5e" />
      <path d="M 0 9 Q 0 13 -2 14" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 0 9 Q 0 13 2 14" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

      <!-- Whiskers -->
      <line x1="-14" y1="8" x2="-24" y2="6" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      <line x1="-14" y1="11" x2="-25" y2="12" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      <line x1="14" y1="8" x2="24" y2="6" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      <line x1="14" y1="11" x2="25" y2="12" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    </g>
  </g>

  <!-- Foreground Atmospheric Particles / Dust motes floating softly in silence -->
  <g id="dust-motes">
    <circle cx="60" cy="90" r="1.5" fill="#fef08a" opacity="0.6" />
    <circle cx="95" cy="70" r="2" fill="#fef08a" opacity="0.4" />
    <circle cx="120" cy="110" r="1" fill="#38bdf8" opacity="0.7" />
    <circle cx="150" cy="85" r="2.5" fill="#fef08a" opacity="0.5" />
    <circle cx="35" cy="130" r="1.5" fill="#38bdf8" opacity="0.5" />
    <circle cx="195" cy="135" r="1" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Decorative App Frame Border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>