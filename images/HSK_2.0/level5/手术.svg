<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(120, 120)">
    <!-- Operating Table Base -->
    <path d="M-60 60 L60 60 L40 90 L-40 90 Z" fill="#334155"/>
    <rect x="-20" y="40" width="40" height="20" fill="#475569"/>
    
    <!-- Table Surface -->
    <rect x="-80" y="30" width="160" height="10" rx="2" fill="#94a3b8"/>
    
    <!-- Patient Outline (Abstracted) -->
    <ellipse cx="0" cy="15" rx="50" ry="15" fill="#e2e8f0"/>
    <circle cx="-35" cy="15" r="10" fill="#cbd5e1"/>
    
    <!-- Surgical Light -->
    <circle cx="0" cy="-60" r="35" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 4"/>
    <circle cx="0" cy="-60" r="25" fill="#fef3c7" opacity="0.2"/>
    <path d="M0 -25 L-10 -50 M0 -25 L10 -50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Surgical Tools -->
    <g transform="rotate(20 70 20)">
      <rect x="60" y="10" width="30" height="4" rx="2" fill="#38bdf8"/>
      <path d="M90 12 L100 8 L100 16 Z" fill="#38bdf8"/>
    </g>
    <g transform="rotate(-15 75 35)">
      <rect x="70" y="30" width="25" height="4" rx="2" fill="#10b981"/>
      <circle cx="95" cy="32" r="4" fill="#10b981"/>
    </g>
    
    <!-- Monitor/Pulse -->
    <rect x="-100" y="-90" width="60" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M-95 -70 L-80 -70 L-75 -80 L-70 -60 L-65 -70 L-50 -70" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Ambient Glows -->
    <circle cx="80" cy="-80" r="20" fill="#fb923c" opacity="0.15" filter="blur(10px)"/>
  </g>
</svg>