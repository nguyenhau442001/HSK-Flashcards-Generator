<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Skin Gradients -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd1b3"/>
      <stop offset="100%" stop-color="#e0ac82"/>
    </linearGradient>
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49b6d"/>
      <stop offset="100%" stop-color="#b07b53"/>
    </linearGradient>

    <!-- Nail Gradients (Showing 'long' healthy nail) -->
    <linearGradient id="nailGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <circle cx="120" cy="120" r="110" fill="url(#spotlight)"/>

  <!-- Ambient background props (Grooming kit elements) -->
  <g opacity="0.6">
    <!-- Little cosmetic jar -->
    <rect x="35" y="160" width="30" height="25" rx="6" fill="#334155"/>
    <rect x="30" y="155" width="40" height="8" rx="3" fill="#64748b"/>
    <path d="M40 155 L45 145 H65 L70 155 Z" fill="#38bdf8" opacity="0.8"/>

    <!-- Nail file in background -->
    <g transform="translate(160, 45) rotate(-25)">
      <rect x="0" y="0" width="12" height="70" rx="6" fill="#cbd5e1"/>
      <rect x="2" y="5" width="8" height="60" rx="4" fill="#94a3b8"/>
      <path d="M 6 10 L 6 60" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Sparkles indicating care/cleanliness -->
    <path d="M190 140 L193 148 L201 151 L193 154 L190 162 L187 154 L179 151 L187 148 Z" fill="#fbbf24"/>
    <path d="M50 70 L52 75 L57 77 L52 79 L50 84 L48 79 L43 77 L48 75 Z" fill="#fbbf24" transform="scale(0.7) translate(20, 10)"/>
  </g>

  <!-- MAIN ILLUSTRATION: Finger with a prominent, well-groomed long nail -->
  <g filter="url(#shadow)" transform="translate(15, 10)">
    
    <!-- Finger Base/Hand contour -->
    <path d="M 60 190 
             L 60 100 
             C 60 70, 75 50, 105 50 
             C 135 50, 150 70, 150 100 
             L 150 190 Z" 
          fill="url(#skinShadow)" />

    <path d="M 65 190 
             L 65 102 
             C 65 75, 78 55, 105 55 
             C 132 55, 145 75, 145 102 
             L 145 190 Z" 
          fill="url(#skinGrad)" />

    <!-- Finger Joint Creases (adds realism) -->
    <path d="M 72 140 Q 105 150 138 140" stroke="#d49b6d" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 75 165 Q 105 173 135 165" stroke="#d49b6d" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Fingertip Skin Cushion -->
    <ellipse cx="105" cy="75" rx="35" ry="20" fill="url(#skinGrad)" />

    <!-- NAIL BED & LONG NAIL (Focus on 甲 - móng tay) -->
    <!-- Nail background bed (pinkish) -->
    <path d="M 82 85 
             C 82 55, 128 55, 128 85 
             C 128 102, 82 102, 82 85 Z" 
          fill="#fda4af" />

    <!-- The actual long nail plate -->
    <path d="M 80 92
             C 78 60, 84 42, 105 38
             C 126 42, 132 60, 130 92
             C 130 98, 80 98, 80 92 Z" 
          fill="url(#nailGrad)" />

    <!-- Nail Lunula (White half-moon at the base) -->
    <path d="M 91 88 
             C 91 82, 119 82, 119 88
             C 119 92, 91 92, 91 88 Z" 
          fill="#ffffff" 
          opacity="0.85" />

    <!-- Glossy Highlight on Nail (emphasizing smooth, clean, long surface) -->
    <path d="M 93 48
             C 93 48, 97 75, 96 85" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.7" />

    <path d="M 101 44
             C 101 44, 103 60, 102 70" 
          stroke="#ffffff" 
          stroke-width="2" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.4" />

  </g>

  <!-- Foreground action elements (Nail clipper / polish accent floating nearby to give context) -->
  <g transform="translate(155, 110) rotate(15)" filter="url(#shadow)">
    <!-- Modern stylish nail clipper -->
    <rect x="0" y="0" width="18" height="55" rx="9" fill="#e2e8f0"/>
    <rect x="3" y="5" width="12" height="45" rx="6" fill="#38bdf8"/>
    <!-- Clipper lever accent -->
    <circle cx="9" cy="18" r="4" fill="#0f172a"/>
    <path d="M9 18 L9 45" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkle near the long nail to draw attention -->
  <g transform="translate(125, 45)">
    <path d="M 0 12 
             Q 0 0, 12 0 
             Q 0 0, 0 -12 
             Q 0 0, -12 0 
             Q 0 0, 0 12 Z" 
          fill="#38bdf8" />
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(70, 75) scale(0.6)">
    <path d="M 0 12 
             Q 0 0, 12 0 
             Q 0 0, 0 -12 
             Q 0 0, -12 0 
             Q 0 0, 0 12 Z" 
          fill="#fbbf24" />
  </g>

</svg>