<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- Group of hands reaching for a central puzzle piece -->
  <g transform="translate(120, 140)">
    <!-- Hand 1 -->
    <path d="M-60 -20 C-80 -40 -70 -70 -50 -80 L-40 -60 Z" fill="#f59e0b"/>
    <!-- Hand 2 -->
    <path d="M60 -20 C80 -40 70 -70 50 -80 L40 -60 Z" fill="#38bdf8"/>
    <!-- Hand 3 -->
    <path d="M-20 -80 C-10 -110 10 -110 20 -80 L0 -70 Z" fill="#10b981"/>
    <!-- Hand 4 -->
    <path d="M20 0 C40 10 60 0 50 -20 L30 -10 Z" fill="#ec4899"/>
  </g>

  <!-- Central Puzzle Piece -->
  <path d="M105 100 L135 100 L135 130 L105 130 Z" fill="#fbbf24" stroke="#0f172a" stroke-width="4"/>
  <circle cx="120" cy="115" r="8" fill="#0f172a"/>

  <!-- Atmospheric elements -->
  <circle cx="40" cy="40" r="3" fill="#fb923c" opacity="0.6"/>
  <circle cx="200" cy="60" r="4" fill="#38bdf8" opacity="0.4"/>
  <circle cx="180" cy="30" r="2" fill="#ffffff" opacity="0.2"/>
  
  <!-- Decorative connection lines -->
  <path d="M40 150 L80 120" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M200 150 L160 120" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
</svg>