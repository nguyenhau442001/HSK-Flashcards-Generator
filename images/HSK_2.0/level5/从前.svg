<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Magic/Ancient Aura Gradient -->
    <radialGradient id="ancientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Scroll Paper Gradient -->
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Vignette / Shadow -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.7" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Atmospheric Magical Aura in Background -->
  <circle cx="120" cy="110" r="90" fill="url(#ancientGlow)" />

  <!-- Floating Ancient Runes / Sparkles (Representing "Once upon a time" / Past) -->
  <g fill="#fbbf24" opacity="0.6">
    <!-- Star 1 -->
    <path d="M70,50 L72,56 L78,58 L72,60 L70,66 L68,60 L62,58 L68,56 Z" transform="scale(0.8) translate(10, 10)" />
    <!-- Star 2 -->
    <path d="M170,70 L171.5,74 L175,75.5 L171.5,77 L170,81 L168.5,77 L165,75.5 L168.5,74 Z" transform="scale(1)" />
    <!-- Star 3 -->
    <path d="M50,130 L51.5,134 L55,135.5 L51.5,137 L50,141 L48.5,137 L45,135.5 L48.5,134 Z" transform="scale(1.2) translate(-5, -5)" />
    <!-- Clock/Time Symbol (Hourglass abstract circles) -->
    <circle cx="185" cy="140" r="3" fill="#38bdf8" opacity="0.5" />
    <circle cx="55" cy="80" r="2" fill="#38bdf8" opacity="0.5" />
  </g>

  <!-- Stylized Sun / Moon (Time passing symbol) -->
  <circle cx="120" cy="110" r="65" fill="#f59e0b" opacity="0.1" />

  <!-- ENVIRONMENT: Mysterious Ancient Temple Ruins / Pedestal -->
  <!-- Base stone platform -->
  <ellipse cx="120" cy="180" rx="75" ry="25" fill="#0f172a" />
  <path d="M45,170 C45,190 195,190 195,170 L185,155 C185,170 55,170 55,155 Z" fill="#334155" filter="url(#dropShadow)" />
  <ellipse cx="120" cy="155" rx="65" ry="18" fill="#475569" />

  <!-- Moss / Vines on Platform -->
  <path d="M60,165 Q70,175 80,168 T100,172" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <path d="M160,162 Q168,172 178,165" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

  <!-- MAIN SUBJECT: The Ancient Scroll (representing "长篇历史/从前" - Tales of the Past) -->
  <g filter="url(#dropShadow)" transform="translate(0, 5)">
    <!-- Scroll Back Roller (Right) -->
    <rect x="155" y="90" width="16" height="70" rx="8" fill="url(#woodGrad)" />
    <ellipse cx="163" cy="90" rx="8" ry="3" fill="#d97706" />
    <ellipse cx="163" cy="160" rx="8" ry="3" fill="#92400e" />

    <!-- Scroll Back Roller (Left) -->
    <rect x="69" y="90" width="16" height="70" rx="8" fill="url(#woodGrad)" />
    <ellipse cx="77" cy="90" rx="8" ry="3" fill="#d97706" />
    <ellipse cx="77" cy="160" rx="8" ry="3" fill="#92400e" />

    <!-- Scroll Paper Body -->
    <path d="M77,93 C95,88 145,88 163,93 L163,157 C145,162 95,162 77,157 Z" fill="url(#scrollGrad)" />

    <!-- Inner Shadow for Rolled effect -->
    <path d="M77,93 C85,93 85,157 77,157 Z" fill="#d97706" opacity="0.3" />
    <path d="M163,93 C155,93 155,157 163,157 Z" fill="#92400e" opacity="0.3" />

    <!-- Ancient Mountain & Landscape Illustration ON the Scroll (Visualizing "Long Ago/Tales") -->
    <g opacity="0.75" transform="translate(0, 3)">
      <!-- Little distant sun -->
      <circle cx="120" cy="112" r="8" fill="#f59e0b" />
      <!-- Mountain Range 1 (Back) -->
      <path d="M90,135 L105,115 L120,130 L138,108 L152,135 Z" fill="#d97706" opacity="0.4" />
      <!-- Mountain Range 2 (Front) -->
      <path d="M82,140 L98,125 L112,142 L130,122 L158,140 Z" fill="#b45309" opacity="0.6" />
      <!-- Abstract Ancient Pagoda / Temple silhouette -->
      <path d="M118,120 L122,120 L123,130 L117,130 Z" fill="#78350f" />
      <path d="M115,130 L125,130 L127,132 L113,132 Z" fill="#78350f" />
      <path d="M112,132 L128,132 L130,135 L110,135 Z" fill="#78350f" />
      <!-- River / Path flowing -->
      <path d="M120,135 Q125,140 135,142" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Glowing Magical Ribbon / Seal flowing around the scroll -->
    <path d="M60,110 C80,130 100,80 120,115 C140,150 160,100 180,125" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#dropShadow)" />
    <path d="M65,125 C85,145 105,95 125,130 C145,165 165,115 185,140" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Floating Sparkles / Magic Particles around the scroll -->
  <g fill="#38bdf8">
    <circle cx="95" cy="75" r="3" opacity="0.8" />
    <circle cx="145" cy="165" r="2.5" opacity="0.9" />
    <circle cx="175" cy="95" r="2" opacity="0.7" />
    <circle cx="65" cy="145" r="3.5" opacity="0.8" />
  </g>

  <!-- Glowing Embers / Fireflies (Atmospheric Depth) -->
  <g fill="#f59e0b">
    <circle cx="110" cy="65" r="2" opacity="0.9" />
    <circle cx="135" cy="175" r="1.5" opacity="0.8" />
    <circle cx="85" cy="115" r="2" opacity="0.6" />
    <circle cx="155" cy="125" r="2.5" opacity="0.7" />
  </g>

  <!-- Foreground Vignette for dramatic framing -->
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none" />

  <!-- Subtle border outline -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>