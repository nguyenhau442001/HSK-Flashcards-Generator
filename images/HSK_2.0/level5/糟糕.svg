<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Rain and Atmosphere -->
  <g opacity="0.6">
    <line x1="40" y1="0" x2="20" y2="240" stroke="#38bdf8" stroke-width="1"/>
    <line x1="100" y1="0" x2="80" y2="240" stroke="#38bdf8" stroke-width="1"/>
    <line x1="160" y1="0" x2="140" y2="240" stroke="#38bdf8" stroke-width="1"/>
    <line x1="220" y1="0" x2="200" y2="240" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- The Broken Umbrella -->
  <g transform="translate(120, 140)">
    <!-- Handle -->
    <path d="M0 0 L0 40 Q0 50 10 50" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <!-- Broken Ribs -->
    <path d="M0 0 L-40 -20 M0 0 L40 -20 M0 0 L-20 -40 M0 0 L20 -40" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <!-- Torn Fabric -->
    <path d="M-40 -20 L-20 -40 L0 -10 Z" fill="#ec4899"/>
    <path d="M40 -20 L20 -40 L0 -10 Z" fill="#ec4899"/>
  </g>

  <!-- Puddle -->
  <ellipse cx="120" cy="210" rx="80" ry="20" fill="#0f172a" opacity="0.5"/>
  
  <!-- Droplets -->
  <circle cx="80" cy="180" r="3" fill="#38bdf8"/>
  <circle cx="160" cy="190" r="2" fill="#38bdf8"/>
  <circle cx="110" cy="200" r="4" fill="#38bdf8"/>

  <!-- Accents -->
  <circle cx="180" cy="40" r="15" fill="#f59e0b" opacity="0.2"/>
  <path d="M170 30 L190 50 M190 30 L170 50" stroke="#fbbf24" stroke-width="2"/>
</svg>