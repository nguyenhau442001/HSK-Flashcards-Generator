<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Lamp Glow -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.15" filter="blur(20px)"/>
  
  <!-- Bicycle -->
  <g transform="translate(40, 120)">
    <circle cx="30" cy="40" r="25" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="130" cy="40" r="25" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <path d="M30 40 L80 40 L130 40 M80 40 L60 10 L100 10 L80 40" stroke="#94a3b8" stroke-width="4" fill="none"/>
  </g>

  <!-- Thief Figure -->
  <g transform="translate(110, 80)">
    <!-- Body -->
    <path d="M20 60 L40 60 L35 110 L25 110 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="30" cy="45" r="15" fill="#f8fafc"/>
    <!-- Mask -->
    <rect x="18" y="42" width="24" height="6" fill="#0f172a"/>
    <!-- Action Arm -->
    <path d="M40 70 L70 90" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand grabbing bike -->
    <circle cx="75" cy="95" r="8" fill="#fbbf24"/>
  </g>

  <!-- Motion Lines -->
  <path d="M140 100 Q160 90 180 100" stroke="#fb923c" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Shadow -->
  <ellipse cx="120" cy="210" rx="80" ry="10" fill="#000" opacity="0.3"/>
</svg>