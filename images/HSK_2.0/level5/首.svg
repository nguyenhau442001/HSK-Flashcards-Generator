<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The Leader/Subject -->
  <g transform="translate(120, 140)">
    <!-- Suit Body -->
    <path d="M-30 0 L30 0 L25 60 L-25 60 Z" fill="#475569"/>
    <!-- Tie -->
    <path d="M-5 0 L5 0 L2 40 L-2 40 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="-45" r="35" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-30 -55 C-30 -85 30 -85 30 -55 C30 -70 15 -80 0 -80 C-15 -80 -30 -70 -30 -55" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="-20" y="-55" width="15" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="5" y="-55" width="15" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="-5" y1="-50" x2="5" y2="-50" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Context Props: Microphone and Podium -->
  <rect x="70" y="170" width="100" height="70" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M120 170 L120 140" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="120" cy="135" r="8" fill="#fbbf24"/>
  
  <!-- Atmospheric Accents -->
  <circle cx="40" cy="40" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="60" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="180" cy="20" r="2" fill="#ec4899" opacity="0.6"/>
  
  <!-- Spotlight Glow -->
  <path d="M80 0 L160 0 L200 240 L40 240 Z" fill="url(#grad)" opacity="0.05"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>