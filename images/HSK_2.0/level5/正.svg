<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Table -->
    <rect x="0" y="100" width="160" height="15" rx="4" fill="#475569"/>
    <rect x="20" y="115" width="10" height="40" fill="#334155"/>
    <rect x="130" y="115" width="10" height="40" fill="#334155"/>
    
    <!-- Bowl -->
    <path d="M30 80 Q30 110 70 110 Q110 110 110 80 Z" fill="#fb923c"/>
    <path d="M35 85 Q70 105 105 85" stroke="#ea580c" stroke-width="3" fill="none"/>
    
    <!-- Chopsticks in action -->
    <rect x="110" y="40" width="4" height="60" rx="2" fill="#f59e0b" transform="rotate(-15 112 70)"/>
    <rect x="118" y="45" width="4" height="60" rx="2" fill="#f59e0b" transform="rotate(10 120 75)"/>
    
    <!-- Steam/Action lines -->
    <path d="M70 70 Q80 50 75 30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M85 75 Q95 55 90 35" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Plate/Side -->
    <circle cx="140" cy="95" r="20" fill="#10b981"/>
    <circle cx="140" cy="95" r="12" fill="#059669"/>
    
    <!-- Ambient glow -->
    <circle cx="70" cy="80" r="40" fill="#fbbf24" opacity="0.1"/>
  </g>
</svg>