<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- The "Repeated Action" Subject: A stack of sticky notes and a finger pointing -->
  <!-- Stack of notes -->
  <rect x="140" y="130" width="60" height="40" rx="4" fill="#fbbf24"/>
  <rect x="145" y="125" width="60" height="40" rx="4" fill="#f59e0b"/>
  <rect x="150" y="120" width="60" height="40" rx="4" fill="#fb923c"/>
  
  <!-- Finger pointing repeatedly (motion blur effect) -->
  <path d="M110 180 L140 140 L155 155 L125 195 Z" fill="#ec4899" opacity="0.3"/>
  <path d="M100 190 L130 150 L145 165 L115 205 Z" fill="#ec4899" opacity="0.6"/>
  <path d="M90 200 L120 160 L135 175 L105 215 Z" fill="#ec4899"/>
  <circle cx="120" cy="160" r="12" fill="#ec4899"/>
  
  <!-- Clock showing time passage -->
  <circle cx="60" cy="60" r="35" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <line x1="60" y1="60" x2="60" y2="35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="85" y2="60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative elements to imply repetition -->
  <circle cx="180" cy="60" r="5" fill="#10b981"/>
  <circle cx="195" cy="75" r="5" fill="#10b981"/>
  <circle cx="210" cy="90" r="5" fill="#10b981"/>
  
  <!-- Coffee cup for context -->
  <rect x="30" y="170" width="30" height="35" rx="4" fill="#64748b"/>
  <path d="M60 175 Q70 175 70 185 Q70 195 60 195" stroke="#64748b" stroke-width="4" fill="none"/>
</svg>