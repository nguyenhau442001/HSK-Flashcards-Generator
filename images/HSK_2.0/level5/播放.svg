<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- TV Set -->
  <rect x="40" y="60" width="160" height="110" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="50" y="70" width="140" height="90" rx="4" fill="#0f172a"/>
  
  <!-- Screen Content: News Broadcast Visuals -->
  <rect x="60" y="85" width="40" height="30" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="110" y="85" width="70" height="10" rx="1" fill="#f1f5f9" opacity="0.6"/>
  <rect x="110" y="100" width="50" height="10" rx="1" fill="#f1f5f9" opacity="0.4"/>
  
  <!-- Sound Waves/Signal -->
  <path d="M185 115 C 195 115 200 120 200 130 C 200 140 195 145 185 145" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <path d="M192 105 C 210 105 220 115 220 130 C 220 145 210 155 192 155" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- TV Stand -->
  <rect x="90" y="170" width="60" height="10" fill="#475569"/>
  <rect x="115" y="180" width="10" height="10" fill="#334155"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="15" fill="#ec4899" opacity="0.2"/>
  <circle cx="30" cy="200" r="20" fill="#10b981" opacity="0.15"/>
  
  <!-- Remote Control -->
  <rect x="170" y="180" width="20" height="50" rx="4" fill="#fb923c"/>
  <circle cx="180" cy="195" r="3" fill="#0f172a"/>
  <circle cx="180" cy="210" r="3" fill="#0f172a"/>
</svg>