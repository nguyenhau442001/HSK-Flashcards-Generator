<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Field Gradients -->
    <linearGradient id="farField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="midField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="closeField" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Tractor Color Gradients -->
    <linearGradient id="tractorBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="tractorTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Sun/Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Glow & Sun -->
  <circle cx="180" cy="70" r="60" fill="url(#sunGlow)"/>
  <circle cx="180" cy="70" r="18" fill="#fbbf24"/>

  <!-- Background Hills & Terraced Fields -->
  <path d="M0 110 Q 70 90, 140 110 T 240 100 L 240 240 L 0 240 Z" fill="url(#farField)"/>
  <path d="M0 135 Q 90 120, 180 140 T 240 130 L 240 240 L 0 240 Z" fill="url(#midField)"/>

  <!-- Agricultural Rows in Foreground -->
  <path d="M -20 240 Q 60 160, 130 185 T 260 170 L 260 240 Z" fill="url(#closeField)"/>
  
  <!-- Crop Rows (Perspective Lines) -->
  <path d="M 40 240 Q 75 185, 100 190" stroke="#047857" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 80 240 Q 105 188, 130 192" stroke="#047857" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 120 240 Q 135 190, 160 195" stroke="#047857" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Detailed Sprouts in Foreground -->
  <!-- Sprout cluster 1 -->
  <g transform="translate(45, 195)">
    <path d="M0 10 Q -4 -5, -10 -8 Q -2 0, 0 10" fill="#38bdf8"/>
    <path d="M0 10 Q 4 -5, 10 -8 Q 2 0, 0 10" fill="#38bdf8"/>
  </g>
  <!-- Sprout cluster 2 -->
  <g transform="translate(75, 205)">
    <path d="M0 8 Q -3 -4, -8 -6 Q -1 0, 0 8" fill="#38bdf8"/>
    <path d="M0 8 Q 3 -4, 8 -6 Q 1 0, 0 8" fill="#38bdf8"/>
  </g>
  <!-- Sprout cluster 3 -->
  <g transform="translate(110, 212)">
    <path d="M0 6 Q -2 -3, -6 -5 Q -1 0, 0 6" fill="#38bdf8"/>
    <path d="M0 6 Q 2 -3, 6 -5 Q 1 0, 0 6" fill="#38bdf8"/>
  </g>

  <!-- Barn & Silo in Background (Left) -->
  <g transform="translate(20, 75)">
    <!-- Silo -->
    <rect x="0" y="15" width="16" height="40" rx="4" fill="#64748b"/>
    <path d="M -2 15 Q 8 2, 18 15 Z" fill="#94a3b8"/>
    <!-- Barn -->
    <rect x="18" y="25" width="35" height="30" fill="#ef4444"/>
    <polygon points="15,25 35,5 56,25" fill="#b91c1c"/>
    <rect x="30" y="40" width="10" height="15" rx="2" fill="#334155"/>
  </g>

  <!-- Modern Tractor (Action Subject) -->
  <g transform="translate(100, 120)">
    <!-- Back Wheel -->
    <circle cx="20" cy="35" r="16" fill="#0f172a"/>
    <circle cx="20" cy="35" r="12" fill="#334155"/>
    <circle cx="20" cy="35" r="4" fill="#94a3b8"/>
    
    <!-- Front Wheel -->
    <circle cx="65" cy="39" r="10" fill="#0f172a"/>
    <circle cx="65" cy="39" r="7" fill="#334155"/>
    <circle cx="65" cy="39" r="2.5" fill="#94a3b8"/>

    <!-- Tractor Body Chasis -->
    <path d="M 15 25 L 55 25 L 65 35 L 10 35 Z" fill="url(#tractorBody)"/>
    
    <!-- Engine/Hood -->
    <rect x="45" y="15" width="25" height="15" rx="3" fill="url(#tractorBody)"/>
    <path d="M 60 15 L 72 18 L 72 25 L 60 25 Z" fill="#cbd5e1" opacity="0.8"/> <!-- Grill -->

    <!-- Cab/Roof -->
    <path d="M 20 5 L 45 5 L 50 25 L 15 25 Z" fill="url(#tractorTop)"/>
    <!-- Windshield -->
    <polygon points="23,7 43,7 48,23 18,23" fill="#38bdf8" opacity="0.7"/>
    
    <!-- Steering Wheel & Seat hint -->
    <circle cx="30" cy="15" r="3" fill="#0f172a"/>
    <rect x="22" y="16" width="4" height="6" fill="#0f172a" rx="1"/>

    <!-- Exhaust Pipe -->
    <rect x="58" y="4" width="3" height="12" fill="#64748b"/>
    <!-- Exhaust Smoke -->
    <circle cx="60" cy="-2" r="3" fill="#cbd5e1" opacity="0.7"/>
    <circle cx="63" cy="-8" r="5" fill="#cbd5e1" opacity="0.5"/>
    <circle cx="67" cy="-15" r="7" fill="#cbd5e1" opacity="0.3"/>
  </g>

  <!-- Flying Bird Accents (Adds life and scale) -->
  <path d="M 60 40 Q 65 33, 70 40 Q 75 33, 80 40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 75 52 Q 78 47, 82 52 Q 86 47, 90 52" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 45 55 Q 48 50, 52 55 Q 56 50, 60 55" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Foreground Framed Elements (Leaves/Vines overlay for depth) -->
  <path d="M0 220 Q 15 200, 30 240 Z" fill="#059669"/>
  <path d="M240 200 Q 220 180, 200 240 Z" fill="#047857"/>

  <!-- Golden Harvest Accents (Wheat stalks on right) -->
  <g transform="translate(210, 160)">
    <path d="M0 50 Q -5 20, 0 0" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="-4" cy="10" rx="3" ry="5" fill="#f59e0b" transform="rotate(-20 -4 10)"/>
    <ellipse cx="2" cy="18" rx="3" ry="5" fill="#f59e0b" transform="rotate(20 2 18)"/>
    <ellipse cx="-6" cy="28" rx="3" ry="5" fill="#f59e0b" transform="rotate(-25 -6 28)"/>
    <ellipse cx="3" cy="38" rx="3" ry="5" fill="#f59e0b" transform="rotate(15 3 38)"/>
  </g>  
  <g transform="translate(195, 175)">
    <path d="M0 40 Q 5 15, 0 0" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="3" cy="8" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(15 3 8)"/>
    <ellipse cx="-3" cy="18" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(-15 -3 18)"/>
    <ellipse cx="2" cy="28" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(20 2 28)"/>
  </g>
</svg>