<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1e293b"/>

  <!-- Floor -->
  <rect x="0" y="150" width="240" height="90" fill="#182335"/>

  <!-- Wall detail / subtle gradient -->
  <linearGradient id="wallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#2a3b52"/>
    <stop offset="100%" stop-color="#223044"/>
  </linearGradient>
  <rect x="0" y="0" width="240" height="150" fill="url(#wallGradient)"/>

  <!-- Window in background -->
  <rect x="180" y="50" width="40" height="60" rx="4" fill="#0f172a"/>
  <rect x="182" y="52" width="36" height="56" rx="2" fill="#1a2438"/>
  <path d="M182 80 H218 M200 52 V108" stroke="#0f172a" stroke-width="2"/>

  <!-- Sofa -->
  <rect x="30" y="120" width="180" height="70" rx="10" fill="#334a6d"/>
  <rect x="35" y="115" width="170" height="50" rx="8" fill="#475569"/>
  <rect x="30" y="170" width="180" height="20" rx="10" fill="#2a3b52"/>

  <!-- Lamp -->
  <circle cx="20" cy="100" r="8" fill="#fbbf24"/>
  <path d="M20 108 V150" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M15 150 H25" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <path d="M20 100 C25 90, 30 80, 20 75 C10 80, 15 90, 20 100 Z" fill="#f59e0b" opacity="0.8"/>

  <!-- Family members on the sofa -->
  <!-- Father -->
  <rect x="45" y="90" width="40" height="60" rx="8" fill="#38bdf8"/>
  <circle cx="65" cy="80" r="15" fill="#fbd38d"/>
  <path d="M55 100 Q65 95, 75 100" stroke="#fbd38d" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Mother -->
  <rect x="95" y="95" width="40" height="55" rx="8" fill="#ec4899"/>
  <circle cx="115" cy="85" r="15" fill="#fbcfe8"/>
  <path d="M105 105 Q115 100, 125 105" stroke="#fbcfe8" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Child -->
  <rect x="145" y="105" width="30" height="45" rx="6" fill="#10b981"/>
  <circle cx="160" cy="98" r="12" fill="#fbd38d"/>
  <path d="M153 110 Q160 107, 167 110" stroke="#fbd38d" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Book -->
  <rect x="120" y="135" width="25" height="20" rx="3" fill="#fb923c" transform="rotate(5 120 135)"/>
  <rect x="122" y="136" width="20" height="18" rx="2" fill="#f59e0b" transform="rotate(5 120 135)"/>

  <!-- Subtle glow from lamp -->
  <defs>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="120" r="80" fill="url(#lampGlow)"/>

</svg>