<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Park Environment -->
  <circle cx="120" cy="280" r="150" fill="#1e293b" opacity="0.3"/>
  <path d="M0 180 Q120 160 240 180 L240 240 L0 240 Z" fill="#0f172a"/>
  
  <!-- Golden Morning Light -->
  <circle cx="180" cy="60" r="30" fill="#f59e0b" opacity="0.2"/>
  <circle cx="180" cy="60" r="20" fill="#fbbf24" opacity="0.4"/>
  
  <!-- Taiji Practitioner -->
  <g transform="translate(120, 140)">
    <!-- Legs -->
    <path d="M-20 0 L-35 40 M20 0 L35 40" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Torso -->
    <path d="M0 -40 L0 10" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>
    <!-- Arms in Taiji flow -->
    <path d="M-30 -20 Q-50 -10 -30 0" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M30 -20 Q50 -10 30 0" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Head -->
    <circle cx="0" cy="-55" r="12" fill="#fef3c7"/>
  </g>
  
  <!-- Atmospheric Details -->
  <path d="M40 200 Q60 190 80 200" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M160 210 Q180 200 200 210" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="50" cy="190" r="2" fill="#fbbf24"/>
  <circle cx="190" cy="200" r="2" fill="#fbbf24"/>
</svg>