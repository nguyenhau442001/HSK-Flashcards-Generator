<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle atmospheric depth -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="desk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="screen-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="screen-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient background glow -->
  <circle cx="120" cy="130" r="90" fill="url(#desk-glow)"/>

  <!-- Wooden/Modern Desk Surface -->
  <path d="M 20 185 L 220 185 L 235 225 L 5 225 Z" fill="#090d16" opacity="0.6"/>
  <rect x="15" y="180" width="210" height="8" rx="4" fill="#334155"/>

  <!-- BACKDROP PROP: Digital Inspection / Comparison Station -->
  <!-- Main Display Screens frame -->
  <rect x="45" y="55" width="70" height="75" rx="6" fill="#475569"/>
  <rect x="125" y="55" width="70" height="75" rx="6" fill="#475569"/>

  <!-- Screen 1 (Left Product Data) -->
  <rect x="49" y="59" width="62" height="67" rx="4" fill="url(#screen-grad-1)"/>
  <circle cx="80" cy="80" r="14" fill="#bae6fd" opacity="0.9"/>
  <!-- UI data lines inside screen 1 -->
  <rect x="57" y="102" width="46" height="4" rx="2" fill="#7dd3fc"/>
  <rect x="57" y="110" width="30" height="4" rx="2" fill="#e0f2fe"/>

  <!-- Screen 2 (Right Product Data) -->
  <rect x="129" y="59" width="62" height="67" rx="4" fill="url(#screen-grad-2)"/>
  <path d="M 160 68 L 170 85 L 150 85 Z" fill="#a7f3d0" opacity="0.9"/>
  <!-- UI data lines inside screen 2 -->
  <rect x="137" y="102" width="46" height="4" rx="2" fill="#6ee7b7"/>
  <rect x="137" y="110" width="36" height="4" rx="2" fill="#ecfdf5"/>

  <!-- Stands for screens -->
  <path d="M 70 130 L 70 148 L 55 148 L 55 152 L 85 152 L 85 148 L 70 148 Z" fill="#64748b"/>
  <path d="M 170 130 L 170 148 L 155 148 L 155 152 L 185 152 L 185 148 L 170 148 Z" fill="#64748b"/>

  <!-- FOREGROUND: Physical Objects being compared (Product A & Product B) -->
  <!-- Product A (Left - Sleek blue container/device) -->
  <rect x="62" y="145" width="36" height="38" rx="8" fill="#38bdf8"/>
  <rect x="68" y="152" width="24" height="18" rx="4" fill="#0284c7"/>
  <circle cx="80" cy="161" r="5" fill="#f8fafc" opacity="0.8"/>

  <!-- Product B (Right - Vibrant orange/amber container/device variant) -->
  <rect x="142" y="142" width="36" height="41" rx="8" fill="#fbbf24"/>
  <rect x="148" y="148" width="24" height="22" rx="4" fill="#f59e0b"/>
  <!-- Indicator lights -->
  <circle cx="154" cy="176" r="2" fill="#ef4444"/>
  <circle cx="160" cy="176" r="2" fill="#10b981"/>

  <!-- CENTRAL ACTION ELEMENT: The Magnifying / Comparison Lens ("Contrast/Compare" tool) -->
  <g transform="translate(120, 130)">
    <!-- Lens Glow Backdrop -->
    <circle cx="0" cy="0" r="34" fill="#0f172a" opacity="0.8"/>
    
    <!-- Optical Glass Lens Area -->
    <circle cx="0" cy="0" r="30" fill="url(#lens-grad)" stroke="#f8fafc" stroke-width="4"/>
    
    <!-- Dynamic Split/Comparison Line inside lens -->
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 3"/>

    <!-- Lens Handle angled diagonally downwards-right -->
    <path d="M 21 21 L 42 42" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <path d="M 21 21 L 42 42" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Handle Grip End -->
    <circle cx="43" cy="43" r="5" fill="#334155"/>
  </g>

  <!-- ACTION & ANALYSIS ACCENTS (Floating metrics / spark elements) -->
  <!-- Check/Match indicator (Green) -->
  <circle cx="195" cy="100" r="10" fill="#10b981"/>
  <path d="M 191 100 L 194 103 L 199 97" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Difference indicator (Amber/Orange warning style) -->
  <circle cx="45" cy="100" r="10" fill="#f97316"/>
  <path d="M 45 95 L 45 101 M 45 105 L 45 105.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Glowing atmospheric highlight particles -->
  <circle cx="105" cy="115" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="135" cy="115" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="120" cy="85" r="2.5" fill="#f8fafc" opacity="0.7"/>

  <!-- Dynamic scan/focus beams -->
  <path d="M 96 115 L 120 130" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="2 2"/>
  <path d="M 144 115 L 120 130" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" stroke-dasharray="2 2"/>
</svg>