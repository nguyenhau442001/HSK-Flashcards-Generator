<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wind Swirl Gradient -->
    <linearGradient id="windGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    
    <linearGradient id="windGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Street Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    
    <!-- Window Light -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Umbrella Gradient -->
    <linearGradient id="umbrellaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Base Background -->
    <rect width="240" height="240" fill="url(#bgGrad)" />

    <!-- Ambient Light / Streetlamp Glow Background -->
    <circle cx="180" cy="80" r="90" fill="url(#lampGlow)" />

    <!-- Distant Cityscape / Architecture Silhouette -->
    <path d="M0 200 L0 150 L25 150 L25 130 L45 130 L45 200 L90 200 L90 110 L120 110 L120 200 L170 200 L170 140 L190 140 L190 200 L240 200 L240 240 L0 240 Z" fill="#131e32" />
    
    <!-- Warm Lit Building Windows -->
    <rect x="55" y="145" width="12" height="18" rx="2" fill="url(#windowGlow)" opacity="0.8" />
    <rect x="72" y="145" width="12" height="18" rx="2" fill="url(#windowGlow)" opacity="0.8" />
    <rect x="55" y="170" width="12" height="18" rx="2" fill="url(#windowGlow)" opacity="0.4" />
    
    <rect x="130" y="125" width="14" height="22" rx="2" fill="url(#windowGlow)" opacity="0.9" />
    <rect x="150" y="125" width="14" height="22" rx="2" fill="url(#windowGlow)" opacity="0.5" />

    <!-- Street Lamp Post & Fixture -->
    <path d="M195 240 L195 80 L205 75 L205 70 L195 73 L195 65 L185 65 L185 240 Z" fill="#0b1324" />
    <path d="M185 60 L210 60 L205 70 L190 70 Z" fill="#d97706" />
    <ellipse cx="197" cy="72" rx="8" ry="4" fill="#fbbf24" />

    <!-- Dynamic Wind Gust Lines (Background layer) -->
    <path d="M-20 70 Q 60 40, 140 90" stroke="url(#windGrad1)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M10 110 Q 90 90, 180 130" stroke="url(#windGrad1)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M-10 150 Q 70 130, 150 170" stroke="url(#windGrad2)" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Flying Leaves & Debris -->
    <g fill="#10b981">
      <path d="M 60 70 Q 70 65, 75 75 Q 65 80, 60 70 Z" transform="rotate(35 67 72)" />
      <path d="M 120 100 Q 128 95, 132 105 Q 124 110, 120 100 Z" transform="rotate(-40 126 102)" fill="#fb923c" />
      <path d="M 170 85 Q 176 80, 180 88 Q 174 93, 170 85 Z" transform="rotate(15 175 86)" fill="#f59e0b" />
      <path d="M 40 135 Q 46 130, 50 138 Q 44 142, 40 135 Z" transform="rotate(65 45 136)" fill="#38bdf8" opacity="0.7"/>
    </g>

    <!-- Ground Pavement / Street -->
    <rect x="0" y="200" width="240" height="40" fill="#090d16" />
    <line x1="0" y1="205" x2="240" y2="205" stroke="#1e293b" stroke-width="2" />
    <line x1="0" y1="225" x2="240" y2="225" stroke="#131e32" stroke-width="1" stroke-dasharray="8 6" />

    <!-- Main Character Struggling Against Wind -->
    <g transform="translate(90, 115)">
      <!-- Bent Legs (Walking/Bracing against wind) -->
      <!-- Back Leg -->
      <path d="M 25 55 L 10 85 L 0 85" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Front Leg -->
      <path d="M 35 55 L 45 85 L 55 85" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <!-- Shoes -->
      <ellipse cx="-3" cy="86" rx="6" ry="3" fill="#0f172a" />
      <ellipse cx="57" cy="86" rx="6" ry="3" fill="#0f172a" />

      <!-- Torso (Lean Forward into Wind) -->
      <path d="M 15 15 L 35 20 L 25 60 L 10 55 Z" fill="#6366f1" />
      
      <!-- Backpack -->
      <rect x="-3" y="22" width="14" height="28" rx="4" fill="#fb923c" />

      <!-- Scarf Blowing Fiercely Backward -->
      <path d="M 32 18 Q 60 10, 90 25 Q 70 30, 35 25 Z" fill="#ec4899" />
      
      <!-- Head (Tilted Forward) -->
      <circle cx="35" cy="12" r="12" fill="#fcd34d" />
      <!-- Hair blowing back -->
      <path d="M 25 5 Q 40 -2, 48 8 Q 42 12, 35 15 Z" fill="#475569" />

      <!-- Arms Holding Umbrella -->
      <!-- Back Arm holding pole -->
      <path d="M 28 30 L 48 35 L 55 25" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Front Arm -->
      <path d="M 22 28 L 42 38 L 48 45" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Bent/Warped Umbrella (Wind Effect) -->
      <g transform="translate(55, 15) rotate(-25)">
        <!-- Umbrella Pole -->
        <line x1="0" y1="-5" x2="0" y2="45" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
        <path d="M 0 45 Q -5 48, -2 52" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" />
        
        <!-- Umbrella Canopy (Deformed/Blown inside-out slightly or curved sharply) -->
        <path d="M -55 -10 Q 0 -35, 55 -10 Q 30 5, 0 -2 Q -30 5, -55 -10 Z" fill="url(#umbrellaGrad)" />
        <path d="M -55 -10 Q -25 -22, 0 -2 Q 25 -22, 55 -10 Q 30 5, 0 -2 Q -30 5, -55 -10 Z" fill="#db2777" />
        
        <!-- Umbrella Spoke Details -->
        <path d="M 0 -2 L 0 -32" stroke="#fbcfe8" stroke-width="2" opacity="0.6" />
        <path d="M 0 -2 L -50 -10" stroke="#fbcfe8" stroke-width="2" opacity="0.6" />
        <path d="M 0 -2 L 50 -10" stroke="#fbcfe8" stroke-width="2" opacity="0.6" />
        <path d="M 0 -2 L -25 -18" stroke="#fbcfe8" stroke-width="2" opacity="0.6" />
        <path d="M 0 -2 L 25 -18" stroke="#fbcfe8" stroke-width="2" opacity="0.6" />
        
        <!-- Umbrella Top Tip -->
        <circle cx="0" cy="-33" r="3" fill="#f43f5e" />
      </g>
    </g>

    <!-- Foreground Wind Streaks & Rain/Storm Elements -->
    <path d="M-10 40 Q 80 10, 190 60" stroke="url(#windGrad1)" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M20 190 Q 110 160, 240 180" stroke="url(#windGrad1)" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Rain / Wind-driven Droplets -->
    <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="30" y1="50" x2="15" y2="58" />
      <line x1="75" y1="30" x2="60" y2="38" />
      <line x1="130" y1="45" x2="115" y2="53" />
      <line x1="200" y1="95" x2="185" y2="103" />
      <line x1="50" y1="120" x2="35" y2="128" />
      <line x1="160" y1="140" x2="145" y2="148" />
      <line x1="100" y1="180" x2="85" y2="188" />
      <line x1="210" y1="160" x2="195" y2="168" />
    </g>

    <!-- Additional swirling wind accents near umbrella -->
    <path d="M 120 95 Q 135 85, 150 95 Q 165 105, 140 115" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 30 100 Q 50 85, 70 105" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5" />
    
    <!-- Vignette / Frame Border Overlay -->
    <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
  </g>
</svg>