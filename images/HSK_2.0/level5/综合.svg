<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- The 'Comprehensive' Project: A central hub connecting various elements -->
  <!-- Central Hub -->
  <circle cx="120" cy="120" r="35" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="120" cy="120" r="20" fill="#38bdf8"/>
  
  <!-- Connecting Lines -->
  <line x1="120" y1="85" x2="120" y2="50" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="155" y1="120" x2="190" y2="120" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="85" y1="120" x2="50" y2="120" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 4"/>
  
  <!-- Peripheral Elements representing synthesis -->
  <!-- Gear -->
  <circle cx="120" cy="40" r="12" fill="#fb923c"/>
  <rect x="117" y="25" width="6" height="30" fill="#fb923c"/>
  <rect x="105" y="37" width="30" height="6" fill="#fb923c"/>
  
  <!-- Document/Chart -->
  <rect x="190" y="105" width="30" height="30" rx="4" fill="#10b981"/>
  <rect x="195" y="110" width="20" height="4" fill="#ffffff" opacity="0.3"/>
  <rect x="195" y="118" width="15" height="4" fill="#ffffff" opacity="0.3"/>
  
  <!-- Lightbulb/Idea -->
  <path d="M35 120 A 15 15 0 0 1 65 120 L 60 135 L 40 135 Z" fill="#fbbf24"/>
  <circle cx="50" cy="110" r="8" fill="#fbbf24"/>
  
  <!-- Floating Particles -->
  <circle cx="160" cy="70" r="3" fill="#ec4899"/>
  <circle cx="80" cy="80" r="2" fill="#38bdf8"/>
  <circle cx="170" cy="160" r="4" fill="#fbbf24"/>
  <circle cx="70" cy="170" r="3" fill="#10b981"/>
