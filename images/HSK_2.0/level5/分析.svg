<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="140" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Detective/Analyst Figure (Upper Body) -->
  <path d="M70 180 Q70 120 100 100 L140 100 Q170 120 170 180 Z" fill="#64748b"/>
  <circle cx="120" cy="85" r="25" fill="#fde68a"/>
  
  <!-- Magnifying Glass -->
  <circle cx="140" cy="90" r="20" fill="none" stroke="#fbbf24" stroke-width="4"/>
  <rect x="155" y="105" width="30" height="6" rx="2" fill="#fbbf24" transform="rotate(45 155 105)"/>
  
  <!-- Data/Chart Elements -->
  <rect x="40" y="150" width="40" height="60" rx="4" fill="#1e293b"/>
  <rect x="45" y="190" width="30" height="10" fill="#38bdf8"/>
  <rect x="45" y="175" width="30" height="10" fill="#10b981"/>
  <rect x="45" y="160" width="30" height="10" fill="#ec4899"/>
  
  <!-- Document/Blueprint -->
  <rect x="100" y="155" width="80" height="60" rx="4" fill="#f1f5f9"/>
  <path d="M110 165 L170 165 M110 175 L150 175 M110 185 L160 185" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Analytical Glow/Nodes -->
  <circle cx="145" cy="165" r="4" fill="#fb923c"/>
  <circle cx="165" cy="185" r="4" fill="#fb923c"/>
  <line x1="145" y1="165" x2="165" y2="185" stroke="#fb923c" stroke-width="2" stroke-dasharray="2 2"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="85" r="40" fill="#fbbf24" opacity="0.05"/>
</svg>