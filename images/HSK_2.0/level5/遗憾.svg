<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="light-beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Shadow Definition -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT / SCENERY -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="8"/>
  
  <!-- Wooden Floor -->
  <path d="M 20 170 L 220 170 L 230 220 L 10 220 Z" fill="#334155"/>
  <path d="M 20 190 L 220 190" stroke="#1e293b" stroke-width="2"/>
  <path d="M 15 205 L 225 205" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window with Rain/Night City View -->
  <g>
    <rect x="35" y="40" width="60" height="90" rx="4" fill="#090d16" stroke="#475569" stroke-width="3"/>
    <!-- Window Panes -->
    <line x1="65" y1="40" x2="65" y2="130" stroke="#475569" stroke-width="2"/>
    <line x1="35" y1="85" x2="95" y2="85" stroke="#475569" stroke-width="2"/>
    <!-- Rain drops outside window -->
    <line x1="45" y1="50" x2="42" y2="60" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="55" y1="70" x2="52" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="80" y1="55" x2="77" y2="65" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="70" y1="100" x2="67" y2="110" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- City lights blurred in background -->
    <circle cx="50" cy="115" r="2" fill="#f43f5e" opacity="0.8"/>
    <circle cx="75" cy="120" r="3" fill="#fbbf24" opacity="0.6"/>
    <circle cx="85" cy="105" r="2" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- Light Beam from Window -->
  <polygon points="35,40 95,40 140,170 20,170" fill="url(#light-beam)"/>

  <!-- Bookshelf / Props on Wall -->
  <rect x="155" y="45" width="50" height="6" fill="#475569" rx="2"/>
  <!-- Colorful books -->
  <rect x="162" y="25" width="8" height="20" fill="#ec4899" rx="1"/>
  <rect x="171" y="22" width="10" height="23" fill="#38bdf8" rx="1"/>
  <rect x="182" y="27" width="7" height="18" fill="#10b981" rx="1"/>

  <!-- DESK & PROPS -->
  <g filter="url(#soft-shadow)">
    <!-- Desk Legs -->
    <rect x="110" y="145" width="8" height="35" fill="#475569"/>
    <rect x="195" y="145" width="8" height="35" fill="#475569"/>
    <!-- Desk Top -->
    <rect x="90" y="135" width="130" height="14" fill="#64748b" rx="3"/>
  </g>

  <!-- Desk Props: Closed Event Ticket / Unused Train Ticket / Unopened Letter -->
  <g transform="rotate(-10 140 138)">
    <rect x="125" y="128" width="30" height="18" fill="#f8fafc" rx="2"/>
    <circle cx="125" cy="137" r="3" fill="#64748b"/>
    <circle cx="155" cy="137" r="3" fill="#64748b"/>
    <line x1="133" y1="133" x2="147" y2="133" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="133" y1="141" x2="143" y2="141" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Desk Lamp -->
  <circle cx="195" cy="105" r="18" fill="url(#lamp-glow)"/>
  <path d="M 195 115 L 195 135" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 185 105 L 205 105 L 200 115 L 190 115 Z" fill="#fbbf24"/>
  <circle cx="195" cy="135" r="12" fill="#64748b"/>

  <!-- MAIN CHARACTER (Expressing Regret / Disappointment) -->
  <g filter="url(#soft-shadow)">
    <!-- Chair Back -->
    <path d="M 75 90 C 75 80 85 75 95 75 L 115 75 C 125 75 135 80 135 90 L 130 160 L 80 160 Z" fill="#475569"/>
    <rect x="90" y="90" width="30" height="60" fill="#334155" rx="4"/>

    <!-- Body / Torso (Slouched Forward) -->
    <path d="M 85 130 C 95 115 115 115 125 135 L 135 175 L 75 175 Z" fill="#fb923c"/> <!-- Orange cozy sweater -->
    
    <!-- Head (Leaning on hand, downturned eyes) -->
    <g transform="translate(100, 95)">
      <!-- Hair -->
      <path d="M -12 -5 C -15 -18 5 -22 15 -12 C 22 -5 22 10 18 15 C 10 12 5 12 -5 14 C -12 12 -13 3 -12 -5 Z" fill="#334155"/>
      
      <!-- Face Base -->
      <circle cx="2" cy="5" r="14" fill="#fcd34d"/>
      
      <!-- Closed/Sad Eyes -->
      <path d="M -3 4 C -1 2 3 2 5 4" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      
      <!-- Gentle Frown / Melancholy Mouth -->
      <path d="M -1 12 C 1 10 3 10 5 11" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none"/>

      <!-- Rosy Cheeks (subtle) -->
      <circle cx="-5" cy="8" r="3" fill="#f43f5e" opacity="0.3"/>
    </g>

    <!-- Arms Supporting the Head -->
    <!-- Back arm resting -->
    <path d="M 80 140 C 70 150 75 165 90 160" stroke="#fb923c" stroke-width="10" stroke-linecap="round" fill="none"/>
    
    <!-- Front Arm (Hand supporting chin) -->
    <path d="M 125 140 C 115 135 105 125 102 110" stroke="#fb923c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Hand on cheek -->
    <circle cx="101" cy="107" r="6" fill="#fcd34d"/>
  </g>

  <!-- Potted Plant on Floor for Atmosphere -->
  <g transform="translate(25, 175)">
    <!-- Pot -->
    <path d="M 5 15 L 25 15 L 22 35 L 8 35 Z" fill="#f43f5e"/>
    <!-- Plant Leaves (Monstera style) -->
    <path d="M 15 15 C 10 0 -5 5 2 15 Z" fill="#10b981"/>
    <path d="M 15 15 C 20 -5 35 5 25 15 Z" fill="#059669"/>
    <path d="M 15 15 C 15 -5 18 -10 15 -15 C 12 -10 15 -5 15 15 Z" fill="#10b981"/>
  </g>

  <!-- Atmospheric Dust Particles (Lit by Window) -->
  <circle cx="50" cy="80" r="1" fill="#38bdf8" opacity="0.6"/>
  <circle cx="70" cy="110" r="1.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="110" cy="130" r="1" fill="#38bdf8" opacity="0.5"/>
  <circle cx="95" cy="60" r="1.2" fill="#38bdf8" opacity="0.7"/>

</svg>