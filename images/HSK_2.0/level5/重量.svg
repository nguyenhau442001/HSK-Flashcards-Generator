<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card/Container Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Box Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    
    <linearGradient id="boxTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Screen Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment (Room Interior) -->
  <!-- Wallpaper line -->
  <line x1="0" y1="150" x2="240" y2="150" stroke="#475569" stroke-width="2" />
  
  <!-- Shelf in background -->
  <rect x="25" y="60" width="90" height="6" rx="3" fill="#475569" />
  <rect x="40" y="35" width="20" height="25" rx="3" fill="#38bdf8" opacity="0.6" />
  <rect x="65" y="40" width="16" height="20" rx="2" fill="#ec4899" opacity="0.6" />

  <!-- Window -->
  <rect x="150" y="30" width="60" height="75" rx="6" fill="#0284c7" opacity="0.2" />
  <rect x="154" y="34" width="52" height="67" rx="4" fill="#0f172a" />
  <line x1="180" y1="34" x2="180" y2="101" stroke="#334155" stroke-width="2" />
  <line x1="154" y1="67" x2="206" y2="67" stroke="#334155" stroke-width="2" />

  <!-- Floor -->
  <rect x="0" y="150" width="240" height="90" fill="url(#floorGrad)" />
  <line x1="0" y1="150" x2="240" y2="150" stroke="#64748b" stroke-width="2" />

  <!-- MAIN SCENE: "这个箱子的重量是十公斤" (The weight of this box is 10 kg) -->
  
  <!-- Digital Scale Platform on Floor -->
  <g id="scale">
    <rect x="75" y="185" width="90" height="12" rx="4" fill="#64748b" />
    <rect x="80" y="180" width="80" height="6" rx="2" fill="#94a3b8" />
    <!-- Scale Display Screen with glowing text effect -->
    <rect x="105" y="168" width="30" height="14" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <!-- Digital "10.0" representation (abstracted glowing bars) -->
    <rect x="110" y="173" width="3" height="4" rx="1" fill="#10b981" filter="url(#glow)" />
    <rect x="115" y="172" width="5" height="6" rx="1" fill="#10b981" filter="url(#glow)" />
    <rect x="123" y="172" width="2" height="6" rx="1" fill="#10b981" filter="url(#glow)" />
    <rect x="128" y="175" width="2" height="2" rx="1" fill="#10b981" filter="url(#glow)" />
  </g>

  <!-- The Box ("这个箱子") sitting on the scale -->
  <g id="box">
    <!-- Box Shadow -->
    <ellipse cx="120" cy="183" rx="36" ry="6" fill="#0f172a" opacity="0.6" />
    
    <!-- Front Face -->
    <polygon points="90,130 150,130 150,180 90,180" fill="url(#boxGrad)" />
    <!-- Side Face -->
    <polygon points="150,130 170,120 170,170 150,180" fill="#b45309" />
    <!-- Top Face -->
    <polygon points="90,130 110,120 170,120 150,130" fill="url(#boxTopGrad)" />

    <!-- Box Tape & Details -->
    <polygon points="115,130 125,130 125,180 115,180" fill="#d97706" opacity="0.4" />
    <polygon points="150,145 170,135 170,145 150,155" fill="#92400e" opacity="0.4" />
    <polygon points="90,145 110,135 110,145 90,155" fill="#fcd34d" opacity="0.4" />
    
    <!-- Fragile Icon / Shipping Label on Box -->
    <rect x="105" y="145" width="18" height="14" rx="2" fill="#f8fafc" />
    <polyline points="109,155 114,148 119,155" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Character / Observer gesturing or checking the scale -->
  <g id="character">
    <!-- Character Body/Torso -->
    <path d="M 45,190 C 45,160 55,145 70,145 C 85,145 95,160 95,190 Z" fill="#38bdf8" />
    
    <!-- Character Head -->
    <circle cx="70" cy="122" r="16" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 54,120 C 54,108 62,104 72,104 C 84,104 88,112 88,124 L 88,130 L 54,130 Z" fill="#475569" />

    <!-- Expressive Face (Amazed/Satisfied look looking at scale) -->
    <circle cx="65" cy="120" r="1.5" fill="#1e293b" />
    <circle cx="75" cy="120" r="1.5" fill="#1e293b" />
    <!-- Smile -->
    <path d="M 68,126 Q 71,130 74,126" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm pointing/checking -->
    <path d="M 85,150 C 95,150 102,158 102,165" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="102" cy="166" r="4" fill="#fbcfe8" />
  </g>

  <!-- Floating visual indicators of weight/measurement (Abstract context cues, NO TEXT) -->
  <g id="measurement-cues" transform="translate(145, 100)">
    <!-- Checkmark badge -->
    <circle cx="15" cy="15" r="12" fill="#10b981" filter="url(#glow)" />
    <polyline points="9,15 13,19 21,11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Pulse rings -->
    <circle cx="15" cy="15" r="18" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5" />
  </g>

</svg>