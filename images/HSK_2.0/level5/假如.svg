<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Globe Glow -->
    <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Treasure Chest Gold Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Magic Sparkle Pattern -->
    <g id="sparkle">
      <path d="M0,-6 C1,-2 2,-1 6,0 C2,1 1,2 0,6 C-1,2 -2,1 -6,0 C-2,-1 -1,-2 0,-6 Z" fill="#fde047"/>
    </g>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Dreamy "What if" portals / floating islands) -->
  <g opacity="0.6">
    <!-- Ambient Glows representing imagination/possibility -->
    <circle cx="180" cy="70" r="50" fill="url(#globeGlow)"/>
    <circle cx="60" cy="140" r="60" fill="url(#goldGlow)"/>
  </g>

  <!-- Environment Base: A cozy adventurer's desk / dreaming planner scene -->
  <!-- Wooden/Modern Desk Surface -->
  <path d="M 20,205 L 220,205 L 230,225 L 10,225 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M 12,203 L 228,203 L 220,207 L 20,207 Z" fill="#334155"/>

  <!-- MAIN SCENE: "What If" Dream Explorer Kit (Globe + Treasure Chest + Travel/Dream props) representing "Suppose/If" -->
  <g filter="url(#softShadow)">
    
    <!-- Left Prop: Travel Globe (representing the "Travel" part of "If I have money, I will travel") -->
    <g transform="translate(65, 125)">
      <!-- Stand Base -->
      <ellipse cx="0" cy="52" rx="22" ry="7" fill="#475569"/>
      <path d="M -4,50 L -4,25 C -4,20 4,20 4,25 L 4,50 Z" fill="#64748b"/>
      
      <!-- Meridian Ring -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="#64748b" stroke-width="4"/>
      
      <!-- Globe Sphere -->
      <circle cx="0" cy="0" r="28" fill="#0284c7"/>
      <!-- Continents (Stylized vector shapes) -->
      <path d="M -15,-10 C -5,-18 10,-20 18,-10 C 22,0 15,15 5,12 C -5,10 -20,0 -15,-10 Z" fill="#10b981"/>
      <path d="M -8,15 C 2,12 8,22 2,26 C -4,28 -12,20 -8,15 Z" fill="#10b981"/>
      <!-- Globe Atmosphere Highlight -->
      <path d="M -20,-20 C -10,-26 5,-24 15,-18 C 5,-28 -15,-15 -20,-20 Z" fill="#38bdf8" opacity="0.6"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
      
      <!-- Tilt Axis Rod -->
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Right Prop: Treasure Chest spilling glowing coins/gems (representing the "Wealth/Money" part of "If I have money...") -->
    <g transform="translate(160, 130)">
      <!-- Chest Back/Base -->
      <rect x="-28" y="10" width="56" height="32" rx="4" fill="#9a3412"/>
      <rect x="-30" y="8" width="60" height="8" rx="3" fill="#c2410c"/>
      
      <!-- Gold & Gems spilling out -->
      <ellipse cx="0" cy="12" rx="24" ry="10" fill="url(#goldGlow)"/>
      <circle cx="-12" cy="6" r="7" fill="#fbbf24"/>
      <circle cx="2" cy="4" r="8" fill="#f59e0b"/>
      <circle cx="14" cy="8" r="6" fill="#fbbf24"/>
      <circle cx="-5" cy="-2" r="7" fill="#fde047"/>
      <circle cx="8" cy="-1" r="6" fill="#f59e0b"/>
      <!-- Diamond Gem -->
      <polygon points="0,-12 6,-4 0,4 -6,-4" fill="#38bdf8"/>

      <!-- Chest Lid (Open, tilted back) -->
      <path d="M -30,8 C -30,-8 30,-8 30,8 Z" fill="#9a3412" transform="translate(0, 0) rotate(-35)"/>
      <path d="M -31,6 C -31,-10 31,-10 31,6 Z" fill="#c2410c" transform="translate(0, 0) rotate(-35)" opacity="0.7"/>
      
      <!-- Metal Straps & Lock -->
      <rect x="-26" y="22" width="6" height="20" fill="#475569"/>
      <rect x="20" y="22" width="6" height="20" fill="#475569"/>
      <rect x="-6" y="24" width="12" height="12" rx="2" fill="#e2e8f0"/>
      <circle cx="0" cy="30" r="2" fill="#0f172a"/>
    </g>

    <!-- CENTER PIECE: The "Hypothetical / Thought Bubble" Bridge connecting Wealth to Travel -->
    <g transform="translate(120, 75)">
      <!-- Large Floating Thought/Idea Cloud representing "What if..." (假如) -->
      <path d="M -40,15 
               C -60,15 -65,-15 -45,-25 
               C -55,-50 -20,-55 -5,-35 
               C 15,-55 45,-40 35,-15 
               C 55,-10 50,20 30,20 
               L -40,20 Z" 
            fill="#334155" opacity="0.9" filter="url(#softShadow)"/>
      <path d="M -37,17 
               C -55,17 -60,-13 -42,-22 
               C -51,-46 -18,-50 -4,-32 
               C 13,-50 41,-37 32,-14 
               C 50,-9 45,18 28,18 
               L -37,18 Z" 
            fill="#1e293b"/>

      <!-- Inner Magical / Conceptual Elements inside the Cloud: A magical glowing ladder/path to the stars -->
      <path d="M -15,5 L 15,-15" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <path d="M -5,12 L 25,-8" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <line x1="-12" y1="8" x2="-2" y2="10" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="2" y1="-2" x2="12" y2="0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Floating Sparkles of Imagination -->
      <use href="#sparkle" x="-25" y="-15" transform="scale(0.8)"/>
      <use href="#sparkle" x="20" y="-25" transform="scale(1.2)"/>
      <use href="#sparkle" x="0" y="5" transform="scale(0.6)"/>
    </g>

  </g>

  <!-- Action / Connection Arcs (Dotted glowing path showing cause & effect: Money -> What if -> Travel) -->
  <path d="M 135 155 Q 120 120 100 125" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4,4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 105 105 Q 120 80 140 100" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4" stroke-linecap="round" opacity="0.8"/>

  <!-- Foreground Magic & Sparkles surrounding the scene -->
  <g>
    <use href="#sparkle" x="35" y="70" transform="scale(1.4)"/>
    <use href="#sparkle" x="205" y="90" transform="scale(1)"/>
    <use href="#sparkle" x="120" y="35" transform="scale(1.2)"/>
    <circle cx="190" cy="190" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="45" cy="180" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="210" cy="140" r="2" fill="#f43f5e" opacity="0.7"/>
    <circle cx="30" cy="110" r="1.5" fill="#38bdf8" opacity="0.9"/>
  </g>
</svg>