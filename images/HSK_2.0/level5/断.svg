<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(40, 60)">
    <!-- Wooden Post -->
    <rect x="0" y="0" width="20" height="150" rx="4" fill="#94a3b8"/>
    <rect x="200" y="0" width="20" height="150" rx="4" fill="#94a3b8"/>
    
    <!-- The Broken Rope -->
    <path d="M 20 40 Q 110 30 110 80" stroke="#fb923c" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 220 40 Q 130 30 130 80" stroke="#fb923c" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Frayed ends -->
    <path d="M 110 80 L 105 95 M 110 80 L 115 95 M 110 80 L 112 98" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <path d="M 130 80 L 125 95 M 130 80 L 135 95 M 130 80 L 128 98" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Decorative elements -->
    <circle cx="120" cy="40" r="6" fill="#38bdf8" opacity="0.6"/>
    <circle cx="100" cy="120" r="4" fill="#10b981" opacity="0.5"/>
    <circle cx="140" cy="120" r="4" fill="#ec4899" opacity="0.5"/>
  </g>
</svg>