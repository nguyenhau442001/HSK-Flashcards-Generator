<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Stage Lighting Beams -->
  <path d="M0 0 L80 0 L120 120 L40 120 Z" fill="url(#spotlight)" opacity="0.4"/>
  <path d="M240 0 L160 0 L120 120 L200 120 Z" fill="url(#spotlight)" opacity="0.4"/>

  <!-- Background Flags (Stylized) -->
  <rect x="50" y="60" width="40" height="80" fill="#334155" rx="2"/>
  <rect x="150" y="60" width="40" height="80" fill="#334155" rx="2"/>
  <path d="M50 60 Q70 55 90 60 L90 140 Q70 135 50 140 Z" fill="#1e3a8a" opacity="0.6"/>
  <path d="M150 60 Q170 55 190 60 L190 140 Q170 135 150 140 Z" fill="#1e3a8a" opacity="0.6"/>

  <!-- Character: The Elected President -->
  <!-- Suit Jacket -->
  <path d="M95 140 Q120 130 145 140 L155 200 L85 200 Z" fill="#1e40af"/>
  <!-- Shirt & Tie -->
  <path d="M110 135 L130 135 L125 155 L115 155 Z" fill="#f8fafc"/>
  <path d="M118 135 L122 135 L124 150 L120 155 L116 150 Z" fill="#ef4444"/>
  <!-- Head -->
  <circle cx="120" cy="115" r="18" fill="#fde68a"/>
  <!-- Hair -->
  <path d="M102 115 Q102 100 120 97 Q138 100 138 115 L138 110 Q138 95 120 92 Q102 95 102 110 Z" fill="#475569"/>
  <!-- Waving Arm -->
  <path d="M145 145 Q170 130 175 100" stroke="#1e40af" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M175 100 Q180 90 185 100 L175 105 Z" fill="#fde68a"/>

  <!-- Podium -->
  <path d="M85 170 L155 170 L165 240 L75 240 Z" fill="#334155"/>
  <rect x="82" y="165" width="76" height="8" rx="2" fill="#475569"/>
  <!-- Podium Seal (Abstract) -->
  <circle cx="120" cy="205" r="15" fill="#f59e0b" opacity="0.8"/>
  <circle cx="120" cy="205" r="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- Microphones -->
  <path d="M105 165 L108 150" stroke="#0f172a" stroke-width="2"/>
  <circle cx="108" cy="148" r="3" fill="#0f172a"/>
  <path d="M135 165 L132 150" stroke="#0f172a" stroke-width="2"/>
  <circle cx="132" cy="148" r="3" fill="#0f172a"/>

  <!-- Confetti/Celebration Elements -->
  <circle cx="40" cy="50" r="2" fill="#fbbf24"/>
  <rect x="200" y="40" width="3" height="3" fill="#38bdf8" transform="rotate(45 200 40)"/>
  <circle cx="180" cy="80" r="1.5" fill="#10b981"/>
  <rect x="60" y="20" width="2" height="4" fill="#ec4899" transform="rotate(20 60 20)"/>
  <circle cx="210" cy="120" r="2" fill="#fb923c"/>
  <rect x="30" y="100" width="3" height="3" fill="#f59e0b" transform="rotate(-15 30 100)"/>
  
  <!-- Camera Flashes -->
  <path d="M30 180 L34 184 M30 184 L34 180" stroke="#f8fafc" stroke-width="1" opacity="0.8"/>
  <circle cx="32" cy="182" r="1.5" fill="#f8fafc" opacity="0.6"/>
  
  <path d="M210 160 L214 164 M210 164 L214 160" stroke="#f8fafc" stroke-width="1" opacity="0.8"/>
  <circle cx="212" cy="162" r="1.5" fill="#f8fafc" opacity="0.6"/>

</svg>