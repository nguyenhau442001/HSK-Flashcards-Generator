<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Expecting Mother -->
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Room Environment & Props -->
  <g id="environment">
    <!-- Floor Line & Floor Surface -->
    <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#0f172a" />
    <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

    <!-- Window with Soft Light Beam -->
    <rect x="170" y="30" width="45" height="75" rx="6" fill="#334155" />
    <rect x="174" y="34" width="37" height="67" rx="4" fill="url(#windowLight)" />
    <!-- Light beam cast on floor -->
    <polygon points="174,101 211,101 240,190 195,190" fill="#38bdf8" opacity="0.05" />

    <!-- Potted Plant on Floor (Left) -->
    <path d="M 25 190 L 45 190 L 42 165 L 28 165 Z" fill="#64748b" />
    <ellipse cx="35" cy="165" rx="7" ry="2" fill="#475569" />
    <!-- Plant Leaves -->
    <path d="M 35 163 C 35 140, 15 130, 10 120 C 15 140, 30 150, 35 163 Z" fill="url(#leafGrad)" />
    <path d="M 36 163 C 45 135, 60 125, 68 115 C 55 135, 42 145, 36 163 Z" fill="url(#leafGrad)" />
    <path d="M 35 163 C 30 130, 35 110, 35 95 C 37 115, 38 135, 35 163 Z" fill="url(#leafGrad)" />

    <!-- Wall Art / Circular Shelf -->
    <circle cx="120" cy="55" r="25" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Mini landscape inside shelf -->
    <path d="M 100 65 Q 120 40 140 65 Z" fill="#38bdf8" opacity="0.2" />
    <circle cx="128" cy="48" r="4" fill="#fbbf24" />
  </g>

  <!-- Central Subject: Expecting Mother in Cozy Setting -->
  <g id="main-subject" filter="url(#softShadow)">
    <!-- Cozy Armchair -->
    <path d="M 85 115 Q 80 100 95 95 L 145 95 Q 160 100 155 115 L 165 185 L 75 185 Z" fill="#475569" />
    <!-- Chair Backrest & Cushions -->
    <rect x="90" y="90" width="60" height="90" rx="25" fill="#64748b" />
    <!-- Chair Seat Cushion -->
    <rect x="75" y="155" width="90" height="35" rx="12" fill="#334155" />

    <!-- Warm Golden Glow around the belly / care moment -->
    <circle cx="120" cy="140" r="45" fill="url(#warmGlow)" />

    <!-- Mother Character -->
    <!-- Torso & Clothes (Soft Pink/Coral Sweater) -->
    <path d="M 100 115 Q 120 110 138 118 C 148 130, 152 155, 138 165 C 125 175, 105 175, 98 162 C 92 145, 92 125, 100 115 Z" fill="#f43f5e" />

    <!-- Gentle Pregnant Curve / Baby Bump (Highlighted with subtle lighter tone) -->
    <path d="M 112 122 C 145 125, 152 158, 128 167 C 115 172, 105 160, 105 145 C 105 132, 108 123, 112 122 Z" fill="#fb7185" />

    <!-- Head & Hair -->
    <!-- Hair Back/Body -->
    <circle cx="120" cy="78" r="18" fill="#332924" />
    <path d="M 102 78 C 100 95, 105 105, 115 112 C 110 100, 108 90, 112 78 Z" fill="#332924" />

    <!-- Face Profile / Skin -->
    <circle cx="122" cy="78" r="14" fill="#ffedd5" />
    <!-- Hair Bun / Top Knot -->
    <circle cx="128" cy="62" r="7" fill="#332924" />

    <!-- Peaceful Closed Eye & Smile (Profile facing right) -->
    <path d="M 129 77 Q 132 80 135 77" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 132 83 Q 135 85 137 83" stroke="#9a3412" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <!-- Arms cradling the bump -->
    <!-- Back Arm -->
    <path d="M 105 122 C 95 135, 100 155, 110 158" fill="none" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" />
    <!-- Front Arm & Hand touching belly lovingly -->
    <path d="M 134 125 C 145 135, 142 150, 128 158" fill="none" stroke="#e11d48" stroke-width="8" stroke-linecap="round" />
    <circle cx="126" cy="157" r="4" fill="#ffedd5" /> <!-- Hand -->

    <!-- Legs (Comfortably seated) -->
    <path d="M 90 175 L 68 188 L 95 192 Z" fill="#38bdf8" />
    <path d="M 110 175 L 115 190 L 140 190 Z" fill="#0284c7" />

    <!-- Tiny Floating Heart / Symbol of New Life (warm & expressive) -->
    <g transform="translate(145, 102) scale(0.8)">
      <path d="M 12 5 C 9 0, 2 1, 2 7 C 2 12, 8 16, 12 20 C 16 16, 22 12, 22 7 C 22 1, 15 0, 12 5 Z" fill="#fbbf24" />
    </g>
    <g transform="translate(158, 85) scale(0.5)">
      <path d="M 12 5 C 9 0, 2 1, 2 7 C 2 12, 8 16, 12 20 C 16 16, 22 12, 22 7 C 22 1, 15 0, 12 5 Z" fill="#f43f5e" />
    </g>
  </g>

  <!-- Foreground details: Cozy Rug -->
  <ellipse cx="120" cy="195" rx="65" ry="12" fill="#334155" opacity="0.6" />
  <ellipse cx="120" cy="196" rx="55" ry="9" fill="#1e293b" />
</svg>