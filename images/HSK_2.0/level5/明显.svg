<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Tabletop Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Magnifying Glass Glow/Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing Light Cone -->
    <linearGradient id="lightCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Effect in Background -->
  <circle cx="120" cy="80" r="70" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />

  <!-- Back Wall / Room Context -->
  <path d="M0,150 L240,150" stroke="#475569" stroke-width="2" opacity="0.4" />
  
  <!-- Wooden/Modern Desk Surface -->
  <path d="M0,165 C40,160 200,160 240,165 L240,240 L0,240 Z" fill="url(#tableGrad)" />
  <path d="M0,165 L240,165" stroke="#64748b" stroke-width="1.5" />

  <!-- Context Prop 1: Desk Lamp (Background Atmospheric element) -->
  <g transform="translate(195, 110)">
    <path d="M15,55 L25,55 L20,30 L10,30 Z" fill="#64748b" />
    <path d="M5,55 C5,45 35,45 35,55" fill="#475569" />
    <!-- Lamp head -->
    <path d="M-5,15 L35,15 L25,30 L5,30 Z" fill="#fb923c" />
    <ellipse cx="15" cy="30" rx="10" ry="4" fill="#fef08a" />
  </g>

  <!-- Context Prop 2: Blueprint / Document with a subtle issue/crack (The Problem Area) -->
  <g transform="translate(45, 105) rotate(-5)" filter="url(#shadow)">
    <!-- Paper Sheet -->
    <rect x="0" y="0" width="90" height="70" rx="4" fill="#f8fafc" />
    <!-- Blueprint grid lines / mock technical drawing -->
    <line x1="10" y1="15" x2="50" y2="15" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="25" x2="70" y2="25" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="35" x2="40" y2="35" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <circle cx="65" cy="45" r="12" fill="none" stroke="#cbd5e1" stroke-width="2" />

    <!-- THE PROBLEM: A very clear, obvious jagged red crack/anomaly -->
    <path d="M50,20 L58,32 L52,42 L65,55" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Warning exclamation mark icon embedded right on the problem -->
    <circle cx="58" cy="32" r="8" fill="#ef4444" />
    <path d="M58,28 L58,33 M58,36 L58,37" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Dramatic Light Cone shining down on the problem -->
  <polygon points="120,0 80,140 160,140" fill="url(#lightCone)" style="mix-blend-mode: screen;" />

  <!-- MAIN SUBJECT: Giant Magnifying Glass focusing on the obvious problem -->
  <!-- Handheld dynamically at an angle -->
  <g transform="translate(100, 105) rotate(25)" filter="url(#shadow)">
    
    <!-- Magnifier Handle -->
    <defs>
      <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb923c" />
        <stop offset="100%" stop-color="#c2410c" />
      </linearGradient>
    </defs>
    <rect x="-10" y="40" width="20" height="75" rx="10" fill="url(#handleGrad)" />
    <!-- Handle grip highlights -->
    <line x1="-4" y1="50" x2="-4" y2="100" stroke="#fdba74" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- Handle metallic collar -->
    <rect x="-12" y="35" width="24" height="10" rx="3" fill="#94a3b8" />

    <!-- Magnifier Rim (Outer) -->
    <circle cx="0" cy="0" r="48" fill="#334155" />
    <!-- Magnifier Rim (Inner metallic frame) -->
    <circle cx="0" cy="0" r="44" fill="#f8fafc" />
    <!-- Magnifier Glass/Lens Background -->
    <circle cx="0" cy="0" r="40" fill="url(#lensGrad)" />

    <!-- MAGNIFIED CONTENT VIEW (Inside the lens: clearly enlarged, high-contrast, obvious) -->
    <g clip-path="url(#lensClip)">
      <clipPath id="lensClip">
        <circle cx="0" cy="0" r="40" />
      </clipPath>
      
      <!-- Offset elements inside lens to show magnification shift -->
      <g transform="translate(-25, -20) scale(1.4)">
        <!-- Paper background inside lens -->
        <rect x="0" y="0" width="90" height="70" fill="#ffffff" />
        <line x1="10" y1="15" x2="50" y2="15" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
        <line x1="10" y1="25" x2="70" y2="25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
        
        <!-- Enlarged Distinct Crack / Problem -->
        <path d="M50,20 L58,32 L52,42 L65,55" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Big Glowing Marker / Alert Pulse inside lens -->
        <circle cx="58" cy="32" r="14" fill="#ef4444" opacity="0.3" filter="url(#glow)" />
        <circle cx="58" cy="32" r="10" fill="#dc2626" />
        <path d="M58,27 L58,33 M58,37 L58,38" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      </g>
    </g>

    <!-- Glass Lens Reflection/Glare Overlay -->
    <path d="M-28,-28 C-10,-38 10,-38 28,-28 C15,-15 15,15 28,28 C10,38 -10,38 -28,28 C-35,10 -35,-10 -28,-28 Z" fill="#ffffff" opacity="0.25" />
  </g>

  <!-- Sparkles / "Clearly Apparent" Indicator Flashes -->
  <g transform="translate(130, 60)" filter="url(#glow)">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#facc15" />
  </g>
  <g transform="translate(60, 130)" filter="url(#glow)">
    <path d="M0,-5 L1.5,-1.5 L5,0 L1.5,1.5 L0,5 L-1.5,1.5 L-5,0 L-1.5,-1.5 Z" fill="#38bdf8" />
  </g>
  <g transform="translate(155, 125)">
    <path d="M0,-6 L1.8,-1.8 L6,0 L1.8,1.8 L0,6 L-1.8,1.8 L-6,0 L-1.8,-1.8 Z" fill="#f43f5e" />
  </g>

  <!-- Foreground Context Prop: A small coffee cup on the desk to ground the scene -->
  <g transform="translate(30, 175)" filter="url(#shadow)">
    <!-- Saucer -->
    <ellipse cx="20" cy="25" rx="18" ry="6" fill="#cbd5e1" />
    <!-- Cup body -->
    <path d="M8,8 L32,8 L29,24 C29,26 27,27 24,27 L16,27 C13,27 11,26 11,24 Z" fill="#f8fafc" />
    <!-- Cup rim -->
    <ellipse cx="20" cy="8" rx="12" ry="4" fill="#e2e8f0" />
    <!-- Handle -->
    <path d="M30,12 C36,12 36,22 30,22" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M16,2 C15,-3 20,-5 18,-10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <path d="M24,1 C25,-4 20,-6 22,-11" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>