<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glass Cup Gradient -->
    <linearGradient id="glass-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Tea Liquid Gradient -->
    <linearGradient id="tea-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Wooden Table Gradient -->
    <linearGradient id="wood-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="wood-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- SCENE ENVIRONMENT: Window & Ambient Glow (Contextualizing glass) -->
  <g id="environment">
    <!-- Window Frame Backlight -->
    <rect x="35" y="25" width="170" height="135" rx="12" fill="#090d16" stroke="#334155" stroke-width="3"/>
    
    <!-- Window Panes (Showing Glass Panels) -->
    <rect x="43" y="33" width="74" height="58" rx="6" fill="url(#window-glow)"/>
    <rect x="123" y="33" width="74" height="58" rx="6" fill="url(#window-glow)"/>
    <rect x="43" y="97" width="74" height="55" rx="6" fill="url(#window-glow)"/>
    <rect x="123" y="97" width="74" height="55" rx="6" fill="url(#window-glow)"/>

    <!-- Window Muntins / Glass Reflection Lines -->
    <path d="M55 45 L95 75" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" stroke-linecap="round"/>
    <path d="M145 40 L185 70" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 115 L90 135" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" stroke-linecap="round"/>

    <!-- Potted Plant on Windowsill for Depth & Life -->
    <path d="M165 110 L185 110 L180 130 L170 130 Z" fill="#10b981"/>
    <circle cx="175" cy="103" r="12" fill="#059669"/>
    <circle cx="168" cy="98" r="8" fill="#34d399"/>
    <circle cx="182" cy="97" r="9" fill="#10b981"/>

    <!-- Ambient Floating Dust/Light Particles -->
    <circle cx="65" cy="70" r="1.5" fill="#fde047" opacity="0.6"/>
    <circle cx="140" cy="50" r="2" fill="#fde047" opacity="0.4"/>
    <circle cx="100" cy="110" r="1" fill="#fde047" opacity="0.5"/>
  </g>

  <!-- SURFACE: Wooden Table -->
  <g id="furniture">
    <!-- Table Surface Top -->
    <path d="M15 160 L225 160 L235 185 L5 185 Z" fill="url(#wood-surface)"/>
    <!-- Table Edge Highlight -->
    <path d="M15 160 L225 160" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <!-- Table Front Drop -->
    <rect x="5" y="185" width="230" height="40" fill="url(#wood-front)" rx="2"/>
    
    <!-- Coaster -->
    <ellipse cx="120" cy="170" rx="32" ry="10" fill="#334155"/>
    <ellipse cx="120" cy="168" rx="30" ry="9" fill="#475569"/>
  </g>

  <!-- MAIN SUBJECT: The Glass Cup (玻璃杯) filled with warm tea -->
  <g id="glass-cup-object" transform="translate(0, -5)">
    <!-- Cup Back Rim (Inner Ellipse) -->
    <ellipse cx="120" cy="103" rx="27" ry="8" fill="#38bdf8" opacity="0.3"/>

    <!-- Tea Liquid Inside Glass -->
    <path d="M 94.5 108 
             C 94.5 108, 97 150, 98 158 
             C 99 165, 141 165, 142 158 
             C 143 150, 145.5 108, 145.5 108
             Z" fill="url(#tea-liquid)"/>

    <!-- Tea Surface (Meniscus) -->
    <ellipse cx="120" cy="108" rx="25.5" ry="6" fill="#f59e0b" opacity="0.9"/>
    <!-- Steam / Aroma Wisps -->
    <path d="M 112 92 C 108 82, 116 75, 112 65" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 128 90 C 132 80, 124 73, 128 62" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Glass Body (Transparent Vector Construction) -->
    <path d="M 93 103 
             L 97 163 
             C 97.5 167, 101 170, 106 170 
             L 134 170 
             C 139 170, 142.5 167, 143 163 
             L 147 103
             Z" fill="url(#glass-body)" stroke="#e0f2fe" stroke-width="2" stroke-linejoin="round"/>

    <!-- Glass Thickness / Base Depth -->
    <ellipse cx="120" cy="163" rx="21" ry="6" fill="#0284c7" opacity="0.3"/>
    <ellipse cx="120" cy="165" rx="23" ry="7" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

    <!-- Cup Handle (Glass loop on the right) -->
    <path d="M 147 115 
             C 165 115, 168 150, 144 155" 
          fill="none" stroke="#e0f2fe" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 147 117 
             C 162 117, 165 148, 144.5 153" 
          fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Glass Front Rim -->
    <ellipse cx="120" cy="103" rx="27" ry="8" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>

    <!-- Glossy Highlights (Crucial for Glass Material rendering) -->
    <!-- Primary vertical streak (left side reflection) -->
    <path d="M 98 112 Q 97 135, 101 155" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
    <!-- Secondary sharp specular highlight -->
    <path d="M 102 115 L 104 135" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <!-- Right side rim light reflection -->
    <path d="M 141 115 Q 143 135, 139 152" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- FOREGROUND PROPS: Lemon slice & mint on table for added context -->
  <g id="props">
    <!-- Lemon Slice (Vector art) -->
    <g transform="translate(72, 168) rotate(-15)">
      <ellipse cx="0" cy="0" rx="16" ry="12" fill="#facc15"/>
      <ellipse cx="0" cy="0" rx="13" ry="9" fill="#fef08a"/>
      <!-- Segments -->
      <path d="M0 0 L13 0 M0 0 L-13 0 M0 0 L0 9 M0 0 L0 -9 M0 0 L9 6 M0 0 L-9 -6 M0 0 L-9 6 M0 0 L9 -6" stroke="#facc15" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="16" ry="12" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
    </g>

    <!-- Sugar Cube -->
    <g transform="translate(162, 162)">
      <path d="M 0 10 L 12 4 L 24 10 L 12 16 Z" fill="#f1f5f9"/>
      <path d="M 0 10 L 0 20 L 12 26 L 12 16 Z" fill="#cbd5e1"/>
      <path d="M 24 10 L 24 20 L 12 26 L 12 16 Z" fill="#94a3b8"/>
    </g>
  </g>
</svg>