<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Three hands reaching for a central point, symbolizing consensus -->
  <!-- Hand 1 -->
  <path d="M60 160 L70 120 L85 125 L75 160 Z" fill="#fbbf24"/>
  <circle cx="75" cy="115" r="8" fill="#fbbf24"/>
  
  <!-- Hand 2 -->
  <path d="M120 160 L120 110 L135 115 L135 160 Z" fill="#38bdf8"/>
  <circle cx="127" cy="105" r="8" fill="#38bdf8"/>
  
  <!-- Hand 3 -->
  <path d="M180 160 L170 120 L155 125 L165 160 Z" fill="#10b981"/>
  <circle cx="162" cy="115" r="8" fill="#10b981"/>
  
  <!-- Central glowing point of agreement -->
  <circle cx="120" cy="100" r="12" fill="#fb923c" opacity="0.8"/>
  <circle cx="120" cy="100" r="6" fill="#ffffff"/>
  
  <!-- Decorative elements representing harmony -->
  <path d="M40 60 Q60 40 80 60" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M160 60 Q180 40 200 60" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Background atmosphere -->
  <circle cx="200" cy="40" r="4" fill="#334155"/>
  <circle cx="30" cy="190" r="3" fill="#334155"/>
  <circle cx="210" cy="200" r="5" fill="#334155"/>
</svg>