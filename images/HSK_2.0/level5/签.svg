<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Pen Gradient -->
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="120" r="110" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Background Environment: Wooden Desk & Office Prop -->
  <!-- Desk Surface -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M 20 160 L 220 160 L 235 220 L 5 220 Z" fill="#334155" opacity="0.3"/>

  <!-- Coffee Mug Prop -->
  <g transform="translate(185, 125)" filter="url(#subtleShadow)">
    <rect x="0" y="0" width="24" height="30" rx="4" fill="#cbd5e1"/>
    <path d="M 24 6 C 30 6 30 20 24 20" stroke="#cbd5e1" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="12" cy="0" rx="12" ry="4" fill="#e2e8f0"/>
    <!-- Steam -->
    <path d="M 8 -6 Q 10 -12 6 -18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 16 -8 Q 18 -14 14 -20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Main Focus: Official Document / Contract Clipboard -->
  <g filter="url(#shadow)">
    <!-- Clipboard Base (Wooden Board) -->
    <rect x="55" y="45" width="130" height="160" rx="8" fill="#b45309"/>
    <!-- Clip Metal Top -->
    <rect x="95" y="40" width="50" height="16" rx="4" fill="#94a3b8"/>
    <rect x="105" y="44" width="30" height="8" rx="2" fill="#64748b"/>
    <circle cx="120" cy="48" r="3" fill="#cbd5e1"/>

    <!-- Paper Sheet -->
    <rect x="65" y="60" width="110" height="135" rx="4" fill="#f8fafc"/>

    <!-- Document Header Lines (Mock Text) -->
    <rect x="80" y="75" width="45" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="80" y="88" width="80" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="80" y="98" width="60" height="4" rx="2" fill="#e2e8f0"/>
    
    <!-- Paragraph lines -->
    <rect x="80" y="115" width="80" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="80" y="123" width="75" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="80" y="131" width="50" height="3" rx="1.5" fill="#cbd5e1"/>

    <!-- Highlighted Signature Area (Target Context Anchor) -->
    <rect x="75" y="145" width="90" height="38" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Signature Line Indicator -->
    <line x1="85" y1="172" x2="155" y2="172" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Action Element: The Signature Swish (Ink) -->
  <path d="M 90 170 Q 105 140 120 165 T 150 160" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleShadow)"/>
  
  <!-- Ink Splash Accent (Energy & Action) -->
  <circle cx="157" cy="155" r="2.5" fill="#0284c7"/>
  <circle cx="84" cy="172" r="1.5" fill="#0284c7"/>

  <!-- Action Item: Sleek Modern Pen / Stylus actively signing -->
  <g transform="translate(125, 95) rotate(-35)" filter="url(#shadow)">
    <!-- Pen Body -->
    <path d="M -4 0 L 4 0 L 2 70 L -2 70 Z" fill="url(#penGrad)"/>
    <!-- Pen Grip/Accent -->
    <rect x="-3.5" y="25" width="7" height="15" rx="1" fill="#0f172a" opacity="0.3"/>
    <!-- Pen Clip -->
    <rect x="-1" y="5" width="2" height="25" rx="1" fill="#e2e8f0"/>
    <!-- Pen Tip (Gold Nib) -->
    <path d="M -2 70 L 2 70 L 0 84 Z" fill="#fbbf24"/>
    <!-- Nib Split Line -->
    <line x1="0" y1="73" x2="0" y2="81" fill="none" stroke="#b45309" stroke-width="0.75"/>
  </g>

  <!-- Floating Sparkles / Success Indicators (Gamified UI HSK feel) -->
  <g transform="translate(170, 75)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#10b981" filter="url(#subtleShadow)"/>
  </g>
  <g transform="translate(60, 110) scale(0.6)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24" filter="url(#subtleShadow)"/>
  </g>
  <g transform="translate(150, 45) scale(0.8)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#38bdf8" filter="url(#subtleShadow)"/>
  </g>
</svg>