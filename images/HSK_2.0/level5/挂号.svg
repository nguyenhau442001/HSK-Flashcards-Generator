<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Hospital Desk Counter -->
  <path d="M20 180 L220 180 L210 240 L30 240 Z" fill="#334155"/>
  <rect x="20" y="170" width="200" height="10" fill="#475569"/>
  
  <!-- Receptionist -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M5 35 Q20 50 35 35 L30 80 L10 80 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Patient -->
  <g transform="translate(40, 90)">
    <circle cx="20" cy="20" r="18" fill="#fde68a"/>
    <path d="M5 40 Q20 55 35 40 L30 110 L10 110 Z" fill="#ec4899"/>
    <!-- Hand reaching to desk -->
    <path d="M35 70 L55 90" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Medical Props -->
  <rect x="160" y="150" width="30" height="20" rx="2" fill="#f8fafc"/>
  <path d="M165 155 H185 M165 160 H185 M165 165 H175" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Background Elements -->
  <circle cx="200" cy="50" r="25" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M190 50 H210 M200 40 V60" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Lighting/Atmosphere -->
  <ellipse cx="120" cy="240" rx="100" ry="30" fill="#fb923c" opacity="0.1"/>
</svg>