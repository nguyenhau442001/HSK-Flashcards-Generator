<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M20 180 L220 180 L230 210 L10 210 Z" fill="#334155"/>
  
  <!-- Left Object: Smaller/Wilted Plant (The 'Not As Good' item) -->
  <g transform="translate(60, 140)">
    <path d="M-15 40 L15 40 L10 0 L-10 0 Z" fill="#475569"/>
    <path d="M0 0 C-10 -20 -10 -40 0 -50 C10 -40 10 -20 0 0" fill="#ec4899" opacity="0.6"/>
    <circle cx="0" cy="-55" r="8" fill="#fb923c"/>
  </g>
  
  <!-- Right Object: Larger/Vibrant Plant (The 'Better' item) -->
  <g transform="translate(160, 120)">
    <path d="M-20 60 L20 60 L15 0 L-15 0 Z" fill="#334155"/>
    <path d="M0 0 C-25 -30 -25 -70 0 -90 C25 -70 25 -30 0 0" fill="#10b981"/>
    <circle cx="0" cy="-95" r="12" fill="#f59e0b"/>
    <circle cx="-10" cy="-70" r="8" fill="#f59e0b"/>
    <circle cx="10" cy="-50" r="8" fill="#f59e0b"/>
  </g>

  <!-- Comparison Scale/Indicator -->
  <path d="M80 100 L160 100 L120 70 Z" fill="#38bdf8" opacity="0.3"/>
  <path d="M120 100 L120 130" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative Elements -->
  <circle cx="40" cy="50" r="3" fill="#38bdf8"/>
  <circle cx="200" cy="40" r="5" fill="#fbbf24"/>
  <path d="M180 180 L190 170" stroke="#475569" stroke-width="2"/>
</svg>