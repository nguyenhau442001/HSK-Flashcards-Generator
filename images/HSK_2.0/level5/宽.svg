<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- River Water Gradient (Wide river) -->
    <linearGradient id="river-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Bank / Grass Gradients -->
    <linearGradient id="grass-near" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grass-far" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Bridge Gradient -->
    <linearGradient id="bridge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Sun / Glow Gradient -->
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Sky & Celestial Elements -->
  <circle cx="180" cy="50" r="35" fill="url(#sun-glow)"/>
  <circle cx="180" cy="50" r="16" fill="#fef08a"/>

  <!-- Distant Mountains / Hills -->
  <path d="M0 95 Q 40 70, 90 92 T 200 88 L 240 95 L 240 110 L 0 110 Z" fill="#065f46" opacity="0.6"/>
  <path d="M0 100 Q 70 80, 140 102 T 240 98 L 240 115 L 0 115 Z" fill="url(#grass-far)"/>

  <!-- Far Riverbank -->
  <path d="M0 112 Q 120 105, 240 112 L 240 125 L 0 125 Z" fill="#047857"/>

  <!-- WIDE RIVER (Emphasizing the width: spans from y=112 to y=180) -->
  <path d="M0 112 C 80 108, 160 108, 240 112 L 240 180 C 160 184, 80 184, 0 180 Z" fill="url(#river-grad)"/>

  <!-- River Details (Ripples & Waves showing expanse) -->
  <path d="M30 128 Q 50 126, 70 128" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M140 135 Q 165 133, 190 135" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M80 148 Q 110 145, 140 148" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M180 155 Q 200 153, 220 155" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M50 165 Q 80 162, 110 165" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Distant Sailboat on the Wide River to give scale -->
  <g transform="translate(160, 120) scale(0.6)">
    <path d="M0 10 L 15 10 L 7.5 0 Z" fill="#ffffff"/>
    <rect x="7" y="3" width="1" height="9" fill="#64748b"/>
    <ellipse cx="7.5" cy="11" rx="8" ry="2" fill="#cbd5e1"/>
  </g>

  <!-- Near Riverbank (Foreground) -->
  <path d="M0 178 C 80 174, 160 174, 240 178 L 240 240 L 0 240 Z" fill="url(#grass-near)"/>

  <!-- Foreground Grass Tufts & Flowers -->
  <path d="M15 190 Q 18 178, 22 190 M18 190 Q 25 180, 28 190" stroke="#047857" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="55" cy="195" r="3" fill="#f43f5e"/>
  <path d="M55 205 L 55 195" stroke="#047857" stroke-width="2"/>
  <circle cx="215" cy="210" r="2.5" fill="#fbbf24"/>
  <path d="M215 220 L 215 210" stroke="#047857" stroke-width="2"/>

  <!-- Scenic Bridge spanning part of the wide river -->
  <path d="M170 115 Q 205 105, 240 112 L 240 120 Q 205 113, 170 122 Z" fill="url(#bridge-grad)"/>
  <line x1="185" y1="110" x2="185" y2="117" stroke="#334155" stroke-width="2"/>
  <line x1="205" y1="107" x2="205" y2="115" stroke="#334155" stroke-width="2"/>
  <line x1="225" y1="109" x2="225" y2="117" stroke="#334155" stroke-width="2"/>

  <!-- Character 1 (Standing, pointing out the wide river with admiration) -->
  <g transform="translate(85, 155)">
    <!-- Shadow -->
    <ellipse cx="5" cy="35" rx="10" ry="4" fill="#022c22" opacity="0.4"/>
    <!-- Legs -->
    <rect x="0" y="20" width="4" height="15" fill="#334155" rx="2"/>
    <rect x="6" y="20" width="4" height="15" fill="#334155" rx="2"/>
    <!-- Torso -->
    <path d="M-2 8 L 12 8 L 10 22 L 0 22 Z" fill="url(#shirt-grad)" rx="2"/>
    <!-- Head -->
    <circle cx="5" cy="1" r="7" fill="#fde047"/>
    <!-- Hair -->
    <path d="M-1 -2 Q 5 -7, 11 -2 Q 8 -4, 2 -3 Z" fill="#1e293b"/>
    <!-- Pointing Arm -->
    <path d="M10 11 L 22 7" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Sitting on the grass, looking relaxed, holding a sketchpad or bottle) -->
  <g transform="translate(115, 175)">
    <!-- Shadow -->
    <ellipse cx="6" cy="18" rx="12" ry="4" fill="#022c22" opacity="0.4"/>
    <!-- Body / Sitting -->
    <path d="M-2 2 L 14 2 L 12 16 L -2 16 Z" fill="#3b82f6" rx="3"/>
    <!-- Head -->
    <circle cx="6" cy="-6" r="7" fill="#fde047"/>
    <!-- Hair -->
    <path d="M0 -10 Q 6 -14, 12 -10 Z" fill="#475569"/>
    <!-- Crossed Legs / Lower Body -->
    <path d="M-4 14 L 14 14 L 10 19 L -2 19 Z" fill="#1e293b" rx="2"/>
    <!-- Arm gesturing width -->
    <path d="M12 5 L 22 10" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Foreground Tree/Bush Framing Left -->
  <path d="M-10 150 Q 15 130, 25 180 L -10 190 Z" fill="#047857"/>
  <circle cx="10" cy="140" r="22" fill="#059669"/>
  <circle cx="25" cy="155" r="18" fill="#10b981"/>
  <circle cx="-5" cy="165" r="15" fill="#047857"/>

  <!-- Foreground Tree Framing Right -->
  <path d="M255 160 Q 230 140, 215 190 L 255 200 Z" fill="#047857"/>
  <circle cx="230" cy="150" r="20" fill="#059669"/>
  <circle cx="245" cy="165" r="16" fill="#10b981"/>

  <!-- Composition & Polish Detail: Birds in sky -->
  <path d="M60 45 Q 65 40, 70 45 Q 75 40, 80 45" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M75 35 Q 78 31, 82 35 Q 86 31, 89 35" stroke="#cbd5e1" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Outer Border / Frame consistency -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>