<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Speech Bubble Gradient / Anger Pulse -->
    <linearGradient id="angerBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow behind scene -->
  <circle cx="120" cy="120" r="90" fill="url(#glow)"/>

  <!-- Floor / Ground Plane -->
  <path d="M 20 195 Q 120 180 220 195 L 220 220 C 220 231 211 240 200 240 L 40 240 C 29 240 20 231 20 220 Z" fill="#090d16" opacity="0.8"/>
  <ellipse cx="120" cy="195" rx="90" ry="8" fill="#020617" opacity="0.6"/>

  <!-- Room Interior Props (Background) -->
  <g opacity="0.4">
    <!-- Bookshelf / Wall line -->
    <line x1="30" y1="60" x2="210" y2="60" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <rect x="45" y="35" width="12" height="25" rx="2" fill="#475569"/>
    <rect x="60" y="30" width="15" height="30" rx="2" fill="#64748b"/>
    <rect x="78" y="40" width="10" height="20" rx="2" fill="#334155"/>
  </g>

  <!-- SCENE & SUBJECT: Mom scolding a mischievous boy -->
  <!-- Mom Character (Left, authoritative posture, pointing/scolding) -->
  <g id="mom" filter="url(#shadow)">
    <!-- Body / Apron -->
    <path d="M 65 145 C 65 130 80 120 95 120 C 110 120 125 130 125 145 L 125 195 L 65 195 Z" fill="#3b82f6"/>
    <!-- Apron Pocket/Details -->
    <path d="M 80 160 L 110 160 L 105 185 L 85 185 Z" fill="#60a5fa" opacity="0.5"/>
    
    <!-- Head -->
    <circle cx="95" cy="95" r="22" fill="#fbcfe8"/>
    <!-- Hair Bun -->
    <circle cx="95" cy="68" r="10" fill="#334155"/>
    <path d="M 75 92 C 75 80 115 80 115 92 C 115 105 75 105 75 92 Z" fill="#334155"/>
    
    <!-- Face Profile / Expression (Stern) -->
    <path d="M 102 92 L 108 95" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Eyebrow slanted -->
    <circle cx="104" cy="98" r="2" fill="#1e293b"/> <!-- Eye -->
    <path d="M 112 103 Q 115 106 110 108" stroke="#be185d" stroke-width="2" fill="none" stroke-linecap="round"/> <!-- Stern mouth -->

    <!-- Arm pointing forward -->
    <path d="M 110 130 Q 135 125 145 130" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Hand pointing -->
    <circle cx="147" cy="130" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Son Character (Right, repentant/stubborn, slouching) -->
  <g id="son" filter="url(#shadow)">
    <!-- Body -->
    <path d="M 145 150 C 145 135 160 130 175 135 C 190 140 195 155 195 170 L 195 195 L 145 195 Z" fill="#f97316"/>
    
    <!-- Head (bowed slightly) -->
    <circle cx="170" cy="110" r="20" fill="#fde68a"/>
    <!-- Spiky Hair -->
    <path d="M 152 105 C 150 90 165 90 168 95 C 173 85 188 90 185 102 C 192 102 190 115 182 115 Z" fill="#78350f"/>
    
    <!-- Face Expression (Guilty/Frowning) -->
    <path d="M 160 108 L 166 110" stroke="#78350f" stroke-width="2" stroke-linecap="round"/> <!-- Eyebrow -->
    <circle cx="163" cy="113" r="2" fill="#78350f"/> <!-- Eye -->
    <path d="M 153 120 Q 157 116 163 119" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/> <!-- Frown -->

    <!-- Dropped Arms -->
    <path d="M 155 140 Q 145 160 150 175" stroke="#fde68a" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ACTION & INTENSITY: The Scolding / Verbal Outburst (Represented visually through dynamic comic/vector effects) -->
  <g id="scolding-elements">
    <!-- Big Dynamic Spiky Anger/Speech Bubble emitting from Mother -->
    <path d="M 125 105 
             Q 135 95 145 105 
             Q 160 85 175 100 
             Q 195 90 190 115 
             Q 210 130 195 145 
             Q 190 165 170 155 
             Q 155 170 140 150 
             Q 120 155 125 130 Z" 
          fill="url(#angerBubble)" filter="url(#shadow)" opacity="0.95"/>

    <!-- Inner Graphic inside the bubble showing sharp scolding/reprimand energy -->
    <!-- Exclamation marks and jagged sound wave vector lines -->
    <g transform="translate(150, 110)">
      <!-- Sharp Exclamation 1 -->
      <path d="M 8 5 L 12 25 L 8 28 L 4 25 Z" fill="#fef08a"/>
      <circle cx="8" cy="34" r="2.5" fill="#fef08a"/>

      <!-- Sharp Exclamation 2 -->
      <path d="M 24 10 L 27 24 L 24 26 L 21 24 Z" fill="#ffffff" opacity="0.8"/>
      <circle cx="24" cy="31" r="2" fill="#ffffff" opacity="0.8"/>

      <!-- Jagged Sound Waves / Burst lines -->
      <path d="M -8 15 L -2 18" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <path d="M -10 25 L -3 24" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <path d="M 35 15 L 42 18" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Floating Anger Symbols / Veins near Mom's head -->
    <path d="M 115 70 C 118 65 122 65 125 70 M 120 65 L 120 75" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 125 78 C 127 74 131 74 133 78 M 129 73 L 129 81" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Additional Environmental Details (Dropped toy/item emphasizing the trouble caused) -->
  <g transform="translate(110, 180) rotate(-15)" filter="url(#shadow)">
    <!-- Broken toy block or spilled item -->
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#ec4899"/>
    <path d="M 4 4 L 12 12 M 12 4 L 4 12" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles/Action Dust -->
  <circle cx="135" cy="175" r="3" fill="#fbbf24"/>
  <circle cx="155" cy="185" r="2" fill="#fbbf24" opacity="0.7"/>
  <path d="M 175 165 L 179 169 M 179 165 L 175 169" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

</svg>