<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light/Window representing time passing (busy days) -->
  <path d="M150 20 L210 20 L190 140 L130 140 Z" fill="#38bdf8" opacity="0.04" />
  <path d="M165 20 L195 20 L185 140 L155 140 Z" fill="#38bdf8" opacity="0.04" />

  <!-- Wall Shelf with books & calendar (representing 'rìzi' / days and schedule) -->
  <rect x="25" y="45"நாட்டு width="75" height="6" rx="2" fill="#475569" />
  <!-- Mini Calendar (red top) -->
  <rect x="35" y="25" width="18" height="20" rx="2" fill="#f8fafc" />
  <rect x="35" y="25" width="18" height="6" rx="2" fill="#ef4444" />
  <line x1="39" y1="35" x2="49" y2="35" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="39" y1="40" x2="46" y2="40" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <!-- Stack of books -->
  <rect x="60" y="32" width="28" height="13" rx="1" fill="#ec4899" />
  <rect x="58" y="22" width="30" height="10" rx="1" fill="#38bdf8" />

  <!-- Floating Post-it notes (busy schedule) -->
  <rect x="108" y="35" width="16" height="16" rx="2" fill="#facc15" transform="rotate(12 108 35)" />
  <line x1="111" y1="40" x2="120" y2="40" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />
  <line x1="111" y1="44" x2="118" y2="44" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />

  <rect x="18" y="70" width="16" height="16" rx="2" fill="#fb923c" transform="rotate(-8 18 70)" />
  <line x1="21" y1="75" x2="30" y2="75" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" />
  <line x1="21" y1="79" x2="27" y2="79" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" />

  <!-- Desk Surface -->
  <path d="M0 165 L240 165 L240 240 L0 240 Z" fill="url(#deskGrad)" />
  <rect x="0" y="160" width="240" height="6" fill="#64748b" />

  <!-- Desk Setup: Computer Monitor with Multi-windows (busy work) -->
  <rect x="72" y="75" width="96" height="62" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <!-- Monitor Stand -->
  <path d="M110 137 L130 137 L135 158 L105 158 Z" fill="#475569" />
  <rect x="95" y="158" width="50" height="4" rx="2" fill="#64748b" />
  <!-- Screen Content: Dashboards and charts -->
  <rect x="77" y="80" width="54" height="36" rx="2" fill="#1e293b" />
  <polyline points="82,108 92,95 102,102 112,88 122,93" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <rect x="135" y="80" width="28" height="52" rx="2" fill="#1e293b" />
  <line x1="140" y1="90" x2="158" y2="90" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <line x1="140" y1="100" x2="153" y2="100" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <line x1="140" y1="110" x2="156" y2="110" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <line x1="140" y1="120" x2="150" y2="120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <rect x="77" y="119" width="54" height="13" rx="2" fill="#1e293b" />
  <circle cx="85" cy="125" r="3" fill="#ec4899" />
  <line x1="93" y1="125" x2="123" y2="125" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

  <!-- Coffee Mug with steam (late hours / busy routine) -->
  <rect x="185" y="132" width="18" height="22" rx="3" fill="#f8fafc" />
  <path d="M203 138 C210 138 210 148 203 148" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <path d="M190 126 C188 120 194 116 192 110" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" filter="url(#glow)" />
  <path d="M197 125 C196 121 200 118 199 113" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Character (Busy Man working intently) -->
  <!-- Torso & Shoulders -->
  <path d="M85 200 C85 178 102 168 120 168 C138 168 155 178 155 200 Z" fill="#2563eb" />
  <!-- Collar / Shirt -->
  <polygon points="108,168 120,184 132,168" fill="#f8fafc" />
  <path d="M116 172 L120 180 L124 172" fill="#cbd5e1" />

  <!-- Head & Face (Expression of busy concentration) -->
  <path d="M102 135 C102 118 110 115 120 115 C130 115 138 118 138 135 C138 148 130 152 120 152 C110 152 102 148 102 135 Z" fill="#fbcfe8" />
  <!-- Hair (Messy, rushing through days) -->
  <path d="M100 125 C100 108 112 104 121 104 C132 104 140 110 141 126 C136 122 130 120 123 121 C112 122 106 124 100 125 Z" fill="#334155" />
  <!-- Eyebrows (focused angle) -->
  <line x1="109" y1="126" x2="116" y2="129" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <line x1="124" y1="129" x2="131" y2="126" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes (concentrated dashes/dots) -->
  <circle cx="112" cy="133" r="1.5" fill="#1e293b" />
  <circle cx="128" cy="133" r="1.5" fill="#1e293b" />
  <!-- Mouth (slight tense line) -->
  <path d="M117 143 Q120 145 123 143" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <!-- Glasses -->
  <rect x="107" y="128" width="11" height="9" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="122" y="128" width="11" height="9" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5" />
  <line x1="118" y1="132" x2="122" y2="132" stroke="#f59e0b" stroke-width="1.5" />

  <!-- Arms / Hands typing frantically -->
  <!-- Left arm -->
  <path d="M90 180 C80 180 75 160 85 145" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
  <!-- Right arm -->
  <path d="M150 180 C160 180 165 160 155 145" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
  <!-- Hands on keyboard area -->
  <circle cx="92" cy="143" r="4" fill="#fbcfe8" />
  <circle cx="148" cy="143" r="4" fill="#fbcfe8" />

  <!-- Keyboard on Desk -->
  <rect x="95" y="146" width="50" height="14" rx="3" ry="3" fill="#cbd5e1" />
  <line x1="100" y1="150" x2="140" y2="150" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
  <line x1="102" y1="155" x2="138" y2="155" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Action lines / Motion blur indicators representing "busy everyday rush" -->
  <path d="M60 110 L70 113" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M55 125 L68 127" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M62 140 L71 141" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <path d="M170 113 L180 110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M172 127 L185 125" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
</svg>