<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Character: Jumping for joy -->
    <path d="M80 140c-10 0-20-5-25-15l-10-30c-5-15 0-30 15-35l20-5c15-5 30 5 35 20l10 30c5 15-5 30-20 35l-25 10z" fill="#f59e0b"/>
    <!-- Head -->
    <circle cx="80" cy="40" r="25" fill="#fbbf24"/>
    <!-- Eyes -->
    <circle cx="70" cy="35" r="3" fill="#0f172a"/>
    <circle cx="90" cy="35" r="3" fill="#0f172a"/>
    <!-- Mouth (Big smile) -->
    <path d="M70 50c5 5 15 5 20 0" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Arms raised -->
    <path d="M55 60l-20-30M105 60l20-30" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Motion lines/Stars for emphasis -->
    <path d="M130 20l5 10m10-5l-5 10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 20l-5 10m-10-5l5 10" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Ground/Environment -->
  <path d="M0 200c40-10 80-10 120 0s80 10 120 0v40H0z" fill="#1e293b" opacity="0.5"/>
  <circle cx="180" cy="180" r="20" fill="#10b981" opacity="0.2"/>
  <circle cx="200" cy="190" r="10" fill="#fb923c" opacity="0.3"/>
</svg>