<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Positive/Happy Side -->
    <radialGradient id="amberGlow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Cool Slate/Blue Glow for Contrast Side -->
    <radialGradient id="blueGlow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effects for "Contrast/Instead" Theme -->
  <circle cx="180" cy="120" r="80" fill="url(#amberGlow)" />
  <circle cx="60" cy="120" r="80" fill="url(#blueGlow)" />

  <!-- Split Scene Divider Line (Subtle contrast axis) -->
  <line x1="120" y1="40" x2="120" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- SCENE COMPONENT 1: Left Side (Frustrated/Negative expectation - Dropped umbrella/rain cloud) -->
  <g transform="translate(0, 0)">
    <!-- Small Rain Cloud (Expected reaction: anger/sadness) -->
    <path d="M 50 85 Q 50 75 60 75 Q 68 70 75 78 Q 85 75 90 85 Q 95 95 85 100 L 55 100 Q 45 95 50 85 Z" fill="#64748b" opacity="0.8" />
    <line x1="60" y1="105" x2="55" y2="115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="75" y1="105" x2="70" y2="115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Frustrated/Annoyed Character Head (Silhouette/Minimalist flat style) -->
    <circle cx="65" cy="140" r="22" fill="#334155" />
    <path d="M 45 130 Q 65 120 85 130" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Dropped Object (e.g., broken coffee cup or papers) -->
    <ellipse cx="65" cy="185" rx="14" ry="5" fill="#0f172a" />
    <path d="M 55 175 Q 65 170 75 175 L 73 185 L 57 185 Z" fill="#ef4444" filter="url(#shadow)" />
    <!-- Steam / Broken lines -->
    <path d="M 75 168 Q 80 162 76 156" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- TRANSITION ARROW (Contrasting / "Fǎn'ér" dynamic flow) -->
  <g transform="translate(120, 120)" filter="url(#shadow)">
    <!-- Curved dynamic contrast swoosh -->
    <path d="M -25 -10 Q 0 -30 25 -10 Q 35 0 20 15 Q 0 35 -15 20" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
    <path d="M -15 20 L -8 14 L -12 8 Z" fill="#f59e0b" />
  </g>

  <!-- SCENE COMPONENT 2: Right Side (The Twist: Warm, Joyful, Unexpected Positive Reaction) -->
  <g transform="translate(130, 15)">
    <!-- Golden Light Burst / Sparkles -->
    <g transform="translate(55, 65)">
      <circle cx="0" cy="0" r="32" fill="#fbbf24" opacity="0.15" filter="url(#glow)" />
      <path d="M 0 -22 L 0 22 M -22 0 L 22 0 M -15 -15 L 15 15 M -15 15 L 15 -15" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Happy Character (Laughing, Smiling brightly - "反而笑") -->
    <!-- Body / Torso -->
    <path d="M 35 125 C 35 105 75 105 75 125 L 85 165 C 85 170 80 175 75 175 L 35 175 C 30 175 25 170 25 165 Z" fill="#3b82f6" filter="url(#shadow)" />
    <!-- Collar / Shirt Detail -->
    <path d="M 45 125 L 55 138 L 65 125 Z" fill="#f8fafc" />

    <!-- Head -->
    <circle cx="55" cy="85" r="26" fill="#fde047" filter="url(#shadow)" />
    <!-- Cheeks (Blushing with joy) -->
    <circle cx="42" cy="92" r="5" fill="#f43f5e" opacity="0.6" />
    <circle cx="68" cy="92" r="5" fill="#f43f5e" opacity="0.6" />
    
    <!-- Hair -->
    <path d="M 33 80 Q 40 55 55 58 Q 70 55 77 80 Q 75 70 55 68 Q 35 70 33 80 Z" fill="#1e293b" />

    <!-- Happy Eyes (Crescent curves of joy) -->
    <path d="M 42 82 Q 46 76 50 82" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 60 82 Q 64 76 68 82" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Big Open Smile ("笑") -->
    <path d="M 46 95 Q 55 108 64 95 Z" fill="#991b1b" />
    <path d="M 49 97 Q 55 104 61 97 Z" fill="#f8fafc" />

    <!-- Action Prop: Holding a glowing gift or bright lightbulb representing the surprising positive outcome -->
    <circle cx="78" cy="130" r="14" fill="#10b981" filter="url(#shadow)" />
    <!-- Star icon inside the item -->
    <path d="M 78 121 L 80.5 126.5 L 86.5 127.5 L 82 132 L 83 138 L 78 135 L 73 138 L 74 132 L 69.5 127.5 L 75.5 126.5 Z" fill="#fef08a" />
  </g>

  <!-- Foreground Atmospheric Particles / Floating Joy Elements -->
  <circle cx="110" cy="70" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="135" cy="50" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="195" cy="80" r="4" fill="#f43f5e" opacity="0.7" />
  <circle cx="210" cy="170" r="3" fill="#fbbf24" opacity="0.9" />
  <circle cx="35" cy="60" r="2.5" fill="#10b981" opacity="0.8" />

  <!-- Outer Frame Border for Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>