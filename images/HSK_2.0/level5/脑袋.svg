<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>

    <!-- Cabinet/Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Impact Flash Gradient -->
    <radialGradient id="impactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Scene Elements: Room Environment -->
  <!-- Floor -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <!-- Wall Line -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- Open Kitchen Cabinet / Shelf (The hazard) -->
  <g filter="url(#shadow)">
    <!-- Cabinet Body -->
    <rect x="130" y="35" width="85" height="110" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <!-- Inside Cabinet -->
    <rect x="138" y="43" width="69" height="94" rx="4" fill="#1e293b"/>
    <!-- Open Cabinet Door (swung outward towards the viewer) -->
    <path d="M 130 35 L 75 55 L 75 145 L 130 145 Z" fill="#64748b" stroke="#94a3b8" stroke-width="2" opacity="0.95"/>
    <rect x="85" y="85" width="6" height="20" rx="3" fill="#cbd5e1"/>
    <!-- Shelf contents inside -->
    <rect x="145" y="80" width="25" height="6" rx="2" fill="#38bdf8"/>
    <circle cx="185" cy="75" r="8" fill="#f43f5e"/>
  </g>

  <!-- Main Subject: Person bumping their '脑袋' (Head) -->
  <g filter="url(#shadow)">
    <!-- Body & Torso (leaning forward) -->
    <path d="M 90 210 C 95 180, 105 160, 120 145 L 140 170 C 130 185, 120 200, 115 210 Z" fill="#3b82f6"/>
    <path d="M 125 148 L 155 165 C 160 170, 160 178, 155 182 C 150 186, 142 184, 137 179 L 115 158 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/> <!-- Arm reacting -->

    <!-- Head / 脑袋 (The focal point of the action) -->
    <g id="headNode">
      <!-- Motion lines behind head -->
      <path d="M 75 125 L 95 120" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <path d="M 70 135 L 90 130" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

      <!-- Head shape -->
      <circle cx="118" cy="122" r="28" fill="url(#skinGrad)" stroke="#d97706" stroke-width="2.5"/>
      
      <!-- Hair -->
      <path d="M 92 120 C 92 100, 105 92, 122 93 C 138 94, 144 105, 145 118 C 140 112, 132 108, 120 108 C 105 108, 98 112, 92 120 Z" fill="#1e293b"/>

      <!-- Facial Expression: Dizzy / Pained from hitting head -->
      <!-- Closed/Wincing Eyes (> <) -->
      <path d="M 112 118 L 118 124 M 118 118 L 112 124" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 126 118 L 132 124 M 132 118 L 126 124" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Open mouth in "Ouch!" expression -->
      <ellipse cx="122" cy="134" rx="4" ry="6" fill="#78350f"/>
      <path d="M 119 131 L 125 131" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>

      <!-- Blush / Impact area on forehead -->
      <circle cx="132" cy="112" r="6" fill="#ef4444" opacity="0.6"/>
    </g>
  </g>

  <!-- Impact / Collision Effects (Action-packed visual cues) -->
  <g filter="url(#glow)">
    <!-- Impact Flash Burst -->
    <circle cx="134" cy="108" r="18" fill="url(#impactGlow)"/>
    
    <!-- Stars / Dizziness Sparkles -->
    <path d="M 134 92 L 137 100 L 145 103 L 137 106 L 134 114 L 131 106 L 123 103 L 131 100 Z" fill="#fef08a"/>
    <path d="M 152 102 L 154 107 L 159 109 L 154 111 L 152 116 L 150 111 L 145 109 L 150 107 Z" fill="#38bdf8" transform="scale(0.7) translate(70, 30)"/>
    <path d="M 115 88 L 117 92 L 121 94 L 117 96 L 115 100 L 113 96 L 109 94 L 113 92 Z" fill="#f43f5e" transform="scale(0.8) translate(30, 10)"/>

    <!-- Dynamic Z-shaped impact lines -->
    <path d="M 142 98 L 152 92 M 145 112 L 156 118" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground decorative elements for depth -->
  <!-- Plant on floor or small prop to anchor the scene -->
  <path d="M 30 190 Q 30 165 45 160 Q 60 165 60 190 Z" fill="#0f172a"/>
  <ellipse cx="45" cy="190" rx="15" ry="5" fill="#334155"/>
  <path d="M 45 160 Q 30 140 20 145" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 45 160 Q 55 130 70 135" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 45 160 Q 45 135 40 130" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>