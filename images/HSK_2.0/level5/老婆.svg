<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Indoor Lighting / Living Room Setting -->
  <!-- Warm glow from a floor lamp / side light -->
  <path d="M190 20 L240 100 L240 240 L160 240 Z" fill="#1e293b" opacity="0.6"/>
  <circle cx="190" cy="50" r="40" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Interior Decor & Context Props -->
  <!-- Wallpaper accent lines & Modern window/frame -->
  <rect x="25" y="30" width="70" height="90" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="30" y="35" width="60" height="80" rx="2" fill="#1e293b"/>
  <!-- Landscape painting inside frame -->
  <circle cx="60" cy="65" r="15" fill="#38bdf8" opacity="0.3"/>
  <path d="M35 90 Q 50 70 65 85 T 85 90 Z" fill="#10b981" opacity="0.4"/>
  
  <!-- Houseplant representing a cozy home -->
  <path d="M210 170 Q215 210 215 230 L195 230 Q195 210 200 170 Z" fill="#475569"/>
  <ellipse cx="205" cy="170" rx="15" ry="6" fill="#64748b"/>
  <!-- Leaves -->
  <path d="M205 164 Q180 140 175 120 Q195 140 205 164 Z" fill="#10b981"/>
  <path d="M205 164 Q230 135 240 120 Q220 145 205 164 Z" fill="#059669"/>
  <path d="M205 164 Q210 130 210 100 Q205 130 205 164 Z" fill="#34d399"/>

  <!-- Sofa / Couch base -->
  <rect x="20" y="160" width="150" height="70" rx="12" fill="#334155"/>
  <rect x="25" y="150" width="140" height="30" rx="10" fill="#475569"/>

  <!-- Character 1: Husband (Proudly admiring) -->
  <!-- Body/Torso -->
  <path d="M55 180 C 55 155 75 155 85 155 C 95 155 115 155 115 180 L 115 220 L 55 220 Z" fill="#3b82f6"/>
  <!-- Head & Neck -->
  <rect x="73" y="125" width="24" height="20" rx="6" fill="#fcd34d"/>
  <circle cx="85" cy="115" r="16" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M 69 110 C 70 98 80 95 90 95 C 102 95 101 108 101 114 C 95 111 75 111 69 110 Z" fill="#1e293b"/>
  <!-- Facial expression: happy, admiring smile, looking towards Character 2 -->
  <circle cx="80" cy="113" r="1.5" fill="#1e293b"/>
  <circle cx="90" cy="113" r="1.5" fill="#1e293b"/>
  <path d="M 83 118 Q 85 121 88 118" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arm gesturing toward the wife with admiration -->
  <path d="M 110 165 C 125 165 130 180 135 190" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="138" cy="193" r="5" fill="#fcd34d"/>

  <!-- Character 2: Wife (The beautiful "老婆" - glowing, elegant pose) -->
  <!-- Floating heart accents to visually reinforce the love/beauty context -->
  <path d="M 130 75 Q 135 68 142 75 Q 148 68 153 75 Q 142 90 130 75 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M 100 55 Q 103 50 108 55 Q 112 50 117 55 Q 108 67 100 55 Z" fill="#fb7185" opacity="0.6"/>

  <!-- Elegant Outfit (Dress) -->
  <path d="M 130 135 C 120 135 115 155 110 180 L 160 180 C 155 155 150 135 140 135 Z" fill="#ec4899"/>
  <!-- Torso & Neck -->
  <rect x="123" y="115" width="24" height="25" rx="6" fill="#fcd34d"/>
  <!-- Head -->
  <circle cx="135" cy="100" r="18" fill="#fcd34d"/>
  <!-- Beautiful flowing hair -->
  <path d="M 117 95 C 115 75 130 70 145 75 C 160 80 160 115 155 135 C 150 135 153 105 145 95 C 130 90 120 95 117 95 Z" fill="#0f172a"/>
  <!-- Facial expression: graceful, gentle, confident smile -->
  <circle cx="130" cy="98" r="1.5" fill="#0f172a"/>
  <circle cx="140" cy="98" r="1.5" fill="#0f172a"/>
  <!-- Gentle eyelash/brows -->
  <path d="M 127 95 Q 130 93 133 95" fill="none" stroke="#0f172a" stroke-width="1" stroke-linecap="round"/>
  <path d="M 137 95 Q 140 93 143 95" fill="none" stroke="#0f172a" stroke-width="1" stroke-linecap="round"/>
  <path d="M 132 104 Q 135 107 138 104" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Elegant pose: Hand touching hair/earring -->
  <path d="M 125 125 C 115 120 115 105 120 100" fill="none" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="98" r="4" fill="#fcd34d"/>
  <circle cx="148" cy="120" r="5" fill="#fcd34d"/>

  <!-- Ambient lighting highlights (Golden rim lighting on scene elements) -->
  <path d="M 20 235 L 220 235" stroke="#fbbf24" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
</svg>