<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Context / Interior Setting -->
  <!-- Background wall detail (Community center / Charity office) -->
  <path d="M 0 140 L 240 140" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  
  <!-- Banner / Poster on wall -->
  <rect x="70" y="30" width="100" height="55" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <circle cx="120" cy="50" r="12" fill="#10b981" opacity="0.2" />
  <path d="M 113 50 L 118 55 L 128 43" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="85" y1="70" x2="155" y2="70" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

  <!-- Window with soft night/evening light -->
  <rect x="25" y="35" width="30" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M 25 57 L 55 57 M 40 35 L 40 80" stroke="#334155" stroke-width="1.5" />

  <!-- Wooden Desk Surface -->
  <path d="M 0 175 L 240 175 L 240 220 L 0 220 Z" fill="url(#deskGrad)" />
  <rect x="0" y="170" width="240" height="6" fill="#475569" />

  <!-- Large Donation Box ("Lots of Money" motif) -->
  <g transform="translate(130, 115)">
    <!-- Box Shadow -->
    <ellipse cx="45" cy="62" rx="45" ry="10" fill="#020617" opacity="0.5" />
    
    <!-- Box Body -->
    <path d="M 10 20 L 80 20 L 90 60 L 0 60 Z" fill="url(#boxGrad)" />
    <path d="M 0 60 L 90 60 L 90 65 L 0 65 Z" fill="#92400e" />
    
    <!-- Slot on Top -->
    <rect x="30" y="16" width="30" height="4" rx="2" fill="#78350f" />
    
    <!-- Heart / Giving Symbol on Box -->
    <path d="M 45 45 C 45 45 35 32 30 35 C 25 38 27 46 45 54 C 63 46 65 38 60 35 C 55 32 45 45 45 45 Z" fill="#ef4444" />
    
    <!-- overflowing stacked gold coins/cash next to box -->
    <ellipse cx="-10" cy="58" rx="12" ry="5" fill="#f59e0b" stroke="#fbbf24" stroke-width="1" />
    <ellipse cx="-10" cy="54" rx="12" ry="5" fill="#fbbf24" />
    <ellipse cx="-5" cy="50" rx="10" ry="4" fill="#fef08a" />
  </g>

  <!-- Stacks of Money falling / sliding into the box (Visualizing "很 多 钱") -->
  <g transform="translate(100, 85)">
    <!-- Bill 1 -->
    <rect x="0" y="10" width="28" height="14" rx="2" fill="#10b981" transform="rotate(-15 14 17)" stroke="#065f46" stroke-width="1" />
    <circle cx="14" cy="17" r="3" fill="#047857" transform="rotate(-15 14 17)" />
    
    <!-- Bill 2 -->
    <rect x="25" y="0" width="30" height="15" rx="2" fill="#34d399" transform="rotate(10 40 7)" stroke="#059669" stroke-width="1" />
    <circle cx="40" cy="7" r="3.5" fill="#059669" transform="rotate(10 40 7)" />

    <!-- Bill 3 -->
    <rect x="15" y="25" width="28" height="14" rx="2" fill="#10b981" transform="rotate(25 29 32)" stroke="#065f46" stroke-width="1" />
  </g>

  <!-- Main Character: Generous Man ("他") -->
  <g transform="translate(30, 80)">
    <!-- Character Shadow -->
    <ellipse cx="45" cy="98" rx="28" ry="8" fill="#020617" opacity="0.5" />

    <!-- Body / Torso (leaning forward actively) -->
    <path d="M 30 50 L 65 60 L 55 95 L 20 90 Z" fill="#3b82f6" />
    
    <!-- Jacket / Vest -->
    <path d="M 30 50 L 45 55 L 40 93 L 23 90 Z" fill="#1d4ed8" />
    <path d="M 50 54 L 65 60 L 58 94 L 45 92 Z" fill="#1d4ed8" />

    <!-- Head & Hair -->
    <circle cx="55" cy="30" r="16" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 39 30 C 39 18 50 15 65 18 C 65 18 68 25 65 28 C 62 31 50 25 45 28 Z" fill="#334155" />
    
    <!-- Facial expression: Warm, smiling, benevolent -->
    <path d="M 57 33 Q 61 36 65 33" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle cx="52" cy="28" r="1.5" fill="#1e293b" />

    <!-- Left Arm (Reaching forward, holding bundle of cash) -->
    <path d="M 35 55 L 75 75 L 85 68" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Hand holding thick stack of money -->
    <g transform="translate(75, 62)">
      <!-- Hand skin -->
      <circle cx="10" cy="5" r="6" fill="#fbcfe8" />
      <!-- Big Stack of Money in Hand -->
      <rect x="5" y="-5" width="22" height="12" rx="2" fill="#10b981" stroke="#047857" stroke-width="1" transform="rotate(-10 16 1)" />
      <rect x="3" y="-1" width="22" height="12" rx="2" fill="#34d399" stroke="#065f46" stroke-width="1" transform="rotate(-5 14 5)" />
      <!-- Dollar/Money detail lines -->
      <circle cx="14" cy="5" r="2.5" fill="#047857" />
    </g>

    <!-- Right Arm (Natural pose) -->
    <path d="M 50 55 L 40 75" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round" />

    <!-- Legs -->
    <path d="M 28 90 L 22 130 L 36 132 L 40 95 Z" fill="#0f172a" />
    <path d="M 50 92 L 58 128 L 72 126 L 60 94 Z" fill="#0f172a" />
    <!-- Shoes -->
    <ellipse cx="28" cy="132" rx="10" ry="4" fill="#334155" />
    <ellipse cx="66" cy="128" rx="10" ry="4" fill="#334155" />
  </g>

  <!-- Sparkling / Giving Effects (Richness of contribution) -->
  <g fill="url(#goldGlow)">
    <path d="M 115 75 L 118 85 L 128 88 L 118 91 L 115 101 L 112 91 L 102 88 L 112 85 Z" opacity="0.9" />
    <path d="M 180 50 L 182 56 L 188 58 L 182 60 L 180 66 L 178 60 L 172 58 L 178 56 Z" opacity="0.7" />
    <circle cx="160" cy="100" r="3" fill="#fbbf24" opacity="0.8" />
    <circle cx="105" cy="120" r="2" fill="#fbbf24" opacity="0.6" />
  </g>

  <!-- Foreground Props on Desk -->
  <!-- Small clipboard / receipt book -->
  <g transform="translate(15, 185) rotate(-10)">
    <rect x="0" y="0" width="35" height="25" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="12" y="-3" width="11" height="5" rx="1" fill="#94a3b8" />
    <line x1="6" y1="6" x2="25" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="12" x2="20" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="18" x2="28" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Pen -->
  <rect x="65" y="195" width="25" height="4" rx="2" fill="#0284c7" transform="rotate(15 65 195)" />

</svg>