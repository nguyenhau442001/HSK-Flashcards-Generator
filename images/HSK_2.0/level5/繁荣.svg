<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>

    <!-- Golden Window Lights -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Neon Cyan Accent -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Vibrant Orange Accent -->
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Bridge Deck Gradient -->
    <linearGradient id="bridgeDeck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Water River Gradient -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Sky Glow -->
  <rect x="0" y="0" width="240" height="150" fill="url(#skyGrad)"/>

  <!-- Background Stars / City Sparkles -->
  <circle cx="30" cy="35" r="1" fill="#fef08a" opacity="0.6"/>
  <circle cx="70" cy="20" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="120" cy="28" r="1" fill="#fef08a" opacity="0.4"/>
  <circle cx="180" cy="18" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="215" cy="45" r="1" fill="#fef08a" opacity="0.5"/>

  <!-- Far Background Skyscrapers (Silhouettes) -->
  <g fill="#1e293b" opacity="0.7">
    <rect x="15" y="70" width="22" height="85"/>
    <rect x="39" y="55" width="28" height="100"/>
    <rect x="175" y="60" width="25" height="95"/>
    <rect x="202" y="80" width="24" height="75"/>
  </g>

  <!-- Mid-Ground Skyline Left -->
  <g fill="#334155">
    <!-- Building L1 -->
    <path d="M 25 155 L 25 90 L 55 90 L 55 155 Z"/>
    <rect x="30" y="98" width="5" height="8" fill="url(#windowGlow)"/>
    <rect x="40" y="98" width="5" height="8" fill="url(#windowGlow)"/>
    <rect x="30" y="114" width="5" height="8" fill="url(#windowGlow)"/>
    <rect x="40" y="114" width="5" height="8" fill="url(#windowGlow)"/>
    <rect x="30" y="130" width="5" height="8" fill="url(#windowGlow)"/>
    <rect x="40" y="130" width="5" height="8" fill="url(#windowGlow)"/>

    <!-- Building L2 (Modern Tower) -->
    <path d="M 55 155 L 55 45 L 85 55 L 85 155 Z" fill="#3b82f6" opacity="0.3"/>
    <path d="M 60 155 L 60 50 L 80 58 L 80 155 Z" fill="#1e293b"/>
    <!-- Glowing lines on tower -->
    <line x1="70" y1="50" x2="70" y2="155" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" filter="url(#glow)"/>
    <rect x="65" y="70" width="10" height="4" fill="url(#windowGlow)"/>
    <rect x="65" y="90" width="10" height="4" fill="url(#windowGlow)"/>
    <rect x="65" y="110" width="10" height="4" fill="url(#windowGlow)"/>
    <rect x="65" y="130" width="10" height="4" fill="url(#windowGlow)"/>
  </g>

  <!-- Mid-Ground Skyline Right (Iconic Landmark & Skyscrapers) -->
  <g fill="#334155">
    <!-- Building R1 -->
    <path d="M 145 155 L 145 65 L 175 65 L 175 155 Z"/>
    <rect x="153" y="75" width="6" height="6" fill="url(#windowGlow)"/>
    <rect x="163" y="75" width="6" height="6" fill="url(#windowGlow)"/>
    <rect x="153" y="90" width="6" height="6" fill="url(#windowGlow)"/>
    <rect x="163" y="90" width="6" height="6" fill="url(#windowGlow)"/>
    <rect x="153" y="105" width="6" height="6" fill="url(#windowGlow)"/>
    <rect x="163" y="105" width="6" height="6" fill="url(#windowGlow)"/>
    <rect x="153" y="120" width="6" height="6" fill="url(#windowGlow)"/>
    <rect x="163" y="120" width="6" height="6" fill="url(#windowGlow)"/>

    <!-- Building R2 (Futuristic Curved/Diagonal Top) -->
    <path d="M 178" y="155" />
    <polygon points="178,155 178,40 205,50 212,155" fill="#475569"/>
    <!-- Neon Stripe on R2 -->
    <path d="M 195 45 L 195 155" stroke="url(#neonOrange)" stroke-width="3" filter="url(#glow)"/>
    <rect x="185" y="70" width="5" height="12" fill="url(#windowGlow)"/>
    <rect x="185" y="95" width="5" height="12" fill="url(#windowGlow)"/>
    <rect x="185" y="120" width="5" height="12" fill="url(#windowGlow)"/>
  </g>

  <!-- Centerpiece: The Grand Modern Bridge / Trade Arch -->
  <g>
    <!-- Bridge Piers / Supports -->
    <path d="M 85 160 L 95 110 L 105 110 L 115 160 Z" fill="#475569"/>
    <path d="M 125 160 L 135 110 L 145 110 L 155 160 Z" fill="#475569"/>
    
    <!-- Arch Span -->
    <path d="M 75 135 Q 120 90 165 135" stroke="#64748b" stroke-width="6" fill="none"/>
    <path d="M 75 135 Q 120 90 165 135" stroke="url(#neonCyan)" stroke-width="2" fill="none" filter="url(#glow)"/>

    <!-- Bridge Deck -->
    <rect x="65" y="132" width="110" height="8" rx="2" fill="url(#bridgeDeck)"/>
    <!-- Traffic lights / motion blur on bridge -->
    <line x1="75" y1="135" x2="95" y2="135" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="105" y1="135" x2="125" y2="135" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="135" y1="135" x2="155" y2="135" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground Waterway -->
  <path d="M 0 155 Q 60 148 120 155 Q 180 162 240 155 L 240 240 L 0 240 Z" fill="url(#riverGrad)"/>

  <!-- Water Reflections -->
  <ellipse cx="70" cy="170" rx="25" ry="3" fill="#38bdf8" opacity="0.3" filter="url(#glow)"/>
  <ellipse cx="140" cy="180" rx="35" ry="4" fill="#fb923c" opacity="0.25" filter="url(#glow)"/>
  <ellipse cx="180" cy="168" rx="20" ry="2.5" fill="#fef08a" opacity="0.4" filter="url(#glow)"/>

  <!-- Sleek Modern Cruise / Cargo Ship on River (Symbol of Commerce & Prosperity) -->
  <g transform="translate(90, 158)">
    <!-- Hull -->
    <path d="M 10 12 L 55 12 C 58 12 60 15 58 18 L 52 24 C 50 25 48 26 45 26 L 5 26 C 2 26 0 24 2 21 L 7 14 C 8 12 9 12 10 12 Z" fill="#0f172a"/>
    <path d="M 12 14 L 53 14 C 55 14 56 16 55 18 L 50 23 C 49 24 47 24 45 24 L 10 24 C 8 24 6 24 7 21 L 10 15 C 10 14 11 14 12 14 Z" fill="#38bdf8" opacity="0.8"/>
    
    <!-- Superstructure / Windows -->
    <rect x="18" y="4" width="22" height="10" rx="2" fill="#e2e8f0"/>
    <rect x="22" y="6" width="4" height="6" fill="#0f172a"/>
    <rect x="30" y="6" width="4" height="6" fill="#0f172a"/>

    <!-- Upper Deck Light -->
    <circle cx="29" cy="2" r="1.5" fill="#ef4444" filter="url(#glow)"/>

    <!-- Wake / Waves -->
    <path d="M -2 22 Q -8 20 -12 24" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M -5 26 Q -10 24 -15 28" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.5"/>
  </g>

  <!-- Vibrant Financial / Growth Upward Chart Overlay (Integrated subtly into urban scene) -->
  <g opacity="0.85">
    <!-- Glowing Trend Line -->
    <path d="M 15 210 Q 50 200 80 185 T 145 155 T 210 120" stroke="url(#neonOrange)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Prosperity Data Points / Glowing Nodes -->
    <circle cx="80" cy="185" r="3" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="145" cy="155" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="210" cy="120" r="4" fill="#10b981" filter="url(#glow)"/>

    <!-- Floating Upward Growth Sparkles (Coins/Stars abstracted as bright kinetic sparks) -->
    <!-- Sparkle 1 -->
    <path d="M 145 135 L 147 142 L 154 144 L 147 146 L 145 153 L 143 146 L 136 144 L 143 142 Z" fill="#fef08a" opacity="0.9" transform="scale(0.6) translate(110, 30)" filter="url(#glow)"/>
    <!-- Sparkle 2 -->
    <path d="M 210 100 L 212 107 L 219 109 L 212 111 L 210 118 L 208 111 L 201 109 L 208 107 Z" fill="#38bdf8" opacity="0.9" transform="scale(0.8) translate(55, -20)" filter="url(#glow)"/>
  </g>

  <!-- Foreground Ambient Lights / Bokeh for Depth -->
  <circle cx="25" cy="210" r="2" fill="#38bdf8" opacity="0.6" filter="url(#glow)"/>
  <circle cx="45" cy="225" r="3" fill="#fb923c" opacity="0.5" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="2.5" fill="#fef08a" opacity="0.7" filter="url(#glow)"/>
  <circle cx="225" cy="215" r="1.5" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>

  <!-- Crisp Vignette Border (Inner Frame) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
</svg>