<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>

    <!-- Lamp Warm Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </radialGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Wall Details -->
  <!-- Window Frame -->
  <rect x="156" y="24" width="60" height="85" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <line x1="186" y1="24" x2="186" y2="109" stroke="#334155" stroke-width="2" />
  <line x1="156" y1="66" x2="216" y2="66" stroke="#334155" stroke-width="2" />
  <!-- Cityscape silhouette outside window -->
  <path d="M162 109 L162 90 L170 90 L170 109 L180 109 L180 75 L192 75 L192 109 L204 109 L204 82 L210 82 L210 109 Z" fill="#1e293b" />
  <!-- Light beam from window -->
  <polygon points="156,24 216,24 120,165 40,165" fill="url(#lightBeam)" />

  <!-- Wall Shelf with Books & Plant -->
  <rect x="24" y="45" width="70" height="4" rx="2" fill="#475569" />
  <!-- Books -->
  <rect x="32" y="25" width="10" height="20" rx="2" fill="#ec4899" />
  <rect x="43" y="22" width="12" height="23" rx="2" fill="#38bdf8" />
  <!-- Small Potted Plant on Shelf -->
  <path d="M72 45 L70 36 L80 36 L78 45 Z" fill="#cbd5e1" />
  <path d="M75 36 C73 30 70 26 65 24 C72 26 75 32 75 36 Z" fill="url(#plantGrad)" />
  <path d="M75 36 C77 30 82 26 87 24 C80 26 77 32 75 36 Z" fill="url(#plantGrad)" />

  <!-- Cork Board with Sticky Notes -->
  <rect x="104" y="30" width="40" height="35" rx="3" fill="#78350f" stroke="#92400e" stroke-width="2" />
  <rect x="110" y="36" width="12" height="10" rx="1" fill="#fef08a" />
  <rect x="127" y="42" width="12" height="14" rx="1" fill="#fed7aa" />
  <circle cx="116" cy="36" r="1.5" fill="#ef4444" />
  <circle cx="133" cy="42" r="1.5" fill="#38bdf8" />

  <!-- Desk Surface -->
  <path d="M12 165 L228 165 C231.3 165 234 167.7 234 171 L234 228 C234 231.3 231.3 234 228 234 L12 234 C8.7 234 6 231.3 6 228 L6 171 C6 167.7 8.7 165 12 165 Z" fill="url(#deskGrad)" />
  <rect x="6" y="165" width="228" height="6" fill="#475569" opacity="0.5" />

  <!-- Desk Lamp -->
  <path d="M200 165 L200 135" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <path d="M200 135 L180 115" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <path d="M172 105 C170 100 174 95 180 95 L195 95 C201 95 205 100 203 105 Z" fill="#fb923c" />
  <ellipse cx="187" cy="140" rx="35" ry="25" fill="url(#lampGlow)" />

  <!-- Computer Setup -->
  <!-- Monitor Stand -->
  <rect x="105" y="145" width="18" height="20" fill="#475569" />
  <ellipse cx="114" cy="165" rx="22" ry="4" fill="#334155" />
  <!-- Monitor Body -->
  <rect x="74" y="90" width="80" height="55" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <!-- Screen Content (Dashboard/Workflow visualization) -->
  <rect x="80" y="96" width="68" height="43" rx="3" fill="#1e293b" />
  <circle cx="114" cy="117" r="30" fill="url(#screenGlow)" />
  <!-- UI Dashboard Elements -->
  <rect x="86" y="102" width="25" height="6" rx="2" fill="#38bdf8" />
  <rect x="86" y="112" width="56" height="4" rx="1" fill="#64748b" />
  <rect x="86" y="120" width="40" height="4" rx="1" fill="#64748b" />
  <!-- Graphic Chart inside screen -->
  <polyline points="90,135 100,128 110,132 125,122 135,125" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Keyboard & Mouse -->
  <rect x="94" y="172" width="40" height="12" rx="2" fill="#cbd5e1" />
  <rect x="140" y="172" width="10" height="12" rx="3" fill="#cbd5e1" />

  <!-- Coffee Mug -->
  <rect x="45" y="150" width="14" height="18" rx="3" fill="#f8fafc" />
  <path d="M59 154 C64 154 64 164 59 164" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <!-- Steam from coffee -->
  <path d="M49 143 C47 139 51 137 49 133" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Character (Professional working diligently at desk) -->
  <!-- Chair Back -->
  <path d="M35 95 C35 85 45 80 55 80 L65 80 C75 80 85 85 85 95 L85 165 L35 165 Z" fill="#334155" />
  <path d="M42 95 L78 95 L78 155 L42 155 Z" fill="#1e293b" />

  <!-- Character Body / Torso -->
  <path d="M38 180 C38 150 48 135 68 135 C88 135 98 150 98 180 L98 210 L38 210 Z" fill="#3b82f6" />
  <!-- Collar / Shirt Detail -->
  <path d="M56 135 L68 150 L80 135 Z" fill="#f8fafc" />
  <path d="M68 150 L68 165" stroke="#cbd5e1" stroke-width="2" />

  <!-- Character Arms / Hands -->
  <!-- Left arm reaching for keyboard -->
  <path d="M42 155 C38 170 65 180 85 178" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hand -->
  <circle cx="88" cy="177" r="5" fill="#fbcfe8" />

  <!-- Head & Face -->
  <!-- Neck -->
  <rect x="60" y="125" width="16" height="15" fill="#fbcfe8" />
  <!-- Head Base -->
  <circle cx="68" cy="105" r="22" fill="#fbcfe8" />
  <!-- Hair Style (Modern neat haircut) -->
  <path d="M47 105 C46 90 55 82 70 82 C85 82 91 92 90 105 C88 100 83 93 68 93 C53 93 48 100 47 105 Z" fill="#0f172a" />
  <path d="M48 102 C50 95 58 90 68 90 C78 90 85 95 88 102 C89 97 84 88 68 88 C52 88 47 97 48 102 Z" fill="#1e293b" />

  <!-- Facial Expression (Focused, confident smile) -->
  <!-- Glasses -->
  <rect x="54" y="98" width="12" height="9" rx="2" fill="none" stroke="#0f172a" stroke-width="2" />
  <rect x="70" y="98" width="12" height="9" rx="2" fill="none" stroke="#0f172a" stroke-width="2" />
  <line x1="66" y1="102" x2="70" y2="102" stroke="#0f172a" stroke-width="2" />
  <!-- Eyes (Happy / focused closed arches or dots) -->
  <circle cx="60" cy="102" r="1.5" fill="#0f172a" />
  <circle cx="76" cy="102" r="1.5" fill="#0f172a" />
  <!-- Gentle Smile -->
  <path d="M64 113 C66 115 70 115 72 113" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <!-- Rosy Cheeks -->
  <circle cx="56" cy="110" r="3" fill="#f43f5e" opacity="0.3" />
  <circle cx="80" cy="110" r="3" fill="#f43f5e" opacity="0.3" />

</svg>