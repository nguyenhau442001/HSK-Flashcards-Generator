<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Water Glow Gradient -->
    <linearGradient id="waterStream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Bucket Metallic Gradient -->
    <linearGradient id="bucketGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric background details (Tile wall pattern) -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.4">
    <line x1="0" y1="60" x2="240" y2="60" />
    <line x1="0" y1="120" x2="240" y2="120" />
    <line x1="0" y1="180" x2="240" y2="180" />
    <line x1="80" y1="0" x2="80" y2="240" />
    <line x1="160" y1="0" x2="160" y2="240" />
  </g>

  <!-- Sink / Basin Countertop -->
  <rect x="20" y="170" width="200" height="40" rx="6" fill="#334155" filter="url(#dropShadow)" />
  <rect x="30" y="180" width="180" height="15" rx="3" fill="#475569" />

  <!-- Water Tap / Faucet Fixture (Mounted on wall) -->
  <g filter="url(#dropShadow)">
    <rect x="105" y="55" width="30" height="25" rx="4" fill="#cbd5e1" />
    <!-- Curved Spout -->
    <path d="M120 80 V 100 C 120 115, 100 115, 95 105" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />
    <!-- Faucet Handle -->
    <rect x="95" y="45" width="50" height="12" rx="3" fill="#fb923c" />
    <circle cx="120" cy="51" r="4" fill="#ea580c" />
  </g>

  <!-- Strained Water Stream (Showing maximum effort: tense, thick, curving just right) -->
  <path d="M92 110 C 92 135, 94 150, 92 185" fill="none" stroke="url(#waterStream)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <!-- Water Splash / Droplets -->
  <circle cx="92" cy="183" r="5" fill="#38bdf8" opacity="0.8" />
  <path d="M85 175 Q 92 165 99 175" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" />

  <!-- Main Subject: Tilted, Overfilled Golden Bucket (Representing 'cố gắng hết mức' - max capacity) -->
  <g transform="translate(10, 15)" filter="url(#dropShadow)">
    <!-- Bucket Body -->
    <path d="M 60 110 L 85 170 C 86 172, 88 174, 91 174 H 149 C 152 174, 154 172, 155 170 L 180 110 Z" fill="url(#bucketGrad)" />
    
    <!-- Bucket Top Ellipse (Rim) -->
    <ellipse cx="120" cy="110" rx="60" ry="12" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" />

    <!-- Overflowing Water Inside & Spilling Over (Max Effort Concept) -->
    <ellipse cx="120" cy="112" rx="54" ry="9" fill="#38bdf8" />
    <!-- Splashing Water Waves over Rim -->
    <path d="M 65 110 Q 75 102 85 110 Q 95 118 105 110 Q 115 102 125 110 Q 135 118 145 110 Q 155 102 175 112" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" />

    <!-- Bucket Handle (Swung back) -->
    <path d="M 63 105 C 40 80, 200 80, 177 105" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" />

    <!-- Ribs / Details on Bucket -->
    <path d="M 69 130 H 171" stroke="#d97706" stroke-width="3" opacity="0.5" />
    <path d="M 75 150 H 165" stroke="#d97706" stroke-width="3" opacity="0.5" />
  </g>

  <!-- Dynamic Overflowing Drops & Ripples -->
  <g fill="#38bdf8">
    <circle cx="75" cy="135" r="3" />
    <circle cx="65" cy="145" r="2" />
    <circle cx="170" cy="130" r="3.5" />
    <circle cx="182" cy="142" r="2" />
    <!-- Tiny action motion lines -->
    <path d="M 178 120 Q 185 125 180 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Action "Maximum Level" Gauge / Meter Floating nearby -->
  <g transform="translate(180, 50)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="36" height="80" rx="18" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <!-- Fill Level (Full to the brim) -->
    <rect x="6" y="6" width="24" height="68" rx="12" fill="#ef4444" />
    <!-- Lightning Bolt / Max Energy Icon inside gauge -->
    <path d="M 18 20 L 12 42 H 20 L 16 60 L 26 36 H 18 Z" fill="#fef08a" />
  </g>

  <!-- Sparkles / High-intensity Effort Accents -->
  <g fill="#fbbf24">
    <!-- Top-left Sparkle -->
    <path d="M 45 40 Q 45 50 35 50 Q 45 50 45 60 Q 45 50 55 50 Q 45 50 45 40" />
    <!-- Right Sparkle -->
    <path d="M 160 30 Q 160 37 153 37 Q 160 37 160 44 Q 160 37 167 37 Q 160 37 160 30" />
  </g>

</svg>