<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wall & Floor Gradients -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    
    <!-- Window Light -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Scene: Internal Medicine Clinic (科 - Office/Consultation Room) -->
  
  <!-- Back Wall -->
  <rect x="15" y="15" width="210" height="150" fill="url(#wallGrad)" rx="4" />
  
  <!-- Baseboard Trim -->
  <rect x="15" y="160" width="210" height="4" fill="#475569" />

  <!-- Floor -->
  <path d="M 15 164 L 225 164 L 235 225 L 5 225 Z" fill="url(#floorGrad)" />
  
  <!-- Floor Tile Lines (Perspective) -->
  <path d="M 60 164 L 30 225 M 120 164 L 120 225 M 180 164 L 210 225" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />

  <!-- Background Window with Medical Cross / Sci-fi vibe -->
  <g opacity="0.8">
    <rect x="25" y="30" width="45" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <rect x="29" y="34" width="37" height="62" fill="url(#windowLight)" />
    <!-- Window Panes -->
    <line x1="47" y1="34" x2="47" y2="96" stroke="#475569" stroke-width="1.5" />
    <line x1="29" y1="65" x2="66" y2="65" stroke="#475569" stroke-width="1.5" />
  </g>

  <!-- Medical Wall Chart (Internal Medicine Diagnostic Chart) -->
  <g transform="translate(85, 25)">
    <rect x="0" y="0" width="50" height="65" rx="2" fill="#f8fafc" filter="url(#shadow)" />
    <!-- Hanging Clips -->
    <rect x="15" y="-4" width="20" height="5" rx="1" fill="#94a3b8" />
    <line x1="25" y1="-7" x2="25" y2="-4" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Chart Content (Abstract Heart/Organ rhythm representing internal medicine) -->
    <path d="M 10 20 Q 25 5 40 20 Q 25 35 10 20 Z" fill="#ef4444" opacity="0.8" />
    <path d="M 10 45 L 20 45 L 23 38 L 27 52 L 30 43 L 33 48 L 36 45 L 42 45" stroke="#0284c7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="25" cy="56" r="2" fill="#94a3b8" />
  </g>

  <!-- Medical Cabinet in Background -->
  <g transform="translate(155, 35)">
    <rect x="0" y="0" width="45" height="95" fill="#334155" rx="2" />
    <rect x="4" y="8" width="37" height="40" fill="#1e293b" />
    <rect x="4" y="52" width="37" height="38" fill="#1e293b" />
    <!-- Glass reflections / Shelves -->
    <line x1="4" y1="28" x2="41" y2="28" stroke="#475569" stroke-width="1" />
    <line x1="4" y1="71" x2="41" y2="71" stroke="#475569" stroke-width="1" />
    <!-- Handles -->
    <circle cx="20" cy="45" r="1.5" fill="#94a3b8" />
    <circle cx="20" cy="88" r="1.5" fill="#94a3b8" />
  </g>

  <!-- Doctor's Desk (Foreground Center) -->
  <g transform="translate(45, 125)">
    <!-- Desk Base / Shadow -->
    <path d="M 0 20 L 150 20 L 140 65 L 10 65 Z" fill="#0f172a" opacity="0.5" />
    
    <!-- Desk Main Body -->
    <path d="M 10 10 L 140 10 L 145 55 L 5 55 Z" fill="#475569" filter="url(#shadow)" />
    <!-- Desk Top Surface -->
    <polygon points="5,10 145,10 135,0 15,0" fill="#64748b" />
    <!-- Desk Front panel detail -->
    <rect x="15" y="18" width="120" height="30" rx="2" fill="#334155" />
  </g>

  <!-- Desktop Equipment & Diagnostic Props -->
  
  <!-- Medical Monitor / Diagnostic Display -->
  <g transform="translate(95, 95)">
    <!-- Stand -->
    <rect x="22" y="25" width="6" height="10" fill="#64748b" />
    <ellipse cx="25" cy="35" rx="12" ry="3" fill="#334155" />
    <!-- Monitor Screen -->
    <rect x="0" y="0" width="50" height="28" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2" filter="url(#shadow)" />
    <!-- EKG Waveform on Screen -->
    <path d="M 5 14 L 15 14 L 18 8 L 22 22 L 26 10 L 30 18 L 33 14 L 45 14" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Vital stats dots -->
    <circle cx="10" cy="5" r="1.5" fill="#10b981" />
    <circle cx="40" cy="5" r="1.5" fill="#ef4444" />
  </g>

  <!-- Stethoscope (Classic Internal Medicine Symbol) draped on desk -->
  <g transform="translate(55, 115)">
    <!-- Tubing -->
    <path d="M 10 15 C 20 25, 30 5, 45 15 C 60 25, 65 10, 75 20" stroke="#ec4899" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#shadow)" />
    <!-- Chest piece -->
    <circle cx="78" cy="23" r="7" fill="#cbd5e1" filter="url(#shadow)" />
    <circle cx="78" cy="23" r="4" fill="#94a3b8" />
    <!-- Ear tubes -->
    <path d="M 7 12 C 3 10, 2 5, 6 2" stroke="#cbd5e1" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 13 12 C 16 10, 17 5, 13 2" stroke="#cbd5e1" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Medical Clipboard with Chart -->
  <g transform="translate(130, 110) rotate(10)" filter="url(#shadow)">
    <rect x="0" y="0" width="30" height="38" rx="2" fill="#cbd5e1" />
    <rect x="3" y="4" width="24" height="31" fill="#ffffff" rx="1" />
    <!-- Clip -->
    <rect x="10" y="-2" width="10" height="5" rx="1" fill="#64748b" />
    <!-- Lines of writing / patient chart -->
    <line x1="6" y1="10" x2="20" y2="10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="16" x2="24" y2="16" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="22" x2="18" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="28" x2="22" y2="28" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Red cross accent stamp -->
    <circle cx="20" cy="25" r="4" fill="#ef4444" opacity="0.8" />
    <path d="M 18 25 L 22 25 M 20 23 L 20 27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Medicine Pill Bottle & Pills -->
  <g transform="translate(30, 120)">
    <!-- Bottle Body -->
    <rect x="0" y="8" width="18" height="25" rx="3" fill="#f59e0b" opacity="0.9" filter="url(#shadow)" />
    <!-- White Label -->
    <rect x="2" y="13" width="14" height="15" fill="#ffffff" rx="1" />
    <line x1="5" y1="17" x2="13" y2="17" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    <line x1="5" y1="22" x2="11" y2="22" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <!-- Cap -->
    <rect x="4" y="3" width="10" height="6" rx="2" fill="#0284c7" />
    
    <!-- Loose pills nearby -->
    <ellipse cx="-6" cy="30" rx="3" ry="2" fill="#10b981" transform="rotate(-20 -6 30)" filter="url(#shadow)" />
    <circle cx="-1" cy="32" r="2" fill="#fb923c" filter="url(#shadow)" />
  </g>

  <!-- Examination Lamp (Standing Angle Light) on the right side -->
  <g transform="translate(195, 90)">
    <!-- Lamp Base/Pole running up -->
    <line x1="0" y1="80" x2="0" y2="-20" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <!-- Articulated Arm -->
    <path d="M 0 -20 L -25 -10" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Lamp Shade & Glow -->
    <g transform="translate(-32, -5) rotate(25)">
      <!-- Light Cone projecting down towards desk -->
      <path d="M 0 0 L -40 80 L 20 80 Z" fill="url(#lampGlow)" style="mix-blend-mode: screen;" />
      <!-- Dome Shade -->
      <path d="M -10 -8 L 10 -8 L 15 5 L -15 5 Z" fill="#38bdf8" filter="url(#shadow)" />
      <!-- Bulb emission point -->
      <circle cx="0" cy="5" r="4" fill="#fbbf24" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements / Soft Vignette Frame Accent -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.1" />

  <!-- Professional Medical Cross Symbol Badge (Subtle on back wall) -->
  <g transform="translate(112, 45)" opacity="0.15">
    <rect x="6" y="0" width="8" height="20" rx="2" fill="#38bdf8" />
    <rect x="0" y="6" width="20" height="8" rx="2" fill="#38bdf8" />
  </g>
</svg>