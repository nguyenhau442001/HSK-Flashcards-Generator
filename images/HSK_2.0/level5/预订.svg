<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Hotel Room Ambient Light -->
    <linearGradient id="roomGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Phone Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Confirmation Checkmark Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Room Lighting Overlay -->
  <rect width="240" height="240" rx="24" fill="url(#roomGlow)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Hotel Room Headboard & Wall Decor -->
  <path d="M40 70 L200 70 L200 135 L40 135 Z" fill="#334155" opacity="0.4"/>
  <!-- Headboard Cushion Panels -->
  <rect x="55" y="80" width="35" height="50" rx="4" fill="#475569" opacity="0.6"/>
  <rect x="95" y="80" width="35" height="50" rx="4" fill="#475569" opacity="0.6"/>
  <rect x="135" y="80" width="35" height="50" rx="4" fill="#475569" opacity="0.6"/>

  <!-- Bed Pillows & Blanket -->
  <path d="M50 145 C50 135 70 130 95 130 C120 130 140 135 140 145 L140 220 L40 220 Z" fill="#64748b"/>
  <path d="M55 140 Q95 125 135 140 L130 165 Q95 155 60 165 Z" fill="#f8fafc" filter="url(#softShadow)"/>

  <!-- Bedside Table (Nightstand) -->
  <rect x="160" y="140" width="55" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="170" y="155" width="35" height="20" rx="3" fill="#334155"/>
  <circle cx="187" cy="165" r="3" fill="#f59e0b"/>
  
  <!-- Bedside Lamp -->
  <path d="M187 140 L187 115" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M172 115 L202 115 L197 95 L177 95 Z" fill="#fbbf24" filter="url(#softShadow)"/>

  <!-- Window with Night City Silhouette / Curtains -->
  <path d="M25 40 L45 40 L45 120 L25 120 Z" fill="#1e293b" opacity="0.8"/>
  <path d="M215 40 L195 40 L195 120 L215 120 Z" fill="#1e293b" opacity="0.8"/>
  <!-- Window Glass & City Lights -->
  <rect x="45" y="45" width="150" height="75" rx="2" fill="#090d16"/>
  <circle cx="70" cy="80" r="1.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="85" cy="70" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="110" cy="90" r="1.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="150" cy="75" r="1.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="175" cy="85" r="1.5" fill="#38bdf8" opacity="0.8"/>

  <!-- MAIN CHARACTER: Happy Traveler sitting on bed, having successfully booked a room -->
  <!-- Body / Torso -->
  <path d="M85 165 C85 145 115 145 115 165 L120 220 L80 220 Z" fill="#ec4899" filter="url(#softShadow)"/>
  
  <!-- Neck -->
  <path d="M95 135 L105 135 L105 148 L95 148 Z" fill="#fcd34d"/>

  <!-- Head -->
  <circle cx="100" cy="120" r="18" fill="#fcd34d" filter="url(#softShadow)"/>
  
  <!-- Hair (Stylish Bob / Short Hair) -->
  <path d="M82 118 C82 100 118 100 118 118 C118 125 115 130 112 125 C112 112 88 112 88 125 C85 130 82 125 82 118 Z" fill="#334155"/>

  <!-- Facial Expression: Smiling happily -->
  <!-- Eyes (Happy Arcs) -->
  <path d="M92 118 Q95 114 98 118" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M102 118 Q105 114 108 118" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M96 124 Q100 128 104 124" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="90" cy="122" r="2.5" fill="#f43f5e" opacity="0.4"/>
  <circle cx="110" cy="122" r="2.5" fill="#f43f5e" opacity="0.4"/>

  <!-- Left Arm (Holding the smartphone) -->
  <path d="M88 155 Q70 160 85 180" stroke="#ec4899" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="85" cy="180" r="5" fill="#fcd34d"/>

  <!-- Right Arm (Excited gesture / holding up) -->
  <path d="M112 155 Q130 140 120 125" stroke="#ec4899" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="120" cy="125" r="5" fill="#fcd34d"/>

  <!-- PROP: Smartphone displaying booking confirmation -->
  <g transform="translate(68, 160) rotate(-15)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="30" height="48" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2" filter="url(#softShadow)"/>
    <!-- Screen -->
    <rect x="3" y="4" width="24" height="40" rx="3" fill="url(#screenGrad)"/>
    <!-- UI Elements on screen: Hotel building mini icon -->
    <path d="M10 24 L20 24 L20 38 L10 38 Z" fill="#ffffff" opacity="0.3"/>
    <rect x="12" y="27" width="3" height="4" rx="0.5" fill="#38bdf8"/>
    <rect x="17" y="27" width="3" height="4" rx="0.5" fill="#38bdf8"/>
    <!-- Checkmark representing successful reservation -->
    <circle cx="15" cy="16" r="7" fill="url(#badgeGrad)"/>
    <path d="M12 16 L14 18 L18 13" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- FLOATING SUCCESS / ACTION ELEMENTS (Contextualizing "Already Booked") -->
  <!-- Floating Checkmark Badge (Top Right) -->
  <g transform="translate(170, 75)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="16" fill="url(#badgeGrad)" stroke="#1e293b" stroke-width="3"/>
    <path d="M-6 0 L-2 4 L7 -5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Keycard / Reservation Ticket Graphic floating gently -->
  <g transform="translate(145, 110) rotate(12)" filter="url(#softShadow)">
    <rect x="0" y="0" width="36" height="22" rx="4" fill="#fbbf24"/>
    <rect x="4" y="4" width="10" height="8" rx="2" fill="#78350f" opacity="0.6"/>
    <line x1="18" y1="7" x2="30" y2="7" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="18" y1="13" x2="26" y2="13" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Sparkles / Success Highlights -->
  <g fill="#fbbf24">
    <path d="M50 85 Q55 85 55 80 Q55 85 60 85 Q55 85 55 90 Q55 85 50 85 Z"/>
    <path d="M150 55 Q154 55 154 51 Q154 55 158 55 Q154 55 154 59 Q154 55 150 55 Z"/>
    <path d="M110 50 Q113 50 113 47 Q113 50 116 50 Q113 50 113 53 Q113 50 110 50 Z"/>
  </g>
</svg>