<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Wok -->
  <path d="M40 120 C40 170, 200 170, 200 120" fill="#334155" stroke="#475569" stroke-width="6"/>
  <ellipse cx="120" cy="120" rx="80" ry="20" fill="#475569"/>
  
  <!-- Oil bubbles -->
  <circle cx="90" cy="130" r="4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="150" cy="125" r="6" fill="#f59e0b" opacity="0.9"/>
  <circle cx="120" cy="140" r="3" fill="#fb923c" opacity="0.7"/>
  
  <!-- Fried food pieces (golden nuggets) -->
  <path d="M70 110 L90 90 L110 110 L90 130 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <path d="M130 100 L150 80 L170 100 L150 120 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <path d="M100 80 L120 60 L140 80 L120 100 Z" fill="#fb923c" stroke="#d97706" stroke-width="2"/>
  
  <!-- Steam/Heat lines -->
  <path d="M80 80 Q90 60 80 40" stroke="#fb923c" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M160 70 Q170 50 160 30" stroke="#fb923c" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Chopsticks -->
  <rect x="180" y="160" width="4" height="60" rx="2" fill="#ec4899" transform="rotate(-20 180 160)"/>
  <rect x="195" y="165" width="4" height="60" rx="2" fill="#ec4899" transform="rotate(-10 195 165)"/>
  
  <!-- Countertop surface -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
</svg>