<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="warm-lamp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="episode-strip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Environment / Background details -->
  <!-- Wallpaper subtle pattern / lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />
  
  <!-- Bookshelf / Prop in background -->
  <rect x="20" y="60" width="35" height="90" rx="4" fill="#334155" opacity="0.4" />
  <rect x="25" y="80" width="25" height="6" rx="2" fill="#64748b" opacity="0.6" />
  <rect x="25" y="105" width="25" height="6" rx="2" fill="#f59e0b" opacity="0.6" />
  <rect x="25" y="130" width="25" height="6" rx="2" fill="#38bdf8" opacity="0.6" />

  <!-- Floor Lamp casting warm light -->
  <path d="M210 30 L210 180" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <path d="M195 30 L225 30 L215 50 L205 50 Z" fill="#fbbf24" />
  <path d="M170 50 L250 180 L90 180 Z" fill="url(#warm-lamp)" style="mix-blend-mode: screen;" />

  <!-- Main TV / Media Setup representing "TV Drama" (电视剧) -->
  <rect x="55" y="45" width="130" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <!-- TV Screen inner -->
  <rect x="61" y="51" width="118" height="73" rx="4" fill="#1e293b" />
  <!-- TV Stand -->
  <path d="M100 130 L140 130 L145 138 L95 138 Z" fill="#475569" />

  <!-- TV Content: Dramatic Scene (Action / Story) -->
  <!-- Sunset background inside TV -->
  <rect x="61" y="51" width="118" height="73" fill="#1e1b4b" />
  <circle cx="120" cy="80" r="18" fill="#fb923c" opacity="0.8" />
  <!-- Mountains in TV show -->
  <path d="M61 110 L95 85 L125 105 L155 75 L179 110 Z" fill="#312e81" />
  <!-- Screen Glow overlay -->
  <rect x="61" y="51" width="118" height="73" fill="url(#screen-glow)" />

  <!-- Continuous Episode Connection Element (Visualizing "连续" - serial/continuous flow) -->
  <!-- Glowing continuous film strip wrapping smoothly around the TV and character -->
  <path d="M 40 160 Q 60 130 90 135 T 150 135 T 190 150" fill="none" stroke="url(#episode-strip)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <!-- Playback sequence nodes showing continuous chain -->
  <circle cx="75" cy="143" r="4" fill="#fff" />
  <circle cx="105" cy="135" r="4" fill="#fff" />
  <circle cx="135" cy="135" r="4" fill="#fff" />
  <circle cx="165" cy="142" r="4" fill="#fff" />

  <!-- Sofa / Couch where the viewer sits -->
  <path d="M 40 145 Q 120 135 200 145 L 205 190 Q 120 200 35 190 Z" fill="#334155" />
  <path d="M 30 140 Q 120 125 210 140 L 215 175 Q 120 185 25 175 Z" fill="#475569" />
  <!-- Cozy cushion details -->
  <rect x="50" y="150" width="60" height="30" rx="8" fill="#475569" opacity="0.5" />
  <rect x="130" y="150" width="60" height="30" rx="8" fill="#475569" opacity="0.5" />

  <!-- Character: Relaxed viewer immersed in the continuous TV drama -->
  <!-- Body/Hoodie -->
  <path d="M 95 190 C 95 160 110 150 120 150 C 130 150 145 160 145 190 Z" fill="#38bdf8" />
  
  <!-- Head & Hair -->
  <circle cx="120" cy="132" r="16" fill="#fbcfe8" />
  <!-- Hair style -->
  <path d="M 104 130 C 104 115 136 115 136 130 C 136 135 130 130 120 126 C 110 130 104 135 104 130 Z" fill="#1e293b" />

  <!-- Cozy blanket over lap -->
  <path d="M 75 165 Q 120 195 165 165 L 170 195 Q 120 215 70 195 Z" fill="#ec4899" />
  <path d="M 85 172 Q 120 198 155 172" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <!-- Hand holding popcorn / snack bowl -->
  <ellipse cx="145" cy="175" rx="10" ry="6" fill="#fbcfe8" />
  <!-- Popcorn Bowl -->
  <path d="M 135 170 L 155 170 L 160 188 L 130 188 Z" fill="#f8fafc" />
  <!-- Popcorn puffs -->
  <circle cx="140" cy="168" r="4" fill="#fef08a" />
  <circle cx="146" cy="166" r="5" fill="#fef08a" />
  <circle cx="152" cy="168" r="4" fill="#fef08a" />

  <!-- Ambient lighting highlights on character -->
  <path d="M 107 145 C 112 142 128 142 133 145 C 131 138 109 138 107 145 Z" fill="#38bdf8" opacity="0.6" />

</svg>