<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Glow/Highlight -->
    <linearGradient id="c1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Character 2 Glow/Highlight -->
    <linearGradient id="c2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Lighting Effect -->
  <circle cx="120" cy="120" r="120" fill="url(#spotlight)" />

  <!-- Interior Background Elements (Room Setting) -->
  <g id="room-props">
    <!-- Window frame looking out into a night city -->
    <rect x="25" y="30" width="70" height="90" rx="6" fill="#090d16" stroke="#334155" stroke-width="2" />
    <!-- City lights outside window -->
    <rect x="35" y="50" width="10" height="15" rx="1" fill="#fbbf24" opacity="0.6" />
    <rect x="50" y="45" width="12" height="25" rx="1" fill="#38bdf8" opacity="0.5" />
    <rect x="68" y="60" width="15" height="30" rx="1" fill="#ec4899" opacity="0.4" />
    <rect x="40" y="80" width="8" height="20" rx="1" fill="#34d399" opacity="0.5" />
    <!-- Bookshelf in background -->
    <rect x="155" y="40" width="55" height="110" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="4" />
    <line x1="155" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="1.5" />
    <line x1="155" y1="110" x2="210" y2="110" stroke="#334155" stroke-width="1.5" />
    <line x1="155" y1="145" x2="210" y2="145" stroke="#334155" stroke-width="1.5" />
    <!-- Colorful books on shelf -->
    <rect x="165" y="52" width="8" height="23" rx="1" fill="#f59e0b" />
    <rect x="175" y="48" width="12" height="27" rx="1" fill="#10b981" />
    <rect x="190" y="55" width="6" height="20" rx="1" fill="#ef4444" />
    <rect x="163" y="85" width="10" height="25" rx="1" fill="#8b5cf6" />
    <rect x="175" y="88" width="8" height="22" rx="1" fill="#3b82f6" />
    <rect x="187" y="82" width="14" height="28" rx="1" fill="#ec4899" />
  </g>

  <!-- Floor / Room Base -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#090d16" />
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2" />

  <!-- Furniture: Small Table / Stand -->
  <g id="table">
    <rect x="90" y="150" width="60" height="45" rx="4" fill="#334155" filter="url(#shadow)" />
    <rect x="95" y="155" width="50" height="8" rx="2" fill="#475569" />
    <!-- Lamp on table -->
    <path d="M 115 155 L 125 135 L 135 155 Z" fill="#fbbf24" />
    <line x1="125" y1="155" x2="125" y2="150" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- CHARACTER 1: The Speaker (Left, confident posture, speaking into space) -->
  <g id="speaker-character" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M 55 195 C 55 170 65 155 80 155 C 95 155 105 170 105 195 Z" fill="url(#c1Grad)" />
    <!-- Head & Hair -->
    <circle cx="80" cy="130" r="18" fill="#fbcfe8" />
    <path d="M 62 130 C 62 115 72 110 85 112 C 96 114 98 126 98 135 C 92 130 80 128 62 130 Z" fill="#475569" />
    <!-- Face Expression (Confident/Talking) -->
    <circle cx="86" cy="130" r="1.5" fill="#1e293b" />
    <path d="M 87 136 C 89 138 91 138 93 136" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Gesture: Pointing / Talking Hand -->
    <circle cx="95" cy="165" r="5" fill="#fbcfe8" />

    <!-- Speech Indicator / Soundwaves coming from Character 1 -->
    <path d="M 105 125 C 112 122 112 135 105 138" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 110 120 C 120 115 120 140 110 145" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7" />
  </g>

  <!-- CHARACTER 2: The Mimicker / Imitator (Right, leaning in closely, observing and copying) -->
  <g id="imitator-character" filter="url(#shadow)">
    <!-- Body / Torso (Leaning forward slightly) -->
    <path d="M 140 195 C 142 172 152 158 168 155 C 182 152 195 168 195 195 Z" fill="url(#c2Grad)" />
    <!-- Head & Hair -->
    <circle cx="165" cy="128" r="18" fill="#bae6fd" />
    <path d="M 150 120 C 150 110 162 108 175 112 C 182 114 182 124 182 132 C 172 126 160 125 150 120 Z" fill="#1e293b" />
    <!-- Face Expression (Imitating, concentrated, smiling fun match) -->
    <circle cx="159" cy="127" r="1.5" fill="#0f172a" />
    <!-- Mimicking speech shape or gesture -->
    <path d="M 157 134 C 160 137 163 137 166 134" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Hand on chin / thoughtful mimicking gesture -->
    <circle cx="152" cy="150" r="5" fill="#bae6fd" />

    <!-- Mirror / Echo Visual Waves (Representing imitation/copying) -->
    <path d="M 142 125 C 135 122 135 135 142 138" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Action Flow / Copycat Symbol Elements (Subtle visual reinforcement of "mófǎng" / copying) -->
  <g opacity="0.8">
    <!-- Floating mirrored dialogue cues between them -->
    <path d="M 115 110 C 125 100 135 100 145 110" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" fill="none" stroke-linecap="round" />
    <!-- Echo stars/sparks -->
    <path d="M 128 102 L 130 107 L 135 109 L 130 111 L 128 116 L 126 111 L 121 109 L 126 107 Z" fill="#fbbf24" transform="scale(0.6) translate(80, 50)" />
    <path d="M 128 102 L 130 107 L 135 109 L 130 111 L 128 116 L 126 111 L 121 109 L 126 107 Z" fill="#38bdf8" transform="scale(0.4) translate(250, 110)" />
  </g>

  <!-- Foreground framing elements for artistic polish -->
  <!-- Plant pot on the left for depth -->
  <g id="foreground-plant">
    <path d="M 10 185 L 25 185 L 22 210 L 13 210 Z" fill="#64748b" />
    <!-- Leaves -->
    <path d="M 17 185 C 10 170 5 150 15 130 C 5 155 12 175 17 185 Z" fill="#10b981" />
    <path d="M 18 185 C 25 165 35 145 30 125 C 25 145 20 170 18 185 Z" fill="#34d399" />
  </g>
</svg>