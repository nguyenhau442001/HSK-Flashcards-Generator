<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Glow & Environment Setup -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  <path d="M 0 180 Q 60 165 120 180 T 240 180 L 240 240 L 0 240 Z" fill="#1e293b"/>
  
  <!-- Warm Background Accent (Community center / Park tree lights) -->
  <circle cx="60" cy="80" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="180" cy="70" r="2.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="200" cy="110" r="1.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="40" cy="120" r="2" fill="#10b981" opacity="0.8"/>

  <!-- Folding Table (Volunteer Station) -->
  <path d="M 50 165 L 190 165 L 180 190 L 60 190 Z" fill="#334155"/>
  <rect x="55" y="160" width="130" height="7" rx="2" fill="#475569"/>
  <!-- Table legs -->
  <path d="M 70 190 L 60 215" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 170 190 L 180 215" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- Props on Table (Community Service/Aid: Clipboard, Leaflets, Medical cross box) -->
  <!-- Clipboard -->
  <rect x="140" y="150" width="22" height="26" rx="2" fill="#cbd5e1" transform="rotate(10 140 150)"/>
  <rect x="144" y="153" width="14" height="18" fill="#f8fafc"/>
  <line x1="147" y1="157" x2="155" y2="157" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="147" y1="162" x2="153" y2="162" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- First Aid / Care Box -->
  <rect x="75" y="145" width="26" height="20" rx="3" fill="#ef4444"/>
  <rect x="84" y="150" width="8" height="10" fill="#ffffff"/>
  <rect x="81" y="153" width="14" height="4" fill="#ffffff"/>

  <!-- Volunteer Character (Male, Young, Friendly Expression) -->
  <!-- Torso & Volunteer Vest/Sash representation -->
  <!-- Body/Shirt -->
  <path d="M 95 130 C 95 110, 145 110, 145 130 L 155 195 L 85 195 Z" fill="#0284c7"/>
  
  <!-- Volunteer Sash / High-Viz Accent -->
  <path d="M 110 112 L 140 195 L 125 195 L 100 112 Z" fill="#f59e0b"/>
  <!-- Heart Icon on Vest (Universal symbol for volunteering/caring) -->
  <path d="M 120 135 C 117 130, 110 132, 110 137 C 110 143, 120 150, 120 150 C 120 150, 130 143, 130 137 C 130 132, 123 130, 120 135 Z" fill="#ffffff"/>

  <!-- Arms & Hands -->
  <!-- Left arm holding out a care package/leaflet -->
  <path d="M 98 120 Q 80 135, 75 148" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  <!-- Right arm welcoming / gesturing -->
  <path d="M 142 120 Q 165 130, 160 150" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="74" cy="151" r="6" fill="#fdba74"/>
  <circle cx="161" cy="153" r="6" fill="#fdba74"/>

  <!-- Neck -->
  <rect x="111" y="98" width="18" height="16" fill="#fdba74"/>

  <!-- Head & Face -->
  <ellipse cx="120" cy="85" rx="22" ry="25" fill="#fdba74"/>
  
  <!-- Hair (Stylish dark modern cut) -->
  <path d="M 98 85 C 96 65, 110 58, 124 58 C 140 58, 144 70, 144 85 C 140 75, 130 68, 120 68 C 108 68, 101 75, 98 85 Z" fill="#1e293b"/>
  <path d="M 99 80 Q 106 66, 122 66 Q 138 66, 142 82 Q 135 69, 120 69 Q 105 69, 99 80 Z" fill="#334155"/>

  <!-- Facial Features -->
  <!-- Friendly Smiling Eyes -->
  <path d="M 108 82 Q 112 78, 116 82" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 124 82 Q 128 78, 132 82" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Cheeks (Warm blush) -->
  <circle cx="106" cy="88" r="4" fill="#fb7185" opacity="0.5"/>
  <circle cx="134" cy="88" r="4" fill="#fb7185" opacity="0.5"/>

  <!-- Happy Smile -->
  <path d="M 112 94 Q 120 102, 128 94" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Floating Ambient Warmth / Community Spirit Elements -->
  <g transform="translate(0, -10)">
    <path d="M 60 70 C 58 66, 52 67, 52 71 C 52 75, 60 80, 60 80 C 60 80, 68 75, 68 71 C 68 67, 62 66, 60 70 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M 185 85 C 183 81, 177 82, 177 86 C 177 90, 185 95, 185 95 C 185 95, 193 90, 193 86 C 193 82, 187 81, 185 85 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground Highlights for Depth -->
  <circle cx="120" cy="20" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="30" cy="50" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="210" cy="140" r="1.5" fill="#ffffff" opacity="0.2"/>
</svg>