<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Pollution/Smog Gradient -->
    <linearGradient id="smogGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Character 1 Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Glow & Hazard Accents -->
    <radialGradient id="hazardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Hazard Glow behind cityscape -->
  <circle cx="160" cy="120" r="80" fill="url(#hazardGlow)"/>

  <!-- BACKGROUND: Urban Cityscape & Smoky Air Pollution (危害 / 污染) -->
  <g id="environment">
    <!-- Distant buildings -->
    <rect x="140" y="80" width="30" height="100" fill="#1e293b"/>
    <rect x="180" y="60" width="40" height="120" fill="#1e293b"/>
    
    <!-- Factory smokestacks belching pollution -->
    <rect x="195" y="90" width="8" height="90" fill="#475569"/>
    <!-- Smoke clouds rising -->
    <path d="M195 90 C 180 80, 170 70, 160 50 C 150 30, 130 30, 120 40 C 110 20, 90 20, 80 40 C 60 40, 40 60, 40 80 L 220 80 L 220 180 L 195 180 Z" fill="url(#smogGrad)"/>
    
    <!-- Factory 2 -->
    <path d="M110 110 L 140 110 L 140 180 L 110 180 Z" fill="#334155"/>
    <path d="M120 110 L 125 95 L 135 95 L 140 110 Z" fill="#475569"/>
    <circle cx="125" cy="85" r="8" fill="#64748b" opacity="0.6"/>
    <circle cx="110" cy="70" r="12" fill="#64748b" opacity="0.4"/>
  </g>

  <!-- FOREGROUND / MIDGROUND: Park Bench & Characters Experiencing Health Impact (健康受损) -->
  <g id="scene_elements">
    <!-- Park Ground & Street Line -->
    <rect x="0" y="180" width="240" height="60" fill="#090d16"/>
    <path d="M0 180 L240 180" stroke="#334155" stroke-width="2"/>

    <!-- Park Bench -->
    <!-- Legs -->
    <rect x="55" y="155" width="6" height="30" fill="#94a3b8"/>
    <rect x="115" y="155" width="6" height="30" fill="#94a3b8"/>
    <!-- Seat -->
    <rect x="45" y="150" width="85" height="6" rx="3" fill="#cbd5e1"/>
    <!-- Backrest -->
    <rect x="45" y="125" width="6" height="28" rx="3" fill="#cbd5e1"/>
    <rect x="60" y="125" width="6" height="28" rx="3" fill="#cbd5e1"/>
    <rect x="75" y="125" width="6" height="28" rx="3" fill="#cbd5e1"/>
    <rect x="90" y="125" width="6" height="28" rx="3" fill="#cbd5e1"/>
    <rect x="105" y="125" width="6" height="28" rx="3" fill="#cbd5e1"/>
    <path d="M43 125 L121 125" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 1: Sitting, coughing/holding chest (Health impact / 危害) -->
  <g id="character_sitting">
    <!-- Legs -->
    <rect x="60" y="165" width="12" height="20" rx="6" fill="#3b82f6"/>
    <rect x="75" y="165" width="12" height="20" rx="6" fill="#3b82f6"/>
    <circle cx="66" cy="183" r="6" fill="#1e293b"/>
    <circle cx="81" cy="183" r="6" fill="#1e293b"/>

    <!-- Torso (slumped forward due to poor health/coughing) -->
    <path d="M58 125 Q 75 120 85 145 L 75 160 Q 55 150 58 125 Z" fill="#ec4899"/>

    <!-- Head & Hair -->
    <circle cx="70" cy="105" r="13" fill="url(#skinGrad)"/>
    <!-- Dark wavy hair -->
    <path d="M57 103 C 55 90, 80 88, 83 102 C 81 97, 60 97, 57 103 Z" fill="#0f172a"/>
    <!-- Closed eyes indicating discomfort/coughing -->
    <path d="M65 106 Q 68 109 71 106" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Hand on chest (showing respiratory distress / 危害 health) -->
    <path d="M72 135 Q 82 132 80 142" stroke="url(#skinGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="80" cy="142" r="4" fill="url(#skinGrad)"/>
  </g>

  <!-- CHARACTER 2: Standing beside, looking worried, holding a protective mask -->
  <g id="character_standing">
    <!-- Legs -->
    <rect x="145" y="130" width="10" height="55" rx="5" fill="#10b981"/>
    <rect x="163" y="130" width="10" height="55" rx="5" fill="#10b981"/>
    <ellipse cx="150" cy="185" rx="7" ry="4" fill="#1e293b"/>
    <ellipse cx="168" cy="185" rx="7" ry="4" fill="#1e293b"/>

    <!-- Torso -->
    <path d="M138 90 Q 165 90 170 135 L 140 135 Z" fill="#38bdf8"/>

    <!-- Head & Hair -->
    <circle cx="155" cy="72" r="13" fill="url(#skinGrad)"/>
    <!-- Hair -->
    <path d="M142 70 C 142 55, 168 55, 168 70 C 168 62, 142 62, 142 70 Z" fill="#94a3b8"/>
    <!-- Worried face expression -->
    <circle cx="152" cy="73" r="1.5" fill="#334155"/>
    <circle cx="159" cy="73" r="1.5" fill="#334155"/>
    <!-- Frown / worried mouth -->
    <path d="M153 82 Q 155 79 158 82" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Arm holding a medical/pollution mask -->
    <!-- Upper body arm -->
    <path d="M142 95 Q 125 105 130 115" stroke="url(#skinGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Face mask being held -->
    <g transform="translate(118, 110) rotate(-15)">
      <rect x="0" y="0" width="18" height="12" rx="4" fill="#ffffff"/>
      <path d="M3 4 L15 4 M3 8 L15 8" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M-3 6 L0 6" stroke="#94a3b8" stroke-width="2"/>
    </g>
  </g>

  <!-- HAZARD VISUAL CUES: Floating pollution particles & warning pulse -->
  <g id="pollution_particles" opacity="0.8">
    <!-- Floating toxic soot motes -->
    <circle cx="95" cy="115" r="3" fill="#cbd5e1" opacity="0.7"/>
    <circle cx="110" cy="95" r="4.5" fill="#94a3b8" opacity="0.5"/>
    <circle cx="130" cy="130" r="2" fill="#cbd5e1" opacity="0.8"/>
    <circle cx="85" cy="85" r="3.5" fill="#64748b" opacity="0.6"/>
    
    <!-- Subtle Red/Amber Danger Warning Spark / Cross icon concept (abstracted into a minimalist red hazard indicator dot, no text) -->
    <circle cx="175" cy="50" r="6" fill="#ef4444" opacity="0.8"/>
    <path d="M172 47 L178 53 M178 47 L172 53" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Haze -->
  <path d="M0 160 Q 120 140 240 160 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.2"/>
</svg>