<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm street lamp glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Fog/Mysterious atmosphere -->
    <linearGradient id="fog-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Clip Path for Canvas -->
    <clipPath id="canvas-clip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <!-- Base Background -->
    <rect width="240" height="240" fill="url(#bg-grad)"/>

    <!-- STAR/CITY SPARKLES (Distant unfamiliar city lights) -->
    <g fill="#64748b" opacity="0.4">
      <circle cx="35" cy="40" r="1"/>
      <circle cx="55" cy="25" r="1.5"/>
      <circle cx="95" cy="35" r="1"/>
      <circle cx="165" cy="30" r="1.5"/>
      <circle cx="195" cy="45" r="1"/>
      <circle cx="215" cy="25" r="1.2"/>
    </g>

    <!-- BACKGROUND BUILDINGS (Unfamiliar Alley / Cityscape) -->
    <!-- Left Building -->
    <path d="M 0,220 L 0,70 L 50,55 L 75,70 L 75,220 Z" fill="#17223b"/>
    <!-- Windows Left -->
    <rect x="15" y="85" width="12" height="18" rx="2" fill="#293548"/>
    <rect x="42" y="75" width="12" height="18" rx="2" fill="#293548"/>
    <rect x="15" y="120" width="12" height="18" rx="2" fill="#293548"/>
    <rect x="42" y="110" width="12" height="18" rx="2" fill="#38bdf8" opacity="0.2"/>

    <!-- Right Building -->
    <path d="M 160,220 L 160,50 L 210,40 L 240,65 L 240,220 Z" fill="#131c2e"/>
    <!-- Windows Right -->
    <rect x="180" y="70" width="14" height="22" rx="2" fill="url(#window-glow)" stroke="#293548" stroke-width="1"/>
    <rect x="205" y="85" width="14" height="22" rx="2" fill="#293548"/>
    <rect x="180" y="115" width="14" height="22" rx="2" fill="#293548"/>
    <rect x="205" y="130" width="14" height="22" rx="2" fill="#38bdf8" opacity="0.15"/>

    <!-- Center Alleyway/Path perspective -->
    <polygon points="75,220 160,220 135,130 95,130" fill="#0b1320"/>

    <!-- Street Lamp Post -->
    <path d="M 50,220 L 50,90 L 45,85 L 45,75 L 55,75 L 55,85 L 50,90" fill="#090d16" stroke="#293548" stroke-width="1"/>
    <!-- Lamp Glow Circle -->
    <circle cx="50" cy="75" r="35" fill="url(#lamp-glow)"/>
    <circle cx="50" cy="75" r="4" fill="#fbbf24"/>

    <!-- Ambient Fog / Atmosphere overlay -->
    <rect x="0" y="150" width="240" height="90" fill="url(#fog-grad)"/>

    <!-- SIGNAGE / UNFAMILIAR SYMBOLS (Abstract glowing neon signs in background, non-textual hieroglyphs/shapes) -->
    <g transform="translate(160, 45)">
      <rect x="0" y="0" width="35" height="12" rx="3" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
      <path d="M 8,6 L 15,3 L 22,6 L 15,9 Z" fill="#ec4899" opacity="0.8"/>
      <circle cx="27" cy="6" r="2.5" fill="#38bdf8"/>
    </g>

    <!-- GROUND / COBBLESTONE DETAILS -->
    <path d="M 0,215 Q 120,205 240,215 L 240,240 L 0,240 Z" fill="#090e18"/>
    <ellipse cx="115" cy="222" rx="70" ry="12" fill="#141c2c" opacity="0.6"/>

    <!-- MAIN CHARACTER (Lost/Uncertain Traveler) -->
    <g transform="translate(100, 115)">
      <!-- Character Shadow -->
      <ellipse cx="15" cy="103" rx="18" ry="5" fill="#05080f" opacity="0.7"/>

      <!-- Backpack (Showing traveler/stranger context) -->
      <path d="M 5,30 Q -5,35 -2,55 Q 2,70 10,75 L 15,75 Q 8,60 10,40 Z" fill="#fb923c"/>
      <path d="M 2,35 L 8,33" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

      <!-- Legs & Shoes -->
      <!-- Left leg (stepping tentatively) -->
      <path d="M 10,70 L 6,92 L 1,94" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="1" cy="94" rx="4" ry="2" fill="#0f172a"/>

      <!-- Right leg (standing firmly, hesitant) -->
      <path d="M 20,70 L 24,93 L 29,95" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="30" cy="95" rx="4" ry="2" fill="#0f172a"/>

      <!-- Coat / Torso -->
      <path d="M 8,25 Q 25,25 28,45 L 32,72 Q 20,76 8,72 L 12,45 Z" fill="#38bdf8"/>
      <!-- Coat Lapels / Details -->
      <path d="M 18,30 L 14,55 L 22,55 Z" fill="#0284c7"/>
      <line x1="18" y1="30" x2="18" y2="70" stroke="#0284c7" stroke-width="1.5"/>

      <!-- Scarf (Worn for travel/weather) -->
      <path d="M 12,20 Q 20,25 26,20 L 24,28 Q 18,32 10,27 Z" fill="#ec4899"/>
      <path d="M 23,24 L 27,38 Q 28,42 25,45" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>

      <!-- Head & Neck -->
      <path d="M 16,14 L 16,22" stroke="#fcd34d" stroke-width="5" stroke-linecap="round"/>
      <circle cx="17" cy="11" r="10" fill="#fcd34d"/>

      <!-- Hair -->
      <path d="M 8,9 Q 12,2 22,6 Q 26,9 24,14 Q 16,11 8,9 Z" fill="#334155"/>

      <!-- Face Profile / Expression (Confused, looking around) -->
      <!-- Wide questioning eyes -->
      <circle cx="21" cy="10" r="1.5" fill="#0f172a"/>
      <!-- Slightly worried eyebrows (slanted) -->
      <path d="M 19,7 L 23,8" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Small hesitant mouth (open slightly in wonder/uncertainty) -->
      <circle cx="22" cy="14" r="1" fill="#b45309"/>

      <!-- Arms and Hands holding a Map/Device -->
      <!-- Right Arm reaching forward holding paper map -->
      <path d="M 15,35 Q 28,38 35,45" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      <!-- Left Arm bent holding map side -->
      <path d="M 22,35 Q 32,30 38,40" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

      <!-- MAP PROP (Unfamiliar map being checked) -->
      <g transform="translate(32, 38) rotate(15)">
        <polygon points="0,0 22,-5 25,18 3,22" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <!-- Map abstract path lines (showing confusion) -->
        <path d="M 4,4 Q 12,2 18,10" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M 6,12 Q 14,18 20,12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
        <!-- Question mark subtly formed by path or floating near map -->
        <path d="M 12,-10 Q 17,-15 14,-20 Q 11,-24 15,-27 Q 19,-30 21,-25" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="21" cy="-21" r="0.8" fill="#f59e0b"/>
      </g>
    </g>

    <!-- FOREGROUND ELEMENTS (Depth & Framing) -->
    <!-- Out-of-focus signpost on the right edge -->
    <path d="M 230,120 L 230,240" stroke="#0b1320" stroke-width="12" stroke-linecap="round"/>
    <path d="M 215,130 L 240,135 L 240,150 L 215,145 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- Unfamiliar directional arrows on sign -->
    <path d="M 222,138 L 227,136 L 227,140 Z" fill="#38bdf8"/>
    <path d="M 233,141 L 238,139 L 238,143 Z" fill="#ec4899"/>

    <!-- Atmospheric dust motes / glowing particles floating in the air -->
    <circle cx="85" cy="90" r="1" fill="#fde047" opacity="0.6"/>
    <circle cx="130" cy="70" r="1.5" fill="#fde047" opacity="0.4"/>
    <circle cx="155" cy="110" r="1" fill="#38bdf8" opacity="0.5"/>
    <circle cx="70" cy="140" r="1.2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="110" cy="180" r="0.8" fill="#fde047" opacity="0.5"/>

  </g>
</svg>