<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background & Scene Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    
    <linearGradient id="fireGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="hoseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Burning Interior/Exterior Scene) -->
  <g id="environment">
    <!-- Window/Wall Structure -->
    <path d="M20 180 L220 180 L220 220 L20 220 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M40 60 L200 60 L200 180 L40 180 Z" fill="#1e293b" opacity="0.6"/>
    
    <!-- Ambient Fire Glow from Lower Right -->
    <circle cx="200" cy="180" r="80" fill="url(#fireGlow)" filter="url(#softGlow)"/>

    <!-- Sparks and Embers -->
    <circle cx="160" cy="120" r="2.5" fill="#fde047" opacity="0.9"/>
    <circle cx="180" cy="100" r="1.5" fill="#f97316" opacity="0.8"/>
    <circle cx="140" cy="90" r="2" fill="#fde047" opacity="0.7"/>
    <circle cx="195" cy="140" r="3" fill="#ef4444" opacity="0.8"/>
    <circle cx="125" cy="110" r="1" fill="#f97316" opacity="0.9"/>

    <!-- Dramatic Light Beam (Searchlight/Atmosphere) -->
    <polygon points="0,0 90,0 240,240 0,240" fill="url(#beamGrad)" style="mix-blend-mode: screen;"/>
  </g>

  <!-- Action Elements: Water Stream -->
  <g id="water-stream" filter="url(#dropShadow)">
    <path d="M95 105 Q130 90 180 140" fill="none" stroke="url(#waterGrad)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <path d="M95 105 Q130 90 180 140" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Splash drops -->
    <circle cx="170" cy="130" r="3" fill="#bae6fd"/>
    <circle cx="185" cy="150" r="2" fill="#7dd3fc"/>
    <circle cx="160" cy="120" r="1.5" fill="#e0f2fe"/>
  </g>

  <!-- Main Subject: Rescuer (Firefighter) -->
  <g id="firefighter" filter="url(#dropShadow)">
    <!-- Fire Hose Connection & Body Under-layer -->
    <path d="M60 140 L95 105" fill="none" stroke="url(#hoseGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M60 140 L95 105" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Firefighter Torso (Orange/Red Protective Gear) -->
    <path d="M50 120 Q65 100 85 110 L95 160 L45 160 Z" fill="#ea580c"/>
    <!-- Reflective Stripes -->
    <path d="M53 130 L87 135" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 150 L91 155" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>

    <!-- Arms & Gloves -->
    <path d="M75 110 L100 100" fill="none" stroke="#ea580c" stroke-width="10" stroke-linecap="round"/>
    <!-- Hands holding nozzle -->
    <circle cx="95" cy="105" r="5" fill="#334155"/>

    <!-- Head & Helmet -->
    <!-- Head / Visor Area -->
    <path d="M62 85 C62 70 78 70 78 85 Z" fill="#334155"/>
    <path d="M65 82 C65 75 75 75 75 82 Z" fill="#38bdf8" opacity="0.8"/> <!-- Visor -->

    <!-- Firefighter Helmet -->
    <path d="M50 78 C50 60 90 60 90 78 Z" fill="url(#helmetGrad)"/>
    <!-- Helmet Brim -->
    <path d="M42 76 C50 74 90 74 98 76 L95 80 C85 78 55 78 45 80 Z" fill="#b45309"/>
    <!-- Helmet Shield Emblem -->
    <path d="M66 65 L74 65 L72 72 L68 72 Z" fill="#dc2626"/>
  </g>

  <!-- Object being Rescued: Child / Safe Character -->
  <g id="rescued-child" filter="url(#dropShadow)">
    <!-- Protective Blanket / Arms Cradling -->
    <path d="M125 130 C125 110 160 110 160 130 L165 175 L120 175 Z" fill="#38bdf8"/>
    <!-- Blanket fold details -->
    <path d="M125 140 Q145 150 160 140" fill="none" stroke="#0284c7" stroke-width="3"/>

    <!-- Child Head -->
    <circle cx="140" cy="115" r="14" fill="#fcd34d"/>
    <!-- Cute expression (Safe/Relieved) -->
    <path d="M135 113 Q140 118 145 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M128 110 Q140 98 152 110" fill="#b45309"/>

    <!-- Small Teddy Bear or Toy tucked safely -->
    <circle cx="155" cy="155" r="8" fill="#d97706"/>
    <circle cx="150" cy="149" r="3" fill="#d97706"/>
    <circle cx="160" cy="149" r="3" fill="#d97706"/>
  </g>

  <!-- Foreground / Atmospheric Overlays for Depth -->
  <g id="smoke-clouds" opacity="0.35">
    <circle cx="30" cy="90" r="25" fill="#64748b" filter="url(#softGlow)"/>
    <circle cx="50" cy="70" r="35" fill="#475569" filter="url(#softGlow)"/>
    <circle cx="210" cy="90" r="30" fill="#475569" filter="url(#softGlow)"/>
  </g>

  <!-- Dynamic Accent Lighting Highlights (Rim Light) -->
  <path d="M42 76 C50 74 90 74 98 76" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.8"/>
  <path d="M50 120 Q65 100 85 110" fill="none" stroke="#fed7aa" stroke-width="2" opacity="0.6"/>
  <path d="M125 130 C125 110 160 110 160 130" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.7"/>

  <!-- Subtle App Frame Border / Vignette -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>