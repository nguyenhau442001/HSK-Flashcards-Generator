<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 40)">
    <!-- Desk Surface -->
    <rect x="0" y="140" width="160" height="10" rx="2" fill="#334155"/>
    
    <!-- Canvas on Easel -->
    <rect x="35" y="20" width="90" height="120" rx="4" fill="#f8fafc"/>
    <path d="M35 20 L125 20 L125 140 L35 140 Z" fill="#f1f5f9"/>
    
    <!-- Painting Strokes (Abstract but scene-based) -->
    <path d="M50 40 Q80 30 110 50 T110 90" stroke="#ec4899" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M50 100 Q80 120 110 100" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Palette -->
    <ellipse cx="30" cy="170" rx="25" ry="20" fill="#fb923c"/>
    <circle cx="20" cy="165" r="4" fill="#0f172a"/>
    <circle cx="40" cy="160" r="6" fill="#10b981"/>
    <circle cx="25" cy="180" r="5" fill="#fbbf24"/>
    
    <!-- Brush -->
    <path d="M110 150 L140 120" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M135 125 L145 115" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Light Glow -->
    <circle cx="180" cy="30" r="30" fill="#f59e0b" opacity="0.15"/>
    <circle cx="180" cy="30" r="15" fill="#fbbf24" opacity="0.3"/>
  </g>
</svg>