<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Wall Gradient -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Rain Glow -->
    <linearGradient id="rain-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Droplet Gradient -->
    <linearGradient id="drop-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Humidity Vapor/Mist Filter -->
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Wall -->
  <rect x="15" y="15" width="210" height="185" rx="12" fill="url(#wall-grad)"/>

  <!-- Window Frame & View (Exterior Rain) -->
  <g filter="url(#shadow)">
    <!-- Window Outer Recess -->
    <rect x="115" y="30" width="95" height="110" rx="8" fill="#0f172a"/>
    <!-- Window Glass -->
    <rect x="120" y="35" width="85" height="100" rx="6" fill="#1e293b"/>
    <rect x="120" y="35" width="85" height="100" rx="6" fill="url(#rain-glow)"/>
    
    <!-- Rain Streaks on Window -->
    <line x1="135" y1="45" x2="130" y2="85" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="155" y1="40" x2="148" y2="95" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="175" y1="50" x2="170" y2="105" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="190" y1="42" x2="186" y2="80" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Window Sill -->
    <rect x="110" y="135" width="105" height="8" rx="3" fill="#475569"/>
  </g>

  <!-- Atmospheric Humidity Haze / Vapor Lines -->
  <path d="M 30 70 Q 50 60 70 75 T 110 70" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.15" filter="url(#blur-filter)"/>
  <path d="M 40 110 Q 65 95 90 115 T 120 105" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.15" filter="url(#blur-filter)"/>

  <!-- Wooden Table / Surface -->
  <path d="M 15 175 L 225 175 L 210 215 L 30 215 Z" fill="#b45309" filter="url(#shadow)"/>
  <path d="M 15 175 L 225 175 L 225 182 L 15 182 Z" fill="#d97706"/> <!-- Table top highlight -->
  <path d="M 15 182 L 225 182 L 210 215 L 30 215 Z" fill="#92400e"/> <!-- Table front side -->

  <!-- Potted Monstera / Tropical Plant (Thrives in Humidity) -->
  <g id="plant" filter="url(#shadow)">
    <!-- Pot -->
    <path d="M 50 145 L 75 145 L 70 176 C 70 178 68 180 65 180 L 55 180 C 52 180 50 178 50 176 Z" fill="#f43f5e"/>
    <ellipse cx="62.5" cy="145" rx="12.5" ry="3" fill="#fb7185"/>
    
    <!-- Soil -->
    <ellipse cx="62.5" cy="146" rx="10" ry="2" fill="#451a03"/>

    <!-- Stems -->
    <path d="M 62.5 145 C 60 120 45 110 35 95" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <path d="M 62.5 145 C 65 115 80 100 90 85" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <path d="M 62.5 145 C 62.5 125 62.5 105 62.5 80" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Leaves -->
    <!-- Left Leaf -->
    <path d="M 35 95 C 20 85 15 65 25 55 C 35 45 50 55 45 75 Z" fill="url(#leaf-grad)"/>
    <!-- Leaf fenestrations/holes -->
    <circle cx="32" cy="65" r="2.5" fill="#1e293b"/>
    <circle cx="38" cy="72" r="2" fill="#1e293b"/>

    <!-- Right Leaf -->
    <path d="M 90 85 C 105 75 110 55 100 45 C 90 35 75 45 80 65 Z" fill="url(#leaf-grad)"/>
    <circle cx="93" cy="55" r="2.5" fill="#1e293b"/>
    
    <!-- Center Leaf -->
    <path d="M 62.5 80 C 65 55 55 35 45 35 C 35 35 45 55 52 70 Z" fill="#34d399"/>
  </g>

  <!-- Large Water Droplets on Wall and Surface (Representing 'Cháoshī' / Dampness) -->
  <g id="condensation-droplets">
    <!-- Wall Droplets -->
    <path d="M 95 100 C 95 95 98 93 100 93 C 102 93 105 95 105 100 C 105 104 100 109 100 109 C 100 109 95 104 95 100 Z" fill="url(#drop-grad)" filter="url(#shadow)"/>
    <path d="M 80 130 C 80 126 82 125 84 125 C 86 125 88 126 88 130 C 88 133 84 137 84 137 C 84 137 80 133 80 130 Z" fill="url(#drop-grad)" opacity="0.9"/>
    <path d="M 115 155 C 115 151 117 150 119 150 C 121 150 123 151 123 155 C 123 158 119 162 119 162 C 119 162 115 158 115 155 Z" fill="url(#drop-grad)" opacity="0.8"/>

    <!-- Hanging Droplet from Leaf Tip -->
    <path d="M 45 75 C 45 73 46.5 72 47.5 72 C 48.5 72 50 73 50 75 C 50 77 47.5 80 47.5 80 C 47.5 80 45 77 45 75 Z" fill="url(#drop-grad)" filter="url(#shadow)"/>
    <circle cx="47" cy="74" r="0.8" fill="#ffffff" opacity="0.8"/>

    <!-- Droplets pooling on Table Surface -->
    <ellipse cx="140" cy="182" rx="7" ry="2.5" fill="#38bdf8" opacity="0.7" filter="url(#shadow)"/>
    <ellipse cx="140" cy="182" rx="4" ry="1.2" fill="#bae6fd" opacity="0.9"/>

    <ellipse cx="175" cy="188" rx="10" ry="3.5" fill="#38bdf8" opacity="0.6" filter="url(#shadow)"/>
    <ellipse cx="174" cy="188" rx="6" ry="2" fill="#bae6fd" opacity="0.8"/>
    <!-- Ripple ring -->
    <path d="M 162 188 C 162 186.5 186 186.5 186 188" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.5"/>

    <!-- Tiny scattered droplets -->
    <circle cx="105" cy="184" r="1.5" fill="#bae6fd" opacity="0.8"/>
    <circle cx="125" cy="180" r="1" fill="#bae6fd" opacity="0.7"/>
    <circle cx="195" cy="185" r="2" fill="#bae6fd" opacity="0.9"/>
  </g>

  <!-- Hygrometer / Humidity Meter Prop (Showing high humidity context) -->
  <g id="hygrometer" transform="translate(165, 85)" filter="url(#shadow)">
    <!-- Outer Body -->
    <circle cx="20" cy="20" r="18" fill="#e2e8f0"/>
    <circle cx="20" cy="20" r="15" fill="#0f172a"/>
    <!-- Dial Gauge markings -->
    <circle cx="20" cy="20" r="11" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Meter Needle (Pointing to high/wet zone) -->
    <line x1="20" y1="20" x2="27" y2="13" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="3" fill="#cbd5e1"/>
    <!-- Droplet Icon inside gauge -->
    <path d="M 20 23 C 20 22 20.8 21.5 21.3 21.5 C 21.8 21.5 22.5 22 22.5 23 C 22.5 24 21.3 25.5 21.3 25.5 C 21.3 25.5 20 24 20 23 Z" fill="#38bdf8" opacity="0.8" transform="scale(0.6) translate(13, 3)"/>
  </g>
</svg>