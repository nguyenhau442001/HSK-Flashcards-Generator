<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Rain/Wind Effect -->
  <path d="M20 0 L40 240 M80 0 L100 240 M140 0 L160 240 M200 0 L220 240" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 140 L20 140 C10 140 5 130 5 120 L5 80 C5 60 20 45 40 45 L80 45 C100 45 115 60 115 80 L115 120 C115 130 110 140 100 140 L80 140" fill="#475569"/>
    
    <!-- Face -->
    <circle cx="60" cy="50" r="35" fill="#fde68a"/>
    
    <!-- Expression of 'Bad/Harsh' -->
    <path d="M45 40 Q50 35 55 40 M65 40 Q70 35 75 40" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M45 70 Q60 60 75 70" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Scarf/Hood -->
    <path d="M25 45 L95 45 L100 60 L20 60 Z" fill="#fb923c"/>
  </g>
  
  <!-- Environment Props: Broken Umbrella -->
  <path d="M160 180 L190 120 L220 180" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M190 120 L190 150" stroke="#ec4899" stroke-width="4"/>
  
  <!-- Debris/Wind swirl -->
  <circle cx="180" cy="90" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="200" cy="100" r="3" fill="#fbbf24" opacity="0.4"/>
</svg>