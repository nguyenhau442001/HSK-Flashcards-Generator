<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient for "Helpful/Kind" action -->
    <radialGradient id="glowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 (Elderly) Gradient -->
    <linearGradient id="elderCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 (Helper) Gradient -->
    <linearGradient id="helperJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow behind the interaction point -->
  <circle cx="120" cy="130" r="70" fill="url(#glowLight)"/>

  <!-- Background Environment (Park setting) -->
  <!-- Distant tree canopy -->
  <circle cx="60" cy="80" r="45" fill="#334155" opacity="0.5"/>
  <circle cx="180" cy="70" r="55" fill="#334155" opacity="0.4"/>
  <path d="M150 140 Q 180 180 220 200 L 220 220 L 20 220 L 20 190 Q 70 170 110 145 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Park Bench / Subtle architectural element -->
  <rect x="25" y="155" width="70" height="8" rx="4" fill="#475569"/>
  <rect x="35" y="163" width="8" height="35" rx="3" fill="#334155"/>
  <rect x="77" y="163" width="8" height="35" rx="3" fill="#334155"/>

  <!-- Ground Plane -->
  <path d="M0 195 Q 120 180 240 195 L 240 240 L 0 240 Z" fill="#090d16"/>
  <ellipse cx="120" cy="205" rx="90" ry="12" fill="#020617" opacity="0.5"/>

  <!-- MAIN SCENE: Two characters illustrating "fú" (supporting/helping an elder up) -->
  
  <!-- Character 1: Elderly Person (Leaning forward, needing support) -->
  <g id="elderlyPerson" filter="url(#softShadow)">
    <!-- Legs -->
    <path d="M95 165 L 90 200 L 98 202" stroke="#64748b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M110 168 L 115 198 L 123 200" stroke="#64748b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Shoes -->
    <ellipse cx="96" cy="202" rx="6" ry="3" fill="#334155"/>
    <ellipse cx="122" cy="200" rx="6" ry="3" fill="#334155"/>

    <!-- Body/Coat -->
    <path d="M90 120 Q 95 160 100 170 L 125 165 Q 120 130 115 120 Z" fill="url(#elderCoat)"/>
    
    <!-- Cane on the ground -->
    <path d="M75 140 L 80 200" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <path d="M72 142 C 72 136 78 136 78 142" stroke="#cbd5e1" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Head and Face -->
    <circle cx="95" cy="100" r="14" fill="#fde047"/>
    <!-- Gentle closed eye / expression -->
    <path d="M90 98 Q 93 101 96 98" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Hair (Grey/White) -->
    <path d="M81 100 C 81 90 109 90 109 100" fill="#cbd5e1"/>

    <!-- Elder's Left Arm (reaching down/back) -->
    <path d="M100 125 L 85 145" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="83" cy="147" r="4" fill="#fde047"/>
  </g>

  <!-- Character 2: Helper (Lifting/Supporting the elder - The "Fú" action) -->
  <g id="helperPerson" filter="url(#softShadow)">
    <!-- Legs -->
    <path d="M135 170 L 145 202 L 155 202" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M150 170 L 165 198 L 175 198" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Shoes -->
    <ellipse cx="157" cy="202" rx="7" ry="3.5" fill="#0f172a"/>
    <ellipse cx="177" cy="198" rx="7" ry="3.5" fill="#0f172a"/>

    <!-- Torso (Leaning in to lift) -->
    <path d="M125 115 Q 150 130 155 170 L 130 170 Q 120 140 120 120 Z" fill="url(#helperJacket)"/>

    <!-- Head & Hair -->
    <circle cx="140" cy="90" r="15" fill="#fbcfe8"/>
    <!-- Friendly smiling face -->
    <path d="M143 90 Q 146 93 149 90" stroke="#831843" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="148" cy="87" r="1.5" fill="#831843"/>
    <!-- Modern hairstyle -->
    <path d="M127 88 C 127 75 155 75 155 88 Z" fill="#475569"/>

    <!-- Helper's Arms (CRITICAL: Showing the 'fú' / lifting support under the arm) -->
    <!-- Supporting Arm 1 (Under the elder's armpit/back) -->
    <path d="M135 125 Q 120 120 105 125" stroke="#ea580c" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="103" cy="126" r="4.5" fill="#fbcfe8"/>

    <!-- Supporting Arm 2 (Around the back/waist) -->
    <path d="M140 135 Q 120 145 105 140" stroke="#c2410c" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Foreground Atmospheric Leaf / Detail -->
  <path d="M 200 40 Q 210 50 205 60 Q 195 55 200 40 Z" fill="#38bdf8" opacity="0.3"/>
  <path d="M 30 50 Q 20 60 25 70 Q 35 65 30 50 Z" fill="#fbbf24" opacity="0.2"/>

  <!-- Action / Care Effect Sparkles (Representing kindness/helpfulness) -->
  <g fill="#fbbf24">
    <path d="M 120 75 L 122 81 L 128 83 L 122 85 L 120 91 L 118 85 L 112 83 L 118 81 Z" opacity="0.9"/>
    <path d="M 95 60 L 96 64 L 100 65 L 96 66 L 95 70 L 94 66 L 90 65 L 94 64 Z" opacity="0.6" transform="scale(0.8) translate(30, 10)"/>
    <circle cx="108" cy="108" r="2" opacity="0.8"/>
    <circle cx="132" cy="115" r="1.5" opacity="0.7"/>
  </g>
</svg>