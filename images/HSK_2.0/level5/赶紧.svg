<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Motion Lines -->
  <path d="M180 60 L140 80 M190 90 L150 110 M185 120 L145 140" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Character Body -->
  <g transform="translate(100, 110)">
    <!-- Suitcase -->
    <rect x="50" y="40" width="40" height="50" rx="4" fill="#fb923c"/>
    <rect x="55" y="30" width="30" height="10" rx="2" fill="#fb923c"/>
    
    <!-- Arm reaching -->
    <path d="M40 20 L70 45" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Torso -->
    <path d="M0 0 L30 80 L-30 80 Z" fill="#38bdf8"/>
    
    <!-- Legs in stride -->
    <path d="M-10 80 L-30 120 M10 80 L30 120" stroke="#fde68a" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#fde68a"/>
    <!-- Expressive Eyes -->
    <ellipse cx="-8" cy="-25" rx="3" ry="5" fill="#0f172a"/>
    <ellipse cx="8" cy="-25" rx="3" ry="5" fill="#0f172a"/>
    <!-- Mouth -->
    <path d="M-8 -12 Q0 -5 8 -12" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>

  <!-- Environment Elements -->
  <circle cx="200" cy="40" r="15" fill="#fbbf24" opacity="0.8"/>
  <path d="M10 180 L230 180" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Doorway frame -->
  <rect x="160" y="20" width="60" height="200" rx="10" fill="none" stroke="#10b981" stroke-width="4"/>
</svg>