<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Workbench Surface -->
  <rect x="20" y="160" width="200" height="80" rx="8" fill="#334155"/>
  <rect x="20" y="160" width="200" height="15" fill="#475569"/>
  
  <!-- The Subject: A masterfully assembled mechanical clockwork gear mechanism -->
  <g transform="translate(120, 120)">
    <!-- Main Gear -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#fbbf24" stroke-width="8" stroke-dasharray="10 5"/>
    <circle cx="0" cy="0" r="35" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
    <path d="M-25 -25 L25 25 M-25 25 L25 -25" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Secondary Gear -->
    <circle cx="55" cy="-30" r="20" fill="#38bdf8" stroke="#0ea5e9" stroke-width="4"/>
    <circle cx="55" cy="-30" r="8" fill="#1e293b"/>
  </g>
  
  <!-- Tools of Mastery -->
  <path d="M40 180 L60 140 L70 150 Z" fill="#94a3b8"/>
  <rect x="65" y="145" width="20" height="5" rx="2" fill="#ec4899" transform="rotate(45 75 147)"/>
  
  <path d="M180 190 L160 150 L150 160 Z" fill="#94a3b8"/>
  <rect x="155" y="155" width="20" height="5" rx="2" fill="#10b981" transform="rotate(-45 165 157)"/>
  
  <!-- Floating Particles of Focus -->
  <circle cx="180" cy="80" r="3" fill="#fb923c"/>
  <circle cx="195" cy="95" r="2" fill="#f59e0b"/>
  <circle cx="170" cy="60" r="2" fill="#38bdf8"/>
  
  <!-- Depth Shadow -->
  <ellipse cx="120" cy="210" rx="80" ry="10" fill="#0f172a" opacity="0.4"/>
</svg>