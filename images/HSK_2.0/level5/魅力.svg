<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="dress-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    
    <linearGradient id="jacket-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="jacket-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements (Art Gallery / Social Lounge) -->
  <!-- Ambient Wall Panelling / Lights -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="1.5" opacity="0.4" />
  
  <!-- Modern Art Frames in Background -->
  <rect x="25" y="45" width="35" height="45" rx="3" fill="#334155" opacity="0.3" />
  <rect x="30" y="50" width="25" height="35" rx="1" fill="#1e293b" opacity="0.6" />
  <circle cx="42" cy="65" r="8" fill="#f43f5e" opacity="0.3" />
  <path d="M 32 75 Q 42 55 52 75 Z" fill="#38bdf8" opacity="0.3" />

  <rect x="180" y="55" width="40" height="30" rx="3" fill="#334155" opacity="0.3" />
  <rect x="185" y="60" width="30" height="20" rx="1" fill="#1e293b" opacity="0.6" />
  <path d="M 190 75 L 200 65 L 210 75 Z" fill="#fbbf24" opacity="0.3" />

  <!-- Hanging Pendent Lights -->
  <line x1="80" y1="0" x2="80" y2="35" stroke="#475569" stroke-width="1.5" />
  <path d="M 70 35 L 90 35 L 95 42 L 65 42 Z" fill="#64748b" />
  <circle cx="80" cy="45" r="3" fill="#fef08a" filter="url(#subtle-glow)" />

  <line x1="170" y1="0" x2="170" y2="25" stroke="#475569" stroke-width="1.5" />
  <path d="M 163 25 L 177 25 L 180 30 L 160 30 Z" fill="#64748b" />
  <circle cx="170" cy="32" r="3" fill="#fef08a" filter="url(#subtle-glow)" />

  <!-- Spotlight Cone Effect on Main Character -->
  <path d="M 120 0 L 30 240 L 210 240 Z" fill="url(#spotlight)" />

  <!-- Floor / Ground Plane -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.9" />
  <ellipse cx="120" cy="195" rx="80" ry="12" fill="#020617" opacity="0.6" />

  <!-- ==================== MAIN CHARACTERS ==================== -->

  <!-- LISTENER 1 (Left: Captivated, smiling admiringly) -->
  <g transform="translate(45, 125)">
    <!-- Body & Jacket -->
    <path d="M 0 55 C 0 35 15 30 25 30 C 35 30 50 35 50 55 L 45 75 L 5 75 Z" fill="url(#jacket-grad-1)" />
    <!-- Inner Shirt -->
    <path d="M 18 30 L 25 45 L 32 30 Z" fill="#f8fafc" />
    <!-- Head & Neck -->
    <rect x="18" y="18" width="14" height="15" rx="4" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 16 18 C 16 8 34 8 34 18 C 34 21 32 20 32 15 C 32 11 18 11 18 15 C 18 20 16 21 16 18 Z" fill="#334155" />
    <!-- Face Profile (Looking Right towards the subject) -->
    <circle cx="28" cy="24" r="1.5" fill="#1e293b" /> <!-- Eye -->
    <path d="M 30 28 Q 33 29 32 30" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- Smile -->
    <!-- Expression Sparkle (Captivated) -->
    <path d="M 37 18 L 39 20 L 37 22 L 35 20 Z" fill="#fef08a" filter="url(#subtle-glow)" />
    <!-- Arms gesturing slightly in awe -->
    <path d="M 5 45 Q 0 55 10 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- LISTENER 2 (Right: Listening intently, warm friendly expression) -->
  <g transform="translate(155, 130)">
    <!-- Body & Jacket -->
    <path d="M 5 50 C 5 30 20 25 30 25 C 40 25 55 30 55 50 L 50 70 L 10 70 Z" fill="url(#jacket-grad-2)" />
    <!-- Inner Shirt -->
    <path d="M 23 25 L 30 40 L 37 25 Z" fill="#f8fafc" />
    <!-- Head & Neck -->
    <rect x="23" y="12" width="14" height="15" rx="4" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M 21 15 C 21 5 39 5 39 15 C 39 20 35 18 35 12 C 35 8 25 8 25 12 C 25 18 21 20 21 15 Z" fill="#1e293b" />
    <!-- Face (Looking Left towards the subject) -->
    <circle cx="27" cy="18" r="1.5" fill="#1e293b" />
    <path d="M 25 22 Q 28 24 30 22" stroke="#be123c" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Arm resting/posing -->
    <path d="M 50 45 Q 58 55 50 65" stroke="#a855f7" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- ==================== CENTRAL SUBJECT (THE CHARISMATIC WOMAN) ==================== -->
  <g transform="translate(95, 80)">
    <!-- Drop Shadow on Floor -->
    <ellipse cx="25" cy="120" rx="22" ry="6" fill="#000000" opacity="0.4" />

    <!-- Elegant Posture: Dynamic confident stance -->
    
    <!-- Legs & Shoes -->
    <path d="M 18 90 L 14 123" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" />
    <path d="M 32 90 L 38 123" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" />
    <!-- Chic Shoes -->
    <path d="M 10 123 L 16 123 C 18 123 18 126 14 126 L 10 126 Z" fill="#1e293b" />
    <path d="M 34 123 L 42 123 C 44 123 44 126 40 126 L 34 126 Z" fill="#1e293b" />

    <!-- Flowing Modern Dress / Outfit representing 'Charisma & Charm' -->
    <path d="M 13 45 C 13 45 10 70 15 90 L 35 90 C 40 70 37 45 37 45 Z" fill="url(#dress-grad)" />
    <!-- Chic Belt / Waist Accent -->
    <rect x="13" y="42" width="24" height="5" rx="2.5" fill="#fbbf24" filter="url(#subtle-glow)" />
    
    <!-- Torso -->
    <path d="M 14 25 C 14 25 12 40 25 40 C 38 40 36 25 36 25 Z" fill="#f43f5e" />

    <!-- Gesturing Arms (Confident, expressive storytelling pose) -->
    <!-- Left Arm (Raised gracefully explaining/engaging) -->
    <path d="M 14 28 Q 0 30 5 45" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="5" cy="46" r="3.5" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Right Arm (Hand on hip / confident curve) -->
    <path d="M 36 28 Q 48 35 42 50" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="42" cy="51" r="3.5" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Neck -->
    <rect x="21" y="18" width="8" height="8" rx="2" fill="#fbcfe8" />

    <!-- Head & Expressive Face -->
    <circle cx="25" cy="12" r="12" fill="#fbcfe8" />

    <!-- Flowing Stylish Hair (Adding to the sense of 'Charm' / Movement) -->
    <path d="M 13 6 C 10 -2 30 -4 38 4 C 42 12 40 25 40 25 C 40 25 34 22 35 15 C 36 8 20 6 13 6 Z" fill="#1e1b4b" />
    <!-- Hair Strand flowing dynamically -->
    <path d="M 37 18 C 44 22 42 32 46 38" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Facial Features -->
    <!-- Confident, Warm Smile -->
    <circle cx="21" cy="11" r="1.5" fill="#1e1b4b" /> <!-- Left Eye -->
    <circle cx="29" cy="11" r="1.5" fill="#1e1b4b" /> <!-- Right Eye -->
    <path d="M 23 15 Q 25 17 27 15" stroke="#be123c" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- Charming Smile -->
    <!-- Rosy Cheeks -->
    <circle cx="19" cy="14" r="2" fill="#f43f5e" opacity="0.4" />
    <circle cx="31" cy="14" r="2" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- ==================== CHARISMA / ATMOSPHERIC SPARKLES & GLOWS ==================== -->
  <!-- Radiating Starbursts & Glows to visually represent "魅力" (Charm/Appeal) -->
  
  <!-- Sparkle 1 (Top Left) -->
  <g transform="translate(60, 55)" filter="url(#glow)">
    <path d="M 0 -8 C 0 0 -8 0 0 8 C 0 0 8 0 0 -8 Z" fill="#fbbf24" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>

  <!-- Sparkle 2 (Top Right near subject head) -->
  <g transform="translate(145, 65)" filter="url(#glow)">
    <path d="M 0 -10 C 0 0 -10 0 0 10 C 0 0 10 0 0 -10 Z" fill="#f43f5e" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Sparkle 3 (Mid Right) -->
  <g transform="translate(180, 110)" filter="url(#glow)">
    <path d="M 0 -6 C 0 0 -6 0 0 6 C 0 0 6 0 0 -6 Z" fill="#38bdf8" />
  </g>

  <!-- Sparkle 4 (Lower Left) -->
  <g transform="translate(75, 140)" filter="url(#glow)">
    <path d="M 0 -7 C 0 0 -7 0 0 7 C 0 0 7 0 0 -7 Z" fill="#a855f7" />
  </g>

  <!-- Tiny Floating Sparkles -->
  <circle cx="105" cy="50" r="2" fill="#fef08a" filter="url(#subtle-glow)" />
  <circle cx="135" cy="95" r="1.5" fill="#f9a8d4" filter="url(#subtle-glow)" />
  <circle cx="70" cy="95" r="2" fill="#bae6fd" filter="url(#subtle-glow)" />
  <circle cx="120" cy="165" r="1.5" fill="#fef08a" filter="url(#subtle-glow)" />

  <!-- Foreground Atmospheric Vignette / Frame border soft blend -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15" />
</svg>