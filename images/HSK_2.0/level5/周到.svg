<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M20 180 L220 180 L230 220 L10 220 Z" fill="#334155"/>
  
  <!-- Tablecloth -->
  <path d="M30 180 L210 180 L200 210 L40 210 Z" fill="#475569"/>
  
  <!-- The Service: A waiter's hand placing a warm drink -->
  <!-- Tray -->
  <ellipse cx="120" cy="165" rx="50" ry="15" fill="#94a3b8"/>
  
  <!-- Cup -->
  <path d="M100 130 h40 v30 a20 20 0 0 1 -40 0 z" fill="#f8fafc"/>
  <path d="M140 135 h5 a5 5 0 0 1 0 10 h-5" fill="none" stroke="#f8fafc" stroke-width="4"/>
  
  <!-- Steam/Warmth -->
  <path d="M120 120 q5 -10 0 -20 q-5 10 0 20" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M105 125 q5 -10 0 -20 q-5 10 0 20" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Extra thoughtful details: A small folded napkin and a flower -->
  <rect x="160" y="160" width="20" height="20" rx="2" fill="#e2e8f0" transform="rotate(15 170 170)"/>
  <circle cx="60" cy="170" r="8" fill="#ec4899"/>
  <path d="M60 178 v15" stroke="#10b981" stroke-width="3"/>
  <path d="M60 185 l-5 5 M60 185 l5 5" stroke="#10b981" stroke-width="3"/>
  
  <!-- Waiter's sleeve -->
  <path d="M180 240 l-20 -60 l40 -20 l20 80 Z" fill="#38bdf8"/>
  
  <!-- Ambient light glow -->
  <circle cx="120" cy="140" r="60" fill="#fbbf24" opacity="0.05"/>
</svg>