<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wall Paint Roller Warm Glow Gradient -->
    <linearGradient id="roller-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Ambient Light -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior Background: The Grey Wall (Context for 'Tường màu xám') -->
  <rect x="24" y="24" width="192" height="150" rx="4" fill="#64748b" />
  
  <!-- Wall Texture/Shadows for Depth -->
  <rect x="24" y="24" width="192" height="150" rx="4" fill="#334155" fill-opacity="0.2" />
  <path d="M216 24 L216 174 L180 174 L180 24 Z" fill="#000000" fill-opacity="0.15" />

  <!-- Wooden Floor Base -->
  <path d="M 24 174 L 216 174 L 230 216 L 10 216 Z" fill="#b45309" />
  <path d="M 24 184 L 216 184" stroke="#78350f" stroke-width="2" opacity="0.6" />
  <path d="M 17 198 L 223 198" stroke="#78350f" stroke-width="2" opacity="0.6" />
  <path d="M 10 212 L 230 212" stroke="#78350f" stroke-width="2" opacity="0.6" />
  <!-- Floor Planks Perspective Lines -->
  <line x1="70" y1="174" x2="45" y2="216" stroke="#78350f" stroke-width="1.5" opacity="0.4" />
  <line x1="130" y1="174" x2="120" y2="216" stroke="#78350f" stroke-width="1.5" opacity="0.4" />
  <line x1="185" y1="174" x2="190" y2="216" stroke="#78350f" stroke-width="1.5" opacity="0.4" />

  <!-- Baseboard Trim -->
  <rect x="24" y="166" width="192" height="8" fill="#451a03" />

  <!-- Hanging Picture Frame on the Grey Wall (showing contrast) -->
  <rect x="140" y="45" width="50" height="40" rx="2" fill="#334155" stroke="#1e293b" stroke-width="3" />
  <rect x="145" y="50" width="40" height="30" fill="#38bdf8" opacity="0.8" />
  <!-- Picture contents (sun & mountain) -->
  <circle cx="170" cy="60" r="5" fill="#fef08a" />
  <path d="M145 80 L160 65 L175 80 Z" fill="#047857" />
  <path d="M165 80 L178 68 L185 80 Z" fill="#065f46" />

  <!-- Action Element: Paint Roller actively painting the wall grey -->
  <!-- Fresh Grey Paint Stripe -->
  <rect x="60" y="40" width="50" height="134" fill="#94a3b8" />
  
  <!-- Paint Roller Handle & Frame -->
  <g transform="translate(70, 70) rotate(-15)">
    <!-- Roller Frame (Metal Rod) -->
    <path d="M 25 15 L 15 15 L 15 45 L 22 45" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Roller Handle (Warm Amber/Gold Accent) -->
    <path d="M 22 42 L 32 82 C 34 88, 28 92, 22 88 L 14 55 Z" fill="url(#roller-glow)" />
    <path d="M 18 50 L 26 80" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4" />

    <!-- Roller Cylinder (Grey fuzz with paint texture) -->
    <rect x="5" y="0" width="40" height="30" rx="6" fill="#475569" stroke="#334155" stroke-width="2" />
    <!-- Highlights on roller -->
    <path d="M 8 6 C 15 3, 30 3, 37 6" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" />
    
    <!-- Paint Splatters / Dynamic Motion Drops -->
    <circle cx="-12" cy="18" r="3.5" fill="#94a3b8" />
    <circle cx="-6" cy="35" r="2" fill="#94a3b8" />
    <circle cx="55" cy="5" r="2.5" fill="#94a3b8" />
    <circle cx="62" cy="22" r="1.5" fill="#94a3b8" />
  </g>

  <!-- Secondary Context Prop: Paint Can on the Floor (Grey Paint inside/outside) -->
  <g transform="translate(40, 140)">
    <!-- Can Body -->
    <path d="M 4 20 L 8 46 C 8 48, 10 50, 12 50 L 28 50 C 30 50, 32 48, 32 46 L 36 20 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <!-- Can Rim Top -->
    <ellipse cx="20" cy="20" rx="16" ry="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <!-- Grey Paint Surface Inside Can -->
    <ellipse cx="20" cy="21" rx="13" ry="3.5" fill="#64748b" />
    <!-- Paint Drip on Can Side -->
    <path d="M 18 25 C 18 28, 22 28, 22 34 C 22 36, 20 38, 19 38" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <!-- Can Wire Handle -->
    <path d="M 6 18 C -2 0, 42 0, 34 18" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Indoor Ambient lighting (Warm lamp glow from top corner) -->
  <circle cx="24" cy="24" r="90" fill="url(#lamp-glow)" style="mix-blend-mode: screen;" />

</svg>