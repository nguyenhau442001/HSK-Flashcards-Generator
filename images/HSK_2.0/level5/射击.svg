<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Firing Range Environment -->
  <defs>
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background Wall Details & Booth Divider -->
  <rect x="0" y="0" width="240" height="150" fill="#1e293b"/>
  <path d="M0 150 L240 150 L240 240 L0 240 Z" fill="#0f172a"/>
  
  <!-- Shooting Booth Partition -->
  <rect x="15" y="110" width="12" height="130" fill="#334155" rx="3"/>
  <rect x="18" y="115" width="6" height="125" fill="#1e293b" rx="2"/>

  <!-- Target Downrange (Background Left-Center) -->
  <g transform="translate(160, 65)">
    <!-- Target stand -->
    <rect x="16" y="50" width="8" height="90" fill="#475569"/>
    <!-- Target glow -->
    <circle cx="20" cy="50" r="35" fill="url(#targetGlow)"/>
    <!-- Target Paper -->
    <rect x="-5" y="15" width="50" height="70" fill="#f8fafc" rx="2"/>
    <!-- Rings -->
    <circle cx="20" cy="50" r="22" fill="#ef4444"/>
    <circle cx="20" cy="50" r="15" fill="#f8fafc"/>
    <circle cx="20" cy="50" r="8" fill="#ef4444"/>
    <circle cx="20" cy="50" r="3" fill="#0f172a"/>
    <!-- Bullet holes / scoring marks -->
    <circle cx="22" cy="48" r="1.5" fill="#0f172a"/>
    <circle cx="17" cy="53" r="1.5" fill="#0f172a"/>
    <circle cx="24" cy="55" r="1.5" fill="#0f172a"/>
  </g>

  <!-- Overhead Range Lighting -->
  <path d="M70 0 L90 35 L150 35 L170 0 Z" fill="#334155" opacity="0.5"/>
  <ellipse cx="120" cy="35" rx="30" ry="6" fill="#fbbf24" opacity="0.8"/>
  <path d="M90 35 L50 140 L190 140 L150 35 Z" fill="#fbbf24" opacity="0.05"/>

  <!-- Shooting Bench / Table -->
  <path d="M40 160 L210 160 L220 200 L30 200 Z" fill="#334155"/>
  <rect x="35" y="155" width="185" height="8" fill="#64748b" rx="2"/>
  <rect x="50" y="200" width="15" height="40" fill="#1e293b"/>
  <rect x="175" y="200" width="15" height="40" fill="#1e293b"/>

  <!-- Character: Male Shooter (Side profile, focused) -->
  <g transform="translate(60, 95)">
    <!-- Body & Jacket -->
    <path d="M30 65 L60 65 L75 110 L20 110 Z" fill="#0284c7"/>
    <path d="M45 65 L65 110 L25 110 Z" fill="#0369a1"/> <!-- jacket lapel/fold -->
    
    <!-- Head & Hair -->
    <circle cx="38" cy="32" r="14" fill="#fbcfe8"/> <!-- face base / skin -->
    <!-- Hair -->
    <path d="M24 32 C24 20, 32 16, 48 20 L50 32 L35 30 Z" fill="#1e293b"/>
    
    <!-- Ear and Focused Eye area -->
    <!-- Protective Earphones -->
    <path d="M30 24 A 10 12 0 0 1 48 24 L 45 42 L 33 42 Z" fill="#f59e0b"/>
    <rect x="33" y="38" width="12" height="6" fill="#d97706" rx="2"/>
    <path d="M39 18 C 45 10, 32 10, 35 22" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Safety Glasses -->
    <rect x="42" y="28" width="16" height="9" rx="3" fill="#38bdf8" opacity="0.7"/>
    <path d="M54 30 L65 32" stroke="#0f172a" stroke-width="2"/>

    <!-- Arms & Hands Holding Pistol -->
    <!-- Back arm -->
    <path d="M45 60 L75 75 L85 70" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front arm & Hands -->
    <path d="M50 70 L80 75 L110 76" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="108" cy="76" r="6" fill="#fbcfe8"/> <!-- Hands grip -->

    <!-- Precision Pistol -->
    <!-- Frame & Barrel -->
    <rect x="95" y="68" width="35" height="9" rx="2" fill="#334155"/>
    <rect x="125" y="70" width="8" height="5" fill="#64748b"/> <!-- barrel tip -->
    <!-- Grip -->
    <path d="M100 75 L108 95 L95 97 L90 77 Z" fill="#1e293b"/>
    <!-- Sight -->
    <rect x="100" y="64" width="3" height="4" fill="#64748b"/>
    <rect x="123" y="64" width="2" height="4" fill="#64748b"/>

    <!-- Muzzle Flash / Action Effect -->
    <path d="M135 72 L150 68 L142 72.5 L155 74 L135 75 Z" fill="#fbbf24"/>
    <circle cx="140" cy="72" r="4" fill="#fef08a"/>
  </g>

  <!-- Tracer / Laser line pointing to target -->
  <path d="M190 167 L190 167" stroke="#ef4444" stroke-width="2"/> <!-- placeholder anchor -->
  <line x1="172" y1="168" x2="200" y2="115" stroke="url(#laserBeam)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Foreground/Ambient Details -->
  <!-- Spent bullet casings on table -->
  <rect x="85" y="170" width="4" height="8" rx="1" fill="#fbbf24" transform="rotate(25 87 174)"/>
  <rect x="92" y="173" width="4" height="8" rx="1" fill="#d97706" transform="rotate(-15 94 177)"/>
  <rect x="97" y="169" width="4" height="8" rx="1" fill="#fbbf24" transform="rotate(70 99 173)"/>

  <!-- Extra subtle target down range (secondary) -->
  <g transform="translate(195, 80) scale(0.6)" opacity="0.4">
    <rect x="16" y="50" width="8" height="90" fill="#475569"/>
    <rect x="-5" y="15" width="50" height="70" fill="#f8fafc" rx="2"/>
    <circle cx="20" cy="50" r="22" fill="#ef4444"/>
    <circle cx="20" cy="50" r="15" fill="#f8fafc"/>
    <circle cx="20" cy="50" r="8" fill="#ef4444"/>
  </g>

  <!-- Digital Score Screen on the Booth Wall -->
  <rect x="110" y="115" width="30" height="20" rx="3" fill="#020617" stroke="#334155" stroke-width="1.5"/>
  <!-- Simulated digital numbers (abstract green glow lines) -->
  <polyline points="116,122 118,120 118,128" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="123,120 127,120 127,124 123,124 123,128 127,128" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="132,120 136,120 136,128 132,128 Z" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

</svg>