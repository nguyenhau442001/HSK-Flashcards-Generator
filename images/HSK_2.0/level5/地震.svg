<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Warning Glow -->
    <radialGradient id="alarmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Building Gradient -->
    <linearGradient id="bldgGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bldgGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Warning Glow -->
  <circle cx="120" cy="120" r="110" fill="url(#alarmGlow)"/>

  <!-- Stars / City Dust -->
  <circle cx="40" cy="40" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="200" cy="30" r="1.5" fill="#94a3b8" opacity="0.4"/>
  <circle cx="215" cy="80" r="1" fill="#94a3b8" opacity="0.5"/>
  <circle cx="25" cy="95" r="1.5" fill="#f59e0b" opacity="0.8"/>

  <!-- BACKGROUND ELEMENTS (Distant Buildings & Moon) -->
  <circle cx="180" cy="60" r="16" fill="#fbbf24" opacity="0.9"/>
  <rect x="30" y="70" width="35" height="110" fill="#1e293b"/>
  <rect x="175" y="80" width="40" height="100" fill="#1e293b"/>

  <!-- FOREGROUND SCENE GROUP (Tilted for Earthquake Effect) -->
  <g transform="rotate(4, 120, 140)">
    
    <!-- Ground / Street Layer -->
    <path d="M0 160 L240 150 L240 240 L0 240 Z" fill="url(#groundGrad)" filter="url(#shadow)"/>
    
    <!-- Road Surface with Cracked Pavement (Seismic Activity) -->
    <path d="M70 160 L10 240 L120 240 L135 160 Z" fill="#334155"/>
    <!-- Deep Fissures / Cracks -->
    <path d="M95 180 L85 200 L100 215 L90 240" stroke="#020617" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 195 L65 210" stroke="#020617" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M97 207 L115 220" stroke="#020617" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Glowing Magma/Energy from Cracks -->
    <path d="M95 180 L85 200 L100 215 L90 240" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.8"/>

    <!-- Main Building (Damaged / Shaking) -->
    <rect x="75" y="60" width="90" height="100" fill="url(#bldgGrad1)" filter="url(#shadow)"/>
    
    <!-- Building Side Panel for 3D depth -->
    <path d="M165 60 L185 75 L185 165 L165 160 Z" fill="url(#bldgGrad2)"/>

    <!-- Building Structural Damage / Diagonal Crack -->
    <path d="M120 60 L140 90 L110 120 L135 160" stroke="#0f172a" stroke-width="5" fill="none" stroke-linejoin="round"/>
    <path d="M120 60 L140 90 L110 120 L135 160" stroke="#f97316" stroke-width="2" fill="none" stroke-linejoin="round"/>

    <!-- Windows (Grid Pattern - Some broken/dark) -->
    <!-- Row 1 -->
    <rect x="85" y="70" width="16" height="20" rx="2" fill="#fbbf24" opacity="0.9"/>
    <rect x="108" y="70" width="16" height="20" rx="2" fill="#1e293b"/>
    <rect x="138" y="75" width="16" height="20" rx="2" fill="#fbbf24" opacity="0.4"/>
    
    <!-- Row 2 -->
    <rect x="85" y="98" width="16" height="20" rx="2" fill="#fbbf24" opacity="0.8"/>
    <rect x="108" y="98" width="16" height="20" rx="2" fill="#fbbf24" opacity="0.9"/>
    <rect x="135" y="103" width="16" height="20" rx="2" fill="#1e293b"/>

    <!-- Row 3 -->
    <rect x="85" y="126" width="16" height="20" rx="2" fill="#1e293b"/>
    <rect x="108" y="126" width="16" height="20" rx="2" fill="#fbbf24" opacity="0.9"/>
    <rect x="132" y="131" width="16" height="20" rx="2" fill="#fbbf24" opacity="0.7"/>

    <!-- Falling Debris / Bricks -->
    <g filter="url(#shadow)">
      <rect x="55" y="120" width="12" height="8" rx="1" fill="#64748b" transform="rotate(-25 61 124)"/>
      <rect x="165" y="140" width="10" height="7" rx="1" fill="#475569" transform="rotate(45 170 143)"/>
      <circle cx="150" cy="120" r="4" fill="#64748b"/>
      <circle cx="68" cy="150" r="3" fill="#475569"/>
    </g>

    <!-- Street Lamp (Bent and Flickering) -->
    <path d="M45 160 L50 110 L40 100" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lamp Head -->
    <path d="M32 98 L48 98 L53 104 L27 104 Z" fill="#334155"/>
    <!-- Lamp Cone Light -->
    <polygon points="40,104 20,165 75,160" fill="#fde047" opacity="0.15"/>
    <!-- Lamp Bulb -->
    <circle cx="40" cy="106" r="4" fill="#fef08a"/>
    <!-- Spark / Electric Flash -->
    <path d="M40 115 L45 125 L35 128 L42 140" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <!-- FOREGROUND IMPACT / DUST CLOUDS -->
  <g opacity="0.8">
    <circle cx="70" cy="190" r="18" fill="#64748b" opacity="0.4" filter="url(#shadow)"/>
    <circle cx="95" cy="210" r="25" fill="#475569" opacity="0.5" filter="url(#shadow)"/>
    <circle cx="130" cy="200" r="15" fill="#64748b" opacity="0.3"/>
    <circle cx="50" cy="220" r="20" fill="#334155" opacity="0.6"/>
  </g>

  <!-- ACTION VIBRATION LINES (Seismic Waves in Air) -->
  <path d="M20 90 Q30 80 20 70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M12 85 Q25 72 15 60" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <path d="M220 110 Q230 100 220 90" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M228 105 Q238 95 228 85" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- UI / Frame Accent (Rounded border overlay for app consistency) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>