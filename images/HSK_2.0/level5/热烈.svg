<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="240" height="240" fill="url(#bgGrad)" />

    <!-- Ambient Lighting Effects -->
    <circle cx="120" cy="90" r="100" fill="url(#lampGlow)" />
    <path d="M 0,160 Q 120,130 240,160 L 240,240 L 0,240 Z" fill="url(#warmGlow)" />

    <!-- Office / Study Room Background Details -->
    <!-- Window backdrop showing night city glow -->
    <rect x="85" y="25" width="70" height="65" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M120,25 V90 M85,57 H155" stroke="#334155" stroke-width="1.5"/>
    <circle cx="105" cy="45" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="135" cy="40" r="1.5" fill="#f43f5e" opacity="0.6"/>
    <circle cx="140" cy="70" r="2" fill="#34d399" opacity="0.6"/>

    <!-- Bookshelf and Props in Background -->
    <rect x="25" y="35" width="40" height="8" rx="2" fill="#334155"/>
    <rect x="30" y="22" width="6" height="13" rx="1" fill="#f43f5e"/>
    <rect x="38" y="20" width="8" height="15" rx="1" fill="#38bdf8"/>
    <rect x="48" y="24" width="5" height="11" rx="1" fill="#fbbf24"/>

    <!-- Hanging Pendant Lamp -->
    <path d="M120,0 V35" stroke="#64748b" stroke-width="2"/>
    <path d="M100,35 H140 L145,45 H95 Z" fill="#475569"/>
    <path d="M102,45 Q120,55 138,45 Z" fill="#fbbf24"/>

    <!-- Main Conference Table -->
    <path d="M 40,185 Q 120,165 200,185 L 210,215 Q 120,225 30,215 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <ellipse cx="120" cy="183" rx="80" ry="12" fill="#334155"/>
    <ellipse cx="120" cy="181" rx="76" ry="10" fill="#1e293b"/>

    <!-- Table Props: Laptops, Sticky Notes, Coffee Mug, Documents -->
    <!-- Central Idea/Discussion Hub (Tablet with colorful diagrams) -->
    <rect x="105" y="172" width="30" height="18" rx="2" fill="#475569" transform="rotate(-5 120 180)"/>
    <rect x="107" y="174" width="26" height="14" rx="1" fill="#0f172a" transform="rotate(-5 120 180)"/>
    <path d="M110,185 Q115,178 120,182 T130,177" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Laptop Left -->
    <path d="M 60,192 L 75,182 H 95 L 85,195 Z" fill="#64748b"/>
    <path d="M 55,195 H 90 L 93,198 H 52 Z" fill="#94a3b8"/>

    <!-- Coffee Mug -->
    <rect x="155" y="175" width="10" height="12" rx="2" fill="#f8fafc"/>
    <path d="M165,178 C169,178 169,184 165,184" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <path d="M158,172 Q160,168 162,172" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Dynamic Energetic "Discussion" Floating Elements (Representing 热烈 / Liveliness) -->
    <!-- Speech Bubbles & Emotion Sparks -->
    <g transform="translate(0,-5)">
      <!-- Left Bubble -->
      <path d="M 55,75 Q 55,65 65,65 H 85 Q 95,65 95,75 V 85 Q 95,95 85,95 H 75 L 65,105 V 95 H 65 Q 55,95 55,85 Z" fill="#38bdf8" opacity="0.9"/>
      <circle cx="70" cy="80" r="3" fill="#0f172a"/>
      <circle cx="78" cy="80" r="3" fill="#0f172a"/>
      <circle cx="86" cy="80" r="3" fill="#0f172a"/>

      <!-- Right Bubble -->
      <path d="M 145,70 Q 145,60 155,60 H 185 Q 195,60 195,70 V 80 Q 195,90 185,90 H 175 L 170,100 L 165,90 H 155 Q 145,90 145,80 Z" fill="#ec4899" opacity="0.9"/>
      <path d="M 157,75 Q 170,85 183,75" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

      <!-- Energy / Excitement Sparks -->
      <path d="M 115,55 L 118,45 L 125,50 Z" fill="#fbbf24"/>
      <path d="M 125,55 L 132,48 L 128,58 Z" fill="#f43f5e"/>
      <circle cx="102" cy="62" r="3" fill="#34d399"/>
      <circle cx="138" cy="60" r="2.5" fill="#fbbf24"/>
    </g>

    <!-- CHARACTER 1: Left (Excited speaker, gesturing actively) -->
    <g transform="translate(35, 105)">
      <!-- Body / Torso -->
      <path d="M 25,60 C 25,45 35,35 50,35 C 65,35 75,45 75,60 L 80,95 H 20 Z" fill="#3b82f6"/>
      <!-- Collar / Shirt Detail -->
      <path d="M 42,35 L 50,48 L 58,35 Z" fill="#f8fafc"/>
      <!-- Head -->
      <circle cx="50" cy="22" r="16" fill="#fbcfe8"/>
      <!-- Hair -->
      <path d="M 34,22 C 34,10 44,8 50,8 C 58,8 66,12 66,22 C 66,25 64,22 62,17 C 58,12 42,12 38,17 C 35,22 34,22 34,22 Z" fill="#1e293b"/>
      <!-- Facial Expression (Lively speaking/smiling) -->
      <path d="M 42,20 Q 46,16 50,20" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 54,20 Q 58,16 62,20" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 47,26 Q 52,33 57,26 Z" fill="#e11d48"/> <!-- Open mouth smiling -->
      <!-- Raised Active Arm -->
      <path d="M 25,45 Q 15,35 10,25" fill="none" stroke="#3b82f6" stroke-width="9" stroke-linecap="round"/>
      <circle cx="8" cy="22" r="5" fill="#fbcfe8"/>
      <!-- Lower Arm resting -->
      <path d="M 70,50 Q 82,60 85,75" fill="none" stroke="#3b82f6" stroke-width="9" stroke-linecap="round"/>
      <circle cx="87" cy="78" r="5" fill="#fbcfe8"/>
    </g>

    <!-- CHARACTER 2: Right (Engaged listener leaning in, smiling, nodding) -->
    <g transform="translate(130, 100)">
      <!-- Body / Torso -->
      <path d="M 25,65 C 25,50 35,40 50,40 C 65,40 75,50 75,65 L 85,100 H 15 Z" fill="#10b981"/>
      <!-- Collar / Scarf -->
      <path d="M 38,40 Q 50,52 62,40 Z" fill="#fbbf24"/>
      <!-- Head (Leaning slightly forward) -->
      <circle cx="48" cy="24" r="16" fill="#fde68a"/>
      <!-- Hair -->
      <path d="M 32,24 C 32,10 42,8 52,10 C 62,12 64,22 64,28 C 50,26 40,28 32,24 Z" fill="#78350f"/>
      <!-- Facial Expression (Wide enthusiastic smile, eyes closed in joy) -->
      <path d="M 40,24 Q 44,20 48,24" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <path d="M 52,24 Q 56,20 60,24" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <path d="M 44,29 Q 50,36 56,29 Z" fill="#b91c1c"/>
      <!-- Arms / Hands clapping or resting forward -->
      <path d="M 70,55 Q 85,65 75,80" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
      <circle cx="72" cy="83" r="5" fill="#fde68a"/>
      <path d="M 30,55 Q 15,65 25,80" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
      <circle cx="27" cy="83" r="5" fill="#fde68a"/>
    </g>

    <!-- CHARACTER 3: Center-Back (Participating eagerly, pointing at idea) -->
    <g transform="translate(85, 90)">
      <!-- Body / Torso -->
      <path d="M 25,65 C 25,50 35,40 50,40 C 65,40 75,50 75,65 L 80,105 H 20 Z" fill="#8b5cf6"/>
      <!-- Collar -->
      <path d="M 42,40 L 50,50 L 58,40 Z" fill="#f8fafc"/>
      <!-- Head -->
      <circle cx="50" cy="24" r="15" fill="#ffedd5"/>
      <!-- Hair -->
      <path d="M 35,24 C 35,12 42,8 50,8 C 58,8 65,12 65,24 C 60,20 40,20 35,24 Z" fill="#475569"/>
      <!-- Face -->
      <circle cx="44" cy="23" r="1.5" fill="#1e293b"/>
      <circle cx="56" cy="23" r="1.5" fill="#1e293b"/>
      <path d="M 46,29 Q 50,33 54,29" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
      <!-- Pointing Arm -->
      <path d="M 65,55 Q 75,45 85,40" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
      <circle cx="88" cy="38" r="4.5" fill="#ffedd5"/>
    </g>

    <!-- Foreground Decorative Elements / Warm Vignette -->
    <!-- Floating energetic light particles -->
    <circle cx="35" cy="130" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="205" cy="120" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="190" cy="150" r="2" fill="#ec4899" opacity="0.9"/>
    <circle cx="50" cy="160" r="2.5" fill="#34d399" opacity="0.7"/>

  </g>
</svg>