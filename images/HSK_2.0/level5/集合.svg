<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stadium Turf Gradient -->
    <linearGradient id="turfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Running Track Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Spotlight Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0"/>
    </linearGradient>

    <!-- UI/Focus Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Stadium Night Sky Elements -->
  <g id="stadium-sky">
    <!-- Stadium Architecture / Floodlights in background -->
    <path d="M 30 110 L 40 70 L 60 70 L 70 110 Z" fill="#334155" opacity="0.4"/>
    <path d="M 170 110 L 180 70 L 200 70 L 210 110 Z" fill="#334155" opacity="0.4"/>
    <!-- Floodlight Fixtures -->
    <rect x="42" y="65" width="16" height="8" rx="2" fill="#fbbf24" opacity="0.8"/>
    <rect x="182" y="65" width="16" height="8" rx="2" fill="#fbbf24" opacity="0.8"/>
    <!-- Stadium Roof silhouette -->
    <path d="M 10 115 Q 120 95 230 115 L 240 120 L 0 120 Z" fill="#0f172a"/>
  </g>

  <!-- Stadium Spotlight Beams (Gathering atmosphere) -->
  <polygon points="50,73 20,180 90,180" fill="url(#beamGrad)"/>
  <polygon points="190,73 150,180 220,180" fill="url(#beamGrad)"/>

  <!-- Stadium Ground (Track & Field) -->
  <!-- Outer running track curve -->
  <path d="M 0 130 C 60 115, 180 115, 240 130 L 240 220 C 180 235, 60 235, 0 220 Z" fill="url(#trackGrad)"/>
  <!-- Track lane lines -->
  <path d="M 0 145 C 60 132, 180 132, 240 145" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4 2" fill="none" opacity="0.7"/>
  <path d="M 0 160 C 60 147, 180 147, 240 160" stroke="#fca5a5" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Inner Green Turf -->
  <path d="M 20 170 C 70 160, 170 160, 220 170 L 215 225 C 170 232, 70 232, 25 225 Z" fill="url(#turfGrad)"/>
  <ellipse cx="120" cy="198" rx="75" ry="18" fill="#059669" opacity="0.5"/>
  <circle cx="120" cy="198" r="14" stroke="#a7f3d0" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Central Gathering Group (People gathering together) -->
  <g id="gathering-group" filter="url(#glow)">
    
    <!-- Person 1 (Left - Coach pointing/organizing) -->
    <g transform="translate(85, 170)">
      <!-- Shadow -->
      <ellipse cx="0" cy="30" rx="8" ry="3" fill="#022c22" opacity="0.6"/>
      <!-- Body/Torso -->
      <path d="M -6 12 L 6 12 L 8 28 L -8 28 Z" fill="#38bdf8"/>
      <!-- Head -->
      <circle cx="0" cy="3" r="6" fill="#fbcfe8"/>
      <!-- Hair -->
      <path d="M -6 1 C -6 -2, 6 -2, 6 1 Z" fill="#334155"/>
      <!-- Raised arm pointing -->
      <path d="M 6 15 L 14 8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <!-- Legs -->
      <line x1="-3" y1="28" x2="-4" y2="42" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <line x1="3" y1="28" x2="4" y2="42" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Person 2 (Center - Energetic participant waving) -->
    <g transform="translate(120, 162)">
      <!-- Shadow -->
      <ellipse cx="0" cy="38" rx="9" ry="3.5" fill="#022c22" opacity="0.6"/>
      <!-- Body/Torso -->
      <path d="M -7 15 L 7 15 L 9 34 L -9 34 Z" fill="#fb923c"/>
      <!-- Head -->
      <circle cx="0" cy="7" r="7" fill="#fed7aa"/>
      <!-- Hair/Cap -->
      <path d="M -7 5 L 7 5 L 8 3 L -7 3 Z" fill="#1e293b"/>
      <!-- Waving arms -->
      <path d="M -7 18 L -15 12" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 7 18 L 14 10" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Legs -->
      <line x1="-4" y1="34" x2="-5" y2="50" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="4" y1="34" x2="5" y2="50" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Person 3 (Right - Jogging in to join) -->
    <g transform="translate(155, 175)">
      <!-- Shadow -->
      <ellipse cx="0" cy="25" rx="7" ry="2.5" fill="#022c22" opacity="0.6"/>
      <!-- Body/Torso angled -->
      <path d="M -5 10 L 8 12 L 5 26 L -7 24 Z" fill="#10b981"/>
      <!-- Head -->
      <circle cx="2" cy="2" r="6" fill="#fbcfe8"/>
      <!-- Hair ponytail -->
      <path d="M 7 1 C 10 2, 10 5, 8 6 Z" fill="#94a3b8"/>
      <!-- Arms -->
      <path d="M -4 14 L -10 20" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <!-- Legs running -->
      <line x1="-2" y1="25" x2="-8" y2="38" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <line x1="3" y1="25" x2="8" y2="35" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Person 4 (Background left - arriving) -->
    <g transform="translate(60, 185)">
      <ellipse cx="0" cy="20" rx="6" ry="2" fill="#022c22" opacity="0.5"/>
      <path d="M -5 8 L 5 8 L 4 20 L -4 20 Z" fill="#a855f7"/>
      <circle cx="0" cy="1" r="5" fill="#fed7aa"/>
      <line x1="-2" y1="20" x2="-3" y2="32" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="2" y1="20" x2="3" y2="32" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Person 5 (Background right - arriving) -->
    <g transform="translate(180, 180)">
      <ellipse cx="0" cy="22" rx="6" ry="2" fill="#022c22" opacity="0.5"/>
      <path d="M -5 9 L 5 9 L 6 22 L -4 22 Z" fill="#e11d48"/>
      <circle cx="0" cy="2" r="5" fill="#fbcfe8"/>
      <line x1="-2" y1="22" x2="-1" y2="34" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="3" y1="22" x2="5" y2="34" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Props (Stadium elements) -->
  <!-- Sports cone marking the gathering spot -->
  <g transform="translate(120, 205)">
    <!-- Base -->
    <ellipse cx="0" cy="6" rx="10" ry="4" fill="#0f172a"/>
    <!-- Cone Body -->
    <polygon points="-8,6 8,6 2,-6 -2,-6" fill="#f97316"/>
    <!-- Reflective stripe -->
    <polygon points="-4,-1 4,-1 2,-3 -2,-3" fill="#f8fafc"/>
    <!-- Top knob -->
    <circle cx="0" cy="-7" r="1.5" fill="#f8fafc"/>
  </g>

  <!-- Clipboard / Megaphone icon props on ground representing organization -->
  <g transform="translate(95, 208)">
    <rect x="-6" y="-4" width="12" height="10" rx="1" fill="#cbd5e1" transform="rotate(-15)"/>
    <rect x="-4" y="-2" width="8" height="6" fill="#3b82f6" transform="rotate(-15)"/>
  </g>

  <!-- Dynamic convergence arrows (visual cue for gathering/jíhé) -->
  <g opacity="0.6">
    <path d="M 50 150 Q 80 160, 110 190" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="112,193 105,189 109,185" fill="#fbbf24"/>

    <path d="M 190 155 Q 155 165, 130 190" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="127,193 133,185 131,189" fill="#fbbf24"/>
  </g>

  <!-- Sparkles / Energy points overhead -->
  <g fill="#fbbf24">
    <circle cx="120" cy="135" r="2.5" opacity="0.9"/>
    <path d="M 120 128 L 122 133 L 127 135 L 122 137 L 120 142 L 118 137 L 113 135 L 118 133 Z" opacity="0.8"/>
    
    <circle cx="95" cy="142" r="1.5" opacity="0.7"/>
    <circle cx="148" cy="140" r="2" opacity="0.8"/>
  </g>

  <!-- Vignette / Border Frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>