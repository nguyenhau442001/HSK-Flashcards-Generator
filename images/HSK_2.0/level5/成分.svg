<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(40, 60)">
    <!-- Beaker -->
    <path d="M40 10 L120 10 L110 120 C110 130 50 130 50 120 L40 10" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Ingredients inside -->
    <rect x="55" y="90" width="50" height="20" rx="4" fill="#fb923c"/>
    <circle cx="80" cy="70" r="12" fill="#10b981"/>
    <path d="M60 40 L100 40 L95 60 L65 60 Z" fill="#ec4899"/>
    
    <!-- Floating particles -->
    <circle cx="130" cy="30" r="4" fill="#f59e0b"/>
    <circle cx="140" cy="50" r="3" fill="#fbbf24"/>
    <circle cx="20" cy="80" r="5" fill="#38bdf8"/>
    
    <!-- Table surface -->
    <rect x="-20" y="130" width="200" height="10" rx="2" fill="#475569"/>
    
    <!-- Magnifying glass looking at the beaker -->
    <circle cx="150" cy="100" r="25" fill="none" stroke="#f59e0b" stroke-width="6"/>
    <line x1="168" y1="118" x2="190" y2="140" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>