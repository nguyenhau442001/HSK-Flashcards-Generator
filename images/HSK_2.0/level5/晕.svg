<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Floor/Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Character Body -->
  <g transform="translate(120, 160)">
    <!-- Legs -->
    <rect x="-15" y="0" width="10" height="40" rx="5" fill="#fb923c"/>
    <rect x="5" y="0" width="10" height="40" rx="5" fill="#fb923c"/>
    <!-- Torso -->
    <rect x="-25" y="-60" width="50" height="60" rx="15" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-90" r="30" fill="#fde68a"/>
    <!-- Eyes (Closed/Dizzy) -->
    <path d="M-15 -95 L-5 -85 M-5 -95 L-15 -85" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 -95 L15 -85 M15 -95 L5 -85" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M-10 -70 Q0 -65 10 -70" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Dizzy Stars/Effect -->
  <g fill="#fbbf24">
    <path d="M100 50 L105 65 L120 65 L108 75 L112 90 L100 80 L88 90 L92 75 L80 65 L95 65 Z"/>
    <path d="M140 40 L143 50 L153 50 L145 56 L148 66 L140 60 L132 66 L135 56 L127 50 L137 50 Z"/>
  </g>
  
  <!-- Background Props (Table/Chair) -->
  <rect x="180" y="120" width="40" height="80" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="200" cy="110" r="15" fill="#ec4899"/>
  <rect x="20" y="140" width="30" height="60" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
</svg>