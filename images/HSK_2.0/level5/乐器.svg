<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="stageGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Wood Gradient for Guqin / Instruments -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Guitar Body Gradient -->
    <linearGradient id="guitarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Stage Lighting -->
  <circle cx="120" cy="100" r="100" fill="url(#stageGlow)" />

  <!-- BACKGROUND ENVIRONMENT: Music Studio / Room Interior -->
  <g id="background-room">
    <!-- Window with night city glow / stars -->
    <rect x="175" y="25" width="45" height="65" rx="4" fill="#334155" opacity="0.5" />
    <circle cx="190" cy="45" r="2" fill="#fbbf24" opacity="0.8" />
    <circle cx="205" cy="65" r="1.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="185" cy="70" r="1.5" fill="#ffffff" opacity="0.6" />

    <!-- Wooden Shelf with Music Props -->
    <rect x="20" y="30" width="70" height="6" rx="2" fill="#475569" />
    <!-- Metronome -->
    <path d="M 45 30 L 52 12 L 55 12 L 50 30 Z" fill="#64748b" />
    <circle cx="50" cy="20" r="1.5" fill="#facc15" />
    <!-- Music Notes / Books -->
    <rect x="30" y="16" width="10" height="14" rx="1" fill="#ec4899" />
    <rect x="60" y="14" width="12" height="16" rx="1" fill="#38bdf8" />

    <!-- Wall Mounted Instruments (乐器 collection background) -->
    <!-- Pipa (traditional lute silhouette) -->
    <g transform="translate(25, 45) scale(0.6)" opacity="0.7">
      <path d="M 15 0 L 19 0 L 18 35 C 24 38, 26 48, 22 55 C 16 62, 10 62, 4 55 C 0 48, 2 38, 8 35 Z" fill="#94a3b8" />
    </g>
    <!-- Violin silhouette -->
    <g transform="translate(205, 40) scale(0.5) rotate(15)" opacity="0.7">
      <path d="M 10 0 L 14 0 L 13 15 C 18 16, 18 24, 13 26 C 10 32, 16 38, 12 45 C 9 40, 5 40, 3 45 C -1 38, 5 32, 2 26 C -3 24, -3 16, 1 15 Z" fill="#94a3b8" />
    </g>

    <!-- Acoustic Guitar on Stand (Right foreground background) -->
    <g transform="translate(180, 110)" filter="url(#softShadow)">
      <!-- Stand -->
      <path d="M 10 60 L 25 30 L 40 60" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <line x1="25" y1="30" x2="25" y2="75" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <!-- Guitar Body & Neck -->
      <path d="M 22 5 L 28 5 L 28 25 C 38 28, 42 42, 35 55 C 30 63, 20 63, 15 55 C 8 42, 12 28, 22 25 Z" fill="url(#woodGrad)" />
      <circle cx="25" cy="40" r="6" fill="#1e293b" />
    </g>

    <!-- Floor Line & Rug -->
    <ellipse cx="120" cy="210" rx="90" ry="18" fill="#0f172a" opacity="0.6" />
    <path d="M 30 200 C 30 190, 210 190, 210 200 C 210 210, 30 210, 30 200 Z" fill="#334155" opacity="0.8" />
  </g>

  <!-- MAIN CHARACTER & PRIMARY INSTRUMENT (Acoustic Guitar / Multi-instrumentalist concept) -->
  <g id="main-character">
    <!-- Character Shadow -->
    <ellipse cx="110" cy="205" rx="35" ry="10" fill="#090d16" opacity="0.5" />

    <!-- Chair / Stool -->
    <path d="M 90 175 L 130 175 L 125 200 L 95 200 Z" fill="#475569" />
    <line x1="97" y1="200" x2="90" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <line x1="123" y1="200" x2="130" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round" />

    <!-- Character Body / Torso (Warm hoodie / sweater) -->
    <path d="M 90 130 C 85 110, 100 100, 115 105 C 130 100, 145 110, 140 130 C 145 150, 135 175, 115 175 C 95 175, 85 150, 90 130 Z" fill="#3b82f6" filter="url(#softShadow)" />

    <!-- Head & Face -->
    <circle cx="115" cy="85" r="18" fill="#fed7aa" />
    <!-- Hair (Stylized modern hair) -->
    <path d="M 97 85 C 97 70, 110 65, 125 72 C 133 76, 133 88, 133 88 C 133 88, 125 78, 115 78 C 105 78, 97 85, 97 85 Z" fill="#1e293b" />
    <!-- Happy / Engaged Facial Expression -->
    <path d="M 110 84 Q 113 87 116 84" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" /> <!-- Closed happy eye -->
    <path d="M 120 84 Q 123 87 126 84" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 116 92 Q 118 95 120 92" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" /> <!-- Smile -->
    <!-- Cute rosy cheeks -->
    <circle cx="109" cy="89" r="3" fill="#fca5a5" opacity="0.6" />
    <circle cx="127" cy="89" r="3" fill="#fca5a5" opacity="0.6" />

    <!-- Left Arm (Holding Guitar Neck) -->
    <path d="M 95 115 C 80 120, 70 135, 65 145" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <!-- Left Hand on Fretboard -->
    <circle cx="63" cy="147" r="4" fill="#fed7aa" />

    <!-- Acoustic Guitar (Being Actively Played) -->
    <g transform="translate(70, 105) rotate(-15)">
      <!-- Guitar Neck & Headstock -->
      <rect x="-35" y="35" width="45" height="8" rx="2" fill="#92400e" transform="rotate(-35 -35 35)" />
      <!-- Guitar Body -->
      <path d="M 0 45 C -15 25, 15 5, 30 25 C 45 45, 30 75, 10 70 C -5 65, -10 60, 0 45 Z" fill="url(#guitarGrad)" filter="url(#softShadow)" />
      <!-- Soundhole -->
      <circle cx="13" cy="42" r="7" fill="#1e293b" />
      <!-- Bridge & Strings -->
      <line x1="5" y1="52" x2="21" y2="36" stroke="#cbd5e1" stroke-width="1" />
      <line x1="7" y1="54" x2="23" y2="38" stroke="#cbd5e1" stroke-width="1" />
      <line x1="9" y1="56" x2="25" y2="40" stroke="#cbd5e1" stroke-width="1" />
    </g>

    <!-- Right Arm (Plucking Strings) -->
    <path d="M 130 115 C 135 125, 125 140, 115 145" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <!-- Right Hand -->
    <circle cx="113" cy="146" r="4" fill="#fed7aa" />

    <!-- Legs & Shoes -->
    <path d="M 102 175 L 98 210 L 108 212 L 112 175 Z" fill="#1e293b" />
    <path d="M 125 175 L 132 208 L 142 206 L 133 175 Z" fill="#1e293b" />
    <!-- Sneaker details -->
    <ellipse cx="104" cy="211" rx="6" ry="3" fill="#ffffff" />
    <ellipse cx="137" cy="207" rx="6" ry="3" fill="#ffffff" />
  </g>

  <!-- FOREGROUND / INTERACTION PROPS (Representing "many instruments" / 乐器 diversity) -->
  <g id="secondary-instruments">
    <!-- Keyboard / Synthesizer (Bottom Left) -->
    <g transform="translate(15, 175) rotate(-5)" filter="url(#softShadow)">
      <rect x="0" y="0" width="55" height="25" rx="3" fill="#334155" />
      <!-- Keyboard Keys Pattern -->
      <rect x="4" y="10" width="47" height="12" rx="1" fill="#1e293b" />
      <!-- White keys representation -->
      <line x1="10" y1="10" x2="10" y2="22" stroke="#64748b" stroke-width="1" />
      <line x1="16" y1="10" x2="16" y2="22" stroke="#64748b" stroke-width="1" />
      <line x1="22" y1="10" x2="22" y2="22" stroke="#64748b" stroke-width="1" />
      <line x1="28" y1="10" x2="28" y2="22" stroke="#64748b" stroke-width="1" />
      <line x1="34" y1="10" x2="34" y2="22" stroke="#64748b" stroke-width="1" />
      <line x1="40" y1="10" x2="40" y2="22" stroke="#64748b" stroke-width="1" />
      <!-- Dial knobs -->
      <circle cx="8" cy="5" r="2" fill="#38bdf8" />
      <circle cx="16" cy="5" r="2" fill="#f59e0b" />
    </g>

    <!-- Brass Trumpet / Horn (Bottom Right leaning on stand) -->
    <g transform="translate(195, 160) rotate(25)" filter="url(#softShadow)">
      <!-- Bell -->
      <path d="M 0 0 C 15 -5, 20 15, 0 10 Z" fill="#fbbf24" />
      <!-- Tubing -->
      <path d="M -25 5 L 0 3 C -5 12, -15 12, -20 5" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
      <!-- Valves -->
      <rect x="-15" y="-3" width="6" height="8" rx="1" fill="#f59e0b" />
    </g>
  </g>

  <!-- MUSICAL NOTES & VIBE (Dynamic floating elements) -->
  <g id="musical-notes">
    <!-- Note 1 -->
    <path d="M 155 75 C 155 70, 165 65, 165 55 L 165 70 M 155 72 C 155 68, 165 63, 165 53" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <circle cx="152" cy="74" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="162" cy="70" r="3" fill="#38bdf8" opacity="0.8" />

    <!-- Note 2 -->
    <path d="M 85 55 L 85 40 M 85 43 Q 90 40 95 43" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <circle cx="82" cy="55" r="2.5" fill="#fbbf24" opacity="0.8" />

    <!-- Sparkles / Joy indicators -->
    <path d="M 140 45 L 143 50 L 148 53 L 143 56 L 140 61 L 137 56 L 132 53 L 137 50 Z" fill="#f59e0b" opacity="0.7" />
    <path d="M 70 85 L 72 88 L 75 90 L 72 92 L 70 95 L 68 92 L 65 90 L 68 88 Z" fill="#38bdf8" opacity="0.7" />
  </g>
</svg>