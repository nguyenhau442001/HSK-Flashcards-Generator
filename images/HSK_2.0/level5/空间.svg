<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Room Lighting & Window Sill -->
  <path d="M140 30 L210 50 L210 210 L140 210 Z" fill="#1e293b" opacity="0.6"/>
  <rect x="25" y="45" width="105" height="155" rx="4" fill="#1e293b"/>
  <rect x="30" y="50" width="95" height="145" rx="2" fill="#0f172a"/>
  
  <!-- Window view / Night sky outside -->
  <circle cx="77.5" cy="100" r="18" fill="#38bdf8" opacity="0.15"/>
  <circle cx="60" cy="140" r="2" fill="#cbd5e1" opacity="0.4"/>
  <circle cx="100" cy="70" r="1.5" fill="#cbd5e1" opacity="0.4"/>
  <circle cx="90" cy="160" r="1" fill="#cbd5e1" opacity="0.4"/>

  <!-- Warm interior glow casting light -->
  <path d="M140 120 L210 160 L140 200 Z" fill="#f59e0b" opacity="0.05"/>

  <!-- Bookshelf / Environment Props in Background -->
  <rect x="155" y="70" width="45" height="6" rx="2" fill="#334155"/>
  <rect x="165" y="85" width="35" height="6" rx="2" fill="#334155"/>
  <rect x="160" y="55" width="8" height="15" fill="#f43f5e" rx="1"/>
  <rect x="170" y="52" width="6" height="18" fill="#38bdf8" rx="1"/>
  <rect x="180" y="57" width="10" height="13" fill="#10b981" rx="1"/>

  <!-- Desk & Personal Space Elements -->
  <!-- Desk surface -->
  <path d="M10 185 L230 185 L220 210 L20 210 Z" fill="#334155"/>
  <rect x="15" y="180" width="210" height="7" rx="2" fill="#475569"/>

  <!-- Desk Props (Laptop, Lamp, Coffee Mug) -->
  <!-- Modern sleek laptop -->
  <path d="M165 170 L210 170 L215 181 L160 181 Z" fill="#94a3b8"/>
  <path d="M163 179 L212 179 L216 182 L159 182 Z" fill="#64748b"/>
  <path d="M172 148 L203 148 C205 148 206 149 206 151 L206 170 L169 170 L169 151 C169 149 170 148 172 148 Z" fill="#cbd5e1"/>
  <rect x="175" y="153" width="26" height="13" fill="#0ea5e9" opacity="0.3"/>

  <!-- Cozy desk lamp casting warm aura -->
  <path d="M45 180 L55 180 L52 145 L48 145 Z" fill="#64748b"/>
  <path d="M40 145 L60 145 L55 135 L45 135 Z" fill="#f59e0b"/>
  <circle cx="50" cy="140" r="15" fill="#fbbf24" opacity="0.2"/>

  <!-- Coffee mug -->
  <rect x="135" y="165" width="12" height="15" rx="3" fill="#f8fafc"/>
  <path d="M147 169 C151 169 151 176 147 176" stroke="#f8fafc" stroke-width="2" fill="none"/>

  <!-- MAIN CHARACTER: Expressing need for personal space / boundaries -->
  <!-- Sitting posture, leaning slightly back, hand raised defensively/calmly -->
  
  <!-- Chair Backrest -->
  <path d="M85 105 L115 105 L118 185 L82 185 Z" fill="#1e293b"/>
  <rect x="88" y="110" width="24" height="70" rx="4" fill="#334155"/>

  <!-- Character Torso & Hoodie -->
  <path d="M80 135 C80 125 90 120 100 120 C110 120 120 125 120 135 L125 182 L75 182 Z" fill="#ec4899"/>
  
  <!-- Hood behind head -->
  <path d="M83 115 C83 100 117 100 117 115 C117 122 110 125 100 125 C90 125 83 122 83 115 Z" fill="#db2777"/>

  <!-- Head & Face (Calm, thoughtful, setting boundaries) -->
  <circle cx="100" cy="103" r="14" fill="#fbcfe8"/>
  
  <!-- Hair (Stylized modern cut) -->
  <path d="M86 102 C86 92 92 88 100 88 C108 88 114 92 114 102 C114 105 113 100 110 97 C105 93 95 93 90 97 C87 100 86 105 86 102 Z" fill="#475569"/>

  <!-- Face details (Closed eyes of contemplation, neutral peaceful mouth) -->
  <path d="M93 103 Q96 101 99 103" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M103 103 Q106 101 109 103" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M100 109 Q101 111 102 109" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Arms and Hands (Left arm resting, right hand gently raised in a 'pause/space' gesture) -->
  <!-- Left Arm -->
  <path d="M80 135 L65 155 L75 160 L85 142" fill="#db2777"/>
  <!-- Right Arm & Raised Palm (Visualizing 'Personal Space') -->
  <path d="M120 135 C130 135 138 120 138 115 L145 118 C145 125 138 145 125 150 Z" fill="#db2777"/>
  <circle cx="145" cy="115" r="5" fill="#fbcfe8"/> <!-- Hand palm facing outward -->

  <!-- VISUAL METAPHOR FOR 'KONGJIAN' (Personal Space Bubble / Soft aura boundary) -->
  <!-- Subtle glowing barrier or calm zone ring around the person -->
  <ellipse cx="100" cy="140" rx="45" ry="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <ellipse cx="100" cy="140" rx="52" ry="48" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.2"/>

  <!-- Floating soft particles/stars inside personal space to denote peace -->
  <circle cx="70" cy="120" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="130" cy="155" r="2" fill="#f43f5e" opacity="0.6"/>
  <circle cx="125" cy="90" r="1" fill="#fbbf24" opacity="0.9"/>
</svg>