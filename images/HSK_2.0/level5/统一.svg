<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M20 180 L220 180 L200 220 L40 220 Z" fill="#334155"/>
  
  <!-- Puzzle Pieces -->
  <path d="M80 140 L120 140 L120 180 L80 180 Z" fill="#38bdf8"/>
  <path d="M120 140 L160 140 L160 180 L120 180 Z" fill="#fbbf24"/>
  <path d="M100 100 L140 100 L140 140 L100 140 Z" fill="#10b981"/>
  
  <!-- Connecting lines/glows -->
  <circle cx="120" cy="140" r="8" fill="#fb923c"/>
  
  <!-- Stylized Hands holding the final piece -->
  <path d="M60 160 C 50 160, 40 150, 40 130 L 60 130 Z" fill="#ec4899"/>
  <path d="M180 160 C 190 160, 200 150, 200 130 L 180 130 Z" fill="#ec4899"/>
  
  <!-- Ambient lighting/depth -->
  <circle cx="120" cy="120" r="60" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Decorative elements for action -->
  <circle cx="40" cy="60" r="4" fill="#fbbf24"/>
  <circle cx="200" cy="80" r="6" fill="#38bdf8"/>
  <path d="M180 40 L190 50 L180 60 L170 50 Z" fill="#10b981"/>
</svg>