<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Hour Sunbeam Gradient -->
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Window Pane Shadow Clip -->
    <clipPath id="window-clip">
      <path d="M125,20 L210,20 L210,205 L125,205 Z" />
    </clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Atmosphere / Wall -->
  <rect x="15" y="15" width="210" height="210" rx="16" fill="#1b263b" />

  <!-- Window Frame & Outdoor Sunset (Representing "Time passing / youth") -->
  <g>
    <!-- Sky outside -->
    <rect x="125" y="25" width="85" height="180" rx="6" fill="#334155" />
    <circle cx="167" cy="115" r="30" fill="#f97316" opacity="0.8" />
    <!-- Sunbeams cutting through the room ("Seizing the moment") -->
    <polygon points="125,40 210,120 210,180 125,90" fill="url(#sunbeam)" />
    <polygon points="125,120 210,205 170,205 125,150" fill="url(#sunbeam)" />
    <!-- Window Grid -->
    <rect x="125" y="25" width="85" height="180" rx="6" fill="none" stroke="#0f172a" stroke-width="4" />
    <line x1="167.5" y1="25" x2="167.5" y2="205" stroke="#0f172a" stroke-width="3" />
    <line x1="125" y1="115" x2="210" y2="115" stroke="#0f172a" stroke-width="3" />
  </g>

  <!-- Bookshelf / Study Background Details -->
  <g fill="#273548">
    <rect x="30" y="45" width="35" height="8" rx="2" />
    <rect x="35" y="53" width="8" height="25" rx="1" />
    <rect x="45" y="50" width="6" height="28" rx="1" fill="#3b82f6" />
    <rect x="53" y="48" width="10" height="30" rx="1" fill="#10b981" />
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M20,185 L220,185 L210,210 L30,210 Z" fill="#334155" />
  <path d="M20,185 L220,185 L220,190 L20,190 Z" fill="#475569" />

  <!-- Study Props: Desk Lamp -->
  <g>
    <ellipse cx="55" cy="185" rx="12" ry="4" fill="#64748b" />
    <path d="M53,185 L53,165 L57,165 L57,185 Z" fill="#94a3b8" />
    <path d="M45,150 C45,140 65,140 65,150 L70,165 C70,168 67,170 63,170 L47,170 C43,170 40,168 40,165 Z" fill="#fbbf24" />
    <!-- Lamp Glow Effect -->
    <circle cx="55" cy="175" r="25" fill="url(#lamp-glow)" />
  </g>

  <!-- Study Props: Open Book & Glowing Knowledge -->
  <g transform="translate(70, 160)">
    <path d="M0,20 C15,15 35,15 50,20 L50,35 C35,30 15,30 0,35 Z" fill="#e2e8f0" />
    <path d="M50,20 C65,15 85,15 100,20 L100,35 C85,30 65,30 50,35 Z" fill="#cbd5e1" />
    <line x1="50" y1="20" x2="50" y2="35" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Dynamic action lines on pages -->
    <line x1="12" y1="23" x2="38" y2="23" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="28" x2="30" y2="28" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    <line x1="62" y1="23" x2="88" y2="23" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    <line x1="62" y1="28" x2="80" y2="28" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Main Character: Energetic Young Student seizing the moment ("趁") -->
  <g transform="translate(75, 95)">
    <!-- Body / Torso (Leaning forward eagerly) -->
    <path d="M35,60 C30,45 40,30 55,30 C70,30 80,45 75,60 L85,90 L25,90 Z" fill="#38bdf8" />
    <path d="M45,30 L65,30 L60,50 L50,50 Z" fill="#cbd5e1" /> <!-- Collar -->

    <!-- Head & Hair (Youthful, determined expression) -->
    <circle cx="55" cy="18" r="18" fill="#fcd34d" />
    <!-- Hair Spikes -->
    <path d="M37,15 C35,5 45,2 55,5 C65,2 75,5 73,15 C78,10 75,25 65,28 C55,30 45,30 37,25 C32,20 35,15 37,15 Z" fill="#1e293b" />
    
    <!-- Determined Face Profile -->
    <circle cx="62" cy="18" r="2.5" fill="#1e293b" />
    <path d="M66,22 Q69,24 67,26" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" /> <!-- Confident smile -->

    <!-- Arms in Action (Writing / Working vigorously) -->
    <!-- Left Arm -->
    <path d="M35,45 C20,50 15,65 25,75" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    <!-- Right Arm holding pen -->
    <path d="M75,45 C90,55 95,70 85,80" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    
    <!-- Hand & Pen -->
    <circle cx="85" cy="80" r="5" fill="#fcd34d" />
    <line x1="85" y1="80" x2="95" y2="95" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Floating Sparkles / Momentum Elements (Action-packed metaphor for seizing time) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M35,80 Q35,90 25,90 Q35,90 35,100 Q35,90 45,90 Q35,90 35,80" transform="scale(0.8) translate(10, 10)" />
    <!-- Star 2 -->
    <path d="M110,60 Q110,70 100,70 Q110,70 110,80 Q110,70 120,70 Q110,70 110,60" />
    <!-- Glowing Particle -->
    <circle cx="105" cy="130" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="35" cy="135" r="2" fill="#10b981" opacity="0.9" />
  </g>

  <!-- Foreground Vignette / Frame border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="4" opacity="0.5" />
</svg>