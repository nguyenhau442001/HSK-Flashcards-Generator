<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hologram/Document Glow -->
    <linearGradient id="docGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Context: Office Wall & Window -->
  <path d="M0 0 H240 V155 H0 Z" fill="#1e293b" />
  
  <!-- Large Architecture Window showing subtle night cityscape -->
  <rect x="140" y="25" width="75" height="110" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
  <line x1="177" y1="25" x2="177" y2="135" stroke="#334155" stroke-width="1.5" />
  <line x1="140" y1="80" x2="215" y2="80" stroke="#334155" stroke-width="1.5" />
  <!-- City skyline silhouettes outside -->
  <path d="M145 135 L145 110 L153 110 L153 135 L162 135 L162 95 L170 95 L170 135 L185 135 L185 105 L195 105 L195 135 L210 135 L210 120 L215 120 L215 135 Z" fill="#1e293b" />
  <polygon points="177,40 183,55 171,55" fill="#f59e0b" opacity="0.6" />

  <!-- Window Light Beam casting on scene -->
  <polygon points="140,25 215,25 240,160 180,160" fill="url(#windowLight)" />

  <!-- Bookshelf in background -->
  <rect x="25" y="35" width="45" height="90" fill="#0f172a" rx="2" />
  <rect x="30" y="55" width="35" height="4" fill="#334155" />
  <rect x="30" y="80" width="35" height="4" fill="#334155" />
  <rect x="30" y="105" width="35" height="4" fill="#334155" />
  <!-- Books -->
  <path d="M33 55 L33 45 L38 45 L38 55 Z" fill="#ec4899" />
  <path d="M40 55 L40 42 L46 42 L46 55 Z" fill="#38bdf8" />
  <path d="M48 55 L52 46 L58 48 L54 55 Z" fill="#10b981" />
  <path d="M33 80 L33 68 L39 68 L39 80 Z" fill="#f59e0b" />
  <path d="M42 80 L42 70 L48 70 L48 80 Z" fill="#8b5cf6" />

  <!-- Office Floor -->
  <path d="M0 155 H240 V240 H0 Z" fill="#0f172a" />
  <line x1="0" y1="155" x2="240" y2="155" stroke="#334155" stroke-width="2" />

  <!-- Large Office Desk -->
  <path d="M30 155 L50 135 H210 L230 155 Z" fill="#334155" />
  <rect x="35" y="155" width="190" height="10" fill="#475569" rx="2" />
  <!-- Desk legs -->
  <rect x="55" y="165" width="10" height="60" fill="#1e293b" />
  <rect x="195" y="165" width="10" height="60" fill="#1e293b" />

  <!-- Desk Lamp -->
  <path d="M60 135 L70 95 L80 95 L75 135 Z" fill="#64748b" />
  <path d="M62 92 C62 85 78 85 78 92 Z" fill="#fbbf24" />
  <circle cx="70" cy="92" r="25" fill="url(#lampGlow)" />

  <!-- Main Blueprint / Institutional Chart on Desk (Representing the 'System' / 制度) -->
  <g transform="translate(100, 115)">
    <!-- Document Base -->
    <rect x="0" y="0" width="70" height="45" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" transform="rotate(-5 35 22)" />
    <!-- Structured Graph elements on paper -->
    <path d="M10 10 L25 25 L40 18 L55 32" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-5 35 22)" />
    <circle cx="25" cy="25" r="3" fill="#f59e0b" />
    <circle cx="40" cy="18" r="3" fill="#f59e0b" />
    <circle cx="55" cy="32" r="3" fill="#10b981" />
  </g>

  <!-- SECOND CHARACTER (Collaborator pointing/discussing) -->
  <g transform="translate(155, 95)">
    <!-- Body/Torso -->
    <path d="M15 65 C15 45 25 35 35 35 C45 35 55 45 55 65 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="35" cy="20" r="12" fill="#fbcfe8" />
    <!-- Hair (Dark modern crop) -->
    <path d="M23 20 C23 11 32 8 37 8 C44 8 47 13 47 20 C43 17 38 16 35 16 C30 16 26 18 23 20 Z" fill="#0f172a" />
    <!-- Arm pointing at document -->
    <path d="M20 45 L-5 35 L-10 38 L15 55 Z" fill="#38bdf8" />
    <!-- Hand -->
    <circle cx="-7" cy="36" r="3.5" fill="#fbcfe8" />
  </g>

  <!-- MAIN CHARACTER (Actively improving/refining the system) -->
  <g transform="translate(55, 75)">
    <!-- Chair Backrest -->
    <rect x="-15" y="15" width="20" height="75" rx="6" fill="#475569" />
    
    <!-- Torso (Engaged, leaning forward) -->
    <path d="M5 45 C5 25 25 15 45 25 C65 35 75 55 75 85 L5 85 Z" fill="#6366f1" />
    
    <!-- Sleeves and Arms working on document -->
    <!-- Left Arm holding pen/tool -->
    <path d="M45 40 L65 55 L75 48" fill="none" stroke="#6366f1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand with marker/pen -->
    <circle cx="77" cy="46" r="4" fill="#fcd34d" />
    <line x1="77" y1="46" x2="84" y2="42" stroke="#10b981" stroke-width="4" stroke-linecap="round" /> <!-- Green correction pen -->

    <!-- Head and Face (Focused expression) -->
    <circle cx="42" cy="12" r="14" fill="#fcd34d" />
    <!-- Hair (Stylish layered bob) -->
    <path d="M28 10 C28 -2 40 -2 50 2 C56 4 58 10 58 16 C58 16 52 14 47 14 C38 14 31 16 28 10 Z" fill="#334155" />
    <!-- Glasses (Professional look) -->
    <rect x="34" y="7" width="8" height="6" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <rect x="44" y="7" width="8" height="6" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <line x1="42" y1="10" x2="44" y2="10" stroke="#0f172a" stroke-width="1.5" />

    <!-- Focused Eyes & Smile -->
    <circle cx="38" cy="10" r="1" fill="#0f172a" />
    <circle cx="48" cy="10" r="1" fill="#0f172a" />
    <path d="M41 16 Q44 19 47 16" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Foreground visual elements for 'Improvement / Perfection' (Checkmarks and upgrading symbols) -->
  <g transform="translate(115, 60)">
    <!-- Floating sparkling enhancement indicator -->
    <path d="M0 10 L3 3 L10 0 L3 -3 L0 -10 L-3 -3 L-10 0 L-3 3 Z" fill="#10b981" />
  </g>
  <g transform="translate(85, 45)">
    <!-- Smaller sparkle -->
    <path d="M0 6 L1.8 1.8 L6 0 L1.8 -1.8 L0 -6 L-1.8 -1.8 L-6 0 L-1.8 1.8 Z" fill="#fbbf24" />
  </g>

  <!-- Coffee Mug on Desk for realistic workspace -->
  <rect x="185" y="138" width="14" height="18" rx="2" fill="#f8fafc" />
  <path d="M199 143 C204 143 204 151 199 151" fill="none" stroke="#f8fafc" stroke-width="2" />
  <path d="M188 135 Q192 130 196 135" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7" />
  <path d="M190 133 Q193 127 196 133" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.5" />

</svg>