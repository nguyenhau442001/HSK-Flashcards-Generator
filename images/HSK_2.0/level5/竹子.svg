<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 200 C 80 180, 160 180, 240 200 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.5"/>
  
  <!-- Bamboo Stalks -->
  <g fill="#10b981">
    <!-- Tall Stalk -->
    <rect x="110" y="40" width="16" height="180" rx="6"/>
    <ellipse cx="118" cy="70" rx="10" ry="4" fill="#065f46" opacity="0.3"/>
    <ellipse cx="118" cy="120" rx="10" ry="4" fill="#065f46" opacity="0.3"/>
    <ellipse cx="118" cy="170" rx="10" ry="4" fill="#065f46" opacity="0.3"/>
    
    <!-- Secondary Stalk -->
    <rect x="140" y="80" width="12" height="140" rx="5"/>
    <ellipse cx="146" cy="110" rx="8" ry="3" fill="#065f46" opacity="0.3"/>
    <ellipse cx="146" cy="160" rx="8" ry="3" fill="#065f46" opacity="0.3"/>
  </g>

  <!-- Leaves -->
  <path d="M118 40 L 140 20 L 120 50 Z" fill="#34d399"/>
  <path d="M126 60 L 150 50 L 130 70 Z" fill="#34d399"/>
  <path d="M140 90 L 165 80 L 145 100 Z" fill="#34d399"/>
  <path d="M110 100 L 80 90 L 110 120 Z" fill="#34d399"/>

  <!-- Decorative Accents -->
  <circle cx="180" cy="60" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="60" cy="150" r="2" fill="#fbbf24" opacity="0.4"/>
  <path d="M190 180 L 210 180 L 200 160 Z" fill="#ec4899" opacity="0.7"/>
  
  <!-- Lantern Glow -->
  <circle cx="190" cy="170" r="25" fill="#f59e0b" opacity="0.05"/>
  <rect x="195" y="160" width="10" height="20" rx="2" fill="#fb923c"/>
</svg>