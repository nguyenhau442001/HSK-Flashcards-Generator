<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Lantern Glow Gradient -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Lantern Body Gradient -->
    <linearGradient id="lanternBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Building Window Gradient -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Fireworks Sparkle Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background City Skyline & Silhouette -->
  <g id="cityscape" opacity="0.4">
    <!-- Far buildings -->
    <rect x="20" y="110" width="25" height="130" fill="#334155"/>
    <rect x="50" y="90" width="30" height="150" fill="#1e293b"/>
    <rect x="85" y="130" width="20" height="110" fill="#334155"/>
    <rect x="110" y="100" width="35" height="140" fill="#1e293b"/>
    <rect x="150" y="120" width="25" height="120" fill="#334155"/>
    <rect x="180" y="80" width="40" height="160" fill="#1e293b"/>

    <!-- Building Windows (Grid) -->
    <g fill="url(#windowGrad)" opacity="0.7">
      <!-- Building 1 -->
      <rect x="58" y="100" width="5" height="8"/>
      <rect x="67" y="100" width="5" height="8"/>
      <rect x="58" y="115" width="5" height="8"/>
      <rect x="67" y="115" width="5" height="8"/>
      <rect x="58" y="130" width="5" height="8"/>
      <rect x="67" y="130" width="5" height="8"/>

      <!-- Building 2 -->
      <rect x="120" y="110" width="6" height="10"/>
      <rect x="130" y="110" width="6" height="10"/>
      <rect x="120" y="130" width="6" height="10"/>
      <rect x="130" y="130" width="6" height="10"/>
      <rect x="120" y="150" width="6" height="10"/>
      <rect x="130" y="150" width="6" height="10"/>

      <!-- Building 3 -->
      <rect x="190" y="95" width="7" height="12"/>
      <rect x="202" y="95" width="7" height="12"/>
      <rect x="190" y="120" width="7" height="12"/>
      <rect x="202" y="120" width="7" height="12"/>
    </g>
  </g>

  <!-- Festive Street Arch / Roof structure (Traditional curves) -->
  <path d="M 0 170 Q 120 140 240 170 L 240 240 L 0 240 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M 10 180 Q 120 155 230 180" fill="none" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/>
  <path d="M 15 185 Q 120 160 225 185" fill="none" stroke="#f59e0b" stroke-width="2"/>

  <!-- Vibrant Fireworks in the Sky -->
  <g id="fireworks" filter="url(#glow)">
    <!-- Firework 1 (Top Left - Gold/Orange) -->
    <g transform="translate(60, 55)">
      <circle cx="0" cy="0" r="2" fill="#fff"/>
      <path d="M0 0 L0 -25 M0 0 L0 25 M0 0 L-25 0 M0 0 L25 0 M0 0 L-18 -18 M0 0 L18 18 M0 0 L-18 18 M0 0 L18 -18" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="3,3"/>
    </g>

    <!-- Firework 2 (Top Right - Pink/Red) -->
    <g transform="translate(180, 70)">
      <circle cx="0" cy="0" r="2" fill="#fff"/>
      <path d="M0 0 L0 -30 M0 0 L0 30 M0 0 L-30 0 M0 0 L30 0 M0 0 L-21 -21 M0 0 L21 21 M0 0 L-21 21 M0 0 L21 -21" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,4"/>
    </g>

    <!-- Firework 3 (Center High - Cyan/Blue) -->
    <g transform="translate(130, 40)">
      <circle cx="0" cy="0" r="1.5" fill="#fff"/>
      <path d="M0 0 L0 -20 M0 0 L0 20 M0 0 L-20 0 M0 0 L20 0 M0 0 L-14 -14 M0 0 L14 14 M0 0 L-14 14 M0 0 L14 -14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Hanging Red Lanterns (Left Side) -->
  <g id="lantern-left">
    <!-- Glow -->
    <circle cx="65" cy="115" r="35" fill="url(#lanternGlow)"/>
    <!-- String -->
    <line x1="65" y1="0" x2="65" y2="90" stroke="#64748b" stroke-width="1.5"/>
    <!-- Top Cap -->
    <path d="M 55 90 L 75 90 L 73 95 L 57 95 Z" fill="url(#goldGrad)"/>
    <!-- Lantern Body -->
    <path d="M 65 95 C 45 95 45 135 65 140 C 85 135 85 95 65 95 Z" fill="url(#lanternBody)"/>
    <!-- Ribs -->
    <path d="M 65 95 C 57 105 57 130 65 140" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
    <path d="M 65 95 C 73 105 73 130 65 140" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="49" y1="117" x2="81" y2="117" stroke="#b91c1c" stroke-width="1.5"/>
    <!-- Bottom Cap -->
    <path d="M 57 140 L 73 140 L 71 144 L 59 144 Z" fill="url(#goldGrad)"/>
    <!-- Tassel -->
    <line x1="65" y1="144" x2="65" y2="160" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="62" y="160" width="6" height="15" rx="3" fill="#dc2626"/>
  </g>

  <!-- Hanging Red Lanterns (Right Side - Smaller, Perspective) -->
  <g id="lantern-right" transform="translate(110, 0)">
    <!-- Glow -->
    <circle cx="65" cy="95" r="25" fill="url(#lanternGlow)"/>
    <!-- String -->
    <line x1="65" y1="0" x2="65" y2="75" stroke="#64748b" stroke-width="1.5"/>
    <!-- Top Cap -->
    <path d="M 57 75 L 73 75 L 71 79 L 59 79 Z" fill="url(#goldGrad)"/>
    <!-- Lantern Body -->
    <path d="M 65 79 C 50 79 50 111 65 115 C 80 111 80 79 65 79 Z" fill="url(#lanternBody)"/>
    <!-- Ribs -->
    <path d="M 65 79 C 59 87 59 107 65 115" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
    <path d="M 65 79 C 71 87 71 107 65 115" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="53" y1="97" x2="77" y2="97" stroke="#b91c1c" stroke-width="1.5"/>
    <!-- Bottom Cap -->
    <path d="M 59 115 L 71 115 L 70 118 L 60 118 Z" fill="url(#goldGrad)"/>
    <!-- Tassel -->
    <line x1="65" y1="118" x2="65" y2="132" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="63" y="132" width="4" height="12" rx="2" fill="#dc2626"/>
  </g>

  <!-- Foreground Celebration Props: Flag & Gift/Banner items -->
  <g id="foreground-props" transform="translate(0, 10)">
    <!-- Festive Gold/Red Ribbon / Banner sweeping across the bottom -->
    <path d="M -10 185 Q 60 150 120 185 T 250 175" fill="none" stroke="#ef4444" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M -10 185 Q 60 150 120 185 T 250 175" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>

    <!-- Joyful Character / Mascot Interaction (A cute waving star representing celebration/holiday spirit) -->
    <g transform="translate(180, 140)">
      <!-- Star Glow -->
      <circle cx="0" cy="0" r="22" fill="#f59e0b" opacity="0.3" filter="url(#glow)"/>
      
      <!-- Golden Star Body -->
      <path d="M 0 -20 L 5 -6 L 20 -5 L 8 4 L 12 18 L 0 10 L -12 18 L -8 4 L -20 -5 L -5 -6 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
      
      <!-- Cheerful Face -->
      <circle cx="-4" cy="-1" r="2" fill="#0f172a"/>
      <circle cx="4" cy="-1" r="2" fill="#0f172a"/>
      <path d="M -3 4 Q 0 8 3 4" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Cute Cheeks -->
      <circle cx="-7" cy="2" r="2" fill="#f43f5e" opacity="0.6"/>
      <circle cx="7" cy="2" r="2" fill="#f43f5e" opacity="0.6"/>
    </g>

    <!-- Secondary Star (Small floating) -->
    <g transform="translate(45, 145)">
      <path d="M 0 -10 L 2.5 -3 L 10 -2.5 L 4 2 L 6 9 L 0 5 L -6 9 L -4 2 L -10 -2.5 L -2.5 -3 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
    </g>
  </g>

  <!-- Atmospheric Confetti / Sparkles -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="30" cy="80" r="2"/>
    <circle cx="105" cy="65" r="1.5"/>
    <circle cx="155" cy="100" r="2.5"/>
    <circle cx="90" cy="160" r="2"/>
    <circle cx="210" cy="130" r="1.5"/>
  </g>
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="15" cy="110" r="1.5"/>
    <circle cx="85" cy="45" r="2"/>
    <circle cx="165" cy="55" r="1.5"/>
    <circle cx="225" cy="95" r="2"/>
  </g>

  <!-- Frame Border / Vignette (Subtle rounding & edge definition) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>