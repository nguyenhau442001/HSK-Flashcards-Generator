<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground surface -->
  <path d="M0 180 Q 120 160 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Main Subject: A flourishing potted plant with golden light, representing benefit/growth -->
  <g transform="translate(120, 190)">
    <!-- Pot -->
    <path d="M-30 0 L 30 0 L 20 40 L -20 40 Z" fill="#fb923c"/>
    <path d="M-35 0 L 35 0 L 30 10 L -30 10 Z" fill="#f59e0b"/>
    
    <!-- Stem -->
    <path d="M-2 -5 L -2 -80" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Leaves -->
    <path d="M-2 -30 Q -30 -40 -20 -70 Q -5 -50 -2 -40" fill="#10b981"/>
    <path d="M2 -50 Q 30 -60 20 -90 Q 5 -70 2 -60" fill="#10b981"/>
    <path d="M-2 -70 Q -20 -80 -15 -100 Q -5 -90 -2 -80" fill="#38bdf8"/>
  </g>
  
  <!-- Ambient light/glow representing the 'benefit' -->
  <circle cx="120" cy="100" r="40" fill="#fbbf24" opacity="0.15"/>
  <circle cx="120" cy="100" r="20" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="60" r="4" fill="#38bdf8"/>
  <circle cx="190" cy="50" r="6" fill="#ec4899"/>
  <circle cx="170" cy="140" r="3" fill="#10b981"/>
  
  <!-- Rays of light -->
  <path d="M120 60 L 120 40" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M140 80 L 155 65" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 80 L 85 65" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
</svg>