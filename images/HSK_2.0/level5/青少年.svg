<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm indoor ambient light -->
    <radialGradient id="room-glow" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Window light beam -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Heart pulse gradient -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#room-glow)" />

  <!-- BACKGROUND ARCHITECTURE & PROPS -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4" />
  <line x1="20" y1="170" x2="220" y2="170" stroke="#334155" stroke-width="2" />
  <!-- Floor -->
  <path d="M20 170 L220 170 L230 220 L10 220 Z" fill="#0f172a" />

  <!-- Window Frame -->
  <rect x="150" y="35" width="50" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <line x1="175" y1="35" x2="175" y2="105" stroke="#334155" stroke-width="2" />
  <line x1="150" y1="70" x2="200" y2="70" stroke="#334155" stroke-width="2" />
  <!-- Window Light Beam casting on floor -->
  <polygon points="150,105 200,105 220,170 140,170" fill="url(#window-light)" />

  <!-- Plant (Health & Vitality motif) -->
  <rect x="35" y="130" width="16" height="25" rx="3" fill="#06b6d4" />
  <path d="M35 135 C25 135 25 115 38 120" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M43 135 C53 130 55 110 43 115" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M43 130 C43 110 38 100 43 105" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

  <!-- Poster on wall (Apple/Heart icon representing health) -->
  <rect x="45" y="45" width="30" height="40" rx="2" fill="#334155" />
  <circle cx="60" cy="60" r="8" fill="#f43f5e" />
  <path d="M56 60 Q60 54 64 60 Q60 68 56 60" fill="#10b981" />

  <!-- Bookshelf / Books -->
  <rect x="90" y="40" width="45" height="6" fill="#334155" rx="1" />
  <rect x="95" y="22" width="8" height="18" rx="1" fill="#f59e0b" />
  <rect x="105" y="20" width="10" height="20" rx="1" fill="#ec4899" />
  <rect x="117" y="24" width="7" height="16" rx="1" fill="#38bdf8" />


  <!-- MAIN SUBJECT: TEENAGER (青少年) DOING YOGA/STRETCHING -->
  <!-- Floor Mat -->
  <rect x="65" y="175" width="110" height="15" rx="7" fill="#3b82f6" />

  <!-- Character Group (Sitting cross-legged / meditating / stretching gracefully) -->
  <!-- Shadow -->
  <ellipse cx="120" cy="185" rx="45" ry="6" fill="#020617" opacity="0.6" />

  <!-- Body / Hoodie (Teal/Cyan modern youth style) -->
  <path d="M100 135 C90 135 80 155 85 170 C95 175 145 175 155 170 C160 155 150 135 140 135 Z" fill="#06b6d4" />
  <!-- Hoodie Pocket & Details -->
  <path d="M105 155 L135 155 L130 168 L110 168 Z" fill="#0891b2" />
  <path d="M115 135 Q120 145 125 135" fill="none" stroke="#164e63" stroke-width="2" stroke-linecap="round" />

  <!-- Crossed Legs -->
  <path d="M85 168 C90 182 150 182 155 168 C145 178 95 178 85 168 Z" fill="#0e7490" />

  <!-- Arms outstretched gracefully in health/balance pose -->
  <!-- Left Arm -->
  <path d="M92 140 C75 135 60 145 55 140" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" />
  <!-- Left Hand / Fingers -->
  <circle cx="53" cy="139" r="4" fill="#fbcfe8" />

  <!-- Right Arm -->
  <path d="M148 140 C165 135 180 145 185 140" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" />
  <!-- Right Hand / Fingers -->
  <circle cx="187" cy="139" r="4" fill="#fbcfe8" />

  <!-- Neck -->
  <rect x="114" y="122" width="12" height="15" fill="#fbcfe8" rx="3" />

  <!-- Head (Youthful, energetic expression) -->
  <circle cx="120" cy="105" r="22" fill="#fbcfe8" />

  <!-- Hair (Stylish dark messy/modern cut) -->
  <path d="M98 105 C98 85 142 85 142 105 C142 92 135 82 120 82 C105 82 98 92 98 105 Z" fill="#1e293b" />
  <path d="M135 95 C145 98 148 108 144 112 C140 108 140 100 135 95 Z" fill="#1e293b" />
  <path d="M102 96 C95 99 92 108 96 112 C100 108 100 100 102 96 Z" fill="#1e293b" />

  <!-- Face features (Happy, peaceful, healthy glow) -->
  <!-- Closed happy/content eyes -->
  <path d="M110 105 Q114 110 118 105" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <path d="M122 105 Q126 110 130 105" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <!-- Rosy Cheeks -->
  <circle cx="109" cy="111" r="4" fill="#fb7185" opacity="0.6" />
  <circle cx="131" cy="111" r="4" fill="#fb7185" opacity="0.6" />
  <!-- Gentle Smile -->
  <path d="M116 114 Q120 118 124 114" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />


  <!-- FOREGROUND HEALTH ELEMENTS (VITALITY SYMBOLS) -->
  <!-- Floating Health / Vitality Sparkles & Heart Icon -->
  <g transform="translate(120, 55)">
    <!-- Glowing Pulsing Heart representing "Health" (健康) -->
    <path d="M0 -10 C -12 -22 -25 -2 -10 12 L0 22 L10 12 C 25 -2 12 -22 0 -10 Z" fill="url(#pulse-grad)" />
    <!-- Sparkles around -->
    <path d="M -25 -10 L -21 -10 L -23 -14 L -23 -6 Z" fill="#fbbf24" />
    <path d="M 25 0 L 29 0 L 27 -4 L 27 4 Z" fill="#fbbf24" />
    <path d="M 18 -25 L 21 -22 L 18 -19 L 15 -22 Z" fill="#38bdf8" />
  </g>

  <!-- Apple icon floating near left hand (healthy diet/lifestyle context) -->
  <g transform="translate(65, 110)">
    <circle cx="0" cy="0" r="10" fill="#f43f5e" />
    <path d="M 0 -8 Q 4 -15 8 -12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 5 -12 L 8 -10" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <!-- White shine highlight -->
    <circle cx="-3" cy="-3" r="3" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Water bottle floating near right hand (hydration/health context) -->
  <g transform="translate(175, 105)">
    <rect x="-6" y="-12" width="12" height="26" rx="4" fill="#38bdf8" />
    <rect x="-4" y="-16" width="8" height="5" rx="1.5" fill="#0284c7" />
    <rect x="-4" y="-6" width="8" height="3" fill="#ffffff" opacity="0.5" />
    <!-- Shine -->
    <line x1="-3" y1="-2" x2="-3" y2="8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Additional floating dynamic wellness particle notes -->
  <circle cx="95" cy="75" r="3" fill="#34d399" opacity="0.8" />
  <circle cx="145" cy="70" r="2.5" fill="#f472b6" opacity="0.8" />
  <circle cx="50" cy="85" r="2" fill="#60a5fa" opacity="0.8" />
</svg>