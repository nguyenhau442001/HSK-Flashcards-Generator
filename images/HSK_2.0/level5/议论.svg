<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="150" width="200" height="60" rx="8" fill="#334155"/>
  <rect x="20" y="150" width="200" height="15" rx="4" fill="#475569"/>
  
  <!-- Characters -->
  <g transform="translate(40, 80)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 35 Q20 45 30 35" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <circle cx="15" cy="15" r="2" fill="#0f172a"/>
    <circle cx="25" cy="15" r="2" fill="#0f172a"/>
  </g>
  
  <g transform="translate(100, 70)">
    <circle cx="20" cy="20" r="18" fill="#38bdf8"/>
    <path d="M10 38 Q20 48 30 38" stroke="#0ea5e9" stroke-width="3" fill="none"/>
    <circle cx="14" cy="15" r="2" fill="#0f172a"/>
    <circle cx="26" cy="15" r="2" fill="#0f172a"/>
  </g>
  
  <g transform="translate(160, 80)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M10 35 Q20 45 30 35" stroke="#ea580c" stroke-width="3" fill="none"/>
    <circle cx="15" cy="15" r="2" fill="#0f172a"/>
    <circle cx="25" cy="15" r="2" fill="#0f172a"/>
  </g>

  <!-- Speech/Discussion Bubbles -->
  <path d="M60 70 L80 50 L100 70 Z" fill="#f59e0b" opacity="0.6"/>
  <path d="M120 60 L140 40 L160 60 Z" fill="#38bdf8" opacity="0.6"/>
  <path d="M180 70 L200 50 L220 70 Z" fill="#fb923c" opacity="0.6"/>
  
  <!-- Coffee Cups -->
  <rect x="30" y="165" width="20" height="25" rx="3" fill="#94a3b8"/>
  <rect x="190" y="165" width="20" height="25" rx="3" fill="#94a3b8"/>
  
  <!-- Decorative elements -->
  <circle cx="120" cy="120" r="2" fill="#10b981"/>
  <circle cx="180" cy="100" r="3" fill="#ec4899"/>
  <circle cx="60" cy="110" r="2" fill="#38bdf8"/>
</svg>