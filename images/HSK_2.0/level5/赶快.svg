<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Hallway Light Gradient -->
    <radialGradient id="hallwayLight" cx="20%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Speed Lines / Motion Blur Gradient -->
    <linearGradient id="speedFade" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Clock Glow -->
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#hallwayLight)"/>

  <!-- Interior Wall & Floor Perspective Lines -->
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#090d16"/>
  <!-- Baseboard -->
  <path d="M0 172 L240 172 L240 180 L0 180 Z" fill="#1e293b"/>
  <!-- Wall art / Doorframe in background -->
  <rect x="25" y="80" width="40" height="70" rx="4" fill="#334155" opacity="0.4"/>
  <path d="M150 172 L180 50 L210 50 L240 172 Z" fill="#162032" opacity="0.5"/>

  <!-- Urgent Wall Clock (Ticking Fast, Red Alert) -->
  <g transform="translate(190, 45)">
    <circle cx="0" cy="0" r="22" fill="#ef4444" opacity="0.2"/>
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#ef4444" stroke-width="3"/>
    <!-- Clock hands pointing at alarm time -->
    <line x1="0" y1="0" x2="4" y2="-8" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-8" y2="-4" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#ef4444"/>
    <!-- Alarm bells on top -->
    <path d="M-8 -16 L-12 -22 M8 -16 L12 -22" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Motion Streaks (Background) -->
  <path d="M30 110 L110 110" stroke="url(#speedFade)" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 135 L90 135" stroke="url(#speedFade)" stroke-width="5" stroke-linecap="round"/>
  <path d="M40 160 L140 160" stroke="url(#speedFade)" stroke-width="2" stroke-linecap="round"/>

  <!-- Dropped/Flying Papers & Chaos (Showing rush) -->
  <g transform="translate(45, 140) rotate(-25)">
    <rect width="16" height="20" rx="2" fill="#f8fafc"/>
    <line x1="3" y1="5" x2="13" y2="5" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="3" y1="9" x2="10" y2="9" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <g transform="translate(85, 125) rotate(40)">
    <rect width="14" height="18" rx="2" fill="#f1f5f9"/>
    <line x1="3" y1="5" x2="11" y2="5" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- MAIN CHARACTER: Rushing Person -->
  <!-- Motion blur / shadow trail -->
  <g opacity="0.25" transform="translate(15, 0)">
    <path d="M95 180 L110 120 L135 150 Z" fill="#38bdf8"/>
    <circle cx="120" cy="95" r="18" fill="#38bdf8"/>
  </g>

  <g id="character">
    <!-- Flying Backpack / Bag -->
    <g transform="translate(90, 85) rotate(-15)">
      <rect x="-12" y="-15" width="24" height="30" rx="6" fill="#fb923c"/>
      <path d="M-6 -15 C-6 -22 6 -22 6 -15" fill="none" stroke="#ea580c" stroke-width="3"/>
      <rect x="-8" y="-5" width="16" height="12" rx="3" fill="#ea580c"/>
      <!-- Straps flying out -->
      <path d="M-12 -5 C-25 -10 -35 -2 -40 5" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Back Leg (Stiding Back) -->
    <path d="M120 145 L150 165 L175 160" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Back Shoe -->
    <path d="M165 155 Q185 155 190 165 L175 170 Z" fill="#0f172a"/>

    <!-- Body / Torso (Leaning Forward aggressively) -->
    <path d="M100 100 C115 100 135 125 125 155 C120 170 105 175 95 175 L110 135 Z" fill="#38bdf8"/>
    <!-- Jacket / Shirt Details -->
    <path d="M110 115 L122 140" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <path d="M115 110 L100 135" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

    <!-- Front Leg (Pounding Forward) -->
    <path d="M110 165 L95 195 L70 205" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Shoe (Action pose, kick up dust) -->
    <path d="M60 200 Q75 220 90 208 L75 198 Z" fill="#0f172a"/>
    <!-- Dust cloud under foot -->
    <ellipse cx="65" cy="212" rx="14" ry="5" fill="#64748b" opacity="0.6"/>
    <ellipse cx="85" cy="215" rx="8" ry="3" fill="#64748b" opacity="0.4"/>

    <!-- Back Arm (Pumping back) -->
    <path d="M115 110 L145 125 L160 115" fill="none" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="160" cy="112" r="6" fill="#f472b6"/> <!-- Hand -->

    <!-- Neck -->
    <path d="M118 90 L126 100" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>

    <!-- Head (Leveled forward with intense expression) -->
    <g transform="translate(125, 75)">
      <!-- Hair flying backward due to speed -->
      <path d="M0 0 C-15 -10 -25 0 -30 15 C-20 10 -10 15 5 10 Z" fill="#1e293b"/>
      
      <!-- Face shape -->
      <circle cx="5" cy="10" r="16" fill="#fbcfe8"/>
      
      <!-- Ear -->
      <circle cx="-5" cy="12" r="3" fill="#f472b6"/>

      <!-- Eye (Wide, panicked/urgent look) -->
      <circle cx="10" cy="7" r="4.5" fill="#ffffff"/>
      <circle cx="11.5" cy="7" r="2" fill="#0f172a"/>
      <!-- Eyebrow slanting steeply down in urgency -->
      <path d="M5 1 L16 4" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Mouth (Open shouting / gasping "Hurry!") -->
      <path d="M12 15 C12 21 20 21 20 15 C20 12 12 12 12 15 Z" fill="#991b1b"/>
      <!-- Tongue -->
      <path d="M14 17 C14 19 18 19 18 17 Z" fill="#ef4444"/>

      <!-- Speed lines over head -->
      <path d="M-25 -5 L-5 -5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M-20 -10 L2 -10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Front Arm (Reaching/Pumping forward dramatically) -->
    <path d="M110 105 L80 120 L55 105" fill="none" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="103" r="6" fill="#f472b6"/> <!-- Front Hand -->
  </g>

  <!-- Foreground Speed Lines & Wind Effect (Overlay) -->
  <path d="M0 45 L90 45" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M0 90 L60 90" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M160 190 L240 190" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Dramatic Lighting Vignette (Dark borders for cinematic app asset look) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.8"/>
</svg>