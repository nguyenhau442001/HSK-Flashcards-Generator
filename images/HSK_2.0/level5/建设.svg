<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Sky/Atmosphere Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Crane Tower Yellow Gradient -->
    <linearGradient id="craneYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Building Concrete Gradient -->
    <linearGradient id="concreteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glows -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  <circle cx="180" cy="70" r="40" fill="#fb923c" opacity="0.1" filter="url(#glow)"/>
  <circle cx="90" cy="120" r="50" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Background City Silhouette -->
  <path d="M 10 210 L 10 160 L 30 160 L 30 210 Z" fill="#1e293b" opacity="0.7"/>
  <path d="M 35 210 L 35 130 L 60 130 L 60 210 Z" fill="#1e293b" opacity="0.5"/>
  <path d="M 190 210 L 190 140 L 220 140 L 220 210 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Construction Ground / Foundation -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  <path d="M 0 200 L 240 200" stroke="#334155" stroke-width="2"/>
  <path d="M 20 200 L 40 215 L 220 215 L 200 200 Z" fill="#1e293b"/>
  <!-- Safety Stripes on Ground -->
  <path d="M 50 200 L 60 205 L 70 200 L 60 195 Z" fill="#fbbf24"/>
  <path d="M 90 200 L 100 205 L 110 200 L 100 195 Z" fill="#fbbf24"/>
  <path d="M 130 200 L 140 205 L 150 200 L 140 195 Z" fill="#fbbf24"/>
  <path d="M 170 200 L 180 205 L 190 200 L 180 195 Z" fill="#fbbf24"/>

  <!-- SCENE: New Building Under Construction (Center-Left) -->
  <g filter="url(#shadow)">
    <!-- Building Structure Grid -->
    <rect x="75" y="90" width="85" height="110" rx="4" fill="url(#concreteGrad)"/>
    
    <!-- Interior Floor Slabs (Levels) -->
    <line x1="75" y1="120" x2="160" y2="120" stroke="#1e293b" stroke-width="4"/>
    <line x1="75" y1="150" x2="160" y2="150" stroke="#1e293b" stroke-width="4"/>
    <line x1="75" y1="180" x2="160" y2="180" stroke="#1e293b" stroke-width="4"/>

    <!-- Open Windows / Pillars -->
    <rect x="85" y="100" width="18" height="15" rx="2" fill="#0f172a" opacity="0.6"/>
    <rect x="110" y="100" width="18" height="15" rx="2" fill="#0f172a" opacity="0.6"/>
    <rect x="135" y="100" width="18" height="15" rx="2" fill="#0f172a" opacity="0.6"/>

    <rect x="85" y="130" width="18" height="15" rx="2" fill="#0f172a" opacity="0.6"/>
    <rect x="110" y="130" width="18" height="15" rx="2" fill="#38bdf8" opacity="0.2"/> <!-- Active work light -->
    <rect x="135" y="130" width="18" height="15" rx="2" fill="#0f172a" opacity="0.6"/>

    <rect x="85" y="160" width="18" height="15" rx="2" fill="#0f172a" opacity="0.6"/>
    <rect x="110" y="160" width="18" height="15" rx="2" fill="#0f172a" opacity="0.6"/>
    <rect x="135" y="160" width="18" height="15" rx="2" fill="#0f172a" opacity="0.6"/>

    <!-- Scaffolding Framework -->
    <path d="M 70 90 L 70 200 M 165 90 L 165 200" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 70 105 L 165 105 M 70 135 L 165 135 M 70 165 L 165 165" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M 70 95 L 165 125 M 70 125 L 165 155 M 70 155 L 165 185" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- SCENE: Tower Crane (Dominant Structure) -->
  <g filter="url(#shadow)">
    <!-- Vertical Mast -->
    <rect x="105" y="25" width="8" height="175" fill="url(#craneYellow)"/>
    <!-- Mast Cross Bracing -->
    <path d="M 105 35 L 113 45 M 113 35 L 105 45
             M 105 55 L 113 65 M 113 55 L 105 65
             M 105 75 L 113 85 M 113 75 L 105 85
             M 105 95 L 113 105 M 113 95 L 105 105
             M 105 115 L 113 125 M 113 115 L 105 125
             M 105 135 L 113 145 M 113 145 L 105 145
             M 105 155 L 113 165 M 113 155 L 105 165
             M 105 175 L 113 185 M 113 175 L 105 185" stroke="#b45309" stroke-width="1.5"/>

    <!-- Crane Jib (Long Arm) -->
    <path d="M 30 30 L 135 35 L 135 48 L 30 42 Z" fill="url(#craneYellow)"/>
    <path d="M 30 35 L 135 35 M 30 40 L 135 40" stroke="#b45309" stroke-width="1.5"/>
    <!-- Jib Support Cables -->
    <path d="M 109 25 L 109 35 M 109 25 L 50 35 M 109 25 L 130 35" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Counter-jib (Short Arm) -->
    <path d="M 105 35 L 135 35 L 135 45 L 105 45 Z" fill="url(#craneYellow)"/>
    <!-- Counterweight Block -->
    <rect x="135" y="32" width="15" height="18" rx="2" fill="#64748b"/>
    <rect x="138" y="35" width="9" height="12" fill="#475569"/>

    <!-- Operator Cabin -->
    <rect x="95" y="45" width="12" height="12" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="97" y="47" width="8" height="8" rx="1" fill="#0f172a"/>

    <!-- Crane Hook & Cable & Cargo -->
    <line x1="55" y1="40" x2="55" y2="110" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="55" cy="110" r="4" fill="#f59e0b"/>
    
    <!-- Lifting Material (Steel Beams Package) -->
    <g transform="translate(40, 110)">
      <rect x="0" y="0" width="30" height="16" rx="2" fill="#f97316"/>
      <rect x="4" y="3" width="22" height="3" rx="1" fill="#fed7aa"/>
      <rect x="4" y="9" width="22" height="3" rx="1" fill="#fed7aa"/>
      <path d="M 5 0 L 10 -10 L 20 -10 L 25 0" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </g>
  </g>

  <!-- FOREGROUND: Action & Details -->
  <!-- Construction Worker / Supervisor Silhouette -->
  <g transform="translate(185, 175)" filter="url(#shadow)">
    <!-- Worker Body -->
    <path d="M 10 25 L 20 25 L 22 10 L 15 5 L 8 10 Z" fill="#2563eb"/>
    <circle cx="15" cy="-1" r="5" fill="#fbcfe8"/>
    <!-- Hard Hat (Bright Yellow/Orange) -->
    <path d="M 9 -4 C 9 -7 21 -7 21 -4 L 22 -3 C 22 -3 8 -3 9 -4 Z" fill="#fbbf24"/>
    <path d="M 7 -3 L 23 -3 L 23 -1 L 7 -1 Z" fill="#f59e0b"/>
    <!-- Holding Blueprint / Tablet -->
    <rect x="15" y="10" width="12" height="8" rx="1" fill="#38bdf8" transform="rotate(-15 15 10)"/>
  </g>

  <!-- Safety Cone -->
  <g transform="translate(160, 192)" filter="url(#shadow)">
    <polygon points="6,0 12,15 0,15" fill="#f97316"/>
    <polygon points="4,7 8,7 9,10 3,10" fill="#ffffff"/>
    <rect x="1" y="15" width="10" height="3" rx="1.5" fill="#334155"/>
  </g>
  <g transform="translate(25, 195)" filter="url(#shadow)">
    <polygon points="5,0 10,12 0,12" fill="#f97316"/>
    <polygon points="3,5 7,5 8,8 2,8" fill="#ffffff"/>
    <rect x="0" y="12" width="10" height="2" rx="1" fill="#334155"/>
  </g>

  <!-- Glowing Weld Spark / Construction Energy Accent -->
  <g transform="translate(115, 140)">
    <circle cx="0" cy="0" r="12" fill="#38bdf8" opacity="0.3" filter="url(#glow)"/>
    <path d="M 0 -6 L 2 -2 L 6 0 L 2 2 L 0 6 L -2 2 L -6 0 L -2 -2 Z" fill="#ffffff"/>
  </g>

  <!-- Additional Atmospheric Sparks / Dust Particles -->
  <circle cx="75" cy="80" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="145" cy="105" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="130" cy="170" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="50" cy="160" r="1.5" fill="#fbbf24" opacity="0.7"/>

  <!-- Decorative App Border Frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>