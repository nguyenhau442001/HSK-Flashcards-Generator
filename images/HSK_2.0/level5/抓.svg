<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Mountain trail edge -->
  <path d="M0 240 L240 240 L240 180 C180 160 120 190 60 170 L0 200 Z" fill="#334155"/>
  
  <!-- The Action: Two hands grasping -->
  <!-- Arm 1 (The helper) -->
  <path d="M120 240 L120 140 C120 120 140 110 150 110 L180 110" stroke="#f59e0b" stroke-width="20" stroke-linecap="round" fill="none"/>
  <circle cx="180" cy="110" r="12" fill="#f59e0b"/>
  
  <!-- Arm 2 (The one being saved/held) -->
  <path d="M60 160 L100 130 C115 120 130 120 145 130" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" fill="none"/>
  
  <!-- The Grip Point -->
  <g transform="translate(135, 120)">
    <path d="M-10 -10 L10 10 M-10 10 L10 -10" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Atmospheric details -->
  <circle cx="200" cy="50" r="3" fill="#fb923c" opacity="0.6"/>
  <circle cx="40" cy="40" r="2" fill="#10b981" opacity="0.4"/>
  <circle cx="220" cy="180" r="4" fill="#ec4899" opacity="0.5"/>
</svg>