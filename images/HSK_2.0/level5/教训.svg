<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodDesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="notebookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light / Environment Glow -->
  <circle cx="120" cy="80" r="90" fill="url(#lampGlow)"/>

  <!-- Background Environment / Bookshelf Silhouette -->
  <g opacity="0.4">
    <rect x="30" y="45" width="24" height="60" rx="2" fill="#475569"/>
    <rect x="58" y="55" width="18" height="50" rx="2" fill="#64748b"/>
    <rect x="80" y="40" width="15" height="65" rx="2" fill="#334155"/>
    <rect x="145" y="50" width="20" height="55" rx="2" fill="#475569"/>
    <rect x="169" y="38" width="22" height="67" rx="2" fill="#64748b"/>
    <!-- Shelf Board -->
    <rect x="20" y="105" width="200" height="4" rx="2" fill="#334155"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 0 160 L 240 160 L 240 230 C 240 235 235 240 230 240 L 10 240 C 5 240 0 235 0 230 Z" fill="url(#woodDesk)" filter="url(#dropShadow)"/>
  <rect x="0" y="156" width="240" height="6" fill="#475569"/>

  <!-- Coffee Mug (Context Prop) -->
  <g transform="translate(180, 130)" filter="url(#dropShadow)">
    <rect x="0" y="5" width="22" height="25" rx="4" fill="#38bdf8"/>
    <path d="M 22 10 C 28 10 28 22 22 24" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 6 2 C 8 -2 14 -2 16 2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Main Subject: Open Notebook / Lesson Journal ("Bài học" / "Giáo huấn") -->
  <g transform="translate(45, 110)" filter="url(#dropShadow)">
    <!-- Notebook Shadow Base -->
    <path d="M 10 12 L 140 2 L 145 62 L 15 72 Z" fill="#0f172a" opacity="0.5"/>
    
    <!-- Notebook Cover / Base -->
    <path d="M 12 10 L 138 2 L 143 60 L 17 68 Z" fill="#0284c7" rx="4"/>
    
    <!-- Notebook Pages -->
    <path d="M 15 14 L 135 6 L 140 56 L 20 64 Z" fill="url(#notebookGrad)"/>
    
    <!-- Center Binding / Spine shadow -->
    <line x1="77" y1="10" x2="80" y2="60" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Left Page Content (Abstract Diagrams of past mistakes / error crosses turning to checks) -->
    <g transform="translate(25, 20)">
      <!-- Red Cross (Failure/Mistake) -->
      <path d="M 10 8 L 22 22 M 22 8 L 10 22" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Text-like lines -->
      <line x1="32" y1="11" x2="50" y2="11" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="19" x2="45" y2="19" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Warning Light Bulb / Idea (Realization) -->
      <circle cx="28" cy="38" r="6" fill="#fbbf24"/>
      <path d="M 25 46 L 31 46 L 30 49 L 26 49 Z" fill="#94a3b8"/>
    </g>

    <!-- Right Page Content (Success / Lesson Learned) -->
    <g transform="translate(85, 15)">
      <!-- Green Checkmark (Lesson Learned / Insight) -->
      <path d="M 10 16 L 17 23 L 32 7" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Text-like lines -->
      <line x1="10" y1="32" x2="38" y2="30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="40" x2="30" y2="38" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Active Pencil / Pen Writing the Lesson -->
  <g transform="translate(145, 105) rotate(-35)" filter="url(#dropShadow)">
    <!-- Pencil Body -->
    <path d="M 0 0 L 50 -10 L 55 -5 L 5 10 Z" fill="url(#pencilGrad)"/>
    <!-- Pencil Tip Wood -->
    <path d="M -8 3 L 0 0 L 0 5 Z" fill="#fde68a"/>
    <!-- Graphite Lead -->
    <path d="M -11 4 L -8 3 L -8 4.5 Z" fill="#1e293b"/>
    <!-- Metal Ferrule -->
    <rect x="50" y="-11" width="6" height="17" fill="#94a3b8" transform="rotate(-11 50 -11)"/>
    <!-- Eraser -->
    <path d="M 56 -13 L 64 -15 L 67 -8 L 59 -6 Z" fill="#f43f5e"/>
  </g>

  <!-- Dynamic Sparkles / "Aha!" Moment (Insight & Wisdom gained) -->
  <g transform="translate(115, 60)">
    <!-- Main Sparkle -->
    <path d="M 0 -12 C 0 -3 3 0 12 0 C 3 0 0 3 0 12 C 0 3 -3 0 -12 0 C -3 0 0 -3 0 -12 Z" fill="#fbbf24" filter="url(#dropShadow)"/>
  </g>
  <g transform="translate(75, 45)">
    <!-- Small Sparkle -->
    <path d="M 0 -7 C 0 -2 2 0 7 0 C 2 0 0 2 0 7 C 0 2 -2 0 -7 0 C -2 0 0 -2 0 -7 Z" fill="#38bdf8" filter="url(#dropShadow)"/>
  </g>
  <g transform="translate(155, 75)">
    <!-- Tiny Sparkle -->
    <path d="M 0 -5 C 0 -1 1 0 5 0 C 1 0 0 1 0 5 C 0 1 -1 0 -5 0 C -1 0 0 -1 0 -5 Z" fill="#10b981"/>
  </g>

</svg>