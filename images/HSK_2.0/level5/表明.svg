<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- Magnifying Glass -->
  <g transform="translate(120, 120) rotate(-15)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#f8fafc" stroke-width="6"/>
    <circle cx="0" cy="0" r="38" fill="#1e293b" fill-opacity="0.5"/>
    <rect x="-8" y="40" width="16" height="60" rx="4" fill="#64748b"/>
    <rect x="-5" y="100" width="10" height="20" rx="2" fill="#475569"/>
  </g>
  
  <!-- Document with Evidence -->
  <rect x="40" y="60" width="100" height="130" rx="8" fill="#f1f5f9"/>
  <rect x="55" y="80" width="70" height="10" rx="2" fill="#cbd5e1"/>
  <rect x="55" y="100" width="50" height="10" rx="2" fill="#cbd5e1"/>
  
  <!-- The "Proof" - A glowing checkmark-like shape formed by a graph line -->
  <path d="M60 150 L80 130 L100 160 L130 110" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Atmospheric Highlights -->
  <circle cx="180" cy="50" r="30" fill="#f59e0b" fill-opacity="0.15"/>
  <circle cx="180" cy="50" r="15" fill="#fbbf24" fill-opacity="0.2"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="5" fill="#38bdf8"/>
  <circle cx="210" cy="190" r="8" fill="#ec4899"/>
  <path d="M200 180 L220 200" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
</svg>