<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="blueprintGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Brick/Foundation Gradient -->
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Architectural Grid Backdrop -->
  <rect x="0" y="0" width="240" height="240" fill="url(#blueprintGrid)" opacity="0.5"/>
  
  <!-- Ambient glow behind the core foundation -->
  <circle cx="120" cy="140" r="70" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Drafting Table Surface -->
  <path d="M 20 180 L 220 180 L 235 220 L 5 220 Z" fill="url(#tableGrad)" stroke="#475569" stroke-width="1.5"/>
  <line x1="20" y1="180" x2="220" y2="180" stroke="#64748b" stroke-width="2"/>

  <!-- SCENE: Foundation Building Blocks (Visualizing "Basic / Fundamental") -->
  <!-- Base Layer (The Core Foundation) -->
  <g transform="translate(0, 0)">
    <!-- Back/Shadow of Foundation Block -->
    <path d="M 60 160 L 120 140 L 180 160 L 120 180 Z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Left Face -->
    <path d="M 60 160 L 120 180 L 120 205 L 60 185 Z" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Right Face -->
    <path d="M 120 180 L 180 160 L 180 185 L 120 205 Z" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Top Face (Glowing Accent) -->
    <path d="M 60 160 L 120 140 L 180 160 L 120 180 Z" fill="#3b82f6" opacity="0.4"/>
  </g>

  <!-- Second Layer -->
  <g transform="translate(0, -32)">
    <path d="M 75 160 L 120 145 L 165 160 L 120 175 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 75 160 L 120 175 L 120 195 L 75 180 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 120 175 L 165 160 L 165 180 L 120 195 Z" fill="#0ea5e9" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Apex / Pinnacle Block (The Goal Built on Basics) -->
  <g transform="translate(0, -60)">
    <path d="M 95 155 L 120 145 L 145 155 L 120 165 Z" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M 95 155 L 120 165 L 120 180 L 95 170 Z" fill="#d97706" stroke="#fef08a" stroke-width="1.5"/>
    <path d="M 120 165 L 145 155 L 145 170 L 120 180 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
  </g>

  <!-- Supporting Context Props: Architectural Compass & Ruler on the Table -->
  <!-- Drafting Ruler (Diagonal) -->
  <g transform="rotate(-15 70 185)">
    <rect x="50" y="175" width="70" height="10" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <!-- Ruler markings -->
    <line x1="60" y1="175" x2="60" y2="178" stroke="#475569" stroke-width="1"/>
    <line x1="70" y1="175" x2="70" y2="180" stroke="#475569" stroke-width="1"/>
    <line x1="80" y1="175" x2="80" y2="178" stroke="#475569" stroke-width="1"/>
    <line x1="90" y1="175" x2="90" y2="180" stroke="#475569" stroke-width="1"/>
    <line x1="100" y1="175" x2="100" y2="178" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Engineering Compass / Divider -->
  <g transform="translate(160, 160)">
    <!-- Left leg -->
    <line x1="10" y1="0" x2="-5" y2="30" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <!-- Right leg -->
    <line x1="10" y1="0" x2="25" y2="30" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <!-- Hinge circle -->
    <circle cx="10" cy="0" r="4" fill="#fb7185" stroke="#ffe4e6" stroke-width="1.5"/>
    <!-- Compass Arc detail -->
    <path d="M 2 18 Q 10 22 18 18" fill="none" stroke="#fb7185" stroke-width="1.5"/>
  </g>

  <!-- Floating Construction / Blueprint Sparkles (Atmospheric Depth) -->
  <g fill="#38bdf8">
    <!-- Star/Plus 1 -->
    <path d="M 45 70 L 45 80 M 40 75 L 50 75" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Star/Plus 2 -->
    <path d="M 195 95 L 195 105 M 190 100 L 200 100" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Small glowing nodes -->
    <circle cx="120" cy="65" r="3" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="85" cy="115" r="2" fill="#38bdf8"/>
    <circle cx="155" cy="115" r="2" fill="#38bdf8"/>
  </g>

  <!-- Blueprint Dimension Lines (Subtle Technical Aesthetic) -->
  <g stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" opacity="0.5">
    <!-- Base width indicator -->
    <line x1="60" y1="215" x2="180" y2="215"/>
    <line x1="60" y1="210" x2="60" y2="220"/>
    <line x1="180" y1="210" x2="180" y2="220"/>
  </g>

</svg>