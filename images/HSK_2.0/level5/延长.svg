<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Background Interior Elements (Office / Desk Setup) -->
  <!-- Bookshelf / Wall detail -->
  <rect x="25" y="30" width="40" height="70" rx="4" fill="#334155" opacity="0.4" />
  <rect x="35" y="40" width="20" height="6" rx="2" fill="#475569" opacity="0.5" />
  <rect x="35" y="55" width="20" height="6" rx="2" fill="#475569" opacity="0.5" />
  <rect x="35" y="70" width="20" height="6" rx="2" fill="#475569" opacity="0.5" />

  <!-- Warm Wall Lamp / Glow -->
  <circle cx="180" cy="50" r="25" fill="#f59e0b" opacity="0.1" filter="url(#glow)" />
  <path d="M175 35 L185 35 L188 50 L172 50 Z" fill="#64748b" />
  <path d="M165 50 Q180 58 195 50" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

  <!-- Window with Night City Silhouette -->
  <path d="M185 75 L220 75 L220 135 L185 135 Z" fill="#090d16" />
  <rect x="190" y="85" width="8" height="15" rx="1" fill="#fbbf24" opacity="0.4" />
  <rect x="202" y="95" width="8" height="20" rx="1" fill="#38bdf8" opacity="0.3" />
  <rect x="190" y="110" width="8" height="18" rx="1" fill="#38bdf8" opacity="0.5" />
  <path d="M185 75 L220 75 L220 135 L185 135 Z" fill="none" stroke="#475569" stroke-width="2" />

  <!-- Office Desk Surface -->
  <path d="M10 165 Q120 155 230 165 L235 220 Q120 220 5 220 Z" fill="url(#deskGrad)" />
  <rect x="0" y="160" width="240" height="8" rx="2" fill="#475569" />

  <!-- Desk Props -->
  <!-- Coffee Mug -->
  <rect x="25" y="140" width="14" height="18" rx="3" fill="#cbd5e1" />
  <path d="M39 144 Q44 144 44 149 Q44 154 39 154" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
  <!-- Plant in Pot -->
  <path d="M210 145 L222 145 L220 160 L212 160 Z" fill="#e2e8f0" />
  <circle cx="216" cy="138" r="10" fill="#10b981" />
  <circle cx="210" cy="132" r="8" fill="#34d399" />
  <circle cx="222" cy="134" r="8" fill="#059669" />

  <!-- CHARACTER: Office Worker / Manager extending deadline -->
  <!-- Body / Torso (Teal shirt / blazer) -->
  <path d="M70 175 C70 150 90 145 105 145 C120 145 140 150 140 175 Z" fill="#0284c7" />
  <!-- Collar & Neck -->
  <path d="M97 142 L105 152 L113 142 Z" fill="#f8fafc" />
  <path d="M100 135 L110 135 L110 145 L100 145 Z" fill="#fbcfe8" />
  <!-- Head -->
  <circle cx="105" cy="120" r="16" fill="#fbcfe8" />
  <!-- Hair (Neat dark hair) -->
  <path d="M89 120 C89 106 101 102 105 102 C115 102 121 110 121 122 C121 122 118 116 113 114 C108 112 100 114 95 118 Z" fill="#1e293b" />
  <!-- Facial expression: Focused, helpful, smiling slightly -->
  <circle cx="100" cy="119" r="1.5" fill="#1e293b" />
  <circle cx="110" cy="119" r="1.5" fill="#1e293b" />
  <path d="M103 126 Q105 128 107 126" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right Arm pointing / adjusting -->
  <path d="M130 155 Q150 150 155 135" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
  <circle cx="156" cy="132" r="5" fill="#fbcfe8" />

  <!-- MAIN PROP: The Document / Contract with Deadline -->
  <!-- Clipboard / Base -->
  <rect x="75" y="145" width="65" height="45" rx="4" fill="#94a3b8" transform="rotate(-8 107 167)" />
  <!-- Paper Sheet -->
  <rect x="78" y="142" width="59" height="42" rx="3" fill="url(#paperGrad)" transform="rotate(-8 107 163)" />
  <!-- Document Lines (Abstract mock text) -->
  <line x1="86" y1="152" x2="115" y2="148" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="85" y1="162" x2="120" y2="157" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="84" y1="171" x2="110" y2="167" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- VISUAL METAPHOR FOR "EXTENSION" (延长 - kéo dài) -->
  <!-- Glowing Arrow / Expansion Bracket encompassing the document date -->
  <g filter="url(#glow)">
    <!-- Highlight Box around Deadline section -->
    <rect x="80" y="165" width="45" height="24" rx="4" fill="url(#highlightGrad)" opacity="0.3" transform="rotate(-8 102 177)" />
    <rect x="80" y="165" width="45" height="24" rx="4" fill="none" stroke="#fbbf24" stroke-width="2" transform="rotate(-8 102 177)" />

    <!-- Dynamic Extension Arrows pulling outward to symbolize stretching/extending time -->
    <!-- Left pull arrow -->
    <path d="M60 178 L72 173 L72 183 Z" fill="#38bdf8" />
    <line x1="70" y1="178" x2="88" y2="175" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- Right pull arrow (Extending further) -->
    <path d="M152 165 L140 170 L140 160 Z" fill="#38bdf8" />
    <line x1="124" y1="172" x2="142" y2="167" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- Motion / Time Arc Waves floating above the document -->
    <path d="M90 135 Q107 122 125 130" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M85 128 Q107 112 130 123" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Sparkles / Magic Time Extension Effects -->
  <circle cx="70" cy="135" r="3" fill="#fbbf24" />
  <circle cx="145" cy="140" r="2" fill="#38bdf8" />
  <polygon points="135,115 137,120 142,122 137,124 135,129 133,124 128,122 133,120" fill="#fbbf24" />
  <polygon points="85,110 86,113 89,114 86,115 85,118 84,115 81,114 84,113" fill="#38bdf8" />

  <!-- Foreground Frame/Border styling for polished vector look -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
</svg>