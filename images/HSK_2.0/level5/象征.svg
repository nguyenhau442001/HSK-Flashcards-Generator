<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Park Setting -->
  <path d="M0 180 Q 120 150 240 180 L 240 240 L 0 240 Z" fill="#1e293b" opacity="0.5"/>
  <circle cx="200" cy="50" r="30" fill="#f59e0b" opacity="0.1"/>
  
  <!-- The Dove (Subject) -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M60 80 C 40 80 20 60 20 40 C 20 20 40 10 60 10 C 80 10 100 20 100 40 C 100 60 80 80 60 80 Z" fill="#f1f5f9"/>
    <!-- Wing -->
    <path d="M60 20 C 90 20 130 10 150 40 C 130 30 100 40 80 50 Z" fill="#e2e8f0"/>
    <!-- Eye -->
    <circle cx="45" cy="30" r="3" fill="#0f172a"/>
    <!-- Beak -->
    <path d="M30 35 L 20 40 L 30 45 Z" fill="#fb923c"/>
  </g>

  <!-- Olive Branch (Symbolic Prop) -->
  <g transform="translate(140, 120) rotate(20)">
    <path d="M0 0 C 20 -10 60 -10 80 0" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="20" cy="-5" rx="8" ry="4" fill="#10b981" transform="rotate(-20 20 -5)"/>
    <ellipse cx="40" cy="-8" rx="8" ry="4" fill="#10b981" transform="rotate(10 40 -8)"/>
    <ellipse cx="60" cy="-5" rx="8" ry="4" fill="#10b981" transform="rotate(-15 60 -5)"/>
  </g>

  <!-- Atmospheric Accents -->
  <circle cx="180" cy="180" r="2" fill="#38bdf8"/>
  <circle cx="200" cy="190" r="3" fill="#fbbf24"/>
  <circle cx="30" cy="200" r="2" fill="#ec4899"/>
</svg>