<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stage Glow Gradient -->
    <radialGradient id="stageGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="expressGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Spotlight Beam -->
    <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Stage Light & Background Elements -->
  <circle cx="120" cy="90" r="80" fill="url(#stageGlow)"/>
  
  <!-- Architectural Studio Lines / Depth -->
  <line x1="30" y1="190" x2="210" y2="190" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="120" cy="190" rx="80" ry="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Spotlight Cone -->
  <polygon points="120,0 70,190 170,190" fill="url(#spotlight)"/>

  <!-- Floating Expression & Emotion Symbols (Vibrant Vector Props representing "biểu đạt/diễn đạt") -->
  <!-- Floating Heart (Emotion) -->
  <g filter="url(#softShadow)" transform="translate(15, -5)">
    <path d="M 68 55 C 62 48, 52 48, 46 55 C 40 62, 43 73, 52 80 L 57 85 L 62 80 C 71 73, 74 62, 68 55 Z" fill="#ec4899" transform="translate(0, 0) scale(0.9)" />
    <!-- Sparkle on heart -->
    <path d="M 52 52 L 53 56 L 57 57 L 53 58 L 52 62 L 51 58 L 47 57 L 51 56 Z" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Floating Star / Idea -->
  <g filter="url(#softShadow)">
    <path d="M 185 70 L 188 78 L 196 81 L 188 84 L 185 92 L 182 84 L 174 81 L 182 78 Z" fill="#f59e0b"/>
  </g>

  <!-- Floating Musical Note / Melody of Expression -->
  <g filter="url(#softShadow)">
    <circle cx="55" cy="120" r="6" fill="#38bdf8"/>
    <path d="M 61 120 L 61 102 L 75 97 L 75 115" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="69" cy="115" r="6" fill="#38bdf8"/>
  </g>

  <!-- Speech/Expression Flow Waves (Dynamic arcs curving outward from character) -->
  <path d="M 85 90 C 70 95, 65 110, 75 125" fill="none" stroke="url(#expressGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 155 90 C 170 95, 175 110, 165 125" fill="none" stroke="url(#expressGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 78 75 C 55 85, 50 110, 65 135" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Main Character: Storyteller / Orator / Expressive Persona -->
  <g id="character" filter="url(#softShadow)">
    <!-- Shadow beneath character -->
    <ellipse cx="120" cy="192" rx="35" ry="6" fill="#000000" opacity="0.4"/>

    <!-- Body / Torso -->
    <!-- Shoulders & Upper garment -->
    <path d="M 90 190 C 90 155, 150 155, 150 190 Z" fill="url(#topGrad)"/>
    <!-- Collar details -->
    <path d="M 105 155 L 120 168 L 135 155" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 120 168 L 120 190" fill="none" stroke="#0284c7" stroke-width="2"/>

    <!-- Left Arm - Gesturing Outward (Expressive action) -->
    <path d="M 92 165 C 75 160, 60 145, 52 135" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <!-- Left Hand Open / Expressing -->
    <circle cx="48" cy="132" r="6" fill="#cbd5e1"/>

    <!-- Right Arm - Raised in dynamic expression -->
    <path d="M 148 165 C 165 155, 180 135, 185 120" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Hand Open -->
    <circle cx="188" cy="115" r="6" fill="#cbd5e1"/>

    <!-- Neck -->
    <rect x="112" y="142" width="16" height="18" rx="4" fill="#cbd5e1"/>

    <!-- Head & Face -->
    <circle cx="120" cy="122" r="26" fill="#e2e8f0"/>

    <!-- Hair Back/Base -->
    <path d="M 94 120 C 94 98, 146 98, 146 120 C 146 130, 140 135, 140 135 L 135 110 L 105 110 L 100 135 C 100 135, 94 130, 94 120 Z" fill="url(#hairGrad)"/>
    <!-- Hair Bangs / Styling -->
    <path d="M 97 116 C 105 102, 135 102, 143 116 C 135 108, 105 108, 97 116 Z" fill="#475569"/>

    <!-- Facial Features - Expressive Eyes (Joyful / Focused) -->
    <circle cx="111" cy="120" r="3" fill="#0f172a"/>
    <circle cx="129" cy="120" r="3" fill="#0f172a"/>
    <!-- Eye highlights -->
    <circle cx="112" cy="119" r="1" fill="#ffffff"/>
    <circle cx="130" cy="119" r="1" fill="#ffffff"/>

    <!-- Eyebrows raised dynamically -->
    <path d="M 107 113 C 111 111, 115 113, 116 114" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 123 114 C 125 113, 129 111, 133 113" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Rosy Cheeks (Emotion/Expression) -->
    <circle cx="106" cy="127" r="4" fill="#fb7185" opacity="0.6"/>
    <circle cx="134" cy="127" r="4" fill="#fb7185" opacity="0.6"/>

    <!-- Open Smiling Mouth (Speaking/Expressing) -->
    <path d="M 113 129 C 113 135, 127 135, 127 129 Z" fill="#9f1239"/>
    <!-- Tongue detail -->
    <path d="M 116 131 C 118 134, 122 134, 124 131 Z" fill="#fb7185"/>
  </g>

  <!-- Dynamic Communication Waves radiating from head -->
  <path d="M 98 96 C 105 90, 135 90, 142 96" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 90 88 C 100 80, 140 80, 150 88" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Foreground Atmospheric Particles / Energy Bursts -->
  <circle cx="75" cy="165" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="165" cy="170" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="100" cy="45" r="2.5" fill="#ec4899" opacity="0.7"/>
  <circle cx="145" cy="55" r="3" fill="#34d399" opacity="0.8"/>
  <circle cx="35" cy="85" r="2" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Subtle floor reflections -->
  <ellipse cx="120" cy="191" rx="60" ry="2" fill="#38bdf8" opacity="0.15"/>
</svg>