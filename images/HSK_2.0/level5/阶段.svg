<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="phase1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="phase2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="phase3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Office Environment Background Details -->
  <!-- Window view / City lights in dark -->
  <rect x="25" y="30" width="45" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <rect x="33" y="38" width="12" height="18" fill="#38bdf8" opacity="0.3" rx="1" />
  <rect x="50" y="38" width="12" height="18" fill="#fbbf24" opacity="0.3" rx="1" />
  <rect x="33" y="62" width="12" height="18" fill="#fbbf24" opacity="0.2" rx="1" />
  <rect x="50" y="62" width="12" height="18" fill="#38bdf8" opacity="0.2" rx="1" />
  <line x1="47" y1="30" x2="47" y2="90" stroke="#334155" stroke-width="2" />

  <!-- Hanging Plant -->
  <path d="M 195 20 Q 200 40 190 55" fill="none" stroke="#64748b" stroke-width="2" />
  <circle cx="195" cy="20" r="8" fill="#475569" />
  <path d="M 185 40 Q 180 50 186 60 Q 195 55 190 40" fill="#34d399" />
  <path d="M 200 45 Q 210 52 205 65 Q 198 55 200 45" fill="#10b981" />

  <!-- Main Presentation / Kanban Board Structure (Divided into THREE phases) -->
  <rect x="75" y="45" width="145" height="125" rx="8" fill="url(#board-grad)" stroke="#475569" stroke-width="2" />
  
  <!-- Three Vertical Phase Columns -->
  <!-- Phase 1 Column -->
  <rect x="83" y="55" width="41" height="107" rx="4" fill="#1e293b" opacity="0.7" />
  <path d="M 88 65 L 119 65" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <!-- Card in Phase 1 -->
  <rect x="87" y="75" width="33" height="38" rx="3" fill="url(#phase1-grad)" />
  <circle cx="95" cy="85" r="4" fill="#ffffff" opacity="0.9" />
  <rect x="103" y="83" width="14" height="4" rx="2" fill="#ffffff" opacity="0.8" />
  <rect x="91" y="94" width="25" height="3" rx="1.5" fill="#ffffff" opacity="0.6" />
  <rect x="91" y="100" width="18" height="3" rx="1.5" fill="#ffffff" opacity="0.6" />

  <!-- Phase 2 Column -->
  <rect x="127" y="55" width="41" height="107" rx="4" fill="#1e293b" opacity="0.7" />
  <path d="M 132 65 L 163 65" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <!-- Card in Phase 2 -->
  <rect x="131" y="75" width="33" height="38" rx="3" fill="url(#phase2-grad)" />
  <circle cx="139" cy="85" r="4" fill="#ffffff" opacity="0.9" />
  <rect x="147" y="83" width="14" height="4" rx="2" fill="#ffffff" opacity="0.8" />
  <rect x="135" y="94" width="25" height="3" rx="1.5" fill="#ffffff" opacity="0.6" />
  <rect x="135" y="100" width="15" height="3" rx="1.5" fill="#ffffff" opacity="0.6" />
  
  <!-- Phase 3 Column -->
  <rect x="171" y="55" width="41" height="107" rx="4" fill="#1e293b" opacity="0.7" />
  <path d="M 176 65 L 207 65" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <!-- Card in Phase 3 -->
  <rect x="175" y="75" width="33" height="38" rx="3" fill="url(#phase3-grad)" />
  <circle cx="183" cy="85" r="4" fill="#ffffff" opacity="0.9" />
  <rect x="191" y="83" width="14" height="4" rx="2" fill="#ffffff" opacity="0.8" />
  <rect x="179" y="94" width="22" height="3" rx="1.5" fill="#ffffff" opacity="0.6" />
  <rect x="179" y="100" width="25" height="3" rx="1.5" fill="#ffffff" opacity="0.6" />

  <!-- Desk Surface -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#0f172a" />
  <rect x="0" y="190" width="240" height="6" fill="#334155" rx="3" />

  <!-- Laptop & Accessories on Desk -->
  <path d="M 155 190 L 205 190 L 215 178 L 145 178 Z" fill="#64748b" />
  <rect x="150" y="145" width="60" height="34" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="154" y="149" width="52" height="26" fill="#1e293b" />
  <!-- Code/Chart graphics on laptop screen -->
  <path d="M 158 155 L 175 155 M 158 161 L 185 161 M 158 167 L 170 167" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="195" cy="164" r="5" fill="#fbbf24" />

  <!-- Coffee Mug -->
  <rect x="210" y="170" width="16" height="20" rx="3" fill="#f43f5e" />
  <path d="M 226 174 C 232 174 232 184 226 186" fill="none" stroke="#f43f5e" stroke-width="2.5" />

  <!-- Plant pot on desk -->
  <path d="M 20 178 L 36 178 L 33 192 L 23 192 Z" fill="#475569" />
  <circle cx="28" cy="172" r="10" fill="#34d399" />
  <circle cx="20" cy="175" r="7" fill="#10b981" />
  <circle cx="35" cy="173" r="8" fill="#059669" />

  <!-- Expressive Character (Project Manager / Presenter) -->
  <!-- Body / Torso -->
  <path d="M 50 200 C 50 170 75 165 95 165 C 115 165 140 170 140 200 Z" fill="#4f46e5" />
  <!-- Collar & Shirt details -->
  <path d="M 85 165 L 95 180 L 105 165 Z" fill="#ffffff" />
  
  <!-- Neck & Head -->
  <rect x="88" y="142" width="14" height="25" fill="#fbcfe8" rx="5" />
  <circle cx="95" cy="130" r="22" fill="#fbcfe8" />
  
  <!-- Hair -->
  <path d="M 73 125 C 73 105 117 105 117 125 C 117 132 110 135 110 135 C 110 135 105 118 95 118 C 85 118 80 135 80 135 C 80 135 73 132 73 125 Z" fill="#1e293b" />

  <!-- Face features (Smiling, engaged expression) -->
  <circle cx="88" cy="128" r="2" fill="#1e293b" />
  <circle cx="102" cy="128" r="2" fill="#1e293b" />
  <path d="M 91 136 Q 95 141 99 136" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <circle cx="83" cy="133" r="3" fill="#fda4af" opacity="0.6" />
  <circle cx="107" cy="133" r="3" fill="#fda4af" opacity="0.6" />

  <!-- Pointing Arm & Hand gesturing to the 3 phases -->
  <!-- Back arm -->
  <path d="M 60 175 Q 50 160 65 150" fill="none" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" />
  <!-- Front pointing arm -->
  <path d="M 125 170 Q 145 155 130 140" fill="none" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" />
  <!-- Hand pointing towards the board -->
  <circle cx="127" cy="135" r="6" fill="#fbcfe8" />
  <path d="M 132 133 L 142 128 L 134 125 Z" fill="#fbcfe8" />

  <!-- Highlight glow around the 3 phases to focus attention -->
  <rect x="73" y="38" width="155" height="139" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" filter="url(#glow)" />

</svg>