<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Books Stack -->
  <rect x="40" y="110" width="60" height="50" rx="4" fill="#fbbf24"/>
  <rect x="45" y="100" width="50" height="10" rx="2" fill="#f59e0b"/>
  <rect x="50" y="90" width="40" height="10" rx="2" fill="#fb923c"/>
  
  <!-- Lamp -->
  <path d="M160 160 L180 160 L175 100 L165 100 Z" fill="#475569"/>
  <circle cx="170" cy="90" r="20" fill="#fef08a"/>
  <circle cx="170" cy="90" r="12" fill="#fde047"/>
  
  <!-- Character (Upper Body/Arms) -->
  <circle cx="120" cy="140" r="30" fill="#cbd5e1"/>
  <rect x="95" y="160" width="50" height="60" rx="10" fill="#38bdf8"/>
  
  <!-- Hands working -->
  <ellipse cx="105" cy="170" rx="8" ry="12" fill="#fca5a5"/>
  <ellipse cx="135" cy="170" rx="8" ry="12" fill="#fca5a5"/>
  
  <!-- Paper/Notebook -->
  <rect x="90" y="175" width="60" height="40" rx="2" fill="#f8fafc"/>
  <line x1="100" y1="185" x2="140" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <line x1="100" y1="195" x2="140" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="100" y1="205" x2="120" y2="205" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Coffee Mug -->
  <rect x="180" y="135" width="25" height="25" rx="4" fill="#ec4899"/>
  <path d="M205 140 C215 140 215 150 205 150" stroke="#ec4899" stroke-width="4" fill="none"/>
  
  <!-- Ambient Glow -->
  <circle cx="170" cy="90" r="40" fill="#f59e0b" opacity="0.1"/>
</svg>