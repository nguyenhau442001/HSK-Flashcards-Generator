<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Tabletop Lighting Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glass / Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.3" />
    </linearGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment (Office Interior) -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="130" fill="#1e293b" />
  
  <!-- Subtle Wall Paneling Lines -->
  <line x1="20" y1="50" x2="220" y2="50" stroke="#334155" stroke-width="1" opacity="0.5" />
  <line x1="20" y1="100" x2="220" y2="100" stroke="#334155" stroke-width="1" opacity="0.3" />

  <!-- Window with City Silhouette -->
  <g transform="translate(90, 28)">
    <rect x="0" y="0" width="60" height="75" rx="2" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- City Buildings outside -->
    <rect x="8" y="30" width="12" height="45" fill="#334155" />
    <rect x="24" y="20" width="15" height="55" fill="#1e293b" />
    <rect x="42" y="38" width="10" height="37" fill="#334155" />
    <!-- Window Grid -->
    <line x1="30" y1="0" x2="30" y2="75" stroke="#475569" stroke-width="1.5" />
    <line x1="0" y1="37" x2="60" y2="37" stroke="#475569" stroke-width="1.5" />
  </g>

  <!-- Light Beam from Window -->
  <polygon points="120,28 150,150 50,150" fill="url(#light-beam)" />

  <!-- Indoor Plant for Rich Context -->
  <g transform="translate(25, 80)">
    <path d="M10,50 Q12,30 20,20 Q25,35 20,50 Z" fill="#10b981" />
    <path d="M15,50 Q5,35 2,25 Q12,35 15,50 Z" fill="#059669" />
    <path d="M15,50 Q25,30 35,25 Q28,40 15,50 Z" fill="#34d399" />
    <rect x="10" y="50" width="12" height="15" rx="3" fill="#cbd5e1" />
  </g>

  <!-- Hanging Pendant Lamp -->
  <path d="M120,0 L120,35" stroke="#64748b" stroke-width="2" />
  <path d="M105,35 L135,35 L140,45 L100,45 Z" fill="#475569" />
  <!-- Lamp Glow Spread -->
  <circle cx="120" cy="45" r="50" fill="url(#lamp-glow)" />

  <!-- Meeting Table Surface (Perspective) -->
  <polygon points="10,150 230,150 200,210 40,210" fill="url(#table-grad)" stroke="#475569" stroke-width="1.5" />
  <!-- Table highlight edge -->
  <polygon points="15,150 225,150 221,153 19,153" fill="#475569" opacity="0.6" />

  <!-- Centerpiece Props on Table (Documents, Charts, Laptop) -->
  <!-- Open Folder/Contracts -->
  <g transform="translate(100, 155) rotate(-5)">
    <polygon points="0,15 25,5 40,20 15,30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="8" y1="16" x2="18" y2="12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="8" y1="21" x2="22" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <polygon points="12,18 37,8 52,23 27,33" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Chart lines on document -->
    <line x1="18" y1="22" x2="28" y2="18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <polyline points="32,18 36,15 42,20" fill="none" stroke="#10b981" stroke-width="1.5" />
  </g>

  <!-- Laptop / Tablet Displaying Analytics -->
  <g transform="translate(125, 145)">
    <polygon points="5,20 25,10 40,15 20,25" fill="#334155" />
    <!-- Screen -->
    <polygon points="7,18 24,9 23,2 6,11" fill="url(#screen-glow)" />
    <!-- Bar chart on screen -->
    <line x1="10" y1="12" x2="10" y2="7" stroke="#ffffff" stroke-width="1.5" />
    <line x1="13" y1="13" x2="13" y2="5" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="16" y1="14" x2="16" y2="9" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Coffee Mug -->
  <rect x="75" y="160" width="10" height="12" rx="2" fill="#e2e8f0" />
  <path d="M85,163 C88,163 88,169 85,169" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ================= CHARACTERS ================= -->

  <!-- Character 1: Left Side (Professional Negotiator - Active Gesturing) -->
  <g transform="translate(25, 95)">
    <!-- Body / Suit Torso -->
    <path d="M25,55 C25,40 35,35 45,35 C55,35 65,40 65,55 L70,95 L20,95 Z" fill="#1e293b" />
    <!-- Shirt & Tie -->
    <polygon points="40,35 50,35 48,55 42,55" fill="#f8fafc" />
    <polygon points="43,45 47,45 48,65 45,70 42,65" fill="#ec4899" />
    <!-- Suit Lapels -->
    <path d="M40,35 L33,55 L42,55 Z" fill="#334155" />
    <path d="M50,35 L57,55 L48,55 Z" fill="#334155" />

    <!-- Head & Hair -->
    <circle cx="45" cy="22" r="14" fill="#fcd34d" />
    <!-- Hair (Dark, neat side part) -->
    <path d="M31,20 C31,12 38,10 47,11 C55,12 59,16 59,22 C55,16 40,15 31,20 Z" fill="#334155" />
    
    <!-- Facial Features (Engaged, Confident Expression) -->
    <circle cx="41" cy="21" r="1.5" fill="#1e293b" />
    <circle cx="50" cy="21" r="1.5" fill="#1e293b" />
    <!-- Eyebrows (Determined) -->
    <line x1="39" y1="18" x2="43" y2="19" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="48" y1="19" x2="52" y2="18" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Smile / Talking -->
    <path d="M43,27 Q45.5,29 48,27" fill="none" fill-opacity="0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Left Arm (Resting on table) -->
    <path d="M25,50 C15,55 10,65 10,75 L25,75" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Arm (Active Negotiating Gesture - Pointing/Explaining) -->
    <path d="M65,48 C75,45 82,55 75,65 L65,70" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand -->
    <circle cx="77" cy="65" r="4.5" fill="#fcd34d" />
  </g>

  <!-- Character 2: Right Side (Attentive Negotiator - Listening/Considering) -->
  <g transform="translate(140, 90)">
    <!-- Body / Suit Torso -->
    <path d="M25,60 C25,45 35,40 45,40 C55,40 65,45 65,60 L75,100 L15,100 Z" fill="#0f172a" />
    <!-- Shirt & Tie -->
    <polygon points="40,40 50,40 48,60 42,60" fill="#f8fafc" />
    <polygon points="43,50 47,50 46,70 45,75 44,70" fill="#38bdf8" />
    <!-- Suit Lapels -->
    <path d="M40,40 L33,60 L42,60 Z" fill="#1e293b" />
    <path d="M50,40 L57,60 L48,60 Z" fill="#1e293b" />

    <!-- Head & Hair -->
    <circle cx="45" cy="27" r="14" fill="#fcd34d" />
    <!-- Hair (Stylish bun / Tied back) -->
    <circle cx="56" cy="25" r="5" fill="#475569" />
    <path d="M31,26 C31,17 38,15 48,16 C55,17 58,23 58,27 C54,22 40,20 31,26 Z" fill="#475569" />

    <!-- Facial Features (Thoughtful, Analytical Expression) -->
    <circle cx="41" cy="26" r="1.5" fill="#1e293b" />
    <circle cx="50" cy="26" r="1.5" fill="#1e293b" />
    <!-- Eyebrows (Thoughtful tilt) -->
    <line x1="39" y1="23" x2="43" y2="24" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="48" y1="24" x2="52" y2="23" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Neutral / Contemplative Mouth -->
    <path d="M44,33 Q46,34 48,33" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Left Arm (Hand on Chin - Thinking Gesture) -->
    <path d="M25,55 C15,60 18,75 28,70 L35,65" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand on Chin -->
    <circle cx="37" cy="63" r="4.5" fill="#fcd34d" />

    <!-- Right Arm (Resting on table) -->
    <path d="M65,55 C75,60 80,75 80,80 L60,80" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Atmosphere / Lighting Polish -->
  <!-- Subtle lighting rim on table edge -->
  <line x1="40" y1="210" x2="200" y2="210" stroke="#475569" stroke-width="1" opacity="0.3" />
</svg>