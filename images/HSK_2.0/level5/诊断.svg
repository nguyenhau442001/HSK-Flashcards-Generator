<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- X-Ray Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="desk-light" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light Effect -->
  <circle cx="160" cy="100" r="100" fill="url(#desk-light)"/>

  <!-- Background Environment: Clinic Room -->
  <g id="room-interior">
    <!-- Back wall -->
    <rect x="20" y="20" width="200" height="150" rx="4" fill="#1e293b" opacity="0.5"/>
    
    <!-- Medical Cabinet with shelves -->
    <rect x="25" y="45" width="40" height="90" rx="2" fill="#334155" opacity="0.7"/>
    <line x1="25" y1="75" x2="65" y2="75" stroke="#475569" stroke-width="2"/>
    <line x1="25" y1="105" x2="65" y2="105" stroke="#475569" stroke-width="2"/>
    <!-- Medicine bottles on shelf -->
    <rect x="32" y="60" width="8" height="15" rx="1" fill="#10b981" opacity="0.8"/>
    <rect x="45" y="55" width="10" height="20" rx="2" fill="#f43f5e" opacity="0.8"/>
    <rect x="35" y="90" width="12" height="15" rx="2" fill="#38bdf8" opacity="0.8"/>

    <!-- Diagnostic Light Box / X-Ray Screen on Wall -->
    <rect x="135" y="35" width="70" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <rect x="139" y="39" width="62" height="47" rx="2" fill="url(#screen-glow)"/>
    <!-- Abstract Rib/Lung Scan Graphic inside X-Ray -->
    <path d="M170 48 C 160 48, 155 58, 155 65 C 155 72, 163 76, 170 78 C 177 76, 185 72, 185 65 C 185 58, 180 48, 170 48 Z" fill="#e0f2fe" opacity="0.7"/>
    <path d="M165 52 Q 170 60 165 74" stroke="#0284c7" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M175 52 Q 170 60 175 74" stroke="#0284c7" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Desk / Table surface -->
    <rect x="10" y="170" width="220" height="50" rx="4" fill="#334155"/>
    <rect x="10" y="166" width="220" height="8" rx="2" fill="#475569"/>
  </g>

  <!-- Foreground Props on Desk -->
  <g id="desk-props">
    <!-- Medical Chart / Clipboard -->
    <g transform="translate(35, 145) rotate(-8)">
      <rect x="0" y="0" width="35" height="45" rx="3" fill="#cbd5e1" filter="url(#shadow)"/>
      <rect x="3" y="5" width="29" height="37" rx="1" fill="#f8fafc"/>
      <!-- Clip -->
      <rect x="11" y="-3" width="13" height="6" rx="2" fill="#64748b"/>
      <!-- Lines representing text/chart -->
      <line x1="7" y1="12" x2="24" y2="12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="7" y1="18" x2="28" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="7" y1="24" x2="20" y2="24" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <circle cx="9" cy="32" r="3" fill="#10b981"/>
      <line x1="15" y1="32" x2="27" y2="32" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Stethoscope resting on desk -->
    <path d="M70 180 C 80 160, 100 170, 110 185 C 120 195, 135 180, 140 170" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" filter="url(#shadow)"/>
    <circle cx="140" cy="170" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Patient (Sitting on the right) -->
  <g id="patient" transform="translate(140, 95)">
    <!-- Body/Chair interaction -->
    <path d="M 10 75 L 50 75 L 50 120 L 10 120 Z" fill="#38bdf8" opacity="0.2"/>
    
    <!-- Patient Torso (Wearing casual jacket/shirt) -->
    <path d="M 0 50 C 0 35, 20 30, 35 35 C 50 40, 55 55, 50 85 L -10 85 C -15 65, -5 55, 0 50 Z" fill="#f59e0b" filter="url(#shadow)"/>
    <path d="M 12 37 L 25 65 L 38 37 Z" fill="#ffffff" opacity="0.9"/> <!-- Collar -->

    <!-- Patient Head & Face (Worried/Consulting expression) -->
    <circle cx="20" cy="12" r="16" fill="#fcd34d" filter="url(#shadow)"/>
    <!-- Hair -->
    <path d="M 4 8 C 4 -2, 25 -4, 36 6 C 30 2, 15 2, 4 8 Z" fill="#1e293b"/>
    <!-- Worried Eyebrows -->
    <line x1="13" y1="8" x2="19" y2="10" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="10" x2="33" y2="8" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes (Looking thoughtfully towards doctor) -->
    <circle cx="16" cy="13" r="1.5" fill="#1e293b"/>
    <circle cx="28" cy="13" r="1.5" fill="#1e293b"/>
    <!-- Mouth (Slightly concerned/pout) -->
    <path d="M 20 20 Q 22 23 24 20" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Hand touching chin (thoughtful/sick) -->
    <circle cx="32" cy="45" r="5" fill="#fcd34d"/>
  </g>

  <!-- Doctor (Standing/Leaning over desk, diagnosing) -->
  <g id="doctor" transform="translate(50, 75)">
    <!-- Doctor's Lab Coat -->
    <!-- Body Base -->
    <path d="M 15 35 C 15 25, 35 25, 45 35 C 55 45, 60 65, 55 110 L 5 110 C 0 65, 5 45, 15 35 Z" fill="#ffffff" filter="url(#shadow)"/>
    <!-- Lab Coat Opening / Shirt -->
    <path d="M 30 32 L 30 110" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 22 35 L 30 50 L 38 35 Z" fill="#3b82f6"/> <!-- Blue scrub top underneath -->

    <!-- Stethoscope around neck -->
    <path d="M 22 25 C 15 25, 12 35, 18 55 C 22 68, 28 75, 30 85" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="85" r="5" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Doctor Head & Face (Confident, focused, analyzing) -->
    <circle cx="30" cy="12" r="15" fill="#fbcfe8"/> <!-- Skin tone variation -->
    <!-- Hair (Professional neat dark hair) -->
    <path d="M 17 12 C 17 2, 43 2, 43 12 C 40 7, 20 7, 17 12 Z" fill="#0f172a"/>
    <!-- Focused Eyebrows -->
    <line x1="22" y1="9" x2="28" y2="11" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="11" x2="38" y2="9" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="25" cy="13" r="1.5" fill="#0f172a"/>
    <circle cx="35" cy="13" r="1.5" fill="#0f172a"/>
    <!-- Confident professional smile -->
    <path d="M 27 19 Q 30 22 33 19" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Pointing / Analyzing Arm (Pointing towards X-Ray or Patient) -->
    <path d="M 45 45 Q 65 35, 75 50" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 45 45 Q 65 35, 75 50" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Doctor Hand -->
    <circle cx="76" cy="51" r="5" fill="#fbcfe8"/>

    <!-- Other Arm resting naturally -->
    <path d="M 18 45 Q 10 65, 15 80" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="16" cy="82" r="4.5" fill="#fbcfe8"/>
  </g>

  <!-- Diagnostic Action Highlight Sparkles (Subtle floating indicators of medical analysis) -->
  <g id="sparkles" transform="translate(110, 50)" filter="url(#glow)">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#38bdf8" opacity="0.8"/>
  </g>
  <g id="sparkles-2" transform="translate(130, 80)" filter="url(#glow)">
    <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="#10b981" opacity="0.9"/>
  </g>

</svg>