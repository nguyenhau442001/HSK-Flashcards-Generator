<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Photo Drop Shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment / Wall -->
  <rect x="0" y="0" width="240" height="150" fill="#1e293b" />
  
  <!-- Window with Night Scene -->
  <rect x="170" y="20" width="45" height="60" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2" />
  <rect x="173" y="23" width="39" height="54" fill="url(#window-grad)" />
  <!-- Window crossbars -->
  <line x1="192" y1="23" x2="192" y2="77" stroke="#334155" stroke-width="1.5" />
  <line x1="173" y1="50" x2="212" y2="50" stroke="#334155" stroke-width="1.5" />
  <!-- Tiny moon outside -->
  <circle cx="200" cy="35" r="4" fill="#fbbf24" opacity="0.8" />

  <!-- Cork Notice Board on Wall -->
  <rect x="25" y="25" width="90" height="65" rx="6" fill="#b45309" stroke="#78350f" stroke-width="3" />
  <!-- Cork texture dots -->
  <circle cx="40" cy="40" r="1.5" fill="#92400e" opacity="0.6" />
  <circle cx="70" cy="55" r="1.5" fill="#92400e" opacity="0.6" />
  <circle cx="95" cy="35" r="1.5" fill="#92400e" opacity="0.6" />
  <circle cx="50" cy="70" r="1.5" fill="#92400e" opacity="0.6" />
  <circle cx="85" cy="75" r="1.5" fill="#92400e" opacity="0.6" />

  <!-- Pinned notes/photos on board -->
  <rect x="35" y="35" width="25" height="20" fill="#fef08a" transform="rotate(-5 47 45)" />
  <circle cx="47" cy="37" r="1.5" fill="#ef4444" />
  
  <rect x="70" y="40" width="30" height="22" fill="#fed7aa" transform="rotate(4 85 51)" />
  <circle cx="85" cy="42" r="1.5" fill="#3b82f6" />

  <!-- Wooden Desk Surface -->
  <path d="M 0 150 L 240 150 L 240 240 L 0 240 Z" fill="#0f172a" />
  <rect x="0" y="145" width="240" height="10" fill="#334155" rx="2" />
  <path d="M 0 155 L 240 155 L 240 240 L 0 240 Z" fill="#334155" opacity="0.5" />

  <!-- Desk Lamp on Left -->
  <path d="M 25 150 L 35 150 L 40 110 L 20 110 Z" fill="#64748b" /> <!-- Base -->
  <path d="M 30 150 L 30 100 L 50 75" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" /> <!-- Arm -->
  <path d="M 43 68 L 63 60 L 55 82 Z" fill="#fbbf24" /> <!-- Shade -->
  <ellipse cx="50" cy="115" rx="35" ry="20" fill="url(#lamp-glow)" /> <!-- Light cone -->

  <!-- Desk Props: Pen holder / Pens -->
  <rect x="200" y="130" width="16" height="20" rx="3" fill="#475569" />
  <line x1="205" y1="130" x2="203" y2="118" stroke="#38bdf8" stroke-width="2" />
  <line x1="211" y1="130" x2="213" y2="120" stroke="#ec4899" stroke-width="2" />

  <!-- ================= CHARACTER ================= -->
  <!-- Character Body / Torso (Blue Hoodie) -->
  <path d="M 105 180 C 105 160, 145 160, 145 180 L 155 240 L 95 240 Z" fill="#0284c7" />
  <path d="M 125 170 L 125 240" stroke="#0369a1" stroke-width="2" opacity="0.5" /> <!-- Hoodie zipper line -->
  <path d="M 115 170 C 120 178, 130 178, 135 170" fill="none" stroke="#0369a1" stroke-width="2" /> <!-- Collar -->

  <!-- Character Neck & Head -->
  <rect x="117" y="145" width="16" height="20" fill="#fbcfe8" />
  <!-- Head Base -->
  <circle cx="125" cy="125" r="22" fill="#fbcfe8" />
  
  <!-- Hair (Stylish Dark Brown, Messy/Creative) -->
  <path d="M 103 120 C 102 100, 120 100, 132 102 C 142 104, 148 115, 147 128 C 147 128, 140 115, 130 112 C 120 110, 110 115, 103 120 Z" fill="#331a00" />
  <circle cx="106" cy="124" r="3" fill="#331a00" />

  <!-- Friendly Facial Expression -->
  <circle cx="118" cy="125" r="2" fill="#1e293b" /> <!-- Left eye -->
  <circle cx="132" cy="125" r="2" fill="#1e293b" /> <!-- Right eye -->
  <path d="M 123 133 C 125 135, 127 135, 129 133" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" /> <!-- Smile -->
  <ellipse cx="112" cy="130" rx="3" ry="1.5" fill="#fda4af" opacity="0.6" /> <!-- Blush -->
  <ellipse cx="138" cy="130" rx="3" ry="1.5" fill="#fda4af" opacity="0.6" /> <!-- Blush -->


  <!-- ================= ACTION: STICKING THE PHOTO (粘贴) ================= -->

  <!-- Big Corkboard / Surface on Desk being decorated -->
  <rect x="70" y="150" width="110" height="75" rx="4" fill="#fbbf24" opacity="0.1" />

  <!-- The Photo/Image being pasted (Held by hand and partially attached) -->
  <!-- Drop shadow for realism -->
  <g filter="url(#drop-shadow)">
    <!-- Photo Paper -->
    <polygon points="90,140 145,135 148,185 93,190" fill="#ffffff" />
    <!-- Inner Image graphics (A cute stylized landscape vector inside the photo) -->
    <path d="M 98 175 L 110 160 L 122 172 L 132 155 L 142 178 Z" fill="#34d399" />
    <circle cx="134" cy="148" r="4" fill="#fbbf24" />
    <path d="M 95 180 L 145 175 L 146 182 L 96 187 Z" fill="#f43f5e" opacity="0.7" />
  </g>

  <!-- Glue Stick Tool (Roller / Adhesive dispenser) on Desk -->
  <g transform="translate(60, 185) rotate(-25)">
    <rect x="0" y="0" width="14" height="26" rx="4" fill="#ec4899" />
    <rect x="3" y="-6" width="8" height="8" rx="2" fill="#f472b6" />
    <path d="M 5 -6 L 9 -6 L 10 -10 L 4 -10 Z" fill="#fbcfe8" />
  </g>

  <!-- Left Arm (Resting/Supporting) -->
  <path d="M 105 185 L 85 200 L 70 190" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="70" cy="190" r="6" fill="#fbcfe8" /> <!-- Left Hand -->

  <!-- Right Arm & Hand (Actively Pressing/Sticking the Photo down) -->
  <path d="M 140 180 C 145 170, 155 160, 135 150" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Hand pressing the top corner of the photo -->
  <circle cx="132" cy="144" r="6.5" fill="#fbcfe8" />
  <!-- Thumb pressing down detail -->
  <ellipse cx="135" cy="142" rx="3" ry="2" fill="#f472b6" transform="rotate(-30 135 142)" />

  <!-- Dynamic Motion / Action Sparkles (Indicating the act of pasting/sticking firmly) -->
  <path d="M 125 130 L 122 122" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <path d="M 142 135 L 148 130" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <path d="M 138 123 L 144 118" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="123" cy="140" r="1.5" fill="#fbbf24" />
  <circle cx="145" cy="155" r="1.5" fill="#38bdf8" />

</svg>