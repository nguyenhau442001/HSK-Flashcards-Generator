<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1b2a4a" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Lamp Light Cone -->
    <linearGradient id="lampCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ROOM ENVIRONMENT & BACKGROUND -->
  <!-- Wallpaper Grid Lines / Details -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="60" x2="240" y2="60" />
    <line x1="0" y1="120" x2="240" y2="120" />
    <line x1="60" y1="0" x2="60" y2="140" />
    <line x1="160" y1="0" x2="160" y2="140" />
  </g>

  <!-- Window Showing Late Night Cityscape -->
  <rect x="150" y="20" width="70" height="90" rx="6" fill="#090d16" stroke="#475569" stroke-width="2" />
  <rect x="154" y="24" width="62" height="82" rx="4" fill="url(#nightSky)" />
  
  <!-- Moon & Stars -->
  <circle cx="195" cy="40" r="8" fill="#fef08a" opacity="0.9" />
  <circle cx="170" cy="55" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="185" cy="75" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="165" cy="85" r="1.2" fill="#ffffff" opacity="0.7" />

  <!-- City Skyline through Window -->
  <path d="M154 106 L154 90 L160 90 L160 82 L166 82 L166 106 Z" fill="#1e293b" opacity="0.8" />
  <path d="M166 106 L166 70 L174 70 L174 106 Z" fill="#0f172a" opacity="0.9" />
  <path d="M174 106 L174 85 L182 85 L182 78 L188 78 L188 106 Z" fill="#1e293b" opacity="0.8" />
  <path d="M188 106 L188 65 L198 65 L198 106 Z" fill="#0f172a" opacity="0.9" />
  <path d="M198 106 L198 80 L206 80 L206 106 Z" fill="#1e293b" opacity="0.8" />
  <!-- City Window Lights (Late Night - mostly dark, few on) -->
  <rect x="168" y="75" width="2" height="3" fill="#fbbf24" opacity="0.7" />
  <rect x="171" y="80" width="2" height="3" fill="#fbbf24" opacity="0.7" />
  <rect x="190" y="70" width="2" height="3" fill="#fbbf24" opacity="0.7" />
  <rect x="194" y="85" width="2" height="3" fill="#38bdf8" opacity="0.7" />

  <!-- Wall Clock Showing Late Hour (e.g., 3:00 AM) -->
  <g transform="translate(100, 35)">
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <circle cx="0" cy="0" r="13" fill="#f8fafc" />
    <!-- Clock Hands -->
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="5" y2="3" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="1.5" fill="#ef4444" />
    <!-- Hour ticks -->
    <line x1="0" y1="-11" x2="0" y2="-9" stroke="#64748b" stroke-width="1" />
    <line x1="11" y1="0" x2="9" y2="0" stroke="#64748b" stroke-width="1" />
    <line x1="0" y1="11" x2="0" y2="9" stroke="#64748b" stroke-width="1" />
    <line x1="-11" y1="0" x2="-9" y2="0" stroke="#64748b" stroke-width="1" />
  </g>

  <!-- Bookshelf Background Prop -->
  <rect x="20" y="20" width="35" height="75" rx="3" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="20" y1="45" x2="55" y2="45" stroke="#334155" stroke-width="2" />
  <line x1="20" y1="70" x2="55" y2="70" stroke="#334155" stroke-width="2" />
  <!-- Books on shelf -->
  <rect x="23" y="28" width="6" height="17" rx="1" fill="#ec4899" />
  <rect x="30" y="25" width="5" height="20" rx="1" fill="#38bdf8" />
  <rect x="37" y="30" width="8" height="15" rx="1" fill="#10b981" />
  <rect x="24" y="52" width="7" height="18" rx="1" fill="#fbbf24" />
  <rect x="33" y="50" width="5" height="20" rx="1" fill="#8b5cf6" />

  <!-- DESK SURFACE -->
  <path d="M 0 140 L 240 140 L 240 220 L 0 220 Z" fill="url(#deskGrad)" />
  <rect x="0" y="140" width="240" height="6" fill="#475569" />
  <!-- Desk Edge Highlight -->
  <line x1="0" y1="140" x2="240" y2="140" stroke="#64748b" stroke-width="2" />

  <!-- DESK PROPS: Desk Lamp -->
  <g transform="translate(190, 110)">
    <!-- Lamp Base -->
    <ellipse cx="0" cy="30" rx="12" ry="4" fill="#475569" />
    <!-- Lamp Arm -->
    <path d="M 0 30 L -5 5 L 15 -10" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp Shade -->
    <path d="M 5 -18 L 25 -2 L 30 -10 L 15 -22 Z" fill="#fbbf24" filter="url(#shadow)" />
    <!-- Lamp Bulb / Glow Source -->
    <circle cx="20" cy="-6" r="4" fill="#fff" filter="url(#glow)" />
  </g>

  <!-- Desk Lamp Light Cone Overlay (Blending) -->
  <polygon points="190,104 110,140 200,140" fill="url(#lampCone)" style="mix-blend-mode: screen;" />

  <!-- Coffee Mug / Energy Drink with Steam -->
  <g transform="translate(155, 125)">
    <!-- Steam -->
    <path d="M 5 -12 Q 2 -20 8 -28 T 5 -40" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M 12 -10 Q 15 -18 10 -25 T 14 -35" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite" />
    </path>
    <!-- Mug Body -->
    <rect x="0" y="-12" width="18" height="25" rx="3" fill="#f43f5e" filter="url(#shadow)" />
    <!-- Mug Handle -->
    <path d="M 18 -6 C 24 -6, 24 6, 18 6" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <!-- Coffee Surface -->
    <ellipse cx="9" cy="-12" rx="9" ry="3" fill="#78350f" />
    <!-- Coffee warning/energy icon stripe -->
    <rect x="3" y="-3" width="12" height="6" fill="#ffffff" opacity="0.8" rx="1" />
    <circle cx="9" cy="0" r="2" fill="#e11d48" />
  </g>

  <!-- Stack of Reference Books & Papers -->
  <g transform="translate(30, 128)">
    <rect x="0" y="10" width="45" height="8" rx="2" fill="#3b82f6" filter="url(#shadow)" />
    <rect x="-3" y="4" width="48" height="7" rx="2" fill="#10b981" filter="url(#shadow)" />
    <rect x="2" y="-2" width="40" height="7" rx="2" fill="#f59e0b" filter="url(#shadow)" />
    <!-- Loose papers -->
    <path d="M 45 3 L 58 7 L 55 16 L 42 12 Z" fill="#f8fafc" opacity="0.9" filter="url(#shadow)" />
  </g>

  <!-- MAIN CHARACTER WORKING LATE (Overslept / Exhausted / Late Night Worker) -->
  <g transform="translate(95, 75)">
    <!-- Chair Back -->
    <rect x="-25" y="10" width="20" height="65" rx="6" fill="#334155" filter="url(#shadow)" />
    
    <!-- Character Body (Slouched over desk) -->
    <!-- Hoodie/Shirt Torso -->
    <path d="M -15 35 Q 20 40 45 65 L 10 75 L -10 60 Z" fill="#4f46e5" filter="url(#shadow)" />

    <!-- Head & Hair (Resting on arms / slumped forward) -->
    <!-- Arms crossed on desk -->
    <path d="M -20 50 Q 15 35 45 45 L 40 60 Q 15 50 -15 65 Z" fill="#6366f1" filter="url(#shadow)" />
    
    <!-- Hands / Fingers -->
    <circle cx="-18" cy="58" r="6" fill="#fcd34d" />
    <circle cx="35" cy="52" r="6" fill="#fcd34d" />

    <!-- Head (Tired angle) -->
    <g transform="translate(10, 15)">
      <!-- Hair -->
      <path d="M -18 -5 C -18 -20, 5 -22, 18 -12 C 24 -7, 22 5, 20 10 C 10 15, -10 15, -18 -5 Z" fill="#1e293b" />
      
      <!-- Face Base -->
      <circle cx="2" cy="0" r="14" fill="#fcd34d" />
      
      <!-- Closed / Exhausted Eyes (Heavy droopy lids or tired crescent lines) -->
      <path d="M 3 2 Q 7 6 11 2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M -3 2 Q 1 6 5 2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      
      <!-- Tired Eyebrows (Slanted upward in worry/fatigue) -->
      <line x1="-5" y1="-3" x2="-1" y2="-1" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <line x1="9" y1="-1" x2="13" y2="-3" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

      <!-- Cute Sleep ZZZs floating up -->
      <g transform="translate(15, -15)">
        <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" opacity="0.9">Z</text>
        <text x="8" y="-8" font-family="sans-serif" font-weight="bold" font-size="10" fill="#38bdf8" opacity="0.7">z</text>
        <text x="14" y="-15" font-family="sans-serif" font-weight="bold" font-size="8" fill="#38bdf8" opacity="0.5">z</text>
      </g>
    </g>
  </g>

  <!-- LAPTOP & GLOWING SCREEN (Focal Point) -->
  <g transform="translate(75, 110)">
    <!-- Laptop Base / Keyboard Deck -->
    <path d="M -15 25 L 65 25 L 75 35 L -25 35 Z" fill="#cbd5e1" filter="url(#shadow)" />
    <path d="M -20 35 L 70 35 L 75 38 L -25 38 Z" fill="#94a3b8" />
    <rect x="5" y="28" width="40" height="5" rx="1" fill="#64748b" opacity="0.6" /> <!-- Trackpad -->

    <!-- Laptop Screen (Tilted Back) -->
    <g transform="translate(0, -10)">
      <!-- Screen Outer Frame -->
      <path d="M -15 -2 L 55 -2 L 52 28 L -12 28 Z" fill="#334155" filter="url(#shadow)" />
      <!-- Screen Inner Display -->
      <path d="M -11 1 L 51 1 L 49 25 L -9 25 Z" fill="#0f172a" />
      
      <!-- Screen Glow / Code lines / UI Elements -->
      <rect x="-6" y="5" width="50" height="18" fill="url(#screenGlow)" />
      <!-- Abstract code lines glowing in dark -->
      <line x1="-2" y1="8" x2="18" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="-2" y1="12" x2="32" y2="12" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
      <line x1="-2" y1="16" x2="12" y2="16" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
      <line x1="15" y1="16" x2="38" y2="16" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
      <line x1="-2" y1="20" x2="25" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      
      <!-- Glowing light projection onto the desk & character -->
      <polygon points="-25,35 65,35 55,2 -15,2" fill="#38bdf8" opacity="0.08" style="mix-blend-mode: screen;" />
    </g>
  </g>

  <!-- FOREGROUND ATMOSPHERE / LIGHTING PARTICLES -->
  <circle cx="110" cy="100" r="1.5" fill="#fbbf24" opacity="0.6" filter="url(#glow)" />
  <circle cx="130" cy="85" r="1" fill="#fbbf24" opacity="0.4" />
  <circle cx="60" cy="95" r="1.2" fill="#38bdf8" opacity="0.5" filter="url(#glow)" />
  <circle cx="40" cy="110" r="0.8" fill="#38bdf8" opacity="0.3" />

  <!-- Outer Frame Stroke for Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#475569" stroke-width="2" opacity="0.4" />
</svg>