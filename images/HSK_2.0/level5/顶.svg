<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sky Gradient (Dawn/Peak atmosphere) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Mountain Back Gradient -->
    <linearGradient id="mtnBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mountain Front Gradient (The Peak / 顶) -->
    <linearGradient id="mtnFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Sun / Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Sky -->
  <path d="M 0 0 L 240 0 L 240 180 L 0 180 Z" fill="url(#skyGrad)"/>

  <!-- Glowing Rising Sun behind the Peak -->
  <circle cx="120" cy="110" r="50" fill="url(#sunGlow)"/>

  <!-- Distant Mountains -->
  <path d="M -10 160 L 50 90 L 110 160 Z" fill="url(#mtnBack)" opacity="0.6"/>
  <path d="M 120 160 L 175 80 L 230 160 Z" fill="url(#mtnBack)" opacity="0.8"/>

  <!-- Clouds floating below the peak -->
  <path d="M 30 140 Q 40 130 55 135 Q 70 125 90 135 Q 110 125 125 135 Q 140 130 150 140 Z" fill="#64748b" opacity="0.4"/>
  <path d="M 110 150 Q 125 140 140 145 Q 160 135 180 145 Q 200 138 215 150 Z" fill="#94a3b8" opacity="0.5"/>

  <!-- MAIN SUBJECT: The Peak / Summit (顶 - dǐng) -->
  <!-- Back Slope of Summit -->
  <path d="M 120 45 L 170 190 L 120 190 Z" fill="#475569"/>
  <!-- Front Slope of Summit with Snowcap -->
  <path d="M 120 45 L 70 190 L 170 190 Z" fill="url(#mtnFront)"/>

  <!-- Dramatic Snow/Rock Facet on the Peak -->
  <path d="M 120 45 L 95 95 L 120 85 L 145 100 L 170 190 L 70 190 Z" fill="#64748b" opacity="0.2"/>
  <path d="M 120 45 L 105 80 L 120 70 L 138 85 L 155 120 L 120 190 L 70 190 Z" fill="#f8fafc"/>
  <path d="M 120 45 L 110 72 L 120 65 L 132 75 L 140 90 L 120 70 Z" fill="#e2e8f0"/>

  <!-- Summit Base / Rocky Terrain -->
  <path d="M 30 190 L 210 190 L 220 220 L 20 220 Z" fill="#1e293b"/>
  <path d="M 40 190 L 200 190 L 215 240 L 25 240 Z" fill="#0f172a"/>

  <!-- ACTION & CONTEXT: Adventurer standing triumphantly on the very top (顶) -->
  <!-- Legs -->
  <line x1="114" y1="58" x2="110" y2="72" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <line x1="126" y1="58" x2="130" y2="72" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <!-- Torso & Backpack -->
  <rect x="112" y="42" width="16" height="18" rx="4" fill="#ea580c"/>
  <rect x="108" y="44" width="5" height="14" rx="2" fill="#c2410c"/>
  <!-- Head & Helmet -->
  <circle cx="120" cy="34" r="5" fill="#fde047"/>
  <path d="M 114 33 A 6 6 0 0 1 126 33 Z" fill="#0284c7"/>
  <!-- Raised Arms (Victory) -->
  <path d="M 114 45 L 105 34" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <path d="M 126 45 L 135 34" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

  <!-- Summit Marker / Flag -->
  <line x1="120" y1="45" x2="120" y2="20" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="120,20 138,26 120,32" fill="#ef4444"/>

  <!-- Sparkles / Atmosphere at the peak -->
  <path d="M 90 55 L 93 58 L 90 61 L 87 58 Z" fill="#fef08a"/>
  <path d="M 150 40 L 152 42 L 150 44 L 148 42 Z" fill="#fef08a"/>
  <circle cx="135" cy="50" r="1.5" fill="#ffffff"/>
  <circle cx="100" cy="40" r="1" fill="#ffffff"/>

  <!-- Foreground Atmospheric Vignette / Border Radiance -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
</svg>