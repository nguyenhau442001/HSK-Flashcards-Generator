<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Energy Glow Gradient -->
    <radialGradient id="energyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Boulder Gradient (Main resistance representing challenge) -->
    <linearGradient id="boulderGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Team Member 1 (Lead) -->
    <linearGradient id="suit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Team Member 2 -->
    <linearGradient id="suit2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Team Member 3 -->
    <linearGradient id="suit3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements -->
  <g opacity="0.3">
    <!-- Mountain/Terrain silhouettes in background -->
    <polygon points="0,200 40,150 90,190 150,130 200,170 240,140 240,240 0,240" fill="#1e293b" />
    <!-- Dynamic Light Rays / Sparks -->
    <path d="M120,120 L150,80" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <path d="M120,120 L80,70" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <path d="M120,120 L170,140" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Central Energy Burst (Symbolizing combined strength / 力量) -->
  <circle cx="120" cy="130" r="70" fill="url(#energyGlow)" />

  <!-- Ground Platform -->
  <path d="M 20,205 Q 120,190 220,205 L 235,230 Q 120,240 5,230 Z" fill="url(#groundGrad)" filter="url(#shadow)" />
  <!-- Ground cracks for dynamic tension -->
  <path d="M 90,205 L 105,215 L 100,222" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 150,207 L 140,218 L 146,224" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- The Massive Boulder (Object representing challenge requiring strength) -->
  <g filter="url(#shadow)">
    <path d="M 90,70 Q 130,50 165,75 Q 190,105 180,145 Q 170,185 130,190 Q 90,195 65,160 Q 40,125 65,90 Z" fill="url(#boulderGrad)" />
    <!-- Boulder Texture Details -->
    <path d="M 95,90 Q 115,110 135,95" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 110,135 Q 140,145 155,125" stroke="#334155" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 80,140 Q 95,160 120,155" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
    <!-- Impact highlights on boulder -->
    <circle cx="135" cy="110" r="8" fill="#94a3b8" opacity="0.4" />
    <circle cx="95" cy="120" r="5" fill="#94a3b8" opacity="0.3" />
  </g>

  <!-- TEAM PUSHING THE BOULDER (Depicting 'Đoàn kết chính là sức mạnh' / Teamwork & Strength) -->

  <!-- Character 1 (Left - Orange/Red Suit, straining) -->
  <g transform="translate(35, 115)" filter="url(#shadow)">
    <!-- Legs in pushing stance -->
    <path d="M25,60 L45,85 L35,90" stroke="#e11d48" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M20,60 L5,85 L18,88" stroke="#be123c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Body leaning forward -->
    <path d="M15,35 Q30,50 25,65" fill="none" stroke="url(#suit3)" stroke-width="16" stroke-linecap="round" />
    <!-- Head with headband/hair -->
    <circle cx="8" cy="22" r="10" fill="#fbcfe8" />
    <path d="M -2,20 Q 8,10 18,22" fill="#e11d48" />
    <!-- Arms pushing against boulder -->
    <path d="M18,30 L40,40" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Character 2 (Center - Blue Suit, main power) -->
  <g transform="translate(95, 100)" filter="url(#shadow)">
    <!-- Legs rooted firmly -->
    <path d="M20,70 L35,100 L20,105" stroke="#0284c7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M25,70 L5,98 L18,102" stroke="#0369a1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Torso deeply leaning into boulder -->
    <path d="M15,35 Q30,55 22,75" fill="none" stroke="url(#suit1)" stroke-width="18" stroke-linecap="round" />
    <!-- Head -->
    <circle cx="8" cy="20" r="11" fill="#bae6fd" />
    <!-- Determined Face/Hair -->
    <path d="M -1,16 Q 8,8 17,18" fill="#0284c7" />
    <!-- Arms pushing hard -->
    <path d="M15,30 L45,35" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Character 3 (Right - Green Suit, supporting) -->
  <g transform="translate(155, 110)" filter="url(#shadow)">
    <!-- Legs bracing -->
    <path d="M15,65 L30,90 L20,95" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M25,65 L5,88 L15,92" stroke="#047857" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Body -->
    <path d="M20,35 Q10,50 18,70" fill="none" stroke="url(#suit2)" stroke-width="16" stroke-linecap="round" />
    <!-- Head -->
    <circle cx="22" cy="20" r="10" fill="#a7f3d0" />
    <path d="M 12,18 Q 22,10 32,20" fill="#059669" />
    <!-- Arms -->
    <path d="M18,32 L2,42" stroke="#10b981" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Dynamic Energy Sparks & Aura Effects (Representing 力量 - Power in action) -->
  <g>
    <!-- Glowing energy particles rising around the boulder -->
    <circle cx="75" cy="80" r="3" fill="#fbbf24" filter="url(#shadow)" />
    <circle cx="165" cy="70" r="4" fill="#f59e0b" filter="url(#shadow)" />
    <circle cx="130" cy="50" r="2" fill="#38bdf8" filter="url(#shadow)" />
    <circle cx="50" cy="140" r="2.5" fill="#10b981" filter="url(#shadow)" />
    <circle cx="185" cy="120" r="3.5" fill="#f43f5e" filter="url(#shadow)" />
    
    <!-- Action lines / shockwaves -->
    <path d="M 50,75 Q 40,70 30,73" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M 180,65 Q 190,60 200,68" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M 30,165 Q 20,160 15,170" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Foreground Atmospheric Vignette / Border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>