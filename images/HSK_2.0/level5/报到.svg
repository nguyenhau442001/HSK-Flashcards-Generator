<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for Gradients & Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window City Light -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: School Registration Office -->
  <!-- Background Wall Details -->
  <rect x="0" y="0" width="240" height="150" fill="#1e293b" />
  
  <!-- Notice Board on Wall -->
  <rect x="25" y="30" width="55" height="45" rx="3" fill="#334155" />
  <rect x="30" y="35" width="45" height="35" fill="#f1f5f9" />
  <!-- Abstract colorful papers on notice board -->
  <rect x="34" y="40" width="15" height="12" fill="#fb923c" rx="1" />
  <rect x="53" y="40" width="18" height="16" fill="#38bdf8" rx="1" />
  <rect x="34" y="55" width="20" height="11" fill="#10b981" rx="1" />
  
  <!-- Window with night city glow -->
  <rect x="165" y="25" width="50" height="65" rx="6" fill="#0f172a" />
  <rect x="170" y="30" width="40" height="55" rx="4" fill="url(#windowGrad)" />
  <!-- Window Frame Cross -->
  <line x1="190" y1="30" x2="190" y2="85" stroke="#334155" stroke-width="2" />
  <line x1="170" y1="57" x2="210" y2="57" stroke="#334155" stroke-width="2" />
  <!-- Plant on Window Sill -->
  <path d="M185,75 Q190,65 195,75 Z" fill="#10b981" />
  <rect x="180" y="75" width="20" height="8" rx="2" fill="#cbd5e1" />

  <!-- Hanging Pendent Light -->
  <line x1="110" y1="0" x2="110" y2="40" stroke="#475569" stroke-width="2" />
  <path d="M95,40 L125,40 L135,55 L85,55 Z" fill="#fbbf24" filter="url(#softShadow)" />
  <circle cx="110" cy="57" r="6" fill="#fef08a" />
  <circle cx="110" cy="57" r="60" fill="url(#lampGlow)" pointer-events="none" />

  <!-- Registration Counter / Desk -->
  <path d="M10,150 L230,150 L220,210 L20,210 Z" fill="#334155" filter="url(#softShadow)" />
  <!-- Desk Wood Top Edge -->
  <rect x="10" y="145" width="220" height="8" rx="4" fill="#475569" />
  <!-- Desk Front Panel Detail -->
  <rect x="30" y="165" width="180" height="30" rx="4" fill="#1e293b" opacity="0.5" />

  <!-- PROPS ON DESK -->
  <!-- Laptop on desk (Staff side) -->
  <path d="M165,135 L195,135 L205,150 L155,150 Z" fill="#cbd5e1" />
  <rect x="160" y="115" width="38" height="22" rx="2" fill="#64748b" />
  <rect x="163" y="118" width="32" height="16" fill="#38bdf8" opacity="0.3" />

  <!-- Document Stack / Registration Forms -->
  <g transform="translate(115, 138) rotate(-5)">
    <rect x="0" y="0" width="30" height="20" rx="1" fill="#f8fafc" />
    <line x1="5" y1="5" x2="25" y2="5" stroke="#cbd5e1" stroke-width="2" />
    <line x1="5" y1="10" x2="20" y2="10" stroke="#cbd5e1" stroke-width="2" />
    <line x1="5" y1="15" x2="15" y2="15" stroke="#38bdf8" stroke-width="2" />
  </g>
  <g transform="translate(120, 142) rotate(3)">
    <rect x="0" y="0" width="30" height="20" rx="1" fill="#e2e8f0" />
    <circle cx="23" cy="10" r="4" fill="#ef4444" opacity="0.8" />
  </g>

  <!-- Pen Stand with Pens -->
  <rect x="195" y="132" width="12" height="18" rx="3" fill="#cbd5e1" />
  <line x1="198" y1="132" x2="193" y2="120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="204" y1="132" x2="208" y2="118" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />


  <!-- MAIN CHARACTER: New Student Registering -->
  <g id="new-student" filter="url(#softShadow)">
    <!-- Body / Torso (leaning forward) -->
    <path d="M75,155 Q85,130 110,135 L125,175 Q100,185 75,155 Z" fill="#38bdf8" />
    <!-- Collar / Backpack strap -->
    <path d="M85,133 L95,145 L90,150 L80,138 Z" fill="#f8fafc" />
    <path d="M82,135 L68,165" stroke="#0f172a" stroke-width="6" stroke-linecap="round" opacity="0.3" /> <!-- Backpack strap shadow -->

    <!-- Head & Face -->
    <circle cx="70" cy="115" r="18" fill="#ffedd5" />
    <!-- Hair (Stylish dark stylized hair) -->
    <path d="M53,115 Q52,95 72,95 Q90,95 88,110 Q80,105 70,105 Q58,105 53,115 Z" fill="#1e293b" />
    <path d="M53,115 Q50,122 56,125 Z" fill="#1e293b" />

    <!-- Facial Expression (Eager, smiling, eyes crinkled) -->
    <!-- Eye -->
    <path d="M68,113 Q72,110 76,113" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheek -->
    <circle cx="74" cy="118" r="3" fill="#fda4af" opacity="0.6" />
    <!-- Big Friendly Smile -->
    <path d="M69,122 Q74,127 79,122" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Right Arm Reaching Forward (Signing / Presenting Document) -->
    <path d="M100,140 Q120,130 135,145 L135,153 Q120,145 105,155 Z" fill="#38bdf8" />
    <!-- Hand holding pen / pointing down to register -->
    <circle cx="138" cy="148" r="4" fill="#ffedd5" />
    <line x1="138" y1="148" x2="148" y2="155" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" /> <!-- Pen -->
  </g>


  <!-- SECOND CHARACTER: Registration Staff (Behind the desk) -->
  <g id="staff" filter="url(#softShadow)">
    <!-- Staff Body -->
    <rect x="45" y="110" width="40" height="50" rx="8" fill="#10b981" />
    <path d="M55,110 L65,125 L75,110 Z" fill="#f8fafc" /> <!-- Collar -->

    <!-- Staff Head -->
    <circle cx="65" cy="85" r="16" fill="#fde68a" />
    <!-- Staff Hair (Neat bun/bob) -->
    <path d="M49,85 Q48,68 65,68 Q82,68 81,85 Q75,78 65,78 Q55,78 49,85 Z" fill="#334155" />
    <circle cx="65" cy="65" r="6" fill="#334155" />

    <!-- Staff Facial Expression (Welcoming, professional) -->
    <path d="M60,83 Q63,81 66,83" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M60,89 Q63,92 66,89" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" /> <!-- Smile -->

    <!-- Staff Arm Welcoming/Guiding -->
    <path d="M75,115 Q95,125 90,145" stroke="#10b981" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="90" cy="145" r="4" fill="#fde68a" />
  </g>

  <!-- FOREGROUND PROPS & DETAILS -->
  <!-- Foreground clipboard/form being filled out -->
  <g transform="translate(85, 145) rotate(10)" filter="url(#softShadow)">
    <rect x="0" y="0" width="45" height="55" rx="3" fill="#cbd5e1" /> <!-- Clipboard base -->
    <rect x="3" y="3" width="39" height="49" rx="2" fill="#ffffff" /> <!-- Paper -->
    <!-- Clip -->
    <rect x="15" y="-3" width="15" height="6" rx="2" fill="#64748b" />
    <!-- Form lines -->
    <line x1="8" y1="12" x2="30" y2="12" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="22" x2="35" y2="22" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="30" x2="25" y2="30" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="38" x2="32" y2="38" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <!-- Checkmark representing completed registration -->
    <path d="M12,46 L16,50 L26,40" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Dynamic Action Sparks/Glow for successful registration -->
  <g transform="translate(100, 120)">
    <circle cx="0" cy="0" r="2" fill="#fbbf24" />
    <circle cx="15" cy="-10" r="3" fill="#38bdf8" />
    <circle cx="-10" cy="15" r="2" fill="#10b981" />
    <path d="M5,-15 L8,-20 M-15,-5 L-20,-8" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>

</svg>