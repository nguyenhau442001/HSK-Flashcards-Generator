<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Table/Surface Gradient -->
    <linearGradient id="surfaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Metallic Kettle Gradient -->
    <linearGradient id="kettleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="kettleDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Cup Gradient -->
    <linearGradient id="cupGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Boiling Water Inner Gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter for Steam and Heat -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light Circle behind Kettle -->
  <circle cx="110" cy="120" r="70" fill="#fb923c" opacity="0.12" filter="url(#glow)"/>
  <circle cx="175" cy="145" r="30" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>

  <!-- Wooden/Modern Surface -->
  <path d="M 0 170 Q 120 160 240 170 L 240 240 L 0 240 Z" fill="url(#surfaceGrad)"/>
  <!-- Surface Highlight Line -->
  <path d="M 0 170 Q 120 160 240 170" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>

  <!-- Coaster under Mug -->
  <ellipse cx="175" cy="175" rx="22" ry="7" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

  <!-- BACKGROUND PROP: Bamboo Tea Tray / Mat -->
  <rect x="70" y="165" width="80" height="12" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
  <line x1="85" y1="171" x2="135" y2="171" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- STEAM & HEAT EFFECTS (Vivid Action/Context) -->
  <g filter="url(#glow)">
    <!-- Steam from Spout -->
    <path d="M 72 90 Q 60 75 65 55 Q 70 40 55 25" fill="none" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 78 85 Q 70 70 75 50 Q 80 35 70 20" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Steam from Cup -->
    <path d="M 168 120 Q 160 105 165 90 Q 170 75 162 60" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 182 125 Q 190 110 185 95 Q 180 80 188 65" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Boiling Bubbles Rising in Cup -->
  <circle cx="170" cy="135" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="178" cy="142" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="173" cy="148" r="2" fill="#ffffff" opacity="0.7"/>
  <path d="M 165 140 Q 175 130 185 140" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>

  <!-- MAIN OBJECT 1: Modern Electric Kettle / Stainless Steel Kettle -->
  <!-- Kettle Base -->
  <path d="M 80 167 L 130 167 L 124 175 L 86 175 Z" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <ellipse cx="105" cy="167" rx="25" ry="4" fill="#334155"/>

  <!-- Kettle Body -->
  <path d="M 82 110 C 72 130 75 155 86 167 L 124 167 C 135 155 138 130 128 110 Z" fill="url(#kettleGrad)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Kettle Water Level Window (Glowing Warm Orange for Boiling) -->
  <path d="M 101 130 C 100 140 100 150 101 155 C 104 155 104 140 101 130 Z" fill="#fb923c" filter="url(#glow)"/>
  <path d="M 101 130 C 100 140 100 150 101 155 C 104 155 104 140 101 130 Z" fill="#fef08a"/>

  <!-- Kettle Rim / Top Band -->
  <ellipse cx="105" cy="110" rx="23" ry="6" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Kettle Lid -->
  <ellipse cx="105" cy="105" rx="18" ry="4" fill="url(#kettleDark)"/>
  <circle cx="105" cy="98" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>

  <!-- Kettle Handle -->
  <path d="M 125 118 C 148 120 148 152 123 160" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M 125 118 C 148 120 148 152 123 160" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Kettle Spout -->
  <path d="M 85 113 C 65 108 62 92 73 85 C 75 83 78 87 75 90 C 70 95 73 105 87 113 Z" fill="url(#kettleGrad)" stroke="#94a3b8" stroke-width="1"/>
  <!-- Spout Opening Highlight -->
  <ellipse cx="73" cy="87" rx="2" ry="1.5" fill="#1e293b" transform="rotate(-30 73 87)"/>

  <!-- Boiling Indicator Light on Kettle Base -->
  <circle cx="105" cy="162" r="2.5" fill="#ef4444" filter="url(#glow)"/>

  <!-- MAIN OBJECT 2: Vibrant Ceramic Mug filled with Boiling Water -->
  <!-- Mug Handle -->
  <path d="M 190 135 C 210 138 210 162 190 165" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
  <path d="M 190 135 C 205 138 205 162 190 165" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mug Body -->
  <path d="M 155 125 L 195 125 C 195 125 190 170 188 175 C 185 180 165 180 162 175 C 160 170 155 125 155 125 Z" fill="url(#cupGrad)" stroke="#e0f2fe" stroke-width="1"/>

  <!-- Mug Opening (Ellipse showing boiling water inside) -->
  <ellipse cx="175" cy="125" rx="20" ry="6" fill="#0284c7" stroke="#bae6fd" stroke-width="1"/>
  <ellipse cx="175" cy="125" rx="17" ry="4.5" fill="url(#waterGrad)"/>

  <!-- Tiny Boiling Bubbles on Water Surface inside Mug -->
  <circle cx="171" cy="124" r="1.2" fill="#ffffff"/>
  <circle cx="178" cy="126" r="0.8" fill="#ffffff"/>
  <circle cx="175" cy="123" r="1" fill="#ffffff"/>

  <!-- Mug Inner Shadow / Rim Depth -->
  <path d="M 157 125 C 157 129 193 129 193 125" fill="none" stroke="#0369a1" stroke-width="1.5"/>

  <!-- Modern Decorative Element on Mug (Subtle geometric wave, NO TEXT) -->
  <path d="M 163 145 Q 175 152 187 145" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 165 153 Q 175 160 185 153" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Foreground Atmospheric Sparks / Heat Shimmers (Golden/Amber) -->
  <circle cx="130" cy="95" r="1.5" fill="#fbbf24" opacity="0.8" filter="url(#glow)"/>
  <circle cx="95" cy="65" r="2" fill="#f59e0b" opacity="0.9" filter="url(#glow)"/>
  <circle cx="155" cy="85" r="1" fill="#fbbf24" opacity="0.7" filter="url(#glow)"/>
  <circle cx="60" cy="110" r="1.5" fill="#f8fafc" opacity="0.6"/>

</svg>