<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Plant Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Teal/Cyan Crystal Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Magenta/Pink Vibrant Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Window Pane Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Ambient Room Background Elements -->
  <!-- Back Wall & Floor Line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#090d16" opacity="0.6" />

  <!-- Geometric Arched Window in Background -->
  <path d="M35 120 L35 75 C35 55 50 40 70 40 C90 40 105 55 105 75 L105 120 Z" fill="url(#windowGlow)" stroke="#334155" stroke-width="2" />
  <line x1="70" y1="40" x2="70" y2="120" stroke="#334155" stroke-width="1.5" />
  <line x1="35" y1="80" x2="105" y2="80" stroke="#334155" stroke-width="1.5" />

  <!-- Floating Ambient Particles (Magical Touch) -->
  <circle cx="28" cy="95" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="115" cy="55" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="210" cy="70" r="1" fill="#f472b6" opacity="0.7" />
  <circle cx="195" cy="140" r="1.5" fill="#fbbf24" opacity="0.5" />

  <!-- Secondary Background Props: Minimalist Floating Shelf -->
  <rect x="155" y="110" href="#" width="60" height="4" rx="2" fill="#475569" />
  <!-- Small quirky sculpture on shelf -->
  <path d="M175 110 L175 95 C175 90 185 90 185 95 L185 110 Z" fill="#10b981" />
  <circle cx="180" cy="87" r="5" fill="#f472b6" />

  <!-- MAIN SUBJECT: The Unique Sculptural Terrarium / Art Piece on a Pedestal -->
  
  <!-- Wooden Pedestal Table -->
  <!-- Table Top (Ellipse) -->
  <ellipse cx="100" cy="180" rx="45" ry="12" fill="#334155" stroke="#475569" stroke-width="2" />
  <!-- Table Base/Legs (Perspective lines) -->
  <path d="M70 180 L60 215 L75 215 L85 183 Z" fill="#1e293b" />
  <path d="M130 180 L140 215 L125 215 L115 183 Z" fill="#1e293b" />
  <ellipse cx="100" cy="215" rx="35" ry="6" fill="#1e293b" />

  <!-- Terrarium Glass Container (Asymmetric, Unique Shape) -->
  <!-- Base glow inside -->
  <ellipse cx="100" cy="165" rx="22" ry="6" fill="#10b981" opacity="0.3" />
  
  <!-- Soil layer -->
  <path d="M 82 170 C 82 170 90 174 100 174 C 110 174 118 170 118 170 L 122 177 C 122 177 112 181 100 181 C 88 181 78 177 78 177 Z" fill="#451a03" />

  <!-- The Unique Twisted Crystal/Plant (Main Focal Point) -->
  <!-- Central Stem -->
  <path d="M100 174 C 95 155 112 140 100 120 C 90 105 105 90 100 75" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Unique Geometric Floating Leaves / Crystals -->
  <!-- Leaf 1 (Teal diamond) -->
  <path d="M 100 145 L 118 138 L 108 128 Z" fill="url(#cyanGrad)" />
  <path d="M 100 145 L 118 138 L 108 128 Z" stroke="#0ea5e9" stroke-width="0.5" fill="none" />

  <!-- Leaf 2 (Pink asymmetrical polygon) -->
  <path d="M 102 115 L 82 105 L 92 95 Z" fill="url(#pinkGrad)" />
  <path d="M 102 115 L 82 105 L 92 95 Z" stroke="#fda4af" stroke-width="0.5" fill="none" />

  <!-- Leaf 3 (Gold top sprout) -->
  <path d="M 100 75 C 112 70 115 85 100 85 C 85 85 88 70 100 75 Z" fill="url(#goldGrad)" />

  <!-- Floating geometric ring around the plant (Adds to 'unique/modern' vibe) -->
  <ellipse cx="100" cy="125" rx="18" ry="7" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-25 100 125)" opacity="0.8" />
  <ellipse cx="100" cy="100" rx="12" ry="5" fill="none" stroke="#f472b6" stroke-width="1.5" transform="rotate(35 100 100)" opacity="0.8" />

  <!-- Glass Bell Jar / Dome (Over the unique plant) -->
  <path d="M 72 177 
           C 65 170 62 145 68 120 
           C 74 95 85 70 100 60 
           C 115 70 126 95 132 120 
           C 138 145 135 170 128 177 Z" 
        fill="#38bdf8" fill-opacity="0.06" 
        stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Glass Dome Highlights (Reflections) -->
  <!-- Primary curved highlight -->
  <path d="M 75 140 C 72 120 78 95 90 75" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <!-- Secondary small reflection -->
  <path d="M 120 110 C 123 125 120 140 115 155" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.2" />
  <!-- Dome Top Handle/Knob -->
  <circle cx="100" cy="58" r="4" fill="#64748b" />
  <circle cx="99" cy="57" r="1.5" fill="#cbd5e1" />

  <!-- Foreground Atmospheric Elements (Depth of Field) -->
  <!-- A small out-of-focus accent prop on the right table edge -->
  <circle cx="130" cy="175" r="5" fill="#f59e0b" />
  <circle cx="130" cy="175" r="2" fill="#fef3c7" opacity="0.8" />

  <!-- Framing / Vignette Overlay for App UI Integration (Subtle Soft Border) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" />
</svg>