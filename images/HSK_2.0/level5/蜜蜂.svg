<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Garden Glow Gradient -->
    <radialGradient id="garden-glow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Flower 1 Gradient (Pink) -->
    <linearGradient id="petal-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Flower 2 Gradient (Yellow/Orange) -->
    <linearGradient id="petal-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#garden-glow)" />

  <!-- Background Environment & Foliage -->
  <g id="background-elements">
    <!-- Moon / Atmospheric Light -->
    <circle cx="190" cy="50" r="18" fill="#fbbf24" opacity="0.15" />
    <circle cx="190" cy="50" r="12" fill="#fbbf24" opacity="0.25" />

    <!-- Bush Silhouettes -->
    <path d="M-10 220 Q 20 180, 50 190 Q 80 170, 110 195 Q 150 175, 190 190 Q 220 175, 250 220 Z" fill="#064e3b" opacity="0.6" />
    <path d="M20 240 Q 60 200, 100 215 Q 140 195, 180 220 Q 210 205, 260 240 Z" fill="#047857" opacity="0.8" />
  </g>

  <!-- Main Flowers (The Garden) -->
  <g id="flowers">
    <!-- Left Flower (Yellow) -->
    <g transform="translate(45, 175)">
      <!-- Stem -->
      <path d="M15 50 Q 5 25, 10 0" stroke="#059669" stroke-width="4" stroke-linecap="round" fill="none" />
      <!-- Leaves -->
      <path d="M10 30 Q -5 20, 2 10 Q 12 18, 10 30 Z" fill="#10b981" />
      <!-- Petals -->
      <circle cx="-10" cy="-5" r="8" fill="url(#petal-yellow)" />
      <circle cx="10" cy="-15" r="8" fill="url(#petal-yellow)" />
      <circle cx="25" cy="0" r="8" fill="url(#petal-yellow)" />
      <circle cx="15" cy="12" r="8" fill="url(#petal-yellow)" />
      <circle cx="-2" cy="10" r="8" fill="url(#petal-yellow)" />
      <!-- Center -->
      <circle cx="8" cy="0" r="6" fill="#78350f" />
    </g>

    <!-- Center-Right Large Flower (Pink) -->
    <g transform="translate(140, 160)">
      <!-- Stem -->
      <path d="M10 70 Q 20 35, 15 0" stroke="#059669" stroke-width="5" stroke-linecap="round" fill="none" />
      <!-- Leaves -->
      <path d="M15 45 Q 30 30, 25 20 Q 15 30, 15 45 Z" fill="#10b981" />
      <path d="M12 55 Q -2 45, 2 35 Q 10 42, 12 55 Z" fill="#059669" />
      <!-- Petals -->
      <g transform="translate(15, -5)">
        <circle cx="0" cy="-16" r="11" fill="url(#petal-pink)" />
        <circle cx="15" cy="-10" r="11" fill="url(#petal-pink)" />
        <circle cx="16" cy="8" r="11" fill="url(#petal-pink)" />
        <circle cx="0" cy="15" r="11" fill="url(#petal-pink)" />
        <circle cx="-15" cy="8" r="11" fill="url(#petal-pink)" />
        <circle cx="-15" cy="-10" r="11" fill="url(#petal-pink)" />
        <!-- Center -->
        <circle cx="0" cy="0" r="9" fill="#fef08a" />
        <circle cx="0" cy="0" r="6" fill="#eab308" />
      </g>
    </g>
  </g>

  <!-- Character: Curious Child / Observer -->
  <g id="character" transform="translate(75, 110)">
    <!-- Body & Hoodie -->
    <path d="M25 75 Q 15 95, 5 130 L 75 130 Q 65 95, 55 75 Z" fill="#38bdf8" />
    <!-- Hoodie Pocket / Details -->
    <path d="M30 110 L 50 110 L 48 125 L 32 125 Z" fill="#0284c7" opacity="0.5" />
    
    <!-- Neck -->
    <rect x="34" y="65" width="12" height="15" fill="url(#skin)" />

    <!-- Head -->
    <circle cx="40" cy="45" r="22" fill="url(#skin)" />
    
    <!-- Hair -->
    <path d="M 18 45 Q 20 20, 40 22 Q 62 20, 60 45 Q 55 30, 40 28 Q 25 30, 18 45 Z" fill="#334155" />
    <circle cx="18" cy="42" r="5" fill="#334155" />
    <circle cx="60" cy="42" r="5" fill="#334155" />

    <!-- Facial Expression (Wonder / Happy) -->
    <!-- Eyes (closed happy arches) -->
    <path d="M 30 42 Q 33 37, 36 42" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 44 42 Q 47 37, 50 42" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Cheeks (Blush) -->
    <circle cx="28" cy="47" r="4" fill="#f43f5e" opacity="0.4" />
    <circle cx="52" cy="47" r="4" fill="#f43f5e" opacity="0.4" />
    <!-- Smiling Mouth -->
    <path d="M 36 51 Q 40 56, 44 51" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Arms & Pointing Gesture -->
    <!-- Left Arm (resting) -->
    <path d="M 20 78 Q 10 95, 15 110" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none" />
    <circle cx="15" cy="110" r="5" fill="url(#skin)" />

    <!-- Right Arm (Pointing up towards the bee) -->
    <path d="M 60 78 Q 75 70, 85 55" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Pointing Hand & Finger -->
    <circle cx="87" cy="52" r="5" fill="url(#skin)" />
    <path d="M 89 49 L 95 44" stroke="url(#skin)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Flowers & Grass Blades -->
  <g id="foreground-plants">
    <!-- Small grass silhouettes -->
    <path d="M10 240 L12 210 L16 240 Z" fill="#047857" />
    <path d="M220 240 L225 215 L230 240 Z" fill="#047857" />
    <path d="M230 240 L235 220 L238 240 Z" fill="#059669" />
    
    <!-- Little Foreground Flower -->
    <g transform="translate(210, 200)">
      <path d="M5 40 Q 0 20, 5 0" stroke="#059669" stroke-width="3" fill="none" />
      <circle cx="0" cy="-5" r="6" fill="url(#petal-pink)" />
      <circle cx="10" cy="-5" r="6" fill="url(#petal-pink)" />
      <circle cx="5" cy="4" r="6" fill="url(#petal-pink)" />
      <circle cx="5" cy="-2" r="4" fill="#fef08a" />
    </g>
  </g>

  <!-- THE HERO: Mìfēng (The Bee) & Flight Trail -->
  <g id="bee-and-flight">
    <!-- Dotted Flight Path (Curved motion line) -->
    <path d="M 155 75 Q 165 55, 135 45 Q 115 38, 125 55" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Bee Group centered around (135, 45) -->
    <g transform="translate(135, 45)">
      <!-- Motion / Wing blur effect -->
      <ellipse cx="-2" cy="-8" rx="6" ry="3" fill="#ffffff" opacity="0.7" transform="rotate(-20 -2 -8)" />
      <ellipse cx="6" cy="-8" rx="6" ry="3" fill="#ffffff" opacity="0.7" transform="rotate(20 6 -8)" />

      <!-- Bee Body (Stripe Abdomen) -->
      <ellipse cx="0" cy="4" rx="10" ry="13" fill="#fbbf24" transform="rotate(15)" />
      <!-- Stripes -->
      <path d="M -6 -1 L 5 3" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
      <path d="M -8 5 L 3 9" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

      <!-- Thorax & Head -->
      <circle cx="-2" cy="-7" r="8" fill="#1e293b" />
      <circle cx="-6" cy="-12" r="6" fill="#fbbf24" />

      <!-- Cute Eyes -->
      <circle cx="-8" cy="-13" r="1.5" fill="#ffffff" />
      <circle cx="-8" cy="-13" r="0.8" fill="#0f172a" />

      <!-- Antennae -->
      <path d="M -10 -16 Q -14 -20, -12 -23" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M -6 -17 Q -8 -22, -5 -24" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <!-- Stinger -->
      <path d="M 5 15 L 7 19 L 2 16 Z" fill="#1e293b" />
    </g>
  </g>

  <!-- Sparkles / Pollen / Magic Atmosphere -->
  <g id="sparkles">
    <circle cx="115" cy="55" r="2" fill="#fef08a" opacity="0.8" />
    <circle cx="150" cy="35" r="1.5" fill="#fef08a" opacity="0.6" />
    <circle cx="125" cy="25" r="2.5" fill="#fef08a" opacity="0.9" />
    <circle cx="165" cy="65" r="1.5" fill="#fef08a" opacity="0.7" />
    <!-- Sparkle star shape -->
    <path d="M 152 25 L 154 20 L 156 25 L 161 27 L 156 29 L 154 34 L 152 29 L 147 27 Z" fill="#fde047" opacity="0.8" transform="scale(0.5) translate(160, 20)" />
  </g>
</svg>