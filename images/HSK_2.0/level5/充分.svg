<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Light Cone -->
    <linearGradient id="light-cone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Backpack Gradients -->
    <linearGradient id="bag-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bag-pocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    
    <!-- Warm Accent Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background glow representing 'preparedness/abundance' -->
  <circle cx="120" cy="110" r="90" fill="url(#glow)" />
  
  <!-- Light beam from top -->
  <polygon points="120,0 60,200 180,200" fill="url(#light-cone)" />

  <!-- Back floor / surface -->
  <ellipse cx="120" cy="195" rx="90" ry="15" fill="#0f172a" opacity="0.8" />
  
  <!-- Surface Platform (Wooden desk/table) -->
  <path d="M 30,190 L 210,190 L 195,215 L 45,215 Z" fill="#334155" />
  <path d="M 30,190 L 210,190 L 208,193 L 32,193 Z" fill="#475569" />

  <!-- SCENE: OPEN ADVENTURE BACKPACK FILLED TO THE BRIM (Representing '充分' - Fully Prepared, Complete) -->
  <g filter="url(#shadow)">
    <!-- Back Straps -->
    <path d="M 90,90 Q 70,120 75,150" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <path d="M 150,90 Q 170,120 165,150" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />

    <!-- Backpack Main Body (Bulging outward with items) -->
    <path d="M 75,100 Q 60,140 70,185 Q 120,195 170,185 Q 180,140 165,100 Q 120,80 75,100 Z" fill="url(#bag-body)" />

    <!-- Side Pockets -->
    <path d="M 62,130 Q 52,145 62,170 Q 75,175 75,150 Q 72,135 62,130 Z" fill="#0284c7" />
    <path d="M 178,130 Q 188,145 178,170 Q 165,175 165,150 Q 168,135 178,130 Z" fill="#0284c7" />

    <!-- Front Pocket (Stuffed) -->
    <path d="M 85,140 Q 120,135 155,140 Q 160,175 120,180 Q 80,175 85,140 Z" fill="url(#bag-pocket)" />
    <!-- Front Pocket Zipper/Details -->
    <path d="M 90,145 Q 120,142 150,145" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" />
    <!-- Compass/Gadget on pocket -->
    <circle cx="120" cy="160" r="10" fill="#f8fafc" />
    <circle cx="120" cy="160" r="7" fill="#38bdf8" />
    <polygon points="120,154 122,160 120,166 118,160" fill="#ef4444" />

    <!-- OVERFLOWING ITEMS (The essence of '充分' - complete abundance, fully packed) -->
    
    <!-- Rolled Sleeping Pad / Tent on top -->
    <rect x="75" y="85" width="90" height="22" rx="11" fill="#10b981" />
    <rect x="75" y="85" width="90" height="22" rx="11" fill="url(#glow)" opacity="0.3"/>
    <!-- Straps on sleeping pad -->
    <rect x="95" y="85" width="8" height="22" fill="#047857" />
    <rect x="135" y="85" width="8" height="22" fill="#047857" />

    <!-- Water Bottle (Blue with highlight) -->
    <path d="M 145,70 L 157,70 L 157,110 L 145,110 Z" fill="#38bdf8" rx="3" />
    <path d="M 148,65 L 154,65 L 154,70 L 148,70 Z" fill="#cbd5e1" />
    <path d="M 147,80 L 155,80" stroke="#bae6fd" stroke-width="3" />

    <!-- Rolled Map / Scroll sticking out -->
    <circle cx="100" cy="72" r="8" fill="#fef3c7" />
    <path d="M 100,64 L 140,55 L 143,63 L 103,72 Z" fill="#fde68a" />
    <circle cx="140" cy="59" r="8" fill="#fef3c7" />
    <path d="M 118,60 L 125,75" stroke="#b45309" stroke-width="2" />

    <!-- Glowing Flashlight / Tool -->
    <rect x="80" y="75" width="14" height="30" rx="3" transform="rotate(-15 87 90)" fill="#f59e0b" />
    <rect x="78" y="72" width="18" height="8" rx="3" transform="rotate(-15 87 76)" fill="#ef4444" />
    <!-- Flashlight Beam Effect -->
    <path d="M 70,60 L 40,40 L 55,30 Z" fill="#fbbf24" opacity="0.6" />

    <!-- Snacks / Energy Bars packed neatly -->
    <rect x="110" y="82" width="16" height="20" rx="2" fill="#ec4899" />
    <path d="M 110,92 L 126,92" stroke="#fbcfe8" stroke-width="2" />

    <!-- Notebook / Journal -->
    <polygon points="125,85 140,80 145,95 130,100" fill="#6366f1" />
    <line x1="128" y1="90" x2="141" y2="86" stroke="#c7d2fe" stroke-width="2" />

  </g>

  <!-- Foreground Dynamic Sparkles / Energy Dots (Highlighting readiness and completion) -->
  <circle cx="50" cy="110" r="4" fill="#fbbf24" />
  <circle cx="60" cy="100" r="2" fill="#f59e0b" />
  
  <circle cx="190" cy="95" r="5" fill="#38bdf8" />
  <circle cx="180" cy="85" r="2" fill="#7dd3fc" />

  <circle cx="120" cy="40" r="3" fill="#fbbf24" />
  <path d="M 120,32 L 122,38 L 128,40 L 122,42 L 120,48 L 118,42 L 112,40 L 118,38 Z" fill="#fbbf24" />

  <circle cx="45" cy="170" r="3" fill="#10b981" />
  <circle cx="195" cy="165" r="4" fill="#ec4899" />

  <!-- Interactive/Action Checkmark subtle badge in corner to reinforce 'sufficient/complete' -->
  <g transform="translate(195, 30)">
    <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.9" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#34d399" stroke-width="2" />
    <path d="M -5,-1 L -1,4 L 6,-4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

</svg>