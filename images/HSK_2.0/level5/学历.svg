<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Deep Slate Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="shelf-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <clipPath id="avatar-clip">
      <circle cx="120" cy="95" r="28" />
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT: Modern Study / Academic Office Background -->
  <!-- Large Window showing subtle night cityscape -->
  <path d="M 45 40 L 195 40 L 195 110 L 45 110 Z" fill="url(#window-glow)" rx="4"/>
  <path d="M 120 40 L 120 110 M 45 75 L 195 75" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <!-- City skyline silhouettes through window -->
  <path d="M 55 110 L 55 90 L 65 90 L 65 110 M 70 110 L 70 80 L 85 80 L 85 110 M 90 110 L 90 85 L 100 85 L 100 110 M 150 110 L 150 70 L 165 70 L 165 110 M 170 110 L 170 85 L 185 85 L 185 110" fill="#1e293b" opacity="0.6"/>
  
  <!-- Bookshelf Background Elements representing high education/learning -->
  <rect x="25" y="100" width="30" height="85" rx="2" fill="#334155" opacity="0.4"/>
  <line x1="25" y1="125" x2="55" y2="125" stroke="#1e293b" stroke-width="2"/>
  <line x1="25" y1="150" x2="55" y2="150" stroke="#1e293b" stroke-width="2"/>

  <rect x="185" y="100" width="30" height="85" rx="2" fill="#334155" opacity="0.4"/>
  <line x1="185" y1="125" x2="215" y2="125" stroke="#1e293b" stroke-width="2"/>
  <line x1="185" y1="150" x2="215" y2="150" stroke="#1e293b" stroke-width="2"/>

  <!-- Warm Accent Lighting from Top Shelf -->
  <path d="M 25 100 L 215 100 L 215 130 L 25 130 Z" fill="url(#shelf-glow)" />

  <!-- MAIN DESK -->
  <rect x="30" y="180" width="180" height="12" rx="3" fill="#475569" filter="url(#soft-shadow)"/>
  <rect x="45" y="192" width="16" height="35" rx="2" fill="#334155"/>
  <rect x="179" y="192" width="16" height="35" rx="2" fill="#334155"/>

  <!-- DESK PROPS: Diplomas, Degrees, Academic Caps (Symbolizing '学历' - Academic Credentials) -->
  <!-- Stack of thick scholarly books -->
  <rect x="45" y="162" width="28" height="18" rx="2" fill="#38bdf8" />
  <rect x="43" y="166" width="32" height="16" rx="2" fill="#0284c7" />
  <rect x="46" y="153" width="26" height="14" rx="2" fill="#f43f5e" />
  
  <!-- Academic Mortarboard Cap on Books -->
  <polygon points="59,138 74,144 59,150 44,144" fill="#0f172a" />
  <polygon points="59,141 71,146 59,151 47,146" fill="#1e293b" />
  <rect x="56" y="146" width="6" height="6" fill="#0f172a" />
  <path d="M 64 146 Q 67 149 66 153" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="66" cy="153" r="1.5" fill="#fbbf24"/>

  <!-- Rolled Degree Scroll with Red Ribbon -->
  <g transform="translate(145, 163) rotate(-15)">
    <rect x="0" y="0" width="36" height="14" rx="7" fill="#f8fafc" filter="url(#soft-shadow)"/>
    <rect x="13" y="0" width="6" height="14" fill="#ef4444"/>
  </g>
  <!-- Second diploma scroll open/flat base -->
  <rect x="130" y="173" width="32" height="7" rx="1.5" fill="#e2e8f0" transform="rotate(-5 146 176)"/>

  <!-- MAIN CHARACTER: Proud, confident professional/scholar holding achievement -->
  <g id="main-character" filter="url(#soft-shadow)">
    <!-- Body / Torso (Sharp suit jacket in modern navy/slate) -->
    <path d="M 95 185 L 95 145 C 95 135 105 130 120 130 C 135 130 145 135 145 145 L 145 185 Z" fill="#334155" />
    
    <!-- Crisp White Collar & Tie -->
    <polygon points="112,130 120,148 128,130" fill="#f8fafc" />
    <polygon points="118,143 120,175 122,143" fill="#f59e0b" />

    <!-- Shoulders / Suit Lapels -->
    <path d="M 95 145 L 112 165 L 100 185 Z" fill="#1e293b" />
    <path d="M 145 145 L 128 165 L 140 185 Z" fill="#1e293b" />

    <!-- Neck -->
    <rect x="112" y="120" width="16" height="16" fill="#fcd34d" />

    <!-- Head & Face -->
    <circle cx="120" cy="95" r="24" fill="#fcd34d" />
    
    <!-- Friendly, confident expression with smile and bright eyes -->
    <circle cx="112" cy="92" r="2.5" fill="#1e293b" />
    <circle cx="128" cy="92" r="2.5" fill="#1e293b" />
    <path d="M 115 102 Q 120 107 125 102" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    
    <!-- Neat modern hair style -->
    <path d="M 96 95 C 95 78 105 70 120 70 C 135 70 145 78 144 95 C 141 85 135 80 120 80 C 105 80 99 85 96 95 Z" fill="#0f172a" />

    <!-- Arms gesturing proudly towards credentials -->
    <!-- Left Arm -->
    <path d="M 98 148 L 80 165 L 88 175" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="88" cy="175" r="5" fill="#fcd34d" />

    <!-- Right Arm holding up certificate / high achievement badge -->
    <path d="M 142 148 L 160 135 L 155 122" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="155" cy="122" r="5" fill="#fcd34d" />
  </g>

  <!-- GLOWING CERTIFICATE OF EXCELLENCE / HIGHER DEGREE -->
  <g id="certificate-plaque" transform="translate(140, 75)" filter="url(#soft-shadow)">
    <!-- Frame -->
    <rect x="0" y="0" width="46" height="36" rx="3" fill="#ffffff" stroke="#fbbf24" stroke-width="3" />
    <!-- Inner lines representing academic transcript/diploma details -->
    <line x1="8" y1="8" x2="38" y2="8" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="16" x2="30" y2="16" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="22" x2="24" y2="22" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    
    <!-- Golden Seal / Ribbon on Certificate -->
    <circle cx="35" cy="26" r="6" fill="#f59e0b" />
    <path d="M 33 32 L 35 37 L 37 32 Z" fill="#d97706" />

    <!-- Sparkles indicating high status / prestige -->
    <path d="M -8 12 L -5 12 L -5 15 L -2 15 L -2 12 L 1 12 L 1 9 L -2 9 L -2 6 L -5 6 L -5 9 L -8 9 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M 50 -5 L 52 -5 L 52 -3 L 54 -3 L 54 -1 L 52 -1 L 52 1 L 50 1 L 50 -1 L 48 -1 L 48 -3 L 50 -3 Z" fill="#fbbf24" opacity="0.8" />
  </g>

  <!-- Additional Sparkles / Star Elements highlighting the "high/top tier" concept -->
  <g fill="#38bdf8">
    <path d="M 35 70 Q 35 75 40 75 Q 35 75 35 80 Q 35 75 30 75 Q 35 75 35 70 Z" />
    <path d="M 200 60 Q 200 64 204 64 Q 200 64 200 68 Q 200 64 196 64 Q 200 64 200 60 Z" />
  </g>
</svg>