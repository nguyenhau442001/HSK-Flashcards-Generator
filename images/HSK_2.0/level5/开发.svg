<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting & window backdrop -->
  <path d="M140 30 L210 30 L210 130 L140 130 Z" fill="#1e293b" opacity="0.6"/>
  <!-- Window frames / City glow outside -->
  <line x1="175" y1="30" x2="175" y2="130" stroke="#0f172a" stroke-width="2"/>
  <line x1="140" y1="80" x2="210" y2="80" stroke="#0f172a" stroke-width="2"/>
  <circle cx="160" cy="55" r="3" fill="#38bdf8" opacity="0.4"/>
  <circle cx="190" cy="100" r="2" fill="#f43f5e" opacity="0.5"/>
  <circle cx="195" cy="45" r="2" fill="#fbbf24" opacity="0.5"/>

  <!-- Plant for office realism -->
  <path d="M25 150 Q20 120 35 110 Q40 130 35 150 Z" fill="#10b981"/>
  <path d="M30 150 Q45 125 55 120 Q50 140 30 150 Z" fill="#059669"/>
  <rect x="20" y="150" width="25" height="25" rx="4" fill="#475569"/>

  <!-- Office Desk -->
  <rect x="25" y="170" width="190" height="10" rx="3" fill="#334155"/>
  <rect x="40" y="180" width="12" height="35" rx="2" fill="#1e293b"/>
  <rect x="188" y="180" width="12" height="35" rx="2" fill="#1e293b"/>

  <!-- Main Laptop / Product Design Setup -->
  <!-- Laptop Base -->
  <polygon points="65,170 125,170 135,174 55,174" fill="#cbd5e1"/>
  <!-- Laptop Screen Frame -->
  <rect x="70" y="115" width="55" height="55" rx="4" fill="#334155"/>
  <rect x="73" y="118" width="49" height="42" rx="2" fill="#0f172a"/>
  
  <!-- UI / New Product Interface on Screen (Design & Code) -->
  <rect x="77" y="123" width="20" height="6" rx="2" fill="#38bdf8"/>
  <rect x="77" y="132" width="41" height="4" rx="1" fill="#64748b"/>
  <rect x="77" y="139" width="30" height="4" rx="1" fill="#64748b"/>
  <!-- Holographic Product Preview floating up (Symbolizing "New Product") -->
  <circle cx="97" cy="92" r="16" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 2"/>
  <path d="M92 92 L97 86 L102 92 L97 98 Z" fill="#f59e0b"/>
  
  <!-- Coffee Mug -->
  <rect x="135" y="153" width="14" height="17" rx="3" fill="#e2e8f0"/>
  <path d="M149 157 C154 157, 154 166, 149 166" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M139 148 Q142 142 140 138" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Character: Developer / Creator -->
  <!-- Chair Back -->
  <path d="M150 110 Q160 100 170 110 L170 170 L150 170 Z" fill="#334155"/>
  
  <!-- Character Body & Clothing (Hoodie/Sweater) -->
  <path d="M125 180 C125 145, 145 130, 165 130 C185 130, 205 145, 205 180 Z" fill="#6366f1"/>
  <!-- Collar / Hood accent -->
  <path d="M150 130 Q165 142 180 130" fill="none" stroke="#4f46e5" stroke-width="4"/>

  <!-- Character Neck & Head -->
  <rect x="157" y="118" width="16" height="16" rx="6" fill="#fbcfe8"/>
  <!-- Face Profile/Angle -->
  <circle cx="165" cy="112" r="15" fill="#fbcfe8"/>
  
  <!-- Hair -->
  <path d="M150 105 C150 95, 175 92, 180 105 C182 110, 175 115, 175 115 C175 115, 165 98, 152 108 Z" fill="#1e293b"/>

  <!-- Glasses -->
  <rect x="163" y="106" width="7" height="5" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="171" y="106" width="7" height="5" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="170" y1="108" x2="171" y2="108" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Arms / Hands interacting with product creation -->
  <!-- Right Arm reaching to keyboard -->
  <path d="M185 145 Q160 155 125 160" fill="none" stroke="#6366f1" stroke-width="10" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="123" cy="161" r="4" fill="#fbcfe8"/>

  <!-- Sparkles / Innovation Accents (Representing "New Product Development") -->
  <g transform="translate(110, 50)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(60, 80) scale(0.6)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(180, 70) scale(0.8)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#10b981"/>
  </g>

  <!-- Architectural floor/desk shadow -->
  <ellipse cx="120" cy="210" rx="100" ry="6" fill="#020617" opacity="0.4"/>
</svg>