<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Spilled Coffee Mug (The "Ai!" moment) -->
  <g transform="translate(120, 140)">
    <!-- Puddle -->
    <ellipse cx="0" cy="40" rx="60" ry="20" fill="#fb923c" opacity="0.6"/>
    <!-- Mug -->
    <path d="M-30 40 L30 40 L25 -20 L-25 -20 Z" fill="#f59e0b"/>
    <path d="M25 -10 C45 -10 45 10 25 10" stroke="#f59e0b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Coffee Splatter -->
    <circle cx="0" cy="20" r="8" fill="#fb923c"/>
    <circle cx="-15" cy="25" r="5" fill="#fb923c"/>
    <circle cx="15" cy="15" r="6" fill="#fb923c"/>
  </g>

  <!-- Surrounding Context: A desk with a fallen book -->
  <rect x="30" y="160" width="60" height="15" rx="2" fill="#38bdf8" transform="rotate(-15 60 167)"/>
  <rect x="32" y="162" width="56" height="1" fill="#1e293b" transform="rotate(-15 60 167)"/>
  
  <!-- Character's hand reaching out (Expressing "Ai!") -->
  <g transform="translate(180, 120)">
    <path d="M0 0 C-10 -20 -30 -20 -40 0 L-35 20 L-5 20 Z" fill="#ec4899"/>
    <circle cx="-42" cy="-5" r="8" fill="#ec4899"/>
    <circle cx="-30" cy="-12" r="8" fill="#ec4899"/>
    <circle cx="-18" cy="-12" r="8" fill="#ec4899"/>
    <circle cx="-8" cy="-8" r="8" fill="#ec4899"/>
  </g>

  <!-- Atmospheric accents -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="180" cy="60" r="2" fill="#fbbf24"/>
  <circle cx="40" cy="50" r="4" fill="#10b981"/>
</svg>