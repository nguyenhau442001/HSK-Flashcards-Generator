<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <linearGradient id="indoor-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Sky Evening Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Indoor Room Interior (Left side & Floor) -->
  <!-- Floor -->
  <polygon points="0,210 240,210 240,240 0,240" fill="#0f172a"/>
  <!-- Wooden floor planks perspective lines -->
  <line x1="0" y1="222" x2="240" y2="222" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="0" y1="233" x2="240" y2="233" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Interior Wall -->
  <rect x="0" y="0" width="240" height="210" fill="#1e293b"/>
  <rect x="0" y="0" width="130" height="210" fill="url(#indoor-light)"/>

  <!-- Balcony Floor Extension (Outside the sliding door) -->
  <path d="M125,210 L235,210 L240,195 L120,195 Z" fill="#334155"/>
  <rect x="120" y="193" width="120" height="4" rx="2" fill="#475569"/>

  <!-- Balcony Sky & City Backdrop (Visible through balcony door) -->
  <rect x="120" y="30" width="105" height="165" fill="url(#sky-grad)"/>
  <!-- City skyline silhouettes in background -->
  <polygon points="125,193 125,160 135,150 135,193" fill="#1e293b" opacity="0.6"/>
  <polygon points="140,193 140,130 155,120 170,130 170,193" fill="#1e293b" opacity="0.6"/>
  <polygon points="180,193 180,145 195,135 210,145 210,193" fill="#1e293b" opacity="0.6"/>
  <!-- Distant warm window lights -->
  <rect x="145" y="135" width="4" height="6" fill="#fbbf24" opacity="0.7"/>
  <rect x="155" y="145" width="4" height="6" fill="#fbbf24" opacity="0.7"/>
  <rect x="185" y="150" width="5" height="8" fill="#fbbf24" opacity="0.7"/>

  <!-- Balcony Railing (Modern Metal & Glass Bars) -->
  <!-- Glass Panel -->
  <polygon points="122,193 238,193 232,105 128,105" fill="#38bdf8" opacity="0.15"/>
  <!-- Vertical Railing Posts -->
  <rect x="125" y="95" width="3" height="98" rx="1.5" fill="#64748b"/>
  <rect x="175" y="95" width="3" height="98" rx="1.5" fill="#64748b"/>
  <rect x="230" y="95" width="3" height="98" rx="1.5" fill="#64748b"/>
  <!-- Top Rail -->
  <path d="M123,98 L232,98" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <!-- Sliding Glass Door Frame (Left Side) -->
  <rect x="112" y="25" width="10" height="185" rx="2" fill="#334155"/>
  <!-- Door Curtain / Valance inside -->
  <path d="M0,25 L120,25 L120,35 L0,35 Z" fill="#475569"/>

  <!-- Potted Plants on the Balcony (Nature/Home Context) -->
  <!-- Plant Stand -->
  <rect x="135" y="155" width="22" height="38" rx="2" fill="#475569"/>
  <!-- Pot 1 -->
  <path d="M138,155 L154,155 L150,138 L142,138 Z" fill="#f43f5e"/>
  <!-- Monstera Leaves -->
  <path d="M146,138 C146,125 130,120 132,108 C134,98 146,105 146,115 C146,105 158,98 160,108 C162,120 146,125 146,138 Z" fill="#10b981"/>
  <path d="M146,138 C155,130 165,135 168,125" stroke="#059669" stroke-width="3" stroke-linecap="round"/>

  <!-- Hanging Planter on the Right Rail -->
  <path d="M210,110 Q215,130 220,110 Z" fill="#38bdf8"/>
  <path d="M205,100 C205,90 225,90 225,100" fill="#10b981"/>
  <circle cx="212" cy="95" r="8" fill="#34d399"/>
  <circle cx="220" cy="98" r="6" fill="#059669"/>

  <!-- Character (Relaxing/Enjoying the Balcony) -->
  <!-- Standing casually leaning against the balcony railing -->
  <!-- Body / Torso -->
  <path d="M165,130 C165,115 180,110 190,125 L195,170 C195,175 185,175 185,170 L180,150 L170,170 C170,175 160,175 160,170 Z" fill="#38bdf8"/>
  
  <!-- Arms leaning on rail -->
  <path d="M175,125 Q190,120 205,125" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Head & Hair -->
  <circle cx="182" cy="98" r="14" fill="#fbcfe8"/> <!-- Face -->
  <!-- Hair Style -->
  <path d="M168,95 C168,80 196,80 196,95 C196,102 192,105 192,105 L172,105 C172,105 168,102 168,95 Z" fill="#1e293b"/>
  <path d="M167,95 C167,110 172,112 175,112" stroke="#1e293b" stroke-width="3" fill="none"/>

  <!-- Coffee Mug in Hand -->
  <rect x="195" y="118" width="10" height="12" rx="2" fill="#ffffff"/>
  <path d="M205,121 C208,121 208,127 205,127" stroke="#ffffff" stroke-width="2" fill="none"/>
  <!-- Steam from coffee -->
  <path d="M198,112 Q200,107 198,102" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M202,110 Q204,105 202,100" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Legs -->
  <path d="M172,170 L172,205 C172,208 178,208 178,205 L178,170" fill="#334155"/>
  <path d="M188,170 L190,205 C190,208 196,208 196,205 L192,170" fill="#334155"/>
  <!-- Shoes -->
  <rect x="168" y="202" width="12" height="6" rx="3" fill="#f8fafc"/>
  <rect x="188" y="202" width="12" height="6" rx="3" fill="#f8fafc"/>

  <!-- Indoor Decor / Context Details (Left side room) -->
  <!-- Floor Lamp -->
  <line x1="30" y1="210" x2="30" y2="80" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M20,80 L40,80 L35,65 L25,65 Z" fill="#fbbf24"/>
  <circle cx="30" cy="210" r="8" fill="#d97706"/>

  <!-- Cozy Armchair partially visible -->
  <path d="M60,160 C60,140 90,140 90,160 L90,210 L60,210 Z" fill="#818cf8"/>
  <path d="M50,175 C50,165 70,165 70,185 L70,210 L50,210 Z" fill="#6366f1"/>

  <!-- Warm ambient lighting highlights on frame/edges -->
  <path d="M120,30 L120,215" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
</svg>