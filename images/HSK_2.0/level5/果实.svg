<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Glow Radial -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Fruit Gradient -->
    <linearGradient id="fruitGrad" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Wood Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="potRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Golden Glow behind the main subject -->
  <circle cx="120" cy="110" r="85" fill="url(#glow)"/>

  <!-- Floating Sparkles / Effort Particles representing "Thành quả" -->
  <g opacity="0.8">
    <path d="M70,80 L72,85 L77,87 L72,89 L70,94 L68,89 L63,87 L68,85 Z" fill="#fde047" filter="url(#glowFilter)" transform="scale(0.8) translate(20, -10)"/>
    <path d="M170,70 L171.5,73.5 L175,75 L171.5,76.5 L170,80 L168.5,76.5 L165,75 L168.5,73.5 Z" fill="#38bdf8" filter="url(#glowFilter)"/>
    <path d="M160,140 L161,142 L163,143 L161,144 L160,146 L159,144 L157,143 L159,142 Z" fill="#f472b6"/>
    <circle cx="85" cy="140" r="2.5" fill="#34d399"/>
    <circle cx="145" cy="55" r="2" fill="#fbbf24"/>
    <circle cx="95" cy="60" r="1.5" fill="#f472b6"/>
  </g>

  <!-- Environment / Desk surface -->
  <path d="M 30,195 Q 120,185 210,195 L 225,215 Q 120,225 15,215 Z" fill="#0f172a" opacity="0.6"/>
  <rect x="36" y="193" width="168" height="3" rx="1.5" fill="#334155" opacity="0.4"/>

  <!-- Pot / Planter Base -->
  <g filter="url(#shadow)">
    <!-- Soil -->
    <ellipse cx="120" cy="155" rx="36" ry="10" fill="#1e293b"/>
    <ellipse cx="120" cy="153" rx="32" ry="8" fill="#0f172a"/>
    
    <!-- Pot Body -->
    <path d="M 88,155 L 98,200 C 99,205 104,208 110,208 L 130,208 C 136,208 141,205 142,200 L 152,155 Z" fill="url(#potGrad)"/>
    <!-- Pot Rim -->
    <path d="M 84,152 C 84,148 100,145 120,145 C 140,145 156,148 156,152 C 156,156 140,159 120,159 C 100,159 84,156 84,152 Z" fill="url(#potRim)"/>
    <!-- Pot Highlight -->
    <path d="M 92,158 L 97,195" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Stems & Structural Branching -->
  <g stroke="#059669" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main stem -->
    <path d="M 120,150 C 118,125 125,110 120,90" stroke-width="6"/>
    <!-- Left branch -->
    <path d="M 120,110 C 105,100 90,105 80,95" stroke-width="4"/>
    <!-- Right branch -->
    <path d="M 120,100 C 135,90 150,95 160,85" stroke-width="4"/>
  </g>

  <!-- Secondary Leaves for Depth -->
  <path d="M 80,95 C 70,85 65,95 72,105 C 78,112 88,105 80,95 Z" fill="#047857"/>
  <path d="M 160,85 C 172,78 178,88 170,98 C 162,104 154,95 160,85 Z" fill="#047857"/>

  <!-- MAIN SUBJECT: The Golden Fruit ("Thành quả") -->
  <g filter="url(#shadow)">
    <!-- Center Main Fruit (Large, glowing central success fruit) -->
    <g transform="translate(120, 80)">
      <!-- Fruit Body -->
      <circle cx="0" cy="0" r="32" fill="url(#fruitGrad)"/>
      
      <!-- Top dimple/stem connection -->
      <path d="M -6,-28 C -2,-34 2,-34 6,-28" stroke="#d97706" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 0,-30 L 2,-38" stroke="#059669" stroke-width="3" stroke-linecap="round"/>

      <!-- Stylized segment lines (Giving it a rich, organic texture) -->
      <path d="M 0,-28 C 12,-15 12,15 0,28" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.4"/>
      <path d="M 0,-28 C -12,-15 -12,15 0,28" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.4"/>
      <path d="M -28,0 C -15,12 15,12 28,0" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.3"/>

      <!-- Glossy Highlights -->
      <path d="M -16,-16 C -8,-22 0,-20 8,-16 C 0,-25 -10,-25 -16,-16 Z" fill="#ffffff" opacity="0.6"/>
      <circle cx="-12" cy="-10" r="4" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- Left Supporting Fruit -->
    <g transform="translate(75, 92) scale(0.65)">
      <circle cx="0" cy="0" r="32" fill="url(#fruitGrad)"/>
      <path d="M 0,-30 L 1,-37" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M -14,-14 C -6,-20 2,-18 8,-14" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Right Supporting Fruit -->
    <g transform="translate(165, 82) scale(0.75)">
      <circle cx="0" cy="0" r="32" fill="url(#fruitGrad)"/>
      <path d="M 0,-30 L 2,-37" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
      <path d="M -14,-14 C -6,-20 2,-18 8,-14" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>

  <!-- Foreground Dynamic Leaves framing the fruit -->
  <g filter="url(#shadow)">
    <!-- Top-left Leaf -->
    <path d="M 120,78 C 110,60 90,55 75,65 C 60,75 65,95 85,92 C 100,90 115,85 120,78 Z" fill="url(#leafGrad)"/>
    <path d="M 78,72 C 88,78 100,78 115,76" stroke="#065f46" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Top-right Leaf -->
    <path d="M 120,78 C 130,60 150,55 165,65 C 180,75 175,95 155,92 C 140,90 125,85 120,78 Z" fill="url(#leafGrad)"/>
    <path d="M 162,72 C 152,78 140,78 125,76" stroke="#065f46" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Action/Success UI decorative bracket or ring (Subtle modern touch) -->
  <circle cx="120" cy="110" r="75" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="6 12" opacity="0.3" stroke-linecap="round"/>
  <circle cx="120" cy="110" r="92" stroke="#fbbf24" stroke-width="1" fill="none" stroke-dasharray="4 20" opacity="0.25" stroke-linecap="round"/>

  <!-- Extra ambient floating particles for magical app-illustration feel -->
  <circle cx="55" cy="120" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="185" cy="135" r="2" fill="#34d399" opacity="0.8"/>
  <circle cx="130" cy="35" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="100" cy="45" r="1.5" fill="#f472b6" opacity="0.8"/>
</svg>