<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk / Surface Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter for Hologram -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background glow elements -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.04" />
  <circle cx="120" cy="110" r="40" fill="#fbbf24" opacity="0.03" />

  <!-- Back Wall / Architectural Detail -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" opacity="0.5" />
  
  <!-- Bookshelf / Lab Background Elements (Subtle context) -->
  <rect x="25" y="45" width="35" height="50" rx="4" fill="#334155" opacity="0.4" />
  <rect x="65" y="55" width="25" height="40" rx="3" fill="#475569" opacity="0.4" />
  <rect x="180" y="40" width="30" height="55" rx="4" fill="#1e293b" opacity="0.6" stroke="#334155" stroke-width="1.5" />

  <!-- Desk Surface -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#desk-grad)" />
  <path d="M0 170 L240 170" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- Main Object: Holographic Complex Theory Matrix & Architect Desk -->
  <g filter="url(#soft-shadow)">
    <!-- Base Projector Device -->
    <path d="M85 170 L155 170 L145 155 L95 155 Z" fill="#475569" />
    <ellipse cx="120" cy="155" rx="25" ry="6" fill="#64748b" />
    <!-- Projector Lens/Core -->
    <ellipse cx="120" cy="155" rx="14" ry="3" fill="#38bdf8" filter="url(#glow)" />
    <!-- Projector Control Lights -->
    <circle cx="110" cy="164" r="1.5" fill="#10b981" />
    <circle cx="130" cy="164" r="1.5" fill="#fb923c" />
  </g>

  <!-- Holographic Beam Cone -->
  <path d="M110 152 L60 70 L180 70 L130 152 Z" fill="url(#bg-grad)" opacity="0.6" />
  <path d="M110 152 L60 70 L180 70 L130 152 Z" fill="#38bdf8" opacity="0.08" />

  <!-- Complex 3D Holographic Structure representing "Theory / 理论" -->
  <g filter="url(#glow)">
    
    <!-- Outer Orbit Rings (Complex system) -->
    <ellipse cx="120" cy="95" rx="55" ry="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <ellipse cx="120" cy="115" rx="45" ry="14" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.5" />

    <!-- Central Conceptual Core (Multi-layered interconnected nodes) -->
    <!-- Node 1: Top -->
    <circle cx="120" cy="70" r="8" fill="#fbbf24" />
    <circle cx="120" cy="70" r="4" fill="#fef08a" />

    <!-- Node 2: Mid-Left -->
    <circle cx="85" cy="100" r="6" fill="#38bdf8" />
    <circle cx="85" cy="100" r="3" fill="#e0f2fe" />

    <!-- Node 3: Mid-Right -->
    <circle cx="155" cy="100" r="6" fill="#ec4899" />
    <circle cx="155" cy="100" r="3" fill="#fce7f3" />

    <!-- Node 4: Bottom-Center -->
    <circle cx="120" cy="130" r="7" fill="#10b981" />
    <circle cx="120" cy="130" r="3.5" fill="#d1fae5" />

    <!-- Connecting Structural Framework Lines (Intricate Theory Web) -->
    <path d="M120 70 L85 100 L120 130 L155 100 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <path d="M120 70 L120 130" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.8" />
    <path d="M85 100 L155 100" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.7" />

    <!-- Diagonal cross braces -->
    <line x1="120" y1="70" x2="105" y2="115" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <line x1="120" y1="70" x2="135" y2="115" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <line x1="85" y1="100" x2="120" y2="130" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <line x1="155" y1="100" x2="120" y2="130" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

    <!-- Floating satellite data nodes -->
    <circle cx="95" cy="78" r="3" fill="#fb923c" />
    <circle cx="148" cy="82" r="2.5" fill="#38bdf8" />
    <circle cx="100" cy="122" r="2" fill="#ec4899" />
    <circle cx="140" cy="120" r="3" fill="#fbbf24" />

  </g>

  <!-- Foreground Props on Desk (Adding Real-World Tangible Context) -->
  <!-- Notebook / Blueprint for plotting theory -->
  <g transform="translate(35, 185) rotate(-8)">
    <rect width="45" height="35" rx="3" fill="#f8fafc" />
    <rect width="45" height="8" rx="3" fill="#cbd5e1" />
    <!-- Notebook lines -->
    <line x1="8" y1="15" x2="37" y2="15" stroke="#94a3b8" stroke-width="1" />
    <line x1="8" y1="21" x2="37" y2="21" stroke="#94a3b8" stroke-width="1" />
    <line x1="8" y1="27" x2="25" y2="27" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Stylus / Pen -->
  <g transform="translate(85, 200) rotate(25)">
    <rect width="24" height="4" rx="2" fill="#38bdf8" />
    <polygon points="24,2 28,0 28,4" fill="#fbbf24" />
  </g>

  <!-- Coffee Mug for late-night theory crafting -->
  <g transform="translate(170, 180)">
    <rect x="0" y="5" width="22" height="26" rx="4" fill="#cbd5e1" />
    <path d="M22 10 C28 10 28 22 22 24" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <rect x="3" y="2" width="16" height="3" rx="1.5" fill="#94a3b8" />
    <!-- Steam wisps -->
    <path d="M7 0 C7 -3 11 -3 11 -6" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M14 -1 C14 -4 18 -4 18 -7" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Ambient Highlight Overlay -->
  <circle cx="120" cy="95" r="30" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />

</svg>