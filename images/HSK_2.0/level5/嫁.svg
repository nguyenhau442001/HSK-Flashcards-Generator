<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Ground / Floor -->
  <path d="M0 180 C60 170, 180 170, 240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 185 C60 175, 180 175, 240 185 L240 240 L0 240 Z" fill="#475569" opacity="0.5"/>

  <!-- Wedding Arch Structure - base glow -->
  <path d="M60 180 Q120 80, 180 180 L175 180 Q120 85, 65 180 Z" fill="#f59e0b" opacity="0.3"/>
  <path d="M55 180 C50 140, 50 100, 120 90 C190 100, 190 140, 185 180 Z" fill="#fbbf24" opacity="0.15"/>
  <path d="M60 180 C55 140, 55 100, 120 90 C185 100, 185 140, 180 180 Z" fill="#f59e0b" opacity="0.2"/>

  <!-- Arch top - more defined -->
  <path d="M50 170 C50 110, 120 70, 190 170 L185 170 C185 115, 120 75, 55 170 Z" fill="#f59e0b" opacity="0.5"/>
  <!-- Arch base / pillars - simplified -->
  <rect x="50" y="170" width="10" height="30" fill="#f59e0b" opacity="0.4"/>
  <rect x="180" y="170" width="10" height="30" fill="#f59e0b" opacity="0.4"/>


  <!-- Flowers and foliage on the arch -->
  <circle cx="120" cy="85" r="15" fill="#10b981"/>
  <circle cx="125" cy="80" r="10" fill="#ec4899"/>
  <circle cx="115" cy="80" r="8" fill="#fb923c"/>

  <circle cx="80" cy="110" r="12" fill="#10b981"/>
  <circle cx="85" cy="105" r="8" fill="#ec4899"/>

  <circle cx="160" cy="110" r="12" fill="#10b981"/>
  <circle cx="155" cy="105" r="8" fill="#fb923c"/>

  <!-- Bride (left) -->
  <!-- Dress -->
  <path d="M100 190 L105 160 C105 150, 110 140, 120 140 C130 140, 135 150, 135 160 L140 190 Z" fill="#e0e7ff"/>
  <path d="M100 190 C105 170, 115 160, 120 160 C125 160, 135 170, 140 190 Z" fill="#cbd5e1" opacity="0.7"/> <!-- Inner dress shadow -->
  <!-- Torso -->
  <rect x="115" y="140" width="10" height="20" fill="#e0e7ff"/>
  <!-- Head -->
  <circle cx="120" cy="130" r="10" fill="#fbd38d"/>
  <!-- Hair -->
  <path d="M115 125 C110 120, 110 130, 115 135 C120 140, 125 140, 130 135 C130 130, 130 120, 125 125 Z" fill="#a0522d"/>
  <!-- Veil -->
  <path d="M120 130 C130 130, 140 140, 140 160 L135 160 C135 145, 125 135, 120 135 Z" fill="#e0e7ff" opacity="0.5"/>
  <path d="M120 130 C110 130, 100 140, 100 160 L105 160 C105 145, 115 135, 120 135 Z" fill="#e0e7ff" opacity="0.5"/>

  <!-- Groom (right) -->
  <!-- Suit -->
  <rect x="125" y="150" width="20" height="40" fill="#334155"/>
  <path d="M125 150 C120 150, 120 170, 125 190 L145 190 C150 170, 150 150, 145 150 Z" fill="#475569" opacity="0.7"/> <!-- Suit details/shadow -->
  <!-- Shirt collar -->
  <rect x="132" y="145" width="6" height="8" fill="#e0e7ff"/>
  <!-- Head -->
  <circle cx="135" cy="130" r="10" fill="#fbd38d"/>
  <!-- Hair -->
  <path d="M130 125 C128 120, 130 120, 135 120 C140 120, 142 120, 140 125 C138 130, 132 130, 130 125 Z" fill="#4a312a"/>

  <!-- Hands holding, slightly obscured -->
  <ellipse cx="127" cy="165" rx="8" ry="5" fill="#fbd38d" transform="rotate(15 127 165)"/>
  <ellipse cx="133" cy="165" rx="8" ry="5" fill="#fbd38d" transform="rotate(-15 133 165)"/>

  <!-- Ring on bride's hand (subtle) -->
  <circle cx="125" cy="163" r="1.5" fill="#fbbf24"/>

  <!-- Subtle glow around the couple -->
  <circle cx="120" cy="160" r="30" fill="#fbbf24" opacity="0.1"/>
  <circle cx="120" cy="160" r="20" fill="#fbbf24" opacity="0.15"/>

  <!-- More flowers on the ground, hinting at decor -->
  <circle cx="40" cy="195" r="8" fill="#ec4899" opacity="0.6"/>
  <circle cx="200" cy="195" r="8" fill="#fb923c" opacity="0.6"/>
  <circle cx="35" cy="200" r="5" fill="#10b981" opacity="0.6"/>
  <circle cx="205" cy="200" r="5" fill="#10b981" opacity="0.6"/>
</svg>