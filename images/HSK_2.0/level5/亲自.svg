<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowBeam" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Gift Box Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background -->
  <!-- Wallpaper / Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" />
  <!-- Wall panels/lines -->
  <line x1="20" y1="120" x2="220" y2="120" stroke="#334155" stroke-width="1.5" />
  <line x1="120" y1="20" x2="120" y2="120" stroke="#334155" stroke-width="1" />

  <!-- Window with Night City/Moon view -->
  <g transform="translate(145, 30)">
    <rect x="0" y="0" width="55" height="75" rx="4" fill="#090d16" stroke="#475569" stroke-width="2.5" />
    <!-- Window pane inner cross -->
    <line x1="27.5" y1="0" x2="27.5" y2="75" stroke="#475569" stroke-width="1.5" />
    <line x1="0" y1="37.5" x2="55" y2="37.5" stroke="#475569" stroke-width="1.5" />
    <!-- Moon outside -->
    <circle cx="42" cy="18" r="6" fill="#fde047" opacity="0.8" />
  </g>

  <!-- Soft Window Light Beam falling across the room -->
  <polygon points="145,30 200,30 220,170 80,170" fill="url(#windowBeam)" />

  <!-- House Plant on Bookshelf/Floor -->
  <g transform="translate(30, 95)">
    <path d="M 5 25 Q 5 15 15 15 Q 25 15 25 25 Z" fill="#cbd5e1" />
    <path d="M 15 15 Q 10 0 0 -5" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 15 15 Q 22 -2 30 -8" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="-5" r="4" fill="#34d399" />
    <circle cx="30" cy="-8" r="5" fill="#34d399" />
  </g>

  <!-- Wooden Floor -->
  <rect x="20" y="170" width="200" height="50" fill="#0f172a" />
  <line x1="20" y1="170" x2="220" y2="170" stroke="#475569" stroke-width="2" />
  <line x1="40" y1="195" x2="200" y2="195" stroke="#1e293b" stroke-width="1" stroke-dasharray="20 10" />

  <!-- Cozy Floor Lamp -->
  <g transform="translate(190, 80)">
    <line x1="10" y1="0" x2="10" y2="90" stroke="#64748b" stroke-width="2" />
    <polygon points="0,0 20,0 15,-25 5,-25" fill="#f59e0b" opacity="0.9" />
    <ellipse cx="10" cy="90" rx="8" ry="3" fill="#64748b" />
    <!-- Light Glow -->
    <path d="M -10 10 Q 10 -40 30 10 Z" fill="url(#warmLight)" />
  </g>

  <!-- Character 1: The Host sitting on a comfortable armchair (the person being visited) -->
  <g transform="translate(45, 110)">
    <!-- Armchair Back & Seat -->
    <path d="M 10 10 Q 10 -10 30 -10 L 60 -10 Q 80 -10 80 10 L 80 70 Q 80 80 70 80 L 20 80 Q 10 80 10 70 Z" fill="#334155" />
    <path d="M 5 30 Q 5 20 15 20 L 75 20 Q 85 20 85 30 L 85 75 Q 85 85 75 85 L 15 85 Q 5 85 5 75 Z" fill="#475569" />
    
    <!-- Host Body & Blanket -->
    <path d="M 25 40 Q 45 35 60 40 L 65 75 Q 65 80 55 80 L 30 80 Q 20 80 25 75 Z" fill="#0ea5e9" />
    <path d="M 20 55 L 70 55 L 68 80 L 22 80 Z" fill="#38bdf8" /> <!-- blanket -->

    <!-- Host Head & Face -->
    <circle cx="45" cy="12" r="13" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 32 10 Q 45 -2 58 10 Q 50 3 45 3 Q 40 3 32 10 Z" fill="#475569" />
    <!-- Friendly happy expression (looking up, surprised/glad) -->
    <circle cx="41" cy="11" r="1.5" fill="#1e293b" />
    <circle cx="49" cy="11" r="1.5" fill="#1e293b" />
    <path d="M 43 16 Q 45 19 47 16" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" />
    <!-- Rosy cheeks -->
    <circle cx="39" cy="14" r="2" fill="#f43f5e" opacity="0.4" />
    <circle cx="51" cy="14" r="2" fill="#f43f5e" opacity="0.4" />

    <!-- Host Arm waving / welcoming -->
    <path d="M 22 45 Q 10 40 15 30" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" />
    <circle cx="15" cy="28" r="3.5" fill="#fbcfe8" />
  </g>

  <!-- Coffee Table with Teacups -->
  <g transform="translate(65, 145)">
    <!-- Table top -->
    <ellipse cx="35" cy="15" rx="35" ry="10" fill="#94a3b8" />
    <ellipse cx="35" cy="13" rx="35" ry="10" fill="#cbd5e1" />
    <!-- Table legs -->
    <line x1="10" y1="20" x2="5" y2="45" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="20" x2="65" y2="45" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    
    <!-- Teacups on table -->
    <path d="M 20 10 L 24 18 L 16 18 Z" fill="#ffffff" />
    <path d="M 40 8 L 44 16 L 36 16 Z" fill="#ffffff" />
    <!-- Steam -->
    <path d="M 20 4 Q 22 1 20 -2" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Character 2: The Visitor ("亲自" - He came PERSONALLY, holding a gift) -->
  <g transform="translate(130, 95)">
    <!-- Visitor Legs (Standing / Stepping in) -->
    <path d="M 25 70 L 22 110 L 32 110 L 34 75 Z" fill="#334155" />
    <path d="M 45 70 L 50 110 L 60 110 L 52 75 Z" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="27" cy="111" rx="7" ry="3" fill="#0f172a" />
    <ellipse cx="57" cy="111" rx="7" ry="3" fill="#0f172a" />

    <!-- Visitor Torso & Jacket -->
    <path d="M 20 35 Q 38 30 55 35 L 58 75 Q 58 80 48 80 L 28 80 Q 18 80 20 75 Z" fill="#10b981" />
    <!-- Open jacket lapels -->
    <path d="M 37 35 L 30 75 L 45 75 L 40 35 Z" fill="#047857" />
    <path d="M 37 38 L 37 60" fill="none" stroke="#f1f5f9" stroke-width="2" /> <!-- white shirt collar -->

    <!-- Visitor Head & Face -->
    <circle cx="38" cy="18" r="13" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M 26 15 Q 38 4 50 15 Q 45 9 38 9 Q 31 9 26 15 Z" fill="#334155" />
    
    <!-- Friendly Expression (Warm smile, looking at host) -->
    <circle cx="34" cy="18" r="1.5" fill="#1e293b" />
    <circle cx="42" cy="18" r="1.5" fill="#1e293b" />
    <path d="M 36 23 Q 38 26 40 23" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" />
    <!-- Rosy cheeks -->
    <circle cx="32" cy="21" r="2" fill="#fb923c" opacity="0.3" />
    <circle cx="44" cy="21" r="2" fill="#fb923c" opacity="0.3" />

    <!-- Visitor Arms holding a Gift Box (Action of bringing something personally) -->
    <!-- Arm 1 holding gift base -->
    <path d="M 22 45 Q 12 55 22 65" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <!-- Arm 2 holding gift side -->
    <path d="M 52 45 Q 62 52 48 62" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

    <!-- Gift Box Props (Symbolizing a thoughtful visit/gesture) -->
    <g transform="translate(22, 52)">
      <rect x="0" y="5" width="24" height="20" rx="2" fill="#fb7185" />
      <rect x="-2" y="0" width="28" height="7" rx="1.5" fill="#f43f5e" />
      <!-- Ribbon Cross -->
      <rect x="10" y="0" width="4" height="25" fill="url(#ribbonGrad)" />
      <rect x="0" y="12" width="24" height="4" fill="url(#ribbonGrad)" />
      <!-- Bow on top -->
      <path d="M 8 -3 Q 4 -8 10 -4 Q 12 -2 14 -4 Q 20 -8 16 -3 Z" fill="#fb923c" />
    </g>
  </g>

  <!-- Floating Warm Sparkles / Ambience representing genuine connection & care -->
  <g fill="#fbbf24">
    <circle cx="100" cy="50" r="2" opacity="0.8" />
    <circle cx="115" cy="40" r="1.5" opacity="0.6" />
    <circle cx="90" cy="70" r="1.5" opacity="0.7" />
    <path d="M 125 65 L 127 70 L 132 72 L 127 74 L 125 79 L 123 74 L 118 72 L 123 70 Z" fill="#fde047" opacity="0.7" transform="scale(0.5) translate(130, 40)" />
  </g>

  <!-- Ambient rim light on floor/wall edges -->
  <path d="M 20 20 L 220 20" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
</svg>