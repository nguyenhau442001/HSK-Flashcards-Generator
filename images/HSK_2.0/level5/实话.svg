<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Clothing Gradient (Asking for truth) -->
    <linearGradient id="sweater1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Clothing Gradient (Confessing/Telling truth) -->
    <linearGradient id="sweater2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="90" r="120" fill="url(#lampGlow)" />

  <!-- BACKGROUND ENVIRONMENT (Cozy Living Room / Office) -->
  <!-- Wallpaper / Wall Texture Lines -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2" />
  
  <!-- Bookshelf in Background -->
  <rect x="25" y="70" width="40" height="90" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="100" x2="65" y2="100" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="130" x2="65" y2="130" stroke="#334155" stroke-width="1.5" />
  <!-- Books -->
  <rect x="30" y="80" width="8" height="20" rx="1" fill="#f59e0b" />
  <rect x="40" y="78" width="6" height="22" rx="1" fill="#38bdf8" />
  <rect x="48" y="82" width="12" height="18" rx="1" fill="#10b981" />
  <rect x="32" y="110" width="10" height="20" rx="1" fill="#ec4899" />
  <rect x="44" y="112" width="8" height="18" rx="1" fill="#fb923c" />

  <!-- Window with Night City Silhouette -->
  <path d="M 175 55 L 215 55 L 215 135 L 175 135 Z" fill="#0b0f19" stroke="#475569" stroke-width="2" />
  <!-- Window Panes -->
  <line x1="195" y1="55" x2="195" y2="135" stroke="#475569" stroke-width="1.5" />
  <line x1="175" y1="95" x2="215" y2="95" stroke="#475569" stroke-width="1.5" />
  <!-- City Lights outside -->
  <circle cx="183" cy="70" r="1.5" fill="#fbbf24" />
  <circle cx="188" cy="85" r="1.5" fill="#38bdf8" />
  <circle cx="205" cy="75" r="1.5" fill="#f43f5e" />
  <circle cx="208" cy="115" r="1.5" fill="#fbbf24" />
  
  <!-- House Plant on Floor -->
  <path d="M 195 170 Q 200 150 205 170 Z" fill="#334155" />
  <path d="M 200 150 Q 185 130 175 120" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 201 150 Q 215 125 220 110" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 200 150 Q 200 120 200 105" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Table & Interactivity Props -->
  <!-- Wooden Table Surface -->
  <path d="M 60 170 L 180 170 L 195 200 L 45 200 Z" fill="#334155" filter="url(#shadow)" />
  <path d="M 50 170 L 190 170 L 190 174 L 50 174 Z" fill="#475569" />
  <!-- Table Legs -->
  <rect x="65" y="200" width="8" height="25" fill="#1e293b" />
  <rect x="167" y="200" width="8" height="25" fill="#1e293b" />
  
  <!-- Coffee Mugs on Table -->
  <path d="M 95 160 C 93 155 97 150 102 150 C 107 150 111 155 109 160 Z" fill="#f8fafc" />
  <path d="M 109 153 C 113 153 113 158 109 158" stroke="#f8fafc" stroke-width="1.5" fill="none" />
  <ellipse cx="102" cy="160" rx="7" ry="2" fill="#94a3b8" />

  <!-- MAIN CHARACTERS -->

  <!-- CHARACTER 1 (Left): Asking for the truth ("Please tell me the truth") -->
  <g id="character-asking" transform="translate(15, 0)">
    <!-- Body / Torso -->
    <path d="M 50 175 C 50 145 75 140 85 140 C 95 140 120 145 120 175 Z" fill="url(#sweater1)" filter="url(#shadow)" />
    <!-- Collar -->
    <path d="M 70 140 Q 85 148 100 140" stroke="#bae6fd" stroke-width="3" fill="none" />

    <!-- Head & Neck -->
    <path d="M 77 135 L 93 135 L 95 145 L 75 145 Z" fill="#fdba74" />
    <circle cx="85" cy="115" r="20" fill="#fed7aa" />

    <!-- Hair (Neat Short Dark Hair) -->
    <path d="M 66 115 C 65 95 105 95 104 115 C 104 122 100 115 97 110 C 92 102 78 102 73 110 C 70 115 66 115 66 115 Z" fill="#1e293b" />

    <!-- Face Expression (Earnest, pleading, direct eye contact) -->
    <!-- Eyes (Expressive dots with highlight) -->
    <circle cx="78" cy="114" r="2.5" fill="#0f172a" />
    <circle cx="92" cy="114" r="2.5" fill="#0f172a" />
    <circle cx="79" cy="113" r="1" fill="#ffffff" />
    <circle cx="93" cy="113" r="1" fill="#ffffff" />
    <!-- Eyebrows (Slightly tilted up inward for sincere emotion) -->
    <path d="M 75 108 Q 78 106 82 109" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 88 109 Q 92 106 95 108" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Mouth (Slightly open, speaking earnestly) -->
    <path d="M 82 124 Q 85 127 88 124" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Blush -->
    <circle cx="74" cy="120" r="3" fill="#f43f5e" opacity="0.3" />
    <circle cx="96" cy="120" r="3" fill="#f43f5e" opacity="0.3" />

    <!-- Arms & Hands gesturing toward the other person -->
    <path d="M 55 155 Q 70 160 85 155" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Open Hand reaching out -->
    <circle cx="90" cy="153" r="5" fill="#fed7aa" />
  </g>


  <!-- CHARACTER 2 (Right): Confessing / Telling the truth (Hesitant, sincere posture) -->
  <g id="character-truth" transform="translate(100, 0)">
    <!-- Body / Torso (Leaning slightly forward in sincerity) -->
    <path d="M 45 175 C 45 145 70 140 80 140 C 90 140 115 145 115 175 Z" fill="url(#sweater2)" filter="url(#shadow)" />
    <!-- Collar -->
    <path d="M 65 140 Q 80 148 95 140" stroke="#fecdd3" stroke-width="3" fill="none" />

    <!-- Head & Neck -->
    <path d="M 72 135 L 88 135 L 90 145 L 70 145 Z" fill="#fcd34d" />
    <circle cx="80" cy="115" r="20" fill="#fde047" /> <!-- Warmer skin tone base -->
    <path d="M 68 112 C 68 95 92 95 92 112 C 92 120 85 118 80 118 C 75 118 68 120 68 112 Z" fill="#78350f" /> <!-- Brown hair -->

    <!-- Face Expression (Vulnerable, honest, looking down slightly then up) -->
    <!-- Eyes -->
    <circle cx="73" cy="115" r="2" fill="#78350f" />
    <circle cx="87" cy="115" r="2" fill="#78350f" />
    <!-- Soft Eyebrows -->
    <path d="M 70 109 Q 73 107 77 110" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 83 110 Q 87 107 90 109" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Gentle, honest smile / neutral honest mouth -->
    <path d="M 77 125 Q 80 127 83 125" stroke="#92400e" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Nervous/Earnest Blush -->
    <circle cx="68" cy="120" r="4" fill="#fb7185" opacity="0.4" />
    <circle cx="92" cy="120" r="4" fill="#fb7185" opacity="0.4" />

    <!-- Hand over heart gesture (Classic universal sign of truth/honesty) -->
    <path d="M 105 155 Q 90 165 75 155" stroke="#e11d48" stroke-width="11" stroke-linecap="round" fill="none" />
    <!-- Hand placed on chest -->
    <circle cx="75" cy="155" r="5" fill="#fcd34d" />
  </g>

  <!-- FOREGROUND / INTERACTION ELEMENTS (Visualizing "The Truth" concept cleanly without text) -->
  <!-- Subtle glowing floating elements indicating sincerity/openness (abstract light particles, not letters/symbols) -->
  <g opacity="0.8">
    <circle cx="120" cy="130" r="3" fill="#38bdf8" filter="url(#shadow)" />
    <circle cx="128" cy="122" r="2" fill="#fbbf24" filter="url(#shadow)" />
    <circle cx="112" cy="120" r="1.5" fill="#f43f5e" filter="url(#shadow)" />
    <!-- Gentle connecting curved light arc between the two people signifying honest communication -->
    <path d="M 105 125 Q 120 110 135 125" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6" />
  </g>

  <!-- Lighting overlay / Vignette frame inside rounded container -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>