<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Domino effect scene representing "leading to/causing" -->
  <g transform="translate(40, 120)">
    <!-- Domino 1 -->
    <rect x="0" y="0" width="20" height="60" rx="4" fill="#fb923c" transform="rotate(-20 10 60)"/>
    <!-- Domino 2 -->
    <rect x="35" y="10" width="20" height="60" rx="4" fill="#fbbf24" transform="rotate(-10 45 70)"/>
    <!-- Domino 3 -->
    <rect x="75" y="25" width="20" height="60" rx="4" fill="#10b981" transform="rotate(5 85 85)"/>
    <!-- Domino 4 (Falling) -->
    <rect x="120" y="40" width="20" height="60" rx="4" fill="#38bdf8" transform="rotate(35 130 100)"/>
    <!-- Domino 5 (The big impact) -->
    <rect x="160" y="60" width="20" height="60" rx="4" fill="#ec4899" transform="rotate(70 170 120)"/>
  </g>

  <!-- Impact/Action lines -->
  <path d="M180 140 L195 130 M185 155 L205 150" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ground plane -->
  <path d="M20 185 L220 185" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
</svg>