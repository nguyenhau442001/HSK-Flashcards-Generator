<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="lamp-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
    <clipPath id="canvas-clip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <!-- Full-bleed background -->
    <rect width="240" height="240" fill="url(#bg-grad)" />

    <!-- Ambient lighting / interior atmosphere -->
    <circle cx="120" cy="-20" r="140" fill="url(#lamp-glow)" />

    <!-- Window / City Bokeh in background -->
    <g opacity="0.3">
      <rect x="160" y="30" width="50" height="70" rx="8" fill="#334155" />
      <rect x="170" y="40" width="30" height="50" rx="4" fill="#475569" />
      <circle cx="185" cy="120" r="1.5" fill="#38bdf8" />
      <circle cx="195" cy="115" r="1" fill="#f59e0b" />
      <circle cx="170" cy="125" r="1.5" fill="#f59e0b" />
    </g>

    <!-- Coat rack / Hallway Prop -->
    <g opacity="0.4">
      <line x1="40" y1="20" x2="40" y2="220" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <path d="M30 50 L40 40 L50 50" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="40" cy="220" r="12" fill="#334155"/>
    </g>

    <!-- Warm atmospheric light beam -->
    <polygon points="120,0 20,240 220,240" fill="#fbbf24" opacity="0.03" />

    <!-- Character & Action: Draping a coat over shoulders ("khoác, choàng") -->
    <g transform="translate(0, 10)">
      
      <!-- Character Head & Hair -->
      <circle cx="120" cy="72" r="20" fill="#fbcfe8" />
      <!-- Stylish Hair -->
      <path d="M100 70 C100 55 110 50 120 50 C130 50 140 55 140 70 C140 75 142 85 145 90 C135 93 105 93 95 90 C98 85 100 75 100 70 Z" fill="#475569" />
      <path d="M105 60 C110 52 125 52 135 58 C130 52 115 52 105 60 Z" fill="#64748b" />

      <!-- Character Body (Back/Three-quarter view facing away towards the room) -->
      <ellipse cx="120" cy="130" rx="30" ry="35" fill="#38bdf8" />

      <!-- Arms lifting up slightly to drape the coat -->
      <path d="M90 115 C75 120 70 140 75 145" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" />
      <path d="M150 115 C165 120 170 140 165 145" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" />

      <!-- The Main Action Object: The Coat being draped ("khoác") -->
      <!-- Draped Winter Coat, dynamic folds, rich warm color -->
      <g>
        <!-- Coat Back -->
        <path d="M90 98 L150 98 L162 165 L145 190 L95 190 L78 165 Z" fill="url(#coat-grad)" />
        
        <!-- Coat Collar folded nicely around neck -->
        <path d="M105 95 L120 108 L135 95 L142 102 L120 118 L98 102 Z" fill="#9f1239" />

        <!-- Coat Sleeves draped over shoulders -->
        <path d="M85 96 C65 105 60 130 70 145 C75 145 80 130 90 115 Z" fill="#e11d48" />
        <path d="M155 96 C175 105 180 130 170 145 C165 145 160 130 150 115 Z" fill="#e11d48" />

        <!-- Dynamic motion/draping lines (folds) -->
        <path d="M105 110 L100 175" stroke="#9f1239" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
        <path d="M135 110 L140 175" stroke="#9f1239" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
        <path d="M120 115 L120 185" stroke="#ffe4e6" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      </g>

    </g>

    <!-- Foreground Environment Props (Adding Tangible Context) -->
    <!-- Cozy floor surface -->
    <rect x="0" y="210" width="240" height="30" fill="#0f172a" />
    <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" />

    <!-- Potted plant for lifestyle atmosphere -->
    <g transform="translate(30, 160)">
      <path d="M10 30 L20 50 L0 50 Z" fill="#cbd5e1" />
      <ellipse cx="10" cy="30" rx="10" ry="3" fill="#94a3b8" />
      <!-- Plant stems and leaves -->
      <path d="M10 30 C5 15 0 10 -5 5" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <path d="M10 30 C15 10 25 5 30 0" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
      <path d="M10 30 C10 15 15 5 12 0" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Floating cozy sparkles / dust motes in the warm light -->
    <circle cx="90" cy="80" r="1.5" fill="#fef08a" opacity="0.8" />
    <circle cx="150" cy="70" r="2" fill="#fef08a" opacity="0.6" />
    <circle cx="110" cy="40" r="1" fill="#fef08a" opacity="0.9" />
    <circle cx="140" cy="130" r="1.5" fill="#fef08a" opacity="0.7" />

  </g>
</svg>