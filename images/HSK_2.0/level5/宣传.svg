<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="posterGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="posterGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Ambient background glow representing school campus evening or indoor hall -->
  <circle cx="120" cy="120" r="100" fill="url(#warmLight)" />

  <!-- ENVIRONMENT: School Bulletin Board / Campus Wall context -->
  <!-- Main Wall Panel / Notice Board Structure -->
  <rect x="25" y="35" width="190" height="170" rx="8" fill="#090d16" opacity="0.5" />
  <rect x="30" y="40" width="180" height="160" rx="6" fill="url(#boardGradient)" stroke="#475569" stroke-width="2" filter="url(#softShadow)" />
  
  <!-- Cork / Board Inner Texture Elements (School notice board) -->
  <rect x="42" y="52" width="156" height="136" rx="4" fill="#1e293b" />

  <!-- POSTERS & NEW POLICIES (Representing 宣传 - Campaign/Promotion of new policies) -->
  <!-- Poster 1: New Policy Flyer (Blue) -->
  <g transform="rotate(-3 80 100)" filter="url(#softShadow)">
    <rect x="48" y="62" width="60" height="75" rx="3" fill="url(#posterGrad1)" />
    <!-- Abstract layout of policy document: header, bullet lines, highlight circle -->
    <circle cx="78" cy="80" r="10" fill="#bae6fd" opacity="0.9" />
    <rect x="58" y="96" width="40" height="4" rx="2" fill="#ffffff" opacity="0.8" />
    <rect x="58" y="105" width="30" height="3" rx="1.5" fill="#bae6fd" opacity="0.7" />
    <rect x="58" y="113" width="35" height="3" rx="1.5" fill="#bae6fd" opacity="0.7" />
    <!-- Pin -->
    <circle cx="78" cy="62" r="3" fill="#fbbf24" />
  </g>

  <!-- Poster 2: Event/Policy Flyer (Red/Pink accent) -->
  <g transform="rotate(4 140 100)" filter="url(#softShadow)">
    <rect x="115" y="68" width="65" height="80" rx="3" fill="url(#posterGrad2)" />
    <!-- Abstract graphics: Star/Badge & data bars -->
    <polygon points="147.5,78 151,87 160,88 153,94 155,102 147.5,98 140,102 142,94 135,88 144,87" fill="#fde047" />
    <rect x="125" y="110" width="45" height="4" rx="2" fill="#ffffff" opacity="0.9" />
    <rect x="125" y="119" width="30" height="3" rx="1.5" fill="#fecdd3" opacity="0.8" />
    <!-- Pin -->
    <circle cx="147.5" cy="68" r="3" fill="#fbbf24" />
  </g>

  <!-- Small decorative photos / info cards on board -->
  <rect x="155" y="152" width="30" height="25" rx="2" fill="#334155" transform="rotate(-5 170 165)" />
  <rect x="55" y="145" width="35" height="25" rx="2" fill="#334155" transform="rotate(6 72 157)" />
  <circle cx="72" cy="145" r="2.5" fill="#ef4444" />

  <!-- FOREGROUND: School representatives / students actively promoting (宣传) -->
  <!-- Character 1 (Left - Student/Staff holding brochures/pointing) -->
  <g transform="translate(15, 110)" filter="url(#softShadow)">
    <!-- Body / Torso (Teal jacket / School uniform) -->
    <path d="M 35 70 C 35 55 45 45 60 45 C 75 45 85 55 85 70 L 90 90 L 30 90 Z" fill="#0d9488" />
    <!-- Collar / Inner shirt -->
    <path d="M 52 45 L 60 56 L 68 45 Z" fill="#f8fafc" />
    <!-- Head & Hair -->
    <circle cx="60" cy="30" r="15" fill="#fbcfe8" /> <!-- Skin tone -->
    <!-- Friendly smiling face features -->
    <path d="M 55 28 Q 60 32 65 28" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="54" cy="25" r="1.5" fill="#334155" />
    <circle cx="66" cy="25" r="1.5" fill="#334155" />
    <!-- Stylish short hair -->
    <path d="M 45 30 C 45 18 53 15 60 15 C 67 15 75 18 75 30 C 75 30 72 22 60 22 C 48 22 45 30 45 30 Z" fill="#334155" />
    
    <!-- Arm pointing or holding flyers -->
    <path d="M 75 55 C 85 60 95 65 100 60" stroke="#0d9488" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="102" cy="58" r="5" fill="#fbcfe8" />
  </g>

  <!-- Character 2 (Right - Presenting/Explaining policy proudly with gesture) -->
  <g transform="translate(125, 95)" filter="url(#softShadow)">
    <!-- Body / Torso (Warm Orange/Coral sweater - approachable teacher/ambassador) -->
    <path d="M 35 75 C 35 60 45 50 60 50 C 75 50 85 60 85 75 L 95 95 L 25 95 Z" fill="#fb923c" />
    <!-- Collar -->
    <path d="M 50 50 L 60 60 L 70 50 Z" fill="#fff7ed" />
    <!-- Head & Hair -->
    <circle cx="60" cy="32" r="15" fill="#fbcfe8" />
    <!-- Face -->
    <path d="M 55 31 Q 60 35 65 31" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="54" cy="28" r="1.5" fill="#334155" />
    <circle cx="66" cy="28" r="1.5" fill="#334155" />
    <!-- Hair (Bun style) -->
    <circle cx="60" cy="14" r="6" fill="#1e293b" />
    <path d="M 44 32 C 44 18 52 16 60 16 C 68 16 76 18 76 32 C 72 26 48 26 44 32 Z" fill="#1e293b" />
    
    <!-- Raised arm gesturing towards the new policy board -->
    <path d="M 40 60 C 25 50 20 35 25 30" stroke="#fb923c" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="25" cy="27" r="5" fill="#fbcfe8" />
  </g>

  <!-- Props: Modern tablet / clipboard showing policy details held in center -->
  <g transform="translate(95, 150)" filter="url(#softShadow)">
    <!-- Tablet body -->
    <rect x="0" y="0" width="50" height="35" rx="4" fill="#38bdf8" stroke="#f8fafc" stroke-width="2" />
    <!-- Screen content -->
    <rect x="5" y="5" width="40" height="25" rx="2" fill="#0f172a" />
    <circle cx="15" cy="12" r="4" fill="#f43f5e" />
    <rect x="23" y="10" width="18" height="3" rx="1" fill="#f8fafc" />
    <rect x="23" y="16" width="12" height="2" rx="1" fill="#94a3b8" />
  </g>

  <!-- Ambient lighting/sparkles representing successful active communication / school campaign -->
  <g fill="#fbbf24">
    <circle cx="35" cy="95" r="2" opacity="0.8" />
    <circle cx="205" cy="85" r="2.5" opacity="0.9" />
    <circle cx="190" cy="45" r="1.5" opacity="0.7" />
    <circle cx="50" cy="30" r="2" opacity="0.8" />
  </g>

  <!-- Bottom ledge / Floor shadow to ground the scene -->
  <rect x="20" y="205" width="200" height="6" rx="3" fill="#090d16" opacity="0.6" />
</svg>