<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and lighting effects -->
  <defs>
    <!-- Background night sky gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="60%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#3A506B"/>
    </linearGradient>

    <!-- Warm interior room gradient -->
    <linearGradient id="roomWarmth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192231"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Warm golden glow from the window -->
    <radialGradient id="windowGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>

    <!-- Lamp glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FBBF24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Character sweater gradient -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>

    <!-- Scarf gradient -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Full bleed container background -->
  <rect width="240" height="240" rx="24" fill="url(#roomWarmth)"/>

  <!-- Outdoor night sky visible through the large window -->
  <path d="M120 20 L210 20 L210 160 L120 160 Z" fill="url(#nightSky)"/>
  
  <!-- Distant night cityscape silhouettes outside -->
  <path d="M130 160 L130 135 L140 135 L140 160 Z M145 160 L145 120 L160 120 L160 160 Z M165 160 L165 140 L180 140 L180 160 Z M185 160 L185 110 L205 110 L205 160 Z" fill="#0F172A" opacity="0.7"/>

  <!-- Ambient window glow inside -->
  <rect x="120" y="20" width="90" height="140" fill="url(#windowGlow)"/>

  <!-- Window Frame -->
  <!-- Outer sill / recess -->
  <rect x="116" y="16" width="98" height="148" rx="3" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Inner grid -->
  <line x1="120" y1="90" x2="210" y2="90" stroke="#334155" stroke-width="3"/>
  <line x1="165" y1="20" x2="165" y2="160" stroke="#334155" stroke-width="3"/>

  <!-- SNOWFLAKES DRIFTING (PIĀO - 飘) IN THE AIR -->
  <!-- Soft blurred background snowflakes -->
  <circle cx="135" cy="45" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="190" cy="55" r="2" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="150" cy="115" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="180" cy="130" r="2" fill="#FFFFFF" opacity="0.5"/>

  <!-- Main prominent swirling/drifting snowflakes (representing 'piāo') -->
  <!-- Snowflake 1 (floating near window pane, angled) -->
  <g transform="translate(145, 65) rotate(15)">
    <path d="M0 -6 L0 6 M-5 -3 L5 3 M-5 3 L5 -3" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Snowflake 2 (drifting gracefully mid-air inside room/near sill) -->
  <g transform="translate(105, 105) rotate(45)">
    <path d="M-7 0 L7 0 M0 -7 L0 7 M-5 -5 L5 5 M-5 5 L5 -5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Snowflake 3 (floating gently above the windowsill) -->
  <g transform="translate(130, 140) rotate(-20)">
    <path d="M-5 0 L5 0 M0 -5 L0 5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Snowflake 4 (high up near upper window corner) -->
  <g transform="translate(195, 35) rotate(30)">
    <path d="M-6 0 L6 0 M0 -6 L0 6 M-4 -4 L4 4 M-4 4 L4 -4" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Interior Wall & Bookshelf Context -->
  <!-- Bookshelf on left wall -->
  <rect x="15" y="40" width="45" height="8" rx="2" fill="#475569"/>
  <rect x="22" y="48" width="6" height="15" rx="1" fill="#EF4444"/>
  <rect x="30" y="46" width="7" height="17" rx="1" fill="#3B82F6"/>
  <rect x="39" y="49" width="5" height="14" rx="1" fill="#10B981"/>

  <rect x="15" y="90" width="50" height="8" rx="2" fill="#475569"/>
  <!-- Small house plant on lower shelf -->
  <path d="M25 90 C25 80, 35 80, 35 90 Z" fill="#10B981"/>
  <path d="M30 84 C26 78, 22 82, 25 85 Z" fill="#34D399"/>
  <path d="M30 84 C34 78, 38 82, 35 85 Z" fill="#34D399"/>
  <rect x="27" y="90" width="6" height="7" rx="1" fill="#F8FAFC"/>

  <!-- Wooden windowsill extending inward -->
  <path d="M100 160 L226 160 L220 168 L106 168 Z" fill="#64748B"/>
  <path d="M103 168 L223 168 L223 172 L103 172 Z" fill="#475569"/>
  
  <!-- Warm Mug on Windowsill with Steam -->
  <rect x="195" y="142" width="16" height="18" rx="3" fill="#F8FAFC"/>
  <path d="M211 146 C215 146, 215 156, 211 156" fill="none" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam wisps rising -->
  <path d="M200 137 C202 133, 198 130, 201 126" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M206 138 C208 134, 204 131, 207 127" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Cozy Desk / Table below -->
  <rect x="60" y="190" width="180" height="50" fill="#334155"/>
  <rect x="50" y="180" width="190" height="12" rx="3" fill="#475569"/>

  <!-- Character (Cozy indoor observer, smiling, looking out the window at the drifting snow) -->
  <g transform="translate(60, 95)">
    <!-- Body / Torso in cozy sweater -->
    <path d="M20 95 C20 75, 45 75, 50 95 L65 115 L5 115 Z" fill="url(#sweaterGrad)"/>
    
    <!-- Arms leaning on windowsill -->
    <!-- Left arm -->
    <path d="M15 95 Q30 95, 42 85" fill="none" stroke="#BE185D" stroke-width="12" stroke-linecap="round"/>
    <!-- Right arm -->
    <path d="M50 95 Q62 90, 72 82" fill="none" stroke="#BE185D" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Hands resting -->
    <circle cx="43" cy="83" r="6" fill="#FCD34D"/>
    <circle cx="73" cy="80" r="6" fill="#FCD34D"/>

    <!-- Neck -->
    <rect x="28" y="65" width="12" height="14" fill="#FCD34D"/>

    <!-- Cozy Scarf wrapped around neck -->
    <path d="M22 72 C25 65, 39 65, 42 72 C44 77, 39 82, 32 82 C25 82, 20 77, 22 72 Z" fill="url(#scarfGrad)"/>
    <path d="M38 78 L45 98 L37 100 L32 80 Z" fill="url(#scarfGrad)"/>

    <!-- Head & Hair -->
    <!-- Back hair / hair base -->
    <circle cx="34" cy="46" r="20" fill="#33211D"/>
    <!-- Face structure -->
    <circle cx="34" cy="48" r="17" fill="#FDE68A"/>

    <!-- Hair bangs style -->
    <path d="M18 42 C20 30, 48 30, 50 42 C45 38, 23 38, 18 42 Z" fill="#33211D"/>
    <circle cx="19" cy="45" r="4" fill="#33211D"/>
    <circle cx="49" cy="45" r="4" fill="#33211D"/>

    <!-- Facial Expression (Happy, amazed, serene) -->
    <!-- Gentle curved happy closed eyes (enjoying the winter view) -->
    <path d="M24 47 Q27 51, 30 47" fill="none" stroke="#33211D" stroke-width="2" stroke-linecap="round"/>
    <path d="M38 47 Q41 51, 44 47" fill="none" stroke="#33211D" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Rosy cheeks -->
    <circle cx="23" cy="51" r="3.5" fill="#F43F5E" opacity="0.4"/>
    <circle cx="45" cy="51" r="3.5" fill="#F43F5E" opacity="0.4"/>

    <!-- Gentle happy smile -->
    <path d="M31 54 Q34 57, 37 54" fill="none" stroke="#33211D" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Warm Hanging Lamp casting light from top left -->
  <path d="M25 0 L35 0 L32 25 L28 25 Z" fill="#64748B"/>
  <ellipse cx="30" cy="25" rx="10" ry="4" fill="#475569"/>
  <circle cx="30" cy="27" r="6" fill="url(#lampGlow)"/>

  <!-- Additional delicate falling snow flakes inside the room near window edge -->
  <circle cx="118" cy="80" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="125" cy="120" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="140" cy="95" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="165" cy="145" r="2" fill="#FFFFFF" opacity="0.5"/>

</svg>