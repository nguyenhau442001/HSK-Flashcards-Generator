<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Glow Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Wood Texture / Color Gradients -->
    <linearGradient id="logMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="logEnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="tableTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="tableLeg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Window & Ambient Light -->
  <path d="M 140 30 L 210 30 L 210 110 L 140 110 Z" fill="url(#windowGlow)" />
  <path d="M 145 35 L 205 35 L 205 105 L 145 105 Z" fill="#334155" opacity="0.4" />
  <!-- Window frames -->
  <line x1="175" y1="35" x2="175" y2="105" stroke="#1e293b" stroke-width="3" />
  <line x1="145" y1="70" x2="205" y2="70" stroke="#1e293b" stroke-width="3" />

  <!-- Background Workshop Wall & Floor -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#0f172a" stroke-width="3" />
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="#0b0f19" opacity="0.6"/>

  <!-- Wallpaper / Workshop props background (Shelves & Tools) -->
  <rect x="25" y="45" width="60" height="8" rx="4" fill="#334155" />
  <circle cx="45" cy="53" r="8" fill="#38bdf8" opacity="0.8" />
  <rect x="65" y="30" width="6" height="15" rx="2" fill="#fb923c" />

  <!-- SCENE SUBJECT: The Wooden Table (Cái bàn được làm bằng gỗ) -->
  <g filter="url(#shadow)">
    <!-- Table Legs (Back) -->
    <rect x="55" y="145" width="12" height="50" rx="3" fill="url(#tableLeg)" />
    <rect x="173" y="145" width="12" height="50" rx="3" fill="url(#tableLeg)" />

    <!-- Table Legs (Front) -->
    <rect x="40" y="155" width="14" height="65" rx="3" fill="url(#tableLeg)" />
    <rect x="186" y="155" width="14" height="65" rx="3" fill="url(#tableLeg)" />

    <!-- Table Top (Thick Wood Slab) -->
    <path d="M 25 140 L 215 140 L 225 155 L 15 155 Z" fill="#78350f" />
    <path d="M 20 130 L 220 130 L 220 142 L 20 142 Z" fill="url(#tableTop)" />
    <!-- Wood grain accent lines on table -->
    <path d="M 40 136 C 80 134, 120 138, 180 135" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 60 139 C 100 137, 140 141, 200 138" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- FOREGROUND WOODEN PROPS (Logs & Planks emphasizing 'Gỗ') -->
  <!-- Stack of Raw Logs on the Floor / Against Table -->
  <g filter="url(#shadow)">
    <!-- Log 1 (Bottom Left) -->
    <rect x="20" y="180" width="75" height="26" rx="12" fill="url(#logMain)" />
    <ellipse cx="20" cy="193" rx="5" ry="13" fill="url(#logEnd)" />
    <ellipse cx="20" cy="193" rx="2" ry="6" fill="#78350f" opacity="0.5" />

    <!-- Log 2 (Stacked on Log 1) -->
    <rect x="30" y="158" width="65" height="24" rx="11" fill="url(#logMain)" />
    <ellipse cx="30" cy="170" rx="4.5" ry="12" fill="url(#logEnd)" />
    <!-- Bark texture details -->
    <path d="M 45 158 Q 50 170 45 182" stroke="#78350f" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 70 158 Q 75 170 70 182" stroke="#78350f" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- ON THE TABLE: Wooden Block, Woodworking Plane / Tools -->
  <g filter="url(#shadow)">
    <!-- A standing carved wooden pillar block -->
    <path d="M 120 85 L 145 85 L 140 130 L 125 130 Z" fill="url(#logMain)" />
    <ellipse cx="132.5" cy="85" rx="12.5" ry="5" fill="url(#logEnd)" />

    <!-- Woodworking Hand Plane (Cái bào gỗ) resting on table -->
    <g transform="translate(65, 95) rotate(-10)">
      <rect x="0" y="0" width="55" height="24" rx="6" fill="#b45309" />
      <rect x="8" y="4" width="39" height="16" rx="3" fill="#d97706" />
      <!-- Metal blade -->
      <path d="M 28 2 L 38 22 L 32 23 L 23 4 Z" fill="#94a3b8" />
      <!-- Wooden handle -->
      <path d="M 43 4 C 48 4, 52 8, 50 16 C 49 19, 45 20, 43 20 Z" fill="#78350f" />
    </g>

    <!-- Wood shavings (dăm bào) curling artistically -->
    <path d="M 105 125 Q 115 110 125 122 T 145 120" stroke="#fde68a" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 135 128 Q 142 118 152 125" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Decorative Warm Ambient Elements & Highlights -->
  <circle cx="180" cy="80" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="195" cy="65" r="1.5" fill="#f59e0b" opacity="0.6" />
  <circle cx="150" cy="50" r="2.5" fill="#fbbf24" opacity="0.5" />

  <!-- Action Spark / Craftsmanship Glow -->
  <path d="M 100 100 L 104 108 L 112 112 L 104 116 L 100 124 L 96 116 L 88 112 L 96 108 Z" fill="url(#amberGlow)" />

</svg>