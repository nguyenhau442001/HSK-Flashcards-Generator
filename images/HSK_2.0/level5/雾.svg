<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient for Night/Early Morning Mist -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Amber Glow for Streetlamp -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Fog Layer Gradients -->
    <linearGradient id="fogGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="fogGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f1f5f9" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- BACKGROUND BUILDINGS (Silhouettes in Heavy Fog) -->
  <g fill="#1e293b" opacity="0.6">
    <rect x="20" y="90" width="35" height="110" rx="2" />
    <rect x="65" y="70" width="45" height="130" rx="2" />
    <rect x="130" y="100" width="50" height="100" rx="2" />
    <rect x="190" y="80" width="30" height="120" rx="2" />
  </g>

  <!-- DISTANT AMBIENT LIGHTS (Blurred through heavy fog) -->
  <circle cx="85" cy="110" r="12" fill="#ef4444" opacity="0.3" filter="blur(4px)" />
  <circle cx="150" cy="130" r="14" fill="#38bdf8" opacity="0.25" filter="blur(4px)" />
  <circle cx="37" cy="120" r="10" fill="#f59e0b" opacity="0.2" filter="blur(3px)" />

  <!-- STREET ENVIRONMENT (Pavement & Curb) -->
  <rect x="0" y="190" width="240" height="50" fill="#0f172a" />
  <path d="M 0 190 L 240 190" stroke="#334155" stroke-width="2" />
  <!-- Sidewalk Texture -->
  <line x1="50" y1="210" x2="80" y2="240" stroke="#1e293b" stroke-width="3" />
  <line x1="150" y1="210" x2="190" y2="240" stroke="#1e293b" stroke-width="3" />

  <!-- MODERN STREETLAMP (Context Prop) -->
  <g>
    <!-- Pole -->
    <rect x="195" y="50" width="6" height="145" fill="#334155" rx="1" />
    <!-- Lamp Head -->
    <path d="M 185 50 L 211 50 L 218 62 L 178 62 Z" fill="#475569" />
    <path d="M 194 62 L 202 62 L 202 66 L 194 66 Z" fill="#64748b" />
    <!-- Light Beam / Cone in Fog -->
    <polygon points="198,66 110,210 240,210" fill="url(#lampGlow)" opacity="0.8" style="mix-blend-mode: screen;" />
    <!-- Bulb Glow Circle -->
    <circle cx="198" cy="65" r="8" fill="#fef08a" />
  </g>

  <!-- FOG LAYER - DEEP (Behind Character) -->
  <rect x="0" y="0" width="240" height="240" fill="url(#fogGrad1)" pointer-events="none" />
  <ellipse cx="120" cy="160" rx="90" ry="35" fill="url(#fogGrad2)" filter="blur(6px)" />

  <!-- MAIN CHARACTER: Commuter experiencing '大雾' (Dense Fog) -->
  <g transform="translate(10, 15)">
    <!-- Shadow -->
    <ellipse cx="90" cy="183" rx="22" ry="6" fill="#020617" opacity="0.5" />

    <!-- Legs & Boots -->
    <g fill="#334155">
      <!-- Back Leg -->
      <rect x="80" y="150" width="9" height="32" rx="4" />
      <!-- Front Leg -->
      <rect x="94" y="148" width="10" height="34" rx="4" />
      <!-- Shoes -->
      <path d="M 74 180 C 74 177 79 176 83 176 L 91 176 C 93 176 93 182 90 182 L 76 182 Z" fill="#1e293b" />
      <path d="M 90 180 C 90 177 95 175 101 175 L 107 175 C 109 175 109 182 106 182 L 92 182 Z" fill="#1e293b" />
    </g>

    <!-- Coat / Jacket (Warm Winter Outfit for Foggy Morning) -->
    <path d="M 72 105 L 114 105 L 120 152 L 68 152 Z" fill="#0284c7" />
    <!-- Coat Lapels & Details -->
    <path d="M 93 105 L 93 145" stroke="#0369a1" stroke-width="2" />
    <path d="M 76 108 L 93 125 L 110 108" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
    <!-- Buttons -->
    <circle cx="93" cy="130" r="1.5" fill="#e0f2fe" />
    <circle cx="93" cy="142" r="1.5" fill="#e0f2fe" />

    <!-- Scarf (Snug winter prop) -->
    <path d="M 83 96 C 83 93 103 93 103 96 C 103 100 83 100 83 96 Z" fill="#ec4899" />
    <path d="M 97 98 L 102 120 L 93 122 L 90 102 Z" fill="#db2777" />

    <!-- Head & Face (Expression: Wonder / Squinting through fog) -->
    <circle cx="93" cy="80" r="14" fill="#ffedd5" />
    <!-- Hair -->
    <path d="M 79 78 C 79 70 87 66 94 66 C 103 66 108 72 108 80 L 108 83 L 79 83 Z" fill="#334155" />
    <!-- Eyes (Squinting slightly due to thick mist) -->
    <line x1="88" y1="78" x2="92" y2="79" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="95" y1="79" x2="99" y2="78" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="87" cy="83" r="2.5" fill="#fca5a5" opacity="0.6" />
    <circle cx="100" cy="83" r="2.5" fill="#fca5a5" opacity="0.6" />
    <!-- Curious/Surprised Mouth -->
    <circle cx="94" cy="86" r="1.5" fill="#991b1b" />

    <!-- Arms & Holding Briefcase / Bag -->
    <!-- Back Arm -->
    <path d="M 75 110 L 68 130" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <!-- Front Arm (Holding strap) -->
    <path d="M 111 110 L 118 128" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="119" cy="131" r="3.5" fill="#ffedd5" />

    <!-- Briefcase / Messenger Bag -->
    <rect x="110" y="128" width="22" height="16" rx="3" fill="#78350f" />
    <path d="M 115 128 L 115 125 C 115 123 123 123 123 125 L 123 128" fill="none" stroke="#92400e" stroke-width="2" />
    <rect x="118" y="133" width="6" height="4" rx="1.5" fill="#fbbf24" />
  </g>

  <!-- FOREGROUND FOG SWIRLS (Enhancing the '大雾' atmosphere) -->
  <path d="M -10 170 Q 50 150 110 180 T 250 160 L 250 240 L -10 240 Z" fill="url(#fogGrad2)" opacity="0.6" />
  <path d="M 0 130 Q 80 110 150 140 T 240 120" fill="none" stroke="#f1f5f9" stroke-width="18" opacity="0.25" filter="blur(8px)" />
  <path d="M 20 80 Q 90 60 180 100 T 240 80" fill="none" stroke="#cbd5e1" stroke-width="25" opacity="0.2" filter="blur(10px)" />
</svg>