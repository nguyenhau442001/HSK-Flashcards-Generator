<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mountain Peak Gradients -->
    <linearGradient id="mtnBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="mtnFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="mtnShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Climber Colors -->
    <linearGradient id="climberSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow & Effects -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements -->
  <circle cx="180" cy="80" r="60" fill="url(#sunGlow)" />
  
  <!-- Stars / Sparkles -->
  <circle cx="50" cy="40" r="1.5" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="90" cy="30" r="1" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="210" cy="45" r="1.2" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="30" cy="90" r="1" fill="#e2e8f0" opacity="0.4"/>

  <!-- Distant Mountains -->
  <polygon points="10,210 70,120 130,210" fill="url(#mtnBack)" />
  <polygon points="110,210 160,100 220,210" fill="#1e293b" opacity="0.7" />

  <!-- Clouds Background -->
  <path d="M 20 150 Q 30 140 50 145 Q 70 135 90 145 Q 110 140 120 150 Z" fill="#334155" opacity="0.3" />
  <path d="M 140 170 Q 155 160 175 165 Q 195 155 215 165 Q 230 160 235 170 Z" fill="#334155" opacity="0.3" />

  <!-- MAIN PEAK (The Challenge) -->
  <!-- Left Shadow Side -->
  <polygon points="120,30 50,210 120,210" fill="url(#mtnShadow)" />
  <!-- Right Lit Side -->
  <polygon points="120,30 120,210 200,210" fill="url(#mtnFront)" />

  <!-- Mountain Snow Cap -->
  <path d="M 120,30 L 138,75 L 128,72 L 118,82 L 105,70 Z" fill="#f8fafc" opacity="0.9" />

  <!-- Rocky Textures & Crevasses -->
  <path d="M 120,30 L 120,210" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <path d="M 100,110 L 120,125 L 110,140" fill="none" stroke="#78350f" stroke-width="2.5" opacity="0.4" />
  <path d="M 140,150 L 155,165 L 145,180" fill="none" stroke="#92400e" stroke-width="2.5" opacity="0.4" />
  <path d="M 80,170 L 95,185" fill="none" stroke="#78350f" stroke-width="2" opacity="0.4" />

  <!-- Cliff Flag (Summit Achievement) -->
  <line x1="120" y1="30" x2="120" y2="12" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="120,12 142,20 120,28" fill="#ec4899" />

  <!-- CLIMBER & GEAR (Action) -->
  <!-- Safety Rope -->
  <path d="M 120,15 Q 100,50 85,115" fill="none" stroke="url(#ropeGrad)" stroke-width="2" stroke-dasharray="3,3" />
  <path d="M 85,115 L 75,145" fill="none" stroke="url(#ropeGrad)" stroke-width="2" />

  <!-- Climber Character -->
  <g transform="translate(68, 120)">
    <!-- Backpack -->
    <rect x="-6" y="8" width="12" height="16" rx="4" fill="#fb923c" />
    
    <!-- Body / Suit -->
    <path d="M -4,10 L 4,10 L 6,24 L -6,24 Z" fill="url(#climberSuit)" />

    <!-- Limbs (Climbing Pose) -->
    <!-- Back Leg -->
    <line x1="-2" y1="22" x2="-10" y2="35" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <!-- Front Leg (Reaching for foothold) -->
    <line x1="2" y1="22" x2="12" y2="28" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <circle cx="12" cy="28" r="2" fill="#94a3b8" /> <!-- Crampon -->

    <!-- Back Arm -->
    <line x1="-4" y1="12" x2="-14" y2="18" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Front Arm (Ice Axe Swing) -->
    <path d="M 4,12 L 15,4" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <!-- Ice Axe -->
    <line x1="12" y1="7" x2="18" y2="-2" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 16,-4 L 21,-2 L 18,2 Z" fill="#e2e8f0" />

    <!-- Head & Helmet -->
    <circle cx="0" cy="2" r="6" fill="#f8fafc" />
    <path d="M -6,2 A 6 6 0 0 1 6,2 Z" fill="#ec4899" /> <!-- Helmet -->
    <rect x="-3" y="2" width="6" height="3" rx="1.5" fill="#0f172a" /> <!-- Goggles -->
  </g>

  <!-- Foreground Atmospheric Rocks & Details -->
  <!-- Left Rock Outcrop -->
  <path d="M 0,240 L 0,200 Q 25,190 45,210 Q 30,230 0,240 Z" fill="#0f172a" />
  <path d="M 15,240 L 15,215 Q 30,205 45,210" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Right Rock Outcrop -->
  <path d="M 240,240 L 240,190 Q 210,185 190,210 Q 220,230 240,240 Z" fill="#0f172a" />

  <!-- Floating Debris / Dust / Sparks near climber -->
  <circle cx="95" cy="110" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="65" cy="140" r="1" fill="#fbbf24" opacity="0.6" />
  <circle cx="105" cy="155" r="2" fill="#fbbf24" opacity="0.9" />
  <circle cx="55" cy="100" r="1.2" fill="#38bdf8" opacity="0.7" />

  <!-- Small compass/star navigation accent top-left -->
  <g transform="translate(35, 35)" opacity="0.8">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#fbbf24" />
    <circle cx="0" cy="0" r="2.5" fill="#f8fafc" />
  </g>
</svg>