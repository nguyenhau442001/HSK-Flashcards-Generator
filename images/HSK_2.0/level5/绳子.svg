<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Workshop Environment Details (Background) -->
  <g opacity="0.4">
    <!-- Shelves & Tools on Wall -->
    <rect x="30" y="40" width="70" height="4" rx="2" fill="#64748b"/>
    <rect x="140" y="55" width="70" height="4" rx="2" fill="#64748b"/>
    <!-- Hanging tools silhouettes -->
    <path d="M50 44 L50 60 M65 44 L65 55 M160 59 L160 75" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="62" r="3" fill="#94a3b8"/>
    <!-- Window with warm light -->
    <rect x="180" y="80" width="35" height="50" rx="4" fill="#38bdf8" opacity="0.15"/>
    <path d="M197 80 L197 130 M180 105 L215 105" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Floor Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <ellipse cx="120" cy="185" rx="90" ry="12" fill="#020617" opacity="0.5"/>

  <!-- Character Back/Body (Working at table/box) -->
  <g transform="translate(0, 5)">
    <!-- Shadow beneath box and person -->
    <ellipse cx="120" cy="180" rx="65" ry="10" fill="#000000" opacity="0.4"/>

    <!-- Open/Sturdy Moving Box on Floor/Table -->
    <g filter="url(#shadow)">
      <!-- Box Back Flaps -->
      <path d="M75 125 L95 105 L145 105 L165 125 Z" fill="#b45309"/>
      <!-- Box Main Body -->
      <path d="M75 125 L165 125 L165 175 L75 175 Z" fill="url(#boxGrad)"/>
      <!-- Box Front Flaps Open -->
      <path d="M75 125 L60 110 L85 110 L95 125 Z" fill="url(#boxTopGrad)"/>
      <path d="M165 125 L180 110 L155 110 L145 125 Z" fill="url(#boxTopGrad)"/>
      <!-- Tape seam center -->
      <line x1="120" y1="125" x2="120" y2="175" stroke="#78350f" stroke-width="2" opacity="0.6"/>
      <!-- Box Inner Darkness -->
      <path d="M85 125 L155 125 L150 135 L90 135 Z" fill="#451a03"/>
    </g>

    <!-- Character Arms & Hands tying the rope around the box -->
    <g>
      <!-- Left Arm / Sleeve -->
      <path d="M60 145 C70 135, 90 135, 105 145" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>
      <!-- Left Hand -->
      <circle cx="105" cy="146" r="6" fill="#fcd34d"/>

      <!-- Right Arm / Sleeve -->
      <path d="M180 145 C170 135, 150 135, 135 145" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>
      <!-- Right Hand -->
      <circle cx="135" cy="146" r="6" fill="#fcd34d"/>
    </g>

    <!-- THE TARGET OBJECT: 绳子 (The Rope tightly bound around the box) -->
    <g filter="url(#shadow)">
      <!-- Vertical rope segment wrapping box -->
      <path d="M110 115 L110 175" fill="none" stroke="url(#ropeGrad)" stroke-width="6" stroke-linecap="round"/>
      <path d="M130 115 L130 175" fill="none" stroke="url(#ropeGrad)" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Horizontal rope segment wrapping box -->
      <path d="M70 150 C90 145, 150 145, 170 150" fill="none" stroke="url(#ropeGrad)" stroke-width="6" stroke-linecap="round"/>

      <!-- Active tying knot in the center (Action focal point) -->
      <circle cx="120" cy="148" r="9" fill="#d97706"/>
      <circle cx="120" cy="148" r="6" fill="#f59e0b"/>
      <!-- Knot loops / ends -->
      <path d="M120 148 C115 135, 105 138, 112 143" fill="none" stroke="url(#ropeGrad)" stroke-width="5" stroke-linecap="round"/>
      <path d="M120 148 C125 135, 135 138, 128 143" fill="none" stroke="url(#ropeGrad)" stroke-width="5" stroke-linecap="round"/>
      <!-- Loose rope ends hanging down -->
      <path d="M123 154 C128 165, 125 170, 132 178" fill="none" stroke="url(#ropeGrad)" stroke-width="5" stroke-linecap="round"/>
      <path d="M117 154 C112 165, 115 170, 108 178" fill="none" stroke="url(#ropeGrad)" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground / Ambient Atmosphere Sparkles / Focus Glow -->
  <g filter="url(#glow)" opacity="0.6">
    <circle cx="120" cy="145" r="25" fill="#fbbf24" opacity="0.15"/>
  </g>

  <!-- Additional supportive props to enrich context -->
  <!-- Scissors / Cutter tool on the side -->
  <g transform="translate(170, 160) rotate(25)" filter="url(#shadow)">
    <rect x="0" y="0" width="16" height="6" rx="3" fill="#ef4444"/>
    <circle cx="3" cy="3" r="2" fill="#0f172a"/>
    <circle cx="11" cy="3" r="2" fill="#0f172a"/>
    <path d="M16 2 L28 -2 L28 8 L16 4 Z" fill="#94a3b8"/>
  </g>

  <!-- Extra coiled rope roll in background corner -->
  <g transform="translate(45, 165)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="14" ry="7" fill="none" stroke="#d97706" stroke-width="5"/>
    <ellipse cx="0" cy="-3" rx="12" ry="6" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <ellipse cx="0" cy="-6" rx="10" ry="5" fill="none" stroke="#fde68a" stroke-width="4"/>
  </g>
</svg>