<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Background Office Interior Elements -->
  <!-- Large window showing city lights at night -->
  <path d="M 160 30 L 210 30 L 210 110 L 160 110 Z" fill="#0b0f19" stroke="#334155" stroke-width="2" />
  <path d="M 170 40 L 180 40 L 180 70 L 170 70 Z" fill="#fbbf24" opacity="0.4" />
  <path d="M 190 50 L 200 50 L 200 90 L 190 90 Z" fill="#38bdf8" opacity="0.3" />
  <path d="M 175 80 L 185 80 L 185 100 L 175 100 Z" fill="#fbbf24" opacity="0.2" />
  <!-- Divider line for window frame -->
  <line x1="185" y1="30" x2="185" y2="110" stroke="#334155" stroke-width="1.5" />
  <line x1="160" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="1.5" />

  <!-- Plant for rich environment -->
  <path d="M 215 170 Q 225 150 215 130 Q 210 150 215 170" fill="#10b981" opacity="0.8" />
  <path d="M 220 165 Q 235 160 230 140 Q 220 150 220 165" fill="#059669" opacity="0.9" />
  <path d="M 210 175 L 225 175 L 220 205 L 215 205 Z" fill="#64748b" />

  <!-- Project Planning Board (The core context of 'Xiangmu' / Project) -->
  <rect x="25" y="25" width="120" height="95" rx="6" fill="url(#boardGradient)" stroke="#475569" stroke-width="2" />
  <!-- Board Header / Important Marker (Gold/Amber accent for "Important") -->
  <rect x="35" y="35" width="60" height="8" rx="4" fill="url(#goldGlow)" filter="url(#glow)" />
  <circle x="130" y="39" r="4" fill="#ef4444" />
  <circle x="118" y="39" r="4" fill="#f59e0b" />
  <circle x="106" y="39" r="4" fill="#10b981" />

  <!-- Kanban Columns & Sticky Notes (Project Workflow) -->
  <!-- Column 1 -->
  <rect x="33" y="52" width="33" height="60" rx="3" fill="#1e293b" opacity="0.6" />
  <rect x="37" y="58" width="25" height="12" rx="2" fill="#38bdf8" opacity="0.8" />
  <rect x="37" y="74" width="25" height="12" rx="2" fill="#38bdf8" opacity="0.5" />
  
  <!-- Column 2 (Active/Important Phase) -->
  <rect x="69" y="52" width="33" height="60" rx="3" fill="#1e293b" opacity="0.6" />
  <rect x="73" y="58" width="25" height="18" rx="2" fill="#fbbf24" opacity="0.9" />
  <line x1="77" y1="63" x2="91" y2="63" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
  <line x1="77" y1="69" x2="87" y2="69" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
  <rect x="73" y="80" width="25" height="12" rx="2" fill="#ec4899" opacity="0.8" />

  <!-- Column 3 -->
  <rect x="105" y="52" width="33" height="60" rx="3" fill="#1e293b" opacity="0.6" />
  <rect x="109" y="58" width="25" height="12" rx="2" fill="#10b981" opacity="0.8" />

  <!-- Wooden Desk Surface -->
  <path d="M 10 185 L 230 185 L 240 210 L 0 210 Z" fill="#334155" />
  <path d="M 0 180 L 240 180 L 240 186 L 0 186 Z" fill="#475569" />

  <!-- Laptop on Desk (Tech Context) -->
  <path d="M 130 160 L 180 160 L 190 183 L 120 183 Z" fill="#64748b" />
  <path d="M 133" y="125 L 177 125 L 181 160 L 129 160 Z" fill="#475569" />
  <rect x="136" y="130" width="38" height="25" rx="2" fill="url(#screenGrad)" />
  <!-- UI elements on laptop screen representing analytics/project data -->
  <polyline points="140,148 147,140 154,144 163,135 170,138" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Coffee Mug -->
  <rect x="195" y="160" width="16" height="20" rx="3" fill="#f8fafc" />
  <path d="M 211 165 C 217 165, 217 175, 211 177" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <!-- Steam from coffee -->
  <path d="M 200 153 Q 203 145, 200 137" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Main Character (Project Manager / Professional Worker pointing at the important project) -->
  <!-- Torso & Shoulders -->
  <path d="M 50 210 C 50 170, 75 165, 90 165 C 105 165, 130 170, 130 210 Z" fill="#2563eb" /> <!-- Blue professional blazer -->
  <path d="M 75 165 L 90 190 L 105 165 Z" fill="#f8fafc" /> <!-- White shirt collar -->
  <path d="M 87 178 L 93 178 L 95 195 L 90 200 L 85 195 Z" fill="#ef4444" /> <!-- Red tie -->

  <!-- Neck & Head -->
  <rect x="83" y="148" width="14" height="22" rx="5" fill="#fbcfe8" />
  <path d="M 70 120 C 70 95, 110 95, 110 120 C 110 138, 70 138, 70 120 Z" fill="#fbcfe8" /> <!-- Face base -->
  <!-- Hair (Modern stylish cut) -->
  <path d="M 68 115 C 68 90, 112 90, 112 115 C 112 120, 108 110, 90 105 C 72 110, 68 120, 68 115 Z" fill="#1e293b" />
  <path d="M 67 112 C 67 105, 75 98, 85 96" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />

  <!-- Face expressions (Confident, focused, presenting) -->
  <!-- Glasses for professional intelligence -->
  <rect x="74" y="112" width="14" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2" />
  <rect x="92" y="112" width="14" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2" />
  <line x1="88" y1="117" x2="92" y2="117" stroke="#0f172a" stroke-width="2" />
  <!-- Confident Smile -->
  <path d="M 84 130 Q 90 136, 96 130" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

  <!-- Arms & Gestures -->
  <!-- Right Arm pointing towards the project board ("This is an important project") -->
  <path d="M 120 175 Q 145 150, 155 125" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round" />
  <!-- Hand pointing -->
  <circle cx="157" cy="122" r="6" fill="#fbcfe8" />
  <path d="M 158 117 L 168 113 L 158 123 Z" fill="#fbcfe8" /> <!-- Pointing index finger -->

  <!-- Left Arm resting or akimbo -->
  <path d="M 60 175 Q 50 190, 55 210" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" />

  <!-- Ambient Light Sparkles / Importance Indicator near the project board -->
  <g transform="translate(115, 38)">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#fbbf24" filter="url(#glow)" />
  </g>
  <g transform="translate(45, 35) scale(0.6)">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#fbbf24" filter="url(#glow)" />
  </g>
</svg>