<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Environment: Park Bench and Path -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <rect x="40" y="140" width="160" height="40" rx="4" fill="#fb923c"/>
  <rect x="50" y="130" width="140" height="10" rx="2" fill="#f59e0b"/>
  
  <!-- Character: Facing towards the viewer -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="30" ry="40" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-25" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-25" r="3" fill="#0f172a"/>
    <!-- Smile (The action of 'cháo' - facing towards) -->
    <path d="M-10 -15 Q0 -8 10 -15" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arms reaching forward -->
    <path d="M-30 20 L-50 40" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 20 L50 40" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Atmospheric details: Floating light particles -->
  <circle cx="50" cy="50" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="180" cy="70" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="200" cy="150" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="30" cy="190" r="2" fill="#fbbf24" opacity="0.7"/>
</svg>