<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Wall Detail -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <circle cx="40" cy="200" r="4" fill="#475569"/>
  <circle cx="120" cy="210" r="6" fill="#475569"/>
  <circle cx="200" cy="195" r="5" fill="#475569"/>

  <!-- Pipe (管子) -->
  <g transform="rotate(-15 120 120)">
    <path d="M60 80 L180 80 L185 160 L55 160 Z" fill="#94a3b8"/>
    <path d="M60 80 L180 80 L175 70 L55 70 Z" fill="#cbd5e1"/>
    <path d="M55 70 L55 160 L45 160 L45 70 Z" fill="#64748b"/>
    <path d="M185 160 L185 70 L175 70 L175 160 Z" fill="#64748b"/>
    
    <!-- Pipe Joint/Connector -->
    <rect x="100" y="75" width="40" height="15" rx="2" fill="#38bdf8"/>
    <rect x="105" y="65" width="30" height="10" rx="2" fill="#0ea5e9"/>
  </g>

  <!-- Water Splash Effect -->
  <path d="M170 140 Q190 150 210 140 Q200 160 210 180 Q190 170 180 180 Q185 160 170 150 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="215" cy="145" r="3" fill="#f0f9ff"/>
  <circle cx="200" cy="175" r="2" fill="#f0f9ff"/>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
</svg>