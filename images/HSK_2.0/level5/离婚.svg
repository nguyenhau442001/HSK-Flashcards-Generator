<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Paper/Desk separation -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Lighting / Separation -->
  <circle cx="120" cy="110" r="100" fill="url(#lamp-glow)"/>

  <!-- Background Interior Elements -->
  <!-- Wall art / window frame hint -->
  <rect x="70" y="30" width="100" height="40" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="75" y="35" width="42" height="30" fill="#1e293b" opacity="0.6"/>
  <rect x="123" y="35" width="42" height="30" fill="#1e293b" opacity="0.6"/>

  <!-- Wooden Table / Desk -->
  <path d="M 20 185 L 220 185 L 230 220 L 10 220 Z" fill="#0f172a"/>
  <rect x="20" y="175" width="200" height="12" rx="3" fill="#475569" filter="url(#shadow)"/>

  <!-- Centerpiece: Divorce Papers / Document Split -->
  <g transform="translate(120, 160)" filter="url(#shadow)">
    <!-- Document Base -->
    <rect x="-26" y="-35" width="52" height="64" rx="2" fill="#f8fafc"/>
    <!-- Red Official Seal / Stamp -->
    <circle cx="0" cy="0" r="10" fill="#ef4444" opacity="0.85"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#fee2e2" stroke-width="1.5"/>
    <path d="M-4 -1 L-1 3 L5 -3" fill="none" stroke="#fee2e2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Document Text Lines (Abstract) -->
    <rect x="-18" y="-25" width="25" height="3" rx="1" fill="#cbd5e1"/>
    <rect x="-18" y="-18" width="36" height="2" rx="1" fill="#e2e8f0"/>
    <rect x="-18" y="-13" width="30" height="2" rx="1" fill="#e2e8f0"/>
    
    <!-- Signature Lines at bottom of paper -->
    <line x1="-20" y1="18" x2="-5" y2="18" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="18" x2="20" y2="18" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Pen lying across -->
    <path d="M -22 24 L 14 10 L 16 12 L -20 26 Z" fill="#38bdf8"/>
  </g>

  <!-- Left Character: Person A (Melancholic/Reflective pose) -->
  <g transform="translate(65, 120)">
    <!-- Body/Torso -->
    <path d="M -22 65 C -22 45, -12 40, -12 40 L 12 40 C 12 40, 22 45, 22 65 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt -->
    <path d="M -8 40 L 0 50 L 8 40 Z" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="0" cy="15" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M -16 10 C -16 -2, -8 -3, 0 -3 C 8 -3, 16 -2, 16 10 C 16 15, 14 12, 12 4 C 8 0, -8 0, -12 4 C -14 12, -16 15, -16 10 Z" fill="#1e293b"/>
    <!-- Gentle Downcast Expression / Details -->
    <path d="M -5 14 Q -2 16 1 14" stroke="#475569" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Arm leaning away -->
    <path d="M -18 45 C -25 50, -32 40, -35 30" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Right Character: Person B (Moving away / Distant pose) -->
  <g transform="translate(175, 120)">
    <!-- Body/Torso -->
    <path d="M -22 65 C -22 45, -12 40, -12 40 L 12 40 C 12 40, 22 45, 22 65 Z" fill="#ec4899"/>
    <!-- Collar / Blouse -->
    <path d="M -8 40 L 0 48 L 8 40 Z" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="0" cy="15" r="16" fill="#fed7aa"/>
    <!-- Hair (Ponytail / Modern cut turned slightly) -->
    <path d="M -15 12 C -15 -1, -5 -3, 5 -3 C 14 -3, 18 4, 22 10 C 26 16, 28 22, 28 22 C 28 22, 20 18, 15 15 C 8 10, -5 12, -15 12 Z" fill="#451a03"/>
    <!-- Expression Details -->
    <path d="M -1 14 Q 2 16 5 14" stroke="#475569" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Arm turned outward -->
    <path d="M 18 45 C 26 48, 32 38, 36 28" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Foreground Props: Coffee cups symbolizing past shared moments, now separated -->
  <g transform="translate(35, 170)" filter="url(#shadow)">
    <!-- Left Cup -->
    <rect x="-8" y="-12" width="16" height="18" rx="2" fill="#f1f5f9"/>
    <path d="M 8 -8 C 12 -8, 12 -2, 8 0" stroke="#f1f5f9" stroke-width="2" fill="none"/>
    <!-- Steam / Parting ways -->
    <path d="M -2 -18 C -4 -22, 2 -26, 0 -30" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <g transform="translate(205, 170)" filter="url(#shadow)">
    <!-- Right Cup -->
    <rect x="-8" y="-12" width="16" height="18" rx="2" fill="#f1f5f9"/>
    <path d="M -8 -8 C -12 -8, -12 -2, -8 0" stroke="#f1f5f9" stroke-width="2" fill="none"/>
    <!-- Steam -->
    <path d="M 2 -18 C 4 -22, -2 -26, 0 -30" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

</svg>