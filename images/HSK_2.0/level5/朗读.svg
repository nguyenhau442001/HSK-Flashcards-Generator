<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Study Light Gradient -->
    <radialGradient id="study-light" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Voice Sound Wave Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light Effect -->
  <circle cx="90" cy="90" r="120" fill="url(#study-light)" />

  <!-- ENVIRONMENT: Study Room Background -->
  <!-- Bookshelf Background -->
  <g opacity="0.3">
    <rect x="25" y="40" width="60" height="90" fill="#334155" rx="2" />
    <line x1="25" y1="70" x2="85" y2="70" stroke="#1e293b" stroke-width="3" />
    <line x1="25" y1="100" x2="85" y2="100" stroke="#1e293b" stroke-width="3" />
    <!-- Books on shelf -->
    <path d="M32 70 L32 50 L38 50 L38 70 Z" fill="#f43f5e" />
    <path d="M40 70 L40 45 L48 45 L48 70 Z" fill="#38bdf8" />
    <path d="M52 70 L52 55 L60 55 L60 70 Z" fill="#10b981" />
  </g>

  <!-- Window with Night City Silhouette & Warm Curtain -->
  <path d="M165 30 L210 30 L210 120 L165 120 Z" fill="#0b0f19" stroke="#334155" stroke-width="2" />
  <circle cx="190" cy="50" r="8" fill="#fbbf24" opacity="0.8" /> <!-- Moon -->
  <!-- Curtain -->
  <path d="M165 30 Q155 75 165 120 L160 120 Q150 75 160 30 Z" fill="#475569" />

  <!-- Study Desk -->
  <rect x="20" y="160" width="200" height="12" rx="4" fill="#64748b" filter="url(#shadow)" />
  <rect x="35" y="172" width="12" height="40" fill="#475569" />
  <rect x="193" y="172" width="12" height="40" fill="#475569" />

  <!-- Desk Lamp -->
  <path d="M180 160 L185 120 L195 120 L198 160 Z" fill="#94a3b8" />
  <path d="M175 115 C175 105 195 105 195 115 Z" fill="#fbbf24" filter="url(#shadow)" />
  <path d="M170 115 L200 115 L190 95 L180 95 Z" fill="#cbd5e1" />

  <!-- OPEN BOOK (The Lesson Text) -->
  <g transform="translate(85, 135)" filter="url(#shadow)">
    <!-- Book Cover / Base -->
    <path d="M-35 25 Q0 35 35 25 L35 40 Q0 50 -35 40 Z" fill="#3b82f6" />
    <!-- Left Page -->
    <path d="M-35 25 Q0 35 0 0 L0 30 Q0 35 -35 40 Z" fill="#f8fafc" />
    <!-- Right Page -->
    <path d="M35 25 Q0 35 0 0 L0 30 Q0 35 35 40 Z" fill="#f1f5f9" />
    <!-- Center Binding -->
    <line x1="0" y1="0" x2="0" y2="30" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Abstract Text Lines (Simulating 课文 - Lesson Text) -->
    <!-- Left Page Lines -->
    <line x1="-28" y1="8" x2="-8" y2="10" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-28" y1="15" x2="-12" y2="17" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-28" y1="22" x2="-6" y2="24" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right Page Lines -->
    <line x1="8" y1="8" x2="28" y2="10" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="15" x2="22" y2="17" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="22" x2="26" y2="24" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- CHARACTER: Enthusiastic Student Reading Aloud -->
  <g transform="translate(85, 90)">
    <!-- Body / Torso (leaning slightly forward) -->
    <path d="M-30 82 C-30 60 -15 50 0 55 C15 50 30 60 30 82 L25 110 L-25 110 Z" fill="#0ea5e9" />
    <!-- Collar / Scarf accent -->
    <path d="M-12 56 L0 68 L12 56 L8 52 L0 60 L-8 52 Z" fill="#f8fafc" />

    <!-- Neck -->
    <rect x="-6" y="42" width="12" height="16" fill="#fcd34d" />

    <!-- Head & Face (Expression: Active, energetic, mouth open speaking/reading loudly) -->
    <circle cx="0" cy="25" r="22" fill="#fcd34d" filter="url(#shadow)" />
    
    <!-- Hair -->
    <path d="M-22 25 C-22 8 -10 2 0 3 C10 2 22 8 22 25 C22 15 15 -2 0 -2 C-15 -2 -22 15 -22 25 Z" fill="#1e293b" />
    
    <!-- Eyes (Happy curved crescents or focused dots) -->
    <circle cx="-7" cy="22" r="3" fill="#1e293b" />
    <circle cx="7" cy="22" r="3" fill="#1e293b" />
    <!-- Eyebrows raised dynamically -->
    <path d="M-11 16 C-8 14 -4 15 -4 15" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M11 16 C8 14 4 15 4 15" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="-11" cy="28" r="4" fill="#fb7185" opacity="0.6" />
    <circle cx="11" cy="28" r="4" fill="#fb7185" opacity="0.6" />

    <!-- Open Mouth (Loud, expressive reading action) -->
    <path d="M-4 31 C-4 30 4 30 4 35 C4 39 -4 39 -4 35 Z" fill="#991b1b" />
    <path d="M-3 33 C-3 32 3 32 3 34 C3 36 -3 36 -3 34 Z" fill="#f43f5e" />

    <!-- Arms & Hands Gesturing / Holding Position -->
    <!-- Left Arm holding book edge -->
    <path d="M-25 65 C-35 75 -40 90 -45 105 L-35 108 C-32 95 -28 85 -20 75 Z" fill="#0284c7" />
    <circle cx="-47" cy="107" r="5" fill="#fcd34d" />

    <!-- Right Arm energized/gesturing -->
    <path d="M25 65 C38 70 48 60 55 48 L46 42 C41 50 34 56 22 58 Z" fill="#0284c7" />
    <circle cx="58" cy="45" r="5" fill="#fcd34d" />
  </g>

  <!-- DYNAMIC SOUND WAVES (Representing "大声" - Loud Voice / Reading Aloud) -->
  <g transform="translate(145, 95)" filter="url(#shadow)">
    <!-- Outer wave arc 3 -->
    <path d="M 15 -25 Q 35 0 15 25" fill="none" stroke="url(#wave-grad)" stroke-width="3.5" stroke-linecap="round" opacity="0.4" />
    <!-- Middle wave arc 2 -->
    <path d="M 10 -18 Q 24 0 10 18" fill="none" stroke="url(#wave-grad)" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />
    <!-- Inner wave arc 1 -->
    <path d="M 5 -10 Q 14 0 5 10" fill="none" stroke="url(#wave-grad)" stroke-width="4" stroke-linecap="round" opacity="1" />
  </g>

  <!-- Secondary Voice Wave floating upwards to emphasize projection -->
  <g transform="translate(115, 60)" opacity="0.8">
    <path d="M 0 5 Q 10 -5 20 -15" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="22" cy="-17" r="2.5" fill="#38bdf8" />
  </g>
</svg>