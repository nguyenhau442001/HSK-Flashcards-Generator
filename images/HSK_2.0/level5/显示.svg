<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Monitor Screen Glow & Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Result Graphic Gradient (Gold/Amber) -->
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment / Room Context -->
  <!-- Window / Night City Vibe -->
  <g opacity="0.3">
    <rect x="170" y="20" width="50" height="70" rx="6" fill="#0284c7" opacity="0.2"/>
    <rect x="180" y="30" width="12" height="20" fill="#38bdf8"/>
    <rect x="200" y="55" width="12" height="25" fill="#38bdf8"/>
  </g>

  <!-- Bookshelf / Plant background props -->
  <path d="M25 80 L55 70 L55 120 L25 120 Z" fill="#334155" opacity="0.4"/>
  <circle cx="40" cy="62" r="10" fill="#10b981" opacity="0.6"/>
  <path d="M35 100 Q40 90 45 100" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Desk Surface -->
  <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="url(#deskGrad)"/>
  <!-- Desk Edge Highlight -->
  <line x1="0" y1="175" x2="240" y2="175" stroke="#475569" stroke-width="2"/>

  <!-- Office Chair Backrest -->
  <rect x="155" y="100" width="45" height="85" rx="12" fill="#334155"/>
  <rect x="162" y="110" width="31" height="65" rx="8" fill="#1e293b"/>

  <!-- Character (Curious User / Professional) -->
  <g id="character">
    <!-- Body / Torso -->
    <path d="M125 175 C125 145 145 140 165 140 C185 140 205 145 205 175 Z" fill="#6366f1"/>
    <path d="M140 142 L165 160 L190 142" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- Collar -->
    
    <!-- Neck -->
    <rect x="157" y="128" width="16" height="20" fill="#fed7aa"/>

    <!-- Head -->
    <circle cx="165" cy="115" r="18" fill="#fed7aa"/>
    
    <!-- Hair -->
    <path d="M147 115 C147 95 183 95 183 115 C183 120 180 110 175 105 C165 98 155 105 147 115 Z" fill="#0f172a"/>

    <!-- Glasses / Expressive face details -->
    <circle cx="158" cy="114" r="5" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="172" cy="114" r="5" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="163" y1="114" x2="167" y2="114" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M163 123 Q165 126 167 123" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Hand Pointing at Screen (Displaying action) -->
    <path d="M130 165 C115 160 100 155 90 150" fill="none" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>
    <!-- Pointing Finger -->
    <circle cx="87" cy="148" r="4" fill="#fed7aa"/>
  </g>

  <!-- Desk Props (Keyboard, Coffee Mug) -->
  <!-- Keyboard -->
  <rect x="65" y="170" width="70" height="15" rx="3" fill="#475569"/>
  <rect x="70" y="173" width="60" height="9" rx="1.5" fill="#1e293b"/>
  
  <!-- Coffee Mug -->
  <rect x="35" y="155" width="16" height="20" rx="3" fill="#f43f5e"/>
  <path d="M51 160 C56 160 56 170 51 170" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>

  <!-- MAIN FOCUS: The Computer Monitor (Displaying the result) -->
  <g id="monitor" filter="url(#glow)">
    <!-- Monitor Stand Base -->
    <ellipse cx="85" cy="176" rx="25" ry="5" fill="#475569"/>
    <rect x="80" y="155" width="10" height="22" fill="#64748b"/>
    <rect x="70" y="150" width="30" height="6" rx="3" fill="#475569"/>

    <!-- Monitor Outer Frame -->
    <rect x="25" y="60" width="120" height="92" rx="8" fill="#334155"/>
    <!-- Monitor Inner Bezel -->
    <rect x="29" y="64" width="112" height="84" rx="5" fill="url(#screenGrad)"/>

    <!-- Screen Content: "The Result" (Visual representation of displaying data/success) -->
    <!-- Ambient screen grid lines -->
    <line x1="39" y1="80" x2="80" y2="80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="39" y1="92" x2="65" y2="92" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Main Result Visual element (Large glowing check / chart / target showing "Result") -->
    <rect x="85" y="72" width="46" height="66" rx="6" fill="#1e293b" opacity="0.8"/>
    
    <!-- Dynamic Result Graphics: Rising Bar Chart & Glowing Success Star -->
    <rect x="93" y="115" width="7" height="15" rx="2" fill="#38bdf8"/>
    <rect x="104" y="105" width="7" height="25" rx="2" fill="url(#resultGrad)"/>
    <rect x="115" y="95" width="7" height="35" rx="2" fill="#10b981"/>

    <!-- Success Star / Badge on Screen -->
    <circle cx="108" cy="84" r="8" fill="#fbbf24" opacity="0.9"/>
    <path d="M108 79 L109.5 82.5 L113 83 L110.5 85.5 L111 89 L108 87.5 L105 89 L105.5 85.5 L103 83 L106.5 82.5 Z" fill="#ffffff"/>

    <!-- Screen Reflection Gloss -->
    <path d="M29 64 L75 64 L55 148 L29 148 Z" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- Foreground Atmospheric Particles (Energy / Data floating) -->
  <circle cx="105" cy="45" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="130" cy="35" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="60" cy="40" r="2" fill="#10b981" opacity="0.7"/>
  <circle cx="200" cy="110" r="2" fill="#ec4899" opacity="0.6"/>

</svg>