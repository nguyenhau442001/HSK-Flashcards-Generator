<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(40, 40)">
    <!-- Tree Trunk -->
    <path d="M80 160 C80 120, 90 80, 110 40 L120 40 C140 80, 150 120, 150 160 Z" fill="#475569"/>
    
    <!-- Main Branch (The target '支') -->
    <path d="M115 60 C115 40, 130 20, 160 20 L165 25 C140 25, 125 45, 125 65 Z" fill="#64748b"/>
    
    <!-- Flowers on the branch -->
    <circle cx="155" cy="20" r="12" fill="#ec4899"/>
    <circle cx="155" cy="20" r="6" fill="#fbcfe8"/>
    <circle cx="140" cy="30" r="10" fill="#ec4899"/>
    <circle cx="140" cy="30" r="5" fill="#fbcfe8"/>
    
    <!-- Secondary Branch -->
    <path d="M110 80 C110 70, 90 60, 70 65 L70 70 C90 65, 105 75, 105 85 Z" fill="#64748b"/>
    <circle cx="70" cy="65" r="8" fill="#fbbf24"/>
    
    <!-- Atmospheric depth: Leaves/Petals falling -->
    <circle cx="180" cy="50" r="3" fill="#38bdf8" opacity="0.6"/>
    <circle cx="190" cy="80" r="4" fill="#10b981" opacity="0.6"/>
    <circle cx="50" cy="120" r="3" fill="#fb923c" opacity="0.6"/>
    
    <!-- Ground detail -->
    <path d="M0 160 C60 150, 180 150, 240 160 L240 200 C160 190, 80 190, 0 200 Z" fill="#334155"/>
  </g>
</svg>