<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow (Active side) -->
    <radialGradient id="amberGlow" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Cool Blue Glow (Passive/Waiting side) -->
    <radialGradient id="blueGlow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Skin Gradient -->
    <linearGradient id="skin1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Character 2 Skin Gradient -->
    <linearGradient id="skin2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effects -->
  <circle cx="180" cy="120" r="100" fill="url(#amberGlow)" />
  <circle cx="60" cy="120" r="100" fill="url(#blueGlow)" />

  <!-- Background Environment / Split Studio Concept -->
  <!-- Left Side: Waiting Room Vibe (Subdued) -->
  <line x1="120" y1="40" x2="120" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />
  
  <g opacity="0.4">
    <!-- Waiting Clock on Left Wall -->
    <circle cx="60" cy="55" r="16" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <line x1="60" y1="55" x2="60" y2="47" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="60" y1="55" x2="66" y2="55" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Empty Waiting Bench -->
    <rect x="30" y="165" width="60" height="6" rx="3" fill="#475569" />
    <rect x="38" y="171" width="4" height="15" fill="#334155" />
    <rect x="78" y="171" width="4" height="15" fill="#334155" />
  </g>

  <!-- Right Side: Active Workspace Vibe (Warm & Rich) -->
  <g>
    <!-- Wall Shelf -->
    <rect x="155" y="60" width="65" height="4" rx="2" fill="#475569" />
    <!-- Decorative Pot on Shelf -->
    <path d="M 170 60 L 173 50 L 179 50 L 182 60 Z" fill="#cbd5e1" />
    <path d="M 176 50 Q 170 42 165 40 Q 176 46 176 50 Z" fill="url(#leafGrad)" />
    <path d="M 176 50 Q 182 40 188 38 Q 176 45 176 50 Z" fill="url(#leafGrad)" />
    
    <!-- Architectural Window Frame with Warm Light -->
    <path d="M 195 90 L 220 90 L 220 180 L 195 180 Z" fill="#fbbf24" opacity="0.05" />
  </g>

  <!-- ================= LEFT CHARACTER: WAITING (Passive) ================= -->
  <g transform="translate(-10, 0)">
    <!-- Shadow -->
    <ellipse cx="65" cy="195" rx="22" ry="5" fill="#020617" opacity="0.6" />

    <!-- Body / Torso (Slouched) -->
    <path d="M 50 145 C 50 130, 60 120, 75 125 C 85 128, 90 140, 90 160 L 90 190 L 50 190 Z" fill="#475569" />

    <!-- Head -->
    <circle cx="68" cy="112" r="14" fill="url(#skin1)" />
    <!-- Drooping Hair -->
    <path d="M 54 110 C 54 98, 80 98, 82 110 C 78 106, 58 106, 54 110 Z" fill="#334155" />
    <!-- Bored Face Features -->
    <circle cx="63" cy="113" r="1.5" fill="#1e293b" />
    <circle cx="73" cy="113" r="1.5" fill="#1e293b" />
    <!-- Frown/Flat mouth -->
    <path d="M 66 120 L 70 120" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm resting on knee / chin on hand posture -->
    <path d="M 55 135 L 70 128 L 73 118" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Lying Down Props (Unopened Box / Delay Concept) -->
    <rect x="25" y="172" width="22" height="18" rx="2" fill="#64748b" />
    <line x1="25" y1="181" x2="47" y2="181" stroke="#475569" stroke-width="2" />
  </g>


  <!-- ================= DIVIDER / ACTION SHIFT ================= -->
  <!-- Subtle dynamic swoosh representing the pivot from "waiting" to "doing" -->
  <path d="M 95 110 Q 115 130 110 160" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />


  <!-- ================= RIGHT CHARACTER: DOING (Active & Dynamic) ================= -->
  <g transform="translate(10, 0)">
    <!-- Shadow -->
    <ellipse cx="165" cy="195" rx="25" ry="6" fill="#020617" opacity="0.6" />

    <!-- Large Workbench / Desk -->
    <rect x="125" y="160" width="85" height="8" rx="2" fill="#d97706" />
    <!-- Desk Legs -->
    <rect x="133" y="168" width="6" height="25" fill="#b45309" />
    <rect x="197" y="168" width="6" height="25" fill="#b45309" />

    <!-- Active Creative Props on Desk -->
    <!-- Laptop / Blueprint -->
    <path d="M 140 160 L 145 148 L 165 148 L 170 160 Z" fill="#38bdf8" />
    <!-- Coffee Mug with steam -->
    <rect x="182" y="148" width="9" height="12" rx="2" fill="#f43f5e" />
    <path d="M 191 151 C 195 151, 195 157, 191 157" fill="none" stroke="#f43f5e" stroke-width="1.5" />
    <path d="M 184 143 Q 186 138, 184 133" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

    <!-- Torso (Engaged, leaning forward) -->
    <path d="M 145 140 C 145 125, 160 115, 175 120 C 185 123, 190 135, 190 160 L 145 160 Z" fill="#10b981" />

    <!-- Head (Determined / Focused) -->
    <circle cx="168" cy="104" r="14" fill="url(#skin2)" />
    <!-- Stylish Hair -->
    <path d="M 154 102 C 156 90, 180 92, 182 102 C 178 96, 160 96, 154 102 Z" fill="#1e293b" />
    <!-- Focused Eye (Determined slant) -->
    <path d="M 170 104 L 176 106" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Confident Smile -->
    <path d="M 168 112 Q 172 115, 175 112" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Active Arms Working -->
    <!-- Back Arm -->
    <path d="M 155 130 L 165 140 L 175 145" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Arm (Drawing/Building gesture with stylus or tool) -->
    <path d="M 180 130 L 168 138 L 162 148" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand holding tool -->
    <circle cx="161" cy="149" r="3.5" fill="url(#skin2)" />
    <!-- Tool / Pen / Brush tip -->
    <line x1="161" y1="149" x2="155" y2="155" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Sparkle / Action Effect (Doing it yourself!) -->
    <path d="M 135 125 L 138 132 L 145 135 L 138 138 L 135 145 L 132 138 L 125 135 L 132 132 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M 195 105 L 197 109 L 201 111 L 197 113 L 195 117 L 193 113 L 189 111 L 193 109 Z" fill="#fbbf24" opacity="0.7" />
  </g>

  <!-- Foreground Atmospheric Details -->
  <!-- Floating energetic particles -->
  <circle cx="115" cy="80" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="130" cy="95" r="3" fill="#38bdf8" opacity="0.6" />
  <circle cx="105" cy="165" r="1.5" fill="#10b981" opacity="0.7" />
  <circle cx="215" cy="55" r="2.5" fill="#f43f5e" opacity="0.8" />

  <!-- Frame Border / Clean Edge Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
</svg>