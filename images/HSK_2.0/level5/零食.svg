<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Room Light Gradient -->
    <radialGradient id="roomGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container & Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#roomGlow)" />

  <!-- ENVIRONMENT: Interior Living Room Backdrop -->
  <!-- Wallpaper line pattern / accent -->
  <line x1="0" y1="140" x2="240" y2="140" stroke="#334155" stroke-width="2" />
  
  <!-- Bookshelf / Toys in background -->
  <rect x="25" y="60" width="45" height="80" rx="4" fill="#1e293b" />
  <rect x="33" y="75" width="30" height="8" rx="2" fill="#334155" />
  <rect x="33" y="95" width="30" height="8" rx="2" fill="#334155" />
  <rect x="33" y="115" width="30" height="8" rx="2" fill="#334155" />
  <!-- Books on shelf -->
  <path d="M37 75 L37 68 L43 68 L43 75 Z" fill="#38bdf8" />
  <path d="M46 75 L46 65 L53 65 L53 75 Z" fill="#ec4899" />
  <path d="M56 75 L56 70 L61 70 L61 75 Z" fill="#10b981" />

  <!-- Window with night sky -->
  <rect x="160" y="35" width="55" height="75" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="3" />
  <line x1="187" y1="35" x2="187" y2="110" stroke="#334155" stroke-width="2" />
  <line x1="160" y1="72" x2="215" y2="72" stroke="#334155" stroke-width="2" />
  <!-- Stars outside -->
  <circle cx="172" cy="50" r="1.5" fill="#fef08a" />
  <circle cx="202" cy="58" r="1" fill="#fef08a" />
  <circle cx="195" cy="92" r="1.5" fill="#fef08a" />

  <!-- Floor -->
  <path d="M0 140 L240 140 L240 240 L0 240 Z" fill="url(#floorGrad)" />
  <!-- Floor rug -->
  <ellipse cx="120" cy="185" rx="70" ry="25" fill="#334155" opacity="0.6" />
  <ellipse cx="120" cy="185" rx="60" ry="20" fill="#475569" opacity="0.4" />

  <!-- FURNITURE: Low Coffee Table -->
  <g filter="url(#softShadow)">
    <path d="M70 150 L170 150 L180 175 L60 175 Z" fill="#b45309" />
    <path d="M70 150 L170 150 L165 155 L75 155 Z" fill="#d97706" />
    <!-- Table legs -->
    <rect x="75" y="175" width="6" height="35" rx="2" fill="#78350f" />
    <rect x="159" y="175" width="6" height="35" rx="2" fill="#78350f" />
  </g>

  <!-- PROPS: SNACKS (零食) ON TABLE -->
  <!-- Open colorful snack bag 1 (Potato chips / puffs) -->
  <g transform="translate(85, 130)">
    <path d="M0 25 L8 8 L18 12 L28 6 L36 25 Z" fill="#ef4444" />
    <path d="M4 17 Q18 22 32 17" stroke="#fef08a" stroke-width="3" fill="none" />
    <!-- Spilled snacks/chips -->
    <circle cx="42" cy="22" r="4" fill="#fbbf24" />
    <circle cx="50" cy="25" r="3.5" fill="#f59e0b" />
  </g>

  <!-- Snack jar / container filled with colorful treats -->
  <g transform="translate(130, 115)">
    <!-- Jar body -->
    <path d="M6 10 L18 10 L20 35 C20 38 17 40 13 40 C9 40 6 38 6 35 Z" fill="#38bdf8" opacity="0.3" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Candies inside -->
    <circle cx="11" cy="25" r="3" fill="#ec4899" />
    <circle cx="15" cy="30" r="3" fill="#fbbf24" />
    <circle cx="13" cy="20" r="2.5" fill="#10b981" />
    <!-- Jar lid -->
    <rect x="8" y="6" width="10" height="5" rx="1.5" fill="#cbd5e1" />
  </g>

  <!-- Another snack box / cookie box -->
  <g transform="translate(105, 133)">
    <rect x="0" y="0" width="20" height="12" rx="2" fill="#10b981" />
    <rect x="-2" y="-2" width="24" height="5" rx="1.5" fill="#059669" />
    <circle cx="10" cy="6" r="3" fill="#fef08a" />
  </g>

  <!-- MAIN CHARACTER: Happy Child sitting on the rug reaching for snacks -->
  <g filter="url(#softShadow)">
    <!-- Body/Torso (Sitting pose leaning forward) -->
    <path d="M100 150 Q110 135 125 142 L135 175 L105 180 Z" fill="#ec4899" />

    <!-- Legs (Seated cross-legged / forward on floor) -->
    <path d="M108 175 Q90 185 85 195 L115 198 L125 180 Z" fill="#3b82f6" />
    <path d="M130 175 Q150 185 155 195 L125 198 Z" fill="#2563eb" />

    <!-- Shoes -->
    <ellipse cx="80" cy="197" rx="8" ry="5" fill="#f8fafc" />
    <ellipse cx="160" cy="197" rx="8" ry="5" fill="#f8fafc" />

    <!-- Left Arm (Reaching out excitedly toward the snacks) -->
    <path d="M105 145 Q85 135 70 148" stroke="#ec4899" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Left Hand -->
    <circle cx="66" cy="150" r="5" fill="#fde047" />

    <!-- Right Arm (Supporting or bent) -->
    <path d="M130 145 Q140 160 130 170" stroke="#db2777" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="127" cy="174" r="4.5" fill="#fde047" />

    <!-- Head & Hair -->
    <!-- Hair back/base -->
    <circle cx="120" cy="112" r="19" fill="#1e1b4b" />
    <!-- Face skin -->
    <circle cx="122" cy="115" r="16" fill="#fde047" />
    <!-- Cute hair tufts / bangs -->
    <path d="M106 110 Q112 100 122 102 Q132 100 138 110 Q130 106 122 107 Q114 106 106 110 Z" fill="#1e1b4b" />

    <!-- Facial Expression (Ecstatic, happy eyes & big smile) -->
    <!-- Closed happy curved eyes -->
    <path d="M112 113 Q116 117 120 113" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M126 113 Q130 117 134 113" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Rosy cheeks -->
    <circle cx="111" cy="120" r="3" fill="#fb7185" opacity="0.6" />
    <circle cx="135" cy="120" r="3" fill="#fb7185" opacity="0.6" />
    <!-- Big happy open smile -->
    <path d="M117 122 Q123 131 129 122" fill="#1e1b4b" />
    <path d="M120 125 Q123 129 126 125" fill="#f43f5e" />
  </g>

  <!-- Floating snack crumbs/sparkles for extra lively vibe -->
  <circle cx="70" cy="130" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="95" cy="122" r="2.5" fill="#38bdf8" opacity="0.8" />
  <path d="M150 105 L153 111 L159 114 L153 117 L150 123 L147 117 L141 114 L147 111 Z" fill="#fbbf24" opacity="0.7" transform="scale(0.6) translate(110, 50)" />
  <path d="M80 95 L82 99 L86 101 L82 103 L80 107 L78 103 L74 101 L78 99 Z" fill="#ec4899" opacity="0.6" transform="scale(0.5) translate(80, 70)" />
</svg>