<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Love Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Lantern/String Light Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="tinyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ==================== BACKGROUND & ENVIRONMENT ==================== -->
  
  <!-- Wall art / Bookshelf silhouette in background -->
  <g fill="#334155" opacity="0.4">
    <!-- Shelf -->
    <rect x="25" y="70" width="70" height="3" rx="1.5"/>
    <!-- Books -->
    <rect x="35" y="52" width="8" height="18" rx="1"/>
    <rect x="45" y="48" width="6" height="22" rx="1"/>
    <rect x="53" y="55" width="12" height="15" rx="1"/>
    <rect x="67" y="50" width="7" height="20" rx="1"/>
    <!-- Plant silhouette on shelf -->
    <path d="M 80 70 Q 82 60 76 53 Q 84 57 84 70 Z" fill="#10b981" opacity="0.6"/>
  </g>

  <!-- Large Cozy Window showing evening city/stars -->
  <g>
    <!-- Window Frame Outer -->
    <rect x="135" y="30" width="75" height="90" rx="4" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <!-- Window Pane Light -->
    <rect x="138" y="33" width="69" height="84" fill="url(#windowGlow)"/>
    <!-- Window Crossbars -->
    <line x1="172" y1="33" x2="172" y2="117" stroke="#334155" stroke-width="2"/>
    <line x1="138" y1="75" x2="207" y2="75" stroke="#334155" stroke-width="2"/>
    
    <!-- Tiny background stars outside window -->
    <circle cx="150" cy="45" r="1" fill="#fff" opacity="0.8"/>
    <circle cx="190" cy="55" r="1.5" fill="#fef08a" opacity="0.9"/>
    <circle cx="165" cy="95" r="1" fill="#fff" opacity="0.7"/>
    <circle cx="195" cy="100" r="1" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- String lights across the ceiling -->
  <path d="M 0 15 Q 60 30 120 15 T 240 20" fill="none" stroke="#475569" stroke-width="1"/>
  <!-- Glowing bulb lights -->
  <circle cx="30" cy="20" r="3" fill="#fef08a" filter="url(#tinyGlow)"/>
  <circle cx="90" cy="23" r="3" fill="#fef08a" filter="url(#tinyGlow)"/>
  <circle cx="150" cy="18" r="3" fill="#fef08a" filter="url(#tinyGlow)"/>
  <circle cx="210" cy="21" r="3" fill="#fef08a" filter="url(#tinyGlow)"/>

  <!-- Potted Monstera Plant in corner -->
  <g transform="translate(15, 110)">
    <!-- Pot -->
    <path d="M 5 35 L 15 65 L 35 65 L 45 35 Z" fill="#cbd5e1"/>
    <ellipse cx="25" cy="35" rx="20" ry="4" fill="#94a3b8"/>
    <!-- Leaves -->
    <path d="M 25 35 Q 10 10 0 20 Q -5 30 15 35 Z" fill="#059669"/>
    <path d="M 25 35 Q 40 5 50 15 Q 55 25 35 35 Z" fill="#10b981"/>
    <path d="M 25 35 Q 25 0 35 -10 Q 45 0 25 35 Z" fill="#34d399"/>
  </g>

  <!-- Cozy Floor Rug -->
  <ellipse cx="120" cy="200" rx="85" ry="22" fill="#334155" opacity="0.5"/>
  <ellipse cx="120" cy="198" rx="75" ry="18" fill="#475569" opacity="0.6"/>

  <!-- ==================== MAIN CHARACTERS ==================== -->
  
  <!-- Shared Sofa -->
  <g id="sofa">
    <!-- Sofa Back -->
    <rect x="55" y="115" width="130" height="45" rx="12" fill="#3b82f6"/>
    <!-- Sofa Armrest Left -->
    <rect x="45" y="125" width="18" height="60" rx="9" fill="#2563eb"/>
    <!-- Sofa Armrest Right -->
    <rect x="177" y="125" width="18" height="60" rx="9" fill="#2563eb"/>
    <!-- Sofa Cushion Base -->
    <rect x="50" y="145" width="140" height="45" rx="10" fill="#60a5fa"/>
    <!-- Sofa Legs -->
    <rect x="60" y="190" width="6" height="12" rx="3" fill="#1e293b"/>
    <rect x="174" y="190" width="6" height="12" rx="3" fill="#1e293b"/>
  </g>

  <!-- Character 1: Male (Left side, smiling warmly, holding a mug) -->
  <g id="male-character" transform="translate(75, 110)">
    <!-- Body & Hoodie -->
    <path d="M 15 35 Q 25 30 35 35 L 42 75 L 8 75 Z" fill="#0d9488"/>
    <!-- Head & Neck -->
    <rect x="22" y="15" width="12" height="10" fill="#fcd34d"/>
    <circle cx="28" cy="15" r="14" fill="#fde68a"/>
    <!-- Hair (Dark, neat) -->
    <path d="M 14 12 Q 20 -2 34 2 Q 42 6 40 18 Q 36 12 28 12 Q 18 12 14 12 Z" fill="#1e293b"/>
    <!-- Face details -->
    <!-- Happy closed eyes (arch) -->
    <path d="M 21 16 Q 24 19 27 16" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 29 16 Q 32 19 35 16" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Warm smile -->
    <path d="M 26 21 Q 28 24 30 21" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="20" cy="20" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="36" cy="20" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Left Arm & Hand holding mug -->
    <path d="M 16 40 Q 5 45 12 55" fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>
    <circle cx="14" cy="56" r="4" fill="#fcd34d"/>
    
    <!-- Coffee Mug -->
    <rect x="8" y="48" width="10" height="12" rx="2" fill="#f8fafc"/>
    <path d="M 6 50 Q 3 50 3 54 Q 3 58 6 58" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Steam from mug -->
    <path d="M 11 44 Q 9 40 13 36" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>

    <!-- Right Arm leaning towards center -->
    <path d="M 34 40 Q 42 48 48 44" fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Character 2: Female (Right side, leaning on male's shoulder, smiling joyfully) -->
  <g id="female-character" transform="translate(125, 105)">
    <!-- Body & Sweater -->
    <path d="M 15 35 Q 25 30 35 35 L 40 80 L 10 80 Z" fill="#ec4899"/>
    <!-- Head & Neck (Leaning left towards male) -->
    <rect x="18" y="18" width="12" height="10" fill="#fcd34d"/>
    <circle cx="24" cy="18" r="14" fill="#fde68a"/>
    <!-- Hair (Long dark hair flowing back) -->
    <path d="M 14 10 Q 28 2 36 12 Q 42 25 38 45 Q 32 30 28 20 Z" fill="#334155"/>
    <path d="M 16 12 Q 22 8 28 12" fill="#334155"/>
    
    <!-- Face details -->
    <!-- Happy eyes -->
    <path d="M 18 18 Q 21 21 24 18" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 26 18 Q 29 21 32 18" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Joyful smile -->
    <path d="M 22 23 Q 25 26 28 23" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="17" cy="22" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="33" cy="22" r="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Left Arm (hugging/touching) -->
    <path d="M 20 42 Q 10 45 15 52" fill="none" stroke="#db2777" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Right Arm -->
    <path d="M 32 42 Q 42 48 38 58" fill="none" stroke="#db2777" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- ==================== PROPS & ROMANTIC ACCENTS ==================== -->

  <!-- Small Coffee Table in front of sofa -->
  <g id="coffee-table" transform="translate(90, 180)">
    <ellipse cx="30" cy="15" rx="35" ry="12" fill="#64748b"/>
    <ellipse cx="30" cy="13" rx="35" ry="12" fill="#94a3b8"/>
    <!-- Table legs -->
    <rect x="8" y="20" width="4" height="15" fill="#334155"/>
    <rect x="48" y="20" width="4" height="15" fill="#334155"/>
    
    <!-- Plate with cookies on table -->
    <ellipse cx="20" cy="12" rx="10" ry="4" fill="#f8fafc"/>
    <!-- Cookies -->
    <circle cx="18" cy="11" r="2.5" fill="#b45309"/>
    <circle cx="23" cy="12" r="2" fill="#b45309"/>
    
    <!-- Small succulent on table -->
    <path d="M 40 12 L 43 7 L 47 7 L 50 12 Z" fill="#cbd5e1"/>
    <circle cx="45" cy="6" r="3" fill="#10b981"/>
    <circle cx="43" cy="7" r="2.5" fill="#34d399"/>
    <circle cx="47" cy="7" r="2.5" fill="#059669"/>
  </g>

  <!-- Floating Romantic Elements / Hearts (Signifying '恋爱' - Love/Dating) -->
  <g filter="url(#softGlow)">
    <!-- Heart 1 (Medium, near couple's heads) -->
    <path d="M 120 75 C 120 68, 110 65, 105 72 C 100 65, 90 68, 90 75 C 90 83, 105 92, 105 92 C 105 92, 120 83, 120 75 Z" 
          fill="url(#heartGrad)" transform="scale(0.8) translate(35, 10)" opacity="0.9"/>
    
    <!-- Heart 2 (Small, floating up right) -->
    <path d="M 120 75 C 120 68, 110 65, 105 72 C 100 65, 90 68, 90 75 C 90 83, 105 92, 105 92 C 105 92, 120 83, 120 75 Z" 
          fill="#f43f5e" transform="scale(0.4) translate(330, 90)" opacity="0.7"/>

    <!-- Heart 3 (Tiny, near window) -->
    <path d="M 120 75 C 120 68, 110 65, 105 72 C 100 65, 90 68, 90 75 C 90 83, 105 92, 105 92 C 105 92, 120 83, 120 75 Z" 
          fill="#fb7185" transform="scale(0.3) translate(280, 150)" opacity="0.8"/>
  </g>

  <!-- Gentle ambient lighting highlights on the floor -->
  <ellipse cx="120" cy="215" rx="90" ry="10" fill="url(#floorGrad)"/>

  <!-- Foreground cute cat sitting on the rug watching them lovingly -->
  <g transform="translate(60, 185)">
    <!-- Cat body -->
    <ellipse cx="12" cy="15" rx="10" ry="8" fill="#f97316"/>
    <!-- Cat head -->
    <circle cx="8" cy="8" r="7" fill="#f97316"/>
    <!-- Cat ears -->
    <polygon points="3,3 6,0 8,6" fill="#ea580c"/>
    <polygon points="9,2 12,-1 13,5" fill="#ea580c"/>
    <!-- Cat tail -->
    <path d="M 20 18 Q 26 18 24 10" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <!-- Cat face happy expression -->
    <path d="M 6 8 Q 7 10 8 8" fill="none" stroke="#7c2d12" stroke-width="1" stroke-linecap="round"/>
  </g>

</svg>