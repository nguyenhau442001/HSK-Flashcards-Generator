<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Confetti Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="trophy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Character Clothing Gradients -->
    <linearGradient id="shirt-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="shirt-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="shirt-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Stage Lights / Rays -->
  <path d="M120 20 L40 220 L70 220 Z" fill="#38bdf8" opacity="0.05" />
  <path d="M120 20 L200 220 L170 220 Z" fill="#f59e0b" opacity="0.05" />
  <path d="M120 20 L120 220 L135 220 Z" fill="#ffffff" opacity="0.08" />

  <!-- Confetti Elements -->
  <circle cx="45" cy="50" r="3" fill="url(#gold-grad)" />
  <rect x="185" y="40" width="5" height="5" rx="1" fill="url(#cyan-grad)" transform="rotate(25 185 40)" />
  <path d="M 25 100 L 30 108 L 20 108 Z" fill="url(#pink-grad)" />
  <circle cx="210" cy="115" r="2.5" fill="url(#gold-grad)" />
  <rect x="35" y="160" width="4" height="7" rx="1" fill="url(#cyan-grad)" transform="rotate(-15 35 160)" />
  <circle cx="200" cy="170" r="3.5" fill="url(#pink-grad)" />
  <path d="M 120 15 L 123 22 L 117 22 Z" fill="url(#gold-grad)" />

  <!-- Podium Base -->
  <path d="M 60 215 L 180 215 L 195 240 L 45 240 Z" fill="#334155" />
  <path d="M 70 205 L 170 205 L 180 215 L 60 215 Z" fill="#475569" />
  <!-- Podium Highlight Strip -->
  <rect x="75" y="210" width="90" height="3" rx="1.5" fill="#38bdf8" opacity="0.8" />

  <!-- CHARACTER 1: Left (Cheering, Green Outfit) -->
  <g transform="translate(55, 110)">
    <!-- Body / Torso -->
    <path d="M 12 35 C 12 25 28 25 28 35 L 32 65 C 32 70 8 70 8 65 Z" fill="url(#shirt-green)" />
    <!-- Head -->
    <circle cx="20" cy="16" r="10" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 10 14 C 10 8 30 8 30 14 C 30 18 25 18 20 15 C 15 18 10 18 10 14 Z" fill="#1e293b" />
    <!-- Raised Arm Left (Cheering) -->
    <path d="M 10 32 C 0 25 -5 10 -2 5 C 1 2 8 10 12 25 Z" fill="#fbcfe8" />
    <!-- Arm Right (At side) -->
    <path d="M 28 35 C 38 40 40 50 38 55 C 36 58 32 55 30 48 Z" fill="#fbcfe8" />
    <!-- Legs -->
    <rect x="12" y="62" width="6" height="28" rx="3" fill="#1e293b" />
    <rect x="22" y="62" width="6" height="28" rx="3" fill="#1e293b" />
    <!-- Face Expression (Joyful eyes & open smile) -->
    <path d="M 16 14 Q 18 12 20 14" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 22 14 Q 24 12 26 14" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 18 18 Q 20 22 22 18" fill="#e11d48" />
  </g>

  <!-- CHARACTER 3: Right (Cheering, Purple Outfit) -->
  <g transform="translate(145, 110)">
    <!-- Body / Torso -->
    <path d="M 12 35 C 12 25 28 25 28 35 L 32 65 C 32 70 8 70 8 65 Z" fill="url(#shirt-purple)" />
    <!-- Head -->
    <circle cx="20" cy="16" r="10" fill="#fed7aa" />
    <!-- Hair (Ponytail/Bun style) -->
    <circle cx="27" cy="12" r="4" fill="#451a03" />
    <path d="M 10 15 C 10 8 30 8 30 16 C 25 16 20 13 15 15 Z" fill="#451a03" />
    <!-- Arm Left (At side) -->
    <path d="M 12 35 C 2 40 0 50 2 55 C 4 58 8 55 10 48 Z" fill="#fed7aa" />
    <!-- Raised Arm Right (Cheering) -->
    <path d="M 28 32 C 38 25 43 10 40 5 C 37 2 30 10 26 25 Z" fill="#fed7aa" />
    <!-- Legs -->
    <rect x="12" y="62" width="6" height="28" rx="3" fill="#334155" />
    <rect x="22" y="62" width="6" height="28" rx="3" fill="#334155" />
    <!-- Face Expression -->
    <path d="M 15 14 Q 17 12 19 14" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 21 14 Q 23 12 25 14" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 18 18 Q 20 22 22 18" fill="#e11d48" />
  </g>

  <!-- CHARACTER 2: Center (Lifting the Trophy High, Blue Outfit) -->
  <g transform="translate(95, 85)">
    <!-- Body / Torso (Dynamic leaning back slightly) -->
    <path d="M 15 45 C 15 30 35 30 35 45 L 38 80 C 38 85 12 85 12 80 Z" fill="url(#shirt-blue)" />
    
    <!-- Head -->
    <circle cx="25" cy="22" r="11" fill="#fde047" />
    <!-- Spiky Hair -->
    <path d="M 14 18 L 18 10 L 23 16 L 27 9 L 32 15 L 36 12 L 35 20 Z" fill="#1e293b" />
    
    <!-- Face: triumphant expression -->
    <!-- Eyes (happy arcs) -->
    <path d="M 20 20 Q 22 17 24 20" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 26 20 Q 28 17 30 20" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Big joyful smile -->
    <path d="M 21 24 Q 25 29 29 24" fill="#e11d48" />

    <!-- Both Arms Reaching Upwards holding Trophy -->
    <!-- Left Arm -->
    <path d="M 16 42 C 5 35 -2 15 5 5 C 7 3 12 8 15 22 Z" fill="#fde047" />
    <!-- Right Arm -->
    <path d="M 34 42 C 45 35 52 15 45 5 C 43 3 38 8 35 22 Z" fill="#fde047" />

    <!-- TROPHY (Central Hero Prop representing 胜利 / Victory) -->
    <g transform="translate(17, -18)">
      <!-- Trophy Base/Stem -->
      <rect x="23" y="32" width="4" height="8" fill="#b45309" />
      <path d="M 18 40 L 32 40 L 30 43 L 20 43 Z" fill="#d97706" />
      
      <!-- Trophy Cup Body -->
      <path d="M 17 12 C 17 25 33 25 33 12 Z" fill="url(#trophy-grad)" />
      <!-- Cup Rim -->
      <ellipse cx="25" cy="12" rx="8" ry="2.5" fill="#fef08a" />
      <ellipse cx="25" cy="12" rx="7" ry="1.5" fill="#d97706" />
      
      <!-- Left Handle -->
      <path d="M 17 14 C 11 14 11 22 17 22" stroke="url(#trophy-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <!-- Right Handle -->
      <path d="M 33 14 C 39 14 39 22 33 22" stroke="url(#trophy-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
      
      <!-- Star Emblem on Trophy -->
      <path d="M 25 15 L 26.2 17.5 L 29 18 L 27 20 L 27.5 22.5 L 25 21.2 L 22.5 22.5 L 23 20 L 21 18 L 23.8 17.5 Z" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Legs planted firmly -->
    <rect x="16" y="78" width="7" height="30" rx="3.5" fill="#0f172a" />
    <rect x="27" y="78" width="7" height="30" rx="3.5" fill="#0f172a" />
    <!-- Shoes -->
    <path d="M 12 105 L 18 105 L 18 110 L 10 110 C 10 107 11 105 12 105 Z" fill="#ffffff" />
    <path d="M 26 105 L 32 105 C 33 105 34 107 34 110 L 26 110 Z" fill="#ffffff" />
  </g>

  <!-- Additional Foreground Confetti / Sparkles for Celebration Energy -->
  <path d="M 75 80 L 78 86 L 84 89 L 78 92 L 75 98 L 72 92 L 66 89 L 72 86 Z" fill="url(#gold-grad)" opacity="0.9" transform="scale(0.5) translate(60, 40)" />
  <path d="M 350 120 L 353 126 L 359 129 L 353 132 L 350 138 L 347 132 L 341 129 L 347 126 Z" fill="url(#cyan-grad)" opacity="0.8" transform="scale(0.4) translate(40, 80)" />
  
  <circle cx="120" cy="50" r="1.5" fill="#ffffff" />
  <circle cx="105" cy="45" r="1" fill="#fbbf24" />
  <circle cx="135" cy="45" r="1" fill="#38bdf8" />
</svg>