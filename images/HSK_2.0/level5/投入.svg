<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="energyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.6" />
    </linearGradient>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Background Environment & Interior -->
  <!-- Window view (night city with subtle lights) -->
  <g opacity="0.4">
    <rect x="170" y="30" width="45" height="75" rx="4" fill="#090d16" stroke="#475569" stroke-width="1.5" />
    <!-- City lights -->
    <rect x="178" y="45" width="6" height="10" fill="#fbbf24" opacity="0.6" />
    <rect x="189" y="60" width="8" height="12" fill="#38bdf8" opacity="0.6" />
    <rect x="200" y="40" width="5" height="20" fill="#f43f5e" opacity="0.5" />
    <rect x="178" y="75" width="10" height="15" fill="#fbbf24" opacity="0.4" />
    <rect x="195" y="80" width="12" height="18" fill="#38bdf8" opacity="0.5" />
    <!-- Window frame separator -->
    <line x1="192" y1="30" x2="192" y2="105" stroke="#475569" stroke-width="1.5" />
  </g>

  <!-- Bookshelf / Environment Props in Background -->
  <g fill="#334155" opacity="0.7">
    <rect x="25" y="45" width="35" height="60" rx="2" />
    <rect x="28" y="55" width="29" height="4" fill="#64748b" />
    <rect x="28" y="75" width="29" height="4" fill="#64748b" />
    <!-- Books -->
    <path d="M30 52 L35 52 L35 48 L30 48 Z" fill="#f43f5e" />
    <path d="M37 52 L43 52 L43 47 L37 47 Z" fill="#38bdf8" />
    <path d="M45 52 L52 52 L52 49 L45 49 Z" fill="#10b981" />
  </g>

  <!-- Ambient Golden Glow radiating from the character's focus (Mental energy/effort: 投入) -->
  <circle cx="120" cy="130" r="85" fill="url(#glowGrad)" filter="url(#softGlow)" />
  <path d="M 70 150 Q 120 70 170 150 Z" fill="url(#energyGrad)" />

  <!-- Desk and Workspace Props -->
  <g filter="url(#dropShadow)">
    <!-- Main Desk Surface -->
    <path d="M20 170 L220 170 L210 215 L30 215 Z" fill="url(#deskGrad)" />
    <!-- Desk Front Edge -->
    <rect x="25" y="212" width="190" height="6" rx="2" fill="#475569" />
  </g>

  <!-- Equipment on Desk -->
  <!-- Laptop & Creative setup -->
  <g>
    <!-- Laptop Base -->
    <path d="M75 168 L125 168 L135 174 L65 174 Z" fill="#94a3b8" />
    <!-- Laptop Screen -->
    <path d="M77 125 L123 125 L127 168 L73 168 Z" fill="#475569" />
    <rect x="80" y="128" width="43" height="37" rx="2" fill="url(#screenGrad)" />
    <!-- Code / Design UI lines on screen -->
    <path d="M85 135 L105 135" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M85 143 L112 143" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <path d="M85 151 L97 151" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <circle cx="115" cy="151" r="2" fill="#fbbf24" />
  </g>

  <!-- Coffee Mug (symbolizing fuel/energy) -->
  <g>
    <rect x="145" y="152" width="14" height="18" rx="3" fill="#cbd5e1" />
    <path d="M159 156 C163 156 163 166 159 166" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M149 146 Q151 142 149 138" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M155 148 Q157 143 155 139" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Stack of Reference Papers/Notes -->
  <g transform="translate(45, 155)">
    <rect x="0" y="5" width="20" height="14" rx="1" fill="#f1f5f9" transform="rotate(-5 10 12)" />
    <rect x="2" y="3" width="20" height="14" rx="1" fill="#e2e8f0" transform="rotate(3 12 10)" />
    <rect x="4" y="0" width="20" height="15" rx="1" fill="#ffffff" />
    <line x1="7" y1="4" x2="18" y2="4" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="7" y1="8" x2="15" y2="8" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="7" y1="12" x2="13" y2="12" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Main Character (Deeply focused, leaning forward, fully immersed/投入) -->
  <g id="character" filter="url(#dropShadow)">
    <!-- Character Torso / Hoodie (Warm Navy/Indigo) -->
    <path d="M95 180 C95 155 105 135 125 135 C145 135 155 155 155 180 Z" fill="#3b82f6" />
    
    <!-- Hoodie Hood/Back -->
    <path d="M100 135 C100 115 112 105 125 105 C138 105 150 115 150 135 Z" fill="#2563eb" />

    <!-- Arms / Sleeves leaning forward to type/work -->
    <!-- Left Arm -->
    <path d="M100 145 Q80 155 85 170" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M150 145 Q165 155 155 172" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" />

    <!-- Hands -->
    <circle cx="85" cy="172" r="5" fill="#fcd34d" />
    <circle cx="155" cy="173" r="5" fill="#fcd34d" />

    <!-- Neck -->
    <rect x="117" y="100" width="16" height="15" rx="4" fill="#fcd34d" />

    <!-- Head & Face (Contoured forward, intense concentration) -->
    <g transform="translate(125, 92)">
      <!-- Hair (Stylized dark neat hair) -->
      <path d="M-18 -2 C-18 -15 -5 -20 5 -20 C18 -20 20 -10 20 -2 C20 4 18 8 18 8 C18 8 10 -2 -2 -5 C-12 -8 -18 -2 -18 -2 Z" fill="#1e293b" />
      
      <!-- Head Base -->
      <rect x="-16" y="-8" width="32" height="34" rx="14" fill="#fcd34d" />
      
      <!-- Focused Eyes (Squinted / Intense brow line) -->
      <path d="M-10 4 L-3 6" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M3 6 L10 4" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      
      <!-- Determined Eyebrows (Slanted down for focus) -->
      <path d="M-11 1 L-3 4" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />
      <path d="M3 4 L11 1" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />

      <!-- Concentrated Mouth (Determined straight line / slight bite) -->
      <path d="M-3 15 L3 15" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

      <!-- Cute Round Rosy Cheek -->
      <circle cx="-10" cy="11" r="3" fill="#f43f5e" opacity="0.3" />
      <circle cx="10" cy="11" r="3" fill="#f43f5e" opacity="0.3" />
    </g>
  </g>

  <!-- Floating Energy Sparks / Mental Focus Particles (Illustrating "投入" - pouring energy into work) -->
  <g>
    <!-- Glowing Orbs / Sparks representing high mental effort and concentration -->
    <circle cx="120" cy="65" r="3" fill="#fbbf24" filter="url(#softGlow)" />
    <circle cx="95" cy="75" r="2" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="145" cy="70" r="2.5" fill="#f43f5e" filter="url(#softGlow)" />
    <circle cx="135" cy="50" r="1.5" fill="#fef08a" />
    <circle cx="105" cy="55" r="2" fill="#34d399" />
    
    <!-- Dynamic light rays / concentration aura -->
    <path d="M120 40 L120 48" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M98 48 L104 53" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M142 48 L136 53" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Ambient Foreground Elements (Desk framing) -->
  <path d="M0 240 L240 240 L240 230 L0 230 Z" fill="#0f172a" />
</svg>