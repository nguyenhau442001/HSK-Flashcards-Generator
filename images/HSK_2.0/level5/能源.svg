<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Solar Panel Glow -->
    <radialGradient id="solarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Energy Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Wind Turbine Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <circle cx="180" cy="60" r="80" fill="url(#solarGlow)"/>
  <circle cx="120" cy="140" r="100" fill="url(#coreGlow)"/>

  <!-- Distant Mountains / Eco Landscape -->
  <path d="M 0 190 Q 50 150 100 170 T 240 160 L 240 240 L 0 240 Z" fill="#131c2e"/>
  <path d="M 0 200 Q 80 170 150 190 T 240 180 L 240 240 L 0 240 Z" fill="#0b1322"/>

  <!-- ENERGY ECOSYSTEM SCENE -->
  
  <!-- 1. Wind Turbine (Right background) -->
  <g transform="translate(180, 110)">
    <!-- Tower -->
    <path d="M -2 40 L 2 40 L 1 0 L -1 0 Z" fill="#94a3b8"/>
    <!-- Rotating Blades Hub -->
    <circle cx="0" cy="0" r="3" fill="#cbd5e1"/>
    <!-- Blades (Grouped and angled) -->
    <g>
      <path d="M 0 0 C 2 -25 15 -35 12 -45 C 5 -35 -2 -20 0 0" fill="url(#bladeGrad)"/>
      <path d="M 0 0 C -25 -2 -35 -15 -45 -12 C -35 -5 -20 2 0 0" fill="url(#bladeGrad)" transform="rotate(120)"/>
      <path d="M 0 0 C 25 2 35 15 45 12 C 35 5 20 -2 0 0" fill="url(#bladeGrad)" transform="rotate(240)"/>
    </g>
  </g>

  <!-- 2. Modern Eco House (Left Foreground) -->
  <g transform="translate(40, 120)">
    <!-- House Base -->
    <rect x="0" y="20" width="60" height="50" rx="4" fill="#334155"/>
    <!-- Warm Window Light -->
    <rect x="10" y="32" width="16" height="20" rx="2" fill="#fbbf24" opacity="0.8"/>
    <rect x="34" y="32" width="16" height="20" rx="2" fill="#fbbf24" opacity="0.8"/>
    <!-- Roof with Solar Panels -->
    <polygon points="-5,20 30,-5 65,20" fill="#475569"/>
    <!-- Solar Panels on Roof -->
    <rect x="8" y="5" width="22" height="12" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="1" transform="rotate(-15 8 5)"/>
    <rect x="33" y="2" width="22" height="12" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="1" transform="rotate(-15 33 2)"/>
  </g>

  <!-- 3. Central Energy Storage / Smart Grid Hub (Hero Object) -->
  <g transform="translate(120, 150)">
    <!-- Base Platform -->
    <ellipse cx="0" cy="25" rx="35" ry="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Outer Ring / Conduit -->
    <path d="M -30 10 C -30 25 30 25 30 10" fill="none" stroke="#1e293b" stroke-width="6"/>
    <path d="M -30 10 C -30 25 30 25 30 10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 5"/>

    <!-- Central Energy Battery / Core Structure -->
    <rect x="-18" y="-20" width="36" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Energy Level Indicator Bars -->
    <rect x="-12" y="-12" width="24" height="5" rx="2.5" fill="#10b981"/>
    <rect x="-12" y="-4" width="24" height="5" rx="2.5" fill="#10b981"/>
    <rect x="-12" y="4" width="24" height="5" rx="2.5" fill="#38bdf8"/>

    <!-- Glowing Core Center -->
    <circle cx="0" cy="22" r="6" fill="#10b981"/>
    <circle cx="0" cy="22" r="10" fill="none" fill-opacity="0" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- 4. Dynamic Energy Flow Lines (Connecting generation to storage) -->
  <!-- From Windmill to Hub -->
  <path d="M 170 115 Q 150 130 135 150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <!-- From House/Solar to Hub -->
  <path d="M 85 130 Q 100 145 110 155" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- 5. Floating Energy Particles / Leaves (Eco-Friendly Vibe) -->
  <g fill="#10b981">
    <!-- Leaf 1 -->
    <path d="M 95 90 C 100 85 105 92 100 97 C 95 100 90 95 95 90 Z" transform="rotate(15 95 90)"/>
    <!-- Leaf 2 -->
    <path d="M 145 80 C 148 75 153 80 150 85 C 145 88 142 84 145 80 Z" transform="rotate(-30 145 80)"/>
    <!-- Glowing Energy Sparks -->
    <circle cx="115" cy="110" r="2.5" fill="#38bdf8"/>
    <circle cx="135" cy="100" r="2" fill="#fbbf24"/>
    <circle cx="80" cy="100" r="1.5" fill="#10b981"/>
    <circle cx="155" cy="130" r="2" fill="#38bdf8"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Frame Border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>