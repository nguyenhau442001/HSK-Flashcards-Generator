<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow behind discussion -->
    <radialGradient id="lampGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow for UI/Whiteboard -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lamp Glow & Window -->
  <circle cx="120" cy="90" r="100" fill="url(#lampGlow)" />
  <polygon points="0,0 120,0 90,240 0,240" fill="url(#windowLight)" />

  <!-- Room Interior Background Elements -->
  <!-- Bookshelf on left -->
  <g opacity="0.6">
    <rect x="12" y="50" width="24" height="110" rx="2" fill="#334155" />
    <rect x="15" y="65" width="18" height="4" fill="#64748b" />
    <rect x="15" y="95" width="18" height="4" fill="#64748b" />
    <rect x="15" y="125" width="18" height="4" fill="#64748b" />
    <!-- Books -->
    <path d="M16 60h4v5h-4zM22 58h4v7h-4z" fill="#f43f5e" />
    <path d="M16 88h5v7h-5zM23 90h3v5h-3z" fill="#10b981" />
    <path d="M16 118h4v7h-4zM22 116h5v9h-5z" fill="#f59e0b" />
  </g>

  <!-- Large Whiteboard / Idea Board in background -->
  <rect x="55" y="32" width="130" height="75" rx="6" fill="#f8fafc" filter="url(#softShadow)" />
  <rect x="62" y="40" width="40" height="6" rx="3" fill="#cbd5e1" />
  <rect x="62" y="52" width="115" height="4" rx="2" fill="#e2e8f0" />
  <!-- Colorful sticky notes on whiteboard representing "opinions/ideas" -->
  <rect x="65" y="62" width="22" height="20" rx="2" fill="#fef08a" />
  <circle cx="76" cy="72" r="4" fill="#ca8a04" opacity="0.6" />
  
  <rect x="95" y="62" width="22" height="20" rx="2" fill="#fed7aa" />
  <path d="M101 70l4 4 7-7" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <rect x="125" y="62" width="22" height="20" rx="2" fill="#bae6fd" />
  <circle cx="136" cy="72" r="5" stroke="#0369a1" stroke-width="2" fill="none" />

  <rect x="155" y="62" width="22" height="20" rx="2" fill="#fbcfe8" />
  <path d="M161 72h10M166 67v10" stroke="#be185d" stroke-width="2" stroke-linecap="round" />

  <!-- Conference Table -->
  <path d="M35 155 L205 155 L195 185 L45 185 Z" fill="#334155" filter="url(#softShadow)" />
  <path d="M40 150 L200 150 L205 155 L35 155 Z" fill="#475569" />

  <!-- Table Props: Laptops, Notebook, Coffee Mug -->
  <!-- Laptop Left -->
  <rect x="55" y="142" width="26" height="12" rx="1" fill="#cbd5e1" />
  <polygon points="50,154 86,154 90,158 46,158" fill="#94a3b8" />
  <!-- Notebook Center -->
  <rect x="108" y="145" width="24" height="15" rx="1" fill="#f1f5f9" />
  <line x1="120" y1="145" x2="120" y2="160" stroke="#cbd5e1" stroke-width="1" />
  <path d="M112 149h6M112 153h6M124 149h6M124 153h6" stroke="#64748b" stroke-width="1" stroke-linecap="round" />
  <!-- Coffee Mug -->
  <rect x="160" y="140" width="10" height="12" rx="2" fill="#f43f5e" />
  <path d="M170 143c2 0 3 1 3 3s-1 3-3 3" stroke="#f43f5e" stroke-width="2" fill="none" />

  <!-- CHARACTERS (The Scene: "Anh ấy đã trưng cầu ý kiến của mọi người.") -->
  
  <!-- Character 1: Left Participant (Listening/Nodding) -->
  <g transform="translate(15, 100)">
    <!-- Body & Clothes -->
    <path d="M15 50 C15 38 25 35 35 35 C45 35 55 38 55 50 L60 85 L10 85 Z" fill="#0284c7" />
    <!-- Head & Hair -->
    <circle cx="35" cy="22" r="13" fill="#fbcfe8" />
    <path d="M23 20 C23 10 47 10 47 20 C47 25 45 28 45 28 L25 28 Z" fill="#334155" />
    <!-- Facial Features (Friendly, engaged) -->
    <circle cx="31" cy="22" r="1.5" fill="#1e293b" />
    <circle cx="39" cy="22" r="1.5" fill="#1e293b" />
    <path d="M33 26 Q35 28 37 26" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Hand gesturing softly -->
    <circle cx="50" cy="55" r="5" fill="#fbcfe8" />
  </g>

  <!-- Character 2: Right Participant (Raising hand / Sharing opinion) -->
  <g transform="translate(160, 95)">
    <!-- Body & Clothes -->
    <path d="M15 55 C15 43 25 40 35 40 C45 40 55 43 55 55 L65 90 L5 90 Z" fill="#10b981" />
    <!-- Head & Hair -->
    <circle cx="35" cy="24" r="13" fill="#fde68a" />
    <path d="M22 22 C24 10 46 10 48 22 C40 25 30 25 22 22 Z" fill="#78350f" />
    <!-- Facial Features -->
    <circle cx="31" cy="24" r="1.5" fill="#1e293b" />
    <circle cx="39" cy="24" r="1.5" fill="#1e293b" />
    <path d="M33 28 Q35 30 37 28" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Raised arm sharing an idea -->
    <path d="M50 48 L62 25 L68 28 L55 55 Z" fill="#fde68a" />
    <circle cx="65" cy="23" r="4" fill="#fde68a" />
  </g>

  <!-- MAIN CHARACTER: The Presenter/Leader in the center (Anh ấy - He is asking for everyone's opinion/征求意见) -->
  <g transform="translate(85, 80)">
    <!-- Torso / Smart Casual Blazer -->
    <path d="M20 65 C20 50 30 45 45 45 C60 45 70 50 70 65 L75 110 L15 110 Z" fill="#4f46e5" />
    <!-- Inner Shirt & Tie -->
    <path d="M37 45 L53 45 L50 70 L40 70 Z" fill="#f8fafc" />
    <polygon points="43,50 47,50 49,65 41,65" fill="#e11d48" />

    <!-- Head & Expressive Face -->
    <circle cx="45" cy="28" r="15" fill="#ffedd5" />
    <!-- Stylish Hair -->
    <path d="M30 25 C30 13 60 13 60 25 C60 28 58 32 58 32 L32 32 C32 32 30 28 30 25 Z" fill="#1e293b" />

    <!-- Facial Expression: Open, welcoming, inquiring expression -->
    <circle cx="39" cy="27" r="1.5" fill="#1e293b" />
    <circle cx="51" cy="27" r="1.5" fill="#1e293b" />
    <!-- Eyebrows raised inquiringly -->
    <path d="M37 23 Q39 21 41 23" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M49 23 Q51 21 53 23" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <!-- Open friendly mouth asking a question -->
    <ellipse cx="45" cy="33" rx="3.5" ry="2.5" fill="#9f1239" />

    <!-- Arms spread wide, gesturing toward everyone ("What do you all think?") -->
    <!-- Left Arm outward -->
    <path d="M23 52 C15 55 8 62 5 68 C12 73 18 68 25 58 Z" fill="#4f46e5" />
    <circle cx="3" cy="69" r="4.5" fill="#ffedd5" />

    <!-- Right Arm outward -->
    <path d="M67 52 C75 55 82 62 85 68 C78 73 72 68 65 58 Z" fill="#4f46e5" />
    <circle cx="87" cy="69" r="4.5" fill="#ffedd5" />
  </g>

  <!-- Floating "Consultation / Ideas" Speech Bubble Graphic above central character -->
  <g transform="translate(95, 22)" filter="url(#softShadow)">
    <rect x="-10" y="-12" width="70" height="32" rx="16" fill="#ffffff" />
    <polygon points="20,20 25,28 30,20" fill="#ffffff" />
    <!-- Icon inside bubble: Three chat dots / suggestion icon -->
    <circle cx="10" cy="4" r="4" fill="#38bdf8" />
    <circle cx="25" cy="4" r="4" fill="#fbbf24" />
    <circle cx="40" cy="4" r="4" fill="#10b981" />
  </g>

  <!-- Foreground plant for depth and framing -->
  <g transform="translate(10, 185)">
    <path d="M15 35 Q15 10 25 0 Q25 15 28 35 Z" fill="#059669" />
    <path d="M10 40 Q0 25 5 10 Q12 25 20 40 Z" fill="#10b981" />
    <path d="M22 45 Q35 30 35 15 Q28 30 25 45 Z" fill="#34d399" />
    <path d="M5 35 C5 25 25 25 25 35 Z" fill="#334155" />
    <rect x="2" y="35" width="28" height="15" rx="4" fill="#475569" />
  </g>
</svg>