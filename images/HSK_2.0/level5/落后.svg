<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Modern Neon Glow Gradient -->
    <linearGradient id="modernGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Vintage/Retro Glow Gradient -->
    <linearGradient id="retroGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Holographic screen grid pattern -->
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Cityscapes/Split contrast) -->
  <g id="environment">
    <!-- Left side: Retro/Outdated environment vibe -->
    <path d="M 15 170 L 45 140 L 45 170 Z" fill="#334155" opacity="0.3"/>
    <rect x="25" y="145" width="12" height="25" fill="#475569" opacity="0.4"/>
    
    <!-- Right side: Futuristic/Advanced environment vibe -->
    <g opacity="0.3">
      <rect x="180" y="90" width="35" height="80" rx="4" fill="#0284c7"/>
      <line x1="180" y1="100" x2="215" y2="100" stroke="#38bdf8" stroke-width="2"/>
      <line x1="180" y1="115" x2="215" y2="115" stroke="#38bdf8" stroke-width="2"/>
      <line x1="180" y1="130" x2="215" y2="130" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="197" cy="80" r="4" fill="#38bdf8" filter="url(#glow)"/>
      <path d="M 197 84 L 197 90" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <!-- Ground Plane -->
    <path d="M 10 170 Q 120 160 230 170 L 235 185 Q 120 195 5 185 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <ellipse cx="120" cy="175" rx="100" ry="15" fill="#0b0f19" opacity="0.6"/>
  </g>

  <!-- COMPARATIVE SCENE: The Outdated/Lagging Subject vs Modernity -->
  
  <!-- LEFT: The Outdated Object (Heavy, analog, dusty box television / vacuum tube monitor with rabbit ears) -->
  <g id="outdated-device" transform="translate(45, 95)" filter="url(#shadow)">
    <!-- Wooden/Bakelite Casing -->
    <rect x="0" y="15" width="75" height="60" rx="8" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <rect x="6" y="21" width="63" height="48" rx="4" fill="#92400e"/>
    
    <!-- Dusty Screen (Convex CRT) -->
    <rect x="10" y="25" width="40" height="40" rx="6" fill="#1c1917" stroke="#78350f" stroke-width="2"/>
    <!-- Glitchy/Faded static glow inside old screen -->
    <path d="M 14 35 Q 30 28 46 38" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 16 50 Q 30 55 44 45" stroke="#ea580c" stroke-width="1.5" fill="none" opacity="0.3"/>
    <circle cx="30" cy="45" r="8" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

    <!-- Control Knobs and Speaker Grille -->
    <circle cx="59" cy="35" r="3" fill="#d97706" stroke="#451a03" stroke-width="1"/>
    <circle cx="59" cy="47" r="3" fill="#d97706" stroke="#451a03" stroke-width="1"/>
    <line x1="56" y1="57" x2="62" y2="57" stroke="#451a03" stroke-width="1.5"/>
    <line x1="56" y1="60" x2="62" y2="60" stroke="#451a03" stroke-width="1.5"/>
    <line x1="56" y1="63" x2="62" y2="63" stroke="#451a03" stroke-width="1.5"/>

    <!-- Rabbit Ear Antennas (Bent & Clunky) -->
    <path d="M 25 15 L 8 -5" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 50 15 L 62 -2" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="8" cy="-5" r="2" fill="#d97706"/>
    <circle cx="62" cy="-2" r="2" fill="#d97706"/>

    <!-- Stand/Feet -->
    <rect x="15" y="75" width="10" height="4" fill="#451a03"/>
    <rect x="50" y="75" width="10" height="4" fill="#451a03"/>
  </g>

  <!-- CONNECTION / GAP (Dotted lag trail showing falling behind) -->
  <g id="lag-trail" opacity="0.7">
    <path d="M 125 130 Q 140 120 155 130" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="152,126 160,131 152,135" fill="#f59e0b"/>
  </g>

  <!-- RIGHT: The Modern Advanced Equivalent (Sleek Holographic Floating Pad/Visor representing progress) -->
  <g id="modern-device" transform="translate(135, 80)" filter="url(#shadow)">
    <!-- Floating Holographic Display Base -->
    <ellipse cx="35" cy="75" rx="30" ry="8" fill="#38bdf8" opacity="0.3" filter="url(#glow)"/>
    
    <!-- Sleek Slim Body -->
    <rect x="10" y="15" width="50" height="55" rx="6" fill="#0f172a" stroke="url(#modernGlow)" stroke-width="2"/>
    
    <!-- Vibrant Holographic Screen -->
    <rect x="14" y="19" width="42" height="40" rx="4" fill="#1e293b"/>
    <rect x="14" y="19" width="42" height="40" rx="4" fill="url(#grid)"/>

    <!-- UI Elements in Hologram (Clean curves, data visualization) -->
    <path d="M 20 45 L 26 35 L 32 40 L 42 26 L 48 32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="26" r="3" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="20" cy="45" r="2" fill="#38bdf8"/>

    <!-- Floating status rings -->
    <ellipse cx="35" cy="15" rx="15" ry="3" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.8"/>
    <circle cx="35" cy="5" r="2" fill="#38bdf8" filter="url(#glow)"/>
    <line x1="35" y1="7" x2="35" y2="12" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- ACTION & EMPHASIS: Motion lines and directional contrast -->
  <g id="action-elements">
    <!-- Slow / Dragging weight indicator on the left side -->
    <path d="M 20 135 L 32 135" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 24 142 L 32 142" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Fast / Speed lines on the right side -->
    <path d="M 205 95 L 220 95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 200 105 L 225 105" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 210 115 L 220 115" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- CHARACTER / NARRATIVE PROP: Frustrated cute robot or observer left behind -->
  <g id="observer-creature" transform="translate(85, 125)" filter="url(#shadow)">
    <!-- Little round retro robot body (reflecting 'falling behind') -->
    <circle cx="20" cy="25" r="14" fill="#475569" stroke="#334155" stroke-width="2"/>
    <!-- Visor eye showing a loading/lagging status -->
    <rect x="13" y="21" width="14" height="6" rx="3" fill="#1e293b"/>
    <circle cx="16" cy="24" r="2" fill="#fb923c" filter="url(#glow)"/>
    <circle cx="24" cy="24" r="2" fill="#fb923c" filter="url(#glow)"/>
    
    <!-- Sad droopy antenna -->
    <path d="M 20 11 Q 25 2 30 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="31" cy="6" r="2.5" fill="#ef4444"/>

    <!-- Little arms holding head in despair/lag -->
    <path d="M 9 28 Q 5 25 8 20" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <path d="M 31 28 Q 35 25 32 20" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

    <!-- Tread/Wheels at base -->
    <rect x="10" y="37" width="20" height="6" rx="3" fill="#334155"/>
  </g>

  <!-- Foreground Atmospheric Sparks & Dust -->
  <circle cx="50" cy="110" r="1.5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="70" cy="130" r="1" fill="#f59e0b" opacity="0.4"/>
  <circle cx="35" cy="150" r="2" fill="#ea580c" opacity="0.5" filter="url(#glow)"/>
  <circle cx="170" cy="70" r="2" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="210" cy="140" r="1.5" fill="#c084fc" opacity="0.7"/>

  <!-- Dramatic directional lighting overlay -->
  <radialGradient id="spotlight" cx="70%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" pointer-events="none"/>
</svg>