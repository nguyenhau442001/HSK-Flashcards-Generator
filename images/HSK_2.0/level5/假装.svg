<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Theme -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mask-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Room Elements -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#090d16" opacity="0.6"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" opacity="0.4"/>
  
  <!-- Ambient Spotlight over the character -->
  <path d="M70 0 L170 0 L210 180 L30 180 Z" fill="url(#spotlight)" />

  <!-- Background props: Detective board & Bookshelf -->
  <rect x="25" y="45" width="45" height="60" rx="4" fill="#334155" opacity="0.3"/>
  <circle cx="47" cy="75" r="12" fill="#475569" opacity="0.4"/>
  <line x1="35" y1="60" x2="55" y2="60" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  
  <rect x="175" y="55" width="35" height="90" rx="2" fill="#1e293b" opacity="0.5" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="85" x2="210" y2="85" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="115" x2="210" y2="115" stroke="#334155" stroke-width="2"/>

  <!-- Plant Prop -->
  <path d="M195 180 L205 145 L215 180 Z" fill="#475569" opacity="0.7"/>
  <path d="M200 145 Q190 120 175 125" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M205 145 Q220 110 230 115" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M202 145 Q200 110 205 95" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- MAIN CHARACTER: The "Pretender" (Sly Detective / Innocent Bystander persona) -->
  <!-- Shadow under character -->
  <ellipse cx="120" cy="183" rx="45" ry="8" fill="#020617" opacity="0.8"/>

  <!-- Body / Trench Coat -->
  <path d="M90 130 L150 130 L160 180 L80 180 Z" fill="url(#coat-grad)"/>
  <!-- Coat Lapels -->
  <path d="M105 130 L120 160 L100 180" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M135 130 L120 160 L140 180" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="155" r="2" fill="#fbbf24"/>
  <circle cx="120" cy="170" r="2" fill="#fbbf24"/>

  <!-- Neck -->
  <rect x="112" y="118" width="16" height="15" fill="#fcd34d" rx="4"/>

  <!-- Head -->
  <circle cx="120" cy="95" r="28" fill="#fcd34d"/>

  <!-- Hair (Peeking out under hat) -->
  <path d="M96 95 C96 80 105 75 120 74 C135 75 144 80 144 95 C135 88 105 88 96 95 Z" fill="#334155"/>

  <!-- Classic Detective Hat (Fedora) tilted playfully -->
  <path d="M85 82 C100 70 140 70 155 82 C145 88 95 88 85 82 Z" fill="#1e293b"/>
  <path d="M96 74 C105 60 135 60 144 74 C135 76 105 76 96 74 Z" fill="#334155"/>
  <rect x="98" y="71" width="44" height="4" fill="#fbbf24" rx="1"/>

  <!-- Playful Expressions (The Act: Looking innocent while peeking / pretending) -->
  <!-- Sly curved eyebrows -->
  <path d="M104 88 Q110 84 116 88" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M124 88 Q130 84 136 88" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes looking sideways (feigning ignorance) -->
  <circle cx="110" cy="95" r="3.5" fill="#1e293b"/>
  <circle cx="130" cy="95" r="3.5" fill="#1e293b"/>
  <!-- Eye highlights -->
  <circle cx="111.5" cy="93.5" r="1" fill="#ffffff"/>
  <circle cx="131.5" cy="93.5" r="1" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <circle cx="103" cy="102" r="5" fill="#f43f5e" opacity="0.3"/>
  <circle cx="137" cy="102" r="5" fill="#f43f5e" opacity="0.3"/>

  <!-- Smug/Innocent Whistling or Smiling Mouth -->
  <path d="M116 106 Q120 112 124 106" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- THE MASK (The core visual metaphor for "pretending") -->
  <!-- Being held delicately in front of the face or slightly tilted -->
  <g transform="translate(132, 102) rotate(15)">
    <!-- Mask Body -->
    <path d="M 0 0 C 25 -10 40 10 35 30 C 30 45 10 50 -5 35 C -15 25 -10 5 0 0 Z" fill="url(#mask-grad)" stroke="#d97706" stroke-width="2" filter="url(#glow)"/>
    <!-- Mask Eyes Cutouts -->
    <path d="M 5 10 Q 12 5 18 12 Q 12 18 5 10 Z" fill="#0f172a"/>
    <path d="M 20 13 Q 26 8 32 15 Q 26 21 20 13 Z" fill="#0f172a"/>
    <!-- Mask Stick / Handle -->
    <line x1="28" y1="32" x2="45" y2="60" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="60" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Hand holding the mask stick -->
  <path d="M148 135 C152 130 156 135 153 142 C150 148 142 145 140 140 Z" fill="#fcd34d"/>

  <!-- Foreground Props: Suspicious magnifying glass & paper trail -->
  <!-- Magnifying glass dropped on the floor / table -->
  <g transform="translate(60, 160) rotate(-25)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#cbd5e1" stroke-width="5" opacity="0.9"/>
    <circle cx="0" cy="0" r="16" fill="#38bdf8" opacity="0.15"/>
    <path d="M 12 12 L 28 28" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="4" fill="#64748b"/>
  </g>

  <!-- Confidential File / Paper with question marks implied through shapes -->
  <g transform="translate(45, 140) rotate(10)">
    <rect x="0" y="0" width="35" height="45" rx="2" fill="#f8fafc" opacity="0.9"/>
    <line x1="6" y1="10" x2="22" y2="10" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="29" y2="18" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="26" x2="18" y2="26" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Red Stamp (Simulating secret/investigation) -->
    <rect x="18" y="28" width="14" height="10" rx="1" fill="none" stroke="#ef4444" stroke-width="2" transform="rotate(-10 25 33)"/>
  </g>

  <!-- Dynamic floating magical action particles / suspense sparkles -->
  <circle cx="85" cy="115" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="165" cy="95" r="2" fill="#38bdf8" opacity="0.8"/>
  <path d="M 75 75 Q 80 70 85 75 Q 80 80 75 75 Z" fill="#38bdf8" opacity="0.6"/>
  <path d="M 160 135 Q 164 130 168 135 Q 164 140 160 135 Z" fill="#fbbf24" opacity="0.7"/>

  <!-- Border Frame Accent for App UI Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>