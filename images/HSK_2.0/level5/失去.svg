<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Office Interior (Dimly lit, melancholic blue tones) -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b" opacity="0.6"/>
  
  <!-- Window with Night City Light -->
  <rect x="35" y="35" width="55" height="75" rx="4" fill="#090d16"/>
  <path d="M62.5 35V110" stroke="#1e293b" stroke-width="2"/>
  <path d="M35 72.5H90" stroke="#1e293b" stroke-width="2"/>
  <!-- City lights through window -->
  <circle cx="48" cy="85" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="75" cy="95" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="65" cy="60" r="1.5" fill="#fb923c" opacity="0.7"/>

  <!-- Office Desk -->
  <path d="M20 150H220V165H20Z" fill="#334155"/>
  <rect x="25" y="155" width="45" height="5" rx="2.5" fill="#475569"/> <!-- Drawer handle -->
  
  <!-- Desk Props: Cardboard Box of Personal Belongings (Loss / Fired motif) -->
  <path d="M140 125L155 115H195L210 125V150H140V125Z" fill="#b45309"/>
  <path d="M140 125L175 135L210 125" stroke="#92400e" stroke-width="2" fill="none"/>
  <path d="M155 115L170 122H180L195 115" fill="#d97706"/>
  <!-- sticking out items -->
  <rect x="155" y="105" width="12" height="20" rx="2" fill="#38bdf8" transform="rotate(-15 155 105)"/>
  <rect x="175" y="102" width="16" height="22" rx="2" fill="#f8fafc" transform="rotate(10 175 102)"/>

  <!-- Computer Monitor (Off / Blank) -->
  <rect x="75" y="70" width="55" height="40" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <path d="M98 110H108V122H98V110Z" fill="#475569"/>
  <rect x="90" y="122" width="28" height="4" rx="2" fill="#64748b"/>
  <!-- Reflection on monitor -->
  <path d="M80 75L95 75L85 105H80V75Z" fill="#334155" opacity="0.3"/>

  <!-- Office Chair -->
  <path d="M100 135H120V175H100Z" fill="#334155"/>
  <circle cx="110" cy="130" r="12" fill="#1e293b"/>

  <!-- Sad Male Character Depicting "Lost Job" -->
  <!-- Body/Torso -->
  <path d="M95 180C95 160 105 145 120 145C135 145 145 160 145 180V190H95V180Z" fill="#1d4ed8"/> <!-- Blue office shirt -->
  
  <!-- Tie -->
  <polygon points="117,145 123,145 121,170 119,170" fill="#ef4444"/>

  <!-- Head & Hair -->
  <circle cx="120" cy="120" r="16" fill="#fbcfe8"/> <!-- Skin -->
  <!-- Slumped head posture: head tilted slightly forward -->
  <path d="M104 120C104 108 112 104 120 104C130 104 136 110 136 122C130 120 125 122 120 124C115 122 108 122 104 120Z" fill="#334155"/> <!-- Hair -->

  <!-- Slumped Arms / Hands resting on knees/desk -->
  <path d="M95 155L80 175H90L100 160" fill="#1d4ed8"/>
  <circle cx="78" cy="177" r="4" fill="#fbcfe8"/> <!-- Hand -->

  <!-- Glowing warm desk lamp providing dramatic contrast -->
  <path d="M190 60L170 95H210L190 60Z" fill="#f59e0b" opacity="0.2"/> <!-- Light beam cone -->
  <path d="M185 55H195V62H185Z" fill="#64748b"/>
  <path d="M175 55C175 48 181 42 188 42H192C199 42 205 48 205 55H175Z" fill="#f59e0b"/>
  <circle cx="190" cy="57" r="4" fill="#fef08a"/> <!-- Bulb glow -->

  <!-- Emotional atmosphere lines (subtle downward motion/sadness) -->
  <path d="M132 108C136 112 138 118 138 124" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>