<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Desk Light Gradient -->
    <radialGradient id="deskLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ffd8b8" />
    </linearGradient>

    <!-- Hoodie Gradient -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="110" r="110" fill="url(#deskLight)" />

  <!-- BACKGROUND ROOM DETAILS -->
  <!-- Bookshelf Background Elements -->
  <rect x="25" y="45" width="45" height="70" rx="4" fill="#334155" opacity="0.4" />
  <rect x="32" y="52" width="8" height="55" fill="#f43f5e" opacity="0.5" />
  <rect x="42" y="58" width="6" height="49" fill="#10b981" opacity="0.5" />
  <rect x="50" y="50" width="10" height="57" fill="#fbbf24" opacity="0.5" />

  <!-- Window with Night City Glow -->
  <path d="M165 35 h45 v65 h-45 z" fill="#090d16" stroke="#475569" stroke-width="3" rx="4" />
  <!-- City Lights outside window -->
  <circle cx="178" cy="55" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="192" cy="70" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="183" cy="85" r="1.5" fill="#f43f5e" opacity="0.7" />
  <path d="M165 67 h45" stroke="#475569" stroke-width="2" />
  <path d="M187 35 v65" stroke="#475569" stroke-width="2" />
  <!-- Window Curtain -->
  <path d="M165 35 c5 20 -2 40 3 65" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- Study Desk Surface -->
  <path d="M20 185 L220 185 L235 210 L5 210 Z" fill="#0f172a" />
  <path d="M20 180 L220 180 L220 186 L20 186 Z" fill="#475569" />

  <!-- DESK PROPS -->
  <!-- Desk Lamp -->
  <path d="M195 180 L190 120 L175 105" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M163 100 L185 95 L180 115 L160 115 Z" fill="#f59e0b" />
  <!-- Lamp Beam Cone -->
  <polygon points="172,112 110,183 145,183" fill="#fbbf24" opacity="0.12" />

  <!-- Pencil Holder & Pens -->
  <rect x="145" y="155" width="16" height="25" rx="3" fill="#64748b" />
  <line x1="149" y1="155" x2="147" y2="142" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="155" y1="155" x2="158" y2="140" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />

  <!-- Coffee Mug with Steam -->
  <rect x="35" y="162" width="18" height="20" rx="3" fill="#f8fafc" />
  <path d="M53 168 c5 0 5 8 0 8" fill="none" stroke="#f8fafc" stroke-width="3" />
  <path d="M40 155 q3 -6 0 -12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M46 153 q-3 -6 0 -12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- OPEN BOOK (THE CENTERPIECE OF "READING / NIAN") -->
  <g transform="translate(75, 145)">
    <!-- Book Shadow -->
    <ellipse cx="45" cy="42" rx="42" ry="12" fill="#000000" opacity="0.4" />
    
    <!-- Left Page -->
    <path d="M5 35 Q 45 20 45 45 L 45 75 Q 45 60 5 65 Z" fill="url(#pageGrad)" />
    <!-- Right Page -->
    <path d="M85 35 Q 45 20 45 45 L 45 75 Q 45 60 85 65 Z" fill="url(#pageGrad)" />
    <!-- Book Spine -->
    <path d="M45 20 L45 75" stroke="#cbd5e1" stroke-width="4" />

    <!-- Abstract Text Lines indicating text / article (课文) -->
    <!-- Left Page Lines -->
    <line x1="12" y1="35" x2="35" y2="33" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="13" y1="43" x2="38" y2="41" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="51" x2="32" y2="49" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="14" y1="59" x2="36" y2="57" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Page Lines -->
    <line x1="55" y1="33" x2="78" y2="35" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="53" y1="41" x2="77" y2="43" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="56" y1="49" x2="75" y2="51" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="54" y1="57" x2="76" y2="59" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Sound waves / Voice vibration radiating from the active reading action -->
    <path d="M-8 25 Q-15 35 -8 45" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M-13 20 Q-23 35 -13 50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- CHARACTER: "他" (HE - Male Student actively reading out loud) -->
  <g transform="translate(85, 80)">
    <!-- Body / Hoodie Shoulders -->
    <path d="M25 85 C25 65 40 55 55 55 C70 55 85 65 85 85 L95 105 L15 105 Z" fill="url(#hoodieGrad)" />
    <path d="M55 55 L55 75" stroke="#0284c7" stroke-width="3" />
    <!-- Hoodie Strings -->
    <path d="M48 68 Q52 78 48 85" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
    <path d="M62 68 Q58 78 62 85" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="47" y="44" width="16" height="15" rx="5" fill="url(#skinGrad)" />

    <!-- Head -->
    <circle cx="55" cy="32" r="22" fill="url(#skinGrad)" />

    <!-- Hair (Styled Modern Dark Hair) -->
    <path d="M33 32 C33 16 45 12 55 12 C67 12 77 18 77 32 C77 38 75 32 72 26 C67 18 58 17 50 19 C40 21 35 28 33 32 Z" fill="#1e293b" />
    <path d="M34 29 Q42 21 54 22 Q66 23 74 30" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" />

    <!-- Expressive Facial Features - Focus & Active Recitation -->
    <!-- Eyebrows (Slightly angled in deep focus) -->
    <path d="M40 26 Q46 23 50 26" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M60 26 Q64 23 70 26" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Closed / Focused Eyes (Happy reading expression) -->
    <path d="M42 32 Q46 36 50 32" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M60 32 Q64 36 68 32" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="43" cy="37" r="4" fill="#f43f5e" opacity="0.3" />
    <circle cx="67" cy="37" r="4" fill="#f43f5e" opacity="0.3" />

    <!-- Open Mouth actively "Nian" (Reading / Reciting aloud) -->
    <path d="M51 40 Q55 46 59 40 Z" fill="#991b1b" />
    <path d="M51 40 Q55 43 59 40" fill="none" stroke="#7f1d1d" stroke-width="1.5" />

    <!-- Glasses (Smart student vibe) -->
    <rect x="38" y="27" width="13" height="10" rx="3" fill="none" stroke="#475569" stroke-width="2" />
    <rect x="59" y="27" width="13" height="10" rx="3" fill="none" stroke="#475569" stroke-width="2" />
    <line x1="51" y1="31" x2="59" y2="31" stroke="#475569" stroke-width="2" />

    <!-- HANDS RESTING / GESTURING ON DESK -->
    <!-- Left Hand holding book edge -->
    <path d="M18 75 C10 80 5 90 8 98 C11 103 20 102 25 95 C28 90 25 82 22 78 Z" fill="url(#skinGrad)" />
    <!-- Right Hand gesturing / pointing slightly while reading -->
    <path d="M85 85 C92 90 95 100 90 106 C85 110 78 105 76 98 C74 92 78 88 82 86 Z" fill="url(#skinGrad)" />
  </g>

  <!-- SPEECH / VOICE EMISSION BUBBLE (Subtle graphic element emphasizing reading aloud action) -->
  <g transform="translate(135, 60)" opacity="0.85">
    <path d="M0 15 C0 5 10 0 25 0 C40 0 50 5 50 15 C50 25 40 30 25 30 C20 30 15 32 10 36 L12 28 C4 26 0 22 0 15 Z" fill="#ffffff" />
    <!-- Sound Waves inside bubble -->
    <path d="M18 10 L18 20" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M25 7 L25 23" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M32 11 L32 19" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Warm Rim Light on Character Top Edge -->
  <path d="M112 85 C118 75 130 73 140 78" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4" />

  <!-- Foreground Atmospheric Particles (Dust motes in desk light) -->
  <circle cx="65" cy="120" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="105" cy="100" r="1" fill="#fbbf24" opacity="0.8" />
  <circle cx="140" cy="130" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="50" cy="140" r="1.2" fill="#38bdf8" opacity="0.6" />
</svg>