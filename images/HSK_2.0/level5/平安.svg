<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Glow for Lantern/Lights -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Window Warm Light -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Window Frame -->
    <linearGradient id="woodFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Stars/Night Sky Backdrop inside Window / Top area -->
  <g opacity="0.6">
    <circle cx="25" cy="35" r="1" fill="#fff" />
    <circle cx="55" cy="20" r="1.5" fill="#fff" />
    <circle cx="85" cy="45" r="1" fill="#fed7aa" />
    <circle cx="215" cy="25" r="1.5" fill="#fff" />
    <circle cx="195" cy="55" r="1" fill="#fff" />
  </g>

  <!-- Soft Ambient Glow behind the characters -->
  <circle cx="120" cy="110" r="80" fill="url(#lanternGlow)" />

  <!-- Background Environment: Cozy Traditional/Modern Hybrid Home Interior -->
  <!-- Wall base -->
  <rect x="15" y="60" width="210" height="130" rx="8" fill="#1e1b4b" opacity="0.4" />
  
  <!-- Window showing night/evening exterior -->
  <path d="M 85,40 L 155,40 L 155,120 L 85,120 Z" fill="url(#windowGlow)" opacity="0.9" />
  <!-- Window Panes (Cross) -->
  <rect x="118" y="40" width="4" height="80" fill="url(#woodFrame)" />
  <rect x="85" y="78" width="70" height="4" fill="url(#woodFrame)" />
  <!-- Window Outer Frame -->
  <rect x="81" y="36" width="78" height="88" rx="2" fill="none" stroke="url(#woodFrame)" stroke-width="6" />

  <!-- Indoor Shelf / Props -->
  <rect x="25" y="80" width="45" height="6" rx="2" fill="#334155" />
  <!-- Plant on shelf -->
  <path d="M 38,80 Q 40,70 45,65 Q 50,70 52,80 Z" fill="#10b981" />
  <path d="M 45,80 L 45,73" stroke="#059669" stroke-width="1.5" />
  <!-- Pot -->
  <path d="M 40,80 L 50,80 L 48,87 L 42,87 Z" fill="#cbd5e1" />

  <!-- Hanging Decorative Lantern (Symbol of peace/well-wishing) -->
  <line x1="195" y1="20" x2="195" y2="45" stroke="#94a3b8" stroke-width="1.5" />
  <ellipse cx="195" cy="45" rx="12" ry="16" fill="#f43f5e" />
  <ellipse cx="195" cy="45" rx="12" ry="16" fill="url(#lanternGlow)" />
  <path d="M 189,32 L 201,32 M 189,58 L 201,58" stroke="#fbbf24" stroke-width="2" />
  <line x1="195" y1="61" x2="195" y2="70" stroke="#fbbf24" stroke-width="1" />

  <!-- Foreground Floor -->
  <rect x="0" y="190" width="240" height="50" fill="#0f172a" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- Houseplant large in foreground corner -->
  <path d="M 15,200 Q 18,170 30,150 Q 25,180 15,200 Z" fill="#059669" />
  <path d="M 22,200 Q 35,165 48,155 Q 38,180 25,200 Z" fill="#10b981" />
  <path d="M 10,210 L 35,210 L 30,190 L 15,190 Z" fill="#64748b" />

  <!-- CHARACTER 1 (Left - Well-wisher, leaning forward warmly) -->
  <g id="character-sender">
    <!-- Body / Torso -->
    <path d="M 65,190 L 60,145 Q 75,135 90,145 L 85,190 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="75" cy="120" r="16" fill="#fbcfe8" />
    <!-- Hair (Styled neat dark hair) -->
    <path d="M 60,118 Q 70,100 90,115 Q 85,108 75,105 Q 65,105 60,118 Z" fill="#1e293b" />
    <!-- Face features: Warm smiling eyes & gentle smile -->
    <path d="M 69,118 Q 72,121 75,118" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 79,118 Q 82,121 85,118" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 75,124 Q 77,127 79,124" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Cheeks (Warm greeting blush) -->
    <circle cx="71" cy="122" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="83" cy="122" r="3" fill="#f43f5e" opacity="0.4" />

    <!-- Arm gesturing warmly toward the other person -->
    <path d="M 80,145 Q 98,140 110,145" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="112" cy="146" r="4.5" fill="#fbcfe8" />
  </g>

  <!-- CHARACTER 2 (Right - Recipient, touched by the gesture, holding a warm mug) -->
  <g id="character-receiver">
    <!-- Body / Torso -->
    <path d="M 155,190 L 160,145 Q 145,135 130,145 L 135,190 Z" fill="#fb923c" />
    <!-- Head -->
    <circle cx="145" cy="120" r="16" fill="#fbcfe8" />
    <!-- Hair (Soft bun/bob) -->
    <path d="M 130,115 Q 145,100 160,115 Q 155,105 145,103 Q 135,105 130,115 Z" fill="#451a03" />
    <circle cx="152" cy="105" r="5" fill="#451a03" />
    <!-- Face features: Happy relaxed eyes & soft smile -->
    <path d="M 139,118 Q 142,121 145,118" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 149,118 Q 152,121 155,118" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 144,124 Q 146,127 148,124" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Cheeks -->
    <circle cx="141" cy="122" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="153" cy="122" r="3" fill="#f43f5e" opacity="0.4" />

    <!-- Arms holding a warm tea mug together -->
    <path d="M 135,145 Q 128,153 133,158" stroke="#fb923c" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 155,145 Q 160,153 138,158" stroke="#fb923c" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Mug -->
    <rect x="133" y="152" width="12" height="14" rx="2" fill="#f8fafc" />
    <path d="M 145,155 Q 149,155 149,159 Q 149,163 145,163" stroke="#f8fafc" stroke-width="2" fill="none" />
    <!-- Steam from Mug -->
    <path d="M 136,148 Q 138,144 136,140" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 142,149 Q 140,143 143,138" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- Central Interaction Elements (Heart-warming gesture accent without words) -->
  <g id="sparkles-and-connection" opacity="0.9">
    <!-- Subtle floating warmth icons / sparkles between characters -->
    <path d="M 120,110 Q 123,103 126,110 Q 133,113 126,116 Q 123,123 120,116 Q 113,113 120,110 Z" fill="#fbbf24" opacity="0.8" />
    <circle cx="103" cy="95" r="2" fill="#fef08a" />
    <circle cx="138" cy="90" r="1.5" fill="#fef08a" />
    <circle cx="115" cy="85" r="2.5" fill="#fef08a" />
  </g>

  <!-- Wooden Table Surface between them -->
  <path d="M 95,190 L 145,190 L 155,175 L 85,175 Z" fill="#92400e" opacity="0.8" />
  <path d="M 90,175 L 150,175 L 155,173 L 85,173 Z" fill="#b45309" />
</svg>