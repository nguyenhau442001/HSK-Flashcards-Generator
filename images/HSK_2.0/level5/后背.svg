<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Background Glow -->
  <circle cx="120" cy="130" r="80" fill="url(#glowGrad)"/>

  <!-- Room Environment Props -->
  <!-- Yoga mat on floor -->
  <path d="M40 185 L200 185 C205 185, 208 190, 203 195 L37 195 C32 195, 35 185, 40 185 Z" fill="#334155"/>
  <path d="M42 187 L198 187 C201 187, 203 191, 198 193 L42 193 C37 193, 39 187, 42 187 Z" fill="#64748b"/>

  <!-- Foam roller (accessory prop) -->
  <rect x="75" y="172" width="28" height="14" rx="7" fill="#fb923c"/>
  <rect x="78" y="174" width="22" height="10" rx="5" fill="#f97316"/>

  <!-- Main Subject: Person stretching / holding their back (focus on 后背 - back) -->
  <!-- Head & Hair -->
  <circle cx="120" cy="65" r="18" fill="#cbd5e1"/>
  <path d="M103 62 C103 45, 137 45, 137 62 C137 65, 135 68, 135 68 L105 68 C105 68, 103 65, 103 62 Z" fill="#334155"/>

  <!-- Torso & Back (The core focus of the illustration) -->
  <!-- Shoulders and Back curve -->
  <path d="M 90 90 
           C 85 90, 80 100, 85 110 
           C 90 125, 95 150, 100 175 
           L 140 175 
           C 145 150, 150 125, 155 110 
           C 160 100, 155 90, 150 90 
           Z" fill="url(#shirtGrad)"/>

  <!-- Spine / Back muscle definition lines (emphasizing the 'hòubèi' area) -->
  <path d="M 120 95 L 120 165" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 110 105 C 115 115, 115 135, 112 150" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 130 105 C 125 115, 125 135, 128 150" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Arms reaching back in a stretch -->
  <path d="M 90 95 C 75 110, 70 125, 80 135" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
  <path d="M 150 95 C 165 110, 170 125, 160 135" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>

  <!-- Hands placed on the lower back indicating stiffness/pain point -->
  <circle cx="80" cy="135" r="6" fill="#e2e8f0"/>
  <circle cx="160" cy="135" r="6" fill="#e2e8f0"/>

  <!-- Pain / Tension Indicators (Warm glowing pulses on the back) -->
  <path d="M 112 118 Q 120 112 128 118" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 115 125 Q 120 121 125 125" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Subtle sparkling discomfort indicators -->
  <g fill="#f59e0b">
    <circle cx="103" cy="115" r="2"/>
    <circle cx="137" cy="115" r="2"/>
    <path d="M 120 102 L 121 106 L 125 107 L 121 108 L 120 112 L 119 108 L 115 107 L 119 106 Z" transform="scale(0.5) translate(120, 180)"/>
  </g>

  <!-- Foreground Atmospheric Elements -->
  <circle cx="185" cy="75" r="3" fill="#38bdf8" opacity="0.3"/>
  <circle cx="55" cy="95" r="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="70" cy="50" r="4" fill="#fbbf24" opacity="0.2"/>
</svg>