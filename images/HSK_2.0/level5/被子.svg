<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Glow Gradient -->
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Warm Lamp Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Duvet / Quilt Main Gradient (Warm Amber/Coral & Teal Cozy Theme) -->
    <linearGradient id="duvetGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Blanket Secondary Accent Gradient -->
    <linearGradient id="duvetAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Pillow Gradient -->
    <linearGradient id="pillowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Wooden Bedframe Gradient -->
    <linearGradient id="woodBed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- BACKGROUND ENVIRONMENT -->
  <!-- Night Window with Moon -->
  <path d="M 170 30 L 210 30 L 210 90 L 170 90 Z" fill="#334155" rx="4"/>
  <path d="M 173 33 L 207 33 L 207 87 L 173 87 Z" fill="url(#moonGlow)"/>
  <!-- Cute Crescent Moon outside -->
  <circle cx="195" cy="55" r="10" fill="#fef08a" opacity="0.9"/>
  <circle cx="199" cy="52" r="8" fill="#334155"/>
  <!-- Stars -->
  <circle cx="180" cy="40" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="75" r="1" fill="#fef08a" opacity="0.8"/>

  <!-- Wallpaper accent lines / Room details -->
  <line x1="0" y1="110" x2="240" y2="110" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Nightstand & Lamp -->
  <rect x="15" y="105" width="45" height="55" rx="4" fill="#334155"/>
  <rect x="20" y="115" width="35" height="4" rx="2" fill="#475569"/>
  <!-- Lamp Base -->
  <path d="M 32 105 L 38 105 L 36 95 L 34 95 Z" fill="#cbd5e1"/>
  <!-- Lamp Shade -->
  <path d="M 25 95 L 45 95 L 50 80 L 20 80 Z" fill="#fbbf24"/>
  <!-- Lamp Glow Area -->
  <circle cx="35" cy="95" r="50" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- THE BED & DUVET (被子 - MAIN FOCUS) -->
  <!-- Bed Frame Back / Headboard -->
  <rect x="15" y="125" width="210" height="75" rx="8" fill="url(#woodBed)" filter="url(#softShadow)"/>
  <rect x="25" y="133" width="190" height="40" rx="4" fill="#431407" opacity="0.3"/>

  <!-- Mattress -->
  <rect x="20" y="145" width="200" height="75" rx="10" fill="#f1f5f9"/>

  <!-- Pillow under the sleeper -->
  <rect x="40" y="148" width="60" height="30" rx="8" fill="url(#pillowGrad)"/>
  
  <!-- Sleeping Character (Cozy & Snug) -->
  <!-- Head sticking out slightly, sleeping peacefully -->
  <circle cx="65" cy="160" r="16" fill="#fed7aa"/>
  <!-- Closed Happy Eyes / Sleeping expression -->
  <path d="M 59 158 Q 61 161 63 158" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 67 158 Q 69 161 71 158" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="60" cy="163" r="3" fill="#f43f5e" opacity="0.4"/> <!-- Rosy cheek -->
  <!-- Hair -->
  <path d="M 49 155 Q 55 143 70 147 Q 81 149 81 160 L 78 153 Q 65 146 52 153 Z" fill="#334155"/>

  <!-- MAIN SUBJECT: THE HEAVY DUVET / CHĂN (被子) -->
  <!-- Curving, fluffy blanket covering the body snugly -->
  <g filter="url(#softShadow)">
    <!-- Main Duvet Body -->
    <path d="M 35 165 C 35 165 55 155 85 170 C 115 185 150 170 205 185 C 215 188 220 200 215 210 C 210 220 195 225 180 225 L 45 225 C 30 225 25 210 30 195 Z" fill="url(#duvetGrad)"/>
    
    <!-- Cozy Quilt Stitching / Pattern Waves (Adds tactile depth & dimension) -->
    <!-- Stitch line 1 -->
    <path d="M 55 180 Q 95 195 135 185 Q 175 175 205 195" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6"/>
    <!-- Stitch line 2 -->
    <path d="M 45 200 Q 95 215 145 205 Q 185 195 210 215" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6"/>

    <!-- Stylish Accent Border (Folded top edge of the chăn) -->
    <path d="M 78 167 C 105 180 145 170 195 182 C 205 185 210 192 205 197 C 200 202 190 197 185 195 C 140 183 105 192 80 178 Z" fill="url(#duvetAccent)"/>
  </g>

  <!-- Fluffy folds / folds at the bottom of the bed -->
  <path d="M 25 210 C 60 225 120 225 215 210" stroke="#c2410c" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- ZZZs for sleeping atmosphere -->
  <g fill="#38bdf8" opacity="0.8">
    <text x="85" y="135" font-family="sans-serif" font-weight="bold" font-size="14">z</text>
    <text x="95" y="123" font-family="sans-serif" font-weight="bold" font-size="12">Z</text>
    <text x="106" y="110" font-family="sans-serif" font-weight="bold" font-size="10">z</text>
  </g>

  <!-- Foreground Floor / Rug touch -->
  <ellipse cx="120" cy="230" rx="90" ry="6" fill="#0f172a" opacity="0.4"/>
</svg>