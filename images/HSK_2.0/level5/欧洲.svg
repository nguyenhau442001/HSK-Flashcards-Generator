<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sky Gradient (Sunset/Twilight in Europe) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2d54"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Dome Roof Gradient -->
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Scene Window / Framing (European Landmark & Travel Vibe) -->
  <g clip-path="url(#windowClip)">
    <clipPath id="windowClip">
      <rect x="20" y="20" width="200" height="155" rx="16" />
    </clipPath>
    
    <!-- Sky Background -->
    <rect x="20" y="20" width="200" height="155" fill="url(#skyGrad)"/>

    <!-- Distant European Architecture Silhouette (Paris/Rome/Prague skyline blend) -->
    <path d="M20 155 L20 120 L35 120 L35 105 L40 100 L45 105 L45 120 L60 120 L65 90 L75 85 L85 90 L90 120 L115 120 L120 70 L130 60 L140 70 L145 120 L170 120 L175 100 L185 95 L195 100 L200 120 L220 120 L220 155 Z" fill="#1e1b4b" opacity="0.8"/>

    <!-- Iconic Dome (e.g., European Cathedral) -->
    <path d="M110 95 Q120 60 130 95 Z" fill="url(#domeGrad)"/>
    <rect x="117" y="52" width="6" height="12" fill="#38bdf8"/>
    <circle cx="120" cy="50" r="3" fill="#fbbf24"/>

    <!-- Stylized Clouds -->
    <path d="M40 55 Q50 45 65 55 Q80 45 95 55 Q100 65 85 70 L50 70 Q35 65 40 55 Z" fill="url(#cloudGrad)"/>
    <path d="M150 40 Q160 30 175 40 Q190 30 205 40 Q210 50 195 55 L160 55 Q145 50 150 40 Z" fill="url(#cloudGrad)"/>

    <!-- Floating Travel Elements (Plane & Route Arc) -->
    <path d="M40 110 Q90 60 150 75" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <!-- Cute Vector Airplane -->
    <g transform="translate(135, 73) rotate(-15)">
      <path d="M-8 -2 L8 0 L-2 4 Z" fill="#ffffff"/>
      <path d="M-2 -6 L2 0 L-4 0 Z" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- Window Frame Border -->
  <rect x="20" y="20" width="200" height="155" rx="16" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Foreground / Travel Desk / Foreground Context -->
  <path d="M0 195 C60 185 180 185 240 195 L240 240 L0 240 Z" fill="#0f172a"/>
  <rect x="0" y="190" width="240" height="6" fill="#334155"/>

  <!-- Travel Props on Desk / Foreground -->
  <!-- Passport & Vintage Stamps -->
  <g transform="translate(30, 200) rotate(-8)">
    <rect width="32" height="42" rx="4" fill="#1e3a8a"/>
    <rect x="4" y="6" width="24" height="30" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="16" cy="21" r="6" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Camera -->
  <g transform="translate(170, 196)">
    <rect x="4" y="8" width="34" height="24" rx="5" fill="#475569"/>
    <rect x="12" y="4" width="18" height="6" rx="2" fill="#334155"/>
    <circle cx="21" cy="20" r="8" fill="#1e293b"/>
    <circle cx="21" cy="20" r="5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="31" cy="13" r="2" fill="#fbbf24"/>
  </g>

  <!-- Coffee Cup / Traveler's Mug -->
  <g transform="translate(75, 202)">
    <path d="M4 6 L18 6 L16 30 L6 30 Z" fill="#f8fafc"/>
    <path d="M18 10 C24 10 24 22 18 24" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="11" cy="6" rx="7" ry="2" fill="#38bdf8"/>
  </g>

  <!-- Main Character (Happy Traveler ready/arrived in Europe) -->
  <g transform="translate(100, 135)">
    <!-- Body & Bright Red Jacket -->
    <path d="M-22 55 C-22 35 -12 25 0 25 C12 25 22 35 22 55 L25 75 L-25 75 Z" fill="url(#jacketGrad)"/>
    
    <!-- Scarf (Windswept European Vibe) -->
    <path d="M-14 30 C-5 28 5 32 12 36 L15 50 C5 44 -5 42 -12 45 Z" fill="#38bdf8"/>
    <path d="M8 35 C15 45 25 60 30 75 L20 75 C16 62 10 48 5 40 Z" fill="#0284c7"/>

    <!-- Backpack Straps -->
    <path d="M-10 27 L-18 65" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 27 L18 65" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

    <!-- Head & Face -->
    <circle cx="0" cy="5" r="15" fill="#ffedd5"/>
    
    <!-- Cheerful Expression & Eyes -->
    <path d="M-6 2 Q-3 0 0 2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M3 2 Q6 0 9 2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 6 Q2 9 4 6" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-5" cy="8" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="7" cy="8" r="3" fill="#fda4af" opacity="0.6"/>

    <!-- Stylish Hair -->
    <path d="M-15 3 C-14 -8 -2 -11 8 -7 C14 -5 16 0 16 3 C12 -1 4 -3 -3 0 C-10 2 -13 1 -15 3 Z" fill="#1e293b"/>

    <!-- Travel Hat (Beret for European flair) -->
    <path d="M-16 -5 C-10 -14 10 -14 18 -5 C12 -2 -4 -2 -16 -5 Z" fill="#475569"/>
    <ellipse cx="4" cy="-9" rx="12" ry="4" fill="#334155"/>
  </g>

  <!-- Atmospheric Lighting Glows -->
  <circle cx="120" cy="80" r="70" fill="#fbbf24" opacity="0.05" filter="url(#glow)"/>
</svg>