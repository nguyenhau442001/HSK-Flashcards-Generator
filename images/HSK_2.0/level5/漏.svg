<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wood Beam Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Water Splash Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Lightning / Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip Path for Interior Scene -->
    <clipPath id="roomClip">
      <rect x="20" y="20" width="200" height="200" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <g clip-path="url(#roomClip)">
    <!-- Room Interior Walls -->
    <rect x="20" y="20" width="200" height="170" fill="#1e293b"/>
    <rect x="20" y="190" width="200" height="30" fill="#0f172a"/>

    <!-- Wallpaper Accent Lines (Interior Depth) -->
    <line x1="20" y1="50" x2="220" y2="50" stroke="#334155" stroke-width="2" stroke-dasharray="8 4"/>

    <!-- Slanted Roof Interior (Upper Left & Right) -->
    <path d="M 20 20 L 120 100 L 220 20 Z" fill="url(#roofGrad)" stroke="#475569" stroke-width="3"/>

    <!-- Wooden Roof Beams -->
    <polygon points="115,95 125,95 130,105 110,105" fill="url(#woodGrad)"/>
    <rect x="60" y="55" width="12" height="40" rx="3" transform="rotate(35 60 55)" fill="url(#woodGrad)"/>
    <rect x="155" y="70" width="12" height="40" rx="3" transform="rotate(-35 155 70)" fill="url(#woodGrad)"/>

    <!-- Lightning Flash in the Sky (visible through a tiny attic gap) -->
    <path d="M 115 35 L 122 35 L 118 45 L 125 45 L 113 60 L 117 48 L 110 48 Z" fill="#fde047" filter="url(#glow)" opacity="0.9"/>

    <!-- THE LEAK / HOLE IN THE ROOF -->
    <!-- Damaged roof tiles area -->
    <path d="M 116 55 L 124 55 L 122 72 L 118 72 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <!-- Cracks radiating -->
    <path d="M 120 62 L 112 50 M 120 62 L 130 52 M 120 62 L 121 75" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- FALLING RAINDROPS (Dynamic Streaks) -->
    <line x1="120" y1="75" x2="119" y2="88" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="120" y1="95" x2="119" y2="112" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="120" y1="120" x2="119" y2="142" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- SPLASH ON THE FLOOR / BUCKET -->
    <!-- Wooden Stool / Floor Platform -->
    <rect x="90" y="175" width="60" height="8" rx="3" fill="#b45309"/>
    <rect x="98" y="183" width="6" height="15" fill="#78350f"/>
    <rect x="136" y="183" width="6" height="15" fill="#78350f"/>

    <!-- Red Bucket to catch the leak -->
    <path d="M 98 135 L 102 175 L 138 175 L 142 135 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <!-- Bucket Rim -->
    <ellipse cx="120" cy="135" rx="22" ry="5" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <!-- Bucket Handle -->
    <path d="M 100 133 C 95 110, 145 110, 140 133" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Water inside bucket -->
    <ellipse cx="120" cy="143" rx="19" ry="4" fill="#38bdf8"/>

    <!-- Water Drip Impact & Splashes inside bucket -->
    <circle cx="120" cy="144" r="3" fill="#ffffff" opacity="0.7"/>
    <path d="M 112 143 C 114 138, 126 138, 128 143" fill="none" stroke="#bae6fd" stroke-width="1.5"/>
    <path d="M 115 137 Q 120 130 123 137" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Stray Droplets splashing outward -->
    <circle cx="106" cy="132" r="1.5" fill="#38bdf8"/>
    <circle cx="133" cy="130" r="2" fill="#38bdf8"/>
    <path d="M 104 130 Q 106 126 108 131" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Cozy Interior Props for Context -->
    <!-- Warm glowing desk lamp on the left -->
    <path d="M 35 190 L 45 155 L 55 190 Z" fill="#475569"/>
    <path d="M 40 155 C 30 140, 50 140, 45 155 Z" fill="#fbbf24"/>
    <ellipse cx="40" cy="188" rx="15" ry="3" fill="#334155"/>
    <!-- Lamp Light Cone -->
    <polygon points="40,158 10,195 85,195" fill="#fbbf24" opacity="0.12" style="mix-blend-mode: screen;"/>

    <!-- Stack of Books -->
    <rect x="30" y="185" width="26" height="5" rx="1" fill="#ec4899"/>
    <rect x="28" y="190" width="30" height="6" rx="1" fill="#3b82f6"/>
    <rect x="32" y="196" width="24" height="4" rx="1" fill="#10b981"/>

    <!-- Potted Plant on the right -->
    <path d="M 185 175 L 190 198 L 210 198 L 215 175 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="200" cy="175" rx="15" ry="4" fill="#f1f5f9"/>
    <!-- Plant leaves -->
    <path d="M 200 175 C 190 160, 180 165, 185 150 C 195 155, 200 175, 200 175 Z" fill="#10b981"/>
    <path d="M 200 175 C 210 155, 225 150, 220 165 C 210 170, 200 175, 200 175 Z" fill="#059669"/>
    <path d="M 200 175 C 200 150, 205 145, 202 160 C 200 165, 200 175, 200 175 Z" fill="#34d399"/>

    <!-- Ambient Glow / Atmospheric Effects -->
    <!-- Rain mist near the leak -->
    <ellipse cx="120" cy="110" rx="15" ry="8" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>

    <!-- Picture Frame on Wall -->
    <rect x="165" y="60" width="25" height="32" rx="2" fill="#78350f" stroke="#92400e" stroke-width="1"/>
    <rect x="168" y="63" width="19" height="26" fill="#60a5fa"/>
    <circle cx="177" cy="73" r="4" fill="#fde047"/>
    <path d="M 168 83 L 175 75 L 180 79 L 187 71 L 187 89 L 168 89 Z" fill="#34d399"/>

    <!-- Subtle Vignette Frame -->
    <rect x="20" y="20" width="200" height="200" rx="24" fill="none" stroke="#0f172a" stroke-width="6" opacity="0.6"/>
  </g>
</svg>